<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 7 · Ресурсные решения клетки — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

</style>
</head>

<noscript><style>.wrap{display:none}</style><div class="noscript">Откройте этот файл в браузере на компьютере (Chrome, Edge, Firefox или Safari). В режиме предпросмотра демонстрации не работают.</div></noscript>
<div class="wrap">
  <p class="affil" data-t="affil"></p>
  <header>

  <div class="bar" role="tablist" id="tabs"></div>

<dialog id="legendDlg">
  <h3 style="margin:0 0 12px" data-t="legend_t"></h3>
  <div class="lg">
    <svg viewBox="0 0 64 30"><circle cx="32" cy="15" r="12" class="node on"/></svg><span data-t="lg_on"></span>
    <svg viewBox="0 0 64 30"><circle cx="32" cy="15" r="12" class="node off"/></svg><span data-t="lg_off"></span>
    <svg viewBox="0 0 64 30"><g class="pb"><circle cx="32" cy="15" r="9"/><text x="32" y="15.5">P</text></g></svg><span data-t="lg_p"></span>
    <svg viewBox="0 0 64 30"><rect x="14" y="5" width="36" height="20" rx="6" class="box" style="stroke-dasharray:4 3;opacity:.55"/><g class="cross"><line x1="18" y1="7" x2="46" y2="23"/><line x1="46" y1="7" x2="18" y2="23"/></g></svg><span data-t="lg_missing"></span>
    <svg viewBox="0 0 64 30"><defs><marker id="lgA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker></defs><path d="M6 15 L56 15" class="edge" marker-end="url(#lgA)"/></svg><span data-t="lg_act"></span>
    <svg viewBox="0 0 64 30"><defs><marker id="lgB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="9" orient="auto"><path d="M4 0 L6 0 L6 10 L4 10 z" class="mk"/></marker></defs><path d="M6 15 L56 15" class="edge" marker-end="url(#lgB)"/></svg><span data-t="lg_inh"></span>
    <svg viewBox="0 0 64 30"><path d="M6 15 L56 15" class="edge" style="opacity:.18"/></svg><span data-t="lg_idle"></span>
    <svg viewBox="0 0 64 30"><rect x="18" y="5" width="28" height="20" rx="6" class="box clickable"/></svg><span data-t="lg_click"></span>
  </div>
  <div class="btns" style="margin-top:16px"><button class="btn" id="legendClose" data-t="close"></button></div>

<script>
const TEXTS = {"affil": "Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры", "page_title": "Семинар 7 · Ресурсные решения клетки", "doc_title": "Семинар 7 · Ресурсные решения клетки — Кафедра биологии и генетики, Медицинский университет Петровского", "wm": "© Кафедра биологии и генетики, Медицинский университет Петровского · курс «Молекулярная биология»", "footer": "© 2026 Кафедра биологии и генетики, Медицинский университет Петровского. Учебные материалы курса «Молекулярная биология» (5–6 семестры). При использовании ссылка на кафедру обязательна.", "version": "Версия 2.6, 6 октября 2026 г.", "captions": "Подписи", "legend_btn": "Условные обозначения", "fullscreen": "На весь экран", "lvl_b": "Базовый", "lvl_a": "Продвинутый", "poe_btn": "Сценарий: предскажи и проверь", "tab1": "mTORC1 на лизосоме", "tab2": "AMPK и энергия", "tab3": "Синтез или окисление ЖК", "tab4": "Аутофагия и повторная активация mTORC1", "q1": "Вопрос 1. Лизосомная активация mTORC1 при совпадении аминокислотного и ростового сигналов", "q2": "Вопрос 2. AMPK как сенсор аденилатного энергетического заряда и переключатель клеточного бюджета", "q3": "Вопрос 3. Переключение между синтезом и β-окислением жирных кислот через ACC, малонил-CoA и CPT1", "q4": "Вопрос 4. Согласование аутофагии, лизосомного гидролиза и повторной активации mTORC1", "why": "Функциональное значение", "take": "Вывод", "info_t": "Справка", "close": "Закрыть", "lbl_cytosol": "цитоплазма", "lbl_nucleus": "ядро", "lbl_lysosome": "лизосома", "pill_p": "фосфорилирован", "pill_np": "не фосфорилирован", "pill_cyto": "в цитоплазме", "pill_nuc": "в ядре", "pill_on": "задействован", "pill_off": "не задействован", "r_mtorc1": "активность mTORC1", "s1b_r_mtorc1": "mTORC1 → S6K, 4E-BP1, ULK1", "blot_empty": "Дорожек пока нет. Выставьте условия и нажмите «Записать дорожку».", "blot_clr": "Очистить", "b_actin": "актин", "noscript": "Откройте этот файл в браузере на компьютере (Chrome, Edge, Firefox или Safari). В режиме предпросмотра демонстрации не работают.", "poe_step": "Шаг {i} из {n}", "poe_ans": "Почему:", "poe_show": "Показать на схеме", "poe_pick_first": "Сначала выберите ответ", "poe_your": "Почему ваш ответ неверен:", "poe_score": "Верно с первого раза: {c} из {n}.", "poe_prev": "← Назад", "poe_next": "Дальше →", "poe_end": "Сценарий закончен", "poe_exit": "Выйти", "legend_t": "Условные обозначения", "lg_on": "жёлтый — белок активен", "lg_off": "серый — неактивен", "lg_p": "белок фосфорилирован", "lg_missing": "белок отсутствует или ингибирован", "lg_act": "активирует", "lg_inh": "тормозит", "lg_idle": "бледная линия — связь сейчас не задействована", "lg_click": "щёлкните по белку — появится справка", "teacher_t": "Для преподавателя: проведение занятия, упрощения модели и источники", "src_t_st": "Источники", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 минут, на продвинутый — 8–10 минут. В режиме «Сценарий» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку.", "teacher_2": "Все величины условны: они изменяются от 0 до 1 или выражены в долях исходного значения в покое. Модели передают направление изменений и порядок событий, а не реальные концентрации. Временная последовательность в вопросе 4 основана на опытах Yu 2010 с клетками NRK в среде без сыворотки и глутамина: активность mTORC1 подавлена к 2 ч и восстановлена к 6 ч, аутофагия максимальна к 4 ч, лизосомы восстановлены к 12 ч. Зависимая от аутофагии повторная активация mTORC1 при дефиците аминокислот показана позднее (Tan 2017; Kazyken 2024). В вопросе 1 RHEB для упрощения изображён на лизосоме. Согласно Angarola 2019, его связь с мембранами слабая, а взаимодействие с mTORC1 у лизосомы кратковременное. При отсутствии аминокислот Rag-ГТФазы возвращают TSC2 на лизосому (Demetriades 2014), поэтому одного инсулинового сигнала недостаточно для полного перевода RHEB в GTP-форму. В вопросе 4 образец с бафиломицином моделируется как вторая чашка, состояние которой копируется из контрольной за 2 ч до измерения. В ней лизосомное расщепление блокировано; оба образца измеряют одновременно. В модели вопроса 4 различаются два эффекта mTORC1: чувствительный к рапамицину (S6K и восстановление лизосом) и во многом устойчивый к нему (ULK1 S758 и подавление аутофагии). Регуляция TFEB в этой модели связана с аминокислотным сигналом через Rag и FLCN, а не с RHEB. Путь AMPK → FNIP1 → TFEB показан в вопросах 1 и 2. Увеличение LC3-II в присутствии бафиломицина отражает не только материал, который не был расщеплён: за 2 ч аминокислоты в этом образце не освобождаются, активность mTORC1 не восстанавливается, а новые аутофагосомы продолжают образовываться. Поэтому время воздействия бафиломицина ограничивают (Klionsky 2021).", "teacher_3": "Уточнения к распространённым схемам. Согласно классической схеме, AMPK стимулирует аутофагию через ULK1 (Kim 2011; Egan 2011). В более новых работах при дефиците глюкозы и нарушении функции митохондрий AMPK сдерживает инициацию аутофагии (Park 2023). При длительном дефиците аминокислот она также сдерживает аутофагию и поддерживает повторную активацию mTORC1 (Kazyken 2024). Эффект зависит от вида стресса, длительности воздействия и типа клеток. Фосфорилирование TFEB комплексом mTORC1 зависит от Rag и FLCN и почти не зависит от RHEB (Napolitano 2020). Оно во многом устойчиво к острому действию рапамицина (Settembre 2012; Roczniak-Ferguson 2012). При длительной утрате TSC2, напротив, TFEB локализуется в ядре (Alesi 2021). SLC38A9 воспринимает аргинин в просвете лизосомы и переносит из неё лейцин. Малонил-CoA ингибирует CPT1; через внутреннюю мембрану митохондрии ацильная группа переносится в составе ацилкарнитина при участии CACT. AMPK подавляет mTORC1 через усиление действия TSC2 (Inoki 2003) и фосфорилирование Raptor (Gwinn 2008). В модели чувствительность CPT1A печени и CPT1B мышцы к малонил-CoA принята одинаковой, хотя CPT1B более чувствительна.", "s1_aa": "Аминокислоты", "s1_ins": "Инсулин", "s1_insulin": "инсулин", "s1_o_s6k": "синтез белка", "s1_o_ebp": "трансляция", "s1_o_ulk": "аутофагия", "s1_r_s6k": "в фосфорилированной форме стимулирует синтез белка и образование рибосом", "s1_r_ebp": "в нефосфорилированной форме связывает eIF4E и подавляет трансляцию", "s1_r_ulk": "после фосфорилирования комплексом mTORC1 неактивна; в нефосфорилированной форме может инициировать аутофагию", "s1_r_tfeb": "в ядре активирует экспрессию генов лизосомных белков и белков аутофагии", "s1_none": "Аминокислоты и инсулин отсутствуют. RagA/B связаны с GDP, а mTORC1 находится в цитоплазме и неактивен. Дефосфорилированный TFEB локализуется в ядре.", "s1_none_z": "Без аминокислот и инсулинового сигнала синтез белка подавлен, и ATP на него не расходуется. TFEB активирует экспрессию генов лизосомных белков, что повышает способность клетки расщеплять собственные компоненты.", "s1_aa_only": "Аминокислотный сигнал переводит RagA/B в GTP-форму, а RagC/D — в GDP-форму. Rag-ГТФазы связываются с mTORC1 и привлекают его к лизосоме. При отсутствии инсулина TSC поддерживает RHEB в GDP-форме, поэтому S6K, 4E-BP1 и ULK1 не фосфорилируются. TFEB при этом фосфорилирован: в базовой модели для этого достаточно сигнала от Rag-ГТФаз.", "s1_aa_only_z": "Аминокислоты есть, но без инсулинового сигнала mTORC1 на лизосоме не стимулирует рост. TFEB фосфорилирован и остаётся в цитоплазме: при достатке аминокислот образование новых лизосом не усиливается.", "s1_ins_only": "Инсулиновый сигнал через AKT вызывает фосфорилирование TSC и его отделение от лизосомы, и RHEB переходит в GTP-форму. Однако при отсутствии аминокислот RagA/B связаны с GDP, поэтому mTORC1 не привлекается к лизосоме, не взаимодействует с RHEB и остаётся неактивным. TFEB не фосфорилируется и находится в ядре.", "s1_ins_only_z": "Инсулиновый сигнал есть, но аминокислот нет. Если бы mTORC1 активировался в этих условиях, он стимулировал бы синтез белка при дефиците аминокислот и подавлял бы аутофагию — главный внутренний источник аминокислот.", "s1_both": "При наличии обоих сигналов Rag-ГТФазы удерживают mTORC1 на лизосоме, а RHEB-GTP активирует комплекс. S6K стимулирует синтез белка, 4E-BP1 диссоциирует от eIF4E, ULK1 неактивна, а фосфорилированный TFEB удерживается в цитоплазме.", "s1_both_z": "При наличии аминокислот и инсулинового сигнала усиливаются синтез белка и рост клетки. Одновременно подавляются аутофагия и образование лизосом, что ограничивает расщепление клеточных компонентов.", "s1_weak": "Оба сигнала присутствуют, но хотя бы один из них ослаблен. mTORC1 находится на лизосоме, часть RHEB связана с GTP, однако активность комплекса низкая. S6K, 4E-BP1 и ULK1 почти не фосфорилируются. TFEB фосфорилирован: в базовой модели для этого достаточен сигнал от Rag-ГТФаз.", "s1_weak_z": "В учебной модели эффекты двух сигналов перемножаются: два слабых сигнала дают слабый ответ. Выраженная стимуляция роста требует и достаточного количества аминокислот, и достаточного инсулинового сигнала.", "s1b_take": "Для фосфорилирования S6K, 4E-BP1 и ULK1 комплексу mTORC1 необходимы два условия одновременно. Аминокислотный сигнал через Rag-ГТФазы привлекает mTORC1 к лизосоме. Инсулиновый сигнал через AKT и TSC переводит RHEB в GTP-форму, и RHEB-GTP активирует комплекс. Такая логика «И» не допускает стимуляции роста при дефиците аминокислот. Фосфорилирование TFEB в базовой модели устроено иначе: для него достаточно сигнала от Rag-ГТФаз.", "s1a_leu": "Лейцин", "s1a_arg": "Аргинин", "s1a_met": "Метионин (→ SAM)", "s1a_en": "Энергия (ATP)", "drug_t": "Препарат", "drug_0": "нет", "drug_rapa": "рапамицин", "drug_torin": "торин 1", "geno_t": "Клетки", "gt_wt": "норма", "gt_tsc": "нет TSC2", "gt_g1": "нет GATOR1", "gt_flcn": "нет FLCN", "gt_x": "загадка", "myst_show": "Показать ответ", "s1a_mask": "Схема скрыта. Определите отсутствующий белок по результатам блота.", "drug_none_k": "без препарата", "s1a_targets": "мишени mTORC1", "blot_t": "Вестерн-блот", "blot_rec": "Записать дорожку", "bl_rapa": "рап.", "bl_torin": "тор.", "bl_rapa_s": "+Р", "bl_torin_s": "+Т", "blot_fed_l": "исх.", "blot_refed_l": "возвр.", "b_s6k": "p-S6K (T389)", "b_ebp": "p-4E-BP1 (T37/46)", "b_ulk": "p-ULK1 (S758)", "b_tfeb": "p-TFEB (S211)", "s1a_r_rag": "RagA/B·GTP: mTORC1 на лизосоме", "s1a_r_rheb": "RHEB·GTP", "s1a_r_ampk": "активность AMPK", "s1a_c_full": "Связавшись соответственно с лейцином и аргинином, Sestrin2 и CASTOR1 диссоциируют от GATOR2. SAMTOR, связавшись с SAM, диссоциирует от GATOR1. GATOR2 подавляет GATOR1, RagA/B находятся в GTP-форме, а mTORC1 локализуется на лизосоме. Инсулиновый сигнал подавляет действие TSC, и RHEB-GTP активирует mTORC1. Все четыре показанные мишени фосфорилированы.", "s1a_c_full_z": "Стимуляция роста зависит от наличия аминокислот, SAM, энергии и инсулинового сигнала. Каждый из этих факторов воспринимается отдельным сенсором, поэтому дефицит любого из них ограничивает рост.", "s1a_c_leu": "При дефиците лейцина свободный Sestrin2 связывается с GATOR2. GATOR2 перестаёт подавлять GATOR1, и GATOR1 переводит RagA/B в GDP-форму. mTORC1 покидает лизосому, а TFEB перемещается в ядро.", "s1a_c_leu_z": "Лейцин — незаменимая аминокислота: клетка его не синтезирует, а без лейцина трансляция невозможна. Снижение концентрации лейцина через Sestrin2 подавляет mTORC1, и стимуляция роста ослабевает.", "s1a_c_arg": "При дефиците аргинина свободный CASTOR1 связывается с GATOR2. Последующие события сходны с ответом на дефицит лейцина: GATOR1 переводит RagA/B в GDP-форму, и mTORC1 покидает лизосому. Аргинин в просвете лизосомы воспринимается также сенсором SLC38A9.", "s1a_c_arg_z": "Аргинин воспринимают два сенсора: CASTOR1 — в цитоплазме, а SLC38A9, белок мембраны лизосомы, — со стороны её просвета. При дефиците аминокислот главным внутренним источником аминокислот становится лизосомное расщепление.", "s1a_c_met": "При дефиците метионина снижается содержание SAM. В отсутствие SAM белок SAMTOR связывается с GATOR1 и усиливает его активность. В результате RagA/B переходят в GDP-форму, а mTORC1 покидает лизосому.", "s1a_c_met_z": "SAM — донор метильных групп для ДНК, белков и липидов. Снижение содержания SAM через SAMTOR подавляет mTORC1 и ограничивает стимуляцию роста и деления клетки.", "s1a_c_torin": "Торин 1 занимает активный центр mTOR и подавляет фосфорилирование показанных мишеней. Полосы фосфорилированных белков исчезают, а TFEB перемещается в ядро. Сохраняющаяся полоса актина служит контролем одинакового количества белка в дорожках.", "s1a_c_torin_z": "Это экспериментальное воздействие, а не физиологическое состояние. Зависимость фосфорилирования TFEB от mTOR выявляет торин 1, но не рапамицин.", "s1a_c_ampk": "При дефиците энергии AMPK активируется и фосфорилирует Raptor и TSC2. Это подавляет mTORC1 даже в присутствии аминокислот и инсулина. Кроме того, AMPK фосфорилирует FNIP1 и ослабляет действие комплекса FLCN–FNIP1, поэтому при выраженном энергетическом дефиците TFEB перемещается в ядро (Malik 2023).", "s1a_c_ampk_z": "Синтез белка требует значительных затрат ATP. При дефиците энергии этот процесс подавляется, даже если аминокислоты и инсулин присутствуют. Подавление mTORC1 через Raptor сохраняется и при отсутствии TSC2.", "s1a_c_ampk_mut": "При дефиците энергии активная AMPK фосфорилирует Raptor. Этот путь подавляет mTORC1 и в показанных мутантных клетках (Gwinn 2008).", "s1a_c_ampk_mut_z": "Подавление mTORC1 через Raptor не зависит от TSC2 и FLCN. Поэтому в показанных вариантах модели дефицит энергии ограничивает рост и при отсутствии этих белков.", "s1a_c_noins": "Аминокислоты присутствуют, и mTORC1 локализуется на лизосоме. Однако без инсулина TSC поддерживает RHEB в GDP-форме, поэтому S6K, 4E-BP1 и ULK1 не фосфорилируются. Фосфорилирование TFEB почти не зависит от инсулина: оно связано с Rag и FLCN, а не с RHEB.", "s1a_c_noins_z": "Фосфорилирование разных мишеней mTORC1 зависит от разных условий. Стимуляция синтеза белка требует инсулинового сигнала, тогда как фосфорилирование TFEB зависит прежде всего от аминокислотного сигнала через Rag и FLCN.", "s1a_c_weak": "Один из факторов активации ограничен: аминокислоты, инсулин или энергия. mTORC1 находится на лизосоме, но его активность низкая, поэтому S6K, 4E-BP1 и ULK1 почти не фосфорилируются. Фосфорилирование TFEB почти не зависит от RHEB и требует Rag-ГТФаз и FLCN.", "s1a_c_weak_z": "В учебной модели эффекты сигналов перемножаются: ослабление хотя бы одного из них уменьшает ответ.", "s1a_c_rapa": "Комплекс рапамицина с FKBP12 связывается с FRB-доменом mTOR и ограничивает доступ субстратов к активному центру. С ATP он не конкурирует (Yang 2013). Фосфорилирование S6K почти полностью подавляется, тогда как фосфорилирование 4E-BP1 (T37/46), ULK1 (S758) и TFEB во многом устойчиво к рапамицину.", "s1a_c_rapa_z": "По сравнению с ингибиторами активного центра рапамицин и эверолимус слабее подавляют рост и слабее стимулируют аутофагию (Thoreen 2009). Выраженность различий зависит от клеток и дозы. Для подавления фосфорилирования всех показанных мишеней mTORC1 нужен ингибитор активного центра.", "s1a_c_flcn": "При отсутствии FLCN RagC/D остаются в GTP-форме. mTORC1 локализуется на лизосоме и фосфорилирует S6K, но TFEB не привлекается к mTORC1, не фосфорилируется и остаётся в ядре.", "s1a_c_flcn_z": "Синдром Бёрта — Хогга — Дюбе проявляется опухолями почек, кистами лёгких, пневмотораксом и фиброфолликуломами кожи. У мышей с выключением FLCN в почках дополнительная утрата TFEB предотвращает образование кист (Napolitano 2020). Мутация нарушает преимущественно регуляцию ветви TFEB.", "s1a_c_g1": "Без GATOR1 RagA/B не переходят в GDP-форму. Даже без аминокислот mTORC1 остаётся на лизосоме и сохраняет активность.", "s1a_c_g1_z": "Без GATOR1 дефицит аминокислот не подавляет mTORC1, и стимуляция роста продолжается. Мутации гена DEPDC5, кодирующего субъединицу GATOR1, вызывают наследственную фокальную эпилепсию.", "s1a_c_tsc": "При отсутствии TSC2 RHEB постоянно находится в GTP-форме, поэтому mTORC1 фосфорилирует S6K и без инсулина. TFEB при этом локализуется в ядре: утрата TSC2 нарушает регуляцию RagC и ослабляет фосфорилирование TFEB (Alesi 2021).", "s1a_c_tsc_z": "Без TSC2 mTORC1 стимулирует рост и в отсутствие инсулинового сигнала; одновременно TFEB находится в ядре, и количество лизосом увеличивается. С этими нарушениями связывают рост опухолей при туберозном склерозе; для их лечения применяют эверолимус.", "s1a_c_tsc_noaa": "При дефиците аминокислот mTORC1 покидает лизосому и в клетках без TSC2, однако его активность подавляется не полностью. В норме при таком дефиците Rag-ГТФазы также привлекают TSC2 к лизосоме; в этих клетках TSC2 отсутствует (Demetriades 2014).", "s1a_c_tsc_noaa_z": "Передача аминокислотного сигнала не зависит от инсулина, но оба пути связаны через TSC2. Поэтому дефицит аминокислот подавляет mTORC1 двумя путями.", "s1a_c_myst": "В этих клетках отсутствует один из регуляторных белков. Запишите дорожки блота при разных условиях и определите, какой белок отсутствует.", "s1a_c_myst_z": "Это основной приём генетического анализа: о функции белка судят по тому, как меняется ответ клетки при его отсутствии.", "s1a_c_ans_tsc": "Ответ: отсутствует TSC2. Признаки: сигнал p-S6K сохраняется без инсулина, а сигнал p-TFEB слабый.", "s1a_c_ans_tsc_z": "Активация mTORC1 больше не требует инсулинового сигнала, но по-прежнему зависит от аминокислотного сигнала.", "s1a_c_ans_g1": "Ответ: отсутствует GATOR1. Признак: полосы фосфорилированных белков сохраняются после удаления лейцина и аргинина.", "s1a_c_ans_g1_z": "Нарушена передача аминокислотного сигнала: дефицит аминокислот не подавляет mTORC1.", "s1a_c_ans_flcn": "Ответ: отсутствует FLCN. Признаки: сигнал p-S6K присутствует, а p-TFEB не определяется ни при одном из показанных условий.", "s1a_c_ans_flcn_z": "Нарушена преимущественно регуляция TFEB, для которой необходимы RagC/D в GDP-форме.", "s1a_take": "На лизосоме сходятся сигналы отдельных сенсоров: лейцина (Sestrin2), аргинина (CASTOR1 и SLC38A9), SAM (SAMTOR), энергетического состояния (AMPK) и инсулина (TSC). Требования разных мишеней различаются: для фосфорилирования S6K нужен RHEB, для TFEB — прежде всего Rag и FLCN. При дефиците энергии на ветвь TFEB также влияет AMPK через FNIP1. Поэтому мутации и препараты нарушают разные функции mTORC1.", "p1b_1_q": "Добавим аминокислоты при отсутствии инсулина. Как изменится локализация mTORC1 и будет ли комплекс фосфорилировать S6K?", "p1b_1_o1": "Локализуется на лизосоме и фосфорилирует S6K", "p1b_1_o2": "Локализуется на лизосоме, но S6K не фосфорилирует", "p1b_1_o3": "Останется в цитоплазме", "p1b_1_e": "Аминокислотный сигнал через Rag-ГТФазы привлекает mTORC1 к лизосоме. Для фосфорилирования S6K нужен также RHEB-GTP, но без инсулина RHEB находится в GDP-форме. TFEB — другая мишень: в базовой модели его фосфорилирование зависит от Rag-сигнала и сохраняется без инсулина.", "p1b_1_w1": "mTORC1 локализуется на лизосоме, но не фосфорилирует S6K: без инсулина RHEB-GTP отсутствует. Фосфорилирование TFEB в базовой модели сохраняется благодаря Rag-сигналу.", "p1b_1_w3": "Аминокислоты необходимы, чтобы Rag-ГТФазы привлекли mTORC1 к лизосоме. Без аминокислот комплекс остался бы в цитоплазме.", "p1b_2_q": "Добавим инсулин при отсутствии аминокислот. Изменятся ли состояние RHEB и активность mTORC1?", "p1b_2_o1": "mTORC1 активируется в цитоплазме", "p1b_2_o2": "RHEB перейдёт в GTP-форму, но mTORC1 останется неактивным", "p1b_2_o3": "Ничего не изменится", "p1b_2_e": "Инсулиновый сигнал через AKT подавляет TSC, и RHEB переходит в GTP-форму. Однако RHEB активирует mTORC1 у лизосомы, а привлекают туда mTORC1 Rag-ГТФазы. Без аминокислот этого не происходит.", "p1b_2_w1": "RHEB-GTP взаимодействует с mTORC1 у мембраны лизосомы. Локализация mTORC1 в этой области зависит от Rag-ГТФаз и аминокислотного сигнала. Без аминокислот одного RHEB-GTP для активации недостаточно.", "p1b_2_w3": "Изменяется нуклеотидное состояние RHEB: инсулиновый сигнал через AKT подавляет TSC, и RHEB переходит в GTP-форму. Однако без аминокислот mTORC1 не привлекается к лизосоме и не взаимодействует с RHEB-GTP, поэтому мишени mTORC1 не фосфорилируются.", "p1b_3_q": "Исходно присутствуют аминокислоты и инсулин. Удалим аминокислоты, сохранив инсулин. Как изменится локализация TFEB?", "p1b_3_o1": "В цитоплазме: инсулин поддерживает активность mTORC1", "p1b_3_o2": "В ядре: без аминокислот mTORC1 покидает лизосому", "p1b_3_o3": "Ни в ядре, ни в цитоплазме: TFEB разрушат протеасомы", "p1b_3_e": "mTORC1 фосфорилирует TFEB на лизосоме. При отсутствии аминокислот mTORC1 покидает лизосому. TFEB дефосфорилируется и перемещается в ядро, где активирует экспрессию генов лизосомных белков и белков аутофагии.", "p1b_3_w1": "Для фосфорилирования TFEB комплексом mTORC1 необходим сигнал от Rag-ГТФаз. Инсулиновый сигнал его не заменяет: при отсутствии аминокислот mTORC1 покидает лизосому, а TFEB перемещается в ядро.", "p1b_3_w3": "При дефиците аминокислот TFEB не разрушается. После дефосфорилирования он перестаёт удерживаться в цитоплазме и перемещается в ядро.", "p1a_1_q": "Дорожка 1 — контроль. Добавим рапамицин. Какие полосы фосфорилированных белков исчезнут?", "p1a_1_o1": "Исчезнут все четыре фосфорилированные полосы", "p1a_1_o2": "p-S6K почти исчезнет, остальные полосы почти не изменятся", "p1a_1_o3": "Исчезнет только p-TFEB, остальные почти не изменятся", "p1a_1_e": "Фосфорилирование S6K (T389) очень чувствительно к рапамицину, а фосфорилирование 4E-BP1 (T37/46), ULK1 (S758) и TFEB во многом устойчиво к нему; TFEB при этом остаётся в цитоплазме (Thoreen 2009; Kang 2013; Settembre 2012; Roczniak-Ferguson 2012). Степень устойчивости зависит от сайта и условий опыта.", "p1a_1_w1": "Подавление фосфорилирования всех четырёх мишеней характерно для торина 1, который занимает активный центр mTOR. Комплекс FKBP12–рапамицин связывается с FRB-доменом и лишь ограничивает доступ субстратов к активному центру, поэтому часть мишеней во многом сохраняет фосфорилирование.", "p1a_1_w3": "Фосфорилирование TFEB во многом устойчиво к рапамицину. Наиболее выраженно рапамицин подавляет фосфорилирование S6K (T389).", "p1a_2_q": "Заменим рапамицин торином 1, который занимает активный центр mTOR. Какие полосы фосфорилированных белков исчезнут?", "p1a_2_o1": "Те же, что при действии рапамицина", "p1a_2_o2": "Все, а TFEB переместится в ядро", "p1a_2_o3": "Полосы станут ярче", "p1a_2_e": "Торин 1 конкурирует с ATP за активный центр mTOR и подавляет фосфорилирование всех показанных мишеней, включая TFEB. Значит, фосфорилирование TFEB зависит от киназы mTOR, хотя к рапамицину оно во многом устойчиво.", "p1a_2_w1": "Торин 1 занимает активный центр mTOR и конкурирует с ATP. Комплекс FKBP12–рапамицин связывается с FRB-доменом и ограничивает доступ субстратов к активному центру. Поэтому при действии торина 1 исчезают все показанные полосы фосфорилированных белков, включая устойчивые к рапамицину.", "p1a_2_w3": "Торин 1 подавляет киназную активность mTOR, и мишени mTOR дефосфорилируются. Поэтому полосы фосфорилированных белков исчезают, а не становятся ярче.", "p1a_3_q": "В клетках без TSC2 mTORC1 активен и без инсулина (дорожка 1). Удалим лейцин и аргинин. Как ответят клетки?", "p1a_3_o1": "mTORC1 останется активным: отсутствует ингибирующее действие TSC2", "p1a_3_o2": "Активность mTORC1 резко снизится: без Rag-сигнала комплекс не взаимодействует с RHEB", "p1a_3_o3": "Клетка начнёт синтезировать лейцин", "p1a_3_e": "При утрате TSC2 активация mTORC1 больше не требует инсулинового сигнала, но по-прежнему зависит от аминокислотного сигнала. Однако при дефиците аминокислот активность mTORC1 подавляется не полностью: в норме Rag-ГТФазы также привлекают TSC2 к лизосоме, а в этих клетках TSC2 отсутствует (Demetriades 2014).", "p1a_3_w1": "При отсутствии TSC2 RHEB постоянно находится в GTP-форме. Однако RHEB активирует mTORC1 у лизосомы, куда комплекс привлекают Rag-ГТФазы. Без лейцина и аргинина этого почти не происходит, поэтому фосфорилирование мишеней резко снижается.", "p1a_3_w3": "Лейцин — незаменимая аминокислота, которую клетка не синтезирует. При дефиците аминокислот mTORC1 покидает лизосому.", "p1a_4_q": "Из среды для клеток без GATOR1 удалили лейцин и аргинин. Как изменится активность mTORC1?", "p1a_4_o1": "mTORC1 станет неактивным, как в норме", "p1a_4_o2": "mTORC1 останется активным: RagA/B не перейдут в GDP-форму", "p1a_4_o3": "TFEB переместится в ядро, а S6K перестанет фосфорилироваться", "p1a_4_e": "Сигнал о дефиците аминокислот передаётся от сенсоров через GATOR2 к GATOR1. При отсутствии GATOR1 эта передача нарушена, поэтому дефицит аминокислот не подавляет mTORC1 (Bar-Peled 2013).", "p1a_4_w1": "В норме сигнал о дефиците аминокислот передаётся от Sestrin2 и CASTOR1 через GATOR2 к GATOR1. GATOR1 переводит RagA/B в GDP-форму. Без GATOR1 этот этап нарушен, поэтому mTORC1 остаётся на лизосоме.", "p1a_4_w3": "В этом опыте фосфорилирование TFEB и S6K зависит от локализации mTORC1 на лизосоме. При отсутствии GATOR1 комплекс остаётся на лизосоме, и оба белка сохраняют фосфорилирование.", "p1a_5_q": "Аминокислоты и инсулин присутствуют, но возникает дефицит энергии. Что произойдёт с mTORC1?", "p1a_5_o1": "Будет подавлен: AMPK фосфорилирует Raptor и TSC2", "p1a_5_o2": "Останется активным: аминокислоты и инсулин присутствуют", "p1a_5_o3": "Переместится в ядро", "p1a_5_e": "AMPK подавляет mTORC1 через TSC2 и непосредственно через Raptor. Путь через Raptor сохраняется и при отсутствии TSC2 (Gwinn 2008).", "p1a_5_w2": "Рост требует значительных затрат ATP. При дефиците энергии AMPK усиливает действие TSC2 и фосфорилирует Raptor. Поэтому mTORC1 подавляется даже в присутствии аминокислот и инсулина.", "p1a_5_w3": "При дефиците энергии mTORC1 подавляется через TSC2 и Raptor и в ядро не перемещается. В ядро перемещается TFEB после дефосфорилирования.", "p1a_6_q": "Как изменятся фосфорилирование S6K и локализация TFEB в клетках без FLCN?", "p1a_6_o1": "S6K не фосфорилируется, TFEB в ядре", "p1a_6_o2": "S6K фосфорилируется, TFEB в ядре", "p1a_6_o3": "S6K фосфорилируется, TFEB в цитоплазме, как в норме", "p1a_6_e": "FLCN переводит RagC/D в GDP-форму. Только в этой форме Rag-ГТФазы привлекают TFEB к mTORC1. Для фосфорилирования S6K это условие почти не требуется (Napolitano 2020).", "p1a_6_w1": "При отсутствии FLCN mTORC1 остаётся на лизосоме, и S6K почти нормально фосфорилируется. Ветвь TFEB зависит от FLCN, который переводит RagC/D в GDP-форму.", "p1a_6_w3": "Фосфорилирование S6K сохраняется почти как в норме, но регуляция TFEB нарушена. Без FLCN RagC/D остаются в GTP-форме и не привлекают TFEB к mTORC1, поэтому TFEB остаётся в ядре.", "s2_load": "Расход ATP", "s2_lkb1": "LKB1 активна", "s2_pool": "адениловые нуклеотиды", "s2_ak": "аденилаткиназа: 2 ADP ⇄ ATP + AMP", "s2_fold": "во сколько раз изменилось", "s2_rest": "покой", "s2_ec_f": "заряд = (ATP + ½ ADP) / (ATP + ADP + AMP)", "s2_alpha": "α — киназа", "s2_gamma": "γ — датчик", "s2_t_acc1": "синтез ЖК ↓", "s2_t_acc2": "окисление ЖК ↑", "s2_t_mtor1": "mTORC1 ↓", "s2_t_mtor2": "рост ↓", "s2_t_ulk1": "аутофагия:", "s2_t_ulk2": "↑ или ↓", "s2_r_atp": "от уровня покоя", "s2_r_amp": "от уровня покоя", "s2_r_ec": "энергетический заряд", "s2_r_ampk": "активность AMPK", "s2_c_rest": "Содержание ATP высокое, AMP почти отсутствует. С γ-субъединицей связан ATP, и AMPK неактивна.", "s2_c_rest_z": "При достаточном энергетическом обеспечении AMPK не подавляет потребление ATP на синтез и рост.", "s2_c_on": "Содержание ATP снизилось лишь на {atp} %, тогда как содержание AMP увеличилось в {amp}. Аденилаткиназа превращает накопившийся ADP в ATP и AMP. AMP вытесняет ATP из γ-субъединицы, LKB1 фосфорилирует Thr172, и AMPK активируется.", "s2_c_on_z": "Относительное увеличение содержания AMP намного больше относительного снижения ATP, поэтому AMPK активируется до значительного снижения ATP. AMPK подавляет процессы, потребляющие ATP, — синтез жирных кислот и рост через mTORC1 — и стимулирует образование ATP за счёт окисления жирных кислот. Влияние AMPK на аутофагию зависит от условий: в классической схеме AMPK стимулирует аутофагию, а в новых работах при дефиците энергии скорее сдерживает её.", "s2_c_nolkb1": "Содержание AMP высокое, но без LKB1 Thr172 не фосфорилируется. Поэтому AMPK почти неактивна.", "s2_c_nolkb1_z": "При отсутствии LKB1 дефицит энергии не вызывает обычного ответа AMPK, и потребление ATP продолжается. LKB1 — супрессор опухолей; её соматическая утрата часто встречается при аденокарциноме лёгкого.", "s2b_take": "Благодаря аденилаткиназной реакции небольшое снижение ATP вызывает большое относительное увеличение AMP. Связав AMP, AMPK подавляет процессы, потребляющие ATP (синтез жирных кислот, рост), и стимулирует образование ATP.", "p2b_1_q": "Увеличим потребление ATP до максимума. Содержание какого нуклеотида изменится сильнее в относительном выражении — ATP или AMP?", "p2b_1_o1": "ATP снизится в несколько раз, а AMP почти не изменится", "p2b_1_o2": "ATP снизится на треть, а AMP увеличится почти в 20 раз", "p2b_1_o3": "ATP и AMP изменятся одинаково", "p2b_1_e": "Аденилаткиназа катализирует равновесную реакцию 2 ADP ⇄ ATP + AMP. Поэтому отношение AMP/ATP растёт примерно как квадрат отношения ADP/ATP, и при небольшом снижении ATP содержание AMP увеличивается во много раз.", "p2b_1_w1": "Аденилаткиназа превращает 2 ADP в ATP и AMP. Это поддерживает содержание ATP, тогда как содержание AMP, исходно очень низкое, увеличивается во много раз.", "p2b_1_w3": "В покое содержание ATP высокое, а AMP — низкое. Поэтому содержание ATP снижается лишь на треть, а аденилаткиназная реакция увеличивает содержание AMP почти в 20 раз.", "p2b_2_q": "Выключим LKB1 при прежнем потреблении ATP. Как изменится активность AMPK?", "p2b_2_o1": "AMPK будет активна, поскольку содержание AMP высокое", "p2b_2_o2": "AMPK будет почти неактивна: Thr172 не фосфорилирован", "p2b_2_o3": "Активность AMPK увеличится", "p2b_2_e": "AMP и ADP облегчают фосфорилирование Thr172 и защищают этот сайт от дефосфорилирования; AMP также аллостерически активирует AMPK. Однако сам Thr172 фосфорилируется другой киназой — LKB1 (на продвинутом уровне рассматривается также CaMKK2).", "p2b_2_w1": "AMP лишь облегчает фосфорилирование Thr172, защищает этот сайт от дефосфорилирования и усиливает активность уже фосфорилированной AMPK. Сам же Thr172 фосфорилируется киназой LKB1, поэтому без LKB1 AMPK в базовой модели почти неактивна.", "p2b_2_w3": "При отсутствии LKB1 Thr172 не фосфорилируется в ответ на AMP. Поэтому AMPK в базовой модели остаётся почти неактивной; увеличения её активности не происходит.", "p2b_3_q": "AMPK активирована. Как изменятся синтез жирных кислот и клеточный рост?", "p2b_3_o1": "Усилятся: потребность в энергии возросла", "p2b_3_o2": "Резко уменьшатся: потребление ATP сократится", "p2b_3_o3": "Синтез жирных кислот усилится для запасания энергии", "p2b_3_e": "AMPK подавляет ACC и mTORC1 и тем самым ограничивает синтез жирных кислот и рост. Влияние на аутофагию зависит от условий. Согласно классической схеме, AMPK стимулирует её через ULK1 (Kim 2011; Egan 2011). В новых работах при дефиците энергии AMPK скорее сдерживает инициацию аутофагии и сохраняет участвующие в ней белки (Park 2023).", "p2b_3_w1": "Синтез жирных кислот и клеточный рост требуют ATP. При дефиците энергии AMPK подавляет эти процессы и стимулирует образование ATP, например за счёт окисления жирных кислот.", "p2b_3_w3": "Запасание энергии характерно для её избытка. При дефиците ATP AMPK активируется и подавляет ACC, поэтому синтез жирных кислот снижается, а их окисление усиливается.", "s2a_in1": "расход ATP → AMP", "s2a_in2": "мало глюкозы (нет FBP)", "s2a_ald": "альдолаза", "s2a_glc": "Глюкоза", "s2a_ca": "Ca²⁺ в цитоплазме", "s2a_gam": "γ отвечает на AMP и ADP", "s2a_time": "Прошло времени", "s2a_t0": "0", "s2a_t1": "2 мин", "s2a_t2": "10 мин", "s2a_t3": "1 ч", "s2a_t4": "3 ч", "s2a_t5": "8 ч", "s2a_t6": "24 ч", "s2a_row1": "через минуты", "s2a_row2": "через часы", "s2a_e_acc": "синтез ЖК ↓", "s2a_e_hmg": "холестерин ↓", "s2a_e_tsc": "RHEB-GTP ↓", "s2a_e_rap": "mTORC1 ↓", "s2a_e_ulk": "аутофагия ↑↓", "s2a_e_mff": "деление ↑", "s2a_e_tfe": "лизосомы ↑", "s2a_e_pgc": "митохондрии ↑", "s2a_r_ratio": "от уровня покоя", "s2a_r_t172": "Thr172 фосфорилирован", "s2a_rt1": "путь через AMP/ADP (LKB1)", "s2a_rt2": "путь при дефиците глюкозы (лизосома)", "s2a_rt3": "путь через Ca²⁺ (CaMKK2)", "s2a_c_rest": "Ни один из трёх путей активации не задействован: ATP и глюкозы достаточно, содержание Ca²⁺ низкое. AMPK неактивна.", "s2a_c_rest_z": "Дефицита энергии нет, поэтому ответ AMPK не развивается.", "s2a_c_amp": "Увеличение потребления ATP повышает содержание AMP. AMP связывается с γ-субъединицей, а LKB1 фосфорилирует Thr172. Это классический путь активации AMPK.", "s2a_c_amp_z": "Это ответ на уже наступивший дефицит энергии.", "s2a_c_glc": "Содержание глюкозы снижено, но содержание ATP пока остаётся нормальным. В отсутствие фруктозо-1,6-бисфосфата (FBP) альдолаза способствует сборке комплекса v-ATPase — Ragulator — AXIN — LKB1 на лизосоме. LKB1 фосфорилирует AMPK без участия AMP.", "s2a_c_glc_z": "Ответ на дефицит глюкозы снижает потребление ATP ещё до того, как содержание ATP уменьшится.", "s2a_c_glc_gam": "γ-субъединица не реагирует на AMP и ADP, однако путь ответа на дефицит глюкозы сохранён. Через альдолазу на лизосоме AMPK активируется без участия AMP.", "s2a_c_glc_gam_z": "Опыт с такой γ-субъединицей показал, что лизосомный путь не зависит от AMP (Zhang 2017).", "s2a_c_ca": "При повышении содержания Ca²⁺ в цитоплазме CaMKK2 фосфорилирует Thr172 без участия AMP.", "s2a_c_ca_z": "Возбуждение нейрона или гормональный сигнал повышают содержание Ca²⁺ и активируют AMPK. Предполагают, что так AMPK активируется заранее — до того, как возрастёт потребление ATP.", "s2a_c_ca0": "Несмотря на отсутствие LKB1, повышение содержания Ca²⁺ активирует AMPK через CaMKK2.", "s2a_c_ca0_z": "Один и тот же Thr172 могут фосфорилировать разные киназы (Hawley 2005).", "s2a_c_nolkb": "При отсутствии LKB1 ни AMP, ни дефицит глюкозы не активируют AMPK. В показанной модели остаётся путь активации через Ca²⁺ и CaMKK2.", "s2a_c_nolkb_z": "LKB1 необходима для обоих путей ответа на энергетический дефицит. В опухолевых клетках без LKB1 дефицит энергии не подавляет рост через эти пути.", "s2a_c_gam": "γ-субъединица не реагирует на AMP и ADP. Поэтому при высоком потреблении ATP активация AMPK почти отсутствует.", "s2a_c_gam_z": "Следовательно, AMPK воспринимает изменения содержания AMP и ADP именно через γ-субъединицу.", "s2a_c_multi": "Одновременно задействованы несколько путей активации. В данной модели их эффекты складываются.", "s2a_c_multi_z": "AMPK объединяет сигналы об энергетическом состоянии клетки, доступности глюкозы и повышении содержания Ca²⁺.", "s2a_c_part": "AMPK активирована лишь частично: Thr172 фосфорилирован не во всех молекулах, и мишени AMPK почти не фосфорилируются.", "s2a_c_part_z": "В данной модели эффекты слабых сигналов складываются. Чем больше сигналов задействовано и чем они сильнее, тем выше активность AMPK.", "s2a_take": "AMPK активируется тремя путями: через AMP, когда дефицит ATP уже наступил; через лизосомный механизм при дефиците глюкозы, ещё до снижения содержания ATP; через Ca²⁺ и CaMKK2 при повышении содержания Ca²⁺ в цитоплазме (возбуждение клетки, гормональный сигнал). Ответ развивается в два этапа: за минуты AMPK фосфорилирует ферменты, за часы изменяется экспрессия генов, и образуются новые лизосомы и митохондрии.", "p2a_1_q": "Удалим глюкозу. Содержание ATP пока остаётся нормальным. Активируется ли AMPK?", "p2a_1_o1": "Нет: содержание AMP не увеличилось", "p2a_1_o2": "Да: через альдолазу на лизосоме, без участия AMP", "p2a_1_o3": "Да, но только через Ca²⁺", "p2a_1_e": "В отсутствие FBP альдолаза способствует сборке комплекса с AXIN и LKB1 на лизосоме. Это активирует AMPK до снижения содержания ATP (Zhang 2017).", "p2a_1_w1": "Активация AMPK определяется не только AMP. В отсутствие FBP альдолаза способствует сборке комплекса с AXIN и LKB1 на лизосоме, и LKB1 фосфорилирует AMPK ещё до снижения содержания ATP.", "p2a_1_w3": "Содержание Ca²⁺ в этом опыте не изменяется. Дефицит глюкозы воспринимается через альдолазу на лизосоме, после чего LKB1 фосфорилирует AMPK.", "p2a_2_q": "В модели γ-субъединица AMPK не реагирует на AMP и ADP. Увеличим потребление ATP. Как изменится активность AMPK?", "p2a_2_o1": "AMPK активируется так же, как обычно", "p2a_2_o2": "AMPK почти не активируется", "p2a_2_o3": "AMPK активируется сильнее", "p2a_2_e": "На дефицит ATP AMPK отвечает через γ-субъединицу, с которой связываются AMP и ADP. Здесь этот путь нарушен, поэтому увеличение потребления ATP не активирует AMPK. Пути ответа на дефицит глюкозы и повышение содержания Ca²⁺ сохранены, но не задействованы: глюкозы достаточно, а содержание Ca²⁺ не повышено.", "p2a_2_w1": "Обычно увеличение потребления ATP активирует AMPK через связывание AMP и ADP с γ-субъединицей. Здесь γ-субъединица не реагирует на эти нуклеотиды, поэтому обычной активации не происходит.", "p2a_2_w3": "Путь ответа на AMP и ADP нарушен. Дефицит глюкозы и повышение содержания Ca²⁺ в этом опыте не создавались, поэтому дополнительные пути активации AMPK не задействованы.", "p2a_3_q": "Повысим содержание Ca²⁺ в клетках без LKB1. Изменится ли активность AMPK?", "p2a_3_o1": "Активность AMPK не изменится: LKB1 отсутствует", "p2a_3_o2": "AMPK активируется через CaMKK2", "p2a_3_o3": "AMPK активируется через AMP", "p2a_3_e": "CaMKK2 фосфорилирует тот же Thr172. Поэтому при отсутствии LKB1 повышение содержания Ca²⁺ активирует AMPK без изменения содержания AMP (Hawley 2005).", "p2a_3_w1": "Thr172 фосфорилируется не только киназой LKB1. При повышении содержания Ca²⁺ его фосфорилирует CaMKK2, поэтому AMPK активируется и без LKB1.", "p2a_3_w3": "Содержание AMP в этом опыте не увеличивается. AMPK активируется потому, что CaMKK2 фосфорилирует Thr172 (Hawley 2005).", "p2a_4_q": "Потребление ATP остаётся высоким. Через 2 мин после активации AMPK фосфорилированы ACC, HMGCR, TSC2, Raptor, ULK1 и MFF. Что добавится через несколько часов?", "p2a_4_o1": "Ничего: ответ уже завершён", "p2a_4_o2": "Новые лизосомы (FNIP1 → TFEB) и митохондрии (PGC-1α)", "p2a_4_o3": "AMPK инактивируется, и изменения исчезнут", "p2a_4_e": "Быстрый ответ — фосфорилирование ферментов, медленный — изменение экспрессии генов: AMPK фосфорилирует FNIP1, TFEB перемещается в ядро и активирует экспрессию генов лизосомных белков, а затем PGC-1α — генов биогенеза митохондрий (Malik 2023).", "p2a_4_w1": "В течение минут меняется активность ферментов. При длительной активности AMPK изменяется экспрессия генов: путь через FNIP1 и TFEB способствует образованию лизосом, а PGC-1α — образованию митохондрий.", "p2a_4_w3": "Пока сигнал об энергетическом дефиците сохраняется, AMPK остаётся активной. При длительном воздействии усиливается экспрессия генов, участвующих в образовании лизосом и митохондрий.", "s3_omm": "наружная мембрана", "s3_imm": "внутренняя мембрана", "s3_matrix_lbl": "матрикс", "s3_cit_lbl": "цитрат", "s3_mal": "малонил-CoA", "s3_fas": "синтез ЖК", "s3_box": "β-окисление", "s3_out": "ацетил-CoA → ЦТК → ATP", "s3_leg_acyl": "ацил-CoA", "s3_leg_carn": "ацилкарнитин", "s3_leg_free": "свободный карнитин", "s3_leg_mal": "малонил-CoA", "s3_leg_mcfa": "октаноат (C8)", "s3_r_acc": "активность ACC", "s3_r_mal": "малонил-CoA", "s3_r_cpt": "активность CPT1", "s3_r_syn": "синтез жирных кислот", "s3_r_ox": "β-окисление", "s3_ampk": "AMPK (энергии мало)", "s3_cit": "Цитрат (избыток углеводов)", "s3_c_syn": "ACC активна, и содержание малонил-CoA высокое. Малонил-CoA используется для синтеза жирных кислот и ингибирует CPT1. Поэтому образование ацилкарнитина из ацил-CoA, перенос ацильных групп в митохондрию и их окисление ограничены.", "s3_c_syn_z": "При избытке углеводов усиливается синтез жирных кислот. Малонил-CoA служит субстратом этого синтеза и одновременно ингибирует CPT1, ограничивая окисление вновь синтезированных жирных кислот в митохондриях.", "s3_c_mid": "При промежуточном содержании малонил-CoA CPT1 частично ингибирована. Синтез и окисление жирных кислот выражены слабо.", "s3_c_mid_z": "В модели переход постепенный: чем ниже содержание малонил-CoA, тем больше жирных кислот окисляется.", "s3_c_ox": "AMPK фосфорилирует ACC и подавляет её активность. Оставшийся малонил-CoA расходуется и декарбоксилируется малонил-CoA-декарбоксилазой. Активная CPT1 переносит ацильную группу с CoA на карнитин. Через CACT ацилкарнитин поступает в матрикс, где CPT2 вновь образует ацил-CoA; затем происходит β-окисление.", "s3_c_ox_z": "При дефиците энергии фосфорилирование ACC снижает синтез жирных кислот и ослабляет ингибирование CPT1. В результате жирные кислоты переносятся в митохондрии и окисляются с образованием ATP.", "s3_c_ox_cit": "При низком содержании цитрата активность ACC и образование малонил-CoA почти отсутствуют. CPT1 не ингибирована и переносит ацильную группу с CoA на карнитин. Через CACT ацилкарнитин поступает в матрикс, где CPT2 вновь образует ацил-CoA; затем происходит β-окисление.", "s3_c_ox_cit_z": "Цитрат в цитоплазме отражает избыток ацетил-CoA и ATP. При низком содержании цитрата синтез жирных кислот ограничен, и они направляются на окисление.", "s3b_take": "Малонил-CoA — общий узел двух путей: он служит субстратом синтеза жирных кислот и ингибирует CPT1, которая катализирует первый этап переноса ацильных групп в митохондрии. Поэтому синтез и окисление жирных кислот не протекают одновременно с высокой скоростью. Фосфорилируя ACC, AMPK подавляет синтез жирных кислот и усиливает их окисление.", "p3b_1_q": "Активируем AMPK. Как изменятся содержание малонил-CoA и перенос ацильных групп жирных кислот в митохондрии?", "p3b_1_o1": "Содержание малонил-CoA увеличится, а перенос в митохондрии уменьшится", "p3b_1_o2": "Содержание малонил-CoA снизится, а перенос в митохондрии увеличится", "p3b_1_o3": "Ничего не изменится", "p3b_1_e": "AMPK фосфорилирует ACC1 и ACC2 и подавляет их активность. Малонил-CoA образуется меньше, а имеющийся продолжает расходоваться, поэтому ингибирование CPT1 ослабевает.", "p3b_1_w1": "AMPK подавляет ACC — фермент, образующий малонил-CoA. Содержание малонил-CoA снижается, ингибирование CPT1 ослабевает, и перенос ацильных групп в митохондрии увеличивается.", "p3b_1_w3": "ACC — прямая мишень AMPK. Фосфорилирование ACC под действием AMPK подавляет активность фермента, снижает образование малонил-CoA и тем самым ослабляет ингибирование CPT1.", "p3b_2_q": "Почему частица на схеме меняет цвет сначала у CPT1, а затем у CPT2?", "p3b_2_o1": "Происходят два последовательных окисления", "p3b_2_o2": "Ацил-CoA в цитоплазме и в матриксе — разные жирные кислоты", "p3b_2_o3": "Через внутреннюю мембрану переносится не ацил-CoA, а ацилкарнитин", "p3b_2_e": "CPT1 переносит ацильную группу с CoA на карнитин. CACT переносит ацилкарнитин в матрикс в обмен на свободный карнитин, а CPT2 вновь переносит ацильную группу на CoA. Пулы CoA в цитоплазме и матриксе остаются раздельными.", "p3b_2_w1": "Смена цвета обозначает перенос ацильной группы, а не её окисление. CPT1 переносит её с CoA на карнитин, а CPT2 в матриксе — обратно на CoA. β-Окисление происходит после этих этапов, в матриксе.", "p3b_2_w2": "Жирнокислотная цепь остаётся той же. Меняется соединение, с которым связана ацильная группа: CoA в цитоплазме, карнитин при переносе через внутреннюю мембрану и снова CoA в матриксе.", "p3b_3_q": "Избыток углеводов повышает содержание цитрата. Как изменятся синтез и окисление жирных кислот?", "p3b_3_o1": "Синтез жирных кислот усилится, а окисление ослабнет", "p3b_3_o2": "Окисление жирных кислот усилится", "p3b_3_o3": "Синтез и окисление жирных кислот усилятся", "p3b_3_e": "Цитрат активирует ACC. Малонил-CoA одновременно служит субстратом синтеза жирных кислот и ингибирует CPT1. При избытке углеводов усиливается синтез жирных кислот, а их окисление ограничивается.", "p3b_3_w2": "Цитрат активирует ACC. Содержание малонил-CoA повышается, ингибирование CPT1 усиливается, поэтому окисление жирных кислот снижается.", "p3b_3_w3": "Синтез жирных кислот усиливается, но окисление ослабевает: ACC образует больше малонил-CoA, который ингибирует CPT1 и ограничивает перенос ацильных групп в митохондрии.", "s3a_ins": "+ инсулин", "s3a_eto_tag": "этомоксир", "s3a_fed": "После приёма пищи (инсулин, цитрат)", "tis_t": "Ткань", "tis_liver": "печень", "tis_muscle": "мышца", "ch_t": "Жирная кислота", "ch_long": "пальмитат (C16)", "ch_medium": "октаноат (C8)", "geno3_t": "Генотип или препарат", "gt_acc2": "нет ACC2", "gt_ki": "ACC S79A/S212A", "gt_eto": "этомоксир", "s3a_fut": "Мысленный опыт: малонил-CoA не тормозит CPT1", "s3a_out_keto": "ацетил-CoA → кетоновые тела", "s3a_out_liver": "ацетил-CoA → ЦТК", "s3a_out_muscle": "ацетил-CoA → ЦТК → ATP", "s3a_r_mal2": "малонил-CoA у CPT1", "s3a_r_keto": "кетоновые тела", "s3a_r_atp": "ATP из жирных кислот", "s3a_r_fut": "возможный холостой цикл", "s3a_c_syn": "После приёма пищи инсулин и цитрат поддерживают активность ACC1 и ACC2 в печени. Малонил-CoA служит субстратом синтеза жирных кислот и ингибирует CPT1.", "s3a_c_syn_z": "Избыток углеводов используется для синтеза запасаемых липидов; окисление жирных кислот в этих условиях ограничивается.", "s3a_c_mfed": "После приёма пищи ACC2 на наружной мембране митохондрии образует малонил-CoA вблизи CPT1, ограничивая окисление жирных кислот в мышце. Синтез жирных кислот в мышце почти отсутствует.", "s3a_c_mfed_z": "В мышце малонил-CoA почти не используется для синтеза жирных кислот и преимущественно выполняет регуляторную функцию. После приёма пищи усиливается окисление глюкозы; окисление жирных кислот снижается, но не прекращается.", "s3a_c_mid": "При промежуточном содержании малонил-CoA CPT1 частично ингибирована.", "s3a_c_mid_z": "По мере снижения содержания малонил-CoA использование жирных кислот для окисления постепенно увеличивается.", "s3a_c_ox": "При низком содержании малонил-CoA CPT1 активна. Ацильные группы жирных кислот переносятся через карнитиновый челнок и подвергаются β-окислению.", "s3a_c_ox_z": "При энергетическом дефиците во время голодания или длительной умеренной нагрузки вклад окисления жирных кислот в энергообеспечение возрастает. При очень интенсивной нагрузке в мышце увеличивается вклад углеводов.", "s3a_c_keto": "При голодании содержание малонил-CoA в печени низкое. Жирные кислоты окисляются, а образующийся ацетил-CoA используется для синтеза кетоновых тел.", "s3a_c_keto_z": "При голодании печень получает ATP за счёт β-окисления, а образующиеся кетоновые тела поступают в кровь и используются мозгом и мышцами. Мозг почти не использует жирные кислоты как источник энергии, но использует кетоновые тела.", "s3a_c_acc2": "При отсутствии ACC2 малонил-CoA вблизи CPT1 почти отсутствует. Поэтому CPT1 активна и после приёма пищи, и окисление жирных кислот усиливается.", "s3a_c_acc2_z": "У мышей без ACC2 содержание малонил-CoA было в 10 раз ниже в сердце и в 30 раз ниже в мышцах (Abu-Elheiga 2001), а окисление жирных кислот — выше (Abu-Elheiga 2001; Hoehn 2010). В другой линии мышей содержание малонил-CoA и окисление в мышце не изменились; авторы предполагают компенсацию (Olson 2010). Масса жира в независимых линиях не менялась (Olson 2010; Hoehn 2010).", "s3a_c_acc2_liv": "При отсутствии ACC2 малонил-CoA вблизи CPT1 образуется только при участии ACC1. Ингибирование CPT1 слабее, чем в норме, а окисление жирных кислот выше. Синтез жирных кислот от ACC2 не зависит.", "s3a_c_acc2_liv_z": "В печени содержание ACC1 высокое. Образующийся при её участии малонил-CoA используется для синтеза жирных кислот и отчасти ингибирует CPT1. Точная доля малонил-CoA, достигающая CPT1, неизвестна; в модели она задана условно.", "s3a_c_ki": "В ACC остатки серина, которые фосфорилирует AMPK (у мыши S79 в ACC1 и S212 в ACC2), заменены аланином. AMPK активна, но ACC сохраняет активность. Поэтому содержание малонил-CoA высокое, синтез жирных кислот продолжается, а окисление ограничено.", "s3a_c_ki_z": "У таких мышей усилен синтез липидов в печени, развиваются стеатоз печени и инсулинорезистентность. При ожирении, вызванном высокожировой диетой, метформин не улучшает у них обмен липидов и чувствительность к инсулину (Fullerton 2013). Следовательно, фосфорилирование ACC под действием AMPK необходимо для регуляции обмена липидов и для этих эффектов метформина.", "s3a_c_eto": "Этомоксир необратимо ингибирует CPT1. Поэтому перенос ацильных групп длинноцепочечных жирных кислот в митохондрию блокирован даже при низком содержании малонил-CoA.", "s3a_c_eto_z": "Опыт показывает зависимость переноса ацильных групп длинноцепочечных жирных кислот в митохондрию от CPT1. Такая интерпретация допустима только при низкой дозе этомоксира: в высокой дозе он оказывает эффекты, не связанные с CPT1 (Divakaruni 2018).", "s3a_c_mcfa": "В печени октаноат (C8) проникает в матрикс без карнитинового челнока и активируется уже там. Малонил-CoA на его окисление не действует.", "s3a_c_mcfa_z": "В печени жирные кислоты средней длины могут окисляться и после приёма пищи. Среднецепочечные триглицериды применяют при некоторых нарушениях окисления длинноцепочечных жирных кислот. Эффект зависит от дефекта и ткани; такой подход применим не ко всем нарушениям.", "s3a_c_mcfa_eto": "Этомоксир ингибирует CPT1, однако октаноат окисляется: в печени его окисление не требует CPT1.", "s3a_c_mcfa_eto_z": "McGarry с соавторами (1977) показали, что малонил-CoA подавляет окисление олеата, но не октаноата. Это указывает на действие через CPT1, а не на непосредственное подавление β-окисления.", "s3a_c_mcfa_mus": "Малонил-CoA почти не подавляет окисление октаноата (C8). В печени октаноат проникает в матрикс без карнитинового челнока, тогда как в мышце требуется карнитин (Pereyra 2021). Это различие тканей в модели не показано.", "s3a_c_mcfa_mus_z": "Печень окисляет октаноат без карнитина, тогда как в сердце и мышцах карнитин необходим. У мышей без CPT2 в сердце диета с октаноатом не устранила поражение сердца (Pereyra 2021).", "s3a_c_futile": "Мысленный опыт: малонил-CoA не ингибирует CPT1. В печени после приёма пищи синтез и окисление жирных кислот протекают одновременно. Если окисляются только что синтезированные жирные кислоты, возникает холостой цикл.", "s3a_c_futile_z": "Для синтеза одной молекулы пальмитата расходуются 7 ATP и 14 NADPH. Если вновь синтезированный пальмитат сразу окисляется, эти затраты не приводят к запасанию липидов. Такая последовательность синтеза и окисления образует холостой цикл.", "s3a_take": "Малонил-CoA ингибирует CPT1 и тем самым определяет, поступят ли ацильные группы длинноцепочечных жирных кислот в митохондрии. ACC2 образует малонил-CoA вблизи CPT1, а AMPK, фосфорилируя ACC, ослабляет это ингибирование. Жирные кислоты средней длины в печени поступают в матрикс без карнитинового челнока, тогда как в мышце им необходим карнитин. Без ингибирования CPT1 синтез и окисление жирных кислот протекали бы одновременно.", "p3a_1_q": "Мышца после приёма пищи. Выключим ACC2, считая, что её утрата не компенсируется. Как изменится окисление жирных кислот?", "p3a_1_o1": "Снизится: ACC2 нужна для окисления жирных кислот", "p3a_1_o2": "Усилится: малонил-CoA вблизи CPT1 станет значительно меньше", "p3a_1_o3": "Не изменится, поскольку ACC1 присутствует", "p3a_1_e": "В мышце малонил-CoA вблизи CPT1 образует в основном ACC2 на наружной мембране митохондрии. Без ACC2 CPT1 почти не ингибируется, и окисление усиливается даже после приёма пищи (Abu-Elheiga 2001). В другой линии мышей малонил-CoA и окисление в мышце не изменились: авторы предполагают компенсацию (Olson 2010), но здесь она исключена.", "p3a_1_w1": "ACC2 образует малонил-CoA, ингибирующий CPT1. При отсутствии ACC2 ингибирование ослабевает, поэтому окисление увеличивается.", "p3a_1_w3": "В мышце содержание ACC1 низкое, и образующегося при её участии малонил-CoA недостаточно для компенсации отсутствия ACC2. Поэтому окисление усиливается. В другой линии мышей окисление в мышце не изменилось; авторы предполагают компенсацию (Olson 2010), но в рассматриваемом опыте она исключена.", "p3a_2_q": "У мышей остатки серина S79 в ACC1 и S212 в ACC2, которые фосфорилирует AMPK, заменены аланином. Активируем AMPK в печени таких мышей. Как сразу изменится синтез жирных кислот?", "p3a_2_o1": "Синтез снизится, как обычно", "p3a_2_o2": "Не изменится", "p3a_2_o3": "Синтез усилится", "p3a_2_e": "AMPK активна, но не может фосфорилировать ACC по S79 и S212, поэтому ACC сохраняет активность. Для быстрого подавления синтеза жирных кислот необходимо фосфорилирование ACC под действием AMPK (Fullerton 2013). Более медленные эффекты AMPK, связанные с экспрессией генов, в этом опыте не проверяются.", "p3a_2_w1": "Обычно AMPK подавляет синтез, фосфорилируя S79 в ACC1 и S212 в ACC2. Здесь оба остатка серина заменены аланином. Этот путь подавления нарушен, и синтез не снижается.", "p3a_2_w3": "AMPK не усиливает синтез липидов. В этом опыте она не может подавить ACC через показанные сайты фосфорилирования, поэтому синтез сохраняется на прежнем уровне.", "p3a_3_q": "Печень при голодании. Добавим этомоксир. Как изменится окисление пальмитата?", "p3a_3_o1": "Почти остановится", "p3a_3_o2": "Ускорится", "p3a_3_o3": "Не изменится", "p3a_3_e": "Этомоксир необратимо ингибирует CPT1. При отсутствии активности CPT1 ацильные группы длинноцепочечных жирных кислот не переносятся в матрикс.", "p3a_3_w2": "Этомоксир не ускоряет окисление, а блокирует перенос ацильных групп в митохондрию. Сначала пальмитат превращается в пальмитоил-CoA, затем CPT1 переносит его ацильную группу на карнитин. При ингибировании CPT1 окисление почти прекращается.", "p3a_3_w3": "Пальмитат — длинноцепочечная жирная кислота. Его ацильная группа поступает в матрикс только через карнитиновый челнок, первый этап которого катализирует CPT1. Поэтому ингибирование CPT1 этомоксиром почти прекращает окисление.", "p3a_4_q": "На фоне действия этомоксира добавим октаноат (C8). Будет ли он окисляться?", "p3a_4_o1": "Нет: CPT1 ингибирована", "p3a_4_o2": "Да: в печени октаноат окисляется без карнитинового челнока", "p3a_4_o3": "Да, но только с добавленным карнитином", "p3a_4_e": "В печени октаноат проникает в матрикс без карнитинового челнока и превращается в октаноил-CoA. Поэтому его окисление не зависит от CPT1 и её ингибирования малонил-CoA (McGarry 1977).", "p3a_4_w1": "Октаноат — жирная кислота со средней длиной цепи. В печени он проникает в матрикс без участия CPT1, превращается в октаноил-CoA и окисляется.", "p3a_4_w3": "В печени октаноат проникает в матрикс без карнитинового челнока и превращается там в октаноил-CoA; карнитин для этого не нужен. В мышце перенос октаноата требует карнитина (Pereyra 2021).", "p3a_5_q": "Мысленный опыт: малонил-CoA не ингибирует CPT1. Остальные условия соответствуют состоянию печени после приёма пищи. Как изменятся синтез и окисление жирных кислот?", "p3a_5_o1": "Окисление усилится, а синтез снизится", "p3a_5_o2": "Окисление усилится, а синтез останется высоким", "p3a_5_o3": "Ничего не изменится", "p3a_5_e": "ACC сохраняет активность, и малонил-CoA по-прежнему используется для синтеза жирных кислот. Поэтому синтез не снижается. Ингибирование CPT1 отсутствует, и окисление усиливается. Если окисляются только что синтезированные жирные кислоты, возникает холостой цикл: затраты ATP и NADPH на синтез не приводят к запасанию липидов.", "p3a_5_w1": "ACC активна, и малонил-CoA по-прежнему используется для синтеза жирных кислот, поэтому синтез не снижается. Единственное изменение — отсутствие ингибирования CPT1 малонил-CoA.", "p3a_5_w3": "Ингибирование CPT1 отсутствует, поэтому окисление усиливается. Синтез жирных кислот при этом сохраняется на прежнем уровне.", "s4_play": "Пуск", "s4_pause": "Пауза", "s4_starve": "Убрать аминокислоты", "s4_feed": "Вернуть аминокислоты", "s4_reset": "Сначала", "s4_time": "От начала опыта: {h} ч", "s4_time2": "От начала: {h} ч · без аминокислот: {s} ч", "s4_plotcap": "Учебная модель, относительные величины.", "s4a_plotcap": "График — контрольная чашка (−Б). Учебная модель, относительные величины.", "s4_mk_starve": "− аминокислоты", "s4_mk_feed": "+ аминокислоты", "s4_axis": "ч", "h_short": "ч", "s4_l_mtor": "mTORC1", "s4_l_auto": "лизосомное расщепление", "s4_l_form": "образование аутофагосом", "s4a_l_mtor": "mTORC1 (по p-S6K)", "s4_l_lyso": "свободные лизосомы", "s4_l_aa": "аминокислоты", "s4_r_ly": "свободные лизосомы", "s4_block": "Лизосомные протеазы заблокированы", "s4_leg_lyso": "лизосома", "s4_leg_ap": "аутофагосома", "s4_leg_al": "аутолизосома", "s4_leg_aa": "аминокислота", "s4_r_ap": "аутофагосомы", "s4_r_al": "аутолизосомы", "s4_c_fed": "При достаточном количестве аминокислот mTORC1 локализуется на лизосоме и активен. Аутофагия подавлена, а фосфорилированный TFEB удерживается в цитоплазме.", "s4_c_fed_z": "При поступлении аминокислот из внешней среды аутофагическое расщепление собственных белков подавлено.", "s4_c_fall": "Аминокислоты больше не поступают из среды. Внутриклеточный запас быстро расходуется на синтез белка, но активность mTORC1 пока сохраняется.", "s4_c_fall_z": "Пока внутриклеточного запаса аминокислот достаточно, активность mTORC1 сохраняется.", "s4_c_early": "В течение десятков минут содержание аминокислот в клетке снижается. mTORC1 покидает лизосому, и его ингибирующее действие на ULK1 прекращается. Образуются аутофагосомы, а TFEB перемещается в ядро.", "s4_c_early_z": "При отсутствии внешнего источника аминокислот усиливается использование внутреннего источника. В ходе аутофагии захватывается часть собственных белков и органелл.", "s4_c_auto": "Аутофагосомы сливаются с лизосомами, образуя аутолизосомы. Протеазы расщепляют белки до аминокислот, которые затем выходят в цитоплазму. Количество свободных лизосом уменьшается.", "s4_c_auto_z": "Аутофагическое расщепление поддерживает выживание клетки при дефиците аминокислот. Освобождённые аминокислоты используются для синтеза белка и энергообеспечения.", "s4_c_react": "Аминокислоты, освобождённые при аутофагическом расщеплении, повторно активируют mTORC1. Комплекс резко уменьшает образование новых аутофагосом и стимулирует восстановление лизосом. Из аутолизосом вытягиваются трубчатые структуры, от которых отделяются новые лизосомы.", "s4_c_react_z": "Повторная активация mTORC1 замыкает отрицательную обратную связь: аминокислоты, освобождённые при аутофагическом расщеплении, через mTORC1 уменьшают образование новых аутофагосом и тем самым ограничивают расщепление собственных компонентов клетки.", "s4_c_done": "Лизосомы восстановлены, а аутофагия ослаблена. Активность mTORC1 поддерживается аминокислотами, освобождёнными при аутофагическом расщеплении.", "s4_c_done_z": "Устанавливается новое равновесие. Восстановленные лизосомы могут участвовать в следующем этапе аутофагического расщепления, если дефицит аминокислот сохраняется.", "s4_c_block": "Лизосомные протеазы заблокированы. Аутолизосомы накапливаются, но аминокислоты не освобождаются. Активность mTORC1 не восстанавливается, и новые лизосомы не образуются из аутолизосом.", "s4_c_block_z": "При блокаде лизосомного расщепления содержимое аутолизосом накапливается, но аминокислоты не освобождаются. Сходное накопление наблюдается при лизосомных болезнях накопления.", "s4_c_refed": "После добавления аминокислот mTORC1 активен. Образование новых аутофагосом ограничено, а TFEB возвращается в цитоплазму.", "s4_c_refed_z": "Восстановление внешнего источника аминокислот существенно уменьшает расщепление собственных белков и органелл как источника аминокислот.", "s4b_take": "В учебной модели дефицит аминокислот подавляет mTORC1 за десятки минут, аутофагия усиливается в течение часов, а освобождённые аминокислоты через несколько часов повторно активируют mTORC1. В опытах Yu 2010 (клетки в среде без сыворотки и глутамина) активность mTORC1 восстанавливалась к 6 ч; сроки зависят от клеток и условий. Повторная активация mTORC1 резко уменьшает образование новых аутофагосом и стимулирует восстановление лизосом, а содержимое уже образовавшихся аутолизосом продолжает расщепляться. Блокада лизосомных протеаз разрывает эту обратную связь.", "p4b_1_q": "Удалим аминокислоты из среды. Как быстро снизится активность mTORC1?", "p4b_1_o1": "За десятки минут", "p4b_1_o2": "Через сутки", "p4b_1_o3": "Активность не снизится", "p4b_1_e": "При отсутствии аминокислот в среде их содержание в клетке быстро снижается. Сенсоры аминокислот передают этот сигнал, и активность mTORC1 снижается в течение десятков минут.", "p4b_1_w2": "Подавление активности mTORC1 в ответ на дефицит аминокислот происходит в течение десятков минут, а не суток.", "p4b_1_w3": "Активность mTORC1 зависит от доступности аминокислот. При их дефиците RagA/B переходят в GDP-форму, а mTORC1 покидает лизосому.", "p4b_2_q": "Дефицит аминокислот сохраняется. Как изменится активность mTORC1 через несколько часов?", "p4b_2_o1": "Останется неактивным до добавления аминокислот в среду", "p4b_2_o2": "Повторно активируется за счёт аминокислот, освобождённых при аутофагии", "p4b_2_o3": "Клетка погибнет", "p4b_2_e": "В аутолизосомах освобождаются аминокислоты, и через несколько часов они повторно активируют mTORC1, хотя в среду аминокислоты не добавляли (Tan 2017; у Yu 2010 — среда без сыворотки и глутамина).", "p4b_2_w1": "Аутофагия служит внутренним источником аминокислот. Они освобождаются в аутолизосомах и повторно активируют mTORC1 даже при отсутствии аминокислот во внешней среде.", "p4b_2_w3": "Модель не предсказывает гибели клетки в течение нескольких часов. При аутофагическом расщеплении освобождаются аминокислоты, и они повторно активируют mTORC1.", "p4b_3_q": "Лизосомные протеазы заблокированы. Восстановится ли активность mTORC1?", "p4b_3_o1": "Да, как обычно", "p4b_3_o2": "Нет: аминокислоты не освобождаются", "p4b_3_o3": "Активность восстановится быстрее", "p4b_3_e": "Аутофагосомы сливаются с лизосомами, но белки не расщепляются. Аминокислоты не освобождаются, и активность mTORC1 не восстанавливается. Следовательно, в условиях опыта Yu 2010 повторная активация mTORC1 требует лизосомного гидролиза.", "p4b_3_w1": "Повторную активацию mTORC1 поддерживают аминокислот
