при удвоенной ёмкости — 12 % (нагрузка/ёмкость 1,3). Исходная доля (серая метка на полосе) заметно ниже обеих величин, но не равна нулю: несоответствие уменьшилось, но не исчезло, и часть мРНК XBP1 по-прежнему сплайсируется. Доля сенсоров без BiP снизилась с 21 % до 11 %. Направление согласуется с данными, что избыток BiP подавляет активацию IRE1α (Sundaram 2018, клетки HEK293, Tg 12 мкМ или DTT 5 мМ) и что ко-шаперон ERdj4 вместе с BiP разрушает димер IRE1α (Amin-Wetzel 2017, клетки CHO). Числа — условный индекс модели.", "p2b_2_w1": "Вариант приписывает сигнал IRE1α одному лишь притоку белков. Сенсор отвечает на соотношение притока и ёмкости: больше шаперонов — больше развёрнутых белков связано с ними, меньше BiP отходит от сенсора, и при прежнем притоке сигнал слабее.", "p2b_2_w2": "Вариант принимает уменьшение сигнала за его исчезновение. При утроенном притоке отношение нагрузки к ёмкости остаётся выше исходного, и часть IRE1α остаётся активной; кроме того, исходная доля сплайсированной мРНК XBP1 не равна нулю.", "p2b_3_q": "Приток развёрнутых белков повысили вчетверо; состояние рассматривают через 2 ч. Как изменится ёмкость ЭПР к 24 ч при сохраняющемся притоке?", "p2b_3_o1": "Постепенно возрастёт: мишени XBP1s и ATF6f повышают содержание шаперонов.", "p2b_3_o2": "Останется прежней: ёмкость ЭПР — постоянное свойство клетки при любом притоке.", "p2b_3_o3": "Останется как к 2 ч: индукция генов шаперонов завершается уже за 2 ч.", "p2b_3_k": "Активные IRE1α и ATF6 повышают транскрипцию генов шаперонов и ERAD; накопление белков занимает часы, поэтому ёмкость ЭПР растёт постепенно, а не скачком.", "p2b_3_e": "В модели при вчетверо возросшем притоке ёмкость ЭПР составляет ×1,2 исходной на 2 ч и ×1,8 на 24 ч, нагрузка/ёмкость снижается с 2,3 до 2,0, а доля сплайсированной мРНК XBP1 — с 38 % до 9 %: сигнал IRE1α затухает, хотя несоответствие сохраняется. Подъём ёмкости идёт с постоянной времени порядка 10 ч (число подобрано по срокам пика мРНК BiP в HEK293: Lin 2007), спад после снятия стресса задан периодом полужизни белка BiP около 46 ч (Rutkowski 2006, МЭФ). Затухание IRE1α и ATF6 при стойком стрессе описано в клетках HEK293 при высоких дозах индукторов (Lin 2007: Tm, Tg; Sundaram 2018: Tg, DTT) и может отличаться в других клетках. Числа — условный индекс модели.", "p2b_3_w2": "Вариант считает ёмкость ЭПР неизменным свойством клетки. Гены шаперонов и ERAD — мишени XBP1s и ATF6f, и при стойкой нагрузке содержание их белков увеличивается; в этом состоит адаптивная часть UPR.", "p2b_3_w3": "Вариант допускает, что индукция завершается за 2 ч. После активации IRE1α и ATF6 нужно время на транскрипцию, трансляцию и накопление белков, и к 2 ч ёмкость ещё далека от значения, достигаемого позже.", "s2a_ind": "Индуктор стресса ЭПР", "s2a_ind_0": "Нет", "s2a_ind_tm": "Туникамицин", "s2a_ind_tg": "Тапсигаргин", "s2a_ind_dtt": "DTT", "s2a_ind_n_tm": "туникамицин", "s2a_ind_n_tg": "тапсигаргин", "s2a_ind_n_dtt": "DTT", "s2a_dose": "Доза (условная ступень)", "s2a_dose_lo": "Низкая", "s2a_dose_hi": "Высокая", "s2a_dn_lo": "низкая доза", "s2a_dn_hi": "высокая доза", "s2a_drugs": "Ингибиторы", "s2a_gsk": "GSK2606414 (PERK)", "s2a_u4": "4μ8C (РНКаза IRE1α)", "s2a_pf": "PF-429242 (S1P)", "s2a_geno": "Генотип клеток", "s2a_gt_wt": "Дикий тип", "s2a_gt_perk": "PERK⁻/⁻", "s2a_gt_ire1": "IRE1α⁻/⁻", "s2a_gt_atf6": "ATF6α⁻/⁻", "s2a_gt_xbp1": "XBP1⁻/⁻", "s2a_h_ind": "Об индукторах", "s2a_h_mod": "Об ингибиторах и мутантах", "s2a_instr": "Прибор", "s2a_in_graph": "Графики", "s2a_in_blot": "Блот", "s2a_take": "Ветви UPR отвечают на несоответствие нагрузки и ёмкости ЭПР по-разному, и ингибитор или мутация показывают роль звена. Потеря PERK снимает торможение трансляции и повышает нагрузку; потеря IRE1α убирает XBP1s, но ёмкость растёт и за счёт ATF6f; блок S1P оставляет ATF6 полноразмерным; ATF6f частично зависит от PERK. При стойком стрессе IRE1α и ATF6 затухают за часы (HEK293, высокие дозы), а PERK сохраняется: при высокой дозе CHOP остаётся высоким, при низкой снижается по мере роста ёмкости. Яркость полосы на блоте нелинейна: слабая полоса не означает отсутствия белка. Гибель клеток модель не рассчитывает.", "s2a_a4": "ATF4 {a} · CHOP {c}", "s2a_card_0": "Индуктор не добавлен", "s2a_card_i": "Индуктор: {n}", "s2a_card_d": "{d}, {t}", "s2a_card_m_tm": "блокирует N-гликозилирование", "s2a_card_m_tg": "истощает запасы Ca²⁺ в ЭПР", "s2a_card_m_dtt": "восстанавливает дисульфиды", "lg_u_chip": "овал с названием препарата — ингибитор добавлен; пунктирная рамка у звена показывает, какое звено заторможено", "s2a_r_atf4": "ATF4 (содержание), × исходного", "s2a_r_chop": "CHOP (содержание), × исходного", "s2a_r_p90": "ATF6 полноразмерный (p90), % исходного", "s2a_r_dom": "Индекс преобладания PERK/CHOP над IRE1/ATF6 (условный)", "s2a_dom_na": "не определён", "s2a_ref": "Серая метка — исходное состояние (без индуктора, дикий тип) в тот же момент; для ATF4 и CHOP — ×1. Индекс преобладания — условное соотношение вкладов PERK/CHOP и IRE1α/ATF6, а не доля гибели клеток; при слабом сигнале ветвей он не определён. В подписи ветвь названа активной, если активность PERK не ниже 20 % максимума, XBP1s не ниже 10 %, ATF6f не ниже 20 % максимума.", "s2a_g_t1": "Ветви UPR во времени, %: PERK-P (сплошная), XBP1s (штриховая), ATF6f (пунктир)", "s2a_g_t2": "Ёмкость ЭПР (сплошная) и нагрузка/ёмкость (штриховая), × исходного; логарифмическая шкала", "s2a_g_u": "ч", "s2a_g_hint": "Вертикальная линия — выбранный момент; значения на этот момент даны в таблицах под графиками. Ось времени — учебная модель, ступени дозы условны. Линии различаются начертанием, а не только цветом.", "s2a_g_ls": "Начертание линии", "s2a_g_line": "Показатель", "s2a_g_at": "на {t}", "s2a_ln_perk": "PERK-P, % максимума", "s2a_ln_xs": "XBP1s, % мРНК XBP1", "s2a_ln_af": "ATF6f, % максимума", "s2a_ln_cap": "Ёмкость ЭПР, × исходной", "s2a_ln_r": "Нагрузка/ёмкость, индекс", "s2a_b_t": "Блот: дорожки добавляет студент (до 6)", "s2a_b_empty": "Дорожек пока нет. Задайте условия опыта и нажмите «Добавить дорожку».", "s2a_b_hint": "Дорожка фиксирует состояние на момент нажатия кнопки. XBP1u и XBP1s — продукты ПЦР в геле, остальные полосы — иммуноблот, актин — контроль нанесения. Яркость полосы нелинейна (насыщение): слабая полоса не означает отсутствия белка, а небольшое различие в содержании на блоте не видно.", "s2a_blot_add": "Добавить дорожку", "s2a_blot_clear": "Очистить блот", "s2a_b_perkp": "PERK-P", "s2a_b_perk": "PERK", "s2a_b_xu": "XBP1u", "s2a_b_xs": "XBP1s", "s2a_b_p90": "ATF6 p90", "s2a_b_p50": "ATF6f p50", "s2a_b_pe": "p-eIF2α", "s2a_b_atf4": "ATF4", "s2a_b_chop": "CHOP", "s2a_b_bip": "BiP", "s2a_b_actin": "актин", "s2a_cond_0": "без индуктора, {t}", "s2a_cond_i": "{i}, {d}, {t}", "s2a_m_gsk": "GSK2606414 (ингибитор PERK)", "s2a_m_u4": "4μ8C (ингибитор РНКазы IRE1α)", "s2a_m_pf": "PF-429242 (ингибитор S1P)", "s2a_m_perk": "клетки PERK⁻/⁻", "s2a_m_ire1": "клетки IRE1α⁻/⁻", "s2a_m_atf6": "клетки ATF6α⁻/⁻", "s2a_m_xbp1": "клетки XBP1⁻/⁻", "s2a_my_t": "Определите образец по блоту", "s2a_my_p": "В образцах X, Y и Z отсутствует по одной из трёх ветвей UPR (PERK, IRE1α, ATF6α). Все образцы обработаны тапсигаргином в высокой дозе, блот сделан через 6 ч. Слева — две контрольные дорожки клеток дикого типа (WT).", "s2a_my_h0": "без Tg", "s2a_my_h1": "Tg", "s2a_my_g_ire1": "−IRE1", "s2a_my_g_atf6": "−ATF6", "s2a_my_g_perk": "−PERK", "s2a_my_k0": "WT: без индуктора, 6 ч", "s2a_my_k1": "WT: тапсигаргин (Tg), высокая доза, 6 ч", "s2a_my_kx": "{n}: клетки {g}, тапсигаргин, высокая доза, 6 ч", "s2a_my_kh": "X, Y, Z: клетки, в которых отсутствует одна из ветвей UPR; тапсигаргин, высокая доза, 6 ч", "s2a_my_h": "Генотипы образцов станут видны после показа ответа.", "s2a_my_h2": "Генотипы образцов показаны. Слабая полоса — не то же, что отсутствие полосы: сравните полосы ATF6 в образцах Y и Z.", "s2a_my_reads": "В загадке показан только блот: определите образец по полосам.", "s2a_c_myst": "На блоте две контрольные дорожки клеток дикого типа и три образца с тапсигаргином (высокая доза, 6 ч), в каждом из которых отсутствует одна ветвь UPR.", "s2a_c_myst_z": "Наличие и активность ветви оценивают по характерным признакам: для PERK это белок PERK, p-eIF2α выше базального уровня, ATF4 и CHOP; для IRE1α — XBP1s; для ATF6α — полноразмерный ATF6 (p90) и ATF6f.", "s2a_c_myst2": "Образец X — клетки IRE1α⁻/⁻ (нет полосы XBP1s), образец Y — клетки ATF6α⁻/⁻ (нет полос p90 и ATF6f), образец Z — клетки PERK⁻/⁻ (нет полос PERK, ATF4 и CHOP, p-eIF2α на базальном уровне).", "s2a_c_myst2_z": "В образце Z полоса ATF6f слабее, чем у WT, но видна: расщепление ATF6 частично зависит от PERK и p-eIF2α (Teske 2011). Ослабленная полоса при наличии p90 не означает потери ATF6.", "s2a_c_head0": "Индуктор не добавлен: клетки в исходном состоянии или с заданными воздействиями без стресса ЭПР.", "s2a_c_head": "{i}, {d}, {t} после добавления.", "s2a_tg_x": "XBP1s", "s2a_tg_a": "ATF6f", "s2a_tg_xa": "XBP1s и ATF6f", "s2a_c_cap": "Мишени {list} (гены шаперонов и ERAD) медленно повышают ёмкость ЭПР: к {t} она увеличилась в {ci}.", "s2a_f_gsk": "GSK2606414 ингибирует киназу PERK: в модели активность PERK равна нулю, p-eIF2α остаётся на базальном уровне, а общая трансляция при стрессе не тормозится.", "s2a_z_gsk": "Ингибитор убирает ответ PERK, но не причину стресса: при стрессе приток новых белков в ЭПР не снижается, поэтому нагрузка выше, чем без ингибитора (Harding 2000a), а ядерного ATF6f в первые часы меньше, так как для полной активации ATF6 нужна PERK (Teske 2011). IRE1α и ATF6 продолжают отвечать на несоответствие.", "s2a_f_u4": "4μ8C блокирует РНКазный домен IRE1α: сплайсинг мРНК XBP1 подавлен, XBP1s не образуется, а при стрессе IRE1α в модели по-прежнему образует активные формы (киназная часть сохранена).", "s2a_z_u4": "Ингибитор подавляет РНКазную функцию IRE1α; PERK и ATF6 продолжают отвечать на нагрузку, а ёмкость ЭПР при стрессе растёт медленнее, так как мишени XBP1s не индуцируются. RIDD модель не рассчитывает (Hollien 2009).", "s2a_f_pf": "PF-429242 подавляет протеазу S1P: при стрессе ATF6 в аппарате Гольджи расщепляется хуже, ядерный ATF6f образуется с меньшей скоростью, а полноразмерный ATF6 (p90) расходуется медленнее.", "s2a_z_pf": "Ингибитор действует на фермент, а не на сенсор: при стрессе ATF6 переносится в аппарат Гольджи, но не расщепляется. Блок неполный, а те же протеазы расщепляют SREBP, поэтому PF-429242 не специфичен для ATF6 (Ye 2000; Hawkins 2008).", "s2a_f_perk": "В клетках PERK⁻/⁻ нет киназы PERK: активность PERK равна нулю, p-eIF2α остаётся на базальном уровне, общая трансляция при стрессе не тормозится, ATF4 и CHOP в модели не индуцируются.", "s2a_z_perk": "В клетках Perk⁻/⁻ при стрессе синтез белка выше, стресс ЭПР сильнее (Harding 2000a), а содержание ядерного ATF6f в первые часы ниже (Teske 2011). В клетках образование CHOP усиливают и другие сигнальные пути (Ma 2002b), которых модель не рассчитывает.", "s2a_f_ire1": "В клетках IRE1α⁻/⁻ нет IRE1α: мРНК XBP1 не сплайсируется, XBP1s не образуется, и при стрессе ёмкость ЭПР в модели растёт за счёт ATF6f.", "s2a_z_ire1": "В МЭФ Ire1α⁻/⁻ индукция BiP сохраняется, но репортёр ATF6 не индуцируется (Lee 2002); индукция ERdj4, p58IPK и EDEM зависит от XBP1 (Lee 2003). В модели IRE1α и ATF6 считаются независимыми, что упрощает данные.", "s2a_f_atf6": "В клетках ATF6α⁻/⁻ нет ATF6α: на блоте нет полос p90 и ATF6f, а при стрессе ёмкость ЭПР в модели растёт за счёт XBP1s.", "s2a_z_atf6": "Мыши Atf6α⁻/⁻ жизнеспособны, но клетки хуже переносят стресс ЭПР; вклад ATF6α в индукцию шаперонов разные работы оценивают по-разному (Wu 2007; Yamamoto 2007; Lee 2003). ATF6β модель не рассчитывает.", "s2a_f_xbp1": "В клетках XBP1⁻/⁻ нет гена XBP1: нет ни XBP1u, ни XBP1s, IRE1α при стрессе активируется, но мРНК XBP1, служащая субстратом сплайсинга, отсутствует, и ёмкость ЭПР в модели растёт за счёт ATF6f.", "s2a_z_xbp1": "У мышей Xbp1⁻/⁻ нарушено развитие печени, и они гибнут (Reimold 2000); в МЭФ без XBP1 не индуцируются ERdj4 и p58IPK, а BiP индуцируется слабее (Lee 2003).", "s2a_c_multi": "Заданы воздействия: {list}.", "s2a_c_multi_z": "Каждое воздействие подавляет своё звено, поэтому сочетание показывает, какие ветви сохраняют активность. Ветви связаны (PERK усиливает расщепление ATF6, ёмкость растёт за счёт XBP1s и ATF6f), и результат нельзя получить сложением отдельных эффектов.", "s2a_when_2": "Прогноз на момент 2 ч после добавления индуктора; ось времени — учебная модель.", "s2a_when_6": "Прогноз на момент 6 ч после добавления индуктора; ось времени — учебная модель.", "s2a_when_24": "Прогноз на момент 24 ч после добавления индуктора; ось времени — учебная модель.", "s2a_when_24b": "Прогноз на момент 24 ч после добавления индуктора (сейчас показаны 2 ч); ось времени — учебная модель.", "s2a_when_my": "Блот сделан через 6 ч после добавления тапсигаргина; ось времени — учебная модель.", "s2a_ctl0": "без индуктора", "p2a_1_q": "Клетки дикого типа обработали тапсигаргином (высокая доза) и через 2 ч определили активность ветвей UPR. В другой пробе тапсигаргин заменили туникамицином в такой же высокой дозе. Как изменится активность ветвей к 2 ч?", "p2a_1_o1": "Не изменится: оба индуктора нарушают сворачивание белков в ЭПР, и активность ветвей определяет доза, а не механизм индуктора.", "p2a_1_o2": "Повысится: туникамицин нарушает гликозилирование всех белков ЭПР сразу, поэтому нагрузка нарастает быстрее.", "p2a_1_o3": "Снизится: при туникамицине нагрузка нарастает медленнее, и к этому сроку сенсоры активированы слабее.", "p2a_1_k": "Тапсигаргин быстро истощает запасы Ca²⁺ в ЭПР, а туникамицин блокирует N-гликозилирование и нарушает сворачивание лишь вновь синтезируемых гликопротеинов; нагрузка нарастает медленнее, и к 2 ч сенсоры активированы слабее.", "p2a_1_e": "В модели через 2 ч после добавления индуктора в высокой дозе активность PERK равна 69 % максимума при тапсигаргине и 35 % при туникамицине, доля сплайсированной мРНК XBP1 — 43 % и 30 %, ATF6f — 65 % и 16 % максимума; в исходном состоянии (серая метка) все три величины ниже. В модели различие задаёт один параметр — время нарастания нагрузки (4 ч для туникамицина, 9 мин для тапсигаргина); числа подобраны, а направление взято из работы Rutkowski 2006 (МЭФ): ответ на туникамицин развивался медленнее, чем на тапсигаргин, причина в работе не установлена. Дозы условны и не равны нМ или мкг/мл. К 24 ч состояния при двух индукторах в модели близки (шаг 6).", "p2a_1_w1": "Вариант принимает оба индуктора за одно и то же воздействие. Тапсигаргин и туникамицин нарушают сворачивание разными путями (истощение Ca²⁺ в ЭПР и блок N-гликозилирования) и с разной скоростью: в работе Rutkowski 2006 ответ на туникамицин развивался медленнее, поэтому при сравнимых условиях показания на 2 ч различаются.", "p2a_1_w2": "Вариант принимает число затронутых белков за меру скорости. Туникамицин блокирует гликозилирование вновь синтезируемых белков, и нагрузка накапливается по мере их синтеза, тогда как тапсигаргин быстро истощает запасы Ca²⁺ в ЭПР (Thastrup 1990); поэтому к 2 ч ответ на туникамицин слабее.", "p2a_2_q": "Клетки дикого типа обработали тапсигаргином (высокая доза); в параллельной пробе добавили ещё GSK2606414, ингибитор киназы PERK. Как изменится отношение нагрузки к ёмкости ЭПР через 2 ч?", "p2a_2_o1": "Возрастёт: без PERK общая трансляция не тормозится, и приток новых белков в ЭПР остаётся высоким.", "p2a_2_o2": "Снизится: PERK — сенсор стресса ЭПР, и при её ингибировании сигнал о нагрузке слабее, а сама нагрузка меньше.", "p2a_2_o3": "Не изменится: нагрузку создаёт тапсигаргин независимо от PERK, а киназа лишь передаёт сигнал.", "p2a_2_k": "PERK фосфорилирует eIF2α и тормозит общую трансляцию, а торможение уменьшает приток новых белков в ЭПР. Ингибитор прерывает эту обратную связь, и при том же индукторе нагрузка на ЭПР выше.", "p2a_2_e": "В модели через 2 ч при высокой дозе тапсигаргина нагрузка/ёмкость равна 5,2, а с GSK2606414 — 8,0. Активность PERK падает с 69 % до 0 %, p-eIF2α — с 75 % до 10 %, общая трансляция возрастает с 22 % до 100 % исходной. Направление согласуется с данными, что в клетках Perk⁻/⁻ при стрессе ЭПР синтез белка выше, а стресс ЭПР сильнее (Harding 2000a, МЭФ). Приток новых белков составляет часть нагрузки (допущение модели), поэтому нагрузка растёт не пропорционально трансляции. Модель принимает ингибитор за полное отсутствие активности PERK; GSK2606414 ингибирует и RIPK1, и KIT (Rojas-Rivera 2017; Mahameed 2019), поэтому эффект считают PERK-зависимым после проверки на клетках PERK⁻/⁻ (шаг 5). Числа — условный индекс модели.", "p2a_2_w2": "Вариант принимает сенсор за источник стресса. PERK передаёт сигнал о нагрузке и не создаёт её; при ингибировании PERK торможение трансляции исчезает, приток новых белков в ЭПР растёт, и нагрузка с ингибитором выше, а не ниже.", "p2a_2_w3": "Вариант считает связь однонаправленной. PERK воспринимает нагрузку, но её ответ — торможение трансляции — меняет приток белков в ЭПР, то есть саму нагрузку; без PERK эта обратная связь прерывается.", "p2a_3_q": "Клетки дикого типа и клетки IRE1α⁻/⁻ обработали тапсигаргином (высокая доза). Как ёмкость ЭПР в клетках IRE1α⁻/⁻ через 24 ч будет отличаться от ёмкости в клетках дикого типа?", "p2a_3_o1": "Ёмкость не вырастет: гены шаперонов и ERAD активирует лишь XBP1s, образование которого требует IRE1α.", "p2a_3_o2": "Ёмкость вырастет, но меньше: рост частично сохраняется за счёт ATF6f, а мишени XBP1s не индуцируются.", "p2a_3_o3": "Ёмкость вырастет так же: ATF6f полностью заменяет XBP1s, и потеря IRE1α на ёмкость не влияет.", "p2a_3_k": "IRE1α сплайсирует мРНК XBP1, а XBP1s активирует часть генов шаперонов и ERAD. Без IRE1α XBP1s не образуется, и ёмкость растёт лишь за счёт ATF6f, поэтому она остаётся ниже, чем в клетках дикого типа.", "p2a_3_e": "В модели через 24 ч при высокой дозе тапсигаргина ёмкость ЭПР равна ×2,4 исходной в клетках дикого типа и ×2,0 в клетках IRE1α⁻/⁻; доля сплайсированной мРНК XBP1 снижается с 9 % до 0 %, ATF6f в обоих случаях равен 33 % максимума, нагрузка/ёмкость — 3,2 и 3,7. Вклад XBP1s и ATF6f в рост ёмкости принят в модели равным; это допущение, потому что работы расходятся. В МЭФ Ire1α⁻/⁻ индукция BiP сохраняется (мРНК BiP лишь немного ниже: Lee 2002), индукция ERdj4, p58IPK и EDEM зависит от XBP1 (Lee 2003), а ATF6α нужен для индукции шаперонов у мышей (Yamamoto 2007). В тех же МЭФ репортёр ATF6 не индуцировался (Lee 2002), что указывает на связь ветвей; модель принимает IRE1α и ATF6 независимыми, и это упрощение. Числа — условный индекс модели.", "p2a_3_w1": "Вариант считает XBP1s единственным регулятором генов ёмкости. В МЭФ без IRE1α индукция BiP сохраняется (Lee 2002), а ATF6f активирует гены шаперонов (Yamamoto 2007), поэтому ёмкость растёт и без XBP1s.", "p2a_3_w3": "Вариант принимает частичную компенсацию за полную. Индукция ERdj4, p58IPK и EDEM зависит от XBP1 (Lee 2003); в клетках XBP1⁻/⁻ экспрессия ERdj4 и p58IPK при стрессе не индуцируется. Поэтому ATF6f не заменяет XBP1s целиком, и ёмкость остаётся ниже, чем в клетках дикого типа.", "p2a_4_q": "Клетки дикого типа обработали тапсигаргином (высокая доза); в параллельной пробе добавили ещё PF-429242, ингибитор протеазы S1P. Как изменится содержание полноразмерного ATF6 (p90) через 6 ч?", "p2a_4_o1": "Будет выше: не расщепляясь в аппарате Гольджи, полноразмерный ATF6 расходуется медленнее.", "p2a_4_o2": "Не изменится: ингибитор подавляет образование ATF6f, а на содержание полноразмерного белка не влияет.", "p2a_4_o3": "Будет таким же низким: при стрессе ATF6 покидает ЭПР, а S1P действует уже после этого перехода.", "p2a_4_k": "При стрессе ATF6 переносится в аппарат Гольджи, где протеазы S1P и S2P отщепляют ATF6f, и расщепление расходует полноразмерный белок. Если S1P подавлена, ATF6 не расщепляется, поэтому p90 остаётся выше, а ATF6f образуется меньше.", "p2a_4_e": "В модели через 6 ч при высокой дозе тапсигаргина полноразмерный ATF6 составляет 54 % исходного без ингибитора и 92 % с PF-429242; ATF6f — 81 % и 16 % максимума, а доля сплайсированной мРНК XBP1 одинакова (21 %). Остаточное образование ATF6f задано неполным блоком: PF-429242 — обратимый конкурентный ингибитор S1P (Hawkins 2008), а в клетках CHO без S1P блок расщепления ATF6 частичный (Ye 2000); доля остаточного расщепления в модели условна. Накопление p90 при блоке S1P — следствие механизма и допущение модели, а не измеренное значение. Те же протеазы расщепляют SREBP, поэтому PF-429242 не специфичен для ATF6 (Hawkins 2008). Числа — условный индекс модели.", "p2a_4_w2": "Вариант разделяет образование ATF6f и расход p90, хотя это один процесс: фрагмент отщепляется от полноразмерного белка протеазами S1P и S2P. При блоке S1P p90 расходуется медленнее, поэтому его содержание выше.", "p2a_4_w3": "Вариант путает перенос ATF6 в аппарат Гольджи с его расщеплением. S1P — протеаза, а не транспортёр, поэтому ингибитор не отменяет перенос, но мешает отщеплению ATF6f; нерасщеплённый p90 сохраняется.", "p2a_5_q": "Клетки дикого типа и клетки PERK⁻/⁻ обработали тапсигаргином (высокая доза). Как содержание ядерного ATF6f в клетках PERK⁻/⁻ через 6 ч будет отличаться от содержания в клетках дикого типа?", "p2a_5_o1": "Не будет отличаться: ATF6 и PERK — независимые ветви, расщепление ATF6 зависит от нагрузки.", "p2a_5_o2": "Будет выше: без PERK трансляция не тормозится, нагрузка больше, и ATF6 активируется сильнее.", "p2a_5_o3": "Будет ниже: для полной активации ATF6 нужно фосфорилирование eIF2α киназой PERK.", "p2a_5_k": "При стрессе ЭПР без PERK фосфорилирование eIF2α резко снижено, а для полной активации ATF6 оно необходимо; ядерного ATF6f образуется меньше, хотя активация ветви ATF6 не прекращается полностью.", "p2a_5_e": "В модели через 6 ч ATF6f составляет 81 % максимума в клетках дикого типа и 28 % в клетках PERK⁻/⁻, p-eIF2α — 41 % и 10 %; нагрузка/ёмкость без PERK выше (3,2 и 5,6). В работе Teske 2011 (МЭФ Perk⁻/⁻ и eIF2α S51A, печень мыши; Tm, Tg; 1–8 ч) содержание ядерного ATF6 к 6 ч было ниже более чем вдвое; активность репортёра ATF6 также была ниже; механизм влияния не установлен. Модель задаёт зависимость множителем расщепления без PERK — условным числом, подобранным под направление работы. Ингибитор GSK2606414 и генотип PERK⁻/⁻ в модели дают одинаковые показания (шаг 2); на блоте они различаются: белок PERK при ингибиторе есть, при PERK⁻/⁻ его нет. Числа — условный индекс модели.", "p2a_5_w1": "Вариант принимает ветви за независимые. Для полной активации ATF6 нужны PERK и p-eIF2α: в клетках Perk⁻/⁻ и с заменой eIF2α S51A ядерный ATF6 при стрессе снижен (Teske 2011). Независимость ветвей — упрощение, которое в этих условиях неверно.", "p2a_5_w2": "Вариант учитывает вклад нагрузки и не учитывает вклад PERK. Без PERK нагрузка действительно выше, а сенсоров без BiP больше, но на образование ATF6f влияет и p-eIF2α; в итоге ядерного ATF6f образуется меньше, а не больше.", "p2a_6_q": "Клетки дикого типа обработаны тапсигаргином (высокая доза), индуктор остаётся в среде. Как изменится доля сплайсированной мРНК XBP1 между 2 ч и 24 ч?", "p2a_6_o1": "Останется высокой: пока индуктор присутствует, IRE1α остаётся активной и сплайсирует мРНК XBP1.", "p2a_6_o2": "Снизится: активность IRE1α затухает за часы, хотя несоответствие нагрузки и ёмкости сохраняется.", "p2a_6_o3": "Возрастёт: сплайсированная мРНК XBP1 накапливается, как продукт реакции, пока длится стресс.", "p2a_6_k": "При стойком стрессе кластеры IRE1α распадаются, и IRE1α переходит в рефрактерное состояние; образование XBP1s снижается, хотя индуктор сохраняется. Пул полноразмерного ATF6 расходуется, и ATF6f убывает, тогда как PERK остаётся активной.", "p2a_6_e": "В модели при высокой дозе тапсигаргина доля сплайсированной мРНК XBP1 снижается с 43 % на 2 ч до 9 % на 24 ч, ATF6f — с 65 % до 33 % максимума, а PERK-P — с 69 % до 55 %. Нагрузка/ёмкость остаётся высокой (5,2 на 2 ч, 3,2 на 24 ч): несоответствие сохраняется, хотя ёмкость выросла. Затухание описано в клетках HEK293: кластеры IRE1α распадаются с 6 ч (Li 2010), сигнал IRE1 угасает в пределах 8 ч, а сигнал PERK сохраняется (Lin 2007); при Tg 12 мкМ фосфорилирование IRE1α (по сдвигу полосы при электрофорезе с Phos-tag) значительно возрастало к 1 ч и снижалось в пределах 6 ч, а содержание полноразмерного ATF6α в первые часы убывало (Sundaram 2018). Это результаты при высоких дозах в клетках HEK293: в других клетках и при слабом стрессе сроки могут отличаться, а пороги и константы модели подобраны. Числа — условный индекс модели.", "p2a_6_w1": "Вариант связывает активность IRE1α с присутствием индуктора. При стойком стрессе IRE1α переходит в рефрактерное состояние: кластеры распадаются, а фосфорилирование снижается (Li 2010; Sundaram 2018), поэтому сплайсинг ослабевает при сохраняющемся индукторе.", "p2a_6_w3": "Вариант принимает долю сплайсированной мРНК за накапливаемую величину. Она зависит от активности IRE1α в данный момент: когда IRE1α затухает, образование XBP1s снижается, и доля уменьшается, а не растёт.", "p2a_7_q": "Клетки дикого типа обработали тапсигаргином в низкой дозе и через 24 ч определили содержание CHOP. В другой пробе применили высокую дозу. Как изменится содержание CHOP через 24 ч?", "p2a_7_o1": "Возрастёт многократно: при высокой дозе несоответствие сохраняется, и сигнал PERK не затухает.", "p2a_7_o2": "Возрастёт умеренно, пропорционально дозе: содержание CHOP линейно отражает силу воздействия.", "p2a_7_o3": "Не изменится: к 24 ч CHOP возвращается к исходному уровню при любой дозе, так как ёмкость ЭПР выросла.", "p2a_7_k": "При низкой дозе ёмкость ЭПР растёт, отношение нагрузки к ёмкости снижается, активность PERK падает, и CHOP, быстро распадающийся без индукции, убывает. При высокой дозе несоответствие сохраняется, PERK остаётся активной, и CHOP поддерживается на высоком уровне.", "p2a_7_e": "В модели через 24 ч при низкой дозе тапсигаргина CHOP составляет ×4,7 исходного, PERK-P — 7 % максимума, общая трансляция — 91 % исходной, ёмкость ЭПР выросла до ×1,6; при высокой дозе CHOP равен ×63, PERK-P — 55 %, общая трансляция — 39 %. Различие создаёт ёмкость: при низкой дозе нагрузка/ёмкость к 24 ч снижается до 1,7, при высокой остаётся 3,2. В МЭФ при мягком воздействии (Tm 25 нг/мл, Tg 2,5 нМ) клетки выживают и делятся, повышение содержания CHOP временно, а белок BiP стабилен (период полужизни белка около 46 ч: Rutkowski 2006); в HEK293 при стойком Tm или Tg к 48 ч выживала лишь малая часть клеток дикого типа (Lin 2007). Модель не рассчитывает гибель клеток; индекс преобладания PERK/CHOP над IRE1/ATF6 условный и не равен доле гибели.", "p2a_7_w2": "Вариант принимает ответ за линейную функцию дозы. Содержание CHOP зависит от активности PERK, а она резко растёт, когда несоответствие нагрузки и ёмкости остаётся выше порога; при низкой дозе рост ёмкости возвращает отношение ниже порога, поэтому различие между дозами в показании CHOP намного больше, чем различие самих доз.", "p2a_7_w3": "Вариант переносит адаптацию при низкой дозе на любую дозу. Снижение CHOP требует, чтобы рост ёмкости уменьшил несоответствие; при высокой дозе этого не происходит, PERK остаётся активной (Lin 2007), и CHOP сохраняется. Даже при низкой дозе CHOP к 24 ч остаётся выше исходного.", "p2a_8_q": "На блоте образцов X, Y и Z (тапсигаргин, высокая доза, 6 ч) в каждом отсутствует одна из трёх ветвей UPR. Какая ветвь отсутствует в образце Z?", "p2a_8_o1": "IRE1α: в образце Z p-eIF2α не выше базального уровня, а eIF2α фосфорилируется киназой IRE1α.", "p2a_8_o2": "ATF6α: полоса ATF6f в образце Z слабее, чем у дикого типа, и это признак потери ATF6α.", "p2a_8_o3": "PERK: в образце Z нет полос PERK, ATF4 и CHOP, а XBP1s и ATF6f образуются.", "p2a_8_k": "При стрессе ЭПР eIF2α фосфорилируется прежде всего киназой PERK, и от этого зависят ATF4 и CHOP; потеря PERK видна по отсутствию PERK, ATF4 и CHOP при сохранении XBP1s и ATF6f. Потеря IRE1α убирает XBP1s, потеря ATF6α убирает p90 и ATF6f.", "p2a_8_e": "На дорожке Z нет полос PERK, ATF4 и CHOP, p-eIF2α остаётся на базальном уровне, как без индуктора, но XBP1s образуется, а ATF6 расщепляется. Полоса ATF6f слабее, чем у WT: в клетках без PERK расщепление ATF6 при стрессе снижено, но не прекращено (Teske 2011). В образце X есть XBP1u, но нет XBP1s — признак потери сплайсинга (IRE1α⁻/⁻); в образце Y нет ни p90, ни ATF6f — признак потери самого белка (ATF6α⁻/⁻). Яркость полосы на блоте нелинейно зависит от содержания белка из-за насыщения сигнала, поэтому слабая полоса не равна отсутствию белка. В модели ATF4 и CHOP в клетках PERK⁻/⁻ не индуцируются, а в клетках образование CHOP усиливают и другие сигнальные пути (Ma 2002b), поэтому в опыте слабая полоса CHOP на такой дорожке возможна.", "p2a_8_w1": "Вариант приписывает киназному домену IRE1α фосфорилирование eIF2α. При стрессе ЭПР eIF2α фосфорилируется киназой PERK; в образце X, где нет XBP1s, p-eIF2α, ATF4 и CHOP присутствуют, значит, потеря IRE1α их не лишает.", "p2a_8_w2": "Вариант принимает ослабленную полосу за отсутствующую. В образце Z видны и p90, и ATF6f: ATF6 расщепляется, хотя хуже. В образце Y нет ни p90, ни ATF6f — так выглядит потеря самого белка ATF6α.", "gn_u_perk": "PERK (EIF2AK3)", "g_u_perk": "PERK — трансмембранная киназа ЭПР: люминальный домен воспринимает нарушение сворачивания белков, а киназный домен фосфорилирует eIF2α по Ser51 и тормозит общую трансляцию (Harding 1999; Shi 1998). На схеме люминальный домен PERK находится в просвете ЭПР, киназный домен — в цитоплазме, и стрелка сигнала отходит от киназного домена. Показание «Активность PERK (PERK-P)» — доля фосфорилированной формы PERK от максимума модели вкладки 1; именно это значение передано модели ISR, поэтому числа вкладок 1 и 2 при одной активности PERK совпадают. В клетках Perk⁻/⁻ при стрессе ЭПР синтез белка выше, стресс ЭПР сильнее, а выживаемость ниже (Harding 2000a, МЭФ). Метка P на сенсоре означает фосфорилированную, активную форму PERK.", "gn_u_ire1": "IRE1α (ERN1)", "g_u_ire1": "IRE1α — трансмембранный белок ЭПР с киназным и РНКазным доменами. На схеме его люминальный домен обращён в просвет ЭПР, а киназный и РНКазный домены — в цитоплазму. При стрессе он собирается в олигомеры; РНКазный домен удаляет из мРНК XBP1 интрон из 26 нуклеотидов, и сдвиг рамки считывания даёт белок XBP1s (Yoshida 2001; Calfon 2002; Lee 2002). При длительном стрессе кластеры IRE1α распадаются, и сигнал затухает за часы — «таймер» IRE1α (Li 2010, клетки HEK293). Эндогенный IRE1α человека образует небольшие обратимые олигомеры, а не крупные кластеры, которые видны при сверхэкспрессии (Belyy 2022, клетки U-2 OS).", "gn_u_atf6": "ATF6 (ATF6α)", "g_u_atf6": "ATF6 синтезируется как мембранный белок ЭПР (p90); при стрессе он переносится в аппарат Гольджи, где протеазы S1P и S2P отщепляют цитоплазматический фрагмент ATF6f (p50), который попадает в ядро (Haze 1999; Ye 2000). На схеме показаны люминальный домен и цитоплазматический N-концевой фрагмент; перенос в аппарат Гольджи и расщепление изображены стрелкой и блоком «Гольджи: S1P, S2P». ATF6f связывается с элементами ERSE вместе с NF-Y и активирует гены шаперонов (Yoshida 2000). Для полной активации ATF6 нужны PERK и p-eIF2α: в клетках Perk⁻/⁻ ядерный ATF6f при стрессе снижен (Teske 2011, МЭФ и печень мыши). Вклад ATF6α в индукцию шаперонов разные лаборатории оценивают по-разному (Wu 2007; Yamamoto 2007; Lee 2003).", "gn_u_bip": "BiP (GRP78) и модель «отрыва BiP»", "g_u_bip": "BiP — шаперон ЭПР. В классической модели в покое он связан с люминальными доменами PERK, IRE1 и ATF6 и отходит от них при накоплении развёрнутых белков (Bertolotti 2000; Ma 2002a; Shen 2002). Схема упрощена: связь BiP с ATF6 относительно стабильна, а отрыв — регулируемый шаг (Shen 2005); связь BiP с IRE1α поддерживается динамическим циклом с ко-шапероном ERdj4 (Amin-Wetzel 2017); развёрнутые белки могут связываться с люминальными доменами IRE1α и PERK напрямую (Karagöz 2017; Wang 2018); в клетках HEK293 истощение BiP мало меняет эндогенные комплексы (Sundaram 2018). На схеме сдвиг и бледность значков BiP показывают долю сенсоров без BiP, одинаковую для всех трёх сенсоров.", "gn_u_load": "Развёрнутые белки (нагрузка)", "g_u_load": "Нагрузка — поток развёрнутых белков, которые должны быть свёрнуты или разрушены в ЭПР. В модели это условный индекс: 1 — исходное равновесие; он складывается из притока новых белков, зависящего от трансляции, и белков, уже находящихся в ЭПР. Туникамицин, тапсигаргин и DTT вызывают более слабые и менее специфичные ответы, чем нагрузка модельными развёрнутыми белками при том же росте BiP и HERP (Bergmann 2018, клетки HEK293), поэтому ручка «Нагрузка» — упрощение. Число красных значков на схеме иллюстрирует нагрузку и не равно числу молекул.", "gn_u_cap": "Шапероны (ёмкость ЭПР)", "g_u_cap": "Ёмкость ЭПР — способность системы фолдинга и деградации принимать развёрнутые белки: шапероны (BiP, ERdj4, p58IPK), ферменты фолдинга и ERAD, в том числе EDEM. В модели это условный индекс: 1 — исходная ёмкость. Усиление экспрессии генов-мишеней XBP1s и ATF6f медленно повышает эту ёмкость; в клетках МЭФ индукция ERdj4, p58IPK и EDEM зависит от XBP1 (Lee 2003), а у мышей ATF6α нужен для индукции шаперонов (Yamamoto 2007), поэтому вклад двух ветвей в модели принят равным. Белок BiP стабилен (период полужизни около 46 ч в МЭФ: Rutkowski 2006), и ёмкость снижается медленно.", "gn_u_eif2a": "eIF2α и фосфорилирование по Ser51", "g_u_eif2a": "Фосфорилирование α-субъединицы eIF2 по Ser51 киназой PERK (метка P) снижает активность eIF2B и образование тройного комплекса, и общая трансляция падает; одновременно избирательно усиливается трансляция ATF4 (Harding 2000b). Подробный механизм разобран на вкладке 1 (ISR). Здесь p-eIF2α и общая трансляция рассчитываются по той же модели, что на вкладке 1, при активности PERK, которую задаёт несоответствие нагрузки и ёмкости.", "gn_u_transl": "Общая трансляция и приток новых белков", "g_u_transl": "Торможение общей трансляции уменьшает приток вновь синтезируемых белков в ЭПР и тем самым нагрузку: в клетках Perk⁻/⁻ при стрессе ЭПР синтез белка выше, а стресс ЭПР сильнее (Harding 2000a, МЭФ). В модели приток новых белков составляет 40 % нагрузки (допущение), поэтому торможение трансляции снижает нагрузку лишь частично. Левый пунктир на схеме показывает эту обратную связь: его толщина следует за общей трансляцией.", "gn_u_xbp1": "Сплайсинг мРНК XBP1", "g_u_xbp1": "IRE1α удаляет из мРНК XBP1 интрон из 26 нуклеотидов; сдвиг рамки считывания приводит к синтезу белка XBP1s с новым C-концом. Именно XBP1s эффективно активирует UPR (Yoshida 2001; Calfon 2002; Lee 2002). Экзоны сшивает РНК-лигаза RTCB (Lu 2014b; Jurkin 2014). Показание «XBP1s» — доля сплайсированной мРНК XBP1 (на геле это полосы XBP1u и XBP1s); в исходном состоянии модель даёт небольшую долю, 4 %. Кроме XBP1, IRE1α разрушает часть других мРНК (RIDD); в клетках млекопитающих этот эффект умеренный (Hollien 2009, МЭФ), и в модель он не входит.", "gn_u_golgi": "Гольджи: протеазы S1P и S2P", "g_u_golgi": "При стрессе ATF6 переносится в аппарат Гольджи, где протеазы S1P и S2P, те же, что расщепляют SREBP, отщепляют ядерный фрагмент ATF6f: без S2P блок полный, без S1P частичный (Ye 2000). Показание «ATF6f в ядре» — содержание ядерного фрагмента в долях максимума модели; ATF6f исчезает при стойком стрессе за часы, когда пул полноразмерного ATF6 расходуется (Sundaram 2018, клетки HEK293).", "gn_u_genes": "Гены шаперонов и белков ERAD", "g_u_genes": "Мишени XBP1s и ATF6f: гены шаперонов (BiP, ERdj4, p58IPK), компонентов ERAD (EDEM) и других белков ЭПР. В МЭФ индукция ERdj4, p58IPK, HEDJ и EDEM зависит от XBP1, а индукция BiP — слабо; при нокдауне ATF6α или ATF6β дефекты минимальны (Lee 2003), тогда как у мышей ATF6α нужен для индукции шаперонов (Yamamoto 2007). Сверхэкспрессия XBP1s расширяет шероховатый ЭПР (Sriburi 2004), активный ATF6α тоже, но частично иным путём (Bommiasamy 2009). Правый пунктир на схеме показывает обратную связь: рост ёмкости уменьшает отношение нагрузки к ёмкости.", "gn_u_measure": "Как измеряют", "g_u_measure": "В эксперименте активность PERK и p-eIF2α определяют иммуноблотом с антителами к фосфорилированным формам (фосфорилированный PERK мигрирует медленнее; Sundaram 2018, phos-tag), сплайсинг XBP1 — по полосам XBP1u и XBP1s в геле после ПЦР, ATF6f — по ядерному фрагменту p50 на блоте. Нагрузку и ёмкость ЭПР напрямую не измеряют: это условные индексы модели, а доля сенсоров без BiP — упрощённый показатель модели, не измеренная величина. Полосы блота в модели зависят от количества белка нелинейно (насыщение сигнала): отсутствие полосы на плёнке не означает нулевого содержания белка. На базовом уровне прибора нет, показания рассчитывает модель; блот и графики — на продвинутом уровне.", "gn_u_model": "Что упрощено", "g_u_model": "Доля сенсоров без BiP — один общий показатель на три сенсора («модель отрыва BiP»); BiP лишь один из регуляторов (Shen 2005; Amin-Wetzel 2017; Karagöz 2017; Wang 2018). Пороги ветвей — допущение: в модели порог IRE1α ниже порога ATF6, а порог ATF6 ниже порога PERK, что подобрано для качественного согласия с затуханием IRE1α и ATF6 при сохранении PERK в клетках HEK293 при высоких дозах индукторов (Lin 2007; Sundaram 2018) и не измерено. Нагрузка и ёмкость — условные индексы; химические индукторы не равны нагрузке модельными белками (Bergmann 2018). Вклад XBP1s и ATF6f в рост ёмкости принят равным, хотя работы расходятся (Lee 2003; Yamamoto 2007; Wu 2007). Сроки в часах относятся к учебной модели: порядок величин взят из HEK293 и МЭФ (Li 2010; Lin 2007; Sundaram 2018; Rutkowski 2006), константы подобраны. Гибель клеток, RIDD и сигнал JNK не рассчитываются; показания ветви PERK рассчитываются по модели вкладки 1. Упрощения продвинутого уровня (независимость IRE1α и ATF6, CHOP без PERK, одинаковые показания ингибитора и генотипа) названы в справке «Ингибиторы и мутанты».", "gn_u_ind": "Индукторы стресса ЭПР", "g_u_ind": "Туникамицин блокирует первую стадию N-гликозилирования (фермент GlcNAc-1-P-трансферазу; Yoo 2018), тапсигаргин ингибирует Ca²⁺-АТФазу ЭПР (SERCA) и истощает запасы Ca²⁺ (Thastrup 1990), DTT восстанавливает дисульфидные связи (Braakman 1992). В работе Rutkowski 2006 ответ на туникамицин развивался медленнее, чем на тапсигаргин; причина не установлена, и в модели различие задано временем нарастания нагрузки. Ступени «низкая» и «высокая» условны и не равны концентрациям; в работах мягкому воздействию отвечали Tm 25 нг/мл и Tg 2,5 нМ (Rutkowski 2006), сильному — Tm 5 мкг/мл и Tg 500 нМ (Lin 2007). DTT обратим при отмывке (Braakman 1992), модель отмывку не рассчитывает; DTT восстанавливает и дисульфиды люминального домена ATF6 (Nadanaka 2007), поэтому его действие не сводится к нагрузке, и в модели при DTT синтез ATF6 снижен (Sundaram 2018). Брефельдин A в сцену не входит: он блокирует транспорт из ЭПР в аппарат Гольджи, переносит S1P и S2P в ЭПР (DeBose-Boyd 1999; Citterio 2008) и не относится к классическим индукторам, нарушающим сворачивание.", "gn_u_modif": "Ингибиторы и мутанты", "g_u_modif": "GSK2606414 ингибирует киназу PERK, 4μ8C — РНКазный домен IRE1α, PF-429242 — протеазу S1P. В клетках с генотипами PERK⁻/⁻, IRE1α⁻/⁻, ATF6α⁻/⁻ и XBP1⁻/⁻ соответствующий белок отсутствует. В модели ингибитор PERK и генотип PERK⁻/⁻ дают одинаковые показания, 4μ8C и IRE1α⁻/⁻ — тоже; различия видны на блоте (белок PERK при ингибиторе есть, при PERK⁻/⁻ его нет; XBP1u есть при 4μ8C и IRE1α⁻/⁻, но нет при XBP1⁻/⁻) и в биологии (киназная функция IRE1α, RIDD). Препараты неидеально избирательны, поэтому эффект считают специфичным после генетического подтверждения (Rojas-Rivera 2017; Mahameed 2019). Двойные воздействия модель считает, но данных о сочетаниях с участием PERK и IRE1α в прочитанных работах нет, поэтому такие результаты — прогноз модели. Упрощения продвинутого уровня: IRE1α и ATF6 в модели независимы, хотя в МЭФ Ire1α⁻/⁻ репортёр ATF6 не индуцировался (Lee 2002); в клетках PERK⁻/⁻ ATF4 и CHOP в модели не индуцируются, тогда как образование CHOP усиливают и другие сигнальные пути (Ma 2002b); индекс преобладания PERK/CHOP над IRE1/ATF6 условный и не равен доле гибели клеток.", "gn_u_gsk": "GSK2606414 (ингибитор PERK)", "g_u_gsk": "GSK2606414 — АТФ-конкурентный ингибитор киназы PERK (Axten 2012). В модели он обнуляет активность PERK: p-eIF2α остаётся на базальном уровне, общая трансляция не тормозится, ATF4 и CHOP не индуцируются. Препарат ингибирует также RIPK1 (Rojas-Rivera 2017) и KIT независимо от PERK (Mahameed 2019), поэтому эффект считают PERK-зависимым после проверки на клетках PERK⁻/⁻. На блоте при ингибиторе виден белок PERK без метки P.", "gn_u_4u8c": "4μ8C (ингибитор РНКазы IRE1α)", "g_u_4u8c": "4μ8C образует основание Шиффа с Lys907 РНКазного домена IRE1 и блокирует доступ субстрата: сплайсинг мРНК XBP1 и RIDD подавлены, киназный домен при этом сохраняется (Cross 2012; Sanches 2014). Блок показан в репортёрных клетках CHO (Amin-Wetzel 2017); побочные мишени не изучены. В модели 4μ8C даёт те же показания, что IRE1α⁻/⁻: XBP1s не образуется, XBP1u на геле остаётся.", "gn_u_pf": "PF-429242 (ингибитор S1P)", "g_u_pf": "PF-429242 — обратимый конкурентный ингибитор протеазы S1P (Hawkins 2008). Протеазы S1P и S2P отщепляют ATF6f в аппарате Гольджи, поэтому при блоке ядерный ATF6f образуется хуже, а полноразмерный ATF6 расходуется медленнее. Блок неполный (в клетках CHO без S1P он частичный, без S2P полный: Ye 2000), и в модели остаётся условная доля расщепления. Те же протеазы расщепляют SREBP, так что препарат не специфичен для ATF6 (Hawkins 2008). Ceapin-A7 блокирует ATF6α иначе — удерживает его в ЭПР (Gallagher 2016); в сцену он не входит.", "gn_u_atf4": "ATF4 и CHOP", "g_u_atf4": "p-eIF2α избирательно усиливает трансляцию ATF4, а ATF4 активирует транскрипцию CHOP (Harding 2000b). Строка на схеме показывает содержание белков в кратности исходного (×1), рассчитанное моделью вкладки 1 (ISR) при активности PERK, которую задаёт несоответствие нагрузки и ёмкости. Промотор CHOP содержит и элемент ERSE (Ma 2002b), то есть CHOP индуцируют не только PERK и ATF4; модель этих входов не рассчитывает, и в клетках PERK⁻/⁻ CHOP в ней остаётся на исходном уровне — это упрощение. Белок CHOP быстро распадается (период полужизни не более 4 ч: Rutkowski 2006), поэтому его содержание следует за активностью PERK.", "s3_cyto": "Цитоплазма", "s3_nuc": "Ядро", "s3_synth_1": "синтез", "s3_synth_2": "NRF2", "s3_tonuc_1": "NRF2 вне комплекса", "s3_tonuc_2": "перемещается в ядро", "s3_indep": "без KEAP1", "s3_prot": "Протеасома", "s3_keap1": "KEAP1 (димер)", "s3_act": "активность {u} %", "s3_pin_1": "сенсорные Cys", "s3_pin_a": "C151 (BTB)", "s3_pin_a_mut": "C151S", "s3_pin_b": "C273, C288 (IVR)", "s3_pin_b_mut": "C273A или C288A", "s3_pin_c": "прочие Cys", "s3_elec": "электрофил", "s3_oxid": "окислитель", "s3_none": "нет", "s3_f1_2": "фаза II (по NQO1)", "s3_f2_2": "синтез GSH", "s3_conj_1": "конъюгат", "s3_conj_2": "с GSH", "s3_out": "выведение", "s3_how": "Как измеряют", "s3_lim": "Что упрощено", "lg_n_pin": "кружок на KEAP1 — сенсорный цистеин; чем темнее заливка, тем больше доля его модифицированной формы", "lg_n_dots": "точки — электрофил в клетке (иллюстрация: число точек следует за содержанием электрофила, но не равно числу молекул)", "lg_n_gauge": "полоса под названием гена — содержание белка на логарифмической шкале (от ×0,1 до ×20); риска — исходный уровень (×1)", "s3_r_mod": "Модифицированные сенсорные цистеины, доля", "s3_r_act": "Убиквитинирующая активность KEAP1–CUL3, % исходной", "s3_r_sat": "KEAP1, связанный с NRF2, доля KEAP1 (модель)", "s3_r_nrf2": "NRF2 (белок), относительно исходного", "s3_r_nqo1": "NQO1 (белок), относительно исходного", "s3_r_hmox1": "HMOX1 (белок), относительно исходного", "s3_r_gsh": "Восстановленный GSH, % исходного", "s3_r_c151": "Модифицированный C151, доля", "s3_r_ivr": "Модифицированные C273 и C288, доля", "s3_r_oth": "Модифицированные прочие Cys, доля", "s3b_dose": "Электрофил (доза)", "s3b_time": "Время после добавления", "s3b_echo": "доза {d}; прошло {t}", "s3b_ref": "Серая метка на полосе — клетка дикого типа без электрофила. Содержание NRF2, NQO1 и HMOX1 показано на логарифмической шкале от ×0,1 до ×20 (метка — ×1). Время — часы учебной модели. Доля KEAP1, связанного с NRF2, — расчёт модели, а не измерение.", "s3b_when": "Прогноз на заданный момент после добавления электрофила; ось времени — часы учебной модели.", "s3b_c_ref": "Электрофила нет: убиквитинирующая активность KEAP1–CUL3 исходная ({a}), содержание NRF2 ({n}), NQO1 ({q}), HMOX1 ({h}) и GSH ({g}) исходное.", "s3b_c_ref_z": "В исходных условиях NRF2 синтезируется постоянно и быстро убиквитинируется (период полужизни около 13 мин в клетках гепатомы мыши Hepa; Stewart 2003), поэтому белка мало, а мишени ARE экспрессируются на базальном уровне.", "s3b_c_zero": "Электрофил ({d}) добавлен, но сенсорные цистеины ещё не модифицированы (доля {m}): активность KEAP1–CUL3 ({a}) и содержание NRF2 ({n}) почти исходные.", "s3b_c_zero_z": "В модели электрофил сначала должен войти в клетку и прореагировать с цистеинами, поэтому сразу после добавления показания не отличаются от исходных.", "s3b_c_start": "Электрофил ({d}) модифицирует сенсорные цистеины (доля {m}), активность KEAP1–CUL3 снижена до {a}. NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) пока близки к исходному.", "s3b_c_start_z": "Сначала модифицируются сенсорные цистеины и снижается убиквитинирующая активность комплекса; содержание NRF2 и белков-мишеней меняется позже.", "s3b_c_up": "NRF2 накапливается ({n}): сенсорные цистеины модифицированы (доля {m}), активность KEAP1–CUL3 снижена до {a}, синтез NRF2 не изменён. NQO1 — {q}, HMOX1 — {h}.", "s3b_c_up_z": "NRF2 синтезируется с прежней скоростью, но убиквитинируется медленнее: вновь синтезированный NRF2 связывается со свободным KEAP1 и накапливается. Содержание продуктов генов с ARE повышается позже содержания NRF2: нужно время на синтез мРНК и белка (задержка в модели — допущение).", "s3b_c_down": "Содержание NRF2 достигло максимума и теперь снижается (сейчас {n}): электрофила остаётся меньше, доля модифицированных цистеинов уменьшается ({m}), активность KEAP1–CUL3 восстанавливается ({a}). NQO1 — {q}, HMOX1 — {h}.", "s3b_c_down_z": "Обратная связь: мишени NRF2 — ферменты фазы II, в том числе GST, — и GSH ускоряют выведение электрофила; в модели это ускорение рассчитано по содержанию NQO1. Цистеины возвращаются в исходное состояние, убиквитинирование NRF2 восстанавливается, и содержание NRF2 снижается.", "s3b_g_low": "Содержание GSH снижено до {g} исходного: GSH реагирует с электрофилом.", "s3b_g_high": "Содержание GSH выше исходного ({g}): повышено содержание GCLM, продукта гена-мишени NRF2 ({c}), синтез GSH ускорен.", "s3b_take": "Электрофил модифицирует сенсорные цистеины KEAP1 и подавляет убиквитинирующую активность комплекса CUL3–KEAP1. Синтез NRF2 при этом не меняется: белок накапливается, потому что убиквитинируется медленнее и связывается со свободным KEAP1; в клетках NRF2 при этом остаётся связанным с KEAP1 (Kobayashi 2006; Baird 2013), хотя часть работ описывает диссоциацию комплекса (Itoh 2003). Содержание продуктов генов-мишеней NRF2 — NQO1, HMOX1, GCLC и GCLM — повышается с задержкой, а ферменты фазы II и GSH ускоряют выведение электрофила: ответ затухает. Числа и времена в модели — допущения учебной модели, а не измерения.", "p3b_1_q": "Клетки дикого типа культивируют без электрофила. К ним добавляют электрофил в дозе 50 % шкалы и через 2 ч измеряют убиквитинирующую активность комплекса KEAP1–CUL3. Как она изменится по сравнению с исходной?", "p3b_1_o1": "Снизится: электрофил модифицирует сенсорные цистеины KEAP1.", "p3b_1_o2": "Не изменится: электрофил лишь отделяет NRF2 от KEAP1.", "p3b_1_o3": "Повысится: модифицированный KEAP1 убиквитинирует сильнее.", "p3b_1_k": "Электрофил присоединяется к тиоловым группам сенсорных цистеинов KEAP1. Модифицированный комплекс CUL3–KEAP1 хуже убиквитинирует NRF2: его убиквитинирующая активность падает, а содержание NRF2 возрастает.", "p3b_1_e": "Через 2 ч модифицировано 86 % сенсорных цистеинов, убиквитинирующая активность KEAP1–CUL3 снижена со 100 % до 18 %, содержание NRF2 выросло от ×1,0 до ×2,6. Синтез NRF2 в модели не менялся: белок накапливается, потому что убиквитинируется медленнее. Подавление убиквитинирования NRF2 при модификации цистеинов KEAP1 показано в клетках (Zhang 2004; Kobayashi 2006). Числа — расчёт учебной модели, а не измерения.", "p3b_1_w2": "Ответ следует схеме «электрофил отделяет NRF2 от KEAP1». В клетках комплекс при этом сохраняется (Kobayashi 2006; Baird 2013): электрофил изменяет сам KEAP1, и пропущенное звено здесь — снижение активности лигазы. Прямое ослабление связи показано в других условиях (Itoh 2003); спор не закрыт, но в этой модели NRF2 остаётся связанным, а накопление объясняет сниженная активность лигазы.", "p3b_1_w3": "Модификация цистеинов не усиливает, а подавляет убиквитинирующую активность: она снижается до 18 %, NRF2 убиквитинируется реже и накапливается при неизменном синтезе. Рост активности привёл бы к снижению содержания NRF2 ниже исходного. Количество KEAP1 и CUL3 при действии электрофила не меняется (Iso 2016; диэтилмалеат, пять мышиных линий).", "p3b_2_q": "К клеткам дикого типа добавили электрофил в дозе 50 % шкалы. Как через 1 ч после добавления изменятся содержание белка NRF2 и содержание белка NQO1, продукта гена-мишени NRF2, относительно исходного?", "p3b_2_o1": "Содержание NQO1 вырастет сильнее, чем NRF2: электрофил сам активирует ARE.", "p3b_2_o2": "Содержание NRF2 уже повысится, а NQO1 почти не изменится: для синтеза белка нужно время.", "p3b_2_o3": "Содержание обоих белков не изменится: цистеины за 1 ч ещё не успеют модифицироваться.", "p3b_2_k": "NRF2 накапливается быстро: он синтезируется постоянно, и при сниженной убиквитинирующей активности его разрушение замедляется. NQO1 — продукт гена-мишени: для него нужны накопление NRF2 в ядре, транскрипция гена и синтез белка, поэтому содержание NQO1 отстаёт.", "p3b_2_e": "К 1 ч убиквитинирующая активность KEAP1–CUL3 снижена до 39 %, содержание NRF2 выросло от ×1,0 до ×1,5, а NQO1 (×1,0) и HMOX1 (×1,1) почти не изменились. В клетках гепатомы Hepa при действии CdCl₂ (50 мкМ) рост белка NRF2 был заметен уже через 30 мин, до накопления мРНК HMOX1 (Stewart 2003), а белок HMOX1 появлялся к 2 ч (He 2001). Это измерения для кадмия, а не для электрофила; задержки мишеней в модели — допущение.", "p3b_2_w1": "Гетеродимер NRF2–sMAF связывается с ARE (Itoh 1997), поэтому экспрессию гена NQO1 активирует именно NRF2, а не сам электрофил: сначала должен накопиться NRF2, затем пройти синтез мРНК и белка. На шкале NQO1 через 1 ч ещё ×1,0 при NRF2 ×1,5.", "p3b_2_w3": "К 1 ч модифицировано уже 64 % сенсорных цистеинов, и этого достаточно для снижения активности комплекса до 39 %. NRF2 синтезируется постоянно, поэтому после снижения убиквитинирования он накапливается уже к 1 ч (×1,5).", "p3b_3_q": "К клеткам дикого типа добавили электрофил в дозе 50 % шкалы. Через 3 ч содержание восстановленного глутатиона (GSH) ниже исходного. Как изменится содержание GSH к 12 ч после добавления относительно исходного?", "p3b_3_o1": "Останется сниженным: электрофил связывает GSH, а новый не синтезируется.", "p3b_3_o2": "Вернётся к исходному, но не превысит его: пул GSH лишь восполняется.", "p3b_3_o3": "Превысит исходное: NRF2 повышает экспрессию GCLC и GCLM, и синтез GSH растёт.", "p3b_3_k": "Содержание GSH сначала снижается, потому что он расходуется в реакции с электрофилом. Накопившийся NRF2 повышает экспрессию генов GCLC и GCLM, кодирующих каталитическую и модифицирующую субъединицы глутамат-цистеинлигазы — фермента первого этапа синтеза GSH. Когда электрофила остаётся мало, синтез GSH превышает расход, и его содержание поднимается выше исходного.", "p3b_3_e": "К 3 ч GSH снижен до 78 % исходного, к 12 ч в модели достигает 124 %: содержание GCLM (мишень NRF2) выросло до ×1,7, NQO1 — от ×1,6 до ×2,5, а NRF2 снизился от ×3,4 до ×2,3. В гепатоцитах человека сульфорафан сначала снижал содержание восстановленного GSH (в течение 3–6 ч), а к 24 ч оно повышалось (Wang 2015); в гепатоцитах мыши повышение GSH под действием сульфорафана зависело от Nrf2 (Toyama 2011). В этих работах описана качественная форма ответа; величина 124 % — допущение модели.", "p3b_3_w1": "Расход GSH ограничен количеством электрофила в клетке: к 12 ч электрофил в значительной мере выведен. Пропущено звено синтеза: накопленный NRF2 повышает содержание GCLC и GCLM, и синтез GSH ускоряется (на схеме GCLM ×1,7).", "p3b_3_w2": "Если бы содержание GCLC и GCLM не менялось, пул GSH вернулся бы к исходному уровню и остановился. Но содержание белков-мишеней NRF2 растёт (GCLM ×1,7), и уровень, к которому возвращается пул GSH, оказывается выше исходного.", "s3a_ind": "Индуктор", "s3a_ind_none": "нет", "s3a_ind_sfn": "сульфорафан", "s3a_ind_tbhq": "tBHQ", "s3a_ind_dmf": "диметилфумарат", "s3a_ind_hne": "4-HNE", "s3a_ind_h2o2": "H₂O₂", "s3a_el_sfn": "сульфорафан", "s3a_el_tbhq": "tBHQ→TBQ", "s3a_el_dmf": "DMF", "s3a_el_hne": "4-HNE", "s3a_el_h2o2": "H₂O₂", "s3a_dose": "Индуктор (доза)", "s3a_time": "Время после добавления", "s3a_geno": "Генотип клеток", "s3a_gt_wt": "дикий тип", "s3a_gt_c151s": "KEAP1 C151S", "s3a_gt_ivr": "KEAP1 C273A/C288A", "s3a_gt_keap1ko": "Keap1⁻/⁻", "s3a_gt_nrf2ko": "Nrf2⁻/⁻", "s3a_gt_etge": "NRF2 с заменой в ETGE", "s3a_g_drugs": "Воздействия на путь", "s3a_p62": "Накопление p62", "s3a_mg": "MG132 (ингибитор протеасомы)", "s3a_chx": "Циклогексимид (ингибитор трансляции)", "s3a_myst_b0": "Загадка: три образца", "s3a_myst_b1": "Раскрыть образцы", "s3a_myst_b2": "Вернуться к опытам", "s3a_myst_svg1": "Загадка: образцы X, Y и Z", "s3a_myst_svg2": "Схема скрыта: условия определите по блоту", "s3a_dv_p62": "накопление p62", "s3a_dv_mg": "MG132", "s3a_dv_chx": "циклогексимид", "s3a_none_w": "воздействий нет", "s3a_after": "через {t}", "s3a_sh_ctl": "контроль", "s3a_sh_now": "сейчас", "s3a_sh_wt": "WT", "s3a_sh_c151s": "C151S", "s3a_sh_ivr": "IVR", "s3a_sh_keap1ko": "Keap1⁻/⁻", "s3a_sh_nrf2ko": "Nrf2⁻/⁻", "s3a_sh_etge": "ETGE", "s3a_sh_sfn": "SFN", "s3a_sh_tbhq": "tBHQ", "s3a_sh_dmf": "DMF", "s3a_sh_hne": "HNE", "s3a_sh_h2o2": "H₂O₂", "s3a_sh_p62": "p62", "s3a_sh_mg": "MG132", "s3a_sh_chx": "CHX", "s3a_b_actin": "актин", "s3a_blot_t": "Иммуноблот (расчёт модели)", "s3a_blot_add": "Добавить на блот", "s3a_blot_clear": "Очистить блот", "s3a_k_ctl": "контроль — дикий тип, воздействий нет", "s3a_k_hidden": "условия скрыты", "s3a_blot_hint": "Каждая дорожка — отдельный опыт в условиях, перечисленных под блотом. Дорожка «сейчас» показывает условия, заданные элементами управления; кнопка «Добавить на блот» сохраняет её (до шести дорожек). Полосы — расчёт модели на логарифмической шкале; полосы KEAP1 и актина нужны для опознания образцов и контроля нанесения белка.", "s3a_blot_hint_m": "Дорожка «контроль» — клетки дикого типа без воздействий. Образцы X, Y и Z получены в один момент: по полосам видно, есть ли KEAP1 и каково содержание NRF2 и белков, кодируемых его генами-мишенями. Полосы — расчёт модели на логарифмической шкале.", "s3a_plot_t": "Содержание белков во времени в текущих условиях (расчёт модели)", "s3a_plot_aria": "График: содержание NRF2, NQO1 и HMOX1 относительно исходного за 12 ч в текущих условиях; значения на курсоре времени и максимумы указаны в таблице под графиком.", "s3a_unit_h": "ч", "s3a_tb_cap": "Содержание NRF2, NQO1 и HMOX1 относительно исходного в текущих условиях", "s3a_tb_name": "Белок", "s3a_tb_now": "Сейчас ({t})", "s3a_tb_max": "Максимум за {h} ч", "s3a_tb_flat": "почти не меняется", "s3a_tb_sample": "Образец", "s3a_tb_has": "есть", "s3a_tb_no": "нет", "s3a_myst_tt": "Образцы после раскрытия (расчёт модели)", "s3a_ref": "Серая метка на полосе — клетка дикого типа без воздействий (×1). Содержание NRF2, NQO1 и HMOX1 показано на логарифмической шкале от ×0,1 до ×20. Доли модифицированных цистеинов и доля KEAP1, связанного с NRF2, — расчёт модели, а не измерение. Время — часы учебной модели.", "s3a_when": "Прогноз на заданный момент после добавления воздействия; ось времени — часы учебной модели.", "s3a_c_ref": "Воздействий нет: убиквитинирующая активность KEAP1–CUL3 исходная ({a}), содержание NRF2 ({n}), NQO1 ({q}), HMOX1 ({h}) и GSH ({g}) исходное.", "s3a_c_ref_z": "В исходных условиях NRF2 синтезируется постоянно и быстро убиквитинируется комплексом CUL3–KEAP1 (период полужизни около 13 мин в клетках гепатомы мыши Hepa; Stewart 2003): белка мало, мишени ARE экспрессируются на базальном уровне. Выберите индуктор, генотип или препарат и сравните дорожки блота с контролем.", "s3a_c_g_c151s": "В KEAP1 остаток C151 заменён на серин, воздействий нет: убиквитинирующая активность KEAP1–CUL3 ({a}), содержание NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) исходные.", "s3a_c_g_c151s_z": "Замена C151S сохраняет репрессию NRF2 (Yamamoto 2008), поэтому в модели без индуктора показания исходные. Замена проявляется при добавлении индуктора, который действует через C151 (Takaya 2012).", "s3a_c_g_ivr": "В KEAP1 заменены остатки C273 и C288, воздействий нет: убиквитинирующая активность KEAP1–CUL3 снижена до {a}, содержание NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) повышено.", "s3a_c_g_ivr_z": "Остатки C273 и C288 нужны для самой репрессии NRF2, а не только для ответа на электрофил: у трансгенных мышей Keap1(C273A) и Keap1(C288A) не подавляли активацию NRF2, конститутивную при отсутствии Keap1 (Yamamoto 2008). Поэтому такие замены нельзя считать лишь потерей сенсорной функции; остаточная активность мутантного KEAP1 в модели — допущение.", "s3a_c_g_keap1ko": "Клетки Keap1⁻/⁻: KEAP1 нет (убиквитинирующая активность {a}), содержание NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) повышено.", "s3a_c_g_keap1ko_z": "Без KEAP1 в модели остаётся KEAP1-независимая ветвь деградации NRF2 (GSK-3 и β-TrCP; Rada 2011), и NRF2 накапливается. У мышей Keap1⁻/⁻ NRF2 активирован конститутивно, они погибают после рождения, и гибель устраняется нокаутом Nrf2 (Wakabayashi 2003).", "s3a_c_g_nrf2ko": "Клетки Nrf2⁻/⁻: NRF2 нет ({n}), убиквитинирующая активность KEAP1–CUL3 исходная ({a}); NQO1 ({q}) и HMOX1 ({h}) ниже исходного.", "s3a_c_g_nrf2ko_z": "Мыши Nrf2⁻/⁻ жизнеспособны (Chan 1996), но исходная и индуцируемая активность ферментов фазы II у них снижена (Ramos-Gomez 2001; McMahon 2001). В модели часть NQO1 и HMOX1 не зависит от NRF2, поэтому их содержание не снижается до нуля.", "s3a_c_g_etge": "NRF2 с заменой в мотиве ETGE в модели не связывается с KEAP1, убиквитинирующая активность KEAP1–CUL3 исходная ({a}); содержание NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) повышено.", "s3a_c_g_etge_z": "Мотив ETGE — прочный сайт, которым NRF2 связывается с KEAP1 (Tong 2006); замены в нём найдены в опухолях человека и нарушают распознавание NRF2 комплексом KEAP1–CUL3 (Shibata 2008). KEAP1-независимая ветвь деградации (GSK-3, β-TrCP) сохраняется (Rada 2011) и ограничивает накопление NRF2.", "s3a_c_p62": "Накоплен p62: сенсорные цистеины не модифицированы, убиквитинирующая активность KEAP1–CUL3 исходная ({a}), но содержание NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) повышено.", "s3a_c_p62_z": "p62 связывается с доменом Kelch белка KEAP1 и конкурирует с NRF2 за связывание; активация NRF2 при этом не зависит от цистеинов (Komatsu 2010; Lau 2010). Фосфорилирование p62 повышает его сродство к KEAP1 (Ichimura 2013).", "s3a_c_mg_up": "MG132 блокирует протеасому: сенсорные цистеины не модифицированы, убиквитинирующая активность KEAP1–CUL3 исходная ({a}), но содержание NRF2 повышено ({n}); NQO1 — {q}, HMOX1 — {h}.", "s3a_c_mg_up_z": "Убиквитинированный NRF2 разрушается медленнее, потому что протеасома заблокирована (Nguyen 2003); активность лигазы KEAP1–CUL3 при этом не меняется. MG132 действует не только на NRF2: при ингибировании протеасомы повышается и ATF4 (Ye 2014; вопрос 1).", "s3a_c_mg_0": "MG132 добавлен, протеасома блокирована, но содержание NRF2 ({n}) пока близко к исходному.", "s3a_c_mg_0_z": "NRF2 синтезируется постоянно; при блоке протеасомы он накапливается по мере того, как прекращается его разрушение, поэтому рост требует времени.", "s3a_c_chx_down": "Циклогексимид блокирует трансляцию: содержание NRF2 снижено ({n}), NQO1 — {q}, HMOX1 — {h}; сенсорные цистеины не модифицированы.", "s3a_c_chx_down_z": "NRF2 синтезируется постоянно и быстро разрушается, поэтому после остановки синтеза его содержание быстро снижается (в клетках HepG2 NRF2 исчезал в течение 30 мин; Nguyen 2003). Белки-мишени убывают медленнее: в модели постоянная времени их убыли 12 ч — допущение.", "s3a_c_chx_0": "Циклогексимид добавлен: синтез белка остановлен, а содержание NRF2 ({n}) пока близко к исходному.", "s3a_c_chx_0_z": "Период полужизни NRF2 в исходных условиях около 13 мин (Stewart 2003, клетки Hepa), поэтому без синтеза NRF2 быстро исчезает.", "s3a_c_ind_zero": "Добавлен индуктор ({i}, доза {d}), но сенсорные цистеины ещё не модифицированы: убиквитинирующая активность KEAP1–CUL3 ({a}) и содержание NRF2 ({n}) почти исходные.", "s3a_c_ind_zero_z": "В модели индуктор сначала должен войти в клетку и прореагировать с цистеинами, поэтому сразу после добавления показания не отличаются от исходных.", "s3a_c_ind_start": "Индуктор ({i}, доза {d}) модифицирует сенсорные цистеины (C151 — {m1}; C273 и C288 — {m2}; прочие — {m3}), убиквитинирующая активность KEAP1–CUL3 снижена до {a}. NRF2 ({n}), NQO1 ({q}) и HMOX1 ({h}) пока близки к исходному.", "s3a_c_ind_start_z": "Сначала модифицируются сенсорные цистеины и снижается убиквитинирующая активность комплекса; содержание NRF2 и белков-мишеней меняется позже.", "s3a_c_ind_up": "NRF2 накапливается ({n}): индуктор ({i}, доза {d}) модифицировал сенсорные цистеины (C151 — {m1}; C273 и C288 — {m2}; прочие — {m3}), убиквитинирующая активность KEAP1–CUL3 снижена до {a}. NQO1 — {q}, HMOX1 — {h}.", "s3a_c_ind_up_z": "NRF2 синтезируется с прежней скоростью, но убиквитинируется медленнее: вновь синтезированный NRF2 связывается с KEAP1 и накапливается. Содержание продуктов генов с ARE повышается позже содержания NRF2 (задержки в модели — допущение).", "s3a_c_ind_down": "Содержание NRF2 достигло максимума и теперь снижается (сейчас {n}): индуктора ({i}, доза {d}) в клетке остаётся меньше, убиквитинирующая активность KEAP1–CUL3 восстанавливается ({a}). Модифицировано: C151 — {m1}, C273 и C288 — {m2}, прочих цистеинов — {m3}. NQO1 — {q}, HMOX1 — {h}.", "s3a_c_ind_down_z": "Обратная связь: мишени NRF2 — ферменты фазы II, в том числе GST, — и GSH ускоряют выведение индуктора; в модели это ускорение рассчитано по содержанию NQO1. С убылью индуктора убиквитинирующая активность комплекса восстанавливается, и содержание NRF2 снижается.", "s3a_zi_sfn": "Сульфорафан реагирует прежде всего с C151: в клетках мыши с KEAP1 C151S ответ на него слабый (Takaya 2012).", "s3a_zi_tbhq": "tBHQ действует через хинон TBQ, который образуется в клетке и присоединяется к цистеинам C23, C151, C226 и C368 очищенного KEAP1 (Abiko 2011); в клетках мыши с C151S ответ на tBHQ слабый (Takaya 2012).", "s3a_zi_dmf": "Диметилфумарат и его метаболит монометилфумарат модифицируют цистеины KEAP1 (Linker 2011; Brennan 2015); в клетках мыши с C151S ответ на диметилфумарат слабый (Takaya 2012).", "s3a_zi_hne": "4-HNE — алкенал; по данным моделирования и филогенетического анализа алкеналы воспринимает цистеин C288 (McMahon 2010). Остаток, с которым реагирует сам 4-HNE, в работе Levonen 2004 не назван, поэтому распределение по группам цистеинов в модели — допущение.", "s3a_zi_h2o2": "H₂O₂ воспринимают другие остатки, чем электрофилы: важны C226, C613, C622 и C624, между которыми образуются дисульфиды (Suzuki 2019). В модели H₂O₂ реагирует преимущественно с группой прочих цистеинов.", "s3a_c_multi": "Включено несколько воздействий: {list}. Убиквитинирующая активность KEAP1–CUL3 {a}, содержание NRF2 {n}, NQO1 {q}, HMOX1 {h}, GSH {g}.", "s3a_c_multi_z": "Каждое воздействие влияет на своё звено пути. Вклад каждого воздействия виден, если сравнить эту дорожку блота с дорожками отдельных воздействий (кнопка «Добавить на блот»).", "s3a_pair_nrf2ko": "В клетках Nrf2⁻/⁻ NRF2 нет, и содержание продуктов генов с ARE не повышается сверх уровня, не зависящего от NRF2: NQO1 — {q}, HMOX1 — {h}.", "s3a_pair_ko": "В клетках Keap1⁻/⁻ нет KEAP1: убиквитинирующая активность комплекса {a}, сенсорные цистеины KEAP1 отсутствуют.", "s3a_pair_c151s": "В KEAP1 с заменой C151S этот остаток не модифицируется (доля {m1}).", "s3a_pair_chx": "Циклогексимид блокирует синтез белка, поэтому новый NRF2 не образуется.", "s3a_c_myst": "Три образца X, Y и Z получены через {t} из трёх групп клеток: Keap1⁻/⁻ без обработки; дикого типа с сульфорафаном (доза {d}); с заменой C151S в KEAP1 с сульфорафаном (доза {d}). Определите по блоту, какой образец получен из каких клеток.", "s3a_c_myst_z": "Сравните полосы KEAP1, NRF2 и NQO1 каждого образца с дорожкой «контроль»: по ним видно, есть ли KEAP1 и насколько выражен ответ. Условия показывает кнопка «Раскрыть образцы».", "s3a_c_myst2": "Образец X — клетки дикого типа с сульфорафаном, NRF2 {x}; образец Y — клетки с KEAP1 C151S и сульфорафаном, NRF2 {y}; образец Z — клетки Keap1⁻/⁻ без обработки, NRF2 {z}.", "s3a_c_myst2_z": "В образце Z полосы KEAP1 нет, а полосы NRF2 и продуктов его генов-мишеней сильнее, чем в двух других образцах. Образцы X и Y содержат KEAP1; сульфорафан действует прежде всего через C151, поэтому при замене C151S ответ слабее, но не исчезает.", "s3a_take": "Индукторы реагируют с разными сенсорными цистеинами KEAP1: сульфорафан, tBHQ и диметилфумарат — прежде всего с C151, 4-HNE (по данным моделирования) — с C288, H₂O₂ — с остатками C226, C613, C622 и C624. Поэтому замена C151S ослабляет ответ на сульфорафан, но не отменяет его, а замены C273A и C288A нарушают саму репрессию NRF2. NRF2 накапливается и без модификации цистеинов: при накоплении p62, при блоке протеасомы, в клетках Keap1⁻/⁻ и при замене в ETGE. Накопление требует синтеза нового NRF2 (циклогексимид его предотвращает), а индукция мишеней ARE в основном зависит от NRF2. Модель не показывает механизм в клетках человека: большая часть данных получена на клетках мыши. Числа — расчёт учебной модели.", "p3a_1_q": "Клетки дикого типа обработали сульфорафаном (доза 50 %); через 4 ч содержание NRF2 выросло. Тот же опыт провели на клетках, в KEAP1 которых остаток C151 заменён на серин (C151S). Как изменится содержание NRF2 через 4 ч по сравнению с клетками дикого типа?", "p3a_1_o1": "Не изменится: сульфорафан реагирует со всеми цистеинами KEAP1 одинаково.", "p3a_1_o2": "Уменьшится: ответ на сульфорафан во многом зависит от остатка C151.", "p3a_1_o3": "Вернётся к исходному: без C151 сульфорафан не модифицирует KEAP1.", "p3a_1_k": "Сульфорафан реагирует прежде всего с C151 в BTB-домене KEAP1: модификация этого остатка подавляет убиквитинирующую активность комплекса CUL3–KEAP1. В KEAP1 C151S такая реакция невозможна, модификация остальных сенсорных цистеинов слабее подавляет эту активность, и NRF2 накапливается меньше.", "p3a_1_e": "В клетках дикого типа через 4 ч C151 модифицирован на 87 %, убиквитинирующая активность KEAP1–CUL3 снижена до 13 %, содержание NRF2 выросло до ×4,3. При C151S этот остаток модифицировать нельзя (0 %); цистеины C273 и C288 модифицированы на 35 %, прочие — на 20 %, но подавляют активность слабее (вклад групп цистеинов в модели — допущение): она остаётся на уровне 70 %, а NRF2 достигает лишь ×1,4, NQO1 — ×1,1. В фибробластах и макрофагах мыши с Keap1 C151S ответ на сульфорафан был слабым, а на CdCl₂ и 15d-PGJ₂ обычным (Takaya 2012); замена C151S сохраняет репрессию NRF2 (Yamamoto 2008), а мутант C151S устойчив к подавлению убиквитинирования сульфорафаном и хинонами (Zhang 2004).", "p3a_1_w1": "Реакционная способность цистеинов KEAP1 различается, и разные индукторы реагируют преимущественно с разными остатками (Takaya 2012; Saito 2016). Если бы сульфорафан реагировал со всеми одинаково, замена C151 не влияла бы на ответ. В клетках мыши влияет: при C151S NRF2 растёт слабее (×1,4 вместо ×4,3).", "p3a_1_w3": "Сульфорафан модифицирует не только C151: другие сенсорные цистеины тоже реагируют, хотя и слабее, и частично подавляют активность комплекса. В модели NRF2 при C151S остаётся выше исходного (×1,4), а в клетках мыши ответ на сульфорафан при этой замене описан как слабый (Takaya 2012).", "p3a_2_q": "Измерили содержание NRF2 в клетках дикого типа без воздействий. Как изменится содержание NRF2 в клетках, где в KEAP1 заменён остаток C273 или C288 (C273A или C288A), также без электрофила?", "p3a_2_o1": "Не изменится: эти цистеины нужны лишь для ответа на электрофил.", "p3a_2_o2": "Уменьшится: замена цистеинов ослабляет связывание KEAP1 с NRF2.", "p3a_2_o3": "Возрастёт: эти остатки нужны для репрессии NRF2 комплексом CUL3–KEAP1.", "p3a_2_k": "Остатки C273 и C288 области IVR нужны для репрессии NRF2 комплексом CUL3–KEAP1, а не только для ответа на электрофил. Без них комплекс хуже убиквитинирует NRF2 даже без индуктора, и NRF2 накапливается.", "p3a_2_e": "Без электрофила все сенсорные цистеины немодифицированы (0 %), но убиквитинирующая активность KEAP1–CUL3 снижена со 100 % до 12 % (остаточная активность мутантного KEAP1 — допущение модели), и NRF2 вырастает от ×1,0 до ×5,2, NQO1 — до ×4,1. У трансгенных мышей Keap1(C273A) и Keap1(C288A) не подавляли активацию NRF2, конститутивную при отсутствии Keap1 (Yamamoto 2008); в клетках эти замены не нарушали связывание KEAP1 с NRF2 (Kobayashi 2006). Поэтому C273A и C288A нельзя считать заменами, которые лишь убирают ответ на электрофил: нарушена сама репрессия.", "p3a_2_w1": "Эти цистеины не только воспринимают электрофил: их замена нарушает репрессию NRF2 и без индуктора (Yamamoto 2008). Представление о «чистом» сенсоре пропускает вклад C273 и C288 в работу самого комплекса.", "p3a_2_w2": "Связывание KEAP1 с NRF2 в клетках при заменах C273A и C288A не нарушено (Kobayashi 2006): ослаблена не связь с NRF2, а убиквитинирующая активность комплекса. Поэтому NRF2 не убывает, а накапливается (×5,2).", "p3a_3_q": "Измерили содержание NRF2 в клетках дикого типа без воздействий. Как изменится содержание NRF2 в клетках, где накоплен белок p62 (например, при блоке аутофагии), также без электрофила?", "p3a_3_o1": "Возрастёт: p62 конкурирует с NRF2 за связывание с доменом Kelch KEAP1.", "p3a_3_o2": "Не изменится: без электрофила цистеины KEAP1 не модифицированы.", "p3a_3_o3": "Возрастёт: p62 модифицирует сенсорные цистеины KEAP1, как электрофил.", "p3a_3_k": "p62 связывается с доменом Kelch белка KEAP1 и конкурирует с NRF2 за этот домен. Сенсорные цистеины при этом не модифицированы, но часть KEAP1 занята p62, и NRF2 убиквитинируется хуже.", "p3a_3_e": "Сенсорные цистеины остаются немодифицированными (C151 — 0 %), убиквитинирующая активность KEAP1–CUL3 сохраняется на уровне 100 %, но NRF2 растёт от ×1,0 до ×1,6, NQO1 — до ×2,4, HMOX1 — до ×4,3. В модели p62 занимает часть доменов Kelch и снижает ёмкость KEAP1 для NRF2 (допущение); значения — расчёт модели, а не измерение. В опытах Komatsu 2010 и Lau 2010 (дефицит аутофагии, клетки мыши и человека) p62 связывался с KEAP1 и активировал NRF2 независимо от цистеинов; фосфорилирование p62 повышает его сродство к KEAP1 (Ichimura 2013).", "p3a_3_w2": "Модификация цистеинов — не единственный способ снизить убиквитинирование NRF2. p62 занимает домен Kelch, с которым связывается NRF2, и NRF2 накапливается без модификации цистеинов (Komatsu 2010; Lau 2010).", "p3a_3_w3": "Активация NRF2 белком p62 не зависит от цистеинов: p62 связывается с доменом Kelch (Komatsu 2010; Lau 2010). На экране модифицированных цистеинов нет (C151 — 0 %), а NRF2 при этом вырос (×1,6).", "p3a_4_q": "Клетки дикого типа обработали сульфорафаном (доза 50 %); через 2 ч содержание NRF2 выросло. Как изменится содержание NRF2 через 2 ч, если одновременно с сульфорафаном добавить ингибитор трансляции циклогексимид?", "p3a_4_o1": "Не изменится: сульфорафан подавляет убиквитинирование уже имеющегося NRF2.", "p3a_4_o2": "Снизится ниже исходного: накопление идёт за счёт вновь синтезированного NRF2.", "p3a_4_o3": "Возрастёт сильнее: циклогексимид дополнительно подавляет убиквитинирование.", "p3a_4_k": "Сульфорафан замедляет убиквитинирование, но содержание NRF2 растёт за счёт новых молекул: NRF2 синтезируется постоянно. Циклогексимид останавливает трансляцию, и имеющийся NRF2 разрушается без пополнения.", "p3a_4_e": "Циклогексимид почти не влияет на модификацию цистеинов: C151 модифицирован на 86 % без него и на 88 % с ним, убиквитинирующая активность KEAP1–CUL3 составляет 15 % и 13 %. Но содержание NRF2 вместо ×2,7 снижается до ×0,03: синтез остановлен, а имеющийся белок разрушается. NQO1 и HMOX1 убывают медленнее (оба ×0,85; в модели постоянная времени убыли 12 ч — допущение), GSH — 79 %. В клетках HepG2 при обработке циклогексимидом NRF2 исчезал в течение 30 мин (Nguyen 2003); накопление NRF2 после электрофилов блокировалось циклогексимидом, то есть складывается из вновь синтезированного белка (Kobayashi 2006).", "p3a_4_w1": "NRF2 синтезируется постоянно, а его период полужизни без индуктора около 13 мин (Stewart 2003, клетки Hepa). Подавление убиквитинирования замедляет разрушение, но не удерживает NRF2, если синтез остановлен: накопление идёт за счёт новых молекул (Kobayashi 2006). Поэтому содержание NRF2 не остаётся прежним (×0,03).", "p3a_4_w3": "Циклогексимид подавляет синтез белка, а не убиквитинирование: активность KEAP1–CUL3 с ним (13 %) почти не отличается от активности без него (15 %). Остановка синтеза лишает путь источника NRF2, и содержание NRF2 не растёт, а падает.", "p3a_5_q": "В клетках дикого типа без электрофила измерили убиквитинирующую активность KEAP1–CUL3 и содержание NRF2. Затем добавили MG132, ингибитор протеасомы. Как изменятся эти величины через 4 ч?", "p3a_5_o1": "Активность не изменится, NRF2 возрастёт: убиквитинированный белок разрушается медленнее.", "p3a_5_o2": "Активность снизится, NRF2 возрастёт: MG132 подавляет и убиквитинирующую лигазу.", "p3a_5_o3": "Активность и NRF2 не изменятся: без электрофила цистеины KEAP1 не модифицированы.", "p3a_5_k": "MG132 подавляет протеасому, а не лигазу: комплекс KEAP1–CUL3 продолжает убиквитинировать NRF2, но убиквитинированный белок разрушается медленнее. NRF2 синтезируется постоянно, поэтому накапливается.", "p3a_5_e": "Убиквитинирующая активность KEAP1–CUL3 остаётся 100 %, сенсорные цистеины не модифицированы, но NRF2 растёт от ×1,0 до ×5,1, NQO1 — до ×2,5, HMOX1 — до ×7,5. В модели протеасома сохраняет небольшую остаточную активность (допущение). В клетках HepG2 MG132 и лактацистин увеличивали содержание NRF2 и активность ARE-репортёра (Nguyen 2003). MG132 неспецифичен: при ингибировании протеасомы повышается и ATF4 (Ye 2014), поэтому рост мишеней нельзя целиком приписать NRF2.", "p3a_5_w2": "Протеасома разрушает белки, которые лигаза уже пометила убиквитином; MG132 действует на протеасому, а не на лигазу. Активность KEAP1–CUL3 остаётся прежней (100 %), а NRF2 накапливается, потому что убиквитинированный белок разрушается медленнее.", "p3a_5_w3": "Модификация цистеинов — не единственная причина накопления NRF2: при блоке протеасомы он накапливается и без неё (C151 — 0 %). Рост NRF2 (×5,1) при исходной активности лигазы (100 %) показывает, что стадия после убиквитинирования тоже ограничивает его содержание.", "p3a_6_q": "В клетках Keap1⁻/⁻ измерили содержание NRF2 и NQO1. Затем добавили сульфорафан (доза 50 %). Как изменятся эти величины через 4 ч?", "p3a_6_o1": "Возрастут ещё: сульфорафан активирует NRF2 напрямую, минуя KEAP1.", "p3a_6_o2": "Снизятся: сульфорафан реагирует с GSH, и мишеней NRF2 становится меньше.", "p3a_6_o3": "Почти не изменятся: сульфорафан модифицирует KEAP1, а в этих клетках его нет.", "p3a_6_k": "Сульфорафан действует через модификацию цистеинов KEAP1. В клетках Keap1⁻/⁻ KEAP1 нет, убиквитинирующая активность комплекса уже равна нулю, и NRF2 накапливается без индуктора; точки приложения у сульфорафана нет.", "p3a_6_e": "В клетках Keap1⁻/⁻ убиквитинирующая активность KEAP1–CUL3 равна 0 %, содержание NRF2 составляет ×7,7, NQO1 — ×5,3, HMOX1 — ×14; после сульфорафана эти значения прежние: сенсорные цистеины отсутствующего KEAP1 не могут быть модифицированы (доли 0 %). Из показаний изменяется лишь GSH — с 214 % до 176 %: сульфорафан реагирует с ним. У мышей Keap1⁻/⁻ NRF2 активирован конститутивно (Wakabayashi 2003); значения ×7,7, ×5,3, ×14 и GSH — экстраполяция модели, прямых измерений NQO1, HMOX1 и GSH в тех же клетках в источниках вопроса нет.", "p3a_6_w1": "Гетеродимер NRF2–sMAF связывается с ARE (Itoh 1997), поэтому содержание NQO1 зависит от NRF2, а не от самого электрофила. В клетках Keap1⁻/⁻ NRF2 уже накоплен (×7,7), и в модели сульфорафан его не меняет.", "p3a_6_w2": "GSH действительно убывает (с 214 % до 176 %), потому что реагирует с сульфорафаном. Но содержание NQO1 зависит от NRF2, а не от GSH: в клетках Keap1⁻/⁻ NRF2 (×7,7) не зависит от сульфорафана, поэтому NQO1 остаётся ×5,3.", "p3a_7_q": "В клетках Nrf2⁻/⁻ измерили долю модифицированного C151 и содержание NQO1. Затем добавили сульфорафан (доза 50 %). Как изменятся эти величины через 8 ч?", "p3a_7_o1": "C151 не модифицируется, NQO1 не изменится: без NRF2 сульфорафан неактивен.", "p3a_7_o2": "C151 модифицируется, NQO1 почти не изменится: индукция ARE зависит от NRF2.", "p3a_7_o3": "C151 модифицируется, NQO1 возрастёт: ARE индуцируют и другие факторы.", "p3a_7_k": "Модификация C151 — химическая реакция сульфорафана с KEAP1, и она идёт независимо от наличия NRF2. Но гены с элементом ARE индуцирует комплекс NRF2–sMAF: без NRF2 содержание NQO1 не растёт.", "p3a_7_e": "В клетках Nrf2⁻/⁻ после сульфорафана C151 модифицирован на 94 %, убиквитинирующая активность KEAP1–CUL3 снижена до 5 %, но NRF2 нет (×0,00), а NQO1 остаётся ×0,35 и HMOX1 — ×0,10: эти значения задаёт доля, не зависящая от NRF2 (принята по порядку величины из работ на мышах). GSH снижается с 78 % до 60 %. У мышей Nrf2⁻/⁻ индукция ферментов фазы II в печени и кишечнике по большей части исчезала (Itoh 1997), а олтипраз почти не повышал активность NQO (Ramos-Gomez 2001).", "p3a_7_w1": "Реакция сульфорафана с тиоловыми группами KEAP1 — химическая, и для неё NRF2 не нужен: C151 модифицирован на 94 %. Отсутствие NRF2 нарушает следующее звено пути, а не саму модификацию.", "p3a_7_w3": "Гетеродимер NRF2–sMAF связывается с ARE (Itoh 1997). В клетках Nrf2⁻/⁻ этого гетеродимера нет, и NQO1 остаётся на уровне ×0,35, не зависящем от NRF2: другого фактора, который в модели восполнял бы NRF2, нет.", "p3a_8_q": "Три образца X, Y и Z получены через 4 ч из трёх групп клеток: Keap1⁻/⁻ без обработки; дикого типа с сульфорафаном (доза 50 %); с заменой C151S в KEAP1 с сульфорафаном (доза 50 %). Какое соответствие образцов и клеток верно?", "p3a_8_o1": "X — дикий тип с сульфорафаном; Y — KEAP1 C151S с сульфорафаном; Z — Keap1⁻/⁻.", "p3a_8_o2": "X — KEAP1 C151S с сульфорафаном; Y — дикий тип с сульфорафаном; Z — Keap1⁻/⁻.", "p3a_8_o3": "X — Keap1⁻/⁻; Y — KEAP1 C151S с сульфорафаном; Z — дикий тип с сульфорафаном.", "p3a_8_k": "Образец без KEAP1 узнаётся по отсутствию полосы KEAP1, а NRF2 и мишени в нём накоплены без индуктора. Два образца с KEAP1 различаются ответом на сульфорафан: он действует прежде всего через C151, и при замене C151S NRF2 накапливается слабее.", "p3a_8_e": "Образец Z: полосы KEAP1 нет, NRF2 равен ×7,7, NQO1 — ×5,3, HMOX1 — ×14. Образец X содержит KEAP1 и сильно отвечает на сульфорафан: NRF2 ×4,3, NQO1 ×2,0, HMOX1 ×5,7. Образец Y содержит KEAP1, но ответ слабее: NRF2 ×1,4, NQO1 ×1,1, HMOX1 ×1,3. Порядок образцов по NRF2 (Z, X, Y) следует из двух звеньев: без KEAP1 нет KEAP1-зависимого убиквитинирования NRF2, а при замене C151S сульфорафан слабее подавляет убиквитинирующую активность (Takaya 2012; Yamamoto 2008). Числа — расчёт учебной модели; по блоту абсолютное содержание белка оценить нельзя.", "p3a_8_w2": "Если бы клетками с C151S был образец X, их ответ на сульфорафан оказался бы сильнее, чем у дикого типа. Замена C151S ослабляет ответ на сульфорафан (Takaya 2012), поэтому образец с более слабым ответом (Y, ×1,4) — это C151S, а X (×4,3) — клетки дикого типа.", "p3a_8_w3": "В образце X есть полоса KEAP1, а в клетках Keap1⁻/⁻ её быть не может. Полосы KEAP1 нет в образце Z, поэтому клетки Keap1⁻/⁻ — это образец Z (NRF2 ×7,7 без индуктора).", "gn_n_nrf2": "NRF2 (NFE2L2)", "g_n_nrf2": "NRF2 — транскрипционный фактор семейства CNC-bZIP. В исходных
