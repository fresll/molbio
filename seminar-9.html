/* =====================================================================
   Семинар 9 · общая модель митохондрии (вопрос 1: контур протонов).
   Перенос model_q1.py. Величины относительные; Δψ в мВ — значение модели.
   Идея (Brand & Nicholls 2011, Biochem J 435:297): три модуля с общим звеном — Δp.
   Окисление субстрата создаёт ток H⁺ наружу, тем более слабый, чем выше Δp; ATP-оборот и утечка расходуют Δp;
   в стационарном состоянии токи равны. Единица тока: максимальный протонный ток цепи при NADH-субстрате
   (10 H⁺ на атом O) = 1,0; для NADH-входа ток равен потреблению O₂ в шкале семинара 8.
   ===================================================================== */
const MITO = (function(){
  const sig = z => 1 / (1 + Math.exp(-z));
  /* литературные константы */
  const FPH = 0.20, ZPH = 61.5, NH_NADH = 10, NH_SUCC = 6, H_PER_ATP = 2.7 + 1.0;
  const PO_NADH = NH_NADH / H_PER_ATP, PO_SUCC = NH_SUCC / H_PER_ATP;
  /* калибровка на делящуюся клетку семинара 8 */
  const DPSI_B = 139, OCR_B = 0.60, OCR_OLIGO = 0.15, OCR_FCCP = 0.99, DPSI_OLIGO_SHIFT = 10, LEAK_OVER = 1.18, NONMITO = 0.05;
  const X_B = DPSI_B / (1 - FPH), X_O = X_B + DPSI_OLIGO_SHIFT / (1 - FPH);
  const S_OX = (X_O - X_B) / (Math.log(1 / OCR_OLIGO - 1) - Math.log(1 / OCR_B - 1));
  const XH = X_B - S_OX * Math.log(1 / OCR_B - 1);
  const L_O = OCR_OLIGO, L0 = L_O / LEAK_OVER;
  /* утечка обращается в ноль при Δp = 0: leak(x) = L0·(e^((x−X_B)/S) − e^(−X_B/S))/(1 − e^(−X_B/S));
     крутизна S подобрана так, что leak(X_O)/leak(X_B) = LEAK_OVER (калибровка базального состояния и олигомицина сохраняется) */
  const S_LX = (function(){ let lo = 10, hi = 500; for (let i = 0; i < 200; i++){ const m = .5 * (lo + hi), c = Math.exp(-X_B / m); if ((Math.exp((X_O - X_B) / m) - c) / (1 - c) - LEAK_OVER > 0) lo = m; else hi = m; } return .5 * (lo + hi); })();
  const LEAK_C = Math.exp(-X_B / S_LX);
  const leakF = x => (Math.exp((x - X_B) / S_LX) - LEAK_C) / (1 - LEAK_C);
  const S_A = 6, X_A = X_B - 24, SA_B = sig((X_B - X_A) / S_A);
  const D_DIV = (OCR_B - L0) / SA_B;
  const R_REV = 0.05, X_R = X_A - 10, S_R = 6, XSUB = 6, GAMMA = 0.8, A_NADH = 0.293, X_ROS = X_B + 6, S_ROS = 5;
  let CAP_PIER = 0.08, G_T = 0;
  const tox = u => 1 / (1 + Math.pow(u / 3, 6));
  const nadM = ocr => { const o = Math.max(ocr, 0.005), q = A_NADH * Math.pow(o, -GAMMA); return q / (1 + q); };

  /* d — расход ATP (ток, 1,0 = максимум цепи при NADH); fccp — доза в долях титрованной (1,0) */
  function cell(o){
    o = o || {};
    const d = o.d == null ? D_DIV : o.d, oligo = !!o.oligo, fccp = o.fccp || 0, pier = !!o.pier, anti = !!o.anti, succ = !!o.succ;
    const leakMult = o.leak_mult == null ? 1 : o.leak_mult, chain = o.chain == null ? 1 : o.chain, syn = o.syn == null ? 1 : o.syn;
    const gT = o.g_t == null ? G_T : o.g_t;
    const nH = succ ? NH_SUCC : NH_NADH, k = nH / NH_NADH, xh = XH + (succ ? XSUB : 0);
    const cap = (anti ? 0 : (pier && !succ ? CAP_PIER : 1)) * chain * tox(fccp);
    const gF = gT * fccp;
    const parts = x => {
      const ox = cap * sig(-(x - xh) / S_OX), src = k * ox, leak = leakMult * L0 * leakF(x);
      const atp = oligo ? 0 : syn * d * sig((x - X_A) / S_A) - R_REV * (1 - sig((x - X_R) / S_R));
      const fc = gF * (x / X_B);
      return [ox, src, leak, atp, fc];
    };
    let lo = 0, hi = 260;   // без источников тока решение — точный ноль (утечка обращается в ноль при Δp = 0)
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi), p = parts(mid); if (p[1] - p[2] - p[3] - p[4] > 0) lo = mid; else hi = mid; }
    const x = .5 * (lo + hi), p = parts(x), ox = p[0], src = p[1], leak = p[2], atp = p[3], fc = p[4];
    const ocr = ox, nm = nadM(ocr), atpPos = Math.max(0, atp);
    const cover = (d > 1e-9 && !oligo) ? atpPos / d : 0;
    const atpRate = atpPos * 10 / H_PER_ATP;
    const sum = leak + fc + atpPos;
    const bypass = sum > 1e-9 ? (leak + fc) / sum : NaN;
    const rosSig = sig((x - X_ROS) / S_ROS);
    const ros = .05 + .95 * Math.max(rosSig, nm * nm);   // высокий Δp или восстановленные переносчики (блок III/I, низкое дыхание)
    return { x, dpsi: -(1 - FPH) * x, dph: FPH * x / ZPH, ocr, nadh_m: nm, leak, atp, atp_pos: atpPos, fc, cover, atp_rate: atpRate,
             bypass, ros, po: ocr > 1e-6 ? atpRate / ocr : NaN, src, dp: x, nH };
  }
  /* калибровка дозы FCCP (дыхание = 0,99 при d = D_DIV, титрованная доза = 1,0) и остаточной ёмкости при пиерицидине (O₂ = 0,048) */
  (function(){
    let lo = 0, hi = 3;
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi); if (cell({ d: D_DIV, fccp: 1, g_t: mid }).ocr < OCR_FCCP) lo = mid; else hi = mid; }
    G_T = .5 * (lo + hi);
    lo = 0.02; hi = 0.2;
    for (let i = 0; i < 60; i++){ const mid = .5 * (lo + hi); CAP_PIER = mid; if (cell({ d: D_DIV, pier: true }).ocr < 0.048) lo = mid; else hi = mid; }
    CAP_PIER = .5 * (lo + hi);
  })();


  /* =====================================================================
     Вопрос 2. Δψ как общий ресурс внутренней мембраны. Надстройка над cell(): к источнику и стокам вопроса 1 добавлены
     потребители Δψ — вход Ca²⁺ через MCU, импорт белков через TIM23 (с PINK1) — и образец ρ⁰ (без мтДНК), ингибитор ANT, зонд TMRM.
     При обычной нагрузке Ca²⁺ и без ρ⁰ cell2 даёт те же числа, что cell (сверка с Python — tools/compare_q2.py).
     Условные величины: крутизна входа Ca²⁺ (S_CA), середина и ширина кривой импорта (V_I, S_I), уровни нагрузки Ca²⁺, амплитуда генератора ρ⁰.
     ===================================================================== */
  const CA_B = 0.0075;                         // базальный вход Ca²⁺: 2 заряда на Ca²⁺ → ≈ 1,5 % максимального протонного тока (Brand & Nicholls 2011: 1–2 %)
  const S_CA = 30;                             // мВ на e-кратное изменение входа Ca²⁺ (условно; Kirichok 2004 — выпрямление внутрь)
  const CA_LEVELS = { norm: 1, mid: 10, high: 60 };   // условные уровни нагрузки; «высокая» подобрана так, чтобы Δp падал на ≈ 11 % (Brand & Nicholls 2011: 10–20 %)
  const V_I = 45, S_I = 8;                     // импорт = sig((|Δψ| − V_I)/S_I): условно; опоры — ρ⁰ при −67 мВ импортируют (Appleby 1999), при полной деполяризации импорт PINK1 прекращается (Jin 2010; Narendra 2010)
  const DPSI_RHO = 67, G_RHO = 0.08, TMRM_K = 26.7;   // Δψ клеток ρ⁰ в интактных клетках ≈ 67 мВ (Appleby 1999); RT/F при 37 °C
  let X_G = 0;
  const dpsiOf = x => -(1 - FPH) * x;
  const CA_C = Math.exp(-DPSI_B / S_CA), caF = a => (Math.exp((a - DPSI_B) / S_CA) - CA_C) / (1 - CA_C);   // 1 при |Δψ| = 139 мВ, 0 при Δψ = 0
  function cell2(o){
    o = o || {};
    const d = o.d == null ? D_DIV : o.d, chain = o.chain == null ? 1 : o.chain, fccp = o.fccp || 0, oligo = !!o.oligo, anti = !!o.anti, antInh = !!o.ant_inh;
    const ru = !!o.ru, rho0 = !!o.rho0, pier = !!o.pier, succ = !!o.succ, leakMult = o.leak_mult == null ? 1 : o.leak_mult;
    const caL = typeof o.ca === 'number' ? o.ca : CA_LEVELS[o.ca == null ? 'norm' : o.ca];
    const nH = succ ? NH_SUCC : NH_NADH, k = nH / NH_NADH, xh = XH + (succ ? XSUB : 0);
    const cap = ((anti || rho0) ? 0 : (pier && !succ ? CAP_PIER : 1)) * chain * tox(fccp);
    const gF = G_T * fccp, blocked = oligo || antInh || rho0;   // синтаза не отдаёт ATP: олигомицин, блок ANT; у ρ⁰ нет субъединиц Fo
    const parts = x => {
      const ox = cap * sig(-(x - xh) / S_OX), src = k * ox, dA = Math.abs(dpsiOf(x));
      const icaB = 2 * CA_B * caF(dA);                         // Ca²⁺-компонента утечки вопроса 1 (≈ 1,5 %)
      const leak = leakMult * L0 * leakF(x) - icaB;
      const atp = blocked ? 0 : d * sig((x - X_A) / S_A) - R_REV * (1 - sig((x - X_R) / S_R));
      const fc = gF * (x / X_B);
      const ica = ru ? 0 : 2 * CA_B * caL * caF(dA);
      const gen = (rho0 && !antInh) ? G_RHO * (1 - sig((x - X_G) / 4)) : 0;
      return [ox, src, leak, atp, fc, ica, gen];
    };
    let lo = 0, hi = 260;
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi), p = parts(mid); if (p[1] + p[6] - p[2] - p[3] - p[4] - p[5] > 0) lo = mid; else hi = mid; }
    const x = .5 * (lo + hi), p = parts(x), ox = p[0], dpsi = dpsiOf(x), adp = Math.abs(dpsi);
    const imp = sig((adp - V_I) / S_I), caUp = ru ? 0 : caL * caF(adp);
    const atpPos = Math.max(0, p[3]), nm = nadM(ox), ros = .05 + .95 * Math.max(sig((x - X_ROS) / S_ROS), nm * nm);
    return { x, dp: x, dpsi, dph: FPH * x / ZPH, ocr: ox, src: p[1], leak: p[2], atp: p[3], atp_pos: atpPos, atp_raw: p[3], fc: p[4], ica: p[5], gen: p[6],
             cover: (d > 1e-9 && !blocked) ? atpPos / d : 0, imp, pink: 1 - imp, ca_up: caUp, nadh_m: nm, ros, tmrm: Math.exp((adp - DPSI_B) / TMRM_K), d };
  }
  (function(){                                 // калибровка генератора ρ⁰ на Δψ = −67 мВ
    let lo = 20, hi = 140;
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi); X_G = mid; if (Math.abs(cell2({ rho0: true }).dpsi) > DPSI_RHO) hi = mid; else lo = mid; }
    X_G = .5 * (lo + hi);
  })();
  /* кривая TMRM в протоколе: исходно → олигомицин → FCCP (контроль деполяризации: минимальный сигнал модели); отдельный образец, образец на схеме не меняется */
  function tmrmProtocol(kw){
    const a = cell2(kw), b = cell2(Object.assign({}, kw, { oligo: true })), c = cell2(Object.assign({}, kw, { oligo: true, fccp: 5 }));
    return { a, b, c, levels: [a.tmrm, b.tmrm, c.tmrm] };
  }

  /* доза FCCP с наибольшим дыханием у данного образца после олигомицина: имитация титрования на линию клеток */
  function bestFccp(d, kw){
    let bu = 1, bo = -1;
    for (let u = 0.5; u <= 3.0 + 1e-9; u += 0.05){
      const o = cell(Object.assign({}, kw, { d, oligo: true, fccp: u })).ocr;
      if (o > bo + 1e-9){ bu = u; bo = o; }
    }
    return bu;
  }
  /* кривая O₂ с последовательными добавками: базальное → олигомицин → FCCP → пиерицидин + антимицин A (Brand & Nicholls 2011; Divakaruni 2014) */
  function trace(d, kw){
    kw = kw || {}; if (d == null) d = D_DIV;
    const a = cell(Object.assign({}, kw, { d })), b = cell(Object.assign({}, kw, { d, oligo: true }));
    const u = bestFccp(d, kw), c = cell(Object.assign({}, kw, { d, oligo: true, fccp: u }));
    const basal = a.ocr, leak = b.ocr, mx = c.ocr;
    return { levels: [basal + NONMITO, leak + NONMITO, mx + NONMITO, NONMITO], basal, atp_linked: basal - leak, leak, maximal: mx, spare: mx - basal,
             coupling: basal > 1e-9 ? (basal - leak) / basal : NaN, rcr: leak > 1e-9 ? mx / leak : NaN, fccp_dose: u, dpsi: a.dpsi, cover: a.cover, nonmito: NONMITO };
  }
  /* мысленный опыт: цепи нет, в мембране ATP-синтаза, протоны качает внешний источник (свет и бактериородопсин; pH-скачок) */
  const X_SET = 175;
  function vesicle(o){
    o = o || {};
    const pump = o.pump == null ? 0.6 : o.pump, lm = o.leak_mult == null ? 1 : o.leak_mult, oligo = !!o.oligo, fccp = o.fccp || 0, d = o.d == null ? D_DIV : o.d, xSet = o.x_set == null ? X_SET : o.x_set;
    const gF = G_T * fccp;
    const f = x => {
      const src = pump * sig(-(x - xSet) / S_OX), leak = lm * L0 * leakF(x), atp = oligo ? 0 : d * sig((x - X_A) / S_A), fc = gF * (x / X_B);
      return [src - leak - atp - fc, atp, src, leak, fc];
    };
    let lo = 0, hi = 260;
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi); if (f(mid)[0] > 0) lo = mid; else hi = mid; }
    const x = .5 * (lo + hi), r = f(x), ap = Math.max(0, r[1]), tot = ap + r[3] + r[4];
    return { x, dp: x, dpsi: -(1 - FPH) * x, atp: ap, atp_raw: r[1], src: r[2], leak: r[3], fc: r[4], bypass: tot > 1e-6 ? (r[3] + r[4]) / tot : NaN };
  }
  /* =====================================================================
     Вопрос 3. Ca²⁺ в контактах ЭПР–митохондрия. Перенос model_q3.py (сверка — tools/compare_q3.mjs).
     Протокол одного сигнала IP₃ (начало 20 с, длительность 30 или 120 с, шаг 0,5 с, 300 с); на каждом шаге — квазистационарный Δp
     (тот же контур H⁺ и тот же MCU, что в вопросах 1–2). Добавлены: микродомен контакта, ворота MICU1, NCLX, общий и свободный Ca²⁺ матрикса
     (фосфатный буфер), активация дегидрогеназ, пора в части митохондрий (порог — общая нагрузка Ca²⁺). Все коэффициенты условные.
     ===================================================================== */
  const Q3P = { T0: 20, DT: 0.5, TEND: 300, DUR: { short: 30, long: 120 }, CB0: 0.1, CB_SIG: 0.9, C_MIC: 20, G_CONTACT: { near: 1, mid: 0.25, far: 0.03 },
    VM: 50, K_MICU: 20, N_MICU: 2.6, KO_A: 0.10, KO_K: 0.5, KX: 2.0, JRES: 0.2, CGP: 0.3, KB: 0.08, CCL: 3.0, KD: 1.0, DX_A: 0, DC_A: 2.0, DEM: 2.5,
    LP: 13, LP_CSA: 26, WL: 0.15, KOPEN: 0.15, G_PTP: 20, KPOUT: 0.05, OPEN_CAP: 0.3, CB_TG: 0.25 };
  Q3P.VX = (1 + Q3P.JRES) * (Q3P.KX + 0.1) / 0.1;
  Q3P.A0 = 0.01 / (Q3P.KD * Q3P.KD + 0.01);
  const freeCa = L => Q3P.CCL * Math.tanh(L / Q3P.CCL);
  const loadOf = c => { c = Math.min(c, Q3P.CCL * 0.999999); return Q3P.CCL * Math.atanh(c / Q3P.CCL); };
  const gate3 = (c, micu) => micu ? Math.pow(c, Q3P.N_MICU) / (Math.pow(Q3P.K_MICU, Q3P.N_MICU) + Math.pow(c, Q3P.N_MICU)) : Q3P.KO_A * c / (Q3P.KO_K + c);
  const pulse3 = (t, dur) => sig((t - Q3P.T0) / 0.5) * sig(-(t - (Q3P.T0 + dur)) / 0.5);
  const actOf = cm => cm * cm / (Q3P.KD * Q3P.KD + cm * cm);
  function cell3(o){
    const u = o.u || 0, d = o.d == null ? D_DIV : o.d, mcu = o.mcu !== false, opened = !!o.opened;
    const A = opened ? 0 : (o.A == null ? Q3P.A0 : o.A);
    const xh = XH + Q3P.DX_A * (A - Q3P.A0), cap = (1 + Q3P.DC_A * (A - Q3P.A0)) * (opened ? Q3P.OPEN_CAP : 1);
    const gP = opened ? Q3P.G_PTP * G_T : 0;
    const parts = x => {
      const ox = cap * sig(-(x - xh) / S_OX), dA = Math.abs(dpsiOf(x));
      const leak = L0 * leakF(x) - 2 * CA_B * caF(dA);
      const atp = d * sig((x - X_A) / S_A) - R_REV * (1 - sig((x - X_R) / S_R));
      const ica = (mcu && !opened) ? 2 * CA_B * (1 + u) * caF(dA) : 0;
      const ptp = gP * (x / X_B);
      return [ox, leak, atp, ica, ptp];
    };
    let lo = 0, hi = 260;
    for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi), p = parts(mid); if (p[0] - p[1] - p[2] - p[3] - p[4] > 0) lo = mid; else hi = mid; }
    const x = .5 * (lo + hi), p = parts(x);
    const q = A_NADH * (1 + 3 * (A - Q3P.A0)) * Math.pow(Math.max(p[0], 0.005), -GAMMA) * (opened ? Q3P.OPEN_CAP : 1);
    return { x, dpsi: dpsiOf(x), ocr: p[0], atp: p[2], ica: p[3], nadh: q / (1 + q) };
  }
  function pop3(u, A, P, d, mcu){

/* Структурные формулы в справке (данные — formulas_data.js; сверка с PubChem — chem/verify.txt).
   Подписи формул — ключи fm_<ключ> в таблице текстов. R — остаток молекулы. */
const GFORM = {
  nadh: [['nadh_c', 'mid'], ['nad_c', 'mid'], ['nadh', 'big'], ['nad', 'big']],
  q: [['q_c', 'mid'], ['qh2_c', 'mid']],
  atps: [['atp', 'big'], ['adp', 'big']],
  antx: [['atp', 'big'], ['adp', 'big']],
  fccp: [['fccp', 'mid']],
  oligo: [['oligo', 'big']],
  pier: [['pier', 'big']],
  anti: [['anti', 'big']],
  succ: [['succ', 'sm'], ['fum', 'sm']],
};
function fmSVG(k){ return FORMULAS[k] ? `<span class="fm-s">${FORMULAS[k].svg}</span>` : ''; }
function fmHTML(g){
  const L = GFORM[g]; if (!L) return '';
  return `<div class="fmrow">` + L.map(([k, size]) => `<figure class="fm fm-${size}">${fmSVG(k)}<figcaption>${t('fm_' + k)}</figcaption></figure>`).join('') + `</div>`;
}

/* =====================================================================
   Вопрос 1. Хемиосмотическое сопряжение переноса электронов и синтеза ATP
   1б — базовый: «Расход ATP» и «Разобщитель»
   1п (ключ 1a) — продвинутый: вход электронов, препараты, утечка, кривая O₂ с добавками, загадка, опыт без цепи
   Расчёт — mito.js (общая модель семинара); подписи — по тем же величинам, что и показания.
   ===================================================================== */
const Q1 = (function(){
  const M = MITO;
  const D_LOW = 0.10, D_HIGH = 0.80, D_NORM = M.D_DIV, REF = M.cell({ d: D_NORM });
  const FLOWK = 30, NPUMP = 12, NRET = 32, NBR = 32;
  const mv = x => (x == null || !isFinite(x) ? '—' : (Math.round(Math.abs(x)) === 0 ? '0' : (x < 0 ? '−' : '') + Math.round(Math.abs(x))));   // округление до 1 мВ; без источников тока решение — точный ноль
  const f2 = x => (x == null || !isFinite(x) ? '—' : fmt(x, 2));
  const pc = x => (x != null && isFinite(x) ? String(Math.round(x * 100)) : '—');
  const dOf = v => v === 'low' ? D_LOW : v === 'high' ? D_HIGH : D_NORM;
  const args = s => ({ d: s.d, oligo: s.oligo, fccp: s.fccp, pier: s.pier, anti: s.anti, succ: s.succ, leak_mult: s.leak });
  const gyC = v => 44 + Math.min(Math.abs(v), 200) / 180 * 340;      // шкала Δψ: 0 … −180 мВ
  const gyV = v => 44 + Math.min(Math.max(v, 0), 230) / 220 * 340;   // шкала Δp везикул: 0 … 220 мВ
  const vis = (id, on) => { const e = $(id); if (e){ e.setAttribute('opacity', on ? 1 : 0); e.style.pointerEvents = on ? 'auto' : 'none'; } };

  /* ---------- состояние ручек → данные для расчёта ---------- */
  function vals(s, r){
    const ves = s.obj === 'ves', nb = ves ? null : M.cell(Object.assign(args(s), { oligo: false })), nf = ves ? null : M.cell(Object.assign(args(s), { fccp: 0 })), nl = ves ? null : M.cell(Object.assign(args(s), { leak_mult: 1 }));
    return {
      o2: f2(r.ocr), o2_0: f2(REF.ocr), o2_n: nb ? f2(nb.ocr) : '', dpsi: mv(r.dpsi), dpsi_0: mv(REF.dpsi), dpsi_n: nb ? mv(nb.dpsi) : '', dpsi_nf: nf ? mv(nf.dpsi) : '', o2_nf: nf ? f2(nf.ocr) : '', syn_nf: nf ? pc(nf.cover) : '', byp_nf: nf ? pc(nf.bypass) : '', dpsi_nl: nl ? mv(nl.dpsi) : '',
      dp: String(Math.round(r.dp)), o2_nl: nl ? f2(nl.ocr) : '', ddpsi: nb ? String(Math.round(Math.abs(r.dpsi)) - Math.round(Math.abs(nb.dpsi))) : '', dph: fmt(r.dph || 0, 2), syn: pc(r.cover), syn_0: pc(REF.cover), atp: f2(r.atp_pos == null ? Math.max(0, r.atp) : r.atp_pos),
      atp_0: f2(REF.atp_pos), byp: pc(r.bypass), byp_0: pc(REF.bypass), nadh: f2(r.nadh_m), nadh_0: f2(REF.nadh_m), nadh_n: nb ? f2(nb.nadh_m) : '',
      ros: f2(r.ros), po: isFinite(r.po) ? f2(r.po) : '—', lk: fmt(s.leak, 1), f: String(Math.round(s.fccp * 100)), pump: String(Math.round(s.pump * 100)),
      vatp: f2(Math.max(0, r.atp_raw == null ? r.atp : r.atp_raw)),
    };
  }
  /* подпись выбирается по тем же величинам, что и показания (r, s) */
  function capKey(s, r){
    if (s.obj === 'ves'){
      if (s.pump < 0.02) return 'cv_none';
      if (s.fccp > 0.02) return 'cv_fccp';
      if (s.oligo) return M.vesicle({ pump: s.pump, oligo: false, d: D_NORM }).atp_raw < 0.005 ? 'cv_low' : 'cv_oligo';
      return r.atp_raw < 0.005 ? 'cv_low' : 'cv_atp';
    }
    const P = s.pier && !s.succ, blk = s.anti || P, F = s.fccp > 0.02;
    const nOf = o => M.cell(Object.assign(args(s), o));
    if (s.anti && s.oligo) return 'c_ao';
    if (blk && F) return Math.abs(nOf({ fccp: 0 }).dpsi) < 3 ? 'c_blk_f0' : 'c_blk_f';
    if (s.anti) return s.leak > 1.05 ? 'c_anti_lk' : 'c_anti';
    if (P && s.oligo) return 'c_po';
    if (P) return 'c_pier';
    if (s.fccp > 1.8) return 'c_fx';
    if (s.oligo) return F ? 'c_of' : 'c_o';
    if (F){ if (r.atp < -0.005) return 'c_fccp_rev'; const n0 = nOf({ fccp: 0 }); return (n0.ocr > 0.95 && r.ocr - n0.ocr < 0.01) ? 'c_fccp_lim' : 'c_fccp'; }
    if (s.pier && s.succ) return 'c_pier_succ';
    if (s.leak > 1.05){ const n1 = nOf({ leak_mult: 1 }); return (n1.ocr > 0.95 && r.ocr - n1.ocr < 0.01) ? 'c_leak_lim' : 'c_leak'; }
    if (s.succ) return r.cover >= 0.9 ? 'c_succ' : 'c_succ_lim';
    return s.dsel === 'low' ? 'c_low' : s.dsel === 'high' ? 'c_high' : 'c_base';
  }

  /* ---------- разметка схемы (общая для 1б и 1п) ---------- */

  /* ---------- схема: рисование, частицы, вращение синтазы ---------- */
  function scheme(K, adv){
    const I = n => `${K}_${n}`, st = { T: 0, ang: 0, omega: 0, dp: 170 };
    const mkStream = (x, y0, y1, n, w, v) => ({ x, y0, y1, n, w, v, flow: 0, el: [] });
    const S = { pI: mkStream(21, 252, 150, NPUMP, 8, .30), pIII: mkStream(189, 252, 150, NPUMP, 8, .30), pIV: mkStream(287, 252, 150, NPUMP, 8, .30),
      rS: mkStream(467, 150, 252, NRET, 5, .34), rL: mkStream(357, 150, 252, NRET, 10, .34), rF: mkStream(377, 150, 252, NRET, 6, .34) };
    if (adv) S.pBR = mkStream(119, 252, 150, NBR, 10, .30);
    const POOLN = 40, pool = [];
    function build(){
      const pg = $(I('pool'));
      for (let i = 0; i < POOLN; i++){
        const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', 'pp'); c.setAttribute('r', '2.6'); c.setAttribute('opacity', '0'); pg.appendChild(c);
        pool.push({ el: c, x: 26 + ((i * 0.6180339) % 1) * 450, y: 58 + ((i * 2.6457513) % 1) * 84, a: i * 1.7 });
      }
      const g = $(I('pp'));
      Object.values(S).forEach((s, si) => { for (let i = 0; i < s.n; i++){
        const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', 'pp'); c.setAttribute('r', '2.5'); c.setAttribute('opacity', '0'); g.appendChild(c);
        s.el.push(c); } });
    }
    function placePool(){
      const n = Math.round(POOLN * clamp((st.dp - 60) / 140));
      pool.forEach((q, i) => { if (i >= n){ q.el.setAttribute('opacity', '0'); return; }
        q.el.setAttribute('cx', (q.x + 4 * Math.sin(st.T * .8 + q.a)).toFixed(1)); q.el.setAttribute('cy', (q.y + 4 * Math.cos(st.T * .6 + q.a * 1.3)).toFixed(1)); q.el.setAttribute('opacity', '.62'); });
    }
    function place(){
      placePool();
      Object.values(S).forEach(s => {
        const cnt = Math.abs(s.flow) * FLOWK, dir = s.flow < 0 ? -1 : 1;
        for (let i = 0; i < s.n; i++){
          const c = s.el[i], a = clamp(cnt - i, 0, 1);
          if (a <= 0){ c.setAttribute('opacity', '0'); continue; }
          let f = (st.T * s.v + i / s.n) % 1; if (dir < 0) f = 1 - f;
          const fade = Math.min(1, f / 0.16, (1 - f) / 0.16), off = (((i * 37) % 97) / 97 - .5) * s.w;
          c.setAttribute('cx', (s.x + off).toFixed(1)); c.setAttribute('cy', (s.y0 + (s.y1 - s.y0) * f).toFixed(1)); c.setAttribute('opacity', (a * Math.max(.15, fade)).toFixed(2));
        }
      });
    }
    function draw(s, r){
      const ves = s.obj === 'ves';
      $(I('cellg')).style.display = ves ? 'none' : ''; if (adv) $(I('vesg')).style.display = ves ? '' : 'none';
      $(I('gcell')).style.display = ves ? 'none' : ''; if (adv) $(I('gves')).style.display = ves ? '' : 'none';
      setTxt(I('lblT'), t(ves ? 'lbl_in_v' : 'lbl_ims')); setTxt(I('lblB'), t(ves ? 'lbl_out_v' : 'lbl_mtx'));
      $(I('sgn')).setAttribute('opacity', (ves ? clamp(r.dp / 170) : clamp(-r.dpsi / 150)).toFixed(2));
      const act = r.ocr > 0.02, P = s.pier && !s.succ;
      if (!ves){
        setTxt(I('stoich'), t(s.succ ? 'lbl_h6' : 'lbl_h10'));
        const eon = (id, on) => { $(id).style.opacity = on ? (.25 + .75 * clamp(r.ocr)).toFixed(2) : .09; };
        eon(I('eN'), act && !s.succ); eon(I('eIQ'), act && !s.succ); eon(I('eS'), act && s.succ); eon(I('eIIQ'), act && s.succ);
        ['eQ3', 'e3c', 'ec4', 'e4O'].forEach(n => eon(I(n), act));
        $(I('lN')).style.opacity = s.succ ? .4 : 1; $(I('lS')).style.opacity = s.succ ? 1 : .4;
        setBoxState(I('c1'), P ? 'inh' : (act && !s.succ ? 'on' : null)); setBoxState(I('c2'), act && s.succ ? 'on' : null);
        setBoxState(I('c3'), s.anti ? 'inh' : (act ? 'on' : null)); setBoxState(I('c4'), act ? 'on' : null);
        setCls(I('q_c'), act ? 'on' : 'off'); setCls(I('cc_c'), act ? 'on' : 'off');
        setOp(I('xI'), s.pier ? 1 : 0); setOp(I('xIII'), s.anti ? 1 : 0); vis(I('tgP'), s.pier); vis(I('tgA'), s.anti);
        /* частицы по стехиометрии: NADH 4 : 4 : 2 (I, III, IV), сукцинат 4 : 2 (III, IV) — аудит S07 */
        S.pI.flow = (!s.succ && !s.anti) ? r.src * .4 : 0; S.pIII.flow = r.src * (s.succ ? 4 / 6 : .4); S.pIV.flow = r.src * (s.succ ? 2 / 6 : .2);
        if (adv) S.pBR.flow = 0;
      } else {
        S.pI.flow = 0; S.pIII.flow = 0; S.pIV.flow = 0;
        setBoxState(I('br_r'), s.pump > 0.02 ? 'on' : null); S.pBR.flow = r.src;
        $(I('light')).style.opacity = (.25 + .75 * s.pump).toFixed(2);
      }
      setBoxState(I('fo_r'), s.oligo ? 'inh' : (Math.abs(r.atp) > 0.02 ? 'on' : null)); setOp(I('xFo'), s.oligo ? 1 : 0); vis(I('tgO'), s.oligo);
      setCls(I('hd'), Math.abs(r.atp) > 0.02 && !s.oligo ? 'on' : 'off');
      const fv = s.fccp > 0.02; vis(I('fc'), fv); if (fv) $(I('fc')).setAttribute('opacity', (.4 + .6 * Math.min(1, s.fccp)).toFixed(2));
      const pw = 18 + (s.leak - 1) * 2.4; $(I('pore')).setAttribute('width', pw.toFixed(1)); $(I('pore')).setAttribute('x', (357 - pw / 2).toFixed(1));
      /* ток ATP: вперёд (синтез) или обратно (гидролиз) */
      const atp = ves ? (r.atp_raw == null ? r.atp : r.atp_raw) : r.atp, ap = Math.max(0, atp), an = Math.max(0, -atp);
      $(I('eATP')).style.strokeWidth = (2 + 9 * clamp(ap / 0.85)).toFixed(1); $(I('eATP')).style.opacity = ap > 0.01 ? 1 : .1;
      $(I('eATPr')).style.strokeWidth = (2 + 40 * clamp(an)).toFixed(1); $(I('eATPr')).setAttribute('opacity', an > 0.005 ? 1 : 0);
      /* ADP + Pi: при синтезе — к F₁, при гидролизе — от F₁; при блоке F₀ обе стрелки приглушены */
      $(I('eADP')).style.opacity = ap > 0.01 ? 1 : .12; $(I('eADPr')).style.opacity = an > 0.005 ? 1 : 0;
      setTxt(I('useT'), t(ves ? 'lbl_use_v' : 'lbl_use')); setTxt(I('useL'), ves ? '' : t('d_' + s.dsel));
      S.rS.flow = atp; S.rL.flow = r.leak; S.rF.flow = r.fc; st.dp = r.dp;
      st.omega = Math.abs(atp) < 0.004 ? 0 : Math.sign(atp) * (30 + 330 * clamp(Math.abs(atp)));
      /* прибор Δψ (в клетке) / Δp (везикулы) */
      if (!ves){ $(I('gm')).setAttribute('transform', `translate(0 ${gyC(-r.dpsi).toFixed(1)})`); setTxt(I('gv'), mv(r.dpsi)); }
      else { $(I('gmv')).setAttribute('transform', `translate(0 ${gyV(r.dp).toFixed(1)})`); setTxt(I('gvv'), String(Math.round(r.dp))); }
      place();
    }
    function tick(dt){
      st.T += dt; st.ang = (st.ang + st.omega * dt) % 360;
      const g = $(I('rot')); if (g) g.setAttribute('transform', `rotate(${st.ang.toFixed(1)} 451 300)`);
      place();
    }
    return { build, draw, tick, markup: () => schemeMarkup(K, adv), S };
  }

  /* ---------- показания ---------- */
  function mrow(name, sub, v, text, g){
    const h = `<div class="read" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-family:var(--f-body);font-size:14.5px;font-weight:600">${name}</b><span class="v">${text}</span></div>${sub ? `<small>${sub}</small>` : ''}<div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div></div>`;
    return g ? `<div class="gr" data-g="${g}">${h}</div>` : h;
  }
  function readsHTML(s, r, adv){
    const ves = s.obj === 'ves', V = vals(s, r);
    const dp = ves ? r.dp : r.dp, a = clamp(FPHr(r) ), b = 1 - a;
    const dpRow = `<div class="gr" data-g="dpsi"><div class="read" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-family:var(--f-body);font-size:14.5px;font-weight:600">${t('r_dp')}</b><span class="v">${V.dp} ${t('mv')}</span></div>
      ${ves ? '' : `<div class="stackbar"><i class="a" style="width:${Math.round((1 - FPHr(r)) * 100)}%"></i><i class="b" style="width:${Math.round(FPHr(r) * 100)}%"></i></div><div class="stackkey"><span class="a">Δψ ${V.dpsi} ${t('mv')}</span><span class="b">ΔpH ${V.dph}</span></div>`}</div></div>`;
    const atp = ves ? r.atp_raw : r.atp;
    const rev = atp < -0.005;
    let h = dpRow;
    if (!ves) h += mrow(t('r_o2'), '', r.ocr, V.o2, 'o2');
    h += mrow(t(ves ? 'r_atp_v' : 'r_atp'), t(ves ? 'r_atp_vs' : 'r_atp_s'), ves ? r.atp / D_NORM : r.cover, rev ? t('v_rev') : (ves ? V.vatp : V.syn + '\u00a0%'), 'atps');
    if (!ves){ h += mrow(t('r_nadh'), '', r.nadh_m, V.nadh, 'nadh'); h += mrow(t('r_ros'), '', clamp(r.ros), V.ros, 'ros'); }
    h += mrow(t('r_byp'), '', isFinite(r.bypass) ? r.bypass : 0, isFinite(r.bypass) ? V.byp + '\u00a0%' : '—', 'bypass');
    if (adv && !ves) h += `<div class="gr" data-g="po"><div class="read"><div><b>${t('r_po')}</b><small>${t('r_po_s')}</small></div><span class="v">${V.po}</span></div></div>`;
    return h;
  }
  const FPHr = r => (r.dph != null ? (r.dph * M.ZPH) / r.dp : M.FPH);

  return { M, vals, capKey, scheme, readsHTML, mv, f2, pc, dOf, args, D_LOW, D_HIGH, D_NORM, REF, gyC, gyV, vis };
})();

/* ================= 1б: базовый уровень ================= */
(function(){
  const K = '1b', Z = Q1, M = Z.M;
  layout(K);

  /* ---------- схема: рисование и частицы ---------- */
  function scheme(K){
    const I = n => `${K}_${n}`, st = { T: 0 };
    const mk = (x, y0, y1, n, w, v, cls) => ({ x, y0, y1, n, w, v, flow: 0, cls: cls || 'pp', r: 2.5, el: [] });
    const S = {
      pC: mk(44, 252, 150, 12, 8, .30), pG: mk(128, 252, 150, 12, 8, .30),
      rS: mk(237, 150, 252, 32, 6, .34), rL: mk(284, 150, 252, 32, 8, .34), rF: mk(274, 150, 252, 32, 5, .34),
      ca: mk(321, 130, 300, 34, 8, .28, 'ppCa'), im: mk(396, 90, 290, 16, 12, .22, 'ppIm'),
    };
    S.ca.r = 3; S.im.r = 3.2;
    function build(){
      const g = $(I('pp'));
      Object.values(S).forEach(s => { for (let i = 0; i < s.n; i++){ const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', s.cls); c.setAttribute('r', s.r); c.setAttribute('opacity', '0'); g.appendChild(c); s.el.push(c); } });
    }
    function place(){
      Object.values(S).forEach(s => {
        const cnt = Math.abs(s.flow) * (s.k || FLOWK), dir = s.flow < 0 ? -1 : 1;
        for (let i = 0; i < s.n; i++){
          const c = s.el[i], a = clamp(cnt - i, 0, 1);
          if (a <= 0){ c.setAttribute('opacity', '0'); continue; }
          let f = (st.T * s.v + i / s.n) % 1; if (dir < 0) f = 1 - f;
          const fade = Math.min(1, f / 0.16, (1 - f) / 0.16), off = (((i * 37) % 97) / 97 - .5) * s.w;
          c.setAttribute('cx', (s.x + off).toFixed(1)); c.setAttribute('cy', (s.y0 + (s.y1 - s.y0) * f).toFixed(1)); c.setAttribute('opacity', (a * Math.max(.15, fade)).toFixed(2));
        }
      });
    }
    S.ca.k = 60; S.im.k = 16;
    /* плашки препаратов: одна строка слева направо, при нехватке места — вторая; ширина по длине текста с запасом */
    function chips(s){
      const list = [];
      if (s.obj === 'cell' && s.blk === 'pier') list.push(['pier', t('tag_pier')]);
      if (s.obj === 'cell' && s.blk === 'anti') list.push(['anti', t('tag_anti')]);
      if (s.oligo) list.push(['oligo', t('tag_oligo')]);
      if (s.bka) list.push(['antx', t('tag_bka')]);
      if (s.fccp > 0.02) list.push(['fccp', t('tag_fccp', { f: Math.round(s.fccp * 100) })]);
      if (s.ca !== 'norm') list.push(['mcu', t('tag_ca', { k: CA_NUM[s.ca] })]);
      if (s.ru) list.push(['ru', t('tag_ru')]);
      let x = 6, y = 6, h = '';
      list.forEach(([g, lab]) => {
        const w = Math.ceil(lab.length * 6.9 + 18);
        if (x + w > 458 && x > 6){ x = 6; y += 24; }
        h += `<g class="chip clickable" data-g="${g}"><rect x="${x}" y="${y}" width="${w}" height="20" rx="10"/><text class="lbl" x="${x + w / 2}" y="${y + 10.5}" font-size="11.5" font-weight="700" style="fill:var(--chip-ink)">${lab}</text></g>`;
        x += w + 6;
      });
      $(I('chips')).innerHTML = h;
    }
    function draw(s, r){
      const rho = s.obj === 'rho', blkC = s.blk !== 'none' && !rho;
      $(I('sgn')).setAttribute('opacity', clamp(-r.dpsi / 150).toFixed(2));
      chips(s);
      /* источник тока: цепь (клетка) или генератор «ANT + F₁ без F₀» (ρ⁰) */
      const act = r.ocr > 0.02;
      $(I('chainG')).style.opacity = rho ? .5 : 1;
      setBoxState(I('c'), rho || blkC ? 'inh' : (act ? 'on' : null)); setOp(I('xC'), rho || blkC ? 1 : 0);
      $(I('eN')).style.opacity = act ? (.25 + .75 * clamp(r.ocr)).toFixed(2) : .09;
      $(I('genG')).setAttribute('opacity', rho ? 1 : 0);
      setBoxState(I('g'), rho && r.gen > 0.002 ? 'on' : (rho ? 'inh' : null));
      const gOn = rho && r.gen > 0.002;
      setOp(I('xG'), rho && s.bka ? 1 : 0);
      $(I('gATP')).style.opacity = gOn ? 1 : .12; $(I('gADP')).style.opacity = gOn ? 1 : .12;
      $(I('gATP')).style.strokeWidth = (2 + 40 * clamp(r.gen)).toFixed(1); $(I('gADP')).style.strokeWidth = (2 + 40 * clamp(r.gen)).toFixed(1);
      /* полосы шкалы — референсные зависимости; гаснут, если путь заблокирован (аудит V07) */
      $(I('st_a')).style.opacity = (s.oligo || s.bka || rho) ? .25 : 1; $(I('st_c')).style.opacity = s.ru ? .25 : 1;
      /* потребитель 1: ANT + ATP-синтаза */
      const synX = s.oligo || rho, antX = s.bka;
      /* при скрытом показании ATP (нагрузка Ca²⁺, вопрос 3) поток синтеза не рисуется: нейтральное серое состояние (аудит V04) */
      const hid = atpHidden(s), atpS = hid ? 0 : r.atp, ap = Math.max(0, atpS), an = Math.max(0, -atpS);
      setBoxState(I('syn_r'), synX ? 'inh' : (hid ? null : (Math.abs(r.atp) > 0.02 ? 'on' : null))); setOp(I('xSyn'), synX ? 1 : 0);
      setBoxState(I('ant_r'), antX ? 'inh' : (hid ? null : (r.atp > 0.02 ? 'on' : null))); setOp(I('xAnt'), antX ? 1 : 0);
      $(I('eATP')).style.stroke = hid ? 'var(--muted)' : 'var(--mtor)';
      $(I('eATP')).style.strokeWidth = (hid ? 3 : 2 + 9 * clamp(ap / 0.85)).toFixed(1); $(I('eATP')).style.opacity = hid ? .45 : (ap > 0.01 && !rho ? 1 : .1);
      $(I('eADP')).style.opacity = hid ? .3 : (ap > 0.01 && !rho ? 1 : .12);
      /* утечка и FCCP */
      const fv = s.fccp > 0.02; vis(I('fc'), fv); if (fv) $(I('fc')).setAttribute('opacity', (.4 + .6 * Math.min(1, s.fccp)).toFixed(2));
      /* MCU и TIM23 */
      setBoxState(I('mcu_r'), s.ru ? 'inh' : (r.ica > 0.003 ? 'on' : null)); setOp(I('xMcu'), s.ru ? 1 : 0);
      setBoxState(I('tim_r'), r.imp > 0.5 ? 'on' : null); setBoxState(I('tom_r'), r.imp > 0.5 ? 'on' : null);
      $(I('pk')).setAttribute('opacity', rho ? 0 : clamp(r.pink * 1.1).toFixed(2));
      /* потоки частиц */
      /* H⁺ через синтазу: внутрь при синтезе, наружу при обратной работе (аудит V02); у ρ⁰ H⁺ через «ANT + F₁» не переносятся — показаны ATP⁴⁻ внутрь и ADP³⁻ наружу (аудит V03) */
      S.pC.flow = r.src; S.pG.flow = 0; S.rS.flow = ap > 0.005 ? atpS : (an > 0.005 ? -an : 0); S.rL.flow = r.leak; S.rF.flow = r.fc;
      S.ca.flow = r.ica; S.im.flow = r.imp * (rho ? 1 : 1);
      /* прибор Δψ */
      const a = Math.abs(r.dpsi);
      $(I('gm')).setAttribute('transform', `translate(0 ${gy(a).toFixed(1)})`); setTxt(I('gval'), mv(r.dpsi));
      place();
    }
    function tick(dt){ st.T += dt; place(); }
    return { build, draw, tick, markup: () => schemeMarkup(K), S };
  }

  /* ---------- показания ---------- */
  function mrow(name, sub, v, text, g){
    const h = `<div class="read" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-family:var(--f-body);font-size:14.5px;font-weight:600">${name}</b><span class="v">${text}</span></div>${sub ? `<small>${sub}</small>` : ''}<div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div></div>`;
    return g ? `<div class="gr" data-g="${g}">${h}</div>` : h;
  }
  function readsHTML(s, r){
    const V = vals(s, r), rho = s.obj === 'rho', hid = atpHidden(s);
    let h = mrow(t('r2_dpsi'), '', Math.abs(r.dpsi) / GMAX, `${V.dpsi} ${t('mv')}`, 'dpsi2');
    h += mrow(t('r2_o2'), rho ? t('r2_o2_rho') : '', r.ocr, V.o2, 'o2');
    h += mrow(t('r2_atp'), t(hid ? 'r2_atp_hid' : 'r2_atp_s'), hid ? 0 : r.cover, hid ? '—' : V.syn + '\u00a0%', 'antx');
    h += mrow(t('r2_ca'), t('r2_ca_s'), r.ca_up / 3, V.ca, 'mcu');
    h += mrow(t('r2_imp'), t('r2_imp_s'), r.imp, V.imp + '\u00a0%', 'import');
    h += mrow(t('r2_pink'), t(rho ? 'r2_pink_rho' : 'r2_pink_s'), rho ? 0 : r.pink, rho ? '—' : V.pink + '\u00a0%', 'pink1');
    h += mrow(t('r2_tmrm'), t('r2_tmrm_s'), r.tmrm / 1.5, V.tmrm, 'tmrm');
    h += mrow(t('r2_ros'), rho ? t('r2_ros_rho') : '', rho ? 0 : clamp(r.ros), rho ? '—' : V.ros, 'ros');
    return h;
  }
  /* ---------- кривая TMRM с добавками: вторая «чашка», схема образца не меняется ---------- */
  const PH_X = 3;
  function traceSeries(pr){ const pts = []; pr.levels.forEach((lv, p) => { for (let j = 0; j < 3; j++) pts.push([PH_X * p + .5 + j, lv]); }); return pts; }
  function protoRows(pr){

/* =====================================================================
   Вопрос 3. Передача Ca²⁺ в контактах ЭПР и митохондрии: от согласования метаболизма до перегрузки
   3б — базовый: «Сигнал IP₃» и «Контакт ЭПР–митохондрия»
   3п (ключ 3a) — продвинутый: + длительность сигнала, генотип (нет MICU1 / нет MCU), ингибитор MCU, CGP-37157, циклоспорин A, тапсигаргин
   Расчёт — mito.js (run3, sample3): протокол одного сигнала IP₃; схема, показания и подпись — момент «конец сигнала» (T0 + D − 2 с).
   Подписи выбираются по тем же величинам и порогам, что и показания.

const Q3 = (function(){

  const DY = { near: 0, mid: -14, far: -46 };                     // сдвиг ЭПР вверх: ширина щели на схеме
  const NM = { near: '15', mid: '30', far: '50' };
  const P_OPEN = 0.05, A_ON = 0.3, CM_LOW = 0.25, CM_BUF = 2.8;     // пороги подписей (те же, что в показаниях)
  const fCa = x => (x == null || !isFinite(x)) ? '—' : (x >= 10 ? String(Math.round(x)) : fmt(x, 2));
  const fP = x => { const v = x * 100; if (v < 0.5) return '0'; return String(Math.round(v)); };
  const base = () => ({ S: 0, contact: 'near', dur: 'short', geno: 'wt', ru: false, cgp: false, csa: false, tg: false });
  const mcuOn = s => s.geno !== 'mcu' && !s.ru;
  const sigOn = s => s.S > 0.02 && !s.tg;
  const CACHE = new Map();
  function sim(s){
    const k = JSON.stringify(s);
    if (!CACHE.has(k)){ if (CACHE.size > 200) CACHE.clear(); CACHE.set(k, M.sample3(s)); }
    return CACHE.get(k);
  }
  const lpct = (L, s) => String(Math.round(L / P3.LP * 100));      // накопленный Ca²⁺ в % порога поры без циклоспорина A
  const fmtT = x => (Math.abs(x - Math.round(x)) < 0.01 ? String(Math.round(x)) : fmt(x, 1));

  /* ---------- значения для подстановки ---------- */
  function vals(s, R){
    const z = R.z, rest = sim(Object.assign({}, s, { S: 0 })).z, wt = sim(Object.assign({}, s, { geno: 'wt', ru: false })).z;
    const wt0 = sim(base()).z, nocgp = sim(Object.assign({}, s, { cgp: false })).z;

      dpsi: mv(z.dpsi), dpsi0: mv(rest.dpsi), dpsi_c: mv(z.dpsi_c), cov: pc(z.cover), cov0: pc(rest.cover), dm: ruTimes(z.d / M.D_DIV),
      ptp: fP(z.P), ptp_end: fP(R.P_end), lp2: String(Math.round(P3.LP_CSA / P3.LP * 100)),
      tr: fmtT(z.t), tmax: fmtT(R.tLmax), pc_o: fP(z.P), pc_c: fP(1 - z.P), dpsi_o: mv(z.dpsi_o), dpsi_cl: mv(z.dpsi_c),
      dem: '×' + fmt(z.d / M.D_DIV, 1), dem0: '×' + fmt(rest.d / M.D_DIV, 1),

  function capParts(s, R){

    const dN = Math.round(z.nadh * 100) - Math.round(rest.nadh * 100);      /* сдвиг индекса восстановленности по видимым числам */
    /* заголовок: сигнал и контакт */
    if (s.tg) keys.push(s.S > 0.02 ? 'c3h_tg' : 'c3h_tg0');

      else if (z.A >= 0.1) keys.push('c3d_rest_up');

    if (open) keys.push(s.csa ? 'c3p_open_csa' : 'c3p_open');

    if (!open){

      else if (s.csa) keys.push('c3p_csa0');

  /* ---------- схема ---------- */
  function markup(K){

    const ticks = [50, 100, 150].map(a => `<line class="gtick" x1="541" y1="${gy(a).toFixed(1)}" x2="546" y2="${gy(a).toFixed(1)}"/>`).join('');
    return `<defs>
      <marker id="a_${K}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
      <marker id="e_${K}" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mk-e"/></marker>

      <circle class="popdot o" cx="217" cy="359" r="4"/><text id="${I('popO')}" class="small-lbl" x="225" y="362.5"></text></g>

    <!-- шкала Δψ (те же место и цвет, что на вкладках 1 и 2) -->
    <g id="${I('gauge')}" class="clickable" data-g="dpsi3"><title>${t('gn_dpsi3')}</title>

    <g id="${I('gpop')}" opacity="0"><line id="${I('gpc')}" class="gpop c" x1="490" y1="0" x2="518" y2="0"/><line id="${I('gpo')}" class="gpop o" x1="490" y1="0" x2="518" y2="0"/></g>
    <g id="${I('gm')}"><line x1="462" y1="0" x2="546" y2="0" stroke="var(--ink)" stroke-width="2.4"/><polygon points="466,0 456,-6 456,6" class="gmark"/></g>
    <text class="small-lbl" x="468" y="388" style="font-size:10px">${t('g3_n1')}</text><text class="small-lbl" x="468" y="399" style="font-size:10px">${t('g3_n2')}</text>`;
  }

  function scheme(K){
    const I = n => `${K}_${n}`, st = { T: 0, dy: 0 };
    const mk = (x, y0, y1, n, w, v, cls) => ({ x, y0, y1, n, w, v, flow: 0, cls: cls || 'ppCa', r: 3, el: [] });
    const S = {
      rel: mk(162, 40, 116, 18, 5, .45),                 // ЭПР → IP₃R → микродомен
      upt: mk(162, 118, 262, 26, 5, .32),                  // микродомен → VDAC1 → MCU → матрикс
      out: mk(236, 262, 150, 22, 5, .30),                  // матрикс → NCLX → межмембранное пространство
      ptp: mk(390, 262, 150, 22, 6, .36),                 // матрикс → пора
    };
    /* пулы Ca²⁺: неподвижные точки, видимая доля — по концентрации */
    const POOL = { er: { n: 26, x0: 20, x1: 250, y0: 26, y1: 74 }, cy: { n: 14, x0: 250, x1: 450, y0: 34, y1: 120 }, mt: { n: 30, x0: 196, x1: 446, y0: 252, y1: 300 } };
    const rnd = (i, s) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v); };
    function build(){
      const g = $(I('pp'));
      Object.values(S).forEach(s => { for (let i = 0; i < s.n; i++){ const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', s.cls); c.setAttribute('r', s.r); c.setAttribute('opacity', '0'); g.appendChild(c); s.el.push(c); } });
      const pool = (gid, P, seed) => { let h = ''; for (let i = 0; i < P.n; i++) h += `<circle class="ppCa" r="2.6" cx="${(P.x0 + rnd(i, seed) * (P.x1 - P.x0)).toFixed(1)}" cy="${(P.y0 + rnd(i, seed + 7) * (P.y1 - P.y0)).toFixed(1)}" opacity="0"/>`; $(I(gid)).innerHTML = h; };
      pool('erCa', POOL.er, 1); pool('cyto', POOL.cy, 2); pool('mCa', POOL.mt, 3);
      let h = ''; for (let i = 0; i < 16; i++) h += `<rect class="capi" x="${(300 + rnd(i, 5) * 140).toFixed(1)}" y="${(372 + rnd(i, 9) * 20).toFixed(1)}" width="5" height="5" rx="1" opacity="0"/>`;
      $(I('capi')).innerHTML = h;
    }
    const fill = (gid, frac) => { const c = $(I(gid)).children, n = c.length; for (let i = 0; i < n; i++) c[i].setAttribute('opacity', clamp(frac * n - i) > 0 ? clamp(frac * n - i).toFixed(2) : '0'); };
    function place(){
      Object.values(S).forEach(s => {
        const cnt = Math.abs(s.flow) * s.n;
        const y0 = s === S.rel ? s.y0 + st.dy : s.y0, y1 = s === S.rel ? 117 + st.dy / 2 : s.y1;
        for (let i = 0; i < s.n; i++){
          const c = s.el[i], a = clamp(cnt - i, 0, 1);
          if (a <= 0){ c.setAttribute('opacity', '0'); continue; }
          const f = (st.T * s.v + i / s.n) % 1, fade = Math.min(1, f / 0.14, (1 - f) / 0.14), off = (((i * 37) % 97) / 97 - .5) * s.w;
          c.setAttribute('cx', (s.x + off).toFixed(1)); c.setAttribute('cy', (y0 + (y1 - y0) * f).toFixed(1)); c.setAttribute('opacity', (a * Math.max(.15, fade)).toFixed(2));
        }
      });
    }
    function chips(s){
      const list = [];
      if (s.geno === 'micu1') list.push(['micu1', t('tag3_micu')]);
      if (s.geno === 'mcu') list.push(['mcu3', t('tag3_mcuko')]);
      if (s.ru) list.push(['mcu3', t('tag_ru')]);
      if (s.cgp) list.push(['nclx', t('tag3_cgp')]);
      if (s.csa) list.push(['cypd', t('tag3_csa')]);
      if (s.tg) list.push(['tg', t('tag3_tg')]);
      let x = 288, y = 6, h = '';
      list.forEach(([g, lab]) => { const w = Math.ceil(lab.length * 6.6 + 16); if (x + w > 458 && x > 288){ x = 288; y += 22; }
        h += `<g class="chip clickable" data-g="${g}"><rect x="${x}" y="${y}" width="${w}" height="19" rx="9.5"/><text class="lbl" x="${x + w / 2}" y="${y + 10}" font-size="11" font-weight="700" style="fill:var(--chip-ink)">${lab}</text></g>`; x += w + 5; });
      $(I('chips')).innerHTML = h;
    }
    function draw(s, R){
      const z = R.z, on = sigOn(s), dy = DY[s.contact], mcu = mcuOn(s), open = z.P >= P_OPEN;
      st.dy = dy;
      chips(s);
      $(I('erG')).style.transform = `translate(0px,${dy}px)`;
      /* ЭПР: запас Ca²⁺ (при тапсигаргине истощён) */
      fill('erCa', s.tg ? 0.08 : 1);
      $(I('ip3')).setAttribute('opacity', on ? (.45 + .55 * s.S).toFixed(2) : 0);
      setBoxState(I('ip3r'), on ? 'on' : null);
      /* микродомен и цитоплазма */
      const gap = 26 - dy, my = 104 + dy + gap / 2;
      const md = $(I('mdom')); md.setAttribute('cy', (117 + dy / 2).toFixed(1)); md.setAttribute('ry', (gap / 2).toFixed(1));
      md.setAttribute('opacity', (clamp(z.cmic / 20) * .55).toFixed(2));
      $(I('mdl')).setAttribute('y', (my + 4).toFixed(1));
      $(I('tether')).style.opacity = s.contact === 'far' ? .15 : 1;
      $(I('tl1')).setAttribute('d', `M170 ${96 + dy} L182 117`);
      setTxt(I('gapl'), t('lbl3_gap_' + s.contact));
      $(I('gapl')).setAttribute('y', (my + 18).toFixed(1));
      fill('cyto', clamp((z.cb - 0.05) / 1.0));
      /* MCU, MICU1, NCLX */
      setBoxState(I('mcu_r'), mcu ? (z.jin - P3.JRES > 2 ? 'on' : null) : 'inh'); setOp(I('xMcu'), mcu ? 0 : 1);
      $(I('mcu')).style.opacity = s.geno === 'mcu' ? .35 : 1;
      $(I('micu')).style.opacity = s.geno === 'micu1' ? .12 : 1;
      setBoxState(I('micu_r'), s.geno !== 'micu1' && mcu && on && z.u > 1 ? 'on' : null);
      setBoxState(I('nclx_r'), s.cgp ? 'inh' : (z.jout > 2 ? 'on' : null)); setOp(I('xNclx'), s.cgp ? 1 : 0);
      setBoxState(I('vdac_r'), on && mcu && z.u > 1 ? 'on' : null);
      /* матрикс: свободный Ca²⁺, фосфат кальция, дегидрогеназы */
      fill('mCa', clamp(z.cm / P3.CCL));
      const grains = clamp((z.L - P3.CCL) / (P3.LP * 1.6 - P3.CCL));
      fill('capi', grains); $(I('capl')).setAttribute('opacity', grains > 0.05 ? 1 : 0);
      setBoxState(I('dh_r'), z.A >= A_ON ? 'on' : null);
      $(I('eAct')).style.opacity = (0.12 + 0.88 * clamp(z.A)).toFixed(2);
      $(I('eN')).style.opacity = (0.2 + 0.8 * clamp(z.ocr / 1.6)).toFixed(2);
      setBoxState(I('chain_r'), z.ocr > 0.02 ? 'on' : null);
      /* ATP-синтаза: синтез — бирюзовая стрелка вверх; при открытой поре часть синтаз работает в обратном направлении */
      const ap = Math.max(0, z.atp);
      setBoxState(I('syn_r'), ap > 0.02 ? 'on' : null);
      $(I('eATP')).style.strokeWidth = (2 + 6 * clamp(ap / 0.9)).toFixed(1); $(I('eATP')).style.opacity = ap > 0.01 ? 1 : .12;
      /* пора */
      const pr = $(I('ptp_r')); pr.classList.toggle('open', open); pr.style.opacity = (open ? .45 + .55 * z.P : 1).toFixed(2);
      /* две группы митохондрий: пора закрыта / открыта; Δψ и направление работы ATP-синтазы в каждой группе */
      $(I('popG')).setAttribute('opacity', open ? 1 : 0); $(I('gpop')).setAttribute('opacity', open ? 1 : 0);
      if (open){
        const no = Math.max(1, Math.min(20, Math.round(z.P * 20))); let ih = '';
        for (let i = 0; i < 20; i++) ih += `<rect class="popi ${i < no ? 'o' : 'c'}" x="${214 + i * 12}" y="326" width="9" height="7" rx="3.5"/>`;
        $(I('popI')).innerHTML = ih;
        setTxt(I('popC'), t('lbl3_pop_c', { p: fP(1 - z.P), d: mv(z.dpsi_c), a: t(z.atp_c >= 0 ? 'lbl3_syn' : 'lbl3_hyd') }));
        setTxt(I('popO'), t('lbl3_pop_o', { p: fP(z.P), d: mv(z.dpsi_o), a: t(z.atp_o >= 0 ? 'lbl3_syn' : 'lbl3_hyd') }));
        $(I('gpc')).setAttribute('y1', gy(Math.abs(z.dpsi_c)).toFixed(1)); $(I('gpc')).setAttribute('y2', gy(Math.abs(z.dpsi_c)).toFixed(1));
        $(I('gpo')).setAttribute('y1', gy(Math.abs(z.dpsi_o)).toFixed(1)); $(I('gpo')).setAttribute('y2', gy(Math.abs(z.dpsi_o)).toFixed(1));
      }
      setOp(I('xCsa'), s.csa ? 1 : 0);
      /* потоки */
      S.rel.flow = on ? clamp(s.S * (0.25 + 0.75 * P3.G_CONTACT[s.contact] / 1)) * 0.9 : 0;
      S.upt.flow = mcu ? clamp((z.jin - P3.JRES) / 22) : 0;
      S.out.flow = clamp(z.jout / 22);
      S.ptp.flow = open ? clamp(P3.KPOUT * z.P * z.L * 1.2) : 0;
      /* шкала Δψ */
      const a = Math.abs(z.dpsi);
      $(I('gm')).setAttribute('transform', `translate(0 ${gy(a).toFixed(1)})`); setTxt(I('gval'), mv(z.dpsi));
      place();
    }
    function tick(dt){ st.T += dt; place(); }
    return { build, draw, tick, markup: () => markup(K), S };
  }

  /* ---------- показания ---------- */
  /* плитка показания: название, значение, шкала; пояснения единиц — в значении или в справке по щелчку */
  function tile(name, v, text, g, wide, sub){
    return `<div class="gr tile${wide ? ' wide' : ''}" data-g="${g}"><div class="tn">${name}</div><div class="tv">${text}</div>${sub ? `<div class="ts">${sub}</div>` : ''}<div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div></div>`;
  }
  function readsHTML(s, R, adv){
    const z = R.z, V = vals(s, R);
    let h = tile(t('r3_cmic'), z.cmic / 20, `${V.cmic} ${t('um')}`, 'mdom');
    h += adv ? tile(t('r3_cb'), z.cb / 1.2, `${V.cb} ${t('um')}`, 'cyto3') : '';
    h += tile(t('r3_cm'), z.cm / 3.2, `${V.cm} ${t('um')}`, 'mcu3');
    h += tile(t('r3_load'), z.L / P3.LP / 2, t('r3_load_v', { v: V.lnow }), 'load3', false, t('r3_load_mx', V));
    h += tile(t('r3_dh'), z.A, V.act + '\u00a0%', 'dh');
    h += tile(t('r_nadh'), z.nadh, V.nadh, 'nadh3');
    h += tile(t('r_o2'), z.ocr / 2, V.o2, 'o2');
    h += tile(t('r3_dpsi'), Math.abs(z.dpsi) / GMAX, `${V.dpsi} ${t('mv')}`, 'dpsi3');
    h += tile(t('r3_dem'), (z.d / M.D_DIV - 1) / 3, V.dem, 'dem3');
    h += tile(t('r3_atp'), z.cover, V.cov + '\u00a0%', 'antx');
    h += tile(t('r3_ptp'), z.P, V.ptp + '\u00a0%', 'ptp', adv);
    return `<div class="when">${t('r3_when', V)}</div><div class="tiles">${h}</div>`;
  }
  /* ---------- график протокола: накопленный Ca²⁺ (% порога) и доля митохондрий с открытой порой ---------- */
  function plot(cv, s, R){
    if (!cv || !cv.clientWidth) return;
    const D = P3.DUR[s.dur], tr = M.tRead3(s.dur), lp = (s.csa ? P3.LP_CSA : P3.LP) / P3.LP * 100;
    const L = R.s.filter((q, i) => i % 2 === 0).map(q => [q.t, q.L / P3.LP * 100]);
    const Pp = R.s.filter((q, i) => i % 2 === 0).map(q => [q.t, q.P * 100]);
    const ymax = Math.max(lp + 30, ...L.map(q => q[1])) > 240 ? 300 : 250;
    const marks = sigOn(s) ? [P3.T0, P3.T0 + D] : [];
    plotLines(cv, [
      { data: [[0, lp], [P3.TEND, lp]], color: '--bad', dash: [6, 5], w: 1.6 },
      { data: Pp, color: '--lyso', dash: [2, 4], w: 2.6 },
      { data: L, color: '--aa', w: 2.8 },
    ], { xmax: P3.TEND, xstep: 60, xunit: t('tr3_x'), ymax, yticks: [0, 100, 200], ydec: 0, marks, markLabels: sigOn(s) ? [[P3.T0, t('tr3_sig')]] : [], cursor: tr,
         cursorLabel: t('tr3_now', { t: fmtT(tr) }), dots: R.Lmax / P3.LP * 100 >= 5 ? [[R.tLmax, R.Lmax / P3.LP * 100, '--aa', t('tr3_max')]] : [] });
  }
  return { M, P3, sim, vals, capParts, setCap3, scheme, readsHTML, plot, base, mcuOn, sigOn, fCa, fP, P_OPEN, A_ON, CM_LOW, CM_BUF, GMAX, NM };
})();

/* ---------- общая сборка уровня: разметка, ручки, показания, график ---------- */
function q3Scene(K, adv){
  const Z = Q3;
  layout(K);
  const sch = Z.scheme(K);
  $('svg' + K).innerHTML = sch.markup(); sch.build();
  const P = 's3' + (adv ? 'a' : 'b') + '_';
  const sl = (id, k, val) => `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O"></output></div><input type="range" id="${id}" min="0" max="100" step="5" value="${val}"></div>`;
  let c = sl(P + 's', 's3_s', 0) + segHTML(P + 'c', 's3_c', [['near', 'c3_near'], ['mid', 'c3_mid'], ['far', 'c3_far']], 'near');

  }
  return { update, redraw, tick: sch.tick, set, state: st };
}

   4б — базовый: «Доля мутантной мтДНК» и «Потребность ткани в энергии»
   4п (ключ 4a) — продвинутый: + какой ген мтДНК поражён, число копий мтДНК, мутация в ядерном гене, цибрид,
                 «бутылочное горлышко» (распределение долей у потомков), загадка «две клетки с 70 %»
   Расчёт — mito.js (state4, threshold4, bottleneck4); подписи — по тем же величинам и порогам, что и показания.
   ===================================================================== */
const Q4 = (function(){

  const COMPLEX_OF = { ND: 'I', CO: 'IV', ATP6: 'V', TL1: 'tRNA' };

    [8527, 9207, 'V'], [9207, 9990, 'IV'], [10059, 10404, 'I'], [10470, 10766, 'I'], [10760, 12137, 'I'], [12337, 14148, 'I'], [14149, 14673, 'I'], [14747, 15887, 'III']];

  const CACHE = new Map();

    const k = JSON.stringify(s);

      cap: pct0(r.cap), vs: pct0(r.vs / P4.VS0), cov: pc(r.cover), cov0: pc(wt0.cover), dpsi: mv(r.dpsi), dpsi0: mv(wt0.dpsi), o2: f2(r.ocr), o20: f2(wt0.ocr),

      const order = [...Array(n).keys()].sort((p, q) => rnd(p) - rnd(q)), mut = new Set(order.slice(0, nm));
      let h = '';
      for (let i = 0; i < n; i++){ const c = i % 10, row = Math.floor(i / 10); h += `<circle class="cpy${mut.has(i) ? ' m' : ''}" cx="${198 + c * 18}" cy="${258 + row * 22}" r="7"/><circle class="cpyh" cx="${198 + c * 18}" cy="${258 + row * 22}" r="2.4"/>`; }
      $(I('cp')).innerHTML = h;
      setTxt(I('cpl'), t('lbl4_cp', { n: String(n), m: String(nm), w: String(n - nm) }));
      /* цепочка от варианта до покрытия потребности (аудит v1.0, V04): те же числа, что в показаниях */
      const V = vals(s, r);
      if (s.nuclear && !s.cy) setTxt(I('ch1'), t('lbl4_ch_nuc', { f: V.fI }));
      else setTxt(I('ch1'), t('lbl4_ch1', { g: t('gs4_' + s.gene), wt: V.wt, cxs: t(s.gene === 'TL1' ? 'cx4_all' : 'cx4_' + COMPLEX_OF[s.gene]), f: V.f }));
      setTxt(I('ch2'), t(s.gene === 'ATP6' && !(s.nuclear && !s.cy) ? 'lbl4_ch2v' : 'lbl4_ch2', V));
      /* шкала Δψ */
      const ad = Math.abs(r.dpsi);
      $(I('gm')).setAttribute('transform', `translate(0 ${gy(ad).toFixed(1)})`); setTxt(I('gval'), mv(r.dpsi));
    }
    return { draw, markup: () => markup(K) };
  }

  /* ---------- показания ---------- */
  function tile(name, v, text, g, wide, cls){
    return `<div class="gr tile${wide ? ' wide' : ''}${cls ? ' ' + cls : ''}" data-g="${g}"><div class="tn">${name}</div><div class="tv">${text}</div>${v == null ? '' : `<div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i></div>`}</div>`;
  }
  function readsHTML(s, r, adv){
    const V = vals(s, r), a = args(s), def = r.cover < P4.DEF;
    let h = tile(t('r4_h'), s.nuclear ? 0 : a.h, s.nuclear ? '—' : V.h + ' %', 'hetero4');
    h += tile(t('r4_wt'), (1 - a.h) * s.N / 2, V.wt + ' %', 'copies4');
    h += tile(t('r4_cx'), Math.min(r.f.I, r.f.III, r.f.IV, r.f.V), t('r4_cx_v', V), 'cx4', true);
    h += tile(t('r4_cap'), r.cap, V.cap + ' %', 'cap4');
    if (adv) h += tile(t('r4_vs'), r.vs / P4.VS0, V.vs + ' %', 'atps');
    h += tile(t('r_o2'), r.ocr, V.o2, 'o2');
    h += tile(t('r4_dpsi'), Math.abs(r.dpsi) / GMAX, `${V.dpsi} ${t('mv')}`, 'dpsi4');
    h += tile(t('r3_atp'), r.cover, V.cov + ' %', 'antx', !adv);
    h += tile(t('r4_st'), null, t(def ? 'r4_def' : 'r4_ok'), 'thr4', false, def ? 'bad' : 'good');
    h += tile(t('r4_th'), null, s.nuclear ? '—' : (r.th == null ? '—' : '≈ ' + V.th + ' %'), 'thr4');
    return `<div class="tiles">${h}</div>`;
  }
  /* ---------- график порога: покрытие потребности в ATP при разной доле мутантной мтДНК ---------- */
  function plot(cv, s, r){
    if (!cv || !cv.clientWidth) return;
    const hs = []; for (let i = 0; i <= 50; i++) hs.push(i / 50);
    const ser = tis => hs.map(h => [h * 100, M.state4(Object.assign(args(s), { h, tissue: tis, nuclear: false })).cover * 100]);
    const capS = hs.map(h => [h * 100, M.state4(Object.assign(args(s), { h, nuclear: false })).cap * 100]);
    const other = ['low', 'norm', 'high'].filter(x => x !== s.tissue);
    const TC = { low: '--aa', norm: '--mtor', high: '--akt' };
    plotLines(cv, [
      { data: [[0, 90], [100, 90]], color: '--bad', dash: [6, 5], w: 1.4 },
      { data: capS, color: '--mal', dash: [2, 4], w: 2.2 },
      ...other.map(x => ({ data: ser(x), color: TC[x], dash: [7, 5], w: 1.8 })),
      { data: ser(s.tissue), color: TC[s.tissue], w: 3 },
    ], { xmax: 100, xstep: 20, xunit: t('tr4_x'), ymax: 105, yticks: [0, 50, 100], ydec: 0, cursor: s.nuclear ? null : args(s).h * 100 });
  }
  function legend(s){
    const TC = { low: '--aa', norm: '--mtor', high: '--akt' };
    return ['low', 'norm', 'high'].map(x => `<span><i class="sw line" style="background:var(${TC[x]})${x === s.tissue ? '' : ';opacity:.6'}"></i>${t('tr4_l_' + x)}</span>`).join('') +
      `<span><i class="sw line" style="background:var(--mal)"></i>${t('tr4_l_cap')}</span><span><i class="sw line" style="background:var(--bad)"></i>${t('tr4_l_def')}</span>`;
  }
  /* ---------- «бутылочное горлышко»: гистограмма долей мутантной мтДНК у потомков ---------- */
  function hist(cv, s, r, refNb){
    if (!cv || !cv.clientWidth) return null;
    const a = args(s), nb = P4.NB[s.nb], d = M.bottleneck4(a.h, nb), bins = Array(10).fill(0), rb = Array(10).fill(0);
    d.forEach(([x, p]) => { bins[Math.min(9, Math.floor(x * 10 + 1e-9))] += p; });
    if (refNb) M.bottleneck4(a.h, P4.NB[refNb]).forEach(([x, p]) => { rb[Math.min(9, Math.floor(x * 10 + 1e-9))] += p; });
    const th = r.th, above = th == null ? 0 : d.filter(([x]) => x >= th - 1e-9).reduce((u, [, p]) => u + p, 0);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, Hh = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pl = 34, pr = 10, pt = 10, pb = 36, w = W - pl - pr, hh = Hh - pt - pb, ymax = Math.max(0.5, Math.ceil(Math.max(...bins, ...rb) * 10) / 10);
    c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line');
    [0, ymax / 2, ymax].forEach(v => { const y = pt + (1 - v / ymax) * hh; c.beginPath(); c.moveTo(pl, y); c.lineTo(pl + w, y); c.stroke(); c.fillText(String(Math.round(v * 100)), 3, y + 4); });
    for (let i = 0; i < 10; i++){
      const x = pl + i * w / 10, bw = w / 10 - 4, y = pt + (1 - bins[i] / ymax) * hh;
      c.fillStyle = cssVar(th != null && (i + 1) / 10 > th ? '--bad' : '--mtor'); c.globalAlpha = .8; c.fillRect(x + 2, y, bw, pt + hh - y); c.globalAlpha = 1;
      c.fillStyle = cssVar('--muted'); c.textAlign = 'center'; c.fillText(String(i * 10), x, Hh - 21); c.textAlign = 'left';
    }
    if (refNb){ c.strokeStyle = cssVar('--ink'); c.lineWidth = 1.6; c.setLineDash([4, 3]);
      for (let i = 0; i < 10; i++){ if (rb[i] < 1e-4) continue; const x = pl + i * w / 10, bw = w / 10 - 4, y = pt + (1 - rb[i] / ymax) * hh; c.strokeRect(x + 2, y, bw, pt + hh - y); }
      c.setLineDash([]); }
    c.textAlign = 'center'; c.fillText('100', pl + w, Hh - 21); c.textAlign = 'right'; c.fillText(t('tr4_hx'), pl + w, Hh - 5); c.textAlign = 'left';
    if (th != null){ const x = pl + th * w; c.strokeStyle = cssVar('--bad'); c.setLineDash([6, 5]); c.lineWidth = 1.6; c.beginPath(); c.moveTo(x, pt); c.lineTo(x, pt + hh); c.stroke(); c.setLineDash([]); }
    const xm = pl + a.h * w; c.strokeStyle = cssVar('--ink'); c.lineWidth = 2; c.beginPath(); c.moveTo(xm, pt); c.lineTo(xm, pt + hh); c.stroke();
    return above;
  }
  return { M, P4, sim, args, vals, capParts, setCap4, scheme, readsHTML, plot, legend, hist, base, mutF, COMPLEX_OF };
})();

function q4Scene(K, adv){
  const Z = Q4;
  layout(K);
  const sch = Z.scheme(K);
  $('svg' + K).innerHTML = sch.markup();
  const P = 's4' + (adv ? 'a' : 'b') + '_';
  const sl = (id, k, min, max, step, val) => `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
  let c = sl(P + 'h', 's4_h', 0, 100, 5, 0) + segHTML(P + 't', 's4_t', [['low', 'ts4_low'], ['norm', 'ts4_norm'], ['high', 'ts4_high']], 'norm');
  if (adv) c = `<div class="cg">` + c + `<div class="span2">` + segHTML(P + 'g', 's4_g', [['ND', 'g4_ND'], ['CO', 'g4_CO'], ['ATP6', 'g4_ATP6'], ['TL1', 'g4_TL1']], 'CO') + `</div>` +
    sl(P + 'n', 's4_n', 25, 200, 25, 100) + segHTML(P + 'b', 's4_b', [['s', 'b4_s'], ['m', 'b4_m'], ['l', 'b4_l']], 'l') +
    `<div class="grp span2"><div class="drugs">` + toggleHTML(P + 'nuc', 'tg4_nuc', false) + toggleHTML(P + 'cy', 'tg4_cy', false) + `</div></div>`;
  c += REFROW(['repl', 'expr', 'coord', 'polg'], adv);
  c += `<div class="btns${adv ? ' span2' : ''}"><button class="btn ghost" id="${P}hm">${t('btn_measure')}</button><button class="btn ghost" id="${P}hs">${t('btn_model')}</button></div>` + (adv ? `</div>` : '');
  $('ctrl' + K).innerHTML = c;
  $('reads' + K).innerHTML = `<div id="${P}now" style="display:grid;gap:7px"></div><div id="${P}puz" style="display:grid;gap:7px" hidden></div>
    <div class="tracebox" id="${P}tb"><div class="label" style="margin:6px 0 0">${t('tr4_t')}</div><p class="plotcap" id="${P}tc">${t('tr4_c')}</p><canvas class="plot" id="${P}cv"></canvas><div class="trlegend" id="${P}tl"></div></div>` +
    (adv ? `<div class="tracebox" id="${P}hb"><div class="label" style="margin:6px 0 0">${t('tr4_ht')}</div><p class="plotcap" id="${P}hc"></p><canvas class="plot" id="${P}hv"></canvas></div>` : '');
  $('take' + K).textContent = t(adv ? 's4a_take' : 's4b_take');
  const st = () => {
    const s = Z.base(); s.h = +$(P + 'h').value / 100; s.tissue = segVal(P + 't');
    if (adv){ s.gene = segVal(P + 'g'); s.N = +$(P + 'n').value / 100; s.nb = segVal(P + 'b'); s.nuclear = $(P + 'nuc').checked; s.cy = $(P + 'cy').checked; }
    return s;
  };
  /* загадка (продвинутый уровень): две клетки одной ткани с той же мутацией и долей 70 %; различие — число копий */
  const PUZ = [{ k: 'X', s: { h: .7, N: 1 } }, { k: 'Y', s: { h: .7, N: .5 } }];
  const PUZ_STEP = 4;
  const puzOn = () => adv && POE.on && cur === K && POE.i === PUZ_STEP;
  let last = null;
  function update(){
    const s = st(), r = Z.sim(s); last = [s, r];
    $(P + 'hO').textContent = s.nuclear ? '—' : Math.round(s.h * 100) + ' %';
    $(P + 'h').disabled = !!s.nuclear;
    if (adv){ $(P + 'nO').textContent = Math.round(s.N * 100) + ' %'; }
    sch.draw(s, r);
    const pz = puzOn();
    $(P + 'now').hidden = pz; $(P + 'puz').hidden = !pz; $('ctrl' + K).hidden = pz;
    if (pz){
      const rows = PUZ.map(p => { const ss = Object.assign(Z.base(), p.s); return { k: p.k, s: ss, r: Z.sim(ss) }; });
      $(P + 'puz').innerHTML = rows.map(p => `<div class="read"><div><b>${t('puz4_row_t', { k: p.k })}</b><small>${t('puz4_row', { cov: Q1.pc(p.r.cover), cap: String(Math.round(p.r.cap * 100)), o: Q1.f2(p.r.ocr), d: Q1.mv(p.r.dpsi) })}${POE.shown ? ' ' + t('puz4_row_n', { n: String(Math.round(p.s.N * 100)) }) : ''}</small></div></div>`).join('') + (POE.shown ? '' : `<p class="small">${t('puz4_hide')}</p>`);
      setCap(K, POE.shown ? 'c4_puz_ans' : 'c4_puz', {});
    } else Z.setCap4(K, s, r);
    $(P + 'now').innerHTML = Z.readsHTML(s, r, adv);
    $(P + 'tb').style.opacity = s.nuclear ? .45 : 1;
    setTxt(P + 'tc', t(s.nuclear ? 'tr4_c_nuc' : 'tr4_c'));
    $(P + 'tl').innerHTML = Z.legend(s);
    Z.plot($(P + 'cv'), s, r);
    if (adv){
      /* шаг «бутылочное горлышко»: гистограмма стоит на месте схемы, рядом с вопросом (аудит v1.0, V03) */
      const hz = histOn(), hb = $(P + 'hb'), host = hz ? $('sc' + K).querySelector('.stage') : $('reads' + K);
      if (hb.parentNode !== host) host.appendChild(hb);
      $('sc' + K).classList.toggle('puz', hz);
      drawHist(s, r);
    }
  }
  const HIST_STEP = 5;
  const histOn = () => adv && POE.on && cur === K && POE.i === HIST_STEP;
  function drawHist(s, r){
    $(P + 'hb').style.opacity = s.nuclear ? .35 : 1;
    const ref = histOn() && POE.shown ? 'l' : null;              /* после ответа контуром — распределение при 200 копиях (условие шага) */
    const above = Z.hist($(P + 'hv'), s, r, ref);
    setTxt(P + 'hc', s.nuclear ? t('tr4_hc_nuc') : t('tr4_hc', { h: String(Math.round(s.h * 100)), nb: String(Z.P4.NB[s.nb]), a: above == null ? '—' : fmtShare(above), th: r.th == null ? '—' : String(Math.round(r.th * 100)) }) + (ref ? ' ' + t('tr4_hc_ref', { nb0: String(Z.P4.NB[ref]) }) : ''));
  }
  const fmtShare = p => { const v = p * 100; if (v < 0.05) return '0'; if (v < 1) return fmt(v, 1); return String(Math.round(v)); };
  const redraw = () => { if (last){ Z.plot($(P + 'cv'), last[0], last[1]); if (adv) drawHist(last[0], last[1]); } };
  $('reads' + K).addEventListener('click', e => { const g = e.target.closest('[data-g]'); if (g && g.dataset.g) showInfo(K, g.dataset.g); });
  $(P + 'hm').onclick = () => showInfo(K, 'measure4'); $(P + 'hs').onclick = () => showInfo(K, 'model4');
  wire(adv ? [P + 'h', P + 't', P + 'g', P + 'n', P + 'b', P + 'nuc', P + 'cy'] : [P + 'h', P + 't'], update);
  function set(o){
    const d = Object.assign(Z.base(), o);
    $(P + 'h').value = Math.round(d.h * 100); segSet(P + 't', d.tissue);
    if (adv){ segSet(P + 'g', d.gene); $(P + 'n').value = Math.round(d.N * 100); segSet(P + 'b', d.nb); $(P + 'nuc').checked = d.nuclear; $(P + 'cy').checked = d.cy; }
  }
  return { update, redraw, set };
}

/* ================= 4б: базовый уровень ================= */
(function(){
  const K = '4b', q = q4Scene(K, false), set = q.set;
  SCENES[K] = { update: q.update, redraw: q.redraw, poe: [
    { n: 3, ok: 0, pre(){ set({}); }, apply(){ set({ h: .6 }); } },                                  // Б1 0 → 60 %: дефекта не видно
    { n: 3, ok: 0, pre(){ set({ h: .6 }); }, apply(){ set({ h: .9 }); } },                            // Б2 60 → 90 %: резкое падение
    { n: 3, ok: 0, pre(){ set({ h: .75 }); }, apply(){ set({ h: .75, tissue: 'high' }); } },          // Б3 75 %: ткань с высокой потребностью
  ] };
})();

/* ================= 4п: продвинутый уровень ================= */
(function(){
  const K = '4a', q = q4Scene(K, true), set = q.set;
  SCENES[K] = { update: q.update, redraw: q.redraw, poe: [
    { n: 3, ok: 0, pre(){ set({ h: .75 }); }, apply(){ set({ h: .75, N: .5 }); } },                         // П1 копий вдвое меньше
    { n: 3, ok: 0, pre(){ set({ h: .85 }); }, apply(){ set({ h: .85, gene: 'TL1' }); } },                    // П2 та же доля, ген тРНК
    { n: 3, ok: 0, pre(){ set({ nuclear: true, tissue: 'low' }); }, apply(){ set({ nuclear: true, tissue: 'high' }); } },   // П3 ядерный ген: ткани
    { n: 3, ok: 0, pre(){ set({ nuclear: true }); }, apply(){ set({ nuclear: true, cy: true }); } },         // П4 цибрид при ядерной мутации
    { n: 3, ok: 0, pre(){ set({ h: .7 }); }, apply(){ set({ h: .7, N: .5 }); } },                            // П5 загадка: две клетки с 70 %
    { n: 3, ok: 0, pre(){ set({ h: .6, nb: 'l' }); }, apply(){ set({ h: .6, nb: 's' }); } },                 // П6 «бутылочное горлышко»
    { n: 3, ok: 0, pre(){ set({}); }, apply(){ set({ N: .25 }); } },                                          // П7 уровень дефекта: вариант POLG → мало копий мтДНК, мутантных нет (I9-06)
  ] };
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
initNav(); show();
