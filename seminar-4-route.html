ействует на уровне ERK."]}},"number":4,"question":1},{"id":"nf1-g12c","section":0,"questions":[1],"title":"Что меняют потеря NF1 и мутация KRAS G12C","keywords":["NF1","нейрофибромин","KRAS","G12C","соторасиб","GAP","нейрофиброматоз"],"lead":["Потеря нейрофибромина увеличивает время жизни RAS-GTP, но не создаёт нового сигнала.","KRAS G12C продолжает переходить между GTP- и GDP-формами, и именно на этом основано действие соторасиба."],"mechanism":["Нейрофибромин вводит в активный центр RAS каталитический аргинин (Arg1276) и ускоряет гидролиз GTP на несколько порядков.","[[T14|KRAS G12C]] почти не отвечает на GAP и медленно гидролизует GTP, поэтому значительная его часть находится в GTP-форме и без фактора роста.","[[T15|Соторасиб]] ковалентно связывает цистеин мутантного KRAS в GDP-форме и не даёт белку вернуться в GTP-форму."],"paragraphs":["Собственная ГТФазная активность RAS медленная. GAP-белки, в том числе нейрофибромин, ускоряют гидролиз GTP на несколько порядков: аргининовый остаток GAP входит в активный центр RAS и стабилизирует переходное состояние реакции.","При нейрофиброматозе 1 типа одна аллель NF1 мутантна во всех клетках, а в клетках опухоли (например, в шванновских клетках нейрофибромы) утрачена и вторая, и нейрофибромина нет совсем. Новый сигнал при этом не возникает: RAS по-прежнему активируется только через факторы обмена нуклеотидов (SOS и другие). Но RAS-GTP сохраняется дольше, и каскад, запущенный фактором роста, работает дольше и сильнее. Особенно показательна мутация R1276P: она избирательно выключала GAP-активность нейрофибромина, не нарушая его структуру и связывание с RAS (Klose 1998).","KRAS G12C смещает равновесие к GTP-форме: мутантный белок почти не отвечает на GAP. Но он не зафиксирован в активном состоянии — медленно гидролизует GTP и проходит через GDP-форму. В ней у белка открыт карман возле участка switch II, и соторасиб необратимо связывает цистеин 12 (Canon 2019). Молекулы захватываются по мере перехода в GDP-форму, поэтому RAS-GTP и pERK снижаются постепенно.","Два случая показывают две стороны завершения сигнала. При потере NF1 утрачен физиологический механизм выключения RAS, а при лечении опухолей с мутацией KRAS G12C соторасиб создаёт искусственный механизм выключения."],"trap":["Мутантный KRAS G12C постоянно связан с GTP, поэтому лекарство должно связывать его активную форму.","KRAS G12C продолжает гидролизовать GTP, хотя медленно. Соторасиб связывает его именно в GDP-форме и удерживает в неактивном состоянии."],"conditions":"Механизм GAP и мутация R1276P — Anastasaki и соавт. (2022), Klose и соавт. (1998); механизм соторасиба — Canon и соавт. (2019). Состояния на схеме — качественные, не данные опыта.","sources":["Anastasaki2022","Klose1998","Canon2019"],"quiz":{"id":"S4-L05","question":"Почему соторасиб снижает pERK в клетках с KRAS G12C постепенно, а не мгновенно?","options":[{"id":"S4-L05-1","text":"Он связывает только GDP-форму мутантного KRAS","correct":true,"feedback":"Молекулы KRAS G12C захватываются по мере того, как они гидролизуют GTP и переходят в GDP-форму; на это нужно время."},{"id":"S4-L05-2","text":"Он связывает GTP-форму, но медленно проникает в клетку","correct":false,"feedback":"Соторасиб связывает не GTP-, а GDP-форму: его карман возле switch II открыт только в неактивном состоянии."},{"id":"S4-L05-3","text":"Он действует через нейрофибромин, активируя GAP","correct":false,"feedback":"Соторасиб связывает сам мутантный KRAS; KRAS G12C к тому же почти нечувствителен к GAP."}]},"widget":{"kind":"net","title":"","s":{"title":"Цикл GTP/GDP белка RAS","status":"Схема механизма · качественные состояния","modes_label":"Клетки","modes":["Норма","Нет NF1","KRAS G12C","KRAS G12C + соторасиб"],"h":250,"w":640,"nodes":[{"id":"gdp","x":40,"y":100,"w":150,"label":"RAS-GDP"},{"id":"gtp","x":400,"y":100,"w":150,"label":"RAS-GTP"},{"id":"sos","x":230,"y":20,"w":130,"label":"SOS (GEF)"},{"id":"nf1","x":230,"y":190,"w":130,"label":"NF1 (GAP)"},{"id":"raf","x":550,"y":30,"w":80,"label":"RAF"}],"edges":[{"id":"ex","pts":[190,110,295,70,398,110],"type":"act"},{"id":"hy","pts":[400,136,295,180,192,136],"type":"act"},{"id":"sosE","pts":[295,60,295,82],"type":"act"},{"id":"gapE","pts":[295,190,295,166],"type":"act"},{"id":"rafE","pts":[520,100,560,72],"type":"act"}],"states":[{"on":["sos","gtp","nf1","raf"],"show":["ex","hy","sosE","gapE","rafE"],"note":"SOS переводит RAS в GTP-форму, NF1 и другие GAP ускоряют гидролиз GTP; время жизни RAS-GTP короткое."},{"on":["sos","gtp","raf"],"miss":["nf1"],"show":["ex","hy","sosE","rafE"],"metrics":[["Новый сигнал","нет"],["Время жизни RAS-GTP","больше"]],"note":"Без нейрофибромина гидролиз GTP замедлен: RAS-GTP после стимула сохраняется дольше. Без фактора роста сигнал остаётся слабым."},{"on":["gtp","raf"],"inh":["nf1"],"show":["ex","rafE"],"metrics":[["RAS-GTP без EGF","повышен"],["Цикл GTP/GDP","медленный, но сохранён"]],"note":"KRAS G12C почти нечувствителен к GAP и медленно гидролизует GTP: значительная часть белка в GTP-форме и без фактора роста."},{"on":["gdp"],"inh":["gtp","raf"],"show":[],"hide":["ex"],"drugs":[[60,170,"соторасиб"]],"metrics":[["RAS-GTP","снижается постепенно"],["Связывание","только GDP-форма"]],"note":"Соторасиб связывает KRAS G12C в GDP-форме: захваченные молекулы не возвращаются в GTP-форму, сигнал к RAF ослабевает."}]}},"number":5,"question":1},{"id":"measure-cascade","section":0,"questions":[1],"title":"Как измеряют активность каскада и что показывает блот","keywords":["вестерн-блот","pERK","ингибитор","репортёр","фосфорилирование","активность"],"lead":["Чтобы увидеть усиление и завершение сигнала, активность каскада измеряют во многих точках времени и при разных дозах.","Каждый метод измеряет свою величину, и её нельзя подменять другой."],"mechanism":["[[T61|Вестерн-блот]] с антителами к фосфорилированной форме позволяет сравнивать относительное содержание [[T18|pERK]] в лизате многих клеток после нормировки на общую ERK; проценты на экранах — рассчитанные доли учебной модели.","Ингибиторы MEK и RAF и генетические воздействия (siRNA, мутации) показывают, какие события зависят от данного звена.","Репортёры в живых клетках, например [[T62|FRET-сенсор]], показывают динамику активности ERK в отдельной клетке."],"paragraphs":["Основной метод — вестерн-блот: клетки лизируют через 0, 2, 5, 15, 30 и 60 мин после стимула и окрашивают антителами к pERK (T202/Y204), pMEK и общей ERK. Серия точек показывает нарастание и затухание сигнала, а серия доз — форму кривой «доза — ответ».","Фосфорилирование не то же самое, что активность. Антитело выявляет фосфорилированные сайты, а каталитическую активность фермента проверяют по фосфорилированию его субстратов. Например, для AKT при действии ATP-конкурентных ингибиторов сайты активации даже гиперфосфорилированы (Okuzumi 2009), хотя каталитическая активность фермента подавлена.","Сигнал на блоте усреднён по миллионам клеток. Гладкая кривая в лизате может складываться из коротких импульсов в отдельных клетках, сдвинутых по фазе. Для одноклеточной динамики используют репортёры: FRET-сенсор EKAR-EV и флуоресцентно меченную ERK, которая при активации переходит в ядро (раздел 2).","Опыты с ингибиторами и генетическими воздействиями отвечают на вопрос, зависит ли событие от данного звена. Ингибитор MEK, подавляющий событие, показывает его зависимость от MEK, но не доказывает её: при высокой дозе возможны побочные эффекты. Вывод становится надёжнее, если его подтверждает второй, независимый способ — другой ингибитор, siRNA или мутант."],"trap":["Если на блоте вырос сигнал pERK, значит, в каждой клетке ERK стала активнее.","Блот показывает среднее фосфорилирование по популяции в момент фиксации. Оно не говорит ни о каталитической активности, ни о поведении отдельных клеток."],"conditions":"Методы и их ограничения — по главе 4 пособия, обзорам Lavoie и соавт. (2020) и Madsen и Toker (2023); устройство сенсора EKAR-EV — Komatsu и соавт. (2011), ERK, переходящая в ядро, — Toettcher и соавт. (2013). Полосы на схеме условные, это не результат опыта.","sources":["Lavoie2020","MadsenToker2023","Okuzumi2009","Albeck2013","Komatsu2011","Toettcher2013"],"quiz":{"id":"S4-L06","question":"Ингибитор MEK подавил экспрессию гена-мишени ERK. Какой вывод корректен?","options":[{"id":"S4-L06-1","text":"Доказано, что экспрессия гена зависит только от ERK","correct":false,"feedback":"Один ингибитор показывает зависимость, но не доказывает её: возможны побочные эффекты; нужны независимые подтверждения."},{"id":"S4-L06-2","text":"Экспрессия зависит от MEK; вывод требует проверки другим способом","correct":true,"feedback":"Результат согласуется с ролью MEK–ERK. Независимый способ — другой ингибитор, siRNA или мутант — делает вывод надёжнее."},{"id":"S4-L06-3","text":"ERK в этих клетках неактивна и без ингибитора","correct":false,"feedback":"Опыт с ингибитором ничего не говорит о состоянии ERK без него; это проверяют отдельным измерением pERK."}]},"widget":{"kind":"method","title":"","s":{"title":"Как измеряют активность ERK","status":"Схемы методов · не экспериментальные данные","modes_label":"Метод","modes":["Вестерн-блот","Репортёры в живых клетках","Что измеряет каждый метод"],"schemes":[{"draw":"blot","h":300,"data":[0.02,1,0.55,0.12],"l":{"pA":"А","a":"Клетки фиксируют в разные моменты после EGF","t":["0 мин","5 мин","15 мин","60 мин"],"lysate":"лизат","gel":"электрофорез,\nперенос\nна мембрану","pB":"Б","b":"Мембрану окрашивают антителами","row1":"p-ERK (T202/Y204)","row2":"общая ERK — контроль"},"note":"А — в каждый момент времени лизируют отдельную чашку клеток. Б — антитела к фосфорилированной форме выявляют pERK, антитела к общей ERK показывают, что количество белка во всех дорожках одинаково. Полоса — среднее по миллионам клеток в момент фиксации. Блот позволяет сравнивать относительное содержание pERK при нормировке на общую ERK и в линейном диапазоне сигнала; абсолютная доля pERK без калибровки из него не получается."},{"draw":"reporter","h":300,"l":{"pA":"А","a":"FRET-сенсор EKAR-EV","off":"ERK неактивна","on":"ERK фосфорилировала сенсор","read":"сигнал — отношение жёлтого\nсвечения к голубому","pB":"Б","b":"Флуоресцентная ERK","off2":"в цитоплазме","on2":"в ядре"},"note":"А — ERK фосфорилирует субстратный участок сенсора; его связывает фосфосвязывающий домен того же сенсора, флуоресцентные белки сближаются, и перенос энергии (FRET) усиливает жёлтое свечение. Б — флуоресцентно меченная ERK при активации переходит в ядро. Оба репортёра показывают динамику в одной живой клетке."},{"draw":"table","head":["Метод","Что показывает","Чего не показывает"],"rows":[["вестерн-блот, серия точек","ход фосфорилирования во времени","поведение отдельных клеток"],["вестерн-блот, серия доз","форму кривой «доза — ответ»","каталитическую активность"],["репортёр в живой клетке","импульсы и их частоту в одной клетке","абсолютное количество p-ERK"],["ингибитор, siRNA, мутант","зависимость события от звена","причинность, если способ один"]],"note":"Каждый метод измеряет свою величину. Для крутизны нужна вся кривая доз, для завершения — серия точек времени, для импульсов — отдельные клетки."}]}},"number":6,"question":1},{"id":"profile","section":1,"questions":[2],"title":"Чем описывается временной профиль сигнала","keywords":["профиль","амплитуда","длительность","частота","площадь под кривой","интегральная доза"],"lead":["Активность ERK во времени описывают четыре различимых свойства: амплитуда, длительность, число импульсов и площадь под кривой.","Они не обязательно независимы: изменение дозы стимула часто меняет сразу несколько из них."],"mechanism":["Амплитуда — наибольшее значение активности; длительность — время, пока активность выше заданного порога (например, половины пика).","Число и частота импульсов описывают повторяющиеся подъёмы; [[T20|площадь под кривой]] — интеграл активности по времени (интегральная доза).","Нижележащие процессы с разной кинетикой «считывают» разные свойства [[T19|временного профиля]]."],"paragraphs":["Сигнал описывается не двумя состояниями «включено — выключено», а кривой изменения активности во времени. Короткий высокий пик и долгое низкое плато могут иметь одинаковую площадь, но действовать на клетку по-разному. Чтобы сравнивать профили, их описывают несколькими числами.","Амплитуда показывает, насколько сильно активирована киназа в момент максимума. Длительность — сколько времени активность остаётся выше порога; порог нужно указывать, иначе число теряет смысл. Площадь под кривой — интегральная доза — показывает суммарное количество сигнала. Если активность изменяется импульсами, важны их число, частота и интервалы между ними.","Нижележащие белки различаются скоростями. Состояние быстро активируемых и быстро инактивируемых мишеней изменяется вслед за текущей активностью ERK. Мишени, которые накапливаются медленно, например стабильные белки или продукты транскрипции, суммируют сигнал во времени. А механизмы с порогом по непрерывной длительности отвечают только на достаточно долгий сигнал.","Свойства профиля не являются независимыми информационными каналами: более высокая доза стимула обычно повышает и амплитуду, и длительность, и площадь. Поэтому вывод о роли одного свойства требует опыта, в котором остальные удерживаются постоянными."],"trap":["Если суммарная активность ERK одинакова, то и ответ клетки одинаков.","Одинаковая площадь под кривой может складываться из разных профилей. Механизмы, требующие непрерывного сигнала, по-разному отвечают на один длинный сигнал и на несколько коротких той же суммарной дозы."],"conditions":"Определения — по обзору Purvis и Lahav (2013) и главе 4 пособия. Профили схемы — условные, построены для иллюстрации; площадь выражена в условных единицах.","sources":["Purvis2013"],"quiz":{"id":"S4-L07","question":"Два профиля ERK имеют одинаковую площадь под кривой: короткий высокий пик и долгое низкое плато. Чем они различаются?","options":[{"id":"S4-L07-1","text":"Ничем: интегральная доза полностью описывает сигнал","correct":false,"feedback":"Площадь — лишь одно из четырёх свойств профиля. Амплитуда и длительность у этих профилей разные."},{"id":"S4-L07-2","text":"Амплитудой и длительностью при равной интегральной дозе","correct":true,"feedback":"Пик выше, но короче; плато ниже, но дольше. Механизмы с порогом по длительности ответят только на плато."},{"id":"S4-L07-3","text":"Только числом импульсов","correct":false,"feedback":"В обоих случаях импульс один. Профили различаются высотой и продолжительностью."}]},"widget":{"kind":"profile","title":"","s":{"title":"Профиль активности ERK","status":"Условные профили · не данные опыта","modes_label":"Профиль","modes":["Короткий высокий пик","Длинное низкое плато","Три импульса","Длинное высокое плато"],"profiles":[{"amp":90,"on":[[2,18]]},{"amp":30,"on":[[2,50]]},{"amp":80,"on":[[2,6],[40,44],[80,84]]},{"amp":80,"on":[[2,100]]}],"ref":0,"x":"время, мин","y":"активность ERK, %","m_amp":"амплитуда","m_dur":"выше половины пика","m_n":"число импульсов","m_area":"площадь","u_min":"мин","u_area":"усл. ед.","notes":["Высокий короткий пик: большая амплитуда, малая длительность.","Низкое плато той же площади, что пик: амплитуда втрое меньше, длительность втрое больше.","Три коротких импульса: каждый короткий, а суммарная площадь близка к одиночному пику.","Длинное высокое плато: велики и амплитуда, и длительность, и площадь."]}},"number":7,"question":2},{"id":"pc12","section":1,"questions":[2],"title":"Что показывает опыт с EGF и NGF на клетках PC12","keywords":["PC12","EGF","NGF","TrkA","пролиферация","дифференцировка","Marshall","Traverse"],"lead":["В клетках PC12 EGF вызывает кратковременную активацию ERK и деление, а NGF — устойчивую активацию и нейрональную дифференцировку.","Этот классический результат показывает связь профиля ERK с исходом, но не позволяет выделить причину."],"mechanism":["EGF через рецептор EGFR активирует ERK на минуты: активность максимальна через несколько минут и затем возвращается к исходному уровню.","NGF через рецептор TrkA активирует ERK на часы, ERK накапливается в ядре.","Рецепторы EGFR и TrkA различаются не только профилем ERK, но и другими ветвями сигнала."],"paragraphs":["[[T21|PC12]] — линия клеток феохромоцитомы крысы. Под действием одних факторов они делятся, под действием других образуют отростки, похожие на нейриты. Это удобная модель выбора клеточного ответа.","Traverse и соавт. (1992) измерили активность MEK и ERK после [[T22|EGF и NGF]]. И EGF, и NGF повышали активность MEK более чем в 20 раз, но после EGF она была максимальна через 2 мин и возвращалась к исходному уровню за 60–90 мин, а после NGF оставалась высокой не менее 90 мин; ERK переходила в ядро, тогда как после EGF к 30 мин этого не происходило. EGF стимулировал деление клеток, NGF — нейрональную дифференцировку.","Marshall (1995) обобщил эти данные: длительность активации ERK может определять выбор ответа. Но сравнение EGF и NGF не позволяет выделить роль длительности. EGFR и TrkA — разные рецепторы, и они по-разному активируют PI3K, PLCγ и другие ветви. Разный исход может зависеть и от них.","Поэтому опыт с двумя факторами показывает корреляцию. Чтобы проверить причинную роль длительности, нужно изменить профиль ERK при прочих равных — это следующий шаг."],"trap":["Опыт с EGF и NGF доказал, что исход определяет только длительность активности ERK.","Опыт показал связь профиля ERK с исходом. EGFR и TrkA различаются и другими ветвями сигнала, поэтому причинность требует опытов, где меняется только профиль."],"conditions":"Данные — клетки PC12 крысы, EGF и NGF, активность MEK и MAP-киназ (Traverse 1992, аннотация; обзор Marshall 1995). Кривые схемы — учебная модель практикума (вопрос 2б), относительные величины.","sources":["Traverse1992","Marshall1995"],"quiz":{"id":"S4-L08","question":"В клетках PC12 EGF даёт короткий сигнал ERK и деление, NGF — длительный сигнал и дифференцировку. Какой вывод обоснован строже всего?","options":[{"id":"S4-L08-1","text":"Длительность активации ERK — единственная причина разных исходов","correct":false,"feedback":"Рецепторы EGFR и TrkA различаются и другими ветвями сигнала; одно сравнение не позволяет выделить роль длительности."},{"id":"S4-L08-2","text":"ERK не участвует в выборе исхода","correct":false,"feedback":"Опыт показывает обратное: профиль ERK различается вместе с исходом."},{"id":"S4-L08-3","text":"Профиль ERK связан с исходом, причина не выделена","correct":true,"feedback":"Наблюдение — корреляция. Для причинного вывода нужно менять только длительность сигнала."}]},"widget":{"kind":"course","title":"","s":{"title":"pERK в клетках PC12","status":"Учебная модель по данным Traverse 1992; относительные величины","modes_label":"Фактор роста","modes":["EGF","NGF"],"runs":[{"cfg":{"mode":"egf"},"input":"egf"},{"cfg":{"mode":"ngf"},"input":"egf"}],"keys":["E"],"key_labels":["pERK"],"ref":0,"ref_label":"EGF","x":"время после добавления фактора, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY. Расчёт модели; кривая не нормирована на собственный максимум.","u_min":"мин","points":[{"label":"pERK через 5 мин","key":"E","t":5},{"label":"pERK через 60 мин","key":"E","t":60},{"label":"pERK выше половины пика","key":"E","kind":"above","thr":0.33}],"notes":["EGF: пик через несколько минут, к часу pERK в несколько раз ниже пика. Клетки PC12 продолжают делиться.","NGF: pERK остаётся высоким и через 1–2 ч. Через несколько суток клетки образуют отростки."]}},"number":8,"question":2},{"id":"causality","section":1,"questions":[2],"title":"Как проверяют, что исход определяет именно длительность сигнала","keywords":["причинность","EGFR","избыток рецептора","Traverse 1994","Santos","обратные связи","топология"],"lead":["Причинную роль длительности проверяют, меняя профиль ERK при том же рецепторе и лиганде.","Избыток EGFR превращает короткий ответ на EGF в длительный — и клетки PC12 дифференцируются."],"mechanism":["Если рецепторов EGF во много раз больше, уменьшение их числа на поверхности и обратные связи не успевают ослабить сигнал от рецепторов, и ERK остаётся активной долго.","С тем же EGF клетки PC12 с избытком EGFR образуют отростки, как при NGF.","Профиль ERK определяется сетью обратных связей: при EGF преобладает отрицательная обратная связь, при NGF добавляется положительная (через PKC)."],"paragraphs":["Traverse и соавт. (1994) получили клетки PC12, в которых рецептора EGF было намного больше обычного. В таких клетках EGF вызывал длительную активацию MAP-киназ и их переход в ядро, а затем нейрональную дифференцировку, как NGF в обычных клетках. Сходный результат дал избыток рецептора инсулина: инсулин вызывал длительную активацию и рост отростков (Dikic 1994).","Этот опыт сильнее сравнения двух факторов: лиганд и тип рецептора те же, изменился профиль ERK, и изменился исход. Остаётся оговорка: избыток рецептора усиливает и другие ветви сигнала, поэтому решающие опыты — те, где вход задают напрямую (следующие шаги).","Чем обусловлено различие профилей? Santos и соавт. (2007) определили знаки обратных связей в модуле RAF–MEK–ERK клеток PC12: при EGF в модуле действовала только отрицательная обратная связь, а при NGF добавлялась положительная, зависящая от PKC. Модель, учитывающая это различие, воспроизводила короткий и длительный профили. Рецептор задаёт вход, а форму профиля создаёт сеть обратных связей.","Значит, для причинного вывода нужен опыт, где меняется одна переменная, а остальные контролируются."],"trap":["Длительный сигнал ERK — особое свойство рецептора NGF.","Тот же EGF даёт длительный сигнал при избытке EGFR. Профиль задаёт не рецептор сам по себе, а соотношение входа и обратных связей."],"conditions":"Клетки PC12 с избытком EGFR (Traverse 1994) и рецептора инсулина (Dikic 1994) — аннотации. Топология обратных связей — Santos и соавт. (2007, аннотация и последующие работы); киназа положительной связи названа PKC без уточнения изоформы. Графики — учебная модель практикума (вопрос 2б).","sources":["Traverse1994","Dikic1994","Santos2007"],"quiz":{"id":"S4-L09","question":"В клетках PC12 с избытком EGFR тот же EGF вызвал длительную активацию ERK и дифференцировку. Что добавляет этот опыт к сравнению EGF и NGF?","options":[{"id":"S4-L09-1","text":"Исход изменился вместе с профилем ERK при том же лиганде","correct":true,"feedback":"Лиганд и тип рецептора те же, а изменился профиль ERK — это довод в пользу причинной роли длительности сигнала."},{"id":"S4-L09-2","text":"Доказывает, что другие ветви сигнала не участвуют","correct":false,"feedback":"Избыток рецептора усиливает и другие ветви. Опыт сильнее сравнения факторов, но не исключает их вклад."},{"id":"S4-L09-3","text":"Показывает, что NGF действует через EGFR","correct":false,"feedback":"NGF действует через TrkA. Опыт показывает, что длительный сигнал можно получить и через EGFR."}]},"widget":{"kind":"course","title":"","s":{"title":"pERK при разных рецепторах и их количестве","status":"Учебная модель по данным Traverse 1992, 1994; относительные величины","modes_label":"Клетки и фактор","modes":["PC12 + EGF","PC12 с избытком EGFR + EGF","PC12 + NGF"],"runs":[{"cfg":{"mode":"egf"},"input":"egf"},{"cfg":{"mode":"egf","rtot":8},"input":"egf"},{"cfg":{"mode":"ngf"},"input":"egf"}],"keys":["E"],"key_labels":["pERK"],"ref":0,"ref_label":"PC12 + EGF","x":"время после добавления фактора, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY. Расчёт модели; кривая не нормирована на собственный максимум.","u_min":"мин","points":[{"label":"pERK через 60 мин","key":"E","t":60},{"label":"pERK выше половины пика","key":"E","kind":"above","thr":0.33}],"notes":["Обычные PC12 и EGF: короткий сигнал, деление.","Избыток EGFR: тот же EGF даёт длительный сигнал, клетки дифференцируются.","NGF через TrkA: длительный сигнал, дифференцировка."]}},"number":9,"question":2},{"id":"cfos","section":1,"questions":[2],"title":"Как c-Fos «считывает» длительность сигнала ERK","keywords":["c-Fos","DEF","RSK","стабилизация","гены немедленного ответа","Murphy","AP-1"],"lead":["c-Fos — белок, который накапливается только тогда, когда ERK ещё активна в момент его синтеза.","Длительность сигнала считывается в два этапа: стабилизация белка и его дополнительное фосфорилирование через DEF-мотив."],"mechanism":["ERK запускает транскрипцию [[T23|гена немедленного ответа]] c-fos; белок [[T24|c-Fos]] появляется через десятки минут и без модификаций быстро разрушается.","Если ERK в это время активна, она и RSK фосфорилируют С-конец c-Fos (S374, S362), и белок стабилизируется.","Затем открывается [[T25|DEF-мотив]]: ERK связывается с ним и фосфорилирует T325 и T331; без этого этапа сигнальная функция c-Fos нарушена."],"paragraphs":["Murphy и соавт. (2002) изучали, почему в фибробластах Swiss 3T3 короткий и длительный сигналы ERK приводят к разному результату. Оказалось, что решающее значение имеет время: мРНК c-fos синтезируется сразу после стимула, а белок c-Fos появляется позже. При коротком сигнале ERK к этому моменту уже неактивна, и новый c-Fos быстро разрушается.","При длительном сигнале ERK ещё активна, когда появляется белок. ERK фосфорилирует S374, а RSK — S362 в С-концевой области (нумерация c-Fos человека). Это фосфорилирование стабилизирует белок и открывает DEF-мотив (FXFP) — участок связывания ERK, после чего ERK фосфорилирует T325 и T331. Стабильный c-Fos накапливается и вместе с c-Jun образует фактор AP-1.","Замены в DEF-мотиве нарушают второй этап: начальное фосфорилирование S374 от DEF-мотива не зависит, а T325 и T331 ERK без него почти не фосфорилирует, и c-Fos-зависимая передача сигнала нарушается, хотя сигнал ERK длительный (Murphy 2002). Значит, способность различать длительность сигнала определяется свойствами самого белка-мишени. В учебной модели количество стабильного белка при замене DEF-мотива принято неизменным, а с формой pT325/pT331 связана активность AP-1 — это допущение модели.","Механизм показан для c-Fos в фибробластах. Переносить его на другие белки немедленного ответа можно только после проверки, есть ли у них сходный мотив связывания ERK и сходная кинетика."],"trap":["Чем дольше активна ERK, тем больше мРНК c-fos, и поэтому c-Fos накапливается.","мРНК c-fos образуется и при коротком сигнале. Накопление белка определяется фосфорилированием новосинтезированного c-Fos активной ERK, которое его стабилизирует."],"conditions":"Фибробласты Swiss 3T3 (Murphy 2002; аннотация, подписи к рисункам и, по данным внешнего аудита, результаты к рис. 3–7: DEF-мотив не нужен для фосфорилирования S374; сайты S374/S362 — по Reactome). Период полужизни c-Fos из этой работы в модель не перенесён. Кривые схемы — учебная модель практикума (вопрос 2п): свет включает RAS, c-Fos — условные величины, % от программы «120 мин подряд».","sources":["Murphy2002","Lavoie2020"],"quiz":{"id":"S4-L10","rev":2,"question":"В c-Fos заменены остатки DEF-мотива, а сигнал ERK длительный. Как изменится фосфорилирование c-Fos по T325 и T331?","options":[{"id":"S4-L10-1","text":"Не изменится: ERK активна долго","correct":false,"feedback":"Активность ERK одинакова, но для фосфорилирования T325 и T331 ERK должна связаться с DEF-мотивом; без него этот этап почти не идёт."},{"id":"S4-L10-2","text":"Будет намного слабее, хотя стабилизирующее фосфорилирование S374 сохранится","correct":true,"feedback":"Начальное фосфорилирование С-конца от DEF-мотива не зависит, а T325 и T331 ERK фосфорилирует, связавшись с DEF-мотивом (Murphy 2002)."},{"id":"S4-L10-3","text":"Будет сильнее: мутантный мотив прочнее связывает ERK","correct":false,"feedback":"Замена остатков FXFP разрушает участок связывания ERK, а не усиливает его."}]},"widget":{"kind":"course","title":"","s":{"title":"pERK в ядре и два этапа считывания c-Fos","status":"Учебная модель; свет включает RAS; относительные величины","modes_label":"Опыт","modes":["свет 10 мин","свет 120 мин подряд","120 мин, c-Fos без DEF-мотива","120 мин, ингибитор MEK"],"runs":[{"cfg":{"mode":"opto"},"input":"light:[[0,10]]","tmax":240},{"cfg":{"mode":"opto"},"input":"light:[[0,120]]","tmax":240},{"cfg":{"mode":"opto","def":false},"input":"light:[[0,120]]","tmax":240},{"cfg":{"mode":"opto","trame":true},"input":"light:[[0,120]]","tmax":240}],"keys":["En","Ps","Pf"],"key_labels":["pERK в ядре","c-Fos стабилизированный (S362, S374)","c-Fos pT325/pT331"],"norm":[1,0.448,0.22],"x":"время от начала освещения, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK в ядре — доля фосфорилированной ERK в ядре; c-Fos стабилизированный и c-Fos pT325/pT331 — % от наибольшего значения каждой формы при программе «120 мин подряд». Расчёт модели; кривые не нормированы каждая на свой максимум.","u_min":"мин","points":[{"label":"c-Fos стабилизированный, максимум","key":"Ps","kind":"max","norm":0.448},{"label":"c-Fos pT325/pT331, максимум","key":"Pf","kind":"max","norm":0.22}],"notes":["Короткий сигнал: к моменту появления белка ERK неактивна, c-Fos разрушается.","Длительный сигнал: новый c-Fos стабилизируется, накапливается и затем фосфорилируется по T325 и T331.","ERK активна долго, c-Fos стабилизируется (в модели — как в норме), но без DEF-мотива почти не фосфорилируется по T325 и T331.","Ингибитор MEK: ERK почти не фосфорилирована, c-Fos не стабилизируется."]}},"number":10,"question":2},{"id":"optogenetics","section":1,"questions":[2],"title":"Как оптогенетика разделяет длительность и интегральную дозу","keywords":["оптогенетика","свет","SOS","PhyB","PIF","Toettcher","STAT3","интегральная доза","фильтр"],"lead":["Свет позволяет включать RAS напрямую, минуя рецепторы, и менять только временной профиль входа.","Так показали, что некоторые ответы требуют непрерывного сигнала дольше часа и не возникают при прерывистом сигнале с той же интегральной дозой."],"mechanism":["Красный свет переносит каталитический домен SOS к мембране, где он активирует RAS; дальний красный свет возвращает его в цитоплазму ([[T26|оптогенетический вход]]).","Каскад передаёт входные сигналы длительностью от 4 мин до 2 ч и сглаживает более короткие.","[[T27|Паракринная программа]] — фосфорилирование STAT3 в соседних клетках — включается только после непрерывной активации RAS дольше часа."],"paragraphs":["Toettcher и соавт. (2013) соединили каталитический домен SOS с белком PIF, а на мембране закрепили фоторецептор PhyB. Красный свет вызывает их связывание, и SOS активирует RAS; дальний красный свет вызывает диссоциацию этого комплекса, и SOS возвращается в цитоплазму. Так в фибробластах NIH3T3 можно задавать вход любой длительности, не меняя рецептор и лиганд.","Каскад вёл себя как фильтр: входные сигналы длительностью от 4 мин до 2 ч и более передавались к ERK в ядре, а более короткие сглаживались. Сигнал от RAS до ядерной ERK проходил примерно за 3 мин.","Затем сравнили профили при одинаковой суммарной дозе. Фосфорилирование STAT3 в соседних клетках, вызванное секретируемым фактором, появлялось только после непрерывной активации RAS дольше часа. Два импульса по 1 ч с паузой 1 ч при той же суммарной дозе такого ответа не давали. Механизм с порогом по непрерывной длительности отвечает на эти протоколы по-разному, хотя интеграл одинаков.","Контроль интегральной дозы обязателен: если два протокола различаются и длительностью, и дозой, разные исходы допускают три объяснения. В модели практикума видно и другое: c-Fos стабилизируется в каждом импульсе длительностью 1 ч, а паракринная программа — нет. Разные механизмы считывают длительность с разными порогами."],"trap":["Если суммарная доза активации RAS одинакова, клетка ответит одинаково.","При равной интегральной дозе непрерывный сигнал дольше часа включает паракринную программу, а два импульса по 1 ч с паузой — нет."],"conditions":"Фибробласты NIH3T3, оптогенетическая система PhyB–PIF–SOScat (Toettcher 2013, полный текст): задержка ≈3 мин, передача входов от 4 мин до ≥2 ч, STAT3 после >1 ч непрерывной активации, сравнение 2 ч подряд и 2 × 1 ч с паузой 1 ч. Кривые — учебная модель практикума (вопрос 2п); порог паракринной программы в модели — 75 мин непрерывной активности.","sources":["Toettcher2013","Purvis2013"],"quiz":{"id":"S4-L11","question":"Свет подают двумя импульсами по 60 мин с паузой 60 мин; интеграл активности ERK такой же, как при 120 мин подряд. Будет ли фосфорилирован STAT3 в соседних клетках?","options":[{"id":"S4-L11-1","text":"Да: важна только суммарная доза","correct":false,"feedback":"Паракринная программа требует непрерывной активации дольше часа; за время паузы её активация прерывается."},{"id":"S4-L11-2","text":"Да, но слабее, пропорционально дозе","correct":false,"feedback":"Доза одинакова, а ответа нет: решающей оказывается непрерывная длительность, а не интеграл."},{"id":"S4-L11-3","text":"Нет: нужна непрерывная активация дольше часа","correct":true,"feedback":"В опытах Toettcher (2013) два импульса по 1 ч с паузой не вызывали фосфорилирования STAT3, а 2 ч подряд — вызывали."}]},"widget":{"kind":"course","title":"","s":{"title":"Свет на RAS: pERK в ядре и pSTAT3 соседних клеток","status":"Учебная модель по данным Toettcher 2013; относительные величины","modes_label":"Программа света","modes":["2 мин","10 мин","120 мин подряд","2 × 60 мин, пауза 60 мин"],"runs":[{"cfg":{"mode":"opto"},"input":"light:[[0,2]]","tmax":240},{"cfg":{"mode":"opto"},"input":"light:[[0,10]]","tmax":240},{"cfg":{"mode":"opto"},"input":"light:[[0,120]]","tmax":240},{"cfg":{"mode":"opto"},"input":"light:[[0,60],[120,180]]","tmax":240}],"keys":["En","S3"],"key_labels":["pERK в ядре","pSTAT3 соседних клеток"],"x":"время от начала освещения, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK в ядре — доля фосфорилированной ERK в ядре; pSTAT3 — доля фосфорилированного STAT3 в соседних клетках (условная шкала модели). Расчёт модели; кривые не нормированы каждая на свой максимум.","u_min":"мин","points":[{"label":"интеграл pERK, % от 120 мин подряд","key":"En","kind":"area","of":2},{"label":"непрерывно выше порога","key":"En","kind":"above","thr":0.25},{"label":"pSTAT3, максимум","key":"S3","kind":"max"}],"notes":["2 мин: импульс короче задержки каскада, pERK в ядре почти вдвое ниже.","10 мин: импульс передаётся, но сигнал короткий; STAT3 не фосфорилируется.","2 ч подряд: непрерывная активность дольше часа — паракринная программа включается.","Два импульса по 1 ч: интеграл тот же, но непрерывная активность короче часа — STAT3 не фосфорилируется."]}},"number":11,"question":2},{"id":"single-cell","section":1,"questions":[2],"title":"Чем среднее по популяции отличается от сигнала одной клетки","keywords":["одна клетка","популяция","импульсы","EKAR","Albeck","MCF-10A","вестерн-блот"],"lead":["Гладкая кривая pERK в лизате может складываться из коротких импульсов в отдельных клетках, сдвинутых по фазе.","Различить эти варианты можно только наблюдая отдельные живые клетки во времени."],"mechanism":["[[T29|Репортёр активности ERK]] (например, FRET-сенсор EKAR) показывает динамику в каждой клетке.","В клетках MCF-10A при постоянном EGF ERK активируется дискретными импульсами, не синхронными между клетками.","Частота импульсов растёт с концентрацией EGF; доля делящихся клеток связана с интегралом активности ERK."],"paragraphs":["Вестерн-блот и другие [[T28|популяционные измерения]] усредняют сигнал миллионов клеток. Если клетки отвечают импульсами в разные моменты, среднее даёт плавную кривую, которой нет ни в одной клетке. Поэтому по популяционной кривой нельзя судить, гладкий ли сигнал в каждой клетке или импульсный.","Albeck и соавт. (2013) наблюдали активность ERK в отдельных клетках эпителия молочной железы MCF-10A с помощью сенсора EKAR-EV. При постоянном EGF ERK активировалась импульсами примерно по 20–30 мин, разделёнными паузами; при низкой концентрации EGF паузы длились часами. С ростом концентрации EGF импульсы становились чаще и длиннее.","Доля клеток, вступающих в S-фазу, была связана с интегралом активности ERK во времени. Ингибитор рецептора снижал частоту импульсов, а ингибитор MEK — их амплитуду; деление прекращалось, лишь когда выход пути ERK (по уровню белка Fra-1) падал ниже примерно 10 % исходного; подавление выхода на 85 % снижало пролиферацию меньше чем вдвое.","Отсюда практическое правило: прежде чем делать вывод о «длительном» или «коротком» сигнале, нужно знать, к какому уровню относится измерение — к популяции или к клетке."],"trap":["Плавная кривая pERK на блоте означает плавный сигнал в каждой клетке.","Плавное среднее совместимо и с плавной динамикой каждой клетки, и с асинхронными импульсами. Различить их можно только наблюдением отдельных клеток."],"conditions":"Клетки MCF-10A, сенсор EKAR-EV, постоянный EGF (Albeck 2013, полный текст). Кривые схемы — учебная модель асинхронных импульсов (40 условных клеток), не данные опыта.","sources":["Albeck2013","Purvis2013"],"quiz":{"id":"S4-L12","question":"pERK в лизате клеток плавно растёт и остаётся на постоянном промежуточном уровне. Какое измерение покажет, что происходит в отдельных клетках?","options":[{"id":"S4-L12-1","text":"Вестерн-блот с большим числом точек времени","correct":false,"feedback":"Больше точек уточнит среднюю кривую, но она по-прежнему отражает среднее по клеткам и скрывает импульсы в отдельных клетках."},{"id":"S4-L12-2","text":"Наблюдение репортёра ERK в живых отдельных клетках","correct":true,"feedback":"Покадровое наблюдение отдельных клеток различает гладкую динамику и асинхронные импульсы."},{"id":"S4-L12-3","text":"Измерение общей ERK в лизате","correct":false,"feedback":"Общее количество ERK не отражает её активности и тоже усредняется по клеткам."}]},"widget":{"kind":"cells","title":"","s":{"title":"Отдельные клетки и среднее","status":"Учебная модель · условные импульсы, не данные опыта","modes_label":"Показать","modes":["Среднее по популяции","Три отдельные клетки","Клетки и среднее"],"cell":"клетка","mean":"среднее по 40 клеткам","x":"время, мин","y":"активность ERK, %","notes":["Среднее по популяции плавное и держится на постоянном уровне.","В каждой клетке активность возрастает импульсами в разные моменты.","Плавное среднее складывается из асинхронных импульсов, которых в среднем не видно."]}},"number":12,"question":2},{"id":"feedback-vs-termination","section":2,"questions":[3],"title":"Чем обратная связь отличается от завершения сигнала в узле","keywords":["обратная связь","отрицательная","положительная","завершение","DUSP","SOS","PKC"],"lead":["При обратной связи нижележащий компонент регулирует вышестоящие звенья, поэтому прошлое состояние сети влияет на её дальнейшую динамику.","Отрицательная связь ограничивает ответ, положительная его усиливает и может сделать необратимым."],"mechanism":["Завершение в узле действует локально: фосфатаза дефосфорилирует ERK, GAP переводит RAS в GDP-форму.","В [[T31|отрицательной обратной связи]] активная ERK тормозит RAF-1 и через RSK — SOS1, а также индуцирует синтез DUSP и SPRY.","В [[T32|положительной обратной связи]] выход усиливает собственное образование: например, при NGF в клетках PC12 ERK усиливает активацию RAF через PKC."],"paragraphs":["Механизмы завершения из раздела 1 работают в отдельных узлах: каждый уменьшает активность своего звена. [[T30|Обратная связь]] устроена иначе: выход каскада действует на его вход или промежуточные звенья. Поэтому ответ сети в данный момент зависит от её состояния минуту или час назад.","В каскаде ERK отрицательная связь действует на двух временных масштабах. Быстрая — посттрансляционная: ERK фосфорилирует несколько сериновых остатков RAF-1 и снижает её связывание с RAS (Dougherty 2005), а ERK и RSK фосфорилируют С-концевой участок SOS1: фосфорилирование по S1134 и S1161 (RSK) создаёт сайты связывания белков 14-3-3 и ослабляет активацию RAS (Douville и Downward 1997; Saha 2012). Медленная — транскрипционная: ERK индуцирует синтез DUSP и белков [[T33|SPRY/SPRED]], которые действуют только после накопления.","Положительная связь усиливает ответ. В клетках PC12 при NGF ERK через PKC усиливает активацию RAF, и ответ становится длительным (Santos 2007). В ооцитах Xenopus MAPK стабилизирует Mos и усиливает его синтез — так возникает переключатель; этот пример разобран в шагах о бистабильности.","Обратная связь не заменяет механизмы завершения, а надстраивается над ними. Поэтому разрыв одной петли обычно меняет весь профиль — форму пика, высоту плато и время затухания, — а не одну длительность."],"trap":["Фосфорилирование SOS и RAF-1 активной ERK — положительная обратная связь, усиливающая каскад.","Это отрицательная обратная связь: фосфорилированные SOS и RAF-1 хуже передают сигнал, и каскад тормозит сам себя."],"conditions":"Отрицательные связи — Dougherty и соавт. (2005; Raf-1, шесть сайтов), Douville и Downward (1997), Saha и соавт. (2012; RSK, SOS1 S1134/S1161), аннотации; положительная связь через PKC — Santos и соавт. (2007). Схема — механизм, не данные опыта.","sources":["Dougherty2005","DouvilleDownward1997","Saha2012","Santos2007","Lavoie2020"],"quiz":{"id":"S4-L13","question":"Активная ERK фосфорилирует RAF-1, после чего RAF-1 хуже связывается с RAS. К какому типу регуляции это относится?","options":[{"id":"S4-L13-1","text":"Положительная обратная связь","correct":false,"feedback":"Фосфорилированная RAF-1 хуже передаёт сигнал: выход каскада ослабляет собственный вход, а это отрицательная связь."},{"id":"S4-L13-2","text":"Отрицательная обратная связь","correct":true,"feedback":"Выход каскада (ERK) тормозит вышестоящее звено (RAF-1) — классическая отрицательная обратная связь, действующая за минуты."},{"id":"S4-L13-3","text":"Завершение сигнала в узле, не связанное с выходом","correct":false,"feedback":"Торможение запускает сама активная ERK, то есть выход каскада, поэтому это обратная связь, а не локальное завершение."}]},"widget":{"kind":"net","title":"","s":{"title":"Петли регуляции каскада ERK","status":"Схема механизма · не экспериментальные данные","modes_label":"Показать","modes":["Завершение в узлах","Быстрая отрицательная связь","Медленная отрицательная связь","Положительная связь (NGF, PC12)"],"h":290,"w":640,"nodes":[{"id":"rtk","x":20,"y":100,"w":90,"label":"рецептор","fs":14},{"id":"sos","x":130,"y":100,"w":76,"label":"SOS"},{"id":"ras","x":226,"y":100,"w":76,"label":"RAS"},{"id":"raf","x":322,"y":100,"w":84,"label":"RAF-1"},{"id":"mek","x":426,"y":100,"w":76,"label":"MEK"},{"id":"erk","x":522,"y":100,"w":90,"label":"ERK"},{"id":"dusp","x":380,"y":200,"w":120,"label":"DUSP, SPRY","fs":14},{"id":"pkc","x":200,"y":200,"w":90,"label":"PKC"}],"edges":[{"id":"c1","pts":[110,120,128,120],"type":"act"},{"id":"c2","pts":[206,120,224,120],"type":"act"},{"id":"c3","pts":[302,120,320,120],"type":"act"},{"id":"c4","pts":[406,120,424,120],"type":"act"},{"id":"c5","pts":[502,120,520,120],"type":"act"},{"id":"fS","pts":[560,98,360,20,172,98],"type":"inh","label":"ERK фосфорилирует RAF-1, RSK — SOS1","lx":360,"ly":40},{"id":"syn","pts":[560,142,540,220,502,220],"type":"syn"},{"id":"fD","pts":[440,198,520,170,548,142],"type":"inh"},{"id":"fSp","pts":[380,222,200,250,168,142],"type":"inh"},{"id":"pos1","pts":[540,142,400,270,292,222],"type":"act"},{"id":"pos2","pts":[245,198,300,170,350,142],"type":"act"},{"id":"dgap","pts":[600,160,590,150,578,142],"type":"inh"}],"states":[{"on":["ras","raf","mek","erk"],"show":["c1","c2","c3","c4","c5","dgap"],"hide":["fS","syn","fD","fSp","pos1","pos2"],"inh":[],"note":"Фосфатазы дефосфорилируют ERK, GAP переводят RAS в GDP-форму: каждый механизм действует на своё звено, независимо от выхода каскада."},{"on":["erk","mek"],"inh":["sos","raf"],"p":["sos","raf"],"show":["fS","c3","c4","c5"],"hide":["syn","fD","fSp","pos1","pos2","dgap"],"note":"Активная ERK непосредственно тормозит RAF-1 и через RSK ослабляет SOS1: вход каскада подавляется за минуты, без синтеза новых белков."},{"on":["erk","dusp"],"show":["syn","fD","fSp","c5"],"hide":["fS","pos1","pos2","dgap"],"note":"Активная ERK индуцирует синтез DUSP и SPRY. Накопившись через десятки минут, DUSP дефосфорилируют ERK, а SPRY тормозят передачу от рецептора к RAS."},{"on":["rtk","sos","ras","raf","mek","erk","pkc"],"show":["c1","c2","c3","c4","c5","pos1","pos2"],"hide":["fS","syn","fD","fSp","dgap"],"note":"При NGF в клетках PC12 активная ERK через PKC усиливает активацию RAF: выход поддерживает собственный вход, и ответ становится длительным (Santos 2007)."}]}},"number":13,"question":3},{"id":"two-loops","section":2,"questions":[3],"title":"Что делают быстрая и медленная отрицательные петли ERK","keywords":["быстрая петля","медленная петля","циклогексимид","DUSP","SPRY","пик","плато"],"lead":["Быстрая петля ограничивает пик в первые минуты, медленная снижает поздний уровень сигнала и повышает порог повторной активации.","Их разрыв меняет не только длительность, но и форму всего профиля."],"mechanism":["Быстрая петля: ERK фосфорилирует RAF-1, а активированная ею RSK — SOS1 (S1134, S1161); эффект развивается за минуты и не требует синтеза белка.","Медленная петля: ERK индуцирует транскрипцию генов DUSP и SPRY; белки накапливаются через десятки минут и часы.","Циклогексимид, подавляющий синтез белка, выключает медленную петлю, но не быструю."],"paragraphs":["Две отрицательные петли действуют на разных временных масштабах и по-разному влияют на профиль сигнала. Быстрая начинает работать, как только ERK становится активной: фосфорилирование SOS и RAF-1 уменьшает поток сигнала от рецептора уже в первые минуты. Поэтому она определяет, насколько широк пик и как быстро начинается спад.","Медленная петля требует синтеза мРНК и белка: ядерная ERK индуцирует гены DUSP1, DUSP5, DUSP6 и SPRY. Пока эти белки не накопились, они не действуют; затем они дефосфорилируют ERK и тормозят вход на уровне RAS. Эффект сохраняется дольше однократного фосфорилирования и повышает порог повторной активации тем же стимулом.","Вклад петель можно разделить экспериментально. Мутанты RAF-1 без сайтов, которые фосфорилирует ERK, дольше остаются активными (Dougherty 2005). Подавление синтеза белка выключает медленную петлю; но циклогексимид подавляет синтез всех белков, поэтому роль именно DUSP подтверждают с помощью siRNA или нокаута.","В модели практикума без быстрой петли pERK через 30 мин после EGF выше нормы почти вдвое, а без медленной — выше на позднем спаде. Если выключить обе, pERK остаётся высоким гораздо дольше: снижается он в основном из-за потери рецепторов."],"trap":["Обратные связи определяют только длительность сигнала.","Разрыв петли может изменить и амплитуду, и высоту плато, и время затухания. Поэтому у обратной связи различают по меньшей мере три наблюдаемых следствия."],"conditions":"Механизмы — Dougherty и соавт. (2005), Martín-Vega и Cobb (2023), Lavoie и соавт. (2020). Кривые — учебная модель практикума (вопрос 3п): фибробласты, EGF остаётся в среде, относительные величины.","sources":["Dougherty2005","MartinVegaCobb2023","Lavoie2020"],"quiz":{"id":"S4-L14","question":"Синтез белка подавлен циклогексимидом, EGF в среде. Какая петля перестанет работать?","options":[{"id":"S4-L14-1","text":"Быстрая: фосфорилирование SOS и RAF-1","correct":false,"feedback":"Фосфорилирование уже существующих SOS и RAF-1 не требует синтеза белка и сохраняется."},{"id":"S4-L14-2","text":"Обе петли сразу","correct":false,"feedback":"Циклогексимид не мешает фосфорилированию имеющихся белков; выключается только индуцируемый синтез DUSP и SPRY."},{"id":"S4-L14-3","text":"Медленная: синтез DUSP и SPRY","correct":true,"feedback":"Медленной петле нужны транскрипция и трансляция DUSP и SPRY; без синтеза белка она не работает."}]},"widget":{"kind":"course","title":"","s":{"title":"pERK при разрыве петель","status":"Учебная модель; фибробласты, EGF в среде; относительные величины","modes_label":"Петли","modes":["Обе работают","Нет быстрой","Нет медленной (циклогексимид)","Нет обеих"],"runs":[{"cfg":{},"input":"egf"},{"cfg":{"fast":false},"input":"egf"},{"cfg":{"slow":false,"chx":true},"input":"egf"},{"cfg":{"fast":false,"slow":false},"input":"egf"}],"keys":["E","R"],"key_labels":["pERK","RAS-GTP"],"ref":0,"ref_label":"обе петли работают","x":"время после добавления EGF, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY; RAS-GTP — доля всего RAS в GTP-форме. Расчёт модели; кривые не нормированы каждая на свой максимум.","u_min":"мин","points":[{"label":"pERK через 30 мин","key":"E","t":30},{"label":"pERK через 60 мин","key":"E","t":60}],"notes":["Обе петли работают: пик, затем спад в несколько раз за час.","Без быстрой петли RAS-GTP снижается медленнее, пик шире, pERK через 30 мин выше нормы почти вдвое.","Без медленной петли пик почти не меняется, а поздний уровень pERK выше нормы.","Без обеих петель pERK держится высоким гораздо дольше; спад определяет в основном потеря рецепторов."]}},"number":14,"question":3},{"id":"rebound","section":2,"questions":[3],"title":"Почему ингибитор RAF в меланоме подавляет ERK ненадолго","keywords":["BRAF V600E","вемурафениб","отскок","меланома","RAF-димеры","Lito","ингибитор MEK"],"lead":["Вемурафениб в клетках меланомы с BRAF V600E быстро подавляет ERK, но одновременно снимает ERK-зависимую отрицательную обратную связь.","Через часы растёт RAS-GTP, образуются устойчивые к препарату RAF-димеры, и pERK частично восстанавливается."],"mechanism":["Мономер [[T38|BRAF V600E]] активен без RAS; высокий pERK постоянно индуцирует DUSP и SPRY, которые поддерживают низкое содержание RAS-GTP.","[[T39|Вемурафениб]] подавляет мономер, pERK падает; без ERK DUSP и SPRY за часы исчезают, и вход от рецепторов растормаживается.","RAS-GTP растёт, образуются [[T40|RAF-димеры]], на которые препарат действует слабо, и pERK устанавливается на новом уровне."],"paragraphs":["В клетках меланомы с BRAF V600E мутантная киназа активна в виде мономера и не зависит от RAS. pERK постоянно высокий, поэтому ERK-зависимые ингибиторы каскада — DUSP6, SPRY2 и SPRY4 — синтезируются непрерывно, а RAS-GTP низкий. Опухоль сама поддерживает сильную отрицательную обратную связь на верхнюю часть каскада.","Lito и соавт. (2012) добавляли вемурафениб к таким клеткам. pMEK и pERK были максимально подавлены за 1–2 ч. Но без активной ERK DUSP6 и SPRY за 4–8 ч исчезали, ингибирующее фосфорилирование RAF-1 (CRAF) исчезало, а клетки вновь начинали отвечать на лиганды рецепторов — EGF, нейрегулин, HGF. RAS-GTP рос начиная с 4–8 ч и к 24 ч выходил на новый уровень.","При росте RAS-GTP образуются RAF-димеры с участием RAF-1. Вемурафениб действует на них слабо, поэтому pERK частично восстанавливался и держался на новом уровне, выше достигнутого минимума. Отскок зависел от RAS, SOS1 и RAF-1 и подавлялся ингибитором MEK. Сочетание ингибитора RAF с ингибитором MEK углубляло подавление ERK и усиливало противоопухолевый эффект в моделях на мышах.","Общий вывод: подавление одного узла не устраняет петлю, а смещает равновесие всей сети. Выбор схемы лечения — решение онколога; пример иллюстрирует системный принцип."],"trap":["Если ингибитор хорошо подавляет ERK в первый час, подавление сохранится и дальше.","Ранний эффект снимает ERK-зависимую обратную связь. Через часы растёт RAS-GTP, образуются устойчивые к препарату RAF-димеры, и pERK частично восстанавливается."],"conditions":"Клетки меланомы с BRAF V600E, вемурафениб и PLX4720 (Lito 2012, полный текст): минимум pMEK/pERK за 1–2 ч, рост RAS-GTP с 4–8 ч, новый уровень к ~24 ч. Кривые — учебная модель практикума (вопрос 3п), среда с сывороткой, относительные величины.","sources":["Lito2012"],"quiz":{"id":"S4-L15","question":"Меланома BRAF V600E, вемурафениб в среде. Почему через 24 ч pERK выше, чем через 1 ч?","options":[{"id":"S4-L15-1","text":"Препарат разрушился в среде","correct":false,"feedback":"Восстановление идёт и при сохранённом препарате: меняется не препарат, а сеть — растёт RAS-GTP и образуются RAF-димеры."},{"id":"S4-L15-2","text":"Снята обратная связь: растёт RAS-GTP, образуются RAF-димеры","correct":true,"feedback":"Без ERK исчезают DUSP и SPRY, вход от рецепторов растормаживается, а RAF-димеры слабо чувствительны к вемурафенибу."},{"id":"S4-L15-3","text":"Мономер BRAF V600E стал устойчив к препарату","correct":false,"feedback":"Мономер по-прежнему подавлен; сигнал восстанавливается обходным путём через RAS и RAF-димеры."}]},"widget":{"kind":"course","title":"","s":{"title":"Меланома BRAF V600E после добавления препарата","status":"Учебная модель по данным Lito 2012; относительные величины","modes_label":"Препарат","modes":["Без препарата","Вемурафениб","Вемурафениб + ингибитор MEK"],"runs":[{"cfg":{"mode":"mel"},"input":"none","tmax":2880,"hours":true},{"cfg":{"mode":"mel","vem":true},"input":"none","tmax":2880,"hours":true},{"cfg":{"mode":"mel","vem":true,"trame":true},"input":"none","tmax":2880,"hours":true}],"keys":["E","R","D"],"key_labels":["pERK","RAS-GTP","DUSP"],"ref":0,"ref_label":"без препарата","x":"время, мин","x_h":"время после добавления препарата, ч","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY; RAS-GTP — доля всего RAS в GTP-форме; DUSP — содержание индуцированных DUSP, % от уровня при постоянной максимальной активности ERK. Расчёт модели; кривые не нормированы каждая на свой максимум.","u_min":"мин","points":[{"label":"pERK через 1 ч","key":"E","t":1},{"label":"pERK через 24 ч","key":"E","t":24},{"label":"RAS-GTP через 24 ч","key":"R","t":24}],"notes":["Без препарата: pERK высокий, DUSP и SPRY индуцированы, RAS-GTP низкий.","Вемурафениб: pERK резко падает, затем DUSP исчезают, RAS-GTP растёт, и pERK частично восстанавливается.","Сочетание с ингибитором MEK: отскок через RAF-димеры блокирован, pERK остаётся низким."]}},"number":15,"question":3},{"id":"bistability","section":2,"questions":[3],"title":"Как положительная обратная связь создаёт переключатель","keywords":["бистабильность","положительная обратная связь","ооцит","Xenopus","Mos","MAPK","Ferrell"],"lead":["Одна положительная петля ещё не создаёт переключатель: для этого необходима также достаточная нелинейность.","Тогда при одном и том же стимуле возможны два устойчивых состояния — система бистабильна."],"mechanism":["В ооците Xenopus прогестерон запускает синтез Mos; Mos активирует MEK1, MEK1 — MAPK (ортолог ERK2).","Активная MAPK стабилизирует Mos и усиливает его синтез — положительная петля.","Петля вместе с крутизной каскада даёт [[T34|бистабильность]]: отдельный ооцит отвечает «всё или ничего»."],"paragraphs":["Положительная обратная связь ускоряет нарастание ответа: чем больше выход, тем сильнее он усиливает свой вход. Если зависимость пологая, сигнал просто растёт быстрее. Но если петля сочетается с крутой, нелинейной зависимостью, например со сверхчувствительностью каскада, у системы появляются два устойчивых состояния — низкое и высокое — и неустойчивое между ними.","Классический пример — созревание ооцитов шпорцевой лягушки. Ferrell и Machleder (1998) измеряли активность MAPK в отдельных ооцитах при разных концентрациях прогестерона. В каждом ооците MAPK была либо почти неактивна, либо полностью активна; эффективный коэффициент Хилла одноклеточного ответа составил не менее 35, тогда как в экстрактах коэффициент Хилла каскада составлял 4–5. В ооцитах с циклогексимидом, где Mos не синтезируется, MAPK активировали введённым белком Mos, и ответ отдельного ооцита становился постепенным (Ferrell 1999).","Xiong и Ferrell (2003) показали память переключателя: временный стимул вызывал устойчивый ответ, сохранявшийся после удаления прогестерона, а при блокаде положительной связи ответ становился временным.","На схеме — учебная модель главы 4: выход A способствует собственному образованию через нелинейный член и распадается с постоянной скоростью. Повышайте и снижайте стимул при разной силе петли и сравните пути. В этой модели после удаления члена положительной связи остаётся один устойчивый ответ. Это свойство выбранной модели: в каскаде MAPK бистабильность может возникать и без нарисованной внешней петли — из многосайтового фосфорилирования при насыщении и конкуренции форм субстрата (Markevich 2004)."],"trap":["Крутой ответ отдельной клетки сам по себе доказывает бистабильность.","Крутой ответ доказывает сверхчувствительность. Для бистабильности нужно показать два устойчивых состояния при одном стимуле: зависимость от предыстории и гистерезис."],"conditions":"Ооциты Xenopus laevis: nH ≥ 35 (Ferrell и Machleder 1998, аннотация; в обзоре Ferrell 1999 — ≥ 42; там же — опыт с циклогексимидом и введённым белком Mos), память ответа (Xiong и Ferrell 2003, аннотация и подписи к рисункам). Схема — учебная модель главы 4 (врезка 4.13): dA/dt = s + k₁·A⁴/(K⁴ + A⁴) − A, параметры условные.","sources":["FerrellMachleder1998","Ferrell1999","XiongFerrell2003","HuangFerrell1996","MarkevichHoekKholodenko2004"],"quiz":{"id":"S4-L16","question":"Что необходимо, чтобы система с положительной обратной связью стала бистабильной?","options":[{"id":"S4-L16-1","text":"Достаточно одной положительной петли","correct":false,"feedback":"Петля с пологой зависимостью только ускоряет нарастание ответа; переключателя не возникает."},{"id":"S4-L16-2","text":"Положительная петля вместе с достаточной нелинейностью","correct":true,"feedback":"Только сочетание петли и крутой зависимости даёт два устойчивых состояния при одном стимуле."},{"id":"S4-L16-3","text":"Сильная отрицательная обратная связь","correct":false,"feedback":"Отрицательная связь стабилизирует единственное состояние или даёт колебания, но не создаёт двух устойчивых состояний."}]},"widget":{"kind":"bistable","title":"","s":{"title":"Один ооцит: вход — выход","status":"Учебная модель главы 4 · условные величины","fb_label":"Положительная петля Mos ← MAPK","fbs":["нет","слабая","сильная"],"stim":"Прогестерон","reset":"Новый ооцит (сброс истории)","x":"прогестерон →","y":"MAPK, усл. ед.","m_a":"активность MAPK","m_state":"состояние","m_n":"устойчивых состояний при этом стимуле","hi":"высокое","lo":"низкое","two":"два","one":"одно","legend":"Бирюзовые точки — устойчивые состояния, серые — неустойчивые; лиловый пунктир — путь, по которому прошёл ооцит.","notes":["Петли нет: одно устойчивое состояние при каждом стимуле, ответ плавный и без памяти.","Слабая петля: в среднем диапазоне два устойчивых состояния; включение и выключение происходят при разных порогах, но выключение возможно.","Сильная петля: после включения ооцит остаётся в высоком состоянии даже без прогестерона — память ответа."]}},"number":16,"question":3},{"id":"hysteresis","section":2,"questions":[3],"title":"Как доказать бистабильность и чем гистерезис отличается от необратимости","keywords":["гистерезис","необратимость","бимодальность","предыстория","популяция","ооцит"],"lead":["Бистабильность доказывают тремя наблюдениями: бимодальным распределением ответов, зависимостью от предыстории и гистерезисом.","Гистерезис — разные пороги включения и выключения; он не означает, что обратный переход невозможен."],"mechanism":["[[T37|Бимодальное распределение]]: при одном промежуточном стимуле клетки распределяются по двум крайним состояниям, а не на промежуточных уровнях.","Зависимость от предыстории: клетка, получившая промежуточный стимул после более высокого, находится в другом состоянии, чем клетка, получившая его после более низкого.","[[T35|Гистерезис]]: выключение происходит при более низком стимуле, чем включение; [[T36|необратимость]] означает, что возврат невозможен при любом стимуле."],"paragraphs":["По плавной кривой «доза — ответ» в популяции нельзя судить о том, как отвечает отдельная клетка. У ооцитов Xenopus среднее по лизату росло плавно, а каждый ооцит был либо в низком, либо в высоком состоянии: промежуточное среднее складывалось из смеси двух групп с разной чувствительностью. Это первое наблюдение — бимодальность.","Бимодальность ещё не доказывает бистабильность: её может дать и крутой ответ при разной чувствительности клеток. Нужно второе наблюдение — зависимость от предыстории: при одном и том же стимуле клетка, ранее приведённая в высокое состояние, остаётся в нём, а клетка, получившая стимул «с нуля», остаётся в низком состоянии. Третье — гистерезис: при снижении стимула клетка выключается при более низком значении, чем включилась.","Гистерезис не тождествен необратимости. При слабой петле обратный переход возможен — он лишь требует более низкого входа. Необратимость означает, что возврата нет при любом снижении стимула; в модели так ведёт себя сильная петля. В клетке необратимость созревания ооцита обеспечивают и нижележащие события клеточного цикла, которые нужно проверять отдельно.","Во многих процессах с двумя исходами — делении, апоптозе, дифференцировке — бистабильность препятствует установлению промежуточных состояний и делает выбранное состояние устойчивым к кратковременным колебаниям стимула."],"trap":["Гистерезис означает, что после переключения система уже никогда не вернётся назад.","При гистерезисе обратный переход возможен, но при более низком стимуле, чем прямой. Необратимость — особый случай, её нужно проверять отдельно."],"conditions":"Признаки бистабильности и пример ооцита — Ferrell и Machleder (1998), Xiong и Ferrell (2003), глава 4 пособия (§4.13). Таблица — схема наблюдений, не данные опыта.","sources":["FerrellMachleder1998","XiongFerrell2003"],"quiz":{"id":"S4-L17","question":"При промежуточном стимуле в популяции одни клетки полностью активны, другие нет. Что ещё нужно показать, чтобы говорить о бистабильности?","options":[{"id":"S4-L17-1","text":"Ничего: бимодальность уже доказывает бистабильность","correct":false,"feedback":"Бимодальность возможна и при крутом ответе клеток с разной чувствительностью; нужны зависимость от предыстории и гистерезис."},{"id":"S4-L17-2","text":"Что ответ необратим при любом снижении стимула","correct":false,"feedback":"Необратимость не обязательна: бистабильная система может вернуться при более низком стимуле."},{"id":"S4-L17-3","text":"Зависимость от предыстории и гистерезис при снижении стимула","correct":true,"feedback":"Эти два наблюдения вместе с бимодальностью показывают два устойчивых состояния при одном стимуле."}]},"widget":{"kind":"table","title":"","s":{"title":"Что показывает каждое наблюдение","status":"Схема наблюдений · не экспериментальные данные","modes_label":"Система","modes":["Крутой ответ без петли","Бистабильность (слабая петля)","Бистабильность (сильная петля)"],"tables":[{"head":["Наблюдение","Результат"],"rows":[["бимодальность в популяции","возможна, если клетки различаются чувствительностью"],["зависимость от предыстории","нет"],["гистерезис","нет: пути вверх и вниз совпадают"],["возврат при снижении стимула","да, по той же кривой"]],"note":"Крутой ответ без положительной петли сверхчувствителен, но однозначен: при данном стимуле одно состояние."},{"head":["Наблюдение","Результат"],"rows":[["бимодальность в популяции","да"],["зависимость от предыстории","да, в среднем диапазоне"],["гистерезис","да: выключение при более низком стимуле"],["возврат при снижении стимула","да, ниже порога выключения"]],"note":"Бистабильность с гистерезисом, но без необратимости."},{"head":["Наблюдение","Результат"],"rows":[["бимодальность в популяции","да"],["зависимость от предыстории","да"],["гистерезис","да"],["возврат при снижении стимула","в модели нет даже без стимула"]],"note":"Крайний случай — память ответа. Необратимость конкретного биологического процесса проверяют отдельно."}]}},"number":17,"question":3},{"id":"adaptation","section":2,"questions":[3],"title":"Чем различаются точная адаптация, десенситизация и возбудимость","keywords":["адаптация","точная адаптация","десенситизация","возбудимость","колебания","хемотаксис","E. coli","GPCR"],"lead":["При постоянном входе система может вернуться к исходному выходу, снизить чувствительность входа или дать один всплеск.","Это разные режимы, и их обеспечивают разные схемы обратных связей."],"mechanism":["[[T41|Точная адаптация]]: выход возвращается к исходному уровню при сохраняющемся входе; в хемотаксисе E. coli её обеспечивает метилирование хеморецепторов.","[[T42|Десенситизация]] рецептора: GRK фосфорилирует рецептор, β-аррестин блокирует взаимодействие рецептора с G-белком, и чувствительность входа снижается.","[[T43|Возбудимость]]: надпороговый стимул вызывает один всплеск с возвратом к покою; при автоколебаниях система при постоянных условиях повторяет циклы без периодического внешнего воздействия."],"paragraphs":["Слово «адаптация» в разговорной речи означает любое ослабление ответа. В теории сетей точная адаптация — возврат выхода к прежнему уровню при том, что вход остаётся повышенным. Классический пример — хемотаксис кишечной палочки. Аттрактант подавляет киназу CheA, частота кувырканий падает, и бактерия плывёт дальше; затем метилтрансфераза CheR и метилэстераза CheB, активируемая CheA, меняют метилирование рецепторов и возвращают активность CheA к прежнему уровню.","Barkai и Leibler (1997) показали в модели, а Alon и соавт. (1999) в опыте, что точность такого возврата определяется устройством интегральной обратной связи и сохраняется при изменении концентраций белков сети; меняется скорость адаптации, но не её точность.","Десенситизация рецептора, сопряжённого с G-белком, — другой механизм: при длительной стимуляции тот же рецептор передаёт сигнал хуже. Снижается чувствительность входа, а возврат выхода целой сети к исходному уровню не гарантирован. Примером служит снижение действия β2-агонистов при частом применении.","Возбудимая система имеет одно устойчивое состояние покоя: надпороговый стимул вызывает один всплеск, после которого система сама возвращается к покою. В режиме автоколебаний при постоянных условиях (в том числе при постоянном стимуле) система повторяет циклы без периодического внешнего воздействия, а её стационарное состояние неустойчиво. Один пик после стимула не позволяет различить эти режимы: нужна длительная регистрация отдельных клеток."],"trap":["Точная адаптация и десенситизация рецептора — одно и то же: ответ ослабевает при постоянном стимуле.","Десенситизация снижает чувствительность одного рецептора. Точная адаптация возвращает выход всей сети к исходному уровню при сохраняющемся входе; её обеспечивает интегральная обратная связь."],"conditions":"Хемотаксис E. coli — Barkai и Leibler (1997), Alon и соавт. (1999); режимы сетей — Tyson и соавт. (2003); глава 4 пособия (§4.14–4.15). Таблица — схема, не данные опыта.","sources":["BarkaiLeibler1997","AlonEtAl1999","Tyson2003"],"quiz":{"id":"S4-L18","question":"Аттрактант остаётся в среде, а частота кувырканий E. coli вернулась к исходной. Как называется такое поведение?","options":[{"id":"S4-L18-1","text":"Точная адаптация","correct":true,"feedback":"Выход сети вернулся к прежнему уровню при сохраняющемся входе: баланс метилирования рецепторов (CheR) и деметилирования (CheB) компенсирует действие аттрактанта."},{"id":"S4-L18-2","text":"Десенситизация одного рецептора","correct":false,"feedback":"Десенситизация снижает чувствительность входа и не гарантирует возврата выхода к исходному уровню."},{"id":"S4-L18-3","text":"Возбудимость: один всплеск ответа","correct":false,"feedback":"Возбудимость описывает всплеск после надпорогового стимула, а здесь речь о возврате выхода при постоянном входе."}]},"widget":{"kind":"table","title":"","s":{"title":"Ответ на постоянный вход","status":"Схема режимов · не экспериментальные данные","modes_label":"Режим","modes":["Точная адаптация","Десенситизация","Возбудимость","Автоколебания"],"tables":[{"head":["Свойство","Значение"],"rows":[["выход при постоянном входе","возвращается к исходному уровню"],["устройство","интегральная обратная связь"],["пример","хемотаксис E. coli: CheR метилирует хеморецепторы, CheB их деметилирует"]],"note":"Точность возврата определяется устройством петли, а не точным подбором значений констант."},{"head":["Свойство","Значение"],"rows":[["выход при постоянном входе","снижается, не обязательно до исходного"],["устройство","модификация рецептора: GRK, β-аррестин, интернализация"],["пример","β2-адренорецептор при частом применении агонистов"]],"note":"Меняется чувствительность входа, а не точно возвращается выход сети."},{"head":["Свойство","Значение"],"rows":[["состояние покоя","одно, устойчивое"],["ответ на стимул","один всплеск выше порога, затем возврат к покою"],["пример","потенциал действия нейрона"]],"note":"Без нового стимула следующего всплеска нет."},{"head":["Свойство","Значение"],"rows":[["стационарное состояние","есть, но неустойчиво"],["ответ при постоянных условиях","повторяющиеся циклы без периодического внешнего воздействия"],["условия","отрицательная связь с достаточной задержкой или нелинейностью"]],"note":"Колебания могут идти и при постоянном стимуле. Один пик не отличает колебания от возбудимого ответа — нужна длительная регистрация."}]}},"number":18,"question":3},{"id":"insulin-akt","section":3,"questions":[4],"title":"Как инсулин активирует AKT","keywords":["инсулин","INSR","IRS","PI3K","PIP3","PDK1","mTORC2","T308","S473","AKT2"],"lead":["PIP₃ не активирует AKT сам по себе: он собирает на мембране AKT и две киназы, которые её фосфорилируют.","Для полной активности AKT нужны два фосфорилирования разными киназами."],"mechanism":["[[T44|Рецептор инсулина]] фосфорилирует [[T45|IRS1/IRS2]]; фосфотирозины IRS связывают p85, и [[T46|PI3K]] превращает PIP₂ в [[T47|PIP₃]].","PIP₃ связывает PH-домены AKT, PDK1 и SIN1 (субъединица mTORC2); связывание с PIP₃ снимает аутоингибирование AKT.","PDK1 фосфорилирует T308, mTORC2 — S473 (у AKT1); вместе они полностью активируют [[T48|AKT]]."],"paragraphs":["Инсулин связывается с рецептором — тирозинкиназой — и вызывает фосфорилирование его внутриклеточных доменов. Активный рецептор фосфорилирует адаптеры IRS1 и IRS2. Их фосфотирозины связывают регуляторную субъединицу p85 PI3K класса IA, и каталитическая p110 переносится к мембране, где превращает PIP₂ в PIP₃. Через GRB2 и SOS IRS может запускать и путь RAS–ERK, разобранный в вопросах 1–3.","PIP₃ служит местом сборки сигнального комплекса. Он связывает PH-домены AKT, PDK1 и SIN1 в составе mTORC2. Связывание AKT с PIP₃ снимает аутоингибирование: PH-домен перестаёт закрывать каталитический центр. Затем PDK1 фосфорилирует активационную петлю (T308 у AKT1, T309 у AKT2), а mTORC2 — гидрофобный мотив (S473 у AKT1, S474 у AKT2).","В печени и мышцах преобладает AKT2, поэтому номера сайтов нужно указывать вместе с изоформой. Выключают сигнал фосфатазы: PTEN удаляет 3-фосфат PIP₃, SHIP1/2 превращают PIP₃ в PI(3,4)P₂.","Фосфорилирование AKT — не то же самое, что её активность: степень фосфорилирования отражает баланс активности киназ и фосфатаз. Активность проверяют по фосфорилированию субстратов, например PRAS40 по T246."],"trap":["PIP₃ сам активирует AKT, поэтому появление PIP₃ равнозначно полной активации.","PIP₃ собирает AKT, PDK1 и mTORC2 на мембране. Полная активность требует двух фосфорилирований — T308 (PDK1) и S473 (mTORC2)."],"conditions":"По обзорам Burchfield и соавт. (2025), Manning и Toker (2017; полный текст), Madsen и Toker (2023) и главе 4 пособия. Нумерация сайтов — AKT1 и AKT2 человека. Схема — механизм, не данные опыта.","sources":["Burchfield2025","ManningToker2017","MadsenToker2023"],"quiz":{"id":"S4-L19","question":"В клетке образуется PIP₃, но mTORC2 неактивен. Каким будет состояние AKT после добавления инсулина?","options":[{"id":"S4-L19-1","text":"AKT полностью активна: PIP₃ достаточно","correct":false,"feedback":"PIP₃ лишь собирает AKT и её киназы на мембране; без фосфорилирования S473 активация неполная."},{"id":"S4-L19-2","text":"AKT активирована частично: есть T308, нет S473","correct":true,"feedback":"PDK1 фосфорилирует T308 и частично активирует AKT; полную активность даёт фосфорилирование S473 комплексом mTORC2."},{"id":"S4-L19-3","text":"AKT не привлекается к мембране","correct":false,"feedback":"Привлечение к мембране зависит от PIP₃ и PH-домена AKT, а не от mTORC2."}]},"widget":{"kind":"net","title":"","s":{"title":"От рецептора инсулина к AKT","status":"Схема механизма · не экспериментальные данные","modes_label":"Условия","modes":["Без инсулина","Инсулин","Инсулин + ингибитор PI3K","Инсулин, нет mTORC2"],"h":240,"w":640,"areas":[{"kind":"mem","y":60,"lx":120,"ly":22,"label":"плазматическая мембрана"}],"nodes":[{"id":"insr","x":20,"y":40,"w":80,"label":"INSR"},{"id":"irs","x":20,"y":120,"w":80,"label":"IRS"},{"id":"pi3k","x":140,"y":120,"w":80,"label":"PI3K"},{"id":"pip3","x":260,"y":40,"w":80,"label":"PIP₃"},{"id":"pdk1","x":380,"y":40,"w":80,"label":"PDK1"},{"id":"mtorc2","x":500,"y":40,"w":110,"label":"mTORC2"},{"id":"akt","x":420,"y":170,"w":110,"label":"AKT"}],"edges":[{"id":"a1","pts":[60,80,60,118],"type":"act"},{"id":"a2","pts":[100,140,138,140],"type":"act"},{"id":"a3","pts":[220,130,270,110,290,82],"type":"act"},{"id":"b1","pts":[340,70,400,120,440,168],"type":"bind"},{"id":"a4","pts":[420,82,450,120,460,168],"type":"act","label":"T308","lx":480,"ly":130},{"id":"a5","pts":[555,82,540,130,510,168],"type":"act","label":"S473","lx":590,"ly":130}],"states":[{"on":[],"note":"Без инсулина IRS не фосфорилирован, PIP₃ почти нет, AKT находится в цитоплазме в аутоингибированной форме."},{"on":["insr","irs","pi3k","pip3","pdk1","mtorc2","akt"],"p":["insr","irs","akt"],"show":["a1","a2","a3","b1","a4","a5"],"note":"Инсулин: IRS фосфорилирован, PI3K образует PIP₃, на котором собираются AKT, PDK1 и mTORC2; AKT фосфорилирована по T308 и S473."},{"on":["insr","irs"],"inh":["pi3k"],"p":["insr","irs"],"show":["a1","a2"],"drugs":[[140,190,"ингибитор PI3K"]],"note":"Рецептор и IRS отвечают, но PIP₃ не образуется: AKT не привлекается к мембране и не фосфорилируется."},{"on":["insr","irs","pi3k","pip3","pdk1","akt"],"miss":["mtorc2"],"p":["insr","irs"],"show":["a1","a2","a3","b1","a4"],"metrics":[["T308","фосфорилирован"],["S473","нет"]],"note":"Без mTORC2 AKT фосфорилирована только по T308 и активирована частично."}]}},"number":19,"question":4},{"id":"akt-outputs","section":3,"questions":[4],"title":"Как AKT распределяет сигнал по ветвям","keywords":["AKT","TSC2","FOXO1","GSK3","TBC1D4","AS160","снятие торможения","глюконеогенез","гликоген"],"lead":["AKT фосфорилирует более ста субстратов; в печени важнее всего ветви mTORC1, FOXO1 и GSK3, а в мышцах и жировой ткани — ещё и TBC1D4 (перенос GLUT4).","Через TSC2, GSK3 и TBC1D4 AKT снимает торможение соответствующих процессов, а в ветви FOXO1 подавляет активатор транскрипции, и экспрессия генов глюконеогенеза снижается."],"mechanism":["AKT фосфорилирует TSC2 и ослабляет его GAP-активность: RHEB-GTP накапливается и активирует mTORC1.","AKT фосфорилирует [[T54|FOXO1]]; он связывается с 14-3-3 и выходит из ядра — экспрессия генов глюконеогенеза PEPCK и G6PC снижается.","AKT фосфорилирует GSK3 и TBC1D4: растормаживаются синтез гликогена и (в мышцах и жировой ткани) перенос GLUT4 к мембране."],"paragraphs":["Сигнал AKT расходится по ветвям с разной кинетикой. Первая ведёт к mTORC1: TSC2 — GAP для RHEB, и, пока он активен, RHEB остаётся в GDP-форме. AKT фосфорилирует TSC2 (S939, T1462 у человека) и PRAS40 (T246), ослабляя торможение со стороны обоих белков; RHEB-GTP активирует mTORC1, при условии, что аминокислоты привлекли комплекс к лизосоме.","Вторая ветвь — FOXO1. Нефосфорилированный FOXO1 в ядре вместе с другими факторами активирует гены глюконеогенеза. AKT фосфорилирует его (T24, S256 у человека), FOXO1 связывается с белками 14-3-3 и выводится из ядра. В гепатоцитах крысы инсулин снижал содержание мРНК PEPCK примерно на 95 % (Li 2010).","Третья — GSK3: без инсулина она фосфорилирует и ингибирует гликогенсинтазу; AKT фосфорилирует GSK3 (S21 у α, S9 у β) и снимает это торможение. Четвёртая — TBC1D4 (AS160), GAP для малых ГТФаз Rab в мышцах и жировой ткани: после фосфорилирования под действием AKT активность TBC1D4 снижается, и пузырьки с GLUT4 переносятся к плазматической мембране.","В ветвях TSC2, GSK3 и TBC1D4 действует [[T49|снятие торможения]]: AKT подавляет белок, ограничивающий соответствующий процесс. Ветвь FOXO1 устроена иначе: FOXO1 активирует транскрипцию генов глюконеогенеза, поэтому его подавление снижает их экспрессию. Так один сигнал одновременно стимулирует синтез белка, липидов и гликогена и подавляет глюконеогенез."],"trap":["AKT напрямую активирует каждый процесс, которым управляет инсулин.","AKT действует через свои субстраты: подавление TSC2, GSK3 и TBC1D4 снимает торможение соответствующих процессов, а подавление активатора FOXO1 снижает экспрессию генов глюконеогенеза."],"conditions":"Сайты — Manning и Toker (2017, полный текст), нумерация человека; снижение мРНК PEPCK — гепатоциты крысы (Li 2010, аннотация). Столбики — учебная модель практикума (вопрос 4), величины условные.","sources":["ManningToker2017","Burchfield2025","Li2010"],"quiz":{"id":"S4-L20","question":"Почему фосфорилирование FOXO1 под действием AKT снижает экспрессию PEPCK?","options":[{"id":"S4-L20-1","text":"Фосфорилированный FOXO1 выводится из ядра","correct":true,"feedback":"FOXO1 после фосфорилирования связывается с 14-3-3 и покидает ядро, поэтому перестаёт активировать гены глюконеогенеза."},{"id":"S4-L20-2","text":"Фосфорилированный FOXO1 становится репрессором PEPCK","correct":false,"feedback":"Фосфорилирование не превращает FOXO1 в репрессор; оно убирает активатор из ядра."},{"id":"S4-L20-3","text":"AKT фосфорилирует сам ген PEPCK","correct":false,"feedback":"Киназы фосфорилируют белки, а не гены; AKT действует через транскрипционный фактор FOXO1."}]},"widget":{"kind":"liver","title":"","s":{"r_akt":"p-AKT (S473)","r_fox":"p-FOXO1 (S256; у мыши S253)","r_pepck":"мРНК PEPCK","r_s6k":"p-S6K (T389)","r_srebp":"мРНК SREBP-1c","r_srebpn":"SREBP-1c в ядре","r_ampk":"активность AMPK","legend":"Учебная модель практикума (вопрос 4), гепатоцит; величины условные. мРНК PEPCK — % от уровня без инсулина, остальные — доля от наибольшего значения в модели.","title":"Выходы AKT в гепатоците","status":"Учебная модель, условные величины","modes_label":"Инсулин","modes":["нет","30 %","100 %"],"conds":[{"ins":0},{"ins":0.3},{"ins":1}],"notes":["Без инсулина AKT неактивна: FOXO1 в ядре, PEPCK экспрессируется, mTORC1 и SREBP-1c не активированы.","Мало инсулина: ветвь mTORC1 уже отвечает, а большая часть FOXO1 ещё в ядре. В модели ветви различаются чувствительностью к сигналу AKT.","Много инсулина: большая часть FOXO1 фосфорилирована, мРНК PEPCK снижена примерно до 10 % исходного уровня; mTORC1, S6K и SREBP-1c активны."]}},"number":20,"question":4},{"id":"mtorc1-node","section":3,"questions":[4],"title":"Как AKT и AMPK вместе регулируют mTORC1","keywords":["mTORC1","AMPK","TSC2","Raptor","AKT","S487","точка сходимости","детектор совпадения"],"lead":["mTORC1 — точка сходимости противоположных входов: инсулиновый сигнал через AKT его активирует, дефицит энергии через AMPK подавляет.","AMPK тормозит mTORC1 даже при высоком инсулине, а AKT, в свою очередь, ослабляет активацию AMPK."],"mechanism":["AKT фосфорилирует TSC2 и ослабляет его; [[T52|AMPK]] фосфорилирует другие сайты TSC2 (T1227 и S1345 у крысы; у человека T1271 и S1387) и усиливает его.","AMPK фосфорилирует Raptor (S722, S792), к нему присоединяется 14-3-3, и mTORC1 подавляется независимо от TSC2.","AKT фосфорилирует α1-субъединицу AMPK по S487 (у человека) и ослабляет фосфорилирование T172 киназой LKB1."],"paragraphs":["[[T50|mTORC1]] активен на лизосоме при двух условиях одновременно: аминокислоты через Rag-ГТФазы привлекают комплекс к лизосоме, а [[T51|RHEB-GTP]] его активирует. Инсулиновый сигнал обеспечивает второе условие: AKT подавляет TSC2, и RHEB накапливается в GTP-форме. Подробно это разобрано в семинаре 7.","AMPK активируется при дефиците энергии. Inoki и соавт. (2003) показали, что при энергетическом стрессе AMPK фосфорилирует TSC2 по T1227 и S1345 (нумерация белка крысы; у человека — T1271 и S1387) и усиливает его действие на RHEB — в противоположность AKT. Gwinn и соавт. (2008) нашли второй путь: AMPK фосфорилирует Raptor по S722 и S792, с ним связывается 14-3-3, и mTORC1 подавляется даже в клетках без TSC2. Поэтому при дефиците энергии синтез белка и липидов тормозится и при высоком инсулине.","Регуляция действует и в обратном направлении. AKT фосфорилирует α1-субъединицу AMPK по S487 (S485 у крысы) в участке ST-петли, и LKB1 хуже фосфорилирует T172 (Hawley 2014). α2-субъединица почти не фосфорилируется AKT: соответствующий сайт S491 фосфорилируется самой AMP
