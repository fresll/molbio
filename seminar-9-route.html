<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-9.html">← Вернуться к семинару</a> · <a href="section-2.html#seminars">← Раздел II: семинары</a></p><h1>Митохондрии как энергетический, сигнальный и генетический узел</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-chemiosmosis"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 1 из 30</div><h2>Как перенос электронов связан с синтезом ATP</h2><p class="lead"><a href="#ns-g-S9-T02">Окислительное фосфорилирование</a> объединяет два процесса, которые идут в разных белковых комплексах: перенос электронов к O₂ и синтез ATP. Их связывает не общее химическое соединение, а <a href="#ns-g-S9-T07">электрохимический градиент H⁺</a> на <a href="#ns-g-S9-T06">внутренней мембране митохондрии</a>.</p><ol class="mech"><li>Комплексы <a href="#ns-g-S9-T03">дыхательной цепи</a> переносят электроны от NADH к O₂ и при этом переносят H⁺ из матрикса в межмембранное пространство.</li><li>Внутренняя мембрана плохо проницаема для H⁺, поэтому возникают разность электрических потенциалов и разность концентраций H⁺ — две составляющие протондвижущей силы Δp.</li><li>H⁺ возвращается в матрикс через ATP-синтазу, и энергия этого движения используется для синтеза ATP из ADP и неорганического фосфата.</li></ol><p>Митохондрия ограничена двумя мембранами. Наружная мембрана проницаема для небольших ионов, а внутренняя мембрана для H⁺ проницаема плохо. Она отделяет <a href="#ns-g-S9-T04">матрикс</a> — внутренний водный компартмент — от <a href="#ns-g-S9-T05">межмембранного пространства</a>. В этой мембране находятся дыхательные комплексы и ATP-синтаза.</p><p>Когда электроны NADH передаются по дыхательной цепи к O₂, комплексы I, III и IV переносят H⁺ из матрикса в межмембранное пространство. Снаружи от внутренней мембраны накапливается положительный заряд, а концентрация H⁺ в матриксе становится ниже, чем в межмембранном пространстве. Электрическая составляющая (мембранный потенциал) и химическая составляющая (<a href="#ns-g-S9-T09">ΔpH</a>) вместе образуют <a href="#ns-g-S9-T08">протондвижущую силу Δp</a>. При обычном состоянии митохондрии обе составляющие направлены одинаково: матрикс заряжен отрицательно и имеет более высокий pH, поэтому H⁺ стремится войти в матрикс.</p><p>Основным путём входа служит ATP-синтаза: поток H⁺ через её мембранную часть сопряжён с синтезом ATP из ADP и неорганического фосфата (Pi). Такую связь двух процессов через градиент ионов называют <a href="#ns-g-S9-T01">хемиосмотическим сопряжением</a>; эту гипотезу предложил П. Митчелл в 1961 г. Электроны при этом не переносятся на ADP: фосфатную группу ATP образует Pi, а энергию для реакции поставляет градиент H⁺.</p><p>Хемиосмотический принцип не ограничен митохондриями. В эксперименте Э. Рэкера и В. Штокениуса (1974) в искусственные фосфолипидные пузырьки встроили светозависимый протонный насос бактериородопсин и ATP-синтазу митохондрий сердца быка; на свету пузырьки накапливали H⁺ и синтезировали ATP без дыхательной цепи. В эксперименте А. Ягендорфа и Э. Урибе (1966) тилакоиды хлоропластов шпината выдерживали при pH 4, затем переносили в среду с pH 8, ADP и Pi, и в темноте образовывался ATP. Эти эксперименты показывают, что градиента H⁺ достаточно для синтеза ATP, но это искусственные системы, а не митохондрии человека.</p><div class="note trap"><strong>Типичная ошибка</strong> Синтез ATP требует непосредственного переноса электрона на ADP.<p class="trap-fix">Электроны дыхательной цепи восстанавливают O₂ и на ADP не переносятся. Перенос электронов создаёт градиент H⁺, а ATP-синтаза использует его энергию для присоединения Pi к ADP.</p></div><div class="static-quiz"><h3>Матрикс отрицателен относительно межмембранного пространства, а pH в матриксе выше. Какие составляющие протондвижущей силы способствуют поступлению H⁺ в матрикс?</h3><ol><li><b>А.</b> Электрическая составляющая способствует входу, а химическая — выходу H⁺. <i>(неверный вариант)</i><br><span class="expl">При более высоком pH концентрация H⁺ в матриксе ниже. Поэтому химическая составляющая также способствует входу H⁺.</span></li><li><b>Б.</b> Электрическая и химическая составляющие действуют в одном направлении. <i>(верный вариант)</i><br><span class="expl">Положительно заряженный H⁺ переносится к отрицательной стороне мембраны и из области большей концентрации H⁺ в область меньшей. При заданных условиях оба вклада направлены в матрикс.</span></li><li><b>В.</b> Химическая составляющая способствует входу, а электрическая — выходу H⁺. <i>(неверный вариант)</i><br><span class="expl">Отрицательный потенциал матрикса способствует поступлению положительно заряженных протонов. Электрический вклад здесь направлен внутрь.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/191144a0">Mitchell P. Coupling of phosphorylation to electron and hydrogen transfer by a chemi-osmotic type of mechanism. Nature. 1961;191:144–148.</a></li><li><a href="https://doi.org/10.1016/S0021-9258(19)43080-9">Racker E., Stoeckenius W. Reconstitution of purple membrane vesicles catalyzing light-driven proton uptake and adenosine triphosphate formation. J Biol Chem. 1974;249:662–663. doi:10.1016/S0021-9258(19)43080-9</a></li><li><a href="https://doi.org/10.1073/pnas.55.1.170">Jagendorf A. T., Uribe E. ATP formation caused by acid-base transition of spinach chloroplasts. Proc Natl Acad Sci USA. 1966;55:170–177. doi:10.1073/pnas.55.1.170</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; знаки и составляющие показаны качественно, без численных значений. Δψm определён как потенциал матрикса относительно межмембранного пространства: в рассматриваемом состоянии матрикс отрицателен и имеет более высокий pH. Эксперимент Racker 1974 — фосфолипидные пузырьки с бактериородопсином Halobacterium halobium и олигомицинчувствительной ATPазой митохондрий сердца быка; эксперимент Jagendorf 1966 — изолированные тилакоиды хлоропластов шпината, кислотно-основной переход в темноте. Оба эксперимента не относятся к митохондриям человека.</p></details></article><article class="card print-unit" id="ns-electron-flow"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 2 из 30</div><h2>Как комплексы дыхательной цепи создают градиент H⁺</h2><p class="lead">Электроны поступают в дыхательную цепь двумя путями: от NADH через комплекс I и от сукцината через комплекс II. Оба пути сходятся на убихиноне. H⁺ через мембрану переносят комплексы I, III и IV; комплекс II H⁺ не переносит, но его электроны проходят через III и IV.</p><ol class="mech"><li>Комплекс I окисляет NADH матрикса, а комплекс II окисляет сукцинат; оба комплекса восстанавливают <a href="#ns-g-S9-T10">убихинон (Q)</a> во внутренней мембране.</li><li>Восстановленный убихинон передаёт электроны комплексу III, затем <a href="#ns-g-S9-T11">цитохром c</a> переносит их к комплексу IV, который восстанавливает O₂ до воды.</li><li>По принятой учебной схеме на пару электронов комплексы I, III и IV выводят в межмембранное пространство 4, 4 и 2 H⁺: 10 H⁺ от NADH и 6 H⁺ от сукцината.</li></ol><p>Дыхательная цепь — это не один ряд переносчиков, а сеть, в которую электроны входят в разных местах. NADH, образованный дегидрогеназами матрикса, окисляется комплексом I. Сукцинат окисляется <a href="#ns-g-S9-T12">комплексом II (сукцинатдегидрогеназой)</a>: электроны переходят на прочно связанный с ферментом FAD, затем через железосерные центры — на убихинон. Оба пути сходятся на пуле убихинона во внутренней мембране.</p><p>Восстановленный убихинон окисляется комплексом III, который передаёт электроны небольшому гемсодержащему белку цитохрому c. Цитохром c находится со стороны межмембранного пространства и переносит электроны к комплексу IV. Комплекс IV восстанавливает O₂ до воды; для этого он использует H⁺ матрикса. Поэтому матрикс теряет H⁺ двумя способами: при переносе H⁺ через мембрану и при образовании воды.</p><p>Комплексы I, III и IV сопрягают перенос электронов с перемещением H⁺ из матрикса в межмембранное пространство. Комплекс II такой функции не имеет. Это не значит, что окисление сукцината бесполезно для синтеза ATP: его электроны проходят через комплексы III и IV, и эти комплексы создают протондвижущую силу. Различается только число перенесённых H⁺: по принятой схеме 10 на пару электронов NADH и 6 на пару электронов сукцината.</p><p>Отсюда разное <a href="#ns-g-S9-T22">отношение P/O</a> — число молекул ATP на атом восстановленного кислорода: для субстратов NADH в изолированных митохондриях обычно приводят около 2,5, для сукцината — около 1,5. Это оценки при заданных условиях эксперимента, а не постоянные величины любой клетки: фактический выход зависит от протонной утечки и затрат на перенос ADP, ATP и Pi.</p><div class="note trap"><strong>Типичная ошибка</strong> Если комплекс II не перекачивает H⁺, окисление сукцината не может поддерживать синтез ATP.<p class="trap-fix">Комплекс II восстанавливает убихинон, и его электроны проходят через комплексы III и IV, которые переносят H⁺. Поэтому сукцинат поддерживает Δp и синтез ATP, хотя на пару электронов переносится меньше H⁺, чем при окислении NADH.</p></div><div class="static-quiz"><h3>В изолированных митохондриях комплекс I заблокирован. Доступны сукцинат, O₂, ADP и Pi; остальные комплексы сохранны. Возможны ли образование протондвижущей силы и синтез ATP?</h3><ol><li><b>А.</b> Возможны: электроны проходят через II, III и IV, а H⁺ переносят III и IV. <i>(верный вариант)</i><br><span class="expl">Комплекс II восстанавливает убихинон. Последующий перенос электронов через III и IV сопряжён с перемещением H⁺, поэтому Δp может поддерживаться.</span></li><li><b>Б.</b> Возможны: комплекс II заменяет комплекс I как самостоятельный насос H⁺. <i>(неверный вариант)</i><br><span class="expl">У II нет функции протонного насоса. Он обеспечивает вход электронов в общую цепь переносчиков.</span></li><li><b>В.</b> Невозможны: комплекс II сам не переносит H⁺ через внутреннюю мембрану. <i>(неверный вариант)</i><br><span class="expl">Вариант учитывает отсутствие протонного переноса у II, но пропускает последующие комплексы III и IV.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbabio.2004.09.004">Hinkle P. C. P/O ratios of mitochondrial oxidative phosphorylation. Biochim Biophys Acta. 2005;1706:1–11. doi:10.1016/j.bbabio.2004.09.004</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма. Изолированные митохондрии или пермеабилизованные клетки с доступными сукцинатом, O₂, ADP и Pi; комплексы II, III, IV и ATP-синтаза сохранны. Стехиометрия 4 + 4 + 2 H⁺ на пару электронов — принятая учебная схема для митохондрий млекопитающих; значения P/O около 2,5 и 1,5 — оценки для изолированных митохондрий (Hinkle 2005). Внешний NADH через внутреннюю мембрану не проходит: в экспериментах с интактными митохондриями задают субстраты, образующие NADH в матриксе.</p></details></article><article class="card print-unit" id="ns-atp-synthase"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 3 из 30</div><h2>Как ATP-синтаза преобразует движение H⁺ в синтез ATP</h2><p class="lead">ATP-синтаза состоит из мембранной части F₀ и каталитической части F₁. H⁺ не проходят через F₀ по сквозному каналу: в субъединице a есть два отдельных полуканала, а от одного к другому H⁺ переносит вращающееся кольцо c-субъединиц. Через γ-субъединицу это вращение меняет состояния каталитических центров F₁. Энергия градиента расходуется прежде всего не на образование связи в активном центре, а на высвобождение прочно связанного ATP.</p><ol class="mech"><li>H⁺ из межмембранного пространства по первому водному полуканалу субъединицы a подходит к карбоксильной группе c-субъединицы и присоединяется к ней. Нейтральная c-субъединица входит в липидный бислой, кольцо поворачивается на один шаг, и спустя почти полный оборот эта субъединица достигает второго полуканала и отдаёт H⁺ в матрикс.</li><li>Кольцо c и центральная ножка (γ-субъединица) вращаются вместе. Асимметричная γ-субъединица поочерёдно меняет конформацию трёх β-субъединиц F₁: центр связывает ADP и Pi, затем прочно удерживает образовавшийся ATP и, наконец, открывается и высвобождает его. Шаг кольца c₈ составляет 45° на один H⁺, а состояния β меняются через каждые 120°.</li><li>Направление работы обратимо: при недостаточной Δp и наличии ATP фермент гидролизует ATP и вращается в обратную сторону. Те же два полуканала работают в обратном порядке: H⁺ присоединяется у полуканала, открытого в матрикс, и отдаётся в межмембранное пространство.</li></ol><p><a href="#ns-g-S9-T13">ATP-синтаза (F₀F₁)</a> — ферментный комплекс внутренней мембраны. Мембранная часть F₀ содержит кольцо из c-субъединиц и субъединицу a. Субъединица a вместе с периферической ножкой неподвижна относительно мембраны, а c-кольцо вращается. Часть F₁ выступает в матрикс и содержит три пары α- и β-субъединиц; каталитические центры расположены в β-субъединицах. Кольцо c и центральная ножка, включающая γ-субъединицу, образуют ротор, а периферическая ножка удерживает α₃β₃ неподвижно.</p><p>Через F₀ H⁺ проходят не по сквозной поре. Субъединица a прилегает к c-кольцу сбоку и образует два водных полуканала, смещённых друг относительно друга вдоль окружности кольца. Один открыт в межмембранное пространство (в митохондриях — в просвет крист), другой — в матрикс, и каждый заканчивается у кольца, не достигая противоположной стороны мембраны. Между полуканалами лежит консервативный положительно заряженный остаток аргинина субъединицы a. В каждой c-субъединице есть консервативная карбоксильная группа (остаток глутамата, у некоторых бактерий — аспартата), которая обратимо присоединяет H⁺. Поэтому H⁺ переходит из межмембранного пространства в матрикс только вместе с поворотом кольца, которое переносит c-субъединицу от одного полуканала к другому.</p><p>Направленное вращение возникает из нескольких свойств интерфейса a–c. Заряженная (депротонированная) карбоксильная группа не может войти в гидрофобный слой мембраны, а протонированная нейтральная группа может. Аргинин субъединицы a притягивает депротонированную группу и разделяет места связывания и высвобождения, поэтому H⁺ не переходит из одного полуканала в другой, минуя кольцо. По расчётам, сродство группы к H⁺ у полуканала со стороны межмембранного пространства выше, чем у полуканала в матрикс, что соответствует направлению градиента H⁺. На одной c-субъединице события при синтезе ATP идут в таком порядке: (1) у первого полуканала группа присоединяет H⁺ из межмембранного пространства; (2) нейтральная субъединица уходит в липидный бислой, и кольцо поворачивается на один шаг; (3) почти за полный оборот эта субъединица доходит до второго полуканала и отдаёт H⁺ в матрикс; (4) заряженная группа притягивается аргинином и вновь оказывается у первого полуканала. Вращающий момент создают электростатические взаимодействия на поверхности контакта a–c, а электрохимический градиент H⁺ делает присоединение у одного полуканала и отдачу у другого более вероятными и тем самым задаёт направление вращения.</p><p>Вращение кольца превращается в синтез ATP через γ-субъединицу. Кольцо c и центральная ножка вращаются вместе, поэтому γ-субъединица поворачивается внутри α₃β₃ и поочерёдно меняет конформацию β-субъединиц. В любой момент три центра находятся в разных состояниях: открытом, связывающем ADP и Pi и прочно удерживающем ATP. При повороте ротора на 120° каждый центр переходит в следующее состояние. Один шаг c₈-кольца равен 45° и соответствует одному H⁺, поэтому состояния β меняются не на каждый H⁺, а через два–три шага кольца. Этот механизм изменения связывания предложил П. Бойер; вращение γ-субъединицы при гидролизе ATP подтверждено экспериментально (Noji 1997). Сопряжение вращения с катализом называют <a href="#ns-g-S9-T14">роторным катализом</a>.</p><p>Число c-субъединиц в кольце зависит от организма. У млекопитающих кольцо содержит 8 субъединиц, поэтому за полный оборот через F₀ проходят 8 H⁺, а образуются 3 ATP — около 2,7 H⁺ на ATP (Watt 2010). Ещё примерно один H⁺ на молекулу ATP затрачивается на перенос Pi в матрикс и обмен ADP на ATP. Кольца из 10–15 субъединиц, известные у дрожжей (c₁₀), в хлоропластах (c₁₄) и у бактерий, нельзя переносить на митохондрии человека.</p><p>ATP-синтаза обратима. Если Δp мала, а ATP доступен, F₁ гидролизует ATP и вращает γ-субъединицу и c-кольцо в противоположную сторону. Те же два полуканала работают в обратном порядке: у полуканала, открытого в матрикс, карбоксильные группы присоединяют H⁺, а у полуканала, открытого в межмембранное пространство, отдают его, так что F₀ переносит H⁺ из матрикса против градиента. Такой режим поддерживает мембранный потенциал, но расходует ATP. Олигомицин блокирует F₀ и прекращает перенос H⁺ в обоих направлениях, а у клеток ρ⁰ нет субъединицы a (ATP6), поэтому полного пути для H⁺ нет; оба случая разобраны в следующих шагах.</p><div class="note trap"><strong>Типичная ошибка</strong> ATP-синтаза непосредственно передаёт протоны на ADP.<p class="trap-fix">Фосфатную группу ATP поставляет неорганический фосфат, а не H⁺. Поток H⁺ через F₀ вращает ротор, вращение меняет конформацию каталитических центров F₁, и это обеспечивает связывание субстратов, образование и высвобождение ATP. Сам F₀ при этом не сквозная пора: H⁺ присоединяется к c-субъединице у одного полуканала и отдаётся у другого.</p></div><div class="static-quiz"><h3>ATP-синтаза работает в режиме синтеза ATP: доступны ADP и Pi, протондвижущая сила достаточна. Как движение H⁺ через мембранную часть фермента связано с образованием ATP?</h3><ol><li><b>А.</b> Протоны присоединяются к ADP и образуют концевую фосфатную группу. <i>(неверный вариант)</i><br><span class="expl">Фосфатную группу поставляет неорганический фосфат. Перенос протонов обеспечивает энергию сопряжённого процесса.</span></li><li><b>Б.</b> Вращение ротора меняет состояния каталитических центров F₁. <i>(верный вариант)</i><br><span class="expl">Механическое сопряжение связывает движение H⁺ с конформационными изменениями каталитических центров и образованием и высвобождением ATP.</span></li><li><b>В.</b> Электроны поступают с ротора прямо на каталитически связанный ADP. <i>(неверный вариант)</i><br><span class="expl">ATP-синтаза не является участком переноса электронов дыхательной цепи. Сопряжение осуществляется через Δp и вращение.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.1011099107">Watt I. N., Montgomery M. G., Runswick M. J., Leslie A. G. W., Walker J. E. Bioenergetic cost of making an adenosine triphosphate molecule in animal mitochondria. Proc Natl Acad Sci USA. 2010;107:16823–16827. doi:10.1073/pnas.1011099107</a></li><li><a href="https://doi.org/10.1146/annurev.biochem.66.1.717">Boyer P. D. The ATP synthase — a splendid molecular machine. Annu Rev Biochem. 1997;66:717–749.</a></li><li><a href="https://doi.org/10.1038/386299a0">Noji H., Yasuda R., Yoshida M., Kinosita K. Jr. Direct observation of the rotation of F1-ATPase. Nature. 1997;386:299–302.</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-013118-110903">Kühlbrandt W. Structure and mechanisms of F-type ATP synthases. Annu Rev Biochem. 2019;88:515–549. doi:10.1146/annurev-biochem-013118-110903</a></li><li><a href="https://doi.org/10.1021/acs.jpclett.1c03358">Marciniak A., Chodnicki P., Hossain K. A., Slabonska J., Czub J. Determinants of directionality and efficiency of the ATP synthase Fo motor at atomic resolution. J Phys Chem Lett. 2022;13:387–392. doi:10.1021/acs.jpclett.1c03358</a></li><li><a href="https://doi.org/10.1093/molbev/msad146">Wong J. E., Zíková A., Gahura O. The ancestral shape of the access proton path of mitochondrial ATP synthases revealed by a split subunit-a. Mol Biol Evol. 2023;40(6):msad146. doi:10.1093/molbev/msad146</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; состояния центров (открытое, слабо и прочно связывающее) показаны качественно по механизму Бойера. Стехиометрия c₈ — для митохондрий млекопитающих (кристаллическая структура F₁-c₈ быка, Watt 2010); прямое наблюдение вращения — одиночные молекулы F₁ термофильной бактерии (Noji 1997). Вопрос шага рассматривает прямой режим при достаточной Δp и наличии ADP и Pi. Установлено структурами ATP-синтаз (криоЭМ): c-кольцо вращается относительно субъединицы a, в которой есть два водных полуканала, разделённых консервативным аргинином; в митохондриях один из них открыт в просвет крист (Kühlbrandt 2019, прочитан только реферат; Wong 2023). Порядок присоединения и отдачи H⁺, направление вращения и роль аргинина показаны в расчётах для F₀ дрожжей (Marciniak 2022; моделировали кольцо дрожжей, а не человека) и согласуются с данными мутагенеза, на которые ссылаются авторы. Для человеческого фермента детальная последовательность элементарных событий в F₀ не установлена, поэтому номера остатков не приводятся, а остатки дрожжей и бактерий на него не переносятся. Шаги 45° на один H⁺ и 120° на смену состояний β на схеме — геометрическая модель с жёсткой передачей вращения; времена и скорости не моделируются.</p></details></article><article class="card print-unit" id="ns-respiratory-control"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 4 из 30</div><h2>Почему доступность ADP влияет на скорость дыхания</h2><p class="lead">В сопряжённых митохондриях скорость дыхания зависит от того, как быстро протондвижущая сила используется для синтеза ATP. Когда расход ATP в клетке растёт, образуется больше ADP; ATP-синтаза быстрее возвращает H⁺ в матрикс, и перенос электронов ускоряется.</p><ol class="mech"><li>Процессы, расходующие ATP, образуют ADP и Pi; эти субстраты переносятся в матрикс и используются ATP-синтазой.</li><li>Чем быстрее ATP-синтаза возвращает H⁺ в матрикс, тем слабее Δp противодействует дальнейшему переносу H⁺ комплексами дыхательной цепи.</li><li>Перенос электронов и потребление O₂ ускоряются, а содержание ATP может почти не измениться: растут оба потока — образования и расхода.</li></ol><p>Когда субстраты окисления и O₂ доступны, скорость дыхания всё равно не максимальна. Перенос H⁺ комплексами дыхательной цепи совершается против протондвижущей силы: чем больше Δp, тем сильнее она тормозит дальнейший перенос H⁺ и вместе с ним перенос электронов. Поэтому скорость дыхания зависит от того, сколько H⁺ возвращается в матрикс через ATP-синтазу и другими путями.</p><p>Если клетка расходует ATP быстрее — например, при сокращении мышечного волокна или усиленном синтезе белка, — образуется больше ADP и Pi. Переносчики доставляют их в матрикс, ATP-синтаза работает быстрее и быстрее возвращает H⁺. Δp немного снижается, перенос электронов ускоряется, и потребление O₂ растёт. Эту зависимость скорости дыхания от использования протондвижущей силы для фосфорилирования ADP называют <a href="#ns-g-S9-T15">дыхательным контролем</a>.</p><p>Важно различать поток и содержание вещества. Ускорение дыхания означает больший поток синтеза ATP, но не обязательно рост содержания ATP: в установившемся состоянии ATP образуется и расходуется с одинаковой большей скоростью. Отношение ATP к ADP при этом может почти не меняться или даже немного снижаться.</p><p>На изолированных митохондриях дыхательный контроль измеряют как отношение скоростей дыхания с добавленным ADP (состояние 3) и после его исчерпания (состояние 4). Это отношение зависит от субстрата, препарата митохондрий и протокола, поэтому его сравнивают только при одинаковых условиях. В клетках роль ATP-связанного дыхания оценивают по ответу на олигомицин (шаги о методах ниже).</p><div class="note trap"><strong>Типичная ошибка</strong> Ускорение дыхания обязательно означает накопление ATP.<p class="trap-fix">При усиленном расходе ATP дыхание ускоряется именно потому, что ATP быстрее превращается в ADP. Синтез и расход растут вместе, а содержание ATP может остаться почти прежним.</p></div><div class="static-quiz"><h3>В сопряжённых митохондриях достаточно субстратов и O₂, но доступность ADP исходно ограничивает синтез ATP. Почему увеличение доступности ADP может ускорить дыхание?</h3><ol><li><b>А.</b> ATP-синтаза быстрее использует Δp, ослабляя ограничение переноса электронов. <i>(верный вариант)</i><br><span class="expl">При использовании Δp для фосфорилирования уменьшается противодействие дальнейшему переносу H⁺ дыхательной цепью. Поэтому поток электронов и потребление O₂ могут увеличиться.</span></li><li><b>Б.</b> ATP-синтаза медленнее использует Δp, поскольку ADP тормозит её работу. <i>(неверный вариант)</i><br><span class="expl">ADP служит субстратом синтеза ATP. При исходном ограничении доступностью ADP его добавление ускоряет использование Δp, а не тормозит работу синтазы.</span></li><li><b>В.</b> Использование ADP повышает Δp и тем самым ускоряет перенос электронов. <i>(неверный вариант)</i><br><span class="expl">При более быстром использовании Δp ATP-синтазой ограничение переноса электронов ослабевает. Вариант меняет направление этой причинной связи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/B978-0-12-801415-8.00016-3">Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; уровни скоростей — качественные. Сопряжённые митохондрии, доступные субстраты и O₂; сравниваются установившиеся состояния после изменения расхода ATP, без повреждения. Отношение дыхательного контроля (состояние 3 / состояние 4) относится к изолированным митохондриям; в клетках ATP-связанное дыхание оценивают по ответу на олигомицин (Divakaruni 2014).</p></details></article><article class="card print-unit" id="ns-inhibition"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 5 из 30</div><h2>Чем блок ATP-синтазы отличается от блока дыхательной цепи</h2><p class="lead"><a href="#ns-g-S9-T19">Олигомицин</a> связывается с F₀ и прекращает поток H⁺ через ATP-синтазу. Ингибиторы дыхательной цепи действуют на другие мишени — на сами комплексы переноса электронов. Какой поток останавливает олигомицин, зависит от исходного режима синтазы: синтеза ATP или его гидролиза.</p><ol class="mech"><li>В прямом режиме олигомицин прекращает возврат H⁺ через ATP-синтазу; Δp возрастает и тормозит перенос H⁺ дыхательной цепью, поэтому дыхание замедляется.</li><li>Если дыхательная цепь остановлена, а ATP доступен, ATP-синтаза может гидролизовать ATP и выводить H⁺ из матрикса, поддерживая потенциал.</li><li>В этом режиме олигомицин прекращает обращённую работу синтазы, и потенциал падает: знак ответа на олигомицин определяется исходным режимом фермента.</li></ol><p>Ингибиторы окислительного фосфорилирования различаются мишенями. Ротенон и пиерицидин A ингибируют комплекс I, малонат конкурирует с сукцинатом за активный центр комплекса II, антимицин A ингибирует комплекс III, цианид и азид — комплекс IV. Олигомицин связывается с F₀ ATP-синтазы и прекращает поток H⁺ через фермент; на перенос электронов он прямо не действует.</p><p>Рассмотрим сопряжённые митохондрии, которые активно синтезируют ATP. Олигомицин прекращает возврат H⁺ через ATP-синтазу, и синтез ATP останавливается. H⁺ продолжает выходить из матрикса, пока Δp не возрастёт настолько, что перенос H⁺ комплексами дыхательной цепи затормозится. Дыхание замедляется до уровня, который поддерживает <a href="#ns-g-S9-T17">протонная утечка</a>; мембрана немного гиперполяризуется.</p><p>Иная картина возникает, если дыхательная цепь остановлена, например ингибиторами комплексов I или III. Тогда ATP-синтаза может работать в обратную сторону: гидролизовать ATP и переносить H⁺ из матрикса, поддерживая пониженный мембранный потенциал. На изолированных митохондриях при остановленной цепи олигомицин вызывал немедленную деполяризацию — признак того, что синтаза работала в режиме гидролиза; ATP для этого в описанных условиях давало субстратное фосфорилирование в матриксе (Chinopoulos 2010).</p><p>Поэтому утверждение «олигомицин гиперполяризует митохондрии» верно только для исходного режима синтеза ATP. Одна проба с ингибитором показывает, какой поток зависел от мишени в данных условиях, но не устанавливает всю причинную цепочку.</p><div class="note trap"><strong>Типичная ошибка</strong> Олигомицин всегда вызывает деполяризацию.<p class="trap-fix">В сопряжённых митохондриях, синтезирующих ATP, олигомицин прекращает возврат H⁺ через синтазу, и Δp обычно возрастает. Деполяризацию он вызывает, когда синтаза работала в обратном режиме — гидролизовала ATP при остановленной дыхательной цепи.</p></div><div class="static-quiz"><h3>К активно фосфорилирующим сопряжённым митохондриям добавили олигомицин. Какое раннее сочетание изменений ожидается при достаточных субстратах и O₂?</h3><ol><li><b>А.</b> Синтез ATP снижается, Δp обычно возрастает, дыхание замедляется. <i>(верный вариант)</i><br><span class="expl">Блок F₀ ограничивает возврат H⁺ через ATP-синтазу. Возрастание Δp тормозит сопряжённый перенос электронов. Условие прямой работы фермента здесь существенно.</span></li><li><b>Б.</b> Синтез ATP снижается, Δp обычно снижается, дыхание ускоряется. <i>(неверный вариант)</i><br><span class="expl">Такой ответ смешивает блок ATP-синтазы с разобщением. При блоке F₀ протонный градиент исходно обычно увеличивается.</span></li><li><b>В.</b> Синтез ATP возрастает, Δp обычно снижается, дыхание ускоряется. <i>(неверный вариант)</i><br><span class="expl">Олигомицин подавляет работу ATP-синтазы и не может объяснить ускорение синтеза ATP в заданном режиме.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/B978-0-12-801415-8.00016-3">Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3</a></li><li><a href="https://doi.org/10.1096/fj.09-149898">Chinopoulos C. et al. Forward operation of adenine nucleotide translocase during F0F1-ATPase reversal: critical role of matrix substrate-level phosphorylation. FASEB J. 2010;24:2405–2416. doi:10.1096/fj.09-149898</a></li></ul><p>Схема механизма; изменения показаны качественно. Вопрос: изолированные сопряжённые митохондрии активно синтезируют ATP, субстраты и O₂ доступны, короткое воздействие олигомицина. Обращённый режим и деполяризация от олигомицина — изолированные митохондрии печени крысы с остановленной дыхательной цепью (ротенон, стигмателлин или KCN); ATP в матриксе давало субстратное фосфорилирование сукцинил-CoA-синтетазой (Chinopoulos 2010; контрольные эксперименты — митохондрии печени и сердца кролика). Небольшая гиперполяризация от олигомицина в клетках — Divakaruni 2014. Таблица мишеней — учебная сводка без доз.</p></details></article><article class="card print-unit" id="ns-uncoupling"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 6 из 30</div><h2>Как разобщение меняет дыхание, синтез ATP и образование тепла</h2><p class="lead">При <a href="#ns-g-S9-T16">разобщении</a> H⁺ возвращается в матрикс в обход ATP-синтазы. Перенос электронов продолжается и даже ускоряется, но всё меньшая часть его энергии используется для синтеза ATP. Разобщение вызывают протонофоры, например <a href="#ns-g-S9-T20">FCCP</a>, а в бурой жировой ткани — регулируемый белок <a href="#ns-g-S9-T18">UCP1</a>; энергия градиента рассеивается в виде теплоты.</p><ol class="mech"><li>Протонофор или белок с протонной проводимостью создаёт путь возврата H⁺ в матрикс, не связанный с ATP-синтазой.</li><li>Δp снижается и меньше тормозит перенос H⁺ дыхательной цепью; при доступных субстратах и O₂ дыхание ускоряется.</li><li>Синтез ATP митохондриями снижается, а энергия окисления в большей степени рассеивается в виде теплоты.</li></ol><p>Протонная утечка существует всегда: часть H⁺ возвращается в матрикс через внутреннюю мембрану без участия ATP-синтазы. В клетках её вклад определяют по дыханию, которое сохраняется после олигомицина. Разобщение — это усиление такого возврата H⁺, при котором сопряжение переноса электронов с синтезом ATP снижается.</p><p>FCCP — липофильная слабая кислота, протонофор. В протонированной форме она проходит через мембрану, в матриксе отдаёт H⁺ и в анионной форме возвращается обратно. Так FCCP переносит H⁺ в матрикс в обход синтазы. Δp снижается, торможение дыхательной цепи ослабевает, и при доступных субстратах и O₂ дыхание ускоряется. Синтез ATP митохондриями при этом снижается: Δp становится недостаточной для синтазы.</p><p>Ответ на FCCP зависит от дозы. Дозу подбирают титрованием: подобранная доза вызывает максимальное дыхание, а избыток разобщителя может снижать потребление O₂. Одна из возможных причин — уменьшение движущей силы для переноса анионных субстратов (пирувата, глутамата) в матрикс (Divakaruni 2014). Поэтому вывод о максимальной дыхательной способности делают только после титрования.</p><p>Физиологический пример — UCP1 во внутренней мембране бурых адипоцитов. При активации термогенеза (например, при охлаждении) UCP1 увеличивает протонную проводимость мембраны, и энергия окисления жирных кислот в большей степени выделяется в виде теплоты. UCP1 и FCCP приводят к сходному результату, но это разные молекулы: UCP1 — регулируемый белок определённых клеток, FCCP — синтетическое вещество, проходящее через любые мембраны.</p><div class="note trap"><strong>Типичная ошибка</strong> Быстрое потребление O₂ при разобщении означает высокий синтез ATP.<p class="trap-fix">При разобщении дыхание ускоряется именно потому, что H⁺ возвращается в обход ATP-синтазы. Потребление O₂ растёт, а синтез ATP митохондриями снижается: энергия рассеивается в виде теплоты.</p></div><div class="static-quiz"><h3>К митохондриям с сохранной цепью добавили подобранную дозу FCCP. Доступны субстраты и O₂. Как может измениться дыхание при снижении митохондриального синтеза ATP?</h3><ol><li><b>А.</b> Дыхание обязательно прекращается, поскольку FCCP блокирует комплекс IV. <i>(неверный вариант)</i><br><span class="expl">FCCP не является специфическим ингибитором комплекса IV. Избыточные дозы могут снижать OCR, но это другой режим.</span></li><li><b>Б.</b> Дыхание ускоряется, поскольку FCCP усиливает возврат H⁺ через ATP-синтазу. <i>(неверный вариант)</i><br><span class="expl">FCCP обеспечивает возврат H⁺ в обход ATP-синтазы. Именно рассеяние градиента уменьшает сопряжение с образованием ATP.</span></li><li><b>В.</b> Дыхание может ускориться, поскольку H⁺ возвращается в обход ATP-синтазы. <i>(верный вариант)</i><br><span class="expl">Разобщитель рассеивает Δp и уменьшает ограничение переноса электронов. Энергия окисления в меньшей степени используется для синтеза ATP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/B978-0-12-801415-8.00016-3">Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3</a></li><li><a href="https://doi.org/10.1016/j.cmet.2018.11.002">Chouchani E. T., Kazak L., Spiegelman B. M. New advances in adaptive thermogenesis: UCP1 and beyond. Cell Metab. 2019;29:27–37.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; уровни показаны качественно. Дыхательная цепь сохранна, субстраты и O₂ не лимитируют, доза FCCP подобрана титрованием; оценивается митохондриальный синтез ATP. Снижение дыхания при избытке протонофора и его возможные причины — Divakaruni 2014. UCP1 — бурые адипоциты при активации термогенеза (Chouchani 2019).</p></details></article><article class="card print-unit" id="ns-oxygen-profile"><div class="eyebrow">Хемиосмотическое сопряжение · шаг 7 из 30</div><h2>Что можно установить по кривой потребления O₂</h2><p class="lead">Респирометр регистрирует, как убывает концентрация O₂ в замкнутом объёме с клетками или митохондриями. Скорость потребления O₂ (<a href="#ns-g-S9-T21">OCR</a>) получают из наклона этой кривой. Последовательное добавление олигомицина, FCCP и ингибиторов цепи разделяет OCR на части, но не измеряет синтез ATP напрямую.</p><ol class="mech"><li>Датчик O₂ (электрод или оптический сенсор) регистрирует концентрацию O₂ во времени; OCR — скорость её снижения с учётом объёма и нормировки на число клеток или белок.</li><li>Олигомицин снижает OCR на величину ATP-связанного дыхания; подобранная доза FCCP показывает максимальное дыхание; ингибиторы комплексов I и III оставляют немитохондриальный остаток.</li><li>Одинаковый OCR возможен при разной доле утечки, поэтому скорость синтеза ATP по одному значению OCR не определяется.</li></ol><p>В закрытой камере с электродом Кларка или в лунке микропланшетного анализатора клетки потребляют O₂, и его концентрация убывает. Датчик записывает концентрацию O₂ во времени, а OCR рассчитывают как скорость её снижения. Чтобы сравнивать образцы, OCR нормируют на число клеток, количество белка или ДНК: две лунки с разным числом одинаковых клеток дают разный сырой сигнал, но одинаковый нормированный.</p><p>Стандартный протокол включает последовательные добавки (Divakaruni 2014). Сначала регистрируют базальное дыхание. Олигомицин прекращает синтез ATP, и OCR снижается: разность оценивает ATP-связанное дыхание, а остаток — дыхание, связанное с протонной утечкой. Подобранная титрованием доза FCCP показывает максимальное дыхание; разность максимального и базального называют резервной дыхательной способностью. В конце добавляют ротенон и антимицин A: оставшееся потребление O₂ немитохондриальное, его вычитают из остальных величин.</p><p>У этих оценок есть границы. После олигомицина мембрана немного гиперполяризуется, и утечка возрастает, поэтому ATP-связанное дыхание немного недооценивается. Максимальное дыхание в интактной клетке может ограничиваться поступлением субстратов, а не мощностью цепи. Немитохондриальное потребление O₂ у разных клеток различно.</p><p>Главное ограничение: OCR — это поток O₂, а не скорость синтеза ATP. Одинаковый OCR в двух образцах возможен при разной доле утечки, и тогда митохондрии синтезируют ATP с разной скоростью. Для вывода о синтезе ATP нужны дополнительные измерения — ответ на олигомицин, принятое отношение P/O или независимое определение ATP.</p><div class="note trap"><strong>Типичная ошибка</strong> OCR непосредственно измеряет скорость синтеза ATP.<p class="trap-fix">OCR измеряет скорость потребления O₂. Часть её поддерживает протонную утечку, часть может быть немитохондриальной. Скорость синтеза ATP оценивают по ответу на олигомицин и дополнительным измерениям.</p></div><div class="static-quiz"><h3>В двух образцах зарегистрировали одинаковую скорость потребления O₂. Достаточно ли этого, чтобы заключить, что митохондрии синтезируют ATP с одинаковой скоростью?</h3><ol><li><b>А.</b> Недостаточно: одинаковое дыхание возможно при разной степени сопряжения. <i>(верный вариант)</i><br><span class="expl">Часть дыхания может поддерживать протонную утечку; вклад немитохондриальных реакций также следует учитывать. Для оценки ATP нужны дополнительные измерения или обоснованный расчёт.</span></li><li><b>Б.</b> Достаточно: каждому значению OCR соответствует одна скорость синтеза ATP. <i>(неверный вариант)</i><br><span class="expl">Постоянное соответствие OCR и синтеза ATP не выполняется при изменении сопряжения и субстратов.</span></li><li><b>В.</b> Достаточно, если среднее содержание ATP в клетках также одинаково. <i>(неверный вариант)</i><br><span class="expl">Содержание ATP зависит от его образования и расхода. Равенство содержания не устанавливает равенства скоростей синтеза.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-9.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/B978-0-12-801415-8.00016-3">Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3</a></li></ul><p>Учебная модель: трасса O₂ и числа OCR — условные единицы, не данные эксперимента. Последовательность добавок и смысл каждой величины — по Divakaruni 2014 (микропланшетная респирометрия; в примере авторов — миобласты C2C12, олигомицин 2 мкг/мл, FCCP 800 нМ, ротенон 1 мкМ и антимицин A 2 мкМ). Нормировка показана на двух лунках с одинаковыми клетками и разным их числом.</p></details></article><article class="card print-unit" id="ns-membrane-potential"><div class="eyebrow">Потенциал и транспорт · шаг 8 из 30</div><h2>Что означает мембранный потенциал и его модуль</h2><p class="lead"><a href="#ns-g-S9-T23">Мембранный потенциал Δψm</a> — электрическая составляющая протондвижущей силы. Его записывают со знаком: потенциал матрикса относительно межмембранного пространства отрицателен. Поэтому изменение с −160 до −100 мВ — это уменьшение модуля потенциала, то есть деполяризация, хотя число стало больше.</p><ol class="mech"><li>Знак Δψm задан выбором точки отсчёта: Δψm = ψматрикса − ψмежмембранного пространства; в работающей митохондрии матрикс заряжен отрицательно.</li><li><a href="#ns-g-S9-T24">Модуль |Δψm|</a> показывает величину разности потенциалов; <a href="#ns-g-S9-T25">деполяризация</a> — уменьшение модуля, <a href="#ns-g-S9-T26">гиперполяризация</a> — его увеличение.</li><li>Δψm — только часть протондвижущей силы: ΔpH изменяется отдельно, поэтому значение потенциала не определяет скорость всех процессов, зависящих от градиента.</li></ol><p>Разность потенциалов на мембране всегда указывают относительно выбранной стороны. Для митохондрий принято записывать потенциал матрикса относительно межмембранного пространства: Δψm = ψматрикса − ψмежмембранного пространства. Поскольку дыхательная цепь выводит положительно заряженные H⁺ из матрикса, матрикс заряжен отрицательно, и Δψm в работающей митохондрии — отрицательное число. В культивируемых клетках его оценивают примерно от −120 до −160 мВ; в работе Gerencser 2012 для нейронов коры крысы в культуре получено около −139 мВ в покое.</p><p>С отрицательными числами легко ошибиться. Переход от −160 к −100 мВ — это увеличение числа, но уменьшение модуля со 160 до 100 мВ: электрическая составляющая ослабла. Такое изменение называют деполяризацией. Обратное изменение, например от −140 к −170 мВ, увеличивает модуль и называется гиперполяризацией. Деполяризация не означает обязательного исчезновения потенциала: при −100 мВ матрикс остаётся заряженным отрицательно.</p><p>Чтобы не путаться в знаках, на неотрицательных шкалах пишут «модуль потенциала |Δψm|, мВ». Тогда деполяризация выглядит как укорочение столбца, а гиперполяризация — как его удлинение.</p><p>Мембранный потенциал — не вся протондвижущая сила. Химическая составляющая ΔpH может изменяться независимо: например, перенос ионов через мембрану способен перераспределять энергию градиента между двумя составляющими. Разные процессы используют разные составляющие (это предмет следующего шага), поэтому по одному значению Δψm нельзя определить скорость синтеза ATP, импорта или транспорта.</p><div class="note trap"><strong>Типичная ошибка</strong> При переходе от −160 к −100 мВ потенциал становится сильнее, потому что число возрастает.<p class="trap-fix">Число возрастает, но модуль уменьшается со 160 до 100 мВ: разность потенциалов становится меньше. Это деполяризация. Сравнивать нужно модули, а знак показывает, какая сторона мембраны заряжена отрицательно.</p></div><div class="static-quiz"><h3>Потенциал матрикса относительно межмембранного пространства изменился с −160 до −100 мВ. Как называется это изменение?</h3><ol><li><b>А.</b> Деполяризация: модуль потенциала уменьшился со 160 до 100 мВ. <i>(верный вариант)</i><br><span class="expl">Матрикс остаётся отрицательным, но электрическая составляющая градиента ослабла. Это деполяризация.</span></li><li><b>Б.</b> Полная потеря потенциала: разность потенциалов стала равной нулю. <i>(неверный вариант)</i><br><span class="expl">Разность потенциалов −100 мВ сохраняется; деполяризация не обязательно означает её полное исчезновение.</span></li><li><b>В.</b> Гиперполяризация: модуль потенциала увеличился на 60 мВ. <i>(неверный вариант)</i><br><span class="expl">Алгебраическое увеличение отрицательного числа не означает увеличения его модуля.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1113/jphysiol.2012.228387">Gerencser A. A., Chinopoulos C., Birket M. J., Jastroch M., Vitelli C., Nicholls D. G., Brand M. D. Quantitative measurement of mitochondrial membrane potential in cultured cells: calcium-induced de- and hyperpolarization of neuronal mitochondria. J Physiol. 2012;590:2845–2871. doi:10.1113/jphysiol.2012.228387</a></li><li><a href="https://doi.org/10.1016/C2010-0-64902-9">Nicholls D. G., Ferguson S. J. Bioenergetics 4. London: Academic Press; 2013. Chapters 3–4 (протондвижущая сила, её составляющие и измерение).</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li></ul><p>Схема механизма с заданными учебными значениями −160, −100, −140 и −170 мВ; они не измерены в конкретной клетке. Знак определяется относительно межмембранного пространства. Пример измеренного значения: около −139 мВ в покое — нейроны коры крысы в культуре, расчёт по распределению TMRM с калибровкой (Gerencser 2012).</p></details></article><article class="card print-unit" id="ns-nucleotide-phosphate"><div class="eyebrow">Потенциал и транспорт · шаг 9 из 30</div><h2>Почему ANT и PiC используют разные составляющие градиента</h2><p class="lead">Для синтеза ATP в матриксе нужны ADP и Pi, а готовый ATP должен выйти в цитозоль. Эти потоки обеспечивают два переносчика внутренней мембраны. <a href="#ns-g-S9-T27">ANT</a> обменивает ATP⁴⁻ на ADP³⁻ и поэтому использует мембранный потенциал; <a href="#ns-g-S9-T28">PiC</a> переносит фосфат вместе с H⁺ без переноса заряда и использует ΔpH.</p><ol class="mech"><li>ANT выводит из матрикса ATP⁴⁻ в обмен на ADP³⁻: за один цикл наружу переносится один отрицательный заряд, поэтому обмен электрогенен.</li><li>Отрицательный потенциал матрикса способствует выходу более отрицательно заряженного ATP⁴⁻ и входу ADP³⁻.</li><li>PiC переносит H₂PO₄⁻ вместе с H⁺ (или в обмен на OH⁻); суммарный заряд не переносится, и движущей силой служит ΔpH.</li></ol><p>ATP образуется в матриксе, а расходуется в основном в цитозоле. Внутренняя мембрана для нуклеотидов непроницаема, поэтому обмен ATP на ADP осуществляет специальный переносчик — ANT (ADP/ATP-переносчик, транслоказа адениновых нуклеотидов). При физиологических значениях pH и с учётом связывания Mg²⁺ переносятся свободные формы ATP⁴⁻ и ADP³⁻. Обмен строго один на один: на каждую выведенную молекулу ATP в матрикс входит одна молекула ADP.</p><p>Поскольку ATP⁴⁻ несёт на один отрицательный заряд больше, чем ADP³⁻, каждый цикл переносит из матрикса один отрицательный заряд. Такой обмен называют электрогенным. Отрицательный потенциал матрикса способствует выходу ATP⁴⁻ и входу ADP³⁻, поэтому ANT использует электрическую составляющую градиента. Благодаря этому отношение ATP к ADP в цитозоле поддерживается выше, чем в матриксе.</p><p>Неорганический фосфат входит в матрикс через фосфатный переносчик PiC. В принятой схеме он переносит H₂PO₄⁻ вместе с H⁺; суммарный заряд при этом не переносится, и такой перенос электронейтрален. Его движущей силой служит ΔpH: более щелочной матрикс способствует входу H⁺ вместе с фосфатом. Механизм сопряжения с H⁺ изучен, в частности, на реконструированном переносчике дрожжей (Phelps 1996).</p><p>Вместе эти переносы расходуют часть протондвижущей силы — примерно один H⁺ на молекулу ATP. Поэтому на синтез одного ATP, доставленного в цитозоль, приходится около 2,7 H⁺ через ATP-синтазу и ещё около одного H⁺ на транспорт (см. шаг об ATP-синтазе). Механистический расчёт для кольца c₈ даёт около 2,7 ATP на NADH и 1,6 на сукцинат; измеренные значения P/O (около 2,5 и 1,5) ниже из-за протонной утечки и условий эксперимента (Hinkle 2005). Электрическая и химическая составляющие связаны, но на эти два переносчика они действуют по-разному.</p><div class="note trap"><strong>Типичная ошибка</strong> Любой транспорт через внутреннюю мембрану непосредственно определяется только Δψm.<p class="trap-fix">Электрогенный обмен ANT зависит от мембранного потенциала, а электронейтральный перенос фосфата через PiC — от ΔpH. Поэтому по одному Δψm нельзя судить обо всех транспортных процессах.</p></div><div class="static-quiz"><h3>Какое описание различия ANT и фосфатного переносчика PiC соответствует их транспортным механизмам?</h3><ol><li><b>А.</b> Обмен ANT электронейтрален; перенос Pi через PiC создаёт электрический ток. <i>(неверный вариант)</i><br><span class="expl">Различие зарядов ATP⁴⁻ и ADP³⁻ делает обмен ANT электрогенным. PiC непосредственно не переносит суммарный заряд в этой схеме.</span></li><li><b>Б.</b> Обмен ANT электрогенен; перенос Pi через PiC электронейтрален и связан с ΔpH. <i>(верный вариант)</i><br><span class="expl">ANT переносит нуклеотиды с различным зарядом. Для PiC важен протон-сопряжённый электронейтральный перенос фосфата.</span></li><li><b>В.</b> Оба переносчика осуществляют один и тот же электрогенный обмен ATP на ADP. <i>(неверный вариант)</i><br><span class="expl">PiC переносит неорганический фосфат, а не адениновые нуклеотиды.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbamem.2008.04.011">Klingenberg M. The ADP and ATP transport in mitochondria and its carrier. Biochim Biophys Acta. 2008;1778:1978–2021.</a></li><li><a href="https://doi.org/10.1021/bi961052x">Phelps A., Briggs C., Mincone L., Wohlrab H. Mitochondrial phosphate transport protein. Replacements of glutamic, aspartic, and histidine residues affect transport and protein conformation and point to a coupled proton transport path. Biochemistry. 1996;35:10757–10762. doi:10.1021/bi961052x</a></li><li><a href="https://doi.org/10.1096/fj.09-149898">Chinopoulos C. et al. Forward operation of adenine nucleotide translocase during F0F1-ATPase reversal: critical role of matrix substrate-level phosphorylation. FASEB J. 2010;24:2405–2416. doi:10.1096/fj.09-149898</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; показан обычный режим обмена при синтезе ATP. Электрогенность обмена ATP⁴⁻/ADP³⁻ — Klingenberg 2008; электронейтральный H⁺-сопряжённый перенос фосфата — реконструированный переносчик дрожжей (Phelps 1996); для человека механизм принят по аналогии. Режимы обращения ANT при деполяризации рассматривает Chinopoulos 2010.</p></details></article><article class="card print-unit" id="ns-presequence-import"><div class="eyebrow">Потенциал и транспорт · шаг 10 из 30</div><h2>Почему импорт в матрикс требует потенциала и ATP</h2><p class="lead">Большинство белков матрикса синтезируются в цитозоле в виде <a href="#ns-g-S9-T29">предшественников</a> с положительно заряженной <a href="#ns-g-S9-T30">N-концевой сигнальной последовательностью</a>. Их перенос в матрикс требует двух разных источников энергии: Δψm для начального перемещения сигнала через внутреннюю мембрану и ATP для работы матричного мотора.</p><ol class="mech"><li>Предшественник проходит через наружную мембрану по каналу <a href="#ns-g-S9-T31">TOM</a>, затем сигнальная последовательность входит в транслоказу внутренней мембраны <a href="#ns-g-S9-T32">TIM23</a>.</li><li>Отрицательный потенциал матрикса электрофоретически перемещает положительно заряженную сигнальную последовательность через внутреннюю мембрану.</li><li>Матричный мотор <a href="#ns-g-S9-T33">PAM</a> с ATPазой mtHsp70 протягивает остальную цепь в матрикс; протеаза MPP отщепляет сигнальную последовательность.</li></ol><p>Митохондрия содержит более тысячи разных белков, и подавляющее большинство из них кодирует ядро. Белки матрикса синтезируются на рибосомах цитозоля в виде предшественников, у которых на N-конце есть сигнальная последовательность длиной обычно 15–50 аминокислотных остатков. Она образует амфипатическую спираль с несколькими положительно заряженными остатками и узнаётся рецепторами комплекса TOM наружной мембраны.</p><p>Через канал TOM предшественник попадает в межмембранное пространство и связывается с транслоказой внутренней мембраны TIM23. Название транслоказы дано по одной из её субъединиц, Tim23, но в экспериментах на дрожжах путь, по которому проходит цепь, связан прежде всего с субъединицей Tim17 (Fielden 2023; Sim 2023). Дальнейшее перемещение сигнальной последовательности через внутреннюю мембрану требует мембранного потенциала: отрицательно заряженный матрикс притягивает положительно заряженный N-конец (Martin 1991).</p><p>Одного потенциала недостаточно для переноса всего белка. В матриксе к входящей цепи присоединяется mtHsp70 — шаперон с ATPазной активностью, главный компонент импортного мотора PAM. Циклы связывания и гидролиза ATP позволяют mtHsp70 удерживать и протягивать цепь в матрикс. Другие компоненты мотора выполняют иные функции: Tim44 связывает mtHsp70 с транслоказой, а Pam18 стимулирует его ATPазную активность. После входа в матрикс протеаза MPP отщепляет сигнальную последовательность, и белок сворачивается в зрелую форму.</p><p>Поэтому нарушение импорта может иметь разные причины: при деполяризации задерживается начальный перенос сигнала, а при недостатке ATP в матриксе — дальнейшее протягивание цепи. Сохранённый потенциал не гарантирует завершения импорта. Зависимость импорта от потенциала используется и для контроля качества: киназа <a href="#ns-g-S9-T37">PINK1</a> в здоровой митохондрии импортируется и расщепляется, а при деполяризации накапливается на наружной мембране (подробнее — в семинаре 12).</p><div class="note trap"><strong>Типичная ошибка</strong> Если потенциал сохранён, ATP для полного импорта не нужен.<p class="trap-fix">Δψm перемещает через внутреннюю мембрану только положительно заряженную сигнальную последовательность. Протягивание остальной цепи обеспечивает ATP-зависимый мотор PAM с mtHsp70, поэтому без ATP в матриксе импорт не завершается.</p></div><div class="static-quiz"><h3>У предшественника есть положительно заряженная N-концевая сигнальная последовательность. Δψm сохранён, но ATP для матричного мотора PAM недостаточно. Гарантирован ли полный импорт белка в матрикс?</h3><ol><li><b>А.</b> Нет: потенциал и ATP-зависимый цикл mtHsp70 выполняют разные функции. <i>(верный вариант)</i><br><span class="expl">Δψm способствует раннему переносу сигнальной последовательности, а ATP-зависимый мотор поддерживает последующие стадии транслокации.</span></li><li><b>Б.</b> Да: электрическое поле полностью заменяет работу матричных шаперонов. <i>(неверный вариант)</i><br><span class="expl">Электрический вклад не заменяет ATP-зависимые циклы моторного комплекса.</span></li><li><b>В.</b> Да: ATP нужен только для синтеза предшественника в цитозоле. <i>(неверный вариант)</i><br><span class="expl">Помимо синтеза предшественника, ATP требуется для работы матричного импортного мотора. Сохранение Δψm не устраняет эту потребность.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/S0021-9258(18)55235-2">Martin J., Mahlke K., Pfanner N. Role of an energized inner membrane in mitochondrial protein import. Δψ drives the movement of presequences. J Biol Chem. 1991;266:18051–18057. doi:10.1016/S0021-9258(18)55235-2</a></li><li><a href="https://doi.org/10.1038/s41586-023-06477-8">Fielden L. F. et al. Central role of Tim17 in mitochondrial presequence protein translocation. Nature. 2023;621:627–634.</a></li><li><a href="https://doi.org/10.1038/s41586-023-06239-6">Sim S. I. et al. Structural basis of mitochondrial protein import by the TIM23 complex. Nature. 2023;621:620–626.</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-060815-014352">Wiedemann N., Pfanner N. Mitochondrial machineries for protein import and assembly. Annu Rev Biochem. 2017;86:685–714.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li></ul><p>Схема механизма; четыре сочетания условий показаны качественно. Белок с N-концевой сигнальной последовательностью, путь в матрикс; не все митохондриальные белки используют этот путь. Требование Δψm для переноса сигнальной последовательности — изолированные митохондрии Neurospora crassa и дрожжей (Martin 1991). Роль Tim17 в пути транслокации — структурные и функциональные данные на дрожжах (Fielden 2023; Sim 2023); для человека схема принята по гомологии.</p></details></article><article class="card print-unit" id="ns-import-routes"><div class="eyebrow">Потенциал и транспорт · шаг 11 из 30</div><h2>Почему у митохондриальных белков несколько путей импорта</h2><p class="lead">Митохондриальные белки направляются в четыре компартмента: наружную мембрану, межмембранное пространство, внутреннюю мембрану и матрикс. Для этого существуют разные пути импорта. Большинство путей начинается с канала TOM, а дальше белки распределяются по адресу, который определяют сигналы в их последовательности.</p><ol class="mech"><li>Белки матрикса с N-концевой сигнальной последовательностью идут через TOM и TIM23 и протягиваются мотором PAM.</li><li>Переносчики внутренней мембраны семейства SLC25 (например, ANT) имеют внутренние сигналы: после TOM их ведут малые белки TIM межмембранного пространства к транслоказе <a href="#ns-g-S9-T34">TIM22</a>.</li><li>Белки, синтезированные на миторибосомах, встраиваются во внутреннюю мембрану со стороны матрикса инсертазой <a href="#ns-g-S9-T35">OXA1L</a>; β-бочонки наружной мембраны встраивает SAM, а белки межмембранного пространства с остатками цистеина удерживает система MIA.</li></ol><p>Путь TOM–TIM23–PAM, описанный в предыдущем шаге, — основной, но не единственный. Адрес белка определяют сигналы в его последовательности: отщепляемая N-концевая последовательность, внутренние сигналы, мотивы остатков цистеина или особенности β-бочонка. Почти все ядерно кодируемые белки проходят через канал TOM, а после него пути расходятся.</p><p>Переносчики внутренней мембраны семейства SLC25 — ANT, фосфатный переносчик и другие — не имеют отщепляемой сигнальной последовательности. После TOM их гидрофобные участки связывают малые белки TIM межмембранного пространства, которые предохраняют их от агрегации и передают транслоказе TIM22. TIM22 встраивает переносчик во внутреннюю мембрану; этот этап тоже зависит от мембранного потенциала.</p><p>Белки наружной мембраны со структурой β-бочонка (например, VDAC и сам Tom40) после TOM возвращаются к наружной мембране и встраиваются комплексом SAM. Небольшие белки межмембранного пространства с остатками цистеина удерживаются там системой MIA, которая образует в них дисульфидные связи. Белки, кодируемые мтДНК, синтезируются на миторибосомах в матриксе и встраиваются во внутреннюю мембрану инсертазой OXA1L; миторибосома связана с мембраной, и встраивание идёт одновременно с синтезом.</p><p>Поэтому нарушение одного пути не обязательно нарушает все остальные. Основная схема здесь дана для митохондрий человека; многие молекулярные детали установлены на дрожжах, и названия субъединиц у человека могут отличаться.</p><div class="note trap"><strong>Типичная ошибка</strong> Каждый белок митохондрии проходит через TOM и TIM23 в матрикс.<p class="trap-fix">TIM23 — путь белков с N-концевой сигнальной последовательностью. Переносчики внутренней мембраны встраиваются через TIM22, β-бочонки наружной мембраны — через SAM, белки межмембранного пространства удерживает MIA, а белки, синтезированные в митохондрии, встраивает OXA1L.</p></div><div class="static-quiz"><h3>Ядерно кодируемый переносчик семейства SLC25, например ANT, использует внутренние адресующие сигналы. Какой комплекс прежде всего рассматривают для его встраивания во внутреннюю мембрану после прохождения через TOM?</h3><ol><li><b>А.</b> Инсертазу OXA1L, участвующую во встраивании с матричной стороны. <i>(неверный вариант)</i><br><span class="expl">OXA1L участвует во встраивании с матричной стороны, в частности белков, синтезированных в митохондриях. Для указанного импортируемого переносчика классический путь связан с TIM22.</span></li><li><b>Б.</b> Комплекс SAM наружной мембраны. <i>(неверный вариант)</i><br><span class="expl">SAM участвует в сборке β-бочонковых белков наружной мембраны и не является основным ответом для данного груза.</span></li><li><b>В.</b> Транслоказу TIM22 внутренней мембраны. <i>(верный вариант)</i><br><span class="expl">Классический путь митохондриальных переносчиков связан с TIM22; его следует отличать от пути N-концевых сигнальных последовательностей через TIM23.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-060815-014352">Wiedemann N., Pfanner N. Mitochondrial machineries for protein import and assembly. Annu Rev Biochem. 2017;86:685–714.</a></li><li><a href="https://doi.org/10.1038/s41586-023-06477-8">Fielden L. F. et al. Central role of Tim17 in mitochondrial presequence protein translocation. Nature. 2023;621:627–634.</a></li><li><a href="https://doi.org/10.1038/s41586-023-06239-6">Sim S. I. et al. Structural basis of mitochondrial protein import by the TIM23 complex. Nature. 2023;621:620–626.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li></ul><p>Карта путей — схема механизма для митохондрий человека; молекулярные детали получены преимущественно на дрожжах и отделены от схемы человека (Wiedemann 2017; Fielden 2023; Sim 2023). Энергетическая зависимость указана только там, где она обсуждается в тексте.</p></details></article><article class="card print-unit" id="ns-calcium-entry"><div class="eyebrow">Потенциал и транспорт · шаг 12 из 30</div><h2>Как потенциал способствует поступлению Ca²⁺ через MCU</h2><p class="lead">Ca²⁺ входит в матрикс через <a href="#ns-g-S9-T44">MCU</a> — высокоизбирательный ионный канал внутренней мембраны. Энергию для этого переноса поставляет электрохимический градиент Ca²⁺, а не гидролиз ATP. Отрицательный потенциал матрикса притягивает двухзарядный катион, поэтому при деполяризации электрическая составляющая движущей силы ослабевает.</p><ol class="mech"><li>MCU образует пору, по которой Ca²⁺ проходит по электрохимическому градиенту; канал не сопряжён с гидролизом ATP.</li><li>Движущая сила входа складывается из разности концентраций Ca²⁺ и мембранного потенциала: отрицательный матрикс притягивает положительный ион.</li><li>Каждый вошедший Ca²⁺ переносит два положительных заряда и сам может уменьшать модуль потенциала.</li></ol><p>Митохондриальный Ca²⁺-унипортер давно был известен как путь быстрого входа Ca²⁺ в матрикс, но его порообразующий белок MCU идентифицировали только в 2011 г. (Baughman 2011; De Stefani 2011). Ранее электрофизиологические записи на митопластах — митохондриях без наружной мембраны — показали, что унипортер является высокоизбирательным Ca²⁺-каналом (Kirichok 2004).</p><p>Канал не расходует ATP. Ca²⁺ проходит через него по электрохимическому градиенту, который складывается из двух составляющих. Химическая составляющая — разность концентраций: свободная [Ca²⁺] в матриксе в покое близка к цитозольной и составляет порядка десятых долей микромоля, а около мест высвобождения Ca²⁺ из ЭПР она может быть значительно выше. Электрическая составляющая — мембранный потенциал: матрикс заряжен отрицательно и притягивает двухзарядный катион.</p><p>Если при прочих равных условиях модуль потенциала уменьшается, электрическая составляющая ослабевает, и вход Ca²⁺ через тот же канал замедляется. Поэтому деполяризация митохондрий снижает их способность накапливать Ca²⁺.</p><p>Вход Ca²⁺ электрогенен: каждый ион вносит в матрикс два положительных заряда. При большом потоке Ca²⁺ это само по себе уменьшает модуль потенциала, и для его поддержания нужен дополнительный перенос H⁺ дыхательной цепью. Регуляцию канала и роль локальной концентрации Ca²⁺ рассматривает раздел о контактах ЭПР и митохондрии.</p><p>Отрицательный потенциал матрикса способствует и входу K⁺. Во внутренней мембране описаны <a href="#ns-g-S9-T70">K⁺-каналы mitoKATP и mitoBK</a>. Канал mitoKATP подавляется миллимолярными концентрациями ATP; его образуют порообразующая субъединица MITOK и ATP-связывающая субъединица MITOSUR (Paggio 2019). Канал mitoBK активируется Ca²⁺ и зависит от потенциала; его кодирует ген KCNMA1, а в митохондрии белок направляет участок C-конца, включаемый при альтернативном сплайсинге (Singh 2013). Вход K⁺ вносит в матрикс положительный заряд; вслед за K⁺ и анионами в матрикс поступает вода, и объём матрикса увеличивается. Сверхэкспрессия MITOK вызывала набухание митохондрий и снижение Δψm, а удаление его гена — нестабильность Δψm и снижение окислительного фосфорилирования (Paggio 2019).</p><div class="note trap"><strong>Типичная ошибка</strong> MCU расходует ATP на каждый переносимый ион Ca²⁺.<p class="trap-fix">MCU — ионный канал, а не насос. Ca²⁺ проходит через него по электрохимическому градиенту, который создают разность концентраций и мембранный потенциал. ATP расходует, например, SERCA — Ca²⁺-ATPаза ЭПР.</p></div><div class="static-quiz"><h3>Модуль отрицательного потенциала матрикса уменьшили, сохранив концентрации Ca²⁺ и состояние MCU. Как изменится электрическая составляющая движущей силы входа Ca²⁺?</h3><ol><li><b>А.</b> Она увеличится, поскольку матрикс станет менее отрицательным. <i>(неверный вариант)</i><br><span class="expl">Менее отрицательный матрикс слабее способствует входу катиона. Здесь изменён именно электрический вклад.</span></li><li><b>Б.</b> Она уменьшится, поскольку ослабеет притяжение положительного иона к матриксу. <i>(верный вариант)</i><br><span class="expl">Электрический вклад определяется зарядом иона и разностью потенциалов. При уменьшении модуля отрицательного потенциала этот вклад ослабевает.</span></li><li><b>В.</b> Она не изменится, поскольку MCU получает энергию только от гидролиза ATP. <i>(неверный вариант)</i><br><span class="expl">MCU — ионный канал. Его проводимость не сопряжена с непосредственным гидролизом ATP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature02246">Kirichok Y., Krapivinsky G., Clapham D. E. The mitochondrial calcium uniporter is a highly selective ion channel. Nature. 2004;427:360–364. doi:10.1038/nature02246</a></li><li><a href="https://doi.org/10.1038/nature10234">Baughman J. M., Perocchi F., Girgis H. S., Plovanich M., Belcher-Timme C. A., Sancak Y., Bao X. R., Strittmatter L., Goldberger O., Bogorad R. L., Koteliansky V., Mootha V. K. Integrative genomics identifies MCU as an essential component of the mitochondrial calcium uniporter. Nature. 2011;476:341–345. doi:10.1038/nature10234</a></li><li><a href="https://doi.org/10.1038/nature10230">De Stefani D., Raffaello A., Teardo E., Szabò I., Rizzuto R. A forty-kilodalton protein of the inner membrane is the mitochondrial calcium uniporter. Nature. 2011;476:336–340. doi:10.1038/nature10230</a></li><li><a href="https://doi.org/10.1038/s41586-019-1498-3">Paggio A., Checchetto V., Campo A., Menabò R., Di Marco G., Di Lisa F., Szabo I., Rizzuto R., De Stefani D. Identification of an ATP-sensitive potassium channel in mitochondria. Nature. 2019;572:609–613.</a></li><li><a href="https://doi.org/10.1073/pnas.1302028110">Singh H., Lu R., Bopassa J. C., Meredith A. L., Stefani E., Toro L. MitoBK(Ca) is encoded by the Kcnma1 gene, and a splicing sequence defines its mitochondrial location. Proc Natl Acad Sci USA. 2013;110:10836–10841.</a></li></ul><p>Схема механизма; сравниваются ранние состояния при неизменных концентрациях Ca²⁺, проводимости канала и остальных условиях. MCU как высокоизбирательный канал — ток в митопластах из клеток COS-7 (Kirichok 2004); идентификация MCU — Baughman 2011 (клетки HeLa, печень мыши) и De Stefani 2011 (клетки HeLa, реконструкция в бислое). K⁺-каналы: mitoKATP — клетки и мыши, реконструкция MITOK и MITOSUR в липосомах и бислое (Paggio 2019); mitoBK — кардиомиоциты мыши и крысы (Singh 2013).</p></details></article><article class="card print-unit" id="ns-rho-zero"><div class="eyebrow">Потенциал и транспорт · шаг 13 из 30</div><h2>Как может сохраняться потенциал при отсутствии мтДНК</h2><p class="lead"><a href="#ns-g-S9-T36">Клетки ρ⁰</a> не содержат мтДНК и поэтому не могут собрать дыхательную цепь и полноценную ATP-синтазу. При этом митохондрии у них есть, и импорт ядерно кодируемых белков продолжается. Пониженный мембранный потенциал в таких клетках поддерживает не перенос H⁺, а электрогенный обмен ATP⁴⁻ на ADP³⁻ через ANT вместе с гидролизом ATP в матриксе.</p><ol class="mech"><li>Без 13 белков, кодируемых мтДНК, комплексы I, III и IV не собираются, а у ATP-синтазы нет субъединиц a (ATP6) и A6L (ATP8): полноценная F₀F₁ не образуется, и H⁺ через мембрану не переносится.</li><li>ATP гликолиза входит в матрикс через ANT как ATP⁴⁻ в обмен на ADP³⁻: каждый цикл вносит в матрикс один отрицательный заряд.</li><li>Неполный комплекс с ATPазной активностью F₁ гидролизует ATP в матриксе и образует ADP для следующего цикла обмена; так поддерживается пониженный Δψm.</li></ol><p>Клетки ρ⁰ — культивируемые клетки, полностью утратившие мтДНК (King 1989). Без мтДНК клетка не синтезирует 13 белков дыхательной цепи и ATP-синтазы, поэтому комплексы I, III и IV не работают, а у ATP-синтазы нет двух мембранных субъединиц, кодируемых мтДНК. ATP такие клетки получают гликолизом; для роста им добавляют в среду пируват и уридин.</p><p>Тем не менее митохондрии в ρ⁰-клетках сохраняются, а ядерно кодируемые белки продолжают импортироваться — для этого нужен мембранный потенциал. Его источник был выяснен на клетках человека линии 143B (Appleby 1999; Buchet 1998). ANT работает в обратном обычному направлении: ATP⁴⁻ из цитозоля входит в матрикс, а ADP³⁻ выходит. Каждый цикл вносит в матрикс один отрицательный заряд.</p><p>Чтобы обмен продолжался, ATP в матриксе должен превращаться в ADP. Это делает неполный комплекс ATP-синтазы с работающей частью F₁. Ингибиторы ANT и азид, ингибирующий F₁, снимали потенциал, а олигомицин, действующий на мембранную часть, — нет. В интактных ρ⁰-клетках модуль потенциала по оценке авторов не превышал примерно 67 мВ, то есть был ниже, чем в исходных клетках, но достаточным для импорта.</p><p>Отсюда два вывода. Отсутствие мтДНК не означает отсутствия митохондрий и потенциала. И полноценная F₀F₁ в ρ⁰-клетке не работает как протонный насос: ответ на олигомицин у этих клеток иной, чем у клеток с мтДНК. Механизм описан для определённых линий клеток человека; при недостатке гликолитического ATP потенциал не поддерживается.</p><div class="note trap"><strong>Типичная ошибка</strong> Отсутствие мтДНК означает отсутствие митохондрий и любого Δψm.<p class="trap-fix">Митохондрии в ρ⁰-клетках сохраняются: почти все их белки кодирует ядро. Пониженный потенциал поддерживает электрогенный обмен ATP⁴⁻ на ADP³⁻ через ANT вместе с гидролизом ATP неполной ATP-синтазой в матриксе.</p></div><div class="static-quiz"><h3>В культивируемых ρ⁰-клетках отсутствует мтДНК, но сохраняются гликолиз и ядерно кодируемые белки митохондрий. Возможно ли сохранение пониженного Δψm и импорта части ядерно кодируемых белков?</h3><ol><li><b>А.</b> Невозможно: при отсутствии мтДНК внутренней мембраны митохондрий не существует. <i>(неверный вариант)</i><br><span class="expl">ρ⁰ означает отсутствие мтДНК, а не исчезновение органелл и их мембран.</span></li><li><b>Б.</b> Возможно: комплекс II в одиночку заменяет все протонные насосы дыхательной цепи. <i>(неверный вариант)</i><br><span class="expl">Комплекс II не перекачивает H⁺. Сохранение Δψm здесь объясняется другим механизмом.</span></li><li><b>В.</b> Возможно: потенциал может поддерживаться за счёт ATP и электрогенного обмена ANT. <i>(верный вариант)</i><br><span class="expl">В описанных клеточных системах импорт ATP⁴⁻ в обмен на экспорт ADP³⁻ создаёт электрический вклад. Гидролиз ATP в матриксе обеспечивает ADP для продолжения обмена. Этот механизм может поддерживать пониженный потенциал и часть импортных процессов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1046/j.1432-1327.1999.00350.x">Appleby R. D., Porteous W. K., Hughes G., James A. M., Shannon D., Wei Y. H., Murphy M. P. Quantitation and origin of the mitochondrial membrane potential in human cells lacking mitochondrial DNA. Eur J Biochem. 1999;262:108–116. doi:10.1046/j.1432-1327.1999.00350.x</a></li><li><a href="https://doi.org/10.1074/jbc.273.36.22983">Buchet K., Godinot C. Functional F1-ATPase essential in maintaining growth and membrane potential of human mitochondrial DNA-depleted ρ° cells. J Biol Chem. 1998;273:22983–22989.</a></li><li><a href="https://doi.org/10.1126/science.2814477">King M. P., Attardi G. Human cells lacking mtDNA: repopulation with exogenous mitochondria by complementation. Science. 1989;246:500–503.</a></li><li><a href="https://doi.org/10.1096/fj.09-149898">Chinopoulos C. et al. Forward operation of adenine nucleotide translocase during F0F1-ATPase reversal: critical role of matrix substrate-level phosphorylation. FASEB J. 2010;24:2405–2416. doi:10.1096/fj.09-149898</a></li></ul><p>Схема механизма; уровни показаны качественно. Культивируемые клетки человека (линия 143B и производные ρ⁰-клетки), в которых описан ANT-зависимый механизм, при достаточном образовании ATP гликолизом (Appleby 1999; Buchet 1998). Оценка |Δψm| ≈ 67 мВ — верхняя граница для интактных клеток, получена при допущении, что весь накопленный зонд находится в митохондриях. Не все организмы и линии ведут себя одинаково; ответ ρ⁰-клеток на олигомицин нельзя переносить с клеток, содержащих мтДНК. Получение ρ⁰-клеток — King 1989.</p></details></article><article class="card print-unit" id="ns-potential-import-assays"><div class="eyebrow">Потенциал и транспорт · шаг 14 из 30</div><h2>Как раздельно проверяют потенциал и импорт белка</h2><p class="lead">Мембранный потенциал и импорт белка измеряют разными экспериментами. Сигнал катионного зонда TMRM — это не потенциал в милливольтах и тем более не число импортированных белков. Импорт проверяют отдельно: меченый предшественник инкубируют с митохондриями и выясняют, защищён ли он от протеазы.</p><ol class="mech"><li><a href="#ns-g-S9-T38">TMRM</a> — липофильный катион; он распределяется через плазматическую и внутреннюю мембраны в соответствии с их потенциалами и накапливается в отрицательно заряженном матриксе.</li><li>Интенсивность сигнала зависит также от режима измерения, массы митохондрий и потенциала плазматической мембраны; FCCP служит контролем полной деполяризации.</li><li>Импорт подтверждают защитой меченого белка от протеиназы K и отщеплением сигнальной последовательности; детергент, растворяющий мембраны, снимает защиту.</li></ol><p>TMRM и TMRE — липофильные катионы, проходящие через мембраны. В равновесии они распределяются по закону Нернста: сначала между средой и цитозолем в соответствии с потенциалом плазматической мембраны, затем между цитозолем и матриксом в соответствии с Δψm. При низкой концентрации зонда (режим без гашения) яркость митохондрий тем выше, чем больше модуль потенциала. При высокой концентрации зонд накапливается так сильно, что флуоресценция гасится, и связь сигнала с потенциалом меняется: деполяризация сначала усиливает сигнал митохондрий и всей клетки, потому что зонд выходит из матрикса и гашение ослабевает.</p><p>Поэтому падение флуоресценции TMRM может иметь разные причины: деполяризацию митохондрий, уменьшение их массы, изменение потенциала плазматической мембраны или выход зонда из клеток. Контроли обязательны: FCCP в конце
