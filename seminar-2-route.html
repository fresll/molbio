 Числа на схеме — расчёт по модели практикума (вопрос 1, продвинутый уровень, мысленный эксперимент): путь всех митохондрий участка, мкм за минуту, учебные величины.","sources":["Hancock2014","Ally2009","Pilling2006"],"quiz":{"id":"S2-L04","question":"В клетках подавили синтез динеина. Какой результат говорит в пользу модели согласованного переключения?","options":[{"id":"S2-L04-1","text":"Пробеги к плюс-концу стали чаще и длиннее","correct":false,"feedback":"Такой результат предсказывает модель перетягивания: динеин больше не противодействует кинезину. По модели согласованного переключения ослабление одного мотора ослабляет и другой."},{"id":"S2-L04-2","text":"Пробеги к плюс-концу стали реже","correct":true,"feedback":"Если моторы противоположных направлений нужны друг другу, подавление динеина снижает движение и к минус-, и к плюс-концу."},{"id":"S2-L04-3","text":"Пробеги к плюс-концу не изменились","correct":false,"feedback":"Неизменный перенос к плюс-концу означал бы, что моторы независимы. Обе модели предсказывают изменение, но разного знака."}]},"widget":{"kind":"q1bidir","title":"","s":{"title":"Две гипотезы двунаправленного движения","status":"Расчёт по модели практикума, учебные величины","hyp_label":"Гипотеза","hyps":["перетягивание","согласованное переключение"],"dyn_label":"Динеин","dyns":["норма","снижен"],"ant":"к окончанию аксона","ret":"к телу нейрона","unit":"путь всех митохондрий участка, мкм/мин","mot":"сдвинулись за 10 мин","legend":"Пунктирная черта — значение в норме.","notes":[["Норма: моторы обоих направлений работают, путь к окончанию больше, чем к телу нейрона.","Перетягивание: динеин ослаблен и слабее противодействует кинезину-1, поэтому кинезин-1 переносит митохондрии к окончанию дальше, чем в норме."],["Норма: моторы обоих направлений работают, путь к окончанию больше, чем к телу нейрона.","Согласованное переключение: при сниженной активности динеина митохондрия реже становится подвижной, и путь сокращается в обе стороны."]]}},"section":0,"number":4,"question":1},{"id":"stop-anchor","questions":[1],"title":"Как митохондрия останавливается у активного синапса","keywords":["Miro","EF-мотив","Ca²⁺","синтафилин","закрепление","аксон","синапс","доля подвижных митохондрий"],"lead":["Распределение органелл задаёт не только перенос, но и остановка и закрепление.","В аксоне митохондрия останавливается там, где повышена концентрация Ca²⁺, и закрепляется синтафилином."],"mechanism":["Ca²⁺ связывается с [[T19|EF-мотивами]] Miro, и кинезин-1 перестаёт перемещать митохондрию.","[[T18|Синтафилин]] закрепляет митохондрию на микротрубочке и подавляет кинезин-1.","Без синтафилина доля подвижных митохондрий растёт примерно вдвое, а остановка при активности исчезает."],"paragraphs":["Около трети митохондрий аксона в культуре подвижны, остальные неподвижны (Kang 2008). Остановка — не простое прекращение движения: груз закрепляется якорными белками, связывающими его с цитоскелетом. Поэтому распределение органелл — результат трёх регулируемых процессов: активации моторов, согласования моторов противоположных направлений и закрепления.","В участке аксона с активным синапсом концентрация Ca²⁺ повышена. Ca²⁺ связывается с двумя EF-мотивами Miro, и движение митохондрии в обе стороны прекращается. По данным Wang и Schwarz (2009), Miro, связавший Ca²⁺, взаимодействует с моторным доменом кинезина-1 и не даёт ему связаться с микротрубочкой; по данным Macaskill и соавт. (2009), кинезин отделяется от митохондрии. Замены в EF-мотивах, устраняющие связывание Ca²⁺, сохраняют движение, но устраняют остановку при стимуляции глутаматом (нейроны гиппокампа крысы).","Закрепление обеспечивает синтафилин — белок наружной мембраны митохондрий аксона. В нейронах гиппокампа мышей без гена Snph доля подвижных митохондрий выросла примерно с трети до трёх четвертей (Kang 2008), а остановка митохондрий при активности нейрона исчезла (Chen и Sheng 2013). Синтафилин закрепляет органеллу на микротрубочке и, связываясь с кинезином-1, подавляет его АТФазную активность, то есть останавливает мотор.","Механизм имеет физиологический смысл: митохондрия задерживается там, где расход ATP и поступление Ca²⁺ наибольшие. На схеме показана кимограмма модели практикума; доли подвижных митохондрий в ней подобраны по данным Kang 2008, остальные числа условны."],"trap":["Чтобы остановить митохондрию у синапса, достаточно Ca²⁺-сенсора Miro.","В экспериментах на нейронах мыши без синтафилина митохондрии продолжали двигаться при активности: для остановки нужны и Ca²⁺-сенсор Miro, и якорный белок синтафилин."],"conditions":"Wang и Schwarz 2009, Macaskill 2009 — нейроны гиппокампа крысы в культуре, замены в EF-мотивах Miro, глутамат или активность. Kang 2008 — нейроны гиппокампа мышей Snph⁻/⁻ в культуре: доля подвижных митохондрий около трети в норме и около трёх четвертей без синтафилина. Chen и Sheng 2013 — нейроны мышей Snph⁻/⁻, остановка при активности. Кимограмма и числа схемы — модель практикума (вопрос 1, продвинутый уровень).","sources":["Wang2009","Macaskill2009","Kang2008","Chen2013","Misgeld2017"],"quiz":{"id":"S2-L05","question":"Нейроны с белком Miro, у которого заменами в EF-мотивах устранено связывание Ca²⁺, стимулировали глутаматом. Как изменится движение митохондрий в аксоне?","options":[{"id":"S2-L05-1","text":"Митохондрии продолжат двигаться, остановки не будет","correct":true,"feedback":"Без связывания Ca²⁺ Miro не останавливает кинезин-1, поэтому митохондрии продолжают двигаться при повышении Ca²⁺ (Wang и Schwarz 2009; Macaskill 2009)."},{"id":"S2-L05-2","text":"Митохондрии остановятся быстрее, чем в норме","correct":false,"feedback":"Замены в EF-мотивах не усиливают Ca²⁺-зависимую остановку, а устраняют её: Miro перестаёт связывать Ca²⁺."},{"id":"S2-L05-3","text":"Митохондрии перестанут двигаться и без глутамата","correct":false,"feedback":"Miro без связывания Ca²⁺ по-прежнему соединяет митохондрию с кинезином-1, и в покое митохондрии движутся как в норме."}]},"widget":{"kind":"q1axon","title":"","s":{"title":"Кимограмма митохондрий в аксоне","status":"Учебная модель (та же, что в практикуме); доли подвижных подобраны по Kang 2008","mode_label":"Условия","modes":["норма","норма + активность синапса","Miro без связывания Ca²⁺ + активность","без синтафилина","без синтафилина + активность"],"y":"время, мин","x":"положение в участке аксона, мкм","zone":"зона синапса","legend":"Границы участка в расчёте периодические: митохондрия, вышедшая за один край, возвращается с другого. Это условный участок длинного аксона, а не путь от тела нейрона до окончания.","m_mot":"Подвижные митохондрии","m_zone":"Неподвижных в зоне синапса (начало → конец)","notes":["В покое около трети митохондрий сдвигается за запись; остальные закреплены.","Активность синапса повышает Ca²⁺: проходящие через зону митохондрии останавливаются (вертикальные линии в зоне).","Miro не связывает Ca²⁺: митохондрии проходят мимо активного синапса, не задерживаясь.","Без синтафилина закрепление редкое: подвижных митохондрий примерно вдвое больше.","Без синтафилина активность синапса почти не добавляет остановок."]}},"section":0,"number":5,"question":1},{"id":"positioning","questions":[1],"title":"Как положение органеллы влияет на её функцию","keywords":["позиционирование лизосом","mTORC1","среда без питательных веществ","локальная трансляция","аксональный транспорт","KIF5A","KIF1A","наследственная спастическая параплегия"],"lead":["Положение органеллы — не сопутствующее явление, а способ регуляции: один и тот же набор белков даёт разный результат в зависимости от того, куда его перенесли.","Нарушение транспорта сильнее всего сказывается на самых длинных отростках."],"mechanism":["В полной среде лизосомы смещаются к периферии, в среде без питательных веществ собираются вблизи ядра ([[T26|позиционирование лизосом]]).","Периферическое положение лизосом связано с активностью mTORC1, перинуклеарное — с её снижением и слиянием с автофагосомами.","Мутации моторных доменов KIF5A и KIF1A вызывают [[T28|наследственную спастическую параплегию]] с поражением длинных аксонов."],"paragraphs":["Лизосомы в клетках HeLa меняют положение в зависимости от питания: в полной среде они распределены по периферии, а в среде без питательных веществ собираются вблизи ядра; перинуклеарное скопление в этих экспериментах было связано с изменением внутриклеточного pH. Активность mTORC1 коррелировала с его присутствием на периферических лизосомах, а положение лизосом влияло и на образование автофагосом, и на скорость их слияния с лизосомами (Korolchuk 2011). Так перемещение органеллы становится частью регуляции питания клетки.","Нейрон — предельный случай задачи распределения: длина аксона у человека достигает десятков сантиметров, а потребность в ATP и в связывании Ca²⁺ неодинакова по его длине. Остановка митохондрии у активного синапса обеспечивает такое распределение локально, без участия ядра (шаг об остановке и закреплении).","Часть мРНК переносится в составе рибонуклеопротеиновых частиц в отростки нейрона и транслируется там по местному сигналу ([[T27|локальная трансляция]]). Доставка мРНК с последующим местным синтезом позволяет изменить белковый состав удалённого участка, не дожидаясь доставки готового белка из тела клетки (обзор Holt 2019).","Медицинское значение транспорта показывают генетические данные. Замена в моторном домене KIF5A найдена у семьи с наследственной спастической параплегией SPG10 (Reid 2002), замена в моторном домене KIF1A — у семьи с наследственной спастической параплегией (Erlich 2011). Гены KIF5A и KIF1A экспрессируются во многих типах клеток, но поражаются прежде всего самые длинные аксоны; авторы связывают это с нарушением аксонального транспорта."],"trap":["Лизосомы распределены в клетке случайно, и их положение не влияет на сигналы.","Положение лизосом меняется с питанием и связано с активностью mTORC1 и аутофагией (Korolchuk 2011); перемещение органеллы меняет её функцию."],"conditions":"Korolchuk 2011 — клетки HeLa, полная среда и три протокола голодания (в том числе 5 ч без сыворотки и аминокислот), положение лизосом, mTORC1 и аутофагия; перинуклеарное скопление лизосом при голодании связано с изменением внутриклеточного pH. Локальная трансляция — обзор Holt, Martin и Schuman 2019. Генетика: Reid 2002 (KIF5A, SPG10, одна семья), Erlich 2011 (KIF1A, одна семья) — связь мутации с поражением длинных аксонов предложена авторами как объяснение. Схема — схема механизма без чисел.","sources":["Korolchuk2011","Holt2019","Reid2002","Erlich2011","Misgeld2017"],"quiz":{"id":"S2-L06","question":"Клетки HeLa перевели из полной среды в среду без питательных веществ. Как изменится положение лизосом?","options":[{"id":"S2-L06-1","text":"Лизосомы соберутся вблизи ядра","correct":true,"feedback":"В среде без питательных веществ лизосомы собираются перинуклеарно; это связано со снижением активности mTORC1 и сближением лизосом с автофагосомами (Korolchuk 2011)."},{"id":"S2-L06-2","text":"Лизосомы сместятся к периферии","correct":false,"feedback":"Периферическое положение характерно для обилия питательных веществ, когда mTORC1 активен на лизосомах."},{"id":"S2-L06-3","text":"Положение лизосом не изменится","correct":false,"feedback":"Положение лизосом зависит от условий питания; именно поэтому его рассматривают как способ регуляции."}]},"widget":{"kind":"q1pos","title":"","s":{"title":"Положение лизосом и сигнал mTORC1","status":"Схема по данным Korolchuk 2011 (клетки HeLa), без чисел","mode_label":"Среда","modes":["полная среда","без питательных веществ"],"nuc":"ядро","pm":"плазматическая мембрана","lys":"лизосома","mt":"mTORC1 активен","ap":"автофагосома","notes":["Лизосомы распределены по периферии; на них активен mTORC1.","Лизосомы собраны вблизи ядра; активность mTORC1 снижена, лизосомы чаще сливаются с автофагосомами."]}},"section":0,"number":6,"question":1},{"id":"kymograph","questions":[1],"title":"Как измерить направление транспорта и доказать роль мотора","keywords":["кимограмма","EB3","нокодазол","латрункулин","химически индуцируемая димеризация","рапалог","необходимость","достаточность"],"lead":["Утверждение «груз движется к периферии» требует измерения, а не предположения.","Необходимость мотора показывают его удалением, достаточность — искусственным присоединением мотора к грузу."],"mechanism":["[[T23|Кимограмма]] превращает прижизненную съёмку в рисунок: наклон линии даёт скорость и направление, вертикаль — остановку.","Ориентацию треков в той же клетке определяют по движению [[T24|маркеров плюс-концов]] (EB3).","[[T25|Химически индуцируемая димеризация]] присоединяет выбранный мотор к выбранному грузу и проверяет достаточность мотора."],"paragraphs":["Базовый приём — прижизненная съёмка с построением кимограммы. Вдоль выбранного участка (например, аксона) проводят линию и для каждого кадра записывают интенсивность вдоль неё; кадры укладывают друг под другом. По горизонтали откладывается положение, по вертикали — время: неподвижный груз даёт вертикальную линию, движущийся — наклонную; наклон даёт скорость, сторона наклона — направление. Так же измеряют долю времени в движении и в остановках.","Направление имеет смысл только относительно известной ориентации треков, поэтому в той же клетке определяют полярность микротрубочек — по движению белков, связывающихся с растущими плюс-концами, например EB3-GFP (Stepanova 2003). Без этого контроля вывод о том, какой мотор задействован, сделать нельзя.","Причинность проверяют вмешательством. [[T07|Нокодазол]] вызывает разборку микротрубочек, латрункулин A препятствует полимеризации актина; остановка груза показывает, что движение зависит от трека, но не указывает мотор. Удаление конкретного мотора или адаптера проверяет его необходимость; при этом нужно помнить о взаимной зависимости моторов (шаг о двунаправленном движении).","Наиболее прямой приём — искусственное присоединение мотора к грузу. Белок FKBP прикрепляют к грузу (например, к пероксисоме), а фрагмент FRB — к мотору; добавленный рапалог связывает их. Если груз сразу начинает двигаться в предсказанную сторону, доказана достаточность мотора (Kapitein 2010). Так, N-концевой фрагмент адаптера BICD2, прикреплённый к пероксисомам, вызывал их перенос динеином к минус-концам (Hoogenraad 2003)."],"trap":["Если нокодазол остановил груз, значит, груз переносит кинезин.","Нокодазол разрушает трек для всех моторов микротрубочек. Он показывает зависимость от микротрубочек, но не указывает, какой мотор участвует."],"conditions":"Кимограмма и проверка направления — схема метода. EB3-GFP — Stepanova 2003, нейроны мыши. Индуцируемое присоединение моторов к пероксисомам (FKBP — рапалог — FRB) — Kapitein 2010 (клетки млекопитающих в культуре); BICD2-N на пероксисомах и митохондриях — Hoogenraad 2003. Схемы — схемы методов, без чисел.","sources":["Stepanova2003","Kapitein2010","Hoogenraad2003"],"quiz":{"id":"S2-L07","question":"К пероксисомам в клетке с центросомой рапалогом присоединили активный фрагмент кинезина. Что покажет эксперимент, если пероксисомы за минуты соберутся на периферии?","options":[{"id":"S2-L07-1","text":"Что этот кинезин необходим для движения пероксисом в норме","correct":false,"feedback":"Необходимость проверяют удалением мотора. Присоединение показывает, что мотор может сам перенести груз, но не то, что груз в норме переносит именно он."},{"id":"S2-L07-2","text":"Что этого мотора достаточно, чтобы перенести груз к периферии","correct":true,"feedback":"Искусственное присоединение проверяет достаточность: одного выбранного мотора хватает, чтобы перенести груз в сторону плюс-концов (Kapitein 2010)."},{"id":"S2-L07-3","text":"Что в клетке нет динеина, способного перенести груз к центру","correct":false,"feedback":"Эксперимент ничего не говорит о динеине клетки: он показывает лишь, что присоединённого кинезина хватает для переноса к периферии."}]},"widget":{"kind":"method","title":"","s":{"title":"Методы: направление транспорта и роль мотора","status":"Схемы методов","modes_label":"Метод","modes":["Кимограмма","Ориентация треков (EB3)","Нокодазол и латрункулин","Присоединение мотора к грузу"],"schemes":[{"draw":"q1kymo","h":290,"l":{"pA":"А","a":"Кадры съёмки","pB":"Б","b":"Кимограмма","t":"время","x":"положение вдоль линии","still":"неподвижен","plus":"вправо","minus":"влево","frames":"кадр"},"note":"Каждая линия кимограммы — один объект. Вертикальная линия — объект неподвижен; наклонная — движется вправо или влево вдоль линии; чем положе линия, тем выше скорость.","legend":"Направление на кимограмме «вправо» или «влево» переводят в «к плюс-концу» или «к минус-концу» только после определения ориентации треков."},{"draw":"q1eb3","h":285,"l":{"pA":"А","a":"Аксон","pB":"Б","b":"Дендрит","soma":"тело","comet":"метка EB3 на растущем плюс-конце","res_a":"почти все метки движутся к окончанию","res_b":"метки движутся в обе стороны"},"note":"EB3 связывается с растущими плюс-концами, поэтому направление движения меток показывает, куда обращены плюс-концы в данном участке.","legend":"Метод показывает ориентацию растущих микротрубочек; стабильные микротрубочки без роста метку не несут."},{"draw":"table","head":["Воздействие","Что разрушает","Что показывает","Чего не показывает"],"rows":[["нокодазол","микротрубочки","движение зависит от микротрубочек","какой мотор участвует: останавливаются и кинезины, и динеин"],["латрункулин A","актиновые филаменты (препятствует полимеризации)","движение зависит от актина","какой миозин участвует; меняется и форма клетки"],["удаление мотора или адаптера","один белок","необходимость белка","достаточность; при взаимной зависимости страдают оба направления"]],"note":"Разрушение трека — грубое вмешательство: оно останавливает всё, что по треку движется."},{"draw":"q1recruit","h":300,"l":{"pA":"А","a":"До рапалога","pB":"Б","b":"После рапалога","px":"пероксисома","fkbp":"FKBP","frb":"FRB","mot":"мотор","rap":"рапалог","res_a":"пероксисомы распределены случайно","res_b":"пероксисомы перенесены к плюс-концам","cs":"центросома"},"note":"Рапалог связывает FKBP на грузе и FRB на моторе: мотор оказывается на выбранном грузе. Быстрое перераспределение груза доказывает достаточность мотора.","legend":"Эксперимент проверяет достаточность, а не необходимость: он не говорит, какой мотор переносит этот груз в норме."}]}},"section":0,"number":7,"question":1},{"id":"balance","questions":[2],"title":"Почему форма сети митохондрий — стационарное состояние двух процессов","keywords":["слияние","деление","сеть митохондрий","морфология","стационарное состояние","фрагментация","баланс"],"lead":["Число митохондрий и их длину не задаёт ни синтез, ни разрушение: их задают два непрерывно идущих противоположных процесса — [[T30|слияние]] и [[T31|деление]].","В учебной модели форму сети приближённо задаёт отношение констант скоростей слияния и деления, пока оба процесса идут намного быстрее роста клеток; частота событий зависит ещё и от самих констант и от числа органелл."],"mechanism":["Деление дробит сеть на более короткие органеллы, слияние объединяет их; оба процесса идут постоянно, даже когда картина не меняется.","Неизменная картина — [[T06|стационарное состояние]]: за минуту делением возникает почти столько же органелл, сколько исчезает при слиянии; небольшой избыток делений восполняет разбавление сети при росте клеток.","Одна и та же картина получается при разных константах: подавление слияния и усиление деления дают одинаковую фрагментацию."],"paragraphs":["В живой клетке митохондрии постоянно сливаются друг с другом и делятся. Поэтому то, что мы видим на снимке, — короткие отдельные органеллы или протяжённая разветвлённая сеть, — не постоянное свойство органеллы, а результат двух противоположных потоков. Пока делений происходит почти столько же, сколько слияний, число органелл и их средняя длина не меняются, хотя каждая митохондрия за несколько минут успевает и слиться, и разделиться.","Из этого следует главное правило вопроса. Пока оба процесса идут намного быстрее роста клеток, форму сети задаёт отношение констант скоростей: если слияние ослабить вдвое, то, пока сеть перестраивается, делений больше, чем слияний, органелл становится больше, и средняя длина в учебной модели падает с 4,4 до 2,5 мкм. Ровно ту же картину даёт усиление деления вдвое при неизменном слиянии. А если замедлить вдвое оба процесса сразу, средняя длина почти не изменится, хотя событий слияния и деления станет вдвое меньше: клетки с сильно сниженными скоростями обоих процессов могут сохранять трубчатую сеть, если эти скорости уравновешены (Chen 2005, со ссылкой на Chen 2003). В новом стационарном состоянии деления снова почти уравновешивают слияния, поэтому по снимку нельзя установить и текущую разность частот. Близкое наблюдение есть и в экспериментах на дрожжах: у большинства двойных мутантов dnm1 fzo1, полученных скрещиванием, митохондрии трубчатые, как в норме; при последовательном удалении генов чаще сохранялась картина, сложившаяся до удаления второго гена (Sesaki и Jensen 1999).","Поэтому одна и та же морфология сети совместима с разными механизмами: по одному снимку нельзя сказать, какая машина изменена и изменена ли какая-либо из них вообще. Кроме того, на картину влияют образование новых митохондрий, их удаление аутофагией, подвижность органелл и контакты с другими структурами (Giacomello 2020). Чтобы судить о механизме, измеряют не только форму, но и сами процессы — частоту событий слияния и деления, обмен содержимым между органеллами; об этом шаг «Как узнать, какая машина изменена».","Меняйте константы на схеме: учебная модель показывает, как их отношение задаёт число органелл, а сами константы вместе с числом органелл — число событий в минуту. Каждое положение ползунков — стационарное состояние, которое установилось бы после долгого ожидания; при очень малых константах заметна заданная в модели поправка на рост клеток. Если остановить обе машины, стационарного состояния нет, и модель сохраняет последнее рассчитанное состояние."],"trap":["Фрагментированная сеть означает, что в клетке усилено деление митохондрий.","Та же фрагментация возникает при ослабленном слиянии. Форма сети отражает отношение констант двух процессов, поэтому вывод о том, какой процесс изменён, требует измерения самих событий."],"conditions":"Схема — учебная модель практикума (вопрос 2, базовый уровень): общая длина сети 120 мкм постоянна, частота делений пропорциональна длине сети, частота слияний — числу органелл; константы условные; каждое положение ползунков — стационарное состояние, переходы во времени не рассчитываются; поправка на рост клеток g = 0,0006 мин⁻¹ существенна при очень малых константах (в практикуме, где ползунки идут с шагом 1 %, при одинаковом положении обоих ползунков на 1, 2 и 50 % средняя длина — 6,7; 5,5 и 4,4 мкм; на этой схеме при 5 % — 4,8 мкм); при нулевых константах обоих процессов модель сохраняет последнее рассчитанное состояние. Двойные мутанты dnm1 fzo1 и зависимость их картины от порядка удаления генов — Sesaki и Jensen 1999 (дрожжи). Многофакторность морфологии — обзор Giacomello 2020.","sources":["Giacomello2020","Sesaki1999","Chen2005","Chen2003"],"quiz":{"id":"S2-L08","rev":2,"question":"После воздействия на культуру клеток доля клеток с фрагментированной сетью митохондрий выросла с 20 до 60 %. Какой вывод из этого наблюдения правомерен?","options":[{"id":"S2-L08-1","text":"В клетках усилено деление митохондрий","correct":false,"feedback":"Это один из возможных механизмов, но не единственный: ту же картину даёт и ослабление слияния. Чтобы выбрать между ними, нужно измерить сами события."},{"id":"S2-L08-2","text":"Картина совместима и с усилением деления, и с ослаблением слияния","correct":true,"feedback":"Оба изменения приводят к фрагментации. По доле клеток с короткими митохондриями нельзя установить ни причину, ни текущую разность частот событий: после перестройки сети деления и слияния снова почти уравновешены. Нужно измерить сами события и учесть образование и удаление митохондрий (Giacomello 2020)."},{"id":"S2-L08-3","text":"В клетках нарушено слияние митохондрий","correct":false,"feedback":"Ослабленное слияние — лишь одна из возможных причин. Тот же результат даёт усиленное деление при нормальном слиянии."}]},"widget":{"kind":"q2balance","title":"","s":{"title":"Баланс слияния и деления","status":"Учебная модель, условные величины (та же, что в практикуме)","fus":"Константа слияния, % от максимума","fis":"Константа деления, % от максимума","net":"Сеть клетки (120 мкм), разделённая на органеллы","m_n":"Число митохондрий","m_L":"Средняя длина, мкм","m_ev":"Событий в минуту: слияния / деления","cls":{"frag":"Сеть фрагментирована.","mid":"Короткие и средние митохондрии.","long":"Протяжённая сеть."},"note_tpl":"{cls} Пока оба процесса идут намного быстрее роста клеток, число органелл задаётся почти только отношением констант слияния и деления, а число событий в минуту — ещё и самими константами.","note_slow":"{cls} Деления в минуту заметно превышают слияния: они восполняют ещё и заданное в модели разбавление сети при росте клеток, поэтому число органелл зависит уже не только от отношения констант.","note_nofis":"Деления нет: все митохондрии клетки сливаются в одну связную сеть, и событий слияния больше не происходит, потому что сливаться не с чем.","note_nofus":"Слияния нет: деление дробит сеть на мелкие фрагменты, и митохондрии больше не обмениваются содержимым.","note_stop":"Обе машины остановлены: событий нет. Модель сохраняет последнее рассчитанное состояние сети; оно зависит от того, в каком порядке были остановлены процессы. Каждое ненулевое положение ползунков показывает стационарное состояние, переходы между ними во времени здесь не рассчитываются.","legend":"Положение 50 % у обоих ползунков — норма. Модель не учитывает образование новых митохондрий и их удаление аутофагией."}},"section":1,"number":8,"question":2},{"id":"fusion","questions":[2],"title":"Как сливаются две мембраны митохондрии и почему деполяризованная органелла не сливается","keywords":["MFN1","MFN2","митофузины","OPA1","L-OPA1","S-OPA1","OMA1","YME1L","слияние","внутренняя мембрана","кардиолипин","сближение мембран","тетеринг","гемифузия"],"lead":["У митохондрии две мембраны, и сливают их две разные машины: наружные — [[T32|митофузины]] MFN1 и MFN2, внутренние — [[T33|OPA1]] вместе с кардиолипином. Слияние идёт по шагам: сначала мембраны сближаются, затем сливаются наружные, затем внутренние, и только после этого объединяется матрикс.","Длинная форма OPA1 нужна для слияния внутренних мембран; при потере потенциала протеаза OMA1 расщепляет её, и органелла перестаёт сливаться."],"mechanism":["Митофузины на двух соседних митохондриях связываются друг с другом (в trans) и удерживают наружные мембраны рядом: это сближение, но не слияние. Затем, по данным на митохондриях дрожжей in vitro, гидролиз GTP переводит контакт в слияние, и наружные мембраны становятся одной непрерывной мембраной.","По данным реконструкции in vitro, длинная форма OPA1 вместе с кардиолипином сначала сближает внутренние мембраны, а гидролиз GTP запускает их слияние; только после этого матриксы двух органелл объединяются.","При потере мембранного потенциала активируется протеаза OMA1 и расщепляет длинную форму OPA1: слияние внутренних мембран прекращается. Сам потенциал мембраны не сближает; связь идёт через протеолиз."],"paragraphs":["Слияние митохондрий идёт в несколько стадий, потому что у органеллы две мембраны и две разные машины. Стадии надо различать. [[T95|Сближение, или тетеринг]], — это удержание двух целых мембран на малом расстоянии: бислои остаются раздельными, содержимое не смешивается. Слияние — перестройка, после которой липидный бислой двух мембран становится непрерывным, а содержимое, ограниченное этой мембраной, может смешиваться. Между ними в общей теории слияния выделяют гемифузию, когда соединены только обращённые друг к другу листки бислоёв; для митофузинов и OPA1 это состояние в источниках шага не разобрано, поэтому на схеме оно не показано. Наружные и внутренние мембраны сливаются раздельными стадиями, которые можно разобщить (см. ниже).","Сближение и слияние наружных мембран выполняют митофузины MFN1 и MFN2 — ГТФазы наружной мембраны. Митофузин нужен на обеих соседних митохондриях: участки HR2 двух молекул образуют антипараллельную двойную спираль, концы которой с трансмембранными сегментами лежат в разных мембранах, поэтому такой димер связывает органеллы ещё до слияния (Koshiba 2004). Дальше процесс зависит от гидролиза GTP: на изолированных митохондриях дрожжей методом электронной криотомографии показано, что циклы гидролиза GTP постепенно собирают вокруг области контакта кольцо из белков (docking ring), а последующий гидролиз запускает слияние наружной мембраны на периферии области контакта (Brandt 2016). Эти данные получены на дрожжевых митофузинах in vitro; для клеток млекопитающих такая последовательность служит моделью. Митофузины частично заменяют друг друга: в эмбриональных фибробластах мыши без одного из них слияние резко ослаблено и сеть фрагментирована у большинства клеток (Chen 2003), а без обоих не идёт слияние ни наружных, ни внутренних мембран, и сеть распадается на мелкие фрагменты (Chen 2005; Song 2009).","Внутренние мембраны сливает OPA1 — ГТФаза внутренней мембраны, действующая вместе с кардиолипином, липидом, характерным для внутренней мембраны митохондрий. В реконструкции in vitro с очищенным человеческим L-OPA1 было достаточно, чтобы L-OPA1 находился в одной мембране, а кардиолипин — в противоположной: связывание L-OPA1 с кардиолипином, не требующее GTP, сначала удерживает мембраны рядом, а затем гидролиз GTP запускает слияние; эту реакцию может изменять присутствие S-OPA1 (Ban 2017). Это минимальная система in vitro, и выводы о клетке по ней делают с оговоркой. В клетках OPA1 не нужен одновременно на обеих соседних митохондриях, в отличие от митофузинов (Song 2009); это согласуется с моделью, в которой достаточно L-OPA1 на одной из двух мембран, но само по себе её не доказывает. OPA1 существует в двух формах: [[T34|длинная (L-OPA1)]] закреплена в мембране, короткая (S-OPA1) образуется при её расщеплении протеазами OMA1 и YME1L. В клетках, где обе протеазы удалены и короткой формы нет, митохондрии сливаются нормально: для слияния достаточно длинной формы (Anand 2014). Раньше при экспрессии отдельных форм в клетках без OPA1 слияние восстанавливала только смесь длинных и коротких форм (Song 2007); эти данные пока не согласованы. В клетках без гена OPA1 наружные мембраны соседних митохондрий сливаются, а внутренние — нет: митохондрии часто содержат несколько матриксных компартментов под общей наружной мембраной (Song 2009); при подавлении OPA1 малыми РНК в гибридах клеток не сливались и наружные мембраны (Chen 2005), так что данные о наружных мембранах расходятся.","Принципиально важна связь слияния с состоянием органеллы. Мембранный потенциал сам не сближает мембраны и не удерживает их порознь: связь идёт через протеолиз. При потере потенциала или ATP активируется [[T35|протеаза OMA1]] и расщепляет почти всю длинную форму OPA1 (Head 2009, Ehses 2009). Поэтому, как предполагают, деполяризованная митохондрия не может слить внутреннюю мембрану со здоровой сетью и не смешивает с ней свой матрикс. Протонофор [[T39|CCCP]], снимающий [[T09|потенциал]], одновременно прекращает слияние и сдвигает баланс к делению; саму фрагментацию выполняет DRP1. В клетках HeLa с подавленной OMA1 сеть после CCCP всё равно распадалась, но после отмывания протонофора восстанавливалась быстрее (Head 2009).","Переключайте стадии на схеме: видно, какая машина и какое состояние мембран соответствуют каждому шагу — от сближения до общего матрикса — и где цепочку обрывает OMA1."],"trap":["Для слияния митохондрий достаточно митофузинов наружной мембраны.","Митофузины сближают и сливают только наружные мембраны. Внутренние сливает OPA1; без неё наружные мембраны могут слиться (Song 2009), а матриксы двух органелл остаются раздельными, и обмен содержимым не происходит."],"conditions":"Схема механизма: порядок стадий обобщён по данным разных систем и не наблюдался целиком в одной из них. Тетеринг митофузинов — структура фрагмента HR2 и митохондрии в клетках (Koshiba 2004, по реферату). Docking ring и слияние наружной мембраны — изолированные митохондрии Saccharomyces cerevisiae in vitro, электронная криотомография (Brandt 2016, по реферату). Слияние внутренних мембран — реконструкция с очищенным человеческим L-OPA1, полученным в клетках шелкопряда, и липосомами; в клетках млекопитающих этот механизм прямо не воспроизведён (Ban 2017, по реферату; полный текст не проверялся). Эксперименты на эмбриональных фибробластах мыши: Mfn1⁻/⁻ и Mfn2⁻/⁻ (Chen 2003 — гибриды клеток, полученные с помощью полиэтиленгликоля, через 7 ч), Mfn1⁻/⁻ Mfn2⁻/⁻ (Chen 2005), клетки без OPA1 (Song 2007; раздельное слияние мембран — Song 2009), без YME1L и OMA1 (Anand 2014 — обмен матриксным фотоактивируемым GFP за 60 мин). Индуцируемое расщепление OPA1 протеазой OMA1 — клетки HeLa, 10 мкМ CCCP, 30 мин, подавление OMA1 малыми интерферирующими РНК (Head 2009); эмбриональные фибробласты мыши, CCCP и олигомицин, снижение OMA1 стабилизировало длинные формы (Ehses 2009, рис. 7).","sources":["Chen2003","Chen2005","Song2007","Song2009","Anand2014","Head2009","Ehses2009","Koshiba2004","Brandt2016","Ban2017"],"quiz":{"id":"S2-L09","question":"В клетках дикого типа митохондрии деполяризовали протонофором CCCP. Почему они перестают сливаться с соседними органеллами?","options":[{"id":"S2-L09-1","text":"Протеаза OMA1 расщепляет длинную форму OPA1","correct":true,"feedback":"При потере потенциала активируется OMA1 и переводит длинную форму OPA1 в короткую. Без длинной формы внутренние мембраны не сливаются."},{"id":"S2-L09-2","text":"CCCP разрушает митофузины наружной мембраны","correct":false,"feedback":"CCCP переносит протоны через внутреннюю мембрану и снимает потенциал; митофузины он не разрушает. Слияние останавливается из-за расщепления OPA1 протеазой OMA1."},{"id":"S2-L09-3","text":"Без потенциала DRP1 перестаёт работать","correct":false,"feedback":"DRP1 — машина деления, а не слияния, и при деполяризации её на мембране становится скорее больше. Слияние прекращается потому, что OMA1 расщепляет длинную форму OPA1."}]},"widget":{"kind":"net","title":"","s":{"title":"Слияние двух мембран митохондрии","status":"Схема механизма: стадии обобщены по данным разных систем","modes_label":"Этап","modes":["две органеллы","сближение мембран","слияние наружных мембран","слияние внутренних мембран","потеря потенциала: OMA1"],"h":278,"w":640,"areas":[{"kind":"label","x":14,"y":24,"label":"машина"},{"kind":"label","x":290,"y":24,"label":"состояние двух органелл"}],"nodes":[{"id":"mfn","x":16,"y":40,"w":172,"h":52,"label":"MFN1/MFN2\nна обеих органеллах","fs":13,"not":[4]},{"id":"opa","x":16,"y":124,"w":172,"h":52,"label":"L-OPA1 и\nкардиолипин","fs":13},{"id":"oma","x":16,"y":208,"w":172,"h":52,"label":"OMA1","fs":13},{"id":"o0","x":290,"y":40,"w":334,"h":52,"label":"наружные мембраны раздельны","fs":13,"only":[0]},{"id":"o1","x":290,"y":40,"w":334,"h":52,"label":"наружные мембраны сближены:\nмежду ними остаётся зазор","fs":13,"only":[1]},{"id":"o2","x":290,"y":40,"w":334,"h":52,"label":"наружные мембраны слились:\nодна непрерывная мембрана","fs":13,"only":[2,3]},{"id":"i0","x":290,"y":124,"w":334,"h":52,"label":"внутренние мембраны раздельны","fs":13,"only":[0,1,2,4]},{"id":"i3","x":290,"y":124,"w":334,"h":52,"label":"внутренние мембраны слились:\nодна непрерывная мембрана","fs":13,"only":[3]},{"id":"x0","x":290,"y":208,"w":334,"h":52,"label":"матриксы раздельны","fs":13,"only":[0,1,2,4]},{"id":"x3","x":290,"y":208,"w":334,"h":52,"label":"общий матрикс:\nсодержимое смешивается","fs":13,"only":[3]}],"edges":[{"id":"e1","pts":[190,66,288,66],"type":"act","label":"сближение","lx":239,"ly":56},{"id":"e2","pts":[190,66,288,66],"type":"act","label":"гидролиз GTP","lx":239,"ly":56},{"id":"e3","pts":[190,150,288,150],"type":"act","label":"гидролиз GTP","lx":239,"ly":140},{"id":"e4","pts":[100,208,100,178],"type":"inh","label":"расщепление","lx":150,"ly":196}],"states":[{"on":[],"show":[],"hide":["e1","e2","e3","e4"],"note":"Две соседние митохондрии: машины слияния есть, но мембраны ещё не сближены. Наружные и внутренние мембраны раздельны, матриксы не связаны."},{"on":["mfn","o1"],"show":["e1"],"hide":["e2","e3","e4"],"note":"Сближение (тетеринг): MFN1/MFN2 на двух органеллах связались друг с другом в trans. Мембраны удерживаются рядом, но между ними остаётся зазор, бислои раздельны, содержимое не смешивается."},{"on":["mfn","o2"],"show":["e2"],"hide":["e1","e3","e4"],"note":"Слияние наружных мембран: по данным на дрожжах in vitro, гидролиз GTP митофузинами переводит контакт в слияние, и наружные мембраны становятся одной непрерывной мембраной. Внутренние мембраны и матриксы пока раздельны: так выглядят митохондрии клеток без OPA1, где несколько матриксов лежат под общей наружной мембраной (Song 2009)."},{"on":["opa","i3","x3"],"show":["e3"],"hide":["e1","e2","e4"],"note":"Слияние внутренних мембран: L-OPA1 вместе с кардиолипином сначала удерживает внутренние мембраны рядом (in vitro достаточно L-OPA1 в одной мембране и кардиолипина в противоположной), а гидролиз GTP запускает слияние. Внутренняя мембрана непрерывна, матриксы объединились, белки и метаболиты могут смешиваться (Ban 2017)."},{"on":["oma"],"inh":["opa"],"show":["e4"],"hide":["e1","e2","e3"],"drugs":[[200,236,"CCCP"]],"note":"Потенциал снят: протеаза OMA1 расщепила длинную форму OPA1 до короткой. Сам потенциал мембраны не сближает: слияние внутренних мембран прекращается потому, что исчезает L-OPA1, и матриксы остаются раздельными. Стадии наружных мембран на этой схеме не показаны."}],"legend":"Слева — машина, справа — состояние двух органелл. Порядок стадий собран по данным клеток млекопитающих, дрожжей in vitro и реконструкции с очищенными белками; не все промежуточные стадии показаны в клетке."}},"section":1,"number":9,"question":2},{"id":"fission","questions":[2],"title":"Как DRP1 делит митохондрию и что задаёт место деления","keywords":["DRP1","DNM1L","MFF","FIS1","MiD49","MiD51","деление","ЭПР","актин","фосфорилирование DRP1","Ser616","Ser637"],"lead":["Деление выполняет цитозольная ГТФаза [[T36|DRP1]]: [[T37|рецепторы]] наружной мембраны привлекают её к митохондрии, где она собирается в кольцо и разделяет органеллу.","Место деления заранее размечает трубочка ЭПР, а привлечение и активность DRP1 регулируют число рецепторов и фосфорилирование."],"mechanism":["Трубочка ЭПР охватывает митохондрию в будущем месте деления и сужает её ещё до сборки DRP1; к сужению добавляется полимеризация актина.","Рецепторы MFF, FIS1, MiD49 и MiD51 привлекают DRP1 из цитозоля; DRP1 собирается в кольцо вокруг органеллы и при гидролизе GTP сжимает и разделяет мембраны.","Фосфорилирование DRP1 по Ser616 (CDK1 в митозе) усиливает деление, по Ser637 (PKA) — ослабляет; кальциневрин, дефосфорилируя Ser637, усиливает привлечение DRP1 к митохондриям."],"paragraphs":["Большая часть DRP1 находится в цитозоле. На наружную мембрану митохондрии её привлекают рецепторы — MFF, FIS1, MiD49 и MiD51. В эмбриональных фибробластах мыши без MFF на митохондриях меньше скоплений DRP1 и органеллы удлиняются, но оставшееся деление обеспечивают другие рецепторы, в том числе MiD49 и MiD51 (Losón 2013). На мембране DRP1 собирается в кольцо вокруг органеллы и за счёт гидролиза GTP сжимает её. В экспериментах на мембранных трубочках DRP1 сама и сжимает, и разделяет мембрану (Kamerkar 2018).","Место деления выбирается не случайно. В клетках COS-7 трубочка ЭПР охватывает митохондрию и сужает её в будущей точке деления ещё до появления DRP1 (Friedman 2011); в сужении участвует и полимеризация актина. Позже на тех же клетках и на кардиомиоцитах мыши описаны два типа деления; оба выполняет DRP1 (Kleele 2021). Деление в средней части органеллы идёт с участием ЭПР, актина и MFF и увеличивает число митохондрий. Деление у края, в пределах четверти длины от конца, регулирует FIS1, и ему почти всегда предшествует контакт с лизосомой. Оно отделяет небольшой фрагмент с пониженным мембранным потенциалом и повышенным уровнем активных форм кислорода; около трети таких фрагментов не содержат мтДНК. На фрагменте накапливается белок Parkin, а сам фрагмент направляется на [[T45|митофагию]]; в части случаев его поглощение автофагосомой наблюдали непосредственно. Насколько это разделение универсально, ещё проверяют.","Активность DRP1 регулируется фосфорилированием по двум остаткам с противоположным эффектом. CDK1 в начале митоза фосфорилирует Ser616, и митохондрии фрагментируются перед распределением между дочерними клетками (Taguchi 2007). PKA фосфорилирует Ser637, и деление ослабевает; кальциневрин дефосфорилирует этот остаток при длительном повышении Ca²⁺, и DRP1 переходит на митохондрии (Cribbs и Strack 2007, Cereghetti 2008). Номера остатков приведены для изоформы 1 DRP1 человека; в работах на белке крысы те же остатки обозначены как Ser585 и Ser656.","Переключайте этапы схемы: видно, какой белок вступает на каждом шаге и где действуют киназы."],"trap":["DRP1 постоянно находится на митохондрии и делит её там, где случайно окажется.","Большая часть DRP1 — в цитозоле; на наружную мембрану её привлекают рецепторы, а место деления заранее размечают трубочка ЭПР и актин."],"conditions":"Схема механизма. Рецепторы — эмбриональные фибробласты мыши с удалёнными Mff и Fis1 и с подавленными РНК-интерференцией MiD49 и MiD51; любой из MiD49 и MiD51 поддерживал деление в отсутствие Mff и Fis1 (Losón 2013); разделение мембран одной DRP1 — реконструкция на мембранных трубочках и клетки без динаминов (Kamerkar 2018); трубочки ЭПР — клетки COS-7 и дрожжи (Friedman 2011); два типа деления — Kleele 2021, полный текст: клетки COS-7 (положение деления, ЭПР, актин, лизосомы, Parkin, нуклеоиды), постнатальные кардиомиоциты мыши (бимодальное положение делений, стимуляция изопротеренолом), клетки U2OS с эндогенно меченными MFF и FIS1, эмбриональные фибробласты мыши Mff⁻/⁻ и Fis1⁻/⁻ (нокаут Mff снижает только срединные деления, нокаут Fis1 — только периферические). Ser616 (у крысы Ser585) — клетки HeLa в митозе (Taguchi 2007); Ser637 (у крысы Ser656) — культуры клеток (Cribbs и Strack 2007; Cereghetti 2008 — клетки HeLa).","sources":["Loson2013","Kamerkar2018","Friedman2011","Kleele2021","Taguchi2007","Cribbs2007","Cereghetti2008"],"quiz":{"id":"S2-L10","question":"В клетке повысили активность PKA, и DRP1 фосфорилировалась по Ser637. Как изменится частота деления митохондрий?","options":[{"id":"S2-L10-1","text":"Повысится, как при действии CDK1 в митозе","correct":false,"feedback":"CDK1 фосфорилирует другой остаток — Ser616, и это усиливает деление. Фосфорилирование Ser637 киназой PKA действует в противоположную сторону."},{"id":"S2-L10-2","text":"Снизится, и митохондрии станут длиннее","correct":true,"feedback":"Фосфорилирование Ser637 протеинкиназой A ослабляет деление; сеть смещается в сторону слияния, и митохондрии удлиняются (Cribbs и Strack 2007)."},{"id":"S2-L10-3","text":"Не изменится: важен только рецептор MFF","correct":false,"feedback":"Рецепторы определяют, сколько DRP1 попадёт на мембрану, но активность самой DRP1 зависит и от фосфорилирования: по Ser637 оно ослабляет деление."}]},"widget":{"kind":"net","title":"","s":{"title":"Деление митохондрии: место, рецепторы, кольцо DRP1","status":"Схема механизма","modes_label":"Этап","modes":["покой","трубочка ЭПР размечает место","рецепторы привлекают DRP1","кольцо DRP1 разделяет мембраны","PKA: фосфорилирование Ser637"],"h":250,"w":640,"nodes":[{"id":"er","x":16,"y":60,"w":130,"h":44,"label":"трубочка ЭПР","fs":13},{"id":"rec","x":200,"y":60,"w":150,"h":44,"label":"MFF, FIS1, MiD49/51","fs":12},{"id":"drp","x":200,"y":160,"w":150,"h":44,"label":"DRP1 в цитозоле","fs":12.5},{"id":"ring","x":410,"y":60,"w":130,"h":44,"label":"кольцо DRP1","fs":13},{"id":"two","x":410,"y":160,"w":210,"h":44,"label":"две митохондрии","fs":13},{"id":"pka","x":16,"y":160,"w":130,"h":44,"label":"PKA","fs":13}],"edges":[{"id":"a1","pts":[146,82,198,82],"type":"act","label":"место","lx":172,"ly":50},{"id":"a2","pts":[275,158,275,106],"type":"move","label":"на мембрану","lx":330,"ly":136},{"id":"a3","pts":[350,82,408,82],"type":"act"},{"id":"a4","pts":[475,104,475,158],"type":"act","label":"GTP","lx":500,"ly":134},{"id":"a5","pts":[146,182,198,182],"type":"inh"}],"states":[{"on":[],"show":[],"hide":["a5"],"note":"DRP1 в основном в цитозоле; рецепторы находятся в наружной мембране, деления нет."},{"on":["er"],"show":["a1"],"hide":["a5"],"note":"Трубочка ЭПР охватила митохондрию и сузила её: место деления размечено ещё до привлечения DRP1."},{"on":["er","rec"],"show":["a1","a2"],"hide":["a5"],"note":"Рецепторы наружной мембраны привлекли DRP1 из цитозоля в размеченное место."},{"on":["er","rec","ring","two"],"show":["a1","a2","a3","a4"],"hide":["a5"],"note":"DRP1 собралась в кольцо и при гидролизе GTP сжала и разделила мембраны: из одной митохондрии получились две."},{"on":["pka"],"inh":["drp"],"p":["drp"],"show":["a5"],"note":"PKA фосфорилировала DRP1 по Ser637 (изоформа 1 человека): привлечение DRP1 к митохондриям и деление ослабевают."}]}},"section":1,"number":10,"question":2},{"id":"meaning","questions":[2],"title":"Какие функции выполняют слияние и деление митохондрий","keywords":["комплементация","нуклеоид","мтДНК","гетероплазмия","сегрегация","митофагия","деление и транспорт","TFAM"],"lead":["Слияние объединяет содержимое органелл и позволяет им восполнять недостающие продукты: это [[T43|комплементация]].","Деление отделяет повреждённый участок и делает митохондрии достаточно малыми для транспорта по отростку и для аутофагии."],"mechanism":["После слияния белки, тРНК и метаболиты двух органелл перемешиваются, а молекулы мтДНК остаются в своих [[T42|нуклеоидах]].","При делении дочерние органеллы часто различаются по потенциалу; деполяризованная дочерняя органелла редко сливается снова и удаляется [[T45|митофагией]].","Деление облегчает перенос митохондрий по узкому отростку и их удаление аутофагией, хотя не во всех случаях обязательно для этого."],"paragraphs":["Слияние нужно прежде всего для обмена содержимым. Митохондриальная ДНК упакована в нуклеоиды — компактные белково-нуклеиновые частицы, основной упаковывающий белок которых TFAM. В клетках человека, несущих две разные мутантные мтДНК с непересекающимися делециями, после слияния клеток синтез митохондриальных белков восстановился, хотя каждая мтДНК по отдельности его не обеспечивала. При этом нуклеоиды не обменивались геномами: продукты обоих геномов — тРНК, рРНК и белки — стали общими, а сами молекулы ДНК остались в своих нуклеоидах (Gilkerson 2008). Комплементация — это обмен продуктами, а не перемешивание геномов.","Отсюда понятна [[T44|гетероплазмия]]: если часть копий мтДНК несёт мутацию, нормальные копии восполняют недостающие продукты, и дефект проявляется только при доле мутантных копий выше порога. Порог не универсален: он зависит от варианта мтДНК, ткани и числа копий. Без слияния такая комплементация невозможна, и в клетках без обоих митофузинов часть митохондрий теряет потенциал, а дыхание клеток снижается (Chen 2005).","Деление выполняет противоположную функцию — разделение. В β-клетках поджелудочной железы при делении дочерние органеллы часто различались по потенциалу; дочерняя органелла с пониженным потенциалом и меньшим количеством OPA1 редко сливалась снова и затем удалялась аутофагией, а подавление деления уменьшало удаление митохондрий (Twig 2008). Деление нужно и механически: оно облегчает распределение митохондрий между дочерними клетками, перенос по узкому аксону и поглощение автофагосомой. Однако клетки Drp1⁻/⁻ делятся, хотя и медленнее (Wakabayashi 2009), а митофагия в клетках млекопитающих может идти и без DRP1 (Yamashita 2016). В нейронах мыши без DRP1 митохондрии скапливались в теле клетки и плохо распределялись по отросткам (Ishihara 2009) — это связь с транспортом из вопроса 1.","Переключайте состояния схемы: видно, какие компоненты при слиянии становятся общими и что отделяет деление."],"trap":["При слиянии митохондрий их ДНК смешивается и рекомбинирует, поэтому мутация разбавляется.","Молекулы мтДНК остаются в своих нуклеоидах; общими становятся продукты геномов — тРНК, рРНК и белки. Комплементация — обмен продуктами, а не геномами."],"conditions":"Комплементация без обмена мтДНК — гибриды клеток человека с двумя мтДНК с непересекающимися делециями (Gilkerson 2008). Потеря потенциала и снижение дыхания в клетках без слияния — эмбриональные фибробласты мыши Mfn1⁻/⁻ Mfn2⁻/⁻ (Chen 2005). Неравные дочерние органеллы и удаление аутофагией — β-клетки (линия INS1 и первичные β-клетки мыши; Twig 2008). Распределение митохондрий в отростках — нейроны мыши без DRP1 в культуре (Ishihara 2009). Деление клеток Drp1⁻/⁻ — эмбриональные фибробласты мыши (Wakabayashi 2009); митофагия без DRP1 — клетки HeLa и дрожжи (Yamashita 2016). Схема без чисел.","sources":["Gilkerson2008","Chen2005","Twig2008","Ishihara2009","Stewart2015","Wakabayashi2009","Yamashita2016"],"quiz":{"id":"S2-L11","question":"Слили клетки двух линий человека; в каждой мтДНК несёт свою делецию и сама по себе не обеспечивает синтез митохондриальных белков. Синтез восстановился. Что произошло с мтДНК в митохондриях гибридных клеток?","options":[{"id":"S2-L11-1","text":"Две мтДНК рекомбинировали и дали нормальный геном","correct":false,"feedback":"Рекомбинация не понадобилась: продукты двух геномов восполнили друг друга, а сами молекулы ДНК остались раздельными (Gilkerson 2008)."},{"id":"S2-L11-2","text":"Геномы остались раздельными, продукты стали общими","correct":true,"feedback":"После слияния тРНК, рРНК и белки обоих геномов стали доступны общему матриксу, а нуклеоиды сохранили свою мтДНК — это комплементация без обмена геномами."},{"id":"S2-L11-3","text":"Нуклеоиды обменялись молекулами мтДНК поровну","correct":false,"feedback":"Нуклеоиды не обменивались геномами: в эксперименте каждая мтДНК оставалась в своих нуклеоидах, а восстановление синтеза обеспечили общие продукты."}]},"widget":{"kind":"q2mix","title":"","s":{"title":"Что дают слияние и деление","status":"Схема механизма, без чисел","modes_label":"Состояние","modes":["до слияния","после слияния","неравное деление"],"mA":"митохондрия с мтДНК А","mB":"митохондрия с мтДНК Б","nuc":"нуклеоид","prodA":"продукты мтДНК А","prodB":"продукты мтДНК Б","fused":"общий матрикс","hi":"высокий потенциал","lo":"низкий потенциал","refuse":"снова сливается с сетью","auto":"удаляется аутофагией","notes":["Каждая митохондрия несёт свою мутантную мтДНК; продуктов одного генома не хватает для синтеза белков.","После слияния тРНК, рРНК и белки обоих геномов стали общими, а мтДНК осталась в своих нуклеоидах: синтез восстановлен.","При делении дочерние органеллы различаются по потенциалу: органелла с низким потенциалом редко сливается снова и удаляется аутофагией."]}},"section":1,"number":11,"question":2},{"id":"other-organelles","questions":[2],"title":"Можно ли переносить схему митохондрий на другие органеллы","keywords":["пероксисома","PEX11","ЭПР","атластин","эндосома","лизосома","SNARE","Rab","HOPS","аппарат Гольджи","ядерная оболочка","границы обобщения"],"lead":["У каждой органеллы своя пара процессов и свои машины; общая ГТФаза деления не означает общей логики.","Пероксисомы делятся той же DRP1, но слияния зрелых пероксисом не показано; ЭПР — единая сеть; эндосомы и лизосомы сливаются при участии SNARE и Rab."],"mechanism":["[[T46|Пероксисомы]] делятся с DRP1, MFF и FIS1 после удлинения белками PEX11; слияния зрелых пероксисом между собой у млекопитающих не показано.","Трубочки ЭПР сливают [[T47|атластины]], и ЭПР остаётся единой сетью; разделения на отдельные органеллы у него нет.","Эндосомы и лизосомы сливаются при участии [[T48|SNARE, Rab и комплексов-привязок]]; их «деление» — отделение трубчатых переносчиков груза и восстановление лизосом."],"paragraphs":["Слияние и деление встречаются у многих органелл, но схема митохондрий переносится на них только частично. Пероксисомы делятся с помощью той же DRP1 и части тех же рецепторов — MFF и FIS1; MiD49 и MiD51 остаются митохондриальными. Перед делением белки PEX11 вытягивают пероксисому (Koch 2003, 2010). Слияния зрелых пероксисом между собой у млекопитающих не показано: описаны лишь кратковременные контакты без обмена матриксом (Bonekamp 2012); слияние пре-пероксисомных пузырьков при образовании новых пероксисом — отдельный процесс (Sugiura 2017). Поэтому число пероксисом определяется делением и образованием новых органелл, а не балансом двух процессов.","Эндоплазматический ретикулум — противоположный случай: это одна непрерывная сеть, и регулируется не число органелл, а соотношение трубочек и цистерн и число соединений. Трубочки сливают ГТФазы атластины; при их недостатке трубочки перестают соединяться в сеть (Hu 2009). Эндосомы и лизосомы сливаются и друг с другом, и с автофагосомами при участии белков SNARE; скорость и выбор партнёра задают малые ГТФазы Rab, комплексы-привязки и белки SM (Jahn 2024). «Деление» эндосомы — отделение трубчатых переносчиков груза, то есть сортировка, а лизосомы после слияния с автофагосомами восстанавливаются из автолизосом при активном mTORC1 (Yu 2010).","Аппарат Гольджи и ядерная оболочка разбираются и собираются заново по фазам клеточного цикла: здесь слияние и деление — этапы программы деления клетки, а не стационарный баланс. Вывод для интерпретации: эффект на митохондрии нельзя без проверки переносить на другие органеллы, а вмешательство в общую машину (например, в DRP1) меняет сразу несколько органелл.","Переключите таблицы: в первой — машины и наличие обоих процессов, во второй — что из схемы митохондрий переносится, а что нет."],"trap":["Раз DRP1 делит и митохондрии, и пероксисомы, у пероксисом тоже есть баланс слияния и деления.","Общая ГТФаза деления не означает общей логики: слияния зрелых пероксисом у млекопитающих не показано, и их число задают деление и образование новых пероксисом."],"conditions":"Сводка данных обзоров и первичных работ: пероксисомы — Koch 2003 (клетки HepG2, доминантно-негативная DRP1 и РНК-интерференция), Koch 2010 (PEX11), Wakabayashi 2009 (удлинённые пероксисомы в фибробластах Drp1⁻/⁻); ЭПР — Hu 2009; слияние в эндосомном пути — обзор Jahn 2024; слияние пероксисом — Bonekamp 2012 (клетки COS-7 и CHO, гибриды клеток), пре-пероксисомы — Sugiura 2017 (фибробласты больных без пероксисом); восстановление лизосом — Yu 2010 (клетки почки крысы). Таблица качественная, без чисел.","sources":["Bonekamp2012","Sugiura2017","Koch2003","Koch2010","Wakabayashi2009","Hu2009","Jahn2023","Yu2010"],"quiz":{"id":"S2-L12","question":"Слияния зрелых пероксисом между собой у млекопитающих не показано. Чем тогда определяется число пероксисом в клетке?","options":[{"id":"S2-L12-1","text":"Балансом слияния и деления, как у митохондрий","correct":false,"feedback":"Для баланса нужны оба процесса, а слияния зрелых пероксисом не показано. Схему митохондрий здесь переносить нельзя."},{"id":"S2-L12-2","text":"Только числом молекул DRP1 в цитозоле","correct":false,"feedback":"DRP1 участвует в делении пероксисом, но число органелл задаёт не один белок: важны и PEX11, и рецепторы, и образование новых пероксисом."},{"id":"S2-L12-3","text":"Делением и образованием новых пероксисом","correct":true,"feedback":"Без слияния число пероксисом определяется делением (PEX11, DRP1, MFF, FIS1) и образованием новых органелл; слияния зрелых пероксисом, парного их делению, не показано."}]},"widget":{"kind":"table","title":"","s":{"title":"Слияние и деление у разных органелл","status":"Сводка данных названных работ","modes_label":"Показать","modes":["Машины и процессы","Что переносится со схемы митохондрий"],"tables":[{"head":["Органелла","Слияние","Деление или разделение","Ключевые белки"],"rows":[["Митохондрия","есть, гомотипическое, двух мембран","есть, регулируемое","MFN1/2, OPA1; DRP1, MFF, FIS1, MiD49/51"],["Пероксисома","у зрелых не показано","есть","PEX11, DRP1, MFF, FIS1"],["ЭПР","слияние трубочек, единая сеть","отдельных органелл нет","атластины, ретикулоны, лунапарк"],["Эндосома, лизосома","гомо- и гетеротипическое","отделение переносчиков, восстановление лизосом","SNARE, Rab5, Rab7, HOPS, mTORC1"],["Аппарат Гольджи","сборка цистерн после митоза","разборка перед митозом","GRASP65, GM130"],["Ядерная оболочка","сборка из мембран ЭПР в телофазе","разборка в профазе","ламины, ESCRT-III"]],"note":"Пара «слияние — деление» есть не у всех органелл, а там, где она есть, её выполняют разные машины."},{"head":["Свойство схемы митохондрий","Переносится","Не переносится"],"rows":[["Общая ГТФаза деления DRP1","на пероксисомы","на эндосомы, ЭПР, Гольджи"],["Баланс двух процессов задаёт число органелл","отчасти на эндолизосомы","на пероксисомы (нет слияния)"],["Слияние зависит от потенциала через OMA1 и OPA1","—","на все другие органеллы"],["Слияние и деление — этапы клеточного цикла","Гольджи, ядерная оболочка","митохондрии в интерфазе"]],"note":"Каждый перенос требует проверки собственных белков органеллы."}]}},"section":1,"number":12,"question":2},{"id":"phenotypes","questions":[2],"title":"Почему мутации машин слияния и деления поражают прежде всего длинные аксоны","keywords":["OPA1","доминантная оптическая атрофия","MFN2","Шарко — Мари — Тута 2A","DNM1L","ATL1","наследственная спастическая параплегия","избирательность поражения"],"lead":["Мутации в генах машин слияния и деления вызывают наследственные болезни; это прямой довод, что машины нужны тканям человека.","Белки есть почти во всех клетках, а поражаются прежде всего нейроны с длинными отростками."],"mechanism":["Мутации OPA1 вызывают доминантную оптическую атрофию, мутации MFN2 — нейропатию Шарко — Мари — Тута типа 2A.","Доминантно-негативная мутация DNM1L нарушает деление и митохондрий, и пероксисом; мутации ATL1 (слияние трубочек ЭПР) вызывают спастическую параплегию.","Генетическая связь показывает, что ген необходим ткани, но не указывает, какое звено механизма — слияние, транспорт или строение крист — нарушено."],"paragraphs":["Наследственные болезни показывают, что машины слияния и деления нужны тканям человека. Мутации OPA1 вызывают доминантную оптическую атрофию — избирательную гибель ганглиозных клеток сетчатки, аксоны которых образуют зрительный нерв (Delettre 2000). Мутации MFN2 вызывают наследственную нейропатию Шарко — Мари — Тута типа 2A с преимущественным поражением самых длинных периферических аксонов (Züchner 2004). У новорождённой девочки с доминантно-негативной мутацией в гене DNM1L, кодирующем DRP1, было нарушено деление сразу и митохондрий, и пероксисом; заболевание было тяжёлым и смертельным (Waterham 2007). Мутации ATL1, кодирующего атластин-1, вызывают наследственную спастическую параплегию с поражением длинных двигательных аксонов (Zhao 2001).","Обратите внимание на закономерность: эти белки синтезируются почти во всех клетках, а поражение избирательно. Страдают прежде всего нейроны с самыми длинными отростками и клетки, сильнее других зависящие от окислительного фосфорилирования. Возможное объяснение: именно в этих клетках выше требования к транспорту органелл и к поддержанию сети — митохондрии нужно доставить и сохранить работоспособными на расстоянии до метра от тела клетки.","Генетическая связь — сильный, но ограниченный довод. Она показывает, что ген необходим данной ткани в живом организме, но не указывает, какое звено механизма нарушено: слияние, транспорт органелл или строение крист. Каждое промежуточное звено требует отдельного измерения в клетках больных или в модели.","Переключайте таблицы: в первой — гены и болезни с источниками, во второй — что генетическая связь доказывает и чего не доказывает."],"trap":["Раз белки синтезируются почти во всех клетках, их мутации должны одинаково поражать все ткани.","Поражение избирательно: сильнее страдают клетки, где нагрузка на механизм выше, — нейроны с самыми длинными отростками и клетки, зависящие от окислительного фосфорилирования."],"conditions":"Генетические работы: Delettre 2000 (семьи с доминантной оптической атрофией), Züchner 2004 (семьи с CMT2A), Waterham 2007 (один ребёнок, фибробласты кожи), Zhao 2001 (семьи с SPG3A). Связь избирательности с длиной аксонов — гипотеза, а не установленный для каждой болезни механизм. Таблица без чисел.","sources":["Delettre2000","Zuchner2004","Waterham2007","Zhao2001","Chan2020"],"quiz":{"id":"S2-L13","question":"У ребёнка с мутацией DNM1L удлинены и митохондрии, и пероксисомы. Что этот случай говорит о машинах деления двух органелл?","options":[{"id":"S2-L13-1","text":"У органелл общая ГТФаза деления — DRP1","correct":true,"feedback":"DNM1L кодирует DRP1, и мутация этого гена нарушила деление обеих органелл сразу: деление митохондрий и пероксисом выполняет одна ГТФаза (Waterham 2007)."},{"id":"S2-L13-2","text":"Пероксисомы и митохондрии сливаются одинаково","correct":false,"feedback":"Случай касается деления, а не слияния. Слияния пероксисом в клетках млекопитающих не описано."},{"id":"S2-L13-3","text":"Пероксисомы образуются делением митохондрий","correct":false,"feedback":"Пероксисомы — отдельные органеллы со своими белками деления (PEX11); с митохондриями у них общая ГТФаза деления DRP1."}]},"widget":{"kind":"table","title":"","s":{"title":"Гены машин слияния и деления и наследственные болезни","status":"Сводка данных (названные генетические работы)","modes_label":"Показать","modes":["Гены и болезни","Что доказывает генетическая связь"],"tables":[{"head":["Ген (белок)","Процесс","Болезнь","Что поражается прежде всего"],"rows":[["OPA1","слияние внутренних мембран митохондрий","доминантная оптическая атрофия","ганглиозные клетки сетчатки"],["MFN2","слияние наружных мембран митохондрий","нейропатия Шарко — Мари — Тута 2A","длинные периферические аксоны"],["DNM1L (DRP1)","деление митохондрий и пероксисом","тяжёлая энцефалопатия новорождённых","мозг, многие ткани"],["ATL1 (атластин-1)","слияние трубочек ЭПР","спастическая параплегия SPG3A","длинные двигательные аксоны"]],"note":"Белки синтезируются почти везде, а поражение избирательно: сильнее страдают клетки с длинными отростками."},{"head":["Утверждение","Доказано генетикой?"],"rows":[["Ген необходим ткани в живом организме","да"],["Нарушено именно слияние (или деление)","нет — нужно измерить процесс"],["Нарушен транспорт митохондрий по аксону","нет — нужно измерить транспорт"],["Поражение связано с длиной отростков","закономерность наблюдений; механизм проверяют отдельно"]],"note":"Генетическая связь отвечает на вопрос «нужен ли ген», но не на вопрос «какое звено нарушено»."}]}},"section":1,"number":13,"question":2},{"id":"which-machine","questions":[2],"title":"Как узнать, какая машина изменена: слияние или деление","keywords":["прижизненная съёмка","частота событий","фотоактивируемый GFP","матриксный маркер","вестерн-блот OPA1","DRP1 на мембране","TMRM","потребление кислорода","компенсация","восстановление механизма"],"lead":["Морфологию, процесс, состояние белков и функцию измеряют отдельно: это разные величины.","Восстановление формы вмешательством в противоположную машину — [[T49|компенсация]], а не доказательство причины."],"mechanism":["Процесс измеряют прямо: число событий слияния и деления при прижизненной съёмке и обмен [[T41|матриксным маркером]] между органеллами.","Состояние машин показывают соотношение длинной и короткой форм OPA1 на блоте и количество DRP1 на наружной мембране.","Функцию измеряют отдельно: [[T40|TMRM]] — потенциал (состояние мембраны), потребление кислорода — поток."],"paragraphs":["Морфология сети чувствительна ко многим воздействиям, в том числе к условиям съёмки и фиксации, а одна и та же фрагментация совместима с разными механизмами. Поэтому вывод начинают с прямого измерения процессов. При прижизненной съёмке считают события слияния и деления на органеллу или на клетку в минуту: в эмбриональных фибробластах без DRP1 частота делений оказалась в 17 раз ниже, чем в норме (Wakabayashi 2009). Обмен содержимым измеряют матриксным фотоактивируемым GFP: его активируют светом в части сети и следят, как флуоресценция распространяется на другие органеллы; без слияния она остаётся в исходных органеллах (Anand 2014).","Состояние машин оценивают по белкам. На вестерн-блоте видно соотношение длинной и короткой форм OPA1: при потере потенциала почти вся длинная форма исчезает. Для DRP1 важно не общее количество в лизате, а доля на наружной мембране — её оценивают по скоплениям DRP1 на митохондриях при иммунофлуоресценции или по митохондриальной фракции. Функцию измеряют отдельно: TMRM показывает мембранный потенциал, то есть состояние мембраны, а потребление кислорода — поток. После CCCP потенциал падает, а потребление кислорода при оптимальной концентрации протонофора, достаточном количестве субстратов и наличии дыхательного резерва растёт: эти величины нельзя подменять друг другом. Избыток протонофора дыхание подавляет (условия разобраны в семинаре 1).","Наконец, нужно различать два вида восстановления фенотипа. Возвращение удалённого белка дикого типа поддерживает вывод о механизме, если возвращается само измеряемое событие, а количество и локализация белка сопоставимы с нормой. Вмешательство в противоположную машину — например, подавление DRP1 при ослабленном слиянии — восстанавливает форму сети, но не слияние: это компенсация фенотипа. Поэтому восстановление формы обходным путём не указывает исходную причину; различать нужно, вернулось ли измеряемое событие.","Переключайте схемы методов: для каждого показано, что именно он измеряет и чего не измеряет."],"trap":["Если подавление DRP1 устранило фрагментацию, значит, причиной фрагментации было усиленное деление.","Подавление деления устраняет фрагментацию при любой причине, в том числе при ослабленном слиянии. Это компенсация; о причине судят по измерению самих событий слияния и деления."],"conditions":"Схемы методов. Частота делений в клетках Drp1⁻/⁻ — эмбриональные фибробласты мыши, съёмка матриксного GFP (Wakabayashi 2009); обмен матриксным PA-GFP — фибробласты мыши, активировано около 23 % сети, наблюдение 60 мин (Anand 2014); формы OPA1 при потере потенциала — Song 2007 (клетки без OPA1 с отдельными формами OPA1 человека, 20 мкМ CCCP, 4 ч) и Head 2009 (клетки HeLa, 10 мкМ CCCP, 30 мин); ложные выводы из морфологии — учебный разбор. Числа на схемах — учебные.","sources":["Wakabayashi2009","Anand2014","Song2007","Head2009","Monzel2023"],"quiz":{"id":"S2-L14","question":"В двух линиях клеток сеть митохондрий фрагментирована одинаково. Какое измерение покажет, в какой из них подавлено слияние, а в какой усилено деление?","options":[{"id":"S2-L14-1","text":"Средняя длина митохондрий на фотографиях","correct":false,"feedback":"По условию форма сети одинакова, а она совместима с обоими механизмами. Нужно измерять сами события, а не их результат."},{"id":"S2-L14-2","text":"Общее количество DRP1 в лизате клеток","correct":false,"feedback":"Общее количество DRP1 не показывает, сколько её на мембране и как часто идут деления; о слиянии оно не говорит ничего."},{"id":"S2-L14-3","text":"Обмен матриксным маркером и частота событий","correct":true,"feedback":"При подавленном слиянии матриксный маркер распространяется медленнее и событий слияния меньше; при усиленном делении слияние идёт и событий в целом больше."}]},"widget":{"kind":"method","title":"","s":{"title":"Методы: процесс, белки и функция","status":"Схемы методов, учебные величины","modes_label":"Метод","modes":["Подсчёт событий","Матриксный маркер","Формы OPA1","DRP1 на мембране","Потенциал и дыхание","Восстановление или компенсация"],"schemes":[{"draw":"q2live","h":260,"l":{"pA":"А","a":"Кадры прижизненной съёмки","pB":"Б","b":"Счёт событий","fis":"деление","fus":"слияние","t":"мин","res":"событий на клетку в минуту"},"note":"События слияния и деления считают по кадрам съёмки матриксного маркера: это прямое измерение процесса, а не его результата.","legend":"Счёт зависит от разрешения и частоты кадров: короткие касания органелл без слияния можно принять за события."},{"draw":"q2pagfp","h":292,"l":{"pA":"А","a":"Норма","pB":"Б","b":"Без слияния","t0":"сразу после активации","t60":"через 60 мин","act":"активированный участок (≈23 % сети)"},"note":"Свет активирует фотоактивируемый GFP в матриксе части органелл. При слиянии флуоресценция распространяется на другие органеллы, без слияния остаётся в исходных.","legend":"Метод измеряет обмен содержимым матрикса за время наблюдения, а не частоту отдельных событий."},{"draw":"q2blot","h":260,"l":{"t":"Вестерн-блот OPA1","L":"L-OPA1","S":"S-OPA1","c":"HSP60","l1":"норма","l2":"CCCP, 60 мин","l3":"Opa1⁻/⁻"},"note":"В норме видны и длинная, и короткая формы OPA1. После CCCP протеаза OMA1 переводит длинную форму в короткую; в клетках без OPA1 нет обеих полос.","legend":"Блот показывает соотношение форм, но не то, идёт ли слияние: это проверяют обменом маркером."},{"draw":"q2drp","h":270,"l":{"pA":"А","a":"Иммунофлуоресценция","pB":"Б","b":"Фракционирование","mito":"митохондрия","dot":"скопление DRP1","cyt":"цитозольная фракция","mit":"митохондриальная фракция","n1":"норма","n2":"без MFF"},"note":"Для деления важна доля DRP1 на наружной мембране: её видно по скоплениям на митохондриях или по митохондриальной фракции. Общее количество в лизате может не меняться.","legend":"Скопление DRP1 на мембране — признак готовности к делению, но не само событие деления."},{"draw":"q2tmrm","h":260,"l":{"pA":"А","a":"TMRM — потенциал","pB":"Б","b":"Потребление кислорода — поток","n":"норма","c":"CCCP","u1":"% митохондрий с низким потенциалом","u2":"% от нормы"},"note":"После CCCP потенциал снят почти у всех митохондрий, а потребление кислорода в модели растёт: при оптимальной концентрации протонофора, достаточном количестве субстратов и наличии дыхательного резерва дыхательная цепь работает быстрее, когда протоны возвращаются в матрикс в обход ATP-синтазы.","legend":"Потенциал — состояние мембраны, дыхание — поток; одну величину нельзя заменить другой."},{"draw":"table","head":["Вмешательство","Что восстанавливается","Какой вывод поддерживает"],"rows":[["вернуть удалённый белок дикого типа","форма и сам процесс","эффект вызван потерей именно этого белка, если количество и локализация возвращённого белка сопоставимы с нормой"],["подавить противоположную машину","только форма сети","вывода о причине нет: это компенсация"],["подавить OMA1","после отмывания CCCP слияние восстанавливается быстрее","роль индуцируемого расщепления OPA1 (Head 2009)"]],"note":"Различают восстановление механизма и компенсацию фенотипа: в первом случае возвращается измеряемое событие, во втором — только картина."}]}},"section":1,"number":14,"question":2},{"id":"condensate","questions":[3],"title":"Чем компартмент без мембраны отличается от мембранного","keywords":["конденсат","безмембранный компартмент","ядрышко","стресс-гранула","P-гранулы","граница сосуществующих фаз","избирательность состава","обмен компонентов"],"lead":["В цитоплазме и ядре есть структуры с устойчивым составом, но без мембраны: ядрышко, ядерные спеклы, стресс-гранулы.","Их называют [[T50|биомолекулярными конденсатами]]: белки и нуклеиновые кислоты в них локально обогащены, хотя ограничивающей липидной мембраны нет; если сборка возникает путём фазового разделения, её граница — это граница между плотной и разбавленной фазами."],"mechanism":["Белки и РНК конденсата удерживаются вместе множеством слабых контактов, а не липидной мембраной.","В жидкоподобном конденсате молекулы непрерывно переходят между плотной фазой и окружением; мембраны с насосами и переносчиками нет, а состав избирательно задают взаимодействия молекул между собой.","Быстрый обмен молекул не означает короткой жизни структуры: ядрышко существует всю интерфазу."],"paragraphs":["Долгое время ядрышко, ядерные спеклы, тельца Кахаля и цитоплазматические гранулы оставались морфологическими объектами. Их называли по-разному — РНК-гранулами, рибонуклеопротеиновыми тельцами, безмембранными (немембранными) органеллами (Горшенева 2024), — видели в микроскопе, но не понимали, что удерживает эти структуры вместе. Перелом наступил, когда P-гранулы зародыша нематоды повели себя как капли жидкости: они были округлыми, сливались при соприкосновении, деформировались потоком и снова собирались (Brangwynne 2009). Сегодня к конденсатам относят десятки структур, среди них параспеклы и PML-тельца в ядре, P-тельца и транспортные РНК-гранулы нейронов в цитоплазме, кластеры нефрина и других мембранных рецепторов у плазматической мембраны (Горшенева 2024, таблица).","Биомолекулярный конденсат — компартмент без липидной мембраны, в котором белки и нуклеиновые кислоты локально обогащены по сравнению с окружением. Термин предложили Banani и соавторы (2017); в русской литературе употребляют и краткую форму «биоконденсат» (Горшенева 2024). Такое определение описывает наблюдаемое обогащение, а не механизм: [[T51|фазовое разделение]] жидкость — жидкость — лишь один из возможных механизмов сборки, и его нужно доказывать отдельно. Материальное состояние конденсата — жидкость, гель или твёрдоподобная сборка — третья, независимая характеристика (Banani 2017; Mittag 2022). В части литературы слово «конденсат» употребляют уже — только для обратимых сборок, возникших путём фазового разделения, и противопоставляют им агрегаты по строению (Горшенева 2024, рис. 4); в этом семинаре принято широкое описательное определение.","Сравним конденсат с мембранным компартментом. Собственный состав есть у обоих, а плотность, ионный состав и другие физико-химические свойства конденсата могут отличаться от окружающей среды. При фазовом разделении возникает граница сосуществующих фаз. Ограничивающей мембраны с насосами и переносчиками у конденсата нет, но состав его избирателен: одни молекулы преимущественно включаются в конденсат, другие исключаются из него; так, полностью собранные рибонуклеопротеиновые частицы вытесняются из ядрышка (Riback 2020). Избирательность задают взаимодействия молекул между собой.","Свойства конденсата удобно описывать тремя разными временами. Отдельные молекулы обмениваются с окружением за секунды, структура собирается или разбирается при изменении условий за секунды или минуты, а сама структура может существовать долго: ядрышко — всю интерфазу, стресс-гранула — десятки минут. Переключите варианты на схеме и сравните эти три времени у разных компартментов."],"trap":["Если молекулы конденсата обмениваются с окружением за секунды, сам конденсат существует лишь секунды.","Обмен отдельных молекул и срок существования структуры — разные величины. Ядрышко обменивается белками за секунды и минуты, но существует всю интерфазу."],"conditions":"Сравнение по обзорам Banani 2017, Mittag 2022, Lafontaine 2021, Горшенева 2024 (с. 398–408); избирательное исключение собранных частиц из ядрышка — Riback 2020 (клетки человека); P-гранулы — Brangwynne 2009, зародыш C. elegans. Времена в таблице — порядок величин из этих работ, а не измерение одного эксперимента.","sources":["Brangwynne2009","Banani2017","Mittag2022","Lafontaine2021","Riback2020","Gorsheneva2024"],"quiz":{"id":"S2-L15","rev":2,"question":"Белки ядрышка обмениваются с нуклеоплазмой за десятки секунд. Как долго существует само ядрышко в интерфазной клетке?","options":[{"id":"S2-L15-1","text":"Десятки секунд, как и обмен его белков","correct":false,"feedback":"Время обмена отдельных молекул не равно сроку существования структуры. Молекулы непрерывно обмениваются с окружением, а ядрышко как целое сохраняется."},{"id":"S2-L15-2","text":"Всю интерфазу, хотя его белки обновляются","correct":true,"feedback":"Ядрышко существует, пока идёт транскрипция рибосомной РНК, то есть всю интерфазу; его отдельные молекулы при этом непрерывно обмениваются с окружением."},{"id":"S2-L15-3","text":"Десятки минут, как стресс-гранула","correct":false,"feedback":"Ядрышко не временная реакция на воздействие, а постоянная структура интерфазного ядра. Короткоживущие конденсаты, например стресс-гранулы, исчезают после снятия стресса."}]},"widget":{"kind":"table","title":"","s":{"title":"Конденсат и мембранный компартмент: что общего и чем различаются","status":"Сравнение по обзорам; времена — порядок величин","modes_label":"Компартмент","modes":["ядрышко","стресс-гранула","лизосома (мембранный компартмент)"],"tables":[{"head":["Признак","Ядрышко"],"rows":[["граница","мембраны нет; граница сосуществующих фаз"],["насосы и переносчики в ограничивающей мембране","нет ограничивающей мембраны; компоненты распределяются избирательно"],["обмен отдельных молекул","секунды — минуты"],["сборка и разборка","разбирается в митозе и при подавлении транскрипции рРНК, собирается вновь"],["срок существования","вся интерфаза"]],"note":"Ядрышко — многофазный конденсат: его слои с разными свойствами соответствуют последовательным этапам сборки рибосом (Lafontaine 2021)."},{"head":["Признак","Стресс-гранула"],"rows":[["граница","мембраны нет; граница сосуществующих фаз"],["насосы и переносчики в ограничивающей мембране","нет ограничивающей мембраны; компоненты распределяются избирательно"],["обмен отдельных молекул","секунды"],["сборка и разборка","минуты — десятки минут после начала стресса; десятки минут и дольше после его снятия"],["срок существования","десятки минут"]],"note":"Гранула собирается из мРНК и белков, освободившихся после остановки инициации трансляции, и разбирается после снятия стресса."},{"head":["Признак","Лизосома"],"rows":[["граница","липидная мембрана"],["насосы и переносчики в ограничивающей мембране","есть: протонный насос (V-АТФаза) и переносчики"],["обмен отдельных молекул","только через переносчики и мембранный транспорт"],["сборка и разборка","слияние и восстановление из автолизосом (вопрос 2)"],["срок существования","часы и дольше"]],"note":"Состав мембранного компартмента поддерживают насосы и переносчики его мембраны; состав конденсата задают взаимодействия молекул между собой."}]}},"section":2,"number":15,"question":3},{"id":"multivalency","questions":[3],"title":"Почему множество слабых контактов собирает молекулы в сеть","keywords":["мультивалентность","IDR","неупорядоченная область","SH3","пролиновый мотив","слабые взаимодействия","сеть"],"lead":["Конденсат удерживают многие слабые контакты; устойчивость сборки зависит и от их числа, и от силы отдельных взаимодействий.","Для этого молекулы должны быть [[T52|мультивалентными]] — иметь несколько участков связывания."],"mechanism":["Молекула с одним участком связывания образует с партнёром только пару; с двумя — цепочки; с тремя и более — разветвлённую сеть.","Чем больше участков связывания, тем при меньшей концентрации возникает сеть, захватывающая много молекул.","Мультивалентность белка создают повторы доменов или несколько взаимодействующих участков [[T53|внутренне неупорядоченной области]]; РНК тоже может связывать несколько партнёров и входить в сеть."],"paragraphs":["Решающий модельный эксперимент поставили Li и соавторы (2012). Они собрали два искусственных белка: один из нескольких повторов SH3-домена, другой из стольких же пролиновых мотивов, с которыми SH3 связывается. Каждый отдельный контакт слаб: константа диссоциации около 350 мкМ. При смешивании выше определённой концентрации раствор мутнел, и в микроскопе появлялись капли диаметром от микрометра до десятков микрометров, сливавшиеся друг с другом. В каплях белки были концентрированы примерно в сто раз.","Порог зависел от валентности: чем больше модулей в молекулах, тем ниже концентрация, при которой появлялись капли. Моновалентный лиганд PRM(H)₁, связывающий SH3 значительно прочнее обычного мотива (константа диссоциации около 10 мкМ), в концентрации 1 мМ препятствовал образованию капель, а обычный одиночный мотив PRM₁ в той же концентрации — нет: важна и сила связывания конкурента. Мультивалентное связывание позволяет молекулам образовывать крупные разветвлённые ассоциаты. Но возникновение связной сети и разделение раствора на фазы — разные переходы: сеть может образоваться и без выделения плотной фазы. В экспериментах Li 2012 образование сети сопровождалось разделением фаз; насколько эти переходы связаны, зависит и от свойств спейсеров — участков, соединяющих модули (Harmon 2017; Горшенева 2024).","В природных конденсатах мультивалентность создают повторы доменов
