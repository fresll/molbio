 флуоресценции был определён коэффициент диффузии GFP в цитоплазме (Swaminathan 1997); неполное восстановление указывает на долю неподвижных молекул (Lippincott-Schwartz 2001).</p><p>Вмешательство проверяет достаточность. Фотоактивируемая аденилатциклаза bPAC при освещении повышает активность примерно в 300 раз и синтезирует cAMP в выбранный момент (Stierl 2011); рапамицин соединяет домены FKBP и FRB и за минуты переносит слитый с одним из них фермент к мембране, несущей другой домен (Putyrski и Schultz 2012).</p><div class="note trap"><strong>Типичная ошибка</strong> Чем больше сенсора cAMP экспрессировано в клетке, тем точнее он измеряет концентрацию.<p class="trap-fix">Сенсор связывает cAMP и буферирует его: избыток сенсора может снизить свободный cAMP и исказить его динамику и пространственный профиль. Нужны умеренная экспрессия, контроль количества сенсора и калибровка (Lyons 2023).</p></div><div class="static-quiz"><h3>Сенсор cAMP, адресованный к мембране домена, экспрессировали в 10 раз сильнее, чем в первом опыте; синтез cAMP и активность фосфодиэстераз в обоих опытах одинаковы, а ответ измеряли через 30 с после стимуляции, до установления стационара. После стимуляции гормоном доля сенсора, связавшего cAMP, у мембраны выросла меньше, чем при низкой экспрессии. Какое объяснение согласуется с этим результатом?</h3><ol><li><b>А.</b> Сенсор насытился cAMP раньше, чем при низкой экспрессии <i>(неверный вариант)</i><br><span class="expl">Насыщение означало бы, что почти весь сенсор связан с cAMP. При десятикратном избытке сенсора та же порция cAMP распределяется по большему числу молекул, и доля связанного сенсора, наоборот, ниже.</span></li><li><b>Б.</b> Отношение сигналов зависит от количества сенсора <i>(неверный вариант)</i><br><span class="expl">Отношение сигналов одного сенсора, в отличие от яркости, от его количества не зависит. Меньший ответ объясняется тем, что изменилась сама концентрация свободного cAMP.</span></li><li><b>В.</b> Сенсор связал часть cAMP и снизил свободный cAMP <i>(верный вариант)</i><br><span class="expl">Сенсор входит в измеряемую систему: в начальной фазе ответа он связывает часть cAMP и снижает свободную концентрацию (в длительном стационаре неподвижный обратимый сенсор её почти не меняет). Насколько и как долго, зависит от синтеза и гидролиза cAMP, подвижности сенсора и обратных связей, поэтому экспрессию сенсора держат умеренной и контролируют (Lyons 2023).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/42264">Miyawaki A. et al. 1997. Fluorescent indicators for Ca²⁺ based on green fluorescent proteins and calmodulin. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.C400302200">Nikolaev V. O. et al. 2004. Novel single chain cAMP sensors for receptor-induced signal propagation. J Biol Chem</a></li><li><a href="https://doi.org/10.1021/acs.chemrev.8b00333">Greenwald E. C., Mehta S., Zhang J. 2018. Genetically encoded fluorescent biosensors illuminate the spatiotemporal regulation of signaling networks. Chem Rev</a></li><li><a href="https://doi.org/10.1042/BCJ20220223">Lyons A. C., Mehta S., Zhang J. 2023. Fluorescent biosensors illuminate the spatial regulation of cell signaling across scales. Biochem J</a></li><li><a href="https://doi.org/10.1016/S0006-3495(97)78835-0">Swaminathan R., Hoang C. P., Verkman A. S. 1997. Photobleaching recovery and anisotropy decay of green fluorescent protein GFP-S65T in solution and cells: cytoplasmic viscosity probed by green fluorescent protein translational and rotational diffusion. Biophys J</a></li><li><a href="https://doi.org/10.1038/35073068">Lippincott-Schwartz J., Snapp E., Kenworthy A. 2001. Studying protein dynamics in living cells. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M110.185496">Stierl M. et al. 2011. Light modulation of cellular cAMP by a small bacterial photoactivated adenylyl cyclase, bPAC, of the soil bacterium Beggiatoa. J Biol Chem</a></li><li><a href="https://doi.org/10.1016/j.febslet.2012.04.061">Putyrski M., Schultz C. 2012. Protein translocation as a tool: the current rapamycin story. FEBS Lett</a></li><li><a href="https://doi.org/10.1016/j.cell.2020.07.035">Bock A. et al. 2020. Optical mapping of cAMP signaling at the nanometer scale. Cell</a></li></ul><p>Схемы методов; числа на схемах условные, кроме названных. Принцип FRET-сенсора Ca²⁺ — Miyawaki 1997, сенсора cAMP Epac1-camps — Nikolaev 2004 (по реферату). Ограничения сенсоров (буферирование, адресация, динамический диапазон, калибровка) — обзор Lyons 2023 (полный текст PMC). FRAP GFP в клетках CHO — Swaminathan 1997. bPAC: активность в темноте и на свету измерена в E. coli и ооцитах Xenopus, рост около 300 раз (Stierl 2011). Перенос белков рапамицином — обзор Putyrski и Schultz 2012 (по реферату). Режим «Сенсор буферирует» — расчёт связывания cAMP сенсором в закрытой системе: общее количество cAMP фиксировано (3 условные единицы), Kd сенсора — 1 условная единица, синтез и гидролиз не учитываются. Буферирование cAMP в клетке и нанодомены — Bock 2020 (клетки HEK293).</p></details></article><article class="card print-unit" id="ns-lipid-code"><div class="eyebrow">Фосфоинозитиды · шаг 15 из 30</div><h2>Как минорные липиды размечают мембраны компартментов</h2><p class="lead">Мембраны разных компартментов различаются характерным фосфоинозитидом — производным фосфатидилинозитола с фосфатами в положениях 3, 4 или 5 инозитольного кольца. Это распределение называют липидным кодом, но точнее говорить о разметке, которую белки считывают вместе с другими признаками мембраны: один липид встречается в нескольких мембранах.</p><ol class="mech"><li>Плазматическая мембрана размечена PI(4,5)P₂, аппарат Гольджи — PI4P, ранняя эндосома — PI3P, поздняя эндосома и лизосома — PI(3,5)P₂; PI(3,4,5)P₃ появляется после активации рецепторов.</li><li>Содержание метки распределено непрерывно: PI4P есть и на Гольджи, и в плазматической мембране, и на поздних эндосомах.</li><li>Разметка существует и поперёк бислоя: фосфатидилсерин удерживается в цитозольном монослое флиппазами и выходит наружу при активации скрамблаз.</li></ol><p>Все мембраны клетки построены из одних и тех же основных классов липидов. Для быстрой разметки служат <a href="#ns-g-S1-T09">фосфоинозитиды</a> — малая по количеству группа производных фосфатидилинозитола (PI). Их инозитольное кольцо фосфорилировано в положениях 3, 4 или 5 в разных сочетаниях; головная группа обращена в цитозоль, где её узнают белки. Каждую комбинацию фосфатов на мембране создают и удаляют свои ферменты, поэтому метка меняется за секунды–минуты и может смениться без изменения основного липидного состава мембраны.</p><p>Распределение фосфоинозитидов по компартментам устойчиво и составляет то, что называют <a href="#ns-g-S1-T50">липидным кодом</a> (Balla 2013; Posor 2022). Слово «код» требует ограничения. Это не таблица адресов: <a href="#ns-g-S1-T51">характерный фосфоинозитид</a> обогащён в своём компартменте, но встречается и в других. Сенсор P4M, для связывания которого PI4P необходим и достаточен, показывает этот липид на Гольджи, на плазматической мембране и на поздних эндосомах (Hammond 2014). Белок узнаёт участок мембраны с вероятностью, которая зависит от сочетания метки, поверхностного заряда, кривизны и белков-партнёров (Posor 2022; Lai 2025).</p><p>Разметка существует и поперёк бислоя. Фосфатидилсерин сосредоточен в цитозольном монослое плазматической мембраны: его переносят туда ATP-зависимые флиппазы семейства P4-АТФаз. <a href="#ns-g-S1-T62">Скрамблазы</a> TMEM16F (активируется подъёмом Ca²⁺) и Xkr8 (активируется расщеплением каспазами при апоптозе) переносят липиды в обе стороны без затраты ATP и рассеивают асимметрию; фосфатидилсерин на внешней поверхности узнают фагоциты (Sakuragi 2023). Без скрамблазы спонтанный переход фосфолипида между монослоями занимает часы.</p><p>На схеме головная группа показана как кольцо с пронумерованными положениями — это схема, а не структурная формула. Карта меток построена по модели практикума: числа условны и показывают, где липид преобладает.</p><div class="note trap"><strong>Типичная ошибка</strong> Каждая мембрана несёт один фосфоинозитид, и этот липид служит её однозначным адресом.<p class="trap-fix">Один и тот же фосфоинозитид присутствует в нескольких мембранах, и его содержание меняется непрерывно; мембрану узнают по сочетанию липида с другими признаками — зарядом, кривизной, белками-партнёрами.</p></div><div class="static-quiz"><h3>Сенсор P4M, для связывания которого PI4P необходим и достаточен, показал сигнал на аппарате Гольджи, на плазматической мембране и на поздних эндосомах. Что следует из этого для липидного кода?</h3><ol><li><b>А.</b> Один фосфоинозитид размечает несколько мембран <i>(верный вариант)</i><br><span class="expl">PI4P характерен для Гольджи, но его синтезируют и в других мембранах. Поэтому метка обозначает не адрес, а один из признаков, по которым белок узнаёт мембрану вместе с другими.</span></li><li><b>Б.</b> Сенсор ошибается: PI4P бывает только на Гольджи <i>(неверный вариант)</i><br><span class="expl">Пул PI4P плазматической мембраны подтверждён удалением PI4P фосфатазой: после него P4M диссоциирует от этой мембраны (Hammond 2014).</span></li><li><b>В.</b> Эти три мембраны образуют один компартмент <i>(неверный вариант)</i><br><span class="expl">Компартменты различаются набором условий и белков, а не одним липидом; общий липид в разных мембранах не делает их одним компартментом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00028.2012">Balla T. 2013. Phosphoinositides: tiny lipids with giant impact on cell regulation. Physiol Rev</a></li><li><a href="https://doi.org/10.1038/s41580-022-00490-x">Posor Y., Jang W., Haucke V. 2022. Phosphoinositides as membrane organizers. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1002/1873-3468.70227">Lai S., Huang W., He K. 2025. Spatial organization of phosphoinositide signaling. FEBS Lett</a></li><li><a href="https://doi.org/10.1083/jcb.201312072">Hammond G. R. V., Machner M. P., Balla T. 2014. A novel probe for phosphatidylinositol 4-phosphate reveals multiple pools beyond the Golgi. J Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41580-023-00604-z">Sakuragi T., Nagata S. 2023. Regulation of phospholipid distribution in the lipid bilayer by flippases and scramblases. Nat Rev Mol Cell Biol</a></li></ul><p>Распределение фосфоинозитидов — по обзорам Balla 2013 и Posor 2022 (клетки млекопитающих); пулы PI4P на Гольджи, плазматической мембране и поздних эндосомах — Hammond 2014 (сенсор P4M, клетки COS-7 и другие линии). Асимметрия монослоёв, флиппазы и скрамблазы — обзор Sakuragi и Nagata 2023. Содержания на карте меток — учебная модель практикума (вопрос 3, базовый уровень), 100 у. е. — содержание липида на его характерной мембране. Головная группа показана схемой, без структурной формулы.</p></details></article><article class="card print-unit" id="ns-conversion"><div class="eyebrow">Фосфоинозитиды · шаг 16 из 30</div><h2>Как киназы и фосфатазы меняют метку при созревании эндосомы</h2><p class="lead">Метку на мембране синтезирует местная киназа, а удаляют местные фосфатазы или следующая киназа; её содержание — стационар синтеза и удаления. При созревании эндосомы одна метка сменяется другой: PI(4,5)P₂ ямки дефосфорилируется, на ранней эндосоме VPS34 заново синтезирует PI3P, затем PIKfyve превращает его в PI(3,5)P₂; одновременно Rab5 сменяется на Rab7.</p><ol class="mech"><li><a href="#ns-g-S1-T52">Липидкиназы и липидфосфатазы</a> сами локализованы на определённых мембранах, поэтому превращения идут не в объёме, а на конкретной мембране.</li><li>На ранней эндосоме <a href="#ns-g-S1-T65">VPS34</a> синтезирует PI3P; при созревании <a href="#ns-g-S1-T66">PIKfyve</a> превращает его в PI(3,5)P₂.</li><li>Смена метки сопровождается сменой малых ГТФаз (<a href="#ns-g-S1-T63">Rab5 на Rab7</a>) и набора белков-эффекторов.</li></ol><p>Фосфоинозитиды взаимопревращаются набором ферментов, каждый из которых фосфорилирует или дефосфорилирует определённое положение кольца. Метка непрерывно обновляется: PI3P исчезает с эндосом вскоре после подавления PI3K, потому что фосфатазы продолжают его удалять (Hammond и Balla 2015). Содержание метки — <a href="#ns-g-S1-T07">стационарное неравновесное состояние</a> между синтезом и удалением.</p><p>Наиболее полно описана <a href="#ns-g-S1-T53">смена метки</a> при эндоцитозе (Wallroth и Haucke 2018; Posor 2022). Там, где формируется клатриновая ямка, PI(4,5)P₂ служит платформой для сборки белков эндоцитоза; при отделении пузырька его дефосфорилируют 5-фосфатазы. На образующейся ранней эндосоме VPS34, связанная с Rab5, синтезирует PI3P. При созревании PIKfyve фосфорилирует PI3P с образованием PI(3,5)P₂, а Rab5 сменяется на Rab7. Каждый шаг меняет набор белков, узнающих мембрану, поэтому смена метки — один из механизмов созревания компартмента (Huotari и Helenius 2011).</p><p>Из того, что метки связаны цепочкой превращений, следует важное для опыта правило. Подавление VPS34 снижает не только PI3P, но и PI(3,5)P₂: субстрата для PIKfyve становится мало. Подавление PIKfyve апилимодом (Cai 2013) снижает PI(3,5)P₂; в модели практикума PI3P на поздней эндосоме при этом накапливается, потому что перестаёт превращаться.</p><p>На схеме показаны три стадии и содержания меток по модели практикума; числа условны, последовательность событий — по обзорам.</p><div class="note trap"><strong>Типичная ошибка</strong> Метку достаточно поставить один раз: липид остаётся на мембране, пока его не израсходуют.<p class="trap-fix">Фосфоинозитид непрерывно синтезируется и удаляется; при подавлении киназы фосфатазы за минуты снижают его содержание, и мембрана теряет признак.</p></div><div class="static-quiz"><h3>Эндосома созревает: PI3P превращается в PI(3,5)P₂, а Rab5 сменяется на Rab7. Как изменится связывание EEA1, который узнаёт PI3P и Rab5-GTP, с этой эндосомой?</h3><ol><li><b>А.</b> Сохранится: связавшийся белок не следит за меткой <i>(неверный вариант)</i><br><span class="expl">Связывание домена с липидом обратимо: когда PI3P превращается, а Rab5 сменяется на Rab7, EEA1 диссоциирует от мембраны.</span></li><li><b>Б.</b> Ослабнет: исчезают оба признака, которые он узнаёт <i>(верный вариант)</i><br><span class="expl">PI3P превращается в PI(3,5)P₂, а Rab5 сменяется на Rab7. EEA1 теряет оба признака и диссоциирует от мембраны; так смена метки меняет набор белков на созревающей эндосоме.</span></li><li><b>В.</b> Усилится: PI(3,5)P₂ тоже фосфорилирован в положении 3 <i>(неверный вариант)</i><br><span class="expl">Домен FYVE избирательно связывает PI3P; второй фосфат в положении 5 меняет головную группу, и PI(3,5)P₂ им не узнаётся.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.R117.000629">Wallroth A., Haucke V. 2018. Phosphoinositide conversion in endocytosis and the endolysosomal system. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/emboj.2011.286">Huotari J., Helenius A. 2011. Endosome maturation. EMBO J</a></li><li><a href="https://doi.org/10.1038/s41580-022-00490-x">Posor Y., Jang W., Haucke V. 2022. Phosphoinositides as membrane organizers. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.bbalip.2015.02.013">Hammond G. R. V., Balla T. 2015. Polyphosphoinositide binding domains: key to inositol lipid biology. Biochim Biophys Acta</a></li><li><a href="https://doi.org/10.1016/j.chembiol.2013.05.010">Cai X. et al. 2013. PIKfyve, a class III PI kinase, is the target of the small molecular IL-12/IL-23 inhibitor apilimod and a player in Toll-like receptor signaling. Chem Biol</a></li></ul><p>Последовательность смены меток (PI(4,5)P₂ ямки; PI3P ранней эндосомы, синтезированный заново киназой VPS34; PI(3,5)P₂ поздней эндосомы) и смена Rab5 на Rab7 — обзоры Huotari и Helenius 2011, Wallroth и Haucke 2018, Posor 2022 (клетки млекопитающих). Быстрое исчезновение сенсоров PI3P после подавления PI3K — обзор Hammond и Balla 2015. Апилимод как ингибитор PIKfyve — Cai 2013. Содержания меток на схеме — учебная модель практикума (ингибитор VPS34 — 10 % активности, апилимод — 5 % активности PIKfyve); накопление PI3P при подавлении PIKfyve — следствие модели.</p></details></article><article class="card print-unit" id="ns-readers"><div class="eyebrow">Фосфоинозитиды · шаг 17 из 30</div><h2>Чем белки узнают фосфоинозитиды и почему одного домена мало</h2><p class="lead">Метку считывают белковые модули — домены PH, PX, FYVE, ENTH/ANTH, C2 — которые обратимо связываются с головной группой липида. Сродство отдельного домена обычно умеренное, поэтому один домен редко даёт надёжную адресацию.</p><ol class="mech"><li><a href="#ns-g-S1-T54">Периферическое связывание</a>: белок удерживается на поверхности мембраны электростатически и частично погружёнными гидрофобными участками, а не встроен в бислой.</li><li>У доменов <a href="#ns-g-S1-T55">PH</a>, <a href="#ns-g-S1-T57">PX</a>, <a href="#ns-g-S1-T56">FYVE</a>, <a href="#ns-g-S1-T58">ENTH/ANTH</a> и <a href="#ns-g-S1-T59">C2</a> свои лиганды; константы диссоциации — в микромолярном диапазоне.</li><li>При таком сродстве домен частично связывается и с «неправильными» мембранами и чувствителен к колебаниям концентрации липида.</li></ol><p>Белок узнаёт метку доменом, связывающим фосфорилированную головную группу. Связывание обратимо: при смене метки белок диссоциирует от мембраны. PH-домены связывают PI(4,5)P₂, PI(3,4,5)P₃ или PI4P (PLCδ1, AKT, OSBP); PX-домены сортирующих нексинов и FYVE-домены EEA1 и HRS — PI3P на ранних эндосомах; ENTH- и ANTH-домены эпсина и AP180 — PI(4,5)P₂ в эндоцитозной ямке; C2-домены синаптотагмина и PKC — кислые липиды при участии Ca²⁺.</p><p>Многое определяет соотношение сродства домена и концентрации липида. PH-домен PLCδ1 связывает PI(4,5)P₂ с константой диссоциации около 2 мкМ, а концентрация доступного PI(4,5)P₂ в клетке оценивается примерно в 10 мкМ; поэтому с мембраной связана большая часть сенсора, по оценке 50–90 %, но не весь (Hammond и Balla 2015). У многих PH-доменов избирательность к одному фосфоинозитиду невысока, и для связывания с мембраной им нужен второй признак, например малая ГТФаза.</p><p>Отсюда следует экспериментальная трудность: сенсор на основе одного домена показывает не распределение липида, а места, где липид сочетается с подходящими условиями. Точность адресации достигается не повышением сродства одного домена, а требованием двух признаков одновременно — это тема шага «Что даёт и чего не даёт коинцидентное узнавание».</p><div class="note trap"><strong>Типичная ошибка</strong> Чем выше сродство домена к липиду, тем точнее белок находит свою мембрану.<p class="trap-fix">Сродство одиночных доменов умеренное, и один липид есть в нескольких мембранах; избирательность адресации даёт совпадение нескольких признаков, а не сила одного контакта.</p></div><div class="static-quiz"><h3>PH-домен PLCδ1 связывает PI(4,5)P₂ с Kd около 2 мкМ, а доступный PI(4,5)P₂ в клетке оценивают примерно в 10 мкМ. Какая доля сенсора будет связана с плазматической мембраной?</h3><ol><li><b>А.</b> Практически весь сенсор <i>(неверный вариант)</i><br><span class="expl">Концентрация лиганда всего в несколько раз выше Kd, поэтому часть сенсора остаётся в цитозоле; полного связывания при таком сродстве нет.</span></li><li><b>Б.</b> Меньшая часть сенсора <i>(неверный вариант)</i><br><span class="expl">При концентрации лиганда выше Kd занятость больше половины; меньшая часть была бы связана при концентрации ниже Kd.</span></li><li><b>В.</b> Большая часть, но не весь <i>(верный вариант)</i><br><span class="expl">При концентрации лиганда в несколько раз выше Kd связана большая часть сенсора — по оценке Hammond и Balla, от 50 до 90 %, — но не весь.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbalip.2015.02.013">Hammond G. R. V., Balla T. 2015. Polyphosphoinositide binding domains: key to inositol lipid biology. Biochim Biophys Acta</a></li><li><a href="https://doi.org/10.1083/jcb.143.2.501">Várnai P., Balla T. 1998. Visualization of phosphoinositides that bind pleckstrin homology domains: calcium- and agonist-induced dynamic changes and relationship to myo-[3H]inositol-labeled phosphoinositide pools. J Cell Biol</a></li><li><a href="https://doi.org/10.1093/emboj/19.17.4577">Gillooly D. J. et al. 2000. Localization of phosphatidylinositol 3-phosphate in yeast and mammalian cells. EMBO J</a></li></ul><p>Домены и их лиганды — обзор Hammond и Balla 2015. Kd PH-домена PLCδ1 около 2 мкМ, оценка доступного PI(4,5)P₂ около 10 мкМ (от 4 до 17 мкМ в разных клетках) и доля связанного сенсора 50–90 % — оценки из того же обзора. Схема — таблица, без расчёта.</p></details></article><article class="card print-unit" id="ns-coincidence"><div class="eyebrow">Фосфоинозитиды · шаг 18 из 30</div><h2>Что даёт и чего не даёт коинцидентное узнавание</h2><p class="lead">Коинцидентное узнавание — узнавание по совпадению двух и более признаков: белок прочно связывается с мембраной, когда совпадают независимые признаки, например PI3P и Rab5-GTP у EEA1 в модели практикума. В простейшей модели независимых сайтов доля связанного белка равна произведению занятостей f = fA·fB: это даёт избирательность и авидность, но не порог.</p><ol class="mech"><li><a href="#ns-g-S1-T60">Коинцидентное узнавание</a>: каждый признак сам по себе даёт слабое связывание, их совпадение — прочное.</li><li>EEA1 связывается доменом FYVE с PI3P и соседним участком с Rab5-GTP; при подавлении PI3K EEA1 диссоциирует от эндосом.</li><li>При постоянной занятости второго сайта зависимость f от первого признака остаётся гиперболой с коэффициентом Хилла 1.</li></ol><p>Классический пример — EEA1, необходимый для слияния ранних эндосом. Он связывается с PI3P доменом FYVE, а с GTP-связанным <a href="#ns-g-S1-T63">Rab5</a> — участком, примыкающим к домену (Lawe 2000). По данным Simonsen 1998, связь EEA1 с эндосомой требовала и Rab5-GTP, и активности PI3K. Так возникло представление, что белок собирается там, где совпадают липидная метка компартмента и активное состояние ГТФазы (Carlton и Cullen 2005).</p><p>Количественную сторону легко преувеличить. Пусть два сайта связывают свои признаки независимо, а прочное удержание требует обоих. Тогда доля прочно связанного белка f = fA·fB. На мембране, где есть только один признак, произведение мало — это избирательность. Энергии двух контактов складываются, поэтому при совпадении признаков связывание прочнее — это авидность. Резкого порога произведение не даёт: при постоянном fB зависимость f от содержания PI3P остаётся гиперболой с меньшей высотой.</p><p>Поэтому совпадение признаков, кооперативность, сверхчувствительность и бистабильность — разные свойства. Кооперативность означает, что связывание одного признака повышает сродство к другому. Резкость ответа требует кооперативности или многоступенчатых механизмов, а два устойчивых состояния — ещё и положительной обратной связи. Резкая граница домена в микроскопе указывает на такие дополнительные механизмы, а не на сам факт совпадения признаков.</p><p>Реальные данные согласуются с произведением лишь качественно. Избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K (Simonsen 1998); в модели это возмещение частичное. Мутанты EEA1, не связывающие Rab5 C-концевым участком, локализовались на эндосомах так же, как белок дикого типа (Lawe 2002): для посадки EEA1 решающим оказался PI3P, а связывание Rab5, по-видимому, регулирует последующее слияние эндосом. Модель f = fA·fB — упрощение: она показывает логику коинцидентного узнавания, а не реальное соотношение двух признаков. На схеме — учебная модель практикума.</p><div class="note trap"><strong>Типичная ошибка</strong> Логическое И на мембране работает как переключатель с порогом: ниже порогового PI3P EEA1 не связывается, выше — связывается полностью.<p class="trap-fix">Для независимых сайтов f = fA·fB, и по каждому признаку кривая остаётся гиперболой без порога; порог и бистабильность требуют кооперативности и обратной связи.</p></div><div class="static-quiz"><h3>В модели практикума EEA1 прочно связывается с эндосомой только при совпадении PI3P и Rab5-GTP, а сайты связывают их независимо. Чего такое узнавание само по себе не даёт?</h3><ol><li><b>А.</b> Избирательности к мембране, где есть оба признака <i>(неверный вариант)</i><br><span class="expl">Избирательность — как раз главный результат: на мембране с одним признаком произведение занятостей мало.</span></li><li><b>Б.</b> Резкого порога по содержанию PI3P <i>(верный вариант)</i><br><span class="expl">При постоянной занятости сайта Rab5 доля связанного EEA1 зависит от PI3P гиперболически, с коэффициентом Хилла 1; порог требует кооперативности или других механизмов.</span></li><li><b>В.</b> Более прочного связывания при совпадении признаков <i>(неверный вариант)</i><br><span class="expl">Энергии двух контактов складываются, и связывание при совпадении признаков прочнее, чем по одному из них, — это авидность.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/28879">Simonsen A. et al. 1998. EEA1 links PI(3)K function to Rab5 regulation of endosome fusion. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.275.5.3699">Lawe D. C. et al. 2000. The FYVE domain of early endosome antigen 1 is required for both phosphatidylinositol 3-phosphate and Rab5 binding. J Biol Chem</a></li><li><a href="https://doi.org/10.1074/jbc.M109239200">Lawe D. C. et al. 2002. Sequential roles for phosphatidylinositol 3-phosphate and Rab5 in tethering and fusion of early endosomes via their interaction with EEA1. J Biol Chem</a></li><li><a href="https://doi.org/10.1016/j.tcb.2005.08.005">Carlton J. G., Cullen P. J. 2005. Coincidence detection in phosphoinositide signaling. Trends Cell Biol</a></li><li><a href="https://doi.org/10.1002/j.1460-2075.1994.tb06381.x">Stenmark H. et al. 1994. Inhibition of rab5 GTPase activity stimulates membrane fusion in endocytosis. EMBO J</a></li></ul><p>Simonsen 1998 — клетки млекопитающих (в том числе HeLa), вортманнин, избыток Rab5-GTP; Lawe 2000 и 2002 — клетки COS, микроинъекция и экспрессия фрагментов и мутантов EEA1. Модель f = fA·fB (упрощение), KA = 40 у. е. PI3P, занятость Rab5-GTP 0,5 (дикий тип), 0,08 (S34N) и 0,95 (Q79L) — учебная модель практикума (вопрос 3, продвинутый уровень). Кооперативная кривая (коэффициент Хилла 4) нарисована только для сравнения.</p></details></article><article class="card print-unit" id="ns-marker-cause"><div class="eyebrow">Фосфоинозитиды · шаг 19 из 30</div><h2>Как доказать, что метка — причина, а не только признак</h2><p class="lead">Маркер — признак, по которому исследователь узнаёт мембрану; причинный детерминант — признак, от которого зависят её свойства. Причинность доказывают вмешательством: липид быстро удаляют из одной мембраны и смотрят, что изменится.</p><ol class="mech"><li><a href="#ns-g-S1-T67">Рапамицин сближает FKBP и FRB</a>: фосфатаза, слитая с FKBP, за минуты переносится на мембрану с закреплённым FRB.</li><li>Удаление одного PI(4,5)P₂ освобождает PH-PLCδ1, но почти не снимает полиосновные белки; удаление одного PI4P не меняет PI(4,5)P₂.</li><li>Полиосновные белки диссоциируют от плазматической мембраны только при удалении обоих липидов.</li></ol><p>Совпадение белка и липида на одной мембране — корреляция. Утверждение о <a href="#ns-g-S1-T61">причинном детерминанте</a> требует вмешательства: липид удаляют и проверяют, меняется ли поведение мембраны. Удаление показывает необходимость; перенос фермента на чужую мембрану проверяет достаточность.</p><p>В опытах Hammond 2012 в клетках COS-7 FRB закрепили на плазматической мембране, а фосфатазы слили с FKBP. Рапамицин за минуты переносил на мембрану домен 5-фосфатазы INPP5E (PI(4,5)P₂ → PI4P), химеру «псевдоянин» из INPP5E и 4-фосфатазы Sac1 (удаляет оба липида), её вариант PJ-Sac с инактивированным доменом INPP5E (PI4P → PI) или вариант PJ-Dead с обоими инактивированными доменами. 5-фосфатаза снижала PI(4,5)P₂ и немного повышала PI4P, и сенсор PH-PLCδ1 переходил в цитозоль. PJ-Sac удаляла PI4P, но PI(4,5)P₂ и его сенсоры оставались прежними: основная часть PI4P этой мембраны не нужна для поддержания PI(4,5)P₂ в стационаре. Авторы предложили два объяснения: PIP5K сразу использует вновь синтезированный PI4P, или PI4P поступает из других мембран. Полиосновные зонды MARCKS-ED и хвост Rit1 диссоциировали от мембраны, только когда псевдоянин удалял оба липида; пренилированный хвост K-Ras при этом оставался на мембране, но переставал на ней обогащаться. PI4P Гольджи псевдоянин не затрагивал.</p><p>Вывод авторов: PI4P и PI(4,5)P₂ — необходимые, но независимые признаки плазматической мембраны; для удержания полиосновных белков они взаимозаменяемы, и в этом смысле PI4P — не только предшественник. Встроенные контроли — опыт без рапамицина и неактивная фосфатаза — показывают, что эффект даёт именно ферментативная активность на мембране.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок и липид находятся на одной мембране, липид определяет локализацию белка.<p class="trap-fix">Колокализация — корреляция; причинность показывает вмешательство. В опыте Hammond 2012 удаление PI(4,5)P₂ сняло PH-PLCδ1, но не полиосновные белки: их удерживал и PI4P.</p></div><div class="static-quiz"><h3>Химеру PJ-Sac (активен только домен 4-фосфатазы Sac1) рапамицином перенесли на плазматическую мембрану: PI4P исчез, а PI(4,5)P₂ и его сенсоры остались прежними. Какой вывод следует из этого опыта?</h3><ol><li><b>А.</b> PI(4,5)P₂ синтезируется без участия PI-4-киназ <i>(неверный вариант)</i><br><span class="expl">Ингибитор PI-4-киназ фениларсиноксид мешал восстановлению PI(4,5)P₂ (Hammond 2012); опыт с PJ-Sac говорит о запасе PI4P в мембране, а не о ферментах синтеза.</span></li><li><b>Б.</b> Большая часть PI4P мембраны не нужна для PI(4,5)P₂ <i>(верный вариант)</i><br><span class="expl">PI4P удалили, а PI(4,5)P₂ сохранился: PIP5K, вероятно, сразу использует вновь синтезированный PI4P, или PI4P поступает из других мембран (Hammond 2012). Значит, большая часть PI4P мембраны выполняет другую функцию.</span></li><li><b>В.</b> PI4P в плазматической мембране отсутствует <i>(неверный вариант)</i><br><span class="expl">PI4P там есть: его содержание снижалось именно после переноса PJ-Sac, а сенсор P4M показывает пул PI4P плазматической мембраны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1222483">Hammond G. R. V. et al. 2012. PI4P and PI(4,5)P2 are essential but independent lipid determinants of membrane identity. Science</a></li><li><a href="https://doi.org/10.1038/s41580-022-00490-x">Posor Y., Jang W., Haucke V. 2022. Phosphoinositides as membrane organizers. Nat Rev Mol Cell Biol</a></li></ul><p>Hammond 2012: клетки COS-7; рапамицин-индуцируемый перенос на плазматическую мембрану химер FKBP с доменом INPP5E, с псевдоянином (INPP5E и Sac1), с PJ-Sac (активен только домен Sac1) или с PJ-Dead; окрашивание PI4P и PI(4,5)P₂, флуоресцентные зонды, наблюдение в течение минут. Схема и таблица — качественные данные статьи, без чисел. Строка «PI4P аппарата Гольджи» проверена авторами для псевдоянина.</p></details></article><article class="card print-unit" id="ns-pip-signals"><div class="eyebrow">Фосфоинозитиды · шаг 20 из 30</div><h2>Как сигнальные фосфоинозитиды связаны с AKT, лизосомным Ca²⁺ и болезнями</h2><p class="lead">PI(3,4,5)P₃ — кратковременный сигнал рецептора: его синтезирует PI3K класса I, а удаляют PTEN и SHIP; пока он есть, на плазматической мембране удерживаются AKT и другие белки, PH-домены которых связывают PI(3,4,5)P₃. PI(3,5)P₂ прямо активирует лизосомный канал TRPML1; мутации генов ферментов обмена фосфоинозитидов связаны с болезнями.</p><ol class="mech"><li><a href="#ns-g-S1-T64">PI3K класса I</a> после фактора роста превращает PI(4,5)P₂ в PI(3,4,5)P₃; PTEN дефосфорилирует его до PI(4,5)P₂, SHIP — до PI(3,4)P₂.</li><li>Без PTEN PI(3,4,5)P₃ накапливается даже без стимула, и AKT дольше удерживается на мембране.</li><li>PI(3,5)P₂ связывается с каналом <a href="#ns-g-S1-T69">TRPML1</a> и открывает его; при дефиците PI(3,5)P₂ поздние эндосомы и лизосомы увеличиваются.</li></ol><p>PI(3,4,5)P₃ в покоящейся клетке почти нет. После связывания фактора роста рецептор активирует PI3K класса I, которая фосфорилирует PI(4,5)P₂ в положении 3. PTEN отщепляет этот фосфат (Maehama и Dixon 1998), SHIP — фосфат в положении 5. Пока PI(3,4,5)P₃ есть в мембране, с ней связываются белки, PH-домены которых узнают этот липид, в том числе киназа AKT. Утрата PTEN повышает содержание PI(3,4,5)P₃ и без стимула: в опытах Maehama и Dixon неактивный мутант PTEN вызывал накопление PI(3,4,5)P₃ без инсулина.</p><p>PI(3,5)P₂ поздних эндосом и лизосом связывается с каналом TRPML1 и открывает его; через канал Ca²⁺ выходит из лизосомы. В фибробластах мыши с дефицитом PI(3,5)P₂ эндолизосомы увеличивались, а повышенная экспрессия TRPML1 уменьшала этот фенотип (Dong 2010). Синтез липида киназой PIKfyve тем самым управляет местным кальциевым сигналом лизосомы.</p><p>Мутации генов ферментов обмена фосфоинозитидов вызывают болезни или связаны с ними, и вид связи нужно называть точно. Наследственные мутации PTEN вызывают синдром Каудена (Liaw 1997), соматическая утрата PTEN часта в опухолях. Активирующие соматические мутации PIK3CA часто находят в опухолях человека (Samuels 2004). Мутации FIG4 вызывают болезнь Шарко — Мари — Тута типа 4J (Chow 2007). Мутации 5-фосфатазы OCRL вызывают синдром Лоу (Attree 1992), мутации INPP5E — синдром Жубера (Bielas 2009). Общий признак — нарушение местного баланса синтеза и удаления метки: при мутациях PTEN и PIK3CA избыточен сигнал PI3K — AKT, при мутациях FIG4, OCRL и INPP5E нарушаются созревание мембран, транспорт и функция ресничек.</p><div class="note trap"><strong>Типичная ошибка</strong> PTEN нужна только после стимула: без фактора роста её утрата ничего не меняет.<p class="trap-fix">PTEN работает и в покое, уравновешивая базальную активность PI3K; без неё PI(3,4,5)P₃ накапливается и без стимула.</p></div><div class="static-quiz"><h3>В клетках подавили PIKfyve, и содержание PI(3,5)P₂ на лизосомах снизилось. Как изменится активность канала TRPML1 в лизосомах?</h3><ol><li><b>А.</b> Снизится: канал теряет активирующий липид <i>(верный вариант)</i><br><span class="expl">PI(3,5)P₂ прямо связывается с TRPML1 и открывает его; при дефиците липида канал реже открыт, и выход Ca²⁺ из лизосомы уменьшается (Dong 2010).</span></li><li><b>Б.</b> Не изменится: канал регулируется только Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">Активность TRPML1 зависит от фосфоинозитида мембраны: PI(3,5)P₂ связывается с каналом и активирует его (Dong 2010).</span></li><li><b>В.</b> Возрастёт: накапливается PI3P <i>(неверный вариант)</i><br><span class="expl">Активатором TRPML1 служит PI(3,5)P₂, а не его предшественник PI3P; избыток PI3P не возмещает потерю PI(3,5)P₂.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.273.22.13375">Maehama T., Dixon J. E. 1998. The tumor suppressor, PTEN/MMAC1, dephosphorylates the lipid second messenger, phosphatidylinositol 3,4,5-trisphosphate. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/ncomms1037">Dong X.-P. et al. 2010. PI(3,5)P2 controls membrane trafficking by direct activation of mucolipin Ca2+ release channels in the endolysosome. Nat Commun</a></li><li><a href="https://doi.org/10.1038/ng0597-64">Liaw D. et al. 1997. Germline mutations of the PTEN gene in Cowden disease, an inherited breast and thyroid cancer syndrome. Nat Genet</a></li><li><a href="https://doi.org/10.1126/science.1096502">Samuels Y. et al. 2004. High frequency of mutations of the PIK3CA gene in human cancers. Science</a></li><li><a href="https://doi.org/10.1038/nature05876">Chow C. Y. et al. 2007. Mutation of FIG4 causes neurodegeneration in the pale tremor mouse and patients with CMT4J. Nature</a></li><li><a href="https://doi.org/10.1038/358239a0">Attree O. et al. 1992. The Lowe&#x27;s oculocerebrorenal syndrome gene encodes a protein highly homologous to inositol polyphosphate-5-phosphatase. Nature</a></li><li><a href="https://doi.org/10.1038/ng.423">Bielas S. L. et al. 2009. Mutations in INPP5E, encoding inositol polyphosphate-5-phosphatase E, link phosphatidyl inositol signaling to the ciliopathies. Nat Genet</a></li><li><a href="https://doi.org/10.1074/jbc.R117.000629">Wallroth A., Haucke V. 2018. Phosphoinositide conversion in endocytosis and the endolysosomal system. J Biol Chem</a></li></ul><p>Maehama и Dixon 1998 — клетки HEK293, инсулин, неактивный мутант PTEN C124S, рекомбинантный фермент. Dong 2010 — ток канала TRPML1 через мембрану эндолизосом, фибробласты мыши с дефицитом PI(3,5)P₂, дрожжи. Связи с болезнями — Liaw 1997 (синдром Каудена, наследственные мутации), Samuels 2004 (соматические мутации PIK3CA в опухолях), Chow 2007 (FIG4, CMT4J), Attree 1992 (OCRL, синдром Лоу), Bielas 2009 (INPP5E, синдром Жубера). Содержания PI(3,4,5)P₃ и PI(3,5)P₂ и занятость PH-AKT на схеме — учебная модель практикума. Лечебных выводов шаг не делает.</p></details></article><article class="card print-unit" id="ns-measure-pip"><div class="eyebrow">Фосфоинозитиды · шаг 21 из 30</div><h2>Что показывают методы изучения фосфоинозитидов и где их пределы</h2><p class="lead">Сенсор на основе домена показывает доступный ему липид в местах, где выполнены его условия связывания; липидомика измеряет количество, но теряет локализацию. Необходимость липида показывает только вмешательство — быстрое удаление его из выбранной мембраны.</p><ol class="mech"><li><a href="#ns-g-S1-T68">Сенсор на основе липид-связывающего домена</a> связывает часть свободного липида и конкурирует с собственными белками клетки; при сильной экспрессии он может подавлять процесс.</li><li>Сенсору может быть нужен второй признак (PH-FAPP1 — Arf1-GTP), а липид, связанный с эффекторами, сенсору не виден.</li><li>Масс-спектрометрия экстракта не различает мембраны; региоизомеры одной массы по одной массе иона не различить — для этого применяют предварительное разделение, например хроматографическое.</li></ol><p><a href="#ns-g-S1-T08">Генетически кодируемый биосенсор</a> фосфоинозитида — домен, слитый с флуоресцентным белком. Он сообщает о доле липида, которая свободна от собственных белков клетки и доступна ему (Hammond и Balla 2015). Избыточная экспрессия сенсоров PI(4,5)P₂ подавляла сигнализацию через фосфолипазу C и экзоцитоз. Сенсор с дополнительным требованием показывает не все пулы липида: PH-FAPP1 выделяет Гольджи, а P4M, которому достаточно PI4P, — ещё плазматическую мембрану и поздние эндосомы (Hammond 2014).</p><p>Надёжность сенсоров неодинакова. Сенсор PI(3,5)P₂ ML1N×2 (Li 2013) при проверке оказался малоизбирательным: его локализация во многом не зависела от синтеза PI(3,5)P₂ (Hammond 2015). Позже предложен белок SnxA (Vines 2023). Проверка сенсора включает удаление липида: если сигнал не исчезает, сенсор показывает что-то другое.</p><p>Липидомика измеряет количество фосфоинозитидов в экстракте и точна, но не даёт разрешения на уровне отдельной клетки и мембраны; разделение органелл трудоёмко и даёт артефакты (Hammond и Balla 2015). По одной массе иона региоизомеры, например PI(4,5)P₂ и PI(3,4)P₂, не различить. Методы с предварительным хроматографическим разделением — хиральной хроматографией (PRMC-MS; Morioka 2022) или сверхкритической флюидной хроматографией (Shimanaka 2022) — позволяют измерять их раздельно; исходную органеллу анализ общего экстракта при этом всё равно не устанавливает.</p><p>Ни сенсор, ни липидомика не доказывают, что липид нужен. Необходимость показывает вмешательство: фосфатазу за минуты переносят на выбранную мембрану (сближение FKBP–FRB) и смотрят, что изменится (шаг «Как доказать, что метка — причина»).</p><div class="note trap"><strong>Типичная ошибка</strong> Яркость сенсора на мембране пропорциональна содержанию липида в ней.<p class="trap-fix">Сенсор насыщается, конкурирует с собственными белками клетки и может требовать второго признака; он показывает доступный ему липид в местах, где выполнены условия связывания.</p></div><div class="static-quiz"><h3>Липидомика без разделения региоизомеров показала, что общее количество фосфоинозитида с массой PIP₂ в клетках после воздействия не изменилось. Какой вывод корректен?</h3><ol><li><b>А.</b> PI(4,5)P₂ в плазматической мембране не изменился <i>(неверный вариант)</i><br><span class="expl">Экстракт всей клетки не различает мембраны: количество в одной мембране могло измениться за счёт другой.</span></li><li><b>Б.</b> Воздействие не затронуло ферменты обмена фосфоинозитидов <i>(неверный вариант)</i><br><span class="expl">Активность ферментов могла измениться, если синтез и удаление сместились одинаково или изменения в разных мембранах уравновесили друг друга.</span></li><li><b>В.</b> Перераспределение липида между мембранами не исключено <i>(верный вариант)</i><br><span class="expl">Анализ общего экстракта теряет локализацию, а без хроматографического разделения не различает PI(4,5)P₂ и PI(3,4)P₂ одной массы, поэтому постоянство общего количества не исключает перераспределения.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-1.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbalip.2015.02.013">Hammond G. R. V., Balla T. 2015. Polyphosphoinositide binding domains: key to inositol lipid biology. Biochim Biophys Acta</a></li><li><a href="https://doi.org/10.1083/jcb.201312072">Hammond G. R. V., Machner M. P., Balla T. 2014. A novel probe for phosphatidylinositol 4-phosphate reveals multiple pools beyond the Golgi. J Cell Biol</a></li><li><a href="https://doi.org/10.1073/pnas.1311864110">Li X. et al. 2013. Genetically encoded fluorescent probe to visualize intracellular phosphatidylinositol 3,5-bisphosphate localization and dynamics. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1371/journal.pone.0139957">Hammond G. R. V. et al. 2015. The ML1Nx2 phosphatidylinositol 3,5-bisphosphate probe shows poor selectivity in cells. PLoS One</a></li><li><a href="https://doi.org/10.1083/jcb.202209077">Vines J. H. et al. 2023. A PI(3,5)P2 reporter reveals PIKfyve activity and dynamics on macropinosomes and phagosomes. J Cell Biol</a></li><li><a href="https://doi.org/10.1126/science.1222483">Hammond G. R. V. et al. 2012. PI4P and PI(4,5)P2 are essential but independent lipid determinants of membrane identity. Science</a></li><li><a href="https://doi.org/10.1038/s41467-021-27648-z">Morioka S. et al. 2022. A mass spectrometric method for in-depth profiling of phosphoinositide regioisomers and their disease-associated regulation. Nat Commun</a></li><li><a href="https://doi.org/10.1038/s42004-022-00676-6">Shimanaka Y. et al. 2022. Supercritical fluid chromatography-mass spectrometry enables simultaneous measurement of all phosphoinositide regioisomers. Commun Chem</a></li></ul><p>Свойства сенсоров и липидомики — обзор Hammond и Balla 2015; P4M и PH-FAPP1 — Hammond 2014 (клетки COS-7 и др.); ML1N×2 — Li 2013 и проверка Hammond 2015 (клетки COS-7, эмбриональные стволовые клетки мыши, фармакологическое и генетическое подавление синтеза PI(3,5)P₂); SnxA — Vines 2023 (Dictyostelium и клетки млекопитающих); региоизомеры в масс-спектрометрии — Hammond 2012; их раздельное измерение — Morioka 2022 (PRMC-MS: хиральная хроматография и масс-спектрометрия; ткани мыши и клеточные линии) и Shimanaka 2022 (сверхкритическая флюидная хроматография; ткани мыши и культуры клеток), прочитаны рефераты. Схемы методов — без чисел.</p></details></article><article class="card print-unit" id="ns-contact-site"><div class="eyebrow">Контактные сайты · шаг 22 из 30</div><h2>Что такое мембранный контактный сайт и чем он отличается от слияния</h2><p class="lead">Мембранный контактный сайт — участок устойчивого сближения мембран двух органелл без их слияния. Характерное расстояние зависит от типа контакта; 10–30 нм — диапазон для контакта ЭПР — митохондрия, рассматриваемого здесь. В этом шаге разбираются три проверки — геометрия, удержание мембран и раздельность содержимого; каждую выполняют отдельным измерением, а функцию контакта измеряют ещё отдельно.</p><ol class="mech"><li><a href="#ns-g-S1-T70">Контактный сайт</a> — устойчивое сближение мембран двух органелл, которое удерживают <a href="#ns-g-S1-T71">тетеринг-белки</a>; расстояние зависит от типа контакта.</li><li>Мембраны сохраняют целостность, содержимое <a href="#ns-g-S1-T01">компартментов</a> не смешивается; этим контакт отличается от слияния.</li><li>Чаще всего партнёром в контакте оказывается ЭПР: его сеть трубочек и цистерн проходит через весь объём клетки.</li></ol><p>Компартменты обмениваются веществом тремя способами. Участок мембраны с грузом отделяется в виде пузырька и сливается с мембраной-получателем; растворимый переносчик связывает молекулу в одном месте и отдаёт в другом; наконец, органеллы обмениваются веществом через сближенные мембраны без слияния. Третий путь и есть <a href="#ns-g-S1-T70">мембранный контактный сайт</a>.</p><p>Группа исследователей контактов предложила описывать контакт по четырём признакам: удержанию мембран рядом, отсутствию слияния, особой функции и особому набору белков и липидов; одно расстояние контакт не определяет — верхнюю границу в разных работах задают от 10 до 80 нм (Scorrano 2019). В этом шаге разбираются <a href="#ns-g-S1-T72">три проверки</a>. Первая — геометрия: в контакте ЭПР — митохондрия зазор порядка 10–30 нм достаточно мал, чтобы белок средних размеров перекрыл его, и достаточно велик, чтобы мембраны не сливались (слияние бислоёв происходит лишь при их сближении до 1–2 нм, для чего нужны специальные белки). Вторая — тетеринг-белки, удерживающие это расстояние: их удаление должно увеличивать зазор или уменьшать площадь контакта (хотя в большинстве контактов таких белков несколько, и удаление одного может не дать эффекта). Третья — раздельность содержимого: компартменты остаются разными, и именно это отличает контакт от слияния.</p><p>Контакты образуют почти все органеллы, но чаще других в них участвует ЭПР — с митохондриями, плазматической мембраной, эндосомами, лизосомами, пероксисомами, липидными каплями и аппаратом Гольджи (Wu 2018; Prinz 2020). По оценке Rizzuto 1998, в клетках HeLa с ЭПР сближено от 5 до 20 % поверхности митохондрий.</p><p>Признаки устанавливаются с разной полнотой, и вывод ограничен тем, что измерено. Если измерена площадь сближения, можно говорить о площади, но не о переносе вещества: для этого нужно отдельное измерение потока или зависящей от него функции (Calì 2025). Поэтому результат записывают не словами «контакт есть», а перечнем установленных признаков и методов.</p><div class="note trap"><strong>Типичная ошибка</strong> В контакте мембраны органелл частично сливаются, чтобы передать вещество.<p class="trap-fix">При контакте обе мембраны сохраняют целостность и содержимое не смешивается. Вещество переносят белки — переносчики липидов и каналы в зоне сближения; при слиянии же содержимое органелл объединяется.</p></div><div class="static-quiz"><h3>ЭМ-томография показала, что мембраны ЭПР и митохондрии сближены на 15–20 нм, а маркеры просветов двух органелл не смешиваются. Какая из трёх проверок, разобранных в этом шаге, этими данными ещё не выполнена?</h3><ol><li><b>А.</b> Удержание расстояния тетеринг-белками <i>(верный вариант)</i><br><span class="expl">Расстояние и раздельность содержимого измерены. Чтобы выполнить третью проверку, нужно назвать белки, удерживающие зазор, удалить их и показать, что зазор растёт или площадь контакта уменьшается.</span></li><li><b>Б.</b> Расстояние между мембранами органелл <i>(неверный вариант)</i><br><span class="expl">Расстояние уже измерено томографией: 15–20 нм. Неизвестно другое — какие белки удерживают мембраны на этом расстоянии.</span></li><li><b>В.</b> Раздельность содержимого органелл <i>(неверный вариант)</i><br><span class="expl">Раздельность содержимого показали маркеры просветов: они не смешиваются. Не хватает данных о белках, удерживающих зазор.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41467-019-09253-3">Scorrano L. et al. 2019. Coming together to define membrane contact sites. Nat Commun</a></li><li><a href="https://doi.org/10.1038/s41580-025-00864-x">Calì T. et al. 2025. Key challenges and recommendations for defining organelle membrane contact sites. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1126/science.aan5835">Wu H., Carvalho P., Voeltz G. K. 2018. Here, there, and everywhere: the importance of ER membrane contact sites. Science</a></li><li><a href="https://doi.org/10.1038/s41580-019-0180-9">Prinz W. A., Toulmay A., Balla T. 2020. The functional universe of membrane contact sites. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1126/science.280.5370.1763">Rizzuto R. et al. 1998. Close contacts with the endoplasmic reticulum as determinants of mitochondrial Ca²⁺ responses. Science</a></li></ul><p>Определение и признаки контакта — согласованные рекомендации группы авторов (Scorrano 2019, полный текст PMC: четыре признака, верхняя граница расстояния в разных работах 10–80 нм; Calì 2025, обзор). Доля поверхности митохондрий, сближенной с ЭПР (5–20 %), — оценка Rizzuto 1998 для живых клеток HeLa по трёхмерной флуоресцентной микроскопии (полный текст). Схема — схема механизма; расстояния не в масштабе.</p></details></article><article class="card print-unit" id="ns-tethers"><div class="eyebrow">Контактные сайты · шаг 23 из 30</div><h2>Какие белки удерживают мембраны рядом и почему контакт динамичен</h2><p class="lead">Тетеринг-белки одновременно связаны с мембранами двух органелл; многие из них не только удерживают контакт, но и переносят вещество. Роль белка в контакте доказывают удалением: должны измениться геометрия контакта и зависящая от него функция.</p><ol class="mech"><li><a href="#ns-g-S1-T76">VAP-A и VAP-B</a> на мембране ЭПР связывают мотив FFAT белков-партнёров, в том числе OSBP, и привязывают перенос липидов к месту контакта.</li><li>У дрожжей ЭПР с митохондрией связывает комплекс ERMES; у животных его нет, но белок ЭПР <a href="#ns-g-S1-T84">PDZD8</a> несёт SMP-домен, функционально соответствующий домену белка Mmm1 из ERMES (Hirabayashi 2017).</li><li>Контакт — равновесие образования и распада: число и площадь контактов меняются с условиями.</li></ol><p><a href="#ns-g-S1-T71">Тетеринг-белки</a> одновременно связаны с мембранами двух органелл и удерживают их на определённом расстоянии, не вызывая слияния; их отличают от моторных адаптеров, перемещающих органеллы, и от белков слияния. Первый такой комплекс нашли у дрожжей: в генетическом скрининге клеток, которые выживали только при искусственной привязке ЭПР к митохондрии, выявили белки комплекса ERMES (Kornmann 2009). У животных комплекса ERMES нет, но белок ЭПР PDZD8 несёт SMP-домен, функционально соответствующий домену Mmm1 — одного из белков ERMES (Hirabayashi 2017).</p><p>Многие тетеринг-белки одновременно переносят вещество. Мотив FFAT, который связывают VAP-A и VAP-B, есть у OSBP, белков ORP и переносчика церамида CERT, поэтому пара VAP–FFAT удерживает контакт и привязывает к нему перенос липидов. <a href="#ns-g-S1-T85">E-Syt</a> связывают ЭПР с плазматической мембраной; при подъёме Ca²⁺ зазор в контактах, образованных E-Syt1, сокращается (Fernández-Busnadiego 2015). После опустошения депо сенсор ЭПР <a href="#ns-g-S1-T86">STIM1</a> в контакте с плазматической мембраной связывается с каналом Orai1 и открывает депо-зависимый вход Ca²⁺ (Saheki 2017). В нейронах мыши без PDZD8 митохондрии хуже захватывали Ca²⁺, вышедший из ЭПР при синаптической стимуляции (Hirabayashi 2017).</p><p>Роль <a href="#ns-g-S1-T88">митофузина 2</a> долго оставалась спорной. По данным de Brito и Scorrano (2008), удаление MFN2 в фибробластах мыши и клетках HeLa ослабляло связь ЭПР с митохондриями и захват Ca²⁺; по данным Filadi 2015, удаление MFN2 в нескольких типах клеток, напротив, усиливало сближение органелл и перенос Ca²⁺. Расхождение связывают со способами оценки сближения и с изменением формы митохондрий без MFN2. В 2023 году описаны ЭПР-специфические варианты сплайсинга гена MFN2: ERMIT2 находится на границе ЭПР и митохондрии и, связываясь с митофузинами митохондрии, удерживает органеллы рядом, а ERMIN2 участвует в организации ЭПР (Naón 2023). Поэтому в опытах с MFN2 нужно различать варианты белка и способ вмешательства; связь болезни с нарушением контакта этим ещё не установлена.</p><p>Число и площадь контактов меняются при изменении метаболических условий, при стрессе ЭПР и по ходу клеточного цикла — за счёт количества тетеринг-белков, их фосфорилирования и протеолиза.</p><div class="note trap"><strong>Типичная ошибка</strong> Любой белок, найденный в зоне контакта, удерживает этот контакт.<p class="trap-fix">Локализация в зоне контакта ещё не доказывает удержания. Нужно удалить белок и показать, что зазор растёт или площадь уменьшается, и проверить, меняется ли функция, зависящая от контакта. История MFN2 показывает, что разные способы оценки могут дать противоположные ответы.</p></div><div class="static-quiz"><h3>Две ранние работы (2008 и 2015 годов): после удаления митофузина 2 одна группа исследователей наблюдала ослабление связи ЭПР с митохондриями, другая — усиление. Какой вывод следует из этих двух работ?</h3><ol><li><b>А.</b> MFN2 — доказанный тетеринг-белок этого контакта <i>(неверный вариант)</i><br><span class="expl">В работе Filadi 2015 удаление MFN2 усиливало сближение органелл. Две работы дали противоположные результаты, поэтому по ним роль белка не установлена.</span></li><li><b>Б.</b> Роль MFN2 по этим данным не установлена <i>(верный вариант)</i><br><span class="expl">Результаты двух групп противоречат друг другу; расхождение связывают со способами оценки сближения и с изменением формы митохондрий без MFN2. Позже описан ЭПР-специфический вариант белка ERMIT2, который удерживает ЭПР у митохондрии (Naón 2023); это подтверждает участие продуктов гена MFN2 в удержании контакта, но причину расхождения двух ранних работ само по себе не объясняет.</span></li><li><b>В.</b> MFN2 участвует только в слиянии митохондрий <i>(неверный вариант)</i><br><span class="expl">MFN2 обнаружен и на мембране ЭПР, а его удаление в обеих работах меняло связь ЭПР с митохондриями — в разные стороны, но меняло.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1175088">Kornmann B. et al. 2009. An ER-mitochondria tethering complex revealed by a synthetic biology screen. Science</a></li><li><a href="https://doi.org/10.1126/science.aan6009">Hirabayashi Y. et al. 2017. ER-mitochondria tethering by PDZD8 regulates Ca²⁺ dynamics in mammalian neurons. Science</a></li><li><a href="https://doi.org/10.1073/pnas.1503191112">Fernández-Busnadiego R., Saheki Y., De Camilli P. 2015. Three-dimensional architecture of extended synaptotagmin-mediated endoplasmic reticulum-plasma membrane contact sites. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-061516-044932">Saheki Y., De Camilli P. 2017. Endoplasmic reticulum-plasma membrane contact sites. Annu Rev Biochem</a></li><li><a href="https://doi.org/10.1038/nature07534">de Brito O. M., Scorrano L. 2008. Mitofusin 2 tethers endoplasmic reticulum to mitochondria. Nature</a></li><li><a href="https://doi.org/10.1073/pnas.1504880112">Filadi R. et al. 2015. Mitofusin 2 ablation increases endoplasmic reticulum-mitochondria coupling. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1016/j.cell.2013.09.056">Mesmin B. et al. 2013. A four-step cycle driven by PI(4)P hydrolysis directs sterol/PI(4)P exchange by the ER-Golgi tether OSBP. Cell</a></li><li><a href="https://doi.org/10.1126/science.adh9351">Naón D. et al. 2023. Splice variants of mitofusin 2 shape the endoplasmic reticulum and tether it to mitochondria. Science</a></li></ul><p>ERMES — дрожжи Saccharomyces cerevisiae, синтетический скрининг (Kornmann 2009). PDZD8 — клетки HeLa и нейроны коры мыши (Hirabayashi 2017). E-Syt — криоэлектронная томография клеток COS-7 с избытком E-Syt (Fernández-Busnadiego 2015). STIM1–Orai1 и E-Syt — обзор Saheki и De Camilli 2017. MFN2: de Brito и Scorrano 2008 — фибробласты мыши и клетки HeLa; Filadi 2015 — несколько типов клеток, морфология и перенос Ca²⁺ (для обеих работ прочитаны рефераты); варианты ERMIT2 и ERMIN2 — клетки HeLa и печень мыши (Naón 2023, прочитан реферат). Таблица — сводка данных.</p></details></article><article class="card print-unit" id="ns-lipid-transfer"><div class="eyebrow">Контактные сайты · шаг 24 из 30</div><h2>Как липид переносится через контакт против градиента</h2><p class="lead">OSBP переносит холестерин из ЭПР в аппарат Гольджи в обмен на PI4P. Перенос сопряжён с обратным переносом PI4P и его гидролизом в ЭПР, а PI-4-киназа восстанавливает PI4P на Гольджи за счёт ATP.</p><ol class="mech"><li><a href="#ns-g-S1-T74">OSBP</a> связывается PH-доменом с PI4P транс-Гольджи и мотивом FFAT с VAP на ЭПР, а его домен ORD переносит липиды между мембранами.</li><li>За один цикл молекула холестерина переходит из ЭПР в Гольджи, а молекула PI4P — обратно; в ЭПР PI4P гидролизует фосфатаза SAC1.</li><li><a href="#ns-g-S1-T79">PI4KIIIβ</a> за счёт ATP создаёт <a href="#ns-g-S1-T75">контрградиент PI4P</a>; сам OSBP ATP не гидролизует.</li></ol><p>Большая часть липидов синтезируется в ЭПР, а нужны они всем мембранам; холестерина в транс-Гольджи и плазматической мембране намного больше, чем в ЭПР. Часть липидов доставляют пузырьки, но через контакты идёт и <a href="#ns-g-S1-T73">невезикулярный перенос</a>: липид-транспортный белок извлекает молекулу липида из мембраны в гидрофобный карман и отдаёт её соседней мембране.</p><p>OSBP переносит холестерин против градиента благодаря обмену (Mesmin 2013). Белок связан одновременно с двумя мембранами, принимает холестерин в ЭПР и отдаёт его в Гольджи, а обратно переносит PI4P. В ЭПР PI4P гидролизует фосфатаза SAC1, поэтому его там мало; на Гольджи PI-4-киназа синтезирует PI4P заново, расходуя ATP. Так поддерживается контрградиент PI4P — постоянный перепад от Гольджи к ЭПР, который и движет обмен. Без синтеза PI4P перенос затухает, без стока в ЭПР обмен приближается к равновесию. Энергетически значим весь цикл: ATP расходуется при синтезе PI4P киназой, а сопряжённые обратный перенос PI4P и его гидролиз в ЭПР делают обмен направленным; по формулировке Mesmin 2013, гидролиз PI4P движет перенос стерола.</p><p>Масштаб цикла велик: по оценке Mesmin 2017, OSBP расходует около половины всего клеточного PI4P, и этот расход зависит от количества переносимого холестерина. В клетках RPE-1 ингибитор <a href="#ns-g-S1-T80">OSW-1</a> повышал сигнал PI4P в транс-Гольджи примерно в 5 раз, а холестерин накапливался в ЭПР и липидных каплях.</p><p>Тот же принцип используют родственные белки с другим грузом. <a href="#ns-g-S1-T77">ORP5 и ORP8</a> в контактах ЭПР с плазматической мембраной обменивают фосфатидилсерин на PI4P и обогащают плазматическую мембрану фосфатидилсерином (Chung 2015). <a href="#ns-g-S1-T78">CERT</a> переносит церамид из ЭПР в аппарат Гольджи, где из него синтезируется сфингомиелин (Hanada 2003); с Гольджи CERT связывается через PI4P, но обмена на PI4P не выполняет.</p><div class="note trap"><strong>Типичная ошибка</strong> Энергию для переноса холестерина даёт одна стадия цикла: либо синтез PI4P за счёт ATP, либо его гидролиз в ЭПР.<p class="trap-fix">Энергетически значим весь цикл. PI-4-киназа восстанавливает PI4P на Гольджи за счёт ATP, OSBP переносит PI4P в ЭПР в обмен на холестерин, а SAC1 гидролизует его там; гидролиз делает обмен направленным (Mesmin 2013), синтез восполняет расходуемый PI4P. Без синтеза перенос затухает, без гидролиза обмен приближается к равновесию. Сам OSBP ATP не гидролизует.</p></div><div class="static-quiz"><h3>Почему OSBP может переносить холестерин из ЭПР в аппарат Гольджи, где холестерина больше, хотя сам не гидролизует ATP?</h3><ol><li><b>А.</b> Холестерин идёт по градиенту: в ЭПР его больше <i>(неверный вариант)</i><br><span class="expl">В ЭПР холестерина меньше, чем в транс-Гольджи; перенос идёт против его градиента.</span></li><li><b>Б.</b> OSBP гидролизует ATP в каждом цикле переноса <i>(неверный вариант)</i><br><span class="expl">АТФазной активности у OSBP нет; ATP расходует PI-4-киназа, синтезирующая PI4P.</span></li><li><b>В.</b> Перенос сопряжён с обратным переносом PI4P <i>(верный вариант)</i><br><span class="expl">Обмен идёт один к одному: холестерин движется против своего градиента, PI4P — по своему. Перепад PI4P создаёт PI-4-киназа за счёт ATP и поддерживает SAC1, гидролизующая PI4P в ЭПР.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2013.09.056">Mesmin B. et al. 2013. A four-step cycle driven by PI(4)P hydrolysis directs sterol/PI(4)P exchange by the ER-Golgi tether OSBP. Cell</a></li><li><a href="https://doi.org/10.15252/embj.201796687">Mesmin B. et al. 2017. Sterol transfer, PI4P consumption, and control of membrane lipid order by endogenous OSBP. EMBO J</a></li><li><a href="https://doi.org/10.1126/science.aab1370">Chung J. et al. 2015. PI4P/phosphatidylserine countertransport at ORP5- and ORP8-mediated ER-plasma membrane contacts. Science</a></li><li><a href="https://doi.org/10.1038/nature02188">Hanada K. et al. 2003. Molecular machinery for non-vesicular trafficking of ceramide. Nature</a></li><li><a href="https://doi.org/10.1038/nchembio.625">Burgett A. W. G. et al. 2011. Natural products reveal cancer cell dependence on oxysterol-binding proteins. Nat Chem Biol</a></li></ul><p>Четырёхстадийный цикл OSBP — реконструкция на липосомах и опыты на клетках HeLa (Mesmin 2013; прочитан реферат). Расход PI4P, действие OSW-1 (20 нМ) и 25-гидроксихолестерина — клетки RPE-1, зонд PI4P и масс-спектрометрия (Mesmin 2017; прочитаны реферат и изложение результатов). ORP5/ORP8 — клетки HeLa и фибробласты мыши (Chung 2015, полный текст). CERT — клетки яичника китайского хомячка LY-A (Hanada 2003, реферат). Числа схемы — учебная модель практикума (вопрос 4, продвинутый уровень); подавление SAC1 и VAP в модели неполное: остаточная активность SAC1 3 % и остаточное число мостиков VAP–OSBP 8 %; от этих допущений зависят числа 49 и 35 %.</p></details></article><article class="card print-unit" id="ns-calcium-contact"><div class="eyebrow">Контактные сайты · шаг 25 из 30</div><h2>Почему контакт с ЭПР ускоряет захват Ca²⁺ митохондрией</h2><p class="lead">При открытии рецепторов IP₃ в зазоре контакта ЭПР — митохондрия возникает микродомен Ca²⁺ порядка 10 мкМ. Канал MCU с регулятором MICU1 открывается при концентрации Ca²⁺ выше примерно 1 мкМ, поэтому захват идёт прежде всего у контакта.</p><ol class="mech"><li>Ca²⁺ выходит из ЭПР через IP₃R в зазор, проходит наружную мембрану через <a href="#ns-g-S1-T82">VDAC</a> и входит в матрикс через MCU по <a href="#ns-g-S1-T03">электрохимическому градиенту</a>.</li><li><a href="#ns-g-S1-T81">MICU1</a> удерживает MCU закрытым при низком Ca²⁺ и обеспечивает кооперативное открытие при высоком; отсюда кажущийся порог около 1 мкМ.</li><li>Ca²⁺ матрикса активирует дегидрогеназы цикла Кребса; работу по накоплению Ca²⁺ совершает дыхательная цепь, создавшая <a href="#ns-g-S1-T04">Δψ</a>.</li></ol><p>Рецепторы IP₃ есть и в зоне контакта ЭПР с митохондрией. Когда они открываются, Ca²⁺ из просвета ЭПР входит в узкий зазор и достигает митохондрии раньше, чем рассеется по цитозолю и свяжется с буферами. Так возникает <a href="#ns-g-S1-T83">микродомен</a>: в клетках RBL-2H3 сенсор, закреплённый в зазоре, показал подъём Ca²⁺ в среднем около 9 мкМ, в части клеток — до 25 мкМ, и авторы считают эти значения нижней оценкой (Csordás 2010); по данным Giacomello 2010, у небольших участков поверхности митохондрий Ca²⁺ был в 5–10 раз выше, чем в остальном цитозоле.</p><p>Движущая сила для входа Ca²⁺ в матрикс велика при любой концентрации в цитозоле, и MCU — высокоселективный канал (Kirichok 2004). Однако захват ведёт себя так, будто у него низкое сродство к Ca²⁺. Причина — регулятор MICU1 (Csordás 2013): примерно до 0,5–1 мкМ он удерживает канал закрытым, выше обеспечивает крутое, кооперативное открытие. Без MICU1 порог снижается: митохондрии гепатоцитов мыши и клеток HeLa захватывали Ca²⁺ уже при 0,3–0,4 мкМ, а рост захвата с повышением Ca²⁺ был менее крутым.</p><p>Поэтому микродомен делает захват быстрым и избирательным по месту: митохондрия отвечает на выброс Ca²⁺ из ЭПР и почти не отвечает на небольшие подъёмы среднего уровня. Контакт не служит единственным условием входа: при подъёме Ca²⁺ во всём цитозоле выше порога MCU работает и вне контактов. Ca²⁺ матрикса активирует пируватдегидрогеназный комплекс, изоцитратдегидрогеназу и 2-оксоглутаратдегидрогеназу (Denton 2009) и тем связывает сигнал с окислением субстратов. Избыточный захват опасен: при искусственном сужении зазора митохондрии легче перегружались Ca²⁺ (Csordás 2006).</p><div class="note trap"><strong>Типичная ошибка</strong> MCU — насос, который закачивает Ca²⁺ в матрикс против градиента.<p class="trap-fix">MCU — канал: Ca²⁺ входит через него в матрикс по электрохимическому градиенту, потому что матрикс заряжен отрицательно. Накопление Ca²⁺ в матриксе выше цитозольного уровня обеспечивает дыхательная цепь, создавшая Δψ.</p></div><div class="static-quiz"><h3>Свободный Ca²⁺ в матриксе стал выше, чем в цитозоле. Что совершило работу по его накоплению?</h3><ol><li><b>А.</b> Дыхательная цепь, создавшая Δψ митохондрии <i>(верный вариант)</i><br><span class="expl">Ca²⁺ входит через MCU по электрохимическому градиенту: отрицательный заряд матрикса перевешивает разность концентраций. Этот потенциал создаёт дыхательная цепь, перенося протоны из матрикса.</span></li><li><b>Б.</b> Канал MCU, расходующий ATP на перенос <i>(неверный вариант)</i><br><span class="expl">MCU — канал, ATP он не гидролизует; Ca²⁺ проходит через него только по электрохимическому градиенту.</span></li><li><b>В.</b> Регулятор MICU1, связывающий ионы Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">MICU1 меняет вероятность открытия канала, но работы по переносу не совершает: связывание Ca²⁺ EF-мотивами — регуляция, а не перенос.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2010.06.029">Csordás G. et al. 2010. Imaging interorganelle contacts and local calcium dynamics at the ER-mitochondrial interface. Mol Cell</a></li><li><a href="https://doi.org/10.1016/j.molcel.2010.04.003">Giacomello M. et al. 2010. Ca²⁺ hot spots on the mitochondrial surface are generated by Ca²⁺ mobilization from stores, but not by activation of store-operated Ca²⁺ channels. Mol Cell</a></li><li><a href="https://doi.org/10.1038/nature02246">Kirichok Y., Krapivinsky G., Clapham D. E. 2004. The mitochondrial calcium uniporter is a highly selective ion channel. Nature</a></li><li><a href="https://doi.org/10.1016/j.cmet.2013.04.020">Csordás G. et al. 2013. MICU1 controls both the threshold and cooperative activation of the mitochondrial Ca²⁺ uniporter. Cell Metab</a></li><li><a href="https://doi.org/10.1016/j.bbabio.2009.01.005">Denton R. M. 2009. Regulation of mitochondrial dehydrogenases by calcium ions. Biochim Biophys Acta</a></li><li><a href="https://doi.org/10.1083/jcb.200604016">Csordás G. et al. 2006. Structural and functional features and significance of the physical linkage between ER and mitochondria. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200608073">Szabadkai G. et al. 2006. Chaperone-mediated coupling of endoplasmic reticulum and mitochondrial Ca²⁺ channels. J Cell Biol</a></li></ul><p>Ca²⁺ в зазоре: Csordás 2010 — клетки RBL-2H3, сенсор на индуцируемой привязке между ЭПР и митохондрией, стимуляция через рецепторы IP₃ (полный текст); Giacomello 2010 — культивируемые клетки человека, сенсор на наружной мембране митохондрии (прочитан реферат). MICU1: Csordás 2013 — гепатоциты мыши после подавления MICU1 in vivo и клетки HeLa (полный текст). Перегрузка при сужении зазора — клетки RBL-2H3 с искусственной привязкой (Csordás 2006, полный текст). Числа схемы — учебная модель практикума (вопрос 4, базовый уровень): Ca²⁺ в зазоре 15 мкМ, кривые захвата — уравнение Хилла. Ca²⁺ в матриксе рассчитан по условному балансу: 0,1 мкМ + 20 мкМ × скорость захвата (доля от максимальной); выведение Ca²⁺ из матрикса, буферирование и изменение Δψ отдельно не моделируются, поэтому это иллюстрация, а не прогноз концентрации в опыте.</p></details></article><article class="card print-unit" id="ns-area-flux"><div class="eyebrow">Контактные сайты · шаг 26 из 30</div><h2>Почему рост площади контакта не означает роста переноса</h2><p class="lead">Контакт сокращает расстояние, но сам ничего не переносит: поток задают переносчики, движущая сила и буферы. О росте переноса при росте площади контакта можно судить, только если перенос измерен отдельно.</p><ol class="mech"><li>Поток через контакт ограничивает самая медленная стадия: синтез PI4P, его гидролиз в ЭПР, число и занятость переносчиков или каналов.</li><li>Если поток ограничен синтезом PI4P, дополнительные мостики VAP–OSBP почти не увеличивают перенос холестерина.</li><li>Слишком тесное сближение может мешать переносу; оптимальная ширина зазора — гипотеза, подтверждённая лишь отдельными опытами.</li></ol><p>Сближение мембран меняет условия переноса, но не создаёт его. Поток через контакт определяется числом и занятостью переносчиков и каналов в зоне сближения, движущей силой, буферами и тем, насыщен ли принимающий компартмент. Из уменьшения расстояния не следует автоматически ни рост концентрации, ни ускорение переноса.</p><p>Модель цикла OSBP показывает это численно. На каждую перенесённую молекулу холестерина нужна молекула PI4P, синтезированная PI-4-киназой. Если вдвое увеличить число мостиков VAP–OSBP при прежней активности PI4KIIIβ и SAC1, перенос вырастет лишь на 9 %, а PI4P в Гольджи снизится: OSBP быстрее извлекает уже имеющийся PI4P. Удвоение синтеза PI4P, напротив, почти удваивает перенос. Заметно зависит от площади перенос лишь тогда, когда мостиков мало: при половинной площади он снижается до 86 %.</p><p>С геометрией связаны и ограничения другого рода. Слишком узкий зазор не вмещает крупные белковые комплексы. В клетках RBL-2H3 искусственные привязки разной длины меняли подъём Ca²⁺ в зазоре двухфазно: самые тесные контакты не были самыми эффективными (Csordás 2010). Предположение, что для каждого вида переноса существует оптимальная ширина зазора, систематически не проверено и остаётся гипотезой.</p><p>Отсюда правило чтения работ: сообщение об увеличении площади контактов при болезни или воздействии — ещё не сообщение об увеличении переноса (Calì 2025). Площадь может меняться и как следствие изменения обмена веществ.</p><div class="note trap"><strong>Типичная ошибка</strong> Если площадь контакта выросла вдвое, перенос через контакт тоже вырос вдвое.<p class="trap-fix">Поток задаёт самая медленная стадия: синтез PI4P, его гидролиз, число переносчиков или каналов, движущая сила. Если ограничивает не площадь, её рост почти не меняет перенос; перенос нужно измерить отдельно.</p></div><div class="static-quiz"><h3>По данным ЭМ площадь контактов ЭПР — митохондрия в клетках после некоторого воздействия вдвое больше, чем в контроле. Что можно заключить о переносе Ca²⁺ в митохондрии?</h3><ol><li><b>А.</b> Перенос Ca²⁺ вырос примерно вдвое <i>(неверный вариант)</i><br><span class="expl">Пропорциональный рост предполагает, что поток ограничен площадью. Его могут ограничивать каналы, MICU1, выход Ca²⁺ из ЭПР или буферы.</span></li><li><b>Б.</b> Без измерения переноса вывод сделать нельзя <i>(верный вариант)</i><br><span class="expl">ЭМ измеряет геометрию. Чтобы судить о переносе, нужно при одинаковом стимуле измерить скорость захвата или Ca²⁺ в матриксе (Calì 2025).</span></li><li><b>В.</b> Перенос Ca²⁺ снизился: тесный контакт мешает <i>(неверный вариант)</i><br><span class="expl">Двухфазная зависимость от ширины зазора показана для отдельных конструкций; площадь не равна ширине, и без измерения вывод о снижении так же необоснован.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2010.06.029">Csordás G. et al. 2010. Imaging interorganelle contacts and local calcium dynamics at the ER-mitochondrial interface. Mol Cell</a></li><li><a href="https://doi.org/10.1038/s41580-025-00864-x">Calì T. et al. 2025. Key challenges and recommendations for defining organelle membrane contact sites. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.15252/embj.201796687">Mesmin B. et al. 2017. Sterol transfer, PI4P consumption, and control of membrane lipid order by endogenous OSBP. EMBO J</a></li></ul><p>Зависимость переноса от площади — учебная модель практикума (вопрос 4, продвинутый уровень): «площадь» — число мостиков VAP–OSBP, «синтез вдвое выше» — учебное допущение. Двухфазная зависимость подъёма Ca²⁺ в зазоре от длины искусственной привязки — клетки RBL-2H3, Csordás 2010 (полный текст). Рекомендация отделять площадь от переноса — Calì 2025 (обзор, полный текст).</p></details></article><article class="card print-unit" id="ns-coordination"><div class="eyebrow">Контактные сайты · шаг 27 из 30</div><h2>Что ещё координирует контакт и чем он не является</h2><p class="lead">Контакты отмечают места деления митохондрий и сводят в одном месте синтез липидов, Ca²⁺-сигнал и энергетический обмен. Контакт не равен ни везикулярному транспорту, ни слиянию органелл, ни аутофагии.</p><ol class="mech"><li>Трубочка ЭПР охватывает митохондрию в месте будущего деления ещё до того, как туда привлекается Drp1.</li><li>Rab7, связанный с GTP, поддерживает контакт митохондрии с лизосомой; после гидролиза GTP на Rab7 контакт расходится.</li><li>При контакте целостность мембран сохраняется, содержимое не смешивается, партнёр не разрушается.</li></ol><p>Место деления митохондрии часто задаёт контакт. В клетках дрожжей и млекопитающих митохондрия делилась там, где её охватывала трубочка ЭПР; сужение начиналось ещё до привлечения динамин-подобного белка Drp1 (Friedman 2011). Контакт с лизосомой тоже отмечает точку деления. Его образованию способствует Rab7, связанный с GTP, а расхождению — гидролиз GTP на Rab7; этот гидролиз стимулирует белок TBC1D15, который привлекается к митохондрии белком FIS1 (Wong 2018).</p><p>Контакт сводит в одном месте синтез липидов, Ca²⁺-сигнал и энергетический обмен, поэтому изменение числа, состава или геометрии контактов может менять несколько потоков одновременно. Какие из них изменились, устанавливают отдельными измерениями: если поток ограничивает другое звено, он может почти не измениться. Изменения контактов описаны при нейродегенеративных болезнях, нарушениях обмена и опухолевом росте, но площадь контакта может быть и причиной, и следствием изменения метаболизма; важно, измерена ли функция или только морфология.</p><p>Пример осторожного вывода — ген MFN2. Мутации в нём вызывают наследственную моторно-сенсорную нейропатию Шарко — Мари — Тута типа 2A (Züchner 2004). Белок участвует в слиянии митохондрий, а ЭПР-специфический вариант того же гена ERMIT2 удерживает ЭПР у митохондрии (Naón 2023). Продукты гена выполняют несколько функций, поэтому приписывать болезнь только нарушению контактов нет оснований.</p><p>Контакт легко спутать с тремя другими процессами. При везикулярном транспорте груз упакован в пузырёк, который сливается с мембраной-получателем. При слиянии органелл мембраны объединяются и содержимое смешивается. При аутофагии органелла-партнёр разрушается. При контакте мембраны сохраняются, содержимое не смешивается, а органелла-партнёр не разрушается.</p><div class="note trap"><strong>Типичная ошибка</strong> Контакт митохондрии с лизосомой — начало её разрушения в лизосоме.<p class="trap-fix">Контакты митохондрий с лизосомами образуются и в здоровых клетках и отличаются от поглощения повреждённых митохондрий: обе органеллы сохраняют целостность, а контакт расходится после гидролиза GTP на Rab7 (Wong 2018).</p></div><div class="static-quiz"><h3>В клетках экспрессировали Rab7 Q67L — форму, которая связывает GTP, но почти не гидролизует его. Как изменится длительность контактов митохондрий с лизосомами?</h3><ol><li><b>А.</b> Сократится: Rab7-GTP разрывает контакт <i>(неверный вариант)</i><br><span class="expl">Rab7, связанный с GTP, способствует образованию контакта; разрыв требует гидролиза GTP.</span></li><li><b>Б.</b> Не изменится: Rab7 влияет только на лизосому <i>(неверный вариант)</i><br><span class="expl">Rab7 на лизосоме участвует в связи с митохондрией: от его состояния зависит, сколько длится контакт.</span></li><li><b>В.</b> Увеличится: без гидролиза GTP он не расходится <i>(верный вариант)</i><br><span class="expl">Контакт расходится после гидролиза GTP на Rab7; этот гидролиз стимулирует белок TBC1D15. В клетках с Rab7 Q67L контакты длились дольше, а митохондрии делились реже (Wong 2018).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1207385">Friedman J. R. et al. 2011. ER tubules mark sites of mitochondrial division. Science</a></li><li><a href="https://doi.org/10.1038/nature25486">Wong Y. C., Ysselstein D.,
