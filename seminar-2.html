<title>Семинар 2 · Транспорт, сети органелл, конденсаты и полярность — Кафедра биологии и генетики, Медицинский университет Петровского</title>

<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

незин-1 автоингибирован: хвост складывается на моторные домены и подавляет и гидролиз ATP, и связывание с треком. С митохондрией кинезин-1 связывается через адаптеры TRAK и белок наружной мембраны Miro. В нейроне кинезин-1 избирательно переносит грузы в аксон (Nakata и Hirokawa 2003).", "gn_dyn": "Цитоплазматический динеин", "g_dyn": "Практически единственный мотор, переносящий органеллы к минус-концу микротрубочки. Одиночный динеин автоингибирован и процессивно не движется; процессивное движение начинается в комплексе динеин — динактин — адаптер (BICD2, HOOK3 и др.; McKenney 2014). Разные адаптеры включают в комплекс одну или две молекулы динеина и потому задают разную силу и скорость (Urnavicius 2018). LIS1 и NDE1 регулируют динеин, но адаптерами груза не являются.", "gn_myo5": "Миозин V", "g_myo5": "Процессивный мотор, движущийся по актиновому филаменту к оперённому концу шагами около 36 нм (Sweeney 2018). Переносит груз на коротком последнем участке пути — в кортикальном слое актина под плазматической мембраной; свободный миозин V автоингибирован складыванием хвоста. Изоформа миозин Vb участвует в апикальной доставке в эпителиальных клетках (вопрос 4).", "gn_noc": "Нокодазол", "g_noc": "Соединение, которое связывает тубулин и вызывает разборку микротрубочек. При разборке трека останавливается весь транспорт по микротрубочкам — и к плюс-, и к минус-концу, поэтому нокодазол показывает зависимость процесса от микротрубочек, но не указывает, какой мотор участвует. Микротрубочки аксона частично устойчивы к нокодазолу и разбираются не полностью; длительная обработка нарушает и форму клетки, и положение органелл, поэтому в экспериментах её ограничивают минутами — часами.", "s1b_seg_t": "Участок клетки", "s1b_seg_cell": "клетка с центросомой", "s1b_seg_axon": "аксон", "s1b_seg_dend": "дендрит", "s1b_mot_t": "Мотор на грузе", "s1b_mot_none": "нет", "s1b_mot_kin": "кинезин-1", "s1b_mot_dyn": "динеин с динактином и адаптером", "s1b_note": "Показан выделенный рамкой участок: пять треков-микротрубочек со знаками концов. Доли микротрубочек, обращённых плюс-концом наружу: в клетке с центросомой — 100 %, в аксоне — 98 %, в дендрите — 60 % (учебное значение по данным Baas 1988 и Stepanova 2003).", "s1b_ic_cs": "центросома", "s1b_ic_slab": "участок", "s1b_ic_soma": "тело", "s1b_ic_term": "окончание", "s1b_ic_dend": "дендрит", "s1b_near_cell": "центр (у ядра)", "s1b_far_cell": "периферия", "s1b_near_axon": "тело нейрона", "s1b_far_axon": "окончание аксона", "s1b_near_dend": "тело нейрона", "s1b_far_dend": "дальний конец дендрита", "s1b_lg_kin": "кинезин-1", "s1b_lg_dyn": "динеин", "s1b_lg_cargo": "груз", "s1b_zones_t": "Распределение грузов по пяти зонам участка (учебная модель)", "s1b_dir_plus": "к плюс-концу", "s1b_dir_minus": "к минус-концу", "s1b_dir_none": "нет направленного движения", "s1b_r_dir": "Направление относительно микротрубочки", "s1b_r_dir_s": "задаётся устройством мотора", "s1b_r_out": "Пробеги наружу", "s1b_r_out_s_cell": "к периферии", "s1b_r_out_s_axon": "к окончанию аксона", "s1b_r_out_s_dend": "к дальнему концу дендрита", "s1b_r_none": "пробегов нет", "s1b_r_far_cell": "Грузы в периферической зоне", "s1b_r_far_axon": "Грузы в зоне у окончания аксона", "s1b_r_far_dend": "Грузы в зоне у дальнего конца дендрита", "s1b_r_note": "При равномерном распределении в каждой из пяти зон — 20 % грузов. Числа условны: модель показывает направление и знак смещения, а не измеренные доли.", "s1b_c_cell_none": "Груз без мотора: направленных пробегов нет, грузы распределены по участку равномерно ({z} % в периферической зоне).", "s1b_c_cell_none_z": "Трек задаёт линию и направление, но сам груз не перемещает.", "s1b_c_cell_kin": "Кинезин-1 движется к плюс-концам, которые в этой клетке обращены к периферии: {f} % пробегов направлены наружу, в периферической зоне — {z} % грузов.", "s1b_c_cell_kin_z": "Направленный перенос собирает груз в нужной области клетки быстрее, чем это сделала бы диффузия.", "s1b_c_cell_dyn": "Динеин движется к минус-концам, закреплённым у центросомы: пробеги направлены к центру, в периферической зоне остаётся {z} % грузов.", "s1b_c_cell_dyn_z": "Так у центра клетки собираются, например, лизосомы в среде без питательных веществ и мембраны аппарата Гольджи.", "s1b_c_axon_none": "Груз без мотора перемещается в аксоне только диффузией: грузы распределены равномерно ({z} % в зоне у окончания).", "s1b_c_axon_none_z": "На расстояниях в сотни микрометров диффузия слишком медленна, чтобы доставить крупный груз за нужное время.", "s1b_c_axon_kin": "В аксоне почти все плюс-концы обращены к окончанию, и кинезин-1 переносит груз от тела клетки к синапсу: {f} % пробегов направлены наружу, у окончания — {z} % грузов.", "s1b_c_axon_kin_z": "Так к синапсам доставляются синаптические пузырьки, митохондрии и мембранные белки (антероградный транспорт).", "s1b_c_axon_dyn": "Динеин движется к минус-концам, которые в аксоне обращены к телу клетки: пробеги направлены к телу нейрона, у окончания остаётся {z} % грузов.", "s1b_c_axon_dyn_z": "Ретроградный транспорт возвращает в тело клетки эндосомы, автофагосомы и связанные с ними сигнальные белки.", "s1b_c_dend_none": "Груз без мотора: в дендрите грузы распределены равномерно ({z} % в зоне у дальнего конца).", "s1b_c_dend_none_z": "Без мотора направленного переноса нет ни в одном участке клетки.", "s1b_c_dend_kin": "В дендрите треки ориентированы смешанно, и кинезин-1 движется к плюс-концу каждого из них: {f} % пробегов направлены наружу, остальные — к телу нейрона; у дальнего конца — {z} % грузов.", "s1b_c_dend_kin_z": "Куда в клетке попадёт груз, определяет не только мотор, но и ориентация треков в данном участке.", "s1b_c_dend_dyn": "Динеин движется к минус-концу каждого трека: в дендрите {f} % его пробегов направлены наружу — по микротрубочкам, обращённым минус-концом к дальнему концу, — остальные к телу нейрона.", "s1b_c_dend_dyn_z": "При смешанной ориентации треков минус-концевой мотор может переносить груз и в глубь отростка.", "s1b_take": "Направление относительно концов микротрубочки задаёт мотор: кинезин-1 движется к плюс-концу, динеин — к минус-концу. Направление относительно частей клетки задаёт ориентация треков: в клетке с центросомой и в аксоне плюс-концы обращены наружу (в аксоне — почти все), в дендрите ориентация смешанная. Без мотора груз перемещается только диффузией, и направленного переноса нет.", "p1b_1_q": "В клетке с центросомой к грузам присоединили кинезин-1. Как изменится распределение грузов по зонам участка?", "p1b_1_o1": "Грузы накопятся у периферии клетки", "p1b_1_o2": "Грузы накопятся у центра, вблизи ядра", "p1b_1_o3": "Распределение останется равномерным", "p1b_1_e": "Кинезин-1 движется к плюс-концу микротрубочки, а в клетке с центросомой плюс-концы обращены к периферии. Поэтому все пробеги направлены наружу, и в периферической зоне оказывается 42 % грузов против 20 % без мотора (учебная модель).", "p1b_1_w2": "К центру клетки грузы переносит динеин, который движется к минус-концам у центросомы. Кинезин-1 идёт в противоположную сторону — к плюс-концам на периферии.", "p1b_1_w3": "Равномерное распределение получается без мотора, когда груз перемещается только диффузией. Кинезин-1 создаёт направленные пробеги к плюс-концам.", "p1b_2_q": "В аксоне к грузам присоединили цитоплазматический динеин с динактином и адаптером. В какой зоне участка будут накапливаться грузы?", "p1b_2_o1": "В зоне у окончания аксона", "p1b_2_o2": "В зоне у тела нейрона", "p1b_2_o3": "Равномерно во всех зонах", "p1b_2_e": "В аксоне почти все микротрубочки обращены плюс-концом к окончанию, значит, минус-концы обращены к телу нейрона. Динеин движется к минус-концу, поэтому почти все его пробеги (98 % в модели) направлены к телу нейрона — это ретроградный транспорт, — и в ближней к телу зоне оказывается 41 % грузов.", "p1b_2_w1": "К окончанию аксона груз переносит кинезин, движущийся к плюс-концу. Динеин движется к минус-концам, а в аксоне они обращены к телу клетки.", "p1b_2_w3": "Равномерным распределение было бы без направленного переноса. В аксоне почти все треки ориентированы одинаково, поэтому пробеги динеина направлены в одну сторону.", "p1b_3_q": "Мысленный эксперимент: грузы в дендрите принудительно соединили с кинезином-1. Как распределятся пробеги грузов по направлению?", "p1b_3_o1": "Почти все — к дальнему концу дендрита", "p1b_3_o2": "Почти все — к телу нейрона", "p1b_3_o3": "В обе стороны, немного чаще наружу", "p1b_3_e": "Кинезин-1 по-прежнему движется к плюс-концу, но в дендрите треки ориентированы смешанно: в модели 60 % плюс-концов обращены наружу, 40 % — к телу нейрона. Так же распределены и пробеги; у дальнего конца 24 % грузов вместо 20 %. В живом нейроне кинезин-1 (KIF5) переносит грузы в аксон (Nakata и Hirokawa 2003).", "p1b_3_w1": "Так было бы, если бы все микротрубочки дендрита были обращены плюс-концом наружу, как в аксоне. В дендрите часть треков обращена плюс-концом к телу клетки.", "p1b_3_w2": "В дендрите микротрубочки ориентированы смешанно, поэтому и минус-концевой мотор не переносил бы все грузы к телу нейрона. В заданном эксперименте груз связан с кинезином-1: он движется к плюс-концам, большинство которых в модели обращено от тела клетки.", "p1b_4_q": "Кинезин-1, переносивший груз в клетке с центросомой к периферии, оказался на грузе в аксоне. Как изменится направление его движения относительно микротрубочки?", "p1b_4_o1": "Не изменится: мотор по-прежнему движется к плюс-концу", "p1b_4_o2": "Изменится: в аксоне мотор движется к минус-концу", "p1b_4_o3": "Станет случайным: мотор движется в обе стороны", "p1b_4_e": "Направление относительно концов филамента задаёт устройство мотора, а не клетка: кинезин-1 всегда движется к плюс-концу. В аксоне плюс-концы обращены к окончанию, поэтому тот же мотор переносит груз от тела клетки к синапсу.", "p1b_4_w2": "Минус-концевым мотором кинезин-1 не становится ни в одной клетке. Меняется только то, куда в данном участке обращены плюс-концы треков.", "p1b_4_w3": "Пробеги в обе стороны получаются при смешанной ориентации треков, как в дендрите. В аксоне почти все треки ориентированы одинаково, а сам мотор направления не меняет.", "p1b_5_q": "В аксоне грузы отсоединили от кинезина-1, и они остались без мотора. Как изменится доля грузов в зоне у окончания аксона?", "p1b_5_o1": "Не изменится: груз продолжит путь по треку", "p1b_5_o2": "Снизится до доли в остальных зонах", "p1b_5_o3": "Станет выше, чем с мотором", "p1b_5_e": "Без мотора груз перемещается только диффузией, у которой нет направления. Грузы распределяются равномерно: у окончания 20 % вместо 41 %. Трек сам по себе груз не перемещает.", "p1b_5_w1": "Без мотора груз не может продолжить путь по треку: микротрубочка задаёт лишь линию и направление, а движение создаёт мотор, гидролизующий ATP.", "p1b_5_w3": "Диффузия не создаёт направленного пробега и не может собрать груз у окончания сильнее, чем мотор. Накопление в одной зоне требует направленного переноса или удерживающего белка.", "s1a_g_t": "Нейроны гиппокампа в культуре", "s1a_g_miro": "Miro без связывания Ca²⁺", "s1a_g_snph": "без синтафилина", "s1a_g_dyn": "динеин ослаблен", "s1a_d_t": "Воздействие", "s1a_d0": "нет", "s1a_dnoc": "нокодазол", "s1a_act": "Активность синапса с 2-й мин", "s1a_h_t": "Гипотеза двунаправленного движения", "s1a_h_tug": "перетягивание", "s1a_h_coord": "согласованное переключение", "s1a_soma": "← к телу нейрона", "s1a_term": "к окончанию аксона →", "s1a_zone_on": "активный синапс (Ca²⁺ повышен)", "s1a_zone_off": "синапс в покое", "s1a_lab_miro": "Miro (EF-мотивы)", "s1a_lab_snph": "синтафилин", "s1a_lab_kin": "кинезин-1", "s1a_lab_dyn": "динеин", "s1a_lab_noc": "нокодазол", "s1a_ky_t": "Кимограмма: линия — митохондрия; вертикальная — неподвижна, наклонная — движется", "s1a_ky_y": "время, мин", "s1a_ky_x": "положение в участке аксона, мкм", "s1a_r_mot": "Подвижные митохондрии (сдвинулись за 10 мин)", "s1a_r_ant": "Путь к окончанию аксона", "s1a_r_ant_s": "мкм в минуту, сумма по всем митохондриям участка", "s1a_r_ret": "Путь к телу нейрона", "s1a_r_ret_s": "мкм в минуту, сумма по всем митохондриям участка", "s1a_r_zone": "Неподвижных митохондрий в зоне синапса", "s1a_r_zone_s": "в начале → в конце записи", "s1a_r_note": "Учебная модель: 60 митохондрий в участке длиной 150 мкм, запись 10 мин; доли подвижных митохондрий подобраны по данным Kang 2008 для нейронов гиппокампа мыши. Остальные числа условны. Во всех условиях модель использует одну и ту же исходную расстановку митохондрий. Границы участка в расчёте периодические: митохондрия, вышедшая за один край, возвращается с другого. Это условный участок длинного аксона, а не путь от тела нейрона до окончания.", "s1a_c_base": "Норма, без стимуляции: за 10 мин сдвинулись {m} % митохондрий, остальные закреплены на треках; путь к окончанию — {a} мкм/мин, к телу нейрона — {r} мкм/мин.", "s1a_c_base_z": "Подвижна примерно треть митохондрий аксона; остальные закреплены там, где расходуется ATP и нужно связывать Ca²⁺.", "s1a_c_stop": "Активность синапса повышает концентрацию Ca²⁺ в зоне, и проходящие через неё митохондрии останавливаются: неподвижных митохондрий в зоне стало {z1} вместо {z0}.", "s1a_c_stop_z": "Митохондрии задерживаются там, где выше расход ATP и поступление Ca²⁺.", "s1a_c_stop_weak": "Активность синапса включена, но за время записи в зоне остановилось мало митохондрий: неподвижных было {z0}, стало {z1}.", "s1a_c_stop_weak_z": "Число остановок зависит от того, сколько подвижных митохондрий прошло через активную зону.", "s1a_c_miro": "Miro без связывания Ca²⁺ по-прежнему соединяет митохондрию с кинезином-1: за 10 мин сдвинулись {m} % митохондрий, как в норме.", "s1a_c_miro_z": "EF-мотивы Miro нужны для остановки при повышении Ca²⁺, а не для самого движения.", "s1a_c_miro_act": "Miro не связывает Ca²⁺, поэтому при активности синапса остановок в зоне не прибавилось: неподвижных было {z0}, стало {z1}.", "s1a_c_miro_act_z": "Без Ca²⁺-сенсора митохондрии проходят мимо активного синапса, не задерживаясь.", "s1a_c_snph": "Без синтафилина митохондрии закрепляются редко: за 10 мин сдвинулись {m} % митохондрий, путь к окончанию — {a} мкм/мин, к телу нейрона — {r} мкм/мин.", "s1a_c_snph_z": "Синтафилин — якорный белок: он закрепляет митохондрию на микротрубочке и подавляет активность кинезина-1.", "s1a_c_snph_act": "Без синтафилина активность синапса почти не останавливает митохондрии: неподвижных в зоне было {z0}, стало {z1}.", "s1a_c_snph_act_z": "Для остановки нужны и Ca²⁺-сенсор Miro, и синтафилин, который подавляет мотор и закрепляет митохондрию на треке.", "s1a_c_noc": "Нокодазол вызвал разборку микротрубочек: подвижных митохондрий {m} %, все остаются там, где их застала обработка.", "s1a_c_noc_z": "Без трека не работают ни кинезин-1, ни динеин; нокодазол показывает зависимость от микротрубочек, но не указывает, какой мотор участвует.", "s1a_c_tug": "Мысленный эксперимент, гипотеза перетягивания: активность динеина снижена, и он слабее противодействует кинезину-1 — путь к окончанию {a} мкм/мин, к телу нейрона {r} мкм/мин.", "s1a_c_tug_z": "Гипотеза перетягивания предсказывает рост движения в сторону оставшегося мотора.", "s1a_c_coord": "Мысленный эксперимент, гипотеза согласованного переключения: при сниженной активности динеина митохондрия реже становится подвижной — сдвинулись {m} %, путь к окончанию {a} мкм/мин, к телу нейрона {r} мкм/мин.", "s1a_c_coord_z": "Гипотеза согласованного переключения предсказывает снижение движения в обе стороны: моторы противоположных направлений зависят друг от друга.", "s1a_take": "Распределение митохондрий в аксоне задают три процесса: перенос моторами, остановка и закрепление. Повышение Ca²⁺ у активного синапса останавливает митохондрии; для этого нужны Ca²⁺-связывающие EF-мотивы Miro и синтафилин, а без синтафилина подвижных митохондрий вдвое больше. Эксперимент с ослаблением одного мотора позволяет различить гипотезы двунаправленного движения: по гипотезе согласованного переключения движение снижается в обе стороны, по гипотезе перетягивания — растёт в сторону оставшегося мотора.", "gn_miro": "Miro (MIRO1)", "g_miro": "ГТФаза наружной мембраны митохондрии. Через адаптеры TRAK1/2 (у дрозофилы — Milton) Miro связывает митохондрию с кинезином-1 и динеином. Два EF-мотива Miro связывают Ca²⁺, и при повышении его концентрации кинезин-1 перестаёт перемещать митохондрию. По данным Wang и Schwarz (2009), Miro, связавший Ca²⁺, взаимодействует с моторным доменом кинезина-1 и не даёт ему связаться с микротрубочкой; по данным Macaskill 2009, кинезин отделяется от комплекса с митохондрией. Замены в EF-мотивах сохраняют движение, но устраняют остановку при повышении Ca²⁺ (нейроны гиппокампа крысы в культуре).", "gn_snph": "Синтафилин (SNPH)", "g_snph": "Белок наружной мембраны митохондрий аксона. Синтафилин закрепляет митохондрию на микротрубочке, а связываясь с кинезином-1 (KIF5), подавляет его АТФазную активность (Chen и Sheng 2013). В нейронах гиппокампа мышей без гена Snph доля подвижных митохондрий аксона выросла примерно с трети до трёх четвертей, а плотность митохондрий в аксоне снизилась (Kang 2008). Без синтафилина митохондрии не останавливаются при активности нейрона. В модели синтафилин нужен и для закрепления в покое, и для остановки у активного синапса.", "p1a_1_q": "В нейронах гиппокампа с 2-й минуты записи стимулируют синапс в середине участка аксона. Как изменится к концу записи число неподвижных митохондрий в зоне этого синапса?", "p1a_1_o1": "Увеличится", "p1a_1_o2": "Уменьшится", "p1a_1_o3": "Не изменится", "p1a_1_e": "Активность синапса повышает концентрацию Ca²⁺ рядом с ним. Ca²⁺ связывается с EF-мотивами Miro, кинезин-1 на проходящих через зону митохондриях останавливается, а синтафилин закрепляет их на микротрубочке. В модели неподвижных митохондрий в зоне стало 15 вместо 3.", "p1a_1_w2": "Уменьшение означало бы, что митохондрии уходят из активного участка. Повышение Ca²⁺, наоборот, останавливает их там, где расходуется ATP.", "p1a_1_w3": "Без активности число неподвижных митохондрий в зоне почти не меняется. Повышение Ca²⁺ у активного синапса добавляет остановки именно в этой зоне.", "p1a_2_q": "В нейронах с белком Miro, у которого заменами в EF-мотивах устранено связывание Ca²⁺, стимулируют тот же синапс. Как изменится число неподвижных митохондрий в зоне синапса?", "p1a_2_o1": "Увеличится сильнее, чем в норме", "p1a_2_o2": "Почти не изменится", "p1a_2_o3": "Снизится до нуля", "p1a_2_e": "Мутантный Miro не связывает Ca²⁺, но по-прежнему соединяет митохондрию с кинезином-1, и митохондрии движутся как в норме; исчезает только остановка при повышении Ca²⁺ (Wang и Schwarz 2009; Macaskill 2009). В модели неподвижных митохондрий в зоне 3 в начале записи и 4 в конце — как без активности.", "p1a_2_w1": "Замены в EF-мотивах не усиливают остановку, а устраняют её: Miro перестаёт связывать Ca²⁺ и не останавливает кинезин-1.", "p1a_2_w3": "Синтафилин в этих нейронах сохранён и удерживает митохондрии, закреплённые до начала активности. Исчезает только дополнительная остановка при повышении Ca²⁺.", "p1a_3_q": "В нейронах гиппокампа мыши удалили ген синтафилина (Snph⁻/⁻); синапс не стимулируют. Как изменится доля подвижных митохондрий аксона по сравнению с нормой?", "p1a_3_o1": "Снизится примерно вдвое", "p1a_3_o2": "Почти не изменится", "p1a_3_o3": "Вырастет примерно вдвое", "p1a_3_e": "Синтафилин закрепляет митохондрию на микротрубочке. Без него закрепление редкое, и большая часть митохондрий остаётся подвижной: в модели 75 % против 37 %. В экспериментах Kang 2008 на нейронах гиппокампа мыши доля подвижных митохондрий выросла примерно с трети до трёх четвертей.", "p1a_3_w1": "Снижение подвижности означало бы усиление закрепления. Синтафилин — якорный белок, и его удаление закрепление ослабляет.", "p1a_3_w2": "Доля осталась бы прежней, если бы синтафилин не участвовал в закреплении. Без него подвижными остаются примерно вдвое больше митохондрий.", "p1a_4_q": "К нейронам добавляют нокодазол, вызывающий разборку микротрубочек. Как изменятся движение и положение митохондрий в аксоне?", "p1a_4_o1": "Митохондрии постепенно соберутся у тела нейрона", "p1a_4_o2": "Пробеги прекратятся, митохондрии останутся на местах", "p1a_4_o3": "Митохондрии постепенно сместятся к окончанию аксона", "p1a_4_e": "Без микротрубочек ни кинезин-1, ни динеин не переносят митохондрию: пробеги прекращаются в обе стороны, доля подвижных падает до 0 %, кимограмма состоит из вертикальных линий. Упрощение модели: в экспериментах аксонные микротрубочки разбираются нокодазолом не полностью.", "p1a_4_w1": "Чтобы собраться у тела нейрона, митохондриям нужны динеин и трек. При разборке микротрубочек прекращается и движение к телу клетки.", "p1a_4_w3": "Смещение к окончанию требует кинезина и трека. Нокодазол вызывает разборку трека, поэтому прекращается и антероградный перенос.", "p1a_5_q": "В нейронах без синтафилина стимулируют синапс в середине участка аксона. Как изменится число неподвижных митохондрий в зоне синапса?", "p1a_5_o1": "Почти не изменится", "p1a_5_o2": "Увеличится, как в норме", "p1a_5_o3": "Снизится до нуля", "p1a_5_e": "Одного Ca²⁺-сенсора Miro для остановки недостаточно: в экспериментах Chen и Sheng (2013) без синтафилина митохондрии продолжали двигаться при стимуляции нейронов. Синтафилин связывается с кинезином-1, подавляет его и закрепляет митохондрию на треке. В модели неподвижных митохондрий в зоне 1 в начале записи и 2 в конце.", "p1a_5_w2": "Так было бы, если бы остановку обеспечивал только Ca²⁺-сенсор Miro. Синтафилин нужен, чтобы подавить кинезин-1 и закрепить митохондрию.", "p1a_5_w3": "Активность синапса не сдвигает уже закреплённые митохондрии из зоны. Без синтафилина при активности лишь не прибавляется новых остановок.", "p1a_6_q": "Мысленный эксперимент: в модели согласованного переключения снижают активность динеина. Как изменится суммарный путь митохондрий к окончанию аксона за минуту?", "p1a_6_o1": "Увеличится", "p1a_6_o2": "Не изменится", "p1a_6_o3": "Уменьшится", "p1a_6_e": "В модели согласованного переключения моторы двух направлений зависят друг от друга: при сниженной активности динеина митохондрия реже становится подвижной, и путь к окончанию снижается с 171 до 59 мкм/мин; гипотеза перетягивания предсказывает рост до 234 мкм/мин. В экспериментах ослабление одного мотора часто снижало движение в обе стороны (обзор Hancock 2014), а в аксонах дрозофилы мутации динеина не усиливали перенос митохондрий к окончанию (Pilling 2006).", "p1a_6_w1": "Рост пути к окончанию предсказывает гипотеза перетягивания: ослабленный динеин слабее противодействует кинезину-1. Здесь же задана модель согласованного переключения, в которой при ослабленном динеине митохондрия реже переходит в подвижное состояние.", "p1a_6_w2": "Неизменный перенос означал бы, что моторы двух направлений работают независимо. Обе гипотезы предсказывают изменение, но разного знака.", "s2b_sl_f": "Константа слияния, % от максимума", "s2b_sl_d": "Константа деления, % от максимума", "s2b_note": "Положение 50 % у обоих ползунков — норма. Ползунки задают константы скоростей: как часто сливается одна органелла и делится единица длины сети; число событий в клетке зависит ещё и от числа органелл. Общая длина сети постоянна (120 мкм): модель показывает только, как два процесса делят её на отдельные митохондрии. Каждое положение ползунков показывает стационарное состояние, которое установилось бы после долгого ожидания; переходы во времени модель не рассчитывает.", "s2b_box_fus": "слияние: MFN1/2, OPA1", "s2b_box_fis": "деление: DRP1", "s2b_cls_frag": "сеть фрагментирована", "s2b_cls_mid": "короткие и средние митохондрии", "s2b_cls_long": "протяжённая связная сеть", "s2b_cls_stop": "обе машины остановлены", "s2b_r_n": "Число митохондрий", "s2b_r_n_s": "в одной клетке", "s2b_r_L": "Средняя длина митохондрии", "s2b_r_L_s": "общая длина сети / число органелл", "s2b_r_frag": "Клетки с фрагментированной сетью", "s2b_r_fus": "События слияния", "s2b_r_fis": "События деления", "s2b_r_ev_s": "в минуту на клетку", "s2b_r_mix": "Характерное время слияния органеллы (1/kсл)", "s2b_r_mix_s": "величина, обратная константе слияния органеллы; задаётся ползунком константы слияния", "s2b_r_never": "не с чем сливаться", "s2b_r_nofus": "слияния нет", "s2b_r_note": "Учебная модель, условные величины. В стационарном состоянии число событий деления равно числу событий слияния плюс поправка на рост и деление самих клеток; она мала, пока оба процесса идут намного быстрее роста клеток. Доля клеток с фрагментированной сетью рассчитана с учётом того, что клетки культуры различаются.", "s2b_c_bal": "Скорости слияния и деления уравновешены: число митохондрий в клетке — {n}, средняя длина — {L} мкм. За минуту в клетке происходит около {e} события слияния и почти столько же событий деления, но картина сети не меняется.", "s2b_c_bal_z": "Стационарную картину сети поддерживают два непрерывно идущих противоположных процесса, а не их остановка.", "s2b_c_mid": "Число митохондрий в клетке — {n}, средняя длина — {L} мкм; за минуту происходит около {e} события слияния. Форму сети приближённо задаёт отношение констант скоростей двух процессов, а частота событий зависит и от самих констант, и от числа органелл.", "s2b_c_mid_z": "Одна и та же картина сети совместима с разной частотой событий, поэтому по картине нельзя судить о работе каждой машины.", "s2b_c_slow": "Оба процесса идут очень медленно: число митохондрий в клетке — {n}, средняя длина — {L} мкм; за минуту {e} события слияния и {ed} события деления. Деления заметно превышают слияния, потому что восполняют ещё и разбавление сети при росте клеток.", "s2b_c_slow_z": "Отношение констант задаёт форму сети, только пока слияние и деление идут намного быстрее роста клеток; при очень малых константах форма зависит и от скорости роста.", "s2b_c_frag": "В стационарном состоянии митохондрии короткие: их в клетке {n}, средняя длина — {L} мкм; фрагментированная сеть — у {fr} % клеток. Константа деления велика по сравнению с константой слияния, но за минуту в клетке {e} события слияния и {ed} события деления: деления лишь восполняют слияния и разбавление сети при росте клеток.", "s2b_c_frag_z": "Такую же фрагментацию дают и подавление слияния, и усиление деления; чтобы узнать причину, нужно измерить сами процессы.", "s2b_c_long": "Митохондрии образуют длинные органеллы: средняя длина {L} мкм, в клетке {n}. Константа слияния велика по сравнению с константой деления, а за минуту в клетке {e} события слияния и {ed} события деления.", "s2b_c_long_z": "Протяжённая сеть позволяет смешивать содержимое митохондрий, но длинную органеллу труднее перенести по узкому отростку и поглотить автофагосомой.", "s2b_c_nofis": "Деления нет: все митохондрии клетки сливаются в одну связную сеть, и событий слияния больше не происходит, потому что сливаться не с чем.", "s2b_c_nofis_z": "Без деления повреждённый участок труднее отделить от сети, а митохондрии хуже распределяются по клетке и её отросткам.", "s2b_c_nofus": "Слияния нет: деление дробит сеть на мелкие фрагменты (их в клетке {n}, средняя длина — {L} мкм), и митохондрии больше не обмениваются содержимым.", "s2b_c_nofus_z": "Без слияния митохондрии не могут восполнять друг у друга недостающие белки и продукты мтДНК.", "s2b_c_stop": "Обе машины остановлены: событий слияния и деления нет. Стационарного состояния, которое задавали бы константы скоростей, нет, поэтому модель сохраняет последнее рассчитанное состояние сети: число митохондрий — {n}, средняя длина — {L} мкм. Оно зависит от того, в каком порядке были остановлены процессы.", "s2b_c_stop_z": "Без обеих машин форма сети отражает её прошлое, а не отношение процессов: у дрожжей при последовательном удалении генов сохранялась картина, сложившаяся до удаления второго гена, — сеть мутанта dnm1 или фрагменты мутанта fzo1 (Sesaki и Jensen 1999).", "s2b_take": "Морфология сети митохондрий — стационарное состояние двух непрерывно идущих процессов. Пока оба процесса идут намного быстрее роста клеток, форму сети приближённо задаёт отношение констант слияния и деления, а число событий в минуту зависит ещё и от самих констант и от числа органелл. Поэтому подавление слияния и усиление деления дают одинаковую фрагментацию, а умеренное ослабление обоих процессов мало меняет форму, но уменьшает число событий; при очень малых константах заметна поправка на рост клеток. По снимку сети нельзя узнать, какая машина изменена: нужно измерять сами события.", "p2b_1_q": "В клетке с нормальными скоростями слияния и деления скорость слияния снизили вдвое, не меняя скорости деления. Как изменится средняя длина митохондрий?", "p2b_1_o1": "Не изменится: деление осталось прежним", "p2b_1_o2": "Уменьшится: сеть станет фрагментированной", "p2b_1_o3": "Увеличится: митохондрии станут длиннее", "p2b_1_e": "Форму сети приближённо задаёт отношение констант слияния и деления. Деление дробит сеть с прежней скоростью, а слияние восстанавливает её вдвое медленнее, поэтому органелл становится больше (48 вместо 27), средняя длина падает с 4,4 до 2,5 мкм, и фрагментированная сеть — уже примерно у половины клеток (учебная модель).", "p2b_1_w1": "Неизменная скорость деления не означает неизменной формы: форма приближённо определяется отношением констант двух процессов. Пока сеть перестраивается после ослабления слияния, делений больше, чем слияний.", "p2b_1_w3": "Митохондрии удлиняются, когда слияние усиливается относительно деления. Здесь слияние ослаблено, а деление прежнее, поэтому органеллы становятся короче.", "p2b_2_q": "В клетке с нормальными скоростями слияния и деления вдвое ускорили деление, не меняя слияния. Как изменится число событий слияния в клетке за минуту?", "p2b_2_o1": "Не изменится: машина слияния та же", "p2b_2_o2": "Уменьшится: сеть станет фрагментированной", "p2b_2_o3": "Увеличится: органелл для слияния станет больше", "p2b_2_e": "Каждая митохондрия сливается с соседями с прежней вероятностью, но органелл стало почти вдвое больше (48 вместо 27). Поэтому в стационарном состоянии событий слияния в клетке больше: 2,37 вместо 1,31 в минуту, и они по-прежнему почти уравновешивают деления. Средняя длина при этом 2,5 мкм.", "p2b_2_w1": "Свойства машины слияния не изменились, но число событий в клетке зависит ещё и от числа органелл, способных слиться. После усиления деления их стало больше.", "p2b_2_w2": "Фрагментация здесь вызвана усилением деления, а не ослаблением слияния. Мелких органелл больше, поэтому и событий слияния за минуту становится больше.", "p2b_3_q": "В клетке с нормальными скоростями слияния и деления оба процесса замедлили вдвое. Как изменится средняя длина митохондрий?", "p2b_3_o1": "Почти не изменится: отношение прежнее", "p2b_3_o2": "Уменьшится: сеть станет фрагментированной", "p2b_3_o3": "Увеличится: сеть станет протяжённой", "p2b_3_e": "При этих константах средняя длина приближённо задаётся отношением констант слияния и деления, а оно не изменилось, поэтому длина прежняя — около 4,4 мкм. Вдвое реже стали сами события — 0,65 слияния в минуту вместо 1,31, и митохондрии реже обмениваются содержимым. По снимку сети этого не увидеть.", "p2b_3_w2": "Сеть фрагментируется, когда константа деления растёт относительно константы слияния. Здесь оба процесса замедлены одинаково, и их отношение прежнее.", "p2b_3_w3": "Протяжённая сеть возникает, когда константа слияния растёт относительно константы деления. Деление замедлено в той же мере, что и слияние, поэтому отношение осталось прежним.", "p2b_4_q": "В клетке с нормальными скоростями слияния и деления полностью остановили деление, а слияние оставили прежним. Как изменится число митохондрий в клетке?", "p2b_4_o1": "Не изменится: слияние идёт по-прежнему", "p2b_4_o2": "Уменьшится до одной: сеть станет связной", "p2b_4_o3": "Увеличится: органеллы станут мельче", "p2b_4_e": "Слияние продолжает объединять митохондрии, а деление больше не создаёт новых: органеллы сливаются, пока вся сеть клетки не станет одной связной структурой. После этого и событий слияния не остаётся — сливаться больше не с чем.", "p2b_4_w1": "Число органелл постоянно, только пока слияния уравновешиваются делениями. Без деления каждое слияние уменьшает число органелл, и восполнить его нечем.", "p2b_4_w3": "Мельче органеллы становятся, когда деления идут чаще слияний. Здесь деление остановлено, и органеллы только объединяются.", "p2b_5_q": "В первой клетке слияние замедлено вдвое, во второй вдвое ускорено деление; средняя длина митохондрий в обеих около 2,5 мкм. Как частота слияний во второй клетке отличается от первой?", "p2b_5_o1": "Одинакова: форма сети та же", "p2b_5_o2": "Вдвое ниже: деление преобладает", "p2b_5_o3": "Вдвое выше: оба процесса быстрее", "p2b_5_e": "Форма сети одинакова: одинаково отношение констант. Но во второй клетке обе константы вдвое больше, и слияний за минуту вдвое больше (2,37 против 1,17). Отличить подавленное слияние от усиленного деления позволяет подсчёт событий при прижизненной съёмке, а не снимок сети.", "p2b_5_w1": "Одинаковая форма сети не означает одинаковой работы машин: при этих константах форму почти полностью задаёт отношение констант, а частота событий зависит и от самих констант.", "p2b_5_w2": "В обеих клетках одинаково отношение констант слияния и деления, поэтому близка и форма сети. Во второй клетке обе константы вдвое больше, и событий слияния за минуту больше.", "s2a_g_t": "Клетки (эмбриональные фибробласты мыши)", "s2a_g_mfn": "Mfn1⁻/⁻ Mfn2⁻/⁻", "s2a_g_mfn2": "Mfn2⁻/⁻", "s2a_g_opa1": "Opa1⁻/⁻", "s2a_g_drp1": "Drp1⁻/⁻", "s2a_g_mff": "Mff⁻/⁻", "s2a_d_t": "Воздействие", "s2a_d0": "нет", "s2a_dcccp": "CCCP, 60 мин", "s2a_dsi": "подавление DRP1", "s2a_o_t": "Что показать", "s2a_o_mito": "митохондрии", "s2a_o_perox": "пероксисомы", "s2a_note": "Подавление DRP1 — длительное снижение количества белка (РНК-интерференция); CCCP — протонофор, снимающий мембранный потенциал. Показания без воздействия — стационарное состояние данных клеток; с CCCP — через 60 мин после добавления к клеткам в стационарном состоянии.", "s2a_lab_mfn": "MFN1/2", "s2a_lab_opa1": "OPA1", "s2a_lab_oma1": "OMA1", "s2a_lab_drp1": "DRP1", "s2a_lab_mff": "MFF", "s2a_lab_cccp": "CCCP", "s2a_lab_pex": "PEX11", "s2a_lab_tmrm": "TMRM", "s2a_t_mito": "Митохондрии (флуоресцентный маркер матрикса)", "s2a_t_mito_cccp": "Митохондрии через 60 мин после добавления CCCP", "s2a_t_px": "Пероксисомы (маркер мембраны пероксисом PEX14)", "s2a_r_frag": "Морфология: клетки с фрагментированной сетью", "s2a_r_L": "Средняя длина митохондрии", "s2a_r_L_s": "учебная модель", "s2a_r_ev": "Процесс: события слияния / деления", "s2a_r_ev_s": "прижизненная съёмка, в минуту на клетку", "s2a_r_mark": "Процесс: сеть с матриксным маркером через 60 мин (активировано 23 %)", "s2a_r_opa": "Белок: короткая форма OPA1", "s2a_r_opa_s": "доля всей OPA1, по блоту", "s2a_opa_none": "белка нет", "s2a_r_drp": "Белок: DRP1 на наружной мембране", "s2a_r_drp_s": "% от нормы", "s2a_drp_none": "белка нет", "s2a_r_low": "Функция: митохондрии с низким потенциалом (TMRM)", "s2a_r_resp": "Функция: потребление кислорода", "s2a_r_resp_s": "% от нормы, поток", "s2a_bl_t": "Вестерн-блот OPA1", "s2a_bl_L": "L-OPA1", "s2a_bl_S": "S-OPA1", "s2a_bl_hsp": "HSP60 (контроль)", "s2a_bl_wt1": "норма", "s2a_bl_wt2": "без воздействия", "s2a_bl_cur1": "эти", "s2a_bl_cur2": "клетки", "s2a_r_note": "Учебная модель, условные величины; направление изменений — по экспериментам на эмбриональных фибробластах мыши (Chen 2003, 2005; Song 2007; Wakabayashi 2009; Losón 2013; Anand 2014) и клетках HeLa (Head 2009). Морфология, процесс, состояние белков и функция показаны отдельно: это разные величины.", "s2a_r_px": "Длина пероксисом", "s2a_r_px_s": "относительно нормы", "s2a_px_round": "округлые, норма", "s2a_r_pxfus": "Слияние зрелых пероксисом", "s2a_r_pxfus_s": "у млекопитающих (Bonekamp 2012)", "s2a_pxfus_v": "не показано", "s2a_r_pxdrp": "DRP1 для деления пероксисом", "s2a_r_pxdrp_s": "общая с митохондриями ГТФаза деления", "s2a_drp_yes": "есть", "s2a_drp_low": "снижен", "s2a_drp_no": "нет", "s2a_r_note_px": "Учебная модель. Пероксисомы делятся с участием DRP1, MFF, FIS1 и белков PEX11 (Koch 2003, Gandre-Babbe и van der Bliek 2008, Wakabayashi 2009). Слияния зрелых пероксисом у млекопитающих не показано: описаны лишь кратковременные контакты без обмена матриксом (Bonekamp 2012); слияние пре-пероксисомных пузырьков при образовании новых пероксисом — отдельный процесс (Sugiura 2017).", "s2a_c_wt": "Норма: слияние и деление уравновешены, средняя длина митохондрии {L} мкм, фрагментированная сеть — у {fr} % клеток; за 60 мин матриксный маркер распространяется на {m} % сети.", "s2a_c_wt_z": "В стационарном состоянии обе машины работают непрерывно: картина сети не меняется, хотя содержимое органелл всё время перемешивается.", "s2a_c_mfn": "Без обоих митофузинов наружные мембраны не сливаются: событий слияния нет, маркер остаётся в {m} % сети, а деление продолжается, и сеть фрагментирована у {fr} % клеток. У {p} % митохондрий потенциал снижен.", "s2a_c_mfn_z": "Без слияния митохондрии не обмениваются содержимым, и часть из них теряет потенциал (Chen 2005; у одиночных мутантов — Chen 2003).", "s2a_c_mfn2": "Без MFN2 слияние сохраняется за счёт MFN1, но идёт медленнее: маркер распространяется только на {m} % сети, средняя длина {L} мкм, фрагментированная сеть — у {fr} % клеток.", "s2a_c_mfn2_z": "Ослабленное, но сохранённое слияние даёт фрагментацию без грубого нарушения функции: дыхание культуры в целом нормально, потенциал снижен лишь у {p} % митохондрий (Chen 2003, 2005).", "s2a_c_opa1": "Без OPA1 внутренние мембраны не сливаются: маркер остаётся в {m} % сети, сеть фрагментирована у {fr} % клеток, на блоте нет ни длинной, ни короткой формы OPA1.", "s2a_c_opa1_z": "Слияние двух мембран митохондрии требует двух машин; потеря любой из них останавливает обмен содержимым.", "s2a_c_drp1": "Без DRP1 деление почти прекращается (в эксперименте частота делений ниже в 17 раз), а слияние продолжается: митохондрии объединены в длинную сеть (средняя длина {L} мкм), маркер распространяется на {m} % сети.", "s2a_c_drp1_z": "Удлинённая сеть не означает нарушенной функции: в модели потенциал и дыхание как в норме, а в экспериментах на клетках Drp1⁻/⁻ уровень ATP, дыхание и потенциал не снижены (Ishihara 2009; Wakabayashi 2009).", "s2a_c_mff": "Без MFF на наружной мембране меньше DRP1 (30 % от нормы), деление ослаблено — {d} события в минуту против 1,33 в норме, — и сеть удлинена: средняя длина {L} мкм.", "s2a_c_mff_z": "DRP1 почти не связывается с наружной мембраной без рецепторов: её привлекают MFF, FIS1, MiD49 и MiD51, и в фибробластах главный из них — MFF (Losón 2013).", "s2a_c_cccp": "CCCP снял потенциал: протеаза OMA1 перевела почти всю OPA1 в короткую форму, слияние остановилось, на мембране стало больше DRP1, и через 60 мин сеть фрагментирована у {fr} % клеток. Потребление кислорода в модели (оптимальная концентрация CCCP) выросло до {resp} % от нормы.", "s2a_c_cccp_z": "Деполяризованная митохондрия теряет способность к слиянию и больше не объединяется с сетью; так повреждённые органеллы обособляются перед удалением путём аутофагии (Twig 2008).", "s2a_c_cccp_nofus": "Сеть была фрагментирована и до CCCP, потому что слияния нет. CCCP снял потенциал у {p} % митохондрий и перевёл OPA1 в короткую форму, но форма сети почти не изменилась.", "s2a_c_cccp_nofus_z": "Одна и та же фрагментированная картина здесь сочетается и с нормальным, и со снятым потенциалом: форма сети не измеряет функцию.", "s2a_c_cccp_drp1": "CCCP снял потенциал у {p} % митохондрий и перевёл OPA1 в короткую форму, слияние остановилось. Без DRP1 деление идёт лишь с остаточной частотой, поэтому через 60 мин сеть остаётся протяжённой: средняя длина {L} мкм, фрагментирована у {fr} % клеток.", "s2a_c_cccp_drp1_z": "Протяжённая сеть может быть полностью деполяризована: морфология и функция — разные величины, и каждую измеряют отдельно.", "s2a_c_cccp_mff": "CCCP остановил слияние, но деление в клетках без MFF ослаблено, поэтому через 60 мин сеть фрагментирована только у {fr} % клеток; потенциал снят у {p} % митохондрий.", "s2a_c_cccp_mff_z": "Скорость фрагментации после остановки слияния зависит от того, сколько DRP1 привлечено рецепторами на наружную мембрану.", "s2a_c_si_long": "При сниженном количестве DRP1 деление ослаблено, и сеть удлиняется: средняя длина {L} мкм, фрагментированная сеть — у {fr} % клеток.", "s2a_c_si_long_z": "Ослабленное деление смещает баланс в сторону слияния.", "s2a_c_si_nofus": "Слияния нет, поэтому даже ослабленное деление со временем дробит сеть: средняя длина {L} мкм, фрагментированная сеть — у {fr} % клеток.", "s2a_c_si_nofus_z": "Без машины слияния протяжённую сеть ослаблением деления не восстановить: деление медленнее, но объединять фрагменты нечему.", "s2a_c_si_mfn2": "В клетках без MFN2 подавили DRP1: средняя длина вернулась почти к норме ({L} мкм, фрагментирована сеть у {fr} % клеток), но матриксный маркер по-прежнему распространяется только на {m} % сети против 86 % в норме: слияние в расчёте на органеллу осталось ослабленным.", "s2a_c_si_mfn2_z": "Ослабление противоположной машины восстанавливает форму сети, но не слияние: это компенсация фенотипа, а не восстановление механизма.", "s2a_c_si_drp1": "В клетках без DRP1 подавлять нечего: картина та же, что без воздействия, — длинная сеть, средняя длина {L} мкм.", "s2a_c_si_drp1_z": "Вмешательство действует только на ту машину, которая в клетке есть.", "s2a_c_px_wt": "Пероксисомы в норме небольшие и округлые. Их число задают деление (DRP1, MFF, FIS1, PEX11) и образование новых пероксисом; слияния зрелых пероксисом у млекопитающих не показано.", "s2a_c_px_wt_z": "Общая машина деления не означает общей логики: слияния зрелых пероксисом, парного их делению, не показано.", "s2a_c_px_drp1": "Без DRP1 пероксисомы удлиняются (длина ×{px}): та же ГТФаза, что делит митохондрии, делит и пероксисомы.", "s2a_c_px_drp1_z": "Мутация DNM1L у ребёнка нарушала деление и митохондрий, и пероксисом одновременно (Waterham 2007).", "s2a_c_px_mff": "Без MFF пероксисомы удлинены (длина ×{px}): рецептор MFF привлекает DRP1 и на мембрану пероксисом.", "s2a_c_px_mff_z": "В делении пероксисом участвуют те же рецепторы MFF и FIS1, что и у митохондрий, но не MiD49 и MiD51.", "s2a_c_px_fus": "Пероксисомы такие же, как в норме: митофузины и OPA1 работают только в митохондриях, а деление пероксисом не нарушено.", "s2a_c_px_fus_z": "Выводы о белках слияния митохондрий нельзя переносить на пероксисомы: границы обобщения задаёт состав белковых машин каждой органеллы.", "s2a_c_px_si": "При сниженном количестве DRP1 пероксисомы удлиняются (длина ×{px}), как и митохондрии: деление обеих органелл зависит от одной ГТФазы.", "s2a_c_px_si_z": "Вмешательство в общую машину меняет обе органеллы сразу; это нужно учитывать, когда по эффекту судят о митохондриях.", "s2a_c_px_cccp": "Форма пероксисом после CCCP в модели не меняется: протонофор снимает потенциал внутренней мембраны митохондрий, которой у пероксисом нет.", "s2a_c_px_cccp_z": "Слияние митохондрий связано с их энергетическим состоянием через OPA1 и OMA1; у пероксисом такой связи нет.", "s2a_take": "Фрагментированная сеть получается и без слияния (Mfn1⁻/⁻ Mfn2⁻/⁻, Opa1⁻/⁻, CCCP), и при усиленном делении, а удлинённая — при ослабленном делении (Drp1⁻/⁻, Mff⁻/⁻). Различают эти случаи не по снимку сети, а по самим процессам (частота событий, обмен матриксным маркером), по состоянию белков (формы OPA1, DRP1 на мембране) и отдельно — по функции (потенциал, дыхание). Восстановление формы вмешательством в противоположную машину — компенсация, а не доказательство причины. Пероксисомы делятся той же DRP1, но слияния зрелых пероксисом не показано: перенос схемы митохондрий на другие органеллы требует проверки их собственных машин.", "p2a_1_q": "В эмбриональных фибробластах мыши Mfn1⁻/⁻ Mfn2⁻/⁻ при прижизненной съёмке считают события слияния. Как изменится их число по сравнению с нормой?", "p2a_1_o1": "Почти исчезнет, а деление продолжится", "p2a_1_o2": "Не изменится, но митохондрии станут короче", "p2a_1_o3": "Вырастет, потому что органелл станет больше", "p2a_1_e": "Митофузины сливают наружные мембраны, и без обоих белков слияния нет: событий слияния 0, матриксный маркер не выходит за пределы активированной части сети. Деление продолжается, поэтому сеть фрагментирована почти во всех клетках (Chen 2005; в модели — в 98 %). Делений в модели меньше, чем в норме: предельно мелкие фрагменты почти не делятся.", "p2a_1_w2": "Слияние наружных мембран выполняют именно митофузины; без обоих белков события слияния прекращаются, а короткие митохондрии — следствие этого.", "p2a_1_w3": "Число органелл выросло, но сливаться им нечем: без митофузинов наружные мембраны не сливаются ни при каком числе органелл.", "p2a_2_q": "В эмбриональных фибробластах мыши удалили ген Dnm1l, кодирующий DRP1 (Drp1⁻/⁻). Как изменится форма пероксисом?", "p2a_2_o1": "Не изменится: DRP1 делит только митохондрии", "p2a_2_o2": "Пероксисомы станут удлинёнными", "p2a_2_o3": "Пероксисомы сольются в одну сеть", "p2a_2_e": "DRP1 — общая ГТФаза деления митохондрий и пероксисом. Без неё пероксисомы не разделяются и вытягиваются в трубочки: в клетках Drp1⁻/⁻ они удлинены (Wakabayashi 2009), а у ребёнка с доминантно-негативной мутацией DNM1L нарушалось деление обеих органелл (Waterham 2007).", "p2a_2_w1": "DRP1 делит не только митохондрии: та же ГТФаза с рецепторами MFF и FIS1 разделяет и пероксисомы.", "p2a_2_w3": "Чтобы пероксисомы объединились в сеть, нужна машина слияния, а слияния зрелых пероксисом между собой у млекопитающих не показано (Bonekamp 2012). Без DRP1 они удлиняются, но остаются отдельными.", "p2a_3_q": "В эмбриональных фибробластах мыши Mfn1⁻/⁻ Mfn2⁻/⁻ оценивают форму пероксисом. Какими будут пероксисомы по сравнению с нормой?", "p2a_3_o1": "Мелкими, как митохондрии", "p2a_3_o2": "Удлинёнными, как без DRP1", "p2a_3_o3": "Такими же, как в норме", "p2a_3_e": "Митофузины — белки наружной мембраны митохондрий, в пероксисомах их нет; слияния зрелых пероксисом у млекопитающих не показано (Bonekamp 2012). Их деление (DRP1, MFF, FIS1, PEX11) не затронуто, поэтому форма пероксисом нормальная. Общая машина деления не означает общей машины слияния.", "p2a_3_w1": "Митохондрии становятся мельче потому, что без митофузинов не сливаются. Слияния зрелых пероксисом у млекопитающих не показано, поэтому потеря митофузинов на их форме не сказывается.", "p2a_3_w2": "Пероксисомы удлиняются при нарушении деления. Митофузины в делении пероксисом не участвуют, и DRP1 в этих клетках есть.", "p2a_4_q": "В эмбриональные фибробласты мыши дикого типа добавили протонофор CCCP. Как через час изменится соотношение форм OPA1 на вестерн-блоте?", "p2a_4_o1": "Почти вся OPA1 перейдёт в короткую форму", "p2a_4_o2": "Почти вся OPA1 перейдёт в длинную форму", "p2a_4_o3": "Соотношение форм останется прежним", "p2a_4_e": "Потеря потенциала активирует протеазу внутренней мембраны OMA1, и она расщепляет длинную форму OPA1: на блоте остаётся почти только короткая форма, и слияние внутренних мембран прекращается (Head 2009, Ehses 2009). Саму фрагментацию сети выполняет DRP1; в модели через час сеть фрагментирована в 90 % клеток.", "p2a_4_w2": "Короткая форма образуется из длинной расщеплением, обратного превращения нет. CCCP запускает именно расщепление длинной формы протеазой OMA1.", "p2a_4_w3": "Соотношение форм OPA1 зависит от состояния митохондрии: потеря потенциала активирует OMA1, и длинная форма почти исчезает.", "p2a_5_q": "В клетки без DRP1 (Drp1⁻/⁻) добавили CCCP; через час сеть осталась протяжённой. Какая доля митохондрий окажется с низким мембранным потенциалом (окраска TMRM)?", "p2a_5_o1": "Около 5 %: сеть протяжённая", "p2a_5_o2": "Почти все: CCCP — протонофор", "p2a_5_o3": "Меньше 5 %: сеть связная", "p2a_5_e": "CCCP переносит протоны через внутреннюю мембрану при любой форме сети, поэтому потенциал снят почти во всех митохондриях (в модели — в 97 %). Без DRP1 деление идёт лишь с остаточной частотой, примерно в 17 раз ниже нормы (Wakabayashi 2009), и сеть остаётся протяжённой. Морфология и функция — разные величины.", "p2a_5_w1": "Протяжённость сети не защищает потенциал: протонофор переносит протоны через внутреннюю мембрану любой митохондрии, длинной или короткой.", "p2a_5_w3": "Связность сети не создаёт потенциал — его создаёт перенос протонов дыхательной цепью, а CCCP возвращает протоны в матрикс в обход ATP-синтазы.", "p2a_6_q": "В клетках без MFN2 (Mfn2⁻/⁻) сеть фрагментирована. После подавления DRP1 средняя длина митохондрий вернулась почти к норме. Что показывает этот результат?", "p2a_6_o1": "Что фрагментацию вызывало усиленное деление", "p2a_6_o2": "Что MFN2 для слияния в этих клетках не нужен", "p2a_6_o3": "Что форма восстановлена компенсацией, а не устранением причины", "p2a_6_e": "Подавление DRP1 замедлило деление до уровня ослабленного слияния, отношение констант слияния и деления стало прежним, и средняя длина вернулась к норме (4,5 мкм). Но слияние не восстановилось: матриксный маркер за час распространяется на 39 % сети против 86 % в норме. Это компенсация фенотипа; сам механизм восстанавливается только при возвращении MFN2.", "p2a_6_w1": "Подавление деления устраняет фрагментацию при любой её причине, в том числе при ослабленном слиянии. Поэтому восстановление формы не указывает, какая машина была изменена.", "p2a_6_w2": "Слияние в этих клетках по-прежнему ослаблено: маркер распространяется по сети медленнее, чем в норме. Восстановилась только форма сети, а не работа машины слияния.", "gn_mfn": "Митофузины MFN1 и MFN2", "g_mfn": "ГТФазы наружной мембраны митохондрии. Молекулы на двух соседних органеллах связываются друг с другом и при гидролизе GTP сближают наружные мембраны до слияния. MFN1 и MFN2 частично заменяют друг друга: в эмбриональных фибробластах мыши без одного из них слияние резко ослаблено (Chen 2003), без обоих — не идёт ни слияние наружных, ни слияние внутренних мембран (Chen 2005; Song 2009). Мутации MFN2 вызывают наследственную нейропатию Шарко — Мари — Тута типа 2A. На схеме модели скорость слияния задаётся одним ползунком для MFN1/2 и OPA1 вместе — это упрощение.", "gn_opa1": "OPA1", "g_opa1": "ГТФаза внутренней мембраны митохондрии, необходимая для слияния внутренних мембран и для формы крист: в клетках без гена OPA1 наружные мембраны сливаются, а внутренние — нет (Song 2009); при подавлении OPA1 малыми РНК не сливались и наружные мембраны (Chen 2005). Существует в длинной форме (L-OPA1), закреплённой в мембране, и в короткой (S-OPA1). Короткая образуется при расщеплении: YME1L работает постоянно, OMA1 — при потере потенциала или ATP. В клетках без обеих протеаз для слияния хватало длинной формы (Anand 2014); по более ранним данным, слияние восстанавливала только смесь длинных и коротких форм (Song 2007). Мутации OPA1 вызывают доминантную оптическую атрофию.", "gn_oma1": "Протеаза OMA1", "g_oma1": "Цинковая металлопротеаза внутренней мембраны митохондрии. При потере мембранного потенциала или ATP она активируется и расщепляет почти всю длинную форму OPA1 до короткой; слияние внутренних мембран прекращается (Head 2009, Ehses 2009). Предполагают, что так деполяризованная митохондрия теряет способность сливаться со здоровой сетью. Фрагментацию сети после CCCP выполняет не OMA1, а DRP1: в клетках HeLa с подавленной OMA1 сеть распадалась так же, но после отмывания CCCP быстрее восстанавливалась (Head 2009). В модели расщепление идёт с характерным временем 10 мин — учебная величина.", "gn_drp1": "DRP1 (ген DNM1L)", "g_drp1": "Цитозольная ГТФаза семейства динаминов. Рецепторы наружной мембраны (MFF, FIS1, MiD49, MiD51) привлекают её к митохондрии, где она собирается в кольцо вокруг органеллы и за счёт гидролиза GTP сжимает и разделяет мембраны (Kamerkar 2018). Место деления заранее размечают трубочки ЭПР (Friedman 2011). Фосфорилирование по Ser616 (CDK1 в митозе) усиливает деление, по Ser637 (PKA) — ослабляет; номера остатков даны для изоформы 1 человека. DRP1 делит и пероксисомы. В клетках Drp1⁻/⁻ частота делений митохондрий ниже в 17 раз (Wakabayashi 2009).", "gn_mff": "Рецептор MFF", "g_mff": "Белок наружной мембраны, закреплённый одним трансмембранным участком; главный рецептор, привлекающий DRP1 к митохондриям и пероксисомам (Gandre-Babbe и van der Bliek 2008, Otera 2010). Без MFF на мембране меньше комплексов DRP1, деление ослаблено, и митохондрии удлиняются; оставшееся деление обеспечивают FIS1, MiD49 и MiD51 (Losón 2013). В модели деление в клетках Mff⁻/⁻ снижено до 30 % — учебная величина.", "gn_cccp": "CCCP", "g_cccp": "Протонофор (разобщитель): переносит протоны через внутреннюю мембрану митохондрии в обход ATP-синтазы и снимает мембранный потенциал. Если концентрация протонофора оптимальна, субстратов достаточно, а у клеток есть дыхательный резерв, дыхательная цепь работает быстрее и потребление кислорода растёт; избыток протонофора дыхание подавляет. Синтез ATP в митохондриях падает. Через активацию OMA1 CCCP прекращает слияние. В экспериментах его обычно добавляют на время от 30 мин до нескольких часов (Head 2009; Song 2007). В модели потребление кислорода после CCCP — 170 % от нормы (учебная величина для оптимальной концентрации).", "gn_tmrm": "TMRM", "g_tmrm": "Положительно заряженный флуоресцентный зонд, который накапливается в митохондриях в зависимости от мембранного потенциала: по уравнению Нернста отношение его концентраций в матриксе и цитозоле растёт экспоненциально, примерно в 10 раз на каждые 60 мВ. Как яркость связана с потенциалом, зависит ещё и от режима измерения (разобрано в семинаре 1). Яркость TMRM в органелле — оценка состояния её мембраны, а не потока: скорость синтеза ATP и потребление кислорода измеряют отдельно. Показание «митохондрии с низким потенциалом» — доля органелл с яркостью ниже порога.", "gn_pex": "Пероксисомы и PEX11", "g_pex": "Пероксисомы — одномембранные органеллы окисления жирных кислот с очень длинной цепью и обезвреживания пероксида водорода. Перед делением белки PEX11 вытягивают пероксисому, затем её разделяет DRP1, привлечённая рецепторами MFF и FIS1 (Koch 2003, 2010). Слияния зрелых пероксисом между собой у млекопитающих не показано: описаны лишь кратковременные контакты без обмена матриксом (Bonekamp 2012). Их число задают деление и образование новых пероксисом, при котором сливаются пре-пероксисомные пузырьки (Sugiura 2017).", "s3b_c_t": "Общая концентрация каждого из двух каркасных белков", "s3b_v_t": "Число связывающих модулей в каждой молекуле", "s3b_v2": "2", "s3b_v3": "3", "s3b_v4": "4", "s3b_v5": "5", "s3b_note": "Раствор двух белков-партнёров в пробирке, смесь 1 : 1. У одного белка несколько одинаковых связывающих модулей, у другого — столько же участков, с которыми эти модули связываются (так устроена модельная система SH3ₙ + PRMₙ, Li 2012). Концентрации и пороги — учебные величины.", "s3b_field_t": "Раствор в пробирке", "s3b_fn_one": "одна фаза: молекулы распределены равномерно", "s3b_fn_sep": "две фазы: капли плотной фазы в разбавленном растворе", "s3b_mol_t": "Молекулы-партнёры", "s3b_mol_a": "белок с модулями", "s3b_mol_b": "белок с участками связывания", "s3b_mol_n": "модулей в молекуле: {v}", "s3b_mol_note": "каждый контакт слабый", "s3b_scale_t": "Порог (Cнас) для разного числа модулей; цифра у метки — число модулей", "s3b_scale_u": "общая концентрация, мкМ", "s3b_mark": "{v}", "s3b_mark2": "при 2 модулях порог выше 200 мкМ", "s3b_r_cs": "Концентрация насыщения (порог)", "s3b_r_cs_s": "при выбранном числе модулей", "s3b_r_cs_none": "выше 200 мкМ", "s3b_r_dil": "Концентрация в разбавленной фазе", "s3b_r_dil_s": "вне капель", "s3b_r_fd": "Доля молекул в плотной фазе (от всех молекул белка)", "s3b_r_phi": "Объём, занятый каплями", "s3b_r_phi_s": "доля объёма раствора", "s3b_pcap": "Концентрация в разбавленной фазе в зависимости от общей концентрации (модулей в молекуле — {v}; учебная модель: смесь двух белков 1 : 1 рассматривается как один эффективный каркасный компонент)", "s3b_l_dil": "разбавленная фаза", "s3b_l_nops": "если бы фазового разделения не было", "s3b_c_v2": "У молекул с двумя модулями в диапазоне до 200 мкМ капли не образуются: при {c} мкМ весь белок остаётся в однородном растворе.", "s3b_c_v2_z": "Чем меньше связывающих модулей, тем меньше контактов может образовать молекула и тем выше концентрация, при которой появляются капли.", "s3b_c_below": "Общая концентрация {c} мкМ ниже порога {cs} мкМ: существует только однородный раствор, в плотной фазе нет ни одной молекулы.", "s3b_c_below_z": "Пока концентрация каркасного белка остаётся ниже порога, её повышение не приводит к образованию компартмента.", "s3b_c_near": "Общая концентрация {c} мкМ близка к порогу {cs} мкМ, но ниже него: раствор ещё однороден, капель нет.", "s3b_c_near_z": "Небольшое повышение концентрации сверх порога вызовет появление капель: сборка носит пороговый характер.", "s3b_c_just": "Общая концентрация {c} мкМ чуть выше порога {cs} мкМ: появились капли, в плотной фазе — {fd} % молекул; концентрация в разбавленной фазе равна порогу.", "s3b_c_just_z": "В этой идеальной модели весь избыток белка сверх порога уходит в плотную фазу, а концентрация вне капель не растёт.", "s3b_c_above": "Общая концентрация {c} мкМ: капли занимают {phi} % объёма, но содержат {fd} % молекул белка; вне капель концентрация остаётся равной порогу {cs} мкМ.", "s3b_c_above_z": "Плотная фаза концентрирует белок примерно в сто раз; поэтому малый объём капель может вмещать большую часть молекул.", "s3b_take": "В этой модели капли плотной фазы образуются, когда концентрация мультивалентного каркасного белка превышает концентрацию насыщения. Ниже порога есть только раствор; выше избыток уходит в плотную фазу, а концентрация в разбавленной фазе в идеальной модели с одним эффективным каркасным компонентом остаётся равной порогу. Чем больше связывающих модулей в молекуле, тем ниже порог. В многокомпонентных конденсатах клетки концентрация насыщения может не быть постоянной, и концентрация вне капель может расти вместе с общим количеством белка (Riback 2020).", "gn_scaf": "Каркасный белок (каркасный компонент)", "g_scaf": "Мультивалентная молекула, взаимодействия которой образуют сеть конденсата; без неё конденсат не существует. Белок-клиент, напротив, связывается с каркасом и накапливается в конденсате, но для его образования не нужен. В модели — два белка-партнёра с одинаковым числом связывающих модулей (по типу SH3ₙ + PRMₙ, Li 2012); каждый контакт слабый (константа диссоциации SH3 с одним пролиновым мотивом в этой системе около 350 мкМ), и сеть удерживается множеством таких контактов; её устойчивость зависит и от их числа, и от сродства. Роль каркаса или клиента относится к данной системе и условиям. Пороги в модели — учебные величины.", "p3b_1_q": "У белков с четырьмя модулями порог — 60 мкМ. Общую концентрацию повысили с 80 до 160 мкМ. Как изменится концентрация белка в разбавленной фазе?", "p3b_1_o1": "Почти не изменится: останется около 60 мкМ", "p3b_1_o2": "Вырастет вдвое: со 80 до 160 мкМ", "p3b_1_o3": "Снизится почти до нуля: весь белок перейдёт в капли", "p3b_1_e": "Выше порога разбавленная фаза насыщена: в идеальной модели с одним эффективным каркасным компонентом её концентрация равна порогу, 60 мкМ, при любой общей концентрации. Прибавка белка уходит в плотную фазу: капли занимают больше объёма, доля молекул в них растёт с 25 до 63 %.", "p3b_1_w2": "Так менялась бы концентрация без фазового разделения. Выше порога избыток белка уходит в капли, и раствор вокруг них остаётся насыщенным.", "p3b_1_w3": "Капли существуют в равновесии с насыщенным раствором: вне капель белок остаётся в концентрации порога, а не исчезает.", "p3b_2_q": "У белков с четырьмя модулями порог — 60 мкМ. Общую концентрацию повысили с 30 до 50 мкМ. Какая доля молекул окажется в плотной фазе?", "p3b_2_o1": "Ноль: капли не образуются", "p3b_2_o2": "Около 40 %: прибавка уйдёт в капли", "p3b_2_o3": "Около 5 %: появятся мелкие капли", "p3b_2_e": "50 мкМ — всё ещё ниже порога 60 мкМ. Ниже концентрации насыщения существует только однородный раствор, поэтому в плотной фазе нет ни одной молекулы. Капли появятся, только когда общая концентрация превысит 60 мкМ.", "p3b_2_w2": "В плотную фазу уходит лишь избыток над порогом. Ниже порога избытка нет, и вся прибавка белка остаётся в растворе.", "p3b_2_w3": "Мелкие капли «заранее» не образуются: при 50 мкМ, ниже порога 60 мкМ, плотной фазы в этой равновесной модели нет. Она появляется только выше порога; при небольшом превышении в ней мало молекул, и их доля растёт постепенно вместе с общей концентрацией.", "p3b_3_q": "Общая концентрация белков — 80 мкМ. Вместо молекул с тремя модулями взяли молекулы с пятью модулями. Как изменится доля молекул в плотной фазе?", "p3b_3_o1": "Вырастет: порог станет ниже", "p3b_3_o2": "Не изменится: концентрация та же", "p3b_3_o3": "Снизится: молекулы станут крупнее", "p3b_3_e": "Каждая молекула с пятью модулями может связать больше партнёров, и в модели порог фазового разделения снижается со 120 до 30 мкМ. При 80 мкМ молекулы с тремя модулями остаются в растворе, а молекулы с пятью модулями образуют капли, в которых находится 63 % молекул.", "p3b_3_w2": "Порог зависит не только от концентрации, но и от свойств молекул. Больше модулей — больше возможных контактов и ниже концентрация, при которой появляются капли.", "p3b_3_w3": "Размер молекулы здесь не главное. Дополнительные модули добавляют участки связывания, и порог появления капель снижается.", "p3b_4_q": "В растворе белков с четырьмя модулями (порог — 60 мкМ) при 120 мкМ есть капли. Раствор разбавили до 40 мкМ. Как изменится объём, занятый каплями?", "p3b_4_o1": "Станет нулевым: концентрация ниже порога", "p3b_4_o2": "Уменьшится втрое: капли станут мельче", "p3b_4_o3": "Не изменится: плотная фаза необратима", "p3b_4_e": "Капли образованы обратимыми слабыми контактами и существуют, только пока концентрация выше порога. После разбавления до 40 мкМ избытка над порогом нет, и весь белок возвращается в однородный раствор. В клетке исчезновение при разведении согласуется с фазовым разделением, но само по себе его не доказывает.", "p3b_4_w2": "Капли уменьшаются при снижении концентрации, только пока она остаётся выше порога. При 40 мкМ избытка нет, и плотная фаза исчезает полностью.", "p3b_4
