t":"","tfeb":"TFEB дефосфорилирован,\nпереходит в ядро","new":"новые лизосомы (часы)"},"b":{},"m":[["TFEB","в ядре"],["Пополнение пула","через часы"]],"note":"При повреждении mTORC1 отходит от лизосомы, Ca²⁺ через TRPML1 активирует кальциневрин, ATG8 на мембране усиливают сигнал; TFEB дефосфорилируется, переходит в ядро и включает гены лизосом. Параллельно из повреждённой лизосомы вытягиваются трубки (LYTL)."},"1-0-1":{"n":{"dm":"on","mt":"low","ca":"on","cn":"on","casm":"on","tfeb":"abs","nuc":"off","reg":"on","bf":"off","new":"low"},"e":{"m0":"on","c0":"on","k1":"on","k2":"on","a1":"on","a2":"off","a3":"off","b1":"off","b2":"off","b3":"on","b4":"off"},"t":{"dm":"повреждённая лизосома","mt":"mTORC1 отходит\nот лизосомы","tfeb":"TFEB отсутствует","new":"пул пополняется\nмедленнее"},"tn":{"dm":"повреждённая лизосома","mt":"","tfeb":"TFEB отсутствует","new":"пул пополняется\nмедленнее"},"b":{},"m":[["TFEB","отсутствует"],["Пополнение пула","медленнее"]],"note":"Без TFEB программа биогенеза не включается; пул пополняется за счёт базового синтеза и регенерации из повреждённых лизосом, поэтому ожидается более медленное восстановление."},"1-1-0":{"n":{"dm":"on","mt":"low","ca":"on","cn":"low","casm":"abs","tfeb":"low","nuc":"low","reg":"low","bf":"off","new":"low"},"e":{"m0":"on","c0":"on","k1":"off","k2":"off","a1":"on","a2":"off","a3":"on","b1":"on","b2":"on","b3":"on","b4":"off"},"t":{"dm":"повреждённая лизосома","mt":"mTORC1 отходит\nот лизосомы","tfeb":"TFEB: активация\nослаблена","new":"пул пополняется\nс задержкой"},"tn":{"dm":"повреждённая лизосома","mt":"","tfeb":"TFEB: активация\nослаблена","new":"пул пополняется\nс задержкой"},"b":{},"m":[["TFEB","активация ослаблена"],["Пополнение пула","с задержкой"]],"note":"Без присоединения ATG8 слабее выход Ca²⁺ через TRPML1 и нет связывания FLCN: активация TFEB ослаблена (Nakamura 2020: HeLa и модель повреждения почки у мыши; Meyer & Kravic 2024)."},"1-1-1":{"n":{"dm":"on","mt":"low","ca":"on","cn":"low","casm":"abs","tfeb":"abs","nuc":"off","reg":"low","bf":"off","new":"low"},"e":{"m0":"on","c0":"on","k1":"off","k2":"off","a1":"on","a2":"off","a3":"off","b1":"off","b2":"off","b3":"on","b4":"off"},"t":{"dm":"повреждённая лизосома","mt":"mTORC1 отходит\nот лизосомы","tfeb":"TFEB отсутствует","new":"пул пополняется\nмедленнее"},"tn":{"dm":"повреждённая лизосома","mt":"","tfeb":"TFEB отсутствует","new":"пул пополняется\nмедленнее"},"b":{},"m":[["TFEB","отсутствует"],["Пополнение пула","медленнее"]],"note":"Без TFEB программа биогенеза не включается; пул пополняется за счёт базового синтеза и регенерации из повреждённых лизосом, поэтому ожидается более медленное восстановление."}}}}},{"id":"lyso-measure","number":18,"section":2,"title":"Как зарегистрировать повреждение и ремонт","question":3,"questions":[3],"keywords":["метка галектина-3","LysoTracker","TFEB","LLOMe","импульс","кривая во времени","контроль","число точек"],"lead":["Повреждение лизосомы и ответ на него оценивают по разным признакам: появлению галектина-3 на лизосомах, утрате сигнала красителя, переходу TFEB в ядро и динамике этих показателей.","Каждый признак отвечает на свой вопрос и имеет ограничения, поэтому выводы строят по нескольким признакам сразу."],"mechanism":["Галектин-3 из цитозоля связывается с открытыми гликанами и образует точки на лизосомах с крупным повреждением.","LysoTracker накапливается в кислых отсеках, и повреждённые лизосомы теряют его сигнал.","TFEB переходит в ядро после повреждения, а динамику показателей получают, фиксируя клетки через разные сроки после импульса LLOMe."],"paragraphs":["Для воспроизводимого повреждения клетки обрабатывают LLOMe коротким импульсом, отмывают вещество и фиксируют или снимают клетки через разные сроки. Так отделяют быстрые события (минуты: выход Ca²⁺, сборка ESCRT) от медленных (часы: лизофагия, ядерный TFEB, восстановление пула).","Метка галектина-3 показывает лизосомы с открытыми гликанами, то есть с крупным повреждением; точки считают на клетку в нескольких полях. LysoTracker показывает, сохранилась ли кислая среда; сигнал теряют лизосомы и с малым, и с крупным повреждением. Поэтому по галектину-3 повреждение может быть занижено, а по красителю не различить размер и причину. Ядерный TFEB показывает запуск программы биогенеза, но не образование лизосом.","Каждый показатель сопровождают контролем: клетки без LLOMe, клетки без катепсина C, нокауты и ингибиторы отдельных ступеней ответа. Число точек не равно числу повреждённых лизосом: малые повреждения, как правило, точек не дают (для малых повреждений вывод не установлен), а спад числа точек может отражать и ремонт, и удаление; близкие друг к другу лизосомы на изображении могут слиться в одну точку (предел разрешения микроскопа). Кривые на пиктограммах условные.","Граница вывода: все показатели косвенные, и ни один сам по себе не различает ремонт и удаление. Для этого сравнивают показатели при подавлении отдельных процессов."],"trap":["Число точек галектина-3 равно числу повреждённых лизосом.","Точка отмечает отдельную лизосому с открытыми гликанами (Aits 2015), но малые повреждения, как правило, точек не дают (для малых повреждений вывод не установлен), а спад числа точек отражает и ремонт, и удаление. Поэтому число точек — показатель крупных повреждений, а не счётчик всех повреждённых лизосом."],"conditions":"Схема метода; пиктограммы условные, не данные эксперимента. Метод точек галектина описан в работе Aits 2015 (клетки человека и мыши, ткани); ограничения LysoTracker изложены в обзоре Barral 2022; ядерная локализация TFEB как показатель — Medina 2015; динамика ответа — по обзору Meyer & Kravic 2024.","sources":["Aits2015","Barral2022","Medina2015","MeyerKravic2024"],"quiz":{"id":"S12-L18","rev":1,"question":"После короткого импульса LLOMe точек галектина-3 мало, но сигнал LysoTracker утрачен у большинства лизосом. Какое объяснение согласуется с обоими наблюдениями?","options":[{"id":"S12-L18-1","text":"Повреждения в основном малые: кислая среда потеряна, а гликаны остались закрытыми.","correct":true,"feedback":"Верно: краситель теряют и лизосомы с малым повреждением, у которых нарушен протонный градиент, а галектин-3 связывается с гликанами, открытыми при более крупном повреждении."},{"id":"S12-L18-2","text":"Галектин-3 в этих клетках не экспрессируется, поэтому повреждений нет.","correct":false,"feedback":"Утрата сигнала LysoTracker уже показывает потерю кислой среды; отсутствие точек не означает отсутствия повреждений."},{"id":"S12-L18-3","text":"Краситель выходит из лизосом при любой обработке, поэтому его сигнал ничего не показывает.","correct":false,"feedback":"У красителя есть ограничения, но он остаётся показателем сохранности кислой среды при контроле без LLOMe."}]},"widget":{"kind":"cards","title":"","s":{"title":"Как регистрируют повреждение лизосомы и ответ на него","status":"Схема метода · условные пиктограммы","opts_label":"Показатель или схема","opts":["Метка галектина-3","LysoTracker","TFEB в ядре","Кривые во времени","Схема эксперимента"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"cards":[{"v":["Появление галектина-3 на лизосомах с открытыми гликанами: показатель крупного повреждения мембраны.","Клетки со слитым с флуоресцентным белком или окрашенным антителами галектином-3 фиксируют или снимают после импульса LLOMe и считают точки на клетку.","Клетки без LLOMe; клетки без катепсина C, в которых LLOMe не должен давать точек; галектин-3 с мутацией центра связывания сахаров.","Малые и быстро отремонтированные повреждения, как правило, точек не дают; число точек не равно числу повреждённых лизосом."],"note":"Если точек нет, это не означает отсутствия повреждения: малые повреждения галектином не метятся, поэтому результат сопоставляют с другим показателем, например с утратой сигнала красителя.","pic":{"kind":"cells","panels":[{"lab":"без LLOMe:\nгалектин-3 в цитозоле","cyt":0.5,"dots":[]},{"lab":"после LLOMe,\nкрупные повреждения","cyt":0.2,"dots":[["green",9]]},{"lab":"после LLOMe,\nтолько малые","cyt":0.5,"dots":[]}]}},{"v":["Сохранение кислой среды в просвете лизосом; утрата сигнала указывает на потерю кислотности.","Живые клетки инкубируют с красителем — слабым основанием, которое накапливается в кислых отсеках, и снимают до воздействия и после него.","Клетки без воздействия; бафиломицин A1, угнетающий V-ATPase, как контроль зависимости сигнала от кислотности.","Краситель метит и поздние эндосомы, не измеряет pH количественно и сам может защелачивать лизосомы; утрата сигнала не различает малое и крупное повреждение."],"note":"Утрата сигнала LysoTracker показывает потерю кислотности, но не говорит о размере повреждения и о причине; поэтому её сопоставляют с галектином-3.","pic":{"kind":"cells","panels":[{"lab":"без LLOMe:\nмного ярких точек","dots":[["magenta",12]]},{"lab":"после LLOMe:\nсигнал утрачен","dots":[["magenta",3]]},{"lab":"бафиломицин A1:\nсигнал утрачен","dots":[["magenta",2]]}]}},{"v":["Долю TFEB в ядре, Fя / (Fя + Fц), в процентах — показатель запуска программы биогенеза лизосом.","Иммунофлуоресценция TFEB или TFEB, слитый с флуоресцентным белком. В каждой клетке измеряют интегральный сигнал ядра Fя и цитоплазмы Fц после вычитания фона. Отношение средних интенсивностей ядра и цитоплазмы (N/C) — другой показатель: оно не равно доле и зависит от объёмов отсеков.","Клетки без TFEB (специфичность сигнала); голодание как положительный контроль переноса TFEB в ядро.","Ядерный TFEB показывает запуск программы, но не образование новых лизосом; TFEB переходит в ядро и при других воздействиях, например при голодании."],"note":"Ядерный TFEB — вход в программу биогенеза. Чтобы судить о восстановлении пула, дополнительно измеряют экспрессию генов лизосом или число лизосом.","pic":{"kind":"cells","panels":[{"lab":"без повреждения:\nTFEB в цитозоле","nuc":0.05,"cyt":0.6,"dots":[]},{"lab":"после LLOMe:\nTFEB в ядре","nuc":0.9,"cyt":0.15,"dots":[]},{"lab":"нет присоединения\nATG8: слабее","nuc":0.35,"cyt":0.45,"dots":[]}]}},{"v":["Изменение показателей во времени после одного импульса LLOMe: быстрый ремонт (минуты), затем удаление и восстановление пула (часы).","Клетки фиксируют или снимают через разные сроки после импульса и отмывки LLOMe; на каждом сроке считают точки галектина-3, долю клеток с ядерным TFEB и состояние лизосом.","Клетки без LLOMe на каждом сроке; клетки с подавленным ремонтом (ESCRT) или лизофагией для разделения процессов.","Спад числа точек может отражать и ремонт, и удаление; кривые разных показателей нельзя сравнивать по высоте. Кривые на схеме условные."],"note":"Кривые показывают порядок событий: сначала повреждение, затем ядерный TFEB и удаление лизосом, позже восстановление пула. Высота и сроки условные.","pic":{"kind":"lines","xlab":"время после импульса LLOMe, ч (условно)","ylab":"условная величина","xmax":24,"ymax":1,"xticks":[0,8,16,24],"yticks":[0,1],"series":[{"name":"точки галектина-3","pts":[[0,0],[0.5,1],[4,0.75],[10,0.4],[24,0.05]],"dy":-8},{"name":"ядерный TFEB","pts":[[0,0],[2,0.35],[6,0.8],[12,0.55],[24,0.3]],"dy":-8},{"name":"пул лизосом","pts":[[0,1],[3,0.85],[10,0.7],[18,0.82],[24,0.95]],"dash":true,"dy":-8}]}},{"v":["Последовательность действий в эксперименте с импульсом LLOMe и несколькими сроками регистрации.","Короткая обработка LLOMe; отмывка; фиксация клеток через разные сроки; окрашивание на галектин-3, LAMP1 и TFEB; подсчёт точек и ядер при микроскопии.","Клетки без LLOMe; клетки без катепсина C; одинаковые условия окрашивания и съёмки на всех сроках; подсчёт в нескольких полях.","Дозу и сроки подбирают для конкретных клеток; результат одной линии нельзя без проверки переносить на другие клетки и ткани."],"note":"Короткий импульс и несколько сроков позволяют отделить быстрые события от медленных; выводы о причинах требуют сравнения с контролями.","pic":{"kind":"steps","steps":["импульс\nLLOMe","отмывка","фиксация в\nразные сроки","окрашивание:\nгалектин-3, TFEB","подсчёт точек\nи ядер"],"hl":0}}],"fixed":"Пиктограммы условные: они показывают принцип метода, а не данные конкретного эксперимента."}}},{"id":"route-principle","number":19,"section":3,"title":"Чем определяется судьба повреждённого белка","question":4,"questions":[4],"keywords":["судьба повреждённого белка","маршруты деградации","рефолдинг","протеасома","ERAD","аутофагия","размер субстрата","отсек","ёмкость протеостаза"],"lead":["Повреждённый белок может свернуться повторно, быть разрушен протеасомой, выведен через ERAD или удалён аутофагией. Распределение между этими маршрутами задают физические свойства субстрата и доступность общих молекул, а не оценка степени повреждения."],"mechanism":["Одиночный развёрнутый полипептид — проходит в узкий канал протеасомы или повторно сворачивается с участием Hsp70.","Агрегат, крупный комплекс или органелла — не проходят в канал и удаляются аутофагией; растворимый белок просвета ЭПР сначала передаётся ERAD.","Маршруты используют общие молекулы — Hsp70, убиквитин, p62, p97, — поэтому снижение [[T47|ёмкости]] одного звена меняет нагрузку на остальные."],"paragraphs":["Повреждённый белок потерял нативную структуру. Он может быть несвёрнутым полипептидом, агрегатом или белком мембраны органеллы. Для таких молекул есть четыре маршрута: повторное сворачивание шаперонами, 26S-протеасома, ERAD для белков эндоплазматического ретикулума и аутофагия.","Распределение молекул между маршрутами называют [[T46|триажем белков]]. Центральной системы, которая оценивала бы степень повреждения и выбирала путь, нет: убиквитин-протеасомная система и аутофагия управляются сродством связывания, локальными концентрациями, авидностью и разделением на отсеки (Pohl, Dikic 2019). Главный параметр — размер субстрата. Протеасома разрушает преимущественно одиночные развёрнутые полипептиды, а аутофагия — более крупные структуры: комплексы, агрегаты, органеллы.","Отсек тоже ограничивает доступ. Белки просвета ЭПР отделены мембраной от цитозольных протеасом, поэтому их сначала передаёт ERAD (Christianson 2023). Общие компоненты — шапероны, убиквитин, p97 и протеасомы — ограничены, и маршруты конкурируют за них. При старении и хронической экспрессии агрегирующих белков [[T47|ёмкость]] этих звеньев снижается, агрегаты захватывают шапероны и протеасомы, и несвёрнутых молекул становится больше (Hipp 2019).","Схема качественная: она показывает, какие маршруты доступны, но не доли молекул. Доли зависят от вида, ткани и воздействия, и общих значений в источниках нет. Агрегат или органелла — не «более тяжёлое повреждение» того же белка, а другая физическая форма субстрата."],"trap":["Маршрут повреждённого белка определяется тем, насколько сильно он повреждён: слабо повреждённые молекулы сворачиваются, сильно повреждённые уходят в аутофагию.","Сама степень повреждения маршрут не задаёт. Судьбу определяют размер и олигомерное состояние субстрата, отсек, тип убиквитиновой метки и концентрации общих компонентов; маршруты конкурируют по скорости, а центрального механизма выбора нет (Pohl, Dikic 2019)."],"conditions":"Схема механизма, качественные состояния; клетки эукариот. Основа — обзоры Pohl, Dikic 2019 и Hipp 2019 (полные тексты) и Christianson 2023 (полный текст; ERAD: распознавание субстратов в просвете ЭПР, рис. 2); реферат Rosenzweig 2019 (шапероны); Chan 2011 (митохондрии, клетки HeLa, SH-SY5Y и мыши; полный текст). Рамка из точек означает, что маршрут возможен, но в источниках не назван основным для этого субстрата; доли молекул на схеме не показаны. Состояние «общие компоненты заняты» показано качественно по Hipp 2019, количественно не оценено.","sources":["PohlDikic2019","Hipp2019","Christianson2023","Rosenzweig2019","Chan2011"],"quiz":{"id":"S12-L19","rev":1,"question":"Белок X в цитозоле существует в виде одиночных развёрнутых полипептидов. Затем молекулы X объединяются в крупный агрегат. Как изменится доступность X для 26S-протеасомы и для аутофагии?","options":[{"id":"S12-L19-1","text":"Протеасома продолжит принимать агрегат, но медленнее, пропорционально степени повреждения.","correct":false,"feedback":"Размер определяет не скорость, а возможность входа: агрегат в узкий канал протеасомы не проходит."},{"id":"S12-L19-2","text":"Протеасома перестанет принимать молекулу, а доступным основным маршрутом останется аутофагия.","correct":true,"feedback":"Протеасома принимает преимущественно одиночные развёрнутые полипептиды, а агрегаты удаляет аутофагия (Pohl, Dikic 2019)."},{"id":"S12-L19-3","text":"Обе системы останутся одинаково доступными, потому что маршрут задаёт только степень повреждения.","correct":false,"feedback":"Степень повреждения сама маршрут не задаёт: доступность определяют размер, отсек и метка."}]},"widget":{"kind":"net","title":"","s":{"title":"Доступные маршруты зависят от свойств субстрата","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Повреждённый субстрат","opts":["Развёрнутый белок цитозоля","Агрегат в цитозоле","Белок в просвете ЭПР","Митохондрия с меткой Parkin"]},{"id":"a","type":"check","label":"Общие компоненты заняты (старение, хроническая нагрузка)"}],"W":560,"H":412,"NW":340,"NH":424,"lg":{"title":"Обозначения на схеме","act":"регулирует, ускоряет","inh":"тормозит","tr":"перенос через мембрану","rx":"химическое превращение","bind":"связывание","seq":"путь молекулы или порядок событий","dash":"косвенная или возможная связь","nodes":["жёлтая рамка — маршрут или звено работает","пунктир из точек — возможен, вклад небольшой","серый пунктир — этот субстрат не принимает","зачёркнуто — подавлено"]},"zones":[],"mem":[],"nodes":{"sub":{"p":[92,205,150,130],"t":"развёрнутый\nбелок\nцитозоля","n":[58,212,100,170],"fs":15},"ref":{"p":[330,52,200,62],"t":"рефолдинг\n(Hsp70 / BiP)","n":[246,50,164,58],"fs":15},"erad":{"p":[330,152,200,62],"t":"ERAD\n(HRD1–SEL1L, p97)","n":[246,148,164,58],"fs":15},"prot":{"p":[330,252,200,62],"t":"протеасома 26S","n":[246,246,164,58],"fs":15},"aut":{"p":[330,352,200,62],"t":"аутофагия\n(рецепторы, ATG8)","n":[246,344,164,58],"fs":15},"rf":{"p":[503,52,96,46],"t":"свёрнутый\nбелок","n":[0,0,10,10],"fs":14,"nn":true},"rp":{"p":[503,252,96,46],"t":"пептиды","n":[0,0,10,10],"fs":14,"nn":true},"rl":{"p":[503,352,96,46],"t":"лизосома","n":[0,0,10,10],"fs":14,"nn":true}},"edges":{"s_ref":{"a":"sub","b":"ref","k":"seq"},"s_erad":{"a":"sub","b":"erad","k":"seq"},"s_prot":{"a":"sub","b":"prot","k":"seq"},"s_aut":{"a":"sub","b":"aut","k":"seq"},"e_prot":{"a":"erad","b":"prot","k":"seq","t":"после вывода\nв цитозоль","d":[-14,0],"dn":[0,0],"anc":"end","tn":""},"ref_r":{"a":"ref","b":"rf","k":"seq","nn":true},"prot_r":{"a":"prot","b":"rp","k":"rx","nn":true},"aut_r":{"a":"aut","b":"rl","k":"seq","nn":true}},"st":{"0-0":{"n":{"sub":"base","ref":"on","erad":"off","prot":"on","aut":"low","rf":"on","rp":"on","rl":"low"},"e":{"s_ref":"on","s_erad":"off","s_prot":"on","s_aut":"on","e_prot":"hide","ref_r":"on","prot_r":"on","aut_r":"on"},"t":{"sub":"развёрнутый\nбелок\nцитозоля"},"m":[["Доступные маршруты","рефолдинг, протеасома"],["Что ограничивает","ёмкость Hsp70 и убиквитинирования"]],"note":"Одиночный развёрнутый полипептид может повторно свернуться с участием Hsp70 или, после убиквитинирования, пройти в канал протеасомы. Для такого субстрата аутофагия — не основной путь."},"0-1":{"n":{"sub":"base","ref":"low","erad":"off","prot":"low","aut":"on","rf":"low","rp":"low","rl":"on"},"e":{"s_ref":"on","s_erad":"off","s_prot":"on","s_aut":"on","e_prot":"hide","ref_r":"on","prot_r":"on","aut_r":"on"},"t":{"sub":"развёрнутый\nбелок\nцитозоля"},"m":[["Доступные маршруты","те же, но с меньшей скоростью"],["Что ограничивает","занятость общих компонентов"]],"note":"Если Hsp70, убиквитин и протеасомы заняты другими субстратами, молекула дольше остаётся несвёрнутой и может агрегировать (Hipp 2019). Агрегаты удаляет аутофагия."},"1-0":{"n":{"sub":"base","ref":"low","erad":"off","prot":"off","aut":"on","rf":"low","rp":"off","rl":"on"},"e":{"s_ref":"on","s_erad":"off","s_prot":"off","s_aut":"on","e_prot":"hide","ref_r":"on","prot_r":"off","aut_r":"on"},"t":{"sub":"агрегат\nв цитозоле"},"m":[["Доступные маршруты","аутофагия; рефолдинг — вклад небольшой"],["Что ограничивает","размер: в канал протеасомы не проходит"]],"note":"Агрегат слишком велик для узкого канала протеасомы. Его удаляет аутофагия. Сеть Hsp70 участвует и в разборке агрегатов (Rosenzweig 2019), но основным путём для агрегата она не названа."},"1-1":{"n":{"sub":"base","ref":"low","erad":"off","prot":"off","aut":"on","rf":"low","rp":"off","rl":"on"},"e":{"s_ref":"on","s_erad":"off","s_prot":"off","s_aut":"on","e_prot":"hide","ref_r":"on","prot_r":"off","aut_r":"on"},"t":{"sub":"агрегат\nв цитозоле"},"m":[["Доступные маршруты","аутофагия"],["Что ограничивает","агрегаты занимают шапероны и протеасомы"]],"note":"Агрегаты захватывают шапероны и протеасомы и снижают ёмкость сети: возникает положительная обратная связь, при которой агрегируют новые молекулы (Hipp 2019)."},"2-0":{"n":{"sub":"base","ref":"on","erad":"on","prot":"on","aut":"low","rf":"on","rp":"on","rl":"low"},"e":{"s_ref":"on","s_erad":"on","s_prot":"off","s_aut":"on","e_prot":"on","ref_r":"on","prot_r":"on","aut_r":"on"},"t":{"sub":"белок\nв просвете\nЭПР"},"m":[["Доступные маршруты","рефолдинг (BiP), ERAD → протеасома"],["Что ограничивает","мембрана ЭПР: прямой доступ протеасомы закрыт"]],"note":"Белок просвета ЭПР отделён мембраной от цитозольных протеасом. Несвёрнутый растворимый белок сначала может свернуться с участием BiP; если не удаётся, ERAD выводит его в цитозоль и передаёт на протеасому (Christianson 2023)."},"2-1":{"n":{"sub":"base","ref":"on","erad":"low","prot":"low","aut":"low","rf":"on","rp":"low","rl":"low"},"e":{"s_ref":"on","s_erad":"on","s_prot":"off","s_aut":"on","e_prot":"on","ref_r":"on","prot_r":"on","aut_r":"on"},"t":{"sub":"белок\nв просвете\nЭПР"},"m":[["Доступные маршруты","те же; ERAD медленнее"],["Что ограничивает","общие убиквитин, p97 и протеасомы"]],"note":"По логике общих компонентов (убиквитин, p97 и протеасомы используют и ERAD, и цитозольные пути) их занятость должна замедлять вывод из ЭПР, и несвёрнутые молекулы дольше остаются в просвете. Прямых измерений этого в использованных источниках нет: состояние показано как допущение схемы."},"3-0":{"n":{"sub":"base","ref":"off","erad":"off","prot":"on","aut":"on","rf":"off","rp":"on","rl":"on"},"e":{"s_ref":"off","s_erad":"off","s_prot":"on","s_aut":"on","e_prot":"hide","ref_r":"off","prot_r":"on","aut_r":"on"},"t":{"sub":"митохондрия\nс меткой\nParkin","prot":"протеасома 26S\n(белки наружной\nмембраны)"},"m":[["Доступные маршруты","митофагия + протеасома для белков наружной мембраны"],["Что ограничивает","размер органеллы: в канал проходит только часть белков"]],"note":"Целая органелла в канал протеасомы не проходит, и её удаляет митофагия. Но белки наружной мембраны с цепями K48 извлекает p97, и разрушает протеасома; в клетках с избытком Parkin подавление протеасомы блокировало Parkin-зависимую митофагию (Chan 2011)."},"3-1":{"n":{"sub":"base","ref":"off","erad":"off","prot":"low","aut":"on","rf":"off","rp":"low","rl":"on"},"e":{"s_ref":"off","s_erad":"off","s_prot":"on","s_aut":"on","e_prot":"hide","ref_r":"off","prot_r":"on","aut_r":"on"},"t":{"sub":"митохондрия\nс меткой\nParkin","prot":"протеасома 26S\n(белки наружной\nмембраны)"},"m":[["Доступные маршруты","митофагия + протеасома, но медленнее"],["Что ограничивает","занятость протеасомы"]],"note":"Если протеасома занята, очистка наружной мембраны от помеченных белков, по логике схемы, замедляется. Поскольку в клетках с избытком Parkin подавление протеасомы блокировало Parkin-зависимую митофагию (Chan 2011), это должно сказываться и на митофагии; частичная занятость протеасомы в источниках не измерялась, состояние показано как допущение схемы."}},"notes_svg":[{"t":"Определяют: размер, отсек,\nметка, олигомерное состояние","x":16,"y":376,"a":"start","fs":13,"n":[8,406],"tn":"размер · отсек · метка · олигомерное состояние","c":"#4d6275"}],"fs":15,"nfs":13,"lfs":14,"zfs":14,"nlfs":12,"nzfs":12}}},{"id":"route-chaperone","number":20,"section":3,"title":"Рефолдинг и передача на деградацию","question":4,"questions":[4],"keywords":["Hsp70","J-белки","CHIP","BAG1","BAG3","HSPB8","CASA","рефолдинг","убиквитинлигаза"],"lead":["Hsp70 помогает несвёрнутому белку свернуться, а если свёртывание не удаётся, те же шапероны передают его на деградацию. Куда пойдёт субстрат, зависит от ко-шаперонов, присоединившихся к Hsp70."],"mechanism":["Hsp70 — связывает несвёрнутый субстрат; J-белки и факторы обмена нуклеотида регулируют цикл АТФазы.","[[T48|CHIP]] — присоединяется к Hsp70 и убиквитинирует субстрат, не способный свернуться, что направляет его в протеасому.","[[T49|BAG1]] ведёт убиквитинированные белки в протеасому, [[T49|BAG3]] с HSPB8 и p62 — в аутофагию ([[T50|CASA]])."],"paragraphs":["Hsp70 участвует во всех этапах жизни белка — от синтеза до деградации (Rosenzweig 2019). Он связывает несвёрнутые полипептиды. Цикл связывания и освобождения субстрата регулируют J-белки и факторы обмена нуклеотида; вместе с Hsp70 они составляют сеть шаперонов. Если белок принимает нативную структуру, он покидает комплекс: это рефолдинг.","Субстрат, который не может свернуться, долго остаётся в комплексе с шаперонами. Исход зависит от времени пребывания в комплексе. К такому комплексу присоединяется CHIP — убиквитинлигаза, связывающаяся с С-концом Hsp70 или Hsp90 (Hipp 2019). Она убиквитинирует субстрат и этим направляет его в протеасому. Для рецептора глюкокортикоидов показано, что CHIP смещает баланс от свёртывания к деградации (Connell 2001).","Дальнейший путь зависит от ко-шаперона. В культивируемых клетках BAG1 связан с протеасомной деградацией полиубиквитинированных белков, а BAG3 — с макроаутофагией; в моделях клеточного старения и в мозге грызунов доля BAG3 растёт (Gamerdinger 2009). BAG3 с Hsc70, HSPB8, CHIP и адаптером p62 образует комплекс CASA, который удаляет повреждённые белки Z-диска мышц (Arndt 2010). Как строится аутофагосома, разобрано в семинаре 11.","Схема описывает установленные комплексы. Как часто субстрат попадает в каждый из них, зависит от ткани и условий, и общей доли в источниках нет."],"trap":["Шапероны помогают белкам свернуться, а на деградацию их направляют другие системы без участия шаперонов.","Те же шапероны участвуют в передаче на деградацию: CHIP присоединяется к Hsp70 и убиквитинирует субстрат, а BAG1 и BAG3 направляют его в протеасому или в аутофагию (Connell 2001; Gamerdinger 2009; Arndt 2010)."],"conditions":"Схема механизма, качественные состояния. Данные: клетки COS (CHIP и рецептор глюкокортикоидов; Connell 2001, реферат); культивируемые клетки и мозг грызунов (BAG1 и BAG3; Gamerdinger 2009, реферат); Drosophila, мышь и мышечные клетки (CASA; Arndt 2010, реферат); сеть Hsp70 и CHIP — обзоры Rosenzweig 2019 (реферат) и Hipp 2019. Роль BAG1 и BAG3 как жёстких переключателей источники не утверждают.","sources":["Rosenzweig2019","Connell2001","Hipp2019","Gamerdinger2009","Arndt2010"],"quiz":{"id":"S12-L20","rev":1,"question":"В культивируемых клетках маршрут полиубиквитинированных белков зависит от соотношения BAG3 и BAG1. Соотношение BAG3 к BAG1 возрастает, как при клеточном старении. Как изменится доля макроаутофагии в удалении этих белков?","options":[{"id":"S12-L20-1","text":"Доля макроаутофагии снизится, потому что BAG3 усиливает передачу в протеасому.","correct":false,"feedback":"BAG3, а не BAG1, связан с макроаутофагией; BAG1 связан с протеасомным путём (Gamerdinger 2009)."},{"id":"S12-L20-2","text":"Доля макроаутофагии не изменится, потому что маршрут задаёт только тип убиквитиновой цепи.","correct":false,"feedback":"Тип цепи важен, но не единственный фактор: при смещении к BAG3 чаще используется макроаутофагия."},{"id":"S12-L20-3","text":"Доля макроаутофагии возрастёт, а доля протеасомного пути относительно уменьшится.","correct":true,"feedback":"Переход от BAG1 к BAG3 означает более частое использование макроаутофагии для оборота полиубиквитинированных белков (Gamerdinger 2009)."}]},"widget":{"kind":"net","title":"","s":{"title":"Hsp70: свёртывание или передача на деградацию","status":"Схема механизма · качественные состояния","ctrls":[{"id":"x","type":"group","label":"Что происходит с субстратом на Hsp70","opts":["Свёртывание удаётся","Не удаётся: CHIP","…и BAG1","…и BAG3 с HSPB8"]}],"W":560,"H":400,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"регулирует, ускоряет","inh":"тормозит","tr":"перенос через мембрану","rx":"химическое превращение","bind":"связывание","seq":"путь молекулы или порядок событий","dash":"косвенная или возможная связь","nodes":["жёлтая рамка — маршрут или звено работает","пунктир из точек — возможен, вклад небольшой","серый пунктир — этот субстрат не принимает","зачёркнуто — подавлено"]},"zones":[],"mem":[],"nodes":{"cof":{"p":[215,40,210,52],"t":"J-белки и факторы\nобмена нуклеотида","n":[170,38,200,52],"fs":14},"sub":{"p":[72,136,124,62],"t":"несвёрнутый\nсубстрат","n":[58,140,100,62],"fs":14,"tn":"несвёрн.\nсубстрат"},"hsp":{"p":[215,136,110,62],"t":"Hsp70","n":[175,140,80,62],"fs":18},"fold":{"p":[468,136,150,62],"t":"свёрнутый\nбелок","n":[286,140,90,62],"fs":15},"chip":{"p":[92,250,138,58],"t":"CHIP\n(E3-лигаза)","n":[58,262,92,62],"fs":14,"tn":"CHIP\n(E3)"},"bag1":{"p":[262,250,108,58],"t":"BAG1","n":[168,262,80,62],"fs":16},"bag3":{"p":[420,250,150,58],"t":"BAG3 +\nHSPB8","n":[282,262,94,62],"fs":15},"prot":{"p":[170,360,156,54],"t":"протеасома","n":[112,392,150,54],"fs":15},"aut":{"p":[420,360,170,54],"t":"p62 →\nаутофагосома","n":[262,392,130,54],"fs":15}},"edges":{"b_sub":{"a":"sub","b":"hsp","k":"bind"},"cof_h":{"a":"cof","b":"hsp","k":"act","t":"цикл\nАТФазы","d":[18,0],"dn":[-18,0],"anc":"start","ancn":"end"},"h_fold":{"a":"hsp","b":"fold","k":"seq","t":"свёртывание","d":[0,-12],"tn":""},"b_chip":{"a":"chip","b":"hsp","k":"bind"},"chip_s":{"a":"chip","b":"sub","k":"rx","t":"+ Ub","d":[-8,0],"dn":[-6,0],"anc":"end","tn":""},"b_bag1":{"a":"bag1","b":"hsp","k":"bind"},"b_bag3":{"a":"bag3","b":"hsp","k":"bind"},"chip_p":{"a":"chip","b":"prot","k":"seq"},"bag1_p":{"a":"bag1","b":"prot","k":"seq","t":"протеасомный\nпуть","d":[34,0],"dn":[20,0],"anc":"start","tn":""},"bag3_a":{"a":"bag3","b":"aut","k":"seq","t":"CASA","d":[22,0],"dn":[18,0],"anc":"start"}},"st":{"0":{"n":{"sub":"base","hsp":"on","fold":"on","chip":"off","bag1":"off","bag3":"off","prot":"off","aut":"off"},"t":{"sub":"несвёрнутый\nсубстрат"},"e":{"chip_s":"off","b_chip":"off","b_bag1":"off","b_bag3":"off","chip_p":"off","bag1_p":"off","bag3_a":"off","h_fold":"on"},"m":[["Исход","рефолдинг"],["Сигнал для деградации","нет"]],"note":"Hsp70 связывает несвёрнутый субстрат; J-белки и факторы обмена нуклеотида регулируют цикл связывания и освобождения. Если субстрат свернулся, он покидает комплекс."},"1":{"n":{"sub":"on","hsp":"on","fold":"off","chip":"on","bag1":"off","bag3":"off","prot":"on","aut":"off"},"t":{"sub":"субстрат,\nне способный\nсвернуться"},"e":{"chip_s":"on","b_chip":"on","b_bag1":"off","b_bag3":"off","chip_p":"on","bag1_p":"off","bag3_a":"off","h_fold":"off"},"m":[["Исход","рефолдинг не завершён"],["Сигнал для деградации","убиквитин, добавленный CHIP"]],"note":"Субстрат, не способный свернуться, долго остаётся в комплексе с шаперонами. CHIP присоединяется к Hsp70 и убиквитинирует субстрат; убиквитинированный белок направляется в протеасому (Connell 2001; Hipp 2019).","tn":{"sub":"не способен\nсвернуться"}},"2":{"n":{"sub":"on","hsp":"on","fold":"off","chip":"on","bag1":"on","bag3":"off","prot":"on","aut":"off"},"t":{"sub":"субстрат,\nне способный\nсвернуться"},"e":{"chip_s":"on","b_chip":"on","b_bag1":"on","b_bag3":"off","chip_p":"on","bag1_p":"on","bag3_a":"off","h_fold":"off"},"m":[["Ко-шаперон","BAG1"],["Исход","протеасомный путь"]],"note":"BAG1 связан с направлением полиубиквитинированных белков в протеасому (Gamerdinger 2009; культивируемые клетки).","tn":{"sub":"не способен\nсвернуться"}},"3":{"n":{"sub":"on","hsp":"on","fold":"off","chip":"on","bag1":"off","bag3":"on","prot":"off","aut":"on"},"t":{"sub":"повреждённый\nбелок\nZ-диска"},"e":{"chip_s":"on","b_chip":"on","b_bag1":"off","b_bag3":"on","chip_p":"off","bag1_p":"off","bag3_a":"on","h_fold":"off"},"m":[["Ко-шаперон","BAG3 с HSPB8"],["Исход","аутофагия (CASA)"]],"note":"BAG3 вместе с Hsc70, HSPB8, CHIP и адаптером p62 образует комплекс CASA: так в мышцах удаляются повреждённые белки Z-диска, например филамин (Arndt 2010). При клеточном старении доля BAG3 растёт (Gamerdinger 2009).","tn":{"sub":"белок\nZ-диска"}}},"fs":15,"nfs":13,"lfs":14,"zfs":14,"nlfs":12,"nzfs":12}}},{"id":"route-proteasome","number":21,"section":3,"title":"Что может разрушить протеасома и что нет","question":4,"questions":[4],"keywords":["26S-протеасома","цепь K48","тетраубиквитин","канал протеасомы","p97","белки наружной мембраны","митофагия","Nrf1","протеафагия","подавление протеасомы"],"lead":["26S-протеасома разрушает убиквитинированные полипептиды, которые проходят в её узкий канал. Агрегаты, крупные комплексы и целые органеллы она не принимает, но участвует в разрушении отдельных белков органелл."],"mechanism":["[[T51|Цепь K48]] — распространённый сигнал для протеасомы; в экспериментах с модельными субстратами эффективное узнавание требовало цепи из четырёх убиквитинов, но универсального порога нет.","[[T54|p97]] — извлекает убиквитинированный белок из мембраны или комплекса и подаёт его в протеасому.","Протеасома — разворачивает субстрат и расщепляет его в канале; при её подавлении растёт синтез субъединиц через [[T57|Nrf1]]."],"paragraphs":["Убиквитинированный белок узнают убиквитиновые рецепторы протеасомы или челночные белки, одновременно связывающие убиквитин и протеасому. Перед расщеплением внутри бочонка протеасомы субстрат деубиквитинируется и разворачивается (Pohl, Dikic 2019). Распространённый сигнал — цепь убиквитина на Lys48. Для модельных субстратов in vitro минимальным сигналом эффективной доставки оказался тетраубиквитин (Thrower 2000), однако часть белков в клетках человека и дрожжей разрушается протеасомой после присоединения отдельных молекул убиквитина, не связанных в цепь (Braten 2016). Ветвящиеся цепи K11–K48 относят к самым сильным сигналам для протеасомы (Pohl, Dikic 2019).","Размер ограничивает этот путь: в узкий канал проходят одиночные развёрнутые полипептиды, а агрегаты, комплексы и органеллы удаляет аутофагия. Целая органелла в канал не помещается, но протеасома участвует в её очищении. После деполяризации митохондрий Parkin убиквитинирует белки наружной мембраны; на митохондриях растёт доля цепей K48, привлекается 26S-протеасома, и, по данным Chan 2011, разрушаются многие белки наружной мембраны, причём независимо от аутофагии. Митофузины Mfn1 и Mfn2 извлекает p97 (Chan 2011; Tanaka 2010). Обзор Narendra, Youle (2024) оценивает это иначе: большинство субстратов Parkin остаётся на мембране и удаляется вместе с органеллой, а независимо от митофагии извлекаются и разрушаются немногие, среди них MFN1/2 и RHOT1/2.","Если протеасома подавлена, Parkin-зависимая митофагия не идёт в клетках HeLa, SH-SY5Y и мыши с экспрессией Parkin (Chan 2011); сходный результат получен при подавлении p97 (Tanaka 2010). Протеасома служит и мишенью: при голодании её удаляет аутофагия ([[T58|протеафагия]]). При подавлении протеасомы клетки повышают транскрипцию её субъединиц через Nrf1 (Radhakrishnan 2010).","Схема качественная; данные получены в клетках с экспрессией Parkin и при деполяризации митохондрий, на других органеллах они не проверены."],"trap":["Органеллы удаляет аутофагия, а протеасома в этом не участвует.","Целую органеллу протеасома не принимает, но белки наружной мембраны митохондрий, помеченные Parkin, извлекает p97 и разрушает протеасома. В клетках с избытком Parkin после деполяризации подавление протеасомы или p97 блокировало Parkin-зависимую митофагию (Chan 2011; Tanaka 2010); для нейронов с эндогенным Parkin такие данные в источниках шага не приведены."],"conditions":"Схема механизма, качественные состояния. Митохондрии: клетки HeLa, SH-SY5Y и мыши, деполяризация и Parkin (Chan 2011; Tanaka 2010, полные тексты); минимальный сигнал — очищенные модельные субстраты с определённым составом цепей (Thrower 2000, реферат); деградация после моноубиквитинирования — клетки человека и дрожжей (Braten 2016, реферат); Nrf1 — фибробласты мыши (Radhakrishnan 2010, реферат); размер субстрата и протеафагия — обзор Pohl, Dikic 2019; судьба белков наружной мембраны — обзор Narendra, Youle 2024 (полный текст). Обзор и первичные работы различаются по оценке числа белков наружной мембраны, разрушаемых независимо от митофагии (Chan 2011: многие; Narendra 2024: немногие). Подавление протеасомы на схеме показано как исходное воздействие без последующей компенсации: при длительном воздействии усиливается аутофагия.","sources":["PohlDikic2019","Thrower2000","Chan2011","Tanaka2010","Radhakrishnan2010","Narendra2024","Braten2016"],"quiz":{"id":"S12-L21","rev":2,"question":"В клетках HeLa с избытком Parkin митохондрии деполяризованы, белки наружной мембраны убиквитинированы. Активность 26S-протеасомы подавлена. Что ожидается для Parkin-зависимой митофагии в этой системе?","options":[{"id":"S12-L21-1","text":"Митофагия не пойдёт, так как ей нужна протеасомная очистка наружной мембраны от помеченных белков.","correct":true,"feedback":"В клетках HeLa, SH-SY5Y и мыши с избытком Parkin подавление протеасомы блокировало Parkin-зависимую митофагию (Chan 2011). Для нейронов с эндогенным Parkin такие данные в источниках шага не приведены, поэтому переносить вывод на них нельзя."},{"id":"S12-L21-2","text":"Митофагия усилится, так как аутофагия полностью заменяет протеасому при любом нарушении.","correct":false,"feedback":"В клетках с избытком Parkin замены нет: для митофагии нужно разрушение белков наружной мембраны протеасомой (Chan 2011). Для других систем вывод требует отдельной проверки."},{"id":"S12-L21-3","text":"Митофагия не изменится, так как органеллу удаляет аутофагия независимо от протеасомы.","correct":false,"feedback":"Эксперименты с подавлением протеасомы и p97 показывают противоположное (Tanaka 2010; Chan 2011)."}]},"widget":{"kind":"net","title":"","s":{"title":"Что принимает протеасома","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Субстрат","opts":["Одиночный полипептид с цепью K48","Агрегат или крупный комплекс","Митохондрия с меткой Parkin"]},{"id":"p","type":"check","label":"Протеасома подавлена"}],"W":560,"H":400,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"регулирует, ускоряет","inh":"тормозит","tr":"перенос через мембрану","rx":"химическое превращение","bind":"связывание","seq":"путь молекулы или порядок событий","dash":"косвенная или возможная связь","nodes":["жёлтая рамка — маршрут или звено работает","пунктир из точек — возможен, вклад небольшой","серый пунктир — этот субстрат не принимает","зачёркнуто — подавлено"]},"zones":[],"mem":[],"nodes":{"sub":{"p":[84,130,146,84],"t":"одиночный\nполипептид","n":[62,120,108,84],"fs":15},"ub":{"p":[84,262,146,56],"t":"цепь K48\n(поли-Ub)","n":[66,236,120,62],"fs":14,"tn":"цепь K48\n(поли-Ub)"},"p97":{"p":[262,52,100,44],"t":"p97","n":[170,44,76,44],"fs":17},"prot":{"p":[450,130,176,90],"t":"протеасома 26S\nузкий канал","n":[268,120,130,84],"fs":15,"tn":"протеасома\n26S"},"pep":{"p":[450,262,120,46],"t":"пептиды","n":[268,236,100,46],"fs":15},"aut":{"p":[270,352,220,58],"t":"аутофагосома\n(рецепторы, ATG8)","n":[170,392,220,58],"fs":15}},"edges":{"ub_b":{"a":"ub","b":"sub","k":"bind"},"d":{"a":"sub","b":"prot","k":"seq","t":"цепь K48","d":[0,-12],"dn":[0,-12]},"x_a":{"a":"sub","b":"p97","k":"seq","t":"извлечение","d":[-10,0],"dn":[-10,0],"anc":"end","tn":""},"x_b":{"a":"p97","b":"prot","k":"seq"},"pr":{"a":"prot","b":"pep","k":"rx","t":"протеолиз","d":[12,0],"dn":[34,0],"anc":"start"},"a":{"a":"sub","b":"aut","k":"seq"}},"st":{"0-0":{"n":{"sub":"base","ub":"on","p97":"off","prot":"on","pep":"on","aut":"off"},"t":{"sub":"одиночный\nполипептид","ub":"цепь K48\n(поли-Ub)"},"e":{"d":"on","x_a":"hide","x_b":"hide","pr":"on","a":"off"},"m":[["Доступ к протеасоме","открыт"],["Исход","пептиды"]],"note":"Одиночный развёрнутый полипептид с цепью K48 проходит в канал 26S-протеасомы. Для очищенных модельных субстратов эффективная доставка требовала цепи из четырёх убиквитинов (Thrower 2000); универсального порога нет: часть белков разрушается после присоединения отдельных молекул убиквитина (Braten 2016).","tn":{"ub":"цепь K48\n(поли-Ub)"}},"0-1":{"n":{"sub":"on","ub":"on","p97":"off","prot":"abs","pep":"off","aut":"off"},"t":{"sub":"одиночный\nполипептид","ub":"цепь K48\n(поли-Ub)"},"e":{"d":"on","x_a":"hide","x_b":"hide","pr":"off","a":"off"},"m":[["Доступ к протеасоме","закрыт"],["Исход","субстрат остаётся убиквитинированным"]],"note":"При подавленной протеасоме сигнал есть, но разрушения нет: убиквитинированный субстрат не расщепляется. При длительном воздействии клетки повышают синтез субъединиц протеасомы (Radhakrishnan 2010).","tn":{"ub":"цепь K48\n(поли-Ub)"}},"1-0":{"n":{"sub":"base","ub":"on","p97":"off","prot":"off","pep":"off","aut":"on"},"t":{"sub":"агрегат или\nкрупный\nкомплекс","ub":"цепи Ub\nна поверхности"},"e":{"d":"off","x_a":"hide","x_b":"hide","pr":"off","a":"on"},"m":[["Доступ к протеасоме","закрыт: размер"],["Исход","аутофагия"]],"note":"Агрегат и крупный комплекс не проходят в узкий канал протеасомы. Убиквитинированную поверхность узнают рецепторы аутофагии (Pohl, Dikic 2019)."},"1-1":{"n":{"sub":"base","ub":"on","p97":"off","prot":"abs","pep":"off","aut":"on"},"t":{"sub":"агрегат или\nкрупный\nкомплекс","ub":"цепи Ub\nна поверхности"},"e":{"d":"off","x_a":"hide","x_b":"hide","pr":"off","a":"on"},"m":[["Доступ к протеасоме","закрыт и без подавления"],["Исход","аутофагия"]],"note":"Подавление протеасомы судьбу агрегата прямо не меняет: он и так не входит в канал. Косвенно нагрузка на аутофагию может расти (Pohl, Dikic 2019)."},"2-0":{"n":{"sub":"base","ub":"on","p97":"on","prot":"on","pep":"on","aut":"on"},"t":{"sub":"митохондрия\nс меткой Parkin","ub":"цепи Ub, в том\nчисле K48","prot":"протеасома 26S\n(белки наружной\nмембраны)"},"e":{"d":"hide","x_a":"on","x_b":"on","pr":"on","a":"on"},"m":[["Белки наружной мембраны","p97 → протеасома"],["Органелла в целом","митофагия"]],"note":"Parkin убиквитинирует белки наружной мембраны; митофузины извлекает p97 (Tanaka 2010), а на митохондриях растёт доля цепей K48 (Chan 2011). Органелла в целом в канал не проходит: её удаляет митофагия.","tn":{"sub":"митохондрия\nс меткой\nParkin"}},"2-1":{"n":{"sub":"on","ub":"on","p97":"on","prot":"abs","pep":"off","aut":"off"},"t":{"sub":"митохондрия\nс меткой Parkin","ub":"цепи Ub, в том\nчисле K48","prot":"протеасома 26S\n(белки наружной\nмембраны)"},"e":{"d":"hide","x_a":"on","x_b":"on","pr":"off","a":"off"},"m":[["Белки наружной мембраны","не разрушаются"],["Органелла в целом","митофагия не идёт"]],"note":"При подавленной протеасоме Parkin-зависимая митофагия в клетках HeLa, SH-SY5Y и мыши с экспрессией Parkin не идёт (Chan 2011); подавление p97 в клетках с Parkin давало тот же результат (Tanaka 2010).","tn":{"sub":"митохондрия\nс меткой\nParkin"}}},"fs":15,"nfs":13,"lfs":14,"zfs":14,"nlfs":12,"nzfs":12}}},{"id":"route-er","number":22,"section":3,"title":"Маршруты из ЭПР: ERAD и ER-фагия","question":4,"questions":[4],"keywords":["ERAD","SEL1L–HRD1","p97","ER-фагия","FAM134B","калнексин","ERLAD","α1-антитрипсин Z","проколлаген","ERAD-устойчивый агрегат"],"lead":["Белок, неправильно свёрнутый в просвете ЭПР, отделён мембраной от цитозольных протеасом. Растворимые субстраты выводит ERAD, а ERAD-устойчивые агрегаты удаляются в лизосому."],"mechanism":["Комплекс HRD1–SEL1L — убиквитинирует несвёрнутый растворимый белок и выводит его из ЭПР в цитозоль.","[[T54|p97]] — вытягивает убиквитинированный белок и подаёт его в протеасому.","Калнексин с FAM134B — связывает [[T55|ERAD-устойчивый агрегат]] и направляет его в лизосому ([[T56|ER-фагия и ERLAD]])."],"paragraphs":["Белки секреторного пути сворачиваются в просвете ЭПР. Для контроля качества служит ERAD: убиквитин- и протеасомзависимый процесс, в котором встроенные в мембрану убиквитинлигазы передают неправильно свёрнутые белки на протеасому. Мутантный α1-антитрипсин передаётся комплексу HRD1–SEL1L, и без этого комплекса он не разрушается (Christianson 2008). Подавление p97 приводит к удержанию субстратов ERAD (Anderson 2015).","Агрегация препятствует выведению в цитозоль (дислокации), поэтому такой агрегат ERAD не принимает (Fregno 2018). Полимеры α1-антитрипсина Z (ATZ) и неправильно свёрнутый проколлаген остаются в просвете ЭПР и удаляются лизосомными путями. Рецептор FAM134B вместе с калнексином обеспечивает оборот таких ERAD-устойчивых белков (Forrester 2019; Fregno 2018). Для ATZ описан перенос в одномембранных везикулах, слияние которых с эндолизосомами зависит от STX17 и VAMP8 (ERLAD); в отличие от классической ER-фагии, ЭПР при этом не захватывается аутофагосомой. Авторы связывают это с отсутствием эффекта фармакологического усиления макроаутофагии при некоторых агрегопатиях просвета ЭПР.","Один субстрат может использовать оба пути. Мутантный NPC1 (I1061T) накапливается в ЭПР и разрушается двумя независимыми путями: нокдаун BECN1 или FAM134B вызывает накопление мутантного, но не нормального белка (Mochida 2022).","Отсюда не следует, что ER-фагия включается при сильном стрессе ЭПР: в источниках маршрут связан со свойствами субстрата, а не с тяжестью стресса."],"trap":["ER-фагия включается, когда стресс ЭПР становится сильным, и принимает на себя часть белков ERAD.","Маршрут связан со свойствами субстрата: растворимые белки выводит ERAD, а ERAD-устойчивые агрегаты, например полимеры ATZ и проколлаген, распознаёт комплекс FAM134B с калнексином. Стресс ЭПР может усиливать ER-фагию, но для агрегата, который нельзя вывести в цитозоль, маршрут определяет невозможность ERAD; роль тяжести стресса как переключателя между ERAD и ER-фагией источники не показывают (Fregno 2018; Forrester 2019; Mochida 2022)."],"conditions":"Схема механизма, качественные состояния; культивируемые клетки млекопитающих. Комплекс HRD1–SEL1L и мутантный α1-антитрипсин — Christianson 2008 (реферат); p97 — Anderson 2015 (реферат, опухолевые клетки); ATZ — Fregno 2018 (реферат); проколлаген — Forrester 2019 (реферат); NPC1 I1061T — обзор Mochida 2022 (полный текст). ERLAD и ER-фагия на схеме объединены в один лизосомный маршрут; в источниках у них разные способы доставки. Вклад каждого пути на схеме не показан.","sources":["Christianson2008","Anderson2015","Fregno2018","Forrester2019","Mochida2022"],"quiz":{"id":"S12-L22","rev":1,"question":"Полимеры ATZ находятся в просвете ЭПР, а активность ERAD подавлена. Как изменится маршрут удаления этого агрегата?","options":[{"id":"S12-L22-1","text":"Агрегат перейдёт в ERAD, так как этот путь принимает любые агрегаты ЭПР.","correct":false,"feedback":"Агрегация препятствует выведению в цитозоль, поэтому ERAD такие агрегаты не принимает (Fregno 2018)."},{"id":"S12-L22-2","text":"Агрегат не удалится, так как ER-фагия включается только при сильном стрессе ЭПР.","correct":false,"feedback":"Маршрут связан со свойствами субстрата, а не с тяжестью стресса; подавление ERAD лизосомный путь для агрегата не включает и не выключает."},{"id":"S12-L22-3","text":"Маршрут не изменится: агрегат и так удаляется в лизосому с участием калнексина и FAM134B.","correct":true,"feedback":"Полимеры ATZ устойчивы к протеасоме и в цитозоль не выводятся; их удаляет лизосомный путь ERLAD с участием калнексина и FAM134B (Fregno 2018), поэтому подавление ERAD его не меняет."}]},"widget":{"kind":"net","title":"","s":{"title":"Два пути из ЭПР: ERAD и лизосома","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Субстрат в ЭПР","opts":["Растворимый белок","Агрегат (ATZ, проколлаген)","Мутантный NPC1"]},{"id":"e","type":"check","label":"ERAD подавлен"}],"W":560,"H":400,"NW":340,"NH":480,"lg":{"title":"Обозначения на схеме","act":"регулирует, ускоряет","inh":"тормозит","tr":"перенос через мембрану","rx":"химическое превращение","bind":" ["Маршрут","ERAD → протеасома"],["Лизосомный путь","не используется"]],"note":"Несвёрнутый растворимый белок сначала может свернуться с участием BiP. Если свёртывание не удаётся, комплекс HRD1–SEL1L выводит его в цитозоль, p97 вытягивает, протеасома разрушает (Christianson 2008; Anderson 2015)."},"0-1":{"n":{"sub":"on","bip":"on","cnx":"off","hrd":"abs","fam":"off","p97":"off","prot":"off","lys":"off"},"t":{"sub":"растворимый\nбелок"},"e":{"s_bip":"on","s_cnx":"hide","c_fam":"hide","s_hrd":"off","h_p97":"off","p97_p":"off","s_fam":"hide","f_lys":"hide"},"m":[["Маршрут","ERAD закрыт"],["Судьба белка","остаётся в просвете ЭПР"]],"note":"Когда ERAD подавлен, растворимый белок не выводится в цитозоль и остаётся в просвете ЭПР. Подавление p97 приводит к удержанию субстратов ERAD (Anderson 2015)."},"1-0":{"n":{"sub":"base","bip":"low","cnx":"on","hrd":"off","fam":"on","p97":"off","prot":"off","lys":"on"},"t":{"sub":"агрегат\nATZ или\nпроколлаген"},"e":{"s_bip":"on","s_cnx":"on","c_fam":"on","s_hrd":"off","h_p97":"off","p97_p":"off","s_fam":"hide","f_lys":"on"},"m":[["Маршрут","калнексин + FAM134B → лизосома"],["ERAD","не принимает агрегат"]],"note":"Агрегация препятствует выведению в цитозоль (Fregno 2018). Агрегат связывает калнексин вместе с FAM134B, и груз доставляется в лизосому (Fregno 2018; Forrester 2019)."},"1-1":{"n":{"sub":"base","bip":"low","cnx":"on","hrd":"abs","fam":"on","p97":"off","prot":"off","lys":"on"},"t":{"sub":"агрегат\nATZ или\nпроколлаген"},"e":{"s_bip":"on","s_cnx":"on","c_fam":"on","s_hrd":"off","h_p97":"off","p97_p":"off","s_fam":"hide","f_lys":"on"},"m":[["Маршрут","калнексин + FAM134B → лизосома"],["Подавление ERAD","судьбу агрегата не меняет"]],"note":"Подавление ERAD судьбу агрегата не меняет: агрегат и раньше не использовал этот путь."},"2-0":{"n":{"sub":"base","bip":"on","cnx":"off","hrd":"on","fam":"on","p97":"on","prot":"on","lys":"on"},"t":{"sub":"мутантный\nNPC1 (I1061T)"},"e":{"s_bip":"on","s_cnx":"hide","c_fam":"hide","s_hrd":"on","h_p97":"on","p97_p":"on","s_fam":"on","f_lys":"on"},"m":[["Маршруты","ERAD и аутофагия"],["Пути","независимы"]],"note":"Мутантный NPC1 накапливается в ЭПР и разрушается двумя независимыми путями — ERAD и аутофагией; нокдаун BECN1 или FAM134B вызывает накопление мутантного, но не нормального белка (Mochida 2022)."},"2-1":{"n":{"sub":"on","bip":"on","cnx":"off","hrd":"abs","fam":"on","p97":"off","prot":"off","lys":"on"},"t":{"sub":"мутантный\nNPC1 (I1061T)"},"e":{"s_bip":"on","s_cnx":"hide","c_fam":"hide","s_hrd":"off","h_p97":"off","p97_p":"off","s_fam":"on","f_lys":"on"},"m":[["Маршруты","остаётся путь через FAM134B"],["Доля пути","на схеме не показана"]],"note":"Пути независимы, поэтому при подавлении ERAD сохраняется путь через FAM134B. Какую долю белка он удаляет, в обзоре не указано."}},"fs":15,"nfs":13,"lfs":14,"zfs":15,"nlfs":12,"nzfs":13}}},{"id":"route-switch","number":23,"section":3,"title":"Как p62 и убиквитин переключают маршрут","question":4,"questions":[4],"keywords":["p62","SQSTM1","димер","олигомер","K48","K63","убиквитиновый стресс","N-дегрон","ZZ-домен","авидность"],"lead":["Один и тот же белок p62 может вести субстрат и к протеасоме, и к аутофагии. Направление зависит от олигомерного состояния p62, а оно — от типа цепей убиквитина, концентрации свободного убиквитина и N-дегрона на субстрате."],"mechanism":["[[T52|Димер p62]] — узнаёт доменом UBA одиночные молекулы с цепью K48 и через PB1 подаёт их на протеасому.","[[T52|Олигомер p62]] — образуется на цепях K63, при избытке свободного убиквитина ([[T53|убиквитиновый стресс]]) или на N-дегроне и ведёт груз в аутофагию через LIR.","Предпочтение цепей K48 и K63 не абсолютно: результат определяют авидность и концентрации, а не одна метка."],"paragraphs":["p62 связывает убиквитинированные субстраты доменом UBA, протеасому — доменом PB1, а мембраны аутофагии — мотивом LIR. Поэтому p62 служит и челноком к протеасоме, и рецептором аутофагии (Pohl, Dikic 2019).","Направление зависит от состояния p62: конкуренцию протеасомного и лизосомного путей определяет авидность комплекса, а не сродство отдельного рецептора к убиквитину. Димер узнаёт одиночные молекулы с цепями K48 и подаёт их на протеасому. Цепи K63 вызывают олигомеризацию p62 по домену PB1 и фазовое разделение; образуются тельца p62, которые привлекают мембраны аутофагии. Фазовое разделение p62 с полиубиквитином показано in vitro (Sun 2018). В реконструированной системе скопления p62 формируются на субстратах, имеющих не менее двух цепей длиннее трёх убиквитинов (Zaffagnini 2018).","Олигомеризацию вызывают и другие воздействия. При высокой концентрации свободного убиквитина, например после теплового шока или при длительном подавлении протеасомы, убиквитинируется сам p62, димеризация нарушается, и груз направляется в аутофагию (Pohl, Dikic 2019). В реконструированной системе свободный убиквитин, напротив, подавлял образование скоплений p62 с субстратом (Zaffagnini 2018): направление эффекта зависит от условий. N-дегрон, например аргинилированный BiP, связывается с доменом ZZ (Cha-Molstad 2015) и вызывает олигомеры p62, связанные дисульфидными мостиками (Pohl, Dikic 2019).","Данные получены в основном при сверхэкспрессии и in vitro; неясно, определяет ли судьбу субстрата тип цепи, его количество или другие сигналы (Adriaenssens 2022)."],"trap":["Цепь K48 всегда ведёт к протеасоме, а цепь K63 — к аутофагии.","Это предпочтения, а не правила: они показаны в основном при сверхэкспрессии и in vitro и не абсолютны (Adriaenssens 2022). Направление зависит и от состояния p62 (димер или олигомер), и от концентрации свободного убиквитина, и от N-дегрона (Pohl, Dikic 2019)."],"conditions":"Схема механизма, качественные состояния. Фазовое разделение p62 с полиубиквитином — in vitro (Sun 2018, реферат); образование скоплений p62 на субстратах — реконструкция in vitro (Zaffagnini 2018, реферат); аргинилированный BiP и ZZ-домен — культивируемые клетки (Cha-Molstad 2015, реферат); убиквитиновый стресс и дисульфидные олигомеры — обзор Pohl, Dikic 2019. Влияние свободного убиквитина в обзоре (повышение олигомеризации) и в реконструкции in vitro (подавление образования скоплений) описано по-разному; на схеме показано положение обзора. Длительное подавление протеасомы на схеме приводит к аутофагии сразу; в клетках этот переход развивается при длительном воздействии.","sources":["PohlDikic2019","Sun2018","Zaffagnini2018","Cha-Molstad2015","Adriaenssens2022"],"quiz":{"id":"S12-L23","rev":1,"question":"Субстрат с цепями K48 доставляет к протеасоме димер p62. Концентрация свободного убиквитина в клетке длительно повышена (убиквитиновый стресс). Какое изменение ожидается для p62?","options":[{"id":"S12-L23-1","text":"Димеров p62 станет больше, и весь груз будет направляться только к протеасоме.","correct":false,"feedback":"При избытке свободного убиквитина димеризация нарушается, а не усиливается (Pohl, Dikic 2019)."},{"id":"S12-L23-2","text":"Димеризация нарушится, олигомеров p62 станет больше, и груз чаще пойдёт в аутофагию.","correct":true,"feedback":"Убиквитинирование p62 при высокой концентрации свободного убиквитина блокирует димеризацию по UBA и способствует олигомеризации (Pohl, Dikic 2019)."},{"id":"S12-L23-3","text":"Состояние p62 не изменится, так как оно задаётся только числом звеньев в цепи.","correct":false,"feedback":"Число звеньев важно, но состояние p62 меняют и концентрация свободного убиквитина, и N-дегрон."}]},"widget":{"kind":"net","title":"","s":{"title":"Состояние p62 задаёт маршрут","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Метка или условие","opts":["Цепь K48 на одиночной молекуле","Цепи K63 на скоплении","Много свободного убиквитина","N-дегрон на субстрате"]},{"id":"p","type":"check","label":"Длительное подавление протеасомы"}],"W":560,"H":380,"NW":340,"NH":400,"lg":{"title":"Обозначения на схеме","act":"регулирует, ускоряет","inh":"тормозит","tr":"перенос через мембрану","rx":"химическое превращение","bind":"связывание","s
