<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 1 · Компартменты, локальные условия и обмен — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

цию свободного Ca²⁺ в просвете на уровне сотен микромолей при концентрации около 100 нМ в цитозоле покоящейся клетки. Тапсигаргин необратимо ингибирует SERCA: Ca²⁺ продолжает выходить из ЭПР через пути утечки, и за минуты депо опустошается.", "gn_ip3r": "Рецептор IP₃ (IP₃R)", "g_ip3r": "Ca²⁺-канал мембраны ЭПР, который открывается при связывании инозитол-1,4,5-трисфосфата (IP₃) и Ca²⁺. Через открытый канал Ca²⁺ выходит из просвета ЭПР в цитозоль по электрохимическому градиенту — канал расходует различие, созданное SERCA. Часть рецепторов IP₃ сосредоточена в зонах контакта ЭПР с митохондриями, где при их открытии создаётся микродомен с концентрацией Ca²⁺ около 10 мкМ и выше (в клетках RBL-2H3 — в среднем около 9 мкМ, в части клеток до 25 мкМ; Csordás 2010).", "gn_mcu": "MCU (митохондриальный кальциевый унипортер)", "g_mcu": "Высокоселективный Ca²⁺-канал внутренней мембраны митохондрии (Kirichok 2004). Ca²⁺ входит через него в матрикс по электрохимическому градиенту: матрикс заряжен отрицательно (Δψ около −150…−180 мВ), и электрическая составляющая перевешивает разность концентраций. Работу совершает не MCU, а дыхательная цепь, создавшая Δψ. Регуляторы MICU1 и MICU2 закрывают канал при низкой концентрации Ca²⁺ в цитозоле и кооперативно открывают его при концентрации Ca²⁺ выше примерно 1 мкМ, поэтому захват Ca²⁺ выглядит пороговым.", "gn_pi4p": "PI4P (фосфатидилинозитол-4-фосфат)", "g_pi4p": "Фосфоинозитид, характерный для мембран аппарата Гольджи; заметное его количество есть в плазматической мембране, а также в поздних эндосомах и лизосомах (Hammond 2014). Образуется из фосфатидилинозитола PI-4-киназами с затратой ATP (на Гольджи — PI4KIIIβ) и служит предшественником PI(4,5)P₂. В ЭПР содержание PI4P низкое, потому что там его гидролизует фосфатаза SAC1. Перепад PI4P между Гольджи и ЭПР используют белки OSBP, ORP5 и ORP8: они переносят PI4P в ЭПР в обмен на другой липид.", "gn_sac1": "SAC1", "g_sac1": "Липидфосфатаза мембраны ЭПР (и ранних частей аппарата Гольджи), от s_lys": "измеряют адресованным pH-сенсором", "s1b_r_x_er": "Свободный Ca²⁺ в просвете ЭПР", "s1b_r_x_s_er": "не общий кальций: связанный белками просвета не учитывается", "s1b_r_x_mito": "Мембранный потенциал Δψ", "s1b_r_x_s_mito": "матрикс относительно цитозоля", "s1b_r_rem": "Сохранившаяся доля различия с цитозолем (от различия при работающем насосе)", "s1b_r_hyd": "Активность кислых гидролаз (% от максимальной)", "s1b_r_dmu": "Δμ для выхода Ca²⁺ из ЭПР в цитозоль", "s1b_r_dmu_s": "чем ближе к нулю, тем слабее движущая сила выхода Ca²⁺", "s1b_r_imp": "Импорт белков с MTS через TIM23 (% от контроля)", "s1b_r_mem": "Мембрана", "s1b_mem_pill": "цела", "s1b_r_note": "Учебная модель, условные величины. Характерные времена взяты из опытов: pH лизосомы — Steinberg 2010 (макрофаги мыши, конканамицин A) и Yoshimori 1991 (клетки A431, бафиломицин A1); Ca²⁺ ЭПР — Pick 2023 (клетки HEK293, сенсор D1ER, тапсигаргин: за первые 1,5 мин просвет теряет лишь около 6 % Ca²⁺, затем опустошается с характерным временем 162 с); для Δψ — учебное значение порядка секунд. Плато pH 6,5 — допущение модели: выше 6,5 сенсор Steinberg 2010 значений не различает, поэтому полное выравнивание с цитозолем модель не показывает. Активность гидролаз и импорт белков — учебные зависимости от pH и Δψ.", "s1b_c_lys_on": "V-АТФаза за счёт гидролиза ATP закачивает протоны в просвет лизосомы. pH 4,7 удерживается как стационар: перенос протонов насосом уравновешивает их утечку в цитозоль.", "s1b_c_lys_on_z": "Кислые гидролазы работают близко к оптимуму только в кислом просвете.", "s1b_c_lys_start": "Бафиломицин A1 ингибировал V-АТФазу; время после остановки насоса — {t}. Протоны выходят из просвета через пути утечки, но различие ещё почти полностью сохранено: {x}, {r} % исходного различия с цитозолем.", "s1b_c_lys_start_z": "Остановка насоса меняет условия не сразу: различие убывает со скоростью утечки.", "s1b_c_lys_half": "Через {t} после остановки V-АТФазы {x}: сохранилось {r} % исходного различия с цитозолем, активность кислых гидролаз — {h} % от максимальной. Мембрана лизосомы цела.", "s1b_c_lys_half_z": "Кислая среда лизосомы неравновесна: без работы насоса кислотность просвета теряется, хотя граница сохраняется.", "s1b_c_lys_most": "Через {t} без работы V-АТФазы {x}: сохранилось {r} % различия, активность кислых гидролаз — {h} % от максимальной. Мембрана цела; в опытах с бафиломицином A1 белок, доставленный в лизосомы, не расщеплялся.", "s1b_c_lys_most_z": "Мембрана удерживает различие, но не создаёт его: создаёт его работа насоса.", "s1b_c_er_on": "SERCA за счёт гидролиза ATP переносит Ca²⁺ из цитозоля в просвет ЭПР: свободный Ca²⁺ в просвете — около 370 мкМ, в цитозоле — 0,1 мкМ. Перенос насосом уравновешивает утечку Ca²⁺.", "s1b_c_er_on_z": "Запас Ca²⁺ в просвете — источник сигнала: открытые каналы ЭПР выпускают его в цитозоль по градиенту.", "s1b_c_er_start": "Тапсигаргин необратимо ингибировал SERCA; время после остановки насоса — {t}. Ca²⁺ выходит из просвета через пути утечки, в первые 1,5 мин медленно: свободный Ca²⁺ — {v}, сохранилось {r} % исходного различия.", "s1b_c_er_start_z": "Пока запас Ca²⁺ в просвете велик, открытие каналов ЭПР может вызвать выход Ca²⁺ в цитозоль.", "s1b_c_er_half": "Через {t} после ингибирования SERCA свободный Ca²⁺ в просвете ЭПР снизился до {v} ({r} % исходного различия); Δμ для выхода Ca²⁺ в цитозоль — {m} кДж/моль.", "s1b_c_er_half_z": "Просвет ЭПР опустошается за минуты: различие поддерживается только непрерывной работой SERCA.", "s1b_c_er_most": "Через {t} без работы SERCA свободный Ca²⁺ в просвете ЭПР — {v}, сохранилось {r} % исходного различия. Мембрана ЭПР цела, но запас свободного Ca²⁺ для сигнала в основном исчерпан: Δμ для выхода Ca²⁺ в цитозоль — {m} кДж/моль против −21,2 при работающем насосе.", "s1b_c_er_most_z": "Опустошение ЭПР запускает депо-зависимый вход Ca²⁺ из внеклеточной среды через плазматическую мембрану.", "s1b_c_mito_on": "Дыхательная цепь переносит протоны из матрикса в межмембранное пространство. Δψ около −150 мВ удерживается как стационар: вывод протонов уравновешивает их возврат в матрикс.", "s1b_c_mito_on_z": "Δψ движет синтез ATP, импорт белков через TIM23 и вход Ca²⁺ в матрикс.", "s1b_c_mito_start": "Антимицин A и олигомицин остановили дыхательную цепь и ATP-синтазу; время после остановки — {t}. Δψ = {v}: сохранилось {r} % исходного потенциала.", "s1b_c_mito_start_z": "Олигомицин нужен, чтобы ATP-синтаза не поддерживала Δψ гидролизом ATP.", "s1b_c_mito_half": "Через {t} после остановки Δψ снизился до {v} ({r} % исходного); импорт белков с MTS через TIM23 — {i} % от контроля.", "s1b_c_mito_half_z": "Из трёх различий в модели Δψ рассеивается быстрее всего — за секунды и десятки секунд.", "s1b_c_mito_most": "Через {t} без дыхания и без ATP-синтазы Δψ = {v}: сохранилось {r} % исходного потенциала, импорт белков с MTS через TIM23 — {i} % от контроля. Внутренняя мембрана цела.", "s1b_c_mito_most_z": "Белковый состав матрикса зависит от энергетического состояния: без Δψ новые белки с MTS не поступают.", "s1b_take": "Различия pH, Ca²⁺ и Δψ между компартментом и цитозолем неравновесны: их создаёт работа насосов (V-АТФаза, SERCA, дыхательная цепь), а мембрана лишь замедляет обратный перенос. После остановки насоса различие убывает, хотя мембрана цела, и характерные времена различаются на порядки: в модели Δψ рассеивается за секунды и десятки секунд, Ca²⁺ ЭПР — за минуты, pH лизосомы — за десятки минут.", "gn_resp": "Дыхательная цепь", "g_resp": "Комплексы I–IV внутренней мембраны митохондрии. Перенос электронов от NADH и сукцината к кислороду сопряжён с переносом протонов из матрикса в межмембранное пространство; так создаются Δψ (матрикс заряжен отрицательно) и разность pH. Скорость дыхания зависит от того, как быстро протоны возвращаются в матрикс: через ATP-синтазу, путями утечки или через протонофор. Антимицин A ингибирует комплекс III.", "gn_atps": "ATP-синтаза", "g_atps": "Комплекс внутренней мембраны митохондрии. Протоны, возвращаясь в матрикс через Fo-часть по электрохимическому градиенту, приводят в действие синтез ATP из ADP и фосфата в F1-части. Реакция обратима: при сниженном Δψ и при наличии ATP (например, из гликолиза) фермент гидролизует ATP и выводит протоны из матрикса, поддерживая Δψ. Гликолитический ATP поступает в матрикс через транслокатор адениннуклеотидов; гидролиз ограничивает белок-ингибитор IF1. Олигомицин ингибирует Fo-часть и блокирует оба направления работы.", "gn_tim23": "TIM23 (транслоказа внутренней мембраны)", "g_tim23": "Транслоказа внутренней мембраны митохондрии; вместе с транслоказой наружной мембраны TOM переносит в матрикс белки с N-концевой адресующей последовательностью (MTS), которая после импорта отщепляется. MTS заряжена положительно, и её перенос через внутреннюю мембрану требует именно Δψ, а не всей протон-движущей силы (Martin 1991, изолированные митохондрии Neurospora crassa). В модели зависимость импорта от Δψ — учебная.", "gn_baf": "Бафиломицин A1", "g_baf": "Ингибитор V-АТФазы; F-АТФазу митохондрий в тех же концентрациях не ингибирует. Мембрану лизосомы не разрушает. В клетках A431 (1 мкМ) pH просвета лизосом рос с 5,1–5,5 примерно до 6,3 постепенно, примерно за 50 мин; меченый EGF при этом доставлялся в лизосомы, но не расщеплялся (Yoshimori 1991). Исследовательский инструмент для проверки роли закисления. В модели время подъёма pH согласовано и с опытами Steinberg 2010 с другим ингибитором V-АТФазы — конканамицином A.", "gn_tg": "Тапсигаргин", "g_tg": "Необратимый ингибитор SERCA. Каналы ЭПР не открывает и мембрану не разрушает: Ca²⁺ выходит из просвета путями утечки; в покое утечку уравновешивает работа SERCA. В клетках HEK293 в среде без Ca²⁺ (1 мкМ тапсигаргина) свободный Ca²⁺ в просвете ЭПР, исходно около 370 мкМ, за первые 1,5 мин снижался лишь на 6 %, а затем убывал с характерным временем около 160 с (сенсор D1ER; Pick 2023). Опустошение депо запускает депо-зависимый вход Ca²⁺ через плазматическую мембрану.", "gn_antiol": "Антимицин A вместе с олигомицином", "g_antiol": "Сочетание, которое останавливает оба генератора Δψ: антимицин A ингибирует комплекс III дыхательной цепи, а олигомицин — ATP-синтазу, которая без него могла бы поддерживать Δψ гидролизом ATP. Протоны продолжают возвращаться в матрикс путями утечки, и Δψ падает, хотя внутренняя мембрана цела. Характерное время падения в модели (20 с) — учебное значение.", "gn_glyc": "Гликолиз", "g_glyc": "Расщепление глюкозы до пирувата в цитозоле с образованием ATP без участия митохондрий. Когда дыхательная цепь остановлена, гликолиз остаётся источником ATP; этот ATP может гидролизоваться ATP-синтазой, работающей в обратном направлении. Поэтому в опытах с ингибиторами дыхания указывают, есть ли в среде глюкоза.", "gn_oligo": "Олигомицин", "g_oligo": "Ингибитор Fo-части ATP-синтазы: блокирует и синтез, и гидролиз ATP; дыхательную цепь не ингибирует. В клетках с работающим дыханием слегка повышает Δψ и снижает потребление O₂ до уровня, который определяет утечка протонов. Если же после олигомицина Δψ падает, митохондрии поддерживали потенциал гидролизом гликолитического ATP (проба с олигомицином; Brand и Nicholls 2011).", "gn_anti": "Антимицин A", "g_anti": "Ингибитор комплекса III дыхательной цепи. Останавливает перенос электронов к кислороду; потребление O₂ клетками снижается до немитохондриального уровня — у большинства клеток около 10 % (Brand и Nicholls 2011). ATP-синтазу не ингибирует, поэтому при глюкозе в среде Δψ может сохраняться за счёт гидролиза ATP.", "gn_fccp": "FCCP (протонофор)", "g_fccp": "Протонофор (разобщитель): переносит протоны через внутреннюю мембрану в обход ATP-синтазы. Снижает Δψ и протонный градиент, которые в покое ограничивают скорость дыхания, поэтому потребление O₂ растёт до максимального. Синтез ATP в митохондриях прекращается; при глюкозе в среде ATP-синтаза гидролизует гликолитический ATP, но выведенные ею протоны протонофор сразу возвращает. Дыхательную цепь не ингибирует. В опытах с TMRM служит контролем: после FCCP накопление зонда в матриксе исчезает.", "gn_tmrm": "TMRM", "g_tmrm": "Катионный флуоресцентный зонд, который накапливается в матриксе тем сильнее, чем отрицательнее матрикс (распределение по уравнению Нернста). Отвечает и на потенциал плазматической мембраны. При загрузке в низких наномолярных концентрациях уравновешивается между средой и клеткой примерно за 60 мин, а между цитозолем и матриксом — намного быстрее, поэтому изменения Δψ видны за секунды и минуты (Brand и Nicholls 2011). TMRM показывает состояние — Δψ, — а не поток: о работе дыхательной цепи по нему одному судить нельзя.", "p1b_1_q": "Лизосомы клеток в культуре: V-АТФаза работает, pH просвета 4,7. В среду добавили бафиломицин A1. Каким будет pH просвета лизосомы через 10 мин?", "p1b_1_o1": "Около 5,8 — между исходным и цитозольным", "p1b_1_o2": "Около 4,7 — как до добавления ингибитора", "p1b_1_o3": "Около 7,2 — как в цитозоле", "p1b_1_e": "Бафиломицин A1 ингибирует V-АТФазу: закачивание протонов прекращается, а утечка протонов из просвета продолжается. Поэтому pH растёт постепенно и через 10 мин в модели равен 5,8 (54 % исходного различия). Начальная скорость подщелачивания в модели — 0,18 единицы pH в минуту; у альвеолярных макрофагов мыши при ингибировании V-АТФазы конканамицином A — 0,20 (Steinberg 2010).", "p1b_1_w2": "pH остался бы прежним, если бы мембрана удерживала протоны сама, без работы насоса. Утечка протонов из просвета идёт постоянно, и без V-АТФазы её ничто не компенсирует.", "p1b_1_w3": "Различие убывает со скоростью утечки, а не исчезает мгновенно: за 10 мин pH проходит лишь часть пути к цитозольному значению. В клетках A431 pH просвета поднимался постепенно и примерно через 50 мин был около 6,3 (Yoshimori 1991).", "p1b_2_q": "Клетки HEK293 в среде без Ca²⁺: свободный Ca²⁺ в просвете ЭПР около 370 мкМ. Добавили тапсигаргин. Какой будет концентрация свободного Ca²⁺ в просвете ЭПР через 10 мин?", "p1b_2_o1": "Останется около 370 мкМ", "p1b_2_o2": "Снизится в десятки раз", "p1b_2_o3": "Вырастет выше 370 мкМ", "p1b_2_e": "Тапсигаргин необратимо ингибирует SERCA, а выход Ca²⁺ через пути утечки продолжается. В опытах на HEK293 с адресованным в просвет ЭПР сенсором D1ER за первые 1,5 мин просвет терял лишь около 6 % Ca²⁺, затем опустошался с характерным временем 162 с (Pick 2023). По модели через 10 мин остаётся 15 мкМ свободного Ca²⁺ — в 25 раз меньше исходного.", "p1b_2_w1": "Мембрана ЭПР проницаема для Ca²⁺: через пути утечки ион постоянно выходит в цитозоль. В покое этот выход компенсирует SERCA, а после её ингибирования компенсации нет.", "p1b_2_w3": "Рост концентрации свободного Ca²⁺ в просвете требует переноса против градиента, а Ca²⁺ в ЭПР закачивает прежде всего SERCA — именно её ингибирует тапсигаргин.", "p1b_3_q": "В трёх опытах остановили насосы: в лизосоме (бафиломицин A1), в ЭПР (тапсигаргин), в митохондрии (антимицин A с олигомицином). Различия с цитозолем измеряют в ед. pH, мкМ и мВ. Какое из них уменьшится вдвое позже остальных?", "p1b_3_o1": "Δψ на мембране митохондрии", "p1b_3_o2": "Свободный Ca²⁺ в просвете ЭПР", "p1b_3_o3": "pH в просвете лизосомы", "p1b_3_e": "В модели различие уменьшается вдвое: Δψ — за 15 с, свободный Ca²⁺ ЭПР — за 3,2 мин, pH лизосомы — за 12 мин. pH меняется медленно, в частности потому, что буферная ёмкость просвета лизосомы велика: 60–80 мМ на единицу pH (Steinberg 2010, макрофаги мыши).", "p1b_3_w1": "Δψ создаётся разделением небольшого числа зарядов на мембране, поэтому утечка протонов снимает его за секунды и десятки секунд — быстрее, чем меняются оба других различия.", "p1b_3_w2": "Свободный Ca²⁺ выходит из ЭПР быстрее: после короткой начальной фазы он убывает с характерным временем около 2,7 мин (Pick 2023), а pH лизосомы меняется за десятки минут.", "p1b_4_q": "Клетки обработали бафиломицином A1 в течение 1 ч, и pH просвета лизосом вырос до 6,5. Что произошло с мембраной лизосом?", "p1b_4_o1": "Сохранилась: pH подняла утечка протонов", "p1b_4_o2": "Разрушена: содержимое вышло в цитозоль", "p1b_4_o3": "Стала свободно проницаемой для белков", "p1b_4_e": "Бафиломицин A1 ингибирует V-АТФазу, а не разрушает мембрану. Различие pH в основном исчезает потому, что протоны продолжают выходить через пути утечки, а насос их больше не возвращает. В опытах Yoshimori 1991 меченый EGF при бафиломицине A1 доставлялся в лизосомы и оставался в них нерасщеплённым: органелла сохранялась, а кислотность — нет.", "p1b_4_w2": "Для роста pH разрушать мембрану не нужно: достаточно прекратить закачивание протонов. Если бы мембрана была разрушена, гидролазы оказались бы в цитозоле, а не остались в просвете лизосомы.", "p1b_4_w3": "Ингибитор действует на V-АТФазу, а не на проницаемость мембраны для белков. Протоны выходят через пути утечки, которые работают и при действующем насосе.", "p1b_5_q": "Через 30 мин после добавления бафиломицина A1 оценивают активность кислых гидролаз в просвете лизосомы. Как она изменится по сравнению с исходной (89 % от максимальной)?", "p1b_5_o1": "Не изменится: ферменты остаются в лизосоме", "p1b_5_o2": "Вырастет: среда стала ближе к нейтральной", "p1b_5_o3": "Снизится в несколько раз из-за сдвига pH", "p1b_5_e": "Количество ферментов в лизосоме не меняется, но их активность зависит от pH. Через 30 мин pH в модели равен 6,4, и активность кислых гидролаз снижается с 89 до 13 % от максимальной (учебная зависимость от pH). В опытах Yoshimori 1991 при бафиломицине A1 доставленный в лизосомы белок не расщеплялся.", "p1b_5_w1": "Ферменты действительно остаются в лизосоме, но их активность определяется pH среды. При pH 6,4 кислые гидролазы работают далеко от оптимума.", "p1b_5_w2": "Оптимум кислых гидролаз лежит в кислой области, поэтому сдвиг pH к нейтральному снижает их активность, а не повышает.", "p1b_6_q": "В клетках ингибировали дыхательную цепь антимицином A и ATP-синтазу олигомицином. Как через 1 мин изменится импорт белков с N-концевой адресующей последовательностью (MTS) в матрикс?", "p1b_6_o1": "Не изменится: транслоказы TOM и TIM23 целы", "p1b_6_o2": "Почти прекратится вслед за падением Δψ", "p1b_6_o3": "Снизится примерно вдвое, но продолжится", "p1b_6_e": "Перенос положительно заряженной MTS через внутреннюю мембрану транслоказой TIM23 требует Δψ (Martin 1991; Wiedemann и Pfanner 2017). Без дыхания и без обратной работы ATP-синтазы Δψ через 1 мин в модели снижается до −12 мВ, и импорт падает почти до нуля, хотя мембрана и транслоказы целы.", "p1b_6_w1": "Транслоказы целы, но перенос MTS через TIM23 идёт за счёт Δψ. Без мембранного потенциала целая транслоказа не переносит предшественник в матрикс.", "p1b_6_w3": "Частичное снижение импорта соответствовало бы частичному снижению Δψ. Здесь Δψ за минуту падает почти до нуля, а в модели импорт круто зависит от Δψ.", "s1a_d_t": "Воздействие (клетки в среде с глюкозой)", "s1a_d_ctrl": "контроль", "s1a_d_oligo": "олигомицин", "s1a_d_anti": "антимицин A", "s1a_d_antiol": "антимицин A + олигомицин", "s1a_d_fccp": "FCCP", "s1a_note": "Во всех условиях в среде есть глюкоза, и гликолиз даёт ATP. Δψ оценивают по накоплению катионного зонда TMRM; для расчёта Δμ взяты концентрации свободного Ca²⁺: в цитозоле 0,1 мкМ, в матриксе 1 мкМ — после предшествующего захвата Ca²⁺ (в покое в матриксе около 0,1 мкМ, как в вопросе 4).", "s1a_cyt": "цитозоль", "s1a_glyc": "гликолиз", "s1a_glyc_atp": "глюкоза → ATP", "s1a_om": "наружная мембрана", "s1a_ims": "межмембранное пространство", "s1a_matrix": "матрикс; яркость — накопление TMRM", "s1a_resp": "дыхательная цепь", "s1a_atps": "ATP-синтаза", "s1a_tim": "TIM23", "s1a_tom": "TOM", "s1a_mcu": "MCU", "s1a_mts": "белок с MTS (перенос)", "s1a_lab_anti": "антимицин A", "s1a_lab_oligo": "олигомицин", "s1a_psi_t": "Δψ по TMRM", "s1a_tmrm_hi": "TMRM накапливается в матриксе", "s1a_tmrm_lo": "TMRM почти не накапливается", "s1a_o2_on": "O₂ → H₂O", "s1a_o2_off": "O₂ почти не потребляется", "s1a_rx_syn": "ADP + Pᵢ → ATP", "s1a_rx_hyd": "ATP → ADP + Pᵢ", "s1a_rx_off": "не работает", "s1a_b_o2": "потребление O₂", "s1a_b_imp": "импорт с MTS", "s1a_b_ctrl": "контроль = 100 %", "s1a_r_psi": "Δψ (по TMRM)", "s1a_r_psi_s": "состояние мембраны, а не поток", "s1a_r_atp": "ATP-синтаза", "s1a_atp_syn": "синтезирует ATP", "s1a_atp_hyd": "гидролизует ATP, выводит H⁺", "s1a_atp_off": "заблокирована олигомицином", "s1a_r_o2": "Потребление O₂ (% от контроля)", "s1a_r_imp": "Импорт белков с MTS через TIM23 (% от контроля)", "s1a_r_ca": "Δμ для входа Ca²⁺ в матрикс", "s1a_r_ca_s": "электрическая часть {el} + химическая {ch} кДж/моль", "s1a_r_note": "Учебная модель, условные величины: Δψ контроля −150 мВ; потребление O₂ и импорт — в % от контроля. Соотношения между условиями — по Brand и Nicholls 2011; зависимость импорта от Δψ — учебная, поэтому импорт, отличающийся от контроля меньше чем на 5 %, показан как «≈ 100 %». Δμ < 0 означает, что вход Ca²⁺ через канал MCU самопроизволен.", "s1a_c_ctrl": "Контроль: дыхательная цепь выводит протоны из матрикса, Δψ = {psi} мВ; ATP-синтаза синтезирует ATP, возвращая протоны в матрикс. Δμ для входа Ca²⁺ — {ca} кДж/моль: вход через MCU идёт по электрохимическому градиенту.", "s1a_c_ctrl_z": "Один и тот же Δψ движет синтез ATP, импорт белков с MTS через TIM23 и вход Ca²⁺ через MCU.", "s1a_c_oligo": "Олигомицин заблокировал ATP-синтазу: протоны возвращаются в матрикс только путями утечки. Δψ стал немного отрицательнее ({psi} мВ), а потребление O₂ снизилось до {o2} % от контроля.", "s1a_c_oligo_z": "В покое скорость дыхания ограничена возвратом протонов: когда закрыт путь через ATP-синтазу, перенос электронов замедляется.", "s1a_c_anti": "Антимицин A ингибировал комплекс III: потребление O₂ упало до {o2} % от контроля. Δψ при этом снизился лишь частично ({psi} мВ): ATP-синтаза гидролизует гликолитический ATP и выводит протоны из матрикса; импорт белков с MTS — {imp} % от контроля.", "s1a_c_anti_z": "Δψ — состояние мембраны, а не поток: при остановке дыхания его может поддерживать другой генератор.", "s1a_c_antiol": "Антимицин A и олигомицин остановили оба генератора Δψ — дыхательную цепь и обратную работу ATP-синтазы. Δψ упал почти до нуля ({psi} мВ), импорт белков с MTS — {imp} % от контроля, Δμ для входа Ca²⁺ — {ca} кДж/моль.", "s1a_c_antiol_z": "Падение Δψ после олигомицина показывает, что потенциал поддерживался гидролизом ATP, а не дыханием (проба с олигомицином).", "s1a_c_fccp": "Протонофор FCCP возвращает протоны в матрикс в обход ATP-синтазы: Δψ упал до {psi} мВ, потребление O₂ выросло до {o2} % от контроля, а ATP-синтаза гидролизует гликолитический ATP, но Δψ не восстанавливает. Δμ для входа Ca²⁺ стала положительной ({ca} кДж/моль): вход через MCU перестал быть самопроизвольным.", "s1a_c_fccp_z": "Поток и потенциал меняются в противоположные стороны: высокая скорость дыхания не означает высокого Δψ.", "s1a_take": "Δψ — состояние мембраны, а не поток. Его величину задаёт баланс генераторов (дыхательная цепь, а при остановке дыхания — ATP-синтаза, гидролизующая гликолитический ATP) и путей возврата протонов (ATP-синтаза в прямом направлении, утечка, протонофор). Поэтому по одному Δψ нельзя судить о работе дыхательной цепи: нужен второй показатель — потребление O₂ — или проба с олигомицином. От Δψ зависят импорт белков с MTS через TIM23 и вход Ca²⁺ через канал MCU (вопрос 4): Ca²⁺ может входить в матрикс и против концентрационного градиента — по электрохимическому.", "p1a_1_q": "Клетки в среде с глюкозой. Добавили олигомицин, ингибирующий ATP-синтазу. Как изменится потребление кислорода?", "p1a_1_o1": "Вырастет выше уровня контроля", "p1a_1_o2": "Снизится примерно до трети контроля", "p1a_1_o3": "Останется на уровне контроля", "p1a_1_e": "Протоны, выведенные дыхательной цепью, возвращаются в матрикс в основном через ATP-синтазу. Олигомицин закрывает этот путь, и Δψ становится немного отрицательнее (с −150 до −160 мВ). Это замедляет перенос протонов дыхательной цепью, и потребление O₂ снижается до 30 % от контроля (учебное значение). Так оценивают долю дыхания, сопряжённую с синтезом ATP (Brand и Nicholls 2011).", "p1a_1_w1": "Рост потребления O₂ вызывает протонофор, открывающий обходной путь для протонов. Олигомицин, наоборот, закрывает основной путь их возврата в матрикс.", "p1a_1_w3": "Дыхательная цепь не ингибирована, но в покое её скорость ограничена не ферментами цепи, а возвратом протонов в матрикс; поэтому закрытие этого пути сказывается на потреблении O₂.", "p1a_2_q": "Клетки в среде с глюкозой. Добавили протонофор FCCP. Как изменится потребление кислорода?", "p1a_2_o1": "Вырастет выше уровня контроля", "p1a_2_o2": "Снизится почти до нуля", "p1a_2_o3": "Останется на уровне контроля", "p1a_2_e": "FCCP переносит протоны через внутреннюю мембрану в обход ATP-синтазы. Δψ падает до −10 мВ, протонный градиент перестаёт ограничивать перенос электронов, и дыхательная цепь работает с максимальной скоростью: в модели 220 % от контроля. Высокий поток при низком потенциале показывает, что Δψ и потребление O₂ — разные величины.", "p1a_2_w2": "Почти до нуля потребление O₂ снижают ингибиторы дыхательной цепи, например антимицин A. FCCP дыхательную цепь не ингибирует: он ускоряет возврат протонов, и цепь работает быстрее.", "p1a_2_w3": "Скорость дыхания зависит от возврата протонов в матрикс. Протонофор открывает для них быстрый обходной путь, поэтому потребление O₂ растёт.", "p1a_3_q": "Клетки в среде с глюкозой. Комплекс III дыхательной цепи ингибировали антимицином A. Как будет работать ATP-синтаза?", "p1a_3_o1": "Продолжит синтезировать ATP", "p1a_3_o2": "Полностью прекратит работу", "p1a_3_o3": "Будет гидролизовать ATP", "p1a_3_e": "Без дыхания протоны больше не выводятся из матрикса, и Δψ начинает падать. ATP-синтаза работает обратимо: при сниженном Δψ и при ATP, поступающем из гликолиза, она гидролизует ATP и выводит протоны из матрикса. Поэтому в модели Δψ сохраняется на уровне −125 мВ, хотя потребление O₂ — лишь 10 % от контроля (Brand и Nicholls 2011).", "p1a_3_w1": "Для синтеза ATP протоны должны входить в матрикс по градиенту, который создаёт дыхание. После антимицина A протоны из матрикса не выводятся, и градиента для синтеза не хватает.", "p1a_3_w2": "Сам фермент не ингибирован: олигомицина в опыте нет. При наличии ATP из гликолиза ATP-синтаза работает в обратном направлении.", "p1a_4_q": "Клетки в среде с глюкозой; свободный Ca²⁺ в цитозоле 0,1 мкМ, в матриксе 1 мкМ (после предшествующего захвата Ca²⁺). Добавили FCCP. Как изменится Δμ для входа Ca²⁺ из цитозоля в матрикс?", "p1a_4_o1": "Станет ещё более отрицательной", "p1a_4_o2": "Не изменится: концентрации те же", "p1a_4_o3": "Станет положительной", "p1a_4_e": "Δμ складывается из химической части (RT·ln 10 ≈ +5,9 кДж/моль) и электрической (2F·Δψ). В контроле электрическая часть равна −28,9 кДж/моль и Δμ = −23,0 кДж/моль: вход через канал MCU самопроизволен. FCCP снижает Δψ до −10 мВ, электрическая часть уменьшается до −1,9 кДж/моль, и Δμ становится положительной (+4,0 кДж/моль).", "p1a_4_w1": "Более отрицательной Δμ стала бы при росте Δψ по абсолютной величине, например после олигомицина. FCCP, наоборот, снижает Δψ почти до нуля.", "p1a_4_w2": "Для иона Δμ включает электрическую часть, пропорциональную заряду и Δψ. У Ca²⁺ (z = 2) в контроле она почти в пять раз больше химической.", "p1a_5_q": "Клетки в среде с глюкозой. Добавили антимицин A. Как изменится импорт белков с MTS через TIM23?", "p1a_5_o1": "Почти прекратится вслед за дыханием", "p1a_5_o2": "Снизится, но в основном сохранится", "p1a_5_o3": "Вырастет выше уровня контроля", "p1a_5_e": "Импорт через TIM23 зависит не от дыхания как такового, а от Δψ. После антимицина A ATP-синтаза гидролизует гликолитический ATP и поддерживает Δψ на уровне −125 мВ, поэтому импорт в модели сохраняется на 80 % от контроля. Если остановить и ATP-синтазу, импорт падает почти до нуля.", "p1a_5_w1": "Импорт связан с дыханием не напрямую: TIM23 использует Δψ, а не перенос электронов, и падение потребления O₂ до 10 % от контроля ещё не означает потери Δψ.", "p1a_5_w3": "Импорт выше контроля в модели получается только при Δψ отрицательнее контрольного. Антимицин A не повышает Δψ: без дыхания потенциал лишь частично поддерживается обратной работой ATP-синтазы.", "p1a_6_q": "После антимицина A (клетки в среде с глюкозой) Δψ = −125 мВ, почти как в контроле. Чтобы проверить, создаётся ли этот Δψ дыхательной цепью, добавили олигомицин. Как изменится Δψ?", "p1a_6_o1": "Упадёт почти до нуля", "p1a_6_o2": "Останется около −125 мВ", "p1a_6_o3": "Станет ещё отрицательнее", "p1a_6_e": "При ингибированном комплексе III Δψ поддерживала ATP-синтаза, гидролизуя гликолитический ATP. Олигомицин блокирует и это направление её работы, и Δψ падает до −5 мВ. Значит, нормальный Δψ сам по себе не показывает, что дыхательная цепь работает: о ней судят по потреблению O₂ (здесь 10 % от контроля) или по ответу Δψ на олигомицин (Brand и Nicholls 2011).", "p1a_6_w2": "Δψ остался бы прежним, если бы его создавала дыхательная цепь: олигомицин её не ингибирует. Но после антимицина A перенос электронов к кислороду остановлен, и потребление O₂ — лишь 10 % от контроля.", "p1a_6_w3": "Небольшой рост Δψ после олигомицина виден, когда дыхание работает: закрывается путь возврата протонов через ATP-синтазу. Здесь же ATP-синтаза не возвращала протоны в матрикс, а выводила их, создавая Δψ.", "s2b_sl_D": "Коэффициент диффузии D", "s2b_sl_k": "Константа стока k", "s2b_mk_mem": "мембранные белки: 0,05–1", "s2b_mk_prot": "белок в цитоплазме: ≈10–30", "s2b_mk_ca": "Ca²⁺ с буферами: 13–65", "s2b_mk_ip3": "IP₃: ≈280", "s2b_n_t": "Эффектор: коэффициент Хилла", "s2b_n1": "1 (без порога)", "s2b_n4": "4 (пороговый)", "s2b_K_t": "K½ эффектора, % от c₀", "s2b_K10": "10 %", "s2b_K30": "30 %", "s2b_K60": "60 %", "s2b_note": "Шкалы D и k логарифмические. Исходное положение: D = 10 мкм²/с, k = 1 с⁻¹, коэффициент Хилла 4, K½ = 30 % от c₀. Концентрация у источника c₀ поддерживается постоянной: меняя D и k, вы меняете только распространение и удаление вещества.", "s2b_lab_src": "источник", "s2b_lab_strip": "концентрация вещества (насыщенность цвета)", "s2b_lab_rstrip": "ответ эффектора (насыщенность цвета)", "s2b_lab_sink": "сток: k", "s2b_lab_eff": "эффектор: K½, n", "s2b_ax_x": "расстояние от источника, мкм", "s2b_ax_y": "%: концентрация — от c₀, ответ — от максимального", "s2b_lab_k12": "K½", "s2b_lg_c": "концентрация, % от c₀", "s2b_lg_r": "ответ эффектора, % от максимального", "s2b_st": "λ = {lam}; ответ выше 50 %: {w}", "s2b_w_whole": "по всей клетке", "s2b_tz_none": "ответ нигде не падает ниже 10 %", "s2b_tz_low": "ответ нигде не достигает 90 %", "s2b_tz_mid": "ответ везде в пределах 10–90 %", "s2b_lt01": "менее 0,1", "s2b_tz_long": "длиннее клетки (20 мкм)", "s2b_r_lam": "Длина диффузии λ = √(D/k)", "s2b_r_lam_s": "на этом расстоянии избыток над фоном падает в e ≈ 2,7 раза", "s2b_r_c1": "Концентрация на 1 мкм от источника", "s2b_r_c5": "Концентрация на 5 мкм от источника", "s2b_r_c_s": "% от c₀", "s2b_r_mean": "Средняя концентрация в клетке длиной 20 мкм", "s2b_r_mean_s": "% от c₀; такую величину даёт анализ лизата", "s2b_r_w": "Ширина домена", "s2b_r_w_s": "расстояние, на котором ответ эффектора выше 50 %", "s2b_r_tz": "Переходная зона", "s2b_r_tz_s": "участок, где ответ эффектора падает от 90 до 10 %", "s2b_r_r10": "Ответ эффектора на 10 мкм от источника, % от максимального", "s2b_r_note": "Учебная модель, условные величины: одномерный стационарный профиль c(x) = фон + (c₀ − фон)·e^(−x/λ), фон — 5 % от c₀; ответ эффектора R = cⁿ/(K½ⁿ + cⁿ). Отметки под шкалой D — измеренные коэффициенты диффузии (Allbritton 1992; Swaminathan 1997; Lippincott-Schwartz 2001), условия опытов — в справке «Источник».", "s2b_c_h4": "Длина диффузии λ = {lam} мкм. Пороговый эффектор (коэффициент Хилла 4) отвечает более чем на 50 % на протяжении {w} мкм от источника; спад ответа от 90 до 10 % занимает {tz} мкм, и на 10 мкм ответ составляет {r10} %.", "s2b_c_h4_z": "Порог превращает плавный градиент в границу: на большей части домена эффектор почти полностью активен, за его пределами почти неактивен.", "s2b_c_h4low": "Длина диффузии λ = {lam} мкм. Пороговый эффектор (коэффициент Хилла 4) с K½ = {K} % от c₀ отвечает более чем на 50 % на протяжении {w} мкм от источника. Даже у источника его ответ составляет {r0} %, то есть 90 % не достигается нигде; до 10 % ответ падает на расстоянии {x10} мкм, а на 10 мкм составляет {r10} %.", "s2b_c_h4low_z": "Граница домена остаётся резкой, но при высоком K½ она сдвинута к источнику, и даже внутри домена эффектор активен не полностью.", "s2b_c_h4long": "Длина диффузии λ = {lam} мкм. Ответ выше 50 % — на протяжении {w} мкм, но спад ответа до 10 % в клетку длиной 20 мкм не укладывается: на 10 мкм ответ ещё {r10} %.", "s2b_c_h4long_z": "При большой длине диффузии градиент слишком пологий, и даже пороговый эффектор не создаёт внутри клетки чёткой границы.", "s2b_c_h1": "Длина диффузии λ = {lam} мкм. Эффектор без кооперативности (коэффициент Хилла 1) отвечает более чем на 50 % на протяжении {w} мкм, но граница размыта: на 10 мкм ответ ещё {r10} %.", "s2b_c_h1_z": "Без порога ответ повторяет плавный профиль концентрации: эффектор частично активен и вдали от источника, поэтому чёткого домена нет.", "s2b_c_tiny": "Длина диффузии λ = {lam} мкм: уже на 1 мкм концентрация составляет {c1} % от c₀, а ответ эффектора выше 50 % — только в слое {w} мкм у источника.", "s2b_c_tiny_z": "Так устроен микродомен у устья канала: отвечает эффектор, расположенный рядом с источником, а средняя концентрация по клетке ({m} % от c₀) близка к фону.", "s2b_c_tinymem": "Длина диффузии λ = {lam} мкм: при D = {D} мкм²/с уже на 1 мкм от источника концентрация составляет {c1} % от c₀, а ответ эффектора выше 50 % — только в слое {w} мкм.", "s2b_c_tinymem_z": "Медленная диффузия в плоскости мембраны удерживает неоднородность в пределах долей микрометра от источника; средняя концентрация по клетке ({m} % от c₀) близка к фону.", "s2b_c_casat": "Буферы насыщены, и сток свободного Ca²⁺ ослаб до k = {k} с⁻¹: длина диффузии выросла до {lam} мкм, и в 1 мкм от канала концентрация свободного Ca²⁺ составляет {c1} % от c₀.", "s2b_c_casat_z": "Пока буферы не насыщены, они удерживают свободный Ca²⁺ у канала; после их насыщения домен расширяется, и при сильном выбросе Ca²⁺ локальный сигнал может стать общеклеточным (Berridge 2003).", "s2b_c_whole": "Длина диффузии λ = {lam} мкм: даже на дальнем конце клетки (20 мкм) концентрация составляет {c20} % от c₀, выше K½, и эффектор отвечает более чем на 50 % по всей длине клетки.", "s2b_c_whole_z": "При такой длине диффузии сигнал в клетке размером 20 мкм локальным не остаётся: границы домена внутри клетки нет.", "s2b_take": "Устойчивый градиент растворимого вещества внутри одного объёма создаётся тремя составляющими: источником, диффузией и стоком. Его масштаб — длина диффузии λ = √(D/k): медленная диффузия и быстрый сток сужают домен, а одновременное изменение D и k в одно и то же число раз λ не меняет. Поэтому размер домена можно изменить, не трогая источник, — изменив сток: активность фосфодиэстеразы или фосфатазы либо ёмкость буфера. Пороговый эффектор с коэффициентом Хилла больше 1 превращает плавный градиент в границу: положение границы задаёт K½, а её резкость — кооперативность. Средняя по клетке концентрация, которую даёт анализ лизата, этой границы не показывает.", "p2b_1_q": "Исходное состояние: D = 10 мкм²/с, k = 1 с⁻¹, пороговый эффектор (коэффициент Хилла 4, K½ = 30 % от c₀). Константу стока увеличили в 10 раз, до 10 с⁻¹; источник не меняли. Как изменится ширина домена, в котором ответ эффектора выше 50 %?", "p2b_1_o1": "Домен сузится", "p2b_1_o2": "Домен не изменится", "p2b_1_o3": "Домен расширится", "p2b_1_e": "Длина диффузии λ = √(D/k) уменьшилась в √10 ≈ 3,2 раза: с 3,2 до 1,0 мкм. Концентрация падает до K½ уже на 1,3 мкм от источника, а не на 4,2 мкм, поэтому домен сузился, хотя концентрация у источника осталась прежней. Так размер домена меняется при изменении стока — активности фосфодиэстеразы или фосфатазы либо ёмкости буфера.", "p2b_1_w2": "Концентрация у источника действительно прежняя, но ширина домена зависит ещё и от того, как далеко молекулы успевают уйти, прежде чем их удалит сток. Ускоренный сток сокращает это расстояние.", "p2b_1_w3": "Сток удаляет вещество: чем быстрее он работает, тем меньшее расстояние молекулы в среднем проходят от источника. Домен расширяется при ослаблении стока, а не при его усилении.", "p2b_2_q": "Исходное состояние: D = 10 мкм²/с (белок в цитоплазме), k = 1 с⁻¹. Коэффициент диффузии уменьшили в 100 раз, до 0,1 мкм²/с, — до величины, характерной для белков в плоскости мембраны; сток не меняли. Как изменится длина диффузии λ?", "p2b_2_o1": "Уменьшится в 100 раз", "p2b_2_o2": "Уменьшится в 10 раз", "p2b_2_o3": "Не изменится", "p2b_2_e": "Длина диффузии пропорциональна квадратному корню из D: при уменьшении D в 100 раз λ уменьшается в 10 раз, с 3,2 до 0,32 мкм, а ширина домена — с 4,2 до 0,42 мкм. Поэтому неоднородность распределения мембранных компонентов удержать намного легче, чем неоднородность распределения растворимых веществ.", "p2b_2_w1": "Прямо пропорционально D изменяется не сама длина диффузии, а её квадрат: λ² = D/k. Уменьшение в 100 раз относится к λ², а не к λ.", "p2b_2_w3": "Длина диффузии зависит от обеих величин — D и k. Если молекулы перемещаются медленнее, а сток прежний, они успевают уйти от источника на меньшее расстояние.", "p2b_3_q": "Исходное состояние: D = 10 мкм²/с, k = 1 с⁻¹, эффектор с коэффициентом Хилла 1 и K½ = 30 % от c₀. Его заменили эффектором с коэффициентом Хилла 4 и тем же K½. Как изменится ответ эффектора на расстоянии 10 мкм от источника?", "p2b_3_o1": "Заметно вырастет", "p2b_3_o2": "Останется прежним", "p2b_3_o3": "Снизится почти до нуля", "p2b_3_e": "На 10 мкм концентрация составляет 9 % от c₀ — более чем втрое ниже K½. Эффектор с коэффициентом Хилла 1 отвечает и на такую концентрацию (23 % от максимального), а пороговый — на 0,8 %. Ширина домена не изменилась (4,2 мкм), потому что ответ 50 % по-прежнему соответствует концентрации K½, но граница стала резкой.", "p2b_3_w1": "Коэффициент Хилла больше 1 делает зависимость ответа от концентрации круче, а не повышает чувствительность при любой концентрации: ниже K½ кооперативный эффектор отвечает слабее некооперативного.", "p2b_3_w2": "При том же K½ граница домена остаётся на месте, но форма ответа меняется: при концентрации ниже K½ кооперативный эффектор почти не отвечает.", "p2b_4_q": "Исходное состояние: D = 10 мкм²/с, k = 1 с⁻¹, пороговый эффектор с K½ = 30 % от c₀. Коэффициент диффузии и константу стока одновременно уменьшили в 100 раз: D — до 0,1 мкм²/с, k — до 0,01 с⁻¹. Как изменится ширина домена?", "p2b_4_o1": "Не изменится", "p2b_4_o2": "Сузится примерно в 10 раз", "p2b_4_o3": "Расширится примерно в 10 раз", "p2b_4_e": "Длина диффузии зависит от отношения D/k, а оно осталось прежним: λ = 3,2 мкм, ширина домена — 4,2 мкм, профиль и ответ те же. Одна и та же картина градиента совместима с разными парами D и k, поэтому по профилю нельзя определить каждую из величин — их измеряют отдельно (D, например, методом FRAP).", "p2b_4_w2": "Замедленная диффузия сама по себе сузила бы домен, но в той же мере ослаблен и сток. Эти два изменения компенсируют друг друга.", "p2b_4_w3": "Ослабленный сток сам по себе расширил бы домен, но в той же мере замедлилась и диффузия. Длина диффузии определяется отношением D/k, а оно не изменилось.", "p2b_5_q": "Исходное состояние: D = 10 мкм²/с, k = 1 с⁻¹, пороговый эффектор (коэффициент Хилла 4) с K½ = 30 % от c₀. Его заменили пороговым эффектором с K½ = 60 % от c₀; профиль концентрации не меняли. Как изменится ширина домена?", "p2b_5_o1": "Расширится", "p2b_5_o2": "Сузится", "p2b_5_o3": "Не изменится", "p2b_5_e": "Граница домена проходит там, где концентрация падает до K½. Концентрация 60 % от c₀ достигается ближе к источнику, чем 30 %, поэтому домен сузился с 4,2 до 1,7 мкм. Эффекторы с разными K½ считывают один и тот же градиент на разных расстояниях от источника — так градиент несёт позиционную информацию.", "p2b_5_w1": "Эффектор с бо́льшим K½ менее чувствителен: ему нужна более высокая концентрация, а такая концентрация есть только ближе к источнику.", "p2b_5_w3": "Профиль концентрации прежний, но положение границы задаёт и порог эффектора: при большем K½ граница сдвигается к источнику.", "p2b_6_q": "Свободный Ca²⁺ у устья канала: D = 20 мкм²/с, k = 1000 с⁻¹ (сток — связывание ненасыщенными буферами). При сильном входе Ca²⁺ буферы насыщаются, и k падает до 10 с⁻¹. Как изменится концентрация свободного Ca²⁺ в 1 мкм от канала?", "p2b_6_o1": "Останется на уровне фона", "p2b_6_o2": "Станет почти равной c₀ у канала", "p2b_6_o3": "Вырастет примерно до половины c₀", "p2b_6_e": "При k = 1000 с⁻¹ λ = 0,14 мкм, и в 1 мкм от канала концентрация равна фону (5 % от c₀). После насыщения буферов λ = 1,4 мкм, и там уже 52 % от c₀. Поэтому локальность кальциевого сигнала — условное утверждение: при сильном выбросе Ca²⁺ и насыщении буферов могут возникать подъёмы и волны, охватывающие всю клетку (Berridge 2003).", "p2b_6_w1": "Насыщенный буфер перестаёт быстро связывать вновь вошедшие ионы, поэтому свободный Ca²⁺ диффундирует дальше от канала. Концентрация на 1 мкм остаётся фоновой, только пока буферы не насыщены.", "p2b_6_w2": "Сток ослаб, но не исчез: насосы и оставшиеся свободные молекулы буферов продолжают удалять Ca²⁺, поэтому на расстоянии 1 мкм концентрация ниже, чем у самого канала.", "s2a_tA": "Гормон А", "s2a_tB": "Гормон Б", "s2a_tI": "IBMX (ингибитор PDE)", "s2a_tH": "Пептид Ht31 (отделяет PKA от AKAP)", "s2a_note": "Клетка длиной 20 мкм с двумя мембранными доменами: в домене А — рецептор гормона А, аденилатциклаза (AC) и AKAP, удерживающий PKA у мишени А; в домене Б — рецептор гормона Б и AC. Фосфодиэстеразы (PDE) распределены по цитозолю. В модели оба гормона стимулируют синтез cAMP с одинаковой скоростью.", "s2a_lab_rA": "рецептор А", "s2a_lab_rB": "рецептор Б", "s2a_lab_hA": "гормон А", "s2a_lab_hB": "гормон Б", "s2a_lab_tg": "мишень А", "s2a_lab_domA": "домен А", "s2a_lab_domB": "домен Б", "s2a_ax_x": "расстояние от домена А, мкм", "s2a_ax_y": "cAMP, × от покоя (логарифмическая шкала)", "s2a_lab_mean": "средний по клетке (как в лизате)", "s2a_lab_k12": "K½ активации PKA", "s2a_lab_tgx": "мишень А", "s2a_lt1": "менее 1", "s2a_st": "cAMP: средний {m}, у мишени А {ct} от покоя", "s2a_r_mean": "Средний cAMP по клетке", "s2a_r_mean_s": "× от покоя; такую величину даёт анализ лизата", "s2a_r_ct": "cAMP у мишени А", "s2a_r_ct_s": "× от покоя; в 0,5 мкм от мембраны домена А", "s2a_r_amt": "PKA у мишени А", "s2a_r_amt_s": "% от количества, закреплённого AKAP", "s2a_r_f": "Доля активной PKA среди молекул PKA у мишени А", "s2a_r_ph": "Фосфорилирование мишени А, % молекул мишени", "s2a_r_note": "Учебная модель, условные величины, стационарное состояние. Эффективный коэффициент диффузии cAMP — 30 мкм²/с (учебная величина: связывание с белками замедляет перемещение cAMP), PDE — сток первого порядка, IBMX снижает его на 80 %. Профиль cAMP на графике (сплошная линия) — сумма профилей от двух доменов и от базального синтеза; штриховая линия — средний cAMP по клетке, пунктир — K½ активации PKA. В покое профиль совпадает со средним уровнем.", "s2a_c_0": "Гормонов нет: cAMP во всей клетке на уровне покоя. Доля активной PKA у мишени А — {f} %, мишень А фосфорилирована на {ph} %.", "s2a_c_0_z": "В покое базальный синтез cAMP аденилатциклазой уравновешен его гидролизом фосфодиэстеразами, и PKA у мишени почти неактивна.", "s2a_c_A": "Гормон А повысил концентрацию cAMP у мишени А до ×{ct} от покоя, а среднюю по клетке — только до ×{m}. Доля активной PKA у мишени — {f} %, мишень А фосфорилирована на {ph} %.", "s2a_c_A_z": "Аденилатциклаза и закреплённая AKAP протеинкиназа A находятся в одном домене, поэтому мишень А отвечает на местную, а не на среднюю концентрацию cAMP.", "s2a_c_B": "Гормон Б повысил средний cAMP в клетке до ×{m} от покоя — столько же, сколько гормон А, — но у мишени А cAMP почти не изменился (×{ct}), и мишень А фосфорилирована на {ph} %.", "s2a_c_B_z": "cAMP, синтезированный в домене Б, гидролизуется фосфодиэстеразами раньше, чем доходит до мишени А, поэтому гормон Б на мишень А почти не действует.", "s2a_c_AB": "Оба гормона: средний cAMP вырос до ×{m} от покоя — почти вдвое больше, чем от одного гормона А. Но cAMP у мишени А (×{ct}) почти не изменился, и мишень А фосфорилирована на {ph} % (от одного гормона А — {phA} %).", "s2a_c_AB_z": "Добавочный cAMP из домена Б до мишени А не доходит: средняя по клетке концентрация растёт, а концентрация у мишени — почти нет.", "s2a_c_I": "IBMX ингибирует фосфодиэстеразы: без гормонов cAMP вырос во всей клетке до ×{m} от покоя. Доля активной PKA у мишени А — {f} %, мишень А фосфорилирована на {ph} %.", "s2a_c_I_z": "PDE — сток cAMP: при ингибированном стоке даже базальный синтез повышает cAMP по всей клетке.", "s2a_c_IB": "IBMX и гормон Б: при ингибированных PDE длина диффузии cAMP выросла до {lam} мкм, и к базальному cAMP у мишени А добавляется cAMP из домена Б — всего ×{ct} от покоя; мишень А фосфорилирована на {ph} %.", "s2a_c_IB_z": "Размер домена задаёт сток: при ингибированных фосфодиэстеразах домен Б расширяется, и гормон Б начинает действовать на мишень, которую при работающих PDE почти не затрагивает.", "s2a_c_IA": "IBMX и гормон А: cAMP повышен по всей клетке (средний ×{m} от покоя, у мишени А ×{ct}); мишень А фосфорилирована на {ph} %.", "s2a_c_IA_z": "При ингибированных фосфодиэстеразах cAMP из домена А распространяется на всю клетку, и граница домена исчезает.", "s2a_c_H": "Пептид Ht31 отделил PKA от AKAP. cAMP у мишени А высок (×{ct} от покоя), и доля активной PKA там — {f} %, но самой PKA у мишени осталось {amt} %, поэтому мишень А фосфорилирована только на {ph} %.", "s2a_c_H_z": "AKAP определяет место работы киназы: без закрепления у мишени мало PKA, и мишень фосфорилируется слабо, хотя cAMP рядом с ней много.", "s2a_c_Hlow": "Пептид Ht31 отделил PKA от AKAP: у мишени А осталось {amt} % PKA. cAMP у мишени — ×{ct} от покоя, доля активной PKA — {f} %, мишень А фосфорилирована на {ph} %.", "s2a_c_Hlow_z": "Без закрепления у мишени мало киназы, а концентрация cAMP у мишени ниже порога активации PKA, поэтому мишень фосфорилирована слабо.", "s2a_take": "Одинаковая средняя концентрация cAMP в клетке может давать разный ответ. В модели при гормонах А и Б cAMP синтезируется с одинаковой скоростью, и средний уровень повышается одинаково, но мишень А фосфорилируется только при гормоне А: его аденилатциклаза находится рядом с PKA, которую AKAP удерживает у мишени, а cAMP из домена Б гидролизуется фосфодиэстеразами раньше, чем доходит до мишени. PDE — сток, задающий размер домена: при их ингибировании IBMX домены расширяются и перекрываются. AKAP задаёт место: после отделения PKA пептидом Ht31 мишень фосфорилируется слабо, хотя cAMP рядом с ней много. Поэтому измерение cAMP в лизате не отвечает на вопрос, какая мишень фосфорилирована. Тот же принцип — важно место источника, а не средний уровень — действует для Ca²⁺ в зоне контакта ЭПР с митохондрией (вопрос 4).", "p2a_1_q": "К покоящейся клетке добавили гормон Б: его рецептор и аденилатциклаза находятся в домене Б, на противоположном от мишени А конце клетки. Как изменится фосфорилирование мишени А?", "p2a_1_o1": "Почти не изменится", "p2a_1_o2": "Вырастет так же, как от гормона А", "p2a_1_o3": "Вырастет, но слабее, чем от гормона А", "p2a_1_e": "Средний cAMP в клетке вырос до ×5,0 от покоя, но у мишени А — только до ×1,1: по пути через клетку длиной 20 мкм cAMP из домена Б гидролизуется фосфодиэстеразами. Доля активной PKA у мишени осталась около 1 %, а фосфорилирование мишени А — 2 %, как в покое.", "p2a_1_w2": "При гормонах А и Б cAMP синтезируется с одинаковой скоростью, но в разных местах. Мишень А отвечает на концентрацию cAMP рядом с собой, а туда cAMP из домена Б почти не доходит.", "p2a_1_w3": "Ослабленный ответ означал бы, что до мишени доходит заметная часть cAMP из домена Б. При длине диффузии около 3 мкм почти весь этот cAMP гидролизуется, не дойдя до мишени, которая находится в 19,5 мкм от домена Б.", "p2a_2_q": "На клетку действует гормон А. Его заменили гормоном Б. Как изменится средняя концентрация cAMP в клетке, измеренная в лизате?", "p2a_2_o1": "Снизится почти до уровня покоя", "p2a_2_o2": "Не изменится", "p2a_2_o3": "Вырастет", "p2a_2_e": "В стационаре средняя концентрация равна общей скорости синтеза, делённой на константу стока, и от места синтеза не зависит; при обоих гормонах аденилатциклаза синтезирует cAMP с одинаковой скоростью, поэтому средний cAMP — ×5,0 от покоя в обоих случаях. При этом cAMP у мишени А снизился с ×23 до ×1,1, а фосфорилирование мишени — с 70 до 2 %. Анализ лизата этой разницы не показывает.", "p2a_2_w1": "До уровня покоя снизился cAMP у мишени А, а не средний по клетке: при гормоне Б cAMP синтезируется с той же скоростью, что и при гормоне А, только в другом месте.", "p2a_2_w3": "Скорость синтеза cAMP при гормоне Б такая же, как при гормоне А, и сток прежний. Перенос синтеза в другой домен не меняет общего количества cAMP в клетке.", "p2a_3_q": "В клетке без гормонов фосфодиэстеразы ингибированы IBMX. Добавили гормон Б. Как изменится фосфорилирование мишени А?", "p2a_3_o1": "Снизится", "p2a_3_o2": "Почти не изменится, как без IBMX", "p2a_3_o3": "Вырастет", "p2a_3_e": "При ингибированных PDE длина диффузии cAMP увеличилась с 3,2 до 6,0 мкм, и cAMP из домена Б доходит до мишени А: cAMP у мишени вырос с ×3,6 до ×7,0 от покоя, фосфорилирование мишени А — с 20 до 43 %. Без IBMX гормон Б на мишень А почти не действует: размер домена задаёт сток.", "p2a_3_w1": "IBMX ингибирует гидролиз cAMP, а гормон Б стимулирует его синтез: оба воздействия повышают, а не снижают концентрацию cAMP.", "p2a_3_w2": "Сравнение с опытом без IBMX здесь не подходит: там гормон Б не действует на мишень А потому, что PDE гидролизуют cAMP по пути к ней. IBMX снимает именно это ограничение.", "p2a_4_q": "На клетку действует гормон А, мишень А фосфорилирована. Добавили пептид Ht31, отделяющий PKA от AKAP. Как изменится фосфорилирование мишени А?", "p2a_4_o1": "Снизится", "p2a_4_o2": "Не изменится", "p2a_4_o3": "Вырастет", "p2a_4_e": "cAMP у мишени А остался прежним (×23 от покоя), и доля активной PKA там по-прежнему 78 %. Но AKAP больше не удерживает PKA у мишени, и киназа распределяется по цитозолю: у мишени её осталось 10 %, поэтому фосфорилирование мишени А снизилось с 70 до 19 %. AKAP определяет не активность киназы, а место её работы.", "p2a_4_w2": "cAMP у мишени действительно не изменился, но фосфорилирование мишени катализирует PKA, а cAMP лишь активирует эту киназу. После Ht31 молекул PKA рядом с мишенью мало.", "p2a_4_w3": "Отделённая от AKAP PKA распределяется по всему цитозолю, поэтому рядом с мишенью А её становится меньше, а не больше.", "p2a_5_q": "На клетку действует гормон А. Добавили гормон Б, и средняя концентрация cAMP в клетке выросла почти вдвое. Как изменится фосфорилирование мишени А?", "p2a_5_o1": "Вырастет почти вдвое", "p2a_5_o2": "Почти не изменится", "p2a_5_o3": "Снизится", "p2a_5_e": "Средний cAMP вырос с ×5,0 до ×9,0 от покоя, но у мишени А концентрация почти та же (×23), и мишень фосфорилирована, как и прежде, на 70 %: cAMP из домена Б до мишени не доходит. Похожий результат получен на изолированном перфузируемом сердце крысы: изопротеренол вместе с простагландином E1 повышал cAMP сильнее, чем один изопротеренол, а сократимость и активация гликогенфосфорилазы были такими же, как от одного изопротеренола (Hayes 1979).", "p2a_5_w1": "Почти вдвое вырос средний cAMP, а мишень А отвечает на концентрацию cAMP рядом с собой; там она почти не изменилась.", "p2a_5_w3": "Гормон Б не подавляет ни синтез cAMP в домене А, ни активность PKA: он лишь стимулирует синтез cAMP на противоположном конце клетки.", "gn_dsource": "Источник вещества", "g_dsource": "Место, где вещество образуется или поступает в цитозоль: фермент, закреплённый в определённом месте (аденилатциклаза в мембранном домене, липидкиназа на органелле), канал, через который вещество выходит из депо (рецептор IP₃ в мембране ЭПР), или направленный транспорт. В модели концентрация у источника поддерживается постоянной (c₀). Отметки под шкалой D — измеренные величины: IP₃ — 283 мкм²/с, Ca²⁺ — от 13 до 65 мкм²/с при повышении концентрации свободного Ca²⁺ с 90 нМ до 1 мкМ (экстракт ооцитов шпорцевой лягушки, Allbritton 1992); белок GFP в цитоплазме клеток CHO — около 27 мкм²/с против 87 мкм²/с в солевом растворе (Swaminathan 1997); мембранные белки — 0,05–1 мкм²/с (обзор Lippincott-Schwartz 2001).", "gn_dsink": "Сток", "g_dsink": "Процесс, удаляющий вещество из отслеживаемой формы: ферментативное разрушение (фосфодиэстераза гидролизует cAMP), секвестрация (SERCA переносит Ca²⁺ в просвет ЭПР) или обратимое связывание буфером — для свободного Ca²⁺ это сток, но при снижении концентрации буфер отдаёт ион обратно. Для фосфорилированного белка источник — киназа, сток — фосфатаза. В модели сток первого порядка с константой k: чем больше k, тем короче время жизни молекулы (1/k) и длина диффузии. Насыщение буферов ослабляет сток; по данным Allbritton 1992, эффективный D для Ca²⁺ при этом рос, что расширяет домен ещё больше.", "gn_deffect": "Эффектор с порогом", "g_deffect": "Белок, активность которого зависит от концентрации сигнала. Ответ описан уравнением Хилла: R = cⁿ/(K½ⁿ + cⁿ). K½ — концентрация, при которой ответ равен 50 %; она задаёт положение границы домена. Коэффициент Хилла n задаёт крутизну: при n = 4 ответ растёт от 10 до 90 % при увеличении концентрации всего в 3 раза, при n = 1 — в 81 раз. Резкий ответ возникает при кооперативном связывании (кальмодулин с четырьмя сайтами Ca²⁺), многоступенчатом фосфорилировании и насыщении субстратом киназы и фосфатазы, работающих в противоположных направлениях (Goldbeter и Koshland 1981).", "gn_rcptab": "Рецепторы гормонов А и Б", "g_rcptab": "Рецепторы, сопряжённые с G-белками: связывание гормона активирует белок Gs, а он — аденилатциклазу в той же области мембраны. В модели рецепторы А и Б одинаково эффективны и различаются только расположением. Реальный пример — β-адренорецептор (агонист изопротеренол) и рецептор простагландина E1 в сердце: в изолированном перфузируемом сердце крысы 10 нМ изопротеренол и 30 мкМ PGE1 одинаково повышали содержание cAMP и активность PKA, но сократимость и активность гликогенфосфорилазы повышал только изопротеренол (Hayes 1979).", "gn_adcy": "Аденилатциклаза (AC)", "g_adcy": "Мембранный фермент, синтезирующий cAMP из ATP; активируется белком Gs после связывания гормона с рецептором. В модели — источник cAMP: базальный синтез идёт по всей клетке, синтез в ответ на гормон — только в домене его рецептора. Форсколин активирует AC напрямую, минуя рецепторы.", "gn_pde": "Фосфодиэстеразы (PDE)", "g_pde": "Ферменты, гидролизующие cAMP до 5′-AMP. cAMP гидролизуют восемь семейств PDE (PDE1, 2, 3, 4, 7, 8, 10, 11); многие изоформы закреплены у определённых мембран и белков (обзор Zaccolo 2021). В модели PDE — сток cAMP, равномерно распределённый по цитозолю: чем выше их активность, тем короче длина диффузии cAMP и меньше домен. Ингибирование PDE расширяет домены.", "gn_pka": "Протеинкиназа A (PKA)", "g_pka": "Киназа, активируемая cAMP: тетрамер из двух регуляторных (R) и двух каталитических (C) субъединиц. Связывание cAMP с регуляторными субъединицами освобождает активность каталитических; донор фосфата — ATP, а не cAMP. По современным данным, при физиологической стимуляции активная каталитическая субъединица в основном остаётся в комплексе с AKAP, а пороги активации эффекторов cAMP составляют около 0,3–3 мкМ (обзор Bock 2024). В модели доля активной PKA рассчитана по учебной кривой с K½ = ×12 от покоя.", "gn_akap": "AKAP (белки, закрепляющие PKA)", "g_akap": "Якорные белки, которые связывают регуляторные субъединицы PKA амфипатической спиралью и удерживают киназу у определённой мембраны или белка-мишени. Многие AKAP одновременно связывают аденилатциклазу, PDE и фосфатазы и собирают локальный сигнальный комплекс. AKAP определяет место работы PKA, а не её активность; в одной клетке насчитывают 15–20 разных AKAP (обзор Bock 2024).", "gn_tgta": "Мишень А", "g_tgta": "Условный белок-субстрат PKA у мембраны домена А. Его фосфорилирование меняет активность белка, и это изменение — ответ клетки на гормон А. В кардиомиоцитах новорождённой крысы β-адренергическая стимуляция приводит к фосфорилированию фосфоламбана и тропонина I, а простагландин E1 — нет (Di Benedetto 2008). В модели фосфорилирование мишени — стационар работы PKA, находящейся рядом с мишенью, и постоянной фосфатазы; значок P на схеме означает, что фосфорилировано больше половины молекул мишени.", "gn_ibmx": "IBMX (3-изобутил-1-метилксантин)", "g_ibmx": "Неизбирательный ингибитор фосфодиэстераз. Повышает cAMP по всей клетке и размывает границы доменов, поэтому служит проверкой того, что домен поддерживается стоком: в кардиомиоцитах новорождённой крысы ингибирование PDE снимало ограничение распространения cAMP при β-адренергической стимуляции (Zaccolo и Pozzan 2002). Вместе с форсколином повышает cAMP до уровней выше физиологических (обзор Bock 2024). В модели IBMX снижает константу стока на 80 % (учебная величина).", "gn_ht31": "Пептид Ht31", "g_ht31": "Синтетический пептид, соответствующий участку 493–515 белка Ht31 (AKAP щитовидной железы человека) с амфипатической спиралью, которой AKAP связывает PKA. Пептид связывает регуляторную субъединицу RIIα PKA (Kd около 4 нМ) и вытесняет её из комплексов с AKAP (Carr 1992); поэтому он отделяет от AKAP прежде всего PKA типа II. PKA после этого по-прежнему активируется cAMP, но не удерживается у своих мишеней. В модели после Ht31 у мишени А остаётся 10 % PKA (учебная величина).", "s3b_s_t": "Сенсор (флуоресцентный белок с липид-связывающим доменом)", "s3b_s_plcd": "PH-PLCδ1", "s3b_s_p4m": "P4M", "s3b_s_fapp": "PH-FAPP1", "s3b_s_fyve": "2×FYVE", "s3b_s_snxa": "SnxA", "s3b_s_akt": "PH-AKT", "s3b_t_gf": "Фактор роста (активирует PI3K класса I)", "s3b_t_vps": "Ингибитор VPS34", "s3b_t_api": "Апилимод (ингибитор PIKfyve)", "s3b_t_pten": "Клетки без PTEN", "s3b_m_pm": "плазматическая мембрана", "s3b_m_golgi": "аппарат Гольджи", "s3b_m_ee": "ранняя эндосома", "s3b_m_le1": "поздняя эндосома,", "s3b_m_le2": "лизосома", "s3b_e_pi3k": "PI3K кл. I", "s3b_e_pten": "PTEN", "s3b_e_pip5k": "PIP5K", "s3b_e_pi4kb": "PI4KIIIβ", "s3b_e_vps34": "VPS34", "s3b_e_pikfyve": "PIKfyve", "s3b_d_vps": "ингибитор", "s3b_d_api": "апилимод", "s3b_gf_on": "фактор роста", "s3b_matur": "созревание", "s3b_vac1": "увеличенные", "s3b_vac2": "вакуоли", "s3b_model": "Учебная модель, условные величины", "s3b_lg_plcd": "связанный сенсор PH-PLCδ1 (PI(4,5)P₂)", "s3b_lg_p4m": "связанный сенсор P4M (PI4P)", "s3b_lg_fapp": "связанный сенсор PH-FAPP1 (PI4P и Arf1-GTP)", "s3b_lg_fyve": "связанный сенсор 2×FYVE (PI3P)", "s3b_lg_snxa": "связанный сенсор SnxA (PI(3,5)P₂)", "s3b_lg_akt": "связанный сенсор PH-AKT (PI(3,4,5)P₃ и PI(3,4)P₂)", "s3b_r_occ_t": "Занятость сенсора {s} на мембране и содержание его липида", "s3b_r_pm": "плазматическая мембрана", "s3b_r_golgi": "аппарат Гольджи", "s3b_r_ee": "ранняя эндосома", "s3b_r_le": "поздняя эндосома, лизосома", "s3b_r_lip_pip2": "PI(4,5)P₂", "s3b_r_lip_pi4p": "PI4P", "s3b_r_lip_pi3p": "PI3P", "s3b_r_lip_pi35": "PI(3,5)P₂", "s3b_r_lip_pip3": "PI(3,4,5)P₃", "s3b_ue": "у. е.", "s3b_r_cont_t": "Содержание меток на характерных мембранах, у. е.", "s3b_r_c_pip2": "PI(4,5)P₂", "s3b_r_c_pi4p": "PI4P", "s3b_r_c_pi3p": "PI3P", "s3b_r_c_pi35": "PI(3,5)P₂", "s3b_r_c_pip3": "PI(3,4,5)P₃", "s3b_r_note": "Учебная модель: содержание каждого липида на каждой мембране — стационар между синтезом местной киназой и удалением местными фосфатазами или следующей киназой. 100 у. е. — содержание липида на его характерной мембране в контроле (для PI(3,4,5)P₃ — после фактора роста); значения выше 100 не обрезаются. Занятость — доля сенсора, связанного с мембраной (от 0 до 100 %); на характерной мембране в контроле она около 60 %. Ингибитор VPS34 оставляет 10 % её активности, апилимод — 5 % активности PIKfyve.", "s3b_c_plcd": "PH-PLCδ1 связывается с плазматической мембраной (занятость {pm} %): PI(4,5)P₂ синтезируется киназой PIP5K из PI4P именно здесь, а на других мембранах этого липида в модели нет.", "s3b_c_plcd_z": "PI(4,5)P₂ — характерная метка плазматической мембраны: с ним связываются и удерживаются на мембране белки эндоцитоза, ионные каналы и регуляторы актинового цитоскелета.", "s3b_c_plcd_low": "В модели без PTEN фактор роста переводит заметную часть PI(4,5)P₂ в PI(3,4,5)P₃: содержание PI(4,5)P₂ — {c_pm} у. е., занятость PH-PLCδ1 снизилась до {pm} %.", "s3b_c_plcd_low_z": "PI(4,5)P₂ — и метка, и субстрат: PI3K класса I и фосфолипаза C расходуют его, и PIP5K восполняет убыль.", "s3b_c_p4m": "P4M связывается с тремя мембранами: с аппаратом Гольджи (занятость {go} %), плазматической мембраной ({pm} %) и поздней эндосомой ({le} %) — везде, где есть PI4P.", "s3b_c_p4m_z": "PI4P характерен для Гольджи, но на каждой из трёх мембран его синтезирует своя PI-4-киназа; один липид размечает несколько компартментов.", "s3b_c_fapp": "PH-FAPP1 связывается почти только с аппаратом Гольджи (занятость {go} %), хотя PI4P есть и в плазматической мембране ({c_pm} у. е.; занятость {pm} %): для связывания этому домену нужен ещё Arf1-GTP.", "s3b_c_fapp_z": "Сенсор на основе домена показывает не распределение липида, а места, где липид сочетается с другими условиями связывания.", "s3b_c_fyve": "2×FYVE связывается прежде всего с ранней эндосомой (занятость {ee} %), где PI3P синтезируется киназой VPS34; на поздней эндосоме — {le} %.", "s3b_c_fyve_z": "PI3P — метка ранней эндосомы: с ним связываются белки с доменами FYVE и PX, участвующие в слиянии и сортировке.", "s3b_c_fyve_vps": "Ингибитор VPS34 снизил содержание PI3P на ранней эндосоме до {c_ee} у. е., и занятость 2×FYVE упала до {ee} %.", "s3b_c_fyve_vps_z": "Метка существует, пока её синтезирует местная киназа: при подавленном синтезе фосфатазы удаляют PI3P, и мембрана теряет признак ранней эндосомы.", "s3b_c_fyve_api": "При подавленной PIKfyve PI3P на поздней эндосоме в модели не превращается в PI(3,5)P₂ и накапливается ({c_le} у. е.), занятость 2×FYVE там выросла до {le} %; на ранней энд
