в сменились в обратном порядке — открытый центр связал ATP и прочно удерживает его, ATP гидролизуется, затем ADP и Pi удерживаются слабо и выходят.","Состояния β не изменились. Поворот γ составляет {ang}°; до следующей смены состояний β остаётся поворот на {left}°. Гидролиз ATP происходит не на каждый H⁺, а один раз на 120° поворота."]}}},{"id":"respiratory-control","number":4,"section":0,"title":"Почему доступность ADP влияет на скорость дыхания","question":1,"questions":[1],"keywords":["дыхательный контроль","ADP","потребление ATP","скорость дыхания","состояние 3","состояние 4","сопряжение","поток","содержание ATP"],"lead":["В сопряжённых митохондриях скорость дыхания зависит от того, как быстро протондвижущая сила используется для синтеза ATP.","Когда расход ATP в клетке растёт, образуется больше ADP; ATP-синтаза быстрее возвращает H⁺ в матрикс, и перенос электронов ускоряется."],"mechanism":["Процессы, расходующие ATP, образуют ADP и Pi; эти субстраты переносятся в матрикс и используются ATP-синтазой.","Чем быстрее ATP-синтаза возвращает H⁺ в матрикс, тем слабее Δp противодействует дальнейшему переносу H⁺ комплексами дыхательной цепи.","Перенос электронов и потребление O₂ ускоряются, а содержание ATP может почти не измениться: растут оба потока — образования и расхода."],"paragraphs":["Когда субстраты окисления и O₂ доступны, скорость дыхания всё равно не максимальна. Перенос H⁺ комплексами дыхательной цепи совершается против протондвижущей силы: чем больше Δp, тем сильнее она тормозит дальнейший перенос H⁺ и вместе с ним перенос электронов. Поэтому скорость дыхания зависит от того, сколько H⁺ возвращается в матрикс через ATP-синтазу и другими путями.","Если клетка расходует ATP быстрее — например, при сокращении мышечного волокна или усиленном синтезе белка, — образуется больше ADP и Pi. Переносчики доставляют их в матрикс, ATP-синтаза работает быстрее и быстрее возвращает H⁺. Δp немного снижается, перенос электронов ускоряется, и потребление O₂ растёт. Эту зависимость скорости дыхания от использования протондвижущей силы для фосфорилирования ADP называют [[T15|дыхательным контролем]].","Важно различать поток и содержание вещества. Ускорение дыхания означает больший поток синтеза ATP, но не обязательно рост содержания ATP: в установившемся состоянии ATP образуется и расходуется с одинаковой большей скоростью. Отношение ATP к ADP при этом может почти не меняться или даже немного снижаться.","На изолированных митохондриях дыхательный контроль измеряют как отношение скоростей дыхания с добавленным ADP (состояние 3) и после его исчерпания (состояние 4). Это отношение зависит от субстрата, препарата митохондрий и протокола, поэтому его сравнивают только при одинаковых условиях. В клетках роль ATP-связанного дыхания оценивают по ответу на олигомицин (шаги о методах ниже)."],"trap":["Ускорение дыхания обязательно означает накопление ATP.","При усиленном расходе ATP дыхание ускоряется именно потому, что ATP быстрее превращается в ADP. Синтез и расход растут вместе, а содержание ATP может остаться почти прежним."],"conditions":"Схема механизма; уровни скоростей — качественные. Сопряжённые митохондрии, доступные субстраты и O₂; сравниваются установившиеся состояния после изменения расхода ATP, без повреждения. Отношение дыхательного контроля (состояние 3 / состояние 4) относится к изолированным митохондриям; в клетках ATP-связанное дыхание оценивают по ответу на олигомицин (Divakaruni 2014).","sources":["Divakaruni2014","B_ALB2","B_LNR2"],"quiz":{"id":"S9-L04","rev":1,"question":"В сопряжённых митохондриях достаточно субстратов и O₂, но доступность ADP исходно ограничивает синтез ATP. Почему увеличение доступности ADP может ускорить дыхание?","options":[{"text":"ATP-синтаза быстрее использует Δp, ослабляя ограничение переноса электронов.","correct":true,"feedback":"При использовании Δp для фосфорилирования уменьшается противодействие дальнейшему переносу H⁺ дыхательной цепью. Поэтому поток электронов и потребление O₂ могут увеличиться.","id":"S9-L04-1"},{"text":"ATP-синтаза медленнее использует Δp, поскольку ADP тормозит её работу.","correct":false,"feedback":"ADP служит субстратом синтеза ATP. При исходном ограничении доступностью ADP его добавление ускоряет использование Δp, а не тормозит работу синтазы.","id":"S9-L04-2"},{"text":"Использование ADP повышает Δp и тем самым ускоряет перенос электронов.","correct":false,"feedback":"При более быстром использовании Δp ATP-синтазой ограничение переноса электронов ослабевает. Вариант меняет направление этой причинной связи.","id":"S9-L04-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Расход ATP определяет скорость дыхания","status":"Схема механизма · качественные состояния","ctrls":[{"id":"r","type":"group","label":"Что показать","opts":["Низкий расход ATP","Повышенный расход ATP","Эксперимент на изолированных митохондриях: добавление ADP"]}],"W":560,"H":340,"NW":560,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":140,"c":"cyto","t":"цитозоль","lx":548,"ly":26,"a":"end"},{"x":6,"y":156,"w":548,"h":178,"c":"mito","t":"митохондрия","lx":548,"ly":326,"a":"end"}],"mem":[],"nodes":{"cons":{"p":[280,36,290,38],"t":"процессы, расходующие ATP","n":[280,36,290,38],"fs":16},"atp":{"p":[470,112,70,36],"t":"ATP","n":[470,112,70,36]},"adp":{"p":[90,112,104,36],"t":"ADP + Pi","n":[90,112,104,36]},"syn":{"p":[410,210,140,44],"t":"ATP-синтаза","n":[410,210,140,44]},"dp":{"p":[280,300,70,40],"t":"Δp","n":[280,300,70,40],"fs":19},"chain":{"p":[130,210,140,50],"t":"дыхательная\nцепь","n":[130,210,140,50]},"o2":{"p":[130,312,120,34],"t":"O₂ → H₂O","n":[130,312,120,34]}},"edges":{"use":{"a":"atp","b":"cons","k":"rx"},"ret":{"a":"cons","b":"adp","k":"rx"},"toS":{"a":"adp","b":"syn","k":"rx","t":"субстраты","d":[0,-14]},"mk":{"a":"syn","b":"atp","k":"rx"},"cdp":{"a":"chain","b":"dp","k":"tr","t":"H⁺ наружу","d":[-30,10]},"dps":{"a":"dp","b":"syn","k":"tr","t":"H⁺ внутрь","d":[30,10]},"o2":{"a":"chain","b":"o2","k":"eq","t":"e⁻","d":[14,0],"anc":"start"}},"st":{"0":{"n":{"syn":"low","chain":"low","dp":"on"},"note":"Расход ATP мал: ADP образуется медленно, ATP-синтаза возвращает мало H⁺, высокая Δp тормозит перенос H⁺ дыхательной цепью. Дыхание медленное.","tab":[["Показатель","Низкий расход","Повышенный расход"],["Образование ADP","медленное","быстрое"],["Поток H⁺ через ATP-синтазу","малый","большой"],["|Δp|","высокая","немного ниже"],["Перенос электронов, потребление O₂","медленные","быстрые"],["Содержание ATP","исходное","может почти не измениться"]]},"1":{"n":{"syn":"on","chain":"on","dp":"base","cons":"on","o2":"on"},"note":"Расход ATP вырос: ADP и Pi поступают в матрикс быстрее, ATP-синтаза быстрее возвращает H⁺, Δp немного снижается и меньше тормозит дыхательную цепь. Потребление O₂ растёт; синтез и расход ATP ускорились вместе.","tab":[["Показатель","Низкий расход","Повышенный расход"],["Образование ADP","медленное","быстрое"],["Поток H⁺ через ATP-синтазу","малый","большой"],["|Δp|","высокая","немного ниже"],["Перенос электронов, потребление O₂","медленные","быстрые"],["Содержание ATP","исходное","может почти не измениться"]]},"2":{"n":{"syn":"on","chain":"on","dp":"base","cons":"hide","o2":"on"},"e":{"use":"hide","ret":"hide"},"t":{"adp":"ADP (добавлен)"},"m":[["Отношение дыхательного контроля","скорость в состоянии 3 / в состоянии 4"],["Чем выше отношение","тем сильнее дыхание сопряжено с синтезом ATP"]],"note":"В камере респирометра с изолированными митохондриями и субстратом добавляют порцию ADP: потребление O₂ резко ускоряется (состояние 3), а после превращения всего ADP в ATP снова замедляется (состояние 4). Отношение этих скоростей сравнивают только при одинаковом субстрате и протоколе.","tab":[["Этап эксперимента в камере респирометра","Скорость потребления O₂","Что происходит"],["Митохондрии и субстрат, ADP нет","низкая (состояние 4)","H⁺ возвращается только утечкой"],["Добавлен ADP","высокая (состояние 3)","ATP-синтаза использует Δp"],["ADP израсходован, превращён в ATP","снова низкая (состояние 4)","синтез ATP прекратился"]]}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"inhibition","number":5,"section":0,"title":"Чем блок ATP-синтазы отличается от блока дыхательной цепи","question":1,"questions":[1],"keywords":["олигомицин","ингибитор ATP-синтазы","ротенон","антимицин A","цианид","малонат","обращение ATP-синтазы","гидролиз ATP","деполяризация","гиперполяризация"],"lead":["[[T19|Олигомицин]] связывается с F₀ и прекращает поток H⁺ через ATP-синтазу. Ингибиторы дыхательной цепи действуют на другие мишени — на сами комплексы переноса электронов.","Какой поток останавливает олигомицин, зависит от исходного режима синтазы: синтеза ATP или его гидролиза."],"mechanism":["В прямом режиме олигомицин прекращает возврат H⁺ через ATP-синтазу; Δp возрастает и тормозит перенос H⁺ дыхательной цепью, поэтому дыхание замедляется.","Если дыхательная цепь остановлена, а ATP доступен, ATP-синтаза может гидролизовать ATP и выводить H⁺ из матрикса, поддерживая потенциал.","В этом режиме олигомицин прекращает обращённую работу синтазы, и потенциал падает: знак ответа на олигомицин определяется исходным режимом фермента."],"paragraphs":["Ингибиторы окислительного фосфорилирования различаются мишенями. Ротенон и пиерицидин A ингибируют комплекс I, малонат конкурирует с сукцинатом за активный центр комплекса II, антимицин A ингибирует комплекс III, цианид и азид — комплекс IV. Олигомицин связывается с F₀ ATP-синтазы и прекращает поток H⁺ через фермент; на перенос электронов он прямо не действует.","Рассмотрим сопряжённые митохондрии, которые активно синтезируют ATP. Олигомицин прекращает возврат H⁺ через ATP-синтазу, и синтез ATP останавливается. H⁺ продолжает выходить из матрикса, пока Δp не возрастёт настолько, что перенос H⁺ комплексами дыхательной цепи затормозится. Дыхание замедляется до уровня, который поддерживает [[T17|протонная утечка]]; мембрана немного гиперполяризуется.","Иная картина возникает, если дыхательная цепь остановлена, например ингибиторами комплексов I или III. Тогда ATP-синтаза может работать в обратную сторону: гидролизовать ATP и переносить H⁺ из матрикса, поддерживая пониженный мембранный потенциал. На изолированных митохондриях при остановленной цепи олигомицин вызывал немедленную деполяризацию — признак того, что синтаза работала в режиме гидролиза; ATP для этого в описанных условиях давало субстратное фосфорилирование в матриксе (Chinopoulos 2010).","Поэтому утверждение «олигомицин гиперполяризует митохондрии» верно только для исходного режима синтеза ATP. Одна проба с ингибитором показывает, какой поток зависел от мишени в данных условиях, но не устанавливает всю причинную цепочку."],"trap":["Олигомицин всегда вызывает деполяризацию.","В сопряжённых митохондриях, синтезирующих ATP, олигомицин прекращает возврат H⁺ через синтазу, и Δp обычно возрастает. Деполяризацию он вызывает, когда синтаза работала в обратном режиме — гидролизовала ATP при остановленной дыхательной цепи."],"conditions":"Схема механизма; изменения показаны качественно. Вопрос: изолированные сопряжённые митохондрии активно синтезируют ATP, субстраты и O₂ доступны, короткое воздействие олигомицина. Обращённый режим и деполяризация от олигомицина — изолированные митохондрии печени крысы с остановленной дыхательной цепью (ротенон, стигмателлин или KCN); ATP в матриксе давало субстратное фосфорилирование сукцинил-CoA-синтетазой (Chinopoulos 2010; контрольные эксперименты — митохондрии печени и сердца кролика). Небольшая гиперполяризация от олигомицина в клетках — Divakaruni 2014. Таблица мишеней — учебная сводка без доз.","sources":["Divakaruni2014","Chinopoulos2010"],"quiz":{"id":"S9-L05","rev":1,"question":"К активно фосфорилирующим сопряжённым митохондриям добавили олигомицин. Какое раннее сочетание изменений ожидается при достаточных субстратах и O₂?","options":[{"text":"Синтез ATP снижается, Δp обычно возрастает, дыхание замедляется.","correct":true,"feedback":"Блок F₀ ограничивает возврат H⁺ через ATP-синтазу. Возрастание Δp тормозит сопряжённый перенос электронов. Условие прямой работы фермента здесь существенно.","id":"S9-L05-2"},{"text":"Синтез ATP снижается, Δp обычно снижается, дыхание ускоряется.","correct":false,"feedback":"Такой ответ смешивает блок ATP-синтазы с разобщением. При блоке F₀ протонный градиент исходно обычно увеличивается.","id":"S9-L05-1"},{"text":"Синтез ATP возрастает, Δp обычно снижается, дыхание ускоряется.","correct":false,"feedback":"Олигомицин подавляет работу ATP-синтазы и не может объяснить ускорение синтеза ATP в заданном режиме.","id":"S9-L05-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Один блок F₀ прекращает разные потоки","status":"Схема механизма · качественные состояния","ctrls":[{"id":"r","type":"group","label":"Исходный режим","opts":["Цепь работает, синтаза синтезирует ATP","Цепь остановлена, синтаза гидролизует ATP"]},{"id":"o","type":"check","label":"Добавить олигомицин"}],"W":560,"H":330,"NW":560,"NH":330,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":168,"w":548,"h":156,"c":"mito","t":"матрикс","lx":14,"ly":318}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"chain":{"p":[140,150,150,58],"t":"дыхательная\nцепь","n":[140,150,150,58]},"syn":{"p":[410,150,140,46],"t":"ATP-синтаза","n":[410,150,140,46]},"oli":{"p":[410,58,130,34],"t":"олигомицин","n":[410,58,130,34],"fs":16},"atp":{"p":[480,262,64,34],"t":"ATP","n":[480,262,64,34]},"adp":{"p":[340,262,100,34],"t":"ADP + Pi","n":[340,262,100,34]}},"edges":{"hout":{"a":[220,216],"b":[220,50],"k":"tr","t":"H⁺","d":[14,0],"anc":"start"},"hin":{"a":[492,52],"b":[492,214],"k":"tr","t":"H⁺","d":[14,0],"anc":"start"},"hrev":{"a":[492,214],"b":[492,52],"k":"tr","t":"H⁺","d":[14,0],"anc":"start"},"mk":{"a":"adp","b":"atp","k":"rx","t":"синтез"},"hy":{"a":"atp","b":"adp","k":"rx","t":"гидролиз","d":[0,22]},"blk":{"a":"oli","b":"syn","k":"inh"}},"st":{"0-0":{"n":{"chain":"on","syn":"on","oli":"hide","atp":"on"},"e":{"hrev":"hide","hy":"hide","blk":"hide"},"m":[["Синтез ATP","идёт"],["|Δψm|","исходный"],["Потребление O₂","ATP-связанное + утечка"]],"note":"Цепь выводит H⁺, синтаза возвращает H⁺ в матрикс и синтезирует ATP."},"0-1":{"n":{"chain":"low","syn":"off","oli":"on"},"e":{"hin":"off","hrev":"hide","hy":"hide","mk":"off"},"m":[["Синтез ATP","прекращён"],["|Δψm|","немного выше"],["Потребление O₂","снижено до уровня утечки"]],"note":"Олигомицин прекращает возврат H⁺ через синтазу. Δp возрастает и тормозит перенос H⁺ дыхательной цепью: дыхание замедляется до уровня, который поддерживает протонная утечка."},"1-0":{"n":{"chain":"abs","syn":"on","oli":"hide","adp":"on"},"e":{"hout":"off","hin":"hide","mk":"hide","blk":"hide"},"m":[["Синтез ATP","нет, идёт гидролиз"],["|Δψm|","снижен, но поддерживается"],["Потребление O₂","нет (цепь остановлена)"]],"note":"Цепь остановлена. Синтаза гидролизует ATP и выводит H⁺ из матрикса, поддерживая пониженный мембранный потенциал."},"1-1":{"n":{"chain":"abs","syn":"off","oli":"on"},"e":{"hout":"off","hin":"hide","hrev":"off","mk":"hide","hy":"off"},"m":[["Гидролиз ATP синтазой","прекращён"],["|Δψm|","падает (деполяризация)"],["Потребление O₂","нет"]],"note":"Тот же олигомицин прекращает обращённую работу синтазы: H⁺ больше не выводится, и мембрана деполяризуется."}},"base":{"tab":[["Участок","Пример ингибитора","Что прекращается"],["Комплекс I","ротенон, пиерицидин A","окисление NADH"],["Комплекс II","малонат","окисление сукцината"],["Комплекс III","антимицин A","перенос электронов от Q к цит. c"],["Комплекс IV","цианид, азид","восстановление O₂"],["F₀ ATP-синтазы","олигомицин","поток H⁺ через синтазу в обе стороны"]]},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"uncoupling","number":6,"section":0,"title":"Как разобщение меняет дыхание, синтез ATP и образование тепла","question":1,"questions":[1],"keywords":["разобщение","разобщитель","FCCP","протонофор","UCP1","бурая жировая ткань","термогенез","протонная утечка","теплота","титрование"],"lead":["При [[T16|разобщении]] H⁺ возвращается в матрикс в обход ATP-синтазы. Перенос электронов продолжается и даже ускоряется, но всё меньшая часть его энергии используется для синтеза ATP.","Разобщение вызывают протонофоры, например [[T20|FCCP]], а в бурой жировой ткани — регулируемый белок [[T18|UCP1]]; энергия градиента рассеивается в виде теплоты."],"mechanism":["Протонофор или белок с протонной проводимостью создаёт путь возврата H⁺ в матрикс, не связанный с ATP-синтазой.","Δp снижается и меньше тормозит перенос H⁺ дыхательной цепью; при доступных субстратах и O₂ дыхание ускоряется.","Синтез ATP митохондриями снижается, а энергия окисления в большей степени рассеивается в виде теплоты."],"paragraphs":["Протонная утечка существует всегда: часть H⁺ возвращается в матрикс через внутреннюю мембрану без участия ATP-синтазы. В клетках её вклад определяют по дыханию, которое сохраняется после олигомицина. Разобщение — это усиление такого возврата H⁺, при котором сопряжение переноса электронов с синтезом ATP снижается.","FCCP — липофильная слабая кислота, протонофор. В протонированной форме она проходит через мембрану, в матриксе отдаёт H⁺ и в анионной форме возвращается обратно. Так FCCP переносит H⁺ в матрикс в обход синтазы. Δp снижается, торможение дыхательной цепи ослабевает, и при доступных субстратах и O₂ дыхание ускоряется. Синтез ATP митохондриями при этом снижается: Δp становится недостаточной для синтазы.","Ответ на FCCP зависит от дозы. Дозу подбирают титрованием: подобранная доза вызывает максимальное дыхание, а избыток разобщителя может снижать потребление O₂. Одна из возможных причин — уменьшение движущей силы для переноса анионных субстратов (пирувата, глутамата) в матрикс (Divakaruni 2014). Поэтому вывод о максимальной дыхательной способности делают только после титрования.","Физиологический пример — UCP1 во внутренней мембране бурых адипоцитов. При активации термогенеза (например, при охлаждении) UCP1 увеличивает протонную проводимость мембраны, и энергия окисления жирных кислот в большей степени выделяется в виде теплоты. UCP1 и FCCP приводят к сходному результату, но это разные молекулы: UCP1 — регулируемый белок определённых клеток, FCCP — синтетическое вещество, проходящее через любые мембраны."],"trap":["Быстрое потребление O₂ при разобщении означает высокий синтез ATP.","При разобщении дыхание ускоряется именно потому, что H⁺ возвращается в обход ATP-синтазы. Потребление O₂ растёт, а синтез ATP митохондриями снижается: энергия рассеивается в виде теплоты."],"conditions":"Схема механизма; уровни показаны качественно. Дыхательная цепь сохранна, субстраты и O₂ не лимитируют, доза FCCP подобрана титрованием; оценивается митохондриальный синтез ATP. Снижение дыхания при избытке протонофора и его возможные причины — Divakaruni 2014. UCP1 — бурые адипоциты при активации термогенеза (Chouchani 2019).","sources":["Divakaruni2014","Chouchani2019","B_LNR2"],"quiz":{"id":"S9-L06","rev":1,"question":"К митохондриям с сохранной цепью добавили подобранную дозу FCCP. Доступны субстраты и O₂. Как может измениться дыхание при снижении митохондриального синтеза ATP?","options":[{"text":"Дыхание обязательно прекращается, поскольку FCCP блокирует комплекс IV.","correct":false,"feedback":"FCCP не является специфическим ингибитором комплекса IV. Избыточные дозы могут снижать OCR, но это другой режим.","id":"S9-L06-1"},{"text":"Дыхание ускоряется, поскольку FCCP усиливает возврат H⁺ через ATP-синтазу.","correct":false,"feedback":"FCCP обеспечивает возврат H⁺ в обход ATP-синтазы. Именно рассеяние градиента уменьшает сопряжение с образованием ATP.","id":"S9-L06-2"},{"text":"Дыхание может ускориться, поскольку H⁺ возвращается в обход ATP-синтазы.","correct":true,"feedback":"Разобщитель рассеивает Δp и уменьшает ограничение переноса электронов. Энергия окисления в меньшей степени используется для синтеза ATP.","id":"S9-L06-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Путь H⁺ в обход ATP-синтазы","status":"Схема механизма · качественные состояния","ctrls":[{"id":"u","type":"group","label":"Состояние","opts":["Сопряжённое","FCCP: подобранная доза","FCCP: избыток","UCP1 бурого адипоцита"]}],"W":560,"H":330,"NW":560,"NH":330,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":168,"w":548,"h":156,"c":"mito","t":"матрикс","lx":14,"ly":318}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"chain":{"p":[110,150,140,58],"t":"дыхательная\nцепь","n":[110,150,140,58]},"syn":{"p":[300,150,134,46],"t":"ATP-синтаза","n":[300,150,134,46]},"unc":{"p":[470,150,110,44],"t":"FCCP","n":[470,150,110,44]},"atp":{"p":[300,262,64,34],"t":"ATP","n":[300,262,64,34]},"heat":{"p":[470,268,100,34],"t":"теплота","n":[470,268,100,34]}},"edges":{"hout":{"a":[186,216],"b":[186,50],"k":"tr","t":"H⁺","d":[14,0],"anc":"start"},"hsyn":{"a":[372,52],"b":[372,214],"k":"tr","t":"H⁺","d":[12,0],"anc":"start"},"hunc":{"a":[536,52],"b":[536,214],"k":"tr","t":"H⁺","d":[-12,0],"anc":"end"},"mk":{"a":"syn","b":"atp","k":"rx"},"ht":{"a":"unc","b":"heat","k":"rx","t":"рассеяние\nэнергии","d":[-70,0],"dash":true}},"st":{"0":{"n":{"chain":"base","syn":"on","unc":"hide","heat":"hide","atp":"on"},"e":{"hunc":"hide","ht":"hide"},"m":[["Потребление O₂","базальное"],["Синтез ATP","высокий"],["|Δp|","высокая"],["Рассеяние в виде теплоты","небольшое (утечка)"]],"note":"Большая часть H⁺ возвращается через ATP-синтазу; Δp высокая и ограничивает скорость дыхания."},"1":{"n":{"chain":"on","syn":"off","unc":"on","heat":"on","atp":"off"},"e":{"hsyn":"off","mk":"off"},"m":[["Потребление O₂","максимальное"],["Синтез ATP","снижен"],["|Δp|","снижена"],["Рассеяние в виде теплоты","большое"]],"note":"FCCP переносит H⁺ в матрикс в обход синтазы. Δp снижается, дыхание ускоряется до максимума, синтез ATP снижается, энергия рассеивается."},"2":{"n":{"chain":"low","syn":"off","unc":"on","heat":"base","atp":"off"},"e":{"hsyn":"off","mk":"off"},"m":[["Потребление O₂","ниже максимального"],["Синтез ATP","снижен"],["|Δp|","очень низкая"],["Рассеяние в виде теплоты","меньше, чем при подобранной дозе"]],"note":"Избыток FCCP может снижать дыхание; одна из возможных причин — меньшая движущая сила для переноса анионных субстратов в матрикс. Поэтому дозу подбирают титрованием."},"3":{"n":{"chain":"on","syn":"base","unc":"on","heat":"on","atp":"base"},"t":{"unc":"UCP1"},"m":[["Потребление O₂","повышено"],["Синтез ATP","снижен"],["|Δp|","снижена"],["Рассеяние в виде теплоты","большое (термогенез)"]],"note":"В бурых адипоцитах активированный UCP1 увеличивает протонную проводимость внутренней мембраны. Окисление ускоряется, и большая часть его энергии выделяется в виде теплоты."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"oxygen-profile","number":7,"section":0,"title":"Что можно установить по кривой потребления O₂","question":1,"questions":[1],"keywords":["OCR","потребление O₂","респирометрия","электрод Кларка","микропланшетная респирометрия","ATP-связанное дыхание","утечка","максимальное дыхание","резерв","немитохондриальное дыхание","нормировка"],"lead":["Респирометр регистрирует, как убывает концентрация O₂ в замкнутом объёме с клетками или митохондриями. Скорость потребления O₂ ([[T21|OCR]]) получают из наклона этой кривой.","Последовательное добавление олигомицина, FCCP и ингибиторов цепи разделяет OCR на части, но не измеряет синтез ATP напрямую."],"mechanism":["Датчик O₂ (электрод или оптический сенсор) регистрирует концентрацию O₂ во времени; OCR — скорость её снижения с учётом объёма и нормировки на число клеток или белок.","Олигомицин снижает OCR на величину ATP-связанного дыхания; подобранная доза FCCP показывает максимальное дыхание; ингибиторы комплексов I и III оставляют немитохондриальный остаток.","Одинаковый OCR возможен при разной доле утечки, поэтому скорость синтеза ATP по одному значению OCR не определяется."],"paragraphs":["В закрытой камере с электродом Кларка или в лунке микропланшетного анализатора клетки потребляют O₂, и его концентрация убывает. Датчик записывает концентрацию O₂ во времени, а OCR рассчитывают как скорость её снижения. Чтобы сравнивать образцы, OCR нормируют на число клеток, количество белка или ДНК: две лунки с разным числом одинаковых клеток дают разный сырой сигнал, но одинаковый нормированный.","Стандартный протокол включает последовательные добавки (Divakaruni 2014). Сначала регистрируют базальное дыхание. Олигомицин прекращает синтез ATP, и OCR снижается: разность оценивает ATP-связанное дыхание, а остаток — дыхание, связанное с протонной утечкой. Подобранная титрованием доза FCCP показывает максимальное дыхание; разность максимального и базального называют резервной дыхательной способностью. В конце добавляют ротенон и антимицин A: оставшееся потребление O₂ немитохондриальное, его вычитают из остальных величин.","У этих оценок есть границы. После олигомицина мембрана немного гиперполяризуется, и утечка возрастает, поэтому ATP-связанное дыхание немного недооценивается. Максимальное дыхание в интактной клетке может ограничиваться поступлением субстратов, а не мощностью цепи. Немитохондриальное потребление O₂ у разных клеток различно.","Главное ограничение: OCR — это поток O₂, а не скорость синтеза ATP. Одинаковый OCR в двух образцах возможен при разной доле утечки, и тогда митохондрии синтезируют ATP с разной скоростью. Для вывода о синтезе ATP нужны дополнительные измерения — ответ на олигомицин, принятое отношение P/O или независимое определение ATP."],"trap":["OCR непосредственно измеряет скорость синтеза ATP.","OCR измеряет скорость потребления O₂. Часть её поддерживает протонную утечку, часть может быть немитохондриальной. Скорость синтеза ATP оценивают по ответу на олигомицин и дополнительным измерениям."],"conditions":"Учебная модель: трасса O₂ и числа OCR — условные единицы, не данные эксперимента. Последовательность добавок и смысл каждой величины — по Divakaruni 2014 (микропланшетная респирометрия; в примере авторов — миобласты C2C12, олигомицин 2 мкг/мл, FCCP 800 нМ, ротенон 1 мкМ и антимицин A 2 мкМ). Нормировка показана на двух лунках с одинаковыми клетками и разным их числом.","sources":["Divakaruni2014"],"quiz":{"id":"S9-L07","rev":1,"question":"В двух образцах зарегистрировали одинаковую скорость потребления O₂. Достаточно ли этого, чтобы заключить, что митохондрии синтезируют ATP с одинаковой скоростью?","options":[{"text":"Недостаточно: одинаковое дыхание возможно при разной степени сопряжения.","correct":true,"feedback":"Часть дыхания может поддерживать протонную утечку; вклад немитохондриальных реакций также следует учитывать. Для оценки ATP нужны дополнительные измерения или обоснованный расчёт.","id":"S9-L07-1"},{"text":"Достаточно: каждому значению OCR соответствует одна скорость синтеза ATP.","correct":false,"feedback":"Постоянное соответствие OCR и синтеза ATP не выполняется при изменении сопряжения и субстратов.","id":"S9-L07-2"},{"text":"Достаточно, если среднее содержание ATP в клетках также одинаково.","correct":false,"feedback":"Содержание ATP зависит от его образования и расхода. Равенство содержания не устанавливает равенства скоростей синтеза.","id":"S9-L07-3"}]},"widget":{"kind":"ocr","title":"","s":{"title":"Концентрация O₂ и OCR при последовательных добавках","status":"Учебная модель · условные единицы","view_label":"Показать","views":["Концентрация O₂ во времени","Скорость OCR"],"well_label":"Лунка","wells":["10 тыс. клеток","20 тыс. тех же клеток"],"norm_label":"Нормировать OCR на 10 тыс. клеток","phases":["базальное","+ олигомицин","+ FCCP","+ рот./антим. A"],"ax_o2":"O₂ в камере, усл. ед.","ax_ocr":"OCR, усл. ед.","ax_t":"время","parts":{"atp":"ATP-связанное","leak":"утечка","max":"максимальное","res":"резерв","nm":"немитохондриальное"},"m_basal":"Базальное (митохондриальное)","m_atp":"ATP-связанное","m_leak":"Утечка","m_max":"Максимальное","m_res":"Резерв","m_nm":"Немитохондриальное","unit":"усл. ед.","lg_nm":"фиолетовый пунктир — немитохондриальный остаток (после ротенона и антимицина A)","note_o2":"Датчик записывает убывающую концентрацию O₂ в камере; по наклону кривой в каждом интервале рассчитывают OCR. После каждой добавки наклон меняется. Нормировка на число клеток применяется к OCR и вычисленным показателям и не меняет исходную запись O₂.","note_ocr":"Столбцы — OCR в каждом интервале. Разности между ними дают ATP-связанное дыхание, утечку, максимальное дыхание и резерв; немитохондриальный остаток вычитают.","note_raw":"Сырой сигнал лунки с вдвое большим числом клеток вдвое больше: без нормировки образцы сравнивать нельзя.","note_norm":"После нормировки OCR на число клеток обе лунки дают одинаковые значения показателей; запись O₂ в камере от нормировки не меняется.","fixed":"Условные значения на 10 тыс. клеток: базальное 100, после олигомицина 35, после FCCP 220, после ротенона и антимицина A 10."}}},{"id":"membrane-potential","number":8,"section":1,"title":"Что означает мембранный потенциал и его модуль","question":2,"questions":[2],"keywords":["мембранный потенциал","Δψm","модуль потенциала","деполяризация","гиперполяризация","знак потенциала","мВ","ΔpH","протондвижущая сила"],"lead":["[[T23|Мембранный потенциал Δψm]] — электрическая составляющая протондвижущей силы. Его записывают со знаком: потенциал матрикса относительно межмембранного пространства отрицателен.","Поэтому изменение с −160 до −100 мВ — это уменьшение модуля потенциала, то есть деполяризация, хотя число стало больше."],"mechanism":["Знак Δψm задан выбором точки отсчёта: Δψm = ψматрикса − ψмежмембранного пространства; в работающей митохондрии матрикс заряжен отрицательно.","[[T24|Модуль |Δψm|]] показывает величину разности потенциалов; [[T25|деполяризация]] — уменьшение модуля, [[T26|гиперполяризация]] — его увеличение.","Δψm — только часть протондвижущей силы: ΔpH изменяется отдельно, поэтому значение потенциала не определяет скорость всех процессов, зависящих от градиента."],"paragraphs":["Разность потенциалов на мембране всегда указывают относительно выбранной стороны. Для митохондрий принято записывать потенциал матрикса относительно межмембранного пространства: Δψm = ψматрикса − ψмежмембранного пространства. Поскольку дыхательная цепь выводит положительно заряженные H⁺ из матрикса, матрикс заряжен отрицательно, и Δψm в работающей митохондрии — отрицательное число. В культивируемых клетках его оценивают примерно от −120 до −160 мВ; в работе Gerencser 2012 для нейронов коры крысы в культуре получено около −139 мВ в покое.","С отрицательными числами легко ошибиться. Переход от −160 к −100 мВ — это увеличение числа, но уменьшение модуля со 160 до 100 мВ: электрическая составляющая ослабла. Такое изменение называют деполяризацией. Обратное изменение, например от −140 к −170 мВ, увеличивает модуль и называется гиперполяризацией. Деполяризация не означает обязательного исчезновения потенциала: при −100 мВ матрикс остаётся заряженным отрицательно.","Чтобы не путаться в знаках, на неотрицательных шкалах пишут «модуль потенциала |Δψm|, мВ». Тогда деполяризация выглядит как укорочение столбца, а гиперполяризация — как его удлинение.","Мембранный потенциал — не вся протондвижущая сила. Химическая составляющая ΔpH может изменяться независимо: например, перенос ионов через мембрану способен перераспределять энергию градиента между двумя составляющими. Разные процессы используют разные составляющие (это предмет следующего шага), поэтому по одному значению Δψm нельзя определить скорость синтеза ATP, импорта или транспорта."],"trap":["При переходе от −160 к −100 мВ потенциал становится сильнее, потому что число возрастает.","Число возрастает, но модуль уменьшается со 160 до 100 мВ: разность потенциалов становится меньше. Это деполяризация. Сравнивать нужно модули, а знак показывает, какая сторона мембраны заряжена отрицательно."],"conditions":"Схема механизма с заданными учебными значениями −160, −100, −140 и −170 мВ; они не измерены в конкретной клетке. Знак определяется относительно межмембранного пространства. Пример измеренного значения: около −139 мВ в покое — нейроны коры крысы в культуре, расчёт по распределению TMRM с калибровкой (Gerencser 2012).","sources":["Gerencser2012","Nicholls2013","B_ALB2"],"quiz":{"id":"S9-L08","rev":1,"question":"Потенциал матрикса относительно межмембранного пространства изменился с −160 до −100 мВ. Как называется это изменение?","options":[{"text":"Деполяризация: модуль потенциала уменьшился со 160 до 100 мВ.","correct":true,"feedback":"Матрикс остаётся отрицательным, но электрическая составляющая градиента ослабла. Это деполяризация.","id":"S9-L08-2"},{"text":"Полная потеря потенциала: разность потенциалов стала равной нулю.","correct":false,"feedback":"Разность потенциалов −100 мВ сохраняется; деполяризация не обязательно означает её полное исчезновение.","id":"S9-L08-1"},{"text":"Гиперполяризация: модуль потенциала увеличился на 60 мВ.","correct":false,"feedback":"Алгебраическое увеличение отрицательного числа не означает увеличения его модуля.","id":"S9-L08-3"}]},"widget":{"kind":"dpsi","title":"","s":{"title":"Знак потенциала и его модуль","status":"Схема механизма · заданные учебные значения","pair_label":"Пара состояний","pairs":["−160 → −100 мВ","−140 → −170 мВ"],"when_label":"Состояние","whens":["До изменения","После изменения"],"vals":[[-160,-100],[-140,-170]],"ax_signed":"Δψm со знаком, мВ (матрикс относительно межмембранного пространства)","ax_mod":"|Δψm|, мВ","ims":"межмембранное пространство","matrix":"матрикс","m_signed":"Δψm","m_mod":"|Δψm|","m_kind":"Изменение","kinds":["деполяризация","гиперполяризация","—"],"unit":"мВ","notes":{"dep":"Число увеличилось с −160 до −100 мВ, но модуль уменьшился со 160 до 100 мВ: это деполяризация. Матрикс по-прежнему заряжен отрицательно.","hyp":"Число уменьшилось с −140 до −170 мВ, а модуль увеличился со 140 до 170 мВ: это гиперполяризация.","before":"Исходное состояние: выберите «После изменения», чтобы сравнить модули."},"dph":"ΔpH изменяется отдельно и на этой схеме не показан."}}},{"id":"nucleotide-phosphate","number":9,"section":1,"title":"Почему ANT и PiC используют разные составляющие градиента","question":2,"questions":[2],"keywords":["ANT","ADP/ATP-переносчик","транслоказа адениновых нуклеотидов","PiC","фосфатный переносчик","электрогенный обмен","электронейтральный перенос","ATP⁴⁻","ADP³⁻"],"lead":["Для синтеза ATP в матриксе нужны ADP и Pi, а готовый ATP должен выйти в цитозоль. Эти потоки обеспечивают два переносчика внутренней мембраны.","[[T27|ANT]] обменивает ATP⁴⁻ на ADP³⁻ и поэтому использует мембранный потенциал; [[T28|PiC]] переносит фосфат вместе с H⁺ без переноса заряда и использует ΔpH."],"mechanism":["ANT выводит из матрикса ATP⁴⁻ в обмен на ADP³⁻: за один цикл наружу переносится один отрицательный заряд, поэтому обмен электрогенен.","Отрицательный потенциал матрикса способствует выходу более отрицательно заряженного ATP⁴⁻ и входу ADP³⁻.","PiC переносит H₂PO₄⁻ вместе с H⁺ (или в обмен на OH⁻); суммарный заряд не переносится, и движущей силой служит ΔpH."],"paragraphs":["ATP образуется в матриксе, а расходуется в основном в цитозоле. Внутренняя мембрана для нуклеотидов непроницаема, поэтому обмен ATP на ADP осуществляет специальный переносчик — ANT (ADP/ATP-переносчик, транслоказа адениновых нуклеотидов). При физиологических значениях pH и с учётом связывания Mg²⁺ переносятся свободные формы ATP⁴⁻ и ADP³⁻. Обмен строго один на один: на каждую выведенную молекулу ATP в матрикс входит одна молекула ADP.","Поскольку ATP⁴⁻ несёт на один отрицательный заряд больше, чем ADP³⁻, каждый цикл переносит из матрикса один отрицательный заряд. Такой обмен называют электрогенным. Отрицательный потенциал матрикса способствует выходу ATP⁴⁻ и входу ADP³⁻, поэтому ANT использует электрическую составляющую градиента. Благодаря этому отношение ATP к ADP в цитозоле поддерживается выше, чем в матриксе.","Неорганический фосфат входит в матрикс через фосфатный переносчик PiC. В принятой схеме он переносит H₂PO₄⁻ вместе с H⁺; суммарный заряд при этом не переносится, и такой перенос электронейтрален. Его движущей силой служит ΔpH: более щелочной матрикс способствует входу H⁺ вместе с фосфатом. Механизм сопряжения с H⁺ изучен, в частности, на реконструированном переносчике дрожжей (Phelps 1996).","Вместе эти переносы расходуют часть протондвижущей силы — примерно один H⁺ на молекулу ATP. Поэтому на синтез одного ATP, доставленного в цитозоль, приходится около 2,7 H⁺ через ATP-синтазу и ещё около одного H⁺ на транспорт (см. шаг об ATP-синтазе). Механистический расчёт для кольца c₈ даёт около 2,7 ATP на NADH и 1,6 на сукцинат; измеренные значения P/O (около 2,5 и 1,5) ниже из-за протонной утечки и условий эксперимента (Hinkle 2005). Электрическая и химическая составляющие связаны, но на эти два переносчика они действуют по-разному."],"trap":["Любой транспорт через внутреннюю мембрану непосредственно определяется только Δψm.","Электрогенный обмен ANT зависит от мембранного потенциала, а электронейтральный перенос фосфата через PiC — от ΔpH. Поэтому по одному Δψm нельзя судить обо всех транспортных процессах."],"conditions":"Схема механизма; показан обычный режим обмена при синтезе ATP. Электрогенность обмена ATP⁴⁻/ADP³⁻ — Klingenberg 2008; электронейтральный H⁺-сопряжённый перенос фосфата — реконструированный переносчик дрожжей (Phelps 1996); для человека механизм принят по аналогии. Режимы обращения ANT при деполяризации рассматривает Chinopoulos 2010.","sources":["Klingenberg2008","Phelps1996","Chinopoulos2010","B_LNR2"],"quiz":{"id":"S9-L09","rev":1,"question":"Какое описание различия ANT и фосфатного переносчика PiC соответствует их транспортным механизмам?","options":[{"text":"Обмен ANT электронейтрален; перенос Pi через PiC создаёт электрический ток.","correct":false,"feedback":"Различие зарядов ATP⁴⁻ и ADP³⁻ делает обмен ANT электрогенным. PiC непосредственно не переносит суммарный заряд в этой схеме.","id":"S9-L09-1"},{"text":"Обмен ANT электрогенен; перенос Pi через PiC электронейтрален и связан с ΔpH.","correct":true,"feedback":"ANT переносит нуклеотиды с различным зарядом. Для PiC важен протон-сопряжённый электронейтральный перенос фосфата.","id":"S9-L09-3"},{"text":"Оба переносчика осуществляют один и тот же электрогенный обмен ATP на ADP.","correct":false,"feedback":"PiC переносит неорганический фосфат, а не адениновые нуклеотиды.","id":"S9-L09-2"}]},"widget":{"kind":"net","title":"","s":{"title":"Электрогенный обмен ANT и электронейтральный перенос фосфата","status":"Схема механизма · качественные состояния","ctrls":[{"id":"t","type":"group","label":"Переносчик","opts":["ANT","PiC"]},{"id":"v","type":"group","label":"Показать","opts":["Вещества","Суммарный заряд"]}],"W":560,"H":330,"NW":560,"NH":330,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":168,"w":548,"h":156,"c":"mito","t":"матрикс","lx":14,"ly":318}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"ant":{"p":[170,150,100,50],"t":"ANT","n":[170,150,100,50],"fs":19},"pic":{"p":[420,150,100,50],"t":"PiC","n":[420,150,100,50],"fs":19}},"edges":{"atp":{"a":[120,228],"b":[120,52],"k":"tr","t":"ATP⁴⁻","d":[-12,0],"anc":"end"},"adp":{"a":[220,52],"b":[220,228],"k":"tr","t":"ADP³⁻","d":[12,0],"anc":"start"},"pi":{"a":[390,52],"b":[390,228],"k":"tr","t":"H₂PO₄⁻","d":[-12,0],"anc":"end"},"h":{"a":[450,52],"b":[450,228],"k":"tr","t":"H⁺","d":[12,0],"anc":"start"}},"st":{"0-0":{"n":{"ant":"on","pic":"off"},"e":{"pi":"off","h":"off"},"m":[["Что переносится","ATP⁴⁻ наружу, ADP³⁻ внутрь"],["Движущая сила","Δψm"]],"note":"ANT обменивает ATP⁴⁻ из матрикса на ADP³⁻ из межмембранного пространства, строго один на один."},"0-1":{"n":{"ant":"on","pic":"off"},"e":{"pi":"off","h":"off"},"m":[["Заряд за цикл","−4 наружу, −3 внутрь: −1 наружу"],["Тип переноса","электрогенный"]],"note":"За цикл из матрикса выходит на один отрицательный заряд больше, чем входит. Отрицательный потенциал матрикса способствует такому обмену."},"1-0":{"n":{"ant":"off","pic":"on"},"e":{"atp":"off","adp":"off"},"m":[["Что переносится","H₂PO₄⁻ и H⁺ в матрикс"],["Движущая сила","ΔpH"]],"note":"PiC переносит фосфат в матрикс вместе с H⁺. Более высокий pH матрикса способствует этому переносу."},"1-1":{"n":{"ant":"off","pic":"on"},"e":{"atp":"off","adp":"off"},"m":[["Заряд за цикл","−1 и +1 в одну сторону: 0"],["Тип переноса","электронейтральный"]],"note":"Отрицательный заряд фосфата и положительный заряд H⁺ переносятся вместе: суммарный заряд не переносится, и Δψm на этот перенос прямо не действует."}},"notes_svg":[{"t":"+  +  +","x":300,"y":70,"a":"middle","only":["0-0","0-1"]},{"t":"−  −  −","x":300,"y":240,"a":"middle","only":["0-0","0-1"]},{"t":"[H⁺] выше","x":300,"y":70,"a":"middle","only":["1-0","1-1"],"c":"#7a3d00","b":true},{"t":"[H⁺] ниже","x":300,"y":240,"a":"middle","only":["1-0","1-1"],"c":"#7a3d00","b":true},{"t":"итог: −1 заряд наружу","x":170,"y":290,"a":"middle","only":["0-1"],"c":"#ae3347","b":true},{"t":"итог: заряд 0","x":420,"y":290,"a":"middle","only":["1-1"],"c":"#145c96","b":true}],"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"presequence-import","number":10,"section":1,"title":"Почему импорт в матрикс требует потенциала и ATP","question":2,"questions":[2],"keywords":["импорт белков","TOM","TIM23","PAM","mtHsp70","Tim17","сигнальная последовательность","предшественник","MPP","мембранный потенциал","ATP"],"lead":["Большинство белков матрикса синтезируются в цитозоле в виде [[T29|предшественников]] с положительно заряженной [[T30|N-концевой сигнальной последовательностью]].","Их перенос в матрикс требует двух разных источников энергии: Δψm для начального перемещения сигнала через внутреннюю мембрану и ATP для работы матричного мотора."],"mechanism":["Предшественник проходит через наружную мембрану по каналу [[T31|TOM]], затем сигнальная последовательность входит в транслоказу внутренней мембраны [[T32|TIM23]].","Отрицательный потенциал матрикса электрофоретически перемещает положительно заряженную сигнальную последовательность через внутреннюю мембрану.","Матричный мотор [[T33|PAM]] с ATPазой mtHsp70 протягивает остальную цепь в матрикс; протеаза MPP отщепляет сигнальную последовательность."],"paragraphs":["Митохондрия содержит более тысячи разных белков, и подавляющее большинство из них кодирует ядро. Белки матрикса синтезируются на рибосомах цитозоля в виде предшественников, у которых на N-конце есть сигнальная последовательность длиной обычно 15–50 аминокислотных остатков. Она образует амфипатическую спираль с несколькими положительно заряженными остатками и узнаётся рецепторами комплекса TOM наружной мембраны.","Через канал TOM предшественник попадает в межмембранное пространство и связывается с транслоказой внутренней мембраны TIM23. Название транслоказы дано по одной из её субъединиц, Tim23, но в экспериментах на дрожжах путь, по которому проходит цепь, связан прежде всего с субъединицей Tim17 (Fielden 2023; Sim 2023). Дальнейшее перемещение сигнальной последовательности через внутреннюю мембрану требует мембранного потенциала: отрицательно заряженный матрикс притягивает положительно заряженный N-конец (Martin 1991).","Одного потенциала недостаточно для переноса всего белка. В матриксе к входящей цепи присоединяется mtHsp70 — шаперон с ATPазной активностью, главный компонент импортного мотора PAM. Циклы связывания и гидролиза ATP позволяют mtHsp70 удерживать и протягивать цепь в матрикс. Другие компоненты мотора выполняют иные функции: Tim44 связывает mtHsp70 с транслоказой, а Pam18 стимулирует его ATPазную активность. После входа в матрикс протеаза MPP отщепляет сигнальную последовательность, и белок сворачивается в зрелую форму.","Поэтому нарушение импорта может иметь разные причины: при деполяризации задерживается начальный перенос сигнала, а при недостатке ATP в матриксе — дальнейшее протягивание цепи. Сохранённый потенциал не гарантирует завершения импорта. Зависимость импорта от потенциала используется и для контроля качества: киназа [[T37|PINK1]] в здоровой митохондрии импортируется и расщепляется, а при деполяризации накапливается на наружной мембране (подробнее — в семинаре 12)."],"trap":["Если потенциал сохранён, ATP для полного импорта не нужен.","Δψm перемещает через внутреннюю мембрану только положительно заряженную сигнальную последовательность. Протягивание остальной цепи обеспечивает ATP-зависимый мотор PAM с mtHsp70, поэтому без ATP в матриксе импорт не завершается."],"conditions":"Схема механизма; четыре сочетания условий показаны качественно. Белок с N-концевой сигнальной последовательностью, путь в матрикс; не все митохондриальные белки используют этот путь. Требование Δψm для переноса сигнальной последовательности — изолированные митохондрии Neurospora crassa и дрожжей (Martin 1991). Роль Tim17 в пути транслокации — структурные и функциональные данные на дрожжах (Fielden 2023; Sim 2023); для человека схема принята по гомологии.","sources":["Martin1991","Fielden2023","Sim2023","Wiedemann2017","B_ALB2"],"quiz":{"id":"S9-L10","rev":1,"question":"У предшественника есть положительно заряженная N-концевая сигнальная последовательность. Δψm сохранён, но ATP для матричного мотора PAM недостаточно. Гарантирован ли полный импорт белка в матрикс?","options":[{"text":"Нет: потенциал и ATP-зависимый цикл mtHsp70 выполняют разные функции.","correct":true,"feedback":"Δψm способствует раннему переносу сигнальной последовательности, а ATP-зависимый мотор поддерживает последующие стадии транслокации.","id":"S9-L10-1"},{"text":"Да: электрическое поле полностью заменяет работу матричных шаперонов.","correct":false,"feedback":"Электрический вклад не заменяет ATP-зависимые циклы моторного комплекса.","id":"S9-L10-2"},{"text":"Да: ATP нужен только для синтеза предшественника в цитозоле.","correct":false,"feedback":"Помимо синтеза предшественника, ATP требуется для работы матричного импортного мотора. Сохранение Δψm не устраняет эту потребность.","id":"S9-L10-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Импорт в матрикс: потенциал и ATP выполняют разные функции","status":"Схема механизма · качественные состояния","ctrls":[{"id":"p","type":"check","label":"Δψm сохранён","def":true},{"id":"a","type":"check","label":"ATP в матриксе достаточно","def":true}],"W":560,"H":420,"NW":560,"NH":420,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":84,"c":"cyto","t":"цитозоль","lx":14,"ly":26},{"x":6,"y":112,"w":548,"h":92,"c":"plain","t":"межмембранное пространство","lx":14,"ly":132},{"x":6,"y":228,"w":548,"h":186,"c":"mito","t":"матрикс","lx":14,"ly":404}],"mem":[{"x1":6,"y1":100,"x2":554,"y2":100},{"x1":6,"y1":216,"x2":554,"y2":216}],"nodes":{"pre":{"p":[300,46,170,48],"t":"предшественник\n+ + + N-конец","n":[300,46,170,48],"fs":16},"tom":{"p":[300,100,90,40],"t":"TOM","n":[300,100,90,40],"fs":18},"tim":{"p":[300,216,100,40],"t":"TIM23","n":[300,216,100,40],"fs":18},"pam":{"p":[300,300,160,40],"t":"PAM: mtHsp70","n":[300,300,160,40],"fs":17},"mpp":{"p":[130,370,150,36],"t":"протеаза MPP","n":[130,370,150,36],"fs":16},"mat":{"p":[440,370,150,36],"t":"зрелый белок","n":[440,370,150,36],"fs":16},"dpsi":{"p":[480,216,70,36],"t":"Δψm","n":[480,216,70,36],"fs":17},"atp":{"p":[480,300,64,34],"t":"ATP","n":[480,300,64,34]}},"edges":{"s1":{"a":"pre","b":"tom","k":"seq"},"s2":{"a":"tom","b":"tim","k":"seq","t":"сигнальная\nпоследовательность","d":[-80,0]},"s3":{"a":"tim","b":"pam","k":"seq"},"s4":{"a":"pam","b":"mpp","k":"seq"},"s5":{"a":"mpp","b":"mat","k":"seq","t":"отщепление\nсигнала","d":[0,-16]},"f1":{"a":"dpsi","b":"tim","k":"act"},"f2":{"a":"atp","b":"pam","k":"act"}},"st":{"1-1":{"n":{"pre":"base","tom":"on","tim":"on","pam":"on","mpp":"on","mat":"on","dpsi":"on","atp":"on"},"m":[["Перенос сигнала через TIM23","идёт"],["Протягивание цепи мотором","идёт"],["Зрелый белок в матриксе","образуется"]],"note":"Оба условия выполнены: потенциал перемещает сигнальную последовательность, мотор PAM протягивает цепь, MPP отщепляет сигнал."},"1-0":{"n":{"pre":"base","tom":"on","tim":"on","pam":"off","mpp":"off","mat":"off","dpsi":"on","atp":"off"},"e":{"s4":"off","s5":"off","f2":"off"},"m":[["Перенос сигнала через TIM23","начинается"],["Протягивание цепи мотором","нарушено"],["Зрелый белок в матриксе","не образуется"]],"note":"Потенциал сохранён, и сигнальная последовательность входит в TIM23. Без ATP mtHsp70 не протягивает остальную цепь, и импорт не завершается."},"0-1":{"n":{"pre":"on","tom":"base","tim":"off","pam":"base","mpp":"off","mat":"off","dpsi":"off","atp":"on"},"e":{"s2":"off","s3":"off","s4":"off","s5":"off","f1":"off"},"m":[["Перенос сигнала через TIM23","не идёт"],["Протягивание цепи мотором","не начинается"],["Зрелый белок в матриксе","не образуется"]],"note":"Без потенциала сигнальная последовательность не перемещается через внутреннюю мембрану. ATP в матриксе есть, но цепь не достигает мотора, и протягивание не начинается."},"0-0":{"n":{"pre":"on","tom":"base","tim":"off","pam":"off","mpp":"off","mat":"off","dpsi":"off","atp":"off"},"e":{"s2":"off","s3":"off","s4":"off","s5":"off","f1":"off","f2":"off"},"m":[["Перенос сигнала через TIM23","не идёт"],["Протягивание цепи мотором","нарушено"],["Зрелый белок в матриксе","не образуется"]],"note":"Нет ни потенциала, ни ATP: импорт останавливается на ранней стадии."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"import-routes","number":11,"section":1,"title":"Почему у митохондриальных белков несколько путей импорта","question":2,"questions":[2],"keywords":["пути импорта","TIM22","TIM23","OXA1L","SAM","MIA","малые TIM","переносчики SLC25","β-бочонок","миторибосома","встраивание в мембрану"],"lead":["Митохондриальные белки направляются в четыре компартмента: наружную мембрану, межмембранное пространство, внутреннюю мембрану и матрикс. Для этого существуют разные пути импорта.","Большинство путей начинается с канала TOM, а дальше белки распределяются по адресу, который определяют сигналы в их последовательности."],"mechanism":["Белки матрикса с N-концевой сигнальной последовательностью идут через TOM и TIM23 и протягиваются мотором PAM.","Переносчики внутренней мембраны семейства SLC25 (например, ANT) имеют внутренние сигналы: после TOM их ведут малые белки TIM межмембранного пространства к транслоказе [[T34|TIM22]].","Белки, синтезированные на миторибосомах, встраиваются во внутреннюю мембрану со стороны матрикса инсертазой [[T35|OXA1L]]; β-бочонки наружной мембраны встраивает SAM, а белки межмембранного пространства с остатками цистеина удерживает система MIA."],"paragraphs":["Путь TOM–TIM23–PAM, описанный в предыдущем шаге, — основной, но не единственный. Адрес белка определяют сигналы в его последовательности: отщепляемая N-концевая последовательность, внутренние сигналы, мотивы остатков цистеина или особенности β-бочонка. Почти все ядерно кодируемые белки проходят через канал TOM, а после него пути расходятся.","Переносчики внутренней мембраны семейства SLC25 — ANT, фосфатный переносчик и другие — не имеют отщепляемой сигнальной последовательности. После TOM их гидрофобные участки связывают малые белки TIM межмембранного пространства, которые предохраняют их от агрегации и передают транслоказе TIM22. TIM22 встраивает переносчик во внутреннюю мембрану; этот этап тоже зависит от мембранного потенциала.","Белки наружной мембраны со структурой β-бочонка (например, VDAC и сам Tom40) после TOM возвращаются к наружной мембране и встраиваются комплексом SAM. Небольшие белки межмембранного пространства с остатками цистеина удерживаются там системой MIA, которая образует в них дисульфидные связи. Белки, кодируемые мтДНК, синтезируются на миторибосомах в матриксе и встраиваются во внутреннюю мембрану инсертазой OXA1L; миторибосома связана с мембраной, и встраивание идёт одновременно с синтезом.","Поэтому нарушение одного пути не обязательно нарушает все остальные. Основная схема здесь дана для митохондрий человека; многие молекулярные детали установлены на дрожжах, и названия субъединиц у человека могут отличаться."],"trap":["Каждый белок митохондрии проходит через TOM и TIM23 в матрикс.","TIM23 — путь белков с N-концевой сигнальной последовательностью. Переносчики внутренней мембраны встраиваются через TIM22, β-бочонки наружной мембраны — через SAM, белки межмембранного пространства удерживает MIA, а белки, синтезированные в митохондрии, встраивает OXA1L."],"conditions":"Карта путей — схема механизма для митохондрий человека; молекулярные детали получены преимущественно на дрожжах и отделены от схемы человека (Wiedemann 2017; Fielden 2023; Sim 2023). Энергетическая зависимость указана только там, где она обсуждается в тексте.","sources":["Wiedemann2017","Fielden2023","Sim2023","B_ALB2"],"quiz":{"id":"S9-L11","rev":1,"question":"Ядерно кодируемый переносчик семейства SLC25, например ANT, использует внутренние адресующие сигналы. Какой комплекс прежде всего рассматривают для его встраивания во внутреннюю мембрану после прохождения через TOM?","options":[{"text":"Инсертазу OXA1L, участвующую во встраивании с матричной стороны.","correct":false,"feedback":"OXA1L участвует во встраивании с матричной стороны, в частности белков, синтезированных в митохондриях. Для указанного импортируемого переносчика классический путь связан с TIM22.","id":"S9-L11-1"},{"text":"Комплекс SAM наружной мембраны.","correct":false,"feedback":"SAM участвует в сборке β-бочонковых белков наружной мембраны и не является основным ответом для данного груза.","id":"S9-L11-3"},{"text":"Транслоказу TIM22 внутренней мембраны.","correct":true,"feedback":"Классический путь митохондриальных переносчиков связан с TIM22; его следует отличать от пути N-концевых сигнальных последовательностей через TIM23.","id":"S9-L11-2"}]},"widget":{"kind":"net","title":"","s":{"title":"Адрес белка определяет путь импорта","status":"Схема механизма · качественные состояния","ctrls":[{"id":"g","type":"group","label":"Тип белка и его адрес","opts":["Матрикс: N-концевой сигнал","Переносчик SLC25 (ANT)","β-бочонок наружной мембраны","Белок межмембранного пространства","Белок, кодируемый мтДНК"]}],"W":560,"H":390,"NW":560,"NH":390,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":72,"c":"cyto","t":"цитозоль","lx":14,"ly":26},{"x":6,"y":100,"w":548,"h":110,"c":"plain","t":"межмембранное пространство","lx":14,"ly":120},{"x":6,"y":234,"w":548,"h":146,"c":"mito","t":"матрикс","lx":14,"ly":370}],"mem":[{"x1":6,"y1":88,"x2":554,"y2":88},{"x1":6,"y1":222,"x2":554,"y2":222}],"nodes":{"tom":{"p":[170,88,90,38],"t":"TOM","n":[170,88,90,38],"fs":18},"sam":{"p":[440,88,80,38],"t":"SAM","n":[440,88,80,38],"fs":18},"mia":{"p":[300,160,76,36],"t":"MIA","n":[300,160,76,36],"fs":17},"stim":{"p":[440,160,120,34],"t":"малые TIM","n":[440,160,120,34],"fs":16},"tim23":{"p":[110,222,140,38],"t":"TIM23–PAM","n":[110,222,140,38],"fs":17},"tim22":{"p":[440,222,96,38],"t":"TIM22","n":[440,222,96,38],"fs":17},"oxa":{"p":[300,222,96,38],"t":"OXA1L","n":[300,222,96,38],"fs":17},"rib":{"p":[300,310,150,36],"t":"миторибосома","n":[300,310,150,36],"fs":16},"mat":{"p":[110,310,160,36],"t":"белок матрикса","n":[110,310,160,36],"fs":16}},"edges":{"a1":{"a":"tom","b":"tim23","k":"seq"},"a2":{"a":"tim23","b":"mat","k":"seq"},"b1":{"a":"tom","b":"stim","k":"seq","bend":-30},"b2":{"a":"stim","b":"tim22","k":"seq"},"c1":{"a":"stim","b":"sam","k":"seq"},"d1":{"a":"tom","b":"mia","k":"seq"},"e1":{"a":"rib","b":"oxa","k":"seq"}},"st":{"0":{"n":{"tom":"on","sam":"base","mia":"base","stim":"base","tim23":"on","tim22":"base","oxa":"base","rib":"base","mat":"on"},"e":{"a1":"on","a2":"on","b1":"hide","b2":"hide","c1":"hide","d1":"hide","e1":"hide"},"m":[["Путь","TOM → TIM23 → PAM"],["Куда","в матрикс"]],"note":"Белок с N-концевой сигнальной последовательностью проходит через TOM и TIM23; мотор PAM протягивает его в матрикс."},"1":{"n":{"tom":"on","sam":"base","mia":"base","stim":"on","tim23":"base","tim22":"on","oxa":"base","rib":"base","mat":"base"},"e":{"a1":"hide","a2":"hide","b1":"on","b2":"on","c1":"hide","d1":"hide","e1":"hide"},"m":[["Путь","TOM → малые TIM → TIM22"],["Куда","во внутреннюю мембрану"]],"note":"Переносчик с внутренними сигналами после TOM связывается с малыми белками TIM и встраивается во внутреннюю мембрану транслоказой TIM22."},"2":{"n":{"tom":"on","sam":"on","mia":"base","stim":"on","tim23":"base","tim22":"base","oxa":"base","rib":"base","mat":"base"},"e":{"a1":"hide","a2":"hide","b1":"on","b2":"hide","c1":"on","d1":"hide","e1":"hide"},"m":[["Путь","TOM → малые TIM → SAM"],["Куда","в наружную мембрану"]],"note":"β-бочонок после TOM возвращается к наружной мембране и встраивается комплексом SAM."},"3":{"n":{"tom":"on","sam":"base","mia":"on","stim":"base","tim23":"base","tim22":"base","oxa":"base","rib":"base","mat":"base"},"e":{"a1":"hide","a2":"hide","b1":"hide","b2":"hide","c1":"hide","d1":"on","e1":"hide"},"m":[["Путь","TOM → MIA"],["Куда","в межмембранное пространство"]],"note":"Небольшой белок с остатками цистеина после TOM удерживается в межмембранном пространстве системой MIA."},"4":{"n":{"tom":"base","sam":"base","mia":"base","stim":"base","tim23":"base","tim22":"base","oxa":"on","rib":"on","mat":"base"},"e":{"a1":"hide","a2":"hide","b1":"hide","b2":"hide","c1":"hide","d1":"hide","e1":"on"},"m":[["Путь","миторибосома → OXA1L"],["Куда","во внутреннюю мембрану со стороны матрикса"]],"note":"Белок, кодируемый мтДНК, синтезируется на миторибосоме и встраивается во внутреннюю мембрану инсертазой OXA1L; TOM он не проходит."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"calcium-entry","number":12,"section":1,"title":"Как потенциал способствует поступлению Ca²⁺ через MCU","question":2,"questions":[2],"keywords":["MCU","унипортер","вход Ca²⁺","электрохимическая движущая сила","мембранный потенциал","канал","Ru360","электрогенный перенос"],"lead":["Ca²⁺ входит в матрикс через [[T44|MCU]] — высокоизбирательный ионный канал внутренней мембраны. Энергию для этого переноса поставляет электрохимический градиент Ca²⁺, а не гидролиз ATP.","Отрицательный потенциал матрикса притягивает двухзарядный катион, поэтому при деполяризации электрическая составляющая движущей силы ослабевает."],"mechanism":["MCU образует пору, по которой Ca²⁺ проходит по электрохимическому градиенту; канал не сопряжён с гидролизом ATP.","Движущая сила входа складывается из разности концентраций Ca²⁺ и мембранного потенциала: отрицательный матрикс притягивает положительный ион.","Каждый вошедший Ca²⁺ переносит два положительных заряда и сам может уменьшать модуль потенциала."],"paragraphs":["Митохондриальный Ca²⁺-унипортер давно был известен как путь быстрого входа Ca²⁺ в матрикс, но его порообразующий белок MCU идентифицировали только в 2011 г. (Baughman 2011; De Stefani 2011). Ранее электрофизиологические записи на митопластах — митохондриях без наружной мембраны — показали, что унипортер является высокоизбирательным Ca²⁺-каналом (Kirichok 2004).","Канал не расходует ATP. Ca²⁺ проходит через него по электрохимическому градиенту, который складывается из двух составляющих. Химическая составляющая — разность концентраций: свободная [Ca²⁺] в матриксе в покое близка к цитозольной и составляет порядка десятых долей микромоля, а около мест высвобождения Ca²⁺ из ЭПР она может быть значительно выше. Электрическая составляющая — мембранный потенциал: матрикс заряжен отрицательно и притягивает двухзарядный катион.","Если при прочих равных условиях модуль потенциала уменьшается, электрическая составляющая ослабевает, и вход Ca²⁺ через тот же канал замедляется. Поэтому деполяризация митохондрий снижает их способность накапливать Ca²⁺.","Вход Ca²⁺ электрогенен: каждый ион вносит в матрикс два положительных заряда. При большом потоке Ca²⁺ это само по себе уменьшает модуль потенциала, и для его поддержания нужен дополнительный перенос H⁺ дыхательной цепью. Регуляцию канала и роль локальной концентрации Ca²⁺ рассматривает раздел о контактах ЭПР и митохондрии.","Отрицательный потенциал матрикса способствует и входу K⁺. Во внутренней мембране описаны [[T70|K⁺-каналы mitoKATP и mitoBK]]. Канал mitoKATP подавляется миллимолярными концентрациями ATP; его образуют порообразующая субъединица MITOK и ATP-связывающая субъединица MITOSUR (Paggio 2019). Канал mitoBK активируется Ca²⁺ и зависит от потенциала; его кодирует ген KCNMA1, а в митохондрии белок направляет участок C-конца, включаемый при альтернативном сплайсинге (Singh 2013). Вход K⁺ вносит в матрикс положительный заряд; вслед за K⁺ и анионами в матрикс поступает вода, и объём матрикса увеличивается. Сверхэкспрессия MITOK вызывала набухание митохондрий и снижение Δψm, а удаление его гена — нестабильность Δψm и снижение окислительного фосфорилирования (Paggio 2019)."],"trap":["MCU расходует ATP на каждый переносимый ион Ca²⁺.","MCU — ионный канал, а не насос. Ca²⁺ проходит через него по электрохимическому градиенту, который создают разность концентраций и мембранный потенциал. ATP расходует, например, SERCA — Ca²⁺-ATPаза ЭПР."],"conditions":"Схема механизма; сравниваются ранние состояния при неизменных концентрациях Ca²⁺, проводимости канала и остальных условиях. MCU как высокоизбирательный канал — ток в митопластах из клеток COS-7 (Kirichok 2004); идентификация MCU — Baughman 2011 (клетки HeLa, печень мыши) и De Stefani 2011 (клетки HeLa, реконструкция в бислое). K⁺-каналы: mitoKATP — клетки и мыши, реконструкция MITOK и MITOSUR в липосомах и бислое (Paggio 2019); mitoBK — кардиомиоциты мыши и крысы (Singh 2013).","sources":["Kirichok2004","Baughman2011","DeStefani2011","Paggio2019","Singh2013"],"quiz":{"id":"S9-L12","rev":1,"question":"Модуль отрицательного потенциала матрикса уменьшили, сохранив концентрации Ca²⁺ и состояние MCU. Как изменится электрическая составляющая движущей силы входа Ca²⁺?","options":[{"text":"Она увеличится, поскольку матрикс станет менее отрицательным.","correct":false,"feedback":"Менее отрицательный матрикс слабее способствует входу катиона. Здесь изменён именно электрический вклад.","id":"S9-L12-1"},{"text":"Она уменьшится, поскольку ослабеет притяжение положительного иона к матриксу.","correct":true,"feedback":"Электрический вклад определяется зарядом иона и разностью потенциалов. При уменьшении модуля отрицательного потенциала этот вклад ослабевает.","id":"S9-L12-3"},{"text":"Она не изменится, поскольку MCU получает энергию только от гидролиза ATP.","correct":false,"feedback":"MCU — ионный канал. Его проводимость не сопряжена с непосредственным гидролизом ATP.","id":"S9-L12-2"}]},"widget":{"kind":"net","title":"","s":{"title":"Мембранный потенциал — электрическая движущая сила входа Ca²⁺","status":"Схема механизма · качественные состояния","ctrls":[{"id":"p","type":"group","label":"Модуль потенциала","opts":["Сохранён","Снижен"]}],"W":560,"H":330,"NW":560,"NH":330,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":168,"w":548,"h":156,"c":"mito","t":"матрикс","lx":14,"ly":318}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"mcu":{"p":[280,150,120,56],"t":"MCU\n(канал)","n":[280,150,120,56],"fs":17},"cao":{"p":[120,64,160,34],"t":"[Ca²⁺] снаружи","n":[120,64,160,34],"fs":16},"cam":{"p":[280,268,170,34],"t":"Ca²⁺ в матриксе","n":[280,268,170,34],"fs":16},"psi":{"p":[460,268,90,34],"t":"|Δψm|","n":[460,268,90,34],"fs":17}},"edges":{"in":{"a":"cao","b":"mcu","k":"tr","t":"Ca²⁺","d":[0,-14]},"in2":{"a":"mcu","b":"cam","k":"tr"},"drv":{"a":"psi","b":"mcu","k":"act","t":"электрическая\nдвижущая сила","d":[56,6],"anc":"start"}},"st":{"0":{"n":{"mcu":"on","cao":"base","cam":"on","psi":"on"},"m":[["[Ca²⁺] снаружи и проводимость MCU","одинаковые"],["Электрическая составляющая","сильная"],["Скорость входа Ca²⁺","высокая"]],"note":"Отрицательный матрикс притягивает Ca²⁺; вместе с разностью концентраций это создаёт большую движущую силу входа через канал."},"1":{"n":{"mcu":"base","cao":"base","cam":"low","psi":"low"},"e":{"drv":"on"},"m":[["[Ca²⁺] снаружи и проводимость MCU","одинаковые"],["Электрическая составляющая","ослаблена"],["Скорость входа Ca²⁺","ниже"]],"note":"Модуль потенциала уменьшился, концентрации и канал те же. Притяжение катиона к матриксу ослабло, и вход Ca²⁺ замедлился."}},"notes_svg":[{"t":"−  −  −  −","x":160,"y":216,"a":"middle"},{"t":"+  +  +  +","x":420,"y":112,"a":"middle"}],"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"rho-zero","number":13,"section":1,"title":"Как может сохраняться потенциал при отсутствии мтДНК","question":2,"questions":[2],"keywords":["ρ⁰-клетки","клетки без мтДНК","rho0","ANT","электрогенный обмен","F1-ATPаза","неполная ATP-синтаза","бонгкрековая кислота","гликолиз","уридин"],"lead":["[[T36|Клетки ρ⁰]] не содержат мтДНК и поэтому не могут собрать дыхательную цепь и полноценную ATP-синтазу. При этом митохондрии у них есть, и импорт ядерно кодируемых белков продолжается.","Пониженный мембранный потенциал в таких клетках поддерживает не перенос H⁺, а электрогенный обмен ATP⁴⁻ на ADP³⁻ через ANT вместе с гидролизом ATP в матриксе."],"mechanism":["Без 13 белков, кодируемых мтДНК, комплексы I, III и IV не собираются, а у ATP-синтазы нет субъединиц a (ATP6) и A6L (ATP8): полноценная F₀F₁ не образуется, и H⁺ через мембрану не переносится.","ATP гликолиза входит в матрикс через ANT как ATP⁴⁻ в обмен на ADP³⁻: каждый цикл вносит в матрикс один отрицательный заряд.","Неполный комплекс с ATPазной активностью F₁ гидролизует ATP в матриксе и образует ADP для следующего цикла обмена; так поддерживается пониженный Δψm."],"paragraphs":["Клетки ρ⁰ — культивируемые клетки, полностью утратившие мтДНК (King 1989). Без мтДНК клетка не синтезирует 13 белков дыхательной цепи и ATP-синтазы, поэтому комплексы I, III и IV не работают, а у ATP-синтазы нет двух мембранных субъединиц, кодируемых мтДНК. ATP такие клетки получают гликолизом; для роста им добавляют в среду пируват и уридин.","Тем не менее митохондрии в ρ⁰-клетках сохраняются, а ядерно кодируемые белки продолжают импортироваться — для этого нужен мембранный потенциал. Его источник был выяснен на клетках человека линии 143B (Appleby 1999; Buchet 1998). ANT работает в обратном обычному направлении: ATP⁴⁻ из цитозоля входит в матрикс, а ADP³⁻ выходит. Каждый цикл вносит в матрикс один отрицательный заряд.","Чтобы обмен продолжался, ATP в матриксе должен превращаться в ADP. Это делает неполный комплекс ATP-синтазы с работающей частью F₁. Ингибиторы ANT и азид, ингибирующий F₁, снимали потенциал, а олигомицин, действующий на мембранную часть, — нет. В интактных ρ⁰-клетках модуль потенциала по оценке авторов не превышал примерно 67 мВ, то есть был ниже, чем в исходных клетках, но достаточным для импорта.","Отсюда два вывода. Отсутствие мтДНК не означает отсутствия митохондрий и потенциала. И полноценная F₀F₁ в ρ⁰-клетке не работает как протонный насос: ответ на олигомицин у этих клеток иной, чем у клеток с мтДНК. Механизм описан для определённых линий клеток человека; при недостатке гликолитического ATP потенциал не поддерживается."],"trap":["Отсутствие мтДНК означает отсутствие митохондрий и любого Δψm.","Митохондрии в ρ⁰-клетках сохраняются: почти все их белки кодирует ядро. Пониженный потенциал поддерживает электрогенный обмен ATP⁴⁻ на ADP³⁻ через ANT вместе с гидролизом ATP неполной ATP-синтазой в матриксе."],"conditions":"Схема механизма; уровни показаны качественно. Культивируемые клетки человека (линия 143B и производные ρ⁰-клетки), в которых описан ANT-зависимый механизм, при достаточном образовании ATP гликолизом (Appleby 1999; Buchet 1998). Оценка |Δψm| ≈ 67 мВ — верхняя граница для интактных клеток, получена при допущении, что весь накопленный зонд находится в митохондриях. Не все организмы и линии ведут себя одинаково; ответ ρ⁰-клеток на олигомицин нельзя переносить с клеток, содержащих мтДНК. Получение ρ⁰-клеток — King 1989.","sources":["Appleby1999","Buchet1998","King1989","Chinopoulos2010"],"quiz":{"id":"S9-L13","rev":1,"question":"В культивируемых ρ⁰-клетках отсутствует мтДНК, но сохраняются гликолиз и ядерно кодируемые белки митохондрий. Возможно ли сохранение пониженного Δψm и импорта части ядерно кодируемых белков?","options":[{"text":"Невозможно: при отсутствии мтДНК внутренней мембраны митохондрий не существует.","correct":false,"feedback":"ρ⁰ означает отсутствие мтДНК, а не исчезновение органелл и их мембран.","id":"S9-L13-2"},{"text":"Возможно: комплекс II в одиночку заменяет все протонные насосы дыхательной цепи.","correct":false,"feedback":"Комплекс II не перекачивает H⁺. Сохранение Δψm здесь объясняется другим механизмом.","id":"S9-L13-3"},{"text":"Возможно: потенциал может поддерживаться за счёт ATP и электрогенного обмена ANT.","correct":true,"feedback":"В описанных клеточных системах импорт ATP⁴⁻ в обмен на экспорт ADP³⁻ создаёт электрический вклад. Гидролиз ATP в матриксе обеспечивает ADP для продолжения обмена. Этот механизм может поддерживать пониженный потенциал и часть импортных процессов.","id":"S9-L13-1"}]},"widget":{"kind":"net","title":"","s":{"title":"Источник потенциала в обычной и ρ⁰-митохондрии","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Клетка","opts":["Обычная (мтДНК есть)","ρ⁰ (мтДНК нет)"]},{"id":"g","type":"check","label":"Гликолитического ATP достаточно","def":true}],"W":560,"H":380,"NW":560,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":152,"c":"plain","t":"цитозоль и межмембранное пространство","lx":14,"ly":28},{"x":6,"y":188,"w":548,"h":186,"c":"mito","t":"матрикс","lx":14,"ly":368}],"mem":[{"x1":6,"y1":170,"x2":554,"y2":170}],"nodes":{"gly":{"p":[100,70,120,36],"t":"гликолиз","n":[100,70,120,36],"fs":17},"chain":{"p":[110,170,140,52],"t":"дыхательная\nцепь","n":[110,170,140,52],"fs":16},"ant":{"p":[290,170,84,44],"t":"ANT","n":[290,170,84,44],"fs":18},"f1":{"p":[450,300,130,40],"t":"F₁-ATPаза","n":[450,300,130,40],"fs":17},"syn":{"p":[450,170,130,44],"t":"ATP-синтаза","n":[450,170,130,44],"fs":16},"psi":{"p":[120,300,90,34],"t":"|Δψm|","n":[120,300,90,34],"fs":17}},"edges":{"pump":{"a":[188,228],"b":[188,70],"k":"tr","t":"H⁺","d":[12,0],"anc":"start"},"atpin":{"a":[262,70],"b":[262,228],"k":"tr","t":"ATP⁴⁻","d":[-10,0],"anc":"end"},"adpout":{"a":[318,228],"b":[318,70],"k":"tr","t":"ADP³⁻","d":[10,0],"anc":"start"},"atpout":{"a":[262,228],"b":[262,70],"k":"tr","t":"ATP⁴⁻","d":[-10,0],"anc":"end"},"adpin":{"a":[318,70],"b":[318,228],"k":"tr","t":"ADP³⁻","d":[10,0],"anc":"start"},"hyd":{"a":"f1","b":"ant","k":"rx","t":"ATP → ADP + Pi","d":[30,24]},"g1":{"a":"gly","b":"ant","k":"rx","t":"ATP","d":[0,-12]},"hsyn":{"a":[520,70],"b":[520,228],"k":"tr","t":"H⁺","d":[-10,0],"anc":"end"}},"st":{"0-1":{"n":{"gly":"base","chain":"on","ant":"on","syn":"on","f1":"hide","psi":"on"},"e":{"atpin":"hide","adpout":"hide","hyd":"hide","g1":"hide"},"m":[["Источник Δψm","перенос H⁺ дыхательной цепью"],["ANT","ATP⁴⁻ наружу, ADP³⁻ внутрь"],["|Δψm|","высокий"]],"note":"В обычной митохондрии дыхательная цепь выводит H⁺, ATP-синтаза синтезирует ATP, а ANT выводит его в цитозоль."},"0-0":{"n":{"gly":"off","chain":"on","ant":"on","syn":"on","f1":"hide","psi":"on"},"e":{"atpin":"hide","adpout":"hide","hyd":"hide","g1":"hide"},"m":[["Источник Δψm","перенос H⁺ дыхательной цепью"],["Зависимость от гликолиза","небольшая"],["|Δψm|","высокий"]],"note":"Клетка с работающей дыхательной цепью поддерживает потенциал и при малом гликолитическом ATP: H⁺ выводит дыхательная цепь."},"1-1":{"n":{"gly":"on","chain":"abs","ant":"on","syn":"hide","f1":"on","psi":"low"},"e":{"pump":"off","atpout":"hide","adpin":"hide","hsyn":"hide"},"m":[["Источник Δψm","обмен ATP⁴⁻/ADP³⁻ через ANT и гидролиз ATP"],["ANT","ATP⁴⁻ внутрь, ADP³⁻ наружу"],["|Δψm|","снижен (оценка: |Δψm| не выше ≈ 67 мВ)"]],"note":"Дыхательной цепи нет. ATP гликолиза входит в матрикс в обмен на ADP³⁻, F₁ гидролизует его, и каждый цикл вносит в матрикс отрицательный заряд: поддерживается пониженный потенциал."},"1-0":{"n":{"gly":"off","chain":"abs","ant":"off","syn":"hide","f1":"off","psi":"off"},"e":{"pump":"off","atpout":"hide","adpin":"hide","hsyn":"hide","atpin":"off","adpout":"off","hyd":"off","g1":"off"},"m":[["Источник Δψm","отсутствует"],["ANT","обмен замедлен"],["|Δψm|","не поддерживается"]],"note":"Без достаточного гликолитического ATP обмен через ANT и гидролиз в матриксе останавливаются, и потенциал в ρ⁰-клетке не поддерживается."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"potential-import-assays","number":14,"section":1,"title":"Как раздельно проверяют потенциал и импорт белка","question":2,"questions":[2],"keywords":["TMRM","TMRE","JC-1","флуоресцентный зонд","режим гашения","калибровка","импорт in vitro","защита от протеазы","протеиназа K","детергент","FCCP-контроль"],"lead":["Мембранный потенциал и импорт белка измеряют разными экспериментами. Сигнал катионного зонда TMRM — это не потенциал в милливольтах и тем более не число импортированных белков.","Импорт проверяют отдельно: меченый предшественник инкубируют с митохондриями и выясняют, защищён ли он от протеазы."],"mechanism":["[[T38|TMRM]] — липофильный катион; он распределяется через плазматическую и внутреннюю мембраны в соответствии с их потенциалами и накапливается в отрицательно заряженном матриксе.","Интенсивность сигнала зависит также от режима измерения, массы митохондрий и потенциала плазматической мембраны; FCCP служит контролем полной деполяризации.","Импорт подтверждают защитой меченого белка от протеиназы K и отщеплением сигнальной последовательности; детергент, растворяющий мембраны, снимает защиту."],"paragraphs":["TMRM и TMRE — липофильные катионы, проходящие через мембраны. В равновесии они распределяются по закону Нернста: сначала между средой и цитозолем в соответствии с потенциалом плазматической мембраны, затем между цитозолем и матриксом в соответствии с Δψm. При низкой концентрации зонда (режим без гашения) яркость митохондрий тем выше, чем больше модуль потенциала. При высокой концентрации зонд накапливается так сильно, что флуоресценция гасится, и связь сигнала с потенциалом меняется: деполяризация сначала усиливает сигнал митохондрий и всей клетки, потому что зонд выходит из матрикса и гашение ослабевает.","Поэтому падение флуоресценции TMRM может иметь разные причины: деполяризацию митохондрий, уменьшение их массы, изменение потенциала плазматической мембраны или выход зонда из клеток. Контроли обязательны: FCCP в конце эксперимента показывает сигнал при полной деполяризации, олигомицин — вклад ATP-синтазы. Перевод сигнала в милливольты требует отдельной калибровки (Gerencser 2012).","Импорт белка проверяют в другом эксперименте. Предшественник, меченный радиоактивной аминокислотой, инкубируют с изолированными митохондриями, затем добавляют протеиназу K. Белок, вошедший в митохондрию, защищён мембранами и сохраняется; часто он ещё и укорачивается, потому что MPP отщепила сигнальную последовательность. Если мембраны растворить детергентом, защита исчезает. Если перед импортом снять потенциал разобщителем, защищённого продукта нет (Martin 1991).","Только сопоставление обоих экспериментов позволяет связать частичную деполяризацию с нарушением импорта конкретного белка."],"trap":["Уменьшение интенсивности TMRM само по себе доказывает прекращение импорта.","Сигнал TMRM зависит от режима измерения, массы митохондрий и потенциала плазматической мембраны. Даже подтверждённая частичная деполяризация не показывает, насколько нарушен импорт данного белка: импорт проверяют отдельным экспериментом с защитой от протеазы."],"conditions":"Учебная модель: яркость и полосы — условные качественные уровни, не данные эксперимента. Распределение катионного зонда через две мембраны, режимы с гашением и без него, необходимость калибровки — Gerencser 2012, Perry 2011. Эксперимент импорта с защитой от протеазы и зависимость от Δψm — изолированные митохондрии Neurospora crassa и дрожжей (Martin 1991); роль транслоказы — Fielden 2023. Для вопроса исходное наблюдение — изменение флуоресценции без калибровки и без измерения импорта.","sources":["Gerencser2012","Perry2011","Martin1991","Fielden2023"],"quiz":{"id":"S9-L14","rev":1,"question":"После воздействия снизилась флуоресценция TMRM. Достаточно ли этого наблюдения, чтобы утверждать, что импорт белка в матрикс полностью прекратился?","options":[{"text":"Недостаточно: нужно проверить условия регистрации зонда и сам импорт белка.","correct":true,"feedback":"Сигнал зависит от нескольких факторов. Даже подтверждённая частичная деполяризация ещё не устанавливает степень нарушения конкретного импортного пути.","id":"S9-L14-2"},{"text":"Достаточно: любое уменьшение
