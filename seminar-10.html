<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 10 · Стрессовые программы — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --cyc:#2F5DA8; --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl.locked{opacity:.55;position:relative}
.ctrl.locked::before{content:attr(data-lock);font-size:12.5px;color:var(--muted)}
[data-g]:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* семинар 8: метаболические потоки */
.meter{position:relative}
.meter .tk{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.55;border-radius:1px}
.fmrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 2px}
.fm{margin:0;display:grid;gap:3px;justify-items:start;color:var(--ink)}
.fm figcaption{font-size:13px;color:var(--muted)} .fm figcaption b{color:var(--ink)}
.fm-s{color:var(--ink)}
.medium{fill:var(--surface-2)}
.matrix{fill:var(--mito-fill);stroke:none;opacity:.55}
.dot-nadh{fill:var(--ink)} .dot-nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.dot-glc{fill:var(--on)} .dot-pyr{fill:var(--mtor)} .dot-lac{fill:var(--akt)}
.stub{fill:none;stroke:var(--off);stroke-width:1.6;stroke-dasharray:4 4}
.pool .nadh{fill:var(--ink)} .pool .nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.drugpill{fill:var(--bad)} .drugpill-t{fill:#fff;font-family:var(--f-body);font-weight:700;text-anchor:middle;dominant-baseline:central}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.res-grid{display:grid;gap:6px}

.meter{overflow:visible} .meter i{border-radius:5px}
.road{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
.halo{fill:none;stroke:var(--cyto);stroke-width:7}
.pool-fr{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.noxbox{fill:var(--good);stroke:none}
.medpill{fill:var(--surface);stroke:var(--on);stroke-width:2}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.mm .mt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mm small{font-size:13px;line-height:1.2;color:var(--ink)}
.mm .v{font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.legend .sw.line{display:inline-block}

.btn[hidden]{display:none!important}
.scene.wip .side > :not(.cap){display:none!important}
.scene.wip .cap .why{display:none}
.fm-s [class^="bond-"]{vector-effect:non-scaling-stroke;stroke-width:1.5px!important}

/* семинар 8: компактнее правая колонка (проектор 1280×720) */
.scene .ctrl{gap:8px} .scene input[type=range]{height:22px} .scene .slider{gap:0}
#capbox1a{order:-1} #poe1a{order:-2}
.tgrid .switch{font-size:14.5px;gap:8px}

/* семинар 8, вопрос 2: цикл трикарбоновых кислот */
.lv-tr{fill:var(--line)} .lv-f{fill:var(--mtor);transition:width .35s} .lv-f.fad{fill:var(--tfeb)}
.lv-tk{stroke:var(--ink);stroke-width:1.6;opacity:.75}
.dot-exit{fill:var(--carn)} .dot-cyc{fill:var(--cyc)} .dot-gln{fill:var(--aa)} .dot-fad{fill:var(--tfeb)}

ависимость ATF4 от p-eIF2α спадает (Lu 2004, качественно).", "s1_c_lowp": "Доля p-eIF2α ниже исходной ({p}). Количество активного eIF2B составляет {e} исходного, а общая трансляция — {tl} исходной. Содержание ATF4 относительно исходного уровня: {a}.", "s1_c_lowp_z": "Общая трансляция уже близка к пределу и почти не растёт, а ATF4 снижается: при избытке тройного комплекса повторная инициация чаще идёт на uORF2.", "s1_c_ph_lo": "Стресса нет, но дефосфорилирование ослаблено (относительно исходного: {f}): киназы с базальной активностью удерживают p-eIF2α на уровне {p}. Количество активного eIF2B составляет {e} исходного, а общая трансляция — {tl} исходной. Содержание ATF4 относительно исходного уровня: {a}.", "s1_c_ph_lo_z": "Долю p-eIF2α задают и стрессовые киназы, и скорость дефосфорилирования: при сниженной активности фосфатазы ответ развивается и без стресса.", "s1_c_ph_up": "Дефосфорилирование усилено (относительно исходного: {f}): при таком стрессе p-eIF2α ниже, чем при исходной активности фосфатаз.", "s1_c_ph_dn": "Дефосфорилирование ослаблено (относительно исходного: {f}): при таком стрессе p-eIF2α выше, чем при исходной активности фосфатаз.", "s1_p_inh": "ингибитор", "s1_s51a": "S51A", "s1_u2m": "uORF2: старт заменён", "s1_rep_node": "Репортёр ATF4", "s1_g34_dc": "ΔC: не связывает PP1", "s1_g34_v": "белок {v}", "s1_genes_v": "CHOP {v}", "lg_i_pill": "красная метка с названием — ингибитор киназы", "lg_i_isrib": "зелёная метка — ISRIB (усиливает eIF2B)", "lg_i_mut": "метка с красным контуром и красный крест на мРНК — введённая мутация (замена Ser51 на Ala в eIF2α; замена старт-кодона uORF2); красный крест на узле — киназы нет или вариант неактивен", "s1a_stim": "Стимул", "s1a_st_aa": "Среда без аминокислот", "s1a_st_tm": "Туникамицин", "s1a_st_tg": "Тапсигаргин", "s1a_st_pic": "Poly(I:C)", "s1a_st_ars": "Арсенит", "s1a_dose": "Доза стимула (условная шкала, % наибольшей дозы)", "s1a_drugs": "Препараты", "s1a_isrib": "ISRIB", "s1a_perki": "Ингибитор PERK", "s1a_gcn2i": "Ингибитор GCN2", "s1a_geno": "Генотип", "s1a_gt_wt": "Дикий тип", "s1a_gt_gcn2": "GCN2⁻/⁻", "s1a_gt_perk": "PERK⁻/⁻", "s1a_gt_s51a": "eIF2α S51A", "s1a_gt_uorf2": "Репортёр с мутацией uORF2", "s1a_gt_dc": "PPP1R15A-ΔC", "s1a_h_isrib": "ISRIB", "s1a_h_kin": "Ингибиторы киназ", "s1a_h_geno": "Генотипы", "s1a_r_a": "ATF4 (эндогенный белок), × исходного", "s1a_r_rep": "Репортёр ATF4, × исходного", "s1a_r_chop": "CHOP, × исходного", "s1a_r_g34": "GADD34, × исходного", "s1a_ref": "Серая метка на полосе — контрольная клетка без стимула (кнопка «Сбросить»). Активный eIF2B и общая трансляция выражены в процентах исходных значений, ATF4, репортёр ATF4, CHOP и GADD34 — в разах от исходного содержания (логарифмическая шкала, «×1» — исходное). Показания относятся к моменту, выбранному на часах. Репортёр ATF4 — люцифераза под 5′-лидером мРНК ATF4: у клеток без мутации uORF2 он повторяет эндогенный ATF4.", "s1a_instr": "Прибор", "s1a_in_graph": "График во времени", "s1a_in_blot": "Блот", "s1a_g_t1": "p-eIF2α (% всего eIF2α) и общая трансляция (% исходной)", "s1a_g_t2": "ATF4, CHOP и GADD34 (× исходного, логарифмическая шкала)", "s1a_g_u": "ч", "s1a_g_hint": "Горизонтальная ось — время, ч (учебная модель); вертикальная линия — момент, выбранный на часах. Значения в этот момент — в строках показаний выше.", "s1a_ln_p": "p-eIF2α", "s1a_ln_tl": "общая трансляция", "s1a_ln_a": "ATF4", "s1a_ln_c": "CHOP", "s1a_ln_g": "GADD34", "s1a_ln_rep": "репортёр ATF4", "s1a_b_t": "Блот по модели: дорожки с зафиксированными условиями", "s1a_b_p": "p-eIF2α", "s1a_b_tot": "eIF2α (всего)", "s1a_b_a": "ATF4", "s1a_b_c": "CHOP", "s1a_b_g": "GADD34", "s1a_b_s": "³⁵S-Met", "s1a_b_empty": "Дорожек пока нет: задайте условия и нажмите «Добавить дорожку».", "s1a_b_hint": "Блот построен по модели. Яркость полосы условна (для ATF4, CHOP и GADD34 — логарифмическая шкала); отсутствие полосы не означает нулевого содержания, а число и яркость полос не измеряют поток. Строка «eIF2α (всего)» — контроль нанесения; «³⁵S-Met» — включение метки как мера общего синтеза белка.", "s1a_blot_add": "Добавить дорожку", "s1a_blot_clear": "Очистить дорожки", "s1a_cond_st": "{st}, доза {d}, время {tm}", "s1a_cond_0": "без стимула, время {tm}", "s1a_my_t": "Образцы X, Y и Z", "s1a_my_p": "Блот трёх образцов клеток, обработанных тапсигаргином (4 ч). Дорожка «контр.» — клетки без стимула. Яркость полосы условна.", "s1a_my_ctl": "контр.", "s1a_my_h1": "Условия, в которых получен каждый образец, до ответа не показаны.", "s1a_my_h2": "Содержание ATF4 в трёх образцах близко, а p-eIF2α и включение ³⁵S-Met различаются: по одной полосе ATF4 условия опыта определить нельзя.", "s1a_my_x": "Образец X — высокая доза тапсигаргина ({d} шкалы): p-eIF2α {p}, ³⁵S-Met {tl}, ATF4 {a}.", "s1a_my_y": "Образец Y — слабая доза тапсигаргина ({d} шкалы): p-eIF2α {p}, ³⁵S-Met {tl}, ATF4 {a}.", "s1a_my_z": "Образец Z — промежуточная доза тапсигаргина ({d} шкалы) вместе с ISRIB: p-eIF2α {p}, ³⁵S-Met {tl}, ATF4 {a}.", "s1a_when1": "Прогноз на момент 1 ч после добавления стимула; ось времени — учебная модель.", "s1a_when4": "Прогноз на момент 4 ч после добавления стимула; ось времени — учебная модель.", "s1a_when12": "Прогноз на момент 12 ч после добавления стимула; ось времени — учебная модель.", "s1a_c_head": "{st}: доза {d} шкалы, время {tm}.", "s1a_c_head0": "Стимул не добавлен; время {tm}.", "s1a_c_rest": "Показания близки к исходным: p-eIF2α {p}, общая трансляция {tl} исходной, ATF4 {a}.", "s1a_c_rest_z": "Тройного комплекса достаточно, поэтому на мРНК ATF4 рибосомы в основном начинают трансляцию с репрессорного uORF2, и ATF4 образуется в малом количестве.", "s1a_c_flat": "Доля p-eIF2α составляет {p}. Количество активного eIF2B составляет {e} исходного, а общая трансляция — {tl} исходной. Содержание ATF4 близко к исходному ({a} относительно исходного уровня).", "s1a_c_flat_z": "Тройного комплекса достаточно для общей трансляции, и вероятность обхода репрессорного uORF2 на мРНК ATF4 остаётся низкой.", "s1a_c_lowa": "Доля p-eIF2α составляет {p}. Количество активного eIF2B составляет {e} исходного, а общая трансляция — {tl} исходной. Содержание ATF4 ниже исходного ({a} относительно исходного уровня).", "s1a_c_lowa_z": "При избытке тройного комплекса рибосомы чаще начинают трансляцию с репрессорного uORF2, и ATF4 образуется меньше, чем в исходной клетке.", "s1a_c_mild": "Доля p-eIF2α повысилась до {p}. Количество активного eIF2B составляет {e} исходного, но общая трансляция снижена лишь немного — до {tl} исходной. Содержание ATF4 относительно исходного уровня: {a}.", "s1a_c_mild_z": "Небольшое повышение p-eIF2α слабо ограничивает общий синтез белка, но уже повышает вероятность обхода репрессорного uORF2 на мРНК ATF4.", "s1a_c_mid": "Доля p-eIF2α составляет {p}. Количество активного eIF2B составляет {e} исходного, а общая трансляция снижена до {tl} исходной. Содержание ATF4 относительно исходного уровня: {a}.", "s1a_c_mid_z": "Нехватка тройного комплекса ограничивает общий синтез белка, а мРНК ATF4 продолжает транслироваться за счёт обхода uORF2: доля ATF4 среди синтезируемых белков растёт.", "s1a_c_strong": "Доля p-eIF2α составляет {p}. Количество активного eIF2B составляет {e} исходного, а общая трансляция снижена до {tl} исходной. Содержание ATF4 относительно исходного уровня: {a}.", "s1a_c_strong_z": "Тройного комплекса остаётся мало: общий синтез белка сильно снижен, а ATF4 образуется за счёт обхода uORF2; при ещё более высоком p-eIF2α рост ATF4 ограничивается (Lu 2004, качественно).", "s1a_c_recov": "p-eIF2α {p} — ниже максимума, достигнутого раньше (график); общая трансляция {tl} исходной, ATF4 {a}, GADD34 {g}.", "s1a_c_recov_z": "Снижение p-eIF2α при продолжающемся стимуле согласуется с обратной связью: ATF4 и CHOP повышают содержание GADD34, а GADD34 в комплексе с PP1 дефосфорилирует eIF2α.", "s1a_c_multi": "Задано несколько воздействий: {list}. Показания — результат их совместного действия в модели; вклад каждого по этим данным разделить нельзя.", "s1a_c_multi_z": "Вклад отдельного воздействия определяют, меняя условия по одному.", "s1a_f_isrib": "ISRIB усиливает активность eIF2B: количество активного eIF2B составляет {e} исходного при доле p-eIF2α {p}.", "s1a_f_ki_on": "{inh} подавляет киназу {k}, а этот стимул действует через неё: p-eIF2α составляет {p}.", "s1a_f_ki_off": "{inh} действует на киназу {k}, а этот стимул активирует киназу {k2}, которую препарат в модели не подавляет.", "s1a_f_ko_on": "Киназы {k} нет (генотип {inh}), а этот стимул действует через неё: p-eIF2α составляет {p}.", "s1a_f_ko_off": "Киназы {k} нет (генотип {inh}), но этот стимул активирует киназу {k2}, и eIF2α фосфорилируется ею.", "s1a_f_idle": "Стимул не добавлен, поэтому {x} на показания в модели не влияет.", "s1a_f_gt": "генотип {g}", "s1a_f_s51a": "В eIF2α остаток Ser51 заменён на аланин: фосфорилирование по этому остатку невозможно, p-eIF2α составляет {p}; ATF4 {a}.", "s1a_f_uorf2": "В репортёре заменён старт-кодон uORF2: репортёр ATF4 {rep}, эндогенный ATF4 {a}.", "s1a_f_dc": "Вариант GADD34 без C-конца (ΔC) лишён PP1-связывающего участка и не направляет PP1 к eIF2α: содержание этого варианта {g}, p-eIF2α {p}.", "s1a_c_myst": "Показаны три образца X, Y и Z: содержание ATF4 в них близко, а p-eIF2α и включение ³⁵S-Met различаются. Условия опытов скрыты.", "s1a_c_myst_z": "Одинаковое содержание ATF4 может получаться при разном p-eIF2α и разном общем синтезе белка.", "s1a_c_myst2": "Образец X — высокая доза тапсигаргина ({dx} шкалы): p-eIF2α {px}, ³⁵S-Met {tx}, ATF4 {ax}. Образец Y — слабая доза ({dy}): p-eIF2α {py}, ³⁵S-Met {ty}, ATF4 {ay}. Образец Z — промежуточная доза ({dz}) вместе с ISRIB: p-eIF2α {pz}, ³⁵S-Met {tz}, ATF4 {az}.", "s1a_c_myst2_z": "ISRIB не уменьшает p-eIF2α, а повышает активность eIF2B: по p-eIF2α образец Z сходен с X, а по включению ³⁵S-Met — с Y.", "s1a_take": "Фосфорилирование eIF2α четырьмя киназами снижает общий синтез белка и избирательно повышает трансляцию ATF4 за счёт обхода репрессорного uORF2; обратную связь замыкает GADD34. ISRIB действует на eIF2B, активность которого подавляется фосфорилированным eIF2α, и ослабляет ответ на умеренное p-eIF2α. Результаты модели не позволяют заключить, что ATF4 — единственный эффектор ISR или что ответ одинаков для любых клеток, доз и сроков.", "gn_i_measure": "Как измеряют", "g_i_measure": "Значения на экране рассчитаны по модели; в опыте их получают разными методами. Долю p-eIF2α определяют иммуноблотом с антителом к фосфорилированному Ser51 и сравнением с общим eIF2α; в работе Rabouw 2019 для этого применяли проточную цитометрию и блот со стандартами. Общую трансляцию измеряют по включению ³⁵S-метионина или по полисомному профилю: при арсените (40 мкМ, 30 мин, HEK293T) число полисом снизилось в 4,5 раза (Andreev 2015). Активность eIF2B оценивают по обмену ³H-GDP в экстрактах клеток (Guan 2017). ATF4, CHOP и GADD34 определяют иммуноблотом, а трансляцию ATF4 — репортёром, в котором 5′-лидер мРНК ATF4 расположен перед геном-репортёром (Lu 2004). Блот на экране условный: полосы нарисованы по расчёту, сигнал насыщается, а отсутствие полосы означает значение ниже порога обнаружения, а не нулевое содержание. Время на графике выражено в часах учебной модели: константы взяты из работ, выполненных в разных системах, и вместе не составляют одной измеренной кривой.", "gn_i_model": "Что упрощено", "g_i_model": "Модель описывает цепь «киназы → p-eIF2α → eIF2B → тройной комплекс → трансляция» и обратную связь через фосфатазы; гибель клеток, ATP и окислительную нагрузку она не рассчитывает. Из работ взяты: соотношение eIF2B и eIF2 (около 20 % в ретикулоцитах кролика и около 50 % в клетках Эрлиха; в модели принято 0,3; Rowlands 1988), отношение сродства eIF2(αP) и eIF2 к eIF2B около 9 (дрожжевые белки in vitro; Adomavicius 2019), качественная форма зависимости ATF4 от степени подавления трансляции (Lu 2004), падение синтеза белка на 78–81 % при арсените (Andreev 2015) и порядок p-eIF2α → ATF4 → CHOP (Han 2013). Подобраны автором модели скорости фосфорилирования и дефосфорилирования, периоды полужизни ATF4 и GADD34, вклад GADD34, шкала доз и положение максимума ATF4: числовых измерений для них в использованных работах нет. Кратности (например, рост ATF4 в 10 раз и более при умеренном стрессе) — арифметика модели, а не измерения. Модель не учитывает транскрипционную регуляцию ATF4 (Dey 2010), индукцию ATF4 через mTORC1 (Ben-Sahra 2016) и вклад других киназ при длительном стрессе (Guan 2017); ATF4 в ней — один из эффекторов ISR, не единственный. При промежуточном p-eIF2α ISRIB в модели немного повышает ATF4: это свойство модели, а не наблюдение.", "gn_i_gcn2": "GCN2", "g_i_gcn2": "Киназа, воспринимающая нехватку аминокислот. Её активирует деацилированная тРНК: домен, подобный гистидил-тРНК-синтетазе, вместе с C-концевым участком связывает такую тРНК (Dong 2000, дрожжи); киназу стимулирует и P-stalk рибосомы, а столкновения рибосом активируют GCN2 и ZAK (Inglis 2019; Harding 2019; Wu 2020). В модели этот путь активируется при выборе стимула «среда без аминокислот». В опытах часто применяют гистидинол, который ингибирует гистидил-тРНК-синтетазу и повышает долю деацилированной тРНК для гистидина (Hartman 1988); в МЭФ он вызывает лишь умеренное p-eIF2α (2 мМ, 1 ч; Taniuchi 2016) и нехватку всех аминокислот не воспроизводит. Мыши Gcn2⁻/⁻ жизнеспособны, а дефект проявляется при пищевом дефиците (Zhang 2002a). GCN2 отвечает и на другие воздействия, например на УФ (Taniuchi 2016).", "gn_i_perk": "PERK", "g_i_perk": "Киназа мембраны ЭПР: при накоплении развёрнутых (неправильно свёрнутых) белков в ЭПР она активируется и фосфорилирует Ser51 eIF2α (Harding 1999). В клетках PERK⁻/⁻ при стрессе ЭПР eIF2α не фосфорилируется, синтез белка выше, а выживание хуже (Harding 2000a); мутации гена EIF2AK3 у человека вызывают синдром Волкотта–Раллисона (Delépine 2000). В модели PERK активируют тапсигаргин (блокирует Ca²⁺-АТФазу SERCA, и запас Ca²⁺ в ЭПР истощается; быстрый сильный ответ) и туникамицин (блокирует N-гликозилирование; действует медленнее и как индуктор p-eIF2α слабее; Rutkowski 2006; Han 2013). Механизм восприятия (BiP или прямое связывание) разбирает вопрос 2. Оговорка: PERK отвечает и на насыщение липидов без люминального домена (Volmer 2013), а после 1 ч тапсигаргина ингибитор PERK восстанавливал синтез белка, но p-eIF2α вновь нарастало за счёт других киназ (Guan 2017); в модели вклад других киназ не учтён.", "gn_i_pkr": "PKR", "g_i_pkr": "Киназа, которую активирует двухцепочечная РНК (dsRNA). Канонически для активации требуется не менее 30 п.н., но шпильки около 15 п.н. с одноцепочечными «хвостами» тоже активируют PKR in vitro (Mayo 2016); в клетках человека PKR связывает преимущественно митохондриальные эндогенные dsRNA (Kim 2018). В модели PKR активируется poly(I:C) — синтетический аналог dsRNA, который вирусную инфекцию не заменяет: в МЭФ за 1 ч он вызывает лишь слабое p-eIF2α (Taniuchi 2016), поэтому в модели это самый слабый стимул. Ответ зависит от дозы и способа доставки (трансфекцией): в клетках HeLa 1 нг poly(I:C) давал около 45 % максимума p-eIF2α, 2 нг — более 70 % (Rabouw 2019). Мыши PKR⁻/⁻ внешне нормальны, а индукция генов интерферона типа I у них сохранена (Yang 1995).", "gn_i_hri": "HRI", "g_i_hri": "Киназа, зависимая от гема. В эритроидных клетках её активируют арсенит, тепловой и осмотический стресс, но не стресс ЭПР и не нехватка аминокислот (Lu 2001); у мышей HRI⁻/⁻ при дефиците железа развивается анемия (Han 2001). Роль HRI шире, чем в эритроидных клетках: в МЭФ она нужна для остановки трансляции, образования стрессовых гранул и выживания при арсените (McEwen 2005), а при митохондриальном стрессе протеаза OMA1 расщепляет DELE1, и короткая форма DELE1 накапливается в цитозоле, связывает HRI и активирует её (Guo 2020; Fessler 2020). В модели HRI отвечает на арсенит; это упрощение, потому что в работе Taniuchi 2016 арсенит и H₂O₂ восстанавливали p-eIF2α через HRI и GCN2 (обе киназы вводили сверхэкспрессией), и вывод «арсенит активирует только HRI» неоднозначен. Для арсенита всегда указывают дозу и время.", "gn_i_eif2a": "eIF2α", "g_i_eif2a": "Субъединица α фактора инициации eIF2, который в составе тройного комплекса доставляет Met-тРНКi к малой субъединице рибосомы. Киназы GCN2, PERK, PKR и HRI фосфорилируют остаток Ser51: в МЭФ без этих четырёх киназ фосфорилирование исчезало при всех 12 испытанных воздействиях (одна линия, 1 ч; Taniuchi 2016). Фосфорилирование не меняет работу eIF2 в 43S-комплексе напрямую, а делает eIF2 ингибитором eIF2B: eIF2(αP) связывается с eIF2B прочнее (Kd 3,5 против 32,2 нМ, примерно в 10 раз) и удерживает его в неактивном комплексе (Adomavicius 2019; Jennings 2017). Эти значения получены на очищенных белках S. cerevisiae in vitro, для человека они приняты по гомологии. Метка P имеет функциональное значение: она повышает сродство eIF2 к eIF2B. Сродство eIF2 к eIF2B не зависело от нуклеотида (GDP или GTP; Jennings 2017), поэтому на схеме форма eIF2 не указана.", "gn_i_pp1": "PP1", "g_i_pp1": "PP1 — протеинфосфатаза, которая удаляет фосфат с Ser51 eIF2α, но для этого ей нужна регуляторная субъединица. В исходном состоянии PP1 действует в комплексе с CReP (PPP1R15B), а при стрессе образуется также комплекс с индуцируемой GADD34 (PPP1R15A); на базовом уровне оба комплекса объединены в один узел (Jousse 2003; Novoa 2001). Уровень p-eIF2α задаёт баланс киназ и фосфатаз: при той же активности киназ ускорение дефосфорилирования снижает долю eIF2(αP). Оговорка: скорости дефосфорилирования в модели — допущения, измерений для них в использованных работах нет; ползунок изменяет активность базальной фосфатазы.", "gn_i_eif2b": "eIF2B", "g_i_eif2b": "eIF2B — фактор обмена гуаниновых нуклеотидов (GEF) для eIF2: он катализирует замену GDP на GTP, без которой eIF2 не образует тройной комплекс. Это гетеродекамер (αβδγε)₂ с регуляторным ядром и двумя каталитическими «плечами» γε; на нём связываются две молекулы eIF2 (Kashiwagi 2016; Tsai 2018; Adomavicius 2019). eIF2B в клетке меньше, чем eIF2: GEF составляет около 20 % от eIF2 в ретикулоцитах кролика и около 50 % в клетках асцитной карциномы Эрлиха; в ретикулоцитах фосфорилирование 30 % eIF2 полностью подавляло GEF и инициацию, а в клетках Эрлиха связывало около 60 % GEF (Rowlands 1988). Поэтому фосфорилирование части eIF2α снижает активность eIF2B для всего пула eIF2. Оговорка: для клеток человека это соотношение в использованных работах не измерено; в модели принято 0,3.", "gn_i_tc": "Тройной комплекс", "g_i_tc": "Тройной комплекс eIF2·GTP·Met-тРНКi доставляет инициаторную тРНК к 43S-комплексу. После узнавания AUG GTP гидролизуется (eIF5 действует как GAP), высвобождается фосфат, и остаётся eIF2·GDP с низким сродством к Met-тРНКi; для нового цикла eIF2B должен заменить GDP на GTP (Adomavicius 2019; Sidrauski 2015b). Число доступных тройных комплексов задаёт число инициаций, поэтому общая трансляция в модели следует за их числом, а на мРНК ATF4 результат зависит ещё и от обхода uORF2. Оговорка: стадии вытеснения eIF5 и обмена нуклеотида выведены in vitro на белках S. cerevisiae, для человека они приняты по гомологии; eIF2B конкурирует с Met-тРНКi за eIF2·GTP, а на фосфорилированном eIF2 он вытесняет eIF5 и разрушает тройной комплекс (Jennings 2017).", "gn_i_ribo": "Обычная мРНК", "g_i_ribo": "Обычная мРНК — любая мРНК без репрессорных uORF в 5′-лидере: число доступных тройных комплексов определяет число инициаций на ней. При уменьшении числа комплексов синтез белков с таких мРНК уменьшается. В модели общая трансляция выражена в процентах исходной; при полной блокаде eIF2B остаётся около 20 %. Значение подобрано по измеренному падению синтеза на 78–81 % при арсените (40 мкМ, 30 мин, HEK293T; Andreev 2015) и примерно на 80 % при тапсигаргине (400 нМ, 1 ч, МЭФ; Guan 2017). Оговорка: мРНК с uORF могут продолжать транслироваться и при нехватке тройного комплекса: при хроническом стрессе трансляция сохранялась для 1313 из 1336 мРНК, усиленных в остром ответе (Guan 2017).", "gn_i_uorf": "мРНК ATF4", "g_i_uorf": "В 5′-лидере мРНК ATF4 мыши находятся два uORF. uORF1 (3 кодона) — положительный элемент: после его трансляции рибосома повторно инициирует трансляцию. uORF2 длиннее; его рамка перекрывается с началом кодирующей области ATF4 и сдвинута относительно неё. Рибосома, транслирующая uORF2, завершает трансляцию уже за старт-кодоном ATF4 и поэтому не синтезирует ATF4. Расстояние от стоп-кодона uORF1 до старта uORF2 составляет 87 нт (Vattem 2004; Lu 2004). При достатке тройного комплекса повторная инициация приходится на uORF2, и ATF4 почти не синтезируется; при дефиците тройного комплекса повторная инициация переносится за uORF2 на ATF4. В репортёрах замена старт-кодона uORF2 снимает и репрессию, и индукцию, а сокращение расстояния между uORF1 и uORF2 с 87 до 3 нт повышает базальную трансляцию и почти устраняет индукцию (Lu 2004). Зависимость от степени подавления трансляции колоколообразна: при самом высоком p-eIF2α инициаций на любой мРНК слишком мало (Lu 2004), а для индукции ATF4 достаточно меньшего p-eIF2α, чем для блока общего синтеза (Rabouw 2019, репортёр в HEK293T). Оговорка: в конструкциях с единственным репрессорным uORF индукция сохраняется; механизм этого в использованных работах не выяснен.", "gn_i_atf4": "ATF4", "g_i_atf4": "Транскрипционный фактор, содержание которого определяют скорость трансляции его мРНК и скорость разрушения: белок нестабилен и разрушается комплексом SCF^βTrCP после фосфорилирования (Lassot 2001, HeLa); период полужизни в модели принят 0,6 ч как допущение. Вместе с CHOP ATF4 активирует гены синтеза белка (аминоацил-тРНК-синтетазы, факторы инициации) и ответа на развёрнутые белки; в МЭФ форсированная экспрессия ATF4 повышала синтез белка, снижала ATP/ADP, вызывала окислительный стресс и гибель, а выживание обеспечивало подавление синтеза через p-eIF2α, а не трансляция ATF4 (Han 2013). ATF4 регулируется не только трансляцией: при УФ p-eIF2α высокое, а ATF4 не индуцируется (Dey 2010), и mTORC1 может повышать ATF4 независимо от p-eIF2α (Ben-Sahra 2016). Поэтому ATF4 — один из эффекторов ISR, но не единственный.", "gn_i_genes": "Программа ATF4", "g_i_genes": "Программа ATF4 — гены, которые активируют ATF4 и CHOP; на схеме показаны два из них, образующие обратную связь. В мРНК CHOP один uORF со слабым контекстом старта, и при p-eIF2α рибосомы обходят его, а не повторно инициируют, как на мРНК ATF4 (Palam 2011); при туникамицине (1 мкг/мл, 1 ч, HEK293T) трансляция CHOP, GADD34, ATF4 и ATF5 повышена при ещё неизменной мРНК (Sidrauski 2015b). GADD34 образуется и благодаря обходу uORF, и благодаря транскрипции: ATF4 связывает его промотор, CHOP активирует ген (Ma 2003; Marciniak 2004; Young 2015). Среди других мишеней ATF4 — SLC7A11 (Sato 2004), ASNS (Siu 2002), PHGDH и PSAT1 (DeNicola 2015); одинаковую индукцию всех мишеней при любом стрессе утверждать нельзя. Оговорка: в МЭФ CHOP не связывал гены гибели (Han 2013), хотя в карциномах человека при тапсигаргине CHOP-зависимо повышается DR5 (Yamaguchi 2004), а при сверхэкспрессии CHOP снижается Bcl2 (McCullough 2001); в модели гибель клеток не рассчитывается.", "p1b_1_q": "В клетке без стресса активность eIF2α-киназ повышают до умеренной; активность фосфатаз, дефосфорилирующих eIF2α, не меняется. Как изменятся общая трансляция и содержание ATF4?", "p1b_1_o1": "Общая трансляция и содержание ATF4 снижаются: торможение инициации уменьшает синтез всех белков.", "p1b_1_o2": "Общая трансляция снижается, а содержание ATF4 повышается: ATF4 образуется при нехватке тройного комплекса.", "p1b_1_o3": "Общая трансляция не меняется, а содержание ATF4 повышается: ATF4 образуется отдельным путём, не связанным с eIF2B.", "p1b_1_k": "Киназы фосфорилируют eIF2α; eIF2(αP) прочно связывается с eIF2B и не даёт ему обменивать GDP на GTP в остальных молекулах eIF2, поэтому число доступных тройных комплексов уменьшается и общая трансляция снижается. На мРНК ATF4 нехватка тройного комплекса переносит реинициацию за репрессорный uORF2, и содержание ATF4 растёт.", "p1b_1_e": "В модели при умеренной активности киназ p-eIF2α повышается с 10 % до 35 %, количество активного eIF2B снижается со 100 % до 12 % исходного, общая трансляция — до 35 % исходной, а содержание ATF4 возрастает с ×1,0 до ×19. Это арифметика учебной модели при допущении, что eIF2B составляет около трети от eIF2 (между одной пятой в ретикулоцитах кролика и половиной в клетках асцитной карциномы Эрлиха; Rowlands 1988); кратность ATF4 не измерена. Измеренное подавление синтеза белка зависит от стимула и клеток: при арсените (40 мкМ, 30 мин) в клетках HEK293T число полисом снизилось в 4,5 раза, а ATF4 был заметен уже через 30 мин (Andreev 2015).", "p1b_1_w1": "В этом варианте предполагается, что инициация одинаково тормозится на любой мРНК. Для мРНК ATF4 это не так: в её 5′-лидере два uORF, и при нехватке тройного комплекса рибосома чаще минует старт репрессорного uORF2 и повторно инициирует трансляцию на основной рамке (Lu 2004). Поэтому ATF4 образуется, пока синтез большинства белков снижен.", "p1b_1_w3": "Вариант разделяет два процесса, которые связаны одним звеном. eIF2(αP) прочно связывается с eIF2B (Adomavicius 2019), а молекул eIF2B в клетке меньше, чем молекул eIF2 (Rowlands 1988), поэтому фосфорилирование части eIF2α уменьшает число доступных тройных комплексов для всех мРНК. Рост ATF4 вызван этим же дефицитом, а не отдельным путём.", "p1b_2_q": "В клетке с умеренной активностью eIF2α-киназ активность фосфатаз, дефосфорилирующих eIF2α, повышают втрое. Как изменятся p-eIF2α и содержание ATF4?", "p1b_2_o1": "p-eIF2α снижается, общая трансляция восстанавливается, но ATF4 остаётся высоким: белок уже накоплен.", "p1b_2_o2": "p-eIF2α почти не меняется: его уровень определяют киназы, а скорость дефосфорилирования влияет слабо.", "p1b_2_o3": "p-eIF2α снижается, общая трансляция восстанавливается, ATF4 возвращается почти к исходному уровню.", "p1b_2_k": "PP1 с регуляторной субъединицей CReP или GADD34 дефосфорилирует eIF2α. При той же активности киназ усиление дефосфорилирования снижает долю eIF2(αP), и больше eIF2B снова участвует в обмене GDP на GTP. Тройного комплекса становится достаточно, повторная инициация на мРНК ATF4 снова происходит преимущественно на репрессорном uORF2, и содержание ATF4 возвращается почти к исходному.", "p1b_2_e": "В модели втрое усиленное дефосфорилирование (×3,0) снижает p-eIF2α с 35 % до 12 %, восстанавливает количество активного eIF2B с 12 % до 94 % исходного, общую трансляцию — с 35 % до 99 % исходной, а содержание ATF4 — с ×19 до ×1,3. Состояние задаёт баланс киназ и фосфатаз: в клетках CReP (PPP1R15B) поддерживает базальный уровень p-eIF2α, а GADD34 (PPP1R15A) добавляется при стрессе (Jousse 2003; Novoa 2001). Скорости дефосфорилирования в модели — допущения: числовых измерений для них в использованных работах нет.", "p1b_2_w1": "Вариант считает ATF4 накопленным запасом, который не исчезает при смене условий. ATF4 относят к нестабильным белкам (Rutkowski 2006), поэтому в установившемся состоянии его содержание задаёт скорость образования. Когда тройного комплекса достаточно, обход репрессорного uORF2 становится редким, ATF4 образуется меньше, и его содержание снижается.", "p1b_2_w2": "Этот вариант учитывает только действие киназ. Долю фосфорилированного eIF2α совместно определяют фосфорилирование и дефосфорилирование: киназы присоединяют фосфат к Ser51, а комплексы PP1 с регуляторными субъединицами его удаляют. Поэтому при той же активности киназ усиление дефосфорилирования снижает долю eIF2(αP) (Jousse 2003; Novoa 2001).", "p1b_3_q": "В клетке с умеренной активностью eIF2α-киназ содержание ATF4 повышено. Активность киназ повышают до максимальной; дефосфорилирование не меняется. Как изменится содержание ATF4?", "p1b_3_o1": "ATF4 снижается, но остаётся выше исходного: при почти полной блокаде eIF2B инициаций на мРНК ATF4 мало.", "p1b_3_o2": "ATF4 повышается ещё сильнее: чем выше p-eIF2α, тем чаще реинициация обходит репрессорный uORF2.", "p1b_3_o3": "ATF4 не меняется: его содержание уже достигло максимума, который ограничен числом молекул мРНК ATF4.", "p1b_3_k": "При очень высоком p-eIF2α eIF2(αP) занимает почти весь eIF2B, и тройного комплекса не хватает даже на инициацию на мРНК ATF4: обход репрессорного uORF2 частый, но инициаций мало. Поэтому ATF4 образуется меньше, чем при умеренном p-eIF2α, но больше, чем без стресса.", "p1b_3_e": "В модели при максимальной активности киназ p-eIF2α повышается с 35 % до 88 %, количество активного eIF2B снижается с 12 % до 1 % исходного, общая трансляция — с 35 % до 22 % исходной, а содержание ATF4 — с ×19 до ×6,1. Колоколообразная зависимость ATF4 от степени подавления трансляции показана на репортёре ATF4 в клетках CHO и МЭФ с активируемым PERK: индукция наибольшая при низких дозах активатора и снижается при самых высоких (Lu 2004). Положение максимума и кратности в модели подобраны, а не измерены. В работе Rabouw 2019 репортёр ATF4 индуцировался при значительно меньших дозах арсенита, чем нужно для блока общего синтеза, но клетки были разными (HEK293T и HeLa-R19), поэтому сравнение качественное.", "p1b_3_w2": "Вариант переносит на ATF4 прямую зависимость от p-eIF2α. Но ATF4 образуется только при инициации трансляции: обход uORF2 повышает вероятность повторной инициации на основной рамке, а число инициаций зависит от числа доступных тройных комплексов. Когда количество активного eIF2B снижается до 1 %, ограничивающим становится число инициаций (Lu 2004).", "p1b_3_w3": "Вариант считает максимум свойством мРНК: будто число её молекул ограничивает содержание белка. В модели число молекул мРНК ATF4 не меняется, а между умеренным и максимальным стрессом изменяется число инициаций на каждой молекуле: количество активного eIF2B снижается с 12 % до 1 % исходного, и тройного комплекса становится ещё меньше.", "gn_i_isrib": "ISRIB", "g_i_isrib": "Малая молекула, которая связывается в расщелине между β- и δ-субъединицами eIF2B, «сшивает» два тетрамера и способствует сборке активного декамера; EC50 составляет 5 нМ (репортёр ATF4-uORF, HEK293T), замены в δ-субъединице дают устойчивость (Tsai 2018; Zyryanova 2018; Sidrauski 2013; Sekine 2015). Мишень ISRIB — eIF2B, активность которого подавляется фосфорилированным eIF2α. ISRIB не снижает p-eIF2α и автофосфорилирование PERK, не вызывает исчезновения стрессовых гранул, вызванных ингибиторами eIF4A, и в нестрессированных клетках не меняет общую трансляцию (снижается лишь базальная трансляция ATF4 и SLC35A4; Sidrauski 2015b). Эффект проявляется преимущественно в присутствии eIF2(αP) (Zyryanova 2021) и ограничен окном: около 20 % максимума p-eIF2α достаточно для блока трансляции, а с ISRIB порог составляет 45–70 % (арсенит 100 мкМ, около 40 % максимума — ISRIB помогает; 200 мкМ, около 75 % — нет; Rabouw 2019, HeLa-R19). В модели ISRIB повышает количество активного eIF2B; при промежуточном p-eIF2α он может немного повышать ATF4 — это свойство модели.", "gn_i_kinhib": "Ингибиторы киназ", "g_i_kinhib": "«Ингибитор PERK» на экране — это GSK2606414 или GSK2656157, «ингибитор GCN2» — GCN2iB; все они АТФ-конкурентные, формулы препаратов не показаны. В модели каждый подавляет свою киназу на 98 % и больше ничего не изменяет. В опытах у этих препаратов есть окно концентраций и другие мишени. GSK2656157 подавляет PERK при 0,9 нМ в опытах с изолированным ферментом и при 10–30 нМ в клетках, но при микромолярных концентрациях активирует ISR через GCN2 (Atkins 2013; Szaruga 2023); GSK2606414 и GSK2656157 прямо ингибируют RIPK1 (Rojas-Rivera 2017), а GSK2606414 — ещё и KIT (Mahameed 2019). У мышей GSK2656157 (50 мг/кг) ингибирует PERK в печени, но не снижает p-eIF2α после туникамицина (Szaruga 2023). GCN2iB в низких концентрациях активирует GCN2 (Carlson 2023) и прямо ингибирует ZAK (Misra 2026). Поэтому вывод о роли киназы подтверждают нокаутом или нокдауном.", "gn_i_geno": "Генотипы", "g_i_geno": "Генотипы позволяют отделить вклады отдельных звеньев. GCN2⁻/⁻: p-eIF2α не повышается при нехватке аминокислот; мыши жизнеспособны, а дефект проявляется при пищевом дефиците (Zhang 2002a; Harding 2000b). PERK⁻/⁻: eIF2α не фосфорилируется при стрессе ЭПР, синтез белка выше, выживание хуже (Harding 2000a). eIF2α S51A: остаток 51 заменён на аланин и не фосфорилируется; МЭФ с этой заменой культивируются (Han 2013), а гомозиготные мыши погибают в течение 18 ч после рождения (гипогликемия, дефицит β-клеток; Scheuner 2001). Репортёр с мутацией uORF2: замена старт-кодона uORF2 снимает и репрессию, и индукцию (Lu 2004; Vattem 2004); в модели он теряет колоколообразность, а эндогенный ATF4 не меняется. PPP1R15A-ΔC: вариант GADD34 без C-концевого PP1-связывающего домена, не способный направлять PP1 к eIF2α для дефосфорилирования (Novoa 2001; Novoa 2003); в модели обратной связи через GADD34 нет, а CReP остаётся. Оговорка: отсутствие киназы в модели убирает только её вход, компенсацию другими киназами модель не рассчитывает.", "gn_i_crep": "CReP–PP1", "g_i_crep": "CReP (PPP1R15B) — регуляторная субъединица PP1. Комплекс PP1 с CReP постоянно дефосфорилирует eIF2α, а образование CReP стрессом не индуцируется. При трансляции мРНК CReP происходит повторная инициация после uORF; она не зависит от стресса. Трансляция этой мРНК устойчива к репрессии eIF2 (Jousse 2003; Andreev 2015; Young 2015). У мышей Ppp1r15b⁻/⁻ задержан рост и нарушен эритропоэз, а мыши Ppp1r15a⁻/⁻ близки к норме. Эмбрионы с двойным нокаутом погибают на раннем этапе развития; замена S51A предотвращает эту гибель (Harding 2009). Комплекс PP1 с CReP обеспечивает базальное дефосфорилирование, а комплекс с GADD34 — его усиление после стресса. Оговорка: в модели активность CReP постоянна, а скорость дефосфорилирования принята как допущение, потому что числовых измерений для неё нет.", "gn_i_gadd34": "GADD34–PP1", "g_i_gadd34": "GADD34 (PPP1R15A) — индуцируемая регуляторная субъединица PP1. Он образуется и благодаря обходу uORF при p-eIF2α, и благодаря транскрипции: ATF4 связывает промотор, CHOP активирует ген (Young 2015; Ma 2003; Marciniak 2004); 5′-лидер содержит у человека 2 неперекрывающихся uORF, у мыши — 2 перекрывающихся вне рамки (Lee 2009). GADD34 нужен для восстановления синтеза белка: в МЭФ ATF4⁻/⁻ его индукции нет, p-eIF2α сохраняется долго, и восстановление синтеза задержано (Ma 2003; Novoa 2001; Novoa 2003). Эффект зависит от стимула: в клетках без GADD34 после тапсигаргина или DTT повышенная доля p-eIF2α сохраняется дольше, а после туникамицина её динамика не отличается от динамики в клетках с GADD34 (Kojima 2003). Так замыкается обратная связь «p-eIF2α → ATF4 и CHOP → GADD34 → дефосфорилирование»; в модели её вклад поздний и принят как допущение. Заявленные ингибиторы дефосфорилирования (салюбринал, гуанабенз, Sephin1) в модели не используются: их механизм остаётся спорным (Boyce 2005; Tsaytler 2011; Das 2015; Crespillo-Casado 2017; Carrara 2017).", "p1a_1_q": "Через 4 ч после добавления тапсигаргина в клетках дикого типа p-eIF2α повышено, а общая трансляция снижена. Тот же опыт ставят на клетках GCN2⁻/⁻. Как изменятся p-eIF2α и содержание ATF4 по сравнению с клетками дикого типа?", "p1a_1_o1": "p-eIF2α и содержание ATF4 снижаются: GCN2 участвует в ответе на любой стресс.", "p1a_1_o2": "p-eIF2α не меняется, а содержание ATF4 снижается: ATF4 образуется при участии GCN2.", "p1a_1_o3": "p-eIF2α и содержание ATF4 не меняются: тапсигаргин активирует PERK, а не GCN2.", "p1a_1_k": "Тапсигаргин нарушает работу ЭПР, и этот сигнал воспринимает киназа PERK; GCN2 воспринимает деацилированные тРНК и рибосомы. Без GCN2 киназа PERK по-прежнему фосфорилирует eIF2α, поэтому p-eIF2α и ATF4 остаются такими же, как в клетках дикого типа.", "p1a_1_e": "В модели тапсигаргин активирует только PERK, поэтому при генотипе GCN2⁻/⁻ показания не меняются: p-eIF2α остаётся 40 %, активный eIF2B — 8 % исходного, общая трансляция — 30 % исходной, ATF4 — ×14. В МЭФ без всех четырёх киназ фосфорилирование eIF2α исчезало при всех испытанных воздействиях, включая тапсигаргин (200 нМ, 1 ч), а введение PERK его восстанавливало (Taniuchi 2016); ES-клетки мыши Gcn2⁻/⁻ не фосфорилируют eIF2α в среде без лейцина (Zhang 2002a). Это упрощение: после ингибирования PERK при длительном действии тапсигаргина p-eIF2α вновь повышалось за счёт других киназ (Guan 2017), и вклад других киназ в эту фазу модель не рассматривает.", "p1a_1_w1": "Вариант считает GCN2 общим звеном любого стресса. У киназ разные входы: GCN2 воспринимает недостаток аминокислот, PERK — развёрнутые белки в ЭПР. Пропущено звено между тапсигаргином и киназой: он нарушает работу ЭПР, и eIF2α фосфорилируется киназой PERK.", "p1a_1_w2": "Вариант связывает ATF4 с одной киназой. GCN2 действительно активирует ответ при недостатке аминокислот, но ATF4 образуется при фосфорилировании eIF2α любой из четырёх киназ. Поэтому содержание ATF4 следует за p-eIF2α, а не за конкретной киназой; при тапсигаргине eIF2α фосфорилируется киназой PERK.", "p1a_2_q": "Через 4 ч после добавления тапсигаргина в клетках дикого типа p-eIF2α повышено, а содержание ATF4 выросло. Тот же опыт ставят на клетках eIF2α S51A (Ser51 заменён на аланин). Как изменятся общая трансляция и содержание ATF4 по сравнению с диким типом?", "p1a_2_o1": "Общая трансляция не снижается, содержание ATF4 не повышается: без Ser51 киназам некуда переносить фосфат.", "p1a_2_o2": "Общая трансляция снижается, а содержание ATF4 растёт: фосфорилирование eIF2α берут на себя другие киназы.", "p1a_2_o3": "Общая трансляция не снижается, но содержание ATF4 растёт: тапсигаргин повышает ATF4 независимо от eIF2α.", "p1a_2_k": "Все четыре киназы переносят фосфат на Ser51 eIF2α; при замене Ser51 на аланин фосфорилирование невозможно ни для одной из них. eIF2B остаётся активным, тройного комплекса хватает, поэтому общая трансляция сохраняется, а ATF4 не повышается.", "p1a_2_e": "В модели при генотипе eIF2α S51A p-eIF2α равно 0 %, активный eIF2B — 118 % исходного, общая трансляция — 102 % исходной, а содержание ATF4 — ×0,50. Значение ниже ×1 — следствие арифметики модели: без базального фосфорилирования (в модели около одной десятой eIF2α) тройного комплекса немного больше исходного, и обход репрессорного uORF2 реже; измеренного значения для S51A нет. В МЭФ с заменой eIF2α S51A тапсигаргин (400 нМ, 1–12 ч) не повышал p-eIF2α, ATF4 и GADD34, в отличие от клеток дикого типа (Guan 2017).", "p1a_2_w2": "Вариант допускает компенсацию другой киназой. Все четыре киназы фосфорилируют eIF2α по Ser51 (Taniuchi 2016), поэтому при замене Ser51 на аланин нет акцептора фосфата для любой из них: другие киназы могут быть активны, но p-eIF2α в таких клетках не появляется.", "p1a_2_w3": "Вариант допускает путь к ATF4, не связанный с eIF2α. В других условиях такие пути описаны: mTORC1 может повышать содержание ATF4 независимо от p-eIF2α (Ben-Sahra 2016), а транскрипция ATF4 регулируется отдельно (Dey 2010). Но в МЭФ eIF2α S51A при тапсигаргине ATF4 не повышался (Guan 2017), а в модели на ATF4 действует только p-eIF2α.", "p1a_3_q": "Сравнивают две культуры клеток. В обе добавляют тапсигаргин в умеренной дозе, а во вторую одновременно добавляют ISRIB. Как через 1 ч во второй культуре будут отличаться p-eIF2α, активность eIF2B и общая трансляция по сравнению с первой?", "p1a_3_o1": "p-eIF2α ниже, активность eIF2B и общая трансляция выше: ISRIB подавляет киназу PERK.", "p1a_3_o2": "p-eIF2α такое же, активность eIF2B и общая трансляция выше: ISRIB действует на eIF2B.", "p1a_3_o3": "p-eIF2α, активность eIF2B и общая трансляция такие же: eIF2B остаётся занят eIF2(αP).", "p1a_3_k": "ISRIB связывается с eIF2B, стабилизирует его декамер и повышает активность, не затрагивая киназы, поэтому p-eIF2α остаётся прежним. Активного eIF2B снова хватает для обмена GDP на GTP, общая трансляция восстанавливается, а обход uORF2 на мРНК ATF4 становится реже.", "p1a_3_e": "В модели ISRIB оставляет p-eIF2α на прежнем уровне (34 % и 35 %), повышает активность eIF2B с 14 % до 113 % исходного и общую трансляцию с 37 % до 102 % исходной; содержание ATF4 снижается с ×7,8 до ×0,64, потому что тройного комплекса снова достаточно. В клетках HEK293T и U2OS ISRIB возвращал синтез белка стрессированных клеток, не меняя p-eIF2α, а в нестрессированных клетках почти не менял общий синтез, но снижал базальный ATF4 (Sidrauski 2015b). В клетках HeLa-R19 ISRIB возвращал синтез белка при арсените 100 мкМ, но не при 200 мкМ (Rabouw 2019).", "p1a_3_w1": "Вариант приписывает ISRIB действие на киназу. ISRIB связывается с eIF2B, и доля фосфорилированного eIF2α при нём остаётся прежней (Sidrauski 2015b). Пропущено звено: между p-eIF2α и общей трансляцией стоит eIF2B, и ISRIB усиливает именно его.", "p1a_3_w3": "Вариант считает, что восстановить трансляцию можно только снижением p-eIF2α. Но eIF2(αP) тормозит eIF2B прочным связыванием, а ISRIB стабилизирует декамер eIF2B и ослабляет это торможение (Tsai 2018; Zyryanova 2021). При умеренном p-eIF2α активность eIF2B и общая трансляция восстанавливаются, хотя p-eIF2α остаётся прежним.", "p1a_4_q": "Сравнивают две культуры клеток. В обе добавляют тапсигаргин в высокой дозе, а во вторую одновременно добавляют ISRIB. Через 1 ч в первой культуре p-eIF2α очень высоко, а общая трансляция сильно снижена. Как будет отличаться общая трансляция во второй культуре?", "p1a_4_o1": "Выше, почти до исходной, как при умеренном p-eIF2α: ISRIB снимает торможение при любом p-eIF2α.", "p1a_4_o2": "Выше заметно, но не до исходной: при очень высоком p-eIF2α ISRIB действует слабее.", "p1a_4_o3": "Почти такая же: при очень высоком p-eIF2α eIF2(αP) в избытке занимает eIF2B и при действии ISRIB.", "p1a_4_k": "При очень высоком p-eIF2α eIF2(αP) в избытке относительно eIF2B и занимает почти весь eIF2B даже при действии ISRIB. Активность eIF2B и общая трансляция поэтому почти не меняются: ISRIB ослабляет ответ на умеренное, но не на очень высокое p-eIF2α.", "p1a_4_e": "В модели при p-eIF2α 83 % ISRIB повышает активность eIF2B лишь с 1 % до 4 % исходного, а общую трансляцию — с 22 % до 24 % исходной; p-eIF2α при этом почти не меняется (84 %). Содержание ATF4 при этом немного растёт (с ×6,0 до ×7,7): небольшой прирост тройного комплекса возвращает систему ближе к максимуму колоколообразной зависимости. Это свойство модели, в опытах оно не проверялось. В клетках HeLa-R19 ISRIB возвращал синтез белка при арсените 100 мкМ и не возвращал при 200 мкМ; порог зависел от доли максимального p-eIF2α (Rabouw 2019, значения — в справке «ISRIB»).", "p1a_4_w1": "Вариант переносит результат умеренного p-eIF2α на любой уровень. ISRIB повышает активность eIF2B, но не удаляет eIF2(αP): когда eIF2(αP) очень много, eIF2B остаётся занятым, и усиленный eIF2B по-прежнему не обменивает GDP на GTP в достаточной мере.", "p1a_4_w2": "Вариант предполагает, что действие ISRIB убывает плавно и сохраняется при любом p-eIF2α. В опытах эффект ISRIB исчезал выше порога p-eIF2α (Rabouw 2019), а в модели при таком p-eIF2α прирост активного eIF2B слишком мал, чтобы изменить общую трансляцию.", "p1a_5_q": "В клетки дикого типа до начала опыта введён репортёрный конструкт для синтеза люциферазы. В 5′-лидере репортёрной мРНК, соответствующем лидеру мРНК ATF4, заменён старт-кодон uORF2. Две параллельные культуры выдерживают 4 ч: одну с тапсигаргином, другую без стимула. В культуре с тапсигаргином содержание эндогенного ATF4 повышено. Как изменится содержание люциферазы относительно её содержания в культуре без стимула?", "p1a_5_o1": "Содержание репортёра не повышается и следует за общей трансляцией: без uORF2 обход отсутствует.", "p1a_5_o2": "Содержание репортёра повышается так же, как эндогенного ATF4: индукция зависит от uORF1, а не от uORF2.", "p1a_5_o3": "Содержание репортёра повышается сильнее, чем эндогенного ATF4: без uORF2 рибосомы доходят до основной рамки.", "p1a_5_k": "Индукция ATF4 основана на конкуренции репрессорного uORF2 и основной рамки за повторную инициацию: при нехватке тройного комплекса повторная инициация чаще происходит на основной рамке. Если старт-кодон uORF2 заменён, репрессорный uORF2 больше не конкурирует с основной рамкой за повторную инициацию, и содержание репортёра следует за общей инициацией, а не растёт.", "p1a_5_e": "В модели при замене старта uORF2 содержание репортёра снижается до ×0,40 его уровня без стимула, тогда как эндогенный ATF4 остаётся на уровне ×14; общая трансляция при этом 30 % исходной. Допущение модели: репортёр без uORF2 ведёт себя как обычная мРНК, синтез белка с которой зависит от числа инициаций. В работе Lu 2004 (репортёры ATF4-GFP, клетки CHO) замена старта uORF2 снимала и репрессию, и индукцию; поэтому показание репортёра в модели нормировано на его собственный исходный уровень (в опыте базальный уровень такого репортёра выше). Такие репортёры показывают, что uORF2 необходим для индукции в данной конструкции; это не исключает регуляции ATF4 на уровне транскрипции (Dey 2010).", "p1a_5_w2": "Вариант приписывает индукцию uORF1. Но uORF1 нужен для повторной инициации: после него рибосома снова получает тройной комплекс и начинает трансляцию на uORF2 или на основной рамке (Vattem 2004; Lu 2004). Без репрессорного uORF2 конкуренция исчезает, а вместе с ней и индукция.", "p1a_5_w3": "Вариант считает uORF2 только помехой, снятие которой увеличивает синтез белка. В работе Lu 2004 замена старта uORF2 снимала репрессию (базальный уровень выше), но убирала и индукцию: репортёр переставал реагировать на стресс. Показание «× собственного исходного уровня» поэтому не растёт.", "p1a_6_q": "Через 2 ч после добавления тапсигаргина p-eIF2α высоко, а общая трансляция снижена. Стимул остаётся в среде. Как изменятся p-eIF2α и общая трансляция к 12 ч?", "p1a_6_o1": "p-eIF2α остаётся на прежнем уровне, пока стимул в среде, и общая трансляция остаётся сниженной.", "p1a_6_o2": "p-eIF2α снижается, хотя стимул сохраняется, и общая трансляция частично восстанавливается.", "p1a_6_o3": "p-eIF2α продолжает расти, и общая трансляция снижается ещё сильнее: стресс накапливается.", "p1a_6_k": "Стимул сохраняется, но ATF4 и CHOP повышают содержание GADD34; комплекс PP1 с GADD34 дефосфорилирует eIF2α в дополнение к постоянно действующему комплексу PP1 с CReP. Доля p-eIF2α снижается, eIF2B освобождается, и общая трансляция частично восстанавливается.", "p1a_6_e": "В модели при дозе 24 % шкалы p-eIF2α снижается с 48 % через 2 ч до 24 % через 12 ч, общая трансляция повышается с 26 % до 71 % исходной, содержание GADD34 — с ×8,8 до ×28, а CHOP — с ×6,3 до ×30; ATF4 остаётся высоким (с ×12 до ×10). Порядок событий (p-eIF2α, затем ATF4, затем CHOP и GADD34, затем дефосфорилирование) следует из работ на МЭФ (Han 2013; Novoa 2003), но часы зависят от стимула и дозы и в модели являются допущениями. В МЭФ при тапсигаргине 400 нМ синтез белка к 6 ч восстанавливался лишь частично, а активность eIF2B к 12 ч оставалась сниженной (Guan 2017); при слабых дозах (туникамицин 25–50 нг/мл) CHOP достигал максимума около 16 ч и снижался к 24 ч (Rutkowski 2006).", "p1a_6_w1": "Вариант считает, что при неизменном стимуле p-eIF2α не меняется. При сохраняющемся стимуле ATF4 и CHOP повышают содержание GADD34, поэтому дефосфорилирование eIF2α усиливается (Ma 2003; Novoa 2001). Так действует отрицательная обратная связь: доля p-eIF2α достигает максимума, а затем снижается.", "p1a_6_w3": "Вариант предполагает накопление сигнала. Доля p-eIF2α определяется соотношением скоростей фосфорилирования eIF2α киназами и его дефосфорилирования фосфатазами: когда рост GADD34 усиливает дефосфорилирование, доля падает, и общая трансляция частично восстанавливается (Novoa 2003).", "p1a_7_q": "Через 12 ч после добавления тапсигаргина в клетках дикого типа p-eIF2α ниже достигнутого максимума, а общая трансляция частично восстановлена. Тот же опыт ставят на клетках с вариантом GADD34 без C-конца (PPP1R15A-ΔC). Как изменятся p-eIF2α и общая трансляция по сравнению с клетками дикого типа?", "p1a_7_o1": "p-eIF2α выше, а общая трансляция ниже: вариант без C-конца не связывает PP1.", "p1a_7_o2": "p-eIF2α и общая трансляция такие же: дефосфорилирование eIF2α полностью обеспечивает комплекс PP1–CReP.", "p1a_7_o3": "p-eIF2α ниже, а общая трансляция выше: GADD34 усиливает фосфорилирование eIF2α.", "p1a_7_k": "Вариант PPP1R15A без C-конца не связывает PP1 и не направляет его к eIF2α, поэтому обратная связь через GADD34 не замыкается. CReP обеспечивает дефосфорилирование на базальном уровне, которого при сильном стимуле не хватает: p-eIF2α сохраняется высоким, а общая трансляция остаётся сниженной.", "p1a_7_e": "В модели без обратной связи через GADD34 p-eIF2α к 12 ч составляет 61 % против 24 % у клеток дикого типа, активный eIF2B — 3 % против 38 % исходного, общая трансляция — 23 % против 71 % исходной, а содержание CHOP выше (×54 против ×30). Показание «GADD34 ×60» относится к варианту без PP1-связывающего участка: его количество растёт, но дополнительного дефосфорилирования eIF2α нет. В МЭФ вариант GADD34 с функциональным C-концом подавлял p-eIF2α, а ΔC — нет (Novoa 2001); в клетках без GADD34 синтез белка после стресса восстанавливается с задержкой (Novoa 2003), хотя после туникамицина различий в p-eIF2α не выявлено (Kojima 2003). При длительном ISR CHOP вместе с ATF4 повышает синтез белка и окислительную нагрузку (Han 2013; Marciniak 2004); долю гибели клеток модель не считает.", "p1a_7_w2": "Этот вариант считает базальный комплекс PP1–CReP достаточным для восстановления после стресса. CReP постоянно поддерживает базальную дефосфорилирующую активность и стрессом не индуцируется (Jousse 2003). При сильном стрессе образование GADD34 усиливает дефосфорилирование: GADD34 связывает PP1 и направляет его к eIF2α. Без PP1-связывающего участка GADD34 это усиление отсутствует, поэтому p-eIF2α остаётся выше.", "p1a_7_w3": "Вариант путает вход и выход обратной связи. GADD34 входит в программу ATF4 и CHOP, но не усиливает фосфорилирование: GADD34 связывает PP1 и направляет его к eIF2α для дефосфорилирования. Без этого звена ATF4 и CHOP продолжают расти, а p-eIF2α остаётся высоким.", "p1a_8_q": "На блоте показаны три образца клеток через 4 ч после добавления тапсигаргина; содержание ATF4 в них близко. В одном образце к тапсигаргину добавлен ISRIB. Какой это образец?", "p1a_8_o1": "Образец X: p-eIF2α и торможение трансляции выражены сильнее всего, потому что ISRIB усиливает ответ на стресс.", "p1a_8_o2": "Образец Y: p-eIF2α самое низкое, а синтез белка почти не снижен, потому что ISRIB подавляет киназу.", "p1a_8_o3": "Образец Z: p-eIF2α повышено, а синтез белка почти не снижен: ISRIB усиливает eIF2B, а не снижает p-eIF2α.", "p1a_8_k": "ISRIB связывается с eIF2B и ослабляет торможение, создаваемое eIF2(αP), но не меняет самого p-eIF2α. Поэтому в образце с ISRIB p-eIF2α остаётся высоким, как в образце с высокой дозой, а включение ³⁵S-Met близко к норме.", "p1a_8_e": "Образец X — высокая доза тапсигаргина: p-eIF2α 54 %, ³⁵S-Met 24 %, ATF4 ×10,0. Образец Y — слабая доза: p-eIF2α 22 %, ³⁵S-Met 78 %, ATF4 ×11. Образец Z — промежуточная доза вместе с ISRIB: p-eIF2α 52 %, ³⁵S-Met 81 %, ATF4 ×11. Близкое содержание ATF4 получается при разных значениях p-eIF2α и общего синтеза, поэтому по одной полосе ATF4 условия опыта определить нельзя. ISRIB не снижает p-eIF2α (Sidrauski 2015b): образец Z по p-eIF2α близок к X, а по ³⁵S-Met — к Y. Доза в образце Z в модели подобрана так, чтобы p-eIF2α оставалось в области, где ISRIB действует (Rabouw 2019). Блот построен по модели, яркость полос условна.", "p1a_8_w1": "Вариант считает, что ISRIB усиливает ответ на стресс. ISRIB ослабляет торможение синтеза белка, создаваемое eIF2(αP), поэтому в образце с ISRIB синтез белка выше, а не ниже. Образец X с самым сильным торможением — высокая доза без препарата.", "p1a_8_w2": "Вариант предполагает, что ISRIB снижает p-eIF2α, как ингибитор киназы. ISRIB связывается с eIF2B и p-eIF2α не меняет (Sidrauski 2015b), а низкое p-eIF2α образца Y указывает на слабую дозу тапсигаргина: при ней и синтез белка снижен слабо.", "s2_mem": "Мембрана ЭПР", "s2_lumen": "Просвет ЭПР", "s2_cyto": "Цитоплазма", "s2_load_l": "Развёрнутые белки (нагрузка)", "s2_cap_l": "Шапероны: BiP и др. (ёмкость)", "s2_transl": "общая трансляция", "s2_fb1": "приток белков", "s2_splice": "сплайсинг XBP1", "s2_golgi": "Гольджи: S1P, S2P", "s2_nuc": "Ядро", "s2_genes": "гены шаперонов и белков ERAD", "s2_fb2": "рост ёмкости", "s2_how": "Как измеряют", "s2_lim": "Что упрощено", "s2_r_ratio": "Нагрузка / ёмкость (условный индекс)", "s2_r_free": "Сенсоры, не связанные с BiP (модель), %", "s2_r_perk": "Активность PERK (PERK-P), % максимума", "s2_r_pe": "p-eIF2α, % всего eIF2α", "s2_r_xs": "Сплайсированная мРНК XBP1, % всей мРНК XBP1", "s2_r_af": "ATF6f в ядре, % максимума", "s2_r_tl": "Общая трансляция, % исходной", "s2_r_cap": "Ёмкость ЭПР (условный индекс), × исходной", "s2_c_low": "Отношение нагрузки к ёмкости равно {r}: ёмкость ЭПР превышает нагрузку, и без BiP в модели остаётся {f} % сенсоров — меньше, чем в исходном состоянии.", "s2_c_low_z": "Пока ёмкость фолдинга и деградации белков превышает приток развёрнутых белков, большая часть сенсоров в модели связана с BiP, а ветви UPR не достигают порога активности.", "s2_c_base": "Отношение нагрузки к ёмкости близко к исходному ({r}): приток развёрнутых белков уравновешен ёмкостью ЭПР, без BiP в модели {f} % сенсоров.", "s2_c_base_z": "Состояние близко к исходному равновесию: ёмкость ЭПР соответствует притоку развёрнутых белков, и ни одна ветвь UPR не достигает порога активности.", "s2_c_mid": "Отношение нагрузки к ёмкости возросло до {r}: сенсоров без BiP в модели стало {f} %.", "s2_c_mid_z": "Чем больше несоответствие нагрузки и ёмкости, тем больше сенсоров без BiP и тем выше активность ветвей; в модели порог IRE1α ниже порога ATF6, а порог ATF6 ниже порога PERK, которая тормозит трансляцию и снижает приток новых белков.", "s2_c_high": "Отношение нагрузки к ёмкости возросло до {r}: несоответствие выражено, без BiP в модели {f} % сенсоров.", "s2_c_high_z": "Ветви действуют по-разному: PERK быстро снижает приток новых белков торможением трансляции, а IRE1α и ATF6 через гены шаперонов повышают ёмкость ЭПР, но медленнее, потому что для роста ёмкости нужны транскрипция, синтез и накопление белков.", "s2_c_tail_z": "Снижение активности ветвей запаздывает по сравнению с уменьшением отношения нагрузки к ёмкости: активные формы IRE1α и ATF6f исчезают за часы, а не мгновенно, поэтому сигнал сохраняется после того, как несоответствие уменьшилось.", "s2_c_fade_z": "Несоответствие сохраняется, но активность ветвей уже снизилась: в модели IRE1α переходит в рефрактерное состояние, а пул полноразмерного ATF6 расходуется; такое затухание IRE1α и ATF6 при стойком стрессе описано в клетках HEK293 (Lin 2007; Sundaram 2018).", "s2_c_lag_z": "Ответ ветвей отстаёт от изменения нагрузки: активные формы сенсоров накапливаются не мгновенно, а за минуты и часы, поэтому к этому моменту ни одна ветвь не достигла порога.", "s2_c_sub_z": "При таком отношении нагрузки к ёмкости ни одна ветвь не достигает порога, указанного под показаниями; в модели порог IRE1α ниже порога ATF6, а порог ATF6 ниже порога PERK.", "s2_c_b0": "Все три ветви ниже порога: активность PERK {p} % максимума, XBP1s {x} % мРНК XBP1, ATF6f {a} % максимума.", "s2_c_b": "Активность выше порога у ветвей: {list}; остальные ветви ниже порога.", "s2_c_b3": "Активность выше порога у всех трёх ветвей: {list}.", "s2_br_perk": "PERK (активность {p} % максимума)", "s2_br_ire1": "IRE1α (сплайсировано {x} % мРНК XBP1)", "s2_br_atf6": "ATF6 (ATF6f {a} % максимума)", "s2_c_perk": "Активная PERK фосфорилирует eIF2α (p-eIF2α {pe} %), общая трансляция снижена до {tl} % исходной, и приток новых белков в ЭПР уменьшается.", "s2_c_cap": "Усиление экспрессии генов-мишеней XBP1s и ATF6f (генов шаперонов и белков ERAD) медленно повышает ёмкость ЭПР: к {t} индукция увеличила её в {ci} относительно значения, заданного ползунком «Ёмкость».", "lg_u_unf": "красная ломаная — развёрнутый белок; число значков иллюстрирует нагрузку и не равно числу молекул", "lg_u_chap": "бирюзовый круг — шаперон; число кругов иллюстрирует ёмкость ЭПР", "lg_u_bip": "BiP у сенсора — упрощённая «модель отрыва BiP»: сдвиг и бледность круга показывают долю сенсоров без BiP (одинаковую для всех трёх сенсоров); BiP — один из регуляторов, не единственный", "lg_u_fb": "пунктир — обратная связь: торможение трансляции уменьшает приток белков в ЭПР, а усиление экспрессии генов шаперонов повышает их содержание; толщина показывает величину", "s2b_load": "Нагрузка (поток развёрнутых белков)", "s2b_cap": "Ёмкость (шапероны, BiP)", "s2b_ref": "Серая метка — исходное состояние (нагрузка ×1, ёмкость ×1) в тот же момент. Доля сенсоров без BiP — упрощённая «модель отрыва BiP» (см. «Что упрощено»). В подписи ветвь названа активной, если активность PERK не ниже 20 % максимума, XBP1s не ниже 10 %, ATF6f не ниже 20 % максимума.", "s2b_take": "Сигнал UPR задаёт отношение нагрузки к ёмкости ЭПР, а не нагрузка сама по себе: при том же притоке развёрнутых белков большая ёмкость уменьшает долю сенсоров без BiP и активность ветвей. Ветви различаются по порогу и по скорости: PERK быстро снижает приток новых белков, IRE1α и ATF6 медленно повышают ёмкость через гены шаперонов. Доля сенсоров без BiP — упрощение: BiP не единственный регулятор.", "s2b_when_6": "Прогноз на момент 6 ч после изменения; ось времени — учебная модель.", "s2b_when_24": "Прогноз на момент 24 ч после повышения притока (сейчас показаны 2 ч); ось времени — учебная модель.", "p2b_1_q": "В клетках в исходном состоянии приток развёрнутых белков в ЭПР утроили. Как изменится отношение нагрузки к ёмкости ЭПР через 6 ч?", "p2b_1_o1": "Вырастет втрое: нагрузка утроится, а ёмкость ЭПР за это время не изменится.", "p2b_1_o2": "Вырастет меньше чем втрое: за это время повысится ёмкость ЭПР.", "p2b_1_o3": "Не изменится: шапероны немедленно уравновесят возросший приток белков.", "p2b_1_k": "Рост притока белков увеличивает долю сенсоров без BiP, активные IRE1α и ATF6 повышают транскрипцию генов шаперонов, и ёмкость ЭПР растёт; поэтому отношение нагрузки к ёмкости увеличивается меньше, чем приток.", "p2b_1_e": "В модели через 6 ч после утроения притока нагрузка/ёмкость равна 1,8 (исходно 1,0), доля сенсоров без BiP — 21 % (исходно 8 %). Ёмкость ЭПР выросла до ×1,6, потому что активны IRE1α (сплайсировано 22 % мРНК XBP1) и ATF6 (ATF6f 14 % максимума), а их мишени повышают содержание шаперонов. Общая трансляция к этому сроку почти вернулась к исходной (90 %): торможение, вызванное PERK, было выраженным в первые часы и ослабло, когда ёмкость выросла. Вклад XBP1s и ATF6f в рост ёмкости принят в модели равным (работы расходятся: Lee 2003; Yamamoto 2007), скорость подъёма подобрана по срокам пика мРНК BiP в клетках HEK293 (Lin 2007). Все числа — условные индексы модели, а не измерения.", "p2b_1_w1": "Вариант учитывает только числитель отношения. Ёмкость ЭПР сама зависит от стресса: активные IRE1α и ATF6 повышают транскрипцию генов шаперонов, и за часы ёмкость растёт. Утроение отношения возможно, пока индукция не началась, но через 6 ч это уже не так.", "p2b_1_w3": "Исходный запас ёмкости ограничен, поэтому утроенный приток увеличивает долю сенсоров без BiP — именно это и служит сигналом UPR. Выравнивание наступает позже, когда мишени XBP1s и ATF6f повышают содержание шаперонов, и даже тогда отношение остаётся выше исходного.", "p2b_2_q": "Сравнивают две культуры клеток с утроенным притоком развёрнутых белков. В первой ёмкость ЭПР исходная, во второй содержание шаперонов удвоено. Как через 6 ч во второй культуре изменится доля сплайсированной мРНК XBP1 по сравнению с первой?", "p2b_2_o1": "Не изменится: приток развёрнутых белков по-прежнему утроен, и сигнал IRE1α тот же.", "p2b_2_o2": "Исчезнет: при удвоенной ёмкости ЭПР сплайсинг мРНК XBP1 полностью прекращается.", "p2b_2_o3": "Снизится, но не до исходной: отношение нагрузки к ёмкости станет меньше.", "p2b_2_k": "Больше шаперонов связывает больше развёрнутых белков, поэтому меньше сенсоров IRE1α теряет связь с BiP, образуется меньше олигомеров IRE1α и снижается доля сплайсированной мРНК XBP1; остаточное несоответствие сохраняет часть сигнала.", "p2b_2_e": "В модели при утроенном притоке и исходной ёмкости через 6 ч сплайсировано 22 % мРНК XBP1 (нагрузка/ёмкость 1,8),
