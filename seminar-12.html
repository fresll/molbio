етно снижен, COX II ещё сохранён, mt-Keima начинает расти.", "s2a_c_wt4_z": "Белки внешней мембраны, которые метит Parkin, исчезают раньше белков внутренней мембраны: первые разрушает протеасома, вторые исчезают лишь вместе с митохондрией в лизосоме (Chan 2011; Tanaka 2010).", "s2a_c_wt24": "Дикий тип, CCCP 24 ч. TOMM20 и COX II в основном исчезли, mt-Keima высокий: большая часть митохондрий доставлена в лизосомы. Убиквитинированного MFN2 уже нет, потому что исчез сам MFN2. PINK1 и pS65-Ub остаются высокими на оставшихся митохондриях.", "s2a_c_wt24_z": "Убыль белка внутренней мембраны вместе с красным mt-Keima отличает митофагию от распада одних белков внешней мембраны.", "s2a_c_pink1ko": "PINK1⁻/⁻, CCCP {t} ч. Потенциал утрачен, но PINK1 нет, поэтому нет и pS65-Ub. Parkin остаётся в цитозоле неактивным (на схеме смещён вверх), MFN2 не убиквитинирован, MFN2, TOMM20 и COX II сохранены, mt-Keima низкий. Митофагия не запускается.", "s2a_c_pink1ko_z": "Выпадение звена в начале пути выключает все показатели ниже: нет киназы, нет метки (Narendra 2010).", "s2a_c_parkinko": "Parkin⁻/⁻, CCCP {t} ч. PINK1 накоплен и автофосфорилирован, но убиквитина на поверхности мало, поэтому pS65-Ub низкий. Parkin нет: MFN2 не убиквитинирован и не разрушается, TOMM20 и COX II сохранены, mt-Keima низкий.", "s2a_c_parkinko_z": "PINK1 действует и без Parkin, но плотная метка нарастает в основном благодаря Parkin: PINK1 находит субстрат, а плотную метку для рецепторов создаёт Parkin (Ordureau 2014).", "s2a_c_c431s": "Parkin C431S, CCCP {t} ч. PINK1 накоплен, но мутант без каталитического цистеина почти не привлекается к митохондрии (на схеме остаётся вверху) и цепей не ставит: убиквитинированного MFN2 нет, pS65-Ub низкий, MFN2, TOMM20 и COX II сохранены, mt-Keima низкий.", "s2a_c_c431s_z": "Нужна именно лигазная активность Parkin: от неё зависят и метка, и закрепление самого Parkin на митохондрии через обратную связь (Ordureau 2014).", "s2a_c_s65a": "Parkin S65A, CCCP {t} ч. В UBL нет серина 65, и PINK1 не может поставить там фосфат. Активация ослаблена и запаздывает: pS65-Ub слабее, чем в диком типе за тот же срок, убиквитинированного MFN2 за 1 ч меньше, но он дольше сохраняется, потому что сам MFN2 убывает медленнее; TOMM20 и COX II снижаются позже, mt-Keima ниже.", "s2a_c_s65a_z": "Фосфорилирование убиквитина активирует Parkin, но для полного ответа нужно и фосфорилирование его UBL (Shiba-Fukushima 2012; Kane 2014).", "s2a_c_usp30ko": "USP30⁻/⁻, CCCP {t} ч. Без деубиквитиназы метка накапливается быстрее: pS65-Ub сильнее, чем в диком типе за тот же срок. Убиквитинированного MFN2 в первый час больше, а затем он убывает вместе с самим MFN2, который убывает раньше; mt-Keima выше.", "s2a_c_usp30ko_z": "USP30 тормозит работу Parkin, поэтому без неё сигнал нарастает быстрее (Bingol 2014). В первоисточнике USP30 подавляли нокдауном.", "s2a_c_usp30ko24": "USP30⁻/⁻, CCCP 24 ч. К 24 ч метка плотная и в диком типе, поэтому различия в pS65-Ub и MFN2 малы. Но COX II снижен глубже, а mt-Keima выше, чем в диком типе: доставлено больше митохондрий.", "s2a_c_usp30ko24_z": "Влияние USP30 заметнее в скорости и в итоговой доле удалённых митохондрий, чем в самом наличии метки.", "s2a_c_penta": "Без 5 рецепторов (NDP52, OPTN, TAX1BP1, NBR1, p62), CCCP {t} ч. Путь до рецепторов не нарушен: PINK1 накоплен, pS65-Ub и убиквитинированный MFN2 есть, MFN2 и TOMM20 убывают как в диком типе (Lazarou 2015). Рецепторов, которые связали бы метку с фагофором, нет, поэтому mt-Keima остаётся низким.", "s2a_c_penta_z": "На ранних сроках блот не отличает этот вариант от дикого типа: различие появляется в строках, которые отражают митофагию, то есть COX II и mt-Keima, к 24 ч. В работе Lazarou 2015 митофагию в этих клетках измеряли по COX II; значение mt-Keima для этого варианта здесь учебное.", "s2a_c_penta24": "Без 5 рецепторов, CCCP 24 ч. TOMM20 убыл, как в диком типе: его метит Parkin и разрушает протеасома. COX II сохранён, mt-Keima остаётся низким: митохондрии в лизосомы не доставляются.", "s2a_c_penta24_z": "Убыль TOMM20 одна митофагию не подтверждает: без рецепторов она идёт, а митофагии нет (Lazarou 2015). В этой системе митофагию подтверждают убыль белка внутренней мембраны или матрикса в сочетании с доставкой митохондриального материала в кислый отсек, регистрируемой с помощью mt-Keima.", "s2a_take": "Блот показывает, на каком звене путь прерван: нет PINK1, нет метки; нет Parkin или его активности, PINK1 накоплен, а метка не растёт; нет рецепторов, метка и распад белков внешней мембраны есть, а митохондрии в лизосому не доставляются. Одна строка блота митофагию не подтверждает: нужен признак доставки в лизосому (COX II, mt-Keima). Митофагия бывает и без PINK1 и Parkin.", "gn_q2_mfn2": "MFN2", "g_q2_mfn2": "Митофузин 2 — белок внешней мембраны митохондрии, участвует в слиянии. Одна из первых мишеней Parkin: после деполяризации MFN2 убиквитинируется, его извлекает из мембраны p97 (VCP), и разрушает протеасома (Tanaka 2010; Chan 2011). Поэтому на блоте сначала появляется «лестница» убиквитинированных форм, затем исчезает сам MFN2. Убыль MFN2 показывает работу Parkin и протеасомы; митофагию она не подтверждает.", "gn_q2_tomm20": "TOMM20", "g_q2_tomm20": "Рецептор комплекса TOM во внешней мембране. После деполяризации в клетках с активным Parkin его уровень снижается: белок убиквитинируется и разрушается протеасомой (Chan 2011; Lazarou 2015). В клетках без пяти рецепторов TOMM20 разрушается так же, как в диком типе, а митофагии нет. Поэтому потеря TOMM20 не подтверждает митофагию.", "gn_q2_cox2": "COX II", "g_q2_cox2": "Субъединица II цитохром-c-оксидазы (MT-CO2): белок внутренней мембраны, кодируется митохондриальной ДНК. После деполяризации в клетках с Parkin его убыль отражает доставку митохондрий в лизосомы: COX II разрушается в клетках дикого типа с Parkin, но не в клетках без пяти рецепторов и не в клетках без ATG5 (Lazarou 2015). Ограничение: блот измеряет суммарную убыль белка, а не судьбу отдельных митохондрий; для уверенности нужен ингибитор лизосомы или другой независимый признак.", "gn_q2_rec": "OPTN и NDP52", "g_q2_rec": "Рецепторы аутофагии: узнают убиквитин и pS65-Ub на митохондрии и связывают ATG8 и инициирующие комплексы (вопрос 1). В клетках HeLa с Parkin основными рецепторами митофагии служат NDP52 и OPTN; роль TAX1BP1, NBR1 и p62 меньше (Lazarou 2015). В варианте «без 5 рецепторов» нет всех пяти.", "gn_q2_lyso": "Лизосома", "g_q2_lyso": "Органелла с кислой средой и гидролазами. Аутофагосома с митохондрией сливается с лизосомой, и содержимое разрушается. Кислая среда лизосомы меняет цвет mt-Keima, поэтому mt-Keima показывает именно доставку.", "gn_q2_keima": "mt-Keima", "g_q2_keima": "Флуоресцентный белок Keima, направленный в митохондрии. Он устойчив к кислоте и по-разному флуоресцирует при нейтральном и кислом pH (Katayama 2011), поэтому митохондрии в лизосоме на изображении красные, а в цитозоле зелёные (условные цвета). Метод показывает доставку в кислую среду, но не говорит, какой путь её запустил. На схеме доля красных митохондрий условная.", "p2a_1_q": "Дорожка 1: клетки HeLa с Parkin через 1 ч CCCP; PINK1, pS65-Ub и убиквитинированный MFN2 хорошо видны. Ген PINK1 выключили (PINK1⁻/⁻), остальное прежнее. Что покажет вторая дорожка?", "p2a_1_o1": "Исчезнут PINK1, pS65-Ub и Ub-MFN2: без PINK1 Parkin остаётся неактивным", "p2a_1_o2": "Исчезнут PINK1 и pS65-Ub, а Ub-MFN2 сохранится: Parkin активируется и без PINK1", "p2a_1_o3": "Исчезнет только PINK1: pS65-Ub ставит другая киназа", "p2a_1_e": "PINK1 — установленная киназа, которая ставит фосфат на S65 убиквитина; она же фосфорилирует UBL Parkin. Без PINK1 прироста pS65-Ub после деполяризации нет (Ordureau 2014), Parkin остаётся в цитозоле в неактивной форме (Narendra 2010), и MFN2 не убиквитинируется. Это самое верхнее звено пути: его выпадение выключает все показатели ниже.", "p2a_1_w2": "Для активации Parkin нужны связывание с pS65-Ub и фосфорилирование его UBL, и обе реакции зависят от PINK1; без него Parkin остаётся автоингибированным (Koyano 2014; Gladkova 2018).", "p2a_1_w3": "Другого источника pS65-Ub в этой системе не показано: в клетках без PINK1 прирост pS65-Ub после деполяризации не выявляется (Ordureau 2014), а киназой, которая ставит этот фосфат на убиквитин, в литературе описана PINK1.", "p2a_2_q": "Дорожка 1: дикий тип, 1 ч CCCP. Parkin заменили мутантом C431S без каталитического цистеина, остальное прежнее. Что покажет вторая дорожка?", "p2a_2_o1": "Всё как в диком типе: MFN2 убиквитинируют другие лигазы", "p2a_2_o2": "PINK1 накоплен, Ub-MFN2 нет, pS65-Ub мало: новых цепей Parkin не ставит", "p2a_2_o3": "PINK1 не накапливается: без активного Parkin нет сигнала, который его стабилизирует", "p2a_2_e": "C431 — каталитический остаток: мутант не присоединяет убиквитин к MFN2 и другим белкам внешней мембраны. PINK1 лежит выше Parkin и накапливается, но новых цепей нет, поэтому фосфорилировать почти нечего и pS65-Ub мало. По данным Ordureau 2014, мутанты C431F и C431S не убиквитинируют MFN2, прирост убиквитина на митохондриях при них мал, а привлечение к митохондриям сильно снижено.", "p2a_2_w1": "Для убиквитинирования MFN2 после деполяризации нужен именно Parkin (Tanaka 2010); при каталитически мёртвом Parkin MFN2 в этой системе не модифицируется (Ordureau 2014).", "p2a_2_w3": "Накопление PINK1 определяет остановка импорта, а не Parkin: Parkin лежит ниже по пути, и PINK1 накапливается в клетках с Parkin и без него одинаково (Narendra 2010).", "p2a_3_q": "Дорожка 1: дикий тип, 1 ч CCCP. Выключили ген USP30 (USP30⁻/⁻), остальное прежнее. Как изменятся pS65-Ub и убиквитинированный MFN2 на второй дорожке?", "p2a_3_o1": "Не изменятся: USP30 не действует на метку, которую ставит Parkin", "p2a_3_o2": "Станут слабее: USP30 нужна Parkin для постановки цепей", "p2a_3_o3": "Станут сильнее: цепи, которые ставит Parkin, снимаются медленнее", "p2a_3_e": "USP30 снимает убиквитин с белков внешней мембраны и противодействует Parkin (Bingol 2014). Без неё метка накапливается быстрее: на второй дорожке pS65-Ub и Ub-MFN2 сильнее, чем в диком типе за тот же срок, а несшитого MFN2 меньше. К 24 ч разница сглаживается, потому что метка плотная и в диком типе. В первоисточнике USP30 подавляли нокдауном, а не нокаутом.", "p2a_3_w1": "USP30 — деубиквитиназа внешней мембраны, и её субстраты включают мишени Parkin (Bingol 2014). Потеря фермента должна менять баланс «поставили, сняли», а не оставлять его прежним.", "p2a_3_w2": "USP30 не помогает Parkin, а противодействует ему: она убирает цепи. Потеря фермента ослабляет снятие и поэтому усиливает метку.", "p2a_4_q": "Дорожка 1: дикий тип, 1 ч CCCP. Parkin заменили мутантом S65A: в UBL серин 65 заменён на аланин, и PINK1 не может поставить там фосфат. Что покажет вторая дорожка?", "p2a_4_o1": "pS65-Ub и Ub-MFN2 слабее, чем в диком типе: активация Parkin ослаблена, но не исчезла", "p2a_4_o2": "Всё как в диком типе: фосфорилирования убиквитина достаточно для полной активации", "p2a_4_o3": "Ub-MFN2 нет совсем: без фосфата в UBL Parkin неактивен", "p2a_4_e": "Для полной активации Parkin нужны два фосфата, которые ставит PINK1: на убиквитине (S65) и на UBL самого Parkin. Без второго Parkin активируется слабее и позже: перемещение Parkin запаздывает (Shiba-Fukushima 2012; Kane 2014), а прирост убиквитина на митохондриях за 1 ч мал (Ordureau 2014), поэтому pS65-Ub и Ub-MFN2 на второй дорожке слабее. Работы различаются по степени ослабления: в части клеток Parkin S65A всё же приходит на митохондрии (Kane 2014). Уровни на блоте качественные и учебные.", "p2a_4_w2": "Одного фосфата на убиквитине для полной активации не хватает: у мутанта S65A активация Parkin ослаблена и запаздывает (Shiba-Fukushima 2012; Kane 2014).", "p2a_4_w3": "Фосфорилирование UBL усиливает активацию, но не заменяет pS65-Ub: Parkin S65A сохраняет остаточную активность, потому что pS65-Ub уже активирует его (Kane 2014). Поэтому полное отсутствие метки — слишком сильный вывод.", "p2a_5_q": "Дорожка 1: дикий тип, 24 ч CCCP: TOMM20 и COX II убыли, mt-Keima высокий. Взяли клетки без пяти рецепторов (NDP52, OPTN, TAX1BP1, NBR1, p62), те же 24 ч. Что покажут строки TOMM20 и COX II?", "p2a_5_o1": "TOMM20 и COX II сохранятся: без рецепторов нет метки и распада", "p2a_5_o2": "TOMM20 убудет, COX II сохранится: белок внешней мембраны разрушает протеасома, а митофагия остановлена", "p2a_5_o3": "TOMM20 и COX II убудут, как в диком типе: убыль белков от рецепторов не зависит", "p2a_5_e": "Метка создаётся без рецепторов: Parkin активен, и белки внешней мембраны (MFN1, TOMM20) разрушаются протеасомой так же, как в диком типе (Lazarou 2015). COX II — белок внутренней мембраны, он исчезает вместе с митохондрией в лизосоме. Без пяти рецепторов COX II сохраняется, mt-Keima остаётся низким. Поэтому убыль TOMM20 одна митофагию не подтверждает.", "p2a_5_w1": "Убыль TOMM20 не требует рецепторов: белок метит Parkin, а разрушает протеасома. Рецепторы нужны для следующего шага, привлечения аутофагического аппарата к метке.", "p2a_5_w3": "COX II исчезает при доставке митохондрии в лизосому, а этот этап без рецепторов не идёт: в клетках дикого типа с Parkin COX II разрушается, а без пяти рецепторов нет (Lazarou 2015).", "p2a_6_q": "Дорожка 1 — контроль без воздействия, дорожка 2 — образец X (воздействие скрыто, 24 ч). В образце X нет PINK1, pS65-Ub и убиквитинированного MFN2, белки TOMM20 и COX II убыли, а доля красных митохондрий (mt-Keima) высокая. Какой вывод допускает эта картина?", "p2a_6_o1": "Митофагия идёт по пути PINK1–Parkin: PINK1 и метки пути просто не выявлены на этом блоте", "p2a_6_o2": "Митофагии нет: белки убыли из-за распада в протеасоме, а красный цвет mt-Keima не имеет значения", "p2a_6_o3": "Митофагия идёт, но признаков работы пути PINK1–Parkin на этом сроке нет; независимость от него проверяют в клетках без PINK1 или Parkin", "p2a_6_e": "В образце X митохондрии доставлены в кислый отсек (mt-Keima красный, COX II убыл), а признаков работы пути PINK1–Parkin на этом сроке нет: PINK1 не накоплен, нет pS65-Ub и убиквитинированного MFN2. Это наблюдение, а не доказательство независимости: на одном позднем сроке нельзя исключить ранней кратковременной активации пути, которая к этому времени прекратилась. Независимость проверяют отдельно: доставка в лизосомы должна сохраняться в клетках без PINK1 или без Parkin при надлежащих контролях. Раскрытие: образец X — клетки с DFP, хелатором железа. В работе Allen 2013 при DFP PINK1 не накапливался, а митофагия сохранялась при подавлении PINK1 и в клетках без Parkin; поэтому для DFP независимость показана отдельными экспериментами, а не одним блотом. Другие PINK1–Parkin-независимые пути по этому блоту от DFP не отличить: при гипоксии, например, митофагию обеспечивают рецепторы BNIP3 и NIX (Terešak 2022), а при DFP подавление BNIP3 митофагию не меняло (Allen 2013).", "p2a_6_w1": "Отсутствие PINK1, pS65-Ub и Ub-MFN2 на позднем сроке не показывает, что путь работает: при его активности PINK1 накапливается на деполяризованных митохондриях и хорошо виден на блоте, как на дорожках других вариантов. Объяснять отсутствие сигналов тем, что их «просто не выявили», значит заменять наблюдение предположением; но и вывод о независимости от пути по одному блоту был бы преждевременным.", "p2a_6_w2": "Протеасома объясняет убыль белка внешней мембраны, но не белка внутренней мембраны COX II. Красный mt-Keima показывает, что митохондрии находятся в кислой среде лизосомы, то есть прямо указывает на доставку.", "s3_tm25": "15 мин", "s3_tm1": "1 ч", "s3_tm4": "4 ч", "s3_tm8": "8 ч", "s3_tm24": "24 ч", "s3b_celT": "Клетка через {t} после импульса LLOMe · доза {d} % от максимальной", "s3b_lg1": "целая лизосома", "s3b_lg2g": "метка галектина-3:", "s3b_lg2g2": "крупное повреждение", "s3b_lg2l": "сигнал LysoTracker", "s3b_lg2l2": "утрачен", "s3b_lg3": "места без лизосомы", "s3b_lg4": "TFEB (ядро / цитозоль)", "s3b_lg5g": "Малые повреждения не метятся", "s3b_lg5g2": "галектином-3: выглядят целыми", "s3b_lg5l": "Сигнал утрачен у всех повреждённых", "s3b_lg5l2": "лизосом: малых и крупных", "s3b_src_a": "Повреждено", "s3b_src_b": "в момент 0", "s3b_srcS": "от всех лизосом", "s3b_l1": "Ремонт мембраны", "s3b_l1s": "ESCRT-III · минуты", "s3b_o1": "Отремонтировано", "s3b_l2": "Лизофагия", "s3b_l2s": "убиквитин · захват · часы", "s3b_o2": "Удалено", "s3b_l3": "Ответ TFEB", "s3b_l3s": "новые лизосомы · часы", "s3b_o3": "Новые лизосомы", "s3b_lgd": "Щелчок по лизосоме, ядру или процессу — справка.", "s3b_dose": "Доза LLOMe (% от максимальной учебной)", "s3b_tm_t": "Срок после импульса", "s3b_esc": "Ремонт ESCRT-III", "s3b_lys": "Лизофагия", "s3b_tfeb": "TFEB", "s3b_mk_t": "Чем регистрируют повреждение", "s3b_mk_gal": "Галектин-3", "s3b_mk_lyt": "LysoTracker", "s3b_plotcap": "Доли от исходного числа лизосом. Ось времени сжата (корень из времени), чтобы первый час был виден так же, как сутки; вертикальная линия — выбранный срок. Учебная модель.", "s3b_pl_p": "общий пул лизосом", "s3b_pl_p0": "пул при включённых процессах", "s3b_pl_d": "повреждённые (по выбранному методу)", "s3b_pl_t": "TFEB в ядре", "s3b_r_d": "С меткой галектина-3 (% от исходного числа лизосом)", "s3b_r_dl": "Без сигнала LysoTracker (% от исходного числа лизосом)", "s3b_r_r": "Отремонтировано, накоплено (% от исходного числа)", "s3b_r_x": "Удалено лизофагией, накоплено (% от исходного числа)", "s3b_r_p": "Общий пул лизосом (% от исходного)", "s3b_r_pl": "из них целых лизосом: {l} %", "s3b_r_t": "TFEB в ядре (% всего TFEB клетки)", "s3b_r_t0": "белка нет", "s3b_r_fate": "Судьба повреждённых лизосом", "s3b_r_fate_s": "отремонтированы {a} % · ещё повреждены {b} % · удалены {c} %", "s3b_r_fate0": "повреждения нет", "s3b_c_n0": "Импульса LLOMe не было: все лизосомы не повреждены, галектин-3 остаётся в цитозоле, повреждённых лизосом нет, ремонт и удаление не нужны, пул лизосом равен исходному.", "s3b_c_n0_z": "Это нулевая точка: показатели повреждения и ответа считаются от неё. Прибавьте дозу и сравните, как меняются доли отремонтированных и удалённых лизосом.", "s3b_c_small_z": "При малой дозе повреждено мало лизосом, поэтому различия между режимами на кривых и в показателях малы, и по ним трудно судить о роли отдельной ступени. Увеличьте дозу, чтобы выключенная ступень проявилась.", "s3b_c_ok": "Через {t} после импульса LLOMe: исходно повреждено {dm} % лизосом. Сейчас по методу «{m}» повреждены {d} %; отремонтировано {r} %, удалено лизофагией {x} %; общий пул {p} % от исходного, TFEB в ядре {tf} %.", "s3b_c_ok_z": "Работают три ступени. За минуты ремонт возвращает в строй часть лизосом; повреждённые лизосомы, получившие убиквитин, часы спустя удаляет лизофагия; ответ TFEB с задержкой достраивает пул новыми лизосомами. Поэтому доля повреждённых со временем падает, а пул сначала уменьшается, затем частично восстанавливается.", "s3b_c_e": "Ремонт ESCRT-III выключен (в модели остаётся малая доля его активности). Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %, TFEB в ядре {tf} %.", "s3b_c_e_z": "Меньше разрывов закрывается за минуты, поэтому больше лизосом остаётся повреждёнными, получает убиквитин и уходит в лизофагию. За часы пул уменьшается сильнее, чем при работающем ремонте (сравните с пунктирной кривой).", "s3b_c_l": "Лизофагия выключена: убиквитин на повреждённых лизосомах ставится, но захвата аутофагосомой нет. Через {t}: по методу «{m}» повреждены {d} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %, TFEB в ядре {tf} %.", "s3b_c_l_z": "Помеченные повреждённые лизосомы остаются в клетке: число органелл не уменьшается, но повреждённые работают плохо, поэтому, пока они есть, целых лизосом меньше, чем пул. Пока такие лизосомы есть, сигнал повреждения не гаснет, и TFEB остаётся в ядре дольше, чем при работающей лизофагии.", "s3b_c_f": "TFEB нет (нокаут): в ядре его нет, программа образования лизосом не включается. Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %.", "s3b_c_f_z": "Ремонт и лизофагия идут без TFEB, но пул пополняется только с базовой скоростью (учебное допущение), поэтому в течение суток он остаётся ниже, чем при ответе TFEB, и восстанавливается медленнее.", "s3b_c_el": "Ремонт ESCRT-III и лизофагия выключены. Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %, TFEB в ядре {tf} %.", "s3b_c_el_z": "Ремонт закрывает меньшую долю разрывов, а метки не приводят к захвату, поэтому повреждённые лизосомы накапливаются. Число органелл сохраняется, но целых лизосом остаётся меньше, а TFEB остаётся в ядре, пока повреждение не исчезло.", "s3b_c_ef": "Ремонт ESCRT-III и TFEB выключены. Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %.", "s3b_c_ef_z": "Не закрытые ремонтом лизосомы уходят в лизофагию, а программа TFEB не пополняет пул. Поэтому пул падает глубже, чем при одном выключенном процессе, и восстанавливается медленнее.", "s3b_c_lf": "Лизофагия и TFEB выключены. Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %.", "s3b_c_lf_z": "Ничто не удаляет повреждённые лизосомы и не добавляет новые: число органелл остаётся исходным, а целых лизосом меньше на долю тех, что не были отремонтированы.", "s3b_c_elf": "Ремонт ESCRT-III, лизофагия и TFEB выключены. Через {t}: по методу «{m}» повреждены {d} %, отремонтировано {r} %, удалено {x} %; общий пул {p} %, целых лизосом {l} %.", "s3b_c_elf_z": "Остаётся лишь слабый остаточный ремонт. Повреждённые лизосомы не удаляются и не заменяются: число органелл исходное, а целых лизосом меньше на долю неотремонтированных.", "s3b_take": "Как в вопросах 1 и 2, повреждённая органелла получает убиквитиновую метку, а рецепторы строят вокруг неё фагофор; у лизосомы добавляются две ступени. Первая — ремонт мембраны за минуты. Вторая — образование новых лизосом по программе TFEB. Сколько повреждённых лизосом возвращается в строй, а сколько удаляется, в модели задано лишь дозой; в клетке критерий выбора между ремонтом и удалением неизвестен (Meyer & Kravic 2024). Галектин-3 и LysoTracker измеряют разные признаки, поэтому их показания не совпадают.", "p3b_1_q": "Доза LLOMe 20 % от максимальной, срок 24 ч, все процессы включены. Дозу повышают до 80 %. В модели ёмкость ремонта ограничена: скорость ремонта в расчёте на одну лизосому падает с ростом числа повреждённых. Как изменится доля удалённых лизофагией среди всех повреждённых лизосом (полоса «Судьба повреждённых лизосом»)?", "p3b_1_o1": "Уменьшится: при большем повреждении ремонт закрывает больше разрывов за то же время", "p3b_1_o2": "Увеличится: больше лизосом не успевает пройти ремонт и получает метку убиквитина", "p3b_1_o3": "Не изменится: соотношение ремонта и удаления не зависит от дозы повреждения", "p3b_1_e": "Ремонтная система работает с конечной скоростью, а метку убиквитина лизосома получает с постоянной. При дозе 20 % ремонт закрывает почти все разрывы, и удаляется около 6 % повреждённых лизосом; при дозе 80 % — около 32 %. Что именно переводит лизосому от ремонта к удалению в клетке, неизвестно (Meyer & Kravic 2024); модель воспроизводит лишь зависимость от дозы, ограниченную ёмкость ремонта — учебное допущение.", "p3b_1_w1": "Такой результат был бы у системы, ремонт которой не насыщается. В модели при росте числа повреждённых лизосом на каждую приходится меньше ремонтной активности, поэтому закрытых разрывов доля не растёт.", "p3b_1_w3": "Доли ремонта и удаления не заданы заранее: они складываются из конкуренции двух процессов. Когда ремонт насыщается, а метка ставится с прежней скоростью, соотношение сдвигается в сторону удаления.", "p3b_2_q": "Доза 80 %, срок 1 ч. Сравнивают культуру со всеми процессами и параллельную культуру, в которой ремонт ESCRT-III подавлен с начала эксперимента (остаётся малая доля активности — учебное значение). Как в этой культуре изменится доля лизосом с меткой галектина-3 (% от исходного числа лизосом)?", "p3b_2_o1": "Уменьшится: без ремонта лизосомы быстрее удаляются, и метки становится меньше", "p3b_2_o2": "Не изменится: галектин-3 метит только те повреждения, которые ESCRT-III и так не закрывает", "p3b_2_o3": "Увеличится: часть повреждений, которые обычно закрываются за минуты, остаётся открытой", "p3b_2_e": "ESCRT-III собирается на цитозольной стороне повреждённой мембраны в течение минут и участвует в закрытии разрывов (Skowyra 2018; Radulovic 2018; клетки HeLa). В модели он даёт основной вклад в скорость ремонта, поэтому без него закрывается меньшая часть повреждённых лизосом, и через 1 ч с галектином-3 остаётся около 32 % лизосом вместо 16 % в контроле. Удаление лизофагией к этому сроку только начинается, и метка ещё не исчезает.", "p3b_2_w1": "Лизофагия занимает часы: за 1 ч захват только начинается. Поэтому без ремонта метка за этот срок не падает, а растёт.", "p3b_2_w2": "Метка галектина-3 показывает, что гликаны просвета открыты, но не означает, что повреждение не поддаётся ремонту: галектины служат меткой и целостности мембраны, и ремонта, и удаления лизосом (Meyer & Kravic 2024). В модели ESCRT-III ремонтирует и такие лизосомы, поэтому при его выключении их остаётся больше.", "p3b_3_q": "Ремонт ESCRT-III выключен с начала эксперимента, доза 80 %. Показания снимают в той же культуре через 1 ч и через 4 ч. Как общий пул лизосом через 4 ч соотносится с пунктирной кривой, где все процессы включены?", "p3b_3_o1": "Ниже: не закрытые ремонтом лизосомы удаляются лизофагией", "p3b_3_o2": "Выше: усиленный сигнал повреждения быстрее пополняет пул через TFEB", "p3b_3_o3": "Такой же: ремонт меняет метку галектина-3, но не число лизосом", "p3b_3_e": "Лизосомы, не закрытые ремонтом, получают убиквитин и захватываются аутофагосомой: за 4 ч удалено около 34 % исходного числа лизосом вместо 22 % при работающем ремонте. Образование новых лизосом по программе TFEB идёт с задержкой в несколько часов (учебное допущение) и потерю ещё не покрывает: пул около 77 % вместо 85 %.", "p3b_3_w2": "TFEB в ядре при выключенном ремонте действительно выше (около 43 % вместо 33 %), но образование новых лизосом по его программе запаздывает на часы. К сроку 4 ч потери от лизофагии превышают пополнение.", "p3b_3_w3": "Ремонт определяет, сколько повреждённых лизосом дойдёт до удаления. Если ремонт слабее, больше лизосом покидает пул, и разница с пунктирной кривой видна уже к 4 ч.", "p3b_4_q": "В контрольной культуре при дозе 80 % к 24 ч помеченных галектином-3 лизосом почти нет. В параллельной культуре лизофагия подавлена с начала эксперимента (убиквитин присоединяется, захвата аутофагосомой нет). Что покажет метка галектина-3 в этой культуре через 24 ч?", "p3b_4_o1": "Метка исчезнет так же: за сутки ремонт закроет все повреждения", "p3b_4_o2": "Метка сохранится на лизосомах, которые не отремонтированы и не удалены", "p3b_4_o3": "Меток станет больше, чем через 1 ч: без лизофагии повреждение нарастает", "p3b_4_e": "Ремонт возвращает в строй лишь лизосомы, успевшие его получить; в модели помеченные убиквитином ремонта уже не получают и ждут захвата. Без лизофагии они не удаляются: через 24 ч с галектином-3 остаётся около 23 % исходного числа лизосом при нуле в контроле. Общий пул при этом равен 100 %, но целых лизосом около 77 %, а TFEB остаётся в ядре (около 66 % вместо 10 % в контроле).", "p3b_4_w1": "Ремонт и удаление — разные ступени. Лизосомы, прошедшие метку убиквитина, выбывают из ремонта; если их не захватывает аутофагосома, они остаются.", "p3b_4_w3": "Повреждение в модели возникает один раз, в момент 0. Метка может только убывать за счёт ремонта и удаления, поэтому через сутки её не больше, чем через 1 ч.", "p3b_5_q": "При дозе 80 % в клетках с сохранными механизмами ответа общий пул лизосом к 24 ч почти восстановлен. В параллельной культуре TFEB отсутствует вследствие нокаута ещё до повреждения; остальные условия те же. Каким будет общий пул лизосом через 24 ч?", "p3b_5_o1": "Пул не восстановится: без TFEB новые лизосомы не образуются вообще", "p3b_5_o2": "Пул восстановится так же: образование новых лизосом не зависит от TFEB", "p3b_5_o3": "Пул будет ниже, но восстановление идёт: новые лизосомы образуются медленнее", "p3b_5_e": "TFEB повышает экспрессию генов лизосомных белков и ферментов (Settembre 2011); TFE3 действует сходно (Meyer & Kravic 2024). В модели без TFEB сохраняется базовая скорость образования лизосом (учебное допущение), поэтому пул восстанавливается медленнее, но не обращается в ноль: около 85 % вместо 97 % через 24 ч; минимум пула около 79 % вместо 84 %.", "p3b_5_w1": "Лизосомные гены имеют и базовую экспрессию, и другие регуляторы, поэтому без TFEB образование лизосом не прекращается. Пул отстаёт от нормы, но не остаётся на минимуме.", "p3b_5_w2": "В ответ на повреждение TFEB уходит в ядро и усиливает образование лизосом. Если его нет, в модели потерю лизосом при удалении восполняет только базовое образование, и пул отстаёт.", "p3b_6_q": "Доза 25 %, срок 15 мин, повреждение регистрируют по галектину-3. Метод меняют на LysoTracker. Как изменится доля повреждённых лизосом (клетка на схеме и строка показаний)?", "p3b_6_o1": "Уменьшится: LysoTracker выявляет лишь крупные повреждения, а малые остаются незамеченными", "p3b_6_o2": "Увеличится: сигнал теряют и лизосомы с малыми повреждениями, которых галектин-3 не метит", "p3b_6_o3": "Не изменится: оба метода выявляют одни и те же повреждённые лизосомы и дают одну долю", "p3b_6_e": "Галектин-3 связывает гликаны, открывшиеся цитозолю, и отмечает более обширные повреждения (Aits 2015; Meyer & Kravic 2024). LysoTracker накапливается в кислых компартментах, а утечка протонов при малых повреждениях повышает pH (Meyer & Kravic 2024; Barral 2022). В модели через 15 мин с галектином-3 помечено около 4 % лизосом, а без сигнала LysoTracker около 9 %. Красители показывают кислотность и не различают причину её потери.", "p3b_6_w1": "Крупные повреждения теряют кислую среду тоже, поэтому LysoTracker не может выявлять меньше: он отмечает и крупные, и малые.", "p3b_6_w3": "Методы измеряют разные признаки: галектин-3 — доступность гликанов цитозолю, LysoTracker — сохранность кислой среды. Малое повреждение может нарушить второе, не затронув первое, поэтому доли различаются.", "s3a_pn1": "Галектин-3", "s3a_pn2": "LAMP1", "s3a_pn3": "TFEB", "s3a_pv1": "Точек на клетку: {n}", "s3a_pv2": "LAMP1 {n} % от контроля", "s3a_pv3": "TFEB в ядре {n} %", "s3a_pv3x": "TFEB: белка нет", "s3a_ps1": "ESCRT-III · перенос липидов", "s3a_ps2": "убиквитин · захват", "s3a_ps3": "CASM · кальциневрин · ядро", "s3a_h0": "в норме", "s3a_h1": "ослаблен", "s3a_h2": "подавлен", "s3a_h3": "белка нет", "s3a_hn": "не запущен", "s3a_h_q": "неизвестно", "s3a_stT": "Порядок эксперимента: каждый срок — отдельные клетки", "s3a_st1a": "импульс LLOMe", "s3a_st1b": "и отмывка", "s3a_st2a": "срок после", "s3a_st2b": "отмывки", "s3a_st3a": "фиксация", "s3a_st3b": "клеток", "s3a_st4a": "иммуноокраска", "s3a_st4b": "на три белка", "s3a_st5a": "микроскопия", "s3a_st5b": "и подсчёт", "s3a_lgd1": "Круг — клетка, овал — ядро. Точки — галектин-3; кольца — LAMP1 (бледные — лизосомы нет).", "s3a_lgd2": "Фиолетовые точки — TFEB в цитозоле; ядро светится, когда TFEB в нём. Щелчок — справка.", "s3a_v_t": "Вариант клеток", "s3a_v_ctrl": "Контроль", "s3a_v_sar": "SAR405", "s3a_v_ulk": "Ингибитор ULK1", "s3a_v_esc": "Нокдаун ESCRT-III", "s3a_v_tax": "TAX1BP1⁻/⁻", "s3a_v_casm": "Без CASM", "s3a_v_tfeb": "TFEB⁻/⁻", "s3a_v_x": "Скрытый вариант", "s3a_tm_t": "Срок после LLOMe", "s3a_tm05": "30 мин", "s3a_tm4": "4 ч", "s3a_tm24": "24 ч", "s3a_ll": "Импульс LLOMe", "s3a_mys": "Скрыть вариант клеток", "s3a_r_g": "Точки галектина-3 на клетку", "s3a_r_l": "LAMP1 (% от контроля без LLOMe)", "s3a_r_t": "TFEB в ядре (% всего TFEB клетки)", "s3a_r_t0": "белка нет", "s3a_vs": "контроль", "s3a_r_note": "Шкала: {n} точек — все лизосомы клетки. LAMP1 принят пропорциональным пулу лизосом (учебное допущение).", "s3a_rec_t": "Записанные показания", "s3a_rec": "Записать показание", "s3a_rec_empty": "Записей нет. Нажмите «Записать показание».", "s3a_rec_ll": "{t} после LLOMe", "s3a_rec_nol": "без LLOMe, {t}", "s3a_rec_row": "точек галектина-3: {g} · LAMP1 {l} % · TFEB {f} %", "s3a_rec_row0": "точек галектина-3: {g} · LAMP1 {l} % · TFEB: белка нет", "s3a_c_nol": "Клетки без импульса LLOMe, {t}: точек галектина-3 на клетку — {g}, LAMP1 {l} % от контроля, TFEB в ядре {f} %.", "s3a_c_nol_z": "Контроль без повреждения показывает фон: точек галектина-3 нет, LAMP1 принят за 100 %, в ядре находится исходная доля TFEB. В модели препараты и нокауты этот фон не меняют; в клетках его проверяют отдельно, чтобы не принять побочное действие вещества за ответ на повреждение.", "s3a_c_nol_tf_z": "Без TFEB ядерной фракции нет, а галектин-3 и LAMP1 соответствуют клеткам без повреждения. Различие между вариантами проявится только после LLOMe.", "s3a_c_nol_tf": "Клетки TFEB⁻/⁻ без импульса LLOMe, {t}: точек галектина-3 на клетку — {g}, LAMP1 {l} % от контроля; TFEB белка нет.", "s3a_c_mys": "Скрытый вариант клеток, {t} после LLOMe: точек галектина-3 на клетку — {g} (контроль — {g0}), LAMP1 {l} % (контроль {l0} %), TFEB в ядре {f} % (контроль {f0} %).", "s3a_c_mys_z": "Сравните тройку показаний с контролем и с другими вариантами: ранний рост метки, её задержка, положение TFEB и уровень LAMP1 указывают на разные этапы. Запишите показания на двух сроках и сопоставьте.", "s3a_c_ctrl_a": "Контроль, {t} после LLOMe: точек галектина-3 на клетку — {g}, LAMP1 {l} % от контроля без LLOMe, TFEB в ядре {f} %. Все три процесса работают; повреждённых лизосом много.", "s3a_c_ctrl_b": "Контроль, {t} после LLOMe: точек галектина-3 на клетку — {g}, LAMP1 {l} %, TFEB в ядре {f} %. Помеченные лизосомы отремонтированы или удалены; часть лизосом удалена и ещё не заменена.", "s3a_c_ctrl_c": "Контроль, {t} после LLOMe: точек галектина-3 на клетку — {g}, LAMP1 {l} %, TFEB в ядре {f} %. Метки нет, пул почти восстановлен, TFEB вернулся к доле, какая бывает в клетках без LLOMe.", "s3a_c_ctrl_z": "Клетки с работающими ремонтом, лизофагией и ответом TFEB служат точкой отсчёта: по отклонению от неё судят, какой этап нарушен. Метод даёт срез одного срока; каждый срок — отдельные клетки, одну клетку во времени он не прослеживает.", "s3a_c_sar_a": "SAR405 (ингибитор VPS34), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Точек больше, чем в контроле: повреждённых лизосом больше.", "s3a_c_sar_b": "SAR405 (ингибитор VPS34), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка держится, когда в контроле её почти нет; LAMP1 выше, чем в контроле: лизосомы не убраны.", "s3a_c_sar_c": "SAR405 (ингибитор VPS34), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка сохраняется, и TFEB остаётся в ядре, когда в контроле он уже вышел.", "s3a_c_sar_z": "SAR405 подавляет VPS34: PI3P не образуется на доменах ЭПР, нужных для ремонта, и восстановление LysoTracker нарушено (Radulovic 2026; клетки U2OS и HeLa); PI3P нужен и для построения фагофора. Поэтому по точкам галектина-3 нельзя отличить подавленную лизофагию от ослабленного ремонта: в модели ослаблены оба процесса.", "s3a_c_ulk_a": "Ингибитор ULK1 (MRT68921), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Точек больше, чем в контроле: повреждённых лизосом больше.", "s3a_c_ulk_b": "Ингибитор ULK1 (MRT68921), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка держится, когда в контроле её почти нет; LAMP1 выше, чем в контроле: лизосомы не убраны.", "s3a_c_ulk_c": "Ингибитор ULK1 (MRT68921), {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка сохраняется, и TFEB остаётся в ядре, когда в контроле он уже вышел.", "s3a_c_ulk_z": "Комплекс ULK1 нужен для построения фагофора, а при повреждении лизосомы и для образования PI3P на доменах ЭПР: MRT68921 снижал накопление зонда PI3P (Radulovic 2026; клетки U2OS). Поэтому, как и SAR405, он ослабляет ремонт и лизофагию одновременно; селективность ингибитора ограничена.", "s3a_c_esc_a": "Нокдаун ESCRT-III, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Точек больше, чем в контроле: ремонт самого раннего этапа ослаблен.", "s3a_c_esc_b": "Нокдаун ESCRT-III, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка уже почти исчезла, но LAMP1 ниже, чем в контроле: больше лизосом удалено.", "s3a_c_esc_c": "Нокдаун ESCRT-III, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метки нет, пул восстановлен почти как в контроле.", "s3a_c_esc_z": "Нокдаун ESCRT-III лишает лизосому одного из быстрых путей ремонта; лизосомы, не закрытые вовремя, получают убиквитин и удаляются лизофагией. Поэтому от блока лизофагии этот вариант отличается тем, что метка со временем исчезает, а пул на промежуточном сроке снижается (сравните сроки 30 мин, 4 ч и 24 ч). Механизм действия ESCRT-III не установлен (Hurley 2025; Burigotto 2026).", "s3a_c_tax_a": "TAX1BP1⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Разница с контролем на этом сроке мала.", "s3a_c_tax_b": "TAX1BP1⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метка держится дольше, чем в контроле: захват замедлен.", "s3a_c_tax_c": "TAX1BP1⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Метки нет, как и в контроле.", "s3a_c_tax_z": "По данным протеомики и репортёров лизофагического потока, TAX1BP1 вместе с киназой TBK1 необходим и достаточен для лизофагического потока в клетках HeLa и индуцированных нейронах (Eapen 2021). В модели без него остаётся 30 % скорости захвата (учебное значение), поэтому удаление замедляется, но не прекращается.", "s3a_c_casm_a": "Клетки без CASM, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). TFEB входит в ядро слабо, а галектин-3 и LAMP1 близки к контролю.", "s3a_c_casm_b": "Клетки без CASM, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). TFEB в ядре ниже, чем в контроле; галектин-3 и LAMP1 близки к контролю.", "s3a_c_casm_c": "Клетки без CASM, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %), TFEB в ядре {f} % ({f0} %). Все три показателя близки к контролю.", "s3a_c_casm_z": "Присоединение ATG8 к мембране повреждённой лизосомы усиливает выход Ca²⁺ через TRPML1 и активацию TFEB (Nakamura 2020). В модели вклад CASM в активацию TFEB — 80 % (учебное допущение), остальное идёт без него. Вариант «ATG16L1 без домена WD40» выбран как учебный: домен WD40 нужен для присоединения LC3 к одиночным мембранам по пути через V-ATPase (Fischer 2020; индукция STING, не LLOMe); путь через TECPR1 в модели не учитывается.", "s3a_c_tfeb_a": "TFEB⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %); TFEB белка нет. Галектин-3 и LAMP1 такие же, как в контроле.", "s3a_c_tfeb_b": "TFEB⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %); TFEB белка нет. LAMP1 ниже, чем в контроле: новых лизосом образуется меньше.", "s3a_c_tfeb_c": "TFEB⁻/⁻, {t} после LLOMe: точек галектина-3 на клетку — {g} (в контроле — {g0}), LAMP1 {l} % ({l0} %); TFEB белка нет. Метки нет, но LAMP1 заметно ниже, чем в контроле: пул не восстановлен.", "s3a_c_tfeb_z": "Без TFEB лизосомные гены индуцируются слабее: ремонт и лизофагия идут как в контроле, а различие проявляется там, где лизосомы нужно заменить, то есть на сроках в часы. В модели сохраняется базовая скорость образования лизосом; TFE3 и другие регуляторы не моделируются (учебное допущение).", "s3a_take": "Срез фиксированных клеток даёт показания одного срока, и каждый срок — это другие клетки. Этапы различают по сочетанию показаний: ранний рост метки галектина-3 указывает на ремонт, её задержка — на захват помеченных лизосом, TFEB в ядре — на сигнал повреждения, уровень LAMP1 — на баланс удаления и замены. Ингибиторы VPS34 и ULK1 нарушают и ремонт, и лизофагию (Radulovic 2026), поэтому приписать эффект одному процессу по ним нельзя; нужен вариант, затрагивающий один этап, например нокаут рецептора TAX1BP1 или нокдаун ESCRT-III.", "p3a_1_q": "Через 4 ч после LLOMe в контроле точек галектина-3 почти нет. В клетках, обработанных SAR405 (ингибитор VPS34), на том же сроке точек стало больше. Какой вывод о причине допустим?", "p3a_1_o1": "Подавлена лизофагия: помеченные повреждённые лизосомы не захватываются аутофагосомой", "p3a_1_o2": "Ослаблен ремонт: разрывы дольше остаются открытыми, и лизосом с меткой больше", "p3a_1_o3": "Выбрать один процесс нельзя: VPS34 нужен и для ремонта, и для построения фагофора", "p3a_1_e": "VPS34 образует PI3P на фагофоре и на доменах ЭПР, участвующих в ремонте лизосом: SAR405 подавлял образование PI3P на доменах ЭПР после LLOMe (клетки U2OS) и препятствовал восстановлению числа точек LysoTracker (клетки HeLa; Radulovic 2026). Поэтому ингибитор ослабляет ремонт и лизофагию одновременно, и метка держится при любом из двух нарушений. В модели в клетках с SAR405 11 точек против 0 в контроле. Различить процессы позволяют варианты, затрагивающие один этап: нокаут рецептора TAX1BP1 (лизофагия) или нокдаун ESCRT-III (ремонт).", "p3a_1_w1": "Подавленная лизофагия могла бы дать такую картину, но та же метка получилась бы и при ослабленном ремонте. SAR405 действует на PI3P в обоих процессах, поэтому один этап по этому показателю не выделить.", "p3a_1_w2": "Ослабленный ремонт мог бы дать такую метку, но и подавленная лизофагия дала бы такую же. Ингибитор VPS34 подавляет оба процесса, поэтому вывод об одном из них был бы произвольным.", "p3a_2_q": "Через 30 мин после LLOMe в контроле видно определённое число точек галектина-3. Клетки с нокдауном ESCRT-III берут на том же сроке. Как изменится число точек на клетку?", "p3a_2_o1": "Увеличится: часть повреждений, которые обычно закрываются, остаётся открытой", "p3a_2_o2": "Уменьшится: галектин-3 приходит на лизосому после ESCRT-III и зависит от него", "p3a_2_o3": "Не изменится: за 30 мин ремонт ещё не успевает повлиять на метку", "p3a_2_e": "ESCRT-III собирается на повреждённой мембране в течение минут (Skowyra 2018; Radulovic 2018; клетки HeLa). Без него в модели закрывается меньше разрывов, и через 30 мин точек больше: 18 вместо 13 в контроле. Ремонт — самый ранний этап ответа, поэтому его нарушение видно уже на этом сроке.", "p3a_2_w2": "ESCRT-III приходит раньше галектина-3 (Radulovic 2018), но очерёдность не означает зависимости: галектин-3 связывает гликаны, открытые цитозолю. Когда разрыв не закрыт, гликаны остаются доступными.", "p3a_2_w3": "ESCRT-III работает в течение минут после повреждения, поэтому к 30 мин ремонт уже заметно влияет на число повреждённых лизосом.", "p3a_3_q": "Через 30 мин после LLOMe часть TFEB контрольных клеток находится в ядре. В клетках без CASM (ATG16L1 без домена WD40) измеряют ту же долю. Что получится?", "p3a_3_o1": "Доля такая же: кальциневрин дефосфорилирует TFEB, а присоединение ATG8 для его активации не нужно", "p3a_3_o2": "Доля ниже: ATG8 на мембране лизосомы усиливает выход Ca²⁺ и активацию TFEB", "p3a_3_o3": "Доля выше: без CASM сигнал повреждения не гаснет, и TFEB накапливается в ядре", "p3a_3_e": "Повреждение запускает присоединение ATG8 к мембране самой лизосомы; липидированный LC3 взаимодействует с каналом TRPML1 и усиливает выход Ca²⁺, нужный для дефосфорилирования TFEB кальциневрином (Nakamura 2020). В модели вклад CASM в активацию TFEB равен 80 % (учебное допущение): в ядре около 24 % TFEB против 59 % в контроле.", "p3a_3_w1": "Кальциневрин действительно дефосфорилирует TFEB, но активность кальциневрина зависит от Ca²⁺, который лизосомы выпускают с участием липидированного ATG8. Без CASM сигнал слабее.", "p3a_3_w3": "CASM не гасит сигнал повреждения, а передаёт его на TFEB. Метка галектина-3 и ремонт в этом варианте остаются прежними, а активация TFEB слабее.", "p3a_4_q": "Через 24 ч после LLOMe в контроле LAMP1 близок к значению в клетках без повреждения. Клетки TFEB⁻/⁻ измеряют на том же сроке. Что покажет LAMP1?", "p3a_4_o1": "Ниже контроля: удалённые лизосомы заменяются медленнее", "p3a_4_o2": "На уровне контроля: пул восстанавливает ремонт, новые лизосомы не нужны", "p3a_4_o3": "Выше контроля: без TFEB лизосомы реже удаляются", "p3a_4_e": "Ремонт возвращает в строй только лизосомы, которые остались в клетке; удалённые лизофагией заменяют новые. Без TFEB они образуются с базовой скоростью (учебное допущение), поэтому через 24 ч LAMP1 около 85 % против 97 % в контроле. Метка галектина-3 к этому сроку исчезает и там и там.", "p3a_4_w2": "Лизосомы, удалённые лизофагией, ремонт не вернёт. В модели восполнить их можно только образованием новых лизосом, а оно без TFEB медленнее.", "p3a_4_w3": "Лизофагия от TFEB в модели не зависит: захват помеченных лизосом идёт с прежней скоростью, и удалённых лизосом столько же. Отличается только скорость их замены.", "p3a_5_q": "Через 24 ч после LLOMe в клетках с SAR405 измерены три показателя. Те же показатели измеряют в клетках с ингибитором ULK1 (MRT68921). Что получится?", "p3a_5_o1": "Заметно разные: SAR405 затрагивает ремонт, а ингибитор ULK1 — только лизофагию", "p3a_5_o2": "Точек галектина-3 больше у ингибитора ULK1: ULK1 нужен лизофагии, а VPS34 — нет", "p3a_5_o3": "Близкие: оба вещества ослабляют ремонт и лизофагию, показатели их не различают", "p3a_5_e": "ULK1 активирует VPS34 и при построении фагофора, и при образовании PI3P на доменах ЭПР после повреждения: MRT68921 снижал накопление зонда PI3P (Radulovic 2026; клетки U2OS). Поэтому оба вещества выключают одни и те же ветви. В модели у обоих через 24 ч 4 точки на клетку, LAMP1 98 %, TFEB в ядре 56 %. Различить их по этим показателям нельзя; нужен независимый подход, например нокаут рецептора или нокдаун ESCRT-III.", "p3a_5_w1": "Это было бы так, если бы вещества действовали на разные процессы. ULK1 и VPS34 работают в одном пути, поэтому ингибиторы дают сходную картину. Ограниченная избирательность ингибиторов — общая проблема такого анализа.", "p3a_5_w2": "ULK1 запускает VPS34 при повреждении лизосомы, поэтому оба ингибитора нарушают одни и те же этапы. Различие по числу точек на клетку не возникает: в модели показания совпадают.", "p3a_6_q": "Скрытый вариант клеток измерен через 4 ч и 24 ч после LLOMe (строки таблицы). Сравните с контролем на тех же сроках: 0 и 0 точек галектина-3, LAMP1 85 % и 97 %, TFEB в ядре 33 % и 10 %. Какой этап нарушен?", "p3a_6_o1": "Ремонт ESCRT-III: метка быстро исчезает, а пул лизосом на промежуточном сроке снижается", "p3a_6_o2": "Захват помеченных лизосом и этапы, зависимые от PI3P: метка держится, TFEB в ядре", "p3a_6_o3": "Ответ TFEB: LAMP1 не восстанавливается к 24 ч, а TFEB в ядре нет совсем", "p3a_6_e": "Точки галектина-3 держатся к 24 ч (4 точки против 0), LAMP1 не снижен (98 %), TFEB остаётся в ядре (56 % против 10 %): повреждённые лизосомы не убираются, и сигнал повреждения не гаснет. Так выглядит блок захвата и PI3P-зависимых этапов; в этой загадке скрыт ингибитор ULK1, SAR405 дал бы те же показания. Различить с ним ослабление ремонта по этим показателям нельзя.", "p3a_6_w1": "При нокдауне ESCRT-III метка к 4 ч почти исчезает, а LAMP1 ниже контроля. Здесь метка держится, и LAMP1 выше контрольного значения.", "p3a_6_w3": "Без TFEB в ядре его не было бы (0 %), а LAMP1 был бы ниже контрольного. Здесь TFEB в ядре много, а LAMP1 высокий.", "gn_q3_lyso": "Лизосома и повреждение LLOMe", "g_q3_lyso": "Лизосома — органелла с одинарной мембраной, кислым просветом и гидролазами; в её просвете много Ca²⁺ и протонов. LLOMe — лизосомотропный дипептидный эфир: он проходит в лизосому, протонируется и остаётся в ней, а катепсин C (DPP1) превращает его в полилейцин (в среднем около 6 остатков). Полилейцин, вероятно, действует как поверхностно-активное вещество и вызывает осмотические разрывы; токсичность зависит от экспрессии катепсина C (Meyer & Kravic 2024). В сцене доза — условная шкала; концентрации в работах разные (например, 250 мкМ в клетках U2OS и HeLa; Radulovic 2026). Повреждение в модели возникает мгновенно, в момент 0, — учебное допущение.", "gn_q3_gal3": "Галектины и метка галектина-3", "g_q3_gal3": "Галектины — цитозольные белки, связывающие β-галактозиды. В целой лизосоме такие гликаны находятся на люменальной стороне; при более обширном повреждении они становятся доступны цитозолю, и галектины 3, 8 и 9 собираются в точки на повреждённой лизосоме (Aits 2015; Meyer & Kravic 2024). В модели малые повреждения галектином-3 не метятся — учебное допущение. Галектин-3 не только метка: он участвует в привлечении ALIX к ремонту (Jia 2020), поэтому его отсутствие может менять и сам ответ. Как цитозольные белки получают доступ к гликанам при стерильном повреждении, неясно (Meyer & Kravic 2024).", "gn_q3_lyt": "LysoTracker", "g_q3_lyt": "LysoTracker — флуоресцентное слабое основание, накапливающееся в кислых компартментах: в лизосомах и поздних эндосомах. Потеря кислой среды при повреждении снижает накопление красителя; после ремонта сигнал восстанавливается: в клетках HeLa число точек LysoTracker после LLOMe падало и вскоре возвращалось к исходному, а при нокдауне PIK3C3 или действии SAR405 не восстанавливалось (Radulovic 2026). Краситель не измеряет pH количественно, окрашивает и эндосомы, а сам может защелачивать лизосомы, поэтому измерение делают вскоре после окраски (Barral 2022). Сигнал не различает причину потери кислотности.", "gn_q3_pool": "Пул лизосом", "g_q3_pool": "Пул — число лизосом клетки в процентах от исходного. Он уменьшается при удалении лизосом и растёт при образовании новых. Повреждённые лизосомы, ещё не удалённые, входят в пул, но работают плохо, поэтому целых лизосом не больше, чем пул. Все потоки в сцене — учебная модель с учебными константами. В эксперименте число лизосом оценивают по LAMP1, LysoTracker или подсчётом на электронных микрофотографиях; каждый показатель имеет свои ограничения (Barral 2022).", "gn_q3_repair": "Ремонт лизосомной мембраны", "g_q3_repair": "Первая ступень ответа, запускается выходом Ca²⁺ из лизосомы. ALG-2 привлекает ESCRT-III, и он собирается на цитозольной стороне в течение минут (Skowyra 2018; Radulovic 2018); предполагают, что он сужает разрыв и убирает его в просвет в виде внутрипросветных пузырьков, но механизм не установлен (Hurley 2025; Burigotto 2026). Параллельно PI4K2A образует PI4P, и контакты с ЭПР переносят холестерол (OSBP) и фосфатидилсерин (ORP9/10/11), а ATG2 переносит липиды (Tan 2022; Radulovic 2022). PI3P на доменах ЭПР с DFCP1 и VPS13C участвует в ремонте (Radulovic 2026). Аннексины A1 и A2 участвуют в ремонте более крупных повреждений (Meyer & Kravic 2024). В модели ремонт — один процесс с ограниченной ёмкостью; ESCRT-III и PI3P-зависимый путь вносят вклад вместе (учебное допущение).", "gn_q3_lysophagy": "Лизофагия", "g_q3_lysophagy": "Удаление повреждённой лизосомы, которую не удалось отремонтировать. На ней появляются цепи убиквитина (сначала K63, позже K48), рецепторы привлекают комплекс ULK1–FIP200, строится фагофор, и аутофагосома сливается с целой лизосомой. В систематическом нокауте рецепторов доминирующая роль принадлежит TAX1BP1 вместе с TBK1 (Eapen 2021; Meyer & Kravic 2024; клетки HeLa и индуцированные нейроны); при отсутствии OPTN или NDP52 поток в HeLa сохраняется. Связь с ремонтом описана для белка спартина: он узнаёт ESCRT-III (IST1) и участки разупорядоченных липидов и привлекает E3-лигазу ITCH, ставящую цепи K63 (Hurley 2025). Лигаза, начинающая процесс в целом, и то, что переводит лизосому от ремонта к удалению, не установлены (Meyer & Kravic 2024). SAR405 (ингибитор VPS34) и ингибитор ULK1 MRT68921 подавляют не только лизофагию: они снижают образование PI3P на доменах ЭПР, нужное для ремонта (Radulovic 2026), поэтому вывод по ним неоднозначен. В сцене 3б выключатель лизофагии блокирует только захват, метка остаётся.", "gn_q3_tfeb": "TFEB и ответ на повреждение", "g_q3_tfeb": "TFEB и TFE3 — транскрипционные факторы, повышающие экспрессию генов лизосомных белков (CLEAR). В норме mTORC1 на лизосоме фосфорилирует TFEB, и он удерживается в цитозоле. При повреждении mTORC1 отсоединяется от лизосомы, а Ca²⁺ активирует кальциневрин, дефосфорилирующий TFEB: он уходит в ядро (Meyer & Kravic 2024); роль Ca²⁺ и кальциневрина впервые показана при голодании (Medina 2015). Липидированный LC3 на мембране лизосомы (CASM) усиливает выход Ca²⁺ через TRPML1 и активацию TFEB (Nakamura 2020). В модели «TFEB в ядре» — доля всего TFEB, вход растёт с долей повреждённых лизосом, образование лизосом включается с задержкой в несколько часов (учебные константы).", "gn_q3_galmethod": "Точки галектина-3 на клетку", "g_q3_galmethod": "Клетки после LLOMe фиксируют, окрашивают антителами к галектину-3, снимают в микроскопе и считают точки на клетку; одна точка отмечает повреждённую лизосому (Aits 2015; Barral 2022). Метод чувствителен, но даёт срез одного срока: каждый срок — отдельные клетки. Для живых клеток применяют галектины, слитые с флуоресцентным белком (Aits 2015). Точки не отличают ремонтируемые лизосомы от неремонтируемых. В сцене 40 точек — все лизосомы клетки (учебная шкала).", "gn_q3_lamp1": "LAMP1", "g_q3_lamp1": "LAMP1 — мембранный белок поздних эндосом и лизосом; суммарная интенсивность его окраски служит косвенным показателем массы лизосомного компартмента. Показатель ограничен: LAMP1 есть и в поздних эндосомах, его уровень на одну лизосому зависит от экспрессии гена, поэтому интенсивность окраски может меняться и без изменения числа лизосом (Barral 2022). В сцене LAMP1 принят пропорциональным пулу лизосом, % от контроля без LLOMe (учебное допущение).", "s4_t_map": "Повреждённая молекула и четыре маршрута (щелчок — справка)", "s4_cmp_cy": "цитозоль", "s4_cmp_er": "просвет ЭПР", "s4_cmp_mt": "митохондрия", "s4_ub_lbl": "Цепь Ub: круг K48, ромб K63", "s4_ub_tx": "доля K63: {a} %", "s4_ub_na": "не используется", "s4_p62_lbl": "p62: димеры и олигомеры", "s4_p62_s0": "в основном димеры ({w} %)", "s4_p62_s1": "короткие олигомеры ({w} %)", "s4_p62_s2": "нити и тельца ({w} %)", "s4_p62_none": "p62 в клетке нет", "s4_p62_na": "для этого субстрата не используется", "s4_bar_t": "Исходы когорты повреждённых молекул за {T} ч (все исходы вместе — 100 %)", "s4_na": "маршрут недоступен для этого субстрата", "s4_out_ref": "Рефолдинг", "s4_out_prot": "Протеасома", "s4_out_erad": "ERAD", "s4_out_aut": "Аутофагия", "s4_out_rem": "Остаток повреждённых", "s4_out_aut_cy": "Аутофагия (p62)", "s4_out_aut_ag": "Агрефагия", "s4_out_aut_er": "ER-фагия", "s4_out_aut_ea": "ER-фагия / ERLAD", "s4_out_aut_mt": "Митофагия", "s4_cn_cy": "растворимый|белок цитозоля", "s4_cn_ag": "агрегат|в цитозоле", "s4_cn_er": "растворимый|белок ЭПР", "s4_cn_ea": "агрегат в ЭПР|(устойчив к ERAD)", "s4_cn_mt": "белок наружной мембраны|митохондрии с меткой Parkin", "s4a_cn_q": "неизвестный|белок X", "s4_rb_ref_a": "Рефолдинг", "s4_rb_ref_b": "Hsp70, BiP", "s4_rb_prot_a": "Протеасома", "s4_rb_prot_b": "26S, одиночные цепи", "s4_rb_erad_a": "ERAD", "s4_rb_erad_b": "SEL1L–HRD1, p97", "s4_rb_aut_a_cy": "Аутофагия", "s4_rb_aut_b_cy": "p62, LC3", "s4_rb_aut_a_ag": "Агрефагия", "s4_rb_aut_b_ag": "p62, TAX1BP1", "s4_rb_aut_a_er": "ER-фагия", "s4_rb_aut_b_er": "FAM134B и др.", "s4_rb_aut_a_ea": "ER-фагия / ERLAD", "s4_rb_aut_b_ea": "FAM134B + калнексин", "s4_rb_aut_a_mt": "Митофагия", "s4_rb_aut_b_mt": "OPTN, NDP52", "s4_rb_aut_a_q": "Аутофагия", "s4_rb_aut_b_q": "рецептор ?", "s4_tag_ip": "MG132 / бортезомиб", "s4_tag_ia": "бафиломицин A1", "s4_tag_mg": "MG132", "s4_tag_baf": "бафиломицин A1", "s4_tag_sar": "SAR405", "s4_tag_cb": "CB-5083", "s4_tag_kif": "кифунензин", "s4_tag_both": "MG132 + бафиломицин", "gt_q4_cy": "белок цитозоля", "gt_q4_ag": "агрегат цитозоля", "gt_q4_er": "белок ЭПР", "gt_q4_ea": "агрегат ЭПР", "gt_q4_mt": "белок митохондрии (Parkin)", "dr_q4_ctl": "нет", "dr_q4_mg": "MG132", "dr_q4_baf": "бафиломицин A1", "dr_q4_sar": "SAR405", "dr_q4_cb": "CB-5083", "dr_q4_kif": "кифунензин", "dr_q4_both": "MG132 + бафиломицин", "s4b_cls_t": "Субстрат: размер и отсек", "s4b_act_cy": "Действуют все регуляторы: цепь убиквитина, p62, ёмкость Hsp70 и оба ингибитора.", "s4b_act_ag": "Действуют цепь убиквитина, p62, Hsp70 (рефолдинг агрегата медленный) и оба ингибитора.", "s4b_act_er": "Цепь убиквитина и p62 не действуют: в ЭПР другая система узнавания. Действуют ёмкость шаперонов (для ЭПР — BiP) и оба ингибитора.", "s4b_act_ea": "Цепь, p62 и шапероны не действуют: у этого субстрата один маршрут. Действует ингибитор аутофагии; ингибитор протеасомы наглядно покажет, что на этот субстрат он не влияет.", "s4b_act_mt": "Цепь, p62 и шапероны не действуют: метку на белок ставит Parkin. Действуют оба ингибитора.", "s4b_a_t": "Доля цепей K63 (остальные — K48)", "s4b_p_t": "Содержание p62", "s4b_h_t": "Ёмкость Hsp70 (для ЭПР — BiP)", "s4b_ip_t": "Подавить протеасому (MG132 или бортезомиб)", "s4b_ia_t": "Подавить аутофагию (бафиломицин A1)", "s4b_T_t": "Срок наблюдения", "s4b_T2": "2 ч", "s4b_T6": "6 ч", "s4b_T12": "12 ч", "s4b_T24": "24 ч", "s4b_plotcap": "Накопление исходов для выбранного субстрата, 0–24 ч (учебная модель, относительные величины). Вертикальная линия — выбранный срок; пунктир — доля исходной повреждённой фракции, которая ещё остаётся повреждённой.", "s4b_r_half": "Время убывания повреждённой фракции вдвое", "s4b_r_half_s": "ln 2 / сумма скоростей доступных маршрутов", "s4b_r_w": "Олигомерная форма p62", "s4b_r_w_s": "учебный индекс, 0–100 %", "s4b_r_note": "Доли отсчитаны от момента, когда образовалась когорта повреждённых молекул, до выбранного срока ({T} ч); сумма исходов равна 100 %. Скорости маршрутов — учебные значения.", "s4b_take": "Повреждённую лизосому в вопросе 3 удаляли целиком; отдельная молекула уходит по маршруту, который допускают её размер, отсек и метка. Маршруты конкурируют за одну популяцию молекул: подавление одного перераспределяет молекулы между остальными, если те доступны, а если запасного маршрута нет (агрегат в цитозоле, агрегат в ЭПР), молекулы остаются повреждёнными. Иногда маршруты не заменяют, а дополняют друг друга: в деполяризованных клетках с избытком Parkin митофагия нуждается в протеасоме и p97. Жёсткого переключателя нет — меняются скорости.", "s4b_c_cy_base": "Растворимый белок цитозоля, {T} ч. Рефолдинг {ref} %, протеасома {prot} %, аутофагия {aut} %, остаток повреждённых {rem} %. ERAD недоступен: белок находится в цитозоле, а не в ЭПР.", "s4b_c_cy_base_z": "Рефолдинг и деградация делят одни и те же молекулы: чем выше ёмкость Hsp70 ({h} %), тем больше молекул возвращается в рабочую форму. Протеасома принимает одиночные молекулы с цепями K48; аутофагия — молекулы, связанные олигомерами p62 (сейчас {w} %).", "s4b_c_cy_ip": "Растворимый белок цитозоля, {T} ч, протеасома подавлена. Протеасомная доля {prot0} % → {prot} %, рефолдинг {ref0} % → {ref} %, аутофагия {aut0} % → {aut} %, остаток повреждённых {rem} %. Олигомерная форма p62 — {w} %.", "s4b_c_cy_ip_z": "Ингибитор протеасомы убирает одного из конкурентов, и освободившиеся молекулы распределяются между оставшимися маршрутами. К тому же избыток свободного убиквитина способствует олигомеризации p62 (если p62 есть) и направляет часть молекул в аутофагию. В клетках усиление аутофагии развивается за часы длительного подавления, в модели оно мгновенное.", "s4b_c_cy_ia": "Растворимый белок цитозоля, {T} ч, аутофагия подавлена. Аутофагическая доля {aut0} % → {aut} %, протеасомная доля {prot0} % → {prot} %, рефолдинг {ref0} % → {ref} %, остаток повреждённых {rem} %.", "s4b_c_cy_ia_z": "Подавление аутофагии убирает ту долю, которая шла этим маршрутом ({aut0} % в контроле); остальные маршруты принимают освободившиеся молекулы в соответствии со своими скоростями. Заметнее всего аутофагия нужна там, где протеасома не справляется: для агрегатов и органелл.", "s4b_c_cy_both": "Растворимый белок цитозоля, {T} ч, подавлены протеасома и аутофагия. Остаётся рефолдинг: {ref} % против {ref0} % в контроле; протеасома {prot} %, аутофагия {aut} %, остаток повреждённых {rem} %.", "s4b_c_cy_both_z": "Оба маршрута деградации ослаблены (остаточная активность принята равной 5 %, учебное значение), и судьбу молекул определяет рефолдинг. Если ёмкость Hsp70 мала ({h} %), молекулы остаются повреждёнными. В клетках накопленный несвёрнутый белок образует агрегаты — модель этого не учитывает.", "s4b_c_ag_base": "Агрегат в цитозоле, {T} ч. Агрефагия {aut} %, рефолдинг {ref} %, остаток повреждённых {rem} %. Протеасома недоступна: агрегат не проходит в узкий канал протеасомы.", "s4b_c_ag_base_z": "Размер субстрата ограничивает маршрут: протеасома принимает одиночные развёрнутые цепи, а крупные скопления убирает аутофагия. Скорость агрефагии зависит от олигомеров p62 (сейчас {w} %) на убиквитиновых цепях; доля K63 — {a} %.", "s4b_c_ag_ip": "Агрегат в цитозоле, {T} ч, протеасома подавлена. Агрефагия {aut0} % → {aut} %, рефолдинг {ref0} % → {ref} %, остаток повреждённых {rem0} % → {rem} %. Олигомерная форма p62 — {w} %.", "s4b_c_ag_ip_z": "Агрегат протеасома не принимала, поэтому ингибитор действует не прямо, а через p62: избыток свободного убиквитина способствует олигомеризации p62 и ускоряет агрефагию, пока p62 есть в клетке: при содержании p62 {p} % олигомерная форма составляет {w} %.", "s4b_c_ag_ia": "Агрегат в цитозоле, {T} ч, аутофагия подавлена. Агрефагия {aut0} % → {aut} %, рефолдинг {ref0} % → {ref} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_ag_ia_z": "Для агрегата нет запасного маршрута: протеасома его не принимает, а рефолдинг идёт очень медленно, поэтому после подавления аутофагии большая часть материала остаётся повреждённой. Так накапливаются убиквитин-положительные включения.", "s4b_c_ag_both": "Агрегат в цитозоле, {T} ч, подавлены протеасома и аутофагия. Остаток повреждённых {rem} % (без воздействий — {rem0} %); агрефагия {aut} %, рефолдинг {ref} %.", "s4b_c_ag_both_z": "Подавление протеасомы почти ничего не добавляет к картине: для агрегата она и раньше не была маршрутом. Результат определяет подавление аутофагии. Ингибитор имеет смысл применять к тому маршруту, которым субстрат действительно удаляется.", "s4b_c_er_base": "Растворимый белок ЭПР, {T} ч. ERAD {erad} %, рефолдинг с участием BiP {ref} %, ER-фагия {aut} %, остаток повреждённых {rem} %. Протеасома принимает уже выведенные в цитозоль молекулы; это завершающий этап ERAD, а не отдельный маршрут.", "s4b_c_er_base_z": "Белок ЭПР не попадает в протеасому напрямую: комплекс SEL1L–HRD1 выводит его в цитозоль, p97 вытягивает, протеасома разрушает. Пока идёт рефолдинг (ёмкость BiP {h} %), часть молекул возвращается в рабочую форму.", "s4b_c_er_ip": "Растворимый белок ЭПР, {T} ч, протеасома подавлена. ERAD {erad0} % → {erad} %, рефолдинг {ref0} % → {ref} %, ER-фагия {aut0} % → {aut} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_er_ip_z": "ERAD заканчивается в протеасоме, поэтому её ингибитор блокирует и этот маршрут: субстрат не исчезает, а остаётся в ЭПР или в цитозоле. В модели часть молекул может свернуться (при сохранённой ёмкости BiP) или уйти в ER-фагию; остальные остаются в повреждённой форме.", "s4b_c_er_ia": "Растворимый белок ЭПР, {T} ч, аутофагия подавлена. ERAD {erad0} % → {erad} %, рефолдинг {ref0} % → {ref} %, ER-фагия {aut0} % → {aut} %.", "s4b_c_er_ia_z": "Основной маршрут растворимого белка ЭПР — ERAD, а ER-фагия вспомогательная: её подавление почти не сказывается на судьбе молекул. ER-фагия нужна для субстратов, которые ERAD принять не может (следующий субстрат — агрегат в ЭПР).", "s4b_c_er_both": "Растворимый белок ЭПР, {T} ч, подавлены протеасома и аутофагия. ERAD {erad} %, рефолдинг {ref} %, ER-фагия {aut} %, остаток повреждённых {rem} % (в контроле — {rem0} %).", "s4b_c_er_both_z": "Обе деградационные ветви ослаблены, поэтому значительная часть повреждённых молекул остаётся в клетке. Накопление субстратов ERAD вредно для клетки: при подавлении p97 (CB-5083) в опухолевых клетках оно вызывало протеотоксический стресс (Anderson 2015).", "s4b_c_ea_base": "Агрегат в ЭПР, устойчивый к ERAD, {T} ч. Лизосомный маршрут (ER-фагия, ERLAD) {aut} %, остаток повреждённых {rem} %. Рефолдинг, ERAD и протеасома недоступны: агрегат не выводится в цитозоль и не сворачивается.", "s4b_c_ea_base_z": "Для таких субстратов (полимеры α1-антитрипсина Z, проколлаген) в модели единственный маршрут — лизосомный. Рецептор FAM134B вместе с калнексином направляет к лизосоме часть ЭПР с грузом; полимеры α1-антитрипсина Z доставляются по пути ERLAD, через везикулы, без захвата ЭПР целой аутофагосомой.", "s4b_c_ea_ip": "Агрегат в ЭПР, устойчивый к ERAD, {T} ч, протеасома подавлена. Лизосомный маршрут {aut} % (в контроле {aut0} %), остаток повреждённых {rem} % (в контроле {rem0} %).", "s4b_c_ea_ip_z": "Изменений нет: этому субстрату протеасома и так недоступна. Ингибитор протеасомы не показывает, что субстрат удаляется аутофагией; это показывает ингибитор лизосомного маршрута.", "s4b_c_ea_ia": "Агрегат в ЭПР, устойчивый к ERAD, {T} ч, лизосомный маршрут подавлен. Лизосомный маршрут {aut0} % → {aut} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_ea_ia_z": "Других маршрутов у субстрата нет, поэтому после подавления лизосомного маршрута почти весь агрегат остаётся в ЭПР.", "s4b_c_ea_both": "Агрегат в ЭПР, устойчивый к ERAD, {T} ч, подавлены протеасома и аутофагия. Лизосомный маршрут {aut0} % → {aut} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_ea_both_z": "Результат тот же, что при подавлении одного лизосомного маршрута: подавление протеасомы ничего не добавляет, потому что протеасома агрегат в ЭПР не принимала.", "s4b_c_mt_base": "Белок наружной мембраны митохондрии с меткой Parkin (вопрос 2), {T} ч. Протеасома {prot} %, митофагия {aut} %, остаток повреждённых {rem} %. Рефолдинг и ERAD недоступны.", "s4b_c_mt_base_z": "Метка Parkin запускает два процесса сразу: p97 вытягивает белки наружной мембраны, протеасома их разрушает, а поверхность, покрытая убиквитином, служит сигналом для рецепторов митофагии. Оба процесса идут одновременно; в деполяризованных клетках с избытком Parkin митофагия зависела от протеасомного пути (Chan 2011).", "s4b_c_mt_ip": "Белок наружной мембраны митохондрии с меткой Parkin, {T} ч, протеасома подавлена. Протеасома {prot0} % → {prot} %, митофагия {aut0} % → {aut} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_mt_ip_z": "Подавление протеасомы нарушает и митофагию: в клетках, где Parkin перенесён на митохондрии, ингибитор протеасомы отменял Parkin-зависимую митофагию (Chan 2011). Поэтому здесь аутофагия не берёт на себя нагрузку протеасомы, в отличие от растворимого белка цитозоля.", "s4b_c_mt_ia": "Белок наружной мембраны митохондрии с меткой Parkin, {T} ч, митофагия подавлена. Митофагия {aut0} % → {aut} %, протеасома {prot0} % → {prot} %, остаток повреждённых {rem0} % → {rem} %.", "s4b_c_mt_ia_z": "Часть белков наружной мембраны, помеченных Parkin (MFN1/2, RHOT1/2), разрушает протеасома и без митофагии ({prot} % за {T} ч), хотя сами органеллы перестают удаляться (Narendra 2024): по потере одного белка наружной мембраны нельзя судить о судьбе органеллы.", "s4b_c_mt_both": "Белок наружной мембраны митохондрии с меткой Parkin, {T} ч, подавлены протеасома и митофагия. Протеасома {prot} %, митофагия {aut} %, остаток повреждённых {rem} %.", "s4b_c_mt_both_z": "Белок остаётся на органелле: ни протеасома, ни митофагия его не убирают. В модели, построенной по данным на деполяризованных клетках с избытком Parkin (Chan 2011; Tanaka 2010), митофагия зависит от протеасомы, поэтому подавление протеасомы само по себе ослабляет оба пути.", "p4b_1_q": "Растворимый белок цитозоля, срок 24 ч. Сравнивают клетки без воздействий и параллельную культуру, в которой ингибитор протеасомы (MG132 или бортезомиб) присутствует с начала срока. Как в этой культуре изменится аутофагическая доля?", "p4b_1_o1": "Не изменится: маршруты не связаны между собой", "p4b_1_o2": "Возрастёт: молекулы остаются доступными, а p62 чаще образует олигомеры", "p4b_1_o3": "Снизится: оба маршрута нуждаются в убиквитине", "p4b_1_e": "Аутофагическая доля выросла с 10 до 22 %. Ингибитор убрал конкурента: протеасомная доля упала с 41 до 3 %, а рефолдинг вырос с 49 до 75 %. Кроме того, избыток свободного убиквитина способствует олигомеризации p62, а олигомеры p62 направляют молекулы в аутофагию (в модели индекс вырос с 18 до 27 %; Pohl 2019). В клетках усиление аутофагии развивается за часы длительного подавления протеасомы, в модели оно мгновенное.", "p4b_1_w1": "Маршруты делят общие молекулы и общие компоненты (убиквитин, p62). Когда один маршрут закрыт, доли остальных пересчитываются, даже если их собственные скорости не менялись.", "p4b_1_w3": "Убиквитин нужен обоим маршрутам, но после подавления протеасомы его избыток, наоборот, способствует олигомеризации p62 и усиливает аутофагию. Доля аутофагии не снижается.", "p4b_2_q": "Агрегат в цитозоле, срок 24 ч, доля цепей K63 равна 20 %. Долю K63 повышают до 80 %. Как изменится остаток повреждённых?", "p4b_2_o1": "Уменьшится: больше олигомеров p62, быстрее агрефагия", "p4b_2_o2": "Увеличится: цепи K63 направляют белок в протеасому", "p4b_2_o3": "Не изменится: агрегат недоступен для протеасомы при любой цепи", "p4b_2_e": "Остаток повреждённых уменьшился с 13 до 3 %, агрефагия выросла с 77 до 90 %. Связывание цепей K63 способствует олигомеризации p62 и образованию его телец (Pohl 2019; Sun 2018, p62 и K63-цепь in vitro); в модели олигомерная форма p62 выросла с 18 до 42 %. Предпочтение цепей не абсолютно: в реконструированной системе скопления p62 с белками образуются на субстратах с двумя и более цепями длиннее трёх звеньев, а свободные K48- и K63-цепи этот процесс подавляют (Zaffagnini 2018).", "p4b_2_w2": "Протеасома агрегат не принимает при любой цепи: она пропускает только одиночные развёрнутые полипептиды. Тип цепи влияет на аутофагическую, а не на протеасомную долю.", "p4b_2_w3": "Агрегат действительно недоступен для протеасомы, но скорость агрефагии от цепи зависит: K63 способствует олигомеризации p62, и агрефагия ускоряется.", "p4b_3_q": "Агрегат в ЭПР, устойчивый к ERAD, срок 24 ч. Сравнивают клетки без воздействий и параллельную культуру, в которой протеасома подавлена с начала срока. Как в этой культуре изменится остаток повреждённых?", "p4b_3_o1": "Увеличится: часть агрегата разрушала протеасома", "p4b_3_o2": "Уменьшится: аутофагия возьмёт на себя нагрузку, как у белка цитозоля", "p4b_3_o3": "Не изменится: протеасома агрегат не принимала", "p4b_3_e": "Остаток повреждённых остался равным 15 %, лизосомный маршрут — 85 %. В модели агрегат не выводится из ЭПР в цитозоль, поэтому ни ERAD, ни протеасома ему недоступны; в клетках агрегаты, устойчивые к ERAD, удаляют по лизосомным путям, ERLAD и ER-фагии (Fregno 2018; Forrester 2019). Ингибитор меняет судьбу субстрата, если подавленный маршрут входит в число используемых им; здесь это не так.", "p4b_3_w1": "Для этого протеасома должна принимать агрегат. Агрегат в ЭПР не выводится в цитозоль, и протеасома его не получает.", "p4b_3_w2": "Освобождение нагрузки перераспределяет молекулы только между доступными маршрутами. Протеасомы среди маршрутов этого субстрата не было, поэтому перераспределять нечего.", "p4b_4_q": "Белок наружной мембраны митохондрии, помеченный Parkin (вопрос 2), в деполяризованных клетках с избытком Parkin, срок 24 ч. Сравнивают клетки без воздействий и параллельную культуру, в которой протеасома подавлена с начала срока. Что произойдёт с долей митофагии в этой культуре?", "p4b_4_o1": "Возрастёт: митофагия возьмёт на себя нагрузку, как у белка цитозоля", "p4b_4_o2": "Снизится: митофагия, запускаемая Parkin, сама нуждается в протеасоме", "p4b_4_o3": "Не изменится: митофагия идёт без участия протеасомы", "p4b_4_e": "Доля митофагии снизилась с 33 до 19 %, остаток повреждённых вырос с 0 до 62 %. В модели принято, что для удаления белков наружной мембраны, помеченных Parkin, нужны p97 и протеасома, и без них Parkin-зависимая митофагия не развивается: так было в деполяризованных клетках с избытком Parkin (Chan 2011; Tanaka 2010). Поэтому митофагия протеасому не заменяет, в отличие от растворимого белка цитозоля. Для клеток с эндогенным Parkin, например нейронов, такой вывод не доказан.", "p4b_4_w1": "Так происходит с растворимым белком цитозоля: освободившиеся молекулы уходят в аутофагию. Для митохондрий митофагия сама зависит от протеасомы.", "p4b_4_w3": "Для Parkin-зависимой митофагии в клетках с избытком Parkin протеасома и p97 нужны: пока белки наружной мембраны не удалены, митофагия не развивается. Поэтому её доля снижается.", "p4b_5_q": "Растворимый белок цитозоля, срок 2 ч, ёмкость Hsp70 равна 100 %. В модели ёмкость Hsp70 задаёт скорость рефолдинга, скорость остальных маршрутов она не меняет. Ёмкость Hsp70 снижают до 20 %. Как изменится доля, ушедшая в протеасому за 2 ч?", "p4b_5_o1": "Не изменится: Hsp70 не связан с деградацией", "p4b_5_o2": "Снизится: протеасома принимает только свёрнутые белки", "p4b_5_o3": "Возрастёт: меньше молекул возвращается в рабочую форму", "p4b_5_e": "Протеасомная доля за 2 ч выросла с 29 до 35 %, рефолдинг снизился с 34 до 9 %, остаток повреждённых вырос с 29 до 47 %. Рефолдинг и деградация делят одни и те же молекулы: Hsp70 и ко-шаперон CHIP участвуют в распределении молекул между свёртыванием и убиквитинированием для протеасомы (Connell 2001; Rosenzweig 2019). К 24 ч когорта исчерпывается, но срок 2 ч показывает, что за это время лишь часть молекул ушла по маршрутам.", "p4b_5_w1": "Hsp70 связан с деградацией: ко-шаперон CHIP убиквитинирует субстраты шаперонов (Connell 2001). К тому же при медленном рефолдинге на деградацию остаётся больше молекул.", "p4b_5_w2": "Рефолдинг не поставляет молекулы протеасоме, а отнимает их у деградации: чем он медленнее, тем больше молекул остаётся для деградации. Протеасомная доля не снижается.", "p4b_6_q": "Агрегат в цитозоле, срок 24 ч. Сравнивают клетки без воздействий и параллельную культуру, в которой протеасома и аутофагия подавлены с начала срока. Какая доля исходной повреждённой фракции останется повреждённой (остаток повреждённых)?", "p4b_6_o1": "Более 60 %", "p4b_6_o2": "От 30 до 60 %", "p4b_6_o3": "Менее 30 %", "p4b_6_e": "Остаток повреждённых составляет 70 % (без воздействий — 13 %). Почти весь эффект даёт подавление аутофагии: при подавлении одной аутофагии остаётся 72 %. Протеасома не удаляет агрегат непосредственно. Небольшая разница между 72 и 70 % связана с заданным в модели усилением аутофагического пути при подавлении протеасомы. Итог вопроса: эффект ингибитора отражает вклад подавленного маршрута в удаление данного субстрата, а запасной маршрут есть не у каждого субстрата.", "p4b_6_w2": "Промежуточный результат был бы при частично сохранённом запасном маршруте. У агрегата запасного маршрута нет: рефолдинг в модели очень медленный (учебное значение — 0,01 в час), а протеасома агрегат не принимает.", "p4b_6_w3": "Менее 30 % осталось бы при работающей аутофагии. Здесь она подавлена, а замены ей нет: протеасома агрегат не принимает.", "s4a_cls_t": "Образец (белок X)", "s4a_tr_t": "Препарат (обработка 6 ч)", "s4a_mys": "Загадка: образец скрыт", "s4a_time": "Клетки обрабатывают препаратом 6 ч. Блот показывает общий X: денатурирующий иммуноблот не различает повреждённую и свёрнутую после рефолдинга формы. Уровень общего X в контроле принят за 1; число со знаком × показывает, во сколько раз X больше или меньше, чем в контроле.", "s4a_blot_t": "Вестерн-блот: белок X, его убиквитинированные формы и актин", "s4a_rec": "Добавить дорожку", "s4a_blot_note": "Каждая дорожка — отдельный образец после обработки 6 ч. Интенсивность полос рассчитана по учебной модели, шкала общая для всех дорожек; актин — контроль нанесения. Полоса X — общий белок, то есть сумма повреждённой и свёрнутой форм: рефолдинг переводит молекулы из одной формы в другую и общий X не уменьшает. Строка X–Ub показывает убиквитинированные формы X в долях общего X контроля.", "s4a_row_x": "белок X", "s4a_row_ub": "X–Ub", "s4a_ln_ctl": "контр.", "s4a_ln_mg": "MG132", "s4a_ln_baf": "БафA1", "s4a_ln_sar": "SAR405", "s4a_ln_cb": "CB", "s4a_ln_kif": "Кифун.", "s4a_ln_both": "MG+Баф", "s4a_sm_cy": "цитоз.", "s4a_sm_ag": "агр.ц.", "s4a_sm_er": "ЭПР", "s4a_sm_ea": "агр.ЭПР", "s4a_sm_mt": "митох.", "s4a_x": "неизвестный образец", "s4a_key": "{s} · {d}: X {l} ×, X–Ub {u} %", "s4a_lvl": "Уровень X", "s4a_leg": "Полосы справа:|скорость маршрута,|% от контроля|(пунктир — 100 %).|Нижняя полоса:|уровень X, × контроля.", "s4a_r_l": "Уровень X через 6 ч", "s4a_r_u": "X–Ub, % общего X контроля", "s4a_r_pi": "Доля убиквитинированной формы", "s4a_r_pi_s": "% от X в образце; учебный показатель", "s4a_r_f": "Свёрнутая форма X", "s4a_r_f_s": "% общего X в образце; учебный показатель", "s4a_r_note": "Правый столбец схемы — скорость маршрута в процентах от контроля. Свёрнутая форма удаляется только собственным медленным оборотом (в модели 0,2 ч⁻¹), препараты на неё не действуют. Строка X–Ub — учебный показатель: у реальных белков видимость метки на блоте различается.", "s4a_none": "нет", "s4a_take": "Повреждённая лизосома в вопросе 3 отличалась от повреждённого белка тем, что её удаляли целиком; для белка маршрут определяют по ответу на препараты. Накопление X при препарате показывает, что маршрут вносит вклад в удаление, а изменение убиквитинированной формы — до или после метки стоит блок. Отсутствие эффекта не подтверждает отсутствие маршрута: его может замещать другой, а блот не говорит, где находится белок.", "s4a_c_mys": "Образец скрыт. Добавляйте дорожки при разных воздействиях и сравнивайте X с контролем и актином; чтобы открыть образец, снимите флажок «Загадка».", "s4a_c_mys_z": "Один образец и несколько воздействий: маршрут определяют по сочетанию изменений на всех дорожках, а не по одной.", "s4a_c_ctl": "{x}, без препарата: уровень X принят за 1, доля убиквитинированной формы — {pi} %. Это точка отсчёта: влияние препарата читается по отношению к ней.", "s4a_c_ctl_z": "Уровень белка — баланс его образования и удаления. Ингибитор маршрута меняет уровень, если маршрут заметно участвует в удалении.", "s4a_c_pre": "{x}, {d}: X вырос до {l} ×, а убиквитинированные формы снизились (до {u} % общего X контроля). Так выглядит блок до убиквитинирования: белок не получает метку и не расходуется. Затронутые маршруты: {r}.", "s4a_c_pre_z": "Блок на этапе до метки оставляет белок немеченым; блок после метки накапливает меченую форму. По направлению изменения меченой формы определяют, до или после убиквитинирования стоит подавленное звено.", "s4a_c_post": "{x}, {d}: X вырос до {l} ×, убиквитинированные формы — до {u} % общего X контроля ({pi} % X в образце помечено). Так выглядит блок после убиквитинирования: помеченный белок накапливается, потому что не расходуется. Затронутые маршруты: {r}.", "s4a_c_post_z": "Накопление меченой формы показывает, что блок стоит после убиквитинирования, но не говорит, какое звено (протеасома, p97 или лизосома) подавлено: нужны сравнение препаратов и контроль побочных эффектов.", "s4a_c_up": "{x}, {d}: X вырос до {l} ×, а доля убиквитинированной формы не изменилась ({pi} %). Подавленный маршрут вносит вклад в удаление, но не оставляет следа в виде накопления меченой формы. Затронутые маршруты: {r}.", "s4a_c_up_z": "Рост X без роста меченой формы показывает вклад подавленного маршрута, но блот не говорит, нужна ли этому маршруту убиквитиновая метка и откуда в него попал груз.", "s4a_c_ubonly": "{x}, {d}: уровень X почти не изменился ({l} ×), но убиквитинированные формы выросли до {u} % общего X контроля ({pi} % X в образц
