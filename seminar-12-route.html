,"d":[26,0],"dn":[26,0]},"tt":{"a":"tom","b":"tim","k":"tr"},"parl":{"a":"tim","b":"parl","k":"rx","t":"разрез\nперед F104","tn":"разрез","d":[0,-26],"dn":[0,-22]},"exit":{"a":"parl","b":"deg","k":"tr","t":"разрушение","tn":"","d":[34,0],"dn":[34,0]},"pot":{"a":"pot","b":"tim","k":"act","t":"движущая сила","tn":"движущая сила","d":[0,16],"dn":[0,16]},"ph":{"a":"tom","b":"ub","k":"phos","t":"PINK1 фосфорилирует\nубиквитин по S65","tn":"","d":[0,-26],"dn":[10,0],"pm":0.55}},"base":{"n":{"pink1":"on","deg":"on","tom":"on","ub":"base","tim":"on","parl":"on","pot":"on"}},"st":{"0":{"n":{"ub":"base"},"e":{"ph":"hide"},"t":{"tom":"TOM"},"m":[["Импорт PINK1","идёт"],["PINK1 на внешней мембране","почти нет"],["Убиквитин с S65-фосфатом","мало"]],"note":"Потенциал сохранён: PINK1 импортируется, PARL разрезает её, фрагмент разрушается. Киназа не накапливается и убиквитин на внешней мембране остаётся без фосфата на S65."},"1":{"n":{"pot":"abs","tim":"low","parl":"off","deg":"off","tom":"sel","ub":"sel"},"e":{"tt":"off","parl":"off","exit":"hide"},"t":{"tom":"TOM: димер PINK1\npS228, pS402","pot":"потенциал\nутрачен (CCCP)","ub":"pS65-убиквитин\nна белках внешней\nмембраны"},"tn":{"tom":"TOM: димер PINK1\npS228, pS402","pot":"потенциал утрачен","ub":"pS65-\nубиквитин на\nбелках внешней\nмембраны"},"m":[["Импорт PINK1","остановлен"],["PINK1 на внешней мембране","накапливается, активна"],["Убиквитин с S65-фосфатом","образуется"]],"note":"Потенциал утрачен: PINK1 остаётся продетой через TOM, образует димер и трансфосфорилируется по S228 и S402. Активная киназа фосфорилирует по S65 убиквитин на белках внешней мембраны."},"2":{"n":{"pot":"abs","tim":"low","parl":"off","deg":"off","tom":"low","ub":"off"},"e":{"tt":"off","parl":"off","exit":"hide","ph":"off"},"t":{"tom":"TOM: PINK1 с заменами\nS228A, S402A","pot":"потенциал\nутрачен (CCCP)"},"tn":{"tom":"TOM: PINK1 с\nзаменами\nS228A, S402A","pot":"потенциал утрачен"},"m":[["Автофосфорилирование","нет"],["Привлечение Parkin","подавлено"],["Убиквитин с S65-фосфатом","не показано"]],"note":"Замены S228A и S402A лишают PINK1 автофосфорилирования и подавляют привлечение Parkin на деполяризованные митохондрии (Okatsu 2012). Сколько pS65-убиквитина образуется в этом случае, на схеме не показано."},"3":{"n":{"pot":"on","tom":"on","ub":"base"},"e":{"ph":"hide"},"t":{"tom":"TOM","pot":"потенциал\nвосстановлен"},"tn":{"pot":"потенциал восстановлен"},"m":[["Импорт PINK1","возобновился"],["PINK1 на внешней мембране","быстро убывает"],["Накопленная PINK1","разрезается PARL"]],"note":"После отмывки CCCP импорт и разрез PARL возобновляются, и полноразмерный PINK1 в клетках HeLa через 30 мин резко убывает (Narendra 2010). Судьба уже образованного pS65-убиквитина на схеме не показана."}},"fs":15,"nfs":14,"lfs":12.5,"nlfs":12,"zfs":14,"nzfs":13}}},{"id":"parkin-activation","number":9,"section":1,"title":"Как pS65-убиквитин и PINK1 включают Parkin","question":2,"questions":[2],"keywords":["Parkin","аутоингибирование","pS65-убиквитин","UBL","RING1","RING2","C431","обратная связь","фосфорилирование","PINK1"],"lead":["В цитозоле [[T23|Parkin]] находится в аутоингибированном состоянии. Его включают два события, которые обеспечивает PINK1: фосфорилирование убиквитина на внешней мембране и фосфорилирование самого Parkin."],"mechanism":["[[T22|pS65-убиквитин]] связывается с RING1 Parkin и освобождает его домен UBL.","PINK1 фосфорилирует S65 в освобождённом UBL; фосфо-UBL связывается с RING0 и открывает RING2 с каталитическим C431.","Активный Parkin присоединяет убиквитин к белкам внешней мембраны, новые цепи фосфорилирует PINK1: возникает положительная обратная связь."],"paragraphs":["Без PINK1 Parkin находится в закрытой конформации. Домены UBL, RING0 и REP загораживают сайт связывания E2 и активный центр с остатком C431 в домене RING2, поэтому активность Parkin in vitro низка (Narendra & Youle 2024). Сама по себе близость к митохондрии Parkin не включает.","Первый шаг — убиквитин. PINK1 фосфорилирует по S65 убиквитин на белках внешней мембраны. pS65-убиквитин связывается с Parkin в консервативном фосфатном кармане; связывание выпрямляет спираль в домене RING1, и UBL высвобождается из ядра белка (Wauer 2015). Одновременно освобождается REP, и сайт связывания E2 открывается (Narendra & Youle 2024). Такой убиквитин активирует in vitro даже Parkin без домена UBL, а немодифицированный убиквитин — нет (Kazlauskaite 2014).","Второй шаг — сам Parkin. Высвобождение UBL усиливает его фосфорилирование PINK1 (Wauer 2015). Фосфо-UBL связывается с доменом RING0 и высвобождает каталитический RING2 (Gladkova 2018). По данным in vitro, фосфорилирование S65 в UBL подготавливает Parkin к активации убиквитином (Kazlauskaite 2014).","Активный Parkin присоединяет убиквитин в основном к белкам внешней мембраны. Эти цепи тоже фосфорилирует PINK1, и новый pS65-убиквитин привлекает и активирует новые молекулы Parkin: обратная связь ускоряет покрытие мембраны меткой (Ordureau 2014). Для этого нужны PINK1 и убиквитинированные белки на той же мембране, поэтому активация остаётся на повреждённой митохондрии и не затрагивает соседние здоровые (Narendra & Youle 2024)."],"trap":["Parkin активен с того момента, как пришёл на митохондрию.","Приход и активация — разные события. pS65-убиквитин привлекает Parkin и освобождает UBL и REP, но активный центр остаётся закрытым, пока фосфо-UBL не свяжется с RING0 и не высвободит RING2 (Gladkova 2018). Для полного включения Parkin с доменом UBL нужны оба события."],"conditions":"Схема механизма, качественные состояния; домены показаны условно, без структуры. Kazlauskaite 2014 — очищенные белки in vitro и клетки HEK293 (реферат); Wauer 2015 — кристаллическая структура Parkin насекомого Pediculus humanus с pS65-убиквитином (реферат); Gladkova 2018 — обмен водорода на дейтерий и структура Parkin человека (реферат); Ordureau 2014 — клетки HeLa с Parkin, количественная протеомика. Обзор Narendra & Youle 2024 (полный текст) — общая схема. Нумерация S65 и C431 дана для Parkin человека.","sources":["Kazlauskaite2014","Wauer2015","Gladkova2018","Ordureau2014","Narendra2024"],"quiz":{"id":"S12-L09","rev":1,"question":"К очищенному Parkin без домена UBL (в нём нет S65) в пробирке с E1, E2 и ATP добавили убиквитин, фосфорилированный по S65, вместо обычного убиквитина. Как изменится убиквитинлигазная активность Parkin?","options":[{"id":"S12-L09-1","text":"Возрастёт: pS65-убиквитин связывается с RING1 и включает Parkin без участия UBL.","correct":true,"feedback":"pS65-убиквитин активирует Parkin и без UBL, а немодифицированный убиквитин — нет (Kazlauskaite 2014): связывание в RING1 само ослабляет автоингибирование."},{"id":"S12-L09-2","text":"Не изменится: в таком Parkin нет S65 в UBL, поэтому включить его нечем.","correct":false,"feedback":"Фосфорилирование UBL усиливает активацию, но не единственный путь. pS65-убиквитин действует через RING1 независимо от UBL."},{"id":"S12-L09-3","text":"Возрастёт так же, как при добавлении немодифицированного убиквитина.","correct":false,"feedback":"Обычный убиквитин Parkin без UBL не активирует. Нужен фосфат на S65 убиквитина."}]},"widget":{"kind":"net","title":"","s":{"title":"Аутоингибирование и активация Parkin","status":"Схема механизма · качественные состояния","ctrls":[{"id":"g","type":"group","label":"Стадия активации","opts":["Без PINK1","pS65-убиквитин связан с RING1","UBL фосфорилирован PINK1"]},{"id":"d","type":"check","label":"Parkin без домена UBL"}],"W":680,"H":442,"NW":340,"NH":496,"lg":{"title":"Обозначения на схеме","act":"активирует, привлекает, ведёт к","inh":"закрывает, тормозит, снимает","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос через мембрану","rx":"химическое превращение (разрез, снятие группы)","bind":"связывание","seq":"порядок событий","dash":"условная или возможная связь","nodes":["жёлтая рамка — звено работает","голубая рамка — белок несёт метку","пунктирная рамка — мало или не действует"]},"zones":[{"x":8,"y":112,"w":664,"h":252,"c":"plain","t":"Parkin (домены условно; IBR не показан)","lx":22,"ly":354,"a":"start","n":[6,92,328,300,14,384],"tn":"Parkin (IBR не показан)"}],"nodes":{"pink1":{"p":[110,50,100,38],"n":[62,38,84,34],"t":"PINK1","tn":"PINK1"},"pub":{"p":[350,50,200,42],"n":[232,38,150,38],"t":"убиквитин","tn":"убиквитин","fs":14},"ubl":{"p":[110,185,84,36],"n":[58,150,68,36],"t":"UBL","tn":"UBL"},"ring1":{"p":[300,185,100,36],"n":[170,150,82,36],"t":"RING1","tn":"RING1"},"rep":{"p":[520,185,84,36],"n":[282,150,64,36],"t":"REP","tn":"REP"},"ring0":{"p":[300,300,120,36],"n":[96,262,84,36],"t":"RING0 (UPD)","tn":"RING0","fs":14},"ring2":{"p":[520,300,160,50],"n":[250,262,120,50],"t":"RING2\nкатализатор C431","tn":"RING2\nC431","fs":14},"sub":{"p":[500,408,250,46],"n":[170,446,230,46],"t":"убиквитинирование белков\nвнешней мембраны","tn":"убиквитинирование белков\nвнешней мембраны","fs":14}},"edges":{"ph1":{"a":"pink1","b":"pub","k":"phos","t":"S65","tn":"S65","d":[0,-24],"dn":[0,-24],"pm":0.5},"bd":{"a":"pub","b":"ring1","k":"bind","t":"связывается\nс RING1","tn":"","d":[56,0],"dn":[50,0],"anc":"start"},"ph2":{"a":"pink1","b":"ubl","k":"phos","t":"S65 в UBL","tn":"S65","d":[10,-14],"dn":[8,-6],"anc":"start","pm":0.5},"i1":{"a":"ubl","b":"ring1","k":"inh","t":"закрывает\nсайт E2","tn":"","d":[0,-26],"dn":[0,-26]},"i2":{"a":"rep","b":"ring1","k":"inh","t":"закрывает\nсайт E2","tn":"","d":[0,-26],"dn":[0,-26]},"bu":{"a":"ubl","b":"ring0","k":"bind","t":"фосфо-UBL\nсвязывается с RING0","tn":"","d":[-70,10],"dn":[-34,0],"anc":"end"},"i3":{"a":"ring0","b":"ring2","k":"inh","t":"закрывает\nактивный центр","tn":"","d":[0,24],"dn":[0,24]},"go":{"a":"ring2","b":"sub","k":"act"}},"base":{"n":{"pink1":"on","pub":"base","ubl":"base","ring1":"base","rep":"base","ring0":"base","ring2":"low","sub":"off"}},"st":{"0-0":{"n":{"pink1":"abs","pub":"off","ubl":"base","ring1":"base","rep":"base","ring0":"base","ring2":"low","sub":"off"},"e":{"ph1":"hide","bd":"hide","ph2":"hide","bu":"hide","go":"off"},"t":{"pub":"убиквитин\n(без фосфата)"},"tn":{"pub":"убиквитин\n(без фосфата)"},"m":[["Домен UBL","закрывает сайт E2"],["RING0","закрывает C431"],["Активность Parkin","низкая"]],"note":"Без PINK1 убиквитина с фосфатом на S65 нет. Parkin закрыт: UBL и REP загораживают сайт связывания E2 на RING1, RING0 загораживает каталитический C431 в RING2. Parkin находится в цитозоле в аутоингибированном состоянии."},"0-1":{"n":{"pink1":"abs","pub":"off","ubl":"hide","ring1":"base","rep":"base","ring0":"base","ring2":"low","sub":"off"},"e":{"ph1":"hide","bd":"hide","ph2":"hide","bu":"hide","go":"off","i1":"hide"},"t":{"pub":"убиквитин\n(без фосфата)"},"tn":{"pub":"убиквитин\n(без фосфата)"},"m":[["Домен UBL","удалён"],["pS65-убиквитин","нет"],["Активность Parkin","низкая"]],"note":"Parkin без домена UBL: без pS65-убиквитина фермент остаётся малоактивным; немодифицированный убиквитин его не включает (Kazlauskaite 2014)."},"1-0":{"n":{"pink1":"on","pub":"sel","ubl":"base","ring1":"sel","rep":"base","ring0":"base","ring2":"low","sub":"off"},"e":{"i1":"off","i2":"off","bu":"hide","ph2":"hide","go":"off"},"t":{"pub":"pS65-убиквитин"},"tn":{"pub":"pS65-убиквитин"},"m":[["Домен UBL","освобождён"],["RING0","всё ещё закрывает C431"],["Активность Parkin","промежуточная"]],"note":"PINK1 фосфорилирует убиквитин по S65. pS65-убиквитин связывается с RING1, и UBL с REP освобождают сайт E2 (Wauer 2015; Narendra & Youle 2024). Активный центр C431 пока закрыт RING0, поэтому Parkin включён лишь частично."},"1-1":{"n":{"pink1":"on","pub":"sel","ubl":"hide","ring1":"sel","rep":"base","ring0":"base","ring2":"on","sub":"on"},"e":{"i1":"hide","i2":"off","bu":"hide","ph2":"hide","go":"on","i3":"off"},"t":{"pub":"pS65-убиквитин"},"tn":{"pub":"pS65-убиквитин"},"m":[["Домен UBL","удалён"],["pS65-убиквитин","связан с RING1"],["Активность Parkin","высокая"]],"note":"Parkin без домена UBL включается pS65-убиквитином, немодифицированный убиквитин на него не действует (Kazlauskaite 2014). Фосфорилирование UBL в этом варианте невозможно; как именно освобождается RING2, схема не детализирует."},"2-0":{"n":{"pink1":"on","pub":"sel","ubl":"sel","ring1":"sel","rep":"base","ring0":"base","ring2":"on","sub":"on"},"e":{"i1":"off","i2":"off","i3":"off"},"t":{"pub":"pS65-убиквитин","ubl":"pUBL"},"tn":{"pub":"pS65-убиквитин","ubl":"pUBL"},"m":[["Домен UBL","фосфорилирован, связан с RING0"],["C431 в RING2","свободен"],["Активность Parkin","высокая"]],"note":"Освобождённый UBL становится доступен для PINK1. Фосфо-UBL связывается с RING0 и высвобождает RING2: сайт E2 открыт, C431 свободен, Parkin присоединяет убиквитин к белкам внешней мембраны (Gladkova 2018; Narendra & Youle 2024)."},"2-1":{"n":{"pink1":"on","pub":"sel","ubl":"hide","ring1":"sel","rep":"base","ring0":"base","ring2":"on","sub":"on"},"e":{"i1":"hide","i2":"off","i3":"off","ph2":"hide","bu":"hide","go":"on"},"t":{"pub":"pS65-убиквитин","ubl":"pUBL"},"tn":{"pub":"pS65-убиквитин","ubl":"pUBL"},"m":[["Домен UBL","удалён"],["Фосфорилирование UBL","невозможно"],["Активность Parkin","высокая"]],"note":"В Parkin без UBL нет S65 в этом домене, поэтому третий шаг невозможен; фермент активируется pS65-убиквитином, как в предыдущем состоянии."}},"fs":15,"nfs":14,"lfs":12.5,"nlfs":12,"zfs":13,"nzfs":12}}},{"id":"parkin-signal","number":10,"section":1,"title":"Что Parkin метит и как метка превращается в сигнал","question":2,"questions":[2],"keywords":["Parkin","VDAC","MFN2","RHOT1","p97","USP30","OPTN","NDP52","ULK1","TBK1"],"lead":["Активный [[T23|Parkin]] метит убиквитином много белков внешней мембраны. Часть из них разрушается, а остальные остаются на мембране как метка, к которой присоединяются рецепторы аутофагии."],"mechanism":["Parkin присоединяет цепи убиквитина к VDAC1/2, [[T24|MFN1/2]], RHOT1/2 и другим белкам внешней мембраны; часть цепей фосфорилирует PINK1.","[[T25|p97]] извлекает MFN1/2 и RHOT1/2, и их разрушает протеасома; деубиквитиназа [[T26|USP30]] снимает метку.","OPTN и NDP52 связывают цепи с pS65-убиквитином и привлекают ULK1 и TBK1: аутофагосома начинает строиться у самой метки."],"paragraphs":["Активный Parkin убиквитинирует преимущественно белки внешней мембраны. В нейронах наиболее сильно помечены VDAC1 и VDAC2, MFN1 и MFN2, RHOT1 и RHOT2, CISD1. Занятость сайтов при этом мала: для любого сайта VDAC1 и VDAC2 убиквитинировано менее 2 % молекул (Narendra & Youle 2024).","Часть субстратов убиквитинируется предпочтительно и удаляется. MFN1/2 и RHOT1/2 извлекает из мембраны p97 с кофакторами UFD1–NPL4, а протеасома их разрушает, даже если митофагия заблокирована. В клетках HeLa с избытком Parkin ингибиторы протеасомы подавляли убыль MFN1, MFN2, VDAC1 и TOMM20 (Tanaka 2010; Chan 2011). В нейронах с эндогенным Parkin белки VDAC1 и VDAC2, как правило, не удаляются из мембраны, а служат меткой (Narendra & Youle 2024). Поэтому потеря одного белка внешней мембраны не означает удаления митохондрии.","Часть белков, например VDAC1/2, остаётся на мембране как метка. Цепи с pS65-убиквитином связывают рецепторы OPTN и NDP52; они привлекают ULK1, DFCP1 и WIPI1 к участкам рядом с митохондрией ещё до присоединения LC3 (Lazarou 2015). В клетках без пяти рецепторов Parkin приходит на митохондрии, а MFN1 и TOMM20 разрушаются протеасомой, но митофагии нет.","Деубиквитиназа USP30 во внешней мембране снимает убиквитин, поставленный Parkin: при избытке USP30 метка исчезает и митофагия подавлена, а при снижении её активности в нейронах деградация митохондрий усиливается (Bingol 2014). Вывод о составе метки основан в основном на клетках с избыточным Parkin."],"trap":["Parkin метит один белок, поэтому достаточно разрушения MFN2.","Parkin метит множество белков внешней мембраны. Часть из них, прежде всего MFN1/2 и RHOT1/2, извлекает p97 и разрушает протеасома; многие остаются на мембране как метка для рецепторов. Убыль MFN2 показывает работу Parkin и протеасомы, но не удаление митохондрии."],"conditions":"Схема механизма, качественные состояния. Chan 2011 и Tanaka 2010 — клетки HeLa с Parkin, CCCP, ингибиторы протеасомы (рефераты и фрагменты полного текста); Lazarou 2015 — клетки HeLa, нокаут пяти рецепторов, олигомицин с антимицином A (полный текст); Bingol 2014 — клетки, нейроны крысы и дрозофила, избыточная экспрессия и нокдаун USP30 (реферат). Занятость сайтов VDAC — по обзору Narendra & Youle 2024 (культивируемые нейроны с эндогенным Parkin). Роль TBK1 показана схематично.","sources":["Chan2011","Tanaka2010","Lazarou2015","Bingol2014","Narendra2024"],"quiz":{"id":"S12-L10","rev":1,"question":"В клетках с активным Parkin на повреждённых митохондриях избыточно экспрессировали деубиквитиназу USP30. Как изменится убиквитин, поставленный Parkin на внешней мембране?","options":[{"id":"S12-L10-1","text":"Станет больше: USP30 присоединяет убиквитин к белкам внешней мембраны.","correct":false,"feedback":"USP30 — деубиквитиназа: она снимает убиквитин, а не присоединяет. Цепи ставит Parkin."},{"id":"S12-L10-2","text":"Не изменится: USP30 снимает убиквитин только внутри матрикса.","correct":false,"feedback":"USP30 закреплена во внешней мембране и действует на белки, которые метит Parkin (Bingol 2014)."},{"id":"S12-L10-3","text":"Станет меньше: USP30 снимает убиквитин, поставленный Parkin.","correct":true,"feedback":"При избытке USP30 убиквитин на повреждённых митохондриях исчезает, и Parkin хуже запускает митофагию (Bingol 2014)."}]},"widget":{"kind":"net","title":"","s":{"title":"Метка Parkin и её превращение в сигнал","status":"Схема механизма · качественные состояния","ctrls":[{"id":"g","type":"group","label":"Состояние Parkin и USP30","opts":["Parkin неактивен","Parkin активен","Parkin активен, USP30 ингибирована"]},{"id":"d","type":"check","label":"Клетки без пяти рецепторов"}],"W":680,"H":430,"NW":340,"NH":496,"lg":{"title":"Обозначения на схеме","act":"активирует, привлекает, ведёт к","inh":"закрывает, тормозит, снимает","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос через мембрану","rx":"химическое превращение (разрез, снятие группы)","bind":"связывание","seq":"порядок событий","dash":"условная или возможная связь","nodes":["жёлтая рамка — звено работает","голубая рамка — белок несёт метку","пунктирная рамка — мало или не действует"]},"zones":[{"x":8,"y":108,"w":664,"h":92,"c":"mito","t":"внешняя мембрана","lx":662,"ly":192,"a":"end","n":[6,108,328,96,104,200],"tn":"внешняя мембрана","an":"start"}],"nodes":{"parkin":{"p":[150,40,110,38],"n":[60,36,96,34],"t":"Parkin","tn":"Parkin"},"pink1":{"p":[350,40,110,38],"n":[170,36,86,34],"t":"PINK1","tn":"PINK1"},"usp30":{"p":[556,38,130,52],"n":[278,40,100,44],"t":"USP30","tn":"USP30"},"suba":{"p":[130,160,190,44],"n":[76,146,124,44],"t":"MFN1/2, RHOT1/2","tn":"MFN1/2,\nRHOT1/2","fs":14},"subb":{"p":[400,160,250,44],"n":[246,146,138,44],"t":"VDAC1/2 и другие\nбелки внешней мембраны","tn":"VDAC1/2 и\nдругие белки","fs":14},"p97":{"p":[130,284,110,38],"n":[76,268,96,34],"t":"p97","tn":"p97"},"rec":{"p":[400,284,190,44],"n":[246,268,128,44],"t":"OPTN, NDP52","tn":"OPTN,\nNDP52","fs":14},"ulk":{"p":[600,284,130,38],"n":[246,352,128,34],"t":"ULK1, TBK1","tn":"ULK1, TBK1"},"prot":{"p":[130,380,130,38],"n":[76,352,112,34],"t":"протеасома","tn":"протеасома"},"phago":{"p":[470,380,250,44],"n":[246,438,170,44],"t":"аутофагосома строится\nу самой метки","tn":"аутофагосома\nу метки","fs":14}},"edges":{"pa":{"a":"parkin","b":"suba","k":"act","t":"убиквитинирует","tn":"метит","d":[-6,0],"dn":[-8,0],"anc":"end"},"pb":{"a":"parkin","b":"subb","k":"act"},"ph":{"a":"pink1","b":"subb","k":"phos","t":"S65 в цепях","tn":"S65","d":[16,0],"dn":[16,0],"anc":"start","pm":0.3},"us":{"a":"usp30","b":"subb","k":"inh","t":"снимает убиквитин","tn":"снимает","d":[14,0],"dn":[10,0],"anc":"start"},"ex":{"a":"suba","b":"p97","k":"tr","t":"извлечение\nиз мембраны","tn":"извлечение","d":[-8,0],"dn":[-8,0],"anc":"end"},"pr":{"a":"p97","b":"prot","k":"seq","t":"разрушение","tn":"разрушение","d":[-8,0],"dn":[-8,0],"anc":"end"},"br":{"a":"subb","b":"rec","k":"bind","t":"связывание с\nцепями pS65-Ub","tn":"pS65-Ub","d":[12,0],"dn":[10,0],"anc":"start"},"ru":{"a":"rec","b":"ulk","k":"act","t":"привлекают","tn":"привлекают","d":[0,-16],"dn":[8,0],"anc":"start"},"up":{"a":"ulk","b":"phago","k":"act","t":"инициация","tn":"инициация","d":[12,0],"dn":[10,0],"anc":"start"}},"base":{"n":{"parkin":"base","pink1":"base","usp30":"base","suba":"base","subb":"base","p97":"base","rec":"base","ulk":"base","prot":"base","phago":"base"}},"st":{"0-0":{"n":{"parkin":"low","pink1":"on","usp30":"on","suba":"base","subb":"base","p97":"off","rec":"off","ulk":"off","prot":"off","phago":"off"},"e":{"pa":"off","pb":"off","ph":"hide","us":"off","ex":"off","pr":"off","br":"off","ru":"off","up":"off"},"t":{"parkin":"Parkin\nнеактивен"},"tn":{"parkin":"Parkin\nнеактивен"},"m":[["Убиквитин, поставленный Parkin","нет"],["Извлечение и разрушение белков","нет"],["Рецепторы на мембране","не привлечены"]],"note":"Parkin на митохондрии неактивен: убиквитиновых цепей на белках внешней мембраны нет, p97 и протеасоме нечего разрушать, рецепторы OPTN и NDP52 не привлекаются."},"0-1":{"n":{"parkin":"low","pink1":"on","usp30":"on","suba":"base","subb":"base","p97":"off","rec":"abs","ulk":"off","prot":"off","phago":"off"},"e":{"pa":"off","pb":"off","ph":"hide","us":"off","ex":"off","pr":"off","br":"off","ru":"off","up":"off"},"t":{"parkin":"Parkin\nнеактивен","rec":"пять рецепторов\nотсутствуют"},"tn":{"parkin":"Parkin\nнеактивен","rec":"нет пяти\nрецепторов"},"m":[["Убиквитин, поставленный Parkin","нет"],["Рецепторы","отсутствуют"],["Митофагия","нет"]],"note":"Parkin неактивен, поэтому метки нет; отсутствие пяти рецепторов на этот результат не влияет."},"1-0":{"n":{"parkin":"on","pink1":"on","usp30":"on","suba":"sel","subb":"sel","p97":"on","rec":"on","ulk":"on","prot":"on","phago":"on"},"e":{},"t":{},"tn":{},"m":[["Убиквитин, поставленный Parkin","много цепей, часть — pS65"],["MFN1/2, RHOT1/2","извлекаются и разрушаются"],["Остальные белки","остаются как метка"]],"note":"Активный Parkin метит много белков внешней мембраны. MFN1/2 и RHOT1/2 извлекает p97, и их разрушает протеасома. Часть белков, например VDAC1/2, остаётся на мембране: цепи с pS65-убиквитином связывают OPTN и NDP52, которые привлекают ULK1 и TBK1, и аутофагосома начинает строиться у самой метки."},"1-1":{"n":{"parkin":"on","pink1":"on","usp30":"on","suba":"sel","subb":"sel","p97":"on","rec":"abs","ulk":"off","prot":"on","phago":"off"},"e":{"br":"off","ru":"off","up":"off"},"t":{"rec":"пять рецепторов\nотсутствуют"},"tn":{"rec":"нет пяти\nрецепторов"},"m":[["MFN1, TOMM20","убывают (протеасома)"],["Рецепторы","отсутствуют"],["Митофагия","нет"]],"note":"В клетках HeLa без пяти рецепторов Parkin приходит на митохондрии, а MFN1 и TOMM20 разрушаются протеасомой, но митофагии нет: ULK1 не привлекается к метке (Lazarou 2015)."},"2-0":{"n":{"parkin":"on","pink1":"on","usp30":"abs","suba":"sel","subb":"sel","p97":"on","rec":"on","ulk":"on","prot":"on","phago":"on"},"e":{"us":"off"},"t":{"usp30":"USP30\nингибирована"},"tn":{"usp30":"USP30\nингибир."},"m":[["USP30","ингибирована"],["Убиквитин на мембране","снимается медленнее"],["Митофагия","усиливается (нейроны, Bingol 2014)"]],"note":"Если активность USP30 снижена, деубиквитиназа хуже снимает убиквитин, поставленный Parkin. В исследованных нейронах это усиливает деградацию митохондрий (Bingol 2014)."},"2-1":{"n":{"parkin":"on","pink1":"on","usp30":"abs","suba":"sel","subb":"sel","p97":"on","rec":"abs","ulk":"off","prot":"on","phago":"off"},"e":{"us":"off","br":"off","ru":"off","up":"off"},"t":{"usp30":"USP30\nингибирована","rec":"пять рецепторов\nотсутствуют"},"tn":{"usp30":"USP30\nингибир.","rec":"нет пяти\nрецепторов"},"m":[["USP30","ингибирована"],["Рецепторы","отсутствуют"],["Митофагия","нет"]],"note":"Без рецепторов метка не превращается в сигнал для аутофагосомы, даже если убиквитин снимается медленнее. Состояние показано как логическое следствие схемы, отдельно в первоисточниках не измерялось."}},"fs":15,"nfs":14,"lfs":12.5,"nlfs":12,"zfs":13,"nzfs":12}}},{"id":"mito-routes","number":11,"section":1,"title":"Другие пути митофагии и значение PINK1–Parkin","question":2,"questions":[2],"keywords":["митофагия","BNIP3","NIX","гипоксия","деферипрон","DFP","базальная митофагия","MDV","болезнь Паркинсона","PINK1"],"lead":["PINK1–Parkin — самый изученный, но не единственный способ запустить митофагию. Другие воздействия включают рецепторы, которым убиквитин не нужен, или иной путь, а PINK1 нужна не везде."],"mechanism":["При гипоксии и созревании эритроцитов митохондрии удаляют рецепторы [[T27|BNIP3 и NIX]] во внешней мембране; убиквитин и PINK1–Parkin не требуются.","Хелатор железа [[T28|деферипрон]] запускает митофагию, не зависящую от PINK1 и Parkin.","В большинстве исследованных тканей мыши базальная митофагия идёт без PINK1; PINK1 и Parkin вносят вклад при стрессе и в части тканей."],"paragraphs":["Рецепторы BNIP3 и NIX (BNIP3L) расположены во внешней мембране и сами несут мотив LIR, поэтому связывают белки ATG8 без убиквитина. При гипоксии их образование усиливает HIF1A, а NIX необходим для удаления митохондрий при созревании эритроидных клеток; PINK1 и Parkin для этого не нужны (Terešak 2022).","Другой пример — потеря железа. В клетках U2OS и SH-SY5Y деферипрон за 24 ч вызывал митофагию: митохондриальный белок внешней мембраны доставлялся в кислые лизосомы. Подавление PINK1 эффект не меняло, а сама PINK1 при этом не стабилизировалась; подавление BNIP3 эффект тоже не меняло (Allen 2013). Рецептор, который работает в этом случае, остаётся неизвестным.","Третий путь — митохондриальные пузырьки. При окислительном стрессе от митохондрий отпочковываются пузырьки с отобранным грузом, которые затем доставляются в лизосомы; для них нужны PINK1 и Parkin, но путь отличается от канонической митофагии (McLelland 2014).","У мышей с нокаутом Pink1 базальная митофагия в большинстве исследованных тканей, в том числе с высоким расходом энергии, сохранялась; исключением были островки поджелудочной железы, где при потере PINK1 митофагия, напротив, повышалась (McWilliams 2018). По обзору Narendra & Youle 2024, в печени часть базальной митофагии, вероятно, зависит от BNIP3 и NIX, в скелетной мышце и сердце PINK1–Parkin, по-видимому, вносят вклад, а в мозге преобладающий путь не установлен. Значение PINK1–Parkin зависит от ткани и воздействия. Потеря обоих аллелей PINK1 или PRKN вызывает рецессивную форму болезни Паркинсона с ранним началом (Narendra & Youle 2024)."],"trap":["PINK1–Parkin — единственный путь митофагии.","Есть пути, не зависящие от PINK1 и Parkin: рецепторы BNIP3 и NIX при гипоксии и созревании эритроцитов, ответ на потерю железа. В исследованных тканях мыши базальная митофагия часто идёт без PINK1. Значение PINK1–Parkin зависит от ткани и воздействия."],"conditions":"Схема маршрутов, качественные состояния. Terešak 2022 и Narendra & Youle 2024 — обзоры (полный текст); Allen 2013 — клетки U2OS и SH-SY5Y, деферипрон 24 ч, подавление PINK1 и BNIP3 siRNA, репортёр на внешней мембране (прочитан текст статьи); McLelland 2014 — клетки HeLa, антимицин A (реферат); McWilliams 2018 — мыши с репортёром mito-QC, ткани и первичные клетки (прочитан текст статьи). Различия между тканями приведены по обзору Narendra & Youle 2024, а не по собственным данным.","sources":["Teresak2022","Allen2013","McLelland2014","McWilliams2018","Narendra2024"],"quiz":{"id":"S12-L11","rev":1,"question":"В клетках U2OS подавили PINK1 с помощью siRNA, затем добавили хелатор железа деферипрон на 24 ч. Как изменится доставка митохондриального белка внешней мембраны в лизосомы по сравнению с клетками без деферипрона?","options":[{"id":"S12-L11-1","text":"Возрастёт: потеря железа запускает митофагию, для которой PINK1 не нужна.","correct":true,"feedback":"Деферипрон вызывал митофагию в клетках U2OS и SH-SY5Y, а подавление PINK1 эффект не меняло (Allen 2013)."},{"id":"S12-L11-2","text":"Не изменится: без PINK1 никакое воздействие не запускает митофагию.","correct":false,"feedback":"Это неверно: помимо PINK1–Parkin есть пути, которые включаются гипоксией или потерей железа и не требуют PINK1."},{"id":"S12-L11-3","text":"Снизится: хелатор железа блокирует доставку митохондрий в лизосомы.","correct":false,"feedback":"Деферипрон не блокирует доставку, а запускает митофагию, не зависящую от PINK1."}]},"widget":{"kind":"net","title":"","s":{"title":"Три воздействия и пути к митофагии","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Воздействие","opts":["Потеря потенциала (CCCP)","Гипоксия","Потеря железа (деферипрон)"]},{"id":"d","type":"check","label":"PINK1 удалена"}],"W":680,"H":420,"NW":340,"NH":460,"lg":{"title":"Обозначения на схеме","act":"активирует, привлекает, ведёт к","inh":"закрывает, тормозит, снимает","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос через мембрану","rx":"химическое превращение (разрез, снятие группы)","bind":"связывание","seq":"порядок событий","dash":"условная или возможная связь","nodes":["жёлтая рамка — звено работает","голубая рамка — белок несёт метку","пунктирная рамка — мало или не действует"]},"zones":[],"nodes":{"s1":{"p":[120,46,200,46],"n":[58,40,104,56],"t":"потеря потенциала\n(CCCP)","tn":"потеря\nпотенциала\n(CCCP)","fs":14},"s2":{"p":[340,46,170,40],"n":[170,40,104,56],"t":"гипоксия","tn":"гипоксия","fs":14},"s3":{"p":[560,46,190,46],"n":[282,40,104,56],"t":"потеря железа\n(деферипрон)","tn":"потеря\nжелеза\n(DFP)","fs":14},"pink1":{"p":[120,130,110,38],"n":[58,118,100,34],"t":"PINK1","tn":"PINK1"},"hif":{"p":[340,130,110,38],"n":[170,118,100,34],"t":"HIF1A","tn":"HIF1A"},"parkin":{"p":[120,210,110,38],"n":[58,190,100,34],"t":"Parkin","tn":"Parkin"},"bnip":{"p":[340,210,190,46],"n":[170,190,100,50],"t":"BNIP3, NIX\n(мотив LIR)","tn":"BNIP3,\nNIX (LIR)","fs":14},"unk":{"p":[560,210,190,46],"n":[282,190,100,50],"t":"рецептор\nне установлен","tn":"рецептор\nне известен","fs":14},"rec":{"p":[120,292,190,46],"n":[58,280,100,56],"t":"OPTN, NDP52,\nубиквитин","tn":"OPTN,\nNDP52,\nUb","fs":14},"mph":{"p":[340,372,380,46],"n":[170,400,300,44],"t":"митофагия: доставка митохондрий в лизосому","tn":"митофагия: доставка\nв лизосому","fs":14}},"edges":{"e1":{"a":"s1","b":"pink1","k":"act"},"e2":{"a":"pink1","b":"parkin","k":"act","t":"S65-Ub","tn":"S65-Ub","d":[24,0],"dn":[22,0],"anc":"start"},"e3":{"a":"parkin","b":"rec","k":"act"},"e4":{"a":"rec","b":"mph","k":"act"},"f1":{"a":"s2","b":"hif","k":"act"},"f2":{"a":"hif","b":"bnip","k":"act"},"f3":{"a":"bnip","b":"mph","k":"act"},"g1":{"a":"s3","b":"unk","k":"act"},"g2":{"a":"unk","b":"mph","k":"act","dash":true}},"base":{"n":{"s1":"off","s2":"off","s3":"off","pink1":"off","hif":"off","parkin":"off","bnip":"off","unk":"off","rec":"off","mph":"off"}},"st":{"0-0":{"n":{"s1":"on","s2":"off","s3":"off","pink1":"on","hif":"off","parkin":"on","bnip":"off","unk":"off","rec":"on","mph":"on"},"e":{"e1":"on","e2":"on","e3":"on","e4":"on","f1":"off","f2":"off","f3":"off","g1":"off","g2":"off"},"t":{},"tn":{},"m":[["Путь","PINK1–Parkin"],["Метка","убиквитин, pS65"],["Митофагия","идёт"]],"note":"Деполяризация запускает путь PINK1–Parkin: PINK1 накапливается, образуется pS65-убиквитин, Parkin его метит, OPTN и NDP52 привлекают аутофагосому. Это самый изученный, но не единственный путь."},"0-1":{"n":{"s1":"on","s2":"off","s3":"off","pink1":"abs","hif":"off","parkin":"off","bnip":"off","unk":"off","rec":"off","mph":"off"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","f1":"off","f2":"off","f3":"off","g1":"off","g2":"off"},"t":{"pink1":"PINK1\nудалена","mph":"митофагии нет"},"tn":{"pink1":"PINK1\nнет","mph":"митофагии нет"},"m":[["Путь","PINK1–Parkin"],["Метка","не образуется"],["Митофагия","нет"]],"note":"Без PINK1 в клетках с Parkin путь не запускается: убиквитиновая метка не образуется, митофагия по этому пути не идёт (Lazarou 2015)."},"1-0":{"n":{"s1":"off","s2":"on","s3":"off","pink1":"off","hif":"on","parkin":"off","bnip":"on","unk":"off","rec":"off","mph":"on"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","f1":"on","f2":"on","f3":"on","g1":"off","g2":"off"},"t":{},"tn":{},"m":[["Путь","BNIP3/NIX"],["Метка","убиквитин не нужен"],["Митофагия","идёт"]],"note":"При гипоксии образование BNIP3 и NIX усиливает HIF1A. Эти белки внешней мембраны сами несут мотив LIR и связывают ATG8 без убиквитина; PINK1 и Parkin для этого не нужны (Terešak 2022)."},"1-1":{"n":{"s1":"off","s2":"on","s3":"off","pink1":"abs","hif":"on","parkin":"off","bnip":"on","unk":"off","rec":"off","mph":"on"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","f1":"on","f2":"on","f3":"on","g1":"off","g2":"off"},"t":{"pink1":"PINK1\nудалена"},"tn":{"pink1":"PINK1\nнет"},"m":[["Путь","BNIP3/NIX"],["PINK1","не нужна"],["Митофагия","идёт"]],"note":"Удаление PINK1 путь BNIP3/NIX не затрагивает: он не использует ни PINK1, ни Parkin (Terešak 2022)."},"2-0":{"n":{"s1":"off","s2":"off","s3":"on","pink1":"off","hif":"off","parkin":"off","bnip":"off","unk":"sel","rec":"off","mph":"on"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","f1":"off","f2":"off","f3":"off","g1":"on","g2":"on"},"t":{},"tn":{},"m":[["Путь","не зависит от PINK1 и Parkin"],["Рецептор","не установлен"],["Митофагия","идёт"]],"note":"Хелатор железа деферипрон за 24 ч вызывал митофагию в клетках U2OS и SH-SY5Y; рецептор, который работает в этом случае, неизвестен (Allen 2013)."},"2-1":{"n":{"s1":"off","s2":"off","s3":"on","pink1":"abs","hif":"off","parkin":"off","bnip":"off","unk":"sel","rec":"off","mph":"on"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","f1":"off","f2":"off","f3":"off","g1":"on","g2":"on"},"t":{"pink1":"PINK1\nудалена"},"tn":{"pink1":"PINK1\nнет"},"m":[["Путь","не зависит от PINK1 и Parkin"],["PINK1","не нужна"],["Митофагия","идёт"]],"note":"Подавление PINK1 эффект деферипрона не меняло, а сама PINK1 при этом не стабилизировалась (Allen 2013)."}},"fs":15,"nfs":14,"lfs":12.5,"nlfs":12,"zfs":13}}},{"id":"mito-measure","number":12,"section":1,"title":"Как измерить митофагию","question":2,"questions":[2],"keywords":["митофагия","mt-Keima","mito-QC","репортёр","иммуноблот","COX II","TOMM20","контроль","лизосома","pS65-убиквитин"],"lead":["Митофагию измеряют по доставке митохондриального материала в кислые лизосомы и по исчезновению митохондриальных белков. Ни один показатель сам по себе не подтверждает митофагию, поэтому их сочетают и проверяют контролями."],"mechanism":["Репортёры [[T29|mt-Keima]] и [[T30|mito-QC]] меняют сигнал в кислой среде лизосомы и показывают доставку митохондрий.","Иммуноблот сравнивает белок внешней мембраны, который может разрушать протеасома, и белок внутренней мембраны.","Контроли — клетки без PINK1, без рецепторов или без аутофагии, бафиломицин A1 и сравнение воздействий по срокам."],"paragraphs":["Репортёр mt-Keima направлен в матрикс митохондрии. Он устойчив к кислой среде, а цвет его сигнала зависит от pH, поэтому митохондрии в цитозоле и в лизосоме различаются (Katayama 2011). mito-QC — тандем mCherry–GFP на внешней мембране: в лизосоме кислая среда гасит GFP, а mCherry остаётся, и возникают красные точки без зелёного (McWilliams 2016).","На иммуноблоте сравнивают белок внешней мембраны и белок внутренней мембраны. После деполяризации в клетках HeLa с Parkin белки внешней мембраны MFN1 и TOMM20 разрушает протеасома: в клетках без пяти рецепторов они исчезают так же, как в клетках дикого типа, а белок внутренней мембраны COX II сохраняется, потому что митофагии нет (Lazarou 2015). Работу самого пути проверяют по накоплению полноразмерной PINK1 и по появлению pS65-убиквитина.","У репортёров есть границы. Доставка в кислый отсек происходит не только при митофагии, но и при неселективной аутофагии и гетерофагии, поэтому нужны блоки аутофагии (Narendra & Youle 2024). Бафиломицин A1 повышает pH лизосом и убирает красный сигнал mCherry–GFP-репортёра (Allen 2013). Keima несовместим с фиксацией и его измеряют в живых клетках и тканях, а сигнал mito-QC при фиксации сохраняется. Кроме того, Keima выявляет и доставку в лизосомы, не зависящую от ATG5 (Katayama 2011), поэтому блок одного звена аутофагии не исключает остаточный сигнал."],"trap":["Если белок внешней мембраны исчез, значит, митохондрию удалила митофагия.","Белки внешней мембраны, помеченные Parkin, разрушает протеасома, в том числе при заблокированной митофагии. Митофагию подтверждают белок внутренней мембраны или матрикса, репортёр и контроль с блокадой аутофагии."],"conditions":"Схема метода, условные пиктограммы: число точек, интенсивность полос и цвета не являются данными эксперимента. Katayama 2011 — культивируемые клетки, Keima (реферат); McWilliams 2016 — репортёр mito-QC в клетках и тканях мыши (прочитан текст статьи); Lazarou 2015 — клетки HeLa с Parkin, нокаут пяти рецепторов, олигомицин с антимицином A (полный текст); Allen 2013 — клетки U2OS и SH-SY5Y, репортёр mCherry–GFP на внешней мембране, бафиломицин A1 (прочитан текст статьи). Narendra & Youle 2024 — обзор (полный текст). Для mt-Keima контроль блокадой лизосомного закисления в первоисточниках раздела отдельно не проверялся; приведён нокаут ATG5 по обзору Narendra & Youle 2024.","sources":["Katayama2011","McWilliams2016","Lazarou2015","Allen2013","Narendra2024"],"quiz":{"id":"S12-L12","rev":1,"question":"В клетках HeLa с Parkin после деполяризации исчезают белок внешней мембраны TOMM20 и белок внутренней мембраны COX II. Взяли такие же клетки без пяти рецепторов аутофагии (митофагия в них не идёт). Что покажет иммуноблот?","options":[{"id":"S12-L12-1","text":"TOMM20 и COX II сохранятся: без митофагии митохондриальные белки не разрушаются.","correct":false,"feedback":"Белки внешней мембраны, помеченные Parkin, разрушает и протеасома, поэтому TOMM20 убывает и без митофагии (Lazarou 2015)."},{"id":"S12-L12-2","text":"TOMM20 убудет, как в клетках дикого типа, а COX II сохранится.","correct":true,"feedback":"TOMM20 разрушает протеасома, COX II находится внутри митохондрии, поэтому его убыль служит показателем митофагии (Lazarou 2015)."},{"id":"S12-L12-3","text":"TOMM20 и COX II убудут так же, как в клетках дикого типа, их разрушает протеасома.","correct":false,"feedback":"Протеасома разрушает белки внешней мембраны, но до COX II во внутренней мембране не добирается: его убыль указывает на митофагию."}]},"widget":{"kind":"cards","title":"","s":{"title":"Как измерить митофагию","status":"Схема метода · условные пиктограммы","opts_label":"Показатель","opts":["mt-Keima","mito-QC","Иммуноблот: внешняя и внутренняя мембрана","Иммуноблот: PINK1 и pS65-убиквитин","Контроли и блоки"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"cards":[{"v":["Долю митохондрий, доставленных в кислую среду лизосомы. Цвет сигнала белка Keima в матриксе зависит от pH.","Живые клетки или ткань: сигнал регистрируют в двух цветовых каналах; нейтральному и кислому pH соответствуют разные цвета.","Клетки без воздействия; блок аутофагии (у мыши нокаут ATG5 почти убирал сигнал в зубчатой извилине); клетки без PINK1 или Parkin.","Образец нельзя фиксировать. Сигнал показывает доставку в кислый отсек, в том числе при неселективной аутофагии и гетерофагии, но не путь, который её запустил."],"note":"mt-Keima: условная пиктограмма. Зелёные точки — митохондрии в цитозоле, красные — в кислой среде лизосомы; число точек не является данными эксперимента.","pic":{"kind":"cells","panels":[{"lab":"без воздействия","dots":[["green",8]]},{"lab":"деполяризация,\nParkin","dots":[["green",4],["red",6]]},{"lab":"то же, блок\nаутофагии","dots":[["green",9]]}]}},{"v":["Число красных точек без зелёного: так выглядят митохондрии, у которых меченый белок внешней мембраны попал в кислую среду лизосомы (митолизосомы).","Тандем mCherry–GFP на внешней мембране: в лизосоме кислая среда гасит GFP, а mCherry остаётся. Считают красные точки на клетку или срез; сигнал сохраняется при фиксации.","Клетки без воздействия; бафиломицин A1 (поднимает pH лизосом и убирает красные точки); блок аутофагии (у дрозофилы подавление Atg5 (РНК-интерференция) уменьшало число красных точек в эпидермисе).","Красные точки возникают при любой доставке материала в кислый отсек. Чувствительность ниже, чем у mt-Keima; вклад путей зависит от ткани."],"note":"mito-QC: условная пиктограмма. Жёлтые точки — митохондрии в цитозоле (оба белка светятся), красные — митолизосомы; число точек не является данными эксперимента.","pic":{"kind":"cells","panels":[{"lab":"без воздействия","dots":[["yellow",9],["red",1]]},{"lab":"деполяризация,\nParkin","dots":[["yellow",5],["red",6]]},{"lab":"то же, блок\nаутофагии","dots":[["yellow",9],["red",1]]}]}},{"v":["Убыль белков внешней мембраны (TOMM20, MFN2) в сравнении с белком внутренней мембраны (COX II).","Иммуноблот лизатов клеток HeLa с Parkin до и после деполяризации; нагрузку выравнивают по белку сравнения.","Клетки без пяти рецепторов, 5 рец.⁻ (митофагии нет); клетки, обработанные ингибитором протеасомы (ИП) вместе с CCCP (митофагия заблокирована); клетки дикого типа (WT) без воздействия.","Белки внешней мембраны, помеченные Parkin, разрушает и протеасома, поэтому их убыль без убыли COX II не подтверждает митофагию. Данные получены в основном на клетках с избытком Parkin."],"note":"Схема иммуноблота: интенсивность полос условная; ИП — ингибитор протеасомы, добавленный вместе с CCCP. В клетках HeLa с избытком Parkin белки внешней мембраны убывают и без митофагии (дорожка без пяти рецепторов). При ингибиторе протеасомы сохраняются и они, и белок внутренней мембраны COX II: в этой системе подавление протеасомы блокирует митофагию (Chan 2011). Убыль COX II указывает на доставку в лизосому.","pic":{"kind":"gel","title":"иммуноблот · условно","lanes":["0 ч","CCCP","CCCP","CCCP"],"lanes2":["WT","WT","5 рец.⁻","WT+ИП"],"bands":[[0,0.12,0.9],[1,0.12,0.25],[2,0.12,0.25],[3,0.12,0.85],[0,0.4,0.9],[1,0.4,0.22],[2,0.4,0.22],[3,0.4,0.85],[0,0.68,0.9],[1,0.68,0.4],[2,0.68,0.9],[3,0.68,0.85],[0,0.95,0.8],[1,0.95,0.8],[2,0.95,0.8],[3,0.95,0.8]],"marks":[[0.12,"TOMM20"],[0.4,"MFN2"],[0.68,"COX II"],[0.95,"актин"]]}},{"v":["Накопление полноразмерной PINK1 и образование pS65-убиквитина на деполяризованных митохондриях.","Иммуноблот лизатов или фракций митохондрий; полноразмерная PINK1 около 63 кДа; pS65-убиквитин выявляют специфическими антителами.","Клетки без воздействия; клетки без PINK1 (сигнал pS65-убиквитина исчезает); клетки с киназой, лишённой активности.","Показывает работу PINK1, а не митофагию. Содержание PINK1 меняется за минуты и обратимо после отмывки CCCP."],"note":"Схема иммуноблота: интенсивность полос условная. Полноразмерная PINK1 накапливается при утрате потенциала; pS65-убиквитин требует PINK1.","pic":{"kind":"gel","title":"иммуноблот · условно","lanes":["0 ч","CCCP","CCCP"],"lanes2":["WT","WT","PINK1⁻/⁻"],"bands":[[0,0.15,0.1],[1,0.15,0.9],[0,0.55,0.05],[1,0.55,0.85],[0,0.92,0.8],[1,0.92,0.8],[2,0.92,0.8]],"marks":[[0.15,"PINK1"],[0.55,"pS65-Ub"],[0.92,"актин"]]}},{"v":["Какое звено создаёт сигнал: митофагия, протеасома или неселективная аутофагия.","Одно и то же воздействие применяют к клеткам с блоком отдельного звена и без него и сравнивают один и тот же показатель.","Дикий тип без воздействия; клетки без PINK1, Parkin, рецепторов или ATG5.","Блок одного звена не исключает другие пути; условия в клетках и тканях различаются, поэтому вывод относят к названной системе."],"note":"Общая последовательность проверки: воздействие, блок, измерение, сравнение с контролем.","pic":{"kind":"steps","steps":["воздействие:\nCCCP или другое","блок звена:\nPINK1, ATG5\nили рецепторы","измерение:\nрепортёр и блот","сравнение с\nконтролем"],"hl":1}}],"fixed":"Пиктограммы условные: число точек и интенсивность полос не являются данными эксперимента."}}},{"id":"lyso-damage","number":13,"section":2,"title":"Чем и как повреждается лизосомная мембрана","question":3,"questions":[3],"keywords":["лизосома","проницаемость мембраны","LLOMe","катепсин C","полилейцин","перекисное окисление липидов","агрегаты","кристаллы","катепсины","гликаны"],"lead":["[[T31|Проницаемость лизосомной мембраны]] — потеря мембраной барьерной функции: из кислой лизосомы с десятками гидролаз выходят протоны, ионы Ca²⁺ и ферменты.","Повреждение бывает малым и крупным, и от его размера зависит, какие сигналы возникнут."],"mechanism":["Детергент-подобные вещества и продукты окисления липидов нарушают упаковку липидов лизосомной мембраны; кристаллы и агрегаты, как предполагают, разрывают её механически, а бактерии образуют поры.","[[T32|LLOMe]] проникает в лизосому, и [[T33|катепсин C]] превращает его в полилейцины, которые и нарушают мембрану.","Малое повреждение пропускает протоны и Ca²⁺; при крупном наружу выходят катепсины, а белки цитозоля получают доступ к гликанам внутренней стороны мембраны."],"paragraphs":["Лизосома окружена одной мембраной. Внутри pH около 4,5–5 и более 50 гидролаз, а внутренняя поверхность мембраны выстлана гликанами, которые защищают её от ферментов. Концентрация Ca²⁺ в просвете высока, в цитозоле мала.","Проницаемость растёт тремя путями, которые зависят от вида и силы воздействия: диффузией через плохо упакованный бислой, временными тороидальными порами и осмотическими разрывами. Так действуют вещества с детергентными свойствами и продукты перекисного окисления липидов (лизосомы богаты железом, и в них легко образуются активные формы кислорода). Для фагоцитированных кристаллов и нейротоксичных агрегатов (тау, α-синуклеин, β-амилоид) предполагают механический разрыв мембраны; наночастицы кремнезёма, напротив, действуют через перекисное окисление липидов. Бактерии образуют поры или разрывают мембрану.","В эксперименте мембрану повреждают LLOMe. Он пассивно проникает в лизосому, протонируется и остаётся в ней; катепсин C конденсирует его в полилейцины со средней длиной около шести остатков. Поэтому чувствительность клеток к LLOMe зависит от уровня катепсина C.","Сначала через слабо упакованную мембрану проходят вода и протоны: pH просвета растёт и мембранный потенциал теряется, а это косвенно активирует каналы лизосомы, через которые выходит Ca²⁺ (Ca²⁺ выходит и через временные поры). Крупный разрыв или осмотический взрыв выпускает катепсины, а в просвет проникают сахар-связывающие белки цитозоля. Клетки способны пережить ограниченное повреждение, но утечка протонов и гидролаз при тяжёлом повреждении может запустить гибель клетки или воспаление. Как цитозольные белки получают доступ к гликанам при повреждении без разрыва, неизвестно."],"trap":["LLOMe повреждает любую мембрану одинаково, потому что сам является детергентом.","LLOMe — предшественник. Он накапливается в кислых отсеках, где катепсин C превращает его в полилейцины; эти продукты нарушают мембрану, поэтому действие вещества зависит от уровня катепсина C."],"conditions":"Схема механизма; состояния качественные. Сведения об LLOMe и о путях повышения проницаемости взяты из обзора Meyer & Kravic 2024; эксперименты с LLOMe выполнены в основном на культивируемых клетках человека (HeLa и другие). Действие кристаллов, агрегатов и бактерий показано по обзорным данным; относительный вклад путей в тканях при болезнях изучен слабо.","sources":["MeyerKravic2024","Papadopoulos2017","Aits2015","Skowyra2018"],"quiz":{"id":"S12-L13","rev":1,"question":"Клетки с нокаутом катепсина C обработали той же дозой LLOMe, которая повреждает лизосомы контрольных клеток. Какое изменение ожидается по сравнению с контролем?","options":[{"id":"S12-L13-1","text":"Повреждение выражено так же, потому что LLOMe нарушает мембрану без превращений.","correct":false,"feedback":"LLOMe — предшественник: мембрану нарушают полилейцины, а для их образования нужен катепсин C."},{"id":"S12-L13-2","text":"Повреждение выражено слабее, потому что полилейцины образуются в меньшем количестве.","correct":true,"feedback":"Верно: токсичность LLOMe зависит от уровня катепсина C, поскольку мембрану повреждают продукты превращения, а не сам эфир."},{"id":"S12-L13-3","text":"Повреждение выражено сильнее, потому что LLOMe не расходуется на образование полилейцинов.","correct":false,"feedback":"Токсичность зависит от катепсина C; мембрану, как считают, нарушают продукты конденсации (полилейцины), действие самого эфира не показано, поэтому избыток эфира без катепсина C не усиливает повреждение."}]},"widget":{"kind":"net","title":"","s":{"title":"Как воздействие повышает проницаемость лизосомной мембраны","status":"Схема механизма · качественные состояния","ctrls":[{"id":"a","type":"group","label":"Воздействие","opts":["Нет","LLOMe","Кристаллы или агрегаты","Окисление липидов","Бактерии"]},{"id":"x","type":"group","label":"Размер повреждения","opts":["Малое","Крупное"]},{"id":"c","type":"check","label":"Катепсин C отсутствует (нокаут)"}],"W":660,"H":320,"NW":340,"NH":440,"fs":16,"nfs":14,"lfs":14,"zfs":14,"lg":{"title":"Обозначения на схеме","act":"приводит к, вызывает","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"выход или перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, узнавание","seq":"порядок событий, путь белка","eq":"равновесие","dash":"гипотеза или отдельный процесс","nodes":["жёлтая рамка — звено или процесс активно","пунктирная рамка — не происходит","пунктирная рамка с крестом — белок отсутствует"]},"fixed":"Состояния качественные: схема показывает, какие звенья работают, а не их количество.","zones":[{"x":170,"y":10,"w":270,"h":300,"c":"lyso","t":"просвет лизосомы","n":[8,74,324,176,18,158],"tn":"просвет лизосомы"},{"x":452,"y":10,"w":196,"h":300,"c":"cyto","t":"цитозоль","n":[8,252,324,176],"tn":"цитозоль"}],"mem":[],"nodes":{"ag":{"p":[86,166,136,76],"t":"воздействие","n":[170,36,240,44],"fs":16},"ctsc":{"p":[305,58,130,36],"t":"катепсин C","n":[72,112,112,34],"fs":15},"pl":{"p":[305,138,146,52],"t":"полилейцин\n(≈6 остатков)","n":[250,112,170,40],"fs":15,"tn":"полилейцин\n(≈6 остатков)"},"mem":{"p":[305,232,146,52],"t":"мембрана\nлизосомы","n":[170,192,250,44],"fs":16,"tn":"мембрана лизосомы"},"h":{"p":[550,66,150,46],"t":"H⁺ выходит,\npH просвета ↑","n":[84,308,124,44],"fs":14,"tn":"H⁺ выходит,\npH ↑","nfs":13},"ca":{"p":[550,134,150,40],"t":"Ca²⁺ выходит","n":[258,308,124,44],"fs":14,"nfs":13},"cat":{"p":[550,204,15
