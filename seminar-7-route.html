},"bg":{"a":"beta","b":"gamma","k":"bind"}},"st":{"0-1":{"n":{"alpha":"on","gamma":"sel","nuc":"met","lkb1":"base","ppase":"off"},"e":{"pp":"off"},"b":{"loop":{"t":"Thr172 · активация киназы","at":"b","al":"start"}},"m":[["Аллостерическая активация","есть"],["Защита Thr172 от фосфатаз","есть"],["Активность AMPK","высокая"]],"note":"AMP в регуляторном участке аллостерически повышает активность фосфорилированного комплекса и защищает Thr172 от дефосфорилирования."},"1-1":{"t":{"nuc":"ADP"},"n":{"alpha":"base","gamma":"sel","nuc":"met","lkb1":"base","ppase":"off"},"e":{"pp":"off","allo":"off"},"b":{"loop":{"t":"Thr172 · активация киназы","at":"b","al":"start"}},"m":[["Аллостерическая активация","нет"],["Защита Thr172 от фосфатаз","есть"],["Активность AMPK","повышена фосфорилированием"]],"note":"ADP защищает фосфорилированный Thr172 от фосфатаз, но аллостерической активации, как AMP, не вызывает."},"2-1":{"t":{"nuc":"ATP"},"n":{"alpha":"base","gamma":"base","nuc":"met","lkb1":"base","ppase":"on"},"e":{"allo":"off"},"b":{"loop":{"t":"Thr172 · дефосфорилируется","at":"b","al":"start"}},"m":[["Аллостерическая активация","нет"],["Защита Thr172 от фосфатаз","нет"],["Активность AMPK","снижается со временем"]],"note":"ATP занимает регуляторный участок: аллостерической активации и защиты нет, фосфатазы дефосфорилируют Thr172."},"0-0":{"n":{"alpha":"off","loop":"off","gamma":"sel","nuc":"met","lkb1":"on","ppase":"off"},"e":{"pp":"off","allo":"off"},"m":[["Аллостерическая активация","без фосфорилирования петли мала"],["Фосфорилирование Thr172","AMP способствует"],["Активность AMPK","низкая"]],"note":"Петля не фосфорилирована: активность низкая. AMP способствует фосфорилированию Thr172 киназой LKB1, которая сама AMP не связывает."},"1-0":{"t":{"nuc":"ADP"},"n":{"alpha":"off","loop":"off","gamma":"sel","nuc":"met","lkb1":"base","ppase":"off"},"e":{"pp":"off","allo":"off"},"m":[["Аллостерическая активация","нет"],["Фосфорилирование Thr172","ADP способствует"],["Активность AMPK","низкая, пока петля не фосфорилирована"]],"note":"Петля не фосфорилирована, активность низкая. ADP, как и AMP, способствует фосфорилированию Thr172 киназой LKB1, но аллостерически комплекс не активирует."},"2-0":{"t":{"nuc":"ATP"},"n":{"alpha":"off","loop":"off","gamma":"base","nuc":"met","lkb1":"base","ppase":"base"},"e":{"allo":"off","lk":"off","pp":"off"},"m":[["Аллостерическая активация","нет"],["Фосфорилирование Thr172","не поддерживается"],["Активность AMPK","низкая"]],"note":"ATP в регуляторном участке и нефосфорилированная петля: AMPK неактивна."}},"fixed":"Нумерация Thr172 — для AMPKα2 человека (в α1 человека — Thr183). LKB1 показана постоянно присутствующей; её активность нуклеотидами не регулируется.","static":["Гетеротример AMPK: α (киназный домен и петля с Thr172), β, γ (регуляторный участок). AMP в регуляторном участке аллостерически активирует фосфорилированный комплекс, способствует фосфорилированию Thr172 киназой LKB1 и защищает его от фосфатаз; ADP способствует фосфорилированию и защищает петлю, но аллостерически не активирует; ATP противодействует этим эффектам."]}}},{"id":"ampk-targets","number":11,"section":1,"title":"Как AMPK меняет регуляцию синтеза и окисления","question":2,"questions":[2],"keywords":["AMPK","TSC","RAPTOR","ACC","Малонил-CoA","Метаболический поток","HMGCR","Как AMPK меняет регуляцию синтеза и окисления"],"lead":["Действие AMPK определяется её субстратами.","Результат фосфорилирования нужно описывать отдельно для TSC2, RAPTOR и ACC."],"mechanism":["AMPK воздействует на [[T16|TSC2]] и [[T03|RAPTOR]], ограничивая часть сигналов mTORC1.","AMPK фосфорилирует [[T55|ACC]] и снижает образование [[T57|малонил-CoA]].","Снижение малонил-CoA может ослабить ингибирование CPT1 при сохранённых остальных условиях окисления."],"paragraphs":["Действие AMPK определяется тем, какие белки она фосфорилирует и как модификация меняет каждый из них. С сигналом mTORC1 AMPK связана двумя путями. Фосфорилирование TSC2 под действием AMPK усиливает GAP-действие комплекса TSC: RHEB переходит в GDP-форму. Фосфорилирование RAPTOR под действием AMPK создаёт участки связывания белков 14-3-3 и подавляет mTORC1 даже в клетках без TSC2 (Gwinn и соавт., 2008, по обзору Smith и соавт., 2026). Направление действия на TSC2 противоположно действию AKT: AKT ослабляет TSC, а AMPK его усиливает. Поэтому направление действия фосфорилирования указывают для каждого белка отдельно. Встречается и обратная связь от пути mTORC1 к AMPK: в гипоталамусе мыши киназа S6K1 (p70S6K) фосфорилировала α2-субъединицу AMPK по Ser491, и это фосфорилирование снижало активность AMPK; оно было необходимо для того, чтобы гормон лептин снижал активность α2-AMPK в гипоталамусе и потребление пищи (Dagon и соавт., 2012). Из этого примера не следует общее правило взаимного торможения двух путей во всех клетках.","Третья мишень — ацетил-CoA-карбоксилаза (ACC), фермент, образующий малонил-CoA. Фосфорилирование ACC под действием AMPK снижает активность фермента и образование малонил-CoA. Малонил-CoA служит субстратом синтеза жирных кислот и ингибитором CPT1 — фермента, с которого начинается перенос длинноцепочечных ацильных групп в митохондрии. Подробно эта связь разобрана в разделе 3. Снижение активности ACC ещё не равно усилению [[T40|метаболического потока]] β-окисления: поток — количество вещества, проходящее через путь за единицу времени, — зависит и от других звеньев.","Ответы AMPK различаются по времени. Быстрые ответы — изменения активности уже имеющихся ферментов за минуты. Так, AMPK фосфорилирует ACC, а также [[T97|HMGCR]] (ГМГ-CoA-редуктазу) — фермент, ограничивающий скорость синтеза холестерина, — и снижает активность обоих ферментов. В скелетной мышце AMPK способствует перемещению переносчика глюкозы GLUT4 на плазматическую мембрану; GLUT4 — переносчик глюкозы, содержание которого на мембране регулируется в определённых тканях, включая скелетную мышцу и жировую ткань. В определённых клетках AMPK фосфорилирует отдельные изоформы семейства PFKFB (в обзоре Steinberg, Hardie, 2023 среди мишеней AMPK названы PFKFB2 и PFKFB3); ферменты PFKFB образуют и гидролизуют фруктозо-2,6-бисфосфат — регулятор гликолиза. Эти эффекты зависят от ткани и изоформы и не переносятся одинаково на печень и мышцу. Медленные ответы — изменения экспрессии генов за часы — рассмотрены в шаге об адаптации.","Само фосфорилирование ферментов не образует ATP. AMPK снижает скорость процессов, расходующих ATP (синтез жирных кислот, холестерина и белков), и способствует процессам, обеспечивающим образование ATP: поступлению глюкозы в мышечную клетку и окислению жирных кислот. AMPK при этом не прекращает весь синтез веществ в клетке, а ответы разных тканей различаются."],"trap":["AMPK ингибирует TSC2 и активирует RAPTOR так же, как ростовой сигнал.","В рассматриваемой ветви AMPK ограничивает mTORC1 через TSC2 и RAPTOR, а направление действия отличается от ростового сигнала AKT."],"conditions":"Речь об ингибирующих AMPK-зависимых модификациях ACC и выбранных регуляторных связях; другие участки фосфорилирования и тканевые ответы рассматриваются отдельно.","sources":["Steinberg2023","Smith2026","Fullerton2013","Goul2023","Dagon2012"],"quiz":{"id":"S7-L11","question":"В основной модели AMPK фосфорилирует ACC по ингибирующему участку. Какое ближайшее изменение связано с этой реакцией?","options":[{"id":"S7-L11-3","text":"Активность ACC не меняется: AMPK регулирует только экспрессию её гена.","correct":false,"feedback":"Указана быстрая модификация фермента; её действие нельзя свести к изменению экспрессии гена."},{"id":"S7-L11-1","text":"Снижается активность ACC и образование малонил-CoA.","correct":true,"feedback":"Ингибирующее фосфорилирование ACC уменьшает образование малонил-CoA; дальнейший поток проверяют отдельно."},{"id":"S7-L11-2","text":"Возрастает активность ACC и образование малонил-CoA.","correct":false,"feedback":"Для указанного ингибирующего участка направление действия противоположно."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Три мишени AMPK и последствия их фосфорилирования","status":"Схема механизма · аминокислоты и ростовой сигнал фиксированы, AMPK задана условно","ctrls":[{"id":"a","type":"check","label":"AMPK активна (фосфорилирована по Thr172)","def":false}],"W":640,"H":310,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"ampk":{"p":[90,150,120,46],"n":[170,40,130,44],"t":"AMPK"},"tsc":{"p":[300,55,120,40],"n":[70,140,110,40],"t":"TSC2"},"raptor":{"p":[300,150,120,40],"n":[170,210,110,40],"t":"RAPTOR"},"acc":{"p":[300,255,120,40],"n":[270,140,110,40],"t":"ACC"},"rheb":{"p":[470,55,120,40],"n":[70,290,110,40],"t":"RHEB–GTP"},"mtorc1":{"p":[560,150,120,44],"n":[170,380,120,42],"t":"mTORC1"},"mal":{"p":[490,255,130,40],"n":[270,290,110,40],"t":"малонил-CoA","fs":14}},"edges":{"t1":{"a":"ampk","b":"tsc","k":"phos"},"r1":{"a":"ampk","b":"raptor","k":"phos"},"a1":{"a":"ampk","b":"acc","k":"phos"},"t2":{"a":"tsc","b":"rheb","k":"inh","t":"GAP","d":[0,-10],"dn":[-22,0]},"h2":{"a":"rheb","b":"mtorc1","k":"act","t":"","d":[0,-10]},"r2":{"a":"raptor","b":"mtorc1","k":"inh","t":"14-3-3 связан","d":[0,-12],"tn":""},"c2":{"a":"acc","b":"mal","k":"rx","t":"образование","d":[0,-12],"tn":""}},"st":{"0":{"n":{"ampk":"off","tsc":"base","raptor":"base","acc":"on","rheb":"on","mtorc1":"on","mal":"met"},"e":{"t1":"off","r1":"off","a1":"off","t2":"off","r2":"off"},"m":[["TSC2 (GAP на RHEB)","без дополнительного усиления"],["mTORC1","активен"],["ACC → малонил-CoA","образование идёт"]],"note":"AMPK неактивна: действие TSC2 дополнительно не усиливается, RAPTOR не фосфорилирован AMPK, ACC образует малонил-CoA. Аминокислоты и ростовой сигнал постоянны; активность AMPK задана переключателем условно, без указания причины её активации."},"1":{"t":{"rheb":"RHEB–GDP"},"n":{"ampk":"on","tsc":"on","raptor":"base","acc":"off","rheb":"off","mtorc1":"off","mal":"off"},"e":{"h2":"off","c2":"off"},"b":{"tsc":{"t":"усиление GAP-действия","at":"t"},"raptor":{"t":"связывание 14-3-3, торможение","at":"t"},"acc":{"t":"снижение активности","at":"b","al":"start"}},"m":[["TSC2 (GAP на RHEB)","усилено"],["mTORC1","подавлен двумя путями"],["ACC → малонил-CoA","снижено"]],"note":"Активная AMPK фосфорилирует три мишени с разным знаком действия: GAP-действие TSC2 усиливается, RAPTOR связывает 14-3-3 и mTORC1 подавляется, активность ACC и образование малонил-CoA снижаются."}},"fixed":"Постоянные условия: аминокислоты и инсулиновый сигнал поддержаны. Изменение потока β-окисления на этой схеме не показано — его проверяют отдельно.","static":["AMPK фосфорилирует три белка: TSC2 (GAP-действие на RHEB усиливается), RAPTOR (связывание 14-3-3, mTORC1 подавляется даже без TSC2) и ACC (активность и образование малонил-CoA снижаются). Направление действия на TSC2 противоположно действию AKT."]}}},{"id":"glucose-sensing","number":12,"section":1,"title":"Как AMPK отвечает на снижение глюкозы без обязательного изменения AMP","question":2,"questions":[2],"keywords":["Альдолаза","FBP","AXIN","LKB1","Ragulator","V-ATPase","Как AMPK отвечает на снижение глюкозы без обязательного изменения AMP"],"lead":["В некоторых клетках AMPK активируется при снижении глюкозы без обнаружимого изменения соотношений аденилатов.","Такой ответ связан с альдолазой и лизосомной организацией регуляторного комплекса."],"mechanism":["Снижение глюкозы может уменьшать содержание фруктозо-1,6-бисфосфата.","Меняется занятость [[T41|альдолазы]] этим метаболитом; через каналы TRPV эндоплазматического ретикулума и V-ATPase это ведёт к сборке комплекса с [[T43|AXIN]] и LKB1 у лизосомы.","В выбранных условиях активация AMPK не требует предварительного роста AMP/ATP."],"paragraphs":["[[T42|Фруктозо-1,6-бисфосфат]] (FBP) — промежуточный метаболит гликолиза, субстрат альдолазы. Альдолаза расщепляет FBP на две триозы. Фруктозо-1,6-бисфосфат не следует путать с фруктозо-2,6-бисфосфатом — регуляторным метаболитом, который образуют ферменты PFKFB и который не входит в последовательность реакций гликолиза. При удалении глюкозы из среды гликолиз замедляется, и содержание FBP в клетке снижается.","Zhang и соавт. (2017) описали путь, в котором сигналом служит не сам AMP, а занятость альдолазы. Альдолаза, не связанная с FBP, передаёт сигнал на лизосому в несколько этапов. Сначала она взаимодействует с каналами TRPV эндоплазматического ретикулума (ЭПР) и ограничивает их активность, поэтому на контактах ЭПР с лизосомой локальный выход Ca²⁺ из ЭПР уменьшается (Li и соавт., 2019). При низком локальном Ca²⁺ ингибированный TRPV оказывается доступен для связывания с [[T44|V-ATPase]] — протонным насосом лизосомной мембраны. Это меняет конфигурацию V-ATPase, и к комплексу V-ATPase–Ragulator привлекаются каркасный белок AXIN и киназа LKB1. Так LKB1 оказывается рядом с AMPK, часть которой находится у лизосомы, и фосфорилирует её Thr172. Альдолаза, TRPV, V-ATPase, Ragulator и AXIN — участники описанного пути, а не универсальные датчики любого стресса. Общая концентрация Ca²⁺ в цитозоле при удалении глюкозы не меняется, и CaMKK2 для этого механизма не требуется (обзор Steinberg, Hardie, 2023).","Этот путь отличается от канонического и от кальциевого пути активации AMPK через Ca²⁺–кальмодулин–CaMKK2 (следующий шаг): там активацию вызывает повышение концентрации Ca²⁺ в цитозоле, а здесь — снижение локального выхода Ca²⁺ на контактах ЭПР с лизосомой. В каноническом пути AMP или ADP связываются с γ-субъединицей AMPK. В пути через альдолазу меняется сборка регуляторного комплекса на лизосоме. В исследованных клетках AMPK активировалась после удаления глюкозы, хотя отношения AMP/ATP и ADP/ATP в пределах измерения не менялись. Результат относится к этим клеткам и условиям; он не означает, что в любой ткани реакция на глюкозу совсем не зависит от аденилатов, а аденилатный вход к AMPK остаётся параллельным путём.","Поэтому вывод о причине активации требует нескольких независимых измерений: состояния аденилатного пула, фосфорилирования AMPK и её действия на субстрат, например на ACC. Утверждение «AMPK всегда включается раньше падения ATP» неверно: последовательность событий зависит от вида воздействия и измеряется в каждом эксперименте отдельно."],"trap":["Активация AMPK обязательно доказывает снижение ATP или увеличение AMP.","Существуют дополнительные пути активации; состояние аденилатного пула нужно измерить самостоятельно."],"conditions":"Качественная иллюстрация механизма Zhang 2017; звено TRPV описано по Li и соавт. (2019) в клетках человека и мыши и у нематоды, универсальность для всех тканей не установлена; без переноса конкретной клеточной линии, срока или дозы из другой работы. «Не изменилось» означает пределы выбранного измерения.","sources":["Zhang2017","Steinberg2023","Smith2026","Li2019"],"quiz":{"id":"S7-L12","question":"В исследованной системе после удаления глюкозы AMPK активировалась, а AMP/ATP и ADP/ATP не изменились в пределах измерения. Какой вывод допустим?","options":[{"id":"S7-L12-2","text":"AMPK не может быть активна, пока не уменьшится измеренное содержание ATP.","correct":false,"feedback":"Это отрицает результат и смешивает один канонический вход со всеми возможными входами."},{"id":"S7-L12-3","text":"Во всех клетках действие глюкозы полностью независимо от состояния аденилатов.","correct":false,"feedback":"Отдельная система не устанавливает универсальную независимость от нуклеотидов."},{"id":"S7-L12-1","text":"В этой системе возможен путь активации без обнаружимого изменения аденилатов.","correct":true,"feedback":"Наблюдение согласуется с дополнительным метаболит-зависимым механизмом, описанным для определённых клеток."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Занятость альдолазы и сборка комплекса у лизосомы","status":"Схема механизма по Zhang и соавт., 2017 · один описанный путь","ctrls":[{"id":"g","type":"group","label":"Состояние альдолазы","opts":["FBP связан с альдолазой (глюкоза есть)","FBP не связан (глюкозу удалили)"]}],"W":640,"H":320,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":240,"w":620,"h":72,"c":"lyso","t":"лизосома","lx":24,"ly":296,"n":[6,392,328,70,16,452]}],"mem":[{"x1":10,"y1":236,"x2":630,"y2":236,"n":[6,388,334,388]}],"nodes":{"glc":{"p":[80,50,120,40],"n":[80,40,130,40],"t":"глюкоза","fs":14},"fbp":{"p":[80,140,120,40],"n":[80,120,130,40],"t":"FBP","fs":15},"ald":{"p":[250,140,130,40],"n":[250,120,130,40],"t":"альдолаза","fs":14},"vat":{"p":[235,228,130,36],"n":[80,380,130,36],"t":"V-ATPase","fs":14},"rgl":{"p":[400,228,130,36],"n":[250,380,130,36],"t":"Ragulator","fs":14},"axin":{"p":[420,140,140,44],"n":[255,250,130,44],"t":"AXIN–LKB1","fs":14},"ampk":{"p":[570,140,100,44],"n":[90,250,110,44],"t":"AMPK"},"adn":{"p":[570,50,120,46],"n":[255,40,130,46],"t":"AMP/ATP,\nADP/ATP","fs":13}},"edges":{"g1":{"a":"glc","b":"fbp","k":"seq","t":"гликолиз","d":[44,0],"dn":[46,0]},"f1":{"a":"fbp","b":"ald","k":"bind","t":"связывание","d":[0,-12],"dn":[0,-12]},"a1":{"a":"ald","b":"vat","k":"act","t":"","dash":true},"v1":{"a":"vat","b":"rgl","k":"bind"},"r1":{"a":"rgl","b":"axin","k":"act","t":"сборка","d":[30,0],"dn":[-30,0],"dash":true},"l1":{"a":"axin","b":"ampk","k":"phos","t":"","d":[0,-12]}},"st":{"0":{"n":{"glc":"met","fbp":"met","ald":"base","vat":"base","rgl":"base","axin":"off","ampk":"off","adn":"base"},"e":{"a1":"off","r1":"off","l1":"off"},"m":[["Альдолаза","связана с FBP"],["Комплекс AXIN–LKB1 у лизосомы","не собирается"],["Фосфорилирование AMPK этим путём","низкое"]],"note":"Пока гликолиз идёт и FBP связан с альдолазой, комплекс AXIN–LKB1 на лизосоме не собирается, и этот путь AMPK не активирует. Аденилатные отношения в сравнении фиксированы."},"1":{"t":{"glc":"нет глюкозы"},"n":{"glc":"off","fbp":"off","ald":"sel","vat":"on","rgl":"on","axin":"on","ampk":"on","adn":"base"},"e":{"g1":"off","f1":"off"},"b":{"ampk":{"t":"Thr172 · активация","at":"t"}},"m":[["Альдолаза","не связана с FBP"],["Комплекс AXIN–LKB1 у лизосомы","собирается"],["Фосфорилирование AMPK этим путём","повышено"]],"note":"Без FBP альдолаза через V-ATPase и Ragulator способствует сборке AXIN–LKB1 у лизосомы; LKB1 фосфорилирует AMPK. В исследованных клетках AMP/ATP и ADP/ATP при этом в пределах измерения не менялись."}},"fixed":"Аденилатные отношения в этом сравнении заданы неизменными (узел «AMP/ATP, ADP/ATP» без изменений). Это один описанный путь, а не все ответы клетки на глюкозу.","static":["Глюкоза → гликолиз → FBP, связанный с альдолазой. При удалении глюкозы альдолаза не занята FBP, через каналы TRPV эндоплазматического ретикулума и V-ATPase способствует сборке комплекса AXIN–LKB1 у лизосомы (локальный выход Ca²⁺ снижается); LKB1 фосфорилирует AMPK. В исследованных клетках это происходило без обнаружимого изменения отношений AMP/ATP и ADP/ATP."]}}},{"id":"calcium-ampk","number":13,"section":1,"title":"Как Ca²⁺ и CaMKK2 создают другой вход к AMPK","question":2,"questions":[2],"keywords":["CaMKK2","Кальмодулин","LKB1","AMPK","Как Ca²⁺ и CaMKK2 создают другой вход к AMPK"],"lead":["В подходящем клеточном контексте повышение Ca²⁺ может активировать AMPK через CaMKK2.","Этот путь не требует, чтобы каждое повышение активности AMPK предварялось энергетическим дефицитом."],"mechanism":["Ca²⁺ связывается с [[T46|кальмодулином]].","Кальмодулин регулирует [[T45|CaMKK2]], которая фосфорилирует активационную петлю AMPK.","Доступность CaMKK2 и состояние других регуляторов определяют ответ конкретной клетки."],"paragraphs":["Кроме LKB1, Thr172 в AMPK фосфорилируется и киназой CaMKK2 (киназа кальмодулин-зависимых протеинкиназ, β-изоформа). Её активность регулируется ионами кальция не напрямую, а через кальмодулин — небольшой белок, который связывает Ca²⁺ и в связанном с Ca²⁺ виде связывается с другими белками и активирует их. Сам ион Ca²⁺ не является киназой и не переносит фосфорильную группу: он меняет состояние кальмодулина, а комплекс Ca²⁺–кальмодулин активирует CaMKK2.","Этот вход отличается от LKB1-зависимого по сигналу. LKB1, по-видимому, постоянно активна, и её действие на AMPK усиливается тогда, когда AMP или ADP связываются с γ-субъединицей. CaMKK2 активируется при повышении концентрации Ca²⁺ в цитозоле, например после действия гормонов, которые высвобождают Ca²⁺ из внутриклеточных депо. Поэтому активация AMPK через CaMKK2 возможна без предварительного энергетического дефицита и без роста отношения AMP к ATP (Hawley и соавт., 2005).","Выраженность этого пути зависит от ткани. CaMKK2 много в нейронах и некоторых других клетках, а в разных тканях её содержание различается. Поэтому нельзя приписывать CaMKK2 все ответы AMPK, например в сокращающейся скелетной мышце, где одновременно меняются и концентрация Ca²⁺, и состояние аденилатного пула. Вклад каждого входа проверяют отдельно.","Из сказанного следует, что генетическая утрата LKB1 не исключает активацию AMPK полностью. В клетках без LKB1, где CaMKK2 функциональна, повышение Ca²⁺ может усилить фосфорилирование Thr172. Чтобы показать роль CaMKK2, используют утрату или подавление CaMKK2 и измеряют аденилаты независимо, иначе нельзя отличить кальциевый вход от энергетического."],"trap":["В клетках без LKB1 AMPK не может активироваться ни при каких условиях.","При наличии работающего CaMKK2-зависимого пути фосфорилирование AMPK возможно и без LKB1."],"conditions":"Это условная клетка с функциональной CaMKK2; не универсальный ответ всех тканей на Ca²⁺. Энергетические показатели сохранены как условие сравнения.","sources":["Steinberg2023","Smith2026","Hawley2005"],"quiz":{"id":"S7-L13","question":"В клетке отсутствует LKB1, но CaMKK2 функциональна. При сохранённых аденилатах повысили Ca²⁺. Какой ответ AMPK допускает эта схема?","options":[{"id":"S7-L13-1","text":"Фосфорилирование AMPK через CaMKK2 может усилиться.","correct":true,"feedback":"CaMKK2 — альтернативная вышестоящая киназа в заданном клеточном контексте."},{"id":"S7-L13-2","text":"Фосфорилирование AMPK обязательно остаётся невозможным.","correct":false,"feedback":"Утрата одного входа не исключает действующего альтернативного входа."},{"id":"S7-L13-3","text":"Ca²⁺ обязательно вытесняет AMP из γ-субъединицы и подавляет AMPK.","correct":false,"feedback":"В заданном пути Ca²⁺ действует через кальмодулин и CaMKK2; его не следует помещать вместо AMP в нуклеотидный участок."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Два входа к Thr172: LKB1 и Ca²⁺–кальмодулин–CaMKK2","status":"Схема механизма · условная клетка с функциональной CaMKK2; аденилаты неизменны","ctrls":[{"id":"lk","type":"check","label":"LKB1 присутствует","def":true},{"id":"ck","type":"check","label":"CaMKK2 функциональна","def":true},{"id":"ca","type":"check","label":"Концентрация Ca²⁺ в цитозоле повышена","def":false}],"W":640,"H":280,"NW":340,"NH":420,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"ca":{"p":[70,60,100,40],"n":[50,40,84,40],"t":"Ca²⁺"},"cam":{"p":[230,60,140,40],"n":[215,40,130,40],"t":"кальмодулин","fs":14},"ck":{"p":[400,60,120,40],"n":[200,130,130,40],"t":"CaMKK2"},"lk":{"p":[400,215,120,40],"n":[70,230,110,40],"t":"LKB1"},"adn":{"p":[180,215,150,46],"n":[70,330,130,46],"t":"AMP/ADP\n(не изменены)","fs":13},"ampk":{"p":[560,130,110,46],"n":[240,300,120,46],"t":"AMPK"}},"edges":{"c1":{"a":"ca","b":"cam","k":"bind","t":"связывание","d":[0,-12]},"c2":{"a":"cam","b":"ck","k":"act","t":"","d":[0,-10]},"c3":{"a":"ck","b":"ampk","k":"phos"},"l1":{"a":"lk","b":"ampk","k":"phos","pm":0.35},"n1":{"a":"adn","b":"ampk","k":"act","t":"связывание с γ-субъединицей AMPK","d":[0,24],"dn":[0,0],"dash":true}},"base":{"e":{"n1":"off"}},"st":{"0-0-0":{"n":{"ca":"off","cam":"base","ck":"abs","lk":"abs","adn":"base","ampk":"base"},"e":{"c1":"off","c2":"off","c3":"off","l1":"off"},"b":{},"m":[["Вход через LKB1","нет (LKB1 отсутствует)"],["Вход через CaMKK2","нет: CaMKK2 нефункциональна"],["Фосфорилирование Thr172","низкое: LKB1 нет"]],"note":"LKB1 нет, CaMKK2 нефункциональна, Ca²⁺ не повышен: фосфорилирование Thr172 низкое."},"0-0-1":{"n":{"ca":"met","cam":"on","ck":"abs","lk":"abs","adn":"base","ampk":"base"},"e":{"c1":"on","c2":"off","c3":"off","l1":"off"},"b":{},"m":[["Вход через LKB1","нет (LKB1 отсутствует)"],["Вход через CaMKK2","нет: CaMKK2 нефункциональна"],["Фосфорилирование Thr172","низкое: LKB1 нет"]],"note":"Ca²⁺ повышен и связан с кальмодулином, но CaMKK2 нефункциональна: кальциевый вход к AMPK не действует. LKB1 тоже нет, поэтому фосфорилирование Thr172 низкое."},"0-1-0":{"n":{"ca":"off","cam":"base","ck":"base","lk":"abs","adn":"base","ampk":"base"},"e":{"c1":"off","c2":"off","c3":"off","l1":"off"},"b":{},"m":[["Вход через LKB1","нет (LKB1 отсутствует)"],["Вход через CaMKK2","Ca²⁺ не повышен"],["Фосфорилирование Thr172","низкое: LKB1 нет"]],"note":"LKB1 нет, Ca²⁺ не повышен: фосфорилирование Thr172 низкое. Если повысить Ca²⁺ при функциональной CaMKK2, оно может возрасти."},"0-1-1":{"n":{"ca":"met","cam":"on","ck":"on","lk":"abs","adn":"base","ampk":"on"},"e":{"c1":"on","c2":"on","c3":"on","l1":"off"},"b":{"ampk":{"t":"","at":"t"}},"m":[["Вход через LKB1","нет (LKB1 отсутствует)"],["Вход через CaMKK2","действует"],["Фосфорилирование Thr172","повышено"]],"note":"LKB1 нет, но CaMKK2 функциональна: повышенный Ca²⁺ через кальмодулин активирует CaMKK2, и Thr172 фосфорилируется. Утрата одного входа не исключает другой."},"1-0-0":{"n":{"ca":"off","cam":"base","ck":"abs","lk":"base","adn":"base","ampk":"base"},"e":{"c1":"off","c2":"off","c3":"off","l1":"on"},"b":{},"m":[["Вход через LKB1","есть, без энергетического сигнала"],["Вход через CaMKK2","нет: CaMKK2 нефункциональна"],["Фосфорилирование Thr172","базальное (LKB1, аденилаты не изменены)"]],"note":"LKB1 есть, CaMKK2 нефункциональна, Ca²⁺ не повышен, аденилаты не изменены: фосфорилирование Thr172 остаётся базальным."},"1-0-1":{"n":{"ca":"met","cam":"on","ck":"abs","lk":"base","adn":"base","ampk":"base"},"e":{"c1":"on","c2":"off","c3":"off","l1":"on"},"b":{},"m":[["Вход через LKB1","есть, без энергетического сигнала"],["Вход через CaMKK2","нет: CaMKK2 нефункциональна"],["Фосфорилирование Thr172","базальное (LKB1, аденилаты не изменены)"]],"note":"Ca²⁺ повышен и связан с кальмодулином, но CaMKK2 нефункциональна: кальциевый вход к AMPK не действует."},"1-1-0":{"n":{"ca":"off","cam":"base","ck":"base","lk":"base","adn":"base","ampk":"base"},"e":{"c1":"off","c2":"off","c3":"off","l1":"on"},"b":{},"m":[["Вход через LKB1","есть, без энергетического сигнала"],["Вход через CaMKK2","Ca²⁺ не повышен"],["Фосфорилирование Thr172","базальное (LKB1, аденилаты не изменены)"]],"note":"Ca²⁺ не повышен, аденилаты не изменены: LKB1 присутствует и CaMKK2 функциональна, но дополнительного сигнала по этим входам не задано; фосфорилирование Thr172 остаётся базальным."},"1-1-1":{"n":{"ca":"met","cam":"on","ck":"on","lk":"base","adn":"base","ampk":"on"},"e":{"c1":"on","c2":"on","c3":"on","l1":"on"},"b":{"ampk":{"t":"","at":"t"}},"m":[["Вход через LKB1","есть, без энергетического сигнала"],["Вход через CaMKK2","действует"],["Фосфорилирование Thr172","повышено"]],"note":"Ca²⁺ связывается с кальмодулином, комплекс активирует CaMKK2, и CaMKK2 фосфорилирует Thr172 без изменения AMP и ADP."}},"fixed":"Энергетическое состояние задано неизменным: AMP и ADP не повышены. Повышение Ca²⁺ здесь — условие сравнения, не обязательный признак любой клетки.","static":["Две ветви к Thr172 AMPK: LKB1 (её действие усиливается при связывании AMP или ADP с γ-субъединицей) и Ca²⁺ → кальмодулин → CaMKK2. При неизменных аденилатах и повышенном Ca²⁺ AMPK фосфорилируется через CaMKK2, в том числе в клетках без LKB1; без функциональной CaMKK2 этот вход отсутствует."]}}},{"id":"ampk-adaptation","number":14,"section":1,"title":"Чем быстрые реакции AMPK отличаются от длительной адаптации","question":2,"questions":[2],"keywords":["FNIP1","FLCN","TFEB","PGC-1α","MFF","Биогенез","Snf1","Чем быстрые реакции AMPK отличаются от длительной адаптации"],"lead":["AMPK может быстро изменять активность ферментов и позднее влиять на экспрессию генов.","Увеличение ядерной доли TFEB не равно немедленному образованию новых лизосом и митохондрий."],"mechanism":["Фосфорилирование [[T24|FNIP1]] под действием AMPK меняет работу комплекса FLCN–FNIP1.","В описанном ответе [[T07|TFEB]] перемещается в ядро и влияет на экспрессию генов.","[[T49|Биогенез]] органелл требует последующих изменений РНК, белков и мембран."],"paragraphs":["Ответы AMPK развиваются на разных масштабах времени. Фосфорилирование ACC или HMGCR меняет активность уже имеющихся молекул фермента за минуты. Изменение экспрессии генов требует транскрипции, процессинга РНК и синтеза белков и проявляется позже, обычно через часы. Это качественная последовательность: точная длительность каждого этапа зависит от клеток, воздействия и измеряемого показателя.","Пример медленного ответа описали Malik и соавт. (2023) в клетках с повреждёнными митохондриями. AMPK фосфорилирует FNIP1 — партнёра FLCN, с которым он образует комплекс, переводящий RagC/D в GDP-форму. После фосфорилирования FNIP1 комплекс FLCN–FNIP1 хуже поддерживает фосфорилирование TFEB комплексом mTORC1, и TFEB перемещается в ядро. В ядре TFEB активирует экспрессию генов лизосомных белков, а также генов транскрипционного коактиватора [[T47|PGC-1α]] и транскрипционного фактора ERRα — ядерного рецептора, родственного рецептору эстрогенов. PGC-1α вместе с ERRα стимулирует экспрессию генов митохондриальных белков, необходимых для образования митохондрий. Перемещение TFEB в ядро — первый этап: биогенез лизосом и митохондрий требует новых РНК, белков и мембран и измеряется отдельно. AMPK действует и на другие транскрипционные факторы: она фосфорилировала FOXO3 человека по шести ранее неизвестным участкам; в клетках млекопитающих это фосфорилирование повышало транскрипционную активность FOXO3, не меняя его распределения между ядром и цитоплазмой (Greer и соавт., 2007). Активация FOXO3 сама по себе не означает усиления биогенеза митохондрий.","AMPK влияет на митохондрии и через другие мишени. Фосфорилирование [[T48|MFF]] — белка наружной митохондриальной мембраны, привлекающего белок деления DRP1, — способствует делению митохондрий. Деление, биогенез и митофагия — разные процессы. Деление меняет число и размер митохондрий, биогенез создаёт новые митохондриальные компоненты, митофагия удаляет повреждённые участки через аутофагию. Ни один из них нельзя установить, измерив только другой.","Регуляторы такого рода есть у многих эукариот. У дрожжей киназа Snf1 — гомолог α-субъединицы AMPK — необходима для ответа на снижение глюкозы, а родственные TOR-киназы и многие белки Atg, участвующие в аутофагии, сохраняются от дрожжей до млекопитающих. Snf1 — гомолог AMPK у современного организма, а не её непосредственно наблюдаемый предок. Общее происхождение не означает одинаковых входов: Snf1 активируется при снижении глюкозы, а регуляция AMP, характерная для AMPK млекопитающих, у неё выражена иначе. Из сохранения этих белков не следует «лестница прогресса» от дрожжей к человеку: у каждого вида их регуляция соответствует его собственным условиям жизни."],"trap":["После перемещения TFEB в ядро число лизосом мгновенно возрастает.","Локализация фактора предшествует ряду изменений экспрессии и построению органелл; каждый этап проверяют отдельным показателем."],"conditions":"Связь AMPK–FNIP1–TFEB представлена по определённому стрессовому ответу. Не устанавливается обязательная длительность каждого этапа и не утверждается идентичность регуляции всех эукариот.","sources":["Smith2026","Malik2023","Steinberg2023","Goul2023","Greer2007"],"quiz":{"id":"S7-L14","question":"После активации AMPK TFEB обнаружен в ядре. Какое измерение нужно дополнительно для вывода о митохондриальном биогенезе?","options":[{"id":"S7-L14-3","text":"Подсчёт только точек LC3 без оценки митохондриальных компонентов.","correct":false,"feedback":"LC3 связан с аутофагическим аппаратом и не заменяет показатель образования митохондрий."},{"id":"S7-L14-1","text":"Изменение компонентов и объёма митохондрий с контролем их распада.","correct":true,"feedback":"Биогенез относится к построению митохондриальных компонентов; их накопление нужно отличить от уменьшения распада."},{"id":"S7-L14-2","text":"Повторное измерение только ядерной доли TFEB в тот же момент.","correct":false,"feedback":"Локализация TFEB подтверждает один этап регуляции, но не сам биогенез."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"От фосфорилирования фермента к построению органелл","status":"Схема механизма · оси времени качественные, длительности не заданы","ctrls":[{"id":"p","type":"group","label":"Панель","opts":["1. Фосфорилирование фермента","2. TFEB в ядре и РНК","3. Компоненты органелл","Эукариоты: общее и различное"]}],"W":640,"H":300,"NW":340,"NH":460,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":340,"y":150,"w":180,"h":140,"c":"nuc","t":"ядро","lx":352,"ly":170,"n":[6,230,328,110,16,250]}],"nodes":{"ampk":{"p":[80,60,110,44],"n":[60,40,100,42],"t":"AMPK"},"acc":{"p":[250,60,130,40],"n":[200,40,130,40],"t":"ACC, HMGCR","fs":14},"fnip":{"p":[80,170,120,44],"n":[60,140,110,44],"t":"FLCN–\nFNIP1","fs":13},"tfeb":{"p":[250,170,110,40],"n":[200,140,110,40],"t":"TFEB"},"tfebn":{"p":[430,197,120,40],"n":[90,280,120,40],"t":"TFEB в ядре","fs":14},"rna":{"p":[430,262,120,36],"n":[250,280,120,40],"t":"РНК генов-\nмишеней","fs":12.5},"pgc":{"p":[585,183,100,40],"n":[90,370,110,40],"t":"PGC-1α","fs":14},"org":{"p":[585,268,100,44],"n":[250,370,120,44],"t":"лизосомы,\nмитохондрии","fs":12.5},"mff":{"p":[250,120,130,36],"n":[200,90,130,34],"t":"MFF: деление","fs":13},"ev1":{"p":[110,80,190,50],"n":[170,50,220,52],"t":"млекопитающие:\nAMPK, mTORC1, ATG","fs":13},"ev2":{"p":[330,80,190,50],"n":[170,150,220,52],"t":"дрожжи:\nSnf1, TOR, Atg","fs":13},"ev3":{"p":[220,210,400,56],"n":[170,270,320,90],"t":"общее: родственные киназы и белки Atg\nразличное: входы и ответ на AMP","tn":"общее: родственные\nкиназы и белки Atg;\nразличное: входы\nи ответ на AMP","fs":13}},"edges":{"a1":{"a":"ampk","b":"acc","k":"phos","t":"минуты","tn":"","d":[0,-14],"dn":[0,-14]},"a2":{"a":"ampk","b":"fnip","k":"phos"},"a3":{"a":"ampk","b":"mff","k":"phos"},"f1":{"a":"fnip","b":"tfeb","k":"inh","t":"фосфорилирование TFEB\nmTORC1 ослаблено","tn":"","d":[0,28],"dn":[0,30],"dash":true},"t1":{"a":"tfeb","b":"tfebn","k":"tr","t":"в ядро","d":[0,-12],"dn":[-34,0]},"t2":{"a":"tfebn","b":"rna","k":"seq","t":"","d":[0,0]},"t3":{"a":"rna","b":"pgc","k":"seq","t":"часы","d":[24,0],"dn":[-30,0]},"t4":{"a":"pgc","b":"org","k":"seq","t":"","d":[0,0]},"e12":{"a":"ev1","b":"ev2","k":"bind","t":"гомологи","d":[0,-12],"dn":[44,0]}},"base":{"n":{"ev1":"hide","ev2":"hide","ev3":"hide"},"e":{"e12":"hide"},"z":{}},"st":{"0":{"n":{"ampk":"on","acc":"off","mff":"base","fnip":"hide","tfeb":"hide","tfebn":"hide","rna":"hide","pgc":"hide","org":"hide"},"e":{"a2":"hide"},"b":{"acc":{"t":"снижение активности","at":"t","al":"start"},"mff":{"t":"деление митохондрий","at":"b","al":"start"}},"z":{"0":"hide"},"pn":{"ampk":[60,100],"acc":[240,45],"mff":[240,160]},"m":[["Этап","активность уже имеющихся ферментов"],["Масштаб времени","минуты"],["Что измерять","фосфорилирование и активность фермента"]],"note":"Быстрый ответ: AMPK фосфорилирует ACC и HMGCR и снижает их активность; фосфорилирование MFF способствует делению митохондрий. Для этого ответа синтез новых белков не требуется: меняется активность уже имеющихся молекул."},"1":{"n":{"ampk":"on","acc":"hide","mff":"hide","fnip":"base","tfeb":"base","tfebn":"on","rna":"on","pgc":"hide","org":"hide"},"e":{"a1":"hide","a3":"hide"},"b":{"fnip":{"t":"FNIP1","at":"t","al":"start"}},"m":[["Этап","локализация фактора и РНК"],["Масштаб времени","дольше, чем фосфорилирование"],["Что измерять","долю TFEB в ядре, РНК генов-мишеней"]],"note":"AMPK фосфорилирует FNIP1; фосфорилирование TFEB комплексом mTORC1 ослабевает, TFEB перемещается в ядро и активирует транскрипцию генов-мишеней. Органеллы ещё не построены."},"2":{"n":{"ampk":"on","acc":"hide","mff":"hide","fnip":"base","tfeb":"base","tfebn":"on","rna":"on","pgc":"on","org":"on"},"e":{"a1":"hide","a3":"hide"},"b":{"fnip":{"t":"FNIP1","at":"t","al":"start"}},"m":[["Этап","синтез белков и построение органелл"],["Масштаб времени","часы и дольше"],["Что измерять","компоненты и объём органелл с учётом их распада"]],"note":"После изменения РНК синтезируются белки лизосом и митохондрий; PGC-1α вместе с ERRα стимулирует экспрессию генов митохондриальных белков. Накопление органелл проверяют отдельно от их удаления."},"3":{"n":{"ampk":"hide","acc":"hide","mff":"hide","fnip":"hide","tfeb":"hide","tfebn":"hide","rna":"hide","pgc":"hide","org":"hide","ev1":"base","ev2":"base","ev3":"sel"},"e":{"a1":"hide","a2":"hide","a3":"hide","e12":"on"},"z":{"0":"hide"},"m":[["Сохраняется","родственные киназы TOR и AMPK/Snf1, белки Atg"],["Различается","входные сигналы, ответ на AMP"],["Snf1","гомолог, не предок AMPK"]],"note":"У дрожжей и млекопитающих есть родственные TOR-киназы, киназы семейства AMPK/Snf1 и многие белки Atg. Сигналы, которые их регулируют, различаются; это не лестница прогресса."}},"fixed":"Связь AMPK–FNIP1–TFEB показана для ответа на повреждение митохондрий (Malik и соавт., 2023). Длительность этапов не задана.","static":["Панели: (1) за минуты AMPK фосфорилирует ACC и HMGCR, а также MFF (деление митохондрий); (2) фосфорилирование FNIP1 ослабляет фосфорилирование TFEB, TFEB перемещается в ядро, меняется РНК генов-мишеней; (3) синтезируются компоненты лизосом и митохондрий, участвуют PGC-1α и ERRα. Отдельная панель: у дрожжей и млекопитающих сохраняются родственные киназы TOR и AMPK/Snf1 и белки Atg, а входные сигналы различаются."]}}},{"id":"ampk-evidence","number":15,"section":1,"title":"Как проверить активность AMPK и состояние аденилатного пула","question":2,"questions":[2],"keywords":["Иммуноблоттинг","AMPK","ACC","ВЭЖХ/масс-спектрометрия","AICAR/ZMP","Метформин","Dorsomorphin","PRKAG2","Как проверить активность AMPK и состояние аденилатного пула"],"lead":["Фосфорилирование AMPK, действие на ACC и концентрации нуклеотидов — разные показатели.","Для причинного вывода нужны согласованные измерения и подходящее вмешательство."],"mechanism":["Аденилаты измеряют после быстрого прекращения метаболических реакций в образце.","Фосфорилирование активационной петли сопоставляют с действием на определённый субстрат.","Генетический контроль помогает отделить действие AMPK от других действий препарата."],"paragraphs":["Содержание ATP, ADP и AMP измеряют [[T50|высокоэффективной жидкостной хроматографией (ВЭЖХ) или масс-спектрометрией]] — методами, которые разделяют молекулы и определяют их количество. Аденилатный пул меняется за секунды, поэтому метаболические реакции в образце останавливают сразу: клетки быстро охлаждают или переносят в кислотный или органический экстрагент. При медленном приготовлении образца ATP успевает гидролизоваться, и измеренное отношение AMP к ATP оказывается завышенным.","Активность AMPK описывают несколькими показателями. Иммуноблоттинг с антителом к фосфорилированному Thr172 показывает модификацию петли; рядом измеряют общее содержание AMPK. Действие на субстрат оценивают по фосфорилированию ACC по участку, который фосфорилирует AMPK (у мыши Ser79 в Acc1), вместе с общим содержанием ACC. Ни один из этих сигналов не измеряет всю активность AMPK: фосфорилирование петли не учитывает аллостерическую активацию, а фосфорилирование одного субстрата зависит и от фосфатаз этого субстрата.","Препараты, действующие на AMPK, различаются механизмом. [[T51|AICAR]] — предшественник: в клетке он фосфорилируется до ZMP, аналога AMP, который связывается с γ-субъединицей; ZMP действует и на другие ферменты, связывающие AMP. [[T52|Метформин]] активирует AMPK косвенно; среди предложенных механизмов — подавление комплекса I дыхательной цепи и действие через лизосомный путь. Прямые активаторы связываются с участком ADaM (участок связывания аллостерических препаратов и метаболитов) между α- и β-субъединицами. [[T53|Дорсоморфин]] (соединение C, dorsomorphin, compound C) подавляет AMPK, но подавляет и многие другие киназы, поэтому эффект этого ингибитора не доказывает роли AMPK. Убедительнее генетическое сравнение: клетки дикого типа, клетки без каталитических субъединиц AMPK и клетки, в которые AMPK возвращена.","Генетические варианты субъединиц AMPK связаны с определёнными заболеваниями. Варианты гена [[T54|PRKAG2]], кодирующего γ2-субъединицу, связаны с кардиомиопатией с накоплением гликогена в сердечной мышце и нарушениями проведения возбуждения, например синдромом Вольфа — Паркинсона — Уайта (Arad и соавт., 2003; Thevenon и соавт., 2017). Наследственные мутации STK11 — гена, кодирующего LKB1, — вызывают синдром Пейтца — Егерса. Заболевание нельзя вывести из одного измерения p-AMPK: варианты меняют регуляцию в определённых тканях, и следствия проверяют на уровне этих тканей. Схемы лечения в семинаре не рассматриваются."],"trap":["Рост p-AMPK доказывает, что любое действие добавленного препарата зависит только от AMPK.","Модификация AMPK — один показатель; препарат может иметь другие мишени. Нужны функциональный показатель и независимый генетический контроль."],"conditions":"Никакая концентрация препарата не задаётся как универсально селективная. Количество белка, степень фосфорилирования и активность различаются; медицинские сведения только о молекулярном механизме.","sources":["Steinberg2023","Smith2026","Fullerton2013","Arad2003","Thevenon2017"],"quiz":{"id":"S7-L15","question":"Какое сравнение лучше проверяет, зависит ли выбранный эффект препарата от AMPK?","options":[{"id":"S7-L15-2","text":"Сравнение только двух концентраций препарата в исходных клетках дикого типа (WT).","correct":false,"feedback":"Зависимость от дозы сама по себе не устанавливает мишень: другие действия также могут зависеть от дозы."},{"id":"S7-L15-3","text":"Сравнение только p-AMPK и общего содержания AMPK в одной группе исходных клеток дикого типа (WT).","correct":false,"feedback":"Соотношение фосфосигнала и общего белка не проверяет причинную зависимость выбранного эффекта от AMPK."},{"id":"S7-L15-1","text":"Сравнение исходных клеток дикого типа (WT), клеток с утратой AMPK и клеток с восстановленной AMPK.","correct":true,"feedback":"Сопоставимые генетические условия помогают проверить зависимость эффекта и контролировать специфичность утраты."}],"rev":2},"widget":{"kind":"cards","title":"","s":{"title":"Как проверить активность AMPK и её роль","status":"Учебные карточки методов · полосы — схема, не данные эксперимента","opts_label":"Что нужно установить","opts":["Состояние аденилатов","Фосфорилирование AMPK","Действие на субстрат ACC","Зависит ли эффект от AMPK"],"heads":["Что измеряют","Метод","Контроль","Чего метод сам не показывает"],"cards":[{"v":["Концентрации ATP, ADP и AMP и их отношения.","ВЭЖХ или масс-спектрометрия после быстрой остановки реакций.","Одинаковая обработка проб; стандарты нуклеотидов.","Активность AMPK и её действие на субстраты."],"note":"Отношения AMP/ATP и ADP/ATP описывают состояние пула. Медленное приготовление образца искажает их."},{"v":["Содержание AMPK, фосфорилированной по Thr172, относительно общего содержания AMPK.","Иммуноблоттинг с фосфоспецифическим антителом.","Общий AMPK; изоформа и вид указаны (Thr172 в α2 человека, Thr183 в α1).","Аллостерическую активацию и действие на конкретный субстрат."],"note":"Фосфорилирование петли — один из признаков активации, а не полное измерение активности.","pic":{"kind":"blot","rows":[["p-AMPK (Thr172)",[0.2,0.85]],["общий AMPK",[0.8,0.8]],["контроль нанесения",[0.8,0.8]]],"lanes":["контроль","воздействие"],"cap":"Схема полос, не данные эксперимента"}},{"v":["Фосфорилирование ACC по участку AMPK относительно общего ACC.","Иммуноблоттинг; у мыши участки Ser79 (Acc1) и Ser212 (Acc2).","Общий ACC; клетки с заменой участка на аланин.","Поток β-окисления и содержание малонил-CoA."],"note":"p-ACC показывает действие AMPK на субстрат, но не измеряет окисление жирных кислот.","pic":{"kind":"blot","rows":[["p-ACC",[0.2,0.85]],["общий ACC",[0.8,0.8]],["контроль нанесения",[0.8,0.8]]],"lanes":["контроль","воздействие"],"cap":"Схема полос, не данные эксперимента"}},{"v":["Выбранный эффект препарата в клетках разных генотипов.","Сравнение клеток дикого типа, клеток без AMPK и клеток с возвращённой AMPK.","Одинаковые условия, доза и срок; проверка утраты белка.","Механизм действия препарата на другие мишени."],"note":"Если эффект исчезает без AMPK и возвращается вместе с ней, он зависит от AMPK. Одна доза ингибитора (например, dorsomorphin) этого не показывает."}],"fixed":"Концентрации препаратов не задаются: ни одна концентрация не считается универсально селективной.","static":["Четыре карточки: аденилаты (ВЭЖХ или масс-спектрометрия после быстрой остановки реакций), p-AMPK Thr172 относительно общего AMPK, p-ACC относительно общего ACC, генетическое сравнение клеток дикого типа, без AMPK и с возвращённой AMPK. Для каждой указано, чего метод сам не показывает."]}}},{"id":"acc","number":16,"section":2,"title":"Как ACC образует малонил-CoA","question":3,"questions":[3],"keywords":["ACC","Ацетил-CoA","Малонил-CoA","Биотин","Синтез жирных кислот de novo","FASN","Как ACC образует малонил-CoA"],"lead":["Ацетил-CoA-карбоксилаза образует малонил-CoA из ацетил-CoA.","Малонил-CoA участвует и в синтезе жирных кислот, и в регуляции их митохондриального окисления."],"mechanism":["ACC использует ATP и бикарбонат при карбоксилировании [[T56|ацетил-CoA]].","Связанный с ферментом [[T58|биотин]] участвует в переносе карбоксильной группы.","Образуется [[T57|малонил-CoA]], используемый в синтезе жирных кислот."],"paragraphs":["Коэнзим A (CoA) — переносчик ацильных групп. Он присоединяет ацильный остаток тиоэфирной связью через свою SH-группу, и в таком виде остаток участвует в реакциях. Ацетил-CoA — это ацетильная группа (CH₃–CO–), связанная с CoA; сам CoA не является ни жирной кислотой, ни её частью. Малонил-CoA — малонильная группа (⁻OOC–CH₂–CO–), связанная с CoA, то есть ацетильная группа с дополнительной карбоксильной группой.","Ацетил-CoA-карбоксилаза ([[T55|ACC]]) катализирует превращение ацетил-CoA в малонил-CoA. Суммарная реакция: ацетил-CoA + HCO₃⁻ + ATP → малонил-CoA + ADP + фосфат. Реакция идёт в два этапа на одном ферменте. Сначала биотин, ковалентно связанный с ферментом, карбоксилируется за счёт бикарбоната; энергию для этого даёт гидролиз ATP. Затем карбоксильная группа переносится с биотина на ацетил-CoA. Углерод новой карбоксильной группы происходит из бикарбоната, а не из ATP: ATP расходуется на активацию бикарбоната.","Малонил-CoA используется синтазой жирных кислот ([[T59|FASN]]) — многофункциональным ферментом, который последовательно удлиняет растущую ацильную цепь на два атома углерода за цикл. Для синтеза пальмитата (C16) FASN использует одну молекулу ацетил-CoA и семь молекул малонил-CoA, а восстановителем служит NADPH; при каждом удлинении освобождается CO₂ той самой карбоксильной группы, которую присоединила ACC. Образование малонил-CoA и реакции FASN — разные этапы: снижение активности ACC ограничивает поступление субстрата для FASN, но по активности ACC нельзя судить о скорости синтеза жирных кислот.","Синтез жирных кислот de novo — образование жирных кислот из ацетил-CoA с участием ACC и FASN. Его следует отличать от сборки триацилглицеролов: в этом процессе к глицерол-3-фосфату присоединяются уже имеющиеся жирные кислоты, в том числе поступившие с пищей. Слово «липогенез» в литературе используют для обоих процессов, поэтому в описании эксперимента указывают, что именно измерено. Кроме того, малонил-CoA ингибирует CPT1 — фермент начала переноса длинноцепочечных ацильных групп в митохондрии; эта вторая функция той же молекулы разобрана в следующих шагах."],"trap":["Малонил-CoA — только тормозящий сигнал и не участвует в синтезе жирных кислот.","Это также субстрат синтеза жирных кислот; регуляторное действие на CPT1 представляет другую функцию той же молекулы."],"conditions":"Прогноз относится к скорости указанной реакции при неизменных субстратах и других процессах. Скорость образования и установившаяся концентрация — разные величины.","sources":["Smith2026","Fullerton2013"],"quiz":{"id":"S7-L16","question":"Активность ACC снижена, остальные условия образования и использования малонил-CoA сохранены. Какое непосредственное изменение ожидается?","options":[{"id":"S7-L16-1","text":"Снижается скорость образования малонил-CoA из ацетил-CoA.","correct":true,"feedback":"ACC катализирует образование малонил-CoA; снижение её активности ограничивает эту реакцию."},{"id":"S7-L16-2","text":"Возрастает скорость образования малонил-CoA из ацетил-CoA.","correct":false,"feedback":"Это противоположно влиянию снижения активности катализирующего фермента при прочих равных условиях."},{"id":"S7-L16-3","text":"Скорость образования малонил-CoA не меняется: ACC регулирует только карнитиновый перенос.","correct":false,"feedback":"ACC выполняет реакцию образования малонил-CoA; влияние на CPT1 — последующая регуляторная связь."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Реакция ACC и две роли малонил-CoA","status":"Схема механизма · скорость реакции, не концентрация","ctrls":[{"id":"v","type":"group","label":"Что показать","opts":["реакция ACC","малонил-CoA в синтезе (FASN)","малонил-CoA и CPT1"]}],"W":640,"H":300,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"ac":{"p":[95,150,160,52],"n":[90,60,160,52],"t":"ацетил-CoA\nCH₃–CO–S-CoA","fs":13},"acc":{"p":[300,150,130,52],"n":[258,150,130,52],"t":"ACC\n(биотин)","fs":14},"inp":{"p":[300,50,170,40],"n":[78,150,136,44],"t":"HCO₃⁻ + ATP","fs":14},"outp":{"p":[300,250,170,40],"n":[90,240,150,40],"t":"ADP + фосфат","fs":14},"mal":{"p":[510,150,200,52],"n":[250,250,160,60],"t":"малонил-CoA\n⁻OOC–CH₂–CO–S-CoA","tn":"малонил-CoA\n⁻OOC–CH₂–\nCO–S-CoA","fs":13},"fasn":{"p":[510,50,170,40],"n":[110,340,170,40],"t":"FASN, NADPH","fs":14},"cpt1":{"p":[510,250,170,40],"n":[110,430,170,40],"t":"CPT1","fs":14}},"edges":{"r1":{"a":"ac","b":"acc","k":"rx"},"r0":{"a":"inp","b":"acc","k":"rx"},"r2":{"a":"acc","b":"mal","k":"rx","t":"карбоксилирование","d":[0,-14],"dn":[-62,0]},"r3":{"a":"acc","b":"outp","k":"rx"},"f1":{"a":"mal","b":"fasn","k":"rx","t":"субстрат","d":[44,0],"dn":[0,-12]},"c1":{"a":"mal","b":"cpt1","k":"inh","t":"ингибитор","d":[46,0],"dn":[0,-12]}},"base":{"n":{"acc":"on","ac":"met","mal":"met","inp":"base","outp":"base"}},"st":{"0":{"n":{"fasn":"hide","cpt1":"hide"},"m":[["Субстраты","ацетил-CoA, HCO₃⁻, ATP"],["Продукты","малонил-CoA, ADP, фосфат"],["Источник углерода карбоксила","HCO₃⁻"]],"note":"ACC карбоксилирует ацетил-CoA: биотин фермента сначала присоединяет карбоксильную группу бикарбоната за счёт гидролиза ATP, затем передаёт её на ацетил-CoA."},"1":{"n":{"fasn":"on","cpt1":"hide","inp":"off","outp":"off"},"e":{"r0":"off","r3":"off"},"m":[["Роль малонил-CoA","субстрат FASN"],["На один пальмитат","1 ацетил-CoA + 7 малонил-CoA"],["Восстановитель","NADPH"]],"note":"Малонил-CoA — донор двухуглеродных звеньев для FASN; при каждом удлинении освобождается CO₂ карбоксильной группы, присоединённой ACC."},"2":{"n":{"fasn":"hide","cpt1":"off","inp":"off","outp":"off"},"e":{"r0":"off","r3":"off"},"m":[["Роль малонил-CoA","ингибитор CPT1"],["Что регулирует","начало переноса длинноцепочечных ацильных групп"],["Подробно","следующие шаги"]],"note":"Та же молекула ингибирует CPT1. Это регуляторная функция, отдельная от участия в синтезе жирных кислот."}},"fixed":"Схема описывает скорость указанной реакции при неизменных субстратах и других процессах; скорость образования малонил-CoA и его установившаяся концентрация — разные величины.","static":["ACC превращает ацетил-CoA (CH₃–CO–S-CoA) в малонил-CoA (⁻OOC–CH₂–CO–S-CoA): ацетил-CoA + HCO₃⁻ + ATP → малонил-CoA + ADP + фосфат; карбоксильную группу переносит биотин фермента. Малонил-CoA служит субстратом FASN (с NADPH) и ингибитором CPT1."]}}},{"id":"carnitine","number":17,"section":2,"title":"Как длинноцепочечная ацильная группа достигает матрикса","question":3,"questions":[3],"keywords":["CPT1","CACT","CPT2","Карнитиновый челнок","Ацилкарнитин","β-окисление","Как длинноцепочечная ацильная группа достигает матрикса"],"lead":["Для окисления длинноцепочечной жирной кислоты её ацильная группа переносится через внутреннюю мембрану в составе ацилкарнитина.","CPT1, CACT и CPT2 выполняют последовательные, но разные действия."],"mechanism":["[[T60|CPT1]] переносит ацильную группу с CoA на карнитин у наружной мембраны.","[[T61|CACT]] переносит [[T64|ацилкарнитин]] через внутреннюю мембрану в обмен на карнитин.","[[T62|CPT2]] восстанавливает ацил-CoA на матриксной стороне внутренней мембраны."],"paragraphs":["Митохондрия окружена двумя мембранами. Между ними находится межмембранное пространство, внутри внутренней мембраны — матрикс, где идёт β-окисление. Наружная мембрана проницаема для небольших молекул, а внутренняя мембрана для ацил-CoA непроницаема. Поэтому длинноцепочечные ацильные группы переносятся в матрикс особым путём — [[T63|карнитиновым челноком]].","Перенос начинается после активации жирной кислоты. В цитозоле ацил-CoA-синтетаза, связанная с наружной митохондриальной мембраной, присоединяет жирную кислоту к CoA; энергию даёт расщепление ATP до AMP и пирофосфата. Образовавшийся ацил-CoA — субстрат CPT1 (карнитин-пальмитоилтрансферазы 1). CPT1 находится в наружной мембране и переносит ацильную группу с CoA на карнитин. Образуется ацилкарнитин, а CoA остаётся в цитозоле. CPT1 — фермент, а не канал внутренней мембраны.","Через внутреннюю мембрану ацилкарнитин переносит CACT (карнитин-ацилкарнитинтранслоказа). Это переносчик-антипортер: на каждую молекулу ацилкарнитина, поступающую в матрикс, из матрикса выходит молекула свободного карнитина. На матриксной стороне внутренней мембраны CPT2 переносит ацильную группу с карнитина на CoA матрикса. Ацил-CoA образуется вновь, а освободившийся карнитин возвращается через CACT. Таким образом, через внутреннюю мембрану проходит ацильная группа в составе ацилкарнитина, а не целая молекула ацил-CoA: CoA цитозоля и CoA матрикса — разные молекулы.","После CPT2 ацил-CoA вступает в [[T65|β-окисление]] — повторяющийся цикл из четырёх реакций, в котором ацильная цепь укорачивается на два атома углерода с образованием ацетил-CoA, NADH и FADH₂. Перенос через мембраны и реакции окисления — разные этапы, и нарушение любого звена челнока прерывает перенос на соответствующем этапе. Схема относится к длинноцепочечным жирным кислотам; поступление других субстратов и различия тканей рассмотрены в отдельном шаге."],"trap":["CPT1 переносит целую молекулу ацил-CoA непосредственно через внутреннюю мембрану.","CPT1 образует ацилкарнитин; мембранный перенос выполняет CACT, а ацил-CoA в матриксе образуется вновь при участии CPT2."],"conditions":"Схема относится к длинноцепочечным субстратам; перенос других субстратов и других тканей рассматривается в отдельном шаге.","sources":["Smith2026","Houten2016"],"quiz":{"id":"S7-L17","question":"В карнитиновом челноке избирательно нарушена CACT. Какой этап непосредственно затронут?","options":[{"id":"S7-L17-3","text":"Восстановление ацил-CoA на матриксной стороне при действии CPT2.","correct":false,"feedback":"Это реакция CPT2 после доставки ацилкарнитина; она отличается от действия CACT."},{"id":"S7-L17-1","text":"Перенос ацилкарнитина через внутреннюю мембрану митохондрии.","correct":true,"feedback":"CACT — транспортёр внутренней мембраны, выполняющий обмен ацилкарнитина и карнитина."},{"id":"S7-L17-2","text":"Перенос ацильной группы с CoA на карнитин при действии CPT1.","correct":false,"feedback":"Это реакция CPT1 до этапа переноса через внутреннюю мембрану."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Карнитиновый челнок: три звена","status":"Схема механизма · длинноцепочечный субстрат","ctrls":[{"id":"z","type":"group","label":"Звено","opts":["CPT1","CACT","CPT2"]},{"id":"x","type":"check","label":"Выделенное звено нарушено","def":false}],"W":640,"H":420,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или ус
