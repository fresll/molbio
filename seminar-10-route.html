1 в двух местах — на границах интрона. Интрон удаляется, а две части мРНК остаются несоединёнными."},"1-1":{"n":{"ire1":"on","rtcb":"abs","u1":"base","ui":"off","u2":"base","s1":"hide","s2":"hide","pu":"hide","ps":"hide"},"e":{"c1":"on","c2":"on","lg":"hide","tu":"hide","ts":"hide"},"m":[["мРНК XBP1","две несоединённые части"],["Белок","ещё не образован"]],"note":"При стрессе ЭПР олигомеризованный IRE1α своим РНКазным доменом расщепляет мРНК XBP1 в двух местах — на границах интрона. Интрон удаляется, а две части мРНК остаются несоединёнными. RtcB в этом этапе ещё не требуется."},"2-0":{"n":{"ire1":"on","rtcb":"on","u1":"hide","ui":"hide","u2":"hide","s1":"on","s2":"on","pu":"hide","ps":"hide"},"e":{"c1":"hide","c2":"hide","lg":"on","tu":"hide","ts":"hide"},"m":[["мРНК XBP1","XBP1s (без интрона)"],["Белок","ещё не синтезирован"]],"note":"РНК-лигаза RtcB соединяет 5′- и 3′-части мРНК. IRE1α в этой реакции не участвует: он только разрезает мРНК."},"2-1":{"n":{"ire1":"on","rtcb":"abs","u1":"base","ui":"off","u2":"base","s1":"hide","s2":"hide","pu":"hide","ps":"hide"},"e":{"c1":"on","c2":"on","lg":"hide","tu":"hide","ts":"hide"},"m":[["мРНК XBP1","две несоединённые части"],["Белок","новый XBP1s не образуется"]],"note":"Без RtcB мРНК XBP1 разрезается IRE1α, но её части не соединяются, и мРНК XBP1s не образуется (клетки мыши с выключенным геном Rtcb, Lu 2014)."},"3-0":{"n":{"ire1":"on","rtcb":"on","u1":"hide","ui":"hide","u2":"hide","s1":"on","s2":"on","pu":"hide","ps":"on"},"e":{"c1":"hide","c2":"hide","lg":"hide","tu":"hide","ts":"on"},"m":[["мРНК XBP1","XBP1s (без интрона)"],["Белок","XBP1s"]],"note":"После удаления 26 нуклеотидов 3′-часть мРНК читается в другой рамке считывания. Белок XBP1s содержит тот же N-концевой bZIP-домен, но другой C-конец — домен активации транскрипции генов ЭПР."},"3-1":{"n":{"ire1":"on","rtcb":"abs","u1":"base","ui":"off","u2":"base","s1":"hide","s2":"hide","pu":"hide","ps":"hide"},"e":{"c1":"on","c2":"on","lg":"hide","tu":"hide","ts":"hide"},"m":[["мРНК XBP1","две несоединённые части"],["Белок","новый XBP1s не образуется"]],"note":"Без RtcB мРНК XBP1 разрезается IRE1α, но её части не соединяются, и мРНК XBP1s не образуется (клетки мыши с выключенным геном Rtcb, Lu 2014)."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"atf6","number":11,"section":1,"title":"Почему ATF6 должен пройти через аппарат Гольджи","question":2,"questions":[2],"keywords":["ATF6","ATF6α","ATF6f","p90","p50","S1P","S2P","аппарат Гольджи","COPII","регулируемый внутримембранный протеолиз","bZIP","SREBP"],"lead":["[[T30|ATF6α]] синтезируется как мембранный белок ЭПР, и его транскрипционная часть не может попасть в ядро, пока не отделена от мембраны.","Отделяют её протеазы аппарата Гольджи [[T31|S1P и S2P]], поэтому при стрессе ЭПР ATF6α сначала переносится из ЭПР в аппарат Гольджи."],"mechanism":["ATF6α — мембранный белок ЭПР; его N-концевая часть с bZIP-доменом обращена в цитозоль, C-концевая — в просвет ЭПР.","При стрессе ЭПР ATF6α переносится в пузырьках COPII в аппарат Гольджи, где S1P, а затем S2P расщепляют его.","Освобождённый N-концевой фрагмент ATF6f переходит в ядро и активирует транскрипцию генов шаперонов и других белков ЭПР."],"paragraphs":["ATF6α — белок массой около 90 кДа, пересекающий мембрану ЭПР один раз. Его N-концевая половина с bZIP-доменом, способным связывать ДНК, обращена в цитозоль, а C-концевая часть — в просвет ЭПР. Пока белок закреплён в мембране, его транскрипционная часть в ядро не поступает. Поэтому ветвь ATF6 устроена иначе, чем ветвь IRE1α: изменяется не мРНК, а уже синтезированный белок.","При стрессе ЭПР ATF6α покидает ЭПР в пузырьках COPII. Для ATF6α показано, что при этом восстанавливаются межмолекулярные дисульфидные связи, удерживающие его в олигомерах, и восстановленный белок входит в транспортные пузырьки. В аппарате Гольджи ATF6α расщепляют две протеазы: S1P разрезает его со стороны просвета, затем S2P — внутри мембраны. Это те же протеазы, которые активируют транскрипционные факторы SREBP при недостатке холестерина. Освобождённый фрагмент массой около 50 кДа, ATF6f, переходит в ядро.","Перенос и протеолиз — два разных необходимых этапа. Если ATF6α не покидает ЭПР, протеазы с ним не встречаются. Если белок доставлен в аппарат Гольджи, но протеолиз заблокирован, полноразмерный ATF6α накапливается, а новый ATF6f не образуется. Поэтому различают образование фрагмента — скорость его освобождения — и содержание ATF6f в ядре, которое зависит также от его разрушения.","В ядре ATF6f вместе с XBP1s активирует гены шаперонов, ферментов сворачивания и белков ERAD. Вклад ATF6α и XBP1 в эти гены частично перекрывается: в фибробластах мыши подавление ATF6α или ATF6β методом РНК-интерференции мало изменяло индукцию изученных генов UPR, а при сочетании отсутствия XBP1 с подавлением ATF6α нарушения были выражены сильнее. Мыши без ATF6α или без ATF6β развиваются, а без обоих белков погибают на ранних стадиях развития."],"trap":["Как только ATF6α попадает в аппарат Гольджи, он уже работает как транскрипционный фактор.","В аппарате Гольджи ATF6α ещё закреплён в мембране. Транскрипцию регулирует только N-концевой фрагмент ATF6f, который освобождается после расщепления S1P и S2P."],"conditions":"Схема механизма; ATF6α млекопитающих, состояния качественные. Мембранная топология и превращение p90 в p50 при стрессе ЭПР — клетки HeLa, туникамицин и тапсигаргин (Haze 1999, по аннотации). Расщепление S1P и S2P: в клетках CHO без S2P процессинг ATF6 блокирован полностью, без S1P — частично (Ye 2000, по аннотации); в вопросе блок обеих протеаз полный — это условие учебной задачи. Пузырьки COPII, восстановление дисульфидных связей ATF6α, фенотипы мышей без ATF6α и ATF6β — Acosta-Alvear 2025. Зависимость генов UPR от XBP1 и ATF6α — фибробласты мыши с нокаутом XBP1 и нокдауном ATF6α методом РНК-интерференции (Lee 2003). ATF6β и родственные белки семейства CREB3 здесь не рассматриваются.","sources":["Haze1999","Ye2000","Acosta2025","Wiseman2022","Lee2003"],"quiz":{"id":"S10-L11","rev":2,"question":"В учебной системе ATF6α достиг аппарата Гольджи, но его расщепление S1P и S2P полностью блокировано. Что произойдёт с образованием активного N-концевого фрагмента?","options":[{"id":"S10-L11-1","text":"Образование продолжится с прежней скоростью, поскольку доставки ATF6α в аппарат Гольджи достаточно.","correct":false,"feedback":"Доставка и протеолитическое освобождение домена — разные этапы. В условии следующий необходимый этап блокирован."},{"id":"S10-L11-3","text":"Образование сохранится благодаря повышению количества полноразмерного ATF6α в аппарате Гольджи.","correct":false,"feedback":"Накопление полноразмерного субстрата не заменяет полностью блокированное образование его N-концевого фрагмента."},{"id":"S10-L11-2","text":"Образование нового фрагмента по этому пути прекратится, хотя ATF6α доставлен в аппарат Гольджи.","correct":true,"feedback":"Транспорт и протеолитическая активация — разные необходимые этапы показанного пути."}]},"widget":{"kind":"net","title":"","s":{"title":"Перенос и протеолиз ATF6α","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Состояние ЭПР","opts":["Без стресса","Стресс ЭПР"]},{"id":"b","type":"group","label":"Блок в учебной системе","opts":["Нет","Перенос в аппарат Гольджи","Протеолиз S1P и S2P"]}],"W":560,"H":330,"NW":340,"NH":500,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос белка между компартментами (COPII — транспортные пузырьки)","rx":"протеолиз (химическое превращение белка)","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — этап идёт или продукт образуется","пунктирная рамка — не идёт","× — протеаза заблокирована","1, 2 — порядок расщепления"]},"zones":[{"x":6,"y":6,"w":548,"h":318,"c":"cyto","t":"цитозоль","lx":546,"ly":314,"n":[4,4,332,492,330,352],"a":"end"},{"x":14,"y":40,"w":164,"h":180,"c":"er","t":"ЭПР","lx":22,"ly":60,"n":[10,26,320,92,18,44]},{"x":194,"y":40,"w":180,"h":180,"c":"pm","t":"аппарат Гольджи","lx":202,"ly":60,"n":[10,136,320,132,176,154]},{"x":388,"y":40,"w":158,"h":250,"c":"nuc","t":"ядро","lx":396,"ly":60,"n":[10,366,320,124,18,384]}],"mem":[],"nodes":{"er6":{"p":[96,136,150,54],"t":"ATF6α\nполноразмерный","n":[100,76,150,46],"fs":15},"g6":{"p":[290,110,150,54],"t":"ATF6α\nполноразмерный","n":[100,196,150,46],"fs":15},"s1p":{"p":[246,184,60,34],"t":"S1P","n":[240,180,60,30],"fs":16},"s2p":{"p":[334,184,60,34],"t":"S2P","n":[240,228,60,30],"fs":16},"fc":{"p":[290,272,104,38],"t":"ATF6f","n":[100,310,104,36],"fs":16},"fn":{"p":[467,112,104,38],"t":"ATF6f","n":[90,418,100,36],"fs":16},"gn":{"p":[467,238,130,70],"t":"гены ЭПР:\nшапероны,\nбелки ERAD","n":[245,430,150,66],"fs":15,"tn":"гены ЭПР:\nшапероны,\nбелки ERAD"}},"edges":{"v":{"a":"er6","b":"g6","k":"tr","t":"COPII","d":[0,-16],"dn":[16,0],"anc":"middle"},"a1":{"a":"s1p","b":"g6","k":"act","t":"1","d":[-12,0],"dn":[0,-10],"anc":"end"},"a2":{"a":"s2p","b":"g6","k":"act","t":"2","d":[12,0],"dn":[0,10],"anc":"start"},"p":{"a":"g6","b":"fc","k":"rx","t":"протеолиз","d":[-12,46],"dn":[-12,0],"anc":"end"},"n":{"a":"fc","b":"fn","k":"tr","t":"в ядро","d":[14,34],"dn":[-12,0],"anc":"start"},"g":{"a":"fn","b":"gn","k":"act"}},"st":{"0-0":{"n":{"er6":"base","g6":"hide","s1p":"base","s2p":"base","fc":"hide","fn":"hide","gn":"base"},"e":{"v":"off","a1":"off","a2":"off","p":"hide","n":"hide","g":"hide"},"m":[["Полноразмерный ATF6α","в ЭПР"],["Образование ATF6f","не идёт"]],"note":"Без стресса ЭПР полноразмерный ATF6α удерживается в мембране ЭПР: его N-концевая часть с bZIP-доменом обращена в цитозоль, но связана с мембраной и в ядро не попадает."},"0-1":{"n":{"er6":"base","g6":"hide","s1p":"base","s2p":"base","fc":"hide","fn":"hide","gn":"base"},"e":{"v":"off","a1":"off","a2":"off","p":"hide","n":"hide","g":"hide"},"m":[["Полноразмерный ATF6α","в ЭПР"],["Образование ATF6f","не идёт"]],"note":"Без стресса ЭПР полноразмерный ATF6α удерживается в мембране ЭПР: его N-концевая часть с bZIP-доменом обращена в цитозоль, но связана с мембраной и в ядро не попадает. Блок переноса в этом состоянии ничего не меняет."},"0-2":{"n":{"er6":"base","g6":"hide","s1p":"base","s2p":"base","fc":"hide","fn":"hide","gn":"base"},"e":{"v":"off","a1":"off","a2":"off","p":"hide","n":"hide","g":"hide"},"m":[["Полноразмерный ATF6α","в ЭПР"],["Образование ATF6f","не идёт"]],"note":"Без стресса ЭПР полноразмерный ATF6α удерживается в мембране ЭПР: его N-концевая часть с bZIP-доменом обращена в цитозоль, но связана с мембраной и в ядро не попадает. Блок протеолиза в этом состоянии ничего не меняет."},"1-0":{"n":{"er6":"base","g6":"on","s1p":"on","s2p":"on","fc":"on","fn":"on","gn":"on"},"e":{"v":"on","a1":"on","a2":"on","p":"on","n":"on","g":"on"},"m":[["Полноразмерный ATF6α","переносится в аппарат Гольджи"],["Образование ATF6f","идёт"]],"note":"При стрессе ЭПР ATF6α переносится в пузырьках COPII в аппарат Гольджи. Там S1P расщепляет его со стороны просвета, затем S2P — внутри мембраны; освобождённый N-концевой фрагмент ATF6f переходит в ядро и активирует транскрипцию генов белков ЭПР."},"1-1":{"n":{"er6":"on","g6":"hide","s1p":"base","s2p":"base","fc":"hide","fn":"hide","gn":"base"},"e":{"v":"off","a1":"off","a2":"off","p":"hide","n":"hide","g":"hide"},"m":[["Полноразмерный ATF6α","остаётся в ЭПР"],["Образование ATF6f","не идёт"]],"note":"Перенос в аппарат Гольджи блокирован: ATF6α остаётся в ЭПР, где протеаз S1P и S2P нет, и новый ATF6f не образуется, хотя стресс ЭПР сохраняется."},"1-2":{"n":{"er6":"base","g6":"on","s1p":"abs","s2p":"abs","fc":"hide","fn":"hide","gn":"base"},"e":{"v":"on","a1":"hide","a2":"hide","p":"hide","n":"hide","g":"hide"},"m":[["Полноразмерный ATF6α","накапливается в аппарате Гольджи"],["Образование ATF6f","не идёт"]],"note":"ATF6α доставлен в аппарат Гольджи, но протеолиз блокирован: полноразмерный белок накапливается в мембране, а новый ATF6f не образуется. Ранее образованные фрагменты на схеме не показаны."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"upr-capacity","number":12,"section":1,"title":"Как UPR изменяет возможности секреторной клетки","question":2,"questions":[2],"keywords":["ёмкость ЭПР","ERAD","ретротранслокация","протеасома","XBP1s","ATF6f","шапероны","плазматическая клетка","β-клетки","проинсулин","ER-фагия","секреция"],"lead":["UPR восстанавливает соответствие нагрузки и ёмкости ЭПР тремя способами: уменьшает поступление новых белков, увеличивает возможности сворачивания и ускоряет удаление дефектных молекул.","Последний путь — [[T32|деградация, связанная с ЭПР]] (ERAD): дефектный белок переносится из ЭПР в цитозоль и разрушается протеасомой."],"mechanism":["PERK снижает общую инициацию трансляции, и в ЭПР поступает меньше новых белков; этот эффект развивается быстро.","XBP1s и ATF6f усиливают экспрессию генов шаперонов, ферментов сворачивания и белков ERAD; ёмкость ЭПР растёт медленнее — по мере синтеза этих белков.","ERAD распознаёт дефектный белок, переносит его через мембрану ЭПР в цитозоль, где белок убиквитинируется и разрушается протеасомой; повторное сворачивание, напротив, идёт в просвете ЭПР."],"paragraphs":["Белок, поступивший в ЭПР, может пройти два пути. Если шапероны и ферменты сворачивания доводят его до нативной структуры, он покидает ЭПР и через аппарат Гольджи достигает места назначения. Если белок остаётся неправильно свёрнутым, его повторно связывают шапероны; а если и это не помогает, белок распознаётся как дефектный и направляется на ERAD. При ERAD белок переносится через мембрану ЭПР в цитозоль, по мере выхода убиквитинируется и разрушается протеасомой. Устойчивые к ERAD белки и агрегаты, например некоторые формы проколлагена и нестабильные варианты инсулина, удаляются иначе — при ER-фагии части ЭПР поступают в лизосомы. Подробно эти пути разбирает семинар 11.","UPR изменяет все три стороны баланса. PERK быстро снижает поступление новых белков. Транскрипционные факторы XBP1s и ATF6f увеличивают экспрессию генов шаперонов, ферментов сворачивания и белков ERAD, а также стимулируют синтез липидов и расширение мембран ЭПР. Ёмкость растёт медленнее, чем снижается поступление: для этого нужны транскрипция, трансляция и сборка новых белков. Уменьшение поступления не удаляет уже накопленные неправильно свёрнутые белки — для этого нужны повторное сворачивание и ERAD.","Значение такой перестройки видно в специализированных секреторных клетках. Покоящийся B-лимфоцит содержит мало ЭПР, а плазматическая клетка, образующаяся из него, заполнена ЭПР и секретирует тысячи молекул антител в секунду; ЭПР расширяется под действием IRE1α–XBP1s ещё до начала массового синтеза антител, а без XBP1 стимулированные B-клетки мыши не завершают секреторное созревание и интенсивная секреция антител нарушается. β-клетки поджелудочной железы после стимуляции глюкозой синтезируют до миллиона молекул проинсулина в минуту, но непостоянно; для них важны и XBP1s, и PERK."],"trap":["Если PERK снизила поступление белков, накопившиеся неправильно свёрнутые белки исчезают сами.","PERK уменьшает только поступление новых белков. Уже накопленные дефектные молекулы должны быть повторно свёрнуты шаперонами или удалены — путём ERAD или ER-фагии."],"conditions":"Схема механизма; состояния качественные, «раннее» и «позднее» — порядок событий, а не измеренные сроки. Пути контроля качества, ERAD и ER-фагия, плазматические клетки (мышь, B-клетки ex vivo) и β-клетки (модели мыши и клеточные линии) — по обзору Wiseman 2022; это разные экспериментальные системы, и их данные не объединены в один эксперимент. Роль UPR в расширении мембран ЭПР — Acosta-Alvear 2025.","sources":["Wiseman2022","Acosta2025"],"quiz":{"id":"S10-L12","rev":1,"question":"Какой процесс отличает ERAD от повторного сворачивания белка шаперонами в просвете ЭПР?","options":[{"id":"S10-L12-1","text":"Использование информации о качестве структуры белка.","correct":false,"feedback":"Оценка структуры относится к обоим маршрутам и поэтому не является их отличительным признаком."},{"id":"S10-L12-3","text":"Перенос дефектного белка в цитозоль и его разрушение протеасомой.","correct":true,"feedback":"Этот маршрут удаления отличает ERAD от попытки восстановить структуру в просвете ЭПР."},{"id":"S10-L12-2","text":"Сохранение белка в просвете ЭПР до восстановления нативной структуры.","correct":false,"feedback":"Так описывается путь повторного сворачивания, а не отличительный этап ERAD."}]},"widget":{"kind":"net","title":"","s":{"title":"Три способа восстановить баланс ЭПР","status":"Схема механизма · качественные состояния","ctrls":[{"id":"L","type":"group","label":"Секреторная нагрузка","opts":["Низкая","Высокая"]},{"id":"t","type":"group","label":"Время после начала нагрузки","opts":["Раннее состояние","Позднее состояние"]}],"W":560,"H":380,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос белка (в ЭПР, к аппарату Гольджи, в цитозоль при ERAD)","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — процесс идёт или усилен","пунктирная рамка — снижено"]},"zones":[{"x":6,"y":6,"w":548,"h":368,"c":"cyto","t":"цитозоль","lx":546,"ly":366,"n":[4,4,332,372,330,368],"a":"end"},{"x":14,"y":98,"w":312,"h":190,"c":"er","t":"просвет ЭПР","lx":22,"ly":278,"n":[10,92,186,170,16,256]}],"mem":[],"nodes":{"tl":{"p":[90,46,130,40],"t":"трансляция","n":[90,44,130,40],"fs":16},"perk":{"p":[300,46,170,40],"t":"PERK → p-eIF2α","n":[255,44,150,52],"fs":16,"tn":"PERK →\np-eIF2α"},"new":{"p":[80,160,100,50],"t":"новые\nбелки","n":[100,126,110,46],"fs":16},"fold":{"p":[232,160,150,70],"t":"сворачивание:\nшапероны,\nферменты","n":[100,210,150,66],"fs":15},"sec":{"p":[466,120,140,50],"t":"к аппарату\nГольджи","n":[80,336,130,46],"fs":15},"erad":{"p":[466,238,150,70],"t":"ERAD: перенос\nв цитозоль,\nпротеасома","n":[255,336,150,66],"fs":15},"gen":{"p":[232,342,220,50],"t":"XBP1s, ATF6f: гены\nшаперонов и ERAD","n":[262,210,144,66],"fs":15,"tn":"XBP1s, ATF6f:\nгены шаперонов\nи ERAD"}},"edges":{"in":{"a":"tl","b":"new","k":"tr"},"pk":{"a":"perk","b":"tl","k":"inh"},"f":{"a":"new","b":"fold","k":"seq"},"ok":{"a":"fold","b":"sec","k":"tr","t":"нативные","tn":"","d":[0,-16],"dn":[-12,0],"anc":"middle"},"bad":{"a":"fold","b":"erad","k":"tr","t":"дефектные","tn":"","d":[0,22],"dn":[-12,0],"anc":"middle"},"g1":{"a":"gen","b":"fold","k":"act"},"g2":{"a":"gen","b":"erad","k":"act"}},"st":{"0-0":{"n":{"tl":"on","perk":"base","new":"base","fold":"on","sec":"on","erad":"base","gen":"base"},"e":{"pk":"off","g1":"off","g2":"off","bad":"on"},"m":[["Поступление новых белков","исходное"],["Ёмкость ЭПР","исходная"]],"note":"Низкая секреторная нагрузка: большинство белков сворачивается и покидает ЭПР, небольшая доля дефектных молекул удаляется ERAD. UPR почти не активирован, и состояние со временем не меняется."},"0-1":{"n":{"tl":"on","perk":"base","new":"base","fold":"on","sec":"on","erad":"base","gen":"base"},"e":{"pk":"off","g1":"off","g2":"off","bad":"on"},"m":[["Поступление новых белков","исходное"],["Ёмкость ЭПР","исходная"]],"note":"Низкая секреторная нагрузка: большинство белков сворачивается и покидает ЭПР, небольшая доля дефектных молекул удаляется ERAD. UPR почти не активирован, и состояние со временем не меняется."},"1-0":{"n":{"tl":"low","perk":"on","new":"on","fold":"on","sec":"on","erad":"on","gen":"base"},"e":{"pk":"on","g1":"off","g2":"off","bad":"on"},"m":[["Поступление новых белков","снижается через PERK"],["Ёмкость ЭПР","пока исходная"]],"note":"Высокая нагрузка, раннее состояние: дефектных белков становится больше, PERK уже снижает инициацию трансляции, но гены белков ЭПР ещё не успели изменить экспрессию — ёмкость прежняя."},"1-1":{"n":{"tl":"low","perk":"on","new":"on","fold":"on","sec":"on","erad":"on","gen":"on"},"e":{"pk":"on","g1":"on","g2":"on","bad":"on"},"m":[["Поступление новых белков","снижено через PERK"],["Ёмкость ЭПР","увеличена"]],"note":"Высокая нагрузка, позднее состояние: XBP1s и ATF6f усилили экспрессию генов шаперонов, ферментов сворачивания и белков ERAD. Ёмкость ЭПР выросла: больше белков сворачивается, а дефектные молекулы быстрее удаляются. Уже накопленные белки при этом не исчезают сразу."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"ire1-ridd","number":13,"section":1,"title":"Почему активность IRE1 не сводится к образованию XBP1s","question":2,"questions":[2],"keywords":["IRE1α","RIDD","регулируемое IRE1-зависимое разрушение","XBP1s","TRAF2","JNK","4μ8C","BLOS1","DR5","делящиеся дрожжи","Hac1"],"lead":["РНКазный домен IRE1α расщепляет не только мРНК XBP1. При [[T29|RIDD]] он разрушает и другие РНК, уменьшая их содержание, а фосфорилированный IRE1α может передавать сигнал на путь JNK.","Поэтому образование XBP1s — лишь один из выходов IRE1α, и по одному показателю нельзя судить обо всех последствиях его активации."],"mechanism":["Продуктивный выход РНКазного домена — сплайсинг мРНК XBP1, после которого синтезируется транскрипционный фактор XBP1s.","При RIDD IRE1α непосредственно расщепляет другие РНК, прежде всего мРНК, связанные с мембраной ЭПР; их содержание снижается без участия XBP1s.","Фосфорилированный IRE1α может связывать TRAF2 и активировать путь JNK; последствия этого сигнала зависят от клеток и условий."],"paragraphs":["Сплайсинг мРНК XBP1 и RIDD выполняет один и тот же РНКазный домен IRE1α, но это разные события. При сплайсинге мРНК XBP1 не разрушается: из неё удаляется интрон, и образуется мРНК, кодирующая активный транскрипционный фактор. При RIDD IRE1α расщепляет другие РНК, и их фрагменты разрушаются клеточными нуклеазами. Содержание этих РНК снижается сразу, без транскрипции, которую регулирует XBP1s.","В фибробластах мыши мРНК разрушались при стрессе ЭПР в клетках с нормальным IRE1, но не в клетках с вариантом IRE1 без нуклеазной активности. С помощью варианта IRE1, который активируется аналогом ATP, удалось вызвать сплайсинг XBP1 без стресса ЭПР, однако RIDD при этом не наблюдался: для него потребовались и активность IRE1, и стресс ЭПР. Значит, разные состояния ЭПР могут включать разные выходы одного белка.","Субстраты RIDD часто кодируют секреторные и мембранные белки, поэтому RIDD уменьшает поступление белков в ЭПР. Описаны и более специальные мишени: расщепление мРНК BLOS1 изменяет расположение лизосом, мРНК DR5 — чувствительность к сигналам апоптоза, мРНК DGAT2 — синтез липидов. Фосфорилированный IRE1α связывает адаптерный белок TRAF2 и активирует путь JNK. Ни один из этих выходов сам по себе не определяет судьбу клетки.","Выходы Ire1 различаются и у дрожжей. У почкующихся дрожжей Ire1 действует главным образом через сплайсинг мРНК HAC1, а у делящихся дрожжей транскрипционной программы такого типа нет, и ответ опирается на RIDD. Это показывает, что один сенсор может использовать разные выходы, но не восстанавливает последовательность их появления в эволюции."],"trap":["XBP1s объясняет все последствия активации IRE1α, поэтому без XBP1 у IRE1α нет других эффектов.","IRE1α непосредственно расщепляет и другие РНК (RIDD) и через TRAF2 влияет на путь JNK. Эти выходы не зависят от транскрипции, которую регулирует XBP1s, хотя используют тот же сенсор."],"conditions":"Схема механизма; выходы показаны качественно и по отдельности. RIDD в клетках млекопитающих: фибробласты мыши, вариант IRE1 без нуклеазной активности и вариант, активируемый аналогом ATP (Hollien 2009, по аннотации). Примеры субстратов RIDD (BLOS1, DR5, DGAT2, MHC класса I) и различие выходов Ire1 у почкующихся и делящихся дрожжей — Acosta-Alvear 2025; набор субстратов зависит от типа клеток. Связь фосфорилированного IRE1 с TRAF2 и JNK — Wiseman 2022. 4μ8C подавляет сплайсинг XBP1 и RIDD, киназная активность сохраняется (Cross 2012, по аннотации).","sources":["Acosta2025","Hollien2009","Wiseman2022","Cross2012"],"quiz":{"id":"S10-L13","rev":1,"question":"Почему образование XBP1s не описывает все возможные последствия активации IRE1?","options":[{"id":"S10-L13-2","text":"РНКазные эффекты IRE1 сводятся к транскрипционному действию белка XBP1s.","correct":false,"feedback":"IRE1 может непосредственно расщеплять другие РНК; этот выход нельзя заменить последующей транскрипцией, регулируемой XBP1s."},{"id":"S10-L13-3","text":"По количеству XBP1s можно определить набор других РНК, расщеплённых IRE1.","correct":false,"feedback":"Показатель одного субстрата не задаёт автоматически набор и выраженность остальных РНКазных выходов."},{"id":"S10-L13-1","text":"IRE1 может также расщеплять другие РНК, изменяя их содержание.","correct":true,"feedback":"Помимо сплайсинга XBP1 у IRE1 есть и другие выходы, включая RIDD; их последствия зависят от субстратов."}]},"widget":{"kind":"net","title":"","s":{"title":"Три выхода активного IRE1α","status":"Схема механизма · качественные состояния","ctrls":[{"id":"o","type":"group","label":"Какой выход показать","opts":["Сплайсинг XBP1","RIDD","TRAF2 → JNK"]},{"id":"i","type":"check","label":"Ингибитор РНКазы IRE1 (4μ8C)"}],"W":560,"H":340,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание белков (IRE1α–TRAF2)","seq":"следствие события","dash":"последствия зависят от клеток и условий","nodes":["жёлтая рамка — выход работает","пунктирная рамка — не показан или подавлен","× — подавлен ингибитором","P — IRE1α фосфорилирован"]},"zones":[],"mem":[],"nodes":{"ire1":{"p":[78,170,120,80],"t":"IRE1α\nактивный\nолигомер","n":[40,200,70,100],"fs":16,"tn":"IRE1α\nактив-\nный"},"x1":{"p":[290,64,160,54],"t":"сплайсинг\nмРНК XBP1","n":[152,90,120,50],"fs":15},"rd":{"p":[290,170,180,54],"t":"RIDD: расщепление\nдругих РНК","n":[152,200,120,66],"fs":15,"tn":"RIDD:\nрасщепление\nдругих РНК"},"tj":{"p":[290,276,180,54],"t":"связывание TRAF2\n→ путь JNK","n":[152,316,120,66],"fs":15,"tn":"TRAF2\n→ путь JNK"},"c1":{"p":[474,64,156,54],"t":"XBP1s: гены\nбелков ЭПР","n":[282,90,108,66],"fs":15,"tn":"XBP1s:\nгены\nбелков ЭПР"},"c2":{"p":[474,170,156,54],"t":"меньше\nвыбранных мРНК","n":[282,200,108,66],"fs":15,"tn":"меньше\nвыбранных\nмРНК"},"c3":{"p":[474,276,156,54],"t":"сигнальные\nпоследствия","n":[282,316,108,66],"fs":15,"tn":"сигнальные\nпоследст-\nвия"}},"edges":{"a1":{"a":"ire1","b":"x1","k":"act"},"a2":{"a":"ire1","b":"rd","k":"act"},"a3":{"a":"ire1","b":"tj","k":"bind"},"b1":{"a":"x1","b":"c1","k":"seq"},"b2":{"a":"rd","b":"c2","k":"seq"},"b3":{"a":"tj","b":"c3","k":"act","dash":true}},"st":{"0-0":{"n":{"ire1":"on","x1":"on","rd":"base","tj":"base","c1":"on","c2":"base","c3":"base"},"e":{"a1":"on","a2":"off","a3":"off","b1":"on","b2":"off","b3":"off"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","активна"],["Показанный выход","сплайсинг XBP1"]],"note":"Сплайсинг мРНК XBP1 — продуктивный выход РНКазного домена IRE1α: образуется мРНК XBP1s, затем белок XBP1s, который активирует гены белков ЭПР."},"0-1":{"n":{"ire1":"on","x1":"abs","rd":"off","tj":"base","c1":"off","c2":"off","c3":"base"},"e":{"a1":"off","a2":"off","a3":"off","b1":"off","b2":"off","b3":"off"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","подавлена (4μ8C)"],["Показанный выход","сплайсинг XBP1"]],"note":"Ингибитор 4μ8C ковалентно связывается с Lys907 РНКазного домена IRE1 и закрывает субстрату доступ к активному центру: сплайсинг XBP1 и RIDD подавлены, а киназный домен сохраняется (Cross 2012). Влияние 4μ8C на путь TRAF2–JNK в прочитанных работах не измерялось; состояние этого выхода при действии ингибитора здесь не прогнозируется."},"1-0":{"n":{"ire1":"on","x1":"base","rd":"on","tj":"base","c1":"base","c2":"on","c3":"base"},"e":{"a1":"off","a2":"on","a3":"off","b1":"off","b2":"on","b3":"off"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","активна"],["Показанный выход","RIDD"]],"note":"RIDD — расщепление IRE1α других РНК, прежде всего мРНК, связанных с мембраной ЭПР. Их содержание снижается, и в ЭПР поступает меньше соответствующих белков. Примеры субстратов из обзора Acosta-Alvear 2025: мРНК BLOS1, DR5, DGAT2 и тяжёлых цепей MHC класса I; набор зависит от типа клеток."},"1-1":{"n":{"ire1":"on","x1":"off","rd":"abs","tj":"base","c1":"off","c2":"off","c3":"base"},"e":{"a1":"off","a2":"off","a3":"off","b1":"off","b2":"off","b3":"off"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","подавлена (4μ8C)"],["Показанный выход","RIDD"]],"note":"Ингибитор 4μ8C ковалентно связывается с Lys907 РНКазного домена IRE1 и закрывает субстрату доступ к активному центру: сплайсинг XBP1 и RIDD подавлены, а киназный домен сохраняется (Cross 2012). Влияние 4μ8C на путь TRAF2–JNK в прочитанных работах не измерялось; состояние этого выхода при действии ингибитора здесь не прогнозируется."},"2-0":{"n":{"ire1":"on","x1":"base","rd":"base","tj":"on","c1":"base","c2":"base","c3":"on"},"e":{"a1":"off","a2":"off","a3":"on","b1":"off","b2":"off","b3":"on"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","активна"],["Показанный выход","TRAF2 → JNK"]],"note":"Фосфорилированный IRE1α может связывать адаптерный белок TRAF2 и через него активировать путь JNK. Последствия этого сигнала зависят от клеток и условий; он не означает обязательной гибели клетки."},"2-1":{"n":{"ire1":"on","x1":"off","rd":"off","tj":"base","c1":"off","c2":"off","c3":"base"},"e":{"a1":"off","a2":"off","a3":"on","b1":"off","b2":"off","b3":"on"},"b":{"ire1":{"t":"","at":"r"}},"m":[["РНКазная активность IRE1α","подавлена (4μ8C)"],["Показанный выход","TRAF2 → JNK (при 4μ8C не измерялся)"]],"note":"Ингибитор 4μ8C ковалентно связывается с Lys907 РНКазного домена IRE1 и закрывает субстрату доступ к активному центру: сплайсинг XBP1 и RIDD подавлены, а киназный домен сохраняется (Cross 2012). Влияние 4μ8C на путь TRAF2–JNK в прочитанных работах не измерялось; состояние этого выхода при действии ингибитора здесь не прогнозируется."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"upr-measure","number":14,"section":1,"title":"Какие признаки позволяют различить три ветви UPR","question":2,"questions":[2],"keywords":["методы UPR","иммуноблот","p-eIF2α","ATF6f","ОТ-ПЦР","XBP1s","XBP1u","туникамицин","тапсигаргин","DTT","GSK2606414","4μ8C","нокаут","нокдаун","контроль"],"lead":["Каждую ветвь UPR определяют по её собственному молекулярному событию: PERK — по фосфорилированию eIF2α, IRE1α — по сплайсингу мРНК XBP1, ATF6 — по образованию N-концевого фрагмента.","Один показатель не устанавливает состояние двух других ветвей, а p-eIF2α не указывает, какая киназа его фосфорилировала."],"mechanism":["Фосфорилирование eIF2α — общий узел интегрированного стрессового ответа: при стрессе ЭПР его вызывает PERK, но тот же Ser51 фосфорилируют и другие киназы.","Сплайсинг мРНК XBP1 — признак одного выхода IRE1α; его определяют по продуктам ОТ-ПЦР разной длины.","Образование ATF6f — признак протеолитической активации ATF6; его определяют иммуноблотом по фрагменту меньшей массы."],"paragraphs":["Три ветви UPR изменяют разные молекулы, поэтому и регистрируют их разными способами. Для ветви PERK обычно измеряют содержание фосфорилированного по Ser51 eIF2α относительно общего eIF2α (иммуноблот). Для ветви IRE1α — сплайсинг мРНК XBP1: из РНК получают кДНК, амплифицируют участок вокруг интрона и разделяют продукты XBP1u и XBP1s, различающиеся на 26 пар нуклеотидов. Для ветви ATF6 — появление N-концевого фрагмента ATF6f на иммуноблоте. Каждый показатель отвечает на свой вопрос и не заменяет двух других.","Стресс ЭПР вызывают веществами с известными первичными мишенями. Туникамицин ингибирует GlcNAc-1-P-трансферазу — фермент первой стадии N-гликозилирования в мембране ЭПР. Тапсигаргин ингибирует Ca²⁺-АТФазу ЭПР (SERCA), и запасы Ca²⁺ в ЭПР уменьшаются. DTT восстанавливает дисульфидные связи и препятствует их образованию во вновь синтезированных белках. Все три вещества нарушают сворачивание белков разными путями; ни одно из них не является прямым активатором сенсора.","Чтобы проверить вклад ветви, её подавляют. 4μ8C ковалентно связывается с остатком лизина в РНКазном домене IRE1 и подавляет сплайсинг XBP1 и RIDD, сохраняя киназный домен. GSK2606414 ингибирует PERK, но в той же или меньшей концентрации ингибирует и киназу RIPK1, поэтому вывод о PERK подтверждают генетически: клетки без PERK или IRE1α сравнивают с исходными и проверяют, восстанавливается ли ответ при возвращении белка.","Отрицательный результат тоже ограничен. Если полоса продукта XBP1s не видна, это значит, что его содержание ниже порога обнаружения метода, а не что IRE1α полностью неактивен; к тому же RIDD этим методом не регистрируется. Для проверки вклада выбранного фактора остальные условия — срок, дозу, генотип и способ подготовки образца — сохраняют сопоставимыми."],"trap":["Если продукт XBP1s в геле не виден, IRE1α в клетке полностью неактивен.","Отсутствие полосы означает, что содержание мРНК XBP1s ниже чувствительности метода. Кроме того, IRE1α может работать через RIDD или путь JNK, которые ОТ-ПЦР XBP1 не регистрирует."],"conditions":"Схемы методов и учебные рисунки полос — не данные эксперимента; интенсивности качественные, образцы условно собраны в один срок. Мишени веществ: туникамицин — GlcNAc-1-P-трансфераза человека (Yoo 2018); тапсигаргин — Ca²⁺-АТФаза ЭПР, микросомы печени крысы (Thastrup 1990); DTT — восстановление дисульфидных связей гемагглютинина вируса гриппа в клетках CHO (Braakman 1992); 4μ8C — Lys907 РНКазного домена IRE1 (Cross 2012); GSK2606414 — ингибитор PERK (Axten 2012), ингибирует также RIPK1 (Rojas-Rivera 2017). Сведения о веществах взяты из аннотаций этих работ.","sources":["Acosta2025","Wiseman2022","Lu2014","Yoo2018","Thastrup1990","Braakman1992","Cross2012","Axten2012","RojasRivera2017"],"quiz":{"id":"S10-L14","rev":1,"question":"В образце повышен p-eIF2α. Данных о XBP1s и расщеплении ATF6 нет. Какой вывод обоснован?","options":[{"id":"S10-L14-1","text":"Все три ветви UPR активированы, причём в одинаковой степени, поскольку они отвечают на один стресс ЭПР.","correct":false,"feedback":"Один показатель общего узла ISR не измеряет независимо выходы IRE1 и ATF6."},{"id":"S10-L14-3","text":"Источник сигнала однозначно установлен: фосфорилирование eIF2α в этом образце вызвала киназа PERK.","correct":false,"feedback":"Тот же Ser51 фосфорилируют и другие киназы; для установления входа требуется дополнительное сравнение."},{"id":"S10-L14-2","text":"Повышено фосфорилирование eIF2α; источник сигнала и состояние двух других ветвей ещё не установлены.","correct":true,"feedback":"Для различения ветвей нужны показатели их собственных молекулярных событий и соответствующие контроли."}]},"widget":{"kind":"upr_meth","title":"","s":{"title":"Как различить три ветви UPR","status":"Схемы методов · учебные рисунки, не данные эксперимента","m_label":"Метод","teach":"учебный рисунок","heads":["Что измеряют","Как","Обязательный контроль","Граница вывода"],"methods":[{"name":"Иммуноблот","steps":["клетки после\nвоздействия","лизат,\nэлектрофорез","перенос,\nантитела","сигнал формы\nбелка"],"pic_title":"Полосы иммуноблота при одном сроке","pic":{"kind":"blot","lanes":["К","Tm","Tg"],"rows":[["p-eIF2α",[1,3,3]],["eIF2α общий",[3,3,3]],["ATF6α p90",[3,2,2]],["ATF6f p50",[0,2,2]]],"long":["К — контроль с растворителем","Tm — туникамицин","Tg — тапсигаргин","все образцы собраны через одинаковое время"]},"cards":["Содержание фосфорилированного eIF2α (Ser51) относительно общего eIF2α; полноразмерный ATF6α и его N-концевой фрагмент ATF6f.","Белки лизата разделяют по массе, переносят на мембрану и выявляют антителами к выбранной форме.","Общий eIF2α и контроль загрузки на той же мембране; сигнал в линейном диапазоне; образцы одного срока.","p-eIF2α не указывает, какая киназа его фосфорилировала; полоса не равна активности или скорости реакции."],"note":"Иммуноблот показывает содержание определённых форм белков. Повышение p-eIF2α — общий признак ISR: тот же Ser51 фосфорилируют PERK, GCN2, PKR и HRI. Появление ATF6f отражает протеолитическую активацию ветви ATF6."},{"name":"ОТ-ПЦР XBP1","steps":["РНК\nобразца","обратная\nтранскрипция","ПЦР участка\nXBP1","разделение\nпродуктов"],"pic_title":"Продукты ПЦР в геле","pic":{"kind":"gel","lanes":["К","Tg","Tg+4μ8C","без ОТ"],"rows":[["XBP1u",[3,2,3,0]],["XBP1s",[0,3,0,0]]],"long":["продукт XBP1s на 26 пар нуклеотидов короче и в геле движется дальше","Tg+4μ8C — тапсигаргин и ингибитор РНКазы IRE1α","без ОТ — контроль без обратной транскриптазы"]},"cards":["Наличие продуктов, соответствующих мРНК XBP1u и XBP1s.","Из РНК синтезируют кДНК, амплифицируют участок XBP1 вокруг интрона и разделяют продукты по длине.","Образец без обратной транскриптазы; известные продукты XBP1u и XBP1s; одинаковое число циклов ПЦР.","Это показатель одного выхода IRE1α (сплайсинга XBP1), а не количества белка XBP1s и не RIDD; конечная ПЦР без проверки не количественна."],"note":"ОТ-ПЦР с разделением продуктов различает мРНК XBP1u и XBP1s. Ингибитор 4μ8C блокирует РНКазный домен IRE1α, и продукт XBP1s при стрессе не появляется. Отсутствие полосы ограничено чувствительностью метода."},{"name":"Генетический контроль","steps":["выбор гена\n(IRE1α)","нокдаун\nили нокаут","проверка\nбелка","возврат\nфункции"],"pic_title":"Логика генетического сравнения","pic":{"kind":"rows","rows":[["исходные клетки\n+ стресс ЭПР","IRE1α\nесть","XBP1s\nобразуется"],["IRE1α⁻/⁻\n+ стресс ЭПР","IRE1α\nнет","XBP1s не\nобразуется"],["IRE1α⁻/⁻ + возвращён\nIRE1α","IRE1α\nвосстановлен","XBP1s образуется\nснова"],["нокдаун IRE1α\n(RNAi)","IRE1α\nснижен","XBP1s\nуменьшен"]],"on":[1,0,1,0],"rows_n":[["исходные\n+ стресс","IRE1α\nесть","XBP1s\nесть"],["IRE1α⁻/⁻\n+ стресс","IRE1α\nнет","XBP1s\nнет"],["IRE1α⁻/⁻ +\nвозвращён\nIRE1α","IRE1α\nвосстановлен","XBP1s\nснова есть"],["нокдаун\nIRE1α\n(RNAi)","IRE1α\nснижен","XBP1s\nменьше"]],"long":["учебная схема логики эксперимента, а не результат конкретной работы"]},"cards":["Необходимость выбранного звена (здесь — IRE1α) для данного ответа в данных условиях.","Выключение гена (нокаут) или уменьшение его мРНК (нокдаун), затем возвращение функционального белка.","Сопоставимые исходные клетки, проверка содержания белка, независимое второе воздействие на ту же мишень, возврат функции.","Нокдаун не равен полному отсутствию белка; длительная потеря гена меняет клетку; возврат зависит от количества и места белка."],"note":"Генетическое выключение проверяет, нужен ли белок для ответа. Самый сильный вывод даёт сочетание: без белка ответ исчезает, а при возвращении функционального белка восстанавливается."},{"name":"Вещества и мишени","steps":["вещество,\nдоза, срок","прямая\nмишень","первичное\nнарушение","измеряемый\nответ"],"pic_title":"У каждого вещества своя мишень","pic":{"kind":"rows","rows":[["туникамицин","GlcNAc-1-P-\nтрансфераза","N-гликозилирование\nнарушено"],["тапсигаргин","Ca²⁺-АТФаза\nЭПР (SERCA)","Ca²⁺ в ЭПР\nснижен"],["DTT","дисульфидные\nсвязи","S–S-связи\nвосстановлены"],["GSK2606414","киназа PERK\n(и RIPK1)","p-eIF2α от PERK\nснижено"],["4μ8C","РНКаза\nIRE1α","сплайсинг XBP1\nи RIDD подавлены"]],"on":[0,0,0,0,0],"rows_n":[["туника-\nмицин","GlcNAc-1-P-\nтрансфераза","гликозили-\nрование\nнарушено"],["тапсигар-\nгин","SERCA:\nCa²⁺-АТФаза\nЭПР","Ca²⁺ в ЭПР\nснижен"],["DTT","связи S–S","связи S–S\nвосстанов-\nлены"],["GSK2606414","PERK\n(и RIPK1)","p-eIF2α\nот PERK\nснижено"],["4μ8C","РНКаза\nIRE1α","сплайсинг\nXBP1 и RIDD\nподавлены"]]},"cards":["Зависимость ответа от воздействия с известной первичной мишенью при заданных дозе и сроке.","Индукторы стресса ЭПР нарушают сворачивание разными путями; ингибиторы подавляют выбранную ветвь.","Растворитель, несколько доз и сроков, генетический контроль той же мишени.","Сходный ответ на разные индукторы не значит, что у них одна мишень; ингибитор не доказывает специфичность."],"note":"Туникамицин, тапсигаргин и DTT вызывают стресс ЭПР разными первичными нарушениями, а не прямой активацией сенсоров. GSK2606414 ингибирует и киназу RIPK1, поэтому эффект, приписанный PERK, подтверждают генетически."}]}}},{"id":"keap1-nrf2","number":15,"section":2,"title":"Почему содержание NRF2 мало без электрофильного воздействия","question":3,"questions":[3],"keywords":["KEAP1","NRF2","NFE2L2","CUL3","RBX1","убиквитинирование","протеасома","период полужизни","стационарное содержание","β-TrCP","GSK3"],"lead":["Без электрофильного воздействия [[T34|NRF2]] синтезируется постоянно, но его содержание остаётся низким: белок быстро разрушается.","Скорость разрушения задаёт комплекс [[T37|KEAP1–CUL3–RBX1]], который направляет NRF2 на [[T38|убиквитинирование]] и [[T39|протеасомную деградацию]]."],"mechanism":["[[T33|KEAP1]] связывает NRF2 и служит субстратным адаптером убиквитинлигазного комплекса CUL3–RBX1.","Комплекс присоединяет к NRF2 цепь убиквитина, и убиквитинированный NRF2 расщепляется протеасомой.","В стационарном состоянии NRF2 разрушается с той же общей скоростью, с какой синтезируется; его содержание тем выше, чем меньшая доля молекул разрушается за единицу времени, поэтому замедление разрушения при прежнем синтезе повышает содержание."],"paragraphs":["NRF2 (продукт гена NFE2L2) — транскрипционный фактор, регулирующий гены защиты от электрофилов и окислителей. В клетке без такого воздействия мРНК NRF2 транслируется, и белок образуется непрерывно. Тем не менее NRF2 в клетке мало: по данным разных работ, период полужизни NRF2 в исходном состоянии составляет около 7–20 мин.","Быстрое удаление NRF2 зависит от KEAP1. Раньше KEAP1 считали пассивным «якорем», удерживающим NRF2 в цитоплазме. Эксперименты с трансфицированными клетками показали иное: KEAP1 связывает NRF2 и как субстратный адаптер присоединяет его к куллину CUL3, а белок RBX1 этого комплекса обеспечивает перенос убиквитина. Сам KEAP1 не протеаза и не фермент переноса убиквитина: он определяет, какой белок будет убиквитинирован. NRF2 с цепью убиквитина распознаётся и расщепляется протеасомой.","Содержание любого белка складывается из двух процессов — образования и удаления. При постоянной скорости синтеза замедление разрушения увеличивает стационарное содержание NRF2, а ускорение разрушения уменьшает его. Сразу после замедления разрушения NRF2 удаляется медленнее, чем образуется, и накапливается; новое стационарное содержание устанавливается, когда общая скорость разрушения — произведение числа молекул на разрушаемую долю — снова сравнивается со скоростью синтеза. Поэтому накопление NRF2 возможно без усиления транскрипции его гена: достаточно ослабить KEAP1-зависимое разрушение. Кроме KEAP1-зависимого пути есть и другой: киназа GSK3 фосфорилирует участок NRF2, и фосфорилированный участок распознаётся убиквитинлигазой с β-TrCP. Этот путь сохраняется при нарушенной работе KEAP1.","Тот же принцип — регуляция количества белка через скорость его разрушения — встретится в разделе о HIF-α. Там распознавание определяется гидроксилированием пролина, а убиквитинирование выполняет другой комплекс. Сходство здесь функциональное: в обоих случаях содержание фактора определяется скоростью его разрушения, хотя молекулярные участники разные."],"trap":["Если NRF2 в клетке мало, значит, его ген слабо транскрибируется или мРНК почти не транслируется.","В исходном состоянии NRF2 синтезируется постоянно; его мало потому, что он быстро разрушается при участии KEAP1. Количество белка нельзя оценивать только по синтезу."],"conditions":"Схема механизма, качественные состояния; величины на шкалах условные (уровни «низкий — высокий»), а не измерения. KEAP1-зависимый путь показан как канонический для клеток млекопитающих. Период полужизни NRF2 7–18 мин в разных клетках приведён по обзору Ulasov 2022; менее 20 мин — Kobayashi 2004 (клетки млекопитающих в культуре, по аннотации). Путь GSK3–β-TrCP описан в обзоре Ulasov 2022; в схеме он показан пунктиром и не меняется.","sources":["Liu2022","Kobayashi2004","Ulasov2022"],"quiz":{"id":"S10-L15","rev":2,"question":"В исходном стационарном состоянии скорость синтеза NRF2 постоянна. KEAP1-зависимое направление NRF2 на разрушение замедлилось; остальные пути распада не изменились. Какое изменение содержания NRF2 ожидается?","options":[{"id":"S10-L15-1","text":"Содержание уменьшится из-за усиления его убиквитинирования.","correct":false,"feedback":"В условии ослаблен путь к разрушению; увеличение убиквитинирования не является заданным изменением."},{"id":"S10-L15-3","text":"Содержание возрастёт за счёт замедленного распада.","correct":true,"feedback":"При продолжающемся синтезе уменьшение скорости удаления приводит к накоплению белка."},{"id":"S10-L15-2","text":"Содержание останется прежним, поскольку скорость синтеза не изменилась.","correct":false,"feedback":"Стационарное содержание зависит также от скорости распада; постоянный синтез не фиксирует количество белка."}]},"widget":{"kind":"net","title":"","s":{"title":"Синтез и распад задают содержание NRF2","status":"Схема механизма · качественные состояния","ctrls":[{"id":"k","type":"group","label":"KEAP1-зависимое разрушение","opts":["Быстрое (исходное состояние)","Замедленное"]},{"id":"g","type":"check","label":"Показать путь без KEAP1 (GSK3–β-TrCP)"}],"W":560,"H":330,"NW":340,"NH":300,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий: синтез, убиквитинирование, разрушение","dash":"путь распада без участия KEAP1","nodes":["жёлтая рамка — активно, усилено или накоплено","пунктирная рамка — снижено или не работает"]},"zones":[],"mem":[],"nodes":{"syn":{"p":[92,56,160,52],"t":"синтез NRF2\n(постоянный)","n":[82,40,150,50],"tn":"синтез NRF2\n(постоянный)"},"nrf2":{"p":[318,56,110,44],"t":"NRF2","n":[284,40,90,40]},"keap":{"p":[182,168,220,46],"t":"KEAP1–CUL3–RBX1","n":[86,140,160,44],"tn":"KEAP1–CUL3–\nRBX1"},"gsk":{"p":[446,168,196,52],"t":"GSK3 → β-TrCP\n(без KEAP1)","n":[262,140,120,52],"tn":"GSK3 →\nβ-TrCP"},"ubn":{"p":[182,282,196,52],"t":"NRF2 с цепью\nубиквитина","n":[92,248,160,52]},"prot":{"p":[446,282,160,46],"t":"протеасома","n":[262,248,120,46]}},"edges":{"s":{"a":"syn","b":"nrf2","k":"seq","t":"синтез","d":[0,-16],"dn":[0,-14]},"b":{"a":"nrf2","b":"keap","k":"bind","t":"связывание","tn":"","d":[-48,0]},"u":{"a":"keap","b":"ubn","k":"seq","t":"убиквитинирование","d":[-84,0],"dn":[150,-10],"anc":"end"},"p":{"a":"ubn","b":"prot","k":"seq","t":"разрушение","d":[0,-16],"dn":[0,-16]},"g1":{"a":"nrf2","b":"gsk","k":"seq","dash":true},"g2":{"a":"gsk","b":"prot","k":"seq","dash":true}},"st":{"0-0":{"n":{"syn":"on","nrf2":"base","keap":"on","ubn":"base","prot":"base","gsk":"hide"},"e":{"u":"on","p":"on","g1":"hide","g2":"hide"},"note":"NRF2 синтезируется непрерывно, но почти каждая новая молекула связывается с KEAP1, убиквитинируется комплексом KEAP1–CUL3–RBX1 и разрушается протеасомой. Поэтому стационарное содержание NRF2 мало.","bars":[["Скорость синтеза NRF2",2],["Доля NRF2, разрушаемая за единицу времени при участии KEAP1",3],["Стационарное содержание NRF2",1]]},"0-1":{"n":{"syn":"on","nrf2":"base","keap":"on","ubn":"base","prot":"base","gsk":"base"},"e":{"u":"on","p":"on"},"note":"NRF2 синтезируется непрерывно, но почти каждая новая молекула связывается с KEAP1, убиквитинируется комплексом KEAP1–CUL3–RBX1 и разрушается протеасомой. Поэтому стационарное содержание NRF2 мало. Пунктир — путь распада без участия KEAP1: GSK3 фосфорилирует NRF2, и комплекс с β-TrCP убиквитинирует фосфорилированный NRF2; в этой схеме путь не меняется.","bars":[["Скорость синтеза NRF2",2],["Доля NRF2, разрушаемая за единицу времени при участии KEAP1",3],["Стационарное содержание NRF2",1]]},"1-0":{"n":{"syn":"on","nrf2":"on","keap":"low","ubn":"base","prot":"base","gsk":"hide"},"e":{"u":"off","p":"off","g1":"hide","g2":"hide"},"note":"Синтез NRF2 не изменился, а KEAP1-зависимое разрушение замедлено: за единицу времени разрушается меньшая доля молекул. Сначала NRF2 удаляется медленнее, чем образуется, и накапливается; новое, более высокое стационарное содержание устанавливается, когда общая скорость разрушения снова сравнивается со скоростью синтеза.","bars":[["Скорость синтеза NRF2",2],["Доля NRF2, разрушаемая за единицу времени при участии KEAP1",1],["Стационарное содержание NRF2",3]]},"1-1":{"n":{"syn":"on","nrf2":"on","keap":"low","ubn":"base","prot":"base","gsk":"base"},"e":{"u":"off","p":"off"},"note":"Синтез NRF2 не изменился, а KEAP1-зависимое разрушение замедлено: за единицу времени разрушается меньшая доля молекул. Сначала NRF2 удаляется медленнее, чем образуется, и накапливается; новое, более высокое стационарное содержание устанавливается, когда общая скорость разрушения снова сравнивается со скоростью синтеза. Пунктир — путь распада без участия KEAP1: GSK3 фосфорилирует NRF2, и комплекс с β-TrCP убиквитинирует фосфорилированный NRF2; в этой схеме путь не меняется.","bars":[["Скорость синтеза NRF2",2],["Доля NRF2, разрушаемая за единицу времени при участии KEAP1",1],["Стационарное содержание NRF2",3]]}},"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"keap1-cysteines","number":16,"section":2,"title":"Как модификация цистеинов KEAP1 изменяет устойчивость NRF2","question":3,"questions":[3],"keywords":["электрофил","цистеин","тиоловая группа","Cys151","Cys273","Cys288","BTB","IVR","Kelch","ETGE","DLG","сульфорафан","конформационный цикл","масс-спектрометрия","p62"],"lead":["[[T35|Электрофилы]] ковалентно модифицируют [[T36|тиоловые группы цистеинов]] KEAP1, и комплекс KEAP1–CUL3–RBX1 перестаёт эффективно убиквитинировать NRF2.","Для накопления NRF2 не обязательно, чтобы он отделился от KEAP1: связывание и продуктивное убиквитинирование — разные свойства комплекса."],"mechanism":["Электрофил принимает электронную пару, а тиоловая группа цистеина служит её донором; при реакции образуется ковалентная связь с остатком цистеина.","Разные цистеины KEAP1 выполняют разные функции: Cys151 домена BTB нужен для ответа на сульфорафан и ряд других индукторов, а Cys273 и Cys288 промежуточной области IVR — для самого убиквитинирования NRF2.","После модификации KEAP1 может по-прежнему связывать NRF2, но убиквитинирование ослабевает; занятый KEAP1 не принимает новые молекулы NRF2, и они накапливаются."],"paragraphs":["Электрофил — соединение, способное принимать электронную пару при образовании химической связи. Тиоловая группа (–SH) боковой цепи цистеина богата электронами и легко вступает в такие реакции. Электрофилы — это не то же самое, что свободные радикалы или любые окислители: перекись водорода, например, окисляет цистеины KEAP1, но по другому механизму и с участием других остатков.","В KEAP1 домен BTB обеспечивает образование димера и связывание с CUL3. Два домена Kelch этого димера распознают мотивы ETGE и DLG белка NRF2; связывание с ETGE прочнее, чем с DLG. Между доменами BTB и Kelch каждого мономера KEAP1 расположена промежуточная область IVR. Цистеины этих частей неравноценны. В экспериментах Zhang и Hannink (2003) на трансфицированных клетках замены Cys273 и Cys288 нарушали KEAP1-зависимое убиквитинирование NRF2, а Cys151 был нужен для того, чтобы сульфорафан и окислительное воздействие подавляли разрушение NRF2. Набор важных остатков зависит от индуктора, поэтому вывод о Cys151 нельзя переносить на все электрофилы.","Как модификация останавливает разрушение NRF2? По данным Baird и соавт. (2013), полученным в живых клетках, комплекс проходит цикл: сначала NRF2 связан с одним мономером KEAP1 через ETGE, затем с обоими — через ETGE и DLG; в этом «закрытом» состоянии NRF2 убиквитинируется. Индуктор останавливает цикл в закрытом состоянии без освобождения NRF2: KEAP1 остаётся занят, и вновь синтезированный NRF2 накапливается. Это одна из моделей; общий вывод обзоров — электрофилы мало меняют связывание, но подавляют функцию KEAP1 как адаптера убиквитинлигазы.","Возможен и другой путь — конкуренция за связывание без модификации цистеинов. Так действует p62: его мотив KIR связывается с доменом Kelch и вытесняет NRF2 из связи через DLG. Это иной механизм, и его следует отличать от электрофильной модификации."],"trap":["Все индукторы NRF2 действуют через один и тот же цистеин KEAP1 — Cys151.","Набор важных остатков зависит от индуктора: ответ на сульфорафан требует Cys151, Cys273 и Cys288 нужны для самого убиквитинирования NRF2, а перекись водорода окисляет другие цистеины KEAP1."],"conditions":"Схема механизма, качественные состояния; показан один мономер KEAP1, хотя KEAP1 действует как димер. Zhang & Hannink 2003 — трансфицированные клетки млекопитающих в культуре, сульфорафан и окислительное воздействие (прочитана аннотация; по индексам MeSH — клетки COS и NIH 3T3). Baird 2013 — живые клетки, перенос энергии флуоресценции, измеряемый методом времени жизни флуоресценции (по аннотации). Номера Cys151, Cys273 и Cys288 одинаковы для KEAP1 человека и мыши. Dinkova-Kostova 2002 — очищенный KEAP1 мыши (25 цистеинов), модификация дексаметазонмезилатом, масс-спектрометрия триптических пептидов: наиболее реакционноспособны C257, C273, C288, C297 (по аннотации). В экспериментах с очищенным белком авторы наблюдали разрушение комплекса KEAP1–Neh2 индукторами, а в клетках связывание в основном сохраняется — результат зависит от системы. Механизм p62 — Komatsu 2010, Liu 2022.","sources":["Liu2022","Baird2013","Zhang2003","DinkovaKostova2002","Komatsu2010"],"quiz":{"id":"S10-L16","rev":1,"question":"После действия электрофила KEAP1 продолжает связывать NRF2, но продуктивное убиквитинирование NRF2 уменьшается. Совместим ли такой результат с накоплением NRF2?","options":[{"id":"S10-L16-1","text":"Да: сохранённое связывание не означает сохранённого направления на разрушение.","correct":true,"feedback":"Физическая связь и продуктивное убиквитинирование — разные свойства комплекса; первое может сохраняться при ослаблении второго."},{"id":"S10-L16-2","text":"Нет: NRF2 может накапливаться только после полного отделения от каждой молекулы KEAP1.","correct":false,"feedback":"Обязательная полная диссоциация не является общим условием электрофильной активации этого пути."},{"id":"S10-L16-3","text":"Нет: любое связывание с KEAP1 обязательно ускоряет разрушение NRF2 в прежней степени.","correct":false,"feedback":"Модификация KEAP1 может менять функцию связанного комплекса без устранения самого взаимодействия."}]},"widget":{"kind":"net","title":"","s":{"title":"Модификация цистеинов KEAP1 и судьба NRF2","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Условие","opts":["Исходное состояние","Электрофил: модификация Cys151","Конкуренция p62 за домен Kelch","Метод: модифицированные пептиды"]}],"W":560,"H":300,"NW":340,"NH":390,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"ковалентная модификация","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, этапы метода","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно, усилено или накоплено","пунктирная рамка — снижено или не работает","зелёная рамка — этап метода"]},"zones":[{"x":8,"y":112,"w":544,"h":96,"c":"plain","t":"KEAP1 (показан один мономер)","lx":168,"ly":200,"n":[4,104,332,104,10,198],"tn":"KEAP1"}],"mem":[],"nodes":{"el":{"p":[100,40,160,50],"t":"электрофил\n(сульфорафан)","n":[92,34,160,48]},"p62":{"p":[468,40,164,46],"t":"p62 (мотив KIR)","n":[260,34,140,48],"tn":"p62\n(мотив KIR)"},"btb":{"p":[100,148,160,46],"t":"BTB · Cys151","n":[60,140,104,56],"tn":"BTB\nCys151"},"ivr":{"p":[300,148,196,46],"t":"IVR · Cys273, Cys288","n":[172,140,100,56],"fs":16,"tn e","b1":"hide","b2":"hide","b3":"hide","el":"on","p62":"hide","btb":"on","ivr":"base","kelch":"on","cul3":"low","nrf2":"on"},"e":{"ae0":"hide","ae1":"hide","ae2":"hide","be0":"hide","be1":"hide","be2":"hide","p":"hide","u":"off"},"m":[["Связывание NRF2 с KEAP1","сохраняется"],["Продуктивное убиквитинирование NRF2","снижено"]],"note":"Сульфорафан ковалентно модифицирует Cys151 домена BTB. NRF2 остаётся связанным с KEAP1, но убиквитинирование NRF2 ослабевает. Занятый KEAP1 не освобождается для новых молекул NRF2, и вновь синтезированный NRF2 накапливается."},"2":{"n":{"a0":"hide","a1":"hide","a2":"hide","a3":"hide","b0":"hide","b1":"hide","b2":"hide","b3":"hide","el":"hide","p62":"on","btb":"base","ivr":"base","kelch":"on","cul3":"low","nrf2":"on"},"e":{"ae0":"hide","ae1":"hide","ae2":"hide","be0":"hide","be1":"hide","be2":"hide","m":"hide","u":"off"},"m":[["Связывание NRF2 с KEAP1","ослаблено (вытеснен DLG)"],["Продуктивное убиквитинирование NRF2","снижено"]],"note":"Другой механизм: p62 связывается с доменом Kelch мотивом KIR, похожим на ETGE, и вытесняет более слабо связанный мотив DLG. Цистеины KEAP1 при этом не модифицируются. Без связывания по обоим мотивам NRF2 не убиквитинируется и накапливается.","et":{"k":"только ETGE"}},"3":{"n":{"el":"hide","p62":"hide","btb":"hide","ivr":"hide","kelch":"hide","cul3":"hide","nrf2":"hide","a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{"m":"hide","c":"hide","k":"hide","p":"hide","u":"hide"},"t":{"a0":"Белок и\nиндуктор","a1":"Протеолиз:\nпептиды","a2":"Масс-спектро-\nметрия","a3":"Модифициро-\nванный Cys\nи позиция","b0":"Замена Cys\nна Ser","b1":"Тот же\nиндуктор","b2":"Содержание\nNRF2","b3":"Сравнение\nс исходным\nKEAP1"},"tn":{"a0":"Белок\nи индуктор","a1":"Протеолиз:\nпептиды","a2":"Масс-\nспектрометрия","a3":"Модифицированный\nCys и позиция","b0":"Замена Cys\nна Ser","b1":"Тот же\nиндуктор","b2":"Содержание\nNRF2","b3":"Сравнение с\nисходным KEAP1"},"m":[["Что измеряется","химическое состояние определённого цистеина"],["Контроль","тот же белок без индуктора; защита тиолов при подготовке"]],"note":"Метод: анализ модифицированных цистеиновых пептидов. Белок обрабатывают индуктором, расщепляют протеазой до пептидов и по масс-спектрам находят пептид с модифицированным цистеином и его позицию. Найденная модификация не доказывает, что она необходима для ответа. Это проверяют функционально (нижняя дорожка): остаток заменяют, например цистеин на серин, и сравнивают накопление NRF2 после того же индуктора с ответом клеток с исходным KEAP1.","z":{"0":"hide"}}},"notes_svg":[{"t":"Анализ модифицированных цистеиновых пептидов","x":14,"y":14,"a":"start","only":["3"],"b":true,"n":[8,16],"tn":"Модифицированные пептиды"},{"t":"Функциональная проверка: замена остатка","x":14,"y":142,"a":"start","only":["3"],"b":true,"n":[8,182],"tn":"Замена остатка"}],"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"nrf2-transcription","number":17,"section":2,"title":"Как NRF2 регулирует транскрипцию через малые Maf и ARE","question":3,"questions":[3],"keywords":["NRF2","малый Maf","MafG","MafK","ARE","элемент антиоксидантного ответа","ядро","транскрипция","BACH1","HMOX1","bZIP"],"lead":["Стабилизированный NRF2 действует в ядре: вместе с [[T40|малым Maf-белком]] он образует гетеродимер, который связывается с [[T41|элементом антиоксидантного ответа]] (ARE) в регуляторных областях генов-мишеней.","Количество NRF2, его ядерная доля, связывание с ARE и синтез РНК генов-мишеней — четыре разных события, и их не следует сводить к одному показателю «активации»."],"mechanism":["Накопившийся NRF2 переносится в ядро; в цитоплазме и ядре его количество задаётся также соотношением импорта и экспорта.","NRF2 и малый Maf (MafF, MafG или MafK) образуют гетеродимер через лейциновые «молнии»; этот комплекс связывается с последовательностью ARE в ДНК.","Связывание с ARE усиливает транскрипцию соответствующих генов; на части генов ARE может быть занят репрессором BACH1 в комплексе с малым Maf."],"paragraphs":["После того как разрушение NRF2 замедлилось, новые молекулы накапливаются и переходят в ядро. NRF2 содержит сигналы ядерной локализации и сигналы ядерного экспорта, поэтому его распределение между цитоплазмой и ядром определяется балансом импорта и экспорта. Ядерная доля — отдельная величина: она может меняться иначе, чем общее количество белка.","NRF2 принадлежит к белкам с основным участком и лейциновой «молнией» (bZIP). Связываться с ДНК он может только в паре с партнёром — одним из малых Maf-белков. Гетеродимер NRF2–Maf распознаёт ARE — короткую регуляторную последовательность ДНК в промоторах и энхансерах генов-мишеней. ARE — это участок ДНК, а не белок и не показатель окислительного повреждения. Не следует путать его с HRE — элементом, с которым связывается комплекс HIF-α с ARNT в ответе на гипоксию.","Малые Maf-белки образуют комплексы и с другими факторами. Один из них — репрессор BACH1: в комплексе с малым Maf он занимает ARE ряда генов, например гена HMOX1, и подавляет их транскрипцию. В клетках HaCaT арсенит выводил BACH1 из ядра уже за 30 мин, и HMOX1 индуцировался задолго до заметного накопления NRF2 в ядре. Значит, транскрипция гена-мишени зависит не только от количества NRF2, но и от того, свободен ли ARE.","Из этого следует порядок событий: стабилизация белка → накопление в ядре → связывание с ARE → синтез РНК. Каждое событие измеряют отдельно, и одно не доказывает другого. Наличие похожей на ARE последовательности в гене также не означает, что этот ген будет активирован в любой ткани: важны доступность хроматина и другие регуляторы."],"trap":["Если NRF2 оказался в ядре, все гены с последовательностью ARE обязательно активируются в любой клетке.","Ядерная локализация — лишь одно из условий. Для транскрипции нужны гетеродимер с малым Maf, связывание с доступным ARE и отсутствие конкурирующих репрессоров, например BACH1."],"conditions":"Схема механизма, качественные состояния; шкалы условные. Гетеродимер NRF2–малый Maf и ARE — обзоры Liu 2022 и Ulasov 2022. Сигналы ядерной локализации и экспорта NRF2 — обзор Ulasov 2022. Пример HMOX1: клетки HaCaT (кератиноциты человека), арсенит; выход BACH1 из ядра через 30 мин, накопление NRF2 в ядре к 3 ч — эксперимент, описанный в обзоре Liu 2022 (первичная работа в этой подготовке не прочитана).","sources":["Liu2022","Ulasov2022"],"quiz":{"id":"S10-L17","rev":1,"question":"Какой комплекс непосредственно участвует в распознавании ARE в канонической транскрипционной программе NRF2?","options":[{"id":"S10-L17-1","text":"Комплекс NRF2 с KEAP1, который переносит оба белка к ARE.","correct":false,"feedback":"В каноническом ДНК-связывающем комплексе партнёром NRF2 служит малый Maf, а KEAP1 относится к регуляции его устойчивости."},{"id":"S10-L17-2","text":"Гетеродимер NRF2 с одним из малых Maf-белков.","correct":true,"feedback":"Малые Maf служат партнёрами NRF2 в комплексе, связывающем соответствующие последовательности ДНК."},{"id":"S10-L17-3","text":"Гетеродимер NRF2 с ARNT, который связывает HRE.","correct":false,"feedback":"ARNT и HRE относятся к канонической системе HIF; они не заменяют малые Maf и ARE в этом механизме."}]},"widget":{"kind":"net","title":"","s":{"title":"От ядерного NRF2 к синтезу РНК","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Состояние","opts":["Исходное состояние","Разрушение NRF2 замедлено","Ген HMOX1: BACH1 выведен из ядра"]}],"W":560,"H":360,"NW":340,"NH":360,"lg":{"title":"Обозначения на схеме","act":"усиление транскрипции","inh":"направление на разрушение","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос белка в ядро","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно, усилено или накоплено","пунктирная рамка — снижено или не работает"]},"zones":[{"x":6,"y":6,"w":548,"h":120,"c":"cyto","t":"цитоплазма","lx":546,"ly":118,"n":[4,4,332,100,330,98],"a":"end"},{"x":6,"y":162,"w":548,"h":192,"c":"nuc","t":"ядро","lx":546,"ly":346,"n":[4,134,332,220,330,348],"a":"end"}],"mem":[{"x1":6,"y1":148,"x2":554,"y2":148,"t":"ядерная оболочка","lx":16,"ly":140,"n":[4,120,336,120,8,114]}],"nodes":{"keap":{"p":[120,72,196,44],"t":"KEAP1–CUL3–RBX1","n":[72,58,128,44],"tn":"KEAP1–\nCUL3–RBX1"},"nrf2c":{"p":[360,72,110,44],"t":"NRF2","n":[240,58,90,40]},"nrf2n":{"p":[330,210,110,44],"t":"NRF2","n":[200,182,90,40]},"maf":{"p":[478,210,120,44],"t":"малый Maf","n":[300,182,64,40],"tn":"Maf"},"bach":{"p":[120,210,186,44],"t":"BACH1–малый Maf","n":[66,182,112,44],"tn":"BACH1–\nMaf"},"are":{"p":[320,312,170,44],"t":"ARE в ДНК","n":[150,290,110,40]},"rna":{"p":[494,312,124,44],"t":"новая РНК","n":[290,290,84,40],"tn":"РНК"}},"edges":{"deg":{"a":"keap","b":"nrf2c","k":"inh","t":"разрушение","d":[0,-16],"dn":[0,-14]},"imp":{"a":"nrf2c","b":"nrf2n","k":"tr","t":"перенос в ядро","d":[16,34],"dn":[10,30],"anc":"start"},"dim":{"a":"nrf2n","b":"maf","k":"bind"},"b1":{"a":"nrf2n","b":"are","k":"bind","t":"связывание","d":[-12,0],"dn":[-10,0],"anc":"end"},"bb":{"a":"bach","b":"are","k":"bind","t":"репрессия","d":[-10,10],"dn":[-6,12],"anc":"end"},"tx":{"a":"are","b":"rna","k":"act","t":"транскрипция","tn":"","d":[0,-16]}},"st":{"0":{"n":{"keap":"on","nrf2c":"low","nrf2n":"off","maf":"base","bach":"base","are":"base","rna":"off"},"e":{"imp":"off","dim":"off","b1":"off","tx":"off"},"note":"Исходное состояние. NRF2 быстро разрушается при участии KEAP1, и в ядро его попадает мало. В части генов, например HMOX1, ARE занят репрессором BACH1 в комплексе с малым Maf.","bars":[["Содержание NRF2",1],["NRF2 в ядре",1],["Связывание NRF2 с ARE",1],["Синтез РНК гена-мишени",1]]},"1":{"n":{"keap":"low","nrf2c":"on","nrf2n":"on","maf":"on","bach":"hide","are":"on","rna":"on"},"e":{"deg":"off","bb":"hide"},"note":"Разрушение NRF2 замедлено. Накопившийся NRF2 переносится в ядро, образует гетеродимер с малым Maf и связывается с ARE; транскрипция гена-мишени усиливается. Четыре показания измеряют разные события.","bars":[["Содержание NRF2",3],["NRF2 в ядре",3],["Связывание NRF2 с ARE",3],["Синтез РНК гена-мишени",3]]},"2":{"n":{"keap":"on","nrf2c":"low","nrf2n":"base","maf":"on","bach":"hide","are":"on","rna":"on"},"e":{"imp":"off","bb":"hide"},"t":{"are":"ARE гена HMOX1"},"tn":{"are":"ARE HMOX1"},"note":"Пример гена HMOX1: в клетках HaCaT арсенит уже через 30 мин вызывал выход BACH1 из ядра и уменьшение его связывания с промотором HMOX1, а заметное накопление NRF2 в ядре наступало лишь к 3 ч. Для индукции HMOX1 хватало исходного количества NRF2, когда ARE освобождался от BACH1.","bars":[["Содержание NRF2",1],["NRF2 в ядре",1],["Связывание NRF2 с ARE",2],["Синтез РНК гена-мишени",3]]}},"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"nrf2-effectors","number":18,"section":2,"title":"Почему NRF2-зависимая защита требует синтеза ферментов","question":3,"questions":[3],"keywords":["NRF2","гены-мишени","GCLC","GCLM","глутамат-цистеин-лигаза","NQO1","TXNRD1","тиоредоксинредуктаза","HMOX1","HO-1","глутатион","GSH","GSSG","NADPH","глутатионпероксидаза","глутатионредуктаза"],"lead":["NRF2 — транскрипционный фактор: он сам не восстанавливает пероксиды и не связывает электрофилы. Защиту обеспечивают ферменты, гены которых транскрибируются при участии NRF2.","Поэтому между накоплением NRF2 и ростом содержания ферментов проходит время: нужны транскрипция и трансляция."],"mechanism":["NRF2 усиливает транскрипцию генов ферментов синтеза глутатиона ([[T46|GCLC и GCLM]]), восстановления хинонов ([[T45|NQO1]]), тиоредоксиновой системы ([[T47|TXNRD1]]), расщепления гема ([[T48|HO-1]]) и др.","Глутатионпероксидаза катализирует реакцию 2 GSH + H₂O₂ → GSSG + 2 H₂O, а глутатионредуктаза — реакцию GSSG + NADPH + H⁺ → 2 GSH + NADP⁺.","Защитный эффект возникает после синтеза новых молекул ферментов и зависит от доступности их субстратов, в том числе [[T44|NADPH]]."],"paragraphs":["Связавшийся с ARE гетеродимер NRF2–малый Maf усиливает транскрипцию генов-мишеней. Набор таких генов широк: ферменты синтеза и использования глутатиона, тиоредоксиновой системы, обезвреживания чужеродных веществ, образования NADPH и обмена гема. Для объяснения достаточно нескольких примеров. GCLC и GCLM — каталитическая и модифицирующая субъединицы глутамат-цистеин-лигазы, фермента первой стадии синтеза глутатиона. NQO1 восстанавливает хиноны. TXNRD1 восстанавливает тиоредоксин за счёт NADPH. HO-1 (продукт гена HMOX1) расщепляет гем; её ген регулируется не только NRF2, и рост HO-1 не означает защиты от любого повреждения.","Глутатион ([[T43|GSH]]) — трипептид γ-глутамилцистеинилглицин; его тиоловая группа служит донором электронов. Глутатионпероксидаза восстанавливает H₂O₂ до воды: 2 GSH + H₂O₂ → GSSG + 2 H₂O. Две молекулы глутатиона при этом окисляются и образуют дисульфид GSSG. Это первая реакция; пероксид в ней восстанавливается, а не превращается в глутатион.","Вторая, отдельная реакция возвращает глутатион в восстановленную форму. Глутатионредуктаза восстанавливает GSSG: GSSG + NADPH + H⁺ → 2 GSH + NADP⁺. Источником электронов служит именно NADPH; NADH в этой реакции его не заменяет. Поэтому защита зависит и от путей образования NADPH, которые рассматривались в семинаре 8.","Из этих реакций видно место NRF2. Он не участвует в химических превращениях, а меняет количество ферментов. Сначала растёт содержание NRF2 в ядре, затем — мРНК генов-мишеней, и лишь после трансляции — содержание ферментов. Поэтому ранний и поздний сроки эксперимента дают разные показания, и усиление транскрипции не означает автоматического уменьшения всех активных форм кислорода."],"trap":["Глутатион «превращается» в пероксид или пероксид — в GSSG: это одна реакция цикла.","Реакций две. Глутатионпероксидаза восстанавливает H₂O₂ до воды, окисляя две молекулы GSH в GSSG; глутатионредуктаза затем восстанавливает GSSG до GSH за счёт NADPH."],"conditions":"Схема механизма; ранний и поздний сроки показаны качественно, без часов. Набор генов-мишеней зависит от клетки и ткани; приведены примеры, описанные в обзорах Tonelli 2018 (по аннотации), Liu 2022 и Ulasov 2022. Стехиометрия реакций глутатионпероксидазы и глутатионредуктазы — общепринятая биохимическая. Утверждение, что ген глутатионпероксидазы регулируется NRF2, здесь не делается.","sources":["Liu2022","Ulasov2022","Tonelli2018"],"quiz":{"id":"S10-L18","rev":1,"question":"NRF2 накопился в ядре и связался с ARE в составе соответствующего комплекса. Какое событие связывает это с увеличением содержания защитных ферментов?","options":[{"id":"S10-L18-1","text":"Связанный с ДНК NRF2 непосредственно катализирует удаление пероксидов.","correct":false,"feedback":"NRF2 регулирует транскрипцию; каталитические реакции выполняют продукты соответствующих генов."},{"id":"S10-L18-3","text":"Изменение транскрипции генов-мишеней и последующий синтез соответствующих белков.","correct":true,"feedback":"NRF2 действует через экспрессию генов; появление новых молекул ферментов отделено во времени от связывания фактора с ДНК."},{"id":"S10-L18-2","text":"Ядерный NRF2 немедленно увеличивает количество уже существующих ферментов без синтеза новых молекул.","correct":false,"feedback":"Изменение содержания фермента требует изменения его синтеза или распада; само связывание регулятора с ДНК не создаёт новые молекулы фермента."}]},"widget":{"kind":"net","title":"","s":{"title":"Ферменты-мишени NRF2 и две реакции глутатионового цикла","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Что показать","opts":["Исходное состояние","Ранний срок","Поздний срок","Реакции глутатионового цикла"]}],"W":560,"H":330,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"усиление транскрипции","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическая реакция (подпись — фермент)","eq":"перенос электронов","bind":"связывание, кон онпероксидаза","tn":"глутатион-\nпероксидаза","d":[0,26],"dn":[10,0],"anc":"middle"},"x2":{"a":"r2a","b":"r2b","k":"rx","t":"глутатионредуктаза","tn":"глутатион-\nредуктаза","d":[0,26],"dn":[10,0],"anc":"middle"}},"st":{"0":{"n":{"r1a":"hide","r1b":"hide","r2a":"hide","r2b":"hide","nrf2":"low","rna":"base","gcl":"base","nqo":"base","txn":"base","hmo":"base","fgcl":"base","fnqo":"base","ftxn":"base","fhmo":"base"},"e":{"x1":"hide","x2":"hide","t":"off","l1":"off","l2":"off","l3":"off","l4":"off"},"note":"Исходное состояние: NRF2 мало, и гены-мишени транскрибируются на исходном уровне. Ферменты уже есть в клетке в исходном количестве.","bars":[["NRF2 в ядре",1],["мРНК генов-мишеней",1],["Содержание ферментов",1]]},"1":{"n":{"r1a":"hide","r1b":"hide","r2a":"hide","r2b":"hide","nrf2":"on","rna":"on","gcl":"base","nqo":"base","txn":"base","hmo":"base","fgcl":"base","fnqo":"base","ftxn":"base","fhmo":"base"},"e":{"x1":"hide","x2":"hide","l1":"off","l2":"off","l3":"off","l4":"off"},"note":"Ранний срок: NRF2 накопился в ядре и усиливает транскрипцию генов-мишеней. Новых молекул ферментов ещё мало: для этого мРНК должна пройти трансляцию.","bars":[["NRF2 в ядре",3],["мРНК генов-мишеней",2],["Содержание ферментов",1]]},"2":{"n":{"r1a":"hide","r1b":"hide","r2a":"hide","r2b":"hide","nrf2":"base","rna":"on","gcl":"on","nqo":"on","txn":"on","hmo":"on","fgcl":"on","fnqo":"on","ftxn":"on","fhmo":"on"},"e":{"x1":"hide","x2":"hide"},"note":"Поздний срок: синтезированы новые молекулы ферментов, и их содержание выросло. Защитные реакции катализируют ферменты, а не сам NRF2. Содержание NRF2 к этому времени может уже снижаться.","bars":[["NRF2 в ядре",2],["мРНК генов-мишеней",2],["Содержание ферментов",3]]},"3":{"n":{"nrf2":"hide","rna":"hide","gcl":"hide","nqo":"hide","txn":"hide","hmo":"hide","fgcl":"hide","fnqo":"hide","ftxn":"hide","fhmo":"hide","r1a":"on","r1b":"base","r2a":"on","r2b":"base"},"e":{"t":"hide","l1":"hide","l2":"hide","l3":"hide","l4":"hide","f1":"hide","f2":"hide","f3":"hide","f4":"hide"},"m":[["Восстановитель пероксида","GSH (NRF2 в реакции не участвует)"],["Источник электронов для восстановления GSSG","NADPH, а не NADH"]],"note":"Две отдельные реакции. Глутатионпероксидаза восстанавливает H₂O₂ до воды за счёт окисления двух молекул GSH в GSSG. Глутатионредуктаза восстанавливает GSSG обратно до двух молекул GSH, используя NADPH. Пероксид не превращается в GSSG: он восстанавливается, а окисляется глутатион."}},"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"nrf2-feedback","number":19,"section":2,"title":"Как p62 связывает NRF2 с селективной аутофагией","question":3,"questions":[3],"keywords":["p62","SQSTM1","секвестосома","селективная аутофагия","KIR","Kelch","положительная обратная связь","Atg7","β-TrCP","импульсное мечение","RNAi"],"lead":["[[T42|p62/SQSTM1]] — рецептор селективной аутофагии, который может связываться с KEAP1 и тем самым ослаблять разрушение NRF2.","NRF2 в свою очередь усиливает транскрипцию гена SQSTM1, кодирующего p62. Так замыкается положительная обратная связь."],"mechanism":["NRF2 вместе с малым Maf связывается с ARE в промоторе SQSTM1 и усиливает синтез p62.","p62 связывается с доменом Kelch белка KEAP1 мотивом KIR и мешает связыванию NRF2; комплексы p62–KEAP1 удаляются аутофагией.","Оба действия поддерживают исходное изменение — накопление NRF2, поэтому петля положительная, хотя в ней есть звено торможения."],"paragraphs":["p62 знаком по семинару 7: этот белок связывает убиквитинированные грузы и белок LC3 мембраны аутофагосомы и вместе с грузом удаляется аутофагией. Кроме того, p62 содержит мотив KIR, сходный с мотивом ETGE белка NRF2. Через этот мотив p62 связывается с доменом Kelch белка KEAP1 — тем же доменом, с которым связывается NRF2. Поэтому при большом количестве p62 часть KEAP1 оказывается занята и не направляет NRF2 на разрушение. Кроме того, комплексы p62–KEAP1 удаляются аутофагией; по данным обзоров, именно аутофагия, а не протеасома — основной путь разрушения KEAP1.","Ген SQSTM1 содержит ARE, с которым связывается NRF2 в комплексе с малым Maf. Значит, NRF2 усиливает синтез p62, а p62 ослабляет KEAP1-зависимое разрушение NRF2. Чтобы определить знак петли, нужно проследить действие на исходный узел: рост NRF2 → больше p62 → меньше свободного KEAP1 → медленнее разрушение NRF2 → ещё больше NRF2. Звено торможения в цепи есть, но оно подавляет разрушение NRF2, поэтому итоговое действие на NRF2 положительное.","Повышенное содержание p62 не всегда означает усиленный синтез. При нарушении аутофагии p62 перестаёт удаляться и накапливается; в печени мышей с выключенным геном Atg7 это сопровождалось стабилизацией Nrf2 и усилением транскрипции его генов-мишеней. Чтобы различить синтез и удаление, используют прослеживание меченой популяции белка во времени, а необходимость p62 проверяют выключением гена и восстановлением его функции.","Эта петля — не единственное объяснение накопления NRF2. NRF2 разрушается и без KEAP1: киназа GSK3 фосфорилирует участок домена Neh6, и лигаза с β-TrCP убиквитинирует NRF2. При сравнении генотипов нужно указывать, какие пути разрушения в них сохранены."],"trap":["Высокое содержание p62 всегда означает, что NRF2 усилил транскрипцию гена SQSTM1.","p62 накапливается и при нарушенной аутофагии, когда он перестаёт удаляться. Синтез и удаление различают прослеживанием меченой популяции белка во времени."],"conditions":"Схема механизма, качественные состояния; шкалы условные. Ген SQSTM1 как мишень NRF2 и связывание p62 с Kelch через мотив KIR — Jain 2010 (клетки человека и мыши в культуре, по аннотации); конкуренция p62 с NRF2 и стабилизация Nrf2 при нарушении аутофагии — Komatsu 2010 (печень мышей с выключенным Atg7, клетки в культуре; по аннотации). Аутофагия как основной путь разрушения KEAP1 и петля KEAP1 ⊣ NRF2 → p62 ⊣ KEAP1 — обзор Liu 2022 (клетки Hepa-1c1c7 и HepG2 в цитируемых экспериментах). Путь GSK3–β-TrCP — обзор Ulasov 2022. Схемы методов — принцип, а не результаты эксперимента.","sources":["Liu2022","Komatsu2010","Jain2010","Ulasov2022"],"quiz":{"id":"S10-L19","rev":1,"question":"В условной системе увеличение p62 уменьшает KEAP1-зависимое разрушение NRF2, а NRF2 усиливает экспрессию SQSTM1. Какой тип связи образуют эти события?","options":[{"id":"S10-L19-1","text":"Положительную обратную связь, способную усиливать накопление NRF2.","correct":true,"feedback":"Усиление NRF2 повышает количество фактора, который ослабляет его разрушение; оба действия поддерживают исходное изменение."},{"id":"S10-L19-2","text":"Отрицательную обратную связь, поскольку в схеме есть этап торможения.","correct":false,"feedback":"Тип петли определяют по суммарному действию на исходный узел, а не по наличию отдельного тормозящего взаимодействия."},{"id":"S10-L19-3","text":"Только однонаправленный ответ: выход NRF2 не влияет на предшествующий регулятор.","correct":false,"feedback":"Через индукцию SQSTM1 выход возвращается к регуляции KEAP1, поэтому петля замыкается."}]},"widget":{"kind":"net","title":"","s":{"title":"p62 и положительная обратная связь NRF2","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Условие","opts":["Исходное состояние","Синтез p62 усилен","Аутофагия нарушена","Метод: меченая популяция","Метод: выключение и восстановление"]}],"W":560,"H":360,"NW":340,"NH":390,"lg":{"title":"Обозначения на схеме","act":"индукция гена (усиление транскрипции)","inh":"подавление: разрушение NRF2","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, этапы метода","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно, усилено или накоплено","пунктирная рамка — снижено или не работает","зелёная рамка — этап метода"]},"zones":[],"mem":[],"nodes":{"nrf2":{"p":[92,56,120,44],"t":"NRF2","n":[78,40,110,40]},"p62":{"p":[330,56,160,44],"t":"p62 (SQSTM1)","n":[258,40,130,40]},"keap":{"p":
