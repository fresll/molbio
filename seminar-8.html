<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 8 · Метаболические потоки, биосинтез и редокс-состояние — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --cyc:#2F5DA8; --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl.locked{opacity:.55;position:relative}
.ctrl.locked::before{content:attr(data-lock);font-size:12.5px;color:var(--muted)}
[data-g]:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
/* справочные карточки без расчёта: метка, схема, вопрос для самопроверки */
.info.refcard{border-style:dashed}
.info.refcard b.k{color:var(--muted)}
.info p.reftag{font-size:13px;color:var(--muted);margin:0 0 4px}
.info .refp p+p,.info .refp figure+p{margin-top:7px}
.info .refp b{color:var(--ink)}
.btn.refbtn{border-style:dashed}
.selfq{margin:8px 0 2px;border-top:1px dashed var(--line);padding-top:6px}
.selfq summary{cursor:pointer;font-weight:600;font-size:14px}
.selfq p{margin:6px 0 0}
.selfq details{margin-top:6px}
.gfig{margin:8px 0 2px;overflow-x:auto}
.gfig svg{display:block;width:100%;min-width:400px;max-width:560px;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:8px}
.gfig figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.gfig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
/* схемы в справочных карточках вопросов 1–3 (I8-01…I8-04) */
.gfig .gf-box{fill:var(--surface-2);stroke:var(--edge);stroke-width:1.2}
.gfig .gf-box.d{fill:var(--surface);stroke:var(--muted);stroke-dasharray:4 3}
.gfig .gf-box.a{fill:var(--on-soft);stroke:var(--on)}
.gfig .gf-box.m{fill:var(--mito-fill);stroke:var(--mito)}
.gfig .gf-bt{font-size:10.5px;text-anchor:middle;dominant-baseline:central}
.gfig .gf-ct{font-size:11px;font-weight:700;text-anchor:middle}
.gfig .gf-cs{font-size:10px;fill:var(--muted);text-anchor:middle}
.gfig .gf-ls{font-size:10px;fill:var(--muted)}
.gfig .gf-lt{font-size:11px;font-weight:700}
.gfig .gf-ar{fill:none;stroke:var(--edge);stroke-width:1.6}
.gfig .gf-ar.d{stroke:var(--muted);stroke-dasharray:4 3}
.gfig .gf-ah{fill:var(--edge)}
.gfig .gf-ah.d{fill:var(--muted)}
.gfig .gf-chip{fill:var(--surface);stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
.gfig .gf-chipt{font-size:10px;text-anchor:middle;dominant-baseline:central}
.gfig .gf-stick{stroke:var(--muted);stroke-width:1}
.gfig .gf-lg{font-size:10.5px;fill:var(--muted)}
.stub-g.clickable{cursor:help}
.stub-g.clickable:hover .stub{stroke:var(--edge)}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* семинар 8: метаболические потоки */
.meter{position:relative}
.meter .tk{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.55;border-radius:1px}
.fmrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 2px}
.fm{margin:0;display:grid;gap:3px;justify-items:start;color:var(--ink)}
.fm figcaption{font-size:13px;color:var(--muted)} .fm figcaption b{color:var(--ink)}
.fm-s{color:var(--ink)}
.medium{fill:var(--surface-2)}
.matrix{fill:var(--mito-fill);stroke:none;opacity:.55}
.dot-nadh{fill:var(--ink)} .dot-nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.dot-glc{fill:var(--on)} .dot-pyr{fill:var(--mtor)} .dot-lac{fill:var(--akt)}
.stub{fill:none;stroke:var(--off);stroke-width:1.6;stroke-dasharray:4 4}
.pool .nadh{fill:var(--ink)} .pool .nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.drugpill{fill:var(--bad)} .drugpill-t{fill:#fff;font-family:var(--f-body);font-weight:700;text-anchor:middle;dominant-baseline:central}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.res-grid{display:grid;gap:6px}

.meter{overflow:visible} .meter i{border-radius:5px}
.road{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
.halo{fill:none;stroke:var(--cyto);stroke-width:7}
.pool-fr{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.noxbox{fill:var(--good);stroke:none}
.medpill{fill:var(--surface);stroke:var(--on);stroke-width:2}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.mm .mt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mm small{font-size:13px;line-height:1.2;color:var(--ink)}
.mm .v{font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.legend .sw.line{display:inline-block}

.btn[hidden]{display:none!important}
.scene.wip .side > :not(.cap){display:none!important}
.scene.wip .cap .why{display:none}
.fm-s [class^="bond-"]{vector-effect:non-scaling-stroke;stroke-width:1.5px!important}

/* семинар 8: компактнее правая колонка (проектор 1280×720) */
.scene .ctrl{gap:8px} .scene input[type=range]{height:22px} .scene .slider{gap:0}
#capbox1a{order:-1} #poe1a{order:-2}
.tgrid .switch{font-size:14.5px;gap:8px}

/* семинар 8, вопрос 2: цикл трикарбоновых кислот */
.lv-tr{fill:var(--line)} .lv-f{fill:var(--mtor);transition:width .35s} .lv-f.fad{fill:var(--tfeb)}
.lv-tk{stroke:var(--ink);stroke-width:1.6;opacity:.75}
.dot-exit{fill:var(--carn)} .dot-cyc{fill:var(--cyc)} .dot-gln{fill:var(--aa)} .dot-fad{fill:var(--tfeb)}
.isr{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:end;margin-top:6px}
.isr > b{font-size:13px;padding-bottom:18px}
.isc{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.ic{display:grid;justify-items:center;gap:1px;min-width:34px}
.ic i{display:block;width:26px;background:var(--mtor);border-radius:3px 3px 0 0}
.ic i.z{background:var(--off)}
.ic em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.ic span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
#capbox2a{order:-1} #poe2a{order:-2}

/* вопрос 3: шкалы баланса, нуклеосома, метки */
.gbar{fill:var(--line)} .gfill{fill:var(--mtor);transition:width .35s} .gref{stroke:var(--ink);stroke-width:2;opacity:.6}
.dna{fill:none;stroke:var(--tfeb);stroke-width:7;opacity:.55} .octa{fill:var(--surface);stroke:var(--off-ink);stroke-width:2}
.tail{fill:none;stroke:var(--off-ink);stroke-width:5;stroke-linecap:round}
.ks{fill:var(--surface);stroke:var(--off-ink);stroke-width:2}
.k9c{fill:var(--line)} .mac{fill:var(--on)} .mme{fill:var(--cyc)} :root[data-theme="dark"] .mme{fill:#3E6FC0}
.cpg{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.edge.rem{stroke-dasharray:5 4} .edge.link{stroke-dasharray:2 4;opacity:.55}
.mono{font-family:var(--f-mono)}

/* вопрос 4: мембраны, АФК, пероксиредоксин */
.imm{stroke:var(--mito);stroke-width:4;opacity:.7} .pm{stroke:var(--off-ink);stroke-width:4;opacity:.6}
.nadhfill{fill:#2D3A4F} :root[data-theme="dark"] .nadhfill{fill:#8FA3C4}
.ros{fill:var(--rfp);fill-opacity:.25;stroke:var(--rfp);stroke-width:2;transition:r .3s}
.h2o2{fill:var(--on-soft);stroke:var(--on);stroke-width:2.2;transition:r .3s} .h2o2.hot{fill:var(--rfp);fill-opacity:.35;stroke:var(--bad)}
.prx-r{fill:var(--good)} .prx-s{fill:var(--on)} .prx-h{fill:var(--bad)}
.edge.ret{stroke:var(--bad);stroke-width:2.5}

/* v1.2 · вопрос 4: схематическое распределение форм пероксиредоксинов (не гель) */
.fd-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:2px 0 6px}
.fd-leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fd-row{margin:4px 0 8px}
.fd-lab{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.fd-pair{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.fd-pair small{font-size:11.5px;color:var(--muted)}
.fd-bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.fd-bar i{display:block;height:100%}
.fd-v{grid-column:2;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.fd-leg .prx-r,.fd-bar .prx-r{background:var(--good)} .fd-leg .prx-s,.fd-bar .prx-s{background:var(--on)} .fd-leg .prx-h,.fd-bar .prx-h{background:var(--bad)}
.fd-br{width:100%;max-width:440px;height:auto;display:block;margin-top:4px}

/* v1.2 · сценарий (аудит v1.1, V1/V4/V5): навигация и показатели «до → после → эталон» закреплены внизу панели */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.poe{display:flex;flex-direction:column}
.poe .poe-body{min-height:0}
.poe .poe-foot{flex:none;border-top:1px solid color-mix(in srgb,var(--on) 35%,transparent);margin-top:10px;padding-top:8px;background:var(--on-soft)}
@media (min-width:1001px){ .poe{max-height:calc(var(--avail,calc(100vh - 150px)) - 6px)} .poe .poe-body{overflow-y:auto;flex:1 1 auto;padding-right:4px} }
@media (max-width:1000px){ .poe .nav{position:sticky;bottom:0;z-index:2;background:var(--on-soft);padding:6px 0;margin-bottom:-4px;border-top:1px solid color-mix(in srgb,var(--on) 35%,transparent)} }
.poe .poe-when{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.poe .poe-res{font-size:16px;font-weight:700;margin:10px 0 0;padding:6px 10px;border-radius:8px;outline-offset:2px}
.poe .poe-res.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-left:4px solid var(--good)}
.poe .poe-res.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-left:4px solid var(--bad)}
.poe .opt.right .L::after{content:" ✓";color:var(--good)}
.poe .opt.wrongpick .L::after{content:" ✗";color:var(--bad)}
.poe .ex-more{margin-top:6px;font-size:15px}
.poe .ex-more summary{cursor:pointer;color:var(--on);font-weight:600}
.poe .ex-more p{margin:6px 0 0}
.poe .nav{margin-top:8px;align-items:center}
.poe .poe-step{font-family:var(--f-mono);font-size:13px;color:var(--muted);align-self:center}
.cmp{display:grid;gap:2px;font-size:13.5px}
.cmp-h,.cmp-r{display:grid;grid-template-columns:minmax(0,1.9fr) .8fr .25fr .8fr .8fr;gap:6px;align-items:baseline}
.cmp-h{font-size:12px;color:var(--muted);font-weight:600}
.cmp-n{overflow:hidden;text-overflow:ellipsis}
.cmp-a{text-align:center;font-weight:700}
.cmp-now{font-weight:700}
.cmp-ref{color:var(--muted)}

.poe.done .q{font-size:15.5px;margin:2px 0 6px}
.poe.done .poe-when{display:none}
.poe.done .opts{gap:4px}
.poe.done .opt{font-size:14px;padding:5px 10px}
.poe .poe-foot .poe-res{margin:0 0 6px;font-size:15px;padding:5px 9px}
.cmp{font-size:12.5px}

.poe .nav{flex:none}
.poe .ex-k{border-left:3px solid var(--on);padding-left:10px}
.cmp-note{font-size:11.5px;color:var(--muted);margin:3px 0 0}
.cmp2 .cmp-h,.cmp2 .cmp-r{grid-template-columns:minmax(0,1.9fr) 1fr 1fr}
.poe .poe-foot:empty{display:none}

едпросмотра демонстрации не работают.", "poe_step": "Шаг {i} из {n}", "poe_ans": "Почему:", "poe_show": "Показать на схеме", "poe_pick_first": "Сначала выберите ответ", "poe_your": "Почему ваш ответ неверен:", "poe_score": "Верно с первого раза: {c} из {n}.", "poe_prev": "← Назад", "poe_next": "Дальше →", "poe_end": "Сценарий закончен.", "poe_exit": "Выйти", "poe_last": "Последний шаг", "poe_locked": "До показа ответа условия опыта изменить нельзя.", "svg_aria": "Схема клетки; для ферментов и молекул доступна справка (Tab — выбрать, Enter — открыть)", "legend_t": "Условные обозначения", "lg_on": "жёлтый — звено активно", "lg_off": "серый — поток мал или звено неактивно", "lg_boxinh": "пунктирная рамка — звено заторможено (препарат или нехватка NAD⁺)", "lg_act": "сплошная стрелка — поток вещества; толщина и число частиц — величина потока; тёмные и светлые частицы — восстановленная и окисленная формы переносчика", "lg_inh": "тормозит", "lg_idle": "бледная стрелка — потока сейчас нет", "lg_dots": "частицы: жёлтая — глюкоза, бирюзовая — пируват (в вопросе 2 также ацетил-CoA), оранжевая — лактат", "lg_nadh": "тёмная частица — NADH (восстановленная форма)", "lg_nad": "светлая частица — NAD⁺ (окисленная форма)", "lg_stub": "серый пунктир — путь, который модель здесь не рассчитывает; щелчок по серой подписи открывает справку", "lg_click": "щёлкните по ферменту или молекуле, чтобы открыть справку; с клавиатуры: Tab — выбрать, Enter — открыть", "teacher_t": "Для преподавателя: проведение занятия, упрощения модели и источники", "src_t_st": "Источники", "teacher_1": "На каждый вопрос отводится 5–7 минут на базовом уровне, затем 8–10 минут на продвинутом. В режиме «Сценарий» на каждом шаге задаётся вопрос: студенты выбирают ответ, после чего нажимают кнопку «Показать на схеме». Пока ответ не показан, ползунки недоступны для изменения. Клавиши 1–4 переключают вопросы, клавиша B — уровень. Щелчок по ферменту или молекуле (или Tab и Enter) открывает справку. Вкладки согласованы между собой: доля NADH в матриксе и действие олигомицина и FCCP одинаковы на вкладках 1 и 4, а содержание α-КГ и сукцината при действии ингибитора GLS и при потере SDH одинаковы на вкладках 2 и 3.", "teacher_2": "Вопрос 1. Все величины в модели относительные («учебная модель»): полоса 100 % соответствует условной единице потока, а шкала NADH цитоплазмы и матрикса задана от 0 до 1 и не является измеренной долей. Модель показывает установившееся состояние; время и скорость выхода на него не рассчитываются. В опорном состоянии делящейся клетки сигнал к делению составляет 80 % (деление — около 80 % шкалы), поэтому на полосе видно и ускорение, и замедление. Отношение свободных NAD⁺/NADH в цитоплазме клеток печени крысы после кормления составляет около 725 (Williamson 1967). В клетках Neuro-2a и C6 в среде с глюкозой генетически кодируемый сенсор Peredox даёт значение около 70–130 (Hung 2011), а набор для измерения суммарного NAD⁺/NADH даёт другие значения и не различает компартменты (Luengo 2021). Упрощение: в модели реакция ЛДГ близка к равновесию, поэтому отношение лактат/пируват отражает долю NADH в цитоплазме; в клетках Neuro-2a и C6 в среде с глюкозой это равновесие, по-видимому, не достигается (Hung 2011). Шкала кислорода учебная: доступность O₂ задана как p/(p + 0,5 %). При 0,5 % O₂ дыхание в модели снижается примерно вдвое, как у клеток в опыте Papandreou 2006 (24 ч при 0,5 % O₂ — около −50 %). Прочие субстраты окисления (глутамин, жирные кислоты) включены в модель одним слагаемым: без них нельзя показать, что FCCP повышает потребление O₂. ATP рассчитывается явно: 1 ATP на пируват в гликолизе и 2,5 ATP на NADH-эквивалент в дыхательной цепи, если цепь сопряжена (Hinkle 2005; Mookerjee 2017). Полоса ATP условная: при дефиците ATP гликолиз ускоряется не более чем в 1,6 раза, а ATP ограничивает деление, только когда его уровень ниже примерно 15 % шкалы. Допущения, заданные числами, а не полученные расчётом: цитоплазматический путь синтеза аспартата (MDH1–GOT1) учитывается при наличии пирувата в среде или LbNOX и зависит от доли NADH в цитоплазме (одно правило для обоих случаев; Sullivan 2015; Birsoy 2015); нижний предел доступности аспартата при аспартате в среде (60 %); приоритет поступления пирувата в митохондрии перед ЛДГ (поэтому при положении «максимум» ползунка дихлорацетата выход лактата равен нулю); фиксированная ёмкость PDH и челноков (поэтому FCCP почти не снижает выход лактата). Дозы препаратов на ползунках не указаны числом, поскольку в опытах на культурах клеток они различаются (условия из статей приведены в справке). Среда содержит уридин: без него при блокаде дыхательной цепи снижается синтез пиримидинов, а это другой механизм. Боковые пути гликолиза (пентозофосфатный путь и синтез серина) показаны серыми заглушками и не рассчитываются; они рассматриваются в вопросе 4. Вопрос 2. Числа модели относительные: 1,00 — уровень или поток эталонной делящейся клетки при 2 мМ глутамина; единицы потока те же, что в вопросе 1; время не рассчитывается. Условные параметры (не из статей): Km глутаминазы 0,5 мМ; множитель 0,10 в формулах притока через GLS и ПК при их подавлении; ёмкость ПК — не выше шести эталонных значений; обратная связь ПК по уровню малата/ОАА; возврат половины ОАА из экспортированного цитрата; коэффициенты оттока на синтез (цитрат, α-КГ, аспартат) и на малатный фермент, а также условный сток сукцината (не на синтез гема); зависимость восстановительного карбоксилирования от доли NADH в матриксе; множитель доступности аспартата (константа 0,2 от эталона); приток ацетил-CoA из прочих источников; насыщение цитратсинтазы по ОАА; доля меченого пирувата 85 % при ¹³C-глюкозе. Две линии клеток различаются долей притока через GLS и ПК, а суммарный приток у них одинаков. Полный перечень упрощений приведён в справке «Что упрощено в модели (вопрос 2)». Вопрос 3. Значение 1,00 соответствует эталонным условиям: глюкоза 10 мМ, метионин 100 мкМ, глутамин 2 мМ. Уровни α-КГ и сукцината берутся из модели цикла вопроса 2; связь «цитрат цикла → ацетил-CoA ядра» отключена, поскольку прямых данных о ней нет. Значения Km и Ki ферментов взяты из статей; эталонные уровни α-КГ, сукцината и фумарата в ядре, уровень R-2-HG при IDH1 R132H и постоянные времени — допущения. Уровень метки — условная доля сайтов в популяции (для K9: Ac на участках активного хроматина, me3 в гетерохроматине, сумма не превышает 1); изменение метки не означает изменения экспрессии конкретного гена. Вопрос 4. Доля NADH в матриксе и действие олигомицина и FCCP взяты из модели вопроса 1. Образование супероксида задано крутой функцией доли NADH и протонного потенциала; пероксиредоксин, сульфиредоксин, индекс текущей окислительной нагрузки, PARP1, PKM2 и реперфузия заданы условными функциями; накопление повреждений и их репарация не рассчитываются, формы SO₂H и SO₃H объединены (перечень приведён в справке «Что упрощено в модели» на вкладке 4). Значения H₂O₂ относительные; абсолютные концентрации не показаны.", "teacher_3": "Поправки к распространённым схемам. Эффект Варбурга не означает нарушения дыхания: в культивируемых делящихся клетках митохондриальное дыхание сохранено и необходимо для деления (Sullivan 2015; Birsoy 2015). В первичных опухолях мыши поток через ЦТК ниже, чем в нормальных тканях (Bartman 2023), поэтому вклад митохондрий зависит от объекта. Причина образования лактата в присутствии O₂ обсуждается. По Luengo 2021, потребность в NAD⁺ превышает потребность в ATP (это интерпретация, а не прямое измерение); по Wang 2022, челноки NADH насыщаются, при этом лактат не коррелирует со скоростью деления; в обзоре Li 2025 сделан вывод, что ни одно объяснение не охватывает всех данных. В опытах Luengo LbNOX не снижал выход лактата, а повышал выход пирувата; в работе Titov 2016 на клетках HeLa LbNOX не менял ни потребления глюкозы, ни выхода лактата. Метформин не «восстанавливает окислительный метаболизм» клеток: в опытах Birsoy 2015 родственный ему фенформин ингибировал комплекс I. Дихлорацетат in vitro применяют в концентрациях от 0,5 мМ (Bonnet 2007), тогда как его пиковая концентрация в плазме человека составляет около 0,15 мМ (Koltai 2024). В испытании фазы III у 34 детей с недостаточностью PDC первичная конечная точка не достигнута; при более длительном лечении сообщают о снижении лактата и лучшем исходе (Stacpoole 2026). Лактат не является «отходом»: у мышей натощак оборот лактата в крови превышает оборот глюкозы (Hui 2017). Вопрос 2. Поправки к распространённым формулировкам. ПК — анаплеротический фермент (анаплероз), а не катаплеротический. Утверждение, что ингибиторы комплекса I обращают направление цикла, неточно: усиливается восстановительное карбоксилирование α-КГ на фоне ослабленного окислительного пути (Mullen 2014; Gaude 2018), а чистый поток по одной метке M+5 не оценивают (Fan 2013; Buescher 2015). Метформин в культуре ингибирует комплекс I (а не восстанавливает окислительный метаболизм) в концентрациях выше плазменных (Wheaton 2014; Gui 2016). Формулировка «CB-839 в клинических испытаниях» устарела: в испытании CANTATA первичная конечная точка не достигнута (Tannir 2022), а результат ENTRATA скромный (Lee 2022). Утверждение «глюкагон и глюкокортикоиды повышают ПК» опирается на неоднозначные данные: у коров глюкагон повышал уровень мРНК ПК, но не количество белка и не активность, а дексаметазон не менял экспрессию (обзор Jitrapakdee 2008). Вопрос 3. Разные HAT ацетилируют разные сайты: H3K9ac — GCN5/PCAF, H3K18ac и H3K27ac — CBP/p300, H4K16ac — MOF. SAH образуется при переносе метильной группы, а не при «деметилировании SAM». Метку H3K9me3 вводят SUV39H1/2, а H3K9me2 — в основном G9a/GLP. JmjC-деметилазы специфичны: H3K4me3 — KDM5, H3K27me3 — KDM6, H3K9me3 и H3K36me3 — KDM4. TDG вырезает 5fC и 5caC, но не 5hmC. R-2-HG — слабый ингибитор (Ki в миллимолярном диапазоне); «псевдогипоксию» вызывают сукцинат и фумарат, а для R-2-HG данные противоречивы. При мутантной IDH дифференцировка блокируется, но перепрограммирование меток при этом происходит. Онкометаболиты связаны с разными опухолями: R-2-HG — с глиомами и ОМЛ, сукцинат — с SDH-дефицитными параганглиомами и феохромоцитомами, фумарат — с FH-дефицитными опухолями. Вопрос 4. Отношение свободных NADH/NAD⁺ в цитоплазме составляет около 1/700, а не 10⁻³–10⁻⁴. Сульфиновую форму пероксиредоксина восстанавливает сульфиредоксин, а необратимо окисленной является сульфоновая форма (Biteau 2003; Woo 2003); в плане главы 8 сказано иначе. АФК не всегда вредны: H₂O₂ в малых количествах служит сигнальной молекулой. Механизм, которым PARP1 при повреждении ДНК подавляет гликолиз, обсуждается (Andrabi 2014). В клинических испытаниях антиоксидантные добавки не снижали смертность (Bjelakovic 2007). Парадокс SDH: потеря SDH (вопрос 2) повышает содержание сукцината, а диметилмалонат перед ишемией (вопрос 4) уменьшает его накопление. Различаются длительность, условия (идёт ли дыхание) и момент вмешательства; полезно разобрать ситуацию по фазам «до ишемии — ишемия — реперфузия». Источник ишемического сукцината обсуждается (Chouchani 2014; Zhang 2018).", "s1_glc": "глюкоза", "s1_pyr": "пируват", "s1_lac": "лактат", "s1_gly": "Гликолиз", "s1_ldh": "ЛДГ", "s1_pool": "NADH цитоплазмы", "s1_matrix": "NADH матрикса", "s1_shuttle_l": "челноки NADH", "s1_shuttle": "челнок", "s1_asp": "аспартат", "s1_cI": "комплекс I", "s1_c34": "III–IV", "s1_atps": "ATP-синтаза", "s1_stub_ppp": "ПФП", "s1_stub_ser": "серин", "s1_rx_note": "R — остаток NAD(H), не показан", "s1_rx_note2": "Пируват + NADH + H⁺ ⇄ лактат + NAD⁺", "s1_pyrm_pill": "+ пируват", "s1_aspm_pill": "+ аспартат", "s1_how": "Как измеряют", "s1_lim": "Что упрощено", "drug_oligo": "олигомицин", "drug_pier": "пиерицидин", "drug_fccp": "FCCP", "drug_dca": "дихлорацетат", "drug_oxa": "оксамат", "fn_glc": "β-D-глюкоза", "fn_pyr": "пируват (1−)", "fn_lac": "L-лактат", "fn_nad": "NAD⁺", "fn_nadh": "NADH", "fn_nad_c": "NAD⁺: реакционный фрагмент", "fn_nadh_c": "NADH: реакционный фрагмент", "fn_asp": "L-аспартат (1−)", "fn_oxa": "оксамат", "fn_dca": "дихлорацетат", "fn_fccp": "FCCP", "s1_o2": "Кислород в среде", "s1_gr": "Сигнал к делению", "s1_atp": "Дополнительное потребление ATP", "s1_g_drugs": "Препараты", "s1_oligo": "олигомицин", "s1_fccp": "FCCP (малая доза)", "s1_pier": "пиерицидин", "s1_oxa": "оксамат", "s1_dca": "Дихлорацетат (тормозит PDK)", "dca_0": "нет", "dca_1": "доза", "dca_2": "максимум (мысленный опыт)", "s1_g_other": "Фермент и среда", "s1_nox": "LbNOX в цитоплазме", "s1_pyrm": "пируват в среде", "s1_aspm": "аспартат в среде", "s1_r_glc": "Поглощение глюкозы", "s1_r_lac": "Выход лактата", "s1_r_pyrx": "Выход пирувата", "s1_pyr_in": "из среды", "s1_r_mito": "Поток пирувата через PDH", "s1_r_o2": "Митохондриальное потребление O₂", "s1_r_atp": "Условный индекс ATP", "s1_r_nc": "Условная доля NADH в цитоплазме, 0–1", "s1_r_nm": "Условная доля NADH в матриксе, 0–1", "s1_r_asp": "Доступность аспартата (индекс)", "s1_r_div": "Деление (индекс модели)", "s1b_ref": "Серая метка на полосе — значение для клетки без сигнала к делению при 21 % O₂. Величины относительные (учебная модель); 100 % потока — условная единица. Показано установившееся состояние.", "s1a_ref": "Серая метка на полосе — контроль: та же клетка при тех же положениях ползунков, но без препаратов, LbNOX и добавок в среде. Величины относительные (учебная модель). Показано установившееся состояние.", "s1a_ref0": "Серая метка на полосе — значение для клетки без сигнала к делению при 21 % O₂. Если включить препарат или добавку, метка покажет контроль — ту же клетку без них. Величины относительные (учебная модель). Показано установившееся состояние.", "s1_curve_t": "Рост популяции за 5 суток: число удвоений (учебная модель; 100 % деления = 1 удвоение в сутки)", "s1_curve_ctrl": "контроль (без препаратов и добавок)", "s1_curve_now": "сейчас", "s1_days": "суток", "cmp_up": "выше", "cmp_dn": "ниже", "cmpn_glc": "поглощение глюкозы", "cmpn_lac": "выход лактата", "cmpn_pyx": "выход пирувата", "cmpn_mito": "поток пирувата через PDH", "cmpn_o2": "потребление O₂", "cmpn_atp": "условный индекс ATP", "cmpn_nc": "условная доля NADH в цитоплазме", "cmpn_nm": "условная доля NADH в матриксе", "cmpn_asp": "доступность аспартата", "cmpn_div": "скорость деления", "s1a_cmp": "Сравнение с контролем: {list}.", "s1a_cmp_rest": "Остальные показатели близки к контролю.", "s1a_cmp_none": "Сравнение с контролем: все показатели близки к контролю.", "s1_c_quiet": "Лактат почти не выходит из клетки. При малом потоке глюкозы челноки передают электроны NADH в митохондрии, а PDH окисляет пируват.", "s1_c_quiet_z": "При малом потоке глюкозы челноки переносят в митохондрии электроны почти всего NADH цитоплазмы. Поэтому ЛДГ окисляет лишь небольшую часть NADH, и путь окисления NADH через образование лактата почти не используется.", "s1_c_work": "Расход ATP высокий. Образующийся ADP поддерживает синтез ATP: протоны быстро возвращаются в матрикс через ATP-синтазу, и дыхательная цепь быстро окисляет NADH матрикса. Лактат почти не выходит из клетки.", "s1_c_work_z": "При гидролизе ATP образуется ADP. При сохранённом сопряжении ADP поддерживает синтез ATP: протоны быстрее возвращаются в матрикс через ATP-синтазу, и вместе с этим ускоряются дыхание и окисление NADH (Brand 2011). Ползунок задаёт дополнительную нагрузку; базовый расход ATP сохраняется и при 0 %.", "s1_c_hypox": "При недостатке кислорода дыхание снижено, и доля NADH в матриксе выше, чем при 21 % O₂. Гликолиз ускорен, ЛДГ регенерирует NAD⁺ в цитоплазме, и лактат выходит из клетки. Это эффект Пастера.", "s1_c_hypox_z": "При низком содержании O₂ дыхание образует меньше ATP, и гликолиз ускоряется. Для ускоренного гликолиза необходим NAD⁺, который регенерирует ЛДГ. HIF-1 активирует транскрипцию гена GLUT1 (в фибробластах Rat1: Chen 2001) и через PDK1 снижает дыхание. В фибробластах за 24 ч при 0,5 % O₂ потребление O₂ снизилось примерно вдвое, и это снижение зависело от HIF-1 (Kim 2006; Papandreou 2006).", "s1_c_growth": "Сигнал к делению ускоряет гликолиз. Челноки переносят электроны не всего NADH цитоплазмы, а PDH окисляет не весь пируват. ЛДГ окисляет оставшийся NADH, поэтому лактат выходит из клетки и в присутствии O₂. Потребление O₂ остаётся около уровня покоящейся клетки или превышает его.", "s1_c_growth_z": "В активированных T-клетках скорость гликолиза выше той, которая необходима для удовлетворения потребности в ATP (Frauwirth 2002). При этом митохондриальное дыхание сохраняется, а потребление O₂ увеличивается (Wang 2011). Причины образования лактата в присутствии O₂ обсуждаются. Авторы работы Luengo 2021 связывают его образование с тем, что потребность в NAD⁺ превышает потребность в ATP, а авторы работы Wang 2022 — с насыщением челноков.", "s1_c_both": "Сигнал к делению действует одновременно с недостатком кислорода. Гликолиз ускорен, выход лактата увеличен, а доля NADH в матриксе выше, чем при 21 % O₂.", "s1_c_both_z": "Эффекты двух воздействий складываются: гликолиз ускорен, а при низком O₂ дыхательная цепь принимает электроны медленнее. ЛДГ регенерирует NAD⁺ в цитоплазме.", "s1_c_mid": "Промежуточное состояние: лактат выходит из клетки. Сравните полосы с серыми метками: какие показатели увеличились, а какие снизились?", "s1_c_mid_z": "Лактат выходит из клетки, когда скорость образования NADH в цитоплазме превышает скорость переноса его восстановительных эквивалентов челноками, а скорость образования пирувата — скорость его окисления комплексом PDH. Найдите на схеме звено, ограничивающее поток: поступление пирувата в митохондрии, челноки или дыхательную цепь.", "s1b_take": "Лактат образуется и при достаточном содержании кислорода, и сам по себе этот факт не указывает на состояние дыхательной цепи. При сигнале к делению гликолиз ускоряется и выход лактата увеличивается, а дыхание сохраняется. При гипоксии дыхание ограничено недостатком кислорода. Чтобы различить причины высокого выхода лактата, нужны дополнительные измерения, например потребления O₂ до и после возврата кислорода. Ответвления гликолиза в биосинтез (пентозофосфатный путь, синтез серина) описаны в справочной карточке «Ответвления гликолиза»; в расчёт они не входят и не показывают, что биосинтез — единственная причина аэробного гликолиза.", "s1a_c_oligo": "Олигомицин блокирует ATP-синтазу. Дыхание замедляется, но сохраняется за счёт утечки протонов. Митохондриальный синтез ATP подавлен; ATP образуется в гликолизе. Условный индекс ATP снижается.", "s1a_c_oligo_z": "Скорость дыхания определяется не только доступностью кислорода, но и скоростью возврата протонов в матрикс, которая зависит от расхода ATP, утечки протонов и действия разобщителя. Чем медленнее протоны возвращаются в матрикс, тем медленнее дыхательная цепь окисляет NADH матрикса.", "s1a_c_fccp": "FCCP в малой дозе переносит протоны в матрикс в обход ATP-синтазы. Дыхательная цепь может быстрее переносить электроны и окислять NADH матрикса, но в расчёте на каждый электрон образуется меньше ATP.", "s1a_c_fccp_z": "Этот опыт противоположен опыту с олигомицином: чем быстрее протоны возвращаются в матрикс, тем выше предельная скорость переноса электронов по цепи. Достигнет ли дыхание этого предела, зависит от доступности кислорода и поступления электронов. При этом в расчёте на каждый электрон образуется меньше ATP.", "s1a_c_pier": "Пиерицидин блокирует комплекс I, и NADH в матриксе почти не окисляется (в модели сохраняется 8 % активности комплекса I). От NAD⁺ матрикса зависят PDH, челноки и синтез аспартата.", "s1a_c_pier_z": "При блокаде комплекса I деление ограничено доступностью аспартата, необходимого для синтеза нуклеотидов и белков; образование аспартата зависит от NAD⁺ (Sullivan 2015; Birsoy 2015). Остаточное дыхание в модели задано одним коэффициентом: источники электронов и пути в обход комплекса I отдельно не рассчитываются.", "s1a_c_oxa": "Оксамат — аналог пирувата и конкурентный ингибитор ЛДГ (в модели остаётся около 45 % её активности).", "s1a_oxa_act": "ЛДГ регенерирует меньше NAD⁺ в цитоплазме.", "s1a_oxa_flat": "В этом состоянии ингибитор почти не меняет показатели на полосах. Если ускорить гликолиз, например сигналом к делению, разница станет заметнее.", "s1a_oxa_pyr": "Часть пирувата, не превращённого в лактат, выходит из клетки.", "s1a_c_oxa_z": "Опыт с ингибитором показывает, насколько клетка зависит от реакции ЛДГ как пути окисления NADH цитоплазмы. Клетки с преобладанием окислительного фосфорилирования менее чувствительны к ингибитору ЛДГ GNE-140 (Boudreau 2016). Оксамат действует в миллимолярных концентрациях, поэтому возможны побочные эффекты.", "s1a_c_nox": "LbNOX окисляет NADH цитоплазмы кислородом с образованием воды без участия ЛДГ и челноков. Показатель «Митохондриальное потребление O₂» отражает только потребление O₂ дыхательной цепью; кислород, потреблённый LbNOX, в нём не учитывается.", "s1a_c_nox_z": "Так проверяют, ограничивает ли дефицит NAD⁺ в цитоплазме клеточные процессы. В опытах Luengo 2021 LbNOX не снижал выход лактата, но повышал выход пирувата; в опытах Titov 2016 на клетках HeLa он не изменял ни потребления глюкозы, ни выхода лактата.", "s1a_nox_flat": "Доля NADH в цитоплазме в контроле невысока, поэтому LbNOX мало меняет показатели на полосах.", "s1a_pyr_flat": "Доля NADH в цитоплазме в контроле невысока, а доступность аспартата уже составляет около 70 % шкалы или больше. Поэтому пируват в среде мало меняет показатели на полосах.", "s1a_c_pyr": "Пируват из среды служит акцептором электронов: ЛДГ восстанавливает его до лактата и при этом окисляет NADH цитоплазмы без участия митохондрий.", "s1a_c_pyr_z": "При блокаде дыхательной цепи восстановление пирувата до лактата обеспечивает регенерацию NAD⁺ в цитоплазме, и синтез аспартата возобновляется (Sullivan 2015; Birsoy 2015). Допущение модели: пируват в среде задаёт нижний предел доступности аспартата — 70 % шкалы.", "s1a_c_asp": "Аспартат, поступающий из среды, дополняет тот, который синтезируется в клетке при участии дыхательной цепи. В модели добавление аспартата задаёт нижний предел его доступности — 60 % шкалы. Если доступность аспартата за счёт его синтеза ниже этого предела, например при блокаде комплекса I, значение на полосе повышается до этого предела.", "s1a_c_asp_z": "Синтез аспартата зависит от отношения NAD⁺/NADH. В опытах Birsoy 2015 на клетках Jurkat аспартат (10 мМ) при блокаде дыхательной цепи восстанавливал деление лишь частично и не возвращал NAD⁺/NADH к исходному уровню. Поэтому в модели аспартат не меняет ни долю NADH в цитоплазме, ни дыхание. Клетки Jurkat плохо захватывают аспартат из среды, поскольку в них нет переносчика SLC1A3; поэтому в опытах Birsoy его вносили в высокой концентрации.", "s1a_c_pier_pyr": "Комплекс I заблокирован, в среде есть пируват. ЛДГ восстанавливает пируват до лактата и окисляет NADH цитоплазмы; регенерированный NAD⁺ позволяет MDH1 и GOT1 синтезировать аспартат. Потребление O₂ остаётся низким.", "s1a_c_pier_pyr_z": "Аспартат используется для синтеза нуклеотидов и белков. При блокаде дыхательной цепи синтез аспартата в цитоплазме восстанавливается, если есть акцептор электронов для регенерации NAD⁺ (Sullivan 2015; Birsoy 2015). В модели то же правило действует для LbNOX; в присутствии оксамата пируват деление не восстанавливает.", "s1a_c_pier_nox": "Комплекс I заблокирован, в цитоплазме экспрессирован LbNOX. Он окисляет NADH кислородом без участия ЛДГ; регенерированный NAD⁺ позволяет MDH1 и GOT1 синтезировать аспартат. Митохондриальное потребление O₂ остаётся низким.", "s1a_c_pier_nox_z": "В опытах Titov 2016 экспрессия LbNOX в цитоплазме восстанавливала деление клеток HeLa при блокаде дыхательной цепи. В модели LbNOX и пируват действуют по одному правилу — через долю NADH в цитоплазме. Здесь эта доля снижается меньше, чем при добавлении пирувата, поэтому деление восстанавливается частично.", "s1a_c_pier_asp": "Комплекс I заблокирован, в среде есть аспартат. Доступность аспартата поднимается до нижнего предела модели (60 % шкалы), а доля NADH в цитоплазме и потребление O₂ остаются такими же, как при одном пиерицидине.", "s1a_c_pier_asp_z": "В опытах Birsoy 2015 аспартат (10 мМ) при блокаде дыхательной цепи восстанавливал деление клеток Jurkat лишь частично и не возвращал NAD⁺/NADH к исходному уровню. Поэтому в модели аспартат в среде не меняет долю NADH в цитоплазме.", "s1a_c_oligo_fccp": "Олигомицин блокирует ATP-синтазу, а FCCP переносит протоны в матрикс в обход неё. Электроны по цепи переносятся быстрее, чем при одном олигомицине, и доля NADH в матриксе ниже. Митохондриальный синтез ATP почти отсутствует.", "s1a_c_oligo_fccp_z": "В опытах Luengo 2021 FCCP восстанавливал отношение NAD⁺/NADH и деление клеток, обработанных олигомицином и ингибитором PDK. В модели разобщитель так же ускоряет перенос электронов по цепи, когда ATP-синтаза заблокирована олигомицином.", "s1a_c_dca1": "Дихлорацетат ингибирует PDK, поэтому в модели пропускная способность PDH в 1,8 раза выше, чем в контроле.", "s1a_dca_up": "В митохондрии входит больше пирувата.", "s1a_dca_flat": "У этой клетки вход пирувата в митохондрии почти не изменился.", "s1a_c_dca1_z": "Дихлорацетат не меняет скорость возврата протонов в матрикс, которая задана потреблением ATP и утечкой протонов, поэтому предельная скорость дыхательной цепи остаётся прежней. Когда поступление пирувата в митохондрии растёт, NADH сначала образуется быстрее, чем цепь его окисляет, и доля NADH повышается, пока не установится новое равновесие с более высокой долей NADH. В опытах Luengo 2021 ингибитор PDK AZD7545 снижал суммарное отношение NAD⁺/NADH (без разделения на цитоплазму и матрикс), а деление замедлялось.", "s1a_c_dca2": "Мысленный опыт: пропускная способность PDH искусственно увеличена втрое. Это режим учебной модели, а не действие определённой дозы дихлорацетата.", "s1a_c_dca2_z": "Сравните долю NADH в цитоплазме, поток гликолиза и деление. Авторы работы Luengo 2021 связывают аэробный гликолиз с потребностью в регенерации NAD⁺; авторы работы Wang 2022 показывают ограниченную пропускную способность челноков. Эти ограничения могут действовать совместно; какое звено лимитирует поток, зависит от клеток и условий.", "s1a_c_multi": "Включено несколько воздействий: {list}.", "s1a_c_multi_z": "Итог зависит от того, какое звено ограничивает поток в этом состоянии: вход пирувата в митохондрии, челноки, цепь или доступность аспартата.", "s1a_take": "Образование лактата в присутствии O₂ показывает, что часть NADH цитоплазмы окисляется ЛДГ, а не в митохондриях. Почему этот NADH окисляется не в митохондриях, обсуждается: по Luengo 2021, потребность в NAD⁺ превышает потребность в ATP, по Wang 2022 — насыщаются челноки. В модели учтены эти ограничения: пропускная способность PDH и челноков, а также скорость возврата протонов в матрикс. Ограничение модели: пропускная способность задана постоянными числами, поэтому FCCP ускоряет дыхание, но почти не снижает выход лактата; в опытах Luengo FCCP снижал выход лактата у активированных T-клеток мыши.", "p1b_1_q": "Клетка делится при 21 % O₂ и выделяет лактат. Сигнал, стимулирующий деление, перестаёт действовать. Куда направится пируват, образующийся в гликолизе?", "p1b_1_o1": "Почти весь войдёт в митохондрии, лактат почти не образуется", "p1b_1_o2": "Почти весь превратится в лактат: так устроен гликолиз", "p1b_1_o3": "Почти весь выйдет из клетки как пируват", "p1b_1_e": "Поток глюкозы снижается (57 → 11 % шкалы). Челноки переносят электроны почти всего NADH цитоплазмы, а PDH окисляет почти весь пируват. Выход лактата снижается с 34 % до нуля, выход пирувата тоже почти нулевой: почти весь пируват поступает в митохондрии.", "p1b_1_w2": "Лактат — не обязательный конечный продукт гликолиза. Без сигнала к делению поток гликолиза невелик: пропускной способности челноков хватает для переноса восстановительных эквивалентов NADH цитоплазмы, а пируват в основном окисляется в митохондриях. Поэтому реакция ЛДГ почти не задействована.", "p1b_1_w3": "Выход пирувата из клетки на полосе почти нулевой: при таком потоке пируват почти полностью поступает в митохондрии и окисляется PDH, а челноки переносят электроны почти всего NADH.", "p1b_2_q": "Клетку без сигнала к делению сутки выдерживают при 0,2 % O₂. Как изменятся выход лактата и потребление O₂?", "p1b_2_o1": "Выход лактата увеличится, потребление O₂ снизится", "p1b_2_o2": "Выход лактата увеличится, потребление O₂ не изменится", "p1b_2_o3": "Выход лактата снизится вместе с потреблением O₂", "p1b_2_e": "При 0,2 % O₂ дыхание ограничено доступностью кислорода. Доля NADH в матриксе возрастает, поток через PDH и перенос восстановительных эквивалентов челноками замедляются. Гликолиз ускоряется (эффект Пастера), и ЛДГ регенерирует NAD⁺: выход лактата увеличивается с 0 до 21 % шкалы, а потребление O₂ снижается с 35 до 10 %. В течение суток развивается транскрипционный ответ HIF-1: повышается экспрессия киназы PDK1, ингибирующей PDH (Kim 2006; Papandreou 2006), и переносчика глюкозы GLUT1 (в фибробластах Rat1: Chen 2001). Показано установившееся состояние; время перехода модель не рассчитывает.", "p1b_2_w2": "При 0,2 % O₂ дыхательная цепь ограничена недостатком кислорода, а HIF-1 к тому же подавляет вход пирувата в митохондрии. Поэтому на полосе потребление O₂ ниже, чем в покоящейся клетке при 21 % O₂.", "p1b_2_w3": "Выход лактата увеличивается, а не снижается: дыхательная цепь принимает меньше электронов NADH, и ЛДГ окисляет больше NADH цитоплазмы.", "p1b_3_q": "Содержание кислорода в среде вернули к 21 % и подали сигнал, стимулирующий деление. Как изменятся выход лактата и потребление O₂?", "p1b_3_o1": "Выход лактата увеличится, потребление O₂ снизится", "p1b_3_o2": "Выход лактата увеличится, потребление O₂ не снизится", "p1b_3_o3": "Выход лактата не изменится: кислорода достаточно", "p1b_3_e": "Сигнал к делению ускоряет гликолиз (поглощение глюкозы 11 → 57 %). Поток через PDH и челноки увеличивается, но их пропускная способность ограничена, и ЛДГ окисляет оставшийся NADH. Поэтому выход лактата растёт и при 21 % O₂ (0 → 34 %). Потребление O₂ не снижается: на полосе оно выше, чем в покоящейся клетке (35 → 60 %), потому что в модели вход пирувата в митохондрии растёт вместе с потоком глюкозы. В активированных T-клетках потребление O₂ тоже увеличивается (Wang 2011), хотя скорость гликолиза выше той, которая необходима для удовлетворения потребности в ATP (Frauwirth 2002). При активном AKT гликолиз ускорялся примерно вчетверо, а потребление O₂ не менялось (Elstrom 2004).", "p1b_3_w1": "В модели потребление O₂ при сигнале к делению не снижается, а увеличивается: дыхание митохондрий сохраняется. Выход лактата растёт из-за ускорения гликолиза, а не из-за остановки дыхательной цепи.", "p1b_3_w3": "Наличие кислорода не гарантирует, что весь пируват окислится в митохондриях. При сигнале к делению NADH образуется в гликолизе быстрее, чем челноки переносят его восстановительные эквиваленты. ЛДГ восстанавливает часть пирувата до лактата и одновременно окисляет NADH до NAD⁺. Поэтому лактат образуется и при 21 % O₂.", "p1a_1_q": "Делящуюся клетку при 21 % O₂ обработали олигомицином. Как изменятся потребление O₂ и выход лактата?", "p1a_1_o1": "Потребление O₂ снизится до нуля, выход лактата возрастёт", "p1a_1_o2": "Потребление O₂ снизится не до нуля, выход лактата возрастёт", "p1a_1_o3": "Потребление O₂ возрастёт: дыхание компенсирует нехватку ATP", "p1a_1_e": "ATP-синтаза заблокирована. Протоны возвращаются в матрикс только за счёт утечки, и дыхание замедляется: потребление O₂ снижается с 55 до 15 % шкалы. Доля NADH в матриксе возрастает, поток через PDH и челноки уменьшается. ЛДГ регенерирует NAD⁺, поэтому выход лактата растёт с 25 до 56 %. ATP по-прежнему образуется в гликолизе; условный индекс ATP равен 13 %, но это величина модели, а не измеренная доля покрытия потребности в энергии.", "p1a_1_w1": "Утечка протонов сохраняется, поэтому часть дыхания продолжается и при заблокированной ATP-синтазе. Дыхание, связанное с утечкой, измеряют как остаточное потребление O₂ после добавления олигомицина; его доля зависит от типа клеток (Brand 2011). Поэтому потребление O₂ низкое, но не нулевое.", "p1a_1_w3": "Когда протоны не возвращаются в матрикс через ATP-синтазу, скорость дыхательной цепи ограничена утечкой, поэтому потребление O₂ снижается. Митохондриальный синтез ATP почти прекращается.", "p1a_2_q": "Делящуюся клетку без других препаратов обработали малой дозой разобщителя FCCP. Как изменятся потребление O₂ и доля NADH в матриксе?", "p1a_2_o1": "Потребление O₂ возрастёт, доля NADH в матриксе снизится", "p1a_2_o2": "Потребление O₂ снизится, доля NADH в матриксе возрастёт", "p1a_2_o3": "Оба показателя не изменятся: разобщитель влияет на ATP, а не на дыхание", "p1a_2_e": "FCCP переносит протоны в матрикс в обход ATP-синтазы. Дыхание ускоряется: потребление O₂ увеличивается с 55 до 99 % шкалы, а доля NADH в матриксе снижается с 0,32 до 0,22. Сопряжение дыхания с синтезом ATP ослабевает, поэтому условный индекс ATP снижается с 95 до 56 %. Деление почти не меняется (81 → 82 %). В опытах Luengo 2021 разобщение восстанавливало деление на фоне активации PDH ингибитором PDK; это сочетание можно проверить в свободном режиме.", "p1a_2_w2": "Разобщитель ускоряет дыхание, а не подавляет его: протоны легче возвращаются в матрикс, поэтому цепь быстрее перекачивает их и быстрее передаёт электроны кислороду. Потребление O₂ увеличивается, а NADH матрикса окисляется.", "p1a_2_w3": "Скорость дыхания определяется скоростью возврата протонов в матрикс. Разобщитель ускоряет этот возврат, поэтому дыхание усиливается: на полосе потребление O₂ выше, чем в контроле.", "p1a_3_q": "Пиерицидин блокирует комплекс I, и деление клетки замедляется. В среду добавили пируват. Как изменятся деление и потребление O₂?", "p1a_3_o1": "Деление не восстановится: без комплекса I оно невозможно", "p1a_3_o2": "Деление восстановится, потребление O₂ останется низким", "p1a_3_o3": "Деление и потребление O₂ восстановятся: пируват запустит цепь", "p1a_3_e": "Комплекс I остаётся подавленным, и потребление O₂ составляет около 4 % шкалы. ЛДГ восстанавливает добавленный пируват до лактата и регенерирует NAD⁺ в цитоплазме: доля NADH снижается с 0,47 до 0,25. Регенерированный NAD⁺ позволяет MDH1 и GOT1 синтезировать аспартат в цитоплазме: доступность аспартата возрастает с 13 до 70 %, а деление — с 15 до 82 %. Условный индекс ATP остаётся около 20 %.", "p1a_3_w1": "Подавление комплекса I не исключает восстановления деления. В клетках с цитоплазматическим путём синтеза аспартата (MDH1, GOT1) добавленный пируват восстанавливает деление через регенерацию NAD⁺, а добавленный аспартат повышает его доступность, минуя этот путь синтеза. Степень восстановления зависит от клеток и условий (Sullivan 2015; Birsoy 2015).", "p1a_3_w3": "Пируват не снимает ингибирование комплекса I: потребление O₂ остаётся низким. ЛДГ восстанавливает пируват до лактата и одновременно окисляет NADH до NAD⁺; регенерированный NAD⁺ поддерживает синтез аспартата в цитоплазме (MDH1, GOT1).", "p1a_4_q": "Клетка находится при 21 % O₂; интенсивность сигнала, стимулирующего деление, составляет 80 % шкалы. Дополнительного потребления ATP нет. В среду добавили дихлорацетат: он ингибирует PDK, поэтому пропускная способность PDH повышается. Как изменятся выход лактата и скорость деления?", "p1a_4_o1": "Выход лактата снизится, деление ускорится: в митохондрии поступит больше пирувата", "p1a_4_o2": "Выход лактата снизится, деление замедлится", "p1a_4_o3": "Выход лактата и деление не изменятся", "p1a_4_e": "Поток пирувата через PDH возрастает с 19 до 30 % шкалы, а выход лактата снижается с 25 до 16 %. Дыхание остаётся на уровне 55 %, поскольку в модели его скорость задана возвратом протонов в матрикс. Доля NADH в цитоплазме возрастает с 0,12 до 0,40, в матриксе — с 0,32 до 0,42, а деление снижается с 81 до 70 %. Этот результат относится к выбранным условиям. Авторы работы Luengo 2021 активировали PDH ингибитором PDK AZD7545; сходное направление эффекта не означает количественной эквивалентности AZD7545 и дихлорацетата.", "p1a_4_w1": "В митохондрии поступает больше пирувата, но скорость дыхательной цепи в модели задана возвратом протонов в матрикс (расход ATP и утечка), поэтому потребление O₂ не увеличивается. Доля NADH в цитоплазме и матриксе возрастает, и деление не ускоряется.", "p1a_4_w3": "PDK ингибирует PDH. Дихлорацетат ингибирует PDK, поэтому ингибирование PDH ослабевает, в митохондрии поступает больше пирувата, и выход лактата снижается.", "p1a_5_q": "Мысленный опыт: пропускная способность PDH искусственно увеличена так, что почти весь пируват поступает в митохондрии. Это режим модели, а не действие определённой дозы дихлорацетата. Как изменится деление при прочих равных условиях?", "p1a_5_o1": "Деление ускорится: больше пирувата в митохондриях даст клетке больше ATP", "p1a_5_o2": "Деление замедлится: лактата почти не будет, а доля NADH в цитоплазме возрастёт", "p1a_5_o3": "Деление не изменится: изменится лишь выход лактата из клетки", "p1a_5_e": "Почти весь пируват проходит через PDH, и выход лактата снижается с 16 до 0 %. ЛДГ перестаёт участвовать в регенерации NAD⁺. Новое установившееся состояние достигается при высокой доле NADH в цитоплазме — 0,93 вместо 0,40. Реакция GAPDH замедляется, поглощение глюкозы снижается с 46 до 30 % шкалы, а деление — с 70 до 40 %. Активация PDH и усиление челноков — разные вмешательства, и результат одного из них нельзя автоматически переносить на другое.", "p1a_5_w1": "Направления почти всего пирувата в митохондрии недостаточно для ускорения деления. ЛДГ перестаёт регенерировать NAD⁺, а пропускная способность челноков ограничена. Новое установившееся состояние достигается при высокой доле NADH в цитоплазме и меньшем потоке гликолиза: реакция GAPDH замедляется. Дыхание при этом не ускоряется, и деление замедляется.", "p1a_5_w3": "Выход лактата прекращается, но индекс деления снижается до 40 % шкалы. Доля NADH в цитоплазме высока, поэтому реакция GAPDH и поток гликолиза замедлены. NADH продолжает окисляться челноками; скорости его образования и окисления снова уравновешены, но при меньшем потоке.", "p1a_6_q": "Клетку без сигнала к делению сутки выдерживали при 0,2 % O₂: выход лактата повышен, потребление O₂ низкое. Содержание кислорода возвращают к 21 %. Как изменятся выход лактата и потребление O₂ после выхода на новое установившееся состояние?", "p1a_6_o1": "Выход лактата почти прекратится, потребление O₂ вернётся к уровню при 21 % O₂", "p1a_6_o2": "Выход лактата останется высоким: это признак нарушения функции митохондрий", "p1a_6_o3": "Потребление O₂ восстановится, а выход лактата останется высоким", "p1a_6_e": "После возврата кислорода дыхательная цепь снова принимает электроны, доля NADH в матриксе снижается, и пируват поступает в митохондрии. Выход лактата почти прекращается (21 → 0 %), а потребление O₂ возвращается к уровню клетки без гипоксии (10 → 35 %). Показано установившееся состояние; время возврата не рассчитывается.", "p1a_6_w2": "Выход лактата при гипоксии вызван недостатком кислорода, а не нарушением функции митохондрий. Когда O₂ снова достаточно, пируват опять поступает в митохондрии, и выход лактата прекращается.", "p1a_6_w3": "Если O₂ снова достаточно и дыхание митохондрий не нарушено, ускорение гликолиза прекращается, и выход лактата на полосе близок к нулю. Высокий выход лактата при 21 % O₂ наблюдается, например, при блокаде комплекса I (следующий шаг).", "p1a_7_q": "Клетка без сигнала к делению находится при 0,2 % O₂, комплекс I заблокирован пиерицидином. Содержание кислорода возвращают к 21 %. Как изменятся потребление O₂ и выход лактата?", "p1a_7_o1": "Потребление O₂ останется очень низким, а выход лактата — повышенным, как при гипоксии", "p1a_7_o2": "Потребление O₂ вернётся к уровню клетки без пиерицидина, выход лактата прекратится", "p1a_7_o3": "Потребление O₂ вернётся к уровню без пиерицидина, выход лактата останется высоким", "p1a_7_e": "При блокаде комплекса I возврат кислорода не восстанавливает дыхание: потребление O₂ остаётся очень низким (1 → 3 %), доля NADH в матриксе высока (0,81), поток через PDH и челноки замедлен. Выход лактата снижается (32 → 14 %), но остаётся выше, чем у клетки без блокады (0 %). По этому признаку гипоксию (шаг 6) отличают от блокады комплекса I: при гипоксии возврат кислорода восстанавливает дыхание.", "p1a_7_w2": "Пиерицидин подавляет основной путь окисления NADH матрикса — комплекс I. Поэтому одного возврата кислорода недостаточно для восстановления дыхания: потребление O₂ составляет 3 % шкалы вместо 35 % у клетки без блокады комплекса I.", "p1a_7_w3": "Выход лактата действительно остаётся повышенным (14 %), но потребление O₂ не возвращается к уровню клетки без блокады комплекса I: на полосе оно составляет 3 %, поскольку комплекс I заблокирован.", "lbl_matrix2": "матрикс", "lg_fad": "фиолетовая частица — FADH₂ (восстановленная форма)", "s2_cit": "цитрат", "s2_akg": "α-КГ", "s2_suc": "сукцинат", "s2_mal": "малат / ОАА", "s2_cs": "ЦС", "s2_idh": "IDH", "s2_kgdh": "α-КГДГ", "s2_sdh": "SDH", "s2_gls": "GLS", "s2_pc": "ПК", "s2_accoa": "ацетил-CoA", "s2_gln": "глутамин", "s2_xc": "цитрат", "s2_xg": "глутамат", "s2_xa": "аспартат", "s2_xm": "малат → пируват", "s2_xh": "условный сток", "s2_stub1": "прочие притоки", "s2_stub2": "не рассчитываются", "s2_redl": "восстановительное карбоксилирование", "s2_carr": "образование NADH и FADH₂", "s2_chain": "→ дыхательная цепь", "s2_p_pier": "пиерицидин", "s2_p_glsi": "ингибитор GLS", "s2_p_pckd": "ПК подавлена", "s2_p_sdh": "потеря SDH", "s2_how": "Как измеряют", "s2_cat": "Отток метаболитов на биосинтез (коэффициент)", "s2_gln_s": "Глутамин в среде", "unit_mM": "мМ", "s2_g_drugs": "Воздействия", "s2_glsi": "ингибитор GLS", "s2_pier": "пиерицидин", "s2_pckd": "подавление ПК", "s2_sdhl": "потеря SDH", "s2_cell": "Клетки", "s2_cell_1": "линия 1", "s2_cell_2": "линия 2", "s2_tr": "Метка ¹³C", "s2_tr_0": "нет", "s2_tr_glc": "глюкоза", "s2_tr_gln": "глутамин", "s2_thought": "Мысленный опыт: ацетил-CoA доступен, пополнение пула метаболитов цикла почти отсутствует", "s2_r_gls": "Приток через GLS", "s2_r_pc": "Приток через ПК", "s2_r_cs": "Поток через цитратсинтазу", "s2_r_nadh": "Образование NADH в цикле", "s2_r_fad": "Перенос электронов через SDH", "s2_r_cit_x": "Отток цитрата на биосинтез", "s2_r_glu_x": "Отток глутамата на биосинтез", "s2_r_asp": "Доступность аспартата (индекс)", "s2_r_div": "Деление (индекс модели)", "s2b_ref": "Вертикальная черта на полосе и в узлах обозначает эталон — делящуюся клетку при 2 мМ глутамина (×1,00). Узел и полоса показывают величину в долях эталона; шкала притока через ПК — 0–3 эталона, шкала остальных величин — 0–1,5. Доступность аспартата и деление показаны, как в вопросе 1 (в % шкалы). Учебная модель, относительные величины; показано установившееся состояние.", "s2a_ref": "Величины каждой линии нормированы на её собственный эталон при 2 мМ глутамина (вертикальная черта, ×1,00), поэтому значение ×1,00 у двух линий не означает одинаковых абсолютных потоков через GLS или ПК. Шкала притока через ПК — 0–3 эталона, остальных величин — 0–1,5; если полоса заполнена до конца, ориентируйтесь на число справа. Доступность аспартата и деление — условные индексы. Учебная модель, относительные величины; показано установившееся состояние.", "s2_lines_t": "Две линии клеток при тех же условиях", "s2_r_div1": "Деление, линия 1", "s2_r_div2": "Деление, линия 2", "s2_r_m31": "Аспартат M+3, линия 1", "s2_r_m32": "Аспартат M+3, линия 2", "s2_iso_cit": "цитрат", "s2_iso_asp": "аспартат", "s2_iso_t_glc": "[U-¹³C₆]глюкоза: доли изотопологов выбранной линии, % (установившееся мечение)", "s2_iso_t_gln": "[U-¹³C₅]глутамин: доли изотопологов выбранной линии, % (установившееся мечение)", "s2_iso_hint": "Обозначение M+n соответствует молекулам, содержащим n атомов ¹³C; на графике показана доля таких молекул. Буква U указывает, что мечены все атомы углерода исходной молекулы, и не означает, что меченые молекулы составляют 100 % пула. В модели при использовании меченой глюкозы 85 % молекул пирувата относятся к изотопологу M+3. При использовании меченого глутамина 100 % его молекул относятся к изотопологу M+5. CO₂ не мечен. Углеродный скелет аспартата происходит из ОАА. Показано установившееся мечение.", "s2_cmp": "Сильнее всего отличаются от эталона: {list}.", "s2_cmp_rest": "Остальные показатели близки к эталону.", "s2_cmp_more": "Есть и другие отличия (см. полосы).", "s2_cmp_none": "Сравнение с эталоном: все показатели близки к эталону.", "s2_cmpn_cit": "содержание цитрата", "s2_cmpn_akg": "содержание α-КГ", "s2_cmpn_suc": "содержание сукцината", "s2_cmpn_mal": "содержание малата/ОАА", "s2_cmpn_gls": "приток через GLS", "s2_cmpn_pc": "приток через ПК", "s2_cmpn_cs": "поток через цитратсинтазу", "s2_cmpn_nadh": "образование NADH в цикле", "s2_cmpn_fad": "перенос электронов через SDH", "s2_cmpn_cit_x": "отток цитрата на биосинтез", "s2_cmpn_glu_x": "отток глутамата на биосинтез", "s2_cmpn_asp": "доступность аспартата", "s2_cmpn_div": "скорость деления", "s2_c_ref": "Эталон — делящаяся клетка при 2 мМ глутамина; цикл пополняется через глутаминазу (GLS) и пируваткарбоксилазу (ПК). Содержание промежуточных метаболитов принято за 1,00 (вертикальная черта в узлах).", "s2_m_gln0": "Глутамина в среде нет, поэтому приток через GLS прекращён.", "s2_m_glnL": "Концентрация глутамина в среде ниже эталонной, поэтому приток через GLS уменьшен.", "s2_m_glnH": "Концентрация глутамина в среде выше эталонной, но приток через GLS возрастает лишь немного: в модели учитывается насыщение фермента субстратом.", "s2_m_catH": "Коэффициент оттока на биосинтез увеличен. При прежних значениях содержания метаболитов отток был бы больше; фактические потоки после изменения содержания метаболитов показаны на полосах.", "s2_m_catL": "Коэффициент оттока на биосинтез уменьшен. При прежних значениях содержания метаболитов отток был бы меньше; фактические потоки показаны на полосах.", "s2_m_glsi": "Ингибитор глутаминазы снижает приток через GLS (в модели остаточная активность — 10 %).", "s2_m_pckd": "Подавление ПК: в формулу притока через ПК введён множитель 0,10. Это условное вмешательство; при недостатке малата/ОАА поток через ПК частично возрастает благодаря обратной связи, заложенной в модель.", "s2_m_sdh": "Потеря SDH: сукцинат не превращается в фумарат, цикл прерван на сукцинате.", "s2_m_pier": "Пиерицидин блокирует комплекс I. Дыхательная цепь медленнее окисляет NADH, поэтому замедляются реакции цикла, в которых образуется NADH.", "s2_m_multi": "Изменено несколько условий: {list}.", "s2_dn_gln0": "нет глутамина", "s2_dn_glnL": "глутамина меньше", "s2_dn_glnH": "глутамина больше", "s2_dn_catH": "повышен коэффициент оттока на биосинтез", "s2_dn_catL": "снижен коэффициент оттока на биосинтез", "s2_dn_glsi": "ингибитор GLS", "s2_dn_pckd": "подавление ПК", "s2_dn_sdh": "потеря SDH", "s2_dn_pier": "пиерицидин", "s2_f_ace": "В модели ацетил-CoA поступает так же, как в эталоне, но малата/ОАА мало, поэтому поток через цитратсинтазу низкий.", "s2_f_sdh": "Сукцинат накапливается: без SDH он не превращается в фумарат.", "s2_f_pier": "Скорость превращения пирувата комплексом PDH снижена (вопрос 1), поэтому ацетил-CoA поступает в цикл медленнее, а поток через цитратсинтазу уменьшается.", "s2_f_red": "Часть α-КГ превращается в цитрат в обратном направлении — путём восстановительного карбоксилирования (штриховая стрелка вверху схемы).", "s2_f_oaa": "Содержание малата/ОАА ниже эталонного, поэтому цитратсинтазе доступно меньше ОАА, а поток через неё уменьшен.", "s2_f_pc": "Содержание малата/ОАА снизилось, а поток через ПК превышает эталонное значение: в модели он возрастает при низком содержании ОАА.", "s2_f_asp": "Доступность аспартата и индекс деления ниже эталонных значений, поскольку аспартат необходим для синтеза нуклеотидов и белков (вопрос 1).", "s2_f_m5": "Доля цитрата M+5 — {x} %. Она указывает на вклад восстановительного карбоксилирования, однако по одной доле M+5 чистый поток не оценивают.", "s2_f_m3": "Доля аспартата M+3 — {x} %. Изотополог M+3 образуется через ПК (пируват M+3 → ОАА M+3), но возникает и после нескольких оборотов цикла.", "s2_f_m3s": "Доля аспартата M+3 — {x} %. Без SDH ОАА в модели образуется почти только через ПК, поэтому доля M+3 близка к доле меченого пирувата ({phi} %) и не отражает поток через ПК.", "s2_f_m3r": "Доля аспартата M+3 — {x} %. В этих условиях ОАА образуется через ПК и путём восстановительного карбоксилирования. Доля M+3 зависит от вклада каждого из этих путей и от степени мечения исходных субстратов, поэтому её нельзя прямо принять за долю ОАА, образованного в реакции ПК, или за поток через ПК.", "s2_z_ref": "Содержание каждого промежуточного метаболита задаётся балансом притока и оттока. В реакциях цикла ацетильная группа ацетил-CoA окисляется с образованием восстановленных переносчиков электронов, а цитрат, α-КГ и ОАА выходят из цикла на синтез липидов, глутамата и аспартата. В сумме ацетильная группа окисляется до двух молекул CO₂, а количество промежуточных метаболитов в цикле не увеличивается.", "s2_z_in": "Если один из притоков (через GLS или ПК) ослаблен, а отток на синтез прежний, снижается содержание того промежуточного метаболита, который пополнялся этим притоком: через GLS пополняется α-КГ, через ПК — ОАА. Возместит ли усиление одного притока недостаток другого, зависит от свойств клеток и состава среды.", "s2_z_outH": "Катаплерозом называют выход промежуточных метаболитов цикла на биосинтез. При усилении этого выхода содержание метаболитов снижается. В показанном установившемся состоянии суммарный приток равен суммарному выходу, но баланс достигается при более низком содержании метаболитов. При недостатке ОАА поток через цитратсинтазу и образование NADH снижаются.", "s2_z_outL": "При ослабленном оттоке промежуточные метаболиты расходуются на синтез медленнее, и их содержание превышает эталонное значение, хотя поток через ПК в модели при этом снижается. Приток через GLS в модели не изменяется вслед за оттоком; это упрощение, поскольку в клетке поглощение глутамина регулируется.", "s2_z_mix": "Изменены и приток, и отток, поэтому содержание каждого промежуточного метаболита задаётся их соотношением. Сравните узлы и полосы с чертой эталона.", "s2_z_glnH": "В модели приток через GLS насыщается при повышении концентрации глутамина, поэтому содержание промежуточных метаболитов увеличивается слабо.", "s2_z_pier": "При блокаде комплекса I дыхательная цепь медленнее окисляет NADH матрикса (вопрос 1). Реакции цикла, в которых образуется NADH, замедляются, а при наличии α-КГ часть его превращается в цитрат в обратном направлении (восстановительное карбоксилирование, штриховая стрелка). Это отдельный поток: окислительный путь при этом не меняет направления.", "s2_z_sdh": "Без SDH цикл прерывается на сукцинате. Сукцинат накапливается, если углерод поступает в цикл из глутамина или через ПК. ОАА, а из него и аспартат, образуется в основном через ПК, поэтому такие клетки сильнее зависят от притока через ПК. Кратковременное ингибирование SDH перед ишемией, напротив, уменьшало накопление сукцината (вопрос 4): результат зависит от условий и момента вмешательства.", "s2b_take": "Содержание каждого промежуточного метаболита цикла задаётся балансом притока (глутамин через GLS, пируват через ПК) и оттока на синтез. При усилении оттока или ослаблении притока новое установившееся состояние достигается при более низком содержании метаболитов. Цитратсинтазе становится доступно меньше ОАА, и поток цикла снижается.", "s2a_take": "В цикле образуются восстановительные эквиваленты и предшественники для биосинтеза. Содержание промежуточных метаболитов задаётся балансом притоков и выходов. В модели вклад GLS и ПК различают по совокупности результатов: по ответу на удаление глутамина и по распределению метки ¹³C. В реальном исследовании учитывают также обогащение источников меткой, состав среды и другие пути обмена.", "p2b_1_q": "Эталонная клетка делится в среде с 2 мМ глутамина; коэффициент оттока метаболитов на биосинтез равен 1,00. Если удалить глутамин из среды, как изменятся содержание α-КГ и доступность аспартата?", "p2b_1_o1": "Содержание α-КГ снизится, и доступность аспартата тоже снизится", "p2b_1_o2": "Содержание α-КГ снизится, а доступность аспартата не изменится: ПК пополнит ОАА", "p2b_1_o3": "Содержание α-КГ не изменится: его пополняет ПК", "p2b_1_e": "Приток через GLS прекращается (×1,00 → ×0,00), и α-КГ больше не пополняется из глутамина: его содержание — ×0,27. Поток через ПК возрастает до ×3,13 (в модели он увеличивается при недостатке ОАА), однако ПК восполняет ОАА, а не непосредственно α-КГ, и содержание малата/ОАА снижается до ×0,22. Поток через цитратсинтазу — ×0,45; доступность аспартата снижается (69 → 43 %), снижается и индекс деления (81 → 51 %). В клетках глиобластомы SF188 лишение глутамина снижало содержание промежуточных метаболитов цикла и аспартата и вызывало гибель клеток; проникающая в клетку форма α-КГ (5 мМ) сохраняла их жизнеспособность (Zhang 2014). В клетках C2C12 с подавленным переносчиком аспартата AGC1 при низкой концентрации глутамина жизнеспособность и деление восстанавливал аспартат в высокой концентрации (Alkan 2018).", "p2b_1_w2": "Аспартат образуется из ОАА. После удаления глутамина поток через ПК вырос до ×3,13, но содержание малата/ОАА всё же снизилось до ×0,22. Поэтому доступность аспартата уменьшилась с 69 до 43 %. В новом установившемся состоянии притоки и выходы уравновешены при меньшем содержании промежуточных метаболитов.", "p2b_1_w3": "ПК пополняет ОАА, а α-КГ пополняется из глутамина через GLS. Углерод, поступивший через ПК, достигает α-КГ только через реакцию цитратсинтазы, а ей доступно мало ОАА (поток ×0,45). Поэтому содержание α-КГ снижается до ×0,27.", "p2b_2_q": "Эталонная клетка находится в среде с 2 мМ глутамина; приток через GLS почти насыщен. Коэффициент оттока метаболитов на биосинтез увеличили с 1,00 до 2,00. При прежнем содержании метаболитов их отток на биосинтез удвоился бы. Как изменятся содержание малата/ОАА и образование NADH в цикле?", "p2b_2_o1": "Не изменятся: приток вырастет вместе с оттоком", "p2b_2_o2": "Оба показателя снизятся: промежуточных метаболитов в цикле станет меньше", "p2b_2_o3": "Содержание малата/ОАА снизится, а образо
