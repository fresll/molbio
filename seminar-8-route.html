остаточно: окисление 5mC замедлено, продуктов окисления меньше, а 5mC сохраняется. JmjC-деметилазы работают как прежде.","bars":[["Окисление 5mC белками TET",2],["Деметилирование лизина JmjC",3]]},"1-1":{"n":{"c5mC":"on","c5hmC":"low","c5fC":"low","c5caC":"low","c0":"low","hub":"low","kme3":"on","kme2":"low"},"e":{"t1":"off","t2":"off","t3":"off","tdg":"on","j":"off","rep":"on","f1":"off","f2":"off"},"note":"Активность TET снижена и косубстратов мало: окисление 5mC замедлено сильнее всего, деметилирование лизина JmjC-деметилазами тоже замедлено.","bars":[["Окисление 5mC белками TET",1],["Деметилирование лизина JmjC",2]]}},"notes_svg":[{"x":115,"y":64,"t":"TET","a":"middle","n":[110,62]},{"x":235,"y":64,"t":"TET","a":"middle","n":[230,62]},{"x":355,"y":64,"t":"TET","a":"middle","n":[312,124]},{"x":485,"y":66,"t":"TDG, BER","a":"middle","n":[225,150]},{"x":154,"y":332,"t":"JmjC","a":"middle","n":[170,428]},{"x":154,"y":354,"t":"формальдегид","a":"middle","n":[170,446]},{"x":475,"y":338,"t":"DNMT1 восстанавливает метилирование новой цепи","a":"middle","n":[170,580],"tn":"DNMT1 метилирует новую цепь"},{"x":475,"y":355,"t":"напротив 5mC, но не напротив 5hmC","a":"middle","n":[170,597],"tn":"напротив 5mC, но не 5hmC"}]}}},{"id":"oncometabolites","number":20,"section":2,"title":"Как нарушения SDH, FH и IDH по-разному меняют метаболиты","question":3,"questions":[3],"keywords":["SDH","FH","IDH1","сукцинат","фумарат","R-2-HG","неоморфная активность","конкурентное ингибирование","α-КГ-зависимые диоксигеназы"],"lead":["Потеря сукцинатдегидрогеназы (SDH) ведёт к накоплению сукцината, потеря фумаразы (FH) — к накоплению фумарата, а мутация IDH1 R132H — к образованию [[T62|R-2-гидроксиглутарата]] (R-2-HG).","Эти метаболиты образуются разными путями, но каждый может тормозить α-КГ-зависимые диоксигеназы."],"mechanism":["SDH окисляет сукцинат до фумарата, а FH гидратирует фумарат до малата; при потере SDH накапливается сукцинат, при потере FH — фумарат.","Мутантная IDH1 R132H утрачивает способность катализировать реакцию изоцитрат → α-КГ и приобретает [[T63|неоморфную активность]]: NADPH-зависимое восстановление α-КГ до R-2-HG.","Сукцинат, фумарат и 2-гидроксиглутарат (2-HG) структурно сходны с α-КГ и конкурируют с ним за активный центр α-КГ-зависимых диоксигеназ, в том числе JmjC-деметилаз и белков TET; эффект зависит от фермента, изомера и концентрации."],"paragraphs":["При потере SDH сукцинат не окисляется до фумарата и накапливается; при потере FH накапливается фумарат. Для обоих метаболитов показано конкурентное ингибирование α-КГ-зависимых деметилаз гистонов и ДНК (Xiao и соавт., 2012). Первичные дефекты при этом разные: при потере SDH или FH нарушена реакция ЦТК, а мутантная IDH1 приобретает новую реакцию.","Мутации IDH1 по остатку R132 не сводятся к потере функции. На очищенном рекомбинантном ферменте и в лизатах клеток 293T IDH1 R132H утрачивал способность превращать изоцитрат в α-КГ и приобретал способность восстанавливать α-КГ до R-2-HG с расходом NADPH. В линиях глиобластомы человека U87MG и LN-18 с исходно немутантной IDH1 экспрессия R132H приводила к накоплению 2-HG, углерод которого происходил из глутамина. В образцах глиом измеряли только содержание 2-HG: в опухолях с мутациями R132 оно составляло 5–35 мкмоль на 1 г ткани, более чем в 100 раз выше, чем в опухолях без мутаций (12 мутантных и 10 немутантных образцов; Dang и соавт., 2009). α-КГ и 2-HG — разные соединения: у 2-HG при втором атоме углерода вместо кетогруппы находится гидроксильная группа.","Действие 2-HG на разные ферменты различается. По более ранним биохимическим данным, на которые ссылаются Losman и соавт. (2013), оба энантиомера тормозят ряд α-КГ-зависимых ферментов, S-2-HG сильнее тормозит TET2, а на пролилгидроксилазы EglN энантиомеры действуют противоположно. В клетках эритролейкоза человека TF-1 мутантная IDH1 и R-2-HG, но не S-2-HG, вызывали независимость от цитокинов и блок дифференцировки, а в мышиных клетках SCF ER-Hoxb8 — блок дифференцировки, хотя TET2 сильнее тормозит S-2-HG; авторы объясняют это различным действием энантиомеров на EglN. Когда из среды убирали проникающий в клетку эфир R-2-HG, способность клеток дифференцироваться быстро возвращалась, а возврат зависимости от цитокинов требовал тем больше времени, чем выше были доза и длительность прежнего воздействия. Модификации хроматина в этой работе не измеряли, поэтому по ней нельзя судить о скорости возврата меток.","Сходный итог для хроматина, например повышенное метилирование H3K9, может возникать при разных первичных дефектах. По состоянию метки нельзя судить, какой метаболит накопился, а по накоплению метаболита — какие ферменты заторможены в данной клетке."],"trap":["Мутантная IDH1 просто накапливает α-КГ, а потеря SDH, потеря FH и мутация IDH1 одинаково влияют на хроматин.","α-КГ и 2-HG — разные соединения: мутантная IDH1 образует R-2-HG из α-КГ. Сукцинат, фумарат и R-2-HG возникают разными путями, а их действие на диоксигеназы зависит от фермента, изомера и концентрации."],"conditions":"Данные об R-2-HG получены на очищенном рекомбинантном ферменте, лизатах клеток 293T, трансфицированных линиях глиобластомы U87MG и LN-18 и образцах глиом (Dang и соавт., 2009), а также на клетках эритролейкоза человека TF-1 и мышиных клетках SCF ER-Hoxb8 (Losman и соавт., 2013; сравнение R- и S-2-HG по силе действия на TET2 приведено в этой работе по более ранним биохимическим данным); для сукцината и фумарата приведены выводы работы Xiao и соавт. (2012) без числовых данных. Схема качественная, пороговых концентраций на ней нет.","sources":["XIAO","DANG","LOSMAN"],"quiz":{"id":"S8-L20","rev":2,"question":"В двух клеточных линиях содержание H3K9me3 повышено сходно. В одной утрачена активность SDH, в другой присутствует мутантная IDH1 R132H. Какие первичные метаболические изменения ожидаются?","options":[{"id":"S8-L20-1","text":"В первой накапливается сукцинат, во второй образуется R-2-HG.","correct":true,"feedback":"Сходный результат для хроматина может возникать через разные метаболиты."},{"id":"S8-L20-2","text":"В обеих накапливается α-КГ, поскольку 2-HG — другое название α-КГ.","correct":false,"feedback":"α-КГ — 2-оксоглутарат; 2-гидроксиглутарат является другим соединением."},{"id":"S8-L20-3","text":"В обеих накапливается сукцинат, поскольку оба нарушения затрагивают ЦТК.","correct":false,"feedback":"SDH окисляет сукцинат, а мутантная IDH1 R132H непосредственно образует R-2-HG. Наличие мутации IDH1 само по себе не позволяет заключить о накоплении сукцината."}]},"widget":{"kind":"net","title":"","s":{"title":"Три первичных дефекта и общая мишень","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"def","type":"group","label":"Что изменено","opts":["норма","потеря SDH","потеря FH","IDH1 R132H"]}],"W":640,"H":362,"NW":340,"NH":462,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":100,"c":"plain","t":"первичный дефект","lx":16,"ly":24,"n":[4,4,332,106],"tn":"первичный дефект"},{"x":6,"y":112,"w":628,"h":100,"c":"mito","t":"накапливающийся метаболит","lx":16,"ly":130,"n":[4,118,332,106],"tn":"метаболит"},{"x":6,"y":218,"w":628,"h":138,"c":"nuc","t":"α-КГ-зависимые реакции","lx":16,"ly":236,"n":[4,232,332,220],"tn":"мишени"}],"mem":[],"nodes":{"sdh":{"p":[270,76,100,44],"t":"потеря\nSDH","n":[80,72,92,44],"fs":13},"fh":{"p":[400,76,100,44],"t":"потеря\nFH","n":[184,72,92,44],"fs":13},"idh":{"p":[530,76,100,44],"t":"IDH1\nR132H","n":[288,72,92,44],"fs":13},"suc":{"p":[270,182,100,46],"t":"сукцинат","n":[80,188,92,46],"fs":13},"fum":{"p":[400,182,100,46],"t":"фумарат","n":[184,188,92,46],"fs":13},"hg":{"p":[530,182,100,46],"t":"R-2-HG\n(D-2-HG)","n":[288,188,92,46],"fs":13},"dox":{"p":[400,292,340,52],"t":"α-КГ-зависимые диоксигеназы\n(JmjC-деметилазы, TET)","n":[170,312,320,54],"fs":13},"akg":{"p":[96,292,134,52],"t":"α-КГ\n(2-оксоглутарат)","n":[170,416,150,52],"fs":13}},"edges":{"a1":{"a":"sdh","b":"suc","k":"rx","t":"накопление","d":[42,0],"dn":[44,0]},"a2":{"a":"fh","b":"fum","k":"rx","t":"накопление","d":[42,0],"dn":[44,0]},"a3":{"a":"idh","b":"hg","k":"rx","t":"неоморфная\nреакция","d":[46,0],"dn":[-50,0]},"i1":{"a":[270,207,80,213],"b":[270,266,80,284],"k":"inh"},"i2":{"a":[400,207,184,213],"b":[400,266,184,284],"k":"inh"},"i3":{"a":[530,207,288,213],"b":[530,266,288,284],"k":"inh"},"sub":{"a":"akg","b":"dox","k":"rx","t":"субстрат","d":[0,-12],"dn":[48,0]}},"st":{"0":{"n":{"sdh":"off","suc":"base","fh":"off","fum":"base","idh":"off","hg":"base","dox":"base"},"e":{"a1":"off","i1":"off","a2":"off","i2":"off","a3":"off","i3":"off","sub":"on"},"note":"Норма: сукцинат и фумарат расходуются в ЦТК, R-2-HG в заметном количестве не образуется, и α-КГ-зависимые диоксигеназы используют α-КГ как косубстрат.","bars":[["Накопленный метаболит-ингибитор",1],["Активность α-КГ-зависимых реакций",3]]},"1":{"n":{"sdh":"abs","suc":"on","fh":"off","fum":"base","idh":"off","hg":"base","dox":"low"},"e":{"a1":"on","i1":"on","a2":"off","i2":"off","a3":"off","i3":"off","sub":"on"},"note":"Потеря SDH: сукцинат не окисляется до фумарата и накапливается. Он конкурирует с α-КГ за активный центр α-КГ-зависимых диоксигеназ, в том числе JmjC-деметилаз и белков TET; выраженность торможения зависит от фермента и концентрации.","bars":[["Накопленный метаболит-ингибитор",3],["Активность α-КГ-зависимых реакций",1]]},"2":{"n":{"sdh":"off","suc":"base","fh":"abs","fum":"on","idh":"off","hg":"base","dox":"low"},"e":{"a1":"off","i1":"off","a2":"on","i2":"on","a3":"off","i3":"off","sub":"on"},"note":"Потеря FH: фумарат не гидратируется до малата и накапливается. Он тоже конкурирует с α-КГ; выраженность торможения зависит от фермента и концентрации.","bars":[["Накопленный метаболит-ингибитор",3],["Активность α-КГ-зависимых реакций",1]]},"3":{"n":{"sdh":"off","suc":"base","fh":"off","fum":"base","idh":"on","hg":"on","dox":"low"},"e":{"a1":"off","i1":"off","a2":"off","i2":"off","a3":"on","i3":"on","sub":"on"},"note":"IDH1 R132H утрачивает способность катализировать обычную реакцию изоцитрат → α-КГ и приобретает неоморфную реакцию: α-КГ + NADPH → R-2-HG. R-2-HG и α-КГ — разные соединения; R-2-HG тормозит ряд α-КГ-зависимых ферментов, причём разные ферменты тормозятся в разной степени.","bars":[["Накопленный метаболит-ингибитор",3],["Активность α-КГ-зависимых реакций",1]]}},"notes_svg":[{"x":280,"y":232,"t":"конкурирует\nс α-КГ","a":"start","n":[90,244],"only":["1"]},{"x":410,"y":232,"t":"конкурирует\nс α-КГ","a":"start","n":[194,244],"only":["2"]},{"x":540,"y":232,"t":"конкурирует\nс α-КГ","a":"start","n":[200,244],"only":["3"]}]}}},{"id":"metabolites-and-marks","number":21,"section":2,"title":"Какие величины связывают изменение метаболизма с модификацией гистона","question":3,"questions":[3],"keywords":["LC–MS","внутренний стандарт","калибровка","иммуноблот","общий H3","линейный диапазон","специфичность антитела","дот-блот 5hmC"],"lead":["Содержание метаболита, доля модифицированного гистона и транскрипция гена — разные величины, и каждую измеряют отдельным способом.","Здесь рассмотрено, какие величины определяют методы LC–MS и [[T81|иммуноблот]] и какие остаются неизмеренными; на схеме ниже эти методы показаны по режимам."],"mechanism":["При LC–MS (на схеме — режим «LC–MS: метаболит») метаболиты разделяют по времени удерживания, определяют по отношению массы к заряду и после калибровки и учёта внутреннего стандарта получают количество метаболита в экстракте; экстракт целых клеток не разделяет компартменты.","При иммуноблоте (на схеме — режим «Иммуноблот: H3K9ac») сигнал антитела к модификации сравнивают с сигналом общего гистона H3 в линейном диапазоне регистрации; отношение показывает относительное изменение доли модифицированного гистона.","Ни один из этих методов не указывает положение модификации в геноме и не измеряет транскрипцию; 5hmC в ДНК определяют отдельным дот-блотом с контролем количества ДНК (на схеме — режим «Дот-блот: 5hmC»)."],"paragraphs":["Содержание метаболита определяют методом LC–MS (на схеме — режим «LC–MS: метаболит»). Принцип метода описан в шаге про прослеживание углерода. Площадь пика не равна количеству вещества: её связывают с ним калибровкой, а потери при экстракции учитывают внутренним стандартом, добавленным до экстракции. Экстракт целых клеток не разделяет компартменты, и по нему нельзя судить о содержании ацетил-CoA или SAM именно в ядре; ядерный ацетил-CoA измеряли в ядерной фракции с меченым внутренним стандартом (SILEC-SF; Trefely и соавт., 2022). Более 300 метаболитов в клетках HCT116 при ограничении метионина Mentch и соавт. (2015) измеряли в экстрактах целых клеток.","Модификацию гистона определяют иммуноблотом (на схеме — режим «Иммуноблот: H3K9ac»): белки разделяют электрофорезом, переносят на мембрану и выявляют антителом к модификации и антителом к общему H3. Сигнал модификации зависит и от количества гистона в дорожке, и от доли модифицированных молекул, поэтому его сравнивают с сигналом общего H3 в линейном диапазоне регистрации. Антитело должно быть специфичным: при проверке около 200 антител к 57 модификациям гистонов более 25 % не прошли тесты на специфичность (Egelhofer и соавт., 2011).","Для 5hmC в ДНК применяют дот-блот (на схеме — режим «Дот-блот: 5hmC»): ДНК наносят на мембрану точками и нормируют сигнал антитела к 5hmC на количество ДНК, а не на белок H3. Ни иммуноблот, ни дот-блот не показывают положение модификации в геноме и не измеряют транскрипцию. Модификацию гистонов на определённом участке генома выявляют иммунопреципитацией хроматина (ChIP; на схеме — режим «ChIP: метка у промотора»): фрагменты хроматина с модифицированным гистоном осаждают антителом к модификации, а количество ДНК выбранного участка в осадке определяют количественной ПЦР и выражают долей от входной ДНК. Каждый из этих методов измеряет свою величину, поэтому связь метаболита, доли метки и работы гена требует отдельных измерений. Так, по Wellen и соавт. (2009), подавление ATP-цитратлиазы (ACLY) снижало ацетилирование гистонов в клетках HCT116. В адипоцитах 3T3-L1 оно снижало экспрессию генов Glut4, HK2, PFK-1 и LDHA, которую возвращал ацетат. Ацетилирование гистонов H3 и H4 на промоторе Glut4 определяли методом ChIP: при подавлении ACLY оно снижалось, а ацетат его возвращал."],"trap":["Содержание метаболита, измеренное в экстракте клеток, показывает его концентрацию в ядре, где работают ферменты модификации хроматина.","Экстракт целых клеток не разделяет компартменты, а площадь пика соответствует количеству только после калибровки и учёта внутреннего стандарта. Содержание метаболита в ядре и изменение метки на конкретном участке хроматина требуют отдельных измерений."],"conditions":"Схема учебная: площади пиков, сигналы полос и точек даны в условных единицах и не взяты из опыта. Результаты Mentch и соавт. (2015) получены на клетках HCT116 при ограничении метионина, результаты Wellen и соавт. (2009) — на клетках HCT116 и адипоцитах 3T3-L1 при подавлении ATP-цитратлиазы (полный текст), данные Trefely и соавт. (2022) — на субклеточных фракциях клеток, а данные Egelhofer и соавт. (2011) относятся к проверке антител к модификациям гистонов. В опыте ChIP Wellen и соавт. (2009) использовали адипоциты 3T3-L1, антитела к ацетилированным H3 и H4 и контрольную геномную последовательность; IgG на схеме — общий контроль метода, а высота столбцов условная.","sources":["WELLEN","MENTCH","EGELHOFER","TREFELY"],"quiz":{"id":"S8-L21","rev":2,"question":"После воздействия сигнал H3K9ac уменьшился вдвое, а сигнал общего H3 тоже уменьшился вдвое. Что можно заключить по этим полосам о доле ацетилированного H3?","options":[{"id":"S8-L21-1","text":"По этим полосам доля H3K9ac не изменилась: отношение к общему H3 осталось прежним.","correct":true,"feedback":"При линейной регистрации одинаковое уменьшение обеих полос не доказывает изменения доли."},{"id":"S8-L21-2","text":"Доля снизилась вдвое: сигнал H3K9ac стал вдвое слабее, чем в контроле.","correct":false,"feedback":"Сигнал зависит и от количества загруженного гистона."},{"id":"S8-L21-3","text":"Долю иммуноблотом оценить нельзя: метод показывает лишь наличие модификации.","correct":false,"feedback":"Сравнение сигнала модификации с сигналом общего H3 позволяет оценить долю модифицированного гистона."}]},"widget":{"kind":"s3_methods","title":"","s":{"title":"Что измеряют LC–MS, иммуноблот, дот-блот и ChIP","status":"Учебная схема · значения условные, не данные опыта","modes_label":"Что показать","modes":["Три величины","LC–MS: метаболит","Иммуноблот: H3K9ac","Дот-блот: 5hmC","ChIP: метка у промотора"],"ov":{"sample":"один образец клеток","m1":"экстракт метаболитов → LC–MS","m2":"гистоны → иммуноблот","m3":"РНК, ДНК и хроматин: эти методы не измеряют","r1":"количество метаболита","r2":"доля метки на гистоне (отношение к общему H3)","r3":"транскрипция гена и положение метки в геноме"},"pipe":[["экстракт клеток","ЖХ: время удерживания","МС: масса иона (m/z)","площадь пика → количество"],["электрофорез белков","перенос на мембрану","антитело к H3K9ac","сигнал: H3K9ac / общий H3"],["ДНК на мембране","антитело к 5hmC","сигнал точки","контроль загрузки ДНК"],["хроматин: сшивка и фрагментация","антитело к ацетил-H3 или IgG","ДНК из осадка","ПЦР участка Glut4"]],"axis_x":"время удерживания →","axis_y":"интенсивность, усл. ед.","peak_m":"метаболит","peak_is":"внутренний стандарт","peak_is_n":"внутренний\nстандарт","u":"усл. ед.","true_word":"истинное","true_word_bl":"Истинная относительная доля H3K9ac в образце составляет","m_lc":["Площадь пика метаболита","Площадь пика стандарта","Оценка количества по стандарту"],"m_bl":["Сигнал H3K9ac, % от контроля","Сигнал общего H3, % от контроля","Отношение H3K9ac / H3, % от контроля"],"m_dt":["Сигнал 5hmC, % от контроля","ДНК на мембране, % от контроля","Сигнал на единицу ДНК, % от контроля"],"sl_n":"Количество метаболита в образце, усл. ед.","sl_loss":"Потери при экстракции","ck_before":"Внутренний стандарт добавлен до экстракции","pre_label":"Готовые случаи","pre":["без изменений","гистонов в дорожке вдвое меньше","доля H3K9ac вдвое меньше"],"sl_load":"Гистоны в дорожке «воздействие», % от контроля","sl_frac":"Доля H3K9ac в дорожке «воздействие», % от контроля","ck_sat":"Сигнал выходит за линейный диапазон (насыщение)","sl_dload":"ДНК на мембране в образце «воздействие», % от контроля","sl_dfrac":"Доля 5hmC в образце «воздействие», % от контроля","lane_c":"контроль","lane_t":"воздействие","row_ac":"H3K9ac","row_h3":"общий H3","sat_word":"насыщение: сигнал занижен","row_dc":"контроль,\n5hmC","row_dt":"воздействие,\n5hmC","row_sc":"контроль,\nДНК","row_st":"воздействие,\nДНК","h_show":"Что показывает","h_noshow":"Чего не показывает","show":["Содержание метаболита, долю модифицированного гистона и транскрипцию измеряют отдельно, каждую своим способом.","Количество метаболита в экстракте после калибровки и учёта внутреннего стандарта.","Относительное изменение доли модифицированного гистона между образцами при линейной регистрации и специфичном антителе.","Относительное содержание 5hmC в суммарной ДНК после нормировки на количество ДНК.","Долю ДНК выбранного участка генома (здесь — промотора Glut4), осаждённую вместе с модифицированным гистоном, от входной ДНК; её сравнивают между образцами и с контролем антитела (IgG)."],"noshow":["Транскрипцию гена и положение метки в геноме эти методы не определяют.","Распределение метаболита между компартментами: экстракт целых клеток их не разделяет. Площадь пика без калибровки не равна количеству вещества.","Положение метки в геноме и транскрипцию. Абсолютную долю модифицированных сайтов без дополнительной калибровки не даёт.","Положение 5hmC в геноме и скорость работы TET. Это дот-блот ДНК, а не иммуноблот белка H3.","Долю модифицированного гистона во всём хроматине и транскрипцию гена: экспрессию гена измеряют отдельно, например по количеству мРНК."],"desc":["Схема: из одного образца клеток измеряют количество метаболита (LC–MS) и долю модифицированного гистона (иммуноблот); транскрипцию и положение метки эти методы не измеряют.","Схема LC–MS: экстракт, хроматография, масс-спектрометрия и хроматограмма с пиками метаболита и внутреннего стандарта.","Схема иммуноблота: электрофорез, перенос на мембрану, антитело к H3K9ac и полосы H3K9ac и общего H3 в двух дорожках.","Схема дот-блота 5hmC: точки ДНК с разным разведением, сигнал антитела к 5hmC и контроль загрузки ДНК.","Схема ChIP: сшивка и фрагментация хроматина, осаждение антителом к ацетилированному H3 или неспецифическими IgG, выделение ДНК и количественная ПЦР промотора Glut4; столбцы обогащения в трёх образцах."],"notes":{"ov":"Из одного образца получают разные измерения: количество метаболита (LC–MS) и отношение сигнала модификации к общему H3 (иммуноблот). Транскрипция гена и положение метки в геноме этими методами не измеряются; метку на определённом участке генома выявляют методом ChIP (режим «ChIP: метка у промотора»).","lc0":"Потерь при экстракции нет: площадь пика пропорциональна количеству метаболита только после калибровки, поэтому оценку получают по отношению к внутреннему стандарту.","lc1":"Потери при экстракции уменьшили площади обоих пиков, а их отношение сохранилось: оценка количества не изменилась, потому что стандарт добавлен до экстракции.","lc2":"Стандарт добавлен после экстракции и потери не учитывает: площадь пика метаболита уменьшилась, а оценка количества занижена.","bl_same":"Отношение сигналов осталось прежним, и изменение доли ацетилированного гистона не показано, даже если отдельные полосы стали слабее.","bl_low":"Отношение H3K9ac к общему H3 снизилось: о меньшей доле ацетилированного гистона можно говорить, если сигналы лежат в линейном диапазоне и антитело специфично.","bl_high":"Отношение H3K9ac к общему H3 выросло: о большей доле ацетилированного гистона можно говорить, если сигналы лежат в линейном диапазоне и антитело специфично.","bl_sat":"Одна из полос вышла за линейный диапазон, поэтому измеренное отношение не равно истинному.","dt_same":"Сигнал на единицу ДНК не изменился: доля 5hmC в суммарной ДНК не отличается от контроля, хотя общий сигнал точек мог измениться из-за разного количества ДНК.","dt_low":"Сигнал на единицу ДНК снизился: относительное содержание 5hmC в суммарной ДНК ниже, чем в контроле; причину (скорость TET или другое) метод не определяет.","dt_high":"Сигнал на единицу ДНК вырос: относительное содержание 5hmC в суммарной ДНК выше, чем в контроле; причину (скорость TET или другое) метод не определяет.","ch0":"Контроль: с антителом к ацетилированному H3 ДНК промотора Glut4 осаждается намного сильнее, чем с неспецифическими IgG. Разница показывает, что сигнал не сводится к неспецифическому осаждению; специфичность самого антитела к модификации проверяют отдельно (Egelhofer и соавт., 2011).","ch1":"При подавлении ACLY обогащение промотора Glut4 с антителом к ацетилированному H3 снижено, а сигнал IgG прежний: ацетилирование гистонов на этом участке уменьшилось. Так было в адипоцитах 3T3-L1 (Wellen и соавт., 2009); высота столбцов условная.","ch2":"При подавленной ACLY ацетат возвращает обогащение промотора Glut4: ацетил-CoA образуется из ацетата ферментом ACSS2. В работе Wellen и соавт. (2009) ацетат возвращал ацетилирование H3 и H4 на этом промоторе; высота столбцов условная."},"chip_label":"Образец (по схеме опыта Wellen и соавт., 2009)","chip_opts":["контроль","подавление ACLY","подавление ACLY + ацетат"],"chip_ab":"антитело к ацетил-H3","chip_igg":"IgG (контроль антитела)","chip_axis":"ДНК промотора Glut4 в осадке, доля от входной ДНК (усл. ед.)","chip_axis_n":"Glut4 в осадке, доля от входной ДНК","chip_groups":["контроль","ACLY ↓","ACLY ↓\n+ ацетат"],"chip_vals":{"ab":[100,45,90],"igg":[8,8,8]},"m_ch":["С антителом к ацетил-H3, % от контрольного образца","С IgG, усл. ед."]}}},{"id":"nad-redox","number":22,"section":3,"title":"Что означает отношение NADH/NAD⁺ в конкретном компартменте","question":4,"questions":[4],"keywords":["NAD⁺","NADH","отношение NADH/NAD⁺","общий пул","компартмент","свободный и связанный кофермент","окисленная форма","восстановленная форма","сиртуины"],"lead":["[[T64|Отношение NADH/NAD⁺]] — частное содержаний восстановленной и окисленной форм кофермента в одном компартменте.","Оно не задаёт ни общее количество кофермента, ни универсальную норму для клетки."],"mechanism":["NAD⁺ принимает от субстрата гидрид-ион и превращается в NADH, а в обратной реакции NADH отдаёт электроны акцептору.","Отношение форм описывает окислительно-восстановительное состояние пары, а сумма NAD⁺ и NADH — размер пула; при одном отношении пул может быть разным.","Мембраны свободно не пропускают NAD(H), поэтому у цитозоля и матрикса отдельные пулы и свои отношения форм; электроны между ними переносят челночные системы."],"paragraphs":["Никотинамидадениндинуклеотид существует в окисленной (NAD⁺) и восстановленной (NADH) формах. В реакциях дегидрогеназ NAD⁺ принимает от субстрата гидрид-ион, то есть два электрона и протон, и превращается в NADH; в обратной реакции NADH отдаёт эти электроны акцептору, как в реакции лактатдегидрогеназы (см. шаг про образование лактата). Частное содержаний двух форм, отношение NADH/NAD⁺, характеризует окислительно-восстановительное состояние пары, а сумма NAD⁺ и NADH составляет общий пул.","Отношение и пул — разные величины. Рассмотрим два состояния с одинаковым отношением 0,1 (учебные значения). В первом пул равен 110 условным единицам: 100 приходится на NAD⁺ и 10 на NADH. Во втором пул вдвое меньше, 55 единиц: 50 на NAD⁺ и 5 на NADH. Отношение прежнее, а количество NAD⁺ уменьшилось вдвое. Отношение NADH/NAD⁺ не равно доле NADH в пуле: в первом состоянии она составляет 10/110, то есть около 0,09.","Отношение определяют для конкретного компартмента. Внутренняя мембрана митохондрий свободно не пропускает NAD(H) и NADP(H), а электроны между цитозолем и митохондриями передают многоступенчатые челночные системы (Lewis и соавт., 2014). Для самого NAD⁺ описан митохондриальный переносчик SLC25A51 (Luongo и соавт., 2020), так что обмен NAD⁺ между компартментами возможен, но у цитозоля и матрикса остаются отдельные пулы и свои отношения форм, и значение для одного компартмента нельзя переносить на другой или на клетку в целом.","Результат зависит и от того, какую форму кофермента измеряют: свободную или связанную с белками. Часть кофермента связана с белками, причём NADH — в большей степени, чем NAD⁺, поэтому отношение суммарных форм в образце может намного превышать отношение свободных форм в живой клетке (Hung и соавт., 2011; измерение свободных форм сенсорами показано в шаге про сенсоры NADH/NAD⁺ и H₂O₂). Отношение меняется при реакциях образования и окисления NADH, а размер пула — при синтезе кофермента из предшественников и при его расходовании ферментами, не окисляющими NADH. К ним относятся сиртуины и PARP: они используют NAD⁺ как субстрат, а концентрация свободного NAD⁺ в компартментах близка к константам Михаэлиса этих ферментов (Cambronne и соавт., 2016). Универсальной нормы NADH/NAD⁺ нет: значение зависит от типа клеток, компартмента и способа измерения."],"trap":["Если отношение NADH/NAD⁺ не изменилось, то и количество NAD⁺ осталось прежним.","Отношение двух форм не задаёт размер пула. При том же отношении общее количество кофермента, а с ним и количество NAD⁺, может быть другим."],"conditions":"Схема — расчёт по заданным учебным значениям: отношения, размеры пула и доли связанных форм не взяты из опыта и не являются нормой. Раздельность пулов описана в работе Lewis и соавт. (2014), а более сильное связывание NADH белками — в работе Hung и соавт. (2011); обе прочитаны в полном тексте. Близость содержания свободного NAD⁺ к константам Михаэлиса сиртуинов и PARP — по аннотации работы Cambronne и соавт. (2016); переносчик SLC25A51 — по аннотации работы Luongo и соавт. (2020). Синтез NAD⁺ из предшественников — общепринятое положение без отдельного прочитанного источника.","sources":["LEWIS","HUNG","CAMBRONNE","LUONGO"],"quiz":{"id":"S8-L22","rev":2,"question":"В обоих состояниях NADH/NAD⁺ = 1/4, но общий пул во втором состоянии втрое меньше. Как соотносятся количества NAD⁺ в этих состояниях?","options":[{"id":"S8-L22-2","text":"Количество NAD⁺ в состояниях одинаково, поскольку отношение форм не изменилось.","correct":false,"feedback":"Отношение не задаёт абсолютное количество кофермента: при том же отношении оно зависит от размера пула."},{"id":"S8-L22-1","text":"Во втором состоянии NAD⁺ втрое меньше, хотя отношение форм одинаково.","correct":true,"feedback":"При неизменном отношении уменьшение общего пула во столько же раз уменьшает обе формы."},{"id":"S8-L22-3","text":"Во втором состоянии NAD⁺ в четыре раза меньше, поскольку NADH/NAD⁺ = 1/4.","correct":false,"feedback":"Отношение форм не задаёт, во сколько раз меняется количество NAD⁺: оно уменьшается во столько же раз, во сколько уменьшен пул."}]},"widget":{"kind":"s4_nad","title":"","s":{"title":"Отношение NADH/NAD⁺ и размер пула","status":"Расчёт по заданным параметрам · учебные значения, не нормы клетки","modes_label":"Что сравнить","modes":["Одно отношение, разный пул","Два компартмента","Свободная и связанная часть"],"sl_v":"NADH на 100 NAD⁺","sl_pool":"Пул состояния Б, усл. ед.","sl_vc":"Цитозоль: NADH на 100 NAD⁺","sl_vm":"Матрикс: NADH на 100 NAD⁺","sl_bn":"Связано с белками: NAD⁺, %","sl_bh":"Связано с белками: NADH, %","rowA":"Состояние А","rowB":"Состояние Б","rowC":"Цитозоль","rowM":"Матрикс","rowT":"Суммарные формы","rowF":"Свободные формы","l_np":"NAD⁺","l_nh":"NADH","l_bound":"связано с белками (штриховка)","unit":"усл. ед.","na":"не определено","mm0":["NAD⁺, состояние А","NAD⁺, состояние Б","NADH/NAD⁺ в обоих","Доля NADH в пуле"],"mm1":["NADH/NAD⁺ в цитозоле","NADH/NAD⁺ в матриксе","Пул цитозоля","Пул матрикса"],"mm2":["NADH/NAD⁺ суммарных форм","NADH/NAD⁺ свободных форм","Свободный NAD⁺","Свободный NADH"],"notes":["Отношение NADH/NAD⁺ в обоих состояниях одинаково, а количество NAD⁺ различается пропорционально пулу. Доля NADH в пуле — другая величина: она не равна отношению.","Компартменты имеют отдельные пулы, и отношения в них могут различаться. Значения заданы произвольно: ни один компартмент не принят за эталон.","Отношение суммарных форм и отношение свободных форм различаются, если доли, связанные с белками, у двух форм неодинаковы. Доли заданы произвольно; в клетке их определяют опытом."]}}},{"id":"ros-sources","number":23,"section":3,"title":"От чего зависит образование супероксида в митохондриях","question":4,"questions":[4],"keywords":["супероксид","O₂•⁻","комплекс I","FMN","Q-пул","протондвижущая сила","обратный перенос электронов","реперфузия","сукцинат"],"lead":["В дыхательной цепи электроны в основном передаются O₂ в комплексе IV с образованием воды, но при переносе одного электрона на O₂ на других участках цепи возникает [[T67|супероксид-анион-радикал]].","Скорость его образования зависит от участка цепи и состояния переносчиков, а не от одного отношения NADH/NAD⁺."],"mechanism":["Присоединение одного электрона к O₂ даёт супероксид; скорость этой побочной реакции определяют доля восстановленного донора в данном участке и содержание O₂.","На флавине FMN комплекса I супероксид образуется при высоком NADH/NAD⁺ в матриксе; при обратном переносе электронов от восстановленного Q-пула место его образования остаётся предметом обсуждения (флавин или участок связывания Q).","Обратный перенос идёт при высокой протондвижущей силе и резко подавляется при её небольшом снижении, поэтому одинаковое отношение NADH/NAD⁺ не гарантирует одинаковой скорости образования супероксида."],"paragraphs":["В дыхательной цепи O₂ в основном восстанавливается до воды: в комплексе IV он принимает четыре электрона. Супероксид (O₂•⁻) возникает в побочной реакции, когда восстановленный переносчик, например флавин, отдаёт молекуле O₂ один электрон. Супероксид относится к [[T66|активным формам кислорода]] (АФК). В матриксе он быстро превращается в H₂O₂ ферментативно (см. шаг про удаление H₂O₂), поэтому его содержание мало, и рассматривают прежде всего скорость его образования.","Первый источник — флавин FMN комплекса I. Электроны от NADH поступают на FMN, и доля полностью восстановленного FMN определяется отношением NADH/NAD⁺ в матриксе. Если это отношение высоко, например при нарушении цепи, скорость образования супероксида на FMN возрастает; протондвижущая сила влияет на это образование лишь косвенно, через потребление NADH и степень восстановленности переносчиков (Murphy, 2009).","Второй источник — [[T76|обратный перенос электронов]] (RET). Если Q-пул восстановлен, а протондвижущая сила (Δp) высока, электроны из Q-пула могут идти через комплекс I в обратном направлении (к NAD⁺ и O₂), и скорость образования супероксида высока. Q-пул восстанавливается, например, когда сукцинат окисляется сукцинатдегидрогеназой. Место образования супероксида при RET остаётся предметом обсуждения: Murphy (2009) допускал участок связывания Q, а Pryde и Hirst (2011) на субмитохондриальных частицах сердца быка связали и этот процесс с восстановленным флавином. Ротенон подавляет RET, но при прямом переносе от NADH усиливает образование супероксида. RET очень сильно зависит от Δp: небольшое её снижение резко подавляет образование супероксида (Murphy, 2009).","Супероксид образуют и другие участки, например Qo-участок комплекса III и 2-оксокислотные дегидрогеназы; вклад зависит от ткани, субстрата и условий. В изолированных митохондриях без антимицина A вклад комплекса III обычно меньше вклада комплекса I (Murphy, 2009; Brand, 2016). В модели ишемии и реперфузии сердца мыши сукцинат накапливался при ишемии, а при восстановлении кровотока быстро окислялся; по заключению авторов, это поддерживало образование АФК при RET (Chouchani и соавт., 2014). У дрозофилы АФК, образованные при RET через комплекс I, продлевали жизнь (Scialò и соавт., 2016): действие АФК зависит от места образования, а не только от количества. Обе работы получены на моделях и не переносятся на другие ткани."],"trap":["Чем выше NADH/NAD⁺, тем быстрее митохондрии образуют супероксид.","Общей зависимости нет: скорость задают источник электронов, субстрат и направление переноса. Одно отношение NADH/NAD⁺ эти различия не отражает."],"conditions":"Схема качественная: состояния показаны условно, измеренных значений нет. Источники и режимы описаны для изолированных митохондрий в обзоре Murphy (2009, полный текст); место образования супероксида при RET Murphy называет неясным, а Pryde и Hirst (2011, аннотация) связывают с флавином. Вклад других участков — по Brand (2016, аннотация). Реперфузионный механизм получен на модели сердца мыши (Chouchani и соавт., 2014, полный текст); роль RET при избыточном восстановлении Q-пула у дрозофилы показана Scialò и соавт. (2016, полный текст).","sources":["MURPHY","PRYDE","BRAND","CHOUCHANI","SCIALO"],"quiz":{"id":"S8-L23","rev":2,"question":"Почему одинаковое отношение NADH/NAD⁺ не гарантирует одинаковую скорость образования митохондриального супероксида?","options":[{"id":"S8-L23-2","text":"Потому что скорость определяется суммарным пулом NAD⁺ и NADH, а не отношением этих форм.","correct":false,"feedback":"На каждом источнике скорость зависит от восстановленности его донора электронов и от условий, а не от размера пула NAD(H) как такового."},{"id":"S8-L23-1","text":"Потому что у источников своя зависимость: при RET скорость связана с Q-пулом и протондвижущей силой.","correct":true,"feedback":"При RET скорость зависит от восстановленности Q-пула и протондвижущей силы, а не только от отношения NADH/NAD⁺."},{"id":"S8-L23-3","text":"Потому что основная часть супероксида образуется в комплексе IV при восстановлении O₂ до воды.","correct":false,"feedback":"В комплексе IV O₂ принимает четыре электрона и превращается в воду; супероксид возникает в побочной реакции на других участках."}]},"widget":{"kind":"net","title":"","s":{"title":"Участки образования супероксида в дыхательной цепи","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"cond","type":"group","label":"Условия в митохондрии","opts":["Окисление NADH, синтез ATP","Высокое NADH/NAD⁺ в матриксе","Окисление сукцината, Q-пул восстановлен"]},{"id":"dp","type":"group","label":"Протондвижущая сила","opts":["исходная","сниженная"]}],"W":640,"H":250,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":92,"w":628,"h":152,"c":"mito","t":"матрикс","lx":16,"ly":112,"n":[4,4,186,432]}],"mem":[{"x1":14,"y1":82,"x2":626,"y2":82,"t":"внутренняя мембрана митохондрий","lx":14,"ly":50,"n":[190,20,190,424,202,26],"tn":"мембрана"}],"nodes":{"nad":{"p":[80,185,112,40],"t":"NADH/NAD⁺","n":[62,76,96,40]},"i":{"p":[110,82,44,40],"t":"I","n":[190,76,44,40]},"sup":{"p":[205,185,68,40],"t":"O₂•⁻","n":[70,166,68,40]},"q":{"p":[290,82,76,40],"t":"Q-пул","n":[190,181,76,40]},"ii":{"p":[300,185,48,40],"t":"II","n":[100,241,48,40]},"iii":{"p":[420,82,52,40],"t":"III","n":[190,286,52,40]},"suc":{"p":[440,185,100,40],"t":"сукцинат","n":[60,336,100,40]},"iv":{"p":[560,82,48,40],"t":"IV","n":[190,391,48,40]},"h2o":{"p":[560,185,64,40],"t":"H₂O","n":[70,401,64,40]}},"edges":{"en":{"a":"nad","b":"i","k":"rx","t":"e⁻ от NADH","d":[-34,0],"dn":[0,-10]},"enr":{"a":"i","b":"nad","k":"rx","t":"NAD⁺ → NADH","d":[-44,0],"dn":[0,-12],"s":"hide"},"eiq":{"a":"i","b":"q","k":"rx","t":"e⁻ к Q","d":[0,-14],"bend":34,"bn":-34},"ret":{"a":"q","b":"i","k":"rx","t":"RET","d":[0,16],"bend":34,"bn":-34,"s":"hide"},"eqiii":{"a":"q","b":"iii","k":"rx","t":"e⁻","d":[0,-12],"dn":[26,0]},"eivc":{"a":"iii","b":"iv","k":"rx","t":"цит. c","d":[0,-12],"dn":[26,0]},"eivh":{"a":"iv","b":"h2o","k":"rx","t":"O₂ → H₂O","d":[40,0],"dn":[0,-10]},"eiiq":{"a":"ii","b":"q","k":"rx","t":"e⁻","d":[22,0],"dn":[26,0]},"esuc":{"a":"suc","b":"ii","k":"rx","t":"окисление","d":[0,-12],"dn":[30,0]},"esup":{"a":"i","b":"sup","k":"rx","t":"O₂ + e⁻","d":[-8,0],"dn":[34,0]}},"st":{"0-0":{"n":{},"e":{},"m":[["Источник электронов","NADH"],["Направление в комплексе I","прямое"],["Главный участок O₂•⁻","мало: побочная реакция"]],"note":"NADH окисляется комплексом I, электроны идут по цепи к O₂ в комплексе IV, и вода образуется основным путём. Переносчики окислены, образование супероксида невелико.","bars":[["Восстановленность Q-пула",1],["Протондвижущая сила Δp",2],["Образование O₂•⁻",1]]},"0-1":{"n":{},"e":{},"m":[["Источник электронов","NADH"],["Направление в комплексе I","прямое"],["Главный участок O₂•⁻","мало: побочная реакция"]],"note":"Перенос электронов идёт в прямом направлении и при сниженной Δp. Основной путь остаётся прежним; образование супероксида по-прежнему невелико.","bars":[["Восстановленность Q-пула",1],["Протондвижущая сила Δp",1],["Образование O₂•⁻",1]]},"1-0":{"n":{"nad":"on","sup":"on"},"e":{},"m":[["Источник электронов","NADH"],["Направление в комплексе I","прямое"],["Главный участок O₂•⁻","FMN комплекса I"]],"note":"Отношение NADH/NAD⁺ в матриксе высоко, FMN сильно восстановлен, и часть электронов переходит на O₂ с образованием супероксида. Это первый из двух участков комплекса I.","bars":[["Восстановленность Q-пула",1],["Протондвижущая сила Δp",2],["Образование O₂•⁻",2]]},"1-1":{"n":{"nad":"on","sup":"on"},"e":{},"m":[["Источник электронов","NADH"],["Направление в комплексе I","прямое"],["Главный участок O₂•⁻","FMN комплекса I"]],"note":"Образование супероксида на FMN определяется долей восстановленного флавина; Δp влияет на это образование лишь косвенно, через потребление NADH и восстановленность переносчиков. При сниженной Δp образование на FMN сохраняется.","bars":[["Восстановленность Q-пула",1],["Протондвижущая сила Δp",1],["Образование O₂•⁻",2]]},"2-0":{"n":{"nad":"base","q":"on","sup":"on","ii":"on","suc":"on","i":"on","iii":"base","iv":"base"},"e":{"en":"hide","eiq":"off","ret":"on","enr":"on","eiiq":"on","esuc":"on"},"m":[["Источник электронов","сукцинат"],["Направление в комплексе I","обратное (RET)"],["Главный участок O₂•⁻","комплекс I; участок обсуждается"]],"note":"Сукцинат окисляется комплексом II, Q-пул восстановлен, и исходная протондвижущая сила здесь высокая, что поддерживает RET. Электроны из Q-пула идут через комплекс I в обратном направлении, и скорость образования супероксида высока; место его образования при RET остаётся предметом обсуждения. Так выглядит RET.","bars":[["Восстановленность Q-пула",3],["Протондвижущая сила Δp",3],["Образование O₂•⁻",3]],"et":{}},"2-1":{"n":{"nad":"base","q":"on","sup":"low","ii":"on","suc":"on","i":"base","iii":"on","iv":"on"},"e":{"en":"off","eiq":"off","ret":"off","eiiq":"on","esuc":"on"},"m":[["Источник электронов","сукцинат"],["Направление в комплексе I","RET не идёт"],["Главный участок O₂•⁻","мало"]],"note":"При сниженной Δp обратный перенос через комплекс I резко подавляется: этот путь очень сильно зависит от Δp. Электроны от сукцината идут к комплексам III и IV, и образование супероксида невелико.","bars":[["Восстановленность Q-пула",3],["Протондвижущая сила Δp",1],["Образование O₂•⁻",1]]}},"base":{"n":{"i":"on","iii":"on","iv":"on","h2o":"met","sup":"low","ii":"off","suc":"off"},"e":{"eiiq":"off","esuc":"off","ret":"hide","enr":"hide"}}}}},{"id":"h2o2-removal","number":24,"section":3,"title":"Как образование и удаление H₂O₂ формируют его содержание","question":4,"questions":[4],"keywords":["SOD","дисмутация","H₂O₂","пероксиредоксин","глутатионпероксидаза","каталаза","баланс образования и удаления","содержание и скорость образования","Prx3"],"lead":["[[T69|Супероксиддисмутаза]] превращает супероксид в [[T68|пероксид водорода]] и O₂, но не удаляет окислитель полностью.","Содержание H₂O₂ определяется соотношением скоростей его образования и ферментативного удаления."],"mechanism":["SOD ускоряет дисмутацию двух молекул супероксида до H₂O₂ и O₂; нерадикальный H₂O₂ остаётся и удаляется другими ферментами.","H₂O₂ восстанавливают до воды пероксиредоксины (в матриксе, в частности, Prx3) и глутатионпероксидазы, а каталаза, находящаяся преимущественно в пероксисомах, разлагает его на воду и O₂.","При постоянной скорости образования содержание H₂O₂ достигает значения, при котором скорость удаления равна скорости образования; замедление удаления повышает это значение."],"paragraphs":["Супероксид превращается в H₂O₂ реакцией дисмутации: 2 O₂•⁻ + 2 H⁺ → H₂O₂ + O₂. Её ускоряет SOD; в матриксе митохондрий действует форма с марганцем, MnSOD, а спонтанная дисмутация при этом вносит малый вклад (Murphy, 2009). Продукт реакции — H₂O₂, а не вода, поэтому SOD снижает содержание супероксида, но не удаляет активные формы кислорода в целом. H₂O₂ не является радикалом и относительно стабилен, поэтому способен диффундировать от места образования (Pak и соавт., 2020); время жизни H₂O₂ в клетке задают системы его удаления.","Удаляют H₂O₂ три группы ферментов. [[T70|Пероксиредоксины]] (Prx) восстанавливают его до воды за счёт тиола каталитического цистеина; у типичных 2-Cys-пероксиредоксинов окисленный фермент затем восстанавливается тиоредоксином (Trx), а окисленный Trx — тиоредоксинредуктазой за счёт NADPH (см. шаг про NADPH и антиоксидантные системы). Глутатионпероксидазы (GPx) восстанавливают H₂O₂ за счёт глутатиона (GSH), который окисляется до GSSG. Каталаза превращает две молекулы H₂O₂ в воду и O₂ и находится преимущественно в пероксисомах. Какой путь работает, зависит от локализации: в матриксе митохондрий действует, в частности, Prx3.","Содержание H₂O₂ задаётся соотношением скоростей его образования и удаления. Изменение количества H₂O₂ (N) в одном компартменте, как и для метаболического пула, описывает уравнение dN/dt = J(обр) − J(уд), где J(обр) и J(уд) — скорости образования и удаления. Если скорость удаления пропорциональна количеству, J(уд) = k·N (k — константа скорости удаления), то при постоянном образовании количество стремится к J(обр)/k, и уменьшение k вдвое удваивает его. Это учебная модель без числовых значений.","Итак, скорость образования окислителя и его содержание — разные величины. Окислительное повреждение — третья величина: оно зависит ещё от мишеней и длительности воздействия (см. шаг про окислительное повреждение). Локализация ферментов тоже важна: подавление каталазы пероксисом прямо не меняет удаление H₂O₂ в матриксе, где действуют Prx3 и GPx."],"trap":["Супероксиддисмутаза удаляет активные формы кислорода из клетки.","SOD превращает супероксид в H₂O₂ и O₂. Образовавшийся H₂O₂ удаляют другие ферменты, поэтому SOD снижает содержание супероксида, но не удаляет все АФК."],"conditions":"Схема качественная: состояния показаны условно, числовых значений нет. Дисмутация и MnSOD в матриксе — по обзору Murphy (2009, полный текст); участие Prx, GPx и тиоредоксиновой и глутатионовой систем — по введению работы Pak и соавт. (2020, полный текст); каталаза пероксисом — по обзору Sies и соавт. (2024). Положение Prx3 и GPx в матриксе — общепринятые сведения, которые отдельным прочитанным источником здесь не подтверждены.","sources":["MURPHY","PAK","SIES"],"quiz":{"id":"S8-L24","rev":2,"question":"Скорость образования H₂O₂ не изменилась, а скорость его ферментативного удаления снизилась. Как изменится содержание H₂O₂ в компартменте при прочих равных?","options":[{"id":"S8-L24-1","text":"Увеличится до нового состояния баланса скоростей образования и удаления.","correct":true,"feedback":"Содержание H₂O₂ задаётся соотношением скоростей образования и удаления; при замедлении удаления оно растёт до нового баланса."},{"id":"S8-L24-2","text":"Уменьшится, поскольку при замедлении удаления снижается и скорость образования H₂O₂.","correct":false,"feedback":"По условию скорость образования не изменилась; снижена именно скорость удаления."},{"id":"S8-L24-3","text":"Не изменится, поскольку содержание H₂O₂ определяется скоростью его образования.","correct":false,"feedback":"Скорость удаления также входит в баланс, поэтому её снижение меняет содержание."}]},"widget":{"kind":"net","title":"","s":{"title":"Образование и удаление H₂O₂","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"prod","type":"group","label":"Образование супероксида","opts":["исходное","усиленное"]},{"id":"blk","type":"group","label":"Ослаблено удаление через","opts":["ничего","Prx3","GPx","каталазу"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":440,"h":288,"c":"mito","t":"матрикс митохондрии","lx":16,"ly":24,"n":[4,4,332,300]},{"x":458,"y":6,"w":176,"h":288,"c":"lyso","t":"пероксисома","lx":468,"ly":24,"n":[4,316,332,120],"tn":"пероксисома"}],"mem":[],"nodes":{"sup":{"p":[44,150,56,40],"t":"O₂•⁻","n":[46,80,56,40]},"sod":{"p":[160,150,60,40],"t":"SOD","n":[162,80,56,40]},"h2o2":{"p":[285,150,68,40],"t":"H₂O₂","n":[284,80,68,40]},"prx":{"p":[400,70,68,40],"t":"Prx3","n":[90,200,68,40]},"gpx":{"p":[400,230,60,40],"t":"GPx","n":[300,200,60,40]},"cat":{"p":[546,150,126,52],"t":"каталаза\n→ H₂O + O₂","n":[170,390,126,52]}},"edges":{"a":{"a":"sup","b":"sod","k":"rx","t":"2 O₂•⁻ + 2 H⁺","d":[0,-12],"dn":[0,-12]},"b":{"a":"sod","b":"h2o2","k":"rx","t":"+ O₂","d":[0,-12],"dn":[0,-12]},"c":{"a":"h2o2","b":"prx","k":"rx","t":"→ 2 H₂O","d":[-46,-10],"dn":[-8,-8]},"d":{"a":"h2o2","b":"gpx","k":"rx","t":"→ 2 H₂O","d":[-46,16],"dn":[26,0]},"e":{"a":"h2o2","b":"cat","k":"tr","t":"возможный обмен;\nвне расчёта","tn":"обмен вне\nрасчёта","d":[0,-24],"dn":[58,0],"dash":true}},"st":{"0-0":{"n":{"sup":"base","sod":"base","h2o2":"base"},"e":{},"m":[["Образование H₂O₂","исходное"],["Удаление в матриксе","не ослаблено"],["Содержание H₂O₂ в матриксе","исходное"]],"note":"Образование и удаление уравновешены, содержание H₂O₂ в матриксе постоянно. Пути удаления в матриксе (Prx3, GPx) работают.","bars":[["Образование H₂O₂",2],["Удаление в матриксе",3],["Содержание H₂O₂ в матриксе",1]]},"0-1":{"n":{"sup":"base","sod":"base","h2o2":"on","prx":"off"},"e":{"c":"off"},"m":[["Образование H₂O₂","исходное"],["Удаление в матриксе","ослаблено"],["Содержание H₂O₂ в матриксе","выше исходного"]],"note":"Образование прежнее, но Prx3 подавлен. Удаление медленнее, и содержание H₂O₂ в матриксе возрастает до нового баланса.","bars":[["Образование H₂O₂",2],["Удаление в матриксе",2],["Содержание H₂O₂ в матриксе",2]]},"0-2":{"n":{"sup":"base","sod":"base","h2o2":"on","gpx":"off"},"e":{"d":"off"},"m":[["Образование H₂O₂","исходное"],["Удаление в матриксе","ослаблено"],["Содержание H₂O₂ в матриксе","выше исходного"]],"note":"Образование прежнее, но GPx подавлена. Содержание H₂O₂ в матриксе возрастает до нового баланса; другие пути удаления сохранены.","bars":[["Образование H₂O₂",2],["Удаление в матриксе",2],["Содержание H₂O₂ в матриксе",2]]},"0-3":{"n":{"sup":"base","sod":"base","h2o2":"base","cat":"off"},"e":{},"m":[["Образование H₂O₂","исходное"],["Удаление в матриксе","не ослаблено"],["Содержание H₂O₂ в матриксе","исходное"]],"note":"Каталаза находится преимущественно в пероксисомах, поэтому её подавление прямо не меняет удаление H₂O₂ в матриксе: там его удаляют Prx3 и GPx. Влияние обмена H₂O₂ между компартментами эта локальная модель не рассчитывает.","bars":[["Образование H₂O₂",2],["Удаление в матриксе",3],["Содержание H₂O₂ в матриксе",1]]},"1-0":{"n":{"sup":"on","sod":"on","h2o2":"on"},"e":{},"m":[["Образование H₂O₂","усилено"],["Удаление в матриксе","не ослаблено"],["Содержание H₂O₂ в матриксе","выше исходного"]],"note":"Образование H₂O₂ усилено, а удаление не изменилось: равенство потоков восстанавливается при более высоком содержании H₂O₂.","bars":[["Образование H₂O₂",3],["Удаление в матриксе",3],["Содержание H₂O₂ в матриксе",2]]},"1-1":{"n":{"sup":"on","sod":"on","h2o2":"on","prx":"off"},"e":{"c":"off"},"m":[["Образование H₂O₂","усилено"],["Удаление в матриксе","ослаблено"],["Содержание H₂O₂ в матриксе","значительно выше"]],"note":"Образование усилено, а удаление через Prx3 ослаблено: оба изменения сдвигают баланс в одну сторону, содержание H₂O₂ выше.","bars":[["Образование H₂O₂",3],["Удаление в матриксе",2],["Содержание H₂O₂ в матриксе",3]]},"1-2":{"n":{"sup":"on","sod":"on","h2o2":"on","gpx":"off"},"e":{"d":"off"},"m":[["Образование H₂O₂","усилено"],["Удаление в матриксе","ослаблено"],["Содержание H₂O₂ в матриксе","значительно выше"]],"note":"Образование усилено, а удаление через GPx ослаблено: содержание H₂O₂ в матриксе выше, чем при каждом из изменений в отдельности.","bars":[["Образование H₂O₂",3],["Удаление в матриксе",2],["Содержание H₂O₂ в матриксе",3]]},"1-3":{"n":{"sup":"on","sod":"on","h2o2":"on","cat":"off"},"e":{},"m":[["Образование H₂O₂","усилено"],["Удаление в матриксе","не ослаблено"],["Содержание H₂O₂ в матриксе","выше исходного"]],"note":"Образование H₂O₂ усилено, каталаза пероксисом подавлена. В этой локальной модели ферменты удаления H₂O₂ в матриксе не подавлены, а влияние обмена H₂O₂ между компартментами не рассчитывается.","bars":[["Образование H₂O₂",3],["Удаление в матриксе",3],["Содержание H₂O₂ в матриксе",2]]}}}}},{"id":"nadph-defense","number":25,"section":3,"title":"Как NADPH поддерживает восстановление антиоксидантных систем","question":4,"questions":[4],"keywords":["NADPH","NADP⁺","глутатионредуктаза","тиоредоксинредуктаза","глутатион","тиоредоксин","пентозофосфатный путь","NOX","трансгидрогеназа"],"lead":["Пара [[T65|NADPH/NADP⁺]] отличается от пары NADH/NAD⁺ дополнительной фосфатной группой и набором реакций.","За счёт NADPH восстанавливаются глутатион и тиоредоксин — компоненты [[T72|глутатионовой системы]] и [[T71|тиоредоксиновой системы]], которые поддерживают работу ферментов удаления H₂O₂."],"mechanism":["Глутатионредуктаза восстанавливает GSSG до GSH за счёт NADPH, а GSH необходим глутатионпероксидазе для восстановления H₂O₂.","Тиоредоксинредуктаза восстанавливает тиоредоксин за счёт NADPH, а тиоредоксин восстанавливает окисленные пероксиредоксины и другие белки.","NADPH образуется в нескольких реакциях и расходуется не только в системах защиты, но и NADPH-оксидазой, которая образует супероксид."],"paragraphs":["Пары NADH/NAD⁺ и NADPH/NADP⁺ различаются: NADPH содержит дополнительную фосфатную группу, и ферменты различают эти коферменты. NADH в основном передаёт электроны дыхательной цепи, а NADPH используется в восстановительных биосинтезах и в системах защиты от окислителей, хотя чёткой границы между ними нет: восстановление окислительных модификаций обеспечивают оба кофермента (Sies и соавт., 2024). Содержание NADPH в клетке невелико и непрерывно обновляется, поэтому по нему одному нельзя судить о скорости использования NADPH, то есть о потоке.","От NADPH начинаются две цепи. В глутатионовой системе глутатионредуктаза (GR) переносит электроны с NADPH на окисленный глутатион (GSSG), а восстановленный глутатион (GSH) служит донором электронов для глутатионпероксидазы (GPx), которая восстанавливает H₂O₂ до воды. В тиоредоксиновой системе тиоредоксинредуктаза (TrxR) передаёт электроны с NADPH на тиоредоксин (Trx), а тиоредоксин восстанавливает окисленные пероксиредоксины (Prx). Электроны от звена к звену передают конкретные ферменты (GR, TrxR, Trx, Prx); NADPH не восстанавливает H₂O₂ напрямую (Pak и соавт., 2020).","NADPH образуется в окислительной ветви пентозофосфатного пути и в реакциях фолатного обмена (ферменты MTHFD). Его образуют также малик-фермент (малат → пируват) и изоцитратдегидрогеназы IDH1 (цитозоль) и IDH2 (митохондрии) — в прямой реакции изоцитрат → α-кетоглутарат. При восстановительном карбоксилировании (α-кетоглутарат → изоцитрат; см. шаг про образование цитрата из α-кетоглутарата) те же ферменты, напротив, расходуют NADPH. Трансгидрогеназа внутренней мембраны митохондрий тоже образует NADPH: при высокой протондвижущей силе она переносит электроны с NADH на NADP⁺, а направление реакции зависит от Δp и соотношения пар. Вклад путей зависит от клеток и компартмента. В клетках рака лёгкого A549 и H1299 по включению ²H из [3-²H]глюкозы в липогенный NADPH окислительная ветвь пентозофосфатного пути вносила заметный вклад, а вклад MTHFD1 был минимальным (Lewis и соавт., 2014); в пролиферирующих клетках в другой работе обнаружен вклад одноуглеродного обмена с серином, почти сопоставимый с вкладом пентозофосфатного пути (Fan и соавт., 2014).","NADPH расходуется не только в защите. NADPH-оксидазы (NOX) передают с него электроны на O₂ и образуют супероксид или H₂O₂, поэтому по содержанию NADPH одному нельзя судить об эффективности защиты: результат зависит от ферментов, локализации и скорости регенерации кофермента."],"trap":["NADPH восстанавливает H₂O₂ и другие окислители напрямую, поэтому чем его больше, тем сильнее защита.","NADPH отдаёт электроны ферментам GR и TrxR. H₂O₂ удаляют GPx и Prx, а результат зависит также от локализации и от скорости регенерации NADPH, который расходуется и в реакции NOX."],"conditions":"Схема качественная, числовых значений нет. Различие вкладов путей в образование NADPH получено на конкретных клеточных линиях (Lewis и соавт., 2014 — полный текст; Fan и соавт., 2014 — прочитана аннотация: наибольший вклад окислительного ПФП и почти сопоставимый — одноуглеродного обмена) и не обобщается на все клетки. Реакция трансгидрогеназы, малик-фермент (кроме упоминания в аннотации Fan и соавт.), направление реакций IDH и роль NADPH в синтезе — общепринятые сведения, отдельным прочитанным источником здесь не подтверждённые.","sources":["SIES","LEWIS","FAN","PAK"],"quiz":{"id":"S8-L25","rev":2,"question":"Как снижение доступности NADPH для глутатионредуктазы отразится на удалении H₂O₂ глутатионпероксидазой при сохранённой скорости образования H₂O₂?","options":[{"id":"S8-L25-1","text":"Скорость удаления снизится, потому что GSSG медленнее восстанавливается до GSH, который нужен глутатионпероксидазе.","correct":true,"feedback":"NADPH поддерживает оборот восстановленной формы глутатиона через редуктазу, а GSH необходим глутатионпероксидазе."},{"id":"S8-L25-2","text":"Скорость удаления не изменится, потому что глутатионпероксидаза получает электроны от NADPH напрямую, минуя глутатион.","correct":false,"feedback":"Глутатионпероксидаза получает электроны от GSH; NADPH передаёт электроны глутатионредуктазе, а не пероксидазе."},{"id":"S8-L25-3","text":"Скорость удаления не изменится, потому что глутатионредуктаза использует NADH, а NADPH нужен лишь для биосинтезов.","correct":false,"feedback":"Глутатионредуктаза использует NADPH; NADH в основном передаёт электроны дыхательной цепи."}]},"widget":{"kind":"net","title":"","s":{"title":"Пути переноса электронов от NADPH","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"nd","type":"group","label":"Доступность NADPH","opts":["достаточна","снижена"]},{"id":"nx","type":"group","label":"NADPH-оксидаза (NOX)","opts":["не работает","работает"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[],"mem":[],"nodes":{"nadph":{"p":[60,150,80,40],"t":"NADPH","n":[170,42,80,40]},"gr":{"p":[180,55,56,40],"t":"GR","n":[60,147,56,40]},"gsh":{"p":[300,55,60,40],"t":"GSH","n":[60,247,60,40]},"gpx":{"p":[420,55,60,40],"t":"GPx","n":[60,347,60,40]},"trxr":{"p":[180,245,68,40],"t":"TrxR","n":[280,147,68,40]},"trx":{"p":[300,245,60,40],"t":"Trx","n":[280,247,60,40]},"prx":{"p":[420,245,60,40],"t":"Prx","n":[280,347,60,40]},"nox":{"p":[190,150,60,40],"t":"NOX","n":[170,147,60,40]},"sup":{"p":[320,150,68,40],"t":"O₂•⁻","n":[170,247,68,40]},"h2o2":{"p":[560,150,68,40],"t":"H₂O₂","n":[170,410,68,40]}},"edges":{"a1":{"a":"nadph","b":"gr","k":"rx","t":"e⁻","d":[-8,-10],"dn":[-26,0]},"a2":{"a":"gr","b":"gsh","k":"rx","t":"GSSG → GSH","tn":"GSSG → GSH","d":[0,-12],"dn":[-30,0]},"a3":{"a":"gsh","b":"gpx","k":"rx","t":"e⁻","d":[0,-12],"dn":[-22,0]},"a4":{"a":"gpx","b":"h2o2","k":"bind","t":"H₂O₂ → H₂O","tn":"H₂O₂ → H₂O","d":[-64,14],"dn":[-26,0]},"b1":{"a":"nadph","b":"trxr","k":"rx","t":"e⁻","d":[-8,12],"dn":[26,0]},"b2":{"a":"trxr","b":"trx","k":"rx","t":"e⁻","d":[0,22],"dn":[26,0]},"b3":{"a":"trx","b":"prx","k":"rx","t":"e⁻","d":[0,22],"dn":[26,0]},"b4":{"a":"prx","b":"h2o2","k":"bind","t":"H₂O₂ → H₂O","tn":"H₂O₂ → H₂O","d":[-64,-12],"dn":[26,0]},"c1":{"a":"nadph","b":"nox","k":"rx","t":"e⁻","d":[0,-12],"dn":[30,0]},"c2":{"a":"nox","b":"sup","k":"rx","t":"O₂ + e⁻","d":[0,-12],"dn":[28,0]},"c3":{"a":"sup","b":"h2o2","k":"rx","t":"SOD","d":[0,-12],"dn":[0,30]}},"st":{"0-0":{"n":{"nox":"off","sup":"off"},"e":{"c1":"off","c2":"off","c3":"off"},"m":[["Восстановление GSH (GR)","идёт"],["Восстановление Trx (TrxR)","идёт"],["Образование O₂•⁻ NOX","нет"]],"note":"NADPH достаточно: GR и TrxR восстанавливают глутатион и тиоредоксин, GPx и Prx удаляют H₂O₂. NOX неактивна и NADPH не расходует.","bars":[["Удаление H₂O₂ через GPx и Prx",3],["Образование окислителя",1]]},"0-1":{"n":{"nox":"on","sup":"on","h2o2":"on"},"e":{},"m":[["Восстановление GSH (GR)","идёт"],["Восстановление Trx (TrxR)","идёт"],["Образование O₂•⁻ NOX","есть"]],"note":"NOX передаёт электроны с NADPH на O₂ и образует супероксид, из которого возникает H₂O₂. NADPH расходуется ещё и здесь; если регенерация NADPH компенсирует расход, защитные цепи сохраняют активность.","bars":[["Удаление H₂O₂ через GPx и Prx",3],["Образование окислителя",3]]},"1-0":{"n":{"nadph":"off","gr":"off","trxr":"off","h2o2":"on","nox":"off","sup":"off"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","c3":"off"},"m":[["Восстановление GSH (GR)","замедлено"],["Восстановление Trx (TrxR)","замедлено"],["Образование O₂•⁻ NOX","нет"]],"note":"Доступность NADPH для GR и TrxR снижена. GSH и Trx восстанавливаются медленнее, GPx и Prx получают меньше электронов, и удаление H₂O₂ ослабевает при прежнем образовании.","bars":[["Удаление H₂O₂ через GPx и Prx",1],["Образование окислителя",1]]},"1-1":{"n":{"nadph":"off","gr":"off","trxr":"off","h2o2":"on","nox":"on","sup":"on"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off"},"m":[["Восстановление GSH (GR)","замедлено"],["Восстановление Trx (TrxR)","замедлено"],["Образование O₂•⁻ NOX","есть"]],"note":"Доступность NADPH снижена, а NOX образует окислитель: в модели сочетаются ослабленное удаление и усиленное образование H₂O₂. Дополнительное ограничение защитных реакций из-за конкуренции за NADPH здесь отдельно не рассчитывается.","bars":[["Удаление H₂O₂ через GPx и Prx",1],["Образование окислителя",3]]}}}}},{"id":"redox-signaling","number":26,"section":3,"title":"Как локальное образование H₂O₂ меняет передачу сигнала","question":4,"questions":[4],"keywords":["сигнальный H₂O₂","NOX","тиол цистеина","протеинтирозинфосфатаза","фосфорилирование","редокс-реле","Prx2","STAT3","тиоредоксин"],"lead":["Краткое локальное образование H₂O₂ может обратимо окислять определённые остатки цистеина и тем менять активность белков.","Пространство и время такого сигнала ограничивают ферменты, которые удаляют H₂O₂ и восстанавливают окисленные белки."],"mechanism":["После активации рецептора NADPH-оксидаза образует супероксид, из которого возникает H₂O₂ в ограниченной области клетки.","H₂O₂ обратимо окисляет реакционноспособный цистеин фосфатазы; при сохранённой активности киназы фосфорилирование мишени возрастает.","Окисление может передаваться и через пероксиредоксин ([[T74|редокс-реле]]), а восстановление белков тиоредоксиновой системой ограничивает сигнал."],"paragraphs":["Образование окислителя при действии сигнала связывают с NADPH-оксидазами (NOX; Sies и соавт., 2024). Изоформы NOX активируются по-разному (например, NOX2 — фосфорилированием субъединиц и сборкой комплекса, NOX5 и DUOX — ионами Ca²⁺). Большинство изоформ передаёт электроны с NADPH на O₂ и образует супероксид, из которого ферментативной дисмутацией возникает H₂O₂, а NOX4 и DUOX образуют преимущественно H₂O₂. Внеклеточный H₂O₂ может проходить в клетку через специальные каналы, пероксипорины. Так в ограниченной области клетки на короткое время повышается содержание H₂O₂.","При прямом окислении H₂O₂ реагирует с тиолатом определённого остатка цистеина, например в каталитическом центре протеинтирозинфосфатазы, и активность фермента снижается. Если окисленный остаток затем восстанавливается, воздействие обратимо. Если активность киназы сохранена, а активность фосфатазы снижена, доля фосфорилированной мишени возрастает; повышения активности киназы для этого не требуется. Реакционная способность цистеинов различна, и не все остатки окисляются H₂O₂ одинаково; при активных пероксиредоксинах прямое окисление таких мишеней возможно при высоком локальном содержании H₂O₂ или ослаблении его удаления, этот механизм обсуждается.","Многие регулируемые белки реагируют с H₂O₂ медленно, а Prx2 — один из наиболее реакционноспособных к H₂O₂ белков клетки. В редокс-реле Prx2 окисляется H₂O₂ и передаёт окислительный эквивалент транскрипционному фактору STAT3; образуются дисульфидно связанные олигомеры STAT3 с ослабленной транскрипционной активностью (Sobotta и соавт., 2015). Прямое окисление и реле — разные механизмы: во втором мишень окисляется белком-посредником, а не самим H₂O₂.","Область и длительность сигнала ограничивают пероксидазы и системы восстановления. В клетках HeLa с адресным образованием H₂O₂ его распределение по компартментам, по данным одной работы, определяла тиоредоксиновая, а не глутатионовая система (Mishina и соавт., 2019); результат относится к этой модели. Время действия сигнала зависит и от образования, и от удаления H₂O₂. Прекращение сигнала не означает защиты клетки от повреждения: это разные процессы."],"trap":["Окисление белка пероксидом водорода всегда неспецифично и повреждает белок.","Локальное обратимое окисление определённых остатков цистеина может менять активность белка и входить в передачу сигнала. Повреждением называют стойкое нарушение функции, а не само окисление."],"conditions":"Схема качественная: состояния показаны условно, числа не заданы. Реле Prx2–STAT3 показано в клетках человека (Sobotta и соавт., 2015, прочитана аннотация) и не обобщается на все пероксиредоксины и мишени. Роль тиоредоксиновой системы показана в клетках HeLa (Mishina и соавт., 2019, прочитана аннотация). Участие NOX в сигнале — по обзору Sies и соавт. (2024); различия изоформ NOX и окисление фосфатаз — общепринятые положения без отдельного прочитанного источника.","sources":["SIES","SOBOTTA","MISHINA","PAK"],"quiz":{"id":"S8-L26","rev":2,"question":"Локальный H₂O₂ обратимо снизил активность фосфатазы при сохранённой активности киназы. Как изменится доля фосфорилированного субстрата этой фосфатазы?","options":[{"id":"S8-L26-2","text":"Уменьшится, поскольку окисленный остаток цистеина блокирует присоединение фосфатной группы к субстрату.","correct":false,"feedback":"Фосфатную группу присоединяет киназа, активность которой сохранена, а фосфатаза её удаляет."},{"id":"S8-L26-3","text":"Не изменится, поскольку фосфорилирование субстрата определяется активностью киназы, а она сохранена.","correct":false,"feedback":"Доля фосфорилированного субстрата определяется балансом киназы и фосфатазы, а не одной киназой; при сниженной активности фосфатазы она растёт."},{"id":"S8-L26-1","text":"Увеличится, поскольку удаление фосфатных групп от субстрата замедлилось при сохранённой активности киназы.","correct":true,"feedback":"Доля фосфорилированного субстрата определяется балансом активностей киназы и фосфатазы; при сниженной активности фосфатазы баланс смещается и без усиления киназы."}]},"widget":{"kind":"net","title":"","s":{"title":"Локальный H₂O₂ в передаче сигнала","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"mech","type":"group","label":"Механизм передачи","opts":["прямое окисление фосфатазы","реле через Prx2"]},{"id":"tr","type":"group","label":"Восстановление (Trx)","opts":["работает","ослаблено"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[],"mem":[],"nodes":{"rec":{"p":[58,150,96,40],"t":"рецептор","n":[170,40,96,40]},"nox":{"p":[194,150,60,40],"t":"NOX","n":[170,135,60,40]},"h2o2":{"p":[322,150,68,40],"t":"H₂O₂","n":[170,230,68,40]},"ptp":{"p":[470,45,56,40],"t":"PTP","n":[70,320,56,40]},"sub":{"p":[470,150,76,40],"t":"мишень","n":[70,405,76,40]},"kin":{"p":[470,255,76,40],"t":"киназа","n":[270,405,76,40]},"prx":{"p":[470,45,68,40],"t":"Prx2","n":[70,320,68,40]},"tf":{"p":[470,150,80,40],"t":"STAT3","n":[70,405,80,40]},"trx":{"p":[590,45,60,40],"t":"Trx","n":[270,320,60,40]}},"edges":{"r1":{"a":"rec","b":"nox","k":"act","t":"активирует","d":[0,-12],"dn":[30,0]},"r2":{"a":"nox","b":"h2o2","k":"rx","t":"O₂•⁻ → H₂O₂","d":[0,-12],"dn":[34,0]},"d1":{"a":"h2o2","b":"ptp","k":"inh","t":"окисляет","d":[-26,-8],"dn":[-34,0]},"d2":{"a":"ptp","b":"sub","k":"inh","t":"снимает P","d":[-52,0],"dn":[46,0]},"d3":{"a":"kin","b":"sub","k":"phos","t":"добавляет P","d":[44,0],"dn":[46,0],"pm":0.5},"d4":{"a":"trx","b":"ptp","k":"act","t":"восстановление","d":[0,-12],"dn":[0,-12]},"y1":{"a":"h2o2","b":"prx","k":"act","t":"окисляет","d":[-26,-8],"dn":[-34,0]},"y2":{"a":"prx","b":"tf","k":"rx","t":"передаёт окисление","tn":"передача","d":[52,0],"dn":[60,0]},"y3":{"a":"trx","b":"prx","k":"act","t":"восстановление","d":[0,-12],"dn":[0,-12]}},"st":{"0-0":{"n":{"prx":"hide","tf":"hide","ptp":"off","sub":"on"},"e":{"y1":"hide","y2":"hide","y3":"hide"},"b":{},"note":"Рецептор активирует NOX, и H₂O₂ образуется локально. H₂O₂ окисляет остаток цистеина протеинтирозинфосфатазы (PTP), и её активность снижается. Активность киназы сохранена, активность фосфатазы снижена, поэтому доля фосфорилированной мишени возрастает. Окисленную фосфатазу восстанавливают тиоредоксиновая и (или) глутаредоксин-глутатионовая системы, поэтому эффект ограничен во времени.","bars":[["Активность фосфатазы",1],["Фосфорилирование мишени",2],["Время в окисленном состоянии",1]]},"0-1":{"n":{"prx":"hide","tf":"hide","ptp":"off","sub":"on","trx":"off"},"e":{"y1":"hide","y2":"hide","y3":"hide","d4":"off"},"b":{},"note":"Если восстановление ослаблено, окисленная форма фосфатазы сохраняется дольше, и повышенное фосфорилирование мишени длится дольше. Механизм не меняется: воздействие остаётся обратимым.","bars":[["Активность фосфатазы",1],["Фосфорилирование мишени",3],["Время в окисленном состоянии",3]]},"1-0":{"n":{"ptp":"hide","sub":"hide","kin":"hide","prx":"on","tf":"off"},"e":{"d1":"hide","d2":"hide","d3":"hide","d4":"hide"},"b":{},"note":"H₂O₂ окисляет Prx2, а не STAT3: окислительный эквивалент переходит с Prx2 на STAT3, образуются дисульфидно связанные олигомеры с ослабленной транскрипционной активностью (клетки человека, Sobotta и соавт., 2015). Тиоредоксиновая система восстанавливает Prx2.","bars":[["Окисление Prx2",2],["Окисление STAT3",2],["Время в окисленном состоянии",1]],"p":{"prx":[470,90],"tf":[470,200],"trx":[590,90]}},"1-1":{"n":{"ptp":"hide","sub":"hide","kin":"hide","prx":"on","tf":"off","trx":"off"},"e":{"d1":"hide","d2":"hide","d3":"hide","d4":"hide","y3":"off"},"b":{},"note":"При ослабленном восстановлении окисленные Prx2 и STAT3 сохраняются дольше. В этой паре окисление ослабляет, а не усиливает активность белка: действие зависит от конкретной мишени.","bars":[["Окисление Prx2",3],["Окисление STAT3",3],["Время в окисленном состоянии",3]],"p":{"prx":[470,90],"tf":[470,200],"trx":[590,90]}}}}}},{"id":"oxidative-damage","number":27,"section":3,"title":"Когда окислительное воздействие приводит к повреждению","question":4,"questions":[4],"keywords":["окислительный стресс","сульфеновая форма","сульфиновая форма","сульфоновая форма","сульфиредоксин","обратимость окисления","PARP1","расход NAD⁺","повреждение"],"lead":["Локальное обратимое окисление отличается от повреждения длительностью, местом и мишенью воздействия.","О повреждении говорят, когда нарушение функции стойко, а удаление окислителя и восстановление мишеней не компенсируют воздействие."],"mechanism":["H₂O₂ окисляет тиол цистеина до сульфеновой формы, которая может образовать дисульфид (его затем восстанавливают) либо окисляться дальше до сульфиновой и сульфоновой форм.","Сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов восстанавливает сульфиредоксин за счёт ATP, а сульфоновую форму обычно считают необратимой.","Стойкое нарушение возникает при длительном воздействии на важные мишени; расходование NAD⁺ при активации PARP после повреждения ДНК — отдельный процесс, не относящийся к окислению цистеина."],"paragraphs":["Краткий локальный импульс окислителя, после которого мишень восстанавливается, меняет активность белка обратимо и входит в регуляцию. [[T75|Окислительным стрессом]] называют нарушение баланса окислителей и защитных систем, при котором нарушаются редокс-регуляция и (или) возникает молекулярное повреждение (Sies и соавт., 2024). Его нельзя определить только по наличию H₂O₂ или по одному пороговому значению: общего числа, разделяющего «полезные» и «вредные» АФК, и универсального времени перехода от регуляции к повреждению нет.","Окисление тиола цистеина пероксидом водорода даёт сульфеновую форму (Cys-SOH). Она может образовать дисульфид с другим тиолом, и дисульфид восстанавливают тиоредоксин или глутатион. При избытке окислителя сульфеновая форма окисляется до сульфиновой (Cys-SO₂H), а затем до сульфоновой (Cys-SO₃H). Сульфиновая форма каталитического цистеина типичных 2-Cys-Prx не всегда необратима: её восстанавливает до сульфеновой формы [[T73|сульфиредоксин]] (Srx) за счёт ATP (Rhee и соавт., 2007; Lowther, Haynes, 2011). Сульфоновую форму обычно считают необратимой. Srx не является универсальным восстановителем сульфиновых групп любых белков.","Обратимое сульфинирование 2-Cys-Prx снижает их пероксидазную активность; предполагают, что оно предотвращает преждевременное удаление H₂O₂ в области сигнала, но физиологическое значение этого остаётся предметом обсуждения (Jeong и соавт., 2012). Окисление становится повреждением, когда оно длительно, затрагивает функционально важные мишени и не компенсируется удалением окислителя и восстановлением мишеней. Окисление затрагивает не только белки: возможны перекисное окисление липидов мембран и окисление оснований ДНК, а ионы железа усиливают повреждение, катализируя образование из H₂O₂ гидроксильного радикала (реакция Фентона); вклад этих процессов зависит от условий. Поэтому важны длительность, компартмент и мишень, а не содержание одного окислителя.","Повреждение ДНК активирует [[T77|PARP]]1. Фермент расщепляет NAD⁺, присоединяет остатки ADP-рибозы к белкам и высвобождает никотинамид (Shah и соавт., 2011); при повреждении ДНК такой расход снижал содержание NAD⁺ и менял метаболизм клеток (Murata и соавт., 2019). Это не окислительно-восстановительная реакция кофермента: NADH не образуется. Ингибирование PARP1 может сохранить NAD⁺, но само не устраняет повреждение ДНК и его причины, в том числе образование окислителей."],"trap":["Сульфинирование цистеина всегда необратимо.","Сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов восстанавливает сульфиредоксин за счёт ATP. Необратимой обычно считают сульфоновую форму."],"conditions":"Временные кривые — расчёт по заданным учебным параметрам: они иллюстрируют различие импульса и длительного воздействия и не задают порогов. Химия Prx и Srx дана по обзорам Rhee и соавт. (2007), Lowther и Haynes (2011), Jeong и соавт. (2012): прочитаны аннотации. Расход NAD⁺ при активации PARP1 — по Shah и соавт. (2011) и Murata и соавт. (2019): прочитаны аннотации. Необратимость сульфоновой формы, перекисное окисление липидов, окисление ДНК и реакция Фентона — общепринятые положения без отдельного прочитанного источника (об окислении оснований ДНК см. также Sies и соавт., 2024).","sources":["SIES","RHEE07","LOWTHER","JEONG12","SHAH","MURATA"],"quiz":{"id":"S8-L27","rev":2,"question":"При повреждении ДНК активировалась PARP1 и снизилось содержание NAD⁺. Ингибирование PARP1 уменьшило расход NAD⁺. Какой вывод следует из этого непосредственно?","options":[{"id":"S8-L27-2","text":"Повреждение ДНК устраняется быстрее, поскольку NAD⁺ не расходуется на работу PARP1.","correct":false,"feedback":"Снижение расхода NAD⁺ не показывает, что повреждение ДНК устранено."},{"id":"S8-L27-1","text":"Потеря NAD⁺ из-за PARP1 уменьшается, но повреждение ДНК этим не устраняется.","correct":true,"feedback":"Расход кофермента и само повреждение ДНК — разные звенья."},{"id":"S8-L27-3","text":"Отношение NADH/NAD⁺ во всех компартментах выравнивается, поскольку расход NAD⁺ снизился.","correct":false,"feedback":"Расход NAD⁺ при активации PARP1 не образует NADH, но может менять отношение NADH/NAD⁺, поскольку изменяет количество NAD⁺. Из снижения этого расхода не следует выравнивание отношений во всех компартментах."}]},"widget":{"kind":"s4_damage","title":"","s":{"title":"Импульс и длительное воздействие окислителя","status":"Расчёт по заданным параметрам · учебные значения, не пороги","modes_label":"Воздействие","modes":["Короткий импульс","Длительное воздействие"],"sl_r":"Скорость восстановления мишени, усл. ед.","x_label":"Время, усл. ед.","y_label":"% мишени","chart_title":"Окисленная и повреждённая доли мишени во времени","s_ox":"обратимо окислена","s_dm":"повреждена стойко","mm":["Максимум обратимо окисленной доли","Обратимо окислена в конце","Стойко повреждено в конце"],"notes":{"pulse":"Импульс короткий: после его окончания обратимо окисленная доля возвращается к исходной за счёт восстановления, а стойко повреждённая доля остаётся небольшой; сравните её с длительным воздействием.","pulse_slow":"Импульс короткий, но восстановление медленное: окисленная доля поднимается выше и снижается дольше, поэтому стойко повреждённой мишени накапливается заметно больше, чем при быстром восстановлении.","long":"Воздействие длится: окисленная доля остаётся высокой, и часть мишеней переходит в стойко повреждённую форму.","long_slow":"Воздействие длится, а восстановление медленное: окисленная доля выше, и стойких изменений накапливается больше."},"sc_title":"Окисление каталитического цистеина 2-Cys-пероксиредоксина (Prx)","sp":{"sh":"Prx-SH","soh":"Prx-SOH","ss":"Prx-S–S","so2":"Prx-SO₂H","so3":"Prx-SO₃H"},"ar":{"h2o2":"H₂O₂","ds":"дисульфид","trx":"восстановление Trx","ex":"избыток H₂O₂","srx":"Srx, ATP","irr":"обычно необратимо"},"hi":{"pulse":["sh","soh","ss"],"long":["so2","so3"]},"pa_title":"Расход NAD⁺ при активации PARP1","pa":{"nad":"NAD⁺","enz":"PARP1","out":"ADP-рибозильные остатки\n+ никотинамид"},"pa_note":"Активация при повреждении ДНК. NAD⁺ расходуется без образования NADH: это не окислительно-восстановительная реакция кофермента."}}},{"id":"redox-sensors","number":28,"section":3,"title":"Как соотносятся сигналы сенсоров NADH/NAD⁺ и H₂O₂","question":4,"questions":[4],"keywords":["Peredox","HyPer7","генетически кодируемый сенсор","калибровка","насыщение","локализация","отношение флуоресценции","pH","контроль"],"lead":["[[T82|Peredox]] (схема M05) сообщает об отношении NADH/NAD⁺ в цитозоле, а [[T83|HyPer7]] (схема M06) — о степени окисления сенсора пероксидом водорода в том компартменте, в который направлен сенсор.","Один сенсор отвечает на состояние пары NADH/NAD⁺, другой — на окисление пероксидом водорода; сигнал каждого читают с учётом калибровки, диапазона и локализации."],"mechanism":["Peredox состоит из NADH-связывающего белка Rex и флуоресцентного белка: NAD⁺ и NADH конкурируют за Rex, и флуоресценция приближённо отражает отношение форм.","HyPer7 окисляется H₂O₂ и восстанавливается клеточными системами; отношение интенсивностей флуоресценции при двух длинах волн возбуждения показывает долю окисленного сенсора.","Для интерпретации сигнала нужны калибровка по крайним состояниям, диапазон отклика, локализация и контроли; показания сенсоров в разных компартментах могут не совпадать, потому что сенсоры измеряют разные величины."],"paragraphs":["Peredox (схема M05) — генетически кодируемый сенсор цитозольного NADH/NAD⁺. В нём циркулярно пермутированный флуоресцентный белок T-Sapphire встроен между двумя субъединицами димера NADH-связывающего белка Rex, а для нормировки на количество сенсора присоединён красный белок mCherry. NAD⁺ и NADH конкурируют за связывание с Rex, поэтому отклик зависит от обеих форм и лишь приближённо отражает отношение NADH/NAD⁺: трёхкратное изменение общего содержания NAD⁺ сдвигало диапазон отношений, в котором сенсор чувст
