x">Высокий сигнал показывает только ту величину, которую метод измеряет: доступность, присутствие белка или метки, контакт. Причинную роль устанавливают вмешательством в предполагаемое звено, измерением следствия во времени и контролем побочных эффектов.</p></div><div class="static-quiz"><h3>Нужно проверить, вызывает ли изменение конкретной метки изменение транскрипции локуса. Какой дизайн опыта проверяет эту гипотезу наиболее строго?</h3><ol><li><b>А.</b> Адресное изменение метки, измерение новосинтезированной РНК в несколько сроков и контроль побочных эффектов. <i>(верный вариант)</i><br><span class="expl">Вмешательство и временной порядок проверяют причинную зависимость; независимое вмешательство или восстановление функции дополнительно усиливают вывод.</span></li><li><b>Б.</b> Одновременное измерение высокого уровня метки и низкого уровня РНК в одной конечной точке в тех же образцах. <i>(неверный вариант)</i><br><span class="expl">Совпадение состояний устанавливает связь, но не направление причинности.</span></li><li><b>В.</b> Измерение общего количества фермента метилирования во всей клетке и сравнение этого количества с контролем. <i>(неверный вариант)</i><br><span class="expl">Общее количество фермента в клетке не определяет ни метку в конкретном локусе, ни её действие на транскрипцию этого локуса.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1/2/3/4 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a> <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a> <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a> <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3919000/">Booth MJ et al. 2013. Oxidative bisulfite sequencing of 5-methylcytosine and 5-hydroxymethylcytosine</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9771884/">Preissl S et al. 2023. Characterizing cis-regulatory elements using single-cell epigenomics</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9262863/">Bergman DT et al. 2022. Compatibility rules of human enhancer and promoter sequences</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4242194/">Saeed S et al. 2014. Epigenetic programming of monocyte-to-macrophage differentiation and trained innate immunity</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li></ul><p>Booth и соавт. (2013), Preissl и соавт. (2023) (обзор), Bergman и соавт. (2022), Yang и Hansen (2024) (обзор) и Saeed и соавт. (2014) прочитаны на уровне реферата. Booth и соавт.: BS-seq и oxBS-seq, 5mC и 5hmC. Preissl и соавт.: эпигеномные признаки регуляторных элементов (номер журнала 2023 г., онлайн-публикация 2022 г.). Bergman и соавт.: репортёрный анализ ExP STARR-seq, клетки человека K562, по 1000 последовательностей энхансеров и промоторов; то, что репортёрная система не отражает хроматин собственного локуса, — общее свойство такого анализа, а не вывод реферата. Yang и Hansen: в реферате названы технические особенности Hi-C, Micro-C и визуализации, влияющие на трактовку. Описания метода шпильки, ATAC-секвенирования, ChIP-секвенирования, CUT&amp;Tag, CUT&amp;RUN, а также требование контрольной группы, получившей только второй стимул (протоколы на моноцитах человека: Saeed и соавт., 2014), — общие сведения о методах и схеме опыта, не вывод конкретного реферата. Схема качественная, числовых результатов на ней нет.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 28 из 28</div><h2>Исследование одного регуляторного локуса</h2><p class="lead">Исследование локуса строят по порядку: сначала предсказывают раннее звено цепи, затем знакомятся с наблюдениями, выбирают измерения и контроли и только после этого формулируют границу вывода. Наблюдения в задачах качественные: числовых эффектов в них нет, а происхождение каждого показания указано.</p><div class="note"><strong>Что показывает схема.</strong> Инактивация DNMT1 при сохранном метилировании de novo. Делящаяся культура клеток млекопитающих, в которой DNMT1 инактивирована, а DNMT3A и DNMT3B сохраняют активность. До инактивации DNMT1 CpG-динуклеотиды в исследуемом локусе были метилированы на обеих цепях. Клетки проходят несколько делений. Раннее звено: копирование метки на новую цепь нарушено, и появляются полуметилированные диады. Наблюдения (условие задачи, качественно): в неделящихся клетках той же линии доля метилированных оснований за тот же срок осталась прежней. В делящихся клетках после нескольких делений доля полностью метилированных диад (MM) снизилась, а доля диад MU и UU выросла. 5hmC и участие TET в потере метки отдельно не оценивали. Необходимые измерения и контроли: метод шпильки (состояние обеих цепей диады); сравнение делящихся и неделящихся клеток; oxBS-seq или TAB-seq для 5hmC. Допустимый вывод: наблюдения согласуются с пассивной потерей метилирования при делениях; роль активного удаления ими не установлена. Снижение метилирования сайта CTCF. Между энхансером и промотором гена расположен сайт связывания CTCF, чувствительный к метилированию ДНК. В опытной группе клеток метилирование этого сайта снижают адресным вмешательством; контрольная группа вмешательства не получает. Раннее звено: изменится связывание CTCF с сайтом. Наблюдения (условие задачи, качественно): метилирование сайта в опытной группе снижено по сравнению с контролем. Общая РНК гена в опытной группе в один срок отличается от контрольной. Связывание CTCF, контакты и новосинтезированную РНК в несколько сроков не измеряли. Необходимые измерения и контроли: ChIP-секвенирование или CUT&amp;Tag для CTCF на сайте; Hi-C или другой метод измерения контактов энхансера и промотора; новосинтезированная РНК гена в несколько сроков. Допустимый вывод: метилирование сайта снижено, а общая РНК гена в один срок отличается; роль CTCF и контактов этими данными не установлена. Селективный АТФ-конкурентный ингибитор AKT. В культуре клеток инсулин или IGF-1 активирует PI3K и AKT. Опытную группу обрабатывают селективным АТФ-конкурентным ингибитором AKT, контрольная группа получает растворитель. Срок воздействия — несколько часов. Раннее звено: снизится фосфорилирование субстратов AKT, например GSK3β по Ser9. Наблюдения (условие задачи, качественно): фосфорилирование AKT по Thr308 и Ser473 в опытной группе выше, чем в контрольной. Фосфорилирование субстратов AKT, положение FOXO1, связывание FOXO1 с ДНК и новосинтезированную РНК не измеряли. Жизнеспособность клеток в обеих группах одинакова. Необходимые измерения и контроли: фосфорилирование субстрата AKT, например GSK3β по Ser9; доля FOXO1 в ядре; ChIP-секвенирование или CUT&amp;RUN для FOXO1; новосинтезированная РНК генов-мишеней FOXO1. Допустимый вывод: вывод о цепи «сигнал → FOXO1 → транскрипция» ограничен звеньями, измеренными по отдельности в этих клетках. Вмешательство в PRC2 в период покоя после первого сигнала. Делящиеся клетки получили первый сигнал, после которого в исследуемом локусе появилась метка H3K27me3. Сигнал убрали; в период покоя клетки делятся. В опытной группе в период покоя добавляют ингибитор EZH2 (каталитической субъединицы PRC2), контрольная группа получает растворитель; затем обе группы получают второй сигнал. Раннее звено: на новых гистонах не образуется H3K27me3, и доля метки в локусе снижается по мере делений. Наблюдения (условие задачи, качественно): в период покоя клетки делились; жизнеспособность в обеих группах одинакова. Клетки с первым сигналом и ингибитором ответили на второй сигнал иначе, чем клетки с первым сигналом без ингибитора. Метку H3K27me3 в локусе до и после периода покоя не измеряли. Необходимые измерения и контроли: H3K27me3 в локусе до и после периода покоя; число делений клеток за период покоя; клетки, получившие только второй сигнал, с ингибитором и без него; жизнеспособность и состав клеток. Допустимый вывод: различие ответов связано с вмешательством в PRC2 в этом протоколе; носитель следа и передача потомкам не доказаны. Повторный ответ после отмывки. Моноциты человека в культуре обрабатывают β-глюканом, реагент удаляют отмывкой, клетки выдерживают в покое и затем стимулируют LPS. После стимуляции LPS измеряют концентрацию TNF в среде. Сравниваемая величина: ответ на LPS у клеток после β-глюкана в сравнении с клетками, получившими только LPS. Наблюдения (условие задачи, качественно): ответ клеток на LPS после β-глюкана и покоя сильнее, чем их первый ответ на β-глюкан. Группу, получившую только LPS в тот же срок, не ставили. Удаление β-глюкана, деления и состав клеток не проверяли. Необходимые измерения и контроли: контрольная группа того же возраста, получившая только LPS; проверка удаления β-глюкана после отмывки; жизнеспособность и состав клеток. Допустимый вывод: усиление по сравнению с первым ответом тех же клеток нельзя отнести к первому воздействию: нужна группа, получившая только LPS.</div><ol class="mech"><li>Предсказывают, какое звено цепи «воздействие → ранний молекулярный шаг → состояние хроматина → транскрипция или ответ» изменится первым.</li><li>Знакомятся с наблюдениями и выбирают измерения, позволяющие различить конкурирующие объяснения, и контроли, исключающие остальные объяснения.</li><li>Формулируют вывод по тому, что измерено: согласие с предсказанием не доказывает механизм, а граница вывода зависит от условий и методов.</li></ol><p>Каждая задача задаёт исходное состояние, воздействие и наблюдения, не зависящие от выбора студента. Раннее звено цепи предсказывают до знакомства с наблюдениями; в задаче о повторном ответе вместо звена называют величину, которую сравнивают. При инактивации DNMT1 раньше всего нарушается копирование метки на новую цепь, при снижении метилирования сайта CTCF — связывание CTCF, при подавлении активности AKT АТФ-конкурентным ингибитором — фосфорилирование субстратов AKT, при подавлении PRC2 — образование H3K27me3 на новых гистонах.</p><p>Измерения выбирают в соответствии с выводом, который нужно обосновать. Пассивную потерю метилирования проверяют анализом состояния обеих цепей диады, сравнением делящихся и неделящихся клеток и определением 5hmC; для сайта CTCF измеряют связывание, контакты и новосинтезированную РНК, причём контакт и активация промотора — разные величины (Yang и Hansen, 2024). При подавлении активности AKT нужно измерять фосфорилирование субстрата и положение FOXO1, а не только фосфорилирование самой AKT, которое при таком ингибиторе может расти (Okuzumi и соавт., 2009).</p><p>Граница вывода зависит от измеренного. Согласие с предсказанием показывает совместимость объяснения с данными, но не исключает других объяснений; механизм считают установленным, когда вмешательство в звено меняет следствие, а контроли исключают конкурирующие объяснения. Если измерено лишь сохранение <a href="#ns-g-S6-T58">H3K27ac</a>, обосновано только оно: изменение повторного ответа и передача метки дочерним клеткам не проверены. Метилирование ДНК действует вместе с другими регуляторными уровнями (Smith и соавт., 2025), а первое воздействие связывают с изменением повторного ответа лишь в данном протоколе (Saeed и соавт., 2014).</p><div class="note trap"><strong>Типичная ошибка</strong> Результат измерения согласуется с предсказанием, значит, механизм доказан.<p class="trap-fix">Согласие с предсказанием показывает, что объяснение совместимо с данными, но другие объяснения остаются возможными. Механизм подтверждают вмешательством в звено, измерением следствия во времени и контролями; граница вывода определяется измеренной величиной и условиями.</p></div><div class="static-quiz"><h3>После первого воздействия сохраняется H3K27ac, но повторный стимул ещё не подавали. Какое утверждение уже обосновано?</h3><ol><li><b>А.</b> Сохраняется измеренная метка; изменение повторного ответа ещё не установлено. <i>(верный вариант)</i><br><span class="expl">Наблюдение относится к метке. Чтобы говорить о памяти ответа, нужны повторный стимул и сопоставимый контроль.</span></li><li><b>Б.</b> Доказан более сильный ответ клеток на повторный стимул после первого воздействия. <i>(неверный вариант)</i><br><span class="expl">Повторного воздействия в условии ещё нет.</span></li><li><b>В.</b> Доказано наследование этой метки дочерними клетками через неограниченное число делений. <i>(неверный вариант)</i><br><span class="expl">Число делений и передача состояния дочерним клеткам не исследованы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1/2/3/4 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a> <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a> <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a> <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4242194/">Saeed S et al. 2014. Epigenetic programming of monocyte-to-macrophage differentiation and trained innate immunity</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://doi.org/10.1038/nchembio.183">Okuzumi T. et al. Inhibitor hijacking of Akt activation. Nat Chem Biol. 2009;5:484–93. doi:10.1038/nchembio.183</a></li></ul><p>Задачи составлены для курса по механизмам шагов 1–26; наблюдения в них качественные, числовых эффектов нет, а у каждого показания указано происхождение — условие задачи. Okuzumi и соавт. (2009): полный текст основной статьи, клетки HEK293; АТФ-конкурентные ингибиторы AKT вызывали гиперфосфорилирование AKT при подавленном фосфорилировании GSK3β по Ser9 (рисунки и дополнительные материалы не прочитаны). Saeed и соавт. (2014), Yang и Hansen (2024) и Smith и соавт. (2025) прочитаны на уровне реферата; Yang и Hansen и Smith и соавт. — обзоры. Задача о повторном ответе построена по протоколу на моноцитах человека (β-глюкан, отмывка, покой, LPS); сроки в ней не заданы. Связь между этапами цепей в задачах — рабочая учебная схема, а не результат одного эксперимента.</p></details></article><section class="card"><h2>Термины семинара 6</h2><dl class="glossary"><div id="ns-g-S6-T01"><dt>Метилирование ДНК</dt><dd>Присоединение метильной группы к основанию ДНК; в основной модели — к C5 цитозина с образованием 5mC.</dd></div><div id="ns-g-S6-T02"><dt>5-метилцитозин (5mC)</dt><dd>Цитозин с метильной группой у пятого атома углерода.</dd></div><div id="ns-g-S6-T03"><dt>CpG-динуклеотид</dt><dd>Динуклеотид, в котором за цитозином в направлении 5′→3′ той же цепи следует гуанин; p обозначает фосфатный остаток между нуклеотидами.</dd></div><div id="ns-g-S6-T04"><dt>CpG-диада</dt><dd>Два соответствующих цитозина CpG на противоположных цепях двухцепочечной ДНК.</dd></div><div id="ns-g-S6-T05"><dt>Полностью метилированная диада (MM)</dt><dd>CpG-диада, в которой оба цитозина представлены 5mC.</dd></div><div id="ns-g-S6-T06"><dt>Полуметилированная диада (MU)</dt><dd>CpG-диада, в которой 5mC присутствует только на одной цепи.</dd></div><div id="ns-g-S6-T07"><dt>Неметилированная диада (UU)</dt><dd>CpG-диада, в которой ни один из двух цитозинов не представлен 5mC.</dd></div><div id="ns-g-S6-T08"><dt>CpG-островок</dt><dd>Участок ДНК с относительно высоким содержанием GC и повышенной встречаемостью CpG.</dd></div><div id="ns-g-S6-T09"><dt>Рисунок метилирования</dt><dd>Распределение метилированных участков или оснований в исследуемом локусе либо геноме.</dd></div><div id="ns-g-S6-T10"><dt>Метилирование de novo</dt><dd>Установление метилирования на ранее неметилированных участках.</dd></div><div id="ns-g-S6-T11"><dt>Поддерживающее метилирование</dt><dd>Восстановление метилирования новой цепи после репликации с учётом метки родительской цепи.</dd></div><div id="ns-g-S6-T12"><dt>DNMT1</dt><dd>ДНК-метилтрансфераза, преимущественно обеспечивающая поддержание CpG-метилирования.</dd></div><div id="ns-g-S6-T13"><dt>DNMT3A и DNMT3B</dt><dd>ДНК-метилтрансферазы, устанавливающие метилирование de novo и участвующие в поддержании отдельных участков.</dd></div><div id="ns-g-S6-T14"><dt>DNMT3L</dt><dd>Каталитически неактивный партнёр DNMT3, важный в определённых контекстах, включая установление импринтов.</dd></div><div id="ns-g-S6-T15"><dt>UHRF1</dt><dd>Белок, связывающий полуметилированную ДНК и признаки хроматина и способствующий функции DNMT1.</dd></div><div id="ns-g-S6-T16"><dt>S-аденозилметионин (SAM)</dt><dd>Донор метильной группы в метилтрансферазных реакциях.</dd></div><div id="ns-g-S6-T17"><dt>S-аденозилгомоцистеин (SAH)</dt><dd>Продукт переноса метильной группы с SAM, способный ингибировать метилтрансферазы.</dd></div><div id="ns-g-S6-T18"><dt>Пассивное деметилирование</dt><dd>Уменьшение доли метилированных оснований при репликации без полного восстановления метилирования.</dd></div><div id="ns-g-S6-T19"><dt>TET1, TET2 и TET3</dt><dd>Fe²⁺- и α-кетоглутарат-зависимые диоксигеназы, окисляющие 5mC и его производные.</dd></div><div id="ns-g-S6-T20"><dt>5hmC, 5fC и 5caC</dt><dd>5-гидроксиметилцитозин, 5-формилцитозин и 5-карбоксилцитозин — продукты последовательного окисления 5mC.</dd></div><div id="ns-g-S6-T21"><dt>TDG</dt><dd>ДНК-гликозилаза, способная удалять 5fC и 5caC из ДНК.</dd></div><div id="ns-g-S6-T22"><dt>Эксцизионная репарация оснований (BER)</dt><dd>Путь восстановления ДНК после удаления повреждённого или модифицированного основания гликозилазой.</dd></div><div id="ns-g-S6-T23"><dt>Активное деметилирование</dt><dd>Восстановление немодифицированного цитозина через химические превращения и репарацию без обязательной репликации.</dd></div><div id="ns-g-S6-T24"><dt>Геномный импринтинг</dt><dd>Регуляция, при которой активность аллеля зависит от его родительского происхождения.</dd></div><div id="ns-g-S6-T25"><dt>Контрольная область импринтинга (ICR)</dt><dd>Регуляторная область, участвующая в установлении или поддержании родительски различного состояния локуса.</dd></div><div id="ns-g-S6-T26"><dt>Аллель-специфичная экспрессия</dt><dd>Различная продукция РНК или белка с разных аллелей одного локуса.</dd></div><div id="ns-g-S6-T27"><dt>MeCP2 и MBD-белки</dt><dd>Белки, содержащие домен связывания метилированной ДНК или родственный ему домен; функции членов семейства различаются.</dd></div><div id="ns-g-S6-T28"><dt>Промотор</dt><dd>Участок ДНК, на котором собирается комплекс инициации транскрипции и определяется место её начала.</dd></div><div id="ns-g-S6-T29"><dt>Место начала транскрипции (TSS)</dt><dd>Позиция ДНК, соответствующая началу синтеза первичного транскрипта.</dd></div><div id="ns-g-S6-T30"><dt>Энхансер</dt><dd>Регуляторный участок ДНК, связывание с которым определённых белков повышает вероятность или скорость транскрипции мишени.</dd></div><div id="ns-g-S6-T31"><dt>Избирательность взаимодействия энхансера и промотора</dt><dd>Преимущественное функциональное влияние энхансера на определённые промоторы в заданных условиях.</dd></div><div id="ns-g-S6-T32"><dt>Коактиватор</dt><dd>Белок или комплекс, который способствует транскрипции через взаимодействие с регуляторами и транскрипционным аппаратом.</dd></div><div id="ns-g-S6-T33"><dt>Медиаторный комплекс (Mediator)</dt><dd>Многосубъединичный коактиватор, связывающий действие активаторов с аппаратом РНК-полимеразы II.</dd></div><div id="ns-g-S6-T34"><dt>CBP/p300</dt><dd>Транскрипционные коактиваторы с лизинацетилтрансферазной активностью.</dd></div><div id="ns-g-S6-T35"><dt>BRD4</dt><dd>BET-белок с бромодоменами, связывающий ацетилированные участки и участвующий в регуляции транскрипции.</dd></div><div id="ns-g-S6-T36"><dt>Когезин</dt><dd>Многосубъединичный SMC-комплекс, участвующий в удержании сестринских хроматид и организации петель хроматина.</dd></div><div id="ns-g-S6-T37"><dt>Экструзия петли</dt><dd>Увеличение петли ДНК при АТФ-зависимом действии SMC-комплекса.</dd></div><div id="ns-g-S6-T38"><dt>CTCF</dt><dd>ДНК-связывающий белок, участвующий в организации регуляторных контактов и границ хроматина.</dd></div><div id="ns-g-S6-T39"><dt>Топологически ассоциированный домен (TAD)</dt><dd>Участок хроматина с повышенной частотой внутренних контактов по сравнению с контактами через его границы.</dd></div><div id="ns-g-S6-T40"><dt>Инсуляция</dt><dd>Ограничение функционального влияния регуляторного элемента или частоты определённых контактов.</dd></div><div id="ns-g-S6-T41"><dt>Суперэнхансер</dt><dd>Группа регуляторных элементов, выделенная по критерию высокого суммарного сигнала активности или связывания коактиваторов.</dd></div><div id="ns-g-S6-T42"><dt>Фазовое разделение</dt><dd>Разделение системы на сосуществующие фазы с различным составом.</dd></div><div id="ns-g-S6-T43"><dt>Транскрипционный фактор (ТФ)</dt><dd>Белок, регулирующий транскрипцию через связывание с ДНК и/или другими компонентами регуляторного комплекса.</dd></div><div id="ns-g-S6-T44"><dt>FOXO</dt><dd>Семейство транскрипционных факторов forkhead box O; у человека FOXO1, FOXO3, FOXO4 и FOXO6.</dd></div><div id="ns-g-S6-T45"><dt>Сигнал ядерной локализации (NLS)</dt><dd>Аминокислотная последовательность, участвующая в распознавании белка системой ядерного импорта.</dd></div><div id="ns-g-S6-T46"><dt>Сигнал ядерного экспорта (NES)</dt><dd>Аминокислотная последовательность, участвующая в распознавании белка системой экспорта из ядра.</dd></div><div id="ns-g-S6-T47"><dt>14-3-3</dt><dd>Семейство белков, связывающих определённые фосфорилированные мотивы белков-партнёров.</dd></div><div id="ns-g-S6-T48"><dt>CRM1/XPO1</dt><dd>Экспортный рецептор, обеспечивающий перенос ряда белков из ядра.</dd></div><div id="ns-g-S6-T49"><dt>Занятость участка фактором</dt><dd>Доля молекул ДНК, у которых участок связан с данным фактором, либо доля времени, в течение которого участок занят этим фактором.</dd></div><div id="ns-g-S6-T50"><dt>Доля FOXO в ядре</dt><dd>Часть общего количества FOXO, находящаяся в ядре.</dd></div><div id="ns-g-S6-T51"><dt>Каталитическая активность AKT</dt><dd>Способность AKT фосфорилировать заданный субстрат в определённых условиях.</dd></div><div id="ns-g-S6-T52"><dt>Новосинтезированная РНК</dt><dd>РНК, образованная за установленный интервал регистрации.</dd></div><div id="ns-g-S6-T53"><dt>Хроматиновая память</dt><dd>Сохранение или воспроизведение регуляторного состояния с участием хроматина после исчезновения исходного воздействия.</dd></div><div id="ns-g-S6-T54"><dt>Эпигенетическое наследование</dt><dd>Передача регуляторного состояния дочерним клеткам при сохранении последовательности ДНК.</dd></div><div id="ns-g-S6-T55"><dt>Действие в цис и в транс</dt><dd>В цис действие связано с той же молекулой/аллелем ДНК; в транс передаётся через общие диффундирующие факторы.</dd></div><div id="ns-g-S6-T56"><dt>Репрессивный комплекс Polycomb 2 (PRC2)</dt><dd>Комплекс с метилтрансферазной активностью по лизину 27 гистона H3.</dd></div><div id="ns-g-S6-T57"><dt>H3K27me3</dt><dd>Триметилирование лизина в позиции 27 гистона H3.</dd></div><div id="ns-g-S6-T58"><dt>H3K27ac</dt><dd>Ацетилирование лизина 27 гистона H3.</dd></div><div id="ns-g-S6-T59"><dt>Тренированный врождённый иммунитет</dt><dd>Устойчивое изменение ответа врождённых иммунных клеток после первого воздействия и периода покоя.</dd></div><div id="ns-g-S6-T60"><dt>Толерантность к повторному стимулу</dt><dd>Ослабление ответа на повторное воздействие в заданной клеточной системе и для конкретного показателя.</dd></div><div id="ns-g-S6-T61"><dt>Праймирование</dt><dd>Предварительное изменение регуляторной системы, которое меняет условия или выраженность ответа на последующее воздействие.</dd></div><div id="ns-g-S6-T62"><dt>Митотическое сохранение регуляторных признаков</dt><dd>Сохранение определённых факторов или признаков хроматина во время митоза, способное влиять на восстановление регуляции.</dd></div><div id="ns-g-S6-T63"><dt>XIST</dt><dd>Длинная некодирующая РНК, участвующая в установлении инактивации X-хромосомы и действующая преимущественно в цис.</dd></div><div id="ns-g-S6-T64"><dt>Консолидация памяти</dt><dd>Стабилизация изменений в нервной системе, возникших при обучении и обеспечивающих долговременную память.</dd></div><div id="ns-g-S6-T65"><dt>Необходимость и достаточность</dt><dd>Необходимость устанавливают потерей результата без фактора; достаточность — появлением результата при введении фактора в заданных условиях.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 6 — объяснения","home_eyebrow":"Семинар 6 · объяснения","home_h1":"Метилирование ДНК, регуляторные элементы и память","home_lead":"Разберите четыре механизма семинара на схемах, проверьте себя вопросами и перейдите к сценариям практикума.","stat_steps_w":"шагов","stat_steps_d":"со схемой, объяснением и вопросом","stat_terms_w":"терминов","stat_terms_d":"в словаре семинара","stat_scen_w":"45 сценариев","stat_scen_d":"в отдельном практикуме","start":"Начать с метилирования ДНК →","how_h":"Как пройти семинар","how_steps":["Рассмотрите схему и измените условия: так видно, какие участники нужны для результата.","Прочитайте объяснение и сопоставьте его со схемой. Типичная ошибка в конце шага показывает, где легко перепутать причину и следствие.","Ответьте на вопрос. Разбор каждого варианта, в том числе неверного, объясняет, почему он подходит или не подходит."],"how_p1":"Все обязательные объяснения находятся на этой странице. Ссылки на статьи нужны, чтобы проверить утверждения по источникам и глубже изучить тему; для прохождения шага они не требуются. Любой шаг можно открыть из оглавления, а итоговая проверка в конце помогает найти пробелы.","how_p2":"Схемы упрощены. Экспериментальные данные, расчёты по заданным параметрам и условные задачи обозначены отдельно; условия вывода указаны в блоке «Источники и условия».","question_n":"Вопрос {n}","integr":"Итоговый раздел","steps_range":"Шаги {a}–{b}, всего {k}","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат опыта","practice_p":"Сценарии практикума находятся на отдельной странице: в каждом сценарии заданы вмешательство и показания и дан разбор ответов. Лучше пройти их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы из разных шагов собраны вместе. После ответа можно открыть объяснение нужного шага.","exam_open":"Проверить себя →","footer":"Версия 1.0 · учебные материалы кафедры биологии и генетики. Объяснения дополняют практикум и не заменяют его.","footer_lesson":"Схемы упрощены; условия, на которых основан вывод, указаны в блоке «Источники и условия».","step_of":"Шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Далее →","to_exam":"К итоговой проверке →","progress_label":"Пройдено шагов","of":"из","progress_note":"Шаг отмечается после верного ответа на его вопрос. Читать шаги можно в любом порядке.","reset":"Сбросить прогресс","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","mark_ok":"верно","mark_bad":"неверно","fb_ok":"Верно.","fb_bad":"Неверно.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия","src_note":"Ссылки нужны, чтобы проверить утверждения по источникам и глубже изучить тему; для прохождения шага они не требуются.","gl_eyebrow":"Словарь","gl_h1":"Термины семинара 6","gl_lead":"Определения даны в рабочих формулировках курса. Ссылки из текста шагов ведут сюда.","exam_eyebrow":"Проверка подготовки","exam_h1":"Итоговая проверка","exam_lead":"Здесь собраны вопросы из разных шагов, всего {n}. Отвечать можно в любом порядке.","exam_note":"Результаты итоговой проверки считаются отдельно: они не отмечают шаги пройденными и не заменяют их чтение.","all_eyebrow":"Весь материал","all_h1":"Все объяснения на одной странице","all_p":"Эта страница удобна для чтения подряд и для печати: схемы не включены, вопросы приведены вместе с разбором каждого варианта.","print":"Печать","pr_h1":"Практикум семинара 6","pr_p":"Сценарии практикума находятся на отдельной странице. Выберите вопрос, чтобы открыть его сценарии.","pr_open_q":"Вопрос {n}","pr_open":"Весь практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни"},"lessons":[{"id":"methylation","number":1,"section":0,"title":"Что изменяется при метилировании ДНК","question":1,"questions":[1],"keywords":["CpG","5mC","DNMT","метилтрансфераза","SAM","диада"],"lead":["Метилирование ДНК — это химическая модификация основания, при которой порядок нуклеотидов не меняется.","В основной модели курса метилируется цитозин в составе CpG."],"mechanism":["ДНК-метилтрансфераза (DNMT) переносит метильную группу с донора, [[T16|S-аденозилметионина (SAM)]], на атом C5 цитозина.","Образуются [[T02|5-метилцитозин (5mC)]] и [[T17|S-аденозилгомоцистеин (SAH)]].","Основание остаётся цитозином: оно по-прежнему образует пару с гуанином, и последовательность не меняется."],"paragraphs":["Метилирование ДНК у млекопитающих — это присоединение метильной группы к цитозину по атому углерода C5. Реакцию катализируют ДНК-метилтрансферазы. Донором метильной группы служит SAM, который превращается в SAH, а продуктом реакции становится 5mC.","Основание при этом остаётся цитозином: оно по-прежнему образует пару с гуанином, а порядок нуклеотидов не меняется. Метилирование — это изменение химического состояния основания, а не замена нуклеотида. Замена происходит в другом процессе: при дезаминировании 5mC образуется тимин.","Метилируется главным образом цитозин в составе [[T03|CpG-динуклеотида]]. В нём за цитозином в той же цепи в направлении 5′→3′ следует гуанин, а буква p обозначает фосфатный остаток между ними. Это не комплементарная пара C–G. Участок 5′-CG-3′ одной цепи комплементарен участку 3′-GC-5′ другой, поэтому в двухцепочечной ДНК [[T04|CpG-диаду]] образуют два цитозина — по одному в каждой цепи. Каждый из них может быть метилирован или нет; состояния диады обозначают MM (метилированы оба), MU (метилирован один) и UU (не метилирован ни один).","Метилирование вне CpG тоже существует: в геномах животных его описывают, в частности, в нейронах. Закономерности, установленные для CpG, поэтому нельзя без проверки переносить на другие контексты.","Сама по себе метка не определяет, будет ли ген экспрессироваться. Её влияние на связывание белков и на транскрипцию зависит от локуса, типа клеток и положения CpG; это влияние измеряют отдельно."],"trap":["CpG — это пара оснований C–G, соединённых водородными связями.","В записи CpG буква p обозначает фосфатный остаток, связывающий соседние нуклеотиды одной цепи. Комплементарная пара C–G записывается иначе, а два цитозина диады находятся в разных цепях."],"conditions":"Описание реакции метилирования и CpG-контекста опирается на обзор Smith и соавт. (2025) и на структуру комплекса DNMT3A–DNMT3L с ДНК (Zhang и соавт., 2018); метилирование вне CpG в геномах животных описано в обзоре Brethouwer и соавт. (2025). Схема показывает механизм и не содержит результатов измерений.","sources":["Smith2025","Zhang2018","Brethouwer2025"],"quiz":{"id":"S6-L01","question":"В участке ДНК цитозин в составе CpG превращён в 5mC. Порядок нуклеотидов сохранён. Какое изменение произошло?","options":[{"id":"S6-L01-1","text":"Основание химически модифицировано, но нуклеотид не заменён.","correct":true,"feedback":"DNMT присоединяет метильную группу к цитозину. Меняется химическое состояние основания, но нуклеотид не заменяется другим."},{"id":"S6-L01-2","text":"Цитозин заменён тимином, поэтому возникла точечная мутация.","correct":false,"feedback":"Образование 5mC не является заменой C на T. Дезаминирование 5mC — другой процесс."},{"id":"S6-L01-3","text":"Изменилось комплементарное основание: гуанин заменён аденином.","correct":false,"feedback":"Метилирование цитозина не затрагивает гуанин противоположной цепи: 5mC по-прежнему образует с ним пару."}]},"widget":{"kind":"dyad","title":"","s":{"title":"Рассмотрите CpG-диаду","status":"Схема механизма · не экспериментальные данные","modes_label":"Состояние диады","modes":["Без метилирования (UU)","Метилирован один цитозин (MU)","Метилированы оба цитозина (MM)","Для сравнения: замена C → T"],"strand_top":"Верхняя цепь","strand_bottom":"Нижняя цепь","cpg":"CpG-диада","mismatch":"некомплементарная пара","m_seq":"Порядок нуклеотидов","v_same":"сохранён","v_chg":"изменён","m_me":"Метилированных цитозинов в диаде","m_state":"Состояние диады","v_na":"не определяется","notes":["Оба цитозина диады не метилированы (UU). Участок читается как 5′-ACGT-3′ в верхней цепи и как 5′-ACGT-3′ в нижней: последовательность симметрична.","Метилирован цитозин верхней цепи: у атома C5 находится группа CH₃. Нижний цитозин не метилирован, поэтому диада полуметилированная (MU). Пары оснований и порядок нуклеотидов не изменились.","Метилированы оба цитозина диады (MM). Каждый из них по-прежнему образует пару с гуанином противоположной цепи, а последовательность осталась прежней.","Для сравнения показана замена основания: на месте цитозина стоит тимин, который образует с гуанином неправильную пару. Если репарация её не исправит, после репликации закрепится замена C→T, то есть мутация; метилирование последовательность не меняет."]}}},{"id":"de-novo","number":2,"section":0,"title":"Как устанавливается новый рисунок метилирования","question":1,"questions":[1],"keywords":["DNMT3A","DNMT3B","DNMT3L","de novo","ADD","PWWP","H3K4","H3K36"],"lead":["Метилирование de novo — это появление 5mC там, где метки раньше не было.","Его выполняют DNMT3A и DNMT3B, а не фермент поддержания DNMT1."],"mechanism":["DNMT3A или DNMT3B переносит метильную группу с SAM на цитозин неметилированной CpG-диады.","Для реакции не нужна метилированная родительская цепь: этим de novo отличается от поддерживающего метилирования.","Выбор участка зависит от нескольких признаков хроматина и от партнёров фермента, а не от одного сигнала."],"paragraphs":["[[T10|Метилирование de novo]] — установление метки на участке, который был неметилированным в обеих цепях. Его выполняют ферменты [[T13|DNMT3A и DNMT3B]]. Как и все ДНК-метилтрансферазы, они переносят метильную группу с SAM на цитозин, а SAM при этом превращается в SAH.","Участок для метилирования выбирается не по одному признаку. ADD-домен DNMT3A связывается с N-концевым участком гистона H3, лизин 4 которого не метилирован (H3K4me0). PWWP-домены DNMT3A и DNMT3B узнают метилированный лизин 36 гистона H3 (H3K36me2/3). Эти взаимодействия помогают направить фермент к определённым участкам хроматина, но каждое из них само по себе не определяет, будет ли участок метилирован.","[[T14|DNMT3L]] родственен DNMT3A и DNMT3B, но каталитически неактивен. Он образует с DNMT3A комплекс (структуру такого комплекса определили Jia и соавт.) и усиливает метилирование. Особенно важна его роль в зародышевой линии, например при установлении импринтов. Это не значит, что DNMT3L нужен для метилирования любого CpG в соматических клетках.","Разделение ролей — «de novo выполняют DNMT3A и DNMT3B, поддержание выполняет DNMT1» — верно как основная схема. Но DNMT3A и DNMT3B участвуют и в поддержании метилирования отдельных участков, поэтому это правило не абсолютное.","Появление 5mC на новом участке показывает, что метилтрансферазная активность там была. Какой именно фермент метилировал участок и какие признаки хроматина его направили, выясняют отдельными опытами: например, поочерёдно инактивируют каждую DNMT и измеряют метилирование того же локуса."],"trap":["Метилирование de novo возникает, когда DNMT1 копирует метку родительской цепи.","Копирование метки с родительской цепи — поддерживающее метилирование. При de novo метилированной родительской цепи нет, поэтому DNMT3A и DNMT3B действуют на неметилированную диаду."],"conditions":"Роли DNMT3A, DNMT3B и DNMT3L описаны по обзору Smith и соавт. (2025); связывание ADD-домена DNMT3A с гистоном H3, не метилированным по лизину 4, — по работе Otani и соавт. (2009), а узнавание H3K36me2/3 PWWP-доменом DNMT3A — по работе Weinberg и соавт. (2019; обе прочитаны на уровне реферата); для PWWP-домена DNMT3B отдельный первичный источник в шаге не указан; структурные работы — Jia и соавт. (2007) о комплексе DNMT3A с DNMT3L и Zhang и соавт. (2018) о метилировании de novo. Схема показывает механизм, а не измеренную скорость реакции.","sources":["Jia2007","Zhang2018","Smith2025","Otani2009","Weinberg2019"],"quiz":{"id":"S6-L02","question":"В ранее неметилированном участке впервые появился 5mC. Какой процесс непосредственно объясняет появление новой метки?","options":[{"id":"S6-L02-1","text":"Метилирование de novo ферментами DNMT3A/3B.","correct":true,"feedback":"DNMT3A/3B способны устанавливать метилирование там, где исходной метки не было."},{"id":"S6-L02-2","text":"Восстановление метки ферментом DNMT1 по уже метилированной родительской цепи.","correct":false,"feedback":"В условии нет метилированной родительской цепи, а без неё поддерживающее метилирование невозможно."},{"id":"S6-L02-3","text":"Окисление цитозина ферментами TET.","correct":false,"feedback":"TET окисляют 5mC и его производные; перенос метильной группы с SAM они не катализируют."}]},"widget":{"kind":"denovo","title":"","s":{"title":"Условия реакции de novo","status":"Схема механизма · не экспериментальные данные","c_enz":"DNMT3A/3B активны","c_sam":"SAM доступен как донор метильной группы","c_l3l":"Партнёр DNMT3L (клетки зародышевой линии)","ctx_label":"Признак хроматина рядом с участком","ctx":["Не выбран","H3K4me0: ADD-домен связывается","H3K4me3: связывание ADD-домена ослаблено","H3K36me2/3: PWWP-домен связывается"],"substrate":"Неметилированная CpG-диада (UU)","product":"5mC","waste":"SAH","r_yes":"Метильная группа переносится с SAM на цитозин: на неметилированном участке образуется 5mC, а SAM превращается в SAH.","r_noenz":"DNMT3A/3B неактивны, поэтому метильная группа не переносится: 5mC не появляется.","r_nosam":"Нет донора метильной группы: фермент не может образовать 5mC.","l3l_yes":"DNMT3L каталитически неактивен: он не переносит метильную группу, но в комплексе с DNMT3A усиливает метилирование.","l3l_alone":"DNMT3L без активной DNMT3A метилирования не даёт.","ctx_notes":["Признак хроматина не выбран. В клетке выбор участка зависит от нескольких признаков одновременно.","ADD-домен DNMT3A узнаёт N-конец H3 без метилирования K4. Это помогает направить фермент к такому участку, но не заменяет остальных признаков.","Метилирование K4 ослабляет связывание ADD-домена с H3. Фермент реже направляется на такие участки, однако другие признаки могут изменить результат.","PWWP-домен связывается с метилированным K36 гистона H3. Это один из признаков, направляющих DNMT3A и DNMT3B к хроматину, но не единственный."],"m_prod":"Образование 5mC","m_prod_y":"идёт","m_prod_n":"не идёт","m_rate":"Влияние DNMT3L","m_rate_y":"усиление метилирования","m_rate_n":"нет влияния"}}},{"id":"maintenance","number":3,"section":0,"title":"Как восстанавливается метилирование после репликации","question":1,"questions":[1],"keywords":["DNMT1","UHRF1","поддерживающее метилирование","полуметилированная","репликация","MU"],"lead":["После репликации полностью метилированной CpG-диады обе дочерние молекулы ДНК полуметилированы: старая цепь несёт метку, новая — нет.","Поддерживающее метилирование восстанавливает метку на новой цепи по образцу старой."],"mechanism":["Репликация полуконсервативна: каждая дочерняя диада получает одну старую цепь и одну новую.","[[T15|UHRF1]] связывается с полуметилированной ДНК и с признаками хроматина; это помогает привлечь [[T12|DNMT1]] к участку и активировать фермент.","Метильная группа старой цепи остаётся на месте, а новая группа переносится с SAM."],"paragraphs":["Допустим, что CpG-диада полностью метилирована (MM). При репликации каждая дочерняя молекула получает одну родительскую цепь и одну только что синтезированную. Старая цепь сохраняет 5mC, а в новой цепи в этой позиции стоит неметилированный цитозин. Поэтому обе дочерние диады полуметилированы (MU). ДНК-полимераза метильные группы не копирует.","[[T11|Поддерживающее метилирование]] — отдельная ферментативная реакция после репликации. UHRF1 связывается с полуметилированной ДНК и с признаками хроматина; это помогает привлечь DNMT1 к участку и активировать фермент. В опытах in vitro UHRF1 повышал активность и специфичность DNMT1 по аллостерическому механизму. Сам DNMT1 тоже избирателен: полуметилированные CpG он метилирует эффективнее, чем неметилированные.","Метильная группа старой цепи остаётся на месте и служит образцом. Новая группа переносится с SAM на цитозин новой цепи, и диада возвращается в состояние MM.","Реакция выполняется не со стопроцентной точностью. Для метилированного CpG-островка гена FMR1 на неактивной X-хромосоме в лимфоцитах человека методом шпилечной бисульфитной ПЦР получена оценка около 96 % восстановленных диад за деление. Поэтому часть диад остаётся полуметилированной, и если метилирование de novo этого не компенсирует, метилирование участка постепенно уменьшается."],"trap":["Репликация переносит метильные группы на новую цепь вместе с копированием последовательности.","ДНК-полимераза копирует порядок нуклеотидов, но не метку. Метильную группу на новую цепь переносит DNMT1 после репликации."],"conditions":"Восстановление метки по образцу старой цепи и роль UHRF1 описаны по работе Bashtrykov и соавт. (2014; опыты с очищенными белками) и обзору Smith и соавт. (2025). Оценка около 96 % за деление относится к CpG-островку гена FMR1 неактивной X-хромосомы в лимфоцитах человека (Laird и соавт., 2004); на другие участки её переносить нельзя. На схеме эффективность задаётся ползунком как учебный параметр.","sources":["Bashtrykov2014","Smith2025","Laird2004"],"quiz":{"id":"S6-L03","question":"Полностью метилированная CpG-диада реплицировалась. Поддерживающее метилирование ещё не произошло. Каково состояние двух дочерних молекул?","options":[{"id":"S6-L03-1","text":"В каждой молекуле метилирован цитозин старой цепи, а цитозин новой цепи не метилирован.","correct":true,"feedback":"Полуконсервативная репликация сохраняет одну старую цепь в каждой дочерней молекуле."},{"id":"S6-L03-2","text":"В одной молекуле метилированы обе цепи, а в другой не метилирована ни одна.","correct":false,"feedback":"Здесь обе старые цепи оказались бы в одной молекуле, но при полуконсервативной репликации каждая дочерняя молекула получает одну старую цепь."},{"id":"S6-L03-3","text":"Обе молекулы полностью метилированы, поскольку репликация переносит метильные группы на новые цепи.","correct":false,"feedback":"ДНК-полимераза не копирует метилирование. Для новой метки необходима отдельная реакция DNMT."}]},"widget":{"kind":"maint","title":"","s":{"title":"От родительской диады к дочерним","status":"Схема механизма · эффективность — учебный параметр","stages_label":"Этап","stages":["Родительская диада (MM)","После репликации (две MU)","Работают UHRF1 и DNMT1","Метка восстановлена"],"eff":"Доля восстановленных диад, %","old":"старая цепь","new":"новая цепь","sam":"SAM → SAH","enz":"UHRF1 + DNMT1","m_groups":"Метильных групп на дочерних диадах","m_restored":"Диад в состоянии MM из двух","m_mu":"Диад в состоянии MU из двух","notes":["Родительская диада метилирована на обеих цепях: два 5mC (MM).","Репликация дала две дочерние диады. В каждой метилирована только старая цепь (MU); всего на двух диадах 2 метильные группы, а не 4.","UHRF1 связывается с полуметилированной диадой и направляет DNMT1 к новой цепи. Метильные группы переносятся с SAM на цитозины новой цепи.","Если реакция прошла в обеих диадах, на них снова 4 метильные группы. При неполном восстановлении остаются диады MU, и доля метилированных цитозинов участка при последующих делениях уменьшается."]}}},{"id":"passive-loss","number":4,"section":0,"title":"Почему метилирование уменьшается при делениях","question":1,"questions":[1],"keywords":["пассивное деметилирование","разведение метки","2^-n","репликация","MM","MU","UU"],"lead":["Доля метилированных цитозинов может уменьшаться при делениях без химического удаления метки.","Тогда новые цепи остаются неметилированными, а старые просто распределяются между всё большим числом копий."],"mechanism":["Старая цепь сохраняет 5mC, но после каждой репликации число цепей удваивается.","Если нет ни поддерживающего метилирования, ни метилирования de novo, новые цепи метку не получают.","Доля метилированных цитозинов уменьшается как 2⁻ⁿ, где n — число раундов репликации."],"paragraphs":["[[T18|Пассивное деметилирование]] — уменьшение доли метилированных оснований при репликации. Метильные группы при этом не отщепляются: просто новые цепи не получают метки, потому что поддерживающее метилирование не срабатывает или срабатывает не полностью.","Рассмотрим идеальную задачу. Исходная диада метилирована на обеих цепях (MM). Поддерживающее метилирование и метилирование de novo полностью отсутствуют, 5mC не окисляется, клетки не подвергаются отбору. После первой репликации получаются две диады MU: в них 2 метилированных цитозина из 4, то есть 50 %. После второй репликации четыре диады содержат 8 цитозинов, из которых метилированы только 2 старых, то есть 25 %. После n раундов доля метилированных цитозинов равна 2⁻ⁿ.","Эта формула описывает только идеальную задачу. В клетке и в практикуме семинара метилирование de novo может оставаться активным, копирование метки бывает неполным, а окисление 5mC может идти параллельно. Результаты практикума нельзя заменять значением 2⁻ⁿ.","Это важно и для выводов из опытов. Уменьшение доли 5mC после делений совместимо с пассивной потерей, но не доказывает её: активное деметилирование и отбор клеток могут дать похожий результат. Чтобы различить эти объяснения, нужны контроль числа делений, измерение окисленных форм 5mC и определение состояния диад."],"trap":["Доля метилированных цитозинов снизилась — значит, метильные группы были химически удалены.","Доля может снизиться и при репликации без удаления: старые 5mC сохраняются, но распределяются среди растущего числа молекул. Химическое удаление нужно подтверждать отдельно."],"conditions":"Идеальная задача и формула 2⁻ⁿ — расчёт, который следует из полуконсервативной репликации при заданных допущениях, а не результат опыта. Поддерживающее метилирование описано по обзору Smith и соавт. (2025) и работе Bashtrykov и соавт. (2014; опыты in vitro о стимуляции DNMT1 белком UHRF1). В практикуме рассматриваются другие условия: метилирование de novo может оставаться активным.","sources":["Smith2025","Bashtrykov2014"],"quiz":{"id":"S6-L04","question":"В идеальной задаче исходная CpG-диада метилирована на обеих цепях. Поддерживающего метилирования, метилирования de novo и активного удаления 5mC нет. Какова доля метилированных цитозинов этого локуса среди всех копий после двух раундов репликации?","options":[{"id":"S6-L04-1","text":"25 %.","correct":true,"feedback":"Число старых метилированных цитозинов сохраняется, а общее число копий увеличивается вчетверо. Доля составляет 1/4."},{"id":"S6-L04-2","text":"50 %.","correct":false,"feedback":"50 % получается после одного раунда. Условие задаёт два раунда репликации."},{"id":"S6-L04-3","text":"0 %.","correct":false,"feedback":"В условии нет химического удаления старой метки. Её доля уменьшается, но старые метилированные цепи сохраняются."}]},"widget":{"kind":"passive","title":"","s":{"title":"Раунды репликации в идеальной задаче","status":"Расчёт для заданных допущений · не экспериментальные данные","rounds":"Число раундов репликации n","mode_label":"Условия","modes":["Идеальная задача: метилирование не восстанавливается","Метилирование de novo остаётся активным"],"tree_title":"Родословная диад","chart_title":"Доля метилированных цитозинов","x_lab":"Раунды репликации","y_lab":"Доля 5mC, %","m_c":"Доля метилированных цитозинов","m_mm":"Диады MM","m_mu":"Диады MU","m_uu":"Диады UU","formula":"Доля метилированных цитозинов m = fMM + fMU/2, где fMM и fMU — доли диад MM и MU. В идеальной задаче m = 2⁻ⁿ.","ideal":"Старые цепи сохраняют 5mC, новые остаются неметилированными. После {n} раундов: диад {d}, цитозинов {c}, из них метилированы {k}.","denovo":"При активном метилировании de novo часть неметилированных диад метилируется заново, а копирование метки может быть неполным. Доли диад зависят от скоростей этих процессов, поэтому значение 2⁻ⁿ здесь не применяется; расчёт для таких условий приведён в практикуме."}}},{"id":"tet-tdg","number":5,"section":0,"title":"Как окисление связано с активным деметилированием","question":1,"questions":[1],"keywords":["TET","TDG","5hmC","5fC","5caC","BER","активное деметилирование","оксигеназа"],"lead":["В основной модели активное деметилирование идёт через окисление 5mC и удаление окисленного основания.","Метильную группу ферменты не отщепляют напрямую."],"mechanism":["[[T19|TET]] последовательно окисляют 5mC до 5hmC, 5fC и 5caC; для реакции нужны Fe²⁺, O₂ и α-кетоглутарат.","[[T21|TDG]] вырезает 5fC и 5caC; затем [[T22|эксцизионная репарация оснований]] восстанавливает обычный цитозин.","5hmC — самостоятельная химическая форма: её появление ещё не означает завершения деметилирования."],"paragraphs":["Белки TET1, TET2 и TET3 — диоксигеназы. Для реакции им нужны ионы Fe²⁺, молекулярный кислород и α-кетоглутарат. TET не отщепляют метильную группу, а окисляют её: 5mC превращается в 5-гидроксиметилцитозин ([[T20|5hmC]]), затем в 5-формилцитозин (5fC) и в 5-карбоксилцитозин (5caC).","ДНК-гликозилаза TDG распознаёт окисленные формы 5fC и 5caC. Она вырезает не метильную группу, а само основание, и в цепи остаётся участок без основания. Затем эксцизионная репарация оснований (BER) обрабатывает этот участок, достраивает цитозин и лигирует цепь. Так восстанавливается немодифицированный цитозин ([[T23|активное деметилирование]]).","5hmC нельзя считать «почти цитозином». Это отдельная химическая форма, которая в ряде тканей может сохраняться. Её обнаружение не доказывает, что путь дошёл до конца: об этом можно судить по другим продуктам и по результату репарации. Если после активации TET доля 5hmC в локусе выросла, это означает рост доли продукта окисления 5mC; восстановление обычного цитозина проверяют отдельно.","Окисление не исключает пассивной потери. Окисленные формы хуже распознаются системой поддерживающего метилирования, поэтому окисление и последующее разведение метки при репликации могут действовать вместе. Вклад каждого пути оценивают отдельно."],"trap":["TET отщепляют метильную группу от 5mC, и цитозин сразу восстанавливается.","TET катализируют окисление. Обычный цитозин восстанавливается только после того, как гликозилаза TDG удалит основание и пройдёт репарация; эти этапы нужно измерять отдельно."],"conditions":"Последовательное окисление 5mC ферментами TET описано в работе Ito и соавт. (2011); вырезание 5caC гликозилазой TDG — в работе He и соавт. (2011); общая картина — в обзоре Kohli и соавт. (2013). Схема показывает порядок реакций, а не скорости.","sources":["Ito2011","He2011","Kohli2013"],"quiz":{"id":"S6-L05","question":"После активации TET доля 5hmC в локусе увеличилась. Какой вывод непосредственно поддерживает это наблюдение?","options":[{"id":"S6-L05-1","text":"Выросла доля продукта окисления 5mC; возврат к обычному цитозину не доказан.","correct":true,"feedback":"5hmC — отдельная химическая форма. Конечный результат пути устанавливают, измеряя другие продукты и результат репарации."},{"id":"S6-L05-2","text":"Все модифицированные цитозины в этом локусе уже заменены обычными цитозинами.","correct":false,"feedback":"Наличие 5hmC показывает, что по крайней мере часть цитозинов ещё модифицирована."},{"id":"S6-L05-3","text":"TET удалили метильную группу напрямую, без образования промежуточных оснований.","correct":false,"feedback":"TET не отщепляют метильную группу, а окисляют 5mC до 5hmC, 5fC и 5caC. В этом пути обычный цитозин восстанавливается после удаления 5fC или 5caC гликозилазой TDG и эксцизионной репарации оснований."}]},"widget":{"kind":"tet","title":"","s":{"title":"Путь от 5mC к цитозину","status":"Схема механизма · не экспериментальные данные","c_tet":"TET активны","c_fe":"Fe²⁺","c_o2":"O₂","c_akg":"α-кетоглутарат","c_tdg":"TDG активна","c_ber":"Эксцизионная репарация оснований (BER) завершена","nodes":["5mC","5hmC","5fC","5caC","Участок без основания","Цитозин"],"groups":["−CH₃","−CH₂OH","−CHO","−COOH"],"tet_lab":"TET: Fe²⁺, O₂, α-КГ","tdg_lab":"TDG вырезает основание","ber_lab":"BER достраивает цитозин","stop":"Путь прерывается здесь","end":"Путь завершён: цитозин восстановлен","r0":"TET неактивны (не хватает самого фермента или одного из кофакторов), поэтому 5mC не окисляется. Остаётся 5mC; пассивная потеря при репликации возможна и без этого пути.","r1":"TET активны, но TDG неактивна. Накапливаются окисленные формы 5hmC, 5fC и 5caC; обычный цитозин не восстанавливается.","r2":"TET и TDG активны, но репарация не завершена. В цепи остаётся участок без основания, обычный цитозин ещё не восстановлен.","r3":"TET и TDG активны, BER завершена. Цитозин восстановлен. Это один из путей потери метки; разведение при репликации может идти параллельно, в том числе для окисленных форм."}}},{"id":"methylation-measure","number":6,"section":0,"title":"Что показывают методы анализа метилирования","question":1,"questions":[1],"keywords":["бисульфитное секвенирование","oxBS-seq","TAB-seq","hairpin","шпилька","5hmC","MM","MU","UU"],"lead":["Обычное бисульфитное секвенирование не отличает 5mC от 5hmC.","Чтобы их различить, нужны дополнительные методы, например oxBS-seq или TAB-seq, а состояние двух цепей диады читают методом шпильки."],"mechanism":["При бисульфитной обработке обычный цитозин читается как тимин, а 5mC и 5hmC читаются как цитозин.","oxBS-seq выявляет 5mC, а TAB-seq — 5hmC; по разности сигналов обычного бисульфитного секвенирования и oxBS-seq при тех же контролях оценивают долю 5hmC.","Метод шпильки соединяет обе цепи одной молекулы, поэтому позволяет определить состояние диады: MM, MU или UU; при обычной бисульфитной обработке «M» означает 5mC или 5hmC."],"paragraphs":["При обычном бисульфитном секвенировании неметилированный цитозин превращается в урацил, который после ПЦР читается как тимин. 5mC устойчив к этому превращению. 5hmC в реакции с бисульфитом образует продукт, который тоже не превращается в урацил. Поэтому сигнал «цитозин сохранился» объединяет 5mC и 5hmC.","В oxBS-seq перед бисульфитной обработкой 5hmC окисляют до 5fC. Эта форма при обработке бисульфитом читается как тимин, поэтому остаточный сигнал принадлежит 5mC. В TAB-seq 5hmC сначала защищают присоединением глюкозы, затем окисляют 5mC ферментом TET до 5caC; в результате сохраняется сигнал 5hmC. По разности сигналов обычного бисульфитного секвенирования и oxBS-seq оценивают долю 5hmC.","Метод шпильки (hairpin-bisulfite) соединяет две цепи одной молекулы и поэтому позволяет прочитать состояние обоих цитозинов диады. Он различает MM, MU и UU (при обычной бисульфитной обработке «M» означает 5mC или 5hmC), тогда как обычное бисульфитное секвенирование даёт только долю метилирования в каждой позиции цитозина.","Для всех этих методов нужны контроли: эффективность превращения неметилированного цитозина, эффективность окисления в oxBS-seq, полнота защиты 5hmC в TAB-seq и одинаковая нормировка образцов. Числа на схеме — искусственные: они показывают логику вычитания, а не результат опыта."],"trap":["Обычный бисульфитный сигнал 60 % означает, что 60 % цитозинов — это 5mC.","Бисульфитный сигнал суммирует 5mC и 5hmC. Чтобы выделить 5mC, нужен oxBS-seq, а 5hmC оценивают по разности сигналов или напрямую методом TAB-seq."],"conditions":"Принцип oxBS-seq описан в работе Booth и соавт. (2013); поведение 5hmC в бисульфитном секвенировании — в работе Huang и соавт. (2010); метод шпильки — в работе Laird и соавт. (2004). Числа на схеме искусственные и заданы для иллюстрации вычитания.","sources":["Booth2013","Huang2010","Laird2004"],"quiz":{"id":"S6-L06","question":"В образцах с сопоставимой нормировкой обычное бисульфитное секвенирование даёт сигнал 60 %, а oxBS-seq — 40 %. Контроли химического превращения пройдены. Чем непосредственно объясняется разность сигналов?","options":[{"id":"S6-L06-1","text":"Приблизительно 20 процентных пунктов приходятся на 5hmC.","correct":true,"feedback":"В заданном сравнении обычный бисульфит учитывает 5mC вместе с 5hmC, а oxBS-seq — 5mC. Разность составляет 20 процентных пунктов, а не относительное изменение на 20 %."},{"id":"S6-L06-2","text":"5mC составляет 60 %, а 5hmC отсутствует.","correct":false,"feedback":"5mC здесь оценивают по сигналу oxBS-seq, то есть 40 %, а не 60 %. Разность сигналов нельзя приписать 5mC."},{"id":"S6-L06-3","text":"20 % всех CpG-диад обязательно метилированы на обеих цепях.","correct":false,"feedback":"Сигнал отдельных цитозинов не определяет, как метки распределены между двумя цепями одной диады."}]},"widget":{"kind":"measure","title":"","s":{"title":"Что выявляет каждый метод","status":"Искусственные числа · идеальные контроли","sl_mc":"Доля 5mC среди цитозинов участка, %","sl_hmc":"Доля 5hmC, %","sl_eff":"Эффективность окисления в oxBS-seq, %","bs":"Обычный бисульфит","ox":"oxBS-seq","tab":"TAB-seq","diff":"Разность: бисульфит − oxBS","unit_pp":"п. п.","y_lab":"Сигнал «цитозин сохранился», %","t_head":["Химическая форма","Обычный бисульфит","oxBS-seq","TAB-seq"],"rows":[["Цитозин","T","T","T"],["5mC","C","C","T"],["5hmC","C","T","C"]],"t_note":"В таблице показано чтение каждой формы при полном превращении. Столбец — метод, значение — основание, которое видно после секвенирования.","note_ideal":"Разность сигналов равна доле 5hmC: {d} процентных пунктов. Оценка верна только при сопоставимой нормировке и пройденных контролях превращения.","note_incomplete":"Окисление неполное: часть 5hmC осталась и читается в oxBS-seq как цитозин. Сигнал oxBS-seq завышает долю 5mC, а разность занижает долю 5hmC.","m_c":"Доля обычного цитозина"}}},{"id":"methyl-binding","number":7,"section":0,"title":"Как белки связывают метилированную ДНК","question":1,"questions":[1],"keywords":["MeCP2","MBD1","MBD2","MBD3","MBD4","NCoR","SMRT","NuRD","Ретт","CTCF"],"lead":["Метилирование может по-разному менять связывание белков с ДНК.","Белки с MBD-доменом образуют разнородную группу: у каждого свои партнёры и функции."],"mechanism":["Метильная группа 5mC выступает в большую бороздку и меняет поверхность ДНК.","Одни транскрипционные факторы связываются с метилированным мотивом хуже, чем с неметилированным, у других связывание не меняется; результат зависит от белка и положения CpG.","Следствие связывания определяют партнёры белка: MeCP2 взаимодействует с NCoR/SMRT, а MBD2 входит в комплекс NuRD."],"paragraphs":["Метильная группа 5mC находится в большой бороздке ДНК и меняет её поверхность. Для транскрипционного фактора, узнающего мотив, это может ослабить связывание, а может не повлиять на него: результат зависит от белка и от положения CpG в мотиве. Поэтому нельзя утверждать, что метилирование блокирует связывание всех факторов. Пример — CTCF, чувствительность которого к метилированию зависит от конкретного сайта.","Часть белков узнаёт метилированную ДНК с помощью MBD-домена — домена связывания метилированного CpG. Эти белки нельзя считать однородной группой. [[T27|MeCP2]], MBD1 и MBD2 связываются с метилированной ДНК. MBD3 в обычном виде метил-CpG не связывает. MBD4 — прежде всего ДНК-гликозилаза репарации.","Дальнейшее зависит от партнёров. MeCP2 взаимодействует с корепрессорным комплексом NCoR/SMRT через участок, образованный аминокислотными остатками 269–309. Мутации синдрома Ретта в участке 302–306 эту связь нарушают, а замена T158M в MBD-домене её не нарушает, но ухудшает связывание с метилированной ДНК. MBD2 входит в комплекс NuRD: в опытах in vitro этот комплекс предпочтительно связывает метилированные нуклеосомы и деацетилирует их. Эти данные относятся к комплексу MBD2–NuRD; на другие белки MBD их нельзя автоматически переносить.","Метилирование промотора, тела гена и повтора обсуждают раздельно. Метилирование промотора часто сопутствует подавлению транскрипции, однако это закономерность, зависящая от локуса, а не правило для каждого гена."],"trap":["Все белки семейства MBD связывают метилированную ДНК и подавляют транскрипцию.","Функции членов семейства различаются: MBD3 в обычном виде не связывает метил-CpG, а MBD4 — гликозилаза. Даже связывание с метилированной ДНК не означает единого репрессорного действия."],"conditions":"Взаимодействие MeCP2 с NCoR/SMRT и роль мутаций синдрома Ретта описаны в работе Lyst и соавт. (2013; HeLa, фрагменты MeCP2 и мыши с мутацией R306C); комплекс MBD2–NuRD — в работе Feng и Zhang (2001; ядерный экстракт HeLa, in vitro); связывание MeCP2 с метилированной ДНК вне CpG в нейронах — Chen и соавт. (2015); зависимость CTCF от метилирования — обзор Monteagudo-Sánchez и соавт. (2024); для MBD4 в клетках человека описано также HDAC-зависимое подавление транскрипции через Sin3A и HDAC1 (Kondo и соавт., 2005; реферат). Выводы относятся к указанным системам.","sources":["Chen2015","Monteagudo2024","Lyst2013","Feng2001","Kondo2005"],"quiz":{"id":"S6-L07","question":"В локусе появился 5mC. Для фактора X показано снижение связывания с метилированным мотивом. Какое предсказание относится непосредственно к этому наблюдению?","options":[{"id":"S6-L07-1","text":"При прочих равных занятость данного мотива фактором X может уменьшиться.","correct":true,"feedback":"Вывод относится к изученному мотиву и фактору. Изменение количества РНК нужно измерить отдельно."},{"id":"S6-L07-2","text":"Все транскрипционные факторы перестанут связываться с любыми участками ДНК.","correct":false,"feedback":"Чувствительность к метилированию зависит от белка и положения CpG в мотиве."},{"id":"S6-L07-3","text":"Транскрипция любого гена с метилированным телом немедленно прекратится.","correct":false,"feedback":"Метилирование тела гена не имеет единственного универсального эффекта; в условии исследован конкретный фактор."}]},"widget":{"kind":"mbd","title":"","s":{"title":"Метилирование и связывание белков","status":"Схема механизма · не экспериментальные данные","a_factor":"Фактор","a_fs":["Фактор X (чувствителен к метилированию мотива)","Фактор Y (к метилированию не чувствителен)"],"a_me":"Мотив содержит 5mC","a_bound":"связан","a_free":"связывание ослаблено","a_notes":["Для фактора X метильная группа меняет поверхность большой бороздки мотива, и занятость мотива может уменьшиться. Вывод относится к этому фактору и этому мотиву; изменение количества РНК нужно измерять отдельно.","Для фактора Y метилирование мотива связывание не меняет. Чувствительность определяется белком и положением CpG, а не самим фактом метилирования.","Мотив не метилирован, фактор связывается без помех."],"b_label":"Белок с MBD-доменом","b_names":["MeCP2","MBD1","MBD2","MBD3","MBD4"],"b_bind":"Связывание метилированной ДНК","b_part":"Партнёр / комплекс","b_role":"Что известно","b":[["да; MeCP2 связывает также ДНК, метилированную вне CpG (в нейронах)","NCoR/SMRT (участок MeCP2 269–309)","Мутации синдрома Ретта в участке 302–306 нарушают связь с NCoR/SMRT; замена T158M ухудшает связывание с метилированной ДНК."],["да","в этой схеме не рассматривается","Входит в семейство MBD; функции членов семейства различаются, и выводы об одном белке нельзя переносить на другие."],["да","комплекс NuRD (MeCP1)","Комплекс с MBD2 in vitro предпочтительно связывает и деацетилирует метилированные нуклеосомы."],["в обычном виде нет","входит в комплекс NuRD","Не следует считать обычным белком, связывающим метил-CpG."],["да (MBD-домен)","Sin3A и HDAC1 (описано в клетках человека)","ДНК-гликозилаза: вырезает основание из некомплементарных пар, в том числе из пары T–G, возникающей после дезаминирования 5mC. Известна прежде всего как фермент репарации."]],"dna_lab":"ДНК с 5mC","no_bind":"связывания нет"}}},{"id":"imprinting","number":8,"section":0,"title":"Как родительский аллель связан с регуляцией гена","question":1,"questions":[1],"keywords":["импринтинг","H19","Igf2","ICR","CTCF","UBE3A","UBE3A-ATS","Ретт","ICF","Прадера","Ангельман","Беквита","XIST"],"lead":["При [[T24|геномном импринтинге]] активность аллеля зависит от того, от какого родителя он получен.","У изученных импринтированных локусов, например H19/Igf2, различие закладывается метилированием контрольной области в зародышевой линии и сохраняется в соматических клетках."],"mechanism":["В изученных локусах, например H19/Igf2, DNMT в зародышевой линии устанавливают разное метилирование [[T25|контрольной области импринтинга (ICR)]] на родительских аллелях; в соматических клетках различие поддерживается.","В мышином локусе H19/Igf2 метилирование ICR определяет, связывается ли с ней CTCF и достигают ли общие энхансеры гена Igf2.","У каждого импринтированного локуса свой механизм: пример H19/Igf2 нельзя переносить на UBE3A и другие локусы."],"paragraphs":[{"h":"Мышиный локус H19/Igf2"},"Импринтинг проявляется как [[T26|аллель-специфичная экспрессия]], зависящая от родительского происхождения аллеля. Различие устанавливается в зародышевой линии, где в установлении импринтов участвует и [[T14|DNMT3L]], а в соматических клетках поддерживается: DNMT1 воспроизводит метилирование ICR при репликации. Импринтинг не требует различий в последовательности двух аллелей: различаются родительская метка и её последствия. В мышином локусе H19/Igf2 метка связана с ICR, расположенной между генами.","На материнском аллеле ICR не метилирована, и с ней связывается CTCF. Связанный CTCF ограничивает доступ общих энхансеров к гену Igf2: на этом аллеле Igf2 не экспрессируется, а H19 экспрессируется. На отцовском аллеле ICR метилирована, и CTCF с ней не связывается. Поэтому энхансеры достигают Igf2: этот ген экспрессируется, а H19 на этом аллеле молчит. Таким образом, метилирование ICR связано с аллель-специфичной экспрессией через связывание CTCF и доступ энхансеров.","Контакты энхансеров с промоторами Igf2 на отцовской хромосоме и их предотвращение связыванием CTCF в ICR на материнской показаны методом захвата конформации хромосом (Kurukuti и соавт., 2006). Мутации четырёх сайтов CTCF в ICR в культуре фибробластов мыши нарушали аллель-специфичный состав хроматина по всему домену, в том числе метки H3K27me3 и ацетилирование H3K9 (Han и соавт., 2008). Эти данные получены на мышах, и на другие виды и ткани их автоматически переносить нельзя. Чтобы проверить последствия нарушения сайта CTCF, измеряют аллель-специфичную РНК Igf2 вместе со связыванием CTCF и контактами локуса: изменение нужно показать именно для материнского аллеля.",{"h":"Другие локусы и разные виды нарушений"},"Инактивация X-хромосомы устроена иначе: она устанавливается длинной некодирующей РНК XIST (у мыши Xist) в цис на одной из двух X-хромосом и не сводится к метилированию одной контрольной области. Нельзя переносить на неё объяснение локуса H19/Igf2. Нарушения, связанные с метилированием, бывают разными. К нарушениям импринтинга относят, например, синдром Беквита — Видемана и синдромы Прадера — Вилли и Ангельмана: в них нарушена экспрессия импринтированных генов определённого локуса. Вариант синдрома ICF (ICF1) вызван мутациями гена DNMT3B и не сводится к общей потере метилирования. Синдром Ретта связан с мутациями гена MECP2, кодирующего белок, который связывается с метилированной ДНК. Это три разных вида нарушений.","Для гена UBE3A фраза «отцовский промотор просто метилирован» не подходит. В нейронах молчание отцовского аллеля связано с транскрипцией нейронального антисмыслового транскрипта UBE3A-ATS, перекрывающегося с геном UBE3A. В опытах на мышах антисмысловые олигонуклеотиды снижали содержание транскрипта Ube3a-ATS, и отцовский аллель Ube3a частично активировался. Эти данные не дают оснований для выводов о лечении людей."],"trap":["Импринтинг — это просто метилирование промотора гена на одном из аллелей.","У H19/Igf2 метилируется контрольная область, и результат зависит от связывания CTCF и доступа энхансеров. У UBE3A в нейронах важен антисмысловой транскрипт UBE3A-ATS."],"conditions":"Локус H19/Igf2 описан на мыши (Kurukuti и соавт., 2006; Han и соавт., 2008): обе работы прочитаны на уровне реферата; в первой контакты и роль связывания CTCF в ICR показаны захватом конформации хромосом, во второй мутации четырёх сайтов CTCF в ICR исследованы в культуре фибробластов мыши. Участие DNMT3L в установлении импринтов и воспроизведение метилирования ICR ферментом DNMT1 при репликации — сведения программы курса и шагов 2–3, в источниках этого шага не проверялись. Синдромы нарушения импринтинга — Kalsner и соавт. (2015; Прадера — Вилли, Ангельман) и Brioude и соавт. (2018; Беквит — Видеман). Работа Meng и соавт. (2015) выполнена на мышах: однократное введение антисмысловых олигонуклеотидов частично активировало отцовский аллель Ube3a. Эффект наблюдался около 16 недель; клинических выводов из этого не следует. Роль Xist — Bowness и соавт. (2022; эмбриональные стволовые клетки мыши; реферат). Мутации DNMT3B при синдроме ICF — Hansen и соавт. (1999; реферат). У мыши описан также импринтинг, не зависящий от метилирования ДНК (материнский H3K27me3; Inoue и соавт., 2017; реферат): на этой странице он не рассматривается.","sources":["Kurukuti2006","Han2008","Kalsner2015","Brioude2018","Chen2015","Bowness2022","Meng2015","Smith2025","Hansen1999","Inoue2017"],"quiz":{"id":"S6-L08","question":"В изучаемой мышиной модели CTCF связывается с неметилированной ICR материнского аллеля локуса H19/Igf2 и ограничивает действие общих энхансеров на Igf2. Какое измерение лучше всего проверит последствия нарушения этого сайта CTCF?","options":[{"id":"S6-L08-1","text":"Аллель-специфичная РНК Igf2, связывание CTCF и контакты локуса.","correct":true,"feedback":"Нужно установить изменение именно материнского аллеля и сопоставить его с нарушенным механизмом."},{"id":"S6-L08-2","text":"Только средняя доля 5mC, измеренная во всём геноме клеток образца.","correct":false,"feedback":"Средний сигнал по геному не показывает изменение исследуемого контрольного участка."},{"id":"S6-L08-3","text":"Только общее содержание белка CTCF во всех клетках каждого образца.","correct":false,"feedback":"Количество CTCF не показывает ни связывания с конкретным сайтом, ни аллель-специфичной транскрипции."}]},"widget":{"kind":"imprint","title":"","s":{"title":"Родительские аллели и контрольная область","status":"Схема механизма · прогноз по модели, не результат измерения","ex_label":"Пример","ex":["H19/Igf2 (мышь)","UBE3A (нейроны)"],"al_label":"Аллель","al":["Материнский аллель","Отцовский аллель"],"c_site":"Нарушить сайты CTCF в ICR (мутация)","c_cell":"Тип клеток","cells":["Нейрон","Клетка без нейрональной ATS"],"c_aso":"Снизить содержание Ube3a-ATS антисмысловыми олигонуклеотидами (опыт на мышах)","icr_u":"ICR не метилирована","icr_m":"ICR метилирована","ctcf":"CTCF связан","noctcf":"CTCF не связан","enh":"общие энхансеры","blocked":"доступ ограничен","reach":"достигают Igf2","e_on":"экспрессируется","e_off":"не экспрессируется","partial":"частично экспрессируется","ats":"антисмысловой транскрипт UBE3A-ATS","r":["Материнский аллель: ICR не метилирована, CTCF связан. Энхансеры не достигают Igf2, поэтому Igf2 не экспрессируется, а H19 экспрессируется.","Отцовский аллель: ICR метилирована, CTCF не связывается. Энхансеры достигают Igf2, и он экспрессируется; H19 не экспрессируется.","Материнский аллель с нарушенными сайтами CTCF: CTCF не связывается, ограничение доступа энхансеров исчезает, и Igf2 может экспрессироваться. Это прогноз по модели; его проверяют, измеряя аллель-специфичную РНК Igf2, связывание CTCF и контакты локуса.","Отцовский аллель с нарушенными сайтами CTCF: CTCF не связывался с метилированной ICR и до вмешательства, поэтому экспрессия Igf2 не должна меняться.","Нейрон, материнский аллель: UBE3A экспрессируется.","Нейрон, отцовский аллель: антисмысловой транскрипт UBE3A-ATS перекрывается с геном UBE3A, и отцовский UBE3A молчит.","Нейрон, отцовский аллель, содержание ATS снижено олигонуклеотидами: молчание ослабевает, отцовский Ube3a частично экспрессируется (опыт на мышах; эффект неполный и временный).","Клетка без нейрональной ATS: оба аллеля UBE3A экспрессируются, импринтированное молчание нейронов здесь не проявляется."]}}},{"id":"enhancer","number":9,"section":1,"title":"Чем различаются энхансер и промотор","question":2,"questions":[2],"keywords":["энхансер","промотор","TSS","в цис","репортёр","место начала транскрипции"],"lead":["Промотор — участок ДНК, на котором собирается комплекс инициации и определяется место начала транскрипции.","Энхансер — отдельный регуляторный участок: к нему присоединяются факторы и коактиваторы, и в результате меняется транскрипция мишени."],"mechanism":["На [[T28|промоторе]] собирается комплекс инициации; [[T29|место начала транскрипции (TSS)]] — позиция ДНК, с которой начинается синтез РНК.","К [[T30|энхансеру]] присоединяются транскрипционные факторы и коактиваторы; они повышают вероятность или скорость транскрипции мишени.","Участок ДНК энхансера к гену не перемещается: факторы связываются со своими сайтами, а влияние на промотор, по основной модели, передаётся при сближении энхансера и промотора в укладке хроматина."],"paragraphs":["Промотор расположен у начала гена; на нём собирается комплекс инициации транскрипции. Сборка комплекса определяет место начала транскрипции — позицию ДНК, с которой РНК-полимераза начинает синтез. Если удалить промотор вместе с этой позицией, РНК с него синтезироваться не будет, даже когда все остальные регуляторные участки сохранены.","Энхансер — другой участок ДНК, и его роль иная. К нему присоединяются транскрипционные факторы, а через них — коактиваторы, например Mediator и CBP/p300. В результате у промотора-мишени повышается вероятность или скорость транскрипции. Если энхансер и промотор находятся на одной молекуле ДНК, говорят о действии [[T55|в цис]]. Энхансер не заменяет промотор: при его удалении промотор и место начала транскрипции остаются, но вклад связанных с энхансером факторов исчезает, и количество РНК может снизиться. Насколько именно, зависит от других регуляторов локуса.","В репортёрных опытах энхансером называют фрагмент, который усиливает транскрипцию независимо от расстояния до промотора и от своей ориентации. Это операционный критерий такого опыта, а не описание геномного локуса. В геноме действие энхансера ограничивают доступность участков для факторов, организация хроматина и свойства самого промотора. Поэтому ближайший ген не обязательно служит мишенью, а функциональную мишень устанавливают вмешательством в исходном локусе (шаг 14).","Влияние энхансера на промотор передаётся не через последовательность ДНК и не через её перемещение, а через белки, связанные с энхансером; по основной модели оно передаётся при сближении двух участков в укладке хроматина (как именно, ещё обсуждается). Поэтому контакт энхансера с промотором и синтез РНК — разные величины; их различают в следующем шаге."],"trap":["Энхансер всегда регулирует ближайший к нему ген.","Энхансер может действовать на промотор, удалённый по последовательности ДНК. Независимость от расстояния и ориентации — критерий репортёрных опытов; в геноме мишень зависит от доступности, контактов и свойств промотора, поэтому её определяют вмешательством, а не по близости."],"conditions":"Определение энхансера по независимости от расстояния и ориентации и обсуждение его избирательности даны по обзору Yang и соавт. (2024); пространственная организация регуляции — по обзору Hafner и соавт. (2023); совместимость последовательностей — по работе Bergman и соавт. (2022). Схема показывает устройство локуса и не содержит результатов измерений.","sources":["Hafner2023","Yang2024","Bergman2022"],"quiz":{"id":"S6-L09","question":"Из локуса удалили активный энхансер, сохранив промотор и место начала транскрипции. Что удалено непосредственно?","options":[{"id":"S6-L09-1","text":"Регуляторный участок, связывающий факторы, которые усиливают транскрипцию мишени.","correct":true,"feedback":"Энхансер и промотор — разные элементы. Насколько снизится количество РНК, зависит от других регуляторов."},{"id":"S6-L09-2","text":"Само место начала транскрипции и все сайты сборки общего транскрипционного аппарата.","correct":false,"feedback":"По условию промотор и TSS сохранены."},{"id":"S6-L09-3","text":"Последовательность, которая обязательно назначает ближайший ген единственной мишенью.","correct":false,"feedback":"Энхансер может действовать на более удалённый промотор. Функциональную мишень нельзя определить только по расстоянию."}]},"widget":{"kind":"locus","title":"","s":{"title":"Элементы локуса и их удаление","status":"Схема устройства локуса · не экспериментальные данные","el_label":"Показать элемент","els":["Энхансер","Промотор","Место начала транскрипции (TSS)","Ген"],"el_notes":["Энхансер: участок связывания транскрипционных факторов; через них к нему присоединяются коактиваторы. Он повышает вероятность или скорость транскрипции мишени, а его положение по последовательности не определяет, какой ген будет мишенью.","Промотор: участок, на котором собирается комплекс инициации транскрипции. Без него РНК с этого места не синтезируется.","Место начала транскрипции (TSS) — позиция ДНК, с которой начинается синтез РНК. Это точка на последовательности в области промотора, а не отдельный белок и не отдельный регуляторный элемент.","Ген: транскрибируемая последовательность. Расстояние от энхансера до гена само по себе не показывает, регулирует ли энхансер этот ген."],"iv_label":"Вмешательство в локус","iv":["Без вмешательства","Удалить энхансер (промотор и TSS сохранены)","Удалить промотор вместе с TSS"],"iv_notes":["Исходное состояние: факторы занимают энхансер, комплекс инициации собран на промоторе, РНК синтезируется.","Энхансер удалён: сайтов для его факторов нет, но промотор и TSS сохранены, поэтому комплекс инициации может собираться. Количество РНК может снизиться; насколь
