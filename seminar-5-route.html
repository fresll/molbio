<noscript><style>.toolbar,.sidebar{display:none}</style><section class="card"><h1>Семинар 5: объяснения</h1><p>Для изменения схем и проверки ответов включите JavaScript. Все объяснения доступны ниже в этом же файле.</p></section><article class="card"><h2>Из чего состоит нуклеосома</h2><p>Нуклеосома сочетает компактную упаковку ДНК с возможностью локально изменять её доступность.</p><p>В канонической нуклеосомной частице около 147 пар оснований ДНК образуют примерно 1,65 витка левой суперспирали вокруг гистонового октамера. Октамер содержит по две молекулы H2A, H2B, H3 и H4: в его центре находится тетрамер (H3–H4)₂, к которому присоединены два димера H2A–H2B. Участки с укладкой histone fold обеспечивают и контакты между гистонами, и основную часть контактов с ДНК на поверхности октамера; выступающие хвосты дополнительно взаимодействуют с ДНК, соседними нуклеосомами и регуляторными белками.</p><p>Фосфатный остов ДНК несёт отрицательный заряд. Лизин и аргинин в гистонах обеспечивают положительно заряженные участки контакта, но связывание определяется также геометрией и другими взаимодействиями. Поэтому состав, модификации и положение ДНК на октамере могут менять свойства частицы.</p><p>Линкерная ДНК соединяет соседние частицы; её длина неодинакова. Линкерный гистон H1 связывается около входа и выхода ДНК и влияет на укладку хроматина. H1 не входит в октамер. Число 147 относится к канонической сердцевинной частице, а не ко всему повтору «нуклеосома + линкер».</p><p>Диаметр канонической частицы составляет около 11 нм. Упаковка позволяет разместить длинную ДНК в микрометровом ядре, но не делает её полностью недоступной. В ряде систем линкер содержит примерно 20–80 пар оснований; это пример диапазона, а не обязательная постоянная для каждой клетки.</p></article><article class="card"><h2>Доступность — вероятность, а не переключатель</h2><p>ДНК может временно отходить от поверхности октамера, даже если нуклеосома остаётся на месте.</p><p>Тепловые флуктуации приводят к частичному отворачиванию ДНК, обычно начиная с её концов, и последующему восстановлению контактов. Этот процесс называют «дыханием» нуклеосомы. Участок возле края часто экспонируется легче, чем участок ближе к центру, однако вероятность зависит от последовательности, состава частицы, модификаций и условий среды.</p><p>Доступность участка и его занятость транскрипционным фактором — разные величины. Первая характеризует возможность контакта с ДНК; вторая зависит также от концентрации фактора, его сродства, способности связываться с нуклеосомой и времени наблюдения. Открытый промотор не гарантирует транскрипцию: нужны подходящие факторы и работа транскрипционного аппарата.</p><p>В учебной модели ниже есть две фиксированные группы молекул ДНК: участок свободен или закрыт нуклеосомой. Занятость рассчитывается отдельно для каждой группы, затем усредняется. Если за время связывания молекулы переходят из одной группы в другую (например, нуклеосома сдвигается или вытесняется), понадобится кинетическая модель. Эксперимент с Rap1 показывает отдельное важное ограничение: сокращение времени удержания фактора на нуклеосоме само по себе не измеряет вероятность отворачивания ДНК.</p></article><article class="card"><h2>Положение, занятость и регулярность ряда</h2><p>Передвижение нуклеосомы и удаление нуклеосомы создают разные результаты на одной и той же ДНК.</p><p>Положение определяет, какие координаты ДНК покрыты частицей. Занятость показывает, в какой доле молекул или клеток участок несёт нуклеосому. Регулярность ряда характеризует распределение расстояний между соседними частицами. На усреднённом профиле эти признаки могут меняться независимо.</p><p>Около многих активных промоторов находится область, обеднённая нуклеосомами, — NDR. Её границы часто задают фазировку соседних частиц: положение первых нуклеосом ограничивает расположение последующих. Последовательность ДНК влияет на изгибаемость и предпочтительные положения, но in vivo результат определяется также транскрипционными факторами, ремоделирующими комплексами и транскрипцией.</p><p>Если частица сдвинулась с мотива, мотив стал доступнее без обязательной потери гистонов из данного района. Если частица удалена, изменяется и местная занятость. При обмене H2A–H2B на H2A.Z–H2B меняется состав частицы, хотя её центр может остаться прежним.</p><p>Промотор расположен около места начала транскрипции; энхансер способен усиливать её через взаимодействие с регуляторными белками и промотором. Инсулятор ограничивает определённые регуляторные взаимодействия. В дрожжевых реконструкциях Reb1 и Abf1 могут участвовать в создании границ для позиционирования частиц. NDR облегчает связывание участников инициации, но не заменяет их наличие и активность.</p></article><article class="card"><h2>От нуклеосом к контактам между локусами</h2><p>Локальная упаковка и пространственная организация генома связаны, но измеряются по-разному.</p><p>В ядре нуклеосомные цепи образуют нерегулярные структуры с различной плотностью, петли и более крупные области организации. H1, контакты гистоновых хвостов и связанные с хроматином белки влияют на уплотнение. Регулярная 30-нм фибрилла может образовываться в определённых условиях, но последовательность «10 → 30 → 300 нм» нельзя выдавать за обязательную лестницу упаковки во всех живых клетках.</p><p>Когезин способен увеличивать петлю, протягивая через себя хроматин; связывание CTCF может ограничивать её распространение. Ориентация сайтов CTCF имеет значение: многие устойчивые петли ограничены сходящимися сайтами. Контактные домены TAD — участки с повышенной частотой внутренних контактов в усреднённых данных. Они не являются непроницаемыми оболочками вокруг генов.</p><p>Hi-C измеряет частоты контактов между участками генома в популяции. Micro-C использует нуклеосомное расщепление и позволяет рассматривать контакты подробнее; ChIA-PET обогащает контакты, связанные с выбранным белком. Изменение карты контактов не позволяет без измерения РНК объявить все гены домена активированными или выключенными.</p><p>Эухроматин и гетерохроматин обозначают разные свойства хроматина, однако внутри них неоднородность сохраняется. Конститутивный гетерохроматин часто связан с H3K9-метилированием и HP1, факультативная репрессия может поддерживаться Polycomb. Компартменты A/B на контактной карте описывают предпочтительное взаимодействие областей со сходными свойствами; их нельзя считать двумя дискретными состояниями каждого гена. TAD и компартмент — разные признаки карты. Связь ряда участков с ядерной ламиной влияет на организацию, но модель универсального прикрепления всех TAD к единому «матриксу» не установлена.</p></article><article class="card"><h2>Как начинается перестройка хроматина</h2><p>Некоторые транскрипционные факторы распознают мотивы в нуклеосомной ДНК и помогают привлечь регуляторные комплексы.</p><p>Пионерные факторы могут связываться с частью нуклеосомных участков до их выраженного открытия. Это свойство зависит от фактора, мотива, его ориентации и положения на частице; оно не означает одинакового доступа ко всем закрытым участкам. Последующее привлечение ремоделирующих комплексов и модификаторов может стабилизировать доступное состояние.</p><p>При дифференцировке и перепрограммировании меняются сочетания факторов и свойства локусов. Причинную цепь проверяют по времени: связывание фактора → привлечение комплекса → изменение положения или состава нуклеосом → изменение регуляторных контактов и транскрипции. Порядок может отличаться между локусами, а часть событий может быть параллельной.</p><p>Гистоновые шапероны связывают гистоны, ограничивают их неспецифическое взаимодействие с ДНК и участвуют в сборке и разборке частиц. NAP1 взаимодействует прежде всего с H2A–H2B; ASF1 — с H3–H4. CAF-1 участвует в репликационно сопряжённой сборке, HIRA — во встраивании H3.3 вне этого пути. Шаперон не следует отождествлять с АТФ-зависимым мотором, передвигающим нуклеосому.</p><p>FOXA, отдельные GATA-факторы и PU.1 служат примерами факторов с пионерными свойствами в определённых системах. При создании индуцированных плюрипотентных клеток (iPSC) перестройка хроматина входит в процесс перепрограммирования. Прохождение РНК-полимеразы может нарушать контакты нуклеосом; ремоделеры и шапероны участвуют в последующем восстановлении. Поэтому транскрипция сама способна менять хроматин, но положительная обратная связь не обязательна для каждого локуса.</p></article><article class="card"><h2>Что именно измеряет опыт</h2><p>Выбор метода начинается с величины, которую нужно определить.</p><p>MNase расщепляет доступную ДНК, оставляя защищённые фрагменты; их распределение помогает оценивать положение частиц. Результат зависит от степени расщепления, предпочтений фермента и защиты другими белками. ATAC-seq использует транспозазу Tn5 для включения адаптеров в доступную ДНК. DNase-seq выявляет участки, чувствительные к DNase I. Эти методы имеют ферментативные предпочтения и обычно дают относительные профили.</p><p>qDA-seq измеряет долю молекул ДНК, разрезанных рестриктазой в определённых сайтах при изменении концентрации фермента; в исходной работе использовали AluI. Метод оценивает доступную долю и начальную скорость расщепления в условиях опыта. Это не универсальное физическое разделение всего генома на «открытый» и «закрытый». Учитываются наличие сайта, фермент и различия между ядрами и живыми клетками.</p><p>Для причины нужен опыт с вмешательством: изменение фактора или локуса, ранние временные точки, контроль жизнеспособности и клеточного цикла, проверка прямой мишени и, по возможности, восстановление функции. CRISPR-удаление гена, его быстрое выключение и адресное привлечение комплекса к локусу отвечают на разные вопросы.</p></article><article class="card"><h2>АТФ-зависимый мотор: движение ДНК</h2><p>Ремоделирующие комплексы используют энергию гидролиза АТФ для изменения контактов ДНК с гистонами.</p><p>Каталитическая субъединица семейства Snf2 содержит АТФазный мотор, который контактирует с ДНК на нуклеосоме. Циклы связывания и гидролиза АТФ сопровождаются транслокацией ДНК относительно поверхности гистонов. Этот механизм не равнозначен работе репликативной хеликазы, разделяющей две цепи ДНК.</p><p>Локальные изменения скручивания и числа пар оснований между контактами могут распространяться вдоль частицы. Такие twist-дефекты, а также образование локальных петель или выпячиваний рассматривались как механизмы передачи деформации. Детали зависят от комплекса и экспериментальных условий: один универсальный размер шага для всех ремоделеров не установлен.</p><p>Нужно различать элементарное движение мотора, несколько согласованных шагов и итоговый сдвиг всей частицы. В опыте FRET сигнал меняется с расстоянием между метками; его перевод в пары оснований требует геометрии и калибровки. Сам по себе скачок FRET не доказывает конкретный размер АТФ-зависимого шага.</p></article><article class="card"><h2>Четыре семейства и разные результаты</h2><p>Общий принцип использования АТФ не означает одинаковую функцию всех комплексов.</p><p>SWI/SNF, включая человеческие комплексы BAF, способен изменять положение частиц и способствовать их удалению в подходящих условиях. ISWI, например SNF2h-содержащие комплексы, часто регулирует расстояния между частицами и упорядочивает ряд. Комплексы CHD разнообразны: CHD1 связан со сборкой и организацией транскрибируемого хроматина; CHD3/4/5 могут входить в NuRD.</p><p>Семейство INO80 включает комплексы INO80 и родственные системы обмена гистонов, включая дрожжевой SWR1 и человеческий SRCAP. SWR1 осуществляет АТФ-зависимый обмен H2A–H2B на H2A.Z–H2B. Принадлежность к одному семейству не означает, что каждый его комплекс выполняет один и тот же обмен или действует в одном направлении.</p><p>Сдвиг, удаление и обмен различают по сочетанию измерений: координаты частиц, общее содержание гистонов, содержание варианта и доступность ДНК. Один комплекс способен давать разные результаты на разных субстратах. Важны состав комплекса, линкерная ДНК, гистоновые хвосты и связанные с локусом белки.</p><p>ISWI-содержащие комплексы включают ACF, CHRAC, NURF и RSF; их состав и свойства различаются между организмами. SNF2h соответствует человеческому белку SMARCA5. Семейство CHD у человека включает CHD1–CHD9, но не все они входят в NuRD: АТФазой NuRD бывает CHD3, CHD4 или CHD5. В SWI/SNF встречаются структурные субъединицы SMARCC1/BAF155 и SMARCC2/BAF170; PBRM1/BAF180 — специфическая субъединица PBAF, в cBAF её нет.</p><p>У человека NURF связан преимущественно с мотором SNF2L/SMARCA1, тогда как SNF2h/SMARCA5 входит в другие ISWI-системы. Перечень ISWI-комплексов не означает, что все они содержат SNF2h.</p></article><article class="card"><h2>Как комплекс оказывается в нужном локусе</h2><p>Действие ремоделера определяется не только мотором, но и его привлечением, составом и состоянием субстрата.</p><p>Транскрипционные факторы могут взаимодействовать с субъединицами ремоделирующих комплексов. Домены распознавания гистоновых модификаций создают дополнительные контакты; некодирующие РНК в некоторых системах помогают организовать белковые взаимодействия. Ни один из этих путей нельзя объявить универсальным для всех локусов.</p><p>Модификация гистона может изменить контакты с ремоделером, а ремоделер — доступность участка для фермента модификации. Такая связь объясняет совместное действие механизмов без необходимости постулировать однозначную таблицу «метка → включение гена».</p><p>NuRD объединяет CHD-зависимое ремоделирование с HDAC1/2-зависимым деацетилированием. Эти активности различны и могут быть разделены вмешательством. Если исчезла каталитическая активность CHD4, из этого не следует мгновенное исчезновение всех ацетильных групп; если ингибирована HDAC, мотор не обязательно выключен.</p><p>Сами субъединицы ремоделеров также могут фосфорилироваться, убиквитинироваться и SUMOилироваться, что в конкретных системах меняет сборку, локализацию или активность. Доступность АТФ и продуктов реакции влияет на работу мотора; одну общую кривую зависимости всех комплексов от АТФ/АДФ задать нельзя. HSA-участки ряда ремоделеров взаимодействуют с актином и актиноподобными белками, тогда как бромодомены и другие модули участвуют в распознавании хроматина.</p></article><article class="card"><h2>BAF: состав одного комплекса и состав популяции</h2><p>Альтернативные субъединицы нельзя изображать как обязательных соседей в одном комплексе.</p><p>У млекопитающих различают cBAF, PBAF и ncBAF с общими и характерными субъединицами. Мотором может служить SMARCA4 (BRG1) или SMARCA2 (BRM). В cBAF ARID1A и ARID1B представляют альтернативные субъединицы; PBAF содержит ARID2. В ncBAF характерны BRD9 и BICRA/BICRAL. Это упрощённая карта нескольких различий, а не полный состав.</p><p>В одной клетке могут существовать разные комплексы. Поэтому выражение «содержание ARID1A и ARID1B в клетке» не означает, что обе молекулы одновременно входят в одну частицу cBAF. Смена состава при развитии или нарушении функции одного гена меняет распределение комплексов и их мишени.</p><p>После потери SMARCA4 часть функций может поддерживаться SMARCA2-содержащими комплексами, но компенсация зависит от клеточного контекста. Для проверки нужны измерения оставшегося белка, состава комплексов, их связывания с хроматином и функционального результата. Длительный нокаут также допускает вторичную адаптацию.</p></article><article class="card"><h2>Почему нарушение ремоделирования вызывает болезнь</h2><p>Изменение регуляторных программ имеет разные последствия в развивающейся ткани и опухоли.</p><p>В опухолях встречаются нарушения генов ARID1A, SMARCB1, SMARCA4 и других компонентов SWI/SNF. Они способны менять доступность регуляторных участков, дифференцировку и зависимость от оставшихся комплексов. Нельзя считать все мутации функционально равными: значение имеют тип варианта, остаточная активность, ткань и сопутствующие изменения.</p><p>Гетерозиготные патогенные изменения ARID1B и ряда других SWI/SNF-генов связаны с синдромом Коффина—Сириса. Для синдрома Николаидеса—Барайцера характерны определённые изменения SMARCA2. CHARGE связан с CHD7. Эти примеры показывают значение регуляции хроматина для развития; конкретный синдром нельзя выводить только из названия семейства ремоделеров.</p><p>Синтетическая уязвимость означает, что нарушение одного пути усиливает зависимость от другого. В некоторых SMARCA4-дефицитных опухолевых моделях показана зависимость от SMARCA2. Это экспериментальный контекст, который следует проверять по генотипу, функции белков и ответу модели; он не является универсальной рекомендацией лечения.</p><p>Биаллельная потеря SMARCB1 характерна для большинства злокачественных рабдоидных опухолей, включая атипичную тератоидно-рабдоидную опухоль ЦНС; изменения ARID1A встречаются в некоторых опухолях яичника и эндометрия, SMARCA4 — в части опухолей лёгкого и других тканей. Частоту находок всегда относят к конкретному набору опухолей и критерию изменения. В ARID1A-дефицитных моделях исследовали зависимость от EZH2; она не устанавливается только по наличию любой мутации ARID1A. Ремоделирующие комплексы важны также для репликации и репарации: они меняют доступ и белковые контакты в этих процессах.</p></article><article class="card"><h2>Как измерить работу ремоделера</h2><p>Связывание комплекса, расход АТФ и перестройка нуклеосомы — три разных наблюдения.</p><p>В реконструированной системе можно изменять концентрацию фермента, АТФ и состав нуклеосомы. Нативный гель позволяет различать некоторые положения частицы или продукты обмена, но движение полосы зависит от её состава и формы. FRET измеряет изменение расстояния между метками и позволяет наблюдать переходы во времени. Криоэлектронная микроскопия показывает структурные состояния; отдельная структура не задаёт все скорости переходов.</p><p>Ниже воспроизводится зависимость скорости ремоделирования человеческим SNF2h от его концентрации из работы Gamarra и соавторов: kmax около 2,5 мин⁻¹, Kₘ,app около 61 нМ, коэффициент Хилла около 1,5 в указанных условиях. Эта зависимость не является скоростью всех ISWI-комплексов. Расчёт показан только при избытке фермента над 20 нМ нуклеосомного субстрата и фиксированных условиях опыта.</p><p>В клетках быстрые вмешательства, временные ряды ATAC/MNase, измерение новой РНК и восстановление функции позволяют уточнять причинный порядок. CRISPR-скрининг выявляет зависимости, но первичный результат требует проверки отдельными воздействиями. Изменение экспрессии гена может быть вторичным следствием изменения клеточного состояния.</p><p>Оптические и магнитные пинцеты позволяют прикладывать усилие к отдельным молекулам и наблюдать изменения их длины или сопротивления. Вывод о шагах мотора требует калибровки и учёта того, как сила влияет на субстрат. Репортёрный опыт помогает проверять функцию регуляторного элемента, но искусственная конструкция может отличаться по хроматиновому окружению от исходного локуса.</p></article><article class="card"><h2>Ацетилирование и метилирование: разная химия</h2><p>Одинаковый аминокислотный остаток может нести разные модификации, но их физические последствия неодинаковы.</p><p>Обозначение H3K27ac означает ацетилирование лизина (K) в позиции 27 гистона H3. H3K9me2 означает две метильные группы на лизине 9; me1, me2 и me3 различают степени метилирования. Номер относится к аминокислотной последовательности зрелого белка (без начального метионина), а не к координате ДНК.</p><p>Ацетилирование ε-аминогруппы лизина нейтрализует её положительный заряд при физиологическом pH. Это может изменять контакты гистонов с ДНК и между частицами, а также создавать участок распознавания для бромодоменов. Изменение одной группы не означает автоматического распада всего октамера.</p><p>Метилирование лизина обычно сохраняет положительный заряд и прежде всего меняет поверхность распознавания белками. Функция зависит от остатка, степени метилирования, сочетания соседних модификаций и белков, которые способны связаться. Ацетилирование и метилирование одного и того же лизина являются альтернативными состояниями этого остатка в одной молекуле; в популяции они могут наблюдаться одновременно на разных молекулах.</p></article><article class="card"><h2>Установка, удаление и обновление модификаций</h2><p>Содержание модификации определяется скоростями нескольких процессов, а не только наличием одного фермента.</p><p>Ацетилтрансферазы, включая p300 и CBP, используют ацетил-КоА; деацетилазы удаляют ацетильные группы. HDAC разных классов устроены неодинаково: сиртуины используют NAD⁺. Метилтрансферазы используют S-аденозилметионин (SAM). Лизиновые деметилазы также различаются: JmjC-ферменты зависят от α-кетоглутарата, Fe²⁺ и кислорода, тогда как LSD1 использует FAD и действует на определённые моно- и диметилированные субстраты.</p><p>Доля модифицированных гистонов может уменьшаться вследствие ферментативного удаления, обмена гистонов и разбавления при репликации. После выключения фермента установки уже существующие группы не исчезают мгновенно. Скорость изменения зависит от оставшихся путей, доступности субстрата и времени наблюдения.</p><p>В учебной модели ниже доля M изменяется по уравнению dM/dt = w(1 − M) − eM. w и e — условные константы скоростей установки и удаления, выраженные в мин⁻¹; начальная доля задана явно. Модель не включает репликацию, обмен гистонов и взаимодействие разных меток. Она помогает понять баланс реакций и не предсказывает кинетику конкретного препарата.</p><p>Среди ацетилтрансфераз есть GCN5/PCAF и белки семейства MYST, например MOF и Tip60. MOF связан с H4K16ac, который может изменять межнуклеосомные контакты. Метилтрансферазы SUV39H1/2 участвуют в установке H3K9me3, SETDB1 — в H3K9-метилировании, EZH2/EZH1 в PRC2 — в H3K27-метилировании, комплексы SET1/KMT2 — в H3K4-метилировании, DOT1L — в H3K79-метилировании, SETD2 — в установке H3K36me3. Их субстраты и степени метилирования различаются; наличие метки не доказывает, какой единственный фермент создал её в данной клетке.</p></article><article class="card"><h2>Кто распознаёт модификацию</h2><p>Один химический тип может иметь разные функции, потому что белки различают конкретные молекулярные поверхности.</p><p>H3K4me3 часто обогащён у активных промоторов; его могут распознавать определённые PHD-домены, например в BPTF. H3K9me2/3 связан с рядом репрессированных областей; хромодомен HP1 распознаёт метилированный H3K9. H3K27me3 устанавливается PRC2 и связан с Polycomb-регуляцией; его распознают, среди прочих участников, хромодомены CBX в каноническом PRC1. Это разные цепи взаимодействий, несмотря на общий тип «метилирование».</p><p>Бромодомены связывают ацетилированные лизины; хромодомены, PHD- и Tudor-домены обладают разной специфичностью. Название класса домена не задаёт единственную мишень для всех его представителей. Связывание зависит от соседних остатков, сочетания модификаций, ДНК и других белковых контактов.</p><p>Гипотеза гистонового кода подчёркивает роль сочетаний модификаций и их распознавания. Её полезно понимать как контекстные взаимодействия, а не как универсальный словарь. BRD4 может связываться с хроматином через несколько контактов; H3K27ac не задаёт его занятость одной универсальной кривой. Ингибирование бромодоменов может нарушить часть контактов, не удалив саму ацетильную группу.</p><p>H3K36me3 часто связан с транскрибируемыми телами генов и участвует также в обработке транскриптов и поддержании целостности генома; H4K20me3 встречается в ряде гетерохроматиновых контекстов. Ни одну из этих меток нельзя свести к единственному значению «активация» или «репрессия». WD40-белок WDR5 служит важным участником комплексов H3K4-метилирования и белковых контактов, но его нельзя представлять как универсальный прямой распознаватель H3K4me3. Некоторые 14-3-3-белки взаимодействуют с фосфорилированными остатками; Tudor-домены также имеют собственную специфичность.</p></article><article class="card"><h2>Фосфорилирование, убиквитинирование и SUMO</h2><p>Функциональный результат зависит от конкретного остатка и процесса, в котором появилась модификация.</p><p>Фосфорилирование серина, треонина или тирозина меняет заряд и белковые взаимодействия. H3S10ph участвует в разных контекстах, включая митоз и сигнальную регуляцию транскрипции. Поэтому его обнаружение нельзя автоматически трактовать только как активацию гена.</p><p>При ответе на двунитевой разрыв уже присутствующий H2A.X может фосфорилироваться по Ser139, образуя γH2AX. MDC1 распознаёт этот сигнал и участвует в организации ответа. γH2AX распространяется по хроматину вокруг повреждения: фокус не задаёт точную нуклеотидную координату каждого разрыва, а сигнал может встречаться и в других стрессовых условиях.</p><p>Убиквитинирование присоединяет небольшой белок убиквитин. H2AK119ub связан с Polycomb-регуляцией; H2BK120ub у человека участвует в регуляции транскрипции и взаимодействует с путями метилирования. Другие сайты убиквитинирования действуют в ответе на повреждение. SUMOилирование также создаёт поверхности для белковых контактов и в ряде контекстов связано с репрессией. Кротонилирование и другие ацильные модификации расширяют набор состояний, но их нельзя сводить к одной шкале «открыто — закрыто».</p><p>В пути H3S10ph участвуют, в зависимости от процесса, Aurora B или MSK1/2; фосфатазы, включая PP1, могут удалять фосфат. ATM, ATR и DNA-PK участвуют в фосфорилировании H2A.X в разных условиях ответа на повреждение. PRC1 содержит активность установки H2AK119ub, а RNF20/RNF40 устанавливают H2BK120ub. Деубиквитиназы, в том числе определённые USP-белки, удаляют убиквитин. Гистоны могут подвергаться также ADP-рибозилированию, лактилированию, сукцинилированию и цитруллинированию; их функция требует уточнения остатка и контекста, а не общего ярлыка «новая активирующая метка».</p></article><article class="card"><h2>Дифференцировка, память и метаболизм</h2><p>Свойства хроматина связывают сигнальные и метаболические процессы с изменением экспрессии генов.</p><p>При дифференцировке доступные регуляторные участки, ремоделирующие комплексы и модификации поддерживают разные программы экспрессии. Это состояние может воспроизводиться через сочетание факторов, обратных связей и восстановления модификаций после репликации. Ни одна метка сама по себе не объясняет всю клеточную идентичность.</p><p>В нейронах изменение экспрессии отдельных генов участвует в пластичности и долговременном закреплении памяти. В животных моделях вмешательства в CBP-зависимое ацетилирование и пути метилирования меняют определённые формы пластичности и обучения. EHMT1/2 устанавливают H3K9me1/2; KMT2A участвует в H3K4-метилировании. Их роль нельзя описать как простое подавление или усиление всех нейронных генов. Гистоновая модификация не является самостоятельным универсальным хранилищем воспоминания.</p><p>Доступность ацетил-КоА и SAM — доноров ацетильной и метильной групп — может влиять на скорость соответствующих реакций. NAD⁺ нужен сиртуинам; α-кетоглутарат, кислород и Fe²⁺ — JmjC-деметилазам. Метаболиты, включая 2-гидроксиглутарат, могут вмешиваться в некоторые ферментативные пути. Однако изменение концентрации метаболита не определяет единственный результат для всех локусов: важны фермент, его привлечение и клеточный контекст.</p><p>Сигнальные пути, включая AMPK, mTOR и стрессовые киназы, могут влиять на метаболизм, ферменты и состав комплексов. Гипоксия способна ограничивать кислород-зависимые реакции и менять экспрессию их участников; воспаление изменяет сигналы и регуляторные программы. Направление эффекта на выбранную метку нужно измерять. Метилирование ДНК является отдельным механизмом: DNMT3A/3B участвуют в установке метилирования, а DNMT1 — в его поддержании после репликации. Оно может влиять на связывание факторов и белков, распознающих метилированную ДНК, но метилированная ДНК и метилированный гистон — разные субстраты.</p></article><article class="card"><h2>Как проверить роль модификации</h2><p>Изменение метки, связывания белка и образования РНК нужно измерять раздельно.</p><p>Масс-спектрометрия позволяет определить модификации и их доли в исследованном пуле гистонов, но обычно не сообщает геномный адрес каждой молекулы. ChIP-seq, CUT&amp;RUN и родственные подходы определяют обогащение выбранного эпитопа по геному; результат зависит от специфичности антител, доступности эпитопа и нормализации. При глобальном изменении меток полезны внешние стандарты и контроль общего H3.</p><p>Для причинной проверки изменяют фермент установки, фермент удаления или распознающий белок и проверяют прямую мишень. Ингибитор BET-бромодоменов, например JQ1, не является прямой деацетилазой. Ингибиторы HDAC, метилтрансфераз или деметилаз имеют собственную селективность; GSK-J4 нельзя считать абсолютно специфическим выключателем одного фермента. Снижение РНК после препарата может включать вторичные эффекты.</p><p>Временной ряд помогает установить последовательность: прямой эффект на мишень → изменение метки или связывания → изменение новой РНК → изменение общего содержания РНК. Содержание зрелой РНК зависит и от образования, и от распада. Генетическое вмешательство, независимый реагент, восстановление функции и контроль жизнеспособности усиливают вывод о механизме.</p><p>В качестве механистических примеров используют вориностат/SAHA (HDAC классов I и II) и ромидепсин (преимущественно HDAC класса I) для ингибирования деацетилаз, таземетостат/EPZ-6438 для EZH2, JQ1 для BET-бромодоменов и GSK-J4 для деметилазных путей с ограниченной селективностью. Азацитидин и децитабин — аналоги цитидина: встроившись в ДНК, они ковалентно захватывают DNMT, и метилирование ДНК теряется при следующих репликациях; азацитидин встраивается в основном в РНК. Выбор вмешательства требует проверки его прямого действия. Молекулярная мишень не определяет клиническую эффективность и безопасность: в марте 2026 г. производитель отозвал таземетостат (Tazverik) со всех рынков из-за повышенной частоты вторых злокачественных опухолей в подтверждающем испытании SYMPHONY-1, а 22 июня 2026 г. FDA отменило одобрение препарата. Здесь он остаётся только примером ингибитора EZH2.</p><p>FRAP измеряет восстановление флуоресценции после выцветания: оно зависит от движения и обмена наблюдаемого белка и не является прямым счётчиком удалённых химических групп.</p></article><article class="card"><h2>Вариант гистона — изменение белка</h2><p>Смена аминокислотной последовательности и добавление химической группы представляют разные механизмы.</p><p>Варианты гистонов кодируются разными генами и отличаются последовательностью, структурой или путями включения в хроматин. Это понятие следует отличать от аллельного варианта одного гена и от посттрансляционной модификации белка. H3.1, H3.3 и CENP-A — разные белковые варианты; H3K27ac — состояние определённого остатка.</p><p>Канонические H3.1/H3.2 преимущественно включаются при репликационно сопряжённой сборке с участием CAF-1. H3.3 может включаться вне этого пути: HIRA нужен для включения H3.3 во многих активных и репрессированных генах, а в теломерах и ряде повторных областей H3.3 включается без HIRA, при участии ATRX–DAXX. CENP-A доставляется через специализированный путь с HJURP.</p><p>Наличие варианта зависит не только от синтеза белка, но и от шаперона, мишени, стадии клеточного цикла и обмена гистонов. Изменение варианта может менять контакты внутри частицы, взаимодействия с ДНК и распознающими белками. Оно не задаёт единственную функцию независимо от локуса.</p><p>DEK и другие белки могут участвовать в обращении с гистонами и изменении их распределения в определённых системах. Название дополнительного шаперона не заменяет проверку специфичности к варианту и геномному контексту.</p></article><article class="card"><h2>H3.3: один вариант, разные маршруты</h2><p>Наличие H3.3 не означает, что участок обязательно транскрипционно активен.</p><p>В промоторах и телах ряда генов H3.3 включается через HIRA-зависимый путь. В ряде теломерных и повторных областей важны ATRX и DAXX. Поэтому один вариант встречается в функционально разных областях, а выключение одного шаперона не должно изображаться как одинаковое прекращение сборки H3.3 по всему геному.</p><p>После короткого импульса метки вновь синтезированный H3.3 можно отличить от старого пула. Возрастание меченого сигнала в локусе характеризует включение нового белка в данных условиях. Его дальнейшее уменьшение может включать обмен, репликационное разбавление и изменение пула клеток. Обычный ChIP по H3.3 показывает вариант, но не возраст молекул.</p><p>Для проверки маршрута сравнивают контроль и селективное нарушение HIRA либо ATRX–DAXX с самого начала заданного интервала. Если вмешательство выполнено позже, нужно учитывать историю до него. Также измеряют общий H3, клеточный цикл и количество доступного меченого белка: слабый сигнал может возникнуть из-за нарушения доставки, сниженного синтеза нового белка, неполного мечения или изменения числа клеток.</p></article><article class="card"><h2>CENP-A и воспроизведение центромеры</h2><p>Сохранение старого пула и сборка нового пула — разные процессы.</p><p>CENP-A замещает H3 в специализированных центромерных нуклеосомах и участвует в формировании платформы для кинетохора. Для нового CENP-A важен шаперон HJURP. В типичном изученном человеческом цикле основная сборка нового центромерного CENP-A происходит после митоза, в ранней G1; время сборки не следует переносить без проверки на все организмы.</p><p>Во время S-фазы родительский CENP-A распределяется между сестринскими хроматидами. В идеализированной модели равного распределения, без потери старого белка, исходно меченый пул на одной центромере уменьшается в среднем как 2⁻ⁿ после n репликаций. После митоза новая сборка может восстановить общий пул, не возвращая исходную метку старым молекулам.</p><p>Полное нарушение HJURP не равнозначно изолированной блокаде сборки в G1: HJURP участвует также в сохранении родительского CENP-A при репликации. Переключатель ниже означает именно селективную блокаду новой сборки при сохранённом старом пуле. Начальные 100 единиц — нормировка учебной модели, а не универсальное число молекул в человеческой центромере.</p><p>Центромерные белки CENP-C и CENP-N участвуют в распознавании CENP-A-содержащего хроматина и сборке комплекса, связывающего его с кинетохором. CENP-B связывает определённые ДНК-последовательности (CENP-B box), поэтому его нельзя относить вместе с CENP-C/N к белкам, распознающим гистоновый вариант.</p></article><article class="card"><h2>H2A.Z, H2A.X и macroH2A</h2><p>Семейство H2A включает варианты с разными структурами и функциональными контекстами.</p><p>H2A.Z часто встречается у регуляторных областей. Дрожжевой SWR1 и человеческие SRCAP/p400-связанные системы участвуют в его АТФ-зависимом включении через обмен димеров. Свойства H2A.Z-содержащей частицы зависят от других гистонов, модификаций и условий измерения: H2A.Z нельзя объявлять универсально нестабильным вариантом или обязательным активатором транскрипции.</p><p>H2A.X имеет участок, который фосфорилируется в ответе на повреждение, создавая γH2AX. H2A.X присутствует в хроматине до разрыва; повреждение не требует его сборки заново во всех окружающих частицах. macroH2A содержит большой дополнительный макродомен, обогащён в ряде репрессированных областей, включая неактивную X-хромосому, и может ограничивать перепрограммирование. Его присутствие само по себе не объясняет все этапы инактивации X.</p><p>Изменение варианта и модификации взаимосвязано: например, H2A.Z может быть ацетилирован, а H2A.X — фосфорилирован. Разные варианты H2B и H1 также имеют специализированные распределения и свойства. Для функционального вывода нужно назвать конкретный вариант, место, стадию и взаимодействующие белки.</p><p>H2A.B, ранее называвшийся H2A.Bbd, имеет изменённую структуру и встречается, среди прочих контекстов, в мужских половых клетках; его нельзя объявлять исключительным признаком сперматогенеза. Варианты H1.0 и H1X отличаются распределением и регуляцией. INO80 может участвовать в удалении H2A.Z в определённых системах, тогда как SWR1 способствует включению; эту противоположность нельзя переносить на все активности обоих комплексов. Ацетилированный и убиквитинированный H2A.Z встречаются в разных регуляторных контекстах.</p></article><article class="card"><h2>Возраст белка, вариант и модификация</h2><p>Эпигенетическое воспроизведение состояния не означает, что каждая старая частица сохраняется целиком.</p><p>При репликации родительские H3–H4 в основном возвращаются на обе дочерние ДНК, а новые гистоны восполняют вторую половину пула. Это не следует изображать как неизменные старые октамеры, которые всегда переносятся вместе со всеми своими метками. Димеры, тетрамеры и отдельные контакты имеют разные пути перестройки.</p><p>Часть родительских модификаций сохраняется, но другие изменяются; новый пул приобретает модификации с различной скоростью. Сам вариант может оставаться тем же, хотя возраст и состояние остатка изменились. Для H3K9me3 и H3K27me3 восстановление общего уровня после репликации может продолжаться дольше непосредственной сборки гистонов.</p><p>SILAC различает белковые пулы по изотопной метке, SNAP-подходы — по времени мечения белка, а ChIP и CUT&amp;RUN добавляют информацию о выбранном эпитопе и его локализации. Чтобы проверить наследование, нужно сопоставить старые и новые молекулы, их модификации, фазу цикла и функцию локуса. Связь через распознающие белки и ферменты установки может восстанавливать сходное состояние без точного копирования каждой молекулы.</p></article><article class="card"><h2>Онкогистоны, старение и клеточное состояние</h2><p>Патогенное изменение гистона может действовать шире той части молекул, в которой оно присутствует.</p><p>Замена K27M в H3 может нарушать PRC2-зависимую регуляцию и снижать общее содержание H3K27me3 с неоднородными локальными последствиями. Изменения G34R/V влияют на взаимодействия и модификации вблизи H3K36; их механизм не следует считать тождественным K27M. Эти изменения встречаются в определённых опухолевых контекстах и не означают одинакового фенотипа в любой ткани и при любом уровне экспрессии.</p><p>Нарушения ATRX/DAXX могут менять включение H3.3 в повторные и теломерные области. В определённых опухолях они связаны с альтернативным удлинением теломер (ALT), однако одной мутации недостаточно, чтобы объявить ALT доказанным. Нужно исследовать теломерные признаки и функцию системы.</p><p>При старении и клеточном старении меняются содержание гистонов, локальные модификации и организация хроматина. Клеточное старение — особое состояние с устойчивой остановкой пролиферации, а старение организма включает многие процессы и разные клетки. Единой обязательной последовательности изменений всех меток нет. Эпигенетическая терапия предполагает воздействие на конкретный фермент или взаимодействие; из изменения метки не следует доказанное омоложение.</p><p>Обогащение CENP-A вне центромер или изменение содержания H2A.Z может сопровождать опухолевые состояния, но ассоциация не устанавливает универсальный диагностический признак. Эпигенетические часы чаще основаны на паттернах метилирования ДНК; их нельзя считать прямым измерением возраста отдельных гистоновых вариантов. Изменения EZH2, CREBBP и KDM6A имеют различные последствия для модификаций; при опухолевом анализе важны тип изменения и остаточная функция.</p></article><article class="card"><h2>План исследования: величина, метод, ограничение</h2><p>Один локус нужно рассматривать через несколько независимых измерений.</p><p>Положение частиц исследуют нуклеазными картами, доступность — ATAC/DNase или подходящим количественным тестом, модификацию и вариант — эпитоп-специфическими методами, контакты — Hi-C/Micro-C/ChIA-PET. Криоэлектронная микроскопия отвечает на структурные вопросы, FRET и одномолекулярное наблюдение — на вопросы расстояний и динамики. Эти измерения дополняют друг друга, но не заменяют.</p><p>Для динамики белкового пула полезны импульсные метки и наблюдение живых клеток; для транскрипции — методы измерения новой РНК. Обычное RNA-seq определяет содержание РНК и само по себе не отделяет синтез от распада. Усреднение по клеткам может скрыть, что высокий сигнал возникает в небольшой части популяции.</p><p>Сильный план проверяет альтернативы. Например, после снижения H3K27ac сравнивают прямой эффект на фермент, общий H3, связывание распознающего белка, доступность и новую РНК; добавляют контроль растворителя, независимое вмешательство и восстановление функции. Адресное привлечение с помощью dCas9 проверяет эффект в локусе, но требует контроля каталитически неактивного конструкта и dCas9 без присоединённого регуляторного белка.</p></article><article class="card"><h2>Расследование одного локуса</h2><p>Сопоставьте воздействие, молекулярное событие, наблюдение и вывод.</p><p>В виртуальном опыте выбран один регуляторный локус, в котором связывание фактора способствует привлечению BAF и p300, а BET-зависимые контакты помогают поддерживать транскрипцию. Это заданная учебная система. Её результаты нельзя переносить на любой промотор: доступность, ацетилирование, варианты гистонов и контакты действуют совместно, но не имеют одного универсального порядка.</p><p>Выберите воздействие и сначала предскажите, какой процесс нарушен непосредственно. Затем откройте качественные профили. Они заданы как условия задачи, а не получены из экспериментальной базы и не являются количественным прогнозом. Сопоставьте общий H3, доступность, H3K27ac, BET-белок, новый H3.3, контакты и новую РНК.</p><p>Заключение должно называть прямой механизм, согласующиеся наблюдения и хотя бы одну альтернативу. Для причины выберите контроль: восстановление функции, каталитически неактивный вариант, независимое вмешательство, контроль клеточного цикла или жизнеспособности. Даже полная схема должна оставлять место неопределённости: совместные изменения ещё не устанавливают их порядок.</p></article></noscript>
<script>const CONTENT = {"lessons":[{"id":"core","section":0,"title":"Из чего состоит нуклеосома","lead":"Нуклеосома сочетает компактную упаковку ДНК с возможностью локально изменять её доступность.","paragraphs":["В канонической нуклеосомной частице около 147 пар оснований ДНК образуют примерно 1,65 витка левой суперспирали вокруг гистонового октамера. Октамер содержит по две молекулы H2A, H2B, H3 и H4: в его центре находится тетрамер (H3–H4)₂, к которому присоединены два димера H2A–H2B. Участки с укладкой histone fold обеспечивают и контакты между гистонами, и основную часть контактов с ДНК на поверхности октамера; выступающие хвосты дополнительно взаимодействуют с ДНК, соседними нуклеосомами и регуляторными белками.","Фосфатный остов ДНК несёт отрицательный заряд. Лизин и аргинин в гистонах обеспечивают положительно заряженные участки контакта, но связывание определяется также геометрией и другими взаимодействиями. Поэтому состав, модификации и положение ДНК на октамере могут менять свойства частицы.","Линкерная ДНК соединяет соседние частицы; её длина неодинакова. Линкерный гистон H1 связывается около входа и выхода ДНК и влияет на укладку хроматина. H1 не входит в октамер. Число 147 относится к канонической сердцевинной частице, а не ко всему повтору «нуклеосома + линкер».","Диаметр канонической частицы составляет около 11 нм. Упаковка позволяет разместить длинную ДНК в микрометровом ядре, но не делает её полностью недоступной. В ряде систем линкер содержит примерно 20–80 пар оснований; это пример диапазона, а не обязательная постоянная для каждой клетки."],"mechanism":["Два димера H3–H4 образуют центральный тетрамер.","Два димера H2A–H2B дополняют октамер.","ДНК оборачивается вокруг октамера; H1 связывается снаружи."],"trap":"Нельзя прибавлять H1 к восьми коровым гистонам или считать весь нуклеосомный повтор равным 147 парам оснований.","widget":"anatomy","quiz":{"question":"Из частицы удалён H1, но коровые гистоны сохранены. Что изменено непосредственно?","options":["Связывание линкерного гистона и организация входящей, выходящей и линкерной ДНК.","Состав октамера: в нём осталось семь гистонов.","Последовательность всех четырёх коровых гистонов."],"correct":0,"feedback":["Верно. Удаление H1 изменяет внешние контакты и укладку хроматина; величина эффекта зависит от условий.","H1 расположен вне октамера; две копии каждого корового гистона сохраняются.","Удаление белка не меняет аминокислотные последовательности других гистонов."]},"sources":["structure"],"program":["5.1","слайды 1–2"]},{"id":"breathing","section":0,"title":"Доступность — вероятность, а не переключатель","lead":"ДНК может временно отходить от поверхности октамера, даже если нуклеосома остаётся на месте.","paragraphs":["Тепловые флуктуации приводят к частичному отворачиванию ДНК, обычно начиная с её концов, и последующему восстановлению контактов. Этот процесс называют «дыханием» нуклеосомы. Участок возле края часто экспонируется легче, чем участок ближе к центру, однако вероятность зависит от последовательности, состава частицы, модификаций и условий среды.","Доступность участка и его занятость транскрипционным фактором — разные величины. Первая характеризует возможность контакта с ДНК; вторая зависит также от концентрации фактора, его сродства, способности связываться с нуклеосомой и времени наблюдения. Открытый промотор не гарантирует транскрипцию: нужны подходящие факторы и работа транскрипционного аппарата.","В учебной модели ниже есть две фиксированные группы молекул ДНК: участок свободен или закрыт нуклеосомой. Занятость рассчитывается отдельно для каждой группы, затем усредняется. Если за время связывания молекулы переходят из одной группы в другую (например, нуклеосома сдвигается или вытесняется), понадобится кинетическая модель. Эксперимент с Rap1 показывает отдельное важное ограничение: сокращение времени удержания фактора на нуклеосоме само по себе не измеряет вероятность отворачивания ДНК."],"mechanism":["ДНК частично отходит от октамера.","Фактор может связаться, если участок и геометрия контакта подходят.","Связывание и последующая транскрипция требуют дополнительных условий."],"trap":"Время удержания фактора нельзя автоматически превращать в долю открытой ДНК. Доступность также нельзя отождествлять с экспрессией.","widget":"binding","quiz":{"question":"ATAC-сигнал промотора вырос, но образование новой РНК не изменилось. Какой вывод допустим?","options":["Транскрипция обязательно выросла; измерение РНК неверно.","ДНК изменила последовательность.","Доступность для транспозазы выросла; этого недостаточно, чтобы заключить, что транскрипция усилилась."],"correct":2,"feedback":["Из доступности не следует обязательное усиление транскрипции.","ATAC-seq не измеряет изменение последовательности как причину эффекта.","Верно. Для объяснения нужны данные о регуляторных факторах и транскрипционном аппарате."]},"sources":["rap1","qda"],"program":["5.1","слайды 3, 16"]},{"id":"position","section":0,"title":"Положение, занятость и регулярность ряда","lead":"Передвижение нуклеосомы и удаление нуклеосомы создают разные результаты на одной и той же ДНК.","paragraphs":["Положение определяет, какие координаты ДНК покрыты частицей. Занятость показывает, в какой доле молекул или клеток участок несёт нуклеосому. Регулярность ряда характеризует распределение расстояний между соседними частицами. На усреднённом профиле эти признаки могут меняться независимо.","Около многих активных промоторов находится область, обеднённая нуклеосомами, — NDR. Её границы часто задают фазировку соседних частиц: положение первых нуклеосом ограничивает расположение последующих. Последовательность ДНК влияет на изгибаемость и предпочтительные положения, но in vivo результат определяется также транскрипционными факторами, ремоделирующими комплексами и транскрипцией.","Если частица сдвинулась с мотива, мотив стал доступнее без обязательной потери гистонов из данного района. Если частица удалена, изменяется и местная занятость. При обмене H2A–H2B на H2A.Z–H2B меняется состав частицы, хотя её центр может остаться прежним.","Промотор расположен около места начала транскрипции; энхансер способен усиливать её через взаимодействие с регуляторными белками и промотором. Инсулятор ограничивает определённые регуляторные взаимодействия. В дрожжевых реконструкциях Reb1 и Abf1 могут участвовать в создании границ для позиционирования частиц. NDR облегчает связывание участников инициации, но не заменяет их наличие и активность."],"mechanism":["Сдвиг изменяет координаты частицы.","Удаление уменьшает занятость участка нуклеосомами.","Обмен гистонов изменяет состав частицы."],"trap":"Одинаковое повышение доступности может возникнуть разными путями; один ATAC-профиль не различает их.","widget":"array","quiz":{"question":"После воздействия пик MNase-seq переместился, а интегральный сигнал общего H3 в районе сохранился. Какая гипотеза наиболее непосредственно согласуется с данными?","options":["H3 обязательно превратился в CENP-A.","Нуклеосома переместилась; для окончательного вывода нужно проверить альтернативы и нормализацию.","Все гистоны были удалены из района."],"correct":1,"feedback":["Эти измерения не определяют вариант гистона.","Верно. Изменение координаты без потери общего H3 согласуется со сдвигом, но не доказывает единственный механизм.","Полное удаление ожидаемо уменьшило бы локальное содержание H3."]},"sources":["assembly"],"program":["5.1","слайды 3–4"]},{"id":"architecture","section":0,"title":"От нуклеосом к контактам между локусами","lead":"Локальная упаковка и пространственная организация генома связаны, но измеряются по-разному.","paragraphs":["В ядре нуклеосомные цепи образуют нерегулярные структуры с различной плотностью, петли и более крупные области организации. H1, контакты гистоновых хвостов и связанные с хроматином белки влияют на уплотнение. Регулярная 30-нм фибрилла может образовываться в определённых условиях, но последовательность «10 → 30 → 300 нм» нельзя выдавать за обязательную лестницу упаковки во всех живых клетках.","Когезин способен увеличивать петлю, протягивая через себя хроматин; связывание CTCF может ограничивать её распространение. Ориентация сайтов CTCF имеет значение: многие устойчивые петли ограничены сходящимися сайтами. Контактные домены TAD — участки с повышенной частотой внутренних контактов в усреднённых данных. Они не являются непроницаемыми оболочками вокруг генов.","Hi-C измеряет частоты контактов между участками генома в популяции. Micro-C использует нуклеосомное расщепление и позволяет рассматривать контакты подробнее; ChIA-PET обогащает контакты, связанные с выбранным белком. Изменение карты контактов не позволяет без измерения РНК объявить все гены домена активированными или выключенными.","Эухроматин и гетерохроматин обозначают разные свойства хроматина, однако внутри них неоднородность сохраняется. Конститутивный гетерохроматин часто связан с H3K9-метилированием и HP1, факультативная репрессия может поддерживаться Polycomb. Компартменты A/B на контактной карте описывают предпочтительное взаимодействие областей со сходными свойствами; их нельзя считать двумя дискретными состояниями каждого гена. TAD и компартмент — разные признаки карты. Связь ряда участков с ядерной ламиной влияет на организацию, но модель универсального прикрепления всех TAD к единому «матриксу» не установлена."],"mechanism":["Нуклеосомная цепь складывается неоднородно.","Когезин и CTCF влияют на петли и границы контактных доменов.","Контактная карта усредняет множество конфигураций."],"trap":"Карта Hi-C не является фотографией одной клетки; усиление контакта не равно доказанной активации гена.","widget":"contacts","quiz":{"question":"Когезин быстро удалили, петли на Hi-C исчезли. Что следует проверить, прежде чем утверждать, что транскрипция всех генов уменьшилась?","options":["Ничего: исчезновение петель доказывает выключение всех генов.","Образование новой РНК и эффекты в отдельных локусах.","Только толщину 30-нм фибриллы."],"correct":1,"feedback":["Потеря петель не имеет одного обязательного результата для всех генов.","Верно. Архитектурный эффект и изменения транскрипции следует измерять отдельно.","Регулярная фибрилла не обязательна и не даёт нужного измерения транскрипции."]},"sources":["chromemt","cohesin"],"program":["5.1","слайд 4"]},{"id":"pioneer","section":0,"title":"Как начинается перестройка хроматина","lead":"Некоторые транскрипционные факторы распознают мотивы в нуклеосомной ДНК и помогают привлечь регуляторные комплексы.","paragraphs":["Пионерные факторы могут связываться с частью нуклеосомных участков до их выраженного открытия. Это свойство зависит от фактора, мотива, его ориентации и положения на частице; оно не означает одинакового доступа ко всем закрытым участкам. Последующее привлечение ремоделирующих комплексов и модификаторов может стабилизировать доступное состояние.","При дифференцировке и перепрограммировании меняются сочетания факторов и свойства локусов. Причинную цепь проверяют по времени: связывание фактора → привлечение комплекса → изменение положения или состава нуклеосом → изменение регуляторных контактов и транскрипции. Порядок может отличаться между локусами, а часть событий может быть параллельной.","Гистоновые шапероны связывают гистоны, ограничивают их неспецифическое взаимодействие с ДНК и участвуют в сборке и разборке частиц. NAP1 взаимодействует прежде всего с H2A–H2B; ASF1 — с H3–H4. CAF-1 участвует в репликационно сопряжённой сборке, HIRA — во встраивании H3.3 вне этого пути. Шаперон не следует отождествлять с АТФ-зависимым мотором, передвигающим нуклеосому.","FOXA, отдельные GATA-факторы и PU.1 служат примерами факторов с пионерными свойствами в определённых системах. При создании индуцированных плюрипотентных клеток (iPSC) перестройка хроматина входит в процесс перепрограммирования. Прохождение РНК-полимеразы может нарушать контакты нуклеосом; ремоделеры и шапероны участвуют в последующем восстановлении. Поэтому транскрипция сама способна менять хроматин, но положительная обратная связь не обязательна для каждого локуса."],"mechanism":["Фактор распознаёт подходящий мотив.","Белковые контакты способствуют привлечению комплексов.","Шапероны обеспечивают связывание и передачу гистонов при сборке и разборке частиц."],"trap":"Пионерность — способность в определённом контексте, а не гарантия открытия любого локуса.","widget":"rap1","quiz":{"question":"Фактор связался с нуклеосомной ДНК раньше, чем появился ATAC-пик. Какое объяснение допустимо?","options":["Фактор может обладать пионерными свойствами в данном положении мотива.","Нуклеосома обязательно отсутствовала до связывания.","Любой транскрипционный фактор одинаково связывает любую нуклеосому."],"correct":0,"feedback":["Верно. Для причинного вывода нужны вмешательство и проверка зависимости последующего открытия от фактора.","Само связывание не доказывает отсутствие нуклеосомы.","Распознавание зависит от фактора и геометрии мотива."]},"sources":["rap1","h33","foxa"],"program":["5.1","слайды 5–6"]},{"id":"access-methods","section":0,"title":"Что именно измеряет опыт","lead":"Выбор метода начинается с величины, которую нужно определить.","paragraphs":["MNase расщепляет доступную ДНК, оставляя защищённые фрагменты; их распределение помогает оценивать положение частиц. Результат зависит от степени расщепления, предпочтений фермента и защиты другими белками. ATAC-seq использует транспозазу Tn5 для включения адаптеров в доступную ДНК. DNase-seq выявляет участки, чувствительные к DNase I. Эти методы имеют ферментативные предпочтения и обычно дают относительные профили.","qDA-seq измеряет долю молекул ДНК, разрезанных рестриктазой в определённых сайтах при изменении концентрации фермента; в исходной работе использовали AluI. Метод оценивает доступную долю и начальную скорость расщепления в условиях опыта. Это не универсальное физическое разделение всего генома на «открытый» и «закрытый». Учитываются наличие сайта, фермент и различия между ядрами и живыми клетками.","Для причины нужен опыт с вмешательством: изменение фактора или локуса, ранние временные точки, контроль жизнеспособности и клеточного цикла, проверка прямой мишени и, по возможности, восстановление функции. CRISPR-удаление гена, его быстрое выключение и адресное привлечение комплекса к локусу отвечают на разные вопросы."],"mechanism":["Сформулируйте измеряемую величину.","Выберите метод и контроль его смещений.","Отделите корреляцию от эффекта вмешательства."],"trap":"ATAC-пик не измеряет количество РНК, ChIP-пик не доказывает причинность, а защищённый фрагмент не всегда защищён нуклеосомой.","widget":"profiles","quiz":{"question":"Нужно оценить абсолютную долю молекул, доступных AluI в выбранном сайте в изолированных ядрах. Какой подход наиболее прямо соответствует задаче?","options":["Только RNA-seq.","qDA-seq с серией концентраций фермента и подсчётом разрезанных и неразрезанных молекул.","Только изображение толщины хроматина."],"correct":1,"feedback":["RNA-seq измеряет РНК, а не эту доступную долю.","Верно. Вывод относится к данному сайту, ферменту и условиям ядерного опыта.","Морфология не измеряет долю разрезанных молекул в конкретном сайте."]},"sources":["qda","atac"],"program":["5.1","слайд 17"]},{"id":"motor","section":1,"title":"АТФ-зависимый мотор: движение ДНК","lead":"Ремоделирующие комплексы используют энергию гидролиза АТФ для изменения контактов ДНК с гистонами.","paragraphs":["Каталитическая субъединица семейства Snf2 содержит АТФазный мотор, который контактирует с ДНК на нуклеосоме. Циклы связывания и гидролиза АТФ сопровождаются транслокацией ДНК относительно поверхности гистонов. Этот механизм не равнозначен работе репликативной хеликазы, разделяющей две цепи ДНК.","Локальные изменения скручивания и числа пар оснований между контактами могут распространяться вдоль частицы. Такие twist-дефекты, а также образование локальных петель или выпячиваний рассматривались как механизмы передачи деформации. Детали зависят от комплекса и экспериментальных условий: один универсальный размер шага для всех ремоделеров не установлен.","Нужно различать элементарное движение мотора, несколько согласованных шагов и итоговый сдвиг всей частицы. В опыте FRET сигнал меняется с расстоянием между метками; его перевод в пары оснований требует геометрии и калибровки. Сам по себе скачок FRET не доказывает конкретный размер АТФ-зависимого шага."],"mechanism":["Мотор связывает ДНК на нуклеосоме.","Гидролиз АТФ сопряжён с её перемещением.","Перераспределение контактов меняет положение или состояние частицы."],"trap":"Snf2 — дрожжевой белок, мотор комплекса SWI/SNF; по нему названо семейство Snf2-АТФаз. Sth1 — его паралог, мотор дрожжевого RSC, а не универсальная человеческая субъединица.","widget":"motor","quiz":{"question":"После удаления АТФ ремоделирующий комплекс остаётся связанным с нуклеосомой. Что ещё нужно измерить?","options":["Сдвиг или обмен гистонов, чтобы отличить связывание от каталитической активности.","Ничего: связывание комплекса доказывает нормальную работу мотора.","Только нуклеотидную последовательность ДНК в месте связывания."],"correct":0,"feedback":["Верно. Комплекс может присутствовать на субстрате, не осуществляя АТФ-зависимое преобразование.","Связывание и каталитическое преобразование субстрата различаются.","Последовательность ДНК не показывает, сдвинул ли комплекс нуклеосому или заменил гистоны."]},"sources":["remodel-structure","snf2h"],"program":["5.2","слайды 7–8"]},{"id":"families","section":1,"title":"Четыре семейства и разные результаты","lead":"Общий принцип использования АТФ не означает одинаковую функцию всех комплексов.","paragraphs":["SWI/SNF, включая человеческие комплексы BAF, способен изменять положение частиц и способствовать их удалению в подходящих условиях. ISWI, например SNF2h-содержащие комплексы, часто регулирует расстояния между частицами и упорядочивает ряд. Комплексы CHD разнообразны: CHD1 связан со сборкой и организацией транскрибируемого хроматина; CHD3/4/5 могут входить в NuRD.","Семейство INO80 включает комплексы INO80 и родственные системы обмена гистонов, включая дрожжевой SWR1 и человеческий SRCAP. SWR1 осуществляет АТФ-зависимый обмен H2A–H2B на H2A.Z–H2B. Принадлежность к одному семейству не означает, что каждый его комплекс выполняет один и тот же обмен или действует в одном направлении.","Сдвиг, удаление и обмен различают по сочетанию измерений: координаты частиц, общее содержание гистонов, содержание варианта и доступность ДНК. Один комплекс способен давать разные результаты на разных субстратах. Важны состав комплекса, линкерная ДНК, гистоновые хвосты и связанные с локусом белки.","ISWI-содержащие комплексы включают ACF, CHRAC, NURF и RSF; их состав и свойства различаются между организмами. SNF2h соответствует человеческому белку SMARCA5. Семейство CHD у человека включает CHD1–CHD9, но не все они входят в NuRD: АТФазой NuRD бывает CHD3, CHD4 или CHD5. В SWI/SNF встречаются структурные субъединицы SMARCC1/BAF155 и SMARCC2/BAF170; PBRM1/BAF180 — специфическая субъединица PBAF, в cBAF её нет.","У человека NURF связан преимущественно с мотором SNF2L/SMARCA1, тогда как SNF2h/SMARCA5 входит в другие ISWI-системы. Перечень ISWI-комплексов не означает, что все они содержат SNF2h."],"mechanism":["Сдвиг: положение меняется, состав может сохраниться.","Удаление: частица или её компоненты покидают участок.","Обмен: один гистон или димер заменяется другим."],"trap":"Семейства нельзя распределять на постоянные группы «активаторы» и «репрессоры».","widget":"families","quiz":{"question":"После воздействия увеличилось содержание H2A.Z, но положение частиц почти не изменилось. Какой результат следует рассмотреть?","options":["Обмен H2A–H2B на H2A.Z–H2B без обязательного перемещения центра частицы.","Только сдвиг всех октамеров на одинаковое число пар оснований.","Необратимое разрушение ДНК."],"correct":0,"feedback":["Верно. Для проверки измеряют общий H3, H2A.Z и координаты частиц.","Почти неизменные координаты не поддерживают обязательный общий сдвиг.","Изменение варианта не доказывает разрушение ДНК."]},"sources":["swr1","assembly","snf2h"],"program":["5.2","слайд 7"]},{"id":"recruitment","section":1,"title":"Как комплекс оказывается в нужном локусе","lead":"Действие ремоделера определяется не только мотором, но и его привлечением, составом и состоянием субстрата.","paragraphs":["Транскрипционные факторы могут взаимодействовать с субъединицами ремоделирующих комплексов. Домены распознавания гистоновых модификаций создают дополнительные контакты; некодирующие РНК в некоторых системах помогают организовать белковые взаимодействия. Ни один из этих путей нельзя объявить универсальным для всех локусов.","Модификация гистона может изменить контакты с ремоделером, а ремоделер — доступность участка для фермента модификации. Такая связь объясняет совместное действие механизмов без необходимости постулировать однозначную таблицу «метка → включение гена».","NuRD объединяет CHD-зависимое ремоделирование с HDAC1/2-зависимым деацетилированием. Эти активности различны и могут быть разделены вмешательством. Если исчезла каталитическая активность CHD4, из этого не следует мгновенное исчезновение всех ацетильных групп; если ингибирована HDAC, мотор не обязательно выключен.","Сами субъединицы ремоделеров также могут фосфорилироваться, убиквитинироваться и SUMOилироваться, что в конкретных системах меняет сборку, локализацию или активность. Доступность АТФ и продуктов реакции влияет на работу мотора; одну общую кривую зависимости всех комплексов от АТФ/АДФ задать нельзя. HSA-участки ряда ремоделеров взаимодействуют с актином и актиноподобными белками, тогда как бромодомены и другие модули участвуют в распознавании хроматина."],"mechanism":["Фактор или другой участник создаёт контакт с комплексом.","Комплекс распознаёт субстрат и связанные с ним признаки.","Мотор и ферменты модификации выполняют разные реакции."],"trap":"Обнаружение субъединицы на локусе не доказывает, что все активности комплекса работают.","widget":"recruit","quiz":{"question":"В NuRD выборочно ингибировали HDAC1/2. Какой непосредственный эффект проверяют прежде всего?","options":["Мгновенное удаление всех нуклеосом из генома.","Автоматическую замену H3 на CENP-A.","Снижение скорости удаления ацетильных групп, отдельно от работы CHD-мотора."],"correct":2,"feedback":["Из выключения одной активности NuRD не следует полное удаление нуклеосом.","Это иной механизм и иной маршрут сборки.","Верно. Дополнительно проверяют активность мотора и состав комплекса."]},"sources":["nurd","reader-phd"],"program":["5.2","слайд 9"]},{"id":"baf","section":1,"title":"BAF: состав одного комплекса и состав популяции","lead":"Альтернативные субъединицы нельзя изображать как обязательных соседей в одном комплексе.","paragraphs":["У млекопитающих различают cBAF, PBAF и ncBAF с общими и характерными субъединицами. Мотором может служить SMARCA4 (BRG1) или SMARCA2 (BRM). В cBAF ARID1A и ARID1B представляют альтернативные субъединицы; PBAF содержит ARID2. В ncBAF характерны BRD9 и BICRA/BICRAL. Это упрощённая карта нескольких различий, а не полный состав.","В одной клетке могут существовать разные комплексы. Поэтому выражение «содержание ARID1A и ARID1B в клетке» не означает, что обе молекулы одновременно входят в одну частицу cBAF. Смена состава при развитии или нарушении функции одного гена меняет распределение комплексов и их мишени.","После потери SMARCA4 часть функций может поддерживаться SMARCA2-содержащими комплексами, но компенсация зависит от клеточного контекста. Для проверки нужны измерения оставшегося белка, состава комплексов, их связывания с хроматином и функционального результата. Длительный нокаут также допускает вторичную адаптацию."],"mechanism":["Выберите тип комплекса.","Выберите одну моторную субъединицу.","Отделите состав отдельного комплекса от распределения комплексов в клетке."],"trap":"Не следует помещать ARID1A и ARID1B, SMARCA4 и SMARCA2 в один рисунок как обязательные одновременные компоненты одной частицы.","widget":"baf","quiz":{"question":"В клетке обнаружены ARID1A и ARID1B. Какой вывод об отдельных cBAF-комплексах допустим?","options":["ARID2 обязательно входит во все эти cBAF.","В популяции могут присутствовать cBAF с альтернативными ARID-субъединицами.","Обе субъединицы обязательно соседствуют в каждом cBAF."],"correct":1,"feedback":["ARID2 — субъединица PBAF; в cBAF её нет, там находится ARID1A или ARID1B.","Верно. Для определения состава используют очистку комплексов и другие методы белкового анализа.","Состав популяции нельзя переносить на отдельную частицу."]},"sources":["baf-assembly"],"program":["5.2","слайды 7, 9"]},{"id":"remodel-disease","section":1,"title":"Почему нарушение ремоделирования вызывает болезнь","lead":"Изменение регуляторных программ имеет разные последствия в развивающейся ткани и опухоли.","paragraphs":["В опухолях встречаются нарушения генов ARID1A, SMARCB1, SMARCA4 и других компонентов SWI/SNF. Они способны менять доступность регуляторных участков, дифференцировку и зависимость от оставшихся комплексов. Нельзя считать все мутации функционально равными: значение имеют тип варианта, остаточная активность, ткань и сопутствующие изменения.","Гетерозиготные патогенные изменения ARID1B и ряда других SWI/SNF-генов связаны с синдромом Коффина—Сириса. Для синдрома Николаидеса—Барайцера характерны определённые изменения SMARCA2. CHARGE связан с CHD7. Эти примеры показывают значение регуляции хроматина для развития; конкретный синдром нельзя выводить только из названия семейства ремоделеров.","Синтетическая уязвимость означает, что нарушение одного пути усиливает зависимость от другого. В некоторых SMARCA4-дефицитных опухолевых моделях показана зависимость от SMARCA2. Это экспериментальный контекст, который следует проверять по генотипу, функции белков и ответу модели; он не является универсальной рекомендацией лечения.","Биаллельная потеря SMARCB1 характерна для большинства злокачественных рабдоидных опухолей, включая атипичную тератоидно-рабдоидную опухоль ЦНС; изменения ARID1A встречаются в некоторых опухолях яичника и эндометрия, SMARCA4 — в части опухолей лёгкого и других тканей. Частоту находок всегда относят к конкретному набору опухолей и критерию изменения. В ARID1A-дефицитных моделях исследовали зависимость от EZH2; она не устанавливается только по наличию любой мутации ARID1A. Ремоделирующие комплексы важны также для репликации и репарации: они меняют доступ и белковые контакты в этих процессах."],"mechanism":["Нарушение субъединицы меняет доступные регуляторные программы.","Эффект зависит от ткани, стадии и типа изменения.","Оставшийся путь может стать необходимым для выживания определённой модели."],"trap":"Совпадение гена в опухоли и наследственном синдроме не означает одинаковый механизм или одинаковый вариант мутации.","widget":"disease","quiz":{"question":"В SMARCA4-дефицитной линии выключение SMARCA2 снизило выживаемость. Что необходимо для проверки специфической зависимости?","options":["Только повторить измерение в той же линии без контроля.","Сразу считать эффект доказанным для всех опухолей.","Сопоставить с подходящими контрольными линиями и восстановлением функции, проверив прямую мишень."],"correct":2,"feedback":["Повтор повышает воспроизводимость, но не исключает неспецифический эффект.","Зависимость может быть контекстной.","Верно. Контроль генотипа и восстановление функции помогают отделить специфическую зависимость от токсичности."]},"sources":["css","nbs","charge","synthetic","arid-ezh2"],"program":["5.2","слайды 10, 18"]},{"id":"remodel-measure","section":1,"title":"Как измерить работу ремоделера","lead":"Связывание комплекса, расход АТФ и перестройка нуклеосомы — три разных наблюдения.","paragraphs":["В реконструированной системе можно изменять концентрацию фермента, АТФ и состав нуклеосомы. Нативный гель позволяет различать некоторые положения частицы или продукты обмена, но движение полосы зависит от её состава и формы. FRET измеряет изменение расстояния между метками и позволяет наблюдать переходы во времени. Криоэлектронная микроскопия показывает структурные состояния; отдельная структура не задаёт все скорости переходов.","Ниже воспроизводится зависимость скорости ремоделирования человеческим SNF2h от его концентрации из работы Gamarra и соавторов: kmax около 2,5 мин⁻¹, Kₘ,app около 61 нМ, коэффициент Хилла около 1,5 в указанных условиях. Эта зависимость не является скоростью всех ISWI-комплексов. Расчёт показан только при избытке фермента над 20 нМ нуклеосомного субстрата и фиксированных условиях опыта.","В клетках быстрые вмешательства, временные ряды ATAC/MNase, измерение новой РНК и восстановление функции позволяют уточнять причинный порядок. CRISPR-скрининг выявляет зависимости, но первичный результат требует проверки отдельными воздействиями. Изменение экспрессии гена может быть вторичным следствием изменения клеточного состояния.","Оптические и магнитные пинцеты позволяют прикладывать усилие к отдельным молекулам и наблюдать изменения их длины или сопротивления. Вывод о шагах мотора требует калибровки и учёта того, как сила влияет на субстрат. Репортёрный опыт помогает проверять функцию регуляторного элемента, но искусственная конструкция может отличаться по хроматиновому окружению от исходного локуса."],"mechanism":["Сначала измерьте взаимодействие комплекса с субстратом.","Затем отдельно измерьте каталитическое преобразование.","Для клеточного механизма проверьте время и прямую зависимость от мишени."],"trap":"Расход АТФ не гарантирует продуктивного сдвига; структурный снимок не измеряет скорость.","widget":"snf2h","quiz":{"question":"Мутантный комплекс связывает нуклеосомы и гидролизует АТФ, но не изменяет их положения. Что показывает опыт?","options":["Любая АТФаза автоматически является эффективным ремоделером.","Нуклеосомы обязательно были удалены.","Связывание и гидролиз АТФ могут быть недостаточно сопряжены с продуктивным ремоделированием."],"correct":2,"feedback":["АТФазная активность сама по себе не доказывает продуктивное преобразование нуклеосомы.","Удаление следует проверять отдельно по продуктам и содержанию гистонов.","Верно. Нужно измерять механический результат, а не только присутствие комплекса и гидролиз АТФ."]},"sources":["snf2h","remodel-structure"],"program":["5.2","слайды 8–10"]},{"id":"chemistry","section":2,"title":"Ацетилирование и метилирование: разная химия","lead":"Одинаковый аминокислотный остаток может нести разные модификации, но их физические последствия неодинаковы.","paragraphs":["Обозначение H3K27ac означает ацетилирование лизина (K) в позиции 27 гистона H3. H3K9me2 означает две метильные группы на лизине 9; me1, me2 и me3 различают степени метилирования. Номер относится к аминокислотной последовательности зрелого белка (без начального метионина), а не к координате ДНК.","Ацетилирование ε-аминогруппы лизина нейтрализует её положительный заряд при физиологическом pH. Это может изменять контакты гистонов с ДНК и между частицами, а также создавать участок распознавания для бромодоменов. Изменение одной группы не означает автоматического распада всего октамера.","Метилирование лизина обычно сохраняет положительный заряд и прежде всего меняет поверхность распознавания белками. Функция зависит от остатка, степени метилирования, сочетания соседних модификаций и белков, которые способны связаться. Ацетилирование и метилирование одного и того же лизина являются альтернативными состояниями этого остатка в одной молекуле; в популяции они могут наблюдаться одновременно на разных молекулах."],"mechanism":["Назовите гистон и аминокислотный остаток.","Укажите тип и степень модификации.","Рассмотрите заряд, контакты и распознающие белки."],"trap":"«Метилирование выключает ген» — недостаточная и часто неверная формулировка. Сначала нужно назвать остаток и степень метилирования.","widget":"chemistry","quiz":{"question":"Какой непосредственный химический эффект отличает ацетилирование лизина от его триметилирования?","options":["Ацетилирование нейтрализует положительный заряд ε-аминогруппы; триметилирование его сохраняет.","Обе реакции обязательно придают лизину отрицательный заряд.","Триметилирование удаляет лизин из белка."],"correct":0,"feedback":["Верно. При этом обе модификации могут менять распознавание белками.","Ацетилированный лизин нейтрален по этой группе; отрицательный заряд здесь не возникает.","Метилирование изменяет боковую группу, не удаляя остаток из последовательности."]},"sources":["acetyl-physics","hp1"],"program":["5.3","слайды 11–12, 16"]},{"id":"enzymes","section":2,"title":"Установка, удаление и обновление модификаций","lead":"Содержание модификации определяется скоростями нескольких процессов, а не только наличием одного фермента.","paragraphs":["Ацетилтрансферазы, включая p300 и CBP, используют ацетил-КоА; деацетилазы удаляют ацетильные группы. HDAC разных классов устроены неодинаково: сиртуины используют NAD⁺. Метилтрансферазы используют S-аденозилметионин (SAM). Лизиновые деметилазы также различаются: JmjC-ферменты зависят от α-кетоглутарата, Fe²⁺ и кислорода, тогда как LSD1 использует FAD и действует на определённые моно- и диметилированные субстраты.","Доля модифицированных гистонов может уменьшаться вследствие ферментативного удаления, обмена гистонов и разбавления при репликации. После выключения фермента установки уже существующие группы не исчезают мгновенно. Скорость изменения зависит от оставшихся путей, доступности субстрата и времени наблюдения.","В учебной модели ниже доля M изменяется по уравнению dM/dt = w(1 − M) − eM. w и e — условные константы скоростей установки и удаления, выраженные в мин⁻¹; начальная доля задана явно. Модель не включает репликацию, обмен гистонов и взаимодействие разных меток. Она помогает понять баланс реакций и не предсказывает кинетику конкретного препарата.","Среди ацетилтрансфераз есть GCN5/PCAF и белки семейства MYST, например MOF и Tip60. MOF связан с H4K16ac, который может изменять межнуклеосомные контакты. Метилтрансферазы SUV39H1/2 участвуют в установке H3K9me3, SETDB1 — в H3K9-метилировании, EZH2/EZH1 в PRC2 — в H3K27-метилировании, комплексы SET1/KMT2 — в H3K4-метилировании, DOT1L — в H3K79-метилировании, SETD2 — в установке H3K36me3. Их субстраты и степени метилирования различаются; наличие метки не доказывает, какой единственный фермент создал её в данной клетке."],"mechanism":["Фермент устанавливает группу на доступном субстрате.","Другой фермент или обмен гистонов снижает её содержание.","Во времени устанавливается баланс скоростей."],"trap":"Наличие метилтрансферазы не равно её активности; снижение ферментативной активности не равно мгновенному исчезновению метки.","widget":"mark","quiz":{"question":"Фермент установки ацетильных групп выключен в момент t = 10 мин. Что произойдёт с уже существующими группами сразу после этого?","options":["Их доля не изменится скачком: дальше её будут снижать деацетилазы и обновление гистонов.","Они мгновенно исчезнут независимо от других процессов.","Все превратятся в три метильные группы."],"correct":0,"feedback":["Верно. Выключение фермента сразу меняет скорость постановки метки, а её содержание меняется постепенно.","Выключение установки меняет скорость дальнейшего изменения, а не мгновенно удаляет группы.","Эти реакции осуществляются разными ферментами и не являются автоматическим превращением."]},"sources":["metabolism","akg","histone-age","h4k16"],"program":["5.3","слайды 11–12"]},{"id":"readers","section":2,"title":"Кто распознаёт модификацию","lead":"Один химический тип может иметь разные функции, потому что белки различают конкретные молекулярные поверхности.","paragraphs":["H3K4me3 часто обогащён у активных промоторов; его могут распознавать определённые PHD-домены, например в BPTF. H3K9me2/3 связан с рядом репрессированных областей; хромодомен HP1 распознаёт метилированный H3K9. H3K27me3 устанавливается PRC2 и связан с Polycomb-регуляцией; его распознают, среди прочих участников, хромодомены CBX в каноническом PRC1. Это разные цепи взаимодействий, несмотря на общий тип «метилирование».","Бромодомены связывают ацетилированные лизины; хромодомены, PHD- и Tudor-домены обладают разной специфичностью. Название класса домена не задаёт единственную мишень для всех его представителей. Связывание зависит от соседних остатков, сочетания модификаций, ДНК и других белковых контактов.","Гипотеза гистонового кода подчёркивает роль сочетаний модификаций и их распознавания. Её полезно понимать как контекстные взаимодействия, а не как универсальный словарь. BRD4 может связываться с хроматином через несколько контактов; H3K27ac не задаёт его занятость одной универсальной кривой. Ингибирование бромодоменов может нарушить часть контактов, не удалив саму ацетильную группу.","H3K36me3 часто связан с транскрибируемыми телами генов и участвует также в обработке транскриптов и поддержании целостности генома; H4K20me3 встречается в ряде гетерохроматиновых контекстов. Ни одну из этих меток нельзя свести к единственному значению «активация» или «репрессия». WD40-белок WDR5 служит важным участником комплексов H3K4-метилирования и белковых контактов, но его нельзя представлять как универсальный прямой распознаватель H3K4me3. Некоторые 14-3-3-белки взаимодействуют с фосфорилированными остатками; Tudor-домены также имеют собственную специфичность."],"mechanism":["Модификация создаёт или изменяет участок взаимодействия.","Распознающий белок связывается при подходящей специфичности.","Его партнёры и локус определяют функциональный результат."],"trap":"Метка может быть причиной, следствием или сопутствующим признаком состояния. ChIP-корреляция не различает эти варианты.","widget":"readers","quiz":{"question":"Почему H3K4me3 и H3K9me3 не следует считать одинаковыми сигналами?","options":["Три метильные группы на любом остатке всегда нейтрализуют положительный заряд.","Разные позиции создают разные поверхности распознавания и привлекают разные комплексы.","Обе метки обязательно удаляют все нуклеосомы."],"correct":1,"feedback":["Метилирование лизина обычно сохраняет положительный заряд.","Верно. Остаток и контекст
