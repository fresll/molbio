p2":"on","p3":"off","p4":"off","i1":"off","i2":"on","i3":"off","i4":"off","o":"on","u1":"hide","u2":"hide"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","PERK"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"Накопление неправильно свёрнутых белков в просвете ЭПР активирует трансмембранную киназу PERK, и PERK фосфорилирует Ser51 eIF2α."},"2-1":{"n":{"gcn2":"base","perk":"on","pkr":"base","hri":"base","aa":"base","er":"on","ds":"base","hm":"base","ire1":"on","atf6":"on","eif2":"on","out":"low"},"e":{"p1":"off","p2":"on","p3":"off","p4":"off","i1":"off","i2":"on","i3":"off","i4":"off","o":"on","u1":"on","u2":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","PERK"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"Накопление неправильно свёрнутых белков в просвете ЭПР активирует трансмембранную киназу PERK, и PERK фосфорилирует Ser51 eIF2α. Нарушение сворачивания в ЭПР активирует также IRE1α и ATF6 — две другие ветви UPR, которые не используют фосфорилирование eIF2α."},"3-0":{"n":{"gcn2":"base","perk":"base","pkr":"on","hri":"base","aa":"base","er":"base","ds":"on","hm":"base","ire1":"hide","atf6":"hide","eif2":"on","out":"low"},"e":{"p1":"off","p2":"off","p3":"on","p4":"off","i1":"off","i2":"off","i3":"on","i4":"off","o":"on","u1":"hide","u2":"hide"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","PKR"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"Двухцепочечная РНК, например при репликации ряда вирусов, связывается с PKR и активирует её; PKR фосфорилирует Ser51 eIF2α."},"3-1":{"n":{"gcn2":"base","perk":"base","pkr":"on","hri":"base","aa":"base","er":"base","ds":"on","hm":"base","ire1":"base","atf6":"base","eif2":"on","out":"low"},"e":{"p1":"off","p2":"off","p3":"on","p4":"off","i1":"off","i2":"off","i3":"on","i4":"off","o":"on","u1":"off","u2":"off"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","PKR"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"Двухцепочечная РНК, например при репликации ряда вирусов, связывается с PKR и активирует её; PKR фосфорилирует Ser51 eIF2α. Ветви UPR IRE1α и ATF6 при этом воздействии не активируются."},"4-0":{"n":{"gcn2":"base","perk":"base","pkr":"base","hri":"on","aa":"base","er":"base","ds":"base","hm":"on","ire1":"hide","atf6":"hide","eif2":"on","out":"low"},"e":{"p1":"off","p2":"off","p3":"off","p4":"on","i1":"off","i2":"off","i3":"off","i4":"on","o":"on","u1":"hide","u2":"hide"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","HRI"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"При недостатке гема HRI освобождается от ингибирующего связывания гема и фосфорилирует Ser51 eIF2α."},"4-1":{"n":{"gcn2":"base","perk":"base","pkr":"base","hri":"on","aa":"base","er":"base","ds":"base","hm":"on","ire1":"base","atf6":"base","eif2":"on","out":"low"},"e":{"p1":"off","p2":"off","p3":"off","p4":"on","i1":"off","i2":"off","i3":"off","i4":"on","o":"on","u1":"off","u2":"off"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Активная киназа eIF2α","HRI"],["Ser51 eIF2α","фосфорилирован у части молекул"]],"note":"При недостатке гема HRI освобождается от ингибирующего связывания гема и фосфорилирует Ser51 eIF2α. Ветви UPR IRE1α и ATF6 при этом воздействии не активируются."}},"fs":17,"nfs":14,"lfs":17,"zfs":16}}},{"id":"eif2b","number":2,"section":0,"title":"Почему фосфорилирование eIF2α снижает общую трансляцию","question":1,"questions":[1],"keywords":["eIF2B","eIF2","тройной комплекс","Met-тРНКi","обмен GDP на GTP","фактор обмена гуаниновых нуклеотидов","инициация трансляции","ISRIB","аллостерия"],"lead":["Для каждой новой инициации трансляции eIF2 должен снова связать GTP. Этот обмен нуклеотидов катализирует [[T09|eIF2B]], и именно eIF2B подавляется, когда α-субъединица eIF2 фосфорилирована."],"mechanism":["[[T07|eIF2]] в GTP-связанной форме присоединяет [[T11|инициаторную метионил-тРНК]] и образует [[T10|тройной комплекс]] eIF2·GTP·Met-тРНКi.","После узнавания старт-кодона из комплекса выходит фосфат, образовавшийся при гидролизе GTP, и eIF2·GDP покидает рибосому; для нового цикла GDP должен быть заменён на GTP с участием eIF2B.","[[T08|eIF2(αP)]] связывается с eIF2B прочнее, чем немодифицированный eIF2, и подавляет его обменную активность; тройного комплекса образуется меньше."],"paragraphs":["Каноническая инициация трансляции у эукариот начинается с тройного комплекса: eIF2, связанный с GTP, присоединяет инициаторную метионил-тРНК (Met-тРНКi). Вместе с другими факторами инициации тройной комплекс связывается с малой субъединицей рибосомы (40S), и она просматривает 5′-область мРНК в поисках старт-кодона. Распознавание старт-кодона сопровождается высвобождением неорганического фосфата, образовавшегося при гидролизе GTP. После этого eIF2·GDP покидает рибосому, и к малой субъединице присоединяется большая.","eIF2·GDP не способен связать новую Met-тРНКi. Чтобы eIF2 снова участвовал в инициации, связанный GDP должен быть заменён на GTP. Сам eIF2 освобождает GDP медленно; обмен ускоряет [[T09|фактор обмена гуаниновых нуклеотидов eIF2B]] — крупный комплекс из двух копий пяти типов субъединиц. eIF2B не фосфорилирует GDP и не синтезирует GTP: он способствует освобождению GDP, после чего eIF2 связывает GTP из цитозоля.","Фосфорилирование Ser51 изменяет взаимодействие eIF2 с eIF2B. eIF2(αP) связывается с eIF2B прочнее немодифицированного eIF2 и, по структурным и биохимическим данным, переводит eIF2B в конформацию с низкой обменной активностью. Поэтому прежнее описание eIF2(αP) как простого конкурентного ингибитора считают неполным. Молекул eIF2B в клетке значительно меньше, чем молекул eIF2, и фосфорилирования даже небольшой части eIF2 достаточно, чтобы заметно замедлить обмен. В результате тройного комплекса образуется меньше, и инициация трансляции большинства мРНК замедляется.","Важно различать содержание eIF2B и его активность. В показанном случае количество eIF2B не меняется: уменьшается скорость катализируемого им обмена. Насколько снижается общий синтез белка, зависит от доли eIF2(αP), типа клеток и воздействия, поэтому одного универсального значения в процентах нет. Малая молекула ISRIB действует именно на этом звене: связываясь с eIF2B, она уменьшает его чувствительность к eIF2(αP), но не изменяет фосфорилирование eIF2α."],"trap":["eIF2B — это киназа, которая превращает GDP в GTP, а при ISR количество eIF2B в клетке уменьшается.","eIF2B — фактор обмена нуклеотидов: он ускоряет освобождение GDP из eIF2, после чего eIF2 связывает GTP. При ISR количество eIF2B может оставаться прежним; снижается его обменная активность под действием eIF2(αP)."],"conditions":"Схема механизма, качественные состояния; клетки млекопитающих. Подавление eIF2B описано по обзору Wek 2023 (полный текст) и работе Schoof 2021 (очищенные белки и клетки человека; прочитаны тематические фрагменты об аллостерическом подавлении eIF2B и действии ISRIB). Состояние с ISRIB относится к умеренному ISR: при высокой доле eIF2(αP) ISRIB перестаёт восстанавливать трансляцию (Rabouw 2019: клеточные линии, заражение пикорнавирусами, poly(I:C) и арсенит; прочитана аннотация). Слова «высокая», «снижена» на схеме не являются измерениями.","sources":["Costa2020","Wek2023","Schoof2021","Rabouw2019"],"quiz":{"id":"S10-L02","rev":1,"question":"Содержание eIF2B не изменилось, но его обменная активность уменьшилась вследствие связывания eIF2(αP). Какое непосредственное следствие ожидается?","options":[{"id":"S10-L02-2","text":"Доступность eIF2·GTP·Met-тРНКi уменьшится.","correct":true,"feedback":"При замедленном обмене меньше eIF2 возвращается в GTP-связанную форму, способную образовать тройной комплекс."},{"id":"S10-L02-1","text":"Образование тройного комплекса ускорится.","correct":false,"feedback":"Обмен GDP на GTP необходим для повторного образования комплекса; подавление обмена не ускоряет этот процесс."},{"id":"S10-L02-3","text":"Образование тройного комплекса сохранится, поскольку общее содержание eIF2B не изменилось.","correct":false,"feedback":"Содержание комплекса не задаёт его обменную активность; при её подавлении образование тройного комплекса может уменьшиться."}]},"widget":{"kind":"net","title":"","s":{"title":"Обмен GDP на GTP на eIF2 и его подавление","status":"Схема механизма · качественные состояния","ctrls":[{"id":"f","type":"group","label":"Фосфорилирование Ser51 eIF2α","opts":["Малая доля eIF2(αP)","Повышенная доля eIF2(αP)","Повышенная доля и ISRIB"]}],"W":560,"H":376,"NW":340,"NH":410,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание","seq":"порядок событий цикла","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — звено работает","мелкий пунктир — работает медленнее","пунктирная рамка — мало или не действует"]},"zones":[],"mem":[],"nodes":{"eif2p":{"p":[100,46,170,44],"t":"eIF2(αP)·GDP","n":[74,40,132,40],"fs":17},"eif2b":{"p":[330,46,110,44],"t":"eIF2B","n":[208,40,90,40],"fs":18},"isrib":{"p":[474,46,96,44],"t":"ISRIB","n":[298,40,70,40],"fs":17},"gdp":{"p":[100,172,150,46],"t":"eIF2·GDP","n":[70,158,124,42],"fs":18},"gtp":{"p":[440,172,150,46],"t":"eIF2·GTP","n":[270,158,124,42],"fs":18},"tc":{"p":[440,320,190,56],"t":"тройной комплекс\neIF2·GTP·Met-тРНКi","n":[265,318,140,66],"fs":16,"tn":"тройной комплекс\neIF2·GTP·\nMet-тРНКi"},"ini":{"p":[100,320,170,56],"t":"40S: поиск\nстарт-кодона","n":[75,318,140,66],"fs":16,"tn":"40S: поиск\nстарт-\nкодона"}},"edges":{"x":{"a":"gdp","b":"gtp","k":"rx","t":"обмен GDP на GTP","d":[0,22],"dn":[0,30]},"cat":{"a":"eif2b","b":[300,166,175,154],"k":"act"},"inh":{"a":"eif2p","b":"eif2b","k":"inh"},"is":{"a":"isrib","b":"eif2b","k":"bind"},"bind":{"a":"gtp","b":"tc","k":"bind","t":"+ Met-тРНКi","d":[14,0],"dn":[-12,0],"anc":"start"},"go":{"a":"tc","b":"ini","k":"seq","t":"присоединение\nк малой субъединице","d":[0,26],"dn":[0,58]},"back":{"a":"ini","b":"gdp","k":"seq","t":"узнавание старт-кодона:\nвысвобождение Pi","d":[14,0],"dn":[10,0],"anc":"start"}},"st":{"0":{"n":{"eif2p":"off","eif2b":"on","isrib":"hide","gtp":"on","tc":"on","ini":"on"},"e":{"inh":"off","is":"hide"},"m":[["Содержание eIF2B","исходное"],["Обменная активность eIF2B","высокая"],["Тройной комплекс","образуется быстро"]],"note":"Доля eIF2 с фосфорилированным Ser51 мала. eIF2B ускоряет освобождение GDP из eIF2·GDP, eIF2 связывает GTP и Met-тРНКi, и тройной комплекс снова участвует в инициации."},"1":{"n":{"eif2p":"on","eif2b":"low","isrib":"hide","gtp":"low","tc":"low","ini":"low"},"e":{"is":"hide"},"m":[["Содержание eIF2B","исходное"],["Обменная активность eIF2B","снижена"],["Тройной комплекс","образуется медленнее"]],"note":"eIF2(αP)·GDP связывается с eIF2B и подавляет его обменную активность. Количество eIF2B не изменилось, но меньше eIF2 возвращается в GTP-связанную форму, поэтому тройного комплекса для инициации становится меньше.","et":{"x":"обмен GDP на GTP\nзамедлен"}},"2":{"n":{"eif2p":"on","eif2b":"on","isrib":"on","gtp":"on","tc":"on","ini":"on"},"e":{"inh":"off"},"m":[["Содержание eIF2B","исходное"],["Обменная активность eIF2B","в основном восстановлена"],["Доля eIF2(αP)","остаётся повышенной"]],"note":"ISRIB связывается с eIF2B и делает его малочувствительным к eIF2(αP). При умеренном ISR обменная активность и образование тройного комплекса восстанавливаются, хотя фосфорилирование eIF2α сохраняется. При высокой доле eIF2(αP) этот эффект ISRIB ослабевает."}},"fs":17,"nfs":14,"lfs":15,"zfs":16,"nlfs":13}}},{"id":"atf4-uorf","number":3,"section":0,"title":"Как уменьшение доступности тройного комплекса усиливает трансляцию ATF4","question":1,"questions":[1],"keywords":["ATF4","uORF","uORF1","uORF2","повторная инициация","реинициация","избирательная трансляция","5′-область","тройной комплекс","GCN4"],"lead":["При ISR трансляция большинства мРНК замедляется, а синтез ATF4 усиливается. Причина — устройство 5′-области мРНК [[T14|ATF4]]: две короткие [[T12|рамки uORF]] с разными ролями и [[T13|повторная инициация]] после первой из них."],"mechanism":["После трансляции короткой uORF1 малая субъединица рибосомы остаётся на мРНК и продолжает сканирование, но для новой инициации ей нужен новый [[T10|тройной комплекс]].","Если тройного комплекса достаточно, субъединица присоединяет его до старт-кодона uORF2. uORF2 перекрывает начало рамки ATF4 в другой рамке считывания, и после её трансляции рибосома оказывается за стартом ATF4.","Если тройного комплекса меньше, часть субъединиц присоединяет его уже после старт-кодона uORF2 и начинает трансляцию на старт-кодоне ATF4."],"paragraphs":["В 5′-области мРНК ATF4 млекопитающих перед основной рамкой считывания находятся две короткие открытые рамки. uORF1, ближайшая к 5′-концу, кодирует пептид из трёх аминокислот. uORF2 начинается дальше, а заканчивается уже за старт-кодоном ATF4, причём в другой рамке считывания: она перекрывает начало кодирующей области ATF4. Рибосома, транслирующая uORF2, не может начать синтез ATF4 — она проходит его старт-кодон, считывая другую рамку.","Малая субъединица рибосомы с тройным комплексом связывается у 5′-конца мРНК и начинает трансляцию на uORF1. После завершения этой короткой рамки малая субъединица часто не отделяется от мРНК и продолжает сканирование. Met-тРНКi уже израсходована, поэтому для следующей инициации субъединица должна заново присоединить тройной комплекс. Без стресса тройного комплекса много, он присоединяется быстро, и ближайшим старт-кодоном оказывается старт uORF2. Рибосома транслирует uORF2, завершает трансляцию за стартом ATF4 и отделяется от мРНК; синтез ATF4 остаётся низким.","При умеренном ISR доля eIF2(αP) возрастает, обмен на eIF2B замедляется, и тройного комплекса становится меньше. Сканирующей субъединице требуется больше времени, чтобы снова его присоединить. За это время часть субъединиц проходит старт uORF2 без инициации и присоединяет тройной комплекс уже между стартом uORF2 и стартом ATF4. Эти субъединицы начинают трансляцию ATF4. Количество мРНК ATF4 при этом может не меняться: усиливается её трансляция. Такую модель задержанной повторной инициации предложили Vattem и Wek (2004) по экспериментам с мРНК ATF4 мыши; сходный механизм у дрожжей регулирует трансляцию мРНК GCN4.","У механизма есть границы. Предполагают, что при очень сильном снижении доступности тройного комплекса уменьшается и число малых субъединиц, начинающих сканирование мРНК, поэтому синтез ATF4 не возрастает беспредельно с ростом доли eIF2(αP). Кроме того, uORF имеются во многих мРНК, но избирательную трансляцию при стрессе обеспечивают лишь некоторые из них: значение имеют положение, длина uORF и окружение их старт-кодонов."],"trap":["При ISR синтез ATF4 возрастает потому, что усиливается транскрипция гена ATF4.","Канонический механизм — трансляционный: при неизменном количестве мРНК ATF4 изменяется место повторной инициации после uORF1. Изменения транскрипции ATF4 в отдельных условиях возможны, но они не объясняют, почему синтез ATF4 растёт, когда общая трансляция подавлена."],"conditions":"Схема механизма; каноническое устройство 5′-области мРНК ATF4 мыши и человека. Количество мРНК в схеме постоянно. Модель задержанной повторной инициации — Vattem и Wek 2004 (мРНК ATF4 мыши, клетки млекопитающих и репортёрные конструкции; прочитана аннотация) и Lu 2004 (библиографическая запись); полный текст — обзор Wek 2023. Длины рамок и расстояния на схеме условные; соотношения субъединиц, начинающих трансляцию на разных стартах, показаны качественно. Утверждение о спаде синтеза ATF4 при очень сильном дефиците тройного комплекса — предположение обзора, а не измерение.","sources":["Wek2023","Vattem2004","Lu2004"],"quiz":{"id":"S10-L03","rev":2,"question":"Количество мРНК ATF4 не изменилось. При умеренном ISR повторное присоединение тройного комплекса после uORF1 замедлилось. Как это может усилить синтез ATF4?","options":[{"id":"S10-L03-1","text":"Реинициация на uORF2 усиливается, и те же рибосомы после её трансляции переходят к старту ATF4.","correct":false,"feedback":"В канонической схеме uORF2 перекрывает старт основной рамки ATF4. После трансляции uORF2 рибосома оказывается за этим стартом; усиление использования uORF2 не объясняет усиление трансляции ATF4."},{"id":"S10-L03-2","text":"Торможение общей трансляции одинаково усиливает использование всех стартов на мРНК ATF4.","correct":false,"feedback":"Разные старты не отвечают одинаково: значение имеют их положение и момент повторного присоединения тройного комплекса."},{"id":"S10-L03-3","text":"Часть сканирующих субчастиц проходит старт uORF2 и повторно инициирует на ATF4.","correct":true,"feedback":"Позднее присоединение тройного комплекса уменьшает использование ингибирующей uORF2 и позволяет использовать старт ATF4."}]},"widget":{"kind":"uorf_s1","title":"","s":{"title":"Где малая субъединица снова начинает трансляцию на мРНК ATF4","status":"Схема механизма · качественные состояния","opts_label":"Доступность тройного комплекса","opts":["Достаточная","Умеренно снижена","Резко снижена"],"lane1":"Рамки считывания на мРНК ATF4","lane2":"Путь малой субъединицы после uORF1","u1":"uORF1","u2":"uORF2","atf4":"ATF4","start_atf4":"старт ATF4","pos":{"u1":[0.03,0.17],"u2":[0.36,0.68],"atf4":[0.53]},"join":"+ тройной комплекс","off":"рибосома отделяется","off_n":"отделяется","lg":["овал — малая субъединица после uORF1","жёлтый кружок — присоединение тройного комплекса","пунктир — сканирование без трансляции","стрелка — трансляция рамки","uORF2 и ATF4 — разные рамки считывания"],"fixed":"Длины и расстояния условные; положения стартов в порядке uORF1 → uORF2 → ATF4 сохраняются при любой ширине экрана.","st":[{"paths":[{"join":0.25,"at":"u2","lab":"почти все субъединицы"}],"m":[["Трансляция uORF2","высокая"],["Синтез ATF4","низкий"],["Количество мРНК ATF4","не изменено"]],"note":"Тройного комплекса много: малая субъединица присоединяет его вскоре после uORF1 и начинает трансляцию на uORF2. uORF2 заканчивается за стартом ATF4, и рибосома отделяется, не транслировав ATF4."},{"paths":[{"join":0.25,"at":"u2","lab":"часть субъединиц"},{"join":0.45,"at":"atf4","lab":"другая часть субъединиц"}],"m":[["Трансляция uORF2","ниже"],["Синтез ATF4","повышен"],["Количество мРНК ATF4","не изменено"]],"note":"Тройной комплекс присоединяется медленнее. Часть субъединиц проходит старт uORF2 без инициации, присоединяет тройной комплекс до старта ATF4 и начинает синтез ATF4."},{"paths":[{"join":0.25,"at":"u2","lab":"меньше субъединиц","faint":true},{"join":0.45,"at":"atf4","lab":"меньше субъединиц","faint":true}],"m":[["Трансляция uORF2","ниже"],["Синтез ATF4","усиление ограничено"],["Количество мРНК ATF4","не изменено"]],"note":"Тройного комплекса очень мало. Предполагают, что меньше малых субъединиц начинает сканирование мРНК, поэтому синтез ATF4 растёт не беспредельно. Схема качественная."}]}}},{"id":"isr-feedback","number":4,"section":0,"title":"Как GADD34 и CReP ограничивают фосфорилирование eIF2α","question":1,"questions":[1],"keywords":["GADD34","PPP1R15A","CReP","PPP1R15B","PP1","протеинфосфатаза 1","дефосфорилирование","обратная связь","ATF4","ASNS","CHOP"],"lead":["ATF4 изменяет транскрипцию многих генов, в том числе гена [[T19|GADD34]] — регуляторной субъединицы фосфатазы. Так возникает отрицательная обратная связь: доля eIF2(αP) снижается, и инициация трансляции возобновляется."],"mechanism":["[[T14|ATF4]] действует в ядре как транскрипционный фактор: усиливает транскрипцию генов синтеза и переноса аминокислот (например, ASNS) и гена GADD34.","GADD34 и [[T20|CReP]] — регуляторные субъединицы, которые направляют каталитическую субъединицу [[T21|PP1]] к eIF2(αP); комплекс отщепляет фосфат от Ser51.","Доля eIF2(αP) определяется соотношением фосфорилирования и дефосфорилирования; когда она снижается, обменная активность eIF2B и инициация трансляции восстанавливаются."],"paragraphs":["Важно различать регуляцию синтеза ATF4 и действие уже синтезированного белка. Синтез самого ATF4 регулируется при трансляции его мРНК (предыдущий шаг). Синтезированный ATF4 действует уже как транскрипционный фактор: перемещается в ядро и вместе с белками-партнёрами связывается с регуляторными участками генов. Среди его мишеней — гены синтеза и переноса аминокислот, например ген аспарагинсинтетазы ASNS, гены других транскрипционных факторов (CHOP, ATF5) и гены белков обратной связи.","Один из белков обратной связи — GADD34 (продукт гена PPP1R15A). Собственной фосфатазной активности у GADD34 нет: он связывает каталитическую субъединицу протеинфосфатазы 1 (PP1) и направляет её к eIF2(αP). Novoa и соавт. (2001) показали, что комплекс GADD34 с PP1 дефосфорилирует eIF2α in vitro, а при избытке GADD34 в клетках доля eIF2(αP) снижалась, хотя активность киназ PERK и GCN2 не изменялась. Образование GADD34 зависит от стресса: в клетках без PERK или GCN2 при соответствующем воздействии GADD34 не появлялся. мРНК GADD34 к тому же транслируется избирательно при повышенной доле eIF2(αP).","Вторая регуляторная субъединица, CReP (PPP1R15B), образуется постоянно и обеспечивает фоновое дефосфорилирование eIF2α. При подавлении CReP методом РНК-интерференции фосфорилирование eIF2α возрастало и ISR активировался без внешнего воздействия (Jousse 2003). Следовательно, доля eIF2(αP) в каждый момент — результат двух противоположных процессов: фосфорилирования киназами и дефосфорилирования комплексами PP1 с GADD34 или CReP.","Обратная связь через GADD34 срабатывает с задержкой: сначала должны образоваться ATF4, затем мРНК и белок GADD34. Поэтому в начале ответа доля eIF2(αP) высока, а позже, при той же активности киназ, снижается, и синтез белка частично возобновляется. Если нарушение сохраняется, обратная связь не устраняет его причину: киназы продолжают фосфорилировать eIF2α."],"trap":["Обратная связь через GADD34 сразу и полностью прекращает ISR, даже если вызвавшее его нарушение сохраняется.","GADD34 образуется с задержкой и ускоряет дефосфорилирование eIF2α, но не устраняет причину стресса. При продолжающемся воздействии киназы остаются активными, поэтому фосфорилирование eIF2α и часть ответа сохраняются."],"conditions":"Схема механизма, качественные состояния «раньше» и «позже» при одинаковой активности киназы; клетки млекопитающих. Novoa 2001 — клетки CHO и мышиные клетки без PERK или GCN2; стресс ЭПР и отсутствие аминокислот; избыточная экспрессия C-концевого фрагмента GADD34 (прочитана аннотация). Jousse 2003 — подавление CReP РНК-интерференцией в культуре клеток (прочитана аннотация). Обзоры Wek 2023 и Ryoo 2024 — полные тексты. Временная шкала не задана: «раньше» и «позже» обозначают порядок событий. ASNS и переносчики аминокислот приведены как примеры мишеней ATF4 (Wek 2023).","sources":["Wek2023","Ryoo2024","Novoa2001","Jousse2003"],"quiz":{"id":"S10-L04","rev":1,"question":"При одинаковой активности киназ усилилось направляемое GADD34 дефосфорилирование eIF2α. Какое изменение соответствует отрицательной обратной связи ISR?","options":[{"id":"S10-L04-2","text":"Доля eIF2(αP) остаётся прежней, поскольку активность киназ не изменилась.","correct":false,"feedback":"Доля модифицированного белка зависит от соотношения фосфорилирования и дефосфорилирования, а не только от активности киназ."},{"id":"S10-L04-3","text":"Общая инициация снижается дальше из-за усиления подавления eIF2B.","correct":false,"feedback":"Дефосфорилирование eIF2α ослабляет, а не усиливает подавление eIF2B в показанной петле."},{"id":"S10-L04-1","text":"Доля eIF2(αP) уменьшается, что способствует восстановлению инициации.","correct":true,"feedback":"PP1 в комплексе с регуляторной субъединицей удаляет фосфат с eIF2α и ослабляет подавление eIF2B."}]},"widget":{"kind":"net","title":"","s":{"title":"Отрицательная обратная связь через GADD34 и фоновое действие CReP","status":"Схема механизма · качественные состояния","ctrls":[{"id":"l","type":"group","label":"Этап ответа","opts":["Раньше","Позже"]},{"id":"g","type":"check","label":"GADD34 может синтезироваться","def":true}],"W":560,"H":400,"NW":340,"NH":480,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит; от фосфатаз — отщепление фосфата","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"синтез белка по мРНК гена","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","мелкий пунктир — снижено","пунктирная рамка — ещё не образовался","× — белка нет"]},"zones":[{"x":4,"y":4,"w":552,"h":392,"c":"cyto","t":"цитозоль","lx":14,"ly":388,"n":[4,4,332,472,12,466]},{"x":214,"y":264,"w":336,"h":126,"c":"nuc","t":"ядро","lx":540,"ly":384,"n":[196,196,140,230,330,420],"a":"end"}],"mem":[],"nodes":{"kin":{"p":[88,44,150,50],"t":"киназа eIF2α\n(активна)","n":[60,34,108,50],"fs":16,"tn":"киназа\neIF2α"},"crep":{"p":[300,44,130,42],"t":"CReP–PP1","n":[262,34,120,40],"fs":17},"eif2p":{"p":[88,148,130,44],"t":"eIF2(αP)","n":[60,124,106,40],"fs":17},"gadd":{"p":[450,148,160,44],"t":"GADD34–PP1","n":[262,124,128,40],"fs":17},"eif2b":{"p":[88,248,110,42],"t":"eIF2B","n":[60,214,100,40],"fs":17},"ini":{"p":[88,344,150,52],"t":"инициация\nтрансляции","n":[60,310,108,52],"fs":16},"atf4":{"p":[300,214,96,40],"t":"ATF4","n":[170,172,74,36],"fs":17},"g1":{"p":[300,334,160,70],"t":"гены ASNS\nи переносчиков\nаминокислот","n":[266,340,132,72],"fs":14,"tn":"гены ASNS\nи переносчиков\nаминокислот"},"g2":{"p":[472,300,120,40],"t":"ген GADD34","n":[266,240,124,38],"fs":15}},"edges":{"ph":{"a":"kin","b":"eif2p","k":"phos","pm":0.5},"i1":{"a":"eif2p","b":"eif2b","k":"inh"},"a1":{"a":"eif2b","b":"ini","k":"act"},"tl":{"a":"eif2p","b":"atf4","k":"act","t":"трансляция\nмРНК ATF4","tn":"","d":[-4,34],"anc":"end"},"t1":{"a":"atf4","b":"g1","k":"act","t":"транскрипция","d":[-10,0],"dn":[-8,6],"anc":"end"},"t2":{"a":"atf4","b":"g2","k":"act"},"syn":{"a":"g2","b":"gadd","k":"seq","t":"синтез белка","d":[10,0],"dn":[10,0],"anc":"start"},"dg":{"a":"gadd","b":"eif2p","k":"inh","t":"дефосфорилирование","d":[0,-14],"dn":[0,-12]},"dc":{"a":"crep","b":"eif2p","k":"inh"}},"st":{"0-0":{"n":{"kin":"on","crep":"on","atf4":"on","g1":"on","eif2p":"on","eif2b":"low","ini":"low","g2":"abs","gadd":"abs"},"e":{"dg":"off","syn":"off","t2":"off"},"m":[["Доля eIF2(αP)","высокая"],["GADD34","не образуется"],["Инициация трансляции","снижена"]],"note":"Раньше: состояние то же, что и в клетках, способных синтезировать GADD34, — обратная связь ещё не успела сработать. Работает только фоновое дефосфорилирование CReP–PP1."},"0-1":{"n":{"kin":"on","crep":"on","atf4":"on","g1":"on","eif2p":"on","eif2b":"low","ini":"low","g2":"base","gadd":"off"},"e":{"dg":"off","syn":"off","t2":"on"},"m":[["Доля eIF2(αP)","высокая"],["GADD34","ещё не образовался"],["Инициация трансляции","снижена"]],"note":"Раньше: киназа фосфорилирует eIF2α, eIF2B подавлен, общая инициация снижена, а трансляция мРНК ATF4 усилена. CReP–PP1 работает постоянно, но GADD34 ещё не синтезирован."},"1-0":{"n":{"kin":"on","crep":"on","atf4":"on","g1":"on","eif2p":"on","eif2b":"low","ini":"low","g2":"abs","gadd":"abs"},"e":{"dg":"off","syn":"off","t2":"off"},"m":[["Доля eIF2(αP)","остаётся высокой"],["GADD34","отсутствует"],["Инициация трансляции","остаётся сниженной"]],"note":"Позже, без GADD34: при той же активности киназы eIF2α дефосфорилирует только CReP–PP1. Доля eIF2(αP) остаётся высокой, и общая инициация не восстанавливается."},"1-1":{"n":{"kin":"on","crep":"on","atf4":"on","g1":"on","eif2p":"low","eif2b":"on","ini":"base","g2":"on","gadd":"on"},"e":{},"m":[["Доля eIF2(αP)","ниже, чем раньше"],["GADD34","синтезирован"],["Инициация трансляции","частично восстановлена"]],"note":"Позже: ATF4 усилил транскрипцию гена GADD34, белок GADD34 направил PP1 к eIF2(αP). Активность киназы прежняя, но дефосфорилирование ускорилось, доля eIF2(αP) снизилась, и инициация трансляции частично возобновилась."}},"fs":17,"nfs":14,"lfs":15,"zfs":16,"nlfs":13}}},{"id":"isr-outcomes","number":5,"section":0,"title":"Почему длительный ISR не означает неизбежной гибели клетки","question":1,"questions":[1],"keywords":["исход ISR","адаптация","гибель клетки","апоптоз","CHOP","DDIT3","длительный стресс","хронический ISR","β-клетки","CReP"],"lead":["ISR — не программа гибели клетки. Его исход зависит от того, устранено ли вызвавшее его нарушение, насколько сильным и долгим был ответ и в какой клетке он идёт."],"mechanism":["Раннее снижение общей трансляции уменьшает поступление новых полипептидов, в том числе в ЭПР, и уменьшает расход аминокислот на синтез белка.","ATF4 и связанные с ним регуляторы изменяют экспрессию генов синтеза и переноса аминокислот, обратной связи и других адаптационных процессов.","При длительном неустранённом нарушении часть выходов ISR, в том числе зависимых от [[T22|CHOP]], может способствовать гибели клетки; само по себе содержание CHOP исход не определяет."],"paragraphs":["Первое следствие ISR — замедление инициации трансляции большинства мРНК. В клетке со стрессом ЭПР это означает, что в просвет ЭПР поступает меньше новых полипептидов, которые нужно свернуть. В клетке с недостатком аминокислот на синтез белка расходуется меньше аминокислот. Одновременно избирательно транслируется мРНК ATF4, и ATF4 усиливает транскрипцию генов синтеза и переноса аминокислот, гена GADD34 и генов других транскрипционных факторов, например CHOP.","Если нарушение устранено — аминокислоты вернулись в среду, белки в ЭПР свернулись, — киназы eIF2α перестают активироваться. Комплексы PP1 с CReP и GADD34 дефосфорилируют eIF2α, обменная активность eIF2B восстанавливается, и трансляция возвращается к исходной. Белки, синтезированные во время ответа, ещё некоторое время сохраняются в клетке. В этом случае ISR завершается адаптацией.","Если нарушение сохраняется долго, состояние клетки меняется. Ось ATF4–CHOP–GADD34 возобновляет синтез белка, но при хронической активации ISR может способствовать гибели клетки (Ryoo 2024). [[T22|CHOP (DDIT3)]] — транскрипционный регулятор, который вместе с ATF4 изменяет экспрессию многих генов, в том числе генов, способствующих апоптозу. Однако повышенное содержание CHOP показывает лишь, что ISR активен давно или сильно, а не то, что клетка уже погибла или обязательно погибнет. Исход зависит от типа клеток, силы и длительности воздействия и от других сигнальных путей.","Отклонения в обе стороны связаны с болезнями. У мышей без PERK и у людей с мутациями её гена секреторные β-клетки поджелудочной железы не снижают синтез белка в ответ на стресс ЭПР, и уже в раннем возрасте развивается сахарный диабет. С диабетом связывают и мутацию, нарушающую CReP: β-клетки без CReP при постоянно повышенном фосфорилировании eIF2α легче вступают в апоптоз. Нормальной работе β-клеток нужен ответ, соответствующий нарушению, а не максимальный или нулевой."],"trap":["Длительный ISR всегда приводит клетку к гибели, а CHOP — однозначный признак уже погибшей клетки.","ISR прежде всего обеспечивает адаптацию. При длительном неустранённом нарушении вклад механизмов, способствующих гибели, возрастает, но исход зависит от клетки, силы и длительности воздействия; CHOP — регулятор, а не показатель завершённого апоптоза."],"conditions":"Схема механизма, качественные состояния «раньше / позже»; обобщение по обзорам Costa-Mattioli 2020, Wek 2023, Ryoo 2024 (полные тексты) и Acosta-Alvear 2025. Количественный прогноз выживаемости и время начала апоптоза не задаются: они различаются для разных клеток и воздействий. Примеры с PERK и CReP — мыши без PERK, больные с синдромом Уолкотта–Раллисона и наблюдения на β-клетках, описанные в обзоре Costa-Mattioli 2020; выводов о лечении из них не следует.","sources":["Costa2020","Wek2023","Ryoo2024","Acosta2025"],"quiz":{"id":"S10-L05","rev":1,"question":"В клетке длительно повышено содержание CHOP. Достаточно ли этого признака, чтобы утверждать, что клетка уже погибла?","options":[{"id":"S10-L05-2","text":"Нет: CHOP может участвовать в ответе, но исход зависит от дополнительных условий.","correct":true,"feedback":"Роль CHOP зависит от типа клеток и от того, сохраняется ли нарушение; один белок не определяет весь исход."},{"id":"S10-L05-1","text":"Да: образование CHOP само по себе равнозначно завершённому апоптозу.","correct":false,"feedback":"Регуляторный белок и исход клеточного процесса — разные уровни описания; его наличие не устанавливает факт гибели."},{"id":"S10-L05-3","text":"Нет: CHOP регулирует только адаптацию и не может способствовать гибели.","correct":false,"feedback":"Отсутствие однозначного прогноза не означает отсутствия вклада CHOP в механизмы, способствующие гибели."}]},"widget":{"kind":"net","title":"","s":{"title":"Исход ISR зависит от того, сохраняется ли нарушение","status":"Схема механизма · качественные состояния","ctrls":[{"id":"d","type":"group","label":"Вызвавшее ответ нарушение","opts":["Устранено","Сохраняется"]},{"id":"t","type":"group","label":"Этап","opts":["Раньше","Позже"]}],"W":580,"H":390,"NW":340,"NH":370,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"вклад, зависящий от условий","nodes":["жёлтая рамка — работает, повышено","мелкий пунктир — снижено","пунктирная рамка — не действует"]},"zones":[],"mem":[],"nodes":{"dist":{"p":[126,44,230,66],"t":"нарушение: стресс ЭПР\nили недостаток\nаминокислот","n":[86,38,160,62],"fs":15,"tn":"стресс ЭПР\nили недостаток\nаминокислот"},"p":{"p":[110,142,130,44],"t":"eIF2(αP)","n":[66,124,110,40],"fs":17},"tr":{"p":[430,40,160,52],"t":"общая\nтрансляция","n":[262,40,130,50],"fs":16},"atf4":{"p":[430,142,100,42],"t":"ATF4","n":[262,124,90,38],"fs":17},"ad":{"p":[110,256,170,66],"t":"гены синтеза\nи переноса\nаминокислот","n":[62,226,116,62],"fs":15},"gadd":{"p":[290,252,126,42],"t":"GADD34","n":[180,222,92,38],"fs":16},"chop":{"p":[450,252,116,42],"t":"CHOP","n":[286,222,92,38],"fs":16},"adapt":{"p":[120,352,190,50],"t":"адаптация,\nвосстановление","n":[72,330,136,50],"fs":16},"death":{"p":[450,352,190,50],"t":"гибель клетки\nвозможна","n":[268,330,132,50],"fs":16}},"edges":{"d1":{"a":"dist","b":"p","k":"act"},"i1":{"a":"p","b":"tr","k":"inh"},"a1":{"a":"p","b":"atf4","k":"act"},"a2":{"a":"atf4","b":"ad","k":"act"},"a3":{"a":"atf4","b":"gadd","k":"act"},"a4":{"a":"atf4","b":"chop","k":"act"},"fb":{"a":"gadd","b":"p","k":"inh"},"o1":{"a":"ad","b":"adapt","k":"act"},"o2":{"a":"chop","b":"death","k":"act","t":"вклад зависит\nот условий","tn":"зависит\nот условий","d":[-12,0],"dn":[-8,0],"dash":true,"anc":"end"}},"st":{"0-0":{"n":{"dist":"on","p":"on","tr":"low","atf4":"on","ad":"on","gadd":"base","chop":"base","adapt":"base","death":"base"},"e":{"o2":"off","fb":"off"},"m":[["eIF2(αP)","повышена"],["CHOP","начинает накапливаться"],["Исход","ещё не определён"]],"note":"Раньше: нарушение действует, доля eIF2(αP) повышена, общая трансляция снижена, синтез ATF4 усилен. ATF4 усиливает транскрипцию генов синтеза и переноса аминокислот, GADD34 и CHOP."},"0-1":{"n":{"dist":"off","p":"off","tr":"on","atf4":"low","ad":"base","gadd":"on","chop":"low","adapt":"on","death":"off"},"e":{"d1":"off","i1":"off","o2":"off"},"m":[["eIF2(αP)","возвращается к исходной"],["CHOP","снижается"],["Исход","адаптация"]],"note":"Позже, нарушение устранено: киназы eIF2α больше не активируются, PP1 вместе с CReP и GADD34 дефосфорилирует eIF2α, и трансляция восстанавливается. Образованные ранее белки адаптации остаются, пока не будут разрушены."},"1-0":{"n":{"dist":"on","p":"on","tr":"low","atf4":"on","ad":"on","gadd":"base","chop":"base","adapt":"base","death":"base"},"e":{"o2":"off","fb":"off"},"m":[["eIF2(αP)","повышена"],["CHOP","начинает накапливаться"],["Исход","ещё не определён"]],"note":"Раньше: нарушение действует, доля eIF2(αP) повышена, общая трансляция снижена, синтез ATF4 усилен. ATF4 усиливает транскрипцию генов синтеза и переноса аминокислот, GADD34 и CHOP."},"1-1":{"n":{"dist":"on","p":"on","tr":"low","atf4":"on","ad":"on","gadd":"on","chop":"on","adapt":"base","death":"base"},"m":[["eIF2(αP)","остаётся повышенной"],["CHOP","повышен длительно"],["Исход","зависит от клетки и силы воздействия"]],"note":"Позже, нарушение сохраняется: ответ продолжается, GADD34 частично возобновляет синтез белка, CHOP накапливается. При длительном неустранённом нарушении растёт вклад механизмов, способствующих гибели, но одного признака — содержания CHOP — недостаточно, чтобы предсказать исход."}},"fs":17,"nfs":14,"lfs":15,"zfs":16,"nlfs":13}}},{"id":"isr-inputs","number":6,"section":0,"title":"Почему отсутствие PERK не устраняет все пути ISR","question":1,"questions":[1],"keywords":["PERK","EIF2AK3","PKR","HRI","OMA1","DELE1","митохондрии","синдром Уолкотта–Раллисона","генетическое сравнение","нокаут","входы ISR"],"lead":["Отсутствие одной киназы eIF2α выключает лишь один вход ISR. Другие киназы по-прежнему фосфорилируют тот же Ser51, если активирован их собственный сигнал."],"mechanism":["[[T16|PERK]] передаёт к eIF2α сигнал о нарушении сворачивания белков в ЭПР; без PERK этот вход нарушен.","[[T15|GCN2]], [[T17|PKR]] и [[T18|HRI]] фосфорилируют eIF2α независимо от PERK, когда активированы своими сигналами.","При нарушении работы митохондрий протеаза OMA1 расщепляет белок DELE1; фрагмент DELE1 выходит в цитозоль, связывается с HRI и активирует её."],"paragraphs":["Четыре киназы eIF2α воспринимают разные сигналы, но действуют на общий субстрат. Поэтому выключение одной киназы — не то же самое, что выключение ISR. В клетках мыши без PERK накопление неправильно свёрнутых белков в ЭПР не вызывало фосфорилирования eIF2α, синтез белка оставался высоким, а клетки хуже переживали стресс ЭПР (Harding 2000). Если же в клетках без PERK активировать PKR двухцепочечной РНК, PKR фосфорилирует eIF2α, и дальнейшие события — подавление eIF2B, снижение общей трансляции и синтез ATF4 — развиваются так же, как при активации PERK.","Такое сравнение называют генетическим: клетки, различающиеся одним геном, подвергают отдельным воздействиям и определяют один и тот же показатель — фосфорилирование eIF2α. Вывод корректен, если остальные киназы и сам eIF2α сохранены, а каждое воздействие активирует известную киназу. На схеме сопоставлены исходные клетки и клетки без PERK при трёх воздействиях.","Значение отдельного входа видно и у человека. Мутации гена EIF2AK3, кодирующего PERK, вызывают синдром Уолкотта–Раллисона — редкое аутосомно-рецессивное заболевание, при котором сахарный диабет развивается в первые месяцы жизни, а позже появляются нарушения развития скелета (Delépine 2000). Синдром связывают с утратой именно PERK-зависимого входа в секреторных клетках, прежде всего в β-клетках поджелудочной железы, а не с утратой всех стрессовых ответов.","Перечень входов ISR не ограничен каноническими сигналами. Guo и соавт. (2020) показали на клетках человека, что при нарушении работы митохондрий митохондриальная протеаза OMA1 расщепляет белок DELE1, связанный с внутренней мембраной. Фрагмент DELE1 накапливается в цитозоле, связывается с HRI и активирует её, а HRI фосфорилирует eIF2α. Так состояние митохондрий (семинар 9) влияет на трансляцию в цитозоле. Этот путь не следует отождествлять с ответами, которые регулируют сворачивание белков внутри самих митохондрий."],"trap":["HRI отвечает только на недостаток гема, поэтому нарушение работы митохондрий на ISR не влияет.","HRI активируется и другими воздействиями. При нарушении работы митохондрий OMA1 расщепляет DELE1, фрагмент DELE1 в цитозоле связывается с HRI и активирует её, и eIF2α фосфорилируется без участия PERK."],"conditions":"Схема генетического сравнения, качественные состояния; клетки млекопитающих, в которых остальные киназы и eIF2α сохранены; каждое воздействие задано как активирующее известную киназу (двухцепочечная РНК — PKR). Harding 2000 — эмбриональные клетки мыши с мутацией гена PERK, туникамицин (прочитана аннотация). Guo 2020 — клетки человека, нарушение работы митохондрий, скрининг CRISPRi (прочитана аннотация); обзор Wek 2023 — полный текст. Delépine 2000 — две семьи с синдромом Уолкотта–Раллисона, мутации EIF2AK3 (прочитана аннотация); выводов о лечении не делается.","sources":["Costa2020","Harding2000","Guo2020","Delepine2000"],"quiz":{"id":"S10-L06","rev":1,"question":"В клетках отсутствует PERK, но PKR и eIF2α сохранены. Воздействие двухцепочечной РНК активировало PKR. Может ли при этих условиях повыситься фосфорилирование eIF2α?","options":[{"id":"S10-L06-1","text":"Нет: фосфорилировать eIF2α способна только PERK.","correct":false,"feedback":"PERK — одна из четырёх киназ этого субстрата; PKR создаёт независимый вход."},{"id":"S10-L06-2","text":"Нет: PKR может действовать на eIF2α только через предварительную активацию PERK.","correct":false,"feedback":"PKR сама является киназой eIF2α; PERK не является обязательным промежуточным звеном этого пути."},{"id":"S10-L06-3","text":"Да: активная PKR может фосфорилировать сохранённый eIF2α.","correct":true,"feedback":"Потеря одной киназы не устраняет путь от другой активной киназы к общему субстрату."}]},"widget":{"kind":"net","title":"","s":{"title":"Отсутствие PERK выключает только один вход ISR","status":"Схема генетического сравнения · качественные состояния","ctrls":[{"id":"g","type":"group","label":"Клетки","opts":["Исходные","Без PERK"]},{"id":"i","type":"group","label":"Воздействие","opts":["Нарушение сворачивания в ЭПР","Двухцепочечная РНК","Нарушение работы митохондрий"]}],"W":560,"H":416,"NW":340,"NH":436,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"выход фрагмента белка в цитозоль","rx":"протеолитическое расщепление","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно","пунктирная рамка — неактивно","× — белка нет","P — фосфорилирован Ser51"]},"zones":[{"x":4,"y":4,"w":552,"h":412,"c":"cyto","t":"цитозоль","lx":14,"ly":406,"n":[4,4,332,432,12,426]},{"x":352,"y":10,"w":198,"h":112,"c":"mito","t":"митохондрия","lx":362,"ly":112,"n":[198,8,134,150,206,26],"a":"start"}],"mem":[],"nodes":{"er":{"p":[96,50,172,52],"t":"нарушение\nсворачивания в ЭПР","n":[58,40,104,62],"fs":15,"tn":"нарушение\nсворачи-\nвания в ЭПР"},"ds":{"p":[248,50,140,52],"t":"двухцепочечная\nРНК","n":[150,116,96,50],"fs":15,"tn":"двухцепо-\nчечная РНК"},"oma1":{"p":[400,64,76,38],"t":"OMA1","n":[264,58,84,34],"fs":16},"dele1":{"p":[500,64,76,38],"t":"DELE1","n":[264,118,84,34],"fs":16},"perk":{"p":[88,190,110,42],"t":"PERK","n":[58,210,92,38],"fs":17},"pkr":{"p":[248,190,110,42],"t":"PKR","n":[152,210,78,38],"fs":17},"hri":{"p":[480,190,110,42],"t":"HRI","n":[270,210,84,38],"fs":17},"eif2":{"p":[280,296,180,44],"t":"eIF2α · Ser51","n":[170,306,170,40],"fs":17},"out":{"p":[280,376,220,52],"t":"подавление eIF2B,\nсинтез ATF4","n":[170,386,200,50],"fs":15}},"edges":{"i1":{"a":"er","b":"perk","k":"act"},"i2":{"a":"ds","b":"pkr","k":"act"},"cut":{"a":"oma1","b":"dele1","k":"rx","t":"расщепление","d":[0,-30],"dn":[-14,0],"anc":"middle"},"exp":{"a":"dele1","b":"hri","k":"tr"},"p1":{"a":"perk","b":"eif2","k":"phos","pm":0.55},"p2":{"a":"pkr","b":"eif2","k":"phos","pm":0.55},"p3":{"a":"hri","b":"eif2","k":"phos","pm":0.55},"o":{"a":"eif2","b":"out","k":"act"}},"st":{"0-0":{"n":{"er":"on","ds":"base","oma1":"base","dele1":"base","pkr":"base","hri":"base","perk":"on","eif2":"on","out":"on"},"e":{"i1":"on","i2":"off","cut":"off","exp":"off","p1":"on","p2":"off","p3":"off","o":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Киназа, связанная с воздействием","PERK"],["Фосфорилирование eIF2α","повышено"]],"note":"Исходные клетки, стресс ЭПР: PERK активируется и фосфорилирует Ser51 eIF2α."},"0-1":{"n":{"er":"base","ds":"on","oma1":"base","dele1":"base","pkr":"on","hri":"base","perk":"base","eif2":"on","out":"on"},"e":{"i1":"off","i2":"on","cut":"off","exp":"off","p1":"off","p2":"on","p3":"off","o":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Киназа, связанная с воздействием","PKR"],["Фосфорилирование eIF2α","повышено"]],"note":"Исходные клетки, двухцепочечная РНК: PKR активируется и фосфорилирует Ser51 eIF2α."},"0-2":{"n":{"er":"base","ds":"base","oma1":"on","dele1":"on","pkr":"base","hri":"on","perk":"base","eif2":"on","out":"on"},"e":{"i1":"off","i2":"off","cut":"on","exp":"on","p1":"off","p2":"off","p3":"on","o":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Киназа, связанная с воздействием","HRI"],["Фосфорилирование eIF2α","повышено"]],"note":"Исходные клетки, нарушение работы митохондрий: OMA1 расщепляет DELE1, фрагмент DELE1 в цитозоле связывается с HRI и активирует её; HRI фосфорилирует eIF2α."},"1-0":{"n":{"er":"on","ds":"base","oma1":"base","dele1":"base","pkr":"base","hri":"base","perk":"abs","eif2":"base","out":"base"},"e":{"i1":"on","i2":"off","cut":"off","exp":"off","p1":"off","p2":"off","p3":"off","o":"off"},"b":{},"m":[["Киназа, связанная с воздействием","PERK — отсутствует"],["Фосфорилирование eIF2α","в основном не повышается"]],"note":"Клетки без PERK, стресс ЭПР: вход от ЭПР нарушен, и фосфорилирование eIF2α в ответ на нарушение сворачивания в основном не возникает. Другие киназы этим воздействием канонически не активируются."},"1-1":{"n":{"er":"base","ds":"on","oma1":"base","dele1":"base","pkr":"on","hri":"base","perk":"abs","eif2":"on","out":"on"},"e":{"i1":"off","i2":"on","cut":"off","exp":"off","p1":"off","p2":"on","p3":"off","o":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Киназа, связанная с воздействием","PKR"],["Фосфорилирование eIF2α","повышено"]],"note":"Клетки без PERK, двухцепочечная РНК: PKR сохранена и фосфорилирует eIF2α; отсутствие PERK этот вход не затрагивает."},"1-2":{"n":{"er":"base","ds":"base","oma1":"on","dele1":"on","pkr":"base","hri":"on","perk":"abs","eif2":"on","out":"on"},"e":{"i1":"off","i2":"off","cut":"on","exp":"on","p1":"off","p2":"off","p3":"on","o":"on"},"b":{"eif2":{"t":"фосфорилирован","at":"r","an":"t"}},"m":[["Киназа, связанная с воздействием","HRI"],["Фосфорилирование eIF2α","повышено"]],"note":"Клетки без PERK, нарушение работы митохондрий: путь OMA1–DELE1–HRI не зависит от PERK, и eIF2α фосфорилируется."}},"notes_svg":[{"t":"фрагмент DELE1\nв цитозоле","x":474,"y":136,"a":"end","n":[222,170],"tn":"фрагмент\nDELE1","fs":15}],"fs":17,"nfs":14,"lfs":15,"zfs":16,"nlfs":13}}},{"id":"isr-measure","number":7,"section":0,"title":"Как различить фосфорилирование eIF2α и изменение трансляции","question":1,"questions":[1],"keywords":["иммуноблот","p-eIF2α","мечение новосинтезируемых белков","пуромицин","метионин","репортёр","люцифераза","полисомное профилирование","рибосомное профилирование","Ribo-seq","ISRIB","методы"],"lead":["Фосфорилирование eIF2α, общий синтез белка и трансляция мРНК ATF4 — три разные величины. Каждую измеряют своим методом, и по одной из них нельзя заключить о другой."],"mechanism":["Иммуноблот показывает содержание определённой формы белка — eIF2α с фосфорилированным Ser51 — в сравнении с общим eIF2α.","Кратковременное мечение новосинтезируемых белков характеризует общий синтез белка за выбранный интервал.","Репортёр с 5′-областью мРНК ATF4, полисомное и рибосомное профилирование показывают изменение трансляции определённых мРНК, если количество этих мРНК проконтролировано."],"paragraphs":[{"h":"Фосфорилирование и общий синтез белка"},"Фосфорилирование eIF2α определяют иммуноблотом. Белки клеточного лизата разделяют по размеру, переносят на мембрану и выявляют антителами к eIF2α с фосфорилированным Ser51 и к общему eIF2α. Сравнение двух сигналов при одинаковой загрузке показывает, как изменилась доля [[T08|eIF2(αP)]]; абсолютную долю без калибровки так не определить, а о скорости трансляции блот прямо не говорит. Общий синтез белка оценивают кратковременным мечением: клетки на короткое время переносят в среду с меченым метионином (радиоактивным или его химическим аналогом), затем определяют метку в белковой фракции. Метка отражает синтез за выбранный интервал, а не всё накопленное количество белка.",{"h":"Трансляция отдельных мРНК"},"Репортёрная конструкция содержит 5′-область мРНК ATF4 перед последовательностью легко измеряемого белка, например люциферазы. Сигнал репортёра сравнивают при одинаковом количестве репортёрной мРНК и с вариантами, в которых изменён старт-кодон одной из uORF. Полисомное профилирование разделяет в градиенте плотности сахарозы свободные субъединицы, мРНК с одной рибосомой и полисомы — мРНК с несколькими рибосомами. При подавлении инициации доля полисом уменьшается. Рибосомное профилирование (Ribo-seq) устроено иначе: рибосома защищает от нуклеазы участок мРНК около 30 нуклеотидов, защищённые фрагменты секвенируют и по их положению видят, какие рамки транслируются — uORF или основная рамка.",{"h":"Пример: действие ISRIB"},"При умеренном ISR [[T23|ISRIB]] восстанавливает общий синтез белка и снижает избирательный синтез ATF4, хотя сигнал фосфорилированного eIF2α на иммуноблоте почти не меняется. Это не противоречие: ISRIB связывается с eIF2B и уменьшает его чувствительность к eIF2(αP), а не действует на киназы или фосфатазы. При высокой доле eIF2(αP) эффект ISRIB пропадает (Rabouw 2019). Поэтому образцы «контроль», «стресс» и «стресс + ISRIB» сравнивают при одном сроке воздействия и одним набором методов."],"trap":["Полисомное профилирование и рибосомное профилирование — два названия одного метода.","Полисомное профилирование разделяет мРНК по числу связанных рибосом в градиенте плотности. Рибосомное профилирование определяет секвенированием положение защищённых рибосомой фрагментов на мРНК и поэтому показывает, транслируется ли uORF или основная рамка."],"conditions":"Схемы принципов методов и учебные рисунки сигналов — не данные эксперимента. Образцы «контроль», «стресс» и «стресс + ISRIB» сравниваются при одном сроке; общий eIF2α и загрузка считаются неизменными, сигналы — в линейном диапазоне регистрации. Действие ISRIB — обзор Wek 2023 (полный текст), Rabouw 2019 (клеточные линии; прочитана аннотация), Schoof 2021 (тематические фрагменты); репортёр с 5′-областью ATF4 — Vattem и Wek 2004 (прочитана аннотация). Длина защищённого рибосомой фрагмента (около 30 нуклеотидов) приведена как типичная для метода.","sources":["Wek2023","Rabouw2019","Schoof2021","Vattem2004"],"quiz":{"id":"S10-L07","rev":1,"question":"При умеренном ISR добавление ISRIB восстановило общую трансляцию, а сигнал p-eIF2α на иммуноблоте существенно не изменился. Какое объяснение согласуется с механизмом действия ISRIB?","options":[{"id":"S10-L07-2","text":"ISRIB непосредственно удалил фосфат с каждой молекулы eIF2α.","correct":false,"feedback":"Такой механизм не согласуется ни с мишенью ISRIB, ни с сохранённым сигналом p-eIF2α."},{"id":"S10-L07-1","text":"ISRIB ослабил подавление eIF2B, не изменив фосфорилирования eIF2α.","correct":true,"feedback":"ISRIB действует на eIF2B; его эффект не равнозначен дефосфорилированию eIF2α."},{"id":"S10-L07-3","text":"Иммуноблот p-eIF2α непосредственно измерил скорость синтеза всех белков.","correct":false,"feedback":"Блот определяет фосфорилированную форму; общую трансляцию регистрируют отдельно."}]},"widget":{"kind":"meth_s1","title":"","s":{"title":"Какую величину регистрирует каждый метод","status":"Схемы принципов методов · учебные рисунки, не данные эксперимента","opts_label":"Метод","opts":["Иммуноблот","Мечение новых белков","Репортёр с 5′-областью ATF4","Полисомное профилирование","Рибосомное профилирование"],"steps_h":"Этапы","cap":"учебный рисунок","heads":["Что измеряется","Контроль","Предел вывода"],"fixed":"Все образцы сравниваются при одном сроке воздействия. Интенсивности и высоты на рисунках условные.","cards":[{"steps":["лизат\nклеток","разделение\nпо размеру","перенос,\nантитела","сигнал\nформы белка"],"pic":{"kind":"blot","h":"Сигналы на иммуноблоте","lanes":["контроль","стресс","стресс\n+ ISRIB"],"rows":[["p-eIF2α\n(Ser51)",[0.1,0.85,0.8]],["общий\neIF2α",[0.75,0.75,0.75]],["контроль\nзагрузки",[0.75,0.75,0.75]]]},"v":["Содержание eIF2α с фосфорилированным Ser51 относительно общего eIF2α.","Общий eIF2α, контроль загрузки, линейный диапазон сигнала, специфичность антитела к фосфоформе.","Сигнал не равен скорости трансляции и без калибровки не даёт абсолютной доли."],"note":"При стрессе сигнал p-eIF2α усилен, общий eIF2α не изменился. ISRIB фосфорилирование eIF2α почти не меняет: по этим сигналам действие ISRIB не определить."},{"steps":["клетки\nв среде","импульс\nметки","метка\nв белках","синтез\nза интервал"],"pic":{"kind":"bars","h":"Включение метки в белки","lanes":["контроль","стресс","стресс\n+ ISRIB"],"vals":[1.0,0.35,0.85],"axis":"включение\nметки,\nусл. ед."},"v":["Синтез белка за время импульса метки.","Одинаковая длительность импульса, одинаковые число клеток или количество белка, доступность метки.","Не показывает весь накопленный белок и не говорит, какая мРНК транслируется."],"note":"При стрессе включение метки снижено. При умеренном ISR ISRIB восстанавливает его в значительной степени, хотя фосфорилирование eIF2α сохраняется."},{"steps":["5′-область\nATF4","репортёрная\nмРНК","репортёр-\nный белок","сигнал\nи мРНК"],"pic":{"kind":"reporter","h":"Конструкция и сигнал репортёра","u1":"uORF1","u2":"uORF2","rep":"люцифераза","lanes":["контроль","стресс"],"rows":[["исходная\n5′-область",[0.15,0.8]],["старт uORF2\nизменён",[0.85,0.9]]]},"v":["Влияние 5′-области ATF4 на трансляцию при неизменной кодирующей части.","Количество репортёрной мРНК; вариант с изменённым старт-кодоном uORF; независимый внутренний репортёр.","Сигнал зависит и от стабильности репортёрных мРНК и белка; это не эндогенный ATF4."],"note":"С исходной 5′-областью сигнал низкий в контроле и растёт при стрессе. Если старт-кодон uORF2 изменён, сигнал высок и без стресса: uORF2 подавляет трансляцию основной рамки."},{"steps":["комплексы\nмРНК\nс рибосомами","градиент\nсахарозы","фракции\nи профиль","мРНК\nпо фракциям"],"pic":{"kind":"poly","h":"Профиль поглощения фракций","axis":"оптич.\nплотность,\nусл. ед.","lines":[{"c":"b","pk":[[0.12,0.25,0.03],[0.22,0.3,0.03],[0.34,0.55,0.04],[0.5,0.45,0.05],[0.64,0.4,0.05],[0.78,0.33,0.05],[0.9,0.25,0.05]]},{"c":"r","dash":true,"pk":[[0.12,0.3,0.03],[0.22,0.35,0.03],[0.34,0.95,0.04],[0.5,0.25,0.05],[0.64,0.18,0.05],[0.78,0.12,0.05],[0.9,0.08,0.05]]}],"marks":[[0.1,"40S, 60S"],[0.36,"80S"],[0.75,"полисомы →"]],"legend":["контроль","стресс: инициация подавлена"]},"v":["Распределение рибосом и отдельных мРНК между лёгкими фракциями и полисомами.","Одинаковая подготовка образцов; подписанные фракции 40S, 60S, 80S и полисом.","Больше рибосом на мРНК не всегда означает более быстрый синтез: возможна задержка элонгации."],"note":"При подавлении инициации пик 80S растёт, а полисом становится меньше. Распределение конкретной мРНК (например, ATF4) определяют в каждой фракции отдельно."},{"steps":["рибосомы\nна мРНК","нуклеаза,\nфрагменты","секвени-\nрование","положение\nна мРНК"],"pic":{"kind":"riboseq","h":"Защищённые фрагменты на мРНК ATF4","u1":"uORF1","u2":"uORF2","atf4":"ATF4","map":{"u1":[0.05,0.15],"u2":[0.27,0.5],"atf4":[0.4,1.0]},"rows":[["контроль",[[0.08,0.6],[0.12,0.5],[0.3,0.9],[0.36,0.8],[0.43,0.7],[0.62,0.15],[0.84,0.1]]],["стресс",[[0.08,0.6],[0.12,0.5],[0.3,0.3],[0.43,0.3],[0.55,0.8],[0.68,0.7],[0.82,0.75],[0.94,0.6]]]]},"v":["Положение защищённых рибосомой фрагментов на uORF и основных рамках.","Анализ количества мРНК в тех же образцах; достаточное покрытие.","Не синоним полисомного анализа; плотность фрагментов зависит и от инициации, и от скорости движения рибосом."],"note":"В контроле на мРНК ATF4 много фрагментов на uORF2 и мало на основной рамке; при стрессе фрагменты смещаются на рамку ATF4."}]}}},{"id":"upr","number":8,"section":1,"title":"Когда нагрузка на ЭПР превышает возможности сворачивания белков","question":2,"questions":[2],"keywords":["UPR","стресс ЭПР","белковая нагрузка","ёмкость ЭПР","BiP","GRP78","HSPA5","шапероны","дисульфидные связи","Ca²⁺","протеостаз","сенсоры UPR"],"lead":["[[T03|Эндоплазматический ретикулум]] (ЭПР) обрабатывает секреторные и многие мембранные белки. Стресс ЭПР возникает, когда [[T04|белковая нагрузка]] превышает [[T05|функциональную ёмкость ЭПР]].","Это несоответствие воспринимают три сенсора — PERK, IRE1α и ATF6, а [[T02|ответ на неправильно свёрнутые белки]] (UPR) восстанавливает соответствие с двух сторон."],"mechanism":["Новые секреторные и мембранные полипептиды переносятся в ЭПР, где шапероны, ферменты образования дисульфидных связей и Ca²⁺-зависимые белки обеспечивают их сворачивание.","Если поступление белков растёт или возможности сворачивания снижаются, в просвете ЭПР накапливаются неправильно свёрнутые белки — это и есть стресс ЭПР.","Шаперон [[T24|BiP]] участвует в регуляции сенсоров UPR, но не является единственным механизмом их активации: неправильно свёрнутые белки и состояние мембраны тоже влияют на сенсоры."],"paragraphs":["Почти все секреторные белки и большинство мембранных белков синтезируются рибосомами, связанными с мембраной ЭПР, и уже во время синтеза переносятся в его просвет. Здесь полипептид приобретает нативную структуру: его связывают шапероны, в том числе BiP, ферменты образуют дисульфидные связи, присоединяются олигосахариды, а белки, зависимые от Ca²⁺, работают при высокой концентрации этого иона в просвете ЭПР. Только правильно свёрнутые и собранные белки покидают ЭПР в транспортных пузырьках.","Белковой нагрузкой называют поступление белков, которые должны пройти эту обработку. Функциональная ёмкость ЭПР — совокупные возможности сворачивания, сборки и удаления дефектных молекул в данных условиях. Стресс ЭПР возникает при несоответствии двух величин, а не при росте одной из них: нагрузка может превысить ёмкость, если синтез белка усилен, например в плазматической клетке, или если ёмкость снижена — при нарушении работы шаперонов, условий образования дисульфидных связей или при уменьшении содержания Ca²⁺ в ЭПР.","У млекопитающих несоответствие воспринимают три трансмембранных белка ЭПР: PERK, IRE1α и ATF6. По классической модели BiP связан с их люминальными доменами и при накоплении неправильно свёрнутых белков переходит к ним, освобождая сенсоры. Эта модель неполна: развёрнутые участки белков могут непосредственно связываться с люминальными доменами IRE1α и, по сходству строения, PERK, а IRE1α и PERK реагируют также на изменение липидного состава мембраны ЭПР.","Поэтому стресс ЭПР и UPR различают: первое — отклонение от нормального состояния, второе — ответ на него, один из механизмов [[T06|протеостаза]] — согласования синтеза, сворачивания, транспорта и удаления белков. UPR уменьшает поступление новых белков, увеличивает ёмкость ЭПР и ускоряет удаление дефектных молекул; следующие шаги разбирают, какая ветвь что изменяет."],"trap":["Стресс ЭПР возникает только тогда, когда клетка синтезирует больше белка.","Важно соотношение нагрузки и ёмкости. При прежнем синтезе стресс ЭПР развивается, если снижены возможности сворачивания, например при нарушении работы шаперонов или потере Ca²⁺ из ЭПР."],"conditions":"Схема механизма для клеток млекопитающих; нагрузка и ёмкость показаны как качественные состояния, а не как измеряемые величины с общей шкалой. Модели активации сенсоров (связывание BiP, непосредственное связывание развёрнутых белков, влияние липидного состава мембраны) изложены по обзорам Acosta-Alvear 2025 и Wiseman 2022; на схеме все три сенсора активируются одновременно — это упрощение, их чувствительность и кинетика в клетках различаются.","sources":["Acosta2025","Wiseman2022"],"quiz":{"id":"S10-L08","rev":1,"question":"Скорость поступления новых белков в ЭПР не изменилась, но работа шаперонов нарушилась. Может ли при этом возникнуть стресс ЭПР?","options":[{"id":"S10-L08-2","text":"Да: прежняя нагрузка может превысить снизившиеся возможности сворачивания.","correct":true,"feedback":"Важны обе стороны соотношения: поступление белков и способность ЭПР обработать их."},{"id":"S10-L08-1","text":"Нет: при неизменном поступлении белков нагрузка всегда соответствует возможностям ЭПР.","correct":false,"feedback":"При прежнем поступлении белков возможности их обработки могут уменьшиться; сравнивать нужно обе стороны соотношения."},{"id":"S10-L08-3","text":"Нет: уменьшение числа функциональных шаперонов само по себе снижает поступление белков в той же степени.","correct":false,"feedback":"Автоматического равного уменьшения поступления из условия не следует; в вопросе скорость поступления прямо зафиксирована."}]},"widget":{"kind":"net","title":"","s":{"title":"Белковая нагрузка и ёмкость ЭПР","status":"Схема механизма · качественные состояния","ctrls":[{"id":"a","type":"group","label":"Поступление белков в ЭПР","opts":["Исходное","Повышенное"]},{"id":"c","type":"group","label":"Возможности сворачивания","opts":["Сохранены","Снижены"]}],"W":560,"H":380,"NW":340,"NH":430,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"активация сенсоров неправильно свёрнутыми белками (непосредственно или через BiP)","nodes":["жёлтая рамка — процесс усилен или сенсор активен","пунктирная рамка — снижено или накопления нет"]},"zones":[{"x":6,"y":6,"w":548,"h":96,"c":"cyto","t":"цитозоль","lx":546,"ly":28,"n":[4,4,332,92,330,22],"a":"end"},{"x":6,"y":134,"w":548,"h":240,"c":"er","t":"просвет ЭПР","lx":14,"ly":362,"n":[4,120,332,302,10,412]}],"mem":[{"x1":6,"y1":118,"x2":554,"y2":118,"t":"мембрана ЭПР","lx":300,"ly":104,"n":[4,106,336,106,0,0],"tn":"","a":"end"}]," on","s3":"on","m":"on","c":"off"},"m":[["Нагрузка и ёмкость","нагрузка превышает ёмкость"],["Сенсоры UPR","активируются"]],"note":"Поступление белков прежнее, но возможности сворачивания снижены (например, при нарушении работы шаперонов или при уменьшении Ca²⁺ в ЭПР). Прежняя нагрузка теперь превышает ёмкость, и UPR активируется."},"1-0":{"n":{"ribo":"on","new":"on","chap":"on","nat":"on","mis":"on","bip":"base","perk":"on","ire1":"on","atf6":"on"},"e":{"b1":"off","b2":"off","b3":"off","bm":"on","s1":"on","s2":"on","s3":"on","m":"on","c":"on"},"m":[["Нагрузка и ёмкость","нагрузка превышает ёмкость"],["Сенсоры UPR","активируются"]],"note":"Поступление белков выросло, а возможности сворачивания прежние. Неправильно свёрнутые белки накапливаются, связывают BiP и, по современным данным, могут непосредственно взаимодействовать с люминальными доменами IRE1α и PERK; сенсоры UPR активируются."},"1-1":{"n":{"ribo":"on","new":"on","chap":"low","nat":"on","mis":"on","bip":"base","perk":"on","ire1":"on","atf6":"on"},"e":{"b1":"off","b2":"off","b3":"off","bm":"on","s1":"on","s2":"on","s3":"on","m":"on","c":"off"},"m":[["Нагрузка и ёмкость","нагрузка превышает ёмкость"],["Сенсоры UPR","активируются"]],"note":"Нагрузка повышена, а ёмкость снижена: несоответствие максимально, неправильно свёрнутые белки накапливаются, все три сенсора UPR активированы."}},"notes_svg":[{"t":"перенос в ЭПР","x":112,"y":152,"a":"start","fs":15,"n":[6,137],"tn":"перенос\nв ЭПР"}],"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"upr-perk","number":9,"section":1,"title":"Как PERK связывает стресс ЭПР с регуляцией трансляции","question":2,"questions":[2],"keywords":["PERK","EIF2AK3","eIF2α","Ser51","eIF2B","тройной комплекс","трансляция","стресс ЭПР","Perk⁻/⁻","разгрузка ЭПР","синдром Уолкотта–Раллисона"],"lead":["[[T16|PERK]] — ветвь UPR, которая связывает состояние просвета ЭПР с регуляцией трансляции в цитозоле.","Фосфорилируя eIF2α, PERK уменьшает общую инициацию трансляции, и в ЭПР поступает меньше новых белков."],"mechanism":["PERK пересекает мембрану ЭПР: люминальный домен воспринимает нарушение сворачивания белков в просвете, а киназный домен находится в цитозоле.","Активированная PERK фосфорилирует Ser51 [[T08|eIF2α]]; обменная активность [[T09|eIF2B]] снижается, и тройного комплекса для инициации становится меньше.","Общая трансляция замедляется, поэтому в ЭПР поступает меньше новых полипептидов, и нагрузка на ЭПР уменьшается."],"paragraphs":["PERK — трансмембранная киназа ЭПР. Её люминальный домен обращён в просвет ЭПР и сходен с люминальным доменом IRE1α; киназный домен расположен в цитозоле и сходен с доменами других киназ eIF2α — PKR и HRI. При накоплении неправильно свёрнутых белков молекулы PERK объединяются в олигомеры и фосфорилируют друг друга, после чего киназный домен фосфорилирует субстрат — остаток Ser51 в α-субъединице eIF2.","Дальше PERK использует тот же узел, что и другие киназы интегрированного стрессового ответа: фосфорилированный eIF2 подавляет обменную активность eIF2B, и тройной комплекс eIF2·GTP·Met-тРНКi образуется медленнее (подробно — в шаге «Почему фосфорилирование eIF2α снижает общую трансляцию»). Инициация трансляции на большинстве мРНК замедляется. Поскольку многие из этих мРНК кодируют секреторные и мембранные белки, в ЭПР поступает меньше новых полипептидов, и нагрузка на систему сворачивания снижается.","Это снижение, а не прекращение синтеза белка. Часть мРНК, например мРНК ATF4, при фосфорилировании eIF2α транслируется даже активнее. ATF4 изменяет транскрипцию позже, чем PERK изменяет трансляцию, и определяет следующий этап ответа. Гены шаперонов ЭПР, в том числе BiP, регулируются прежде всего ветвями IRE1α–XBP1s и ATF6, поэтому BiP не следует считать прямой мишенью ATF4 во всех клетках.","Значение этой разгрузки видно в генетическом эксперименте: в клетках мыши с мутацией гена Perk стресс ЭПР не вызывал фосфорилирования eIF2α, синтез белка оставался высоким, стресс ЭПР был сильнее, а выживание клеток ниже. У человека инактивирующие мутации PERK вызывают синдром Уолкотта–Раллисона с неонатальным сахарным диабетом: β-клетки поджелудочной железы особенно зависят от этой регуляции."],"trap":["Активированная PERK останавливает синтез всех белков клетки.","PERK снижает общую инициацию трансляции, но не прекращает её: синтез белка продолжается с меньшей скоростью, а трансляция отдельных мРНК, например мРНК ATF4, даже усиливается."],"conditions":"Схема механизма; ранний канонический ответ на стресс ЭПР в клетках млекопитающих, другие киназы eIF2α в схеме не активированы. Состояния качественные: сила торможения трансляции в разных клетках и при разных воздействиях различается. Эксперимент с Perk: клетки мыши с мутацией гена Perk, стресс ЭПР вызван туникамицином и другими воздействиями; измерены фосфорилирование eIF2α, синтез белка и выживание (Harding 2000, по аннотации). Синдром Уолкотта–Раллисона и роль PERK в β-клетках — по обзору Acosta-Alvear 2025.","sources":["Harding1999","Harding2000","Acosta2025","Wiseman2022"],"quiz":{"id":"S10-L09","rev":1,"question":"Какое раннее изменение непосредственно связано с киназным выходом PERK при стрессе ЭПР?","options":[{"id":"S10-L09-1","text":"Удаление 26-нуклеотидного интрона из мРНК XBP1.","correct":false,"feedback":"Это выход IRE1; PERK непосредственно фосфорилирует eIF2α."},{"id":"S10-L09-3","text":"Повышение p-eIF2α и уменьшение общей инициации трансляции.","correct":true,"feedback":"Так киназный сигнал PERK уменьшает скорость поступления новых белков в систему ЭПР."},{"id":"S10-L09-2","text":"Освобождение N-концевого фрагмента ATF6 в аппарате Гольджи.","correct":false,"feedback":"Это протеолитическая активация другой ветви UPR, а не непосредственный киназный выход PERK."}]},"widget":{"kind":"net","title":"","s":{"title":"PERK уменьшает поступление новых белков в ЭПР","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Состояние ЭПР","opts":["Без стресса","Стресс ЭПР"]},{"id":"k","type":"check","label":"PERK отсутствует (клетки Perk⁻/⁻)"}],"W":560,"H":380,"NW":340,"NH":460,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"активация PERK неправильно свёрнутыми белками","nodes":["жёлтая рамка — активно или усилено","пунктирная рамка — снижено или нет","× — белка нет","P — фосфорилирован Ser51"]},"zones":[{"x":6,"y":6,"w":548,"h":192,"c":"cyto","t":"цитозоль","lx":546,"ly":26,"n":[4,4,332,228,330,22],"a":"end"},{"x":6,"y":230,"w":548,"h":144,"c":"er","t":"просвет ЭПР","lx":546,"ly":362,"n":[4,262,332,196,330,450],"a":"end"}],"mem":[{"x1":6,"y1":214,"x2":554,"y2":214,"t":"мембрана ЭПР","lx":330,"ly":205,"n":[4,246,336,246,0,0],"tn":"","a":"end"}],"nodes":{"perk":{"p":[84,214,120,170],"t":"киназный\nдомен\n\nPERK\n\nлюминальный\nдомен","n":[48,246,82,168],"fs":14,"tn":"киназный\nдомен\n\nPERK\n\nлюмин.\nдомен"},"eif2":{"p":[250,160,96,40],"t":"eIF2α","n":[150,176,86,38],"fs":17},"eif2b":{"p":[250,58,170,50],"t":"eIF2B:\nобмен GDP на GTP","n":[150,70,116,66],"fs":15,"tn":"eIF2B:\nобмен\nGDP на GTP"},"tc":{"p":[430,58,120,50],"t":"тройной\nкомплекс","n":[284,70,94,50],"fs":15},"tl":{"p":[430,160,130,50],"t":"инициация\nтрансляции","n":[284,166,94,50],"fs":15},"new":{"p":[430,304,130,48],"t":"новые\nполипептиды","n":[282,320,100,48],"fs":15},"mis":{"p":[250,300,160,48],"t":"неправильно\nсвёрнутые белки","n":[160,400,150,48],"fs":15,"tn":"неправильно\nсвёрнутые белки"}},"edges":{"p":{"a":"perk","b":"eif2","k":"phos","pm":0.5},"i":{"a":"eif2","b":"eif2b","k":"inh"},"a1":{"a":"eif2b","b":"tc","k":"act"},"a2":{"a":"tc","b":"tl","k":"act"},"tr":{"a":"tl","b":"new","k":"tr"},"q":{"a":"new","b":"mis","k":"seq"},"s":{"a":"mis","b":"perk","k":"act","dash":true}},"st":{"0-0":{"n":{"perk":"base","eif2":"base","eif2b":"on","tc":"on","tl":"on","new":"base","mis":"off"},"e":{"p":"off","s":"hide"},"b":{},"m":[["p-eIF2α","низкое"],["Поступление новых белков в ЭПР","исходное"]],"note":"Без стресса ЭПР PERK неактивна, доля eIF2 с фосфорилированным Ser51 мала, eIF2B возвращает eIF2 в GTP-связанную форму, и новые полипептиды поступают в ЭПР с исходной скоростью."},"0-1":{"n":{"perk":"abs","eif2":"base","eif2b":"on","tc":"on","tl":"on","new":"base","mis":"off"},"e":{"p":"off","s":"hide"},"b":{},"m":[["p-eIF2α","низкое"],["Поступление новых белков в ЭПР","исходное"]],"note":"Без стресса ЭПР отсутствие PERK почти не меняет трансляцию: в этом состоянии PERK и так неактивна."},"1-0":{"n":{"perk":"on","eif2":"on","eif2b":"low","tc":"low","tl":"low","new":"low","mis":"on"},"e":{"p":"on","s":"on"},"b":{"eif2":{"t":"Ser51","at":"r","tn":""}},"m":[["p-eIF2α","повышено"],["Поступление новых белков в ЭПР","снижено, но не прекращено"]],"note":"Неправильно свёрнутые белки активируют PERK; её киназный домен фосфорилирует Ser51 eIF2α. Обменная активность eIF2B снижается, тройного комплекса становится меньше, общая инициация трансляции замедляется, и в ЭПР поступает меньше новых полипептидов."},"1-1":{"n":{"perk":"abs","eif2":"base","eif2b":"on","tc":"on","tl":"on","new":"on","mis":"on"},"e":{"p":"off","s":"off"},"b":{},"m":[["p-eIF2α","не повышается через PERK"],["Поступление новых белков в ЭПР","остаётся высоким"]],"note":"Без PERK стресс ЭПР не вызывает фосфорилирования eIF2α через этот путь. Синтез белка остаётся высоким, новые полипептиды продолжают поступать в перегруженный ЭПР, и стресс ЭПР усиливается (клетки мыши с мутацией Perk, Harding 2000)."}},"notes_svg":[{"t":"поступление в ЭПР","x":418,"y":256,"a":"end","fs":15,"n":[266,280],"tn":"поступление\nв ЭПР"}],"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13,"nzfs":13}}},{"id":"ire1-xbp1","number":10,"section":1,"title":"Как IRE1 и РНК-лигаза образуют мРНК XBP1s","question":2,"questions":[2],"keywords":["IRE1α","ERN1","XBP1","XBP1s","XBP1u","RtcB","RTCB","РНК-лигаза","неканонический сплайсинг","интрон 26 нуклеотидов","рамка считывания","Hac1","HAC1"],"lead":["[[T25|IRE1α]] — трансмембранный белок ЭПР с киназным и эндорибонуклеазным (РНКазным) доменами. При стрессе ЭПР его РНКазный домен вырезает из мРНК XBP1 короткий интрон.","Соединяет части мРНК другой фермент — [[T27|РНК-лигаза RtcB]]; в результате образуется мРНК [[T26|XBP1s]], кодирующая активный транскрипционный фактор."],"mechanism":["При стрессе ЭПР молекулы IRE1α объединяются в олигомеры и фосфорилируют друг друга; при этом активируется их РНКазный домен, обращённый в цитозоль.","РНКазный домен IRE1α расщепляет мРНК XBP1 на границах интрона из 26 нуклеотидов, а РНК-лигаза RtcB соединяет 5′- и 3′-части мРНК.","Удаление 26 нуклеотидов сдвигает рамку считывания в 3′-части мРНК, и вместо белка XBP1u синтезируется XBP1s — транскрипционный фактор с доменом активации."],"paragraphs":["Белок IRE1α кодирует ген ERN1. Его люминальный домен расположен в просвете ЭПР, а киназный и РНКазный домены — в цитозоле. При накоплении неправильно свёрнутых белков молекулы IRE1α образуют олигомеры и фосфорилируют друг друга; в таком состоянии РНКазный домен расщепляет определённые РНК. Главный субстрат — мРНК XBP1. Её доставляет к мембране ЭПР сам транслируемый полипептид XBP1u: гидрофобный участок этого белка распознаётся частицей узнавания сигнала, и мРНК оказывается рядом с IRE1α.","Удаление интрона из мРНК XBP1 называют [[T28|неканоническим сплайсингом]]: оно происходит в цитозоле без сплайсосомы. IRE1α разрезает мРНК в двух местах и освобождает интрон, у большинства позвоночных длиной 26 нуклеотидов. Концы мРНК сближаются, и РНК-лигаза RtcB вместе с кофактором археазой соединяет их. В клетках без RtcB сплайсинг мРНК XBP1 при стрессе ЭПР нарушался, а восстановление активной лигазы его возвращало. IRE1α разрезает мРНК, но не соединяет её части.","Число 26 не кратно трём, поэтому после удаления интрона 3′-часть мРНК читается в другой рамке. Белки XBP1u и XBP1s имеют общий N-концевой bZIP-домен, связывающий ДНК, но разные C-концы. У XBP1s C-конец содержит домен активации транскрипции, и этот белок усиливает экспрессию генов шаперонов, ферментов сворачивания и белков ERAD. XBP1u несёт дегрон, быстро разрушается и может выводить XBP1s и активный ATF6 из ядра, ограничивая ответ.","У почкующихся дрожжей Ire1 — единственный сенсор стресса ЭПР: он вырезает интрон из мРНК HAC1, и белок Hac1 регулирует транскрипцию. Hac1 и XBP1 сходны по строению, но мРНК HAC1 и XBP1 различаются длиной интрона и способами регуляции, поэтому число 26 и детали механизма нельзя переносить с одного организма на другой."],"trap":["IRE1α сам вырезает интрон и сшивает мРНК XBP1, как это делает сплайсосома.","IRE1α только разрезает мРНК. Части мРНК соединяет отдельный фермент — РНК-лигаза RtcB; без неё мРНК XBP1s не образуется, хотя IRE1α активен."],"conditions":"Схема механизма для клеток млекопитающих; этапы показаны последовательно и качественно. Длина интрона 26 нт относится к мРНК XBP1 большинства позвоночных (Acosta-Alvear 2025). Роль RtcB: клетки мыши с выключенным геном Rtcb и эксперименты сплайсинга in vitro (Lu 2014, по аннотации). IRE1 непосредственно расщепляет мРНК XBP1 in vitro; XBP1 необходим для UPR у нематоды Caenorhabditis elegans и для дифференцировки плазматических клеток у мыши (Calfon 2002, по аннотации).","sources":["Acosta2025","Calfon2002","Lu2014"],"quiz":{"id":"S10-L10","rev":1,"question":"Как распределяются функции при образовании мРНК XBP1s у млекопитающих?","options":[{"id":"S10-L10-2","text":"IRE1α выполняет и разрезание мРНК, и соединение экзонов без отдельной лигазы.","correct":false,"feedback":"РНКазный домен выполняет разрезание, а соединение экзонов требует РНК-лигазы RtcB."},{"id":"S10-L10-1","text":"IRE1α расщепляет мРНК, а RtcB соединяет оставшиеся экзоны.","correct":true,"feedback":"Эндорибонуклеазная реакция и лигирование выполняются разными белками."},{"id":"S10-L10-3","text":"Сплайсосома удаляет интрон в ядре без участия IRE1α.","correct":false,"feedback":"Рассматриваемое событие — неканонический сплайсинг, зависящий от IRE1, а не канонический сплайсинг пре-мРНК сплайсосомой."}]},"widget":{"kind":"net","title":"","s":{"title":"IRE1α разрезает мРНК XBP1, RtcB соединяет её части","status":"Схема механизма · последовательные этапы","ctrls":[{"id":"st","type":"group","label":"Этап","opts":["мРНК XBP1u","Разрезы IRE1α","Лигирование RtcB","Белок XBP1s"]},{"id":"r","type":"check","label":"RtcB отсутствует"}],"W":560,"H":310,"NW":340,"NH":320,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"реакция с РНК (разрез, лигирование)","eq":"перенос электронов","bind":"связывание, контакт","seq":"трансляция","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — фермент работает или продукт образован","пунктирная рамка — удалённый интрон","× — белка нет","рамка u и рамка s — разные рамки считывания 3′-части мРНК"]},"zones":[{"x":6,"y":6,"w":548,"h":298,"c":"cyto","t":"цитозоль, у мембраны ЭПР","lx":546,"ly":294,"n":[4,4,332,312,330,306],"a":"end"}],"mem":[],"nodes":{"ire1":{"p":[110,46,170,50],"t":"IRE1α:\nРНКазный домен","n":[84,38,150,50],"fs":15},"rtcb":{"p":[450,46,150,50],"t":"RtcB:\nРНК-лигаза","n":[256,38,140,50],"fs":15},"u1":{"p":[120,146,200,40],"t":"5′-часть мРНК","n":[70,134,126,40],"fs":15,"tn":"5′-часть"},"ui":{"p":[280,146,120,40],"t":"интрон 26 нт","n":[170,134,70,40],"fs":15,"tn":"интрон\n26 нт"},"u2":{"p":[440,146,200,40],"t":"3′-часть: рамка u","n":[282,134,104,40],"fs":15,"tn":"3′-часть:\nрамка u"},"s1":{"p":[180,146,200,40],"t":"5′-часть мРНК","n":[100,134,140,40],"fs":15,"tn":"5′-часть"},"s2":{"p":[380,146,200,40],"t":"3′-часть: рамка s","n":[244,134,140,40],"fs":15,"tn":"3′-часть:\nрамка s"},"pu":{"p":[280,250,500,46],"t":"белок XBP1u: bZIP-домен + C-конец с дегроном","n":[170,250,320,56],"fs":15,"tn":"бе
