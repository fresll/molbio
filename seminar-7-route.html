иквитин присоединяется к белкам, а LC3 — к фосфолипиду; описаны и другие пути липидирования белков ATG8, но в основную схему они не входят.</p><p>Содержание LC3-II определяется соотношением его образования и удаления. LC3-II на наружной мембране аутофагосомы может снова отщепляться от PE протеазой ATG4. LC3-II на внутренней мембране попадает вместе с грузом в аутолизосому и расщепляется. Поэтому одно содержание LC3-II не показывает, усилилось ли образование аутофагосом или замедлилось их удаление; об этом — шаг об <a href="#ns-g-S7-T86">обороте LC3-II</a> и потоке.</p><p>Без функциональной ATG7 система липидирования LC3 не работает: LC3-I сохраняется, а полоса LC3-II на иммуноблоте не появляется. Но утрата ATG7 не означает, что в клетке перестали работать лизосомы или расщепляться белки, доставленные другими путями. ATG7 нужна для конкретной реакции; другие процессы оценивают своими показателями.</p><div class="note trap"><strong>Типичная ошибка</strong> Высокое содержание LC3-II непосредственно равно высокому аутофагическому потоку.<p class="trap-fix">LC3-II может накапливаться и при усиленном образовании, и при замедленном удалении; нужно измерение динамики и условий деградации.</p></div><div class="static-quiz"><h3>В канонической системе отсутствует функциональная ATG7. Какое образование непосредственно нарушается?</h3><ol><li><b>А.</b> Образование липидированной формы LC3-II через соответствующую систему конъюгации. <i>(верный вариант)</i><br><span class="expl">ATG7 необходима для рассматриваемой системы липидирования LC3; это не диагноз всех путей деградации.</span></li><li><b>Б.</b> Образование PI3P при действии киназы VPS34. <i>(неверный вариант)</i><br><span class="expl">VPS34 катализирует другую реакцию; ATG7 не является ферментом образования PI3P.</span></li><li><b>В.</b> Образование LC3-I при протеолитической обработке исходной LC3 белком ATG4. <i>(неверный вариант)</i><br><span class="expl">Начальная протеолитическая обработка LC3 относится к ATG4; её следует отличать от ATG7-зависимой конъюгации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/1873-3468.14742">Noda N. N. Structural view on autophagosome formation. FEBS Lett. 2024;598:84–106. doi:10.1002/1873-3468.14742</a></li><li><a href="https://doi.org/10.1038/s41580-020-0241-0">Nakatogawa H. Mechanisms governing autophagosome biogenesis. Nat Rev Mol Cell Biol. 2020;21:439–458. doi:10.1038/s41580-020-0241-0</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li></ul><p>Основная модель — LC3/ATG8-зависимая каноническая макроаутофагия с PE. Альтернативные пути не объявляются отсутствующими только по генотипу ATG7.</p></details></article><article class="card print-unit" id="ns-fusion-acidity"><div class="eyebrow">Аутофагия и лизосомы · шаг 26 из 32</div><h2>Почему слияние, закисление и гидролиз — разные процессы</h2><p class="lead">Аутофагосома должна доставить материал в лизосомный компартмент. После слияния эффективность гидролиза зависит от условий среды и конкретных ферментов.</p><div class="note"><strong>Что показывает схема.</strong> Аутофагосома и лизосома сливаются при участии SNARE-комплекса STX17–SNAP29–VAMP8 и комплекса HOPS; образуется аутолизосома. V-ATPase поддерживает кислый pH, гидролаза расщепляет субстрат. Нарушение слияния, закисления или отсутствие гидролазы меняют каждое своё звено. Бафиломицин A1 ингибирует V-ATPase; его действие на слияние зависит от условий.</div><ol class="mech"><li><a href="#ns-g-S7-T89">SNARE</a>-белки и другие регуляторы обеспечивают мембранное слияние.</li><li><a href="#ns-g-S7-T44">V-ATPase</a> участвует в поддержании кислого pH лизосомного просвета.</li><li>Кислые <a href="#ns-g-S7-T90">гидролазы</a> расщепляют определённые связи в доставленных субстратах.</li></ol><p>Когда края фагофора замкнулись и мембраны разделились (шаг 24), существует закрытая <a href="#ns-g-S7-T87">аутофагосома</a> — пузырёк с двумя мембранами, внутри которого заключён участок цитоплазмы. Чтобы содержимое расщепилось, наружная мембрана аутофагосомы сливается с мембраной лизосомы. Образуется <a href="#ns-g-S7-T88">аутолизосома</a>: внутренняя мембрана аутофагосомы вместе с грузом оказывается в просвете лизосомы, где её и груз расщепляют лизосомные ферменты.</p><p>Слияние обеспечивают белки SNARE, закреплённые на двух мембранах; их спирали скручиваются в комплекс и стягивают мембраны. На замкнутой аутофагосоме находится синтаксин 17 (STX17), который образует комплекс с SNAP29 и лизосомным VAMP8 (Itakura и соавт., 2012). Сближению мембран способствуют малая ГТФаза RAB7 и связывающий комплекс HOPS — комплекс, удерживающий мембраны рядом и способствующий сборке SNARE. STX17 — не единственный возможный путь: в клетках без STX17 слияние может обеспечивать комплекс с белком YKT6 (Matsui и соавт., 2018).</p><p>Слияние, кислая среда и реакция гидролазы — три разных свойства. Кислый pH лизосомного просвета поддерживает V-ATPase — протонный насос, который за счёт гидролиза ATP переносит протоны в просвет. Кислые гидролазы — протеазы, гликозидазы, липазы и другие ферменты — расщепляют определённые связи в субстратах и лучше работают в кислой среде. Если нет нужной гидролазы, доставленный субстрат не расщепится даже после слияния и при кислом pH. Поэтому нарушение одного свойства нельзя автоматически считать нарушением двух других.</p><p><a href="#ns-g-S7-T91">Бафиломицин A1</a> прежде всего ингибирует V-ATPase. В его присутствии кислотность лизосом и уже образовавшихся аутолизосом не поддерживается, и они перестают быть кислыми; активность кислых гидролаз падает. Действие на слияние зависит от условий. В жировом теле дрозофилы при генетической утрате субъединиц V-ATPase лизосомы не закислялись, но с аутофагосомами сливались; бафиломицин в тех же клетках слияние подавлял, и это действие было связано с другой его мишенью — Ca²⁺-насосом эндоплазматического ретикулума SERCA (Mauvezin и соавт., 2015). Поэтому для каждого эксперимента указывают концентрацию, срок и метод, которым проверено слияние.</p><div class="note trap"><strong>Типичная ошибка</strong> Бафиломицин — только селективный ингибитор слияния, который не меняет pH.<p class="trap-fix">Его основная мишень V-ATPase связана с кислотностью; действие на слияние и другие процессы требует указания условий.</p></div><div class="static-quiz"><h3>В учебной схеме слияние произошло, но выбранная гидролаза отсутствует. Что из этого следует?</h3><ol><li><b>А.</b> Установлен первичный дефект образования аутофагосом через ATG7. <i>(неверный вариант)</i><br><span class="expl">Дефект выбранной гидролазы не устанавливает первичную утрату системы ATG7 и образования аутофагосом.</span></li><li><b>Б.</b> Доставка субстрата не гарантирует его расщепления без нужного фермента. <i>(верный вариант)</i><br><span class="expl">Мембранная доставка и химическое расщепление — разные необходимые звенья для выбранного субстрата.</span></li><li><b>В.</b> Слияние обеспечивает прежнюю скорость расщепления независимо от состава гидролаз. <i>(неверный вариант)</i><br><span class="expl">Слияние объединяет компартменты, но не заменяет каталитического действия нужного фермента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/1873-3468.14742">Noda N. N. Structural view on autophagosome formation. FEBS Lett. 2024;598:84–106. doi:10.1002/1873-3468.14742</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1016/j.cell.2012.11.001">Itakura E., Kishi-Itakura C., Mizushima N. The hairpin-type tail-anchored SNARE syntaxin 17 targets to autophagosomes for fusion with endosomes/lysosomes. Cell. 2012;151:1256–1269. doi:10.1016/j.cell.2012.11.001</a></li><li><a href="https://doi.org/10.1083/jcb.201712058">Matsui T. et al. Autophagosomal YKT6 is required for fusion with lysosomes independently of syntaxin 17. J Cell Biol. 2018;217:2633–2645. doi:10.1083/jcb.201712058</a></li><li><a href="https://doi.org/10.1038/ncomms8007">Mauvezin C., Nagy P., Juhász G., Neufeld T. P. Autophagosome–lysosome fusion is independent of V-ATPase-mediated acidification. Nat Commun. 2015;6:7007. doi:10.1038/ncomms8007</a></li></ul><p>Возможное сохранение слияния при нарушении закисления является условием учебного сравнения, а не обещанием одинакового действия бафиломицина во всех экспериментах.</p></details></article><article class="card print-unit" id="ns-reactivation"><div class="eyebrow">Аутофагия и лизосомы · шаг 27 из 32</div><h2>Как лизосомное расщепление связано с повторной активацией mTORC1</h2><p class="lead">Продукты расщепления могут вновь участвовать в регуляции аминокислотного входа к mTORC1. Повторную активацию, образование новых аутофагосом и восстановление лизосомного пула нужно различать.</p><div class="note"><strong>Что показывает схема.</strong> Четыре фазы: (1) после удаления аминокислот активность mTORC1 снижается, образование аутофагосом усиливается; (2) аутофагосомы сливаются с лизосомами, протеазы освобождают аминокислоты; (3) аминокислоты через лизосомные переносчики и Rag частично восстанавливают mTORC1, образование новых аутофагосом снижается, расщепление в уже образовавшихся аутолизосомах продолжается; (4) из аутолизосом через тубулы и протолизосомы восстанавливается пул лизосом. Блок протеаз лишает модель этого входа; блок выхода продуктов разделяет сигнал из просвета и доступность цитозольных аминокислот, и направление ответа mTORC1 без уточнения системы не задано.</div><ol class="mech"><li>Лизосомные протеазы освобождают аминокислоты из доставленных белков.</li><li>Доступные аминокислоты и их транспорт могут поддержать повторную активацию mTORC1 при остальных разрешающих условиях.</li><li>В описанных системах восстановление действия mTOR связано с образованием тубул и протолизосом из аутолизосом.</li></ol><p>После удаления аминокислот события идут в определённом порядке. Сначала снижается активность mTORC1 и ослабевает торможение запуска аутофагии. Затем образуются аутофагосомы, они сливаются с лизосомами, и лизосомные протеазы расщепляют доставленные белки до аминокислот. Аминокислоты выходят из просвета в цитозоль через переносчики лизосомной мембраны. Если остальные условия разрешающие — есть RHEB–GTP, энергии достаточно, — часть активности mTORC1 восстанавливается.</p><p>Связь продуктов расщепления с mTORC1 идёт через тот же аминокислотный вход. Аргинин в просвете лизосомы связывается с SLC38A9, а SLC38A9 переносит лейцин и другие незаменимые аминокислоты в цитозоль; цитозольные аминокислоты действуют через сенсоры на Rag. По данным Wyant и соавт. (2017), без SLC38A9 клетки хуже используют аминокислоты, освобождённые в лизосомах при расщеплении белка. Аминокислоты не заменяют RHEB, энергию и другие условия: они восстанавливают только свой вход.</p><p>Восстановленный mTORC1 ограничивает образование новых аутофагосом и участвует в восстановлении пула лизосом. <a href="#ns-g-S7-T92">Восстановление лизосомного пула из аутолизосом</a> (autophagic lysosome reformation) описали Yu и соавт. (2010) на клетках NRK (эпителиальная линия почки крысы) в среде без сыворотки и глутамина: из аутолизосом вытягиваются мембранные тубулы, от них отделяются протолизосомы, которые созревают в функциональные лизосомы. Этот процесс отличается от биогенеза лизосом через TFEB: в первом случае лизосомы формируются из уже существующих мембран аутолизосом, во втором — меняется экспрессия генов и синтезируются новые лизосомные белки.</p><p>Какие физические стадии лежат в основе восстановления лизосом? Это не обычное слияние аутофагосом с лизосомами, а образование новых лизосом из мембран уже существующих аутолизосом. По данным обзора Nanayakkara и соавт. (2023), в изученных системах стадий три. Первая — выпячивание: на мембране аутолизосомы локально образуется PI(4,5)P₂, который привлекает адаптерный комплекс AP-2 и клатрин, и мембрана выпячивается в виде почки. Вторая — вытягивание трубочки: двигательный белок KIF5B, привлекаемый тем же PI(4,5)P₂, тянет мембрану вдоль микротрубочек (Du и соавт., 2016), а белок WHAMM запускает на поверхности аутолизосомы локальную полимеризацию актина (Dai и соавт., 2019). Третья — отделение: от конца трубочки отделяется протолизосома; в этом участвуют механизмы мембранного деления, включая динамин 2 (DNM2) (Schulze, McNiven, 2014), и образование PI3P комплексом VPS34–UVRAG (Munson, Ganley, 2015). Затем протолизосомы созревают в функциональные лизосомы. Повторная активация mTORC1 связана с регуляцией этого процесса, но сама мембрану не вытягивает: она влияет на перечисленные белки и липиды. Эффект фосфорилирования UVRAG и последующего образования PI3P на поздних этапах аутофагии зависит от субкомплекса, участка и условий, поэтому единой схемы для всех клеток нет.</p><p>Сроки и роль отдельных аминокислот зависят от системы. В экспериментах Yu и соавт. (2010) активность mTOR снижалась в первые часы и восстанавливалась к 6 ч, а восстановление лизосом продолжалось дольше. Tan и соавт. (2017) изучали лишение аминокислот и показали, что повторная активация mTORC1 зависит от метаболизма глутамина. Kazyken и соавт. (2024) показали участие AMPK при длительном лишении аминокислот. Это три разных эксперимента, и их нельзя объединить в одну кривую; график практикума — результат его собственной учебной модели. Повторная активация не прекращает мгновенно расщепление в уже образовавшихся аутолизосомах.</p><div class="note trap"><strong>Типичная ошибка</strong> Повторная активация mTORC1 означает мгновенное прекращение гидролиза в уже возникших аутолизосомах.<p class="trap-fix">Она может ограничивать образование новых структур и участвовать в восстановлении лизосом; уже доставленный материал не обязан мгновенно перестать расщепляться.</p></div><div class="static-quiz"><h3>В модели повторная активация mTORC1 зависит от аминокислот, освобождённых лизосомными протеазами; внешнее поступление исключено. Протеазы блокированы. Что ожидается для этого входа?</h3><ol><li><b>А.</b> Освобождение аминокислот усиливается и автоматически заменяет все другие входы. <i>(неверный вариант)</i><br><span class="expl">Ингибирование протеаз не усиливает их каталитическое образование аминокислот.</span></li><li><b>Б.</b> Нерасщеплённый белковый груз непосредственно заменяет свободные аминокислоты. <i>(неверный вариант)</i><br><span class="expl">Сенсорная доступность свободных аминокислот не эквивалентна присутствию нерасщеплённого белка.</span></li><li><b>В.</b> Освобождение аминокислот снижается и повторная активация через этот вход ограничивается. <i>(верный вариант)</i><br><span class="expl">Блок гидролиза ограничивает источник продуктов в специально заданной модели.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature09076">Yu L. et al. Termination of autophagy and reformation of lysosomes regulated by mTOR. Nature. 2010;465:942–946. doi:10.1038/nature09076</a></li><li><a href="https://doi.org/10.1038/s41467-017-00369-y">Tan H. W. S., Sim A. Y. L., Long Y. C. Glutamine metabolism regulates autophagy-dependent mTORC1 reactivation during amino acid starvation. Nat Commun. 2017;8:338. doi:10.1038/s41467-017-00369-y</a></li><li><a href="https://doi.org/10.1080/15548627.2024.2355074">Kazyken D. et al. Unexpected roles for AMPK in the suppression of autophagy and the reactivation of MTORC1 signaling during prolonged amino acid deprivation. Autophagy. 2024;20:2017–2040. doi:10.1080/15548627.2024.2355074</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.09.046">Wyant G. A. et al. mTORC1 activator SLC38A9 is required to efflux essential amino acids from lysosomes and use protein as a nutrient. Cell. 2017;171:642–654.e12. doi:10.1016/j.cell.2017.09.046</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1080/15548627.2022.2128019">Nanayakkara R., Gurung R., Rodgers S. J. et al. Autophagic lysosome reformation in health and disease. Autophagy. 2023;19:1378–1395. doi:10.1080/15548627.2022.2128019</a></li><li><a href="https://doi.org/10.1016/j.devcel.2016.04.014">Du W., Su Q. P., Chen Y. et al. Kinesin 1 drives autolysosome tubulation. Dev Cell. 2016;37:326–336. doi:10.1016/j.devcel.2016.04.014</a></li><li><a href="https://doi.org/10.1038/s41467-019-11694-9">Dai A., Yu L., Wang H.-W. WHAMM initiates autolysosome tubulation by promoting actin polymerization on autolysosomes. Nat Commun. 2019;10:3699. doi:10.1038/s41467-019-11694-9</a></li><li><a href="https://doi.org/10.4161/auto.27486">Schulze R. J., McNiven M. A. A well-oiled machine: DNM2/dynamin 2 helps keep hepatocyte lipophagy running smoothly. Autophagy. 2014;10:388–389. doi:10.4161/auto.27486</a></li><li><a href="https://doi.org/10.1080/15548627.2015.1106668">Munson M. J., Ganley I. G. MTOR, PIK3C3, and autophagy: Signaling the beginning from the end. Autophagy. 2015;11:2375–2376. doi:10.1080/15548627.2015.1106668</a></li></ul><p>Задан зависимый от протеолиза вход без альтернативного поступления. Это условная модель, не доказательство одинакового срока и полноты повторной активации во всех системах. Детали ALR (PI(4,5)P₂, AP-2 и клатрин, KIF5B, WHAMM, DNM2) получены главным образом на культивируемых клетках крысы и человека и не равны универсальной схеме.</p></details></article><article class="card print-unit" id="ns-autophagic-flux"><div class="eyebrow">Аутофагия и лизосомы · шаг 28 из 32</div><h2>Как измеряют поток и оборот LC3-II</h2><p class="lead">Одно содержание LC3-II не показывает, сколько материала прошло весь путь до расщепления. Сравнение с ингибитором проводится за одинаковый срок и требует учёта его дополнительных действий.</p><div class="note"><strong>Что показывает схема.</strong> Две культуры из одного исходного состояния собирают в один момент. Без ингибитора запас LC3-II постоянен (образование равно удалению); с ингибитором удаления LC3-II накапливается, и разность за срок экспозиции отражает оборот. Если ингибитор меняет и образование, разность включает оба эффекта. Если удаление LC3-II в обеих культурах уже полностью заблокировано, дополнительная разность равна 0, если ингибитор не меняет образование, но содержания LC3-II ненулевые (пример: 10 и 10).</div><ol class="mech"><li>Без ингибитора образование и удаление LC3-II происходят одновременно.</li><li>Во втором образце ингибитор изменяет процессы во время заданной экспозиции.</li><li>Разность сигналов описывает результат этой экспозиции и не всегда равна единственному физиологическому потоку.</li></ol><p>Для оценки потока важно различать четыре величины. Запас маркера — содержание LC3-II в образце в данный момент, например в условных единицах интенсивности полосы. Скорость образования — сколько LC3-II появляется за единицу времени. Скорость удаления — сколько его исчезает за то же время, в основном при расщеплении в аутолизосомах. Изменение запаса за интервал — разность запаса в конце и в начале интервала. Если образование и удаление равны, запас не меняется, хотя через систему идёт поток.</p><p>Поэтому поток оценивают по <a href="#ns-g-S7-T86">обороту LC3-II</a> в двух параллельных культурах. Обе культуры берут из одного исходного состояния. В одну добавляют ингибитор лизосомного расщепления, например бафиломицин A1, в другую — нет; обе собирают в один и тот же момент. Если ингибитор полностью блокирует удаление и не меняет образование LC3-II, разность содержаний в конце экспозиции отражает количество маркера, удалённого за этот интервал в контрольной культуре. В него может входить и маркер, присутствовавший до начала эксперимента. Если исходное состояние стационарно, а скорости сохраняются, удаление равно образованию за тот же интервал. Результат каждой культуры нельзя получить, прибавив к исходному сигналу заранее назначенную величину: он зависит от того, что происходило в культуре за время экспозиции.</p><p>Ингибитор может менять и само образование аутофагосом. Например, если он нарушает расщепление белков в лизосомах, в цитозоль поступает меньше аминокислот, и через mTORC1 меняется запуск аутофагии. Тогда разность между культурами включает и изменение образования, и прекращение удаления, и её называют потоком только с этой оговоркой (<a href="#ns-g-S7-T93">контроль</a> срока, концентрации и исходного состояния обязателен).</p><p>Отдельно стоит случай уже полной блокады. Если удаление LC3-II (его расщепление в аутолизосомах) в обеих культурах уже было полностью заблокировано, второе добавление ингибитора того же пути удаления не создаёт дополнительной разности, если ингибитор не меняет образование: при 10 и 10 условных единицах разность равна 0. Но это не означает, что LC3-II нет: сами содержания остаются ненулевыми. LC3-II не равен количеству расщеплённого белкового груза. Содержание белка <a href="#ns-g-S7-T98">p62</a> (SQSTM1) — рецептора, связывающего груз с LC3 и расщепляющегося вместе с ним, — тоже зависит от образования и удаления этого белка, в том числе от его синтеза, и не является универсальным прямым измерением всего потока.</p><div class="note trap"><strong>Типичная ошибка</strong> Нулевая разность между образцами означает отсутствие LC3-II в обоих.<p class="trap-fix">Одинаковое ненулевое содержание маркера даёт нулевую разность; содержание и дополнительный эффект — разные величины.</p></div><div class="static-quiz"><h3>В двух сопоставимых образцах содержание LC3-II равно 10 условным единицам; разность после ингибитора равна нулю. Что установлено?</h3><ol><li><b>А.</b> Дополнительной разности нет, но ненулевой сигнал маркера сохраняется в обоих образцах. <i>(верный вариант)</i><br><span class="expl">Разность 10 − 10 равна 0, но это не равенство каждого содержания нулю; причинную интерпретацию нужно обосновать отдельно.</span></li><li><b>Б.</b> LC3-II отсутствует в обоих образцах, поскольку разность сигналов нулевая. <i>(неверный вариант)</i><br><span class="expl">Здесь смешаны разность двух значений и сами значения.</span></li><li><b>В.</b> Любая аутофагия отсутствует во всех клетках независимо от выбранного метода. <i>(неверный вариант)</i><br><span class="expl">Один маркер и одно сравнение не исключают всех путей и всех стадий аутофагии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1080/15548627.2024.2355074">Kazyken D. et al. Unexpected roles for AMPK in the suppression of autophagy and the reactivation of MTORC1 signaling during prolonged amino acid deprivation. Autophagy. 2024;20:2017–2040. doi:10.1080/15548627.2024.2355074</a></li></ul><p>Числа 10 и 10 — отдельный явно условный арифметический пример; они не взяты из клеточного эксперимента. Нулевой дополнительный эффект не устанавливает автоматически причину отсутствия разности.</p></details></article><article class="card print-unit" id="ns-tandem-lc3"><div class="eyebrow">Аутофагия и лизосомы · шаг 29 из 32</div><h2>Что показывает цвет тандемного репортёра LC3</h2><p class="lead">Тандемный репортёр сочетает зелёный и красный флуорофоры с LC3. Изменение цвета связано с условиями компартмента и не является само по себе измерением всего потока.</p><div class="note"><strong>Что показывает схема.</strong> Тандемный репортёр LC3 (GFP и красный флуоресцентный белок). До слияния: оба сигнала, в наложении жёлтый. После слияния с кислой лизосомой: GFP гаснет, красный сохраняется. После слияния при нарушенной кислотности: оба сигнала, жёлтый, как до слияния, поэтому по цвету слияние не установить.</div><ol class="mech"><li>До кислого лизосомного этапа могут регистрироваться оба флуорофора.</li><li>В кислых деградативных условиях зелёный сигнал уменьшается сильнее красного.</li><li>Нарушение кислотности меняет интерпретацию цвета независимо от простого подсчёта точек.</li></ol><p><a href="#ns-g-S7-T94">Тандемный репортёр LC3</a> — LC3, соединённый одновременно с зелёным флуоресцентным белком GFP и красным флуоресцентным белком. Kimura и соавт. (2007) описали вариант mRFP–GFP–LC3; в практикуме семинара используется близкий по смыслу вариант mCherry–GFP–LC3. Это разные конструкции с разными красными белками, и названия не следует смешивать. Репортёр включается в мембраны аутофагосом так же, как собственный LC3.</p><p>Флуоресценция GFP в кислой среде гасится, а красные белки mRFP и mCherry к кислотности устойчивее. При наложении двух каналов изображения структура, в которой регистрируются оба сигнала, выглядит жёлтой, а структура, в которой остался только красный, — красной. Аутофагосома до слияния с лизосомой имеет нейтральный просвет, поэтому выглядит жёлтой. После слияния с кислой лизосомой зелёный сигнал гаснет и структура становится красной.</p><p>Цвет зависит от кислотности, а не от самого факта слияния. Если кислотность нарушена, например бафиломицином, уже слившаяся аутолизосома сохраняет зелёный сигнал и выглядит жёлтой, как аутофагосома. Поэтому жёлтый цвет при нарушенном закислении не доказывает, что слияния не было; слияние проверяют другим методом, например по совпадению репортёра с маркером лизосом.</p><p>Число красных точек не измеряет непосредственно скорость полного расщепления груза. Оно зависит от скорости образования аутофагосом, скорости слияния, времени жизни аутолизосомы и от того, насколько полно гаснет GFP. Для вывода о потоке нужны динамика во времени, условия расщепления и независимый метод, например оборот LC3-II. В режиме «Без цвета» каналы на схеме подписаны словами.</p><div class="note trap"><strong>Типичная ошибка</strong> После бафиломицина все жёлтые точки обязательно являются аутофагосомами, которые ещё не слились с лизосомой.<p class="trap-fix">Если кислотность снижена, уже слившаяся структура тоже может сохранять зелёный сигнал; её стадию нельзя установить только по цвету.</p></div><div class="static-quiz"><h3>После нарушения кислотности структура сохраняет зелёный и красный сигналы LC3-репортёра. Что можно заключить о слиянии только по цвету?</h3><ol><li><b>А.</b> Слияние доказано: любые два сигнала означают завершённую доставку. <i>(неверный вариант)</i><br><span class="expl">Наличие двух сигналов также возможно до слияния и потому не доказывает завершённую доставку.</span></li><li><b>Б.</b> Одного цвета недостаточно; слияние проверяют независимым методом. <i>(верный вариант)</i><br><span class="expl">В менее кислой слившейся структуре зелёный сигнал может сохраниться; цвет не различает эти варианты самостоятельно.</span></li><li><b>В.</b> Слияние исключено: оба сигнала возможны только до контакта с лизосомой. <i>(неверный вариант)</i><br><span class="expl">Это игнорирует изменение среды и возможность сохранения зелёного сигнала после слияния.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.4161/auto.4451">Kimura S., Noda T., Yoshimori T. Dissection of the autophagosome maturation process by a novel reporter protein, tandem fluorescent-tagged LC3. Autophagy. 2007;3:452–460. doi:10.4161/auto.4451</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1038/ncomms8007">Mauvezin C., Nagy P., Juhász G., Neufeld T. P. Autophagosome–lysosome fusion is independent of V-ATPase-mediated acidification. Nat Commun. 2015;6:7007. doi:10.1038/ncomms8007</a></li></ul><p>Схема не назначает реальный pH по цвету и не калибрует флуорофоры. mRFP исходной статьи и mCherry варианта практикума названы раздельно.</p></details></article><article class="card print-unit" id="ns-lysosomal-defects"><div class="eyebrow">Аутофагия и лизосомы · шаг 30 из 32</div><h2>Как различить дефект образования, слияния и гидролиза</h2><p class="lead">Разные нарушения могут приводить к накоплению материала, но имеют разные молекулярные причины. Недостаточность одной лизосомной гидролазы не равнозначна отсутствию кислой среды или всей аутофагии.</p><div class="note"><strong>Что показывает схема.</strong> Путь: образование аутофагосомы (ATG-системы) → слияние с лизосомой → расщепление в лизосоме: белки — протеазами, гликоген — GAA, гликозаминогликаны — своими ферментами. Утрата ATG7 нарушает конъюгацию и эффективное созревание аутофагических структур, нарушение слияния — доставку, недостаточность GAA (болезнь Помпе) — гидролиз гликогена, мукополисахаридозы — расщепление гликозаминогликанов.</div><ol class="mech"><li>ATG-зависимые системы участвуют в образовании аутофагической структуры.</li><li>Системы мембранного слияния обеспечивают доставку материала.</li><li>Кислая α-глюкозидаза <a href="#ns-g-S7-T95">GAA</a> расщепляет гликоген в лизосоме.</li></ol><p>Накопление материала в клетке может иметь разные молекулярные причины, и каждая затрагивает своё звено. При утрате ATG7 нарушается ATG7-зависимая конъюгация, в том числе липидирование LC3, и эффективность аутофагической переработки резко снижается. Однако отсутствие LC3-II само по себе не доказывает отсутствия всех аутофагосомных структур: их образование, замыкание и слияние с лизосомами проверяют отдельно. В описанных экспериментах в клетках, лишённых систем конъюгации ATG, структуры, похожие на аутофагосомы, всё же образовывались, хотя медленнее, и сливались с лизосомами, но внутренняя мембрана в аутолизосомах расщеплялась со значительной задержкой (Tsuboyama и соавт., 2016). При нарушении слияния аутофагосомы образуются, но не сливаются с лизосомами и накапливаются. При отсутствии определённой лизосомной гидролазы доставка и кислая среда сохраняются, но субстрат этого фермента не расщепляется и накапливается в лизосомах.</p><p><a href="#ns-g-S7-T96">Болезнь Помпе</a> — наследственное заболевание, вызванное мутациями гена GAA. Он кодирует лизосомную кислую α-глюкозидазу — фермент, который в лизосоме гидролизует гликоген до глюкозы. GAA расщепляет полисахарид, а не белковый груз. При недостаточности GAA гликоген, поступивший в лизосомы, накапливается в них; сильнее всего страдают сердце и скелетные мышцы. Первичный дефект при болезни Помпе — недостаточность гидролазы, а не утрата ATG7 или ULK1.</p><p>В мышечных волокнах при болезни Помпе находят и нарушения аутофагии: накопление аутофагического материала и изменение сигналов mTORC1 (Lim и соавт., 2014; Settembre, Perera, 2024). Это вторичные изменения: они развиваются в ответ на переполнение лизосом и зависят от ткани и стадии болезни. Результаты, полученные на животных моделях, не переносятся автоматически на людей.</p><p>Для сравнения, при <a href="#ns-g-S7-T99">мукополисахаридозах</a> нарушено лизосомное расщепление гликозаминогликанов — полисахаридных цепей из повторяющихся дисахаридных единиц, входящих в состав внеклеточного матрикса. Каждой форме соответствует недостаточность своего фермента, а накапливается не гликоген, а гликозаминогликаны. Общий смысл аутофагии и лизосомного расщепления — поддержание состава белков и органелл клетки. Избирательное удаление повреждённых митохондрий через белки PINK1 и Parkin (митофагия) относится к материалу другого семинара.</p><div class="note trap"><strong>Типичная ошибка</strong> При болезни Помпе первично отсутствует ATG7 или ULK1.<p class="trap-fix">Основной дефект связан с GAA и лизосомным расщеплением гликогена; состояние аутофагического аппарата рассматривают отдельно.</p></div><div class="static-quiz"><h3>В лизосоме сохранены кислая среда и доставка гликогена, но активность GAA резко снижена. Какое ближайшее изменение ожидается?</h3><ol><li><b>А.</b> Гликоген расщепляется с прежней скоростью только благодаря кислому pH. <i>(неверный вариант)</i><br><span class="expl">Кислотность создаёт условия реакции, но не катализирует её вместо недостаточно активной гидролазы.</span></li><li><b>Б.</b> Первично нарушается липидирование LC3, поскольку GAA входит в систему ATG7. <i>(неверный вариант)</i><br><span class="expl">GAA — гидролаза гликогена, а не компонент системы липидирования LC3; вторичные нарушения требуют отдельного исследования.</span></li><li><b>В.</b> Ограничивается гидролиз гликогена, даже при сохранённых указанных условиях. <i>(верный вариант)</i><br><span class="expl">Подходящая среда и доставка не заменяют каталитического действия нужного фермента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.3389/fnagi.2014.00177">Lim J.-A., Li L., Raben N. Pompe disease: from pathophysiology to therapy and back again. Front Aging Neurosci. 2014;6:177. doi:10.3389/fnagi.2014.00177</a></li><li><a href="https://doi.org/10.1002/1873-3468.14742">Noda N. N. Structural view on autophagosome formation. FEBS Lett. 2024;598:84–106. doi:10.1002/1873-3468.14742</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1038/s41580-023-00676-x">Settembre C., Perera R. M. Lysosomes as coordinators of cellular catabolism, metabolic signalling and organ physiology. Nat Rev Mol Cell Biol. 2024;25:223–245. doi:10.1038/s41580-023-00676-x</a></li><li><a href="https://doi.org/10.1126/science.aaf6136">Tsuboyama K. et al. The ATG conjugation systems are important for degradation of the inner autophagosomal membrane. Science. 2016;354:1036–1041. doi:10.1126/science.aaf6136</a></li></ul><p>Качественная модель выбранного дефекта GAA; не устанавливает клиническую тяжесть и не предлагает лечение. Первичный дефект и вторичные изменения аутофагии различены.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 31 из 32</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Исследование начинается с конкретного вопроса и измеряемой величины. Одно наблюдение не заменяет одновременно локализацию, ферментативную активность и поток.</p><div class="note"><strong>Что показывает схема.</strong> Четыре темы и методы: локализация mTORC1 (микроскопия с LAMP1), аденилаты и AMPK (ВЭЖХ или масс-спектрометрия, иммуноблоттинг p-AMPK и p-ACC), малонил-CoA и окисление (масс-спектрометрия, меченый субстрат), стадии аутофагии (оборот LC3-II, тандемный репортёр, расщепление субстрата). Для каждой указаны контроль и граница вывода.</div><ol class="mech"><li>Для локализации выбирают метод распределения сигнала в клетке.</li><li>Для химической модификации или метаболита выбирают соответствующий молекулярный анализ.</li><li>Для причинного вывода добавляют сопоставимое вмешательство, <a href="#ns-g-S7-T93">контроль</a> и при необходимости восстановление компонента.</li></ol><p>Исследование начинается с вопроса, сформулированного через измеряемую величину. «Работает ли mTORC1?» — плохой вопрос: неясно, что измерять. «Изменилась ли доля mTOR, совпадающего с LAMP1, через 30 минут после добавления аминокислот?» и «Изменилось ли отношение p-S6K1 к общему S6K1?» — вопросы, на которые можно ответить. Для четырёх тем семинара это выглядит так. Локализацию mTORC1 определяют микроскопией с маркером лизосом. Состояние аденилатов и AMPK — ВЭЖХ или масс-спектрометрией и иммуноблоттингом. Малонил-CoA и окисление субстрата — масс-спектрометрией и меченым субстратом. Стадии аутофагии и лизосомное расщепление — оборотом LC3-II, тандемным репортёром и измерением расщепления определённого субстрата. Двухмембранные аутофагосомы видны на снимках электронной микроскопии; именно так аутофагию открыли в клетках мыши и крысы в конце 1950-х — начале 1960-х годов (Nakatogawa, 2020). Снимок показывает число и вид структур в момент фиксации, но не поток.</p><p>Для каждого измерения указывают нормировку, срок и то, чего метод сам по себе не доказывает. Фосфорилированный белок нормируют на общее содержание того же белка, общий белок — на белок контроля нанесения, по которому проверяют одинаковое количество белка в дорожках, метаболит — на количество клеток или белка в пробе. Сравниваемые образцы обрабатывают одинаково и собирают в один момент: аденилаты меняются за секунды, фосфорилирование — за минуты.</p><p>Повторы бывают двух видов. Биологические повторы — независимые культуры, животные или отдельно полученные биологические пробы; они позволяют проверить, воспроизводится ли результат на независимом материале. Технические повторы — несколько измерений одной и той же пробы; они позволяют оценить повторяемость измерения, но сами по себе не выявляют систематическую ошибку и не проверяют биологическую воспроизводимость. Вывод о воспроизводимости на биологическом материале делают по биологическим повторам.</p><p>Совместное изменение двух признаков ещё не доказывает причинной связи между ними. Если после активации AMPK одновременно выросли p-ACC и окисление жирных кислот, каждое из этих изменений могло быть вызвано действием AMPK на разные мишени. Чтобы проверить участие ACC в изменении окисления, вмешиваются именно в эту ветвь: например, сравнивают исходные клетки с клетками, где серин в участке ACC, фосфорилируемом AMPK, заменён аланином, при сохранённой регуляции других мишеней AMPK. Утрата AMPK и возвращение её исходного варианта проверяют другой вывод — зависит ли эффект от AMPK вообще. Несколько разных методов полезны, только если они измеряют звенья именно этой причинной цепи и имеют подходящие контроли.</p><div class="note trap"><strong>Типичная ошибка</strong> Несколько разных методов автоматически доказывают любой предложенный механизм.<p class="trap-fix">Методы должны измерять звенья именно рассматриваемой причинной связи, иметь подходящие контроли и позволять проверить альтернативные объяснения результата.</p></div><div class="static-quiz"><h3>Нужно проверить, изменилось ли окисление заданной жирной кислоты после активации AMPK. Какой подход наиболее прямо отвечает на этот вопрос?</h3><ol><li><b>А.</b> Измерение превращения заданного меченого субстрата с подходящим расчётом потока и контролями. <i>(верный вариант)</i><br><span class="expl">Метод направлен на заданный субстрат и его превращения; модель расчёта и контроли остаются необходимыми.</span></li><li><b>Б.</b> Измерение только p-AMPK без регистрации превращений самой жирной кислоты. <i>(неверный вариант)</i><br><span class="expl">p-AMPK показывает регуляторный признак, а не окислительный поток конкретного субстрата.</span></li><li><b>В.</b> Измерение только концентрации малонил-CoA без регистрации превращений самой жирной кислоты. <i>(неверный вариант)</i><br><span class="expl">Концентрация регуляторного метаболита не заменяет измерения скорости окисления субстрата.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-7.html#q1">Вопрос 1 →</a> <a href="seminar-7.html#q2">Вопрос 2 →</a> <a href="seminar-7.html#q3">Вопрос 3 →</a> <a href="seminar-7.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1016/j.cmet.2018.06.001">Divakaruni A. S. et al. Etomoxir inhibits macrophage polarization by disrupting CoA homeostasis. Cell Metab. 2018;28:490–503.e7. doi:10.1016/j.cmet.2018.06.001</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41580-020-0241-0">Nakatogawa H. Mechanisms governing autophagosome biogenesis. Nat Rev Mol Cell Biol. 2020;21:439–458. doi:10.1038/s41580-020-0241-0</a></li></ul><p>Методические карточки, а не готовый протокол исследований на пациентах. Без незаданных доз, числа образцов и выдуманных измерений.</p></details></article><article class="card print-unit" id="ns-integrated-study"><div class="eyebrow">Исследование · шаг 32 из 32</div><h2>Как проверить согласование четырёх механизмов</h2><p class="lead">В итоговой учебной модели различаются аминокислотный вход, энергетическое состояние, регуляция ACC–CPT1 и переработка материала в лизосомах. Вывод должен соответствовать именно выбранному вмешательству и сохранённым условиям.</p><div class="note"><strong>Что показывает схема.</strong> Четыре слоя: (1) аминокислоты и лизосомный источник → Rag → mTORC1 → S6K1, mTORC1 тормозит запуск аутофагии; (2) аденилаты → AMPK ⊣ mTORC1; (3) AMPK → ACC → малонил-CoA ⊣ CPT1; (4) аутофагия доставляет груз в лизосомы, протеолиз даёт аминокислоты. Случаи: удаление внешних аминокислот снижает p-S6K1, но AMPK автоматически не активирует; блок протеолиза без внешних аминокислот лишает модель источника для Rag-входа; некомпенсированный дополнительный расход ATP при заданном повышении AMP/ATP активирует AMPK и тормозит mTORC1 через RAPTOR, а также снижает активность ACC; при блоке выхода продуктов направление ответа mTORC1 без уточнения системы не задано.</div><ol class="mech"><li>Изменение доступности аминокислот влияет на Rag-зависимую ветвь mTORC1.</li><li>Энергетическое состояние и AMPK могут менять регуляцию mTORC1 и ACC.</li><li>Лизосомный гидролиз и выход продуктов создают дополнительный источник аминокислот в заданной модели.</li></ol><p>Итоговая модель объединяет четыре механизма семинара, но каждый вход задаётся отдельно. В исходном состоянии внешние аминокислоты есть, аденилатный пул в энергетически полноценном состоянии, RHEB–GTP поддержан, карнитиновый челнок работает. Затем меняется только одно условие, и прослеживается, какое звено затронуто непосредственно, а какие изменения следуют из этого при заданных условиях.</p><p>Удаление внешних аминокислот при сохранённых аденилатах ослабляет Rag-вход: mTORC1 перестаёт привлекаться к лизосоме, фосфорилирование S6K1 снижается, торможение запуска аутофагии ослабевает. Состояние AMPK от этого автоматически не меняется: слово «голодание» не задаёт энергетического стресса, и активацию AMPK назначают только при заданном изменении аденилатов, Ca²⁺ или другого её входа. Позже материал, доставленный в лизосомы, расщепляется, и освобождённые аминокислоты могут частично восстановить Rag-вход — если протеолиз и выход продуктов работают.</p><p>Каждое вмешательство затрагивает своё звено. Блок лизосомных протеаз при отсутствии внешних аминокислот лишает модель единственного источника аминокислот: Rag-вход остаётся слабым, и повторной активации через этот вход нет. Блок выхода продуктов из лизосомы сложнее: аргинин в просвете может по-прежнему связываться с SLC38A9, а аминокислоты в цитозоле остаются недоступны, поэтому без уточнения системы направление ответа mTORC1 не задано. Если повышенный расход ATP не компенсируется образованием ATP, в заданном энергетическом случае растёт отношение AMP к ATP и активируется AMPK. При сохранённом RHEB–GTP в этой модели AMPK тормозит mTORC1 через RAPTOR и снижает активность ACC; ингибирование CPT1 ослабевает, но поток β-окисления этим ещё не доказан. Изменение ACC само по себе меняет регуляцию входа в карнитиновый челнок, но не аминокислотный вход.</p><p>Для каждого вывода нужно независимое измерение: локализация mTORC1 и p-S6K1, аденилаты и p-AMPK, малонил-CoA и превращение меченого субстрата, оборот LC3-II и расщепление определённого субстрата. Возможные результаты модели — предсказания, а не экспериментальные данные. Если эксперимент даёт неожиданный результат, это повод проверить предпосылку — например, не изменились ли аденилаты при удалении аминокислот, — а не подгонять формулу под результат.</p><div class="note trap"><strong>Типичная ошибка</strong> Все показания можно вывести из одного общего ползунка «голод».<p class="trap-fix">Разные воздействия меняют разные входы и стадии; состав среды, энергия и работа лизосом задаются отдельно.</p></div><div class="static-quiz"><h3>В итоговой качественной модели удалили внешние аминокислоты. Их лизосомное освобождение заблокировано, другого источника нет. Аденилаты, Ca²⁺ и другие входы AMPK сохранены; RHEB–GTP поддержан. Какой ответ соответствует этим условиям?</h3><ol><li><b>А.</b> p-S6K1 сохраняется при исходной AMPK: RHEB–GTP заменяет аминокислотный вход. <i>(неверный вариант)</i><br><span class="expl">В рассматриваемой Rag-зависимой ветви RHEB–GTP не заменяет необходимый аминокислотный вход.</span></li><li><b>Б.</b> p-S6K1 снижается; обязательная активация AMPK из этих условий не следует. <i>(верный вариант)</i><br><span class="expl">В модели нарушен Rag-зависимый вход к S6K1; удаления аминокислот недостаточно, чтобы автоматически назначить энергетический или кальциевый вход к AMPK.</span></li><li><b>В.</b> p-S6K1 снижается; AMPK обязательно активируется при любом удалении аминокислот. <i>(неверный вариант)</i><br><span class="expl">Это смешение аминокислотного воздействия с заданным изменением энергии или Ca²⁺; универсального обязательного ответа здесь нет.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-7.html#q1">Вопрос 1 →</a> <a href="seminar-7.html#q2">Вопрос 2 →</a> <a href="seminar-7.html#q3">Вопрос 3 →</a> <a href="seminar-7.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.09.046">Wyant G. A. et al. mTORC1 activator SLC38A9 is required to efflux essential amino acids from lysosomes and use protein as a nutrient. Cell. 2017;171:642–654.e12. doi:10.1016/j.cell.2017.09.046</a></li><li><a href="https://doi.org/10.1038/nature09076">Yu L. et al. Termination of autophagy and reformation of lysosomes regulated by mTOR. Nature. 2010;465:942–946. doi:10.1038/nature09076</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D. J. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382. doi:10.1080/15548627.2020.1797280</a></li><li><a href="https://doi.org/10.1080/15548627.2024.2355074">Kazyken D. et al. Unexpected roles for AMPK in the suppression of autophagy and the reactivation of MTORC1 signaling during prolonged amino acid deprivation. Autophagy. 2024;20:2017–2040. doi:10.1080/15548627.2024.2355074</a></li></ul><p>Итог — качественная модель со специально ограниченными источниками и фиксированными предпосылками. Лизосомное распознавание аргинина и выход продуктов в цитозоль различаются; блок одного транспортёра не объявляет автоматически нулём весь сигнал mTORC1.</p></details></article><section class="card print-unit"><h2>Четыре открытых вопроса</h2><p>Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с критериями ответа.</p><ol><li><p><strong>Как аминокислотный и ростовой входы регулируют локализацию mTORC1 и фосфорилирование его разных субстратов?</strong></p><p><em>Что должно быть в ответе:</em> В ответе должны быть Rag/Ragulator, TSC/RHEB, отличие локализации от p-S6K1 и особая зависимость TFEB.</p></li><li><p><strong>Как состояние аденилатного пула и дополнительные сигналы регулируют AMPK?</strong></p><p><em>Что должно быть в ответе:</em> Нужно объяснить реакцию аденилаткиназы, расчёт заряда, действия AMP/ADP, роль LKB1, CaMKK2 и отдельный лизосомный ответ на глюкозу. Сопоставить быстрые реакции и длительную адаптацию.</p></li><li><p><strong>Как связаны ACC, малонил-CoA и карнитиновый челнок и почему их состояние не заменяет измерение β-окисления?</strong></p><p><em>Что должно быть в ответе:</em> Нужно назвать реакцию ACC, две функции малонил-CoA, роли CPT1/CACT/CPT2, тканевые ограничения и метод проверки потока.</p></li><li><p><strong>Как различить образование аутофагосомы, слияние, гидролиз и повторную активацию mTORC1?</strong></p><p><em>Что должно быть в ответе:</em> Нужно назвать ULK1 и последующие ATG-звенья, условия лизосомного расщепления, оборот LC3-II, ограничения репортёра и смысл ALR.</p></li></ol></section><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S7-T01"><dt>mTORC1</dt><dd>Комплекс с киназой mTOR и регуляторным белком RAPTOR, участвующий в согласовании сигналов и метаболических процессов. Разные субстраты имеют разные требования к его регуляции; локализация не равна действию на любой субстрат.</dd></div><div id="ns-g-S7-T02"><dt>mTORC2</dt><dd>Другой комплекс киназы mTOR, содержащий RICTOR и участвующий, в частности, в регуляции AKT. Отличать состав, субстраты и режим чувствительности к препаратам от mTORC1.</dd></div><div id="ns-g-S7-T03"><dt>RAPTOR</dt><dd>Регуляторный белок mTORC1, участвующий в организации взаимодействий комплекса с Rag и субстратами. Это компонент комплекса, а не самостоятельная киназа mTOR.</dd></div><div id="ns-g-S7-T04"><dt>S6K1</dt><dd>Рибосомальная S6-киназа 1, один из субстратов mTORC1 и регуляторов синтеза белка. Фосфорилирование T389 характеризует выбранную ветвь, но не всю активность mTORC1; S6K1 и её субстрат S6 различаются.</dd></div><div id="ns-g-S7-T05"><dt>4E-BP1</dt><dd>Белок, связывающий фактор инициации eIF4E и ограничивающий зависимую от него инициацию трансляции. Эффект фосфорилирования зависит от совокупности участков; T37/46 нельзя считать единственным показателем всей трансляции.</dd></div><div id="ns-g-S7-T06"><dt>ULK1</dt><dd>Протеинкиназа в комплексе инициации канонической макроаутофагии с ATG13, FIP200 и ATG101. Изменение одного участка не описывает всю активность комплекса; S758 человека соответствует S757 мыши.</dd></div><div id="ns-g-S7-T07"><dt>TFEB</dt><dd>Транскрипционный фактор, регулирующий экспрессию части генов лизосомных белков и аутофагического аппарата. Ядерная доля, фосфорилирование и транскрипционный результат измеряются отдельно; S211 человека не переносится на TFE3.</dd></div><div id="ns-g-S7-T08"><dt>Rag</dt><dd>Семейство малых ГТФаз, образующих гетеродимеры RagA/B с RagC/D и регулирующих взаимодействия mTORC1. Для основной конфигурации связывания RAPTOR важны RagA/B–GTP и RagC/D–GDP, а не GTP у обоих партнёров.</dd></div><div id="ns-g-S7-T09"><dt>Ragulator</dt><dd>Комплекс лизосомной мембраны, организующий положение и регуляторные взаимодействия Rag-ГТФаз. Не является рецептором инсулина и не переносит фосфорильную группу на S6K1.</dd></div><div id="ns-g-S7-T10"><dt>GATOR1 и GATOR2</dt><dd>GATOR1 — комплекс DEPDC5–NPRL2–NPRL3, ускоряющий гидролиз GTP у RagA/B и ограничивающий основную аминокислотную ветвь. GATOR2 — другой белковый комплекс этого пути, функционально противодействующий GATOR1. Функции двух комплексов различаются. Утрата одного из них не задаёт одинакового ответа всех субстратов mTORC1; механизмы взаимодействий с отдельными сенсорами также следует различать.</dd></div><div id="ns-g-S7-T11"><dt>GAP</dt><dd>Белок или комплекс, ускоряющий гидролиз GTP у определённой ГТФазы. Он ускоряет гидролиз, а не является общим «активатором» всех функций ГТФазы; нужно назвать мишень.</dd></div><div id="ns-g-S7-T12"><dt>FLCN</dt><dd>Фолликулин — белок, в комплексе с FNIP участвующий в регуляции нуклеотидного состояния RagC/D. Зависимость TFEB от FLCN отличается от требований S6K1; недостаточность FLCN не означает одинакового подавления всех субстратов.</dd></div><div id="ns-g-S7-T13"><dt>PI3K классов I и III (VPS34)</dt><dd>PI3K класса I образует PIP₃ из PI(4,5)P₂ в рассматриваемой ростовой ветви. VPS34 — каталитическая субъединица PI3K класса III, образующая PI3P; в аутофагический комплекс входят также VPS15, Beclin1 и ATG14. Два класса киназ образуют разные липиды и работают в разных комплексах. PI3P в аппарате фагофора не тождествен PIP₃ ростовой ветви.</dd></div><div id="ns-g-S7-T14"><dt>PIP₃</dt><dd>Фосфатидилинозитол-3,4,5-трисфосфат — мембранный липид, образуемый PI3K класса I. Он способствует связыванию белков с соответствующими доменами, но не фосфорилирует AKT как киназа.</dd></div><div id="ns-g-S7-T15"><dt>AKT</dt><dd>Протеинкиназа, участвующая в передаче ростовых и других сигналов, включая регуляцию TSC2. Её действие на TSC2 не равнозначно прямому фосфорилированию RHEB.</dd></div><div id="ns-g-S7-T16"><dt>TSC</dt><dd>Комплекс TSC1–TSC2–TBC1D7; TSC2, или туберин, выполняет GAP-функцию по отношению к RHEB. TSC1 — гамартин; изменения действия комплекса зависят от локализации и условий, а не только от наличия TSC2.</dd></div><div id="ns-g-S7-T17"><dt>RHEB</dt><dd>Малая ГТФаза, GTP-связанная форма которой взаимодействует с mTORC1 и способствует его активации. RHEB нельзя считать постоянно закреплённой исключительно на лизосоме; она не является киназой S6K1.</dd></div><div id="ns-g-S7-T18"><dt>Sestrin2</dt><dd>Сенсорный белок, связывающий лейцин и взаимодействующий с GATOR2 в основной рассматриваемой ветви. Не является единственным сенсором всех аминокислот во всех клетках.</dd></div><div id="ns-g-S7-T19"><dt>CASTOR1</dt><dd>Белок, связывающий цитозольный аргинин и регулирующий взаимодействие с GATOR2. Отличать его от SLC38A9 в лизосомной мембране и от сенсора лейцина.</dd></div><div id="ns-g-S7-T20"><dt>SAM</dt><dd>S-аденозилметионин — метаболит и донор метильных групп в ряде реакций, воспринимаемый SAMTOR. Концентрация SAM не тождественна концентрации метионина.</dd></div><div id="ns-g-S7-T21"><dt>SAMTOR</dt><dd>Сенсор SAM, регулирующий взаимодействия с GATOR1–KICSTOR в пути mTORC1. В этом пути воспринимаемым метаболитом служит SAM, а не сам метионин; сенсорная функция не доказывает метилтрансферазной активности.</dd></div><div id="ns-g-S7-T22"><dt>SLC38A9</dt><dd>Лизосомный мембранный белок, участвующий в распознавании аргинина и выходе ряда аминокислот, включая лейцин. Сигнальная функция и транспорт различаются; это не единственный путь выхода всех аминокислот.</dd></div><div id="ns-g-S7-T23"><dt>KICSTOR</dt><dd>Комплекс KPTN–ITFG2–C12orf66–SZT2, участвующий в организации GATOR1-зависимой регуляции у лизосомы. Участие компонентов KICSTOR в этом комплексе не означает, что каждый из них служит отдельным сенсором лейцина или инсулина.</dd></div><div id="ns-g-S7-T24"><dt>FNIP1</dt><dd>Белок, взаимодействующий с FLCN; его фосфорилирование AMPK связано с регуляцией TFEB в описанном стрессовом ответе. FNIP1 и FNIP2 — разные партнёры FLCN; механизм AMPK–FNIP1 не переносить на FNIP2 без проверки.</dd></div><div id="ns-g-S7-T25"><dt>14-3-3</dt><dd>Семейство белков, связывающих определённые фосфорилированные участки и меняющих взаимодействия или распределение партнёров. Это не киназа и не универсальный экспортный рецептор; для TFEB важен конкретный фосфорилированный участок.</dd></div><div id="ns-g-S7-T26"><dt>Колокализация</dt><dd>Совпадение распределения двух регистрируемых сигналов в пределах пространственного разрешения метода. Не доказывает прямое связывание белков, их одинаковую концентрацию или каталитическую активность.</dd></div><div id="ns-g-S7-T27"><dt>Рапамицин</dt><dd>Соединение, которое в комплексе с FKBP12 связывается с FRB-областью mTOR и ограничивает часть его функций. Не ATP-конкурентный ингибитор; чувствительность зависит от сайта, клетки и срока; длительное воздействие может затрагивать mTORC2.</dd></div><div id="ns-g-S7-T28"><dt>Torin1</dt><dd>ATP-конкурентный ингибитор киназы mTOR. Может подавлять mTORC1 и mTORC2; не считать селективным ингибитором только одной ветви при любых условиях.</dd></div><div id="ns-g-S7-T29"><dt>FKBP12–FRB</dt><dd>FKBP12 связывает рапамицин; этот комплекс взаимодействует с FRB-областью mTOR. FRB — область белка mTOR, а не отдельный растворимый фермент; не смешивать её с ATP-связывающим участком.</dd></div><div id="ns-g-S7-T30"><dt>Иммуноблоттинг</dt><dd>Метод выявления выбранного белка или его модификации с помощью антител после разделения белков. Интенсивность сигнала зависит от условий анализа; фосфосигнал сопоставляют с общим белком и подходящей нормировкой.</dd></div><div id="ns-g-S7-T31"><dt>LAMP1</dt><dd>Лизосомный мембранный белок, часто используемый как маркер эндолизосомных структур. Его сигнал не измеряет непосредственно кислотность, гидролиз или число исключительно функциональных лизосом.</dd></div><div id="ns-g-S7-T32"><dt>Фосфорилирование</dt><dd>Перенос фосфорильной группы на молекулу; в рассматриваемых реакциях белков его катализирует протеинкиназа. Это химическая модификация, направление функционального эффекта зависит от конкретной мишени и участка.</dd></div><div id="ns-g-S7-T33"><dt>Аденилатный пул: ATP, ADP и AMP</dt><dd>Аденилатный пул — совокупность ATP, ADP и AMP в оговорённом образце или компартменте. ATP, аденозинтрифосфат, участвует в сопряжении реакций; ADP, аденозиндифосфат, образуется, в частности, при гидролизе ATP. AMP, аденозинмонофосфат, служит регуляторным лигандом AMPK. Нужно уточнять, измеряются содержание, концентрации или доли нуклеотидов. Энергетический эффект определяется всей реакцией и её условиями; содержание ATP не описывает энергетическое состояние полностью. Действия AMP и ADP на AMPK различаются. AMP не тождествен циклическому AMP и не служит здесь донором фосфорильной группы; разные компартменты и свободные формы нуклеотидов не объединяют автоматически.</dd></div><div id="ns-g-S7-T34"><dt>Аденилаткиназа</dt><dd>Фермент, катализирующий обратимое перераспределение фосфорильных групп: 2 ADP ⇌ ATP + AMP. Прямое направление образует ATP и AMP; конкретное относительное усиление AMP не универсально.</dd></div><div id="ns-g-S7-T35"><dt>Энергетический заряд</dt><dd>Отношение ([ATP] + 0,5[ADP]) к сумме [ATP] + [ADP] + [AMP], характеризующее состояние заданного аденилатного пула. Это расчётный показатель 0–1, а не лиганд AMPK и не полное измерение термодинамического состояния клетки.</dd></div><div id="ns-g-S7-T36"><dt>AMPK и родственная киназа Snf1</dt><dd>AMPK, AMP-активируемая протеинкиназа, — комплекс α-, β- и γ-субъединиц, регулирующий метаболические процессы. Дрожжевая Snf1 — родственная протеинкиназа, участвующая в регуляции использования источников углерода. Название AMPK не исключает других путей активации. Snf1 — гомолог, а не непосредственно наблюдаемый предок AMPK; родство не означает одинаковой регуляции нуклеотидами. Действие AMPK на аутофагию и mTORC1 зависит от условий.</dd></div><div id="ns-g-S7-T37"><dt>Аллостерическая регуляция</dt><dd>Изменение свойств белка при связывании лиганда с участком, функционально связанным с каталитическим центром. Лиганд не обязательно является субстратом реакции и не обязан изменять степень фосфорилирования.</dd></div><div id="ns-g-S7-T38"><dt>LKB1</dt><dd>Протеинкиназа, кодируемая STK11 и в комплексе со STRAD/MO25 фосфорилирующая AMPK и другие киназы. Не является прямым сенсором AMP; потеря LKB1 не устраняет автоматически CaMKK2-зависимый вход.</dd></div><div id="ns-g-S7-T39"><dt>Активационная петля</dt><dd>Участок киназного домена, состояние которого влияет на каталитическую активность; часто регулируется фосфорилированием. Для AMPKα2 человека используется Thr172, для α1 человека соответствующий номер Thr183; обозначение лабораторного антитела проверять.</dd></div><div id="ns-g-S7-T40"><dt>Метаболический поток</dt><dd>Скорость прохождения вещества через определённую реакцию или путь при заданных условиях. Содержание промежуточного метаболита и регуляторная модификация не равны потоку.</dd></div><div id="ns-g-S7-T41"><dt>Альдолаза</dt><dd>Фермент гликолиза, расщепляющий фруктозо-1,6-бисфосфат и в описанном пути участвующий в его восприятии. Её каталитическая и сенсорная функции различаются; не объявлять единственным механизмом всех ответов на глюкозу.</dd></div><div id="ns-g-S7-T42"><dt>FBP</dt><dd>Фруктозо-1,6-бисфосфат — промежуточный метаболит гликолиза, связываемый альдолазой. Отличать от фруктозо-2,6-бисфосфата, который имеет другую регуляторную функцию.</dd></div><div id="ns-g-S7-T43"><dt>AXIN</dt><dd>Каркасный белок, участвующий в организации ряда сигнальных комплексов, включая описанную лизосомную ветвь LKB1–AMPK. Каркасная роль не равна киназному действию и не ограничена одним путём.</dd></div><div id="ns-g-S7-T44"><dt>V-ATPase</dt><dd>Вакуолярная H⁺-ATPase — комплекс, использующий гидролиз ATP для переноса протонов и участвующий в поддержании кислотности. Кислотность зависит и от других свойств компартмента; это не протеаза и не самостоятельный маркер гидролиза.</dd></div><div id="ns-g-S7-T45"><dt>CaMKK2</dt><dd>Ca²⁺/кальмодулин-зависимая протеинкиназа-киназа 2, способная фосфорилировать AMPK в подходящем клеточном контексте. Старое обозначение CaMKKβ относится к этому белку; путь не одинаково выражен во всех тканях.</dd></div><div id="ns-g-S7-T46"><dt>Кальмодулин</dt><dd>Ca²⁺-связывающий регуляторный белок, взаимодействующий с рядом ферментов и других партнёров. Не является CaMKK2; Ca²⁺ служит сигналом, а не донором фосфорильной группы.</dd></div><div id="ns-g-S7-T47"><dt>PGC-1α</dt><dd>Транскрипционный коактиватор, участвующий в программах окислительного метаболизма и митохондриального биогенеза. Рост его РНК не является сам по себе полным измерением образования митохондрий.</dd></div><div id="ns-g-S7-T48"><dt>MFF</dt><dd>Белок наружной митохондриальной мембраны, участвующий в привлечении аппарата деления митохондрий и регулируемый AMPK. Деление, биогенез и митофагия — разные процессы.</dd></div><div id="ns-g-S7-T49"><dt>Биогенез</dt><dd>Образование компонентов и структур органеллы, требующее синтеза и организации белков, липидов и других составляющих. Увеличение содержания органелл может отражать также снижение удаления; механизм и соответствующие измерения нужно различать.</dd></div><div id="ns-g-S7-T50"><dt>ВЭЖХ/масс-спектрометрия</dt><dd>ВЭЖХ разделяет компоненты смеси, а масс-спектрометрия выявляет и оценивает молекулярные формы по их массам и другим характеристикам. Это разные, часто сочетаемые методы; количественная оценка требует подготовки образца, стандартов и нормировки.</dd></div><div id="ns-g-S7-T51"><dt>AICAR/ZMP</dt><dd>В фармакологическом контексте AICAR обычно означает рибозид, который в клетке может превращаться в ZMP — AMP-подобный нуклеотид. AICAR и ZMP не взаимозаменяемые названия одной формы; действие не ограничено исключительно AMPK.</dd></div><div id="ns-g-S7-T52"><dt>Метформин</dt><dd>Препарат, который влияет на клеточный метаболизм и в определённых условиях может менять активность AMPK. Эти эффекты нельзя свести к единственной цепи «комплекс I → AMP → AMPK»: механизм, включая косвенное влияние на AMPK, зависит от клеточной системы, дозы и времени воздействия.</dd></div><div id="ns-g-S7-T53"><dt>Дорсоморфин (Compound C)</dt><dd>Соединение, которое в ряде исследований используют как ингибитор AMPK. Оно действует и на другие киназы, поэтому эффект одного дорсоморфина не доказывает специфической зависимости от AMPK.</dd></div><div id="ns-g-S7-T54"><dt>PRKAG2</dt><dd>Ген γ2-субъединицы AMPK, определённые варианты которого связаны с наследственным сердечным синдромом. Не приписывать любому варианту одинаковое действие; ген и белковая субъединица — разные сущности.</dd></div><div id="ns-g-S7-T55"><dt>ACC</dt><dd>Ацетил-CoA-карбоксилаза — биотин-зависимый фермент образования малонил-CoA; различаются ACC1 и ACC2. Изоформы и фосфосайты уточнять: пример Fullerton 2013 — мыши Acc1 Ser79 и Acc2 Ser212.</dd></div><div id="ns-g-S7-T56"><dt>Ацетил-CoA</dt><dd>Тиоэфир коэнзима A и ацетильной группы, участвующий во многих реакциях обмена. Различать молекулу-переносчик и переносимую группу; принадлежность компартменту существенна.</dd></div><div id="ns-g-S7-T57"><dt>Малонил-CoA</dt><dd>Тиоэфир коэнзима A и малонильной группы; субстрат синтеза жирных кислот и ингибитор CPT1. Содержание, скорость образования и локальная доступность различаются; не называть единственным регулятором всего окисления.</dd></div><div id="ns-g-S7-T58"><dt>Биотин</dt><dd>Кофактор карбоксилаз, участвующий в переносе активируемой карбоксильной группы. В ACC связан с белком; не является источником ATP или заменой ацетил-CoA.</dd></div><div id="ns-g-S7-T59"><dt>Синтез жирных кислот de novo и FASN</dt><dd>Синтез жирных кислот de novo — образование новых жирных кислот из более коротких углеродных предшественников. FASN, синтаза жирных кислот млекопитающих, — многофункциональный фермент, использующий малонил-CoA при построении ацильной цепи. ACC образует малонил-CoA, а FASN использует его в последующих реакциях; это разные ферменты. Синтез новой ацильной цепи следует отличать от образования триацилглицеролов из уже имеющихся жирных кислот.</dd></div><div id="ns-g-S7-T60"><dt>CPT1</dt><dd>Карнитин-пальмитоилтрансфераза 1; митохондриальные CPT1A/B переносят ацильную группу с CoA на карнитин. Не транспортёр внутренней мембраны; чувствительность к малонил-CoA и тканевое распределение изоформ различаются.</dd></div><div id="ns-g-S7-T61"><dt>CACT</dt><dd>Карнитин-ацилкарнитиновая транслоказа внутренней митохондриальной мембраны, кодируемая SLC25A20. Переносит ацилкарнитин и карнитин, а не выполняет реакцию ACC или CPT1.</dd></div><div id="ns-g-S7-T62"><dt>CPT2</dt><dd>Карнитин-пальмитоилтрансфераза 2, восстанавливающая ацил-CoA на матриксной стороне внутренней мембраны. Место и направление реакции отличаются от CPT1; это не сам мембранный транспортёр CACT.</dd></div><div id="ns-g-S7-T63"><dt>Карнитиновый челнок</dt><dd>Система реакций CPT1 и CPT2 и переноса ацилкарнитина белком CACT, обеспечивающая доставку длинноцепочечной ацильной группы в матрикс митохондрии. Необходимость этой системы зависит от длины цепи, формы субстрата и ткани. Внутреннюю мембрану пересекает ацилкарнитин; CoA не проходит через неё вместе с ацильной группой.</dd></div><div id="ns-g-S7-T64"><dt>Ацилкарнитин</dt><dd>Соединение карнитина с ацильной группой, участвующее в её переносе и других метаболических превращениях. Не равен ацил-CoA; накопление не является само по себе измерением полного β-окисления.</dd></div><div id="ns-g-S7-T65"><dt>β-окисление</dt><dd>Последовательное укорочение ацильной цепи с образованием ацетил-CoA и восстановительных эквивалентов. Зависит от субстрата, ферментов и реокисления коферментов; карнитиновый перенос — предшествующий этап для соответствующих субстратов.</dd></div><div id="ns-g-S7-T66"><dt>CPT1C</dt><dd>Паралог CPT1, выраженный преимущественно в нервной системе и связанный главным образом с ЭПР. По функции в митохондриальном карнитиновом челноке CPT1C не равнозначна CPT1A и CPT1B.</dd></div><div id="ns-g-S7-T67"><dt>Изоформа</dt><dd>Один из вариантов белка, различающихся последовательностью, происхождением или распределением; конкретное основание различия нужно назвать. ACC1/ACC2 и CPT1A/B/C кодируются разными генами; термин не означает взаимозаменяемости.</dd></div><div id="ns-g-S7-T68"><dt>Длинноцепочечная жирная кислота</dt><dd>Жирная кислота с относительно длинной углеродной цепью; здесь основной пример — пальмитат C16. Границы категории зависят от принятой классификации; в модели важен названный субстрат, а не одно общее слово.</dd></div><div id="ns-g-S7-T69"><dt>Среднецепочечная жирная кислота</dt><dd>Жирная кислота средней длины цепи; здесь пример — октаноат C8. Использование свободной формы без карнитина тканеспецифично; не делать вывод о диете из одного препарата ткани.</dd></div><div id="ns-g-S7-T70"><dt>Этомоксир</dt><dd>Соединение, используемое для ингибирования CPT1 после образования активной формы в клетке. При высоких концентрациях возможны другие действия, включая нарушение обмена CoA; селективность проверяется в выбранной системе.</dd></div><div id="ns-g-S7-T71"><dt>Изотопный индикатор</dt><dd>Меченый атомами определённого изотопа субстрат, по распределению метки которого изучают превращения вещества. Метка в промежуточном пуле не равна автоматически полному окислению; расчёт потока требует модели и условий.</dd></div><div id="ns-g-S7-T72"><dt>SREBP1c</dt><dd>Транскрипционный фактор, участвующий в регуляции экспрессии генов синтеза липидов, особенно в обсуждаемом печёночном контексте. Результат действия инсулина может включать mTORC1-зависимые и независимые звенья.</dd></div><div id="ns-g-S7-T73"><dt>PPARα</dt><dd>Ядерный рецептор, регулирующий экспрессию ряда генов окислительного метаболизма в зависимости от лигандов и ткани. Экспрессия фермента и мгновенная скорость реакции различаются; не считать любое голодание прямым связыванием рецептора с одним лигандом.</dd></div><div id="ns-g-S7-T74"><dt>MCAD</dt><dd>Дегидрогеназа среднецепочечных ацил-CoA — фермент одной из реакций митохондриального β-окисления. Недостаточность MCAD нарушает последующую реакцию β-окисления и отличается от дефектов CPT1 и CPT2; клинические проявления этих состояний могут различаться.</dd></div><div id="ns-g-S7-T75"><dt>Макроаутофагия</dt><dd>Путь доставки цитоплазматического материала к лизосомному расщеплению через образование аутофагосомы. В основной схеме рассматривается канонический аппарат; аутофагия не является синонимом клеточной гибели.</dd></div><div id="ns-g-S7-T76"><dt>Фагофор</dt><dd>Растущая, ещё не замкнутая мембранная структура, охватывающая материал для макроаутофагии. Не путать с замкнутой аутофагосомой и аутолизосомой; расширение требует доставки и организации мембранных компонентов.</dd></div><div id="ns-g-S7-T77"><dt>Аутофагический поток</dt><dd>Скорость прохождения материала через заданные этапы аутофагического пути, часто до лизосомной деградации. Всегда уточнять измеряемый материал и конечный этап; число точек и содержание LC3-II не заменяют поток автоматически.</dd></div><div id="ns-g-S7-T78"><dt>PI3P</dt><dd>Фосфатидилинозитол-3-фосфат — мембранный липид, связываемый определёнными эффекторными белками. Не равен PIP₃ и не является свободным неорганическим фосфатом.</dd></div><div id="ns-g-S7-T79"><dt>WIPI2</dt><dd>PI3P-связывающий белок, участвующий в организации аутофагического аппарата и привлечении ATG16L1-комплекса. Роль связывания липида отличается от образования самого PI3P комплексом VPS34.</dd></div><div id="ns-g-S7-T80"><dt>ATG2</dt><dd>Белок переноса липидов, участвующий в контактах мембран и расширении фагофора. Не канал для прохода грузового белка в лизосому.</dd></div><div id="ns-g-S7-T81"><dt>ATG9</dt><dd>Мембранный белок со скрамблазной активностью, участвующий в формировании аутофагической мембраны. Перераспределяет липиды между слоями мембраны; не синтезирует липиды вместо ферментов обмена.</dd></div><div id="ns-g-S7-T82"><dt>ATG16L1-комплекс</dt><dd>Комплекс ATG12–ATG5–ATG16L1, организующий липидирование ATG8/LC3 в рассматриваемой системе. Его E3-подобная роль не означает убиквитинирования LC3.</dd></div><div id="ns-g-S7-T83"><dt>LC3-I/LC3-II</dt><dd>LC3-I — растворимая обработанная форма; LC3-II — липидированная форма, связанная с мембраной. Это формы маркера, а не количественный эквивалент всего груза; разные пути липидирования требуют отдельного контекста.</dd></div><div id="ns-g-S7-T84"><dt>ATG7 и ATG3</dt><dd>ATG7 — E1-подобный фермент систем конъюгации, участвующий, в частности, в активации LC3. ATG3 — E2-подобный фермент, участвующий в последующем переносе LC3 для присоединения к липиду. ATG7 и ATG3 выполняют разные этапы конъюгации. Утрата ATG7 нарушает выбранный канонический аппарат, но не удаляет все лизосомные реакции; ATG3 не является протеазой или фосфатазой.</dd></div><div id="ns-g-S7-T85"><dt>PE</dt><dd>Фосфатидилэтаноламин — мембранный липид, к которому присоединяется LC3 в основной канонической схеме. Не считать белком или свободной жирной кислотой; возможные иные липидные связи обсуждаются отдельно.</dd></div><div id="ns-g-S7-T86"><dt>Оборот LC3-II</dt><dd>Образование и удаление липидированной формы LC3 за заданное время. Не равен автоматически потоку расщепления всего белкового груза; нужно учитывать делипидирование и лизосомное удаление.</dd></div><div id="ns-g-S7-T87"><dt>Аутофагосома</dt><dd>Замкнутая структура с двумя мембранами, содержащая захваченный цитоплазматический материал. Её наличие не доказывает завершения гидролиза; внешняя мембрана участвует в слиянии с лизосомным компартментом.</dd></div><div id="ns-g-S7-T88"><dt>Аутолизосома</dt><dd>Структура, возникшая после слияния аутофагосомы с лизосомным или эндолизосомным компартментом. Слияние, pH и степень расщепления содержимого — разные признаки.</dd></div><div id="ns-g-S7-T89"><dt>SNARE</dt><dd>Белки мембранного слияния; выбранный пример аппарата включает STX17, SNAP29 и VAMP8. Не единственный набор для каждого аутофагического слияния; участие HOPS и RAB7 рассматривается отдельно.</dd></div><div id="ns-g-S7-T90"><dt>Лизосомные гидролазы и протеазы</dt><dd>Гидролаза катализирует расщепление определённой связи с участием воды. Лизосомные протеазы, включая соответствующие катепсины, — гидролазы, расщепляющие белки; другие лизосомные гидролазы действуют на иные субстраты. Кислая среда не заменяет отсутствующий фермент и его субстратную специфичность. В эксперименте с блокадой протеолиза нужно назвать ингибиторную комбинацию и полноту подавления; протеазы не обозначают все гидролазы.</dd></div><div id="ns-g-S7-T91"><dt>Бафиломицин A1</dt><dd>Ингибитор V-ATPase, нарушающий поддержание кислой среды эндолизосомных компартментов. Может влиять на слияние и сигнальные процессы; не считать селективным измерительным выключателем одной реакции.</dd></div><div id="ns-g-S7-T92"><dt>Восстановление лизосомного пула</dt><dd>Образование лизосомных структур из аутолизосом, описанное как autophagic lysosome reformation, ALR. Отличать от TFEB-зависимой экспрессии компонентов; время и необходимость конкретных регуляторов зависят от системы.</dd></div><div id="ns-g-S7-T93"><dt>Контроль</dt><dd>Сопоставимое условие или образец, позволяющие проверить интерпретацию измерения и действие вмешательства. Нужно назвать, что сохранено и что изменено; генетическое восстановление, контроль количества нанесённого белка и растворитель решают разные задачи.</dd></div><div id="ns-g-S7-T94"><dt>Тандемный репортёр LC3</dt><dd>Конструкция из двух флуорофоров и LC3, используемая для различения сигналов в условиях созревания компартментов. mRFP исходной работы и mCherry варианта семинара различаются; цвет чувствителен к среде и не равен полному потоку.</dd></div><div id="ns-g-S7-T95"><dt>GAA</dt><dd>Кислая α-глюкозидаза — лизосомный фермент гидролиза гликогена. Недостаточность GAA не равна первичной утрате ATG7; это не протеаза белкового груза.</dd></div><div id="ns-g-S7-T96"><dt>Болезнь Помпе</dt><dd>Наследственное заболевание, связанное с недостаточностью GAA и накоплением гликогена в лизосомах. Первичный ферментный дефект следует отличать от вторичных нарушений аутофагии.</dd></div><div id="ns-g-S7-T97"><dt>HMGCR</dt><dd>3-гидрокси-3-метилглутарил-CoA-редуктаза — фермент образования мевалоната в пути синтеза стеролов. Его AMPK-зависимое ингибирование не следует путать с реакцией ACC или прямым синтезом ATP.</dd></div><div id="ns-g-S7-T98"><dt>p62/SQSTM1</dt><dd>Белок-рецептор, участвующий в связывании части аутофагического груза и взаимодействиях с аппаратом ATG8/LC3. Его содержание зависит от экспрессии и деградации; оно не заменяет универсально измерение потока.</dd></div><div id="ns-g-S7-T99"><dt>Мукополисахаридозы</dt><dd>Группа наследственных болезней накопления, при классических формах которых нарушено лизосомное расщепление определённых гликозаминогликанов. У каждой формы нужно различать накапливающийся субстрат, фермент, активность которого снижена, и первичный генетический дефект. Болезнь Помпе — другое заболевание: при ней снижена активность GAA и накапливается гликоген.</dd></div></dl></section></noscript>
