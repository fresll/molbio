/a> снимает с белка гликан, и его разрушает 26S-протеасома — та же, что разрушает белки цитозоля.</li></ol><p>Перенос белка из просвета ЭПР в цитозоль называют ретротранслокацией. Для растворимых субстратов с повреждением в просвете ЭПР главный путь проходит через убиквитинлигазу HRD1. У дрожжей Hrd1 образует в мембране канал вместе с Der1 (Schoebel 2017), у млекопитающих канал, вероятно, образуют трансмембранные части HRD1, DERL2 и HERP (Christianson 2023). Белки с повреждением в мембранном или цитоплазматическом домене могут использовать другие лигазы. У дрожжей пути ERAD-L, ERAD-M и ERAD-C различаются набором убиквитинлигазных комплексов (Carvalho 2006).</p><p>Как только участок белка выходит в цитозоль, HRD1 с ферментами E2 присоединяет к нему убиквитин. Цепь связывает p97 (VCP; у дрожжей Cdc48) с кофакторами UFD1 и NPL4. За счёт гидролиза ATP p97 протягивает белок через свою центральную пору и разворачивает его (Bodnar 2017, реконструкция с дрожжевыми белками).</p><p>В цитозоле NGLY1 отщепляет гликан, и 26S-протеасома разрушает белок. Если звено нарушено, белок накапливается в разной форме. Без HRD1 он задерживается в ЭПР без убиквитина. При блоке p97 он убиквитинирован, но остаётся связанным с мембраной и несёт гликан. При блоке протеасомы он попадает в цитозоль без гликана.</p><p>Эти различия позволяют найти нарушенное звено экспериментально. Ингибиторы при этом действуют не только на ERAD: CB-5083 и бортезомиб вызывают накопление многих убиквитинированных белков и стресс ЭПР.</p><div class="note trap"><strong>Типичная ошибка</strong> Дефектный белок разрушается прямо в просвете ЭПР, где он и обнаружен.<p class="trap-fix">В ЭПР нет протеасом. Белок переносится через мембрану при участии SEL1L–HRD1, убиквитинируется, извлекается p97 и разрушается 26S-протеасомой в цитозоле.</p></div><div class="static-quiz"><h3>В клетках с NHK снизили содержание HRD1. В какой форме NHK будет накапливаться?</h3><ol><li><b>А.</b> В цитозоле без гликана, в убиквитинированной форме <i>(неверный вариант)</i><br><span class="expl">Так выглядит блок протеасомы: белок уже прошёл мембрану и потерял гликан. Без HRD1 белок через мембрану не проходит.</span></li><li><b>Б.</b> В просвете ЭПР с гликаном и почти без убиквитина <i>(верный вариант)</i><br><span class="expl">HRD1 нужен и для ретротранслокации, и для убиквитинирования. Без него NHK узнаётся OS-9, но остаётся в ЭПР с высокоманнозным гликаном и почти не убиквитинируется.</span></li><li><b>В.</b> В среде: NHK будет секретирован вместо распада <i>(неверный вариант)</i><br><span class="expl">Нарушение ERAD не делает несвёрнутый белок свёрнутым. NHK по-прежнему не проходит контроль качества и в аппарат Гольджи не выходит.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00633-8">Christianson J.C., Jarosch E., Sommer T. Mechanisms of substrate processing during ER-associated protein degradation. Nat Rev Mol Cell Biol. 2023;24:777–796</a></li><li><a href="https://doi.org/10.1038/nature23314">Schoebel S., Mi W., Stein A. et al. Cryo-EM structure of the protein-conducting ERAD channel Hrd1 in complex with Hrd3. Nature. 2017;548:352–355</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.04.020">Bodnar N.O., Rapoport T.A. Molecular mechanism of substrate processing by the Cdc48 ATPase complex. Cell. 2017;169:722–735</a></li><li><a href="https://doi.org/10.1038/ncb1689">Christianson J.C., Shaler T.A., Tyler R.E., Kopito R.R. OS-9 and GRP94 deliver mutant α1-antitrypsin to the Hrd1–SEL1L ubiquitin ligase complex for ERAD. Nat Cell Biol. 2008;10:272–282</a></li><li><a href="https://doi.org/10.1016/j.ccell.2015.10.002">Anderson D.J., Le Moigne R., Djakovic S. et al. Targeting the AAA ATPase p97 as an approach to treat cancer through disruption of protein homeostasis. Cancer Cell. 2015;28:653–665</a></li><li><a href="https://doi.org/10.1016/j.cell.2006.05.043">Carvalho P., Goder V., Rapoport T.A. Distinct ubiquitin-ligase complexes define convergent pathways for the degradation of ER proteins. Cell. 2006;126:361–373</a></li></ul><p>Схема механизма, качественные состояния; клетки млекопитающих. Структура канала Hrd1 — у дрожжей (Schoebel 2017; аннотация); состав канала у млекопитающих и порядок событий — обзор Christianson 2023 (полный текст). Работа p97 — реконструкция с дрожжевыми белками (Bodnar 2017; аннотация). Роль HRD1–SEL1L в распаде NHK — клетки человека (Christianson 2008); CB-5083 — опухолевые клетки (Anderson 2015). Пути ERAD-L/-M/-C определены у дрожжей (Carvalho 2006).</p></details></article><article class="card print-unit" id="ns-erad-disease"><div class="eyebrow">N-гликаны и ERAD · шаг 17 из 26</div><h2>Что происходит при нарушениях контроля качества в ЭПР</h2><p class="lead">Контроль качества ЭПР защищает клетку от несвёрнутых белков, но тот же механизм может лишить её белка, который частично работал бы. В разных случаях нарушается разное звено.</p><ol class="mech"><li>Мутация в гене секреторного белка может нарушить его сворачивание: он задерживается в ЭПР и разрушается по пути ERAD, как NHK.</li><li>Белок со сниженной способностью сворачиваться (ΔF508-CFTR) тоже разрушается; корректоры, связывая его, повышают долю свёрнутого белка.</li><li>Нарушение самого ERAD (дефицит NGLY1) или его использование вирусом (US11 цитомегаловируса) меняет судьбу белков, проходящих этот путь.</li></ol><p>NHK — укороченный вариант α1-антитрипсина, который не может свернуться. В клетках гепатомы мыши он задерживался в ЭПР и не секретировался (Sifers 1988), а затем разрушался протеасомой (Liu 1999). У носителя такого аллеля α1-антитрипсина в сыворотке не обнаружено. Этот пример показывает, что контроль качества задерживает белок, который не может свернуться, ещё до секреции.</p><p>Белок CFTR при мутации ΔF508 сворачивается плохо. Его незрелая форма разрушается по убиквитин-протеасомному пути, а при ингибировании протеасом накапливается в полиубиквитинированной форме (Ward 1995). Однако ингибирование ERAD не выводит на мембрану работающий канал: белок остаётся несвёрнутым. Корректоры люмакафтор и тезакафтор связываются с трансмембранным доменом TMD1 и стабилизируют его (Fiedorczuk 2022), поэтому до мембраны доходит больше свёрнутого белка.</p><p>При мутациях NGLY1 у больных отмечали задержку развития, нарушения движений, гипотонию и сниженное слёзоотделение (Enns 2014). Механизм этих проявлений обсуждается.</p><p>Белок US11 цитомегаловируса человека направляет тяжёлые цепи MHC I из ЭПР в цитозоль, где их гликан снимается и они разрушаются протеасомой (Wiertz 1996). В результате меньше молекул MHC I достигает поверхности клетки.</p><div class="note trap"><strong>Типичная ошибка</strong> При нарушении сворачивания белка в ЭПР достаточно ингибировать ERAD, и белок дойдёт до мембраны работоспособным.<p class="trap-fix">Ингибирование ERAD сохраняет несвёрнутый белок в ЭПР, но не сворачивает его. Количество функционального CFTR на мембране повышают корректоры, которые стабилизируют его структуру.</p></div><div class="static-quiz"><h3>В культуре клеток с ΔF508-CFTR надо увеличить количество свёрнутого CFTR на плазматической мембране. Какое воздействие действует именно в этом направлении?</h3><ol><li><b>А.</b> Корректор, стабилизирующий структуру CFTR <i>(верный вариант)</i><br><span class="expl">Корректоры связываются с CFTR и повышают долю свёрнутого белка, который проходит контроль качества и доходит до мембраны (Fiedorczuk 2022).</span></li><li><b>Б.</b> Ингибитор протеасомы, останавливающий распад CFTR <i>(неверный вариант)</i><br><span class="expl">Ингибитор протеасомы сохраняет незрелую форму, но она остаётся несвёрнутой и накапливается в полиубиквитинированном виде, а не на мембране (Ward 1995).</span></li><li><b>В.</b> Ингибитор p97, задерживающий CFTR в мембране ЭПР <i>(неверный вариант)</i><br><span class="expl">Задержка извлечения не исправляет сворачивание. Несвёрнутый CFTR не проходит контроль качества и не выходит из ЭПР.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pubmed.ncbi.nlm.nih.gov/3259232/">Sifers R.N., Brashears-Macatee S., Kidd V.J., Muensch H., Woo S.L. A frameshift mutation results in a truncated α1-antitrypsin that is retained within the rough endoplasmic reticulum. J Biol Chem. 1988;263:7330–7335</a></li><li><a href="https://doi.org/10.1074/jbc.274.9.5861">Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867</a></li><li><a href="https://doi.org/10.1016/0092-8674(95)90240-6">Ward C.L., Omura S., Kopito R.R. Degradation of CFTR by the ubiquitin-proteasome pathway. Cell. 1995;83:121–127</a></li><li><a href="https://doi.org/10.1016/j.cell.2021.12.009">Fiedorczuk K., Chen J. Mechanism of CFTR correction by type I folding correctors. Cell. 2022;185:158–168</a></li><li><a href="https://doi.org/10.1038/gim.2014.22">Enns G.M., Shashi V., Bainbridge M. et al. Mutations in NGLY1 cause an inherited disorder of the endoplasmic reticulum-associated degradation pathway. Genet Med. 2014;16:751–758. Исправление: Genet Med. 2014;16:568, doi:10.1038/gim.2014.61 (добавлен автор)</a></li><li><a href="https://doi.org/10.1016/s0092-8674(00)81054-5">Wiertz E.J., Jones T.R., Sun L. et al. The human cytomegalovirus US11 gene product dislocates MHC class I heavy chains from the endoplasmic reticulum to the cytosol. Cell. 1996;84:769–779</a></li></ul><p>Описания случаев по первичным работам (аннотации): NHK — клетки гепатомы мыши (Sifers 1988; Liu 1999); ΔF508-CFTR — культуры клеток (Ward 1995); механизм корректоров — криоэлектронная микроскопия очищенного CFTR (Fiedorczuk 2022); дефицит NGLY1 — описание 8 больных (Enns 2014); US11 — трансфицированные клетки человека (Wiertz 1996). Это примеры механизмов, а не рекомендации по лечению.</p></details></article><article class="card print-unit" id="ns-erad-measure"><div class="eyebrow">N-гликаны и ERAD · шаг 18 из 26</div><h2>Как проследить судьбу гликопротеина: импульсная метка и Endo H</h2><p class="lead">Чтобы отличить задержку белка в ЭПР от его секреции или распада, прослеживают судьбу одной когорты меченых молекул и проверяют, какой у них гликан.</p><ol class="mech"><li>Короткий импульс с ³⁵S-метионином и ³⁵S-цистеином метит только молекулы, синтезированные за эти минуты; затем метку «гасят» немечеными аминокислотами.</li><li>Через разное время белок осаждают антителами из клеток и среды и разделяют электрофорезом.</li><li><a href="#ns-g-S11-T43">Endo H</a> отщепляет высокоманнозные и часть гибридных гликанов, но не комплексные: устойчивость к ней показывает, что белок прошёл medial-Гольджи; PNGase F снимает почти все N-гликаны.</li></ol><p>При импульсной метке клетки несколько минут инкубируют с радиоактивными аминокислотами, затем переносят в среду с избытком немеченых. Поэтому на геле видна только когорта, синтезированная во время импульса, и её можно прослеживать часами. Убывание полосы в клетках с одновременным появлением её в среде означает секрецию, а убывание без появления в среде — разрушение.</p><p>Чтобы узнать, где находится белок, половину каждой пробы обрабатывают Endo H. Этот фермент отщепляет высокоманнозные гликаны, характерные для ЭПР и cis-Гольджи, и часть гибридных, но не комплексные, которые образуются в medial-Гольджи. Сдвиг полосы вниз после Endo H показывает, что белок ещё не прошёл medial-Гольджи. Если полоса не сдвигается после Endo H, но сдвигается после PNGase F, гликан комплексный.</p><p>Ингибиторы отдельных звеньев уточняют путь. Кифунензин замедляет распад гликопротеинов, если для него нужно отщепление маннозы. Ингибитор протеасомы показывает, что белок разрушается в цитозоле, а появление формы без гликана говорит, что он уже выведен из ЭПР.</p><p>Ограничения: метод показывает поведение всей когорты, Endo H не различает ЭПР и cis-Гольджи, а сами ингибиторы меняют клетку — например, кифунензин подавляет и маннозидазу I аппарата Гольджи, и тогда секретированный белок остаётся чувствительным к Endo H (Elbein 1990).</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок чувствителен к Endo H, значит, он находится в ЭПР, а если устойчив — значит, он уже на поверхности клетки.<p class="trap-fix">Чувствительность к Endo H показывает только, что гликан высокоманнозный или гибридный, то есть ещё не комплексный: белок может быть и в ЭПР, и в cis-Гольджи. Устойчивость означает прохождение medial-Гольджи, а не обязательно выход на поверхность.</p></div><div class="static-quiz"><h3>Через 2 ч прослеживания полоса меченого гликопротеина из клеток не сдвигается после обработки Endo H, но сдвигается после обработки PNGase F. Что можно заключить?</h3><ol><li><b>А.</b> Белок находится в ЭПР: гликан высокоманнозный <i>(неверный вариант)</i><br><span class="expl">Высокоманнозный гликан Endo H отщепила бы, и полоса сдвинулась бы. Устойчивость к Endo H говорит о другом.</span></li><li><b>Б.</b> Белок потерял гликан в цитозоле после ERAD <i>(неверный вариант)</i><br><span class="expl">Белок без гликана не сдвигался бы и после PNGase F. Сдвиг после PNGase F показывает, что гликан на белке есть.</span></li><li><b>В.</b> Белок прошёл medial-Гольджи: гликан стал комплексным <i>(верный вариант)</i><br><span class="expl">Комплексный гликан Endo H не отщепляет, а PNGase F снимает. Значит, белок прошёл medial-Гольджи; где он сейчас — в Гольджи или дальше, — этот тест не показывает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.274.9.5861">Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/2144287/">Elbein A. D., Tropea J. E., Mitchell M., Kaushal G. P. Kifunensine, a potent inhibitor of the glycoprotein processing mannosidase I. J Biol Chem. 1990;265:15599–15605</a></li><li><a href="https://doi.org/10.1038/s41580-025-00855-y">Guay K.P., Chou W.-C., Canniff N.P., Paul K.B., Hebert D.N. N-glycan-dependent protein maturation and quality control in the ER. Nat Rev Mol Cell Biol. 2025;26:926–939</a></li></ul><p>Схемы методов, условные пиктограммы, а не данные эксперимента. Принцип Endo H и PNGase F — общепринятый биохимический метод. Применение к NHK — Liu 1999 (клетки гепатомы; аннотация). Действие кифунензина на маннозидазу I аппарата Гольджи — Elbein 1990 (клетки MDCK и микросомы печени крысы; аннотация).</p></details></article><article class="card print-unit" id="ns-autophagy-flux"><div class="eyebrow">Аутофагический поток · шаг 19 из 26</div><h2>Что называют аутофагическим потоком</h2><p class="lead">При макроаутофагии участок цитоплазмы заключается в мембрану аутофагосомы, доставляется в лизосому и там расщепляется. <a href="#ns-g-S11-T45">Аутофагический поток</a> — скорость всего этого пути, а не число структур, видимых в клетке в данный момент.</p><ol class="mech"><li>Комплекс ULK1 начинает образование <a href="#ns-g-S11-T47">изолирующей мембраны</a>; мембрана растёт, захватывает участок цитоплазмы и замыкается в <a href="#ns-g-S11-T46">аутофагосому</a>.</li><li>Аутофагосома сливается с лизосомой и превращается в <a href="#ns-g-S11-T48">аутолизосому</a>, где в кислой среде гидролазы расщепляют груз и внутреннюю мембрану.</li><li>Продукты расщепления — аминокислоты, жирные кислоты, нуклеозиды — переносятся в цитозоль и снова используются клеткой.</li></ol><p>Аутофагия — путь доставки компонентов цитоплазмы в лизосому. В этом разделе речь идёт о макроаутофагии: груз заключается в двойную мембрану аутофагосомы. Другие формы (микроаутофагия, шаперон-опосредованная аутофагия) устроены иначе, а избирательное удаление органелл будет предметом следующего семинара.</p><p>Путь состоит из последовательных этапов: инициация, образование и рост изолирующей мембраны, её замыкание, слияние аутофагосомы с лизосомой и расщепление содержимого. Каждый этап можно нарушить отдельно, и тогда структуры, образовавшиеся до места блока, накапливаются. Например, при подавлении лизосомных протеаз путь останавливается на последнем этапе, и в клетке накапливаются аутолизосомы с нерасщеплённым грузом.</p><p>Поэтому число аутофагосом в клетке — это содержание (пул), которое зависит от двух скоростей: образования и удаления. Пул растёт и при усилении образования, и при задержке слияния или расщепления. Аутофагическим потоком называют скорость доставки материала в лизосомы и его расщепления (Klionsky 2021).</p><p>Отсюда главное правило измерения: одного снимка структур недостаточно. Нужно сравнение с условием, в котором удаление заблокировано, или прямая оценка расщепления. Как это делают на практике, разобрано в последнем шаге раздела.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем больше аутофагосом в клетке, тем сильнее аутофагия.<p class="trap-fix">Число аутофагосом — это пул: оно растёт и при усиленном образовании, и при нарушенном слиянии или расщеплении. Об аутофагии судят по потоку — скорости доставки и расщепления материала в лизосомах.</p></div><div class="static-quiz"><h3>В клетках через 2 ч после воздействия число аутофагосом в 3 раза больше, чем в контроле. Других измерений нет. Какой вывод об аутофагическом потоке допустим?</h3><ol><li><b>А.</b> Поток вырос примерно в 3 раза вслед за числом аутофагосом <i>(неверный вариант)</i><br><span class="expl">Число аутофагосом — пул. Его утроение возможно и при неизменном или сниженном потоке, если задержано слияние или расщепление.</span></li><li><b>Б.</b> Поток снизился, потому что аутофагосомы не сливаются <i>(неверный вариант)</i><br><span class="expl">Задержка слияния — лишь одно из возможных объяснений. Тот же пул дало бы и усиленное образование при сохранённом слиянии.</span></li><li><b>В.</b> По этим данным изменение потока определить нельзя <i>(верный вариант)</i><br><span class="expl">Рост пула возможен и при усилении образования, и при блоке позднего этапа. Нужен второй показатель: сравнение с условием, где удаление заблокировано, или оценка расщепления.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D.J., Abdel-Aziz A.K., Abdelfatah S. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382.</a></li><li><a href="https://doi.org/10.1038/s41580-020-0241-0">Nakatogawa H. Mechanisms governing autophagosome biogenesis. Nat Rev Mol Cell Biol. 2020;21:439–458.</a></li></ul><p>Схема механизма, качественные состояния; клетки млекопитающих в культуре, макроаутофагия. Определение потока и требования к его измерению — по руководству Klionsky 2021 (полный текст, разделы о LC3 и о распаде долгоживущих белков). Этапы образования аутофагосомы — по обзору Nakatogawa 2020. Уровни «мало / много» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-ulk1-init"><div class="eyebrow">Аутофагический поток · шаг 20 из 26</div><h2>Как ULK1 и VPS34 начинают образование аутофагосомы</h2><p class="lead">Образование аутофагосомы начинается с киназного <a href="#ns-g-S11-T49">комплекса ULK1</a>. Когда mTORC1 перестаёт его подавлять, ULK1 фосфорилирует субъединицы <a href="#ns-g-S11-T50">комплекса VPS34</a>, и на мембране появляется PI3P — сигнал для следующих белков аутофагии.</p><ol class="mech"><li>При достатке аминокислот mTORC1 фосфорилирует ULK1 по S758 у человека (S757 у мыши) и ATG13, и комплекс ULK1 неактивен.</li><li>При снижении активности mTORC1 комплекс ULK1 (ULK1, ATG13, FIP200, ATG101) активируется и фосфорилирует BECN1 в составе комплекса VPS34 с ATG14.</li><li>VPS34 фосфорилирует фосфатидилинозитол и образует на изолирующей мембране фосфатидилинозитол-3-фосфат (PI3P), с которым связываются белки следующего этапа.</li></ol><p>Комплекс ULK1 состоит из киназы ULK1 (у млекопитающих есть и близкая ULK2) и белков ATG13, FIP200 и ATG101 (Zachari 2017). Он собирается в месте будущей изолирующей мембраны, часто рядом с ЭПР, и служит платформой для других белков аутофагии.</p><p>При достатке аминокислот активный mTORC1 фосфорилирует ULK1 по S758 у человека (S757 у мыши) и ATG13; в таком состоянии комплекс почти не запускает аутофагию (Kim 2011). Когда аминокислот нет, активность mTORC1 снижается, ингибирующее фосфорилирование уменьшается, и ULK1 активируется. AMPK фосфорилирует другие сайты ULK1. По классической схеме это стимулирует аутофагию; в новых работах при дефиците энергии AMPK скорее сдерживает её (Park 2023). Эффект зависит от вида стресса, его длительности и типа клеток.</p><p>Активная ULK1 фосфорилирует BECN1 по S15 у человека (S14 у мыши) и усиливает активность комплекса фосфатидилинозитол-3-киназы класса III, содержащего VPS34, VPS15, BECN1 и ATG14 (Russell 2013). Этот комплекс образует на изолирующей мембране PI3P. Без ATG14 те же белки входят в комплексы эндоцитарного пути, поэтому VPS34 работает не только в аутофагии.</p><p>Ингибиторы помогают проверить последовательность этапов. При подавлении ULK1 препаратом MRT68921 аутофагия блокируется, а в клетках накапливаются незавершённые ранние структуры (Petherick 2015). SAR405 подавляет VPS34 и аутофагию, но нарушает и работу поздних эндосом и лизосом (Ronan 2014).</p><p>Кроме быстрого переключения ULK1, есть медленный, транскрипционный уровень регуляции. Активный mTORC1 фосфорилирует <a href="#ns-g-S11-T64">транскрипционный фактор TFEB</a> (в частности, по S211); фосфорилированный TFEB связывается с белками 14-3-3 и остаётся в цитоплазме (Martina 2012; Roczniak-Ferguson 2012). При снижении активности mTORC1 TFEB переходит в ядро и усиливает транскрипцию генов лизосомных белков (Sardiello 2009) и белков аутофагии (Martina 2012). Близкий фактор TFE3 регулируется сходным образом (Martina 2014). Фосфорилирование ULK1 меняется за минуты, а новые белки лизосом и аутофагии появляются позже, после транскрипции и трансляции. В результате при длительном голодании клетка не только запускает аутофагию, но и увеличивает ёмкость лизосом, в которые доставляется материал.</p><div class="note trap"><strong>Типичная ошибка</strong> ULK1 сама строит мембрану аутофагосомы, перенося на неё липиды.<p class="trap-fix">ULK1 — протеинкиназа: она фосфорилирует белки, в том числе BECN1 в комплексе VPS34. Липид PI3P образует VPS34, а рост мембраны обеспечивают другие белки — ATG9, ATG2 и система присоединения LC3.</p></div><div class="static-quiz"><h3>Клетки находятся в среде без аминокислот; активность mTORC1 снижена. В среду добавили MRT68921 — ингибитор киназы ULK1. Как изменится образование PI3P на изолирующей мембране?</h3><ol><li><b>А.</b> Усилится: ULK1 больше не конкурирует с VPS34 <i>(неверный вариант)</i><br><span class="expl">ULK1 не конкурирует с VPS34, а стимулирует её: фосфорилирование BECN1 повышает активность комплекса VPS34 с ATG14.</span></li><li><b>Б.</b> Снизится: ULK1 не активирует комплекс VPS34 <i>(верный вариант)</i><br><span class="expl">Активная ULK1 фосфорилирует BECN1 и усиливает работу комплекса VPS34 с ATG14. При подавлении ULK1 PI3P на изолирующей мембране образуется меньше, и инициация аутофагии нарушается.</span></li><li><b>В.</b> Не изменится: VPS34 активируется только mTORC1 <i>(неверный вариант)</i><br><span class="expl">mTORC1 действует на этот этап через ULK1, подавляя её; без активной ULK1 снижение активности mTORC1 не приводит к усилению работы VPS34.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/EBC20170021">Zachari M., Ganley I.G. The mammalian ULK1 complex and autophagy initiation. Essays Biochem. 2017;61:585–596.</a></li><li><a href="https://doi.org/10.1038/ncb2152">Kim J., Kundu M., Viollet B., Guan K.-L. AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1. Nat Cell Biol. 2011;13:132–141.</a></li><li><a href="https://doi.org/10.1038/s41467-023-38401-z">Park J.-M., Lee D.-H., Kim D.-H. Redefining the role of AMPK in autophagy and the energy stress response. Nat Commun. 2023;14:2994.</a></li><li><a href="https://doi.org/10.1038/ncb2757">Russell R.C., Tian Y., Yuan H. et al. ULK1 induces autophagy by phosphorylating Beclin-1 and activating VPS34 lipid kinase. Nat Cell Biol. 2013;15:741–750.</a></li><li><a href="https://doi.org/10.1074/jbc.C114.627778">Petherick K.J., Conway O.J., Mpamhanga C. et al. Pharmacological inhibition of ULK1 kinase blocks mammalian target of rapamycin (mTOR)-dependent autophagy. J Biol Chem. 2015;290:11376–11383. Исправление: J Biol Chem. 2015;290:28726, doi:10.1074/jbc.A114.627778, PMID 26614783 (исправлены структурные формулы MRT67307 и MRT68921 на рис. 1A).</a></li><li><a href="https://doi.org/10.1038/nchembio.1681">Ronan B., Flamand O., Vescovi L. et al. A highly potent and selective Vps34 inhibitor alters vesicle trafficking and autophagy. Nat Chem Biol. 2014;10:1013–1019.</a></li><li><a href="https://doi.org/10.1126/science.1174447">Sardiello M., Palmieri M., di Ronza A. et al. A gene network regulating lysosomal biogenesis and function. Science. 2009;325:473–477.</a></li><li><a href="https://doi.org/10.4161/auto.19653">Martina J.A., Chen Y., Gucek M., Puertollano R. MTORC1 functions as a transcriptional regulator of autophagy by preventing nuclear transport of TFEB. Autophagy. 2012;8:903–914.</a></li><li><a href="https://doi.org/10.1126/scisignal.2002790">Roczniak-Ferguson A., Petit C.S., Froehlich F. et al. The transcription factor TFEB links mTORC1 signaling to transcriptional control of lysosome homeostasis. Sci Signal. 2012;5:ra42.</a></li><li><a href="https://doi.org/10.1126/scisignal.2004754">Martina J.A., Diab H.I., Lishu L. et al. The nutrient-responsive transcription factor TFE3 promotes autophagy, lysosomal biogenesis, and clearance of cellular debris. Sci Signal. 2014;7:ra9.</a></li></ul><p>Схема механизма, качественные состояния; клетки млекопитающих в культуре, дефицит аминокислот или подавление mTORC1. Сайты фосфорилирования: ULK1 S758 человека (S757 мыши; Kim 2011, клетки мыши и человека), BECN1 S15 человека (S14 мыши; Russell 2013). Противоречивая роль AMPK — Park 2023 (экспериментальная работа на культурах клеток: при дефиците глюкозы или нарушении работы митохондрий AMPK подавляла активацию ULK1 и аутофагию, вызванные отсутствием аминокислот; реферат). При других воздействиях и в других клетках результат может быть иным. Ингибиторы: MRT68921 — Petherick 2015 (клетки мыши и человека, указаны рефераты); SAR405 — Ronan 2014. Транскрипционная регуляция через TFEB и TFE3 — Sardiello 2009, Martina 2012, Roczniak-Ferguson 2012, Martina 2014 (клетки человека и мыши; рефераты); на схеме этот уровень не показан. Уровни на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-lc3-lipidation"><div class="eyebrow">Аутофагический поток · шаг 21 из 26</div><h2>Как LC3 присоединяется к мембране и что означает LC3-II</h2><p class="lead"><a href="#ns-g-S11-T52">LC3</a> присоединяется к липиду мембраны с помощью ферментов, похожих на ферменты убиквитинирования. Образующийся LC3-II — главный белковый признак мембран аутофагосом, но не абсолютный.</p><ol class="mech"><li>Протеаза ATG4 отщепляет C-концевой фрагмент предшественника LC3 и открывает остаток глицина: образуется растворимый LC3-I.</li><li><a href="#ns-g-S11-T53">ATG7</a> (E1-подобный фермент) и ATG3 (E2-подобный) присоединяют LC3-I к фосфатидилэтаноламину мембраны; так образуется LC3-II.</li><li><a href="#ns-g-S11-T51">WIPI2</a> связывается с PI3P и привлекает <a href="#ns-g-S11-T54">комплекс ATG12–ATG5–ATG16L1</a>, который направляет и ускоряет перенос LC3 именно на изолирующую мембрану.</li></ol><p>LC3 — белок семейства ATG8 размером около 15 кДа. Предшественник LC3 разрезается протеазой ATG4, и на C-конце открывается остаток глицина; эту растворимую форму называют LC3-I. Цепь реакций присоединения напоминает убиквитинирование: ATG7 активирует LC3-I, затратив ATP, и передаёт его на ATG3, а ATG3 переносит LC3 на аминогруппу фосфатидилэтаноламина. ATG7 участвует и во второй системе — образовании конъюгата ATG12–ATG5, где роль E2-подобного фермента выполняет ATG10.</p><p>Место реакции задаёт предыдущий этап. WIPI2 связывается с PI3P на изолирующей мембране и привлекает комплекс ATG12–ATG5–ATG16L1 (Dooley 2014). Этот комплекс работает как E3-подобный фермент: он ускоряет перенос LC3 с ATG3 на липид. Так LC3-II появляется на обеих поверхностях растущей мембраны, а после замыкания — на наружной и внутренней мембранах аутофагосомы.</p><p>LC3-II на внутренней мембране разрушается в аутолизосоме вместе с грузом, а с наружной мембраны может отщепляться протеазой ATG4. На блоте LC3-II движется быстрее LC3-I. У мышей без Atg7 нарушены обе системы конъюгации и образование аутофагосом, а в клетках накапливаются убиквитин-положительные агрегаты (Komatsu 2005).</p><p>Граница вывода: LC3-II бывает не только на аутофагосомах. При неканоническом присоединении (CASM) белки ATG8 присоединяются к одинарным мембранам эндолизосомного пути, в том числе к фосфатидилсерину (Durgan 2021). Поэтому LC3-II — показатель присоединения LC3, а не прямое число аутофагосом.</p><div class="note trap"><strong>Типичная ошибка</strong> LC3-II — это особый белок, который синтезируется только при аутофагии.<p class="trap-fix">LC3-II — тот же LC3, но присоединённый к липиду мембраны. Его образование зависит от ATG7 и ATG3, а содержание LC3-II отражает баланс между присоединением и разрушением, а не только синтез.</p></div><div class="static-quiz"><h3>В клетках нокаутирован ген ATG7. Клетки 2 ч держат в среде без аминокислот и снимают блот на LC3. Какой результат ожидается?</h3><ol><li><b>А.</b> Полоса LC3-II сильнее, чем в клетках дикого типа <i>(неверный вариант)</i><br><span class="expl">Сильная полоса LC3-II означала бы, что присоединение LC3 к мембране идёт. Без ATG7 нет E1-подобного фермента этой реакции.</span></li><li><b>Б.</b> Полоса LC3-I есть, полосы LC3-II нет <i>(верный вариант)</i><br><span class="expl">ATG7 активирует LC3-I для переноса на фосфатидилэтаноламин. Без него LC3 остаётся в растворимой форме LC3-I, а LC3-II не образуется.</span></li><li><b>В.</b> Нет ни полосы LC3-I, ни полосы LC3-II <i>(неверный вариант)</i><br><span class="expl">Без ATG7 не идёт присоединение LC3 к липиду, но сам белок LC3 синтезируется и разрезается ATG4; полоса LC3-I сохраняется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-020-0241-0">Nakatogawa H. Mechanisms governing autophagosome biogenesis. Nat Rev Mol Cell Biol. 2020;21:439–458.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.05.021">Dooley H.C., Razi M., Polson H.E. et al. WIPI2 links LC3 conjugation with PI3P, autophagosome formation, and pathogen clearance by recruiting Atg12–5-16L1. Mol Cell. 2014;55:238–252.</a></li><li><a href="https://doi.org/10.1083/jcb.200412022">Komatsu M., Waguri S., Ueno T. et al. Impairment of starvation-induced and constitutive autophagy in Atg7-deficient mice. J Cell Biol. 2005;169:425–434.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2021.03.020">Durgan J., Lystad A.H., Sloan K. et al. Non-canonical autophagy drives alternative ATG8 conjugation to phosphatidylserine. Mol Cell. 2021;81:2031–2040.</a></li></ul><p>Схема механизма, качественные состояния; клетки млекопитающих. Последовательность реакций — по обзору Nakatogawa 2020 (полный текст). WIPI2 и ATG16L1 — Dooley 2014 (клетки человека, реферат). Мыши с условным нокаутом Atg7 — Komatsu 2005 (реферат). Неканоническое присоединение ATG8 к фосфатидилсерину — Durgan 2021 (клетки млекопитающих, реферат). Уровни на схеме условны.</p></details></article><article class="card print-unit" id="ns-fusion-degradation"><div class="eyebrow">Аутофагический поток · шаг 22 из 26</div><h2>Как аутофагосома сливается с лизосомой и где расщепляется её содержимое</h2><p class="lead">Слияние, закисление и расщепление — три отдельных этапа после замыкания аутофагосомы. Их нарушают разные воздействия, и каждое оставляет свой след.</p><ol class="mech"><li><a href="#ns-g-S11-T55">STX17</a> встраивается в наружную мембрану замкнутой аутофагосомы и вместе с SNAP29 и лизосомным VAMP8 образует комплекс SNARE, сближающий мембраны.</li><li>После слияния <a href="#ns-g-S11-T56">V-ATPase</a> лизосомной мембраны поддерживает кислую среду, нужную лизосомным гидролазам.</li><li>Катепсины и другие гидролазы расщепляют груз и внутреннюю мембрану вместе с LC3-II; продукты переносятся в цитозоль.</li></ol><p>STX17 появляется на наружной мембране аутофагосомы после её замыкания и отсутствует на незамкнутой изолирующей мембране (Itakura 2012). С SNAP29 и VAMP8 он образует комплекс SNARE, который участвует в слиянии с лизосомой. При снижении содержания STX17 аутофагосомы накапливаются, а их содержимое не расщепляется. Слияние может идти и без STX17: описан второй комплекс SNARE с YKT6, поэтому в клетках, нокаутных по STX17, слияние сохраняется частично (Matsui 2018).</p><p>В аутолизосоме V-ATPase переносит протоны в просвет и поддерживает кислую среду. Катепсины активны именно в ней. Бафиломицин A1 ингибирует V-ATPase и нарушает закисление. В жировом теле дрозофилы закисление и слияние удалось разделить: лизосомы без V-ATPase сливались с аутофагосомами, а бафиломицин слияние блокировал — через побочную мишень, Ca²⁺-насос SERCA (Mauvezin 2015).</p><p>Хлорохин накапливается в кислых органеллах; в клетках он нарушает прежде всего слияние аутофагосом с лизосомами, а не закисление (Mauthe 2018). E64d и пепстатин A ингибируют лизосомные протеазы: слияние и закисление сохраняются, но белки груза не расщепляются.</p><p>Эти воздействия часто называют одним словом «ингибиторы лизосом», но они блокируют разные этапы. Поэтому вывод «аутофагия заблокирована» нужно сопровождать указанием, какой именно этап нарушен.</p><div class="note trap"><strong>Типичная ошибка</strong> Бафиломицин, хлорохин и ингибиторы протеаз одинаково «выключают лизосому».<p class="trap-fix">Они действуют на разные этапы: бафиломицин подавляет закисление (и в некоторых клетках слияние), хлорохин прежде всего нарушает слияние, ингибиторы протеаз — расщепление при сохранённом закислении.</p></div><div class="static-quiz"><h3>Клетки без аминокислот с тандемным репортёром mCherry-GFP-LC3 обработали E64d и пепстатином A — ингибиторами лизосомных протеаз. Что произойдёт с закислением аутолизосом?</h3><ol><li><b>А.</b> Закисление прекратится, как при бафиломицине <i>(неверный вариант)</i><br><span class="expl">Бафиломицин ингибирует V-ATPase. Ингибиторы протеаз действуют на ферменты внутри аутолизосомы и протонную помпу не затрагивают.</span></li><li><b>Б.</b> Закисление не начнётся, потому что слияние нарушено <i>(неверный вариант)</i><br><span class="expl">Нарушение слияния характерно для хлорохина или снижения содержания STX17. Ингибиторы протеаз действуют после слияния.</span></li><li><b>В.</b> Закисление сохранится, но груз не будет расщепляться <i>(верный вариант)</i><br><span class="expl">V-ATPase продолжает работать, среда в аутолизосомах кислая (красные точки репортёра), но протеазы подавлены, поэтому груз и LC3-II накапливаются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2012.11.001">Itakura E., Kishi-Itakura C., Mizushima N. The hairpin-type tail-anchored SNARE syntaxin 17 targets to autophagosomes for fusion with endosomes/lysosomes. Cell. 2012;151:1256–1269.</a></li><li><a href="https://doi.org/10.1083/jcb.201712058">Matsui T., Jiang P., Nakano S. et al. Autophagosomal YKT6 is required for fusion with lysosomes independently of syntaxin 17. J Cell Biol. 2018;217:2633–2645.</a></li><li><a href="https://doi.org/10.1038/ncomms8007">Mauvezin C., Nagy P., Juhász G., Neufeld T.P. Autophagosome–lysosome fusion is independent of V-ATPase-mediated acidification. Nat Commun. 2015;6:7007.</a></li><li><a href="https://doi.org/10.1080/15548627.2018.1474314">Mauthe M., Orhon I., Rocchi C. et al. Chloroquine inhibits autophagic flux by decreasing autophagosome–lysosome fusion. Autophagy. 2018;14:1435–1455.</a></li></ul><p>Схема механизма, качественные состояния. STX17 — клетки млекопитающих (HeLa, MEF; Itakura 2012); YKT6 и частичное слияние без STX17 — клетки HeLa (Matsui 2018). Разделение закисления и слияния — жировое тело дрозофилы и клетки млекопитающих (Mauvezin 2015). Хлорохин — клетки человека и мыши, ткани мышей (Mauthe 2018). Указаны рефераты; уровни на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-autophagy-significance"><div class="eyebrow">Аутофагический поток · шаг 23 из 26</div><h2>Для чего клетке аутофагия и что происходит при её нарушении</h2><p class="lead">Аутофагия поставляет мономеры при дефиците питательных веществ и удаляет то, что не может разрушить протеасома, — крупные агрегаты и органеллы. Её нарушение проявляется прежде всего в долгоживущих клетках.</p><ol class="mech"><li>При дефиците аминокислот аутофагия расщепляет часть собственных белков; освобождённые аминокислоты снова активируют mTORC1, который ограничивает аутофагию и запускает восстановление лизосом.</li><li>Адаптер <a href="#ns-g-S11-T58">p62</a> связывает убиквитинированные белки и LC3 и вместе с грузом попадает в аутофагосому, где разрушается.</li><li>При нарушении аутофагии p62 и убиквитинированные белки накапливаются в агрегатах; в нейронах и гепатоцитах это сопровождается повреждением клеток.</li></ol><p>При отсутствии аминокислот в среде аутофагия становится их внутренним источником. В клетках NRK после удаления сыворотки и глутамина активность mTORC1 сначала падала, а затем восстанавливалась за счёт продуктов аутофагического расщепления; повторная активация mTORC1 ограничивала аутофагию и запускала восстановление лизосом из аутолизосом (Yu 2010).</p><p>Второе назначение — контроль качества. Белок p62 (SQSTM1) связывает убиквитинированные белки своим UBA-доменом, а LC3 — мотивом LIR, и тем самым связывает груз с мембраной аутофагосомы; сам p62 разрушается вместе с грузом (Bjørkøy 2005). Так удаляются белковые агрегаты, которые не проходят в узкий канал протеасомы.</p><p>У мышей с условным нокаутом Atg7 в печени аутофагия при голодании нарушалась, а в гепатоцитах накапливались убиквитин-положительные агрегаты и деформированные митохондрии (Komatsu 2005). В таких клетках накапливается и p62; при одновременном удалении гена p62 агрегаты в гепатоцитах и нейронах почти не образуются, а повреждение печени ослабевает (Komatsu 2007). Нарушения системы аутофагия–лизосома описаны при нескольких нейродегенеративных болезнях; во многих случаях первично поражается лизосома, а не образование аутофагосом (Nixon 2024).</p><p>Граница вывода: связь нарушения аутофагии с болезнью не означает, что усиление аутофагии лечит болезнь. Это вопрос клинических исследований, а не механизма. Избирательное удаление повреждённых органелл с помощью рецепторов будет предметом следующего семинара.</p><div class="note trap"><strong>Типичная ошибка</strong> Аутофагия нужна клетке только при голодании.<p class="trap-fix">Аутофагия идёт и в полной среде на базальном уровне: она постоянно обновляет часть белков и органелл и удаляет агрегаты. Без неё убиквитинированные белки и p62 накапливаются даже без голодания.</p></div><div class="static-quiz"><h3>В гепатоцитах мыши удалён ген Atg7; мыши получают корм без ограничений. Как изменится содержание p62 в гепатоцитах по сравнению с мышами дикого типа?</h3><ol><li><b>А.</b> Повысится: p62 перестаёт разрушаться в лизосомах <i>(верный вариант)</i><br><span class="expl">p62 разрушается вместе с грузом при аутофагии. Без Atg7 канонического образования аутофагосом нет, и p62 вместе с убиквитинированными белками накапливается (Komatsu 2007).</span></li><li><b>Б.</b> Снизится: без аутофагии p62 некуда связываться <i>(неверный вариант)</i><br><span class="expl">p62 связывает убиквитинированные белки и без аутофагосом; отсутствие LC3-II мешает не связыванию, а доставке p62 в лизосому.</span></li><li><b>В.</b> Не изменится, потому что голодания нет <i>(неверный вариант)</i><br><span class="expl">Аутофагия идёт и без голодания, на базальном уровне; её отсутствие сказывается и без голодания.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature09076">Yu L., McPhee C.K., Zheng L. et al. Termination of autophagy and reformation of lysosomes regulated by mTOR. Nature. 2010;465:942–946.</a></li><li><a href="https://doi.org/10.1083/jcb.200507002">Bjørkøy G., Lamark T., Brech A. et al. p62/SQSTM1 forms protein aggregates degraded by autophagy and has a protective effect on huntingtin-induced cell death. J Cell Biol. 2005;171:603–614.</a></li><li><a href="https://doi.org/10.1083/jcb.200412022">Komatsu M., Waguri S., Ueno T. et al. Impairment of starvation-induced and constitutive autophagy in Atg7-deficient mice. J Cell Biol. 2005;169:425–434.</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.10.035">Komatsu M., Waguri S., Koike M. et al. Homeostatic levels of p62 control cytoplasmic inclusion body formation in autophagy-deficient mice. Cell. 2007;131:1149–1163.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00757-5">Nixon R.A., Rubinsztein D.C. Mechanisms of autophagy–lysosome dysfunction in neurodegenerative diseases. Nat Rev Mol Cell Biol. 2024;25:926–946.</a></li></ul><p>Схема механизма, качественные состояния. Повторная активация mTORC1 и восстановление лизосом — клетки NRK, среда без сыворотки и глутамина (Yu 2010, реферат). p62 и агрегаты — клетки человека и мыши (Bjørkøy 2005, реферат). Мыши с условным нокаутом Atg7 в печени и мозге — Komatsu 2005 и Komatsu 2007 (рефераты). Нарушения при нейродегенерации — обзор Nixon 2024 (полный текст). Уровни на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-flux-measure"><div class="eyebrow">Аутофагический поток · шаг 24 из 26</div><h2>Как измерить аутофагический поток</h2><p class="lead">Поток оценивают по тому, что исчезает, а не по тому, что видно. Для этого сравнивают клетки с заблокированным удалением и без блока или прямо измеряют расщепление.</p><ol class="mech"><li>Вестерн-блот LC3-II в двух чашках — без бафиломицина и с ним — показывает, сколько LC3-II разрушилось бы за время действия препарата.</li><li><a href="#ns-g-S11-T59">Тандемный репортёр</a> mCherry-GFP-LC3 различает некислые аутофагосомы (жёлтые точки) и кислые аутолизосомы (красные точки).</li><li>Распад долгоживущих белков, меченных аминокислотой, измеряет само расщепление; аутофагическую часть выделяют с помощью блока аутофагии.</li></ol><p>Основной биохимический тест — оборот LC3-II. Клетки делят на две чашки; в одну за короткое время до измерения (обычно 2–4 ч) добавляют <a href="#ns-g-S11-T57">бафиломицин A1</a> или другой ингибитор лизосомного расщепления. Если поток идёт, LC3-II во второй чашке накапливается сильнее. Прибавка — не чистый поток: сам препарат может менять образование аутофагосом, а длительная обработка токсична (Klionsky 2021).</p><p>Содержание p62 обычно снижается при активной аутофагии и растёт при её блоке. Но ген SQSTM1 регулируется транскрипционно, в том числе фактором NRF2, поэтому одно содержание p62 поток не определяет (Klionsky 2021).</p><p>Тандемный репортёр mCherry-GFP-LC3 различает этапы: в кислой аутолизосоме GFP гаснет, а mCherry сохраняется (Kimura 2007). Жёлтые точки накапливаются при замедленном слиянии или нарушенном закислении, красные — при усиленной доставке в кислые компартменты или замедленном расщеплении. Поэтому цвет и число точек сами по себе не определяют скорость расщепления. Отношение красных точек к жёлтым показывает созревание, но не пропорционально потоку. Количественно удобнее зонд GFP-LC3-RFP-LC3ΔG: ATG4 разрезает его на две части, GFP-LC3 разрушается при аутофагии, а RFP-LC3ΔG остаётся внутренним контролем (Kaizuka 2016).</p><p>Прямой метод — распад долгоживущих белков: белки метят аминокислотой, затем измеряют освобождение метки. Значительная часть распада неаутофагическая, поэтому параллельно ставят пробы с блоком аутофагии и вычитают их (Klionsky 2021).</p><div class="note trap"><strong>Типичная ошибка</strong> Высокий LC3-II в одной пробе означает усиленную аутофагию.<p class="trap-fix">Высокий LC3-II возникает и при усиленном образовании аутофагосом, и при нарушенном расщеплении. Поток оценивают по разнице между пробами с ингибитором лизосомного расщепления и без него или по распаду меченых белков.</p></div><div class="static-quiz"><h3>В клетках с тандемным репортёром mCherry-GFP-LC3 после воздействия красных точек стало вдвое больше, а жёлтых — столько же. Какой вывод следует только из этих данных?</h3><ol><li><b>А.</b> Аутофагический поток вырос примерно вдвое <i>(неверный вариант)</i><br><span class="expl">Красные точки говорят о слиянии и закислении, но не о расщеплении: их накопление возможно и при блоке протеаз. Отношение точек не пропорционально потоку.</span></li><li><b>Б.</b> Больше кислых аутолизосом; расщепление не измерено <i>(верный вариант)</i><br><span class="expl">Красный сигнал без GFP означает кислую среду после слияния. Сохраняется ли расщепление, по этим данным не определить: нужен оборот LC3-II или распад меченых белков.</span></li><li><b>В.</b> Слияние аутофагосом с лизосомами нарушено <i>(неверный вариант)</i><br><span class="expl">При нарушении слияния накапливались бы жёлтые точки — аутофагосомы с некислой средой. Здесь растёт число красных точек.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-11.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D.J., Abdel-Aziz A.K., Abdelfatah S. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382.</a></li><li><a href="https://doi.org/10.4161/auto.4451">Kimura S., Noda T., Yoshimori T. Dissection of the autophagosome maturation process by a novel reporter protein, tandem fluorescent-tagged LC3. Autophagy. 2007;3:452–460.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2016.09.037">Kaizuka T., Morishita H., Hama Y. et al. An autophagic flux probe that releases an internal control. Mol Cell. 2016;64:835–849.</a></li></ul><p>Схема метода, условные пиктограммы: значения полос, точек и кривых нарисованы для объяснения и не являются данными конкретного эксперимента. Требования к тестам — руководство Klionsky 2021 (полный текст, разделы о LC3, p62, тандемных репортёрах и распаде долгоживущих белков). Тандемный репортёр — Kimura 2007; зонд GFP-LC3-RFP-LC3ΔG — Kaizuka 2016 (клетки, рыбки данио, мыши; рефераты).</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 25 из 26</div><h2>Как выбрать измеряемую величину, метод и контроль</h2><p class="lead">Четыре системы протеостаза отвечают на разные вопросы, поэтому и измеряют в них разное: долю свернувшихся молекул, скорость распада, прохождение по секреторному пути, поток через лизосому. Вывод надёжен, только если измеряемая величина и контроль выбраны под вопрос.</p><ol class="mech"><li>Сначала формулируют, что изменилось: доля нативного белка, скорость распада, место в клетке или скорость доставки в лизосому.</li><li>Затем выбирают метод, который измеряет именно эту величину, и контроль, который отделяет её от соседних процессов.</li><li>Граница вывода задаётся условиями: in vitro или клетки, доза и время воздействия, побочные эффекты препарата.</li></ol><p>Для цикла Hsp70 удобна система in vitro: денатурированную люциферазу смешивают с очищенными белками и измеряют восстановление её активности. Контроли — смесь для сворачивания без ATP, Hsp70 без гидролиза (K71M) и J-белок с заменой в мотиве HPD. Вывод относится к очищенным белкам; в клетке концентрации и партнёры другие.</p><p>Для убиквитин-протеасомной системы главная величина — скорость распада. Её измеряют, остановив синтез циклогексимидом, а путь распада определяют ингибиторами: бортезомиб для протеасомы, бафиломицин для лизосом. Замена остатков дегрона проверяет, какой участок узнаёт лигаза.</p><p>В ЭПР важно, где находится белок и что с ним стало. Импульсная метка выделяет когорту молекул, синтезированных за короткое время, а обработка Endo H показывает, прошли ли они medial-Гольджи. Сумма белка в клетках и в среде, убывающая со временем, указывает на распад.</p><p>Для аутофагии измеряют не число структур, а поток: сравнивают LC3-II в чашках с бафиломицином и без него, считают жёлтые и красные точки тандемного репортёра, измеряют распад долгоживущих белков. Ни один показатель не достаточен сам по себе, поэтому выводы делают по согласию нескольких.</p><div class="note trap"><strong>Типичная ошибка</strong> Количество белка или число структур на снимке достаточно, чтобы судить о скорости процесса.<p class="trap-fix">Количество — результат баланса образования и удаления. Скорость измеряют отдельно: при остановленном синтезе, в когорте меченых молекул или по разнице между чашками с ингибитором и без него.</p></div><div class="static-quiz"><h3>В клетках без белка Y содержание LC3-II на блоте выросло вдвое. Какое дополнительное измерение позволит выяснить, ускорилось ли образование аутофагосом или замедлилось их удаление?</h3><ol><li><b>А.</b> Добавить бафиломицин только к клеткам без Y и оценить прибавку LC3-II <i>(неверный вариант)</i><br><span class="expl">Прибавка в одних клетках без Y показывает, что оборот LC3-II сохраняется, но не говорит, изменилось ли образование: без контрольной пары частичное нарушение удаления не отличить от усиленного образования.</span></li><li><b>Б.</b> Сравнить прибавку LC3-II с бафиломицином в клетках без Y и в контроле <i>(верный вариант)</i><br><span class="expl">Нужны четыре чашки: контрольные клетки и клетки без Y, каждые без бафиломицина и с ним, при одинаковом времени обработки. Прибавка показывает, что оборот LC3-II сохраняется; об изменении образования судят, сравнивая её с прибавкой в контроле. Если прибавка такая же или меньше, а LC3-II без бафиломицина выше, чем в контроле, удаление нарушено; если прибавка больше, образование, скорее всего, усилено.</span></li><li><b>В.</b> Измерить в клетках без Y содержание мРНК LC3 <i>(неверный вариант)</i><br><span class="expl">Количество мРНК не говорит о скорости образования и удаления аутофагосом; LC3-II — липидированная форма белка, её количество зависит от потока.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.91.22.10345">Szabo A., Langer T., Schröder H. et al. The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ, and GrpE. Proc Natl Acad Sci USA. 1994;91:10345–10349</a></li><li><a href="https://doi.org/10.1038/365182a0">Henkel T., Machleidt T., Alkalay I. et al. Rapid proteolysis of IκB-α is necessary for activation of transcription factor NF-κB. Nature. 1993;365:182–185. doi:10.1038/365182a0</a></li><li><a href="https://doi.org/10.1074/jbc.274.9.5861">Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867</a></li><li><a href="https://doi.org/10.1080/15548627.2020.1797280">Klionsky D.J., Abdel-Aziz A.K., Abdelfatah S. et al. Guidelines for the use and interpretation of assays for monitoring autophagy (4th edition). Autophagy. 2021;17:1–382.</a></li></ul><p>Схема выбора методов; пиктограммы условны. Методы и их ограничения описаны в шагах «Как проверить работу цикла», «Как измерить скорость распада белка», «Как проследить судьбу гликопротеина» и «Как измерить аутофагический поток» с источниками там же: Szabo 1994, Henkel 1993, Liu 1999, Klionsky 2021.</p></details></article><article class="card print-unit" id="ns-protein-fate"><div class="eyebrow">Исследование · шаг 26 из 26</div><h2>Судьба одного белка: от Hsp70 до протеасомы и лизосомы</h2><p class="lead"><a href="#ns-g-S11-T60">Протеостаз</a> — это сеть, в которой судьба разных повреждённых белков определяется по-разному: цитозольный белок получает повторные попытки свернуться, белок ЭПР проходит гликановый контроль, а агрегат удаляется аутофагией. Схема объединяет четыре механизма семинара.</p><ol class="mech"><li>Hsp70 с J-белком связывает открытые гидрофобные участки; NEF освобождает белок для новой попытки свернуться.</li><li>Если попытки неудачны, CHIP убиквитинирует белок, связанный с Hsp70, и цепь K48 направляет его в 26S-протеасому; в ЭПР тот же итог даёт ERAD.</li><li><a href="#ns-g-S11-T63">Агрегаты</a>, недоступные протеасоме, связывает p62, и они удаляются аутофагией в лизосоме.</li></ol><p>Предположим, тепловой стресс развернул часть белков клетки. Открытые гидрофобные участки связывают J-белки и Hsp70. Каждый цикл ATP и ADP даёт белку попытку свернуться; за одну попытку сворачивается лишь часть молекул, поэтому нужны повторные циклы, а факторы обмена нуклеотидов определяют их скорость. Если открытые участки остаются доступными долго, они служат сигналом для систем деградации; так происходит <a href="#ns-g-S11-T61">сортировка белков</a>.</p><p>Убиквитинлигаза <a href="#ns-g-S11-T62">CHIP</a> связывается с C-концом Hsp70 и Hsp90 и убиквитинирует удерживаемый ими белок; цепь K48 направляет его в 26S-протеасому. Так шаперон и протеасома конкурируют за один и тот же белок: исход определяется тем, что произойдёт раньше — сворачивание или убиквитинирование.</p><p>Белок, синтезированный в ЭПР, проходит другой контроль: глюкоза на N-гликане возвращает его к калнексину, отщепление маннозы направляет к SEL1L–HRD1. После выведения в цитозоль такой белок разрушает та же 26S-протеасома.</p><p>Крупные агрегаты протеасома разрушить не может: её канал пропускает только развёрнутую цепь. Убиквитинированные агрегаты связывает p62, который взаимодействует с LC3 на мембране аутофагосомы; после слияния с лизосомой агрегат расщепляется. Если нарушено одно звено, нагрузка на соседние растёт: при ингибировании протеасомы усиливается синтез её субъединиц через NRF1, а белки могут перенаправляться в аутофагию.</p><div class="note trap"><strong>Типичная ошибка</strong> Шапероны, протеасома и аутофагия — три независимые системы, каждая со своими субстратами.<p class="trap-fix">Это связанная сеть: Hsp70 и CHIP передают белок в протеасому, ERAD заканчивается в протеасоме, а убиквитинированные агрегаты через p62 попадают в аутофагию; нарушение одного звена перераспределяет нагрузку на другие.</p></div><div class="static-quiz"><h3>Неисправимый цитозольный белок связан с Hsp70 и убиквитинируется лигазой CHIP. Клетки обработали бортезомибом. Как изменится этот белок в первые часы?</h3><ol><li><b>А.</b> Накопится в полиубиквитинированной форме <i>(верный вариант)</i><br><span class="expl">Убиквитинирование продолжается, а расщепление в протеасоме остановлено, поэтому полиубиквитинированный белок накапливается.</span></li><li><b>Б.</b> Свернётся благодаря новым циклам Hsp70 <i>(неверный вариант)</i><br><span class="expl">Ингибирование протеасомы не исправляет дефект сворачивания; неисправимый белок остаётся несвёрнутым и убиквитинированным.</span></li><li><b>В.</b> Полностью разрушится в лизосомах <i>(неверный вариант)</i><br><span class="expl">Перенаправление части белков в аутофагию при ингибировании протеасомы описано, но оно медленнее и не полное; в первые часы полиубиквитинированный белок накапливается.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-11.html#q1">Вопрос 1 →</a> <a href="seminar-11.html#q2">Вопрос 2 →</a> <a href="seminar-11.html#q3">Вопрос 3 →</a> <a href="seminar-11.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li><li><a href="https://doi.org/10.1038/35050618">Connell P., Ballinger C.A., Jiang J. et al. The co-chaperone CHIP regulates protein triage decisions mediated by heat-shock proteins. Nat Cell Biol. 2001;3:93–96</a></li><li><a href="https://doi.org/10.1038/s41580-023-00633-8">Christianson J.C., Jarosch E., Sommer T. Mechanisms of substrate processing during ER-associated protein degradation. Nat Rev Mol Cell Biol. 2023;24:777–796</a></li><li><a href="https://doi.org/10.1083/jcb.200507002">Bjørkøy G., Lamark T., Brech A. et al. p62/SQSTM1 forms protein aggregates degraded by autophagy and has a protective effect on huntingtin-induced cell death. J Cell Biol. 2005;171:603–614.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2010.02.029">Radhakrishnan S.K., Lee C.S., Young P. et al. Transcription factor Nrf1 mediates the proteasome recovery pathway after proteasome inhibition in mammalian cells. Mol Cell. 2010;38:17–28. doi:10.1016/j.molcel.2010.02.029</a></li><li><a href="https://doi.org/10.1038/s41580-019-0101-y">Hipp M.S., Kasturi P., Hartl F.U. The proteostasis network and its decline in ageing. Nat Rev Mol Cell Biol. 2019;20:421–435</a></li></ul><p>Схема механизма, качественные состояния; объединяет данные шагов разделов 1–4. Передача белков от Hsp70 к CHIP — Connell 2001 (реферат) и обзор Wentink 2026; ERAD — Christianson 2023; p62 в агрегатах — Bjørkøy 2005; восстановление протеасом — Radhakrishnan 2010. Последовательность «сначала шапероны, затем деградация» — схема кинетической конкуренции, а не жёсткий порядок.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S11-T01"><dt>Hsp70 (шапероны семейства Hsp70)</dt><dd>ATP-зависимые шапероны из нуклеотид-связывающего (NBD) и субстрат-связывающего (SBD) доменов. Связывают открытые гидрофобные участки полипептидов и предотвращают их агрегацию. У человека 11 белков семейства (Wentink 2026, с исправлением авторов): Hsc70 (HSPA8) синтезируется постоянно, синтез HSPA1A усиливается при стрессе, BiP работает в ЭПР, mtHsp70 — в митохондриях. Hsp70 не задаёт белку готовую нативную структуру, но, связывая и освобождая его, может устранять ошибочно свёрнутые состояния (Wentink 2026; Imamoglu 2020).</dd></div><div id="ns-g-S11-T02"><dt>NBD (нуклеотид-связывающий домен)</dt><dd>N-концевой домен Hsp70, который связывает и гидролизует ATP. От нуклеотида в NBD (ATP или ADP) через линкер зависит конформация SBD. С NBD связываются J-домен (стимулирует гидролиз) и факторы обмена нуклеотидов (ускоряют выход ADP).</dd></div><div id="ns-g-S11-T03"><dt>SBD и крышка</dt><dd>C-концевой субстрат-связывающий домен Hsp70: β-складчатая часть с карманом для гидрофобного участка полипептида и α-спиральная крышка. В ATP-состоянии карман открыт, после гидролиза ATP крышка закрывается, и субстрат отходит медленно.</dd></div><div id="ns-g-S11-T04"><dt>J-доменный белок (JDP, Hsp40)</dt><dd>Кошаперон Hsp70. Связывает субстраты или прикрепляет Hsp70 к определённым комплексам и своим J-доменом стимулирует гидролиз ATP у Hsp70. У человека около 50 J-белков; у бактерий основной — DnaJ. Пример — DNAJB1 (класс B, цитоплазма).</dd></div><div id="ns-g-S11-T05"><dt>Мотив HPD</dt><dd>Консервативная последовательность His-Pro-Asp в J-домене. Необходима для стимуляции гидролиза ATP у Hsp70: замена гистидина (например, H32Q у DNAJB1 человека) сохраняет белок, но лишает его этой способности (Kityk 2018).</dd></div><div id="ns-g-S11-T06"><dt>Фактор обмена нуклеотидов (NEF)</dt><dd>Белок, который связывается с NBD Hsp70 в ADP-состоянии и ускоряет выход ADP; после связывания ATP субстрат освобождается. У бактерий — GrpE; у человека 13 NEF четырёх семейств: GrpE-подобные, Hsp110, белки с повторами армадилло (HspBP1, SIL1) и белки BAG (Wentink 2026). Количество NEF влияет на результат: избыток in vitro подавлял сворачивание (Gässler 2001).</dd></div><div id="ns-g-S11-T07"><dt>Неравновесное сродство («сверхсродство»)</dt><dd>Теоретически обоснованное свойство Hsp70: субстрат быстро связывается в ATP-состоянии и медленно отходит в ADP-состоянии, а гидролиз ATP переводит одно состояние в другое. Расход ATP позволяет получить эффективное сродство выше, чем у любого равновесного состояния (De Los Rios 2014). Это вывод модели, а не прямое измерение в клетке.</dd></div><div id="ns-g-S11-T08"><dt>Hsp110 (HSPH1 и др.)</dt><dd>Белки, родственные Hsp70, которые служат для него фактором обмена нуклеотидов. У животных Hsp110 вместе с Hsp70 и J-белками классов A и B растворяет белковые агрегаты (Rampelt 2012; Nillegoda 2015).</dd></div><div id="ns-g-S11-T09"><dt>Белки BAG (BAG1, BAG3)</dt><dd>Семейство факторов обмена нуклеотидов с BAG-доменом. BAG1 ускоряет выход ADP из Hsc70 (Gässler 2001) и своим убиквитиноподобным доменом связывается с протеасомой; BAG3 направляет связанные с Hsp70 белки к аутофагии (Wentink 2026).</dd></div><div id="ns-g-S11-T10"><dt>CHIP (STUB1)</dt><dd>Убиквитинлигаза E3, которая доменом TPR связывается с C-концевыми мотивами EEVD Hsp70 и Hsp90, а U-боксом переносит убиквитин на связанный субстрат. Направляет неисправимые субстраты шаперонов на протеасомную деградацию (Connell 2001).</dd></div><div id="ns-g-S11-T11"><dt>Hsp90 и HOP</dt><dd>Hsp90 — ATP-зависимый шаперон, который продолжает созревание части клиентов Hsp70, например рецепторов стероидных гормонов и протеинкиназ. HOP — кошаперон, связывающийся доменами TPR с C-концами Hsp70 и Hsp90 и помогающий передать субстрат; для передачи нужен NEF (Wentink 2026).</dd></div><div id="ns-g-S11-T12"><dt>HSF1</dt><dd>Транскрипционный фактор, который при тепловом шоке и других воздействиях, нарушающих сворачивание белков, усиливает транскрипцию генов шаперонов, в том числе Hsp70, J-белков и NEF (Wentink 2026).</dd></div><div id="ns-g-S11-T13"><dt>BiP (HSPA5, GRP78)</dt><dd>Hsp70 эндоплазматического ретикулума. С J-белком DNAJC23 (Sec63) связывает цепь, входящую через транслокон Sec61; участвует в сворачивании белков в ЭПР. Его NEF — SIL1 и GRP170. Роль BiP в регуляции UPR разобрана в семинаре 10.</dd></div><div id="ns-g-S11-T14"><dt>Люцифераза как модельный субстрат</dt><dd>Фермент светлячка, который после нагревания или денатурирующих веществ теряет активность. Свет при окислении люциферина излучают только правильно свёрнутые молекулы, поэтому по свечению определяют долю нативной люциферазы в экспериментах со сворачиванием in vitro (Szabo 1994; Gässler 2001). Свечение измеряют в отдельной регистрационной смеси с люциферином, ATP и Mg²⁺; в контроле «без ATP» ATP нет только на стадии сворачивания (Imamoglu 2020).</dd></div><div id="ns-g-S11-T15"><dt>Убиквитин</dt><dd>Белок из 76 аминокислот, который присоединяется C-концевым глицином к остаткам лизина других белков (или к другому убиквитину, образуя цепь). Присоединение требует каскада E1–E2–E3. Смысл метки зависит от числа молекул и типа цепи: цепь K48 обычно направляет белок в протеасому, моноубиквитин и цепи K63 чаще служат другим целям.</dd></div><div id="ns-g-S11-T16"><dt>E1 (фермент, активирующий убиквитин)</dt><dd>Фермент, который за счёт ATP образует аденилат убиквитина и затем присоединяет убиквитин тиоэфирной связью к своему цистеину, после чего передаёт его на E2. У человека основной E1 — UBA1. Ингибитор E1 (TAK-243) останавливает убиквитинирование всех субстратов.</dd></div><div id="ns-g-S11-T17"><dt>E2 (фермент, переносящий убиквитин)</dt><dd>Фермент, принимающий убиквитин от E1 на собственный цистеин и передающий его на субстрат вместе с E3. У человека около 40 генов E2; от пары E2–E3 во многом зависит тип строящейся цепи.</dd></div><div id="ns-g-S11-T18"><dt>Убиквитинлигаза E3</dt><dd>Белок или комплекс, который одновременно связывает субстрат (по его дегрону) и E2·убиквитин и обеспечивает перенос убиквитина на субстрат. У человека около 600 генов E3. RING-лигазы переносят убиквитин прямо с E2, HECT-лигазы — через собственный цистеин.</dd></div><div id="ns-g-S11-T19"><dt>Дегрон</dt><dd>Участок белка, который узнаёт убиквитинлигаза E3; его наличие определяет скорость убиквитинирования и разрушения белка. Бывают N- и C-концевые, внутренние и возникающие после модификации дегроны. Дегрон — сигнал для E3, а цепь убиквитина — сигнал для протеасомы.</dd></div><div id="ns-g-S11-T20"><dt>Фосфодегрон</dt><dd>Дегрон, который узнаётся только после фосфорилирования. Пример: мотив DSGΨxS IκBα после фосфорилирования S32 и S36 киназой IKK связывается с F-бокс-белком βTrCP лигазы SCF. Замена этих серинов аланином делает белок устойчивым после стимула.</dd></div><div id="ns-g-S11-T21"><dt>Цепь K48</dt><dd>Цепь убиквитина, в которой каждый следующий убиквитин присоединён к остатку K48 предыдущего. В экспериментах in vitro с модельными субстратами эффективным сигналом для 26S-протеасомы была цепь из четырёх и более убиквитинов K48 (Thrower 2000). Это не универсальный порог: часть белков разрушается после моноубиквитинирования (Braten 2016).</dd></div><div id="ns-g-S11-T22"><dt>Деубиквитиназа</dt><dd>Протеаза, отщепляющая убиквитин от белков или укорачивающая цепь. Делает убиквитинирование обратимым. В 26S-протеасоме три деубиквитиназы: Rpn11 (металлопротеаза, отщепляет цепь целиком), USP14 и UCH37 (связана с Rpn13).</dd></div><div id="ns-g-S11-T23"><dt>26S-протеасома</dt><dd>АТФ-зависимая протеаза из 20S-частицы (четыре кольца α7β7β7α7, протеолитические центры β1, β2, β5 внутри) и одной или двух 19S-частиц, которые связывают цепь убиквитина, отщепляют её и разворачивают белок. Продукты — пептиды из 3–22 остатков.</dd></div><div id="ns-g-S11-T24"><dt>Rpn11</dt><dd>Субъединица крышки 19S-частицы, цинковая металлопротеаза (у человека PSMD14). Отщепляет цепь убиквитина целиком, когда субстрат уже захвачен ATPазами; без её активности убиквитинированные белки не разрушаются (у дрожжей замена гистидинов активного центра на аланин летальна).</dd></div><div id="ns-g-S11-T25"><dt>NF-κB и IκBα</dt><dd>NF-κB — транскрипционный фактор (например, димер p65–p50); в покое связан с ингибитором IκBα и находится в цитоплазме. После фосфорилирования IκBα киназой IKK и его разрушения 26S-протеасомой NF-κB перемещается в ядро и активирует гены-мишени.</dd></div><div id="ns-g-S11-T26"><dt>MLN4924 и неддилирование</dt><dd>NEDD8 — белок, похожий на убиквитин; его присоединение к куллину (неддилирование) нужно для активности куллиновых лигаз, например SCF. MLN4924 (певонедистат) ингибирует фермент, активирующий NEDD8, и стабилизирует субстраты куллиновых лигаз; на HECT-лигазы не действует.</dd></div><div id="ns-g-S11-T27"><dt>Циклогексимид</dt><dd>Ингибитор элонгации трансляции у эукариот. Используется, чтобы остановить синтез белка и проследить его распад. Сам вызывает стресс и останавливает синтез короткоживущих регуляторов, поэтому прослеживание ограничивают несколькими часами.</dd></div><div id="ns-g-S11-T28"><dt>Период полужизни белка</dt><dd>Время, за которое при остановленном синтезе остаётся половина исходного количества белка. Зависит от клеток и условий; у регуляторов с активным дегроном — минуты, у структурных белков — часы и сутки.</dd></div><div id="ns-g-S11-T29"><dt>Бортезомиб</dt><dd>Ингибитор 26S-протеасомы, связывающийся прежде всего с химотрипсиноподобными центрами β5. В клетках вызывает накопление полиубиквитинированных белков; применяется при множественной миеломе. При больших дозах действует и на другие мишени.</dd></div><div id="ns-g-S11-T30"><dt>N-гликан и секвон</dt><dd>Олигосахарид, присоединённый к атому азота боковой цепи Asn. Гликан переносится только на Asn в последовательности Asn–X–Ser/Thr (встречается и Asn–X–Cys), где X — любая аминокислота, кроме пролина. Такую последовательность называют секвоном.</dd></div><div id="ns-g-S11-T31"><dt>Олигосахарилтрансфераза (OST)</dt><dd>Мембранный комплекс ЭПР, переносящий гликан-предшественник с долихолпирофосфата (Dol-PP) на Asn секвона. У человека OST-A (каталитическая субъединица STT3A) работает котрансляционно у транслокона Sec61, OST-B (STT3B) — посттрансляционно, на сайтах, пропущенных OST-A (Ruiz-Canada 2009).</dd></div><div id="ns-g-S11-T32"><dt>Glc₃Man₉GlcNAc₂</dt><dd>Гликан-предшественник: две GlcNAc, девять маннозных и три глюкозных остатка. На кор-маннозе ветвятся α1,3- и α1,6-ветви; глюкозы находятся на конце ветви A. На схемах использованы символы SNFG: синий квадрат — GlcNAc, зелёный круг — манноза, синий круг — глюкоза.</dd></div><div id="ns-g-S11-T33"><dt>Глюкозидазы I и II</dt><dd>Ферменты ЭПР: глюкозидаза I отщепляет крайнюю α1,2-глюкозу, глюкозидаза II — две α1,3-глюкозы. После первых двух отщеплений образуется гликан с одной глюкозой, после третьего белок отходит от калнексина. Ингибиторы глюкозидаз (кастаноспермин) нарушают цикл калнексина.</dd></div><div id="ns-g-S11-T34"><dt>Калнексин и кальретикулин</dt><dd>Лектины-шапероны ЭПР: калнексин — мембранный, кальретикулин — растворимый. Они связывают гликан с одной глюкозой (Glc₁Man₉GlcNAc₂), а не гидрофобные участки белка (Hebert 1995), и удерживают белок в ЭПР, пока он сворачивается.</dd></div><div id="ns-g-S11-T35"><dt>ERp57 (PDIA3)</dt><dd>Тиол-дисульфидная оксидоредуктаза ЭПР, работающая в комплексе с калнексином и кальретикулином: участвует в образовании и перестройке дисульфидных связей у связанных ими гликопротеинов.</dd></div><div id="ns-g-S11-T36"><dt>UGGT1</dt><dd>UDP-глюкоза:гликопротеин-глюкозилтрансфераза 1 — фермент ЭПР, возвращающий одну глюкозу на гликан только у несвёрнутого белка с открытыми гидрофобными участками (Sousa 1995; Caramelo 2003). Поэтому его называют датчиком несвёрнутого состояния. У человека есть и UGGT2.</dd></div><div id="ns-g-S11-T37"><dt>Отщепление маннозы: EDEM1–3</dt><dd>Медленное отщепление маннозных остатков ограничивает время пребывания несвёрнутого белка в ЭПР. Первую маннозу (ветвь B) отщепляет EDEM2 с TXNDC11 (Ninagawa 2014), затем EDEM3 и EDEM1 открывают α1,6-маннозу ветви C.</dd></div><div id="ns-g-S11-T38"><dt>OS-9 и XTP3-B</dt><dd>Лектины ЭПР с доменом MRH. Они узнают гликан с открытой α1,6-маннозой (Hosokawa 2009) и через SEL1L передают субстрат убиквитинлигазе HRD1 (Christianson 2008).</dd></div><div id="ns-g-S11-T39"><dt>ERAD</dt><dd>ER-associated degradation — деградация, связанная с ЭПР: путь, которым дефектные белки ЭПР распознаются, переносятся через мембрану в цитозоль, убиквитинируются и разрушаются 26S-протеасомой. Отличается от повторного сворачивания белка и от разрушения участков ЭПР в лизосоме.</dd></div><div id="ns-g-S11-T40"><dt>SEL1L–HRD1</dt><dd>Комплекс мембраны ЭПР: HRD1 — убиквитинлигаза E3 с RING-доменом, SEL1L — адаптер, связывающий её с лектинами OS-9 и XTP3-B. По данным для дрожжей, Hrd1 вместе с Der1 образует канал ретротранслокации (Schoebel 2017); у млекопитающих канал, вероятно, образуют HRD1, DERL2 и HERP (Christianson 2023).</dd></div><div id="ns-g-S11-T41"><dt>p97 (VCP)</dt><dd>Гексамерная ATPаза AAA+ (у дрожжей Cdc48). С кофакторами UFD1 и NPL4 она связывает убиквитиновую цепь и за счёт гидролиза ATP протягивает белок через центральную пору, извлекая его из мембраны ЭПР (Bodnar 2017). Ингибитор — CB-5083 (Anderson 2015).</dd></div><div id="ns-g-S11-T42"><dt>NGLY1</dt><dd>N-гликаназа цитозоля: отщепляет N-гликан от белка, уже выведенного из ЭПР, при этом Asn превращается в Asp. Мутации NGLY1 у человека вызывают дефицит NGLY1 (Enns 2014).</dd></div><div id="ns-g-S11-T43"><dt>Endo H и PNGase F</dt><dd>Ферменты, отщепляющие N-гликаны в пробе белка. Endo H расщепляет высокоманнозные и часть гибридных гликанов (ЭПР, cis-Гольджи), но не комплексные, образующиеся в medial-Гольджи; PNGase F снимает почти все N-гликаны. Сдвиг полосы в геле показывает, был ли гликан и какого типа.</dd></div><div id="ns-g-S11-T44"><dt>Кифунензин</dt><dd>Ингибитор α1,2-маннозидаз класса I. Подавляет маннозидазу I аппарата Гольджи (Elbein 1990), и тогда комплексные гликаны не образуются; в клетках гепатомы останавливал распад несвёрнутого α1-антитрипсина (Liu 1999).</dd></div><div id="ns-g-S11-T45"><dt>Аутофагический поток</dt><dd>Скорость доставки компонентов цитоплазмы в лизосомы и их расщепления в лизосомах. Поток — скорость, а не число аутофагосом: пул структур растёт и при усиленном образовании, и при задержке слияния или расщепления (Klionsky 2021).</dd></div><div id="ns-g-S11-T46"><dt>Аутофагосома</dt><dd>Замкнутая структура с двойной мембраной, несущей LC3-II, которая заключает участок цитоплазмы. Среда в ней некислая. Аутофагосома сливается с лизосомой; до слияния её содержимое не расщепляется.</dd></div><div id="ns-g-S11-T47"><dt>Изолирующая мембрана (фагофор)</dt><dd>Растущая мембрана, из которой образуется аутофагосома. Её образование начинает комплекс ULK1; на ней VPS34 образует PI3P, и к ней присоединяется LC3. STX17 на незамкнутой мембране отсутствует.</dd></div><div id="ns-g-S11-T48"><dt>Аутолизосома</dt><dd>Структура, образованная слиянием аутофагосомы с лизосомой. В кислой среде гидролазы расщепляют груз и внутреннюю мембрану вместе с LC3-II. Число аутолизосом не равно скорости расщепления.</dd></div><div id="ns-g-S11-T49"><dt>Комплекс ULK1</dt><dd>Протеинкиназа ULK1 вместе с ATG13, FIP200 и ATG101 (Zachari 2017). Начинает образование изолирующей мембраны. mTORC1 подавляет комплекс, фосфорилируя ULK1 по S758 у человека (S757 у мыши); действие AMPK зависит от условий (Kim 2011; Park 2023).</dd></div><div id="ns-g-S11-T50"><dt>Комплекс VPS34 и PI3P</dt><dd>Фосфатидилинозитол-3-киназа класса III (VPS34, VPS15, BECN1, ATG14) образует на изолирующей мембране фосфатидилинозитол-3-фосфат (PI3P). ULK1 усиливает её работу, фосфорилируя BECN1 (S15 у человека; Russell 2013). Ингибитор — SAR405.</dd></div><div id="ns-g-S11-T51"><dt>WIPI2</dt><dd>Белок, связывающий PI3P на изолирующей мембране и привлекающий комплекс ATG12–ATG5–ATG16L1; так присоединение LC3 происходит там, где образован PI3P (Dooley 2014).</dd></div><div id="ns-g-S11-T52"><dt>LC3 (LC3-I и LC3-II)</dt><dd>Белок семейства ATG8. LC3-I — растворимая форма с открытым C-концевым глицином; LC3-II — LC3, присоединённый к фосфатидилэтаноламину мембраны. LC3-II на внутренней мембране разрушается в аутолизосоме. При неканоническом присоединении LC3 бывает и на одинарных мембранах (Durgan 2021).</dd></div><div id="ns-g-S11-T53"><dt>ATG7 и ATG3</dt><dd>Ферменты присоединения LC3: ATG7 — E1-подобный, активирует LC3-I за счёт ATP; ATG3 — E2-подобный, переносит LC3 на фосфатидилэтаноламин. Без ATG7 LC3-II не образуется и нарушено каноническое образование аутофагосом (Komatsu 2005).</dd></div><div id="ns-g-S11-T54"><dt>Комплекс ATG12–ATG5–ATG16L1</dt><dd>Конъюгат ATG12–ATG5, связанный с ATG16L1. Работает как E3-подобный фермент: ускоряет перенос LC3 с ATG3 на липид и направляет реакцию на мембрану, к которой его привлёк WIPI2.</dd></div><div id="ns-g-S11-T55"><dt>STX17</dt><dd>Белок SNARE, встраивающийся в наружную мембрану замкнутой аутофагосомы; с SNAP29 и VAMP8 участвует в слиянии с лизосомой (Itakura 2012). Слияние частично идёт и без него — с участием YKT6 (Matsui 2018).</dd></div><div id="ns-g-S11-T56"><dt>V-ATPase и катепсины</dt><dd>V-ATPase переносит протоны в просвет лизосомы и поддерживает кислую среду; в ней работают лизосомные гидролазы, в том числе катепсины. E64d ингибирует цистеиновые катепсины, пепстатин A — катепсин D: слияние и закисление при этом сохраняются.</dd></div><div id="ns-g-S11-T57"><dt>Бафиломицин A1</dt><dd>Ингибитор V-ATPase: подавляет закисление и тем самым лизосомное расщепление; в некоторых клетках нарушает и слияние — через SERCA (Mauvezin 2015). Используется коротко (обычно 2–4 ч) в паре «чашка с препаратом и без него» для оценки оборота LC3-II.</dd></div><div id="ns-g-S11-T58"><dt>p62 (SQSTM1)</dt><dd>Адаптерный белок: связывает убиквитинированные белки (домен UBA) и LC3 (мотив LIR) и разрушается вместе с грузом при аутофагии (Bjørkøy 2005). При нарушении аутофагии накапливается (Komatsu 2007); ген регулируется и транскрипционно, поэтому содержание p62 — вспомогательный показатель.</dd></div><div id="ns-g-S11-T59"><dt>Тандемный репортёр mCherry-GFP-LC3</dt><dd>LC3, слитый с mCherry и GFP. В некислой аутофагосоме видны оба сигнала (жёлтая точка), в кислой аутолизосоме GFP гаснет (красная точка; Kimura 2007). Показывает слияние и закисление, но не расщепление.</dd></div><div id="ns-g-S11-T60"><dt>Протеостаз</dt><dd>Согласованная работа систем синтеза, сворачивания, транспорта и разрушения белков, которая поддерживает нужный состав и состояние белков клетки. Включает шапероны (Hsp70 и др.), убиквитин-протеасомную систему, контроль качества в ЭПР и ERAD, аутофагию. Ёмкость этой сети с возрастом снижается.</dd></div><div id="ns-g-S11-T61"><dt>Сортировка белков контролем качества</dt><dd>Выбор между повторным сворачиванием, передачей другим шаперонам и разрушением белка. Во многом определяется кинетической конкуренцией: что произойдёт раньше — сворачивание (участки скрыты) или узнавание открытых участков системами деградации (например, CHIP).</dd></div><div id="ns-g-S11-T62"><dt>CHIP (STUB1)</dt><dd>Убиквитинлигаза с TPR-доменом, связывающим C-концы Hsp70 и Hsp90, и U-боксом, взаимодействующим с E2. Убиквитинирует белки, удерживаемые шаперонами, и направляет их в протеасому.</dd></div><div id="ns-g-S11-T63"><dt>Агрегат белка</dt><dd>Скопление неправильно свёрнутых молекул, связанных между собой открытыми гидрофобными участками. Крупные агрегаты не проходят в канал протеасомы; их растворяет система Hsp70 с Hsp110 и J-белками или удаляет аутофагия с участием p62.</dd></div><div id="ns-g-S11-T64"><dt>TFEB и TFE3</dt><dd>Транскрипционные факторы, усиливающие экспрессию генов лизосомных белков и белков аутофагии. При активном mTORC1 фосфорилированы (у TFEB — в частности, S211), связаны с белками 14-3-3 и находятся в цитоплазме; при снижении активности mTORC1
