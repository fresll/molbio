 MFN1 и MFN2 показаны вместе; различия между ними не рассматриваются.</dd></div><div id="ns-g-S12-T25"><dt>p97 (VCP)</dt><dd>AAA-АТФаза (VCP; у дрожжей Cdc48). С кофакторами UFD1–NPL4 извлекает убиквитинированные белки из мембран и передаёт их протеасоме. На митохондриях извлекает MFN1/2 и RHOT1/2, помеченные <a href="#ns-g-S12-T23">Parkin</a>. На схеме показана как один блок, без кофакторов.</dd></div><div id="ns-g-S12-T26"><dt>USP30</dt><dd>Деубиквитиназа, закреплённая во внешней мембране митохондрии. Снимает убиквитин, который присоединил <a href="#ns-g-S12-T23">Parkin</a>: избыточная экспрессия USP30 подавляет митофагию, а снижение её активности усиливает деградацию митохондрий в нейронах (Bingol 2014). Ингибитор USP30 MTX325 вошёл в клинические испытания при болезни Паркинсона (Narendra &amp; Youle 2024). В первоисточнике активность USP30 снижали РНК-интерференцией (нокдауном), а не нокаутом.</dd></div><div id="ns-g-S12-T27"><dt>BNIP3 и NIX (BNIP3L)</dt><dd>Белки внешней мембраны митохондрии с мотивом LIR: рецепторы митофагии, которым убиквитин не нужен. При гипоксии их образование усиливает HIF1A; NIX необходим для удаления митохондрий при созревании эритроидных клеток. <a href="#ns-g-S12-T16">PINK1</a> и <a href="#ns-g-S12-T23">Parkin</a> для этих путей не нужны. Митофагия через BNIP3 менее избирательна к повреждённым митохондриям и при неконтролируемом усилении может приводить к истощению митохондриальной ДНК. Другие рецепторы этого типа (FUNDC1 и др.) здесь не рассматриваются.</dd></div><div id="ns-g-S12-T28"><dt>Деферипрон (DFP)</dt><dd>Хелатор железа. В клетках U2OS и SH-SY5Y за 24 ч вызывал митофагию, не зависящую от PINK1 и Parkin: подавление PINK1 эффект не меняло, а PINK1 не стабилизировалась. BNIP3 для эффекта не требовался (Allen 2013). В первичных эмбриональных фибробластах мыши с репортёром mito-QC деферипрон увеличивал митофагию примерно в шесть раз (McWilliams 2016). Какой рецептор работает в этом случае, остаётся неизвестным.</dd></div><div id="ns-g-S12-T29"><dt>mt-Keima</dt><dd>Флуоресцентный белок Keima из коралла, направленный в матрикс митохондрии. Его спектр возбуждения зависит от pH, поэтому митохондрии в нейтральном цитозоле и в кислой среде лизосомы дают сигналы разного цвета (Katayama 2011). Измеряют в живых клетках и тканях: с фиксацией Keima несовместим. Показывает доставку в кислый отсек, но не говорит, какой путь её запустил. Цвета на схемах условные.</dd></div><div id="ns-g-S12-T30"><dt>mito-QC</dt><dd>Репортёр митофагии: тандем mCherry–GFP, закреплённый во внешней мембране митохондрии (участок FIS1 101–152). В нейтральной среде светятся оба белка; в лизосоме кислая среда гасит GFP, а mCherry остаётся, и возникают красные точки без зелёного (митолизосомы). Сигнал сохраняется при фиксации ткани. Красные точки возникают при любой доставке материала в кислый отсек, не только при митофагии. Цвета на схемах условные.</dd></div><div id="ns-g-S12-T31"><dt>Проницаемость лизосомной мембраны (LMP)</dt><dd>Потеря лизосомной мембраной барьерной функции: через неё выходят протоны и ионы Ca²⁺, а при более тяжёлом повреждении и гидролазы, тогда как в просвет проникают белки цитозоля. Повреждение бывает частичным (малые временные поры, утечка ионов) и крупным (разрыв). Его вызывают лизосомотропные вещества, перекисное окисление липидов, агрегаты, кристаллы и бактерии.</dd></div><div id="ns-g-S12-T32"><dt>LLOMe (L-лейцил-L-лейцин метиловый эфир)</dt><dd>Лизосомотропное вещество, которым в эксперименте повреждают лизосомы. Оно диффундирует в лизосому, протонируется и остаётся в ней; катепсин C превращает его в полилейцины (в среднем около шести остатков), нарушающие мембрану. Чувствительность клеток зависит от уровня катепсина C.</dd></div><div id="ns-g-S12-T33"><dt>Катепсин C (CTSC, дипептидилпептидаза I)</dt><dd>Лизосомная дипептидилпептидаза I. В эксперименте с LLOMe она превращает это вещество в полилейцины, нарушающие мембрану, поэтому от её уровня зависит токсичность LLOMe для клеток.</dd></div><div id="ns-g-S12-T34"><dt>Галектины 3, 8 и 9</dt><dd>Белки цитозоля, связывающие β-галактозиды. При крупном повреждении лизосомы они связываются с гликанами внутренней стороны мембраны, ставшими доступными. По ним в микроскопе выявляют повреждённые лизосомы. Они же привлекают белки ответа: галектин-3 — ALIX и TRIM16, галектин-8 влияет на отсоединение mTORC1, галектин-9 привлекает киназу TAK1. Они узнают сахара, а не убиквитин; рецепторы лизофагии — другие белки.</dd></div><div id="ns-g-S12-T35"><dt>ALG-2 (PDCD6)</dt><dd>Ca²⁺-связывающий белок цитозоля. Связав Ca²⁺, вышедший из повреждённой лизосомы, он садится на мембрану и привлекает ESCRT-III двумя путями: через ESCRT-I (TSG101) и непосредственно через ALIX. Фосфатидилсерин, переносимый на цитозольную сторону мембраны из ЭПР, благоприятствует привлечению ALG-2.</dd></div><div id="ns-g-S12-T36"><dt>ESCRT-III</dt><dd>Комплекс белков (CHMP1–7, IST1), которые полимеризуются в кольца и спирали на поверхности мембраны со стороны цитозоля; АТФаза VPS4 перестраивает эти полимеры. На повреждённой лизосоме их привлекают в течение минут. Считают, что они сужают место повреждения и убирают его в просвет в виде внутрипросветных пузырьков; обсуждают и временную закупорку разрыва. Точный механизм не установлен.</dd></div><div id="ns-g-S12-T37"><dt>Перенос липидов, инициированный фосфоинозитидами (PITT)</dt><dd>Путь быстрого ремонта лизосомы: Ca²⁺ активирует PI4K2A, она образует фосфатидилинозитол-4-фосфат (PI4P) на повреждённой мембране. PI4P привлекает OSBP и ORP9–11, которые создают контакты с ЭПР и переносят холестерол и фосфатидилсерин в обмен на PI4P; затем подключается ATG2, переносящий большие количества липидов.</dd></div><div id="ns-g-S12-T38"><dt>Аннексины A1 и A2</dt><dd>Ca²⁺-зависимые белки, образующие полимеры на повреждённой мембране. К повреждённым лизосомам привлекаются все повсеместно экспрессируемые аннексины, но для ремонта важны A1 и A2. Они приходят независимо от ESCRT и выбирают повреждения с более крупными порами.</dd></div><div id="ns-g-S12-T39"><dt>CASM (присоединение ATG8 к одинарной мембране)</dt><dd>Присоединение белков семейства ATG8 к липидам самой лизосомной мембраны (к фосфатидилэтаноламину, а также к фосфатидилсерину) без образования фагофора. Идёт через комплекс ATG16L1–ATG5–ATG12, который привлекает V-ATPase, или через TECPR1–ATG5–ATG12, узнающий сфингомиелин на цитозольной стороне. Следствия: микроаутофагия места повреждения, активация TFEB, образование трубчатых выпячиваний. Это не упаковка лизосомы в аутофагосому.</dd></div><div id="ns-g-S12-T40"><dt>Лизофагия</dt><dd>Избирательная макроаутофагия повреждённых лизосом. Повреждённая лизосома получает убиквитиновую метку, рецепторы связывают её и белки ATG8, ULK1-комплекс строит фагофор вокруг органеллы, аутофагосома сливается с неповреждённой лизосомой. Процесс занимает часы. Что определяет выбор между ремонтом и удалением, неизвестно.</dd></div><div id="ns-g-S12-T41"><dt>TAX1BP1</dt><dd>Рецептор селективной аутофагии с доменом SKICH, который связывает TBK1 и FIP200 (RB1CC1). По результатам систематического нокаута рецепторов в клетках HeLa и индуцированных нейронах вместе с TBK1 он необходим для лизофагического потока; при отсутствии OPTN или NDP52 поток в HeLa сохраняется. Для его работы нужны ранее поставленные убиквитиновые метки.</dd></div><div id="ns-g-S12-T42"><dt>VCP/p97</dt><dd>АТФаза семейства AAA, извлекающая убиквитинированные белки из мембран и комплексов. При лизофагии она, например, извлекает белок CNN2 с повреждённой лизосомы; в этой работе ей помогают YOD1, UBXD1 и PLAA. Болезнетворные мутации VCP нарушают лизофагию, и повреждённые лизосомы накапливаются в тканях больных.</dd></div><div id="ns-g-S12-T43"><dt>TFEB и TFE3</dt><dd>Транскрипционные факторы семейства MiT/TFE, главные регуляторы биогенеза лизосом и аутофагии. В норме mTORC1 на лизосоме фосфорилирует TFEB, и белки 14-3-3 удерживают его в цитозоле. После дефосфорилирования TFEB переходит в ядро, связывается с мотивом CLEAR и включает гены лизосомных и аутофагических белков.</dd></div><div id="ns-g-S12-T44"><dt>Кальциневрин</dt><dd>Ca²⁺- и кальмодулин-зависимая фосфатаза. Ca²⁺, вышедший через лизосомный канал TRPML1 (MCOLN1), активирует кальциневрин, и тот дефосфорилирует TFEB. При повреждении лизосомы присоединённые к мембране белки ATG8 усиливают выход Ca²⁺ через TRPML1.</dd></div><div id="ns-g-S12-T45"><dt>Регенерация лизосом (LYTL, ALR, B-fission)</dt><dd>Образование новых лизосом из материала существующих. LYTL: киназа LRRK2 фосфорилирует RAB35 и RAB10, адаптер JIP4 вытягивает трубки без LAMP1, и от них отделяются пузырьки. ALR: отделение протолизосом от автолизосом. B-fission (budding-type fission) описан при гипоксии–реоксигенации в клетках HeLa: везикулы митохондриального происхождения доставляют MFF, и DRP1 отщепляет почки. Значение этих путей в тканях неясно.</dd></div><div id="ns-g-S12-T46"><dt>Триаж белков (кинетическая конкуренция маршрутов)</dt><dd>Распределение повреждённых молекул между рефолдингом, протеасомой, ERAD и аутофагией. Оно складывается из скоростей конкурирующих процессов, которые зависят от сродства, локальных концентраций, авидности и разделения на отсеки; центральной системы, которая оценивала бы повреждение и выбирала маршрут, не обнаружено (Pohl, Dikic 2019). Термин «триаж» применили к балансу между свёртыванием и деградацией субстратов шаперонов (Connell 2001).</dd></div><div id="ns-g-S12-T47"><dt>Ёмкость протеостаза</dt><dd>Способность сети шаперонов, протеасом и аутофагии справляться с нагрузкой несвёрнутыми белками. При старении и при хронической экспрессии агрегирующих белков ёмкость снижается: агрегаты захватывают шапероны и протеасомы, из-за чего несвёрнутых молекул становится больше. Возникает положительная обратная связь, которая может привести к нарушению протеостаза (Hipp 2019). На схемах ёмкость показана качественно.</dd></div><div id="ns-g-S12-T48"><dt>CHIP</dt><dd>Убиквитинлигаза E3 с TPR-доменом: присоединяется к С-концу Hsp70 или Hsp90 и убиквитинирует субстраты, не способные свернуться и долго остающиеся в комплексе с шаперонами (Hipp 2019). Для рецептора глюкокортикоидов показано, что CHIP смещает баланс от свёртывания к деградации в протеасоме (Connell 2001; клетки COS).</dd></div><div id="ns-g-S12-T49"><dt>BAG1 и BAG3</dt><dd>Ко-шапероны семейства BAG, регулирующие Hsc70 и Hsp70. BAG1 связан с протеасомной деградацией полиубиквитинированных белков, BAG3 — с макроаутофагией. В моделях клеточного старения и в нейронах стареющего мозга грызунов отношение BAG3 к BAG1 растёт (Gamerdinger 2009).</dd></div><div id="ns-g-S12-T50"><dt>CASA (шаперон-зависимая селективная аутофагия)</dt><dd>Путь, в котором комплекс BAG3, Hsc70 и HSPB8 с убиквитинлигазой CHIP и адаптером p62 направляет повреждённые белки в аутофагию. В мышцах он удаляет повреждённые белки Z-диска, например филамин; нарушение CASA приводит к распаду Z-диска и мышечной слабости (Arndt 2010; Drosophila, мышь). CASA отличается от шаперон-опосредованной аутофагии, при которой белок переносится через мембрану лизосомы без убиквитина.</dd></div><div id="ns-g-S12-T51"><dt>Убиквитиновый код</dt><dd>Набор способов, которыми убиквитины соединены в цепь: через Met1 или Lys6, 11, 27, 29, 33, 48, 63; цепи бывают линейными и ветвящимися. Цепи K48 и ветвящиеся цепи K48–K11 — самые сильные сигналы для протеасомы (Pohl, Dikic 2019); для модельных субстратов in vitro минимальным сигналом эффективного узнавания был тетраубиквитин (Thrower 2000), но часть белков разрушается протеасомой и после моноубиквитинирования (Braten 2016). Предпочтение рецепторов аутофагии к цепям K63 и M1 и протеасомы к K48 показано в основном при сверхэкспрессии и in vitro и не абсолютно (Adriaenssens 2022).</dd></div><div id="ns-g-S12-T52"><dt>p62 (SQSTM1): димер и олигомер</dt><dd>Белок с доменами PB1, ZZ, UBA и мотивом LIR. Димер p62 узнаёт цепи K48 на одиночных молекулах и подаёт их к протеасоме через PB1. Олигомер формирует тельца p62 и привлекает мембраны аутофагии через LIR; он образуется на цепях K63 (Sun 2018, in vitro), при избытке свободного убиквитина или на N-дегроне (Pohl, Dikic 2019; Cha-Molstad 2015). На субстратах с двумя и более цепями длиннее трёх убиквитинов скопления p62 формируются в реконструированной системе (Zaffagnini 2018).</dd></div><div id="ns-g-S12-T53"><dt>Убиквитиновый стресс</dt><dd>Состояние с высокой концентрацией свободного убиквитина, например после теплового шока или при длительном подавлении протеасомы. Убиквитинирование p62 по нескольким лизинам нарушает димеризацию по домену UBA и способствует олигомеризации p62, то есть направлению груза в аутофагию (Pohl, Dikic 2019).</dd></div><div id="ns-g-S12-T54"><dt>p97 (VCP)</dt><dd>AAA-АТФаза, которая извлекает убиквитинированные белки из мембран и комплексов. p97 накапливается на деполяризованных митохондриях и нужен для разрушения митофузинов, помеченных Parkin (Tanaka 2010). Подавление p97 приводит к удержанию субстратов ERAD и накоплению полиубиквитинированных белков (Anderson 2015).</dd></div><div id="ns-g-S12-T55"><dt>ERAD-устойчивый агрегат</dt><dd>Агрегат белка в просвете ЭПР, который агрегация не позволяет вывести в цитозоль (Fregno 2018). Примеры — полимеры α1-антитрипсина Z (ATZ) и неправильно свёрнутый проколлаген. Такие агрегаты удаляют лизосомные пути с участием калнексина и FAM134B (Fregno 2018; Forrester 2019).</dd></div><div id="ns-g-S12-T56"><dt>ERLAD и ER-фагия</dt><dd>ERLAD — путь «от ЭПР к лизосоме» для устойчивых к протеасоме полимеров ATZ: калнексин и FAM134B направляют груз в одномембранные везикулы, происходящие из ЭПР; их слияние с эндолизосомами зависит от STX17 и VAMP8, а захват ЭПР аутофагосомой не требуется (Fregno 2018). ER-фагия — селективная аутофагия частей ЭПР с рецепторами FAM134B, RTN3, ATL3, TEX264, CCPG1; проколлаген удаляется через комплекс калнексина с FAM134B (Forrester 2019; Pohl, Dikic 2019). На схемах оба пути объединены как лизосомный маршрут.</dd></div><div id="ns-g-S12-T57"><dt>Nrf1 и восстановление протеасомы</dt><dd>Транскрипционный фактор Nrf1 необходим для индуцированной транскрипции генов субъединиц протеасомы при подавлении её активности: так активность протеасомы согласуется с потребностью (Radhakrishnan 2010; фибробласты мыши). При подавлении протеасомы растёт также экспрессия p62 и GABARAP (Pohl, Dikic 2019).</dd></div><div id="ns-g-S12-T58"><dt>Протеафагия</dt><dd>Разрушение самих протеасом аутофагией. Наблюдается при длительном голодании по аминокислотам и, в меньшей степени, в базальных условиях; в этом процессе убиквитинирование привлекает p62 (Pohl, Dikic 2019). Пример связи двух систем: протеасома служит субстратом аутофагии.</dd></div><div id="ns-g-S12-T59"><dt>Ингибиторный анализ маршрута</dt><dd>Подход, при котором маршрут деградации белка определяют по накоплению белка при подавлении одного маршрута и по сравнению с подавлением нескольких. Результат ограничен избирательностью препаратов и тем, что подавление одного маршрута усиливает другие (Pohl, Dikic 2019; Tsubuki 1996).</dd></div><div id="ns-g-S12-T60"><dt>Период полужизни белка</dt><dd>Время, за которое количество белка падает вдвое после остановки синтеза. Для субстратов убиквитин-протеасомной системы периоды полужизни лежат в диапазоне от секунд до часов (Pohl, Dikic 2019). Измеряют, например, после обработки циклогексимидом и сравнивают с ингибиторами маршрутов.</dd></div><div id="ns-g-S12-T61"><dt>Измеряемая величина</dt><dd>Свойство объекта, которое регистрирует метод: связывание, положение белка, доля доставки в кислый отсек, содержание белка во времени. Выбор величины предшествует выбору метода.</dd></div><div id="ns-g-S12-T62"><dt>Контроль эксперимента</dt><dd>Условие, которое исключает другое объяснение результата: мутант без нужного модуля, клетки без звена, общий белок на той же мембране, обработка без воздействия.</dd></div><div id="ns-g-S12-T63"><dt>Граница вывода</dt><dd>Перечень того, чего данное показание не показывает: условия, клетки, срок и объяснения, которые оно не исключает.</dd></div><div id="ns-g-S12-T64"><dt>Метка повреждения</dt><dd>Молекулярный признак, по которому объект отбирается для удаления: цепь убиквитина или pS65-убиквитин на митохондрии. Метка считывается шапероном, протеасомой или рецептором. Галектин на лизосоме отмечает повреждение, но рецептором аутофагии не считывается.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 12 — Селективная аутофагия и контроль качества органелл","home_eyebrow":"Семинар 12 · самостоятельная подготовка","home_h1":"Как клетка отбирает\nповреждённое для разрушения","home_lead":"Проследите, как рецептор соединяет помеченный груз с мембраной аутофагосомы, как PINK1 и Parkin отмечают митохондрию с утраченным потенциалом, как клетка отвечает на повреждение лизосомной мембраны и от чего зависит маршрут повреждённого белка.","start":"Начать с рецепторов →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в этот интерактив. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Схемы механизма, качественные состояния учебной модели и данные конкретных экспериментов обозначены отдельно: условные величины не являются измерениями в клетках человека.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат эксперимента","practice_p":"47 сценариев с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 2.2 · 29 октября 2026 г. · Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры.","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}",
