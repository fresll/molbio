 фосфорилируется киназой AKT.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li><li><a href="https://doi.org/10.1042/BJ20031450">Zhao X. et al. Multiple elements regulate nuclear/cytoplasmic shuttling of FOXO1: characterization of phosphorylation- and 14-3-3-dependent and -independent mechanisms. Biochem J. 2004;378:839–49. doi:10.1042/BJ20031450</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10358075/">Rena G et al. 1999. Phosphorylation of the transcription factor forkhead family member FKHR by protein kinase B</a></li><li><a href="https://doi.org/10.1038/nchembio.183">Okuzumi T. et al. Inhibitor hijacking of Akt activation. Nat Chem Biol. 2009;5:484–93. doi:10.1038/nchembio.183</a></li></ul><p>Фосфорилирование человеческого FOXO1 киназой PKB/AKT по Thr24, Ser256 и Ser319, его зависимость от PI3K (вортманнин) и независимость от рапамицина показаны в клетках 293 при стимуляции IGF-1 (Rena и соавт., 1999); эти же номера остатков названы в работе Zhao и соавт. (2004). Зависимость гиперфосфорилирования AKT по Thr308 и Ser473 от PI3K, PDK1 и mTORC2 описана в клетках HEK293 (Okuzumi и соавт., 2009). Роль PTEN дана как общее сведение о пути и в источниках шага не измерялась. Схема качественная: уровни условны и не измерены.</p></details></article><article class="card print-unit" id="ns-foxo-transport"><div class="eyebrow">FOXO и сигнал · шаг 16 из 28</div><h2>Как фосфорилирование меняет распределение FOXO1</h2><p class="lead">Фосфорилирование FOXO1 меняет баланс между переносом белка в ядро и из ядра. Перенос в ядро и из ядра, связывание с ДНК и синтез РНК — разные события, и измеряют их отдельно.</p><div class="note"><strong>Что показывает схема.</strong> Модель показывает FOXO1, который постоянно перемещается между ядром и цитоплазмой. Доля белка в ядре определяется соотношением констант импорта и экспорта. Фосфорилирование ослабляет импорт, усиливает экспорт или делает и то и другое, поэтому доля в ядре уменьшается, но не до нуля. Лептомицин B подавляет CRM1-зависимый экспорт: FOXO1 накапливается в ядре, но остаётся фосфорилированным, и его связывание с ДНК может быть слабым.</div><ol class="mech"><li>FOXO1 постоянно перемещается между ядром и цитоплазмой; в белке есть <a href="#ns-g-S6-T45">сигнал ядерной локализации (NLS)</a> и <a href="#ns-g-S6-T46">сигнал ядерного экспорта (NES)</a>.</li><li>Фосфорилирование Thr24, Ser256 и Ser319 влияет на перенос несколькими способами: с фосфорилированным FOXO1 связываются белки <a href="#ns-g-S6-T47">14-3-3</a>, а Ser319 и соседние остатки действуют совместно с NES.</li><li>Экспорт FOXO1 из ядра чувствителен к лептомицину B; экспортным рецептором такого сигнала служит <a href="#ns-g-S6-T48">CRM1/XPO1</a> (для FOXO1 в источнике шага CRM1 прямо не показан).</li></ol><p>FOXO1 не закреплён ни в ядре, ни в цитоплазме: он постоянно переходит между ними. В белке есть сигнал ядерной локализации в C-концевой области ДНК-связывающего домена, богатой основными аминокислотами, и лейцин-богатый сигнал ядерного экспорта, чувствительный к лептомицину B. <a href="#ns-g-S6-T50">Доля FOXO1 в ядре</a> определяется соотношением скоростей импорта и экспорта, а не одной из них.</p><p>Фосфорилирование Thr24, Ser256 и Ser319 смещает это соотношение несколькими способами. Белки 14-3-3 связываются с фосфорилированным FOXO1, и для этого существенны одновременно Thr24 и Ser256. Ser319 и три соседних остатка действуют совместно с сигналом экспорта. Участок 1–50, слитый с GFP, достаточен для исключения белка из ядра, и для этого необходимо фосфорилирование Thr24. Эти способы не заменяют друг друга и не сводятся к одному остатку.</p><p>Белок 14-3-3 — партнёр связывания, а не экспортный рецептор. FOXO1 переносится из ядра рецептором CRM1/XPO1, поэтому при активном сигнале инсулина под действием лептомицина B FOXO1 должен накапливаться в ядре, а его фосфорилирование — сохраняться. Связывание фосфорилированного FOXO1 с ДНК при этом может оставаться слабым. Это предсказание вытекает из устройства пути: в источниках шага такой опыт не описан.</p><p>У других паралогов схема иная. Для FOXO4 (AFX) в клетках 3T3 показано, что AKT фосфорилирует белок в ядре по Ser193 внутри неклассического сигнала ядерной локализации и ослабляет импорт, а экспорт фосфорилированием не регулируется. Поэтому, говоря о переносе, называют белок, участок и клетки.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилированный FOXO1 связан с 14-3-3, значит, 14-3-3 выводит его из ядра.<p class="trap-fix">Белки 14-3-3 связывают фосфорилированные мотивы, но экспортным рецептором служит CRM1/XPO1. Авторы источника (Zhao и соавт., 2004) допускают, что белок 14-3-3, связанный в районе Ser256, может препятствовать ядерному импорту FOXO1 и его связыванию с ДНК; вклад каждого механизма зависит от участка и белка.</p></div><div class="static-quiz"><h3>На фоне активного сигнала инсулина в клетках с FOXO1 добавили лептомицин B, подавляющий CRM1-зависимый экспорт. Какое изменение следует проверять непосредственно?</h3><ol><li><b>А.</b> Уменьшение CRM1-зависимого экспорта и изменение доли FOXO1 в ядре. <i>(верный вариант)</i><br><span class="expl">Подавление экспорта и последующее изменение доли FOXO1 в ядре — разные события; фосфорилирование и связывание с ДНК измеряют отдельно.</span></li><li><b>Б.</b> Снятие всех фосфатных групп с FOXO1 ингибитором экспорта. <i>(неверный вариант)</i><br><span class="expl">Ингибитор экспортного рецептора не является фосфатазой.</span></li><li><b>В.</b> Активация всех мишеней FOXO1 независимо от состояния их хроматина. <i>(неверный вариант)</i><br><span class="expl">Удержание FOXO1 в ядре не гарантирует ни связывания с локусом, ни синтеза РНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BJ20031450">Zhao X. et al. Multiple elements regulate nuclear/cytoplasmic shuttling of FOXO1: characterization of phosphorylation- and 14-3-3-dependent and -independent mechanisms. Biochem J. 2004;378:839–49. doi:10.1042/BJ20031450</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/11313479/">Brownawell AM et al. 2001. Inhibition of nuclear import by protein kinase B (Akt) regulates the subcellular distribution and activity of the forkhead transcription factor AFX</a></li><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li></ul><p>Остатки Thr24, Ser256, Ser319, участие 14-3-3 и участок 1–50 описаны для FOXO1 человека (Zhao и соавт., 2004; в реферате не названы киназа, клеточная линия и CRM1: сведение о CRM1 как экспортном рецепторе и о действии лептомицина B общее). Данные по FOXO4 (AFX) получены в клетках 3T3 (Brownawell и соавт., 2001). Схема на экране — учебная модель с условными константами скорости, а не измерения.</p></details></article><article class="card print-unit" id="ns-foxo-context"><div class="eyebrow">FOXO и сигнал · шаг 17 из 28</div><h2>Почему фосфорилирование FOXO даёт разные результаты</h2><p class="lead">Фосфатная группа сама по себе не определяет результат: он зависит от киназы, участка белка, паралога и клеточных условий. Ацетилирование и деацетилирование добавляют ещё один независимый уровень регуляции.</p><div class="note"><strong>Что показывает схема.</strong> AKT фосфорилирует FOXO1 человека по Thr24, Ser256 и Ser319: белок исключается из ядра, активность подавляется. SGK1 фосфорилирует FOXO3, предпочитая Ser315, тогда как AKT предпочитает Ser253; обе киназы фосфорилируют Thr32. JNK (через Ral) фосфорилирует FOXO4 по Thr447 и Thr451; это фосфорилирование участвует в переходе FOXO4 в ядро и усиливает его активность. MST1 фосфорилирует консервативный участок forkhead-домена в первичных нейронах, нарушает связь с 14-3-3 и способствует переходу FOXO в ядро. AMPK фосфорилирует FOXO3 по шести участкам и усиливает его активность без изменения локализации. CBP ацетилирует FOXO4 и подавляет его активность, SIRT1 деацетилирует FOXO3 и действует двояко: усиливает остановку клеточного цикла и устойчивость к стрессу, но ослабляет гибель клеток.</div><ol class="mech"><li>AKT и SGK фосфорилируют FOXO и подавляют его транскрипционную активность.</li><li>Киназы JNK и MST1 фосфорилируют FOXO по другим участкам; в описанных системах это усиливает активность FOXO и способствует его переходу в ядро.</li><li>AMPK изменяет активность FOXO3 без перемещения между ядром и цитоплазмой; ацетилирование и деацетилирование меняют транскрипционные свойства FOXO.</li></ol><p>Для вывода о влиянии фосфата нужно знать киназу, участок и белок. Фосфорилирование FOXO киназой AKT подавляет его транскрипционную активность. Для FOXO4 in vitro показано, что фосфорилирование Thr28 и Ser193 создаёт два мотива связывания для <a href="#ns-g-S6-T47">14-3-3</a>, и для полного подавления связывания с ДНК нужны оба.</p><p>Стрессовые киназы действуют иначе. При окислительном стрессе JNK фосфорилирует FOXO4 по Thr447 и Thr451; это фосфорилирование участвует в переходе белка в ядро и в активации транскрипции. В первичных нейронах киназа MST1 фосфорилирует консервативный участок forkhead-домена FOXO и нарушает связь FOXO с 14-3-3; перенос FOXO в ядро приводит к гибели нейронов. Эти результаты получены на разных паралогах и в разных клетках, поэтому в одну схему их не складывают.</p><p>AMPK фосфорилирует FOXO3 человека по шести участкам и усиливает его транскрипционную активность без изменения локализации; значит, активность FOXO нельзя вывести только из его положения. Ацетилирование образует отдельный уровень регуляции: при пероксидном стрессе CBP ацетилирует FOXO4 и подавляет его активность, а SIRT1 деацетилирует FOXO и продлевает транскрипцию генов ответа на стресс. На FOXO3 SIRT1 действует двояко: усиливает остановку клеточного цикла и устойчивость к окислительному стрессу, но подавляет индукцию гибели клеток.</p><p>Убиквитинирование и протеасомная деградация FOXO — ещё один способ регуляции; он зависит от условий и здесь не рассматривается.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое фосфорилирование FOXO выводит его из ядра и подавляет его работу.<p class="trap-fix">Для AKT это показано, но JNK, MST1 и AMPK фосфорилируют другие участки, и в описанных системах активность FOXO при этом растёт; у AMPK — без изменения локализации. Знак эффекта определяют участок, киназа, паралог и клетки.</p></div><div class="static-quiz"><h3>AKT и стрессовая киназа фосфорилируют FOXO по разным участкам. Можно ли предсказать одинаковый эффект только по наличию фосфата?</h3><ol><li><b>А.</b> Нет; нужно знать участок, киназу, паралог и клеточные условия. <i>(верный вариант)</i><br><span class="expl">Разные модификации меняют разные взаимодействия и функции.</span></li><li><b>Б.</b> Да; фосфорилирование по любому участку полностью активирует FOXO. <i>(неверный вариант)</i><br><span class="expl">Для AKT в изучаемом механизме фосфорилирование ограничивает доступ FOXO к части ядерных мишеней.</span></li><li><b>В.</b> Да; фосфорилирование по любому участку разрушает белок FOXO. <i>(неверный вариант)</i><br><span class="expl">Наличие фосфатной группы само по себе не означает, что белок будет расщеплён протеасомой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li><li><a href="https://doi.org/10.1042/BJ20031450">Zhao X. et al. Multiple elements regulate nuclear/cytoplasmic shuttling of FOXO1: characterization of phosphorylation- and 14-3-3-dependent and -independent mechanisms. Biochem J. 2004;378:839–49. doi:10.1042/BJ20031450</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10358075/">Rena G et al. 1999. Phosphorylation of the transcription factor forkhead family member FKHR by protein kinase B</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10358014/">Tang ED et al. 1999. Negative regulation of the forkhead transcription factor FKHR by Akt</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/11154281/">Brunet A et al. 2001. Protein kinase SGK mediates survival signals by phosphorylating the forkhead transcription factor FKHRL1 (FOXO3a)</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/15538382/">Essers MAG et al. 2004. FOXO transcription factor activation by oxidative stress mediated by the small GTPase Ral and JNK</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/16751106/">Lehtinen MK et al. 2006. A conserved MST-FOXO signaling pathway mediates oxidative-stress responses and extends life span</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/17711846/">Greer EL et al. 2007. The energy sensor AMP-activated protein kinase directly regulates the mammalian FOXO3 transcription factor</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/15126506/">van der Horst A et al. 2004. FOXO4 is acetylated upon peroxide stress and deacetylated by the longevity protein hSir2(SIRT1)</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/14976264/">Brunet A et al. 2004. Stress-dependent regulation of FOXO transcription factors by the SIRT1 deacetylase</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/14690436/">Obsil T et al. 2003. Two 14-3-3 binding motifs are required for stable association of Forkhead transcription factor FOXO4 with 14-3-3 proteins and inhibition of DNA binding</a></li></ul><p>Участки и результаты приведены по рефератам первичных работ и относятся к разным системам: FOXO1 в клетках 293 и 293T (Rena и соавт., 1999; Tang и соавт., 1999); FOXO3 с SGK и AMPK (Brunet и соавт., 2001; Greer и соавт., 2007); FOXO4 с JNK и CBP в клетках и с 14-3-3 in vitro (Essers и соавт., 2004; van der Horst и соавт., 2004; Obsil и соавт., 2003); первичные нейроны с MST1 (Lehtinen и соавт., 2006; вид по индексации PubMed — крыса); SIRT1 и FOXO3 (Brunet и соавт., 2004). Обзор Rodriguez-Colman и соавт. (2024) дан как общая рамка.</p></details></article><article class="card print-unit" id="ns-foxo-binding"><div class="eyebrow">FOXO и сигнал · шаг 18 из 28</div><h2>От ядерной локализации к связыванию с ДНК и синтезу РНК</h2><p class="lead">Присутствие FOXO в ядре — условие его работы, но не доказательство связывания с участком ДНК и не доказательство синтеза РНК. Доля белка в ядре, занятость участка и новосинтезированная РНК — три разные величины со своими условиями.</p><div class="note"><strong>Что показывает схема.</strong> Схема сравнивает два образца по трём величинам: доля FOXO в ядре, занятость участка и новосинтезированная РНК мишени. При одинаковой доле в ядре занятость участка ниже, если участок недоступен, нарушен ДНК-связывающий домен или нет партнёрского фактора; синтез РНК, кроме того, зависит от условий на промоторе.</div><ol class="mech"><li>Сначала FOXO перемещается между цитоплазмой и ядром; соотношение импорта и экспорта определяет <a href="#ns-g-S6-T50">долю FOXO в ядре</a>.</li><li>Затем FOXO связывается с доступным участком ДНК с помощью ДНК-связывающего домена; <a href="#ns-g-S6-T49">занятость участка</a> зависит также от концентрации белка, сродства и других факторов.</li><li>Наконец, на промоторе идёт транскрипция; её измеряют по <a href="#ns-g-S6-T52">новосинтезированной РНК</a>.</li></ol><p>Ядерная локализация определяет, сколько молекул FOXO вообще может связаться с хроматином, но не говорит о том, какие участки заняты. Занятость конкретного участка зависит от концентрации FOXO в ядре, его сродства к последовательности, доступности участка в хроматине и времени, в течение которого фактор остаётся связанным. Поэтому в двух образцах с одинаковой долей FOXO в ядре занятость одного и того же участка может различаться.</p><p>Если участок закрыт нуклеосомой, FOXO может не связаться с ним, хотя в ядре присутствует. Если ДНК-связывающий домен нарушен так, что ядерный импорт сохранён, белок остаётся в ядре, но не связывается с мотивом. Важны и другие факторы: на промоторах IGFBP1 и G6PC в клетках HepG2 связывание FOXO1 и FoxA1/A2 было взаимозависимым, и после снижения связывания одного из них уменьшалось связывание другого и РНК-полимеразы II.</p><p>Ранее для промотора IGFBP1 было показано, что FOXO1 открывает и перестраивает хроматин; фосфомиметическая замена серина в ДНК-связывающем мотиве ослабляла связывание FOXO1 с нуклеосомой. Эти данные получены на двух промоторах в одной клеточной линии, поэтому на все локусы и клетки их не переносят.</p><p>Синтез РНК тоже проверяют отдельно: даже при занятом участке результат зависит от условий на промоторе. Поэтому локализацию FOXO, связывание с участком и новосинтезированную РНК измеряют разными методами (шаг 20).</p><div class="note trap"><strong>Типичная ошибка</strong> Если FOXO находится в ядре, его мотивы в каждом локусе постоянно заняты.<p class="trap-fix">Занятость зависит от концентрации, сродства, доступности участка и времени; постоянное насыщение участков не гарантировано. Закрытый хроматин и нарушенный ДНК-связывающий домен ограничивают связывание при сохранной ядерной локализации.</p></div><div class="static-quiz"><h3>В двух образцах доля FOXO в ядре одинакова. В одном из них доступность участка связывания FOXO снижена. Следует ли ожидать одинакового связывания FOXO с этим участком и синтеза РНК мишени?</h3><ol><li><b>А.</b> Нет; доступность участка и другие условия могут ограничить связывание и синтез РНК. <i>(верный вариант)</i><br><span class="expl">Локализация — лишь одно звено механизма. Проверяют связывание с исследуемым участком и синтез РНК мишени.</span></li><li><b>Б.</b> Да; одинаковая доля FOXO в ядре полностью определяет и связывание, и синтез РНК мишени. <i>(неверный вариант)</i><br><span class="expl">По доле FOXO в ядре нельзя судить о доступности каждого локуса и об условиях на промоторе.</span></li><li><b>В.</b> Да; наличие FOXO в ядре означает, что каждый его мотив в геноме постоянно занят белком. <i>(неверный вариант)</i><br><span class="expl">Занятость зависит от концентрации, сродства, доступности и времени; постоянное насыщение участков не гарантировано.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4861452/">Yalley A et al. 2016. Loss of Interdependent Binding by the FoxO1 and FoxA1/A2 Forkhead Transcription Factors Culminates in Perturbation of Active Chromatin Marks and Binding of Transcriptional Regulators at Insulin-sensitive Genes</a></li><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li></ul><p>Взаимозависимое связывание FOXO1 и FoxA1/A2, снижение связывания РНК-полимеразы II и ацетилирования H3K27 показаны на промоторах IGFBP1 и G6PC в клетках HepG2 (Yalley и соавт., 2016; реферат); авторы считают, что механизм, возможно, кооперативный. Фосфомиметическая замена не равна фосфорилированию киназой. Схема на экране — учебная модель, уровни качественные.</p></details></article><article class="card print-unit" id="ns-foxo-paralogs"><div class="eyebrow">FOXO и сигнал · шаг 19 из 28</div><h2>Почему эффект FOXO зависит от паралога и ткани</h2><p class="lead">FOXO1, FOXO3, FOXO4 и FOXO6 — продукты разных генов, а не разные состояния одного белка. Схему регуляции, установленную для одного паралога, проверяют для другого, а результат зависит от ткани и мишени.</p><div class="note"><strong>Что показывает схема.</strong> FOXO1, FOXO3 и FOXO4 имеют три консервативных района с мотивом фосфорилирования PKB; в мышином FoxO6 одного из них нет. При трансфекции GFP-слитый FoxO6 после обработки ростовыми факторами остаётся преимущественно в ядре, но его экспорт зависит от пути PI3K/PKB. FOXO1: Thr24, Ser256, Ser319; FOXO3: Thr32, Ser253, Ser315 (AKT предпочитает Ser253, SGK — Ser315); FOXO4: Thr28 и Ser193 (два мотива связывания 14-3-3 in vitro).</div><ol class="mech"><li>Четыре белка <a href="#ns-g-S6-T44">FOXO</a> человека кодируются разными генами и регулируются неодинаково.</li><li>У FOXO1, FOXO3 и FOXO4 три консервативных района с мотивом фосфорилирования PKB; в мышином FoxO6 одного из них нет.</li><li>Мишени и результат зависят от ткани: в печени это гены глюконеогенеза, в других системах — гены антиоксидантной защиты, регуляции клеточного цикла и клеточной гибели.</li></ol><p>FOXO1, FOXO3, FOXO4 и FOXO6 близки по ДНК-связывающему домену, но кодируются разными генами и регулируются неодинаково. Их нельзя считать состояниями одного белка: FOXO6 не является «дефосфорилированным FOXO1». Вывод, сделанный для одного паралога, поэтому проверяют для другого.</p><p>Различие хорошо видно на FoxO6 мыши. В нём нет одного из трёх консервативных районов с мотивом фосфорилирования PKB, которые есть у других членов группы. В опытах с трансфекцией GFP-слитый FoxO6 после обработки ростовыми факторами оставался преимущественно в ядре, а FoxO1 и FoxO3 были преимущественно цитоплазматическими. При этом экспорт FoxO6 зависел от пути PI3K/PKB, так что у него иная схема регуляции, а не её отсутствие.</p><p>Ткань и мишень тоже влияют на результат. В клетках HepG2 FOXO1 связан с промоторами IGFBP1 и G6PC; к генам глюконеогенеза относят также PCK1. В других системах среди мишеней FOXO называют SOD2, каталазу, CDKN1B, гены аутофагии и апоптоза. Набор мишеней зависит от паралога, доступности хроматина и сигнала, поэтому перечень не означает, что все они регулируются в одной клетке.</p><p>Связь FOXO с продолжительностью жизни показана на модельных организмах, например на C. elegans, у которого ортолог FOXO — белок DAF-16. Это не даёт оснований для утверждений о продлении жизни человека или о лечебном эффекте.</p><div class="note trap"><strong>Типичная ошибка</strong> Если FOXO6 остаётся в ядре после обработки ростовыми факторами, он не зависит от сигнала PI3K и AKT.<p class="trap-fix">Экспорт мышиного FoxO6 зависит от пути PI3K/PKB, но схема регуляции переноса у него иная, чем у FOXO1: нет одного из трёх консервативных районов. Неполный ответ на сигнал не означает отсутствия регуляции.</p></div><div class="static-quiz"><h3>При одинаковом стимуле доля FOXO6 в ядре меняется иначе, чем доля FOXO1. Что следует учитывать, объясняя это различие?</h3><ol><li><b>А.</b> У паралогов различаются элементы регуляции переноса и модификаций. <i>(верный вариант)</i><br><span class="expl">Механизм, установленный для FOXO1, нельзя автоматически переносить на FOXO6.</span></li><li><b>Б.</b> FOXO6 представляет собой полностью дефосфорилированное состояние молекулы FOXO1. <i>(неверный вариант)</i><br><span class="expl">FOXO6 и FOXO1 — продукты разных генов. Различие паралогов не сводится к наличию фосфатных групп.</span></li><li><b>В.</b> Достаточно измерить pAKT; перенос каждого паралога отдельно оценивать не требуется. <i>(неверный вариант)</i><br><span class="expl">По pAKT нельзя судить о распределении FOXO. Особенности паралогов требуют прямого анализа локализации и связывания.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.M302804200">Jacobs FM. et al. FoxO6, a novel member of the FoxO class of transcription factors with distinct shuttling dynamics. J Biol Chem. 2003;278:35959–67. doi:10.1074/jbc.M302804200</a></li><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4861452/">Yalley A et al. 2016. Loss of Interdependent Binding by the FoxO1 and FoxA1/A2 Forkhead Transcription Factors Culminates in Perturbation of Active Chromatin Marks and Binding of Transcriptional Regulators at Insulin-sensitive Genes</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10358075/">Rena G et al. 1999. Phosphorylation of the transcription factor forkhead family member FKHR by protein kinase B</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/11154281/">Brunet A et al. 2001. Protein kinase SGK mediates survival signals by phosphorylating the forkhead transcription factor FKHRL1 (FOXO3a)</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/14690436/">Obsil T et al. 2003. Two 14-3-3 binding motifs are required for stable association of Forkhead transcription factor FOXO4 with 14-3-3 proteins and inhibition of DNA binding</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/11313479/">Brownawell AM et al. 2001. Inhibition of nuclear import by protein kinase B (Akt) regulates the subcellular distribution and activity of the forkhead transcription factor AFX</a></li></ul><p>Сведения о FoxO6 — по реферату работы Jacobs и соавт. (2003): белок мыши, GFP-слитая конструкция, трансфекция; клеточная линия и остатки в реферате не названы, количественных данных нет. Участки FOXO1, FOXO3 и FOXO4 даны по Rena и соавт. (1999), Brunet и соавт. (2001) и Obsil и соавт. (2003). Мишени в HepG2 — по Yalley и соавт. (2016). Перечень мишеней в других системах, а также PCK1 даны по программе курса и общим сведениям и не проверялись по первичным работам.</p></details></article><article class="card print-unit" id="ns-foxo-measure"><div class="eyebrow">FOXO и сигнал · шаг 20 из 28</div><h2>Как проверить прямое звено регуляции FOXO</h2><p class="lead">Каждый показатель отвечает на свой вопрос: где находится FOXO, связан ли он с ДНК, фосфорилирован ли он и синтезируется ли РНК. Высокий pAKT не доказывает, что AKT фосфорилирует субстрат; для этого измеряют фосфорилирование самого субстрата.</p><div class="note"><strong>Что показывает схема.</strong> Положение FOXO показывают иммунофлуоресценция и анализ фракций; фосфорилирование остатка — фосфоспецифические антитела; активность AKT — фосфорилирование субстрата; связывание с ДНК — ChIP или CUT&amp;RUN; транскрипцию — новосинтезированная РНК. При АТФ-конкурентном ингибиторе AKT pAKT может быть высоким при подавленном фосфорилировании субстрата GSK3β; при аллостерическом ингибиторе Akti-1,2 гиперфосфорилирование подавлялось. FOXO1-AAA не может быть фосфорилирован по Thr24, Ser256 и Ser319; фосфомиметическая замена имитирует фосфат лишь отчасти.</div><ol class="mech"><li>Положение FOXO определяют иммунофлуоресценцией или в ядерной и цитоплазматической фракциях; фосфорилирование — фосфоспецифическими антителами.</li><li>Связывание с участком ДНК измеряют методами ChIP или CUT&amp;RUN, а синтез РНК — по новосинтезированной РНК.</li><li><a href="#ns-g-S6-T51">Каталитическую активность AKT</a> оценивают по фосфорилированию её субстрата, а не по pAKT.</li></ol><p>Метод подбирают к вопросу. Положение FOXO показывают иммунофлуоресценция и анализ ядерной и цитоплазматической фракций, но связывание с ДНК они не показывают. Фосфорилирование конкретного остатка выявляют фосфоспецифические антитела. Занятость участка оценивают методами ChIP или CUT&amp;RUN; их сигнал не равен абсолютной доле занятых молекул. О синтезе РНК за заданный интервал судят по <a href="#ns-g-S6-T52">новосинтезированной РНК</a>, тогда как количество суммарной РНК зависит ещё и от распада.</p><p>Особый случай — ингибиторы AKT. В клетках HEK293 АТФ-конкурентный ингибитор A-443654 вызывал гиперфосфорилирование AKT по Thr308 и Ser473, при этом фосфорилирование субстрата GSK3β по Ser9 было подавлено. Гиперфосфорилирование возникало и у каталитически неактивных вариантов AKT, поэтому его связывают с присоединением ингибитора к АТФ-связывающему участку. Для аллостерического ингибитора Akti-1,2 гиперфосфорилирование, напротив, подавлялось. Поэтому класс ингибитора называют явно, а активность AKT оценивают по субстрату. FOXO в этой работе не измеряли.</p><p>Варианты белка также называют точно. FOXO1-AAA — белок с заменой Thr24, Ser256 и Ser319 на аланин; по этим участкам он не может быть фосфорилирован. Фосфомиметическая замена вносит отрицательный заряд, но не воспроизводит фосфорилирование полностью. Вывод о роли AKT поэтому строят на сравнении вариантов в одной системе и подтверждают независимым подходом.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфомиметический вариант FOXO1 ведёт себя так же, как фосфорилированный белок.<p class="trap-fix">Замена на остаток с отрицательным зарядом имитирует фосфат лишь отчасти. В работе Yalley и соавт. такая замена в ДНК-связывающем мотиве ослабляла связывание FoxO1 с нуклеосомой, но из этого не следует, что фосфорилирование киназой AKT в клетке даёт тот же результат.</p></div><div class="static-quiz"><h3>После АТФ-конкурентного ингибитора pAKT остаётся высоким, но фосфорилирование проверенного субстрата AKT снижено. Какой вывод лучше подтверждён?</h3><ol><li><b>А.</b> Каталитическая активность AKT по этому субстрату подавлена, хотя pAKT высок. <i>(верный вариант)</i><br><span class="expl">Субстратный тест непосредственно относится к исследуемой активности. Модификация самой киназы — другой показатель.</span></li><li><b>Б.</b> AKT по-прежнему активна по всем субстратам, потому что pAKT остаётся высоким. <i>(неверный вариант)</i><br><span class="expl">При таком классе ингибиторов уровень pAKT и фосфорилирование субстрата могут расходиться.</span></li><li><b>В.</b> Общее количество белка AKT в обработанных клетках уменьшилось до нуля. <i>(неверный вариант)</i><br><span class="expl">Ни фосфорилирование, ни субстратный тест сами по себе не показывают исчезновение всего белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-6.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00649-0">Rodriguez-Colman MJ et al. 2024. FOXO transcription factors as mediators of stress adaptation</a></li><li><a href="https://doi.org/10.1038/nchembio.183">Okuzumi T. et al. Inhibitor hijacking of Akt activation. Nat Chem Biol. 2009;5:484–93. doi:10.1038/nchembio.183</a></li><li><a href="https://doi.org/10.1042/BJ20031450">Zhao X. et al. Multiple elements regulate nuclear/cytoplasmic shuttling of FOXO1: characterization of phosphorylation- and 14-3-3-dependent and -independent mechanisms. Biochem J. 2004;378:839–49. doi:10.1042/BJ20031450</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10358014/">Tang ED et al. 1999. Negative regulation of the forkhead transcription factor FKHR by Akt</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4861452/">Yalley A et al. 2016. Loss of Interdependent Binding by the FoxO1 and FoxA1/A2 Forkhead Transcription Factors Culminates in Perturbation of Active Chromatin Marks and Binding of Transcriptional Regulators at Insulin-sensitive Genes</a></li></ul><p>Результаты с A-443654 получены в клетках HEK293; часть подтверждений на каталитически неактивных вариантах — в других линиях (Okuzumi и соавт., 2009). Дозы и сроки обработки даны на рисунках работы и здесь не приводятся; фосфорилирование FOXO в ней не измеряли. Тройная замена на аланин — по реферату Tang и соавт. (1999, клетки 293T). Схема на экране показывает качественное соответствие показателей, а не измерения.</p></details></article><article class="card print-unit" id="ns-memory"><div class="eyebrow">Хроматиновая память · шаг 21 из 28</div><h2>Что нужно показать, чтобы говорить о клеточной памяти</h2><p class="lead">О клеточной памяти говорят, если изменённое состояние или изменённый ответ сохраняется после того, как исходное воздействие прекратилось. Остаток реагента, смена состава клеток и изменение хроматина могут давать внешне одинаковый результат, поэтому второй ответ сравнивают с контролем, получившим только второй стимул, а причину различия проверяют отдельными измерениями.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает ход опыта: первое воздействие, отмывка, период покоя и второй стимул у опытной группы и у контроля того же возраста, который получает только второй стимул. Вывод о следе первого воздействия допустим, если есть одновременный контроль и ответы различаются. Отмывка и покой ограничивают вклад остатка реагента, а сопоставление состава клеток позволяет исключить смену популяции как причину различия. Измерение хроматина показывает различие состояния, но не называет носитель. Носитель устанавливают вмешательством в признак, а передачу потомкам — наблюдением за делящимися клетками.</div><ol class="mech"><li>Клетки получают первое воздействие, затем его удаляют отмывкой, после чего наступает период покоя.</li><li>Опытная группа и контроль того же возраста, не получавший первого воздействия, одновременно получают второй стимул.</li><li>Различие ответов показывает, что первое воздействие оставило след; <a href="#ns-g-S6-T53">хроматиновую память</a> подтверждают только измерение хроматина и вмешательство в предполагаемый признак.</li></ol><p>О клеточной памяти говорят, когда изменённое состояние или изменённый ответ сохраняется после того, как исходное воздействие прекратилось. В опыте это выглядит так: клетки получают первый стимул, его удаляют отмывкой, а после периода покоя клетки стимулируют повторно. Если ответ на второй стимул отличается от ответа клеток, которые первого воздействия не получали, возникает вопрос, какой след оставило первое воздействие.</p><p>Чтобы ответить на этот вопрос, нужно различать несколько понятий. Состояние хроматина — это модификации гистонов, метилирование ДНК и доступность участков; его измеряют отдельно. Синтез РНК в данный момент и ответ на повторный стимул — функциональные показатели, и они не тождественны состоянию хроматина. Сохранение состояния в клетках, которые не делились, и передача его дочерним клеткам после митоза — разные утверждения: для проверки второго нужны деление клеток и наблюдение за потомками, и только передачу называют <a href="#ns-g-S6-T54">эпигенетическим наследованием</a>.</p><p>Контролем служит группа того же возраста, получившая только второй стимул в тот же срок. Сравнение с первым ответом тех же клеток не подходит: за время покоя могли измениться дифференцировка, плотность и состав культуры. Вклад остатка реагента ограничивают отмывкой и периодом покоя, а содержание вещества в среде проверяют отдельно. Изменение состава популяции выявляют подсчётом клеток разных типов и оценкой их выживаемости. Только после этого различие ответов связывают с первым воздействием, а носитель следа называют лишь после прямого измерения признака и вмешательства в него.</p><div class="note trap"><strong>Типичная ошибка</strong> Если ответ на второй стимул усилился, значит, след первого воздействия хранится в метке хроматина.<p class="trap-fix">Усиление показывает только, что ответ изменился. Тот же результат могут дать остаток реагента, смена состава клеток и возраст культуры; носитель следа определяют измерением признака и вмешательством в него. Поэтому нужны отмывка, контроль, получивший только второй стимул, и прямое измерение хроматина.</p></div><div class="static-quiz"><h3>После первого воздействия и покоя ответ на второй стимул вырос. С какой группой прежде всего нужно сравнить этот ответ?</h3><ol><li><b>А.</b> С клетками того же возраста, получившими только второй стимул в тот же срок. <i>(верный вариант)</i><br><span class="expl">Такой контроль отделяет влияние предшествующего воздействия от условий регистрации второго ответа.</span></li><li><b>Б.</b> С первым ответом тех же самых клеток, который был зарегистрирован неделю назад. <i>(неверный вариант)</i><br><span class="expl">За неделю могли измениться возраст, дифференцировка и состав культуры.</span></li><li><b>В.</b> С исходным содержанием одной гистоновой метки, измеренным в тех же самых клетках. <i>(неверный вариант)</i><br><span class="expl">Метка не заменяет функциональное измерение повторного ответа.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4242194/">Saeed S et al. 2014. Epigenetic programming of monocyte-to-macrophage differentiation and trained innate immunity</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4226238/">Cheng SC et al. 2014. mTOR- and HIF-1α-mediated aerobic glycolysis as metabolic basis for trained immunity</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7186935/">Netea MG et al. 2020. Defining trained immunity and its role in health and disease</a></li></ul><p>Определение памяти и схема опыта — рабочие формулировки курса. Протоколы с β-глюканом на моноцитах человека описаны в работах Saeed и соавт. (2014) и Cheng и соавт. (2014), определение тренированного врождённого иммунитета — в обзоре Netea и соавт. (2020); все три источника прочитаны на уровне реферата. Схема на экране — учебный пример, а не воспроизведение одного эксперимента; сроки условные.</p></details></article><article class="card print-unit" id="ns-prc2"><div class="eyebrow">Хроматиновая память · шаг 22 из 28</div><h2>Как PRC2 восстанавливает H3K27me3</h2><p class="lead">H3K27me3 — триметилирование лизина 27 гистона H3: метку ставит каталитическая субъединица комплекса PRC2, а субъединица EED её распознаёт. Связывание EED с меткой повышает активность комплекса, и эта положительная обратная связь помогает восстанавливать метку после репликации.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает три нуклеосомы: старую с меткой H3K27me3, соседнюю и новую после репликации. EED узнаёт метку, EZH2 переносит метильные группы на H3, а связывание EED с меткой повышает активность EZH2. Если EED не узнаёт метку или исходной метки нет, аллостерического усиления не происходит; при потере каталитической активности EZH2 новая метка не образуется. Метка находится на гистоне H3, а не на ДНК.</div><ol class="mech"><li>В <a href="#ns-g-S6-T56">PRC2</a> входят EZH2 (в некоторых клетках её заменяет EZH1), EED и SUZ12; метильные группы переносит домен SET в EZH2.</li><li>EED связывается с триметилированным лизином на гистоновых хвостах, и это аллостерически активирует метилтрансферазу.</li><li>Новая метка появляется на гистоне H3 соседней или новой нуклеосомы, а не на ДНК.</li></ol><p>Комплекс PRC2 содержит каталитическую субъединицу EZH2 (в некоторых клетках её заменяет EZH1), а также EED и SUZ12. Метильные группы на лизин 27 гистона H3 переносит домен SET в составе EZH2, поэтому <a href="#ns-g-S6-T57">H3K27me3</a> — модификация белка гистона, а не ДНК. Метилирование цитозина выполняют другие ферменты — DNMT.</p><p>Субъединица EED связывается с триметилированными лизинами на гистоновых хвостах. В опытах in vitro это связывание аллостерически активировало метилтрансферазу PRC2, а мутации EED, нарушающие распознавание метки, устраняли эту активацию (Margueron и соавт., 2009). Получается положительная обратная связь: рядом с уже существующей меткой комплекс метилирует H3K27 быстрее. Авторы рассматривают её как основу восстановления метки на гистонах после репликации, то есть поддержания домена.</p><p>Обратная связь поддерживает домен, но не создаёт его: на первоначальную адресацию PRC2 к новому участку могут влиять другие факторы. Присутствие комплекса на хроматине и его активность — разные величины: мутантные варианты EZH2 и EED почти не проявляли активности в клетках, хотя связывались с хроматином сходно с нормой (Lee и соавт., 2018). В клетках без EZH2 метка не воспроизводится и с каждой репликацией убывает (Jadhav и соавт., 2020); как быстро, разбирает следующий шаг.</p><div class="note trap"><strong>Типичная ошибка</strong> EED — это метилтрансфераза, которая сама ставит H3K27me3.<p class="trap-fix">Метильные группы переносит EZH2 (или EZH1) в составе PRC2. EED распознаёт метку и повышает активность комплекса; без активной каталитической субъединицы метка не образуется. H3K27me3 — модификация гистона H3, и к метилированию цитозина она отношения не имеет.</p></div><div class="static-quiz"><h3>EED связывается с H3K27me3. Как это взаимодействие участвует в поддержании домена?</h3><ol><li><b>А.</b> EED аллостерически активирует PRC2 и способствует восстановлению H3K27me3. <i>(верный вариант)</i><br><span class="expl">Это положительная обратная связь: когда EED распознаёт продукт реакции (H3K27me3), комплекс PRC2 образует этот продукт быстрее.</span></li><li><b>Б.</b> EED переносит метильную группу на цитозин в новой цепи ДНК после репликации. <i>(неверный вариант)</i><br><span class="expl">Поддерживающее метилирование ДНК выполняют другие ферменты — DNMT; EED к ним не относится.</span></li><li><b>В.</b> EED удаляет метку H3K27me3 с гистона и затем превращает эту метку в H3K27ac. <i>(неверный вариант)</i><br><span class="expl">Субъединица EED узнаёт метку, но не удаляет её и не превращает в H3K27ac.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3772642/">Margueron R et al. 2009. Role of the polycomb protein EED in the propagation of repressive histone marks</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5935545/">Lee CH et al. 2018. Allosteric Activation Dictates PRC2 Activity Independent of Its Recruitment to Chromatin</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7376365/">Jadhav U et al. 2020. Replicational Dilution of H3K27me3 in Mammalian Cells and the Role of Poised Promoters</a></li></ul><p>Аллостерическая активация PRC2 меткой показана в опытах in vitro; нарушающие её мутации EED у дрозофилы снижали общий уровень метилирования (в реферате субстрат не указан; PRC2 метилирует гистоны, а не ДНК) и нарушали развитие (Margueron и соавт., 2009). Расхождение между активностью и присутствием на хроматине описано для мутантных вариантов EZH2 и EED в клетках (Lee и соавт., 2018). Убыль метки при отсутствии EZH2 — по Jadhav и соавт. (2020). Все три источника прочитаны на уровне реферата. Роль EZH1 и адресация PRC2 к новым участкам — общие сведения, в источниках шага не проверялись. Схема качественная, числа не показаны.</p></details></article><article class="card print-unit" id="ns-memory-division"><div class="eyebrow">Хроматиновая память · шаг 23 из 28</div><h2>Как деление и удаление меток меняют устойчивость состояния</h2><p class="lead">При репликации старые гистоны с меткой распределяются между двумя дочерними молекулами ДНК, а недостающие места занимают новые гистоны без метки, поэтому доля метки убывает и без химического удаления. Средняя доля метки и доля клеток, сохранивших домен, — разные показатели; порог сохранения домена в учебной модели задан условно.</p><div class="note"><strong>Что показывает схема.</strong> Модель показывает домен из десяти нуклеосом. При репликации каждая метка с вероятностью одна вторая остаётся в данной дочерней клетке, а недостающие места занимают новые гистоны без метки; затем метка может восстанавливаться и удаляться. Если метка не восстанавливается и не удаляется, средняя доля метки после каждого раунда репликации уменьшается примерно вдвое. Доля клеток, у которых домен сохранён, зависит от порога и падает иначе, чем среднее значение. В неделящихся клетках разведения нет.</div><ol class="mech"><li>До репликации метки находятся на старых гистонах домена.</li><li>После репликации старые гистоны распределяются между дочерними молекулами ДНК, а новые добавляются без метки: в среднем метка разводится вдвое.</li><li>Восстановление метки ферментами, её удаление и замена гистонов меняют скорость убыли.</li></ol><p>Репликация удваивает суммарное число нуклеосом в двух дочерних молекулах ДНК домена. Старые гистоны с метками распределяются между двумя дочерними молекулами ДНК, а недостающие места занимают новые гистоны без метки. Если новые метки не образуются и метка химически не удаляется, то после одного раунда репликации доля H3K27me3 в домене в среднем уменьшается примерно вдвое, после двух раундов — примерно вчетверо. Для такой убыли не нужен фермент, удаляющий метку: её разводит рост числа нуклеосом.</p><p>В клетках кишечника мыши без EZH2 немодифицированные гистоны разводили H3K27me3 примерно вдвое при каждой репликации, но остаточная метка сохранялась, и гены оставались неактивными (Jadhav и соавт., 2020). В клетках лимфомы человека с мутантным EZH2 для утраты метки требовалось несколько делений, а промоторы с высоким содержанием H3K4me2/3 активировались, несмотря на остаточную H3K27me3. Поэтому порог, ниже которого ген активируется, у разных генов разный, и в учебной модели он задан условно.</p><p>Среднее значение скрывает различия между клетками. В модели старые гистоны распределяются между дочерними молекулами независимо и случайно: одни клетки получают больше меток, другие меньше. Доля клеток, в которых домен ещё удерживает ген в неактивном состоянии, поэтому может падать раньше, чем среднее число меток опустится ниже порога. Положительная обратная связь через EED ускоряет восстановление метки комплексом PRC2 и тем самым замедляет её убыль, а деметилирование и замена гистонов убыль ускоряют.</p><p>В клетках, которые не делятся, разведения нет. В них содержание метки меняется из-за обмена гистонов, деметилирования и процессов, связанных с транскрипцией. Поэтому в делящихся и неделящихся клетках домен утрачивается разными путями, и сравнивать такие клетки нужно в одном протоколе.</p><div class="note trap"><strong>Типичная ошибка</strong> Если доля метки снизилась, значит, метку химически удалили.<p class="trap-fix">При репликации доля метки убывает и без удаления: старые гистоны распределяются между дочерними молекулами ДНК, а новые добавляются без метки. Деметилирование и замена гистонов — отдельные процессы; чтобы отличить их вклад от разведения, сравнивают делящиеся и неделящиеся клетки.</p></div><div class="static-quiz"><h3>В учебной модели образование новых меток H3K27me3 полностью прекращено, химическое удаление метки исключено, старые гистоны распределяются между дочерними молекулами в среднем поровну. Как изменится доля H3K27me3 после одного раунда репликации?</h3><ol><li><b>А.</b> В среднем уменьшится примерно вдвое из-за добавления новых гистонов. <i>(верный вариант)</i><br><span class="expl">При прекращении образования H3K27me3 репликация уменьшает долю модифицированных гистонов за счёт добавления новых гистонов без метки. Это среднее значение для идеальной задачи.</span></li><li><b>Б.</b> Станет равной нулю сразу после прекращения образования новых меток. <i>(неверный вариант)</i><br><span class="expl">Прекращение образования новых меток не означает, что уже существующие метки немедленно исчезают.</span></li><li><b>В.</b> Не изменится, потому что модифицированные гистоны не распределяются при репликации. <i>(неверный вариант)</i><br><span class="expl">Распределение старых гистонов и добавление новых заданы условием.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7376365/">Jadhav U et al. 2020. Replicational Dilution of H3K27me3 in Mammalian Cells and the Role of Poised Promoters</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3772642/">Margueron R et al. 2009. Role of the polycomb protein EED in the propagation of repressive histone marks</a></li></ul><p>Данные Jadhav и соавт. (2020) получены на клетках кишечника мыши без EZH2 и на клетках лимфомы человека с мутантным EZH2 (реферат; в нём остаточная метка оценена примерно в 40 %, способ нормировки не указан, и это значение здесь не используется). Положительная обратная связь PRC2 — Margueron и соавт. (2009, реферат). Приблизительно симметричное наследование родительских гистонов сестринскими хроматидами упомянуто во введении к работе Jadhav и соавт. (2020) как известное свойство; в расчёте модели оно не учтено. Формула, число нуклеосом (10), вероятности и порог на экране — допущения учебной модели, а не измерения; порог не относится к конкретному гену, обратная связь через EED в модель не включена.</p></details></article><article class="card print-unit" id="ns-memory-carriers"><div class="eyebrow">Хроматиновая память · шаг 24 из 28</div><h2>Как различить локальный носитель и устойчивую сеть факторов</h2><p class="lead">Состояние может сохраняться благодаря локальному носителю на самом аллеле или сети общих факторов, действующих в транс; эти объяснения проверяют разными опытами. Различие двух аллелей в одном ядре поддерживает возможность локального носителя, но не называет его химическую природу.</p><div class="note"><strong>Что показывает схема.</strong> Режим «Два аллеля в одном ядре»: оба аллеля находятся в одном ядре и получают одни и те же диффундирующие факторы. Если после удаления инициатора один аллель активен, а другой молчит, это поддерживает возможность локального носителя, но не называет его природу; изменение последовательности исключают секвенированием. Режим «Инактивация X (XIST)»: подъём Xist при участии SPEN, параллельное подавление генов с участием SPEN и Polycomb, привлечение SmcHD1 при дифференцировке, поддержание подавления, при котором часть генов избегает инактивации.</div><ol class="mech"><li>Фактор действует <a href="#ns-g-S6-T55">в цис</a>, если влияет на ту же молекулу ДНК или тот же аллель, и в транс, если диффундирует и действует на все доступные мишени.</li><li>Оба аллеля находятся в одном ядре и получают одни и те же диффундирующие факторы.</li><li>Если после удаления инициатора аллели остаются в разных состояниях, объяснение одними общими факторами теряет силу, а возможность локального носителя поддерживается.</li></ol><p>Регуляторное состояние может сохраняться двумя способами. Локальный носитель связан с самим аллелем: это метилирование цитозина, модификация гистонов или другой признак хроматина, воспроизводимый на этом участке; метилирование ДНК взаимодействует с другими слоями регуляции (Smith и соавт., 2025). Сеть транскрипционных факторов поддерживает состояние иначе: факторы взаимно усиливают синтез друг друга и действуют на все доступные мишени.</p><p>Различить объяснения помогает наблюдение за двумя аллелями одной клетки: оба находятся в одном ядре и получают одни и те же диффундирующие факторы. Если после удаления инициатора (исходного воздействия) один аллель остаётся активным, а другой нет, объяснение одними общими факторами становится менее вероятным, а возможность локального носителя поддерживается. Природу носителя такое наблюдение не устанавливает: для этого предполагаемую метку изменяют адресно, а изменение последовательности исключают секвенированием.</p><p>Инактивация X-хромосомы показывает, что состояние устанавливают и поддерживают разные механизмы. Некодирующая РНК <a href="#ns-g-S6-T63">XIST</a> (у мыши Xist) действует преимущественно в цис. В мышиных эмбриональных стволовых клетках для подъёма экспрессии Xist нужен SPEN, который привлекается рано и подавляет промотор Tsix (Robert Finestra и соавт., 2021). SPEN и Polycomb подавляют гены параллельно, а для подавления многих генов X-хромосомы нужно привлечение SmcHD1, зависящее от дифференцировки (Bowness и соавт., 2022). Часть генов избегает инактивации.</p><p>Вычислительные модели показывают, что устойчивую память могут давать обратные связи, например между модификациями гистонов и метилированием ДНК (Bruno и соавт., 2022). Это теоретический вывод, экспериментальной проверки он не заменяет.</p><div class="note trap"><strong>Типичная ошибка</strong> Если два аллеля в одном ядре ведут себя по-разному, значит, носителем состояния служит H3K27me3.<p class="trap-fix">Различие аллелей показывает, что у состояния есть локальная составляющая. Химическую природу носителя оно не называет: это может быть метилирование ДНК, другая модификация гистонов или их сочетание. Носитель определяют адресным вмешательством в предполагаемую метку.</p></div><div class="static-quiz"><h3>Два аллеля в одном ядре имеют разную историю воздействия и сохраняют разную транскрипцию после удаления инициатора. Что это наблюдение поддерживает?</h3><ol><li><b>А.</b> Возможность локального носителя состояния, природу которого нужно установить. <i>(верный вариант)</i><br><span class="expl">Оба аллеля получают одни и те же растворимые факторы, поэтому объяснение только транс-факторами становится менее вероятным; конкретную метку это наблюдение не устанавливает.</span></li><li><b>Б.</b> Доказательство того, что носителем состояния служит именно метка H3K27me3. <i>(неверный вариант)</i><br><span class="expl">Различие аллелей не называет химический носитель без адресного вмешательства.</span></li><li><b>В.</b> Доказательство изменения нуклеотидной последовательности обоих аллелей в ядре. <i>(неверный вариант)</i><br><span class="expl">Разная активность может сохраняться без мутации; последовательность проверяют отдельно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8985953/">Bruno S et al. 2022. Epigenetic cell memory: The gene&#x27;s inner chromatin modification circuit</a></li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9637994/">Bowness JS et al. 2022. Xist-mediated silencing requires additive functions of SPEN and Polycomb together with differentiation-dependent recruitment of SmcHD1</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8636516/">Robert-Finestra T et al. 2021. SPEN is required for Xist upregulation during initiation of X chromosome inactivation</a></li></ul><p>Данные по инактивации X приведены по рефератам: Robert Finestra и соавт. (2021) — мышиные эмбриональные стволовые клетки; в реферате Bowness и соавт. (2022) клеточная система не названа. Работа Bruno и соавт. (2022) — вычислительная модель, а не эксперимент. Обзор Smith и соавт. (2025; онлайн-публикация 2024) использован только для общего положения о взаимодействии метилирования ДНК с другими слоями регуляции. Существование генов, избегающих инактивации, — общие сведения, в источниках шага не проверялось. Схема на экране учебная, числовых значений нет.</p></details></article><article class="card print-unit" id="ns-repeat-response"><div class="eyebrow">Хроматиновая память · шаг 25 из 28</div><h2>Почему повторный ответ усиливается или ослабевает</h2><p class="lead">Усиление повторного ответа после β-глюкана и ослабление после LPS — разные результаты, и каждый относится к своему протоколу, клеткам и измеренным цитокинам. В культуре моноцитов клетки между стимулами не делятся, поэтому такой опыт не показывает наследование через митоз.</p><div class="note"><strong>Что показывает схема.</strong> Моноциты человека: после β-глюкана, отмывки и покоя ответ на LPS выше, чем у контроля, получившего только LPS; после первого LPS ответ на второй LPS ниже (толерантность); β-глюкан частично восстанавливает ответ у толерантных клеток. IBET151 предотвращал толерантность, если добавлялся вместе с первым LPS, и не отменял её после него. Ингибиторы Akt, mTOR и HIF-1α вместе с β-глюканом препятствовали формированию усиленного ответа. Макрофаги мыши: потеря Eed снижала TNF и IL-6 и после однократного LPS, поэтому опыт не показывает, что PRC2 специфически вызывает толерантность. Деление клеток в этих опытах не рассматривали; носитель следа не установлен.</div><ol class="mech"><li>В протоколе <a href="#ns-g-S6-T59">тренированного иммунитета</a> моноциты получают β-глюкан, а после отмывки и периода покоя — LPS; ответ сравнивают с клетками, получившими только LPS.</li><li>О <a href="#ns-g-S6-T60">толерантности</a> говорят, когда после первого LPS ответ на второй LPS ниже, чем у клеток, получивших LPS впервые.</li><li>Вмешательство во время первого стимула и вмешательство после него — разные опыты; они отвечают на разные вопросы.</li></ol><p>Моноциты человека в культуре получают β-глюкан, затем среду меняют, и клетки выдерживают в покое. После второго стимула — LPS — их цитокиновый ответ выше, чем у контроля, получившего только LPS (Cheng и соавт., 2014; Novakovic и соавт., 2016). Если первым воздействием был LPS, результат обратный: продукция TNF и IL-6 при втором LPS ниже, то есть развивается толерантность. Знак изменения зависит от первого стимула, а толерантность затрагивает не все гены (Foster и соавт., 2007, макрофаги мыши).</p><p>Цитокиновый ответ, состояние хроматина и обмен веществ измеряют по отдельности. После β-глюкана меняются эпигенетические признаки на энхансерах и промоторах (Saeed и соавт., 2014), а аэробный гликолиз усиливается при участии сигнального пути дектин-1 — Akt — mTOR — HIF-1α; ингибиторы Akt, mTOR или HIF-1α, добавленные вместе с β-глюканом, препятствовали формированию усиленного ответа (Cheng и соавт., 2014). Ингибитор BET-белков IBET151 предотвращал толерантность, если его добавляли вместе с первым LPS, и не отменял её, если добавляли после него (Novakovic и соавт., 2016).</p><p>Одно и то же вмешательство может менять и повторный ответ, и обычный ответ на однократный стимул. В макрофагах костного мозга мыши потеря Eed снижала TNF и IL-6 и после однократного LPS, поэтому опыт не показывает, что PRC2 специфически вызывает толерантность (Boonmee и соавт., 2024). Различие ответов говорит о следе первого воздействия, но не называет H3K27me3 носителем и не показывает передачу потомкам: в культуре моноцитов деления нет.</p><div class="note trap"><strong>Типичная ошибка</strong> Усиление ответа после β-глюкана доказывает, что метка передалась дочерним клеткам.<p class="trap-fix">В этом протоколе клетки не делились, поэтому передачу через митоз он проверить не мог. Он показывает, что функциональный ответ изменился и что изменились признаки хроматина и обмена веществ; носитель и режим наследования устанавливают отдельными тестами.</p></div><div class="static-quiz"><h3>Моноциты человека получили β-глюкан; затем клетки отмыли и выдержали в покое. При стимуляции LPS их цитокиновый ответ выше, чем у контроля, получившего только LPS. Деления в этом опыте не было. Какой вывод допустим?</h3><ol><li><b>А.</b> В этом протоколе первое воздействие связано с усилением ответа; наследование через митоз не проверено. <i>(верный вариант)</i><br><span class="expl">Функциональное различие ответов показано, но для установления носителя следа и режима наследования нужны отдельные тесты.</span></li><li><b>Б.</b> Доказано, что метка H3K27me3 передалась дочерним клеткам и определяет усиление ответа в этом опыте. <i>(неверный вариант)</i><br><span class="expl">Деления в условии нет, а значит, нет и дочерних клеток; условие не сообщает ни об измерении H3K27me3, ни о том, что эта метка служит носителем.</span></li><li><b>В.</b> Усиление ответа доказывает, что любой повторный стимул будет сильнее активировать все гены этих клеток. <i>(неверный вариант)</i><br><span class="expl">Результат относится к заданному протоколу, клеткам и измеренным цитокинам. Другие стимулы и гены могут давать иной ответ.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4242194/">Saeed S et al. 2014. Epigenetic programming of monocyte-to-macrophage differentiation and trained innate immunity</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4226238/">Cheng SC et al. 2014. mTOR- and HIF-1α-mediated aerobic glycolysis as metabolic basis for trained immunity</a></li><li><a href="https://doi.org/10.1038/nature05836">Foster SL. et al. Gene-specific control of inflammation by TLR-induced chromatin modifications. Nature. 2007;447:972–8. doi:10.1038/nature05836</a></li><li><a href="https://doi.org/10.1016/j.cell.2016.09.034">Novakovic B. et al. β-Glucan Reverses the Epigenetic State of LPS-Induced Immunological Tolerance. Cell. 2016;167:1354–1368.e14. doi:10.1016/j.cell.2016.09.034</a></li><li><a href="https://doi.org/10.1186/s13072-024-00562-6">Boonmee A. et al. A polycomb group protein EED epigenetically regulates responses in lipopolysaccharide tolerized macrophages. Epigenetics Chromatin. 2024;17:36. doi:10.1186/s13072-024-00562-6</a></li></ul><p>Протокол: моноциты человека, 24 ч с β-глюканом или LPS, отмывка, около пяти суток покоя, повторный LPS; TNF и IL-6 измеряли иммуноферментным анализом; деления клеток в модели нет; эпигеномные данные получены у небольшого числа доноров и носят ассоциативный характер (Novakovic и соавт., 2016, полный текст). Cheng и соавт. (2014) и Saeed и соавт. (2014) — моноциты человека, по рефератам. Foster и соавт. (2007) — макрофаги мыши in vitro, по реферату. Boonmee и соавт. (2024) — макрофаги костного мозга мыши, потеря Eed и ингибитор EED226, полный текст. Направления «выше» и «ниже» взяты из работ; числовых значений нет.</p></details></article><article class="card print-unit" id="ns-neuronal-memory"><div class="eyebrow">Хроматиновая память · шаг 26 из 28</div><h2>Как регуляция хроматина связана с памятью в нервной системе</h2><p class="lead">Изменения хроматина связывают с долговременной памятью, но молекулярный ответ нейронов и поведение животного — разные уровни, а результаты на мышах и крысах не объединяют. Ни для одной отдельной метки не показано, что она служит «записью» воспоминания, а польза ингибиторов HDAC для памяти человека опытами на мышах не доказана.</p><div class="note"><strong>Что показывает схема.</strong> Мышь. Сниженная ацетилтрансферазная активность CBP ухудшала долговременную память при сохранной кратковременной (Korzus и соавт., 2004). Избыток HDAC2 снижал ацетилирование H4K12 и H4K5, плотность шипиков и длительную потенциацию, а также ухудшал память; ингибитор SAHA улучшал память, но не у мышей без HDAC2 (Guan и соавт., 2009). У старых мышей восстановление ацетилирования H4K12 возвращало экспрессию генов и когнитивные показатели (Peleg и соавт., 2010). Крыса. После контекстного обусловливания страха в гиппокампе возрастала экспрессия DNMT; ген PP1 метилировался, и его транскрипция подавлялась, а ген reelin деметилировался и активировался (Miller и Sweatt, 2007). У транскриптов Bdnf с начальными экзонами I, IV, VI и IX экспрессия менялась по-разному вместе с метилированием ДНК и структурой хроматина; блокада NMDA-рецепторов предотвращала эти изменения и формирование памяти (Lubin и соавт., 2008). Данные двух видов на схеме не объединены; нейроны не делятся, наследование через митоз не обсуждается.</div><ol class="mech"><li>У мышей снижение ацетилтрансферазной активности CBP нарушало <a href="#ns-g-S6-T64">консолидацию</a> долговременной памяти, а избыток HDAC2 в нейронах снижал ацетилирование гистонов и ухудшал память.</li><li>У взрослых крыс после контекстного обусловливания страха в гиппокампе менялись экспрессия DNMT и метилирование ДНК отдельных генов, в том числе Bdnf.</li><li>Нейроны взрослого мозга не делятся, поэтому митотическое наследование здесь не обсуждается: речь идёт о динамике состояния, а не о его передаче дочерним клеткам.</li></ol><h3>Ацетилирование гистонов и память у мышей</h3><p>У мышей с трансгеном, снижающим ацетилтрансферазную активность CBP, приобретение и кратковременная память сохранялись, а консолидация долговременной памяти нарушалась; нарушение снималось отключением трансгена или введением трихостатина A, ингибитора HDAC, у взрослых животных (Korzus и соавт., 2004). Избыток HDAC2 в нейронах снижал ацетилирование гистона H4 по лизинам K12 и K5, плотность дендритных шипиков и длительную потенциацию (стойкое усиление синаптической передачи), а также ухудшал память; удаление HDAC2 вызывало обратные изменения. Ингибитор HDAC SAHA улучшал память у мышей дикого типа и с избытком HDAC2, но не у мышей без HDAC2 (Guan и соавт., 2009).</p><p>У старых мышей при обучении нарушено ацетилирование H4K12; его восстановление возвращало экспрессию генов и когнитивные показатели (Peleg и соавт., 2010). Все эти данные получены на мышах и о пользе ингибиторов HDAC для памяти человека ничего не говорят. Опыты показывают, что функция CBP и HDAC2 влияет на результат поведенческого теста, но не показывают, что каждая ацетильная группа гистона хранит отдельное воспоминание.</p><h3>Метилирование ДНК в нейронах взрослых крыс</h3><p>Контекстное обусловливание страха — модель, в которой животное связывает обстановку с неприятным стимулом; память проверяют по поведению при возвращении в ту же обстановку. После такого обучения в гиппокампе взрослых крыс повышалась экспрессия ДНК-метилтрансфераз, а ингибирование DNMT нарушало формирование памяти. Метилирование разных генов менялось в разных направлениях: ген PP1 метилировался, и его транскрипция подавлялась, а ген reelin деметилировался и активировался (Miller и Sweatt, 2007). В обучении, значит, участвуют и метилтрансферазы, и деметилирование. Работы на крысах и на мышах выполнены в разных системах, поэтому их результаты не складывают в одну схему.</p><p>Для Bdnf в гиппокампе показано, что транскрипты с начальными экзонами I, IV, VI и IX регулируются по-разному, и это сопровождается изменениями метилирования ДНК и структуры хроматина. Ингибитор DNMT зебуларин менял и метилирование, и экзон-специфичную экспрессию, а блокада NMDA-рецепторов предотвращала изменения метилирования и экспрессии и формирование памяти (Lubin и соавт., 2008). Разные начальные экзоны соответствуют разным промоторам одного гена, поэтому речь идёт о регуляции промоторов, а не об изменении сплайсинга.</p><p>Нейроны взрослого мозга не делятся, поэтому поддерживающее метилирование, которое DNMT1 выполняет при репликации, такую динамику не объясняет: данные Miller и Sweatt указывают на активность и метилтрансфераз, и деметилирования. Молекулярный ответ нейронов — изменение экспрессии, метилирования, ацетилирования — не тождествен памяти животного: память оценивают поведенческим тестом, а связь между ними устанавливают вмешательством.</p><div class="note trap"><strong>Типичная ошибка</strong> Опыты на мышах показали, что каждая ацетильная группа гистона хранит отдельное воспоминание, а ингибиторы HDAC улучшают память человека.<p class="trap-fix">Опыты показывают влияние функции CBP, HDAC2 или ингибитора на результат поведенческого теста у мышей. Соответствие отдельных химических групп содержанию воспоминаний они не устанавливают, а перенос на человека требует отдельных исследований.</p></div><div class="static-quiz"><h3>В опыте на взрослых мышах нарушена ацетилтрансферазная активность CBP, и долговременная память ухудшилась. Какой вывод не выходит за рамки этого опыта?</h3><ol><li><b>А.</b> Каталитическая функция CBP нужна для консолидации памяти в этой модели мышей. <i>(верный вариант)</i><br><span class="expl">Вмешательство связывает исследованную функцию CBP с результатом поведенческого теста в заданной системе.</span></li><li><b>Б.</b> Каждая ацетильная группа гистона в нейроне хранит отдельное воспоминание. <i>(неверный вариант)</i><br><span class="expl">Опыт не устанавливает соответствие отдельных химических групп содержанию воспоминаний.</span></li><li><b>В.</b> Показана эффективность любого ингибитора HDAC для улучшения памяти у человека. <i>(неверный вариант)</i><br><span class="expl">Данные на мышах не являются доказательством клинической эффективности у человека.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-6.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8048715/">Korzus E et al. 2004. CBP histone acetyltransferase activity is a critical component of memory consolidation</a></li><li><a href="https://www.nature.com/articles/nature07925">Guan JS et al. 2009. HDAC2 negatively regulates memory formation and synaptic plasticity</a></li><li><a href="https://www.sciencedirect.com/science/article/pii/S0896627307001420">Miller CA, Sweatt JD 2007. Covalent modification of DNA regulates memory formation</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3312036/">Lubin FD, Roth TL, Sweatt JD 2008. Epigenetic regulation of bdnf gene transcription in the consolidation of fear memory</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/20448184/">Peleg S et al. 2010. Altered histone acetylation is associated with age-dependent memory impairment in mice</a></li></ul><p>Все данные получены на животных. Работа Guan и соавт. (2009) прочитана полностью (мыши; на схеме только направления изменений, а частоты замирания и дозы SAHA не приводятся). Korzus и соавт. (2004), Peleg и соавт. (2010), Miller и Sweatt (2007), Lubin и соавт. (2008) прочитаны на уровне реферата: у Korzus и Peleg — мыши, у Miller и Sweatt — взрослые крысы, у Lubin — гиппокамп при контекстном обусловливании страха (вид указан только в индексации PubMed). Направления изменения мРНК Bdnf в реферате Lubin не приведены; строение гена на схеме условное. Данные разных видов и работ на схемах не объединены.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 27 из 28</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Каждый метод измеряет свою величину: химическую форму основания, состояние обеих цепей CpG-диады, доступность хроматина, присутствие белка, контакт участков, положение белка в клетке, новосинтезированную РНК или функциональный ответ. От названия метода нельзя перейти к причинному выводу: между ними стоят альтернативное объяснение и контроль, а корреляция, необходимость и достаточность требуют разных дизайнов опыта, то есть разных схем эксперимента.</p><div class="note"><strong>Что показывает схема.</strong> Бисульфитное секвенирование (BS-seq). Что измеряет: долю цитозинов, не превратившихся в урацил: 5mC и 5hmC читаются одинаково, как цитозин. Не отделяет 5mC от 5hmC и не показывает, на какой цепи диады находится метка. Альтернативное объяснение: часть сигнала может приходиться на 5hmC, а не на 5mC; неполное превращение цитозина в урацил завышает долю метилирования. Контроль или дополнение: oxBS-seq или TAB-seq на тех же образцах и внутренний контроль полноты превращения. oxBS-seq и TAB-seq. Что измеряет: 5mC (oxBS-seq) и 5hmC (TAB-seq) по отдельности; при oxBS-seq 5hmC определяют по разности с обычным бисульфитным секвенированием. Не показывает, на какой цепи диады находится метка и каким путём она изменилась: пассивной потерей, активным удалением или метилированием de novo. Альтернативное объяснение: один и тот же итоговый уровень метки могут дать разные процессы, а разность двух независимых запусков включает ошибку каждого из них. Контроль или дополнение: повторные запуски, внутренние контроли превращения и измерение во времени с учётом деления клеток. Метод шпильки (hairpin-бисульфитное секвенирование). Что измеряет: состояние обеих цепей одной молекулы ДНК: доли диад MM, MU и UU. Не показывает, почему появились полуметилированные диады, и в обычном варианте не отделяет 5hmC от 5mC. Альтернативное объяснение: диады MU возникают после репликации, пока новая цепь не метилирована, и при удалении метки с одной цепи. Контроль или дополнение: сравнение делящихся и неделящихся клеток, разные сроки после репликации и дополнительный анализ oxBS-seq. ATAC-секвенирование. Что измеряет: доступность хроматина для транспозазы. Не показывает, какой белок связан с участком, активен ли энхансер и идёт ли транскрипция. Альтернативное объяснение: в смеси клеток сигнал может отражать долю клеток с открытым участком, а не доступность во всех клетках; доступный участок не обязательно занят активатором. Контроль или дополнение: одноклеточный анализ или разделение клеток по типам, ChIP-секвенирование или CUT&amp;Tag нужного белка и измерение новосинтезированной РНК. ChIP-секвенирование и CUT&amp;Tag. Что измеряет: присутствие белка или модификации гистона на участке ДНК. Не показывает, действует ли белок на участке и какой ген регулируется этим участком. Альтернативное объяснение: сигнал может быть обусловлен неспецифическим связыванием антитела; метка гистона на участке не равна активности энхансера. Контроль или дополнение: контрольный образец (контрольное антитело или клетки без белка), измерение РНК предполагаемой мишени и вмешательство в участок. Hi-C. Что измеряет: частоту контактов между участками ДНК в популяции клеток. Не показывает, что контакт активирует промотор, и не отделяет контакт от доступности и транскрипции. Альтернативное объяснение: частота контакта зависит от общей близости участков внутри домена и от технических особенностей метода (Yang и Hansen, 2024); в клетках популяции контакт есть не всегда. Контроль или дополнение: независимый метод, например визуализация, измерение новосинтезированной РНК и вмешательство в контакт или в границу домена. Микроскопия и фракционирование клеток (FOXO). Что измеряет: долю FOXO в ядре по сравнению с цитоплазмой. Не показывает связывание FOXO с ДНК и транскрипцию генов-мишеней. Альтернативное объяснение: FOXO в ядре может быть не связан с ДНК-мишенями; положение белка зависит и от ядерного импорта, и от экспорта. Контроль или дополнение: ChIP-секвенирование или CUT&amp;RUN, новосинтезированная РНК мишеней и маркеры чистоты ядерной и цитоплазматической фракций. Новосинтезированная РНК. Что измеряет: РНК, образованную за установленный интервал регистрации, то есть текущую транскрипцию. Не показывает, какой фактор или метка вызвали изменение, и не измеряет стабильность РНК. Альтернативное объяснение: результат зависит от побочного действия вмешательства, жизнеспособности и деления клеток, а общее содержание РНК — ещё и от её распада. Контроль или дополнение: несколько сроков, контрольные гены, измерение жизнеспособности и числа делений. Цитокины (иммуноферментный анализ). Что измеряет: концентрацию TNF или IL-6 в среде как показатель функционального ответа клеток. Не показывает состояние хроматина, число отвечающих клеток и носитель следа. Альтернативное объяснение: остаток первого реагента и смена состава клеток за время покоя могут изменить ответ. Контроль или дополнение: группа, получившая только второй стимул, отмывка, подсчёт клеток и оценка жизнеспособности. Дизайн «Корреляция». Что делают: измеряют метку и транскрипцию в одном и том же состоянии клеток, не вмешиваясь. Допустимый вывод: метка и транскрипция связаны в этих клетках и этих условиях. Дизайн не показывает, что метка вызывает изменение транскрипции: транскрипция могла изменить метку, а обе величины могли зависеть от третьего фактора. Что усиливает вывод: адресное изменение метки и измерение транскрипции после него. Дизайн «Необходимость». Что делают: метку убирают там, где она есть, и измеряют транскрипцию. Допустимый вывод: при удалении метки транскрипция локуса меняется: метка нужна для исходного уровня транскрипции в изученных клетках. Дизайн не показывает, что метка достаточна, и не исключает побочного действия вмешательства на соседние участки и общие ферменты. Что усиливает вывод: контроль побочных эффектов и второе независимое вмешательство, дающее тот же результат. Дизайн «Достаточность». Что делают: метку вносят там, где её нет, и измеряют транскрипцию. Допустимый вывод: появление метки меняет транскрипцию в этой системе: при прочих равных условиях метки достаточно для этого изменения. Дизайн не показывает, что в норме транскрипцию определяет именно эта метка: результат зависит от факторов, имеющихся в клетках. Что усиливает вывод: контрольное вмешательство с каталитически неактивным ферментом, измерение самой метки и несколько сроков. Дизайн «Причинная связь метки с транскрипцией». Что делают: адресно изменяют метку, измеряют новосинтезированную РНК в несколько последовательных сроков и контролируют побочные эффекты вмешательства. Допустимый вывод: изменение метки предшествует изменению транскрипции и вызывает его в изученной системе. Дизайн не показывает, что метка — единственная причина и что вывод верен для других клеток и других локусов. Что усиливает вывод: второе независимое вмешательство или восстановление функции: при возврате метки транскрипция возвращается к исходному уровню.</div><ol class="mech"><li>Для предполагаемого механизма определяют, какая величина должна измениться, если он верен, и выбирают метод, измеряющий именно её.</li><li>Для каждого результата называют альтернативное объяснение — состав клеток, остаток реагента, побочное действие вмешательства — и контроль, который это объяснение проверяет.</li><li>Причинную связь устанавливают вмешательством в предполагаемое звено и измерением следствия во времени; совпадение изменений двух величин показывает лишь корреляцию.</li></ol><p>Название метода не говорит о причине наблюдаемого явления, потому что каждый метод измеряет только свою величину. Обычное бисульфитное секвенирование читает 5mC и 5hmC одинаково, поэтому для их разделения применяют oxBS-seq (Booth и соавт., 2013). Метод шпильки показывает состояние обеих цепей CpG-диады, ATAC-секвенирование — доступность хроматина, ChIP-секвенирование и CUT&amp;Tag — присутствие белка или метки, Hi-C — контакты, микроскопия — положение FOXO, анализ новосинтезированной РНК — текущую транскрипцию, измерение цитокинов — функциональный ответ. Регуляторные элементы описывают по независимым эпигеномным признакам (Preissl и соавт., 2023).</p><p>Для каждого результата называют альтернативное объяснение и контроль. Доступный участок не обязательно занят активатором, метка гистона не равна активности энхансера, контакт не равен транскрипции, а различие между образцами клеток может отражать смену состава популяции. На трактовку данных Hi-C влияют технические особенности метода (Yang и Hansen, 2024). В работе Bergman и соавт. (2022) репортёрный анализ ExP STARR-seq измерял выход РНК для пар «энхансер × промотор» в клетках K562; такой анализ не описывает хроматин собственного локуса.</p><p>Тип вывода определяет дизайн опыта. Корреляция не показывает направления связи; <a href="#ns-g-S6-T65">необходимость и достаточность</a> устанавливают соответственно по исчезновению результата в отсутствие фактора и по появлению результата при введении фактора. Чтобы проверить, вызывает ли изменение метки изменение транскрипции, метку изменяют адресно, измеряют новосинтезированную РНК в несколько последовательных сроков и контролируют побочные эффекты вмешательства; второе независимое вмешательство усиливает вывод. Чтобы судить об изменении повторного ответа, нужен контроль того же возраста, получивший только второй стимул (Saeed и соавт., 2014).</p><div class="note trap"><strong>Типичная ошибка</strong> Если метод дал высокий сигнал на участке, значит, измерена причина транскрипции этого гена.<p class="trap-fi
