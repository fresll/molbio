ый к Ca²⁺, с очень малой проводимостью и входящим выпрямлением."},{"id":"S3-T67","term":"входящее выпрямление","section":3,"def":"Свойство тока CRAC: при отрицательном мембранном потенциале ток велик (входящий), при деполяризации почти исчезает."},{"id":"S3-T68","term":"SERCA","section":3,"def":"Ca²⁺-АТФаза мембраны ЭПР; закачивает Ca²⁺ в депо против градиента за счёт ATP. Необратимо подавляется тапсигаргином."},{"id":"S3-T69","term":"тапсигаргин","section":3,"def":"Необратимый избирательный ингибитор SERCA; вызывает опустошение депо за счёт утечки Ca²⁺ без участия рецептора и без образования IP₃."},{"id":"S3-T70","term":"IP₃","section":3,"def":"Инозитол-1,4,5-трисфосфат — растворимый посредник, образуемый фосфолипазой C из PIP₂; открывает IP₃-рецептор ЭПР, и Ca²⁺ выходит из депо."},{"id":"S3-T71","term":"IP₃-рецептор","section":3,"def":"Канал мембраны ЭПР, через который Ca²⁺ выходит из депо; открывается при совместном связывании IP₃ и Ca²⁺ на цитозольной стороне."},{"id":"S3-T72","term":"фосфолипаза Cβ","section":3,"def":"Фермент, активируемый рецепторами через белок Gq; расщепляет мембранный липид PIP₂ с образованием IP₃ и DAG."},{"id":"S3-T73","term":"PIP₂","section":3,"def":"Фосфатидилинозитол-4,5-бисфосфат — мембранный липид, субстрат фосфолипазы C; из него образуются IP₃ и DAG."},{"id":"S3-T74","term":"DAG","section":3,"def":"Диацилглицерол — гидрофобный продукт гидролиза PIP₂; остаётся в плазматической мембране и участвует в активации протеинкиназы C."},{"id":"S3-T75","term":"кальмодулин","section":3,"def":"Небольшой Ca²⁺-связывающий белок; связав Ca²⁺, активирует набор мишеней, среди которых фосфатаза кальцинейрин."},{"id":"S3-T76","term":"кальцинейрин","section":3,"def":"Серин-треониновая фосфатаза, активная только в комплексе с Ca²⁺–кальмодулином; дефосфорилирует NFAT. Подавляется комплексом циклоспорина A с циклофилином."},{"id":"S3-T77","term":"NFAT","section":3,"def":"Транскрипционный фактор; в покое фосфорилирован и удерживается в цитоплазме, после дефосфорилирования кальцинейрином переходит в ядро. Для активации генов (в T-лимфоците — IL2) там нужны и другие факторы, прежде всего AP-1: один NFAT в ядре для ответа недостаточен."},{"id":"S3-T78","term":"циклоспорин A","section":3,"def":"Иммунодепрессант; связывается с циклофилином, и комплекс подавляет кальцинейрин. Вход Ca²⁺ при этом не меняется, но NFAT остаётся в цитоплазме."},{"id":"S3-T79","term":"Fura-2","section":3,"def":"Флуоресцентный индикатор Ca²⁺; возбуждают на 340 и 380 нм, отношение сигналов после калибровки пересчитывают в концентрацию Ca²⁺. Сам связывает Ca²⁺ и служит его буфером."},{"id":"S3-T80","term":"RASGRP1","section":4,"def":"Фактор обмена гуаниновых нуклеотидов для RAS с DAG-связывающим доменом C1; в T-клетках передаёт сигнал от рецептора антигена через DAG на RAS (Dower 2000)."},{"id":"S3-T81","term":"AP-1","section":4,"def":"Транскрипционный фактор из белков семейств Fos и Jun; путь RAS → ERK усиливает их синтез и фосфорилирование."},{"id":"S3-T82","term":"Составной элемент промотора","section":4,"def":"Участок ДНК с соседними местами связывания NFAT и AP-1; два фактора образуют на нём устойчивый тройной комплекс, и транскрипция гена активируется при совпадении двух сигналов."},{"id":"S3-T83","term":"Интерлейкин-2 (IL-2)","section":4,"def":"Цитокин, синтез которого индуцируется при активации T-лимфоцита; транскрипция гена IL2 требует NFAT и AP-1."},{"id":"S3-T90","term":"EGFR","section":2,"def":"Рецептор эпидермального фактора роста — рецепторная тирозинкиназа плазматической мембраны. Связав лиганд (например, EGF), рецептор образует димер и фосфорилирует остатки тирозина в собственном цитоплазматическом участке; фосфотирозины узнаются белками с доменами SH2, в том числе адаптером GRB2. В семинаре 4 EGFR служит началом пути RAS → ERK."},{"id":"S3-T91","term":"мотив CAAX и липидный якорь RAS","section":2,"def":"Концевая последовательность RAS: цистеин, две алифатические аминокислоты и любая концевая аминокислота (CAAX). Цистеин фарнезилируется, три концевые аминокислоты отщепляются, карбоксильная группа метилируется; получившийся липидный остаток встраивается во внутренний слой плазматической мембраны. Для прочного закрепления нужен второй сигнал: пальмитоилирование соседних цистеинов у HRAS и NRAS либо участок положительно заряженных остатков лизина у KRAS (изоформа 4B)."},{"id":"S3-T92","term":"кальциевый микродомен","section":3,"def":"Небольшая область цитоплазмы у устья открытого канала (порядка десятков нанометров), в которой концентрация Ca²⁺ на время открытия значительно выше, чем в остальной цитоплазме. Ca²⁺ быстро рассеивается и связывается внутриклеточными буферами, поэтому такой подъём локален. Он не исключает, что при открытии многих каналов растёт и средняя («глобальная») концентрация Ca²⁺ в клетке."},{"id":"S3-T93","term":"Резерв рецепторов","section":0,"def":"Ситуация, когда полный ответ клетки достигается при занятости лишь малой доли рецепторов, потому что после рецептора идут усиливающие ступени. Часть рецепторов можно выключить (необратимым антагонистом, интернализацией, снижением экспрессии): максимальный ответ при этом почти не изменится, а кривая «концентрация — ответ» сдвинется вправо. Когда резерв исчерпан, снижается и максимум. Резерв зависит от клетки и от ответа, который измеряют."}],"sources":{"Anthonsen1998":{"url":"https://doi.org/10.1074/jbc.273.1.215","cite":"Anthonsen M. W. et al. 1998. Identification of novel phosphorylation sites in hormone-sensitive lipase that are phosphorylated in response to isoproterenol. J Biol Chem","doi":"10.1074/jbc.273.1.215","pmid":"9417067"},"Aronheim1994":{"url":"https://doi.org/10.1016/0092-8674(94)90271-2","cite":"Aronheim A. et al. 1994. Membrane targeting of the nucleotide exchange factor Sos is sufficient for activating the Ras signaling pathway. Cell","doi":"10.1016/0092-8674(94)90271-2","pmid":"7923364"},"Berridge2016":{"url":"https://doi.org/10.1152/physrev.00006.2016","cite":"Berridge M. J. 2016. The inositol trisphosphate/calcium signaling pathway in health and disease. Physiol Rev","doi":"10.1152/physrev.00006.2016","pmid":"27512009"},"Bers2002":{"url":"https://doi.org/10.1038/415198a","cite":"Bers D. M. 2002. Cardiac excitation-contraction coupling. Nature","doi":"10.1038/415198a","pmid":"11805843"},"Billington2013":{"url":"https://doi.org/10.1016/j.pupt.2012.05.007","cite":"Billington C. K. et al. 2013. cAMP regulation of airway smooth muscle function. Pulm Pharmacol Ther","doi":"10.1016/j.pupt.2012.05.007","pmid":"22634112"},"BlackLeff1983":{"url":"https://doi.org/10.1098/rspb.1983.0093","cite":"Black J. W., Leff P. 1983. Operational models of pharmacological agonism. Proc R Soc Lond B Biol Sci","doi":"10.1098/rspb.1983.0093","pmid":"6141562"},"Boerner2011":{"url":"https://doi.org/10.1038/nprot.2010.198","cite":"Börner S. et al. 2011. FRET measurements of intracellular cAMP concentrations and cAMP analog permeability in intact cells. Nat Protoc","doi":"10.1038/nprot.2010.198","pmid":"21412271"},"Briston2014":{"url":"https://doi.org/10.1093/cvr/cvu201","cite":"Briston S. J. et al. 2014. Balanced changes in Ca buffering by SERCA and troponin contribute to Ca handling during β-adrenergic stimulation in cardiac myocytes. Cardiovasc Res","doi":"10.1093/cvr/cvu201","pmid":"25183792"},"Canon2019":{"url":"https://doi.org/10.1038/s41586-019-1694-1","cite":"Canon J. et al. 2019. The clinical KRAS(G12C) inhibitor AMG 510 drives anti-tumour immunity. Nature","doi":"10.1038/s41586-019-1694-1","pmid":"31666701"},"Cassel1977":{"url":"https://doi.org/10.1073/pnas.74.8.3307","cite":"Cassel D., Selinger Z. 1977. Mechanism of adenylate cyclase activation by cholera toxin: inhibition of GTP hydrolysis at the regulatory site. Proc Natl Acad Sci U S A","doi":"10.1073/pnas.74.8.3307","pmid":"198781"},"Cherfils2013":{"url":"https://doi.org/10.1152/physrev.00003.2012","cite":"Cherfils J., Zeghouf M. 2013. Regulation of small GTPases by GEFs, GAPs, and GDIs. Physiol Rev","doi":"10.1152/physrev.00003.2012","pmi const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;
const slider = (id, label, min, max, value, step = 1, unit = '') => `<label for="${id}">${esc(label)}<output id="${id}-value">${value}${unit}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${esc(unit)}"></label>`;
const select = (id, label, opts, value = 0) => `<label for="${id}">${esc(label)}<select id="${id}">${opts.map((x, i) => `<option value="${i}"${i === value ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
const check = (id, label, on) => `<label class="chk" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> <span>${esc(label)}</span></label>`;
const metric = (label, value) => `<div>${esc(label)}<strong>${esc(value)}</strong></div>`;
const result = s => `<div class="result">${s}</div>`;
const tbl = (head, rows, cls = '') => `<div class="table-scroll"><table class="${cls}"><thead><tr>${head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);
const lvlTag = (v) => `<span class="lvl lvl${v < 0 ? 'x' : v}">${esc(lvl(v))}</span>`;
function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');
  });
  return svg(d, U.chart_levels, h, w);
}
/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.h).join(' '), l.quiz.question, ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {
  const q = ($('search').value || '').trim().toLowerCase(), n = stepsDone(), N = CONTENT.lessons.length;
  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  let html = `<div class="progress">${esc(U.progress_label)}: <b>${n} ${esc(U.of)} ${N}</b><progress value="${n}" max="${N}" aria-label="${esc(U.progress_label)}"></progress>` +
    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {
    const ls = CONTENT.lessons.filter(l => l.section === i && (!q || hay(l).includes(q)));
    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${esc(s.title)}</div>` + ls.map(l => {
      const done = store.steps[l.id] && store.steps[l.id].correct;
      return `<button data-nav="${l.id}" class="${l.id === current ? 'active' : ''}"${l.id === current ? ' aria-current="page"' : ''}><span class="tick" aria-hidden="true">${done ? '✓' : '○'}</span><span class="sr">${esc(done ? U.done : U.notdone)}: </span>${esc(l.title)}</button>`;
    }).join('');
  });
  if (q && !any) html += `<p class="empty">${esc(U.no_match)}</p>`;
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
  const r = $('reset-progress'); if (r) r.onclick = () => { store = {v: 1, steps: {}, exam: {}}; save(); if (current === 'exam') renderExam(); else if (lessonById(current)) renderLesson(lessonById(current)); };
}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

/* ---------- элементы шага ---------- */
function sourcesHtml(l) {
  return `<details class="sources" id="src-${l.id}"><summary>${esc(U.src_summary)}</summary>` +
    `<ul class="src-list">${l.sources.map(k => { const s = CONTENT.sources[k]; return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)} ↗</a></li>`; }).join('')}</ul>` +
    `<p>${rt(l.conditions)}</p></details>`;
}
function quizHtml(l, scope = 'quiz') {
  const q = l.quiz, ord = optionOrder(l);
  const done = scope === 'quiz' && store.steps[l.id] && store.steps[l.id].correct;
  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +
    `<div class="answers" role="group" aria-labelledby="${scope}-${l.id}-q">${ord.map((id, i) => `<button data-answer="${id}"><b aria-hidden="true">${LETTERS[i]}</b><span>${rt(optById(l, id).text)}</span></button>`).join('')}</div>` +
    `<div class="quiz-feedback" aria-live="polite">${done ? `<p class="quiet">${esc(U.quiz_done_before)}</p>` : ''}</div></section>`;
}
function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);
    const r = rec[l.id] || (rec[l.id] = {attempts: 0, first: null, correct: false, rev: qrev(l)});
    if (last !== id) { r.attempts = (r.attempts || 0) + 1; if (r.first === null) r.first = ok; }
    last = id;
    if (ok) r.correct = true;
    save();
    const ret = boxEl.querySelector('[data-return]'); if (ret) ret.onclick = () => navigate(l.id);
  });
}
/* печатная копия вопроса и разбора всех вариантов */

function paragraphsHtml(l) { return l.paragraphs.map(p => (typeof p === 'string') ? `<p>${rt(p)}</p>` : `<h3>${esc(p.h)}</h3>`).join(''); }

function initWidget(l) {

/* общие функции моделей практикума (core.js, s0_common.js) */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
function rk4(f, s0, t0, t1, dt, every, out){
  let s = Object.assign({}, s0), t = t0; const res = out || []; let k = 0;
  const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
  res.push(Object.assign({ t }, s));
  while (t < t1 - 1e-9){
    const h = Math.min(dt, t1 - t);
    const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
    const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
    s = n; t += h; k++;
    if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
  }
  return res;
}
/* значение траектории в момент tt (линейная интерполяция) */
function atT(tr, tt){
  if (tt <= tr[0].t) return tr[0];
  for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
    const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
    for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
    return r;
  }
  return tr[tr.length - 1];
}

/* Модель вопроса 1 (β2-адренорецептор). Чистые функции без DOM: их же использует страница объяснений.
   Время — в минутах; cAMP — в долях базального уровня (×1 = базальный); доли (Gαs-GTP, рецепторы, PKA) — от 0 до 1.
   Все параметры учебные; времена и направления эффектов калиброваны по Violin 2008 (HEK293, ICUE2, 37 °C), Xin 2008 и Cassel 1977. */
const M1 = (() => {
  const P = {
    eps: 0.005,      // доля рецепторов в активной конформации без лиганда (базальная активность)
    kex0: 0.01,      // спонтанный обмен GDP→GTP на αs, в долях скорости гидролиза GTP
    kact: 3,         // активный рецептор: ускорение обмена, в долях скорости гидролиза (отсюда резерв рецепторов)
    ctxHyd: 0.04,    // холерный токсин: скорость гидролиза GTP — 4 % от исходной (снижение на 96 %, Cassel 1977)
    vb: 1, va: 40,   // синтез cAMP: базальный и зависящий от Gαs-GTP (условные единицы)
    vfsk: 80,        // форсколин (50 мкМ): прямая активация аденилатциклазы; ответ больше пика на изопротеренол (Violin 2008)
    kOther: 1, k4: 1,// гидролиз: PDE других семейств и PDE4 (по ~50 % базальной активности, Xin 2008)
    a4: 2,           // фосфорилирование PDE4 протеинкиназой A повышает активность PDE4 до 3 раз (Xin 2008)
    kscale: 4,       // масштаб времени синтеза и гидролиза cAMP, мин⁻¹
    Kpka: 4, nH: 2,  // PKA: полумаксимальная активность при cAMP ×4, коэффициент Хилла 2 (по два участка на R)
    kp4: 3, kdp4: 1, // фосфорилирование PDE4 протеинкиназой A и дефосфорилирование, мин⁻¹
    kgrk: 1,         // GRK (в HEK293 — прежде всего GRK6): фосфорилирование занятого агонистом рецептора, мин⁻¹
    kdp: 0.05,       // дефосфорилирование рецептора на поверхности, мин⁻¹
    karr: 3,         // связывание β-аррестина с фосфорилированным рецептором, мин⁻¹ (вместе с kgrk: полужизнь активного рецептора ≈70 с, Violin 2008)
    karrOff: 10,     // диссоциация β-аррестина после ухода агониста, мин⁻¹ (t½ ≈ 3 с после пропранолола, Violin 2008)
    kint: 0.08,      // интернализация комплекса рецептор–β-аррестин, мин⁻¹
    krec: 0.05,      // возврат рецептора из эндосомы на поверхность, мин⁻¹ (учебная оценка)
    phi: 1,          // фосфорилированный GRK рецептор без β-аррестина сохраняет сопряжение с Gs (инактивирует только β-аррестин; Violin 2008)
    kon: 30, koffProp: 30, // связывание изопротеренола и вытеснение его пропранололом — секунды (у Violin 2008 считаются мгновенными), мин⁻¹
    kdGrk: 0.4,      // siRNA к GRK6: активность GRK снижена на 60 % (так в модели Violin 2008)
    kdArr: 0.25,     // siRNA к β-аррестинам 1 и 2: в среднем 75 % подавления (Violin 2008)
    arrTot: 2,       // β-аррестина в 2 раза больше, чем рецепторов (так в модели Violin 2008); пул ограничен
  };
  const pkaOf = c => Math.pow(c, P.nH) / (Math.pow(P.Kpka, P.nH) + Math.pow(c, P.nH));
  /* доля αs в GTP-форме при доле активных рецепторов rs (квазистационарно: обмен и гидролиз быстрее остальных событий) */
  const gsOf = (rs, ctx) => { const ex = P.kex0 + P.kact * rs, hy = ctx ? P.ctxHyd : 1; return ex / (ex + hy); };
  const synth = (G, fsk) => P.vb + P.va * G + (fsk ? P.vfsk : 0);
  const hydr = (P4, rol) => P.kOther + P.k4 * (rol ? 0.01 : 1) * (1 + P.a4 * P4);
  const p4ss = p => P.kp4 * p / (P.kp4 * p + P.kdp4);
  /* стационарный уровень cAMP (в условных единицах) при скорости синтеза v, с обратной связью PKA → PDE4 */
  function cSSraw(v, rol, C0){
    let lo = 0, hi = 1e4;
    for (let i = 0; i < 90; i++){ const c = (lo + hi) / 2, P4 = p4ss(pkaOf(C0 ? c / C0 : c));
      if (v - hydr(P4, rol) * c > 0) lo = c; else hi = c; }
    return (lo + hi) / 2;
  }
  /* базальный уровень: им нормируем cAMP (×1). Самосогласованно: PKA зависит от cAMP в долях базального. */
  const G0 = gsOf(P.eps, false), V0 = synth(G0, false);
  let C0 = V0 / hydr(0, false);
  for (let i = 0; i < 60; i++) C0 = cSSraw(V0, false, C0);
  const cSS = (v, rol) => cSSraw(v, rol, C0) / C0;
  /* --- базовый уровень: стационарное состояние при заданной занятости рецепторов (без десенситизации) --- */
  const CELLS = { br: ['mlck', 'bk', 'ip3br'], cm: ['cav12', 'pln', 'trop'], ad: ['hsl', 'plin'] };
  const phosOf = pka => 5 * pka / (1 + 5 * pka);   // доля фосфорилированной мишени: PKA против фосфатаз
  const PH0 = phosOf(pkaOf(1)), PHMAX = phosOf(1);
  function basic(occ, cell){
    const rs = P.eps * (1 - occ) + occ;             // занятые полным агонистом рецепторы — в активной конформации
    const G = gsOf(rs, false), camp = cSS(synth(G, false), false), pka = pkaOf(camp), ph = phosOf(pka);
    const E = clampM((ph - PH0) / (PHMAX - PH0));    // доля максимального функционального эффекта (0 — исходное состояние)
    const out = cell === 'br' ? 100 - 70 * E : cell === 'cm' ? 1 + 1.5 * E : 1 + 39 * E;
    return { occ, G, camp, pka, ph, E, out, targets: CELLS[cell] };
  }
  function clampM(x){ return Math.max(0, Math.min(1, x)); }
  /* --- продвинутый уровень: клетки HEK293, время 0–30 мин --- */
  const IV = ['0', 'rol', 'grk', 'arr', 'prop', 'fsk', 'ctx'];
  function cfg(iv){
    return { rol: iv === 'rol', grk: iv === 'grk' ? P.kdGrk : 1, arrTot: P.arrTot * (iv === 'arr' ? P.kdArr : 1), prop: iv === 'prop',
             fsk: iv === 'fsk', ctx: iv === 'ctx', iso: iv !== 'fsk' && iv !== 'ctx' };
  }
  const activeR = (s) => s.Rs * (P.eps * (1 - s.occ) + s.occ) + s.Rp * P.phi * s.occ;
  function deriv(cf){
    return (s, t) => {
      const agon = cf.iso && t >= 1 && !(cf.prop && t >= 10) ? 1 : 0;
      const kocc = (cf.prop && t >= 10) ? P.koffProp : P.kon;
      const occ = s.occ, G = gsOf(activeR(s), cf.ctx), v = synth(G, cf.fsk && t >= 1);
      const pka = pkaOf(s.c);
      /* связывание β-аррестина: скорость пропорциональна свободному β-аррестину (интернализованные рецепторы пул не занимают) */
      const bind = P.karr * Math.max(0, cf.arrTot - s.Ra) / P.arrTot * s.Rp;
      return {
        occ: kocc * (agon - occ),
        Rs: -P.kgrk * cf.grk * occ * s.Rs + P.kdp * s.Rp + P.krec * s.Ri,
        Rp: P.kgrk * cf.grk * occ * s.Rs - P.kdp * s.Rp - bind + P.karrOff * (1 - occ) * s.Ra,
        Ra: bind - P.karrOff * (1 - occ) * s.Ra - P.kint * s.Ra,
        Ri: P.kint * s.Ra - P.krec * s.Ri,
        P4: P.kp4 * pka * (1 - s.P4) - P.kdp4 * s.P4,
        c: P.kscale * (v / C0 - hydr(s.P4, cf.rol) * s.c),
      };
    };
  }
  /* исходное стационарное состояние без агониста; ролипрам и холерный токсин — предобработка: их исходное состояние тоже стационарное */
  function init(cf){
    const c = cSS(synth(gsOf(P.eps, cf.ctx), false), cf.rol);
    return { occ: 0, Rs: 1, Rp: 0, Ra: 0, Ri: 0, P4: p4ss(pkaOf(c)), c };
  }
  const cache = {};
  function run(iv){
    if (cache[iv]) return cache[iv];
    const cf = cfg(iv);
    const tr = rk4(deriv(cf), init(cf), 0, 30, 0.002, 25);
    tr.forEach(p => { p.G = gsOf(activeR(p), cf.ctx); p.camp = p.c; p.pka = pkaOf(p.c);
      p.surf = p.Rs + p.Rp + p.Ra; p.arrb = p.Ra; p.pde4 = (1 + P.a4 * p.P4) * (cf.rol ? 0.01 : 1); });
    const b = tr[0].pde4 / (cf.rol ? 0.01 : 1);
    tr.forEach(p => { p.pde4rel = p.pde4 / b; });
    return (cache[iv] = tr);
  }
  /* сигнал FRET-сенсора: доля сенсора, связавшего cAMP (полунасыщение при cAMP ×8 — учебный параметр) */
  const KS = 8, sens = c => c / (c + KS);
  /* двухсостоянийная модель рецептора (учебные величины): доля R* без лиганда L0, с насыщающим лигандом эффективности alpha */
  const L0 = 0.01, rstar = alpha => alpha * L0 / (1 + alpha * L0);
  /* баланс cAMP для объяснений: синтез и гидролиз в долях исходных (без обратной связи PDE4, чтобы виден был сам баланс) */
  const balance = (vs, ks) => vs / ks;
  /* длина диффузии λ = √(D/k): D — мкм²/с, k — с⁻¹; ответ в мкм */
  const lambda = (D, k) => Math.sqrt(D / k);
  return { P, pkaOf, gsOf, basic, CELLS, run, IV, sens, KS, rstar, L0, balance, lambda };
})();


/* модель вопроса 2 (из src/s2.js) */

/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   Пара киназа — фосфатаза на одном участке (глава 3, §3.8): dp/dt = kк(1 − p) − kф·p; p* = kк/(kк + kф); τ = 1/(kк + kф).
   SERCA2a: скорость закачки ~ [Ca]^n / (K^n + [Ca]^n); нефосфорилированный PLN повышает кажущуюся K
   (учебные величины: K без PLN 0,25 мкМ, сдвиг +0,2 мкМ — порядок данных Mahaney 2000; n = 2). */
const M2 = (() => {
  const CA = 0.3, K0 = 0.25, DK = 0.2, NH = 2;
  const pStar = (kk, kf) => (kk + kf) > 0 ? kk / (kk + kf) : 0;
  const tau = (kk, kf) => 1 / (kk + kf);
  const pAt = (p0, kk, kf, t) => { const ps = pStar(kk, kf); return ps + (p0 - ps) * Math.exp(-t * (kk + kf)); };
  /* u — доля PLN в нефосфорилированной (тормозящей) форме; u = 0, если PLN нет */
  const Kapp = u => K0 + DK * u;
  const hill = (c, K) => Math.pow(c, NH) / (Math.pow(K, NH) + Math.pow(c, NH));
  const uptake = (u, c = CA) => hill(c, Kapp(u)) / hill(c, K0);
  /* модель во времени (вопрос 2п): кардиомиоцит мыши, учебные параметры.
     A — активность PKA (0…1, следует за сигналом β-рецептора с τA = 40 с); kк = (kb + (kmax − kb)·A)·(PKI ? 0,05 : 1);
     kф = 0,01 с⁻¹ (PP1; калиукулин A с 1-й мин снижает её в 10 раз); p — доля PLN, фосфорилированного по Ser16;
     q — суммарное фосфорилирование других мишеней PKA, та же пара ферментов: феноменологическая поправка к скорости спада Ca²⁺
     (это не откачка Ca²⁺ тропонином: тропонин I меняет связывание Ca²⁺ с миофиламентами, а сила и длина клетки не рассчитываются).
     Время полуспада свободного Ca²⁺ в цитозоле: t½ = ln2 / (rS·U + rO + rQ·q), U — скорость закачки SERCA2a (доля от скорости без PLN);
     это не время механического расслабления. Потоки по Ser16: vк = kк(1 − p), vф = kф·p (доли пула в секунду). */
  const P = { kb: 0.0015, kmax: 0.03, kf: 0.01, tauA: 40, tIso: 60, tProp: 480, calyF: 0.1, pkiF: 0.05, rS: 5.63, rO: 0.46, rQ: 1.61, T: 1200 };
  const thalf = (U, q) => 1000 * Math.LN2 / (P.rS * U + P.rO + P.rQ * q);
  function run(c){
    const pki = c.iv === 'pki' ? P.pkiF : 1;
    const kk = A => (P.kb + (P.kmax - P.kb) * A) * pki;
    const kf = t => (c.iv === 'caly' && t >= P.tIso) ? P.kf * P.calyF : P.kf;
    /* исход — стационар покоя данной чашки (PKI добавлен заранее, до 0 мин) */
    let A = 0, p = pStar(kk(0), P.kf), q = p; const out = [];
    for (let t = 0; t <= P.T; t++){
      const pp = c.geno === 'wt' ? p : 0, u = c.geno === 'ko' ? 0 : 1 - pp, U = uptake(u);
      out.push({ t: t / 60, A, kk: kk(A), kf: kf(t), p: c.geno === 'ko' ? null : pp, q, u, U, th: thalf(U, q) });
      const S = (c.iso && t >= P.tIso && !(c.iv === 'prop' && t >= P.tProp)) ? 1 : 0;
      const a1 = A + (S - A) * (1 - Math.exp(-1 / P.tauA));
      const k1 = kk((A + a1) / 2), f1 = kf(t);
      p = pAt(p, k1, f1, 1); q = pAt(q, k1, f1, 1); A = a1;
    }
    return out;
  }
  const at = (tr, m) => tr[Math.max(0, Math.min(tr.length - 1, Math.round(m * 60)))];
  /* стационар при насыщении ферментов (рамка §3.9): r(1 − p)/(K + 1 − p) = p/(K + p), r = vк,max/vф,max; решение делением отрезка */
  function gk(r, K){
    let lo = 0, hi = 1;
    for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2, f = r * (1 - m) / (K + 1 - m) - m / (K + m); if (f > 0) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  return { CA, K0, DK, NH, P, pStar, tau, pAt, Kapp, hill, uptake, thalf, run, at, gk };
})();

     dT/dt = (kGEF·f + kex)·φ·(1−T) − (kint + kGAP·g)·T → T* = A/(A+B), τ = 1/(A+B) */
  function stat(v, f) {
    const V = VAR[v], gap = kGAPcell * (V.gapScale || 1);
    const A = (kGEFmax * f + V.kex) * PHI;
    const B = V.kint + gap * V.g;
    return { T: A / (A + B), tau: 1 / (A + B), A, B, gap };
  }
  /* доля RAS-GTP без сигнала (GEF = 0) и прирост до текущего входа */
  function basal(v) { return stat(v, 0).T; }
  /* эффекторы конкурируют за одну поверхность switch I/II; учебные относительные сродства×доступность */
  const EFF = { raf: 0.55, pi3k: 0.30, ralgds: 0.15 };
  const ENG = 0.8;          // доля активного RAS, занятая эффекторами (учебная)
  function effectors(T) {
    const o = {}; for (const e in EFF) o[e] = T * ENG * EFF[e]; return o;
  }
  /* кривая T*(f) для графика (f = 0..1 → GEF 0..100 %) */
  function curve(v, N = 51) { const a = []; for (let i = 0; i < N; i++) { const f = i / (N - 1); a.push([f * 100, stat(v, f).T]); } return a; }

  /* --- 3a: захват GDP-формы KRAS G12C во времени ---
     D (GDP), T (GTP), B (связан с ингибитором, необратимо); D+T+B = 1 (доля всего KRAS G12C).
     dB/dt = kon·D; dT/dt = kex_eff·D − khyd·T; dD/dt = −kex_eff·D + khyd·T − kon·D.
     khyd — собственный гидролиз G12C (в значительной мере сохранён); у двойного мутанта G12C+Q61L khyd ≈ 0.
     kex_eff — обмен: собственный флор + вклад GEF (EGF повышает, ингибитор EGFR и BI-3406 понижают).
     Калибровка — Lito 2016 (ARS-853, клетки рака лёгкого KRAS G12C, H358): без сигнала захват за 1–2 ч;
     EGF замедляет на часы; ингибиторы EGFR и SOS ускоряют; двойной мутант без гидролиза устойчив.
     khyd для G12C здесь задан ОТДЕЛЬНО от kint в стационарной модели 3б и не выводится из неё: 3б — это
     относительные скорости очищенного белка в пробирке (Hunter 2015), а 3а описывает клеточную кинетику
     захвата, где на эффективную скорость перехода в GDP-форму влияют GEF, GAP, нуклеотиды и локализация;
     поэтому khyd подобран по времени захвата в клетках (Lito 2016), а не по константе гидролиза in vitro.
     v1.1 (аудит 16.10.2026, S13): ИСХОДНОЕ СОСТОЯНИЕ ОДНО для всех условий — стационар клеток без добавок
     (kex = GEFTONE.none). В момент t = 0 одновременно добавляют ингибитор G12C и, если выбрано, EGF /
     ингибитор EGFR / BI-3406: меняется только скорость обмена, доли пересчитываются из общего начала.
     mut = 'other' — клетки без KRAS G12C: ингибитору не с чем связываться, RBD-проба выявляет активную
     форму другой ГТФазы RAS (T = T_OTHER); вмешательства на неё в этой модели не действуют. */
  const KON = 0.04, KHYD = 0.035, KHYD_DEAD = 0.0005, T_OTHER = 0.95;
  const GEFTONE = { none: 0.020, egf: 0.25, egfri: 0.004, bi3406: 0.004 };
  function run3a(mut, interv, tmax = 120, dt = 0.05) {
    const out = []; let next = 0;
    if (mut === 'other') {
      const p = perkOf(T_OTHER);
      for (let t = 0; t <= tmax + 1e-9; t += 2) out.push({ t: Math.round(t), B: 0, T: T_OTHER, Trel: 1, Rabs: T_OTHER, perk: p });
      return { out, T0: T_OTHER };
    }
    const khyd = mut === 'dead' ? KHYD_DEAD : KHYD, kex = GEFTONE[interv];
    let D = khyd / (khyd + GEFTONE.none), T = 1 - D, B = 0; const T0 = T;
    for (let t = 0; t <= tmax + 1e-9; t += dt) {
      if (t >= next - 1e-9) { out.push({ t: Math.round(t), B: B, T: T, Trel: T / T0, Rabs: T, perk: perkOf(T) }); next += 2; }
      const dB = KON * D, dT = kex * D - khyd * T, dD = -kex * D + khyd * T - KON * D;
      D += dD * dt; T += dT * dt; B += dB * dt;
    }
    return { out, T0 };
  }
  /* pERK — насыщающая функция доли активного RAS (качественно, как в семинаре 4) */
  function perkOf(T) { return (T * T) / (0.18 * 0.18 + T * T); }
  function at3a(tr, t) { let b = tr[0]; for (const p of tr) { if (p.t <= t + 1e-9) b = p; else break; } return b; }

  return { PHI, kGEFmax, kGAPcell, VAR, EFF, ENG, stat, basal, effectors, curve, run3a, at3a, perkOf };
})();


/* модель вопроса 4 (из src/s4.js) */

/* Учебная модель депо-зависимого входа Ca²⁺. Величины условные, если не названы опыт и условия.
   Параметры калиброваны по названным работам (см. блок преподавателя и ОТЧЁТ_q4.md):
   перераспределение STIM1 — функция Хилла от [Ca²⁺]ЭПР, K½ = 187 мкМ, коэффициент 3,8 (Luik 2008, Jurkat);
   ток CRAC — функция Хилла, K½ = 169 мкМ, коэффициент 4,2 (там же); сродство EF-hand STIM1 к Ca²⁺ Kd ≈ 400 мкМ
   (Stathopulos 2006, диапазон 200–600); из каждой сотни вошедших ионов свободным остаётся около одного
   (буферирование, Clapham 2007); задержка активации STIM1/CRAC — десятки секунд (Wu 2006, Liou 2007);
   модуляция PMCA примерно пятикратная, восстановление τ ≈ 4 мин (Bautista 2002); рефосфорилирование NFAT —
   минуты (Tomida 2003). Калибровка цитозольного ответа — add-back в T-клетках (Zweifach 1993, Hoth 1992, Luik 2008). */
const M4 = (() => {
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const P = {
    E0: 400, Erange: 800, Kd: 400, Ks: 187, ns: 3.8, Kg: 169, ng: 4.2,
    tauS: 30, tauG: 40, Bc: 100, rho: 0.1, Be: 10, Emax: 420, nE: 12, Vs: 0, Kse: 0.15, kL: 0.02,
    Vp: 70, Kp: 0.5, Kmod: 0.45, fmod: 5, tOn: 6, tOff: 240, kIP: 1, tI0: 120, tI1: 180,
    jRest: 0, gBas: 0.12, gCRAC: 158, Kc: 0.3, nc: 3, kN: 1 / 180, csa: 0.03,
    C0: 0.055, tTg: 120, tAdd: 600, T: 1200
  };
  const hS = E => 1 / (1 + Math.pow(Math.max(E, 0) / P.Ks, P.ns));       // доля STIM1 в кластерах (растёт при падении E)
  const hG = E => 1 / (1 + Math.pow(Math.max(E, 0) / P.Kg, P.ng));       // доля открытого тока CRAC
  const efNoCa = E => P.Kd / (P.Kd + Math.max(E, 0));                     // доля STIM1 без Ca²⁺ на EF-hand (1:1)
  const mInf = C => C * C / (P.Kmod * P.Kmod + C * C);                    // модуляция PMCA (Ca²⁺-зависимая)
  const pmca = (C, M) => P.Vp * (1 + P.fmod * M) * Math.pow(C, 3) / (Math.pow(P.Kp, 3) + Math.pow(C, 3));
  const fE = E => Math.max(0, 1 - Math.pow(Math.max(E, 0) / P.Emax, P.nE));          // обратное давление: насос не заполняет депо выше предела
  const serca = (C, E) => P.Vs * C * C / (P.Kse * P.Kse + C * C) * fE(E);
  const cnA = C => Math.pow(C, P.nc) / (Math.pow(P.Kc, P.nc) + Math.pow(C, P.nc));  // активность кальцинейрина
  P.Vs = P.kL * (P.E0 - P.C0) / (P.C0 * P.C0 / (P.Kse * P.Kse + P.C0 * P.C0) * fE(P.E0));
  P.jRest = pmca(P.C0, mInf(P.C0));   // постоянный базовый обмен Ca²⁺: уравновешивает PMCA в покое (учебное допущение)

  /* равновесная модель (4b): E — [Ca²⁺] в просвете ЭПР (мкМ), ext — внешний Ca²⁺ есть (1) или нет (0, EGTA) */
  function eq(E, ext){
    const crac = ext ? hG(E) : 0;
    const target = P.jRest + ext * (P.gBas + P.gCRAC * hG(E));
    let lo = 1e-4, hi = 5;
    for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if (pmca(m, mInf(m)) < target) lo = m; else hi = m; }
    const cyt = (lo + hi) / 2;
    return { efNoCa: efNoCa(E), clust: hS(E), crac, cyt, nfat: cnA(cyt) };  // доли (0..1), cyt в мкМ
  }

  /* интегрирование ОДУ методом Рунге–Кутты 4-го порядка */
  function rk4(f, s0, t0, t1, dt, every){
    let s = Object.assign({}, s0), t = t0; const res = []; let k = 0;
    const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
    res.push(Object.assign({ t }, s));
    while (t < t1 - 1e-9){
      const h = Math.min(dt, t1 - t);
      const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
      const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
      s = n; t += h; k++;
      if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
    }
    return res;
  }
  /* протокол 1: среда без Ca²⁺ → тапсигаргин на 2-й мин → 2 мМ Ca²⁺ на 10-й мин.
     протокол 2 (proto: 'ip3'): 2 мМ Ca²⁺ снаружи с начала опыта; на 2-й мин импульс IP₃ длительностью 1 мин
     (выход Ca²⁺ из ЭПР через IP₃-рецептор, поток kIP·(E − C)); tg: true — SERCA заблокирована тапсигаргином с начала импульса.
     Перед опытом состояние доводится до равновесия (Ca²⁺ снаружи есть). Скорость пополнения депо в модели не калибрована
     по эксперименту: учебное значение сохраняет порядок событий (пополнение депо → разборка кластеров → прекращение входа).
     geno: 'wt' | 'nostim' (нет STIM1) | 'r91w' (ORAI1 R91W) | 'd76a' (STIM1 D76A, активен при полном депо)
     drug: '0' | 'la' (блокатор CRAC) | 'csa' (циклоспорин A); tg — тапсигаргин (протокол 1: по умолчанию да; протокол 2: по умолчанию нет) */
  function run(o){
    o = o || {};
    const ip3 = o.proto === 'ip3';
    const geno = o.geno || 'wt', drug = o.drug || '0', tgOn = ip3 ? !!o.tg : o.tg !== false, tgT = ip3 ? P.tI0 : P.tTg;
    const chan = (geno === 'r91w' ? 0.02 : 1) * (drug === 'la' ? 0.02 : 1);   // проводимость открытого канала
    const sens = geno === 'nostim' ? 0 : 1;                                     // STIM1 присутствует?
    const g0 = ip3 ? hG(P.E0) : 0;                                             // в протоколе 2 вычитается остаточная доля при полном депо
    const sTar = E => geno === 'd76a' ? 1 : sens * hS(E);
    const gTar = E => geno === 'd76a' ? 1 : sens * Math.max(0, hG(E) - g0) / (1 - g0);
    const cao = t => (ip3 || t >= P.tAdd) ? 1 : 0;
    const tg = t => tgOn && t >= tgT;
    const pulse = t => (ip3 && t >= P.tI0 && t < P.tI1) ? 1 : 0;
    const f = (s, t) => {
      const C = Math.max(s.C, 1e-6), E = Math.max(s.E, 0);
      const Jl = P.kL * (E - C), Jip = P.kIP * pulse(t) * (E - C), Js = tg(t) ? 0 : serca(C, E);
      const Jin = P.jRest + cao(t) * (P.gBas + P.gCRAC * chan * s.G);
      const Jp = pmca(C, s.M);
      const A = cnA(C) * (drug === 'csa' ? P.csa : 1);
      return { C: (Jl + Jip - Js + Jin - Jp) / P.Bc, E: (Js - Jl - Jip) / (P.rho * P.Be),
        S: (sTar(E) - s.S) / P.tauS, G: (gTar(E) - s.G) / P.tauG,
        M: (mInf(C) - s.M) / (mInf(C) > s.M ? P.tOn : P.tOff),
        N: P.kN * (A * (1 - s.N) - (1 - A) * s.N) };
    };
    const A0 = cnA(P.C0) * (drug === 'csa' ? P.csa : 1);
    const s0 = { C: P.C0, E: P.E0, S: sTar(P.E0), G: gTar(P.E0), M: mInf(P.C0), N: A0 };
    if (!ip3) return rk4(f, s0, 0, P.T, 0.25, 8);
    const pre = rk4(f, s0, -1500, 0, 0.05, 1e9), sb = Object.assign({}, pre[pre.length - 1]); delete sb.t;   // равновесие при 2 мМ Ca²⁺ снаружи
    const tr = rk4(f, sb, 0, P.T, 0.02, 25); tr.Eb = sb.E; return tr;
  }
  function at(tr, tt){
    if (tt <= tr[0].t) return tr[0];
    for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
      const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
      for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
      return r;
    }
    return tr[tr.length - 1];
  }
  return { P, hS, hG, efNoCa, mInf, cnA, pmca, eq, run, at };
})();


/* =====================================================================
   Схемы страницы объяснений семинара 3 (общая часть). Каждая схема — функция W.<kind>; kind задаётся в lesson.widget.kind.
   Все подписи берутся из lesson.widget.s (в коде — S); в коде нет учебных формулировок.
   Модели M1…M4 — те же функции, что в практикуме (копируются при сборке из src/s1…s4.js),
   поэтому числа в объяснениях и в практикуме совпадают.
   ===================================================================== */
const C4 = { blue: '#145c96', orange: '#c3662f', teal: '#007b72', red: '#ae3347', gray: '#9db4c8', ink: '#152c45', amber: '#c98a0b', amberFill: '#fbe9c2', purple: '#6748b6', muted: '#6b7c8f' };
const n1 = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const p0 = x => Math.round(100 * x) + nb + '%';

/* стрелка или линия с поперечиной по квадратичной кривой: [x1,y1,x2,y2] или [x1,y1,cx,cy,x2,y2] */
function edge4(pts, type, faded){
  const c = { act: C4.blue, inh: C4.red, move: C4.muted, syn: C4.purple, bind: C4.teal }[type] || C4.blue;
  const dash = type === 'move' ? '6 5' : type === 'syn' ? '2 5' : type === 'dbt' ? '7 5' : '';
  const op = faded ? 0.22 : 1;
  let d, x2, y2, ax, ay;
  if (pts.length === 4){ [, , x2, y2] = pts; d = `M${pts[0]} ${pts[1]} L${x2} ${y2}`; ax = pts[0]; ay = pts[1]; }
  else { const [x1, y1, cx, cy] = pts; [, , , , x2, y2] = pts; d = `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`; ax = cx; ay = cy; }
  const a = Math.atan2(y2 - ay, x2 - ax);
  let head;
  if (type === 'inh') { const px = -Math.sin(a) * 9, py = Math.cos(a) * 9; head = `<line x1="${x2 - px}" y1="${y2 - py}" x2="${x2 + px}" y2="${y2 + py}" stroke="${c}" stroke-width="4"/>`; }
  else if (type === 'bind') head = `<circle cx="${x2}" cy="${y2}" r="4" fill="${c}"/>`;
  else { const L = 11, d1 = a + 2.6, d2 = a - 2.6; head = `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`; }
  return `<g opacity="${op}"><path d="${d}" fill="none" stroke="${c}" stroke-width="3"${dash ? ` stroke-dasharray="${dash}"` : ''}/>${head}</g>`;
}
const pBadge = (x, y) => circ(x, y, 10, '#f0b84a', 'stroke="#c98a0b" stroke-width="1.5"') + tx(x, y + 4, 'P', 11, 'middle');
/* узел сети: состояние on (активен, жёлтый), cur (текущая форма неактивного белка: синяя рамка, без заливки), off, miss (нет: пунктир и крест), inh (подавлен фосфорилированием: пунктир) */
function node4(n, st){
  const on = st.on.includes(n.id), miss = st.miss.includes(n.id), inh = (st.inh || []).includes(n.id), cur = (st.cur || []).includes(n.id);
  const fill = on ? C4.amberFill : '#fff', stroke = on ? C4.amber : cur ? C4.blue : miss ? '#9aa7b3' : '#6d8ba5';
  let d = box(n.x, n.y, n.w, n.h || 40, n.label, { fill, stroke, dash: miss || inh ? '6 5' : '', size: n.fs || 15, sw: on || cur ? 3 : 2 });
  if (miss) d += cross(n.x + n.w - 8, n.y + 8);
  if ((st.p || []).includes(n.id)) d += pBadge(n.x + n.w, n.y + 2);

}

/* Сеть с переключаемыми состояниями. S.nodes (необязательно only: [номера режимов, где узел рисуется], not: [номера режимов, где не рисуется]), S.edges (id, pts, type), S.states[i] = {on, miss, inh, p, show (рёбра активны), hide (рёбра скрыты), drugs [[x,y,текст]], note, metrics [[подпись, значение]]} */
W.net = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('net-mode', S.modes, s.mode, S.modes_label));

    if (st.draw) { out(svg(MTH[st.draw](st.l), S.modes[s.mode], st.h || S.h || 300, S.w || 640, st.note), result(`<p>${esc(st.note)}</p>`) + (st.legend ? `<p class="quiet">${esc(st.legend)}</p>` : '')); return; }   // FV107: режим-схема опыта
    let d = (S.areas || []).map(a => a.kind === 'nuc' ? `<ellipse cx="${a.x}" cy="${a.y}" rx="${a.rx}" ry="${a.ry}" fill="#eef0f7" stroke="#97a0ba" stroke-width="2.5"/>` + tx(a.lx, a.ly, a.label, 14, 'middle')
      : a.kind === 'mem' ? line(0, a.y, S.w || 640, a.y, '#556171', 4) + tx(a.lx, a.ly, a.label, 14, 'start') : tx(a.x, a.y, a.label, 14, a.anchor || 'start')).join('');
    S.edges.forEach(e => { if (st.hide.includes(e.id)) return; d += edge4(e.pts, e.type, !st.show.includes(e.id)); if (e.label) d += tx(e.lx, e.ly, e.label, 13, 'middle'); });
    S.nodes.forEach(n => { if ((n.only && !n.only.includes(s.mode)) || (n.not && n.not.includes(s.mode))) return; d += node4(n, st); });
    st.drugs.forEach(([x, y, t]) => { d += rect(x - 6, y - 15, t.length * 8.6 + 12, 22, C4.red, 11) + tx(x, y + 1, t, 13, 'start').replace('<text ', '<text style="fill:#fff;font-weight:700" '); });
    const m = st.metrics ? `<div class="metrics${st.metrics.length === 2 ? ' two' : ''}">${st.metrics.map(([a, b]) => metric(a, b)).join('')}</div>` : '';
    out(svg(d, S.title, S.h || 300, S.w || 640, st.note), m + result(`<p>${esc(st.note)}</p>`) + (S.legend ? `<p class="quiet">${esc(S.legend)}</p>` : ''));
  };
  onGroup('net-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Таблица с переключаемыми вариантами: S.tables[i] = {head, rows, note} */

};

/* Схемы методов: S.schemes[i] = {draw: <имя функции MTH>|'table', l: {подписи}, data, note, h, (head, rows для table)}.
   Функции рисования MTH добавляются в widgets_q*.js через Object.assign(MTH, {...}). */
const MTH = {
  tl(x, y, str, size = 14, anchor = 'middle'){ return String(str).split('\n').map((t, i) => tx(x, y + i * size * 1.25, t, size, anchor)).join(''); },
  panel(x, y, letter, title){ return tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + tx(x + 22, y, title, 15, 'start'); },
};
W.method = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('mth-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const sc = S.schemes[s.mode];
    if (sc.draw === 'table') { out(tbl(sc.head, sc.rows), result(`<p>${esc(sc.note)}</p>`)); return; }
    const body = MTH[sc.draw](sc.l, sc.data);
    out(svg(body, S.modes[s.mode], sc.h || 300, 640, sc.note), result(`<p>${esc(sc.note)}</p>`) + (sc.legend ? `<p class="quiet">${esc(sc.legend)}</p>` : ''));
  };
  onGroup('mth-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Равновесие R ⇄ R* (вид 1) и связь занятости с ответом, резерв рецепторов (вид 2).
   Вид 1: два противоположных превращения нарисованы встречными стрелками (толщина — относительная скорость перехода),
   лиганд — отдельное звено, меняющее эти скорости; доля активной конформации — столбик (учебные величины из S.frac).
   Вид 2: занятость — c/(c + KD); ответ — M1.basic(доля занятых от исходного числа рецепторов); числа те же, что в практикуме 1б. */
W.q1equil = ({ S, s, set, out, onGroup }) => {
  s.view ??= 0; s.mode ??= 0; s.f ??= 1; s.pred ??= null;
  const FV = S.fvals || [1, 0.3, 0.1, 0.03];
  const ref = () => M1.basic(1, 'br').E;
  const resp = (f, c) => 100 * M1.basic(f * c / (1 + c), 'br').E / ref();
  const ec50 = f => { const mx = M1.basic(f, 'br').E; let lo = 1e-6, hi = 1e6;
    for (let i = 0; i < 60; i++){ const c = Math.sqrt(lo * hi); if (M1.basic(f * c / (1 + c), 'br').E < mx / 2) lo = c; else hi = c; }
    return Math.sqrt(lo * hi); };
  const render = () => {
    const vg = buttonGroup('q1e-view', S.views, s.view, S.view_label);
    if (s.view === 0) {
      set(S.title, S.status, vg + buttonGroup('q1e-mode', S.modes, s.mode, S.modes_label));
      onGroup('q1e-view', i => { s.view = i; render(); });
      onGroup('q1e-mode', i => { s.mode = i; conf(); });
      conf();
    } else {
      const ctl = s.pred === null ? '<p class="quiet">' + esc(S.pred_q) + '</p>' + buttonGroup('q1r-pred', S.pred_opts, -1, '')
        : buttonGroup('q1r-f', S.fopts, s.f, S.fL);
      set(S.title2, S.status2, vg + ctl);
      onGroup('q1e-view', i => { s.view = i; render(); });
      if (s.pred === null) onGroup('q1r-pred', i => { s.pred = i; render(); });
      else onGroup('q1r-f', i => { s.f = i; reserve(); });
      reserve();
    }
  };
  const conf = () => {
    const f = S.frac[s.mode], y0 = 250, h = 190, m = s.mode;
    let d = tx(8, 30, S.caxis, 13, 'start');   // подпись длиннее после правки языка (FL006): выравнивание по левому краю
    d += rect(118, y0 - h, 64, h, '#eef3f7', 6, 'stroke="#c8d6e2"');
    d += rect(118, y0 - h * f, 64, h * f, f > 0.5 ? C4.amber : C4.blue, 6, f < 0.02 ? 'opacity="0.35"' : '');
    d += tx(150, y0 + 20, Math.round(f * 100) + nb + '%', 15, 'middle').replace('<text ', '<text style="font-weight:700" ');
    d += tx(60, y0 - h + 6, '100', 12, 'end') + tx(60, y0, '0', 12, 'end');
    d += tx(150, y0 - h - 10, S.bartop, 12, 'middle');
    /* схема равновесия: два превращения — две встречные стрелки; лиганд — отдельное звено */
    d += box(300, 110, 90, 44, S.rInact, { size: 13, fill: '#fff', stroke: '#6d8ba5' });
    d += box(470, 110, 90, 44, S.rAct, { size: 13, fill: C4.amberFill, stroke: C4.amber });
    d += arrow(394, 123, 462, 123, C4.blue, S.fw[m]) + arrow(466, 141, 398, 141, C4.blue, S.bw[m]);
    d += tx(430, 100, S.shift[m], 12, 'middle');
    if (m === 0) d += tx(430, 200, S.lig[m], 13, 'middle').replace('<text ', '<text style="font-weight:700" ');
    else {
      d += rect(350, 188, 160, 28, m === 4 ? '#eef3f7' : '#e1f3f1', 14, 'stroke="' + C4.teal + '" stroke-width="2"');
      d += tx(430, 207, S.lig[m], 13, 'middle').replace('<text ', '<text style="font-weight:700" ');
      d += arrow(430, 186, 430, 152, C4.teal, 2, '5 4');
      d += tx(438, 173, S.ligL, 12, 'start');
    }
    out(svg(d, S.title, 300, 620, S.notes[m]), result('<p>' + esc(S.notes[m]) + '</p>') + '<p class="quiet">' + esc(S.legend) + '</p>');
  };
  const reserve = () => {
    const x0 = 70, x1 = 600, y0 = 196, y1 = 34, LG0 = -3, LG1 = 2;
    const X = lg => x0 + (lg - LG0) / (LG1 - LG0) * (x1 - x0), Y = v => y0 - (y0 - y1) * v / 100;
    const f = FV[s.f], shown = s.pred !== null;
    let d = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y0, x0, y1, '#7f97ab', 1.5);
    [0, 50, 100].forEach(v => { d += line(x0, Y(v), x1, Y(v), '#e4ebf1', 1) + tx(x0 - 8, Y(v) + 5, String(v), 13, 'end'); });
    S.xticks.forEach((t, i) => { const x = X(LG0 + i); d += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 21, t, 13, 'middle'); });
    const path = fn => { let p = ''; for (let i = 0; i <= 100; i++){ const lg = LG0 + (LG1 - LG0) * i / 100, c = Math.pow(10, lg); p += (i ? 'L' : 'M') + X(lg).toFixed(1) + ',' + Y(fn(c)).toFixed(1) + ' '; } return p; };
    d += '<path d="' + path(c => 100 * c / (1 + c)) + '" fill="none" stroke="' + C4.muted + '" stroke-width="3" stroke-dasharray="7 5"/>';
    d += '<path d="' + path(c => resp(1, c)) + '" fill="none" stroke="' + C4.blue + '" stroke-width="3.5"/>';
    if (shown) d += '<path d="' + path(c => resp(f, c)) + '" fill="none" stroke="' + C4.orange + '" stroke-width="3.5"/>';
    /* KD и EC50 — разные величины */
    d += line(X(0), y0, X(0), y1 + 6, C4.muted, 1.5, 'stroke-dasharray="3 4"') + tx(X(0), y1 + 2, 'KD', 13, 'middle');
    const e1 = ec50(1);
    d += line(X(Math.log10(e1)), Y(50), X(Math.log10(e1)), y0, C4.blue, 1.5, 'stroke-dasharray="3 4"') + circ(X(Math.log10(e1)), Y(50), 4, C4.blue);
    d += tx(X(Math.log10(e1)), y0 + 40, 'EC50', 13, 'middle').replace('<text ', '<text style="fill:' + C4.blue + ';font-weight:700" ');
    let ef = e1;
    if (shown){ ef = ec50(f); const mx = resp(f, 1e6);
      d += line(X(Math.log10(ef)), Y(mx / 2), X(Math.log10(ef)), y0, C4.orange, 1.5, 'stroke-dasharray="3 4"') + circ(X(Math.log10(ef)), Y(mx / 2), 4, C4.orange);
      if (f < 1) d += tx(X(Math.log10(ef)), y0 + 56, "EC50′", 13, 'middle').replace('<text ', '<text style="fill:' + C4.orange + ';font-weight:700" '); }
    d += tx((x0 + x1) / 2, y0 + 78, S.xax, 13, 'middle');
    d += tx(x0, 18, S.yax, 13, 'start');
    /* легенда */
    const lg = (x, c, dash, txt) => line(x, 300, x + 28, 300, c, 3.5, dash ? 'stroke-dasharray="7 5"' : '') + tx(x + 34, 304, txt, 12, 'start');
    d += lg(70, C4.muted, true, S.l_occ) + lg(210, C4.blue, false, S.l_all) + (shown ? lg(400, C4.orange, false, fmt(S.l_red, { f: Math.round(f * 100) })) : '');
    const mx = resp(f, 1e6);
    const note = !shown ? S.note0 : f === 1 ? S.note_all : fmt(S.note_red, { f: Math.round(f * 100), sh: n1(ef / e1, 1), mx: Math.round(mx), ec: n1(ef, 2), e1: n1(e1, 2) });
    const met = shown ? '<div class="metrics">' + metric(S.m_kd, '1 KD') + metric(S.m_ec, n1(ef, 2) + nb + 'KD') + metric(S.m_max, Math.round(mx) + nb + '%') + '</div>' : '<div class="metrics">' + metric(S.m_kd, '1 KD') + metric(S.m_ec, n1(e1, 2) + nb + 'KD') + metric(S.m_max, '100' + nb + '%') + '</div>';
    const fb = shown ? '<p><strong>' + esc(S.pred_fb_head[s.pred === 0 ? 0 : 1]) + '</strong> ' + esc(S.pred_fb[s.pred]) + '</p>' : '';
    out(svg(d, S.title2, 322, 640, note), met + result(fb + '<p>' + esc(note) + '</p>') + '<p class="quiet">' + esc(S.legend2) + '</p>');
  };
  render();
};

/* Микродомен cAMP: длина диффузии λ = √(D/k); ползунок активности фосфодиэстераз k, расчёт по формуле. */
W.q1domain = ({ S, s, set, out, onRange }) => {
  s.k ??= 100;
  const D = 40;                                 // мкм²/с (Zaccolo 2020)
  set(S.title, S.status, '<div class="controls">' + slider('q1d-k', S.kL, 10, 1000, s.k, 10, '') + '</div>');
  const draw = () => {
    const lam = M1.lambda(D, s.k);              // мкм
    $('q1d-k-value').textContent = s.k + nb + S.kU;
    const x0 = 70, x1 = 600, y0 = 210, y1 = 40, W6 = x1 - x0;
    const xmax = 3;                              // мкм на оси
    let d = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y0, x0, y1, '#7f97ab', 1.5);
    for (let i = 0; i <= 3; i++){ const x = x0 + W6 * i / 3; d += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 20, String(i), 13); }
    d += tx((x0 + x1) / 2, y0 + 38, S.xax, 13, 'middle') + tx(x0 - 8, y1 + 4, '1', 12, 'end') + tx(x0 - 8, y0, '0', 12, 'end');
    let path = '';
    for (let i = 0; i <= 60; i++){ const x = xmax * i / 60, yv = Math.exp(-x / lam); path += (i ? 'L' : 'M') + (x0 + W6 * x / xmax).toFixed(1) + ',' + (y0 - (y0 - y1) * yv).toFixed(1) + ' '; }
    d += '<path d="' + path + '" fill="none" stroke="' + C4.blue + '" stroke-width="3"/>';
    const xl = x0 + W6 * Math.min(lam, xmax) / xmax;
    d += line(xl, y0, xl, y0 - (y0 - y1) * Math.exp(-1), '#c3662f', 2, 'stroke-dasharray="5 4"');
    d += tx(xl, y1 + 2, 'λ = ' + num(lam, 2) + nb + 'мкм', 13, 'middle').replace('<text ', '<text style="fill:#c3662f;font-weight:700" ');
    const note = fmt(S.note, { l: num(lam, 2) });
    out(svg(d, S.title, 258, 640, note), result('<p>' + esc(note) + '</p>'));
  };
  onRange('q1d-k', v => { s.k = v; draw(); });
  draw();
};

/* =====================================================================
   Схемы раздела 2 (обратимое фосфорилирование). Модель M2 — та же, что в практикуме (src/s2.js).
   Все подписи — из lesson.widget.s (S); в коде нет учебных формулировок.
   ===================================================================== */
const q2f = (x, d = 2) => Number(x).toFixed(d).replace('.', ',');

/* Пара киназа — фосфатаза. Вид 0 «Молекулы» (P03): 20 или 100 молекул, две одновременные реакции, равные потоки на плато;
   две пары констант с одним отношением и разной суммой; одинаковое пробное воздействие (подавление киназы на 60-й с).
   Вид 1 «Расчёт по формуле»: ползунки kк и kф → p*, τ, закачка SERCA2a, потоки vк и vф. Числа — из M2, как в практикуме. */
function q2sim(kk, kf, N, test, seed){
  /* стохастическая модель: у каждой молекулы за шаг dt вероятность фосфорилирования kк·dt (если без фосфата) или дефосфорилирования kф·dt (если с фосфатом);
     одно и то же зерно у обоих вариантов воздействия, поэтому до 60-й с траектории совпадают */
  let a = seed >>> 0; const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const dt = 0.05, sub = 20, T = 120, st = new Uint8Array(N), snap = [Uint8Array.from(st)], ph = [0], dp = [0];
  for (let t = 0; t < T; t++){
    let nph = 0, ndp = 0;
    for (let k = 0; k < sub; k++){
      const kkT = (test && t >= 60) ? 0 : kk;
      for (let i = 0; i < N; i++){
        const r = rnd();
        if (st[i] === 0){ if (r < kkT * dt){ st[i] = 1; nph++; } } else if (r < kf * dt){ st[i] = 0; ndp++; }
      }
    }
    snap.push(Uint8Array.from(st)); ph.push(nph); dp.push(ndp);
  }
  return { snap, ph, dp, N };
}
const q2det = (kk, kf, test, t) => t <= 60 || !test ? M2.pAt(0, kk, kf, t) : M2.pAt(M2.pAt(0, kk, kf, 60), 0, kf, t - 60);

W.q2pair = ({ S, s, set, out, onRange, onGroup }) => {
  s.view ??= 0; s.kk ??= 10; s.kf ??= 40; s.n ??= 1; s.pair ??= 0; s.test ??= 0; s.t ??= 40;
  const viewG = () => buttonGroup('q2p-view', S.views, s.view, S.viewL);
  const bindView = () => onGroup('q2p-view', i => { s.view = i; render(); });
  const molView = () => {
    set(S.title, S.status, viewG() + buttonGroup('q2p-n', S.pops, s.n, S.popL) + buttonGroup('q2p-pair', S.pairs, s.pair, S.pairL) + buttonGroup('q2p-test', S.tests, s.test, S.testL) +
      '<div class="controls">' + slider('q2p-t', S.tL, 0, 120, s.t, 1, ' ' + S.u_s) + '</div>');
    bindView();
    const draw = () => {
      const N = S.popN[s.n], [kk, kf] = S.pairVals[s.pair], test = s.test === 1, key = [s.n, s.pair, s.test].join('/');
      s._sim ??= {}; const sim = s._sim[key] ??= q2sim(kk, kf, N, test, 7001 + 97 * s.pair + N);
      const t = s.t, snap = sim.snap[t], np = snap.reduce((x, y) => x + y, 0);
      /* ячейки молекул */
      const cols = N === 20 ? 10 : 20, cw = 640 / cols, rowsN = N / cols, ch = N === 20 ? 62 : 32, r = N === 20 ? 21 : 11, hh = rowsN * ch + 10;
      let d = '';
      for (let i = 0; i < N; i++){
        const cx = cw * (i % cols) + cw / 2, cy = 5 + ch * Math.floor(i / cols) + ch / 2, on = snap[i] === 1;
        d += circ(cx, cy, r, on ? '#fbe9c2' : '#fff', `stroke="${on ? '#c98a0b' : '#6d8ba5'}" stroke-width="${on ? 3 : 2}"`);
        if (on && N === 20) d += tx(cx, cy + 5, 'P', 15, 'middle');
      }
      const mol = svg(d, S.title, hh, 640, S.mol_desc);
      /* график: p(t) по молекулам и расчётная кривая */
      const sim_pts = []; for (let k = 0; k <= 120; k++) sim_pts.push([k, 100 * sim.snap[k].reduce((x, y) => x + y, 0) / N]);
      const det = []; for (let k = 0; k <= 120; k += 2) det.push([k, 100 * q2det(kk, kf, test, k)]);
      const ch1 = chart([{ pts: det, color: '#6b7c8f', dash: '6 5', label: S.l_det }, { pts: sim_pts, color: '#c98a0b', label: S.l_sim }],
        { xLabel: S.xL, yLabel: S.yL, maxX: 120, maxY: 100, ticksX: 6, ticksY: 4, title: S.title, h: 230, marks: [[t, sim_pts[t][1], '#c98a0b']] });
      /* потоки за последние 20 с */
      const t0 = Math.max(test && t > 60 ? 60 : 0, t - 20); let a = 0, b = 0; for (let k = t0 + 1; k <= t; k++){ a += sim.ph[k]; b += sim.dp[k]; }
      const pd = q2det(kk, kf, test, t), vk = (test && t > 60 ? 0 : kk) * (1 - pd), vf = kf * pd;
      const off = test && t > 60, flat = !off && Math.abs(vk - vf) <= 0.1 * Math.max(vk, vf);
      const note = fmt(off ? S.note_off : flat ? S.note_flat : S.note_rise, { n: np, N, p: q2f(np / N), tau: q2f(M2.tau(off ? 0 : kk, kf), 0) });
      out(mol + `<p class="quiet">${esc(S.mol_legend)}</p>` + ch1,
        `<div class="metrics">${metric(fmt(S.m_now, { N }), np + nb + '/' + nb + N)}${metric(S.m_win_k, String(a))}${metric(S.m_win_f, String(b))}</div>` + result('<p>' + esc(note) + '</p>') + `<p class="quiet">${esc(S.cmp)}</p>`);
    };
    onGroup('q2p-n', i => { s.n = i; draw(); }); onGroup('q2p-pair', i => { s.pair = i; draw(); }); onGroup('q2p-test', i => { s.test = i; draw(); });
    onRange('q2p-t', v => { s.t = v; draw(); });
    draw();
  };
  const formView = () => {
    set(S.title, S.status, viewG() + '<div class="controls">' + slider('q2p-kk', S.kkL, 0, 100, s.kk, 5, '') + slider('q2p-kf', S.kfL, 5, 200, s.kf, 5, '') + '</div>');
    bindView();
    const draw = () => {
      const kk = s.kk / 1000, kf = s.kf / 1000, ps = M2.pStar(kk, kf), ta = M2.tau(kk, kf), U = M2.uptake(1 - ps), vs = kk * (1 - ps);
      $('q2p-kk-value').textContent = q2f(kk, 3) + ' ' + S.unit;
      $('q2p-kf-value').textContent = q2f(kf, 3) + ' ' + S.unit;
      const pts = [], vkp = [], vfp = []; for (let t = 0; t <= 120; t += 2){ const p = M2.pAt(0, kk, kf, t); pts.push([t, 100 * p]); vkp.push([t, 1000 * kk * (1 - p)]); vfp.push([t, 1000 * kf * p]); }
      const ch = chart([{ pts, color: '#c98a0b', label: S.l_p }, { pts: [[0, 100 * ps], [120, 100 * ps]], color: '#6b7c8f', dash: '6 5', label: S.l_ps }],
        { xLabel: S.xL, yLabel: S.yL, maxX: 120, maxY: 100, ticksX: 6, ticksY: 4, title: S.title, h: 250 });
      const my = Math.max(20, Math.ceil(1000 * Math.max(kk, kf * ps) / 20) * 20);
      const ch2 = chart([{ pts: vkp, color: '#145c96', label: S.l_vk }, { pts: vfp, color: '#c3662f', label: S.l_vf }],
        { xLabel: S.xL, yLabel: S.yL2, maxX: 120, maxY: my, ticksX: 6, ticksY: 4, title: S.title2, h: 230 });
      const note = fmt(S.note, { p: q2f(ps), tau: ta >= 100 ? String(Math.round(ta)) : q2f(ta, 1), up: String(Math.round(100 * U)), v: q2f(vs, 4) });
      out(ch + ch2, `<div class="metrics">${metric(S.m_p, q2f(ps))}${metric(S.m_tau, (ta >= 100 ? String(Math.round(ta)) : q2f(ta, 1)) + ' ' + S.u_s)}${metric(S.m_flux, q2f(vs, 4) + ' ' + S.unit)}${metric(S.m_up, Math.round(100 * U) + nb + '%')}</div>` + result('<p>' + esc(note) + '</p>'));
    };
    onRange('q2p-kk', v => { s.kk = v; draw(); });
    onRange('q2p-kf', v => { s.kf = v; draw(); });
    draw();
  };
  const render = () => { s.view === 0 ? molView() : formView(); };
  render();
};

/* gef-gap: пара GEF — GAP на одной ГТФазе; p* = kGEF/(kGEF+kGAP), τ = 1/(kGEF+kGAP).
   При kGEF = kGAP = 0 переходов нет: стационар не определён (0/0), сохраняется исходное состояние, τ бесконечно. */
/* Сравнение трёх превращений (P04): обмен нуклеотида (GEF), гидролиз связанного GTP (GAP), фосфорилирование белка (киназа).
   Метка (изотоп) показана на том месте, где она находится до реакции, и там, где оказывается после неё. Связанный нуклеотид — серо-зелёная плашка,
   ковалентный фосфат на белке — жёлтый кружок P: разные обозначения для разных связей. */
const q3cmp = S => {
  const W0 = 640, dot = (x, y) => circ(x, y, 5, '#c2185b', 'stroke="#fff" stroke-width="1.5"');
  const chip = (x, y, w, t) => rect(x, y, w, 20, '#e3efe9', 6, 'stroke="#5e8f7c" stroke-width="1.8"') + tx(x + w / 2, y + 14.5, t, 12.5, 'middle');
  const prot = (cx, cy, name) => `<ellipse cx="${cx}" cy="${cy}" rx="56" ry="34" fill="#fff" stroke="#6d8ba5" stroke-width="2.2"/>` + tx(cx, cy - 8, name, 14, 'middle');
  const pbadge = (x, y) => circ(x, y, 11, C4.amberFill, `stroke="${C4.amber}" stroke-width="2"`) + tx(x, y + 4.5, 'P', 12.5, 'middle').replace('<text ', '<text style="font-weight:700" ');
  const row = (y0, title, enz, note) => tx(14, y0 + 16, title, 14.5, 'start').replace('<text ', '<text style="font-weight:700" ') +
    arrow(168, y0 + 78, 300, y0 + 78, '#145c96', 3) + tx(234, y0 + 66, enz, 13.5, 'middle') + tx(14, y0 + 138, note, 12.5, 'start');
  let d = '';
  /* 1. обмен: метка на основании GDP */
  let y = 6; const cy = k => y + 78;
  d += row(y, S.c_a_t, S.c_a_enz, S.c_a_k) + prot(92, cy(), 'RAS') + chip(64, cy() + 4, 56, 'GDP') + dot(68, cy() + 14);
  d += tx(234, y + 100, S.c_a_re, 12.5, 'middle') + prot(392, cy(), 'RAS') + chip(364, cy() + 4, 56, 'GTP');
  d += tx(556, y + 52, S.c_free, 12.5, 'middle') + chip(528, cy() + 4, 56, 'GDP') + dot(532, cy() + 14);
  /* 2. гидролиз: метка в γ-фосфате GTP */
  y = 156;
  d += row(y, S.c_b_t, S.c_b_enz, S.c_b_k) + prot(92, cy(), 'RAS') + chip(64, cy() + 4, 56, 'GTP') + dot(115, cy() + 14);
  d += tx(234, y + 100, S.c_b_re, 12.5, 'middle') + prot(392, cy(), 'RAS') + chip(364, cy() + 4, 56, 'GDP');
  d += tx(556, y + 52, S.c_free, 12.5, 'middle') + circ(556, cy() + 14, 14, '#fff', 'stroke="#5e8f7c" stroke-width="1.8"') + tx(556, cy() + 18.5, 'Pi', 12.5, 'middle') + dot(566, cy() + 4);
  /* 3. фосфорилирование: метка в γ-фосфате ATP, оказывается на белке */
  y = 306;
  d += row(y, S.c_c_t, S.c_c_enz, S.c_c_k) + prot(92, cy(), S.c_c_prot) + tx(92, cy() + 14, '–OH', 13, 'middle');
  d += chip(206, cy() + 10, 56, 'ATP') + dot(257, cy() + 20) + prot(392, cy(), S.c_c_prot) + tx(392, cy() + 14, '–O–', 13, 'middle') + pbadge(436, cy() + 8) + dot(450, cy() - 2);
  d += tx(556, y + 52, S.c_free, 12.5, 'middle') + chip(528, cy() + 4, 56, 'ADP');
  d += dot(20, 468) + tx(32, 472, S.c_leg, 12.5, 'start');
  return svg(d, S.modes[1], 482, W0, S.c_note);
};
W.q3gefgap = ({ S, s, set, out, onRange, onGroup }) => {
  s.gef ??= 50; s.gap ??= 50; s.view ??= 0;
  const group = () => buttonGroup('gg-view', S.modes, s.view, S.modes_label);
  const render = () => {
    if (s.view === 1) {
      set(S.title, S.status, group());
      out(q3cmp(S), tbl(S.c_head, S.c_rows) + result(`<p>${esc(S.c_note)}</p>`));
    } else {
      set(S.title, S.status, group() + `<div class="controls">${slider('gg-gef', S.gef, 0, 100, s.gef, 1, '')}${slider('gg-gap', S.gap, 0, 100, s.gap, 1, '')}</div>`);
      onRange('gg-gef', v => { s.gef = v; draw(); });
      onRange('gg-gap', v => { s.gap = v; draw(); });
      draw();
    }
    onGroup('gg-view', i => { s.view = i; render(); });
  };
  const draw = () => {
    const g = s.gef, h = s.gap, sum = g + h, zero = sum === 0;
    const p = zero ? null : g / sum, tau = zero ? Infinity : 100 / sum;
    const W = 600, x0 = 40, bw = 520, y = 150;
    const body =
      tx(x0, 48, S.gef + ': ' + g + ' %', 15, 'start') +
      line(x0, 64, x0 + bw * clamp(g / 100), 64, C4.blue, 14) +
      tx(x0, 100, S.gap + ': ' + h + ' %', 15, 'start') +
      line(x0, 116, x0 + bw * clamp(h / 100), 116, C4.red, 14) +
      // шкала доли RAS-GTP: при нулевых активностях доля не определена, шкала не закрашивается
      rect(x0, y, bw, 30, '#eef3f7', 8, 'stroke="#c8d6e2"') +
      (zero ? '' : rect(x0, y, bw * clamp(p), 30, C4.amber, 8)) +
      tx(x0 + bw / 2, y + 20, zero ? S.m_zero : S.m_p + ': ' + Math.round(p * 100) + nb + '%', 15, 'middle') +
      tx(x0, y + 70, S.formula, 14, 'start');
    const note = zero ? S.note_zero : p > 0.62 ? S.note_hi : p < 0.38 ? S.note_lo : S.note_mid;
    out(svg(body, S.title, 250, W),
      `<div class="metrics two">${metric(S.m_p, zero ? S.v_zero : Math.round(p * 100) + nb + '%')}${metric(S.m_tau, zero ? '∞' : num(tau, 1))}</div>` + result(`<p>${esc(note)}</p>`));
  };
  render();
};

  /* секвенирование: какая замена в кодоне 12 гена KRAS (кодоны 11–13: GCT GGT GGC; G12C — GGT→TGT, G12D — GGT→GAT) */
  seq(l) {
    let d = MTH.panel(10, 24, l.pA, l.a);
    [[20, 120, l.s1], [166, 120, l.s2], [312, 150, l.s3], [492, 130, l.s4]].forEach(([x, w, t]) => { d += box(x, 40, w, 38, t, { size: 13 }); });
    d += arrow(142, 59, 164, 59, C4.muted, 3) + arrow(288, 59, 310, 59, C4.muted, 3) + arrow(464, 59, 490, 59, C4.muted, 3);
    d += MTH.panel(10, 118, l.pB, l.b);
    [11, 12, 13].forEach((n, i) => { d += tx(215 + i * 100, 146, l.cod + ' ' + n, 12, 'middle'); });
    [[l.r0, ['GCT', 'GGT', 'GGC'], [l.a1, l.a2, l.a2], -1, -1], [l.r1, ['GCT', 'TGT', 'GGC'], [l.a1, l.a3, l.a2], 0], [l.r2, ['GCT', 'GAT', 'GGC'], [l.a1, l.a4, l.a2], 1]].forEach(([name, cod, aa, mark], r) => {
      const y = 156 + r * 52;

      cod.forEach((c, i) => {

        d += rect(x, y, 90, 44, '#fff', 8, 'stroke="#c8d6e2" stroke-width="2"');

  },
  /* масс-спектрометрия содержания ингибитора в клетках: пик ингибитора относительно внутреннего стандарта */
  msdrug(l) {
    let d = MTH.panel(10, 24, l.pA, l.a);
    [[20, 130, l.s1], [196, 130, l.s2], [372, 150, l.s3]].forEach(([x, w, t]) => { d += box(x, 40, w, 38, t, { size: 13 }); });
    d += arrow(152, 59, 194, 59, C4.muted, 3) + arrow(328, 59, 370, 59, C4.muted, 3);
    d += MTH.panel(10, 118, l.pB, l.b);
    [[40, l.c1], [340, l.c2]].forEach(([x0, title]) => {
      d += tx(x0, 148, title, 13, 'start');

      d += line(x0 + 70, 262, x0 + 70, 200, C4.gray, 6) + line(x0 + 170, 262, x0 + 170, 180, C4.amber, 6);
      d += tx(x0 + 70, 280, l.std, 12, 'middle') + tx(x0 + 170, 280, l.drug, 12, 'middle');
