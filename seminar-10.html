и in vitro; Adomavicius 2019), колоколообразная зависимость ATF4 от степени подавления трансляции (качественно; Lu 2004), падение синтеза на 78–81 % при арсените (Andreev 2015), порядок p-eIF2α → ATF4 → CHOP (Han 2013) и окно действия ISRIB (Rabouw 2019). Подобраны автором: скорости фосфорилирования и дефосфорилирования, периоды полужизни ATF4 и GADD34, вклад GADD34 и положение максимума ATF4 (около 35 % p-eIF2α); числовых измерений для них в использованных работах нет. Кратности (например, ATF4 ×19 при умеренной активности киназ) — арифметика модели, а не измерения. Модель не рассчитывает гибель клеток, ATP, окислительную нагрузку, транскрипционную регуляцию ATF4 (Dey 2010), индукцию ATF4 через mTORC1 (Ben-Sahra 2016) и вклад других киназ при длительном стрессе (Guan 2017). Спорно: перенос параметров с дрожжей, ретикулоцитов и МЭФ на клетки человека; повышение ATF4 под действием ISRIB при промежуточном p-eIF2α существует только в модели. Вопрос 2 (UPR). Обе сцены используют одну учебную модель: нагрузка и ёмкость ЭПР — условные индексы (1 — исходное равновесие), время выражено в часах учебной модели, ступени дозы «низкая» и «высокая» условны. Из работ взяты направления и порядок величин: отрыв BiP как упрощённая схема активации сенсоров (Bertolotti 2000; Shen 2005), затухание IRE1α и ATF6 при сохранении PERK (Lin 2007; Li 2010; Sundaram 2018; клетки HEK293, высокие дозы), зависимость ATF6f от PERK (Teske 2011), период полужизни белка BiP около 46 ч (Rutkowski 2006), снижение притока белков при торможении трансляции (Harding 2000a). Подобраны автором модели: общая для трёх сенсоров доля сенсоров без BiP, пороги ветвей (IRE1α ниже ATF6, ATF6 ниже PERK), скорости активации, равный вклад XBP1s и ATF6f в рост ёмкости (работы расходятся: Lee 2003; Yamamoto 2007; Wu 2007), множитель расщепления ATF6 без PERK и остаточное расщепление при PF-429242. Модель не рассчитывает гибель клеток, RIDD, JNK и отмывку индуктора и принимает IRE1α и ATF6 независимыми, хотя в МЭФ Ire1α⁻/⁻ репортёр ATF6 не индуцировался (Lee 2002). Показания ветви PERK рассчитываются по модели вкладки 1. Спорно: перенос данных HEK293 и МЭФ на другие клетки и дозы. Вопрос 3 (KEAP1–NRF2). Модель — система обыкновенных дифференциальных уравнений. Из измерений взяты период полужизни NRF2 (около 13 мин без индуктора и около 100 мин при CdCl₂; Stewart 2003, клетки Hepa) и порядок событий: содержание NRF2 повышается раньше содержания продуктов его генов-мишеней (Stewart 2003; He 2001), GSH сначала убывает, затем растёт (Wang 2015; Toyama 2011). Допущениями остаются постоянный синтез NRF2, ёмкость KEAP1 (втрое выше исходного содержания NRF2; качественно по Iso 2016), задержки роста мишеней, скорости реакции индукторов с тремя группами цистеинов и выведения электрофила, доля NQO1 и HMOX1, не зависящая от NRF2, остаточная активность мутанта C273A/C288A, занятость доменов Kelch белком p62, остаточная активность протеасомы при MG132 и постоянная времени убыли белков при циклогексимиде. «Насыщение KEAP1 новым NRF2» — рабочее объяснение, а не установленный механизм: ряд работ описывает диссоциацию комплекса (Itoh 2003; Cullinan 2003). Значения для Keap1⁻/⁻ и NRF2 с заменой в ETGE, как и превышение GSH над исходным уровнем, — экстраполяция. Времена — часы учебной модели. Вопрос 4 (HIF). Обе сцены используют одну учебную модель: у молекулы HIF-1α два сайта гидроксилирования (Pro402 и Pro564); при гидроксилировании любого из них молекула быстро разрушается с участием pVHL, непомеченные молекулы разрушаются медленно (около 200 мин; Moroz 2009); гидроксилирование Asn803 снижает активность, но не стабильность (Lando 2002a; Dayan 2006). Из работ взяты направления и порядок величин: период полужизни HIF-1α в нормоксии 5–8 мин (Berra 2001); Km PHD по O₂ чуть выше атмосферной, Km FIH ниже (Hirsilä 2003; Koivunen 2004); порядок чувствительности сайтов и FIH к снижению O₂ (Tian 2011, клетки RCC4); рост PHD2 и PHD3 под действием HIF (Berra 2003; Stiehl 2006). Подобраны автором модели: скорость гидроксилирования, доли сайтов, форма ответа мишеней, предельные кратности, характерные времена изменения содержания PHD2/3 (6 ч) и мРНК мишеней (3 ч), силы воздействий (без доз), момент реоксигенации. Модель не учитывает диффузию O₂ в среде (равновесие занимает более 3 ч: Allen 2001), HIF-2α и HIF-3α, синтез HIF-1α через mTOR, связь FIH с pVHL (Mahon 2001) и снижение мРНК HIF-1α в длительной гипоксии (Uchida 2004). Спорно: показание Pro564 в базовой сцене определено как доля синтезированных молекул, на блоте продвинутой — как количество; условие загадки «1 % O₂ против DMOG» шире данных одной работы.", "teacher_3": "Вопрос 1: поправки к блоку координатора. (1) Диапазон «снижает общую инициацию на 50–80 %» не имеет единого источника: измерено около 78–81 % (арсенит 40 мкМ, 30 мин, HEK293T; Andreev 2015) и около 80 % (тапсигаргин 400 нМ, 1 ч, МЭФ; Guan 2017), а при слабом стрессе подавление мало (Rutkowski 2006). (2) Фосфорилирование происходит за десятки минут, а не «мгновенно», и ингибитором служит eIF2(αP), а не eIF2·GDP: сродство к eIF2B от нуклеотида не зависит (Andreev 2015; Jennings 2017; Adomavicius 2019). (3) HRI не ограничена эритроидными клетками (McEwen 2005; Guo 2020). (4) GADD34 индуцируют ATF4, CHOP и обход uORF, базальное дефосфорилирование обеспечивает CReP (Ma 2003; Marciniak 2004; Jousse 2003). (5) ISRIB ослабляет ответ на умеренное p-eIF2α, при очень высоком он неэффективен (Rabouw 2019). (6) Для репортёров ATF4 следует писать «показывают» вместо более сильного глагола: без uORF индукция исчезает (Lu 2004). (7) ppGpp — частичная аналогия (Brown 2016); GCN2 следует назвать наиболее широко представленной киназой, а не древнейшей (Krishna 2018; Rothenburg 2009). (8) Окна «15–30 мин, 1–4 ч, 4–12 ч, 6–24 ч» не подтверждены: порядок p-eIF2α → ATF4 → CHOP и GADD34 сохраняется, часы зависят от стимула и дозы (Han 2013). (9) BIM как мишень CHOP не подтверждён; DR5 и Bcl2 — в отдельных системах (Yamaguchi 2004; McCullough 2001). Вопрос 2: поправки к блоку координатора. (1) Утверждение «BiP удерживает три сенсора» — упрощение: связь BiP с ATF6 стабильна и рвётся регулируемо (Shen 2005), связь с IRE1α поддерживает цикл с ERdj4 (Amin-Wetzel 2017), несвёрнутые белки могут связываться с сенсорами напрямую (Karagöz 2017; Wang 2018). (2) Срок «5–30 мин» для отрыва BiP первичными данными не подтверждён; минутные сроки есть для других событий, например олигомеров IRE1 на 10 мин (Belyy 2022). (3) IRE1α и ATF6 затухают при сохраняющемся стрессе, PERK сохраняется (Lin 2007; Sundaram 2018); эндогенный IRE1α образует небольшие обратимые олигомеры, а не крупные кластеры (Belyy 2022). (4) ATF6 не необходим для индукции XBP1 (Lee 2002; Lee 2003). (5) PERK снижает нагрузку, а не расширяет ёмкость (Harding 2000a), хотя поддерживает активацию ATF6 (Teske 2011). (6) Брефельдин A не относится к классическим индукторам: он переносит S1P и S2P в ЭПР (DeBose-Boyd 1999; Citterio 2008). (7) Связь PERK с диабетом 2 типа у человека в прочитанных работах не подтверждена; редкий пример — синдром Волкотта–Раллисона (Delépine 2000). (8) Отозванную статью о BAX/BAK и IRE1α, вышедшую в Science в 2006 г., не использовать. (9) Ингибиторы неидеально избирательны (Rojas-Rivera 2017; Mahameed 2019): эффект считают специфичным после генетического подтверждения. Вопрос 3: поправки к блоку координатора. Не говорите студентам, что электрофил «освобождает NRF2 из комплекса»: в клетках комплекс сохраняется, а подавляется убиквитинирование (Kobayashi 2006; Baird 2013); спор не закрыт (Itoh 2003). Не сводите сенсор к цистеинам IVR: C151 (BTB), C273 и C288 (IVR) и другие остатки играют разные роли и зависят от индуктора (Takaya 2012; Saito 2016), а замены C273A и C288A нарушают саму репрессию (Yamamoto 2008). Не утверждайте, что клинический эффект диметилфумарата при рассеянном склерозе реализуется через NRF2: данные противоречивы (Linker 2011; Schulze-Topphoff 2016; Kornberg 2018). Индукция самого KEAP1 под действием NRF2 описана в одной работе (Lee 2007), K48-убиквитинирование самого KEAP1 после tBHQ — тоже в единичной (Hong 2005); при действии диэтилмалеата количество KEAP1 не менялось (Iso 2016). Накопление p62 не следует описывать как усиление защиты клеткой: это конкуренция с NRF2 за домен Kelch и обратная связь при дефиците аутофагии (Komatsu 2010; Jain 2010). NRF2 защищает от химического канцерогенеза в профилактической постановке, но при активирующих мутациях KEAP1 и NFE2L2 способствует росту опухоли (Ramos-Gomez 2001; Shibata 2008). Бактериальные OxyR и SoxR — аналогия на уровне идеи редокс-сенсора: они сами связывают ДНК, а KEAP1 — адаптер лигазы (Zheng 1998; Gaudu 1996). Временные окна из исходного блока без источников на экране не используются. Вопрос 4: поправки к блоку координатора. (1) Аскорбат не обязателен: субстраты — O₂ и 2-оксоглутарат, кофактор — Fe(II), аскорбат лишь стимулирует реакцию (Flashman 2010; Knowles 2003). (2) Сукцинат и фумарат конкурентно ингибируют PHD (Koivunen 2007) и другие 2-оксоглутарат-зависимые оксигеназы (Xiao 2012); эффект Варбурга — аэробный гликолиз, а не синоним псевдогипоксии. (3) Утверждение «FIH менее чувствительна к гипоксии, чем PHD» верно для умеренной гипоксии (около 1 % O₂); при более глубокой гидроксилирование Asn803 снижается, а различия зависят от клеток (Tian 2011; Koivunen 2004). (4) Родство pVHL с прокариотическими E3-лигазами в прочитанных работах не подтверждено: pVHL — субстрат-узнающая субъединица комплекса CRL2 (Stebbins 1999). (5) Систему HIF находят у животных от Trichoplax до человека; связь с датой «великого окисления» не показана (Loenarz 2011; Mills 2018). (6) Роль АФК в стабилизации HIF остаётся предметом спора (Chandel 2000; Chua 2010). (7) Сроки координатора (потеря активности PHD за 5–30 мин, пик белка через 4–8 ч) первичными данными не подтверждены; измерены период полужизни HIF-1α 5–8 мин (Berra 2001) и гидроксилирование не позже чем через 1 мин после возврата O₂ (Tian 2011). (8) DMOG, дефероксамин и CoCl₂ действуют разными путями (Yuan 2003; Tian 2011). (9) Разрешённые ингибиторы PHD и популяции больных различаются по регионам (FDA 2023; EMA 2021).", "zoom_in": "Увеличить схему", "zoom_out": "Уменьшить схему", "reads_model": "Показания — расчёт учебной модели, а не измерение.", "info_more": "Подробнее: обоснование и источники", "ch_wt": "дикий тип", "ch_gcn2": "GCN2⁻/⁻", "ch_s51a": "eIF2α S51A", "ch_dc": "PPP1R15A-ΔC", "ch_tg": "тапсигаргин", "ch_tm": "туникамицин", "ch_nogsk": "без GSK2606414", "ch_gsk": "с GSK2606414", "ch_nopf": "без PF-429242", "ch_pf": "с PF-429242", "ch_ire1": "IRE1α⁻/⁻", "ch_perk": "PERK⁻/⁻", "ch_fih1": "FIH есть", "ch_fih0": "нокдаун FIH", "s1_ovl": "перекрытие рамок", "s1_cod_start": "старт (AUG)", "s1_cod_stop": "стоп-кодон", "s1_bypass_1": "Тройного комплекса меньше: повторная инициация на основной рамке ATF4", "s1_bypass_2": "Тройного комплекса мало: ограничена инициация и на ATF4", "s1_bypass_m": "Старт uORF2 заменён: повторная инициация на основной рамке", "s1a_h_noi": "Без ISRIB", "s1a_h_isr": "С ISRIB", "s2_dom_perk": "киназа", "s2_dom_ire1": "киназа/РНКаза", "s2_dom_atf6": "N-концевой фрагмент", "lg_u_sens": "два прямоугольника, соединённые стеблем, — сенсор как один трансмембранный белок: верхний (люминальный) домен находится в просвете ЭПР и связывает BiP, нижний домен лежит в цитоплазме и передаёт сигнал; стрелки реакций отходят от нижнего домена", "s2b_h_cap1": "Ёмкость исходная", "s2b_h_cap2": "Ёмкость удвоена", "s4_r_oh564": "Pro564-OH-HIF-1α (количество), относительно нормоксии"};

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');

function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}

function plotLines(cv, series, o){

  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';

  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* справка в два уровня: первое предложение (короткое определение) видно сразу, остальное — по раскрытию (аудит R10).

const POE = { on: false, i: 0, pick: null, shown: false, res: {}, cmp: '' };

/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же

function poePerm(key, i, n, ok){
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;

/* три показателя шага: список ключей подписей в шаге (st.m); без списка — три величины с наибольшим изменением */
function poeCompare(st, before, ref, after){

  if (st.pairs){
    const rows = st.pairs.filter(([, a, b]) => t(a) in after && t(b) in after);
    if (!rows.length) return '';
    return `<div class="cmp cmp2" role="group" aria-label="${t('poe_m_lines')}"><div class="cmp-h"><span>${t('poe_m_lines')}</span><span>${t('poe_m_l1')}</span><span>${t('poe_m_l2')}</span></div>` +
      rows.map(([lab, a, b]) => `<div class="cmp-r"><span class="cmp-n">${t(lab)}</span><span class="mono cmp-now">${after[t(a)]}</span><span class="mono cmp-now">${after[t(b)]}</span></div>`).join('') + `</div>`;
  }

  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;

/* =====================================================================
   Семинар 10. Общие средства для четырёх вопросов (не модель: модель каждого вопроса — в его файле sK.js).
   - GFORM, LEGEND_EXTRA: справочные формулы и дополнительные строки легенды (заполняют сцены);
   - числа и подписи: NB, fPct, fX, fRel, fH;
   - значки на схеме: BADGE (OH, Ub и др.);
   - время: rk4, integrate, Traj (траектория считается при любом изменении входов), clockHTML/clockWire;
   - мелкая арифметика: sig, lerp.
   Правила: 1) состояние на курсоре времени берётся из траектории, а не из «живых» тиков; 2) шаг сценария ставит курсор
   в заданный момент, поэтому разбор не зависит от скорости воспроизведения; 3) подписи величин — из реестра показателей.
   ===================================================================== */
const GFORM = {};            /* справка: ключ карточки -> список ключей структурных формул (formulas.js) */
const LEGEND_EXTRA = [];     /* дополнительные строки легенды: { svg: '<circle .../>', key: 'lg_...' } */
const NB = ' ';         /* неразрывный пробел */
const sig = x => 1 / (1 + Math.exp(-x));
const lerp = (a, b, u) => a + (b - a) * u;

/* ---------- подписи чисел ---------- */
const fPct = x => Math.round(x * 100) + NB + '%';                        /* доля: 0,37 -> «37 %» */
const fX = x => '×' + (x >= 10 ? Math.round(x) : x >= 1 ? fmt(x, 1) : fmt(x, 2));  /* кратность: «×3,2», «×0,35» */
const fRel = (x) => fX(x);                                                /* «относительно исходного» */
const fH = h => h < 1 ? Math.round(h * 60) + NB + 'мин' : (Math.abs(h - Math.round(h)) < .05 ? Math.round(h) : fmt(h, 1)) + NB + 'ч';

/* ---------- значок на схеме: P — фосфорилирование (PB из core.js); OH — гидроксилирование; Ub — убиквитин; X — прочая модификация ---------- */
function BADGE(id, x, y, txt, cls = ''){
  return `<g class="pb fade ${cls}" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="${txt.length > 1 ? 10 : 8.5}"/><text x="${x}" y="${y + .5}">${txt}</text></g>`;
}

/* ---------- полоса показания: имя, значение, метка эталона (серая риска), текст справа. Разметку читает readMetrics (core.js): small = имя, .v = значение ---------- */
const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
/* логарифмическая шкала для кратного роста: x (в разах от исходного) -> 0..1 на промежутке [1/lo, hi] */
const logScale = (x, lo, hi) => clamp((Math.log(Math.max(x, 1e-6)) - Math.log(1 / lo)) / (Math.log(hi) - Math.log(1 / lo)));

/* ---------- интегрирование ---------- */
/* f(t, y) -> dy (массив); y0 — массив; возвращает следующее y */
function rk4(f, t, y, dt){
  const n = y.length, add = (a, b, s) => a.map((v, i) => v + b[i] * s);
  const k1 = f(t, y), k2 = f(t + dt / 2, add(y, k1, dt / 2)), k3 = f(t + dt / 2, add(y, k2, dt / 2)), k4 = f(t + dt, add(y, k3, dt));
  const out = new Array(n); for (let i = 0; i < n; i++) out[i] = y[i] + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
  return out;
}
/* Траектория: y(t) на сетке 0..tEnd с шагом dt; at(t) — линейная интерполяция. Вход f зависит от t (события: добавление, отмывка).
   Состояния клипуются снизу нулём (концентрации не отрицательны). */
class Traj {
  constructor(f, y0, tEnd, dt = .05, sub = 1){
    this.dt = dt; this.tEnd = tEnd; this.ys = [y0.slice()]; let y = y0.slice();
    const n = Math.round(tEnd / dt), h = dt / sub;
    for (let i = 0; i < n; i++){ for (let s = 0; s < sub; s++) y = rk4(f, i * dt + s * h, y, h).map(v => Math.max(0, v)); this.ys.push(y.slice()); }
  }
  at(t){
    const u = clamp(t / this.dt, 0, this.ys.length - 1), i = Math.floor(u), j = Math.min(i + 1, this.ys.length - 1), w = u - i;
    return this.ys[i].map((v, k) => v + (this.ys[j][k] - v) * w);
  }
  series(k){ return this.ys.map((y, i) => [i * this.dt, y[k]]); }
}

/* ---------- часы: движок времени и воспроизведение ---------- */
/* Использование в сцене:  ctrl += clockHTML(P, tMax); … clock = clockWire(P, tMax, speed, onT);  S.tick = dt => clock.tick(dt);
   clock.t — часы от начала опыта; clock.set(t) — поставить курсор (например, в шаге сценария). */
function clockHTML(P, tMax){
  return `<div class="slider clock"><div class="row"><label for="${P}t">${t('clk_t')}</label><output id="${P}tO">0</output></div>` +
    `<input type="range" id="${P}t" min="0" max="${Math.round(tMax * 20)}" value="0"><div class="btns"><button class="btn ghost" id="${P}play" type="button">${t('clk_play')}</button></div></div>`;
}
function clockWire(P, tMax, speed, onT){
  const c = { t: 0, playing: false, set(v){ c.t = clamp(v, 0, tMax); $(P + 't').value = Math.round(c.t * 20); $(P + 'tO').textContent = fH(c.t); onT(c.t); },
              tick(dt){ if (!c.playing) return; const n = c.t + dt * speed; if (n >= tMax){ c.set(tMax); c.stop(); } else c.set(n); },
              stop(){ c.playing = false; $(P + 'play').textContent = t('clk_play'); } };
  $(P + 't').addEventListener('input', () => { c.stop(); c.set(+$(P + 't').value / 20); });
  $(P + 'play').addEventListener('click', () => { if (c.playing){ c.stop(); return; } if (c.t >= tMax) c.set(0); c.playing = true; $(P + 'play').textContent = t('clk_pause'); });
  $(P + 'tO').textContent = fH(0);
  return c;
}

/* =====================================================================

   расширения — только новыми необязательными полями.

      а инициация падает вместе с TC, поэтому зависимость от p-eIF2α колоколообразна (Lu 2004, качественно).
   5. CHOP и GADD34: транскрипция зависит от ATF4 (GADD34 — и от CHOP), трансляция — от TC (обход uORF).

    const out = { t: [], peif2: [], eif2b: [], tl: [], atf4: [], chop: [], gadd34: [], tc: [], atf4e: [], g34act: [] };
    const pack = (t, y) => {

      return { t, peif2: p, eif2b: e, tl: tlOf(x), atf4: mut ? y[2] : y[1], chop: y[4], gadd34: y[6], tc: x, atf4e: y[1], g34act: fb ? PAR.kg34 * Math.max(0, y[6] - 1) : 0 };

     (дефосфорилирование задаёт crep). Быстрый алгебраический расчёт для базового уровня; совпадает с simulate(…, gadd34fb: false) в пределе. */

    o = o || {};
    const crep = cl(fin(o.crep, 1), 0, 4), isrib = cl(fin(o.isrib, 0), 0, 1), s51a = !!o.s51a, mut = !!o.uorf2mut;
    K = cl(fin(K, 0), 0, 2);
    let p = 0;

      let lo = 0, hi = 1;
      for (let i = 0; i < 50; i++){ const m = (lo + hi) / 2, f = PAR.ka * (KB + K) * (1 - m) - PAR.kc * crep * m / (PAR.Km + m); if (f > 0) lo = m; else hi = m; }

  }
  function run(o, tEnd, dt){ return simulate(build(o), tEnd == null ? 24 : tEnd, dt); }

  return { simulate, steady, state, build, run, taper, STIM, INHIB, PARAMS: PAR, binding, eif2bOf, tcOf, tlOf, S4, S4mut, KB, version: 'M1 1.0' };
})();

    }
    for (let i = 0; i < k; i++){                       /* метод Гаусса */

/* =====================================================================
   Вопрос 4. Модель кислород-зависимой деградации HIF-1α (M4). Чистые функции, без DOM.

  const SHARE402 = 0.25, SHARE564 = 0.75;  /* доли PHD-активности по сайтам: Pro402 чувствительнее к гипоксии, PHD2 предпочитает C-концевой сайт (Tian 2011; Hirsilä 2003; Ehrismann 2007) [Д: 1 : 3 по порядку чувствительности Tian 2011 при 0,5 % O₂] */

    $(P + 'arcB').style.opacity = (v.bypassAll || bk === 's1_bypass_1' ? 1 : bk === 's1_bypass_2' ? .45 : .15).toFixed(2);

  /* ---------- пик ATF4 при данной фосфатазе: нужен подписи (за пиком / до пика) ---------- */
  function peakAtf(f){
    let bp = 0, ba = 0, bs = 0;
    for (let s = 0; s <= 1.0001; s += .02){ const r = M1.state(M1.taper(s), { crep: f }); if (r.atf4 > ba){ ba = r.atf4; bp = r.peif2; bs = s; } }
    return { a: ba, p: bp, s: bs };
  }

  /* ===================== 1b: базовый уровень ===================== */

      const bk = { s1_c_lowp: 's1_bypass', s1_c_rest: 's1_bypass', s1_c_mild: 's1_bypass_1', s1_c_mid: 's1_bypass_1', s1_c_high: 's1_bypass_2' }[ck.main] || (r.tl >= .97 && r.atf4 < 1.5 ? 's1_bypass' : 's1_bypass_1');

      { n: 3, ok: 2, pre(){ set(.5, .5); }, apply(){ set(.5, 1); }, m: ['s1_r_p', 's1_r_tl', 's1_r_a'] },
      { n: 3, ok: 0, pre(){ set(.5, .5); }, apply(){ set(1, .5); }, m: ['s1_r_p', 's1_r_tl', 's1_r_a'] },
    ] };
  })();

  /* ===================== 1a: продвинутый уровень ===================== */
  (function(){

    SLIDER_FMT[P + 'dose'] = v => fAct(M1.taper(v));
    const tgl = (id, k) => toggleHTML(P + id, k, false);
    $('ctrl' + K).innerHTML = segHTML(P + 'stim', 's1a_stim', STIMS, 'tg') + sliderHTML(P + 'dose', 's1a_dose', 0) + clockHTML(P, TMAX) +

      segHTML(P + 'geno', 's1a_geno', GENOS, 'wt') +

    $('reads' + K).innerHTML = `<div id="${P}now"></div>` + segHTML(P + 'instr', 's1a_instr', [['graph', 's1a_in_graph'], ['blot', 's1a_in_blot']], 'graph') +
      `<div id="${P}gr"><p class="plotcap">${t('s1a_g_t1')}</p><canvas id="${P}cv1" class="s1-cv" role="img" aria-label="${t('s1a_g_t1')}"></canvas>` +
      `<p class="plotcap">${t('s1a_g_t2')}</p><canvas id="${P}cv2" class="s1-cv" role="img" aria-label="${t('s1a_g_t2')}"></canvas><div class="s1-legend" id="${P}lg"></div><p class="hint">${t('s1a_g_hint')}</p></div>` +
      `<div id="${P}bl" hidden></div>`;
    $('svg' + K).parentElement.insertAdjacentHTML('beforeend', `<div class="s1-myst" id="${P}myst" hidden></div>`);
    $('take' + K).textContent = t('s1a_take');
    const F = dotsInit(K);
    const S = { sim: null, clip: false, myst: 0, shown: false, lanes: [] };
    const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    const inputs = () => ({ stim: segVal(P + 'stim'), dose: sv(P + 'dose'), isrib: $(P + 'isrib').checked, perki: $(P + 'perki').checked, gcn2i: $(P + 'gcn2i').checked, geno: segVal(P + 'geno') });
    const recompute = inp => { S.sim = M1.simulate(M1.build(inp), TMAX, .05); };
    const stressOn = inp => M1.STIM[inp.stim].amp * M1.taper(inp.dose) > .004;

    /* ---------- активность киназ в момент tt (та же формула, что в M1.build) ---------- */
    function kinetics(inp, tt){
      const s = M1.STIM[inp.stim], A = s.amp * M1.taper(inp.dose), kinV = {}, kinX = {};
      KIN.forEach(([id]) => {
        const ko = (id === 'gcn2' && inp.geno === 'gcn2ko') || (id === 'perk' && inp.geno === 'perko'), dr = (id === 'gcn2' && inp.gcn2i) || (id === 'perk' && inp.perki);

    }

    const TICKS = [1, 3, 10, 30, 100];
    function draw(){
      const sim = S.sim, cv1 = $(P + 'cv1'), cv2 = $(P + 'cv2'); if (!sim || !cv1 || $(P + 'gr').hidden) return;
      const tmax = S.clip ? clock.t : TMAX, uo = segVal(P + 'geno') === 'uorf2';
      const pts = (arr, f) => { const o = []; for (let i = 0; i < sim.t.length && sim.t[i] <= tmax + 1e-9; i++) o.push([sim.t[i], f ? f(arr[i]) : arr[i]]); return o; };

      const tk = TICKS.map(lG), lab = v => { const i = tk.findIndex(x => Math.abs(x - v) < 1e-6); return i < 0 ? '' : String(TICKS[i]); };

    }

      if (inp.isrib) a.push(t('s1a_isrib')); if (inp.perki) a.push(t('s1a_perki')); if (inp.gcn2i) a.push(t('s1a_gcn2i'));

        (L.length ? `<ol class="s1-lanes">${L.map(l => `<li>${l.c}</li>`).join('')}</ol>` : `<p class="hint">${t('s1a_b_empty')}</p>`) +
        `<div class="btns"><button class="btn ghost" id="${P}blot_add"${L.length >= 6 ? ' disabled' : ''}>${t('s1a_blot_add')}</button><button class="btn ghost" id="${P}blot_clear"${L.length ? '' : ' disabled'}>${t('s1a_blot_clear')}</button></div><p class="hint">${t('s1a_b_hint')}</p>`;

    /* ---------- загадка: три образца X, Y, Z (тапсигаргин, 4 ч) ---------- */

    /* ---------- подпись ---------- */

      const bs = baseState(inp, r, tt, pmax), parts = [head, t('s1a_c_' + bs, sub)], act = [];
      if (inp.isrib) act.push(['isrib', t('s1a_isrib')]); if (inp.perki) act.push(['perki', t('s1a_perki')]); if (inp.gcn2i) act.push(['gcn2i', t('s1a_gcn2i')]);

    }

    /* ---------- показания, схема, подпись ---------- */
    function render(){

      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s2_how')}</button><button class="btn ghost" id="${P}lim">${t('s2_lim')}</button></div>`;
    $('take' + K).textContent = t('s2b_take');
    const cache = new Map();
    const runOf = (L, cx) => { const k = L.toFixed(3) + '|' + cx.toFixed(3); let r = cache.get(k);
      if (!r){ r = M2.simulate({ load: L, cx }, 24, .1); cache.set(k, r); if (cache.size > 80) cache.delete(cache.keys().next().value); } return r; };
    const BASE = runOf(1, 1);
    let clock = null;
    function update(){
      const L = M2.loadOf(sv(P + 'load')), cx = M2.capOf(sv(P + 'cap')), tt = clock ? clock.t : 6;
      const a = runOf(L, cx).at(tt), b = BASE.at(tt), act = M2.active(a);
      paint(K, a, act);
      $('reads' + K).innerHTML = reads(P, a, b) + `<p class="hint">${t('s2b_ref')}</p>`;
      const c = caption(runOf(L, cx), a, tt, cx); $('cap' + K).textContent = c.cap; $('why' + K).textContent = c.why;
    }
    clock = clockWire(P, 24, 3, () => update());
    wire([P + 'load', P + 'cap'], update);
    const set = (uL, uC, tt) => { setSlider(P + 'load', uL); setSlider(P + 'cap', uC); clock.set(tt); };
    $(P + 'reset').onclick = () => { set(0, .5, 6); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'u_measure'); $(P + 'lim').onclick = () => showInfo(K, 'u_model');
    set(0, .5, 6);
    SCENES[K] = { update, tick: dt => clock.tick(dt), poe: [
      { n: 3, ok: 1, when: 's2b_when_6', pre(){ set(0, .5, 6); }, apply(){ set(.48, .5, 6); }, m: ['s2_r_ratio', 's2_r_free', 's2_r_cap'] },
      { n: 3, ok: 2, hB: 's2b_h_cap1', hA: 's2b_h_cap2', when: 's2b_when_6', pre(){ set(.48, .5, 6); }, apply(){ set(.48, .75, 6); }, m: ['s2_r_xs', 's2_r_free', 's2_r_ratio'] },
      { n: 3, ok: 0, when: 's2b_when_24', pre(){ set(.6, .5, 2); }, apply(){ set(.6, .5, 24); }, m: ['s2_r_cap', 's2_r_ratio', 's2_r_xs'] },
    ] };
  })();

  /* ===================== 2a: продвинутый уровень ===================== */
  (function(){
    const K = '2a', P = 's2a_', TMAX = 48, SPEED = 2.4;      /* ось времени 0…48 ч (учебная модель); воспроизведение — 2,4 ч учебного времени в секунду */
    const lG = x => logScale(x, 3, 100);                    /* шкала ATF4 и CHOP: ×1/3 … ×100 (как на вкладке 1) */
    const lR = x => logScale(x, 1, 16);                     /* график ёмкости и отношения: ×1 … ×16 */
    layout(K);
    $('svg' + K).innerHTML = scheme(K, true);
    const IND = [['none', 's2a_ind_0'], ['tm', 's2a_ind_tm'], ['tg', 's2a_ind_tg'], ['dtt', 's2a_ind_dtt']];
    const GENO = [['wt', 's2a_gt_wt'], ['perk', 's2a_gt_perk'], ['ire1', 's2a_gt_ire1'], ['atf6', 's2a_gt_atf6'], ['xbp1', 's2a_gt_xbp1']];
    const tgl = (id, k) => toggleHTML(P + id, k, false);
    $('ctrl' + K).innerHTML = segHTML(P + 'ind', 's2a_ind', IND, 'none') + segHTML(P + 'dose', 's2a_dose', [['0', 's2a_dose_lo'], ['1', 's2a_dose_hi']], '1') + clockHTML(P, TMAX) +
      `<div class="grp"><span>${t('s2a_drugs')}</span><div class="tgrid">${tgl('tgsk', 's2a_gsk')}${tgl('tu4', 's2a_u4')}${tgl('tpf', 's2a_pf')}</div></div>` +
      segHTML(P + 'geno', 's2a_geno', GENO, 'wt') +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s2_how')}</button><button class="btn ghost" id="${P}lim">${t('s2_lim')}</button><button class="btn ghost" id="${P}hind">${t('s2a_h_ind')}</button><button class="btn ghost" id="${P}hmod">${t('s2a_h_mod')}</button></div>`;
    $('reads' + K).innerHTML = `<div id="${P}now"></div><div class="s2-instr">${segHTML(P + 'instr', 's2a_instr', [['graph', 's2a_in_graph'], ['blot', 's2a_in_blot']], 'graph')}</div>` +
      `<div id="${P}gr"><p class="plotcap">${t('s2a_g_t1')}</p><canvas id="${P}cv1" class="s2-cv" role="img" aria-label="${t('s2a_g_t1')}"></canvas><div id="${P}v1"></div>` +
      `<p class="plotcap">${t('s2a_g_t2')}</p><canvas id="${P}cv2" class="s2-cv" role="img" aria-label="${t('s2a_g_t2')}"></canvas><div id="${P}v2"></div><p class="hint">${t('s2a_g_hint')}</p></div>` +
      `<div id="${P}bl" hidden></div>`;
    $('svg' + K).parentElement.insertAdjacentHTML('beforeend', `<div class="s2-myst" id="${P}myst" hidden></div>`);
    $('take' + K).textContent = t('s2a_take');
    const S = { run: null, lanes: [], myst: 0, shown: false };
    const REFA = M2.baseline({});
    const inputs = () => ({ ind: segVal(P + 'ind'), level: +segVal(P + 'dose'), gsk: $(P + 'tgsk').checked ? 1 : 0, u4: $(P + 'tu4').checked ? 1 : 0, pf: $(P + 'tpf').checked ? 1 : 0, geno: segVal(P + 'geno') });
    const optsOf = i => ({ inducer: i.ind, level: i.level, genotype: i.geno, gsk: i.gsk, u4: i.u4, pf: i.pf });
    const cache = new Map();
    const runOf = o => { const k = JSON.stringify(o); let r = cache.get(k);
      if (!r){ r = M2.simulate(o, TMAX, .1); cache.set(k, r); if (cache.size > 60) cache.delete(cache.keys().next().value); } return r; };
    const modsOf = i => { const m = []; if (i.gsk) m.push('gsk'); if (i.u4) m.push('u4'); if (i.pf) m.push('pf'); if (i.geno !== 'wt') m.push(i.geno); return m; };
    const show = (id, on) => { const e = $(id); if (e) e.style.display = on ? '' : 'none'; };

    /* ---------- схема: надстройка поверх общей раскраски ---------- */
    function paintAdv(inp, a, fl, act){
      show(P + 'dGsk', inp.gsk); show(P + 'dU4', inp.u4); show(P + 'dPf', inp.pf);
      setOp(P + 'xP', inp.geno === 'perk' ? 1 : 0); setOp(P + 'xI', inp.geno === 'ire1' ? 1 : 0); setOp(P + 'xA', inp.geno === 'atf6' ? 1 : 0); setOp(P + 'xX', inp.geno === 'xbp1' ? 1 : 0);
      /* пунктирная рамка стоит у того домена, на который действует воздействие: GSK2606414 — киназный домен PERK (люминальный домен продолжает воспринимать нагрузку), 4μ8C — РНКазный домен IRE1α; при нокауте — у обоих доменов белка */
      setBoxState(P + 'sP', !fl.perkProt ? 'inh' : (act.perk ? 'on' : null)); setBoxState(P + 'kP', !fl.perk ? 'inh' : (act.perk ? 'on' : null)); setBoxState(P + 'eif', !fl.perk ? null : (act.perk ? 'on' : null));
      setBoxState(P + 'sI', !fl.ire1 ? 'inh' : (act.ire1 ? 'on' : null)); setBoxState(P + 'kI', (!fl.ire1 || !fl.rnase) ? 'inh' : (act.ire1 ? 'on' : null)); setBoxState(P + 'sp', !fl.rnase ? 'inh' : (act.ire1 ? 'on' : null));
      setBoxState(P + 'sA', !fl.atf6 ? 'inh' : (act.atf6 ? 'on' : null)); setBoxState(P + 'kA', !fl.atf6 ? 'inh' : (act.atf6 ? 'on' : null)); setBoxState(P + 'gl', (!fl.atf6 || fl.cleave < 1) ? 'inh' : (act.atf6 ? 'on' : null));
      setTxt(P + 'a4', t('s2a_a4', { a: fX(a.atf4), c: fX(a.chop) }));
      const on = inp.ind !== 'none';
      setTxt(P + 'i1', on ? t('s2a_card_i', { n: t('s2a_ind_n_' + inp.ind) }) : t('s2a_card_0'));
      setTxt(P + 'i2', on ? t('s2a_card_d', { d: t('s2a_dn_' + (inp.level ? 'hi' : 'lo')), t: fH(clock.t) }) : '');
      setTxt(P + 'i3', on ? t('s2a_card_m_' + inp.ind) : '');
    }

    /* ---------- показания ---------- */
    function readsHTML(a){
      const dom = a.dom == null ? mm(t('s2a_r_dom'), 0, null, t('s2a_dom_na')) : mm(t('s2a_r_dom'), a.dom, null, fmt(a.dom, 2));
      return `<div class="mgrid">` +
        mm(t('s2_r_ratio'), logN(a.r), logN(REFA.r), nd(a.r)) + mm(t('s2_r_free'), a.free, REFA.free, pc(a.free)) +
        mm(t('s2_r_perk'), a.perk, REFA.perk, pc(a.perk)) + mm(t('s2_r_pe'), a.peif2, REFA.peif2, pc(a.peif2)) +
        mm(t('s2_r_tl'), a.tl, REFA.tl, pc(a.tl)) + mm(t('s2a_r_atf4'), lG(a.atf4), lG(1), fX(a.atf4)) +
        mm(t('s2a_r_chop'), lG(a.chop), lG(1), fX(a.chop)) + mm(t('s2_r_xs'), a.xs, REFA.xs, pc(a.xs)) +
        mm(t('s2a_r_p90'), a.afull, REFA.afull, pc(a.afull)) + mm(t('s2_r_af'), a.afn, REFA.afn, pc(a.afn)) +
        mm(t('s2_r_cap'), logN(a.cap), logN(REFA.cap), fX(a.cap)) + dom + `</div><p class="hint">${t('s2a_ref')}</p>`;
    }

    /* ---------- графики во времени ---------- */
    const lineRow = (cls, color, name, val) => `<tr><td><i class="s2-ln ${cls}" style="border-top-color:var(${color})"></i></td><td>${name}</td><td class="mono">${val}</td></tr>`;
    const tableHTML = (rows, tt) => `<table class="s2-vals"><thead><tr><th scope="col"><span class="sr-only">${t('s2a_g_ls')}</span></th><th scope="col">${t('s2a_g_line')}</th><th scope="col">${t('s2a_g_at', { t: fH(tt) })}</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    function draw(){
      const run = S.run, cv1 = $(P + 'cv1'); if (!run || !cv1 || $(P + 'gr').hidden) return;
      const tt = clock.t, a = run.at(tt), pts = (arr, f) => run.t.map((x, i) => [x, f ? f(arr[i]) : arr[i]]);
      const base = { xmax: TMAX, xstep: 12, xunit: t('s2a_g_u'), cursor: tt };
      plotLines(cv1, [{ data: pts(run.perk), color: '--bad', w: 3 }, { data: pts(run.xs), color: '--cyc', dash: [7, 4], w: 2.8 }, { data: pts(run.afn), color: '--mtor', dash: [2, 4], w: 3.2 }],
        Object.assign({ ymax: 1, yticks: [0, .5, 1], yfmt: v => String(Math.round(v * 100)) }, base));
      const tk = [1, 2, 4, 8, 16], tkp = tk.map(lR), lab = v => { const i = tkp.findIndex(x => Math.abs(x - v) < 1e-6); return i < 0 ? '' : String(tk[i]); };
      plotLines($(P + 'cv2'), [{ data: pts(run.cap, lR), color: '--good', w: 3 }, { data: pts(run.r, lR), color: '--ink', dash: [7, 4], w: 2.8 }],
        Object.assign({ ymax: 1, yticks: tkp, yfmt: lab }, base));
      $(P + 'v1').innerHTML = tableHTML([lineRow('d0', '--bad', t('s2a_ln_perk'), pc(a.perk)), lineRow('d1', '--cyc', t('s2a_ln_xs'), pc(a.xs)), lineRow('d2', '--mtor', t('s2a_ln_af'), pc(a.afn))], tt);
      $(P + 'v2').innerHTML = tableHTML([lineRow('d0', '--good', t('s2a_ln_cap'), fX(a.cap)), lineRow('d1', '--ink', t('s2a_ln_r'), nd(a.r))], tt);
    }

    /* ---------- блот: накопительный, дорожки добавляет студент ---------- */
    const BROWS = () => M2.BLOT_ROWS.map(k => t('s2a_b_' + k));
    const condText = (inp, tt) => {
      const a = [inp.ind === 'none' ? t('s2a_cond_0', { t: fH(tt) }) : t('s2a_cond_i', { i: t('s2a_ind_n_' + inp.ind), d: t('s2a_dn_' + (inp.level ? 'hi' : 'lo')), t: fH(tt) })];
      modsOf(inp).forEach(m => a.push(t('s2a_m_' + m)));
      return a.join('; ');
    };
    const bandsOf = (a, fl) => { const b = M2.blot(a, fl); return M2.BLOT_ROWS.map(k => b[k]); };
    function blotPanel(){
      const box = $(P + 'bl'); if (box.hidden) return;
      const L = S.lanes;
      box.innerHTML = `<p class="plotcap">${t('s2a_b_t')}</p>` + blotHTML(BROWS(), L.map((l, i) => ({ h1: String(i + 1), h2: l.h2, v: l.v }))) +
        (L.length ? `<ol class="s2-lanes" id="${P}blot_key">${L.map(l => `<li>${l.c}</li>`).join('')}</ol>` : `<p class="hint" id="${P}blot_key">${t('s2a_b_empty')}</p>`) +
        `<div class="btns"><button class="btn ghost" id="${P}blot_add"${L.length >= 6 ? ' disabled' : ''}>${t('s2a_blot_add')}</button><button class="btn ghost" id="${P}blot_clear"${L.length ? '' : ' disabled'}>${t('s2a_blot_clear')}</button></div><p class="hint">${t('s2a_b_hint')}</p>`;
      $(P + 'blot_add').onclick = () => { if (S.lanes.length >= 6) return; const inp = inputs(), tt = clock.t, a = S.run.at(tt);
        S.lanes.push({ v: bandsOf(a, S.run.fl), c: condText(inp, tt), h2: inp.ind === 'none' ? '—' : fH(tt) }); blotPanel(); };
      $(P + 'blot_clear').onclick = () => { S.lanes = []; blotPanel(); };
    }

    /* ---------- загадка: три образца X, Y, Z (тапсигаргин, высокая ступень, 6 ч) ---------- */
    const MYST = [['X', 'ire1'], ['Y', 'atf6'], ['Z', 'perk']];
    const MT = 6;
    const mystRun = g => runOf({ inducer: 'tg', level: 1, genotype: g, gsk: 0, u4: 0, pf: 0 });
    function mystHTML(){
      const ctl = runOf({ inducer: 'none', level: 1, genotype: 'wt', gsk: 0, u4: 0, pf: 0 }), wt = mystRun('wt');
      const lanes = [{ h1: 'WT', h2: t('s2a_my_h0'), v: bandsOf(ctl.at(MT), ctl.fl) }, { h1: 'WT', h2: t('s2a_my_h1'), v: bandsOf(wt.at(MT), wt.fl) }]
        .concat(MYST.map(([n, g]) => { const r = mystRun(g); return { h1: n, h2: S.shown ? t('s2a_my_g_' + g) : '', v: bandsOf(r.at(MT), r.fl) }; }));
      const key = [t('s2a_my_k0'), t('s2a_my_k1')].concat(S.shown ? MYST.map(([n, g]) => t('s2a_my_kx', { n, g: t('s2a_gt_' + g) })) : [t('s2a_my_kh')]);
      return `<h4 class="s2-myst-t">${t('s2a_my_t')}</h4><p class="hint">${t('s2a_my_p')}</p>` + blotHTML(BROWS(), lanes) +
        `<ul class="s2-lanes" id="${P}myst_key">${key.map(x => `<li>${x}</li>`).join('')}</ul><p class="hint">${t(S.shown ? 's2a_my_h2' : 's2a_my_h')}</p>`;
    }

    /* ---------- подпись: части выбираются по тем же величинам и порогам, что и показания ---------- */
    function caption2a(inp, run, a, tt){
      const act = M2.active(a), bd = M2.band(a.r), ph = M2.phase(run, tt), any = ph === 'now', fl = run.fl, mods = modsOf(inp);
      const V = { r: nd(a.r), f: pct(a.free), p: pct(a.perk), x: pct(a.xs), a: pct(a.afn), a9: pct(a.afull), pe: pct(a.peif2), tl: pct(a.tl), ci: ruTimes(a.C), t: fH(tt) };
      const items = [];
      if (act.perk) items.push(t('s2_br_perk', V)); if (act.ire1) items.push(t('s2_br_ire1', V)); if (act.atf6) items.push(t('s2_br_atf6', V));
      const parts = [inp.ind === 'none' ? t('s2a_c_head0') : t('s2a_c_head', { i: t('s2a_ind_' + inp.ind), d: t('s2a_dn_' + (inp.level ? 'hi' : 'lo')), t: V.t })];
      parts.push(t('s2_c_' + bd, V));
      parts.push(!any ? t('s2_c_b0', V) : items.length === 3 ? t('s2_c_b3', { list: items.join('; ') }) : t('s2_c_b', { list: items.join('; ') }));
      if (act.perk) parts.push(t('s2_c_perk', V));
      if (a.C >= M2.TH.ci){
        const xOn = fl.rnase && fl.xbp1, aOn = fl.atf6 && fl.cleave > 0;
        parts.push(t('s2a_c_cap', Object.assign({ list: t(xOn && aOn ? 's2a_tg_xa' : xOn ? 's2a_tg_x' : 's2a_tg_a') }, V)));
      }
      let why;
      if (mods.length === 1){ parts.push(t('s2a_f_' + mods[0], V)); why = t('s2a_z_' + mods[0]); }
      else if (mods.length > 1){ parts.push(t('s2a_c_multi', { list: mods.map(m => t('s2a_m_' + m)).join('; ') })); why = t('s2a_c_multi_z'); }
      else {
        let zk = 's2_c_' + bd + '_z';
        if (any && (bd === 'low' || bd === 'base')) zk = 's2_c_tail_z';
        else if (!any && (bd === 'mid' || bd === 'high')) zk = 's2_c_' + ph + '_z';
        why = t(zk, V);
      }
      return { cap: parts.join(' '), why };
    }

    /* ---------- общий вывод на экран ---------- */
    function render(){
      const run = S.run; if (!run) return;
      const inp = inputs(), tt = clock.t, a = run.at(tt), fl = run.fl, act = M2.active(a);
      $(P + 'dose').querySelectorAll('button').forEach(b => { b.disabled = inp.ind === 'none'; });
      paint(K, a, act); paintAdv(inp, a, fl, act);
      const ins = segVal(P + 'instr');
      $(P + 'gr').hidden = ins !== 'graph'; $(P + 'bl').hidden = ins !== 'blot';
      if (S.myst){
        $(P + 'now').innerHTML = `<p class="hint">${t('s2a_my_reads')}</p>`;
        const c = { cap: t(S.shown ? 's2a_c_myst2' : 's2a_c_myst'), why: t(S.shown ? 's2a_c_myst2_z' : 's2a_c_myst_z') };
        $('cap' + K).textContent = c.cap; $('why' + K).textContent = c.why;
      } else {
        $(P + 'now').innerHTML = readsHTML(a);
        const c = caption2a(inp, run, a, tt); $('cap' + K).textContent = c.cap; $('why' + K).textContent = c.why;
      }
      const my = $(P + 'myst'); my.hidden = !S.myst; if (S.myst) my.innerHTML = mystHTML();
      draw(); blotPanel();
    }
    const recompute = () => { S.run = runOf(optsOf(inputs())); };
    function update(){ if (S.myst && !POE.on) { S.myst = 0; S.shown = false; } recompute(); render(); }
    const clock = clockWire(P, TMAX, SPEED, () => render());
    wire([P + 'ind', P + 'dose', P + 'tgsk', P + 'tu4', P + 'tpf', P + 'geno', P + 'instr'], update);
    const DEF = { ind: 'none', level: 1, t: 6, gsk: 0, u4: 0, pf: 0, geno: 'wt', instr: 'graph', myst: 0, shown: 0 };
    const st = o => { const d = Object.assign({}, DEF, o);
      segSet(P + 'ind', d.ind); segSet(P + 'dose', String(d.level)); segSet(P + 'geno', d.geno); segSet(P + 'instr', d.instr);
      ['gsk', 'u4', 'pf'].forEach(k => { $(P + 't' + k).checked = !!d[k]; });
      S.myst = d.myst ? 1 : 0; S.shown = !!d.shown; clock.stop(); recompute(); clock.set(d.t); };
    $(P + 'reset').onclick = () => { S.lanes = []; st({}); };
    $(P + 'how').onclick = () => showInfo(K, 'u_measure'); $(P + 'lim').onclick = () => showInfo(K, 'u_model');
    $(P + 'hind').onclick = () => showInfo(K, 'u_ind'); $(P + 'hmod').onclick = () => showInfo(K, 'u_modif');
    st({});
    const TG = { ind: 'tg', level: 1 };
    SCENES[K] = { update, redraw: draw, tick: dt => {
        clock.tick(dt);
        if (S.myst && !POE.on){ S.myst = 0; S.shown = false; update(); } },
      poe: [
        { n: 3, ok: 2, hB: 'ch_tg', hA: 'ch_tm', when: 's2a_when_2', ctl(){ st({ t: 2 }); }, ctlH: 's2a_ctl0', pre(){ st(Object.assign({ t: 2 }, TG)); }, apply(){ st({ ind: 'tm', level: 1, t: 2 }); }, m: ['s2_r_perk', 's2_r_xs', 's2_r_af'] },

  /* ---------- раскраска схемы по одному вызову M3.view ---------- */
  function paint(K, v, o, adv){
    const P = 's' + K + '_', g = M3.GENOS[o.geno || 'wt'], pr = M3.PARAMS;
    const ind = M3.INDUCERS[o.ind] || M3.INDUCERS.gen, none = !o.ind || o.ind === 'none' || o.dose < .005;
    setTxt(P + 'nrf2V', fX2(v.N));
    setBoxState(P + 'nrf2', v.N >= 1.3 ? 'on' : null);
    const act = v.U, jRel = v.keap1 ? clamp(v.U * v.B / M3.PARAMS.B0) : 0, jInd = clamp(pr.K_IND * v.N / pr.S);
    setBoxState(P + 'kp', !v.keap1 ? 'inh' : (act >= .5 ? 'on' : 'inh'));
    setBoxState(P + 'cul', !v.keap1 ? 'inh' : (act >= .5 ? 'on' : 'inh'));
    setTxt(P + 'kpU', v.keap1 ? t('s3_act', { u: Math.round(v.U * 100) }) : '');
    const mods = [v.mA, v.mB, v.mC], pins = adv ? ['pa', 'pb', 'pc'] : ['pb'];
    pins.forEach((id, i) => {
      const j = adv ? i : 0, present = v.keap1 && (adv ? !!g.mask[j] : true), m = adv ? mods[j] : v.mA;
      $(P + id + '_f').setAttribute('opacity', present ? (0.08 + 0.92 * clamp(m)).toFixed(2) : '0');
      $(P + id + '_c').classList.toggle('absent', !present); $(P + id).style.opacity = v.keap1 ? 1 : .3; });
    if (adv){ setTxt(P + 'pa_t', t(g.mask[0] ? 's3_pin_a' : 's3_pin_a_mut')); setTxt(P + 'pb_t', t(g.mask[1] ? 's3_pin_b' : 's3_pin_b_mut')); setTxt(P + 'pc_t', t('s3_pin_c')); }
    else setTxt(P + 'pb_t', t('s3_pin_1'));
    /* электрофил: подписи, точки, стрелки к сенсорам */
    setTxt(P + 'el_1', adv ? (o.ind === 'h2o2' ? t('s3_oxid') : t('s3_elec')) : t('s3_elec'));
    setTxt(P + 'el_2', adv ? (none ? t('s3_none') : t('s3a_el_' + o.ind)) : (o.dose < .005 ? t('s3_none') : fP(o.dose)));
    setBoxState(P + 'el', v.E > .05 ? 'on' : null);
    const nd = clamp(Math.round(v.E / 3 * 6 + (v.E > .05 ? 1 : 0)), 0, 6); for (let i = 0; i < 6; i++) $(P + 'dot' + i).setAttribute('opacity', i < nd ? '1' : '0');
    (adv ? [0, 1, 2] : [0]).forEach(i => setEdge(P + 'eP' + i, v.keap1 ? clamp(v.E / 1.2) * (adv ? ind.r[i] > .02 && g.mask[i] ? Math.max(.3, ind.r[i]) : 0.05 : 1) : 0));
    /* NRF2: синтез, две ветви деградации, связь с KEAP1 */
    setEdge(P + 'eSyn', adv && o.chx ? .1 : 1);
    setEdge(P + 'eDeg', jRel); setEdge(P + 'eInd', jInd); setEdge(P + 'eNuc', clamp(v.F / 2));
    ['ub0', 'ub1', 'ub2'].forEach((id, i) => setOp(P + id, v.keap1 ? clamp(jRel * 3 - i) : 0));
    const binds = v.keap1 && g.binds && v.sat > 0;
    setEdge(P + 'eLink', binds ? .25 + .75 * clamp(v.sat) : .16);
    setOp(P + 'xLink', v.keap1 && !g.binds ? 1 : 0);
    setOp(P + 'xKp', v.keap1 ? 0 : 1); setOp(P + 'xCul', v.keap1 ? 0 : 1); setOp(P + 'xNrf2', g.nrf2 ? 0 : 1);

    const driven = v.F >= 1.5 * M3.PARAMS.F0;

    /* обратная связь */
    setBoxState(P + 'f1', v.nqo1 >= 1.2 ? 'on' : null); setBoxState(P + 'f2', v.gcl >= 1.2 ? 'on' : null);
    setEdge(P + 'eNq', v.nqo1 >= 1.2 ? 1 : .16); setEdge(P + 'eGc', v.gcl >= 1.2 ? 1 : .16);
    setEdge(P + 'eConj', clamp(v.E / 1.2)); setEdge(P + 'eOut', clamp(v.E / 1.2));
    setBoxState(P + 'conj', v.E > .05 ? 'on' : null); setEdge(P + 'eF1', v.nqo1 >= 1.2 ? 1 : .16);
    setEdge(P + 'eGsh', v.E > .05 ? .7 : .16); setEdge(P + 'eSynG', v.gcl >= 1.2 ? 1 : .16);
    const gt = $(P + 'gsh').querySelector('text'); if (gt) gt.textContent = 'GSH ' + fP(v.gsh);
    setBoxState(P + 'gsh', v.gsh <= M3.TH.gshLow ? 'inh' : (v.gsh >= M3.TH.gshHigh ? 'on' : null));

      setOp(P + 'mgP', o.mg132 ? 1 : 0); setBoxState(P + 'prot', o.mg132 ? 'inh' : 'on');

  /* ---------- показания (общие для обеих сцен) ---------- */
  const REFSAT = M3.REFV.B / M3.PARAMS.KT;

    function update(){

      const c = M3.capState3b(o), vars = { a: fP(v.U), m: fP(v.mA), n: fX2(v.N), q: fX2(v.nqo1), h: fX2(v.hmox1), g: fP(v.gsh), c: fX2(v.gcl), d: fP(o.dose), t: fH(o.t) };
      $('cap' + K).textContent = t('s3b_c_' + c.main, vars) + (c.gsh ? ' ' + t('s3b_g_' + c.gsh, vars) : '');
      $('why' + K).textContent = t('s3b_c_' + c.main + '_z', vars);
    }
    clock = clockWire(P, M3.T_MAX, 1, update);
    wire([P + 'dose'], update);
    const go = o => { setSlider(P + 'dose', o.dose); clock.set(o.t); };
    $(P + 'reset').onclick = () => { clock.stop(); setSlider(P + 'dose', 0); clock.set(0); };
    $(P + 'how').onclick = () => showInfo(K, 'n_measure'); $(P + 'lim').onclick = () => showInfo(K, 'n_model');
    setSlider(P + 'dose', 0); clock.set(0);
    const ST = M3.STEPS['3b'], pre = i => ST[i].pre, app = i => Object.assign({}, ST[i].pre, ST[i].apply);
    SCENES[K] = { update, tick: dt => clock.tick(dt), poe: [
      { n: 3, ok: 0, pre(){ go(pre(0)); }, apply(){ go(app(0)); }, m: ['s3_r_act', 's3_r_mod', 's3_r_nrf2'], when: 's3b_when' },
      { n: 3, ok: 1, pre(){ go(pre(1)); }, apply(){ go(app(1)); }, m: ['s3_r_nrf2', 's3_r_nqo1', 's3_r_hmox1'], when: 's3b_when' },
      { n: 3, ok: 2, pre(){ go(pre(2)); }, apply(){ go(app(2)); }, m: ['s3_r_gsh', 's3_r_nrf2', 's3_r_nqo1'], when: 's3b_when' }
    ] };
  })();
  /* ===================== 3a: продвинутый уровень ===================== */
  (function(){
    const K = '3a', P = 's3a_';

    </g>

    ${XX(P + 'x402', 92, 177, 108, 193)}${XX(P + 'x564', 182, 177, 198, 193)}

  }

  /* ---------- раскраска схемы по состоянию a (readout модели) ---------- */
  function paint(P, a, adv, inp){
    const m = a.m, ph = a.r.kh564 / M4.rates(M4.norm(), M4.ATM, 1, M4.mods(M4.norm())).kh564;
    $(P + 'o2F').setAttribute('width', (150 * clamp(uO2(Math.max(a.o2, O2MIN)))).toFixed(1));
    setTxt(P + 'o2V', fO2(a.o2));
    setBoxState(P + 'phd', ph < .6 || m.nosite ? 'inh' : 'on');
    setBoxState(P + 'vhl', m.u < .5 ? 'inh' : 'on'); missing(P + 'vhl', m.vhl0); setOp(P + 'xVhl', m.vhl0 ? 1 : 0);
    setBoxState(P + 'prot', m.slow < .5 ? 'inh' : 'on');
    setBoxState(P + 'dim', m.arnt0 ? 'inh' : (a.tg > 1.5 ? 'on' : null)); setOp(P + 'xArnt', m.arnt0 ? 1 : 0);
    setBoxState(P + 'hre', a.tg > 1.5 ? 'on' : null); setBoxState(P + 'tg', a.tg > 1.5 ? 'on' : null);
    $(P + 'hif').setAttribute('fill-opacity', (.25 + .75 * logScale(a.hif, 4, 40)).toFixed(2));
    setTxt(P + 'hifV', fX(a.hif)); setTxt(P + 'tgV', fX(a.tg));
    const site = (id, h, absent) => { setOp(P + 'oh' + id, absent ? 0 : h); setOp(P + 'x' + id, absent ? 1 : 0); };
    site('402', a.h402, m.nosite); site('564', a.h564, m.nosite);
    setEdge(P + 'ePhd402', m.nosite ? .1 : clamp(a.r.kh402 / .25 / 8.5 / .98)); setEdge(P + 'ePhd564', m.nosite ? .1 : clamp(a.r.kh564 / .75 / 8.5 / .98));
    setEdge(P + 'eO2', clamp(a.o2 / M4.ATM * 1.2));
    setEdge(P + 'eVhl', m.vhl0 ? 0 : clamp(a.fluxU)); setOp(P + 'ub', m.vhl0 ? 0 : clamp(a.fluxU)); setEdge(P + 'eProt', m.vhl0 ? 0 : clamp(a.fluxU));
    setEdge(P + 'eSlow', clamp((1 - a.fluxU) * m.slow * 1.2 + .1 * m.slow));
    setEdge(P + 'eNuc', .2 + .8 * logScale(a.hif, 4, 40));
    setEdge(P + 'eHre', m.arnt0 ? .1 : clamp((a.tg - 1) / 4)); setEdge(P + 'eTg', m.arnt0 ? .1 : clamp((a.tg - 1) / 4));
    if (adv){
      setBoxState(P + 'fih', m.fih < .3 ? 'inh' : 'on');
      setOp(P + 'oh803', a.h803); setEdge(P + 'eFih', clamp(a.r.kN / 20 * 1.2));
      setBoxState(P + 'p300', a.tg > 1.5 && !m.arnt0 ? 'on' : null); setEdge(P + 'eP300', m.arnt0 ? .1 : clamp(1 - a.h803 + .1));
      setTxt(P + 'drugT', inp.drugT || ''); setTxt(P + 'genoT', inp.genoT || '');
    }
  }

  /* ---------- показания ---------- */
  const rowH = (k, v, ref) => mm(t(LB[k]), v, ref, fPct(v));
  const rowX = (k, v, ref, lo, hi) => mm(t(LB[k]), logScale(v, lo, hi), logScale(ref, lo, hi), fX(v));
  const kd = geno => geno === 'phd2' ? .1 : 1;                      /* нокдаун PHD2 снижает содержание белка PHD2/3 (siRNA); ингибиторы и хелаторы — только активность */
  const sub = (a, o2, tm, geno) => ({ h5: fPct(a.h564), h8: fPct(a.h803), x: fX(a.hif), g: fX(a.tg), p: fX(a.phd * kd(geno)), o: fO2(o2), t: tm == null ? '' : fH(tm) });

  /* ===================== 4b: базовый уровень ===================== */
  (function(){
    const K = '4b', P = 's4b_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, false);
    SLIDER_FMT[P + 'o2'] = v => fO2(o2Of(v));
    $('ctrl' + K).innerHTML = sliderHTML(P + 'o2', 's4_o2_c', 100) +
      segHTML(P + 'pv', 's4_vhl_c', [['wt', 's4_vhl_wt'], ['ko', 's4_vhl_ko']], 'wt') +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s4_how')}</button><button class="btn ghost" id="${P}lim">${t('s4_lim')}</button></div>`;
    $('take' + K).textContent = t('s4b_take');
    const set = (o2, ko) => { setSlider(P + 'o2', uO2(o2)); segSet(P + 'pv', ko ? 'ko' : 'wt'); };
    function update(){
      const o2 = o2Of(sv(P + 'o2')), ko = segVal(P + 'pv') === 'ko';
      const a = M4.steady({ o2, geno: ko ? 'vhl' : '' });
      paint(P, a, false, {});
      $('reads' + K).innerHTML = `<div class="mgrid">${rowH('h564', a.h564, R0.h564)}${rowX('oh564', a.oh564 / R0.oh564, 1, 4, 100)}${rowX('hif', a.hif, 1, 4, 40)}${rowX('tg', a.tgSS, 1, 4, 12)}</div><p class="hint">${t('s4b_ref')}</p>`;
      /* подпись: по значению HIF-1α (границы не пересекаются) и по генотипу */
      const v = sub(a, o2), key = ko ? 's4b_c_vhl' : a.hif < 1.15 ? 's4b_c_norm' : a.hif < 3 ? 's4b_c_mild' : a.hif < 10 ? 's4b_c_hyp' : 's4b_c_sev';
      setCap(K, key, { o: v.o, h: v.h5, x: v.x, g: v.g });
    }
    wire([P + 'o2', P + 'pv'], update);
    $(P + 'reset').onclick = () => { set(21, false); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'h_measure'); $(P + 'lim').onclick = () => showInfo(K, 'h_model');
    set(21, false);
    const M3 = [LB.h564, LB.hif, LB.tg], M3b = [LB.h564, LB.oh564, LB.hif];
    SCENES[K] = { update, poe: [
      { n: 3, ok: 1, pre(){ set(21, false); }, apply(){ set(1, false); }, m: M3 },
      { n: 3, ok: 0, pre(){ set(21, false); }, apply(){ set(21, true); }, m: M3b },
      { n: 3, ok: 2, pre(){ set(21, true); }, apply(){ set(1, true); }, m: M3 },
    ] };
  })();

  /* ===================== 4a: продвинутый уровень ===================== */
  (function(){
    const K = '4a', P = 's4a_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, true);
    SLIDER_FMT[P + 'o2'] = v => fO2(o2Of(v));
    const DRUGS = [['', 's4a_d_none'], ['dmog', 'drug_dmog'], ['dfo', 'drug_dfo'], ['co', 'drug_co'], ['fum', 'drug_fum'], ['suc', 'drug_suc'], ['rox', 'drug_rox'], ['mg', 'drug_mg']];
    const GENOS = [['wt', 's4a_gt_wt'], ['vhl', 's4a_gt_vhl'], ['arnt', 's4a_gt_arnt'], ['phd2', 's4a_gt_phd2'], ['fih0', 's4a_gt_fih0'], ['mut', 's4a_gt_mut']];
    $('ctrl' + K).innerHTML = sliderHTML(P + 'o2', 's4_o2_c', 100) + clockHTML(P, M4.T_END) + toggleHTML(P + 'reox', 's4a_reox', false) +
      segHTML(P + 'drug', 's4a_drug', DRUGS, '') + toggleHTML(P + 'asc', 's4a_asc', false) + segHTML(P + 'geno', 's4a_geno', GENOS, 'wt') +
      `<div class="btns"><button class="btn warn" id="${P}myst">${t('s4a_myst_btn')}</button><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}drg">${t('s4a_drugs_btn')}</button><button class="btn ghost" id="${P}gno">${t('s4a_geno_btn')}</button><button class="btn ghost" id="${P}how">${t('s4_how')}</button><button class="btn ghost" id="${P}lim">${t('s4_lim')}</button></div>`;
    $('reads' + K).innerHTML = `<div id="${P}now"></div>
      <div id="${P}plots"><p class="plotcap" style="margin-top:8px">${t('s4a_plot1_t')}</p><canvas id="${P}cv1" class="s4-plot" role="img" aria-label="${t('s4a_plot1_t')}"></canvas>
        <div class="legend s4-leg"><span><i class="sw line" style="background:var(--on)"></i>${t('s4a_leg_hif')}</span><span><i class="sw line" style="background:var(--cyc)"></i>${t('s4a_leg_phd')}</span><span><i class="sw line" style="background:var(--good)"></i>${t('s4a_leg_tg')}</span></div>
        <p class="plotcap" style="margin-top:8px">${t('s4a_plot2_t')}</p><canvas id="${P}cv2" class="s4-plot" role="img" aria-label="${t('s4a_plot2_t')}"></canvas>
        <div class="legend s4-leg"><span><i class="sw line" style="background:var(--on)"></i>${t('s4a_leg_h564')}</span><span><i class="sw line" style="background:var(--tfeb)"></i>${t('s4a_leg_h803')}</span></div></div>
      <div id="${P}blot" class="s4-bl"><p class="plotcap" style="margin-top:10px" id="${P}blot_t"></p><div id="${P}film"></div>
        <div class="btns" id="${P}blot_btns" style="margin-top:6px"><button class="btn ghost" id="${P}blot_add">${t('s4a_blot_add')}</button><button class="btn ghost" id="${P}blot_clear">${t('s4a_blot_clear')}</button></div>
        <div class="lanekey" id="${P}blot_key"></div><p class="hint" id="${P}blot_hint"></p></div>`;
    $('take' + K).textContent = t('s4a_take');
    $('svg' + K).parentElement.insertAdjacentHTML('beforeend', `<div class="s4-myst" id="${P}myst_ov" hidden></div>`);   /* загадка: блот поверх схемы, виден в сценарии до ответа */

    /* ---------- состояние сцены ---------- */
    const MY = { X: { geno: 'vhl' }, Y: { o2: 1 }, Z: { dmog: 1 } };          /* загадка: скрытые условия образцов (4 ч) */
    const MYN = { X: 'myst_x', Y: 'myst_y', Z: 'myst_z' };
    let myst = 0, lanes = [];                                                   /* myst: 0 нет, 1 образцы X/Y/Z, 2 условия раскрыты */
    let SIM = null, CTL = null, SK = '', CK = '';
    const inputs = () => ({ o2: o2Of(sv(P + 'o2')), reox: $(P + 'reox').checked, drug: segVal(P + 'drug'), asc: $(P + 'asc').checked, geno: segVal(P + 'geno') });
    const toModel = inp => { const o = { o2: inp.o2, reox: inp.reox, geno: inp.geno === 'wt' ? '' : inp.geno, asc: inp.asc ? 1 : 0 };
      if (inp.drug === 'fum' || inp.drug === 'suc') o.met = inp.drug; else if (inp.drug) o[inp.drug] = 1; return o; };
    function sims(inp){
      const mi = toModel(inp), k = JSON.stringify(mi); if (k !== SK){ SIM = M4.simulate(mi); SK = k; }
      const ck = inp.o2 + '/' + inp.reox; if (ck !== CK){ CTL = M4.control({ o2: inp.o2, reox: inp.reox }); CK = ck; }
    }
    const clock = clockWire(P, M4.T_END, 1.5, () => { if (SCENES[K]) update(); });

    /* ---------- блот: условные интенсивности по модели (логарифмическая шкала; насыщение) ---------- */
    const vMod = x => clamp(.1 + .6 * Math.log10(Math.max(x, .05))), vPhd = x => clamp(.4 + .45 * Math.log10(Math.max(x, .05)));
    const bandsOf = (a, geno) => [vMod(a.hif), vMod(a.oh564 / R0.oh564), vMod(a.oh803 / R0.oh803), vPhd(a.phd * kd(geno)), .5];
    const bandWord = v => t('s4a_bd_' + (v < .2 ? 0 : v < .4 ? 1 : v < .65 ? 2 : v < .9 ? 3 : 4));
    const rows = () => [t('s4a_b_hif'), t('s4a_b_oh564'), t('s4a_b_oh803'), t('s4a_b_phd'), t('s4a_b_act')];
    const dnOf = (d, o2) => t('s4a_dn_' + d, { o: fO2(o2) });
    /* воздействия, включённые сейчас (для подписи и заголовка дорожки); возврат O₂ считается, когда курсор прошёл момент возврата */
    function devsOf(inp, tm){
      const d = [];
      if (inp.o2 < M4.ATM - .5) d.push('o2');
      if (inp.reox && inp.o2 < M4.ATM - .5 && tm >= M4.T_REOX) d.push('reox');
      if (inp.drug) d.push(inp.drug);
      if (inp.asc) d.push('asc');
      if (inp.geno !== 'wt') d.push(inp.geno);
      return d;
    }
    const condText = (inp, tm) => { const d = devsOf(inp, tm); return d.length ? d.map(x => dnOf(x, inp.o2)).join(', ') : t('s4a_dn_ref'); };
    const shortOf = (inp, tm) => { const d = devsOf(inp, tm).map(x => t('s4a_sh_' + x, { o: fO2(inp.o2) })); return [d[0] || t('s4a_sh_ref'), d[1] || fH(tm)]; };
    function blotHTMLNow(a, c, inp, tm){
      const L = [{ h1: t('s4a_sh_ctl'), h2: fH(tm), v: bandsOf(c) }, { h1: t('s4a_sh_now'), h2: fH(tm), v: bandsOf(a, inp.geno) }].concat(lanes.map(l => ({ h1: l.h1, h2: l.h2, v: l.v })));
      return blotHTML(rows(), L);
    }
    function mystHTML(){
      const c = M4.control({}).at(T_DEF), L = [{ h1: t('s4a_sh_ctl'), h2: fH(T_DEF), v: bandsOf(c) }];
      const info = [];
      ['X', 'Y', 'Z'].forEach(n => {
        const s = M4.simulate(MY[n]).at(T_DEF), v = bandsOf(s, MY[n].geno ? 'vhl' : 'wt'), inp = { o2: MY[n].o2 == null ? M4.ATM : MY[n].o2, reox: false, drug: MY[n].dmog ? 'dmog' : '', asc: false, geno: MY[n].geno || 'wt' };
        const bands = v.slice(0, 4).map((x, i) => rows()[i] + ' — ' + bandWord(x)).join('; ');
        if (myst === 2){ const sh = shortOf(inp, T_DEF); L.push({ h1: sh[0], h2: '(' + n + ')', v }); info.push(t('s4a_myst_line2', { n, c: condText(inp, T_DEF), b: bands })); }
        else { L.push({ h1: n, h2: fH(T_DEF), v }); info.push(t('s4a_myst_line', { n, b: bands })); }
      });
      return `<h4 class="s4-myst-t">${t('s4a_myst_t')}</h4><p class="hint">${t(myst === 2 ? 's4a_myst_hint2' : 's4a_myst_hint')}</p>${blotHTML(rows(), L)}` +
        `<div class="lanekey" id="${P}myst_key">${info.map(x => `<span>${x}</span>`).join('')}</div>`;
    }

    /* ---------- подпись: механизм по включённым воздействиям; числа — те же, что на полосах ---------- */
    function capKey(inp, tm){
      const d = devsOf(inp, tm), treat = d.some(x => x === 'o2' || x === 'reox' || x === 'asc' || DRUGS.some(r => r[0] === x));
      if (!d.length) return 's4a_c_ref';
      if (treat && tm < .02) return 's4a_c_t0';
      if (d.length === 1) return 's4a_c_' + d[0];
      const pair = 's4a_c_' + d.join('_');
      if (pair === 's4a_c_o2_fih0' || pair === 's4a_c_o2_reox') return pair;
      return 's4a_c_multi';
    }

    /* ---------- графики ---------- */
    const Y1 = x => logScale(x, 4, 40), TICKS1 = [0, Y1(1), Y1(4), Y1(16)], fy1 = v => fX(Math.exp(v * Math.log(160)) / 4);
    function plots(inp, tm){
      const S = SIM, pts = (f, step = .25) => { const r = []; for (let x = 0; x <= M4.T_END + 1e-9; x += step) r.push([x, f(S.at(x))]); return r; };
      const mk = inp.reox && inp.o2 < M4.ATM - .5 ? { marks: [M4.T_REOX], markLabels: [[M4.T_REOX, t('s4a_mark_reox')]] } : {};
      plotLines($(P + 'cv1'), [{ data: pts(a => Y1(a.phd)), color: '--cyc' }, { data: pts(a => Y1(a.tg)), color: '--good' }, { data: pts(a => Y1(a.hif)), color: '--on', w: 3 }],
        Object.assign({ xmax: M4.T_END, xstep: 4, xunit: t('s4a_unit_h'), ymax: 1, yticks: TICKS1, yfmt: fy1, cursor: tm }, mk));
      plotLines($(P + 'cv2'), [{ data: pts(a => a.h803), color: '--tfeb', dash: [6, 4] }, { data: pts(a => a.h564), color: '--on', w: 3 }],
        Object.assign({ xmax: M4.T_END, xstep: 4, xunit: t('s4a_unit_h'), ymax: 1, yticks: [0, .5, 1], yfmt: v => Math.round(v * 100) + NB + '%', cursor: tm }, mk));
    }

    /* ---------- обновление ---------- */
    function update(){
      const inp = inputs(), tm = clock.t;
      sims(inp);
      const a = SIM.at(tm), c = CTL.at(tm);
      inp.drugT = inp.drug ? t(DRUGS.find(r => r[0] === inp.drug)[1]) : '';
      inp.genoT = inp.geno === 'wt' ? '' : t('s4a_gt_' + inp.geno);
      $(P + 'reox').disabled = inp.o2 >= M4.ATM - .5;
      const ov = $(P + 'myst_ov');
      if (myst){
        const nb = M4.simulate({}).at(T_DEF); paint(P, nb, true, { drugT: '', genoT: '' });
        ov.hidden = false; ov.innerHTML = mystHTML();
        $(P + 'now').hidden = false; $(P + 'now').innerHTML = `<p class="hint">${t('s4a_myst_reads')}</p>`; $(P + 'plots').hidden = true; $(P + 'blot').hidden = true;
        $('cap' + K).textContent = t(myst === 2 ? 's4a_c_myst2' : 's4a_c_myst'); $('why' + K).textContent = t(myst === 2 ? 's4a_c_myst2_z' : 's4a_c_myst_z');
        $(P + 'myst').textContent = t(myst === 2 ? 's4a_myst_off' : 's4a_myst_show');
        return;
      }
      ov.hidden = true; $(P + 'blot').hidden = false;
      $(P + 'now').hidden = false; $(P + 'plots').hidden = false;
      paint(P, a, true, inp);
      $(P + 'now').innerHTML = `<div class="mgrid">${rowX('hif', a.hif, c.hif, 4, 40)}${rowH('h564', a.h564, c.h564)}${rowH('h803', a.h803, c.h803)}${rowX('phd', a.phd * kd(inp.geno), c.phd, 4, 8)}${rowX('tg', a.tg, c.tg, 4, 12)}</div>` +
        `<p class="hint">${t('s4a_ref')}</p>`;
      plots(inp, tm);
      $(P + 'blot_t').textContent = t('s4a_blot_t'); $(P + 'film').innerHTML = blotHTMLNow(a, c, inp, tm);
      $(P + 'blot_key').innerHTML = [`<span>${t('s4a_lane_ctl')}</span>`, `<span>${t('s4a_lane_now', { c: condText(inp, tm), t: fH(tm) })}</span>`]
        .concat(lanes.map((l, i) => `<span>${t('s4a_lane_n', { n: i + 3, c: l.cond, t: l.tm })}</span>`)).join('');
      $(P + 'blot_hint').textContent = t('s4a_blot_hint');
      $(P + 'blot_add').disabled = lanes.length >= 4; $(P + 'blot_clear').disabled = !lanes.length;
      $(P + 'myst').textContent = t('s4a_myst_btn');
      const key = capKey(inp, tm), v = sub(a, inp.o2, tm, inp.geno);
      v.list = devsOf(inp, tm).map(x => dnOf(x, inp.o2)).join('; ');
      setCap(K, key, v);
    }
    const IDS = ['o2', 'reox', 'drug', 'asc', 'geno'];
    wire(IDS.map(i => P + i), () => { if (myst) myst = 0; update(); });
    const DEF = { o2: 21, reox: 0, drug: '', asc: 0, geno: 'wt', t: T_DEF, myst: 0 };
    const st = o => { const d = Object.assign({}, DEF, o);
      setSlider(P + 'o2', uO2(d.o2)); $(P + 'reox').checked = !!d.reox; segSet(P + 'drug', d.drug); $(P + 'asc').checked = !!d.asc; segSet(P + 'geno', d.geno);
      myst = d.myst; lanes = []; clock.stop(); clock.set(d.t); };
    $(P + 'reset').onclick = () => { st({}); update(); };
    $(P + 'myst').onclick = () => { myst = myst === 0 ? 1 : myst === 1 ? 2 : 0; update(); };
    $(P + 'blot_add').onclick = () => { if (lanes.length >= 4 || myst) return; const inp = inputs(), tm = clock.t; sims(inp); const sh = shortOf(inp, tm);
      lanes.push({ h1: sh[0], h2: sh[1], v: bandsOf(SIM.at(tm), inp.geno), cond: condText(inp, tm), tm: fH(tm) }); update(); };
    $(P + 'blot_clear').onclick = () => { lanes = []; update(); };
    $(P + 'drg').onclick = () => showInfo(K, 'h_drugs'); $(P + 'gno').onclick = () => showInfo(K, 'h_geno'); $(P + 'how').onclick = () => showInfo(K, 'h_measure'); $(P + 'lim').onclick = () => showInfo(K, 'h_model');
    st({});
    const S = { update, redraw: update, tick: dt => clock.tick(dt) };
    const M5 = {
      c21: [LB.h564, LB.h803, LB.hif], c21b: [LB.hif, LB.h564, LB.tg], f5: [LB.hif, LB.h803, LB.tg], ph: [LB.phd, LB.hif, LB.tg], rx: [LB.h564, LB.hif, LB.phd] };
    S.poe = [
      { n: 3, ok: 0, pre(){ st({}); }, apply(){ st({ drug: 'dmog' }); }, m: M5.c21, ctl(){ st({}); }, ctlH: 's4a_ctl_21', when: 's4a_when_21' },
      { n: 3, ok: 2, pre(){ st({}); }, apply(){ st({ drug: 'co' }); }, m: M5.c21, ctl(){ st({}); }, ctlH: 's4a_ctl_21', when: 's4a_when_21' },
      { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ drug: 'fum' }); }, m: M5.c21, ctl(){ st({}); }, ctlH: 's4a_ctl_21', when: 's4a_when_21' },
      { n: 3, ok: 2, pre(){ st({}); }, apply(){ st({ drug: 'mg' }); }, m: M5.c21b, ctl(){ st({}); }, ctlH: 's4a_ctl_21', when: 's4a_when_21' },
      { n: 3, ok: 0, hB: 'ch_fih1', hA: 'ch_fih0', pre(){ st({ o2: 1, t: 1 }); }, apply(){ st({ o2: 1, geno: 'fih0', t: 1 }); }, m: M5.f5, ctl(){ st({ o2: 1, t: 1 }); }, ctlH: 's4a_ctl_1', when: 's4a_when_f' },
      { n: 3, ok: 1, pre(){ st({ o2: 1, t: 0 }); }, apply(){ st({ o2: 1, t: 24 }); }, m: M5.ph, ctl(){ st({ o2: 21, t: 24 }); }, ctlH: 's4a_ctl_nx', when: 's4a_when_t' },
      { n: 3, ok: 2, pre(){ st({ o2: 1, t: 5 }); }, apply(){ st({ o2: 1, reox: 1, t: 5 }); }, m: M5.rx, ctl(){ st({ o2: 21, t: 5 }); }, ctlH: 's4a_ctl_nx', when: 's4a_when_r' },
      { n: 3, ok: 0, pre(){ st({ myst: 1 }); }, apply(){ st({ myst: 2 }); }, m: [], when: 's4a_when_m' },
    ];
    SCENES[K] = S;
    update();
  })();
})();
