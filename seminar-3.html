  const gsOf = (rs, ctx) => { const ex = P.kex0 + P.kact * rs, hy = ctx ? P.ctxHyd : 1; return ex / (ex + hy); };
  const synth = (G, fsk) => P.vb + P.va * G + (fsk ? P.vfsk : 0);
  const hydr = (P4, rol) => P.kOther + P.k4 * (rol ? 0.01 : 1) * (1 + P.a4 * P4);
  const p4ss = p => P.kp4 * p / (P.kp4 * p + P.kdp4);
  /* стационарный уровень cAMP (в условных единицах) при скорости синтеза v, с обратной связью PKA → PDE4 */
  function cSSraw(v, rol, C0){
    let lo = 0, hi = 1e4;
    for (let i = 0; i < 90; i++){ const c = (lo + hi) / 2, P4 = p4ss(pkaOf(C0 ? c / C0 : c));
      if (v - hydr(P4, rol) * c > 0) lo = c; else hi = c; }

  }

  const G0 = gsOf(P.eps, false), V0 = synth(G0, false);

  const CELLS = { br: ['mlck', 'bk', 'ip3br'], cm: ['cav12', 'pln', 'trop'], ad: ['hsl', 'plin'] };

  const IV = ['0', 'rol', 'grk', 'arr', 'prop', 'fsk', 'ctx'];
  function cfg(iv){
    return { rol: iv === 'rol', grk: iv === 'grk' ? P.kdGrk : 1, arrTot: P.arrTot * (iv === 'arr' ? P.kdArr : 1), prop: iv === 'prop',
             fsk: iv === 'fsk', ctx: iv === 'ctx', iso: iv !== 'fsk' && iv !== 'ctx' };
  }
  const activeR = (s) => s.Rs * (P.eps * (1 - s.occ) + s.occ) + s.Rp * P.phi * s.occ;
  function deriv(cf){
    return (s, t) => {
      const agon = cf.iso && t >= 1 && !(cf.prop && t >= 10) ? 1 : 0;
      const kocc = (cf.prop && t >= 10) ? P.koffProp : P.kon;
      const occ = s.occ, G = gsOf(activeR(s), cf.ctx), v = synth(G, cf.fsk && t >= 1);

      /* связывание β-аррестина: скорость пропорциональна свободному β-аррестину (интернализованные рецепторы пул не занимают) */
      const bind = P.karr * Math.max(0, cf.arrTot - s.Ra) / P.arrTot * s.Rp;
      return {
        occ: kocc * (agon - occ),
        Rs: -P.kgrk * cf.grk * occ * s.Rs + P.kdp * s.Rp + P.krec * s.Ri,
        Rp: P.kgrk * cf.grk * occ * s.Rs - P.kdp * s.Rp - bind + P.karrOff * (1 - occ) * s.Ra,
        Ra: bind - P.karrOff * (1 - occ) * s.Ra - P.kint * s.Ra,
        Ri: P.kint * s.Ra - P.krec * s.Ri,
        P4: P.kp4 * pka * (1 - s.P4) - P.kdp4 * s.P4,
        c: P.kscale * (v / C0 - hydr(s.P4, cf.rol) * s.c),
      };

  }
  /* исходное стационарное состояние без агониста; ролипрам и холерный токсин — предобработка: их исходное состояние тоже стационарное */
  function init(cf){
    const c = cSS(synth(gsOf(P.eps, cf.ctx), false), cf.rol);
    return { occ: 0, Rs: 1, Rp: 0, Ra: 0, Ri: 0, P4: p4ss(pkaOf(c)), c };
  }

    const b = tr[0].pde4 / (cf.rol ? 0.01 : 1);
    tr.forEach(p => { p.pde4rel = p.pde4 / b; });
    return (cache[iv] = tr);
  }
  /* сигнал FRET-сенсора: доля сенсора, связавшего cAMP (полунасыщение при cAMP ×8 — учебный параметр) */
  const KS = 8, sens = c => c / (c + KS);

  const L0 = 0.01, rstar = alpha => alpha * L0 / (1 + alpha * L0);

  const balance = (vs, ks) => vs / ks;
  /* длина диффузии λ = √(D/k): D — мкм²/с, k — с⁻¹; ответ в мкм */
  const lambda = (D, k) => Math.sqrt(D / k);
  return { P, pkaOf, gsOf, basic, CELLS, run, IV, sens, KS, rstar, L0, balance, lambda };
})();

/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   Пара киназа — фосфатаза на одном участке: dp/dt = kк(1 − p) − kф·p; p* = kк/(kк + kф); τ = 1/(kк + kф).
   SERCA2a: скорость закачки ~ [Ca]^n / (K^n + [Ca]^n); нефосфорилированный PLN повышает кажущуюся K
   (учебные величины: K без PLN 0,25 мкМ, сдвиг +0,2 мкМ — порядок данных Mahaney 2000; n = 2). */
const M2 = (() => {
  const CA = 0.3, K0 = 0.25, DK = 0.2, NH = 2;
  const pStar = (kk, kf) => (kk + kf) > 0 ? kk / (kk + kf) : 0;
  const tau = (kk, kf) => 1 / (kk + kf);
  const pAt = (p0, kk, kf, t) => { const ps = pStar(kk, kf); return ps + (p0 - ps) * Math.exp(-t * (kk + kf)); };
  /* u — доля PLN в нефосфорилированной (тормозящей) форме; u = 0, если PLN нет */
  const Kapp = u => K0 + DK * u;
  const hill = (c, K) => Math.pow(c, NH) / (Math.pow(K, NH) + Math.pow(c, NH));
  const uptake = (u, c = CA) => hill(c, Kapp(u)) / hill(c, K0);
  /* модель во времени (вопрос 2п): кардиомиоцит мыши, учебные параметры.
     A — активность PKA (0…1, следует за сигналом β-рецептора с τA = 40 с); kк = (kb + (kmax − kb)·A)·(PKI ? 0,05 : 1);
     kф = 0,01 с⁻¹ (PP1; калиукулин A с 1-й мин снижает её в 10 раз); p — доля PLN, фосфорилированного по Ser16;
     q — суммарное фосфорилирование других мишеней PKA, та же пара ферментов: феноменологическая поправка к скорости спада Ca²⁺
     (это не откачка Ca²⁺ тропонином: тропонин I меняет связывание Ca²⁺ с миофиламентами, а сила и длина клетки не рассчитываются).
     Время полуспада свободного Ca²⁺ в цитозоле: t½ = ln2 / (rS·U + rO + rQ·q), U — скорость закачки SERCA2a (доля от скорости без PLN);
     это не время механического расслабления. Потоки по Ser16: vк = kк(1 − p), vф = kф·p (доли пула в секунду). */
  const P = { kb: 0.0015, kmax: 0.03, kf: 0.01, tauA: 40, tIso: 60, tProp: 480, calyF: 0.1, pkiF: 0.05, rS: 5.63, rO: 0.46, rQ: 1.61, T: 1200 };
  const thalf = (U, q) => 1000 * Math.LN2 / (P.rS * U + P.rO + P.rQ * q);
  function run(c){
    const pki = c.iv === 'pki' ? P.pkiF : 1;
    const kk = A => (P.kb + (P.kmax - P.kb) * A) * pki;
    const kf = t => (c.iv === 'caly' && t >= P.tIso) ? P.kf * P.calyF : P.kf;
    /* исход — стационар покоя данной чашки (PKI добавлен заранее, до 0 мин) */
    let A = 0, p = pStar(kk(0), P.kf), q = p; const out = [];
    for (let t = 0; t <= P.T; t++){
      const pp = c.geno === 'wt' ? p : 0, u = c.geno === 'ko' ? 0 : 1 - pp, U = uptake(u);
      out.push({ t: t / 60, A, kk: kk(A), kf: kf(t), p: c.geno === 'ko' ? null : pp, q, u, U, th: thalf(U, q) });
      const S = (c.iso && t >= P.tIso && !(c.iv === 'prop' && t >= P.tProp)) ? 1 : 0;
      const a1 = A + (S - A) * (1 - Math.exp(-1 / P.tauA));
      const k1 = kk((A + a1) / 2), f1 = kf(t);
      p = pAt(p, k1, f1, 1); q = pAt(q, k1, f1, 1); A = a1;
    }
    return out;
  }
  const at = (tr, m) => tr[Math.max(0, Math.min(tr.length - 1, Math.round(m * 60)))];
  /* стационар при насыщении ферментов (Goldbeter и Koshland 1981): r(1 − p)/(K + 1 − p) = p/(K + p), r = vк,max/vф,max; решение делением отрезка */
  function gk(r, K){
    let lo = 0, hi = 1;
    for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2, f = r * (1 - m) / (K + 1 - m) - m / (K + m); if (f > 0) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  return { CA, K0, DK, NH, P, pStar, tau, pAt, Kapp, hill, uptake, thalf, run, at, gk };
})();

/* =====================================================================
   Вопрос 3. Цикл малой ГТФазы RAS.
   3b — базовый: стационарная модель цикла (GEF, GAP, вариант RAS); доля RAS-GTP,
        время релаксации, зависимость от входа, конкуренция эффекторов.
   3a — продвинутый: захват GDP-формы KRAS G12C ковалентным ингибитором во времени.
   Модель M3 — чистые функции без DOM; копируется в страницу объяснений (между MODEL-START/END).
   ===================================================================== */
/*MODEL-START*/
const M3 = (() => {
  /* --- общие константы цикла (учебные, относительные) --- */
  const PHI = 0.9;          // доля обменов, загружающих GTP (избыток GTP над GDP в цитозоле; Traut 1994)
  const kGEFmax = 1.5;      // активность GEF (SOS1) при 100 % входа (условная, 1/мин)
  const kGAPcell = 1.2;     // GAP-активность клетки в норме (NF1 + p120GAP и др.; условная, 1/мин)
  /* варианты RAS: kex — собственный обмен; kint — собственный гидролиз; g — чувствительность к GAP (норма 1).
     Откалибровано по Hunter 2015 (Mol Cancer Res 13:1325), табл. 1, KRAS in vitro (×10⁻⁵ с⁻¹):
       собственный гидролиз: WT 68, G12C 49, G12V 4,2, Q61L 0,80 → kint = 0,030·(значение/68);
       GAP-стимулированный при 50 мкМ p120GAP (НЕ насыщение): WT 4300, G12C 20, G12V 24, Q61L 12;
       g = (GAP-стимулированный − собственный)/(4300 − 68): G12C ≈ 0 (20 < 49, стимуляции нет),
       G12V ≈ 0,0047, Q61L ≈ 0,0027 (норма g = 1);
       обмен нуклеотидов у всех вариантов практически как у WT (0,002 с⁻¹), кроме G13D → kex одинаков (0,020).
     Главное из табл. 1: G12C сохраняет собственный гидролиз почти как у WT, но GAP его почти не ускоряет;
     высокая базальная доля RAS-GTP у мутантов — следствие потери GAP (и у G12V/Q61L — ещё и медленного гидролиза).
     p120GAP взят в ненасыщающей концентрации; масштаб клеточных констант (kGEF, kGAP) учебный.
     «нет NF1» — та же ГТФаза дикого типа, но GAP-активность клетки снижена вдвое (остаются p120GAP и др.). */
  const VAR = {
    wt:   { kex: 0.020, kint: 0.0300,  g: 1.000 },
    nonf1:{ kex: 0.020, kint: 0.0300,  g: 1.000, gapScale: 0.5 },
    g12c: { kex: 0.020, kint: 0.0216,  g: 0.000 },
    g12v: { kex: 0.020, kint: 0.00185, g: 0.0047 },
    q61l: { kex: 0.020, kint: 0.00035, g: 0.0027 },
  };
  /* стационар цикла при доле активности GEF f (0..1):
     dT/dt = (kGEF·f + kex)·φ·(1−T) − (kint + kGAP·g)·T → T* = A/(A+B), τ = 1/(A+B) */
  function stat(v, f) {
    const V = VAR[v], gap = kGAPcell * (V.gapScale || 1);
    const A = (kGEFmax * f + V.kex) * PHI;
    const B = V.kint + gap * V.g;
    return { T: A / (A + B), tau: 1 / (A + B), A, B, gap };
  }
  /* доля RAS-GTP без сигнала (GEF = 0) и прирост до текущего входа */
  function basal(v) { return stat(v, 0).T; }
  /* эффекторы конкурируют за одну поверхность switch I/II; учебные относительные сродства×доступность */
  const EFF = { raf: 0.55, pi3k: 0.30, ralgds: 0.15 };
  const ENG = 0.8;          // доля активного RAS, занятая эффекторами (учебная)
  function effectors(T) {
    const o = {}; for (const e in EFF) o[e] = T * ENG * EFF[e]; return o;
  }
  /* кривая T*(f) для графика (f = 0..1 → GEF 0..100 %) */
  function curve(v, N = 51) { const a = []; for (let i = 0; i < N; i++) { const f = i / (N - 1); a.push([f * 100, stat(v, f).T]); } return a; }

  /* --- 3a: захват GDP-формы KRAS G12C во времени ---
     D (GDP), T (GTP), B (связан с ингибитором, необратимо); D+T+B = 1 (доля всего KRAS G12C).
     dB/dt = kon·D; dT/dt = kex_eff·D − khyd·T; dD/dt = −kex_eff·D + khyd·T − kon·D.
     khyd — собственный гидролиз G12C (в значительной мере сохранён); у двойного мутанта G12C+Q61L khyd ≈ 0.
     kex_eff — обмен: собственный флор + вклад GEF (EGF повышает, ингибитор EGFR и BI-3406 понижают).
     Калибровка — Lito 2016 (ARS-853, клетки рака лёгкого KRAS G12C, H358): без сигнала захват за 1–2 ч;
     EGF замедляет на часы; ингибиторы EGFR и SOS ускоряют; двойной мутант без гидролиза устойчив.
     khyd для G12C здесь задан ОТДЕЛЬНО от kint в стационарной модели 3б и не выводится из неё: 3б — это
     относительные скорости очищенного белка в пробирке (Hunter 2015), а 3а описывает клеточную кинетику
     захвата, где на эффективную скорость перехода в GDP-форму влияют GEF, GAP, нуклеотиды и локализация;
     поэтому khyd подобран по времени захвата в клетках (Lito 2016), а не по константе гидролиза in vitro.
     v1.1 (аудит 16.10.2026, S13): ИСХОДНОЕ СОСТОЯНИЕ ОДНО для всех условий — стационар клеток без добавок
     (kex = GEFTONE.none). В момент t = 0 одновременно добавляют ингибитор G12C и, если выбрано, EGF /
     ингибитор EGFR / BI-3406: меняется только скорость обмена, доли пересчитываются из общего начала.
     mut = 'other' — клетки без KRAS G12C: ингибитору не с чем связываться, RBD-проба выявляет активную
     форму другой ГТФазы RAS (T = T_OTHER); вмешательства на неё в этой модели не действуют. */
  const KON = 0.04, KHYD = 0.035, KHYD_DEAD = 0.0005, T_OTHER = 0.95;
  const GEFTONE = { none: 0.020, egf: 0.25, egfri: 0.004, bi3406: 0.004 };
  function run3a(mut, interv, tmax = 120, dt = 0.05) {
    const out = []; let next = 0;
    if (mut === 'other') {
      const p = perkOf(T_OTHER);
      for (let t = 0; t <= tmax + 1e-9; t += 2) out.push({ t: Math.round(t), B: 0, T: T_OTHER, Trel: 1, Rabs: T_OTHER, perk: p });
      return { out, T0: T_OTHER };
    }
    const khyd = mut === 'dead' ? KHYD_DEAD : KHYD, kex = GEFTONE[interv];
    let D = khyd / (khyd + GEFTONE.none), T = 1 - D, B = 0; const T0 = T;
    for (let t = 0; t <= tmax + 1e-9; t += dt) {
      if (t >= next - 1e-9) { out.push({ t: Math.round(t), B: B, T: T, Trel: T / T0, Rabs: T, perk: perkOf(T) }); next += 2; }
      const dB = KON * D, dT = kex * D - khyd * T, dD = -kex * D + khyd * T - KON * D;
      D += dD * dt; T += dT * dt; B += dB * dt;
    }
    return { out, T0 };
  }
  /* pERK — насыщающая функция доли активного RAS (качественно, как в семинаре 4) */
  function perkOf(T) { return (T * T) / (0.18 * 0.18 + T * T); }
  function at3a(tr, t) { let b = tr[0]; for (const p of tr) { if (p.t <= t + 1e-9) b = p; else break; } return b; }

  return { PHI, kGEFmax, kGAPcell, VAR, EFF, ENG, stat, basal, effectors, curve, run3a, at3a, perkOf };
})();
/*MODEL-END*/
if (typeof module !== 'undefined') module.exports = M3;

   4b — базовый: равновесная модель. Ползунок [Ca²⁺] в просвете ЭПР, внешний Ca²⁺ 2 мМ / нет (EGTA).

/*MODEL-START*/
/* Учебная модель депо-зависимого входа Ca²⁺. Величины условные, если не названы опыт и условия.
   Параметры калиброваны по названным работам (см. блок преподавателя и ОТЧЁТ_q4.md):
   перераспределение STIM1 — функция Хилла от [Ca²⁺]ЭПР, K½ = 187 мкМ, коэффициент 3,8 (Luik 2008, Jurkat);
   ток CRAC — функция Хилла, K½ = 169 мкМ, коэффициент 4,2 (там же); сродство EF-hand STIM1 к Ca²⁺ Kd ≈ 400 мкМ
   (Stathopulos 2006, диапазон 200–600); из каждой сотни вошедших ионов свободным остаётся около одного
   (буферирование, Clapham 2007); задержка активации STIM1/CRAC — десятки секунд (Wu 2006, Liou 2007);
   модуляция PMCA примерно пятикратная, восстановление τ ≈ 4 мин (Bautista 2002); рефосфорилирование NFAT —
   минуты (Tomida 2003). Калибровка цитозольного ответа — add-back в T-клетках (Zweifach 1993, Hoth 1992, Luik 2008). */
const M4 = (() => {
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const P = {
    E0: 400, Erange: 800, Kd: 400, Ks: 187, ns: 3.8, Kg: 169, ng: 4.2,
    tauS: 30, tauG: 40, Bc: 100, rho: 0.1, Be: 10, Emax: 420, nE: 12, Vs: 0, Kse: 0.15, kL: 0.02,
    Vp: 70, Kp: 0.5, Kmod: 0.45, fmod: 5, tOn: 6, tOff: 240, kIP: 1, tI0: 120, tI1: 180,
    jRest: 0, gBas: 0.12, gCRAC: 158, Kc: 0.3, nc: 3, kN: 1 / 180, csa: 0.03,
    C0: 0.055, tTg: 120, tAdd: 600, T: 1200
  };
  const hS = E => 1 / (1 + Math.pow(Math.max(E, 0) / P.Ks, P.ns));       // доля STIM1 в кластерах (растёт при падении E)
  const hG = E => 1 / (1 + Math.pow(Math.max(E, 0) / P.Kg, P.ng));       // доля открытого тока CRAC
  const efNoCa = E => P.Kd / (P.Kd + Math.max(E, 0));                     // доля STIM1 без Ca²⁺ на EF-hand (1:1)
  const mInf = C => C * C / (P.Kmod * P.Kmod + C * C);                    // модуляция PMCA (Ca²⁺-зависимая)
  const pmca = (C, M) => P.Vp * (1 + P.fmod * M) * Math.pow(C, 3) / (Math.pow(P.Kp, 3) + Math.pow(C, 3));
  const fE = E => Math.max(0, 1 - Math.pow(Math.max(E, 0) / P.Emax, P.nE));          // обратное давление: насос не заполняет депо выше предела
  const serca = (C, E) => P.Vs * C * C / (P.Kse * P.Kse + C * C) * fE(E);
  const cnA = C => Math.pow(C, P.nc) / (Math.pow(P.Kc, P.nc) + Math.pow(C, P.nc));  // активность кальциневрина
  P.Vs = P.kL * (P.E0 - P.C0) / (P.C0 * P.C0 / (P.Kse * P.Kse + P.C0 * P.C0) * fE(P.E0));
  P.jRest = pmca(P.C0, mInf(P.C0));   // постоянный базовый обмен Ca²⁺: уравновешивает PMCA в покое (учебное допущение)

  /* равновесная модель (4b): E — [Ca²⁺] в просвете ЭПР (мкМ), ext — внешний Ca²⁺ есть (1) или нет (0, EGTA) */
  function eq(E, ext){
    const crac = ext ? hG(E) : 0;
    const target = P.jRest + ext * (P.gBas + P.gCRAC * hG(E));
    let lo = 1e-4, hi = 5;
    for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if (pmca(m, mInf(m)) < target) lo = m; else hi = m; }
    const cyt = (lo + hi) / 2;
    return { efNoCa: efNoCa(E), clust: hS(E), crac, cyt, nfat: cnA(cyt) };  // доли (0..1), cyt в мкМ
  }

  /* интегрирование ОДУ методом Рунге–Кутты 4-го порядка */
  function rk4(f, s0, t0, t1, dt, every){
    let s = Object.assign({}, s0), t = t0; const res = []; let k = 0;
    const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
    res.push(Object.assign({ t }, s));
    while (t < t1 - 1e-9){
      const h = Math.min(dt, t1 - t);
      const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
      const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
      s = n; t += h; k++;
      if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
    }
    return res;
  }
  /* протокол 1: среда без Ca²⁺ → тапсигаргин на 2-й мин → 2 мМ Ca²⁺ на 10-й мин.
     протокол 2 (proto: 'ip3'): 2 мМ Ca²⁺ снаружи с начала опыта; на 2-й мин импульс IP₃ длительностью 1 мин
     (выход Ca²⁺ из ЭПР через IP₃-рецептор, поток kIP·(E − C)); tg: true — SERCA заблокирована тапсигаргином с начала импульса.
     Перед опытом состояние доводится до равновесия (Ca²⁺ снаружи есть). Скорость пополнения депо в модели не калибрована
     по эксперименту: учебное значение сохраняет порядок событий (пополнение депо → разборка кластеров → прекращение входа).
     geno: 'wt' | 'nostim' (нет STIM1) | 'r91w' (ORAI1 R91W) | 'd76a' (STIM1 D76A, активен при полном депо)
     drug: '0' | 'la' (блокатор CRAC) | 'csa' (циклоспорин A); tg — тапсигаргин (протокол 1: по умолчанию да; протокол 2: по умолчанию нет) */
  function run(o){
    o = o || {};
    const ip3 = o.proto === 'ip3';
    const geno = o.geno || 'wt', drug = o.drug || '0', tgOn = ip3 ? !!o.tg : o.tg !== false, tgT = ip3 ? P.tI0 : P.tTg;
    const chan = (geno === 'r91w' ? 0.02 : 1) * (drug === 'la' ? 0.02 : 1);   // проводимость открытого канала
    const sens = geno === 'nostim' ? 0 : 1;                                     // STIM1 присутствует?
    const g0 = ip3 ? hG(P.E0) : 0;                                             // в протоколе 2 вычитается остаточная доля при полном депо
    const sTar = E => geno === 'd76a' ? 1 : sens * hS(E);
    const gTar = E => geno === 'd76a' ? 1 : sens * Math.max(0, hG(E) - g0) / (1 - g0);
    const cao = t => (ip3 || t >= P.tAdd) ? 1 : 0;
    const tg = t => tgOn && t >= tgT;
    const pulse = t => (ip3 && t >= P.tI0 && t < P.tI1) ? 1 : 0;
    const f = (s, t) => {
      const C = Math.max(s.C, 1e-6), E = Math.max(s.E, 0);
      const Jl = P.kL * (E - C), Jip = P.kIP * pulse(t) * (E - C), Js = tg(t) ? 0 : serca(C, E);
      const Jin = P.jRest + cao(t) * (P.gBas + P.gCRAC * chan * s.G);
      const Jp = pmca(C, s.M);
      const A = cnA(C) * (drug === 'csa' ? P.csa : 1);
      return { C: (Jl + Jip - Js + Jin - Jp) / P.Bc, E: (Js - Jl - Jip) / (P.rho * P.Be),
        S: (sTar(E) - s.S) / P.tauS, G: (gTar(E) - s.G) / P.tauG,
        M: (mInf(C) - s.M) / (mInf(C) > s.M ? P.tOn : P.tOff),
        N: P.kN * (A * (1 - s.N) - (1 - A) * s.N) };
    };
    const A0 = cnA(P.C0) * (drug === 'csa' ? P.csa : 1);
    const s0 = { C: P.C0, E: P.E0, S: sTar(P.E0), G: gTar(P.E0), M: mInf(P.C0), N: A0 };
    if (!ip3) return rk4(f, s0, 0, P.T, 0.25, 8);
    const pre = rk4(f, s0, -1500, 0, 0.05, 1e9), sb = Object.assign({}, pre[pre.length - 1]); delete sb.t;   // равновесие при 2 мМ Ca²⁺ снаружи
    const tr = rk4(f, sb, 0, P.T, 0.02, 25); tr.Eb = sb.E; return tr;
  }
  function at(tr, tt){
    if (tt <= tr[0].t) return tr[0];
    for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
      const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
      for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
      return r;
    }
    return tr[tr.length - 1];
  }
  return { P, hS, hG, efNoCa, mInf, cnA, pmca, eq, run, at };
})();
/*MODEL-END*/

/* порог для индикаторов и подписей — одинаковый на обеих сценах */
const S4 = { clustHi: 0.5, cracHi: 0.5, cytHi: 0.3, nfatHi: 0.4 };   // доли; cytHi — мкМ

/* ---------- общая схема «ЭПР — контакт — плазматическая мембрана» для 4b и 4a ----------
   Топология STIM1 (замечание V01): одна трансмембранная спираль каждой субъединицы пересекает мембрану ЭПР (линия y = 174);
   EF-hand и SAM (люминальный домен) лежат внутри просвета ЭПР и связывают Ca²⁺ там; цитозольная часть при активации
   распрямляется до Orai1. Ca²⁺ на EF-hand рисуется только внутри просвета. */

  return `<g id="${id}"><rect x="${xc - 3.5}" y="165" width="7" height="19" rx="3" fill="var(--surface-2)" stroke="var(--off-ink)" stroke-width="1.8"/>` +
    `<rect id="${id}L" x="${xc - 9}" y="185" width="18" height="17" rx="6" fill="var(--surface)" stroke="var(--off-ink)" stroke-width="2"/>` +
    `<circle id="${id}C" cx="${xc}" cy="193.5" r="3.8" fill="var(--carn)"/></g>`;
}

}

/* перенос строки в подписи SVG: не длиннее n знаков, шаг строк dy */
function wrapTspans(str, x, n, dy){
  const lines = []; let cur = '';
  str.split(' ').forEach(w => { if (cur && (cur + ' ' + w).length > n){ lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; });
  if (cur) lines.push(cur);
  return lines.map((l, i) => `<tspan x="${x}" dy="${i ? dy : 0}">${l}</tspan>`).join('');
}

/* установить вид схемы по выходам модели (o: {clust, crac, cyt, nfat, erFrac, ef, ext, tg, pump, ip3, pulse, csa, geno}) */
function stimSet(K, o){
  const p = K + '_';
  const clustOn = o.clust > S4.clustHi, cracOn = o.crac > S4.cracHi, nfatNuc = o.nfat > S4.nfatHi, noStim = o.geno === 'nostim';
  // внешний Ca²⁺
  setTxt(p + 'cao', t(o.ext ? 's4_cao_yes' : 's4_cao_no'));
  // заполнение просвета ЭПР (число точек ~ [Ca²⁺]ЭПР)
  const nDot = Math.round(clamp(o.erFrac) * 9);
  const dots = []; for (let i = 0; i < 9; i++){ const col = 3, x = 48 + (i % col) * 44, y = 262 + Math.floor(i / col) * 34;
    dots.push(`<circle cx="${x}" cy="${y}" r="5.5" fill="var(--carn)" opacity="${i < nDot ? 0.85 : 0.07}"/>`); }
  $(p + 'erCa').innerHTML = dots.join('');
  // STIM1: Ca²⁺ на EF-hand — только в просвете ЭПР; сложенный димер ↔ распрямлённый кластер
  setOp(p + 'stimAll', noStim ? 0 : 1);
  setOp(p + 'stimFold', clustOn ? 0.1 : 1); setOp(p + 'stimExt', clustOn ? 1 : 0);
  const bound = o.geno === 'd76a' ? 0 : 1 - clamp(o.ef);
  ['s0', 's1', 'sx0', 'sx1'].forEach(id => { setOp(p + id + 'C', bound > 0 ? 0.12 + 0.88 * bound : 0);
    const r = $(p + id + 'L'); if (r) r.setAttribute('fill', clustOn ? 'var(--on-soft)' : 'var(--surface)'); });
  setTxt(p + 'stimLbl', t(noStim ? 's4a_nostim_lbl' : (clustOn ? 's4_stim_ext' : 's4_stim_fold')));
  // Orai1 и вход
  setBoxState(K + '_orai', cracOn ? 'on' : null);
  setOp(p + 'oraiX', o.geno === 'r91w' ? 1 : 0);
  setEdge(p + 'eIn', cracOn ? 1 : 0.1); setOp(p + 'caIn', cracOn ? 1 : 0);
  // SERCA (подавлена тапсигаргином) и закачка Ca²⁺ в просвет
  setBoxState(K + '_serca', o.tg ? 'inh' : 'on'); setOp(p + 'tgW', o.tg ? 1 : 0);
  setEdge(p + 'eP1', o.tg ? 0.1 : 1); setEdge(p + 'eP2', o.tg ? 0.1 : 1);
  // IP₃-рецептор (протокол «импульс IP₃»)
  setOp(p + 'ip3W', o.ip3 ? 1 : 0); setBoxState(K + '_ip3r', o.pulse ? 'on' : null); setOp(p + 'ip3P', o.pulse ? 1 : 0);
  // кальциневрин и NFAT
  const cnOn = o.cyt > S4.cytHi && !o.csa;
  setBoxState(K + '_cn', cnOn ? 'on' : null); setOp(p + 'csaW', o.csa ? 1 : 0);
  setEdge(p + 'eCaCn', o.cyt > S4.cytHi ? 1 : 0.12);
  setEdge(p + 'eCnN', cnOn ? 1 : 0.12);
  move(p + 'nfatM', 0, nfatNuc ? 150 : 0); setOp(p + 'nfatP', nfatNuc ? 0 : 1);
  setBoxState(K + '_nfat', nfatNuc ? 'on' : null);
  // ядерный NFAT — необходимое, но не достаточное условие: ответ IL2 зависит и от других факторов (замечание S18)
  setBoxState(K + '_il2', null); setEdge(p + 'eNil', nfatNuc ? 1 : 0.1);
  $(p + 'il2hint').innerHTML = wrapTspans(t(nfatNuc ? 's4_il2_on' : 's4_il2_off'), 486, 18, 13);
}

/* показания-метры (общие для обеих сцен) */
function stimReads(K, o){
  return meterRow(t('s4_r_ef'), o.efNoCa, pct(o.efNoCa) + ' %') +
    meterRow(t('s4_r_clust'), o.clust, pct(o.clust) + ' %') +
    meterRow(t('s4_r_crac'), o.crac, pct(o.crac) + ' %') +
    readRow(t('s4_r_cyt'), t('s4_r_cyt_s'), `<span class="v">${Math.round(o.cyt * 1000)} ${t('u_nM')}</span>`) +
    meterRow(t('s4_r_nfat'), o.nfat, pct(o.nfat) + ' %');
}

/* =============================== 4b — базовый =============================== */
(function(){
  const K = '4b';
  layout(K);
  $('svg' + K).innerHTML = stimSVG(K);
  $('ctrl' + K).innerHTML = rangeHTML('s4b_er', 's4_er_sl', 0, 800, 500, 'u_uM', 20) +
    segHTML('s4b_ext', 's4_ext_t', [['1', 's4_ca2'], ['0', 's4_egta']], '1');
  $('take' + K).textContent = t('s4b_take');
  function out(){ const E = rv('s4b_er'), ext = segVal('s4b_ext') === '1' ? 1 : 0, m = M4.eq(E, ext); return Object.assign(m, { E, ext }); }
  function update(){
    const E = rv('s4b_er'), ext = segVal('s4b_ext') === '1' ? 1 : 0, m = M4.eq(E, ext);
    stimSet(K, { clust: m.clust, crac: m.crac, cyt: m.cyt, nfat: m.nfat, erFrac: E / 800, ef: m.efNoCa, ext, tg: false, csa: false, geno: 'wt', ip3: false, pulse: false });
    $('reads' + K).innerHTML = stimReads(K, m);
    // подпись выбирается по тем же выходам, что и индикаторы (после расчёта)
    let k;
    if (!ext){ k = m.clust > S4.clustHi ? 's4b_c_egta_empty' : 's4b_c_egta_full'; }
    else if (m.clust < 0.08) k = 's4b_c_full';                 // депо близко к полному: кластеров единицы процентов
    else if (m.crac <= S4.cracHi) k = 's4b_c_mid';             // частичное опустошение: ток ещё не максимален
    else k = m.nfat > S4.nfatHi ? 's4b_c_low_nfat' : 's4b_c_low';
    setCap(K, k);
  }
  wire(['s4b_ext'], update);
  $('s4b_er').addEventListener('input', update);
  const set = (E, ext) => { setRange('s4b_er', E); segSet('s4b_ext', ext); };
  SCENES[K] = { update, redraw: update, poe: [
    // независимые шаги (каждый pre задаёт всё состояние); верные позиции 0/1/2 чередуются
    { n: 3, ok: 1, pre(){ set(500, '1'); }, apply(){ set(300, '1'); } },  // кластеры при небольшом снижении депо
    { n: 3, ok: 0, pre(){ set(500, '1'); }, apply(){ set(100, '1'); } },  // ток CRAC при сильном опустошении
    { n: 3, ok: 2, pre(){ set(100, '1'); }, apply(){ set(100, '0'); } },    // пустое депо + EGTA: кластеры есть, входа нет
    { n: 3, ok: 0, pre(){ set(100, '1'); }, apply(){ set(100, '0'); } },  // NFAT: нужен продолжающийся вход
    { n: 3, ok: 1, last: true, pre(){ set(260, '1'); }, apply(){ set(200, '1'); } },  // крутизна у порога
  ] };
})();

/* =============================== 4a — продвинутый =============================== */
/* три синхронных малых графика с общей осью времени: у каждого своя шкала и свой знаменатель (замечание V06) */
function plotSmall(cv, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 90;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 42, pr = 10, pt = 8, pb = o.xlab ? 24 : 6, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y / o.ymax)) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    if (o.xlab){ const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); } }
  c.textAlign = 'right';
  o.ticks.forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(String(v), pl - 5, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink'); c.lineWidth = 1;
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '12px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 12));
  c.strokeStyle = cssVar(o.color); c.lineWidth = 2.8; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
  o.data.forEach((q, i) => { const x = X(q[0]), y = Y(q[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}
(function(){
  const K = '4a';
  layout(K);
  const GEN = [['wt', 'gt_wt'], ['nostim', 's4a_nostim'], ['r91w', 's4a_r91w'], ['d76a', 's4a_d76a']];
  const DRUG = [['0', 's4a_iv0'], ['la', 's4_la'], ['csa', 's4_csa_b']];
  const PROTO = [['tg', 's4a_pr_tg'], ['ip3', 's4a_pr_ip3']];
  const SRC = [['1', 's4a_s_on'], ['0', 's4a_s_tg']];
  $('svg' + K).innerHTML = stimSVG(K);
  $('ctrl' + K).innerHTML = segHTML('s4a_pr', 's4a_prt', PROTO, 'tg') +
    `<div id="s4a_gw" style="display:contents">` + segHTML('s4a_g', 's4a_gt', GEN, 'wt') + segHTML('s4a_d', 's4a_ivt', DRUG, '0') + `</div>` +
    `<div id="s4a_sw" style="display:none">` + segHTML('s4a_s', 's4a_st', SRC, '1') + `</div>` +
    rangeHTML('s4a_t', 's4a_tslider', 0, 20, 2, 'u_min', 1);
  $('reads' + K).innerHTML = `<div id="s4a_now" style="display:grid;grid-template-columns:minmax(0,1fr);gap:7px"></div>
    <p class="small plotcap" id="s4a_pcap"></p>
    <p class="small plotcap" id="s4a_pt1" style="margin-top:6px"></p><canvas class="plot" id="s4a_plot1" style="height:84px"></canvas>
    <p class="small plotcap" id="s4a_pt2" style="margin-top:6px"></p><canvas class="plot" id="s4a_plot2" style="height:84px"></canvas>
    <p class="small plotcap" id="s4a_pt3" style="margin-top:6px"></p><canvas class="plot" id="s4a_plot3" style="height:108px"></canvas>`;
  const cache = {};
  function traj(){
    const pr = segVal('s4a_pr'), g = segVal('s4a_g'), d = segVal('s4a_d'), sOn = segVal('s4a_s') === '1';
    const key = pr === 'ip3' ? 'ip3/' + (sOn ? 's' : 't') : g + '/' + d;
    if (!cache[key]) cache[key] = pr === 'ip3' ? M4.run({ proto: 'ip3', tg: !sOn }) : M4.run({ geno: g, drug: d, tg: true });
    return cache[key];
  }
  function update(){
    const pr = segVal('s4a_pr'), ip3 = pr === 'ip3', sOn = segVal('s4a_s') === '1';
    const g = ip3 ? 'wt' : segVal('s4a_g'), d = ip3 ? '0' : segVal('s4a_d');
    $('s4a_gw').style.display = ip3 ? 'none' : 'contents'; $('s4a_sw').style.display = ip3 ? 'contents' : 'none';
    $('take' + K).textContent = t(ip3 ? 's4a_take_ip3' : 's4a_take');
    const tr = traj(), tt = rv('s4a_t') * 60, s = M4.at(tr, tt), Eref = ip3 ? tr.Eb : M4.P.E0;
    const ext = (ip3 || tt >= M4.P.tAdd) ? 1 : 0;
    const tg = ip3 ? (!sOn && tt >= M4.P.tI0) : tt >= M4.P.tTg;
    const pulse = ip3 && tt >= M4.P.tI0 && tt <= M4.P.tI1;   // момент окончания импульса (3-я минута) ещё относится к импульсу
    const o = { clust: s.S, crac: ext ? s.G * (g === 'r91w' ? 0.1 : 1) * (d === 'la' ? 0.1 : 1) : 0,
      cyt: s.C, nfat: s.N, erFrac: s.E / Eref, ef: M4.efNoCa(s.E), ext, tg, ip3, pulse, csa: d === 'csa', geno: g };
    stimSet(K, o);
    $('s4a_now').innerHTML =
      readRow(t('s4_r_cyt'), '', `<span class="v">${Math.round(s.C * 1000)} ${t('u_nM')}</span>`) +
      meterRow(t('s4a_r_er'), clamp(s.E / Eref), Math.round(s.E / Eref * 100) + ' %') +
      meterRow(t('s4_r_clust'), s.S, pct(s.S) + ' %') +
      meterRow(t('s4_r_nfat'), s.N, pct(s.N) + ' %');
    const cond = ip3 ? t('s4a_pr_ip3') + ' · ' + t(sOn ? 's4a_s_on' : 's4a_s_tg') : t(GEN.find(x => x[0] === g)[1]) + ' · ' + t(DRUG.find(x => x[0] === d)[1]);
    setTxt('s4a_pcap', t('s4a_pcap', { c: cond }));
    draw(tr, tt, ip3, sOn, Eref);
    let k;
    const add = tt >= M4.P.tAdd;
    if (ip3){
      if (tt < M4.P.tI0) k = 's4a_c_ip_pre';
      else if (tt <= M4.P.tI1) k = sOn ? 's4a_c_ip_pulse' : 's4a_c_ipt_pulse';
      else if (!sOn) k = 's4a_c_ipt_after';
      else k = s.S > 0.2 ? 's4a_c_ip_refill' : 's4a_c_ip_rest';
    }
    else if (g === 'nostim') k = add ? 's4a_c_nostim_add' : (tg ? 's4a_c_nostim_tg' : 's4a_c_nostim_pre');
    else if (g === 'r91w') k = add ? 's4a_c_r91w_add' : (tg ? 's4a_c_r91w_tg' : 's4a_c_pre');
    else if (g === 'd76a') k = add ? 's4a_c_d76a_add' : (tg ? 's4a_c_d76a_tg' : 's4a_c_d76a_pre');
    else if (d === 'la') k = add ? 's4a_c_la_add' : (tg ? 's4a_c_tg' : 's4a_c_pre');
    else if (d === 'csa') k = add ? 's4a_c_csa_add' : (tg ? 's4a_c_tg' : 's4a_c_pre');
    else if (!tg) k = 's4a_c_pre';
    else if (!add) k = 's4a_c_tg';
    else k = s.N > S4.nfatHi ? 's4a_c_add_nfat' : 's4a_c_add';
    setCap(K, k);
  }
  function draw(tr, tt, ip3, sOn, Eref){
    const c1 = $('s4a_plot1'); if (!c1) return;
    const marks = ip3 ? [M4.P.tI0 / 60, M4.P.tI1 / 60] : [2, 10];
    const lab = ip3 ? [[2, t(sOn ? 's4a_mk_ip3' : 's4a_mk_ip3tg')]] : [[2, t('s4a_mk_tg')], [10, t('s4a_mk_add')]];
    const blind = POE.on && !POE.shown;   // до прогноза показан только пройденный отрезок опыта (замечание P01)
    if (blind) tr = tr.filter(q => q.t <= tt);
    const base = { xmax: 20, xstep: 5, xunit: t('u_min'), cursor: tt / 60, marks };
    setTxt('s4a_pt1', t('s4a_pl_cyt')); setTxt('s4a_pt2', t('s4a_pl_er')); setTxt('s4a_pt3', t('s4a_pl_nfat'));
    plotSmall(c1, Object.assign({ color: '--carn', ymax: 1400, ticks: [0, 500, 1000], data: tr.map(q => [q.t / 60, clamp(q.C * 1000, 0, 1400)]), markLabels: lab }, base));
    plotSmall($('s4a_plot2'), Object.assign({ color: '--mtor', ymax: 110, ticks: [0, 50, 100], data: tr.map(q => [q.t / 60, clamp(q.E / Eref * 100, 0, 110)]) }, base));
    plotSmall($('s4a_plot3'), Object.assign({ color: '--tfeb', ymax: 100, ticks: [0, 50, 100], xlab: true, data: tr.map(q => [q.t / 60, clamp(q.N * 100, 0, 100)]) }, base));
  }
  wire(['s4a_pr', 's4a_g', 's4a_d', 's4a_s'], update);
  $('s4a_t').addEventListener('input', update);
  function st(g, d, m, pr, sv){ segSet('s4a_pr', pr || 'tg'); segSet('s4a_g', g); segSet('s4a_d', d); segSet('s4a_s', sv || '1'); setRange('s4a_t', m); }
  SCENES[K] = { update, redraw: update, leave(){ update(); }, poe: [
    // независимые шаги; каждый pre задаёт протокол, клетки, вмешательство и время
    { n: 3, ok: 0, pre(){ st('nostim', '0', 8); }, apply(){ st('nostim', '0', 15); } },  // нет STIM1: возврат Ca²⁺ почти не поднимает цитозольный Ca
    { n: 3, ok: 2, pre(){ st('r91w', '0', 8); }, apply(){ st('r91w', '0', 15); } },       // R91W: кластеры есть, входа почти нет
    { n: 3, ok: 1, pre(){ st('wt', 'la', 8); }, apply(){ st('wt', 'la', 15); } },         // блокатор CRAC: подавлен подъём при возврате
    { n: 3, ok: 0, pre(){ st('wt', 'csa', 8); }, apply(){ st('wt', 'csa', 15); } },       // циклоспорин A: Ca как в норме, NFAT не в ядре
    { n: 3, ok: 2, pre(){ st('wt', '0', 1); }, apply(){ st('d76a', '0', 1); } },          // D76A: кластеры уже при полном депо (до тапсигаргина)
    { n: 3, ok: 1, pre(){ st('wt', '0', 1); }, apply(){ st('wt', '0', 3); } },            // первый подъём — утечка из ЭПР, не вход снаружи
    { n: 3, ok: 0, pre(){ st('wt', '0', 3, 'ip3', '1'); }, apply(){ st('wt', '0', 6, 'ip3', '1'); } },          // SERCA работает: после импульса депо пополняется, кластеры разбираются
    { n: 3, ok: 1, last: true, pre(){ st('wt', '0', 3, 'ip3', '0'); }, apply(){ st('wt', '0', 8, 'ip3', '0'); } }, // SERCA заблокирована: одна доступность Ca²⁺ снаружи депо не пополняет
  ] };
})();
