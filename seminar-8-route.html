вителен, примерно вдвое. Калибруют сенсор добавлением лактата и пирувата. Ранний вариант реагировал на величину [NADH]·[H⁺]/[NAD⁺]; зависимость от pH у Peredox сильно снижена мутагенезом (Hung и соавт., 2011).","HyPer7 (схема M06) — сенсор H₂O₂, в котором флуоресцентный белок встроен в регуляторный домен белка OxyR (Pak и соавт., 2020). H₂O₂ окисляет цистеины сенсора, и отношение интенсивностей флуоресценции при двух длинах волн возбуждения меняется; восстановление клеточными системами возвращает исходное состояние. При регистрации по этому отношению показание устойчиво к изменению pH; контролем служит вариант C121S, не реагирующий на H₂O₂.","Выводы по показаниям сенсоров ограничены. Peredox описан для цитозоля (в первичных клетках для этого использовали и версию с ядерной локализацией) и не измеряет суммарный пул NAD(H); при направлении в матрикс его сигнал не менялся при метаболических воздействиях. HyPer7 показывает степень окисления сенсора в своём компартменте, то есть баланс между окислением сенсора пероксидом водорода и его восстановлением, а не все АФК и не повреждение. Для каждого сенсора определяют крайние состояния, проверяют насыщение, содержание сенсора в клетках и его локализацию. Поэтому показания двух сенсоров в разных компартментах могут расходиться; это не противоречие, поскольку сенсоры измеряют разные величины."],"trap":["Если HyPer7 в матриксе показывает окисление, то в клетке выросло содержание всех АФК.","HyPer7 отвечает на H₂O₂ в том компартменте, куда направлен сенсор. Среди АФК он практически специфичен к H₂O₂ (на органические гидропероксиды отвечает при высоких концентрациях), не показывает повреждение и не заменяет измерение NADH/NAD⁺."],"conditions":"Схемы упрощены; числа и кривые на них учебные и не являются данными опыта. Устройство и калибровка Peredox даны по работе Hung и соавт. (2011), устройство HyPer7 — по работе Pak и соавт. (2020); обе прочитаны в полном тексте. Версия с ядерной локализацией использована в работе как приближение для цитозоля; при направлении в матрикс сигнал не менялся.","sources":["HUNG","PAK"],"quiz":{"id":"S8-L28","rev":2,"question":"Сигнал матриксного HyPer7 вырос, а цитозольный Peredox почти не изменился. Какой вывод допустим?","options":[{"id":"S8-L28-2","text":"Один из сенсоров работает неверно, поскольку оба отражают одну и ту же величину — NADH/NAD⁺.","correct":false,"feedback":"HyPer7 не является сенсором NADH/NAD⁺: он отвечает на окисление пероксидом водорода."},{"id":"S8-L28-3","text":"В матриксе возросло содержание всех АФК, включая супероксид, а в цитозоле оно не менялось.","correct":false,"feedback":"HyPer7 практически специфичен к H₂O₂, поэтому по его сигналу нельзя судить о содержании всех АФК, включая супероксид."},{"id":"S8-L28-1","text":"Сенсоры отражают разные величины в разных компартментах, поэтому результаты не противоречат друг другу.","correct":true,"feedback":"Первый отражает степень окисления сенсора пероксидом водорода в матриксе, второй — приближённо цитозольное NADH/NAD⁺."}]},"widget":{"kind":"s4_sensors","title":"","s":{"title":"Сенсоры NADH/NAD⁺ и H₂O₂: схема и отклик","status":"Схема принципа · числа и кривые учебные, не данные опыта","kinds_label":"Сенсор","kinds":["Peredox (схема M05): NADH/NAD⁺ в цитозоле","HyPer7 (схема M06): H₂O₂ в выбранном компартменте"],"pe_zone":"цитозоль","pe_rex":"Rex","pe_fp":"T-Sapphire","pe_ref":"mCherry: красный белок для нормировки на количество сенсора","pe_key":"круг — флуоресцентный белок T-Sapphire; прямоугольник — домен Rex","pe_lab_oxd":"связан NAD⁺","pe_lab_red":"связан NADH","pe_dim":"флуоресценция ниже","pe_bright":"флуоресценция выше","pe_sel":"NADH/NAD⁺ в цитозоле (учебные значения)","pe_opts":["0,003","0,01","0,03","0,1","0,3","1"],"pe_early":"Ранний вариант сенсора (чувствителен к pH)","pe_ph":"pH цитозоля","pe_ph_opts":["7,0","7,2","7,4","7,6"],"pe_c1":"Peredox (зависимостью от pH пренебрегаем)","pe_c2":"ранний вариант при выбранном pH","pe_x":"NADH/NAD⁺ (логарифмическая шкала)","pe_y":"Сигнал, % диапазона","pe_chart":"Отклик Peredox на отношение NADH/NAD⁺","pe_m":["Доля сенсора с NADH","Сигнал, % диапазона","Отношение, воспринятое сенсором"],"pe_n":["Отклик зависит от обеих форм: чем выше NADH/NAD⁺ свободных форм, тем больше молекул сенсора связано с NADH. Кривая выходит на плато, где отношение уже не различить. У реального сенсора диапазон чувствительных отношений зависит и от размера пула NAD⁺; модель этим пренебрегает.","У раннего варианта сигнал зависит ещё и от pH, поэтому при сдвиге pH он показывает другое «воспринятое» отношение при том же истинном. Такой вариант требует контроля pH."],"hy_zone":"выбранный компартмент","hy_red":"HyPer7-SH","hy_ox":"HyPer7-S–S","hy_a1":"окисление H₂O₂","hy_a2":"восстановление клеточными системами","hy_h":"H₂O₂ в компартменте, отн. ед.","hy_r":"Восстановление сенсора клеточными системами, отн. ед.","hy_var":"Вариант сенсора","hy_vars":["HyPer7","C121S (контроль)"],"hy_two":"Показать кривую при вдвое более сильном восстановлении","hy_x":"H₂O₂, отн. ед.","hy_y":"Отношение, % диапазона","hy_chart":"Отклик HyPer7 на H₂O₂","hy_c1":"исходное восстановление","hy_c2":"восстановление вдвое сильнее","hy_m":["Доля окисленного сенсора","Отношение, % диапазона","Шкала"],"hy_in":"в диапазоне","hy_sat":"насыщение","hy_n":["Отклик определяется балансом окисления сенсора H₂O₂ и его восстановления клеточными системами; сигнал растёт с содержанием H₂O₂ и выходит на плато.","Вариант C121S не реагирует на H₂O₂: его сигнал не меняется. Изменения, которые наблюдаются и у него, не связаны с H₂O₂ (например, зависят от pH или оптики).","Сенсор насыщен: рост H₂O₂ почти не меняет сигнал. Различить большие содержания H₂O₂ по такому показанию нельзя."],"heads":["Что измеряет","Калибровка и контроли","Локализация","Граница вывода"],"cards":[["Приближённо отношение NADH/NAD⁺ свободных форм в цитозоле: NAD⁺ конкурирует с NADH за Rex, поэтому отклик зависит и от размера пула.","Крайние состояния задают добавлением лактата и пирувата (калибровку проверяют в используемых клетках); зелёный сигнал делят на сигнал mCherry.","Описан для цитозоля. При направлении в матрикс сигнал в этой работе не менялся при метаболических воздействиях, поэтому для матрикса применимость сенсора не показана.","Не суммарный пул NAD(H) и не NADPH/NADP⁺. Сравнение клеток требует контроля уровня сенсора, нормировки на mCherry и pH."],["Степень окисления сенсора H₂O₂ в компартменте, куда он направлен: баланс окисления и восстановления.","Крайние состояния и диапазон определяют отдельно; контроль — вариант C121S, нечувствительный к H₂O₂.","Направляют в цитозоль, матрикс, межмембранное пространство; показание относится только к своему компартменту.","Не все АФК и не повреждение. При высоком H₂O₂ возможно насыщение; устойчивость к pH — при регистрации по отношению двух каналов."]]}}},{"id":"integrated-carbon","number":29,"section":4,"title":"Как одновременно поддерживаются образование лактата и биосинтез","question":null,"questions":[1,2,3,4],"keywords":["образование лактата","биосинтез","пентозофосфатный путь","серин","цитрат","глутамин","ЛДГ","анаплероз","NADPH"],"lead":["Углерод глюкозы одновременно распределяется между лактатом, пентозофосфатным путём, синтезом серина и окислением в митохондриях.","Поэтому выделение лактата не означает, что биосинтез или дыхание остановлены."],"mechanism":["От глюкозо-6-фосфата и 3-фосфоглицерата ответвляются пентозофосфатный путь, образующий NADPH, и синтез серина, а остальной углерод доходит до пирувата.","Пируват восстанавливается до лактата за счёт NADH, который при этом окисляется до NAD⁺, и параллельно поступает в митохондрии.","Цитрат отводится в биосинтез, а промежуточные соединения цикла пополняются глутамином и пируватом."],"paragraphs":["Углерод глюкозы поступает в несколько путей одновременно, и на карте каждый показан своей линией. Глюкозо-6-фосфат может превращаться в ходе гликолиза или входить в окислительную ветвь пентозофосфатного пути, где образуются NADPH и рибозо-5-фосфат; от 3-фосфоглицерата ответвляется синтез серина. На карте обозначены раздельно NADH гликолиза и NADPH пентозофосфатного пути: это разные коферменты. Пируват тоже может превращаться несколькими путями. В реакции лактатдегидрогеназы (ЛДГ) он принимает электроны от NADH и превращается в лактат, а NAD⁺ регенерируется (шаг «Как образование лактата поддерживает гликолиз»). Другая часть пирувата поступает в митохондрии, где пируватдегидрогеназный комплекс (PDH) превращает его в ацетил-CoA, а пируваткарбоксилаза (PC) — в оксалоацетат.","Цикл трикарбоновых кислот служит и путём окисления, и источником предшественников для биосинтеза. Цитрат переносится в цитозоль, где ATP-цитратлиаза (ACLY) образует из него ацетил-CoA. Отток не истощает цикл, потому что его промежуточные соединения пополняются: глутаминаза превращает глутамин в глутамат, из которого образуется α-кетоглутарат (α-КГ). Подавление PDH киназой PDK и вклад PC различаются между клетками, поэтому доли ветвей схема не задаёт. В культивируемых клетках глиобластомы, выделявших в среду значительную часть углерода глюкозы в виде лактата, цикл оставался активным, из него отводились предшественники биосинтеза, а оксалоацетат пополнялся преимущественно глутамином при подавленном карбоксилировании пирувата (DeBerardinis и соавт., 2007); при высокой активности PC соотношение иное.","Выделение лактата показывает, что часть углерода глюкозы превратилась в лактат, но не означает, что остальной углерод глюкозы и углерод других субстратов не используются в биосинтезе. Углерод глутамина может и окисляться до CO₂, и оставаться в предшественниках. Нельзя складывать доли с разной нормировкой, например долю углерода глюкозы, превратившуюся в лактат, и долю цитрата, происходящую из глутамина: это разные величины, а не потоки одной реакции. Одна из моделей объясняет высокую скорость образования лактата тем, что скорость окисления NADH в дыхательной цепи недостаточна для регенерации NAD⁺ (Luengo и соавт., 2021)."],"trap":["Если клетка выделяет много лактата, то весь углерод глюкозы потерян для биосинтеза, а цикл не работает.","Лактат — лишь один из путей превращения пирувата. Углерод глюкозы одновременно идёт в пентозофосфатный путь и к серину, а цикл, пополняемый глутамином, служит и путём окисления, и источником предшественников."],"conditions":"Схема качественная: числа и доли ветвей не заданы, она объединяет механизмы разделов 1–2. Работа цикла при пополнении глутамином показана на культивируемых клетках глиобластомы при подавленном карбоксилировании пирувата (DeBerardinis и соавт., 2007), зависимость от регенерации NAD⁺ — на пролиферирующих клетках (Luengo и соавт., 2021); в других клетках вклад ветвей иной. Реакции пентозофосфатного пути, синтеза серина и цикла приведены по учебникам биохимии.","sources":["LNR2","LUENGO","BAKER","DEBERARDINIS"],"quiz":{"id":"S8-L29","rev":2,"question":"Клетка выделяет много лактата, а цикл пополняется углеродом глутамина. Может ли клетка при этом одновременно окислять пируват в цикле и отводить промежуточные соединения цикла в биосинтез?","options":[{"id":"S8-L29-1","text":"Да: цикл может окислять пируват и одновременно отдавать цитрат и другие промежуточные соединения в биосинтез.","correct":true,"feedback":"Образование лактата не исключает входа пирувата в митохондрии, а глутамин пополняет цикл, поэтому окисление и отток предшественников в биосинтез могут идти одновременно."},{"id":"S8-L29-2","text":"Нет: выделение лактата означает, что пируват в митохондрии не поступает, а цикл окисляет другие субстраты.","correct":false,"feedback":"Выделение лактата показывает, что часть пирувата превратилась в лактат; это не исключает, что другая часть поступает в митохондрии через пируватдегидрогеназный комплекс или пируваткарбоксилазу."},{"id":"S8-L29-3","text":"Да, но углерод глутамина в цикле окисляется до CO₂ и в биосинтетические предшественники не попадает.","correct":false,"feedback":"Углерод глутамина может и окисляться до CO₂, и оставаться в предшественниках, например в цитрате; эти судьбы не исключают друг друга."}]},"widget":{"kind":"net","title":"","s":{"title":"Карта углеродных потоков: четыре механизма","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"c","type":"group","label":"Состояние клетки (учебный сценарий)","opts":["исходное","ускорено поступление глюкозы","подавлена ЛДГ","нет глутамина"]}],"W":640,"H":446,"NW":340,"NH":702,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"подавление активности (регуляция)","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос через мембрану","rx":"путь углерода (химическое превращение)","bind":"перенос электронов коферментом (NADH, NADPH)","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":252,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,326]},{"x":6,"y":266,"w":628,"h":172,"c":"mito","t":"митохондрия","lx":16,"ly":286,"n":[4,338,332,356]}],"mem":[],"nodes":{"glc":{"p":[46,62,78,40],"t":"глюкоза","n":[60,40,84,36],"fs":13,"nn":true},"g6p":{"p":[185,62,100,46],"t":"глюкозо-\n6-фосфат","n":[62,56,100,46],"fs":13},"pyr":{"p":[400,62,92,40],"t":"пируват","n":[62,205,92,40]},"lac":{"p":[560,62,84,40],"t":"лактат","n":[262,205,84,40]},"ppp":{"p":[185,165,104,60],"t":"пентозо-\nфосфатный\nпуть","n":[262,56,104,60],"fs":13},"nadph":{"p":[46,165,76,40],"t":"NADPH","n":[262,150,80,40]},"ser":{"p":[305,165,80,40],"t":"серин","n":[166,125,76,40]},"pdk":{"p":[300,226,64,36],"t":"PDK","n":[172,300,56,36]},"acc":{"p":[66,226,112,46],"t":"ацетил-CoA\nв цитозоле","n":[270,290,116,46],"fs":13},"cit":{"p":[250,312,92,40],"t":"цитрат","n":[270,480,80,40],"fs":13},"acoa":{"p":[400,312,108,40],"t":"ацетил-CoA","n":[150,400,76,46],"fs":13,"tn":"ацетил-\nCoA"},"oaa":{"p":[540,380,120,40],"t":"оксалоацетат","n":[66,480,112,40],"fs":13},"akg":{"p":[270,400,70,36],"t":"α-КГ","n":[270,590,70,36]},"gln":{"p":[58,330,96,36],"t":"глутамин","n":[66,590,96,36]},"glu":{"p":[58,400,96,36],"t":"глутамат","n":[66,664,96,36]}},"edges":{"glc":{"a":"glc","b":"g6p","k":"rx"},"gly":{"a":"g6p","b":"pyr","k":"rx","t":"гликолиз","d":[0,-10],"dn":[36,0],"dash":true},"ldh":{"a":"pyr","b":"lac","k":"rx","t":"ЛДГ","d":[0,-10],"dn":[0,-12]},"ppp":{"a":"g6p","b":"ppp","k":"rx"},"nadph":{"a":"ppp","b":"nadph","k":"bind"},"ser":{"a":[305,62,62,120],"b":"ser","k":"rx","t":"из 3-фосфо-\nглицерата","tn":"","d":[-58,4]},"nadh":{"a":[262,62,62,160],"b":[482,62,165,205],"k":"bind","t":"NADH ⇄ NAD⁺","d":[0,-16],"dn":[36,58],"bend":-96,"bn":-35},"pdh":{"a":"pyr","b":"acoa","k":"rx","t":"PDH","d":[24,0],"dn":[-30,6]},"pc":{"a":"pyr","b":"oaa","k":"rx","t":"PC","d":[24,0],"dn":[-24,0]},"pdk":{"a":"pdk","b":[401,226,104,300],"k":"inh","t":"подавляет","tn":"","d":[-6,-12]},"cs1":{"a":"acoa","b":"cit","k":"rx"},"cs2":{"a":"oaa","b":"cit","k":"rx"},"tca1":{"a":"cit","b":"akg","k":"rx","t":"ЦТК","d":[-24,0],"dn":[26,0]},"tca2":{"a":"akg","b":"oaa","k":"rx","t":"ряд реакций ЦТК","tn":"ЦТК","d":[0,-10],"dn":[26,0],"dash":true},"exp":{"a":"cit","b":"acc","k":"tr","t":"экспорт и ACLY","tn":"экспорт,\nACLY","d":[27,-33],"dn":[-40,30]},"gln":{"a":"gln","b":"glu","k":"rx","t":"GLS","d":[26,0],"dn":[24,0]},"glud":{"a":"glu","b":"akg","k":"rx","t":"GDH или\nаминотрансфераза","d":[0,-24],"dn":[18,30]}},"st":{"0":{"m":[["Образование лактата","идёт"],["Отток цитрата в биосинтез","есть"],["Пополнение цикла","есть"]],"note":"Все ветви идут с исходной скоростью: пируват частично превращается в лактат и частично окисляется, цикл пополняется."},"1":{"n":{"glc":"on","lac":"on","ppp":"on","nadph":"on","ser":"on","acc":"on","gln":"on","glu":"on","akg":"on","pdk":"on","acoa":"low"},"m":[["Образование лактата","ускорено"],["Отток цитрата в биосинтез","есть"],["Пополнение цикла","глутамин"]],"note":"Больше углерода входит в гликолиз, и одновременно активны образование лактата, пентозофосфатный путь и синтез серина. PDH частично подавлена киназой PDK (степень зависит от клеток). Цикл не остановлен: он пополняется глутамином, и цитрат отводится в биосинтез."},"2":{"n":{"lac":"abs","pyr":"on","acoa":"on"},"e":{"ldh":"off","nadh":"off"},"m":[["Образование лактата","нет"],["Окисление NADH","через митохондрии"],["Гликолиз","зависит от дыхания"]],"note":"При отсутствии активности ЛДГ лактат не образуется, и цитозольный NADH окисляется в значительной мере за счёт челночных систем (передачи его электронов в митохондрии) и других NAD⁺-зависимых реакций. При недостаточности этих путей NAD⁺ ограничивает гликолиз."},"3":{"n":{"gln":"abs","glu":"low","akg":"low"},"e":{"gln":"off","glud":"off"},"m":[["Образование лактата","идёт"],["Пополнение цикла","без глутамина"],["Отток цитрата","зависит от других входов"]],"note":"Без глутамина исчезает один источник пополнения. Отток цитрата в биосинтез может продолжаться, если цикл пополняется другими источниками пополнения, например карбоксилированием пирувата; при недостатке входов промежуточные соединения цикла истощаются."}},"static":["Карта объединяет четыре механизма: углерод глюкозы идёт к лактату (ЛДГ, NADH → NAD⁺), в пентозофосфатный путь (NADPH), к серину и в митохондрии (PDH, PC); цикл трикарбоновых кислот пополняется глутамином (GLS образует глутамат, из которого затем образуется α-КГ), цитрат экспортируется для образования ацетил-CoA. Состояния: исходное, ускоренное поступление глюкозы, подавленная ЛДГ, отсутствие глутамина."]}}},{"id":"integrated-chromatin","number":30,"section":4,"title":"Почему метаболиты и модификации хроматина восстанавливаются с разной скоростью","question":null,"questions":[1,2,3,4],"keywords":["R-2-HG","мутантная IDH","содержание метаболита","оборот метки","метилирование гистонов","ацетилирование гистонов","α-КГ-зависимые деметилазы","разбавление при делении","фенотип клетки"],"lead":["После подавления мутантной IDH содержание R-2-HG, содержание модификаций хроматина и фенотип клетки могут изменяться в разное время.","Это разные звенья цепи с собственными скоростями обновления; полный возврат к прежнему состоянию не гарантирован."],"mechanism":["Мутантная IDH образует R-2-HG; после её подавления содержание R-2-HG убывает за счёт расходования и выхода из клетки.","Содержание метки на гистоне или ДНК меняется по мере сдвига баланса скоростей её внесения, удаления и разбавления новым материалом.","Фенотип клетки зависит ещё от экспрессии генов, содержания белков и РНК, поэтому может меняться в другое время, чем метка."],"paragraphs":["Ожидаемая цепь событий, которую проверяют в каждой системе, такова: снижается активность фермента, затем скорость образования R-2-HG, затем содержание R-2-HG в клетке, затем скорость реакций, которые тормозит R-2-HG, и лишь затем количество модификации. R-2-HG — метаболит, а не ковалентная модификация гистона. На схеме эти звенья показаны отдельными кривыми: активность фермента меняется ступенчато в момент вмешательства, а остальные величины постепенно приближаются к новому стационарному значению.","Содержание метаболита уменьшается, когда образование прекращается, а расходование и выход из клетки продолжаются. Вместе с ним ослабевает торможение α-КГ-зависимых диоксигеназ, к которым относятся деметилазы гистонов и белки TET. Для сукцината и фумарата такое торможение показано на деметилазах гистонов и ДНК (Xiao и соавт., 2012), а R-2-HG тормозит ряд α-КГ-зависимых ферментов (Losman и соавт., 2013). Эффект R-2-HG не сводится к одному ферменту: R-2-HG слабее, чем S-2-HG, подавляет TET2, но воспроизводит блок дифференцировки в использованных моделях.","Содержание накопленной метки убывает, когда её удаляют ферменты или когда она разбавляется при обновлении, например при синтезе новых гистонов в ходе деления. Скорость удаления и обновления различается у разных меток. В клетках HEK293 ацетилирование гистонов обновляется в целом медленнее, чем фосфорилирование, но быстрее, чем метилирование; скорость зависит от гистона, остатка и соседних модификаций (Evertts и соавт., 2013). В клетках TF-1 с IDH2 R140Q обработка ингибитором мутантного фермента AGI-6780 снижала гиперметилирование гистонов уже через 7 дней, а число участков ДНК со сниженным метилированием возрастало при продлении обработки с 7 до 28 дней (Kernytsky и соавт., 2015).","Фенотип определяется не только меткой, но и накопленными белками и РНК, у которых тоже есть оборот, поэтому порядок «метаболит, метка, фенотип» не универсален. В клетках TF-1, обработанных проникающим в клетку эфиром R-2-HG, после его удаления способность к дифференцировке возвращалась быстро, а время возврата зависимости от цитокинов определялось дозой и длительностью воздействия; метки в этой работе не измеряли, и авторы допускают, что они динамичнее, чем считалось, либо что фенотип связан с другими функциями ферментов (Losman и соавт., 2013). Содержание метаболита или метки не равно скорости образования: один и тот же пул возможен при разных потоках."],"trap":["Если содержание R-2-HG уже снизилось, а метка ещё не вернулась, то R-2-HG не влияет на метку.","Содержание метаболита и содержание метки определяются разными процессами: расходом метаболита, с одной стороны, и удалением или разбавлением накопленной модификации — с другой. Различие во времени не опровергает связь."],"conditions":"Кривые построены в условных единицах времени и не соответствуют ни одному опыту: порядок «метаболит, метка, фенотип» — гипотеза, проверяемая измерением в каждой системе, а не закон. В клетках TF-1 с IDH2 R140Q ингибитор AGI-6780 снижал гиперметилирование гистонов через 7 дней, а гиперметилирование ДНК уменьшалось постепенно: число участков со сниженным метилированием возрастало от 7 к 28 дням (Kernytsky и соавт., 2015; полный текст); для других меток, сайтов и клеток сроки иные.","sources":["LOSMAN","XIAO","EVERTTS","KERNYTSKY"],"quiz":{"id":"S8-L30","rev":3,"question":"После подавления неоморфной активности IDH избыток R-2-HG устранился раньше, чем убыл избыток модификаций. Противоречит ли это метаболической регуляции хроматина?","options":[{"id":"S8-L30-2","text":"Да: если R-2-HG влиял на метку, она должна была вернуться к исходному уровню вместе со снижением R-2-HG.","correct":false,"feedback":"Метаболит убывает за счёт расходования и выхода из клетки, а метка — за счёт удаления и разбавления; скорости этих процессов различны, поэтому одновременного возврата ожидать нельзя."},{"id":"S8-L30-3","text":"Да: если метка не вернулась к исходному уровню, то R-2-HG не влиял на её содержание в этой системе.","correct":false,"feedback":"Запаздывание метки не отменяет влияния R-2-HG: накопленная метка сохраняется и после снижения метаболита, пока её не удалят ферменты или не разбавит новый материал."},{"id":"S8-L30-1","text":"Нет: после снижения R-2-HG избыток метки убывает по мере её удаления и разбавления, на что нужно время.","correct":true,"feedback":"Расход метаболита и удаление накопленной метки — разные процессы со своими скоростями, поэтому запаздывание метки не противоречит регуляции."}]},"widget":{"kind":"s5dyn","title":"","s":{"title":"Разное время изменения звеньев после подавления мутантной IDH","status":"Учебная модель · условные единицы времени, не данные опыта","mark_label":"Метка на хроматине","mark_opts":["обновляется быстрее","обновляется медленнее"],"inh_label":"Подавление мутантной IDH","inh_opts":["полное: остаточная активность 0","частичное: остаточная активность 0,4"],"par":{"rho":[0,0.4],"kP":1.5,"kE":[0.5,0.1],"kF":0.25,"T":24},"x_label":"время после подавления, усл. ед.","y_label":"доля исходного избытка (в контроле — 0)","y_label_n":"доля избытка (в контроле — 0)","event":"подавление IDH","chain_label":"Причинный порядок:","chain":["Мутантная\nIDH","Избыток\nR-2-HG","Избыток\nметки","Отклонение\nфенотипа"],"names":{"act":"активность мутантной IDH","pool":"избыток R-2-HG относительно контроля","mark":"избыток выбранной метки относительно контроля","func":"отклонение выбранного признака клетки от контроля"},"half_mark":"кружок — половина итогового изменения","m_half":["R-2-HG: половина изменения","Метка: половина изменения","Фенотип: половина изменения"],"u_t":"усл. ед.","fixed":"Модель линейна: время до половины изменения задают константы звеньев, а степень подавления сдвигает только итоговое значение. В этой учебной модели остаточная активность IDH задаёт остаточную долю избытка R-2-HG и отклонений двух последующих величин; такая пропорциональность не является общим биологическим законом. Порядок звеньев в модели задан; в реальных системах фенотип может измениться раньше метки. Константы выбраны для иллюстрации и не относятся к конкретной метке, сайту или клетке.","notes":{"0-0":"Мутантная IDH подавлена полностью. Избыток R-2-HG убывает первым, избыток метки — позже, а отклонение фенотипа клетки — позже метки; все три приближаются к уровню контроля. Быстро обновляемая метка приближается к нему раньше медленной, но всё равно позже R-2-HG.","1-0":"Метка обновляется медленнее: избыток R-2-HG уже почти устранён, а избыток метки ещё велик. Это не противоречит связи метаболита и метки: между ними есть процессы с собственным временем.","0-1":"Подавление частичное: остаточная активность фермента сохраняет часть избытка R-2-HG, и избыток метки и отклонение фенотипа приближаются к той же остаточной доле, а не к уровню контроля. Порядок звеньев в модели тот же.","1-1":"Подавление частичное, а метка обновляется медленно: остаточная доля избытка выше, чем при полном подавлении, и позже всего к ней приближается отклонение фенотипа клетки."},"static":["Схема: четыре кривые после подавления мутантной IDH в условных единицах времени; по оси — доля исходного избытка (до подавления 1, как в контроле 0). Активность фермента снижается ступенчато в момент вмешательства; избыток R-2-HG, избыток метки на хроматине и отклонение фенотипа клетки от контроля убывают последовательно и с разной скоростью. Переключатели: быстрее или медленнее обновляется метка; полное или частичное подавление (остаточная активность 0 или 0,4). Кружки отмечают половину итогового изменения. Кривые учебные."]}}},{"id":"integrated-redox","number":31,"section":4,"title":"Как изменение углеродного потока связано с редокс-адаптацией","question":null,"questions":[1,2,3,4],"keywords":["PKM2","пентозофосфатный путь","NADPH","тиоредоксин","глутатион","H₂O₂","редокс-адаптация","C358S","пируваткиназа"],"lead":["Окислительная ветвь пентозофосфатного пути образует NADPH, за счёт которого восстанавливаются тиоредоксиновая и глутатионовая системы, поддерживающие пероксидазы, удаляющие H₂O₂.","В клетках A549 окисление PKM2 снижает её активность, а при действии диамида усиливается поток глюкозы в эту ветвь; механизм не универсален."],"mechanism":["Окислительная ветвь пентозофосфатного пути превращает глюкозо-6-фосфат с образованием NADPH.","NADPH служит донором электронов для восстановления тиоредоксина и глутатиона, которые поддерживают пероксидазы, удаляющие H₂O₂.","В клетках A549 окисление Cys358 снижало активность PKM2, а при действии диамида накапливался глюкозо-6-фосфат и усиливался поток в окислительную ветвь."],"paragraphs":["Окислительная ветвь пентозофосфатного пути превращает глюкозо-6-фосфат в рибулозо-5-фосфат; на каждую молекулу субстрата образуются две молекулы NADPH. Через тиоредоксинредуктазу и глутатионредуктазу электроны NADPH восстанавливают тиоредоксин (Trx) и глутатион (GSH): Trx восстанавливает пероксиредоксины, а GSH служит донором электронов для глутатионпероксидаз, удаляющих H₂O₂ (шаг «Как NADPH поддерживает восстановление антиоксидантных систем»; Sies и соавт., 2024). Углеродный обмен связан с этими системами через NADPH, а не через NADH.","Один из механизмов перераспределения потока описали Anastasiou и соавт. (2011) на клетках рака лёгкого человека A549. Пируваткиназа M2 (PKM2) переносит фосфорильную группу с фосфоенолпирувата на ADP. H₂O₂ (1 мМ), диамид (250 мкМ) и гипоксия (1 % O₂ в газовой смеси, а не измеренная концентрация кислорода в клетке) снижали активность PKM2; замена Cys358 на серин (C358S) устраняла окисление этого остатка, и активность варианта была менее чувствительна к окислителю. Усиление потока в окислительную ветвь и рост содержания глюкозо-6-фосфата в 2,3 раза за 30 мин показаны для диамида; активатор PKM2 препятствовал и снижению активности, и этому усилению потока.","В клетках с вариантом C358S было ниже содержание восстановленного глутатиона и выше чувствительность к диамиду; при концентрации глюкозы в среде 5,6 мМ, но не 25 мМ, такие клетки росли медленнее. Для тиоредоксиновой системы измерений в работе нет, и на схеме она показана по механизму. Данные получены на одной клеточной линии и не позволяют судить о других клетках: поток через пентозофосфатный путь определяется всей сетью, включая поступление глюкозы, активность других ферментов и расход NADPH в биосинтезе.","Устойчивость к повреждению и сохранение физиологического редокс-сигнала не равнозначны. В физиологических концентрациях H₂O₂ служит сигнальной молекулой, а при избытке повреждает биомолекулы; избыток восстановительных эквивалентов (редуктивный дистресс) тоже может нарушать функции клетки (Sies и соавт., 2024). Поэтому большее содержание NADPH само по себе не означает лучшей адаптации."],"trap":["PKM2 сама образует NADPH, поэтому её активность поддерживает антиоксидантные системы.","PKM2 переносит фосфорильную группу с фосфоенолпирувата на ADP, а NADPH образуется в окислительной ветви пентозофосфатного пути. Окисление PKM2 снижает её активность, и больше глюкозо-6-фосфата может входить в эту ветвь."],"conditions":"Схема качественная, числа не заданы. Снижение активности PKM2 в клетках A549 вызывали H₂O₂ (1 мМ), диамид (250 мкМ) и гипоксия (1 % O₂); окисление Cys358 непосредственно показано для диамида и гипоксии, а усиление потока в окислительную ветвь и рост глюкозо-6-фосфата — только для диамида (Anastasiou и соавт., 2011); у варианта C358S измеряли глутатион, чувствительность к окислителю и рост, но не поток. Тиоредоксиновая система и связь NADPH с Trx и GSH показаны по механизму (Sies и соавт., 2024); универсальность механизма не показана.","sources":["ANASTASIOU","SIES"],"quiz":{"id":"S8-L31","rev":2,"question":"В клетках A549 при действии диамида окисление PKM2 снижало её активность, а поток глюкозы в пентозофосфатный путь усиливался. Какое звено связывает усиление этого потока с удалением H₂O₂?","options":[{"id":"S8-L31-2","text":"Образование NADPH самой PKM2 при её окислении: оно снабжает электронами глутатион и тиоредоксин.","correct":false,"feedback":"PKM2 переносит фосфорильную группу с фосфоенолпирувата на ADP и NADPH не образует; NADPH образуется в окислительной ветви пентозофосфатного пути."},{"id":"S8-L31-3","text":"Образование NADH в гликолизе: им напрямую восстанавливаются пероксидазы, удаляющие H₂O₂.","correct":false,"feedback":"Глутатионредуктаза и тиоредоксинредуктаза используют NADPH, а не NADH; NADH гликолиза окисляется в других реакциях."},{"id":"S8-L31-1","text":"Образование NADPH в окислительной ветви: этот кофермент передаёт электроны глутатиону и тиоредоксину.","correct":true,"feedback":"Электроны NADPH через глутатионредуктазу и тиоредоксинредуктазу восстанавливают глутатион и тиоредоксин, а те поддерживают пероксидазы, удаляющие H₂O₂. В этом опыте измеряли глутатион, но не тиоредоксин."}]},"widget":{"kind":"net","title":"","s":{"title":"NADPH и окислительное ограничение PKM2","status":"Схема механизма · клетки A549, качественные состояния","ctrls":[{"id":"p","type":"group","label":"Белок PKM2","opts":["дикий тип (Cys358)","вариант C358S"]},{"id":"o","type":"group","label":"Окислительное воздействие","opts":["нет","есть"]}],"W":640,"H":340,"NW":340,"NH":650,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"подавление активности (окисление)","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"перенос электронов: NADPH → Trx, GSH → пероксидазы → H₂O₂","seq":"следствие замедления реакции","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":328,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,640]}],"mem":[],"nodes":{"g6p":{"p":[62,64,100,46],"t":"глюкозо-\n6-фосфат","n":[62,56,100,46],"fs":13},"ppp":{"p":[240,64,128,50],"t":"окислительная\nветвь ПФП","n":[252,56,128,50],"fs":13},"nadph":{"p":[400,64,80,40],"t":"NADPH","n":[252,150,80,40]},"trx":{"p":[538,64,100,40],"t":"Trx, GSH","n":[252,235,100,40]},"h2o2":{"p":[538,160,76,40],"t":"H₂O₂","n":[252,322,76,40]},"pep":{"p":[60,262,108,46],"t":"фосфоенол-\nпируват","n":[252,440,108,46],"fs":13},"pkm2":{"p":[240,262,112,50],"t":"PKM2\nCys358","n":[70,515,112,50]},"pyr":{"p":[410,262,92,40],"t":"пируват","n":[70,600,92,40]}},"edges":{"a":{"a":"g6p","b":"ppp","k":"rx"},"b":{"a":"ppp","b":"nadph","k":"bind"},"c":{"a":"nadph","b":"trx","k":"bind"},"d":{"a":"trx","b":"h2o2","k":"bind"},"e":{"a":"pep","b":"pkm2","k":"rx"},"f":{"a":"pkm2","b":"pyr","k":"rx"},"ox":{"a":"h2o2","b":"pkm2","k":"inh","t":"окисление Cys358","d":[-8,-26],"dn":[40,-4]},"acc":{"a":"pkm2","b":"g6p","k":"seq","t":"накопление\nвыше по пути","d":[-52,0],"dn":[0,0],"bn":190,"dash":true}},"st":{"0-0":{"n":{"pkm2":"on","h2o2":"low"},"e":{"ox":"off","acc":"off"},"m":[["Активность PKM2","исходная"],["Поток в окислительную ветвь ПФП","исходный"],["Глутатион","исходное содержание"]],"note":"Без окислительного воздействия Cys358 не окислен, PKM2 активна, и поток глюкозо-6-фосфата в окислительную ветвь не усилен."},"0-1":{"n":{"pkm2":"low","h2o2":"on","g6p":"on","ppp":"on","nadph":"on","trx":"on"},"m":[["Активность PKM2","снижена"],["Поток в окислительную ветвь ПФП","усилен (диамид)"],["Trx и GSH","восстанавливаются (по механизму)"]],"note":"Окисление Cys358 снижает активность PKM2. Для диамида в клетках A549 показано, что глюкозо-6-фосфат накапливается и усиливается поток в окислительную ветвь. То, что NADPH поддерживает восстановление Trx и GSH и удаление H₂O₂, следует из механизма и в этом опыте не измерялось."},"1-0":{"n":{"pkm2":"on","h2o2":"low","trx":"low"},"e":{"ox":"off","acc":"off"},"t":{"pkm2":"PKM2\nC358S"},"m":[["Активность PKM2","исходная"],["Поток в окислительную ветвь ПФП","исходный"],["Глутатион","ниже (в опыте)"]],"note":"Вариант C358S не окисляется по этому остатку. В клетках с ним было ниже содержание восстановленного глутатиона; для тиоредоксиновой системы схема показывает изменение, ожидаемое по механизму, а не измеренное."},"1-1":{"n":{"pkm2":"on","h2o2":"on","trx":"low"},"e":{"ox":"off","acc":"off"},"t":{"pkm2":"PKM2\nC358S"},"m":[["Активность PKM2","не снижена"],["Поток в окислительную ветвь ПФП","не усилен (по механизму)"],["Глутатион","ниже (в опыте)"]],"note":"При окислительном воздействии C358S не окисляется, активность PKM2 сохраняется, и усиления потока в окислительную ветвь по механизму не ожидается (в клетках с C358S поток не измеряли). В опыте такие клетки были чувствительнее к диамиду."}},"static":["Схема: глюкозо-6-фосфат → окислительная ветвь пентозофосфатного пути → NADPH → восстановление тиоредоксина и глутатиона → удаление H₂O₂ (по механизму). Отдельная петля: H₂O₂ окисляет Cys358 PKM2, активность PKM2 снижается, а при действии диамида выше по пути накапливается глюкозо-6-фосфат (клетки A549). Переключатели: белок PKM2 (дикий тип или C358S) и окислительное воздействие (нет или есть)."]}}},{"id":"causal-comparison","number":32,"section":4,"title":"Как проверить предполагаемую связь метаболита и модификации","question":null,"questions":[1,2,3,4],"keywords":["причинная связь","РНК-интерференция","восстановление функционального фермента","каталитически неактивный вариант","ацетил-CoA","H3K9ac","фармакологическое воздействие","побочная мишень","контроль"],"lead":["Чтобы проверить, влияет ли метаболит на модификацию, изменяют количество или активность фермента и сравнивают четыре состояния при одинаковых условиях.","Вывод ограничен измеренным показателем и заданными условиями."],"mechanism":["Воздействие (РНК-интерференция или вещество) изменяет фермент, и это изменение проверяют отдельно от измерения метки.","Введение функционального и каталитически неактивного вариантов фермента показывает, нужен ли катализ.","Метаболит и модификацию измеряют отдельно, а побочные мишени и обходные источники исключают независимыми контролями."],"paragraphs":["Совпадение двух изменений не показывает, что одно вызвало другое. Поэтому гипотезу «ATP-цитратлиаза (ACLY) образует ацетил-CoA, из которого ацетилируется гистон H3 по лизину 9 (H3K9ac)» проверяют вмешательством и выделяют три этапа: воздействие на ACLY, проверку изменения мишени и измерение метаболита и модификации.","На схеме M07 показан опыт с РНК-интерференцией: малая РНК, комплементарная мРНК ACLY, уменьшает количество мРНК, а уменьшение белка и активности проверяют отдельно. Затем вводят ACLY в функциональном или каталитически неактивном варианте; её мРНК устойчива к этой малой РНК (опыт с возвращением функции, рескью). Сравнивают четыре состояния при одинаковых условиях и времени: контроль; снижение ACLY; снижение с введением функциональной ACLY; снижение с введением неактивного варианта. Если ацетилирование H3K9 восстанавливается только при введении функционального варианта, а количество и локализация белка сопоставимы, это согласуется с тем, что в данных условиях для ацетилирования H3K9 необходима каталитическая активность ACLY. Ацетил-CoA измеряют методом LC–MS (схема M03), а H3K9ac нормируют на общий H3 при иммуноблоте (схема M04); обе схемы — в шаге «Какие величины связывают изменение метаболизма с модификацией гистона».","На схеме M08 показано фармакологическое воздействие. Оно требует других контролей: растворителя, диапазона концентраций, жизнеспособности клеток и независимого вмешательства. Вещество может действовать на побочные мишени, и обходной источник, например ацетат в сверхфизиологических концентрациях, способен вернуть метку, не устраняя нарушения ACLY: введение фермента и обходной источник субстрата отвечают на разные вопросы. Восстановление одной модификации поддерживает конкретную связь, но не доказывает восстановления всех функций клетки."],"trap":["Если после снижения ACLY снизились и содержание ацетил-CoA, и ацетилирование H3K9, то связь доказана.","Совпадение изменений не отличает причину от сопутствующего эффекта. Связь поддерживают подтверждённое изменение мишени, восстановление показателя при введении функционального варианта и отсутствие такого восстановления при введении неактивного, а также независимое вмешательство."],"conditions":"Схемы M07 и M08 учебные, без экспериментальных чисел; результаты А–В — условный план опыта, а не воспроизведение работы Wellen и соавт. (2009). В этой работе подавление ACLY (РНК-интерференция) снижало ацетилирование коровых гистонов, а сверхфизиологический ацетат его возвращал. В адипоцитах 3T3-L1 снижалась экспрессия генов Glut4, HK2, PFK-1 и LDHA, и ацетат эту экспрессию возвращал; ацетилирование гистонов на промоторе определяли только для Glut4. Прямой связи экспрессии остальных генов с ацетилированием в работе не измеряли, а функциональный и неактивный варианты ACLY не сопоставляли. Результаты клеточных культур не переносятся на организм без отдельной проверки.","sources":["WELLEN"],"quiz":{"id":"S8-L32","rev":2,"question":"После подавления ACLY (РНК-интерференция) ацетилирование H3 уменьшилось. Введение функциональной ACLY, синтезируемой с мРНК, устойчивой к РНК-интерференции, восстановило ацетилирование, а введение каталитически неактивного варианта с таким же количеством и локализацией белка — нет. Какой вывод наиболее обоснован?","options":[{"id":"S8-L32-2","text":"Результат показывает, что ACLY образует основную часть ацетил-CoA для ацетилирования гистонов в этих клетках.","correct":false,"feedback":"В опыте не измеряли ацетил-CoA и не сравнивали вклад других источников, например ацетата; нужен катализ ACLY для этого показателя, но доля её вклада не определена."},{"id":"S8-L32-1","text":"Результат поддерживает вывод, что в этих условиях для ацетилирования H3 нужна каталитическая активность ACLY.","correct":true,"feedback":"При сопоставимых количестве и локализации вариантов сравнение поддерживает роль катализа, но не устанавливает все промежуточные механизмы."},{"id":"S8-L32-3","text":"Восстановление ацетилирования H3 показывает, что восстановлены и другие функции клетки, зависящие от ACLY.","correct":false,"feedback":"Измеряли одно ацетилирование H3; восстановление других функций клетки (экспрессии генов, пролиферации) в опыте не проверяли."}]},"widget":{"kind":"s5causal","title":"","s":{"title":"Как сопоставить состояния при проверке связи","status":"Учебные схемы M07 и M08 · числа не заданы","views":["Четыре состояния (M07)","Цепь воздействия (M08)"],"view_label":"Что показать","res_label":"Результат опыта","res_opts":["А: ацетилирование восстанавливает только функциональная ACLY","Б: ацетилирование восстанавливает и неактивный вариант","В: ацетил-CoA не измеряли"],"meas_label":"Количество и локализацию вариантов ACLY сопоставили","q_label":"Этап проверки","q_opts":["Воздействие","Проверка мишени","Метаболит и метка","Что не исключено"],"flow":["Снижение экспрессии\nACLY малой РНК","Введение ACLY,\nустойчивой к этой РНК","Сравнение\nвариантов ACLY"],"flow_n":["Снижение\nэкспрессии\nACLY","Введение\nустойчивой\nACLY","Сравнение\nвариантов\nACLY"],"heads":["Контроль","Снижение\nACLY","Введение\nACLY","Неактивный\nвариант"],"heads_n":["Контроль (контрольная РНК)","Снижение ACLY (РНК-интерференция)","Введение устойчивой ACLY","Каталитически неактивный вариант"],"rows":[["ACLY","активность","ACLY, активность"],["Ацетил-CoA","метаболит","ацетил-CoA"],["H3K9ac","к общему H3","H3K9ac / общий H3"]],"unk":"нет данных","lvl_note":"Заливка и полоска — качественный уровень, значение указано и словами; пунктир — не измерено.","key":["Снижение вызывает малая РНК, комплементарная мРНК ACLY; её действие на белок и активность проверяют отдельно от измерения метки.","Введение: ACLY, устойчивая к этой РНК, в функциональном или каталитически неактивном варианте; количество и локализация белка должны быть сопоставимы.","Ацетил-CoA измеряют методом LC–MS (схема M03), H3K9ac нормируют на общий H3 при иммуноблоте (схема M04); схемы — в шаге «Какие величины связывают изменение метаболизма с модификацией гистона».","Во всех состояниях одинаковы условия и время; контроль — контрольная РНК или пустой вектор."],"cells":[[[[3,"исходная"],[3,"исходный"],[3,"исходное"]],[[1,"снижена"],[1,"снижен"],[1,"снижено"]],[[3,"возвращена"],[3,"возвращён"],[3,"возвращено"]],[[0,"нет"],[1,"снижен"],[1,"снижено"]]],[[[3,"исходная"],[3,"исходный"],[3,"исходное"]],[[1,"снижена"],[1,"снижен"],[1,"снижено"]],[[3,"возвращена"],[3,"возвращён"],[3,"возвращено"]],[[0,"нет"],[1,"снижен"],[3,"возвращено"]]],[[[3,"исходная"],[-1,""],[3,"исходное"]],[[1,"снижена"],[-1,""],[1,"снижено"]],[[3,"возвращена"],[-1,""],[3,"возвращено"]],[[0,"нет"],[-1,""],[1,"снижено"]]]],"notes":[["Количество и локализация вариантов не сопоставлены: отсутствие эффекта неактивного варианта можно объяснить меньшим количеством белка или его иным положением в клетке, поэтому вывод о роли катализа не обоснован.","Ацетилирование H3K9 восстанавливает только функциональная ACLY, а неактивный вариант при сопоставимом количестве белка — нет: результат поддерживает роль катализа ACLY для этого показателя в данных условиях. Остальные функции клетки им не проверены."],["Количество и локализация вариантов не сопоставлены: восстановление метки неактивным вариантом нельзя отличить от эффекта остаточной активности или иного уровня экспрессии, поэтому результат неоднозначен.","Ацетилирование восстанавливает и неактивный вариант, а ацетил-CoA остаётся сниженным: для этого показателя катализ ACLY в данных условиях не требуется, либо метку поддерживает другой источник. Связь ACLY, ацетил-CoA и H3K9ac в такой форме не поддержана."],["Количество и локализация вариантов не сопоставлены, метаболит не измеряли: поддержка связи ограничена наблюдением совпадения.","Ацетилирование восстанавливает только функциональная ACLY, но метаболит не измеряли: зависимость H3K9ac от катализа ACLY поддержана, а то, что она идёт через изменение ацетил-CoA, остаётся предположением."]],"fixed":"Схема M07 — условный план опыта, не воспроизведение конкретной работы; результаты А–В показаны качественно.","m08":{"title":"Цепь фармакологического вмешательства","status":"Схема метода M08 · учебная, числа не заданы","ctrls":[],"W":640,"H":240,"NW":340,"NH":340,"lg":{"title":"Обозначения на схеме","act":"ацетилирование гистона H3","inh":"подавление активности фермента","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"побочный путь, который нужно исключить","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"","nodes":["синяя заливка — звено, которое проверяют на этом этапе"]},"zones":[],"mem":[],"nodes":{"drug":{"p":[70,60,100,52],"t":"ингибитор\nACLY","n":[70,50,110,52],"fs":13},"tgt":{"p":[250,60,84,40],"t":"ACLY","n":[255,50,84,40]},"met":{"p":[430,60,112,40],"t":"ацетил-CoA","n":[255,160,112,40],"fs":13},"mark":{"p":[430,170,96,40],"t":"H3K9ac","n":[255,270,96,40]},"byp":{"p":[588,60,84,46],"t":"ацетат\n(обход)","n":[70,160,96,52],"fs":13},"side":{"p":[70,170,108,52],"t":"побочная\nмишень","n":[70,270,108,52],"fs":13}},"edges":{"inh":{"a":"drug","b":"tgt","k":"inh","t":"тормозит","d":[0,-14],"dn":[0,-14]},"rx":{"a":"tgt","b":"met","k":"rx","t":"образует","d":[0,-14],"dn":[-48,0]},"ac":{"a":"met","b":"mark","k":"act","t":"ацетилирование","d":[76,0],"dn":[-52,0]},"byp":{"a":"byp","b":"met","k":"rx","t":"обход","d":[0,-14],"dn":[0,-14]},"side":{"a":"side","b":"mark","k":"seq","t":"побочный путь к метке","d":[0,-14],"dn":[0,-14],"dash":true}},"st":{"0":{"n":{"drug":"sel","side":"hide","byp":"hide"},"e":{"rx":"off","ac":"off","byp":"hide","side":"hide"},"note":"Вещество с известной мишенью добавляют в нескольких концентрациях и на заданное время; контроль получает растворитель. Ожидаемое направление изменения зависит от реакции и условий, поэтому его не принимают за результат."},"1":{"n":{"tgt":"sel","side":"hide","byp":"hide"},"e":{"rx":"off","ac":"off","byp":"hide","side":"hide"},"note":"Механистический вывод требует подтвердить, что активность или состояние мишени действительно изменились. Это проверяют отдельно от измерения метаболита и метки."},"2":{"n":{"met":"sel","mark":"sel","side":"hide","byp":"hide"},"e":{"byp":"hide","side":"hide"},"note":"Метаболит и модификацию измеряют отдельно от воздействия и от проверки мишени, в тех же условиях и в то же время. Одновременное снижение обеих величин ещё не доказывает цепь."},"3":{"n":{"side":"sel","byp":"sel"},"note":"Вещество может действовать на побочные мишени, и обходной источник ацетил-CoA, например ацетат в сверхфизиологических концентрациях, способен вернуть метку, не устранив нарушение ACLY. Поэтому добавляют независимое вмешательство, например РНК-интерференцию (схема M07), и проверку мишени."}}},"static":["Схема M07: контрольная РНК, снижение ACLY малой РНК, введение устойчивой к РНК функциональной ACLY и каталитически неактивного варианта; в каждом состоянии оценивают активность ACLY, ацетил-CoA и H3K9ac относительно общего H3. Вывод зависит от того, восстанавливает ли ацетилирование неактивный вариант, измерены ли ацетил-CoA и количество вариантов. Схема M08: ингибитор подавляет ACLY, образуется ацетил-CoA, ацетилируется H3; отдельно показаны побочная мишень вещества и обходной источник ацетат. Методы LC–MS (M03) и иммуноблот (M04) показаны в шаге про величины, связывающие метаболизм и модификацию гистона."]}}}],"sections":[{"title":"Аэробный гликолиз и распределение углерода","entry":"carbon-flux","sub":"Как связаны образование лактата, регенерация NAD⁺ и биосинтез"},{"title":"ЦТК, катаплероз и анаплероз","entry":"tca","sub":"Как сохраняются промежуточные соединения при их отведении в другие пути"},{"title":"Метаболиты и модификации хроматина","entry":"acetyl-coa-compartments","sub":"Как доступность субстратов и косубстратов меняет реакции ферментов хроматина"},{"title":"NADH/NAD⁺, сигнальное окисление и повреждение","entry":"nad-redox","sub":"Как локальные окислительно-восстановительные процессы меняют функцию клетки"},{"title":"Объединяем механизмы","entry":"integrated-carbon","sub":"Как связаны углерод, коферменты и состояние хроматина","integr":true}],"glossary":[{"id":"S8-T01","term":"Метаболический поток","section":0,"def":"Количество вещества, превращаемого в определённой реакции или пути за единицу времени. Поток всегда относят к названной реакции, системе и основе нормировки; концентрация единицей потока не является."},{"id":"S8-T02","term":"Количество вещества","section":0,"def":"Число молей определённого вещества в выбранной системе. Само по себе оно не определяет концентрацию: для её расчёта необходим объём системы."},{"id":"S8-T03","term":"Концентрация метаболита","section":0,"def":"Количество вещества, отнесённое к объёму выбранной среды или компартмента. Локальная концентрация относится к конкретному компартменту и не определяется общим содержанием вещества в клетке."},{"id":"S8-T04","term":"Метаболический пул","section":0,"def":"Совокупность молекул определённого метаболита или группы взаимопревращающихся форм в заданной системе. Состав пула задаёт, какие формы учитываются; одинаковое отношение форм возможно при разном общем количестве вещества."},{"id":"S8-T05","term":"Стационарное состояние","section":0,"def":"Состояние, в котором выбранные величины постоянны во времени при сохраняющихся потоках: приток равен расходу. В отличие от химического равновесия, в открытой системе чистые потоки при этом не равны нулю."},{"id":"S8-T06","term":"Химическое равновесие","section":0,"def":"Состояние конкретной обратимой реакции, при котором прямой и обратный потоки равны, а чистый поток равен нулю. Клетка в стационарном состоянии равновесной не является, поскольку в ней поддерживаются ненулевые чистые потоки."},{"id":"S8-T07","term":"Гликолиз","section":0,"def":"Последовательность реакций превращения глюкозы в пируват с образованием ATP и NADH (гликолиз в узком смысле). В широком смысле, как в шаге «Как образование лактата поддерживает гликолиз», гликолизом называют путь от глюкозы до лактата, включающий восстановление пирувата; NADPH гликолиз не образует."},{"id":"S8-T08","term":"Аэробный гликолиз","section":0,"def":"Метаболический фенотип, при котором значительная часть глюкозы превращается в лактат при достаточном содержании кислорода; при описании опухолевых клеток его называют эффектом Варбурга. Он не равнозначен гипоксии и не ограничен опухолевыми клетками."},{"id":"S8-T09","term":"Гипоксия","section":0,"def":"Недостаточная для рассматриваемого процесса доступность кислорода в клетке или ткани. Доля O₂ в газовой смеси инкубатора не равна локальной концентрации кислорода у клеток."},{"id":"S8-T10","term":"Лактат","section":0,"def":"Анион молочной кислоты, образующийся, в частности, при восстановлении пирувата NADH. Лактат не только конечный продукт: он может окисляться обратно до пирувата, а его образование не обязательно связано с нехваткой O₂."},{"id":"S8-T11","term":"Лактатдегидрогеназа (ЛДГ, LDH)","section":0,"def":"Фермент обратимого взаимопревращения пирувата и лактата, сопряжённого с парой NADH/NAD⁺: пируват + NADH + H⁺ ⇄ лактат + NAD⁺. LDHA — субъединица, кодируемая одним геном; ЛДГ в целом представлена несколькими изоферментами."},{"id":"S8-T12","term":"Регенерация NAD⁺","section":0,"def":"Образование окисленной формы кофермента при окислении NADH, например в реакции ЛДГ или на комплексе I. Новые молекулы NAD при этом не синтезируются, и общий пул NAD(H) не увеличивается."},{"id":"S8-T13","term":"Субстратное фосфорилирование","section":0,"def":"Синтез ATP или GTP за счёт энергии высокоэнергетического промежуточного соединения (1,3-бисфосфоглицерата, фосфоенолпирувата, сукцинил-CoA), при котором фосфорильная группа переносится на нуклеозиддифосфат. Протекает без ATP-синтазы и протондвижущей силы."},{"id":"S8-T14","term":"Окислительное фосфорилирование","section":0,"def":"Синтез ATP, сопряжённый через протондвижущую силу с переносом электронов по дыхательной цепи; у человека конечным акцептором электронов служит O₂. Скорость потребления кислорода (OCR) включает расход, не связанный с синтезом ATP, поэтому скорости синтеза ATP не равна."},{"id":"S8-T15","term":"Выход ATP","section":0,"def":"Количество ATP, образованного на заданное количество превращённого субстрата, например на молекулу глюкозы. Выход отличается от скорости образования ATP (количества за единицу времени) и от содержания ATP в клетке."},{"id":"S8-T16","term":"Восстановительные эквиваленты","section":0,"def":"Электроны, переносимые в окислительно-восстановительных реакциях коферментами и другими переносчиками, например NADH, NADPH, FADH₂ или убихинолом. NADH цитозоля через внутреннюю митохондриальную мембрану не проходит; его эквиваленты передают челночные системы."},{"id":"S8-T17","term":"Челночная система NADH","section":0,"def":"Совокупность сопряжённых реакций и переноса метаболитов, передающая восстановительные эквиваленты цитозольного NADH на дыхательную цепь митохондрий; сам NADH внутреннюю мембрану не пересекает. В малат-аспартатном челноке NADH вновь образуется в матриксе, в глицерол-3-фосфатном электроны передаются на убихинон."},{"id":"S8-T18","term":"Пентозофосфатный путь","section":0,"def":"Совокупность реакций превращения сахарофосфатов: окислительная ветвь образует NADPH и рибулозо-5-фосфат, неокислительная обратимо взаимопревращает пентозофосфаты и другие сахарофосфаты. Собственно в этом пути NADPH образуется только в окислительной ветви."},{"id":"S8-T19","term":"Одноуглеродный обмен","section":0,"def":"Связанные реакции переноса одноуглеродных групп на коферменты, в том числе в фолатном и метиониновом циклах. Переносчиками служат производные тетрагидрофолата и SAM (метильная группа); биотинзависимое карбоксилирование к этому обмену не относится."},{"id":"S8-T20","term":"Биосинтетический предшественник","section":0,"def":"Соединение, атомы которого используются для образования другого вещества в биосинтетическом пути. Понятие относится к определённой паре «предшественник — продукт» в определённом пути."},{"id":"S8-T21","term":"Аспартат","section":0,"def":"Аминокислота, образующаяся, в частности, трансаминированием оксалоацетата (в цитозоле — GOT1, в митохондриях — GOT2) и используемая для синтеза белков и нуклеотидов. Её доступность определяется образованием, транспортом между компартментами и расходом."},{"id":"S8-T22","term":"Цикл трикарбоновых кислот (ЦТК)","section":1,"def":"Связанная последовательность реакций в матриксе митохондрий (SDH встроена во внутреннюю мембрану), в которой при полном обороте окисляется ацетильная группа ацетил-CoA и регенерируется оксалоацетат. Синонимы: цикл Кребса, цикл лимонной кислоты."},{"id":"S8-T23","term":"Амфиболический путь","section":1,"def":"Метаболический путь, участвующий и в катаболизме, и в образовании предшественников для анаболизма. Это свойство пути в целом: отдельная реакция не обязательно выполняет обе функции одновременно."},{"id":"S8-T24","term":"Промежуточное соединение","section":1,"def":"Соединение, которое образуется в одной реакции рассматриваемого пути и расходуется в другой; в ЦТК это, например, цитрат, α-КГ, сукцинат и малат. Синоним — «интермедиат»."},{"id":"S8-T25","term":"Катаплероз","section":1,"def":"Чистый отток промежуточных соединений ЦТК в другие метаболические пути. Выход отдельной молекулы через мембрану катаплерозом ещё не является: значение имеет суммарный баланс оттока и обратного притока."},{"id":"S8-T26","term":"Анаплероз","section":1,"def":"Восполнение промежуточных соединений ЦТК за счёт поступления углеродных скелетов из других путей. Поступление ацетил-CoA в цикл чистого восполнения оксалоацетата у человека не обеспечивает."},{"id":"S8-T27","term":"Пируваткарбоксилаза (PC, ПК)","section":1,"def":"Биотинсодержащий фермент, катализирующий ATP-зависимое карбоксилирование пирувата до оксалоацетата. Источником CO₂ служит бикарбонат; в клетках человека реакция протекает в митохондриях."},{"id":"S8-T28","term":"Пируватдегидрогеназный комплекс (PDH)","section":0,"def":"Мультиферментный комплекс матрикса митохондрий, катализирующий окислительное декарбоксилирование пирувата до ацетил-CoA с образованием CO₂ и NADH. Он отличается от пируваткарбоксилазы (PC), образующей оксалоацетат, и от регулирующей его киназы PDK."},{"id":"S8-T29","term":"Пируватдегидрогеназная киназа (PDK)","section":0,"def":"Киназа, фосфорилирующая и тем самым ингибирующая пируватдегидрогеназный комплекс (у человека четыре изоформы, PDK1–PDK4). Фосфоинозитид-зависимая протеинкиназа PDPK1, которую в литературе нередко тоже называют PDK1, — другой фермент."},{"id":"S8-T30","term":"Глутаминаза (GLS)","section":1,"def":"Фермент гидролиза амидной группы глутамина с образованием глутамата и аммония. Образование α-КГ из глутамата требует отдельной реакции (трансаминирования или окислительного дезаминирования), которую глутаминаза не катализирует."},{"id":"S8-T31","term":"Трансаминирование","section":0,"def":"Перенос аминогруппы между аминокислотой и кетокислотой с образованием новых аминокислоты и кетокислоты (аминотрансферазы, кофермент — пиридоксальфосфат). Например, GOT переносит аминогруппу с глутамата на оксалоацетат; гидролиз глутамина трансаминированием не является."},{"id":"S8-T32","term":"Оксалоацетат","section":0,"def":"Четырёхуглеродная кетодикарбоновая кислота, промежуточное соединение ЦТК и предшественник аспартата. При физиологическом pH она существует в виде аниона (оксалоацетата); сокращённо — ОАА."},{"id":"S8-T33","term":"α-Кетоглутарат (α-КГ, 2-оксоглутарат)","section":0,"def":"Пятиуглеродная кетодикарбоновая кислота (в виде аниона), промежуточное соединение ЦТК и косубстрат ряда диоксигеназ. Названия α-кетоглутарат и 2-оксоглутарат обозначают одно соединение; 2-гидроксиглутарат — другое вещество."},{"id":"S8-T34","term":"Сукцинат","section":1,"def":"Анион янтарной кислоты, промежуточное соединение ЦТК, окисляемое сукцинатдегидрогеназой до фумарата. Его содержание определяется балансом образования и расхода, а не одной реакцией."},{"id":"S8-T35","term":"Фумарат","section":1,"def":"Анион фумаровой кислоты; образуется при окислении сукцината сукцинатдегидрогеназой и превращается фумаразой в малат. Потеря фумаразы и потеря SDH — разные нарушения: накапливаются разные метаболиты (фумарат и сукцинат)."},{"id":"S8-T36","term":"Сукцинатдегидрогеназа (SDH, комплекс II)","section":0,"def":"Комплекс II дыхательной цепи и фермент ЦТК во внутренней мембране митохондрий: окисляет сукцинат до фумарата и передаёт электроны через прочно (ковалентно) связанный FAD и железо-серные кластеры убихинону. Свободный FADH₂ при этом не высвобождается."},{"id":"S8-T37","term":"Фумараза (FH)","section":1,"def":"Фермент обратимой гидратации фумарата до L-малата. Присоединение воды по двойной связи не является окислительным декарбоксилированием: переноса электронов и выделения CO₂ в этой реакции нет."},{"id":"S8-T38","term":"Восстановительное карбоксилирование α-КГ","section":1,"def":"Образование изоцитрата из α-КГ с присоединением CO₂ и расходом NADPH; реакцию в направлении, обратном образованию NADPH, катализируют IDH1 (преимущественно цитозоль) и IDH2 (матрикс), вклад которых зависит от клеток. Изоцитрат затем может превращаться в цитрат; это обращение лишь части реакций ЦТК."},{"id":"S8-T39","term":"Изотополог","section":1,"def":"Молекула, отличающаяся от других молекул того же соединения числом атомов тяжёлого изотопа, например ¹³C. Изотопологи различаются числом меченых атомов, а изотопомеры — их положением в молекуле."},{"id":"S8-T40","term":"Изотопомер","section":1,"def":"Молекула с тем же числом изотопных атомов, что и другая молекула соединения, но с иным их расположением в структуре. Позиционные варианты с одинаковым числом ¹³C дают один и тот же сигнал M+n, поэтому обычный подсчёт M+n их не различает."},{"id":"S8-T41","term":"M+n","section":1,"def":"Обозначение изотополога, масса которого на n единиц больше немеченой формы (M+0) из-за n атомов ¹³C. M+n описывает распределение молекул по числу меченых атомов и величиной потока не является."},{"id":"S8-T42","term":"[U-¹³C]субстрат","section":1,"def":"Исходное соединение, в молекуле которого углерод во всех положениях представлен ¹³C. Обозначение U относится к молекуле субстрата и не означает, что все молекулы этого вещества и его продуктов в клетке полностью меченые."},{"id":"S8-T43","term":"Доля меченого изотополога","section":1,"def":"Отношение количества выбранного изотополога к сумме количеств всех изотопологов соединения. Его рассчитывают после поправки на естественную изотопную распространённость (для ¹³C около 1,1 %); доля показывает распределение метки, а не абсолютный поток."},{"id":"S8-T44","term":"Ацетил-CoA","section":0,"def":"Тиоэфир ацетильной группы и кофермента A; донор ацетильной группы в реакциях ацетилирования и субстрат цитратсинтазы. Внутреннюю мембрану митохондрий он не пересекает, поэтому пулы в матриксе и в цитозоле разделены; ацетильные группы переходят между ними в составе цитрата или ацетилкарнитина."},{"id":"S8-T45","term":"ATP-цитратлиаза (ACLY)","section":2,"def":"Фермент ATP-зависимого расщепления цитрата: цитрат + ATP + CoA → ацетил-CoA + оксалоацетат + ADP + Pi. Фермент работает в цитозоле и ядре, вне митохондрий."},{"id":"S8-T46","term":"Ацетил-CoA-синтетаза 2 (ACSS2)","section":2,"def":"Фермент образования ацетил-CoA из ацетата: ацетат + CoA + ATP → ацетил-CoA + AMP + пирофосфат. Эта реакция отличается от реакции ACLY, использующей цитрат и образующей ADP."},{"id":"S8-T47","term":"Гистонацетилтрансфераза (HAT, KAT)","section":2,"def":"Фермент переноса ацетильной группы с ацетил-CoA на ε-аминогруппу остатка лизина гистона. Обозначение KAT (лизинацетилтрансфераза) шире и охватывает ферменты с негистоновыми субстратами; HAT относится к гистоновой реакции."},{"id":"S8-T48","term":"Гистоновая деацетилаза (HDAC)","section":2,"def":"Фермент гидролитического удаления ацетильной группы с остатка лизина гистона. К HDAC относят Zn²⁺-зависимые ферменты классов I, II и IV; NAD⁺-зависимые сиртуины катализируют иную реакцию."},{"id":"S8-T49","term":"Сиртуин","section":2,"def":"Семейство NAD⁺-зависимых деацилаз (SIRT1–SIRT7): деацетилирование сопровождается расходом NAD⁺ и образованием никотинамида. Сиртуины различаются по субстратам и локализации, и лишь часть из них действует преимущественно на гистоны."},{"id":"S8-T50","term":"S-Аденозилметионин (SAM)","section":2,"def":"Соединение, образующееся из метионина и ATP и служащее донором метильной группы во многих реакциях метилирования. Ацетильные группы SAM не переносит: их донором служит ацетил-CoA."},{"id":"S8-T51","term":"S-Аденозилгомоцистеин (SAH)","section":2,"def":"Продукт SAM-зависимых реакций метилирования; образуется после отдачи метильной группы и тормозит многие метилтрансферазы. Отношение SAM/SAH характеризует состояние пула, но универсальным числовым условием активности метилтрансфераз не является."},{"id":"S8-T52","term":"Метионинаденозилтрансфераза (MAT)","section":2,"def":"Фермент, образующий SAM из метионина и ATP. Метилтрансферазы — другие ферменты: они используют уже образованный SAM и переносят его метильную группу на субстрат."},{"id":"S8-T53","term":"Метилтрансфераза","section":2,"def":"Фермент переноса метильной группы с донора на определённый субстрат. В рассматриваемых реакциях донором служит SAM, субстратом — остаток лизина в гистоне или цитозин ДНК, и образуется SAH."},{"id":"S8-T54","term":"H3K9ac","section":2,"def":"Ацетилирование остатка лизина в положении 9 гистона H3. Количество модифицированного гистона, доля модифицированных сайтов и сигнал антитела в иммуноблоте — разные величины."},{"id":"S8-T55","term":"H3K4me3","section":2,"def":"Триметилирование лизина 4 гистона H3. Метка обогащена вблизи старта транскрипции, в том числе на неактивных промоторах, поэтому её наличие само по себе не показывает, что конкретный ген активен."},{"id":"S8-T56","term":"H3K9me3","section":2,"def":"Триметилирование лизина 9 гистона H3, характерное для ряда областей гетерохроматина. Метилирование гистонов в целом репрессивным не является: например, H3K4me3 обогащена вблизи старта транскрипции."},{"id":"S8-T57","term":"Косубстрат","section":2,"def":"Дополнительный субстрат реакции, химически превращающийся в каждом каталитическом цикле: например, SAM у метилтрансфераз, ацетил-CoA у ацетилтрансфераз, NAD⁺ у сиртуинов, α-КГ (в сукцинат и CO₂) и O₂ у диоксигеназ. Fe(II) — кофактор, в реакции он не расходуется."},{"id":"S8-T58","term":"JmjC-деметилазы","section":2,"def":"Гистоновые деметилазы с JmjC-доменом; это Fe(II)- и α-КГ-зависимые диоксигеназы, использующие O₂. Гистоновые деметилазы другого типа, например LSD1 (KDM1A), используют FAD и к этой группе не относятся."},{"id":"S8-T59","term":"Белки TET","section":2,"def":"Fe(II)/α-КГ-зависимые диоксигеназы (TET1–TET3), последовательно окисляющие 5mC до 5hmC, 5-формилцитозина (5fC) и 5-карбоксилцитозина (5caC). Появление 5hmC — лишь первый этап, поскольку возвращение к немодифицированному цитозину требует дальнейших стадий: вырезания основания с репарацией или разбавления метки при репликации."},{"id":"S8-T60","term":"5-Метилцитозин (5mC)","section":2,"def":"Производное цитозина с метильной группой в положении 5 пиримидинового кольца; метка ДНК. Её значение зависит от последовательности, положения в гене и клеточного контекста; наличие метки не означает подавления любого гена."},{"id":"S8-T61","term":"5-Гидроксиметилцитозин (5hmC)","section":2,"def":"Продукт окисления 5mC белками TET с гидроксиметильной группой в положении 5 пиримидинового кольца. Он отличается от немодифицированного цитозина и не является завершённым деметилированием."},{"id":"S8-T62","term":"R-2-Гидроксиглутарат (R-2-HG, D-2-HG)","section":2,"def":"Стереоизомер 2-гидроксиглутарата, образующийся, в частности, из α-КГ при неоморфной активности мутантных IDH1/IDH2 с расходом NADPH. Это вещество отличается от α-КГ, а свойства другого изомера, S-2-HG (L-2-HG), на него автоматически не переносятся."},{"id":"S8-T63","term":"Неоморфная активность","section":2,"def":"Приобретённая в результате мутации способность фермента катализировать реакцию, несвойственную ферменту дикого типа. Для IDH1 R132H это восстановление α-КГ до R-2-HG с расходом NADPH."},{"id":"S8-T64","term":"NADH/NAD⁺","section":3,"def":"Отношение содержаний восстановленной и окисленной форм никотинамидадениндинуклеотида в одном компартменте. Его указывают для определённого компартмента и для определённых форм (свободных или суммарных); оно не равно доле NADH в пуле и не задаёт размер пула."},{"id":"S8-T65","term":"NADPH/NADP⁺","section":3,"def":"Отношение содержаний восстановленной и окисленной форм фосфорилированного кофермента. NADPH и NADH различаются набором реакций и ферментов; NADPH используется в восстановительных биосинтезах и в системах защиты от окислителей."},{"id":"S8-T66","term":"Активные формы кислорода (АФК)","section":3,"def":"Собирательное название реакционноспособных кислородсодержащих частиц, включая супероксид и пероксид водорода. Это группа веществ с разными свойствами, поэтому единой концентрации «АФК» нет."},{"id":"S8-T67","term":"Супероксид-анион-радикал (O₂•⁻)","section":3,"def":"Продукт одноэлектронного восстановления молекулярного кислорода; имеет неспаренный электрон. Отличается от пероксида водорода, который радикалом не является."},{"id":"S8-T68","term":"Пероксид водорода (H₂O₂)","section":3,"def":"Нерадикальная активная форма кислорода, участвующая в окислительных реакциях и в регуляции белков. Образуется, например, при дисмутации супероксида."},{"id":"S8-T69","term":"Супероксиддисмутаза (SOD)","section":3,"def":"Фермент дисмутации супероксида с образованием O₂ и H₂O₂. Образовавшийся H₂O₂ удаляют другие ферменты."},{"id":"S8-T70","term":"Пероксиредоксин (Prx)","section":3,"def":"Тиолзависимая пероксидаза, восстанавливающая пероксиды за счёт каталитического цистеина; у типичных 2-Cys-пероксиредоксинов окисленный фермент восстанавливается тиоредоксином. В матриксе митохондрий действует, в частности, Prx3; некоторые Prx участвуют в редокс-реле."},{"id":"S8-T71","term":"Тиоредоксиновая система","section":3,"def":"Система тиоредоксина и тиоредоксинредуктазы, получающая восстановительные эквиваленты от NADPH. Она восстанавливает определённые субстраты, в том числе окисленные пероксиредоксины."},{"id":"S8-T72","term":"Глутатионовая система","section":3,"def":"Связанные реакции с участием восстановленного (GSH) и окисленного (GSSG) глутатиона и глутатионредуктазы. Глутатионпероксидаза использует GSH, а глутатионредуктаза восстанавливает GSSG за счёт NADPH."},{"id":"S8-T73","term":"Сульфиредоксин (Srx)","section":3,"def":"Фермент, восстанавливающий за счёт ATP сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов. Универсальным восстановителем сульфиновых групп любых белков он не является."},{"id":"S8-T74","term":"Редокс-реле","section":3,"def":"Передача окислительного эквивалента от первично окисленного белка к определённой белковой мишени, например от Prx2 к STAT3. Это не свободная диффузия окислителя ко всем цистеинам."},{"id":"S8-T75","term":"Окислительный стресс","section":3,"def":"Нарушение редокс-регуляции и (или) молекулярное повреждение при смещении баланса между окислительными процессами и защитными системами. Его нельзя определить только по наличию H₂O₂ или одному пороговому значению."},{"id":"S8-T76","term":"Обратный перенос электронов (RET)","section":3,"def":"Перенос электронов от восстановленного Q-пула через комплекс I в обратном направлении при высокой протондвижущей силе. Он сопровождается образованием супероксида на комплексе I (точное место образования обсуждается); электроны при этом могут восстанавливать NAD⁺. Направление противоположно обычному переносу от NADH к Q."},{"id":"S8-T77","term":"PARP","section":3,"def":"Семейство ферментов, часть которых (при повреждении ДНК — прежде всего PARP1) переносит остатки ADP-рибозы с NAD⁺ на белки, высвобождая никотинамид. Эффекты разных членов семейства не сводятся друг к другу."},{"id":"S8-T78","term":"OCR","section":0,"def":"Скорость потребления кислорода, рассчитываемая по убыли O₂ в малом объёме среды над клетками во времени (схема M01). Показатель нормируют на число клеток или содержание белка; часть потребления O₂ немитохондриальная, и OCR не равен скорости синтеза ATP."},{"id":"S8-T79","term":"ECAR","section":0,"def":"Скорость внеклеточного закисления, рассчитываемая по изменению pH среды над клетками во времени (схема M01). Закисление создают лактат, выходящий вместе с протоном, и дыхательный CO₂, гидратирующийся до HCO₃⁻ и H⁺, поэтому ECAR не равна скорости образования лактата."},{"id":"S8-T80","term":"Жидкостная хроматография — масс-спектрометрия (LC–MS)","section":1,"def":"Сочетание жидкостной хроматографии, разделяющей компоненты смеси по времени удерживания, с масс-спектрометрией, регистрирующей ионы по отношению массы к заряду (схема M03). Количественное определение требует калибровки и внутреннего стандарта; экстракт целых клеток компартменты не разделяет."},{"id":"S8-T81","term":"Иммуноблот","section":2,"def":"Определение белкового антигена с помощью антител после электрофоретического разделения белков и переноса на мембрану (схема M04). Сигнал антитела к модификации гистона зависит от количества гистона в дорожке, поэтому его сравнивают с сигналом общего гистона."},{"id":"S8-T82","term":"Peredox","section":3,"def":"Генетически кодируемый флуоресцентный сенсор NADH/NAD⁺ в цитозоле (схема M05). Отклик зависит от обеих форм кофермента; сенсор не измеряет суммарный пул NAD(H). При направлении в матрикс в рассмотренной работе его сигнал не менялся при метаболических воздействиях."},{"id":"S8-T83","term":"HyPer7","section":3,"def":"Генетически кодируемый флуоресцентный сенсор H₂O₂ (схема M06): его состояние меняется при окислении пероксидом водорода и восстановлении клеточными системами. Показание относится к компартменту, куда направлен сенсор; среди АФК он практически специфичен к H₂O₂ (на органические гидропероксиды отвечает при высоких концентрациях)."}],"sources":{"LNR2":{"url":"https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C","cite":"Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.","doi":"","pmid":""},"ALBESS":{"url":"https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80","cite":"Альбертс Б. и др. Основы молекулярной биологии клетки.","doi":"","pmid":""},"BAKER":{"url":"https://www.worldcat.org/search?q=Baker%20S%20%20A","cite":"Baker S. A., Rutter J. Metabolites as signalling molecules. Nat Rev Mol Cell Biol. 2023;24:355–374.","doi":"","pmid":""},"SIES":{"url":"https://doi.org/10.1038/s41580-024-00730-2","cite":"Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.","doi":"10.1038/s41580-024-00730-2","pmid":""},"LUENGO":{"url":"https://research.chalmers.se/publication/522133/file/522133_Fulltext.pdf","cite":"Luengo A. et al. Increased demand for NAD⁺ relative to ATP drives aerobic glycolysis. Mol Cell. 2021;81:691–707.e6.","doi":"10.1016/j.molcel.2020.12.012","pmid":""},"WANG":{"url":"https://doi.org/10.1016/j.molcel.2022.07.007","cite":"Wang Y. et al. Saturation of the mitochondrial NADH shuttles drives aerobic glycolysis in proliferating cells. Mol Cell. 2022;82:3270–3283.e9.","doi":"10.1016/j.molcel.2022.07.007","pmid":"35973426"},"SULLIVAN":{"url":"https://doi.org/10.1016/j.cell.2015.07.017" function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};

function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');

    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');

  return svg(d, U.chart_levels, h, w);
}
/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

   Собственный вид W.s1b_probe. Модель учебная, в условных единицах: чистая функция M8.s1bProbe (проверена в node).

M8.s1bProbe = (md, lac, o2, bi, cells, phase) => {
  const mito = o2 * md.mult[phase];            /* митохондриальное потребление O₂ в фазе (на клетку) */
  const ocr = mito + md.nonmito;               /* OCR на клетку = митохондриальное + немитохондриальное потребление */
  const resp = mito * md.hpo;                  /* дыхательный CO₂ → H⁺ (учебное допущение: md.hpo ионов H⁺ на молекулу O₂) */
  const ppr = lac + resp;                      /* суммарный выход протонов на клетку */
  const ecar = ppr / md.bc[bi];                /* скорость изменения pH на клетку = выход протонов / буферная ёмкость */
  return {mito, ocr, resp, ppr, ecar, frac: ppr > 0 ? resp / ppr : null, per: lac > 0 ? ecar / lac : null, ocrRaw: ocr * cells, ecarRaw: ecar * cells};
};

/* Собственный вид W.s2_trace. Подписи берутся из S (widget.s); расчёты — чистые функции S2.* (проверены в node). */
const S2 = {};
S2.NAT = 0.0107;                       /* естественная доля ¹³C среди атомов углерода (учебное округление) */
S2.binom = (n, k, p) => { if (k < 0 || k > n) return 0; let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i; return c * Math.pow(p, k) * Math.pow(1 - p, n - k); };
