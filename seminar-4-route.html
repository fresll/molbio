tml#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/43199">Barkai N et al. 1997. Robustness in simple biochemical networks. Nature</a></li><li><a href="https://doi.org/10.1038/16483">Alon U et al. 1999. Robustness in bacterial chemotaxis. Nature</a></li><li><a href="https://doi.org/10.1016/s0955-0674(03)00017-6">Tyson JJ et al. 2003. Sniffers, buzzers, toggles and blinkers: dynamics of regulatory and signaling pathways in the cell. Curr Opin Cell Biol</a></li></ul><p>Хемотаксис E. coli — Barkai и Leibler (1997), Alon и соавт. (1999); режимы сетей — Tyson и соавт. (2003); глава 4 пособия (§4.14–4.15). Таблица — схема, не данные опыта.</p></details></article><article class="card print-unit" id="ns-insulin-akt"><div class="eyebrow">Сеть инсулина · шаг 19 из 26</div><h2>Как инсулин активирует AKT</h2><p class="lead">PIP₃ не активирует AKT сам по себе: он собирает на мембране AKT и две киназы, которые её фосфорилируют. Для полной активности AKT нужны два фосфорилирования разными киназами.</p><ol class="mech"><li><a href="#ns-g-S4-T44">Рецептор инсулина</a> фосфорилирует <a href="#ns-g-S4-T45">IRS1/IRS2</a>; фосфотирозины IRS связывают p85, и <a href="#ns-g-S4-T46">PI3K</a> превращает PIP₂ в <a href="#ns-g-S4-T47">PIP₃</a>.</li><li>PIP₃ связывает PH-домены AKT, PDK1 и SIN1 (субъединица mTORC2); связывание с PIP₃ снимает аутоингибирование AKT.</li><li>PDK1 фосфорилирует T308, mTORC2 — S473 (у AKT1); вместе они полностью активируют <a href="#ns-g-S4-T48">AKT</a>.</li></ol><p>Инсулин связывается с рецептором — тирозинкиназой — и вызывает фосфорилирование его внутриклеточных доменов. Активный рецептор фосфорилирует адаптеры IRS1 и IRS2. Их фосфотирозины связывают регуляторную субъединицу p85 PI3K класса IA, и каталитическая p110 переносится к мембране, где превращает PIP₂ в PIP₃. Через GRB2 и SOS IRS может запускать и путь RAS–ERK, разобранный в вопросах 1–3.</p><p>PIP₃ служит местом сборки сигнального комплекса. Он связывает PH-домены AKT, PDK1 и SIN1 в составе mTORC2. Связывание AKT с PIP₃ снимает аутоингибирование: PH-домен перестаёт закрывать каталитический центр. Затем PDK1 фосфорилирует активационную петлю (T308 у AKT1, T309 у AKT2), а mTORC2 — гидрофобный мотив (S473 у AKT1, S474 у AKT2).</p><p>В печени и мышцах преобладает AKT2, поэтому номера сайтов нужно указывать вместе с изоформой. Выключают сигнал фосфатазы: PTEN удаляет 3-фосфат PIP₃, SHIP1/2 превращают PIP₃ в PI(3,4)P₂.</p><p>Фосфорилирование AKT — не то же самое, что её активность: степень фосфорилирования отражает баланс активности киназ и фосфатаз. Активность проверяют по фосфорилированию субстратов, например PRAS40 по T246.</p><div class="note trap"><strong>Типичная ошибка</strong> PIP₃ сам активирует AKT, поэтому появление PIP₃ равнозначно полной активации.<p class="trap-fix">PIP₃ собирает AKT, PDK1 и mTORC2 на мембране. Полная активность требует двух фосфорилирований — T308 (PDK1) и S473 (mTORC2).</p></div><div class="static-quiz"><h3>В клетке образуется PIP₃, но mTORC2 неактивен. Каким будет состояние AKT после добавления инсулина?</h3><ol><li><b>А.</b> AKT полностью активна: PIP₃ достаточно <i>(неверный вариант)</i><br><span class="expl">PIP₃ лишь собирает AKT и её киназы на мембране; без фосфорилирования S473 активация неполная.</span></li><li><b>Б.</b> AKT активирована частично: есть T308, нет S473 <i>(верный вариант)</i><br><span class="expl">PDK1 фосфорилирует T308 и частично активирует AKT; полную активность даёт фосфорилирование S473 комплексом mTORC2.</span></li><li><b>В.</b> AKT не привлекается к мембране <i>(неверный вариант)</i><br><span class="expl">Привлечение к мембране зависит от PIP₃ и PH-домена AKT, а не от mTORC2.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01349-z">Burchfield JG et al. 2025. The insulin signalling network. Nat Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5546324/">Manning BD et al. 2017. AKT/PKB Signaling: Navigating the Network. Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10570132/">Madsen RR et al. 2023. PI3K signaling through a biochemical systems lens. J Biol Chem</a></li></ul><p>По обзорам Burchfield и соавт. (2025), Manning и Toker (2017; полный текст), Madsen и Toker (2023) и главе 4 пособия. Нумерация сайтов — AKT1 и AKT2 человека. Схема — механизм, не данные опыта.</p></details></article><article class="card print-unit" id="ns-akt-outputs"><div class="eyebrow">Сеть инсулина · шаг 20 из 26</div><h2>Как AKT распределяет сигнал по ветвям</h2><p class="lead">AKT фосфорилирует более ста субстратов; в печени важнее всего ветви mTORC1, FOXO1 и GSK3, а в мышцах и жировой ткани — ещё и TBC1D4 (перенос GLUT4). Через TSC2, GSK3 и TBC1D4 AKT снимает торможение соответствующих процессов, а в ветви FOXO1 подавляет активатор транскрипции, и экспрессия генов глюконеогенеза снижается.</p><ol class="mech"><li>AKT фосфорилирует TSC2 и ослабляет его GAP-активность: RHEB-GTP накапливается и активирует mTORC1.</li><li>AKT фосфорилирует <a href="#ns-g-S4-T54">FOXO1</a>; он связывается с 14-3-3 и выходит из ядра — экспрессия генов глюконеогенеза PEPCK и G6PC снижается.</li><li>AKT фосфорилирует GSK3 и TBC1D4: растормаживаются синтез гликогена и (в мышцах и жировой ткани) перенос GLUT4 к мембране.</li></ol><p>Сигнал AKT расходится по ветвям с разной кинетикой. Первая ведёт к mTORC1: TSC2 — GAP для RHEB, и, пока он активен, RHEB остаётся в GDP-форме. AKT фосфорилирует TSC2 (S939, T1462 у человека) и PRAS40 (T246), ослабляя торможение со стороны обоих белков; RHEB-GTP активирует mTORC1, при условии, что аминокислоты привлекли комплекс к лизосоме.</p><p>Вторая ветвь — FOXO1. Нефосфорилированный FOXO1 в ядре вместе с другими факторами активирует гены глюконеогенеза. AKT фосфорилирует его (T24, S256 у человека), FOXO1 связывается с белками 14-3-3 и выводится из ядра. В гепатоцитах крысы инсулин снижал содержание мРНК PEPCK примерно на 95 % (Li 2010).</p><p>Третья — GSK3: без инсулина она фосфорилирует и ингибирует гликогенсинтазу; AKT фосфорилирует GSK3 (S21 у α, S9 у β) и снимает это торможение. Четвёртая — TBC1D4 (AS160), GAP для малых ГТФаз Rab в мышцах и жировой ткани: после фосфорилирования под действием AKT активность TBC1D4 снижается, и пузырьки с GLUT4 переносятся к плазматической мембране.</p><p>В ветвях TSC2, GSK3 и TBC1D4 действует <a href="#ns-g-S4-T49">снятие торможения</a>: AKT подавляет белок, ограничивающий соответствующий процесс. Ветвь FOXO1 устроена иначе: FOXO1 активирует транскрипцию генов глюконеогенеза, поэтому его подавление снижает их экспрессию. Так один сигнал одновременно стимулирует синтез белка, липидов и гликогена и подавляет глюконеогенез.</p><div class="note trap"><strong>Типичная ошибка</strong> AKT напрямую активирует каждый процесс, которым управляет инсулин.<p class="trap-fix">AKT действует через свои субстраты: подавление TSC2, GSK3 и TBC1D4 снимает торможение соответствующих процессов, а подавление активатора FOXO1 снижает экспрессию генов глюконеогенеза.</p></div><div class="static-quiz"><h3>Почему фосфорилирование FOXO1 под действием AKT снижает экспрессию PEPCK?</h3><ol><li><b>А.</b> Фосфорилированный FOXO1 выводится из ядра <i>(верный вариант)</i><br><span class="expl">FOXO1 после фосфорилирования связывается с 14-3-3 и покидает ядро, поэтому перестаёт активировать гены глюконеогенеза.</span></li><li><b>Б.</b> Фосфорилированный FOXO1 становится репрессором PEPCK <i>(неверный вариант)</i><br><span class="expl">Фосфорилирование не превращает FOXO1 в репрессор; оно убирает активатор из ядра.</span></li><li><b>В.</b> AKT фосфорилирует сам ген PEPCK <i>(неверный вариант)</i><br><span class="expl">Киназы фосфорилируют белки, а не гены; AKT действует через транскрипционный фактор FOXO1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5546324/">Manning BD et al. 2017. AKT/PKB Signaling: Navigating the Network. Cell</a></li><li><a href="https://doi.org/10.1038/s42255-025-01349-z">Burchfield JG et al. 2025. The insulin signalling network. Nat Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2840492/">Li S et al. 2010. Bifurcation of insulin signaling pathway in rat liver: mTORC1 required for stimulation of lipogenesis, but not inhibition of gluconeogenesis. Proc Natl Acad Sci U S A</a></li></ul><p>Сайты — Manning и Toker (2017, полный текст), нумерация человека; снижение мРНК PEPCK — гепатоциты крысы (Li 2010, аннотация). Столбики — учебная модель практикума (вопрос 4), величины условные.</p></details></article><article class="card print-unit" id="ns-mtorc1-node"><div class="eyebrow">Сеть инсулина · шаг 21 из 26</div><h2>Как AKT и AMPK вместе регулируют mTORC1</h2><p class="lead">mTORC1 — точка сходимости противоположных входов: инсулиновый сигнал через AKT его активирует, дефицит энергии через AMPK подавляет. AMPK тормозит mTORC1 даже при высоком инсулине, а AKT, в свою очередь, ослабляет активацию AMPK.</p><ol class="mech"><li>AKT фосфорилирует TSC2 и ослабляет его; <a href="#ns-g-S4-T52">AMPK</a> фосфорилирует другие сайты TSC2 (T1227 и S1345 у крысы; у человека T1271 и S1387) и усиливает его.</li><li>AMPK фосфорилирует Raptor (S722, S792), к нему присоединяется 14-3-3, и mTORC1 подавляется независимо от TSC2.</li><li>AKT фосфорилирует α1-субъединицу AMPK по S487 (у человека) и ослабляет фосфорилирование T172 киназой LKB1.</li></ol><p><a href="#ns-g-S4-T50">mTORC1</a> активен на лизосоме при двух условиях одновременно: аминокислоты через Rag-ГТФазы привлекают комплекс к лизосоме, а <a href="#ns-g-S4-T51">RHEB-GTP</a> его активирует. Инсулиновый сигнал обеспечивает второе условие: AKT подавляет TSC2, и RHEB накапливается в GTP-форме. Подробно это разобрано в семинаре 7.</p><p>AMPK активируется при дефиците энергии. Inoki и соавт. (2003) показали, что при энергетическом стрессе AMPK фосфорилирует TSC2 по T1227 и S1345 (нумерация белка крысы; у человека — T1271 и S1387) и усиливает его действие на RHEB — в противоположность AKT. Gwinn и соавт. (2008) нашли второй путь: AMPK фосфорилирует Raptor по S722 и S792, с ним связывается 14-3-3, и mTORC1 подавляется даже в клетках без TSC2. Поэтому при дефиците энергии синтез белка и липидов тормозится и при высоком инсулине.</p><p>Регуляция действует и в обратном направлении. AKT фосфорилирует α1-субъединицу AMPK по S487 (S485 у крысы) в участке ST-петли, и LKB1 хуже фосфорилирует T172 (Hawley 2014). α2-субъединица почти не фосфорилируется AKT: соответствующий сайт S491 фосфорилируется самой AMPK.</p><p>Состояние mTORC1 отражает баланс входов. Одна из ветвей AKT — FOXO1 — от AMPK этим путём не зависит, поэтому дефицит энергии может подавить синтез, не возвращая FOXO1 в ядро.</p><div class="note trap"><strong>Типичная ошибка</strong> AMPK подавляет инсулиновый сигнал на уровне рецептора, поэтому при её активации выключаются все ветви AKT.<p class="trap-fix">AMPK тормозит прежде всего mTORC1 — через TSC2 и Raptor. AKT остаётся фосфорилированной, и её другие ветви, например FOXO1, продолжают отвечать.</p></div><div class="static-quiz"><h3>К гепатоцитам добавили инсулин, затем возник дефицит энергии, и AMPK активировалась. Как изменятся p-S6K и локализация FOXO1 в модели?</h3><ol><li><b>А.</b> p-S6K снизится, FOXO1 перейдёт в ядро <i>(неверный вариант)</i><br><span class="expl">AMPK подавляет mTORC1, но не AKT; FOXO1 по-прежнему фосфорилирован и остаётся в цитоплазме.</span></li><li><b>Б.</b> p-S6K снизится, FOXO1 останется в цитоплазме <i>(верный вариант)</i><br><span class="expl">AMPK через TSC2 и Raptor подавляет mTORC1 и S6K; ветвь FOXO1 зависит от AKT, а та фосфорилирована.</span></li><li><b>В.</b> p-S6K не изменится: инсулин перевешивает <i>(неверный вариант)</i><br><span class="expl">AMPK тормозит mTORC1 и при высоком инсулине: фосфорилирование Raptor действует независимо от TSC2.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/s0092-8674(03)00929-2">Inoki K et al. 2003. TSC2 mediates cellular energy response to control cell growth and survival. Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2674027/">Gwinn DM et al. 2008. AMPK phosphorylation of raptor mediates a metabolic checkpoint. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4052680/">Hawley SA et al. 2014. Phosphorylation by Akt within the ST loop of AMPK-α1 down-regulates its activation in tumour cells. Biochem J</a></li><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C et al. 2023. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol</a></li></ul><p>Сайты TSC2 — Inoki и соавт. (2003; конструкция TSC2 крысы), Raptor — Gwinn и соавт. (2008), аннотации и базы OMIM/Reactome; AKT → AMPKα1 S487 — Hawley и соавт. (2014, полный текст). Схема — механизм, не данные опыта; ответ клеток без TSC2 — Gwinn и соавт. (2008).</p></details></article><article class="card print-unit" id="ns-network-feedback"><div class="eyebrow">Сеть инсулина · шаг 22 из 26</div><h2>Какие обратные связи ограничивают вход инсулиновой сети</h2><p class="lead">S6K фосфорилирует IRS1 по серинам и ослабляет его связь с PI3K — отрицательная обратная связь от mTORC1 к входу сети. Знак эффекта отдельного сайта зависит от системы: в культуре и в организме он может быть разным.</p><ol class="mech"><li>Активная <a href="#ns-g-S4-T53">S6K1</a> фосфорилирует IRS1 по серину; IRS1 хуже связывает PI3K, и сигнал к AKT ослабевает.</li><li><a href="#ns-g-S4-T59">Рапамицин</a> подавляет mTORC1 и S6K; петля ослабевает, и p-AKT повышается. Так бывает при кратком действии; длительный рапамицин в ряде клеток нарушает сборку mTORC2 и снижает p-AKT (Sarbassov 2006).</li><li>На уровне организма тоже есть петли: ингибитор PI3Kα вызывает гипергликемию, а компенсаторное повышение концентрации инсулина вновь активирует PI3K в опухоли.</li></ol><p>Tremblay и Marette (2001) показали на мышечных клетках L6, что избыток аминокислот за час снижал стимулированный инсулином транспорт глюкозы почти вдвое; рапамицин это предотвращал. Аминокислоты через mTOR и S6K усиливали фосфорилирование IRS1 по серину и треонину и уменьшали его связь с p85. Harrington и соавт. (2004) нашли ту же петлю в клетках без TSC: постоянно активная S6K фосфорилировала IRS1 (S302 у мыши), и AKT активировалась слабо. Мыши без S6K1 на высокожировой диете сохраняли чувствительность к инсулину, хотя глюкоза и свободные жирные кислоты у них повышались (Um 2004). В адипоцитах 3T3-L1, впрочем, чувствительная к рапамицину петля, ограничивающая фосфорилирование AKT, по-видимому, идёт не через IRS1 (Tan 2012).</p><p>Но переносить вывод о роли одного сайта на целый организм нужно с осторожностью. Мыши, у которых Ser307 в IRS1 (Ser312 у человека) заменён на аланин, на высокожировой диете развивали более тяжёлую, а не более лёгкую инсулинорезистентность (Copps 2010). В краткосрочных опытах на культуре клеток фосфорилирование этого сайта ослабляет сигнал, а в длительных опытах на целом организме его роль иная. IRS1 тормозят несколько частично избыточных петель, и удаление одной перераспределяет вклад остальных.</p><p>Обратные связи действуют и между органами. Ингибиторы PI3Kα подавляют ответ на инсулин в мышцах, жире и печени и вызывают гипергликемию в первые часы. Поджелудочная железа отвечает выбросом инсулина, который вновь активирует PI3K в опухоли. В моделях на мышах кетогенная диета и ингибиторы SGLT2 снижали этот выброс и усиливали действие препарата (Hopkins 2018).</p><p>Наличие фосфорилированного «тормозящего» сайта само по себе не доказывает инсулинорезистентность: нужна проверка причинной связи.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование IRS1 по Ser307 всегда вызывает инсулинорезистентность.<p class="trap-fix">В культуре клеток это фосфорилирование связано с ослаблением сигнала, но у мышей с заменой Ser307 резистентность была тяжелее. Знак эффекта зависит от системы и длительности.</p></div><div class="static-quiz"><h3>В модели гепатоцита (стационарный расчёт, mTORC2 сохранён) при умеренном инсулине добавили рапамицин. Как изменится p-AKT?</h3><ol><li><b>А.</b> Повысится: ослабнет петля S6K → IRS1 <i>(верный вариант)</i><br><span class="expl">Рапамицин подавляет S6K, IRS1 меньше фосфорилируется по серину и лучше передаёт сигнал к PI3K и AKT.</span></li><li><b>Б.</b> Снизится: рапамицин подавляет AKT <i>(неверный вариант)</i><br><span class="expl">Рапамицин действует на mTORC1, ниже AKT; AKT при этом не подавляется.</span></li><li><b>В.</b> Не изменится: петли нет <i>(неверный вариант)</i><br><span class="expl">Отрицательная петля S6K → IRS1 показана в клетках разных типов; в модели её ослабление повышает p-AKT. При длительном действии рапамицин в ряде клеток нарушает сборку mTORC2 и снижает p-AKT (Sarbassov 2006) — этого модель не учитывает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.M106703200">Tremblay F et al. 2001. Amino acid and insulin signaling via the mTOR/p70 S6 kinase pathway. A negative feedback mechanism leading to insulin resistance in skeletal muscle cells. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2172316/">Harrington LS et al. 2004. The TSC1-2 tumor suppressor controls insulin-PI3K signaling via regulation of IRS proteins. J Cell Biol</a></li><li><a href="https://doi.org/10.1038/nature02866">Um SH et al. 2004. Absence of S6K1 protects against age- and diet-induced obesity while enhancing insulin sensitivity. Nature</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3314336/">Copps KD et al. 2010. Irs1 serine 307 promotes insulin sensitivity in mice. Cell Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6197057/">Hopkins BD et al. 2018. Suppression of insulin feedback enhances the efficacy of PI3K inhibitors. Nature</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3307283/">Tan SX et al. 2012. Amplification and demultiplexing in insulin-regulated Akt protein kinase pathway in adipocytes. J Biol Chem</a></li><li><a href="https://doi.org/10.1016/j.molcel.2006.03.029">Sarbassov DD et al. 2006. Prolonged rapamycin treatment inhibits mTORC2 assembly and Akt/PKB. Mol Cell</a></li></ul><p>L6 (Tremblay и Marette 2001), клетки без TSC (Harrington 2004, полный текст), мыши без S6K1 (Um 2004), мыши Irs1 S307A (Copps 2010), ингибиторы PI3K в моделях на мышах (Hopkins 2018, полный текст). Столбики — учебная модель практикума (вопрос 4).</p></details></article><article class="card print-unit" id="ns-selective-ir"><div class="eyebrow">Сеть инсулина · шаг 23 из 26</div><h2>Что такое селективная инсулинорезистентность печени</h2><p class="lead">При селективной резистентности инсулин плохо подавляет глюконеогенез, но продолжает стимулировать липогенез. Это рассогласование ветвей одной сети, а не равномерное ослабление сигнала.</p><ol class="mech"><li>У мышей ob/ob — модели диабета 2 типа — печень продолжает выделять глюкозу при высоком инсулине, а <a href="#ns-g-S4-T55">SREBP-1c</a> и липогенез сохранены или усилены.</li><li>У мышей LIRKO (нет рецептора инсулина в гепатоцитах) не отвечает ни одна ветвь: SREBP-1c снижен, гипертриглицеридемии нет.</li><li>Ветви расходятся ниже AKT: подавление глюконеогенеза идёт через FOXO1, липогенез — через mTORC1 и SREBP-1c.</li></ol><p>При диабете 2 типа резистентность печени к инсулину неполная: ветви инсулинового сигнала затронуты по-разному. Инсулин хуже подавляет глюконеогенез, и печень выделяет глюкозу при высокой концентрации гормона. Но липогенез через SREBP-1c сохраняется или усиливается. В итоге гипергликемия сочетается с гипертриглицеридемией — эту картину Brown и Goldstein (2008) назвали <a href="#ns-g-S4-T56">селективной (избирательной) инсулинорезистентностью</a>.</p><p>Shimomura и соавт. (2000) нашли в печени мышей ob/ob и мышей с липодистрофией сниженную экспрессию IRS-2 при сохранённой способности инсулина стимулировать SREBP-1c. Полное выключение рецептора даёт иную картину: у мышей <a href="#ns-g-S4-T57">LIRKO</a> печень не отвечает на инсулин, возникает проатерогенный профиль липопротеинов, но SREBP-1c и секреция триглицеридов печенью снижены (Biddinger 2008). Это разные типы нарушения сети, а не точки одного градиента.</p><p>Почему одна ветвь страдает, а другая нет, до конца не установлено. Ветви расходятся ниже AKT и используют разных посредников (FOXO1 и mTORC1). По данным Titchenell и соавт. (2016), подавление продукции глюкозы печенью в значительной мере зависит от того, как инсулин подавляет липолиз в жировой ткани, тогда как липогенез требует сигнала в самом гепатоците.</p><p>В модели практикума рассогласование задано так: ветви AKT различаются чувствительностью, и при сниженном IRS-2 и высоком инсулине сигнала хватает для mTORC1, но не для FOXO1. Это учебное допущение, а не установленный механизм: в адипоцитах 3T3-L1 фосфорилирование FOXO1, напротив, чувствительнее к инсулину, чем фосфорилирование TSC2 и AS160 (Tan 2012). Данные Titchenell и соавт. (2016) указывают на другое объяснение: сигнал в гепатоците сохранён и поддерживает липогенез, а продукцию глюкозы печенью не подавляет избыток жирных кислот, поступающих из жировой ткани. И ещё одно ограничение: модель и опыты с мРНК сравнивают маркеры ветвей (мРНК PEPCK, мРНК и ядерный белок SREBP-1c), а не скорости глюконеогенеза и липогенеза; продукция глюкозы печенью включает и гликогенолиз.</p><div class="note trap"><strong>Типичная ошибка</strong> При инсулинорезистентности все действия инсулина в печени ослаблены одинаково.<p class="trap-fix">При селективной резистентности подавление глюконеогенеза ослаблено, а липогенез сохранён. Полная потеря рецептора (LIRKO) даёт иной фенотип.</p></div><div class="static-quiz"><h3>Чем селективная инсулинорезистентность печени отличается от полной потери рецептора (LIRKO)?</h3><ol><li><b>А.</b> Липогенез сохранён, а глюконеогенез не подавляется <i>(верный вариант)</i><br><span class="expl">Ветвь mTORC1–SREBP-1c отвечает на инсулин, ветвь FOXO1 — нет; при LIRKO не отвечает ни одна ветвь.</span></li><li><b>Б.</b> Глюконеогенез подавлен, а липогенез нарушен <i>(неверный вариант)</i><br><span class="expl">Это обратная картина. При селективной резистентности печень продолжает выделять глюкозу и синтезировать липиды.</span></li><li><b>В.</b> Ничем: при обоих состояниях нет ответа ни одной ветви <i>(неверный вариант)</i><br><span class="expl">При селективной резистентности ранние звенья работают и липогенная ветвь отвечает; этим и различаются фенотипы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cmet.2007.12.009">Brown MS et al. 2008. Selective versus total insulin resistance: a pathogenic paradox. Cell Metab</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10949029/">Shimomura I et al. 2000. Decreased IRS-2 and increased SREBP-1c lead to mixed insulin resistance and sensitivity in livers of lipodystrophic and ob/ob mice. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4251554/">Biddinger SB et al. 2008. Hepatic insulin resistance is sufficient to produce dyslipidemia and susceptibility to atherosclerosis. Cell Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4909537/">Titchenell PM et al. 2016. Direct hepatocyte insulin signaling is required for lipogenesis but is dispensable for the suppression of glucose production. Cell Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3307283/">Tan SX et al. 2012. Amplification and demultiplexing in insulin-regulated Akt protein kinase pathway in adipocytes. J Biol Chem</a></li></ul><p>Мыши ob/ob и с липодистрофией (Shimomura 2000), LIRKO (Biddinger 2008), понятие селективной резистентности (Brown и Goldstein 2008), вклад жировой ткани (Titchenell 2016, полный текст), чувствительность субстратов AKT в адипоцитах (Tan 2012, полный текст). Столбики — учебная модель практикума (вопрос 4п); допущение о разной чувствительности ветвей — учебное.</p></details></article><article class="card print-unit" id="ns-test-branches"><div class="eyebrow">Сеть инсулина · шаг 24 из 26</div><h2>Как проверяют, где расходятся ветви сети</h2><p class="lead">Точку разветвления находят с помощью воздействий, которые выключают одну ветвь и оставляют другую. Рапамицин блокирует индукцию мРНК SREBP-1c, но не подавление мРНК PEPCK; ингибиторы PI3K и AKT блокируют обе.</p><ol class="mech"><li>В гепатоцитах крысы рапамицин блокировал индукцию мРНК SREBP-1c инсулином, но не мешал снижению мРНК PEPCK (Li 2010).</li><li>Ингибиторы PI3K и AKT блокировали обе ветви — значит, они расходятся ниже AKT.</li><li><a href="#ns-g-S4-T58">Резерв сети</a>: умеренное ослабление ранних узлов — числа рецепторов или фосфорилирования AKT — не обязательно меняет выход.</li></ol><p>Li, Brown и Goldstein (2010) добавляли инсулин к свежевыделенным гепатоцитам крысы: мРНК SREBP-1c возрастала примерно в 25 раз, мРНК PEPCK снижалась примерно на 95 %. Ингибиторы PI3K и AKT блокировали оба ответа. Рапамицин в субнаномолярной концентрации блокировал индукцию мРНК SREBP-1c, но не подавление PEPCK; тот же результат получен у крыс и мышей при кормлении после голодания. Ингибитор S6K индукцию мРНК SREBP-1c не блокировал.</p><p>Отсюда вывод: ветви расходятся ниже AKT, на уровне mTORC1, а индукция мРНК SREBP-1c использует мишень mTORC1, отличную от S6K. Это относится к измеренной величине — мРНК. Owen и соавт. (2012) на гепатоцитах трансгенных крыс, у которых SREBP-1c синтезируется под постоянным промотором, отдельно изучили протеолитическое созревание белка: оно тоже требует mTORC1, но, в отличие от индукции мРНК, блокируется ингибитором S6K. Значит, после mTORC1 липогенная ветвь сама разветвляется. Именно на уровне mTORC1 возможно рассогласование ветвей при селективной резистентности.</p><p>Интерпретируя измерения, нужно учитывать резерв сети. В адипоцитах крупных тучных крыс число рецепторов инсулина было снижено на 30–40 %, но это лишь сдвигало кривую «доза — ответ» вправо, а максимальный транспорт глюкозы не менялся (Olefsky 1976). В адипоцитах 3T3-L1 подавление фосфорилирования AKT примерно на 85 % лишь немного снижало фосфорилирование её субстратов (Tan 2012). Поэтому умеренное изменение раннего узла не обязательно объясняет изменение физиологического ответа.</p><p>Наконец, фосфорилирование не тождественно активности: вывод о ветви делают по её выходу — фосфорилированию субстрата, локализации фактора, экспрессии гена-мишени.</p><div class="note trap"><strong>Типичная ошибка</strong> Если в печени снижено фосфорилирование AKT, то обязательно и пропорционально ослаблены все её действия.<p class="trap-fix">У сети есть резерв: умеренное снижение p-AKT может почти не менять фосфорилирование субстратов, а ветви ниже AKT регулируются по-разному.</p></div><div class="static-quiz"><h3>Рапамицин блокирует индукцию мРНК SREBP-1c инсулином, но не подавление мРНК PEPCK, а ингибитор AKT блокирует оба ответа. Где расходятся эти ветви?</h3><ol><li><b>А.</b> Выше PI3K, на уровне рецептора <i>(неверный вариант)</i><br><span class="expl">Ингибиторы PI3K и AKT блокируют обе ветви, значит, до AKT они общие.</span></li><li><b>Б.</b> Ниже AKT: индукция мРНК SREBP-1c требует mTORC1 <i>(верный вариант)</i><br><span class="expl">Оба ответа зависят от AKT, а рапамицин выключает только индукцию мРНК SREBP-1c: разветвление ниже AKT, на уровне mTORC1.</span></li><li><b>В.</b> На уровне S6K <i>(неверный вариант)</i><br><span class="expl">Ингибитор S6K не блокировал индукцию мРНК SREBP-1c (Li 2010). S6K нужна для другого этапа — созревания белка SREBP-1c (Owen 2012).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-4.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2840492/">Li S et al. 2010. Bifurcation of insulin signaling pathway in rat liver: mTORC1 required for stimulation of lipogenesis, but not inhibition of gluconeogenesis. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3479583/">Owen JL et al. 2012. Insulin stimulation of SREBP-1c processing in transgenic rat hepatocytes requires p70 S6-kinase. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC436727/">Olefsky JM 1976. The effects of spontaneous obesity on insulin binding, glucose transport, and glucose oxidation of isolated rat adipocytes. J Clin Invest</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3307283/">Tan SX et al. 2012. Amplification and demultiplexing in insulin-regulated Akt protein kinase pathway in adipocytes. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/s42255-025-01349-z">Burchfield JG et al. 2025. The insulin signalling network. Nat Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4909537/">Titchenell PM et al. 2016. Direct hepatocyte insulin signaling is required for lipogenesis but is dispensable for the suppression of glucose production. Cell Metab</a></li></ul><p>Гепатоциты крысы (Li 2010, аннотация: 25 раз, 95 %, субнаномолярный рапамицин; измерялась мРНК); созревание SREBP-1c — гепатоциты трансгенных крыс (Owen 2012, аннотация); резерв сети — адипоциты (Olefsky 1976, аннотация), адипоциты 3T3-L1 (Tan 2012, полный текст) и обзор Burchfield и соавт. (2025); роль жировой ткани — Titchenell и соавт. (2016). Таблица — схема опытов.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 25 из 26</div><h2>Как выбрать измеряемую величину, метод и контроль</h2><p class="lead">Каждый вопрос семинара требует своей величины: крутизна — кривой доз, длительность — серии точек времени, переключатель — ответа отдельных клеток, ветвление — выходов разных ветвей. Метод выбирают по величине, а контроль — по тому, какое другое объяснение нужно исключить.</p><ol class="mech"><li>Оптогенетический вход задаёт профиль сигнала в обход рецептора и позволяет установить, на какой профиль сигнала отвечает нижележащий процесс.</li><li>Измерение отдельных ооцитов отличает переключатель «всё или ничего» от плавного ответа, который возникает при усреднении.</li><li>Тканеспецифический нокаут (система <a href="#ns-g-S4-T60">Cre–loxP</a>) выключает ген в одном типе клеток и позволяет отличить прямое действие от действия через другие органы.</li></ol><p>Оптогенетика позволяет экспериментатору задавать входной сигнал. В опытах Toettcher и соавт. (2013) на мембране закрепили фоторецептор PhyB, а каталитический домен SOS соединили с белком PIF. Красный свет переводит PhyB в форму, связывающую PIF, и SOS переходит к мембране, где активирует RAS; дальний красный свет возвращает его в цитоплазму. Так можно подать на RAS импульс заданной длительности, не меняя рецепторы и их петли. Контроль — тот же свет в клетках без конструкции.</p><p>Переключатель проверяют по отдельным клеткам. Ferrell и Machleder (1998) измеряли активацию MAPK в каждом ооците лягушки отдельно. При промежуточной дозе прогестерона часть ооцитов была полностью активна, остальные — неактивны, а среднее по популяции выглядело плавным. Ответ отдельного ооцита соответствовал эффективному коэффициенту Хилла не меньше 35. Петлю проверяли так: в ооцитах с циклогексимидом Mos не синтезируется, и MAPK активировали введённым белком Mos — ответ отдельного ооцита становился постепенным (Ferrell 1999).</p><p>Действие гормона в одном органе проверяют тканеспецифическим нокаутом. Участок гена окружают сайтами loxP, а рекомбиназу Cre экспрессируют под контролем промотора, активного только в гепатоцитах, например промотором гена альбумина. Cre вырезает участок между сайтами, и белок исчезает только в печени. Так получены мыши LIRKO (Michael 2000) и мыши без AKT1/2 в печени (Titchenell 2016). Контроль — мыши с сайтами loxP, но без Cre.</p><p>Одно воздействие показывает зависимость, но не доказывает её. Вывод надёжен, если его подтверждают два независимых способа — например, ингибитор и siRNA к тому же белку, — а результат не зависит от побочного действия каждого. В опыте Li и соавт. (2010) ингибиторы PI3K, AKT, mTORC1 и S6K вместе указали, где расходятся ветви.</p><p>Два метода практикума измеряют то, что не видно на обычном блоте. Активный RAS выделяют из лизата доменом RAF, связывающим RAS (RBD), закреплённым на гранулах: он связывает только GTP-форму, и связавшийся RAS выявляют на блоте. Количество мРНК, например PEPCK, определяют методом ОТ-ПЦР: обратная транскриптаза переписывает мРНК в кДНК, которую затем умножают в ПЦР; чем больше исходной мРНК, тем раньше продукт достигает порога.</p><div class="note trap"><strong>Типичная ошибка</strong> Если среднее по популяции растёт плавно, то и каждая клетка отвечает плавно.<p class="trap-fix">Плавное среднее может складываться из ответов «всё или ничего» в отдельных клетках с разным порогом. Переключатель видно только при измерении отдельных клеток.</p></div><div class="static-quiz"><h3>Нужно проверить, работает ли ответ клеток как переключатель «всё или ничего». Какой опыт для этого подходит?</h3><ol><li><b>А.</b> Измерить ответ отдельных клеток при разных дозах <i>(верный вариант)</i><br><span class="expl">Только отдельные клетки показывают, есть ли два состояния; при промежуточной дозе часть клеток включена полностью, часть — нет.</span></li><li><b>Б.</b> Измерить лизат всей популяции при разных дозах <i>(неверный вариант)</i><br><span class="expl">Измерение в лизате усредняет ответ клеток: из ответов «всё или ничего» с разным порогом складывается плавная кривая.</span></li><li><b>В.</b> Добавить ингибитор MEK при одной дозе <i>(неверный вариант)</i><br><span class="expl">Ингибитор покажет зависимость ответа от MEK, но не форму ответа отдельной клетки.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-4.html#q1">Вопрос 1 →</a> <a href="seminar-4.html#q2">Вопрос 2 →</a> <a href="seminar-4.html#q3">Вопрос 3 →</a> <a href="seminar-4.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3925772/">Toettcher JE et al. 2013. Using optogenetics to interrogate the dynamic control of signal transmission by the Ras/Erk module. Cell</a></li><li><a href="https://doi.org/10.1126/science.280.5365.895">Ferrell JE et al. 1998. The biochemical basis of an all-or-none cell fate switch in Xenopus oocytes. Science</a></li><li><a href="https://doi.org/10.1002/(SICI)1521-1878(199910)21:10&lt;866::AID-BIES9&gt;3.0.CO;2-1">Ferrell JE 1999. Building a cellular switch: more lessons from a good egg. Bioessays</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10949030/">Michael MD et al. 2000. Loss of insulin signaling in hepatocytes leads to severe insulin resistance and progressive hepatic dysfunction. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4909537/">Titchenell PM et al. 2016. Direct hepatocyte insulin signaling is required for lipogenesis but is dispensable for the suppression of glucose production. Cell Metab</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2840492/">Li S et al. 2010. Bifurcation of insulin signaling pathway in rat liver: mTORC1 required for stimulation of lipogenesis, but not inhibition of gluconeogenesis. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3314336/">Copps KD et al. 2010. Irs1 serine 307 promotes insulin sensitivity in mice. Cell Metab</a></li></ul><p>Оптогенетика — клетки NIH3T3 (Toettcher 2013, полный текст); ооциты Xenopus (Ferrell и Machleder 1998, аннотация и обзор Ferrell 1999); Cre–loxP в печени — Michael и соавт. (2000, аннотация) и Titchenell и соавт. (2016, полный текст); анализ ветвей — Li и соавт. (2010). Схемы показывают устройство методов, не результаты опыта.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 26 из 26</div><h2>Один каскад под действием ингибитора: четыре вопроса вместе</h2><p class="lead">Опухоль с BRAF V600E под действием препарата объединяет все четыре вопроса семинара: усиление, длительность, обратные связи и перекрёстная регуляция сетей. Успех лечения в модели определяет не минимум pERK в первый час, а то, сколько активности ERK остаётся за сутки.</p><ol class="mech"><li>Усиление и резерв: остаточная активность RAF усиливается каскадом, а клеткам для деления хватает небольшой доли активной ERK.</li><li>Длительность и обратная связь: вемурафениб снимает ERK-зависимое торможение, и через часы pERK частично восстанавливается.</li><li>Перекрёстная регуляция сетей: при подавлении одного пути отвечают соседние — у ингибиторов PI3K это выброс инсулина, вновь активирующий PI3K в опухоли.</li></ol><p>Вопрос 1 — усиление. Каскад усиливает сигнал, поэтому даже небольшая остаточная активность RAF поддерживает заметную долю pERK. Albeck и соавт. (2013) показали в эпителиальных клетках MCF-10A, что пролиферация останавливалась, только когда выход пути ERK (по уровню белка Fra-1) падал ниже примерно 10 % исходного; подавление выхода на 85 % снижало пролиферацию меньше чем вдвое. Перенос этого порога на меланому — допущение, но вывод общий: подавление должно быть глубоким.</p><p>Вопросы 2 и 3 — длительность и обратная связь. Измерение pERK через час завышает эффект препарата. Lito и соавт. (2012) показали, что после добавления вемурафениба DUSP и SPRY исчезают за 4–8 ч, RAS-GTP растёт и образуются RAF-димеры, на которые препарат действует слабо. Поэтому нужно измерять серию точек за сутки и оценивать интегральную активность — площадь под кривой pERK. В учебной модели вемурафениб снижает её примерно до 40 % от уровня без препарата, а сочетание с ингибитором MEK — до 8 %.</p><p>Вопрос 4 — перекрёстная регуляция сетей. Hopkins и соавт. (2018) показали, что ингибиторы PI3Kα вызывают гипергликемию, выброс инсулина вновь активирует PI3K–mTOR в опухоли, а ограничение этого выброса усиливает действие препарата у мышей. Сигнальная сеть клетки встроена в сеть организма, и её ответ на препарат зависит от гормонов.</p><p>Вывод: чтобы оценить действие ингибитора, нужны кривая доз (крутизна и порог), серия точек во времени (отскок и площадь), измерение обратных связей (DUSP, SPRY, RAS-GTP) и учёт соседних путей. Выбор схемы лечения — решение онколога; пример иллюстрирует системный подход.</p><div class="note trap"><strong>Типичная ошибка</strong> Препарат эффективен, если через час после добавления pERK снизился на 80 %.<p class="trap-fix">Через час обратная связь ещё не перестроилась. Важно, сколько активности ERK остаётся за сутки, и ниже ли она порога, необходимого для деления клеток.</p></div><div class="static-quiz"><h3>Какой показатель лучше всего отражает действие ингибитора RAF на клетки меланомы за сутки?</h3><ol><li><b>А.</b> pERK через 1 ч после добавления <i>(неверный вариант)</i><br><span class="expl">Через час pERK минимален: отрицательная обратная связь ещё не снята, а восстановление pERK ещё не началось.</span></li><li><b>Б.</b> Площадь под кривой pERK за 24–48 ч <i>(верный вариант)</i><br><span class="expl">Площадь учитывает и глубину подавления, и частичное восстановление pERK после снятия обратной связи.</span></li><li><b>В.</b> Количество общей ERK через 24 ч <i>(неверный вариант)</i><br><span class="expl">Ингибитор RAF меняет фосфорилирование ERK, а не её количество; общая ERK служит контролем загрузки.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-4.html#q1">Вопрос 1 →</a> <a href="seminar-4.html#q2">Вопрос 2 →</a> <a href="seminar-4.html#q3">Вопрос 3 →</a> <a href="seminar-4.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4151532/">Albeck JG et al. 2013. Frequency-modulated pulses of ERK activity transmit quantitative proliferation signals. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3713778/">Lito P et al. 2012. Relief of profound feedback inhibition of mitogenic signaling by RAF inhibitors attenuates their activity in BRAFV600E melanomas. Cancer Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6197057/">Hopkins BD et al. 2018. Suppression of insulin feedback enhances the efficacy of PI3K inhibitors. Nature</a></li></ul><p>Порог 10 % — клетки MCF-10A (Albeck 2013, полный текст); отскок — клетки меланомы с BRAF V600E (Lito 2012, полный текст); выброс инсулина — модели на мышах (Hopkins 2018, полный текст). Кривые — учебная модель практикума (вопрос 3п), среда с сывороткой, относительные величины; площадь — за 48 ч относительно опыта без препарата.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S4-T01"><dt>Сигнальный каскад</dt><dd>Последовательность белков, в которой каждый активированный участник активирует следующий; в каскаде MAP-киназ это RAS → RAF → MEK → ERK.</dd></div><div id="ns-g-S4-T02"><dt>MAP-киназный каскад</dt><dd>Три последовательных уровня протеинкиназ (MAPKKK → MAPKK → MAPK); в пути ERK это RAF → MEK → ERK.</dd></div><div id="ns-g-S4-T03"><dt>Мотив TEY</dt><dd>Участок активационной петли ERK из треонина, глутамата и тирозина; фосфорилирование T202 и Y204 (у ERK1) делает ERK активной.</dd></div><div id="ns-g-S4-T04"><dt>Киназа двойной специфичности</dt><dd>Протеинкиназа, которая фосфорилирует и тирозин, и серин или треонин; так MEK фосфорилирует ERK по двум остаткам мотива TEY.</dd></div><div id="ns-g-S4-T05"><dt>Каталитическое усиление</dt><dd>Рост числа активных молекул по ходу каскада: одна активная киназа за время сигнала фосфорилирует много молекул субстрата.</dd></div><div id="ns-g-S4-T06"><dt>Сверхчувствительность</dt><dd>Ответ, который при небольшом изменении стимула около порога меняется от почти нулевого до почти максимального; крутизну описывают коэффициентом Хилла.</dd></div><div id="ns-g-S4-T07"><dt>Коэффициент Хилла</dt><dd>Показатель крутизны кривой «доза — ответ»: 1 соответствует гиперболической кривой, значения больше 1 — более крутому, сигмоидному ответу.</dd></div><div id="ns-g-S4-T08"><dt>Переключение нулевого порядка</dt><dd>Крутой ответ цикла модификации, когда киназа и фосфатаза насыщены субстратом; описан Goldbeter и Koshland (1981).</dd></div><div id="ns-g-S4-T09"><dt>Дистрибутивное фосфорилирование</dt><dd>Фосфорилирование двух сайтов, при котором фермент после первого присоединения фосфата отделяется от субстрата и для второго связывается с ним заново.</dd></div><div id="ns-g-S4-T10"><dt>Завершение сигнала</dt><dd>Возвращение пути в исходное состояние: гидролиз GTP в RAS, дефосфорилирование киназ, интернализация и разрушение рецептора.</dd></div><div id="ns-g-S4-T11"><dt>GAP (белок, активирующий ГТФазу)</dt><dd>Белок, который многократно ускоряет гидролиз GTP малой ГТФазой и тем самым переводит её в неактивную GDP-форму; для RAS это, например, нейрофибромин.</dd></div><div id="ns-g-S4-T12"><dt>SOS</dt><dd>Фактор обмена гуаниновых нуклеотидов (GEF) для RAS: заменяет GDP на GTP и активирует RAS у плазматической мембраны.</dd></div><div id="ns-g-S4-T13"><dt>Нейрофибромин (NF1)</dt><dd>GAP для RAS; потеря его функции при нейрофиброматозе 1 типа удлиняет и усиливает сигнал RAS.</dd></div><div id="ns-g-S4-T14"><dt>KRAS G12C</dt><dd>Онкогенная замена глицина 12 на цистеин в KRAS; мутантный белок почти нечувствителен к GAP и дольше остаётся в GTP-форме.</dd></div><div id="ns-g-S4-T15"><dt>Соторасиб</dt><dd>Ковалентный ингибитор KRAS G12C; связывается с цистеином 12 в GDP-форме белка и удерживает KRAS в неактивном состоянии.</dd></div><div id="ns-g-S4-T16"><dt>DUSP (фосфатазы двойной специфичности)</dt><dd>Фосфатазы, которые отщепляют фосфат и от треонина, и от тирозина мотива TEY и тем самым инактивируют ERK; часть из них синтезируется в ответ на сигнал ERK.</dd></div><div id="ns-g-S4-T17"><dt>Интернализация рецептора</dt><dd>Перенос рецептора с поверхности клетки в эндосомы; затем рецептор возвращается на мембрану или разрушается в лизосомах.</dd></div><div id="ns-g-S4-T18"><dt>pERK</dt><dd>Обозначение ERK, фосфорилированной по обоим остаткам мотива TEY. На графиках модели — рассчитанная доля такой ERK; на блоте антителами к фосфорилированной форме оценивают её относительное содержание после нормировки на общую ERK.</dd></div><div id="ns-g-S4-T19"><dt>Временной профиль сигнала</dt><dd>Изменение активности сигнального белка во времени; описывается амплитудой, длительностью, числом и частотой импульсов и площадью под кривой.</dd></div><div id="ns-g-S4-T20"><dt>Площадь под кривой</dt><dd>Интеграл активности по времени; одинаковая площадь может складываться из короткого высокого пика или длительного низкого плато.</dd></div><div id="ns-g-S4-T21"><dt>Клетки PC12</dt><dd>Линия клеток феохромоцитомы крысы; при действии NGF они дифференцируются в нейроноподобные клетки, при действии EGF — делятся.</dd></div><div id="ns-g-S4-T22"><dt>EGF и NGF</dt><dd>Факторы роста: эпидермальный фактор роста (EGF) и фактор роста нервов (NGF); активируют разные рецепторные тирозинкиназы — EGFR и TrkA.</dd></div><div id="ns-g-S4-T23"><dt>Ген немедленного ответа</dt><dd>Ген, транскрипция которого начинается в первые минуты после стимула без синтеза новых белков, например c-fos.</dd></div><div id="ns-g-S4-T24"><dt>c-Fos</dt><dd>Транскрипционный фактор, продукт гена немедленного ответа c-fos; при длительной активности ERK фосфорилируется и стабилизируется.</dd></div><div id="ns-g-S4-T25"><dt>DEF-мотив (FXFP)</dt><dd>Участок связывания ERK в субстрате; в c-Fos становится доступным после первого фосфорилирования и позволяет ERK фосфорилировать белок дальше.</dd></div><div id="ns-g-S4-T26"><dt>Оптогенетический вход</dt><dd>Управление сигнальным белком светом через светочувствительные белки; позволяет задать длительность и число импульсов в обход рецептора.</dd></div><div id="ns-g-S4-T27"><dt>Паракринная программа</dt><dd>Ответ, при котором клетка выделяет сигнальные белки, действующие на соседние клетки; так длительный сигнал RAS вызывает фосфорилирование STAT3.</dd></div><div id="ns-g-S4-T28"><dt>Популяционное измерение</dt><dd>Измерение суммарного сигнала многих клеток, например в лизате; оно показывает среднее и скрывает различия между клетками.</dd></div><div id="ns-g-S4-T29"><dt>Репортёр активности ERK</dt><dd>Белковый сенсор, флуоресценция которого меняется при фосфорилировании ERK; показывает динамику в отдельной живой клетке.</dd></div><div id="ns-g-S4-T30"><dt>Обратная связь</dt><dd>Связь, при которой выход пути влияет на его же вход или верхние звенья.</dd></div><div id="ns-g-S4-T31"><dt>Отрицательная обратная связь</dt><dd>Обратная связь, при которой выход пути ослабляет собственную активацию; ограничивает амплитуду и длительность сигнала.</dd></div><div id="ns-g-S4-T32"><dt>Положительная обратная связь</dt><dd>Обратная связь, при которой выход пути усиливает собственную активацию; может создавать устойчивое включённое состояние.</dd></div><div id="ns-g-S4-T33"><dt>SPRY и SPRED</dt><dd>Белки, синтез которых индуцирует ERK; ослабляют активацию RAS и RAF и тем самым замыкают медленную отрицательную петлю.</dd></div><div id="ns-g-S4-T34"><dt>Бистабильность</dt><dd>Существование двух устойчивых состояний при одном и том же стимуле; в каком из них находится система, зависит от предыстории.</dd></div><div id="ns-g-S4-T35"><dt>Гистерезис</dt><dd>Зависимость ответа от предыстории: порог включения выше, чем порог выключения.</dd></div><div id="ns-g-S4-T36"><dt>Необратимость ответа</dt><dd>Сохранение включённого состояния после удаления стимула; крайний случай гистерезиса.</dd></div><div id="ns-g-S4-T37"><dt>Бимодальное распределение</dt><dd>Распределение клеток по ответу с двумя пиками — включёнными и выключенными клетками без промежуточных.</dd></div><div id="ns-g-S4-T38"><dt>BRAF V600E</dt><dd>Мутация BRAF (замена валина 600 на глутамат), при которой киназа активна в виде мономера без RAS; частая мутация меланомы.</dd></div><div id="ns-g-S4-T39"><dt>Вемурафениб</dt><dd>Ингибитор мономера BRAF V600E; на RAF-димеры действует слабо.</dd></div><div id="ns-g-S4-T40"><dt>RAF-димеры</dt><dd>Комплексы двух молекул RAF (BRAF, CRAF), образующиеся при участии RAS-GTP; к ингибиторам мономера BRAF V600E относительно устойчивы.</dd></div><div id="ns-g-S4-T41"><dt>Точная адаптация</dt><dd>Возвращение ответа к исходному уровню при постоянном стимуле; новый скачок стимула вызывает новый ответ.</dd></div><div id="ns-g-S4-T42"><dt>Десенситизация</dt><dd>Снижение чувствительности системы после действия стимула, например из-за удаления рецепторов с поверхности клетки.</dd></div><div id="ns-g-S4-T43"><dt>Возбудимость</dt><dd>Свойство системы отвечать на стимул выше порога одним стандартным импульсом с последующим возвратом в покой.</dd></div><div id="ns-g-S4-T44"><dt>Рецептор инсулина (INSR)</dt><dd>Рецепторная тирозинкиназа; после связывания инсулина аутофосфорилируется и фосфорилирует адаптеры IRS.</dd></div><div id="ns-g-S4-T45"><dt>IRS1 и IRS2</dt><dd>Адаптеры рецептора инсулина; их фосфотирозины связывают регуляторную субъединицу PI3K.</dd></div><div id="ns-g-S4-T46"><dt>PI3K (фосфоинозитид-3-киназа)</dt><dd>Липидкиназа, которая фосфорилирует PIP₂ по 3-му положению инозитола с образованием PIP₃.</dd></div><div id="ns-g-S4-T47"><dt>PIP₃</dt><dd>Фосфатидилинозитол-3,4,5-трифосфат — липид мембраны, который связывает PH-домены AKT, PDK1 и SIN1.</dd></div><div id="ns-g-S4-T48"><dt>AKT (протеинкиназа B)</dt><dd>Серин-треониновая киназа; полностью активна после фосфорилирования киназами PDK1 (T308 у AKT1) и mTORC2 (S473 у AKT1).</dd></div><div id="ns-g-S4-T49"><dt>Снятие торможения</dt><dd>Активация процесса путём подавления его ингибитора: так AKT, подавляя TSC2, растормаживает mTORC1.</dd></div><div id="ns-g-S4-T50"><dt>mTORC1</dt><dd>Комплекс киназы mTOR с Raptor; активируется на лизосоме при достатке аминокислот и RHEB-GTP и стимулирует синтез белков и липидов.</dd></div><div id="ns-g-S4-T51"><dt>TSC2 и RHEB</dt><dd>TSC2 — GAP для малой ГТФазы RHEB; RHEB в GTP-форме активирует mTORC1. AKT ослабляет TSC2, AMPK усиливает его.</dd></div><div id="ns-g-S4-T52"><dt>AMPK</dt><dd>Протеинкиназа, активируемая при дефиците энергии; подавляет mTORC1 через TSC2 и Raptor.</dd></div><div id="ns-g-S4-T53"><dt>S6K1</dt><dd>Киназа, активируемая mTORC1; фосфорилирует рибосомный белок S6 и IRS1, замыкая отрицательную петлю.</dd></div><div id="ns-g-S4-T54"><dt>FOXO1</dt><dd>Транскрипционный фактор, активирующий гены глюконеогенеза; после фосфорилирования под действием AKT выводится из ядра.</dd></div><div id="ns-g-S4-T55"><dt>SREBP-1c</dt><dd>Транскрипционный фактор, активирующий гены синтеза жирных кислот. Инсулин через mTORC1 усиливает транскрипцию его гена (без участия S6K) и протеолитическое созревание белка (с участием S6K), после которого N-концевая часть переходит в ядро.</dd></div><div id="ns-g-S4-T56"><dt>Селективная (избирательная) инсулинорезистентность</dt><dd>Состояние печени, при котором инсулин плохо подавляет глюконеогенез, но продолжает стимулировать липогенез.</dd></div><div id="ns-g-S4-T57"><dt>LIRKO</dt><dd>Мыши без рецептора инсулина в гепатоцитах; печень не отвечает на инсулин ни по одной ветви.</dd></div><div id="ns-g-S4-T58"><dt>Резерв сети</dt><dd>Избыток сигнальной способности: максимальный ответ сохраняется при заметном ослаблении ранних звеньев.</dd></div><div id="ns-g-S4-T59"><dt>Рапамицин</dt><dd>Ингибитор mTORC1; в комплексе с белком FKBP12 связывает mTOR и подавляет часть его функций. При длительном действии в ряде клеток нарушает и сборку mTORC2.</dd></div><div id="ns-g-S4-T60"><dt>Cre–loxP</dt><dd>Система рекомбинации: фермент Cre вырезает участок ДНК между двумя сайтами loxP; позволяет выключить ген в одном типе клеток.</dd></div><div id="ns-g-S4-T61"><dt>Вестерн-блот</dt><dd>Разделение белков лизата электрофорезом, перенос на мембрану и выявление нужного белка или его фосфорилированной формы антителами.</dd></div><div id="ns-g-S4-T62"><dt>FRET-сенсор</dt><dd>Белок с двумя флуоресцентными доменами; при изменении расстояния между ними меняется перенос энергии (FRET) и отношение цветов свечения.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 4 — Динамика, обратные связи и интеграция сигналов","home_eyebrow":"Семинар 4 · самостоятельная подготовка","home_h1":"Как профиль сигнала\nопределяет ответ клетки","home_lead":"Меняйте дозу, длительность и обратные связи в моделях каскада ERK и сети инсулина и проследите, как от профиля сигнала зависит ответ клетки.","start":"Начать с каскада MAP-киназ →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в этот интерактив. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат опыта","practice_p":"37 сценариев с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 3.1 · учебные материалы кафедры биологии и генетики.","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод из опыта. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов из разных разделов. После ответа откройте разбор. Если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 37 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Динамика, обратные связи и интеграция сигналов","stats":[["4 механизма","от каскада к сети"],["Объяснения","с вопросами для самопроверки"],["37 сценариев","в отдельном практикуме"]],"num_fmt":"4.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Раздел I: семинары"},"lessons":[{"id":"cascade","section":0,"questions":[1],"title":"Как устроен каскад RAS → RAF → MEK → ERK","keywords":["RAS","RAF","MEK","ERK","TEY","EGFR","SOS","каскад"],"lead":["[[T01|Сигнальный каскад]] MAP-киназ передаёт сигнал от активированного рецептора через три последовательных киназных уровня.","Его устройство объясняет, почему каскад способен и усиливать сигнал, и быстро его завершать — этому посвящён вопрос 1 практикума."],"mechanism":["Рецептор EGF связывает лиганд, адаптер GRB2 переносит [[T12|SOS]] к мембране, и SOS переводит RAS в GTP-форму.","RAS-GTP привлекает RAF к мембране; активная RAF фосфорилирует MEK, а MEK — [[T04|киназа двойной специфичности]] — фосфорилирует ERK по [[T03|мотиву TEY]].","Активная ERK фосфорилирует сотни субстратов в цитоплазме и ядре, в том числе белки, которые затем тормозят верхние уровни каскада."],"paragraphs":["[[T02|MAP-киназный каскад]] RAF → MEK → ERK начинается у плазматической мембраны. После связывания EGF рецептор фосфорилирует тирозины своих цитоплазматических участков; к ним присоединяется адаптер GRB2, связанный с фактором обмена нуклеотидов SOS. SOS катализирует замену GDP на GTP в RAS, и RAS-GTP привлекает к мембране RAF.","Активация RAF многоступенчатая: RAF освобождается от аутоингибирования, локально дефосфорилируется и образует димеры. Активная RAF фосфорилирует MEK1/2 по двум серинам активационной петли. MEK занимает особое положение: это киназа двойной специфичности, которая фосфорилирует и треонин, и тирозин мотива TEY в ERK. Других физиологических субстратов у MEK практически нет, поэтому на этом уровне сходятся сигналы многих вышестоящих киназ.","ERK активна, когда фосфорилированы оба остатка мотива TEY (T202 и Y204 у ERK1 человека). In vitro MEK фосфорилирует их по очереди, отделяясь от ERK между двумя реакциями; в клетке из-за высокой плотности белков (макромолекулярной скученности) этот процесс может становиться почти непрерывным (квазипроцессивным). Активная ERK фосфорилирует транскрипционные факторы в ядре, киназы RSK и белки цитоскелета в цитоплазме.","Ингибитор MEK блокирует передачу сигнала от MEK к ERK, но не мешает активации RAS и RAF. Так можно проверить, какие события зависят именно от ERK."],"trap":["Каскад — это простая цепочка «включателей»: каждый уровень лишь передаёт сигнал дальше.","Каждый уровень — фермент со своей кинетикой. От соотношения киназ, фосфатаз и их субстратов зависят и усиление, и крутизна, и завершение сигнала, а ERK тормозит верхние уровни каскада."],"conditions":"Схема механизма составлена по обзорам Martín-Vega и Cobb (2023), Lavoie и соавт. (2020), а также по главе 4 пособия. Дистрибутивное фосфорилирование ERK показано in vitro (Ferrell и Bhatt 1997); квазипроцессивное — в клетках HeLa (Aoki 2011). Нумерация сайтов — для ERK1 человека.","sources":["MartinVegaCobb2023","Lavoie2020","FerrellBhatt1997","Aoki2011"],"quiz":{"id":"S4-L01","question":"В клетки добавили EGF и аллостерический ингибитор MEK. Какие уровни каскада будут активированы?","options":[{"id":"S4-L01-1","text":"RAS и RAF активируются, ERK почти не фосфорилирована","correct":true,"feedback":"Ингибитор MEK действует ниже RAF: рецептор, SOS, RAS и RAF отвечают на EGF, а передача сигнала от MEK к ERK заблокирована."},{"id":"S4-L01-2","text":"Ни один уровень не активируется: ингибитор блокирует рецептор","correct":false,"feedback":"Ингибитор MEK не связывается с рецептором EGF. Верхние уровни каскада по-прежнему отвечают на лиганд."},{"id":"S4-L01-3","text":"ERK фосфорилируется, но RAS остаётся в GDP-форме","correct":false,"feedback":"Порядок обратный: RAS находится выше MEK и активируется, а фосфорилирование ERK, которое выполняет MEK, подавлено."}]},"widget":{"kind":"net","title":"","s":{"title":"Каскад RAS → RAF → MEK → ERK","status":"Схема механизма · не экспериментальные данные","modes_label":"Состояние","modes":["Покой","EGF связан с рецептором","Каскад активен","EGF и ингибитор MEK"],"h":260,"w":640,"areas":[{"kind":"mem","y":70,"lx":10,"ly":60,"label":"плазматическая мембрана"},{"x":10,"y":250,"label":"цитоплазма"}],"nodes":[{"id":"egfr","x":20,"y":100,"w":86,"label":"EGFR"},{"id":"sos","x":126,"y":100,"w":104,"label":"GRB2·SOS","fs":14},{"id":"ras","x":250,"y":100,"w":76,"label":"RAS"},{"id":"raf","x":346,"y":100,"w":76,"label":"RAF"},{"id":"mek","x":442,"y":100,"w":76,"label":"MEK"},{"id":"erk","x":538,"y":100,"w":82,"label":"ERK"},{"id":"tgt","x":470,"y":190,"w":150,"h":40,"label":"субстраты ERK","fs":14}],"edges":[{"id":"e1","pts":[106,120,124,120],"type":"act"},{"id":"e2","pts":[230,120,248,120],"type":"act"},{"id":"e3","pts":[326,120,344,120],"type":"act"},{"id":"e4","pts":[422,120,440,120],"type":"act"},{"id":"e5","pts":[518,120,536,120],"type":"act"},{"id":"e6","pts":[580,142,560,186],"type":"act"}],"states":[{"on":[],"note":"Без лиганда рецептор не фосфорилирован, RAS связан с GDP, RAF, MEK и ERK неактивны."},{"on":["egfr","sos","ras"],"p":["egfr"],"show":["e1","e2"],"note":"EGF связан, рецептор фосфорилирован; GRB2 переносит SOS к мембране, и RAS переходит в GTP-форму. Нижние уровни ещё не активированы."},{"on":["egfr","sos","ras","raf","mek","erk","tgt"],"p":["egfr","mek","erk"],"show":["e1","e2","e3","e4","e5","e6"],"note":"RAS-GTP привлекает RAF; RAF фосфорилирует MEK, MEK — ERK по мотиву TEY; активная ERK фосфорилирует свои субстраты."},{"on":["egfr","sos","ras","raf"],"p":["egfr"],"show":["e1","e2","e3"],"drugs":[[440,172,"ингибитор MEK"]],"note":"Ингибитор MEK не мешает активации RAS и RAF, но блокирует фосфорилирование ERK: субстраты ERK не фосфорилируются."}]}},"number":1,"question":1},{"id":"amplification","section":0,"questions":[1],"title":"Что такое каталитическое усиление и где оно возникает","keywords":["усиление","концентрация","RAF","MEK","ERK","Fujioka"],"lead":["Усиление показывает, во сколько раз активных молекул на выходе больше, чем на входе.","В каскаде ERK оно возникает не одинаково на каждом уровне: главную роль играет ступень RAF → MEK."],"mechanism":["Одна активная киназа, не расходуясь, фосфорилирует много молекул субстрата следующего уровня.","Число активных молекул на выходе ограничено общим количеством субстрата: активной ERK не может быть больше, чем всей ERK в клетке.","[[T05|Каталитическое усиление]] оценивают при одном фиксированном стимуле, сравнивая количество активных молекул на входе и выходе."],"paragraphs":["Фермент в реакции не расходуется, поэтому одна молекула активной киназы за время сигнала фосфорилирует много молекул субстрата. Если на каждом из трёх уровней одна молекула активирует десять, на выходе окажется в 1000 раз больше активных молекул, чем на входе. Такой расчёт показывает принцип, но не описывает реальную клетку.","В реальной клетке усиление ограничено количеством белков каждого уровня. По измерениям Fujioka и соавт. (2006), в клетках HeLa концентрация RAF составляет около 0,013 мкМ, MEK — около 1,4 мкМ, ERK — около 0,96 мкМ, RAS — около 0,4 мкМ. Число активных молекул равно общему количеству белка, умноженному на долю его активной формы. Когда доли активных форм на соседних уровнях сопоставимы — в модели так бывает при максимальном стимуле, около 77–84 %, — соотношение активных молекул задают количества белков: на ступени RAS → RAF-1 их число не растёт, на ступени RAF-1 → MEK может возрасти примерно в сто раз, а на ступени MEK → ERK многократно не растёт, так как ERK и MEK сопоставимы по количеству. При других стимулах доли различаются, и усиление нужно считать по обоим сомножителям.","В модели практикума при максимальном стимуле на одну активную RAF приходится около 70 активных молекул ERK. Это число почти одинаково в двух режимах работы ферментов, хотя форма кривой «доза — ответ» в них различается (следующий шаг).","Усиление увеличивает число эффекторных событий в расчёте на один занятый рецептор, но не позволяет различить две высокие концентрации лиганда, при которых почти все рецепторы уже заняты. Верхнюю границу различимых концентраций задаёт связывание лиганда с рецептором."],"trap":["Каскад усиливает сигнал в десять раз на каждом уровне, поэтому ERK всегда во много раз больше, чем RAS.","Усиление ограничено количеством белков на каждом уровне. В клетках HeLa RAF намного меньше, чем RAS, MEK и ERK, поэтому основное усиление по числу молекул приходится на ступень RAF → MEK."],"conditions":"Концентрации — клетки HeLa, флуоресцентные зонды (Fujioka 2006; значения таблицы 1 приведены по аннотации и базе BioNumbers). Расчёт «70 молекул ERK на одну RAF» — учебная модель практикума (вопрос 1б) с этими концентрациями. Пример «10 × 10 × 10» — условный.","sources":["Fujioka2006","HuangFerrell1996"],"quiz":{"id":"S4-L02","question":"В клетке RAF около 0,013 мкМ, MEK — 1,4 мкМ, ERK — 0,96 мкМ. На какой ступени каскада число активных молекул может вырасти больше всего?","options":[{"id":"S4-L02-1","text":"RAF → MEK","correct":true,"feedback":"MEK примерно в сто раз больше, чем RAF, и каждая активная RAF фосфорилирует много молекул MEK."},{"id":"S4-L02-2","text":"MEK → ERK","correct":false,"feedback":"В клетках HeLa ERK и MEK сопоставимы по количеству (оценки различаются в зависимости от метода), поэтому на этой ступени число активных молекул многократно не растёт."},{"id":"S4-L02-3","text":"На всех ступенях одинаково","correct":false,"feedback":"Это условный пример «по десять на уровень». Реальное усиление зависит от количества белка на каждом уровне и различается между ступенями."}]},"widget":{"kind":"table","title":"","s":{"title":"Сколько молекул на каждом уровне","status":"Данные измерений (клетки HeLa) и расчёт учебной модели","modes_label":"Что показать","modes":["Концентрации белков","Усиление на ступенях","Как измеряют усиление"],"tables":[{"head":["Белок","Концентрация, мкМ","Источник"],"rows":[["RAS","0,4","Fujioka 2006, HeLa"],["RAF (RAF-1)","0,013","Fujioka 2006, HeLa"],["MEK","1,4","Fujioka 2006, HeLa"],["ERK","0,96","Fujioka 2006, HeLa"]],"note":"RAF — самый малочисленный из показанных белков каскада. Общее количество белка ограничивает число его активных молекул, но для расчёта усиления нужно знать и долю активной формы каждого белка."},{"head":["Ступень","Число активных молекул при максимальном стимуле модели","Почему"],"rows":[["RAS → RAF","не растёт","RAF меньше, чем RAS"],["RAF → MEK","до ~100 раз","MEK в сто раз больше, чем RAF"],["MEK → ERK","не растёт многократно","ERK меньше, чем MEK"],["RAF → ERK (модель)","≈70 раз","расчёт при максимальном стимуле"]],"note":"Сравнение относится к максимальному стимулу модели, когда доли активных форм на уровнях каскада сопоставимы (около 77–84 %): число активных молекул = общее количество белка × доля его активной формы. При других стимулах усиление зависит и от количества белка, и от доли активной формы."},{"head":["Что измеряют","Как","Что это показывает"],"rows":[["Число активных молекул на входе и выходе","один фиксированный стимул; количество фосфорилированных форм","масштаб усиления"],["Долю активной ERK при многих концентрациях стимула","кривая «доза — ответ»","крутизну ответа"]],"note":"Усиление и крутизну измеряют в разных опытах: по одной точке кривой нельзя судить о её крутизне."}]}},"number":2,"question":1},{"id":"steepness","section":0,"questions":[1],"title":"Почему ответ каскада бывает пологим или крутым","keywords":["крутизна","сверхчувствительность","коэффициент Хилла","нулевой порядок","Голдбетер","Кошланд","Huang","Ferrell"],"lead":["Крутизна показывает, насколько резко доля активной ERK меняется при небольшом изменении стимула.","Её создают кинетические свойства ферментов, а не само число уровней каскада."],"mechanism":["Если киназа и фосфатаза насыщены субстратом, их скорости почти постоянны, и малый сдвиг их соотношения резко меняет долю фосфорилированного субстрата ([[T08|переключение нулевого порядка]]).","[[T09|Дистрибутивное фосфорилирование]] двух сайтов ERK добавляет ещё одну кинетическую ступень и повышает крутизну.","При последовательном соединении уровней их крутизна перемножается: [[T07|коэффициент Хилла]] каскада больше, чем у любого отдельного уровня."],"paragraphs":["[[T06|Крутизна, или сверхчувствительность]], описывает форму кривой «концентрация стимула — доля активной ERK». Её выражают эффективным коэффициентом Хилла: при значении 1 ответ гиперболический и постепенный, при 4–5 — сигмоидный, близкий к переключателю.","Goldbeter и Koshland (1981) показали, что крутой ответ может возникнуть без кооперативного связывания. Если концентрация субстрата намного выше Km киназы и фосфатазы, обе работают почти с максимальной скоростью. Пока скорость фосфорилирования ниже скорости дефосфорилирования, почти весь субстрат находится в нефосфорилированной форме; как только она становится выше, почти весь субстрат фосфорилирован. Вблизи равенства скоростей малое изменение входного сигнала переводит систему из одного состояния в другое.","Huang и Ferrell (1996) измерили ответ каскада в неразбавленных экстрактах ооцитов Xenopus, добавляя киназу Mos в разной концентрации. Для ERK2 эффективный коэффициент Хилла составил 4–5, для MEK1 — около 1,7. Крутизна возрастала от уровня к уровню. Это значение относится к экстрактам с естественными концентрациями ферментов и не переносится автоматически на другие клетки.","На схеме можно сравнить два режима учебной модели. Усиление при максимальном стимуле в них почти одинаковое, а форма кривой разная: усиление и крутизна — независимые свойства. Коэффициент Хилла зависит от того, по какой величине строят кривую: по концентрации EGF в насыщенном режиме он около 3, а по доле занятых рецепторов — около 5, потому что занятость сама нелинейно зависит от концентрации лиганда. Оба режима — учебные наборы параметров, в которых различаются и насыщение ферментов, и отношения скоростей киназ и фосфатаз; это иллюстрация двух форм ответа, а не опыт с изменением одного параметра."],"trap":["Сильный каскад, дающий много активной ERK, обязательно отвечает круто, по порогу.","Масштаб ответа (усиление) и его крутизна независимы: тот же каскад с тем же максимальным выходом может отвечать полого или круто в зависимости от насыщения ферментов."],"conditions":"Коэффициенты Хилла 4–5 (ERK2) и ~1,7 (MEK1) — экстракты ооцитов Xenopus laevis, стимул — Mos 0–300 нМ (Huang и Ferrell 1996; прочитана аннотация, числа проверены по обзору Ferrell 1996). Кривые схемы — учебная модель практикума (функция Голдбетера — Кошланда для трёх уровней), величины условные; коэффициент Хилла на схеме рассчитан по EC10 и EC90 кривой «концентрация EGF — доля активной ERK».","sources":["GoldbeterKoshland1981","HuangFerrell1996","MarkevichHoekKholodenko2004"],"quiz":{"id":"S4-L03","question":"Концентрацию EGF, близкую к пороговой, повышают в 10 раз. Как изменится доля активной ERK, если ферменты каскада насыщены субстратом?","options":[{"id":"S4-L03-1","text":"Резко возрастёт: от почти нуля до половины максимума","correct":true,"feedback":"В насыщенном режиме ответ ниже порога почти отсутствует, а вблизи порога резко нарастает: эффективный коэффициент Хилла кривой по концентрации EGF в модели около 3 (по доле занятых рецепторов — около 5)."},{"id":"S4-L03-2","text":"Увеличится примерно в 10 раз, как стимул","correct":false,"feedback":"Около порога при насыщении ответ растёт гораздо сильнее, чем стимул; почти пропорциональный рост возможен лишь при малом входе в ненасыщенном режиме."},{"id":"S4-L03-3","text":"Изменится немного: каскад сглаживает изменения","correct":false,"feedback":"Так отвечают ненасыщенные ферменты. При насыщении каскад, напротив, превращает небольшое изменение входа в резкий сдвиг ответа."}]},"widget":{"kind":"dose","title":"","s":{"title":"Кривая «доза EGF — доля активной ERK»","status":"Учебная модель, условные величины","modes_label":"Киназы и фосфатазы","modes":["не насыщены субстратом","насыщены субстратом"],"egf":"Концентрация EGF (0,001–100 Kd, лог. шкала)","x":"положение ползунка EGF (лог. шкала)","y":"активная ERK, %","curves":["не насыщены","насыщены"],"levels":["RAS-GTP","активная RAF","pMEK","pERK"],"thead":["Уровень","активно / всего, мкМ"],"m_erk":"доля активной ERK","m_amp":"усиление RAF → ERK","m_hill":"коэффициент Хилла (по оси EGF)","notes":["Ферменты не насыщены: ответ начинается при малой доле занятых рецепторов и растёт постепенно в широком диапазоне концентраций; коэффициент Хилла около 1.","Ферменты насыщены: ниже порога ERK почти неактивна, около порога ответ резко нарастает; эффекты трёх уровней перемножаются: коэффициент Хилла по концентрации EGF около 3, по доле занятых рецепторов — около 5. При максимальном стимуле усиление почти такое же, как без насыщения."]}},"number":3,"question":1},{"id":"termination","section":0,"questions":[1],"title":"Какими механизмами завершается сигнал","keywords":["завершение","DUSP","GAP","интернализация","деградация","NF1","отмывание"],"lead":["Сигнал ERK затухает, даже когда EGF остаётся в среде: его завершают несколько механизмов на разных уровнях.","Они различаются скоростью и мишенью, поэтому их нарушения меняют ответ по-разному."],"mechanism":["Фосфатазы [[T16|DUSP]] дефосфорилируют ERK, а [[T11|GAP]]-белки, например [[T13|нейрофибромин]], ускоряют гидролиз GTP в RAS.","Активная ERK фосфорилирует RAF-1 и через RSK — SOS1, ослабляя их; кроме того, она индуцирует синтез DUSP и SPRY.","Активные рецепторы [[T17|интернализуются]] и частично разрушаются в лизосомах, так что на поверхности их становится меньше."],"paragraphs":["[[T10|Завершение сигнала]] обеспечивают шесть групп механизмов: фосфатазы, прямо дефосфорилирующие ERK; тормозящее фосфорилирование вышестоящих белков, которое осуществляет активная ERK; дефосфорилирование рецептора и адаптеров; GAP-зависимый гидролиз GTP в RAS; интернализация и сортировка рецептора; протеолитическая деградация компонентов.","Механизмы работают на разных временных масштабах. Дефосфорилирование и гидролиз GTP протекают непрерывно; вызванные ими изменения развиваются и обращаются за секунды и минуты. Тормозящее фосфорилирование SOS и RAF-1 развивается за минуты и не требует синтеза белка. Синтез DUSP и SPRY занимает десятки минут и часы. Интернализация меняет положение рецептора, а деградация необратимо уменьшает его количество.","Поэтому в клетках PC12 после добавления EGF активность MEK максимальна через 2 мин и возвращается к исходному уровню за 60–90 мин, хотя EGF остаётся в среде (Traverse 1992). Если же EGF отмыть, сигнал затухает за минуты: новые рецепторы не активируются, а дефосфорилирование и гидролиз GTP продолжаются.","Механизмы не независимы. Интернализация не всегда выключает сигнал: рецептор в эндосоме может продолжать передачу. Обнаружение одного работающего механизма не позволяет предсказать скорость затухания: для этого нужны вклады и временные профили всех механизмов."],"trap":["Сигнал ERK затухает только тогда, когда из среды исчезает лиганд.","При постоянном EGF сигнал ERK тоже затухает: число рецепторов на поверхности уменьшается, ERK тормозит RAF-1 и через RSK — SOS1, фосфатазы дефосфорилируют ERK."],"conditions":"Классификация механизмов — по обзорам Martín-Vega и Cobb (2023) и Lavoie и соавт. (2020); время ответа на EGF — клетки PC12 (Traverse 1992, аннотация). Графики — учебная модель практикума (вопрос 1п), величины относительные.","sources":["MartinVegaCobb2023","Lavoie2020","Traverse1992","CauntKeyse2013"],"quiz":{"id":"S4-L04","question":"EGF остаётся в среде, а через 60 мин pERK в несколько раз ниже пика. Что объясняет это наблюдение?","options":[{"id":"S4-L04-1","text":"Несколько механизмов завершения на разных уровнях каскада","correct":true,"feedback":"Рецепторы интернализуются и разрушаются, ERK тормозит RAF-1 и через RSK — SOS1, фосфатазы дефосфорилируют ERK: сигнал затухает при сохраняющемся лиганде."},{"id":"S4-L04-2","text":"Распад EGF в среде за первые минуты","correct":false,"feedback":"Если EGF отмыть, pERK падает за минуты; при EGF в среде спад медленнее. Значит, лиганд сохраняется, а сигнал прекращают внутриклеточные механизмы."},{"id":"S4-L04-3","text":"Исчерпание ERK: все молекулы разрушились","correct":false,"feedback":"ERK — стабильный белок: её общее содержание за час почти не меняется. Снижается доля фосфорилированной ERK."}]},"widget":{"kind":"course","title":"","s":{"title":"pERK после добавления EGF","status":"Учебная модель, относительные величины","modes_label":"Условия","modes":["EGF остаётся в среде","EGF отмыт через 10 мин","Нет NF1","Синтез DUSP подавлен"],"runs":[{"cfg":{},"input":"egf"},{"cfg":{},"input":"wash:10"},{"cfg":{"nf1":false},"input":"egf"},{"cfg":{"dusp":false},"input":"egf"}],"keys":["E","R"],"key_labels":["pERK","RAS-GTP"],"ref":0,"ref_label":"EGF в среде, норма","x":"время после добавления EGF, мин","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY; RAS-GTP — доля всего RAS в GTP-форме. Расчёт модели; кривые не нормированы каждая на свой максимум.","u_min":"мин","points":[{"label":"pERK через 5 мин","key":"E","t":5},{"label":"pERK через 30 мин","key":"E","t":30},{"label":"pERK через 60 мин","key":"E","t":60}],"notes":["EGF в среде, но через час pERK в несколько раз ниже пика: число рецепторов на поверхности уменьшается, действуют обратные связи и фосфатазы.","После отмывания EGF pERK падает за минуты: новые рецепторы не активируются, а гидролиз GTP и дефосфорилирование продолжаются.","Без NF1 RAS-GTP сохраняется дольше, и pERK на спаде выше нормы; базальный уровень тоже немного повышен. Сигнал всё же затухает.","Без DUSP пик pERK выше и спад медленнее, а RAS-GTP почти не меняется: этот механизм д
