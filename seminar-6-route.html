  };
  draw();
};

/* ---- шаг 18: доля в ядре → занятость участка → новая РНК ---- */
W.bind3 = ({S, s, set, out, onSelect, onCheck}) => {
  s.loc ??= 2; s.acc ??= false; s.bad ??= false; s.par ??= true; s.prom ??= true;
  set(S.title, S.status, `<div class="controls">${select('b3-loc', S.loc_label, S.loc_opts, s.loc)}</div><div class="controls">${check('b3-acc', S.acc_label, s.acc)}${check('b3-bad', S.bad_label, s.bad)}${check('b3-par', S.par_label, s.par)}${check('b3-prom', S.prom_label, s.prom)}</div>`);
  onSelect('b3-loc', v => { s.loc = v; draw(); });
  onCheck('b3-acc', v => { s.acc = v; draw(); });
  onCheck('b3-bad', v => { s.bad = v; draw(); });
  onCheck('b3-par', v => { s.par = v; draw(); });
  onCheck('b3-prom', v => { s.prom = v; draw(); });
  const calc = x => { const bind = x.bad ? 0 : Math.min(x.loc, x.acc ? 3 : 1, x.par ? 3 : 2); return [x.loc, bind, x.prom ? bind : Math.min(bind, 1)]; };
  const draw = () => {
    const ref = calc({loc: 3, acc: true, bad: false, par: true, prom: true}), me = calc({loc: s.loc + 1, acc: s.acc, bad: s.bad, par: s.par, prom: s.prom});
    let d = '';
    const X0 = 24, TW = 400;
    d += rect(24, 8, 14, 14, C.blue, 3) + tx(46, 20, S.s1, 14, 'start') + rect(250, 8, 14, 14, C.orange, 3) + tx(272, 20, S.s2, 14, 'start');
    S.rows.forEach((rw, i) => {
      const y = 44 + i * 92;
      d += tx(X0, y + 6, rw, 16, 'start');
      [[ref[i], C.blue, 14], [me[i], C.orange, 48]].forEach(([v, col, o]) => {
        d += rect(X0, y + o, TW, 26, '#eef3f7', 6, 'stroke="#c8d6e2"') + (v > 0 ? rect(X0, y + o, TW * v / 3, 26, col, 6) : '') + tx(X0 + TW + 14, y + o + 19, lvl(v), 15, 'start');
      });
    });
    const notes = [], bind = me[1];
    if (me[0] === ref[0] && bind !== ref[1]) notes.push(S.n_same);
    else if (bind !== ref[1]) notes.push(S.n_diff);
    if (bind === ref[1] && me[2] !== ref[2]) notes.push(S.n_rna);
    if (s.bad) notes.push(S.n_bad);
    else [['acc', s.acc ? 3 : 1], ['par', s.par ? 3 : 2], ['loc', me[0]]].forEach(([nm, cap]) => { if (cap === bind && cap < 3) notes.push(S['n_' + nm]); });
    if (!s.prom && me[2] < bind) notes.push(S.n_prom);
    if (!notes.length) notes.push(S.n_eq);
    const desc = S.rows.map((r, i) => `${r}: ${S.s1} — ${lvl(ref[i])}; ${S.s2} — ${lvl(me[i])}`).join('. ');
    out(svg(d, S.title, 316, 640, desc), result(`<h3>${esc(S.res_title)}</h3>` + notes.map(x => `<p>${esc(x)}</p>`).join('')));
  };
  draw();
};

/* ---- шаг 19: паралоги FOXO ---- */

/* ---- шаг 20: показатели, методы, ингибиторы AKT и варианты белка ---- */
W.foxomeas = ({S, s, set, out, onGroup, onSelect}) => {

/* Схемы раздела 4: хроматиновая память. Подписи берутся из widget.s (S); в коде только числа и знаки. */
const GLY4 = {'-1': '↓', 0: '=', 1: '↑', 2: '↗', 3: '≠'};
const badge4 = (x, y, v, r = 15) => {

  return circ(x, y, r, '#fff', `stroke="${col}" stroke-width="3"`) + tx(x, y + 6, v === null || v === undefined ? '—' : GLY4[v], 17, 'middle');
};
const halo = str => `<g style="paint-order:stroke;stroke:#eaf2f9;stroke-width:5px;stroke-linejoin:round">${str}</g>`;
const lines4 = (x, y, str, n, size = 14, step = 17, anchor = 'start') => wrap3(str, n).map((q, k) => tx(x, y + k * step, q, size, anchor)).join('');

/* ---- шаг 21: схема опыта и допустимые выводы ---- */
W.memtl = ({S, s, set, out, onRange, onCheck, onSelect}) => {
  s.rest ??= 5; s.wash ??= true; s.ctrl ??= true; s.comp ??= true; s.chrom ??= false; s.diff ??= 0;
  set(S.title, S.status, `<div class="controls">${slider('mt-r', S.rest_label, 0, 7, s.rest, 1, nb + S.d_unit)}${select('mt-d', S.diff_label, S.diff_opts, s.diff)}</div>` +
    `<div class="controls">${check('mt-w', S.wash_label, s.wash)}${check('mt-c', S.ctrl_label, s.ctrl)}${check('mt-k', S.comp_label, s.comp)}${check('mt-h', S.chrom_label, s.chrom)}</div>`);
  onRange('mt-r', v => { s.rest = v; draw(); });
  onSelect('mt-d', v => { s.diff = v; draw(); });
  onCheck('mt-w', v => { s.wash = v; draw(); });
  onCheck('mt-c', v => { s.ctrl = v; draw(); });
  onCheck('mt-k', v => { s.comp = v; draw(); });

  const draw = () => {

    const x2 = X0 + PX + s.rest * PX, hi = (x2 - X0) < 150 ? 17 : 0;
    const lvE = [3, 2, 1][s.diff], gE = ['↑', '=', '↓'][s.diff];
    let d = rect(0, 0, 640, 262, '#fff', 0);
    /* ось: сутки от начала первого воздействия */
    d += line(X0, 226, X0 + 9 * PX, 226, '#7f97ab', 1.5);
    for (let k = 0; k <= 9; k++) d += line(X0 + k * PX, 226, X0 + k * PX, 232, '#7f97ab', 1.5) + tx(X0 + k * PX, 247, String(k), 13, 'middle');
    d += tx(16, 247, S.l_axis, 13, 'start');
    /* опытная группа */
    d += tx(16, Y1 + 5, S.l_exp, 15, 'start');
    d += rect(X0, Y1 - 18, PX, 36, '#f4c9a6', 6, `stroke="${C.orange}" stroke-width="2"`) + tx(X0, Y1 - 26, S.l_first, 13, 'start');
    if (s.rest > 0) d += rect(X0 + PX, Y1 - 18, s.rest * PX, 36, '#eef3f7', 0, 'stroke="#9aa7b3" stroke-dasharray="6 4"') + (s.rest >= 2 ? tx(X0 + PX + s.rest * PX / 2, Y1 + 5, S.l_rest, 14, 'middle') : '');
    if (s.wash) d += line(X0 + PX, Y1 - 24, X0 + PX, Y1 + 26, C.teal, 3, 'stroke-dasharray="5 3"') + tx(X0 + PX, Y1 + 42, S.l_wash, 13, 'middle');
    d += rect(x2, Y1 - 18, 30, 36, '#c9d8ee', 6, `stroke="${C.blue}" stroke-width="2"`) + tx(x2, Y1 - 26 - hi, S.l_second, 13, 'start');
    d += rect(x2 + 44, Y1 + 18 - 12 * lvE, 26, 12 * lvE, C.orange, 3) + tx(x2 + 86, Y1 + 8, gE, 22, 'middle') + tx(x2 + 57, Y1 + 42, S.l_resp, 13, 'middle');

      if (s.rest > 0) d += rect(X0 + PX, Y2 - 18, s.rest * PX, 36, '#f7f9fb', 0, 'stroke="#c3ccd4" stroke-dasharray="6 4"');
      d += rect(x2, Y2 - 18, 30, 36, '#c9d8ee', 6, `stroke="${C.blue}" stroke-width="2"`);
      d += rect(x2 + 44, Y2 + 18 - 24, 26, 24, C.blue, 3) + tx(x2 + 86, Y2 + 8, '=', 22, 'middle') + tx(x2 + 57, Y2 + 42, S.l_resp, 13, 'middle');
    } else {
      d += rect(X0, Y2 - 30, 9 * PX, 60, '#fafbfc', 8, 'stroke="#9aa7b3" stroke-dasharray="6 4"') + lines4(X0 + 14, Y2 - 8, S.l_noctl, 62, 14, 18);
    }
    const yn = S.yn;
    const rows = [
      [S.rows[0][0], S.rows[0][1], s.ctrl && s.diff !== 1 ? 2 : 0],
      [S.rows[1][0], S.rows[1][1], s.wash && s.rest > 0 ? 1 : 0],
      [S.rows[2][0], S.rows[2][1], s.comp ? 2 : 0],

      [S.rows[5][0], S.rows[5][1], 0]
    ];

    const desc = `${S.l_exp}: ${S.diff_opts[s.diff]}; ${s.ctrl ? S.l_ctl : S.l_noctl}`;
    out(svg(d, S.title, 262, 640, desc),
      result(notes.map(x => `<p>${esc(x)}</p>`).join('')) + tbl(S.t_head, rows.map(r => [r[0], r[1], yn[r[2]]]), 'plain'));
  };

};

/* ---- шаг 22: PRC2, EED и EZH2 ---- */
W.prc2 = ({S, s, set, out, onGroup}) => {
  s.st ??= 0;
  /* уровни: PRC2 на хроматине, аллостерическое усиление, образование новой метки; −1 — не определяется */
  const LV = [[3, 3, 3], [3, 1, 1], [-1, -1, 0], [-1, 1, 1]];
  set(S.title, S.status, buttonGroup('pr-s', S.states, s.st, S.state_label));
  onGroup('pr-s', i => { s.st = i; draw(); });
  const draw = () => {
    const st = s.st, lv = LV[st], xs = [110, 320, 530], gray = '#9aa7b3';
    const hasOld = st !== 3, eedBlind = st === 1, ezDead = st === 2;
    let d = rect(0, 0, 640, 300, '#fff', 0);
    d += line(24, 238, 616, 238, '#8aa0b3', 4) + tx(616, 22, S.l_dna, 13, 'end');
    const names = [S.l_old, S.l_nb, S.l_new];
    xs.forEach((x, i) => {
      d += line(x, 172, x, 140, '#6d8ba5', 3) + circ(x, 208, 40, '#dfe9f3', 'stroke="#8aa0b3" stroke-width="2"') + tx(x, 214, 'H3', 17, 'middle') + tx(x, 282, names[i], 14, 'middle');
    });
    /* метки на хвостах H3 */
    const flag = (x, kind) => kind === 'solid' ? circ(x, 126, 16, YEL, `stroke="${C.ink}" stroke-width="2.5"`) + tx(x, 131, S.l_me, 12, 'middle')
      : kind === 'dash' ? circ(x, 126, 16, '#fff', `stroke="${gray}" stroke-width="2.5" stroke-dasharray="4 3"`) + tx(x, 131, S.l_me, 12, 'middle') : '';
    d += flag(xs[0], hasOld ? 'solid' : '');
    const nk = lv[2] >= 3 ? 'solid' : lv[2] === 1 ? 'dash' : '';
    d += flag(xs[1], nk) + flag(xs[2], nk);
    /* PRC2 */
    d += rect(196, 18, 262, 84, 'none', 14, `stroke="${C.blue}" stroke-width="2" stroke-dasharray="7 5"`) + tx(204, 14, S.l_prc2, 14, 'start');
    d += box(208, 48, 92, 44, S.l_eed, {fill: eedBlind ? '#f6f7f8' : '#e2eaf6', stroke: eedBlind ? gray : C.blue, dash: eedBlind ? '6 4' : '', size: 17, sw: 2.5});
    d += box(354, 48, 92, 44, S.l_ezh, {fill: ezDead ? '#f6f7f8' : '#e2eaf6', stroke: ezDead ? gray : C.blue, dash: ezDead ? '6 4' : '', size: 17, sw: 2.5});
    /* EED узнаёт метку */
    d += arrow(228, 94, 124, 120, hasOld && !eedBlind ? C.blue : gray, hasOld && !eedBlind ? 2.8 : 2, hasOld && !eedBlind ? '' : '6 4') + tx(18, 84, S.l_read, 13, 'start');
    if (eedBlind) d += cross(176, 107, C.red);
    /* аллостерическое усиление */
    const al = lv[1] >= 3;
    d += arrow(302, 70, 352, 70, al ? C.orange : gray, al ? 3 : 2, al ? '' : '6 4') + tx(327, 44, S.l_allo, 12, 'middle');
    if (lv[1] === 1) d += cross(327, 70, C.red);
    /* EZH2 ставит метку */
    const cat = !ezDead && lv[2] >= 1;
    d += arrow(384, 94, 332, 118, cat ? C.orange : gray, cat ? 2.8 : 2, cat ? (lv[2] >= 3 ? '' : '6 4') : '6 4') + tx(374, 118, S.l_cat, 13, 'start');
    d += arrow(420, 94, 520, 118, cat && lv[2] >= 3 ? C.orange : gray, 2, '6 4');
    if (ezDead) d += cross(358, 106, C.red);
    const desc = `${S.states[st]}: ${S.m_assoc} — ${lvl(lv[0])}; ${S.m_allo} — ${lvl(lv[1])}; ${S.m_new} — ${lvl(lv[2])}`;
    out(svg(d, S.title, 300, 640, desc),
      `<div class="metrics three">${metric(S.m_assoc, lvl(lv[0]))}${metric(S.m_allo, lvl(lv[1]))}${metric(S.m_new, lvl(lv[2]))}</div>` +
      result(`<p>${esc(S.notes[st])}</p><p class="small">${esc(S.legend)}</p>`));
  };
  draw();
};

/* ---- шаг 23: деление, восстановление и удаление метки (учебная модель) ---- */
W.dilution = ({S, s, set, out, onRange, onCheck}) => {
  s.n ??= 2; s.r ??= 0; s.d ??= 0; s.thr ??= 3; s.div ??= true;
  const N = 10;
  set(S.title, S.status, `<div class="controls">${slider('dl-n', S.n_label, 0, 6, s.n, 1)}${slider('dl-r', S.r_label, 0, 60, s.r, 5, nb + '%')}${slider('dl-d', S.d_label, 0, 60, s.d, 5, nb + '%')}${slider('dl-t', S.t_label, 1, 10, s.thr, 1)}</div>` +
    `<div class="controls">${check('dl-v', S.div_label, s.div)}</div>`);
  onRange('dl-n', v => { s.n = v; draw(); });
  onRange('dl-r', v => { s.r = v; draw(); });
  onRange('dl-d', v => { s.d = v; draw(); });
  onRange('dl-t', v => { s.thr = v; draw(); });
  onCheck('dl-v', v => { s.div = v; draw(); });
  const binom = (n, p) => { const a = []; let c = 1; for (let k = 0; k <= n; k++) { a.push(c * Math.pow(p, k) * Math.pow(1 - p, n - k)); c = c * (n - k) / (k + 1); } return a; };
  const step = (dist, div, r, dd) => {
    let cur = dist;
    if (div) { const nx = new Array(N + 1).fill(0); cur.forEach((pk, k) => binom(k, 0.5).forEach((q, j) => { nx[j] += pk * q; })); cur = nx; }
    const rs = new Array(N + 1).fill(0); cur.forEach((pk, k) => binom(N - k, r).forEach((q, j) => { rs[k + j] += pk * q; })); cur = rs;
    const rm = new Array(N + 1).fill(0); cur.forEach((pk, k) => binom(k, 1 - dd).forEach((q, j) => { rm[j] += pk * q; })); return rm;
  };
  const mean = dist => dist.reduce((a, p, k) => a + p * k, 0) / N;
  const intact = (dist, thr) => dist.reduce((a, p, k) => a + (k >= thr ? p : 0), 0);
  const draw = () => {
    const r = s.r / 100, dd = s.d / 100;
    const D = [new Array(N + 1).fill(0)]; D[0][N] = 1;
    for (let i = 1; i <= 6; i++) D.push(step(D[i - 1], s.div, r, dd));
    const dist = D[s.n], m = mean(dist), it = intact(dist, s.thr), ideal = Math.pow(0.5, s.n);
    const pm = [], pi = [], pid = [];
    for (let i = 0; i <= 6; i++) { pm.push([i, 100 * mean(D[i])]); pi.push([i, 100 * intact(D[i], s.thr)]); pid.push([i, 100 * Math.pow(0.5, i)]); }
    /* распределение клеток по числу меток */
    const X0 = 96, BW = 40, G = 8, H0 = 172, HH = 120;
    let b = rect(0, 0, 640, 226, '#fff', 0) + line(X0 - 8, H0, X0 + 11 * (BW + G), H0, '#7f97ab', 1.5) + line(X0 - 8, H0 - HH, X0 - 8, H0, '#7f97ab', 1.5);
    [0, 50, 100].forEach(v => { b += line(X0 - 12, H0 - HH * v / 100, X0 - 8, H0 - HH * v / 100, '#7f97ab', 1.5) + tx(X0 - 16, H0 - HH * v / 100 + 5, String(v), 14, 'end'); });
    dist.forEach((p, k) => {
      const x = X0 + k * (BW + G), h = HH * p;
      b += rect(x, H0 - h, BW, h, k >= s.thr ? C.blue : '#b9c4cf', 3) + tx(x + BW / 2, H0 + 20, String(k), 14, 'middle');
    });
    const xt = X0 + s.thr * (BW + G) - G / 2;
    b += line(xt, H0 - HH - 6, xt, H0 + 4, C.red, 2.5, 'stroke-dasharray="5 3"') + tx(xt + 6, H0 - HH - 8, S.l_thr, 13, 'start');
    b += tx(X0 - 8, 16, S.y_k, 14, 'start') + tx(X0 + 5.5 * (BW + G) - G / 2, 218, S.x_k, 15, 'middle');
    const ch = chart([{pts: pm, label: S.ser_mean, color: C.blue}, {pts: pi, label: S.ser_int, color: C.orange}, {pts: pid, label: S.ser_ideal, color: '#9aa7b3', dash: '7 5'}],
      {xLabel: S.x_lab, yLabel: S.y_lab, maxX: 6, maxY: 100, ticksX: 6, ticksY: 4, h: 260, title: S.chart_title, marks: [[s.n, 100 * m, C.blue], [s.n, 100 * it, C.orange]]});
    const notes = [];
    if (s.div && s.r === 0 && s.d === 0) notes.push(S.n_ideal);
    else if (!s.div && s.r === 0 && s.d === 0) notes.push(S.n_still);
    else if (!s.div) notes.push(S.n_nodiv);
    else notes.push(S.n_mixed);
    notes.push(S.n_mean);
    const desc = `${S.m_mean}: ${pct(m)}; ${S.m_int}: ${pct(it)}; ${S.m_ideal}: ${pct(ideal)}`;
    out(svg(b, S.dist_title, 226, 640, desc) + ch,
      `<div class="metrics three">${metric(S.m_mean, pct(m))}${metric(S.m_int, pct(it))}${metric(S.m_ideal, pct(ideal))}</div>` + result(notes.map(x => `<p>${esc(x)}</p>`).join('') + `<p class="small">${esc(S.model_note)}</p>`));
  };
  draw();
};

/* ---- шаг 24: локальный носитель или общая сеть факторов; стадии инактивации X ---- */
W.carriers = ({S, s, set, out, onGroup, onSelect, onCheck}) => {
  s.mode ??= 0; s.obs ??= 0; s.seq ??= false; s.stage ??= 0;
  const build = () => {
    const ctl = s.mode === 0 ? `<div class="controls">${select('cr-o', S.obs_label, S.obs_opts, s.obs)}${check('cr-q', S.seq_label, s.seq)}</div>` : buttonGroup('cr-g', S.stages.map(x => x[0]), s.stage, S.stage_label);
    set(S.title, S.status, buttonGroup('cr-m', S.modes, s.mode, S.mode_label) + ctl);
    onGroup('cr-m', i => { s.mode = i; build(); });
    if (s.mode === 0) { onSelect('cr-o', v => { s.obs = v; draw(); }); onCheck('cr-q', v => { s.seq = v; draw(); }); } else onGroup('cr-g', i => { s.stage = i; draw(); });
    draw();
  };
  const FACT = {1: '●', 0: '○', '-1': '?'};
  const draw = () => {
    if (s.mode === 0) {
      /* наблюдение: 0 — A активен, B молчит; 1 — оба активны; 2 — оба молчат */
      const act = [[true, false], [true, true], [false, false]][s.obs];
      let d = rect(0, 0, 640, 262, '#fff', 0) + rect(12, 30, 616, 222, '#eaf2f9', 40, 'stroke="#8db0cc" stroke-width="2" stroke-dasharray="6 5"') + tx(320, 22, S.l_nuc, 14, 'middle');
      [[0, 100], [1, 206]].forEach(([i, y]) => {
        d += tx(36, y - 34, i === 0 ? S.l_a : S.l_b, 14, 'start') + line(36, y, 604, y, '#8aa0b3', 4);
        d += rect(300, y - 20, 96, 40, act[i] ? YEL : '#e4e9ee', 8, `stroke="${act[i] ? C.ink : '#9aa7b3'}" stroke-width="${act[i] ? 2.5 : 1.8}"${act[i] ? '' : ' stroke-dasharray="6 4"'}`) + tx(348, y + 6, S.l_gene, 16, 'middle');
        d += act[i] ? arrow(400, y - 6, 470, y - 6, C.blue, 3) + halo(tx(408, y - 16, S.l_on, 14, 'start')) : halo(tx(408, y - 16, S.l_off, 14, 'start'));
      });
      /* общие диффундирующие факторы */
      [[96, 138], [146, 124], [186, 146], [476, 146], [524, 128], [572, 142]].forEach(p => { d += circ(p[0], p[1], 7, C.blue); });
      d += tx(330, 148, S.l_fact, 13, 'middle');
      if (s.obs === 0) d += circ(348, 56, 15, '#fff', `stroke="${C.orange}" stroke-width="3" stroke-dasharray="4 3"`) + tx(348, 62, '?', 17, 'middle') + tx(370, 61, S.l_carrier, 13, 'start');
      const rows = S.hyp.map((h, i) => {
        const pred = [0, 1, 2, 0][i], ok = pred === s.obs;
        const ex = i === 3 && s.seq;
        return `<tr${ok && !ex ? ' class="sel"' : ''}><th scope="row">${esc(h[0])}</th><td>${esc(S.pred[pred])}</td><td>${esc(ex ? S.excluded : ok ? S.yes : S.no)}</td><td>${esc(h[1])}</td></tr>`;
      }).join('');
      const notes = [S.c_obs[s.obs]];
      if (s.obs === 0) notes.push(s.seq ? S.c_seq : S.c_noseq);
      notes.push(S.c_end);
      out(svg(d, S.l_nuc, 262, 640, `${S.obs_opts[s.obs]}`),
        result(notes.map(x => `<p>${esc(x)}</p>`).join('')) + `<div class="table-scroll"><table class="plain"><thead><tr>${S.t_head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`);
    } else {
      const st = s.stage, ch = S.chips[st], gx = [0, 1, 2, 3, 4, 5, 6, 7].map(i => 138 + i * 52);
      let d = rect(0, 0, 640, 290, '#fff', 0);
      /* Xa и Xi */
      [[0, 52], [1, 140]].forEach(([i, y]) => {
        d += lines4(16, y - 2, i === 0 ? S.l_xa : S.l_xi, 13, 14, 17);
        d += rect(120, y - 14, 440, 28, '#eef3f7', 14, 'stroke="#b5c7d6" stroke-width="2"');
        gx.forEach((x, k) => {
          const esc2 = st >= 4 && (k === 2 || k === 6);
          const on = i === 0 || st <= 1 || esc2, mid = i === 1 && st === 2;
          d += rect(x - 10, y - 10, 20, 20, on ? YEL : mid ? '#f3e2a8' : '#d3dbe3', 4, `stroke="${on ? C.ink : '#9aa7b3'}" stroke-width="${on ? 2 : 1.5}"${mid ? ' stroke-dasharray="3 2"' : ''}`);
          if (i === 1 && esc2) d += arrow(x, y + 46, x, y + 16, C.teal, 2.5);
        });
      });
      if (st >= 1 && st <= 3) d += `<ellipse cx="340" cy="140" rx="226" ry="30" fill="${C.orange}" fill-opacity="${st === 1 ? 0.10 : 0.20}" stroke="${C.orange}" stroke-width="2" ${st === 1 ? 'stroke-dasharray="6 4"' : ''}/>` + tx(344, 108, S.l_xist, 14, 'middle');
      if (st >= 4) d += tx(590, 204, S.l_esc, 13, 'end');
      /* участники */
      S.facs.forEach((f, i) => {
        const x = 40 + i * 150;
        d += rect(x, 226, 136, 40, ch[i] === 1 ? '#e2eaf6' : '#f6f7f8', 10, `stroke="${ch[i] === 1 ? C.blue : '#9aa7b3'}" stroke-width="2"${ch[i] === 1 ? '' : ' stroke-dasharray="5 4"'}`) + tx(x + 68, 252, FACT[ch[i]] + ' ' + f, 15, 'middle');
      });
      const rows = S.stages.map(x => [x[0], x[1], x[2]]);
      out(svg(d, S.stages[st][0], 290, 640, S.stages[st][1] + ' ' + S.facs.map((f, i) => `${f}: ${FACT[ch[i]]}`).join('; ')),
        result(`<p>${esc(S.stages[st][1])}</p><p class="small">${esc(S.chips_legend)}</p>`) + `<div id="cr-t"></div>`);
      $('cr-t').innerHTML = selTable(S.t_head2, rows, st);
    }
  };
  build();
};

/* ---- шаг 25: повторный ответ: протокол и вмешательство ---- */
W.repeat = ({S, s, set, out, onGroup, onSelect}) => {
  s.sys ??= 0; s.p ??= 1; s.i ??= 0; s.sp ??= 1; s.g ??= 0;
  const build = () => {
    const ctl = s.sys === 0 ? buttonGroup('rp-p', S.h_protos, s.p, S.p_label) + `<div class="controls">${select('rp-i', S.i_label, S.h_ints, s.i)}</div>`
      : buttonGroup('rp-sp', S.m_protos, s.sp, S.p_label) + `<div class="controls">${select('rp-g', S.g_label, S.m_gts, s.g)}</div>`;
    set(S.title, S.status, buttonGroup('rp-sys', S.systems, s.sys, S.sys_label) + ctl);
    onGroup('rp-sys', i => { s.sys = i; build(); });
    if (s.sys === 0) { onGroup('rp-p', i => { s.p = i; draw(); }); onSelect('rp-i', v => { s.i = v; draw(); }); } else { onGroup('rp-sp', i => { s.sp = i; draw(); }); onSelect('rp-g', v => { s.g = v; draw(); }); }
    draw();
  };
  /* события протокола: [тип, ключ подписи] */
  const EV0 = [[['n'], ['2', 'lps']], [['1', 'bg'], ['w'], ['r'], ['2', 'lps']], [['1', 'lps'], ['w'], ['r'], ['2', 'lps']], [['1', 'lps'], ['1', 'bg'], ['r'], ['2', 'lps']]];
  const EV1 = [[['n'], ['2', 'lps']], [['1', 'lps'], ['w'], ['r'], ['2', 'lps']]];
  const draw = () => {
    const ev = s.sys === 0 ? EV0[s.p] : EV1[s.sp];
    const res = s.sys === 0 ? S.h_res[s.p][s.i] : S.m_res[s.sp][s.g];
    let d = rect(0, 0, 640, 216, '#fff', 0), x = 20;
    const pos = {};
    ev.forEach((e, k) => {
      if (e[0] === 'n') { d += rect(x, 78, 110, 44, '#fff', 8, 'stroke="#9aa7b3" stroke-dasharray="6 4"') + tx(x + 55, 105, S.ev.none, 13, 'middle'); pos.n = x; x += 120; }
      else if (e[0] === '1') { d += rect(x, 78, 104, 44, e[1] === 'bg' ? '#f4c9a6' : '#c9d8ee', 8, `stroke="${e[1] === 'bg' ? C.orange : C.blue}" stroke-width="2"`) + tx(x + 52, 106, S.ev[e[1]], 15, 'middle'); pos['1' + k] = x; pos.s1 ??= x; x += 112; }
      else if (e[0] === 'w') { d += line(x - 4, 66, x - 4, 134, C.teal, 3, 'stroke-dasharray="5 3"') + tx(x - 4, 154, S.ev.wash, 13, 'middle'); pos.w = x - 4; }
      else if (e[0] === 'r') { d += rect(x, 78, 150, 44, '#eef3f7', 0, 'stroke="#9aa7b3" stroke-dasharray="6 4"') + tx(x + 75, 106, S.ev.rest, 14, 'middle'); pos.r = x; x += 160; }
      else { d += rect(x, 78, 84, 44, '#c9d8ee', 8, `stroke="${C.blue}" stroke-width="2"`) + tx(x + 42, 106, S.ev[e[1]], 15, 'middle'); pos.s2 = x; x += 96; }
    });
    /* вмешательство */
    if (s.sys === 0 && s.i > 0 && res) {
      const which = [null, 'ibet', 'ibet', 'akt'][s.i], x0 = s.i === 2 ? (pos.r ?? pos.s1) : pos.s1;
      if (x0 !== undefined) d += line(x0, 62, x0 + (s.i === 2 ? 150 : 104), 62, C.red, 4) + tx(x0, 52, S.ev[which], 13, 'start');
    }
    /* результат */
    const xr = Math.max(x + 40, 470);
    d += circ(xr + 40, 100, 32, '#fff', `stroke="${res ? (res[0] === 1 || res[0] === 2 ? C.teal : res[0] === -1 ? C.red : '#8aa0b3') : '#c3ccd4'}" stroke-width="4"`) + tx(xr + 40, 112, res ? GLY4[res[0]] : '—', 32, 'middle');
    d += tx(xr + 40, 160, S.l_resp, 13, 'middle');
    if (s.sys === 1) d += tx(xr + 40, 52, S.m_gts[s.g], 13, 'middle');
    const rows = (s.sys === 0 ? S.meas_h : S.meas_m);
    out(svg(d, S.title, 216, 640, res ? res[1] : S.no_data),
      result(`<p>${esc(res ? res[1] : S.no_data)}</p>` + (s.sys === 1 ? `<p>${esc(S.m_note)}</p>` : '') + `<p class="small">${esc(S.legend)}</p>`) + `<h3>${esc(S.meas_title)}</h3>` + tbl(S.meas_head, rows, 'plain'));
  };
  build();
};

/* ---- шаг 26: нервная система: мышь и крыса раздельно ---- */
W.neuro = ({S, s, set, out, onGroup, onSelect}) => {
  s.mode ??= 0; s.m ??= 0; s.r ??= 0;
  const build = () => {
    const E = s.mode === 0 ? S.m_exps : S.r_exps;
    set(S.title, S.status, buttonGroup('nu-m', S.modes, s.mode, S.mode_label) + `<div class="controls">${select('nu-e', S.exp_label, E.map(x => x.name), s.mode === 0 ? s.m : s.r)}</div>`);
    onGroup('nu-m', i => { s.mode = i; build(); });
    onSelect('nu-e', v => { if (s.mode === 0) s.m = v; else s.r = v; draw(); });
    draw();
  };
  const draw = () => {
    const e = (s.mode === 0 ? S.m_exps : S.r_exps)[s.mode === 0 ? s.m : s.r];
    const nr = Math.max(e.mol.length, e.beh.length, 1), RH = 58, top = 92;
    let H = top + nr * RH + 52, d = '';
    const gene = e.gene ? 235 : 0;
    H += gene;
    d += rect(0, 0, 640, H, '#fff', 0) + rect(12, 10, 616, 34, '#e2eaf6', 17, `stroke="${C.blue}" stroke-width="2"`) + tx(24, 33, e.sys + ' · ' + e.src, 15, 'start');
    d += tx(16, 72, S.h_mol, 16, 'start') + tx(336, 72, S.h_beh, 16, 'start') + line(16, 80, 306, 80, '#b5c7d6', 2) + line(336, 80, 624, 80, '#b5c7d6', 2) + line(320, 60, 320, top + nr * RH, '#d5e0ea', 2);
    const col = (items, x0) => items.length ? items.map((it, k) => {
      const y = top + k * RH;
      return lines4(x0, y + 14, it[0], 28, 14, 17) + badge4(x0 + 262, y + 14, it[1]);
    }).join('') : tx(x0, top + 20, S.none_row, 14, 'start');
    d += col(e.mol, 16) + col(e.beh, 336);
    if (e.gene) {
      const y0 = top + nr * RH + 20;
      d += tx(16, y0 + 8, S.gene_title, 15, 'start');
      e.gene.forEach((g, k) => {
        const y = y0 + 34 + k * 44;
        d += tx(16, y + 29, g, 14, 'start') + line(214, y + 12, 214, y, '#8aa0b3', 2) + arrow(214, y, 242, y, '#8aa0b3', 2) + rect(214, y + 12, 46, 24, '#dfe9f3', 4, 'stroke="#8aa0b3" stroke-width="1.5"') + tx(237, y + 29, S.exons[k], 13, 'middle') + line(260, y + 24, 400, y + 24, '#8aa0b3', 2, 'stroke-dasharray="4 3"') + badge4(430, y + 24, e.gene_v, 12);
      });
    }
    const nl = String(S.panel_note).split('. '); d += nl.map((t, k) => tx(16, H - 14 - (nl.length - 1 - k) * 16, t + (k < nl.length - 1 ? '.' : ''), 12, 'start')).join('');
    const desc = e.name + '. ' + e.mol.map(i => i[0]).join('; ') + '. ' + e.beh.map(i => i[0]).join('; ');
    out(svg(d, e.name, H, 640, desc), result(e.note.map(x => `<p>${esc(x)}</p>`).join('') + `<p class="small">${esc(S.legend)}</p>`));
  };
  build();
};

/* Схемы раздела 5: методы и итоговая задача. Подписи берутся из widget.s (S); в коде только числа и знаки. */

/* ---- шаг 27: измерение → альтернативное объяснение → контроль → допустимый вывод ---- */
W.methmx = ({S, s, set, out, onGroup, onSelect}) => {
  s.mode ??= 0; s.m ??= 0; s.d ??= 3;
  const build = () => {
    const ctl = s.mode === 0 ? `<div class="controls">${select('mx-m', S.m_label, S.methods.map(x => x[0]), s.m)}</div>`
      : `<div class="controls">${select('mx-d', S.d_label, S.designs.map(x => x[0]), s.d)}</div>`;
    set(S.title, S.status, buttonGroup('mx-mode', S.modes, s.mode, S.mode_label) + ctl);
    onGroup('mx-mode', i => { s.mode = i; build(); });
    if (s.mode === 0) onSelect('mx-m', i => { s.m = i; draw(); });
    else onSelect('mx-d', i => { s.d = i; draw(); });
    draw();
  };
  const draw = () => {
    if (s.mode === 0) {
      const m = S.methods[s.m], X = i => 4 + i * 131, BW = 108, Y = 66, H = 58;
      let d = rect(0, 0, 640, 176, '#fff', 0);
      /* обход «название метода → причина» перечёркнут: прямого перехода нет */
      const xa = X(1) + BW / 2, xb = X(4) + BW / 2, xm = (xa + xb) / 2;
      d += line(xa, Y, xa, 40, '#8aa0b3', 2, 'stroke-dasharray="6 4"') + line(xa, 40, xb, 40, '#8aa0b3', 2, 'stroke-dasharray="6 4"') + line(xb, 40, xb, Y - 2, '#8aa0b3', 2, 'stroke-dasharray="6 4"');
      d += cross(xm, 40) + tx(xm, 22, S.bypass, 13, 'middle');
      S.b_labels.forEach((b, i) => {
        const hi = i === 1;
        d += box(X(i), Y, BW, H, wrap3(b, 14).join('\n'), {fill: hi ? YEL : '#fff', stroke: hi ? C.orange : '#8aa0b3', size: 12, sw: hi ? 3 : 1.5});
        if (i < 4) d += arrow(X(i) + BW + 2, Y + H / 2, X(i + 1) - 2, Y + H / 2, C.blue, 2);
      });
      d += tx(320, 158, S.l_sel + nb + m[0], 15, 'middle');
      out(svg(d, S.title, 176, 640, S.b_labels.join(' → ')),
        kvList(S.k_head.map((h, j) => [h, m[j + 1]])) + `<h3>${esc(S.t_title)}</h3>` + selTable(S.t_head, S.methods.map(x => [x[0], x[1]]), s.m));
    } else {
      const dd = S.designs[s.d];
      out('', kvList(S.dk_head.map((h, j) => [h, dd[j + 1]])) + `<h3>${esc(S.dt_title)}</h3>` + selTable(S.dt_head, S.designs.map(x => [x[0], x[1]]), s.d));
    }
  };
  build();
};

/* ---- шаг 28: итоговая задача «предсказание → наблюдения → измерения → граница вывода» ---- */
W.invest = ({S, s, set, out, onSelect}) => {
  s.k ??= 0; s.t ??= {};
  const T = () => (s.t[s.k] ??= {p: '', ps: false, m: [], ms: false, b: '', bs: false});
  set(S.title, S.status, `<div class="controls">${select('iv-k', S.task_label, S.tasks.map((t, i) => (i + 1) + '. ' + t.name), s.k)}</div>`);
  onSelect('iv-k', i => { s.k = i; draw(); });
  const radios = (name, arr, val, dis) => `<div class="vlist" role="radiogroup" aria-labelledby="${name}-q">${arr.map((x, i) => `<label class="chk" for="${name}-${i}"><input type="radio" name="${name}" id="${name}-${i}" value="${i}"${String(val) === String(i) ? ' checked' : ''}${dis ? ' disabled' : ''}> <span>${esc(x)}</span></label>`).join('')}</div>`;
  const draw = (focus) => {
    const k = S.tasks[s.k], t = T();
    const X = i => 6 + i * 164, BW = 134;
    let d = rect(0, 0, 640, 134, '#fff', 0) + tx(8, 20, S.chain_title, 13, 'start');
    k.chain.forEach((c, i) => {
      const hi = t.ps && i === k.link;
      d += box(X(i), 42, BW, 78, wrap3(c, 17).join('\n'), {fill: hi ? YEL : '#fff', stroke: hi ? C.orange : '#8aa0b3', size: 13, sw: hi ? 3 : 1.5});
      if (i < 3) d += arrow(X(i) + BW + 2, 81, X(i + 1) - 2, 81, C.blue, 2);
      if (hi) d += i === 3 ? tx(X(i) + BW, 35, k.hl, 13, 'end') : tx(X(i) + BW / 2, 35, k.hl, 13, 'middle');
    });
    /* 1. предсказание */
    let h = kvList([[S.setup_label, k.setup]]);
    h += `<fieldset class="stage"><legend>${esc(S.st1)}</legend><p id="iv-p-q">${esc(k.pred_q)}</p>${radios('iv-p', k.pred, t.p, t.ps)}` +
      (t.ps ? '' : `<button id="iv-pb"${t.p === '' ? ' disabled' : ''}>${esc(S.pred_btn)}</button>`);
    if (t.ps) {
      const ok = Number(t.p) === k.pc;
      h += `<p class="fb ${ok ? 'good' : 'bad'}" tabindex="-1" data-f="p"><strong>${esc(ok ? S.pred_right : S.pred_wrong)}</strong> ${esc(k.pfb[Number(t.p)])}</p>`;
      if (!ok) h += `<p class="fb"><strong>${esc(S.pred_is)}</strong> ${esc(k.pred[k.pc])} ${esc(k.pfb[k.pc])}</p>`;
    }
    h += `</fieldset>`;
    /* 2. наблюдения */
    if (t.ps) h += `<fieldset class="stage"><legend>${esc(S.st2)}</legend><ul class="obs">${k.obs.map(x => `<li>${esc(x)} <span class="tag">${esc(S.obs_tag)}</span></li>`).join('')}</ul></fieldset>`;
    /* 3. измерения и контроли */
    if (t.ps) {
      h += `<fieldset class="stage"><legend>${esc(S.st3)}</legend>`;
      if (!t.ms) {
        h += `<p>${esc(S.meas_q)}</p><div class="vlist">${k.meas.map((m, i) => check('iv-m' + i, m[0], !!t.m[i])).join('')}</div><button id="iv-mb">${esc(S.meas_btn)}</button>`;
      } else {
        const a = k.meas.filter((m, i) => t.m[i] && m[1]).length, b = k.meas.filter(m => m[1]).length, c = k.meas.filter((m, i) => t.m[i] && !m[1]).length;
        h += `<p tabindex="-1" data-f="m"><strong>${esc(fmt(S.summ, {a, b, c}))}</strong></p><div class="table-scroll"><table class="plain"><thead><tr>${S.t_head.map(x => `<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>` +
          k.meas.map((m, i) => `<tr${!!t.m[i] !== !!m[1] ? ' class="miss"' : ''}><th scope="row">${esc(m[0])}</th><td>${esc(t.m[i] ? S.yes : S.no)}</td><td>${esc(m[1] ? S.yes : S.no)}</td><td>${esc(m[2])}</td></tr>`).join('') + `</tbody></table></div>`;
      }
      h += `</fieldset>`;
    }
    /* 4. граница вывода */
    if (t.ms) {
      h += `<fieldset class="stage"><legend>${esc(S.st4)}</legend><p id="iv-b-q">${esc(S.bound_q)}</p>${radios('iv-b', k.bound, t.b, t.bs)}` +
        (t.bs ? '' : `<button id="iv-bb"${t.b === '' ? ' disabled' : ''}>${esc(S.bound_btn)}</button>`);
      if (t.bs) {
        const ok = Number(t.b) === k.bc;
        h += `<p class="fb ${ok ? 'good' : 'bad'}" tabindex="-1" data-f="b"><strong>${esc(ok ? S.pred_right : S.pred_wrong)}</strong> ${esc(k.bfb[Number(t.b)])}</p>`;
        if (!ok) h += `<p class="fb"><strong>${esc(S.bound_is)}</strong> ${esc(k.bound[k.bc])} ${esc(k.bfb[k.bc])}</p>`;
      }
      h += `</fieldset>`;
    }
    if (t.ps) h += `<button id="iv-r">${esc(S.reset)}</button>`;
    out(svg(d, k.name, 134, 640, k.chain.join(' → ')), h);
    /* обработчики создаются после каждой отрисовки */
    const pb = $('iv-pb'), bb = $('iv-bb'), mb = $('iv-mb'), r = $('iv-r');
    document.querySelectorAll('input[name=iv-p]').forEach(x => { x.onchange = () => { t.p = x.value; if (pb) pb.disabled = false; }; });
    document.querySelectorAll('input[name=iv-b]').forEach(x => { x.onchange = () => { t.b = x.value; if (bb) bb.disabled = false; }; });
    if (pb) pb.onclick = () => { t.ps = true; draw('[data-f=p]'); };
    k.meas.forEach((m, i) => { const c = $('iv-m' + i); if (c) c.onchange = () => { t.m[i] = c.checked; }; });
    if (mb) mb.onclick = () => { t.ms = true; draw('[data-f=m]'); };
    if (bb) bb.onclick = () => { t.bs = true; draw('[data-f=b]'); };
    if (r) r.onclick = () => { delete s.t[s.k]; draw(); };
    if (focus) { const e = $('widget-result').querySelector(focus); if (e) e.focus(); }
  };
  draw();
};

/* запуск */
navigate(location.hash.slice(1) || 'home');
