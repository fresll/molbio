<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 11 · Протеостаз, убиквитин-протеасомная система, ERAD и аутофагический поток — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}
.semnav .sn-t{display:block;font-size:14px;margin-top:2px}
.semnav .sn-l{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:6px;text-align:left}
.semnav .sn-soon .sn-k{color:var(--muted)}
@media (max-width:600px){.semnav{grid-template-columns:1fr}.semnav .sn-next,.semnav .sn-soon{text-align:left}.semnav .sn-empty{display:none}}
@media print{.semnav{display:none}}
.side .totake{position:sticky;bottom:0;z-index:3;justify-self:end;margin-top:-4px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--surface)}
.side .take{scroll-margin-bottom:8px}
#scenes [data-g]:focus{outline:none}
#scenes [data-g]:focus-visible{outline:3px solid var(--u-ui,#006CA3);outline-offset:2px}
.routes a.btn{text-decoration:none}   /* семинары 7–10 подчёркивали кнопки «Объяснения», 1–6 — нет: единый вид */
.zhint{display:none;margin:0 0 6px;padding:0 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
@media (max-width:700px){
  .stage.zoomed svg{width:760px}
  .stage.zoomed .zhint{display:block}
}

adp3": "субстрат удерживается", "s1b_e_hyd": "гидролиз ATP (ускоряет J-белок)", "s1b_e_rel": "выход ADP, связывание ATP (ускоряет NEF)", "s1b_jdp": "J-белок + субстрат", "s1b_nef": "NEF", "s1b_sub_free": "освобождённый", "s1b_sub_free2": "субстрат", "s1b_lim": "лимитирующая стадия:", "s1b_t_j": "J-белок (Hsp40)", "s1b_t_nef": "Фактор обмена нуклеотидов (NEF)", "s1b_atp_note": "ATP в среде есть всегда; субстрат — развёрнутый белок. Учебная модель, условные скорости.", "s1b_r_adp": "Hsp70 в ADP-состоянии (крышка закрыта)", "s1b_r_rate": "Скорость цикла", "s1b_r_rate_s": "гидролиз ATP: во сколько раз быстрее, чем без J-белка и NEF", "s1b_r_hold": "Время удержания субстрата в одном цикле", "s1b_r_hold_s": "условные единицы; без NEF — 1", "s1b_r_lim": "Лимитирующая стадия", "s1b_lim_h": "гидролиз ATP", "s1b_lim_d": "выход ADP", "s1b_c_none": "J-белка и NEF нет. Hsp70 сам гидролизует ATP медленно, поэтому большую часть времени находится в ATP-состоянии с открытым SBD: субстрат связывается и быстро отходит.", "s1b_c_none_z": "Без кошаперонов цикл медленный, а субстрат удерживается прочно лишь изредка, поэтому Hsp70 слабо защищает развёрнутые белки от агрегации.", "s1b_c_j": "J-белок доставляет субстрат и стимулирует гидролиз ATP: Hsp70 быстро переходит в ADP-состояние, и крышка закрывается над субстратом. Без NEF ADP выходит медленно, поэтому почти весь Hsp70 остаётся в ADP-состоянии.", "s1b_c_j_z": "Субстрат прочно удерживается и не агрегирует, но освобождается редко, поэтому новых попыток свернуться мало.", "s1b_c_nef": "NEF ускоряет выход ADP, но без J-белка гидролиз ATP остаётся медленным. Hsp70 почти всё время находится в ATP-состоянии, а цикл идёт лишь немного быстрее исходного.", "s1b_c_nef_z": "Ускорить цикл одним NEF нельзя: сначала нужен быстрый гидролиз ATP, который запускает J-белок вместе с субстратом.", "s1b_c_both": "J-белок ускоряет гидролиз ATP и захват субстрата, NEF ускоряет выход ADP и освобождение субстрата. Цикл идёт во много раз быстрее, чем без кошаперонов.", "s1b_c_both_z": "Каждый цикл даёт субстрату новую попытку свернуться: частые короткие циклы защищают белок от агрегации и не задерживают его в комплексе надолго.", "s1b_take": "Гидролиз ATP закрывает крышку SBD над субстратом, а замена ADP на ATP открывает её. J-белок ускоряет первую стадию и тем самым захват субстрата, NEF — вторую и тем самым его освобождение. Скорость цикла определяет более медленная стадия, поэтому J-белок и NEF действуют в паре. Неисправимый субстрат Hsp70 передаёт системам деградации — об этом вопрос 2.", "p1b_1_q": "В среде есть Hsp70, ATP и развёрнутый субстрат; J-белка и NEF нет. Добавили J-белок. Как изменится доля Hsp70 в ADP-состоянии с закрытой крышкой?", "p1b_1_o1": "Резко возрастёт", "p1b_1_o2": "Не изменится", "p1b_1_o3": "Снизится", "p1b_1_e": "J-белок вместе с субстратом ускоряет гидролиз ATP (в модели в 100 раз), а выход ADP без NEF остаётся медленным. Поэтому Hsp70 накапливается в ADP-состоянии: его доля растёт с 25 до 97 %.", "p1b_1_w2": "J-белок не только доставляет субстрат: его J-домен с мотивом HPD связывается с Hsp70 и стимулирует гидролиз ATP, а от скорости гидролиза зависит доля ADP-состояния.", "p1b_1_w3": "Долю ADP-состояния снижало бы ускорение выхода ADP — так действует NEF. J-белок ускоряет другую стадию цикла, гидролиз ATP.", "p1b_2_q": "В среде есть Hsp70, ATP, субстрат и J-белок; NEF нет. Добавили NEF. Как изменится время удержания субстрата в одном цикле?", "p1b_2_o1": "Увеличится", "p1b_2_o2": "Уменьшится во много раз", "p1b_2_o3": "Не изменится", "p1b_2_e": "NEF связывается с NBD в ADP-состоянии и ускоряет выход ADP (в модели в 60 раз); ATP из среды занимает карман, крышка открывается, и субстрат освобождается. Время удержания сокращается в 60 раз, а цикл идёт в 22 раза быстрее.", "p1b_2_w1": "Время удержания увеличивают белки, стабилизирующие ADP-состояние (например, Hip). NEF действует противоположно — ускоряет выход ADP.", "p1b_2_w3": "Субстрат освобождается только после выхода ADP и связывания ATP. NEF ускоряет именно выход ADP, поэтому время удержания зависит от NEF.", "p1b_3_q": "В среде есть Hsp70, ATP, субстрат, J-белок и NEF, и цикл идёт быстро. J-белок удалили, NEF оставили. Как изменится скорость цикла (гидролиза ATP)?", "p1b_3_o1": "Останется высокой", "p1b_3_o2": "Возрастёт ещё больше", "p1b_3_o3": "Снизится почти до исходной", "p1b_3_e": "Без J-белка гидролиз ATP снова медленный, и теперь именно он ограничивает цикл. Ускоренный выход ADP не помогает: Hsp70 почти всё время находится в ATP-состоянии, и скорость падает с ×86 до ×1,3.", "p1b_3_w1": "NEF ускоряет только выход ADP. Когда гидролиз медленный, Hsp70 почти не переходит в ADP-состояние, и ускорять NEF почти нечего.", "p1b_3_w2": "J-белок ускоряет одну из двух стадий цикла; его удаление не может сделать цикл быстрее.", "p1b_4_q": "В среде есть Hsp70, ATP и субстрат; J-белка и NEF нет. Добавили только NEF. Как изменится скорость цикла (гидролиза ATP)?", "p1b_4_o1": "Возрастёт незначительно", "p1b_4_o2": "Возрастёт во много раз", "p1b_4_o3": "Упадёт почти до нуля", "p1b_4_e": "Без J-белка цикл ограничен медленным гидролизом ATP. NEF ускоряет выход ADP, но эта стадия и без него была быстрее гидролиза, поэтому скорость меняется мало (с ×1 до ×1,3), а доля ADP-состояния падает почти до нуля.", "p1b_4_w2": "Многократное ускорение было бы, если бы цикл ограничивался выходом ADP. Без J-белка его ограничивает гидролиз ATP, на который NEF не действует.", "p1b_4_w3": "NEF не останавливает цикл: после выхода ADP Hsp70 связывает ATP и может снова его гидролизовать.", "p1b_5_q": "В среде есть Hsp70, ATP, субстрат и J-белок; NEF нет. Какая стадия ограничивает скорость цикла Hsp70 в этих условиях?", "p1b_5_o1": "Гидролиз ATP", "p1b_5_o2": "Выход ADP из NBD", "p1b_5_o3": "Связывание субстрата с SBD", "p1b_5_e": "J-белок ускорил гидролиз в 100 раз, и Hsp70 быстро переходит в ADP-состояние, а выход ADP без NEF медленный. Поэтому 97 % Hsp70 находятся в ADP-состоянии с удерживаемым субстратом: молекулы накапливаются перед самой медленной стадией.", "p1b_5_w1": "Гидролиз ограничивает цикл, когда J-белка нет. Здесь J-белок его ускоряет, и почти весь Hsp70 уже находится в ADP-состоянии.", "p1b_5_w3": "В ATP-состоянии субстрат связывается быстро. Если бы лимитировало связывание, Hsp70 оставался бы в ATP-состоянии, а здесь он почти весь в ADP-состоянии.", "s1a_tube": "реакционная смесь in vitro · люцифераза после нагревания", "s1a_n_u": "развёрнутая люцифераза", "s1a_n_u2": "склонна к агрегации", "s1a_n_b": "Hsc70·ADP·люцифераза", "s1a_n_b2": "крышка закрыта", "s1a_n_n": "нативная люцифераза", "s1a_n_n2": "активна: излучает свет", "s1a_n_a": "агрегаты", "s1a_n_a2": "в модели не растворяются", "s1a_e_cap": "захват: J-белок + гидролиз ATP", "s1a_e_cap_na": "медленное связывание без ATP", "s1a_n_b_na": "Hsc70·люцифераза", "s1a_n_b2_na": "без нуклеотида", "s1a_e_rel": "освобождение без сворачивания", "s1a_e_fold": "освобождение", "s1a_e_fold2": "и сворачивание", "s1a_e_agg": "агрегация", "s1a_e_sp": "самопроизвольное", "s1a_e_sp2": "сворачивание", "s1a_e_sp3": "(медленное)", "s1a_e_note": "толщина стрелки — сколько люциферазы прошло этим путём за 60 мин (учебная модель)", "s1a_mask": "Состав смеси скрыт — определите его по показаниям", "s1a_t_h": "Hsc70", "gt_q1_wt": "дикий тип", "gt_q1_k71m": "K71M", "gt_q1_noh": "нет", "s1a_t_j": "J-белок", "gt_q1_noj": "нет", "gt_q1_jwt": "DNAJB1", "gt_q1_qpd": "DNAJB1 H32Q", "s1a_t_n": "Фактор обмена нуклеотидов", "gt_q1_non": "нет", "gt_q1_h110": "Hsp110", "gt_q1_bag1": "BAG1", "s1a_t_r": "BAG1, % от количества Hsc70", "s1a_t_atp": "ATP в смеси", "s1a_reveal": "Показать состав смеси", "gt_q1_wt_c": "Hsc70", "gt_q1_k71m_c": "Hsc70 K71M", "gt_q1_jwt_c": "J-белок DNAJB1", "gt_q1_qpd_c": "DNAJB1 H32Q", "gt_q1_h110_c": "NEF: Hsp110", "gt_q1_bag1_c": "NEF: BAG1, {r} %", "s1a_r_when": "Через 60 мин, % от всей люциферазы", "s1a_r_n": "нативная (активная)", "s1a_r_b": "в комплексе с Hsc70", "s1a_r_a": "в агрегатах", "s1a_r_u": "развёрнутая, свободная", "s1a_plot_t": "Активность люциферазы во времени", "s1a_ax_t": "время от начала, мин", "s1a_ax_n": "% от нативной", "s1a_l_cur": "выбранная смесь", "s1a_l_ref": "полная смесь с Hsp110", "s1a_bell_t": "Активность через 60 мин в зависимости от количества BAG1", "s1a_ax_r": "BAG1, % от Hsc70", "s1a_ax_n60": "% от нативной", "s1a_plot_note": "Учебная модель, относительные величины; ориентиры — эксперименты in vitro с люциферазой (Szabo 1994; Gässler 2001).", "s1a_c_full": "Hsc70 вместе с J-белком и ATP захватывает развёрнутую люциферазу, а NEF ускоряет её освобождение. После многих циклов значительная часть люциферазы восстанавливает активность; остальная агрегирует.", "s1a_c_full_z": "Повторные циклы связывания и освобождения дают белку несколько попыток свернуться: за один цикл сворачивается лишь часть молекул (Szabo 1994).", "s1a_c_noh": "Hsc70 в смеси нет. Развёрнутая люцифераза в основном агрегирует; самопроизвольно сворачивается лишь малая её часть.", "s1a_c_noh_z": "Это контроль без шаперона: с ним сравнивают вклад каждого компонента смеси.", "s1a_c_noatp": "ATP в смеси нет. Hsc70 медленно связывает часть люциферазы и не освобождает её; остальная люцифераза агрегирует, и сворачивания почти нет.", "s1a_c_noatp_z": "Без ATP цикл не идёт: нет ни прочного захвата после гидролиза, ни освобождения субстрата после связывания ATP.", "s1a_c_k71m": "Hsc70 K71M связывает ATP, но не гидролизует его. Субстрат связывается в открытом ATP-состоянии и быстро отходит, поэтому люцифераза агрегирует почти так же, как без шаперона.", "s1a_c_k71m_z": "Для прочного захвата субстрата нужен гидролиз ATP: одного связывания ATP недостаточно.", "s1a_c_noj": "J-белка нет. Собственный гидролиз ATP у Hsc70 медленный: субстрат чаще уходит, чем удерживается, и большая часть люциферазы агрегирует.", "s1a_c_noj_z": "J-белок сопрягает захват субстрата с гидролизом ATP: именно он делает захват частым.", "s1a_c_qpd": "J-белок с заменой H32Q (мотив QPD вместо HPD) не стимулирует гидролиз ATP у Hsc70. Захват редок, и большая часть люциферазы агрегирует.", "s1a_c_qpd_z": "Мотив HPD J-домена нужен для стимуляции гидролиза; без него J-белок не может включить Hsc70 в работу.", "s1a_c_non": "Фактора обмена нуклеотидов нет или его очень мало. Hsc70 захватывает люциферазу, но ADP выходит медленно, поэтому значительная часть люциферазы остаётся в комплексе с Hsc70, а сворачивание идёт медленно.", "s1a_c_non_z": "Захват защищает белок от агрегации, но без освобождения он не может свернуться.", "s1a_c_bagx": "BAG1 в избытке. Выход ADP ускорен так сильно, что субстрат освобождается раньше, чем меняется его конформация. Циклов больше, но каждый реже заканчивается сворачиванием, и активность ниже, чем при умеренном количестве BAG1.", "s1a_c_bagx_z": "У фактора обмена есть оптимальное количество: и недостаток, и избыток снижают выход сворачивания (учебная модель; в экспериментах in vitro — Gässler 2001).", "s1a_c_myst": "Состав смеси скрыт. По показаниям определите, какой компонент отсутствует или неисправен.", "s1a_c_myst_z": "Соотношение свёрнутой, связанной и агрегированной люциферазы указывает, какая стадия цикла нарушена.", "s1a_take": "Активность люциферазы восстанавливается, только если работают обе стадии цикла: J-белок с мотивом HPD запускает гидролиз ATP и прочный захват, NEF ускоряет освобождение. Без ATP, у Hsc70 K71M или без мотива HPD прочного захвата нет, и люцифераза агрегирует. Без NEF она остаётся в комплексе с Hsc70, а при избытке NEF освобождается преждевременно. Если субстрат не сворачивается после многих циклов, его направляют на деградацию (вопрос 2).", "p1a_1_q": "В смеси Hsc70, DNAJB1, Hsp110 и ATP. DNAJB1 заменили на мутант H32Q (мотив HPD заменён на QPD). Как изменится активность люциферазы через 60 мин?", "p1a_1_o1": "Останется прежней", "p1a_1_o2": "Возрастёт в несколько раз", "p1a_1_o3": "Снизится в несколько раз", "p1a_1_e": "Мутант H32Q не стимулирует гидролиз ATP у Hsc70. Субстрат уходит из открытого ATP-состояния раньше, чем закроется крышка, и большая часть люциферазы агрегирует: активность 7 % вместо 67 %.", "p1a_1_w1": "Доставки субстрата недостаточно: прочный захват требует гидролиза ATP, а его запускает мотив HPD.", "p1a_1_w2": "Без стимуляции гидролиза Hsc70 захватывает субстрат реже, а не чаще; меньший расход ATP не повышает выход сворачивания.", "p1a_2_q": "Смесь для сворачивания: Hsc70, DNAJB1, Hsp110 и ATP. Из неё убрали ATP (свечение, как и прежде, измеряют в смеси с ATP). Как изменится активность люциферазы через 60 мин?", "p1a_2_o1": "Снизится примерно вдвое", "p1a_2_o2": "Почти перестанет восстанавливаться", "p1a_2_o3": "Почти не изменится", "p1a_2_e": "Без ATP цикл не идёт: Hsc70 медленно связывает часть люциферазы и не освобождает её, а остальная люцифераза агрегирует. Активность — около 1 % вместо 67 %.", "p1a_2_w1": "Двукратное снижение соответствовало бы замедлению цикла. Без ATP нет ни прочного захвата, ни освобождения, и цикл не идёт совсем.", "p1a_2_w3": "Hsc70 не сворачивает белок однократным связыванием: нужны повторные циклы связывания и освобождения, а они требуют ATP (Szabo 1994).", "p1a_3_q": "В смеси Hsc70, DNAJB1 и ATP; фактора обмена нуклеотидов нет. Добавили Hsp110. Как изменится активность люциферазы через 60 мин?", "p1a_3_o1": "Возрастёт в несколько раз", "p1a_3_o2": "Снизится в несколько раз", "p1a_3_o3": "Почти не изменится", "p1a_3_e": "Без NEF люцифераза накапливается в комплексе Hsc70·ADP: ADP выходит медленно, и субстрат почти не освобождается (связано около 75 %). Hsp110 ускоряет выход ADP, циклы повторяются, и активность растёт с 14 до 67 %.", "p1a_3_w2": "Здесь Hsp110 действует как фактор обмена нуклеотидов: он ускоряет освобождение субстрата из комплекса с Hsc70 и возвращает субстрату возможность свернуться.", "p1a_3_w3": "Самопроизвольный выход ADP из Hsc70 медленный: за 60 мин большая часть люциферазы так и остаётся в комплексе с Hsc70.", "p1a_4_q": "В смеси Hsc70, DNAJB1, ATP и BAG1 в количестве 10 % от Hsc70. Количество BAG1 увеличили до 100 %. Как изменится активность люциферазы через 60 мин?", "p1a_4_o1": "Возрастёт: циклов станет больше", "p1a_4_o2": "Не изменится: NEF уже достаточно", "p1a_4_o3": "Снизится: освобождение будет ранним", "p1a_4_e": "Избыток BAG1 так ускоряет выход ADP, что субстрат чаще освобождается раньше, чем изменится его конформация. Доля продуктивных освобождений падает, и активность снижается с 71 до 36 % (учебная модель; подавление сворачивания люциферазы избытком BAG-1M in vitro — Gässler 2001).", "p1a_4_w1": "Число циклов действительно растёт, но каждое освобождение реже заканчивается сворачиванием; в модели второй эффект сильнее первого.", "p1a_4_w2": "Насыщения нет: на графике зависимости от BAG1 активность через 60 мин продолжает снижаться при росте его количества.", "p1a_5_q": "Смесь: Hsc70, DNAJB1, Hsp110 и ATP. Hsc70 дикого типа заменили на Hsc70 K71M, который связывает ATP, но не гидролизует его. Как изменится доля агрегатов люциферазы через 60 мин?", "p1a_5_o1": "Снизится", "p1a_5_o2": "Возрастёт", "p1a_5_o3": "Почти не изменится", "p1a_5_e": "В ATP-состоянии субстрат связывается и отходит быстро; без гидролиза крышка не закрывается, и прочного комплекса нет. Люцифераза агрегирует почти так же, как без шаперона: агрегатов 97 % вместо 32 %.", "p1a_5_w1": "Hsc70 K71M не переходит в ADP-состояние, а прочно субстрат удерживается именно в ADP-состоянии; поэтому защиты от агрегации нет.", "p1a_5_w3": "Доля агрегатов зависит от того, успевает ли Hsc70 удержать субстрат; без гидролиза ATP он этого не успевает.", "p1a_6_q": "Состав смеси скрыт. Через 60 мин: активность около 14 %, в комплексе с Hsc70 — около 75 % люциферазы, в агрегатах — около 10 %. Какой компонент отсутствует или несёт аминокислотную замену?", "p1a_6_o1": "Нет фактора обмена нуклеотидов", "p1a_6_o2": "J-белок с заменой в мотиве HPD", "p1a_6_o3": "Hsc70 K71M без гидролиза ATP", "p1a_6_e": "Агрегатов мало, значит, люцифераза захвачена: гидролиз ATP и J-белок работают. Но большая часть её остаётся в комплексе с Hsc70, то есть нарушено освобождение. Такая картина наблюдается без NEF.", "p1a_6_w2": "При J-белке с заменой в мотиве HPD гидролиз не стимулирован, захват редок, и люцифераза в основном агрегирует; здесь агрегатов мало.", "p1a_6_w3": "Hsc70 K71M не удерживает субстрат прочно: связанной люциферазы было бы мало, а агрегатов — много.", "gn_q1_hsp70": "Hsp70 (Hsc70 — HSPA8; HSPA1A)", "g_q1_hsp70": "Шаперон из двух доменов. N-концевой нуклеотид-связывающий домен (NBD) связывает и гидролизует ATP, C-концевой субстрат-связывающий домен (SBD) связывает открытые гидрофобные участки полипептида; над карманом SBD расположена α-спиральная крышка. В ATP-состоянии SBD открыт: субстрат связывается и отходит быстро. После гидролиза ATP крышка закрывается, и субстрат отходит медленно (Rosenzweig 2019; Wentink 2026). Сочетание быстрого связывания в ATP-состоянии и медленного отхода в ADP-состоянии даёт сродство выше, чем у любого из двух равновесных состояний (De Los Rios 2014). У человека 11 белков семейства Hsp70 (Wentink 2026, с исправлением авторов): Hsc70 (HSPA8) синтезируется постоянно, синтез HSPA1A усиливается при тепловом стрессе, в ЭПР работает BiP, в митохондриях — mtHsp70. В модели все они представлены одним Hsp70.", "gn_q1_jdp": "J-белок (JDP, Hsp40), DNAJB1", "g_q1_jdp": "J-доменные белки (у человека около 50) связывают субстраты или привлекают Hsp70 к определённым комплексам (Wentink 2026). Их J-домен с мотивом His-Pro-Asp (HPD) взаимодействует с Hsp70 и стимулирует гидролиз ATP. Стимуляция особенно сильна, когда субстрат одновременно связан с SBD: в экспериментах с бактериальными DnaK и DnaJ гидролиз ускорялся более чем в 1000 раз (Laufen 1999; структурный механизм — Kityk 2018). Замена гистидина мотива HPD (у DNAJB1 человека — H32Q) лишает J-белок способности стимулировать гидролиз. DNAJB1 — цитоплазматический J-белок класса B. В модели стимуляция задана учебным коэффициентом 100.", "gn_q1_nef": "Фактор обмена нуклеотидов (NEF): Hsp110, BAG1", "g_q1_nef": "NEF связывается с NBD Hsp70 в ADP-состоянии и снижает его сродство к нуклеотиду. ADP выходит, карман занимает ATP, крышка открывается, и субстрат освобождается. У человека 13 NEF четырёх семейств: GrpE-подобные (в митохондриях), Hsp110, белки с повторами армадилло (HspBP1 и SIL1 в ЭПР) и белки BAG (Wentink 2026); у бактерий это GrpE. BAG-1M ускорял выход ADP из Hsc70 до 900 раз. В экспериментах in vitro BAG-1M в высокой концентрации в отсутствие фосфата подавлял сворачивание люциферазы, а в низкой концентрации в присутствии фосфата усиливал его (Gässler 2001). Hsp110 вместе с Hsp70 и J-белками участвует и в растворении агрегатов (Rampelt 2012). В модели Hsp110 взят в одном количестве, количество BAG1 задаётся ползунком.", "gn_q1_sub": "Субстрат Hsp70", "g_q1_sub": "Развёрнутый, неправильно свёрнутый или ещё не собранный в комплекс полипептид с открытыми гидрофобными участками. Hsp70 не задаёт ему готовую нативную структуру. Связывание с Hsp70 может изменять конформацию субстрата и устранять ошибочно свёрнутые состояния; после освобождения часть молекул приобретает нативную структуру, остальные связываются повторно (Imamoglu 2020). За один цикл сворачивается лишь часть молекул, поэтому для полного восстановления нужны многие циклы (Szabo 1994).", "gn_q1_luc": "Люцифераза светлячка как модельный субстрат", "g_q1_luc": "После нагревания или обработки денатурирующими веществами люцифераза разворачивается и теряет активность. Свет при окислении люциферина излучают только правильно свёрнутые молекулы, поэтому по свечению судят о доле нативной люциферазы (Szabo 1994; Gässler 2001). Эксперимент состоит из двух стадий. Сначала люцифераза сворачивается в смеси с шаперонами; затем из неё отбирают одинаковые пробы, разводят в регистрационной смеси с люциферином, ATP и Mg²⁺ и сразу измеряют свечение. ATP нужен и самой люциферазе для реакции свечения, поэтому в контроле «без ATP» его нет только на стадии сворачивания (Imamoglu 2020). Это измерение in vitro: концентрации шаперонов, ATP и субстрата задают экспериментаторы, и результат в клетке может отличаться.", "gn_q1_agg": "Агрегаты", "g_q1_agg": "Развёрнутые молекулы связываются друг с другом гидрофобными участками и образуют агрегаты; в агрегате белок не может свернуться. В модели агрегаты не растворяются. У животных Hsp70 вместе с J-белками классов A и B и Hsp110 способен растворять агрегаты (Rampelt 2012; Nillegoda 2015), но в модели этот процесс не учитывается.", "gn_q1_atp": "ATP и Hsc70 K71M", "g_q1_atp": "Гидролиз ATP в NBD переводит Hsp70 в ADP-состояние с закрытой крышкой, связывание новой молекулы ATP открывает крышку. Без ATP цикл не идёт. У Hsc70 с заменой K71M (а также K71E и K71A) ATP связывается, но не гидролизуется: в кристаллах мутантных белков в кармане находился ATP (O'Brien 1996; ATPазный фрагмент Hsc70 быка).", "s2_cyto": "цитоплазма", "s2_atp": "ATP → AMP + PPi", "s2_transfer": "перенос убиквитина: E1 → E2 → E3", "s2_bind": "E3 связывает дегрон", "s2_sub": "субстрат", "s2_deg_s": "дегрон", "s2_deg_mut": "замены остатков", "s2_k48": "цепь K48", "s2_bort_s": "бортезомиб", "s2_pep": "пептиды", "s2_recyc": "убиквитин освобождается (Rpn11)", "s2_lg_flux": "перенос убиквитина или путь субстрата", "s2_lg_bind": "связывание", "pill_bind": "связывает", "pill_nobind": "не связывает", "s2b_deg_t": "Дегрон субстрата", "s2b_deg_on": "дикого типа", "s2b_deg_off": "с заменами остатков", "s2b_bort_t": "Бортезомиб, 60 мин", "s2b_r_rec": "E3 и дегрон", "s2b_r_rec_s": "связывает ли убиквитинлигаза субстрат", "s2b_r_tot": "содержание субстрата (все формы), × от клеток с дегроном дикого типа без препарата", "s2b_r_ub": "доля полиубиквитинированной формы субстрата", "s2b_r_half": "период полужизни субстрата (все формы)", "s2b_r_half_s": "синтез остановлен циклогексимидом в стационарном состоянии; учебная модель", "s2b_r_half_sb": "синтез остановлен после 60 мин действия бортезомиба, препарат остаётся в среде; учебная модель", "s2b_c_deg": "Дегрон дикого типа. Убиквитинлигаза E3 связывает дегрон субстрата и переносит на остаток лизина убиквитин, полученный от E2; повторные циклы строят цепь, связанную через K48. 26S-протеасома связывает цепь, отщепляет её и расщепляет белок до пептидов. Субстрат разрушается быстро, поэтому его мало, а полиубиквитинированная форма составляет небольшую долю.", "s2b_c_deg_z": "Короткое время жизни позволяет быстро менять содержание регулятора: при остановке синтеза его количество снижается за минуты.", "s2b_c_mut": "Несинонимичные мутации в гене белка привели к заменам аминокислотных остатков дегрона. E1, E2 и протеасома работают, но E3 не связывает изменённый дегрон, и убиквитин к нему почти не присоединяется. Белок разрушается медленно, и в стационарном состоянии его содержание во много раз выше, чем у белка с дегроном дикого типа.", "s2b_c_mut_z": "Избирательность разрушения задаёт узнавание дегрона лигазой E3. Протеасома расщепляет белки, к которым присоединена цепь убиквитина, и сама не выбирает субстрат по его последовательности.", "s2b_c_deg_bort": "Дегрон дикого типа, протеасома 60 мин ингибирована бортезомибом. Убиквитинирование продолжается, а расщепление почти остановлено: полиубиквитинированная форма субстрата накапливается, и общее содержание субстрата растёт.", "s2b_c_deg_bort_z": "Накопление полиубиквитинированной формы при ингибиторе протеасомы показывает, что субстрат в норме разрушается 26S-протеасомой после убиквитинирования.", "s2b_c_mut_bort": "Остатки дегрона заменены, протеасома 60 мин ингибирована бортезомибом. Субстрат и без препарата почти не убиквитинировался, поэтому ингибитор протеасомы мало меняет его содержание: в учебной модели оно повышается менее чем на десятую часть.", "s2b_c_mut_bort_z": "Бортезомиб стабилизирует только белки, которые разрушаются протеасомой; белок с заменами в дегроне к ним почти не относится.", "s2b_take": "Цикл Hsp70 даёт белку повторные попытки свернуться. Если белок должен быть удалён, его отмечает убиквитинлигаза E3, узнающая дегрон. E1 расходует ATP на активацию убиквитина, E2 и E3 строят цепь K48, а 26S-протеасома связывает эту цепь и расщепляет белок. Замена ключевых остатков дегрона стабилизирует белок, ингибитор протеасомы приводит к накоплению его полиубиквитинированной формы.", "p2b_1_q": "Клетки синтезируют короткоживущий белок с дегроном дикого типа. В гене белка заменили кодоны нескольких остатков дегрона, и из-за аминокислотных замен E3 не связывает субстрат. Как изменится стационарное содержание этого белка?", "p2b_1_o1": "Повысится во много раз", "p2b_1_o2": "Почти не изменится", "p2b_1_o3": "Снизится в несколько раз", "p2b_1_e": "Скорость синтеза прежняя, а скорость разрушения резко уменьшилась: без связывания с E3 белок почти не убиквитинируется и не попадает в протеасому. Стационарное содержание определяется отношением синтеза к разрушению, поэтому в учебной модели оно возрастает примерно в 18 раз, а период полужизни — с 9 мин до 3 ч.", "p2b_1_w2": "Протеасома сама не узнаёт последовательность субстрата; если E3 не узнаёт дегрон, цепь убиквитина не строится, и белок к ней почти не поступает, поэтому его содержание не может остаться прежним.", "p2b_1_w3": "Замены в дегроне не ускоряют разрушение: они лишают E3 возможности связать субстрат, и убиквитин к белку почти не присоединяется.", "p2b_2_q": "Клетки с белком, у которого дегрон дикого типа, 60 мин инкубируют с бортезомибом, ингибитором β5-центров протеасомы. Как изменится доля полиубиквитинированной формы этого белка?", "p2b_2_o1": "Снизится, потому что E3 подавлена", "p2b_2_o2": "Повысится в несколько раз", "p2b_2_o3": "Останется прежней", "p2b_2_e": "Бортезомиб не действует на E1, E2 и E3: цепь убиквитина продолжает присоединяться, а расщепление полиубиквитинированного белка почти остановлено. Эта форма накапливается: в учебной модели её доля растёт с 11 до 60 %.", "p2b_2_w1": "Мишень бортезомиба — протеолитические центры 20S-частицы, а не убиквитинлигаза; присоединение убиквитина к субстрату продолжается.", "p2b_2_w3": "Доля могла бы остаться прежней, если бы одновременно остановилось и убиквитинирование; бортезомиб же останавливает только расщепление, и полиубиквитинированная форма перестаёт убывать.", "p2b_3_q": "В дегроне белка заменены аминокислотные остатки, и E3 его не узнаёт. Клетки 60 мин инкубируют с бортезомибом. Как изменится содержание этого белка по сравнению с теми же клетками без препарата?", "p2b_3_o1": "Повысится в несколько раз", "p2b_3_o2": "Снизится в несколько раз", "p2b_3_o3": "Изменится мало", "p2b_3_e": "Белок с заменами в дегроне почти не убиквитинируется и почти не поступает в протеасому, поэтому её ингибирование мало меняет его содержание: в учебной модели — с ×17,8 до ×19,4. Сильный эффект бортезомиба ожидается только у белков, которые в норме быстро разрушаются протеасомой.", "p2b_3_w1": "Многократное повышение при бортезомибе характерно для белка с дегроном дикого типа, который в норме быстро убиквитинируется; у белка с заменами в дегроне этот путь почти не работает.", "p2b_3_w2": "Ингибитор протеасомы не ускоряет разрушение белков; он может только замедлить расщепление тех белков, которые поступают в протеасому.", "p2b_4_q": "Клетки с белком, у которого дегрон дикого типа, 60 мин инкубируют с бортезомибом. Как изменится общее содержание этого белка (все формы)?", "p2b_4_o1": "Повысится в несколько раз", "p2b_4_o2": "Снизится в несколько раз", "p2b_4_o3": "Останется прежним", "p2b_4_e": "Синтез продолжается, убиквитинирование тоже, а расщепление почти остановлено. Белок накапливается в основном в полиубиквитинированной форме: за 60 мин его общее содержание в учебной модели возрастает в 4 раза.", "p2b_4_w2": "Бортезомиб подавляет расщепление белков в протеасоме и не ускоряет их удаление другими путями; содержание быстро разрушаемого белка не может снизиться.", "p2b_4_w3": "Содержание осталось бы прежним, только если бы белок не разрушался протеасомой; этот белок с дегроном дикого типа имеет период полужизни около 9 мин, и без расщепления он накапливается.", "s2a_pm": "плазматическая мембрана; рецептор TNF", "s2a_nuc": "ядро", "s2a_phos": "pS32, pS36", "s2a_nf_free": "NF-κB освобождается и перемещается в ядро", "s2a_mask": "Линия X: состав скрыт — определите по блоту", "s2a_geno_t": "Клетки", "gt_q2_wt": "IκBα дикого типа", "gt_q2_aa": "IκBα S32A/S36A", "gt_q2_x": "линия X", "s2a_drug_t": "Препарат (за 60 мин до TNFα)", "s2a_d_none": "нет", "s2a_d_mln": "MLN4924", "s2a_d_tak": "TAK-243", "s2a_d_bort": "бортезомиб", "s2a_ds_none": "—", "s2a_ds_mln": "MLN", "s2a_ds_tak": "TAK", "s2a_ds_bort": "Бтз", "s2a_time_t": "Время после TNFα", "s2a_t0": "0 мин", "s2a_t5": "5 мин", "s2a_t10": "10 мин", "s2a_t20": "20 мин", "s2a_t40": "40 мин", "s2a_t60": "60 мин", "s2a_reveal": "Показать состав линии X", "s2a_plotcap": "IκBα в клетках после добавления TNFα (в среде циклогексимид), доля от исходного содержания; учебная модель, относительные величины. Вертикальная линия — выбранный момент.", "s2a_l_tot": "IκBα, все формы", "s2a_l_p": "фосфорилированный IκBα без цепи убиквитина", "s2a_l_u": "полиубиквитинированный IκBα", "s2a_blot_t": "Иммуноблот лизата клеток", "s2a_blot_rec": "Записать дорожку", "s2a_blot_note": "Полосы рассчитаны по учебной модели, а не измерены. Ub–IκBα — лесенка полос выше основной полосы IκBα; анти-Ub — сигнал убиквитиновых конъюгатов всех белков клетки, в долях удвоенного контроля. Подпись дорожки: время после TNFα и препарат (Бтз — бортезомиб).", "s2a_b_ub": "Ub–IκBα", "s2a_b_p": "p-IκBα (S32/S36)", "s2a_b_g": "анти-Ub, все белки", "s2a_key": "{n}: {t} мин после TNFα; {g}; препарат: {d}", "s2a_r_time": "время после добавления TNFα", "s2a_r_tot": "IκBα, все формы, % от исходного", "s2a_r_p": "фосфорилированный IκBα без цепи, % от исходного IκBα", "s2a_r_u": "полиубиквитинированный IκBα, % от исходного IκBα", "s2a_r_nf": "NF-κB, освобождённый от IκBα (допущение модели: равен доле разрушенного IκBα)", "s2a_r_g": "убиквитиновые конъюгаты всех белков, × от контроля", "s2a_c_0": "TNFα ещё не добавлен. IκBα не фосфорилирован и удерживает NF-κB в цитоплазме; циклогексимид в среде останавливает синтез новых белков, поэтому дальнейшее содержание IκBα зависит только от его разрушения.", "s2a_c_0_z": "Без стимула IκBα устойчив: NF-κB неактивен, пока сигнал не запустит разрушение его ингибитора.", "s2a_c_0d": "Препарат добавлен за 60 мин, TNFα ещё нет. IκBα не фосфорилирован и связан с NF-κB. Действие препарата видно по убиквитиновым конъюгатам всех белков: при бортезомибе их больше, при TAK-243 их почти нет, при MLN4924 их меньше, чем в контроле.", "s2a_c_0d_z": "Сравнение с контролем до стимула показывает, что препарат уже действует, и отделяет его общий эффект от эффекта на сигнальный путь TNFα.", "s2a_c_early": "TNFα активировал IKK. Киназа фосфорилирует IκBα по S32 и S36; фосфорилированный мотив связывает βTrCP в составе SCF, и IκBα убиквитинируется. Разрушение уже идёт, но часть IκBα ещё сохраняется.", "s2a_c_early_z": "Фосфорилирование превращает участок IκBα в дегрон: сигнал рецептора передаётся через изменение устойчивости белка-ингибитора.", "s2a_c_deg": "Большая часть IκBα разрушена 26S-протеасомой. Освобождённый NF-κB перемещается в ядро. Поскольку циклогексимид блокирует синтез, новый IκBα не появляется.", "s2a_c_deg_z": "Быстрое разрушение ингибитора за десятки минут переводит NF-κB в активную форму без синтеза новых белков.", "s2a_c_aa": "IκBα S32A/S36A: остатки серина заменены аланином, и IKK не может их фосфорилировать. Без фосфодегрона βTrCP не связывает IκBα, убиквитинирования и разрушения нет; NF-κB остаётся связанным с IκBα в цитоплазме.", "s2a_c_aa_z": "Мутантный IκBα, не разрушаемый после стимула, служит экспериментальным доказательством того, что для активации NF-κB нужно разрушение IκBα, а не только его фосфорилирование (Brown 1995).", "s2a_c_bort": "Бортезомиб ингибирует протеасому. IKK фосфорилирует IκBα, SCF(βTrCP) строит на нём цепь убиквитина, но белок почти не расщепляется: накапливаются фосфорилированная и полиубиквитинированные формы, NF-κB остаётся связанным. Общий сигнал убиквитиновых конъюгатов растёт.", "s2a_c_bort_z": "Накопление полиубиквитинированного IκBα при ингибиторе протеасомы показывает, что в норме разрушение идёт после убиквитинирования (Chen 1995; Palombella 1994).", "s2a_c_mln": "MLN4924 ингибирует фермент, активирующий NEDD8. Без неддилирования куллина комплекс SCF(βTrCP) малоактивен: IκBα фосфорилируется, но почти не убиквитинируется и не разрушается. Накапливается p-IκBα без лесенки убиквитина.", "s2a_c_mln_z": "Неддилирование куллина необходимо для работы SCF и других куллиновых лигаз; поэтому MLN4924 стабилизирует их субстраты, в том числе фосфорилированный IκBα (Milhollen 2010).", "s2a_c_tak": "TAK-243 ингибирует фермент E1. Убиквитин не активируется, поэтому ни одна E3 не может присоединить его к субстрату: IκBα фосфорилируется, но не убиквитинируется и не разрушается, а убиквитиновых конъюгатов всех белков почти нет.", "s2a_c_tak_z": "E1 — общий вход каскада: его ингибирование останавливает убиквитинирование всех субстратов, а не одного пути (Hyer 2018).", "s2a_c_x": "Линия X: состав клеток скрыт. Сравните дорожки до и после TNFα: какие формы IκBα появляются и исчезают?", "s2a_c_x_z": "Порядок событий — фосфорилирование, убиквитинирование, разрушение — позволяет определить по блоту, на каком звене нарушен путь.", "s2a_c_x0": "Линия X до добавления TNFα: IκBα не фосфорилирован и связан с NF-κB. Отличия от нормы проявляются только после стимула.", "s2a_c_x0_z": "Нарушение звена, которое работает только после сигнала, не видно в покое.", "s2a_c_btrcp": "Линия X — клетки без активной βTrCP (учебный пример). IKK фосфорилирует IκBα, но SCF не связывает фосфодегрон: цепь убиквитина не строится, p-IκBα накапливается и не разрушается, а общий сигнал убиквитиновых конъюгатов не меняется.", "s2a_c_btrcp_z": "Без узнающей субъединицы E3 сигнал доходит до фосфорилирования субстрата, но не до его разрушения. Такой же рисунок блота даёт MLN4924; различить их помогает сравнение с клетками дикого типа при том же препарате.", "s2a_take": "Дегрон IκBα создаётся сигналом: IKK фосфорилирует S32 и S36, βTrCP в составе SCF связывает фосфорилированный мотив, цепь убиквитина направляет IκBα в 26S-протеасому, и NF-κB освобождается. Каждое звено проверяется своим воздействием: замены S32A/S36A лишают IκBα сайтов фосфорилирования, MLN4924 и TAK-243 подавляют убиквитинирование, бортезомиб — расщепление. Похожим образом в ЭПР дефектный белок отмечается для ERAD, но там меткой состояния служит N-гликан (вопрос 3).", "p2a_1_q": "Клетки HeLa с IκBα дикого типа обработали TNFα в присутствии циклогексимида. Как изменится полоса IκBα на блоте через 20 мин по сравнению с моментом добавления TNFα?", "p2a_1_o1": "Станет заметно сильнее", "p2a_1_o2": "Почти исчезнет", "p2a_1_o3": "Останется такой же", "p2a_1_e": "IKK фосфорилирует IκBα по S32 и S36, SCF(βTrCP) убиквитинирует его, и 26S-протеасома расщепляет белок. Синтез остановлен циклогексимидом, поэтому новый IκBα не появляется: в учебной модели к 20 мин остаётся около 1 %. В клетках HeLa IκBα после TNFα разрушается за десятки минут (Henkel 1993).", "p2a_1_w1": "Усиление полосы потребовало бы синтеза нового IκBα; циклогексимид его блокирует, а синтез IκBα в ответ на NF-κB идёт позже.", "p2a_1_w3": "TNFα запускает разрушение IκBα, а не только его модификацию; без синтеза потеря белка видна как ослабление полосы.", "p2a_2_q": "В клетках экспрессирован IκBα S32A/S36A. Их обработали TNFα в присутствии циклогексимида. Как изменится полоса IκBα через 20 мин?", "p2a_2_o1": "Почти исчезнет", "p2a_2_o2": "Сменится лесенкой Ub–IκBα", "p2a_2_o3": "Останется такой же", "p2a_2_e": "В мутантном белке нет остатков, которые фосфорилирует IKK. Без фосфодегрона βTrCP не связывает IκBα, убиквитиновая цепь не строится, и белок не разрушается (Brown 1995; Chen 1995).", "p2a_2_w1": "Исчезновение IκBα после TNFα требует его фосфорилирования по S32 и S36; в мутанте эти остатки заменены аланином.", "p2a_2_w2": "Убиквитинирование IκBα лигазой SCF(βTrCP) требует фосфорилированного мотива; без него цепь убиквитина не присоединяется.", "p2a_3_q": "Клетки с IκBα дикого типа 60 мин инкубировали с бортезомибом, затем добавили TNFα (циклогексимид в среде). Что будет видно на блоте через 20 мин?", "p2a_3_o1": "IκBα сохранится, появится лесенка Ub–IκBα", "p2a_3_o2": "IκBα исчезнет, лесенки не будет", "p2a_3_o3": "IκBα сохранится, лесенки не будет", "p2a_3_e": "Бортезомиб не мешает фосфорилированию и убиквитинированию: IKK и SCF(βTrCP) работают. Протеасома ингибирована, поэтому полиубиквитинированный IκBα накапливается, а общий IκBα почти сохраняется. Так в работах с ингибиторами протеасомы было показано, что IκBα разрушается протеасомой после убиквитинирования (Chen 1995; Palombella 1994).", "p2a_3_w2": "Исчезновение IκBα требует работы протеасомы; при её ингибировании белок остаётся в клетке.", "p2a_3_w3": "Бортезомиб действует на 20S-частицу, а не на лигазу; цепь убиквитина продолжает присоединяться и видна как лесенка.", "p2a_4_q": "Клетки с IκBα дикого типа 60 мин инкубировали с MLN4924, затем добавили TNFα (циклогексимид в среде). Что будет видно на блоте через 20 мин?", "p2a_4_o1": "IκBα исчезнет, p-IκBα не будет", "p2a_4_o2": "Накопится p-IκBα без лесенки", "p2a_4_o3": "Накопится лесенка Ub–IκBα", "p2a_4_e": "MLN4924 не действует на IKK, поэтому IκBα фосфорилируется. Без неддилирования CUL1 комплекс SCF(βTrCP) почти не переносит убиквитин: лесенки нет, белок не разрушается и накапливается в фосфорилированной форме, как в работе с клетками лимфомы (Milhollen 2010).", "p2a_4_w1": "Разрушение IκBα требует убиквитинирования куллиновой лигазой SCF, которая без неддилирования малоактивна; белок остаётся в клетке.", "p2a_4_w3": "Лесенка Ub–IκBα накапливается, когда цепь строится, но протеасома не работает (при бортезомибе); MLN4924 подавляет само построение цепи.", "p2a_5_q": "Контрольные клетки и клетки после 60 мин инкубации с TAK-243 сравнивают до добавления TNFα. Как изменится сигнал антител к убиквитину (конъюгаты всех белков) в клетках с TAK-243?", "p2a_5_o1": "Станет заметно сильнее", "p2a_5_o2": "Останется таким же", "p2a_5_o3": "Станет заметно слабее", "p2a_5_e": "TAK-243 ингибирует E1 — фермент, который активирует убиквитин для всех E2 и E3. Новые конъюгаты не образуются, а прежние разрушаются протеасомой или теряют убиквитин под действием деубиквитиназ, поэтому общий сигнал быстро падает (Hyer 2018). IκBα до стимула при этом не меняется.", "p2a_5_w1": "Сигнал конъюгатов усиливается, когда нарушено их расщепление (ингибитор протеасомы); TAK-243 останавливает их образование.", "p2a_5_w2": "E1 нужен для любого убиквитинирования, поэтому его ингибирование меняет общий сигнал конъюгатов, а не только отдельные белки.", "p2a_6_q": "Линия X: до TNFα и через 20 мин после него (циклогексимид в среде). На блоте после стимула p-IκBα накопился, лесенки Ub–IκBα нет, общий IκBα не уменьшился, сигнал конъюгатов всех белков как в контроле. Какое звено нарушено?", "p2a_6_o1": "Узнавание фосфодегрона лигазой SCF", "p2a_6_o2": "Фосфорилирование IκBα киназой IKK", "p2a_6_o3": "Расщепление IκBα в протеасоме", "p2a_6_e": "Фосфорилирование прошло — значит, IKK работает. Цепь убиквитина не построена, а общий сигнал конъюгатов не изменился — значит, E1 и протеасома в целом работают, а нарушено узнавание фосфорилированного IκBα лигазой SCF(βTrCP). В учебной линии X нет активной βTrCP; такой же рисунок дал бы MLN4924, но он снизил бы и общий сигнал конъюгатов.", "p2a_6_w2": "Без работы IKK на блоте не было бы p-IκBα; здесь фосфорилированная форма накопилась.", "p2a_6_w3": "При нарушении расщепления в протеасоме накапливалась бы лесенка Ub–IκBα и рос бы общий сигнал конъюгатов; здесь цепь убиквитина не строится.", "gn_q2_e1": "E1 — фермент, активирующий убиквитин (UBA1)", "g_q2_e1": "E1 расходует ATP: сначала образует аденилат убиквитина (освобождается пирофосфат), затем присоединяет убиквитин тиоэфирной связью к остатку цистеина активного центра и передаёт его на цистеин E2. У человека основной E1 — UBA1; UBA6 активирует убиквитин для узкого круга E2. TAK-243 образует аддукт с убиквитином в активном центре E1 и останавливает убиквитинирование всех субстратов; в клетках опухолевых линий содержание убиквитиновых конъюгатов при этом быстро падает (Hyer 2018). В модели TAK-243 оставляет 1 % активности E1 — учебное значение.", "gn_q2_e2": "E2 — фермент, переносящий убиквитин", "g_q2_e2": "E2 принимает убиквитин от E1 на собственный остаток цистеина. У человека около 40 генов E2. Вместе с RING-лигазой E2 переносит убиквитин прямо на остаток лизина субстрата; HECT- и RBR-лигазы сначала принимают убиквитин на собственный цистеин. Тип цепи (K48, K63 и другие) во многом определяется парой E2 и E3.", "gn_q2_e3": "E3 — убиквитинлигаза", "g_q2_e3": "E3 связывает одновременно субстрат (по его дегрону) и E2, несущий убиквитин, и обеспечивает перенос убиквитина на субстрат. В геноме человека около 600 генов E3 (Zhang 2025); именно они определяют, какой белок будет убиквитинирован. На базовом уровне показана обобщённая E3; на продвинутом — SCF(βTrCP).", "gn_q2_sub": "Субстрат (учебный пример)", "g_q2_sub": "Учебный короткоживущий белок. Его содержание задаётся соотношением постоянного синтеза и разрушения; учебные константы подобраны так, что при дегроне дикого типа период полужизни около 9 мин, а при заменах остатков дегрона — около 3 ч. Числа не относятся к конкретному белку.", "gn_q2_degron": "Дегрон", "g_q2_degron": "Дегрон — участок белка, который узнаёт убиквитинлигаза E3 и который поэтому определяет скорость разрушения белка. Это может быть N- или C-концевой остаток (N- и C-дегроны; Varshavsky 2019), короткий внутренний мотив, мотив, созданный фосфорилированием (фосфодегрон IκBα и β-катенина узнаёт βTrCP; Winston 1999), или участок, открывающийся при нарушении сворачивания. Дегрон — сигнал узнавания для E3; сама цепь убиквитина — сигнал для протеасомы. У циклина B дегрон — D-бокс, который узнаёт APC/C (Glotzer 1991).", "gn_q2_prot": "26S-протеасома", "g_q2_prot": "20S-частица — цилиндр из четырёх колец (α7β7β7α7); протеолитические центры находятся внутри, в β-кольцах: β1 (каспазоподобный), β2 (трипсиноподобный), β5 (химотрипсиноподобный). 19S-частица связывает цепь убиквитина рецепторами Rpn1, Rpn10 и Rpn13; металлопротеаза Rpn11 отщепляет цепь целиком, когда белок уже захвачен (Verma 2002; Yao 2002); кольцо ATPаз Rpt1–Rpt6 разворачивает белок и продвигает его в 20S-частицу (de la Peña 2018). Для эффективного захвата нужен неструктурированный участок субстрата (Prakash 2004). Продукты — пептиды длиной 3–22 остатка (Kisselev 1999). Деубиквитиназа UCH37 связана с Rpn13, а не с Rpn11 (Qiu 2006). Бортезомиб ингибирует прежде всего β5-центры; в модели остаётся 1–2 % активности (учебное значение).", "gn_q2_ikk": "IKK — киназа IκB", "g_q2_ikk": "Комплекс IKK (каталитические субъединицы IKKα и IKKβ и регуляторная NEMO) активируется после связывания TNFα с рецептором и фосфорилирует IκBα по S32 и S36 (нумерация человеческого белка). В модели IKK активируется за несколько минут после добавления TNFα.", "gn_q2_ikba": "IκBα", "g_q2_ikba": "Ингибитор NF-κB: связывает NF-κB и удерживает его в цитоплазме. После фосфорилирования S32 и S36 мотив DSGΨxS становится фосфодегроном для βTrCP; IκBα убиквитинируется и разрушается 26S-протеасомой, причём убиквитинированный IκBα ещё связан с NF-κB (Chen 1995). Мутант S32A/S36A не фосфорилируется и не разрушается (Brown 1995). В клетках HeLa IκBα после TNFα разрушается за десятки минут; ингибиторы протеаз предотвращали этот распад (Henkel 1993). Ген IκBα — мишень NF-κB, поэтому без циклогексимида белок синтезируется заново; в модели синтез отключён циклогексимидом.", "gn_q2_nfkb": "NF-κB", "g_q2_nfkb": "Транскрипционный фактор (например, димер p65–p50). Пока он связан с IκBα, его сигнал ядерной локализации закрыт, и NF-κB находится в цитоплазме. После разрушения IκBα NF-κB перемещается в ядро и активирует транскрипцию генов-мишеней. Показатель «NF-κB, освобождённый от IκBα» — допущение модели: он принят равным доле разрушенного IκBα.", "gn_q2_scf": "SCF(βTrCP) — куллиновая убиквитинлигаза", "g_q2_scf": "Комплекс SKP1–CUL1–F-бокс-белок с RING-белком RBX1. F-бокс-белок βTrCP узнаёт фосфорилированный мотив IκBα (и β-катенина) и тем самым задаёт выбор субстрата (Winston 1999). У человека два паралога βTrCP; «линия X без βTrCP» в модели — учебный пример.", "gn_q2_nedd8": "NEDD8 и MLN4924", "g_q2_nedd8": "NEDD8 — белок, похожий на убиквитин. Его присоединение к куллину (неддилирование) нужно для активности куллиновых лигаз, в том числе SCF. MLN4924 (певонедистат) ингибирует фермент, активирующий NEDD8; в клетках накапливаются субстраты куллиновых лигаз (Soucy 2009), в том числе фосфорилированный IκBα (Milhollen 2010, клетки B-клеточной лимфомы). На HECT-лигазы MLN4924 не действует. Снижение общего сигнала убиквитиновых конъюгатов при MLN4924 в модели — учебное значение.", "s3_chain": "полипептид", "s3_lumen": "просвет ЭПР", "s3_cytosol": "цитозоль", "s3_cnx": "калнексин / кальретикулин + ERp57", "s3_gls2": "глюкозидаза II", "s3_edem": "EDEM2, затем EDEM3 и EDEM1", "s3_exit": "выход в аппарат Гольджи", "s3_prot": "26S-протеасома", "s3_where": "Где находятся меченые молекулы (доли когорты)", "s3_seg_F": "цикл калнексина", "s3_seg_N": "свёрнут (ЭПР)", "s3_seg_E": "Man₇ → HRD1", "s3_seg_R": "цитозоль", "s3_seg_G": "Гольджи", "s3_seg_S": "среда", "s3_seg_D": "разрушен", "s3_prot_t": "Белок", "gt_q3_wt": "α1-антитрипсин", "gt_q3_nhk": "NHK", "s3_time": "Время после синтеза", "s3_form_lbl": "Гликан большинства молекул в ЭПР:", "s3_f_glc3": "Glc₃Man₉GlcNAc₂", "s3_f_glc1": "Glc₁Man₉GlcNAc₂", "s3_f_man9": "Man₉GlcNAc₂", "s3_f_man7": "Man₇GlcNAc₂", "s3_f_none": "в ЭПР почти не осталось меченых молекул", "s3_r_form": "форма гликана большинства молекул в ЭПР", "s3_r_er": "в ЭПР: цикл калнексина и свёрнутый белок", "s3_r_erad": "на пути ERAD: Man₇ в ЭПР и белок в цитозоле", "s3_r_out": "в аппарате Гольджи и в среде", "s3_r_deg": "разрушено", "s3_r_note": "Учебная модель: когорта молекул, меченных в момент 0; доли считаются от всей когорты, сумма четырёх строк равна 100 % с точностью до округления. Константы скоростей — учебные значения.", "s3b_c_start": "Олигосахарилтрансфераза только что перенесла на остаток Asn гликан Glc₃Man₉GlcNAc₂. Глюкозидаза I отщепляет крайнюю глюкозу, затем глюкозидаза II — вторую.", "s3b_c_start_z": "Три глюкозы на ветви A отмечают только что синтезированный белок. С калнексином и кальретикулином связывается гликан с одной глюкозой, поэтому они начинают действовать после отщепления двух глюкоз.", "s3b_c_cycle": "Большинство меченых молекул находится в ЭПР. У преобладающей формы гликана одна глюкоза (Glc₁Man₉GlcNAc₂): её связывают калнексин или кальретикулин, а ERp57 участвует в образовании дисульфидных связей. После отщепления последней глюкозы глюкозидазой II несвёрнутый белок снова получает глюкозу от UGGT1.", "s3b_c_cycle_z": "Пока белок не свернулся, цикл отщепления и возвращения глюкозы снова и снова связывает его с лектинами-шаперонами и задерживает в ЭПР. Несвёрнутый белок не уходит в аппарат Гольджи.", "s3b_c_wt_exit": "Большая часть молекул α1-антитрипсина уже свернулась. UGGT1 не возвращает глюкозу свёрнутому белку, и он выходит из ЭПР в аппарат Гольджи. Небольшая доля молекул не успела свернуться до отщепления маннозы и направляется на ERAD.", "s3b_c_wt_exit_z": "UGGT1 узнаёт открытые гидрофобные участки несвёрнутого белка. Поэтому глюкоза отмечает незавершённое сворачивание, и белок выходит из ЭПР после того, как эта метка перестаёт возвращаться.", "s3b_c_wt_sec": "Большая часть меченого α1-антитрипсина секретирована в среду. Небольшая доля молекул разрушена по пути ERAD.", "s3b_c_wt_sec_z": "Белок, свернувшийся в цикле калнексина, проходит секреторный путь. Отщепление маннозы опережает сворачивание лишь у немногих молекул.", "s3b_c_nhk_timer": "NHK не может свернуться, и UGGT1 снова и снова возвращает ему глюкозу. Тем временем EDEM2, затем EDEM3 и EDEM1 отщепляют маннозы до Man₇GlcNAc₂ с открытой α1,6-маннозой. Такой гликан связывает лектин OS-9 и передаёт белок комплексу SEL1L–HRD1; выведенный в цитозоль белок разрушает 26S-протеасома.", "s3b_c_nhk_timer_z": "Отщепление маннозы идёт медленнее, чем цикл глюкозы. Поэтому у белка есть время свернуться, а белок, который долго не сворачивается, попадает на ERAD и не накапливается в ЭПР.", "s3b_c_nhk_gone": "Большая часть меченого NHK разрушена 26S-протеасомой после выведения из ЭПР в цитозоль. В аппарат Гольджи и в среду NHK не поступает.", "s3b_c_nhk_gone_z": "Белок, который не может свернуться, выводится из ЭПР и разрушается. Он не секретируется в нефункциональной форме и не накапливается в ЭПР.", "s3b_take": "N-гликан служит меткой состояния белка в ЭПР. Одна глюкоза означает, что белок ещё сворачивается: его связывают калнексин и кальретикулин, а UGGT1 возвращает глюкозу только несвёрнутому белку. Отщепление маннозы работает как медленный таймер: гликан Man₇ с открытой α1,6-маннозой узнаёт OS-9, и белок уходит на ERAD к комплексу SEL1L–HRD1, а затем к 26S-протеасоме из вопроса 2. Дефектный NHK в модели разрушается с периодом полужизни около 1,5 ч (учебное значение), а α1-антитрипсин дикого типа большей частью секретируется.", "s3a_path": "Путь ERAD и секреторный путь", "s3_cnx_s": "калнексин", "s3_edem_s": "EDEM, OS-9", "s3_prot_s": "протеасома", "s3_golgi_s": "аппарат Гольджи", "s3_medium_s": "среда", "s3a_tag_kif": "кифунензин", "s3a_tag_cb": "CB-5083", "s3a_tag_btz": "бортезомиб", "s3a_tag_hrd": "HRD1 снижен", "s3a_ub_lbl": "Убиквитинированный α1-антитрипсин:", "s3a_ub_hi": "накапливается", "s3a_ub_lo": "почти не выявляется", "s3a_ub_note": "(условный показатель: иммуноблот на убиквитин)", "s3a_gel_t": "Гель: импульсная метка, прослеживание, обработка Endo H", "s3a_cells": "клетки", "s3a_medium": "среда", "s3a_m_cx": "комплексный гликан", "s3a_m_hm": "высокоманнозный", "s3a_m_dg": "без гликана", "s3a_drug_t": "Препарат", "dr_q3_none": "нет", "dr_q3_kif": "кифунензин", "dr_q3_cb": "CB-5083", "dr_q3_btz": "бортезомиб", "s3a_cells_t": "Клетки", "gt_q3_norm": "норма", "gt_q3_hrd1": "HRD1 снижен", "gt_q3_x": "линия X", "s3a_tm_t": "Прослеживание до", "s3a_tm0": "0 ч", "s3a_tm1": "1 ч", "s3a_tm2": "2 ч", "s3a_tm4": "4 ч", "s3a_plotcap": "Доля меченого белка в клетках и в среде, % от когорты (учебная модель). Вертикальная линия — конец прослеживания.", "s3a_l_cells": "в клетках", "s3a_l_med": "в среде", "s3a_l_ref": "в клетках: тот же белок без препарата, клетки «норма»", "s3a_r_cells": "меченый белок в клетках к концу прослеживания", "s3a_r_med": "в среде", "s3a_r_deg": "разрушено", "s3a_r_res": "устойчиво к Endo H (клетки и среда)", "s3a_r_ub": "убиквитинированный белок", "s3a_r_ub_s": "условный показатель модели", "s3a_pill_hi": "накапливается", "s3a_pill_lo": "почти нет", "s3a_r_note": "Гель рассчитан моделью, а не измерен. Интенсивность полосы пропорциональна доле меченого белка в этой форме; полосы ниже 2 % не показаны. Endo H отщепляет высокоманнозные гликаны, а комплексные гликаны, образованные в medial-Гольджи, оставляет.", "s3a_c_start": "Сразу после импульса меченые молекулы находятся в ЭПР. Их гликаны высокоманнозные, Endo H отщепляет их, и после обработки полоса смещается вниз, к положению белка без гликана.", "s3a_c_start_z": "Чувствительность к Endo H показывает, что белок ещё не прошёл medial-Гольджи. В ЭПР и в cis-Гольджи гликан остаётся высокоманнозным.", "s3a_c_wt": "К концу прослеживания большая часть α1-антитрипсина секретирована. Полоса в среде после Endo H не смещается: в аппарате Гольджи гликан стал комплексным и устойчивым к Endo H.", "s3a_c_wt_z": "Устойчивость к Endo H появляется после medial-Гольджи. По ней видно, что свёрнутый белок покинул ЭПР и прошёл секреторный путь.", "s3a_c_wt_slow": "Часть α1-антитрипсина ещё находится в клетках, часть уже секретирована. Молекулы в ЭПР чувствительны к Endo H, а молекулы, прошедшие medial-Гольджи, устойчивы к нему.", "s3a_c_wt_slow_z": "Белок выходит из ЭПР постепенно, по мере сворачивания. Поэтому чувствительная и устойчивая к Endo H формы какое-то время видны одновременно.", "s3a_c_wt_kif": "При кифунензине α1-антитрипсин по-прежнему выходит в среду, но гликан остаётся высокоманнозным: маннозидаза I аппарата Гольджи подавлена, и комплексный гликан не образуется. Поэтому белок в среде чувствителен к Endo H.", "s3a_c_wt_kif_z": "Устойчивость к Endo H показывает, что гликан достроен в medial-Гольджи. Сам выход белка из ЭПР её не создаёт, поэтому препарат, меняющий обработку гликана, меняет и результат этого теста.", "s3a_c_nhk": "Большая часть меченого NHK разрушена. В среде его нет, а оставшаяся в клетках полоса чувствительна к Endo H: NHK не выходит из ЭПР и разрушается по пути ERAD.", "s3a_c_nhk_z": "Исчезновение полосы из клеток без появления её в среде отличает разрушение от секреции.", "s3a_c_nhk_early": "Часть меченого NHK уже разрушена. Оставшийся белок находится в ЭПР и чувствителен к Endo H; в среду NHK не выходит.", "s3a_c_nhk_early_z": "Белок, который не может свернуться, постепенно выводится на ERAD. Скорость этого процесса задаёт период полужизни NHK.", "s3a_c_nhk_dg": "В клетках накапливается форма NHK с подвижностью белка без гликана, и Endo H её не сдвигает: гликан уже отщеплён NGLY1 в цитозоле. Протеасома разрушает такой белок медленно, и он задерживается в цитозоле в убиквитинированной форме.", "s3a_c_nhk_dg_z": "Форма без гликана показывает, что белок уже выведен из ЭПР в цитозоль: ретротранслокация и извлечение p97 прошли, задержка возникает на последнем звене.", "s3a_c_nhk_cnx": "NHK долго остаётся в ЭПР: маннозы почти не отщепляются, белок остаётся в цикле калнексина и чувствителен к Endo H. Разрушение замедлено, а в среду белок не выходит.", "s3a_c_nhk_cnx_z": "Без отщепления маннозы гликан не становится сигналом для OS-9, и белок, который не может свернуться, не передаётся на ERAD.", "s3a_c_nhk_ub": "NHK задерживается в клетках в форме, чувствительной к Endo H, и при этом убиквитинированный NHK накапливается. Белок убиквитинирован, но не извлечён из мембраны ЭПР в цитозоль.", "s3a_c_nhk_ub_z": "Убиквитинирование и извлечение белка из мембраны — разные звенья ERAD. Накопление убиквитинированного белка с гликаном указывает на блок после убиквитинирования, но до NGLY1 и протеасомы.", "s3a_c_nhk_noub": "NHK задерживается в ЭПР в форме, чувствительной к Endo H, и почти не убиквитинируется. В цитозоль он не выводится и не разрушается.", "s3a_c_nhk_noub_z": "Задержка без убиквитинирования указывает на звено до убиквитинирования: на доставку белка к комплексу ретротранслокации или на работу этого комплекса.", "s3a_c_nhk_er": "NHK находится в ЭПР и чувствителен к Endo H; в среду он не выходит.", "s3a_c_nhk_er_z": "Белок, который не может свернуться, удерживается системой контроля качества ЭПР.", "s3a_take": "Судьбу гликопротеина прослеживают импульсной меткой. Endo H различает молекулы до и после medial-Гольджи, а полоса без гликана — белок, уже выведенный в цитозоль. Кифунензин удерживает NHK в цикле калнексина, потому что без отщепления маннозы нет сигнала для OS-9. Без SEL1L–HRD1 белок не убиквитинируется, при блоке p97 он убиквитинирован, но остаётся с гликаном, а при ингибировании протеасомы накапливается в цитозоле без гликана. Так одно и то же «накопление белка в клетках» разделяется на разные звенья ERAD. Последнее звено — 26S-протеасома из вопроса 2.", "p3b_1_q": "α1-антитрипсин дикого типа пометили коротким импульсом. С каким белком ЭПР связан гликан большинства меченых молекул через 3 мин?", "p3b_1_o1": "С калнексином или кальретикулином: у гликана одна глюкоза", "p3b_1_o2": "С лектином OS-9: у гликана отщеплены маннозы", "p3b_1_o3": "С NGLY1 в цитозоле: гликан уже отщепляется", "p3b_1_e": "Через несколько минут глюкозидазы I и II уже отщепили две глюкозы, и гликан Glc₁Man₉GlcNAc₂ связывают калнексин и кальретикулин. Белок ещё сворачивается и находится в цикле калнексина.", "p3b_1_w2": "Отщепление маннозы идёт медленно, за десятки минут и часы. Через 3 мин у большинства молекул гликан ещё сохраняет все девять маннозных остатков, и OS-9 его не узнаёт.", "p3b_1_w3": "NGLY1 работает в цитозоле с белком, уже выведенным из ЭПР по пути ERAD. Только что синтезированный белок находится в просвете ЭПР.", "p3b_2_q": "Меченый α1-антитрипсин дикого типа прослеживают 2 ч. Где будет большая часть меченых молекул?", "p3b_2_o1": "В аппарате Гольджи и в среде", "p3b_2_o2": "В ЭПР, в цикле калнексина", "p3b_2_o3": "Разрушена 26S-протеасомой", "p3b_2_e": "Белок дикого типа сворачивается за минуты, UGGT1 перестаёт возвращать ему глюкозу, и он выходит из ЭПР. К 2 ч большая часть молекул прошла аппарат Гольджи и секретирована в среду.", "p3b_2_w2": "Цикл калнексина удерживает белок, пока тот не свернулся. Свёрнутый белок не получает глюкозу от UGGT1, не связывается с калнексином и покидает ЭПР.", "p3b_2_w3": "На ERAD уходит лишь небольшая доля молекул, у которых отщепление маннозы опередило сворачивание. Большинство молекул сворачивается раньше.", "p3b_3_q": "NHK — укороченный вариант α1-антитрипсина, который не может свернуться. Будет ли часть меченого NHK разрушена уже через 1 ч прослеживания?", "p3b_3_o1": "Да, заметная часть уже разрушена протеасомой", "p3b_3_o2": "Нет, сначала NHK должен пройти аппарат Гольджи", "p3b_3_o3": "Нет, NHK не разрушается и остаётся в ЭПР", "p3b_3_e": "У части молекул NHK за час отщепились маннозы, их гликан узнал OS-9, и белок через SEL1L–HRD1 вышел в цитозоль. Там его разрушила 26S-протеасома. Остальные молекулы ещё в цикле калнексина.", "p3b_3_w2": "ERAD начинается в ЭПР: NHK переносится через мембрану ЭПР прямо в цитозоль, к протеасоме, и аппарат Гольджи для этого не нужен.", "p3b_3_w3": "Цикл калнексина задерживает несвёрнутый белок лишь на время: отщепление маннозы постепенно переводит его на ERAD.", "p3b_4_q": "Меченый NHK прослеживают 4 ч. Где окажется большая часть меченых молекул?", "p3b_4_o1": "Будет разрушена 26S-протеасомой", "p3b_4_o2": "Будет секретирована в среду", "p3b_4_o3": "Будет накоплена в ЭПР, в цикле калнексина", "p3b_4_e": "NHK не сворачивается, поэтому из ЭПР в аппарат Гольджи не выходит. За 4 ч большинство молекул проходит отщепление маннозы, узнавание OS-9, ретротранслокацию через SEL1L–HRD1 и разрушение протеасомой.", "p3b_4_w2": "В аппарат Гольджи выходят свёрнутые молекулы. Несвёрнутому NHK UGGT1 снова и снова возвращает глюкозу, и он не покидает ЭПР по секреторному пути.", "p3b_4_w3": "Цикл калнексина не держит белок бесконечно: медленное отщепление маннозы выводит его из цикла и направляет на ERAD.", "p3a_1_q": "Клетки с α1-антитрипсином дикого типа пометили импульсом и прослеживают 4 ч. Как изменится реакция меченого белка на Endo H к концу прослеживания?", "p3a_1_o1": "Белок станет устойчивым: полоса после Endo H не сместится", "p3a_1_o2": "Белок останется чувствительным: полоса после Endo H сместится", "p3a_1_o3": "Полоса исчезнет: белок будет разрушен протеасомой", "p3a_1_e": "Большая часть белка прошла medial-Гольджи и вышла в среду. В аппарате Гольджи гликан стал комплексным, а такой гликан Endo H не отщепляет, поэтому полоса в среде после обработки не смещается.", "p3a_1_w2": "Чувствительна к Endo H высокоманнозная форма ЭПР и cis-Гольджи. Белок дикого типа сворачивается и проходит medial-Гольджи, где гликан достраивается до комплексного.", "p3a_1_w3": "Протеасома разрушает лишь небольшую долю белка дикого типа. Большая часть меченых молекул видна на геле в среде.", "p3a_2_q": "Клетки с NHK пометили импульсом и прослеживают 4 ч. Как изменится доля меченого NHK, оставшегося в клетках, если добавить кифунензин?", "p3a_2_o1": "Возрастёт: NHK разрушается медленнее", "p3a_2_o2": "Снизится: NHK разрушается быстрее", "p3a_2_o3": "Не изменится: NHK разрушается как прежде", "p3a_2_e": "Кифунензин подавляет α1,2-маннозидазы класса I, и маннозы с гликана NHK почти не отщепляются. Без гликана Man₇ лектин OS-9 не передаёт NHK на ERAD, белок остаётся в цикле калнексина, и в клетках его остаётся больше (Liu 1999).", "p3a_2_w2": "Кифунензин подавляет отщепление маннозы, а оно запускает ERAD гликопротеинов. При его подавлении сигнал к разрушению не образуется,
