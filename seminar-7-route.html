":"coam","b":"cpt2","k":"rx"},"m2":{"a":"cpt2","b":"acoam","k":"rx"},"m3":{"a":"acoam","b":"box","k":"seq"},"tb":{"a":"cact","b":"carn","k":"tr","t":"в обмен","d":[34,6],"tn":""}},"st":{"0-0":{"n":{"fa":"met","acoa":"met","coac":"met","cpt1":"sel","acar":"met","carn":"met","cact":"base","cpt2":"base","coam":"met","acoam":"met","box":"base"},"e":{},"m":[["Выделенное звено","CPT1"],["Действие","реакция: ацил с CoA на карнитин"],["Где","наружная мембрана"]],"note":"CPT1 у наружной мембраны переносит ацильную группу с CoA на карнитин. Это химическая реакция, а не перенос через внутреннюю мембрану."},"0-1":{"n":{"fa":"met","acoa":"met","coac":"off","cpt1":"abs","acar":"off","carn":"met","cact":"base","cpt2":"base","coam":"met","acoam":"off","box":"off"},"e":{"a3":"off","a4":"off","t1":"off","t2":"off","m1":"off","m2":"off","m3":"off","tb":"off","k0":"off"},"m":[["Нарушено звено","CPT1"],["Последний выполняемый этап","активация до ацил-CoA"],["Ацил-CoA в матриксе","не образуется"]],"note":"Без CPT1 ацильная группа не переходит на карнитин: ацил-CoA остаётся в цитозоле, дальнейшие этапы не идут."},"1-0":{"n":{"fa":"met","acoa":"met","coac":"met","cpt1":"base","acar":"met","carn":"met","cact":"sel","cpt2":"base","coam":"met","acoam":"met","box":"base"},"e":{},"m":[["Выделенное звено","CACT"],["Действие","перенос ацилкарнитина в обмен на карнитин"],["Где","внутренняя мембрана"]],"note":"CACT — переносчик внутренней мембраны: ацилкарнитин поступает в матрикс, свободный карнитин выходит в обмен."},"1-1":{"n":{"fa":"met","acoa":"met","coac":"met","cpt1":"base","acar":"met","carn":"met","cact":"abs","cpt2":"base","coam":"met","acoam":"off","box":"off"},"e":{"t1":"off","t2":"off","m1":"off","m2":"off","m3":"off","tb":"off"},"m":[["Нарушено звено","CACT"],["Последний выполняемый этап","образование ацилкарнитина"],["Ацил-CoA в матриксе","не образуется"]],"note":"Без CACT ацилкарнитин образуется, но не переносится через внутреннюю мембрану; субстрат к CPT2 не поступает."},"2-0":{"n":{"fa":"met","acoa":"met","coac":"met","cpt1":"base","acar":"met","carn":"met","cact":"base","cpt2":"sel","coam":"met","acoam":"met","box":"base"},"e":{},"m":[["Выделенное звено","CPT2"],["Действие","реакция: ацил с карнитина на CoA"],["Где","матриксная сторона внутренней мембраны"]],"note":"CPT2 на матриксной стороне переносит ацильную группу на CoA матрикса; ацил-CoA вступает в β-окисление, карнитин возвращается через CACT."},"2-1":{"n":{"fa":"met","acoa":"met","coac":"met","cpt1":"base","acar":"met","carn":"met","cact":"base","cpt2":"abs","coam":"met","acoam":"off","box":"off"},"e":{"m1":"off","m2":"off","m3":"off"},"m":[["Нарушено звено","CPT2"],["Последний выполняемый этап","перенос ацилкарнитина в матрикс"],["Ацил-CoA в матриксе","не образуется"]],"note":"Без CPT2 ацилкарнитин поступает в матрикс, но ацильная группа не переходит на CoA матрикса; ацил-CoA для β-окисления не образуется."}},"fixed":"Схема относится к длинноцепочечным жирным кислотам. Стрелки переноса (зелёные, открытый наконечник) отличаются от стрелок химических реакций (серые).","static":["Цитозоль: жирная кислота + CoA + ATP → ацил-CoA. CPT1 в наружной мембране переносит ацильную группу с CoA на карнитин: образуется ацилкарнитин, CoA остаётся в цитозоле. CACT во внутренней мембране переносит ацилкарнитин в матрикс в обмен на карнитин. CPT2 на матриксной стороне переносит ацил на CoA матрикса; ацил-CoA вступает в β-окисление."]}}},{"id":"acc-ampk","number":18,"section":2,"title":"Как AMPK связывает образование малонил-CoA с действием CPT1","question":3,"questions":[3],"keywords":["AMPK","ACC","Малонил-CoA","CPT1","Метаболический поток","Как AMPK связывает образование малонил-CoA с действием CPT1"],"lead":["Малонил-CoA ингибирует CPT1 и одновременно служит субстратом синтеза жирных кислот.","AMPK-зависимое снижение активности ACC меняет обе ветви, но их реальные потоки не обязаны изменяться одинаково."],"mechanism":["Ингибирующее фосфорилирование [[T55|ACC]] уменьшает образование малонил-CoA.","Снижается доступность малонил-CoA для синтеза жирных кислот.","Ослабляется ингибирование [[T60|CPT1]], что создаёт возможность усиления переноса длинноцепочечных ацильных групп."],"paragraphs":["Малонил-CoA — одна молекула с двумя функциями. Для синтазы жирных кислот она служит субстратом, а для CPT1 — ингибитором: связываясь с CPT1, малонил-CoA снижает её активность. Ингибирующее действие малонил-CoA на CPT1 впервые описали McGarry и соавт. (1977) на препаратах печени крысы. Поэтому одно изменение содержания малонил-CoA одновременно меняет условия синтеза и условия окисления жирных кислот.","В причинной цепи три разные величины. Первая — активность ACC: AMPK фосфорилирует ACC по ингибирующему участку, и активность фермента снижается. Вторая — содержание малонил-CoA: оно определяется скоростью образования при участии ACC и скоростью использования и распада, поэтому снижение активности ACC уменьшает содержание малонил-CoA, если остальные скорости не изменились. Третья — активность CPT1: при меньшей концентрации ингибитора CPT1 ингибируется слабее. Кроме фосфорилирования, активность ACC1 регулирует цитрат: в экспериментах с очищенным ферментом человека цитрат аллостерически активировал ACC1 и вызывал сборку её активных нитевидных полимеров (Hunkeler и соавт., 2018). Длинноцепочечные ацил-CoA, например пальмитоил-CoA, напротив, описаны как аллостерические ингибиторы ACC. По представлению, на которое опираются Pinkosky и соавт. (2020), снижая образование малонил-CoA, они ослабляют ингибирование CPT1 и тем самым способствуют собственному окислению; насколько выражено это действие для ACC1 или ACC2 в конкретной клетке, здесь не задаётся.","Номера фосфорилируемых участков зависят от вида и изоформы. В работе Fullerton и соавт. (2013) у мышей участки AMPK в Acc1 (Ser79) и Acc2 (Ser212) заменили аланином. У таких мышей на стандартном корме ACC не ингибировалась фосфорилированием, синтез жирных кислот в печени был повышен, окисление жирных кислот снижено, и развивались инсулинорезистентность, нарушение толерантности к глюкозе и неалкогольная жировая болезнь печени (стеатоз — накопление жира в клетках печени; в современной номенклатуре — метаболически ассоциированная жировая болезнь печени), но не ожирение. У человека соответствующие участки имеют номера Ser80 (ACC1) и Ser221 (ACC2) (Steinberg, Hardie, 2023); мышиные номера на ферменты человека не переносятся. Фосфорилирование ACC обратимо: фосфатазы удаляют фосфорильную группу с участка ACC, фосфорилирование которого подавляет активность фермента. Например, в первичных гепатоцитах мыши повышенная экспрессия фосфатазы PP4 снижала долю ACC1, фосфорилированной по Ser79 (Meng и соавт., 2014). Этот пример не означает, что PP4 — единственная фосфатаза ACC. После снятия фосфорилирования содержание малонил-CoA зависит ещё и от скорости его использования и распада.","Ослабление ингибирования CPT1 создаёт возможность для усиления переноса длинноцепочечных ацильных групп в митохондрии, но не гарантирует роста потока β-окисления. Для этого должны сохраняться ещё три условия: поступление жирных кислот в клетку и их активация, работа ферментов β-окисления и реокисление NADH и FADH₂ в дыхательной цепи. Поэтому рост фосфорилирования ACC — признак регуляции, а поток окисления измеряют отдельно."],"trap":["Рост p-ACC непосредственно измеряет увеличение потока β-окисления.","p-ACC отражает модификацию фермента; поток зависит ещё от транспорта, субстрата и последующих реакций и измеряется отдельно."],"conditions":"Качественная схема при фиксированной чувствительности CPT1 и указанных доступных субстратах. Номера Ser79/Ser212 относятся к мыши.","sources":["Smith2026","Fullerton2013","McGarry1977","Steinberg2023","Hunkeler2018","Meng2014","Pinkosky2020"],"quiz":{"id":"S7-L18","question":"В основной модели после действия AMPK снизилась концентрация малонил-CoA, доступного CPT1. Остальные условия сохранены. Как меняется ингибирование CPT1?","options":[{"id":"S7-L18-2","text":"Ингибирование CPT1 усиливается вследствие снижения малонил-CoA.","correct":false,"feedback":"При неизменной чувствительности CPT1 это противоположное направление регуляции."},{"id":"S7-L18-3","text":"Ингибирование не меняется: малонил-CoA участвует только в синтезе жирных кислот.","correct":false,"feedback":"Малонил-CoA не только используется в синтезе жирных кислот, но и ингибирует CPT1."},{"id":"S7-L18-1","text":"Ингибирование CPT1 ослабевает; рост потока окисления ещё требует проверки.","correct":true,"feedback":"Меньшая доступность ингибитора ослабляет его действие при сохранённой чувствительности CPT1; весь путь оценивают отдельно."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"AMPK, ACC и две ветви малонил-CoA","status":"Схема механизма · направление изменений, не численные законы","ctrls":[{"id":"a","type":"group","label":"Активность AMPK","opts":["низкая","высокая"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"ampk":{"p":[80,150,110,44],"n":[80,40,120,44],"t":"AMPK"},"acc":{"p":[240,150,110,44],"n":[80,140,120,44],"t":"ACC"},"mal":{"p":[400,150,150,44],"n":[240,140,150,44],"t":"малонил-CoA","fs":14},"fasn":{"p":[560,60,140,46],"n":[100,260,150,46],"t":"синтез жирных\nкислот (FASN)","fs":13},"cpt1":{"p":[560,240,140,40],"n":[250,260,140,40],"t":"CPT1"},"tr":{"p":[375,255,150,46],"n":[250,370,150,50],"t":"перенос ацильных\nгрупп","fs":13}},"edges":{"p":{"a":"ampk","b":"acc","k":"phos"},"r":{"a":"acc","b":"mal","k":"rx","t":"образование","d":[0,-12],"dn":[0,-14]},"s":{"a":"mal","b":"fasn","k":"rx","t":"субстрат","d":[-24,0],"dn":[-46,0]},"i":{"a":"mal","b":"cpt1","k":"inh","t":"ингибирует","d":[40,-6],"dn":[44,0]},"c":{"a":"cpt1","b":"tr","k":"act","t":"","d":[0,0]}},"st":{"0":{"n":{"ampk":"off","acc":"on","mal":"met","fasn":"on","cpt1":"off","tr":"off"},"e":{"p":"off","c":"off"},"m":[["Активность ACC","высокая"],["Малонил-CoA","больше"],["Ингибирование CPT1","сильнее"]],"note":"Без фосфорилирования ACC активна, малонил-CoA образуется, используется в синтезе жирных кислот и ингибирует CPT1."},"1":{"n":{"ampk":"on","acc":"off","mal":"off","fasn":"off","cpt1":"on","tr":"on"},"e":{"r":"off","s":"off","i":"off"},"b":{"acc":{"t":"Ser79/Ser212 (мышь) · снижение активности","tn":"","at":"t","al":"start"}},"m":[["Активность ACC","снижена"],["Малонил-CoA","меньше"],["Ингибирование CPT1","слабее; рост потока окисления требует проверки"]],"note":"AMPK фосфорилирует ACC; образование малонил-CoA снижается, синтез жирных кислот получает меньше субстрата, ингибирование CPT1 ослабевает. Поток β-окисления возрастёт, только если сохранены поступление субстрата, ферменты β-окисления и работа дыхательной цепи."}},"fixed":"Предпосылки роста окислительного потока: есть длинноцепочечный субстрат, работают ферменты β-окисления и дыхательная цепь; чувствительность CPT1 к малонил-CoA неизменна.","static":["AMPK фосфорилирует ACC (у мыши Ser79 в Acc1, Ser212 в Acc2) и снижает её активность; образование малонил-CoA уменьшается. Одна и та же молекула малонил-CoA служит субстратом синтеза жирных кислот и ингибитором CPT1, поэтому синтез получает меньше субстрата, а ингибирование CPT1 ослабевает. Рост потока окисления требует сохранения субстрата, ферментов β-окисления и дыхательной цепи."]}}},{"id":"isoforms","number":19,"section":2,"title":"Зачем различать ACC1, ACC2 и изоформы CPT1","question":3,"questions":[3],"keywords":["ACC","CPT1","CPT1C","Изоформа","Метаболический поток","Зачем различать ACC1, ACC2 и изоформы CPT1"],"lead":["Изоформы отличаются распределением и свойствами регуляции.","Локальное образование метаболита не означает существования непроницаемых изолированных пулов."],"mechanism":["ACC1 связана преимущественно с обеспечением синтеза жирных кислот.","ACC2 ассоциирована с наружной митохондриальной мембраной и влияет на образование малонил-CoA рядом с системой переноса.","CPT1A и CPT1B различаются тканевым распределением и чувствительностью к малонил-CoA."],"paragraphs":["[[T67|Изоформы]] — варианты белка со сходной функцией, которые кодируются разными генами или образуются из одного гена и различаются строением, распределением по тканям или регуляцией. У млекопитающих две ACC. ACC1 находится в цитозоле и преимущественно обеспечивает малонил-CoA для синтеза жирных кислот; её много в печени и жировой ткани. ACC2 имеет N-концевой участок, которым связана с наружной митохондриальной мембраной; её много в скелетной мышце и сердце, есть она и в печени. Малонил-CoA, образованный ACC2, оказывается рядом с CPT1.","CPT1 также представлена изоформами. CPT1A преобладает в печени, CPT1B — в скелетной мышце и сердце. CPT1B заметно чувствительнее к малонил-CoA, чем CPT1A, однако единого значения константы ингибирования для «CPT1 вообще» нет: чувствительность зависит от изоформы, ткани и состояния мембраны, и параметр одной ткани не переносится на другую.","Третья изоформа, [[T66|CPT1C]], отличается от первых двух. Она экспрессируется прежде всего в нейронах, находится в мембране эндоплазматического ретикулума и связывает малонил-CoA, но в переносе ацильных групп в митохондрии не участвует. Поэтому в схеме карнитинового челнока CPT1C не изображают.","Локальное образование малонил-CoA рядом с CPT1 не означает, что в клетке существуют два полностью изолированных пула этого метаболита: такая изоляция требует отдельного доказательства. Генетические модели показывают, насколько осторожно надо делать выводы. У мышей без Acc2 в работе Abu-Elheiga и соавт. (2001) окисление жирных кислот было повышено, а запасы жира снижены. В независимо полученной линии мышей без Acc2 (Olson и соавт., 2010) масса тела, масса жира и потребление пищи почти не отличались от контроля. Изменение одного потока, следовательно, не позволяет автоматически предсказать массу тела, расход энергии или клинический результат."],"trap":["ACC1 и ACC2 создают два одинаковых полностью изолированных пула малонил-CoA.","Место образования и доступность метаболита различаются, но жёсткая изоляция двух пулов требует отдельного доказательства."],"conditions":"Сведения об изоформах не задают общей численной чувствительности. Генетические результаты у мышей не становятся предсказанием терапии человека.","sources":["Smith2026","Abu2001","Olson2010","Houten2016"],"quiz":{"id":"S7-L19","question":"В модели утраты Acc2 изменился поток окисления жирных кислот. Как проверить предположение об уменьшении массы тела?","options":[{"id":"S7-L19-1","text":"Измерить массу тела в сопоставимых группах с учётом условий эксперимента.","correct":true,"feedback":"Другой уровень результата требует самостоятельного измерения; обмен, питание и другие условия сохраняются или учитываются."},{"id":"S7-L19-2","text":"Пересчитать поток окисления в массу тела по универсальному коэффициенту.","correct":false,"feedback":"Универсального пересчёта одного потока в изменение массы организма нет."},{"id":"S7-L19-3","text":"Заменить измерение массы тела анализом одного пула малонил-CoA.","correct":false,"feedback":"Малонил-CoA характеризует регуляторный метаболит, а не массу тела."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Изоформы ACC и CPT1 в разных клетках","status":"Схема механизма · качественные примеры тканей","ctrls":[{"id":"t","type":"group","label":"Клетка","opts":["клетка печени","клетка скелетной мышцы","нейрон: CPT1C"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":330,"y":150,"w":300,"h":140,"c":"mito","t":"митохондрия","lx":344,"ly":280,"n":[6,250,328,180,16,420]},{"x":330,"y":150,"w":300,"h":140,"c":"er","t":"эндоплазматический ретикулум","lx":344,"ly":280,"n":[6,250,328,180,16,420]}],"nodes":{"acc1":{"p":[90,60,120,40],"n":[56,40,88,40],"t":"ACC1"},"mal1":{"p":[260,60,140,40],"n":[195,40,120,40],"t":"малонил-CoA","fs":14},"fasn":{"p":[520,60,140,40],"n":[270,130,120,40],"t":"синтез жирных\nкислот","fs":13},"acc2":{"p":[400,170,120,40],"n":[55,300,90,40],"t":"ACC2"},"mal2":{"p":[400,240,140,36],"n":[200,300,120,36],"t":"малонил-CoA","fs":14},"cpt":{"p":[560,205,110,44],"n":[200,385,110,44],"t":"CPT1A","fs":15}},"edges":{"a":{"a":"acc1","b":"mal1","k":"rx"},"b":{"a":"mal1","b":"fasn","k":"rx","t":"субстрат","d":[0,-12],"dn":[48,0]},"c":{"a":"acc2","b":"mal2","k":"rx"},"d":{"a":"mal2","b":"cpt","k":"inh","t":"рядом","d":[0,18],"dn":[0,22],"dash":true},"x":{"a":"mal1","b":"mal2","k":"bind","t":"общий метаболит,\nне изолированные пулы","d":[-80,0],"dn":[-10,0],"bend":60}},"st":{"0":{"z":{"1":"hide"},"n":{"acc1":"on","acc2":"base","cpt":"base"},"m":[["ACC","много ACC1, есть ACC2"],["CPT1","CPT1A"],["Чувствительность к малонил-CoA","ниже, чем у CPT1B"]],"note":"В печени ACC1 обеспечивает малонил-CoA для синтеза жирных кислот, ACC2 у наружной мембраны образует малонил-CoA рядом с CPT1A."},"1":{"z":{"1":"hide"},"t":{"cpt":"CPT1B"},"n":{"acc1":"off","fasn":"off","mal1":"off","acc2":"on","cpt":"base"},"e":{"a":"off","b":"off"},"m":[["ACC","преобладает ACC2"],["CPT1","CPT1B"],["Чувствительность к малонил-CoA","выше, чем у CPT1A"]],"note":"В скелетной мышце преобладает ACC2 у наружной митохондриальной мембраны; малонил-CoA образуется рядом с CPT1B, более чувствительной к нему. Синтез жирных кислот de novo здесь невелик."},"2":{"z":{"0":"hide"},"t":{"cpt":"CPT1C"},"n":{"acc1":"base","acc2":"hide","mal2":"hide","cpt":"sel","fasn":"off"},"e":{"c":"hide","d":"hide","x":"hide","b":"off"},"m":[["Изоформа","CPT1C"],["Где","мембрана ЭПР нейронов"],["Карнитиновый челнок","не участвует"]],"note":"CPT1C находится в мембране эндоплазматического ретикулума нейронов, связывает малонил-CoA, но не переносит ацильные группы в митохондрии. В схему челнока её не включают."}},"fixed":"Сведения об изоформах не задают общей численной чувствительности. Пунктир «рядом» обозначает близость места образования, а не замкнутый пул.","static":["Печень: ACC1 в цитозоле образует малонил-CoA для синтеза жирных кислот, ACC2 у наружной митохондриальной мембраны — рядом с CPT1A. Скелетная мышца: преобладает ACC2, рядом CPT1B, более чувствительная к малонил-CoA. Нейрон: CPT1C в мембране ЭПР связывает малонил-CoA, но в карнитиновом челноке не участвует. Малонил-CoA — общий метаболит, а не два изолированных пула."]}}},{"id":"substrate-tissue","number":20,"section":2,"title":"Почему длина жирной кислоты и ткань меняют результат","question":3,"questions":[3],"keywords":["Длинноцепочечная жирная кислота","Среднецепочечная жирная кислота","CPT2","Карнитиновый челнок","Почему длина жирной кислоты и ткань меняют результат"],"lead":["Зависимость окисления от карнитиновой системы определяется не одним названием «жирная кислота».","Нужно назвать длину цепи, ткань и форму субстрата."],"mechanism":["Окисление длинноцепочечных субстратов связано с карнитиновым челноком.","В исследованных системах печени среднецепочечные свободные жирные кислоты могут использоваться без карнитина.","Результат для печени нельзя автоматически переносить на сердце и скелетную мышцу."],"paragraphs":["Жирные кислоты различаются длиной углеродной цепи. Пальмитиновая кислота содержит 16 атомов углерода (C16) и относится к [[T68|длинноцепочечным]]; её ацильная группа поступает в матрикс митохондрий через карнитиновый челнок. Октановая кислота (C8) относится к [[T69|среднецепочечным]]. Принято считать, что среднецепочечные жирные кислоты проходят внутреннюю мембрану и активируются в матриксе без участия CPT1 и карнитина. Однако граница длины цепи, начиная с которой нужен карнитин, не одинакова для всех тканей.","Pereyra и соавт. (2023) измеряли дыхание гомогенатов тканей мышей при добавлении свободных жирных кислот длиной от 6 до 18 атомов углерода или их эфиров с карнитином. Гомогенат печени окислял без добавленного карнитина свободные жирные кислоты длиной от C6 до C14, гомогенат почки — от C6 до C10. Гомогенаты сердца и скелетной мышцы свободные жирные кислоты любой длины в этих условиях не окисляли; после добавления CoA и карнитина гомогенат мышцы окислял и свободный октаноат. Эфиры длинноцепочечных жирных кислот (C10–C18) с карнитином окислялись во всех четырёх тканях. Авторы связывают различие с тем, что в печени, в отличие от мышц, много среднецепочечных ацил-CoA-синтетаз, активирующих жирные кислоты в митохондриях.","Эти данные описывают возможность окисления субстрата в препарате ткани. Они не описывают, как свободный октаноат распределяется в целом организме, сколько его поступает в каждую ткань и во что он превращается: например, среднецепочечные жирные кислоты пищи из кишечника поступают с кровью воротной вены прежде всего в печень. Поэтому результат для одной ткани проверяют в другой ткани отдельно.","Это важно при наследственных нарушениях карнитинового челнока, например при недостаточности CPT2. Среднецепочечные субстраты не являются обходом карнитиновой системы во всех тканях: по данным той же работы, мышечная ткань мыши в описанных условиях без карнитина их не окисляла. Схема шага не описывает лечебную диету и не содержит рекомендаций."],"trap":["Все жирные кислоты средней длины во всех тканях обходят карнитиновую систему.","Карнитин-независимое использование свободных среднецепочечных субстратов тканеспецифично; в частности, результаты для печени и мышцы различаются."],"conditions":"Детали эксперимента взяты из полного текста Pereyra и соавт. (2023; PMC10642992: методы, результаты, обсуждение): гомогенаты тканей самцов мыши, респирометрия с малатом и ADP. Скорости и проценты не переносятся. Результат относится к препаратам тканей и не описывает распределение субстратов в организме и лечебную диету.","sources":["Pereyra2023","Smith2026","Houten2016"],"quiz":{"id":"S7-L20","question":"Для печени показано окисление свободного октаноата без карнитина. Как правильно использовать этот результат при обсуждении скелетной мышцы?","options":[{"id":"S7-L20-3","text":"По этому результату определить активность CPT1 в мышце без дополнительных измерений.","correct":false,"feedback":"Превращения октаноата в печени не являются измерением CPT1 в другом органе."},{"id":"S7-L20-1","text":"Проверить отдельно: ткань может иметь другую зависимость от карнитина.","correct":true,"feedback":"Показана тканевая специфичность, поэтому один орган не служит универсальной моделью остальных."},{"id":"S7-L20-2","text":"Принять тот же результат: длина цепи гарантирует одинаковый путь во всех тканях.","correct":false,"feedback":"Длина цепи важна, но не устраняет различий ферментов и транспорта между тканями."}],"rev":1},"widget":{"kind":"matrix","title":"","s":{"title":"Субстрат и ткань: нужен ли карнитин","status":"Данные эксперимента: гомогенаты тканей мыши, дыхание (Pereyra и соавт., 2023) · качественно","rows_label":"Субстрат","rows":["свободный октаноат (C8)","свободный пальмитат (C16)","пальмитоилкарнитин (C16-карнитин)"],"cols_label":"Ткань","cols":["печень","почка","сердце","скелетная мышца"],"corner":"Субстрат","cells":[["окисляется без карнитина","окисляется без карнитина","без карнитина не окисляется","без карнитина не окисляется"],["без карнитина не окисляется","без карнитина не окисляется","без карнитина не окисляется","без карнитина не окисляется"],["окисляется","окисляется","окисляется","окисляется"]],"notes":[["Гомогенат печени окислял свободные C6–C14 без добавленного карнитина; октаноат — один из лучших субстратов.","Гомогенат почки окислял свободные C6–C10 без добавленного карнитина.","Гомогенат сердца не окислял свободные жирные кислоты любой длины без карнитина.","Гомогенат скелетной мышцы не окислял свободный октаноат без карнитина; после добавления CoA и карнитина окисление появлялось."],["Свободный пальмитат (C16) печень без карнитина не окисляла: длинноцепочечному субстрату нужен карнитиновый челнок.","Свободный пальмитат без карнитина не окислялся и в почке.","В сердце свободный пальмитат без карнитина не окислялся.","В скелетной мышце свободный пальмитат без карнитина не окислялся."],["Пальмитоилкарнитин минует этап CPT1 и окислялся в печени.","Пальмитоилкарнитин окислялся в почке.","В сердце скорость окисления длинноцепочечных ацилкарнитинов была наибольшей из четырёх тканей.","Пальмитоилкарнитин окислялся в скелетной мышце."]],"fixed":"Сопоставление результатов одной работы в препаратах тканей мыши (самцы, гомогенаты, респирометрия); не модель лечебной диеты и не распределение субстратов в организме.","static":["Таблица по Pereyra и соавт. (2023), гомогенаты тканей мыши: свободный октаноат (C8) окисляется без карнитина в печени и почке, но не в сердце и скелетной мышце; свободный пальмитат (C16) без карнитина не окисляется ни в одной ткани; пальмитоилкарнитин окисляется во всех четырёх тканях."]}}},{"id":"fatty-acid-flux","number":21,"section":2,"title":"Как отличить регуляторный признак от потока окисления","question":3,"questions":[3],"keywords":["Этомоксир","Изотопный индикатор","Метаболический поток","ВЭЖХ/масс-спектрометрия","CPT1","Как отличить регуляторный признак от потока окисления"],"lead":["Содержание малонил-CoA и p-ACC помогают описать регуляцию, но не заменяют измерение окислительного потока.","Изменение дыхания после ингибитора требует проверки специфичности воздействия."],"mechanism":["Масс-спектрометрия определяет выбранный метаболит или набор его форм.","Меченый субстрат позволяет проследить его превращения при заданной модели расчёта.","[[T70|Этомоксир]] может иметь другие действия, особенно при высоких концентрациях."],"paragraphs":["В регуляции окисления жирных кислот различают четыре величины, и каждую измеряют своим методом. Активность CPT1 — скорость реакции, которую катализирует фермент в заданных условиях. Концентрация малонил-CoA — количество метаболита в единице объёма; её определяют масс-спектрометрией. Синтез новых жирных кислот — скорость их образования de novo. Окисление субстрата — поток: количество жирной кислоты, которое за единицу времени проходит путь до конечных продуктов.","Поток оценивают с помощью [[T71|изотопного индикатора]] — субстрата, в котором часть атомов заменена стабильным или радиоактивным изотопом. Например, к клеткам добавляют пальмитат, меченный ¹³C, и прослеживают метку в ацетил-CoA, в метаболитах цикла трикарбоновых кислот или в выделенном CO₂. Метка в промежуточном метаболите или пуле ещё не равна скорости полного окисления: метка разбавляется немеченым веществом клетки, а её распределение зависит от других путей. Поток рассчитывают по выбранной модели с указанными допущениями.","Ингибиторы требуют особой осторожности. Этомоксир необратимо ингибирует CPT1, и для подавления её активности достаточно низких микромолярных концентраций. Divakaruni и соавт. (2018) показали на макрофагах мыши, что в концентрациях, намного превышающих необходимые для ингибирования CPT1, этомоксир нарушал поляризацию макрофагов под действием интерлейкина-4 даже в клетках без Cpt1a или Cpt2. При избытке препарата подавлялся переносчик адениновых нуклеотидов митохондрий и истощался свободный CoA клетки. Это пример того, как ограничен вывод, основанный на действии ингибитора, в определённых клетках; универсальной «селективной дозы» для всех клеток из этой работы не следует.","Поэтому снижение дыхания после этомоксира не равно потоку β-окисления. Расход кислорода зависит и от других субстратов — глюкозы, глутамина — и от сопряжения дыхания с синтезом ATP. Для вывода о роли CPT1 сравнивают клетки дикого типа, клетки с генетической утратой CPT1 или CPT2 и клетки с восстановленным ферментом, проверяют дозу препарата и измеряют превращение меченого субстрата."],"trap":["Любое снижение дыхания после этомоксира количественно равно потоку β-окисления.","Препарат и дыхательный показатель имеют дополнительные зависимости; нужен контроль субстрата, дозы и генетической мишени."],"conditions":"Результат Divakaruni относится к исследованным макрофагам и режимам воздействия. Никакой универсальный порог селективности препарата не задаётся.","sources":["Divakaruni2018","Smith2026","Houten2016"],"quiz":{"id":"S7-L21","question":"После высокой концентрации этомоксира снизилось дыхание. Что требуется для вывода о роли CPT1?","options":[{"id":"S7-L21-2","text":"Только повторное измерение общего ATP в той же группе клеток.","correct":false,"feedback":"Общий ATP полезен для описания состояния, но не проверяет специфичность этого воздействия."},{"id":"S7-L21-3","text":"Только совпадение падения дыхания с изменением p-ACC, принятое за доказательство селективности препарата.","correct":false,"feedback":"Совместное изменение показателей не устанавливает, что препарат действует исключительно на CPT1."},{"id":"S7-L21-1","text":"Проверка дозы, других действий препарата и независимый контроль CPT1.","correct":true,"feedback":"Специфичность и причинную зависимость нельзя установить одним изменением дыхания."}],"rev":1},"widget":{"kind":"cards","title":"","s":{"title":"Что показывает каждый метод","status":"Учебные карточки методов · без выдуманных данных","opts_label":"Подход","opts":["Этомоксир и дыхание","Генетическая утрата CPT1","Меченый субстрат","Малонил-CoA и p-ACC"],"heads":["Что измеряют","Метод","Контроль","Чего метод сам не показывает"],"cards":[{"v":["Расход кислорода клетками до и после ингибитора.","Респирометрия в присутствии этомоксира.","Несколько концентраций; клетки без CPT1 или CPT2; учёт других субстратов.","Что всё снижение дыхания вызвано подавлением CPT1."],"note":"В высоких концентрациях этомоксир действует и на другие мишени (Divakaruni и соавт., 2018): снижение дыхания не измеряет поток β-окисления."},{"v":["Эффект при отсутствии фермента.","Клетки или животные без CPT1 (или CPT2); возвращение фермента.","Клетки дикого типа; восстановленный фермент; одинаковые условия.","Скорость окисления без отдельного измерения потока."],"note":"Генетическая утрата проверяет, необходим ли фермент для эффекта; возможную компенсацию другими путями учитывают отдельно."},{"v":["Превращение меченого субстрата в продукты за заданное время.","Пальмитат, меченный ¹³C или ¹⁴C; масс-спектрометрия или радиометрия.","Модель расчёта потока; немеченый контроль; учёт разбавления метки.","Регуляторное состояние ACC и CPT1."],"note":"Метка в промежуточном метаболите не равна скорости полного окисления; поток рассчитывают по указанной модели."},{"v":["Концентрация малонил-CoA; фосфорилирование ACC относительно общего ACC.","Масс-спектрометрия; иммуноблоттинг.","Быстрая остановка реакций; общий ACC.","Поток окисления жирных кислот."],"note":"Эти показатели описывают регуляцию входа в митохондрии, но не заменяют измерение потока."}],"fixed":"Результат Divakaruni и соавт. относится к исследованным макрофагам и режимам воздействия; универсальная граница селективности препарата не задаётся.","static":["Четыре подхода: этомоксир и дыхание (возможны другие действия препарата в высоких концентрациях), генетическая утрата CPT1 или CPT2 с восстановлением фермента, меченый субстрат с моделью расчёта потока, малонил-CoA и p-ACC как регуляторные показатели. Для каждого указано, чего метод сам не показывает."]}}},{"id":"fatty-acid-context","number":22,"section":2,"title":"Почему ослабление ингибирования CPT1 ещё не гарантирует усиления окисления","question":3,"questions":[3],"keywords":["β-окисление","SREBP1c","PPARα","MCAD","Метаболический поток","Почему ослабление ингибирования CPT1 ещё не гарантирует усиления окисления"],"lead":["После переноса ацильной группы должны работать ферменты β-окисления и пути реокисления восстановленных коферментов.","Изменение одного регуляторного звена создаёт возможность ответа, но не гарантирует его при любом состоянии системы."],"mechanism":["CPT1 регулирует один из входных этапов для длинноцепочечного субстрата.","[[T65|β-окисление]] образует ацетил-CoA и восстановительные эквиваленты.","Доступность субстрата и последующих реакций ограничивает итоговый поток."],"paragraphs":["β-Окисление — повторяющийся цикл из четырёх реакций в матриксе. Ацил-CoA-дегидрогеназа окисляет ацильную цепь с образованием двойной связи и восстанавливает FAD до FADH₂. Еноил-CoA-гидратаза присоединяет воду. 3-Гидроксиацил-CoA-дегидрогеназа окисляет гидроксильную группу и восстанавливает NAD⁺ до NADH. Тиолаза при участии свободного CoA отщепляет ацетил-CoA, и цепь укорачивается на два атома углерода. CPT1 в этих реакциях не участвует: она регулирует вход длинноцепочечной ацильной группы в митохондрию.","Куда идут электроны, отнятые на этих двух стадиях? FADH₂ не покидает фермент как свободный переносчик: FAD, прочно связанный с ацил-CoA-дегидрогеназой, восстанавливается при первой реакции цикла и передаёт электроны белку ETF (electron-transfer flavoprotein). От ETF электроны переходят к ETF:убихинон-оксидоредуктазе (ETFDH, ETF-QO) во внутренней мембране митохондрий, затем к убихинону (коферменту Q) и через него к комплексу III дыхательной цепи. NADH, образовавшийся при окислении 3-гидроксиацил-CoA, отдаёт электроны преимущественно комплексу I. Следовательно, у цикла два разных входа в дыхательную цепь (Wanders и соавт., 2020; Missaglia и соавт., 2021).","Поэтому поток β-окисления ограничивают несколько звеньев. Нужен субстрат: жирные кислоты должны поступить в клетку и активироваться. Нужен перенос через карнитиновый челнок. Нужны ферменты цикла для цепей разной длины, а для продолжения цикла нужны окисленные коферменты: NADH и FAD ацил-CoA-дегидрогеназы должны реокисляться в дыхательной цепи по двум описанным путям. Если реокисление ограничено, ослабление ингибирования CPT1 не ускорит путь: следующие реакции остаются ограничивающими.","Скорость реакций регулируется на разных масштабах времени. Фосфорилирование ACC меняет активность фермента за минуты. Экспрессия генов меняется медленнее. В печени после приёма пищи инсулиновый сигнал через AKT повышает активность транскрипционного фактора [[T72|SREBP1c]], который активирует гены синтеза жирных кислот (Yecies и соавт., 2011). При голодании организма ядерный рецептор [[T73|PPARα]] активирует гены окисления жирных кислот. Подачу субстрата в организме тоже регулируют гормоны. Катехоламины, в том числе норадреналин, усиливают в жировой ткани липолиз — гидролиз триацилглицеролов — через β-адренорецепторы адипоцитов (α2-адренорецепторы, напротив, его тормозят); инсулин липолиз подавляет, и при голодании снижение инсулина ослабляет это торможение (Frikke-Schmidt и соавт., 2016). Прямое действие глюкагона на липолиз зависит от условий и концентрации: у здоровых мужчин повышение глюкагона в крови в пределах физиологических концентраций, при базальном уровне инсулина, не усиливало липолиз в подкожной жировой ткани живота (Gravholt и соавт., 2001), поэтому здесь оно не принимается за общий механизм. Жировая ткань выделяет в кровь глицерол и свободные жирные кислоты; другие ткани окисляют эти жирные кислоты в β-окислении, а глицерол печень и почки используют для глюконеогенеза (Smith и соавт., 2026). Гормональное состояние организма — не то же самое, что состав среды культивируемых клеток: в культуре условия задают составом среды, а в организме — приёмом пищи, голоданием и гормонами.","Наследственные дефекты затрагивают разные звенья пути: CPT1, CPT2 или [[T74|MCAD]] — среднецепочечную ацил-CoA-дегидрогеназу, первый фермент цикла для цепей средней длины. Общая черта таких состояний — нарушение обеспечения тканей энергией при голодании, когда запас глюкозы ограничен (Houten и соавт., 2016); конкретные проявления и подходы к лечению различаются и в семинаре не рассматриваются. Согласованная регуляция синтеза и окисления (малонил-CoA одновременно субстрат синтеза и ингибитор CPT1) ограничивает одновременное протекание противоположных путей и связанные с этим затраты. Это функциональная интерпретация, а не установленная история отбора, и она не означает полного запрета одновременного синтеза и окисления во всех компартментах."],"trap":["Если ингибирование CPT1 снято, β-окисление обязательно идёт с максимальной скоростью независимо от состояния дыхательной цепи.","Транспорт — только часть пути; последующие реакции должны обеспечивать переработку субстрата и реокисление коферментов."],"conditions":"Прогноз качественный и относится к заданному ограничению реокисления. Не задаётся универсальный поток для печени, мышцы и других тканей. Путь электронов ETF–ETFDH–убихинон показан как общая схема митохондриального переноса; вклад входов зависит от ткани.","sources":["Smith2026","Houten2016","Yecies2011","FrikkeSchmidt2016","Gravholt2001","Wanders2020","Missaglia2021"],"quiz":{"id":"S7-L22","question":"Ингибирование CPT1 ослаблено, но реокисление NADH в рассматриваемой системе сильно ограничено. Что можно заключить о потоке β-окисления?","options":[{"id":"S7-L22-1","text":"Его рост не гарантирован: ограничение последующих реакций сохраняется.","correct":true,"feedback":"Ослабление входного ограничения не устраняет ограничение дальнейших реакций."},{"id":"S7-L22-2","text":"Он обязательно становится максимальным, поскольку CPT1 доступна.","correct":false,"feedback":"Максимум не следует из изменения одного этапа при нарушенных остальных условиях."},{"id":"S7-L22-3","text":"Он определяется только содержанием малонил-CoA и не связан с коферментами.","correct":false,"feedback":"Малонил-CoA регулирует CPT1, но весь путь зависит и от других молекулярных процессов."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Какое звено ограничивает поток β-окисления","status":"Качественная учебная модель · одно звено отключается за раз","ctr  работают; поток определяется совместно поступлением субстрата, переносом, ферментами цикла и реокислением коферментов. В организме поступление жирных кислот зависит от приёма пищи, голодания и гормонов (инсулин, катехоламины), а экспрессия ферментов — от SREBP1c и PPARα."},"1-0":{"n":{"src":"off","cpt":"on","box":"on","redox":"on","acoa":"off","etc":"base"},"e":{"e1":"off"},"t":{"src":"поступление\nиз среды"},"bars":[["поток β-окисления",1]],"m":[["Ограниченное звено","субстрат"],["Ослабление ингибирования CPT1 увеличит поток?","нет, мало субстрата"]],"note":"Мало субстрата: даже при активной CPT1 и работающих ферментах переносить и окислять почти нечего. В культуре условия задают составом среды: например, концентрацией жирной кислоты и глюкозы."},"1-1":{"n":{"src":"off","cpt":"on","box":"on","redox":"on","acoa":"off","etc":"base"},"e":{"e1":"off"},"t":{"src":"поступление\nиз крови"},"bars":[["поток β-окисления",1]],"m":[["Ограниченное звено","субстрат"],["Ослабление ингибирования CPT1 увеличит поток?","нет, мало субстрата"]],"note":"Мало субстрата: даже при активной CPT1 и работающих ферментах переносить и окислять почти нечего. В организме поступление жирных кислот зависит от приёма пищи, голодания и гормонов (инсулин, катехоламины), а экспрессия ферментов — от SREBP1c и PPARα."},"2-0":{"n":{"src":"on","cpt":"off","box":"on","redox":"on","acoa":"off","etc":"base"},"e":{"e2":"off"},"t":{"src":"поступление\nиз среды"},"bars":[["поток β-окисления",1]],"m":[["Ограниченное звено","перенос (CPT1)"],["Ослабление ингибирования CPT1 увеличит поток?","да, это и есть ограничивающее звено"]],"note":"CPT1 ингибирована (например, малонил-CoA): длинноцепочечные ацильные группы почти не поступают в матрикс. В культуре условия задают составом среды: например, концентрацией жирной кислоты и глюкозы."},"2-1":{"n":{"src":"on","cpt":"off","box":"on","redox":"on","acoa":"off","etc":"base"},"e":{"e2":"off"},"t":{"src":"поступление\nиз крови"},"bars":[["поток β-окисления",1]],"m":[["Огр рацией жирной кислоты и глюкозы."},"4-1":{"n":{"src":"on","cpt":"on","box":"on","redox":"off","acoa":"off","etc":"base"},"e":{"e3":"off","e5":"off"},"t":{"src":"поступление\nиз крови"},"bars":[["поток β-окисления",1]],"m":[["Ограниченное звено","реокисление коферментов"],["Ослабление ингибирования CPT1 увеличит поток?","нет"]],"note":"Реокисление NADH и FADH₂ ограничено: без окисленных NAD⁺ и FAD дегидрогеназы цикла не работают, и ослабление ингибирования CPT1 поток не увеличит. В организме поступление жирных кислот зависит от приёма пищи, голодания и гормонов (инсулин, катехоламины), а экспрессия ферментов — от SREBP1c и PPARα."}},"fixed":"Прогноз качественный: при каждом выборе остальные звенья считаются работающими. Универсальный поток для разных тканей не задаётся.","static":["Последовательность: поступление субстрата → CPT1, CACT, CPT2 → цикл β-окисления (ацетил-CoA, NADH, восстановленный FAD ацил-CoA-дегидрогеназы) → реокисление: NADH → комплекс I, FAD → ETF → ETFDH → убихинон → комплекс III. Ограничение любого звена ограничивает поток; ослабление ингибирования CPT1 не ускоряет путь, если ограничено последующее звено."]}}},{"id":"autophagy","number":23,"section":3,"title":"Как регулируется начало канонической макроаутофагии","question":4,"questions":[4],"keywords":["Макроаутофагия","ULK1","Фагофор","AMPK","Аутофагический поток","Как регулируется начало канонической макроаутофагии"],"lead":["Каноническая макроаутофагия доставляет цитоплазматический материал в лизосомы через образование аутофагосомы.","Её начало и завершённое расщепление содержимого — разные стадии."],"mechanism":["Комплекс [[T06|ULK1]] с ATG13, FIP200 и ATG101 участвует в запуске формирования [[T76|фагофора]].","В основной аминокислотной ветви снижение действия mTORC1 ослабляет ингибирующую регуляцию этого аппарата.","Влияние AMPK зависит от вида, силы и длительности воздействия."],"paragraphs":["Аутофагией называют доставку собственного материала клетки в лизосомы для расщепления. Путей доставки несколько. При [[T75|макроаутофагии]] участок цитоплазмы окружается новой двухмембранной структурой — аутофагосомой, которая затем сливается с лизосомой. При микроаутофагии материал захватывается впячиванием мембраны самой лизосомы, а при шаперон-опосредованной аутофагии отдельные белки переносятся через лизосомную мембрану. Далее речь идёт о канонической макроаутофагии клеток млекопитающих.","Образование аутофагосомы начинается с фагофора — плоской мембранной цистерны, которая растёт и охватывает участок цитоплазмы. В запуске участвует комплекс ULK1 (или родственной ULK2) с белками ATG13, FIP200 и ATG101. У млекопитающих этот комплекс собран постоянно, а его киназная активность регулируется фосфорилированием. Начало образования фагофора и замыкание его краёв в аутофагосому — разные этапы; второй этап зависит от других белков и рассматривается в следующих шагах.","В основной аминокислотной ветви активный mTORC1 фосфорилирует ULK1 (S758 у человека, S757 у мыши) и ATG13 и тем самым тормозит запуск. При удалении аминокислот активность mTORC1 снижается, это торможение ослабевает, и образование фагофоров усиливается при сохранённом энергетическом состоянии клетки. Ослабление торможения относится к начальной стадии: [[T77|аутофагический поток]] — количество материала, которое за единицу времени проходит весь путь до расщепления в лизосомах, — зависит и от следующих этапов.","Как ULK1 передаёт сигнал комплексу VPS34? Комплекс ULK1 образуют киназа ULK1 и белки ATG13, FIP200 (RB1CC1) и ATG101. Белок ATG13 способствует взаимодействию этого аппарата с ATG14-содержащим комплексом VPS34 (PIK3C3), а киназа ULK1 фосфорилирует его компоненты: Beclin 1 (BECN1; S15 у человека, S14 у мыши) и ATG14 (S29). Эти фосфорилирования способствуют активации липидкиназы VPS34, которая образует PI3P на мембране будущего фагофора (Russell и соавт., 2013; Park и соавт., 2016). Цепь выглядит так: ослабление торможения ULK1 → фосфорилирование компонентов комплекса VPS34 → PI3P → привлечение WIPI2 → последующие события ATG-пути (следующий шаг). ULK1 не создаёт фагофор в одиночку, а перечисленные участки не обязательно необходимы всегда и в каждой клетке: их вклад показан в определённых клетках и условиях.","Роль AMPK описана противоречиво, и различие связано с условиями экспериментов. В классических работах AMPK фосфорилировала ULK1 по участкам, отличным от участка mTORC1: при удалении глюкозы это стимулировало аутофагию (Kim и соавт., 2011), а у Egan и соавт. (2011) такое фосфорилирование оказалось необходимо для митофагии и выживания клеток при голодании. По более новым данным, при дефиците глюкозы и нарушении функции митохондрий AMPK сдерживает начало аутофагии (Park и соавт., 2023), а при длительном лишении аминокислот подавляет аутофагию и поддерживает повторную активацию mTORC1 (Kazyken и соавт., 2024). Эти результаты получены при разных видах стресса и не складываются в одно правило: ни «AMPK всегда усиливает аутофагию», ни «AMPK всегда её тормозит». Для каждого вывода нужно назвать условия и измеренный этап."],"trap":["Любая активация AMPK неизбежно усиливает аутофагический поток.","В исследованных условиях дефицита глюкозы и длительного дефицита аминокислот описаны и другие ответы; необходимо назвать условия и измеренный этап."],"conditions":"Главная схема — каноническая макроаутофагия в клетке млекопитающего. Различные стрессовые работы представлены раздельно; для воспроизведения конкретного эксперимента нужны его полные условия. Участки S15/S14 в Beclin 1 и S29 в ATG14 показаны в определённых клетках и условиях.","sources":["Noda2024","Kim2011","Egan2011","Park2023","Kazyken2024","Smith2026","Russell2013","Park2016"],"quiz":{"id":"S7-L23","question":"В основной модели аминокислотного дефицита при сохранённом энергетическом состоянии снизилось действие mTORC1 на аппарат ULK1. Какой ближайший результат допускает это изменение?","options":[{"id":"S7-L23-3","text":"Обязательное исчезновение всех лизосом независимо от последующих процессов.","correct":false,"feedback":"Количество лизосом определяется другими процессами и не обнуляется из-за такого изменения регуляции."},{"id":"S7-L23-1","text":"Ослабление ингибирующей регуляции начала канонической макроаутофагии.","correct":true,"feedback":"Изменение регуляции ULK1 относится к начальной стадии; итоговый поток зависит от дальнейших этапов."},{"id":"S7-L23-2","text":"Немедленное завершение гидролиза всего содержимого существующих аутофагосом.","correct":false,"feedback":"Начало образования структур и завершённый гидролиз не являются одним событием."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Начало макроаутофагии: mTORC1 и комплекс ULK1","status":"Схема механизма · каноническая макроаутофагия клетки млекопитающего","ctrls":[{"id":"m","type":"group","label":"Режим","opts":["аминокислоты, энергия сохранена","энергетический стресс: сравнение работ"]},{"id":"a","type":"group","label":"Аминокислоты","opts":["есть","удалены"]}],"W":640,"H":260,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"aa":{"p":[80,60,130,44],"n":[80,40,130,44],"t":"аминокислоты","fs":14},"mtorc1":{"p":[260,60,130,44],"n":[250,40,130,44],"t":"mTORC1"},"ulk":{"p":[260,170,170,56],"n":[170,160,220,56],"t":"ULK1–ATG13–\nFIP200–ATG101","fs":13},"ph":{"p":[510,170,160,48],"n":[170,270,200,48],"t":"фагофор\n(начало)","fs":14},"flux":{"p":[510,60,160,48],"n":[170,345,220,40],"t":"весь путь до\nрасщепления","tn":"весь путь до расщепления","fs":13}},"edges":{"a1":{"a":"aa","b":"mtorc1","k":"act","t":"через Rag","d":[0,-12],"dn":[0,-12]},"m1":{"a":"mtorc1","b":"ulk","k":"inh","t":"P S758 (человек)","d":[64,0],"dn":[70,0]},"u1":{"a":"ulk","b":"ph","k":"act","t":"запуск","d":[0,-12],"dn":[44,0]},"f1":{"a":"ph","b":"flux","k":"seq","t":"следующие этапы","d":[64,0],"dn":[70,0],"dash":true}},"st":{"0-0":{"n":{"aa":"met","mtorc1":"on","ulk":"off","ph":"off","flux":"base"},"e":{"u1":"off"},"b":{"ulk":{"t":"S758 · торможение","at":"b","al":"start"}},"m":[["mTORC1","активен"],["Торможение ULK1","сильное"],["Начало образования фагофоров","низкое"]],"note":"Аминокислоты есть: mTORC1 фосфорилирует ULK1 по S758 (у человека) и ATG13 и тормозит запуск образования фагофора."},"0-1":{"t":{"aa":"нет аминокислот"},"n":{"aa":"off","mtorc1":"off","ulk":"on","ph":"on","flux":"base"},"e":{"a1":"off","m1":"off"},"m":[["mTORC1","снижен"],["Торможение ULK1","ослаблено"],["Начало образования фагофоров","усилено"]],"note":"Без аминокислот активность mTORC1 снижается, торможение ULK1 ослабевает и образование фагофоров усиливается. Итоговый поток зависит от следующих этапов."},"1-0":{"n":{"aa":"hide","mtorc1":"base","ulk":"sel","ph":"base","flux":"base"},"e":{"a1":"hide","m1":"off","u1":"off","f1":"off"},"tab":[["Работа и условия","Вывод о роли AMPK"],["Kim и соавт., 2011: удаление глюкозы, клетки млекопитающих (MEF мыши, HEK293)","AMPK фосфорилирует ULK1 по своим участкам и стимулирует аутофагию"],["Egan и соавт., 2011: голодание, клетки млекопитающих","фосфорилирование ULK1 AMPK необходимо для митофагии и выживания клеток"],["Park и соавт., 2023: дефицит глюкозы, нарушение функции митохондрий","AMPK сдерживает начало аутофагии"],["Kazyken и соавт., 2024: длительное лишение аминокислот","AMPK подавляет аутофагию и поддерживает повторную активацию mTORC1"]],"note":"Роль AMPK не задаётся одним переключателем: выводы работ относятся к разным видам стресса и срокам. Переключатель аминокислот в этом режиме не используется."},"1-1":{"n":{"aa":"hide","mtorc1":"base","ulk":"sel","ph":"base","flux":"base"},"e":{"a1":"hide","m1":"off","u1":"off","f1":"off"},"tab":[["Работа и условия","Вывод о роли AMPK"],["Kim и соавт., 2011: удаление глюкозы, клетки млекопитающих (MEF мыши, HEK293)","AMPK фосфорилирует ULK1 по своим участкам и стимулирует аутофагию"],["Egan и соавт., 2011: голодание, клетки млекопитающих","фосфорилирование ULK1 AMPK необходимо для митофагии и выживания клеток"],["Park и соавт., 2023: дефицит глюкозы, нарушение функции митохондрий","AMPK сдерживает начало аутофагии"],["Kazyken и соавт., 2024: длительное лишение аминокислот","AMPK подавляет аутофагию и поддерживает повторную активацию mTORC1"]],"note":"Роль AMPK не задаётся одним переключателем: выводы работ относятся к разным видам стресса и срокам. Переключатель аминокислот в этом режиме не используется."}},"fixed":"Энергетическое состояние в первом режиме сохранено. Номер S758 — для ULK1 человека; у мыши этот участок S757.","static":["Основная ветвь: аминокислоты → mTORC1 ⊣ комплекс ULK1 (ULK1, ATG13, FIP200, ATG101) → начало образования фагофора. Без аминокислот торможение ULK1 ослабевает и образование фагофоров усиливается. Сравнительная таблица: при удалении глюкозы AMPK стимулировала аутофагию (Kim 2011), фосфорилирование ULK1 AMPK было необходимо для митофагии (Egan 2011); при дефиците глюкозы и нарушении функции митохондрий сдерживала её начало (Park 2023); при длительном лишении аминокислот подавляла аутофагию (Kazyken 2024)."]}}},{"id":"phagophore","number":24,"section":3,"title":"Как собирается и расширяется мембрана фагофора","question":4,"questions":[4],"keywords":["Фагофор","VPS34","PI3P","WIPI2","ATG2","ATG9","ATG16L1-комплекс","Как собирается и расширяется мембрана фагофора"],"lead":["Фагофор — растущая мембранная структура, которая охватывает цитоплазматический материал.","Её формирование требует регуляторных белков и доставки липидов."],"mechanism":["Комплекс VPS34–VPS15–Beclin1–ATG14 образует [[T78|PI3P]] в мембране.","PI3P связывают эффекторные белки, включая [[T79|WIPI2]].","Перенос липидов [[T80|ATG2]] и их перераспределение [[T81|ATG9]] участвуют в расширении мембраны."],"paragraphs":["В аутофагии работает фосфатидилинозитол-3-киназа другого класса, чем в инсулиновом сигнале. PI3K класса I фосфорилирует PIP₂ в плазматической мембране и образует PIP₃. VPS34 — PI3K класса III. В составе комплекса с белками VPS15, Beclin1 и ATG14 она фосфорилирует фосфатидилинозитол в 3-м положении инозитольного кольца и образует фосфатидилинозитол-3-фосфат (PI3P) в мембране, из которой растёт фагофор. PI3P — фосфолипид мембраны, а не нуклеотид. ATG14 направляет комплекс к месту образования фагофора, а комплекс ULK1 стимулирует его активность, фосфорилируя Beclin 1 и ATG14 (предыдущий шаг).","С PI3P связываются белки, у которых есть PI3P-связывающие участки. Среди них WIPI2. Связавшись с PI3P на мембране фагофора, WIPI2 привлекает комплекс [[T82|ATG16L1]] — комплекс ATG12–ATG5 с белком ATG16L1 (Dooley и соавт., 2014). Этот комплекс определяет, на какой мембране будет присоединяться к липиду белок LC3 (следующий шаг). Если VPS34 образует меньше PI3P, на мембране связывается меньше WIPI2 и ATG16L1.","Чтобы фагофор вырос, к нему должны поступить липиды. Белок ATG2 образует мостик между мембраной эндоплазматического ретикулума (ЭПР) и краем фагофора и переносит фосфолипиды из одной мембраны в другую (Osawa и соавт., 2019; Valverde и соавт., 2019). ATG2 переносит липиды, а не служит каналом для груза: груз захватывается растущей мембраной и попадает в лизосому позже, после слияния. Поступающие липиды встраиваются в один слой бислоя. ATG9 — скрамблаза: она перераспределяет фосфолипиды между двумя слоями мембраны, позволяя расти обоим (Matoba и соавт., 2020). ATG9 не синтезирует липиды.","Контакт ЭПР с фагофором — это участок сближения мембран с переносом липидов, а не слияние мембран ЭПР и фагофора. Рисунок показывает выбранные звенья и не утверждает, что вся мембрана фагофора происходит из одного источника: в её образовании участвуют и пузырьки с ATG9, и другие мембраны. Замыкание фагофора в аутофагосому разобрано ниже, а слияние аутофагосомы с лизосомой — в шаге 26.","Как открытый фагофор становится замкнутой аутофагосомой? Рост фагофора и герметичное замыкание его краёв — разные события. При замыкании края изолирующей мембраны сближаются, а внутренний и наружный листки должны разделиться, чтобы образовались две отдельные мембраны: внутренняя, непосредственно окружающая груз, и наружная. В изученных системах в этом участвует аппарат ESCRT-III: в клетках HeLa его компонент CHMP2A перемещается к фагофору и регулирует разделение внутренней и наружной мембран, а АТФаза VPS4 необходима для завершения аутофагосомы (Takahashi и соавт., 2018). Это не означает, что ESCRT-III — единственный и универсальный для всех эукариот способ замыкания. Последовательность такова: рост фагофора → сближение краёв → замыкание и разделение мембран (ESCRT-III, VPS4) → закрытая двухмембранная аутофагосома с изолированным грузом → слияние с лизосомой. Замыкание нужно отличать от слияния: слияние наружной мембраны уже закрытой аутофагосомы с мембраной лизосомы происходит позже и обеспечивается SNARE-белками, комплексом HOPS и RAB7 (шаг 26)."],"trap":["ATG2 — мембранный канал, через который груз входит в лизосому.","ATG2 участвует в переносе липидов между мембранами при формировании фагофора; транспорт груза к лизосоме происходит иначе."],"conditions":"Качественная схема канонического аппарата; подробный рисунок каждой белковой структуры требует её структурного источника. Не постулируется один исключительный источник всей мембраны. Роль ESCRT-III в замыкании показана в клетках HeLa и не принимается за единственный механизм.","sources":["Noda2024","Nakatogawa2020","Dooley2014","Osawa2019","Valverde2019","Matoba2020","Takahashi2018","Russell2013","Park2016"],"quiz":{"id":"S7-L24","question":"В основной схеме снизилось образование PI3P комплексом VPS34. Какой процесс непосредственно становится менее обеспеченным?","options":[{"id":"S7-L24-2","text":"Связывание PIP₃-зависимых белков с плазматической мембраной через PI3K класса I.","correct":false,"feedback":"PI3P и PIP₃ — разные липиды, а VPS34 и PI3K класса I выполняют разные реакции."},{"id":"S7-L24-3","text":"Прямое липидирование LC3 ферментом VPS34 без системы ATG7–ATG3.","correct":false,"feedback":"VPS34 образует PI3P; липидирование LC3 выполняется другой системой, а не прямой реакцией этой киназы."},{"id":"S7-L24-1","text":"Связывание PI3P-зависимых эффекторов с мембраной фагофора.","correct":true,"feedback":"WIPI2 и другие эффекторные звенья связаны с локальным PI3P в рассматриваемом процессе."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Как растёт мембрана фагофора","status":"Схема механизма · выбранные звенья, без структурных деталей","ctrls":[{"id":"s","type":"group","label":"Этап","opts":["1. VPS34 образует PI3P","2. WIPI2 и комплекс ATG16L1","3. ATG2 и ATG9: липиды"]},{"id":"v","type":"check","label":"Активность VPS34 снижена","def":false}],"W":640,"H":300,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":200,"w":200,"h":90,"c":"er","t":"ЭПР","lx":22,"ly":220,"n":[6,380,140,82,14,398]},{"x":260,"y":60,"w":370,"h":230,"c":"plain","t":"мембрана фагофора","lx":274,"ly":80,"n":[6,6,328,362,14,24]}],"nodes":{"vps":{"p":[110,80,170,56],"n":[90,70,160,56],"t":"VPS34–VPS15–\nBeclin1–ATG14","fs":12.5},"pi3p":{"p":[350,130,110,40],"n":[260,70,110,40],"t":"PI3P","fs":15},"wipi":{"p":[520,130,110,40],"n":[260,160,110,40],"t":"WIPI2","fs":15},"a16":{"p":[520,230,150,46],"n":[250,250,150,46],"t":"ATG12–ATG5–\nATG16L1","fs":12.5},"atg2":{"p":[230,245,100,40],"n":[90,300,110,40],"t":"ATG2","fs":15},"atg9":{"p":[360,245,100,40],"n":[250,330,110,40],"t":"ATG9","fs":15}},"edges":{"r1":{"a":"vps","b":"pi3p","k":"rx","t":"PI → PI3P","d":[0,-12],"dn":[0,-14]},"b1":{"a":"pi3p","b":"wipi","k":"bind","t":"связывание","d":[0,-12],"dn":[-50,0]},"b2":{"a":"wipi","b":"a16","k":"act","t":"привлекает","d":[48,0],"dn":[-56,0]},"t1":{"a":[150,250,60,410],"b":"atg2","k":"tr","t":"","d":[0,0]},"t2":{"a":"atg2","b":"atg9","k":"tr","t":"липиды","d":[0,-12],"dn":[0,20]},"ret":{"a":"atg9","b":"pi3p","k":"bind","t":"","dash":true}},"base":{"e":{"ret":"hide"}},"st":{"0-0":{"n":{"vps":"on","pi3p":"met","wipi":"hide","a16":"hide","atg2":"hide","atg9":"hide"},"e":{"t1":"hide","t2":"hide"},"m":[["PI3P в мембране","есть"],["WIPI2 и ATG16L1 на мембране","этап не показан"],["Перенос липидов ATG2, перераспределение ATG9","этап не показан"]],"note":"VPS34 в комплексе с VPS15, Beclin1 и ATG14 фосфорилирует фосфатидилинозитол и образует PI3P в мембране, из которой растёт фагофор."},"0-1":{"n":{"vps":"off","pi3p":"off","wipi":"hide","a16":"hide","atg2":"hide","atg9":"hide"},"e":{"r1":"off","b1":"off","b2":"off","t1":"hide","t2":"hide"},"m":[["PI3P в мембране","снижено"],["WIPI2 и ATG16L1 на мембране","этап не показан"],["Перенос липидов ATG2, перераспределение ATG9","этап не показан"]],"note":"VPS34 в комплексе с VPS15, Beclin1 и ATG14 фосфорилирует фосфатидилинозитол и образует PI3P в мембране, из которой растёт фагофор. Активность VPS34 снижена: PI3P образуется меньше, и с мембраной связывается меньше WIPI2 и ATG16L1; рост фагофора ограничен."},"1-0":{"n":{"vps":"on","pi3p":"met","wipi":"on","a16":"on","atg2":"hide","atg9":"hide"},"e":{"t1":"hide","t2":"hide"},"m":[["PI3P в мембране","есть"],["WIPI2 и ATG16L1 на мембране","связаны"],["Перенос липидов ATG2, перераспределение ATG9","этап не показан"]],"note":"WIPI2 связывается с PI3P и привлекает комплекс ATG12–ATG5–ATG16L1, который определяет место липидирования LC3."},"1-1":{"n":{"vps":"off","pi3p":"off","wipi":"off","a16":"off","atg2":"hide","atg9":"hide"},"e":{"r1":"off","b1":"off","b2":"off","t1":"hide","t2":"hide"},"m":[["PI3P в мембране","снижено"],["WIPI2 и ATG16L1 на мембране","меньше"],["Перенос липидов ATG2, перераспределение ATG9","этап не показан"]],"note":"WIPI2 связывается с PI3P и привлекает комплекс ATG12–ATG5–ATG16L1, который определяет место липидирования LC3. Активность VPS34 снижена: PI3P образуется меньше, и с мембраной связывается меньше WIPI2 и ATG16L1; рост фагофора ограничен."},"2-0":{"n":{"vps":"on","pi3p":"met","wipi":"on","a16":"on","atg2":"on","atg9":"on"},"e":{},"m":[["PI3P в мембране","есть"],["WIPI2 и ATG16L1 на мембране","связаны"],["Перенос липидов ATG2, перераспределение ATG9","идут"]],"note":"ATG2 переносит фосфолипиды из ЭПР к краю фагофора; ATG9 перераспределяет их между слоями мембраны. Мембрана расширяется."},"2-1":{"n":{"vps":"off","pi3p":"off","wipi":"off","a16":"off","atg2":"on","atg9":"on"},"e":{"r1":"off","b1":"off","b2":"off"},"m":[["PI3P в мембране","снижено"],["WIPI2 и ATG16L1 на мембране","меньше"],["Перенос липидов ATG2, перераспределение ATG9","может снижаться"]],"note":"ATG2 переносит фосфолипиды из ЭПР к краю фагофора; ATG9 перераспределяет их между слоями мембраны. Активность VPS34 снижена: PI3P образуется меньше, и с мембраной связывается меньше WIPI2 и ATG16L1; рост фагофора ограничен."}},"fixed":"На схеме показаны выбранные звенья; мембрана фагофора образуется не из одного источника.","static":["Этап 1: комплекс VPS34–VPS15–Beclin1–ATG14 (PI3K класса III) образует PI3P в мембране фагофора. Этап 2: WIPI2 связывается с PI3P и привлекает комплекс ATG12–ATG5–ATG16L1. Этап 3: ATG2 переносит фосфолипиды из ЭПР к фагофору, ATG9 перераспределяет их между слоями мембраны. При сниженной активности VPS34 меньше PI3P и меньше связанных с мембраной WIPI2 и ATG16L1."]}}},{"id":"lc3","number":25,"section":3,"title":"Как LC3 связывается с мембраной и что означает LC3-II","question":4,"questions":[4],"keywords":["LC3-I/LC3-II","ATG7","ATG3","ATG16L1-комплекс","PE","Оборот LC3-II","Как LC3 связывается с мембраной и что означает LC3-II"],"lead":["В каноническом аппарате липидированная форма LC3 связана с фосфатидилэтаноламином мембраны.","Содержание LC3-II отражает соотношение его образования и удаления."],"mechanism":["После обработки ATG4 LC3 может включаться в систему липидирования.","[[T84|ATG7, ATG3]] и [[T82|ATG12–ATG5–ATG16L1]] обеспечивают присоединение LC3 к липиду.","LC3-II может удаляться с мембраны и подвергаться лизосомной деградации в зависимости от его положения."],"paragraphs":["LC3 — белок семейства ATG8, который в каноническом пути присоединяется к мембране фагофора. [[T83|LC3-I и LC3-II]] — две формы одного белка, а не номера стадий аутофагии. Сначала синтезированный белок расщепляется протеазой ATG4: она отщепляет C-концевой участок и открывает остаток глицина. Получается растворимая форма LC3-I. Когда этот глицин ковалентно соединяется с фосфолипидом мембраны, образуется LC3-II.","Присоединение LC3 к липиду похоже по устройству на присоединение убиквитина к белку. В этой реакции фермент E1 активирует убиквитин, E2 принимает его от E1, а E3 обеспечивает перенос убиквитина на белок-мишень. Но присоединение LC3 к липиду — другая реакция. ATG7 действует как E1-подобный фермент: за счёт ATP активирует LC3 и образует с ним тиоэфирную связь. ATG3 действует как E2-подобный фермент: принимает LC3 от ATG7. Комплекс ATG12–ATG5–ATG16L1, привлечённый к мембране белком WIPI2, действует как E3-подобный: ускоряет перенос LC3 с ATG3 на липид. Липид-акцептор — [[T85|фосфатидилэтаноламин]] (PE). Убиквитин присоединяется к белкам, а LC3 — к фосфолипиду; описаны и другие пути липидирования белков ATG8, но в основную схему они не входят.","Содержание LC3-II определяется соотношением его образования и удаления. LC3-II на наружной мембране аутофагосомы может снова отщепляться от PE протеазой ATG4. LC3-II на внутренней мембране попадает вместе с грузом в аутолизосому и расщепляется. Поэтому одно содержание LC3-II не показывает, усилилось ли образование аутофагосом или замедлилось их удаление; об этом — шаг об [[T86|обороте LC3-II]] и потоке.","Без функциональной ATG7 система липидирования LC3 не работает: LC3-I сохраняется, а полоса LC3-II на иммуноблоте не появляется. Но утрата ATG7 не означает, что в клетке перестали работать лизосомы или расщепляться белки, доставленные другими путями. ATG7 нужна для конкретной реакции; другие процессы оценивают своими показателями."],"trap":["Высокое содержание LC3-II непосредственно равно высокому аутофагическому потоку.","LC3-II может накапливаться и при усиленном образовании, и при замедленном удалении; нужно измерение динамики и условий деградации."],"conditions":"Основная модель — LC3/ATG8-зависимая каноническая макроаутофагия с PE. Альтернативные пути не объявляются отсутствующими только по генотипу ATG7.","sources":["Noda2024","Nakatogawa2020","Klionsky2021"],"quiz":{"id":"S7-L25","question":"В канонической системе отсутствует функциональная ATG7. Какое образование непосредственно нарушается?","options":[{"id":"S7-L25-1","text":"Образование липидированной формы LC3-II через соответствующую систему конъюгации.","correct":true,"feedback":"ATG7 необходима для рассматриваемой системы липидирования LC3; это не диагноз всех путей деградации."},{"id":"S7-L25-2","text":"Образование PI3P при действии киназы VPS34.","correct":false,"feedback":"VPS34 катализирует другую реакцию; ATG7 не является ферментом образования PI3P."},{"id":"S7-L25-3","text":"Образование LC3-I при протеолитической обработке исходной LC3 белком ATG4.","correct":false,"feedback":"Начальная протеолитическая обработка LC3 относится к ATG4; её следует отличать от ATG7-зависимой конъюгации."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Обработка и липидирование LC3","status":"Схема механизма · каноническая система LC3 и PE","ctrls":[{"id":"k","type":"check","label":"ATG7 отсутствует","def":false}],"W":640,"H":280,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"pro":{"p":[70,60,110,40],"n":[80,40,130,40],"t":"про-LC3","fs":14},"lc1":{"p":[230,60,100,40],"n":[250,40,110,40],"t":"LC3-I","fs":15},"atg7":{"p":[390,60,100,40],"n":[80,130,120,40],"t":"ATG7 (E1)","fs":14},"atg3":{"p":[550,60,100,40],"n":[250,130,120,40],"t":"ATG3 (E2)","fs":14},"e3":{"p":[565,150,140,46],"n":[100,225,180,46],"t":"ATG12–ATG5–\nATG16L1 (E3)","fs":12.5},"lc2":{"p":[390,150,130,44],"n":[235,315,150,44],"t":"LC3-II (–PE)","fs":14},"rem":{"p":[180,230,190,40],"n":[90,410,150,44],"t":"удаление: ATG4,\nлизосома","fs":12.5},"atg4":{"p":[150,150,100,40],"n":[260,410,120,40],"t":"ATG4","fs":14}},"edges":{"c1":{"a":"pro","b":"lc1","k":"rx","t":"ATG4","d":[0,-12],"dn":[0,-12]},"c2":{"a":"lc1","b":"atg7","k":"rx","t":"ATP","d":[0,-12],"dn":[-60,0]},"c3":{"a":"atg7","b":"atg3","k":"rx","t":"","d":[0,-12],"dn":[0,-12]},"c4":{"a":"atg3","b":"lc2","k":"rx","t":"+ PE","d":[-10,26],"dn":[34,0]},"c5":{"a":"e3","b":"lc2","k":"act","t":"","d":[0,-12]},"f":{"a":"lc2","b":"rem","k":"rx","t":"удаление","d":[46,10],"dn":[-34,0]}},"base":{"n":{"atg4":"hide"}},"st":{"0":{"n":{"pro":"base","lc1":"met","atg7":"on","atg3":"on","e3":"on","lc2":"met","rem":"base"},"m":[["LC3-I","есть"],["LC3-II","образуется"],["Скорость изменения содержания LC3-II","скорость образования − скорость удаления"]],"note":"ATG4 образует LC3-I; ATG7 и ATG3 передают LC3 на фосфатидилэтаноламин при участии комплекса ATG12–ATG5–ATG16L1. Содержание LC3-II зависит от скорости его образования и удаления."},"1":{"n":{"pro":"base","lc1":"met","atg7":"abs","atg3":"off","e3":"base","lc2":"off","rem":"base"},"e":{"c2":"off","c3":"off","c4":"off","c5":"off","f":"off"},"m":[["LC3-I","сохраняется"],["LC3-II","не образуется"],["Лизосомы и другие пути расщепления","сохранены"]],"note":"Без ATG7 система липидирования не работает: LC3-I остаётся, LC3-II не образуется. Лизосомы и расщепление материала, доставленного другими путями, этой утратой не отменяются."}},"fixed":"Основная модель — каноническая LC3-зависимая макроаутофагия с PE; другие пути липидирования не показаны.","static":["ATG4 превращает про-LC3 в LC3-I. ATG7 (E1-подобный) активирует LC3 за счёт ATP, ATG3 (E2-подобный) принимает его, комплекс ATG12–ATG5–ATG16L1 (E3-подобный) ускоряет перенос LC3 на фосфатидилэтаноламин: образуется LC3-II. LC3-II удаляется ATG4 с наружной мембраны или расщепляется в лизосоме с внутренней. Без ATG7 LC3-II не образуется, LC3-I сохраняется."]}}},{"id":"fusion-acidity","number":26,"section":3,"title":"Почему слияние, закисление и гидролиз — разные процессы","question":4,"questions":[4],"keywords":["Аутофагосома","Аутолизосома","SNARE","V-ATPase","Гидролаза","Бафиломицин A1","Почему слияние, закисление и гидролиз — разные процессы"],"lead":["Аутофагосома должна доставить материал в лизосомный компартмент.","После слияния эффективность гидролиза зависит от условий среды и конкретных ферментов."],"mechanism":["[[T89|SNARE]]-белки и другие регуляторы обеспечивают мембранное слияние.","[[T44|V-ATPase]] участвует в поддержании кислого pH лизосомного просвета.","Кислые [[T90|гидролазы]] расщепляют определённые связи в доставленных субстратах."],"paragraphs":["Когда края фагофора замкнулись и мембраны разделились (шаг 24), существует закрытая [[T87|аутофагосома]] — пузырёк с двумя мембранами, внутри которого заключён участок цитоплазмы. Чтобы содержимое расщепилось, наружная мембрана аутофагосомы сливается с мембраной лизосомы. Образуется [[T88|аутолизосома]]: внутренняя мембрана аутофагосомы вместе с грузом оказывается в просвете лизосомы, где её и груз расщепляют лизосомные ферменты.","Слияние обеспечивают белки SNARE, закреплённые на двух мембранах; их спирали скручиваются в комплекс и стягивают мембраны. На замкнутой аутофагосоме находится синтаксин 17 (STX17), который образует комплекс с SNAP29 и лизосомным VAMP8 (Itakura и соавт., 2012). Сближению мембран способствуют малая ГТФаза RAB7 и связывающий комплекс HOPS — комплекс, удерживающий мембраны рядом и способствующий сборке SNARE. STX17 — не единственный возможный путь: в клетках без STX17 слияние может обеспечивать комплекс с белком YKT6 (Matsui и соавт., 2018).","Слияние, кислая среда и реакция гидролазы — три разных свойства. Кислый pH лизосомного просвета поддерживает V-ATPase — протонный насос, который за счёт гидролиза ATP переносит протоны в просвет. Кислые гидролазы — протеазы, гликозидазы, липазы и другие ферменты — расщепляют определённые связи в субстратах и лучше работают в кислой среде. Если нет нужной гидролазы, доставленный субстрат не расщепится даже после слияния и при кислом pH. Поэтому нарушение одного свойства нельзя автоматически считать нарушением двух других.","[[T91|Бафиломицин A1]] прежде всего ингибирует V-ATPase. В его присутствии кислотность лизосом и уже образовавшихся аутолизосом не поддерживается, и они перестают быть кислыми; активность кислых гидролаз падает. Действие на слияние зависит от условий. В жировом теле дрозофилы при генетической утрате субъединиц V-ATPase лизосомы не закислялись, но с аутофагосомами сливались; бафиломицин в тех же клетках слияние подавлял, и это действие было связано с другой его мишенью — Ca²⁺-насосом эндоплазматического ретикулума SERCA (Mauvezin и соавт., 2015). Поэтому для каждого эксперимента указывают концентрацию, срок и метод, которым проверено слияние."],"trap":["Бафиломицин — только селективный ингибитор слияния, который не меняет pH.","Его основная мишень V-ATPase связана с кислотностью; действие на слияние и другие процессы требует указания условий."],"conditions":"Возможное сохранение слияния при нарушении закисления является условием учебного сравнения, а не обещанием одинакового действия бафиломицина во всех экспериментах.","sources":["Noda2024","Klionsky2021","Itakura2012","Matsui2018","Mauvezin2015"],"quiz":{"id":"S7-L26","question":"В учебной схеме слияние произошло, но выбранная гидролаза отсутствует. Что из этого следует?","options":[{"id":"S7-L26-3","text":"Установлен первичный дефект образования аутофагосом через ATG7.","correct":false,"feedback":"Дефект выбранной гидролазы не устанавливает первичную утрату системы ATG7 и образования аутофагосом."},{"id":"S7-L26-1","text":"Доставка субстрата не гарантирует его расщепления без нужного фермента.","correct":true,"feedback":"Мембранная доставка и химическое расщепление — разные необходимые звенья для выбранного субстрата."},{"id":"S7-L26-2","text":"Слияние обеспечивает прежнюю скорость расщепления независимо от состава гидролаз.","correct":false,"feedback":"Слияние объединяет компартменты, но не заменяет каталитического действия нужного фермента."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Слияние, кислая среда и гидролиз","status":"Схема механизма · каждое условие меняет свой показатель","ctrls":[{"id":"c","type":"group","label":"Условие","opts":["все звенья работают","нарушено слияние","нарушено закисление","нет выбранной гидролазы","бафиломицин A1"]}],"W":640,"H":280,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"ap":{"p":[90,90,140,56],"n":[85,50,140,56],"t":"аутофагосома\n(груз внутри)","fs":13},"ly":{"p":[90,210,140,44],"n":[255,50,140,44],"t":"лизосома","fs":14},"snare":{"p":[280,150,150,52],"n":[170,150,220,52],"t":"STX17–SNAP29–\nVAMP8, HOPS","fs":12.5
