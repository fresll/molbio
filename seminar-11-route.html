переходят в ядро (Sardiello 2009; Martina 2012; Roczniak-Ferguson 2012; Martina 2014).</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 11 — Протеостаз: Hsp70, убиквитин-протеасомная система, ERAD и аутофагический поток","home_eyebrow":"Семинар 11 · самостоятельная подготовка","home_h1":"Как клетка сохраняет\nи разрушает свои белки","home_lead":"Проследите, как шаперон Hsp70 возвращает белку возможность свернуться, как убиквитиновая метка направляет белок в протеасому, как N-гликан отмечает состояние белка в ЭПР и как измеряют аутофагический поток.","start":"Начать с цикла Hsp70 →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в этот интерактив. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Схемы механизма, качественные состояния учебной модели и данные конкретных экспериментов обозначены отдельно: условные величины не являются измерениями в клетках человека.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат эксперимента","practice_p":"41 сценарий с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 3.2 · учебные материалы кафедры биологии и генетики.","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод из эксперимента. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов из разных разделов. После ответа откройте разбор. Если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 41 сценарий","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Этот шаг объединяет материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Протеостаз: Hsp70, убиквитин-протеасомная система, ERAD и аутофагический поток","stats":[["4 механизма","от шаперона до лизосомы"],["Объяснения","с вопросами для самопроверки"],["41 сценарий","в отдельном практикуме"]],"num_fmt":"11.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел II: семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Уменьшить схему","zoom_area":"Увеличенная схема: прокрутите в сторону, чтобы увидеть её целиком"},"sections":[{"title":"Цикл Hsp70","entry":"hsp70-cycle","sub":"Как цикл ATP и ADP позволяет шаперону захватывать и освобождать субстрат"},{"title":"Дегрон и 26S-протеасома","entry":"ubiquitin-cascade","sub":"Как убиквитиновая цепь направляет выбранный белок на разрушение"},{"title":"N-гликаны и ERAD","entry":"glycan-code","sub":"Как гликан отмечает состояние белка в ЭПР и как дефектный белок покидает ЭПР"},{"title":"Аутофагический поток","entry":"autophagy-flux","sub":"Как образуется аутофагосома и как измеряют расщепление её содержимого"},{"title":"Исследование","entry":"methods","sub":"Как выбрать измеряемую величину и проследить судьбу одного белка","integr":true}],"lessons":[{"id":"hsp70-cycle","number":1,"section":0,"title":"Как цикл ATP и ADP меняет сродство Hsp70 к субстрату","question":1,"questions":[1],"keywords":["Hsp70","Hsc70","NBD","SBD","крышка","ATP","ADP","сродство","субстрат","шаперон"],"lead":["[[T01|Hsp70]] связывает открытые гидрофобные участки развёрнутых белков, но прочность связывания зависит от нуклеотида в его [[T02|нуклеотид-связывающем домене]]. Гидролиз ATP закрывает [[T03|крышку]] над субстратом, а замена ADP на ATP её открывает."],"mechanism":["Hsp70 в комплексе с ATP: субстрат-связывающий домен (SBD) открыт, субстрат связывается и отходит быстро.","Гидролиз ATP в NBD через линкер передаётся на SBD: крышка закрывается, и субстрат отходит медленно.","Выход ADP и связывание новой молекулы ATP открывают SBD, и субстрат освобождается."],"paragraphs":["Hsp70 — шаперон, который связывает короткие гидрофобные участки полипептида. В нативном белке такие участки спрятаны внутри глобулы, а у развёрнутых, неправильно свёрнутых и ещё не достроенных молекул они открыты. Связывание с Hsp70 не даёт таким молекулам слипаться друг с другом.","Молекула Hsp70 состоит из двух доменов, соединённых линкером. Нуклеотид-связывающий домен (NBD) связывает и гидролизует ATP. Субстрат-связывающий домен (SBD) несёт карман для полипептида и α-спиральную крышку. Когда в NBD находится ATP, карман открыт: субстрат связывается быстро, но так же быстро и отходит. После гидролиза ATP до ADP конформация обоих доменов меняется, крышка закрывается, и субстрат отходит во много раз медленнее.","Цикл замыкается, когда ADP выходит из NBD и его место занимает ATP, которого в цитоплазме много. SBD снова открывается, и субстрат освобождается. Освобождённая молекула может свернуться сама или снова связаться с Hsp70.","Сочетание двух состояний даёт выигрыш, недоступный ни одному из них по отдельности: субстрат быстро захватывается в ATP-состоянии и медленно отходит в ADP-состоянии. Расчёты показывают, что за счёт расхода ATP эффективное сродство может быть на порядки выше равновесного; такое сродство называют неравновесным, или [[T07|«сверхсродством»]]. Hsp70 при этом не задаёт белку готовую нативную структуру. Связывание с шапероном может изменять конформацию субстрата и устранять ошибочно свёрнутые состояния; после освобождения часть молекул приобретает нативную структуру (Imamoglu 2020)."],"trap":["Hsp70 сворачивает белок за счёт энергии ATP, как мотор, придающий цепи правильную форму.","Энергия ATP расходуется на смену состояний Hsp70 — прочное связывание и освобождение субстрата. Правильная укладка цепи после освобождения определяется её аминокислотной последовательностью; за один цикл сворачивается лишь часть молекул, поэтому нужны повторные циклы."],"conditions":"Схема механизма, качественные состояния. Строение доменов и смена конформаций обобщены по обзорам Rosenzweig 2019 (реферат) и Wentink 2026 (полный текст). Неравновесное «сверхсродство» — вывод теоретической модели De Los Rios 2014 (реферат), а не прямое измерение в клетке. Устранение ошибочно свёрнутых промежуточных состояний люциферазы при связывании с DnaK — Imamoglu 2020 (in vitro, DnaK, DnaJ, GrpE; реферат). Слова «быстро», «медленно», «высокое», «низкое» на схеме не являются измерениями.","sources":["Rosenzweig2019","Wentink2026","DeLosRios2014","Imamoglu2020"],"quiz":{"id":"S11-L01","rev":1,"question":"Hsp70 находится в ATP-состоянии и связал гидрофобный участок субстрата. Затем ATP в NBD гидролизовался до ADP. Как изменится скорость отхода субстрата от SBD?","options":[{"id":"S11-L01-1","text":"Не изменится: нуклеотид связан с другим доменом.","correct":false,"feedback":"Домены связаны аллостерически через линкер: смена нуклеотида в NBD меняет конформацию SBD и положение крышки."},{"id":"S11-L01-2","text":"Снизится: крышка закроется над субстратом.","correct":true,"feedback":"После гидролиза ATP крышка SBD закрывается, и субстрат отходит во много раз медленнее, чем в ATP-состоянии."},{"id":"S11-L01-3","text":"Возрастёт: ADP вытеснит субстрат из кармана.","correct":false,"feedback":"ADP связывается в NBD, а не в кармане SBD; вытеснения субстрата нет — наоборот, ADP-состояние удерживает его прочнее."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Три этапа цикла Hsp70","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Этап цикла","opts":["ATP в NBD","ATP гидролизован","ADP вышел, связался ATP"]}],"W":560,"H":320,"NW":340,"NH":320,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, контакт","seq":"порядок событий, путь субстрата","rx":"химическое превращение (гидролиз ATP, перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет"]},"zones":[{"x":10,"y":14,"w":275,"h":296,"c":"cyto","t":"молекула Hsp70","lx":20,"ly":34,"n":[4,4,176,300,12,22]}],"nodes":{"nbd":{"p":[148,85,230,46],"n":[88,64,150,44],"t":"NBD: ATP","fs":16},"sbd":{"p":[148,180,230,46],"n":[88,160,150,44],"t":"SBD: карман открыт","fs":15,"tn":"SBD: открыт"},"lid":{"p":[148,270,230,40],"n":[88,250,150,40],"t":"крышка открыта","fs":15},"jdp":{"p":[445,48,200,56],"n":[270,40,130,56],"t":"J-белок:\nстимулирует гидролиз","fs":14,"tn":"J-белок:\nгидролиз ATP"},"nef":{"p":[445,128,200,56],"n":[270,120,130,56],"t":"NEF:\nускоряет выход ADP","fs":14,"tn":"NEF:\nвыход ADP"},"sub":{"p":[445,215,200,56],"n":[270,210,130,56],"t":"субстрат:\nгидрофобный участок","fs":15,"tn":"субстрат"}},"edges":{"al":{"a":"nbd","b":"sbd","k":"seq","t":"через линкер","d":[52,4],"tn":"через\nлинкер","dn":[8,-4],"anc":"start"},"j":{"a":"jdp","b":"nbd","k":"act","t":"","d":[0,-12],"ao":[-100,16],"bo":[115,-10],"aon":[-65,12],"bon":[75,-6]},"n":{"a":"nef","b":"nbd","k":"act","t":"","d":[0,18],"ao":[-100,-14],"bo":[115,12],"aon":[-65,-16],"bon":[75,12]},"bind":{"a":"sub","b":"sbd","k":"bind","t":"","tn":"","d":[0,22],"ao":[-100,-14],"bo":[115,8],"aon":[-65,-10],"bon":[75,8]}},"st":{"0":{"n":{"nbd":"base","sbd":"base","lid":"off","sub":"base","jdp":"on","nef":"off"},"t":{"nbd":"NBD: ATP","sbd":"SBD: карман открыт","lid":"крышка открыта"},"tn":{"sbd":"SBD: открыт"},"e":{"j":"on","n":"off","al":"on","bind":"on"},"et":{"bind":"быстрый обмен"},"m":[["Нуклеотид в NBD","ATP"],["Сродство SBD к субстрату","низкое"],["Отход субстрата","быстрый"]],"note":"В ATP-состоянии карман SBD открыт. J-белок подводит субстрат к Hsp70 и стимулирует гидролиз ATP."},"1":{"n":{"nbd":"on","sbd":"on","lid":"on","sub":"on","jdp":"off","nef":"off"},"t":{"nbd":"NBD: ADP","sbd":"SBD: субстрат в кармане","lid":"крышка закрыта"},"tn":{"sbd":"SBD: занят"},"e":{"j":"off","n":"off","al":"on","bind":"on"},"et":{"bind":"прочно"},"m":[["Нуклеотид в NBD","ADP"],["Сродство SBD к субстрату","высокое"],["Отход субстрата","медленный"]],"note":"После гидролиза ATP крышка закрывается над субстратом, и он отходит медленно. Пока ADP не вышел, комплекс сохраняется."},"2":{"n":{"nbd":"base","sbd":"base","lid":"off","sub":"base","jdp":"off","nef":"on"},"t":{"nbd":"NBD: ADP → ATP","sbd":"SBD: карман открыт","lid":"крышка открыта"},"tn":{"sbd":"SBD: открыт"},"e":{"j":"off","n":"on","al":"on","bind":"off"},"et":{"bind":""},"m":[["Нуклеотид в NBD","ADP заменён на ATP"],["Сродство SBD к субстрату","снова низкое"],["Субстрат","освобождён"]],"note":"NEF ускоряет выход ADP; карман NBD занимает ATP, крышка открывается, и субстрат освобождается — он может свернуться или связаться снова."}}}}},{"id":"hsp70-jdp","number":2,"section":0,"title":"Как J-белок выбирает субстрат и запускает гидролиз ATP","question":1,"questions":[1],"keywords":["J-белок","JDP","Hsp40","DNAJB1","DnaJ","мотив HPD","гидролиз ATP","синергизм","QPD"],"lead":["Собственный гидролиз ATP у Hsp70 медленный. [[T04|J-доменный белок]] связывает субстрат и одновременно через [[T05|мотив HPD]] стимулирует гидролиз ATP — так захват субстрата и закрытие крышки происходят вместе."],"mechanism":["J-белок связывает развёрнутый белок своими субстрат-связывающими доменами и подводит его к Hsp70.","J-домен с мотивом His-Pro-Asp (HPD) взаимодействует с NBD и линкером Hsp70 и стимулирует гидролиз ATP.","Стимуляция сильнее всего, когда субстрат одновременно находится в SBD: гидролиз совпадает по времени с захватом."],"paragraphs":["У человека около 50 J-доменных белков (JDP, прежнее название — Hsp40) и лишь 11 белков Hsp70. Разнообразие J-белков определяет, к каким субстратам и комплексам будет привлечён Hsp70. Одни J-белки узнают гидрофобные участки любых развёрнутых белков, другие связывают определённые белки, третьи прикрепляют Hsp70 к рибосоме или транслокону.","Общая часть всех J-белков — J-домен из примерно 70 остатков с консервативным мотивом His-Pro-Asp (HPD). J-домен связывается с Hsp70 в области NBD и линкера и запускает конформационную перестройку, ускоряющую гидролиз ATP. В экспериментах с бактериальными DnaK и DnaJ гидролиз ускорялся более чем в 1000 раз, но при низкой концентрации DnaJ — только в присутствии белкового субстрата. Значит, наибольший эффект дают одновременно связанные J-белок и субстрат.","Такое сопряжение имеет смысл для захвата субстрата. Если гидролиз произойдёт, пока субстрат находится в открытом кармане, крышка закроется именно над ним. Без стимуляции субстрат чаще отходит раньше, чем ATP будет гидролизован.","Замена гистидина мотива HPD (например, H32Q у J-белка DNAJB1 человека) лишает J-домен способности стимулировать гидролиз. Такой белок может связывать субстрат, но Hsp70 прочно его не захватывает. Поэтому замена в мотиве HPD показывает, что для работы системы нужна именно стимуляция гидролиза, а не только доставка субстрата."],"trap":["J-белок — фактор обмена нуклеотидов: он заменяет ADP на ATP и освобождает субстрат.","J-белок ускоряет другую стадию цикла — гидролиз ATP, после которого субстрат удерживается прочно. Выход ADP и освобождение субстрата ускоряют факторы обмена нуклеотидов (NEF)."],"conditions":"Схема механизма, качественные состояния. Числа стимуляции получены in vitro на бактериальных белках DnaK и DnaJ (Laufen 1999, реферат); структурная основа роли мотива HPD — кристаллическая структура комплекса DnaK с J-доменом (Kityk 2018, реферат). Число J-белков и Hsp70 у человека — по обзору Wentink 2026 (полный текст) с исправлением авторов 2026 г.: в рис. 1a добавлен HSPA6, в семействе Hsp70 11 белков, а не 10. Обозначения «низкий», «высокий» на схеме не являются измерениями.","sources":["Laufen1999","Kityk2018","Wentink2026"],"quiz":{"id":"S11-L02","rev":1,"question":"В пробирке Hsp70, ATP и белковый субстрат. Добавили J-белок с заменой H→Q в мотиве HPD в той же концентрации, что и J-белок дикого типа в контроле. Как изменится скорость гидролиза ATP по сравнению с контролем?","options":[{"id":"S11-L02-1","text":"Будет выше: мутантный J-белок прочнее связывает субстрат.","correct":false,"feedback":"Прочность связывания субстрата J-белком не заменяет стимуляцию: гидролиз ATP у Hsp70 ускоряет именно J-домен с мотивом HPD."},{"id":"S11-L02-2","text":"Будет такой же: субстрат сам стимулирует гидролиз.","correct":false,"feedback":"Субстрат один ускоряет гидролиз слабо; сильная стимуляция требует одновременного действия субстрата и J-домена с мотивом HPD."},{"id":"S11-L02-3","text":"Будет ниже: мотив HPD нужен для стимуляции гидролиза.","correct":true,"feedback":"Замена гистидина в мотиве HPD лишает J-домен способности стимулировать гидролиз ATP, поэтому скорость будет близка к скорости без J-белка."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"J-белок и субстрат вместе запускают гидролиз ATP","status":"Схема механизма · качественные состояния","ctrls":[{"id":"j","type":"group","label":"J-белок","opts":["нет","с мотивом HPD","с заменой H→Q (QPD)"]},{"id":"s","type":"check","label":"Субстрат связан с SBD"}],"W":560,"H":320,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, контакт","seq":"порядок событий, путь субстрата","rx":"химическое превращение (гидролиз ATP, перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет"]},"nodes":{"jdp":{"p":[130,70,200,46],"n":[90,50,160,44],"t":"J-белок","fs":16},"sub":{"p":[130,250,200,46],"n":[90,300,160,44],"t":"субстрат","fs":16},"hsp":{"p":[420,160,210,56],"n":[255,175,150,56],"t":"Hsp70·ATP\n(SBD открыт)","fs":15},"hyd":{"p":[420,275,210,50],"n":[255,305,150,66],"t":"гидролиз ATP,\nкрышка закрывается","fs":14,"tn":"гидролиз ATP,\nкрышка\nзакрывается"}},"edges":{"jd":{"a":"jdp","b":"hsp","k":"act","t":"J-домен (HPD)","d":[0,-12],"bo":[-60,-28]},"sb":{"a":"sub","b":"hsp","k":"bind","t":"в кармане SBD","d":[0,18],"bo":[-60,28]},"go":{"a":"hsp","b":"hyd","k":"seq","t":"","d":[0,0]}},"base":{"n":{"jdp":"base","sub":"base","hsp":"base","hyd":"off"},"e":{"jd":"on","sb":"on","go":"off"}},"st":{"0-0":{"n":{"jdp":"abs","sub":"off"},"e":{"jd":"hide","sb":"off"},"m":[["Гидролиз ATP у Hsp70","очень медленный"],["Захват субстрата","нет"]],"note":"Без J-белка и субстрата Hsp70 гидролизует ATP очень медленно."},"0-1":{"n":{"jdp":"abs","sub":"on","hyd":"low"},"e":{"jd":"hide","go":"on"},"m":[["Гидролиз ATP у Hsp70","медленный"],["Захват субстрата","редкий: субстрат чаще отходит"]],"note":"Субстрат в кармане немного ускоряет гидролиз, но обычно отходит раньше, чем закроется крышка."},"1-0":{"n":{"jdp":"on","sub":"off","hyd":"low"},"e":{"sb":"off","go":"on"},"m":[["Гидролиз ATP у Hsp70","ускорен слабо"],["Захват субстрата","нет субстрата"]],"note":"Без субстрата J-белок в невысокой концентрации ускоряет гидролиз слабо (в экспериментах с DnaK и DnaJ)."},"1-1":{"n":{"jdp":"on","sub":"on","hsp":"on","hyd":"on"},"e":{"go":"on"},"m":[["Гидролиз ATP у Hsp70","многократно ускорен"],["Захват субстрата","частый: крышка закрывается над субстратом"]],"note":"J-белок и субстрат вместе многократно ускоряют гидролиз: крышка закрывается именно тогда, когда субстрат находится в кармане."},"2-0":{"n":{"jdp":"low","sub":"off"},"e":{"jd":"off","sb":"off"},"t":{"jdp":"J-белок QPD"},"m":[["Гидролиз ATP у Hsp70","очень медленный"],["Захват субстрата","нет"]],"note":"J-домен с заменой H→Q не стимулирует гидролиз ATP."},"2-1":{"n":{"jdp":"low","sub":"on","hyd":"low"},"e":{"jd":"off","go":"on"},"t":{"jdp":"J-белок QPD"},"m":[["Гидролиз ATP у Hsp70","медленный"],["Захват субстрата","редкий"]],"note":"Мутантный J-белок может подвести субстрат, но не запускает гидролиз: захват такой же редкий, как без J-белка."}}}}},{"id":"hsp70-nef","number":3,"section":0,"title":"Почему для освобождения субстрата нужен фактор обмена нуклеотидов","question":1,"questions":[1],"keywords":["NEF","фактор обмена нуклеотидов","BAG1","Hsp110","GrpE","SIL1","выход ADP","освобождение субстрата","Hip"],"lead":["В ADP-состоянии Hsp70 удерживает субстрат, пока ADP не выйдет из NBD. [[T06|Фактор обмена нуклеотидов]] ускоряет этот выход и тем самым определяет, как долго длится связывание."],"mechanism":["NEF связывается с NBD Hsp70 в ADP-состоянии и снижает его сродство к ADP.","ADP выходит, карман NBD занимает ATP, крышка SBD открывается, и субстрат освобождается.","Количество и тип NEF задают время удержания: и недостаток, и избыток NEF снижают выход сворачивания in vitro."],"paragraphs":["Без NEF ADP выходит из NBD медленно, и комплекс Hsp70·ADP·субстрат существует долго. Субстрат защищён от агрегации, но не может свернуться: чтобы получить такую возможность, он должен быть освобождён.","NEF связывается с NBD и раскрывает карман нуклеотида. Структурно факторы обмена очень разные: у бактерий это GrpE, у человека — 13 белков четырёх семейств: GrpE-подобные белки митохондрий, [[T08|Hsp110]], белки с повторами армадилло (HspBP1 и SIL1 в ЭПР) и [[T09|белки BAG]]. Несмотря на разное происхождение, все они действуют на один и тот же участок NBD. Эффективность различается: белки с повторами армадилло ускоряют выход ADP лишь в 5–10 раз, а BAG-1M в экспериментах in vitro ускорял выход ADP из Hsc70 до 900 раз.","Освобождение субстрата должно происходить вовремя. В экспериментах in vitro BAG-1M в высокой концентрации в отсутствие фосфата подавлял сворачивание люциферазы, а в низкой концентрации в присутствии фосфата усиливал его. Одно из объяснений: при слишком быстром обмене субстрат освобождается раньше, чем Hsp70 успевает изменить его конформацию. Противоположно NEF действует белок Hip: он стабилизирует ADP-состояние и продлевает связывание.","Значит, скорость и результат цикла определяются соотношением J-белков и NEF, а не одним из них."],"trap":["Чем больше фактора обмена нуклеотидов, тем эффективнее сворачивание: больше циклов — больше попыток.","Число циклов растёт, но при избытке NEF освобождение становится преждевременным, и доля молекул, свернувшихся после освобождения, падает. In vitro зависимость от количества NEF колоколообразная (Gässler 2001)."],"conditions":"Схема механизма, качественные состояния. Семейства NEF, диапазоны ускорения и действие Hip — по обзору Wentink 2026 (полный текст); ускорение выхода ADP до 900 раз и концентрационная зависимость сворачивания люциферазы — эксперименты in vitro с очищенными Hsc70/Hsp70 человека и BAG-1M (Gässler 2001, реферат). Состояние «избыток NEF» — качественная иллюстрация, а не измерение.","sources":["Wentink2026","Gassler2001"],"quiz":{"id":"S11-L03","rev":1,"question":"В пробирке Hsp70, J-белок, ATP и развёрнутая люцифераза; NEF нет, и большая часть люциферазы находится в комплексе Hsp70·ADP. Добавили BAG1 в небольшом количестве. Как изменится время удержания люциферазы в одном цикле?","options":[{"id":"S11-L03-1","text":"Сократится: BAG1 ускорит выход ADP.","correct":true,"feedback":"BAG1 связывается с NBD и ускоряет выход ADP; после связывания ATP крышка открывается, и люцифераза освобождается раньше."},{"id":"S11-L03-2","text":"Увеличится: BAG1 стабилизирует ADP-состояние.","correct":false,"feedback":"ADP-состояние стабилизирует белок Hip; BAG1 действует противоположно — ускоряет выход ADP."},{"id":"S11-L03-3","text":"Не изменится: BAG1 действует только на гидролиз ATP.","correct":false,"feedback":"Гидролиз ATP ускоряет J-белок. BAG1 — фактор обмена нуклеотидов: он действует на следующую стадию, выход ADP."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Фактор обмена нуклеотидов и время удержания субстрата","status":"Схема механизма · качественные состояния","ctrls":[{"id":"n","type":"group","label":"Количество NEF","opts":["нет","умеренное","избыток"]}],"W":560,"H":330,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, контакт","seq":"порядок событий, путь субстрата","rx":"химическое превращение (гидролиз ATP, перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет"]},"nodes":{"comp":{"p":[140,80,220,56],"n":[100,60,180,56],"t":"Hsp70·ADP·субстрат\n(крышка закрыта)","fs":15},"nef":{"p":[430,80,200,56],"n":[268,150,130,56],"t":"NEF:\nускоряет выход ADP","fs":14,"tn":"NEF:\nвыход ADP"},"open":{"p":[140,200,220,56],"n":[100,200,180,56],"t":"Hsp70·ATP\n(субстрат освобождён)","fs":15},"fold":{"p":[140,295,220,46],"n":[85,320,150,50],"t":"субстрат свернулся","fs":15},"re":{"p":[420,295,190,46],"n":[258,320,150,50],"t":"снова развёрнут","fs":15}},"edges":{"nb":{"a":"nef","b":"comp","k":"act","t":"","d":[0,-14],"aon":[-65,-10]},"rel":{"a":"comp","b":"open","k":"seq","t":"выход ADP,\nсвязывание ATP","d":[64,0],"anc":"start","tn":"выход ADP,\nсвязывание\nATP","dn":[8,4]},"f":{"a":"open","b":"fold","k":"seq","t":"","d":[0,0]},"r":{"a":"open","b":"re","k":"seq","t":"","d":[0,0]}},"st":{"0":{"n":{"comp":"on","nef":"abs","open":"off","fold":"off","re":"off"},"e":{"nb":"hide","rel":"off","f":"off","r":"off"},"m":[["Выход ADP","медленный"],["Время удержания","долгое"],["Освобождений за час","мало"]],"note":"Без NEF субстрат долго остаётся в комплексе: он защищён от агрегации, но редко получает возможность свернуться."},"1":{"n":{"comp":"base","nef":"on","open":"on","fold":"on","re":"low"},"e":{"nb":"on","rel":"on","f":"on","r":"on"},"m":[["Выход ADP","ускорен"],["Время удержания","короткое"],["Освобождений, после которых белок свернулся","значительная доля"]],"note":"Умеренное количество NEF освобождает субстрат вовремя: циклы частые, и после многих из них белок сворачивается."},"2":{"n":{"comp":"base","nef":"on","open":"on","fold":"low","re":"on"},"e":{"nb":"on","rel":"on","f":"off","r":"on"},"m":[["Выход ADP","очень быстрый"],["Время удержания","очень короткое"],["Освобождений, после которых белок свернулся","меньшая доля"]],"note":"При избытке NEF субстрат освобождается слишком рано и чаще остаётся развёрнутым. In vitro избыток BAG-1M подавлял сворачивание люциферазы (Gässler 2001)."}}}}},{"id":"hsp70-triage","number":4,"section":0,"title":"Как решается судьба субстрата: новая попытка, передача Hsp90 или деградация","question":1,"questions":[1],"keywords":["CHIP","STUB1","HOP","Hsp90","BAG1","BAG3","деградация","убиквитинирование","кинетическая конкуренция","многократные циклы"],"lead":["Hsp70 не «решает», что делать с субстратом: судьба белка определяется конкуренцией процессов. Белок, который свернулся, перестаёт связываться; белок, который долго остаётся развёрнутым, связывают [[T11|Hsp90]] или убиквитинлигаза [[T10|CHIP]]."],"mechanism":["После освобождения субстрат либо сворачивается и прячет гидрофобные участки, либо снова связывается с Hsp70.","Белок HOP связывает Hsp70 и Hsp90 и помогает передать субстрат Hsp90; для передачи нужен NEF.","CHIP связывается с C-концевым мотивом EEVD Hsp70 и Hsp90 и убиквитинирует связанный субстрат — он направляется в протеасому."],"paragraphs":["За один цикл связывания и освобождения сворачивается лишь часть молекул субстрата. Это показали ещё на бактериальной системе DnaK, DnaJ и GrpE: для полного восстановления активности люциферазы нужны многие циклы. Каждый цикл даёт молекуле новую попытку.","Белок, который свернулся, прячет гидрофобные участки внутрь глобулы и больше не узнаётся шаперонами. Белок, который остаётся развёрнутым, связывается снова и снова. Поэтому выбор между сворачиванием и деградацией описывают как кинетическую конкуренцию: участки, узнаваемые Hsp70, могут служить и сигналами деградации, если остаются открытыми долго.","Ход конкуренции смещают кошапероны. HOP связывается с C-концами Hsp70 и Hsp90 и помогает передать субстрат от одного шаперона другому. Убиквитинлигаза CHIP (STUB1) содержит домен TPR, которым связывается с теми же C-концевыми мотивами EEVD, и U-бокс, который переносит убиквитин на субстрат. В экспериментах CHIP вызывал убиквитинирование и протеасомную деградацию глюкокортикоидного рецептора — клиента Hsp90. Белок BAG1 своим убиквитиноподобным доменом связывается с протеасомой, а BAG3 направляет связанные с Hsp70 белки к аутофагии.","Так шаперонная система соединена с системами деградации: о протеасоме — вопрос 2 семинара, об аутофагии — вопрос 4."],"trap":["Hsp70 сам разрушает неправильно свёрнутые белки.","У Hsp70 нет протеолитической активности. Неисправимый субстрат убиквитинирует связанная с шапероном лигаза CHIP, а расщепляет 26S-протеасома; часть субстратов направляется к аутофагии через BAG3."],"conditions":"Схема механизма, качественные состояния. Многократные циклы — эксперименты in vitro с DnaK, DnaJ, GrpE и люциферазой (Szabo 1994, реферат). Роль HOP, CHIP, BAG1 и BAG3 и представление о кинетической конкуренции — по обзору Wentink 2026 (полный текст); убиквитинирование глюкокортикоидного рецептора CHIP — клетки COS (Connell 2001, реферат). На схеме один субстрат показан в трёх вариантах судьбы; вероятности не указаны.","sources":["Szabo1994","Wentink2026","Connell2001"],"quiz":{"id":"S11-L04","rev":1,"question":"Развёрнутый белок прошёл много циклов связывания с Hsp70, но так и не свернулся. С Hsp70 связана убиквитинлигаза CHIP. Какое событие ожидается для этого белка?","options":[{"id":"S11-L04-1","text":"Hsp70 расщепит его в своём субстрат-связывающем домене.","correct":false,"feedback":"У Hsp70 нет протеолитического центра: SBD связывает полипептид, но не расщепляет его."},{"id":"S11-L04-2","text":"CHIP присоединит к нему убиквитин, и белок разрушит протеасома.","correct":true,"feedback":"CHIP связывается с C-концом Hsp70 доменом TPR и через U-бокс убиквитинирует субстрат; убиквитинированный белок разрушает 26S-протеасома."},{"id":"S11-L04-3","text":"CHIP ускорит гидролиз ATP, и белок свернётся.","correct":false,"feedback":"Гидролиз ATP у Hsp70 стимулируют J-белки; CHIP — убиквитинлигаза, она направляет субстрат на деградацию, а не на сворачивание."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Три варианта судьбы субстрата Hsp70","status":"Схема механизма · качественные состояния","ctrls":[{"id":"f","type":"group","label":"Что происходит с субстратом","opts":["свернулся","передан Hsp90","не сворачивается"]}],"W":560,"H":340,"NW":340,"NH":455,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, контакт","seq":"порядок событий, путь субстрата","rx":"химическое превращение (гидролиз ATP, перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет"]},"nodes":{"h70":{"p":[110,170,180,56],"n":[80,86,140,50],"t":"Hsp70·субстрат","fs":16},"nat":{"p":[420,50,190,46],"n":[262,86,140,46],"t":"нативный белок","fs":15},"hop":{"p":[300,178,100,40],"n":[255,165,110,40],"t":"HOP","fs":15},"h90":{"p":[470,178,140,46],"n":[255,250,140,46],"t":"Hsp90","fs":16},"chip":{"p":[102,290,164,46],"n":[75,325,130,46],"t":"CHIP (TPR + U-бокс)","fs":14,"tn":"CHIP"},"ub":{"p":[330,290,120,46],"n":[262,325,130,46],"t":"Ub-субстрат","fs":15}," де и с каким субстратом работает Hsp70. При стрессе [[T12|HSF1]] усиливает синтез компонентов системы."],"mechanism":["В ЭПР [[T13|BiP]] с J-белком DNAJC23 (Sec63) связывает входящую цепь у транслокона Sec61.","В цитоплазме HSPA8 с J-белком ауксилином (DNAJC6) снимает клатриновую оболочку с пузырьков.","У животных Hsp70 с J-белками классов A и B и Hsp110 растворяет белковые агрегаты."],"paragraphs":["Hsp70 связывает гидрофобные участки почти любой последовательности, поэтому специфичность ему задают J-белки. В ЭПР BiP вместе с J-белком DNAJC23 (Sec63) связывает цепь, входящую через транслокон Sec61, и не даёт ей вернуться в цитоплазму. В митохондриях mtHsp70 (HSPA9) вместе с J-белками, закреплёнными в комплексе TIM, обеспечивает вход белков в матрикс. В цитоплазме HSPA8 с J-белком ауксилином (DNAJC6) разбирает клатриновую оболочку эндоцитозных пузырьков.","У бактерий, грибов и растений агрегаты растворяет AAA+-белок Hsp100 вместе с Hsp70, а в цитозоле животных дезагрегаз семейства Hsp100 нет. Вместо них работает комплекс Hsp70, J-белков классов A и B и Hsp110 в роли NEF: in vitro он растворял агрегаты люциферазы и других белков после нагревания, а у нематоды снижение содержания Hsp110 нарушало растворение агрегатов после теплового шока.","При тепловом шоке и других воздействиях, нарушающих сворачивание белков, транскрипционный фактор HSF1 усиливает синтез Hsp70, J-белков и NEF; локальные программы того же рода действуют в ЭПР (UPR) и в митохондриях. С возрастом ёмкость сети протеостаза снижается, а неправильно свёрнутые белки накапливаются, особенно в постмитотических клетках, например в нейронах.","Общее во всех случаях одно: ATP-зависимый цикл связывания и освобождения, направленный J-белком и завершённый NEF."],"trap":["Hsp70 нужен клетке только при тепловом шоке, поэтому его называют белком теплового шока.","Многие Hsp70 синтезируются постоянно (Hsc70, BiP, mtHsp70) и работают и без стресса: в транслокации белков, снятии клатриновой оболочки, сворачивании новых цепей. При тепловом шоке HSF1 дополнительно усиливает синтез индуцибельных форм и кошаперонов."],"conditions":"Схема механизма, качественные состояния. Функции BiP и DNAJC23, mtHsp70 и TIM, HSPA8 и ауксилина, роль HSF1 — по обзору Wentink 2026 (полный текст). Растворение агрегатов комплексом Hsp70, J-белков классов A и B и Hsp110: эксперименты in vitro с белками человека и эксперименты на C. elegans (Rampelt 2012; Nillegoda 2015, рефераты). Снижение ёмкости сети протеостаза при старении — обзор Hipp 2019 (полный текст).","sources":["Wentink2026","Rampelt2012","Nillegoda2015","Hipp2019"],"quiz":{"id":"S11-L05","rev":1,"question":"В клетках нематоды снизили содержание Hsp110, затем подвергли их тепловому шоку. Как изменится растворение образовавшихся белковых агрегатов по сравнению с контролем?","options":[{"id":"S11-L05-1","text":"Ускорится: Hsp110 конкурирует с Hsp70 за субстрат.","correct":false,"feedback":"Hsp110 у животных работает вместе с Hsp70 как фактор обмена нуклеотидов; без него растворение агрегатов ослабевает, а не ускоряется."},{"id":"S11-L05-2","text":"Не изменится: агрегаты растворяет Hsp100.","correct":false,"feedback":"В цитозоле животных нет дезагрегаз семейства Hsp100 (Hsp104 дрожжей, ClpB бактерий); эту функцию выполняет комплекс Hsp70 с J-белками и Hsp110."},{"id":"S11-L05-3","text":"Замедлится: Hsp110 нужен Hsp70 для растворения агрегатов.","correct":true,"feedback":"Hsp110 как фактор обмена нуклеотидов поддерживает работу Hsp70 и J-белков на агрегатах; у нематоды снижение его содержания нарушало растворение агрегатов после теплового шока (Rampelt 2012)."}]},"widget":{"kind":"cards","title":"","s":{"title":"Одна машина — разные задачи","status":"Схема механизма · качественные состояния","opts":["ЭПР","клатриновые пузырьки","агрегаты","тепловой шок"],"opts_label":"Где работает Hsp70","heads":["Hsp70","J-белок","NEF","Результат цикла"],"cards":[{"v":["BiP (HSPA5)","DNAJC23 (Sec63) у транслокона Sec61","SIL1, GRP170","новая цепь удерживается в просвете ЭПР и не возвращается в цитоплазму"],"note":"J-белок закреплён у транслокона и привлекает BiP именно к входящей цепи.","pic":{"kind":"steps","steps":["цепь входит\nчерез Sec61","DNAJC23\nпривлекает BiP","гидролиз ATP:\nBiP связан\nс цепью","цепь не уходит\nназад"],"hl":1}},{"v":["HSPA8 (Hsc70)","ауксилин (DNAJC6) связывает клатрин","NEF цитоплазмы","клатриновая оболочка разбирается, пузырёк освобождается"],"note":"Здесь субстрат — не развёрнутый белок, а собранная клатриновая решётка.","pic":{"kind":"steps","steps":["клатриновый\nпузырёк","ауксилин\nна решётке","HSPA8\nсвязывается,\nгидролиз ATP","оболочка\nразобрана"],"hl":2}},{"v":["HSPA8 или HSPA1A","J-белки классов A и B вместе","Hsp110","белки извлекаются из агрегата и могут свернуться"],"note":"В цитозоле животных нет дезагрегаз семейства Hsp100 (Hsp104 дрожжей, ClpB бактерий); растворение агрегатов выполняет комплекс Hsp70, J-белков и Hsp110 (Rampelt 2012; Nillegoda 2015).","pic":{"kind":"steps","steps":["агрегат\nпосле нагревания","J-белки A и B\nна агрегате","Hsp70 на агрегате,\nHsp110 ускоряет\nвыход ADP","цепи\nизвлечены"],"hl":2}},{"v":["индуцибельные Hsp70 (HSPA1A)","больше J-белков","больше NEF","ёмкость системы сворачивания растёт"],"note":"HSF1 усиливает транскрипцию генов компонентов шаперонной сети; с возрастом ёмкость сети снижается (Hipp 2019).","pic":{"kind":"steps","steps":["нагревание:\nбелки\nразворачиваются","HSF1\nактивируется","синтез Hsp70,\nJ-белков, NEF","ёмкость сети\nвыше"],"hl":1}}],"fixed":"Схемы показывают последовательность событий; относительные скорости и количества не указаны."}}},{"id":"hsp70-measure","number":6,"section":0,"title":"Как проверить работу цикла: сворачивание люциферазы in vitro","question":1,"questions":[1],"keywords":["люцифераза","сворачивание in vitro","рефолдинг","контроль","K71M","H32Q","ATP","метод"],"lead":["Работу шаперонной системы проверяют на модельном белке: [[T14|люцифераза]] после нагревания теряет активность, а свет при окислении люциферина излучают только вновь свернувшиеся молекулы."],"mechanism":["Люциферазу разворачивают нагреванием или денатурирующим веществом и переносят в смесь с Hsp70, J-белком, NEF и ATP.","Через разные промежутки времени из смеси отбирают одинаковые пробы, разводят в регистрационной смеси с люциферином, ATP и Mg²⁺ и сразу измеряют свечение — долю активности от нативной люциферазы.","Контрольные смеси без одного компонента или с мутантным белком показывают, какая стадия цикла нужна для восстановления активности."],"paragraphs":["Сворачивание белка в клетке трудно наблюдать непосредственно, поэтому механизм цикла Hsp70 изучали на очищенных белках. Удобный субстрат — люцифераза светлячка: её активность легко измерить, а развёрнутая люцифераза быстро агрегирует, если шаперонов нет. Восстановление свечения показывает, какая доля молекул вернулась в нативное состояние.","Полная смесь содержит Hsp70, J-белок, NEF и ATP. Её сравнивают с контролями: без ATP, без J-белка или с J-белком, у которого заменён мотив HPD, без NEF, с Hsp70 без гидролиза ATP (Hsc70 K71M связывает ATP, но не гидролизует его). Если активность не восстанавливается в одном из контролей, значит, соответствующая стадия необходима. Именно так было показано, что сворачивание требует многих циклов связывания и освобождения, а избыток BAG-1M подавляет сворачивание. Сворачивание и измерение разделены: ATP нужен и самой люциферазе для реакции свечения, поэтому все пробы измеряют в одинаковой регистрационной смеси с ATP, а в контроле «без ATP» его нет только на стадии сворачивания. Пробу измеряют сразу после разведения, чтобы стадия регистрации не стала дополнительным временем сворачивания. Полезно сравнивать кривые во времени, а не одну точку: в учебной модели без NEF активность растёт медленно, а без стимуляции гидролиза почти не растёт.","Метод имеет пределы. Концентрации белков подбирают экспериментаторы, люцифераза — не естественный субстрат, а условия (температура, ионы, фосфат) меняют результат. Поэтому вывод «компонент необходим in vitro» нельзя напрямую переносить на клетку: в клетках его проверяют отдельно."],"trap":["Если полная смесь восстановила активность люциферазы, то в клетке этот белок сворачивается так же.","Эксперимент in vitro показывает, что выбранных компонентов достаточно в выбранных концентрациях. В клетке состав сети шаперонов, концентрации и субстраты другие; вывод требует проверки в клетках."],"conditions":"Схема метода · условные пиктограммы. Кривые на второй карточке рассчитаны по учебной модели практикума (вопрос 1, продвинутый уровень), а не взяты из статьи. Многократные циклы — DnaK, DnaJ, GrpE и люцифераза in vitro (Szabo 1994, реферат); разведение проб в регистрационной смеси и измерение в течение 2 с — Imamoglu 2020 (раздел Methods); Hsc70 K71M — ATPазный фрагмент Hsc70 быка, ATP связан, гидролиза нет (O'Brien 1996, реферат); подавление сворачивания избытком BAG-1M — Gässler 2001 (реферат).","sources":["Szabo1994","OBrien1996","Gassler2001","Imamoglu2020"],"quiz":{"id":"S11-L06","rev":1,"question":"Люциферазу развернули нагреванием и поместили в смесь Hsc70, J-белка, NEF и ATP. В контрольной смеси Hsc70 дикого типа заменили на Hsc70 K71M. Какой результат контроля ожидается?","options":[{"id":"S11-L06-1","text":"Активность почти не восстановится: без гидролиза ATP нет прочного захвата.","correct":true,"feedback":"Hsc70 K71M связывает ATP, но не гидролизует его; крышка SBD не закрывается над субстратом, и люцифераза агрегирует почти как без шаперона."},{"id":"S11-L06-2","text":"Активность восстановится быстрее: ATP не будет тратиться впустую.","correct":false,"feedback":"Расход ATP не потеря: гидролиз нужен для прочного захвата субстрата; без него восстановления почти нет."},{"id":"S11-L06-3","text":"Активность восстановится так же: связывания ATP достаточно.","correct":false,"feedback":"Связывание ATP оставляет Hsp70 в открытом состоянии с быстрым отходом субстрата; для захвата нужен гидролиз ATP."}]},"widget":{"kind":"cards","title":"","s":{"title":"Сворачивание люциферазы: как ставят эксперимент и что показывают контроли","status":"Схема метода · условные пиктограммы","opts":["Постановка","Кривые и контроли","Что ещё измеряют"],"opts_label":"Часть метода","heads":["Что измеряют","Как","Контроль","Граница вывода"],"cards":[{"v":["долю нативной люциферазы по её свечению","сворачивание: нагретую люциферазу переносят в смесь Hsp70, J-белка, NEF и ATP; регистрация: пробы разводят в смеси с люциферином, ATP и Mg²⁺ и сразу измеряют свечение","нативная люцифераза в той же регистрационной смеси (100 %) и смесь без шаперонов","это сворачивание in vitro в выбранных концентрациях"],"note":"Свечение даёт только правильно свёрнутая люцифераза, поэтому активность служит мерой сворачивания. ATP при регистрации нужен самой люциферазе; в контроле «без ATP» его нет только на стадии сворачивания.","pic":{"kind":"steps","steps":["нагревание:\nлюцифераза\nразвёрнута","сворачивание:\nHsp70, J-белок,\nNEF, ATP","пробы\nчерез 5–60 мин","регистрация:\nлюциферин,\nATP, Mg²⁺","свечение:\n% от нативной"],"hl":1}},{"v":["кривые восстановления активности во времени","сравнивают полную смесь со смесями без одного компонента","без ATP на стадии сворачивания; Hsc70 K71M; J-белок с заменой в HPD; без NEF","кривые показывают необходимость стадии, но не её скорость в клетке"],"note":"Без NEF люцифераза остаётся в комплексе с Hsp70, без стимуляции гидролиза — агрегирует.","pic":{"kind":"lines","xlab":"время, мин","ylab":"% от нативной","xmax":60,"ymax":100,"xticks":[0,20,40,60],"yticks":[0,50,100],"series":[{"name":"полная смесь","pts":[[0,0],[5,18],[10,34],[15,44],[20,52],[25,57],[30,60],[35,62],[40,64],[45,65],[50,66],[55,66],[60,67]]},{"name":"без NEF","pts":[[0,0],[5,1],[10,2],[15,4],[20,5],[25,6],[30,7],[35,9],[40,10],[45,11],[50,12],[55,13],[60,14]],"dy":-10},{"name":"J-белок H32Q","pts":[[0,0],[5,2],[10,3],[15,5],[20,6],[25,6],[30,7],[35,7],[40,7],[45,7],[50,7],[55,7],[60,7]],"dash":true,"dy":18}],"cap":"учебная модель практикума"}},{"v":["скорость гидролиза ATP","Hsp70 инкубируют с ATP с J-белком и без него, с белковым субстратом и без него; измеряют освободившийся фосфат","без J-белка; J-белок с заменой H→Q","стимуляция зависит от концентраций и от того, белковый субстрат или пептид"],"note":"Так показали, что J-белок и субстрат вместе ускоряют гидролиз ATP у DnaK более чем в 1000 раз (Laufen 1999).","pic":{"kind":"steps","steps":["Hsp70 + ATP","± J-белок,\n± субстрат","освободившийся\nфосфат","скорость\nгидролиза"],"hl":1}}],"fixed":"Пиктограммы условны; числа на кривых — расчёт учебной модели, а не данные статьи."}}},{"id":"ubiquitin-cascade","number":7,"section":1,"title":"Как каскад E1–E2–E3 присоединяет убиквитин к субстрату","question":2,"questions":[2],"keywords":["убиквитин","E1","UBA1","E2","E3","RING","HECT","тиоэфир","TAK-243","лизин"],"lead":["[[T15|Убиквитин]] присоединяется к белку-мишени не одним ферментом, а цепочкой из трёх: [[T16|E1]] активирует его за счёт ATP, [[T17|E2]] переносит, а [[T18|убиквитинлигаза E3]] выбирает субстрат."],"mechanism":["E1 расходует ATP: образует аденилат убиквитина и присоединяет убиквитин тиоэфирной связью к собственному цистеину.","E1 передаёт убиквитин на цистеин E2, и E2·убиквитин связывается с убиквитинлигазой E3.","E3 связывает субстрат и обеспечивает перенос убиквитина на ε-аминогруппу остатка лизина субстрата."],"paragraphs":["Убиквитин — белок из 76 аминокислот. Его C-концевой глицин может образовать связь с остатком лизина другого белка. Сам по себе убиквитин к белкам не присоединяется: его нужно активировать.","Активацию выполняет фермент E1 (у человека в основном UBA1). E1 использует энергию ATP: сначала образуется аденилат убиквитина и освобождается пирофосфат, затем убиквитин присоединяется тиоэфирной связью к цистеину активного центра E1. Далее убиквитин переходит на цистеин фермента E2 — у человека около 40 генов E2.","Выбор субстрата — работа убиквитинлигазы E3; таких генов у человека около 600. E3 одновременно связывает E2·убиквитин и субстрат. RING-лигазы сближают их, и убиквитин переходит прямо с E2 на лизин субстрата. HECT-лигазы сначала принимают убиквитин на собственный цистеин и уже затем переносят его на субстрат; RBR-лигазы сочетают оба способа.","Повторные циклы удлиняют цепь: следующий убиквитин присоединяется к лизину уже присоединённого убиквитина. Если ингибировать E1, например соединением TAK-243, остановится убиквитинирование всех субстратов, а если устранить одну E3 — только её субстратов. Поэтому избирательность системы определяется прежде всего многообразием E3."],"trap":["Протеасома сама находит белки, которые нужно разрушить, а убиквитин — лишь кофактор протеасомы.","Белок выбирает убиквитинлигаза E3, узнающая его дегрон; протеасома связывает уже присоединённую цепь убиквитина и почти не различает субстраты по их последовательности."],"conditions":"Схема механизма, качественные состояния. Число E3 у человека — по обзору Zhang 2025 (полный текст); число E2 — около 40, по обзорам. Действие TAK-243 показано на клетках опухолевых линий человека: ингибитор E1 снижал содержание убиквитиновых конъюгатов (Hyer 2018, реферат). Обозначения «работает», «остановлено» на схеме не являются измерениями.","sources":["Zhang2025","Hyer2018","Collins2017"],"quiz":{"id":"S11-L07","rev":1,"question":"В клетках ингибировали одну убиквитинлигазу E3, а E1 и E2 продолжают работать. Как изменится убиквитинирование белков клетки?","options":[{"id":"S11-L07-1","text":"Остановится для всех белков клетки","correct":false,"feedback":"Общая стадия каскада — E1; ингибирование одной E3 не мешает другим лигазам переносить убиквитин на свои субстраты."},{"id":"S11-L07-2","text":"Нарушится только для субстратов этой E3","correct":true,"feedback":"Каждая E3 узнаёт свои дегроны; остальные лигазы продолжают работу, поэтому затронуты только её субстраты."},{"id":"S11-L07-3","text":"Не изменится ни для одного белка","correct":false,"feedback":"У субстратов этой E3 убиквитинирование снизится: другие лигазы обычно не узнают их дегрон."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Каскад E1–E2–E3","status":"Схема механизма · качественные состояния","ctrls":[{"id":"d","type":"group","label":"Воздействие","opts":["нет","TAK-243 (ингибитор E1)","нет одной E3"]}],"W":560,"H":330,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","rx":"химическое превращение (активация и перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет или он ингибирован"]},"nodes":{"ub":{"p":[70,60,110,44],"n":[70,40,110,40],"t":"убиквитин","fs":15},"e1":{"p":[228,60,116,44],"n":[230,40,110,40],"t":"E1 (UBA1)","fs":15},"e2":{"p":[410,60,100,44],"n":[255,140,110,40],"t":"E2","fs":16},"e3":{"p":[410,192,150,50],"n":[262,250,120,50],"t":"E3 (своя для\nкаждой группы)","fs":14,"tn":"E3"},"sub":{"p":[150,192,170,50],"n":[70,250,120,50],"t":"субстрат\nс дегроном","fs":15},"ubsub":{"p":[270,296,230,44],"n":[170,380,260,44],"t":"субстрат с цепью убиквитина","fs":14,"tn":"субстрат + цепь Ub"},"atp":{"p":[230,132,120,30],"n":[100,140,120,36],"t":"ATP → AMP + PPi","fs":13}},"edges":{"a1":{"a":"ub","b":"e1","k":"rx","t":""},"a2":{"a":"atp","b":"e1","k":"rx","t":""},"a3":{"a":"e1","b":"e2","k":"rx","t":"тиоэфир","d":[0,-12]},"a4":{"a":"e2","b":"e3","k":"rx","t":""},"a5":{"a":"sub","b":"e3","k":"bind","t":"дегрон","d":[0,-12]},"a6":{"a":"e3","b":"ubsub","k":"rx","t":"перенос на лизин","d":[40,4],"anc":"start"}},"base":{"n":{"ub":"base","e1":"on","e2":"on","e3":"on","sub":"base","ubsub":"on","atp":"met"},"e":{"a1":"on","a2":"on","a3":"on","a4":"on","a5":"on","a6":"on"}},"st":{"0":{"m":[["Активация убиквитина","идёт"],["Убиквитинирование субстратов этой E3","идёт"],["Убиквитинирование других белков","идёт"]],"note":"E1 активирует убиквитин за счёт ATP, E2 переносит его, E3 связывает дегрон субстрата и обеспечивает присоединение убиквитина к лизину."},"1":{"n":{"e1":"abs","e2":"off","e3":"off","ubsub":"off"},"e":{"a3":"off","a4":"off","a6":"off","a2":"off"},"m":[["Активация убиквитина","остановлена"],["Убиквитинирование субстратов этой E3","остановлено"],["Убиквитинирование других белков","остановлено"]],"note":"TAK-243 ингибирует E1 — общий вход каскада, поэтому убиквитин не активируется ни для одной E2 и E3."},"2":{"n":{"e3":"abs","ubsub":"off"},"e":{"a4":"off","a5":"off","a6":"off"},"m":[["Активация убиквитина","идёт"],["Убиквитинирование субстратов этой E3","почти нет"],["Убиквитинирование других белков","идёт"]],"note":"Без одной E3 E1 и E2 работают, другие лигазы убиквитинируют свои субстраты, а субстраты этой E3 остаются без цепи."}}}}},{"id":"degron","number":8,"section":1,"title":"Что такое дегрон и как убиквитинлигаза узнаёт субстрат","question":2,"questions":[2],"keywords":["дегрон","фосфодегрон","N-дегрон","C-дегрон","βTrCP","SCF","IκBα","β-катенин","D-бокс","APC/C"],"lead":["[[T19|Дегрон]] — участок белка, который узнаёт убиквитинлигаза E3. Он может существовать всегда, а может возникать после модификации белка, например после [[T20|фосфорилирования]]."],"mechanism":["Убиквитинлигаза E3 связывает дегрон субстрата своим узнающим модулем, например F-бокс-белком βTrCP в составе SCF.","Киназа фосфорилирует остатки мотива, и только фосфорилированный мотив связывается с βTrCP — так сигнал создаёт дегрон.","Замена ключевых остатков дегрона может лишить E3 возможности связать субстрат: тогда белок перестаёт убиквитинироваться и становится устойчивым."],"paragraphs":["Дегроны разнообразны. N-дегрон — дестабилизирующий N-концевой остаток, который узнают специальные E3; C-дегрон — короткий мотив на C-конце. Внутренние дегроны — короткие мотивы внутри последовательности или гидрофобные участки, открывающиеся при нарушении сворачивания. У циклина B дегрон — D-бокс, его узнаёт лигаза APC/C.","Многие дегроны возникают по сигналу. В IκBα — ингибиторе транскрипционного фактора NF-κB — мотив DSGΨxS становится дегроном после фосфорилирования S32 и S36 киназой IKK. Фосфорилированный мотив связывает F-бокс-белок βTrCP в составе куллиновой лигазы SCF; такой же фосфодегрон есть у β-катенина. Замены S32A/S36A в IκBα не позволяют IKK фосфорилировать эти остатки, и IκBα не разрушается после стимула.","Дегрон и цепь убиквитина — разные сигналы. Дегрон узнаёт E3, и от этого узнавания зависит, будет ли белок убиквитинирован. Цепь убиквитина затем узнаёт протеасома. Поэтому замена ключевых остатков дегрона стабилизирует белок, хотя его последовательность почти не изменилась.","Дегроны известны лишь для небольшой части из примерно 600 E3 человека. Их ищут, систематически заменяя участки белков и измеряя устойчивость репортёров. Один и тот же белок может иметь несколько дегронов, которые узнают разные лигазы в разных условиях."],"trap":["Дегрон — это и есть цепь убиквитина на белке.","Дегрон — участок самого субстрата, который узнаёт E3. Цепь убиквитина появляется после узнавания дегрона и служит сигналом уже для протеасомы."],"conditions":"Схема механизма, качественные состояния. Фосфодегрон IκBα и β-катенина и его связывание с SCF(βTrCP) — по Winston 1999 (реферат; белки человека, клетки и in vitro); устойчивость мутанта S32A/S36A после стимула — по Brown 1995 и Chen 1995 (рефераты; клеточные линии человека). Классы дегронов — по обзорам Varshavsky 2019 (реферат) и Zhang 2025 (полный текст); D-бокс циклина — Glotzer 1991 (реферат через обзор).","sources":["Zhang2025","Varshavsky2019","Winston1999","Brown1995","Glotzer1991"],"quiz":{"id":"S11-L08","rev":1,"question":"IκBα дикого типа и IκBα S32A/S36A экспрессируют в клетках и добавляют TNFα, который активирует IKK. Связывание с βTrCP какой формы IκBα усилится после стимула?","options":[{"id":"S11-L08-1","text":"Только формы дикого типа","correct":true,"feedback":"У IκBα дикого типа IKK фосфорилирует S32 и S36, и фосфорилированный мотив связывается с βTrCP; у мутанта эти остатки заменены аланином."},{"id":"S11-L08-2","text":"Только мутантной формы","correct":false,"feedback":"Мутант S32A/S36A не может быть фосфорилирован по этим остаткам, а βTrCP связывает именно фосфорилированный мотив."},{"id":"S11-L08-3","text":"Обеих форм в равной мере","correct":false,"feedback":"Связывание βTrCP требует фосфорилирования S32 и S36, поэтому две формы ведут себя по-разному."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Фосфодегрон IκBα и лигаза SCF(βTrCP)","status":"Схема механизма · качественные состояния","ctrls":[{"id":"g","type":"group","label":"IκBα","opts":["дикого типа","S32A/S36A"]},{"id":"s","type":"check","label":"TNFα добавлен"}],"W":560,"H":320,"NW":340,"NH":430,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","rx":"химическое превращение (активация и перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет или он ингибирован"]},"nodes":{"ikk":{"p":[90,60,130,44],"n":[80,45,130,40],"t":"IKK","fs":16},"ikb":{"p":[215,160,160,50],"n":[170,160,200,50],"t":"IκBα: DSGΨxS","fs":15},"btrcp":{"p":[485,160,140,56],"n":[170,265,200,50],"t":"SCF(βTrCP)","fs":15},"ub":{"p":[370,280,230,44],"n":[170,370,230,44],"t":"цепь убиквитина","fs":15}},"edges":{"ph":{"a":"ikk","b":"ikb","k":"phos","t":"S32, S36","d":[-46,10]},"bd":{"a":"btrcp","b":"ikb","k":"bind","t":"узнаёт\nфосфодегрон","d":[0,-24],"tn":"узнаёт","dn":[34,4]},"ub":{"a":"btrcp","b":"ub","k":"rx","t":""}},"base":{"n":{"ikk":"off","ikb":"base","btrcp":"base","ub":"off"},"e":{"ph":"off","bd":"off","ub":"off"}},"st":{"0-0":{"m":[["Фосфорилирование S32/S36","нет"],["Связывание с βTrCP","нет"],["Устойчивость IκBα","высокая"]],"note":"Без сигнала IKK неактивна, мотив не фосфорилирован, и βTrCP его не связывает."},"0-1":{"n":{"ikk":"on","ikb":"on","btrcp":"on","ub":"on"},"e":{"ph":"on","bd":"on","ub":"on"},"b":{"ikb":{"t":"pS32, pS36","at":"t"}},"m":[["Фосфорилирование S32/S36","есть"],["Связывание с βTrCP","есть"],["Устойчивость IκBα","низкая"]],"note":"IKK фосфорилирует S32 и S36; фосфорилированный мотив — дегрон, который связывает βTrCP, и IκBα убиквитинируется."},"1-0":{"t":{"ikb":"IκBα: DAGΨxA"},"m":[["Фосфорилирование S32/S36","невозможно"],["Связывание с βTrCP","нет"],["Устойчивость IκBα","высокая"]],"note":"У мутанта серины заменены аланином; без сигнала он не отличается от IκBα дикого типа."},"1-1":{"n":{"ikk":"on"},"t":{"ikb":"IκBα: DAGΨxA"},"e":{"ph":"off"},"m":[["Фосфорилирование S32/S36","невозможно"],["Связывание с βTrCP","нет"],["Устойчивость IκBα","высокая"]],"note":"IKK активна, но фосфорилировать нечего: дегрон не возникает, и IκBα остаётся устойчивым."}}}}},{"id":"ub-chain","number":9,"section":1,"title":"Какая цепь убиквитина направляет белок в протеасому","question":2,"questions":[2],"keywords":["полиубиквитин","K48","K63","K11","моноубиквитинирование","тетраубиквитин","деубиквитиназа","разветвлённая цепь"],"lead":["Убиквитин сам содержит семь остатков лизина, поэтому цепи бывают разными. Классический сигнал для протеасомы — [[T21|цепь, связанная через K48]]; в экспериментах in vitro эффективной оказалась цепь из четырёх и более молекул убиквитина."],"mechanism":["Следующий убиквитин присоединяется к одному из лизинов предыдущего; при связывании через K48 цепь узнают рецепторы 19S-частицы.","В экспериментах с модельными субстратами in vitro эффективным сигналом была цепь K48 из четырёх убиквитинов: более короткая цепь связывалась с протеасомой во много раз слабее.","Моноубиквитинирование и цепи K63 чаще служат сигналами эндоцитоза, репарации ДНК и сборки сигнальных комплексов; [[T22|деубиквитиназы]] снимают убиквитин."],"paragraphs":["Убиквитин может присоединиться к белку одной молекулой (моноубиквитинирование), несколькими отдельными молекулами или цепью. В цепи каждый следующий убиквитин связан с одним из семи лизинов или с N-концевым метионином предыдущего. Тип связи определяет форму цепи и то, какие белки её узнают.","Классический сигнал протеасомного разрушения — цепь, связанная через K48. В экспериментах с однородными модельными субстратами эффективным сигналом была цепь из четырёх убиквитинов: укорочение цепи на две молекулы снижало её сродство к протеасоме примерно в 100 раз. Разветвлённые цепи K11/K48, которые строит лигаза APC/C, ускоряют разрушение ещё сильнее. Четыре убиквитина — не универсальный порог: часть белков клетки разрушается протеасомой и после присоединения отдельных молекул убиквитина, не связанных в цепь (Braten 2016); значение имеют и число меток, и их расположение, и свойства самого субстрата.","Цепи K63 и моноубиквитин обычно не направляют белок в протеасому. Они участвуют в эндоцитозе мембранных белков, в репарации ДНК и в сборке сигнальных комплексов, например в пути NF-κB. Поэтому формула «убиквитин — метка смерти» неточна.","Убиквитинирование обратимо. Деубиквитиназы отщепляют убиквитин и могут спасти белок от разрушения, а в протеасоме они отщепляют цепь перед расщеплением, и убиквитин используется снова. Итоговая судьба белка зависит от соотношения скоростей присоединения и снятия цепи."],"trap":["Любой убиквитин на белке означает, что белок будет разрушен протеасомой.","Судьба белка зависит от типа и длины цепи: классический сигнал протеасомы — цепь K48, а моноубиквитинирование и цепи K63 обычно служат другим целям, хотя некоторые белки разрушаются протеасомой и после моноубиквитинирования."],"conditions":"Схема механизма, качественные состояния. Минимальный сигнал из четырёх убиквитинов и снижение сродства при укорочении цепи — по Thrower 2000 (реферат; in vitro, однородные цепи K48 и модельные субстраты, очищенная протеасома). Разветвлённые цепи K11/K48 — Meyer 2014 (реферат; клетки человека и in vitro, субстраты APC/C). Разрушение после моноубиквитинирования — Braten 2016 (реферат; клетки человека и дрожжей, убиквитин, не образующий цепей). Функции цепей K63 — по обзорам. Подписи «сильное», «слабое» на схеме не являются измерениями.","sources":["Thrower2000","Meyer2014","Collins2017","Braten2016"],"quiz":{"id":"S11-L09","rev":1,"question":"Модельный субстрат несёт одну молекулу убиквитина. Лигазу заменили на такую, которая присоединяет к нему цепь из четырёх убиквитинов, связанных через K48. Как изменится связывание субстрата с 26S-протеасомой?","options":[{"id":"S11-L09-1","text":"Ослабнет: длинная цепь мешает связыванию","correct":false,"feedback":"Рецепторы 19S связывают именно цепи K48; удлинение цепи до четырёх убиквитинов усиливает, а не ослабляет связывание."},{"id":"S11-L09-2","text":"Не изменится: важен сам факт убиквитинирования","correct":false,"feedback":"Для модельного субстрата важны длина и тип цепи: одиночный убиквитин связывается с протеасомой слабо, а цепь из четырёх убиквитинов K48 — эффективный сигнал."},{"id":"S11-L09-3","text":"Усилится: такая цепь — эффективный сигнал протеасомы","correct":true,"feedback":"В экспериментах in vitro цепь K48 из четырёх убиквитинов связывалась с протеасомой намного прочнее, чем одиночный убиквитин."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Тип цепи убиквитина и судьба белка","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Модификация белка","opts":["один убиквитин","цепь K48 (≥ 4)","цепь K63"]}],"W":560,"H":300,"NW":340,"NH":400,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","rx":"химическое превращение (активация и перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет или он ингибирован"]},"nodes":{"sub":{"p":[110,150,160,50],"n":[70,200,110,50],"t":"белок + убиквитин","fs":14,"tn":"белок + Ub"},"prot":{"p":[420,70,210,50],"n":[252,100,160,50],"t":"26S-протеасома:\nразрушение","fs":14},"endo":{"p":[420,160,210,50],"n":[252,200,160,50],"t":"эндоцитоз, сортировка","fs":14,"tn":"эндоцитоз"},"sig":{"p":[420,250,210,50],"n":[252,300,160,50],"t":"сборка сигнальных\nкомплексов, репарация","fs":14,"tn":"сигнальные\nкомплексы"}},"edges":{"p":{"a":"sub","b":"prot","k":"tr","t":"","ao":[80,-14],"bo":[-105,12],"aon":[55,-14],"bon":[-80,10]},"e":{"a":"sub","b":"endo","k":"tr","t":""},"s":{"a":"sub","b":"sig","k":"tr","t":"","ao":[80,14],"bo":[-105,-12],"aon":[55,14],"bon":[-80,-10]}},"base":{"n":{"sub":"base","prot":"off","endo":"off","sig":"off"},"e":{"p":"off","e":"off","s":"off"}},"st":{"0":{"n":{"endo":"on"},"e":{"e":"on","p":"off"},"t":{"sub":"белок + 1 Ub"},"tn":{"sub":"белок + 1 Ub"},"m":[["Связывание с протеасомой","слабое"],["Типичная функция","эндоцитоз, изменение активности"]],"note":"Одиночный убиквитин слабо связывается с протеасомой; моноубиквитинирование часто служит сигналом эндоцитоза мембранных белков."},"1":{"n":{"prot":"on"},"e":{"p":"on"},"t":{"sub":"белок + цепь K48"},"tn":{"sub":"белок + K48"},"m":[["Связывание с протеасомой","сильное"],["Типичная функция","разрушение в 26S-протеасоме"]],"note":"Цепь K48 из четырёх и более убиквитинов связывают рецепторы 19S-частицы: это классический сигнал протеасомного разрушения."},"2":{"n":{"sig":"on"},"e":{"s":"on"},"t":{"sub":"белок + цепь K63"},"tn":{"sub":"белок + K63"},"m":[["Связывание с протеасомой","обычно слабое"],["Типичная функция","сигнальные комплексы, репарация ДНК"]],"note":"Цепи K63 иной формы; их узнают белки сигнальных путей и репарации, и такие белки обычно не разрушаются."}}}}},{"id":"proteasome-26s","number":10,"section":1,"title":"Как 26S-протеасома узнаёт, разворачивает и расщепляет субстрат","question":2,"questions":[2],"keywords":["26S-протеасома","20S","19S","Rpn10","Rpn13","Rpn1","Rpn11","Rpt","β5","бортезомиб","участок инициации","UCH37"],"lead":["[[T23|26S-протеасома]] состоит из 20S-частицы с протеолитическими центрами внутри и 19S-частиц, которые связывают цепь убиквитина, отщепляют её и за счёт ATP разворачивают белок."],"mechanism":["Рецепторы 19S-частицы (Rpn1, Rpn10, Rpn13) связывают цепь K48, а кольцо ATPаз Rpt захватывает неструктурированный участок субстрата.","Когда белок уже захвачен, металлопротеаза [[T24|Rpn11]] отщепляет цепь целиком, и убиквитин используется снова.","ATPазы разворачивают белок и продвигают его в 20S-частицу, где центры β1, β2 и β5 расщепляют его до коротких пептидов."],"paragraphs":["20S-частица — полый цилиндр из четырёх колец: два внешних α-кольца и два внутренних β-кольца. Протеолитические центры находятся внутри, в β-субъединицах: β1 расщепляет связи после кислых остатков, β2 — после основных, β5 — после гидрофобных. Вход в камеру узкий, и свёрнутый белок пройти в неё не может.","19S-частица решает эту задачу. Её рецепторы Rpn1, Rpn10 и Rpn13 связывают цепь убиквитина. Для начала расщепления нужен ещё неструктурированный участок субстрата: его захватывает кольцо из шести ATPаз Rpt. Модельный белок с цепью убиквитина, но без такого участка, разрушается медленно.","Цепь убиквитина в камеру не попадает: её целиком отщепляет металлопротеаза Rpn11, причём это происходит, когда белок уже захвачен. Деубиквитиназа UCH37, напротив, связана с Rpn13 и может укорачивать цепь до захвата. ATPазы Rpt за счёт гидролиза ATP разворачивают белок и протягивают его в 20S-частицу.","Продукты 26S-протеасомы — пептиды длиной от 3 до 22 остатков; их расщепляют до аминокислот цитоплазматические пептидазы. Ингибиторы [[T29|бортезомиб]] и карфилзомиб связываются прежде всего с центрами β5; в клетках при этом накапливаются полиубиквитинированные белки."],"trap":["Цепь убиквитина разрушается в протеасоме вместе с белком.","Rpn11 отщепляет цепь убиквитина до того, как белок входит в 20S-частицу; убиквитин освобождается и используется снова."],"conditions":"Схема механизма, качественные состояния. Роль неструктурированного участка — Prakash 2004 (реферат; модельные белки с цепью убиквитина, очищенная протеасома). Rpn11 — Verma 2002 (дрожжи) и Yao 2002 (реферат); связь UCH37 с Rpn13 — Qiu 2006 (реферат; клетки человека). Работа ATPаз — крио-ЭМ структуры дрожжевой 26S-протеасомы с субстратом (de la Peña 2018, реферат). Длина пептидов — Kisselev 1999 (реферат; протеасомы из мышц кролика, денатурированные белки).","sources":["Prakash2004","Verma2002","Yao2002","Qiu2006","delaPena2018","Kisselev1999"],"quiz":{"id":"S11-L10","rev":1,"question":"К тесно свёрнутому модельному белку присоединили цепь из четырёх убиквитинов K48, но у него нет неструктурированного участка. Как изменится скорость его расщепления 26S-протеасомой по сравнению с таким же белком, к которому добавлен неструктурированный хвост?","options":[{"id":"S11-L10-1","text":"Будет ниже","correct":true,"feedback":"Цепь убиквитина обеспечивает связывание, но захват и разворачивание начинаются с неструктурированного участка; без него расщепление идёт медленно."},{"id":"S11-L10-2","text":"Будет выше","correct":false,"feedback":"Неструктурированный участок не мешает расщеплению, а нужен для его начала: без него белок разрушается медленнее, а не быстрее."},{"id":"S11-L10-3","text":"Будет такой же","correct":false,"feedback":"Одной цепи недостаточно для эффективного расщепления свёрнутого белка: протеасоме нужен ещё участок инициации."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Этапы работы 26S-протеасомы","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Условие","opts":["цепь K48 и участок инициации","цепь без участка инициации","бортезомиб"]}],"W":560,"H":330,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","rx":"химическое превращение (активация и перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет или он ингибирован"]},"nodes":{"rec":{"p":[120,60,200,50],"n":[170,40,260,46],"t":"связывание цепи:\nRpn1, Rpn10, Rpn13","fs":14},"eng":{"p":[120,160,200,50],"n":[170,120,260,46],"t":"захват участка\nинициации (Rpt)","fs":14},"dub":{"p":[420,60,200,50],"n":[170,200,260,46],"t":"Rpn11 отщепляет цепь","fs":14},"unf":{"p":[420,160,200,50],"n":[170,280,260,46],"t":"разворачивание (ATP)","fs":14},"cat":{"p":[270,270,260,50],"n":[170,370,260,50],"t":"20S: β1, β2, β5 →\nпептиды 3–22 остатка","fs":14,"tn":"20S: β1, β2, β5\n→ пептиды"}},"edges":{"a":{"a":"rec","b":"eng","k":"seq","t":""},"b":{"a":"eng","b":"dub","k":"seq","t":""},"c":{"a":"dub","b":"unf","k":"seq","t":""},"d":{"a":"unf","b":"cat","k":"tr","t":""}},"base":{"n":{"rec":"on","eng":"on","dub":"on","unf":"on","cat":"on"},"e":{"a":"on","b":"on","c":"on","d":"on"}},"st":{"0":{"m":[["Связывание с 19S","есть"],["Расщепление","быстрое"],["Убиквитин","освобождается"]],"note":"Цепь связана рецепторами, ATPазы захватывают неструктурированный участок, Rpn11 отщепляет цепь, белок разворачивается и расщепляется в 20S-частице."},"1":{"n":{"eng":"low","dub":"off","unf":"off","cat":"off"},"e":{"b":"off","c":"off","d":"off"},"m":[["Связывание с 19S","есть"],["Расщепление","медленное"],["Убиквитин","в основном остаётся на белке"]],"note":"Цепь связывается, но ATPазам не за что ухватиться: разворачивание начинается редко, и белок разрушается медленно."},"2":{"n":{"cat":"abs"},"e":{"d":"off"},"m":[["Связывание с 19S","есть"],["Расщепление","почти остановлено"],["Полиубиквитинированные белки","накапливаются"]],"note":"Бортезомиб связывается прежде всего с центрами β5: белки продолжают убиквитинироваться, но почти не расщепляются, и в клетке накапливаются полиубиквитинированные формы."}}}}},{"id":"ups-regulation","number":11,"section":1,"title":"Как сигнал превращается в разрушение регулятора","question":2,"questions":[2],"keywords":["NF-κB","IκBα","TNFα","IKK","неддилирование","NEDD8","MLN4924","куллиновая лигаза","NRF1","бортезомиб","множественная миелома"],"lead":["Разрушение белка-ингибитора — быстрый способ включить ответ без синтеза новых белков. Путь [[T25|NF-κB]] показывает, как сигнал рецептора создаёт дегрон, и как разные препараты останавливают этот путь на разных звеньях."],"mechanism":["TNFα активирует IKK; IKK фосфорилирует IκBα по S32 и S36, и SCF(βTrCP) строит на IκBα цепь K48.","26S-протеасома расщепляет IκBα, и освобождённый NF-κB перемещается в ядро.","Активность куллиновых лигаз, в том числе SCF, требует присоединения NEDD8 к куллину; [[T26|MLN4924]] блокирует этот шаг."],"paragraphs":["В покое NF-κB связан с IκBα и находится в цитоплазме. После связывания TNFα с рецептором активируется киназа IKK. Она фосфорилирует IκBα, лигаза SCF(βTrCP) убиквитинирует его, и 26S-протеасома расщепляет IκBα, ещё связанный с NF-κB. В клетках HeLa IκBα после стимула разрушается за десятки минут; ингибиторы протеаз этот распад предотвращали.","Порядок событий проверяют воздействиями на отдельные звенья. Замены S32A/S36A убирают сайты фосфорилирования. Ингибитор протеасомы не мешает фосфорилированию и убиквитинированию, поэтому накапливается полиубиквитинированный IκBα, а NF-κB не освобождается. MLN4924 ингибирует фермент, активирующий NEDD8: без присоединения NEDD8 к куллину лигаза SCF малоактивна, и в клетках накапливается фосфорилированный IκBα без цепи убиквитина.","Протеасомная система регулирует сама себя. При ингибировании протеасомы транскрипционный фактор NRF1 повышает экспрессию генов субъединиц протеасомы, и клетки частично восстанавливают протеолитическую активность.","В растущих клетках млекопитающих на 26S-протеасому приходится не меньше 80 % внутриклеточного распада белков. Ингибиторы протеасомы — бортезомиб и карфилзомиб — применяют при множественной миеломе: клетки, синтезирующие много иммуноглобулинов, особенно зависят от протеасомы."],"trap":["Фосфорилирование IκBα само отделяет его от NF-κB, и протеасома для активации NF-κB не нужна.","Фосфорилированный и даже убиквитинированный IκBα остаётся связанным с NF-κB; NF-κB освобождается только после расщепления IκBα протеасомой, и ингибиторы протеасомы эту активацию блокируют."],"conditions":"Схема механизма, качественные состояния. Порядок событий — Henkel 1993 (реферат; клетки HeLa и другие линии, разные стимулы), Chen 1995 и Palombella 1994 (рефераты; клеточные линии человека, ингибиторы протеасомы). Накопление фосфорилированного IκBα при MLN4924 — Milhollen 2010 (реферат; клетки B-клеточной лимфомы); механизм MLN4924 — Soucy 2009 (реферат). Восстановление протеасом через NRF1 — Radhakrishnan 2010 (реферат; клетки млекопитающих). Доля протеасомного распада — обзор Collins 2017.","sources":["Henkel1993","Chen1995","Palombella1994","Milhollen2010","Soucy2009","Radhakrishnan2010","Collins2017"],"quiz":{"id":"S11-L11","rev":1,"question":"Клетки 60 мин инкубировали с MLN4924, затем добавили TNFα. Какая форма IκBα накопится через 20 мин?","options":[{"id":"S11-L11-1","text":"Полиубиквитинированный IκBα","correct":false,"feedback":"Цепь убиквитина на IκBα строит куллиновая лигаза SCF, которая без NEDD8 малоактивна; при MLN4924 цепь почти не образуется."},{"id":"S11-L11-2","text":"Фосфорилированный IκBα без цепи убиквитина","correct":true,"feedback":"MLN4924 не действует на IKK: IκBα фосфорилируется, но SCF без NEDD8 почти не убиквитинирует его, и белок не разрушается."},{"id":"S11-L11-3","text":"Никакая: IκBα разрушится, как в контроле","correct":false,"feedback":"Разрушение IκBα требует убиквитинирования куллиновой лигазой, а её активность при MLN4924 подавлена."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Путь от TNFα к освобождению NF-κB и точки действия препаратов","status":"Схема механизма · качественные состояния","ctrls":[{"id":"d","type":"group","label":"Препарат","opts":["нет","MLN4924","бортезомиб"]}],"W":560,"H":340,"NW":340,"NH":520,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","rx":"химическое превращение (активация и перенос убиквитина)","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — действует или усилено","пунктирная рамка — не действует или снижено","× — белка нет или он ингибирован"]},"nodes":{"ikk":{"p":[90,50,130,42],"n":[82,40,130,40],"t":"IKK","fs":16},"pi":{"p":[90,160,150,50],"n":[82,140,140,50],"t":"p-IκBα·NF-κB","fs":14},"scf":{"p":[300,160,140,50],"n":[268,140,130,50],"t":"SCF(βTrCP)","fs":14},"n8":{"p":[300,50,140,42],"n":[268,40,130,40],"t":"NEDD8 на CUL1","fs":13},"ui":{"p":[300,270,180,50],"n":[170,250,230,46],"t":"Ub–IκBα·NF-κB","fs":14},"prot":{"p":[490,200,120,50],"n":[170,340,230,46],"t":"26S","fs":16},"nf":{"p":[490,300,120,50],"n":[170,430,230,46],"t":"NF-κB\nв ядре","fs":14,"tn":"NF-κB в ядре"}},"edges":{"p":{"a":"ikk","b":"pi","k":"phos","t":""},"n":{"a":"n8","b":"scf","k":"act","t":""},"b":{"a":"scf","b":"pi","k":"bind","t":""},"u":{"a":"scf","b":"ui","k":"rx","t":""},"d":{"a":"ui","b":"prot","k":"tr","t":"","ao":[90,-10],"bo":[-60,12]},"f":{"a":"prot","b":"nf","k":"seq","t":""}},"base":{"n":{"ikk":"on","pi":"base","scf":"on","n8":"on","ui":"base","prot":"on","nf":"on"},"e":{"p":"on","n":"on","b":"on","u":"on","d":"on","f":"on"}},"st":{"0":{"m":[["Фосфорилированный IκBα","кратковременно"],["Полиубиквитинированный IκBα","кратковременно"],["IκBα через 20 мин","почти разрушен"],["NF-κB","в ядре"]],"note":"Фосфорилирование, убиквитинирование и расщепление идут друг за другом, и NF-κB освобождается."},"1":{"n":{"n8":"abs","scf":"off","ui":"off","pi":"on","nf":"off"},"e":{"n":"off","u":"off","d":"off","f":"off"},"m":[["Фосфорилированный IκBα","накапливается"],["Полиубиквитинированный IκBα","почти нет"],["IκBα через 20 мин","сохраняется"],["NF-κB","связан с IκBα"]],"note":"Без NEDD8 SCF малоактивна: IκBα фосфорилирован, но цепь убиквитина почти не строится."},"2":{"n":{"prot":"abs","ui":"on","nf":"off"},"e":{"d":"off","f":"off"},"m":[["Фосфорилированный IκBα","есть"],["Полиубиквитинированный IκBα","накапливается"],["IκBα через 20 мин","сохраняется"],["NF-κB","связан с IκBα"]],"note":"Протеасома ингибирована: цепь построена, но IκBα не расщепляется, и NF-κB остаётся в цитоплазме."}}}}},{"id":"ups-measure","number":12,"section":1,"title":"Как измерить скорость распада белка","question":2,"questions":[2],"keywords":["циклогексимид","период полужизни","иммуноблот","ингибитор протеасомы","бафиломицин","замена остатков дегрона","chase"],"lead":["Количество белка на блоте не говорит, быстро ли он разрушается. Скорость распада измеряют, остановив синтез [[T27|циклогексимидом]] и проследив, как убывает белок; путь распада определяют ингибиторами."],"mechanism":["Циклогексимид останавливает трансляцию, после чего содержание белка меняется только за счёт его распада.","Пробы, взятые через равные промежутки, анализируют иммуноблотом и строят кривую убывания; по ней находят [[T28|период полужизни]].","Ингибитор протеасомы или лизосом и замена остатков дегрона показывают, каким путём и по какому сигналу белок разрушается."],"paragraphs":["Стационарное содержание белка определяется соотношением скоростей синтеза и распада, поэтому одна полоса на блоте не различает «много синтезируется» и «медленно разрушается». Чтобы измерить распад, синтез останавливают. Циклогексимид ингибирует элонгацию трансляции на рибосоме, и новые молекулы перестают появляться.","После добавления циклогексимида клетки собирают через равные промежутки, например через 0, 15, 30 и 60 мин, и измеряют содержание белка иммуноблотом. Интенсивности полос, нормированные на контрол
