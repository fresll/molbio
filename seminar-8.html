Доля NADH в матриксе и действие олигомицина и FCCP взяты из модели вопроса 1. Образование супероксида задано нелинейной функцией доли NADH: при повышении этой доли значение функции резко возрастает. Оно умножается на условный множитель протонного потенциала (олигомицин ×1,3, FCCP ×0,4; качественно по Korshunov 1997). Скорость восстановления пероксиредоксина пропорциональна антиоксидантной ёмкости; переокисление растёт с квадратом концентрации H₂O₂ и без сульфиредоксина происходит вдвое легче. Индекс текущей окислительной нагрузки задан нелинейной функцией с резким ростом при повышении содержания H₂O₂ в данный момент; накопление повреждений и их репарация не рассчитываются. PARP1 потребляет NAD⁺ при индексе выше 0,1. Формы SO₂H и SO₃H объединены в один условный показатель переокисления. При реперфузии вклад сукцината и обратного переноса электронов задан одним слагаемым; диметилмалонат уменьшает это слагаемое в 10 раз. Не учтены: отдельный вклад глутатионпероксидаз и каталазы, O₂ как регулируемый параметр, NAMPT, Nrf2 и HIF, разные центры образования супероксида, ферроптоз.", "gn_glc": "Глюкоза", "g_glc": "Основной энергетический субстрат делящейся клетки. Поступает в клетку через переносчики GLUT, фосфорилируется гексокиназой и вступает в гликолиз. Сигнал к делению увеличивает захват глюкозы: у лимфоцитов — через CD28, PI3K и AKT (Frauwirth 2002), на уровне экспрессии генов — через Myc (Wang 2011); активный AKT повышает скорость гликолиза примерно вчетверо, не меняя потребления O₂ (Elstrom 2004). При гипоксии HIF-1 активирует транскрипцию гена GLUT1 (в фибробластах Rat1: Chen 2001). На рисунке — β-D-глюкоза (пираноза).", "gn_glyc": "Гликолиз", "g_glyc": "Десять реакций в цитоплазме: из одной молекулы глюкозы образуются 2 молекулы пирувата, 2 молекулы NADH и 2 молекулы ATP (чистый выход). В модели на каждый пируват приходится 1 NADH и 1 ATP. Одна из реакций — реакция GAPDH — требует NAD⁺. На схеме гликолиз изображён одним блоком. В модели не учтены: регуляция гексокиназой, PFK1 и PKM2; сигналы Myc, AKT и mTORC1 (сведены к ползунку «Сигнал к делению»); пентозофосфатный путь и синтез серина (на схеме — серые заглушки; их описывает справочная карточка, в расчёт они не входят, а NADPH пентозофосфатного пути рассматривается в вопросе 4); лактат как сигнальная молекула.", "gn_gapdh": "GAPDH (глицеральдегид-3-фосфатдегидрогеназа)", "g_gapdh": "Фермент гликолиза: окисляет глицеральдегид-3-фосфат и восстанавливает NAD⁺ до NADH. NAD⁺ служит субстратом реакции, поэтому скорость гликолиза зависит от того, окисляется ли NADH цитоплазмы. На схеме рамка становится пунктирной, когда NAD⁺ в цитоплазме почти не осталось и реакция, катализируемая GAPDH, заметно замедляется.", "gn_pyr": "Пируват", "g_pyr": "Конечный продукт гликолиза. Пируват из цитоплазмы может поступить в митохондрии, превратиться в лактат под действием ЛДГ или выйти из клетки; в модели наружу выходит лишь небольшая доля. В митохондриях PDH превращает пируват в ацетил-CoA, который поступает в цикл трикарбоновых кислот (вкладка 2), а ПК — в ОАА. Пируват, добавленный в среду (в опытах 1 мМ, Birsoy 2015), входит в клетку и служит акцептором электронов: ЛДГ восстанавливает его до лактата и окисляет NADH цитоплазмы. Допущение модели: пируват в среде задаёт нижний предел доступности аспартата (70 % шкалы). На рисунке — анион пирувата.", "gn_ldh": "ЛДГ (лактатдегидрогеназа)", "g_ldh": "Фермент цитоплазмы: пируват + NADH + H⁺ ⇄ лактат + NAD⁺. Группа C=O пирувата превращается в группу CH–OH лактата; NADH отдаёт гидрид-ион и переходит в NAD⁺. На рисунке показана рабочая часть NAD(H) — никотинамидное кольцо; остаток R не изображён. В клетках H-Ras 3T3 при высоком потоке гликолиза ЛДГ окисляет около 89 % NADH цитоплазмы; в других линиях соотношение иное: доля челноков составляет 11–42 % в 3T3, DITNC1 и BT549 и около 75 % в PC3 (Wang 2022). Упрощения модели: реакция близка к равновесию, поэтому отношение лактат/пируват отражает долю NADH в цитоплазме (Williamson 1967), а в клетках Neuro-2a и C6 в среде с глюкозой это равновесие, по-видимому, не достигается (Hung 2011); вход пирувата в митохондрии имеет приоритет перед ЛДГ, поэтому в мысленном опыте при положении «максимум» ползунка дихлорацетата выход лактата равен нулю. Чтобы прекратить секрецию лактата, недостаточно инактивировать одну изоформу: потребовалось инактивировать обе изоформы — LDHA и LDHB (Ždralević 2018).", "gn_lac": "Лактат", "g_lac": "Продукт ЛДГ; выходит из клетки вместе с протоном через монокарбоксилатные переносчики (MCT). Лактат используется как метаболический субстрат: у мышей натощак оборот лактата в крови выше оборота глюкозы (Hui 2017); в немелкоклеточном раке лёгкого человека лактат служит источником углерода для ЦТК, особенно в опухолях с высоким поглощением ФДГ (Faubert 2017). На рисунке — L-лактат (анион).", "gn_nad": "NAD⁺ и NADH", "g_nad": "Переносчик электронов. NAD⁺ принимает два электрона и протон (в виде гидрид-иона) и становится NADH; NADH отдаёт электроны и снова становится NAD⁺. Полоса на схеме показывает долю NADH в пуле: тёмная часть — NADH, светлая — NAD⁺. Шкала условная, от 0 до 1, это не измеренное отношение. Отношение свободных NAD⁺/NADH в цитоплазме клеток печени крысы после кормления составляет около 725, в митохондриях около 8 (Williamson 1967); в клетках Neuro-2a и C6 в среде с глюкозой сенсор Peredox даёт для цитоплазмы около 70–130 (Hung 2011). Набор для суммарного NAD⁺/NADH даёт другие числа, потому что NADH прочно связан с белками. Пулы цитоплазмы и матрикса разделены мембраной, и их изменения не обязательно совпадают; электроны между ними переносят челноки. Формулы на рисунке упрощены: у NAD⁺ и NADH фосфатные группы показаны без зарядов, а малые молекулы (пируват, лактат, оксамат, дихлорацетат) — в виде анионов.", "gn_shuttle": "Челноки NADH (малат-аспартатный и глицерофосфатный)", "g_shuttle": "NADH цитоплазмы не проходит через внутреннюю мембрану митохондрии; челноки переносят его восстановительные эквиваленты. Малат-аспартатный челнок (MDH1, GOT1 в цитоплазме; MDH2, GOT2 в матриксе) восстанавливает NAD⁺ матрикса до NADH, и эти электроны поступают в комплекс I. Глицерофосфатный челнок (GPD1, GPD2) передаёт электроны через FAD фермента GPD2 непосредственно убихинону, минуя комплекс I. Пропускная способность челноков ограничена: в делящихся клетках при высоком потоке гликолиза поток через челноки достигает плато (выше примерно 60 % неингибированного потока гликолиза), а поток через ЛДГ продолжает расти (Wang 2022). Упрощение модели: оба челнока показаны одним звеном, которое замедляется при высокой доле NADH в матриксе; обход комплекса I через GPD2 отдельно не рассчитывается. Восстановительные эквиваленты из цитоплазмы дают P/O примерно на 0,25 ниже, чем NADH матрикса (Hinkle 2005); в модели это не учтено.", "gn_pdh": "PDH (пируватдегидрогеназный комплекс)", "g_pdh": "Комплекс матрикса: превращает пируват в ацетил-CoA, выделяет CO₂ и восстанавливает NAD⁺ до NADH. Фосфорилирование субъединицы E1α киназами PDK инактивирует комплекс. Вход пирувата в матрикс (переносчик MPC) и PDH в модели объединены одним звеном; дальнейший путь ацетил-CoA (ЦТК) на схеме не показан. При гипоксии HIF-1 через PDK1 уменьшает поток через PDH (Kim 2006; Papandreou 2006). В модели реакция PDH замедляется также при высокой доле NADH в матриксе.", "gn_pdk": "PDK (пируватдегидрогеназные киназы)", "g_pdk": "Четыре изоформы (PDK1–4) фосфорилируют E1α и инактивируют PDH. HIF-1 повышает уровень PDK1 (Kim 2006). Дихлорацетат тормозит все изоформы, сильнее всего PDK2: кажущаяся Ki около 0,2 мМ, а для PDK3 около 8 мМ (Bowker-Kinley 1998). В опыте Luengo 2021 использовали AZD7545 — ингибитор PDK1–3. На схеме рамка становится пунктирной, когда PDK заторможена препаратом.", "gn_cI": "Комплекс I (NADH-дегидрогеназа)", "g_cI": "Первый комплекс дыхательной цепи: окисляет NADH матрикса, передаёт электроны убихинону и перекачивает протоны. Его блокируют пиерицидин и ротенон, тормозят метформин и фенформин. При подавлении комплекса I доля NADH матрикса растёт, и синтез аспартата снижается, поскольку для него требуется NAD⁺ (Birsoy 2015; Sullivan 2015). Электроны могут поступать к убихинону и другими путями: от сукцината через комплекс II или через GPD2. Упрощение модели: пиерицидин снижает суммарную ёмкость цепи до 8 %; вклад остаточной активности комплекса I и обходных путей отдельно не рассчитывается.", "gn_c34": "Комплексы III и IV", "g_c34": "Комплексы III и IV передают электроны от убихинона на цитохром c и затем на кислород: комплекс IV восстанавливает O₂ до воды. Вместе с комплексом I они создают протонный градиент. Скорость цепи ограничена тем, как быстро протоны возвращаются в матрикс через ATP-синтазу, утечку или разобщитель (Luengo 2021). При низком O₂ дыхание снижается и самим дефицитом кислорода, и активным ответом HIF-1 через PDK1: при 0,5 % O₂ за 24 ч оно снижается примерно вдвое (Papandreou 2006, фибробласты). В модели оба эффекта объединены одной учебной шкалой кислорода, а время не рассчитывается: показано установившееся состояние.", "gn_atps": "ATP-синтаза (комплекс V)", "g_atps": "ATP-синтаза использует протонный градиент для синтеза ATP из ADP и фосфата; градиент создаёт дыхательная цепь. Когда клетка гидролизует ATP, образующийся ADP поддерживает синтез ATP, и при сохранённом сопряжении дыхание ускоряется. Олигомицин блокирует ATP-синтазу; утечка протонов позволяет части дыхания сохраняться без синтеза ATP. Дыхание, связанное с утечкой протонов, измеряют как остаточное потребление O₂ после добавления олигомицина; его доля зависит от клеток (Brand 2011). В модели она принята равной примерно четверти дыхания делящейся клетки. Окисление одного NADH в сопряжённой системе сопровождается синтезом примерно 2,5 ATP (Hinkle 2005); обновлённая оценка для пирувата с малатом — 2,73 (Mookerjee 2017). Упрощение модели: «Условный индекс ATP» и порог, ниже которого ATP ограничивает деление (около 15 % шкалы), заданы условно; это не экспериментальные проценты энергетического обеспечения. Ускорение гликолиза при нехватке ATP ограничено (не более чем в 1,6 раза).", "gn_asp": "Аспартат", "g_asp": "Аминокислота, используемая для синтеза нуклеотидов и белков. При подавлении дыхания её синтез может ограничиваться редокс-состоянием (Sullivan 2015; Birsoy 2015). В матриксе ОАА для синтеза аспартата образует малатдегидрогеназа, которой необходим NAD⁺. Другой путь — в цитоплазме: ЛДГ восстанавливает добавленный пируват до лактата и окисляет NADH; регенерированный NAD⁺ позволяет MDH1 окислять малат до ОАА, а GOT1 переносит на ОАА аминогруппу глутамата и образует аспартат (Birsoy 2015). LbNOX в цитоплазме регенерирует NAD⁺ без ЛДГ и действует через тот же путь. Добавленный аспартат поступает извне и поддерживает деление без восстановления дыхания; клетки Jurkat слабо захватывали его из среды (нет переносчика SLC1A3), поэтому понадобилось 10 мМ (Birsoy 2015). Упрощение модели: «Доступность аспартата» — условный индекс. Матриксный вклад зависит от доли NAD⁺ в матриксе и от входа пирувата в митохондрии (как источника углерода); цитоплазматический вклад учитывается, когда есть пируват в среде или LbNOX, и зависит от доли NADH в цитоплазме (вклад полный при доле ниже 0,26 и отсутствует выше 0,32; предел 70 % шкалы). Аспартат в среде задаёт нижний предел индекса 60 %. В вопросе 2 аспартат образуется из ОАА (GOT2) и выходит из митохондрий в обмен на глутамат (Palmieri 2001); индекс там дополнительно зависит от содержания малата/ОАА. На рисунке — L-аспартат в форме при pH 7 (заряд 1−).", "gn_lbnox": "LbNOX", "g_lbnox": "Водообразующая NADH-оксидаза бактерии Lactobacillus brevis: окисляет NADH до NAD⁺ кислородом, превращая O₂ в воду (H₂O₂ — 1–2 % продукта). В цитоплазме она возвращала клеткам HeLa способность делиться при блокаде дыхательной цепи (в среде присутствовал уридин, пируват отсутствовал), но потребление глюкозы и выход лактата не менялись (Titov 2016). В опытах Luengo 2021 на клетках 143B LbNOX не снижала выход лактата в среду, а повышала выход пирувата. Упрощения модели: показана только цитоплазматическая LbNOX (существует и митохондриальная), а потребляемый ею O₂ в рассчитанном потреблении кислорода не учтён (в HeLa экспрессия LbNOX повышала потребление O₂ в 1,6 раза: Titov 2016).", "gn_oligo": "Олигомицин", "g_oligo": "Блокирует протонный канал ATP-синтазы (F₀). Без возврата протонов через синтазу дыхательная цепь переносит электроны со скоростью, определяемой утечкой протонов. В опыте Luengo 2021 низкая доза (1 нМ) не устраняла дефект, вызванный ингибитором PDK, а усиливала его. Остаточное дыхание после добавления олигомицина отражает утечку протонов; её доля зависит от клеток (Brand 2011), в модели она принята равной примерно четверти дыхания делящейся клетки. Упрощение: в модели олигомицин полностью блокирует синтазу, а в работе Luengo использовали низкую дозу.", "gn_fccp": "FCCP", "g_fccp": "Протонофор (разобщитель): переносит протоны через внутреннюю мембрану в обход ATP-синтазы. Электроны по цепи переносятся быстрее, но ATP на каждый электрон образуется меньше. На экране — малая доза: дозу FCCP подбирают для каждой линии клеток (Brand 2011). У FCCP есть побочное действие на гликолиз: в опытах Mookerjee 2016 (клетки C2C12 и HEK293 с заблокированным дыханием, FCCP 1 мкМ) он, по-видимому, снижал pH цитоплазмы и частично тормозил гликолиз. В модели базовый поток глюкозы при FCCP снижен на 15 %, но из-за нехватки ATP гликолиз ускоряется, и на полосе поглощение глюкозы немного выше, чем в контроле. В опыте Luengo 2021 500 нМ FCCP восстанавливали отношение NAD⁺/NADH, содержание аспартата и деление клеток с активированной PDH; в активированных T-клетках мыши FCCP снижал выход лактата без изменения деления. Упрощение: ёмкости PDH и челноков в модели заданы числами, поэтому FCCP ускоряет дыхание, но почти не снижает выход лактата; эффект на деление виден при включённом дихлорацетате (при расходе ATP до 25 %). На рисунке — карбонилцианид-п-трифторметоксифенилгидразон.", "gn_pier": "Пиерицидин", "g_pier": "Ингибитор комплекса I: действует в месте присоединения убихинона. Использован вместо ротенона: в опытах Gattermann 2004 (первичные кератиноциты человека и клетки 143B) ротенон и антимицин A сильно снижали синтез пиримидинов; авторы связывают это с DHODH (конкуренция с убихиноном), но отмечают, что блокада комплекса I объясняет эффект ротенона не полностью. Пиерицидин использовали в работах Titov 2016 и Birsoy 2015 (0,5 мкМ). В модели уридин всегда присутствует в среде, поэтому синтез пиримидинов не ограничивает деление.", "gn_oxa": "Оксамат", "g_oxa": "Аналог пирувата, конкурентный ингибитор ЛДГ. Действует в миллимолярных концентрациях: 25 мМ снижали активность ЛДГ на 30–40 %, 50 мМ — на 51–57 % в клетках глиомы за 24 ч (Seliger 2013). Поэтому в модели сохраняется около 45 % активности ЛДГ; при таких концентрациях возможны побочные эффекты. В опытах Seliger пролиферация при действии оксамата снижалась, тогда как в модели деление почти не меняется — это упрощение. Клетки с преобладанием окислительного фосфорилирования менее чувствительны к ингибитору ЛДГ GNE-140 (Boudreau 2016). На рисунке — анион оксамата.", "gn_dca": "Дихлорацетат", "g_dca": "Тормозит PDK, поэтому активность PDH повышается (см. карточку PDK). В культуре его применяют начиная с 0,5 мМ (Bonnet 2007), а пиковая концентрация в плазме человека составляет около 0,15 мМ (Koltai 2024). У дихлорацетата есть и другие эффекты: он подавляет липогенез и синтез холестерина и инактивирует GSTZ1, замедляя собственный распад; при длительном приёме возможна обратимая периферическая нейропатия (Koltai 2024). В фазе III при недостаточности PDC у 34 детей первичная конечная точка не достигнута (P = 0,512); при более длительном лечении, включая открытое продление, сообщают о снижении лактата примерно на 20 % и о лучшем исходе (Stacpoole 2026). Положение «максимум» на экране — мысленный эксперимент, а не действие определённой дозы препарата. На рисунке — анион дихлорацетата.", "gn_measure": "Как это измеряют", "g_measure": "Дыхание измеряют по потреблению O₂ (OCR), гликолиз — по подкислению среды (ECAR) и по содержанию лактата в среде. Подкисление обусловлено не только гликолизом: CO₂ дыхания тоже закисляет среду, поэтому ECAR без поправки может завышать оценку скорости гликолиза (вклад CO₂ в разных клетках от 3 до 100 %, Mookerjee 2015); вклад гликолиза и дыхания в образование ATP оценивают по OCR и ECAR совместно (Mookerjee 2017). Применение олигомицина, FCCP и блокаторов цепи позволяет отдельно оценить дыхание, связанное с синтезом ATP, дыхание за счёт утечки протонов и максимальную скорость дыхания (Brand 2011). Судьбу глюкозы прослеживают по меченому углероду (¹³C), определяя, сколько его переходит в лактат и сколько — в ЦТК (Hui 2017; Bartman 2023). Отношение свободных NAD⁺/NADH в цитоплазме измеряют генетически кодируемыми сенсорами Peredox и SoNar (Hung 2011; Zhao 2015); набор для суммарного NAD⁺/NADH даёт другие числа. Содержание NAD⁺ в цитоплазме повышает LbNOX (Titov 2016).", "gn_model": "Что упрощено в модели", "g_model": "Все величины относительные («учебная модель»), время не рассчитывается: показано установившееся состояние. Не учтены: регуляция гликолиза с участием гексокиназы, PFK1 и PKM2; сигналы Myc, AKT и mTORC1 (сведены к ползунку «Сигнал к делению»); пентозофосфатный путь и синтез серина; лактат как сигнальная молекула. Заданы числами, а не рассчитаны: ёмкости PDH и челноков; приоритет входа пирувата в митохондрии перед ЛДГ; нижние пределы доступности аспартата при пирувате (70 %) и аспартате (60 %) в среде; вклад входа пирувата в митохондрии в доступность аспартата (как источника углерода); предел ускорения гликолиза при нехватке ATP (в 1,6 раза). Снижение деления от ступени «доза» дихлорацетата показано при 21 % O₂ и сигнале 80 %: оно видно при расходе ATP до 25 % (82 → 78 %). При расходе выше 40 % потребление O₂ в контроле уже около 99 %, доля NADH в матриксе мала, и при дозе доступность аспартата остаётся не ниже 70 % шкалы, поэтому деление не меняется. Ступень «максимум» снижает деление при любом расходе ATP. При очень низком O₂ результат другой (см. карточку «Аспартат»). Деление в модели ограничивают доступность аспартата, поток глюкозы, ATP (только ниже примерно 15 % шкалы) и очень высокая доля NADH в цитоплазме (выше 0,5). Опорное делящееся состояние на продвинутом уровне — сигнал к делению 80 %: деление при этом около 80 % шкалы, а 100 % — предел шкалы.", "gn_accoa": "Ацетил-CoA", "g_accoa": "Ацетил-CoA содержит ацетильную группу, связанную с коферментом A. В матриксе PDH образует ацетил-CoA из пирувата (вопрос 1), а цитратсинтаза переносит его ацетильную группу на ОАА с образованием цитрата. В сумме цикл окисляет ацетильную группу до двух молекул CO₂ и не увеличивает количество промежуточных продуктов: само по себе поступление ацетил-CoA не повышает их содержание (Owen 2002; Arnold 2023). Толщина стрелки — поступление ацетил-CoA (PDH и небольшой постоянный приток из прочих источников). Упрощение: PDH из вопроса 1 в этой модели не ингибируется избытком ацетил-CoA, тогда как в клетке ингибируется; поток PDH не зависит от потери SDH и подавления ПК (у Cardaci 2015 при потере SDH вход углерода глюкозы через PDH снижен). На рисунке — рабочая часть молекулы: ацетильная группа на сере, остальная часть кофермента A обозначена «CoA». Упрощение модели: поступление ацетил-CoA и его расход цитратсинтазой вычисляются раздельно, баланс этого вещества не замкнут; две стрелки нельзя трактовать как точный учёт молекул.", "gn_carr": "Переносчики электронов: NADH и FADH₂", "g_carr": "За один оборот цикл образует три NADH (IDH, α-КГДГ, малатдегидрогеназа), один FADH₂ (SDH) и одну молекулу GTP или ATP; электроны этих переносчиков поступают в дыхательную цепь (Arnold 2023). Сам цикл O₂ не потребляет. Полосы и частицы показывают скорость образования восстановленных переносчиков относительно эталона (вертикальная черта), а не их содержание. Долю NADH в пуле отражает схема вопроса 1. Количество ATP, которое может образоваться при окислении переносчиков, в модели не рассчитывается: оценки зависят от отношения P/O. Hinkle 2005 даёт 2,5 для NADH и 1,5 для FADH₂; при других допущениях получают 2,3 и 1,4 или 2,73 и 1,64 (Hinkle 2005; Mookerjee 2017). FADH₂ — условное название: восстановленный FAD остаётся связанным с SDH и передаёт электроны убихинону. При блокаде комплекса I (пиерицидин) NADH матрикса окисляется медленнее, и окислительный путь замедляется. Метформин и фенформин в культуре тоже тормозят комплекс I, снижают отношение NAD⁺/NADH и содержание аспартата, но в концентрациях выше плазменных (Wheaton 2014; Gui 2016); отдельного ползунка для метформина в модели нет.", "gn_cit": "Цитрат", "g_cit": "Первый продукт цикла: ацетил-CoA + ОАА → цитрат (цитратсинтаза). Часть цитрата выходит из митохондрий в обмен на малат (переносчик SLC25A1); в цитоплазме ACLY расщепляет его на ацетил-CoA и ОАА. Ацетил-CoA используется для синтеза жирных кислот и ацетилирования белков (Arnold 2023; Hatzivassiliou 2005). Часть ацетил-CoA для липидов обеспечивает также ацетат; доли источников зависят от клеток и условий и на схеме не показаны. Узел показывает содержание цитрата в долях эталона (вертикальная черта — эталон). Упрощение: пулы митохондрий и цитоплазмы не разделены; половина ОАА из экспортированного цитрата возвращается в цикл (условно).", "gn_akg": "α-Кетоглутарат (α-КГ)", "g_akg": "α-Кетоглутарат принимает аминогруппу от аминокислоты в реакции трансаминирования и превращается в глутамат. Глутамат, в свою очередь, передаёт аминогруппу другой кетокислоте: например, GOT2 переносит её на ОАА с образованием аспартата. Глутаминаза (GLS) образует глутамат из глутамина, а глутаматдегидрогеназа или трансаминазы — α-КГ из глутамата.", "gn_suc": "Сукцинат", "g_suc": "Образуется из сукцинил-CoA; SDH превращает его в фумарат. При потере SDH сукцинат накапливается: в клетках почечного эпителия мыши с потерей Sdhb его содержание было примерно в 200 раз выше, чем в контроле (Cardaci 2015). В модели при 2 мМ глутамина — около ×29 (число условное и зависит от условий; значение превышает шкалу полосы, точное число написано в узле). Сукцинил-CoA служит также исходным веществом синтеза гема. Из-за симметрии сукцината в популяции его молекул метка ¹³C одинаково часто располагается у одного и другого конца молекулы; в модели ¹³C это учтено.", "gn_mal": "Малат и ОАА (оксалоацетат)", "g_mal": "На базовой схеме один условный узел объединяет фумарат, малат и оксалоацетат (ОАА). ПК синтезирует ОАА из пирувата. Цитратсинтаза использует ОАА вместе с ацетил-CoA; GOT2 переносит аминогруппу глутамата на ОАА с образованием аспартата. При высокой доле NADH в матриксе равновесие малатдегидрогеназы сдвигается в сторону малата, поэтому увеличение значения объединённого узла не означает повышения содержания ОАА.", "gn_gln": "Глутамин", "g_gln": "Аминокислота среды: источник азота и углерода. В клетке глутаминаза (GLS) превращает её в глутамат, из которого образуется α-КГ. В клетках глиобластомы SF188 (перфузия в ЯМР-спектрометре) глутамин был основным источником ОАА для цикла: около 90 % молекул ОАА несли метку из глутамина, а ПК почти не участвовала; около половины аминогрупп выходило из клетки как аммиак и аланин (DeBerardinis 2007). Зависимость клеток от глутамина определяется составом среды (например, наличием цистина и транспортёра xCT) и объектом исследования — организмом, культурой клеток или опухолью (Muir 2017; Davidson 2016). На экране — ползунок «Глутамин в среде» (0–4 мМ, эталон 2 мМ); поток через GLS в модели насыщается с ростом концентрации (условное Km 0,5 мМ). Рисунок — L-глутамин.", "gn_glu": "Глутамат", "g_glu": "Продукт глутаминазы. Из глутамата образуется α-КГ (трансаминированием или глутаматдегидрогеназой); при трансаминировании аминогруппа глутамата переходит в другие аминокислоты, а сам глутамат включается в состав глутатиона (Hosios 2016; Pavlova 2016). Значительная часть азота глутамина покидает клетку как аланин и аммиак (DeBerardinis 2007). На схеме стрелка «глутамат» — отток α-КГ на синтез. Рисунок — L-глутамат (анион).", "gn_gls": "GLS (глутаминаза)", "g_gls": "Фермент матрикса: глутамин → глутамат + NH₃; через этот путь пополняется α-КГ (анаплероз); изоформа GAC находится в митохондриях (Cassago 2012). Аллостерические ингибиторы BPTES и CB-839 связываются на стыке субъединиц, вдали от активного центра (KGA: Thangavelu 2012; GAC: DeLaBarre 2011); CB-839 действует на обе формы (Gross 2014). В модели приток через GLS насыщается с ростом концентрации глутамина, а его ёмкость не регулируется. В клетках после почти полного подавления GLS поступление углерода глутамина в малат и цитрат менялось умеренно, потому что глутамат образуют и другие ферменты (Cheng 2011); остаточная активность 10 % в модели — условное число.", "gn_pc": "ПК (пируваткарбоксилаза)", "g_pc": "Фермент матрикса: пируват + HCO₃⁻ + ATP → ОАА + ADP + Pᵢ (кофермент — биотин). Это второй приток цикла (анаплероз). Ацетил-CoA — положительный аллостерический регулятор ПК (Owen 2002; Jitrapakdee 2008). В печени и почках ПК участвует и в глюконеогенезе. Вклад ПК в цикл в культуре зависит от линии и среды: в клетках глиобластомы SF-xL, приспособленных к низкой концентрации глутамина, подавление ПК в присутствии глутамина рост не меняло, а без глутамина резко ограничивало; в линии рака печени Huh-7 (высокая активность ПК) подавление ПК ухудшало рост и при глутамине (Cheng 2011). В клетках, исследованных в работе Cheng 2011, поток через ПК подавляли и глутамин, и α-КГ. В модели поток через ПК ограничен (не выше шести эталонных значений) и растёт, когда содержание малата/ОАА мало: это условная обратная связь. Подавление ПК задано множителем 0,10 в формуле притока; это не означает, что поток в новом состоянии равен 10 % эталона.", "gn_red": "Восстановительное карбоксилирование", "g_red": "Восстановительное карбоксилирование потребляет NADPH: α-КГ + CO₂ + NADPH → изоцитрат + NADP⁺ (IDH1 в цитоплазме, IDH2 в митохондриях), далее изоцитрат превращается в цитрат. В клетках с митохондриальными дефектами, изученных Mullen 2014, окисление другой части α-КГ поддерживало образование восстановительных эквивалентов, а NNT обеспечивала образование NADPH за счёт NADH. Окислительная и восстановительная ветви используют разные молекулы α-КГ. Это результат для конкретных клеточных моделей, а не общее требование реакции.", "gn_me": "Малатный фермент", "g_me": "NADP⁺-зависимые малатные ферменты превращают малат в пируват и CO₂ с образованием NADPH. У человека ME1 и ME3 используют NADP⁺, ME2 — NAD⁺ или NADP⁺. На схеме показан суммарный поток превращения малата в пируват без расчёта изоформ; в модели он зависит от содержания метаболитов в пуле малат/ОАА. В опытах на клетках SF188 лактат и аланин из глутамина в сумме соответствовали примерно 60 % потребления глутамина; нижняя оценка потока малатного фермента — 12 мкмоль на 10⁹ клеток в час (DeBerardinis 2007).", "gn_heme": "Гем и прочий выход сукцината", "g_heme": "Первая реакция синтеза гема: сукцинил-CoA + глицин → δ-аминолевулинат + CoA + CO₂; её катализирует ALAS в митохондриях. ALAS1 присутствует во всех клетках, ALAS2 — в эритроидных; в печени ALAS1 ограничивает синтез гема (Ajioka 2006; Peoc'h 2019). Синтез гема начинается с сукцинил-CoA, а не с сукцината. Упрощение модели: сукцинил-CoA и сукцинат объединены в один узел; выход «условный сток» из него — математическое допущение, без которого при потере SDH не было бы установившегося состояния. Его нельзя трактовать как скорость синтеза гема.", "gn_glsi": "Ингибитор GLS (BPTES, CB-839)", "g_glsi": "Аллостерические ингибиторы: связываются на стыке субъединиц глутаминазы, примерно в 18 Å от активного центра (Thangavelu 2012; DeLaBarre 2011). В модели остаётся 10 % активности GLS (условно). CB-839 (телагленастат) в клинике: в испытании CANTATA (с кабозантинибом, почечно-клеточный рак) первичная конечная точка не достигнута (медиана выживаемости без прогрессирования 9,2 и 9,3 мес., отношение рисков 0,94; Tannir 2022); в ENTRATA (с эверолимусом, 69 пациентов после двух и более линий лечения) медиана выживаемости без прогрессирования составила 3,8 мес. против 1,9 мес. с плацебо (отношение рисков 0,64; 95 % ДИ 0,34–1,20); первичная конечная точка достигнута при заранее заданном одностороннем уровне значимости 0,2 (Lee 2022). Дозы на экране не показаны.", "gn_sdhl": "Потеря SDH (сукцинатдегидрогеназы)", "g_sdhl": "SDH превращает сукцинат в фумарат и одновременно входит в дыхательную цепь (комплекс II). При потере SDH цикл прерван на сукцинате: сукцинат накапливается, а ОАА и аспартат образуются в основном за счёт ПК. В клетках почечного эпителия мыши с потерей Sdhb дыхание было почти полностью утрачено, нокдаун ПК снижал пролиферацию, а аспартат её восстанавливал (Cardaci 2015); в хромаффинных клонах подавление ПК с помощью siRNA резко снижало пролиферацию (Lussey-Lepoutre 2015). Метка ¹³C-глутамина в обеих работах выявляла и восстановительное карбоксилирование, но оно обеспечивало меньшую часть аспартата (у Cardaci 2015 — менее 20 %) и не возмещало дефицит. Упрощение модели: при потере SDH восстановительное карбоксилирование появляется только вместе с пиерицидином; компенсаторные перестройки не учтены.", "gn_pckd": "Подавление ПК (нокдаун)", "g_pckd": "Снижение содержания ПК (siRNA, shRNA). В модели остаётся 10 % активности ПК (условно). В клетках глиобластомы SF-xL, приспособленных к низкой концентрации глутамина, подавление ПК в присутствии глутамина не влияло на рост, а в отсутствие глутамина резко ограничивало его; в линии рака печени Huh-7 оно ухудшало рост даже при глутамине (Cheng 2011). Результат зависит от линии клеток и среды.", "gn_cs": "ЦС (цитратсинтаза)", "g_cs": "Цитратсинтаза присоединяет ацетильную группу ацетил-CoA к ОАА: ацетил-CoA + ОАА → цитрат. Поток зависит и от ацетил-CoA, и от ОАА: когда малата/ОАА мало, поток через цитратсинтазу ниже, хотя ацетил-CoA поступает, как в эталоне. Цитратсинтазу относят к регулируемым ферментам (NADH, сукцинил-CoA; Arnold 2023); в модели поток через неё задан содержанием малата/ОАА.", "gn_idh": "IDH (изоцитратдегидрогеназа)", "g_idh": "NAD⁺-зависимая IDH3 окисляет изоцитрат до α-КГ, выделяет CO₂ и образует NADH. На схеме аконитаза и IDH объединены в одну стрелку «цитрат → α-КГ». Ca²⁺ в матриксе повышает активность IDH3, а NADH и высокое отношение ATP/ADP её снижают (Denton 2009; Arnold 2023). NADP⁺-зависимые IDH1 и IDH2 катализируют реакцию в обе стороны; обратное направление — восстановительное карбоксилирование (см. карточку «Восстановительное карбоксилирование»).", "gn_kgdh": "α-КГДГ (α-кетоглутаратдегидрогеназа)", "g_kgdh": "Комплекс матрикса: α-КГ → сукцинил-CoA + CO₂, образует NADH. Ca²⁺ в матриксе повышает активность комплекса, а NADH и сукцинил-CoA её снижают (Denton 2009; Arnold 2023). На схеме стрелка «α-КГ → сукцинат» объединяет эту реакцию с сукцинил-CoA-синтетазой, реакция которой сопровождается образованием GTP или ATP.", "gn_sdh": "SDH (сукцинатдегидрогеназа)", "g_sdh": "Превращает сукцинат в фумарат и восстанавливает флавин до FADH₂; одновременно это комплекс II дыхательной цепи: электроны поступают на убихинон. На схеме поток через SDH отражает скорость переноса электронов от сукцината к убихинону. О потере SDH — карточка «Потеря SDH».", "gn_cata": "Катаплероз и анаплероз", "g_cata": "Анаплероз — пополнение промежуточных продуктов цикла, катаплероз — их отток на синтез (термин «анаплероз» ввёл Х. Корнберг; Owen 2002). При неизменном пуле промежуточных соединений цикла приток углеродного скелета (анаплероз) уравновешен оттоком (катаплероз); ацетильные атомы углерода выходят из цикла в виде CO₂ (Owen 2002). На схеме притоки: глутамин → глутамат → α-КГ (GLS) и пируват → ОАА (ПК); оттоки: цитрат → цитоплазма (SLC25A1), затем ACLY, α-КГ → глутамат, ОАА → аспартат (GOT2), сукцинил-CoA → гем (ALAS). Оксалоацетат выводится из цикла также через PEPCK (оксалоацетат → фосфоенолпируват); на схеме этот отток показан серой стрелкой и в расчёт не входит. Отток без пополнения уменьшил бы пул; размер пула и происхождение углерода — это разные характеристики: метка ¹³C показывает происхождение, а содержание метаболитов задаётся балансом притока и оттока. История: в опытах Кребса и Джонсона на измельчённой грудной мышце голубя малая добавка цитрата увеличивала поглощение O₂ примерно втрое сильнее, чем требовалось для полного окисления самого цитрата, а в балансе цитрат не убывал; из серии опытов следовал цикл, где промежуточные метаболиты действуют как катализаторы окисления (Krebs 1937). Регуляция: Ca²⁺ в матриксе повышает активность PDH, IDH и α-КГДГ, а NADH и высокое отношение ATP/ADP её снижают; сукцинил-CoA тормозит α-КГДГ (Denton 2009; Arnold 2023).", "gn_measure2": "Как измеряют (вопрос 2)", "g_measure2": "Содержание промежуточных метаболитов измеряют в экстрактах клеток масс-спектрометрией; на экране они даны в долях эталона. Чтобы установить происхождение углерода, в среду добавляют субстрат с ¹³C ([U-¹³C]глюкозу или [U-¹³C]глутамин) и находят доли изотопологов: M+n обозначает молекулы с n атомами ¹³C. Показано установившееся мечение: доля меченых молекул промежуточных продуктов гликолиза достигает плато за минуты, а промежуточных метаболитов цикла — за часы (Jang 2018); аминокислоты, обменивающиеся со средой, могут не выйти на плато (Buescher 2015). ¹³C-глюкоза: PDH даёт цитрат M+2, ПК даёт ОАА, малат и аспартат M+3 (и цитрат M+3; с меченым ацетил-CoA — M+5). ¹³C-глутамин: окислительный путь даёт цитрат M+4, восстановительное карбоксилирование — M+5; расщепление цитрата M+5 (ACLY) даёт ацетил-CoA M+2 и ОАА M+3 (Buescher 2015; Antoniewicz 2018). Поправки: разведение немечеными источниками (сыворотка, другие аминокислоты, CO₂), пулы цитоплазмы и митохондрий, природное ¹³C (Buescher 2015). Поэтому по одному изотопологу чистый поток не определяют: его оценивают моделированием потоков и дополнительной меткой, например [5-¹³C]глутамином (Fan 2013; Antoniewicz 2018). Для ¹³C-глюкозы отношение изотопологов даёт вклад путей только с учётом степени мечения пирувата и разведения метки в пуле ОАА; M+3 возникает и после нескольких оборотов цикла.", "gn_model2": "Что упрощено в модели (вопрос 2)", "g_model2": "Модель вопроса 2 воспроизводит качественные зависимости, но не является замкнутой моделью всего обмена клетки: притоки ацетил-CoA и пирувата не согласованы со всеми их расходами, поэтому числа вопросов 1 и 2 нельзя складывать как общий углеродный баланс, а число частиц — считать числом атомов.\n\nВсе численные величины в модели относительные: 1,00 — уровень или поток эталонной делящейся клетки при 2 мМ глутамина; единицы потока те же, что в вопросе 1. Время не рассчитывается: показано установившееся состояние. На схеме четыре узла вместо восьми промежуточных метаболитов; фумарат, малат и ОАА объединены; пулы митохондрий и цитоплазмы не разделены; половина ОАА из экспортированного цитрата возвращается в цикл (условно).\n\nПритоки: ёмкости GLS и ПК заданы и не регулируются (в клетке поглощение глутамина регулируется); поток через GLS растёт с увеличением концентрации глутамина по закону насыщения (условное Km 0,5 мМ); поток через ПК растёт при низком содержании малата/ОАА (условная обратная связь). Из-за этого при низком оттоке (0,30) содержание метаболитов выше эталонного (примерно до ×1,4). При ингибировании GLS и подавлении ПК в формулу притока введён множитель 0,10 — условное число (в клетках глиобластомы после подавления GLS рост замедлялся, но не прекращался, а для пополнения цикла вместо глутамина использовался глюкозный пируват через ПК: Cheng 2011); из-за обратной связи поток через ПК при подавлении может быть заметно выше 10 % эталона.\n\nПрочие притоки (из пропионил-CoA: валин, изолейцин, треонин, метионин, жирные кислоты с нечётным числом атомов углерода; Forny 2021) на схеме обозначены серой заглушкой и не учитываются; последовательность реакций от пропионил-CoA к сукцинил-CoA описана в справочной карточке. Отток оксалоацетата через PEPCK (оксалоацетат → фосфоенолпируват) показан серой стрелкой и тоже не рассчитывается: в рассчитанный баланс цикла он не входит.\n\n«Условный сток» из узла сукцината — математическое допущение: он пропорционален содержанию сукцината и при потере SDH отводит почти весь поток α-КГДГ; это не скорость синтеза гема (синтез гема начинается с сукцинил-CoA, см. карточку).\n\nПотеря SDH: содержание сукцината в модели в десятки раз выше эталонного (у Cardaci 2015 около ×200); почти весь ОАА образует ПК (у Cardaci 2015 из глюкозы шло около 45 % углерода аспартата); поток PDH от потери SDH и подавления ПК не зависит (у Cardaci 2015 при потере SDH вход углерода глюкозы через PDH снижен); компенсаторные перестройки не учтены; потеря фумаратгидратазы здесь не разбирается.\n\nВ эталоне восстановительного карбоксилирования нет (в культуре оно обычно невелико, но есть: Metallo 2012); в модели оно появляется только при блокаде комплекса I (в том числе в сочетании с потерей SDH), а при одной потере SDH не появляется, хотя в клетках с потерей SDH метка выявляла его и без блокады (Cardaci 2015; Lussey-Lepoutre 2015).\n\nМечение установившееся; CO₂ без метки; меченого пирувата 85 % при ¹³C-глюкозе, меченого глутамина 100 % при ¹³C-глутамине.\n\n«Деление» — условный индекс: он рассчитывается по формуле вопроса 1 только через доступность аспартата, а она умножается на множитель, который зависит от содержания малата/ОАА (условно); ползунок «Отток метаболитов на биосинтез (коэффициент)» умножает константы оттока цитрата, глутамата и аспартата на синтез (1,00 — эталон), поэтому при малом оттоке деление может быть не ниже эталона. Аспартат ограничивает рост в ряде моделей при подавленной цепи или дефиците глутамина, но не везде (Sullivan 2015; Birsoy 2015; Alkan 2018).\n\nСвязь с вопросом 1: PDH в модели не тормозится избытком ацетил-CoA и не уменьшает поток пирувата в ПК; потребление O₂ вопроса 1 не пересчитывается по числу восстановленных переносчиков, образованных в цикле.\n\nДве линии клеток условные: они различаются долей притока через GLS и ПК, суммарный приток у них одинаков; у какой линии основной приток идёт через ПК, показывает шестой шаг сценария; числа заданы произвольно, не из статей; идея пары линий с разным основным притоком (через GLS или через ПК) основана на Cheng 2011.\n\nЗависимость от глутамина определяют условия (состав среды, организм, культура или опухоль; Muir 2017; Davidson 2016): концентрации на экране — учебные.", "s3_k9pop": "K9 в популяции", "s3_k9_ac": "Ac {a} %", "s3_k9_me": "me3 {m} %", "s3_k9_oth": "прочие {o} %", "b4_lg_r": "восстановлен (SH)", "b4_lg_d": "дисульфид (S–S)", "b4_lg_h": "SO₂H/SO₃H (условно, вместе)", "b4_row_m": "Prx3, матрикс", "b4_row_c": "Prx1/2, цитоплазма", "b4_v": "SH {r} % · S–S {d} % · SO₂H/SO₃H {h} %", "b4_br_t": "Пероксидатный цистеин 2-Cys-Prx: остаток, реагирующий с H₂O₂", "b4_br_trx": "→ SH: тиоредоксин, NADPH", "b4_br_srx": "SO₂H → SH: сульфиредоксин, ATP", "b4_br_irr": "не восстанавливается", "s4_ptp1b": "PTP1B (pTyr)", "s4_pten": "PTEN (PIP₃)", "poe_ss": "Прогноз — для нового установившегося состояния; время выхода на него модель не рассчитывает.", "poe_time": "Прогноз — для указанного момента времени; кривая — условная учебная динамика.", "poe_m_t": "Что изменилось", "poe_m_before": "до", "poe_m_after": "после", "poe_m_ref": "эталон", "poe_res_ok": "Ваш ответ {a} верен.", "poe_res_bad": "Ваш ответ {a} неверен. Верный ответ — {b}.", "poe_res_t": "Верный ответ — {b}.", "poe_more": "Подробнее: числа и источники", "poe_m_citm5": "Цитрат M+5, доля", "p1b_1_k": "Без сигнала к делению поток гликолиза снижается и становится меньше пропускной способности челноков NADH и PDH. Почти весь пируват окисляется в митохондриях, ЛДГ почти не участвует в регенерации NAD⁺, и лактат почти не образуется.", "p1b_2_k": "При 0,2 % O₂ дыхательная цепь ограничена недостатком кислорода: доля NADH в матриксе растёт, PDH и челноки замедляются. NAD⁺ в цитоплазме регенерирует ЛДГ, восстанавливая пируват до лактата, поэтому выход лактата растёт, а потребление O₂ падает.", "p1b_3_k": "Сигнал к делению ускоряет гликолиз сильнее, чем могут возрасти поток через PDH и перенос восстановительных эквивалентов челноками. Оставшийся NADH цитоплазмы окисляет ЛДГ, и выход лактата растёт; дыхание не снижается, потому что в митохондрии поступает даже больше пирувата.", "p1a_1_k": "Олигомицин блокирует ATP-синтазу, и протоны возвращаются в матрикс только через утечку, поэтому дыхание замедляется, но не останавливается. Доля NADH в матриксе растёт, меньше пирувата поступает в митохондрии, и ЛДГ, регенерируя NAD⁺, образует больше лактата.", "p1a_2_k": "FCCP переносит протоны в матрикс в обход ATP-синтазы, и дыхательная цепь окисляет NADH быстрее. Поэтому потребление O₂ растёт, а доля NADH в матриксе снижается.", "p1a_3_k": "Пиерицидин блокирует комплекс I, и в клетке не хватает NAD⁺ для синтеза аспартата. ЛДГ восстанавливает добавленный пируват до лактата и регенерирует NAD⁺ в цитоплазме: синтез аспартата и деление восстанавливаются, а дыхание остаётся подавленным.", "p1a_4_k": "Дихлорацетат ингибирует PDK, PDH пропускает больше пирувата в митохондрии, и меньше пирувата превращается в лактат. Скорость дыхательной цепи при этом не растёт, доля NADH в цитоплазме и в матриксе повышается, доступность аспартата снижается, и деление замедляется.", "p1a_5_k": "Когда почти весь пируват поступает в митохондрии, ЛДГ перестаёт регенерировать NAD⁺, а дыхательная цепь не окисляет NADH быстрее. Доля NADH в цитоплазме повышается, реакция GAPDH замедляется, и деление снижается.", "p1a_6_k": "После возврата кислорода дыхательная цепь снова окисляет NADH, доля NADH в матриксе снижается, и пируват поступает в митохондрии. ЛДГ почти не участвует в регенерации NAD⁺: выход лактата почти прекращается, а потребление O₂ возвращается к уровню при 21 % O₂.", "p1a_7_k": "При блокаде комплекса I электроны NADH не поступают в дыхательную цепь, поэтому возврат кислорода дыхание не восстанавливает. NAD⁺ по-прежнему регенерирует ЛДГ, и выход лактата остаётся повышенным.", "p2b_1_k": "Без глутамина прекращается приток через GLS, который пополняет α-КГ. Содержание α-КГ, а затем малата/ОАА снижается; ОАА для синтеза аспартата становится меньше, и рост потока через ПК этого не компенсирует.", "p2b_2_k": "Отток на биосинтез вырос, а приток через GLS почти не может увеличиться, поэтому содержание промежуточных метаболитов, в том числе малата/ОАА, снижается. Цитратсинтазе доступно меньше ОАА, и образование NADH в цикле уменьшается.", "p2b_3_k": "Содержание метаболита задаётся балансом притока и оттока. Когда отток α-КГ на биосинтез уменьшается, содержание α-КГ повышается даже при нулевом притоке через GLS.", "p2a_1_k": "Ингибитор GLS уменьшает приток в цикл из глутамина; содержание ОАА снижается, и поток через ПК в модели возрастает. Компенсация частичная, поэтому ОАА и аспартата всё же становится меньше.", "p2a_2_k": "При подавленной ПК цикл пополняется в основном из глутамина через GLS. Без глутамина исчезает и этот приток: ОАА почти не образуется, синтез аспартата и деление резко снижаются.", "p2a_3_k": "Без SDH сукцинат не превращается в фумарат и поэтому накапливается. Малат и ОАА из сукцината больше не образуются, и их содержание снижается, хотя поток через ПК растёт.", "p2a_4_k": "При потере SDH ОАА образуется в основном через ПК. Подавление ПК лишает цикл этого источника: ОАА и аспартата почти не остаётся, и деление почти прекращается.", "p2a_5_k": "Пиерицидин блокирует комплекс I, NADH в матриксе окисляется медленнее, и окислительный путь цикла замедляется. Часть α-КГ (M+5 из ¹³C-глутамина) превращается в цитрат в обратной реакции — восстановительном карбоксилировании, поэтому появляется цитрат M+5.", "p2a_6_k": "Без глутамина приток через GLS равен нулю, и деление зависит только от притока через ПК. Линия, деление которой при этом почти не меняется, пополняет цикл в основном через ПК.", "p2a_7_k": "ПК превращает пируват M+3 из [U-¹³C₆]глюкозы в ОАА M+3, из которого образуется аспартат M+3. Чем больше вклад ПК, тем выше доля аспартата M+3; но M+3 образуется и после оборотов цикла, поэтому он есть у обеих линий.", "p3b_1_k": "При 1 мМ глюкозы ACLY образует из цитрата меньше ацетил-CoA. Отношение ацетил-CoA : CoA снижается, HAT медленнее ацетилируют H3K9, и уровень H3K9ac падает.", "p3b_2_k": "При сниженном содержании метионина MAT2A синтезирует меньше SAM, и отношение SAM : SAH снижается. Метилтрансферазы медленнее вносят метильные группы, и доля H3K4me3 уменьшается.", "p3b_3_k": "После возврата метионина синтез SAM восстанавливается, отношение SAM : SAH возвращается к эталону, и баланс внесения метки и её удаления деметилазами KDM5 снова устанавливается на прежнем уровне H3K4me3.", "p3a_1_k": "При нокдауне ACLY ацетил-CoA может образовываться из ацетата под действием ACSS2. Добавленный ацетат повышает отношение ацетил-CoA : CoA, и H3K9ac возрастает.", "p3a_2_k": "Вориностат ингибирует HDAC и замедляет удаление ацетильных групп, поэтому при том же внесении H3K9ac повышается. Содержание ацетил-CoA он не изменяет.", "p3a_3_k": "Снижение SAM : SAH замедляет метилтрансферазы, но метилирование H3K4 сильнее зависит от SAM, чем метилирование H3K9. Поэтому H3K4me3 снижается сильнее.", "p3a_4_k": "α-КГ — косубстрат деметилазы KDM4. Диметил-α-КГ повышает содержание α-КГ, KDM4 быстрее снимает метильные группы, и избыток H3K9me3 исчезает.", "p3a_5_k": "Диметил-α-КГ не восстанавливает SDH, поэтому содержание сукцината не меняется. Повышение содержания α-КГ усиливает его конкуренцию с сукцинатом за активный центр KDM4, и H3K9me3 снижается.", "p3a_6_k": "Потеря SDH, потеря FH и мутантная IDH1 сходно тормозят α-КГ-зависимые ферменты, поэтому изменения меток похожи. Различает эти линии метаболит-ингибитор: сукцинат, фумарат или R-2-HG.", "p3a_7_k": "Ингибитор мутантной IDH1 снижает содержание R-2-HG, и активность KDM4 и TET восстанавливается: H3K9me3 и 5hmC приближаются к эталону. Условный избыток метилирования ДНК в этой модели убывает медленнее и к 14-м суткам сохраняется.", "p4b_1_k": "Высокая доля NADH ускоряет образование супероксида в комплексе I, и H₂O₂ в матриксе становится больше. Тиоредоксин восстанавливает окисленный пероксиредоксин с той же скоростью, с какой он окисляется, поэтому переокисления почти нет и нагрузка не растёт.", "p4b_2_k": "При низкой ёмкости тиоредоксин медленнее восстанавливает окисленный пероксиредоксин; H₂O₂ удаляется хуже и чаще окисляет форму SOH до SO₂H. Поэтому растут и переокисление Prx3, и окислительная нагрузка.", "p4b_3_k": "Меньшая доля NADH уменьшает образование супероксида, и сниженной ёмкости снова достаточно для удаления H₂O₂. Содержание H₂O₂ возвращается почти к эталону; повреждения, возникшие раньше, модель не рассчитывает.", "p4a_1_k": "H₂O₂ от NOX обратимо окисляет каталитический цистеин PTP1B, и сигнал от рецептора усиливается. Пероксиредоксины восстанавливают этот H₂O₂ без переокисления, поэтому окислительная нагрузка не растёт.", "p4a_2_k": "Каталаза разлагает H₂O₂, поэтому PTP1B и PTEN остаются восстановленными и активными и сильнее ограничивают сигнал. Показатель p-Akt снижается.", "p4a_3_k": "FCCP снижает протонный потенциал, дыхательная цепь окисляет NADH быстрее, и доля NADH в матриксе падает. Супероксида образуется меньше, и H₂O₂ в матриксе снижается.", "p4a_4_k": "Сульфиредоксин восстанавливает SO₂H-форму пероксиредоксина. Без него переокисленный Prx3 почти не восстанавливается, поэтому его доля выше, а H₂O₂ удаляется ещё хуже.", "p4a_5_k": "H₂O₂ окисляет Cys358 PKM2, и часть глюкозы направляется в пентозофосфатный путь, где образуется NADPH. У PKM2 C358S этого ответа нет: NADPH меньше, H₂O₂ больше.", "p4a_6_k": "Олапариб ингибирует PARP1, и NAD⁺ больше не потребляется на синтез поли(ADP-рибозы), поэтому его содержание восстанавливается. На образование H₂O₂ олапариб не влияет, и индекс нагрузки не меняется.", "p4a_7_k": "Диметилмалонат ингибирует SDH: за время ишемии накапливается меньше сукцината, а при реперфузии его меньше окисляется. Обратный перенос электронов через комплекс I ослабевает, и H₂O₂ образуется намного меньше.", "poe_why": "Механизм:", "poe_full": "Подробнее: числа и источники", "poe_m_ctl_o2": "21 % O₂ без сигнала", "poe_m_ctl_gf": "сигнал роста без каталазы", "poe_m_ctl_gln": "эталон с ¹³C-глутамином", "poe_m_l1": "линия 1", "poe_m_l2": "линия 2", "poe_m_lines": "Сравнение линий", "poe_m_asp3": "Аспартат M+3, доля", "poe_m_div": "Деление (индекс модели)", "poe_m_pc": "Поток через ПК, от эталона линии 1", "poe_m_na": "«—» — в этом состоянии величина не рассчитывалась (например, нет изотопной метки).", "poe_m_ref_note": "Эталон — клетка в исходных условиях вкладки (кнопка «Сбросить»).", "poe_m_dna": "Избыток метилирования ДНК (1 — исходный, 0 — нет избытка)", "s3_sirt": "SIRT", "s4_dmg_note": "образование сейчас; накопление не рассчитано", "info_ref": "Справка · в расчёт не входит", "selfq": "Проверьте себя", "selfa": "Показать ответ", "ref_grp": "Справка · в расчёт не входит", "lg_ref": "пунктирная кнопка — справка; в расчёт не входит", "gl_branch": "Справка: ответвления гликолиза", "gl_prop": "Справка: пропионил-CoA и MMUT", "gl_pepck": "Справка: PEPCK и отток оксалоацетата", "gl_onec": "Справка: фолат, витамин B₁₂ и SAM", "gl_ch_sam": "Справка: метионин, SAM и SAH", "gl_cata": "Справка: катаплероз и анаплероз", "gl_rx_pkm2": "Вопрос 4: PKM2 и пентозофосфатный путь", "s2_xp": "ФЕП", "s2_xp_a": "Оксалоацетат → фосфоенолпируват (PEPCK): серая стрелка, в расчёт не входит; открыть справку", "gn_branch": "Ответвления гликолиза: пентозофосфатный путь и синтез серина", "gtag_branch": "Справка к вопросу 1 · в расчёт не входит: на схеме эти пути показаны серыми заглушками", "g_branch": "<b>Определение.</b> Часть глюкозного углерода может поступать в биосинтетические пути до образования пирувата. Глюкозо-6-фосфат — исходный метаболит пентозофосфатного пути. В окислительной ветви глюкозо-6-фосфат превращается в рибулозо-5-фосфат с образованием NADPH и CO₂. Рибулозо-5-фосфат может превращаться в рибозо-5-фосфат — предшественник нуклеотидов. Обратимые реакции неокислительной ветви связывают пентозофосфаты с фруктозо-6-фосфатом и глицеральдегид-3-фосфатом; они позволяют получать рибозо-5-фосфат без одновременного образования NADPH (Stincone 2015). От 3-фосфоглицерата ответвляется путь синтеза серина.\n<b>Что происходит.</b> В пути синтеза серина PHGDH окисляет 3-фосфоглицерат (кофермент NAD⁺) до 3-фосфогидроксипирувата; PSAT1 переносит на него аминогруппу с глутамата, и образуются фосфосерин и α-кетоглутарат; PSPH отщепляет фосфат, и получается серин. Серин связан с обменом глицина и одноуглеродных фрагментов: он отдаёт один атом углерода в фолатный пул.\n<b>Что наблюдали.</b> Наличие пути не показывает его поток: поток измеряют изотопным мечением. В клетках рака молочной железы человека MDA-MB-468 с амплификацией гена PHGDH на синтез серина уходило 8–9 % гликолитического потока, а в клетках MDA-MB-231 с низким содержанием PHGDH — 1–2 % (Possemato 2011; метка из [U-¹³C]-глюкозы). В клетках HEK293T после 24 ч с [U-¹³C]-глюкозой сигнал ¹³C-глицина в спектре ЯМР был почти так же интенсивен, как сигнал ¹³C-лактата; в клетках H1299 он был слабее, а в клетках MCF-10a не выявлялся (Locasale 2011).\n<b>Граница вывода.</b> Это данные для отдельных линий культивируемых клеток, в основном опухолевых. Доли потока нельзя переносить на другие клетки и ткани: вклад каждого ответвления зависит от клеточной системы и условий.\n<b>Связь с моделью.</b> Гликолиз в вопросе 1 заканчивается пируватом. Серые заглушки «ПФП» и «серин» не задают оттока углерода, и распределение углерода между ответвлениями модель не рассчитывает. NADPH как восстановитель рассматривается в вопросе 4; синтез серина в интерактивах не рассчитывается.", "gfc_branch": "Схема: ответвления от гликолиза. Пунктир — пути, которых нет в расчёте вопроса 1.", "gfa_branch": "Схема. Глюкоза превращается в глюкозо-6-фосфат, затем в 3-фосфоглицерат и пируват. От глюкозо-6-фосфата пунктиром отходит пентозофосфатный путь с образованием NADPH и рибозо-5-фосфата. От 3-фосфоглицерата пунктиром отходит синтез серина (PHGDH, PSAT1, PSPH), а серин даёт глицин и одноуглеродные фрагменты.", "gq_branch": "Высокое содержание PHGDH в линии клеток подтверждено иммуноблоттингом (вестерн-блот). Можно ли по этому результату определить, какая доля гликолитического потока уходит в синтез серина?", "ga_branch": "Нет. Содержание фермента показывает, что путь возможен, но само по себе не позволяет судить о потоке через него; поток измеряют изотопным мечением. В клетках рака молочной железы MDA-MB-231 на синтез серина уходило 1–2 % гликолитического потока, а в клетках MDA-MB-468 с амплификацией PHGDH — 8–9 % (Possemato 2011).", "fg_br_glc": "Глюкоза", "fg_br_g6p": "Глюкозо-|6-фосфат", "fg_br_3pg": "3-фосфо-|глицерат", "fg_br_pyr": "Пируват", "fg_br_ppp": "Пентозофосфатный путь", "fg_br_nadph": "NADPH|(восстановитель)", "fg_br_rib": "рибозо-5-фосфат|(нуклеотиды)", "fg_br_ser_path": "Синтез серина|PHGDH → PSAT1 → PSPH", "fg_br_ser": "Серин", "fg_br_gly": "глицин и|одноуглеродные|фрагменты", "fg_br_note": "Пунктир — ответвления вне расчёта (на схеме вопроса 1 это серые заглушки)", "gn_prop": "Пропионил-CoA → сукцинил-CoA: MMUT и витамин B₁₂", "gtag_prop": "Справка к вопросу 2 · в расчёт не входит: на схеме это часть серой заглушки «прочие притоки»", "g_prop": "<b>Определение.</b> Пропионил-CoA образуется при катаболизме валина, изолейцина, треонина и метионина, жирных кислот с нечётным числом атомов углерода и боковой цепи холестерина; источником служит и пропионат, который вырабатывают кишечные бактерии (Forny 2021). Пропионил-CoA пополняет пул промежуточных соединений цикла: через сукцинил-CoA он входит в цикл как приток (анаплероз).\n<b>Что происходит.</b> Пропионил-CoA-карбоксилаза (кофермент — биотин; расходуется ATP) присоединяет CO₂ и образует D-метилмалонил-CoA. Метилмалонил-CoA-эпимераза (MCEE) превращает его в L-форму. Метилмалонил-CoA-мутаза (MMUT) перестраивает углеродный скелет L-метилмалонил-CoA в сукцинил-CoA. Коферментом MMUT служит аденозилкобаламин, одна из форм витамина B₁₂. В реакции метионинсинтазы участвует другая форма, метилкобаламин.\n<b>Что наблюдали.</b> У людей с дефицитом MMUT (метилмалоновая ацидемия) и в моделях — клетках 293T без гена MMUT и мышах — гемизиготной модели метилмалоновой ацидемии (ген Mmut) — нарушено не только превращение метилмалонил-CoA в сукцинил-CoA, но и обмен промежуточных соединений цикла и глутамина. В клетках 293T без MMUT пулы промежуточных соединений цикла были заметно снижены, как и пулы глутамина и глутамата; в фибробластах пациентов снижалось содержание глутамина, а пулы промежуточных соединений цикла существенно не менялись. Метка из [U-¹³C]-глутамина в обеих системах указывала на тенденцию к более высокой доле глутамина как источника пополнения цикла. В фибробластах пациентов содержание OGDH было понижено, а GLUD1 — повышено; при совместной очистке после сшивки в клетках 293T MMUT выделялась в одном комплексе с GLUD1, GOT2 и DLST (Forny 2023; протеомика, мечение и совместная очистка белков в клетках).\n<b>Граница вывода.</b> Дефицит MMUT нельзя описать как простое снижение «активности цикла»: изменены обмен промежуточных соединений цикла и глутамина и содержание ферментов OGDH и GLUD1 (вклад глутамина в пополнение цикла по метке ¹³C показан только как тенденция). Данные получены на клетках пациентов, клетках с удалённым геном и мышах; по ним нельзя рассчитывать тяжесть болезни у конкретного человека.\n<b>Связь с моделью.</b> Серая заглушка «прочие притоки» не рассчитывается: приток от пропионил-CoA к сукцинил-CoA в баланс цикла вопроса 2 не входит.", "gfc_prop": "Схема: путь от пропионил-CoA к сукцинил-CoA. Не рассчитывается: на схеме вопроса 2 — серая заглушка «прочие притоки».", "gfa_prop": "Схема. Пропионил-CoA карбоксилируется карбоксилазой с биотином и ATP, образуется D-метилмалонил-CoA. Эпимераза MCEE превращает его в L-метилмалонил-CoA. Мутаза MMUT с аденозилкобаламином превращает L-метилмалонил-CoA в сукцинил-CoA, который входит в цикл трикарбоновых кислот.", "fg_pr_src1": "Источники пропионил-CoA: валин, изолейцин, треонин, метионин;", "fg_pr_src2": "жирные кислоты с нечётным числом атомов углерода, боковая цепь холестерина;", "fg_pr_src3": "пропионат кишечных бактерий", "fg_pr_b1": "Пропионил-|CoA", "fg_pr_b2": "D-метил-|малонил-CoA", "fg_pr_b3": "L-метил-|малонил-CoA", "fg_pr_b4": "Сукцинил-|CoA", "fg_pr_e1": "карбоксилаза", "fg_pr_e1s": "биотин, ATP", "fg_pr_e2": "эпимераза", "fg_pr_e2s": "MCEE", "fg_pr_e3": "мутаза MMUT", "fg_pr_e3s": "аденозилкобаламин (B₁₂)", "fg_pr_tca": "в цикл", "gn_pepck": "PEPCK: отток оксалоацетата из цикла (катаплероз)", "gtag_pepck": "Справка к вопросу 2 · в расчёт не входит: серая стрелка «ОАА → ФЕП» на схеме отток не задаёт", "g_pepck": "<b>Определение.</b> Фосфоенолпируваткарбоксикиназа (PEPCK) катализирует реакцию: оксалоацетат + GTP → фосфоенолпируват (ФЕП) + GDP + CO₂. Выведение углерода из пула оксалоацетата относится к катаплерозу.\n<b>Что происходит.</b> У человека есть две изоформы: цитозольная (PCK1, PEPCK-C) и митохондриальная (PCK2, PEPCK-M). В печени эта реакция входит в глюконеогенез; в печени человека активность двух изоформ распределена примерно поровну (Stark, Kibbey 2014). Вклад PEPCK должен быть согласован с поступлением углерода в цикл: отток без пополнения уменьшил бы пул промежуточных соединений.\n<b>Что наблюдали.</b> В печени двухдневных мышей без гена Pck1 (PEPCK-C) содержание малата было в 10 раз выше, чем у контрольных мышей; в срезах печени снижалось окисление [¹⁴C]-ацетата и [¹⁴C]-глутамата до ¹⁴CO₂, накапливались триглицериды, а сами животные погибали от гипогликемии. Авторы сделали вывод, что PEPCK-C нужна не только для глюконеогенеза, но и для катаплероза (Hakimi 2005).\n<b>Граница вывода.</b> Данные получены на новорождённых мышах и относятся к цитозольной изоформе в печени. В других тканях и при других условиях вклад PEPCK и распределение по изоформам иные: одну и ту же реакцию следует рассматривать в контексте ткани и общего баланса метаболитов.\n<b>Связь с моделью.</b> В вопросе 2 рассчитаны оттоки цитрата, глутамата, аспартата и малата и условный сток из узла сукцината. Отток оксалоацетата через PEPCK показан серой стрелкой и в расчёт не входит: на рассчитанный баланс цикла в модели он не влияет.", "gfc_pepck": "Схема: реакция PEPCK и две изоформы фермента. Не рассчитывается: на схеме вопроса 2 — серая стрелка «ОАА → ФЕП».", "gfa_pepck": "Схема. Оксалоацетат превращается в фосфоенолпируват под действием PEPCK; расходуется GTP, выделяется CO₂. В печени фосфоенолпируват идёт на глюконеогенез. Изоформы: PCK1 цитозольная и PCK2 митохондриальная.", "fg_pe_top": "Катаплероз: отток промежуточных соединений цикла из пула", "fg_pe_oaa": "Оксалоацетат|(ОАА)", "fg_pe_pep": "Фосфоенол-|пируват (ФЕП)", "fg_pe_gtp": "GTP → GDP", "fg_pe_co2": "выделяется CO₂", "fg_pe_gng1": "глюконеогенез", "fg_pe_gng2": "в печени", "fg_pe_c1": "PCK1 — цитозольная (PEPCK-C)", "fg_pe_c2": "PCK2 — митохондриальная (PEPCK-M)", "gn_onec": "Фолат, витамин B₁₂ и SAM: одноуглеродный обмен", "gtag_onec": "Справка к вопросу 3 · в расчёт не входит: в модели рассчитаны только SAM и SAH", "g_onec": "<b>Определение.</b> Метионинсинтаза (MTR) переносит метильную группу с 5-метилтетрагидрофолата на гомоцистеин; образуются метионин и тетрагидрофолат. В реакции участвует метилкобаламин — форма витамина B₁₂ (Leclerc 1996). Из метионина и ATP фермент MAT2A образует SAM.\n<b>Что происходит.</b> При переносе метильной группы с SAM на субстрат (ДНК, гистон, другой акцептор) метилтрансфераза образует метилированный субстрат и SAH. SAH ингибирует многие метилтрансферазы; SAH-гидролаза (AHCY) расщепляет его на аденозин и гомоцистеин (Aranda 2019), и гомоцистеин снова может быть метилирован до метионина. В печени и почках метионин из гомоцистеина образует и другой фермент, бетаин-гомоцистеин-метилтрансфераза (BHMT): донор метильной группы для неё — бетаин, а не 5-метилтетрагидрофолат (Ducker, Rabinowitz 2017).\n<b>Граница вывода.</b> На метилирование влияют не только содержание SAM, но и обмен SAH, активность ферментов и состояние хроматина. Поэтому изменение обеспечения фолатом или витамином B₁₂ само по себе не позволяет предсказать направление изменения всех меток ДНК и гистонов. Эти понятия различаются: SAM — донор метильной группы; SAH — продукт реакции переноса; снятие метки с ДНК или гистона — отдельный процесс, деметилирование. SAH возникает при переносе метильной группы, а не при «деметилировании SAM».\n<b>Связь с моделью.</b> В вопросе 3 рассчитываются только содержание SAM и SAH и их отношение в зависимости от концентрации метионина (SAH снижается слабее SAM — условное допущение). Фолатный цикл, витамин B₁₂, MTR и AHCY не рассчитываются, и изменение их активности на этом экране не моделируется.", "gfc_onec": "Схема: метиониновый цикл. В расчёте вопроса 3 есть только SAM и SAH; остальные звенья в расчёт не входят.", "gfa_onec": "Схема. Метионин и ATP дают SAM под действием MAT2A. Метилтрансфераза переносит метильную группу с SAM на акцептор, образуется SAH. AHCY расщепляет SAH на аденозин и гомоцистеин. Метионинсинтаза MTR с метилкобаламином превращает гомоцистеин в метионин, используя метильную группу 5-метилтетрагидрофолата.", "gq_onec": "Содержание витамина B₁₂ в клетках снижено, активность метионинсинтазы уменьшена. Можно ли по этому однозначно предсказать, как изменятся метка H3K4me3 и метилирование ДНК?", "ga_onec": "Нельзя. Активность MTR влияет на образование метионина и SAM, но метки зависят и от содержания SAH, активности метилтрансфераз и деметилаз и состояния хроматина; поэтому направление изменения всех меток по одному входу не предсказывается.", "fg_oc_met": "Метионин", "fg_oc_hcy": "Гомоцистеин", "fg_oc_mt": "метилтрансфераза", "fg_oc_mt2": "акцептор R–H → R–CH₃", "fg_oc_mt3": "(ДНК, гистоны и др.)", "fg_oc_ado": "+ аденозин", "fg_oc_mecbl": "метилкобаламин", "fg_oc_thf": "5-метил-THF → THF", "fg_oc_c1": "SAM — донор метильной группы;", "fg_oc_c2": "SAH — продукт реакции переноса,", "fg_oc_c3": "ингибирует многие метилтрансферазы", "fg_oc_note": "Справочная схема: в расчёте вопроса 3 есть только SAM и SAH", "src_001": "Luengo /* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(o.yfmt ? o.yfmt(v) : fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

function poeCompare(st, before, ref, after){
