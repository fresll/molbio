<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 5 · Нуклеосомы, ремоделирование и гистоны — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-line:#B06E05; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --cyc:#2F5DA8; --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-line:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-line:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on-line);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl.locked{opacity:.55;position:relative}
.ctrl.locked::before{content:attr(data-lock);font-size:12.5px;color:var(--muted)}
[data-g]:focus-visible{outline:3px solid var(--on-line);outline-offset:2px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on-line)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on-line)}
.box.inh{fill:var(--surface-2);stroke:var(--off-ink);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* семинар 8: метаболические потоки */
.meter{position:relative}
.meter .tk{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.55;border-radius:1px}
.fmrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 2px}
.fm{margin:0;display:grid;gap:3px;justify-items:start;color:var(--ink)}
.fm figcaption{font-size:13px;color:var(--muted)} .fm figcaption b{color:var(--ink)}
.fm-s{color:var(--ink)}
.medium{fill:var(--surface-2)}
.matrix{fill:var(--mito-fill);stroke:none;opacity:.55}
.dot-nadh{fill:var(--ink)} .dot-nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.dot-glc{fill:var(--on)} .dot-pyr{fill:var(--mtor)} .dot-lac{fill:var(--akt)}
.stub{fill:none;stroke:var(--off);stroke-width:1.6;stroke-dasharray:4 4}
.pool .nadh{fill:var(--ink)} .pool .nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.drugpill{fill:var(--bad)} .drugpill-t{fill:#fff;font-family:var(--f-body);font-weight:700;text-anchor:middle;dominant-baseline:central}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.res-grid{display:grid;gap:6px}

.meter{overflow:visible} .meter i{border-radius:5px}
.road{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
.halo{fill:none;stroke:var(--cyto);stroke-width:7}
.pool-fr{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.noxbox{fill:var(--good);stroke:none}
.medpill{fill:var(--surface);stroke:var(--on);stroke-width:2}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.mm .mt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mm small{font-size:13px;line-height:1.2;color:var(--ink)}
.mm .v{font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.legend .sw.line{display:inline-block}

.btn[hidden]{display:none!important}
.scene.wip .side > :not(.cap){display:none!important}
.scene.wip .cap .why{display:none}
.fm-s [class^="bond-"]{vector-effect:non-scaling-stroke;stroke-width:1.5px!important}

/* семинар 8: компактнее правая колонка (проектор 1280×720) */
.scene .ctrl{gap:8px} .scene input[type=range]{height:22px} .scene .slider{gap:0}
#capbox1a{order:-1} #poe1a{order:-2}
.tgrid .switch{font-size:14.5px;gap:8px}

/* семинар 8, вопрос 2: цикл трикарбоновых кислот */
.lv-tr{fill:var(--line)} .lv-f{fill:var(--mtor);transition:width .35s} .lv-f.fad{fill:var(--tfeb)}
.lv-tk{stroke:var(--ink);stroke-width:1.6;opacity:.75}

f": "Серая метка — исходное положение вкладки (SHL 6,5, содержание ТФ равно Kd на свободной ДНК). Время пребывания и частота присоединения даны для Rap1 (дрожжи, in vitro).", "s1b_take": "Нуклеосомная ДНК раскрывается не постоянно, а на доли времени, и эта доля убывает от входа к оси симметрии. Поэтому занятость сайта зависит от положения и растёт с содержанием ТФ; у Rap1 нуклеосома снижает занятость за счёт более короткого пребывания, а не более редкого присоединения (in vitro).", "s1b_c_free": "Сайт на свободной ДНК: при содержании ТФ {c} × Kd он занят {tf} времени, ТФ остаётся на нём около {tau}.", "s1b_c_free_z": "Это эталон для сравнения: все нуклеосомные состояния ниже отсчитываются от него.", "s1b_c_hi": "Сайт на нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени, но при таком содержании ТФ занят {th}; на свободной ДНК — {tf}.", "s1b_c_hi_z": "Избыток ТФ компенсирует редкое раскрытие: доступность — вероятность, а не запрет.", "s1b_c_mid": "Сайт на нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени и занят {th}; на свободной ДНК при том же содержании ТФ — {tf}.", "s1b_c_mid_z": "Занятость заметна, но ниже, чем на свободной ДНК: нуклеосома снижает её, не исключая полностью.", "s1b_c_low": "Сайт на нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени и занят {th}; на свободной ДНК при том же содержании ТФ — {tf}.", "s1b_c_low_z": "Чтобы занять такой сайт, нужно существенно большее содержание ТФ (сдвиньте ручку содержания вправо).", "s1b_c_vlow": "Сайт глубоко в нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени и занят {th}; на свободной ДНК при том же содержании ТФ — {tf}.", "s1b_c_vlow_z": "Для таких положений в модели нужны содержания ТФ на порядки выше Kd; значения глубже SHL 4,5 — экстраполяция учебной модели.", "p1b_ctl": "Свободная ДНК", "p1b_1_q": "Сайт Rap1 на нуклеосомной ДНК расположен у входа (около SHL 6,5), содержание ТФ равно Kd на свободной ДНК. Тот же сайт переносят глубже, к SHL 4,5. Как изменится занятость сайта в новом установившемся состоянии?", "p1b_1_o1": "Занятость не изменится: ТФ связывается с любым участком нуклеосомной ДНК одинаково.", "p1b_1_o2": "Занятость снизится: сайт реже раскрывается, и время пребывания ТФ на нём короче.", "p1b_1_o3": "Занятость вырастет: глубже ДНК плотнее связана с октамером, и ТФ удерживается лучше.", "p1b_1_k": "Доля времени, когда сайт раскрыт, убывает от входа к оси симметрии, а вместе с ней — время пребывания ТФ; поэтому при том же содержании ТФ занятость ниже.", "p1b_1_e": "Для Rap1 in vitro время пребывания (долгая фаза) сокращается с 46 с у входа до 7,7 с после переноса того же сайта на SHL 4,5 (Mivelaz 2020). В модели доля времени, когда сайт раскрыт, снижается с 10 % до 1,7 %, занятость — с 9,2 % до 1,7 %. Времена пребывания измерены, остальные числа — расчёт учебной модели.", "p1b_1_w1": "Положение сайта входит в расчёт занятости: чем глубже сайт, тем реже нуклеосомная ДНК раскрывается над ним, поэтому при том же содержании ТФ занятость не может остаться прежней.", "p1b_1_w3": "Плотные контакты ДНК с октамером уменьшают вероятность раскрытия сайта и не повышают удержание ТФ: ТФ уходит с сайта быстрее, поэтому занятость ниже, а не выше.", "p1b_2_q": "Сайт Rap1 расположен у SHL 4,5, содержание ТФ равно Kd на свободной ДНК. Содержание ТФ увеличивают в 10 раз. Какая величина из показаний изменится в новом установившемся состоянии?", "p1b_2_o1": "Время пребывания ТФ на сайте вырастет: ТФ больше, и он дольше занимает сайт.", "p1b_2_o2": "Доля времени, когда сайт раскрыт, вырастет: ТФ раскрывает нуклеосомную ДНК.", "p1b_2_o3": "Занятость сайта вырастет; раскрытие сайта и время пребывания останутся прежними.", "p1b_2_k": "В этой модели содержание ТФ определяет занятость, а раскрытие нуклеосомной ДНК и время пребывания задаются положением сайта.", "p1b_2_e": "При десятикратном увеличении содержания ТФ занятость сайта у SHL 4,5 растёт с 1,7 % до 15 %, а доля времени, когда сайт раскрыт (1,7 %), и время пребывания (7,7 с) остаются прежними. Это расчёт учебной модели для Rap1; в опытах ТФ может сдвигать равновесие раскрытия (Li 2004, LexA), в модели этого нет.", "p1b_2_w1": "Время пребывания определяется скоростью ухода одной молекулы ТФ с сайта; число молекул в растворе на неё не влияет, поэтому величина остаётся прежней.", "p1b_2_w2": "В этой модели раскрытие задаётся положением сайта, а не содержанием ТФ. Сдвиг равновесия раскрытия под действием ТФ в опытах описан для LexA (Li 2004) и в модель не заложен.", "p1b_3_q": "Сайт Rap1 находится на свободной ДНК, содержание ТФ равно Kd. Тот же сайт помещают на нуклеосомную ДНК у входа (SHL 6,5). Как изменятся частота присоединения и время пребывания Rap1 в новом установившемся состоянии (in vitro)?", "p1b_3_o1": "Частота присоединения останется прежней, а время пребывания сократится.", "p1b_3_o2": "Частота присоединения снизится, а время пребывания останется прежним.", "p1b_3_o3": "Частота присоединения и время пребывания снизятся в сопоставимой степени.", "p1b_3_k": "У Rap1 нуклеосома укорачивает пребывание на сайте, а присоединение идёт с той же частотой: модель «сайт либо закрыт, либо открыт» этого не объясняет.", "p1b_3_e": "В одномолекулярных опытах (Mivelaz 2020) время пребывания Rap1 снижается с 452 с на свободной ДНК до 46 с на мононуклеосоме, а частота присоединения остаётся близкой; в модели занятость падает с 50 % до 9,2 %. Rap1 — дрожжевой ТФ in vitro; у других ТФ механизм может быть иным.", "p1b_3_w2": "Это механизм «захвата раскрытого состояния» (Polach 1995): занятость он снижает так же, но для Rap1 в опытах частота присоединения близка к значению на свободной ДНК (×1,0), а сокращается пребывание.", "p1b_3_w3": "Показатели меняются неодинаково: частота присоединения не меняется (×1,0), а время пребывания падает с 452 с до 46 с; занятость сайта при этом снижается с 50 % до 9,2 %.", "s1_r_atac": "Сигнал ATAC-seq на сайте (условный индекс, 1 = свободная ДНК)", "s1_r_mnase": "Доля молекул с нуклеосомой на сайте (защита от MNase)", "s1_r_fp": "Футпринт ТФ в данных DNase (условный индекс)", "s1_r_chip": "Сигнал ChIP-seq на сайте (условный индекс)", "s1a_tf": "Тип ТФ", "s1a_tf_rap1": "Rap1 (измерено)", "s1a_tf_edge": "захватывает раскрытый сайт", "s1a_tf_dyad": "ТФ оси симметрии (RFX5, SOX)", "s1a_tf_pion": "пионерный (Oct4)", "s1a_tf_klf4": "Klf4", "s1a_g_in": "Воздействия на нуклеосому и сайт", "s1a_rem": "АТФ-зависимый ремоделер (RSC)", "s1a_fib": "Фибрилла из 12 нуклеосом", "s1a_pol": "poly(dA:dT) рядом", "s1a_h1": "Линкерный гистон H1", "s1a_ac": "Ацетилирование гистона", "s1a_ac_none": "нет", "s1a_ac_k56": "H3K56ac (у входа)", "s1a_ac_k16": "H4K16ac", "s1a_me": "Метилирование CpG сайта", "s1a_me_none": "нет", "s1a_me_dn": "снижает сродство ТФ", "s1a_me_up": "повышает сродство ТФ", "s1a_pos_free": "на свободной ДНК, вне нуклеосомы", "s1a_pos": "на нуклеосомной ДНК, SHL {shl}", "s1a_pos_ex": "на нуклеосомной ДНК, SHL {shl} (учебная модель)", "s1a_pos_shifted": "нуклеосома сдвинута", "s1a_dn_c": "содержание ТФ {c} × Kd", "s1a_dn_tf_edge": "ТФ, захватывающий раскрытый сайт", "s1a_dn_tf_dyad": "ТФ с предпочтением оси симметрии", "s1a_dn_tf_pion": "пионерный ТФ (Oct4)", "s1a_dn_tf_klf4": "Klf4", "s1a_dn_rem": "ремоделер сдвинул нуклеосому", "s1a_dn_fib": "фибрилла из 12 нуклеосом", "s1a_dn_k56": "ацетилирование H3K56", "s1a_dn_k16": "ацетилирование H4K16", "s1a_dn_pol": "poly(dA:dT) рядом", "s1a_dn_h1": "линкерный гистон H1", "s1a_dn_meDn": "метилирование снижает сродство ТФ", "s1a_dn_meUp": "метилирование повышает сродство ТФ", "s1a_sh_free": "NFR", "s1a_sh_ctl": "контроль", "s1a_sh_now": "сейчас", "s1a_k_ctl": "контроль — сайт на свободной ДНК, содержание ТФ 1 × Kd", "s1a_k_hidden": "условие скрыто", "s1a_b_atac": "ATAC-seq", "s1a_b_mnase": "MNase-seq", "s1a_b_fp": "футпринт", "s1a_b_chip": "ChIP-seq", "s1a_blot_t": "Сигналы на сайте (модель; тёмнее полоса — сильнее сигнал)", "s1a_blot_add": "Добавить дорожку", "s1a_blot_clear": "Очистить дорожки", "s1a_blot_hint": "Дорожка фиксирует текущие условия (не больше шести). Полоса — условный индекс, а не мера потока; отсутствие полосы не равно нулю сигнала. Пик ATAC-seq отражает вставку Tn5 (в том числе у входа-выхода нуклеосомной ДНК, Sato 2019), а не занятость сайта ТФ; ТФ с пребыванием порядка секунд не оставляют футпринта (Sung 2014). В MNase-seq «хрупкие» нуклеосомы могут теряться, и отсутствие защиты не означает отсутствия нуклеосомы (Kubik 2015).", "s1a_blot_hint_m": "Дорожки показывают три образца: условия скрыты, данные приведены в таблице. После ответа условия будут названы.", "s1a_blot_hint_m2": "Дорожки показывают три образца; условия названы в подписи под дорожками, данные приведены в таблице.", "s1a_ref": "Серая метка — исходное состояние вкладки: Rap1, SHL 6,5, содержание ТФ равно Kd на свободной ДНК, без воздействий. В сценарии серая метка — контроль шага (свободная ДНК). Время пребывания и частота присоединения показаны для Rap1; у других ТФ они не измерены.", "s1a_take": "Доступность сайта — вероятность: она зависит от положения на нуклеосомной ДНК, от места метки, от фибриллы и от ремоделера, а занятость сайта ТФ зависит ещё и от свойств самого ТФ. Сигнал ATAC-seq отражает доступность, MNase-seq — наличие нуклеосомы, ChIP-seq — занятость; одним прибором эти величины не различить. Выводы получены на модели по опытам in vitro и по рефератам; для клеток они требуют проверки.", "s1a_myst_b0": "Загадка X, Y, Z", "s1a_myst_b1": "Показать условия образцов", "s1a_myst_b2": "Вернуться к модели", "s1a_myst_svg1": "Три образца: X, Y, Z", "s1a_myst_svg2": "Условия образцов скрыты; данные — на дорожках и в таблице ниже.", "s1a_myst_svg2b": "Условия образцов названы под дорожками; данные — на дорожках и в таблице ниже.", "s1a_myst_tt": "Значения на дорожках (модель)", "s1a_tb_sample": "образец", "s1a_myst_note": "Серия сигналов — условные индексы; доля молекул с нуклеосомой — в процентах. «Низкий сигнал» не означает отсутствия объекта.", "s1a_when_m": "Условия образцов в загадке не связаны с ручками; сигналы показаны в таблице.", "p1a_ctl": "Свободная ДНК", "s1a_c_free": "Сайт на свободной ДНК (нуклеосомы нет): при содержании ТФ {c} × Kd он занят {th}. Воздействия на нуклеосому на такой сайт не влияют.", "s1a_c_free_z": "Это контроль: сайт доступен для Tn5 и не защищён нуклеосомой, а занятость определяется содержанием ТФ и его сродством.", "s1a_c_base": "Сайт на нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени и занят {th} при содержании ТФ {c} × Kd; на свободной ДНК — {tf}.", "s1a_c_base_z": "Нуклеосома не закрывает сайт полностью: сигналы приборов зависят от доли времени раскрытия и от ТФ.", "s1a_c_multi": "Включено несколько воздействий: {d}. Сайт на нуклеосомной ДНК (SHL {shl}) раскрыт {o} времени и занят {th}; в исходном состоянии вкладки занятость — {r}.", "s1a_c_multi_z": "Эффекты воздействий в модели перемножаются; каждый можно проверить, включив его отдельно.", "s1a_c_rem": "Ремоделер сдвинул нуклеосому с сайта: сайт занят {th} (в исходном состоянии вкладки — {r}). Нуклеосома остаётся над сайтом лишь малую долю времени (допущение модели: 5 %).", "s1a_c_rem_z": "Нуклеосома сдвинута, а не разобрана: на освобождённом участке ТФ связывается почти как на свободной ДНК (Rap1 с RSC, Mivelaz 2020).", "s1a_c_fib": "Сайт в фибрилле из 12 нуклеосом занят {th} (в исходном состоянии вкладки — {r}); доля времени, когда сайт раскрыт, прежняя — {o}.", "s1a_c_fib_z": "В фибрилле время пребывания Rap1 сокращается ещё примерно втрое (Mivelaz 2020, in vitro).", "s1a_c_k56": "С H3K56ac доля времени, когда сайт раскрыт, {o}; занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_k56_z": "Метка у входа-выхода ДНК увеличивает разворачивание конца ДНК (Neumann 2009); у оси симметрии эффекта в модели нет, и показания не меняются.", "s1a_c_k16": "H4K16ac без фибриллы не меняет раскрытие сайта ({o}); занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_k16_z": "H4K16ac действует на межнуклеосомные контакты в фибрилле, а не на одиночную нуклеосому (Shogren-Knaak 2006); включите фибриллу.", "s1a_c_pol": "Рядом poly(dA:dT): доля времени, когда сайт раскрыт, {o}, занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_pol_z": "Направление эффекта по данным дрожжей in vivo (Iyer 1995); величина в модели — допущение.", "s1a_c_h1": "С линкерным гистоном H1 доля времени, когда сайт раскрыт, {o}, занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_h1_z": "Направление эффекта по потере H1 у дрозофилы (Iwasaki 2016); величина в модели — допущение.", "s1a_c_meDn": "Метилирование снижает сродство ТФ: занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_meDn_z": "Для части ТФ метилирование снижает связывание (Yin 2017); раскрытие нуклеосомной ДНК и сигнал ATAC-seq в модели не меняются.", "s1a_c_meUp": "Метилирование повышает сродство ТФ: занятость сайта {th} (в исходном состоянии вкладки — {r}).", "s1a_c_meUp_z": "Многие ТФ связывают метилированный CpG лучше неметилированного (Yin 2017): знак эффекта задаёт ТФ; сигнал ATAC-seq в модели не меняется.", "s1a_c_tf_edge": "ТФ, захватывающий раскрытый сайт: занятость {th} при том же равновесии, что у Rap1 ({r}); отличается кинетика — присоединение медленнее, пребывание как на свободной ДНК (гипотеза, Polach 1995).", "s1a_c_tf_edge_z": "Равновесная занятость одинакова, а механизмы различает одномолекулярный опыт.", "s1a_c_tf_dyad": "ТФ с предпочтением оси симметрии: занятость сайта {th} (в исходном состоянии вкладки — {r}); эффект сильнее выражен около SHL 0.", "s1a_c_tf_dyad_z": "У RFX5 и SOX in vitro предпочтение положений около оси симметрии (Zhu 2018); величина в модели — допущение.", "s1a_c_tf_pion": "Пионерный ТФ (Oct4): занятость сайта {th} (в исходном состоянии вкладки — {r}); нуклеосома остаётся на сайте.", "s1a_c_tf_pion_z": "Сродство Oct4 к нуклеосоме близко к сродству к свободной ДНК (Soufi 2015, EMSA, in vitro); вытеснение нуклеосомы не показано.", "s1a_c_tf_klf4": "Klf4: занятость сайта {th} (в исходном состоянии вкладки — {r}); нуклеосома остаётся на сайте.", "s1a_c_tf_klf4_z": "Сродство Klf4 к нуклеосоме ниже, чем к свободной ДНК, в 3–12 раз (Soufi 2015, EMSA, in vitro).", "s1a_c_myst": "Показаны данные трёх образцов X, Y, Z; условия скрыты.", "s1a_c_myst_z": "Сопоставьте сигналы: ATAC-seq — доступность, MNase-seq — наличие нуклеосомы, ChIP-seq — занятость.", "s1a_c_myst2": "Условия образцов названы: X — сайт на свободной ДНК при малом содержании ТФ; Y — сайт у SHL 4,5 без ремоделера; Z — тот же сайт после работы ремоделера.", "s1a_c_myst2_z": "Сигнал ATAC-seq один не различает X и Z; различают MNase-seq и ChIP-seq.", "p1a_1_q": "Сайт Rap1 расположен на нуклеосомной ДНК у входа (SHL 6,5), содержание ТФ равно Kd на свободной ДНК. В систему добавляют АТФ-зависимый ремоделер RSC. Как изменятся занятость сайта и доля молекул с нуклеосомой на сайте (MNase-seq) в новом установившемся состоянии?", "p1a_1_o1": "Занятость не изменится: Rap1 сам вытесняет нуклеосому, и ремоделер ничего не добавляет.", "p1a_1_o2": "Занятость вырастет, а нуклеосома останется над сайтом: ремоделер лишь чаще раскрывает ДНК.", "p1a_1_o3": "Занятость вырастет, а доля молекул с нуклеосомой на сайте снизится: нуклеосома сдвинута.", "p1a_1_k": "Ремоделер сдвигает нуклеосому с сайта; на свободной ДНК Rap1 удерживается долго, поэтому занятость растёт, а защита сайта от MNase падает.", "p1a_1_e": "В опытах in vitro Rap1 сам не разворачивает и не вытесняет нуклеосому, а в присутствии ремоделера RSC нуклеосома смещается, и Rap1 остаётся на сайте долго, как на свободной ДНК (Mivelaz 2020). В модели занятость растёт с 9,2 % до 41 %, доля молекул с нуклеосомой на сайте снижается со 100 % до 5,0 %, а сигнал ATAC-seq вырастает с 0,12 до 0,98. Остаточные 5,0 % — допущение учебной модели, число не измерено.", "p1a_1_w1": "Rap1 в опытах in vitro нуклеосому сам не вытесняет: для вытеснения промоторной нуклеосомы нужен ремоделер RSC. Поэтому ремоделер меняет занятость, а не остаётся лишним звеном.", "p1a_1_w2": "Ремоделер сдвигает нуклеосому, а не только раскрывает ДНК: если бы нуклеосома оставалась над сайтом, время пребывания Rap1 оставалось бы коротким, и защита от MNase не снижалась бы.", "p1a_2_q": "Сайт Rap1 расположен у самого входа нуклеосомной ДНК (SHL 7), содержание ТФ равно Kd на свободной ДНК. Гистон H3 ацетилируют по K56 (остаток у входа-выхода ДНК). Как изменится доля времени, когда сайт раскрыт?", "p1a_2_o1": "Вырастет: H3K56ac повышает долю нуклеосом с развёрнутым концом ДНК.", "p1a_2_o2": "Не изменится: ацетилирование слабо влияет на раскрытие ДНК у входа.", "p1a_2_o3": "Снизится: ацетильная группа добавляет контакты ДНК с гистонами.", "p1a_2_k": "H3K56ac расположена у входа-выхода ДНК и увеличивает долю нуклеосом с развёрнутым концом; поэтому сайт у входа раскрыт чаще, а занятость выше.", "p1a_2_e": "В опытах in vitro (мононуклеосомы на 147 п.н., smFRET) H3K56ac увеличивала долю нуклеосом с развёрнутым концом ДНК примерно вдвое (Neumann 2009). В модели доля времени, когда сайт раскрыт, растёт с 15 % до 32 %, а занятость — с 13 % до 24 %; значения модели у входа близки к измеренным, но не равны им. Эффект метки на компактизацию массивов в опыте не обнаружен.", "p1a_2_w2": "Прямой эффект H3K56ac на разворачивание конца ДНК измерен in vitro: он есть, хотя метка слабо влияет на компактизацию массивов и работу ремоделеров.", "p1a_2_w3": "Для H3K56ac в опытах in vitro показано увеличение, а не снижение доли нуклеосом с развёрнутым концом ДНК.", "p1a_3_q": "Сайт Rap1 расположен у входа (SHL 6,5) в мононуклеосоме, содержание ТФ равно Kd на свободной ДНК. Тот же сайт помещают в фибриллу из 12 нуклеосом (in vitro). Как изменится занятость сайта в новом установившемся состоянии?", "p1a_3_o1": "Не изменится: соседние нуклеосомы не влияют на связывание ТФ с сайтом.", "p1a_3_o2": "Снизится: межнуклеосомные контакты в фибрилле укорачивают пребывание ТФ.", "p1a_3_o3": "Вырастет: в фибрилле ДНК упакована плотнее, и ТФ реже покидает сайт.", "p1a_3_k": "В фибрилле межнуклеосомные контакты дополнительно сокращают время пребывания Rap1 на сайте, а раскрытие ДНК одиночной нуклеосомы остаётся прежним.", "p1a_3_e": "В одномолекулярных опытах (Mivelaz 2020, фибрилла из 12 нуклеосом на последовательности 601, in vitro) время пребывания Rap1 на сайте S2 в фибрилле сократилось ещё примерно в три раза по сравнению с мононуклеосомой. В модели время пребывания снижается с 46 с до 17 с, занятость — с 9,2 % до 3,6 %, а доля времени, когда сайт раскрыт, остаётся 10 %: фибрилла меняет в модели пребывание ТФ, но не раскрытие.", "p1a_3_w1": "Соседние нуклеосомы входят в расчёт: в фибрилле Rap1 пребывает на сайте заметно меньше, чем в мононуклеосоме, поэтому занятость не может остаться прежней.", "p1a_3_w3": "Плотная упаковка уменьшает, а не увеличивает время пребывания Rap1: в опытах in vitro оно в фибрилле короче, чем в мононуклеосоме.", "p1a_4_q": "Сайт Rap1 расположен у входа (SHL 6,5) в фибрилле из 12 нуклеосом, содержание ТФ равно Kd на свободной ДНК. Гистон H4 ацетилируют по K16. Как изменится занятость сайта в новом установившемся состоянии?", "p1a_4_o1": "Снизится: ацетилирование делает нуклеосому менее устойчивой, и ТФ уходит с сайта быстрее.", "p1a_4_o2": "Вырастет: H4K16ac подавляет компактизацию фибриллы и межнуклеосомные контакты.", "p1a_4_o3": "Не изменится: H4K16ac слабо влияет на раскрытие ДНК одиночной нуклеосомы.", "p1a_4_k": "H4K16ac действует на межнуклеосомные контакты, а не на одиночную нуклеосому; в фибрилле она снимает их вклад в укорочение пребывания ТФ.", "p1a_4_e": "H4K16ac, введённое химическим лигированием, подавляет формирование компактных фибрилл и межфибрилльных контактов в нуклеосомных массивах in vitro (Shogren-Knaak 2006). В модели метка снимает вклад фибриллы: время пребывания Rap1 возвращается с 17 с к 46 с (значение для мононуклеосомы), занятость — с 3,6 % к 9,2 %, а доля времени, когда сайт раскрыт, остаётся 10 %. Прямого эффекта H4K16ac на раскрытие одиночной нуклеосомы в модель не заложено.", "p1a_4_w1": "Для H4K16ac показан эффект на упаковку массива, а не снижение устойчивости одиночной нуклеосомы: пребывание ТФ в фибрилле возвращается к значению для мононуклеосомы, а не сокращается.", "p1a_4_w3": "В фибрилле решают контакты между нуклеосомами, а не раскрытие ДНК одиночной нуклеосомы: H4K16ac действует на них, и занятость меняется, хотя раскрытие остаётся прежним (10 %).", "p1a_5_q": "Сайт ТФ расположен у входа нуклеосомной ДНК (SHL 6,5), содержание ТФ равно Kd на свободной ДНК. Для этого ТФ метилированный CpG связывается лучше неметилированного (по данным SELEX in vitro). Цитозин сайта метилируют. Как изменится занятость сайта?", "p1a_5_o1": "Снизится: метилирование ДНК закрывает любой сайт для ТФ.", "p1a_5_o2": "Не изменится: метилирование цитозина не влияет на узнавание сайта ТФ.", "p1a_5_o3": "Вырастет: для этого ТФ метилированный CpG повышает сродство к сайту.", "p1a_5_k": "Знак влияния метилирования задаёт ТФ: для ТФ с повышенным сродством к метилированному CpG метилирование сайта повышает занятость.", "p1a_5_e": "В SELEX in vitro среди 542 ТФ человека многие (особенно с расширенным гомеодоменом) связывают метилированный CpG лучше неметилированного, а у части других ТФ связывание снижается (Yin 2017). В модели для ТФ с повышенным сродством к метилированному CpG значение Kd0 уменьшено втрое (допущение), и занятость растёт с 9,2 % до 23 %, а сигнал ATAC-seq остаётся 0,12: метилирование не меняет раскрытие нуклеосомной ДНК. Влияние метилирования на сайты внутри нуклеосомы в работе не изучалось.", "p1a_5_w1": "Метилирование цитозина меняет сродство ТФ в обе стороны: для одних ТФ связывание снижается, для других растёт; у этого ТФ по условию растёт.", "p1a_5_w2": "Метилирование меняет химическую структуру сайта, и узнавание ТФ меняется; для ТФ с повышенным сродством к метилированному CpG связывание сильнее, поэтому занятость вырастает.", "p1a_6_q": "Сайт расположен на нуклеосомной ДНК ближе к оси симметрии (SHL 3), содержание ТФ в 10 раз выше Kd на свободной ДНК, ТФ связывает преимущественно конец нуклеосомной ДНК. Его заменяют пионерным ТФ типа Oct4, узнающим частичный мотив на нуклеосоме. Как изменятся занятость сайта и доля молекул с нуклеосомой на сайте?", "p1a_6_o1": "Занятость вырастет, а нуклеосома останется на сайте.", "p1a_6_o2": "Занятость вырастет, а нуклеосома будет вытеснена с сайта.", "p1a_6_o3": "Занятость не изменится: пионерный ТФ слабо связывает нуклеосому.", "p1a_6_k": "Пионерный ТФ связывает частичный мотив на нуклеосоме с сродством, близким к сродству к свободной ДНК, но нуклеосому сам не вытесняет.", "p1a_6_e": "Для Oct4 и Sox2 in vitro кажущаяся Kd к нуклеосоме LIN28B близка к Kd для свободной ДНК, у Klf4 она хуже в 3–12 раз (Soufi 2015, EMSA); пионерная активность связана с узнаванием частичного мотива. В модели нуклеосома снижает сродство Oct4 в 1,27 раза, поэтому занятость растёт с 4,1 % до 89 %, а доля молекул с нуклеосомой остаётся 100 %, сигнал ATAC-seq — 0,02. Вытеснение нуклеосомы пионерным ТФ в модель не заложено.", "p1a_6_w2": "Пионерный ТФ связывается с частичным мотивом на нуклеосоме, но вытеснение нуклеосомы ему в этих опытах не приписывают: в модели доля молекул с нуклеосомой остаётся 100 %.", "p1a_6_w3": "Сродство Oct4 к нуклеосоме близко к сродству к свободной ДНК, а краевой ТФ слабо связывает сайт около оси симметрии; поэтому при замене занятость заметно вырастает.", "p1a_7_q": "Сайт находится на свободной ДНК (вне нуклеосомы), содержание ТФ в 100 раз ниже Kd на свободной ДНК. Содержание ТФ повышают в 1000 раз. Как изменятся сигнал ATAC-seq и сигнал ChIP-seq на сайте (в модели — условные индексы)?", "p1a_7_o1": "Оба сигнала вырастут: пик ATAC-seq показывает связанный ТФ.", "p1a_7_o2": "Сигнал ATAC-seq вырастет, а сигнал ChIP-seq не изменится.", "p1a_7_o3": "Сигнал ATAC-seq не изменится, а сигнал ChIP-seq вырастет.", "p1a_7_k": "ATAC-seq регистрирует вставку Tn5 в доступную ДНК и не отражает число молекул ТФ на ней; ChIP-seq отражает занятость сайта.", "p1a_7_e": "Сайт на свободной ДНК в модели одинаково доступен для Tn5 при любом содержании ТФ, поэтому сигнал ATAC-seq остаётся 1,00; сигнал ChIP-seq в модели равен занятости и растёт с 0,01 до 0,91. В опытах пик ATAC-seq определяется вставкой Tn5, а не связыванием ТФ (Buenrostro 2013).", "p1a_7_w1": "Пик ATAC-seq показывает доступность ДНК для Tn5, а не занятость сайта ТФ: сайт доступен и без ТФ, поэтому сигнал не растёт с его содержанием.", "p1a_7_w2": "Занятость сайта растёт с содержанием ТФ, а ChIP-seq её отражает; поэтому сигнал ChIP-seq при росте содержания в тысячу раз не остаётся прежним.", "p1a_8_q": "Образцы X, Y, Z получены при трёх условиях, перечисленных не по порядку букв: сайт на свободной ДНК при малом содержании ТФ; сайт у SHL 4,5 после работы ремоделера при большом содержании ТФ; сайт у SHL 4,5 без ремоделера при большом содержании ТФ. Какое условие соответствует образцу Z?", "p1a_8_o1": "Сайт у SHL 4,5 без работы ремоделера, большое содержание ТФ.", "p1a_8_o2": "Сайт у SHL 4,5 после работы ремоделера, большое содержание ТФ.", "p1a_8_o3": "Сайт на свободной ДНК без нуклеосомы, малое содержание ТФ.", "p1a_8_k": "У образца Z высоки сигналы ATAC-seq и ChIP-seq, а защита от MNase на сайте почти исчезла: сайт доступен и занят ТФ, а нуклеосомы над ним почти нет, как после сдвига нуклеосомы ремоделером.", "p1a_8_e": "По данным в таблице: у X высокий сигнал ATAC-seq, защиты от MNase нет (0 %), сигнал ChIP-seq слабый (0,09): сайт доступен, но ТФ мало. У Y сигнал ATAC-seq низкий (0,04), защита от MNase сохранена (100 %), сигнал ChIP-seq высокий (0,94), футпринт слабее (0,41) из-за короткого пребывания Rap1 на нуклеосоме. У Z сигнал ATAC-seq 0,97, защита от MNase 5,0 %, сигнал ChIP-seq 1,00, футпринт 0,92. Сигнал ATAC-seq один не различает X и Z; различают MNase-seq и ChIP-seq. Данные — расчёт учебной модели, не измерение.", "p1a_8_w1": "Это условие образца Y: у него защита от MNase сохранена (100 %), а сигнал ATAC-seq низкий (0,04), то есть нуклеосома остаётся над сайтом.", "p1a_8_w3": "Это условие образца X: у него слабый сигнал ChIP-seq (0,09); сайт доступен без нуклеосомы, но ТФ на нём мало.", "gn_n_core": "Октамер гистонов (кор нуклеосомы)", "g_n_core": "Кор нуклеосомы — октамер гистонов: по две молекулы H2A, H2B, H3 и H4. Вокруг него левой суперспиралью уложена нуклеосомная ДНК: около 147 п.н. в структуре с разрешением 1,9 Å (Davey 2002) и 146 п.н. в первой структуре с разрешением 2,8 Å (Luger 1997); это примерно 1,65 витка. На схеме упрощённо нарисованы ДНК и диск: хвосты гистонов, линкерный гистон H1 и соседние нуклеосомы не нарисованы.", "gn_n_dyad": "Ось симметрии (дьяда)", "g_n_dyad": "Ось симметрии — середина нуклеосомной ДНК, положение SHL 0. Вдоль ДНК положение измеряют в сверхспиральных положениях SHL: на один SHL приходится около 10 п.н., период около 10 п.н. наблюдали и у предпочтительных положений ТФ (Zhu 2018). В модели доля времени, когда сайт раскрыт, убывает от входа к оси симметрии; числа для оси симметрии получены экстраполяцией, а не измерены для Rap1.", "gn_n_end": "Вход: конец нуклеосомной ДНК", "g_n_end": "Конец нуклеосомной ДНК спонтанно отходит от октамера и возвращается («дыхание»). По реферату Li 2005 (in vitro, одиночные нуклеосомы) ДНК остаётся полностью завёрнутой около 250 мс, а развёрнутая ДНК заворачивается обратно за 10–50 мс. Из этих времён следует, что конец раскрыт примерно 4–17 % времени (расчёт). Поэтому доступность — вероятность, а не постоянное состояние.", "gn_n_site": "Сайт связывания ТФ", "g_n_site": "Сайт связывания — участок ДНК, который узнаёт ТФ. Ручка положения переносит сайт со свободной ДНК на нуклеосомную ДНК и вдоль неё от входа к оси симметрии. Для Rap1 время пребывания измерено у SHL 6,5 (46 с) и для того же сайта у SHL 4,5 (7,7 с) (Mivelaz 2020). Положение — не единственный фактор; подробнее в справке «Что упрощено».", "gn_n_tf": "ТФ на схеме: Rap1", "g_n_tf": "Значок ТФ показывает Rap1 (дрожжи), изученный in vitro в одномолекулярных опытах: на свободной ДНК долгая фаза пребывания 452 с, на нуклеосоме у входа 46 с, а частота присоединения сходна (Mivelaz 2020). Яркость значка пропорциональна занятости сайта. В опытах in vitro Rap1 нуклеосому сам не разворачивает и не вытесняет (потери FRET нет): для вытеснения промоторной нуклеосомы нужен ремоделер RSC (вкладка 2). У других ТФ нуклеосома может действовать иначе, поэтому Rap1 нельзя считать типичным ТФ. В продвинутом уровне ручка «Тип ТФ» заменяет Rap1 на условные типы: ТФ, захватывающий раскрытый сайт (гипотеза), ТФ с предпочтением оси симметрии (RFX5, SOX; Zhu 2018), Oct4 и Klf4 (Soufi 2015, EMSA, in vitro); значок остаётся прежним.", "gn_n_measure": "Как измеряют", "g_n_measure": "Время пребывания и частоту присоединения измеряют на одиночных молекулах (smTIRF): по вспышкам метки ТФ на сайте нуклеосомы или свободной ДНК (Mivelaz 2020, очищенные компоненты, in vitro). Долю времени раскрытия оценивают по FRET нуклеосомы и по скорости рестрикции сайта (Li 2005; Polach 1995). Показания на экране — расчёт учебной модели, а не данные прибора. Занятость в клетках измеряют иначе (ChIP-seq, футпринтинг; см. продвинутый уровень).", "gn_n_model": "Что упрощено", "g_n_model": "Модель считает установившееся состояние: время не рассчитывается. Измерено и взято из работ: времена пребывания Rap1 (452, 46 и 7,7 с; Mivelaz 2020, in vitro). Рассчитано из измеренного: константа раскрытия K = 1/(r − 1), где r — отношение времён пребывания на свободной ДНК и на нуклеосоме. Эти две точки задают форму кривой, поэтому их воспроизведение не служит независимой проверкой; независимая проверка — доля времени раскрытия конца (около 15 % против 4–17 % по расчёту из Li 2005). Учебная модель: глубже SHL 4,5 измерений для Rap1 нет, числа получены экстраполяцией экспоненты; константы раскрытия по положению из Anderson 2000 в модель не включены. Оговорка о положении: сайт S1 у SHL 4,5 удерживает Rap1 дольше 100 с, а тот же сайт S2, перенесённый на SHL 4,5, — 7,7 с (Mivelaz 2020); положение — не единственный фактор, важна и последовательность сайта, а модель калибрована по одному сайту (S2) и положение отдельно от последовательности не разделяет. Не учтены: последовательность нуклеосомы, несколько ТФ, ремоделеры, метки, H1, фибрилла.", "gn_n_measure_a": "Как измеряют: приборы продвинутого уровня", "g_n_measure_a": "ATAC-seq: транспозаза Tn5 вставляет метки в доступную ДНК (Buenrostro 2013). Сигнал показывает вероятность вставки, а не занятость ТФ; Tn5 вставляется неслучайно, в том числе у входа-выхода нуклеосомы (Sato 2019, in vitro). MNase-seq: нуклеаза переваривает ДНК между нуклеосомами, остаётся защищённый фрагмент около 147 п.н.; «хрупкие» нуклеосомы при сильном переваривании теряются (Kubik 2015). Футпринт: ТФ защищает ДНК от нуклеазы, но ТФ с временем пребывания порядка секунд футпринта не дают (Sung 2014). ChIP-seq усредняет занятость по клеткам и молекулам: он не различает «долго у немногих» и «недолго у многих». Блот на экране — условное изображение расчёта: полоса — условный индекс, а не мера потока, а отсутствие полосы не означает нулевого сигнала.", "gn_n_model_a": "Что упрощено: продвинутый уровень", "g_n_model_a": "Ко всем допущениям базового уровня добавлены следующие. Ремоделер: нуклеосома остаётся над сайтом 5 % времени (допущение); направление — сдвиг нуклеосомы RSC освобождает сайт, и Rap1 держится долго (Mivelaz 2020). Фибрилла: множитель 2,74 (46 с → 16,8 с) измерен для Rap1, для других ТФ перенесён как допущение. H4K16ac в модели снимает вклад фибриллы (Shogren-Knaak 2006, качественно); H3K56ac увеличивает раскрытие у входа, а у оси симметрии эффекта нет (Neumann 2009). Линкерный гистон H1 (×0,5), poly(dA:dT) (×2) и метилирование CpG (×3 или ×⅓) — направления из работ (Iwasaki 2016; Iyer 1995; Yin 2017), величины допущены. «Захват раскрытого сайта» — гипотеза с той же равновесной занятостью, но иной кинетикой; для оси симметрии величина допущена (Zhu 2018); для Oct4 и Klf4 взяты отношения сродства из EMSA (Soufi 2015), положение не учитывается. Приборы — расчёт: ATAC = доля времени доступности плюс фон 0,02; MNase = доля молекул с нуклеосомой; футпринт виден наполовину при пребывании 10 с (допущение; Sung 2014); ChIP = занятость. Время не рассчитывается, несколько ТФ одновременно не учтены.", "s2b_tube": "Пробирка (in vitro): нуклеосома у конца ДНК, ремоделер SNF2h человека", "s2b_site": "сайт", "s2b_site_aria": "Участок ДНК у конца, перекрытый нуклеосомой", "s2b_nuc_aria": "Нуклеосома", "s2b_sn_aria": "Ремоделер SNF2h", "s2b_atp_aria": "АТФ", "s2b_atp_chip": "АТФ", "s2b_gel_aria": "Нативный гель: дорожки в разные моменты времени", "s2b_gel_up": "в середине", "s2b_gel_low": "у конца", "s2b_pos_a": "у конца ДНК: {v}", "s2b_pos_b": "в середине: {v}", "s2b_scale": "Схема не в масштабе. Дорожки геля — моменты времени 0…10 мин (учебная модель).", "s2b_e": "Содержание SNF2h (фермент в избытке над нуклеосомами)", "s2b_e_fmt": "{v} нМ", "s2b_atp": "АТФ", "s2b_atp_0": "нет", "s2b_atp_1": "есть", "s2b_t": "Время после добавления фермента (учебная модель)", "s2b_t_fmt": "{v} мин", "s2b_how": "Как измеряют", "s2b_lim": "Что упрощено", "s2_r_shift": "Доля сдвинутых нуклеосом (нативный гель)", "s2_r_open": "Доступность сайта у конца ДНК (доля копий)", "s2_r_half": "Период полупревращения (расчёт)", "s2b_half_none": "нет сдвига", "s2b_half_fmt": "{v} с", "s2b_ref": "Серая метка — эталон: 100 нМ SNF2h и АТФ в тот же момент времени.", "s2b_when": "Прогноз на указанный момент после добавления фермента; ось времени — учебная модель, а не измеренный срок.", "p2b_ctl": "эталон: 100 нМ, АТФ есть", "s2b_take": "Нуклеосому сдвигает АТФазный мотор SNF2h, а не само связывание фермента: без АТФ положение нуклеосомы не меняется при любом содержании фермента. С АТФ скорость сдвига растёт с содержанием SNF2h и приближается к максимальной, поэтому прибавка фермента выше этого уровня почти не ускоряет реакцию. Это результат пробирки с одним ремоделером (SNF2h, 20 °C), а не описание клетки.", "s2b_c_noatp": "В пробирке {e} нМ SNF2h без АТФ: к {t} мин сдвинуто {v} нуклеосом, доступность сайта у конца ДНК — {o}.", "s2b_c_noatp_z": "Фермент связывается с нуклеосомой, но мотор без АТФ не перемещает ДНК, и положение нуклеосомы не меняется: связывание ремоделера не равно ремоделированию.", "s2b_c_start": "К {t} мин с {e} нМ SNF2h и АТФ сдвинуто лишь {v} нуклеосом, доступность сайта у конца ДНК — {o}.", "s2b_c_start_z": "Сдвиг нуклеосом идёт по одной экспоненте: в начале реакции доля сдвинутых мала и растёт со временем.", "s2b_c_lo": "К {t} мин с {e} нМ SNF2h и АТФ сдвинуто {v} нуклеосом, доступность сайта у конца ДНК — {o}.", "s2b_c_lo_z": "Каждая сдвинутая нуклеосома освобождает сайт у конца ДНК, поэтому доступность сайта растёт вместе с долей сдвинутых нуклеосом.", "s2b_c_mid": "К {t} мин с {e} нМ SNF2h и АТФ сдвинуто {v} нуклеосом, доступность сайта у конца ДНК — {o}.", "s2b_c_mid_z": "Доступность сайта у конца ДНК следует за долей сдвинутых нуклеосом: пока часть нуклеосом остаётся у конца ДНК, сайт у них перекрыт.", "s2b_c_hi": "К {t} мин с {e} нМ SNF2h и АТФ сдвинуто {v} нуклеосом, доступность сайта у конца ДНК — {o}.", "s2b_c_hi_z": "Большая часть нуклеосом смещена к середине ДНК, и сайт у конца ДНК в основном освобождён.", "p2b_1_q": "В пробирке нуклеосомы у конца ДНК смешаны с 300 нМ SNF2h, АТФ нет, сдвинутых нуклеосом нет. В пробирку добавили АТФ. Какой станет доля сдвинутых нуклеосом через 1 мин?", "p2b_1_o1": "Останется малой: при таком содержании фермента сдвиг определяется связыванием, а АТФ лишь немного его ускоряет.", "p2b_1_o2": "Станет высокой: мотор SNF2h с АТФ перемещает ДНК по октамеру, и большинство нуклеосом уходит от конца ДНК.", "p2b_1_o3": "Не изменится: сдвиг нуклеосомы идёт за счёт теплового движения ДНК, а АТФ для него не нужен.", "p2b_1_k": "Нуклеосому сдвигает АТФазный мотор SNF2h: с АТФ он перемещает ДНК по октамеру, без АТФ фермент связан с нуклеосомой, но её положение не меняется.", "p2b_1_e": "В модели при 300 нМ SNF2h через 1 мин с АТФ сдвинуто 90 % нуклеосом, без АТФ — 0 %; доступность сайта у конца ДНК растёт с 5 % до 90 %. Форма зависимости взята из опыта Gamarra 2018 (SNF2h человека, нуклеосомы 0/60, нативный гель, 20 °C, 5 мМ АТФ·MgCl₂): KMapp = 61 нМ, kmax = 2,5 мин⁻¹, h = 1,5 (это измерение, а не показание модели). Положение «без АТФ нет сдвига» принято в модели по определению АТФ-зависимого ремоделера.", "p2b_1_w1": "Связывание фермента с нуклеосомой не равно ремоделированию: при 300 нМ SNF2h связан с нуклеосомой, но без АТФ его мотор не перемещает ДНК, и на экране сдвинутых нуклеосом 0 %.", "p2b_1_w3": "Вариант предполагает, что АТФ не нужен. Для АТФ-зависимого ремоделера сдвиг требует гидролиза АТФ, поэтому без него доля сдвинутых остаётся 0 %.", "p2b_2_q": "В пробирке 30 нМ SNF2h и АТФ в насыщающем содержании; через 1 мин сдвинута часть нуклеосом. Содержание SNF2h увеличили в десять раз (до 300 нМ). Как изменится доля сдвинутых нуклеосом через 1 мин?", "p2b_2_o1": "Вырастет пропорционально содержанию фермента, то есть примерно в десять раз.", "p2b_2_o2": "Не изменится: скорость сдвига определяется АТФ, а не содержанием фермента.", "p2b_2_o3": "Вырастет заметно, но не в десять раз: скорость сдвига растёт с насыщением.", "p2b_2_k": "Скорость сдвига растёт с содержанием SNF2h по кривой с насыщением: при увеличении фермента в десять раз константа скорости вырастает меньше, чем в десять раз, потому что она ограничена максимальной скоростью мотора.", "p2b_2_e": "В модели через 1 мин доля сдвинутых нуклеосом растёт с 47 % до 90 %, а период полупревращения сокращается с 65 с до 18 с. Зависимость скорости от содержания фермента описана уравнением Gamarra 2018 (SNF2h человека, 20 °C, 5 мМ АТФ·MgCl₂): kmax = 2,5 мин⁻¹, KMapp = 61 нМ, h = 1,5 — измерение в пробирке, перенос на другие условия не проверен.", "p2b_2_w1": "Доля не может вырасти в десять раз: при 30 нМ она уже составляет 47 %, а больше всех нуклеосом сдвинуться не может. Скорость сдвига растёт с содержанием фермента не линейно, а с насыщением.", "p2b_2_w2": "Вариант предполагает, что фермента достаточно и без прибавки. На экране скорость зависит от содержания SNF2h: при 30 нМ период полупревращения 65 с, при 300 нМ — 18 с.", "p2b_3_q": "В пробирке 300 нМ SNF2h и АТФ в насыщающем содержании; через 1 мин сдвинута большая часть нуклеосом. Содержание SNF2h увеличили до 1000 нМ. Как изменится доля сдвинутых нуклеосом через 1 мин?", "p2b_3_o1": "Изменится мало: при 300 нМ скорость близка к максимальной, и добавка фермента почти не помогает.", "p2b_3_o2": "Вырастет почти до предела: чем больше фермента, тем быстрее идёт сдвиг, пока не сдвинутся все нуклеосомы.", "p2b_3_o3": "Уменьшится: избыток фермента занимает все нуклеосомы и мешает мотору их сдвигать.", "p2b_3_k": "Когда скорость сдвига близка к максимальной (kmax), дополнительный фермент почти не ускоряет реакцию: ограничивающей становится работа мотора, а не число молекул фермента.", "p2b_3_e": "В модели через 1 мин доля сдвинутых нуклеосом растёт с 90 % до 91 %, период полупревращения меняется с 18 с до 17 с. По измерению Gamarra 2018 (SNF2h человека, 20 °C) максимальная константа скорости составляет 2,5 мин⁻¹, что соответствует периоду полупревращения около 17 с — это расчёт из измеренного, а не показание прибора.", "p2b_3_w2": "Рост ограничен насыщением: между 300 и 1000 нМ доля сдвинутых нуклеосом на экране меняется с 90 % до 91 %, потому что скорость близка к максимальной.", "p2b_3_w3": "В модели избыток фермента не уменьшает долю сдвинутых нуклеосом: на экране она растёт с 90 % до 91 %. Торможение избытком фермента в прочитанной работе не описано.", "gn_r_nuc": "Нуклеосома у конца ДНК", "g_r_nuc": "В опыте используют нуклеосому, у которой с одной стороны нет линкерной ДНК, а с другой — линкерная ДНК длиной 60 п.н. (нуклеосомы 0/60, Gamarra 2018). Ремоделер SNF2h сдвигает такую нуклеосому к середине ДНК. Сдвинутая и исходная нуклеосомы по-разному проходят через гель, поэтому их доли можно измерить.", "gn_r_site": "Сайт у конца ДНК", "g_r_site": "Сайт у конца ДНК перекрыт нуклеосомой, пока она остаётся у конца. Доступность на экране — доля копий, где сайт открыт: у нуклеосомы у конца ДНК она мала (принято 5 %, допущение модели), после сдвига нуклеосомы к середине сайт освобождается. Доступность сайта не равна связыванию фактора и не равна активности гена.", "gn_r_snf2h": "Ремоделер SNF2h", "g_r_snf2h": "SNF2h — АТФазная субъединица ремоделеров семейства ISWI человека. В опыте Gamarra 2018 SNF2h был в избытке над нуклеосомами, и скорость сдвига описывалась уравнением k = kmax·E^h/(KMapp^h + E^h) с kmax = 2,5 мин⁻¹, KMapp = 61 нМ и h = 1,5 (20 °C, 5 мМ АТФ·MgCl₂). Эти числа относятся к SNF2h и этим условиям; для других ремоделеров и для клеток их переносить нельзя.", "gn_r_atp": "АТФ", "g_r_atp": "АТФ — источник энергии мотора. Ремоделер перемещает ДНК по октамеру ступенями: у RSC в одномолекулярном опыте шаг составляет около 2 п.н. (2,0 ± 0,1 п.н. при 20 мкМ АТФ и 1,9 ± 0,2 п.н. при 80 мкМ; Harada 2016, 20 °C), у ACF семейства ISWI паузы наступают после около 7 п.н., затем 3–4 п.н. (Blosser 2009). Размер шага относится к этим ремоделерам и методу; в сцене 2b шаг не моделируется.", "gn_r_gel": "Нативный гель", "g_r_gel": "В нативном геле белки и ДНК не разрушены, поэтому нуклеосомы разного положения идут с разной скоростью. На экране верхняя полоса — нуклеосомы в середине ДНК, нижняя — у конца ДНК; яркость полосы отражает долю. Дорожки — моменты времени 0…10 мин (учебная модель) и дорожка курсора.", "gn_r_measure": "Как измеряют", "g_r_measure": "В опыте, на котором построена сцена, смешивают очищенные нуклеосомы (20 нМ) с SNF2h в избытке и АТФ, через заданные интервалы останавливают реакцию и разделяют нуклеосомы по положению в нативном геле. Долю нуклеосом, оставшихся у конца ДНК, подгоняют одной экспонентой, а константы скорости при разном содержании фермента — уравнением с насыщением (Gamarra 2018). Период полупревращения на экране рассчитан как ln 2 / k и показанием прибора не является.", "gn_r_model": "Что упрощено", "g_r_model": "Из работы Gamarra 2018 взяты форма зависимости и три числа (kmax, KMapp, h). Допущения модели: сдвиг идёт до полного перехода всех нуклеосом (в прочитанных фрагментах плато не обсуждается); без АТФ сдвиг равен нулю; остаточная доступность сайта у конца ДНК принята 5 %. Диапазон содержания фермента 10–1000 нМ выбран для обучения; вне измеренного диапазона зависимость является экстраполяцией. Время — минуты пробирки (учебная модель), в клетках оно иное.", "s2a_top": "Клетки: район хроматина, который держит открытым комплекс BAF (SWI/SNF)", "s2a_top_pc": "Клетки: Polycomb-локус после посадки BAF (фибробласты мыши)", "s2a_baf": "Комплекс BAF", "s2a_baf_aria": "Комплекс BAF", "s2a_sub4": "SMARCA4", "s2a_sub4_aria": "Субъединица SMARCA4: высота столбика — содержание белка", "s2a_sub2": "SMARCA2", "s2a_sub2_aria": "Субъединица SMARCA2, паралог SMARCA4: высота столбика — содержание белка", "s2a_arid1a": "ARID1A", "s2a_arid1a_aria": "Субъединица ARID1A", "s2a_arid1b": "ARID1B", "s2a_arid1b_aria": "Субъединица ARID1B", "s2a_prc1": "PRC1", "s2a_prc1_aria": "Комплекс PRC1 на Polycomb-локусе", "s2a_tag_aria": "Включённое воздействие", "s2a_site": "доступный участок", "s2a_ub": "Ub", "s2a_me": "Me", "lg_q2_ub": "Ub в круге (2a, Polycomb-локус) — метка H2AK119ub1, которую ставит PRC1; чем прозрачнее значок, тем меньше метки осталось", "lg_q2_me": "Me в круге (2a, Polycomb-локус) — метка H3K27me3, которую ставит PRC2; чем прозрачнее значок, тем меньше метки осталось", "lg_q2_prc1": "рамка PRC1 (2a, Polycomb-локус) — комплекс на локусе; бледнеет, когда BAF его вытесняет", "lg_q2_chip": "капсула в рамке BAF (2a) — активное воздействие: препарат, деградер или мутант; щёлкните, чтобы открыть справку", "lg_q2_bar": "столбик SMARCA4 или SMARCA2 (2a) — содержание белка по вестерн-блоту, условный индекс: 1 — исходное; насыщается", "lg_q2_site": "прямоугольник на ДНК между нуклеосомами (2a) — исследуемый район; чем шире зазор, тем доступнее район (ATAC-seq)", "s2a_clock": "время: {v} мин (учебная модель)", "s2a_scale": "Схема не в масштабе. Высота столбика — содержание белка.", "s2a_scale2": "Между средними нуклеосомами — доступность. Ub — H2AK119ub1, Me — H3K27me3.", "s2a_loc": "Район", "s2a_loc_enh": "BAF-зависимый район", "s2a_loc_pc": "Polycomb-локус", "s2a_ivn": "Воздействие", "s2a_iv_none": "нет", "s2a_iv_brm": "BRM014", "s2a_iv_acbi": "ACBI1", "s2a_iv_dtag": "dTAG47", "s2a_iv_pfi": "PFI-3", "s2a_iv_mut": "мутант АТФазы", "s2a_par": "Паралог SMARCA2", "s2a_par_1": "есть", "s2a_par_0": "нокаут", "s2a_arid": "Субъединицы ARID", "s2a_arid_none": "норма", "s2a_arid_a1a": "без ARID1A", "s2a_arid_both": "без ARID1A и ARID1B", "s2a_wash": "Отмыть BRM014 на 60-й минуте", "s2a_t": "Время после воздействия (учебная модель)", "s2a_t_fmt": "{v} мин", "s2a_how": "Как измеряют", "s2a_lim": "Что упрощено", "s2a_r_atac": "Доступность района (ATAC-seq)", "s2a_r_s4": "SMARCA4 (вестерн-блот)", "s2a_r_s2": "SMARCA2 (вестерн-блот)", "s2a_r_ck": "SMARCA2 на хроматине (ChIP)", "s2a_r_rna": "Новая РНК (PRO-seq)", "s2a_r_prc1": "PRC1 на локусе", "s2a_r_ub1": "H2AK119ub1", "s2a_r_me3": "H3K27me3", "s2a_r_h3": "Общий гистон H3", "s2a_r_acc": "Доступность локуса (условный индекс)", "s2a_nobd": "нет полосы", "s2a_ref": "Серая метка — эталон: клетки без воздействия в тот же момент. Вестерн-блот условный и насыщается: «нет полосы» не означает точный нуль.", "s2a_plot_t": "Динамика после воздействия", "s2a_unit": "мин", "s2a_leg_f": "ATAC быстрых районов", "s2a_leg_s": "ATAC медленных районов", "s2a_leg_r": "новая РНК", "s2a_leg_prc1": "PRC1", "s2a_leg_ub1": "H2AK119ub1", "s2a_leg_me3": "H3K27me3", "s2a_leg_acc": "доступность локуса", "s2a_tab": "На {t} мин: ATAC быстрых районов {af}, медленных {as}, новая РНК {rna} (1 — клетки без воздействия).", "s2a_tab_pc": "На {t} мин: PRC1 {prc1}, H2AK119ub1 {ub}, H3K27me3 {me}, доступность локуса {acc} (1 — до посадки BAF).", "s2a_blot_t": "Накопительный блот (до четырёх сохранённых дорожек)", "s2a_blot_add": "Добавить дорожку", "s2a_blot_clear": "Очистить дорожки", "s2a_blot_hint": "Яркость полосы — условная шкала от нуля до значения в клетках без воздействия; для РНК различия малы, как и в опытах.", "s2a_b_s4": "SMARCA4 (вестерн)", "s2a_b_s2": "SMARCA2 (вестерн)", "s2a_b_ch": "SMARCA2 (ChIP)", "s2a_b_atac": "ATAC-seq", "s2a_b_rna": "PRO-seq", "s2a_min": "{v} мин", "s2a_lane_now": "сейчас", "s2a_lane_ref": "Дорожка 1 — клетки без воздействия в тот же момент.", "s2a_lane_nowk": "Дорожка 2 — текущие условия: {c}, {t} мин.", "s2a_lane_n": "Дорожка {i} — {c}, {t} мин.", "s2a_sh_none": "без воздействия", "s2a_sh_brm": "BRM014", "s2a_sh_wash": "BRM014, отмывка", "s2a_sh_acbi": "ACBI1", "s2a_sh_dtag": "dTAG47", "s2a_sh_pfi": "PFI-3", "s2a_sh_mut": "мутант АТФазы", "s2a_sh_par0": "нокаут SMARCA2", "s2a_sh_a1a": "без ARID1A", "s2a_sh_both": "без ARID1A и ARID1B", "s2a_sh_multi": "несколько", "s2a_lane_ctl": "контроль", "s2a_when": "Прогноз на указанный момент; ось времени — учебная модель, а не измерение.", "p2a_ctl": "эталон: без воздействия", "s2a_take": "Доступность района поддерживает мотор BAF: пока АТФаза активна, нуклеосомы остаются раздвинутыми; при остановке АТФазы доступность падает за минуты — часы. Связанный белок, число копий белка и работа мотора — разные величины, и опыт различает их по разным приборам.", "s2a_myst_t": "Три образца X, Y, Z", "s2a_myst_hint": "Клетки HAP1 через {n} мин после трёх разных воздействий (BRM014, ACBI1, PFI-3 в неизвестном порядке). Определите образец Y по приборам.", "s2a_myst_hint2": "Клетки HAP1 через {n} мин; названия воздействий раскрыты.", "s2a_tbl_s": "Образец", "s2a_c_none": "Клетки без воздействия: к {t} мин доступность района {a}, SMARCA4 и SMARCA2 на месте.", "s2a_c_none_z": "АТФаза BAF активна постоянно и поддерживает район открытым; остальные подписи сравнивают с этим состоянием.", "s2a_c_early": "К {t} мин доступность района ещё близка к исходной: {a}.", "s2a_c_early_z": "Доступность падает не мгновенно: нуклеосомы возвращаются в район за минуты, и в первые минуты различие мало.", "s2a_c_brm": "BRM014: к {t} мин доступность района {a}, белки SMARCA4 ({s4}) и SMARCA2 ({s2}) на месте, новая РНК {rna}.", "s2a_c_brm_z": "Ингибитор останавливает АТФазу, но не разрушает белок: полосы остаются, а доступность падает, потому что АТФаза остановлена.", "s2a_c_wash": "После отмывки BRM014: к {t} мин доступность района {a}, новая РНК {rna}.", "s2a_c_wash_z": "Когда ингибитор убран, АТФаза снова активна, и нуклеосомы раздвигаются: доступность возвращается за десятки минут.", "s2a_c_acbi": "ACBI1: к {t} мин доступность района {a}, SMARCA4 {s4}, SMARCA2 {s2}.", "s2a_c_acbi_z": "Деградер убирает оба белка-АТФазы, поэтому на блоте полосы слабеют; доступность падает вслед за убылью белка, медленнее ингибитора.", "s2a_c_dtag": "dTAG47: к {t} мин SMARCA4 {s4}, SMARCA2 {s2}, доступность района {a}.", "s2a_c_dtag_z": "Деградер убирает SMARCA4, слитый с dTAG, а SMARCA2 остаётся; паралог частично заменяет SMARCA4, поэтому доступность падает не до фонового уровня.", "s2a_c_dtag0": "dTAG47 без SMARCA2: к {t} мин SMARCA4 {s4}, доступность района {a}.", "s2a_c_dtag0_z": "Когда паралога нет, заменить SMARCA4 некому, и доступность падает почти до фонового уровня.", "s2a_c_pfi": "PFI-3: к {t} мин доступность района {a}, SMARCA2 на хроматине {ck}, новая РНК {rna}.", "s2a_c_pfi_z": "PFI-3 связывает бромодомен, но не останавливает мотор и не вытесняет эндогенный SMARCA2 с хроматина (Vangamudi 2015): это следствие механизма, а не отдельное измерение.", "s2a_c_mut": "Мутант АТФазы SMARCA4: к {t} мин доступность района {a}, SMARCA4 {s4}.", "s2a_c_mut_z": "Мутантный белок есть, но АТФазная активность в части комплексов утрачена, поэтому доступность снижена при нормальном содержании белка.", "s2a_c_par0": "Нокаут SMARCA2: доступность района {a}, SMARCA4 {s4}.", "s2a_c_par0_z": "Без воздействия на SMARCA4 доступность района сохраняется: работу мотора несёт SMARCA4.", "s2a_c_a1a": "Потеря ARID1A: доступность района {a}, SMARCA4 {s4}.", "s2a_c_a1a_z": "ARID1A — субъединица, а не мотор: её потеря снижает вклад комплекса в доступность умеренно; ARID1B частично замещает.", "s2a_c_both": "Потеря ARID1A и ARID1B: доступность района {a}, SMARCA4 {s4}.", "s2a_c_both_z": "Без обеих субъединиц ARID вклад комплекса ниже, и доступность снижена сильнее, чем при потере одной.", "s2a_c_multi": "Включено несколько воздействий: {list}. К {t} мин доступность района {a}, SMARCA4 {s4}, SMARCA2 {s2}.", "s2a_c_multi_z": "Воздействия складываются: итог зависит от того, сколько работы мотора осталось у комплекса.", "s2a_c_pc_start": "В первые минуты после посадки BAF на локусе: PRC1 {prc1}, H2AK119ub1 {ub}, H3K27me3 {me}.", "s2a_c_pc_start_z": "BAF садится на локус с задержкой около 2 мин, и пока метки и PRC1 на месте.", "s2a_c_pc_none": "Через {t} мин после посадки BAF: PRC1 {prc1}, H2AK119ub1 {ub}, H3K27me3 {me}, доступность локуса {acc}.", "s2a_c_pc_none_z": "BAF вытесняет PRC1 с локуса; метка H2AK119ub1 исчезает раньше H3K27me3, и доступность растёт вслед за снятием меток.", "s2a_c_pc_mut": "Через {t} мин с мутантом АТФазы: PRC1 {prc1}, H2AK119ub1 {ub}, доступность локуса {acc}.", "s2a_c_pc_mut_z": "Без АТФазной активности BAF не вытесняет PRC1 (Stanton 2017), метки остаются, локус закрыт.", "s2a_c_pc_brm": "Через {t} мин с BRM014: PRC1 {prc1}, H2AK119ub1 {ub}, доступность локуса {acc}.", "s2a_c_pc_brm_z": "Вытеснение зависит от АТФ; прямого опыта с BRM014 на этом локусе нет, это оценка по механизму.", "s2a_c_pc_pfi": "Через {t} мин с PFI-3: PRC1 {prc1}, H2AK119ub1 {ub}, доступность локуса {acc}.", "s2a_c_pc_pfi_z": "PFI-3 не останавливает мотор, поэтому вытеснение PRC1 идёт как без воздействия.", "s2a_c_myst": "Три образца X, Y, Z через {n} мин: по приборам выясните, что сделали с клетками.", "s2a_c_myst_z": "Один прибор не различает воздействия: ингибитор, деградер и PFI-3 по-разному меняют блот и ATAC.", "s2a_c_myst2": "Образцы через {n} мин: X — BRM014, Y — ACBI1, Z — PFI-3.", "s2a_c_myst2_z": "Из трёх воздействий белки на вестерн-блоте убирает деградер; ингибитор снижает ATAC при целых белках; PFI-3 не меняет ничего из измеренного.", "p2a_1_q": "В клетках HAP1 район держится открытым комплексом BAF. Добавили BRM014 — ингибитор АТФазы SMARCA2/4. Что будет через 60 мин с доступностью района (ATAC) и с содержанием SMARCA4 на блоте?", "p2a_1_o1": "Доступность упадёт, SMARCA4 на блоте останется: ингибитор останавливает мотор, но не разрушает белок.", "p2a_1_o2": "Доступность упадёт, и полоса SMARCA4 исчезнет: ингибитор АТФазы приводит к разрушению белка.", "p2a_1_o3": "Ничего не изменится: комплекс BAF не нужен для доступности района, она держится без него.", "p2a_1_k": "Ингибитор АТФазы останавливает мотор BAF, не разрушая белок: доступность падает, содержание белка прежнее.", "p2a_1_e": "В модели через 60 мин с BRM014 доступность района падает с ×1,0 до ×0,20, SMARCA4 остаётся ×1,0, новая РНК ×0,88. Чувствительность ATAC к потере мотора измерена в Schick 2021 (HAP1, BRM014 1 мкМ) и Iurlaro 2021 (мышиные ES-клетки); величины ×0,20 и ×0,88 — расчёт модели с подобранными константами.", "p2a_1_w2": "Ингибитор связывается с АТФазным центром и не вызывает деградацию; на блоте SMARCA4 остаётся ×1,0.", "p2a_1_w3": "Доступность района на экране падает до ×0,20: мотор BAF нужен, чтобы район оставался открытым.", "p2a_2_q": "Клетки HAP1 обработали PFI-3 — лигандом бромодомена SMARCA2/4 — на 60 мин. Что изменится в доступности района, в содержании SMARCA2 на хроматине (ChIP) и в новой РНК?", "p2a_2_o1": "Доступность упадёт так же, как от ингибитора АТФазы: бромодомен обеспечивает работу мотора.", "p2a_2_o2": "Практически ничего: PFI-3 не останавливает мотор и не вытесняет SMARCA2 с хроматина.", "p2a_2_o3": "SMARCA2 уйдёт с хроматина, и доступность района упадёт вслед за ним, как при деградации.", "p2a_2_k": "Бромодомен — не мотор: его лиганд не останавливает АТФазу и не вытесняет эндогенный SMARCA2, поэтому читаемые показатели не меняются.", "p2a_2_e": "В модели через 60 мин с PFI-3 доступность района ×1,0, SMARCA2 на хроматине ×1,0, новая РНК ×1,0. Основание — Vangamudi 2015 (по реферату): АТФазный домен, а не бромодомен, служит мишенью для подавления роста клеток, и PFI-3 не вытесняет эндогенный SMARCA2. Это следствие механизма, а не измерение ATAC.", "p2a_2_w1": "Доступность падает от ингибитора АТФазы, а не от лиганда бромодомена; на экране с PFI-3 она остаётся ×1,0.", "p2a_2_w3": "ChIP на экране остаётся ×1,0: PFI-3 не вытесняет эндогенный SMARCA2.", "p2a_3_q": "В клетках HAP1, где есть SMARCA2, деградируют SMARCA4 (dTAG47). Что будет с доступностью района и с SMARCA2 через 6 ч?", "p2a_3_o1": "Доступность упадёт почти до фонового уровня: без SMARCA4 комплекс не может поддерживать доступность.", "p2a_3_o2": "Доступность не изменится: SMARCA4 не нужен для района, поэтому его потеря ни на что не влияет.", "p2a_3_o3": "Доступность снизится, но не до фона: SMARCA4 не виден на блоте, а SMARCA2 на месте и частично замещает его.", "p2a_3_k": "Паралог SMARCA2 частично замещает SMARCA4, поэтому доступность падает, но остаётся выше фоновой.", "p2a_3_e": "В модели через 6 ч dTAG47 доступность района ×0,37, SMARCA4 нет полосы, SMARCA2 ×1,0. Деградация SMARCA4-dTAG почти полная за 2–3 ч (Schick 2021, HAP1); доля работы мотора, которую несёт SMARCA4, — допущение модели.", "p2a_3_w1": "На экране доступность ×0,37, а не почти до фонового уровня: в клетках есть SMARCA2.", "p2a_3_w2": "SMARCA4 исчезает с блота, и доступность падает до ×0,37: он нужен району.", "p2a_4_q": "SMARCA4 уже деградирован (dTAG47, 6 ч), доступность района снижена. Теперь в клетках нокаутируют ещё и SMARCA2. Что произойдёт?", "p2a_4_o1": "Доступность вырастет: паралог SMARCA2 мешал работе SMARCA4, и без него район откроется.", "p2a_4_o2": "Доступность упадёт почти до фона: заменить SMARCA4 в этом районе некому.", "p2a_4_o3": "Доступность не изменится: SMARCA2 в этом районе не участвует и ничего не заменяет.", "p2a_4_k": "Без обоих АТФаз мотора в комплексе нет, и доступность падает почти до фоновой.", "p2a_4_e": "В модели доступность района падает с ×0,37 до ×0,10, новая РНК с ×0,87 до ×0,82. Доступность почти полностью теряется при острой потере обеих АТФаз (Schick 2021, HAP1); фоновый уровень ×0,10 — допущение модели.", "p2a_4_w1": "Доступность на экране падает с ×0,37 до ×0,10: SMARCA2 помогал, а не мешал.", "p2a_4_w3": "SMARCA2 замещал SMARCA4, поэтому его нокаут снижает доступность.", "p2a_5_q": "На Polycomb-локусе в фибробластах мыши через 30 мин после посадки BAF рабочий комплекс уже вытеснил PRC1. Что будет с PRC1, с H2AK119ub1 и с доступностью локуса при мутанте АТФазы SMARCA4?", "p2a_5_o1": "PRC1 уйдёт так же, как в норме: для вытеснения достаточно присутствия самого BAF на локусе.", "p2a_5_o2": "PRC1 уйдёт быстрее: мутантный белок не связывается с локусом, и ничто не удерживает PRC1.", "p2a_5_o3": "PRC1 останется, метки сохранятся, доступность не вырастет: вытеснению нужна АТФаза.", "p2a_5_k": "Вытеснение PRC1 зависит от АТФазной активности SMARCA4, а не от присутствия BAF.", "p2a_5_e": "В модели через 30 мин рабочий BAF оставляет PRC1 ×0,03, H2AK119ub1 ×0,28, доступность локуса ×0,75; с мутантом PRC1 ×1,0, H2AK119ub1 ×1,0, доступность ×0,10. Порядок событий (PRC1 уходит раньше, ub1 исчезает раньше H3K27me3) измерен в Kadoch 2017; мутации АТФазы нарушают вытеснение PRC1 (Stanton 2017, по реферату); константы подобраны.", "p2a_5_w1": "На экране PRC1 с мутантом остаётся ×1,0, а в норме падает до ×0,03.", "p2a_5_w2": "Мутант не лишён связи с локусом; на экране PRC1 остаётся, а не уходит.", "p2a_6_q": "Клетки обрабатывают ACBI1; через 30 мин доступность района снижена лишь слегка, белки SMARCA4 и SMARCA2 ослаблены. Что покажут приборы, если вместо ACBI1 добавить BRM014?", "p2a_6_o1": "Доступность упадёт сильнее, а полосы на блоте останутся исходными: ингибитор белки не разрушает.", "p2a_6_o2": "Доступность не изменится: оба вещества действуют одинаково и дают те же показания приборов.", "p2a_6_o3": "Доступность вырастет, а полосы SMARCA4 и SMARCA2 на блоте исчезнут: ингибитор убирает белки.", "p2a_6_k": "Ингибитор действует на готовый белок сразу, а деградеру нужно время на убыль белка.", "p2a_6_e": "В модели через 30 мин доступность с ACBI1 ×0,79 (SMARCA4 и SMARCA2 ×0,55), с BRM014 ×0,33 (полосы ×1,0). Деградеры действуют за часы (ACBI1 3 мкМ — Schick 2021; DC50 за 18 ч — Farnaby 2019, MV-4-11), ингибитор — за минуты; скорость деградации принята одной для ACBI1 и dTAG47.", "p2a_6_w2": "На экране доступность с BRM014 ×0,33, а с ACBI1 ×0,79: действие различается.", "p2a_6_w3": "Доступность с BRM014 падает, а не растёт; полосы остаются ×1,0.", "p2a_7_q": "Клетки обработали BRM014, и доступность района потеряна. На 60-й минуте ингибитор отмыли. Что покажут приборы к 120-й минуте?", "p2a_7_o1": "Доступность останется потерянной: нуклеосомы не могут выйти из района.", "p2a_7_o2": "Доступность частично вернётся лишь в быстрых районах, ChIP SMARCA2 останется сниженным.", "p2a_7_o3": "Доступность почти полностью вернётся, а ChIP SMARCA2 вернётся к исходному.", "p2a_7_k": "Мотор BAF, освобождённый от ингибитора, снова раздвигает нуклеосомы: доступность восстанавливается за десятки минут.", "p2a_7_e": "В модели к 120-й минуте без отмывки доступность ×0,12, SMARCA2 на хроматине ×0,70, новая РНК ×0,84; с отмывкой на 60-й минуте доступность ×0,92, ChIP ×1,0, РНК ×0,95. Возврат за 15–60 мин после отмывки — Iurlaro 2021 (по подписям рисунков); константы подобраны.", "p2a_7_w1": "Доступность на экране возвращается до ×0,92: нуклеосомы могут снова расходиться.", "p2a_7_w2": "ChIP SMARCA2 на экране возвращается к ×1,0, а доступность ×0,92 — не только быстрые районы.", "p2a_8_q": "Три образца клеток HAP1 через 60 мин получили BRM014, ACBI1 и PFI-3 в неизвестном порядке; результаты в таблице и на блоте. Чему соответствует образец Y?", "p2a_8_o1": "BRM014: в образце Y полосы SMARCA4 и SMARCA2 ослаблены, потому что ингибитор убирает белок.", "p2a_8_o2": "ACBI1: ослаблены полосы блота и ChIP, ATAC снижена умеренно — так действует деградер.", "p2a_8_o3": "PFI-3: в образце Y доступность района снижена, как при ингибировании мотора.", "p2a_8_k": "Полосы вестерн-блота с
