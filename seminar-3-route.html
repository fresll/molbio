,"note":"Новый партнёр может удерживать белок в цитоплазме или у мембраны; например, связывание 14-3-3 удерживает транскрипционный фактор FOXO вне ядра."},{"on":["kin","sub","deg"],"p":["sub"],"show":["k1","e4"],"note":"Фосфорилированный мотив может стать участком узнавания убиквитин-лигазы: белок метится убиквитином и расщепляется в протеасоме."},{"on":["pp"],"show":["p1"],"note":"Фосфатаза гидролизует фосфоэфирную связь: белок возвращается в исходное состояние без синтеза и разрушения."}]}},"section":1,"number":8,"question":2},{"id":"kinase-phosphatase","questions":[2],"title":"Как пара киназа — фосфатаза задаёт уровень и скорость переключения","keywords":["стационар","время релаксации","kк","kф","p*","τ","киназа","фосфатаза","опорная остановка"],"lead":["Опорная остановка 5 из 8 · доля, поток и время: доля фосфорилированного белка зависит от отношения констант скорости (kк/kф), а время выхода на неё — от суммы этих констант; продолжает остановку 4.","Доля фосфорилированного белка задаётся двумя одновременно работающими ферментами.","Уровень зависит от отношения их активностей, а время выхода на него — от суммы."],"mechanism":["Скорость фосфорилирования пропорциональна доле нефосфорилированного белка, скорость дефосфорилирования — доле фосфорилированного.","[[T24|Стационарная доля]] p* = kк/(kк + kф) зависит только от отношения констант; на плато потоки kк(1 − p*) и kф·p* равны, а реакции продолжаются.","[[T25|Время релаксации]] τ = 1/(kк + kф): за время τ доля проходит около 63 % пути к новому уровню; чем выше обе активности, тем короче τ."],"paragraphs":["Представим 100 одинаковых молекул фосфоламбана. Киназа присоединяет фосфат к тем из них, которые его не несут, а фосфатаза отщепляет фосфат от тех, которые его несут; обе реакции идут одновременно и непрерывно. Пока фосфорилируется больше молекул, чем дефосфорилируется, доля фосфорилированных растёт. Когда число молекул, получающих фосфат за секунду, сравнивается с числом молекул, теряющих его, доля перестаёт меняться. Реакции при этом не прекращаются: одни молекулы фосфорилируются, другие дефосфорилируются, а доля в среднем остаётся постоянной. Постоянная доля означает равенство потоков, а не отсутствие реакций.","Рассмотрим один участок фосфорилирования. Киназа и фосфатаза работают одновременно и непрерывно. Если оба фермента далеки от насыщения субстратом, скорость фосфорилирования равна kк(1 − p), а скорость дефосфорилирования — kф·p, где p — доля фосфорилированных молекул, а kк и kф — [[T26|эффективные константы скорости]] первого порядка, в которые уже входят количество и активность фермента. Изменение доли описывается уравнением dp/dt = kк(1 − p) − kф·p. Эти два произведения — потоки vк и vф в долях пула в секунду.","Из уравнения следуют два вывода. Первый: стационарная доля p* = kк/(kк + kф) зависит от отношения констант, а в стационаре равны не константы, а потоки: kк(1 − p*) = kф·p*. Например, при kк = 0,03 с⁻¹ и kф = 0,01 с⁻¹ получаем p* = 0,75, и оба потока равны 0,0075 доли пула в секунду; константа фосфорилирования втрое больше, потому что она должна уравновесить втрое меньшую долю нефосфорилированных молекул. Одну и ту же долю можно получить, повысив активность киназы или понизив активность фосфатазы, поэтому рост фосфорилирования сам по себе не указывает на активацию киназы. Второй: доля выходит на новый уровень экспоненциально с характерным временем τ = 1/(kк + kф). За время τ она проходит около 63 % пути к новому уровню, за 3τ — около 95 %; τ — не время полного завершения. Если kк утроить с 0,01 до 0,03 с⁻¹ при kф = 0,04 с⁻¹, p* вырастет с 0,2 лишь до 0,43, а τ сократится с 20 до 14 с.","Высокая скорость оборота цикла фосфорилирования и дефосфорилирования позволяет получить быстрый ответ при том же стационарном уровне, но требует непрерывного расхода ATP, пропорционального потоку. Сравните две пары: kк = 0,01 и kф = 0,04 с⁻¹ либо kк = 0,05 и kф = 0,20 с⁻¹. Отношение у них одинаково (p* = 0,2), а сумма различается в пять раз (τ = 20 и 4 с). Одно и то же пробное воздействие — подавление киназы — делает различие видимым: во второй паре доля фосфорилированного белка снижается в пять раз быстрее. Если киназу подавить полностью, доля снижается с характерным временем 1/kф: так в клетке оценивают активность фосфатазы.","Начните с вида «Молекулы»: выберите число молекул и пару констант, меняйте время и сравнивайте число актов фосфорилирования и дефосфорилирования за последние 20 с. Затем перейдите к виду «Расчёт по формуле», меняйте kк и kф и следите за потоками. Расчёт выполнен по тем же формулам, что в практикуме."],"trap":["Время переключения задаёт фермент, который изменился.","Время релаксации τ = 1/(kк + kф) зависит от обеих констант. Если снизить активность фосфатазы, доля вырастет, но новый уровень установится медленнее."],"conditions":"Расчёт по формулам главы 3 (§3.8; Goldbeter и Koshland 1981): закрытый пул субстрата, ферменты далеки от насыщения, концентрации ферментов и ATP постоянны. Константы kк и kф — учебные значения в с⁻¹; закачка Ca²⁺ рассчитана для учебной модели фосфоламбана (см. следующий шаг). Вид «Молекулы» — стохастическая учебная модель: на каждом шаге 0,05 с у каждой молекулы своя вероятность реакции (kк·0,05 или kф·0,05); траектории случайны, но воспроизводятся при каждом открытии.","sources":["Goldbeter1981","Ferrell2014"],"quiz":{"id":"S3-kinase-phosphatase","question":"В двух клетках доля фосфорилированного белка одинакова — 0,5. В первой kк = kф = 0,1 с⁻¹, во второй kк = kф = 0,01 с⁻¹. Чем различаются эти клетки?","options":[{"id":"S3-kinase-phosphatase-1","text":"Первая быстрее выходит на новый уровень при смене сигнала","correct":true,"feedback":"τ = 1/(kк + kф): в первой клетке 5 с, во второй 50 с. Уровень одинаков, а скорость ответа различается в десять раз."},{"id":"S3-kinase-phosphatase-2","text":"Ничем: одинаковый уровень означает одинаковое поведение","correct":false,"feedback":"Стационарная доля зависит от отношения констант, а скорость переключения — от их суммы. При одинаковом отношении суммы здесь различаются в десять раз."},{"id":"S3-kinase-phosphatase-3","text":"Вторая быстрее отвечает, потому что тратит меньше ATP","correct":false,"feedback":"Меньший расход ATP во второй клетке связан как раз с низкими активностями ферментов, а они дают медленный ответ: τ = 50 с против 5 с."}]},"widget":{"kind":"q2pair","title":"","s":{"title":"Условная пара PKA — PP1 на фосфоламбане","status":"Учебная модель: случайные события у отдельных молекул и расчёт по формулам главы 3 (§3.8)","kkL":"Активность PKA, kк (×0,001 с⁻¹)","kfL":"Активность PP1, kф (×0,001 с⁻¹)","unit":"с⁻¹","u_s":"с","l_p":"доля pSer16-PLN после включения киназы","l_ps":"стационарный уровень p*","xL":"время, с","yL":"доля pSer16-PLN, %","m_p":"p*","m_tau":"τ","m_up":"скорость закачки Ca²⁺ (относительно скорости без PLN)","note":"Стационарная доля pSer16-PLN — {p}, время релаксации — {tau} с. На плато оба потока равны {v} доли пула в секунду. Закачка Ca²⁺ в СР — {up} % от скорости без фосфоламбана (при 0,3 мкМ Ca²⁺).","viewL":"Вид","views":["Молекулы","Расчёт по формуле"],"popL":"Число молекул PLN","pops":["20 молекул","100 молекул"],"popN":[20,100],"pairL":"Пара констант","pairs":["пара А: kк = 0,01, kф = 0,04 с⁻¹ (p* = 0,2; τ = 20 с)","пара Б: kк = 0,05, kф = 0,20 с⁻¹ (p* = 0,2; τ = 4 с)"],"pairVals":[[0.01,0.04],[0.05,0.2]],"testL":"Пробное воздействие","tests":["без воздействия","на 60-й секунде подавить киназу (kк = 0)"],"tL":"Время от включения киназы","mol_desc":"Молекулы фосфоламбана: светлые без фосфата, жёлтые фосфорилированы","mol_legend":"Каждый кружок — молекула фосфоламбана: светлый — без фосфата, жёлтый — фосфорилирован. Киназу включили в момент 0; все молекулы были без фосфата.","l_det":"расчёт по формуле","l_sim":"молекулы (случайный ход)","m_now":"Фосфорилировано (из {N})","m_win_k":"Актов фосфорилирования за 20 с","m_win_f":"Актов дефосфорилирования за 20 с","note_rise":"Фосфорилировано {n} из {N} молекул (доля {p}). Актов фосфорилирования больше, чем дефосфорилирования, поэтому доля растёт; новый уровень устанавливается за время порядка τ = {tau} с.","note_flat":"Фосфорилировано {n} из {N} молекул (доля {p}). Потоки в обе стороны примерно равны: одни молекулы получают фосфат, другие теряют его, а доля в среднем не меняется. Небольшие колебания вокруг среднего случайны.","note_off":"Киназа подавлена: актов фосфорилирования нет, доля снижается только за счёт фосфатазы с характерным временем 1/kф = {tau} с (за это время остаётся около 37 % прежней доли). В этом временном окне подсчитываются только реакции, произошедшие после подавления киназы.","cmp":"Обе пары дают p* = 0,2, но у пары Б сумма констант в пять раз больше: плато достигается за секунды, а после того же пробного воздействия доля фосфорилированного белка снижается в пять раз быстрее. Потоки на плато у пары Б тоже в пять раз больше (0,040 против 0,008 доли пула в секунду): цикл расходует больше ATP.","yL2":"поток, 10⁻³ доли пула в секунду","title2":"Потоки фосфорилирования и дефосфорилирования","l_vk":"vк = kк(1 − p)","l_vf":"vф = kф·p","m_flux":"Потоки на плато, vк = vф"}},"section":1,"number":9,"question":2,"exam_quiz":{"question":"В двух культурах доля фосфорилированного белка повысилась с 0,2 до 0,5, общее количество белка не изменилось. Затем в обеих культурах быстро и полностью подавили киназу. В первой культуре фосфорилированная доля падает так же быстро, как в контроле, во второй — заметно медленнее. Что следует из этого для линейной модели с одной киназой и одной фосфатазой, если вмешательства не меняют других параметров?","options":[{"id":"S3-kinase-phosphatase-x2","text":"В обеих культурах усилена киназа, так как доля фосфорилированного белка одинакова","correct":false,"feedback":"Одинаковая стационарная доля не определяет причину: она зависит от отношения констант скорости киназной и фосфатазной реакций. Различие скоростей спада после остановки киназы показывает, что значения фосфатазной константы разные."},{"id":"S3-kinase-phosphatase-x1","text":"В первой культуре усилена киназа, во второй ослаблена фосфатаза","correct":true,"feedback":"После полной остановки киназы остаётся лишь дефосфорилирование, и доля падает с константой фосфатазной реакции. В первой культуре она как в контроле, значит, прежний уровень повышен за счёт киназы. Во второй константа меньше, значит, ослаблена фосфатаза."},{"id":"S3-kinase-phosphatase-x3","text":"Во второй культуре фосфатаза активнее, потому что спад идёт медленнее","correct":false,"feedback":"Время спада обратно пропорционально константе дефосфорилирования. Более медленный спад означает меньшую активность фосфатазы, а не большую."}]}},{"id":"phospholamban","questions":[2],"title":"Как фосфорилирование фосфоламбана ускоряет закачку Ca²⁺","keywords":["фосфоламбан","PLN","SERCA2a","Ser16","PP1","кардиомиоцит","изопротеренол"],"lead":["[[T27|Фосфоламбан]] тормозит кальциевый насос [[T28|SERCA2a]] кардиомиоцита, пока не фосфорилирован.","PKA снимает торможение, фосфорилируя фосфоламбан по Ser16, а PP1, дефосфорилируя его, торможение восстанавливает."],"mechanism":["Нефосфорилированный PLN снижает кажущееся сродство SERCA2a к Ca²⁺, и при субмикромолярной концентрации Ca²⁺ насос работает медленнее.","При β-адренергической стимуляции PKA фосфорилирует PLN по Ser16; торможение снимается, Ca²⁺ быстрее возвращается в СР.","[[T29|PP1]] дефосфорилирует PLN, и после прекращения сигнала торможение восстанавливается."],"paragraphs":["Фосфоламбан — небольшой белок мембраны саркоплазматического ретикулума (СР) кардиомиоцита. В нефосфорилированном состоянии он связывается с Ca²⁺-АТФазой SERCA2a и снижает её кажущееся сродство к Ca²⁺: в опытах с ферментом, экспрессированным в клетках насекомых, фосфоламбан повышал на 200 нМ концентрацию Ca²⁺, необходимую для половины максимальной активности, не меняя максимальной скорости (Mahaney 2000). Поэтому при той концентрации Ca²⁺, которая бывает в цитозоле во время спада Ca²⁺-транзиента, насос работает медленнее.","При стимуляции β-рецепторов PKA фосфорилирует фосфоламбан по Ser16, торможение снимается, Ca²⁺ быстрее закачивается в СР, и спад транзиента свободного Ca²⁺ ускоряется. PKA при этом фосфорилирует и другие белки, поэтому PLN — основной, но не единственный путь ускорения спада Ca²⁺. Механическое расслабление определяется не только скоростью спада свободного Ca²⁺: оно зависит и от отсоединения Ca²⁺ от тропонина C, и от кинетики поперечных мостиков. Фосфорилирование тропонина I меняет связывание Ca²⁺ с миофиламентами, а не откачивает Ca²⁺ из цитозоля (Briston 2014); в опытах на мышах главный вклад в ускорение нарастания давления и расслабления в целом организме давало фосфорилирование белка C, связывающего миозин (Gresham и Stelzer 2016). У кардиомиоцитов мышей без фосфоламбана спад Ca²⁺ быстрый уже в покое, а ответ на изопротеренол сохраняется, хотя и слабее, чем в норме (Wolska 1996).","Доля фосфорилированного фосфоламбана задаётся парой PKA — PP1 по правилу предыдущего шага. PP1 — главная фосфатаза фосфоламбана; при β-стимуляции PKA фосфорилирует белок ингибитор-1, и фосфорилированный ингибитор-1 подавляет PP1 (Kranias и Hajjar 2012). Сигнал, следовательно, одновременно ускоряет фосфорилирование и замедляет дефосфорилирование.","Переключите условия на схеме: учебная модель показывает долю фосфоламбана, фосфорилированного по Ser16, и время полуспада Ca²⁺-транзиента в норме, после пропранолола, у клеток с заменой S16A, без фосфоламбана и под действием ингибитора фосфатаз."],"trap":["Фосфорилированный фосфоламбан сам переносит Ca²⁺ в ретикулум.","Насос SERCA2a переносит Ca²⁺ за счёт гидролиза ATP. Фосфоламбан — регуляторный белок: нефосфорилированный он тормозит насос, а фосфорилирование это торможение снимает."],"conditions":"Учебная модель кардиомиоцита мыши (та же, что в практикуме 2п): изопротеренол с 1-й мин, относительные величины, время полуспада Ca²⁺-транзиента — учебная оценка. Сдвиг сродства SERCA2a — Mahaney 2000 (фермент собаки в клетках Sf21); ответ клеток PLN⁻/⁻ — Wolska 1996 (кардиомиоциты мыши, изопротеренол 0,05 мкМ); клетки с PLN S16A — Chu 2000 (трансгенные мыши на фоне PLN⁻/⁻); роль ингибитора-1 — обзор Kranias и Hajjar 2012. Время полуспада свободного Ca²⁺ — учебная оценка; сила и длина клетки в модели не рассчитываются, вклад других эффектов β-стимуляции задан одной феноменологической поправкой, а не откачкой Ca²⁺ тропонином.","sources":["MacLennan2003","Mahaney2000","Wolska1996","Chu2000","Luo1998","KraniasHajjar2012","Briston2014","Gresham2016"],"quiz":{"id":"S3-phospholamban","question":"Каким образом фосфорилирование фосфоламбана по Ser16 ускоряет спад Ca²⁺-транзиента в кардиомиоците?","options":[{"id":"S3-phospholamban-1","text":"Снимает торможение Ca²⁺-насоса SERCA2a","correct":true,"feedback":"Нефосфорилированный фосфоламбан снижает кажущееся сродство SERCA2a к Ca²⁺. После фосфорилирования Ser16 торможение снимается, насос быстрее закачивает Ca²⁺ в СР, и концентрация свободного Ca²⁺ в цитозоле снижается быстрее. Механическое расслабление зависит ещё и от свойств миофиламентов."},{"id":"S3-phospholamban-2","text":"Делает фосфоламбан переносчиком Ca²⁺ в СР","correct":false,"feedback":"Фосфоламбан не переносит ионы: это регуляторный белок насоса. SERCA2a переносит Ca²⁺ за счёт гидролиза ATP."},{"id":"S3-phospholamban-3","text":"Ускоряет выход Ca²⁺ из СР в цитозоль","correct":false,"feedback":"Выход Ca²⁺ из СР обеспечивают рианодиновые рецепторы. Фосфоламбан регулирует обратный поток — закачку Ca²⁺ в СР, которая и определяет скорость спада транзиента."}],"rev":2},"widget":{"kind":"q2cell","title":"","s":{"title":"Кардиомиоцит мыши: доля pSer16-PLN и спад Ca²⁺-транзиента","status":"Учебная модель, относительные величины","modes_label":"Условия","modes":["норма + изопротеренол","+ пропранолол на 8-й мин","PLN S16A + изопротеренол","нет PLN + изопротеренол","каликулин A без агониста"],"conds":[{"geno":"wt","iso":true,"iv":"0"},{"geno":"wt","iso":true,"iv":"prop"},{"geno":"s16a","iso":true,"iv":"0"},{"geno":"ko","iso":true,"iv":"0"},{"geno":"wt","iso":false,"iv":"caly"}],"notes":["Изопротеренол активирует PKA; доля pSer16-PLN растёт с 0,13 до 0,75, время полуспада Ca²⁺-транзиента сокращается со 180 до 108 мс.","После пропранолола активность PKA падает, PP1 дефосфорилирует фосфоламбан: доля pSer16-PLN снижается вдвое примерно за 2 мин и к 14-й мин почти возвращается к исходной.","Ser16 заменён на аланин: фосфоламбан не фосфорилируется и продолжает тормозить SERCA2a; спад Ca²⁺ ускоряется только за счёт других эффектов β-стимуляции (192 → 151 мс).","Без фосфоламбана насос не заторможен уже в покое, и время полуспада Ca²⁺-транзиента составляет 110 мс; при изопротереноле оно сокращается лишь до 95 мс.","Агониста нет, но ингибитор PP1 и PP2A подавляет дефосфорилирование, уравновешивавшее базальную активность PKA: доля pSer16-PLN растёт до 0,54 к 15-й мин."],"l_p":"доля pSer16-PLN","l_a":"активность PKA","xL":"время от начала опыта, мин","yL":"% (доля или активность)","m_p10":"pSer16-PLN на 10-й мин","m_th0":"время полуспада транзиента, 0 мин","m_th10":"на 10-й мин","m_th15":"на 15-й мин","u_ms":"мс","none":"PLN нет","legend":"Сплошная линия — доля фосфоламбана, фосфорилированного по Ser16; пунктир — активность PKA в процентах от максимальной при изопротереноле. Показано время полуспада свободного Ca²⁺ в цитозоле; сила и длина клетки в модели не рассчитываются."}},"section":1,"number":10,"question":2},{"id":"ultrasensitivity","questions":[2],"title":"Откуда берётся резкое переключение","keywords":["сверхчувствительность","нулевой порядок","многосайтовость","бистабильность","Голдбетер","Кошланд"],"lead":["Простая пара киназа — фосфатаза отвечает плавно.","Резкий переход появляется при насыщении ферментов субстратом и при фосфорилировании нескольких участков."],"mechanism":["Если ферменты далеки от насыщения, доля фосфорилированной формы плавно возрастает с увеличением отношения активностей киназы и фосфатазы.","Если оба фермента насыщены субстратом, доля резко возрастает от значения, близкого к нулю, до значения, близкого к единице, в узком интервале около равенства их максимальных скоростей.","Резкость (сверхчувствительность) не равна бистабильности: кривая крутая, но каждому значению входного сигнала соответствует одно состояние. Бистабильность требует эффективной положительной обратной связи и проверяется опытом с разной предысторией."],"paragraphs":["Формула предыдущего шага даёт гиперболическую зависимость: чтобы доля фосфорилированного белка выросла с 0,1 до 0,9, отношение активностей киназы и фосфатазы нужно изменить примерно в 80 раз. Между «выключено» и «включено» нет качественной границы.","Goldbeter и Koshland (1981) показали, что та же пара ферментов отвечает резко, если концентрация субстрата намного выше констант Михаэлиса обоих ферментов. Тогда каждый фермент работает почти с максимальной скоростью, независимо от концентрации субстрата ([[T31|режим нулевого порядка]]). Пока максимальная скорость киназы меньше максимальной скорости фосфатазы, почти весь субстрат дефосфорилирован; когда максимальная скорость киназы становится больше, почти весь субстрат фосфорилирован. Переход от 0,1 до 0,9 укладывается в интервал отношения скоростей примерно от 0,9 до 1,1.","Второй механизм резкости — [[T32|многосайтовое фосфорилирование]]: если для изменения свойств белка нужны фосфаты на нескольких участках, а киназа за одно связывание модифицирует в среднем один участок, зависимость доли полностью модифицированной формы от активности киназы более крутая, чем зависимость доли модифицированных участков. [[T33|Бистабильность]] — два устойчивых состояния при одном и том же значении входного сигнала — требует эффективной положительной обратной связи. Её создаёт отдельная петля обратной связи при достаточной нелинейности; положительная обратная связь может возникать и внутри многосайтового цикла без добавленной петли (Markevich 2004). Крутая зависимость сама по себе бистабильность не доказывает: её устанавливают опытом с разной предысторией сигнала (гистерезис). Обратные связи и бистабильность разбираются в семинаре 4.","Меняйте положение ползунка: при насыщении (оранжевая кривая) небольшое изменение отношения скоростей около 1 переключает почти весь пул."],"trap":["Белок с двумя состояниями — «фосфорилирован» и «нефосфорилирован» — всегда даёт резкий ответ «всё или ничего».","Пара киназа — фосфатаза без дополнительных условий отвечает плавно. Резкость возникает при насыщении ферментов, многосайтовости или обратной связи; крутая кривая в опыте не указывает, какой из механизмов работает."],"conditions":"Расчёт по уравнению стационарного баланса при кинетике Михаэлиса — Ментен (глава 3, §3.9; Goldbeter и Koshland 1981); K — отношение константы Михаэлиса к общей концентрации субстрата, одинаковое для киназы и фосфатазы. Это расчёт, а не измерение.","sources":["Goldbeter1981","Ferrell2014","Ubersax2007","Markevich2004"],"quiz":{"id":"S3-ultrasensitivity","question":"При каком условии пара киназа — фосфатаза переводит почти весь субстрат из одной формы в другую при небольшом изменении отношения их активностей?","options":[{"id":"S3-ultrasensitivity-1","text":"Когда активности обоих ферментов очень высоки","correct":false,"feedback":"Высокие активности обоих ферментов ускоряют выход на новый стационарный уровень, но не делают зависимость крутой: в линейном режиме доля по-прежнему задаётся гиперболой kк/(kк + kф)."},{"id":"S3-ultrasensitivity-2","text":"Когда киназа в десять раз активнее фосфатазы","correct":false,"feedback":"Соотношение 10 : 1 задаёт высокий уровень фосфорилирования, но ничего не говорит о крутизне перехода. Резкость определяется режимом работы ферментов, а не самим отношением."},{"id":"S3-ultrasensitivity-3","text":"Когда оба фермента насыщены субстратом","correct":true,"feedback":"В режиме нулевого порядка каждый фермент работает почти с максимальной скоростью, и исход определяется тем, какая из максимальных скоростей больше. Переход от 0,1 до 0,9 укладывается в интервал отношения примерно 0,9–1,1."}]},"widget":{"kind":"q2zero","title":"","s":{"title":"Стационарная доля фосфорилированной формы при разном насыщении ферментов","status":"Расчёт по заданным параметрам (глава 3, §3.9)","rL":"Отношение максимальных скоростей киназы и фосфатазы, r","l_lin":"ферменты не насыщены (K = 10)","l_sat":"ферменты насыщены (K = 0,01)","xL":"r (логарифмическая шкала)","yL":"доля фосфорилированной формы, %","xticks":"Отметки шкалы: слева r = 0,1, в центре r = 1, справа r = 10. Кривая крутая, но каждому r соответствует одно значение доли: бистабильности в этой схеме нет.","note":"При r = {r} доля фосфорилированной формы — {a} % без насыщения и {b} % при насыщении ферментов."}},"section":1,"number":11,"question":2},{"id":"specificity","questions":[2],"title":"Чем определяется субстратная специфичность киназы","keywords":["специфичность","консенсусный мотив","участок стыковки","скаффолд","AKAP","AKAP18δ"],"lead":["Каталитический центр киназы различает субстраты слабо.","Специфичность в клетке складывается из мотива, [[T35|участков стыковки]] и совместной локализации на [[T36|скаффолдах]]."],"mechanism":["[[T34|Консенсусный мотив]] вокруг остатка нужен, но встречается в тысячах белков.","Участки стыковки вне каталитического центра удерживают киназу на субстрате и повышают эффективную концентрацию субстрата.","Скаффолды (например, белки AKAP для PKA) размещают киназу, её субстрат, фосфатазу и фосфодиэстеразу в одном месте клетки."],"paragraphs":["У типичной протеинкиназы от одного до нескольких сотен истинных субстратов, и они находятся среди сотен тысяч остатков серина, треонина и тирозина клетки (Ubersax и Ferrell 2007). Эффективность фосфорилирования разных коротких пептидов каталитическим центром различается лишь в несколько раз или в несколько десятков раз. Для PKA это мотив с основными остатками перед серином (например, RRxS), но таких мотивов в протеоме очень много.","Второй вклад дают участки стыковки — области поверхности киназы и субстрата вне каталитического центра. Их взаимодействие удерживает пару вместе и повышает вероятность модификации нужного белка. Третий вклад — совместная локализация. Белки AKAP связывают регуляторные субъединицы PKA и закрепляют киназу на определённой мембране или в определённом комплексе, нередко вместе с фосфодиэстеразой и фосфатазой (Langeberg и Scott 2015).","В кардиомиоците AKAP18δ входит в комплекс с SERCA2a, фосфоламбаном и PKA. Когда связывание PKA с AKAP нарушали разобщающими пептидами, фосфорилирование фосфоламбана при β-стимуляции снижалось, и закачка Ca²⁺ в СР ускорялась слабее (Lygren 2007, кардиомиоциты крысы). Ферменты те же, мотив тот же — различается только их взаимное расположение.","Переключите режимы схемы: в пробирке PKA фосфорилирует любой белок с подходящим мотивом, в клетке — прежде всего те, рядом с которыми её удерживает AKAP."],"trap":["Специфичность киназы определяется только последовательностью вокруг фосфорилируемого остатка.","Мотив необходим, но недостаточен: подходящих мотивов в протеоме намного больше, чем настоящих субстратов. В клетке решающими оказываются участки стыковки и закрепление киназы в определённом месте скаффолдами."],"conditions":"Схема механизма. Оценки специфичности — обзор Ubersax и Ferrell 2007; роль AKAP — обзор Langeberg и Scott 2015; комплекс AKAP18δ–PKA–PLN–SERCA2a и опыт с разобщающими пептидами — Lygren 2007 (кардиомиоциты крысы, β-адренергическая стимуляция). Опыт в задании построен по схеме Lygren 2007 (разобщающие пептиды, кардиомиоциты крысы); контроль общей активности PKA по растворимому субстрату добавлен в задание для однозначности вывода и в статье в таком виде не описан.","sources":["Ubersax2007","Langeberg2015","Lygren2007"],"quiz":{"id":"S3-specificity","rev":2,"question":"Кардиомиоциты обработали пептидом, разобщающим PKA и AKAP18δ, и стимулировали изопротеренолом. Общая активность PKA в лизате (по фосфорилированию растворимого пептидного субстрата) и количество PLN остались прежними, а фосфорилирование PLN по Ser16 снизилось. Какое объяснение наиболее обосновано?","options":[{"id":"S3-specificity-1","text":"Каталитический центр PKA перестал узнавать мотив","correct":false,"feedback":"Растворимый пептидный субстрат в лизате фосфорилируется как прежде, значит, каталитический центр работает и мотив узнаёт. Изменилось не свойство центра, а то, какие белки оказываются рядом с киназой."},{"id":"S3-specificity-2","text":"PKA, отделённая от AKAP, больше не находится рядом с PLN","correct":true,"feedback":"Ферменты, мотив и количество PLN те же, различается только взаимное расположение: AKAP18δ удерживает PKA в комплексе с фосфоламбаном и SERCA2a, а после разобщения киназа рядом с PLN не оказывается (Lygren 2007). Общий дефицит PKA в этом опыте исключён контролем с растворимым субстратом."},{"id":"S3-specificity-3","text":"В клетке снизилась общая активность PKA","correct":false,"feedback":"Контроль с растворимым субстратом показывает, что каталитическая способность PKA в лизате сохранена, поэтому общее снижение активности PKA в этих клетках по такому контролю маловероятно. Но снижение общей активности PKA могло бы изменить набор фосфорилируемых белков: у разных субстратов разные кинетические параметры и пороги обнаружения, и степень их фосфорилирования могла бы снижаться неодинаково. Такое объяснение исключают контролем, а не рассуждением."}]},"widget":{"kind":"net","title":"","s":{"title":"Специфичность PKA: мотив и закрепление в определённом месте","status":"Схема механизма","modes_label":"Условия","modes":["пробирка: только мотив","кардиомиоцит: AKAP18δ","разобщение PKA и AKAP","контроль: активность PKA в лизате"],"w":640,"h":280,"nodes":[{"id":"akap","x":20,"y":30,"w":140,"h":40,"label":"AKAP18δ","fs":13},{"id":"pka","x":20,"y":120,"w":140,"h":40,"label":"PKA","fs":14},{"id":"pln","x":300,"y":30,"w":130,"h":40,"label":"фосфоламбан","fs":13},{"id":"serca","x":470,"y":30,"w":150,"h":40,"label":"SERCA2a","fs":13,"not":[0]},{"id":"o1","x":300,"y":130,"w":150,"h":40,"label":"другой белок с RRxS","fs":12},{"id":"o2","x":300,"y":210,"w":150,"h":40,"label":"ещё белок с RRxS","fs":12}],"edges":[{"id":"bind","pts":[90,70,90,116],"type":"bind","label":"связывание","lx":140,"ly":98},{"id":"k1","pts":[160,132,296,54],"type":"act"},{"id":"k2","pts":[160,142,296,150],"type":"act"},{"id":"k3","pts":[160,152,296,226],"type":"act"},{"id":"inh","pts":[430,50,466,50],"type":"inh"}],"states":[{"on":["pka"],"p":["pln","o1","o2"],"show":["k1","k2","k3"],"hide":["bind","inh"],"note":"В пробирке с высокой концентрацией фермента PKA фосфорилирует любой доступный пептид или белок с подходящим мотивом (на схеме — такие субстраты). Влияние фосфорилирования на SERCA в этом режиме не рассматривается: этот режим показывает только распознавание мотива."},{"on":["akap","pka","serca"],"p":["pln"],"show":["bind","k1"],"note":"В кардиомиоците AKAP18δ удерживает PKA в комплексе с фосфоламбаном и SERCA2a: фосфоламбан фосфорилируется, торможение насоса снимается; белки вне комплекса фосфорилируются гораздо меньше.","hide":["inh"]},{"on":["pka"],"show":["inh"],"hide":["bind"],"note":"Пептид-разобщитель отделяет PKA от AKAP: при той же β-стимуляции фосфорилирование фосфоламбана снижается, и закачка Ca²⁺ ускоряется слабее (Lygren 2007)."},{"draw":"pkalysate","h":300,"l":{"pA":"А","a":"В лизате: общая активность PKA","mix":"в обе пробы: ATP и растворимый\nпептид-субстрат PKA","c0":"контроль","c1":"разобщение","rate":"начальная скорость образования\nфосфопептида одинакова","pB":"Б","b":"В клетке: фосфорилирование PLN","c0s":"контроль","c1s":"разобщение","row1":"pSer16-PLN","row2":"общий PLN","res":"Каталитическая способность PKA сохранена,\nа фосфорилирование PLN в клетке снижено:\nразобщение меняет расположение киназы\nотносительно PLN, а не её активность."},"note":"Условная схема решающего контроля: в лизатах контрольных клеток и клеток с пептидом-разобщителем PKA одинаково фосфорилирует растворимый пептид-субстрат, а в самих клетках фосфорилирование PLN по Ser16 снижено при неизменном количестве PLN. Так отделяют потерю расположения киназы от общего снижения её активности."}]}},"section":1,"number":12,"question":2},{"id":"prove-site","questions":[2],"title":"Как доказать, что участок фосфорилирования регулирует белок","keywords":["фосфоспецифичное антитело","λ-фосфатаза","S16A","фосфомиметик","масс-спектрометрия","занятость участка","вестерн-блот"],"lead":["Найти фосфорилированный участок — ещё не значит доказать его роль.","Нужны несколько независимых опытов: измерение, контроль специфичности и замена остатка."],"mechanism":["[[T37|Фосфоспецифичное антитело]] на блоте показывает, что участок фосфорилируется; обработка лизата [[T38|λ-фосфатазой]] проверяет, что сигнал принадлежит фосфорилированной форме.","Замена серина на аланин проверяет, нужен ли участок для ответа; [[T39|фосфомиметическая замена]] на Asp или Glu воспроизводит фосфорилирование лишь частично.","Масс-спектрометрия находит участки, но интенсивность фосфопептида не равна [[T22|занятости участка]]."],"paragraphs":["Первый вопрос — фосфорилируется ли участок в ответ на сигнал. Его решают вестерн-блотом с антителом, которое распознаёт белок, только если определённый остаток фосфорилирован, и с антителом, распознающим белок независимо от его фосфорилирования, для нормировки. Контроль специфичности — обработка части лизата λ-фосфатазой: полоса фосфорилированной формы должна исчезнуть, а полоса, выявляемая вторым антителом, — остаться. Сигнал антитела к фосфорилированной форме отражает не долю фосфорилированных молекул, а лишь относительное изменение (Dephoure 2013).","Второй вопрос — нужен ли участок для функции. Его решают заменой остатка. Серин заменяют на аланин, который нельзя фосфорилировать: у мышей с фосфоламбаном S16A фосфорилирование PLN после изопротеренола не выявлялось, а сократительный ответ и изменение Ca²⁺-транзиента при действии изопротеренола были ослаблены (Chu 2000). Такой опыт показывает необходимость участка, но не его достаточность. Он не исключает и других последствий замены: в опытах на сердцах мышей после изопротеренола у PLN S16A не выявляли и фосфорилирования соседнего Thr17 (Luo 1998). В то же время у T17A фосфорилировался Ser16 и сохранялся полный ответ на изопротеренол: это поддерживает достаточность Ser16 в данных условиях (Chu 2000). Поэтому результат сопоставляют с другими мутантами и с восстановлением нормального белка при сопоставимой экспрессии. Замена на аспартат или глутамат вносит отрицательный заряд, но не воспроизводит фосфат: фосфоламбан S16E сохранял около трети тормозящего действия (Lockamy 2011), а белки 14-3-3 и домены SH2 обычно не распознают фосфомиметические замены (Dephoure 2013).","Масс-спектрометрия выявляет тысячи участков сразу, но интенсивность фосфопептида зависит и от количества белка, и от свойств пептида. Чтобы назвать участок регуляторным, нужны нормировка на количество белка, надёжная локализация фосфата, изменение во времени в ответ на сигнал и независимая функциональная проверка.","Переключайте схемы метода и следите, какие полосы исчезают после обработки λ-фосфатазой и что показывает каждая замена остатка."],"trap":["Если участок найден масс-спектрометрией, он регулирует белок.","Обнаружение фосфата показывает только, что модификация происходит. О регуляторной роли говорят изменение в ответ на сигнал, нормированное на количество белка, и функциональный эффект замены остатка."],"conditions":"Схема метода. Пример фосфоламбана: кардиомиоциты трансгенных мышей с PLN S16A на фоне PLN⁻/⁻, изопротеренол (Chu 2000); остаточное торможение S16E — реконструированные мембраны с очищенной SERCA (Lockamy 2011). Рекомендации по анализу участков — Dephoure 2013. Полосы на схеме — иллюстрация, а не данные конкретного блота.","sources":["Dephoure2013","Chu2000","Luo1998","Lockamy2011","Sharma2014"],"quiz":{"id":"S3-prove-site","question":"У клеток с PLN S16A ответ на изопротеренол (ускорение спада Ca²⁺-транзиента) ослаблен. Количество, локализация и базовая функция PLN без стимуляции сохранены. Какой вывод поддерживают эти данные, если другие последствия замены проверяют отдельно?","options":[{"id":"S3-prove-site-1","text":"Участок Ser16 необходим для полного ответа на изопротеренол","correct":true,"feedback":"S16A исключает фосфорилирование Ser16. Если количество, локализация и базовая функция белка не изменены (в работе Chu 2000 основные показатели у линий S16A, T17A и нормального PLN в клетках PLN⁻/⁻ без стимуляции были сходны), ослабление ответа поддерживает необходимость этого участка для полного ответа. Другие последствия замены проверяют отдельно — сравнением с мутантом T17A и восстановлением нормального белка при сопоставимой экспрессии. Достаточность участка этим опытом не проверяется."},{"id":"S3-prove-site-2","text":"Во всей клетке Ser16 фосфоламбана — единственный участок, фосфорилируемый PKA","correct":false,"feedback":"Ответ лишь ослаблен, а не исчез: PKA фосфорилирует и другие белки, например тропонин I. Опыт с одним участком ничего не говорит об остальных мишенях киназы."},{"id":"S3-prove-site-3","text":"Замена S16E восстановит ответ полностью","correct":false,"feedback":"Аспартат или глутамат не воспроизводят заряд, объём и связи фосфата; фосфоламбан S16E сохраняет около трети тормозящего действия. Результат с миметиком нужно проверять отдельно."}],"rev":3},"widget":{"kind":"method","title":"","s":{"title":"Как проверяют участок фосфорилирования","status":"Схема метода","modes_label":"Схема","modes":["антитело и λ-фосфатаза","замены остатка","масс-спектрометрия: как работает","что измеряет масс-спектрометрия"],"schemes":[{"draw":"q2blot","h":290,"data":{"p":[0.12,0.85,0.02,0.0],"tot":[0.85,0.85,0.85,0.85]},"l":{"pA":"А","a":"Вестерн-блот лизатов кардиомиоцитов","t":["без\nагониста","изопроте-\nренол","изопрот.\n+ λ-фосф.","S16A +\nизопрот."],"row1":"pSer16-PLN","row2":"PLN общий","row3":"GAPDH","pB":"Б","b":"Как читать","bt":"После λ-фосфатазы исчезает только полоса фосфорилированной формы:\nантитело специфично. У S16A полосы pSer16 нет, а общий PLN есть.\nБлот даёт относительные изменения, а не долю фосфорилированных молекул."},"note":"Фосфоспецифичное антитело показывает, что Ser16 фосфорилируется при β-стимуляции; λ-фосфатаза и клетки S16A проверяют, что сигнал принадлежит именно фосфорилированной форме этого участка."},{"draw":"q2mut","h":290,"l":{"pA":"А","a":"Что показывает замена остатка (пример фосфоламбана)","cols":["Ser16\n(норма)","Ala16\n(S16A)","Glu16\n(S16E)"],"r1":"можно\nфосфорилировать?","r1v":["да","нет","нет"],"r2":"торможение\nSERCA2a","r2v":["снимается PKA","сохраняется","остаётся ~⅓"],"r3":"что проверяет","r3v":["контроль","необходимость","роль заряда"],"foot":"S16A — нет фосфорилирования этого участка; S16E — постоянный отрицательный заряд,\nно не фосфат: эффект неполный и необратимый."},"note":"Замена на аланин проверяет, нужен ли участок; фосфомиметик лишь частично воспроизводит фосфорилирование (Chu 2000; Lockamy 2011)."},{"draw":"ms","h":458,"l":{"pA":"А","a":"Подготовка пробы","pB":"Б","b":"Спектр","s1":"белки лизата","s2":"пептиды","s3":"фосфопептиды","s4":"масс-спектрометр","e1":"трипсин","e2":"обогащение (TiO₂)","e3":"разделение и ионизация","mz":"m/z","int":"интенсивность","pk1":"пептид","pk2":"пептид + фосфат","shift":"Δ(m/z) ≈ 80/z","foot":"Фосфопептид тяжелее исходного пептида примерно на 80 Да. При одинаковом заряде z\nрасстояние пиков на оси m/z составляет примерно 80/z. По фрагментам пептида\nопределяют положение фосфата; интенсивность зависит и от количества белка, и от ионизации.","pC":"В","c":"Фрагменты пептида указывают положение фосфата","seq":["G","A","S","L","T","E","K"],"site_s":2,"site_t":4,"f1":"фрагмент с Ser: +80 Да","f2":"фрагмент с Thr: сдвига нет","res":"Сдвиг массы целого пептида показывает лишь,\nчто фосфат есть. Сдвиг у фрагмента с Ser\nи его отсутствие у фрагмента с Thr указывают:\nфосфат находится на серине."},"note":"Белки лизата расщепляют трипсином, фосфопептиды обогащают (например, на диоксиде титана), разделяют хроматографией и ионизируют. Фосфопептид тяжелее нефосфорилированного на 80 Да, а спектр его фрагментов (режим В на схеме) указывает, какой из возможных остатков несёт фосфат. Так за один опыт выявляют тысячи участков (Sharma 2014), но интенсивность пика не равна доле фосфорилированных молекул: для доли нужны нефосфорилированный пептид, нормировка на количество белка и стандарты."},{"draw":"table","head":["Величина","Что показывает","Чего не показывает"],"rows":[["интенсивность фосфопептида","что фосфат есть в образце","долю фосфорилированных молекул"],["количество белка","нужно для нормировки","изменение модификации"],["локализация фосфата","на каком остатке фосфат","функцию участка"],["занятость участка","долю молекул с фосфатом","значение для функции"]],"note":"Масс-спектрометрия находит участки, но для вывода о регуляции нужны нормировка, временной ряд и функциональная проверка (Dephoure 2013; Sharma 2014)."}]}},"section":1,"number":13,"question":2},{"id":"gtpase-switch","questions":[3],"title":"Почему нуклеотид служит переключателем","keywords":["малая ГТФаза","G-домен","switch I","switch II","GTP","GDP","RAS","гамма-фосфат"],"lead":["[[T40|Малая ГТФаза]] существует в двух формах — с GTP и с GDP, и с эффекторами связывается только форма с GTP.","Переключение задаёт одна фосфатная группа — γ-фосфат связанного нуклеотида."],"mechanism":["Нуклеотид удерживается в [[T41|G-домене]]; при связанном GTP присутствует [[T43|γ-фосфат]].","Две подвижные области, [[T42|switch I и switch II]], контактируют с γ-фосфатом и при GTP упорядочены.","Упорядоченные switch I и switch II образуют поверхность, с которой связываются эффекторы; после гидролиза она исчезает."],"paragraphs":["Малая ГТФаза — компактный белок, ядром которого служит G-домен, связывающий гуаниновый нуклеотид. В отличие от переключателя из вопроса 2, сам белок ковалентно не изменяется: меняется связанный нуклеотид. Информацию несёт присутствие или отсутствие одной группы — γ-фосфата GTP.","Нуклеотид удерживается петлёй G-домена, а две подвижные области — switch I и switch II — контактируют с γ-фосфатом, когда он есть. При связанном GTP эти области упорядочены и вместе образуют поверхность, комплементарную эффекторным белкам. После гидролиза GTP контакты с γ-фосфатом исчезают, switch I и switch II разупорядочиваются, и поверхность связывания эффекторов пропадает.","Поэтому GTP-форму называют активной: не потому, что она «энергетически заряжена», а потому, что только с ней связываются эффекторы. Белок медленно гидролизует GTP за счёт собственной ГТФазной активности и тем самым сам ограничивает время активного состояния — в этом смысле переключатель называют молекулярным таймером.","Оба самопроизвольных перехода — обмен GDP на GTP и гидролиз GTP — идут медленно: каждый из них занимает минуты. Поэтому в клетке состояние переключателя задают совместно регуляторные белки GEF и GAP, собственные скорости белка и доступность нуклеотидов."],"trap":["GTP-форма активна, потому что в ней запасена энергия макроэргической связи.","Активность определяется не запасённой энергией, а формой белка: γ-фосфат упорядочивает switch I и switch II и создаёт поверхность для эффекторов."],"conditions":"Схема механизма по обзорам Vetter и Wittinghofer (2001) и Cherfils и Zeghouf (2013); switch I и switch II, их упорядочение при GTP — структурные данные для белков семейства Ras. Состояния на схеме качественные.","sources":["Vetter2001","Cherfils2013"],"quiz":{"id":"S3-gtpase-switch","question":"Почему RAS-GTP связывает эффекторы, а RAS-GDP — нет?","options":[{"id":"S3-gtpase-switch-1","text":"γ-фосфат GTP упорядочивает области switch I и switch II","correct":true,"feedback":"Именно присутствие γ-фосфата удерживает switch I и switch II в упорядоченном состоянии, и только тогда есть поверхность связывания эффекторов."},{"id":"S3-gtpase-switch-2","text":"GTP крупнее GDP и физически вытесняет эффекторы к поверхности","correct":false,"feedback":"Разница между GTP и GDP — одна фосфатная группа; дело не в размере нуклеотида, а в том, что γ-фосфат упорядочивает подвижные области белка."},{"id":"S3-gtpase-switch-3","text":"Энергия, освобождаемая при гидролизе GTP, активирует эффекторы","correct":false,"feedback":"Эффекторы связывает именно GTP-форма, до гидролиза. Активность определяется формой белка, а не энергией гидролиза."}]},"widget":{"kind":"net","title":"","s":{"title":"Две формы малой ГТФазы","status":"Схема механизма · переключаемые состояния","modes_label":"Форма","modes":["RAS-GDP (неактивна)","RAS-GTP (активна)"],"h":280,"w":640,"nodes":[{"id":"core","x":230,"y":120,"w":180,"h":60,"label":"G-домен RAS","fs":15},{"id":"sw1","x":60,"y":60,"w":150,"label":"switch I","fs":13},{"id":"sw2","x":60,"y":190,"w":150,"label":"switch II","fs":13},{"id":"gam","x":250,"y":30,"w":140,"label":"γ-фосфат","fs":13},{"id":"eff","x":450,"y":120,"w":150,"h":60,"label":"эффектор","fs":14}],"edges":[{"id":"g1","pts":[320,120,300,70],"type":"bind"},{"id":"s1","pts":[210,85,250,125],"type":"bind"},{"id":"s2","pts":[210,205,250,175],"type":"bind"},{"id":"e1","pts":[410,150,448,150],"type":"bind"}],"states":[{"on":[],"miss":["gam"],"hide":["g1","e1"],"metrics":[["switch I/II","разупорядочены"],["эффектор","не связывается"]],"note":"γ-фосфата нет: switch I и switch II теряют с ним контакт и разупорядочиваются, поверхность связывания эффекторов исчезает."},{"on":["core","gam","eff"],"show":["g1","s1","s2","e1"],"metrics":[["switch I/II","упорядочены"],["эффектор","связывается"]],"note":"γ-фосфат на месте: switch I и switch II упорядочены и образуют поверхность, с которой связывается эффектор."}],"legend":"Связывание показано точкой на конце линии; это узнавание поверхности, а не активация (активацию на схемах показывает стрелка)."}},"section":2,"number":14,"question":3},{"id":"gef-gap","questions":[3],"title":"Как GEF и GAP задают долю активной формы","keywords":["GEF","GAP","обмен","гидролиз","стационар","время релаксации","аргининовый палец","метка","ковалентный фосфат","сравнение превращений","опорная остановка"],"lead":["Опорная остановка 6 из 8 · обмен и гидролиз: RAS переключается при смене связанного нуклеотида, а не при фосфорилировании белка; уравнения те же, химия иная; продолжает остановку 5.","Самопроизвольные обмен и гидролиз медленны, поэтому долю RAS-GTP задают два регуляторных белка.","[[T44|GEF]] ускоряет обмен GDP на GTP, [[T45|GAP]] ускоряет гидролиз GTP — те же уравнения, что для пары киназа — фосфатаза в вопросе 2."],"mechanism":["GEF раскрывает нуклеотид-связывающий карман и снижает сродство ГТФазы к GDP; GDP диссоциирует, и его место занимает GTP (его концентрация в цитозоле выше).","GAP вносит в активный центр каталитический [[T50|аргининовый палец]] и ускоряет гидролиз GTP на несколько порядков.","В стационарном состоянии доля активной формы p* = kGEF/(kGEF + kGAP), время выхода τ = 1/(kGEF + kGAP)."],"paragraphs":["GEF действует так же, как активный β2-рецептор по отношению к Gs в вопросе 1: раскрывает карман и снижает сродство к GDP. GDP диссоциирует, и его место занимает GTP — потому что концентрация GTP в цитозоле существенно выше концентрации GDP (примерно 0,5 мМ против десятков мкМ, Traut 1994). Сам GEF ATP не расходует.","GAP действует на другом этапе цикла: вносит в активный центр RAS собственный аргининовый остаток и правильно ориентирует остаток глутамина самой ГТФазы и атакующую молекулу воды, ускоряя гидролиз GTP на несколько порядков (Scheffzek 1997).","Если ни GEF, ни GAP не насыщены субстратом, а обмен направлен избытком GTP, система описывается теми же уравнениями, что и пара киназа — фосфатаза из вопроса 2. Доля активной формы в стационарном состоянии равна отношению kGEF/(kGEF + kGAP), а время выхода на новый уровень — обратной сумме этих констант. Передвиньте ползунки на схеме: при равных активностях половина RAS активна; усиление любой из сторон смещает долю, а рост обеих ускоряет переключение.","Сходство уравнений не должно скрывать различие реакций. Обмен GDP на GTP и гидролиз GTP происходят с нуклеотидом, связанным с белком: белок не получает и не теряет ковалентного фосфата. При фосфорилировании киназа, напротив, переносит γ-фосфат ATP на остаток серина, треонина или тирозина, и фосфат остаётся на белке. Режим «Сравнение трёх превращений» на схеме прослеживает метку в каждом из трёх случаев: при обмене она оказывается в свободных нуклеотидах, при гидролизе — в свободном фосфате, при фосфорилировании — на белке.","Отсюда следствие: повысить долю RAS-GTP можно и усилением обмена (сигнал на GEF), и ослаблением гидролиза (потеря GAP). Сам по себе рост доли активной формы не говорит, какое из двух событий произошло."],"trap":["Чем выше активность GEF, тем быстрее RAS выключается после сигнала.","После снятия сигнала активность GEF падает до базальной, и возврат к покою задают GAP и базальный обмен. Пока активность GEF высока, она повышает стационарную долю RAS-GTP, а не выключает RAS."],"conditions":"Формулы стационарного состояния и времени релаксации — идеализация §3.14 при ненасыщенных GEF и GAP и направленном обмене (Cherfils и Zeghouf, 2013); те же уравнения, что в вопросе 2. Концентрации GTP и GDP — Traut (1994). Величины на ползунках условные.","sources":["Cherfils2013","Scheffzek1997","Traut1994"],"quiz":{"id":"S3-gef-gap","question":"В клетках доля RAS-GTP повысилась. Какой вывод о причине обоснован?","options":[{"id":"S3-gef-gap-1","text":"Усилился обмен (GEF) или ослаб гидролиз (GAP)","correct":true,"feedback":"Долю активной формы задаёт отношение kGEF/(kGEF + kGAP); её рост одинаково объясним усилением обмена и ослаблением гидролиза."},{"id":"S3-gef-gap-2","text":"Обязательно усилился обмен GDP на GTP","correct":false,"feedback":"Не обязательно: к той же доле приводит ослабление GAP при прежнем обмене. Пример — потеря нейрофибромина."},{"id":"S3-gef-gap-3","text":"Обязательно ускорился собственный гидролиз GTP","correct":false,"feedback":"Ускорение гидролиза снизило бы долю активной формы, а не повысило: гидролиз выключает RAS."}]},"widget":{"kind":"q3gefgap","title":"","s":{"title":"Пара GEF — GAP на одной ГТФазе","status":"Учебная модель, относительные величины · формулы §3.14","gef":"Активность GEF (обмен)","gap":"Активность GAP (гидролиз)","m_p":"Доля RAS-GTP в стационаре","m_tau":"Время релаксации (усл. ед.)","note_hi":"Эффективная константа обмена выше константы гидролиза, поэтому в стационаре большая часть RAS находится в GTP-форме. Прямой и обратный потоки при этом равны.","note_mid":"Эффективные константы обмена и гидролиза близки: в стационаре около половины RAS находится в GTP-форме, а прямой и обратный потоки равны.","note_lo":"Эффективная константа гидролиза выше константы обмена, поэтому в стационаре большая часть RAS находится в GDP-форме. Прямой и обратный потоки при этом равны.","formula":"p* = kGEF / (kGEF + kGAP);  τ = 1 / (kGEF + kGAP)","m_zero":"Стационар не определён","v_zero":"не определена","note_zero":"Обе активности равны нулю: переходов между формами нет, и доля RAS-GTP остаётся равной исходной. Формула p* = kGEF/(kGEF + kGAP) при нулевом знаменателе не определена, время релаксации бесконечно. У настоящего RAS нулевых активностей не бывает: остаются медленные собственные обмен и гидролиз.","modes_label":"Показать","modes":["Доля RAS-GTP и время релаксации","Сравнение трёх превращений"],"c_a_t":"1. Обмен нуклеотида (GEF)","c_a_enz":"GEF","c_a_re":"из раствора приходит GTP","c_a_k":"Нуклеотид уходит и приходит целым: ATP и перенос фосфата на белок не нужны.","c_b_t":"2. Гидролиз связанного GTP (GAP)","c_b_enz":"GAP","c_b_re":"+ H₂O","c_b_k":"Разрывается связь между β- и γ-фосфатами нуклеотида; белок остаётся прежним.","c_c_t":"3. Фосфорилирование белка (киназа)","c_c_enz":"киназа","c_c_prot":"белок","c_c_k":"γ-Фосфат ATP ковалентно присоединяется к остатку серина, треонина или тирозина.","c_free":"свободная молекула","c_leg":"метка (изотоп) на указанной группе до реакции и после неё","c_head":["Превращение","Где метка после отделения белка","Что произошло с белком"],"c_rows":[["Обмен (GEF): метка в основании GDP","в свободных нуклеотидах","связанный нуклеотид заменён целым нуклеотидом из раствора; ковалентной модификации нет"],["Гидролиз (GAP): метка в γ-фосфате GTP","в свободном фосфате (Pi)","GTP превратился в GDP; белок не модифицирован"],["Киназа: метка в γ-фосфате ATP","на белке","белок получил ковалентный фосфат"]],"c_note":"Сходство уравнений p* = k₁/(k₁ + k₂) не означает сходства реакций. GEF не фосфорилирует RAS: он ускоряет уход GDP, а на его место приходит целая молекула GTP. GAP не снимает фосфат с аминокислоты RAS: он ускоряет расщепление GTP, связанного с белком. Ковалентный фосфат на остатке белка снимает протеинфосфатаза; это другая реакция. Связанный нуклеотид на схеме показан серо-зелёной плашкой, ковалентный фосфат — жёлтым кружком P."}},"section":2,"number":15,"question":3,"exam_quiz":{"question":"В первой пробе очищенный RAS связан с GDP, меченным по гуаниновому основанию; добавляют GEF и избыток немеченого GTP, ATP в пробе нет. Во второй пробе белок-субстрат инкубируют с протеинкиназой и ATP, меченным по γ-фосфату; фосфатаз нет. После реакции белки отделяют от свободных низкомолекулярных соединений. Где окажется метка?","options":[{"id":"S3-gef-gap-x2","text":"В обеих пробах — на белке: при обмене GEF присоединяет фосфат к RAS","correct":false,"feedback":"GEF не переносит фосфат на белок: он ускоряет уход связанного нуклеотида, а на его место приходит GTP из раствора. Метка в основании GDP уходит вместе с освободившимся GDP."},{"id":"S3-gef-gap-x3","text":"В обеих пробах в растворе: активные белки не удерживают фосфат","correct":false,"feedback":"Киназа образует ковалентную связь между γ-фосфатом ATP и остатком белка. Без фосфатазы фосфат остаётся на белке. Метка уходит в раствор лишь в первой пробе, причём по другой причине: нуклеотид заменился."},{"id":"S3-gef-gap-x1","text":"В первой — среди свободных нуклеотидов, во второй — на белке","correct":true,"feedback":"При обмене меченый GDP целиком уходит с белка, и метка оказывается среди свободных нуклеотидов. Киназа присоединяет меченый γ-фосфат ATP к белку ковалентно, и метка остаётся на белке."}]}},{"id":"rtk-sos","questions":[3],"title":"Как рецептор доставляет SOS1 к RAS","keywords":["RTK","EGFR","GRB2","SOS1","фосфотирозин","мембрана","SH2","SH3"],"lead":["Фактор роста активирует рецепторную тирозинкиназу, которая фосфорилирует остатки тирозина в собственных цитоплазматических участках.","[[T47|GRB2]] связывается с фосфотирозином рецептора и привлекает [[T46|SOS1]] к мембране, где находится RAS."],"mechanism":["Рецептор (например, [[T90|EGFR]]) связывает лиганд, димеризуется и фосфорилирует остатки тирозина своих цитоплазматических участков.","GRB2 связывается доменом SH2 с фосфотирозином, а доменом SH3 удерживает SOS1.","Оказавшись у мембраны рядом с RAS, SOS1 ускоряет обмен GDP на GTP, и доля RAS-GTP растёт.","RAS закреплён на внутренней стороне мембраны липидным якорем (мотив [[T91|CAAX]]); без якоря он остаётся в цитозоле и не встречается с SOS1."],"paragraphs":["Активация RAS начинается с рецепторной тирозинкиназы. Связав лиганд, рецептор образует активный димер и фосфорилирует тирозины своих цитоплазматических участков. Каждый фосфотирозин становится участком узнавания для белков с доменами SH2 и PTB.","Адаптер GRB2 связывается доменом SH2 с фосфотирозином рецептора, а доменом SH3 удерживает SOS1. Собственной ферментативной активности у GRB2 нет; функция этого комплекса пространственная. SOS1 — цитозольный фермент, а RAS закреплён на плазматической мембране, поэтому GRB2 доставляет фактор обмена к его субстрату.","Оказавшись у мембраны рядом с RAS, SOS1 ускоряет обмен GDP на GTP, и доля RAS-GTP на мембране растёт. Если лиганда нет, комплекс не образуется и обмен не ускоряется; если рецептор лишён фосфотирозина, GRB2 с ним не связывается; если SOS1 не перемещается к мембране, он не контактирует с RAS. Нарушение любого из этих звеньев прерывает передачу сигнала на цикл RAS — проверьте это на схеме.","Почему RAS находится у мембраны? RAS — не трансмембранный белок: на внутренней стороне плазматической мембраны его удерживает липидный якорь на C-конце. Концевой мотив [[T91|CAAX]] (цистеин, две алифатические аминокислоты и любая концевая) последовательно модифицируется: к цистеину присоединяется остаток фарнезила, три концевые аминокислоты отщепляются, а карбоксильная группа метилируется. Для прочного закрепления нужен ещё один сигнал: у HRAS и NRAS пальмитоилируются соседние цистеины, а у основной изоформы KRAS (KRAS4B) закрепление усиливает участок положительно заряженных остатков лизина, притягиваемый к отрицательно заряженным липидам внутреннего слоя мембраны (Hancock 1989, 1990; Prior и Hancock 2012).","Роль якоря показывает опыт, в котором цистеин-186 HRAS, расположенный на самом конце цепи, заменили на серин: белок перестал модифицироваться, остался в цитозоле, не связывал липиды и не вызывал трансформации клеток (Willumsen 1984). Обратное показано для SOS1 и RAF: SOS1 с мембранным сигналом активирует путь RAS, поскольку для активации достаточно, чтобы SOS1 оказался у мембраны рядом с RAS (Aronheim 1994), а RAF с мембранным сигналом KRAS активен независимо от RAS (Leevers 1994; Stokoe 1994). Поэтому состояние нуклеотида и пространственная доступность — разные свойства: нуклеотид определяет форму RAS, а якорь — встретится ли RAS со своим фактором обмена и эффекторами. Переключите режимы на схеме и сравните.","Так внешний сигнал превращается в повышение доли активного RAS. Завершают сигнал GAP, потеря рецепторов и отрицательные обратные связи (подробно — в семинаре 4)."],"trap":["GRB2 сам активирует RAS, заменяя в нём GDP на GTP.","GRB2 — адаптер без ферментативной активности. SOS1 ускоряет обмен нуклеотида; GRB2 лишь привлекает его к мембране."],"conditions":"Схема механизма по Lemmon и Schlessinger (2010) и Cherfils и Zeghouf (2013). Переключаемые состояния качественные; показана ветвь EGFR → GRB2 → SOS1 → RAS. Липидный якорь и локализация RAS — Willumsen (1984), Hancock (1989, 1990), Aronheim (1994), Leevers (1994), Stokoe (1994), Prior и Hancock (2012); схема качественная, RAS не является трансмембранным белком.","sources":["Lemmon2010","Cherfils2013","Hancock1989","Hancock1990","Willumsen1984","Aronheim1994","Leevers1994","Stokoe1994","PriorHancock2012"],"quiz":{"id":"S3-rtk-sos","question":"В клетках рецептор активен и фосфорилирован, но SOS1 не перемещается к мембране. Как изменится доля RAS-GTP при добавлении фактора роста?","options":[{"id":"S3-rtk-sos-1","text":"Почти не вырастет: без SOS1 у мембраны обмен не ускоряется","correct":true,"feedback":"SOS1 — фермент, ускоряющий обмен нуклеотида в RAS. Если он не достигает мембраны, сигнал от рецептора не доходит до RAS."},{"id":"S3-rtk-sos-2","text":"Вырастет как обычно: фосфотирозины рецептора сами активируют RAS","correct":false,"feedback":"Фосфотирозины — лишь участки сборки; сами они нуклеотид не меняют. Без SOS1 у мембраны обмен не ускоряется."},{"id":"S3-rtk-sos-3","text":"Вырастет за счёт GRB2, который заменит SOS1 как фактор обмена","correct":false,"feedback":"GRB2 — адаптер без ферментативной активности; заменить SOS1 он не может."}]},"widget":{"kind":"net","title":"","s":{"title":"Передача сигнала на цикл: RTK → GRB2 → SOS1 → RAS","status":"Схема механизма · переключаемые состояния","modes_label":"Условие","modes":["Нет лиганда","EGF","Рецептор без фосфотирозина","SOS1 не у мембраны","RAS без липидного якоря","SOS1 с собственным мембранным сигналом"],"h":250,"w":640,"areas":[{"kind":"mem","y":175,"lx":10,"ly":168,"label":"внутренняя сторона мембраны"}],"nodes":[{"id":"egfr","x":30,"y":90,"w":96,"label":"EGFR","fs":13},{"id":"grb2","x":150,"y":90,"w":92,"label":"GRB2","fs":13},{"id":"sos","x":266,"y":90,"w":96,"label":"SOS1","fs":13},{"id":"ras","x":420,"y":90,"w":180,"label":"RAS-GDP → RAS-GTP","fs":13,"not":[4]},{"id":"anc","x":450,"y":140,"w":120,"h":28,"label":"липидный якорь","fs":12,"not":[4]},{"id":"anc2","x":252,"y":140,"w":132,"h":28,"label":"мембранный сигнал","fs":12,"only":[5]},{"id":"rasf","x":420,"y":20,"w":180,"label":"RAS без якоря (цитозоль)","fs":13,"only":[4]}],"edges":[{"id":"e1","pts":[126,110,148,110],"type":"bind"},{"id":"e2","pts":[242,110,264,110],"type":"bind"},{"id":"e3","pts":[362,110,418,110],"type":"act","label":"обмен GDP→GTP","lx":390,"ly":82},{"id":"e4","pts":[510,130,510,140],"type":"bind"},{"id":"e5","pts":[314,130,314,140],"type":"bind"}],"states":[{"on":[],"show":["e4"],"hide":["e1","e2","e3","e5"],"metrics":[["Сборка","не собрана"],["RAS-GTP","базальный"]],"note":"Лиганда нет: рецептор не фосфорилирован, GRB2 и SOS1 не привлечены, обмен идёт медленно: собственная скорость RAS и базальная активность GEF. RAS закреплён у мембраны липидным якорем."},{"on":["egfr","grb2","sos","ras"],"p":["egfr"],"show":["e1","e2","e3","e4"],"hide":["e5"],"metrics":[["Сборка","собрана"],["RAS-GTP","повышен"]],"note":"EGF активирует рецептор; GRB2 связывается с фосфотирозином и привлекает SOS1 к мембране, SOS1 ускоряет обмен, доля RAS-GTP растёт."},{"on":["egfr"],"miss":["grb2"],"show":["e4"],"hide":["e1","e2","e3","e5"],"metrics":[["GRB2","не связывается с рецептором"],["RAS-GTP","базальный"]],"note":"Рецептор активен, но без фосфотирозина GRB2 не может связаться с рецептором — комплекс не образуется, и SOS1 не перемещается к мембране."},{"on":["egfr","grb2"],"miss":["sos"],"show":["e1","e4"],"hide":["e2","e3","e5"],"metrics":[["SOS1 у мембраны","нет"],["RAS-GTP","базальный"]],"note":"GRB2 связан с рецептором, но SOS1 не достигает мембраны и не контактирует с RAS: обмен не ускоряется."},{"on":["egfr","grb2","sos"],"p":["egfr"],"show":["e1","e2"],"hide":["e3","e4","e5"],"metrics":[["Якорь RAS","нет"],["RAS-GTP","базальный"]],"note":"Рецептор, GRB2 и SOS1 собраны у мембраны, G-домен RAS цел, но без липидного якоря RAS остаётся в цитозоле и не контактирует с SOS1: обмен не ускоряется, сигнал не передаётся."},{"on":["sos","ras"],"show":["e3","e4","e5"],"hide":["e1","e2"],"metrics":[["SOS1 у мембраны","да, благодаря собственному липидному сигналу"],["RAS-GTP","повышен"]],"note":"SOS1 удерживается у мембраны собственным липидным сигналом, поэтому оказывается рядом с RAS и ускоряет обмен: для активации пути RAS достаточно привести SOS1 к мембране (Aronheim 1994)."}],"legend":"Связывание показано точкой, ускорение обмена — стрелкой; P — фосфотирозин рецептора. Схема качественная: рецептор — трансмембранный белок, RAS — нет."}},"section":2,"number":16,"question":3,"exam_quiz":{"question":"У клеток есть вариант RAS без C-концевой липидной модификации; G-домен цел, и очищенный белок обменивает нуклеотид, как обычный RAS. После добавления EGF рецептор фосфорилируется, GRB2 и SOS1 собираются у мембраны. Что произойдёт с долей RAS-GTP в клетке?","options":[{"id":"S3-rtk-sos-x2","text":"Она будет такой же, как в обычной клетке, потому что G-домен цел","correct":false,"feedback":"Целый G-домен объясняет работу в пробирке. В клетке для ускорения обмена нужна встреча RAS с SOS1 у мембраны, а без липидного якоря она не происходит."},{"id":"S3-rtk-sos-x1","text":"Останется низкой: RAS не удерживается рядом с мембранным SOS1","correct":true,"feedback":"Каталитическая способность и пространственная доступность партнёров — разные условия. SOS1 ускоряет обмен у мембраны, где его удерживает рецепторный комплекс, а RAS без липидного якоря остаётся в цитозоле."},{"id":"S3-rtk-sos-x3","text":"Она повысится: без закрепления у мембраны RAS свободно диффундирует и чаще встречает SOS1","correct":false,"feedback":"Диффузия в цитозоле не заменяет локализацию: SOS1 привлечён к мембране, и там создаётся его высокая локальная концентрация. Для цитозольного RAS партнёра в достаточной концентрации нет."}]}},{"id":"effectors","questions":[3],"title":"Как эффекторы распознают активный RAS и конкурируют за него","keywords":["эффекторы","RAF","PI3K","RALGDS","конкуренция","switch","контекст"],"lead":["С активным RAS связываются эффекторы трёх групп: [[T52|RAF]], [[T53|PI3K]] и [[T54|RALGDS]].","Все три связываются с одной и той же поверхностью switch I / switch II, поэтому конкурируют за активный RAS."],"mechanism":["RAF запускает каскад RAF → MEK → ERK (подробно в семинаре 4).","PI3K класса I катализирует образование PIP₃ из PIP₂ и запускает путь AKT.","RALGDS — сам фактор обмена для ГТФаз семейства Ral; все три связываются с поверхностью switch I / switch II."],"paragraphs":["Активная GTP-форма RAS образует поверхность из упорядоченных switch I и switch II. С ней связываются эффекторы — белки, которые RAS привлекает к мембране и активирует. Обычно выделяют три группы: протеинкиназы семейства RAF, каталитические субъединицы PI3K класса I и белки RALGDS.","Поскольку все три группы связываются с одной и той же поверхностью, они конкурируют за активный RAS: одна молекула RAS-GTP в один момент связывает один эффектор. На схеме с ростом доли RAS-GTP растёт связывание всех трёх групп, а их относительные доли задаются сродством и количеством каждого эффектора в данной клетке.","Относительный вклад ветвей зависит от типа клетки — это та же контекстная зависимость, что для β2-рецептора в вопросе 1: один и тот же активный RAS в разных клетках запускает разные программы, потому что набор и количество эффекторов различны. Наиболее полно изучена ветвь RAF — MEK — ERK, она разбирается в семинаре 4.","Конкуренция за одну поверхность объясняет, почему усиление одной ветви может идти за счёт других и почему для онкогенного RAS важно, какие эффекторы доступны в ткани."],"trap":["У RAS отдельная площадка для каждого эффектора, поэтому RAF, PI3K и RALGDS работают независимо.","Все три группы связываются с одной поверхностью switch I / switch II, поэтому конкурируют за активный RAS; их доли зависят от сродства и количества в данной клетке."],"conditions":"Схема по обзору Simanshu, Nissley и McCormick (2017) и Vetter и Wittinghofer (2001). Относительные доли на схеме — учебные (условные сродства); в опыте вклад ветвей зависит от типа клетки.","sources":["Simanshu2017","Vetter2001"],"quiz":{"id":"S3-effectors","question":"Почему в разных клетках активный RAS запускает разные программы?","options":[{"id":"S3-effectors-1","text":"В разных клетках различаются набор и количество эффекторов","correct":true,"feedback":"Активный RAS один и тот же, но с ним связываются разные эффекторы в разном количестве, и они делят один пул RAS-GTP."},{"id":"S3-effectors-2","text":"В разных клетках у RAS разные поверхности связывания","correct":false,"feedback":"Поверхность switch I / switch II одна и та же; различается набор эффекторов в клетке, а не сам RAS."},{"id":"S3-effectors-3","text":"RAS связывает GTP в одних клетках и другой нуклеотид в других","correct":false,"feedback":"Активная форма всегда связывает GTP. Исход определяется не нуклеотидом, а набором эффекторов."}]},"widget":{"kind":"q3eff","title":"","s":{"title":"Три эффектора конкурируют за одну поверхность","status":"Учебная модель, относительные величины","gtp":"Доля RAS в GTP-форме","raf":"связано с RAF","pi3k":"связано с PI3K","ralgds":"связано с RALGDS","note":"Эффекторы RAF, PI3K и RALGDS узнают одну поверхность switch I / switch II и делят активный RAS. С ростом доли RAS-GTP растёт связывание всех трёх; их относительные доли задаёт сродство и количество каждого в клетке."}},"section":2,"number":17,"question":3},{"id":"oncogenic","questions":[3],"title":"Чем различаются онкогенные варианты RAS","keywords":["онкогенные варианты","кодон 12","кодон 61","G12C","G12V","Q61L","NF1","гидролиз"],"lead":["[[T55|Онкогенные замены]] RAS сосредоточены в кодонах 12, 13 и 61 и смещают цикл по-разному.","Точнее сказать не «выключатель навсегда включён», а «смещённый цикл с ослабленным выключением»."],"mechanism":["Замены в кодонах 12 и 13 препятствуют внесению аргининового пальца GAP в активный центр: GAP-стимулированный гидролиз резко снижается.","Глутамин 61 — каталитический остаток; его замена снижает и собственный, и GAP-стимулированный гидролиз.","Потеря [[T48|нейрофибромина]] ослабляет инактивацию RAS, не меняя сам белок."],"paragraphs":["Соматические варианты RAS — одни из самых частых онкогенных событий (около 19 % больных раком имеют опухоли с мутацией RAS, и три четверти этих мутаций приходятся на KRAS; Prior 2020). Почти все замены приходятся на три кодона — 12, 13 и 61, все в активном центре. Но нарушения у разных вариантов разные, и описывать их одной фразой нельзя.","Замены глицина 12 и 13 вносят в тесный активный центр боковую цепь, которая препятствует введению каталитического аргинина GAP; GAP-стимулированный гидролиз снижается на 97–99 %. При этом собственный гидролиз у разных замен нарушен в разной степени: у KRAS G12C он почти такой же, как у нормального белка (49·10⁻⁵ с⁻¹ против 68·10⁻⁵ с⁻¹), и именно потеря ответа на GAP, а не медленный собственный гидролиз, обусловливает высокую долю активной формы в отсутствие сигнала (Hunter 2015). У G12V собственный гидролиз снижен сильно (4,2·10⁻⁵ с⁻¹).","Глутамин 61 ориентирует молекулу воды в реакции гидролиза; его замена (Q61L) резко снижает и собственный (0,80·10⁻⁵ с⁻¹), и GAP-стимулированный гидролиз, поэтому доля активной формы почти не зависит от сигнала. В таблице видно, что варианты различаются скоростью собственного гидролиза и ответом на GAP, а не одним признаком.","Отдельный механизм — потеря GAP. При нейрофиброматозе 1 типа функция нейрофибромина утрачена; RAS при этом не изменён, но инактивируется медленнее. Это показывает, что клинически значимое повышение активности пути достигается и усилением прямой реакции, и ослаблением обратной. Высокая доля RAS-GTP сама по себе не указывает, какое именно нарушение её вызвало: к ней приводят усиленный обмен, потеря GAP и замены в кодонах 12, 13 и 61. Различают их по скоростям реакций, по генотипу и по ответу на вышележащий сигнал."],"trap":["Онкогенные замены G12C, G12V, G13D и Q61L одинаково «блокируют гидролиз» и держат RAS постоянно включённым.","У всех этих вариантов сильно ослаблен ответ на GAP, но собственный гидролиз нарушен в разной степени: у G12C он почти как у нормального белка, у Q61L почти отсутствует. Высокая доля активной формы у G12C — следствие ослабления ответа на GAP, а не остановки собственного гидролиза; точнее говорить о смещённом цикле, а не о «вечном включении»."],"conditions":"Скорости гидролиза — из Hunter и соавт. (2015, Mol Cancer Res 13:1325, табл. 1, KRAS in vitro, ×10⁻⁵ с⁻¹): собственный WT 68, G12C 49, G12V 4,2, Q61L 0,80; GAP-стимулированный при 50 мкМ p120GAP (ненасыщающая концентрация): WT 4300, G12C 20, G12V 24, Q61L 12; обмен ~0,002 с⁻¹ у всех, кроме G13D. Доли RAS-GTP без сигнала — из учебной модели вопроса 3 (относительные величины). Сохранение переходов G12C между GDP- и GTP-формами — Patricelli (2016); частоты мутаций — Prior (2020); механизм NF1 — Simanshu (2017).","sources":["Hunter2015","Patricelli2016","Simanshu2017","Prior2020"],"quiz":{"id":"S3-oncogenic","question":"Почему формулировка «онкогенный RAS навсегда включён» неточна для KRAS G12C?","options":[{"id":"S3-oncogenic-1","text":"G12C сохраняет собственный гидролиз, поэтому доля его GTP-формы зависит от сигнала","correct":true,"feedback":"G12C почти нечувствителен к GAP, но собственный гидролиз сохранён; белок переходит между формами, и подавление вышележащего сигнала снижает долю RAS-GTP."},{"id":"S3-oncogenic-2","text":"У G12C нет мутации в активном центре, поэтому он работает как нормальный RAS","correct":false,"feedback":"Мутация в активном центре есть и снижает чувствительность к GAP. Неточность не в этом, а в словах «навсегда включён»: гидролиз сохранён."},{"id":"S3-oncogenic-3","text":"G12C вообще не связывает GTP, поэтому не может быть постоянно активным","correct":false,"feedback":"G12C связывает GTP и активен; он не зафиксирован, а продолжает переходить между GTP- и GDP-формами."}]},"widget":{"kind":"table","title":"","s":{"title":"Онкогенные варианты и потеря GAP","status":"Скорости гидролиза — Hunter 2015 (in vitro); доли RAS-GTP — учебная модель","modes_label":"Показать","modes":["Собственный и GAP-стимулированный гидролиз","Доля RAS-GTP без сигнала"],"tables":[{"head":["Вариант","Собственный гидролиз (×10⁻⁵ с⁻¹)","GAP-стимулированный гидролиз, 50 мкМ (×10⁻⁵ с⁻¹)","Переходит между формами"],"rows":[["RAS дикого типа","68","4300","да"],["нет NF1","68","снижен (другие GAP)","да"],["KRAS G12C","49 (почти как WT)","20 (стимуляции нет)","да"],["KRAS G12V","4,2","24","да, слабее"],["KRAS Q61L","0,80","12","почти нет"]],"note":"По Hunter 2015 (табл. 1). У G12C собственный гидролиз почти как у нормы, но GAP его не ускоряет (20 < 49). У Q61L снижены оба. Поэтому «навсегда включён» — неточное описание."},{"head":["Вариант","RAS-GTP без сигнала","Зависимость от сигнала"],"rows":[["RAS дикого типа","низкая (~1 %)","сильная"],["нет NF1","низкая (~3 %)","сильная"],["KRAS G12C","повышена (~45 %)","сохранена"],["KRAS G12V","высокая (~71 %)","ослаблена"],["KRAS Q61L","высокая (~83 %)","почти нет"]],"note":"Числа — из учебной модели вопроса 3 (относительные величины). У G12C доля активной формы повышена из-за ослабления ответа на GAP при сохранённом собственном гидролизе; у G12V и Q61L к этому добавляется медленный собственный гидролиз, поэтому базальная доля ещё выше, а зависимость от сигнала слабее."}]}},"section":2,"number":18,"question":3},{"id":"g12c-trap","questions":[3],"title":"Как ковалентный ингибитор захватывает KRAS G12C","keywords":["G12C","соторасиб","ARS-853","захват","GDP-форма","двойной мутант","Q61L"],"lead":["[[T57|Соторасиб]] и исследовательское соединение ARS-853 связываются с KRAS G12C только в GDP-форме.","Поэтому захват идёт по мере перехода белка из GTP- в GDP-форму, а вариант без гидролиза устойчив к ингибитору."],"mechanism":["Ингибитор ковалентно связывается с цистеином-12 в кармане возле switch II, открытом только в GDP-форме.","KRAS G12C сохраняет гидролиз, поэтому проходит через GDP-форму и захватывается.","У двойного мутанта G12C + Q61L гидролиз почти утрачен, и захвата почти нет; такая же устойчивость наблюдается у клетки с RAS без цистеина-12, поэтому по устойчивости генотип не определить."],"paragraphs":["Долгие годы RAS считали непригодной мишенью: сродство к GTP и GDP пикомолярное, нуклеотид диссоциирует очень медленно, а GTP в цитозоле много, поэтому ингибитор, конкурирующий с нуклеотидом, неэффективен (John 1990; Simanshu 2017). Решение нашли другим путём: ковалентные ингибиторы KRAS G12C связываются с цистеином, возникшим в результате замены, в кармане возле switch II.","Этот карман открыт только в GDP-форме. Поэтому ингибитор связывается с неактивным KRAS G12C и необратимо удерживает белок в этом состоянии. Захват развивается во времени: молекулы связываются по мере того, как они гидролизуют GTP и проходят через GDP-форму. На графике все условия начинаются с одного и того же исходного состояния — клеток без добавок, в которых около 36 % KRAS G12C находится в GTP-форме, — а ингибитор вносят в момент 0. Без дополнительного EGF через 1 ч в учебной модели связано около 70 % белка, через 2 ч — около 90 %, а доля RAS-GTP снижается постепенно (ARS-853: Patricelli 2016, Lito 2016; соторасиб: Canon 2019).","Если гидролиз почти утрачен (двойной мутант G12C + Q61L), GDP-форма образуется редко, и захват почти не идёт: за 2 ч связано около 5 % белка, а доля RAS-GTP остаётся около 94 %. Это согласуется с тем, что KRAS G12C продолжает переходить между GTP- и GDP-формами и ингибитор действует именно потому, что гидролиз сохранён. Само по себе это наблюдение не доказывает такого объяснения: устойчивость к ингибитору дают и другие причины.","По устойчивости к ингибитору нельзя определить, какая замена есть в клетке. Если в положении 12 RAS нет цистеина (например, в клетке с KRAS G12D или с другим вариантом RAS), ингибитору G12C не с чем связываться: захвата нет, а доля RAS-GTP остаётся высокой по причине, не связанной с G12C. Если цистеин есть, но гидролиз утрачен (G12C + Q61L), захват тоже почти не идёт. Количество RAS-GTP в RBD pull-down эти случаи не различает; их различают независимые данные: генотип клеток и содержание ингибитора в клетках (методы — в уроке «Чем измеряют количество активного RAS»).","Скорость захвата зависит и от вышележащего сигнала. Если ингибитор G12C и EGF добавить одновременно, EGF ускоряет обмен GDP на GTP и удерживает белок в GTP-форме: за 2 ч связано около 45 % белка вместо 90 % без EGF, а доля RAS-GTP в первые минуты даже вырастает. Если одновременно с ингибитором G12C подавить сигнал выше RAS (ингибитор EGFR или SOS1), цикл смещается к GDP-форме и захват ускоряется: через 1 ч связано около 79 % белка вместо 71 %, а доля RAS-GTP снижается до 7 % всего белка (учебная модель, откалиброванная по Lito 2016).","Обе кривые на графике выражены в процентах от всего KRAS в клетке (один знаменатель), поэтому условия можно сравнивать между собой по одной шкале."],"trap":["Раз KRAS G12C постоянно активен, ингибитор должен связывать его активную GTP-форму.","Ингибитор связывает GDP-форму: карман возле switch II открыт только в ней. Поэтому захват зависит от гидролиза, а вариант без гидролиза устойчив."],"conditions":"Данные опыта: клеточные линии рака лёгкого с KRAS G12C (H358 и др.); ARS-853 — Patricelli (2016) и Lito (2016); соторасиб (AMG 510) — Canon (2019). Кривые — учебная модель, откалиброванная по этим работам: время в минутах, обе величины в процентах от всего KRAS. Исходная доля RAS-GTP в этой модели (около 36 %) задана по кинетике захвата в клетках и отличается от стационарной модели предыдущих уроков (около 45 % для G12C без сигнала): это два отдельных учебных описания разных опытов.","sources":["Patricelli2016","Lito2016","Canon2019","John1990","Simanshu2017"],"quiz":{"id":"S3-g12c-trap","question":"Почему двойной мутант KRAS G12C + Q61L устойчив к ковалентному ингибитору G12C?","options":[{"id":"S3-g12c-trap-1","text":"Ингибитору редко доступна GDP-форма: гидролиз GTP у двойного мутанта почти утрачен","correct":true,"feedback":"Замена Q61L почти устраняет гидролиз, поэтому белок почти не переходит в GDP-форму — ту единственную, которую связывает ингибитор."},{"id":"S3-g12c-trap-2","text":"Вторая замена убирает цистеин-12, и ингибитору не с чем связываться","correct":false,"feedback":"Цистеин-12 на месте (замена G12C сохранена). Устойчивость даёт утрата гидролиза, а не потеря цистеина."},{"id":"S3-g12c-trap-3","text":"Двойной мутант быстрее гидролизует GTP, поэтому выходит из-под действия ингибитора","correct":false,"feedback":"Наоборот: Q61L почти лишает белок способности гидролизовать GTP. Именно отсутствие гидролиза, а не его ускорение, делает вариант устойчивым."}]},"widget":{"kind":"q3trap","title":"","s":{"title":"Захват GDP-формы KRAS G12C во времени","status":"Данные опыта: клетки рака лёгкого KRAS G12C, ARS-853 (Lito 2016); учебная модель","modes_label":"Клетки и условия","modes":["KRAS G12C, без добавок","G12C + EGF","G12C + ингибитор EGFR или SOS1","G12C + Q61L (гидролиз утрачен)","KRAS без G12C (например, G12D)"],"x":"время после добавления ингибитора, мин","y":"доля от всего KRAS, %","l_b":"связано с ингибитором","l_ras":"RAS-GTP","notes":["Без добавок KRAS G12C проходит через GDP-форму и захватывается: за 1–2 ч связана большая часть белка, доля RAS-GTP снижается.","EGF ускоряет обмен и удерживает белок в GTP-форме: доля RAS-GTP сначала растёт, захват идёт медленнее, и через 2 ч связано менее половины белка.","Подавление сигнала выше RAS смещает цикл к GDP-форме, поэтому ингибитору доступно больше белка, и захват ускоряется: через 1 ч связано около 79 % белка, доля RAS-GTP падает.","У двойного мутанта G12C + Q61L гидролиз почти утрачен: GDP-форма образуется редко, захват почти не идёт, доля RAS-GTP остаётся высокой.","В положении 12 KRAS нет цистеина (например, KRAS G12D): ингибитору G12C не с чем связываться, захвата нет, а доля RAS-GTP остаётся высокой. По доле RAS-GTP этот случай не отличить от двойного мутанта G12C + Q61L."],"m_b":"Связано с ингибитором через 2 ч","m_ras":"RAS-GTP через 2 ч","proto":"Протокол: все условия начинаются с одного исходного состояния (клетки без добавок); в момент 0 одновременно вносят ингибитор G12C и, если выбрано, EGF или ингибитор EGFR или SOS1."}},"section":2,"number":19,"question":3},{"id":"measure-ras","questions":[3],"title":"Чем измеряют количество активного RAS","keywords":["RBD pull-down","ГТФазная реакция","метод","контроль","эффекторный домен","RAF"],"lead":["Количество активного RAS измеряют осаждением на эффекторном домене — [[T59|RBD pull-down]].","Собственный гидролиз измеряют отдельно — в пробирке, по освобождению фосфата."],"mechanism":["RBD-домен RAF на гранулах связывает только RAS-GTP; несвязанный RAS-GDP смывается.","В блоте антитела к RAS показывают, сколько было активной формы; общий RAS — контроль загрузки.","ГТФазную активность измеряют в пробирке по освобождению меченого фосфата из GTP."],"paragraphs":["Чтобы узнать, сколько RAS активно, используют то же свойство, что и эффекторы: RBD-домен RAF связывает только GTP-форму. Лизат клеток инкубируют с гранулами, на которых закреплён RBD-домен; RAS-GTP осаждается, RAS-GDP смывается. В блоте антитела к RAS показывают количество осаждённой активной формы, а блот того же лизата на общий RAS служит контролем загрузки (de Rooij 1997). Метод измеряет количество RAS-GTP в момент лизиса, усреднённое по миллионам клеток.",{"h":"Что метод показывает и чего нет"},"RBD pull-down показывает количество активной формы, но не различает, усилен ли обмен или ослаблен гидролиз, и не даёт скоростей переходов. Один и тот же результат — большое количество RAS-GTP — дают разные причины: усиленный обмен, потеря GAP, замены в кодонах 12, 13 и 61; поэтому по одному pull-down генотип определить нельзя. Метод не показывает и того, какая часть RAS-GTP находится на мембране и связана с эффекторами. Контроль — предварительное связывание RAS с известным нуклеотидом: лизат, в котором RAS заранее связан с GTPγS, даёт сильную полосу, а лизат с RAS, связанным с GDP, — слабую.","Собственную ГТФазную активность измеряют отдельно, в пробирке, на очищенном белке: по освобождению неорганического фосфата или по переходу метки из [γ-³²P]GTP. Так получены относительные скорости вариантов RAS (Hunter 2015). Важно помнить, что ск
