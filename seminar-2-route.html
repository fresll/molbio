межбелкового взаимодействия (например, SH3-доменов белка Nck), протяжённые неупорядоченные области белков (IDR), в том числе домены низкой сложности, а также РНК-связывающие домены вместе с самой РНК (Горшенева 2024). В доменах низкой сложности преобладают немногие аминокислоты, например глицин, пролин, глутамин. Взаимодействия таких молекул описывает модель «липких участков и спейсеров». Липкие участки соединяют молекулы между собой: это могут быть целые модули, как SH3-домены и пролиновые мотивы в эксперименте Li 2012, или отдельные остатки — например, тирозин и фенилаланин, вступающие в катион-π-взаимодействия с аргинином. Спейсеры расположены между липкими участками, и от их взаимодействия с растворителем зависит, сопровождается ли образование сети разделением фаз (Harmon 2017).","IDR при этом не обязательна и не достаточна: сеть образуют и глобулярные домены, как в эксперименте с SH3, а многие белки с обширными IDR конденсатов не образуют. Последовательность IDR важна: от распределения заряженных и ароматических остатков зависят и склонность к конденсации, и свойства фазы (Holehouse 2024). По типу партнёров различают гомотипические взаимодействия — между молекулами одного вида, например FUS с FUS, — и гетеротипические — между молекулами разных видов: белка с другим белком или с РНК (Горшенева 2024). Контакты SH3-доменов с пролиновыми мотивами в эксперименте Li 2012 гетеротипические. В ядрышке, тельцах Кахаля, стресс-гранулах и P-тельцах клеток человека, которые состоят из многих белков и РНК, преобладают гетеротипические взаимодействия (Riback 2020).","Переключите число модулей на схеме и посмотрите, какие ассоциаты образуются и как меняется порог."],"trap":["Если у белка есть протяжённая неупорядоченная область, он обязательно образует конденсат.","IDR облегчает образование множественных слабых контактов, но не гарантирует его: многие белки с IDR конденсатов не образуют, а сеть могут создавать и глобулярные мультивалентные домены."],"conditions":"Li 2012 — очищенные белки SH3ₙ и PRMₙ (n = 1–5) in vitro, а также их коэкспрессия в клетках HeLa; конкуренты — приложение, рис. S8: фазовые диаграммы SH3₅ и PRM(N-WASP)₈ без конкурента и с 1 мМ PRM(H)₁ или PRM₁; сеть и фаза как разные переходы, роль спейсеров — Harmon 2017 (компьютерное моделирование и теория ассоциативных полимеров); источники мультивалентности, модель липких участков и спейсеров, гомо- и гетеротипические взаимодействия — обзор Горшенева 2024 (с. 409–411); преобладание гетеротипических взаимодействий — Riback 2020 (ядрышко, тельца Кахаля, стресс-гранулы и P-тельца клеток человека); IDR — обзор Holehouse 2024. Пороги на схеме — учебная модель практикума (вопрос 3, базовый уровень), а не числа из работы Li 2012.","sources":["Li2012","Harmon2017","Holehouse2024","Banani2017","Riback2020","Gorsheneva2024"],"quiz":{"id":"S2-L16","rev":2,"question":"Мысленный эксперимент: к раствору белков SH3₅ и PRM₅, образующих капли, добавили большой избыток одиночного пролинового мотива PRM(H)₁, который связывает SH3 прочнее обычного (константа диссоциации около 10 мкМ). Что произойдёт с каплями?","options":[{"id":"S2-L16-1","text":"Капли растворятся: участки связывания будут заняты","correct":true,"feedback":"Одиночный мотив занимает SH3-домены, но не соединяет молекулы между собой. Число связей в сети падает, и в этом мысленном эксперименте капли растворяются. В работе Li 2012 PRM(H)₁ в концентрации 1 мМ не давал каплям образоваться (по фазовым диаграммам другой пары белков, SH3₅ и PRM(N-WASP)₈); растворение готовых капель там не показано."},{"id":"S2-L16-2","text":"Капли укрупнятся: в сеть войдут новые молекулы","correct":false,"feedback":"Одиночный мотив имеет один участок связывания и не может соединить две молекулы. Он не достраивает сеть, а разрывает её."},{"id":"S2-L16-3","text":"Капли не изменятся: каждый контакт слишком слабый","correct":false,"feedback":"Слабость исходных контактов не защищает сеть от прочного конкурента. PRM(H)₁ связывает SH3 прочнее обычного мотива и при большом избытке занимает участки, через которые соединяются молекулы каркаса; система оказывается ниже порога. А слабый одиночный мотив PRM₁ в той же концентрации образованию капель не мешал (Li 2012): важна сила связывания конкурента."}]},"widget":{"kind":"q3valency","title":"","s":{"title":"Валентность и сеть взаимодействий","status":"Схема механизма; порог — учебная модель практикума","modes_label":"Модулей в каждой молекуле","modes":["1","2","3","5"],"vals":[1,2,3,5],"a":"белок с модулями","b":"белок с участками связывания","res_t":"что образуется при 80 мкМ","drop":"капля плотной фазы","res":["Только пары молекул","Цепочки и кольца из немногих молекул","Разветвлённые ассоциаты; капель нет","Сеть внутри капель плотной фазы"],"m_deg":"Контактов на молекулу на рисунке, в среднем","m_max":"наибольшее —","legend":"Общая концентрация каждого белка — 80 мкМ, как в практикуме (вопрос 3, базовый уровень). Каждый контакт занимает один модуль одной молекулы и один участок связывания другой; число контактов молекулы не превышает числа её модулей. Рисунок — плоская проекция объёмной сети; размер капли не в масштабе: по модели при 80 мкМ капли занимают около 1,7 % объёма, но содержат 63 % молекул.","m_cs":"Порог (Cнас) в учебной модели","none":"капель нет в диапазоне 0–200 мкМ","notes":["С одним участком связывания молекула образует с партнёром только пару: сеть невозможна, капель нет.","С двумя участками образуются цепочки и замкнутые кольца из немногих молекул; разветвлённой сети в этом диапазоне концентраций нет.","С тремя участками связывания образуются разветвлённые ассоциаты, но при 80 мкМ они остаются конечными: порог для трёх модулей в учебной модели — 120 мкМ, и плотной фазы нет. Ветвление само по себе ещё не означает ни связной сети, ни разделения фаз.","С пятью участками каждая молекула образует больше контактов. При той же концентрации 80 мкМ, выше порога 30 мкМ, большая часть молекул объединена в сеть внутри капель плотной фазы, остальные остаются в растворе."]}},"section":2,"number":16,"question":3},{"id":"threshold","questions":[3],"title":"Что такое концентрация насыщения и почему сборка конденсата носит пороговый характер","keywords":["концентрация насыщения","порог","плотная фаза","разбавленная фаза","правило рычага","каркас","клиент"],"lead":["Ниже [[T55|концентрации насыщения]] каркасный белок существует только в растворе; выше избыток уходит в плотную фазу.","Существование порога превращает сборку конденсата в переключатель: малое изменение концентрации вблизи порога меняет состояние системы."],"mechanism":["При любой концентрации каркасного белка ниже порога капель нет.","Выше порога концентрация в разбавленной фазе в идеальном случае остаётся равной порогу, а весь избыток уходит в [[T56|плотную фазу]].","[[T54|Белки-клиенты]] распределяются в готовую плотную фазу, но для её образования не нужны."],"paragraphs":["Состав конденсата задаётся асимметрично. Различают каркасные белки и белки-клиенты (Горшенева 2024). Каркасные белки — мультивалентные молекулы, контакты между которыми образуют сеть; без них конденсата нет. Белки-клиенты связываются с каркасом и накапливаются в конденсате, но их удаление меняет лишь состав, а не существование структуры. Каркасом может служить и РНК: длинная некодирующая РНК NEAT1 служит структурной основой параспеклов (Горшенева 2024).","В простейшем случае — один каркасный компонент в растворителе или два партнёра в неизменном соотношении, которые приближённо рассматривают как один компонент, — поведение системы описывает [[T57|правило рычага]]. Пока общая концентрация ниже концентрации насыщения, раствор однороден. Как только она превышает порог, однородный раствор разделяется на две фазы: разбавленную, концентрация в которой равна порогу, и плотную, где белок концентрирован во много раз сильнее. Фазы сосуществуют и обмениваются молекулами, но не смешиваются. Каждая новая молекула сверх порога уходит в плотную фазу, поэтому растёт объём капель, а не концентрация вокруг них.","Отсюда следует неочевидное: капли могут занимать около процента объёма и при этом содержать половину молекул белка, если в них белок концентрирован в сто раз. Долю объёма и долю молекул нельзя путать.","Реальная клетка сложнее идеального случая. Когда компонентов много, концентрация в разбавленной фазе не остаётся строго постоянной, а состав плотной фазы зависит от концентраций всех участников (Riback 2020). Поэтому порог — свойство конкретного набора компонентов, а не одного белка. Двигайте ползунок концентрации на схеме и сравните кривую с прямой, которая была бы без фазового разделения."],"trap":["Если концентрация белка вне капель растёт вместе с его общим количеством, фазового разделения нет.","Постоянная концентрация вне капель — свойство идеальной системы из одного каркасного компонента и растворителя. В многокомпонентных конденсатах клетки концентрация насыщения может не быть постоянной: у ядрышка и других исследованных конденсатов клеток человека концентрация вне капель росла вместе с общим количеством белка (Riback 2020). Поэтому отсутствие плато само по себе фазового разделения не исключает."],"conditions":"Идеальная модель с одним эффективным каркасным компонентом: смесь двух партнёров 1 : 1 рассматривается как один компонент (правило рычага); числа — учебная модель практикума (вопрос 3, базовый уровень): пороги 120, 60 и 30 мкМ для 3, 4 и 5 модулей, обогащение плотной фазы в 100 раз (порядок данных Li 2012). Отклонение от идеального поведения в клетке — Riback 2020 (ядрышко и другие конденсаты клеток человека); каркасные белки и белки-клиенты, структурная роль РНК NEAT1, сосуществующие фазы — обзор Горшенева 2024 (с. 398, 409, 412).","sources":["Li2012","Riback2020","Mittag2022","Gorsheneva2024"],"quiz":{"id":"S2-L17","question":"Порог для каркасного белка — 60 мкМ. Его общую концентрацию подняли со 100 до 200 мкМ. Как изменится концентрация белка в разбавленной фазе в идеальной модели?","options":[{"id":"S2-L17-1","text":"Удвоится вместе с общей концентрацией","correct":false,"feedback":"Так было бы без фазового разделения. Выше порога избыток уходит в капли, и раствор вокруг них остаётся насыщенным."},{"id":"S2-L17-2","text":"Останется равной порогу, 60 мкМ","correct":true,"feedback":"В идеальной модели с одним эффективным каркасным компонентом разбавленная фаза насыщена, её концентрация равна порогу; прибавка белка увеличивает объём плотной фазы."},{"id":"S2-L17-3","text":"Упадёт до нуля: весь белок уйдёт в капли","correct":false,"feedback":"Капли находятся в равновесии с насыщенным раствором: вне капель остаётся белок в концентрации порога."}]},"widget":{"kind":"q3phase","title":"","s":{"title":"Правило рычага: разбавленная и плотная фазы","status":"Учебная модель практикума, условные величины","c_label":"Общая концентрация каркасного белка, мкМ","v_label":"Модулей в молекуле","vs":["3","4","5"],"vals":[3,4,5],"cl_label":"Клиент","cls":["нет","есть"],"x":"общая концентрация, мкМ","y":"концентрация в разбавленной фазе, мкМ","l_dil":"разбавленная фаза","l_none":"если бы фазового разделения не было","m_dil":"Разбавленная фаза","m_fd":"Доля молекул в каплях","m_phi":"Объём капель","u":"мкМ","n_below":"Ниже порога: только однородный раствор.","n_above":"Выше порога: избыток белка уходит в капли, концентрация вне капель равна порогу.","n_client":"Клиент накапливается в каплях, но порог и доля каркаса в каплях не меняются: клиент не нужен для образования фазы."}},"section":2,"number":17,"question":3},{"id":"regulation","questions":[3],"title":"Что сдвигает порог сборки конденсата","keywords":["регуляция","фосфорилирование","CTD","нефрин","РНК","плотность цитоплазмы","mTORC1","соль","pH"],"lead":["Порог зависит от концентрации компонентов, силы контактов между ними и свойств растворителя.","В клетке все три величины меняются: модифицируются белки, меняются количество РНК и плотность цитоплазмы."],"mechanism":["Фосфорилирование меняет заряд неупорядоченной области и набор её контактов; оно может и растворять конденсат, и создавать его.","Действие РНК зависит от её отношения к белку: при низком отношении РНК соединяет молекулы белка и способствует сборке, при высоком — препятствует ей.","Плотность цитоплазмы, ионная сила и pH меняют силу слабых контактов и сдвигают порог."],"paragraphs":["Знак действия фосфорилирования заранее не задан. Фосфорилирование карбоксиконцевого домена РНК-полимеразы II киназой CDK7 растворяет его капли in vitro (Boehning 2018), а в клетке переводит полимеразу из конденсатов с медиатором в конденсаты с факторами сплайсинга (Guo 2019). Фосфорилирование тирозинов нефрина, напротив, создаёт участки связывания для адаптера Nck; через N-WASP возникает мультивалентная сеть, и на мембране появляются домены, которых без фосфорилирования нет (Li 2012; Kim 2019). Модификация меняет весь ансамбль слабых контактов сразу, поэтому изменение нескольких остатков переключает состояние целой структуры.","РНК несёт много участков связывания, но знак её действия зависит от соотношения с белком. При низком отношении РНК к белку она соединяет молекулы белка и способствует образованию капель; при высоком белок связывается в отдельные растворимые комплексы с РНК, и капли не образуются или растворяются (Banerjee 2017; Maharana 2018). Так, высокая концентрация РНК в ядре поддерживает растворимость РНК-связывающих белков FUS и TDP-43, а в цитоплазме, где РНК меньше, они легче образуют конденсаты (Maharana 2018). Поэтому количество РНК в компартменте — регулятор фазового состояния, а не только субстрат.","Порог зависит и от растворителя. Delarue и соавторы (2018) показали, что подавление пути mTORC1 снижает концентрацию рибосом в цитоплазме дрожжей и клеток человека; от этого более чем вдвое возрастает эффективная подвижность частиц диаметром 20 нм и более и меняется склонность белков к фазовому разделению. При снижении pH остатки гистидина протонируются, а повышение ионной силы ослабляет электростатические контакты.","Переключите воздействия на схеме: видно, в какую сторону сдвигается порог и что происходит с каплями при той же концентрации каркаса."],"trap":["Фосфорилирование всегда растворяет конденсаты, потому что добавляет отрицательный заряд.","Знак действия зависит от того, какие контакты меняются: фосфорилирование CTD РНК-полимеразы II растворяет его капли, а фосфорилирование нефрина создаёт участки связывания и вызывает сборку."],"conditions":"CTD — Boehning 2018 (очищенный белок, CDK7) и Guo 2019 (клетки млекопитающих); нефрин — Li 2012 (in vitro) и Kim 2019 (мембраны и клетки); РНК — Banerjee 2017 (капли синтетических аргининбогатых пептидов и белка FUS с РНК in vitro; растворение при избытке РНК авторы связывают с инверсией заряда комплексов) и Maharana 2018 (FUS и TDP-43 in vitro и в клетках HeLa); плотность цитоплазмы — Delarue 2018 (дрожжи и клетки HEK293). Направления сдвига на схеме — по этим работам; положение порога условное, без чисел.","sources":["Boehning2018","Guo2019","Kim2019","Li2012","Banerjee2017","Maharana2018","Delarue2018"],"quiz":{"id":"S2-L18","question":"В клетках подавили путь mTORC1, и концентрация рибосом в цитоплазме снизилась. Как это может изменить склонность белков к фазовому разделению?","options":[{"id":"S2-L18-1","text":"Никак: рибосомы не входят в состав конденсатов","correct":false,"feedback":"Рибосомы влияют не как компоненты, а как часть плотно заполненного объёма цитоплазмы: от их концентрации зависят подвижность крупных частиц и порог фазового разделения."},{"id":"S2-L18-2","text":"Изменит: меняется плотность заполнения цитоплазмы","correct":true,"feedback":"Рибосомы занимают значительную часть объёма цитоплазмы. Снижение их концентрации меняет плотность заполнения и вместе с ней склонность белков к фазовому разделению (Delarue 2018)."},{"id":"S2-L18-3","text":"Изменит: mTORC1 фосфорилирует каркасные белки","correct":false,"feedback":"В экспериментах Delarue 2018 эффект шёл через концентрацию рибосом, а не через прямое фосфорилирование каркасных белков киназой mTORC1."}]},"widget":{"kind":"q3reg","title":"","s":{"title":"Сдвиг порога: модификации, РНК и свойства цитоплазмы","status":"Схема механизма; направление сдвига — по работам, положение порога условное","modes_label":"Воздействие","modes":["исходное состояние","фосфорилирование CTD","фосфорилирование нефрина","избыток РНК","меньше рибосом (подавлен mTORC1)"],"axis":"концентрация каркаса (условная шкала)","cur":"концентрация в клетке","thr0":"исходный порог","thr":"порог","drops":"капли есть","nodrops":"капель нет","before":"до воздействия","after":"после воздействия","before0":"в исходном состоянии","shift":[0,1,-1,1,1],"notes":["Концентрация каркаса выше порога: конденсат существует.","Фосфорилирование CTD ослабляет контакты между его повторами: порог растёт, капли растворяются (Boehning 2018).","Фосфорилирование нефрина создаёт участки связывания для Nck: порог снижается, сеть нефрин — Nck — N-WASP собирается на мембране.","Избыток РНК связывает белок в отдельные растворимые комплексы, и связей между молекулами белка становится меньше: порог растёт, конденсат может раствориться (Banerjee 2017; Maharana 2018).","Меньше рибосом — менее плотно заполненная цитоплазма: склонность к фазовому разделению снижается, порог растёт (Delarue 2018)."]}},"section":2,"number":18,"question":3},{"id":"functions","questions":[3],"title":"Какие функции выполняют конденсаты: концентрирование, секвестрация, организация ядра","keywords":["функции конденсатов","секвестрация","стресс-гранула","G3BP1","eIF2α","ядрышко","транскрипционные конденсаты"],"lead":["Конденсат может ускорять реакцию, изымать молекулы из работы и делить пространство ядра без мембран.","Но каждую функцию нужно отделять от сопутствующих событий: [[T61|стресс-гранула]] — следствие остановки трансляции, а не её причина."],"mechanism":["Концентрирование фермента и субстрата ускоряет реакцию, но лишь в определённых пределах.","При стрессе инициация трансляции подавляется, рибосомы диссоциируют от мРНК, и свободные мРНК с [[T62|G3BP1/G3BP2]] собираются в гранулы.","Клетки без G3BP1 и G3BP2 гранул не образуют, но синтез белка при стрессе подавляют так же."],"paragraphs":["Обзоры перечисляют много функций конденсатов: участие в реализации генетической информации, быстрый и обратимый ответ на стресс, регуляцию концентрации белков и нуклеиновых кислот, ускорение химических реакций, временную инактивацию молекул, сортировку и транспорт макромолекул, образование центров нуклеации, передачу сигнала (Горшенева 2024). Ниже разобраны три: повышение локальной концентрации участников реакции, секвестрация и организация ядра.","Первая функция — повышение локальной концентрации участников реакции. В реконструированной системе ферменты SUMO-илирования, собранные в капли, работали до 36 раз быстрее, чем в окружающем растворе; ускорение складывалось из повышения концентрации и изменения сродства фермента к субстрату и зависело от субстрата (Peeples 2021). Повышение концентрации само по себе ускорения не гарантирует.","Вторая функция — секвестрация, временное изъятие молекул из работы. Здесь полезно разделить события. Стресс подавляет инициацию трансляции (например, через фосфорилирование eIF2α), рибосомы диссоциируют от мРНК, и появляется пул свободных рибонуклеопротеинов. Затем белки G3BP1 и G3BP2 при связывании свободной РНК меняют конформацию и собирают гранулу (Guillén-Boixet 2020; Yang 2020). Клетки U2OS без G3BP1 и G3BP2 гранул в ответ на арсенит не образовывали, но синтез белка подавляли так же, как обычные клетки (Kedersha 2016). Значит, гранула — следствие остановки трансляции.","Третья функция — организация ядра. Ядро не имеет внутренних мембран, и ядрышко, спеклы, тельца Кахаля являются конденсатами. Ядрышко ведёт себя как многофазная жидкость: его слои соответствуют последовательным этапам сборки рибосом (Lafontaine 2021). Роль фазового разделения в транскрипционных конденсатах на энхансерах пока остаётся открытым вопросом (Pei 2025).","Переключите состояния на схеме и проследите, какие события стресса зависят от G3BP, а какие нет."],"trap":["Стресс-гранула останавливает трансляцию, поглощая мРНК и рибосомы.","Последовательность обратная: сначала подавляется инициация трансляции, затем из освободившихся мРНК собирается гранула. Клетки без G3BP1 и G3BP2 гранул не образуют, но синтез белка при стрессе подавляют так же."],"conditions":"Перечень функций — обзор Горшенева 2024 (с. 400). Ускорение реакции — Peeples 2021 (реконструированная система SUMO-илирования). Стресс-гранулы — Kedersha 2016 (клетки U2OS без G3BP1/2, арсенит натрия; синтез белка оценён по включению пуромицина), Guillén-Boixet 2020 и Yang 2020 (G3BP как переключатель сборки). Ядрышко — Lafontaine 2021; транскрипционные конденсаты — обзор Pei 2025. Схема — последовательность событий, без чисел.","sources":["Peeples2021","Kedersha2016","GuillenBoixet2020","Yang2020","Lafontaine2021","Pei2025","Gorsheneva2024"],"quiz":{"id":"S2-L19","question":"Клетки без G3BP1 и G3BP2 обработали арсенитом натрия. Как изменится синтез белка по сравнению с обработанными обычными клетками?","options":[{"id":"S2-L19-1","text":"Будет подавлен так же, хотя гранул нет","correct":true,"feedback":"Подавление трансляции при стрессе идёт через фосфорилирование eIF2α и не требует гранул: в экспериментах Kedersha 2016 клетки без G3BP1/2 подавляли синтез белка так же, как обычные."},{"id":"S2-L19-2","text":"Не будет подавлен: нечем изъять мРНК","correct":false,"feedback":"Гранула не причина, а следствие остановки инициации трансляции. Без G3BP1/2 гранул нет, а синтез белка всё равно подавляется."},{"id":"S2-L19-3","text":"Будет подавлен сильнее, чем в обычных клетках","correct":false,"feedback":"В экспериментах Kedersha 2016 синтез белка при стрессе подавлялся в клетках без G3BP1/2 так же, как в обычных, — не сильнее и не слабее."}]},"widget":{"kind":"net","title":"","s":{"title":"Стресс-гранула: последовательность событий","status":"Схема механизма (Kedersha 2016; Guillén-Boixet 2020)","modes_label":"Состояние","modes":["покой","стресс: обычные клетки","стресс: клетки без G3BP1/2","снятие стресса"],"h":280,"w":640,"nodes":[{"id":"str","x":10,"y":20,"w":120,"h":40,"label":"стресс\n(арсенит)","fs":13},{"id":"eif","x":170,"y":20,"w":120,"h":40,"label":"eIF2α-P","fs":14},{"id":"tr","x":330,"y":20,"w":150,"h":40,"label":"синтез белка","fs":14},{"id":"mrnp","x":170,"y":120,"w":150,"h":40,"label":"свободные мРНП","fs":13.5},{"id":"g3","x":360,"y":120,"w":120,"h":40,"label":"G3BP1/2","fs":14},{"id":"sg","x":330,"y":210,"w":180,"h":44,"label":"стресс-гранула","fs":14}],"edges":[{"id":"e1","pts":[130,40,168,40],"type":"act"},{"id":"e2","pts":[290,40,328,40],"type":"inh"},{"id":"e3","pts":[240,62,240,118],"type":"move","label":"диссоциация рибосом","lx":110,"ly":95},{"id":"e4","pts":[320,140,358,140],"type":"bind"},{"id":"e5","pts":[420,162,420,208],"type":"move","label":"сборка","lx":470,"ly":190}],"states":[{"on":["tr","g3"],"show":[],"note":"Без стресса идёт синтез белка, мРНК связаны с рибосомами, свободных мРНП мало, гранул нет."},{"on":["str","eif","mrnp","g3","sg"],"show":["e1","e2","e3","e4","e5"],"note":"Стресс приводит к фосфорилированию eIF2α, инициация трансляции подавляется, рибосомы диссоциируют от мРНК; свободные мРНК с G3BP1/2 собираются в гранулу."},{"on":["str","eif","mrnp"],"miss":["g3"],"show":["e1","e2","e3"],"hide":["e4","e5"],"note":"Без G3BP1/2 гранулы не собираются, но синтез белка подавляется так же: гранула — следствие остановки трансляции, а не её причина."},{"on":["tr","g3"],"show":[],"note":"После снятия стресса трансляция возобновляется, и гранулы разбираются; скорость разборки зависит от вида стресса."}]}},"section":2,"number":19,"question":3},{"id":"maturation","questions":[3],"title":"Почему жидкоподобная капля может превратиться в агрегат","keywords":["переход жидкость — твёрдое","созревание","FUS","hnRNPA1","TDP-43","агрегат","боковой амиотрофический склероз"],"lead":["Капли некоторых белков со временем меняют физические свойства, и обмен молекул в них замедляется; так ведут себя, например, капли очищенного FUS in vitro.","Замены в неупорядоченных областях FUS и hnRNPA1, найденные у больных, в экспериментах in vitro ускоряют этот [[T59|переход жидкость — твёрдое]]."],"mechanism":["В каплях очищенных FUS и hnRNPA1 при длительной инкубации in vitro могут возникать упорядоченные межмолекулярные структуры, и обмен молекул замедляется.","В экспериментах in vitro патогенная замена G156E ускоряет переход капель очищенного FUS в твёрдоподобное, волокнистое состояние.","[[T60|Агрегаты]] бывают аморфными и упорядоченными; конденсат может ускорять агрегацию, но может и препятствовать ей."],"paragraphs":["Белки с протяжёнными неупорядоченными областями низкой сложности — [[T64|FUS]], hnRNPA1, TDP-43 — образуют жидкоподобные конденсаты. Patel и соавторы (2015) показали, что FUS собирается в жидкоподобные компартменты в местах повреждения ДНК и в цитоплазме при стрессе. Капли очищенного FUS in vitro со временем теряли подвижность и переходили в агрегированное состояние с амилоидоподобными фибриллами, а замены, найденные у больных боковым амиотрофическим склерозом, ускоряли этот переход. Для hnRNPA1 показано, что в каплях плотной фазы образование фибрилл ускоряется (Molliex 2015).","Многие патогенные замены в FUS, hnRNPA1 и TDP-43 расположены в неупорядоченных областях, и эксперименты in vitro показывают один из возможных путей их действия. Однако прямых доказательств перехода конденсатов в амилоидные агрегаты в живой клетке практически нет (Горшенева 2024), поэтому эксперимент с каплями очищенного белка не устанавливает механизма болезни.","Важно различать механизм сборки и её материальное состояние. Термин «конденсат» в семинаре описывает обогащение без мембраны и включает жидкоподобные, гелеподобные и твёрдоподобные сборки (шаг «Что такое биомолекулярный конденсат»). Агрегаты могут быть аморфными или упорядоченными; амилоидные фибриллы — один из вариантов. В этом сравнении речь идёт об устойчивой сборке с медленным обменом. Внутри конденсата агрегация может ускоряться за счёт высокой концентрации, но в других условиях конденсация препятствует ей, изымая белок из раствора (Visser 2024). Поэтому ни яркий фокус, ни даже медленный обмен сами по себе не устанавливают механизм сборки.","На схеме — учебная модель созревания: подвижная фракция FRAP у капель FUS дикого типа и с заменой G156E в зависимости от времени."],"trap":["Конденсат и агрегат — одно и то же: оба выглядят как яркие скопления белка.","По виду фокуса нельзя установить ни механизм сборки, ни её материальное состояние. В учебной модели свежие капли быстро обмениваются компонентами и растворяются ниже порога, а агрегат обменивается медленно; созревание капли в агрегат — отдельный, обычно медленный процесс. Эти модельные признаки не являются общим определением всех конденсатов и агрегатов."],"conditions":"Patel 2015 — очищенный FUS in vitro и клетки HeLa; Molliex 2015 — hnRNPA1 in vitro; Visser 2024 — обзор; различие экспериментов in vitro и данных о живых клетках, типы агрегатов — обзор Горшенева 2024 (с. 404–408). Кривые на схеме — учебная модель практикума (вопрос 3, продвинутый уровень): подвижная фракция 0,05 + 0,85·exp(−t/τ), τ = 10 ч у белка дикого типа и 2,5 ч у G156E; направление различия — по Patel 2015, числа условные.","sources":["Patel2015","Molliex2015","Visser2024","Alberti2019","Gorsheneva2024"],"quiz":{"id":"S2-L20","question":"Капли FUS дикого типа сразу после образования обмениваются молекулами за секунды. Как изменится их подвижная фракция FRAP через много часов in vitro?","options":[{"id":"S2-L20-1","text":"Останется прежней: жидкое состояние устойчиво","correct":false,"feedback":"Жидкоподобное состояние капель очищенного FUS метастабильно: in vitro они со временем теряют подвижность и переходят в твёрдоподобное состояние."},{"id":"S2-L20-2","text":"Постепенно снизится: капли созревают","correct":true,"feedback":"При длительной инкубации капель очищенного FUS обмен молекул в них замедляется, и подвижная фракция падает; замена G156E ускоряет этот процесс (Patel 2015)."},{"id":"S2-L20-3","text":"Вырастет: капли сольются в одну большую","correct":false,"feedback":"Слияние меняет размер капель, но не делает обмен молекул быстрее. Со временем обмен в каплях FUS замедляется."}]},"widget":{"kind":"q3mature","title":"","s":{"title":"Созревание капель FUS","status":"Учебная модель; направление различия — по Patel 2015 (in vitro)","h_label":"Время после образования капель, ч","x":"время, ч","y":"подвижная фракция FRAP, %","l_wt":"FUS дикого типа","l_g":"FUS G156E","m_wt":"Дикий тип","m_g":"G156E","st":{"liq":"жидкоподобные","mid":"обмен замедлен","sol":"твёрдоподобные"},"note":"Подвижная фракция снижается у обоих белков, но у капель с заменой G156E — быстрее."}},"section":2,"number":20,"question":3},{"id":"criteria","questions":[3],"title":"Что доказывает и чего не доказывает яркий фокус в микроскопе","keywords":["критерии","FRAP","слияние капель","порог по концентрации","оптогенетика","гександиол","замены в IDR","яркий фокус"],"lead":["Яркий фокус одинаково выглядит у конденсата, у комплексов с обратимо связанным белком, у белка на невидимой органелле и у агрегата.","Ни один признак не достаточен сам по себе: нужен набор независимых проверок."],"mechanism":["[[T08|FRAP]] характеризует обмен компонентов, слияние — жидкоподобное поведение, а зависимость от концентрации помогает проверить фазовую модель сборки, но сама её не доказывает.","Замены, нарушающие только слабые контакты и сохраняющие специфическое связывание, проверяют, нужна ли для функции именно конденсация.","[[T66|1,6-гександиол]] растворяет многие сборки, но действует неизбирательно и не годится как доказательство."],"paragraphs":["Наблюдение, что белок сосредоточен в ярких фокусах, не доказывает фазового разделения. Тот же вид имеют устойчивый комплекс, скопление белка на мембранной структуре, невидимой в этом канале, и агрегат (McSwiggen 2019). Различие не косметическое: от него зависит, обратима ли структура, зависит ли она от концентрации и как на неё можно воздействовать.","Методические рекомендации требуют набора признаков (Gao 2022). Обратимость и зависимость от концентрации: структура исчезает при снижении концентрации каркаса и появляется при её повышении; самый прямой вариант — [[T67|оптогенетическая сборка]], когда светом управляют олигомеризацией белка и картируют порог прямо в живой клетке (Shin 2017; Bracha 2018). Зависимость от концентрации ещё не отличает фазовое разделение от других кооперативных сборок; её дополняют измерением концентраций внутри и вне структуры (McSwiggen 2019). В простейшей равновесной системе из одного каркасного компонента и растворителя концентрации сосуществующих фаз при неизменных условиях постоянны и не растут вместе с общим количеством белка. В многокомпонентном конденсате они могут меняться вместе с составом системы, поэтому отсутствие такого плато само по себе фазового разделения не исключает (Riback 2020). Обмен компонентов: FRAP. Материальные свойства: округлость, слияние при соприкосновении, деформация.","Каждый признак ограничен. Быстрое восстановление FRAP показывает обмен, но не доказывает жидкого состояния: числа зависят от размера обесцвеченного участка и модели расчёта (Taylor 2019). 1,6-гександиол в концентрациях 5–10 %, которыми растворяют капли, почти полностью подавляет киназы и фосфатазы in vitro (Düster 2021) и меняет проницаемость мембран (Горшенева 2024). Наблюдение может менять и сам объект: повышенная экспрессия меченого белка повышает его концентрацию в клетке и способна вызвать конденсацию, которой при обычном уровне белка нет (Горшенева 2024).","Самое трудное — показать, что конденсация нужна для функции. Для этого вводят замены, которые нарушают множественные слабые контакты неупорядоченной области, но сохраняют известное специфическое связывание, и проверяют, нарушается ли функция. Этот контроль в работах области часто отсутствует (McSwiggen 2019). Схемы методов — ниже."],"trap":["Если белок образует в клетке яркие округлые фокусы, это доказывает фазовое разделение.","Округлые яркие фокусы дают и комплексы, и органеллы, и агрегаты. О механизме сборки судят по совокупности независимых измерений — зависимости от концентрации и составу сосуществующих фаз; обмен компонентов и слияние характеризуют динамику и материальное состояние. Постоянство концентраций ожидается лишь в простейшей фазовой модели, а исчезновение фокусов при разведении требует контроля чувствительности регистрации. Роль конденсации в функции проверяют заменами, нарушающими только конденсацию."],"conditions":"Критерии — McSwiggen 2019, Gao 2022; FRAP — Taylor 2019 (капли in vitro и конденсаты клеток HEK293); оптогенетика — Shin 2017 (optoDroplets: IDR FUS, DDX4, HNRNPA1 в клетках NIH 3T3) и Bracha 2018 (Corelets); гександиол — Düster 2021 (ферменты in vitro) и Горшенева 2024 (обзор, с. 413–418: сочетание методов и их ограничения); непостоянство концентрации насыщения в многокомпонентных конденсатах — Riback 2020 (ядрышко и другие конденсаты клеток человека). Схемы — схемы методов, числа условные.","sources":["McSwiggen2019","Gao2022","Riback2020","Taylor2019","Shin2017","Bracha2018","Duster2021","Gorsheneva2024"],"quiz":{"id":"S2-L21","question":"Какой эксперимент прямо проверяет, что для функции белка нужна именно его конденсация, а не только связывание с партнёром?","options":[{"id":"S2-L21-1","text":"Замены в IDR, сохраняющие связывание с партнёром","correct":true,"feedback":"Замены ароматических остатков в неупорядоченной области разделяют две способности белка: если исчезают и фокусы, и функция, а связывание сохранено, это довод в пользу роли конденсации."},{"id":"S2-L21-2","text":"Растворение фокусов гександиолом и проверка функции","correct":false,"feedback":"Гександиол действует неизбирательно: он подавляет киназы и фосфатазы и меняет мембраны, поэтому нарушение функции нельзя приписать растворению конденсата."},{"id":"S2-L21-3","text":"Быстрое восстановление флуоресценции фокусов (FRAP)","correct":false,"feedback":"FRAP показывает обмен компонентов, но ничего не говорит о том, нужна ли конденсация для функции; быстро восстанавливается и белок, обратимо связанный с комплексами."}]},"widget":{"kind":"method","title":"","s":{"title":"Методы: как проверить, что фокус — конденсат","status":"Схемы методов","modes_label":"Метод","modes":["FRAP","Слияние капель","Порог по концентрации","Оптогенетическая сборка","Замены в IDR","1,6-гександиол","Что доказывает каждый признак"],"schemes":[{"draw":"q3frap","h":290,"l":{"pA":"А","a":"Фокус до и после обесцвечивания","pB":"Б","b":"Кривая восстановления","t0":"до","t1":"сразу после","t2":"через 30 с","x":"время, с","y":"доля исходной яркости","mf":"подвижная фракция","th":"время полувосстановления"},"note":"Флуоресценцию участка гасят светом и измеряют её восстановление. Подвижная фракция показывает, какая доля молекул обменивается, время полувосстановления — как быстро.","legend":"Числа зависят от размера участка и модели расчёта (Taylor 2019); быстрый FRAP показывает обмен, но не доказывает жидкого состояния."},{"draw":"q3fuse","h":290,"l":{"t":["0 с","5 с","20 с"],"res_l":"слились и округлились","res_s":"соприкоснулись, но не слились","row_l":"жидкоподобные капли","row_s":"твёрдоподобные сборки"},"note":"Две жидкоподобные капли при соприкосновении сливаются и за секунды принимают форму шара; твёрдоподобные сборки остаются раздельными.","legend":"Слияние — признак жидкоподобного поведения, но не доказательство механизма сборки (Brangwynne 2009)."},{"draw":"q3dil","h":250,"l":{"t":"общая концентрация каркаса","cs":"порог","below":"фокусов нет","above":"фокусы есть","c":["0,5 × порога","0,9 × порога","1,5 × порога","3 × порога"]},"note":"В фазовой модели структура исчезает ниже порога и появляется выше него в узком диапазоне концентраций.","legend":"Пороговое появление фокусов согласуется с фазовой моделью, но встречается и при других кооперативных сборках. При разведении нужно отличать разборку структуры от снижения её яркости ниже предела обнаружения."},{"draw":"q3opto","h":270,"l":{"a":"темнота","b":"синий свет","c":"снова темнота","con":"белок: IDR + светочувствительный домен","res":"капли собираются на свету и растворяются в темноте","deep":"при сильном превышении порога — гелеобразные, затем необратимые сборки"},"note":"Светочувствительный домен олигомеризуется на синем свету и повышает валентность белка с IDR: выше порога в освещённой клетке появляются капли, в темноте они растворяются (Shin 2017).","legend":"Метод управляет сборкой в живой клетке и позволяет картировать порог (Bracha 2018); при сильном превышении порога образуются гелеобразные сборки, которые со временем становятся необратимыми (Shin 2017)."},{"draw":"q3sep","h":270,"l":{"wt":"исходный белок","mut":"белок с заменами Y → S в IDR","bind":"связывание с партнёром","foci":"фокусы","fun":"функция","yes":"есть","no":"нет","keep":"сохранено"},"note":"Замены ароматических остатков ослабляют слабые контакты неупорядоченной области, но не затрагивают домен, связывающий партнёра. Если фокусы и функция исчезают, а связывание сохранено, это довод в пользу того, что для функции необходима конденсация.","legend":"Обязательный контроль — проверить, что замены не нарушили известного специфического связывания."},{"draw":"q3hex","h":260,"l":{"a":"до","b":"через 2 мин, 5 % гександиола","side":"побочные действия","s1":"киназы и фосфатазы почти\nнеактивны (in vitro)","s2":"частично подавлены\nДНК-полимеразы (in vitro)","s3":"меняется проницаемость\nмембран"},"note":"1,6-гександиол растворяет многие жидкоподобные сборки, но в тех же концентрациях подавляет ферменты и действует на мембраны.","legend":"Растворение гександиолом не доказывает ни фазового разделения, ни его роли в функции."},{"draw":"table","head":["Наблюдение","Что показывает","Чего не показывает"],"rows":[["яркие фокусы","неравномерное распределение белка","фазового разделения и его роли"],["быстрый FRAP","обмен компонентов с окружением","жидкого состояния: быстро обменивается и связанный белок"],["слияние и округление","жидкоподобное поведение","механизма сборки"],["исчезновение ниже порога","зависимость существования или видимости структуры от концентрации","само по себе — ни отдельной фазы, ни её необходимости для функции"],["рост концентрации вне фокусов вместе с общим количеством белка","отклонение от простейшей однокомпонентной модели","отсутствия фазового разделения: в многокомпонентной системе так бывает (Riback 2020)"],["замены, нарушающие только конденсацию","роль конденсации в функции (если связывание сохранено)","—"],["растворение гександиолом","чувствительность к спиртам","фазового разделения: действие неизбирательно"]],"note":"Вывод о конденсате и его функции требует сочетания признаков, а не одного из них."}]}},"section":2,"number":21,"question":3},{"id":"polar-cell","questions":[4],"title":"Почему полярный домен не может удерживаться сам по себе","keywords":["клеточная полярность","домен","латеральная диффузия","коэффициент диффузии","ориентир","градиент","t = x²/4D"],"lead":["Стороны полярной клетки различаются: участки её мембраны несут разный набор белков и липидов.","Белки мембраны перемешиваются диффузией за минуты, а домены существуют часами, поэтому полярность требует непрерывного поддержания."],"mechanism":["Мембранный белок с D ≈ 0,1 мкм²/с проходит 10 мкм [[T72|латеральной диффузией]] примерно за 250 с.","[[T70|Полярный домен]] существует часами, значит, его поддерживают потоки доставки и удаления и удержание белков на каркасах, а не отсутствие диффузии.","Положение будущего домена задаёт слабый [[T74|ориентир]]: внешний градиент, контакт с соседней клеткой или матриксом, внутренняя метка."],"paragraphs":["Клеточная полярность — устойчивая асимметрия клетки: участки плазматической мембраны различаются по составу белков и липидов, цитоскелет ориентирован относительно оси клетки, органеллы распределены неравномерно. У эпителиальной клетки это [[T71|апикальный и базолатеральный домены]], у нейрона — аксон и дендриты, у мигрирующей клетки — передний и задний края.","Определение содержит количественное условие. Время, за которое молекула смещается диффузией на расстояние x, оценивают как t ≈ x²/4D. Для мембранного белка с D ≈ 0,1 мкм²/с путь в 10 мкм занимает около 250 с, для липида с D ≈ 0,5 мкм²/с — меньше минуты. Домен, который сохраняется часами, не может удерживаться пассивно: без непрерывной работы диффузия выровняла бы состав мембраны.","Исходная асимметрия задаётся ориентиром. У эпителия это контакт с соседними клетками и с внеклеточным матриксом, у дрожжей — рубец от предыдущего деления, у мигрирующей клетки — градиент хемоаттрактанта. Ориентир обычно слаб: концентрация хемоаттрактанта на двух сторонах клетки может различаться на несколько процентов, а различие доменов качественное. Значит, между ориентиром и доменом действует механизм усиления (следующие шаги).","Схема рассчитывает оценку t ≈ x²/4D; это порядок величины, а не время конкретного эксперимента."],"trap":["Полярность — застывшая структура: белки однажды доставлены к своей мембране и остаются там.","Мембранные белки и липиды перемешиваются диффузией за минуты. Домен, существующий часами, поддерживается непрерывными потоками доставки, удержания и удаления."],"conditions":"Оценка t ≈ x²/4D — расчёт по заданным параметрам. D ≈ 0,1 мкм²/с — порядок величины для мембранного белка животной клетки; D ≈ 0,5 мкм²/с для липидов эпителиальной клетки — обзор Günzel 2026. Градиент хемоаттрактанта в несколько процентов — обзор Devreotes 2017 (мигрирующие клетки, в том числе Dictyostelium и нейтрофилы).","sources":["Gunzel2026","Devreotes2017","RodriguezBoulan2014"],"quiz":{"id":"S2-L22","question":"Мембранный белок проходит 10 мкм диффузией примерно за 4 мин, а апикальный домен эпителиальной клетки сохраняется часами. Какой вывод следует из этого сравнения?","options":[{"id":"S2-L22-1","text":"Белки домена не диффундируют в мембране","correct":false,"feedback":"Белки мембраны диффундируют; именно поэтому домен и требует поддержания. Неподвижные белки не нуждались бы в доставке и удалении."},{"id":"S2-L22-2","text":"Домен поддерживается непрерывными потоками","correct":true,"feedback":"Если бы домен удерживался пассивно, диффузия выровняла бы состав мембраны за минуты. Он существует часами, значит, его поддерживают доставка, удержание и удаление."},{"id":"S2-L22-3","text":"Домен однажды создан и далее не меняется","correct":false,"feedback":"Неизменный домен расплылся бы за минуты: состав мембраны выравнивается диффузией. Сохранение домена — результат постоянного оборота белков."}]},"widget":{"kind":"q4diff","title":"","s":{"title":"Сколько времени нужно диффузии","status":"Расчёт по заданным параметрам: t ≈ x²/4D","mol_label":"Молекула","mols":["белок мембраны (D ≈ 0,1 мкм²/с)","липид (D ≈ 0,5 мкм²/с)"],"D":[0.1,0.5],"dist_label":"Расстояние","dists":["2 мкм","5 мкм","10 мкм","20 мкм"],"x":[2,5,10,20],"m_t":"Время диффузии","m_dom":"Время жизни домена","dom":"часы","u_s":"с","u_min":"мин","start":"старт","cell":"участок мембраны длиной 20 мкм","ticks":["1 с","1 мин","1 ч","10 ч"],"note":"Белок смещается на {x} мкм примерно за {t}. Домен существует часами, поэтому без непрерывной работы его состав выровнялся бы диффузией.","legend":"Оценка по формуле t ≈ x²/4D для одной молекулы; она не учитывает препятствий в мембране и связывания с каркасом."}},"section":3,"number":22,"question":4},{"id":"feedback","questions":[4],"title":"Как слабый ориентир превращается в резкий домен","keywords":["CDC42","положительная обратная связь","Bem1","Cdc24","нарушение симметрии","ограниченный запас","дрожжи"],"lead":["Различие, заданное ориентиром, усиливает [[T76|локальная положительная обратная связь]].","При ограниченном общем запасе компонента домен образуется только в одном участке мембраны."],"mechanism":["Активная [[T75|CDC42]], связанная с GTP, удерживает на мембране [[T77|каркасный белок Bem1 вместе с Cdc24]].","Cdc24 — фактор обмена нуклеотидов: он переводит соседние молекулы CDC42 в активную форму, и кластер растёт.","Общий запас CDC42 ограничен, поэтому рост в одном участке идёт за счёт остальной мембраны, и образуется один домен."],"paragraphs":["Наиболее полно разобранный пример — малая ГТФаза CDC42 почкующихся дрожжей. В активной форме, связанной с GTP, она задаёт место сборки актиновых кабелей и роста почки. Активная CDC42 через свой эффектор, PAK-киназу Cla4, связывает каркасный белок Bem1, а с ним — фактор обмена нуклеотидов Cdc24; Cdc24 переводит соседние молекулы CDC42 из GDP-формы в GTP-форму, и в участке мембраны возникает самоусиливающийся кластер.","Ориентиром у дрожжей служит рубец от предыдущего деления, сигнал от которого передаёт ГТФаза Rsr1. Эксперименты с клетками без ориентиров показали главное: они всё равно образуют один домен активной CDC42, но в случайном месте. В работе Irazoqui 2003 кластер возникал и без ориентиров, и без микротрубочек и актина, но требовал Bem1; в работе Wedlich-Söldner 2003 поляризация активированной CDC42 зависела от доставки по актиновым кабелям. Ориентир задаёт положение домена, а обратная связь — само его существование.","Почему домен один? Общий запас CDC42 в клетке ограничен. Участок, где положительная обратная связь установилась раньше, связывает молекулы CDC42 из цитоплазмы, и в соседних участках их становится недостаточно для собственного кластера; в моделях это называют конкуренцией «победитель получает всё» (Goryachev и Pokhilko 2008). По тем же моделям при слишком малом запасе устойчивого кластера не образуется.","Схема показывает качественные исходы для сочетаний трёх условий; это не расчёт."],"trap":["Положение и само существование домена задаёт ориентир; без ориентира клетка не поляризуется.","Ориентир лишь смещает положение домена. Клетки без ориентиров образуют один домен в случайном месте: его существование обеспечивает положительная обратная связь при ограниченном запасе."],"conditions":"Почкующиеся дрожжи Saccharomyces cerevisiae. Irazoqui 2003: клетки без ориентиров (rsr1), с разрушенными микротрубочками и актином; поляризация требовала Bem1 и гидролиза GTP белком CDC42. Wedlich-Söldner 2003: экспрессия активированной CDC42; поляризация требовала направленной секреции по актиновым кабелям. Конкуренция участков и порог по запасу — расчёт моделей (Goryachev и Pokhilko 2008; обзор Chiou 2017). Исходы на схеме качественные.","sources":["Irazoqui2003","WedlichSoldner2003","Goryachev2008","Chiou2017"],"quiz":{"id":"S2-L23","question":"У дрожжей удалили ГТФазу Rsr1, передающую сигнал от ориентира, но Bem1 и Cdc24 сохранены. Где будет домен активной CDC42?","options":[{"id":"S2-L23-1","text":"Домена не будет: без ориентира нет поляризации","correct":false,"feedback":"Ориентир определяет только место. Клетки без ориентиров образуют домен активной CDC42 за счёт положительной обратной связи через Bem1 и Cdc24."},{"id":"S2-L23-2","text":"Будет один домен в случайном месте мембраны","correct":true,"feedback":"Обратная связь через Bem1 и Cdc24 усиливает случайное различие, а ограниченный запас CDC42 оставляет один домен. Без ориентира его положение случайно."},{"id":"S2-L23-3","text":"Появятся домены по всей мембране одновременно","correct":false,"feedback":"Общий запас CDC42 ограничен: участок, где кластер вырос раньше, связывает молекулы, которых тогда не хватает остальным участкам, поэтому в норме остаётся один домен."}]},"widget":{"kind":"q4fb","title":"","s":{"title":"Ориентир, обратная связь и запас CDC42","status":"Схема механизма; качественные исходы по экспериментам на дрожжах и моделям","cue_label":"Ориентир","cues":["есть","нет"],"fb_label":"Обратная связь Bem1 — Cdc24","fbs":["есть","нет"],"pool_label":"Запас CDC42","pools":["достаточный","малый"],"cue":"ориентир","dom":"CDC42-GTP","mem":"мембрана","out_one_cue":"один домен у ориентира","out_one_rand":"один домен в случайном месте","out_none":"устойчивого домена нет","out_weak":"слабое обогащение у ориентира","notes":{"1-1-1":"Обратная связь усиливает различие, заданное ориентиром, а ограниченный запас оставляет один домен — у ориентира.","0-1-1":"Без ориентира обратная связь усиливает случайное различие: образуется один домен в случайном месте (эксперименты Irazoqui 2003, Wedlich-Söldner 2003).","1-0-1":"Без обратной связи ориентир даёт лишь слабое обогащение: резкого домена нет (качественный вывод моделей).","0-0-1":"Нет ни ориентира, ни обратной связи: CDC42-GTP распределена по мембране равномерно.","1-1-0":"При слишком малом запасе CDC42 обратная связь не создаёт устойчивого кластера (вывод моделей): домена нет.","0-1-0":"При слишком малом запасе CDC42 обратная связь не создаёт устойчивого кластера (вывод моделей): домена нет.","1-0-0":"Без обратной связи и при малом запасе ориентир даёт лишь слабое обогащение.","0-0-0":"Нет ни ориентира, ни обратной связи: домена нет."},"legend":"Жёлтое — активная CDC42 (связана с GTP). Исходы при отсутствии обратной связи и при малом запасе — качественные выводы моделей, а не измерения."}},"section":3,"number":23,"question":4},{"id":"mutual-exclusion","questions":[4],"title":"Как два модуля белков PAR разделяют мембрану на два домена","keywords":["PAR-3","PAR-6","aPKC","PAR-1","взаимное вытеснение","бистабильность","14-3-3","зигота нематоды"],"lead":["Усиленное различие превращается в два взаимоисключающих домена, когда модули фосфорилируют друг друга.","Так работает система белков [[T79|PAR]]: передний модуль вытесняет задний, задний — передний."],"mechanism":["[[T80|aPKC]] переднего модуля фосфорилирует PAR-1 и снижает его способность удерживаться на мембране.","PAR-1 заднего модуля фосфорилирует PAR-3; с фосфорилированным PAR-3 связывается белок 14-3-3, и комплекс PAR-3 — PAR-6 — aPKC не собирается.","При достаточной нелинейности каждый участок мембраны занят одним модулем, и граница доменов резкая."],"paragraphs":["Систему PAR впервые описали в зиготе нематоды, затем нашли у дрозофилы, в эпителии и нейронах млекопитающих. Передний (в эпителии — апикальный) модуль включает PAR-3, PAR-6 и атипичную протеинкиназу C (aPKC), задний (базолатеральный) — киназу PAR-1. Ключ механизма — во [[T81|взаимном вытеснении]]: киназа каждого модуля фосфорилирует компоненты другого и тем удаляет их с мембраны.","Оба звена показаны прямо. aPKC фосфорилирует PAR-1b человека по Thr595, и это фосфорилирование снижает и киназную активность PAR-1b, и его связь с плазматической мембраной (Hurov 2004, клетки HeLa). PAR-1 у дрозофилы фосфорилирует Bazooka (PAR-3) по двум консервативным остаткам серина; с ними связывается белок 14-3-3, и Bazooka не образует комплекс с PAR-6 и aPKC. Bazooka без этих участков образует эктопические комплексы на латеральной мембране (Benton и St Johnston 2003).","Взаимное ингибирование само по себе не гарантирует двух устойчивых доменов. Нужна достаточная нелинейность — кооперативное связывание или олигомеризация на мембране — и подходящее соотношение концентраций; при других параметрах та же схема даёт одно смешанное состояние (Lang и Munro 2017). В зиготе нематоды домены PAR закладываются потоком коры, который сдвигает передние белки к одному полюсу (Goehring 2011). Перенос выводов между зиготой, эпителием и нейроном требует оговорок."],"trap":["Каждый белок PAR сам по себе находит «свою» сторону клетки.","Положение модулей задаёт их взаимодействие: каждый модуль фосфорилирует белки другого и вытесняет их с мембраны. Если убрать участок фосфорилирования, белок оказывается и на «чужой» мембране."],"conditions":"Hurov 2004: PAR-1b человека, клетки HeLa, остаток Thr595 фосфорилируется киназой aPKC. Benton и St Johnston 2003: эпителий и ооцит дрозофилы, Bazooka (PAR-3) фосфорилируется киназой PAR-1 по двум остаткам серина. Условия бистабильности — обзор Lang и Munro 2017; поток коры в зиготе нематоды — Goehring 2011. Схема качественная.","sources":["Hurov2004","Benton2003","Lang2017","Goehring2011"],"quiz":{"id":"S2-L24","question":"В эпителии дрозофилы экспрессировали Bazooka (PAR-3) с заменами двух остатков серина, которые фосфорилирует PAR-1. Где окажется этот белок?","options":[{"id":"S2-L24-1","text":"Только на апикальной мембране, как в норме","correct":false,"feedback":"В норме Bazooka остаётся только на апикальной мембране потому, что PAR-1 вытесняет её с латеральной. Без участков фосфорилирования это вытеснение не действует."},{"id":"S2-L24-2","text":"Во всей цитоплазме, без связи с мембраной","correct":false,"feedback":"Фосфорилирование киназой PAR-1 удаляет Bazooka с мембраны; без участков фосфорилирования белок не теряет связь с мембраной, а, наоборот, удерживается и там, где в норме отсутствует."},{"id":"S2-L24-3","text":"На апикальной и на латеральной мембране","correct":true,"feedback":"PAR-1 не может фосфорилировать этот белок, 14-3-3 с ним не связывается, и комплексы Bazooka с PAR-6 и aPKC образуются и на латеральной мембране (Benton и St Johnston 2003)."}]},"widget":{"kind":"q4par","title":"","s":{"title":"Взаимное вытеснение модулей PAR","status":"Схема механизма; качественные состояния","modes_label":"Состояние","modes":["норма","PAR-3 без участков для PAR-1","PAR-1 без участка для aPKC"],"ant":"PAR-3 · PAR-6 · aPKC","post":"PAR-1","api":"апикальная сторона","bas":"базолатеральная сторона","ph1":"aPKC","ph2":"PAR-1","legend":"Линия с поперечиной: киназа фосфорилирует белок другого модуля и вытесняет его с мембраны. Жёлтое — передний (апикальный) модуль PAR-3 · PAR-6 · aPKC, лиловое — задний (базолатеральный) модуль PAR-1.","lg_api":"передний (апикальный) модуль","lg_bas":"задний (базолатеральный) модуль","notes":["Каждый модуль фосфорилирует белки другого и вытесняет их с мембраны: граница доменов резкая.","PAR-1 не фосфорилирует PAR-3: комплексы PAR-3 — PAR-6 — aPKC образуются и на латеральной мембране (дрозофила; Benton и St Johnston 2003).","aPKC не может фосфорилировать PAR-1 по Thr595: PAR-1 сильнее удерживается на мембране и локализуется и в противоположном домене (по данным Hurov 2004 для клеток HeLa; схема качественная)."]}},"section":3,"number":24,"question":4},{"id":"three-fluxes","questions":[4],"title":"Как доставка, диффузия и эндоцитоз поддерживают домен","keywords":["направленная доставка","эндоцитоз","рециклирование","длина спада","стационарное состояние","Snc1","дрожжи"],"lead":["Домен — [[T06|стационарное состояние]] трёх потоков: доставки в домен, удержания в нём и удаления ушедших молекул.","Резкость границы определяется скоростью удаления: при быстром эндоцитозе белок не успевает отойти далеко от места доставки."],"mechanism":["[[T82|Направленная доставка]] приносит белок в определённую область мембраны по ориентированным трекам.","Латеральная диффузия размывает домен, а эндоцитоз удаляет молекулы раньше, чем они уйдут далеко.","Ширину домена задаёт длина спада λ = √(D/kэнд); в клетке удалённый белок может возвращаться в домен через [[T83|рециклирующие эндосомы]], в учебной модели этот возврат отдельно не моделируется."],"paragraphs":["Поддержание домена складывается из трёх процессов, и все они уже знакомы. Направленная доставка: секреторные пузырьки перемещаются по микротрубочкам и актиновым филаментам к определённой области мембраны и сливаются с ней при участии комплекса экзоциста. Удержание: каркасные белки коры связывают белки домена с цитоскелетом. Удаление: эндоцитоз изымает молекулы, ушедшие из домена, и они возвращаются через рециклирующие эндосомы или направляются на деградацию.","У почкующихся дрожжей так поддерживается полярность белка Snc1: он сосредоточен в почке и на кончике выроста, и для этого необходим его эндоцитоз. В мембране дрожжей Snc1 диффундирует примерно в 40 раз медленнее, чем мембранный белок животной клетки (около 0,0025 мкм²/с), и малой клетке хватает местной доставки и эндоцитозного возврата (Valdez-Taubas и Pelham 2003). Модель, построенная для активированной CDC42, показала, что баланса диффузии, направленного транспорта и эндоцитоза достаточно, чтобы описать форму домена (Marco 2007).","В стационарном состоянии профиль концентрации спадает от места доставки с характерной длиной λ = √(D/kэнд). Чем быстрее эндоцитоз, тем уже и резче домен, но тем меньше белка на мембране при том же потоке доставки. Поэтому, если удалённый белок возвращается к полюсу, у скорости эндоцитоза есть оптимум: при слишком быстром удалении на мембране остаётся так мало белка, что домен ослабевает. Marco и соавторы (2007) показали, что измеренные у дрожжей скорости эндоцитоза близки к такому оптимуму. Схема рассчитана по учебной модели практикума: поток доставки в ней постоянен и не зависит от скорости эндоцитоза, возврат удалённого белка к полюсу отдельно не моделируется, поэтому оптимума, описанного Marco 2007, в ней нет."],"trap":["Чем больше белка доставлено к полюсу, тем резче домен; эндоцитоз только мешает полярности.","Без удаления белок расходится диффузией по всей мембране. Эндоцитоз сужает домен: он убирает молекулы раньше, чем они уйдут от места доставки."],"conditions":"Snc1 у почкующихся дрожжей — Valdez-Taubas и Pelham 2003; модель для активированной CDC42 у дрожжей — Marco 2007. Схема — расчёт учебной модели практикума (вопрос 4, базовый уровень): окружность 30 мкм, D = 0,1 мкм²/с, постоянный поток доставки; числа условны.","sources":["ValdezTaubas2003","Marco2007"],"quiz":{"id":"S2-L25","question":"Белок доставляется к полюсу клетки; эндоцитоз ускорили в 4 раза, доставка и диффузия прежние. Как изменится ширина домена?","options":[{"id":"S2-L25-1","text":"Уменьшится: белок удаляется ближе к полюсу","correct":true,"feedback":"Длина спада λ = √(D/kэнд) при четырёхкратном ускорении эндоцитоза уменьшается вдвое: молекулы удаляются раньше, чем отойдут от места доставки."},{"id":"S2-L25-2","text":"Увеличится: белок быстрее возвращается к полюсу","correct":false,"feedback":"В модели поток доставки постоянен, поэтому быстрое удаление домен не расширяет. Ширину определяет путь, который молекула проходит диффузией до удаления, — он сокращается."},{"id":"S2-L25-3","text":"Не изменится: ширину задаёт только доставка","correct":false,"feedback":"Доставка задаёт место и высоту домена над фоном, а ширину — отношение диффузии к скорости удаления. Ускорение эндоцитоза сужает домен."}]},"widget":{"kind":"q4prof","title":"","s":{"title":"Доставка, диффузия и эндоцитоз","status":"Учебная модель, условные величины (та же, что в практикуме)","p_label":"Доставка к полюсу","ps":["равномерная","50 %","90 %"],"pv":[0,0.5,0.9],"k_label":"Эндоцитоз (kэнд)","ks":["медленный","средний","быстрый"],"kv":[0,4,8],"x":"расстояние от полюса, мкм","y":"концентрация (1 — исходное состояние)","m_con":"Контраст","m_lam":"Длина спада λ","m_tot":"Белок на мембране","u_um":"мкм","note":"Контраст ×{c}, длина спада {l} мкм, белка на мембране {m} % от исходного состояния (90 % к полюсу, средний эндоцитоз).","legend":"Сплошная линия — профиль от полюса до противоположной стороны; пунктир — та же доставка, распределённая равномерно."}},"section":3,"number":25,"question":4},{"id":"epithelium","questions":[4],"title":"Что удерживает апикальный домен эпителиальной клетки","keywords":["эпителий","апикальная мембрана","базолатеральная мембрана","Rab11","миозин Vb","NHE3","DPPIV","плотный контакт","клаудины","Slp4a","синтаксин 3","Vamp7","SNARE","экзоцист"],"lead":["Апикальный и базолатеральный домены эпителия получают белки разными путями доставки.","Плотный контакт закрывает промежуток между клетками, но распределение белков по доменам удерживается прежде всего транспортом."],"mechanism":["NHE3 проходит через рециклирующие эндосомы с Rab11a; Rab11a и Rab8a связывают с пузырьком [[T84|миозин Vb]], и этот мотор переносит пузырёк по актину к апикальной мембране.","У апикальной мембраны [[T94|синтаксин 3]] вместе с Munc18-2, Slp4a и Vamp7 обеспечивает слияние пузырька с мембраной, после которого NHE3 оказывается на поверхности.","Ошибочно доставленный белок удаляется эндоцитозом и возвращается через рециклирующие эндосомы; без тяжей [[T86|клаудинов]] [[T85|плотного контакта]] барьер для ионов слабеет, а распределение белков по доменам сохраняется."],"paragraphs":["Энтероцит всасывает вещества потому, что переносчики апикальной и базолатеральной мембран различны: вход и выход вещества разделены, и поток направлен. Белки апикальной мембраны приходят к ней разными путями. В клетках Caco-2 доставка переносчиков NHE3, CFTR и GLUT5 требует Rab11, Rab8, миозина Vb и синтаксина 3; без миозина Vb эти белки распределяются в пузырьках по цитоплазме, а DPPIV, сахараза-изомальтаза и аминопептидаза N остаются на апикальной мембране (Vogel 2015). Доставка избирательна: миозин Vb нужен части грузов, а не домену как таковому.","Путь NHE3 удобно разобрать по передачам: на каждой из них груз принимает другой белок или комплекс. NHE3 выбран потому, что для него прямо показана зависимость от миозина Vb и синтаксина 3 и независимость от Vamp3 (Vogel 2015). Сначала, по модели авторов, NHE3 из аппарата Гольджи попадает в рециклирующие эндосомы, на мембране которых находится Rab11a в форме, связанной с GTP; по какому сигналу NHE3 выбирает этот путь, неизвестно. Rab11a и Rab8a служат метками и местами связывания: они удерживают миозин Vb на пузырьке, а по актину движется сам миозин Vb за счёт гидролиза ATP. Миозин Vb с мутациями, нарушающими связь с Rab11 или Rab8, не располагается строго у апикальной мембраны и не восстанавливает полярность клеток без этого миозина (Vogel 2015).","Дальше пузырёк оказывается рядом с синтаксином 3. Этот [[T94|t-SNARE]] находится в апикальной мембране и без миозина Vb, но взаимодействие синтаксина 3 с Slp4a (белком пузырька, который связывает Rab8a) и с Munc18-2 в клетках без миозина Vb утрачивается; ослабевает и связь синтаксина 3 с Vamp7, а связь с Vamp3 сохраняется. Пузырёк, по предположению авторов, удерживается комплексом экзоциста (субъединица Sec15). Затем, как при любом SNARE-зависимом слиянии, сборка комплекса сближает мембраны пузырька и плазматической мембраны и приводит к их слиянию, и NHE3 оказывается в апикальной мембране. Белки-активаторы ГТФазы Rab (Rab-GAP) TBC1D30 и Evi5 связываются с синтаксином 3 и, как предполагают, переводят Rab8a и Rab11a в неактивную форму, завершая цикл.","Границы применимости. Результаты получены на клетках Caco-2 без миозина Vb (мутация 1125G>A, нонсенс-кодон), а взаимодействия белков показаны совместной очисткой из клеточных лизатов: это ассоциация, а не обязательно прямой контакт, и порядок передач — вывод авторов из таких данных. Для NHE3 непосредственно проверены миозин Vb, синтаксин 3 и Vamp3; участие Rab11a, Rab8a, Slp4a, Munc18-2 и Vamp7 следует из их взаимодействий и из нарушений полярности клеток, а не из отдельной проверки положения NHE3. Роль экзоциста и завершающая роль Rab-GAP остаются предположениями. Сигналы, по которым белки распределяются между путями, не найдены; для DPPIV, сахаразы-изомальтазы и аминопептидазы N предполагают путь в обход рециклирующих эндосом, но это не доказано. У части больных и у мышей без Rab8 или Rab11 эти ферменты задерживаются внутри клетки, а в других биоптатах доставка DPPIV и сахаразы-изомальтазы сохранена (обсуждение в Vogel 2015), поэтому разделение путей — результат на клетках Caco-2, а не правило для всех апикальных грузов и тканей.","Долго считалось, что тяжи плотного контакта — «изгородь», не пропускающая белки и липиды между доменами. Проверка вмешательством оказалась поучительной. В клетках MDCK II без пяти основных клаудинов тяжей нет, сопротивление монослоя снижено примерно втрое, но апикальные и базолатеральные маркеры распределены как в норме (Otani 2019). Значит, граница доменов поддерживается в основном доставкой, удержанием на каркасах и удалением. Мембранные белки контакта при этом не безразличны: при одновременном удалении клаудинов и JAM-A у части клеток полярность нарушалась (Otani 2019). Для липидов, которые диффундируют быстрее, барьер у контакта, вероятно, важнее (Günzel 2026).","Каркас плотного контакта ZO-1 и ZO-2 — отдельный вопрос: в клетках MDCK II без обоих белков полярность нарушалась (Otani 2019), а в клетках EpH4 с подавлением обоих белков сохранялась (Umeda 2006). Результат зависит от типа клеток. Схема рассчитана по учебной модели практикума."],"trap":["Полярность эпителия поддерживается плотным контактом: без него белки апикальной и базолатеральной мембран сразу перемешиваются.","Без тяжей клаудинов слабеет барьер, но распределение многих белков по доменам сохраняется: его поддерживают направленная доставка и удаление ошибочно доставленного белка."],"conditions":"Vogel 2015: клетки Caco-2 с мутацией MYO5B больного (1125G>A), фильтры и трёхмерные цисты. Otani 2019: клетки MDCK II без пяти основных клаудинов, сопротивление 52,5 → 14,5–19,8 Ом·см². Umeda 2006: клетки EpH4 с нокаутом ZO-1 и подавлением ZO-2. Схема — расчёт учебной модели практикума (вопрос 4, продвинутый уровень), числа условны, кроме сопротивления без клаудинов. Цепочка передач: Vogel 2015 — клетки Caco-2 (нокин MYO5B 1125G>A, нокауты Stx3, Rab8a, Vamp3 методом CRISPR/Cas9, подавление Rab11a малой шпилечной РНК); взаимодействия — совместная очистка активных мутантов Rab8a Q67L и Rab11a Q70L из лизатов; положение NHE3, CFTR, GLUT5 и DPPIV — конфокальная микроскопия, ≥ 100 клеток. Тетеринг экзоцистом и прекращение цикла Rab-белков через Rab-GAP — предположения авторов, прямо не проверенные.","sources":["Vogel2015","Otani2019","Umeda2006","Gunzel2026","RodriguezBoulan2014"],"quiz":{"id":"S2-L26","question":"В клетках Caco-2 нет миозина Vb. Где окажутся переносчик NHE3 и фермент DPPIV?","options":[{"id":"S2-L26-1","text":"NHE3 и DPPIV — на апикальной мембране, как в норме","correct":false,"feedback":"DPPIV действительно остаётся на апикальной мембране, но NHE3 без миозина Vb туда не доставляется и распределяется в пузырьках по цитоплазме."},{"id":"S2-L26-2","text":"NHE3 — в пузырьках, DPPIV — на апикальной мембране","correct":true,"feedback":"Миозин Vb переносит пузырьки с NHE3 к апикальной мембране, а DPPIV доставляется другим путём; так показана избирательность апикальной доставки (Vogel 2015)."},{"id":"S2-L26-3","text":"NHE3 и DPPIV — в пузырьках под апикальной мембраной","correct":false,"feedback":"Миозин Vb нужен не всем апикальным белкам: DPPIV доставляется другим путём и остаётся на апикальной мембране, в пузырьках задерживается только NHE3."}]},"widget":{"kind":"q4epi","title":"","s":{"title":"Апикальный домен энтероцита","status":"Учебная модель, условные величины (та же, что в практикуме)","g_label":"Клетки","gs":["норма","нет миозина Vb","нет клаудинов"],"gv":["wt","myo5b","cldn"],"c_label":"Белок","cs":["NHE3","DPPIV"],"cv":["nhe3","dppiv"],"a":"апикальная мембрана","b":"базолатеральная мембрана","i":"внутри клетки","ter":"сопротивление монослоя","ter_na":"не рассчитывается","of":"от нормы","note":"{name}: на апикальной мембране {a} %, на базолатеральной {b} %, внутри клетки {i} %; сопротивление монослоя — {ter}.","legend":"Доли белка — от всего его количества в клетке. Сопротивление монослоя — мера барьера, а не распределения белка."}},"section":3,"number":26,"question":4},{"id":"neuron-migration","questions":[4],"title":"Как полярность устроена у нейрона и у мигрирующей клетки","keywords":["нейрон","аксон","дендрит","начальный сегмент аксона","KIF5","мигрирующая клетка","RAC1","RHOA","возбудимая среда"],"lead":["У нейрона полярность разделяет аксон и дендриты, у мигрирующей клетки — передний и задний края.","Механизмы те же — избирательный транспорт и взаимное влияние модулей, — но устроены они по-разному."],"mechanism":["[[T89|Начальный сегмент аксона]] отделяет аксон от тела клетки и дендритов и ограничивает свободное перемещение белков.","Кинезин KIF5 связывается преимущественно с микротрубочками начального сегмента и потому избирательно переносит грузы в аксон.","У мигрирующей клетки [[T73|RAC1]] активен на переднем крае, RHOA — на заднем; на близком расстоянии они подавляют активность друг друга, а на дальнем — повышают."],"paragraphs":["Нейрон — предельный пример полярности. Аксон и соматодендритный отдел различаются составом мембраны, а граница проходит по начальному сегменту аксона — участку у его основания с особой организацией цитоскелета; он генерирует потенциал действия и служит фильтром для белков и грузов (Leterrier 2018). Направленный транспорт тоже избирателен: кинезин KIF5 связывается предпочтительно с микротрубочками начального сегмента, и пузырьки с аксонными белками направляются из аппарата Гольджи прямо в аксон; низкие дозы паклитаксела нарушали эту избирательность, и аксонные белки попадали в кончики дендритов (Nakata и Hirokawa 2003, культивируемые нейроны мыши).","У мигрирующей клетки ось — передний и задний края. RAC1 запускает сборку разветвлённого актина и выпячивание переднего края, RHOA — сокращение актомиозина на заднем. Система этих ГТФаз ведёт себя как возбудимая среда: области активации возникают и гаснут, а градиент хемоаттрактанта лишь смещает вероятность их появления (Devreotes 2017).","Взаимное подавление RAC1 и RHOA рядом — не вся картина. В нейтрофилоподобных клетках HL-60 показано и дальнее взаимное возбуждение: выпячивания, созданные RAC1, повышают натяжение мембраны и через mTORC2 активируют RHOA на противоположной стороне, а сокращение, вызванное RHOA, через поток коры активирует RAC1 вдали; эта связь нужна для поляризации и миграции первичных Т-лимфоцитов человека (De Belly 2026). Устойчивая ось поддерживается сочетанием локального торможения и дальнего возбуждения."],"trap":["Аксон и дендриты различаются только тем, какие белки синтезирует нейрон.","Многие белки синтезируются в теле нейрона, а затем избирательно доставляются и удерживаются в своём отделе: кинезин KIF5 связывается преимущественно с микротрубочками начального сегмента, а начальный сегмент аксона служит фильтром. Дополнительный вклад в состав отростков вносят транспорт мРНК и локальная трансляция. Поэтому различие аксона и дендритов определяется совместной работой этих механизмов и барьеров полярности."],"conditions":"Nakata и Hirokawa 2003: культивируемые нейроны мыши, KIF5 и микротрубочки начального сегмента, низкие дозы паклитаксела. Начальный сегмент аксона — обзор Leterrier 2018. Возбудимая среда малых ГТФаз — обзор Devreotes 2017. Дальнее взаимное возбуждение RAC1 и RHOA — De Belly 2026 (оптогенетика в нейтрофилоподобных клетках HL-60 и первичных Т-лимфоцитах человека, сохраняется в эпителиальных клетках). Схема качественная.","sources":["Nakata2003","Leterrier2018","Devreotes2017","DeBelly2026"],"quiz":{"id":"S2-L27","question":"В мигрирующей клетке оптогенетически вызвали выпячивание переднего края. Как, по данным De Belly 2026, изменится активность RHOA на противоположной стороне клетки?","options":[{"id":"S2-L27-1","text":"Снизится: RAC1 подавляет RHOA во всей клетке","correct":false,"feedback":"Взаимное подавление RAC1 и RHOA действует только на близком расстоянии. На противоположной стороне выпячивание через натяжение мембраны и mTORC2 активирует RHOA."},{"id":"S2-L27-2","text":"Не изменится: сигнал не выходит за край","correct":false,"feedback":"Натяжение мембраны передаётся по всей клетке быстро, поэтому выпячивание на переднем крае влияет и на противоположную сторону."},{"id":"S2-L27-3","text":"Повысится: натяжение мембраны активирует RHOA","correct":true,"feedback":"Выпячивание, вызванное RAC1, повышает натяжение мембраны, и через mTORC2 RHOA активируется на противоположной стороне: передний и задний края активируют друг друга на расстоянии."}]},"widget":{"kind":"q4nm","title":"","s":{"title":"Полярность нейрона и мигрирующей клетки","status":"Схема механизма","modes_label":"Клетка","modes":["нейрон","мигрирующая клетка"],"soma":"тело","dend":"дендриты","ais":"начальный сегмент","axon":"аксон","kif5":"KIF5","cargo":"аксонный груз","front":"передний край","back":"задний край","rac":"RAC1","rho":"RHOA","tension":"натяжение мембраны","flow":"поток коры","move":"направление движения","notes":["KIF5 связывается преимущественно с микротрубочками начального сегмента и переносит груз в аксон; начальный сегмент ограничивает перемещение белков между отделами.","RAC1 на переднем крае и RHOA на заднем подавляют друг друга рядом и активируют друг друга на расстоянии через натяжение мембраны и поток коры."]}},"section":3,"number":27,"question":4},{"id":"measure-polarity","questions":[4],"title":"Как измерить полярность и отличить её от барьера","keywords":["маркеры доменов","конфокальный срез","FRAP","трансэпителиальное сопротивление","парацеллюлярный поток","болезнь включений микроворсинок","MYO5B"],"lead":["Полярность — это распределение белков и липидов по доменам, барьер — проницаемость промежутков между клетками.","Это разные величины, и измеряют их разными методами."],"mechanism":["Распределение маркеров доменов показывают на вертикальном конфокальном срезе монослоя.","Подвижность белка в мембране и обмен между доменами измеряют [[T08|FRAP]].","Барьер измеряют [[T87|трансэпителиальным сопротивлением]] и потоком меток между клетками."],"paragraphs":["Полярность определяют по положению маркеров: апикальных (у клеток MDCK — gp135, эзрин) и базолатеральных (Na⁺/K⁺-АТФаза, Scribble). Монослой на фильтре метят антителами и рассматривают на вертикальном (XZ) конфокальном срезе; результат — доля маркера на каждой мембране. FRAP мембранного белка или липидного зонда показывает, обменивается ли он с соседними участками и пересекает ли границу доменов.","Барьер — отдельная величина. Трансэпителиальное сопротивление измеряют электродами, опущенными по обе стороны фильтра: оно отражает проницаемость межклеточных промежутков для ионов. Поток флуоресцентных меток разного размера с одной стороны монослоя на другую показывает проницаемость для молекул. Эти величины могут меняться независимо от распределения белков: без клаудинов сопротивление падает, а маркеры распределены как в норме (Otani 2019).","Медицинский пример — [[T88|болезнь включений микроворсинок]] (врождённая атрофия микроворсинок), наследственная болезнь новорождённых с тяжёлой диареей. Её основная причина — мутации MYO5B (Müller 2008; Ruemmele 2010): в энтероцитах меньше микроворсинок, под апикальной мембраной накапливаются пузырьки, а часть апикальных переносчиков, в том числе NHE3, не доставляется к мембране. Нарушена прежде всего доставка, то есть поддержание апикального домена; это видно по распределению белков и ультраструктуре энтероцитов."],"trap":["Если сопротивление монослоя снижено, значит, клетки утратили полярность.","Сопротивление измеряет барьер для ионов в межклеточных промежутках. Полярность определяют по распределению маркеров доменов; эти величины меняются независимо."],"conditions":"Маркеры, сопротивление и поток меток в клетках MDCK II — Otani 2019. Схема FRAP — в шаге «Чего не доказывает яркий фокус». Болезнь включений микроворсинок: Müller 2008 (мутации MYO5B у больных), Ruemmele 2010 (15 мутаций, подавление MYO5B в клетках Caco-2), Vogel 2015 (NHE3 в клетках Caco-2 с мутацией больного). Схемы методов не масштабны.","sources":["Otani2019","Muller2008","Ruemmele2010","Vogel2015"],"quiz":{"id":"S2-L28","question":"После воздействия сопротивление монослоя снизилось втрое, а апикальные и базолатеральные маркеры распределены как в контроле. Какой вывод правомерен?","options":[{"id":"S2-L28-1","text":"Нарушен барьер, полярность сохранена","correct":true,"feedback":"Сопротивление отражает проницаемость межклеточных промежутков, а распределение маркеров — полярность. Изменилась только первая величина."},{"id":"S2-L28-2","text":"Нарушены и барьер, и полярность","correct":false,"feedback":"Полярность оценивают по распределению маркеров, а оно не изменилось. Снижение сопротивления само по себе о полярности не говорит."},{"id":"S2-L28-3","text":"Нарушена полярность, барьер сохранён","correct":false,"feedback":"Снижение сопротивления как раз и означает ослабление барьера для ионов, а маркеры доменов распределены нормально."}]},"widget":{"kind":"q4method","title":"","s":{"title":"Методы: полярность и барьер","status":"Схемы методов","modes_label":"Метод","modes":["Маркеры доменов","FRAP в мембране","Сопротивление монослоя","Поток меток"],"schemes":[{"draw":"q4mark","h":282,"l":{"pA":"А","a":"Монослой на фильтре","pB":"Б","b":"Вертикальный срез","api":"апикальный маркер","bas":"базолатеральный маркер","filter":"фильтр","z":"линия среза"},"note":"Маркеры доменов метят антителами и смотрят на вертикальном конфокальном срезе: апикальный маркер должен быть сверху, базолатеральный — на боковых и нижней мембранах.","legend":"Метод показывает распределение белков (полярность), но не проницаемость промежутков между клетками."},{"draw":"q4frap","h":300,"l":{"pA":"А","a":"Обесцвечивание участка","pB":"Б","b":"Восстановление","bleach":"фотообесцвечивание","dom":"граница доменов","t":"время","f":"флуоресценция"},"note":"Флуоресценцию в участке мембраны гасят светом и смотрят, откуда она восстанавливается: из того же домена или и через границу доменов.","legend":"FRAP показывает подвижность и обмен молекул; быстрое восстановление само по себе не говорит, есть ли барьер на границе."},{"draw":"q4ter","h":300,"l":{"pA":"А","a":"Измерение","pB":"Б","b":"Результат","ap":"апикальная камера","bl":"базолатеральная камера","el":"электроды","mono":"монослой на фильтре","norm":"норма","ko":"без клаудинов","y":"% от нормы","v_norm":"100 %","v_ko":"≈ 30 %"},"note":"Сопротивление монослоя измеряют электродами, опущенными по обе стороны фильтра. Оно отражает проницаемость межклеточных промежутков для ионов; в клетках MDCK II без клаудинов — около трети от нормы (Otani 2019).","legend":"Метод измеряет барьер, а не распределение белков между доменами."},{"draw":"q4flux","h":300,"l":{"pA":"А","a":"Добавление меток","pB":"Б","b":"Через заданное время","small":"малая метка","big":"крупная метка","ap":"апикальная камера","bl":"базолатеральная камера"},"note":"Метки разного размера добавляют в апикальную камеру и измеряют, сколько их прошло в базолатеральную. Без клаудинов малая метка (флуоресцеин) проходит легко, крупные — тем хуже, чем они больше (Otani 2019).","legend":"Поток меток дополняет сопротивление: он показывает, для молекул какого размера проницаем промежуток."}]}},"section":3,"number":28,"question":4},{"id":"methods","questions":[1,2,3,4],"title":"Как выбрать величину, метод и контроль","keywords":["метод","контроль","величина","кимограмма","FRAP","необходимость","достаточность","трансэпителиальное сопротивление"],"lead":["Для каждого механизма семинара сначала решают, какую величину измерять, затем — каким методом и с каким контролем.","Во всех четырёх разделах вид клетки совместим с несколькими механизмами, и отделяет их только правильно выбранный контроль."],"mechanism":["Величина: направление пробегов груза, частота событий слияния и деления, зависимость структуры от концентрации каркаса и распределение белка между структурой и окружением, контраст домена — это разные измерения, и одно не заменяет другое.","Метод: прижизненная съёмка с кимограммой, обмен матриксным маркером, FRAP и разведение, распределение маркеров доменов и трансэпителиальное сопротивление.","Контроль: вмешательство, которое меняет одно звено, — удаление белка показывает его [[T90|необходимость]], а искусственное присоединение или индуцированная сборка — [[T91|достаточность]]."],"paragraphs":["Каждый из четырёх механизмов описывается своей величиной. Для транспорта это направление и скорость пробегов отдельных грузов и доля подвижных грузов; их измеряют по кимограмме, построенной из прижизненной съёмки, а ориентацию треков в той же клетке определяют по меткам растущих плюс-концов. Для слияния и деления митохондрий морфология сети — лишь картина; процесс измеряют частотой событий и обменом матриксным маркером, а функцию — отдельно, по мембранному потенциалу и потреблению кислорода.","Для конденсата измеряют зависимость от концентрации каркасного компонента: исчезает ли структура при её снижении и появляется ли при повышении, как распределяется белок между структурой и окружением. Пороговая картина согласуется с фазовым разделением, но бывает и у других кооперативных сборок. FRAP добавляет сведения об обмене компонентов, слияние фокусов — о материальных свойствах, но ни один признак отдельно не доказывает фазового разделения. Для поля
