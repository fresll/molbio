осоме — {ee} %.", "s3b_c_fyve_api_z": "Одна киназа одновременно удаляет одну метку и создаёт другую, поэтому её подавление меняет обе.", "s3b_c_snxa": "SnxA связывается прежде всего с поздней эндосомой и лизосомой (занятость {le} %), где PIKfyve превращает PI3P в PI(3,5)P₂; на ранней эндосоме — {ee} %.", "s3b_c_snxa_z": "PI(3,5)P₂ — минорный, но характерный липид поздних эндосом и лизосом; он активирует канал TRPML1, через который Ca²⁺ выходит из лизосомы.", "s3b_c_snxa_vps": "Ингибитор VPS34 снизил содержание PI(3,5)P₂ на поздней эндосоме до {c_le} у. е. (занятость SnxA {le} %): PIKfyve активна, но ей не хватает субстрата — PI3P.", "s3b_c_snxa_vps_z": "Метки связаны цепочкой превращений: PI(3,5)P₂ образуется из PI3P, поэтому подавление первой киназы снижает и вторую метку.", "s3b_c_snxa_api": "Апилимод подавил PIKfyve: содержание PI(3,5)P₂ на поздней эндосоме снизилось до {c_le} у. е., занятость SnxA — {le} %.", "s3b_c_snxa_api_z": "При дефиците PI(3,5)P₂ поздние эндосомы и лизосомы увеличиваются и превращаются в крупные вакуоли (Dong 2010; Chow 2007).", "s3b_c_snxa_both": "Подавлены и VPS34, и PIKfyve: PI(3,5)P₂ на поздней эндосоме — {c_le} у. е., занятость SnxA — {le} %.", "s3b_c_snxa_both_z": "Без субстрата и без фермента метка поздней эндосомы почти не образуется.", "s3b_c_akt_rest": "Без фактора роста PI(3,4,5)P₃ в плазматической мембране мало ({c_pm} у. е.), и PH-AKT почти не связывается с мембраной (занятость {pm} %).", "s3b_c_akt_rest_z": "PI(3,4,5)P₃ — не постоянная метка мембраны, а кратковременный сигнал рецептора.", "s3b_c_akt_gf": "Фактор роста активировал PI3K класса I: PI(3,4,5)P₃ в плазматической мембране — {c_pm} у. е., занятость PH-AKT выросла до {pm} %.", "s3b_c_akt_gf_z": "Белки, PH-домены которых связывают PI(3,4,5)P₃, в том числе киназа AKT, удерживаются на плазматической мембране, пока PTEN и SHIP не дефосфорилируют этот липид; PI(3,4)P₂, образуемый SHIP, AKT тоже связывает.", "s3b_c_akt_pten": "Без PTEN даже базальная активность PI3K класса I создаёт PI(3,4,5)P₃ в плазматической мембране ({c_pm} у. е.), и занятость PH-AKT — {pm} % без фактора роста.", "s3b_c_akt_pten_z": "Содержание сигнального липида задаёт баланс киназы и фосфатазы; потеря фосфатазы повышает его и без стимула.", "s3b_c_akt_gfpten": "Фактор роста в клетках без PTEN: PI(3,4,5)P₃ — {c_pm} у. е., в несколько раз больше, чем после фактора роста в контроле; занятость PH-AKT — {pm} %.", "s3b_c_akt_gfpten_z": "Утрату PTEN связывают с длительным удержанием AKT и других белков с PH-доменами на плазматической мембране.", "s3b_take": "Каждую метку на своей мембране синтезирует местная киназа, а удаляют местные фосфатазы или следующая киназа; содержание метки — стационар синтеза и удаления, поэтому подавление одного фермента меняет метку только там, где он работает, и в связанных с ней превращениях. Сенсор на основе одного домена показывает места, где липид сочетается с условиями связывания этого домена: P4M выявляет PI4P на трёх мембранах, PH-FAPP1 — только на Гольджи.", "p3b_1_q": "В клетках с сенсором 2×FYVE подавили VPS34. Как изменится занятость сенсора на ранней эндосоме?", "p3b_1_o1": "Снизится в несколько раз", "p3b_1_o2": "Почти не изменится", "p3b_1_o3": "Сенсор перейдёт на плазматическую мембрану", "p3b_1_e": "На ранней эндосоме PI3P синтезируется киназой VPS34 и непрерывно удаляется 3-фосфатазами. При подавленном синтезе содержание PI3P снижается до 10 у. е., и занятость 2×FYVE падает с 63 до 14 %.", "p3b_1_w2": "Запас PI3P на мембране не постоянен: фосфатазы удаляют его за минуты, и без синтеза содержание метки быстро снижается.", "p3b_1_w3": "2×FYVE связывает PI3P, а в плазматической мембране PI3P почти нет; потеряв метку эндосомы, сенсор остаётся в цитозоле.", "p3b_2_q": "В клетках с сенсором SnxA подавили VPS34, а PIKfyve осталась активной. Как изменится содержание PI(3,5)P₂ на поздней эндосоме?", "p3b_2_o1": "Не изменится: PIKfyve работает", "p3b_2_o2": "Снизится: не хватает субстрата", "p3b_2_o3": "Возрастёт за счёт PIKfyve", "p3b_2_e": "PIKfyve синтезирует PI(3,5)P₂ из PI3P, а PI3P образуется под действием VPS34. Без субстрата PIKfyve образует мало продукта: содержание PI(3,5)P₂ на поздней эндосоме снижается со 100 до 10 у. е., занятость SnxA — с 63 до 14 %.", "p3b_2_w1": "Активность фермента не гарантирует продукта: PIKfyve фосфорилирует PI3P, и при подавленной VPS34 субстрата для неё почти нет.", "p3b_2_w3": "PIKfyve не может восполнить недостаток собственного субстрата: она превращает PI3P в PI(3,5)P₂, а не синтезирует PI3P.", "p3b_3_q": "В клетках с сенсором PH-AKT добавили фактор роста. Как изменится занятость сенсора на плазматической мембране?", "p3b_3_o1": "Почти не изменится", "p3b_3_o2": "Снизится: PI(4,5)P₂ расходуется", "p3b_3_o3": "Возрастёт в несколько раз", "p3b_3_e": "Рецептор фактора роста активирует PI3K класса I, которая фосфорилирует PI(4,5)P₂ с образованием PI(3,4,5)P₃. Содержание PI(3,4,5)P₃ растёт с 4 до 100 у. е., и занятость PH-AKT увеличивается с 6 до 63 %.", "p3b_3_w1": "PH-AKT связывает PI(3,4,5)P₃ и PI(3,4)P₂, а их в покоящейся клетке мало; фактор роста резко повышает синтез PI(3,4,5)P₃.", "p3b_3_w2": "PI(4,5)P₂ при этом расходуется лишь немного, а PH-AKT связывает не его, а продукт PI3K — PI(3,4,5)P₃.", "p3b_4_q": "В клетках с сенсором PH-AKT без фактора роста утрачен PTEN. Как изменится занятость сенсора на плазматической мембране?", "p3b_4_o1": "Возрастёт и без фактора роста", "p3b_4_o2": "Не изменится, пока нет фактора роста", "p3b_4_o3": "Снизится до нуля", "p3b_4_e": "PI3K класса I и без стимула сохраняет низкую базальную активность, а PTEN непрерывно дефосфорилирует PI(3,4,5)P₃ до PI(4,5)P₂. Без PTEN содержание PI(3,4,5)P₃ растёт с 4 до 17 у. е., и занятость PH-AKT — с 6 до 22 %.", "p3b_4_w2": "PTEN работает и в покое: содержание PI(3,4,5)P₃ задаёт баланс базального синтеза и удаления, а не только сигнал рецептора.", "p3b_4_w3": "PTEN не синтезирует PI(3,4,5)P₃, а дефосфорилирует его; без PTEN этот липид удаляется медленнее, а не исчезает.", "p3b_5_q": "В клетках сенсор PI4P PH-FAPP1 заменили сенсором P4M, условия не меняли. С какими мембранами будет связываться P4M?", "p3b_5_o1": "Только с аппаратом Гольджи, как PH-FAPP1", "p3b_5_o2": "Со всеми мембранами, кроме ранней эндосомы", "p3b_5_o3": "Одинаково со всеми четырьмя мембранами", "p3b_5_e": "PH-FAPP1 связывается с мембраной только при сочетании PI4P и Arf1-GTP, поэтому показывает лишь Гольджи. Для связывания P4M достаточно PI4P: занятость P4M — 63 % на Гольджи, 53 % на плазматической мембране и 31 % на поздней эндосоме (так P4M локализуется и в опытах Hammond 2014).", "p3b_5_w1": "Такое распределение показывает сенсор, которому для связывания нужен ещё Arf1-GTP; PI4P есть и вне Гольджи, и P4M его там связывает.", "p3b_5_w3": "На ранней эндосоме PI4P в модели нет, а на остальных мембранах его содержание различается, поэтому и занятость P4M разная.", "p3b_6_q": "В клетках с сенсором PH-PLCδ1 подавили PIKfyve апилимодом. Как изменится занятость сенсора на плазматической мембране?", "p3b_6_o1": "Снизится вместе с PI(3,5)P₂", "p3b_6_o2": "Возрастёт за счёт неиспользованного PI3P", "p3b_6_o3": "Практически не изменится", "p3b_6_e": "PIKfyve работает на эндосомах и не участвует в синтезе PI(4,5)P₂ в плазматической мембране. Содержание PI(3,5)P₂ на поздней эндосоме снижается до 14 у. е., а содержание PI(4,5)P₂ и занятость PH-PLCδ1 (63 %) остаются прежними.", "p3b_6_w1": "PI(4,5)P₂ и PI(3,5)P₂ синтезируют разные киназы на разных мембранах; подавление PIKfyve не затрагивает PIP5K в плазматической мембране.", "p3b_6_w2": "PI3P не служит предшественником PI(4,5)P₂: в плазматической мембране PI(4,5)P₂ образуется из PI4P, а PI3P остаётся на эндосомах.", "s3a_x_t": "Опыт", "s3a_x_ham": "удаление липидов из плазматической мембраны", "s3a_x_eea": "EEA1 на ранней эндосоме", "s3a_z_t": "Фосфатаза, слитая с FKBP", "s3a_z_dead": "неактивная", "s3a_z_e5": "5-фосфатаза", "s3a_z_sac": "4-фосфатаза", "s3a_z_pj": "обе (псевдоянин)", "s3a_t_rapa": "Рапамицин (переносит фосфатазу на плазматическую мембрану)", "s3a_r_t": "Rab5 в клетках", "s3a_r_wt": "дикий тип", "s3a_r_sn": "S34N", "s3a_r_ql": "Q79L", "s3a_v_t": "Активность VPS34", "s3a_v_note": "100 % — контроль; 10 % — с ингибитором VPS34. Rab5 S34N преимущественно связывает GDP, Rab5 Q79L почти не гидролизует GTP и находится в GTP-связанной форме (Stenmark 1994).", "s3a_h_status1": "Данные опыта: клетки COS-7, перенос фосфатазы на плазматическую", "s3a_h_status2": "мембрану рапамицином, минуты (Hammond 2012); качественно", "s3a_h_out": "внеклеточная среда", "s3a_h_pm": "плазматическая мембрана, цитозольный монослой", "s3a_h_cyt": "цитозоль", "s3a_h_frb": "FRB", "s3a_h_fkbp": "FKBP", "s3a_hz_dead": "неактивная", "s3a_hz_e5": "5-фосфатаза", "s3a_hz_sac": "PJ-Sac", "s3a_hz_pj": "псевдоянин", "s3a_h_rapa": "рапамицин", "s3a_h_plcd": "PH-PLCδ1", "s3a_h_osh": "PH-Osh2×2", "s3a_h_marcks": "MARCKS-ED", "s3a_h_lg_pip2": "PI(4,5)P₂", "s3a_h_lg_pi4p": "PI4P", "s3a_h_lg_bound": "связан с мембраной", "s3a_l_n": "как в контроле", "s3a_l_up": "немного выше", "s3a_l_dn": "снижено", "s3a_l_nd": "не показано", "s3a_l_pm": "на мембране", "s3a_l_cyt": "переходит в цитозоль", "s3a_hr_pip2": "PI(4,5)P₂", "s3a_hr_pip2_s": "в плазматической мембране", "s3a_hr_pi4p": "PI4P", "s3a_hr_pi4p_s": "в плазматической мембране", "s3a_hr_plcd": "PH-PLCδ1", "s3a_hr_plcd_s": "сенсор PI(4,5)P₂", "s3a_hr_osh": "PH-Osh2×2", "s3a_hr_osh_s": "сенсор, связывающий и PI4P, и PI(4,5)P₂", "s3a_hr_marcks": "MARCKS-ED", "s3a_hr_marcks_s": "полиосновный пептид; так же вели себя хвост Rit1 и другие полиосновные зонды", "s3a_hr_golgi": "PI4P аппарата Гольджи", "s3a_hr_golgi_s": "проверка избирательности; в статье показана для псевдоянина", "s3a_hr_note": "Качественные результаты статьи Hammond 2012, без чисел. Сравнение — с теми же клетками до переноса фосфатазы.", "s3a_c_norapa": "Без рапамицина фосфатаза, слитая с FKBP, остаётся в цитозоле: липиды плазматической мембраны и положение PH-PLCδ1, PH-Osh2×2 и MARCKS-ED не меняются.", "s3a_c_norapa_z": "Встроенный контроль: эффект появляется только после переноса фермента на мембрану, а не от самого присутствия белка в клетке.", "s3a_c_dead": "Рапамицин перенёс на плазматическую мембрану химеру с инактивированными доменами обеих фосфатаз (PJ-Dead): PI(4,5)P₂, PI4P и положение всех трёх белков — как в контроле.", "s3a_c_dead_z": "Контроль показывает, что эффекты вызывает ферментативная активность, а не перенос белка или рапамицин.", "s3a_c_e5": "5-фосфатаза превратила PI(4,5)P₂ в PI4P: содержание PI(4,5)P₂ снизилось, PI4P — немного выросло, PH-PLCδ1 перешёл в цитозоль, а PH-Osh2×2 и MARCKS-ED остались на мембране.", "s3a_c_e5_z": "Белок со специфичным к PI(4,5)P₂ доменом зависит от этого липида, а полиосновные белки удерживаются и оставшимся PI4P.", "s3a_c_sac": "Химера PJ-Sac (активен только домен 4-фосфатазы Sac1) удалила PI4P из плазматической мембраны, а содержание PI(4,5)P₂ и положение PH-PLCδ1, PH-Osh2×2 и MARCKS-ED не изменились.", "s3a_c_sac_z": "Основная часть PI4P плазматической мембраны не нужна для поддержания PI(4,5)P₂ в стационаре: PI4P — не только предшественник.", "s3a_c_pj": "Псевдоянин удалил и PI(4,5)P₂, и PI4P: PH-PLCδ1, PH-Osh2×2 и MARCKS-ED диссоциировали от плазматической мембраны, а PI4P аппарата Гольджи остался прежним.", "s3a_c_pj_z": "Для удержания полиосновных белков каждый липид по отдельности заменим другим, а вместе они необходимы: PI4P и PI(4,5)P₂ — независимые определяющие признаки плазматической мембраны.", "s3a_e_status": "Учебная модель, условные величины: f = fA·fB", "s3a_e_ee": "мембрана ранней эндосомы", "s3a_e_lumen": "просвет", "s3a_e_lg_pi3p": "PI3P", "s3a_e_lg_gtp": "Rab5-GTP", "s3a_e_lg_gdp": "Rab5-GDP", "s3a_e_lg_eea1": "EEA1", "s3a_er_p": "PI3P на ранней эндосоме", "s3a_er_p_s": "у. е.; 100 — контроль (модель вопроса 3, базовый уровень)", "s3a_er_fa": "Занятость сайта PI3P (домен FYVE), fA", "s3a_er_fb": "Занятость сайта Rab5-GTP, fB", "s3a_er_f": "Доля EEA1 на эндосоме, f = fA·fB", "s3a_er_plot": "Доля EEA1 на эндосоме в зависимости от содержания PI3P (у. е.) при трёх вариантах Rab5; учебная модель, относительные величины", "s3a_er_plot_hid": "График появится после ответа.", "s3a_er_lg_ql": "Rab5 Q79L", "s3a_er_lg_wt": "дикий тип", "s3a_er_lg_sn": "Rab5 S34N", "s3a_er_lg_cur": "текущее состояние", "s3a_er_note": "Модель независимых сайтов — упрощение: прочно связанным считается только EEA1, у которого заняты оба сайта, поэтому доля связанного белка равна произведению занятостей. Каждая кривая — гипербола без порога (коэффициент Хилла 1); занятость Rab5 меняет её высоту. В клетках признаки неравноценны: мутанты EEA1, не связывающие Rab5 C-концевым участком, локализовались на эндосомах так же, как белок дикого типа (Lawe 2000; Lawe 2002).", "s3a_c_wt": "Есть оба признака: PI3P занимает сайт FYVE на {fa} %, Rab5-GTP — свой сайт на {fb} %, и на эндосоме связано {f} % EEA1.", "s3a_c_wt_z": "EEA1 собирается там, где совпадают метка ранней эндосомы и активный Rab5, и связывает эндосомы перед слиянием.", "s3a_c_wt_mid": "PI3P на эндосоме снижен до {p} у. е.: занятость сайта FYVE — {fa} %, доля EEA1 на эндосоме — {f} %; она снижается плавно, без порога.", "s3a_c_wt_mid_z": "Произведение занятостей даёт избирательность, но не резкую границу: при меньшем PI3P EEA1 связывается меньше, плавно и без скачка.", "s3a_c_wt_low": "PI3P на эндосоме — {p} у. е.: сайт FYVE занят на {fa} %, и, несмотря на Rab5-GTP, на эндосоме связано лишь {f} % EEA1.", "s3a_c_wt_low_z": "Одного активного Rab5 мало для прочного связывания EEA1: нужна и липидная метка.", "s3a_c_none": "При нулевой активности VPS34 PI3P на эндосоме в модели нет: сайт FYVE свободен, и EEA1 не связывается с эндосомой при любом состоянии Rab5.", "s3a_c_none_z": "В модели прочное связывание требует обоих признаков, и без PI3P EEA1 не удерживается даже при избытке Rab5-GTP. В опытах избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K (Simonsen 1998).", "s3a_c_sn": "Rab5 S34N преимущественно связывает GDP: сайт Rab5-GTP занят лишь на {fb} %, и при PI3P {p} у. е. на эндосоме связано {f} % EEA1.", "s3a_c_sn_z": "В модели без активного Rab5 EEA1 удерживается на мембране слабо. В клетках для посадки EEA1 решающим оказался PI3P: мутанты EEA1, не связывающие Rab5 C-концевым участком, локализовались на эндосомах так же, как белок дикого типа (Lawe 2002).", "s3a_c_ql": "Rab5 Q79L почти не гидролизует GTP: сайт Rab5-GTP занят на {fb} %, и на эндосоме связано {f} % EEA1.", "s3a_c_ql_z": "Избыток Rab5-GTP повышает связывание EEA1 и увеличивает ранние эндосомы (Stenmark 1994).", "s3a_c_ql_low": "PI3P снижен до {p} у. е., но с Rab5 Q79L сайт Rab5-GTP занят на {fb} %: на эндосоме связано {f} % EEA1 — меньше, чем при нормальном PI3P, но больше, чем у клеток с Rab5 дикого типа ({fwt} %).", "s3a_c_ql_low_z": "В модели избыток одного признака частично возмещает недостаток другого; в опытах избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K (Simonsen 1998).", "s3a_take": "Метку можно считать причиной, только если вмешательство меняет поведение мембраны: при удалении PI4P или PI(4,5)P₂ по отдельности MARCKS-ED и другие полиосновные зонды оставались на плазматической мембране, а при удалении обоих липидов диссоциировали от неё: по отдельности липиды взаимозаменяемы, вместе необходимы (Hammond 2012). Точность адресации даёт совпадение признаков: в модели EEA1 прочно связывается с эндосомой, когда есть и PI3P, и Rab5-GTP, и произведение занятостей даёт избирательность, но не порог; в клетках для посадки EEA1 решающим оказался PI3P (Lawe 2002). Перепад PI4P, созданный киназой за счёт ATP, служит движущей силой переноса липидов через контактный сайт (вопрос 4).", "p3a_1_q": "5-фосфатазу, слитую с FKBP, рапамицином перенесли на плазматическую мембрану. Где окажется сенсор PH-PLCδ1?", "p3a_1_o1": "Останется на мембране: там остаётся PI4P", "p3a_1_o2": "Перейдёт с мембраны в цитозоль", "p3a_1_o3": "Перейдёт на мембраны Гольджи", "p3a_1_e": "5-фосфатаза превращает PI(4,5)P₂ в PI4P: содержание PI(4,5)P₂ снижается, PI4P даже немного растёт. PH-PLCδ1 избирательно связывает PI(4,5)P₂ и переходит в цитозоль (Hammond 2012).", "p3a_1_w1": "PH-домен PLCδ1 избирателен к PI(4,5)P₂; PI4P его на мембране не удерживает, хотя содержание PI4P даже выросло.", "p3a_1_w3": "На Гольджи нет PI(4,5)P₂, который связывает PH-PLCδ1; освободившийся сенсор остаётся в цитозоле.", "p3a_2_q": "Химеру PJ-Sac с активным доменом 4-фосфатазы Sac1 рапамицином перенесли на плазматическую мембрану. Как изменится содержание PI(4,5)P₂ в этой мембране?", "p3a_2_o1": "Снизится: исчез предшественник PI4P", "p3a_2_o2": "Возрастёт: PI4P переходит в PI(4,5)P₂", "p3a_2_o3": "Не изменится: PIP5K хватает субстрата", "p3a_2_e": "PJ-Sac удаляет PI4P из плазматической мембраны, но содержание PI(4,5)P₂ и положение PH-PLCδ1 не меняются. Основная часть PI4P этой мембраны не нужна для поддержания PI(4,5)P₂ в стационаре (Hammond 2012).", "p3a_2_w1": "PI4P — предшественник PI(4,5)P₂, но PJ-Sac удаляет пул PI4P, а не PI-4-киназы: PIP5K, вероятно, сразу использует вновь синтезированный PI4P или получает его из других мембран (Hammond 2012).", "p3a_2_w2": "Домен Sac1 дефосфорилирует PI4P до фосфатидилинозитола и не создаёт дополнительного субстрата для PIP5K.", "p3a_3_q": "Псевдоянин, удаляющий и PI(4,5)P₂, и PI4P, рапамицином перенесли на плазматическую мембрану. Где окажется полиосновный пептид MARCKS-ED?", "p3a_3_o1": "Перейдёт в цитозоль: оба липида удалены", "p3a_3_o2": "Останется на мембране за счёт фосфатидилсерина", "p3a_3_o3": "Останется на мембране за счёт фосфатидилинозитола", "p3a_3_e": "Полиосновный пептид удерживается электростатически многовалентными анионными липидами — PI(4,5)P₂ и PI4P. Когда псевдоянин удаляет оба липида, MARCKS-ED переходит в цитозоль (Hammond 2012).", "p3a_3_w2": "Фосфатидилсерин остаётся в мембране, но его однозарядной головки не хватает, чтобы удержать полиосновный пептид без PI(4,5)P₂ и PI4P.", "p3a_3_w3": "Фосфатидилинозитол, образующийся при гидролизе, несёт один отрицательный заряд и есть во многих мембранах; он не служит признаком плазматической мембраны.", "p3a_4_q": "5-фосфатазу, слитую с FKBP, рапамицином перенесли на плазматическую мембрану. Где окажется полиосновный пептид MARCKS-ED?", "p3a_4_o1": "Перейдёт в цитозоль вместе с PH-PLCδ1", "p3a_4_o2": "В основном останется на мембране", "p3a_4_o3": "Перейдёт на эндосомы", "p3a_4_e": "5-фосфатаза удаляет PI(4,5)P₂, но превращает его в PI4P, который тоже несёт многозарядную головку. Полиосновный пептид удерживается и PI4P, поэтому MARCKS-ED почти не меняет положения, хотя PH-PLCδ1 переходит в цитозоль (Hammond 2012).", "p3a_4_w1": "PH-PLCδ1 узнаёт именно PI(4,5)P₂, а полиосновный пептид связывается с любым многозарядным анионным липидом, и оставшийся PI4P его удерживает.", "p3a_4_w3": "Полиосновный пептид удерживается высокой плотностью многозарядных липидов, характерной для плазматической мембраны; на эндосомах такой плотности нет.", "p3a_5_q": "В клетках с Rab5 дикого типа активность VPS34 снизили со 100 до 10 %. Как изменится доля EEA1 на ранней эндосоме?", "p3a_5_o1": "Не изменится: Rab5-GTP на месте", "p3a_5_o2": "Возрастёт: EEA1 перейдёт к Rab5", "p3a_5_o3": "Снизится в несколько раз: PI3P стало мало", "p3a_5_e": "Содержание PI3P на эндосоме снижается до 10 у. е., и сайт FYVE занят лишь на 20 % вместо 71 %. В модели прочное связывание требует обоих признаков, поэтому доля EEA1 на эндосоме падает с 36 до 10 %.", "p3a_5_w1": "Одного Rab5-GTP мало: в модели доля связанного EEA1 равна произведению занятостей двух сайтов, и при снижении PI3P она падает, даже если Rab5 активен.", "p3a_5_w2": "Сайт Rab5 и сайт PI3P принадлежат одной молекуле EEA1; потеря PI3P ослабляет её связывание, а не направляет к Rab5.", "p3a_6_q": "В клетках с Rab5 Q79L активность VPS34 снизили со 100 до 10 %. Какой станет доля EEA1 на ранней эндосоме?", "p3a_6_o1": "Снизится, но останется выше, чем у дикого типа", "p3a_6_o2": "Снизится до уровня клеток с Rab5 дикого типа", "p3a_6_o3": "Останется прежней благодаря Rab5-GTP", "p3a_6_e": "С Rab5 Q79L сайт Rab5-GTP занят на 95 %. При активности VPS34 10 % доля EEA1 падает с 68 до 19 %, но остаётся выше, чем у клеток с Rab5 дикого типа при том же ингибиторе (10 %). В опытах Simonsen 1998 избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K; в модели это возмещение частичное.", "p3a_6_w2": "Произведение зависит от обоих сомножителей: при одинаково низком PI3P занятость сайта Rab5-GTP у Q79L выше, чем у дикого типа (95 и 50 %).", "p3a_6_w3": "Rab5-GTP не возмещает потерю PI3P полностью: сайт FYVE освобождается, и прочно связанного EEA1 становится меньше.", "p3a_7_q": "В клетках с Rab5 дикого типа активность VPS34 снизили со 100 до 50 %, и содержание PI3P на эндосоме уменьшилось вдвое. Как изменится доля EEA1 на эндосоме?", "p3a_7_o1": "Уменьшится тоже вдвое", "p3a_7_o2": "Уменьшится меньше чем вдвое", "p3a_7_o3": "Упадёт почти до нуля", "p3a_7_e": "Зависимость занятости сайта PI3P от содержания PI3P — гипербола с насыщением: при снижении PI3P со 100 до 50 у. е. она падает лишь с 71 до 56 %. Доля EEA1 снижается с 36 до 28 % — примерно на пятую часть, без порога.", "p3a_7_w1": "Пропорциональным снижение было бы вдали от насыщения; при 100 у. е. сайт FYVE занят на 71 %, и двукратное снижение PI3P уменьшает занятость меньше чем вдвое.", "p3a_7_w3": "Резкое падение означало бы порог; у произведения занятостей независимых сайтов порога нет, и доля EEA1 убывает плавно.", "gn_pip2": "PI(4,5)P₂ (фосфатидилинозитол-4,5-бисфосфат)", "g_pip2": "Характерный фосфоинозитид цитозольного монослоя плазматической мембраны. Образуется из PI4P киназами PIP5K, удаляется 5-фосфатазами (OCRL, INPP5E и др.), расходуется фосфолипазой C (на IP₃ и диацилглицерол) и PI3K класса I. Удерживает на мембране белки эндоцитоза, регуляторы актина, ряд ионных каналов. В модели практикума есть только в плазматической мембране; сенсор — PH-домен PLCδ1.", "gn_pi3p": "PI3P (фосфатидилинозитол-3-фосфат)", "g_pi3p": "Характерный фосфоинозитид ранних эндосом; есть также на внутренних пузырьках мультивезикулярных эндосом и на мембранах, участвующих в аутофагии. Синтезируется VPS34 (PI3K класса III) из фосфатидилинозитола, удаляется 3-фосфатазами (миотубулярины) и превращается PIKfyve в PI(3,5)P₂. Связывается доменами FYVE (EEA1) и PX (сортирующие нексины). Сенсор — 2×FYVE.", "gn_pi35p2": "PI(3,5)P₂ (фосфатидилинозитол-3,5-бисфосфат)", "g_pi35p2": "Минорный фосфоинозитид поздних эндосом и лизосом; образуется из PI3P киназой PIKfyve и дефосфорилируется до PI3P фосфатазой FIG4. Прямо активирует лизосомный канал TRPML1 (Dong 2010). При его дефиците поздние эндосомы и лизосомы увеличиваются и превращаются в вакуоли (Chow 2007; Dong 2010).", "gn_pi3ki": "PI3K класса I (фосфоинозитид-3-киназа)", "g_pi3ki": "Липидкиназа, которая после активации рецепторов факторов роста фосфорилирует PI(4,5)P₂ в положении 3 и создаёт в плазматической мембране PI(3,4,5)P₃. Активирующие мутации гена каталитической субъединицы p110α (PIK3CA) часто находят в опухолях человека (Samuels 2004). Вортманнин ингибирует PI3K разных классов и потому не позволяет различить, какой из классов действует.", "gn_pten": "PTEN", "g_pten": "Липидфосфатаза, отщепляющая фосфат в положении 3 инозитольного кольца: PI(3,4,5)P₃ → PI(4,5)P₂ (Maehama и Dixon 1998). Работает и в покое, поэтому её утрата повышает содержание PI(3,4,5)P₃ и без стимула. Наследственные мутации гена PTEN вызывают синдром Каудена (Liaw 1997); соматическая утрата PTEN часта в опухолях. Фосфатаза SHIP удаляет PI(3,4,5)P₃ иначе — с образованием PI(3,4)P₂.", "gn_vps34": "VPS34 (PI3K класса III)", "g_vps34": "Липидкиназа, синтезирующая PI3P из фосфатидилинозитола на мембранах ранних эндосом (в комплексе, связанном с Rab5) и при аутофагии. Избирательные ингибиторы (например, SAR405 — Ronan 2014) снижают содержание PI3P и нарушают работу поздних эндосом и лизосом. В модели практикума ингибитор оставляет 10 % активности.", "gn_pikfyve": "PIKfyve", "g_pikfyve": "Липидкиназа поздних эндосом, фосфорилирующая PI3P в положении 5 с образованием PI(3,5)P₂; работает в комплексе с белком VAC14 и фосфатазой FIG4. Апилимод — ингибитор PIKfyve (Cai 2013): PI(3,5)P₂ снижается, поздние эндосомы и лизосомы увеличиваются. Мутации FIG4 вызывают болезнь Шарко — Мари — Тута типа 4J (Chow 2007).", "gn_phplcd": "PH-PLCδ1 — сенсор PI(4,5)P₂", "g_phplcd": "PH-домен фосфолипазы Cδ1, слитый с флуоресцентным белком (Várnai и Balla 1998). Избирательно связывает PI(4,5)P₂ и показывает плазматическую мембрану; при снижении содержания PI(4,5)P₂ переходит в цитозоль. Связывает также IP₃, поэтому при активации фосфолипазы C часть сигнала отражает растворимый IP₃.", "gn_p4m": "P4M — сенсор PI4P", "g_p4m": "PI4P-связывающий фрагмент белка SidM бактерии Legionella pneumophila, слитый с флуоресцентным белком (Hammond 2014). Для его связывания с мембраной PI4P необходим и достаточен, поэтому P4M показывает PI4P на аппарате Гольджи, на плазматической мембране и на поздних эндосомах и лизосомах (несущих Rab7).", "gn_phfapp": "PH-FAPP1 — сенсор PI4P с дополнительным условием", "g_phfapp": "PH-домен белка FAPP1. Связывается с мембраной при сочетании PI4P и активного Arf1 и поэтому показывает в основном аппарат Гольджи, хотя PI4P есть и в других мембранах. Пример того, как сенсор на основе домена показывает не липид сам по себе, а места, где липид сочетается с условиями связывания (Hammond 2014). В модели требование Arf1-GTP — учебное упрощение.", "gn_fyve2": "2×FYVE — сенсор PI3P", "g_fyve2": "Два тандемно соединённых FYVE-домена, слитые с флуоресцентным белком (Gillooly 2000). Связывают PI3P с высоким сродством и показывают ранние эндосомы и внутренние пузырьки мультивезикулярных эндосом. Удвоение домена повышает авидность, но при сильной экспрессии сенсор занимает PI3P, нужный собственным белкам клетки.", "gn_snxa": "SnxA — сенсор PI(3,5)P₂", "g_snxa": "Белок SnxA амёбы Dictyostelium, избирательно связывающий PI(3,5)P₂; предложен как сенсор этого липида и для клеток млекопитающих (Vines 2023). Ранее предложенный сенсор ML1N×2 (Li 2013) оказался малоизбирательным: его локализация в клетках во многом не зависела от PI(3,5)P₂ (Hammond 2015). Надёжность сенсоров PI(3,5)P₂ пока ниже, чем у сенсоров PI4P и PI(4,5)P₂.", "gn_phakt": "PH-AKT — сенсор PI(3,4,5)P₃", "g_phakt": "PH-домен киназы AKT, слитый с флуоресцентным белком. Связывает PI(3,4,5)P₃ и PI(3,4)P₂, поэтому его сигнал на плазматической мембране отражает сумму двух липидов; в модели практикума он так и рассчитан. После фактора роста сенсор быстро переходит на плазматическую мембрану.", "gn_fkbp": "Сближение FKBP–FRB рапамицином", "g_fkbp": "Метод быстрого вмешательства: домен FRB закреплён на плазматической мембране, а фермент слит с FKBP и находится в цитозоле. Рапамицин связывает FKBP и FRB одновременно, и фермент за минуты оказывается на мембране. Так удаляют выбранный липид в одной мембране и проверяют, необходим ли он; контроли — без рапамицина и с неактивным ферментом. Псевдоянин — химера 5-фосфатазы INPP5E и 4-фосфатазы Sac1; в варианте PJ-Sac инактивирован домен INPP5E, и химера удаляет только PI4P, в варианте PJ-Dead инактивированы оба домена (Hammond 2012).", "gn_osh": "PH-Osh2×2", "g_osh": "Тандем PH-доменов дрожжевого белка Osh2, слитый с флуоресцентным белком; связывает и PI4P, и PI(4,5)P₂. В опыте Hammond 2012 диссоциировал от плазматической мембраны только при удалении обоих липидов.", "gn_marcks": "MARCKS-ED — полиосновный зонд", "g_marcks": "Эффекторный домен белка MARCKS — короткий участок с многочисленными остатками лизина и аргинина. Удерживается на мембране электростатически, многовалентными анионными липидами, а не узнаванием одного липида. В опыте Hammond 2012 диссоциировал от плазматической мембраны только при удалении и PI(4,5)P₂, и PI4P; так же вели себя хвост Rit1, пептид CAP23 и домен KA1, а пренилированный хвост K-Ras оставался на мембране, но переставал на ней обогащаться.", "gn_eea1": "EEA1", "g_eea1": "Белок ранних эндосом, необходимый для их связывания друг с другом и слияния. На C-конце несёт домен FYVE, связывающий PI3P, и примыкающий к нему участок, необходимый для связывания Rab5-GTP (Lawe 2000). Классический пример коинцидентного узнавания — узнавания по совпадению двух и более признаков. Признаки неравноценны: мутанты EEA1, не связывающие Rab5 C-концевым участком, локализовались на эндосомах так же, как белок дикого типа; для посадки EEA1 решающим оказался PI3P, а связывание Rab5, по-видимому, регулирует последующее слияние (Lawe 2002). Избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K (Simonsen 1998). Модель практикума f = fA·fB — упрощение.", "gn_rab5": "Rab5", "g_rab5": "Малая ГТФаза ранних эндосом: в GTP-связанной форме связывается с эффекторами (EEA1, комплекс VPS34), после гидролиза GTP — нет. Мутант S34N преимущественно связывает GDP и подавляет слияние ранних эндосом; мутант Q79L почти не гидролизует GTP и вызывает образование крупных ранних эндосом (Stenmark 1994). При созревании эндосомы Rab5 сменяется на Rab7.", "s4b_con_t": "Контакт ЭПР — митохондрия", "s4b_con_on": "обычный", "s4b_con_low": "меньше тетеринг-белков", "s4b_st_t": "Стимул", "s4b_st_rest": "покой", "s4b_st_ip3": "открытие IP₃R", "s4b_st_mod": "вход Ca²⁺ извне до 0,4 мкМ", "s4b_st_high": "вход Ca²⁺ извне до 3 мкМ", "s4b_mi_t": "Регулятор MICU1", "s4b_mi_yes": "есть", "s4b_mi_no": "нет", "s4b_note": "Открытие IP₃R — выход Ca²⁺ из ЭПР через рецепторы IP₃ (например, при стимуляции клеток HeLa гистамином). Вход Ca²⁺ извне через каналы плазматической мембраны поднимает Ca²⁺ одинаково во всём цитозоле. Все концентрации Ca²⁺ — свободные.", "s4b_lb_er": "ЭПР", "s4b_lb_er_ca": "в просвете ЭПР свободный Ca²⁺ — сотни мкМ", "s4b_lb_omm": "наружная мембрана", "s4b_lb_imm": "внутренняя мембрана", "s4b_lb_mat": "матрикс", "s4b_lb_cyto": "остальной цитозоль", "s4b_lb_tr": "перенос", "s4b_lb_dh": "дегидрогеназы цикла Кребса", "s4b_lb_dh2": "активируются Ca²⁺ матрикса", "s4b_lb_soce": "вход Ca²⁺ извне", "s4b_lg_ca": "Ca²⁺ (число точек — условно)", "s4b_lg_scale": "схема не в масштабе", "s4b_zone_on": "зона контакта: зазор 10–30 нм", "s4b_zone_low": "зона контакта: связей меньше, зазор шире", "s4b_r_gap": "Ca²⁺ у поверхности митохондрии в зоне контакта", "s4b_r_gap_s": "свободный, в зазоре между ЭПР и митохондрией", "s4b_r_bulk": "Ca²⁺ в остальном цитозоле", "s4b_r_bulk_s": "свободный", "s4b_r_u": "Скорость захвата Ca²⁺ через MCU, % от максимальной", "s4b_r_share": "Доля захвата через зону контакта", "s4b_r_share_s": "% от всего захвата; в контакте {f} % поверхности митохондрии", "s4b_r_m": "Ca²⁺ в матриксе", "s4b_r_m_s": "свободный, относительно покоя в клетках с MICU1 (в покое около 0,1 мкМ, как в цитозоле)", "s4b_r_dh": "Ca²⁺-зависимые дегидрогеназы: доля активной формы", "s4b_r_note": "Учебная модель, условные величины. Максимальная скорость захвата — у митохондрии с MICU1 при насыщающем Ca²⁺. Ca²⁺ в зазоре при открытии IP₃R — 15 мкМ; в опытах Csordás 2010 (клетки RBL-2H3) сенсор показал в зазоре в среднем около 9 мкМ, в части клеток — до 25 мкМ, и авторы считают эти значения нижней оценкой.", "s4b_c_rest": "Покой: свободный Ca²⁺ в цитозоле и в зазоре контакта — {b} мкМ, ниже порога открытия MCU. Захват через MCU {u} % от максимального, Ca²⁺ в матриксе ×{m} от покоя.", "s4b_c_rest_z": "При низком Ca²⁺ MICU1 удерживает канал закрытым, поэтому митохондрия не накапливает Ca²⁺ в покое, хотя движущая сила для его входа в матрикс велика.", "s4b_c_rest_nomicu": "Покой без MICU1: Ca²⁺ в цитозоле {b} мкМ. Захват {u} % от максимального, Ca²⁺ в матриксе ×{m} — почти как в клетках с MICU1: насосы плазматической мембраны и ЭПР поддерживают низкий Ca²⁺ в цитозоле.", "s4b_c_rest_nomicu_z": "В покое потеря MICU1 почти незаметна; различие проявляется, когда Ca²⁺ в цитозоле поднимается.", "s4b_c_ip3": "Открытие IP₃R: у поверхности митохондрии в зоне контакта {g} мкМ свободного Ca²⁺, в остальном цитозоле {b} мкМ. Через зону контакта, на которую приходится {f} % поверхности, идёт {sh} % захвата; Ca²⁺ в матриксе ×{m}.", "s4b_c_ip3_z": "Микродомен поднимает Ca²⁺ выше порога MCU только у контакта, поэтому митохондрия отвечает на выброс Ca²⁺ из ЭПР быстро и в определённом месте; Ca²⁺-зависимые дегидрогеназы активны на {dh} %.", "s4b_c_ip3_low": "Тетеринг-белков меньше, зазор шире: при открытии IP₃R у поверхности митохондрии лишь {g} мкМ Ca²⁺, через зону контакта идёт {sh} % захвата. Ca²⁺ в матриксе ×{m}, дегидрогеназы активны на {dh} %.", "s4b_c_ip3_low_z": "Выход Ca²⁺ из ЭПР сохранён, но до митохондрии его доходит меньше: передача сигнала зависит от сближения мембран.", "s4b_c_ip3_nomicu": "Без MICU1 при открытии IP₃R: в зоне контакта {g} мкМ Ca²⁺, в остальном цитозоле {b} мкМ. Захват {u} % от максимального, через зону контакта — {sh} %; Ca²⁺ в матриксе ×{m}.", "s4b_c_ip3_nomicu_z": "Без MICU1 канал слабее отвечает на высокий Ca²⁺ микродомена и сильнее — на умеренный Ca²⁺ остального цитозоля, поэтому захват меньше сосредоточен у контакта.", "s4b_c_ip3_low_nomicu": "Без MICU1 и при меньшем числе тетеринг-белков: в зоне контакта {g} мкМ Ca²⁺, через неё идёт лишь {sh} % захвата, остальной Ca²⁺ входит из цитозоля ({b} мкМ). Ca²⁺ в матриксе ×{m}.", "s4b_c_ip3_low_nomicu_z": "Без MICU1 митохондрия захватывает Ca²⁺ и при концентрациях ниже 1 мкМ, поэтому доля захвата через зону контакта меньше.", "s4b_c_mod": "Вход Ca²⁺ извне поднял Ca²⁺ во всём цитозоле до {b} мкМ; микродомена у контакта нет. Это ниже порога открытия MCU: захват {u} % от максимального, Ca²⁺ в матриксе ×{m}.", "s4b_c_mod_z": "MICU1 удерживает канал закрытым при небольших подъёмах Ca²⁺, и митохондрия не накапливает Ca²⁺ при каждом таком колебании.", "s4b_c_mod_nomicu": "Без MICU1 подъём Ca²⁺ во всём цитозоле до {b} мкМ уже вызывает захват: {u} % от максимального, Ca²⁺ в матриксе ×{m}.", "s4b_c_mod_nomicu_z": "Без MICU1 порог снижается: митохондрии накапливают Ca²⁺ при подъёмах, на которые митохондрии с MICU1 почти не отвечают (Csordás 2013).", "s4b_c_high": "Вход Ca²⁺ извне поднял Ca²⁺ во всём цитозоле до {b} мкМ, выше порога. Захват идёт по всей поверхности митохондрии ({u} % от максимального), через зону контакта — лишь {sh} %; Ca²⁺ в матриксе ×{m}.", "s4b_c_high_z": "Контакт облегчает захват, но не служит единственным условием входа: при подъёме Ca²⁺ во всём цитозоле выше порога MCU работает и вне контактов.", "s4b_c_high_nomicu": "Без MICU1 при подъёме Ca²⁺ во всём цитозоле до {b} мкМ захват {u} % от максимального — меньше, чем с MICU1 при той же концентрации (39 %); Ca²⁺ в матриксе ×{m}.", "s4b_c_high_nomicu_z": "При высоком Ca²⁺ MICU1 обеспечивает крутое, кооперативное открытие канала; без него захват ниже (Csordás 2013).", "s4b_take": "Контакт ЭПР — митохондрия создаёт микродомен: при открытии IP₃R у поверхности митохондрии свободный Ca²⁺ на порядок выше, чем в остальном цитозоле, и выше порога MCU, поэтому захват быстрый и идёт прежде всего через зону контакта. Порог и крутую зависимость захвата от Ca²⁺ задаёт MICU1: без него порог снижается, митохондрия захватывает Ca²⁺ уже при небольших подъёмах, а на микродомен отвечает слабее. Контакт не служит единственным условием входа: при подъёме Ca²⁺ во всём цитозоле выше порога MCU работает и вне контактов. MCU — канал; работу по накоплению Ca²⁺ в матриксе совершает дыхательная цепь, создавшая Δψ.", "gn_tether": "Тетеринг-белки контакта ЭПР — митохондрия", "g_tether": "Тетеринг-белки — белки или комплексы, одновременно связанные с мембранами двух органелл и удерживающие их на расстоянии порядка 10–30 нм; слияния мембран они не вызывают. У дрожжей контакт ЭПР — митохондрия удерживает комплекс ERMES; у млекопитающих такого комплекса нет, и контакт удерживают несколько белков: среди них PDZD8, SMP-домен которого функционально соответствует домену белка Mmm1 из ERMES (Hirabayashi 2017); роль митофузина 2 спорна. Электронная томография показала связи длиной около 10 нм у гладкого ЭПР и около 25 нм у шероховатого; частичный протеолиз этих связей почти устранял подъём Ca²⁺ в матриксе при сохранённом выходе Ca²⁺ из ЭПР (Csordás 2006). В модели «меньше тетеринг-белков» означает меньшую долю поверхности митохондрии в контакте (4 % вместо 12 %) и более широкий зазор.", "gn_micu1": "MICU1 (регулятор кальциевого унипортера)", "g_micu1": "Белок межмембранного пространства, связанный с MCU и связывающий Ca²⁺ двумя EF-мотивами. По данным Csordás 2013 (гепатоциты мыши, клетки HeLa) MICU1 выполняет две функции: удерживает канал закрытым, пока Ca²⁺ снаружи от внутренней мембраны ниже примерно 0,5–1 мкМ, и обеспечивает крутое, кооперативное открытие при более высоком Ca²⁺ (для второй функции нужны EF-мотивы). Без MICU1 порог снижается: захват заметен уже при 0,3–0,4 мкМ, а его рост с повышением Ca²⁺ менее крутой. MICU1 работает в комплексе с MICU2.", "gn_vdac": "VDAC (порин наружной мембраны)", "g_vdac": "Потенциал-зависимый анионный канал наружной мембраны митохондрии. Благодаря VDAC наружная мембрана проницаема для ионов и небольших метаболитов, поэтому Ca²⁺ из зазора контакта проходит в межмембранное пространство без затраты энергии; избирательный барьер для Ca²⁺ — внутренняя мембрана с MCU. На контакте VDAC1 связан с рецептором IP₃ через шаперон GRP75 (Szabadkai 2006). Переносчиком липидов между ЭПР и митохондрией VDAC не считается.", "gn_dh": "Ca²⁺-зависимые дегидрогеназы матрикса", "g_dh": "Три фермента матрикса, активность которых растёт с концентрацией Ca²⁺ в матриксе: пируватдегидрогеназный комплекс (Ca²⁺ активирует его фосфатазу), NAD-зависимая изоцитратдегидрогеназа и 2-оксоглутаратдегидрогеназа (обзор Denton 2009). Их активация повышает образование NADH для дыхательной цепи. Так поступление Ca²⁺ через контакт связывает сигнал с окислением субстратов. В модели доля активной формы — Ca²⁺/(Ca²⁺ + 1 мкМ); константа учебная.", "p4b_1_q": "В клетке с обычными контактами ЭПР — митохондрия открываются рецепторы IP₃. Как будет соотноситься концентрация свободного Ca²⁺ у поверхности митохондрии в зоне контакта и в остальном цитозоле?", "p4b_1_o1": "В зоне контакта на порядок выше", "p4b_1_o2": "Будет одинаковой во всём цитозоле", "p4b_1_o3": "В зоне контакта ниже: Ca²⁺ захватывает MCU", "p4b_1_e": "Ca²⁺ выходит через рецепторы IP₃ в зоне контакта и достигает митохондрии раньше, чем рассеется по цитозолю и свяжется с буферами. В модели в зазоре 15 мкМ, в остальном цитозоле 0,8 мкМ; в опытах Csordás 2010 — в среднем около 9 мкМ (нижняя оценка).", "p4b_1_w2": "Выравнивание концентрации требует времени, а буферы по пути связывают большую часть Ca²⁺. Пока каналы открыты, у их устья концентрация выше, чем вдали.", "p4b_1_w3": "MCU захватывает лишь часть приходящего Ca²⁺, а поступление через открытые IP₃R в узкий зазор идёт быстрее. Поэтому у поверхности митохондрии Ca²⁺ остаётся выше, чем в остальном цитозоле.", "p4b_2_q": "В клетках снизили число тетеринг-белков, удерживающих ЭПР рядом с митохондрией, и открыли IP₃R. Как изменится концентрация свободного Ca²⁺ в матриксе по сравнению с клетками с обычными контактами?", "p4b_2_o1": "Не изменится: MCU в митохондрии тот же", "p4b_2_o2": "Снизится в несколько раз: микродомен слабее", "p4b_2_o3": "Вырастет: Ca²⁺ дольше остаётся в цитозоле", "p4b_2_e": "Выход Ca²⁺ из ЭПР сохранён, но зазор шире и мест сближения меньше, поэтому у поверхности митохондрии лишь 2 мкМ Ca²⁺. Ca²⁺ в матриксе ×4,5 вместо ×27. В пермеабилизованных клетках RBL-2H3 частичный протеолиз связей между ЭПР и митохондриями почти устранял подъём Ca²⁺ в матриксе при сохранённом выходе Ca²⁺ из ЭПР (Csordás 2006).", "p4b_2_w1": "Канал тот же, но его открытие зависит от концентрации Ca²⁺ у внутренней мембраны. Без сближения мембран эта концентрация остаётся около порога MCU.", "p4b_2_w3": "В остальном цитозоле Ca²⁺ поднимается лишь до 0,8 мкМ — ниже порога MCU, поэтому Ca²⁺ цитозоля не заменяет микродомен у контакта.", "p4b_3_q": "В клетках с уменьшенным числом тетеринг-белков Ca²⁺ во всём цитозоле подняли до 3 мкМ за счёт входа извне. Как изменится концентрация свободного Ca²⁺ в матриксе?", "p4b_3_o1": "Почти не изменится: контактов мало", "p4b_3_o2": "Вырастет лишь в 1,5–2 раза", "p4b_3_o3": "Вырастет в десятки раз", "p4b_3_e": "3 мкМ — выше порога, который задаёт MICU1, поэтому MCU открывается по всей поверхности митохондрии, а не только в зоне контакта: через зону контакта идёт лишь 4 % захвата. Ca²⁺ в матриксе ×78.", "p4b_3_w1": "Контакт нужен, чтобы поднять Ca²⁺ выше порога у части поверхности митохондрии. Когда выше порога весь цитозоль, MCU открывается и вне контактов.", "p4b_3_w2": "Небольшой рост был бы при подъёме ниже порога, например до 0,4 мкМ. При 3 мкМ MICU1 кооперативно усиливает открытие MCU.", "p4b_4_q": "В клетках с обычными контактами и с MICU1 Ca²⁺ во всём цитозоле подняли с 0,1 до 0,4 мкМ. Как изменится концентрация свободного Ca²⁺ в матриксе?", "p4b_4_o1": "Вырастет в четыре раза, как в цитозоле", "p4b_4_o2": "Почти не изменится", "p4b_4_o3": "Вырастет в десятки раз", "p4b_4_e": "0,4 мкМ — ниже кажущегося порога MCU (около 1 мкМ). MICU1 удерживает канал закрытым: захват меньше 1 % от максимального, Ca²⁺ в матриксе ×1,3. Так митохондрия не отвечает на небольшие подъёмы Ca²⁺ (Csordás 2013).", "p4b_4_w1": "Пропорциональный рост был бы у канала без порога. Захват через MCU зависит от Ca²⁺ кооперативно и ниже 1 мкМ почти не идёт.", "p4b_4_w3": "Рост в десятки раз требует Ca²⁺ выше порога — в микродомене у контакта или при сильном подъёме во всём цитозоле.", "p4b_5_q": "Ca²⁺ во всём цитозоле поднимают до 0,4 мкМ. Как изменится скорость захвата Ca²⁺ через MCU у клеток без MICU1 по сравнению с клетками с MICU1?", "p4b_5_o1": "Вырастет в несколько раз: порог снижен", "p4b_5_o2": "Снизится: без регулятора канал работает хуже", "p4b_5_o3": "Не изменится: MICU1 действует только выше 1 мкМ", "p4b_5_e": "MICU1 удерживает канал закрытым при низком Ca²⁺. Без него захват заметен уже ниже 0,5 мкМ: в модели 0,7 % от максимального вместо 0,1 %, Ca²⁺ в матриксе ×2,4 вместо ×1,3. В опытах Csordás 2013 митохондрии клеток без MICU1 накапливали Ca²⁺ при подъёмах до 0,3–0,4 мкМ, на которые нормальные митохондрии не отвечали.", "p4b_5_w2": "Хуже без MICU1 канал открывается при высоком Ca²⁺. При низком Ca²⁺ без регулятора он, наоборот, чаще остаётся открытым.", "p4b_5_w3": "MICU1 действует в обе стороны: при высоком Ca²⁺ усиливает открытие канала, а при низком удерживает его закрытым.", "p4b_6_q": "В клетках с обычными контактами открывают IP₃R; сравнивают клетки с MICU1 и без него. Как изменится у клеток без MICU1 доля захвата Ca²⁺, идущая через зону контакта?", "p4b_6_o1": "Вырастет: захват сильнее сосредоточится у контакта", "p4b_6_o2": "Не изменится: её задаёт только площадь контакта", "p4b_6_o3": "Снизится: больше Ca²⁺ войдёт вне контакта", "p4b_6_e": "Без MICU1 открытие MCU менее круто зависит от Ca²⁺: при 15 мкМ в зазоре захват ниже, а при 0,8 мкМ в остальном цитозоле — выше, чем с MICU1. Доля захвата через зону контакта снижается с 92 до 73 %, общий захват — с 13 до 9,5 % от максимального. MICU1 делает ответ митохондрии избирательным по месту.", "p4b_6_w1": "Крутая зависимость открытия MCU от Ca²⁺, которую обеспечивает MICU1, и сосредоточивает захват у контакта. Без MICU1 канал чаще открывается и при умеренном Ca²⁺ остального цитозоля, поэтому захват распределяется по поверхности шире.", "p4b_6_w2": "Площадь контакта здесь не менялась, но доля захвата зависит и от того, как канал отвечает на разные концентрации Ca²⁺.", "s4a_t_kin": "ингибитор PI4KIIIβ", "s4a_t_osw": "OSW-1 (ингибитор OSBP)", "s4a_t_sac": "нет SAC1", "s4a_t_vap": "нет VAP-A и VAP-B", "s4a_ar_t": "Площадь контакта", "s4a_ar_1": "обычная", "s4a_ar_2": "вдвое больше", "s4a_m_t": "Как наблюдают контакт", "s4a_m_none": "не показывать", "s4a_m_light": "световой микроскоп", "s4a_m_em": "ЭМ-томография", "s4a_m_lumen": "маркёры просветов", "s4a_m_split": "репортёр из двух половин", "s4a_note": "Контакт ЭПР — транс-Гольджи в клетке в культуре, стационарное состояние. «Вдвое больше» — учебное допущение: вдвое больше мостиков VAP–OSBP при прежней активности PI4KIIIβ и SAC1.", "s4a_lb_golgi": "транс-Гольджи", "s4a_lb_er": "ЭПР", "s4a_lb_gap": "зазор контакта (не в масштабе)", "s4a_lb_syn": "PI → PI4P, ATP → ADP", "s4a_lb_ph": "PH-домен связывает PI4P", "s4a_lb_ffat": "мотив FFAT связывает VAP", "s4a_lb_hyd": "PI4P → PI", "s4a_lb_chol": "холестерин", "s4a_lb_tr": "перенос: обмен 1 : 1", "s4a_lg_pi4p": "PI4P (одна шкала для обеих мембран, число точек условно)", "s4a_mt_light": "Обычный световой микроскоп", "s4a_mt_em": "ЭМ-томография", "s4a_mt_lumen": "Маркёры просветов", "s4a_mt_split": "Репортёр из двух половин", "s4a_mt_bar": "≈ 200 нм — предел разрешения", "s4a_mt_gap": "зазор 10–30 нм, связи", "s4a_mt_lg": "просвет Гольджи", "s4a_mt_le": "просвет ЭПР", "s4a_mt_sp": "половины собраны: сигнал", "s4a_mt_no_light": "сигналы перекрываются: контакт и слияние неразличимы", "s4a_mt_no_em": "расстояние измерено; перенос не измерен", "s4a_mt_no_lumen": "содержимое не смешивается: это не слияние", "s4a_mt_no_split": "сборка малообратима: репортёр удерживает мембраны", "s4a_r_pg": "PI4P в мембране транс-Гольджи", "s4a_r_pe": "PI4P в мембране ЭПР", "s4a_r_rel": "относительно контроля", "s4a_r_j": "Перенос холестерина ЭПР → Гольджи через OSBP, % от контроля", "s4a_r_ratio": "Отношение содержания холестерина Гольджи/ЭПР", "s4a_r_ratio_s": "в контроле 4,0", "s4a_r_atp": "Синтез PI4P PI-4-киназами (расход ATP)", "s4a_r_atp_s": "% от контроля; OSBP обменивает на холестерин {u} % синтезированного PI4P", "s4a_r_area": "Площадь контакта", "s4a_r_area_s": "относительно обычной", "s4a_r_mt": "Что установлено наблюдением", "s4a_r_mt_light": "сигналы перекрываются; расстояние не измерено", "s4a_r_mt_em": "зазор 10–30 нм, мембраны разделены", "s4a_r_mt_lumen": "содержимое не смешивается", "s4a_r_mt_split": "сигнал сближения; площадь выросла из-за репортёра", "s4a_r_note": "Учебная модель, условные величины. На одну перенесённую молекулу холестерина приходится одна молекула PI4P, синтезированная с затратой одной молекулы ATP. Без PI4KIIIβ остаётся 20 % синтеза — это синтез другими PI-4-киназами (учебное значение). Доля синтезированного PI4P, которую обменивает OSBP (80 % в контроле), — учебное значение для пула Гольджи; по оценке Mesmin 2017, OSBP расходует около половины всего клеточного PI4P.", "s4a_c_ctrl": "Контроль: PI4KIIIβ синтезирует PI4P на транс-Гольджи, OSBP переносит холестерин из ЭПР в Гольджи в обмен на PI4P, SAC1 гидролизует PI4P в ЭПР. Отношение содержания холестерина Гольджи/ЭПР — {r}.", "s4a_c_ctrl_z": "Холестерин переносится против градиента: энергию в цикл вносит PI-4-киназа, расходующая ATP, а SAC1 поддерживает перепад PI4P между Гольджи и ЭПР. Сам OSBP ATP не гидролизует.", "s4a_c_kin": "Ингибитор PI4KIIIβ: PI4P в Гольджи ×{pg}, перенос холестерина {j} % от контроля, отношение холестерина Гольджи/ЭПР {r}.", "s4a_c_kin_z": "Без PI4P холестерин не на что обменивать: перенос ограничен синтезом PI4P, то есть расходом ATP киназой.", "s4a_c_osw": "OSW-1 связывается с OSBP и тормозит его: перенос холестерина {j} % от контроля. Киназа продолжает синтез, и PI4P в Гольджи ×{pg}; отношение холестерина Гольджи/ЭПР {r}.", "s4a_c_osw_z": "Без обмена синтез PI4P не обеспечивает переноса холестерина. В опытах Mesmin 2017 (клетки RPE-1) OSW-1 повышал сигнал зонда PI4P в транс-Гольджи примерно в 5 раз, а холестерин накапливался в ЭПР и липидных каплях.", "s4a_c_sac": "Без SAC1 PI4P в ЭПР ×{pe}: перепад PI4P между Гольджи и ЭПР уменьшился, и в обмен всё чаще вовлекается PI4P из ЭПР. Перенос холестерина {j} % от контроля, отношение Гольджи/ЭПР {r}.", "s4a_c_sac_z": "Сток нужен так же, как источник: без гидролиза PI4P в ЭПР обмен приближается к равновесию и хуже переносит холестерин против градиента.", "s4a_c_vap": "Без VAP-A и VAP-B OSBP связывается с Гольджи через PH-домен, но не удерживается у ЭПР: перенос холестерина {j} % от контроля, PI4P в Гольджи ×{pg}, отношение холестерина Гольджи/ЭПР {r}.", "s4a_c_vap_z": "Пара VAP–OSBP одновременно удерживает контакт и переносит липид; без мостика перенос ослабевает, а PI4P остаётся в Гольджи.", "s4a_c_split": "Репортёр из двух половин дал сигнал сближения и сам удержал мембраны: площадь контакта ×{a}. Перенос холестерина {j} % от контроля.", "s4a_c_split_z": "Репортёр может изменить то, что измеряет; вывод о площади проверяют методом без искусственной привязки, например ЭМ.", "s4a_c_light": "Обычный световой микроскоп: сигналы маркёров ЭПР и транс-Гольджи перекрываются. При разрешении около 200 нм так выглядят и контакт, и слияние, и простое соседство мембран.", "s4a_c_light_z": "Колокализация показывает лишь сближение в пределах около 200 нм; расстояние между мембранами она не измеряет.", "s4a_c_em": "ЭМ-томография: мембраны ЭПР и транс-Гольджи разделены зазором 10–30 нм, между ними видны связи. Перенос холестерина этим методом не измерен.", "s4a_c_em_z": "Колокализация в световом микроскопе показывает лишь сближение в пределах около 200 нм; расстояние между мембранами измеряет ЭМ, а перенос — отдельное измерение.", "s4a_c_lumen": "Маркёры просветов: содержимое ЭПР и транс-Гольджи не смешивается, следовательно, мембраны не слились. Расстояние между ними этим методом не измерено.", "s4a_c_lumen_z": "Раздельность содержимого отличает контакт от слияния; расстояние и тетеринг-белки устанавливают другими методами.", "s4a_c_area": "Площадь контакта ×{a}: мостиков VAP–OSBP больше, но перенос холестерина {j} % от контроля, а PI4P в Гольджи ×{pg}.", "s4a_c_area_z": "Поток ограничен синтезом PI4P и его удалением, а не числом мостиков: сообщение о площади контакта ещё не сообщение о переносе.", "s4a_c_multi": "Несколько вмешательств одновременно: перенос холестерина {j} % от контроля, PI4P в Гольджи ×{pg}, в ЭПР ×{pe}, отношение холестерина Гольджи/ЭПР {r}.", "s4a_c_multi_z": "Каждое вмешательство отвечает на свой вопрос; при сочетании трудно разделить, что вызвано каждым из них.", "s4a_take": "Через контакт ЭПР — транс-Гольджи OSBP переносит холестерин против градиента, обменивая его на PI4P. Энергия входит в цикл на стадии синтеза PI4P: PI4KIIIβ расходует ATP, а SAC1 гидролизует доставленный в ЭПР PI4P и поддерживает перепад. Без синтеза PI4P, без обменника, без стока или без мостика VAP–OSBP перенос снижается. Площадь контакта и перенос через него — разные величины: при вдвое большей площади перенос растёт лишь на 9 %, потому что его ограничивает синтез PI4P. Контакт доказывают по признакам — расстоянию между мембранами, тетеринг-белкам, раздельности содержимого; колокализация в обычном световом микроскопе их не устанавливает, а репортёр из двух половин может стабилизировать контакт.", "gn_osbp": "OSBP (оксистерол-связывающий белок)", "g_osbp": "Белок контакта ЭПР — транс-Гольджи: PH-домен связывается с PI4P мембраны Гольджи, мотив FFAT — с VAP на мембране ЭПР, домен ORD переносит липиды. В одном цикле OSBP переносит молекулу холестерина из ЭПР в Гольджи и молекулу PI4P обратно; сам ATP не гидролизует (Mesmin 2013). По оценке Mesmin 2017, OSBP расходует около половины всего клеточного PI4P. Ингибиторы: OSW-1 связывается с OSBP и родственным ORP4 (Burgett 2011) и in vitro тормозит перенос и стерола, и PI4P; 25-гидроксихолестерин in vitro тормозил перенос стерола слабее и не тормозил перенос PI4P (Mesmin 2017), поэтому в модели используется OSW-1.", "gn_vap": "VAP-A и VAP-B", "g_vap": "Белки мембраны ЭПР, связывающие короткий мотив FFAT белков-партнёров — OSBP, ряда ORP-белков, переносчика церамида CERT. Пара VAP–FFAT одновременно удерживает контакт и привязывает к нему перенос липидов. В клетках HeLa без VAP-A и VAP-B PI4P накапливался на эндосомах, как и при снижении количества OSBP (Dong 2016).", "gn_pi4k3b": "PI4KIIIβ", "g_pi4k3b": "Фосфатидилинозитол-4-киназа аппарата Гольджи: переносит фосфат с ATP на положение 4 инозитольного кольца (PI → PI4P). В цикле OSBP это единственная стадия, на которой расходуется ATP. PI4P синтезируют и другие PI-4-киназы (PI4KIIα, PI4KIIIα), поэтому в модели ингибитор PI4KIIIβ оставляет 20 % синтеза (учебное значение). Ингибитор PIK93, использованный Mesmin 2017, действует и на некоторые PI3-киназы.", "p4a_1_q": "К клеткам добавили OSW-1 — вещество, которое связывается с OSBP. Как изменится содержание PI4P в мембране транс-Гольджи?", "p4a_1_o1": "Снизится: без OSBP PI4P не синтезируется", "p4a_1_o2": "Не изменится: OSBP не влияет на PI4P", "p4a_1_o3": "Вырастет в несколько раз: расход заторможен", "p4a_1_e": "PI4KIIIβ продолжает синтезировать PI4P, а главный путь его расхода — обмен на холестерин с последующим гидролизом фосфатазой SAC1 в ЭПР — заторможен. В модели содержание PI4P в Гольджи ×4,4, перенос холестерина 16 % от контроля.", "p4a_1_w1": "OSBP переносит PI4P, но не синтезирует его: синтез выполняет PI-4-киназа, которую OSW-1 не тормозит.", "p4a_1_w2": "PI4P попадает к фосфатазе SAC1 в ЭПР благодаря переносу OSBP; без переноса PI4P остаётся в Гольджи.", "p4a_2_q": "Клетки обработали ингибитором PI4KIIIβ — PI-4-киназы аппарата Гольджи. Как изменится перенос холестерина из ЭПР в Гольджи через OSBP?", "p4a_2_o1": "Снизится: PI4P для обмена станет мало", "p4a_2_o2": "Вырастет: у холестерина меньше конкурентов", "p4a_2_o3": "Не изменится: OSBP не зависит от киназы", "p4a_2_e": "OSBP обменивает холестерин на PI4P один к одному, поэтому перенос ограничен синтезом PI4P. При ингибиторе синтез в модели составляет 20 % от контроля (остаток — другие PI-4-киназы), перенос холестерина 20 %, отношение холестерина Гольджи/ЭПР 2,9 вместо 4,0.", "p4a_2_w2": "Холестерин и PI4P действительно занимают один карман домена ORD поочерёдно, но без PI4P у OSBP нет движущей силы для переноса холестерина против градиента.", "p4a_2_w3": "Сам OSBP ATP не гидролизует; энергию в цикл вносит киназа, и без её работы обмен затухает.", "p4a_3_q": "В клетках нет фосфатазы SAC1 мембраны ЭПР. Как изменится перенос холестерина из ЭПР в Гольджи через OSBP?", "p4a_3_o1": "Вырастет: PI4P станет больше", "p4a_3_o2": "Снизится: перепад PI4P уменьшится", "p4a_3_o3": "Не изменится: SAC1 не участвует в обмене", "p4a_3_e": "SAC1 гидролизует PI4P, доставленный в ЭПР, и поддерживает его низкое содержание. Без SAC1 PI4P в ЭПР ×16, перепад между Гольджи и ЭПР уменьшается, и обмен приближается к равновесию: перенос холестерина 49 % от контроля. Стоком цикла служит фосфатаза, а не сам OSBP.", "p4a_3_w1": "PI4P становится больше на принимающей стороне — в ЭПР. Движущую силу задаёт не количество PI4P, а его перепад между мембранами.", "p4a_3_w3": "SAC1 не переносит липиды, но удаляет PI4P после переноса; без этого обмен становится обратимым.", "p4a_4_q": "В клетках нет VAP-A и VAP-B — белков ЭПР, связывающих мотив FFAT белка OSBP. Как изменится отношение содержания холестерина Гольджи/ЭПР?", "p4a_4_o1": "Вырастет: OSBP останется на Гольджи", "p4a_4_o2": "Не изменится: OSBP связан с Гольджи и так", "p4a_4_o3": "Снизится: OSBP не свяжет две мембраны", "p4a_4_e": "OSBP одновременно удерживает контакт и переносит липид: PH-домен связывается с PI4P Гольджи, мотив FFAT — с VAP на ЭПР. Без VAP мостик не образуется: перенос холестерина 35 % от контроля, отношение Гольджи/ЭПР 3,1 вместо 4,0, PI4P в Гольджи ×3,6.", "p4a_4_w1": "Связь с Гольджи сохраняется, но без контакта с ЭПР OSBP не получает холестерин для переноса.", "p4a_4_w2": "Связывания с одной мембраной недостаточно: для переноса липида между мембранами белок должен быть связан с обеими.", "p4a_5_q": "Сигналы маркёров ЭПР и транс-Гольджи в обычном световом микроскопе перекрываются. Что это говорит о расстоянии между мембранами? Проверка — ЭМ-томография того же участка.", "p4a_5_o1": "Оно меньше ≈ 200 нм, точнее не определить", "p4a_5_o2": "Его нет: мембраны слиты, сигналы совпали", "p4a_5_o3": "Оно около 200 нм, как зона перекрывания", "p4a_5_e": "Разрешение светового микроскопа около 200 нм — больше зазора контакта, поэтому перекрывание одинаково выглядит при контакте, слиянии и соседстве мембран. ЭМ-томография показала зазор 10–30 нм: мембраны сближены, но не слиты; перенос она не измеряет.", "p4a_5_w2": "Перекрывание сигналов не говорит о слиянии: при разрешении около 200 нм так же выглядят мембраны на расстоянии 20 нм.", "p4a_5_w3": "200 нм — предел разрешения микроскопа, а не расстояние между мембранами: объекты, расположенные ближе, просто не различаются.", "p4a_6_q": "Для подсчёта контактов в клетках на высоком уровне экспрессировали репортёр из двух половин флуоресцентного белка — по половине на мембранах ЭПР и Гольджи. Как изменится площадь контакта?", "p4a_6_o1": "Не изменится: репортёр только измеряет", "p4a_6_o2": "Вырастет: репортёр удерживает мембраны", "p4a_6_o3": "Уменьшится: репортёр раздвигает мембраны", "p4a_6_e": "Половины собираются в целый белок при сближении мембран, а сборка малообратима: репортёр накапливает сигнал от всех сближений и сам работает как искусственная привязка. В модели площадь ×1,4 (учебное значение), перенос холестерина 105 % от контроля. Вывод о площади проверяют методом без искусственной привязки, например ЭМ (Filadi 2026).", "p4a_6_w1": "Измерительный белок входит в измеряемую систему: собранная пара половин связывает мембраны так же, как тетеринг-белок.", "p4a_6_w3": "Репортёр рассчитан на зазор контакта и, собираясь, сближает мембраны, а не раздвигает их.", "p4a_7_q": "Итоговая задача. Площадь контакта ЭПР — транс-Гольджи увеличили вдвое: мостиков VAP–OSBP стало вдвое больше, активность PI4KIIIβ и SAC1 прежняя. Как изменится перенос холестерина через OSBP?", "p4a_7_o1": "Вырастет вдвое, как площадь", "p4a_7_o2": "Вырастет ненамного: синтез PI4P прежний", "p4a_7_o3": "Снизится: тесный контакт мешает переносу", "p4a_7_e": "Перенос ограничен скоростью синтеза PI4P и его гидролиза фосфатазой SAC1, а не числом мостиков: в модели перенос 109 % от контроля, а содержание PI4P в Гольджи снизилось до ×0,66 — OSBP быстрее извлекает его из мембраны Гольджи. Сообщение о росте площади контакта не означает роста переноса, пока перенос не измерен отдельно (Calì 2025).", "p4a_7_w1": "Пропорциональный рост был бы, если бы перенос был ограничен числом мостиков. Здесь его ограничивает синтез PI4P: на каждую молекулу холестерина нужна молекула PI4P.", "p4a_7_w3": "Мысль о вреде слишком тесного контакта — гипотеза о ширине зазора; в этом опыте зазор не менялся, а мостиков стало больше.", "teacher_t": "Для преподавателя: проведение занятия, упрощения моделей и источники", "src_t_st": "Источники", "teacher_1": "Порядок занятия: около 15 мин на вопрос; на каждом уровне сначала сценарий «Сценарий: предскажите и проверьте», затем свободное движение регуляторов с объяснением, как меняется состояние клетки. Вопрос 1 — различия между компартментами поддерживаются работой насосов; Δψ — состояние, а не поток. Вопрос 2 — длина диффузии λ = √(D/k), порог, домены cAMP при одинаковом среднем уровне. Вопрос 3 — метки и сенсоры, опыт Hammond 2012, коинцидентное узнавание (по совпадению двух признаков) на примере EEA1. Вопрос 4 — Ca²⁺ на контакте ЭПР — митохондрия и роль MICU1, цикл OSBP; рост площади контакта не означает роста переноса. Сквозные требования к ответу студента: назвать место, объём и форму вещества (свободная или общая концентрация); отличать маркер от причины; помнить, что граница удерживает различие, а создаёт его работа. Подробные объяснения к каждому вопросу — на отдельной странице (кнопки «Объяснения» и «Объяснения к вопросу»).", "teacher_2": "Упрощения моделей. 1b — релаксация к уровню без насоса: pH лизосомы — экспонента с τ 10 мин к 6,5 (плато — допущение: выше 6,5 сенсор в работе Steinberg 2010 значений не различает); Ca²⁺ ЭПР — начальная фаза около 90 с с потерей 6 %, затем τ 162 с (Pick 2023); Δψ — τ 20 с, учебное значение. Студенты сравнивают время полуспада каждого различия в его собственных единицах. 1a — пять стационаров учебной модели протонного цикла, соотношения — по Brand и Nicholls 2011; при FCCP ATP-синтаза гидролизует гликолитический ATP. 2b и 2a — одномерные стационарные модели с постоянными D и k; эффективный D cAMP и микрометровые домены — учебные (по данным Bock 2020 и 2024 домены cAMP могут быть нанометровыми). 3b — линейные стационары синтеза и удаления меток; занятость сенсора — гипербола. 3a — качественные результаты Hammond 2012 без чисел; для EEA1 — независимые сайты, f = fA·fB, — упрощение: в клетках для связывания EEA1 с эндосомой решающим оказался PI3P (Lawe 2002). 4b — квазистационар на время стимула, захват через MCU — уравнение Хилла с наклонами по Csordás 2013. 4a — стационар обмена 1 : 1; доля PI4P Гольджи, обмениваемая OSBP (80 %), — учебное значение; по Mesmin 2017 OSBP расходует около половины всего клеточного PI4P. Все величины, кроме прямо отнесённых к работам, условны.", "teacher_3": "Поправки к распространённым формулировкам. Отношение GSH:GSSG в цитозоле — порядка 10⁴–10⁵ по данным сенсоров, а не 100:1 (оценка по лизатам). MCU — канал, а не насос: работу совершает дыхательная цепь. Нормальный Δψ не доказывает работы дыхательной цепи. «Код» фосфоинозитидов — разметка, которую белки считывают в сочетании с другими признаками мембраны, а не таблица адресов; LC3 не связывает PI3P. В цикле OSBP энергия входит при синтезе PI4P киназой, а SAC1 служит стоком. Колокализация в обычном световом микроскопе не доказывает контакта, а рост площади контакта не означает роста переноса. Тезис «одинаковый средний cAMP — разный ответ» показан на перфузируемом сердце крысы (Hayes 1979); у Buxton и Brunton 1983 на кардиомиоцитах кролика различались фракции cAMP. Свободный Ca²⁺ в зазоре контакта ЭПР — митохондрия по сенсору — в среднем около 9 мкМ, и это нижняя оценка; авторы допускают подъём до нескольких десятков микромолей (Csordás 2010).", "src_01": "Yoshimori T., Yamamoto A., Moriyama Y., Futai M., Tashiro Y. Bafilomycin A1, a specific inhibitor of vacuolar-type H⁺-ATPase, inhibits acidification and protein degradation in lysosomes of cultured cells. Journal of Biological Chemistry, 1991, т. 266, с. 17707–17712. doi:10.1016/S0021-9258(19)47429-2", "src_02": "Steinberg B. E., Huynh K. K., Brodovitch A., Jabs S., Stauber T., Jentsch T. J., Grinstein S. A cation counterflux supports lysosomal acidification. Journal of Cell Biology, 2010, т. 189, с. 1171–1186. doi:10.1083/jcb.200911083", "src_03": "Pick T., Gama function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 's1-20931';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }
function poeUnits(K){
  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);
  }

}
function poeIdx(i, K = cur){
  if (!POE_RND) return i;
  const n = SCENES[K].poe.length, keep = poeKeep(K); if (i >= n - keep) return i;
  const units = poeUnits(K), ord = poeShuffle(units.length, K + '/steps/' + POE_SEED);
  return [].concat(...ord.map(u => units[u]))[i];
}

const fmtInt = x => String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
/* интегрирование ОДУ методом Рунге–Кутты 4-го порядка: f(s, t) → производные; s — объект с числовыми полями */
function rk4(f, s0, t0, t1, dt, every, out){
  let s = Object.assign({}, s0), t = t0; const res = out || []; let k = 0;
  const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
  res.push(Object.assign({ t }, s));
  while (t < t1 - 1e-9){
    const h = Math.min(dt, t1 - t);
    const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
    const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
    s = n; t += h; k++;
    if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
  }
  return res;
}
/* значение траектории в момент tt (линейная интерполяция) */
function atT(tr, tt){
  if (tt <= tr[0].t) return tr[0];
  for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
    const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
    for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
    return r;
  }
  return tr[tr.length - 1];
}

/* Модель вопроса 1 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),

const M1 = (() => {
  const RT = 2.577;            // кДж/моль при 37 °C
  const F = 96.485;            // кДж/(моль·В)
  const C = {
    lys:  { x0: 4.7, xOff: 6.5, xEq: 7.2, tau: 600 },     // pH
    er:   { x0: 370, xOff: 0.1, xEq: 0.1, tau: 162, lag: 90, lagLoss: 0.06 },   // мкМ свободного Ca²⁺; задержка 90 с, потеря 6 %
    mito: { x0: -150, xOff: -5, xEq: 0, tau: 20 },        // мВ
  };
  const TIMES = [0, 5, 15, 30, 60, 120, 300, 600, 1200, 1800, 3600];   // с после остановки насоса
  const val = (c, on, t) => {
    const p = C[c]; if (on) return p.x0;
    if (!p.lag) return p.xOff + (p.x0 - p.xOff) * Math.exp(-t / p.tau);
    /* двухфазное опустошение ЭПР (Pick 2023): медленная начальная фаза, затем экспонента с τ */
    const x1 = p.x0 - (p.x0 - p.xOff) * p.lagLoss;
    return t < p.lag ? p.x0 - (p.x0 - x1) * t / p.lag : p.xOff + (x1 - p.xOff) * Math.exp(-(t - p.lag) / p.tau);
  };
  /* доля исходного различия с цитозолем, которая ещё сохранилась (знаменатель — различие при работающем насосе) */
  const remain = (c, x) => { const p = C[c]; return (x - p.xEq) / (p.x0 - p.xEq); };
  /* время, за которое различие (в собственных единицах: ед. pH, мкМ, мВ) уменьшается вдвое, с — для сравнения характерных времён */
  const half = c => { let a = 0, b = 7200; for (let i = 0; i < 60; i++){ const m = (a + b) / 2; if (remain(c, val(c, false, m)) > 0.5) a = m; else b = m; } return (a + b) / 2; };
  /* подпись времени полуспада: «15 с», «3,2 мин», «12 мин» */
  const halfTxt = (c, uS = 'с', uMin = 'мин') => { const h = half(c); return h < 60 ? Math.round(h) + '\u00a0' + uS : (h < 600 ? (h / 60).toFixed(1).replace('.', ',') : String(Math.round(h / 60))) + '\u00a0' + uMin; };

/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают. Все величины — учебные, кроме названных коэффициентов диффузии
   (отметки ползунка D: Allbritton 1992, Swaminathan 1997, Lippincott-Schwartz 2001; см. notes/claims.md).

   2б. Одномерная стационарная модель «источник — диффузия — сток» (глава 1, врезка 1.2):
     вещество образуется у плоскости x = 0, концентрация там поддерживается постоянной (c₀ = 1, т. е. 100 % от c₀),
     диффундирует с коэффициентом D в сторону x > 0 и удаляется стоком первого порядка с константой k.
     Стационарный профиль: c(x) = фон + (c₀ − фон)·e^(−x/λ), λ = √(D/k); фон = 5 % от c₀.
     Средняя по клетке длиной L = 20 мкм (как в лизате): фон + (c₀ − фон)·(λ/L)·(1 − e^(−L/λ)).
     Эффектор: ответ R = cⁿ/(K½ⁿ + cⁿ) — доля активного эффектора (0…1), n — коэффициент Хилла.
     Ширина домена — расстояние, на котором R > 0,5, то есть c > K½: x½ = λ·ln((c₀ − фон)/(K½ − фон)).
     Переходная зона — участок, где R падает от 0,9 до 0,1 (c от K½·9^(1/n) до K½·9^(−1/n)).

     домен А у x = 0 (рецептор гормона А, AC, AKAP с PKA рядом с мишенью А, мишень А на x = 0,5 мкм),
     домен Б у x = L (рецептор гормона Б, AC). Гормон включает синтез cAMP в своём домене (поток J через стенку);
     базальный синтез cAMP равномерен по клетке (j₀); PDE распределены по цитозолю — сток первого порядка k.

     то есть экспонент, от двух источников):

     k = k₀ + kPDE (k₀ — путь, не чувствительный к IBMX: выход cAMP из клетки и PDE, малочувствительные к IBMX);

/* Модель вопроса 4 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   4b. Ca²⁺ на контакте ЭПР — митохондрия (учебная квазистационарная модель на время стимула).
       Свободный Ca²⁺ в остальном цитозоле: покой 0,1 мкМ; открытие IP₃R — 0,8 мкМ («около 1 мкМ»);
       глобальный подъём за счёт входа Ca²⁺ извне — умеренный 0,4 мкМ (Csordás 2013: 300–400 нМ при депо-зависимом входе)
       или сильный 3 мкМ. У поверхности митохондрии в зоне контакта при открытии IP₃R — 15 мкМ (Csordás 2010: в среднем
       около 9 мкМ, в части клеток до 25 мкМ; Giacomello 2010: в 5–10 раз выше, чем в остальном цитозоле); при сниженном
       числе тетеринг-белков зазор шире и у поверхности митохондрии лишь 2 мкМ (учебное значение). При глобальном подъёме
       микродомена нет: Ca²⁺ в зазоре равен цитозольному (Giacomello 2010). Доля поверхности митохондрии в контакте:
       12 % (в пределах 5–20 %, Rizzuto 1998) или 4 % при сниженном числе тетеринг-белков.
       Скорость захвата через MCU (доля от максимальной скорости митохондрии с MICU1 при насыщающем Ca²⁺) — уравнение Хилла:
       с MICU1 K = 3,5 мкМ, n = 3 (крутое открытие выше ≈ 1 мкМ; наклон 2,9–3,4 у Csordás 2013); без MICU1 K = 3,28 мкМ,
       n = 2,1, максимум 0,6 (захват заметен уже ниже 0,5 мкМ, кооперативность ниже: 1,6–2,1 у Csordás 2013;
       кривые пересекаются около 2 мкМ). Захват = f·J(Ca в зазоре) + (1 − f)·J(Ca в цитозоле).
       Свободный Ca²⁺ в матриксе (квазистационар захвата и выхода): 0,1 мкМ + 20 мкМ × скорость захвата (учебное допущение).
       Доля активной формы Ca²⁺-зависимых дегидрогеназ: Ca/(Ca + 1 мкМ) (учебное значение K).
   4a. Цикл OSBP на контакте ЭПР — транс-Гольджи (стационар, условные единицы; контроль: синтез PI4P = 1, PI4P Гольджи = 1).
       Синтез PI4P PI-4-киназами s (1 ATP на молекулу; ингибитор PI4KIIIβ оставляет 20 % — синтез другими PI-4-киназами).
       Обмен OSBP: J = V·o·t·(PI4P_Г·Хол_ЭПР − PI4P_ЭПР·Хол_Г) — молекула холестерина ЭПР → Гольджи в обмен на молекулу PI4P
       Гольджи → ЭПР; o — активность OSBP (OSW-1: 0,03), t — мостики VAP–OSBP (без VAP-A/B: 0,08) × площадь контакта.
       Другие пути расхода PI4P в Гольджи: 0,2·PI4P_Г (в контроле OSBP обменивает 80 % синтезированного PI4P Гольджи — учебное
       значение; Mesmin 2017 оценили долю для всего клеточного пула PI4P, а не для пула Гольджи: около половины).
       PI4P в ЭПР гидролизует SAC1: h·PI4P_ЭПР (без SAC1 — 3 % активности). Холестерин ЭПР — резервуар (= 1);
       холестерин Гольджи = 1 + (J + J0)/kb (J0 — доставка другими путями). Контроль: перенос 0,8; отношение Гольджи/ЭПР = 4. */
const M4 = (() => {
  const B = { cRest: 0.1, cIp3: 0.8, cMod: 0.4, cHigh: 3, gapOn: 15, gapLow: 2, fOn: 0.12, fLow: 0.04,
              Kc: 3.5, nc: 3, Kk: 3.28, nk: 2.1, Jk: 0.6, m0: 0.1, G: 20, Kdh: 1 };
  const hill = (c, K, n) => Math.pow(c, n) / (Math.pow(K, n) + Math.pow(c, n));
  /* скорость захвата через MCU при свободном Ca²⁺ c (мкМ) у внешней стороны внутренней мембраны */
  const Jmcu = (c, micu) => micu ? hill(c, B.Kc, B.nc) : B.Jk * hill(c, B.Kk, B.nk);
  const BULK = { rest: B.cRest, ip3: B.cIp3, mod: B.cMod, high: B.cHigh };
  const mRef = B.m0 + B.G * Jmcu(B.cRest, true);
  /* o = { contact: 'on' | 'low', stim: 'rest' | 'ip3' | 'mod' | 'high', micu: true | false } */
  function ca(o){
    const bulk = BULK[o.stim], f = o.contact === 'on' ? B.fOn : B.fLow;
    const gap = o.stim === 'ip3' ? (o.contact === 'on' ? B.gapOn : B.gapLow) : bulk;
    const jc = f * Jmcu(gap, o.micu), jb = (1 - f) * Jmcu(bulk, o.micu), U = jc + jb;
    const m = B.m0 + B.G * U;
    return { bulk, gap, f, U, jc, jb, share: jc / U, m, mRel: m / mRef, dh: m / (m + B.Kdh) };
  }
  /* --- 4a --- */
  const O = { s: 1, ko: 0.2, h: 16, V: 1, kb: 0.8 / 1.4, J0: 1.6 * 0.8 / 1.4, Ce: 1, kinRes: 0.2, oswRes: 0.03, vapRes: 0.08, sacRes: 0.03 };
  /* c = { pi4k: true, osbp: true, sac1: true, vap: true, area: 1, syn: 1 }; syn — множитель синтеза PI4P (только для схемы объяснений «площадь и перенос») */
  function osbp(c){
    const s = O.s * (c.pi4k ? 1 : O.kinRes) * (c.syn || 1), o = c.osbp ? 1 : O.oswRes, tt = (c.vap ? 1 : O.vapRes) * (c.area || 1), h = O.h * (c.sac1 ? 1 : O.sacRes);
    const st = J => { const Pg = (s - J) / O.ko, Pe = J / h, Cg = O.Ce + (J + O.J0) / O.kb; return { Pg, Pe, Cg, f: O.V * o * tt * (Pg * O.Ce - Pe * Cg) - J }; };
    let lo = 0, hi = s;
    for (let i = 0; i < 80; i++){ const m = (lo + hi) / 2; if (st(m).f > 0) lo = m; else hi = m; }
    const J = (lo + hi) / 2, r = st(J);
    return { J, Pg: r.Pg, Pe: r.Pe, Cg: r.Cg, ratio: r.Cg / O.Ce, syn: s, use: J / s };
  }
  const CTRL = osbp({ pi4k: true, osbp: true, sac1: true, vap: true, area: 1 });
  return { B, O, Jmcu, ca, osbp, CTRL, mRef };
})();

    setCap(K, capKey(c), { j: String(P(j)), pg: fx4(pg), pe: fx4(pe), r: fmt(r.ratio, 1), a: fmt(c.area, 1), u: String(P(r.use)) });
  }
  wire(['s4a_kin', 's4a_osw', 's4a_sacT', 's4a_vapT', 's4a_ar', 's4a_md'], update);
  const st = (o) => { const x = Object.assign({ kin: false, osw: false, sac: false, vap: false, ar: '1', md: 'none' }, o);
    $('s4a_kin').checked = x.kin; $('s4a_osw').checked = x.osw; $('s4a_sacT').checked = x.sac; $('s4a_vapT').checked = x.vap; segSet('s4a_ar', x.ar); segSet('s4a_md', x.md); };
  SCENES[K] = { update, poe: [
    { n: 3, ok: 2, pre(){ st({}); }, apply(){ st({ osw: true }); } },
    { n: 3, ok: 0, pre(){ st({}); }, apply(){ st({ kin: true }); } },
    { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ sac: true }); } },
    { n: 3, ok: 2, pre(){ st({}); }, apply(){ st({ vap: true }); } },
    { n: 3, ok: 0, pre(){ st({}); }, apply(){ st({ md: 'em' }); } },
    { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ md: 'split' }); } },
    { n: 3, ok: 1, last: true, pre(){ st({}); }, apply(){ st({ ar: '2' }); } },
  ] };
})();

/* =====================================================================
   Заглушка для вкладок, которые ещё не собраны (промежуточная сборка):
   сцена показывает только надпись «Вопрос в работе», без учебного содержания.
   В итоговой версии все восемь сцен определены, и заглушка ничего не делает.
   ===================================================================== */
['1b', '1a', '2b', '2a', '3b', '3a', '4b', '4a'].forEach(K => {
  if (SCENES[K]) return;
  layout(K);
  $('svg' + K).innerHTML = `<rect class="cyto" width="600" height="420"/><text class="lbl" x="300" y="210" font-size="20" fill="var(--muted)">${t('stub')}</text>`;
  $('ctrl' + K).innerHTML = `<p class="small">${t('stub')}</p>`;
  $('take' + K).textContent = t('stub');
  SCENES[K] = { stub: true, update(){ $('cap' + K).textContent = t('stub'); $('why' + K).textContent = ''; }, poe: [{ n: 3, ok: 0, pre(){}, apply(){} }] };
});

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Все семинары»: на сайте ведёт на index.html рядом, в сохранённом файле — на адрес сайта */
(function(){ const a = $('homeLink'); if (a && location.hostname !== 'fresll.github.io') a.href = 'https://fresll.github.io/molbio/'; })();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show();

</script>
