/* Схемы шагов семинара 7. Каждая схема — функция W.<kind>; kind указывается в lesson.widget.kind.
   Все подписи берутся из lesson.widget.s (в коде — S); в коде нет учебных формулировок.
   W.net — общая схема состояний: узлы, связи разных видов, состояния по сочетаниям переключателей
   (каждое сочетание задано в данных явно). На экране уже 760 px схема рисуется по отдельным координатам
   узкого макета (перестановка, а не уменьшение шрифта).
   Расчётные модели — чистые функции M7 (проверяются в node). */

const M7 = (() => {
  /* Шаг 9. Заряд по заданным концентрациям; при нулевой сумме заряд не определяется */
  function charge(atp, adp, amp) {
    const sum = atp + adp + amp;
    if (!(atp >= 0 && adp >= 0 && amp >= 0)) return {ok: false, sum, neg: true};
    if (sum <= 0) return {ok: false, sum};
    return {ok: true, sum, e: (atp + 0.5 * adp) / sum, fa: atp / sum, fd: adp / sum, fm: amp / sum};
  }
  /* Шаг 9. Условное равновесие аденилаткиназы: пул 1, доля ATP a (0,50–0,98), K = a·m/d² = 1 */
  function equilibrium(a) {
    const d = (Math.sqrt(4 * a - 3 * a * a) - a) / 2, m = 1 - a - d;
    return {a, d, m, sum: a + d + m, e: a + 0.5 * d, k: d > 0 ? a * m / (d * d) : NaN};
  }
  /* Шаг 28. Две культуры из одного исходного состояния. Пул LC3-II L (усл. ед.), образование f (усл. ед./ч),
     удаление k·L (1/ч). Без ингибитора: стационар L0 = f/k. С ингибитором с момента 0: удаление k·(1 − b),
     образование f·(1 + a) (a — возможное побочное действие ингибитора на образование). pre — выход уже был
     полностью заблокирован в обеих культурах до эксперимента (k = 0 в обеих); тогда разность возникает только при побочном действии на образование. */

      const btxt = narrow ? (bt.tn || '') : bt.t;
      if (btxt) {
        const ta = at === 'l' ? 'end' : at === 'r' ? 'start' : (bt.al || 'end');
        const lx = at === 'l' ? bx - 15 : at === 'r' ? bx + 15 : (ta === 'end' ? bx - 15 : bx + 15);
        const ly = at === 'b' ? by + 17 : at === 't' ? by - 5 : by + 4;
        const tt = String(btxt).split('\n');
        tt.forEach((ln, i) => { bSvg += `<text x="${lx}" y="${ly + i * 14}" font-size="12.5" text-anchor="${ta}" class="barlabel" style="fill:${C7.violet}" font-weight="600">${esc(ln)}</text>`; });

  });

}
function ctrlHtml(S, s) {

}
function stateKey(S, s) { return (S.ctrls || []).map(c => String(c.type === 'check' ? (s[c.id] ? 1 : 0) : (s[c.id] || 0))).join('-') || '0'; }
function resultHtml(S, st) {

W.net = ({S, s, set, out, onGroup, onCheck}) => {

    ['m', 'bars', 'note', 'tab'].forEach(f => { st[f] = st0[f] != null ? st0[f] : base[f]; });

/* условные пиктограммы методов (не данные эксперимента): точки микроскопии, полосы иммуноблота, кривая метки */
W._pic = (p, S) => {
  const w = 640, h = 150;
  let d = '';
  if (p.kind === 'micro') {
    [[0, '#7aa6cf', p.a], [1, '#d98f8f', p.b], [2, null, p.c]].forEach(([i, col, lab]) => {
      const x0 = 30 + i * 205; d += rect(x0, 18, 170, 100, '#1d2b38', 10);
      const pts = [[40, 30], [90, 55], [130, 35], [60, 75], [120, 80], [150, 60]];
      pts.forEach(([x, y], j) => {
        if (i < 2) d += circ(x0 + x - 20, 18 + y, 6, col);
        else { d += circ(x0 + x - 20, 18 + y, 6, j % 2 ? '#e2c26a' : '#7aa6cf'); }
      });
      d += tx(x0 + 85, 138, lab, 13);
    });
  } else if (p.kind === 'blot') {
    p.rows.forEach((r, i) => {
      const y = 22 + i * 46; d += tx(150, y + 18, r[0], 13, 'end');
      r[1].forEach((v, j) => { const x = 170 + j * 110; d += rect(x, y + 4, 80, 18, '#e9eef2', 4) + rect(x + 40 - 36 * v, y + 6, 72 * v, 14, '#2a3a48', 5, `opacity="${0.25 + 0.75 * v}"`); });
    });
    p.lanes.forEach((ln, j) => { d += tx(210 + j * 110, 142, ln, 12.5); });
  }
  return svg(d + (p.cap ? tx(w - 10, 12, p.cap, 11.5, 'end') : ''), S.title, h, w);
};

/* ---------- шаг 9: заряд и условное равновесие ---------- */
W.charge = ({S, s, set, out, onGroup, onRange}) => {
  s.mode ??= 0; s.atp ??= 8; s.adp ??= 1; s.amp ??= 1; s.a ??= 0.9;
  NET_REDRAW = null;
  const ctr = () => s.mode === 0
    ? `<div class="controls">${slider('ch-atp', S.atp, 0, 10, s.atp, 0.5)}${slider('ch-adp', S.adp, 0, 10, s.adp, 0.5)}${slider('ch-amp', S.amp, 0, 10, s.amp, 0.5)}</div>`
    : `<div class="controls">${slider('ch-a', S.a_label, 0.5, 0.98, s.a, 0.01)}</div>`;
  const setup = () => {
    set(S.title, S.status, buttonGroup('ch-mode', S.modes, s.mode, S.modes_label) + ctr());
    onGroup('ch-mode', v => { s.mode = v; setup(); });
    if (s.mode === 0) { onRange('ch-atp', v => { s.atp = v; draw(); }); onRange('ch-adp', v => { s.adp = v; draw(); }); onRange('ch-amp', v => { s.amp = v; draw(); }); }
    else onRange('ch-a', v => { s.a = v; draw(); });
    draw();
  };
  const stack = (fr, labels) => {
    const W0 = small() ? 340 : 640, x0 = 20, bw = W0 - 40; let x = x0, d = '';
    const cols = ['#145c96', '#7fa8cc', '#e0b04f'];
    fr.forEach((f, i) => { const w = bw * f; d += rect(x, 30, Math.max(w, 0), 46, cols[i], 0); x += w; });
    d += rect(x0, 30, bw, 46, 'none', 4, 'stroke="#6d8ba5" stroke-width="1.5"');
    labels.forEach((t, i) => { d += `<rect x="${x0 + i * (bw / 3)}" y="92" width="14" height="14" fill="${cols[i]}"/>` + tx(x0 + i * (bw / 3) + 20, 104, t, small() ? 12.5 : 14, 'start'); });
    return svg(d, S.title, 120, W0);
  };
  const draw = () => {
    if (s.mode === 0) {

      if (!r.ok) { out(stack([0, 0, 0], [S.l_atp, S.l_adp, S.l_amp]), result(`<p>${esc(S.zero)}</p><p class="quiet">${esc(S.note0)}</p>`)); return; }
      out(stack([r.fa, r.fd, r.fm], [`${S.l_atp} ${num(r.fa * 100, 1)}${nb}%`, `${S.l_adp} ${num(r.fd * 100, 1)}${nb}%`, `${S.l_amp} ${num(r.fm * 100, 1)}${nb}%`]),
        `<div class="metrics">${metric(S.m_sum, num(r.sum, 1))}${metric(S.m_e, num(r.e, 3))}${metric(S.m_formula, `(${num(s.atp, 1)} + 0,5·${num(s.adp, 1)}) / ${num(r.sum, 1)}`)}</div>` +

        `<div class="metrics">${metric(S.m_sum, num(r.sum, 3))}${metric(S.m_e, num(r.e, 3))}${metric(S.m_k, num(r.k, 3))}</div>` +
