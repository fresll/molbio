<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-2.html">← Вернуться к семинару</a> · <a href="section-1.html#seminars">← Раздел I: семинары</a></p><h1>Транспорт, сети органелл, конденсаты и полярность</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-tracks"><div class="eyebrow">Транспорт по цитоскелету · шаг 1 из 30</div><h2>Как трек задаёт направление движения груза в клетке</h2><p class="lead">Направленный перенос требует линии с направлением — полярного филамента — и мотора, который движется по ней в определённую сторону. Куда в клетке попадёт груз, зависит не только от мотора, но и от того, как в данном участке ориентированы треки.</p><ol class="mech"><li>Два конца <a href="#ns-g-S2-T01">микротрубочки</a> различаются по строению: <a href="#ns-g-S2-T02">плюс-конец</a> обычно обращён к периферии, минус-конец закреплён у <a href="#ns-g-S2-T16">центросомы</a>.</li><li>Мотор движется к определённому концу трека; это свойство мотора, а не клетки.</li><li>В аксоне почти все плюс-концы обращены к окончанию, в дендрите ориентация смешанная, поэтому один и тот же мотор переносит груз в разные области.</li></ol><p>Диффузия перемещает молекулы во всех направлениях одинаково и на расстояниях в десятки микрометров слишком медленна для крупного груза. Адресное накопление возможно и без мотора, если в нужном месте груз удерживается связывающим белком (<a href="#ns-g-S2-T29">диффузия и захват</a>), но перенос груза на большие расстояния требует линии, обладающей направлением, и белка, который движется по ней в одну сторону. Направление задаёт цитоскелет.</p><p>Микротрубочка и <a href="#ns-g-S2-T03">актиновый филамент</a> структурно полярны: их концы различаются по строению и по скорости сборки. В большинстве животных клеток микротрубочки образуют радиальную систему — минус-концы закреплены у центросомы вблизи ядра, плюс-концы обращены к периферии. Тогда движение к плюс-концу означает движение к периферии, а к минус-концу — к центру клетки.</p><p>В специализированных клетках геометрия иная. В аксоне нейронов гиппокампа крысы микротрубочки ориентированы однородно — плюс-концом к окончанию; в средней части дендрита примерно половина микротрубочек обращена плюс-концом к телу клетки (Baas 1988). По движению маркера растущих плюс-концов EB3 в проксимальной части дендритов около 65 % плюс-концов направлены наружу (Stepanova 2003). В эпителии и в мышечном волокне значительная часть микротрубочек организуется вне центросомы (Akhmanova 2022).</p><p>Отсюда главное правило раздела: направление относительно концов филамента задаёт мотор, а направление относительно частей клетки — организация треков. На схеме доли микротрубочек, обращённых плюс-концом наружу, — 100 % для клетки с центросомой, 98 % для аксона и 60 % для дендрита; это учебные значения, согласованные с названными работами.</p><div class="note trap"><strong>Типичная ошибка</strong> Кинезин всегда переносит груз к периферии клетки, а динеин — к ядру.<p class="trap-fix">Кинезин-1 движется к плюс-концу, динеин — к минус-концу. Движение к плюс-концу означает движение к периферии только там, где плюс-концы обращены к периферии; на участке со смешанной ориентацией треков мотор, идущий к плюс-концу, переносит груз в обе стороны.</p></div><div class="static-quiz"><h3>Мысленный эксперимент: в средней части дендрита около половины микротрубочек обращены плюс-концом к телу нейрона. Как будут распределены по направлению пробеги груза, принудительно соединённого с кинезином-1?</h3><ol><li><b>А.</b> Почти все пробеги будут направлены к дальнему концу дендрита <i>(неверный вариант)</i><br><span class="expl">Так было бы при однородной ориентации, как в аксоне. В дендрите кинезин-1 движется к плюс-концу и по трекам, обращённым плюс-концом к телу клетки.</span></li><li><b>Б.</b> Пробеги будут направлены в обе стороны примерно поровну <i>(верный вариант)</i><br><span class="expl">Кинезин-1 всегда движется к плюс-концу, а плюс-концы в этой части дендрита обращены в обе стороны примерно поровну, поэтому и пробеги идут в обе стороны. В живом нейроне кинезин-1 переносит грузы преимущественно в аксон (Nakata и Hirokawa 2003), поэтому эксперимент мысленный: он проверяет только роль ориентации треков.</span></li><li><b>В.</b> Почти все пробеги будут направлены к телу нейрона <i>(неверный вариант)</i><br><span class="expl">Почти все пробеги шли бы к телу нейрона, если бы к нему были обращены плюс-концы почти всех микротрубочек. В этой части дендрита так ориентирована лишь около половины микротрубочек, а кинезин-1 движется к плюс-концу любой из них, поэтому пробеги направлены в обе стороны. При смешанной ориентации и минус-концевой мотор переносил бы грузы в обе стороны.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.85.21.8335">Baas P. W. et al. 1988. Polarity orientation of microtubules in hippocampal neurons: uniformity in the axon and nonuniformity in the dendrite. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1523/JNEUROSCI.23-07-02655.2003">Stepanova T. et al. 2003. Visualization of microtubule growth in cultured neurons via the use of EB3-GFP. J Neurosci</a></li><li><a href="https://doi.org/10.1038/s41580-022-00473-y">Akhmanova A., Kapitein L. C. 2022. Mechanisms of microtubule organization in differentiated animal cells. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200302175">Nakata T., Hirokawa N. 2003. Microtubules provide directional cues for polarized axonal transport through interaction with kinesin motor head. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cub.2009.12.052">Kapitein L. C. et al. 2010. Mixed microtubules steer dynein-driven cargo transport into dendrites. Curr Biol</a></li></ul><p>Ориентация микротрубочек: Baas 1988 — электронная микроскопия, нейроны гиппокампа крысы в культуре; Stepanova 2003 — EB3-GFP в нейронах гиппокампа мыши в культуре. Организация микротрубочек вне центросомы — обзор Akhmanova и Kapitein 2022. Избирательный перенос кинезином-1 в аксон — Nakata и Hirokawa 2003 (нейроны гиппокампа мыши); при индуцируемом присоединении моторов к грузу в нейронах крысы кинезин переносил груз в аксон, а динеин — в дендриты (Kapitein 2010, Curr Biol). Задача про кинезин-1 в дендрите — мысленный эксперимент. Доли на схеме (100, 98 и 60 %) и распределение грузов по зонам — учебная модель практикума (вопрос 1, базовый уровень).</p></details></article><article class="card print-unit" id="ns-motors"><div class="eyebrow">Транспорт по цитоскелету · шаг 2 из 30</div><h2>Чем различаются кинезины, динеин и миозины</h2><p class="lead">Три семейства моторов превращают энергию гидролиза ATP в направленное перемещение, но по разным трекам и в разные стороны. Для транспорта важна <a href="#ns-g-S2-T14">процессивность</a>: способность одной молекулы сделать много шагов, не отсоединяясь от трека.</p><ol class="mech"><li><a href="#ns-g-S2-T10">Кинезин-1</a> движется по микротрубочке к плюс-концу шагами 8 нм; <a href="#ns-g-S2-T11">цитоплазматический динеин</a> — к минус-концу.</li><li><a href="#ns-g-S2-T13">Миозин V</a> движется по актиновому филаменту к оперённому концу шагами около 36 нм и переносит груз на коротком участке у мембраны.</li><li>Гидролиз ATP сопряжён со сменой сродства головки к треку; у процессивных двуглавых моторов головки ходят попеременно.</li></ol><p>Общее у трёх семейств <a href="#ns-g-S2-T04">моторов</a> — механохимический цикл: связывание ATP, гидролиз и высвобождение продуктов меняют конформацию моторной головки и её сродство к треку. Различаются трек, направление и способ движения. Кинезины (у человека более сорока генов) в большинстве движутся по микротрубочке к плюс-концу; к минус-концу органеллы в животной клетке переносит практически один мотор — цитоплазматический динеин (Reck-Peterson 2018).</p><p>Кинезин-1 — наиболее изученный представитель. Его две головки по очереди отсоединяются от микротрубочки, смещаются вперёд и вновь связываются, так что в каждый момент хотя бы одна головка связана с треком. Каждый шаг равен 8 нм — периоду решётки микротрубочки; одиночная молекула in vitro делает около ста шагов, то есть проходит около микрометра, со скоростью порядка 1 мкм/с (Yildiz 2025). Скорость и длина пробега задаются кинетикой одного и того же цикла.</p><p>Миозин V движется по актину шагами около 36 нм, соответствующими полупериоду двойной спирали филамента, и потому идёт вдоль него, не закручиваясь (Sweeney 2018). Миозин II, напротив, непроцессивен: одиночная молекула связана с актином лишь малую часть цикла, и перемещение создаётся ансамблем головок в биполярном филаменте. Попеременная ходьба — свойство отдельных процессивных моторов, а не общий закон всего семейства.</p><p>Часть кинезинов вообще не переносит груз: кинезины семейств 13 и 8 ускоряют разборку концов микротрубочки. Поэтому принадлежность белка к семейству ещё не говорит о его работе.</p><div class="note trap"><strong>Типичная ошибка</strong> Все моторы одного семейства ходят одинаково, и любой миозин переносит груз.<p class="trap-fix">Миозин II непроцессивен и работает в ансамбле; груз переносят процессивные миозины V и VI. Среди кинезинов есть белки, которые не переносят груз, а разбирают концы микротрубочек.</p></div><div class="static-quiz"><h3>Одиночную молекулу миозина II и одиночную молекулу миозина V поместили на актиновый филамент с ATP. Какая из них будет перемещаться вдоль филамента на много шагов, не отсоединяясь?</h3><ol><li><b>А.</b> Обе: все миозины процессивны <i>(неверный вариант)</i><br><span class="expl">Процессивность — свойство отдельных моторов, а не всего семейства. Одиночный миозин II связан с актином лишь малую часть цикла.</span></li><li><b>Б.</b> Только миозин II, работающий в мышце <i>(неверный вариант)</i><br><span class="expl">Миозин II создаёт движение только в ансамбле головок биполярного филамента; одиночная молекула быстро отсоединяется от трека.</span></li><li><b>В.</b> Только миозин V, переносящий груз <i>(верный вариант)</i><br><span class="expl">Головки миозина V ходят попеременно шагами около 36 нм, и одна из них всегда связана с актином, поэтому одиночная молекула проходит много шагов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00780-6">Yildiz A. 2025. Mechanism and regulation of kinesin motors. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1101/cshperspect.a021931">Sweeney H. L., Holzbaur E. L. F. 2018. Motor proteins. Cold Spring Harb Perspect Biol</a></li><li><a href="https://doi.org/10.1038/s41580-018-0004-3">Reck-Peterson S. L. et al. 2018. The cytoplasmic dynein transport machinery and its many cargoes. Nat Rev Mol Cell Biol</a></li></ul><p>Параметры кинезина-1 (шаг 8 нм, около ста шагов до отсоединения, скорость порядка 1 мкм/с) получены на одиночных молекулах in vitro (обзор Yildiz 2025); в клетке скорость и пробег зависят от груза, числа моторов и модификаций трека. Параметры миозина V и миозина II — обзор Sweeney и Holzbaur 2018. Динеин как практически единственный минус-концевой мотор органелл — обзор Reck-Peterson 2018.</p></details></article><article class="card print-unit" id="ns-adaptors"><div class="eyebrow">Транспорт по цитоскелету · шаг 3 из 30</div><h2>Как мотор связывается со своим грузом и почему без груза он неактивен</h2><p class="lead">Один динеин переносит почти все грузы к минус-концу, значит, избирательность создаёт не сам мотор. <a href="#ns-g-S2-T05">Адаптер груза</a> одновременно определяет, какой груз будет связан с мотором, и активирует мотор.</p><ol class="mech"><li>Без груза кинезин-1 <a href="#ns-g-S2-T15">автоингибирован</a> и почти не гидролизует ATP; одиночный динеин находится в автоингибированной конформации и процессивно не движется.</li><li>Динеин движется процессивно только в комплексе с <a href="#ns-g-S2-T12">динактином</a> и адаптером (BICD2, HOOK3 и др.).</li><li>Митохондрия связывается с кинезином-1 и динеином через адаптеры <a href="#ns-g-S2-T17">TRAK</a> и белок наружной мембраны Miro.</li></ol><p>Цитоплазматический динеин в отсутствие партнёров автоингибирован: его моторные головки уложены так, что процессивное движение невозможно. Очищенный динеин млекопитающих в экспериментах in vitro по микротрубочке процессивно не двигался; когда же он образовывал комплекс с динактином и одним из адаптеров груза, комплекс проходил расстояния, сравнимые с пробегами грузов в клетке (McKenney 2014). Динактин сам мотором не является: вместе с адаптером он собирает динеин в активный комплекс.</p><p>Отсюда понятно, как один мотор переносит множество разных грузов и почти не гидролизует ATP без груза. Адаптер связывается и с грузом, и с комплексом динеин — динактин, поэтому сборка комплекса на грузе одновременно определяет адрес и активирует мотор. Разные адаптеры включают в комплекс одну или две молекулы динеина: BICD2 чаще одну, BICDR1 и HOOK3 — две, и комплекс с двумя динеинами развивает большую силу и скорость (Urnavicius 2018).</p><p>Кинезин-1 устроен иначе, но логика та же: без груза его хвост складывается на моторные домены и подавляет и гидролиз ATP, и связывание с треком; связывание груза и адаптеров снимает это торможение (Yildiz 2025). Поэтому утверждения «мотор есть в клетке» и «мотор работает» различаются, и второе требует данных об активации.</p><p>Для митохондрий адаптерная система изучена особенно подробно. Белок наружной мембраны Miro через адаптеры TRAK1/2 (у дрозофилы — Milton) связывает митохондрию с кинезином-1 и с динеином. У Miro есть два Ca²⁺-связывающих EF-мотива; как эта связь управляет остановкой митохондрии, разобрано в шаге об остановке и закреплении.</p><div class="note trap"><strong>Типичная ошибка</strong> Динеин движется по микротрубочке сам, а адаптер лишь прикрепляет к нему груз.<p class="trap-fix">Одиночный динеин автоингибирован и процессивно не движется; процессивное движение начинается в комплексе с динактином и адаптером, поэтому адаптер и определяет груз, и активирует мотор.</p></div><div class="static-quiz"><h3>К очищенному динеину на микротрубочке добавили динактин, но без адаптера груза. Как будет двигаться динеин?</h3><ol><li><b>А.</b> Процессивно к минус-концу, как в составе груза <i>(неверный вариант)</i><br><span class="expl">Для процессивного движения нужен тройной комплекс: динактин без адаптера не собирает динеин в активную форму.</span></li><li><b>Б.</b> Процессивно к плюс-концу микротрубочки <i>(неверный вариант)</i><br><span class="expl">Направление динеина задано устройством мотора — к минус-концу; динактин его не меняет.</span></li><li><b>В.</b> Процессивного движения не будет <i>(верный вариант)</i><br><span class="expl">Только тройной комплекс динеин — динактин — адаптер движется процессивно (McKenney 2014); без адаптера динеин остаётся в неактивном состоянии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1254198">McKenney R. J. et al. 2014. Activation of cytoplasmic dynein motility by dynactin-cargo adapter complexes. Science</a></li><li><a href="https://doi.org/10.1038/nature25462">Urnavicius L. et al. 2018. Cryo-EM shows how dynactin recruits two dyneins for faster movement. Nature</a></li><li><a href="https://doi.org/10.1038/s41580-024-00780-6">Yildiz A. 2025. Mechanism and regulation of kinesin motors. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.neuron.2017.09.055">Misgeld T., Schwarz T. L. 2017. Mitostasis in neurons: maintaining mitochondria in an extended cellular architecture. Neuron</a></li></ul><p>Активация динеина — эксперименты in vitro с очищенными белками млекопитающих (McKenney 2014; Urnavicius 2018: криоэлектронная микроскопия и одиночные молекулы). Автоингибирование кинезина-1 — обзор Yildiz 2025. Комплекс TRAK–Miro — обзор Misgeld и Schwarz 2017. Состояния на схеме — схема механизма, без чисел.</p></details></article><article class="card print-unit" id="ns-bidirectional"><div class="eyebrow">Транспорт по цитоскелету · шаг 4 из 30</div><h2>Почему груз движется то в одну, то в другую сторону</h2><p class="lead">На одном грузе обычно находятся и кинезины, и динеин, и большинство органелл движутся прерывисто, сменяя направление. Две гипотезы объясняют это по-разному и дают противоположные предсказания для эксперимента с удалением одного мотора.</p><ol class="mech"><li><a href="#ns-g-S2-T21">Модель перетягивания</a>: моторы обоих направлений активны одновременно, направление задаёт механически преобладающая группа.</li><li><a href="#ns-g-S2-T22">Модель согласованного переключения</a>: в каждый момент активна одна группа, а моторы противоположных направлений нужны друг другу.</li><li>Ослабление динеина в первой модели усиливает движение к плюс-концу, во второй — ослабляет движение в обе стороны.</li></ol><p>Прижизненное наблюдение показывает, что большинство органелл и рибонуклеопротеиновых частиц движутся прерывисто: короткие пробеги в одну сторону сменяются пробегами в другую и остановками. Такое движение называют двунаправленным; оно связано с тем, что на грузе одновременно находятся моторы обоих направлений.</p><p>Модель перетягивания предполагает, что моторы обоих направлений активны одновременно, а наблюдаемое направление определяется тем, какая группа механически сильнее. Тогда ослабление динеина должно усиливать <a href="#ns-g-S2-T20">антероградное</a> движение: кинезину меньше противодействует мотор противоположного направления. Модель согласованного переключения предполагает, что в каждый момент работает одна группа моторов и что моторы противоположных направлений нужны друг другу для активации. Тогда ослабление динеина должно снижать движение в обе стороны.</p><p>Во многих системах удаление или подавление одного мотора действительно снижало движение в обе стороны; этот «парадокс взаимной зависимости» разобран в обзоре Hancock (2014). В клетках дрозофилы S2 подавление кинезина-1 прекращало и перенос пероксисом динеином, и наоборот (Ally 2009); в аксонах мотонейронов личинок дрозофилы мутации кинезина-1 нарушали и ретроградный перенос митохондрий, а мутации динеина не меняли и не усиливали перенос к окончанию аксона (Pilling 2006) — простое перетягивание предсказывало бы усиление. Вклад перетягивания в отдельных системах при этом не исключён.</p><p>Важно не выбрать модель, а уметь сформулировать оба предсказания и назвать эксперимент, который их различает. На схеме те же два предсказания посчитаны по модели практикума: это учебный расчёт, а не данные эксперимента.</p><div class="note trap"><strong>Типичная ошибка</strong> Если убрать динеин, кинезин без противодействия будет переносить груз к плюс-концу ещё активнее.<p class="trap-fix">Это предсказание модели перетягивания. Во многих экспериментах удаление одного мотора снижало движение в обе стороны, что говорит о взаимной зависимости моторов.</p></div><div class="static-quiz"><h3>В клетках подавили синтез динеина. Какой результат говорит в пользу модели согласованного переключения?</h3><ol><li><b>А.</b> Пробеги к плюс-концу стали чаще и длиннее <i>(неверный вариант)</i><br><span class="expl">Такой результат предсказывает модель перетягивания: динеин больше не противодействует кинезину. По модели согласованного переключения ослабление одного мотора ослабляет и другой.</span></li><li><b>Б.</b> Пробеги к плюс-концу стали реже <i>(верный вариант)</i><br><span class="expl">Если моторы противоположных направлений нужны друг другу, подавление динеина снижает движение и к минус-, и к плюс-концу.</span></li><li><b>В.</b> Пробеги к плюс-концу не изменились <i>(неверный вариант)</i><br><span class="expl">Неизменный перенос к плюс-концу означал бы, что моторы независимы. Обе модели предсказывают изменение, но разного знака.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrm3853">Hancock W. O. 2014. Bidirectional cargo transport: moving beyond tug of war. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200908075">Ally S. et al. 2009. Opposite-polarity motors activate one another to trigger cargo transport in live cells. J Cell Biol</a></li><li><a href="https://doi.org/10.1091/mbc.e05-06-0526">Pilling A. D. et al. 2006. Kinesin-1 and dynein are the primary motors for fast transport of mitochondria in Drosophila motor axons. Mol Biol Cell</a></li></ul><p>Обзор Hancock 2014; Ally 2009 — клетки дрозофилы S2, пероксисомы, РНК-интерференция и замена моторов; Pilling 2006 — аксоны мотонейронов личинок дрозофилы, мутации кинезина-1 и динеина. Числа на схеме — расчёт по модели практикума (вопрос 1, продвинутый уровень, мысленный эксперимент): путь всех митохондрий участка, мкм за минуту, учебные величины.</p></details></article><article class="card print-unit" id="ns-stop-anchor"><div class="eyebrow">Транспорт по цитоскелету · шаг 5 из 30</div><h2>Как митохондрия останавливается у активного синапса</h2><p class="lead">Распределение органелл задаёт не только перенос, но и остановка и закрепление. В аксоне митохондрия останавливается там, где повышена концентрация Ca²⁺, и закрепляется синтафилином.</p><ol class="mech"><li>Ca²⁺ связывается с <a href="#ns-g-S2-T19">EF-мотивами</a> Miro, и кинезин-1 перестаёт перемещать митохондрию.</li><li><a href="#ns-g-S2-T18">Синтафилин</a> закрепляет митохондрию на микротрубочке и подавляет кинезин-1.</li><li>Без синтафилина доля подвижных митохондрий растёт примерно вдвое, а остановка при активности исчезает.</li></ol><p>Около трети митохондрий аксона в культуре подвижны, остальные неподвижны (Kang 2008). Остановка — не простое прекращение движения: груз закрепляется якорными белками, связывающими его с цитоскелетом. Поэтому распределение органелл — результат трёх регулируемых процессов: активации моторов, согласования моторов противоположных направлений и закрепления.</p><p>В участке аксона с активным синапсом концентрация Ca²⁺ повышена. Ca²⁺ связывается с двумя EF-мотивами Miro, и движение митохондрии в обе стороны прекращается. По данным Wang и Schwarz (2009), Miro, связавший Ca²⁺, взаимодействует с моторным доменом кинезина-1 и не даёт ему связаться с микротрубочкой; по данным Macaskill и соавт. (2009), кинезин отделяется от митохондрии. Замены в EF-мотивах, устраняющие связывание Ca²⁺, сохраняют движение, но устраняют остановку при стимуляции глутаматом (нейроны гиппокампа крысы).</p><p>Закрепление обеспечивает синтафилин — белок наружной мембраны митохондрий аксона. В нейронах гиппокампа мышей без гена Snph доля подвижных митохондрий выросла примерно с трети до трёх четвертей (Kang 2008), а остановка митохондрий при активности нейрона исчезла (Chen и Sheng 2013). Синтафилин закрепляет органеллу на микротрубочке и, связываясь с кинезином-1, подавляет его АТФазную активность, то есть останавливает мотор.</p><p>Механизм имеет физиологический смысл: митохондрия задерживается там, где расход ATP и поступление Ca²⁺ наибольшие. На схеме показана кимограмма модели практикума; доли подвижных митохондрий в ней подобраны по данным Kang 2008, остальные числа условны.</p><div class="note trap"><strong>Типичная ошибка</strong> Чтобы остановить митохондрию у синапса, достаточно Ca²⁺-сенсора Miro.<p class="trap-fix">В экспериментах на нейронах мыши без синтафилина митохондрии продолжали двигаться при активности: для остановки нужны и Ca²⁺-сенсор Miro, и якорный белок синтафилин.</p></div><div class="static-quiz"><h3>Нейроны с белком Miro, у которого заменами в EF-мотивах устранено связывание Ca²⁺, стимулировали глутаматом. Как изменится движение митохондрий в аксоне?</h3><ol><li><b>А.</b> Митохондрии продолжат двигаться, остановки не будет <i>(верный вариант)</i><br><span class="expl">Без связывания Ca²⁺ Miro не останавливает кинезин-1, поэтому митохондрии продолжают двигаться при повышении Ca²⁺ (Wang и Schwarz 2009; Macaskill 2009).</span></li><li><b>Б.</b> Митохондрии остановятся быстрее, чем в норме <i>(неверный вариант)</i><br><span class="expl">Замены в EF-мотивах не усиливают Ca²⁺-зависимую остановку, а устраняют её: Miro перестаёт связывать Ca²⁺.</span></li><li><b>В.</b> Митохондрии перестанут двигаться и без глутамата <i>(неверный вариант)</i><br><span class="expl">Miro без связывания Ca²⁺ по-прежнему соединяет митохондрию с кинезином-1, и в покое митохондрии движутся как в норме.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2008.11.046">Wang X., Schwarz T. L. 2009. The mechanism of Ca2+-dependent regulation of kinesin-mediated mitochondrial motility. Cell</a></li><li><a href="https://doi.org/10.1016/j.neuron.2009.01.030">Macaskill A. F. et al. 2009. Miro1 is a calcium sensor for glutamate receptor-dependent localization of mitochondria at synapses. Neuron</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.11.024">Kang J.-S. et al. 2008. Docking of axonal mitochondria by syntaphilin controls their mobility and affects short-term facilitation. Cell</a></li><li><a href="https://doi.org/10.1083/jcb.201302040">Chen Y., Sheng Z.-H. 2013. Kinesin-1-syntaphilin coupling mediates activity-dependent regulation of axonal mitochondrial transport. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.neuron.2017.09.055">Misgeld T., Schwarz T. L. 2017. Mitostasis in neurons: maintaining mitochondria in an extended cellular architecture. Neuron</a></li></ul><p>Wang и Schwarz 2009, Macaskill 2009 — нейроны гиппокампа крысы в культуре, замены в EF-мотивах Miro, глутамат или активность. Kang 2008 — нейроны гиппокампа мышей Snph⁻/⁻ в культуре: доля подвижных митохондрий около трети в норме и около трёх четвертей без синтафилина. Chen и Sheng 2013 — нейроны мышей Snph⁻/⁻, остановка при активности. Кимограмма и числа схемы — модель практикума (вопрос 1, продвинутый уровень).</p></details></article><article class="card print-unit" id="ns-positioning"><div class="eyebrow">Транспорт по цитоскелету · шаг 6 из 30</div><h2>Как положение органеллы влияет на её функцию</h2><p class="lead">Положение органеллы — не сопутствующее явление, а способ регуляции: один и тот же набор белков даёт разный результат в зависимости от того, куда его перенесли. Нарушение транспорта сильнее всего сказывается на самых длинных отростках.</p><ol class="mech"><li>В полной среде лизосомы смещаются к периферии, в среде без питательных веществ собираются вблизи ядра (<a href="#ns-g-S2-T26">позиционирование лизосом</a>).</li><li>Периферическое положение лизосом связано с активностью mTORC1, перинуклеарное — с её снижением и слиянием с автофагосомами.</li><li>Мутации моторных доменов KIF5A и KIF1A вызывают <a href="#ns-g-S2-T28">наследственную спастическую параплегию</a> с поражением длинных аксонов.</li></ol><p>Лизосомы в клетках HeLa меняют положение в зависимости от питания: в полной среде они распределены по периферии, а в среде без питательных веществ собираются вблизи ядра; перинуклеарное скопление в этих экспериментах было связано с изменением внутриклеточного pH. Активность mTORC1 коррелировала с его присутствием на периферических лизосомах, а положение лизосом влияло и на образование автофагосом, и на скорость их слияния с лизосомами (Korolchuk 2011). Так перемещение органеллы становится частью регуляции питания клетки.</p><p>Нейрон — предельный случай задачи распределения: длина аксона у человека достигает десятков сантиметров, а потребность в ATP и в связывании Ca²⁺ неодинакова по его длине. Остановка митохондрии у активного синапса обеспечивает такое распределение локально, без участия ядра (шаг об остановке и закреплении).</p><p>Часть мРНК переносится в составе рибонуклеопротеиновых частиц в отростки нейрона и транслируется там по местному сигналу (<a href="#ns-g-S2-T27">локальная трансляция</a>). Доставка мРНК с последующим местным синтезом позволяет изменить белковый состав удалённого участка, не дожидаясь доставки готового белка из тела клетки (обзор Holt 2019).</p><p>Медицинское значение транспорта показывают генетические данные. Замена в моторном домене KIF5A найдена у семьи с наследственной спастической параплегией SPG10 (Reid 2002), замена в моторном домене KIF1A — у семьи с наследственной спастической параплегией (Erlich 2011). Гены KIF5A и KIF1A экспрессируются во многих типах клеток, но поражаются прежде всего самые длинные аксоны; авторы связывают это с нарушением аксонального транспорта.</p><div class="note trap"><strong>Типичная ошибка</strong> Лизосомы распределены в клетке случайно, и их положение не влияет на сигналы.<p class="trap-fix">Положение лизосом меняется с питанием и связано с активностью mTORC1 и аутофагией (Korolchuk 2011); перемещение органеллы меняет её функцию.</p></div><div class="static-quiz"><h3>Клетки HeLa перевели из полной среды в среду без питательных веществ. Как изменится положение лизосом?</h3><ol><li><b>А.</b> Лизосомы соберутся вблизи ядра <i>(верный вариант)</i><br><span class="expl">В среде без питательных веществ лизосомы собираются перинуклеарно; это связано со снижением активности mTORC1 и сближением лизосом с автофагосомами (Korolchuk 2011).</span></li><li><b>Б.</b> Лизосомы сместятся к периферии <i>(неверный вариант)</i><br><span class="expl">Периферическое положение характерно для обилия питательных веществ, когда mTORC1 активен на лизосомах.</span></li><li><b>В.</b> Положение лизосом не изменится <i>(неверный вариант)</i><br><span class="expl">Положение лизосом зависит от условий питания; именно поэтому его рассматривают как способ регуляции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb2204">Korolchuk V. I. et al. 2011. Lysosomal positioning coordinates cellular nutrient responses. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41594-019-0263-5">Holt C. E., Martin K. C., Schuman E. M. 2019. Local translation in neurons: visualization and function. Nat Struct Mol Biol</a></li><li><a href="https://doi.org/10.1086/344210">Reid E. et al. 2002. A kinesin heavy chain (KIF5A) mutation in hereditary spastic paraplegia (SPG10). Am J Hum Genet</a></li><li><a href="https://doi.org/10.1101/gr.117143.110">Erlich Y. et al. 2011. Exome sequencing and disease-network analysis of a single family implicate a mutation in KIF1A in hereditary spastic paraparesis. Genome Res</a></li><li><a href="https://doi.org/10.1016/j.neuron.2017.09.055">Misgeld T., Schwarz T. L. 2017. Mitostasis in neurons: maintaining mitochondria in an extended cellular architecture. Neuron</a></li></ul><p>Korolchuk 2011 — клетки HeLa, полная среда и три протокола голодания (в том числе 5 ч без сыворотки и аминокислот), положение лизосом, mTORC1 и аутофагия; перинуклеарное скопление лизосом при голодании связано с изменением внутриклеточного pH. Локальная трансляция — обзор Holt, Martin и Schuman 2019. Генетика: Reid 2002 (KIF5A, SPG10, одна семья), Erlich 2011 (KIF1A, одна семья) — связь мутации с поражением длинных аксонов предложена авторами как объяснение. Схема — схема механизма без чисел.</p></details></article><article class="card print-unit" id="ns-kymograph"><div class="eyebrow">Транспорт по цитоскелету · шаг 7 из 30</div><h2>Как измерить направление транспорта и доказать роль мотора</h2><p class="lead">Утверждение «груз движется к периферии» требует измерения, а не предположения. Необходимость мотора показывают его удалением, достаточность — искусственным присоединением мотора к грузу.</p><ol class="mech"><li><a href="#ns-g-S2-T23">Кимограмма</a> превращает прижизненную съёмку в рисунок: наклон линии даёт скорость и направление, вертикаль — остановку.</li><li>Ориентацию треков в той же клетке определяют по движению <a href="#ns-g-S2-T24">маркеров плюс-концов</a> (EB3).</li><li><a href="#ns-g-S2-T25">Химически индуцируемая димеризация</a> присоединяет выбранный мотор к выбранному грузу и проверяет достаточность мотора.</li></ol><p>Базовый приём — прижизненная съёмка с построением кимограммы. Вдоль выбранного участка (например, аксона) проводят линию и для каждого кадра записывают интенсивность вдоль неё; кадры укладывают друг под другом. По горизонтали откладывается положение, по вертикали — время: неподвижный груз даёт вертикальную линию, движущийся — наклонную; наклон даёт скорость, сторона наклона — направление. Так же измеряют долю времени в движении и в остановках.</p><p>Направление имеет смысл только относительно известной ориентации треков, поэтому в той же клетке определяют полярность микротрубочек — по движению белков, связывающихся с растущими плюс-концами, например EB3-GFP (Stepanova 2003). Без этого контроля вывод о том, какой мотор задействован, сделать нельзя.</p><p>Причинность проверяют вмешательством. <a href="#ns-g-S2-T07">Нокодазол</a> вызывает разборку микротрубочек, латрункулин A препятствует полимеризации актина; остановка груза показывает, что движение зависит от трека, но не указывает мотор. Удаление конкретного мотора или адаптера проверяет его необходимость; при этом нужно помнить о взаимной зависимости моторов (шаг о двунаправленном движении).</p><p>Наиболее прямой приём — искусственное присоединение мотора к грузу. Белок FKBP прикрепляют к грузу (например, к пероксисоме), а фрагмент FRB — к мотору; добавленный рапалог связывает их. Если груз сразу начинает двигаться в предсказанную сторону, доказана достаточность мотора (Kapitein 2010). Так, N-концевой фрагмент адаптера BICD2, прикреплённый к пероксисомам, вызывал их перенос динеином к минус-концам (Hoogenraad 2003).</p><div class="note trap"><strong>Типичная ошибка</strong> Если нокодазол остановил груз, значит, груз переносит кинезин.<p class="trap-fix">Нокодазол разрушает трек для всех моторов микротрубочек. Он показывает зависимость от микротрубочек, но не указывает, какой мотор участвует.</p></div><div class="static-quiz"><h3>К пероксисомам в клетке с центросомой рапалогом присоединили активный фрагмент кинезина. Что покажет эксперимент, если пероксисомы за минуты соберутся на периферии?</h3><ol><li><b>А.</b> Что этот кинезин необходим для движения пероксисом в норме <i>(неверный вариант)</i><br><span class="expl">Необходимость проверяют удалением мотора. Присоединение показывает, что мотор может сам перенести груз, но не то, что груз в норме переносит именно он.</span></li><li><b>Б.</b> Что этого мотора достаточно, чтобы перенести груз к периферии <i>(верный вариант)</i><br><span class="expl">Искусственное присоединение проверяет достаточность: одного выбранного мотора хватает, чтобы перенести груз в сторону плюс-концов (Kapitein 2010).</span></li><li><b>В.</b> Что в клетке нет динеина, способного перенести груз к центру <i>(неверный вариант)</i><br><span class="expl">Эксперимент ничего не говорит о динеине клетки: он показывает лишь, что присоединённого кинезина хватает для переноса к периферии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-2.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1523/JNEUROSCI.23-07-02655.2003">Stepanova T. et al. 2003. Visualization of microtubule growth in cultured neurons via the use of EB3-GFP. J Neurosci</a></li><li><a href="https://doi.org/10.1016/j.bpj.2010.07.055">Kapitein L. C. et al. 2010. Probing intracellular motor protein activity using an inducible cargo trafficking assay. Biophys J</a></li><li><a href="https://doi.org/10.1093/emboj/cdg592">Hoogenraad C. C. et al. 2003. Bicaudal D induces selective dynein-mediated microtubule minus end-directed transport. EMBO J</a></li></ul><p>Кимограмма и проверка направления — схема метода. EB3-GFP — Stepanova 2003, нейроны мыши. Индуцируемое присоединение моторов к пероксисомам (FKBP — рапалог — FRB) — Kapitein 2010 (клетки млекопитающих в культуре); BICD2-N на пероксисомах и митохондриях — Hoogenraad 2003. Схемы — схемы методов, без чисел.</p></details></article><article class="card print-unit" id="ns-balance"><div class="eyebrow">Слияние и деление · шаг 8 из 30</div><h2>Почему форма сети митохондрий — стационарное состояние двух процессов</h2><p class="lead">Число митохондрий и их длину не задаёт ни синтез, ни разрушение: их задают два непрерывно идущих противоположных процесса — <a href="#ns-g-S2-T30">слияние</a> и <a href="#ns-g-S2-T31">деление</a>. В учебной модели форму сети приближённо задаёт отношение констант скоростей слияния и деления, пока оба процесса идут намного быстрее роста клеток; частота событий зависит ещё и от самих констант и от числа органелл.</p><ol class="mech"><li>Деление дробит сеть на более короткие органеллы, слияние объединяет их; оба процесса идут постоянно, даже когда картина не меняется.</li><li>Неизменная картина — <a href="#ns-g-S2-T06">стационарное состояние</a>: за минуту делением возникает почти столько же органелл, сколько исчезает при слиянии; небольшой избыток делений восполняет разбавление сети при росте клеток.</li><li>Одна и та же картина получается при разных константах: подавление слияния и усиление деления дают одинаковую фрагментацию.</li></ol><p>В живой клетке митохондрии постоянно сливаются друг с другом и делятся. Поэтому то, что мы видим на снимке, — короткие отдельные органеллы или протяжённая разветвлённая сеть, — не постоянное свойство органеллы, а результат двух противоположных потоков. Пока делений происходит почти столько же, сколько слияний, число органелл и их средняя длина не меняются, хотя каждая митохондрия за несколько минут успевает и слиться, и разделиться.</p><p>Из этого следует главное правило вопроса. Пока оба процесса идут намного быстрее роста клеток, форму сети задаёт отношение констант скоростей: если слияние ослабить вдвое, то, пока сеть перестраивается, делений больше, чем слияний, органелл становится больше, и средняя длина в учебной модели падает с 4,4 до 2,5 мкм. Ровно ту же картину даёт усиление деления вдвое при неизменном слиянии. А если замедлить вдвое оба процесса сразу, средняя длина почти не изменится, хотя событий слияния и деления станет вдвое меньше: клетки с сильно сниженными скоростями обоих процессов могут сохранять трубчатую сеть, если эти скорости уравновешены (Chen 2005, со ссылкой на Chen 2003). В новом стационарном состоянии деления снова почти уравновешивают слияния, поэтому по снимку нельзя установить и текущую разность частот. Близкое наблюдение есть и в экспериментах на дрожжах: у большинства двойных мутантов dnm1 fzo1, полученных скрещиванием, митохондрии трубчатые, как в норме; при последовательном удалении генов чаще сохранялась картина, сложившаяся до удаления второго гена (Sesaki и Jensen 1999).</p><p>Поэтому одна и та же морфология сети совместима с разными механизмами: по одному снимку нельзя сказать, какая машина изменена и изменена ли какая-либо из них вообще. Кроме того, на картину влияют образование новых митохондрий, их удаление аутофагией, подвижность органелл и контакты с другими структурами (Giacomello 2020). Чтобы судить о механизме, измеряют не только форму, но и сами процессы — частоту событий слияния и деления, обмен содержимым между органеллами; об этом шаг «Как узнать, какая машина изменена».</p><p>Меняйте константы на схеме: учебная модель показывает, как их отношение задаёт число органелл, а сами константы вместе с числом органелл — число событий в минуту. Каждое положение ползунков — стационарное состояние, которое установилось бы после долгого ожидания; при очень малых константах заметна заданная в модели поправка на рост клеток. Если остановить обе машины, стационарного состояния нет, и модель сохраняет последнее рассчитанное состояние.</p><div class="note trap"><strong>Типичная ошибка</strong> Фрагментированная сеть означает, что в клетке усилено деление митохондрий.<p class="trap-fix">Та же фрагментация возникает при ослабленном слиянии. Форма сети отражает отношение констант двух процессов, поэтому вывод о том, какой процесс изменён, требует измерения самих событий.</p></div><div class="static-quiz"><h3>После воздействия на культуру клеток доля клеток с фрагментированной сетью митохондрий выросла с 20 до 60 %. Какой вывод из этого наблюдения правомерен?</h3><ol><li><b>А.</b> В клетках усилено деление митохондрий <i>(неверный вариант)</i><br><span class="expl">Это один из возможных механизмов, но не единственный: ту же картину даёт и ослабление слияния. Чтобы выбрать между ними, нужно измерить сами события.</span></li><li><b>Б.</b> Картина совместима и с усилением деления, и с ослаблением слияния <i>(верный вариант)</i><br><span class="expl">Оба изменения приводят к фрагментации. По доле клеток с короткими митохондриями нельзя установить ни причину, ни текущую разность частот событий: после перестройки сети деления и слияния снова почти уравновешены. Нужно измерить сами события и учесть образование и удаление митохондрий (Giacomello 2020).</span></li><li><b>В.</b> В клетках нарушено слияние митохондрий <i>(неверный вариант)</i><br><span class="expl">Ослабленное слияние — лишь одна из возможных причин. Тот же результат даёт усиленное деление при нормальном слиянии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-020-0210-7">Giacomello M. et al. 2020. The cell biology of mitochondrial membrane dynamics. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.147.4.699">Sesaki H., Jensen R. E. 1999. Division versus fusion: Dnm1p and Fzo1p antagonistically regulate mitochondrial shape. J Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M503062200">Chen H., Chomyn A., Chan D. C. 2005. Disruption of fusion results in mitochondrial heterogeneity and dysfunction. J Biol Chem</a></li><li><a href="https://doi.org/10.1083/jcb.200211046">Chen H. et al. 2003. Mitofusins Mfn1 and Mfn2 coordinately regulate mitochondrial fusion and are essential for embryonic development. J Cell Biol</a></li></ul><p>Схема — учебная модель практикума (вопрос 2, базовый уровень): общая длина сети 120 мкм постоянна, частота делений пропорциональна длине сети, частота слияний — числу органелл; константы условные; каждое положение ползунков — стационарное состояние, переходы во времени не рассчитываются; поправка на рост клеток g = 0,0006 мин⁻¹ существенна при очень малых константах (в практикуме, где ползунки идут с шагом 1 %, при одинаковом положении обоих ползунков на 1, 2 и 50 % средняя длина — 6,7; 5,5 и 4,4 мкм; на этой схеме при 5 % — 4,8 мкм); при нулевых константах обоих процессов модель сохраняет последнее рассчитанное состояние. Двойные мутанты dnm1 fzo1 и зависимость их картины от порядка удаления генов — Sesaki и Jensen 1999 (дрожжи). Многофакторность морфологии — обзор Giacomello 2020.</p></details></article><article class="card print-unit" id="ns-fusion"><div class="eyebrow">Слияние и деление · шаг 9 из 30</div><h2>Как сливаются две мембраны митохондрии и почему деполяризованная органелла не сливается</h2><p class="lead">У митохондрии две мембраны, и сливают их две разные машины: наружные — <a href="#ns-g-S2-T32">митофузины</a> MFN1 и MFN2, внутренние — <a href="#ns-g-S2-T33">OPA1</a> вместе с кардиолипином. Слияние идёт по шагам: сначала мембраны сближаются, затем сливаются наружные, затем внутренние, и только после этого объединяется матрикс. Длинная форма OPA1 нужна для слияния внутренних мембран; при потере потенциала протеаза OMA1 расщепляет её, и органелла перестаёт сливаться.</p><ol class="mech"><li>Митофузины на двух соседних митохондриях связываются друг с другом (в trans) и удерживают наружные мембраны рядом: это сближение, но не слияние. Затем, по данным на митохондриях дрожжей in vitro, гидролиз GTP переводит контакт в слияние, и наружные мембраны становятся одной непрерывной мембраной.</li><li>По данным реконструкции in vitro, длинная форма OPA1 вместе с кардиолипином сначала сближает внутренние мембраны, а гидролиз GTP запускает их слияние; только после этого матриксы двух органелл объединяются.</li><li>При потере мембранного потенциала активируется протеаза OMA1 и расщепляет длинную форму OPA1: слияние внутренних мембран прекращается. Сам потенциал мембраны не сближает; связь идёт через протеолиз.</li></ol><p>Слияние митохондрий идёт в несколько стадий, потому что у органеллы две мембраны и две разные машины. Стадии надо различать. <a href="#ns-g-S2-T95">Сближение, или тетеринг</a>, — это удержание двух целых мембран на малом расстоянии: бислои остаются раздельными, содержимое не смешивается. Слияние — перестройка, после которой липидный бислой двух мембран становится непрерывным, а содержимое, ограниченное этой мембраной, может смешиваться. Между ними в общей теории слияния выделяют гемифузию, когда соединены только обращённые друг к другу листки бислоёв; для митофузинов и OPA1 это состояние в источниках шага не разобрано, поэтому на схеме оно не показано. Наружные и внутренние мембраны сливаются раздельными стадиями, которые можно разобщить (см. ниже).</p><p>Сближение и слияние наружных мембран выполняют митофузины MFN1 и MFN2 — ГТФазы наружной мембраны. Митофузин нужен на обеих соседних митохондриях: участки HR2 двух молекул образуют антипараллельную двойную спираль, концы которой с трансмембранными сегментами лежат в разных мембранах, поэтому такой димер связывает органеллы ещё до слияния (Koshiba 2004). Дальше процесс зависит от гидролиза GTP: на изолированных митохондриях дрожжей методом электронной криотомографии показано, что циклы гидролиза GTP постепенно собирают вокруг области контакта кольцо из белков (docking ring), а последующий гидролиз запускает слияние наружной мембраны на периферии области контакта (Brandt 2016). Эти данные получены на дрожжевых митофузинах in vitro; для клеток млекопитающих такая последовательность служит моделью. Митофузины частично заменяют друг друга: в эмбриональных фибробластах мыши без одного из них слияние резко ослаблено и сеть фрагментирована у большинства клеток (Chen 2003), а без обоих не идёт слияние ни наружных, ни внутренних мембран, и сеть распадается на мелкие фрагменты (Chen 2005; Song 2009).</p><p>Внутренние мембраны сливает OPA1 — ГТФаза внутренней мембраны, действующая вместе с кардиолипином, липидом, характерным для внутренней мембраны митохондрий. В реконструкции in vitro с очищенным человеческим L-OPA1 было достаточно, чтобы L-OPA1 находился в одной мембране, а кардиолипин — в противоположной: связывание L-OPA1 с кардиолипином, не требующее GTP, сначала удерживает мембраны рядом, а затем гидролиз GTP запускает слияние; эту реакцию может изменять присутствие S-OPA1 (Ban 2017). Это минимальная система in vitro, и выводы о клетке по ней делают с оговоркой. В клетках OPA1 не нужен одновременно на обеих соседних митохондриях, в отличие от митофузинов (Song 2009); это согласуется с моделью, в которой достаточно L-OPA1 на одной из двух мембран, но само по себе её не доказывает. OPA1 существует в двух формах: <a href="#ns-g-S2-T34">длинная (L-OPA1)</a> закреплена в мембране, короткая (S-OPA1) образуется при её расщеплении протеазами OMA1 и YME1L. В клетках, где обе протеазы удалены и короткой формы нет, митохондрии сливаются нормально: для слияния достаточно длинной формы (Anand 2014). Раньше при экспрессии отдельных форм в клетках без OPA1 слияние восстанавливала только смесь длинных и коротких форм (Song 2007); эти данные пока не согласованы. В клетках без гена OPA1 наружные мембраны соседних митохондрий сливаются, а внутренние — нет: митохондрии часто содержат несколько матриксных компартментов под общей наружной мембраной (Song 2009); при подавлении OPA1 малыми РНК в гибридах клеток не сливались и наружные мембраны (Chen 2005), так что данные о наружных мембранах расходятся.</p><p>Принципиально важна связь слияния с состоянием органеллы. Мембранный потенциал сам не сближает мембраны и не удерживает их порознь: связь идёт через протеолиз. При потере потенциала или ATP активируется <a href="#ns-g-S2-T35">протеаза OMA1</a> и расщепляет почти всю длинную форму OPA1 (Head 2009, Ehses 2009). Поэтому, как предполагают, деполяризованная митохондрия не может слить внутреннюю мембрану со здоровой сетью и не смешивает с ней свой матрикс. Протонофор <a href="#ns-g-S2-T39">CCCP</a>, снимающий <a href="#ns-g-S2-T09">потенциал</a>, одновременно прекращает слияние и сдвигает баланс к делению; саму фрагментацию выполняет DRP1. В клетках HeLa с подавленной OMA1 сеть после CCCP всё равно распадалась, но после отмывания протонофора восстанавливалась быстрее (Head 2009).</p><p>Переключайте стадии на схеме: видно, какая машина и какое состояние мембран соответствуют каждому шагу — от сближения до общего матрикса — и где цепочку обрывает OMA1.</p><div class="note trap"><strong>Типичная ошибка</strong> Для слияния митохондрий достаточно митофузинов наружной мембраны.<p class="trap-fix">Митофузины сближают и сливают только наружные мембраны. Внутренние сливает OPA1; без неё наружные мембраны могут слиться (Song 2009), а матриксы двух органелл остаются раздельными, и обмен содержимым не происходит.</p></div><div class="static-quiz"><h3>В клетках дикого типа митохондрии деполяризовали протонофором CCCP. Почему они перестают сливаться с соседними органеллами?</h3><ol><li><b>А.</b> Протеаза OMA1 расщепляет длинную форму OPA1 <i>(верный вариант)</i><br><span class="expl">При потере потенциала активируется OMA1 и переводит длинную форму OPA1 в короткую. Без длинной формы внутренние мембраны не сливаются.</span></li><li><b>Б.</b> CCCP разрушает митофузины наружной мембраны <i>(неверный вариант)</i><br><span class="expl">CCCP переносит протоны через внутреннюю мембрану и снимает потенциал; митофузины он не разрушает. Слияние останавливается из-за расщепления OPA1 протеазой OMA1.</span></li><li><b>В.</b> Без потенциала DRP1 перестаёт работать <i>(неверный вариант)</i><br><span class="expl">DRP1 — машина деления, а не слияния, и при деполяризации её на мембране становится скорее больше. Слияние прекращается потому, что OMA1 расщепляет длинную форму OPA1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200211046">Chen H. et al. 2003. Mitofusins Mfn1 and Mfn2 coordinately regulate mitochondrial fusion and are essential for embryonic development. J Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M503062200">Chen H., Chomyn A., Chan D. C. 2005. Disruption of fusion results in mitochondrial heterogeneity and dysfunction. J Biol Chem</a></li><li><a href="https://doi.org/10.1083/jcb.200704110">Song Z. et al. 2007. OPA1 processing controls mitochondrial fusion and is regulated by mRNA splicing, membrane potential, and Yme1L. J Cell Biol</a></li><li><a href="https://doi.org/10.1091/mbc.e09-03-0252">Song Z. et al. 2009. Mitofusins and OPA1 mediate sequential steps in mitochondrial membrane fusion. Mol Biol Cell</a></li><li><a href="https://doi.org/10.1083/jcb.201308006">Anand R. et al. 2014. The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200906083">Head B. et al. 2009. Inducible proteolytic inactivation of OPA1 mediated by the OMA1 protease in mammalian cells. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200906084">Ehses S. et al. 2009. Regulation of OPA1 processing and mitochondrial fusion by m-AAA protease isoenzymes and OMA1. J Cell Biol</a></li><li><a href="https://doi.org/10.1126/science.1099793">Koshiba T., Detmer S. A., Kaiser J. T., Chen H., McCaffery J. M., Chan D. C. 2004. Structural basis of mitochondrial tethering by mitofusin complexes. Science</a></li><li><a href="https://doi.org/10.7554/eLife.14618">Brandt T., Cavellini L., Kühlbrandt W., Cohen M. M. 2016. A mitofusin-dependent docking ring complex triggers mitochondrial fusion in vitro. eLife</a></li><li><a href="https://doi.org/10.1038/ncb3560">Ban T., Ishihara T., Kohno H., Saita S., Ichimura A., Maenaka K., Oka T., Mihara K., Ishihara N. 2017. Molecular basis of selective mitochondrial fusion by heterotypic action between OPA1 and cardiolipin. Nat Cell Biol</a></li></ul><p>Схема механизма: порядок стадий обобщён по данным разных систем и не наблюдался целиком в одной из них. Тетеринг митофузинов — структура фрагмента HR2 и митохондрии в клетках (Koshiba 2004, по реферату). Docking ring и слияние наружной мембраны — изолированные митохондрии Saccharomyces cerevisiae in vitro, электронная криотомография (Brandt 2016, по реферату). Слияние внутренних мембран — реконструкция с очищенным человеческим L-OPA1, полученным в клетках шелкопряда, и липосомами; в клетках млекопитающих этот механизм прямо не воспроизведён (Ban 2017, по реферату; полный текст не проверялся). Эксперименты на эмбриональных фибробластах мыши: Mfn1⁻/⁻ и Mfn2⁻/⁻ (Chen 2003 — гибриды клеток, полученные с помощью полиэтиленгликоля, через 7 ч), Mfn1⁻/⁻ Mfn2⁻/⁻ (Chen 2005), клетки без OPA1 (Song 2007; раздельное слияние мембран — Song 2009), без YME1L и OMA1 (Anand 2014 — обмен матриксным фотоактивируемым GFP за 60 мин). Индуцируемое расщепление OPA1 протеазой OMA1 — клетки HeLa, 10 мкМ CCCP, 30 мин, подавление OMA1 малыми интерферирующими РНК (Head 2009); эмбриональные фибробласты мыши, CCCP и олигомицин, снижение OMA1 стабилизировало длинные формы (Ehses 2009, рис. 7).</p></details></article><article class="card print-unit" id="ns-fission"><div class="eyebrow">Слияние и деление · шаг 10 из 30</div><h2>Как DRP1 делит митохондрию и что задаёт место деления</h2><p class="lead">Деление выполняет цитозольная ГТФаза <a href="#ns-g-S2-T36">DRP1</a>: <a href="#ns-g-S2-T37">рецепторы</a> наружной мембраны привлекают её к митохондрии, где она собирается в кольцо и разделяет органеллу. Место деления заранее размечает трубочка ЭПР, а привлечение и активность DRP1 регулируют число рецепторов и фосфорилирование.</p><ol class="mech"><li>Трубочка ЭПР охватывает митохондрию в будущем месте деления и сужает её ещё до сборки DRP1; к сужению добавляется полимеризация актина.</li><li>Рецепторы MFF, FIS1, MiD49 и MiD51 привлекают DRP1 из цитозоля; DRP1 собирается в кольцо вокруг органеллы и при гидролизе GTP сжимает и разделяет мембраны.</li><li>Фосфорилирование DRP1 по Ser616 (CDK1 в митозе) усиливает деление, по Ser637 (PKA) — ослабляет; кальциневрин, дефосфорилируя Ser637, усиливает привлечение DRP1 к митохондриям.</li></ol><p>Большая часть DRP1 находится в цитозоле. На наружную мембрану митохондрии её привлекают рецепторы — MFF, FIS1, MiD49 и MiD51. В эмбриональных фибробластах мыши без MFF на митохондриях меньше скоплений DRP1 и органеллы удлиняются, но оставшееся деление обеспечивают другие рецепторы, в том числе MiD49 и MiD51 (Losón 2013). На мембране DRP1 собирается в кольцо вокруг органеллы и за счёт гидролиза GTP сжимает её. В экспериментах на мембранных трубочках DRP1 сама и сжимает, и разделяет мембрану (Kamerkar 2018).</p><p>Место деления выбирается не случайно. В клетках COS-7 трубочка ЭПР охватывает митохондрию и сужает её в будущей точке деления ещё до появления DRP1 (Friedman 2011); в сужении участвует и полимеризация актина. Позже на тех же клетках и на кардиомиоцитах мыши описаны два типа деления; оба выполняет DRP1 (Kleele 2021). Деление в средней части органеллы идёт с участием ЭПР, актина и MFF и увеличивает число митохондрий. Деление у края, в пределах четверти длины от конца, регулирует FIS1, и ему почти всегда предшествует контакт с лизосомой. Оно отделяет небольшой фрагмент с пониженным мембранным потенциалом и повышенным уровнем активных форм кислорода; около трети таких фрагментов не содержат мтДНК. На фрагменте накапливается белок Parkin, а сам фрагмент направляется на <a href="#ns-g-S2-T45">митофагию</a>; в части случаев его поглощение автофагосомой наблюдали непосредственно. Насколько это разделение универсально, ещё проверяют.</p><p>Активность DRP1 регулируется фосфорилированием по двум остаткам с противоположным эффектом. CDK1 в начале митоза фосфорилирует Ser616, и митохондрии фрагментируются перед распределением между дочерними клетками (Taguchi 2007). PKA фосфорилирует Ser637, и деление ослабевает; кальциневрин дефосфорилирует этот остаток при длительном повышении Ca²⁺, и DRP1 переходит на митохондрии (Cribbs и Strack 2007, Cereghetti 2008). Номера остатков приведены для изоформы 1 DRP1 человека; в работах на белке крысы те же остатки обозначены как Ser585 и Ser656.</p><p>Переключайте этапы схемы: видно, какой белок вступает на каждом шаге и где действуют киназы.</p><div class="note trap"><strong>Типичная ошибка</strong> DRP1 постоянно находится на митохондрии и делит её там, где случайно окажется.<p class="trap-fix">Большая часть DRP1 — в цитозоле; на наружную мембрану её привлекают рецепторы, а место деления заранее размечают трубочка ЭПР и актин.</p></div><div class="static-quiz"><h3>В клетке повысили активность PKA, и DRP1 фосфорилировалась по Ser637. Как изменится частота деления митохондрий?</h3><ol><li><b>А.</b> Повысится, как при действии CDK1 в митозе <i>(неверный вариант)</i><br><span class="expl">CDK1 фосфорилирует другой остаток — Ser616, и это усиливает деление. Фосфорилирование Ser637 киназой PKA действует в противоположную сторону.</span></li><li><b>Б.</b> Снизится, и митохондрии станут длиннее <i>(верный вариант)</i><br><span class="expl">Фосфорилирование Ser637 протеинкиназой A ослабляет деление; сеть смещается в сторону слияния, и митохондрии удлиняются (Cribbs и Strack 2007).</span></li><li><b>В.</b> Не изменится: важен только рецептор MFF <i>(неверный вариант)</i><br><span class="expl">Рецепторы определяют, сколько DRP1 попадёт на мембрану, но активность самой DRP1 зависит и от фосфорилирования: по Ser637 оно ослабляет деление.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1091/mbc.E12-10-0721">Losón O. C. et al. 2013. Fis1, Mff, MiD49, and MiD51 mediate Drp1 recruitment in mitochondrial fission. Mol Biol Cell</a></li><li><a href="https://doi.org/10.1038/s41467-018-07543-w">Kamerkar S. C. et al. 2018. Dynamin-related protein 1 has membrane constricting and severing abilities sufficient for mitochondrial and peroxisomal fission. Nat Commun</a></li><li><a href="https://doi.org/10.1126/science.1207385">Friedman J. R. et al. 2011. ER tubules mark sites of mitochondrial division. Science</a></li><li><a href="https://doi.org/10.1038/s41586-021-03510-6">Kleele T. et al. 2021. Distinct fission signatures predict mitochondrial degradation or biogenesis. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.M607279200">Taguchi N. et al. 2007. Mitotic phosphorylation of dynamin-related GTPase Drp1 participates in mitochondrial fission. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/sj.embor.7401062">Cribbs J. T., Strack S. 2007. Reversible phosphorylation of Drp1 by cyclic AMP-dependent protein kinase and calcineurin regulates mitochondrial fission and cell death. EMBO Rep</a></li><li><a href="https://doi.org/10.1073/pnas.0808249105">Cereghetti G. M. et al. 2008. Dephosphorylation by calcineurin regulates translocation of Drp1 to mitochondria. Proc Natl Acad Sci U S A</a></li></ul><p>Схема механизма. Рецепторы — эмбриональные фибробласты мыши с удалёнными Mff и Fis1 и с подавленными РНК-интерференцией MiD49 и MiD51; любой из MiD49 и MiD51 поддерживал деление в отсутствие Mff и Fis1 (Losón 2013); разделение мембран одной DRP1 — реконструкция на мембранных трубочках и клетки без динаминов (Kamerkar 2018); трубочки ЭПР — клетки COS-7 и дрожжи (Friedman 2011); два типа деления — Kleele 2021, полный текст: клетки COS-7 (положение деления, ЭПР, актин, лизосомы, Parkin, нуклеоиды), постнатальные кардиомиоциты мыши (бимодальное положение делений, стимуляция изопротеренолом), клетки U2OS с эндогенно меченными MFF и FIS1, эмбриональные фибробласты мыши Mff⁻/⁻ и Fis1⁻/⁻ (нокаут Mff снижает только срединные деления, нокаут Fis1 — только периферические). Ser616 (у крысы Ser585) — клетки HeLa в митозе (Taguchi 2007); Ser637 (у крысы Ser656) — культуры клеток (Cribbs и Strack 2007; Cereghetti 2008 — клетки HeLa).</p></details></article><article class="card print-unit" id="ns-meaning"><div class="eyebrow">Слияние и деление · шаг 11 из 30</div><h2>Какие функции выполняют слияние и деление митохондрий</h2><p class="lead">Слияние объединяет содержимое органелл и позволяет им восполнять недостающие продукты: это <a href="#ns-g-S2-T43">комплементация</a>. Деление отделяет повреждённый участок и делает митохондрии достаточно малыми для транспорта по отростку и для аутофагии.</p><ol class="mech"><li>После слияния белки, тРНК и метаболиты двух органелл перемешиваются, а молекулы мтДНК остаются в своих <a href="#ns-g-S2-T42">нуклеоидах</a>.</li><li>При делении дочерние органеллы часто различаются по потенциалу; деполяризованная дочерняя органелла редко сливается снова и удаляется <a href="#ns-g-S2-T45">митофагией</a>.</li><li>Деление облегчает перенос митохондрий по узкому отростку и их удаление аутофагией, хотя не во всех случаях обязательно для этого.</li></ol><p>Слияние нужно прежде всего для обмена содержимым. Митохондриальная ДНК упакована в нуклеоиды — компактные белково-нуклеиновые частицы, основной упаковывающий белок которых TFAM. В клетках человека, несущих две разные мутантные мтДНК с непересекающимися делециями, после слияния клеток синтез митохондриальных белков восстановился, хотя каждая мтДНК по отдельности его не обеспечивала. При этом нуклеоиды не обменивались геномами: продукты обоих геномов — тРНК, рРНК и белки — стали общими, а сами молекулы ДНК остались в своих нуклеоидах (Gilkerson 2008). Комплементация — это обмен продуктами, а не перемешивание геномов.</p><p>Отсюда понятна <a href="#ns-g-S2-T44">гетероплазмия</a>: если часть копий мтДНК несёт мутацию, нормальные копии восполняют недостающие продукты, и дефект проявляется только при доле мутантных копий выше порога. Порог не универсален: он зависит от варианта мтДНК, ткани и числа копий. Без слияния такая комплементация невозможна, и в клетках без обоих митофузинов часть митохондрий теряет потенциал, а дыхание клеток снижается (Chen 2005).</p><p>Деление выполняет противоположную функцию — разделение. В β-клетках поджелудочной железы при делении дочерние органеллы часто различались по потенциалу; дочерняя органелла с пониженным потенциалом и меньшим количеством OPA1 редко сливалась снова и затем удалялась аутофагией, а подавление деления уменьшало удаление митохондрий (Twig 2008). Деление нужно и механически: оно облегчает распределение митохондрий между дочерними клетками, перенос по узкому аксону и поглощение автофагосомой. Однако клетки Drp1⁻/⁻ делятся, хотя и медленнее (Wakabayashi 2009), а митофагия в клетках млекопитающих может идти и без DRP1 (Yamashita 2016). В нейронах мыши без DRP1 митохондрии скапливались в теле клетки и плохо распределялись по отросткам (Ishihara 2009) — это связь с транспортом из вопроса 1.</p><p>Переключайте состояния схемы: видно, какие компоненты при слиянии становятся общими и что отделяет деление.</p><div class="note trap"><strong>Типичная ошибка</strong> При слиянии митохондрий их ДНК смешивается и рекомбинирует, поэтому мутация разбавляется.<p class="trap-fix">Молекулы мтДНК остаются в своих нуклеоидах; общими становятся продукты геномов — тРНК, рРНК и белки. Комплементация — обмен продуктами, а не геномами.</p></div><div class="static-quiz"><h3>Слили клетки двух линий человека; в каждой мтДНК несёт свою делецию и сама по себе не обеспечивает синтез митохондриальных белков. Синтез восстановился. Что произошло с мтДНК в митохондриях гибридных клеток?</h3><ol><li><b>А.</b> Две мтДНК рекомбинировали и дали нормальный геном <i>(неверный вариант)</i><br><span class="expl">Рекомбинация не понадобилась: продукты двух геномов восполнили друг друга, а сами молекулы ДНК остались раздельными (Gilkerson 2008).</span></li><li><b>Б.</b> Геномы остались раздельными, продукты стали общими <i>(верный вариант)</i><br><span class="expl">После слияния тРНК, рРНК и белки обоих геномов стали доступны общему матриксу, а нуклеоиды сохранили свою мтДНК — это комплементация без обмена геномами.</span></li><li><b>В.</b> Нуклеоиды обменялись молекулами мтДНК поровну <i>(неверный вариант)</i><br><span class="expl">Нуклеоиды не обменивались геномами: в эксперименте каждая мтДНК оставалась в своих нуклеоидах, а восстановление синтеза обеспечили общие продукты.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200712101">Gilkerson R. W. et al. 2008. Mitochondrial nucleoids maintain genetic autonomy but allow for functional complementation. J Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M503062200">Chen H., Chomyn A., Chan D. C. 2005. Disruption of fusion results in mitochondrial heterogeneity and dysfunction. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/sj.emboj.7601963">Twig G. et al. 2008. Fission and selective fusion govern mitochondrial segregation and elimination by autophagy. EMBO J</a></li><li><a href="https://doi.org/10.1038/ncb1907">Ishihara N. et al. 2009. Mitochondrial fission factor Drp1 is essential for embryonic development and synapse formation in mice. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1038/nrg3966">Stewart J. B., Chinnery P. F. 2015. The dynamics of mitochondrial DNA heteroplasmy: implications for human health and disease. Nat Rev Genet</a></li><li><a href="https://doi.org/10.1083/jcb.200903065">Wakabayashi J. et al. 2009. The dynamin-related GTPase Drp1 is required for embryonic and brain development in mice. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.201605093">Yamashita S. et al. 2016. Mitochondrial division occurs concurrently with autophagosome formation but independently of Drp1 during mitophagy. J Cell Biol</a></li></ul><p>Комплементация без обмена мтДНК — гибриды клеток человека с двумя мтДНК с непересекающимися делециями (Gilkerson 2008). Потеря потенциала и снижение дыхания в клетках без слияния — эмбриональные фибробласты мыши Mfn1⁻/⁻ Mfn2⁻/⁻ (Chen 2005). Неравные дочерние органеллы и удаление аутофагией — β-клетки (линия INS1 и первичные β-клетки мыши; Twig 2008). Распределение митохондрий в отростках — нейроны мыши без DRP1 в культуре (Ishihara 2009). Деление клеток Drp1⁻/⁻ — эмбриональные фибробласты мыши (Wakabayashi 2009); митофагия без DRP1 — клетки HeLa и дрожжи (Yamashita 2016). Схема без чисел.</p></details></article><article class="card print-unit" id="ns-other-organelles"><div class="eyebrow">Слияние и деление · шаг 12 из 30</div><h2>Можно ли переносить схему митохондрий на другие органеллы</h2><p class="lead">У каждой органеллы своя пара процессов и свои машины; общая ГТФаза деления не означает общей логики. Пероксисомы делятся той же DRP1, но слияния зрелых пероксисом не показано; ЭПР — единая сеть; эндосомы и лизосомы сливаются при участии SNARE и Rab.</p><ol class="mech"><li><a href="#ns-g-S2-T46">Пероксисомы</a> делятся с DRP1, MFF и FIS1 после удлинения белками PEX11; слияния зрелых пероксисом между собой у млекопитающих не показано.</li><li>Трубочки ЭПР сливают <a href="#ns-g-S2-T47">атластины</a>, и ЭПР остаётся единой сетью; разделения на отдельные органеллы у него нет.</li><li>Эндосомы и лизосомы сливаются при участии <a href="#ns-g-S2-T48">SNARE, Rab и комплексов-привязок</a>; их «деление» — отделение трубчатых переносчиков груза и восстановление лизосом.</li></ol><p>Слияние и деление встречаются у многих органелл, но схема митохондрий переносится на них только частично. Пероксисомы делятся с помощью той же DRP1 и части тех же рецепторов — MFF и FIS1; MiD49 и MiD51 остаются митохондриальными. Перед делением белки PEX11 вытягивают пероксисому (Koch 2003, 2010). Слияния зрелых пероксисом между собой у млекопитающих не показано: описаны лишь кратковременные контакты без обмена матриксом (Bonekamp 2012); слияние пре-пероксисомных пузырьков при образовании новых пероксисом — отдельный процесс (Sugiura 2017). Поэтому число пероксисом определяется делением и образованием новых органелл, а не балансом двух процессов.</p><p>Эндоплазматический ретикулум — противоположный случай: это одна непрерывная сеть, и регулируется не число органелл, а соотношение трубочек и цистерн и число соединений. Трубочки сливают ГТФазы атластины; при их недостатке трубочки перестают соединяться в сеть (Hu 2009). Эндосомы и лизосомы сливаются и друг с другом, и с автофагосомами при участии белков SNARE; скорость и выбор партнёра задают малые ГТФазы Rab, комплексы-привязки и белки SM (Jahn 2024). «Деление» эндосомы — отделение трубчатых переносчиков груза, то есть сортировка, а лизосомы после слияния с автофагосомами восстанавливаются из автолизосом при активном mTORC1 (Yu 2010).</p><p>Аппарат Гольджи и ядерная оболочка разбираются и собираются заново по фазам клеточного цикла: здесь слияние и деление — этапы программы деления клетки, а не стационарный баланс. Вывод для интерпретации: эффект на митохондрии нельзя без проверки переносить на другие органеллы, а вмешательство в общую машину (например, в DRP1) меняет сразу несколько органелл.</p><p>Переключите таблицы: в первой — машины и наличие обоих процессов, во второй — что из схемы митохондрий переносится, а что нет.</p><div class="note trap"><strong>Типичная ошибка</strong> Раз DRP1 делит и митохондрии, и пероксисомы, у пероксисом тоже есть баланс слияния и деления.<p class="trap-fix">Общая ГТФаза деления не означает общей логики: слияния зрелых пероксисом у млекопитающих не показано, и их число задают деление и образование новых пероксисом.</p></div><div class="static-quiz"><h3>Слияния зрелых пероксисом между собой у млекопитающих не показано. Чем тогда определяется число пероксисом в клетке?</h3><ol><li><b>А.</b> Балансом слияния и деления, как у митохондрий <i>(неверный вариант)</i><br><span class="expl">Для баланса нужны оба процесса, а слияния зрелых пероксисом не показано. Схему митохондрий здесь переносить нельзя.</span></li><li><b>Б.</b> Только числом молекул DRP1 в цитозоле <i>(неверный вариант)</i><br><span class="expl">DRP1 участвует в делении пероксисом, но число органелл задаёт не один белок: важны и PEX11, и рецепторы, и образование новых пероксисом.</span></li><li><b>В.</b> Делением и образованием новых пероксисом <i>(верный вариант)</i><br><span class="expl">Без слияния число пероксисом определяется делением (PEX11, DRP1, MFF, FIS1) и образованием новых органелл; слияния зрелых пероксисом, парного их делению, не показано.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1111/j.1600-0854.2012.01356.x">Bonekamp N. A. et al. 2012. Transient complex interactions of mammalian peroxisomes without exchange of matrix or membrane marker proteins. Traffic</a></li><li><a href="https://doi.org/10.1038/nature21375">Sugiura A. et al. 2017. Newly born peroxisomes are a hybrid of mitochondrial and ER-derived pre-peroxisomes. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.M211761200">Koch A. et al. 2003. Dynamin-like protein 1 is involved in peroxisomal fission. J Biol Chem</a></li><li><a href="https://doi.org/10.1242/jcs.064907">Koch J. et al. 2010. PEX11 family members are membrane elongation factors that coordinate peroxisome proliferation and maintenance. J Cell Sci</a></li><li><a href="https://doi.org/10.1083/jcb.200903065">Wakabayashi J. et al. 2009. The dynamin-related GTPase Drp1 is required for embryonic and brain development in mice. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2009.05.025">Hu J. et al. 2009. A class of dynamin-like GTPases involved in the generation of the tubular ER network. Cell</a></li><li><a href="https://doi.org/10.1038/s41580-023-00668-x">Jahn R., Cafiso D. C., Tamm L. K. 2024. Mechanisms of SNARE proteins in membrane fusion. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nature09076">Yu L. et al. 2010. Termination of autophagy and reformation of lysosomes regulated by mTOR. Nature</a></li></ul><p>Сводка данных обзоров и первичных работ: пероксисомы — Koch 2003 (клетки HepG2, доминантно-негативная DRP1 и РНК-интерференция), Koch 2010 (PEX11), Wakabayashi 2009 (удлинённые пероксисомы в фибробластах Drp1⁻/⁻); ЭПР — Hu 2009; слияние в эндосомном пути — обзор Jahn 2024; слияние пероксисом — Bonekamp 2012 (клетки COS-7 и CHO, гибриды клеток), пре-пероксисомы — Sugiura 2017 (фибробласты больных без пероксисом); восстановление лизосом — Yu 2010 (клетки почки крысы). Таблица качественная, без чисел.</p></details></article><article class="card print-unit" id="ns-phenotypes"><div class="eyebrow">Слияние и деление · шаг 13 из 30</div><h2>Почему мутации машин слияния и деления поражают прежде всего длинные аксоны</h2><p class="lead">Мутации в генах машин слияния и деления вызывают наследственные болезни; это прямой довод, что машины нужны тканям человека. Белки есть почти во всех клетках, а поражаются прежде всего нейроны с длинными отростками.</p><ol class="mech"><li>Мутации OPA1 вызывают доминантную оптическую атрофию, мутации MFN2 — нейропатию Шарко — Мари — Тута типа 2A.</li><li>Доминантно-негативная мутация DNM1L нарушает деление и митохондрий, и пероксисом; мутации ATL1 (слияние трубочек ЭПР) вызывают спастическую параплегию.</li><li>Генетическая связь показывает, что ген необходим ткани, но не указывает, какое звено механизма — слияние, транспорт или строение крист — нарушено.</li></ol><p>Наследственные болезни показывают, что машины слияния и деления нужны тканям человека. Мутации OPA1 вызывают доминантную оптическую атрофию — избирательную гибель ганглиозных клеток сетчатки, аксоны которых образуют зрительный нерв (Delettre 2000). Мутации MFN2 вызывают наследственную нейропатию Шарко — Мари — Тута типа 2A с преимущественным поражением самых длинных периферических аксонов (Züchner 2004). У новорождённой девочки с доминантно-негативной мутацией в гене DNM1L, кодирующем DRP1, было нарушено деление сразу и митохондрий, и пероксисом; заболевание было тяжёлым и смертельным (Waterham 2007). Мутации ATL1, кодирующего атластин-1, вызывают наследственную спастическую параплегию с поражением длинных двигательных аксонов (Zhao 2001).</p><p>Обратите внимание на закономерность: эти белки синтезируются почти во всех клетках, а поражение избирательно. Страдают прежде всего нейроны с самыми длинными отростками и клетки, сильнее других зависящие от окислительного фосфорилирования. Возможное объяснение: именно в этих клетках выше требования к транспорту органелл и к поддержанию сети — митохондрии нужно доставить и сохранить работоспособными на расстоянии до метра от тела клетки.</p><p>Генетическая связь — сильный, но ограниченный довод. Она показывает, что ген необходим данной ткани в живом организме, но не указывает, какое звено механизма нарушено: слияние, транспорт органелл или строение крист. Каждое промежуточное звено требует отдельного измерения в клетках больных или в модели.</p><p>Переключайте таблицы: в первой — гены и болезни с источниками, во второй — что генетическая связь доказывает и чего не доказывает.</p><div class="note trap"><strong>Типичная ошибка</strong> Раз белки синтезируются почти во всех клетках, их мутации должны одинаково поражать все ткани.<p class="trap-fix">Поражение избирательно: сильнее страдают клетки, где нагрузка на механизм выше, — нейроны с самыми длинными отростками и клетки, зависящие от окислительного фосфорилирования.</p></div><div class="static-quiz"><h3>У ребёнка с мутацией DNM1L удлинены и митохондрии, и пероксисомы. Что этот случай говорит о машинах деления двух органелл?</h3><ol><li><b>А.</b> У органелл общая ГТФаза деления — DRP1 <i>(верный вариант)</i><br><span class="expl">DNM1L кодирует DRP1, и мутация этого гена нарушила деление обеих органелл сразу: деление митохондрий и пероксисом выполняет одна ГТФаза (Waterham 2007).</span></li><li><b>Б.</b> Пероксисомы и митохондрии сливаются одинаково <i>(неверный вариант)</i><br><span class="expl">Случай касается деления, а не слияния. Слияния пероксисом в клетках млекопитающих не описано.</span></li><li><b>В.</b> Пероксисомы образуются делением митохондрий <i>(неверный вариант)</i><br><span class="expl">Пероксисомы — отдельные органеллы со своими белками деления (PEX11); с митохондриями у них общая ГТФаза деления DRP1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/79936">Delettre C. et al. 2000. Nuclear gene OPA1, encoding a mitochondrial dynamin-related protein, is mutated in dominant optic atrophy. Nat Genet</a></li><li><a href="https://doi.org/10.1038/ng1341">Züchner S. et al. 2004. Mutations in the mitochondrial GTPase mitofusin 2 cause Charcot-Marie-Tooth neuropathy type 2A. Nat Genet</a></li><li><a href="https://doi.org/10.1056/NEJMoa064436">Waterham H. R. et al. 2007. A lethal defect of mitochondrial and peroxisomal fission. N Engl J Med</a></li><li><a href="https://doi.org/10.1038/ng758">Zhao X. et al. 2001. Mutations in a newly identified GTPase gene cause autosomal dominant hereditary spastic paraplegia. Nat Genet</a></li><li><a href="https://doi.org/10.1146/annurev-pathmechdis-012419-032711">Chan D. C. 2020. Mitochondrial dynamics and its involvement in disease. Annu Rev Pathol</a></li></ul><p>Генетические работы: Delettre 2000 (семьи с доминантной оптической атрофией), Züchner 2004 (семьи с CMT2A), Waterham 2007 (один ребёнок, фибробласты кожи), Zhao 2001 (семьи с SPG3A). Связь избирательности с длиной аксонов — гипотеза, а не установленный для каждой болезни механизм. Таблица без чисел.</p></details></article><article class="card print-unit" id="ns-which-machine"><div class="eyebrow">Слияние и деление · шаг 14 из 30</div><h2>Как узнать,
