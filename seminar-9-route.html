 флуоресценции означает полное исчезновение Δψm.","correct":false,"feedback":"Падение сигнала не означает автоматически нулевой потенциал. Требуются соответствующие контроли и режим измерения.","id":"S9-L14-1"},{"text":"Достаточно: интенсивность TMRM прямо равна числу импортированных молекул.","correct":false,"feedback":"TMRM отражает распределение потенциалчувствительного зонда и не измеряет число молекул импортированного белка.","id":"S9-L14-3"}]},"widget":{"kind":"assay","title":"","s":{"title":"Два разных эксперимента: сигнал зонда и защита импортированного белка","status":"Учебная модель · качественные уровни","exp_label":"Эксперимент","exps":["Зонд TMRM в клетке","Импорт меченого предшественника"],"mode_label":"Режим зонда","modes":["Без гашения (низкая концентрация)","С гашением (высокая концентрация)"],"cond_label":"Условие","conds":["Исходно","Частичная деполяризация","Меньше митохондрий","FCCP (контроль)"],"cell":"клетка","mito":"митохондрии","medium":"среда","pm":"плазматическая мембрана","m_mito":"Суммарный сигнал митохондрий","m_cyt":"Сигнал в цитозоле","m_psi":"|Δψm|","levels":["нет","низкий","средний","высокий"],"notes":{"n0":"Исходно зонд накапливается в отрицательно заряженном матриксе; митохондрии яркие.","n1":"При частичной деполяризации в режиме без гашения сигнал митохондрий снижается: зонд частично выходит в цитозоль.","n2":"Потенциал прежний, и каждая митохондрия светится так же ярко, но митохондрий меньше: суммарный сигнал снижается. По одной суммарной интенсивности это не отличить от деполяризации.","n3":"FCCP полностью деполяризует митохондрии: сигнал минимален. Это нижний контроль измерения.","q1":"В режиме гашения при частичной деполяризации зонд выходит из матрикса, гашение ослабевает, и суммарный сигнал может временно возрасти: связь сигнала с потенциалом здесь иная."},"lanes_title":"Радиоавтограф: меченый белок после инкубации","lanes":["1","2","3","4","5"],"lane_long":["1 — предшественник без митохондрий (метка размера)","2 — импорт, Δψm сохранён, затем протеиназа K","3 — Δψm снят разобщителем до импорта, затем протеиназа K","4 — как 2, но мембраны растворены детергентом","5 — Δψm сохранён, ATP в матриксе истощён, затем протеиназа K"],"band_p":"p — предшественник","band_m":"m — зрелый белок","note_imp":"Защищённый от протеазы зрелый белок (дорожка 2) означает завершённый импорт. Его нет без потенциала (3), при разрушении мембран детергентом (4) и при истощении ATP в матриксе (5).","fixed":"Яркость и толщина полос — условные уровни для объяснения логики эксперимента."}}},{"id":"calcium-contacts","number":15,"section":2,"title":"Почему локальный сигнал Ca²⁺ отличается от среднего цитозольного","question":3,"questions":[3],"keywords":["контакт ЭПР и митохондрии","MAM","микрообласть Ca²⁺","IP₃R","VDAC","GRP75","MFN2","локальная концентрация","средняя концентрация","расстояние между мембранами"],"lead":["Ca²⁺, выходящий из ЭПР через [[T42|IP₃R]], создаёт около открытого канала [[T41|локальную микрообласть]] высокой концентрации. Митохондрия, расположенная в [[T39|контакте с ЭПР]], оказывается внутри этой микрообласти.","Поэтому вход Ca²⁺ в митохондрии определяется не средней концентрацией в цитозоле, а концентрацией у их поверхности."],"mechanism":["IP₃R открывается при связывании IP₃ и выпускает Ca²⁺ из просвета ЭПР; около канала концентрация Ca²⁺ на короткое время много выше средней по цитозолю.","В участках контакта мембраны ЭПР и наружная мембрана митохондрии сближены на десятки нанометров, но не сливаются; Ca²⁺ проходит наружную мембрану через [[T43|VDAC]], а внутреннюю — через MCU.","Митохондрия вблизи канала получает высокую локальную концентрацию Ca²⁺, а удалённая — низкую, даже если средний сигнал по клетке одинаков."],"paragraphs":["В покое свободная [Ca²⁺] в цитозоле составляет порядка 0,1 мкМ, а в просвете ЭПР — сотни микромолей. Когда гормон или медиатор вызывает образование IP₃, рецепторы IP₃R мембраны ЭПР открываются, и Ca²⁺ выходит в цитозоль. Ион быстро связывается белками-буферами и закачивается обратно в ЭПР Ca²⁺-ATPазой [[T47|SERCA]], поэтому около открытого канала возникает небольшая область высокой концентрации, которая с расстоянием быстро убывает.","Многие митохондрии расположены вплотную к ЭПР. В участках контакта мембраны двух органелл сближены на расстояние порядка 10–50 нм и связаны белками; при этом каждая органелла сохраняет свою мембрану. У наружной мембраны митохондрии, находящейся ближе 50 нм к источнику Ca²⁺, концентрация Ca²⁺ может в десятки раз превышать среднюю по цитозолю (Cartes-Saavedra 2025). Классические эксперименты с адресованными зондами показали, что митохондрии, близкие к ЭПР, накапливают Ca²⁺ быстрее и сильнее (Rizzuto 1998).","Через наружную мембрану Ca²⁺ проходит по каналам VDAC, а через внутреннюю — по каналу MCU. Белки, участвующие в связи органелл, включают комплекс IP₃R–GRP75–VDAC и митофузин 2, но это не сплошной «туннель» для Ca²⁺: ион проходит через цитозольный зазор и два разных канала. Роль митофузина 2 спорна: в одних моделях его удаление уменьшало число контактов, в других — увеличивало (Lim 2021).","Участки ЭПР, прилегающие к митохондриям, называют [[T40|MAM]] — митохондрия-ассоциированными мембранами. Это не отдельная органелла, а часть ЭПР. Расстояние между мембранами само по себе не измеряет поток Ca²⁺ — это обсуждается в шаге о методах.","Состав контакта зависит от типа клеток. В сердечной мышце Ca²⁺ к митохондриям поступает и через [[T71|рианодиновые рецепторы]] RyR2 саркоплазматического ретикулума: небольшая часть саркоплазматического ретикулума остаётся связанной с изолированными митохондриями сердца крысы и передаёт им Ca²⁺ локально (García-Pérez 2008). В MAM сосредоточен шаперон ЭПР [[T72|SIGMAR1]]: при снижении [Ca²⁺] в ЭПР он отделяется от шаперона BiP, стабилизирует IP₃R3 и тем самым продлевает поступление Ca²⁺ в митохондрии (Hayashi 2007, клетки CHO). Положение митохондрий тоже регулируется: кинезин перемещает их по микротрубочкам, связываясь с белком наружной мембраны [[T73|Miro]] через адаптер Milton; связывание Ca²⁺ с Miro останавливает движение митохондрий (Wang 2009, нейроны гиппокампа крысы)."],"trap":["Средняя [Ca²⁺] в цитозоле полностью задаёт концентрацию у MCU.","Концентрация Ca²⁺ в цитозоле неоднородна: около открытого IP₃R она много выше средней. Митохондрия в контакте с ЭПР получает высокую локальную концентрацию, удалённая — низкую, даже при одинаковом среднем сигнале."],"conditions":"Учебная модель: профиль концентрации качественный, числа на оси условные. Сравнивается разное расстояние при одинаковом высвобождении, буферировании, состоянии MCU и Δψm. Порядок величин (до ≈ 10 мкМ в пределах 50 нм от источника при среднем сигнале ≈ 0,1–1 мкМ) — Cartes-Saavedra 2025; связь близости к ЭПР с накоплением Ca²⁺ — клетки HeLa с адресованным экворином и цифровой микроскопией (Rizzuto 1998); противоречивые данные о митофузине 2 — Lim 2021; RyR2 и митохондрии — изолированные митохондрии сердца крысы (García-Pérez 2008); SIGMAR1 — клетки CHO (Hayashi 2007); Miro, Milton и кинезин — нейроны гиппокампа крысы (Wang 2009).","sources":["Lim2021","CartesSaavedra2025","Rizzuto1998","GarciaPerez2008","Hayashi2007","Wang2009"],"quiz":{"id":"S9-L15","rev":1,"question":"В двух клетках средний цитозольный сигнал Ca²⁺ одинаков. Может ли поступление Ca²⁺ в митохондрии различаться из-за организации контактов с ЭПР?","options":[{"text":"Не может: средняя [Ca²⁺] одинакова во всех точках цитозоля.","correct":false,"feedback":"Среднее по клетке не означает пространственной однородности концентрации.","id":"S9-L15-1"},{"text":"Может: локальная [Ca²⁺] у митохондриальной поверхности может различаться.","correct":true,"feedback":"Одинаковое пространственное среднее не исключает разных локальных микрообластей Ca²⁺. Их положение относительно митохондрии влияет на поступление иона.","id":"S9-L15-3"},{"text":"Не может: в контакте мембраны сливаются и Ca²⁺ проходит без каналов.","correct":false,"feedback":"Контакт сохраняет самостоятельность мембран. Для пути Ca²⁺ важны мембранные каналы и локальная диффузия.","id":"S9-L15-2"}]},"widget":{"kind":"micro","title":"","s":{"title":"Концентрация Ca²⁺ убывает с расстоянием от открытого IP₃R","status":"Учебная модель · качественный профиль","pos_label":"Положение митохондрии","pos":["В контакте с ЭПР (≈ 20 нм)","Далеко от ЭПР (≈ 300 нм)"],"er":"ЭПР","lumen":"просвет ЭПР","cyt":"цитозоль","omm":"наружная мембрана","imm":"внутренняя мембрана","mat":"матрикс","ip3r":"IP₃R","vdac":"VDAC","mcu":"MCU","ax_x":"расстояние от IP₃R →","ax_y":"[Ca²⁺], усл. ед.","avg":"средняя [Ca²⁺] в цитозоле","m_local":"Локальная [Ca²⁺] у наружной мембраны","m_avg":"Средняя [Ca²⁺] в цитозоле","m_in":"Вход Ca²⁺ в матрикс","lv":["низкая","высокая","одинаковая","быстрый","медленный"],"notes":["Митохондрия в контакте с ЭПР находится внутри микрообласти: концентрация Ca²⁺ у её наружной мембраны высокая, и вход через MCU быстрый.","Удалённая митохондрия находится там, где концентрация Ca²⁺ ниже средней по цитозолю: среднее включает и микрообласти. При том же высвобождении и той же средней концентрации вход Ca²⁺ медленнее."],"fixed":"Высвобождение Ca²⁺, буферирование, MCU и Δψm одинаковы в обоих случаях; меняется только расстояние."}}},{"id":"calcium-uniplex","number":16,"section":2,"title":"Как MCU и его регуляторы ограничивают поступление Ca²⁺","question":3,"questions":[3],"keywords":["унипортер","MCU","EMRE","MICU1","MICU2","привратник","регуляция входа Ca²⁺","кооперативность","нокаут MCU"],"lead":["Митохондриальный Ca²⁺-унипортер — комплекс нескольких белков. MCU образует пору, EMRE связывает пору с регуляторными субъединицами, а [[T45|MICU1 и MICU2]] со стороны межмембранного пространства контролируют её открывание.","При низкой концентрации Ca²⁺ MICU-белки удерживают пору закрытой, а при повышенной — связывают Ca²⁺ и пропускают ион."],"mechanism":["Четыре субъединицы MCU образуют избирательную для Ca²⁺ пору во внутренней мембране; EMRE необходим для работы поры у млекопитающих и связывает её с MICU1.","MICU1 в паре с MICU2 (или MICU3) содержит Ca²⁺-связывающие EF-мотивы: при низкой [Ca²⁺] димер ограничивает проводимость поры, при повышенной — связывает Ca²⁺ и снимает ограничение.","Без MCU быстрый вход Ca²⁺ в матрикс почти исчезает; без MICU1 пора открыта и при низкой [Ca²⁺], а результат зависит от ткани и компенсаторных изменений."],"paragraphs":["Унипортер состоит из порообразующего белка MCU и регуляторных субъединиц. Четыре субъединицы MCU образуют в мембране канал с высокой избирательностью для Ca²⁺. Небольшой белок EMRE пронизывает мембрану рядом с порой: у млекопитающих без него пора не работает, и он же закрепляет на комплексе регуляторную субъединицу MICU1.","MICU1 расположен со стороны межмембранного пространства и образует димер с MICU2 или MICU3. Эти белки содержат EF-мотивы, связывающие Ca²⁺. При низкой концентрации Ca²⁺ димер MICU ограничивает прохождение ионов через пору. Когда концентрация у поверхности митохондрии повышается (по оценкам, выше ≈ 0,4–0,6 мкМ), EF-мотивы связывают Ca²⁺, и пора открывается. Поэтому зависимость входа от концентрации крутая: при покое ион почти не входит, а в микрообласти около IP₃R вход резко ускоряется (Cartes-Saavedra 2025).","Удаление MCU в клетках и тканях мыши почти устраняет быстрый вход Ca²⁺ в митохондрии, хотя медленное накопление Ca²⁺ другими путями может сохраняться. Удаление MICU1 даёт иной результат: пора перестаёт закрываться при низкой концентрации, и Ca²⁺ входит в матрикс уже в покое. У мышей без MICU1 при этом наблюдали компенсаторное снижение содержания MCU и EMRE, поэтому итог зависит от ткани и длительности изменения.","MCU и MICU1 — не два названия одного канала, а разные белки одного комплекса: пора и её регулятор."],"trap":["MCU и MICU1 — два названия одного и того же канала.","MCU — порообразующая субъединица во внутренней мембране, MICU1 — Ca²⁺-связывающий регулятор со стороны межмембранного пространства. Без MCU пора отсутствует, без MICU1 пора есть, но теряет закрывание при низкой концентрации Ca²⁺."],"conditions":"Схема механизма; состояния качественные. Сравниваются ранние MCU-зависимые ответы при сопоставимом цитозольном импульсе и сохранном Δψm; компенсаторные перестройки не моделируются. Состав комплекса и порог открывания MICU1–MICU2 (≈ 0,4–0,6 мкМ) — Cartes-Saavedra 2025; идентификация MCU — Baughman 2011, De Stefani 2011; MCU как канал — Kirichok 2004.","sources":["Baughman2011","DeStefani2011","Kirichok2004","CartesSaavedra2025"],"quiz":{"id":"S9-L16","rev":1,"question":"При одинаковом цитозольном импульсе Ca²⁺ и сохранном Δψm из модели удалён MCU. Как изменится быстрый вход Ca²⁺ в матрикс по сравнению с исходной моделью?","options":[{"text":"Он возрастёт, поскольку MICU1 самостоятельно заменит проводящий канал.","correct":false,"feedback":"Регуляторный белок MICU1 не заменяет отсутствующий порообразующий MCU.","id":"S9-L16-2"},{"text":"Он уменьшится, поскольку отсутствует основной проводящий компонент комплекса.","correct":true,"feedback":"MCU образует проводящий путь комплекса. Это не означает, что любой остаточный Ca²⁺ в матриксе обязан исчезнуть.","id":"S9-L16-1"},{"text":"Он сохранится, поскольку MCU переносит только H⁺, а не Ca²⁺.","correct":false,"feedback":"MCU проводит Ca²⁺. Перенос H⁺ дыхательной цепью и вход Ca²⁺ — разные процессы.","id":"S9-L16-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Пора и её регулятор в одном комплексе","status":"Схема механизма · качественные состояния","ctrls":[{"id":"m","type":"group","label":"MCU","opts":["Есть","Удалён"]},{"id":"c","type":"group","label":"Локальный Ca²⁺","opts":["Низкий (покой)","Повышенный (микрообласть)"]}],"W":560,"H":340,"NW":560,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":152,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":188,"w":548,"h":146,"c":"mito","t":"матрикс","lx":14,"ly":328}],"mem":[{"x1":6,"y1":170,"x2":554,"y2":170}],"nodes":{"mcu":{"p":[230,170,104,56],"t":"MCU\nпора","n":[230,170,104,56],"fs":17},"emre":{"p":[350,170,84,44],"t":"EMRE","n":[350,170,84,44],"fs":16},"micu":{"p":[250,80,170,38],"t":"MICU1/MICU2","n":[250,80,170,38],"fs":16},"ca":{"p":[460,66,150,34],"t":"Ca²⁺ локально","n":[460,66,150,34],"fs":16},"cam":{"p":[230,280,170,34],"t":"Ca²⁺ в матрикс","n":[230,280,170,34],"fs":16}},"edges":{"in":{"a":[150,70],"b":[150,268],"k":"tr","t":"Ca²⁺","d":[-12,0],"anc":"end"},"gate":{"a":"micu","b":"mcu","k":"inh","t":"удерживает\nзакрытой","d":[-74,0]},"act":{"a":"ca","b":"micu","k":"bind","t":"связывание\nCa²⁺","d":[0,-16]},"flow":{"a":"mcu","b":"cam","k":"tr"}},"st":{"0-0":{"n":{"mcu":"base","emre":"base","micu":"on","ca":"off","cam":"off"},"e":{"in":"off","flow":"off","act":"off"},"m":[["Состояние поры","ограничена MICU"],["Быстрый вход Ca²⁺","почти нет"]],"note":"В покое Ca²⁺ не связан с EF-мотивами MICU-белков, и димер MICU ограничивает прохождение ионов через пору."},"0-1":{"n":{"mcu":"on","emre":"on","micu":"base","ca":"on","cam":"on"},"e":{"gate":"off"},"m":[["Состояние поры","открыта"],["Быстрый вход Ca²⁺","есть"]],"note":"Повышенная локальная концентрация: MICU-белки связывают Ca²⁺, ограничение снимается, и Ca²⁺ входит в матрикс по электрохимическому градиенту."},"1-0":{"n":{"mcu":"abs","emre":"base","micu":"base","ca":"off","cam":"off"},"e":{"in":"off","flow":"off","gate":"off","act":"off"},"m":[["Состояние поры","поры нет"],["Быстрый вход Ca²⁺","нет"]],"note":"Без MCU поры нет; в покое это почти не заметно, потому что и в норме вход мал."},"1-1":{"n":{"mcu":"abs","emre":"base","micu":"base","ca":"on","cam":"off"},"e":{"in":"off","flow":"off","gate":"off"},"m":[["Состояние поры","поры нет"],["Быстрый вход Ca²⁺","резко снижен"]],"note":"Локальная концентрация высокая, но проводящего белка нет: быстрый вход почти исчезает. Медленное накопление Ca²⁺ другими путями может сохраняться."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"calcium-metabolism","number":17,"section":2,"title":"Как Ca²⁺ связывает клеточную активность с образованием NADH","question":3,"questions":[3],"keywords":["PDP1","пируватдегидрогеназа","PDH","PDK","IDH3","изоцитратдегидрогеназа","оксоглутаратдегидрогеназа","OGDH","дефосфорилирование","NADH","согласование метаболизма"],"lead":["Ca²⁺ в матриксе активирует три дегидрогеназы, образующие NADH: пируватдегидрогеназный комплекс, NAD-зависимую изоцитратдегидрогеназу (IDH3) и оксоглутаратдегидрогеназу (OGDH).","Механизмы разные: пируватдегидрогеназа активируется через дефосфорилирование фосфатазой [[T48|PDP1]], а две другие дегидрогеназы — прямым связыванием Ca²⁺."],"mechanism":["Киназа PDK фосфорилирует субъединицу E1 пируватдегидрогеназного комплекса и ингибирует его; Ca²⁺ активирует фосфатазу PDP1, которая снимает это ингибирующее фосфорилирование.","IDH3 и OGDH активируются Ca²⁺ без фосфорилирования: связывание иона повышает их сродство к субстратам. Половина максимальной активации OGDH достигается при [Ca²⁺] около 1 мкМ, IDH3 — при более высокой концентрации.","Образуется больше NADH, дыхательная цепь получает больше электронов, и при доступных субстратах, O₂ и ADP синтез ATP может ускориться вслед за потребностью."],"paragraphs":["Многие сигналы, повышающие [Ca²⁺] в цитозоле, одновременно увеличивают расход ATP: Ca²⁺ запускает сокращение мышечного волокна, секрецию, работу насосов. Ca²⁺, вошедший в матрикс, позволяет митохондриям ускорить образование NADH одновременно с ростом потребности, а не только после того, как ADP начнёт накапливаться.","Пируватдегидрогеназный комплекс (PDH) превращает пируват в ацетил-CoA и образует NADH. Его активность регулируется фосфорилированием: киназы PDK фосфорилируют субъединицу E1 и ингибируют комплекс, а фосфатазы PDP снимают фосфатные группы. Из двух фосфатаз чувствительна к Ca²⁺ только PDP1: Ca²⁺ способствует её связыванию с комплексом, и доля дефосфорилированного, активного PDH растёт (Denton 2009).","NAD-зависимая изоцитратдегидрогеназа цикла трикарбоновых кислот (IDH3) и оксоглутаратдегидрогеназный комплекс (OGDH) регулируются иначе. Ca²⁺ непосредственно связывается с ними и повышает их сродство к субстратам; фосфорилирование здесь не участвует. Чувствительность ферментов к Ca²⁺ разная: в митохондриях сердца крысы половина максимальной активации OGDH достигалась при [Ca²⁺] около 1 мкМ, а IDH3 — при 5–43 мкМ, причём в присутствии ATP требовалась в 3–10 раз более высокая концентрация, чем в присутствии ADP (Rutter 1988; Denton 2009). Ещё одна Ca²⁺-чувствительная дегидрогеназа, FAD-зависимая глицерол-3-фосфатдегидрогеназа, расположена на наружной поверхности внутренней мембраны и отвечает на цитозольный Ca²⁺.","Итог — больше NADH и больше электронов для дыхательной цепи. Ca²⁺ сам не синтезирует ATP: ускорение синтеза возможно, только если дыхательная цепь и ATP-синтаза работают, а субстраты, O₂ и ADP доступны. Регуляция этих дегидрогеназ ионами Ca²⁺ описана у позвоночных (Denton 2009)."],"trap":["Ca²⁺ одинаково активирует все изоформы всех дегидрогеназ.","Пируватдегидрогеназа активируется через Ca²⁺-чувствительную фосфатазу PDP1 (PDP2 к Ca²⁺ нечувствительна), IDH3 и OGDH — прямым связыванием Ca²⁺. NADP-зависимые изоцитратдегидрогеназы и большинство других ферментов матрикса к Ca²⁺ нечувствительны."],"conditions":"Схема механизма; изменения качественные. Позвоночные, сохранные ферменты, доступный пируват; кратковременный умеренный импульс Ca²⁺ в матриксе; субстраты, O₂ и ADP доступны. Утверждение о PDP относится к Ca²⁺-чувствительной изоформе PDP1. K½ активации ионами Ca²⁺: OGDH — около 1 мкМ, IDH3 — 5–43 мкМ в зависимости от отношения ATP/ADP (митохондрии сердца крысы, сделанные проницаемыми толуолом, — Rutter 1988; обзор, в том числе очищенные ферменты, — Denton 2009). В обзорах для IDH3 приводят 5–50 мкМ (как в справке практикума). K½ активации не равна константе диссоциации Ca²⁺.","sources":["Denton2009","Rutter1988","CartesSaavedra2025","B_LNR2"],"quiz":{"id":"S9-L17","rev":1,"question":"В матриксе умеренно повысилась [Ca²⁺], активировалась PDP1; пируват доступен. Какое изменение пируватдегидрогеназного комплекса соответствует этому механизму?","options":[{"text":"Дефосфорилирование комплекса способствует увеличению его активности.","correct":true,"feedback":"PDP1 — фосфатаза. Она снимает ингибирующее фосфорилирование пируватдегидрогеназного комплекса.","id":"S9-L17-2"},{"text":"PDP1 повышает активность комплекса без изменения его фосфорилирования.","correct":false,"feedback":"В рассматриваемом механизме PDP1 действует как фосфатаза. Активация связана со снятием ингибирующего фосфорилирования.","id":"S9-L17-1"},{"text":"PDP1 фосфорилирует комплекс и тем самым повышает его активность.","correct":false,"feedback":"Вариант меняет направление модификации: фосфатаза катализирует дефосфорилирование.","id":"S9-L17-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Три дегидрогеназы матрикса отвечают на Ca²⁺ разными способами","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Ca²⁺ в матриксе","opts":["Исходный уровень","Умеренный кратковременный импульс"]}],"W":560,"H":340,"NW":560,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":330,"c":"mito","t":"матрикс","lx":548,"ly":326,"a":"end"}],"mem":[],"nodes":{"ca":{"p":[80,50,80,36],"t":"Ca²⁺","n":[80,50,80,36],"fs":18},"pdp":{"p":[230,50,90,36],"t":"PDP1","n":[230,50,90,36],"fs":17},"pdk":{"p":[450,50,80,36],"t":"PDK","n":[450,50,80,36],"fs":17},"pdh":{"p":[340,130,90,40],"t":"PDH","n":[340,130,90,40],"fs":18},"idh":{"p":[160,200,90,38],"t":"IDH3","n":[160,200,90,38],"fs":17},"ogdh":{"p":[300,220,90,38],"t":"OGDH","n":[300,220,90,38],"fs":17},"nadh":{"p":[440,230,84,36],"t":"NADH","n":[440,230,84,36],"fs":17},"etc":{"p":[440,306,170,44],"t":"дыхательная\nцепь → ATP","n":[440,306,170,44],"fs":15}},"edges":{"c1":{"a":"ca","b":"pdp","k":"act"},"p1":{"a":"pdp","b":"pdh","k":"act","t":"дефосфорилирует","d":[-70,0]},"k1":{"a":"pdk","b":"pdh","k":"inh","t":"фосфорилирует","d":[60,0]},"c2":{"a":"ca","b":"idh","k":"act","bend":-20},"c3":{"a":"ca","b":"ogdh","k":"act","bend":-30},"n1":{"a":"pdh","b":"nadh","k":"rx"},"n2":{"a":"idh","b":"nadh","k":"rx","bend":30},"n3":{"a":"ogdh","b":"nadh","k":"rx"},"n4":{"a":"nadh","b":"etc","k":"eq","t":"e⁻","d":[14,0],"anc":"start"}},"st":{"0":{"n":{"ca":"base","pdp":"base","pdk":"on","pdh":"low","idh":"base","ogdh":"base","nadh":"base","etc":"base"},"e":{"c1":"off","c2":"off","c3":"off","p1":"off"},"b":{"pdh":{"t":"P: ингибирован","at":"r"}},"m":[["PDH","частично фосфорилирован, активность ниже"],["IDH3 и OGDH","исходная активность"],["Образование NADH","исходное"]],"note":"При исходном уровне Ca²⁺ значительная часть PDH фосфорилирована киназой PDK и неактивна; IDH3 и OGDH работают с исходной скоростью."},"1":{"n":{"ca":"on","pdp":"on","pdk":"base","pdh":"on","idh":"on","ogdh":"on","nadh":"on","etc":"on"},"m":[["PDH","дефосфорилирован, активность выше"],["IDH3 и OGDH","активированы связыванием Ca²⁺"],["Образование NADH","увеличено"]],"note":"Ca²⁺ активирует PDP1, она снимает ингибирующее фосфорилирование PDH. IDH3 и OGDH связывают Ca²⁺ и работают быстрее. NADH образуется больше, и дыхательная цепь получает больше электронов."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"calcium-extrusion","number":18,"section":2,"title":"Как NCLX участвует в восстановлении матричного Ca²⁺","question":3,"questions":[3],"keywords":["NCLX","Na⁺/Ca²⁺-обменник","TMEM65","выход Ca²⁺","буферирование","свободная концентрация","общая концентрация","фосфат кальция","TMBIM5","CGP-37157"],"lead":["После импульса Ca²⁺ выводится из матрикса прежде всего Na⁺-зависимым путём, который классически связывают с обменником [[T46|NCLX]]. Вход через MCU быстрый, выход — медленнее, поэтому матричный сигнал продолжается дольше цитозольного.","Большая часть вошедшего Ca²⁺ связывается буферами матрикса, поэтому [[T49|свободная концентрация Ca²⁺]] и его общая концентрация — разные величины."],"mechanism":["При Na⁺-зависимом выходе Ca²⁺ покидает матрикс в обмен на Na⁺, который входит в матрикс; энергию даёт градиент Na⁺, поддерживаемый за счёт протондвижущей силы. В учебной модели этот путь назван NCLX; какой белок переносит ионы, в работах 2025–2026 гг. обсуждается.","Матричные буферы — прежде всего фосфат — связывают большую часть вошедшего Ca²⁺; свободная [Ca²⁺] поэтому много меньше общей концентрации Ca²⁺ в матриксе.","Когда вход прекращается, свободная [Ca²⁺] снижается со скоростью выхода; если этот выход ослаблен, спад замедляется."],"paragraphs":["Прекращение входа через MCU не удаляет из матрикса уже вошедший Ca²⁺. В митохондриях сердца и мозга его выводит в основном Na⁺-зависимый путь внутренней мембраны: Ca²⁺ выходит, а Na⁺ входит в матрикс. С 2010 г. этот обмен связывают с белком NCLX: при снижении его содержания в клетках Na⁺-зависимый выход Ca²⁺ уменьшался (Palty 2010). Градиент Na⁺ поддерживают Na⁺/H⁺-обменники, использующие градиент H⁺, поэтому выход Ca²⁺ в конечном счёте тоже зависит от протондвижущей силы. Описаны и другие пути выхода, например обменник TMBIM5, работающий без Na⁺ (Cartes-Saavedra 2025).","Скорость Na⁺-зависимого выхода меньше максимальной скорости входа через MCU. Поэтому при коротком импульсе Ca²⁺ в матриксе повышается быстро, а снижается медленнее: матричный сигнал продолжается дольше цитозольного. Если этот выход подавлен генетически или фармакологически, спад замедляется ещё больше. Для такого эксперимента применяют ингибитор CGP-37157, но он действует и на другие системы переноса Ca²⁺, а по новым данным связывается с белком TMEM65 (Zhang 2025). Поэтому ответ на CGP-37157 согласуется с участием CGP-чувствительного выхода Ca²⁺, но сам по себе не доказывает ни этого, ни роли именно NCLX.","Работы 2025–2026 гг. сделали молекулярную основу этого пути предметом спора. В нескольких линиях клеток человека без NCLX Na⁺-зависимый выход Ca²⁺, подавляемый CGP-37157, сохранялся (Fan 2025). О том, на какие ионы обменивает Ca²⁺ сам NCLX, данные расходятся: по одним экспериментам — на H⁺ (Fan 2025: ооциты шпорцевой лягушки и митохондрии клеток HeLa), по другим — на разные одновалентные катионы, в том числе Na⁺ (Zhang 2026: белок на плазматической мембране клеток HEK). Белок внутренней мембраны TMEM65 одни авторы считают необходимым регулятором NCLX (Garbincius 2025), другие — самостоятельным Na⁺/Ca²⁺-обменником (Zhang 2025; Vetralla 2026). Поэтому в этом семинаре «выход через NCLX» означает Na⁺-зависимый выход Ca²⁺ в классической интерпретации, а не окончательно установленный белок-переносчик; точная стехиометрия обмена тоже обсуждается.","В матриксе большая часть вошедшего Ca²⁺ связывается буферами, прежде всего фосфатом, а также ATP и другими анионами. Свободная [Ca²⁺] в матриксе в покое составляет порядка 0,1–0,2 мкМ. Общая концентрация, включающая свободный и связанный Ca²⁺ в расчёте на тот же объём матрикса, после сильной нагрузки может во много раз превышать свободную. Индикатор Ca²⁺ регистрирует свободные ионы, поэтому одинаковый сигнал индикатора не означает одинакового общего количества Ca²⁺ в матриксе."],"trap":["После закрытия MCU выход Ca²⁺ больше не нужен.","Закрытие MCU прекращает вход, но не удаляет уже вошедший Ca²⁺. Чтобы свободная [Ca²⁺] вернулась к исходной, ион должен выйти из матрикса, прежде всего Na⁺-зависимым путём; связанный буферами Ca²⁺ высвобождается и выводится постепенно."],"conditions":"Учебная модель: кривые рассчитаны по условным параметрам (одинаковый импульс входа, постоянная доля связанного Ca²⁺, насыщаемый выход); это не данные эксперимента. Сохранены Δψm и градиент Na⁺, вход и буферирование сопоставимы; объём матрикса постоянен, поэтому свободная и общая концентрации отнесены к одному объёму. Выход в модели — Na⁺-зависимый путь, классически приписываемый NCLX (Palty 2010). Сохранение этого выхода в линиях клеток без NCLX и обмен Ca²⁺ на H⁺ через NCLX — Fan 2025 (клетки HeLa, HEK293, HCT116; ооциты шпорцевой лягушки, где часть белка находилась на плазматической мембране); TMEM65 как необходимый регулятор NCLX — Garbincius 2025 (клетки и мыши); TMEM65 как Na⁺/Ca²⁺-обменник — Zhang 2025 (в том числе белок в липосомах) и Vetralla 2026; широкая катионная избирательность NCLX — белок на плазматической мембране клеток HEK (Zhang 2026), что ограничивает перенос вывода на митохондрии. Другие пути и буферирование фосфатом — Cartes-Saavedra 2025; обзор — Lim 2021.","sources":["Lim2021","Palty2010","CartesSaavedra2025","Fan2025","Garbincius2025","ZhangJL2025","Vetralla2026","ZhangL2026"],"quiz":{"id":"S9-L18","rev":1,"question":"После одинакового импульса вход Ca²⁺ прекратился; NCLX исходно выводит Ca²⁺ из матрикса. При сохранных Δψm, Na⁺-градиенте и буферировании активность NCLX снизили. Как может измениться спад свободной [Ca²⁺] в матриксе?","options":[{"text":"Спад может замедлиться из-за уменьшения одного из путей выхода Ca²⁺.","correct":true,"feedback":"При заданных сопоставимых условиях уменьшение выхода через NCLX способствует более длительному сохранению матричного сигнала. Конкретная кинетика зависит и от других путей и буферирования.","id":"S9-L18-3"},{"text":"Спад ускорится, поскольку NCLX в этих условиях переносит Ca²⁺ только внутрь.","correct":false,"feedback":"Здесь рассматривается обычное направление Na⁺-зависимого выхода Ca²⁺. Обратное направление требует иных условий.","id":"S9-L18-1"},{"text":"Сигнал сразу станет нулевым, поскольку закрытие MCU удаляет весь Ca²⁺.","correct":false,"feedback":"Прекращение входа не удаляет уже накопленный Ca²⁺; нужны выход и взаимодействие с буферами.","id":"S9-L18-2"}]},"widget":{"kind":"catime","title":"","s":{"mode":"extrusion","title":"Свободный Ca²⁺ матрикса после одинакового импульса входа","status":"Учебная модель · расчёт по условным параметрам","out_label":"Na⁺-зависимый выход (NCLX)","outs":["Сохранён","Снижен"],"q_label":"Показать","qs":["Свободная [Ca²⁺]","Общая концентрация Ca²⁺"],"ax_t":"время после начала импульса, усл. ед.","ax_free":"свободная [Ca²⁺], усл. ед.","ax_tot":"общая [Ca²⁺], усл. ед.","pulse":"вход через MCU","ref":"серый пунктир — выход сохранён (для сравнения)","m_peak":"Максимум","m_half":"Время спада наполовину","m_end":"В конце записи","unit_t":"усл. ед.","notes":["При сохранённом выходе свободная [Ca²⁺] возвращается к исходной после прекращения входа.","При сниженном Na⁺-зависимом выходе спад замедляется: после того же импульса матричный сигнал сохраняется дольше."],"note_tot":"Общая концентрация включает свободный и связанный буферами Ca²⁺ и может во много раз превышать свободную; обе величины здесь отнесены к одному постоянному объёму матрикса. Индикатор регистрирует свободные ионы.","fixed":"Модель: скорость выхода растёт со свободной [Ca²⁺] и достигает предела (насыщение обменника); связанный Ca²⁺ составляет постоянную долю общего; объём матрикса постоянен; параметры условные.","model":{"A":1.2,"t0":2,"D":4,"beta":20,"V":[0.9,0.35],"K":0.5,"T":40}}}},{"id":"calcium-overload","number":19,"section":2,"title":"Когда кальциевый сигнал становится перегрузкой","question":3,"questions":[3],"keywords":["кальциевая перегрузка","длительное повышение Ca²⁺","фосфат","окислительный стресс","переход проницаемости","риск","баланс входа и выхода"],"lead":["Краткий импульс Ca²⁺ ускоряет образование NADH и затем выводится. Длительное или чрезмерное поступление Ca²⁺ ведёт к его накоплению в матриксе — [[T50|кальциевой перегрузке]].","Общее количество Ca²⁺ в матриксе растёт, когда вход превышает выход; буферы ограничивают рост свободной концентрации, но не выводят Ca²⁺ из матрикса. Чрезмерное накопление повышает вероятность перехода проницаемости внутренней мембраны, но единого порога гибели нет."],"mechanism":["При длительном входе общее количество Ca²⁺ в матриксе растёт, потому что Na⁺-зависимый выход медленнее входа через MCU.","Накопленный Ca²⁺ вместе с фосфатом и окислительным стрессом способствует переходу проницаемости внутренней мембраны; этому противодействуют сохранный потенциал и восстановленное состояние матрикса.","Вход каждого Ca²⁺ расходует электрическую составляющую градиента; при перегрузке митохондрия хуже поддерживает Δψm и синтез ATP."],"paragraphs":["Последствия одного и того же иона зависят от дозы и длительности. Краткий умеренный импульс повышает свободную [Ca²⁺] в матриксе до микромолярного диапазона, активирует дегидрогеназы и затем выводится из матрикса. При длительном или очень сильном поступлении — например, при постоянном высвобождении Ca²⁺ из ЭПР или при избыточном входе Ca²⁺ в клетку — вход надолго превышает выход, и общее количество Ca²⁺ в матриксе растёт.","Накопленный Ca²⁺ сам по себе не ускоряет синтез ATP. Напротив, каждый входящий ион вносит в матрикс положительные заряды: вход Ca²⁺ расходует электрическую составляющую градиента, и меньшая её часть остаётся для синтеза ATP. При значительном накоплении Ca²⁺ вместе с фосфатом и окислительным стрессом повышается вероятность митохондриального перехода проницаемости — резкого увеличения проницаемости внутренней мембраны (следующий шаг).","Где проходит граница между сигналом и перегрузкой, зависит от многих условий: скорости выхода, буферной ёмкости матрикса, содержания фосфата, окислительно-восстановительного состояния и способности митохондрии поддерживать мембранные градиенты. Поэтому универсальной концентрации Ca²⁺, после которой митохондрия обязательно повреждается, нет; на схеме риск показан качественно."],"trap":["Чем выше матричный Ca²⁺, тем больше синтез ATP при любых условиях.","Ca²⁺ ускоряет образование NADH в определённом диапазоне концентраций и при работающей цепи. Чрезмерное накопление расходует мембранный потенциал на вход ионов и повышает вероятность перехода проницаемости, что нарушает синтез ATP."],"conditions":"Учебная модель: свободный Ca²⁺ и риск перехода проницаемости рассчитаны по условным параметрам и показаны качественно; это не предсказание жизнеспособности ткани. Зависимость перехода проницаемости от Ca²⁺, фосфата и окислительного стресса — Bernardi 2023; регуляция дегидрогеназ в микромолярном диапазоне — Denton 2009; баланс входа, выхода и буферирования — Lim 2021.","sources":["Lim2021","Denton2009","Bernardi2023"],"quiz":{"id":"S9-L19","rev":1,"question":"Почему краткий импульс матричного Ca²⁺ и длительное накопление Ca²⁺ могут иметь разные последствия?","options":[{"text":"Ca²⁺ при любой длительности действует только как субстрат синтеза ATP.","correct":false,"feedback":"Ca²⁺ — регулятор и переносимый ион, а не субстрат образования ATP; его действие ограничено состоянием системы.","id":"S9-L19-2"},{"text":"Любой краткий импульс обязательно разрушает внутреннюю мембрану.","correct":false,"feedback":"Краткие физиологические сигналы не равнозначны обязательному повреждению. Важны интенсивность, длительность и условия.","id":"S9-L19-3"},{"text":"При длительном накоплении повышается риск нарушения мембранных градиентов и функции.","correct":true,"feedback":"Умеренный сигнал способен поддерживать метаболическую регуляцию, тогда как перегрузка зависит от баланса входа, выхода, буферирования и состояния митохондрии.","id":"S9-L19-1"}]},"widget":{"kind":"catime","title":"","s":{"mode":"overload","title":"Краткий импульс и длительное поступление Ca²⁺","status":"Учебная модель · расчёт по условным параметрам","dur_label":"Поступление Ca²⁺","durs":["Краткий импульс","Длительное поступление"],"out_label":"Na⁺-зависимый выход (NCLX)","outs":["Сохранён","Снижен"],"ax_t":"время, усл. ед.","ax_free":"свободная [Ca²⁺], усл. ед.","ax_tot":"общая [Ca²⁺], усл. ед.","pulse":"вход через MCU","zone":"область повышенного риска перехода проницаемости","m_peak":"Максимум общей [Ca²⁺]","m_risk":"Риск перехода проницаемости","m_nadh":"Активация дегидрогеназ","risk":["низкий","повышен","высокий"],"nadh":["кратковременная","длительная, на фоне перегрузки"],"notes":{"0-0":"Краткий импульс: Ca²⁺ повышается и выводится, общая концентрация остаётся ниже области риска.","0-1":"Краткий импульс при сниженном выходе: Ca²⁺ сохраняется дольше, но накопление невелико.","1-0":"Длительное поступление: вход надолго превышает выход, общая концентрация растёт и может достигать области повышенного риска.","1-1":"Длительное поступление при сниженном выходе: накопление быстрее и больше, вероятность перехода проницаемости высокая."},"fixed":"Граница области риска — условный параметр модели, а не концентрация, после которой митохондрия обязательно повреждается. Объём матрикса постоянен, поэтому общая концентрация меняется так же, как общее количество Ca²⁺.","model":{"A":1.2,"t0":2,"D":[4,26],"beta":20,"V":[0.9,0.35],"K":0.5,"T":40,"risk":[100,300]},"unit":"усл. ед."}}},{"id":"permeability-apoptosis","number":20,"section":2,"title":"Чем переход проницаемости отличается от MOMP","question":3,"questions":[3],"keywords":["переход проницаемости","mPT","mPTP","циклофилин D","циклоспорин A","MOMP","BAX","BAK","цитохром c","апоптоз","некроз","набухание"],"lead":["[[T51|Митохондриальный переход проницаемости (mPT)]] — резкое увеличение проницаемости внутренней мембраны для небольших молекул. [[T52|MOMP]] — пермеабилизация наружной мембраны белками BAX и BAK.","Это разные события в разных мембранах; они могут быть связаны, но ни одно не следует из другого обязательно."],"mechanism":["При перегрузке Ca²⁺ вместе с фосфатом и окислительным стрессом во внутренней мембране открывается неспецифическая пора; циклофилин D облегчает её открывание.","Через пору выравниваются концентрации малых веществ, потенциал падает, матрикс набухает; растяжение может вторично повредить наружную мембрану.","При MOMP белки BAX и BAK образуют проницаемые структуры в наружной мембране; цитохром c выходит в цитозоль и запускает образование апоптосомы и активацию каспаз."],"paragraphs":["Митохондриальный переход проницаемости — это внезапное увеличение проницаемости внутренней мембраны для растворённых веществ массой примерно до 1,5 кДа. Его вызывает накопление Ca²⁺ в матриксе, особенно вместе с высоким содержанием фосфата и окислительным стрессом. Белок матрикса циклофилин D облегчает открывание поры, а его ингибитор циклоспорин A повышает необходимую для открывания нагрузку Ca²⁺. Молекулярный состав поры обсуждается: рассматривают участие ATP-синтазы и переносчика ANT, а VDAC, когда-то считавшийся обязательным компонентом, для перехода проницаемости не нужен (Baines 2007; Bernardi 2023).","Когда пора открыта, потенциал на внутренней мембране исчезает, синтез ATP прекращается, а вода входит в матрикс вслед за осмотически активными веществами. Матрикс набухает; при этом наружная мембрана может разорваться, и белки межмембранного пространства выходят в цитозоль. Клетки мышей без циклофилина D были устойчивы к некоторым формам некротической гибели, а на апоптотические стимулы отвечали обычно (Nakagawa 2005).","MOMP — другой механизм. При внутреннем пути апоптоза белки BAX и BAK олигомеризуются в наружной мембране и делают её проницаемой для белков межмембранного пространства. Цитохром c выходит в цитозоль, связывается с белком APAF1, образуется апоптосома, и активируются каспазы. Внутренняя мембрана при этом может долго оставаться непроницаемой.","Выход цитохрома c в цитозоль сам по себе не показывает, какой механизм сработал: он возможен и при MOMP, и при разрыве наружной мембраны после набухания. Поэтому mPT и MOMP нельзя считать двумя названиями одной поры или обязательными звеньями одной цепи."],"trap":["mPTP и MOMP — разные названия одной поры.","Переход проницаемости затрагивает внутреннюю мембрану и связан с Ca²⁺, фосфатом, окислительным стрессом и циклофилином D. MOMP затрагивает наружную мембрану и осуществляется белками BAX и BAK. Механизмы могут взаимодействовать, но это разные события."],"conditions":"Схема механизма; события показаны качественно, без обязательной последовательности. Состав поры и роль ATP-синтазы и ANT — предмет исследований (Bernardi 2023); необязательность VDAC — митохондрии мышей без VDAC1, VDAC3 или обоих и фибробласты без всех трёх изоформ VDAC (Baines 2007); роль циклофилина D в некрозе, но не в апоптозе — мыши без циклофилина D (Nakagawa 2005); MOMP и апоптосома — Bock 2020.","sources":["Bernardi2023","Baines2007","Nakagawa2005","Bock2020"],"quiz":{"id":"S9-L20","rev":1,"question":"В одном случае возникает неселективная проницаемость внутренней мембраны для малых растворённых веществ с набуханием матрикса. В другом цитохром c выходит через BAX/BAK-зависимые структуры наружной мембраны. Как соотносятся эти события?","options":[{"text":"Это переход проницаемости в обоих случаях: выход цитохрома c требует набухания.","correct":false,"feedback":"BAX/BAK-зависимая MOMP может происходить без набухания матрикса, связанного с переходом проницаемости внутренней мембраны.","id":"S9-L20-1"},{"text":"Это MOMP в обоих случаях: изменение проницаемости относится к наружной мембране.","correct":false,"feedback":"Первый случай прямо относится к внутренней мембране и неспецифическому переходу проницаемости. MOMP обозначает проницаемость наружной мембраны.","id":"S9-L20-3"},{"text":"Это переход проницаемости внутренней мембраны и MOMP соответственно.","correct":true,"feedback":"Митохондриальный переход проницаемости и MOMP могут взаимодействовать, но различаются по затронутой мембране и механизму.","id":"S9-L20-2"}]},"widget":{"kind":"net","title":"","s":{"title":"Переход проницаемости внутренней мембраны и MOMP наружной","status":"Схема механизма · качественные состояния","ctrls":[{"id":"k","type":"group","label":"Механизм","opts":["Переход проницаемости (mPT)","MOMP при апоптозе"]}],"W":560,"H":350,"NW":560,"NH":350,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":64,"c":"cyto","t":"цитозоль","lx":14,"ly":26},{"x":6,"y":92,"w":548,"h":104,"c":"plain","t":"межмембранное пространство","lx":14,"ly":112},{"x":6,"y":220,"w":548,"h":124,"c":"mito","t":"матрикс","lx":14,"ly":334}],"mem":[{"x1":6,"y1":80,"x2":554,"y2":80},{"x1":6,"y1":208,"x2":554,"y2":208}],"nodes":{"bax":{"p":[400,80,120,38],"t":"BAX/BAK","n":[400,80,120,38],"fs":17},"cyc":{"p":[400,150,130,34],"t":"цитохром c","n":[400,150,130,34],"fs":16},"casp":{"p":[400,36,150,44],"t":"апоптосома,\nкаспазы","n":[400,36,150,44],"fs":14},"ptp":{"p":[150,208,190,50],"t":"пора mPT\n(состав обсуждается)","n":[150,208,190,50],"fs":14},"ca":{"p":[150,282,210,34],"t":"Ca²⁺, Pi, окисл. стресс","n":[150,282,210,34],"fs":14},"sw":{"p":[410,290,210,44],"t":"набухание матрикса,\nпадение Δψm","n":[410,290,210,44],"fs":14},"cypd":{"p":[150,150,140,34],"t":"циклофилин D","n":[150,150,140,34],"fs":15}},"edges":{"tr":{"a":"ca","b":"ptp","k":"act"},"cy":{"a":"cypd","b":"ptp","k":"act","dash":true},"sw1":{"a":"ptp","b":"sw","k":"act","t":"вход воды\nи ионов","d":[10,16]},"b1":{"a":"bax","b":"cyc","k":"bind","s":"hide"},"rel":{"a":"cyc","b":"casp","k":"tr","t":"выход","d":[-52,0],"bend":60}},"st":{"0":{"n":{"ptp":"on","ca":"on","sw":"on","cypd":"on","bax":"base","cyc":"base","casp":"base"},"e":{"rel":"off"},"m":[["Затронутая мембрана","внутренняя"],["Δψm и синтез ATP","исчезают"],["Выход цитохрома c","возможен вторично, при разрыве"]],"note":"Ca²⁺, фосфат и окислительный стресс вызывают открывание поры во внутренней мембране. Потенциал падает, матрикс набухает; наружная мембрана может разорваться вторично."},"1":{"n":{"ptp":"base","ca":"base","sw":"base","cypd":"base","bax":"on","cyc":"on","casp":"on"},"e":{"tr":"off","cy":"off","sw1":"off"},"m":[["Затронутая мембрана","наружная"],["Δψm","может долго сохраняться"],["Выход цитохрома c","через BAX/BAK"]],"note":"BAX и BAK делают наружную мембрану проницаемой для белков межмембранного пространства. Цитохром c выходит в цитозоль и запускает образование апоптосомы и активацию каспаз; внутренняя мембрана может оставаться непроницаемой."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"calcium-measurement","number":21,"section":2,"title":"Как сопоставляют локальный Ca²⁺, матричный сигнал и контакт мембран","question":3,"questions":[3],"keywords":["адресованный индикатор Ca²⁺","экворин","GCaMP","mito-GCaMP","FRET","электронная микроскопия","сверхразрешение","пэтч-кламп","митопласт","ток MCU","контроль pH"],"lead":["Контакт ЭПР и митохондрии, концентрацию Ca²⁺ и ток через MCU измеряют разными методами, и каждый метод даёт свою величину.","Геометрия контакта не измеряет перенос иона: для вывода о переносе Ca²⁺ нужен функциональный сигнал в нужных компартментах."],"mechanism":["Генетически кодируемые индикаторы с сигналом адресации регистрируют свободную [Ca²⁺] в цитозоле, на поверхности митохондрий или в матриксе; нужны контроли pH и правильной локализации.","Расстояние между мембранами измеряют электронной микроскопией, сверхразрешающей микроскопией или сенсорами сближения; обычный световой микроскоп нанометровый зазор не разрешает.","Ток через унипортер регистрируют методом пэтч-кламп на митопластах — митохондриях без наружной мембраны."],"paragraphs":["Свободную [Ca²⁺] в определённом компартменте измеряют генетически кодируемыми индикаторами: экворином, GCaMP и их вариантами. К белку-индикатору присоединяют сигнал адресации, например N-концевую последовательность белка матрикса, и индикатор накапливается в матриксе. Затем регистрируют изменение флуоресценции или люминесценции во времени после стимула. Необходимы контроли: проверка локализации индикатора, его чувствительности к pH (у некоторых флуоресцентных индикаторов сигнал меняется при сдвиге pH), а также запись цитозольного сигнала в тех же условиях.","Геометрию контакта оценивают по-другому. Электронная микроскопия и электронная томография показывают расстояние между мембранами ЭПР и митохондрии с нанометровым разрешением, но на фиксированных препаратах. Сверхразрешающая световая микроскопия разрешает объекты мельче предела обычного микроскопа и позволяет работать с более сохранными образцами. Сенсоры сближения — пары флуоресцентных белков для FRET или фрагменты, восстанавливающие сигнал только при близком расположении, — выявляют сближение мембран в живых клетках. Совпадение окрасок ЭПР и митохондрий в обычном световом микроскопе не разрешает зазор в десятки нанометров.","Ток через унипортер прямо измерили на митопластах — митохондриях, у которых наружная мембрана удалена осмотическим разрывом. Электрод присасывают к внутренней мембране и регистрируют ток Ca²⁺ при заданном потенциале (Kirichok 2004).","Каждый метод отвечает на свой вопрос. Увеличение площади контакта не доказывает усиления переноса Ca²⁺, а содержание MCU — его проводимости. Для такого вывода нужно сравнить динамику Ca²⁺ в соответствующих компартментах при сопоставимом исходном высвобождении Ca²⁺ из ЭПР и Δψm."],"trap":["Более тесный контакт мембран сам по себе доказывает увеличение потока Ca²⁺.","Расстояние между мембранами — структурный показатель. Поток Ca²⁺ зависит также от высвобождения из ЭПР, состояния MCU и Δψm, поэтому его измеряют отдельно — по динамике свободного Ca²⁺ в цитозоле и в матриксе."],"conditions":"Принципиальные схемы методов, не данные экспериментов. Ток унипортера в митопластах — клетки COS-7 (Kirichok 2004); близость ЭПР и накопление Ca²⁺ — адресованный экворин и микроскопия в клетках HeLa (Rizzuto 1998); электронная томография и искусственные связки ЭПР с митохондриями — Csordás 2006; обзор методов и ограничений — Lim 2021, Cartes-Saavedra 2025. Не следует объединять разные препараты, виды и методики в один якобы проведённый эксперимент.","sources":["Lim2021","Kirichok2004","Rizzuto1998","Csordas2006","CartesSaavedra2025"],"quiz":{"id":"S9-L21","rev":1,"question":"На изображениях увеличилась площадь сближения ЭПР и митохондрий. Какое дополнительное наблюдение нужно для вывода об изменении переноса Ca²⁺?","options":[{"text":"Только повторное измерение площади того же контакта при другом увеличении.","correct":false,"feedback":"Повторная оценка геометрии повышает надёжность описания контакта, но не заменяет измерение Ca²⁺.","id":"S9-L21-1"},{"text":"Динамика Ca²⁺ в соответствующих компартментах при сопоставимых исходных условиях.","correct":true,"feedback":"Геометрия контакта не измеряет перенос иона. Нужны функциональный сигнал, правильная адресация индикаторов и учёт Δψm и исходного высвобождения Ca²⁺.","id":"S9-L21-3"},{"text":"Только увеличение содержания MCU в тех же клетках.","correct":false,"feedback":"Содержание канала не измеряет его текущую проводимость или перенос Ca²⁺. Нужна динамика иона при сопоставимых условиях.","id":"S9-L21-2"}]},"widget":{"kind":"camethods","title":"","s":{"title":"Три величины — три метода","status":"Принципиальная схема методов","q_label":"Что измеряем","qs":["Свободная [Ca²⁺] в компартменте","Расстояние между мембранами","Ток через унипортер"],"a":{"cell":"клетка","cyt":"индикатор в цитозоле","mat":"индикатор в матриксе","stim":"стимул","ax_t":"время →","ax_f":"сигнал индикатора","tr_c":"цитозоль","tr_m":"матрикс","ctrl":"контроли: локализация, pH, запись цитозоля"},"b":{"er":"ЭПР","omm":"наружная мембрана","imm":"внутренняя мембрана","gap":"зазор ≈ 10–50 нм","em":"электронная микроскопия: измеряется расстояние","lm":"обычный световой микроскоп: зазор не разрешается","fret":"сенсор сближения: сигнал есть только при близком расположении","sr":"сверхразрешающая микроскопия: расстояние оценивается"},"c":{"mp":"митопласт (без наружной мембраны)","pip":"стеклянный электрод","amp":"усилитель","ax_t":"время →","ax_i":"ток, усл. ед.","ca":"Ca²⁺","ru":"ингибитор MCU","ctrl":"контроль: ток исчезает при ингибиторе MCU"},"notes":["Индикатор с сигналом адресации регистрирует свободную [Ca²⁺] в том компартменте, куда он доставлен; сопоставляют записи цитозоля и матрикса после одного стимула.","Расстояние между мембранами — структурная величина. Электронная и сверхразрешающая микроскопия измеряют его, сенсор сближения выявляет сближение в живой клетке, а обычный световой микроскоп зазор не разрешает.","Пэтч-кламп митопласта измеряет ток Ca²⁺ через внутреннюю мембрану при заданном потенциале; ингибитор MCU служит контролем."],"fixed":"Кривые и полосы — условные иллюстрации логики измерения."}}},{"id":"dual-genome","number":22,"section":3,"title":"Почему дыхательный аппарат зависит от двух геномов","question":4,"questions":[4],"keywords":["мтДНК","двойной генетический контроль","13 белков","22 тРНК","2 рРНК","ядерные гены","комплекс II","эндосимбиоз","перенос генов в ядро"],"lead":["Дыхательный аппарат человека собирается из продуктов двух геномов. [[T54|Митохондриальная ДНК]] кодирует 13 белков, 22 тРНК и 2 рРНК, а все остальные митохондриальные белки — более тысячи — кодирует ядро.","Комплекс II целиком кодируется ядром; белки мтДНК входят в состав комплексов I, III, IV и ATP-синтазы. Это и есть [[T53|двойной генетический контроль]]."],"mechanism":["мтДНК человека — кольцевая молекула длиной около 16,6 тыс. пар нуклеотидов; её 13 белков — гидрофобные субъединицы комплексов I, III, IV и V, синтезируемые на миторибосомах в матриксе.","22 тРНК и 2 рРНК мтДНК нужны для митохондриальной трансляции; все белки самой системы трансляции, репликации и транскрипции кодирует ядро.","Субъединицы, кодируемые ядром, синтезируются в цитозоле, импортируются и собираются вместе с митохондриальными субъединицами при участии ядерно кодируемых факторов сборки."],"paragraphs":["Последовательность мтДНК человека определили в 1981 г. (Anderson 1981). Это кольцевая молекула длиной около 16,6 тыс. пар нуклеотидов, содержащая 37 генов: 13 кодируют белки, 22 — тРНК и 2 — рРНК. Все 13 белков — субъединицы дыхательных комплексов: семь субъединиц комплекса I (ND1–ND6 и ND4L), цитохром b комплекса III, три субъединицы цитохромоксидазы (COX1–COX3) и две субъединицы ATP-синтазы (ATP6 и ATP8). тРНК и рРНК мтДНК используются только для синтеза этих 13 белков на миторибосомах.","Все остальные белки митохондрии кодирует ядро — по обзору Russell 2020, более 1200. Среди них большинство субъединиц дыхательных комплексов, все четыре субъединицы комплекса II, белки миторибосом, ферменты репликации и транскрипции мтДНК и факторы сборки комплексов. Ядерно кодируемые белки синтезируются в цитозоле и импортируются, а митохондриально кодируемые синтезируются в матриксе. Комплексы I, III, IV и V собираются только тогда, когда доступны субъединицы обоих происхождений.","Поэтому дефект дыхательной цепи может быть вызван патогенным вариантом в любом из двух геномов. Варианты ядерных генов наследуются по законам Менделя; аутосомный ген представлен в клетке двумя копиями, и вариант может находиться в одной из них или в обеих — проявление зависит от гена и самого варианта. мтДНК человека наследуется по материнской линии, а её вариант может присутствовать лишь в части многочисленных молекул мтДНК клетки.","Происхождение двух геномов объясняет эндосимбиотическая теория: митохондрии произошли от бактерий, и большая часть их генов в ходе эволюции перешла в ядро. Почему небольшая часть генов осталась в органелле, обсуждается; одна из гипотез связывает это с возможностью регулировать синтез ключевых гидрофобных субъединиц прямо на месте сборки."],"trap":["Все белки дыхательной цепи кодируются мтДНК.","мтДНК кодирует только 13 белков. Большинство субъединиц дыхательных комплексов, все субъединицы комплекса II и все белки, обеспечивающие репликацию и экспрессию самой мтДНК, кодирует ядро."],"conditions":"Схема механизма. Числа 37/13/22/2 относятся к мтДНК человека (Anderson 1981), а не ко всем эукариотам. Число субъединиц в комплексах — принятый подсчёт для комплексов млекопитающих (Signes 2018; совпадает с практикумом); подсчёт зависит от того, учитывают ли дополнительные субъединицы и изоформы. Число ядерно кодируемых митохондриальных белков — Russell 2020.","sources":["Russell2020","Anderson1981","Signes2018","B_ALB2","B_LNR2"],"quiz":{"id":"S9-L22","rev":1,"question":"Какое утверждение о генетическом контроле комплексов окислительного фосфорилирования человека верно?","options":[{"text":"Все субъединицы комплексов I–V кодируются митохондриальной ДНК.","correct":false,"feedback":"Большинство митохондриальных белков, включая многие субъединицы и факторы сборки, кодируется ядерными генами.","id":"S9-L22-2"},{"text":"Все субъединицы комплекса II кодируются ядерными генами; часть субъединиц комплексов I, III, IV и V — мтДНК.","correct":true,"feedback":"У человека 13 белков, кодируемых мтДНК, входят в состав комплексов I, III, IV и V. Все субъединицы комплекса II кодируются ядерными генами.","id":"S9-L22-1"},{"text":"Все субъединицы комплекса II кодируются мтДНК, а субъединицы комплексов I, III, IV и V — ядерными генами.","correct":false,"feedback":"Здесь обращено распределение: все субъединицы II кодируются ядерными генами, а у остальных перечисленных комплексов есть вклад мтДНК.","id":"S9-L22-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Откуда берутся субъединицы комплексов I–V","status":"Схема механизма · состав комплексов","ctrls":[{"id":"c","type":"group","label":"Комплекс","opts":["I","II","III","IV","V (ATP-синтаза)"]}],"W":560,"H":310,"NW":560,"NH":310,"lg":{"title":"Обоз 5":"hide","mc1":"on","mc3":"hide","mc4":"hide","mc5":"hide"},"m":[["Субъединиц из мтДНК","7"],["Всего субъединиц (принятый подсчёт)","45"],["Гены мтДНК","ND1–ND6, ND4L"]],"note":"В комплексе I субъединицы мтДНК синтезируются в матриксе и собираются вместе с импортированными ядерно кодируемыми субъединицами."},"1":{"n":{"c1":"base","c2":"sel","c3":"base","c4":"base","c5":"base"},"e":{"ic1":"hide","ic2":"on","ic3":"hide","ic4":"hide","ic5":"hide","mc1":"hide","mc3":"hide","mc4":"hide","mc5":"hide"},"m":[["Субъединиц из мтДНК","0"],["Всего субъединиц (принятый подсчёт)","4"],["Гены мтДНК","нет"]],"note":"Комплекс II целиком кодируется ядром: его четыре субъединицы синтезируются в цитозоле и импортируются."},"2":{"n":{"c1":"base","c2":"base","c3":"sel","c4":"base","c5":"base"},"e":{"ic1":"hide","ic2":"hide","ic3":"on","ic4":"hide","ic5":"hide","mc1":"hide","mc3":"on","mc4":"hide","mc5":"hide"},"m":[["Субъединиц из мтДНК","1"],["Всего субъединиц (принятый подсчёт)","10"],["Гены мтДНК","CYTB"]],"note":"В комплексе III субъединицы мтДНК синтезируются в матриксе и собираются вместе с импортированными ядерно кодируемыми субъединицами."},"3":{"n":{"c1":"base","c2":"base","c3":"base","c4":"sel","c5":"base"},"e":{"ic1":"hide","ic2":"hide","ic3":"hide","ic4":"on","ic5":"hide","mc1":"hide","mc3":"hide","mc4":"on","mc5":"hide"},"m":[["Субъединиц из мтДНК","3"],["Всего субъединиц (принятый подсчёт)","14"],["Гены мтДНК","COX1–COX3"]],"note":"В комплексе IV субъединицы мтДНК синтезируются в матриксе и собираются вместе с импортированными ядерно кодируемыми субъединицами."},"4":{"n":{"c1":"base","c2":"base","c3":"base","c4":"base","c5":"sel"},"e":{"ic1":"hide","ic2":"hide","ic3":"hide","ic4":"hide","ic5":"on","mc1":"hide","mc3":"hide","mc4":"hide","mc5":"on"},"m":[["Субъединиц из мтДНК","2"],["Всего субъединиц (принятый подсчёт)","17"],["Гены мтДНК","ATP6, ATP8"]],"note":"В комплексе V субъединицы мтДНК синтезируются в матриксе и собираются вместе с импортированными ядерно кодируемыми субъединицами."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"expression-assembly","number":23,"section":3,"title":"Как экспрессия мтДНК связана со сборкой комплексов","question":4,"questions":[4],"keywords":["транскрипция мтДНК","POLRMT","TFAM","TFB2M","полицистронный транскрипт","модель тРНК-пунктуации","миторибосома","OXA1L","LRPPRC","TACO1","сборка комплексов"],"lead":["Экспрессия мтДНК проходит несколько этапов: транскрипцию, процессинг РНК, трансляцию на миторибосомах, встраивание белка в мембрану и сборку комплекса с ядерно кодируемыми субъединицами.","Нарушение любого этапа может помешать образованию комплекса, поэтому наличие мРНК ещё не означает, что комплекс собран."],"mechanism":["РНК-полимераза POLRMT вместе с TFAM и TFB2M транскрибирует мтДНК с образованием длинных полицистронных предшественников РНК.","Нуклеазы вырезают из предшественника тРНК, расположенные между генами мРНК и рРНК, и высвобождают отдельные РНК; мРНК стабилизируются белками, в частности LRPPRC.","Миторибосома, связанная с внутренней мембраной, синтезирует белок, OXA1L встраивает его в мембрану, и он собирается в комплекс с импортированными субъединицами."],"paragraphs":["Транскрипцию мтДНК осуществляет митохондриальная РНК-полимераза POLRMT, кодируемая ядром. Для начала транскрипции с промоторов мтДНК в очищенной системе достаточно двух факторов — TFAM и TFB2M (Litonin 2010). Транскрипция идёт на большие расстояния, и образуются длинные полицистронные предшественники, содержащие сразу много генов. Белок [[T75|MTERF1]], связывающийся с мтДНК сразу за генами рРНК, долго считали регулятором соотношения рРНК и мРНК. У мышей без MTERF1 содержание рРНК не изменилось, но снизилась транскрипция с промотора лёгкой цепи; на этом основании авторы заключили, что MTERF1 останавливает транскрипцию противоположной цепи мтДНК и не даёт ей мешать началу транскрипции с промотора лёгкой цепи (Terzioglu 2013).","В мтДНК гены тРНК расположены между генами мРНК и рРНК. Нуклеазы узнают тРНК в составе предшественника и вырезают их: по 5′-концу тРНК предшественник разрезает митохондриальная [[T74|RNase P]] — у человека это белковый комплекс из трёх субъединиц (MRPP1–3), в отличие от рибонуклеопротеиновой RNase P бактерий и ядра (Holzmann 2008), а по 3′-концу — другая эндонуклеаза. При этом освобождаются и отдельные мРНК и рРНК. Такую схему назвали моделью тРНК-пунктуации (Ojala 1981). Дальше РНК созревают: к тРНК присоединяется CCA-конец, мРНК полиаденилируются и стабилизируются белками, например LRPPRC. Эти белки участвуют в определённых этапах, а не управляют всей экспрессией.","Миторибосомы синтезируют 13 белков, используя 22 тРНК и 2 рРНК мтДНК. Миторибосома связана с внутренней мембраной, и новосинтезированный гидрофобный белок сразу встраивается в мембрану инсертазой OXA1L (Itoh 2021). Для трансляции отдельных мРНК нужны свои активаторы: например, TACO1 необходим для эффективного синтеза COX1 (Weraarpachai 2009).","Наконец, белки мтДНК собираются в комплексы вместе с импортированными ядерно кодируемыми субъединицами при участии факторов сборки. Транскрипт, белок и собранный комплекс — разные уровни: при сохранной мРНК, но нарушенной трансляции субъединица не синтезируется, и комплекс не собирается. Несобранные и повреждённые белки удаляют [[T76|протеазы митохондрий]]: LONP1 — в матриксе, AAA-протеазы внутренней мембраны — YME1L1 с активным центром в межмембранном пространстве и m-AAA-протеаза с активным центром в матриксе; OMA1 активируется при стрессе, например при потере мембранного потенциала, и расщепляет белок слияния OPA1 (Deshwal 2020)."],"trap":["Наличие мРНК субъединицы означает, что соответствующий комплекс уже собран.","Между мРНК и собранным комплексом есть трансляция, встраивание в мембрану и сборка с ядерно кодируемыми субъединицами. Если нарушен любой из этих этапов, мРНК есть, а комплекса нет."],"conditions":"Схема механизма для митохондрий человека; скорости этапов и полный набор факторов созревания РНК не показаны. Минимальная система транскрипции POLRMT–TFAM–TFB2M — очищенные белки человека (Litonin 2010); модель тРНК-пунктуации — Ojala 1981; связь миторибосомы с OXA1L — структурные данные (Itoh 2021); RNase P — белки человека, реконструкция активности (Holzmann 2008); MTERF1 — мыши с удалённым геном (Terzioglu 2013); протеазы — обзор Deshwal 2020. Разные дефекты дают разную остаточную функцию.","sources":["Russell2020","Litonin2010","Ojala1981","Itoh2021","Weraarpachai2009","Holzmann2008","Terzioglu2013","Deshwal2020","B_ALB2"],"quiz":{"id":"S9-L23","rev":1,"question":"В клетке сохранена мРНК митохондриальной субъединицы, но нарушена её трансляция. Что можно заключить о наличии собранного комплекса?","options":[{"text":"Комплекс обязательно собран, поскольку его ядерные субъединицы продолжают синтезироваться.","correct":false,"feedback":"Продолжение синтеза субъединиц, кодируемых ядерными генами, не компенсирует нарушение синтеза субъединицы, кодируемой мтДНК. Для сборки необходимы оба компонента.","id":"S9-L23-1"},{"text":"Комплекс обязательно собран, поскольку для сборки достаточно самой мРНК.","correct":false,"feedback":"мРНК служит матрицей для синтеза белка и не заменяет его в дыхательном комплексе.","id":"S9-L23-3"},{"text":"Сохранение мРНК само по себе не гарантирует синтез субъединицы и сборку.","correct":true,"feedback":"Транскрипт, белок и собранный комплекс — разные уровни. Между ними необходимы трансляция, встраивание и сборка с другими субъединицами.","id":"S9-L23-2"}]},"widget":{"kind":"net","title":"","s":{"title":"От мтДНК к собранному комплексу","status":"Схема механизма · качественные состояния","ctrls":[{"id":"b","type":"group","label":"Нарушенный этап","opts":["Нет нарушений","Процессинг РНК","Трансляция","Импорт ядерных субъединиц","Сборка"]}],"W":560,"H":320,"NW":560,"NH":320,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[],"mem":[],"nodes":{"mt":{"p":[100,46,190,50],"t":"мтДНК\n(POLRMT, TFAM, TFB2M)","n":[100,46,190,50],"fs":14},"pre":{"p":[330,46,200,34],"t":"полицистронная РНК","n":[330,46,200,34],"fs":15},"rna":{"p":[330,126,190,34],"t":"мРНК, тРНК, рРНК","n":[330,126,190,34],"fs":15},"rib":{"p":[330,206,160,34],"t":"миторибосома","n":[330,206,160,34],"fs":15},"oxa":{"p":[330,286,200,34],"t":"OXA1L: встраивание","n":[330,286,200,34],"fs":15},"asm":{"p":[110,286,180,38],"t":"сборка комплекса","n":[110,286,180,38],"fs":15},"nuc":{"p":[110,196,190,46],"t":"ядерные субъединицы\n(импорт)","n":[110,196,190,46],"fs":14}},"edges":{"t":{"a":"mt","b":"pre","k":"seq","t":"транскрипция","d":[0,-16]},"p":{"a":"pre","b":"rna","k":"seq","t":"вырезание тРНК","d":[86,0],"anc":"start"},"tl":{"a":"rna","b":"rib","k":"seq","t":"трансляция","d":[66,0],"anc":"start"},"ins":{"a":"rib","b":"oxa","k":"seq"},"a1":{"a":"oxa","b":"asm","k":"seq"},"a2":{"a":"nuc","b":"asm","k":"seq"}},"st":{"0":{"n":{"mt":"on","pre":"on","rna":"on","rib":"on","oxa":"on","asm":"on","nuc":"on"},"e":{"t":"on","p":"on","tl":"on","ins":"on","a1":"on","a2":"on"},"m":[["мРНК","есть"],["Белок мтДНК","синтезируется"],["Собранный комплекс","есть"]],"note":"Все этапы работают: РНК созревают, миторибосома синтезирует белок, OXA1L встраивает его в мембрану, и он собирается в комплекс с импортированными субъединицами."},"1":{"n":{"mt":"on","pre":"on","rna":"off","rib":"off","oxa":"off","asm":"off","nuc":"on"},"e":{"t":"on","p":"off","tl":"off","ins":"off","a1":"off","a2":"on"},"m":[["Зрелые мРНК и тРНК","снижены"],["Белок мтДНК","снижен"],["Собранный комплекс","снижен"]],"note":"Если отдельные РНК не высвобождаются из предшественника или нестабильны, миторибосоме нечего транслировать, и синтез белков мтДНК снижается."},"2":{"n":{"mt":"on","pre":"on","rna":"on","rib":"abs","oxa":"off","asm":"off","nuc":"on"},"e":{"t":"on","p":"on","tl":"off","ins":"off","a1":"off","a2":"on"},"m":[["мРНК","есть"],["Белок мтДНК","не синтезируется"],["Собранный комплекс","нет"]],"note":"мРНК сохранена, но трансляция нарушена: субъединица не синтезируется, и комплекс не собирается."},"3":{"n":{"mt":"on","pre":"on","rna":"on","rib":"on","oxa":"on","asm":"off","nuc":"abs"},"e":{"t":"on","p":"on","tl":"on","ins":"on","a1":"on","a2":"off"},"m":[["Белок мтДНК","синтезируется"],["Ядерные субъединицы в матриксе","не поступают"],["Собранный комплекс","нет"]],"note":"Митохондриальная субъединица есть, но ядерно кодируемые субъединицы не импортируются, и без них комплекс не собирается."},"4":{"n":{"mt":"on","pre":"on","rna":"on","rib":"on","oxa":"on","asm":"abs","nuc":"on"},"e":{"t":"on","p":"on","tl":"on","ins":"on","a1":"on","a2":"on"},"m":[["мРНК и белок мтДНК","есть"],["Ядерные субъединицы","есть"],["Собранный комплекс","нет или мало"]],"note":"Все субъединицы есть, но нарушен фактор сборки: комплекс не собирается, а несобранные субъединицы расщепляются протеазами."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"biogenesis-maintenance","number":24,"section":3,"title":"Как ядро регулирует биогенез и поддержание мтДНК","question":4,"questions":[4],"keywords":["митохондриальный биогенез","PGC-1α","NRF1","NRF-2","GABP","NFE2L2","TFAM","POLG","POLG2","TWNK","Twinkle","нуклеоид","истощение мтДНК","делеции","ретроградный сигнал"],"lead":["Ядро не только кодирует большинство субъединиц, но и регулирует количество митохондриального аппарата и поддерживает саму мтДНК. Совокупность этих процессов называют [[T68|митохондриальным биогенезом]].","Коактиватор [[T58|PGC-1α]] усиливает экспрессию ядерных генов митохондриальных белков, а ядерно кодируемые [[T56|TFAM]] и белки репликации [[T57|POLG, POLG2 и TWNK]] поддерживают мтДНК."],"mechanism":["PGC-1α сам не связывается с ДНК: он коактивирует транскрипционные факторы, прежде всего NRF1 и NRF-2 (GABP), которые активируют гены митохондриальных белков, в том числе TFAM.","TFAM упаковывает мтДНК в [[T55|нуклеоиды]] и участвует в её транскрипции; ДНК-полимераза γ (POLG и POLG2) и хеликаза TWNK реплицируют мтДНК.","Дефект ядерного гена поддержания мтДНК может уменьшить число копий мтДНК или привести к её делециям без какого-либо исходного варианта мтДНК."],"paragraphs":["Количество митохондрий и их белков меняется при физической нагрузке, охлаждении, изменении питания. Одним из регуляторов этого служит PGC-1α — коактиватор транскрипции. Он не связывается с ДНК сам, а взаимодействует с транскрипционными факторами и усиливает их действие. В культуре мышечных клеток повышение содержания PGC-1 усиливало экспрессию NRF1 и NRF-2 и через них — экспрессию TFAM и митохондриальный биогенез (Wu 1999). PGC-1α — не единственный регулятор: в сеть входят и другие коактиваторы и факторы (Scarpulla 2011).","NRF-2 — второе название фактора GABP (Virbasius 1993). Его не следует путать с [[T59|NRF2 (NFE2L2)]] — фактором ответа на окислительный стресс, который регулирует антиоксидантные гены (Moi 1994). Названия похожи, а белки и функции разные.","TFAM кодируется ядром, импортируется в матрикс и упаковывает мтДНК в нуклеоиды; он же участвует в транскрипции мтДНК. Реплицируют мтДНК ядерно кодируемые белки: каталитическая субъединица ДНК-полимеразы γ (POLG), её вспомогательная субъединица (POLG2) и хеликаза TWNK. Эти белки вместе с белком, связывающим одноцепочечную ДНК, образуют минимальную систему репликации in vitro (Korhonen 2004).","Поэтому митохондриальная болезнь может быть вызвана мутацией ядерного гена. Мутации POLG или TWNK могут уменьшать число копий мтДНК (истощение мтДНК) или приводить к множественным делециям — без исходной гетероплазмии одного точечного варианта. Связь идёт и в обратную сторону: состояние митохондрий меняет экспрессию ядерных генов ([[T69|ретроградная сигнализация]]); стрессовые ответы такого рода рассматривает семинар 10."],"trap":["TFAM — фактор транскрипции ядерных генов, а PGC-1α сам связывает их промоторы.","TFAM работает в матриксе: упаковывает мтДНК и участвует в её транскрипции. PGC-1α — коактиватор: он не связывает ДНК сам, а усиливает действие ядерных факторов NRF1 и NRF-2 (GABP)."],"conditions":"Структурная карта связей, а не модель фиксированного усиления биогенеза. PGC-1, NRF и TFAM — культура мышечных клеток C2C12 (Wu 1999); идентичность GABP и NRF-2 — Virbasius 1993; NRF2 (NFE2L2) — Moi 1994; минимальная система репликации — очищенные белки человека (Korhonen 2004); болезни поддержания мтДНК — Russell 2020. Причины болезни зависят от конкретного варианта гена.","sources":["Russell2020","Wu1999","Scarpulla2011","Virbasius1993","Moi1994","Korhonen2004"],"quiz":{"id":"S9-L24","rev":1,"question":"При дефекте ядерного гена POLG число копий мтДНК уменьшилось, но исследуемого мутантного варианта мтДНК нет. Возможен ли дефицит дыхательной функции?","options":[{"text":"Невозможен: любой дефект дыхания требует высокой доли мутантной мтДНК.","correct":false,"feedback":"Митохондриальные болезни могут быть связаны с ядерными генами и истощением мтДНК, а не только с гетероплазмией точечной мутации.","id":"S9-L24-1"},{"text":"Возможен: уменьшение числа копий мтДНК может снизить синтез кодируемых ею белков.","correct":true,"feedback":"Число копий и доля определённого варианта — разные характеристики. Ядерные дефекты поддержания мтДНК могут нарушать дыхательный аппарат и без данного варианта.","id":"S9-L24-3"},{"text":"Невозможен: ядерные гены не участвуют в поддержании мтДНК.","correct":false,"feedback":"POLG кодируется в ядре; его продукт участвует в репликации мтДНК.","id":"S9-L24-2"}]},"widget":{"kind":"net","title":"","s":{"title":"Ядерная регуляция биогенеза и поддержание мтДНК","status":"Схема механизма · связи участников","ctrls":[{"id":"u","type":"group","label":"Участник","opts":["PGC-1α","TFAM","POLG и POLG2","TWNK","NRF2 (NFE2L2)"]}],"W":560,"H":384,"NW":560,"NH":384,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":300,"h":372,"c":"nuc","t":"ядро и цитозоль","lx":14,"ly":366},{"x":314,"y":120,"w":240,"h":258,"c":"mito","t":"митохондрия","lx":548,"ly":370,"a":"end"}],"mem":[],"nodes":{"pgc":{"p":[110,46,170,48],"t":"PGC-1α\n(коактиватор)","n":[110,46,170,48],"fs":15},"nrf":{"p":[110,128,200,36],"t":"NRF1, NRF-2 (GABP)","n":[110,128,200,36],"fs":15},"nfe":{"p":[430,46,200,48],"t":"NRF2 (NFE2L2):\nдругой фактор","n":[430,46,200,48],"fs":14},"genes":{"p":[150,222,270,64],"t":"ядерные гены:\nTFAM, POLG, POLG2, TWNK,\nсубъединицы","n":[150,222,270,64],"fs":14},"tfam":{"p":[430,152,200,46],"t":"TFAM: нуклеоид,\nтранскрипция","n":[430,152,200,46],"fs":14},"rep":{"p":[430,240,210,46],"t":"репликация мтДНК:\nPOLG, POLG2, TWNK","n":[430,240,210,46],"fs":14},"mtdna":{"p":[430,318,210,34],"t":"мтДНК: число копий","n":[430,318,210,34],"fs":15}},"edges":{"a":{"a":"pgc","b":"nrf","k":"act","t":"коактивирует","d":[64,0],"anc":"start"},"b":{"a":"nrf","b":"genes","k":"act"},"c":{"a":"genes","b":"tfam","k":"seq","t":"импорт","d":[0,-14]},"d":{"a":"genes","b":"rep","k":"seq"},"e":{"a":"tfam","b":"mtdna","k":"act","bend":-40},"f":{"a":"rep","b":"mtdna","k":"act"},"g":{"a":"mtdna","b":"genes","k":"act","t":"сигнал о состоянии\nмитохондрий","d":[-30,30],"bend":30,"dash":true}},"st":{"0":{"n":{"pgc":"sel","nrf":"sel","nfe":"base","genes":"base","tfam":"base","rep":"base","mtdna":"base"},"m":[["Тип белка","коактиватор транскрипции"],["Связывает ДНК","нет, действует через факторы"]],"note":"PGC-1α коактивирует NRF1 и NRF-2 (GABP); они активируют гены митохондриальных белков, включая TFAM."},"1":{"n":{"pgc":"base","nrf":"base","nfe":"base","genes":"base","tfam":"sel","rep":"base","mtdna":"sel"},"m":[["Где работает","матрикс, нуклеоид"],["Функция","упаковка и транскрипция мтДНК"]],"note":"TFAM кодируется ядром, импортируется и в матриксе упаковывает мтДНК в нуклеоиды, участвуя в её транскрипции."},"2":{"n":{"pgc":"base","nrf":"base","nfe":"base","genes":"base","tfam":"base","rep":"sel","mtdna":"sel"},"m":[["Где работает","матрикс"],["При дефекте","истощение мтДНК или делеции"]],"note":"POLG и POLG2 — субъединицы ДНК-полимеразы γ, реплицирующей мтДНК. Мутации POLG могут уменьшать число копий мтДНК или вызывать её делеции."},"3":{"n":{"pgc":"base","nrf":"base","nfe":"base","genes":"base","tfam":"base","rep":"sel","mtdna":"sel"},"m":[["Где работает","матрикс"],["При дефекте","делеции или истощение мтДНК"]],"note":"TWNK — хеликаза, расплетающая мтДНК при репликации. Её дефекты тоже связаны с делециями и истощением мтДНК."},"4":{"n":{"pgc":"base","nrf":"base","nfe":"sel","genes":"base","tfam":"base","rep":"base","mtdna":"base"},"m":[["Тип белка","фактор транскрипции антиоксидантных генов"],["Связь с NRF-2 (GABP)","другой белок"]],"note":"NRF2 (NFE2L2) — фактор ответа на окислительный стресс; это не ядерный дыхательный фактор NRF-2 (GABP), несмотря на сходное название."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"heteroplasmy-threshold","number":25,"section":3,"title":"Почему эффект гетероплазмии может проявляться нелинейно","question":4,"questions":[4],"keywords":["гетероплазмия","гомоплазмия","порог","биохимический порог","функциональный резерв","доля варианта","m.3243A>G","тканевая специфичность"],"lead":["При [[T60|гетероплазмии]] в клетке сосуществуют молекулы мтДНК разных вариантов; при [[T61|гомоплазмии]] все анализируемые молекулы одинаковы.","Функция обычно снижается не пропорционально [[T62|доле варианта]], а нелинейно: пока молекул дикого типа достаточно, дефект скрыт, а после некоторой доли проявляется. Эту долю называют [[T64|порогом гетероплазмии]]."],"mechanism":["Каждая клетка содержит сотни или тысячи копий мтДНК; патогенный вариант может присутствовать в части из них.","Мутации мтДНК функционально рецессивны: молекулы дикого типа обеспечивают синтез нормальных субъединиц, а у комплексов есть резерв мощности.","Поэтому функция почти не меняется до высокой доли варианта, а затем резко падает; где именно — зависит от варианта, ткани и выбранного показателя."],"paragraphs":["Митохондриальная ДНК присутствует в клетке во многих копиях. Если патогенный вариант возник в части молекул, клетка гетероплазмична; долю варианта выражают отношением числа молекул с вариантом к общему числу проанализированных молекул. Если все молекулы несут один вариант, клетка гомоплазмична.","Мутации мтДНК функционально рецессивны: оставшиеся молекулы дикого типа продолжают кодировать нормальные субъединицы. Кроме того, мощность дыхательной цепи в покое обычно используется не полностью. Поэтому при росте доли варианта функция сначала почти не меняется, а затем, когда молекул дикого типа становится слишком мало, снижается резко. По обзору Russell 2020, для биохимического дефекта в отдельной клетке патогенный вариант обычно должен достигать высокой доли — более 70 %.","Порог — не свойство варианта вообще, а результат сравнения в определённых условиях. Он зависит от самого варианта (вариант гена тРНК затрагивает синтез всех 13 белков, вариант гена одной субъединицы — один комплекс), от ткани и её потребности в ATP, от выбранного показателя и критерия «дефицита». В клетках с вариантом m.3243A>G при постепенном росте его доли экспрессия генов менялась скачкообразно в нескольких диапазонах (Picard 2014).","Поэтому универсальной границы вроде «60–90 % для всех болезней» нет. Одна и та же доля варианта не означает одинаковой тяжести болезни: у носителей одного варианта при сходной гетероплазмии проявления сильно различаются, в том числе из-за ядерных генетических факторов (Russell 2020)."],"trap":["Одна доля мутантной мтДНК соответствует одинаковой тяжести любой болезни.","Порог зависит от варианта, ткани, измеряемой функции и критерия дефицита, а тяжесть болезни — ещё и от ядерного генетического фона. Одна и та же доля варианта может давать разные последствия."],"conditions":"Учебная модель, общая с практикумом (вопрос 4), в упрощённом виде: обеспеченность субъединицей f = min(1, (1 − h)/0,40) — полного синтеза субъединицы достигают уже 40 % молекул дикого типа (условный параметр практикума), относительная мощность комплекса g = (1 + R)·f / (R + f), R — условный параметр резерва; критерий дефицита задан как доля мощности, необходимая при низкой или высокой потребности. Кривая — не данные пациента и не диагностический порог. Нелинейный ответ на m.3243A>G — цибриды с разной долей варианта (Picard 2014); порог > 70 % для дефекта в отдельной клетке и клиническая изменчивость — Russell 2020.","sources":["Russell2020","Picard2014"],"quiz":{"id":"S9-L25","rev":1,"question":"Для одного варианта мтДНК найден порог снижения определённого дыхательного показателя. Можно ли использовать это число как общий порог всех митохондриальных болезней?","options":[{"text":"Можно: доля мутантной мтДНК всегда прямо равна доле погибающих клеток.","correct":false,"feedback":"Доля молекул варианта не определяет непосредственно ни распределение по клеткам, ни гибель клеток.","id":"S9-L25-2"},{"text":"Можно: любой ген мтДНК изменяет все комплексы в одинаковой степени.","correct":false,"feedback":"Белок-кодирующий вариант и вариант тРНК могут иметь разный спектр последствий; даже варианты одного гена не равнозначны.","id":"S9-L25-3"},{"text":"Нельзя: порог зависит от варианта, клеточного контекста и выбранной функции.","correct":true,"feedback":"Порог — результат определённого функционального сравнения. Его перенос на другой вариант, ткань или показатель требует самостоятельного обоснования.","id":"S9-L25-1"}]
