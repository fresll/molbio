/* four-parameters: E(GSH/GSSG) по уравнению Нернста — зависимость от абсолютного [GSH], отношения и pH */
const q1E = (G, r, pH) => { const E0 = -240 - 60 * (pH - 7.0), k = 8.314 * 310.15 / (2 * 96485) * 1000; return { E0, E: E0 - k * Math.log(G * r), gssg: G / r }; };
function q1conc(M, u){ const st = [[1e-9, 1e12, 0], [1e-6, 1e9, 1], [1e-3, 1e6, 2], [Infinity, 1e3, 3]].find(s => M < s[0]); const v = M * st[1]; return (v >= 100 ? String(Math.round(v)) : v >= 10 ? v.toFixed(0) : v.toFixed(1).replace('.', ',')) + nb + u[st[2]]; }
W.q1nernst = ({ S, s, set, out, onGroup }) => {
  s.g ??= 1; s.r ??= 2; s.p ??= 1;
  set(S.title, S.status, buttonGroup('q1n-g', S.g_opts, s.g, S.g_l) + buttonGroup('q1n-r', S.r_opts, s.r, S.r_l) + buttonGroup('q1n-p', S.p_opts, s.p, S.p_l));
  const draw = () => {
    const R = q1E(S.g_vals[s.g], S.r_vals[s.r], S.p_vals[s.p]);
    const X0 = 40, X1 = 610, lo = -420, hi = -140, gx = v => X0 + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (X1 - X0);
    let d = line(X0, 190, X1, 190, '#7f97ab', 2);
    for (let v = -400; v <= -150; v += 50) d += line(gx(v), 184, gx(v), 196, '#7f97ab', 2) + q1tx(gx(v), 216, String(v).replace('-', '−'), 13);
    d += q1tx((X0 + X1) / 2, 240, S.axis, 13);
    const col = ['#2d7fc1', '#4d8b44', '#c3662f'];
    S.meas.forEach(([lab, a, b], i) => { const y = 34 + i * 34, xa = gx(a), xb = gx(b);
      d += (a === b ? circ(xa, y + 14, 7, col[i]) : rect(xa, y + 7, Math.max(6, xb - xa), 14, col[i], 6, 'opacity=".75"')) + (Math.max(xa, xb) > 430 ? q1tx(Math.min(xa, xb) - 12, y + 19, lab, 13, 'end') : q1tx(Math.max(xa, xb) + 12, y + 19, lab, 13, 'start')); });
    d += line(gx(R.E0), 128, gx(R.E0), 196, C4.muted, 2, 'stroke-dasharray="5 4"') + q1tx(gx(R.E0) + 6, 138, S.e0, 12, 'start');
    d += `<path d="M${gx(R.E)} 186 l-9 -18 l18 0 z" fill="${C4.red}"/>` + q1b(gx(R.E), 166, S.calc + ': ' + q1n(R.E, 0) + nb + S.mv, 14).replace('<text ', `<text fill="${C4.red}" `);
    const note = fmt(S.note, { E: q1n(R.E, 0), gssg: q1conc(R.gssg, S.u) });
    out(svg(d, S.title, 252, 640, note),
      `<div class="metrics two">${metric(S.m_E, q1n(R.E, 0) + nb + S.mv)}${metric(S.m_gssg, q1conc(R.gssg, S.u))}${metric(S.m_e0, q1n(R.E0, 0) + nb + S.mv)}</div>` +
      result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q1n-g', i => { s.g = i; draw(); }); onGroup('q1n-r', i => { s.r = i; draw(); }); onGroup('q1n-p', i => { s.p = i; draw(); });
  draw();
};

/* pumps-channels: калькулятор Δμ; случай «Ca²⁺ в матрикс» считается функцией модели практикума M1.dmuCa */
W.q1dmu = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0; s.psi ??= 1;
  const build = () => {
    set(S.title, S.status, buttonGroup('q1d-mode', S.modes, s.mode, S.modes_label) + (s.mode === 0 ? buttonGroup('q1d-psi', S.psi_opts, s.psi, S.psi_l) : ''));
    onGroup('q1d-mode', i => { s.mode = i; build(); });
    if (s.mode === 0) onGroup('q1d-psi', i => { s.psi = i; draw(); });
    draw();
  };
  const draw = () => {
    const c = S.cases[s.mode];
    let ch, el, tot;
    if (s.mode === 0){ const r = M1.dmuCa(S.psi_vals[s.psi], c.c1, c.c2); ch = r.ch; el = r.el; tot = r.tot; }
    else { ch = M1.RT * Math.log(c.c2 / c.c1); el = null; tot = ch; }
    const Z = 400, sc = 5, bar = (y, v, color, lab) => { const w = v * sc; return rect(w < 0 ? Z + w : Z, y, Math.max(2, Math.abs(w)), 26, color, 4) + q1tx(10, y + 18, lab, 13, 'start') + q1tx(w < 0 ? Z + 8 : Z + w + 8, y + 18, q1sgn(v) + nb + S.kj, 13, 'start'); };
    let d = q1tx(320, 22, c.from + '  →  ' + c.to, 14);
    d += line(Z, 40, Z, 168, C4.ink, 2) + q1tx(Z, 186, '0', 13);
    d += bar(48, ch, C4.gray, S.chem);
    d += el === null ? q1tx(10, 102, S.el, 13, 'start') + q1tx(Z + 8, 102, S.el_na, 13, 'start') : bar(84, el, '#7aa7d6', S.el);
    d += bar(124, tot, tot < 0 ? C4.teal : C4.red, S.tot);
    const neg = tot < 0, note = neg ? S.note_neg : S.note_pos, who = neg ? c.who_neg : c.who_pos;
    d += q1b(320, 222, who, 15).replace('<text ', `<text fill="${neg ? C4.teal : C4.red}" `);
    out(svg(d, S.title, 240, 640, note),
      `<div class="metrics two">${metric(S.m_tot, q1sgn(tot) + nb + S.kj)}${metric(S.m_who, who)}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  build();
};

/* nonequilibrium: релаксация после остановки насоса — модель практикума M1 (те же τ и уровни) */
W.q1relax = ({ S, s, set, out, onGroup, onRange }) => {
  s.mode ??= 0; s.t ??= 4;
  set(S.title, S.status, buttonGroup('q1r-mode', S.modes, s.mode, S.modes_label) + '<div class="controls">' + slider('q1r-t', S.t_l, 0, M1.TIMES.length - 1, s.t, 1, '') + '</div>');
  const COL = { lys: C4.red, er: C4.blue, mito: C4.orange };
  const draw = () => {
    $('q1r-t-value').textContent = S.t_lab[s.t];
    const k = S.keys[s.mode], ts = M1.TIMES[s.t], x = M1.val(k, false, ts), r = M1.remain(k, x);
    const X0 = 80, X1 = 610, Y0 = 210, Y1 = 30, gx = t => X0 + (X1 - X0) * Math.log10(Math.max(1, t)) / Math.log10(3600), gy = v => Y0 - (Y0 - Y1) * v;
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    [0, 0.5, 1].forEach(v => { d += line(X0, gy(v), X1, gy(v), '#e4ebf1', 1) + q1tx(X0 - 8, gy(v) + 5, String(100 * v), 13, 'end'); });
    [1, 10, 60, 600, 3600].forEach((t, i) => { d += line(gx(t), Y0, gx(t), Y0 + 5, '#7f97ab', 1.5) + q1tx(gx(t), Y0 + 22, S.ax[i], 13); });
    d += q1tx((X0 + X1) / 2, Y0 + 44, S.x, 13) + q1tx(X0 - 4, Y1 - 12, S.y, 13, 'start');
    S.keys.forEach((kk, j) => {
      const pts = Array.from({ length: 81 }, (_, i) => { const t = Math.pow(3600, i / 80); return (i ? 'L' : 'M') + gx(t).toFixed(1) + ' ' + gy(M1.remain(kk, M1.val(kk, false, t))).toFixed(1); }).join(' ');
      d += `<path d="${pts}" fill="none" stroke="${COL[kk]}" stroke-width="${kk === k ? 4 : 2.5}"${kk === k ? '' : ' stroke-dasharray="6 5" opacity=".55"'}/>`;
    });
    const xs = gx(Math.max(1, ts));
    d += line(xs, Y1, xs, Y0, C4.amber, 2) + circ(xs, gy(r), 8, COL[k], 'stroke="#fff" stroke-width="2"');
    /* время, за которое различие уменьшается вдвое (в собственных единицах): кружок на линии 50 % и подпись в легенде */
    S.keys.forEach(kk => { d += circ(gx(M1.half(kk)), gy(0.5), 6, '#fff', `stroke="${COL[kk]}" stroke-width="3"`); });
    /* легенда: на широком экране — в строку, на узком (крупный кегль) — столбцом */
    const st = small(), lgx = j => st ? 10 : 10 + j * 210, lgy = j => st ? 284 + j * 30 : 284;
    const lg = S.keys.map((kk, j) => line(lgx(j), lgy(j), lgx(j) + 30, lgy(j), COL[kk], 4, kk === k ? '' : 'stroke-dasharray="6 5"') + q1tx(lgx(j) + 36, lgy(j) + 5, S.lg[j] + ': ' + fmt(S.half, { t: M1.halfTxt(kk, S.u_s, S.u_min) }), 13, 'start')).join('');
    d += lg;
    const v = k === 'lys' ? q1n(x, 1) : k === 'er' ? (x >= 10 ? String(Math.round(x)) : q1n(x, 1)) + nb + S.units[1] : q1n(x, 0) + nb + S.units[2];
    const note = fmt(S.note, { drug: S.drug[s.mode], t: S.t_lab[s.t], r: Math.round(100 * r) + nb + '%' });
    out(svg(d, S.title, st ? 360 : 300, 640, note),
      `<div class="metrics">${metric(S.m_val[s.mode], v)}${metric(S.m_rem, Math.round(100 * r) + nb + '%')}${metric(S.m_mem, S.mem_ok)}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q1r-mode', i => { s.mode = i; draw(); }); onRange('q1r-t', v => { s.t = v; draw(); });
  draw();
};

/* mito-potential: пять условий модели практикума M1.cond */
W.q1mito = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q1t-mode', S.modes, s.mode, S.modes_label));
  /* схема метода: закрытая ячейка с клетками и датчиком O₂; скорость потребления O₂ при последовательных добавках (уровни — M1.COND) */
  const meth = () => {
    const L = S.meth, lv = [M1.COND.ctrl.o2, M1.COND.oligo.o2, M1.COND.fccp.o2, M1.COND.anti.o2];
    let d = q1b(24, 22, L.ch, 13, 'start');
    d += rect(20, 34, 180, 8, '#556171', 2) + rect(24, 42, 172, 150, '#eef5fb', 0, 'stroke="#556171" stroke-width="2.5"');
    d += rect(50, 60, 36, 74, '#fbf3c9', 8, 'stroke="#b39b10" stroke-width="2"') + q1tl(68, 152, L.sens, 12, 'middle', 120);
    d += q1tr(178, 4, 178, 74, C4.muted, true) + q1tx(170, 64, L.inj, 12, 'end');
    [44, 72, 100, 128, 156, 180].forEach(x => { d += `<ellipse cx="${x}" cy="182" rx="12" ry="6" fill="#d9c7e8" stroke="#7a5aa6" stroke-width="1.5"/>`; });
    d += q1tx(110, 212, L.cell, 12);
    const X0 = 270, X1 = 626, Y0 = 200, gy = v => Y0 - v / 2.5 * 140, seg = (X1 - X0) / 4;
    d += line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, 56, X0, Y0, '#7f97ab', 1.5);
    [0, 100, 200].forEach(v => { d += q1tx(X0 - 6, gy(v / 100) + 5, String(v), 12, 'end'); });
    d += q1tx(X0, 22, L.y, 12, 'start') + q1tx((X0 + X1) / 2, Y0 + 22, L.x, 12);
    let p = '';
    lv.forEach((v, i) => { p += (i ? 'L' : 'M') + (X0 + i * seg).toFixed(1) + ' ' + gy(v).toFixed(1) + ' L' + (X0 + (i + 1) * seg).toFixed(1) + ' ' + gy(v).toFixed(1) + ' '; });
    d += `<path d="${p}" fill="none" stroke="${C4.blue}" stroke-width="3.5"/>`;
    /* над ступенькой — % от исходного и название уровня; у максимума название — под линией */
    lv.forEach((v, i) => { const x = X0 + (i + 0.5) * seg + (i === 3 ? 8 : 0); d += q1tx(x, gy(v) - 8, Math.round(100 * v) + nb + '%', 12) + q1tx(x, v > 2 ? gy(v) + 20 : gy(v) - 24, L.lv[i], 11); });
    L.add.forEach((a, i) => { const x = X0 + (i + 1) * seg; d += line(x, 52, x, Y0, C4.red, 1.5, 'stroke-dasharray="4 4"') + q1tx(i === 2 ? X1 : x, 46, a, 11, i === 2 ? 'end' : 'middle').replace('<text ', `<text fill="${C4.red}" `); });
    out(svg(d, S.title, 240, 640, S.notes.o2meth), result(`<p>${esc(S.notes.o2meth)}</p>`) + `<p class="quiet">${esc(L.legend)}</p>`);
  };
  const draw = () => {
    if (S.keys[s.mode] === 'o2meth') return meth();
    const k = S.keys[s.mode], o = M1.cond(k), respOn = o.o2 > 0.2, atpOn = o.atp === 'syn' || o.atp === 'hyd';
    let d = rect(0, 0, 640, 70, '#f6f8fa', 0) + q1tx(14, 22, S.ims, 12, 'start');
    d += rect(0, 70, 640, 28, '#f6e3d6', 0, 'stroke="#c3662f" stroke-width="2.5"');
    d += rect(0, 98, 640, 120, '#c3662f', 0, `opacity="${(0.06 + 0.3 * Math.abs(o.psi) / 160).toFixed(2)}"`) + q1tx(626, 208, S.mat, 13, 'end');
    const bx = (x, w, lab, on, miss) => box(x, 58, w, 52, lab, { fill: on ? C4.amberFill : '#fff', stroke: on ? C4.amber : '#9aa7b3', dash: on ? '' : '6 5', size: q1F(12), sw: on ? 3 : 2 });
    d += bx(14, 130, S.resp, respOn) + bx(175, 110, S.atps, atpOn) + bx(320, 80, S.tim, o.imp > 0.2) + bx(435, 70, S.mcu, o.ca.tot < 0);
    /* перенос: H⁺ дыхательной цепью (матрикс → МП), H⁺ через ATP-синтазу (по направлению), белок с MTS, Ca²⁺ — пунктир рядом с белком */
    d += q1tr(155, 150, 155, 26, C4.muted, respOn) + q1tx(161, 48, 'H⁺', 13, 'start');
    d += (o.atp === 'hyd' ? q1tr(300, 150, 300, 26, C4.muted, true) : q1tr(300, 26, 300, 150, C4.muted, atpOn)) + q1tx(306, 48, 'H⁺', 13, 'start');
    d += q1tr(415, 26, 415, 160, C4.muted, o.imp > 0.2) + q1tx(409, 22, S.mts, 12, 'end');
    d += q1tr(520, 26, 520, 160, C4.muted, o.ca.tot < 0) + q1tx(526, 48, 'Ca²⁺', 13, 'start');
    if (k === 'fccp') d += box(556, 58, 74, 52, '', { fill: '#fff', stroke: C4.red, dash: '4 3' }) + q1tx(593, 52, S.fccp, 13).replace('<text ', `<text fill="${C4.red}" style="font-weight:700" `) + q1tr(593, 26, 593, 160, C4.red, true);
    d += q1tx(237, 140, S.atp_dir[o.atp], 13);
    const drugs = { oligo: [[175, S.modes[1]]], anti: [[20, S.modes[2]]], antiol: [[20, S.modes[2]], [175, S.modes[1]]] }[k] || [];
    drugs.forEach(([x, t]) => { d += rect(x, 172, 120, 26, C4.red, 6) + q1tx(x + 60, 190, t, 13).replace('<text ', '<text style="fill:#fff;font-weight:700" '); });
    const mv = q1n(o.psi, 0) + nb + S.mv;
    out(svg(d, S.title, 220, 640, S.notes[k]),
      `<div class="metrics two">${metric(S.m_psi, mv)}${metric(S.m_o2, Math.round(100 * o.o2) + nb + '%')}${metric(S.m_imp, M1.impTxt(o.imp) + nb + '%')}${metric(S.m_ca, q1sgn(o.ca.tot) + nb + S.kj)}</div>` +
      `<p class="quiet">${esc(S.ctrl)}</p>` + result(`<p>${esc(S.notes[k])}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q1t-mode', i => { s.mode = i; draw(); });
  draw();
};

/* isolation-exchange: изоляция (лизосома цела / повреждена) и обмен (два челнока, импорт белка) — схема механизма */
W.q1iso = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q1i-mode', S.modes, s.mode, S.modes_label));
  const conv = (x1, y1, x2, y2) => arrow(x1, y1, x2, y2, C4.ink, 2.5);           /* химическое превращение */
  const tr = (x1, y1, x2, y2) => q1tr(x1, y1, x2, y2, C4.muted, true);            /* перенос через мембрану */
  const lab = (x, y, t, size = 13, a = 'middle') => q1tx(x, y, t, size, a);
  const mito = (cl = true) => rect(0, 0, 640, 40, '#f6f8fa', 0) + (cl ? lab(630, 26, S.cyt.split(',')[0], 13, 'end') : '') +
    rect(0, 40, 640, 22, '#f6f8fa', 0, 'stroke="#c3662f" stroke-width="2"') + lab(630, 56, S.om, 11, 'end') +
    rect(0, 62, 640, 60, '#fdf7f2', 0) + lab(630, 80, S.ims, 11, 'end') +
    rect(0, 122, 640, 22, '#f6e3d6', 0, 'stroke="#c3662f" stroke-width="2.5"') + lab(10, 137, S.im, 11, 'start') +
    rect(0, 144, 640, 116, '#fbeee4', 0) + lab(630, 252, S.mat, 12, 'end');
  const draw = () => {
    let d = '';
    if (s.mode <= 1){
      const broken = s.mode === 1;
      d += rect(0, 0, 640, 260, '#f6f8fa', 0) + lab(14, 24, S.cyt, 13, 'start');
      d += `<circle cx="230" cy="135" r="95" fill="#fbe9ee" stroke="#ae3347" stroke-width="3"${broken ? ' stroke-dasharray="18 10"' : ''}/>`;
      d += lab(230, 80, S.lum, 13);
      [[200, 120], [250, 110], [215, 160], [265, 150]].forEach(([x, y]) => { d += circ(x, y, 11, '#d45a72'); });
      d += lab(230, 200, S.hyd, 13);
      [[470, 90], [520, 140], [450, 180], [560, 200]].forEach(([x, y]) => { d += rect(x - 16, y - 9, 32, 18, '#c7d2dd', 5); });
      d += lab(510, 236, S.sub, 13);
      if (broken){
        [[360, 120], [395, 160], [380, 95]].forEach(([x, y]) => { d += circ(x, y, 10, '#d45a72'); });
        d += tr(320, 135, 420, 135) + lab(370, 70, S.leak, 13) + lab(400, 252, S.cat + ' → ' + S.death, 13).replace('<text ', `<text fill="${C4.red}" style="font-weight:700" `);
      } else d += lab(230, 252, S.ok, 13).replace('<text ', `<text fill="${C4.teal}" style="font-weight:700" `);
    } else if (s.mode === 2){
      d += mito();
      d += lab(10, 26, S.nadh_c + ' → ' + S.nad_c, 12, 'start') + lab(200, 26, S.oaa + ' → ' + S.mal, 12, 'start');
      d += tr(330, 36, 330, 170) + lab(338, 100, S.mal, 12, 'start');
      d += lab(330, 186, S.mal + ' → ' + S.oaa, 12) + lab(330, 206, S.nad_c + ' → ' + S.nadh_m, 12);
      d += conv(412, 202, 472, 202) + box(475, 186, 100, 32, S.c1, { size: q1F(13), fill: C4.amberFill, stroke: C4.amber, sw: 2.5 });
      d += tr(200, 170, 200, 36) + lab(208, 100, S.asp, 12, 'start');
    } else if (s.mode === 3){
      d += mito(false);
      d += lab(10, 26, S.nadh_c + ' → ' + S.nad_c, 12, 'start') + lab(630, 26, S.dhap + ' → ' + S.g3p, 12, 'end');
      d += tr(330, 34, 330, 92) + box(270, 92, 140, 34, S.gpd2, { size: q1F(13), fill: C4.amberFill, stroke: C4.amber, sw: 2.5 });
      d += conv(410, 112, 446, 128) + box(450, 122, 110, 30, S.q, { size: q1F(13), fill: '#fff', stroke: '#7f97ab' });
      d += box(70, 186, 110, 32, S.c1, { size: q1F(13), fill: '#fff', stroke: '#9aa7b3', dash: '6 5' }) + cross(176, 190);
    } else {
      d += mito();
      d += box(250, 34, 90, 34, S.tom, { size: q1F(13), fill: C4.amberFill, stroke: C4.amber, sw: 2.5 }) + box(250, 116, 90, 34, S.tim, { size: q1F(13), fill: C4.amberFill, stroke: C4.amber, sw: 2.5 });
      d += lab(285, 22, S.pre, 12, 'end') + tr(295, 8, 295, 34) + tr(295, 68, 295, 116) + tr(295, 150, 295, 200);
      d += lab(360, 140, S.dpsi, 13, 'start').replace('<text ', `<text fill="${C4.red}" style="font-weight:700" `) + lab(305, 220, S.mpp, 12, 'start');
    }
    const note = S.notes[s.mode];
    out(svg(d, S.title, 262, 640, note), result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q1i-mode', i => { s.mode = i; draw(); });
  draw();
};

Object.assign(MTH, {
  /* доставка сенсора: декстран эндоцитозом в лизосомы; белковый сенсор с MTS в матрикс */
  q1load(l){
    let d = q1tx(10, 22, 'А  ' + l.a, 14, 'start') + q1tx(330, 22, 'Б  ' + l.b, 14, 'start');
    d += line(20, 60, 300, 60, '#556171', 3) + q1tx(300, 44, l.dex, 12, 'end');
    [[40, 48], [70, 44], [100, 48]].forEach(([x, y]) => { d += circ(x, y, 6, '#2b8a2b'); });
    d += q1tr(110, 64, 110, 120, C4.muted, true) + q1tx(118, 100, l.endo, 12, 'start') + circ(110, 135, 16, '#fff', 'stroke="#7f97ab" stroke-width="2"') + circ(110, 135, 5, '#2b8a2b');
    d += q1tr(130, 140, 200, 175, C4.muted, true) + circ(225, 190, 30, '#fbe9ee', 'stroke="#ae3347" stroke-width="2.5"') + [[215, 185], [235, 195], [222, 202]].map(([x, y]) => circ(x, y, 5, '#2b8a2b')).join('') + q1tx(225, 238, l.lys, 12);
    d += q1tl(160, 258, l.chase, 11, 'middle', 300);
    d += rect(345, 50, 150, 36, '#eef3f7', 6, 'stroke="#6d8ba5"') + q1tx(420, 73, l.gene, 12);
    d += q1tr(495, 68, 535, 108, C4.muted, true) + q1tx(522, 80, l.import, 12, 'start');
    d += `<ellipse cx="540" cy="160" rx="85" ry="50" fill="#fbeee4" stroke="#c3662f" stroke-width="2.5"/>` + q1tx(540, 150, l.mito, 12) + circ(540, 175, 9, '#7fdc7f', 'stroke="#2b8a2b" stroke-width="2"');
    d += q1tx(415, 236, l.cyt, 12);
    return d;
  },
  /* ратиометрия: при вдвое большем количестве сенсора оба сигнала растут вдвое, отношение — то же */
  q1ratio(l, data){
    const f490 = pH => 1 / (1 + Math.pow(10, data.pk - pH)), f440 = () => 0.35;
    const X0 = 70, X1 = 330, Y0 = 220, Y1 = 40, gx = p => X0 + (p - 4) / 4 * (X1 - X0), gy = v => Y0 - v / 2.2 * (Y0 - Y1);
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    [4, 5, 6, 7, 8].forEach(p => { d += q1tx(gx(p), Y0 + 20, String(p), 13); });
    d += q1tx((X0 + X1) / 2, Y0 + 42, l.x, 13) + q1tx(X0, Y1 - 14, l.y, 13, 'start');
    const path = (f, A, c, dash) => `<path d="${Array.from({ length: 41 }, (_, i) => { const p = 4 + i / 10; return (i ? 'L' : 'M') + gx(p).toFixed(1) + ' ' + gy(A * f(p)).toFixed(1); }).join(' ')}" fill="none" stroke="${c}" stroke-width="3"${dash ? ' stroke-dasharray="7 5"' : ''}/>`;
    d += path(f490, 1, '#2b8a2b') + path(f440, 1, C4.purple) + path(f490, 2, '#2b8a2b', 1) + path(f440, 2, C4.purple, 1);
    d += q1tx(gx(7.9), gy(2 * f490(7.9)) - 10, l.e1, 12, 'end') + q1tx(gx(7.9), gy(0.7) - 10, l.e2, 12, 'end');
    const p = 5.0, r1 = f490(p) / f440(), r2 = 2 * f490(p) / (2 * f440());
    d += line(gx(p), Y1, gx(p), Y0, C4.amber, 2);
    d += q1tx(490, 60, l.lo, 13) + q1tx(490, 80, l.r + ' = ' + r1.toFixed(2).replace('.', ','), 13) + q1tx(490, 112, l.hi, 13) + q1tx(490, 132, l.r + ' = ' + r2.toFixed(2).replace('.', ','), 13);
    d += q1b(490, 168, l.same, 14).replace('<text ', `<text fill="${C4.teal}" `) + q1tl(490, 196, l.leg, 12, 'middle', 280);
    return d;
  },
  /* калибровка: точки «pH буфера — отношение» с нигерицином; измеренное отношение переводится в pH; выше 6,5 кривая пологая */
  q1calib(l, data){
    const R = pH => 0.4 + 3.2 / (1 + Math.pow(10, data.pk - pH));
    const X0 = 80, X1 = 560, Y0 = 220, Y1 = 40, gx = p => X0 + (p - 3.5) / 4 * (X1 - X0), gy = v => Y0 - v / 4 * (Y0 - Y1);
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    [4, 5, 6, 7].forEach(p => { d += q1tx(gx(p), Y0 + 20, String(p), 13); });
    [0, 2, 4].forEach(v => { d += q1tx(X0 - 8, gy(v) + 5, String(v), 13, 'end'); });
    d += q1tx((X0 + X1) / 2, Y0 + 42, l.x, 13) + q1tx(X0, Y1 - 14, l.y, 13, 'start');
    d += rect(gx(6.5), Y1, X1 - gx(6.5), Y0 - Y1, '#eef0f3', 0) + q1tl(gx(6.5) + (X1 - gx(6.5)) / 2, Y0 - 40, l.lim, 12, 'middle', X1 - gx(6.5));
    d += `<path d="${Array.from({ length: 41 }, (_, i) => { const p = 3.5 + i / 10; return (i ? 'L' : 'M') + gx(p).toFixed(1) + ' ' + gy(R(p)).toFixed(1); }).join(' ')}" fill="none" stroke="${C4.blue}" stroke-width="3"/>`;
    [4.0, 4.5, 5.0, 5.5, 6.0, 6.5].forEach(p => { d += circ(gx(p), gy(R(p)), 6, '#fff', `stroke="${C4.blue}" stroke-width="2.5"`); });
    const pm = 4.7, rm = R(pm);
    d += line(X0, gy(rm), gx(pm), gy(rm), C4.red, 2, 'stroke-dasharray="5 4"') + arrow(gx(pm), gy(rm), gx(pm), Y0 - 4, C4.red, 2);
    d += q1tx(X0 + 8, gy(rm) - 8, l.meas, 12, 'start') + q1b(gx(pm) + 8, Y0 - 12, l.res + ' ≈ 4,7', 13, 'start').replace('<text ', `<text fill="${C4.red}" `);
    d += q1tx(320, 284, l.iono, 12);
    return d;
  },
  /* редокс-сенсор Grx1-roGFP2: восстановленный и окисленный, калибровка по крайним точкам */
  q1redox(l){
    const barrel = (x, ox) => rect(x, 50, 90, 110, ox ? '#dbe9f7' : '#e7f6e7', 30, `stroke="${ox ? '#2d7fc1' : '#2b8a2b'}" stroke-width="2.5"`) +
      q1tx(x + 45, 100, l.ro, 13) + q1tx(x + 45, 130, ox ? l.ss : l.sh, 13) + rect(x + 90, 80, 58, 40, '#fbf3c9', 10, 'stroke="#b39b10" stroke-width="2"') + q1tx(x + 119, 105, l.grx, 12);
    let d = q1tx(85, 34, l.red, 14) + q1tx(415, 34, l.ox, 14);
    d += barrel(40, false) + barrel(370, true);
    d += arrow(230, 90, 340, 90, C4.ink, 2.5) + q1tx(285, 78, l.gssg, 12) + arrow(340, 125, 230, 125, C4.ink, 2.5) + q1tx(285, 145, l.gsh, 12);
    d += rect(40, 200, 560, 18, '#eef3f7', 6, 'stroke="#c8d6e2"') + rect(40, 200, 560, 18, 'url(#q1grad)', 6);
    d += `<defs><linearGradient id="q1grad"><stop offset="0" stop-color="#7fdc7f"/><stop offset="1" stop-color="#7aa7d6"/></linearGradient></defs>`;
    d += q1tx(40, 236, l.dtt, 12, 'start') + q1tx(600, 236, l.dia, 12, 'end') + q1tx(320, 262, l.deg, 12);
    return d;
  },
});

/* =====================================================================
   Схемы раздела 2 (локальная концентрация и градиенты). Новые W.<kind> с префиксом q2 и методы MTH.
   Числа схем q2profile, q2hill и q2camp — из модели практикума M2 (копируется из src/s2.js); подписи — только из lesson.widget.s.
   ===================================================================== */
const q2n = x => { if (!isFinite(x)) return '∞'; const a = Math.abs(x); const s = a >= 100 ? String(Math.round(x)) : a >= 10 ? x.toFixed(0) : a >= 1 ? x.toFixed(1) : a >= 0.1 ? x.toFixed(2) : x.toPrecision(2); return s.replace('.', ','); };
const q2lg = Math.log10;
/* на узком экране (≤ 760 px) подписи схем крупнее, чтобы после масштабирования SVG оставаться не мельче ~10 px */
const q2F = v => (small() ? Math.round(v * 1.45) : v);
const q2tx = (x, y, str, size = 14, anchor = 'middle') => tx(x, y, str, q2F(size), anchor);
const q2panel = (x, y, letter, title) => q2tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + q2tx(x + q2F(22), y, title, 15, 'start');
/* многострочная подпись с переносом по словам (ширина — в единицах viewBox) */
const q2tl = (x, y, str, size = 13, anchor = 'middle', width = 600) => {
  const per = Math.max(10, Math.floor(width / (q2F(size) * 0.56))), lines = [''];
  String(str).split(' ').forEach(w => { const L = lines[lines.length - 1]; if ((L + ' ' + w).trim().length > per) lines.push(w); else lines[lines.length - 1] = (L + ' ' + w).trim(); });
  return lines.map((t, i) => q2tx(x, y + i * q2F(size) * 1.25, t, size, anchor)).join('');
};
/* концентрация (М) → «17 нМ»: единицы берутся из подписей схемы */
function q2conc(M, u){ const steps = [[1e-9, 1e12, 0], [1e-6, 1e9, 1], [1e-3, 1e6, 2], [Infinity, 1e3, 3]]; const st = steps.find(s => M < s[0]); return q2n(M * st[1]) + nb + u[st[2]]; }
/* простая координатная сетка для графиков q2: x — линейная, y — линейная или логарифмическая */
function q2axes(o){
  const { x0 = 70, x1 = 610, y0 = 220, y1 = 30, maxX, ticksX, yTicks, yLab, xLab, ylog = false, ymin = 0, ymax = 100 } = o;
  const gx = x => x0 + x / maxX * (x1 - x0);
  const gy = ylog ? (v => y0 - (q2lg(Math.max(v, ymin)) - q2lg(ymin)) / (q2lg(ymax) - q2lg(ymin)) * (y0 - y1)) : (v => y0 - (v - ymin) / (ymax - ymin) * (y0 - y1));
  let d = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  ticksX.forEach(v => { d += line(gx(v), y1, gx(v), y0, '#e4ebf1', 1) + q2tx(gx(v), y0 + 20, String(v).replace('.', ','), 14); });
  yTicks.forEach(v => { d += line(x0, gy(v), x1, gy(v), '#e4ebf1', 1) + q2tx(x0 - 8, gy(v) + 5, String(v).replace('.', ','), 14, 'end'); });
  d += q2tx((x0 + x1) / 2, y0 + 42, xLab, 14) + q2tx(x0 - 4, y1 - 12, yLab, 14, 'start');
  return { d, gx, gy };
}
const q2path = (pts, color, w = 3.5, dash = '') => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;

/* local-conc: c = N/(N_A·V), общая и свободная прибавка на логарифмической шкале */
W.q2conc = ({ S, s, set, out, onGroup }) => {
  s.n ??= 1; s.v ??= 2; s.b ??= 2;
  set(S.title, S.status, buttonGroup('q2c-n', S.n_opts, s.n, S.n_l) + buttonGroup('q2c-v', S.v_opts, s.v, S.v_l) + buttonGroup('q2c-b', S.b_opts, s.b, S.b_l));
  const draw = () => {
    const N = S.n_vals[s.n], V = S.v_vals[s.v], fb = S.b_vals[s.b];
    const tot = N / (6.022e23 * V), free = tot * (1 - fb), bg = 1e-7;
    const X0 = 40, X1 = 610, lo = -12, hi = -1, gx = M => X0 + (q2lg(Math.max(M, 1e-12)) - lo) / (hi - lo) * (X1 - X0);
    let d = line(X0, 150, X1, 150, '#7f97ab', 2);
    [[1e-12, '1' + nb + S.u[0]], [1e-9, '1' + nb + S.u[1]], [1e-6, '1' + nb + S.u[2]], [1e-3, '1' + nb + S.u[3]]].forEach(([M, l]) => { d += line(gx(M), 144, gx(M), 156, '#7f97ab', 2) + q2tx(gx(M), 176, l, 14); });
    d += q2tx((X0 + X1) / 2, 200, S.axis, 14);
    d += line(gx(bg), 30, gx(bg), 150, C4.red, 2.5, 'stroke-dasharray="6 4"') + q2tx(X1, 20, S.bg, 13, 'end');
    d += q2tx(X0, 50, S.tot + ': ' + q2conc(tot, S.u), 14, 'start') + rect(X0, 58, Math.max(4, gx(tot) - X0), 20, C4.blue, 4);
    d += q2tx(X0, 102, S.free + ': ' + q2conc(free, S.u), 14, 'start') + rect(X0, 110, Math.max(4, gx(free) - X0), 20, C4.amber, 4);
    const note = free > bg ? S.note_high : S.note_low;
    out(svg(d, S.title, 210, 640, note),
      `<div class="metrics">${metric(S.m_tot, q2conc(tot, S.u))}${metric(S.m_free, q2conc(free, S.u))}${metric(S.m_ratio, '×' + q2n(free / bg))}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q2c-n', i => { s.n = i; draw(); }); onGroup('q2c-v', i => { s.v = i; draw(); }); onGroup('q2c-b', i => { s.b = i; draw(); });
  draw();
};

/* crowding: наблюдаемый белок в разбавленном растворе и в цитоплазме; качественная таблица и данные D для GFP */
W.q2crowd = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 1;
  set(S.title, S.status, buttonGroup('q2w-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    let d = rect(20, 30, 600, 150, '#f6f8fa', 12, 'stroke="#9db4c8" stroke-width="2"') + q2tx(320, 20, S.box[s.mode], 15);
    if (s.mode === 1) for (let i = 0; i < 60; i++) d += circ(36 + rnd() * 568, 44 + rnd() * 124, 9 + rnd() * 5, '#c7d2dd');
    [[120, 100], [300, 70], [470, 130], [560, 60]].forEach(([x, y]) => { d += circ(x, y, 10, C4.teal, 'stroke="#fff" stroke-width="2"'); });
    d += circ(40, 200, 7, C4.teal) + q2tx(54, 205, S.probe, 14, 'start');
    if (s.mode === 1) d += circ(260, 200, 9, '#c7d2dd') + q2tx(276, 205, S.crowd, 14, 'start');
    out(svg(d, S.title, 215, 640, S.notes[s.mode]), tbl(S.head, s.mode ? S.rows : S.rows0) + result(`<p>${esc(S.notes[s.mode])}</p>`));
  };
  onGroup('q2w-mode', i => { s.mode = i; draw(); });
  draw();
};

/* source-sink: профиль M2.basic при выбранных D и k (логарифмические шаги); исходный профиль для сравнения */
W.q2profile = ({ S, s, set, out, onRange }) => {
  const DV = [0.1, 0.3, 1, 3, 10, 30, 100, 300], KV = [0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000];
  s.d ??= 4; s.k ??= 4;
  set(S.title, S.status, '<div class="controls">' + slider('q2p-d', S.D, 0, DV.length - 1, s.d, 1, '') + slider('q2p-k', S.k, 0, KV.length - 1, s.k, 1, '') + '</div>');
  const draw = () => {
    $('q2p-d-value').textContent = q2n(DV[s.d]); $('q2p-k-value').textContent = q2n(KV[s.k]);
    const r = M2.basic(DV[s.d], KV[s.k], 4, 0.3), r0 = M2.basic(10, 1, 4, 0.3);
    const A = q2axes({ maxX: 20, ticksX: [0, 5, 10, 15, 20], yTicks: [0, 25, 50, 75, 100], yLab: S.y, xLab: S.x });
    const pts = rr => Array.from({ length: 201 }, (_, i) => [A.gx(i / 10), A.gy(100 * rr.c(i / 10))]);
    let d = A.d + q2path(pts(r0), C4.gray, 3, '7 5') + q2path(pts(r), C4.orange, 4);
    d += line(300, 60, 330, 60, C4.orange, 4) + q2tx(336, 65, S.cur, 14, 'start') + line(300, 86, 330, 86, C4.gray, 3, 'stroke-dasharray="7 5"') + q2tx(336, 91, S.ref, 13, 'start');
    const note = fmt(S.note, { lam: q2n(r.lam) });
    out(svg(d, S.title, 272, 640, note),
      `<div class="metrics">${metric(S.m_lam, q2n(r.lam))}${metric(S.m_c1, String(Math.round(100 * r.c1)))}${metric(S.m_c5, String(Math.round(100 * r.c5)))}${metric(S.m_mean, String(Math.round(100 * r.mean)))}</div>` +
      result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onRange('q2p-d', v => { s.d = v; draw(); }); onRange('q2p-k', v => { s.k = v; draw(); });
  draw();
};

/* threshold: (а) ответ эффектора вдоль градиента M2.basic(10, 1, n, K); (б) ультрасенситивность нулевого порядка (Goldbeter и Koshland 1981) */
const q2gk = (u, J) => { const v = 1, K = J, B = v - u + v * J + u * K; return 2 * u * K / (B + Math.sqrt(B * B - 4 * (v - u) * u * K)); };
W.q2hill = ({ S, s, set, out, onGroup, onRange }) => {
  const NV = [1, 2, 4], KV = [0.1, 0.3, 0.6], JV = [1, 0.1, 0.01], UV = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.4, 1.7, 2];
  s.mode ??= 0; s.n ??= 2; s.K ??= 1; s.J ??= 2; s.u ??= 6;
  const build = () => {
    const mg = buttonGroup('q2h-mode', S.modes, s.mode, S.modes_label);
    const ctl = s.mode === 0 ? buttonGroup('q2h-n', S.n_opts, s.n, S.n_l) + buttonGroup('q2h-K', S.K_opts, s.K, S.K_l)
                             : buttonGroup('q2h-J', S.J_opts, s.J, S.J_l) + '<div class="controls">' + slider('q2h-u', S.u_l, 0, UV.length - 1, s.u, 1, '') + '</div>';
    set(S.title, s.mode === 0 ? S.status_a : S.status_b, mg + ctl);
    onGroup('q2h-mode', i => { s.mode = i; build(); });
    if (s.mode === 0){ onGroup('q2h-n', i => { s.n = i; draw(); }); onGroup('q2h-K', i => { s.K = i; draw(); }); }
    else { onGroup('q2h-J', i => { s.J = i; draw(); }); onRange('q2h-u', v => { s.u = v; draw(); }); }
    draw();
  };
  const draw = () => {
    if (s.mode === 0){
      const r = M2.basic(10, 1, NV[s.n], KV[s.K]);
      const A = q2axes({ maxX: 20, ticksX: [0, 5, 10, 15, 20], yTicks: [0, 50, 100], yLab: S.y, xLab: S.x });
      const P = f => Array.from({ length: 201 }, (_, i) => [A.gx(i / 10), A.gy(100 * f(i / 10))]);
      let d = A.d + line(A.gx(0), A.gy(100 * KV[s.K]), A.gx(20), A.gy(100 * KV[s.K]), C4.teal, 1.5, 'stroke-dasharray="2 4"');
      d += line(A.gx(r.w), A.gy(100), A.gx(r.w), A.gy(0), C4.red, 2, 'stroke-dasharray="6 4"');
      d += q2path(P(r.c), C4.orange, 4) + q2path(P(r.R), C4.teal, 3.5, '8 5');
      d += line(330, 50, 360, 50, C4.orange, 4) + q2tx(366, 55, S.c, 14, 'start') + line(330, 74, 360, 74, C4.teal, 3.5, 'stroke-dasharray="8 5"') + q2tx(366, 79, S.r, 14, 'start');
      /* переходная зона 90 → 10 %: если ответ нигде не достигает 90 % (высокий K½ или n = 1), ширину не выводим — как в практикуме */
      const tz = r.r0 < 0.9 ? (isFinite(r.x10) ? S.tz_low : S.tz_mid) : isFinite(r.x10) ? q2n(r.tz) : S.tz_none, r10 = r.r10 < 0.001 ? '< 0,1' : r.r10 < 0.1 ? (100 * r.r10).toFixed(1).replace('.', ',') : String(Math.round(100 * r.r10));
      out(svg(d, S.title, 272, 640, S.note_a), `<div class="metrics">${metric(S.m_w, q2n(r.w))}${metric(S.m_tz, tz)}${metric(S.m_r10, r10)}</div>` + result(`<p>${esc(S.note_a)}</p>`));
    } else {
      $('q2h-u-value').textContent = q2n(UV[s.u]);
      const A = q2axes({ maxX: 2, ticksX: [0, 0.5, 1, 1.5, 2], yTicks: [0, 50, 100], yLab: S.yb, xLab: S.xb });
      let d = A.d;
      JV.forEach((J, j) => { const pts = Array.from({ length: 196 }, (_, i) => { const u = 0.05 + i / 100; return [A.gx(u), A.gy(100 * q2gk(u, J))]; }); d += q2path(pts, j === s.J ? C4.purple : '#c9d3dd', j === s.J ? 4 : 2.5); });
      const u = UV[s.u], w = q2gk(u, JV[s.J]);
      d += `<circle cx="${A.gx(u).toFixed(1)}" cy="${A.gy(100 * w).toFixed(1)}" r="8" fill="#fff" stroke="${C4.purple}" stroke-width="3.5"/>`;
      out(svg(d, S.title, 272, 640, S.note_b), `<div class="metrics">${metric(S.m_p, String(Math.round(100 * w)))}</div>` + result(`<p>${esc(S.note_b)}</p>`));
    }
  };
  build();
};

/* camp-domains: модель практикума M2.cell; профиль cAMP на логарифмической шкале */
W.q2camp = ({ S, s, set, out, onCheck }) => {
  s.A ??= true; s.B ??= false; s.I ??= false; s.H ??= false;
  set(S.title, S.status, '<div class="controls">' + check('q2m-A', S.tA, s.A) + check('q2m-B', S.tB, s.B) + check('q2m-I', S.tI, s.I) + check('q2m-H', S.tH, s.H) + '</div>');
  const pi = v => v < 0.005 ? S.lt1 : String(Math.round(100 * v));
  const draw = () => {
    const r = M2.cell(s);
    const A = q2axes({ y0: 250, y1: 70, maxX: 20, ticksX: [0, 5, 10, 15, 20], yTicks: [1, 3, 10, 30, 100], yLab: S.y, xLab: S.x, ylog: true, ymin: 0.5, ymax: 100 });
    let d = rect(A.gx(0) - 2, 22, 34, 20, s.A ? C4.amberFill : '#fff', 5, `stroke="${s.A ? C4.amber : '#6d8ba5'}" stroke-width="2"`) + q2tx(A.gx(0) + 40, 37, S.domA, 13, 'start');
    d += rect(A.gx(20) - 32, 22, 34, 20, s.B ? C4.amberFill : '#fff', 5, `stroke="${s.B ? C4.amber : '#6d8ba5'}" stroke-width="2"`) + q2tx(A.gx(20) - 40, 37, S.domB, 13, 'end');
    d += A.d;
    /* Подписи K½ и средней (аудит v1.0 S1-20; второй раунд R2-02). Каждая подпись ставится над или под своей линией в одном из
       нескольких положений по оси x; выбирается первое положение, где рамка подписи не пересекает вторую штриховую линию, кривую профиля,
       линию мишени и уже поставленную подпись. Размер рамки — от фактического шрифта (на телефоне он крупнее). */
    const yK = A.gy(r.K), yM = A.gy(r.mean), fs = q2F(13);
    const lw = str => { try { const g = (W._q2cv ??= document.createElement('canvas').getContext('2d')); g.font = fs + 'px ' + getComputedStyle(document.body).fontFamily; return g.measureText(str).width + 2; } catch (e) { return str.length * fs * 0.56; } };
    const curve = Array.from({ length: 201 }, (_, i) => [A.gx(i / 10), A.gy(r.c(i / 10))]);
    const hitBox = (bx, others) => others.some(o => bx.x0 < o.x1 && o.x0 < bx.x1 && bx.y0 < o.y1 && o.y0 < bx.y1);
    const nCurve = bx => curve.filter(([x, y]) => x > bx.x0 - 2 && x < bx.x1 + 2 && y > bx.y0 - 2 && y < bx.y1 + 2).length;
    const hitCurve = bx => nCurve(bx) > 0;
    /* порядок выбора: свободное место → место, где подпись пересекает только кривую, и как можно меньше (подпись на белом ореоле) → первое допустимое; цвет подписи — цвет её линии */
    const place = (yL, str, xs, anchor, others) => {
      const w = lw(str); let first = null, soft = null;
      for (const x of xs) for (const side of [-1, 1]) {
        const base = side < 0 ? yL - 7 : yL + fs + 2;
        const x0 = anchor === 'start' ? x : x - w, bx = { x0, x1: x0 + w, y0: base - fs * 0.96, y1: base + fs * 0.26, x, base };
        if (bx.x0 < A.gx(r.xt) + 4 || bx.x1 > A.gx(20) + 2) continue;
        if (!first) first = bx;
        if (hitBox(bx, others)) continue;
        bx.n = nCurve(bx); if (!bx.n) return bx;
        if (!soft || bx.n < soft.n) soft = bx;   /* из мест, где мешает только кривая, — с наименьшим пересечением */
      }
      return soft || first;
    };
    const halo = (t, col) => t.replace('<text ', `<text style="fill:${col};paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round" `);
    const lineBox = y => ({ x0: A.gx(0), x1: A.gx(20), y0: y - 1.5, y1: y + 1.5 });
    const xsK = Array.from({ length: 17 }, (_, i) => A.gx(1.2 + 0.8 * i)), xsM = Array.from({ length: 19 }, (_, i) => A.gx(20 - 0.8 * i) - 4);
    const kB = place(yK, S.k12, xsK, 'start', [lineBox(yM)]);
    const mB = place(yM, S.mean, xsM, 'end', [lineBox(yK), kB]);
    d += line(A.gx(0), yK, A.gx(20), yK, C4.teal, 1.5, 'stroke-dasharray="2 4"') + halo(q2tx(kB.x, kB.base, S.k12, 13, 'start'), C4.teal).replace('<text ', '<text data-lab="k12" ');
    d += line(A.gx(r.xt), A.gy(100), A.gx(r.xt), A.gy(0.5), C4.orange, 2) + q2tx(A.gx(r.xt) + 6, A.gy(0.5) - 8, S.tg, 13, 'start');
    d += q2path(Array.from({ length: 201 }, (_, i) => [A.gx(i / 10), A.gy(r.c(i / 10))]), C4.amber, 4);
    /* средний уровень — поверх профиля: в покое профиль совпадает со средним, и штриховая линия должна оставаться видна */
    d += line(A.gx(0), yM, A.gx(20), yM, C4.muted, 2.5, 'stroke-dasharray="8 6"') + halo(q2tx(mB.x, mB.base, S.mean, 13, 'end'), '#5b6b7d').replace('<text ', '<text data-lab="mean" ');
    const key = s.H ? 'H' : s.I ? 'I' : s.A ? 'A' : s.B ? 'B' : 'rest';
    const note = fmt(S.notes[key], { m: q2n(r.mean), ct: q2n(r.ct), lam: q2n(r.lam), ph: pi(r.ph) });
    out(svg(d, S.title, 300, 640, note),
      `<div class="metrics">${metric(S.m_mean, '×' + q2n(r.mean))}${metric(S.m_ct, '×' + q2n(r.ct))}${metric(S.m_amt, Math.round(100 * r.amt) + nb + '%')}${metric(S.m_ph, pi(r.ph) + nb + '%')}</div>` +
      result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  ['A', 'B', 'I', 'H'].forEach(x => onCheck('q2m-' + x, v => { s[x] = v; draw(); }));
  draw();
};

/* ran-gradient: ядро слева, цитоплазма справа, пора в оболочке; этапы цикла */
W.q2ran = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q2r-mode', S.modes, s.mode, S.modes_label));
  const gtp = (x, y) => circ(x, y, 15, C4.amberFill, `stroke="${C4.amber}" stroke-width="2.5"`) + q2tx(x, y + 5, 'T', 13);
  const gdp = (x, y) => circ(x, y, 15, '#fff', `stroke="${C4.gray}" stroke-width="2.5"`) + q2tx(x, y + 5, 'D', 13);
  const draw = () => {
    let d = '';
    if (s.mode < 3){
      d += rect(10, 30, 290, 230, '#eef0f7', 16, 'stroke="#97a0ba" stroke-width="3"') + q2tx(30, 54, S.nuc, 15, 'start') + q2tx(620, 54, S.cyt, 15, 'end');
      d += rect(296, 120, 10, 50, '#fff', 2) + q2tx(330, 285, S.pore, 13, 'middle');
      d += line(301, 172, 318, 270, C4.muted, 1.2);
      d += rect(40, 190, 120, 50, '#dfe3ee', 20) + q2tx(100, 220, S.chrom, 13);
      d += box(170, 200, 80, 30, S.rcc1, { fill: C4.amberFill, stroke: C4.amber, size: q2F(14), sw: 2.5 });
      d += box(420, 200, 180, 34, S.gap, { fill: C4.amberFill, stroke: C4.amber, size: q2F(14), sw: 2.5 });
    }
    if (s.mode === 0){
      [[80, 90], [150, 120], [220, 90], [120, 160], [240, 160]].forEach(([x, y]) => { d += gtp(x, y); });
      [[380, 90], [470, 120], [560, 90], [520, 160]].forEach(([x, y]) => { d += gdp(x, y); });
      d += gtp(420, 160);
      d += q2tx(210, 260, S.exch, 13) + q2tx(510, 260, S.hydr, 13);
      d += q2tx(630, 288, 'T — ' + S.rangtp + ',  D — ' + S.rangdp, 13, 'end');
    } else if (s.mode === 1){
      d += box(470, 80, 90, 30, S.imp, { fill: '#e8f3f1', stroke: C4.teal, size: q2F(14) }) + box(565, 80, 55, 30, S.cargo, { fill: '#f3ecfb', stroke: C4.purple, size: q2F(13) });
      d += q2tx(530, 130, S.bind, 13);
      d += arrow(460, 95, 320, 145, C4.blue, 3) + arrow(290, 145, 200, 110, C4.blue, 3);
      d += box(70, 75, 90, 30, S.imp, { fill: '#e8f3f1', stroke: C4.teal, size: q2F(14) }) + gtp(175, 90) + box(60, 135, 55, 30, S.cargo, { fill: '#f3ecfb', stroke: C4.purple, size: q2F(13) });
      d += q2tx(155, 180, S.release, 13);
    } else if (s.mode === 2){
      d += box(70, 75, 90, 30, S.imp, { fill: '#e8f3f1', stroke: C4.teal, size: q2F(14) }) + gtp(175, 90);
      d += arrow(200, 95, 290, 135, C4.blue, 3) + arrow(320, 135, 430, 100, C4.blue, 3);
      d += box(440, 80, 90, 30, S.imp, { fill: '#e8f3f1', stroke: C4.teal, size: q2F(14) }) + gdp(550, 95) + arrow(560, 120, 560, 190, C4.muted, 2, '6 5') + q2tx(575, 160, S.hydr, 13, 'start');
      d += box(440, 140, 60, 26, S.ntf2, { fill: '#fff', stroke: C4.blue, size: q2F(13) }) + gdp(520, 153);
      d += arrow(430, 160, 320, 160, C4.blue, 3) + arrow(290, 160, 200, 165, C4.blue, 3) + gdp(180, 165) + arrow(180, 185, 200, 200, C4.muted, 2, '6 5');
      d += q2tx(80, 150, S.exch, 13);
    } else {
      d += rect(10, 30, 620, 230, '#f6f8fa', 16, 'stroke="#c8d6e2" stroke-width="2"') + q2tx(30, 54, S.cyt, 15, 'start');
      d += `<ellipse cx="320" cy="150" rx="120" ry="85" fill="#fbe9c2" opacity=".6"/>`;
      d += rect(280, 110, 80, 80, '#dfe3ee', 14) + q2tx(320, 155, S.chromos, 13) + box(290, 95, 60, 24, S.rcc1, { fill: C4.amberFill, stroke: C4.amber, size: q2F(12) });
      [[230, 120], [410, 120], [320, 220], [230, 190], [410, 190]].forEach(([x, y]) => { d += gtp(x, y); });
      for (let i = 0; i < 7; i++){ const a = Math.PI * (0.15 + i * 0.1); d += line(320 - 170 * Math.cos(a), 150 - 90 * Math.sin(a) + 90, 320 - 40 * Math.cos(a), 150, '#145c96', 1.5, 'opacity=".45"'); }
      d += q2tx(520, 90, S.free, 13) + q2tx(520, 250, S.spindle, 13);
    }
    const note = S.notes[s.mode];
    out(svg(d, S.title, 295, 640, note), result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q2r-mode', i => { s.mode = i; draw(); });
  draw();
};

Object.assign(MTH, {
  /* FRET-сенсор cAMP (Epac1-camps): без cAMP белки близко и энергия переносится, с cAMP — дальше, светится CFP */
  q2fret(l){
    const sensor = (x, near, bound) => {
      const dx = near ? 40 : 75, c2 = x + dx * 2;
      return line(x + 24, 110, c2 - 24, 110, '#6d8ba5', 3) + rect(x + dx - 18, 96, 36, 28, '#eef3f7', 6, 'stroke="#6d8ba5" stroke-width="2"') + (bound ? circ(x + dx, 110, 7, C4.orange) : '') +
        circ(x, 110, 24, '#d9ecfb', 'stroke="#2d7fc1" stroke-width="2.5"') + q2tx(x, 115, l.cfp, 13) +
        circ(c2, 110, 24, '#fbf3c9', 'stroke="#b39b10" stroke-width="2.5"') + q2tx(c2, 115, l.yfp, 13) + q2tx(x + dx, 160, l.dom, 12);
    };
    let d = q2panel(10, 24, 'А', l.a) + q2panel(330, 24, 'Б', l.b);
    d += sensor(70, true, false) + arrow(70, 76, 140, 76, C4.purple, 2.5, '5 4') + q2tx(105, 64, l.fret, 12) + q2tx(150, 185, l.em1 + ' ↑', 13);
    d += sensor(380, false, true) + q2tx(455, 76, l.camp, 12) + q2tx(380, 185, l.em2 + ' ↑', 13);
    d += q2tx(320, 215, l.ex, 12);
    d += q2tl(320, 240, l.ratio, 13);
    return d;
  },
  /* сенсор с одним флуоресцентным белком: яркость меняется при связывании */
  q2single(l){
    let d = q2panel(10, 24, 'А', l.a) + q2panel(330, 24, 'Б', l.b);
    d += circ(120, 100, 30, '#e7f6e7', 'stroke="#5b9a5b" stroke-width="2.5"') + rect(152, 88, 50, 24, '#eef3f7', 6, 'stroke="#6d8ba5" stroke-width="2"') + q2tx(120, 150, l.fp, 12) + q2tx(120, 172, l.dim, 14);
    d += circ(440, 100, 30, '#7fdc7f', 'stroke="#2b8a2b" stroke-width="3"') + rect(472, 88, 50, 24, '#eef3f7', 6, 'stroke="#6d8ba5" stroke-width="2"') + circ(497, 100, 7, C4.orange) + q2tx(440, 150, l.fp, 12) + q2tx(440, 172, l.bright, 14);
    d += q2tx(205, 60, l.dom, 12) + q2tx(515, 60, l.lig, 12);
    d += q2tl(320, 205, l.warn, 13);
    return d;
  },
  /* FRAP: три кадра и кривая восстановления */
  q2frap(l){
    let d = q2tx(165, 24, l.spot, 13);
    [[l.a, 1], [l.b, 0], [l.c, 0.8]].forEach(([t, v], i) => {
      const x = 15 + i * 105; d += rect(x, 36, 95, 95, '#10151b', 6) + `<circle cx="${x + 47}" cy="84" r="20" fill="#7fdc7f" opacity="${(0.15 + 0.85 * v).toFixed(2)}"/>` + `<circle cx="${x + 47}" cy="84" r="20" fill="none" stroke="#fff" stroke-dasharray="4 3"/>` + q2tl(x + 47, 150, t, 12, 'middle', 100);
    });
    const x0 = 350, x1 = 620, y0 = 200, y1 = 50, gx = t => x0 + t * (x1 - x0), gy = v => y0 - v * (y0 - y1);
    d += line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5) + q2tx((x0 + x1) / 2, y0 + 22, l.x, 13) + q2tx(x0, y1 - 12, l.y, 13, 'start');
    const pts = [[gx(0), gy(1)], [gx(0.15), gy(1)]]; for (let i = 0; i <= 85; i++){ const t = 0.15 + i / 100; pts.push([gx(t), gy(0.8 * (1 - Math.exp(-(t - 0.15) / 0.12)))]); }
    d += q2path(pts, '#2b8a2b', 3.5);
    d += line(x0, gy(0.8), x1, gy(0.8), C4.muted, 1.5, 'stroke-dasharray="5 4"') + line(x0, gy(1), x1, gy(1), C4.muted, 1.5, 'stroke-dasharray="5 4"');
    d += q2tx(x1 - 4, gy(0.8) + 18, l.mob, 12, 'end') + q2tx(x1 - 4, gy(1) + 14, l.imm, 12, 'end');
    d += q2tx(x0 + 135, 248, l.t12, 12, 'middle');
    return d;
  },
  /* сенсор буферирует: свободный cAMP при разном количестве сенсора (равновесное связывание, Kd = 1) */
  q2buf(l, data){
    const { Kd, camp } = data;
    const freeC = Stot => { const b = Stot + Kd - camp; return (-b + Math.sqrt(b * b + 4 * Kd * camp)) / 2; };   /* свободный лиганд при общем лиганде camp */
    const x0 = 80, x1 = 600, y0 = 180, y1 = 30, maxS = 20, gx = v => x0 + v / maxS * (x1 - x0), gy = v => y0 - v / 100 * (y0 - y1);
    let d = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
    [0, 5, 10, 15, 20].forEach(v => { d += q2tx(gx(v), y0 + 20, String(v), 13); });
    [0, 50, 100].forEach(v => { d += line(x0, gy(v), x1, gy(v), '#e4ebf1', 1) + q2tx(x0 - 8, gy(v) + 5, String(v), 13, 'end'); });
    d += q2tx((x0 + x1) / 2, y0 + 40, l.x, 13) + q2tx(x0 - 4, y1 - 12, l.y, 13, 'start');
    const pts = Array.from({ length: 101 }, (_, i) => { const S0 = i / 5; return [gx(S0), gy(100 * freeC(S0) / camp)]; });
    d += q2path(pts, C4.orange, 3.5);
    [[0.5, l.lo], [10, l.hi]].forEach(([S0, t]) => { const v = 100 * freeC(S0) / camp; d += `<circle cx="${gx(S0).toFixed(1)}" cy="${gy(v).toFixed(1)}" r="6" fill="#fff" stroke="${C4.orange}" stroke-width="3"/>` + q2tx(gx(S0) + 10, gy(v) - 10, t + ': ' + Math.round(v) + nb + '%', 13, 'start'); });
    return d;
  },
  /* проверка достаточности: FKBP–FRB + рапамицин; фотоактивируемая аденилатциклаза */
  q2cid(l){
    let d = q2panel(10, 24, 'А', l.a) + q2panel(330, 24, 'Б', l.b);
    const bx = (x, y, w, t, on) => rect(x, y, w, 28, on ? C4.amberFill : '#eef3f7', 6, `stroke="${on ? C4.amber : '#6d8ba5'}" stroke-width="2"`) + q2tx(x + w / 2, y + 19, t, 12);
    d += line(20, 214, 315, 214, '#556171', 5) + q2tx(30, 236, l.mem, 13, 'start');
    d += bx(30, 184, 62, l.frb) + bx(30, 56, 62, l.fkbp) + bx(94, 56, 86, l.enz, true);
    d += arrow(100, 92, 170, 146, C4.blue, 3) + q2tx(140, 110, l.rapa + ', ' + l.min, 12, 'start');
    d += bx(165, 156, 62, l.fkbp) + bx(165, 184, 62, l.frb) + bx(229, 156, 86, l.enz, true);
    d += bx(345, 64, 80, l.bpac) + q2tx(345, 112, l.dark, 12, 'start');
    d += arrow(385, 128, 385, 156, '#2d7fc1', 3) + q2tx(395, 142, l.light, 12, 'start');
    d += bx(345, 160, 80, l.bpac, true) + q2tx(435, 179, l.on, 12, 'start');
    [[440, 212], [460, 224], [480, 212]].forEach(([x, y]) => { d += circ(x, y, 5, C4.orange); });
    d += q2tx(495, 222, l.camp, 12, 'start');
    return d;
  },
});

/* =====================================================================
   Схемы раздела 3 (фосфоинозитиды). Новые W.<kind> с префиксом q3 и методы MTH.
   Числа берутся из модели практикума M3 (копируется из src/s3.js); подписи — только из lesson.widget.s.
   ===================================================================== */
const Q3C = { pip2: '#c0561b', pi4p: '#0d6e73', pi3p: '#6748b6', pi35: '#ae3a6c', pip3: '#b8860b', pm: '#556171', golgi: '#0d6e73', ee: '#6748b6', le: '#ae3a6c', sensor: '#2c7b45' };
const q3r = x => String(Math.round(x));

/* Липидный код: головная группа (схема кольца с положениями 3, 4, 5), карта меток по мембранам (модель M3), асимметрия монослоёв */
W.q3code = ({ S, s, set, out, onGroup }) => {
  s.view ??= 0; s.lip ??= 4;
  const LIPS = ['pi', 'pi3p', 'pi4p', 'pi35', 'pip2', 'pip3'];
  const PH = { pi: [], pi3p: [3], pi4p: [4], pi35: [3, 5], pip2: [4, 5], pip3: [3, 4, 5] };
  const KEY = { pi: null, pi3p: 'pi3p', pi4p: 'pi4p', pi35: 'pi35', pip2: 'pip2', pip3: 'pip3' };
  const controls = () => buttonGroup('q3c-view', S.views, s.view, S.view_label) + (s.view < 2 ? buttonGroup('q3c-lip', S.lips, s.lip, S.lip_label) : buttonGroup('q3c-scr', S.scr, s.scr ?? 0, S.scr_label));
  const draw = () => {
    set(S.title, S.status[s.view], controls());
    onGroup('q3c-view', i => { s.view = i; draw(); });
    if (s.view < 2) onGroup('q3c-lip', i => { s.lip = i; draw(); }); else onGroup('q3c-scr', i => { s.scr = i; draw(); });
    const lip = LIPS[s.lip];
    let d = '', note, metrics = '';
    if (s.view === 0){
      /* схема: шестиугольник инозитола, положение 1 связано с фосфатом и диацилглицеролом; P — на положениях 3, 4, 5 */
      const cx = 330, cy = 140, R = 62;
      const pt = k => { const a = Math.PI / 180 * (150 - (k - 1) * 60); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
      const poly = [1, 2, 3, 4, 5, 6].map(k => pt(k).map(v => v.toFixed(1)).join(',')).join(' ');
      d += `<polygon points="${poly}" fill="#f6f8fa" stroke="#556171" stroke-width="3"/>`;
      [1, 2, 3, 4, 5, 6].forEach(k => { const [x, y] = pt(k), ox = (x - cx) * 0.62, oy = (y - cy) * 0.62;
        d += tx(cx + ox, cy + oy + 5, String(k), 15, 'middle'); });
      const [x1, y1] = pt(1);
      d += line(x1, y1, x1 - 70, y1 + 50, '#556171', 3) + circ(x1 - 70, y1 + 50, 14, '#fff', 'stroke="#556171" stroke-width="2.5"') + tx(x1 - 70, y1 + 55, 'P', 13, 'middle');
      d += line(x1 - 84, y1 + 50, x1 - 150, y1 + 50, '#556171', 3) + rect(x1 - 262, y1 + 34, 112, 32, '#eef3f7', 8, 'stroke="#556171" stroke-width="2"') + tx(x1 - 206, y1 + 55, S.dag, 13, 'middle');
      PH[lip].forEach(k => { const [x, y] = pt(k), dx = (x - cx) / R, dy = (y - cy) / R, px = x + dx * 42, py = y + dy * 42;

/* Коинцидентное узнавание: f = fA·fB (модель M3) и, для сравнения, кооперативная кривая (Хилл 4) */
W.q3coin = ({ S, s, set, out, onGroup }) => {
  s.rab ??= 0; s.v ??= 0; s.cmp ??= 0;
  const RABS = ['wt', 'sn', 'ql'], VS = [1, 0.5, 0.1];
  set(S.title, S.status, buttonGroup('q3k-rab', S.rabs, s.rab, S.rab_label) + buttonGroup('q3k-v', S.vs, s.v, S.v_label) + buttonGroup('q3k-cmp', S.cmps, s.cmp, S.cmp_label));
  const draw = () => {
    const rab = RABS[s.rab], p = M3.pi3pEE(VS[s.v]), fa = M3.fA(p), fb = M3.RAB[rab], f = fa * fb;
    const cur = rb => ({ pts: Array.from({ length: 41 }, (_, i) => { const x = i * 5; return [x, 100 * M3.fA(x) * M3.RAB[rb]]; }), color: rb === 'ql' ? '#2c7b45' : rb === 'wt' ? '#145c96' : '#ae3347', label: S.lg[RABS.indexOf(rb)] });
    const series = [cur('ql'), cur('wt'), cur('sn')];
    if (s.cmp) { const K = 40, n = 4, A = M3.RAB[rab]; series.push({ pts: Array.from({ length: 41 }, (_, i) => { const x = i * 5; return [x, 100 * A * Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n))]; }), color: '#c3662f', dash: '7 5', label: S.lg_coop }); }
    const ch = chart(series, { xLabel: S.x, yLabel: S.y, maxX: 200, maxY: 100, ticksX: 4, ticksY: 4, title: S.title, marks: [[p, 100 * f, '#c98a0b']] });
    const note = S.notes[s.cmp];
    out(ch, `<div class="metrics">${metric(S.m_fa, p0(fa))}${metric(S.m_fb, p0(fb))}${metric(S.m_f, p0(f))}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q3k-rab', i => { s.rab = i; draw(); });
  onGroup('q3k-v', i => { s.v = i; draw(); });
  onGroup('q3k-cmp', i => { s.cmp = i; draw(); });
  draw();
};

Object.assign(MTH, {
  /* сенсор на домене: связывание с мембраной, конкуренция с эффектором, дополнительное условие (Arf1) */
  q3sensor(l){
    let d = '';
    [[0, l.pA, l.a], [215, l.pB, l.b], [430, l.pC, l.c]].forEach(([ox, P, title], k) => {
      d += MTH.panel(ox + 6, 22, P, '') + MTH.tl(ox + 105, 22, title, 13);
      d += line(ox + 10, 180, ox + 200, 180, '#556171', 4);
      [0, 1, 2, 3, 4].forEach(i => { d += circ(ox + 30 + i * 38, 172, 6, k === 2 && i > 1 ? '#0d6e73' : k === 2 ? '#0d6e73' : Q3C.pip2); });
      if (k === 0){ [0, 2, 4].forEach(i => { d += rect(ox + 18 + i * 38, 136, 26, 26, '#e3f1e6', 6, `stroke="${Q3C.sensor}" stroke-width="2"`); }); d += rect(ox + 70, 90, 26, 26, '#fff', 6, `stroke="${Q3C.sensor}" stroke-width="2"`); }
      if (k === 1){ [0, 1, 2, 3, 4].forEach(i => { d += rect(ox + 18 + i * 38, 136, 26, 26, '#e3f1e6', 6, `stroke="${Q3C.sensor}" stroke-width="2"`); }); d += rect(ox + 70, 80, 66, 26, '#fbe9c2', 6, `stroke="${C4.amber}" stroke-width="2"`) + tx(ox + 103, 98, l.eff, 11, 'middle') + cross(ox + 144, 80); }
      if (k === 2){ d += rect(ox + 18, 136, 26, 26, '#e3f1e6', 6, `stroke="${Q3C.sensor}" stroke-width="2"`) + rect(ox + 46, 150, 20, 12, '#fbe9c2', 3, `stroke="${C4.amber}"`) + tx(ox + 56, 205, l.arf, 11, 'middle');
        d += rect(ox + 120, 90, 26, 26, '#fff', 6, `stroke="${Q3C.sensor}" stroke-width="2"`) + tx(ox + 150, 205, l.noarf, 11, 'middle'); }
      d += MTH.tl(ox + 105, 236, l['res' + k], 12);
    });
    return d;
  },
  /* липидомика: экстракт всей клетки → масс-спектр; локализация и региоизомеры теряются */
  q3lipidomics(l){
    let d = `<ellipse cx="110" cy="130" rx="90" ry="70" fill="#f6f8fa" stroke="#556171" stroke-width="2.5"/>`;
    [[70, 100, Q3C.pip2], [140, 160, Q3C.pi4p], [90, 165, Q3C.pi3p], [150, 95, Q3C.pi35]].forEach(([x, y, c]) => { d += circ(x, y, 9, c); });
    d += tx(120, 225, l.cell, 13, 'middle');
    d += arrow(210, 130, 280, 130, '#556171', 2.5) + tx(245, 115, l.extract, 12, 'middle');
    d += rect(290, 100, 60, 60, '#eef3f7', 8, 'stroke="#556171" stroke-width="2"') + circ(312, 125, 6, '#8a96a6') + circ(330, 140, 6, '#8a96a6') + circ(318, 146, 6, '#8a96a6');
    d += arrow(360, 130, 410, 130, '#556171', 2.5) + tx(320, 185, l.mix, 12, 'middle');
    d += line(420, 200, 620, 200, '#556171', 2) + line(420, 200, 420, 60, '#556171', 2);
    [[450, 60], [490, 100], [530, 130], [575, 90]].forEach(([x, h]) => { d += rect(x, 200 - h, 18, h, '#145c96', 2); });
    d += tx(520, 222, l.mz, 12, 'middle') + tx(320, 252, l.res, 12.5, 'middle');
    return d;
  },
  /* вмешательство: корреляция (сенсор и белок на одной мембране) против удаления липида (необходимость) */
  q3intervene(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(330, 22, l.pB, l.b);
    [[0, false], [320, true]].forEach(([ox, rm]) => {
      d += line(ox + 20, 120, ox + 300, 120, '#556171', 4);
      [0, 1, 2, 3, 4, 5].forEach(i => { if (!rm || i === 2) d += circ(ox + 40 + i * 48, 112, 7, Q3C.pip2); });
      [0, 2, 4].forEach(i => { d += rect(ox + 28 + i * 48, rm ? 190 : 76, 30, 26, rm ? '#fff' : '#fbe9c2', 6, `stroke="${rm ? '#9aa7b3' : C4.amber}" stroke-width="2"`); });
      if (rm) d += rect(ox + 210, 128, 90, 24, '#efeaf8', 6, 'stroke="#6748b6" stroke-width="2"') + tx(ox + 255, 145, l.ptase, 12, 'middle');
    });
    d += tx(160, 250, l.res_a, 12.5, 'middle') + tx(480, 250, l.res_b, 12.5, 'middle');
    return d;
  },
});

      d += tx(330, 180, S.ves, 13, 'middle') + tx(52, 70, S.a, 15, 'start') + tx(392, 70, S.b, 15, 'start');

/* Цикл OSBP по модели M4.osbp: схема цикла и четыре столбика (как в практикуме 4а) */

    d += tx(228, 150, S.chol, 12, 'start') + tx(278, 190, S.pi4p, 12, 'start');

/* Захват Ca²⁺ через MCU: кривые M4.Jmcu с MICU1 и без него (логарифмическая ось), точки зазора и цитозоля (M4.ca) */
W.q4ca = ({ S, s, set, out, onGroup }) => {
  s.st ??= 1; s.mi ??= 0; s.co ??= 0;
  const ST = ['rest', 'ip3', 'mod', 'high'];
  set(S.title, S.status, buttonGroup('q4c-st', S.sts, s.st, S.st_label) + buttonGroup('q4c-mi', S.mis, s.mi, S.mi_label) + buttonGroup('q4c-co', S.cos, s.co, S.co_label));
  const draw = () => {
    const micu = s.mi === 0, o = { stim: ST[s.st], micu, contact: s.co === 0 ? 'on' : 'low' }, r = M4.ca(o), ink = '#556171';
    const X0 = 70, X1 = 610, Y0 = 20, Y1 = 230, lx = c => X0 + (X1 - X0) * (Math.log10(c) + 1) / (Math.log10(30) + 1), ly = v => Y1 - (Y1 - Y0) * v;
    let d = line(X0, Y1, X1, Y1, ink, 1.5) + line(X0, Y0, X0, Y1, ink, 1.5);
    [0.1, 0.3, 1, 3, 10, 30].forEach(c => { d += line(lx(c), Y1, lx(c), Y1 + 5, ink, 1.5) + tx(lx(c), Y1 + 19, num(c, c < 1 ? 1 : 0), 14, 'middle'); });
    [0, 0.25, 0.5, 0.75, 1].forEach(v => { d += line(X0 - 5, ly(v), X0, ly(v), ink, 1.5) + tx(X0 - 8, ly(v) + 4, String(Math.round(v * 100)), 14, 'end'); });
    const curve = (mi, col, dash) => { const pts = []; for (let k = 0; k <= 120; k++) { const c = Math.pow(10, -1 + k * (Math.log10(30) + 1) / 120); pts.push(lx(c).toFixed(1) + ',' + ly(M4.Jmcu(c, mi)).toFixed(1)); }
      return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${mi === micu ? 3.5 : 2}" ${dash ? `stroke-dasharray="${dash}"` : ''} opacity="${mi === micu ? 1 : 0.5}"/>`; };
    d += curve(true, C4.blue, '') + curve(false, C4.red, '7 5');
    d += line(90, 30, 120, 30, C4.blue, 3.5) + tx(126, 34, S.c_with, 12, 'start') + line(90, 50, 120, 50, C4.red, 2.5, 'stroke-dasharray="7 5"') + tx(126, 54, S.c_without, 12, 'start');
    const pt = (c, lab, col) => circ(lx(c), ly(M4.Jmcu(c, micu)), 7, col, 'stroke="#fff" stroke-width="2"') + tx(lx(c), ly(M4.Jmcu(c, micu)) - 12, lab, 12, 'middle');
    if (r.gap > r.bulk * 1.01) d += pt(r.gap, S.p_gap, C4.amber);
    d += pt(r.bulk, S.p_bulk, C4.teal);
    d += tx((X0 + X1) / 2, Y1 + 40, S.x, 12, 'middle') + tx(16, (Y0 + Y1) / 2, S.y, 12, 'middle').replace('<text ', `<text transform="rotate(-90 16 ${(Y0 + Y1) / 2})" `);
    const U = r.U * 100, uTxt = U < 0.1 ? '< 0,1' : (U < 10 ? num(U, 1) : String(Math.round(U)));
    const note = S.notes[s.st] + (micu ? '' : S.note_no) + (s.co === 0 || s.st !== 1 ? '' : S.note_low);
    const f4 = x => (x >= 10 || Math.abs(x - Math.round(x)) < 0.05) ? String(Math.round(x)) : num(x, 1);
    out(svg(d, S.title, 280, 640, note),
      `<div class="metrics">${metric(S.m_gap, f4(r.gap) + nb + S.u_uM)}${metric(S.m_bulk, f4(r.bulk) + nb + S.u_uM)}${metric(S.m_u, uTxt + nb + '%')}${metric(S.m_share, Math.round(r.share * 100) + nb + '%')}${metric(S.m_m, '×' + (r.mRel >= 10 ? Math.round(r.mRel) : num(r.mRel, 1)))}</div>` +
      result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q4c-st', i => { s.st = i; draw(); });
  onGroup('q4c-mi', i => { s.mi = i; draw(); });
  onGroup('q4c-co', i => { s.co = i; draw(); });
  draw();
};

/* Площадь и перенос: перенос холестерина (M4.osbp) как функция площади при обычном и удвоенном синтезе PI4P */
W.q4area = ({ S, s, set, out, onRange, onGroup }) => {
  s.a ??= 10; s.syn ??= 0;
  set(S.title, S.status, slider('q4a-area', S.area, 5, 30, s.a, 1, '') + buttonGroup('q4a-syn', S.syns, s.syn, S.syn_label));
  const lab = $('q4a-area-value'); if (lab) lab.textContent = num(s.a / 10, 1);
  const draw = () => {
    const base = { pi4k: true, osbp: true, sac1: true, vap: true }, C0 = M4.CTRL, ink = '#556171';
    const X0 = 70, X1 = 610, Y0 = 20, Y1 = 230, xa = a => X0 + (X1 - X0) * (a - 0.5) / 2.5, yj = v => Y1 - (Y1 - Y0) * v / 250;
    let d = line(X0, Y1, X1, Y1, ink, 1.5) + line(X0, Y0, X0, Y1, ink, 1.5);
    [0.5, 1, 1.5, 2, 2.5, 3].forEach(a => { d += line(xa(a), Y1, xa(a), Y1 + 5, ink, 1.5) + tx(xa(a), Y1 + 19, num(a, 1), 14, 'middle'); });
    [0, 50, 100, 150, 200, 250].forEach(v => { d += line(X0 - 5, yj(v), X0, yj(v), ink, 1.5) + tx(X0 - 8, yj(v) + 4, String(v), 14, 'end'); });
    const curve = (syn, col, w, dash) => { const pts = []; for (let k = 0; k <= 50; k++) { const a = 0.5 + 2.5 * k / 50; pts.push(xa(a).toFixed(1) + ',' + yj(100 * M4.osbp(Object.assign({ area: a, syn }, base)).J / C0.J).toFixed(1)); }
      return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`; };
    d += curve(1, C4.blue, s.syn === 0 ? 3.5 : 2, '') + curve(2, C4.orange, s.syn === 1 ? 3.5 : 2, '7 5');
    d += line(80, 30, 110, 30, C4.blue, 3) + tx(116, 34, S.c1, 12, 'start') + line(80, 50, 110, 50, C4.orange, 3, 'stroke-dasharray="7 5"') + tx(116, 54, S.c2, 12, 'start');
    const a = s.a / 10, r = M4.osbp(Object.assign({ area: a, syn: s.syn ? 2 : 1 }, base)), jv = 100 * r.J / C0.J;
    d += circ(xa(a), yj(jv), 7, C4.amber, 'stroke="#fff" stroke-width="2"');
    d += tx((X0 + X1) / 2, Y1 + 40, S.x, 12, 'middle') + tx(16, (Y0 + Y1) / 2, S.y, 12, 'middle').replace('<text ', `<text transform="rotate(-90 16 ${(Y0 + Y1) / 2})" `);
    const pg = r.Pg / C0.Pg;
    out(svg(d, S.title, 280, 640, S.note),
      `<div class="metrics two">${metric(S.m_j, Math.round(jv) + nb + S.pct)}${metric(S.m_pg, '×' + num(pg, pg >= 1 ? 1 : 2))}</div>` + result(`<p>${esc(S.note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onRange('q4a-area', v => { s.a = v; if (lab) $('q4a-area-value').textContent = num(v / 10, 1); draw(); });
  onGroup('q4a-syn', i => { s.syn = i; draw(); });
  draw();
};

Object.assign(MTH, {

  q4light(l){

  },
  /* FRET: донор и акцептор далеко (свечение донора) и близко (передача энергии, свечение акцептора) */
  q4fret(l){

    [[0, 150], [330, 60]].forEach(([ox, gap], i) => {

      d += circ(xd, 130, 14, '#2c7fb8') + tx(xd, 172, l.don, 12, 'middle') + circ(xa, 84, 14, '#e8a33d') + tx(xa, 50, l.acc, 12, 'middle');
      d += arrow(xd - 40, 104, xd - 16, 122, '#7a4fd0', 2.5) + tx(xd - 60, 96, l.ex, 11, 'start');
      if (i === 0) d += arrow(xd + 16, 140, xd + 40, 158, '#2c7fb8', 2.5, '4 3') + tx(xd + 44, 176, l.em_d, 11, 'start');
      else d += arrow(xd + 6, 116, xa - 6, 98, C4.amber, 3, '4 3') + arrow(xa + 16, 84, xa + 44, 84, '#e8a33d', 2.5, '4 3') + tx(xa + 14, 108, l.em_a, 11, 'start');
    });
    d += tx(320, 236, l.bret, 12.5, 'middle');
    return d;
  },
  /* репортёр из двух половин: раздельно — нет сигнала; сближение — белок собран и удерживает мембраны */
  q4split(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(340, 22, l.pB, l.b);

        d += tx(x + 20, y1 + 20, l.h1, 11, 'start') + tx(x + 20, 142, l.h2, 11, 'start'); }

      d += tx(x, 190, on ? l.res_b : l.res_a, 12, 'middle');
    });
    d += tx(320, 236, l.warn, 12.5, 'middle');
    return d;
  },
});

/* =====================================================================
   Раздел «Исследование»: одна лизосома — V-АТФаза и кислый просвет (вопрос 1), PI(3,5)P₂ и канал TRPML1 (вопрос 3),
   местный выброс Ca²⁺ и быстрый/медленный буфер (вопрос 2), пополнение запаса Ca²⁺ из ЭПР через IP₃R (вопрос 4).
   Качественная схема: уровни — по данным Medina 2015 и Garrity 2016. Все подписи — из S (content.json).
   ===================================================================== */
W.q5lyso = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q5l-mode', S.modes, s.mode, S.modes_label));
  const CA = '#c3662f', H = '#145c96', OK = '#0d6e73', RED = '#ae3347', MUT = '#9aa7b3';
  const caDot = (x, y, r = 4.5) => circ(x, y, r, CA);
  const draw = () => {
    const st = S.states[s.mode];
    let d = '';
    /* цитоплазма */
    d += rect(4, 4, 632, 292, '#f7f9fc', 12, 'stroke="#d5dde8" stroke-width="1.5"') + tx(18, 26, S.cyto, 13, 'start');
    /* ЭПР слева */
    d += `<path d="M20 70 Q60 60 100 72 L104 230 Q60 242 20 228 Z" fill="#e8f1e6" stroke="#5b8a52" stroke-width="2.5"/>` + tx(60, 152, S.er, 15, 'middle');
    /* IP₃R на мембране ЭПР, обращённой к лизосоме */
    const ipOn = st.ip3r === 1;
    d += rect(96, 176, 18, 26, ipOn ? '#fbe9c2' : '#fff', 4, `stroke="${ipOn ? '#c98a0b' : MUT}" stroke-width="2"${ipOn ? '' : ' stroke-dasharray="4 3"'}`);
    d += tx(105, 220, S.ip3r, 12, 'middle');
    if (!ipOn) d += cross(105, 189);
    /* перенос Ca²⁺ из ЭПР к лизосоме (пополнение запаса) */
    /* аудит v1.0, S1-14: подтверждённая стадия — выход Ca²⁺ из ЭПР через IP₃R (пунктир переноса до цитозоля у лизосомы);
       путь через мембрану лизосомы не установлен — точки и знак вопроса */
    d += `<g opacity="${ipOn ? 1 : 0.25}">${arrow(118, 189, 160, 189, CA, 2.5, '6 5')}` +
         `<line x1="166" y1="189" x2="218" y2="189" stroke="${CA}" stroke-width="2.2" stroke-dasharray="1.5 5" stroke-linecap="round"/>` +
         `${tx(192, 182, '?', 14, 'middle')}</g>` + caDot(140, 180, 3.5);
    if (S.path_q) d += `<foreignObject x="122" y="198" width="96" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:11px/1.2 var(--f-sans,sans-serif);text-align:center;color:#5a6676">${esc(S.path_q)}</div></foreignObject>`;
    /* лизосома */
    d += circ(290, 150, 72, '#f6e3eb', 'stroke="#ae3a6c" stroke-width="3.5"');
    d += tx(290, 112, S.lys, 15, 'middle');
    d += `<foreignObject x="236" y="124" width="108" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:12.5px/1.25 var(--f-sans,sans-serif);text-align:center;color:#152c45">${esc(S.lumen)}</div></foreignObject>`;
    /* запас Ca²⁺ в просвете: число точек по уровню (0–3; 4 — не определяли) */
    const nStore = st.store === 4 ? 0 : [0, 2, 4, 6][st.store];
    [[262, 192], [282, 198], [302, 196], [322, 188], [250, 176], [330, 172]].slice(0, nStore).forEach(([x, y]) => { d += caDot(x, y, 3.5); });
    /* V-АТФаза: H⁺ внутрь */
    d += rect(222, 82, 26, 18, '#fbe9c2', 4, 'stroke="#c98a0b" stroke-width="2" transform="rotate(-40 235 91)"');
    d += tx(198, 70, S.vatp, 12.5, 'middle');
    d += arrow(212, 102, 246, 126, H, 2.2, '5 4') + tx(206, 122, S.lg_h, 12, 'middle');
    /* TRPML1 на правой мембране и PI(3,5)P₂ рядом */
    const chOn = st.chan === 1;
    d += rect(352, 138, 20, 26, chOn ? '#fbe9c2' : '#fff', 4, `stroke="${chOn ? '#c98a0b' : MUT}" stroke-width="2"${chOn ? '' : ' stroke-dasharray="4 3"'}`);
    if (!chOn) d += cross(362, 151);
    d += tx(380, 126, S.trpml1, 12.5, 'start');
    [[346, 174], [352, 184], [340, 186]].forEach(([x, y]) => { d += circ(x, y, 4, '#6748b6'); });
    d += tx(312, 236, S.pip, 12.5, 'middle') + line(326, 228, 342, 190, '#6748b6', 1.5);
    /* сенсор на TRPML1 */
    d += rect(374, 160, 12, 12, '#b9e3c6', 3, 'stroke="#2e8b57" stroke-width="1.5"');
    d += tx(392, 182, S.sensor, 11.5, 'start');
    /* выход Ca²⁺ из лизосомы: точки у канала по уровню сигнала */
    const loc = st.loc === 4 ? 1 : st.loc;
    const near = [[388, 146], [396, 158], [384, 136], [400, 140], [394, 128], [404, 152]].slice(0, chOn ? [0, 1, 3, 6][loc] : 0);
    if (chOn) d += arrow(372, 151, 420, 151, CA, 2.5, '6 5');
    near.forEach(([x, y]) => { d += caDot(x, y, 4); });
    /* буфер */
    if (st.buf === 'bapta') {
      d += circ(452, 96, 21, '#fff', 'stroke="#145c96" stroke-width="2"') + tx(452, 100, S.bapta, 11, 'middle');
      d += arrow(436, 110, 404, 136, H, 1.8);
    } else if (st.buf === 'egta') {
      d += circ(420, 236, 21, '#fff', 'stroke="#145c96" stroke-width="2"') + tx(420, 240, S.egta, 11, 'middle');
    }
    /* кальциневрин и TFEB */
    const canOn = st.tfeb === 3;
    d += box(418, 132, 116, 36, S.can, { fill: canOn ? '#fbe9c2' : '#fff', stroke: canOn ? '#c98a0b' : '#6d8ba5', size: 13 });
    d += canOn ? arrow(500, 170, 548, 200, '#145c96', 2.5) : `<g opacity="0.22">${arrow(476, 170, 476, 198, '#145c96', 2.5)}</g>`;
    /* ядро */
    d += `<ellipse cx="572" cy="220" rx="56" ry="54" fill="#eef0f7" stroke="#97a0ba" stroke-width="2.5"/>` + tx(572, 260, S.nuc, 13, 'middle');
    const tfIn = st.tfeb === 3, tfUnk = st.tfeb === 4;
    const tfX = tfIn ? 572 : 476, tfY = tfIn ? 214 : 214;
    d += rect(tfX - 26, tfY - 12, 52, 24, tfUnk ? '#fff' : '#d3ecec', 6, `stroke="${tfUnk ? MUT : OK}" stroke-width="2"${tfUnk ? ' stroke-dasharray="4 3"' : ''}`) + tx(tfX, tfY + 5, S.tfeb, 12.5, 'middle');
    if (!tfIn && !tfUnk) d += circ(tfX + 26, tfY - 12, 8, '#f0b84a', 'stroke="#c98a0b" stroke-width="1.5"') + tx(tfX + 26, tfY - 8, 'P', 10, 'middle');
    /* экворин в объёме цитоплазмы */
    d += circ(452, 44, 9, '#e0f0ff', 'stroke="#145c96" stroke-width="1.5"') + tx(466, 48, S.aeq, 12, 'start');
    /* легенда */
    d += caDot(24, 276, 4) + tx(34, 280, S.lg_ca, 12, 'start');
    d += arrow(76, 276, 108, 276, CA, 2, '6 5') + tx(114, 280, S.lg_tr, 12, 'start');
    d += arrow(226, 276, 256, 276, '#145c96', 2.2) + tx(262, 280, S.lg_act, 12, 'start');
    d += circ(352, 276, 7, '#fff', 'stroke="#145c96" stroke-width="2"') + tx(364, 280, S.lg_buf, 12, 'start');
    const lv = i => S.lv[i];
    out(svg(d, S.title, 300, 640, st.note),
      `<div class="metrics">${metric(S.m_ph, S.ph_acid)}${metric(S.m_loc, lv(st.loc))}${metric(S.m_bulk, lv(st.bulk))}${metric(S.m_tfeb, lv(st.tfeb))}${metric(S.m_store, lv(st.store))}</div>` + result(`<p>${esc(st.note)}</p>`));
  };
  onGroup('q5l-mode', i => { s.mode = i; draw(); });
  draw();
};


/* Как у семинара 3 (V05): на экране уже 760 px схема не сжимается до нечитаемых подписей, а лежит в прокручиваемой рамке (ширина не меньше 760 CSS-пикселей).
   Обёртка добавляется после каждой перерисовки виджета; подсказка берётся из CONTENT.ui.svg_hint (в коде русских фраз нет). */
(function(){
  const css = document.createElement('style');
  css.textContent = '@media (max-width:760px){.svgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.svgscroll::before{content:var(--svg-hint,"");display:block;position:sticky;left:0;font-size:12.5px;line-height:1.35;padding:6px 10px;color:var(--muted)}.svgscroll>svg{min-width:760px;border:0!important;border-radius:0!important}}';
  document.head.appendChild(css);
  document.documentElement.style.setProperty('--svg-hint', JSON.stringify(CONTENT.ui.svg_hint || ''));
  const wrap = root => root.querySelectorAll('.widget svg[viewBox]').forEach(sv => {
    if (sv.parentElement.classList.contains('svgscroll') || sv.classList.contains('lg') || sv.getAttribute('aria-label') === CONTENT.ui.chart_levels) return;
    const vb = sv.viewBox.baseVal; if (!vb || vb.width < 560) return;
    const d = document.createElement('div'); d.className = 'svgscroll'; sv.parentNode.insertBefore(d, sv); d.appendChild(sv);
    if (sv.dataset.center) d.scrollLeft = (d.scrollWidth - d.clientWidth) * parseFloat(sv.dataset.center);
  });
  new MutationObserver(() => wrap(document)).observe(document.body, { childList: true, subtree: true });
  wrap(document);
})();
