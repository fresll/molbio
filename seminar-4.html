<title>Семинар 4 · Динамика, обратные связи и интеграция сигналов — Кафедра биологии и генетики, Медицинский университет Петровского</title>

<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

"s1b_r_erk": "доля ERK, фосфорилированной по TEY", "s1b_r_amp": "Усиление", "s1b_r_amp_s": "активных молекул ERK на одну активную RAF при текущей концентрации EGF", "s1b_r_hill": "Крутизна", "s1b_r_hill_s": "эффективный коэффициент Хилла кривой «концентрация EGF — доля активной ERK» (по EC10 и EC90) в этом режиме", "s1b_r_occ": "Рецепторы", "s1b_r_occ_s": "доля EGFR, связавших EGF", "s1b_c_uns_mid": "Киназы и фосфатазы работают вдали от насыщения: скорость каждой реакции пропорциональна количеству её субстрата. Поэтому доля активной формы на каждом уровне плавно растёт вслед за входным сигналом, и ERK заметно фосфорилирована уже при малой доле занятых рецепторов.", "s1b_c_uns_mid_z": "Пологий ответ передаёт изменения концентрации EGF в широком диапазоне. Слабый стимул даёт слабый, а более сильный — несколько больший ответ, без резкого порога.", "s1b_c_uns_high": "Почти все рецепторы связали EGF, и доля активной ERK приближается к максимуму ненасыщенного режима. Дальнейшее повышение концентрации EGF почти не меняет ответ: занятость рецепторов выходит на плато.", "s1b_c_uns_high_z": "Верхнюю границу различимых концентраций задаёт связывание лиганда с рецептором. Нижележащие киназы увеличивают число событий, но не позволяют различить две высокие концентрации EGF, при которых почти все рецепторы уже заняты.", "s1b_c_sat_low": "Киназы и фосфатазы насыщены субстратом, поэтому скорость каждой реакции почти не зависит от количества субстрата. Пока скорость фосфорилирования ниже скорости дефосфорилирования, субстрат на каждом уровне остаётся преимущественно нефосфорилированным, и ERK почти неактивна, хотя часть рецепторов связала EGF.", "s1b_c_sat_low_z": "Слабый стимул ниже порога не передаётся на ERK. Такой режим отсекает небольшие случайные колебания входа.", "s1b_c_sat_mid": "Концентрация EGF близка к порогу. Скорости фосфорилирования и дефосфорилирования на уровнях каскада почти равны, и небольшое изменение входа резко сдвигает долю активной ERK. Эффекты трёх уровней перемножаются, поэтому кривая каскада круче кривой любого отдельного уровня.", "s1b_c_sat_mid_z": "Около порога каскад работает как переключатель: малое изменение концентрации EGF переводит ERK из почти неактивного состояния в почти полностью активное.", "s1b_c_sat_high": "Скорость фосфорилирования на всех уровнях превышает скорость дефосфорилирования, и субстраты преимущественно находятся в активной форме. Доля активной ERK близка к максимуму и почти такая же, как в ненасыщенном режиме при той же концентрации EGF.", "s1b_c_sat_high_z": "Выше порога ответ полный. Число активных молекул ERK на одну активную RAF при максимальном стимуле почти не зависит от режима: усиление и крутизна — разные свойства каскада.", "s1b_take": "Каталитическое усиление показывает, во сколько раз активных молекул на выходе больше, чем на входе; крутизна показывает, насколько резко доля активной ERK меняется с концентрацией стимула. Это разные свойства. При одинаковом усилении каскад может отвечать полого (ферменты не насыщены) или круто, с порогом (ферменты насыщены субстратом, эффекты уровней перемножаются). Основное усиление по числу молекул приходится на ступень RAF → MEK: RAF в клетке намного меньше, чем MEK и ERK.", "p1b_1_q": "Ферменты каскада не насыщены субстратом. Концентрацию EGF повышают в 10 раз: с 0,06 до 0,6 Kd. Как изменится доля ERK, фосфорилированной по TEY?", "p1b_1_o1": "Увеличится немного: примерно до 70–80 % всей ERK", "p1b_1_o2": "Достигнет не менее 95 % всей ERK", "p1b_1_o3": "Увеличится в 10 раз, как концентрация EGF", "p1b_1_e": "В ненасыщенном режиме скорость каждой реакции пропорциональна количеству субстрата, поэтому доля активной ERK растёт вслед за входом плавно: при десятикратном повышении концентрации EGF — примерно с 61 до 75 % всей ERK. Плато этой кривой — около 77 % всей ERK, так что 75 % — это уже почти весь доступный в модели ответ. Коэффициент Хилла кривой близок к единице.", "p1b_1_w2": "В ненасыщенном режиме кривая выходит на плато около 77 % всей ERK: даже когда заняты все рецепторы, фосфатазы удерживают часть ERK нефосфорилированной.", "p1b_1_w3": "Ответ не может вырасти в 10 раз: 61 % × 10 больше всей ERK. Кроме того, в ненасыщенном каскаде ответ растёт меньше, чем стимул, и выходит на плато.", "p1b_2_q": "Ферменты каскада насыщены субстратом. Концентрацию EGF повышают в 10 раз: с 0,06 до 0,6 Kd. Как изменится доля ERK, фосфорилированной по TEY?", "p1b_2_o1": "Немного увеличится: ответ растёт постепенно", "p1b_2_o2": "Резко увеличится: от почти нуля до половины максимума", "p1b_2_o3": "Не изменится: ниже порога каскад не отвечает", "p1b_2_e": "Насыщенные ферменты работают как переключатель нулевого порядка: пока скорость фосфорилирования ниже скорости дефосфорилирования, субстрат остаётся нефосфорилированным. Входной сигнал превышает порог, и доля активной ERK возрастает примерно с 1 до 46 %. Крутизна трёх уровней перемножается: эффективный коэффициент Хилла кривой по концентрации EGF в модели около 3, а по доле занятых рецепторов — около 5. Второе значение сопоставимо с 4–5 у Huang и Ferrell (1996): в экстрактах ооцитов Xenopus входом служила концентрация Mos, а не лиганда рецептора.", "p1b_2_w1": "Постепенный рост характерен для ненасыщенных ферментов. При насыщении ответ ниже порога почти отсутствует, а вблизи порога резко нарастает.", "p1b_2_w3": "0,6 Kd уже выше порога: занятость рецепторов растёт примерно с 6 до 39 %, входной сигнал каскада превышает порог, и доля активной ERK резко возрастает.", "p1b_3_q": "Концентрация EGF максимальна, ферменты насыщены субстратом. Режим переключают на «не насыщены». Как изменится усиление — число активных молекул ERK на одну активную RAF?", "p1b_3_o1": "Уменьшится в несколько раз", "p1b_3_o2": "Увеличится в несколько раз", "p1b_3_o3": "Почти не изменится", "p1b_3_e": "При максимальном стимуле и в насыщенном, и в ненасыщенном режиме на одну активную RAF приходится около 70 активных молекул ERK. Режим меняет форму кривой «доза — ответ», то есть крутизну, но не масштаб усиления. Режимы — два учебных набора параметров: в них различаются и насыщение ферментов, и отношения скоростей киназ и фосфатаз, поэтому сравнение иллюстрирует две формы ответа, а не эксперимент с изменением одного параметра.", "p1b_3_w1": "Пологая кривая не означает слабого усиления: при максимальном стимуле доли активных форм в двух режимах близки, и активных молекул ERK на одну RAF почти столько же. Здесь смешаны два свойства — усиление и крутизна.", "p1b_3_w2": "Число активных молекул ERK ограничено их общим количеством (0,96 мкМ). При максимальном стимуле оба режима дают близкие доли активной ERK, поэтому усиление не может вырасти в несколько раз.", "p1b_4_q": "Концентрация EGF максимальна. Сравните количество активных молекул на четырёх уровнях каскада (числа справа от полос). На какой ступени число активных молекул возрастает больше всего?", "p1b_4_o1": "RAF → MEK", "p1b_4_o2": "RAS → RAF", "p1b_4_o3": "MEK → ERK", "p1b_4_e": "По концентрациям, измеренным в клетках HeLa (Fujioka 2006), RAF-1 около 0,013 мкМ, MEK — 1,4 мкМ, ERK — 0,96 мкМ. Число активных молекул равно общему количеству белка, умноженному на долю его активной формы. При максимальном стимуле в модели эти доли на всех уровнях близки (около 77–84 %), поэтому соотношение активных молекул задают количества белков: основное усиление приходится на ступень RAF-1 → MEK, примерно в 100 раз. ERK и MEK в этих клетках сопоставимы по количеству (оценки различаются в зависимости от метода), поэтому на ступени MEK → ERK многократного роста нет.", "p1b_4_w2": "RAS в клетке около 0,4 мкМ, а RAF — около 0,013 мкМ. Активных молекул RAF меньше, чем RAS-GTP, поэтому на этой ступени их число не возрастает.", "p1b_4_w3": "ERK и MEK в клетках HeLa сопоставимы по количеству (0,96 и 1,4 мкМ), поэтому на ступени MEK → ERK число активных молекул не увеличивается многократно. Каскад усиливает сигнал не одинаково на каждом уровне.", "gt_nf1": "нет NF1", "gt_g12c": "KRAS G12C", "iv_t": "Воздействие", "iv_0": "нет", "iv_dusp": "siRNA к DUSP", "iv_tram": "ингибитор MEK", "iv_soto": "соторасиб", "egf_t": "EGF", "egf_on": "в среде", "egf_wash": "отмыть через 10 мин", "egf_off": "не добавлять", "s1a_tslider": "Время после добавления EGF", "s1a_nf1": "нейрофибромин (NF1)", "s1a_dusp6": "DUSP6 (MKP-3)", "s1a_int": "интернализация", "s1a_lyso": "лизосома", "s1a_recleft": "рецепторов на поверхности: {p} %", "s1a_imp": "в ядро", "s1a_gene": "гены DUSP1, SPRY", "s1a_syn": "синтез", "s1a_clock": "{m} мин", "s1a_mask": "Схема скрыта. Определите клетки по блоту.", "s1a_blot_rec": "Записать серию 0–5–15–60 мин", "s1a_r_egf": "EGF в среде", "s1a_pcap": "Учебная модель, относительные величины; время от добавления EGF. {c}.", "s1a_pcap_ref": "Серый пунктир — pERK при EGF, оставшемся в среде.", "mk_wash": "отмывание", "bl_dusp": "siD", "bl_tram": "+iM", "bl_soto": "+сот.", "s1a_c_start": "EGF только что добавлен. Рецепторы связывают лиганд и автофосфорилируются; GRB2 переносит SOS к мембране, и SOS начинает переводить RAS в GTP-форму. RAF, MEK и ERK пока почти не фосфорилированы.", "s1a_c_start_z": "Сигнал от рецептора проходит три киназных уровня за несколько минут. Каждый уровень вносит свою задержку.", "s1a_c_peak": "Ранний ответ: значительная часть RAS связана с GTP, MEK и ERK фосфорилированы. Одновременно уже работают механизмы завершения: NF1 и другие GAP ускоряют гидролиз GTP в RAS, DUSP6 дефосфорилирует ERK в цитоплазме, а активные рецепторы интернализуются.", "s1a_c_peak_z": "Активация и завершение идут одновременно. Пик pERK — это момент, когда скорость фосфорилирования ERK становится равной скорости её дефосфорилирования: до пика первая выше, после пика — ниже.", "s1a_c_peak_nf1": "Клетки без нейрофибромина (NF1). Гидролиз GTP на RAS идёт медленнее: его обеспечивают оставшиеся GAP. RAS-GTP выше, чем в норме, а pERK в раннем ответе близок к норме.", "s1a_c_peak_nf1_z": "Потеря NF1 не создаёт нового сигнала: она замедляет один из механизмов выключения RAS. Различие с нормой становится заметным позднее, на спаде ответа.", "s1a_c_peak_dusp": "Синтез DUSP подавлен siRNA. RAS-GTP почти такой же, как в норме: DUSP действуют не на RAS, а на саму ERK. Без них ERK дефосфорилируется медленнее, и pERK в раннем ответе выше, чем в норме.", "s1a_c_peak_dusp_z": "Фосфатазы DUSP завершают сигнал на последнем уровне каскада. Их недостаток повышает содержание pERK и продлевает сигнал, не меняя активацию RAS.", "s1a_c_late_fall": "EGF остаётся в среде, но pERK снижается. Часть активных рецепторов интернализована и направлена на деградацию, ERK фосфорилирует RAF-1, а активированная ею RSK — SOS1, и оба белка ослабляют передачу сигнала, а синтезированная DUSP1 дефосфорилирует ERK в ядре.", "s1a_c_late_fall_z": "Для завершения сигнала не требуется удалять лиганд: несколько механизмов одновременно уменьшают число активных молекул на разных уровнях каскада.", "s1a_c_late": "pERK снизился в несколько раз (в модели примерно до пятой части пика), хотя EGF остаётся в среде. Большая часть рецепторов интернализована и разрушена, на поверхности их осталось мало; ERK-зависимая обратная связь и DUSP удерживают каскад в малоактивном состоянии.", "s1a_c_late_z": "Клетка отвечает на появление EGF кратким сигналом. Повторный ответ на тот же фактор возможен только после восстановления рецепторов на поверхности.", "s1a_c_late_nf1": "Клетки без NF1. RAS дольше остаётся в GTP-форме, и pERK снижается медленнее, чем в норме; базальный pERK тоже немного выше. При этом сигнал всё же затухает: работают другие GAP, потеря рецепторов, обратная связь и DUSP.", "s1a_c_late_nf1_z": "Потеря одного механизма завершения удлиняет и усиливает ответ на физиологический стимул, но не делает его постоянным. С таким нарушением связывают предрасположенность к опухолям при нейрофиброматозе 1 типа.", "s1a_c_late_dusp": "Синтез DUSP подавлен. pERK снижается медленнее, чем в норме, хотя RAS-GTP снижается так же, как в норме: число рецепторов на поверхности уменьшается, обратная связь от ERK действует. Затухание pERK замедлено именно на уровне ERK.", "s1a_c_late_dusp_z": "Механизмы завершения действуют на разных уровнях. По одному показателю нельзя судить обо всех: RAS-GTP и pERK могут затухать с разной скоростью.", "s1a_c_noegf": "EGF не добавлен. Рецепторы свободны, RAS в основном связан с GDP, и pERK остаётся на низком базальном уровне.", "s1a_c_noegf_z": "Без входного сигнала механизмы завершения удерживают каскад в почти неактивном состоянии.", "s1a_c_nf1_noegf": "EGF не добавлен. В клетках без NF1 доля RAS-GTP и базальный pERK немного выше, чем в норме: без нейрофибромина RAS медленнее возвращается в GDP-форму.", "s1a_c_nf1_noegf_z": "Без NF1 каскад не становится постоянно активным: без фактора роста сигнал остаётся слабым.", "s1a_c_dusp_noegf": "EGF не добавлен. При подавленном синтезе DUSP базальный pERK немного выше, чем в норме: ERK медленнее дефосфорилируется.", "s1a_c_dusp_noegf_z": "Фосфатазы работают и в покое: они определяют не только спад ответа, но и базальный уровень pERK.", "s1a_c_wash_fall": "EGF отмыт. Новые рецепторы не активируются, RAS быстро возвращается в GDP-форму, а MEK и ERK дефосфорилируются фосфатазами. pERK падает быстрее, чем при EGF, оставшемся в среде.", "s1a_c_wash_fall_z": "Дефосфорилирование и гидролиз GTP идут непрерывно; поэтому после удаления стимула сигнал затухает за минуты.", "s1a_c_wash_done": "После отмывания EGF pERK вернулся к исходному уровню. Часть рецепторов успела интернализоваться и разрушиться, остальные остаются на поверхности.", "s1a_c_wash_done_z": "Обратимые реакции — дефосфорилирование и гидролиз GTP — быстро возвращают каскад в покой, а восстановление рецепторов требует больше времени.", "s1a_c_g12c": "Клетки с KRAS G12C без EGF. Мутантный белок почти не отвечает на GAP и медленно гидролизует GTP, поэтому значительная его часть находится в GTP-форме и без фактора роста. pERK повышен, а ERK-зависимые ингибиторы — DUSP и SPRY — постоянно индуцированы.", "s1a_c_g12c_z": "Сигнал от RAS не зависит от фактора роста. При этом KRAS G12C продолжает переходить между GTP- и GDP-формами — на этом основано действие соторасиба.", "s1a_c_g12c_egf": "К клеткам с KRAS G12C добавили EGF. Доля RAS-GTP растёт, но pERK увеличивается мало: каскад уже активен, а индуцированные DUSP и SPRY ограничивают ответ.", "s1a_c_g12c_egf_z": "При постоянном онкогенном сигнале ответ на фактор роста ослаблен. Причина — постоянно индуцированные ERK-зависимые ингибиторы DUSP и SPRY.", "s1a_c_soto_early": "Соторасиб добавлен. Он ковалентно связывает KRAS G12C только в GDP-форме, поэтому pERK снижается постепенно: молекулы захватываются по мере того, как они гидролизуют GTP.", "s1a_c_soto_early_z": "Действие препарата основано на сохранившемся цикле GTP/GDP мутантного белка: соторасиб создаёт искусственный механизм выключения RAS.", "s1a_c_soto_late": "Большая часть KRAS G12C связана соторасибом в GDP-форме и не может вернуться в GTP-форму. RAS-GTP и pERK снижены.", "s1a_c_soto_late_z": "Захват неактивной формы необратим. Сигнал от мутантного RAS ослаблен до тех пор, пока клетка не синтезирует новые молекулы KRAS.", "s1a_c_tram": "Ингибитор MEK (аллостерический, например PD0325901) подавляет фосфорилирование ERK. RAS-GTP после EGF выше и держится дольше, чем без ингибитора: ERK не фосфорилирует SOS и RAF-1, и эта обратная связь не действует. pMEK может сохраняться: ингибитор блокирует передачу сигнала от MEK к ERK, а не фосфорилирование MEK.", "s1a_c_tram_z": "Ингибитор одного уровня меняет и вышестоящие уровни: подавляя ERK, он ослабляет её обратную связь. Это подробно разбирается в вопросе 3.", "s1a_c_myst": "Клетки неизвестного генотипа: в них нет NF1, есть мутация KRAS G12C или подавлен синтез DUSP. Запишите серию дорожек, сравните её с нормой и определите клетки.", "s1a_c_myst_z": "По вестерн-блоту в нескольких точках времени можно различить нарушения разных механизмов: базальный уровень, высоту пика и скорость спада.", "s1a_c_ans_nf1": "Это клетки без NF1. Базальный pERK немного повышен, ранний пик близок к норме, а спад медленнее; RAS-GTP повышен.", "s1a_c_ans_nf1_z": "Потеря GAP увеличивает время жизни RAS-GTP и продлевает ответ, но не делает каскад постоянно активным.", "s1a_c_ans_g12c": "Это клетки с KRAS G12C. pERK высокий уже до добавления EGF, а EGF повышает его незначительно.", "s1a_c_ans_g12c_z": "Сигнал онкогенного RAS не требует фактора роста, а индуцированные DUSP и SPRY ограничивают ответ на EGF.", "s1a_c_ans_dusp": "Это клетки с подавленным синтезом DUSP. Пик pERK выше нормы и спадает медленнее, а RAS-GTP — как в норме.", "s1a_c_ans_dusp_z": "Недостаток фосфатаз меняет pERK, не затрагивая активацию RAS: механизм завершения работает на уровне ERK.", "s1a_take": "Сигнал завершают несколько механизмов на разных уровнях и в разное время: GAP-зависимый гидролиз GTP в RAS (NF1), дефосфорилирование ERK фосфатазами DUSP, потеря активных рецепторов (интернализация и деградация), тормозящее фосфорилирование SOS и RAF-1 под действием активной ERK, синтез DUSP и SPRY. Поэтому pERK снижается, даже когда EGF остаётся в среде. Нарушение одного механизма (нет NF1) удлиняет ответ, но не делает его постоянным; лекарство может создать искусственный механизм выключения (соторасиб захватывает GDP-форму KRAS G12C).", "p1a_1_q": "Нормальные клетки, EGF добавлен и остаётся в среде. Через 5 мин pERK близок к пику. Каким будет pERK через 60 мин?", "p1a_1_o1": "Останется на уровне пика: EGF всё ещё в среде", "p1a_1_o2": "Снизится в несколько раз, хотя EGF остаётся в среде", "p1a_1_o3": "Станет ниже исходного уровня (до добавления EGF)", "p1a_1_e": "Через 60 мин pERK в несколько раз ниже пика (в модели около 12 % против 66 %), хотя EGF остаётся в среде. Большая часть активных рецепторов интернализована и разрушена, ERK-зависимая обратная связь тормозит SOS и RAF-1, DUSP дефосфорилируют ERK. Так ведёт себя ответ на EGF во многих клетках: в клетках PC12 активность MEK после EGF возвращалась к исходной за 60–90 мин (Traverse 1992).", "p1a_1_w1": "Присутствие лиганда не поддерживает сигнал само по себе: число рецепторов на поверхности уменьшается, а механизмы завершения продолжают действовать. Поэтому pERK снижается и при EGF в среде.", "p1a_1_w3": "Механизмы завершения возвращают каскад к состоянию покоя, а не ниже его. Базальный pERK задаётся балансом слабой фоновой активации и фосфатаз, и этот баланс сохраняется.", "p1a_2_q": "Сравним pERK через 30 мин после EGF в нормальных клетках и в клетках без нейрофибромина (NF1). Каким будет pERK в клетках без NF1?", "p1a_2_o1": "Таким же, как в норме: NF1 действует на рецептор", "p1a_2_o2": "Постоянно максимальным, независимо от EGF", "p1a_2_o3": "Выше, чем в норме: RAS дольше остаётся в GTP-форме", "p1a_2_e": "NF1 — GAP для RAS: он ускоряет гидролиз GTP. Без него RAS-GTP сохраняется дольше, и через 30 мин pERK выше, чем в норме. Сигнал всё же затухает: остаются другие GAP, потеря рецепторов, обратная связь и DUSP.", "p1a_2_w1": "Нейрофибромин действует не на рецептор, а на RAS: его GAP-домен ускоряет гидролиз GTP. Без NF1 RAS-GTP сохраняется дольше, и pERK на спаде выше нормы.", "p1a_2_w2": "Без NF1 гидролиз GTP в RAS замедлен, но не остановлен: работают другие GAP. Без EGF pERK лишь немного выше нормы, а ответ на EGF удлинён, но затухает.", "p1a_3_q": "Синтез фосфатаз DUSP подавлен siRNA. Как изменятся pERK и RAS-GTP через 5 мин после EGF по сравнению с нормой?", "p1a_3_o1": "pERK выше, RAS-GTP почти такой же", "p1a_3_o2": "pERK и RAS-GTP выше: DUSP служат GAP для RAS", "p1a_3_o3": "pERK и RAS-GTP ниже", "p1a_3_e": "DUSP — фосфатазы двойной специфичности: они дефосфорилируют треонин и тирозин в мотиве TEY активной ERK. Без них ERK дефосфорилируется медленнее, и pERK выше нормы. На RAS фосфатазы DUSP не действуют, поэтому RAS-GTP почти не меняется.", "p1a_3_w2": "DUSP не являются GAP: они не ускоряют гидролиз GTP, а удаляют фосфатные группы с ERK. Активацию RAS их недостаток почти не меняет.", "p1a_3_w3": "Недостаток фосфатазы прямо замедляет дефосфорилирование её субстрата: ERK дефосфорилируется медленнее, и pERK выше нормы.", "p1a_4_q": "EGF отмыли через 10 мин после добавления. Каким будет pERK через 30 мин по сравнению с клетками, где EGF остаётся в среде (серый пунктир)?", "p1a_4_o1": "Таким же: каскад уже запущен", "p1a_4_o2": "Ниже: почти исходный уровень", "p1a_4_o3": "Выше: отмывание снимает обратную связь", "p1a_4_e": "После отмывания новые рецепторы не активируются, а гидролиз GTP в RAS и дефосфорилирование MEK и ERK продолжаются. Поэтому к 30 мин pERK почти на исходном уровне, тогда как при EGF в среде он ещё заметно повышен.", "p1a_4_w1": "Каскад не запоминает однажды полученный сигнал: RAS-GTP и pERK постоянно возвращаются в неактивную форму. Без входа от рецептора сигнал затухает за минуты.", "p1a_4_w3": "Ослабление обратной связи не может поддержать сигнал без входа: после отмывания EGF активация RAS почти прекращается, и pERK падает.", "p1a_5_q": "Клетки с KRAS G12C без EGF: pERK повышен. Добавили соторасиб. Каким будет pERK через 2 ч?", "p1a_5_o1": "Не изменится: KRAS G12C постоянно связан с GTP", "p1a_5_o2": "Упадёт до нуля за 1–2 мин", "p1a_5_o3": "Снизится постепенно, за десятки минут", "p1a_5_e": "Соторасиб ковалентно связывает цистеин мутантного KRAS G12C в GDP-форме, когда открыт карман возле switch II (Canon 2019). Молекулы захватываются по мере того, как они гидролизуют GTP, поэтому pERK снижается постепенно. В модели к 2 ч он значительно ниже исходного.", "p1a_5_w1": "KRAS G12C не зафиксирован в GTP-форме: он гидролизует GTP, хотя и медленно, и переходит в GDP-форму. Именно в ней его захватывает соторасиб.", "p1a_5_w2": "Соторасиб не связывает GTP-форму, поэтому не выключает сразу все молекулы. Захват идёт по мере перехода KRAS G12C в GDP-форму и занимает десятки минут.", "p1a_6_q": "Загадка. На блоте две серии 0–5–15–60 мин: первая — нормальные клетки, вторая — клетки неизвестного генотипа. У неизвестных клеток базальный pERK немного выше, пик близок к норме, а к 60 мин pERK выше, чем в норме. Какие это клетки?", "p1a_6_o1": "Клетки без NF1", "p1a_6_o2": "Клетки с KRAS G12C", "p1a_6_o3": "Клетки с подавленным синтезом DUSP", "p1a_6_e": "Так выглядит потеря NF1: RAS-GTP повышен и затухает медленнее, поэтому pERK на спаде выше нормы, а базальный уровень немного повышен. В этой модели высота раннего пика почти не меняется: потеря NF1 заметнее сказывается на базальном уровне pERK и на спаде ответа.", "p1a_6_w2": "При KRAS G12C pERK сильно повышен уже в точке 0 мин, до EGF, а EGF почти не усиливает ответ. Здесь базальный pERK повышен лишь немного.", "p1a_6_w3": "При недостатке DUSP пик pERK выше нормы, а RAS-GTP не меняется. Здесь пик близок к норме, а RAS-GTP повышен.", "gn_egfr": "EGFR", "g_egfr": "Рецепторная тирозинкиназа семейства ErbB. Связавшись с EGF, димеризуется и фосфорилирует тирозины своих цитоплазматических участков; к ним присоединяется адаптер GRB2. Активный рецептор интернализуется: из эндосомы он может вернуться на мембрану или после убиквитинирования лигазой CBL попасть в лизосому и разрушиться.", "gn_sos": "GRB2 и SOS", "g_sos": "GRB2 — адаптер, который связывает фосфотирозины рецептора и белок SOS. SOS — фактор обмена гуаниновых нуклеотидов (GEF): у мембраны он заменяет GDP на GTP в RAS. Активная ERK и киназа RSK фосфорилируют С-концевой участок SOS1; фосфорилирование по S1134 и S1161 (RSK) создаёт сайты связывания белков 14-3-3 и ослабляет активацию RAS — отрицательная обратная связь (Saha 2012).", "gn_ras": "RAS", "g_ras": "Малая ГТФаза, закреплённая на внутренней стороне плазматической мембраны. В GTP-форме привлекает RAF к мембране. Собственная ГТФазная активность RAS медленная; гидролиз GTP ускоряют GAP-белки, например нейрофибромин. Мутация G12C почти лишает KRAS чувствительности к GAP, но не останавливает переходы между GTP- и GDP-формами.", "gn_raf": "RAF", "g_raf": "Киназа первого уровня каскада (ARAF, BRAF, CRAF/RAF-1). Активируется у мембраны после связывания с RAS-GTP, освобождения от аутоингибирования и димеризации. Фосфорилирует MEK. Активная ERK фосфорилирует RAF-1 по нескольким сайтам и снижает её способность связываться с RAS (Dougherty 2005).", "gn_mek": "MEK1/2", "g_mek": "Киназа двойной специфичности: фосфорилирует ERK по тирозину и треонину мотива TEY. Сама активируется после того, как RAF фосфорилирует её по двум серинам (Ser218 и Ser222 у MEK1 человека; в названиях антител часто S217/S221). Ингибиторы MEK (например, PD0325901, траметиниб) связываются вне ATP-связывающего центра и блокируют передачу сигнала к ERK.", "gn_erk": "ERK1/2", "g_erk": "MAP-киназа, эффекторная киназа каскада. Активна после фосфорилирования обоих остатков мотива TEY (T202/Y204 у ERK1 человека). Фосфорилирует сотни субстратов в цитоплазме и ядре. Число активных молекул ERK ограничено её количеством: в клетках HeLa ERK меньше, чем MEK (Fujioka 2006).", "gn_nf1": "Нейрофибромин (NF1)", "g_nf1": "Крупный белок с GAP-доменом для RAS: вводит в активный центр RAS каталитический аргинин (Arg1276) и ускоряет гидролиз GTP на несколько порядков. Мутации гена NF1 вызывают нейрофиброматоз 1 типа; потеря функции удлиняет время жизни RAS-GTP.", "gn_dusp": "DUSP (MKP)", "g_dusp": "Фосфатазы двойной специфичности: удаляют фосфат и с треонина, и с тирозина мотива TEY ERK, то есть дефосфорилируют, а не разрушают её. DUSP6 (MKP-3) находится в цитоплазме; её синтез поддерживает активная ERK, поэтому при подавлении ERK DUSP6 исчезает за часы (Lito 2012). DUSP1 и DUSP5 — ядерные фосфатазы, их синтез ERK индуцирует в течение десятков минут (медленная отрицательная обратная связь).", "s1a_fb": "ERK фосфорилирует RAF-1, RSK — SOS1", "s2b_cell": "клетка PC12", "s2b_f": "Фактор роста", "s2b_egf": "EGF", "s2b_ngf": "NGF", "s2b_pc12": "PC12", "s2b_pc12x": "PC12 с избытком EGFR", "s2b_rec_egfr": "рецептор EGF (EGFR)", "s2b_rec_egfrx": "EGFR: рецепторов во много раз больше", "s2b_rec_trka": "рецептор NGF (TrkA)", "s2b_rec_trka_x": "рецептор NGF (TrkA); EGFR в избытке, но без EGF", "s2b_pos": "положительная связь (через PKC)", "s2b_other": "другие ветви: PI3K, PLCγ", "s2b_ieg": "гены немедленного ответа", "s2b_fate": "Через 2–3 сут", "s2b_fate_d": "деление", "s2b_fate_n": "отростки (нейриты)", "s2b_r_5": "pERK через 5 мин", "s2b_r_5s": "доля ERK, фосфорилированной по TEY", "s2b_r_60": "pERK через 60 мин", "s2b_r_60s": "доля ERK, фосфорилированной по TEY", "s2b_r_dur": "Длительность", "s2b_r_durs": "сколько минут из первых 120 pERK выше половины пика", "s2b_r_fate": "Исход", "s2b_r_fates": "в модели: дифференцировка, если через 60 мин pERK выше 30 %", "s2b_pcap": "pERK в клетках PC12, учебная модель по данным Traverse 1992, 1994; относительные величины. {c}.", "s2b_l_cur": "pERK при выбранных условиях", "s2b_l_ref": "EGF, обычные PC12 (для сравнения)", "s2b_mk60": "60 мин", "s2b_c_egf": "EGF активирует ERK кратковременно: pERK максимален через несколько минут и к 60 мин снижается в несколько раз. Активные EGFR интернализуются и разрушаются, а обратные связи ERK тормозят вход. Через 2–3 сут клетки PC12 продолжают делиться.", "s2b_c_egf_z": "Короткий сигнал ERK в PC12 связан с пролиферацией. Сам по себе он не включает программу нейрональной дифференцировки.", "s2b_c_ngf": "NGF через рецептор TrkA активирует ERK устойчиво: pERK остаётся высоким и через 60–120 мин, ERK накапливается в ядре. Через 2–3 сут клетки образуют отростки. Передача сигнала от TrkA прекращается медленнее, а в сети NGF действует ещё и положительная связь (через PKC, Santos 2007).", "s2b_c_ngf_z": "Устойчивый сигнал ERK в PC12 связан с нейрональной дифференцировкой. Но NGF отличается от EGF не только длительностью активации ERK: TrkA активирует и другие ветви сигнала.", "s2b_c_egf_x": "В клетках PC12 с избытком EGFR тот же EGF активирует ERK устойчиво: рецепторов так много, что уменьшение их числа и обратные связи не успевают ослабить сигнал от рецепторов. Через 2–3 сут клетки образуют отростки, как при NGF (Traverse 1994).", "s2b_c_egf_x_z": "Рецептор тот же, изменился профиль ERK — и изменился исход. Это довод в пользу роли длительности сигнала, а не особого пути, доступного только NGF.", "s2b_c_ngf_x": "К клеткам с избытком EGFR добавили NGF. EGF нет, поэтому избыток EGFR не участвует: ответ определяется TrkA и не отличается от ответа обычных PC12 — ERK активна устойчиво, клетки образуют отростки.", "s2b_c_ngf_x_z": "Избыток рецептора влияет только на ответ на его собственный лиганд. NGF действует через TrkA.", "s2b_take": "В клетках PC12 EGF вызывает кратковременную активацию ERK и пролиферацию, NGF — устойчивую активацию и нейрональную дифференцировку. Сравнение двух факторов показывает связь профиля ERK с исходом, но не доказывает причинность: EGFR и TrkA различаются и другими ветвями сигнала. При избытке EGFR тот же EGF вызывает устойчивый сигнал ERK и дифференцировку. Это дополнительный довод в пользу роли профиля ERK, но избыток рецептора усиливает и другие ветви, поэтому их вклад этим экспериментом не исключён.", "p2b_1_q": "К клеткам PC12 вместо EGF добавили NGF. Каким будет pERK через 60 мин после добавления фактора?", "p2b_1_o1": "Почти исходным, как при EGF", "p2b_1_o2": "Ниже исходного уровня", "p2b_1_o3": "Всё ещё высоким", "p2b_1_e": "NGF через TrkA вызывает устойчивую активацию ERK: в экспериментах Traverse (1992) она сохранялась не менее 90 мин, тогда как после EGF возвращалась к исходному уровню за 60–90 мин. В модели через 60 мин pERK при NGF около 47 %, при EGF — около 12 %.", "p2b_1_w1": "Так ведёт себя ответ на EGF. Ответ на NGF в PC12 устойчивый: pERK остаётся высоким через час и дольше.", "p2b_1_w2": "Фактор роста не снижает pERK ниже исходного уровня: механизмы завершения возвращают каскад к покою, а не подавляют базальную активность. При NGF ответ к тому же устойчивый.", "p2b_2_q": "В клетках PC12 повысили количество EGFR во много раз и добавили EGF. Каким будет pERK через 60 мин и каким будет исход через 2–3 сут?", "p2b_2_o1": "pERK высокий, клетки образуют отростки", "p2b_2_o2": "pERK низкий, клетки делятся", "p2b_2_o3": "pERK высокий, клетки делятся", "p2b_2_e": "При избытке EGFR уменьшение числа рецепторов на поверхности и обратные связи не успевают ослабить сигнал от рецепторов, и тот же EGF активирует ERK устойчиво. В эксперименте Traverse (1994) такие клетки PC12 отвечали на EGF устойчивой активацией MAP-киназ, её переходом в ядро и нейрональной дифференцировкой, как обычные PC12 на NGF.", "p2b_2_w2": "Так отвечают обычные PC12. Когда рецепторов во много раз больше, вход сохраняется дольше, и pERK через час остаётся высоким.", "p2b_2_w3": "В эксперименте с избытком EGFR устойчивая активация ERK сопровождалась дифференцировкой, а не делением. В модели исход тоже определяется профилем ERK.", "p2b_3_q": "Сравниваем ответы PC12 на EGF и NGF: разные профили ERK, разные исходы. Какой вывод из этого сравнения строже всего обоснован?", "p2b_3_o1": "Только длительность активации ERK определяет исход", "p2b_3_o2": "Профиль ERK связан с исходом, но причина не выделена", "p2b_3_o3": "ERK не участвует в выборе исхода", "p2b_3_e": "EGFR и TrkA — разные рецепторы: кроме ERK, они по-разному активируют другие ветви сигнала (PI3K, PLCγ). Поэтому сравнение двух факторов показывает связь профиля ERK с исходом, но не выделяет длительность как единственную причину. Избыток EGFR (Traverse 1994) изменяет профиль ERK при том же лиганде и том же рецепторе, но усиливает и другие ветви. Более прямо вход каскада меняет активация RAS светом (продвинутый уровень).", "p2b_3_w1": "Этот вывод сильнее, чем позволяют данные: EGF и NGF действуют через разные рецепторы с разными параллельными ветвями. Исход могут определять и они.", "p2b_3_w3": "Эксперимент показывает обратное: профиль ERK различается вместе с исходом, а при избытке EGFR изменение профиля ERK сопровождается изменением исхода.", "s2a_cell": "фибробласт мыши", "s2a_light": "красный свет", "s2a_gene": "ген c-fos", "s2a_pu": "c-Fos нестабильный", "s2a_ps": "c-Fos стабилен (S362, S374)", "s2a_pf": "pT325, pT331", "s2a_defT": "DEF-мотив заменён", "s2a_ph": "ERK, RSK", "s2a_deg": "разрушение", "s2a_ap1": "AP-1 → гены-мишени", "s2a_nb": "Соседняя клетка", "s2a_sec": "секретируемый фактор", "s2a_st3_on": "фосфорилирован", "s2a_st3_off": "не фосфорилирован", "s2a_st3_tot_on": "будет фосфорилирован", "s2a_st3_tot_off": "не будет фосфорилирован", "s2a_prog": "Программа света", "s2a_p2": "2 мин", "s2a_p10": "10 мин", "s2a_c120": "120 мин подряд", "s2a_d60": "2 × 60 мин, пауза 60 мин", "s2a_def": "c-Fos без DEF-мотива", "s2a_tslider": "Момент наблюдения", "s2a_h_now": "В выбранный момент: {m} мин от начала освещения", "s2a_h_tot": "Итоги всей программы освещения (расчёт модели за 240 мин)", "s2a_r_ennow": "в выбранный момент", "s2a_r_fosnow": "стабилизированный c-Fos (S362, S374), % от наибольшего при программе «120 мин подряд»", "s2a_r_pfnow": "c-Fos, фосфорилированный по T325 и T331, % от наибольшего при программе «120 мин подряд»", "s2a_r_pf": "c-Fos pT325/pT331: наибольшее количество, % от программы «120 мин подряд»", "s2a_r_st3tot": "в соседних клетках за всю программу", "s2a_r_en": "pERK в ядре", "s2a_r_ens": "наибольшее значение за эксперимент", "s2a_r_auc": "Интеграл активности ERK", "s2a_r_aucs": "площадь под кривой pERK в ядре, % от программы «120 мин подряд»", "s2a_r_cont": "Непрерывная активность", "s2a_r_conts": "самый длинный интервал, в течение которого pERK в ядре выше порога (25 %)", "s2a_r_fos": "стабилизированный c-Fos: наибольшее количество, % от программы «120 мин подряд»", "s2a_r_st3": "в соседних клетках", "s2a_pcap": "Учебная модель, относительные величины; время от начала освещения. {c}.", "s2a_l_light": "свет", "s2a_l_erk": "pERK в ядре", "s2a_l_fos": "c-Fos стабилизированный", "s2a_l_pf": "c-Fos pT325/pT331", "s2a_l_st3": "pSTAT3 соседних клеток", "s2a_c_p2": "Свет включает RAS лишь на 2 мин. За это время сигнал не успевает полностью пройти каскад и перенос ERK в ядро: pERK в ядре заметно ниже, чем при импульсе 10 мин. c-Fos почти не образуется.", "s2a_c_p2_z": "Каскад сглаживает очень короткие входные сигналы: в экспериментах Toettcher (2013) импульсы короче 4 мин передавались к ERK слабо. Так случайные короткие колебания входа не запускают ответ.", "s2a_c_p10": "Импульс 10 мин: pERK в ядре успевает подняться, мРНК c-fos синтезируется. Но к тому времени, как появляется белок c-Fos, ERK уже неактивна: новый c-Fos не фосфорилируется в С-концевой области и быстро разрушается. Стабилизированного c-Fos почти нет.", "s2a_c_p10_z": "Короткий сигнал включает гены немедленного ответа, но не оставляет устойчивого продукта. Накопление c-Fos зависит от того, активна ли ERK в момент появления белка; поэтому короткий и длительный сигналы дают разный результат.", "s2a_c_c120": "Программа «120 мин подряд»: ERK активна, пока горит свет. Новый c-Fos фосфорилируется ERK (S374) и RSK (S362) и стабилизируется; затем открывается DEF-мотив, и ERK фосфорилирует ещё T325 и T331. После 75 мин непрерывной активности (порог модели; в эксперименте — между 1 и 2 ч) включается паракринная программа: в соседних клетках фосфорилируется STAT3. Показания вверху относятся к выбранному моменту, итоги — ко всей программе.", "s2a_c_c120_z": "Длительный сигнал оставляет устойчивые следы: стабильный и дополнительно фосфорилированный c-Fos в составе AP-1 и секретируемый фактор. Разные считывающие механизмы требуют разной длительности.", "s2a_c_d60": "Программа «2 × 60 мин»: интеграл активности ERK почти такой же, как при непрерывном освещении в течение 2 ч. Во время каждого импульса c-Fos стабилизируется и дополнительно фосфорилируется. Но непрерывная активность нигде не достигает порога паракринной программы, и pSTAT3 в соседних клетках не появляется.", "s2a_c_d60_z": "Одинаковая интегральная доза не означает одинаковый ответ. Паракринная программа считывает непрерывную длительность сигнала, а не сумму (Toettcher 2013).", "s2a_c_def": "Программа «120 мин подряд», но в c-Fos заменены остатки DEF-мотива (FXFP). Стабилизирующее фосфорилирование S362 и S374 от DEF-мотива не зависит, и стабильный c-Fos накапливается (в модели — как в норме; это допущение). Но ERK не связывается с DEF-мотивом и почти не фосфорилирует T325 и T331.", "s2a_c_def_z": "Считывание длительности идёт в два этапа: стабилизация белка и его дополнительное фосфорилирование через DEF-мотив. Замена мотива выключает второй этап и нарушает сигнальную функцию c-Fos (Murphy 2002); в модели с этой формой связана активность AP-1 — это учебное допущение.", "s2a_c_tram": "Ингибитор MEK. Свет переводит RAS в GTP-форму, но ERK почти не фосфорилирована. Транскрипция c-fos слабая, стабилизированного c-Fos почти нет, паракринная программа не включается.", "s2a_c_tram_z": "Эксперимент с ингибитором показывает, что и c-Fos, и паракринная программа зависят от ERK, а не от RAS в обход неё. Эксперимент с одним ингибитором показывает зависимость, но не доказывает её: возможны побочные эффекты препарата.", "s2a_take": "Свет позволяет управлять входом на RAS напрямую и менять только временной профиль. Каскад сглаживает очень короткие импульсы. Длительность считывают разные механизмы: c-Fos стабилизируется, если ERK ещё активна в момент появления белка (для этого сигнал должен длиться около часа), затем ERK через DEF-мотив дополнительно фосфорилирует его по T325 и T331; паракринная программа требует непрерывной активности заметно дольше часа. Поэтому при сравнении профилей нужно контролировать интегральную дозу: равная доза ещё не означает равного ответа.", "p2a_1_q": "Свет включает RAS не на 10 мин, а на 2 мин. Каким будет максимальное значение pERK в ядре?", "p2a_1_o1": "Таким же: каскад передаёт любой импульс полностью", "p2a_1_o2": "Заметно ниже: короткий импульс сглаживается", "p2a_1_o3": "Выше: короткий импульс не включает обратную связь", "p2a_1_e": "Сигнал проходит RAS, RAF, MEK, ERK и перенос в ядро за несколько минут. Импульс 2 мин заканчивается раньше, и наибольшее значение pERK в ядре в модели примерно на 40 % ниже, чем после импульса 10 мин (32 против 54 %). В экспериментах Toettcher (2013) каскад передавал входные сигналы длительностью от 4 мин до 2 ч и сглаживал более короткие.", "p2a_1_w1": "У каждого уровня каскада и у переноса в ядро своя задержка. Импульс короче этих задержек передаётся не полностью.", "p2a_1_w3": "Обратная связь действительно не успевает развиться, но сам вход слишком короток: ERK не успевает фосфорилироваться и перейти в ядро. Ответ ниже, а не выше.", "p2a_2_q": "Сравним освещение в течение 10 мин и 120 мин подряд. Каким будет количество стабилизированного c-Fos к 120 мин при длительном освещении?", "p2a_2_o1": "Во много раз больше, чем после 10 мин", "p2a_2_o2": "Почти таким же, как после 10 мин", "p2a_2_o3": "Меньше: c-Fos разрушается при активной ERK", "p2a_2_e": "Белок c-Fos появляется через десятки минут после начала сигнала. При длительном освещении ERK в это время ещё активна, она и RSK фосфорилируют С-конец c-Fos, и белок стабилизируется (Murphy 2002). После импульса 10 мин ERK к этому моменту неактивна, и c-Fos быстро разрушается.", "p2a_2_w2": "мРНК c-fos образуется и после короткого импульса, но стабилен только фосфорилированный белок. Без активной ERK в момент синтеза белка c-Fos не накапливается.", "p2a_2_w3": "Активная ERK не ускоряет, а замедляет разрушение c-Fos: фосфорилирование С-концевых остатков стабилизирует белок.", "p2a_3_q": "Свет 120 мин подряд, но в c-Fos заменены остатки DEF-мотива (FXFP). Каким будет количество c-Fos, фосфорилированного по T325 и T331?", "p2a_3_o1": "Таким же, как в норме: ERK активна столько же", "p2a_3_o2": "Больше, чем в норме: мутантный белок связывает ERK прочнее", "p2a_3_o3": "Намного меньше, чем в норме, хотя стабильный c-Fos образуется", "p2a_3_e": "DEF-мотив открывается после стабилизирующего фосфорилирования S362 и S374 и служит участком связывания ERK; от этого связывания зависит фосфорилирование T325 и T331. Стабилизация от DEF-мотива не зависит (Murphy 2002), поэтому стабильный c-Fos образуется, но почти не фосфорилирован по T325 и T331. Профиль pERK такой же, как в норме: изменён считывающий механизм на уровне субстрата.", "p2a_3_w1": "Активность ERK одинакова, но для фосфорилирования T325 и T331 ERK должна связаться с DEF-мотивом. Без него этот этап почти не идёт.", "p2a_3_w2": "Замена остатков FXFP разрушает участок связывания ERK, а не усиливает его: фосфорилирование T325 и T331 ослаблено.", "p2a_4_q": "Свет 120 мин подряд, в среде ингибитор MEK. Как изменятся активность RAS и количество стабилизированного c-Fos?", "p2a_4_o1": "RAS не активируется, c-Fos стабилизирован", "p2a_4_o2": "RAS активируется, c-Fos стабилизирован", "p2a_4_o3": "RAS активируется, c-Fos почти нет", "p2a_4_e": "Свет привлекает SOScat к мембране, и RAS переходит в GTP-форму независимо от MEK. Ингибитор блокирует фосфорилирование ERK, поэтому транскрипция c-fos слабая, а стабилизация белка отсутствует.", "p2a_4_w1": "Ингибитор MEK действует ниже RAS: свет по-прежнему активирует RAS. Без активной ERK c-Fos не стабилизируется.", "p2a_4_w2": "RAS активируется, но сигнал к c-Fos идёт через ERK. При заблокированной MEK ERK почти не фосфорилирована, и c-Fos не стабилизируется.", "p2a_5_q": "Вместо 120 мин подряд свет подают двумя импульсами по 60 мин с паузой 60 мин. Интеграл активности ERK почти тот же. Будет ли фосфорилирован STAT3 в соседних клетках?", "p2a_5_o1": "Да: важна только суммарная доза сигнала", "p2a_5_o2": "Нет: нужна более длительная непрерывная активность", "p2a_5_o3": "Да, раньше и сильнее, чем при непрерывном свете", "p2a_5_e": "В экспериментах Toettcher (2013) STAT3 в соседних клетках фосфорилировался при непрерывной активации RAS в течение 2 ч, а два импульса по 1 ч с паузой 1 ч при той же суммарной дозе такого ответа не давали; в модели порог — 75 мин непрерывной активности. В модели практикума c-Fos при этом стабилизируется в каждом импульсе длительностью 1 ч: разные механизмы считывают длительность с разным порогом.", "p2a_5_w1": "Интеграл одинаков, но паракринная программа требует непрерывной активности: за время паузы (1 ч) её активация прерывается.", "p2a_5_w3": "Каждый импульс по 60 мин короче, чем требуется для паракринной программы, а во время паузы её активация прерывается. pSTAT3 не появляется.", "gn_other": "Другие ветви сигнала", "g_other": "Кроме каскада ERK, рецепторы EGF и NGF активируют PI3K–AKT, PLCγ и другие белки, причём по-разному. Поэтому EGF и NGF различаются не только длительностью активации ERK.", "gn_ieg": "Гены немедленного ответа", "g_ieg": "Гены, транскрипция которых начинается в первые минуты после стимула без синтеза новых белков: c-fos, egr1, c-jun и др. Их продукты регулируют поздние гены.", "gn_opto": "Оптогенетический вход на RAS", "g_opto": "Белок PhyB закреплён на мембране, а каталитический домен SOS (SOScat) соединён с PIF. Красный свет переводит PhyB в форму, связывающую PIF, и SOScat переносится к мембране, где активирует RAS; дальний красный свет возвращает его в цитоплазму (Toettcher 2013, фибробласты NIH3T3). Свет позволяет задавать длительность входа, минуя рецепторы.", "gn_cfos": "c-Fos", "g_cfos": "Белок немедленного ответа, партнёр c-Jun в комплексе AP-1. Новосинтезированный c-Fos нестабилен. Если ERK в это время активна, она и RSK фосфорилируют С-концевые остатки (у c-Fos человека S374 и S362), и белок стабилизируется. Затем открывается DEF-мотив (FXFP), ERK связывается с ним и фосфорилирует ещё T325 и T331; без этого этапа сигнальная функция c-Fos нарушена (Murphy 2002, фибробласты Swiss 3T3).", "gn_ap1": "AP-1", "g_ap1": "Транскрипционный фактор из белков семейств Fos и Jun. Связывается с участками TRE в промоторах и энхансерах генов-мишеней.", "gn_stat3": "STAT3", "g_stat3": "Транскрипционный фактор, который фосфорилируется киназами JAK после связывания цитокинов семейства IL-6 с рецептором. В экспериментах Toettcher (2013) фосфорилирование STAT3 в соседних клетках вызывал фактор, секретируемый клетками после длительной активации RAS.", "s3b_area": "ооцит шпорцевой лягушки Xenopus laevis: созревание под действием прогестерона", "s3b_progN": "прогестерон", "s3b_fbs": "MAPK стабилизирует Mos и усиливает его синтез: сильная петля", "s3b_fbw": "MAPK стабилизирует Mos и усиливает его синтез: слабая петля", "s3b_fbn": "положительной петли нет", "s3b_pop": "Популяция: 24 ооцита", "s3b_popN": "в высоком состоянии: {n} из {N}", "s3b_popS": "чувствительность ооцитов различается", "s3b_unst": "серые точки — неустойчивые состояния", "s3b_chart": "Один ооцит: вход — выход", "s3b_xax": "прогестерон →", "s3b_yax": "MAPK, усл. ед.", "s3b_s": "Прогестерон, условная интенсивность стимула (% диапазона модели)", "s3b_fb": "Положительная петля Mos ← MAPK", "s3b_fb0": "нет", "s3b_fb1": "слабая", "s3b_fb2": "сильная", "s3b_reset": "Новые ооциты (сброс предыстории)", "s3b_au": "усл. ед.", "s3b_r_one": "Активность MAPK в одном ооците (средняя чувствительность)", "s3b_r_state": "Состояние ооцита", "s3b_r_states": "высокое — активность MAPK выше 0,6 усл. ед.", "s3b_hi": "высокое", "s3b_lo": "низкое", "s3b_r_pop": "Популяция", "s3b_r_pops": "ооцитов в высоком состоянии", "s3b_r_mean": "Средняя активность MAPK по популяции (как в лизате всех ооцитов)", "s3b_c_none": "Положительная петля разорвана: синтез Mos идёт только под действием прогестерона, и MAPK не стабилизирует Mos. Активность MAPK в каждом ооците плавно изменяется вслед за концентрацией прогестерона, без скачка и без памяти: при снижении стимула она снижается по той же кривой.", "s3b_c_none_z": "В данной модели после удаления члена положительной связи ответ однозначно определяется текущим входом: промежуточная концентрация прогестерона даёт промежуточную активность MAPK.", "s3b_c_lo": "Прогестерона мало: при этой силе входа у системы одно устойчивое состояние с низкой активностью MAPK. Петля Mos ← MAPK не может самоподдерживаться, и активность MAPK в модели остаётся на нижней ветви.", "s3b_c_lo_z": "Слабые и случайные колебания стимула не переводят MAPK в высокое состояние, с которого начинается созревание ооцита.", "s3b_c_hi": "Прогестерона достаточно: у системы одно устойчивое состояние — с высокой активностью MAPK. Mos активирует MEK1, MEK1 — MAPK, а MAPK стабилизирует Mos и усиливает его синтез; ооцит переходит в высокое состояние независимо от предыстории.", "s3b_c_hi_z": "Выше порога ответ «всё или ничего»: ооцит не останавливается на промежуточном уровне.", "s3b_c_bis_lo": "При этой концентрации прогестерона у системы два устойчивых состояния — низкое и высокое; на графике это две ветви. Ооцит достиг этой концентрации при повышении стимула и остаётся в низком состоянии. Более чувствительные ооциты популяции при том же стимуле могут уже находиться в высоком.", "s3b_c_bis_lo_z": "Состояние зависит от предыстории. Поэтому в популяции при промежуточном стимуле одни ооциты полностью активны, а другие нет.", "s3b_c_bis_hi": "Прогестерона стало меньше, но ооцит остаётся в высоком состоянии: активная MAPK поддерживает синтез Mos, а при этой силе входа высокое состояние устойчиво. Выключить ооцит можно только при более низкой концентрации прогестерона, чем та, при которой он включился, а при сильной петле — не удаётся вовсе. Это гистерезис.", "s3b_c_bis_hi_z": "Пороги включения и выключения различаются. Небольшое снижение стимула не возвращает ооцит в низкое состояние.", "s3b_c_mem": "Прогестерона нет, а MAPK остаётся активной: при сильной петле высокое состояние устойчиво даже без стимула. В экспериментах Xiong и Ferrell (2003) ответ ооцита сохранялся после удаления прогестерона и становился временным, если положительную связь блокировали.", "s3b_c_mem_z": "Сильная положительная петля превращает краткий стимул в устойчивое изменение состояния. В модели при сильной петле возврата нет при любом прогестероне; это частный случай гистерезиса, а не его общее свойство.", "s3b_take": "Положительная обратная связь вместе с крутым (нелинейным) ответом создаёт бистабильность: при одном и том же стимуле возможны два устойчивых состояния, и выбор между ними зависит от предыстории. Отдельный ооцит отвечает «всё или ничего», а среднее по популяции растёт плавно. Гистерезис — разные пороги включения и выключения — не то же самое, что необратимость: при слабой петле ооцит возвращается в низкое состояние при более низком стимуле, при сильной петле в модели не возвращается совсем.", "p3b_1_q": "Петля сильная. Ооцит со средней чувствительностью находится при концентрации прогестерона 17 %. Концентрацию прогестерона повышают до 42 %. Как изменится активность MAPK в этом ооците?", "p3b_1_o1": "Скачком перейдёт в высокое состояние", "p3b_1_o2": "Повысится в 2,5 раза, пропорционально входу", "p3b_1_o3": "Не изменится: нужна более высокая доза", "p3b_1_e": "При 42 % прогестерона у системы остаётся одно устойчивое состояние — высокое, и ооцит переходит в него скачком. Положительная петля Mos ← MAPK вместе с крутизной каскада даёт ответ «всё или ничего»: у отдельных ооцитов Xenopus эффективный коэффициент Хилла составлял не менее 35 (Ferrell и Machleder 1998).", "p3b_1_w2": "Пропорциональный ответ характерен для системы без положительной петли. С сильной петлёй ооцит выше порога переходит в высокое состояние целиком.", "p3b_1_w3": "В модели порог включения при сильной петле около 30 % прогестерона; 42 % выше его, и ооцит переходит в высокое состояние.", "p3b_2_q": "Петля сильная. Ооцит перевели в высокое состояние, повысив концентрацию прогестерона с 17 до 42 %. Затем прогестерон снова снизили до 17 %. Какой будет активность MAPK?", "p3b_2_o1": "Вернётся к низкому уровню, как до повышения", "p3b_2_o2": "Установится посередине между уровнями", "p3b_2_o3": "Останется высокой", "p3b_2_e": "При 17 % прогестерона возможны два устойчивых состояния. Ооцит достиг этой концентрации при снижении стимула, и активная MAPK поддерживает синтез Mos, поэтому он остаётся в высоком состоянии. Состояние при одном и том же стимуле зависит от предыстории — это признак бистабильности.", "p3b_2_w1": "Так вела бы себя система без положительной петли. Здесь высокое состояние самоподдерживается: MAPK стабилизирует Mos и усиливает его синтез.", "p3b_2_w2": "Промежуточное состояние в бистабильной системе неустойчиво: ооцит находится либо в низком, либо в высоком состоянии.", "p3b_3_q": "Петля слабая. Ооцит перевели в высокое состояние (прогестерон 42 %), затем снизили прогестерон до 5 %. Какой будет активность MAPK?", "p3b_3_o1": "Останется высокой при любом снижении", "p3b_3_o2": "Вернётся к низкому уровню", "p3b_3_o3": "Вернётся к низкому уровню только после полного удаления прогестерона", "p3b_3_e": "При слабой петле два устойчивых состояния сосуществуют примерно при 10–34 % условного стимула; выше остаётся только высокое, ниже — только низкое. При 5 % высокого состояния нет, и активность MAPK возвращается на нижнюю ветвь — при более низком стимуле, чем тот, при котором она перешла в высокое состояние. Это гистерезис без необратимости.", "p3b_3_w1": "Так ведёт себя система с сильной петлёй. Слабая петля поддерживает высокое состояние только при достаточном прогестероне; гистерезис не означает необратимости.", "p3b_3_w3": "Полностью удалять прогестерон не нужно: при слабой петле высокое состояние существует лишь при прогестероне выше примерно 10 %, поэтому при 5 % ооцит уже возвращается в низкое состояние.", "p3b_4_q": "Положительная петля Mos ← MAPK разорвана: MAPK не стабилизирует Mos и не усиливает его синтез, а сам синтез Mos в ответ на прогестерон сохранён. Концентрацию прогестерона повышают с 17 до 42 %. Как изменится активность MAPK в ооците?", "p3b_4_o1": "Повысится пропорционально, без скачка", "p3b_4_o2": "Скачком перейдёт в высокое состояние", "p3b_4_o3": "Не изменится: без петли MAPK не активируется", "p3b_4_e": "Без положительной петли у системы одно устойчивое состояние при любом прогестероне, и активность MAPK плавно следует за входом. В экспериментах петлю прерывали циклогексимидом и активировали MAPK введённым белком Mos: ответ отдельного ооцита становился постепенным (Ferrell 1999). Сходно в экспериментах Xiong и Ferrell (2003) блокада положительной связи делала ответ ооцита временным и зависимым от стимула.", "p3b_4_w2": "В данной модели скачок и два устойчивых состояния создаёт положительная петля; без неё остаётся один устойчивый ответ, который меняется плавно. Вообще же бистабильность возможна и без внешней петли — например, при многосайтовом фосфорилировании (Markevich 2004).", "p3b_4_w3": "Прогестерон запускает синтез Mos и без петли; петля лишь усиливает его. Активность MAPK растёт вместе со стимулом.", "p3b_5_q": "Петля сильная. Популяцию из 24 ооцитов с разной чувствительностью перевели с концентрации прогестерона 8 % на 25 %. Средняя активность MAPK по популяции стала промежуточной. Что происходит в отдельных ооцитах?", "p3b_5_o1": "Каждый ооцит находится в промежуточном состоянии", "p3b_5_o2": "Часть ооцитов в высоком состоянии, остальные в низком", "p3b_5_o3": "Все ооциты в высоком состоянии, но с меньшей активностью", "p3b_5_e": "Ооциты различаются чувствительностью: самые чувствительные (в модели 4 из 24) пересекают порог и переходят в высокое состояние целиком, остальные остаются в низком. Среднее по популяции промежуточное, но складывается из ответов «всё или ничего». Так Ferrell и Machleder (1998) объяснили плавную кривую в лизатах ооцитов.", "p3b_5_w1": "При сильной петле промежуточное состояние неустойчиво. Промежуточное среднее получается из смеси полностью активных и неактивных ооцитов.", "p3b_5_w3": "Ооциты в высоком состоянии имеют высокую активность MAPK, а среднее снижено за счёт ооцитов в низком состоянии. По среднему из лизата это не различить.", "s3a_rtk": "рецепторы", "s3a_raf": "RAF", "s3a_dimer": "RAF-димеры", "s3a_mono": "BRAF V600E (мономер)", "s3a_fast": "быстрая петля: ERK фосфорилирует RAF-1, RSK — SOS1", "s3a_slow": "медленная петля", "s3a_gene": "гены DUSP, SPRY", "s3a_chx": "синтез белка подавлен", "s3a_vem": "вемурафениб", "s3a_both": "вемурафениб + ингибитор MEK", "s3a_drug": "Препарат (добавлен в момент 0)", "s3a_sys": "Клетки", "s3a_sysF": "фибробласты + EGF", "s3a_sysM": "меланома BRAF V600E", "s3a_tFast": "Быстрая петля (тормозящие сайты SOS1 и RAF-1, которые фосфорилируют ERK и RSK)", "s3a_tSlow": "Синтез белка (медленная петля: DUSP, SPRY)", "s3a_tslider": "Момент наблюдения", "s3a_clock_h": "{h} ч", "s3a_r_dusp": "индуцированные DUSP: доля от наибольшего уровня в модели", "s3a_r_ref": "pERK для сравнения", "s3a_r_refF": "нормальные фибробласты, обе петли работают", "s3a_r_refM": "меланома без препаратов (контроль)", "s3a_l_dusp": "DUSP", "s3a_l_ref": "pERK для сравнения", "s3a_pcapF": "Учебная модель, относительные величины; время от добавления EGF (EGF остаётся в среде). Серый пунктир — нормальные фибробласты.", "s3a_pcapM": "Учебная модель по данным Lito 2012, относительные величины; время от добавления препарата, среда с сывороткой. Серый пунктир — меланома без препаратов.", "s3a_c_f_early": "Ранний ответ на EGF: RAS-GTP и pERK быстро растут. Активная ERK уже фосфорилирует RAF-1 и через RSK — SOS1: включается быстрая петля, которая не требует синтеза белка.", "s3a_c_f_early_z": "Быстрая отрицательная петля ограничивает вход в первые минуты, ещё до того, как синтезируются новые белки-ингибиторы.", "s3a_c_f": "EGF остаётся в среде, а pERK снижается. Быстрая петля (ERK фосфорилирует RAF-1, RSK — SOS1) ослабляет активацию RAS и RAF; медленная (синтез DUSP и SPRY) снижает фосфорилирование ERK и тормозит вход; часть рецепторов утрачена.", "s3a_c_f_z": "Отрицательные петли с разной задержкой вместе с потерей рецепторов превращают постоянный стимул в кратковременный ответ.", "s3a_c_f_nofast": "В SOS1 устранены тормозящие сайты RSK, а в RAF-1 — тормозящие сайты ERK. RAS-GTP снижается медленнее, и pERK на спаде выше, чем в норме. Медленная петля и потеря рецепторов всё же прекращают сигнал позднее.", "s3a_c_f_nofast_z": "Быстрая петля определяет прежде всего форму пика и скорость раннего спада. Без неё ответ шире, но не бесконечен.", "s3a_c_f_chx": "Синтез белка подавлен (циклогексимид): индуцированные DUSP и SPRY не образуются. pERK на позднем спаде выше, чем в норме; быстрая петля и потеря рецепторов работают. Циклогексимид подавляет синтез всех белков, поэтому вывод о роли именно DUSP требует дополнительного эксперимента.", "s3a_c_f_chx_z": "Медленная петля действует с задержкой и сильнее всего меняет поздний уровень pERK, а не высоту пика.", "s3a_c_f_both": "Обе петли выключены. pERK остаётся высоким гораздо дольше, чем в норме; снижается он в основном из-за потери рецепторов.", "s3a_c_f_both_z": "Петли обратной связи — главные ограничители ответа при сохраняющемся стимуле. Их разрыв меняет и длительность, и высоту плато.", "s3a_c_f_mek": "Ингибитор MEK: pERK почти нет. Без активной ERK обе петли не работают, поэтому RAS-GTP после EGF выше и держится дольше, чем без ингибитора.", "s3a_c_f_mek_z": "Подавив ERK, ингибитор снимает и её обратную связь: вышестоящие звенья становятся активнее.", "s3a_c_m": "Меланома с BRAF V600E без препаратов. Мутантный мономер BRAF активен без RAS, pERK постоянно высокий. Поэтому DUSP и SPRY постоянно индуцированы, а RAS-GTP низкий: петли тормозят вход от рецепторов.", "s3a_c_m_z": "Высокий сигнал ERK от онкогенного BRAF сам поддерживает сильную отрицательную обратную связь на верхнюю часть каскада (Lito 2012).", "s3a_c_m_mut": "Меланома с BRAF V600E без препаратов, одна из петель выключена. pERK по-прежнему высокий: мутантный мономер BRAF работает без RAS. RAS-GTP выше, чем при работающих петлях.", "s3a_c_m_mut_z": "Петли сдерживают прежде всего вход от рецепторов к RAS; на сигнал мономера BRAF V600E они влияют мало.", "s3a_c_m_vem_early": "Вемурафениб подавил мономер BRAF V600E: pERK за 1–2 ч упал в несколько раз. DUSP и SPRY ещё сохраняются, и RAS-GTP пока низкий.", "s3a_c_m_vem_early_z": "Ранний эффект препарата — глубокое подавление сигнала. Но он одновременно снимает ERK-зависимое торможение, что проявится через несколько часов.", "s3a_c_m_vem_late": "Через несколько часов после добавления вемурафениба содержание DUSP и SPRY снижается (в экспериментах Lito 2012 — к 4–8 ч): ERK больше не поддерживает их синтез. Вход от рецепторов растормаживается, RAS-GTP растёт, образуются RAF-димеры, на которые препарат действует слабо, и pERK частично восстанавливается до нового уровня; при этом синтез DUSP и SPRY частично возобновляется.", "s3a_c_m_vem_late_z": "Ингибитор одного узла смещает равновесие всей сети: снятие отрицательной обратной связи частично возвращает сигнал. Это одна из причин ограниченного действия ингибиторов RAF.", "s3a_c_m_vem_chx": "Вемурафениб при подавленном синтезе белка. Индуцированных DUSP и SPRY нет уже с начала эксперимента, поэтому вход от рецепторов не заторможен, и восстановление pERK видно раньше.", "s3a_c_m_vem_chx_z": "Скорость отскока определяется временем, за которое исчезают DUSP и SPRY. В модели циклогексимид убирает их заранее; в реальном эксперименте он подавляет синтез всех белков.", "s3a_c_m_mek": "Ингибитор MEK: pERK почти нет. Без ERK DUSP и SPRY исчезают, RAS-GTP растёт, но сигнал через MEK заблокирован.", "s3a_c_m_mek_z": "Ингибитор MEK действует ниже RAF-димеров, поэтому их образование не восстанавливает pERK.", "s3a_c_m_both": "Вемурафениб вместе с ингибитором MEK: pERK подавлен глубже и устойчивее, чем одним вемурафенибом. RAS-GTP и RAF-димеры растут, но их сигнал блокируется на уровне MEK.", "s3a_c_m_both_z": "Подавление двух уровней каскада предотвращает отскок, вызванный снятием обратной связи (Lito 2012). Выбор схемы лечения — решение онколога, а не вывод из модели.", "s3a_take": "У каскада ERK две отрицательные петли: быстрая (ERK фосфорилирует RAF-1 непосредственно, а SOS1 — через RSK; минуты, без синтеза белка) и медленная (ERK индуцирует синтез DUSP и SPRY, десятки минут и часы). Они ограничивают пик и плато ответа при сохраняющемся стимуле. Подавление каскада снимает и его обратную связь: в меланоме BRAF V600E вемурафениб сначала резко снижает pERK, а через часы RAS-GTP растёт, образуются устойчивые к препарату RAF-димеры, и pERK частично восстанавливается. Одновременное подавление MEK этот отскок предотвращает.", "p3a_1_q": "Фибробласты, EGF в среде. В клетках устранены тормозящие сайты SOS1 и RAF-1, которые фосфорилируют ERK и RSK (быстрая петля модели). Каким будет pERK через 30 мин по сравнению с нормальными клетками?", "p3a_1_o1": "Ниже: без этих сайтов SOS1 и RAF-1 неактивны", "p3a_1_o2": "Выше: быстрая отрицательная петля не работает", "p3a_1_o3": "Таким же: петля действует только через синтез белка", "p3a_1_e": "Фосфорилирование SOS1 и RAF-1 — быстрая отрицательная обратная связь двух типов: ERK фосфорилирует RAF-1, и она хуже связывается с RAS (Dougherty 2005); ERK активирует RSK, а RSK фосфорилирует SOS1 по S1134 и S1161, создавая сайты связывания белков 14-3-3, и SOS1 слабее активирует RAS (Saha 2012). Без этих сайтов RAS-GTP снижается медленнее, и через 30 мин pERK выше нормы (в модели около 52 % против 30 %).", "p3a_1_w1": "Эти сайты не нужны для активации SOS1 и RAF-1: их фосфорилирование тормозит эти белки. Без сайтов торможение исчезает.", "p3a_1_w3": "Быстрая петля — это прямое фосфорилирование уже существующих белков, без синтеза новых. Она действует за минуты, и её отсутствие видно уже через 30 мин.", "p3a_2_q": "Фибробласты, EGF в среде; синтез белка подавлен циклогексимидом. Каким будет pERK через 45 мин по сравнению с нормой?", "p3a_2_o1": "Выше: индуцированные DUSP и SPRY не синтезируются", "p3a_2_o2": "Ниже: без синтеза белка исчезает ERK", "p3a_2_o3": "Таким же: DUSP влияют только на пик", "p3a_2_e": "Медленная петля требует транскрипции и трансляции DUSP и SPRY. Без синтеза белка она не работает, и на позднем спаде pERK выше нормы (в модели около 23 % против 17 %). Циклогексимид подавляет синтез всех белков, поэтому роль именно DUSP подтверждают другими экспериментами, например siRNA.", "p3a_2_w2": "За 45 мин количество ERK почти не меняется: ERK — стабильный белок. Циклогексимид прекращает синтез новых DUSP и SPRY, но не разрушает уже имеющуюся ERK.", "p3a_2_w3": "Индуцированные DUSP накапливаются через десятки минут, поэтому они меняют прежде всего поздний спад, а не пик.", "p3a_3_q": "Клетки меланомы с BRAF V600E в среде с сывороткой. Добавили вемурафен
