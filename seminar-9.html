: "Сигнал TMRM составляет {tmrm} при исходном значении 1,00 (режим без тушения флуоресценции). В первом приближении, согласно уравнению Нернста, сигнал увеличивается вдвое при увеличении |Δψ| примерно на 18,5 мВ.", "c2t_dn": "Сигнал TMRM составляет {tmrm} при исходном значении 1,00 (режим без тушения флуоресценции). В первом приближении, согласно уравнению Нернста, сигнал уменьшается вдвое при уменьшении |Δψ| примерно на 18,5 мВ. Для перевода сигнала в мВ необходима отдельная калибровка.", "c2z_base": "В модели стационарный потенциал определяется балансом токов, создающих и снижающих разность потенциалов. Вклад импорта белков в этот баланс не рассчитывается: индекс импорта вычисляют по полученному Δψ при достаточном ATP в матриксе. Синтез и экспорт ATP объединены в условную зависимость с выбранным ориентиром около 108 мВ; вход Ca²⁺ меняется плавно, а кривая импорта имеет условную середину 45 мВ.", "c2z_chain": "Уменьшение максимальной мощности цепи снижает перенос H⁺ из матрикса. Модуль Δψ меньше исходного на {ddpsi} мВ. В данной модели поступление ATP в цитоплазму резко уменьшается около выбранного ориентира 108 мВ; вход Ca²⁺ меняется плавно, а импорт при достаточном ATP в матриксе сохраняется до более глубокой деполяризации. Числа и форма кривых условные.", "c2z_f": "FCCP переносит H⁺ через внутреннюю мембрану в матрикс и уменьшает модуль Δψ. При умеренном разобщении ослабевает торможение переноса электронов высокой Δp и дыхание ускоряется; при избытке FCCP в этой модели подавляется также максимальная мощность цепи (вопрос 1). Поступление ATP и импорт меняются по разным условным зависимостям; их численные ориентиры нельзя переносить на любой клеточный опыт.", "c2z_o": "В сравнении с тем же состоянием без блока |Δψ| выше: H⁺ возвращаются только через утечку, тока через синтазу нет. Вход Ca²⁺ тоже выше, потому что ток MCU определяется Δψ, а не синтезом ATP (Kirichok 2004).", "c2z_ca": "Вход Ca²⁺ — ток положительных зарядов в матрикс за счёт Δψ. При нагрузке ×{caL} он уменьшает модуль Δψ на {ddpsi} мВ; при ×60 это ≈ 11 % (Δp падает на столько же, потому что доля ΔpH принята постоянной; Brand & Nicholls 2011: 10–20 %). Торможение переноса электронов ослабевает, дыхание ускоряется. Ускорение реакций, катализируемых дегидрогеназами матрикса, под действием Ca²⁺ (вопрос 3) здесь не учитывается.", "c2z_ca_ru": "Ингибитор MCU закрывает путь Ca²⁺ в матрикс, поэтому нагрузка Ca²⁺ в цитоплазме не меняет баланс токов: Δψ и дыхание остаются на исходных значениях (в пределах 1 мВ и 0,02).", "c2z_ru": "Базальный ток Ca²⁺ составляет около 1,5 % максимального протонного тока модели (Brand & Nicholls 2011: 1–2 %), поэтому его подавление слабо меняет Δψ и дыхание. Хроническое подавление экспрессии MCU (нокдаун) в культивируемых клетках и в печени мыши также оставляло Δψ и дыхание прежними (Baughman 2011); условие — обычная нагрузка Ca²⁺ в цитоплазме.", "c2z_o_ru": "По сравнению с тем же состоянием без ингибирования ATP-синтазы |Δψ| выше: H⁺ возвращаются по путям утечки, а ток через синтазу отсутствует. Поступление Ca²⁺ в матрикс подавлено ингибитором MCU (показание 0), поэтому ток Ca²⁺ также не снижает абсолютную величину Δψ.", "c2z_anti": "При блоке цепи Δψ остаётся ненулевым за счёт работы ATP-синтазы в обратном направлении (Chinopoulos 2010); величина остаточного потенциала — допущение модели. Олигомицин или бонкрековая кислота прекращают этот перенос H⁺: сочетание олигомицина и антимицина A — один из способов деполяризации в работах по PINK1 (Lazarou 2015; в других работах — CCCP).", "c2z_anti_f": "При блоке цепи остаточный Δψ поддерживает обратная работа ATP-синтазы (Chinopoulos 2010; величина остаточного потенциала — результат модели). FCCP возвращает H⁺ в матрикс в обход синтазы, и модуль Δψ тем меньше, чем выше доза.", "c2z_anti_off": "Остаточный Δψ при ингибировании цепи поддерживала обратная работа ATP-синтазы. В нейронах олигомицин после ротенона или стигмателлина вызывал дополнительную деполяризацию (Chinopoulos 2010). Когда синтаза заблокирована (олигомицин) или обмен ADP/ATP заблокирован (бонкрековая кислота), в модели механизмы поддержания потенциала отсутствуют: Δψ равен 0, индекс импорта минимален, индекс предпосылок накопления PINK1 максимален.", "c2z_pier": "В присутствии пиерицидина A сохраняется небольшой протонный ток дыхательной цепи (остаточное дыхание; параметры согласованы с семинаром 8). Δψ определяется соотношением токов, создающих потенциал, — дыхательной цепи и ATP-синтазы, работающей в обратном направлении, — и токов, снижающих его. Ниже отметки ≈ 108 мВ ATP из митохондрий не поступает, тогда как импорт белков сохраняется, пока |Δψ| выше условного порога (≈ 45 мВ).", "c2z_pier_off": "В присутствии пиерицидина A остаточный протонный ток дыхательной цепи уравновешивается утечкой H⁺ и поступлением Ca²⁺. ATP-синтаза, которая без её ингибирования поддерживала потенциал работой в обратном направлении, теперь не переносит H⁺.", "c2z_rho": "У клеток ρ⁰ Δψ создаёт не цепь, а электрогенный обмен ATP⁴⁻/ADP³⁻ в сочетании с гидролизом ATP F₁-АТФазой неполного комплекса ATP-синтазы; ATP образуется при гликолизе (Appleby 1999). При обычной нагрузке Ca²⁺ в исходном состоянии модели абсолютная величина потенциала оценена как ≈ 67 мВ (верхняя оценка по накоплению TPMP⁺); по оценке авторов, такого потенциала достаточно для импорта белков, кодируемых ядерным геномом. Олигомицин на него не действует, а ингибиторы ANT его устраняют.", "c2z_rho_f": "Электрогенный ток ρ⁰ мал (в модели — около 8 % максимального тока цепи), FCCP возвращает H⁺ в матрикс, и мембрана деполяризуется; индекс импорта снижается, когда модуль Δψ приближается к середине условной кривой.", "c2z_rho_bka": "В опытах ингибиторы ANT снижали абсолютную величину Δψ клеток ρ⁰ или вызывали полную деполяризацию (Appleby 1999; Buchet & Godinot 1998). При блокировании обмена ATP⁴⁻/ADP³⁻ электрогенный ток прекращается. В модели других механизмов поддержания потенциала не предусмотрено, поэтому Δψ равен 0; в опытах наблюдали как снижение абсолютной величины Δψ, так и его исчезновение.", "c2_puz": "Три образца (X, Y, Z) имеют малую абсолютную величину Δψ и низкий сигнал TMRM. Для каждого показан сигнал TMRM в протоколе «исходно → олигомицин → FCCP» и потребление O₂ до добавления препаратов. Один из образцов — клетки ρ⁰.", "c2_puz_z": "Низкий сигнал TMRM сам по себе не указывает на причину: блок цепи, разобщитель и отсутствие мтДНК дают сходные значения. Образцы различают по дыханию и по реакции на олигомицин.", "c2_puz_ans": "Образцы подписаны на графике. Образец Z — клетки ρ⁰: потребление O₂ составляет 0,00, а олигомицин не изменяет сигнал TMRM (0,07 → 0,07). В образце X ингибирована дыхательная цепь: потребление O₂ также равно 0,00, но олигомицин устраняет остаточный потенциал, и сигнал TMRM снижается (0,14 → 0,01). В образец Y добавлен разобщитель: потребление O₂ составляет 0,92.", "c2_puz_ans_z": "По потреблению O₂ можно отличить разобщённые клетки, у которых оно высокое, от клеток с ингибированной дыхательной цепью и клеток ρ⁰, у которых оно близко к нулю. По реакции на олигомицин можно различить две последние группы. В клетках ρ⁰ сигнал не изменяется: в неполном комплексе ATP-синтазы отсутствует субъединица a, от которой зависит чувствительность к олигомицину. При ингибированной дыхательной цепи остаточный Δψ поддерживает ATP-синтаза, работающая в обратном направлении; олигомицин прекращает её работу и устраняет этот потенциал.", "p2b_1_q": "В модели максимальную мощность дыхательной цепи уменьшают со 100 до 30 % исходной. Доступность ATP в матриксе для импортного мотора считают достаточной. Как изменятся поступление ATP из митохондрий в цитоплазму и импорт белка-предшественника через TIM23?", "p2b_1_o1": "Поступление ATP в цитоплазму снизится более чем вдвое, а импорт почти не изменится.", "p2b_1_o2": "Оба процесса замедлятся пропорционально уменьшению модуля Δψ.", "p2b_1_o3": "Импорт замедлится сильнее, чем поступление ATP: перенос сигнальной последовательности требует большего модуля Δψ.", "p2b_1_e": "Δψ изменяется с −139 до −119 мВ: его модуль уменьшается на 20 мВ, примерно на 14 %. В модели покрытие заданной потребности за счёт поступления ATP из митохондрий снижается с 98 до 43 %, а индекс импорта остаётся около 100 %. Середина условной зависимости поступления ATP находится около 120 мВ; отметка 108 мВ связана с оценкой изменения направления обмена через ANT при определённых концентрациях нуклеотидов и не является универсальным порогом синтеза ATP (Gerencser 2012; Chinopoulos 2010). Импорт рассчитывается по отдельной условной кривой с серединой 45 мВ при достаточном ATP в матриксе; белки-предшественники различаются по зависимости от Δψ (Martin 1991). Относительный сигнал TMRM снижается с 1,00 до 0,47; потребление O₂ дыхательной цепью — с 0,60 до 0,30.", "p2b_1_w2": "Зависимости от Δψ различаются и нелинейны. В данной модели уменьшение модуля Δψ примерно на 14 % снижает поступление ATP из митохондрий более чем вдвое, а импорт при достаточном ATP в матриксе почти не меняется.", "p2b_1_w3": "В данной модели импорт менее чувствителен к умеренной деполяризации, чем поступление ATP в цитоплазму. Сохранение импорта при достаточно низком потенциале согласуется с оценкой для клеток ρ⁰ (Appleby 1999). Это не задаёт общего порога для всех белков-предшественников: зависимость от Δψ различается, а матриксный импорт требует также ATP (Martin 1991).", "p2b_2_q": "При достаточном ATP для импортного мотора дозу FCCP в модели увеличивают до 200 % выбранной опорной дозы. Как изменятся поступление ATP из митохондрий в цитоплазму и импорт белка-предшественника?", "p2b_2_o1": "Поступление ATP из митохондрий прекратится, а импорт сохранится.", "p2b_2_o2": "Прекратятся оба процесса: оба используют Δψ.", "p2b_2_o3": "Оба процесса продолжатся, но замедлятся.", "p2b_2_e": "Δψ составляет −79 мВ. Поступление ATP из митохондрий в цитоплазму в модели прекращается, а индекс импорта остаётся около 98,6 % при достаточном ATP для импортного мотора. Отметка 108 мВ относится к выбранному ориентиру изменения направления обмена через ANT, а не к универсальному порогу ATP-синтазы (Gerencser 2012; Chinopoulos 2010). Сохранение импорта при сравнительно низком потенциале согласуется с оценкой для клеток ρ⁰ (Appleby 1999); форма кривой импорта условная. Сигнал TMRM составляет 0,11, поступление Ca²⁺ — 0,13 исходного уровня. Предпосылки накопления PINK1 выражены условным индексом 1,4 %; это не измеренная доля молекул PINK1 (Jin 2010; Narendra 2010).", "p2b_2_w2": "Δψ нужен обоим процессам, но их зависимости различаются. При −79 мВ поступление ATP из митохондрий в модели прекращается, а импорт при достаточном ATP для импортного мотора сохраняется. Сохранение импорта при низком потенциале согласуется с оценкой для клеток ρ⁰, но не задаёт универсального порога всех белков (Appleby 1999; Martin 1991).", "p2b_2_w3": "В данном состоянии модели поступление ATP из митохондрий равно нулю, а не просто замедлено; импорт при достаточном ATP в матриксе сохраняется почти полностью. Синтез и экспорт ATP здесь объединены в один условный поток; их термодинамические условия в реальных митохондриях различаются (Chinopoulos 2010).", "p2b_3_q": "Дозу FCCP повышают с 200 до 400 % дозы, подобранной при титровании. Что произойдёт с импортом белков-предшественников и с PINK1?", "p2b_3_o1": "Импорт почти прекратится; возникнут условия для накопления PINK1 на наружной мембране.", "p2b_3_o2": "Импорт сохранится: Δψ нужен для синтеза ATP, а перенос белков происходит независимо от Δψ.", "p2b_3_o3": "Импорт прекратится, но PINK1 останется на низком уровне: протеаза PARL расщепляет его независимо от Δψ.", "p2b_3_e": "При Δψ около −8 мВ индекс импорта в модели снижается с 98,6 до 1 %. Глубокая деполяризация препятствует Δψ-зависимому переносу сигнальной последовательности через комплекс TIM23 (Martin 1991; о механизме — Fielden 2023). Нарушение импорта и обработки PINK1 создаёт условия для его накопления на наружной мембране (Jin 2010; Narendra 2010). Числа 1,4 и 99 % на экране — условный индекс модели, а не измеренная доля PINK1 и не скорость митофагии. Относительный сигнал TMRM — около 0,01.", "p2b_3_w2": "Δψ нужен не только для синтеза ATP: он необходим для переноса положительно заряженной сигнальной последовательности через внутреннюю мембрану (Martin 1991; Chacinska 2009). При глубокой деполяризации импорт почти прекращается.", "p2b_3_w3": "Протеаза PARL расщепляет PINK1 внутри митохондрии, после импорта; при потере Δψ импорт останавливается, PINK1 не попадает к PARL и накапливается на наружной мембране (Jin 2010).", "p2a_1_q": "К клетке добавлен олигомицин (Ca²⁺ в цитоплазме не меняется). Что произойдёт со входом Ca²⁺ в матрикс через MCU?", "p2a_1_o1": "Вход вырастет: |Δψ| повысится, а ток через MCU определяется Δψ.", "p2a_1_o2": "Вход не изменится: MCU не связан с ATP-синтазой.", "p2a_1_o3": "Вход снизится: без синтеза ATP транспорту Ca²⁺ не хватает энергии.", "p2a_1_e": "Олигомицин блокирует перенос H⁺ через ATP-синтазу, и мембрана гиперполяризуется (Δψ −139 → −149 мВ). MCU — канал, преимущественно проводящий ток в направлении матрикса и особенно эффективный в энергизованных митохондриях. Его работа непосредственно не связана с гидролизом ATP (Kirichok 2004), а ток увеличивается с ростом |Δψ|: поступление Ca²⁺ меняется с 1,00 до 1,40 относительно исходного уровня. Величина эффекта условная: в модели изменение потенциала на 30 мВ соответствует изменению тока в e раз. Направление эффекта от крутизны зависимости не зависит. Покрытие потребности за счёт поступления ATP из митохондрий снижается с 98 до 0 %, а сигнал TMRM увеличивается с 1,00 до 1,45.", "p2a_1_w2": "Прямой связи MCU с ATP-синтазой нет, но ток через MCU зависит от Δψ, а Δψ после олигомицина меняется (−139 → −149 мВ). Влияние косвенное.", "p2a_1_w3": "Транспорт Ca²⁺ через MCU идёт по электрохимическому градиенту и энергию ATP не использует (Kirichok 2004); при гиперполяризации он ускоряется, а не замедляется.", "p2a_2_q": "Условный коэффициент входа Ca²⁺ через MCU повышают в 60 раз. При неизменном Δψ он увеличил бы входной ток в 60 раз, но сам потенциал может измениться. Ca²⁺-зависимая активация дегидрогеназ матрикса здесь не учитывается. Что произойдёт с модулем Δψ и потреблением O₂ дыхательной цепью?", "p2a_2_o1": "|Δψ| снизится, потребление O₂ вырастет: ток Ca²⁺ снижает Δp и ослабляет торможение переноса электронов.", "p2a_2_o2": "|Δψ| и потребление O₂ не изменятся: вход Ca²⁺ слишком мал, чтобы влиять на баланс токов.", "p2a_2_o3": "|Δψ| и потребление O₂ снизятся: скорость дыхания уменьшается вместе с |Δψ|.", "p2a_2_e": "Вход Ca²⁺ — перенос положительных зарядов в матрикс за счёт Δψ. Коэффициент ×60 относится к формуле входа: при неизменном Δψ ток вырос бы в 60 раз, но мембрана деполяризуется (−139 → −124 мВ, модуль и Δp меньше на ≈ 11 %; Brand & Nicholls 2011: 10–20 % при накоплении Ca²⁺), и фактический вход больше исходного в 36 раз. Торможение переноса электронов высокой Δp ослабевает, и потребление O₂ увеличивается с 0,60 до 0,97. Контроль: при ингибиторе MCU то же воздействие почти не меняет Δψ (−139 мВ) и O₂ (0,59). Ускорение реакций, катализируемых дегидрогеназами матрикса, под действием Ca²⁺ (Denton 2009) здесь не учитывается — это вопрос 3; поэтому показание поступления ATP при повышенной нагрузке Ca²⁺ не приводится.", "p2a_2_w2": "При обычной нагрузке вход мал (≈ 1,5 % максимального протонного тока модели), но при коэффициенте ×60 фактический вход больше исходного в 36 раз, и Δp снижается примерно на 11 % (Brand & Nicholls 2011: 10–20 %).", "p2a_2_w3": "При прочих равных высокая Δp тормозит перенос электронов. Деполяризация ослабляет это торможение, как и при добавлении разобщителя (вопрос 1), поэтому потребление O₂ увеличивается.", "p2a_3_q": "К клетке при обычной нагрузке Ca²⁺ добавлен ингибитор MCU. Что произойдёт с Δψ и потреблением O₂?", "p2a_3_o1": "Модуль Δψ и потребление O₂ изменятся слабо; вход Ca²⁺ через MCU прекратится.", "p2a_3_o2": "Модуль Δψ вырастет на десятки мВ: ток Ca²⁺ — основной ток, снижающий разность потенциалов на мембране.", "p2a_3_o3": "Модуль Δψ и потребление O₂ снизятся: без входа Ca²⁺ цепь не может работать.", "p2a_3_e": "Δψ изменяется с −139,0 до −139,3 мВ (на 0,3 мВ), потребление O₂ — с 0,60 до 0,59, поступление Ca²⁺ — с 1,00 до 0. Базальный ток Ca²⁺ составляет около 1,5 % максимального протонного тока модели (Brand & Nicholls 2011: 1–2 %), поэтому его подавление почти не изменяет баланс токов. Это согласуется с опытами по нокдауну MCU: в культивируемых клетках и в печени мыши дыхание и Δψ оставались прежними (Baughman 2011; при хроническом подавлении возможна компенсация). Вывод относится к клеткам без перегрузки Ca²⁺. Роль постоянного переноса Ca²⁺ из ЭПР в базальном метаболизме рассматривается в вопросе 3.", "p2a_3_w2": "Базальный ток Ca²⁺ невелик (≈ 1,5 % протонного тока): его подавление сдвигает Δψ лишь на 0,3 мВ. Вход Ca²⁺ заметно влияет на баланс токов при высокой нагрузке (предыдущий шаг).", "p2a_3_w3": "Окисление NADH дыхательной цепью не требует Ca²⁺; в опытах с нокдауном MCU дыхание клеток осталось прежним (Baughman 2011).", "p2a_4_q": "В вопросе 1 (продвинутый уровень, шаг 5) олигомицин при блоке цепи антимицином A блокирует работу ATP-синтазы в обратном направлении, и мембрана деполяризуется почти до нуля. Что при этом произойдёт с импортом белков-предшественников через TIM23 и с PINK1?", "p2a_4_o1": "Импорт почти прекратится, PINK1 накопится на наружной мембране.", "p2a_4_o2": "Импорт не изменится: TIM23 не зависит от Δψ, нужен только ATP.", "p2a_4_o3": "Импорт ускорится: ATP больше не расходуется ATP-синтазой.", "p2a_4_e": "Остаточный Δψ (−87 мВ) при блоке цепи создаёт обратная работа ATP-синтазы — гидролиз ATP с переносом H⁺ из матрикса (Chinopoulos 2010; величина остаточного потенциала — результат модели вопроса 1). Олигомицин блокирует F₀ и прекращает этот перенос H⁺: Δψ −87 → 0 мВ (других источников тока в модели нет), индекс импорта 99,5 → 0,4 %, индекс предпосылок накопления PINK1 0,5 → 99,6 %. В нейронах олигомицин после ротенона или стигмателлина вызывал дополнительную деполяризацию (Chinopoulos 2010). Сочетание олигомицина и антимицина A — один из способов деполяризации в работах по PINK1 (Lazarou 2015; в других работах — CCCP: Jin 2010, Narendra 2010). TMRM 0,14 → 0,01.", "p2a_4_w2": "Перенос сигнальной последовательности через TIM23 идёт за счёт Δψ (Martin 1991): при Δψ ≈ 0 импорт останавливается, а PINK1 остаётся на наружной мембране.", "p2a_4_w3": "ATP матрикса действительно нужен импорту (шаперон mtHsp70; Chacinska 2009), но без Δψ сигнальная последовательность не проходит через TIM23: импорт останавливается, а не ускоряется.", "p2a_5_q": "В клетках ρ⁰ отсутствует мтДНК; нарушены работа дыхательной цепи и сборка полноценной ATP-синтазы. Сохраняются гликолиз и ядерно кодируемые системы импорта. Каким будет мембранный потенциал и сохранится ли импорт белков-предшественников по сравнению с обычной клеткой?", "p2a_5_o1": "Модуль Δψ меньше, чем в обычной клетке, но потенциал сохраняется и импорт идёт.", "p2a_5_o2": "Мембрана полностью деполяризуется, импорт остановится: потенциал создаёт только цепь.", "p2a_5_o3": "Δψ не отличается от обычной клетки: потенциал создаёт ATP-синтаза, а не цепь.", "p2a_5_e": "В модели Δψ клеток ρ⁰ составляет −67 мВ (в обычной клетке −139 мВ), индекс импорта — 94 %, потребление O₂ дыхательной цепью — 0,00, сигнал TMRM — 0,07. Потенциал поддерживается электрогенным обменом через ANT: ATP⁴⁻ поступает в матрикс, а ADP³⁻ выходит из него. F₁-АТФаза неполного комплекса ATP-синтазы гидролизует ATP; в комплексе отсутствуют субъединицы F₀ ATP6 и ATP8, кодируемые мтДНК. Олигомицин не влияет на этот потенциал, тогда как ингибиторы ANT и азид устраняют его (Appleby 1999; Buchet & Godinot 1998). В клетках ρ⁰ линии 143B абсолютная величина Δψ оценена как ≈ 67 мВ — верхняя оценка по накоплению TPMP⁺. По оценке авторов, такого потенциала достаточно для импорта белков, кодируемых ядерным геномом; на его поддержание расходуется около 13 % ATP, образующегося при гликолизе (Appleby 1999). Параметры модели согласованы с этой единственной оценкой.", "p2a_5_w2": "Без цепи потенциал не исчезает: в клетках ρ⁰ белки, кодируемые ядерным геномом, импортируются (Appleby 1999), а импорт требует Δψ (Martin 1991). Потенциал создаёт другой механизм — электрогенный обмен ATP⁴⁻/ADP³⁻ с гидролизом ATP на F₁.", "p2a_5_w3": "В клетках ρ⁰ комплекс ATP-синтазы неполный: в нём отсутствуют субъединицы a и A6L, поэтому он не переносит H⁺. Потенциал поддерживается обменом ATP⁴⁻/ADP³⁻ в сочетании с гидролизом ATP на F₁. Его абсолютная величина меньше, чем в клетках с работающей дыхательной цепью: в модели Δψ составляет −67 мВ против −139 мВ.", "p2a_6_q": "К клеткам ρ⁰ добавлена бонкрековая кислота (ингибитор ADP/ATP-переносчика). Что произойдёт с Δψ и импортом белков-предшественников?", "p2a_6_o1": "Мембрана деполяризуется, импорт снизится.", "p2a_6_o2": "Δψ не изменится: потенциал у ρ⁰ создаёт ATP-синтаза, а не ADP/ATP-переносчик.", "p2a_6_o3": "Мембрана гиперполяризуется, как после олигомицина в обычной клетке.", "p2a_6_e": "Δψ −67 → 0 мВ, индекс импорта 94 → 0,4 %. У ρ⁰ потенциал создаёт электрогенный обмен ATP⁴⁻/ADP³⁻ через ANT вместе с гидролизом ATP на F₁; в модели без этого обмена других источников тока нет. В опытах ингибиторы ANT и азид устраняли Δψ клеток ρ⁰, а олигомицин — нет (Appleby 1999); бонкрековая кислота и ауровертин уменьшали абсолютную величину Δψ, и эффекты складывались, поэтому авторы допускают участие и других электрогенных систем (Buchet & Godinot 1998). В опытах наблюдали уменьшение абсолютной величины Δψ или полную деполяризацию; импорт при этом не измеряли. PINK1 у ρ⁰ не показан: прямых данных нет.", "p2a_6_w2": "Неполная ATP-синтаза (F₁) создаёт потенциал только вместе с ANT: гидролиз ATP на F₁ поставляет ADP, который ANT обменивает на ATP цитоплазмы с переносом заряда. Бонкрековая кислота блокирует этот обмен (Appleby 1999; Buchet & Godinot 1998).", "p2a_6_w3": "В клетке с работающей дыхательной цепью олигомицин вызывает гиперполяризацию, прекращая возврат H⁺ через ATP-синтазу при сохранении их переноса из матрикса дыхательной цепью. В клетках ρ⁰ дыхательная цепь отсутствует, а потенциал поддерживается электрогенным обменом ATP⁴⁻/ADP³⁻. Блокирование этого обмена вызывает деполяризацию.", "p2a_7_q": "Δψ в модели изменяется с −139 до −119 мВ после добавления FCCP; его модуль уменьшается примерно на 14 %. Как изменится относительный сигнал TMRM в режиме без тушения флуоресценции при остальных неизменных условиях?", "p2a_7_o1": "Снизится примерно вдвое.", "p2a_7_o2": "Снизится примерно на 14 %, как Δψ.", "p2a_7_o3": "Снизится почти до нуля.", "p2a_7_e": "Распределение красителя описывается уравнением Нернста: при 37 °C сигнал митохондрий ∝ exp(|Δψ|/26,7 мВ). Поэтому при уменьшении |Δψ| примерно на 18,5 мВ сигнал снижается вдвое. Деполяризация с −139 до −119 мВ уменьшает относительный сигнал с 1,00 до 0,47 (Perry 2011). Условия: режим без тушения флуоресценции (≈ 0,5–30 нМ). Сигнал также зависит от потенциала плазматической мембраны, связывания красителя и фотоэффектов (Perry 2011; Scaduto & Grotyohann 1999), поэтому для перевода в мВ необходима отдельная калибровка. Для контроля используют FCCP, обеспечивающий минимальный сигнал, и олигомицин. Импорт белков при этом сохраняется: индекс составляет 100 %.", "p2a_7_w2": "Так было бы при линейной зависимости сигнала от Δψ. Зависимость экспоненциальная (Нернст): снижение |Δψ| на 20 мВ уменьшает сигнал примерно в 2,1 раза.", "p2a_7_w3": "К минимуму сигнал приближается при глубокой деполяризации (контроль FCCP в больших дозах). Здесь модуль Δψ остаётся 119 мВ, сигнал 0,47 при исходном 1,00.", "p2a_8_q": "Три образца (X, Y, Z) характеризуются малой абсолютной величиной Δψ и низким сигналом TMRM. На графике показан сигнал TMRM при последовательном добавлении препаратов «исходно → олигомицин → FCCP», а ниже — потребление O₂ до их добавления. Какой из образцов представляет собой клетки ρ⁰?", "p2a_8_o1": "Образец X.", "p2a_8_o2": "Образец Y.", "p2a_8_o3": "Образец Z.", "p2a_8_e": "Z — клетки ρ⁰: потребление O₂ дыхательной цепью в модели равно 0,00, а олигомицин не меняет сигнал TMRM (0,07 → 0,07). Δψ поддерживается электрогенным обменом через ANT в сочетании с гидролизом ATP на F₁; полноценный комплекс F₀F₁, способный переносить H⁺, отсутствует (Appleby 1999). X — образец с антимицином A: дыхания тоже нет, но олигомицин прекращает поддержание потенциала ATP-синтазой, работающей в обратном направлении: TMRM 0,14 → 0,01. Y — образец с FCCP 200 %: потребление O₂ 0,92; TMRM после олигомицина 0,11 → 0,09. Конечная добавка FCCP приближает сигнал всех образцов к минимуму модели (около 0,01). Одно низкое значение сигнала TMRM не позволяет установить причину.", "p2a_8_w1": "У X дыхания тоже нет, но олигомицин снижает TMRM с 0,14 до 0,01: потенциал поддерживала ATP-синтаза, работавшая в обратном направлении. У ρ⁰ полноценный комплекс F₀F₁ отсутствует, и олигомицин не прекращает электрогенный обмен через ANT, поддерживаемый гидролизом ATP на F₁.", "p2a_8_w2": "У Y потребление O₂ составляет 0,92. В клетках ρ⁰ функциональная дыхательная цепь отсутствует, поэтому её вклад в потребление O₂ близок к нулю. Низкий сигнал TMRM у Y (0,11) вызван действием разобщителя.", "gn_dpsi2": "Δψ внутренней мембраны: шкала и отметки", "g_dpsi2": "Δψ — разность электрических потенциалов между матриксом и межмембранным пространством; матрикс отрицателен. Деполяризация делает Δψ менее отрицательным и уменьшает его модуль: −139 → −119 мВ означает уменьшение модуля 139 → 119 мВ. Исходные −139 мВ выбраны по измерению в корковых нейронах крысы в культуре; при разных воздействиях в той работе наблюдались значения от −108 до −158 мВ (Gerencser 2012). Отметка около 108 мВ связана с изменением направления обмена через ANT при определённых концентрациях нуклеотидов, а не с универсальным порогом ATP-синтазы (Chinopoulos 2010). Отметка 67 мВ — верхняя оценка для интактных ρ⁰-клеток линии 143B (Appleby 1999). Полосы справа показывают условные зависимости при заданном потенциале; действие ингибиторов и наличие ATP необходимо учитывать отдельно. Кривая импорта условная, с серединой 45 мВ при достаточном ATP для импортного мотора. Отметка около 0 соответствует глубокой деполяризации.", "gn_chain2": "Дыхательная цепь как источник тока (вопрос 2)", "g_chain2": "На схеме комплексы I, III и IV объединены в один блок. При окислении NADH они переносят 10 H⁺ из матрикса на два электрона (Brand & Nicholls 2011). Высокая Δp тормозит перенос электронов. Ползунок задаёт максимальную мощность цепи относительно исходной: 100 % — исходная мощность, 0 % — отсутствие переноса электронов. Фактическая скорость зависит также от Δp. Пиерицидин A подавляет комплекс I, антимицин A — комплекс III; их действие упрощено так же, как в вопросе 1.", "gn_antx": "ADP/ATP-переносчик (ANT), переносчик фосфата и ATP из митохондрий", "g_antx": "Обмен ATP⁴⁻ (наружу) на ADP³⁻ (внутрь) переносит один отрицательный заряд наружу за цикл: он электрогенный и зависит от Δψ (Klingenberg 2008; токи реконструированного переносчика — Brustovetsky 1996). Отметка −108 мВ выбрана по оценке изменения направления обмена через переносчик при определённых концентрациях нуклеотидов. При этих условиях достаточно большая абсолютная величина Δψ поддерживает экспорт ATP; универсальной границей для любых клеток это число не является (Gerencser 2012, со ссылкой на Chinopoulos 2010). В модели ток синтазы прекращается при том же значении — допущение: у синтазы собственный потенциал изменения направления работы, и между двумя потенциалами она может гидролизовать ATP матрикса, пока переносчик ещё работает в прямом направлении (Chinopoulos 2010). Перенос фосфата через PiC электронейтрален и работает за счёт ΔpH (Phelps 1996, дрожжи; Ferreira & Pedersen 1993); на схеме PiC показан серым, без тока. Бонкрековая кислота блокирует ANT; в нейронах после ротенона или стигмателлина она вызывала временную реполяризацию, затем деполяризацию, сходную с действием олигомицина (Chinopoulos 2010); в модели она блокирует обмен: ток через синтазу равен нулю, временная реполяризация не воспроизводится.", "gn_pic": "Переносчик фосфата (PiC)", "g_pic": "PiC переносит фосфат в матрикс за счёт градиента pH. Перенос электронейтрален и непосредственно не использует Δψ (Phelps 1996, реконструированный переносчик дрожжей; Ferreira & Pedersen 1993: H⁺/Pi-симпорт). На схеме PiC показан серым: перенос через него не создаёт электрического тока, а численные значения потока фосфата в модели не рассчитываются.", "gn_mcu": "Унипортер Ca²⁺ (MCU)", "g_mcu": "MCU — избирательный к Ca²⁺ канал внутренней мембраны, преимущественно проводящий ток в направлении матрикса. Он особенно эффективен в энергизованных митохондриях; его работа непосредственно не связана с гидролизом ATP (Kirichok 2004, патч-кламп митопластов). Основу канала образует белок MCU (Baughman 2011; De Stefani 2011). Базальный ток Ca²⁺ составляет 1–2 % максимального протонного тока, при накоплении Ca²⁺ Δp падает на 10–20 % (Brand & Nicholls 2011). В модели каждому переносимому иону Ca²⁺ соответствуют 2 положительных заряда, скорость растёт в e раз на каждые 30 мВ (условно); нагрузки ×10 и ×60 — условные множители формулы входа, а не концентрации Ca²⁺ в цитоплазме; ×60 подобрана так, чтобы Δp снижалась на ≈ 11 % (фактический вход при этом выше исходного в 36 раз, потому что мембрана деполяризуется). Нокдаун MCU в культивируемых клетках и в печени мыши оставлял дыхание и Δψ прежними (Baughman 2011). Ускорение реакций, катализируемых дегидрогеназами матрикса, под действием Ca²⁺ (Denton 2009) — вопрос 3.", "gn_ru": "Ингибитор MCU (Ru360, Ru265)", "g_ru": "Рутениевые ингибиторы MCU. Ru360 подавляет вход Ca²⁺ в изолированных митохондриях и в интактных кардиомиоцитах (Matlib 1998); в культуре корковых нейронов, по данным авторов, Ru265 в отличие от Ru360 достигал концентраций, при которых сохранялась жизнеспособность клеток (Novorolsky 2020). Ru265 проникает в клетки и не меняет Δψ (Woods 2019), но блокирует каналы плазматической мембраны (P/Q-типа и KCNQ; Xu 2024). На экране показан обобщённый ингибитор: вход Ca²⁺ в матрикс равен нулю.", "gn_tim23": "TOM и TIM23: импорт белков с сигнальной последовательностью", "g_tim23": "Белки-предшественники с N-концевой сигнальной последовательностью могут проходить наружную мембрану через TOM и внутреннюю — через комплекс TIM23. Δψ необходим для переноса положительно заряженной сигнальной последовательности (Martin 1991). Транспорт зрелой части белка в матрикс поддерживает ATP-зависимый импортный мотор PAM с mtHsp70; его работу здесь считают обеспеченной ATP и не рассчитывают отдельно. Историческая схема канала Tim23 (Truscott 2001) уточнена структурными и функциональными работами: центральную роль в пути переноса играет Tim17 (Fielden 2023). Название комплекса TIM23 сохраняется; комплекс, его отдельные субъединицы и импортный мотор нужно различать. Через TOM и TIM23 идёт лишь часть митохондриальных белков; другие пути импорта описаны в справочной карточке.", "gn_import": "Импорт белка-предшественника: показание и порог", "g_import": "Показание — условный индекс Δψ-зависимого импорта через TIM23 при достаточном ATP для импортного мотора. В исходном состоянии модуль Δψ значительно выше середины выбранной кривой. В модели зависимость от |Δψ| — сигмоида: половина активности при 45 мВ, ширина 8 мВ; это допущение. Опорных точек две: в клетках ρ⁰ белки, кодируемые ядерным геномом, импортируются, хотя |Δψ| не больше ≈ 67 мВ (верхняя оценка; Appleby 1999); при полной деполяризации импорт PINK1 прекращается (Jin 2010; Narendra 2010). В изолированных митохондриях дрожжей по предварительной оценке (калиевый диффузионный потенциал; допущение 60–100 мМ K⁺ в матриксе) минимальный Δψ ≈ 40 мВ для белка-предшественника с сигнальной последовательностью субъединицы 9 F₀ и не менее ≈ 60 мВ для других белков-предшественников с отщепляемой сигнальной последовательностью (на примере Fe/S-белка; Martin 1991). Качественные ответы шагов сценария сохраняются при середине сигмоиды 25–60 мВ и ширине 3–8 мВ (проверка расчётом: у ρ⁰ и при FCCP 200 % импорт не ниже 70 %, при FCCP 400 % и при блоке цепи вместе с олигомицином не выше 11 %); численные значения индексов импорта и предпосылок накопления PINK1 зависят от параметров.", "gn_pink1": "PINK1 на наружной мембране", "g_pink1": "В поляризованных митохондриях PINK1 входит через TOM/TIM23, расщепляется протеазой PARL и разрушается; при рассеянии Δψ полноразмерный PINK1 (63 кДа) накапливается на наружной мембране и привлекает Parkin (Jin 2010; Narendra 2010; клетки HeLa и MEF, CCCP). Накопление избирательное: PINK1 накапливается на деполяризованных митохондриях внутри одной клетки (Narendra 2010). Для деполяризации используют CCCP или сочетание олигомицина и антимицина A (Lazarou 2015). Показание на экране — условный индекс предпосылок накопления (1 минус индекс импорта), а не количество PINK1: количественная зависимость накопления от Δψ в прочитанных работах не найдена; для ρ⁰ не приводится (прямых данных нет). Накопление PINK1 не доказывает избирательное удаление дефектных митохондрий.", "gn_rho0": "Клетки ρ⁰ (без мтДНК)", "g_rho0": "У клеток ρ⁰ нет мтДНК, поэтому нет функциональной дыхательной цепи и субъединиц F₀ ATP6 и ATP8 (ядерно кодируемые белки, в том числе комплекс II, сохраняются). Δψ сохраняется: его создаёт электрогенный обмен ATP⁴⁻/ADP³⁻ в сочетании с гидролизом ATP F₁-АТФазой неполного комплекса ATP-синтазы в матриксе; ATP образуется при гликолизе (Appleby 1999; Buchet & Godinot 1998). Значения: максимальная абсолютная величина потенциала ≈ 110 мВ в пермеабилизованных клетках и ≈ 67 мВ в интактных (по накоплению TPMP⁺; для интактных клеток это верхняя оценка при допущении, что весь внутриклеточный TPMP⁺ находится в митохондриях; ρ⁰-клетки линии 143B); ингибиторы ANT и азид устраняют Δψ, а олигомицин — нет; поддержание Δψ расходует около 13 % гликолитического ATP (Appleby 1999). Оценки зависят от линии и метода: по флуоресценции родамина 123 сигнал у ρ⁰ 143B составляет лишь 10–20 % от нормы, а у ρ⁰ HeLa S3 — как у родительских клеток (Buchet & Godinot 1998). Бонкрековая кислота и ауровертин уменьшают абсолютную величину Δψ, их эффекты складываются (Buchet & Godinot 1998). В модели: электрогенный ток обмена через ANT вместе с гидролизом ATP на F₁ (около 8 % максимального тока цепи; переноса H⁺ через неполную синтазу нет), подобранный так, что Δψ равен −67 мВ; цепь на схеме перечёркнута.", "gn_tmrm": "TMRM: зонд Δψ", "g_tmrm": "TMRM — катионный краситель. При неизменных остальных условиях отношение его концентраций в матриксе и вне матрикса зависит от Δψ согласно уравнению Нернста. В модели относительный сигнал равен exp((модуль Δψ − 139 мВ)/26,7 мВ) при 37 °C: уменьшение модуля на 20 мВ снижает сигнал примерно до 0,47, а не на 14 %. Модель учитывает только этот компонент распределения. Реальная флуоресценция зависит также от выбранной области измерения, фона, потенциала плазматической мембраны, связывания и режима красителя (Scaduto & Grotyohann 1999; Perry 2011). В режиме без тушения флуоресценции используют низкую концентрацию, выбранную для конкретного протокола. FCCP служит контролем деполяризации и минимального митохондриального накопления, а не нулевой флуоресценции. Для перевода сигнала в мВ нужна отдельная калибровка; данный интерактив её не выполняет (Gerencser 2012).", "gn_measure2": "Как измеряют Δψ, импорт и вход Ca²⁺", "g_measure2": "Δψ в клетках оценивают по распределению катионных красителей (TMRM, TMRE, JC-1) или липофильных катионов (TPMP⁺). Значения в мВ получают только после калибровки с учётом потенциала плазматической мембраны и связывания красителя (Gerencser 2012; Perry 2011). Импорт оценивают по появлению зрелой формы меченого белка-предшественника в изолированных митохондриях; для исследования зависимости от потенциала добавляют CCCP или валиномицин (Martin 1991). Для исследования переноса Ca²⁺ применяют патч-кламп митопластов (Kirichok 2004) и Ca²⁺-зонды матрикса. На продвинутом уровне график TMRM показывает результаты протокола «исходно → олигомицин → FCCP» для текущего образца, а не запись во времени. FCCP служит контролем деполяризации и минимального митохондриального накопления красителя; фоновая флуоресценция может сохраняться.", "gn_model2": "Что упрощено в вопросе 2", "g_model2": "Вопрос 2 использует протонный контур вопроса 1 и добавляет вход Ca²⁺ через MCU и условный электрогенный ток клеток ρ⁰. Импорт и индекс PINK1 вычисляются после определения Δψ; их вклад в баланс токов не рассчитывается. Вход Ca²⁺ увеличивается в e раз на 30 мВ, а коэффициенты нагрузки ×10 и ×60 условные. Импорт задан сигмоидой с серединой 45 мВ и шириной 8 мВ при достаточном ATP в матриксе. Индекс PINK1 равен 1 минус индекс импорта; количество белка и временная динамика не рассчитываются. Для ρ⁰ ток ANT/F₁ откалиброван на верхнюю оценку модуля Δψ 67 мВ (Appleby 1999); это электрогенный обмен нуклеотидов, а не перекачивание H⁺. Сигнал TMRM описан только распределением красителя согласно уравнению Нернста. Доля химического компонента Δp фиксирована на уровне 20 %. Не рассчитываются отдельно содержание ATP и ADP, работа PAM, выход и буферирование Ca²⁺, ускорение реакций дегидрогеназ под действием Ca²⁺ и калиевые токи. Их исключение — граница модели; оно не означает отсутствия этих механизмов. Действие ингибиторов упрощено; величина воздействия FCCP задаётся непрерывно. Клетки разных типов могут давать другие количественные ответы.", "teacher_4": "Вопрос 2: базовый уровень 5–7 минут, затем продвинутый 8–10 минут. На схеме одна и та же внутренняя мембрана и процессы, по-разному зависящие от Δψ: синтез и экспорт ATP (ATP-синтаза с обменом ADP/ATP), импорт через TIM23 и вход Ca²⁺ через MCU; шкала Δψ (мВ, со знаком) с тремя полосами справочных зависимостей без ингибиторов (при блоке пути полоса гаснет). Отметки шкалы: −139 мВ — исходный Δψ модели (корковые нейроны крысы в культуре; Gerencser 2012); −108 мВ — оценка изменения направления обмена через ADP/ATP-переносчик при определённых концентрациях нуклеотидов (Gerencser 2012; Chinopoulos 2010); −67 мВ — верхняя оценка Δψ клеток ρ⁰ линии 143B (Appleby 1999); 0 — полная деполяризация. Шаг 8 продвинутого уровня (загадка) выносит график TMRM в левую панель; в других шагах протокол TMRM до ответа показывает только исходную фазу. Нажатие на блок схемы, показание, полосу шкалы или метку препарата открывает справку (структурные формулы — у ATP, ADP и у препаратов вопроса 1; у бонкрековой кислоты и ингибитора MCU — только названия).", "teacher_5": "Устройство модели вопроса 2: протонный контур вопроса 1 дополнен входом Ca²⁺ через MCU и электрогенным током клеток ρ⁰; ток утечки H⁺ и ток Ca²⁺ становятся равными нулю при Δψ = 0. Вход Ca²⁺: ток — 2 заряда на ион, растёт в e раз на 30 мВ (условно); при обычной нагрузке — около 1,5 % максимального тока и входит в утечку вопроса 1; коэффициенты ×10 и ×60 — множители формулы входа (при ×60 Δp падает на ≈ 11 %, фактический вход — в 36 раз выше исходного). Импорт и индекс PINK1 вычисляются после нахождения Δψ и в баланс токов не входят: индекс импорта — сигмоида по модулю Δψ (половина при 45 мВ, ширина 8 мВ — условно, при достаточном ATP для мотора PAM); индекс предпосылок накопления PINK1 = 1 − индекс импорта. Клетки ρ⁰ — электрогенный обмен ANT вместе с гидролизом ATP на F₁ (ток около 8 % максимума цепи, калиброван на −67 мВ); прекращается под действием ингибитора ANT, но не олигомицина. Сигнал TMRM — относительная величина, рассчитанная по распределению красителя согласно уравнению Нернста (изменяется вдвое при изменении |Δψ| на 18,5 мВ). При обычной нагрузке Ca²⁺ и без ρ⁰ числа вопроса 2 совпадают с числами вопроса 1 (расхождение не более 10⁻¹³). Поступление ATP при повышенной нагрузке Ca²⁺ не приводится до вопроса 3. Ионофоры, работа PAM, выход и буферирование Ca²⁺, калиевые токи не моделируются.", "teacher_6": "Вопросы, требующие уточнения (вопрос 2). Порог импорта: известны две точки — в клетках ρ⁰ белки, кодируемые ядерным геномом, импортируются, хотя |Δψ| не больше ≈ 67 мВ (Appleby 1999; верхняя оценка по накоплению TPMP⁺; вывод «достаточно для импорта» сделан авторами по прежним данным о 30–60 мВ) — и при полной деполяризации импорт PINK1 прекращается (Jin 2010; Narendra 2010); в изолированных митохондриях дрожжей по грубой оценке (калиевый диффузионный потенциал) нужно ≈ 40 мВ (белок-предшественник с сигнальной последовательностью субъединицы 9 F₀) и не менее ≈ 60 мВ (Fe/S-белок; Martin 1991); форма кривой между точками — допущение. Порог ATP: −108 мВ — потенциал обращения ADP/ATP-переносчика в нейронах, он зависит от соотношения ATP/ADP в цитоплазме (Gerencser 2012); в модели потенциалы обращения синтазы и переносчика совпадают, у Chinopoulos 2010 они различаются. Остаточный Δψ при блоке цепи (−87 мВ в модели) — допущение вопроса 1; в нейронах после добавления ротенона или стигмателлина Δψ составлял ≈ −85 мВ, олигомицин вызывал дополнительную деполяризацию (Chinopoulos 2010). Δψ клеток ρ⁰ — одна оценка (верхняя граница); PINK1 при ρ⁰ — без прямых данных. Исправления к блоку координатора 9.2: электрогенен обмен ADP/ATP (Klingenberg 2008), перенос фосфата электронейтрален (Phelps 1996, дрожжи); Δψ — не движущая сила ATP-синтазы в отдельности, синтаза использует Δp; TIM23 — комплекс транслокации; представление о пути переноса уточнено данными о Tim17 (Fielden 2023). Импортный мотор включает mtHsp70 (Chacinska 2009); для TMRM, TMRE, JC-1 сигнал относительный (Perry 2011); значения −150…−180 мВ в блоке координатора не привязаны к условиям: для изолированных митохондрий −180…−190 мВ, для клеток −120…−160 мВ, в нейронах в культуре −139 мВ (Gerencser 2012); накопление PINK1 при деполяризации не доказывает избирательную митофагию.", "fm_nadh_c": "NADH: восстановленный никотинамидный фрагмент (R — остальная часть молекулы)", "fm_nad_c": "NAD⁺: никотинамидный фрагмент (R — остальная часть молекулы)", "fm_nadh": "NADH (полная формула)", "fm_nad": "NAD⁺ (полная формула)", "fm_q_c": "убихинон Q (R — изопреноидная цепь; у человека Q₁₀)", "fm_qh2_c": "убихинол QH₂ (R — изопреноидная цепь)", "fm_atp": "ATP", "fm_adp": "ADP", "fm_fccp": "FCCP", "fm_oligo": "олигомицин A", "fm_pier": "пиерицидин A", "fm_anti": "антимицин A", "fm_succ": "янтарная кислота (протонированная форма сукцината)", "fm_fum": "фумаровая кислота (протонированная форма фумарата)", "gn_cI": "Комплекс I (NADH:убихинон-оксидоредуктаза)", "g_cI": "Принимает два электрона от NADH матрикса и передаёт их убихинону; перенос сопряжён с перекачиванием H⁺ из матрикса в межмембранное пространство (Sazanov 2015; Kampjut & Sazanov 2020). Ингибируется ротеноном и пиерицидином A; оба действуют в области связывания убихинона (Degli Esposti 1998; Kampjut & Sazanov 2020).", "gn_cII": "Комплекс II (сукцинатдегидрогеназа)", "g_cII": "Окисляет сукцинат до фумарата (эта реакция также входит в цикл Кребса) и передаёт электроны убихинону. H⁺ не перекачивает. При входе электронов через комплекс II H⁺ перекачивают только комплексы III и IV: 6 H⁺ на 2 e⁻ вместо 10 (Brand & Nicholls 2011).", "gn_cIII": "Комплекс III (цитохром bc₁)", "g_cIII": "Передаёт электроны от убихинола цитохрому c; перенос сопряжён с перекачиванием H⁺ (Sazanov 2015). Механизм — Q-цикл (Mitchell 1976): убихинол окисляется на стороне комплекса, обращённой к межмембранному пространству, и отдаёт туда 2 H⁺; один электрон идёт через железо-серный центр Риске и цитохром c₁ к цитохрому c, второй — через гемы b на сторону матрикса, где восстанавливает убихинон. За два цикла окисляются две молекулы убихинола, восстанавливаются две молекулы цитохрома c и одна молекула убихинона (с захватом 2 H⁺ из матрикса). Итог: расходуется одна молекула убихинола, а на пару электронов, переданных цитохрому c, приходится 4 H⁺, выходящих в межмембранное пространство, и 2 H⁺, захватываемых из матрикса. Ингибируется антимицином A. При ингибировании комплекса перенос электронов и перекачивание H⁺ прекращаются, а электроны накапливаются на предшествующих переносчиках: образование супероксида усиливается (Korshunov 1997; Brand 2016).", "gn_cIV": "Комплекс IV (цитохром c-оксидаза)", "g_cIV": "Комплекс IV переносит электроны от цитохрома c на O₂ и переносит H⁺ через мембрану (Hosler 2006). Для восстановления одной молекулы O₂ до двух молекул H₂O нужны четыре электрона: J(e⁻) = 4·J(O₂); эти потоки пропорциональны, но имеют разные единицы. Ингибируется цианидом и CO (на схеме не показаны).", "gn_q": "Убихинон (кофермент Q)", "g_q": "Подвижный переносчик электронов в липидной фазе внутренней мембраны. Принимает электроны от комплексов I и II (и других дегидрогеназ, например глицерол-3-фосфат-дегидрогеназы; Brand 2016), восстанавливается до убихинола (QH₂: присоединяются 2 e⁻ и 2 H⁺) и передаёт электроны комплексу III. На схеме показаны окисленная и восстановленная формы (R — изопреноидная цепь).", "gn_cytc": "Цитохром c", "g_cytc": "Небольшой водорастворимый белок межмембранного пространства: переносит по одному электрону от комплекса III к комплексу IV. Участие цитохрома c в запуске апоптоза после выхода из митохондрий в вопросе 1 не рассматривается.", "gn_atps": "ATP-синтаза (комплекс V, F₁F₀)", "g_atps": "F₀ — мембранная часть ATP-синтазы; в неё входят c-кольцо и субъединица a, образующая пути доступа H⁺ к кольцу. F₁ — каталитическая часть на стороне матрикса. В прямом режиме перенос H⁺ вращает ротор (c-кольцо с центральной ножкой γ) и сопряжён с синтезом ATP из ADP и Pi: для c₈-кольца млекопитающих один оборот соответствует 8 H⁺ и 3 ATP (Watt 2010); число H⁺ на ATP зависит от размера кольца (Walker 2013). При наличии ATP и подходящих условиях фермент работает в обратном направлении: гидролизует ATP и переносит H⁺ из матрикса. Затраты на транспорт Pi и обмен ADP/ATP (≈ 1 H⁺ на ATP в модели) не являются потоком через F₀. Механизм сопряжения (модель Бойера): три каталитических центра F₁ расположены на β-субъединицах и в каждый момент находятся в разных состояниях — открытом (O: ATP высвобождается), слабосвязывающем (L: связываются ADP и Pi) и плотносвязывающем (T: ATP образуется и удерживается). Вращение γ-субъединицы переводит центры по кругу O → L → T → O; за один оборот каждый центр проходит цикл один раз, откуда 3 ATP на оборот. Структура F₁ с тремя разными β-субъединицами согласуется с этой схемой (Abrahams 1994; обзор Boyer 1997; в обеих работах прочитан только реферат). Ингибитор — олигомицин (F₀).", "gn_ant": "Утечка H⁺; ADP/ATP-переносчик", "g_ant": "Утечка — возврат H⁺ в матрикс помимо ATP-синтазы. Базальная утечка происходит через липидную фазу и белки внутренней мембраны и нелинейно увеличивается при высокой Δp (не подчиняется закону Ома; Brand & Nicholls 2011). Регулируемая утечка: UCP1 бурой жировой ткани (Fedorenko 2012; Cannon & Nedergaard 2004) и H⁺-ток через ADP/ATP-переносчик, зависящий от жирных кислот (Bertholet 2019). В клетках коэффициент сопряжения 70–90 % (утечка 10–30 %); в работающей мышце крысы протонный цикл — 34 % дыхания, в гепатоцитах при высокой нагрузке — 22 % (Rolfe 1999). ADP/ATP-обмен электрогенен (ATP⁴⁻ наружу, ADP³⁻ внутрь) и использует часть Δψ. На странице утечка — отдельный ползунок (×1–6) продвинутого уровня.", "gn_fccp": "FCCP (протонофор, разобщитель)", "g_fccp": "Карбонилцианид-п-трифторметоксифенилгидразон — липофильная слабая кислота: переносит H⁺ через мембрану, минуя ATP-синтазу, и рассеивает Δp. Скорость дыхания увеличивается, а скорость синтеза ATP снижается. Зависимость скорости дыхания от дозы имеет колоколообразную форму: избыток нарушает поступление субстрата и закисляет цитоплазму, поэтому для каждой клеточной линии дозу подбирают титрованием (Brand & Nicholls 2011; Divakaruni 2014). На ползунках страницы доза дана в долях дозы, подобранной при титровании (100 % — доза, при которой в модели дыхание в базальном состоянии близко к максимуму; максимум в протоколе с последовательным добавлением препаратов подбирается автоматически).", "gn_oligo": "Олигомицин A (ингибитор F₀)", "g_oligo": "Олигомицин связывается с F₀ ATP-синтазы и блокирует перенос H⁺ через неё в обоих направлениях. При прямой работе синтазы он прекращает синтез ATP этим ферментом, дыхание падает до уровня, уравновешивающего утечку, и мембрана гиперполяризуется (в модели ≈ 10 мВ); оценка утечки по остатку дыхания завышена на 15–20 % из-за гиперполяризации, а сопряжённое с синтезом ATP дыхание занижено менее чем на 10 % (Brand & Nicholls 2011). При обратной работе он подавляет поддерживающий Δp гидролиз ATP и вызывает дополнительную деполяризацию (Chinopoulos 2010).", "gn_pier": "Пиерицидин A (ингибитор комплекса I)", "g_pier": "Структурный аналог убихинона, конкурирующий с ним в комплексе I (Degli Esposti 1998). В опытах чаще используют ротенон. Блокирует вход электронов от NADH; электроны от сукцината поступают к убихинону через комплекс II. На схеме показан вместо ротенона; формула приведена ниже.", "gn_anti": "Антимицин A (ингибитор комплекса III)", "g_anti": "Связывается с комплексом III в участке Qi и блокирует перенос электронов от убихинола к цитохрому c. Дыхание и перекачивание H⁺ цепью останавливаются; электроны накапливаются перед блоком, образование супероксида усиливается (Korshunov 1997). Остаточное потребление O₂ после антимицина A вместе с ингибитором комплекса I — немитохондриальное.", "gn_nadh": "NADH и NAD⁺ матрикса", "g_nadh": "NADH матрикса передаёт электроны комплексу I; образуется в цикле Кребса, при β-окислении и окислении пирувата. Показатель «индекс восстановленности» на странице рассчитан эмпирически по скорости дыхания: растёт, когда дыхание замедлено (блок цепи, высокий Δp), и снижается при ускорении дыхания. Модель не вычисляет концентрацию или долю NADH в реальном пуле NAD; при окислении сукцината этот индекс нельзя трактовать как NADH. Для изучения отдельных пулов окисленных и восстановленных переносчиков нужны отдельные переменные модели.", "gn_succ": "Сукцинат", "g_succ": "Субстрат комплекса II, промежуточный продукт цикла Кребса. В качестве основного субстрата сукцинат применяют в изолированных митохондриях и пермеабилизованных клетках; в интактных клетках в качестве внешнего субстрата используется ограниченно. При высокой Δp и окислении сукцината возможен обратный перенос электронов на комплекс I с образованием супероксида (Brand 2016); в модели этот путь не учтён.", "gn_dpsi": "Δψ, ΔpH и Δp", "g_dpsi": "Δψ = ψ(матрикс) − ψ(межмембранное пространство), поэтому значение отрицательно; деполяризация делает Δψ менее отрицательным, гиперполяризация — более отрицательным. ΔpH = pH(матрикс) − pH(межмембранное пространство) дано в единицах pH. Движущая сила возврата H⁺ — Δp = |Δψ| + 61,5·ΔpH при 37 °C, в мВ (Mitchell 1961). В модели электрическая часть составляет 80 %, химическая — 20 % Δp: в базальном состоянии 139 + 35 ≈ 174 мВ, ΔpH ≈ 0,57 (допущение; в клетках оценки ΔpH ≈ 0,3–1,2; Santo-Domingo & Demaurex 2012). Зона на шкале — измерения в корковых нейронах крысы в культуре: −139 мВ в базальном состоянии и от −108 до −158 мВ при изменении нагрузки (Gerencser 2012). В изолированных митохондриях Δp 180–220 мВ (Brand & Nicholls 2011).", "gn_stoich": "Сколько H⁺ перекачивается на пару электронов", "g_stoich": "Для протонного баланса используют суммы: 10 H⁺ на пару электронов от NADH и 6 H⁺ от сукцината (Brand & Nicholls 2011); в модели учитывается их суммарный перенос. Разбивка 4 + 4 + 2 относится к переносу H⁺ комплексами I, III и IV (Alberts и др., гл. 14). Подсчёт электрических зарядов может давать 4 + 2 + 4 (Hinkle 2005): это другая величина, учитывающая также редокс-реакции и «химические» протоны; два подсчёта нельзя изображать как альтернативные размеры одних и тех же потоков H⁺. При синтезе ATP комплексом с c₈-кольцом число H⁺, проходящих через F₀F₁ на одну молекулу ATP, составляет 8/3 ≈ 2,7 (Watt 2010); перенос Pi и обмен ADP/ATP добавляют ≈ 1 H⁺ — суммарные затраты H⁺ в модели ≈ 3,7 H⁺ на ATP (допущение).", "gn_ros": "АФК (ROS): супероксид, H₂O₂", "g_ros": "АФК — активные формы кислорода (ROS). Их образование зависит от участка цепи (11 участков; Brand 2016), субстрата и редокс-состояния переносчиков: заметно при высоком Δp и восстановленном убихиноне и при высоком NADH/NAD⁺ в матриксе (Murphy 2009); выше порогового Δψ образование резко растёт (Korshunov 1997). Здесь показан эмпирический индекс (0–1), а не рассчитанная скорость образования супероксида или H₂O₂. Обратный перенос электронов на комплекс I при сукцинате не включён; сравнивать АФК между субстратами по этому индексу нельзя.", "gn_po": "P/O", "g_po": "P/O — число молекул ATP, образующихся на один восстановленный атом O, то есть на ½ O₂: P/O = J(ATP) / [2·J(O₂)], где потоки выражены в молярных единицах. В модели суммарные затраты составляют 3,7 H⁺ на ATP, поэтому предельные значения P/O равны 2,70 (NADH-субстраты) и 1,62 (сукцинат); при точном 8/3 + 1 — 2,73 и 1,64 (Mookerjee 2017; исправление 2018). Измеренные значения составляют ≈ 2,5 и ≈ 1,5 (Hinkle 2005). Фактическое отношение P/O в модели ниже предельного из-за утечки H⁺: в базальном состоянии оно равно 2,13.", "gn_bypass": "Доля H⁺-тока в обход ATP-синтазы", "g_bypass": "Доля протонного тока, возвращающаяся в матрикс не через ATP-синтазу: (утечка + FCCP) / (утечка + FCCP + ATP-синтаза). В базальном состоянии модели 21 %. Оценка по протоколу с олигомицином (1 − коэффициент сопряжения, 25 %) выше, потому что олигомицин вызывает гиперполяризацию и завышает утечку (Brand & Nicholls 2011).", "gn_o2": "Потребление O₂", "g_o2": "Показание — условная скорость восстановления O₂ комплексом IV; 1,0 — заданная максимальная скорость дыхания при окислении NADH-субстратов в модели. При окислении NADH-субстратов величина численно совпадает с протонным током дыхательной цепи в выбранной нормировке; при сукцинате число переносимых H⁺ на единицу потреблённого O₂ меньше. На отдельном графике стандартного протокола добавлен фон 0,05 (немитохондриальное потребление, около 10 % общего; Brand & Nicholls 2011). Малое потребление O₂ при образовании АФК в модель дыхания не включено. При полном блоке III поток к IV принят равным нулю; остаточное дыхание после добавления только ингибитора комплекса I нельзя автоматически считать немитохондриальным.", "gn_vesicle": "Опыт без цепи: везикулы с насосом", "g_vesicle": "Мысленный опыт по Рэкеру и Штукениусу (1974): липидные везикулы с бактериородопсином (светозависимый насос H⁺) и митохондриальной ATP-синтазой без дыхательной цепи. На свету бактериородопсин создаёт Δp, и образуется ATP; в темноте и с разобщителем (протонофор 1799) он не образуется, а ингибитор переноса энергии (рутамицин) снижает синтез примерно на 70 %. Родственный опыт — образование ATP в хлоропластах после переноса из кислой среды в щелочную (Jagendorf & Uribe 1966). Вывод: синтез ATP определяется Δp, а не участием дыхательной цепи.", "gn_measure": "Как измеряют", "g_measure": "Дыхание клеток определяют по потреблению O₂ в планшетах при последовательном добавлении препаратов: олигомицин (около 2 мкг/мл), FCCP (около 0,3–1 мкМ; для каждой клеточной линии дозу подбирают титрованием) и ингибиторы комплексов I и III (ротенон около 1 мкМ + антимицин A около 2 мкМ). По измеренным скоростям вычисляют базальное дыхание, дыхание, сопряжённое с синтезом ATP, дыхание, поддерживающее утечку H⁺, максимальное дыхание, запасную дыхательную способность, коэффициент сопряжения (Brand & Nicholls 2011; Divakaruni 2014; Nicholls 2010). Δψ оценивают потенциал-зависимыми красителями (например, TMRM); абсолютное значение в мВ требует калибровки с учётом потенциала плазмалеммы (Gerencser 2012). P/O измеряют на изолированных митохондриях (Hinkle 2005). В пермеабилизованных клетках и изолированных митохондриях субстраты (пируват + малат, сукцинат) и ингибиторы задают извне (Divakaruni 2014). Значения, задаваемые ползунками страницы, выражены в относительных единицах и не являются дозами препаратов.", "gn_model": "Что упрощено", "g_model": "Учебная модель вычисляет стационарный Δp из баланса протонных токов: окисление субстрата сопровождается переносом H⁺ из матрикса, который замедляется с ростом Δp; H⁺ возвращаются через ATP-синтазу, по путям утечки и с участием протонофора (Brand & Nicholls 2011). Ток утечки H⁺ и ток Ca²⁺ становятся равными нулю при Δp = 0, поэтому без источников тока решение — Δp = 0. Параметры базального состояния согласованы по данным семинара 8 (делящаяся клетка): O₂ 0,60, после олигомицина 0,15, после FCCP 0,99; Δψ −139 мВ взят для нейронов крысы в культуре (Gerencser 2012); модельная клетка условная, коэффициент сопряжения 75 %. Доли Δψ и химической части фиксированы: 80 % и 20 %. Потребность в ATP задаётся условно; ATP/ADP, Pi и свободная энергия синтеза ATP не рассчитываются; для обратной работы синтазы задан доступный ATP. Индексы восстановленности и АФК эмпирические. Кривая протокола строится отдельно от свободного опыта. Не моделируются: динамика во времени, обратный перенос электронов на комплекс I, изменение направления обмена через ADP/ATP-переносчик; в режиме везикул — обратная работа синтазы. Олигомицин в модели прекращает синтез полностью (в опыте с везикулами ингибитор переноса энергии подавлял его частично). При высоком расходе ATP Δψ в модели снижается лишь до −132 мВ; у нейронов при нагрузке — до −108 мВ (Gerencser 2012). Δψ при блоке цепи (−87 мВ) — результат модели.", "poe_locked": "Во время сценария элементы управления заблокированы. Чтобы перейти к свободному опыту, нажмите «Выйти».", "tr2_c_pre": "До ответа показано только исходное состояние образца. Значения после добавления олигомицина и FCCP появятся после показа ответа.", "lbl3_er": "ЭПР", "lbl3_cyto": "цитоплазма", "lbl3_ims": "межмембранное пространство", "lbl3_mdom": "микродомен", "lbl3_gap_near": "щель ≈ 15 нм", "lbl3_gap_mid": "щель ≈ 30 нм", "lbl3_gap_far": "> 50 нм: контакта нет", "lbl3_na": "Na⁺", "lbl3_ptp": "пора", "lbl3_dh": "дегидрогеназы матрикса", "lbl3_capi": "фосфат кальция", "g3_n1": "Δψ — среднее", "g3_n2": "по митохондриям", "tag3_micu": "нет MICU1", "tag3_mcuko": "нет MCU", "tag3_cgp": "CGP-37157", "tag3_csa": "циклоспорин A", "tag3_tg": "тапсигаргин", "um": "мкМ", "s3_s": "Сигнал IP₃ (доля максимального)", "s3_c": "Контакт ЭПР — митохондрия", "c3_near": "≈ 15 нм", "c3_mid": "≈ 30 нм", "c3_far": "> 50 нм", "s3_d": "Длительность сигнала", "d3_short": "30 с", "d3_long": "120 с", "s3_g": "Митохондрии", "g3_wt": "норма", "g3_micu": "нет MICU1", "g3_mcu": "нет MCU", "tg3_cgp": "CGP-37157 (ингибитор NCLX)", "tg3_csa": "циклоспорин A", "tg3_tg": "тапсигаргин", "r3_cmic": "[Ca²⁺] в микродомене контакта", "r3_cb": "[Ca²⁺] в цитоплазме вне контакта", "r3_cm": "Концентрация свободного Ca²⁺ в матриксе", "r3_load": "Накопление Ca²⁺ в матриксе", "r3_load_v": "{v} % порога", "r3_dh": "Индекс Ca²⁺-зависимой активации дегидрогеназ (усл.)", "r3_dpsi": "Δψ (среднее по митохондриям)", "r3_atp": "ATP из митохондрий, % потребности", "r3_ptp": "Митохондрии с открытой порой", "tr3_t": "Динамика накопления Ca²⁺ и открытия поры при сигнале", "tr3_c": "Время, с. Сплошная линия — накопленный Ca²⁺ матрикса (% порога без циклоспорина A), пунктир — доля митохондрий с открытой порой (%), штрихи — порог открытия поры; вертикальная линия — момент регистрации показаний (за 2 с до конца сигнала), точка — максимум накопленного Ca²⁺ до этого момента.", "tr3_x": "с", "tr3_sig": "сигнал", "tr3_l1": "накопленный Ca²⁺, % порога", "tr3_l2": "открытая пора, % митохондрий", "tr3_l3": "порог открытия поры", "s3b_take": "При открытии IP₃-рецепторов ЭПР концентрация Ca²⁺ в щели контакта достигает микромолярного уровня, достаточного для его переноса через MCU — канал с низким сродством к Ca²⁺. Умеренный сигнал увеличивает концентрацию Ca²⁺ в матриксе и активирует дегидрогеназы: поступление электронов в дыхательную цепь возрастает вместе с расходом ATP. При отсутствии контакта поступление Ca²⁺ в матрикс в ответ на тот же сигнал незначительно. Сильный сигнал может вызвать перегрузку матрикса Ca²⁺: если накопление превышает порог, в части митохондрий открывается пора и внутренняя мембрана деполяризуется. Кратковременное открытие поры не обязательно ведёт к гибели клетки, а длительное может вызвать набухание митохондрий. Пороги в модели условные.", "s3a_take": "Ответ митохондрий на сигнал IP₃ зависит от расстояния между мембранами в контакте с ЭПР, регуляции MCU белком MICU1 (порог и кооперативность), выхода Ca²⁺ через NCLX и порога открытия поры, который циклоспорин A повышает через циклофилин D. В модели рост индекса восстановленности вместе с дыханием отражает активацию дегидрогеназ Ca²⁺, а его снижение при ускорении дыхания — преобладание окисления NADH при росте расхода ATP; в опыте такие сдвиги сами по себе причину не устанавливают. Мыши без MCU исследованной линии жизнеспособны, но хуже переносят интенсивную нагрузку. Спорными остаются молекулярный состав поры и роль MFN2 в образовании контактов.", "c3h_rest": "Покой: IP₃-рецепторы ЭПР закрыты, [Ca²⁺] в цитоплазме {cb} мкМ.", "c3h_sig_near": "Сигнал IP₃ {s} % в течение {dur} с: IP₃-рецепторы ЭПР открыты. В конце сигнала [Ca²⁺] в микродомене контакта (щель ≈ 15 нм) {cmic} мкМ, в цитоплазме вне контакта — {cb} мкМ.", "c3h_sig_mid": "Сигнал IP₃ {s} % в течение {dur} с: IP₃-рецепторы ЭПР открыты, но щель контакта шире (≈ 30 нм), и Ca²⁺ в ней рассеивается: в конце сигнала у наружной мембраны {cmic} мкМ, в цитоплазме вне контакта — {cb} мкМ.", "c3h_sig_far": "Сигнал IP₃ {s} % в течение {dur} с: IP₃-рецепторы ЭПР открыты, но митохондрия удалена от ЭПР более чем на 50 нм, и микродомена нет: у наружной мембраны [Ca²⁺] {cmic} мкМ, в цитоплазме — {cb} мкМ.", "c3h_tg0": "Тапсигаргин ингибирует Ca²⁺-АТФазу ЭПР (SERCA): Ca²⁺ выходит из ЭПР и не переносится обратно в ЭПР. Показано состояние после истощения запасов ЭПР; концентрация Ca²⁺ в цитоплазме в модели задана постоянной — {cb} мкМ.", "c3h_tg": "Тапсигаргин ингибирует Ca²⁺-АТФазу ЭПР (SERCA), и запасы ЭПР истощены: сигнал IP₃ {s} % открывает IP₃-рецепторы, но Ca²⁺ через них почти не выходит; [Ca²⁺] в цитоплазме {cb} мкМ и при сигнале не растёт, поэтому в модели не растёт и расход ATP ({dem}).", "c3c_rest": "При таком [Ca²⁺] MICU1 удерживает MCU почти закрытым: концентрация свободного Ca²⁺ в матриксе {cm} мкМ, вход Ca²⁺ через MCU и его выход через NCLX уравновешены.", "c3c_low": "Концентрация Ca²⁺ у MCU ниже уровня, при котором регуляция MICU1 в модели обеспечивает заметное открытие канала. Поступление Ca²⁺ невелико: концентрация свободного Ca²⁺ в матриксе составляет {cm} мкМ (в покое {cm0}).", "c3c_up": "MCU переносит Ca²⁺ из микродомена в матрикс за счёт Δψ, а NCLX выводит его обратно: концентрация свободного Ca²⁺ в матриксе {cm} мкМ (в покое {cm0}).", "c3c_up_cgp": "MCU переносит Ca²⁺ в матрикс, а выход через NCLX замедлен CGP-37157: концентрация свободного Ca²⁺ в матриксе {cm} мкМ (в покое при CGP-37157 — {cm0}).", "c3c_buf": "Ca²⁺ поступает в матрикс через MCU быстрее, чем выводится через NCLX. Концентрация свободного Ca²⁺ в матриксе сохраняется около {cm} мкМ, поскольку избыток связывается с фосфатом. При этом накопление Ca²⁺ увеличивается до {lnow} % порога открытия поры.", "c3c_ptp": "Ca²⁺ входил через MCU быстрее, чем NCLX его выводил, и к {tmax} с накопленный Ca²⁺ достиг {lmax} % порога поры.", "c3c_ru": "Ингибитор MCU закрывает канал: Ca²⁺ в матрикс почти не входит, концентрация свободного Ca²⁺ в матриксе {cm} мкМ.", "c3c_ko": "Без MCU Ca²⁺ в матрикс почти не входит: концентрация свободного Ca²⁺ в матриксе {cm} мкМ.", "c3c_micu0": "Без MICU1 пороговая регуляция MCU отсутствует: даже при {cb} мкМ в цитоплазме Ca²⁺ входит в матрикс, и концентрация свободного Ca²⁺ в матриксе {cm} мкМ (в норме {cm_wt}).", "c3c_micu": "Без MICU1 нет кооперативной активации MCU: при сигнале Ca²⁺ входит слабее, чем в норме, и концентрация свободного Ca²⁺ в матриксе {cm} мкМ (в норме при том же сигнале {cm_wt}).", "c3c_micu_hi": "Без MICU1 пороговая регуляция MCU отсутствует: при таком [Ca²⁺] Ca²⁺ поступает в матрикс интенсивнее, чем в норме, — концентрация свободного Ca²⁺ в матриксе {cm} мкМ (в норме при том же сигнале {cm_wt}).", "c3c_cgp0": "CGP-37157 ингибирует NCLX: выход Ca²⁺ из матрикса замедлен, и уже в покое концентрация свободного Ca²⁺ в матриксе {cm} мкМ (без CGP-37157 — {cm_nocgp}).", "c3d_on": "Ca²⁺ матрикса активирует PDH, IDH и OGDH (индекс активации {act} %): индекс восстановленности {nadh} (в покое {nadh0}), потребление O₂ дыхательной цепью {o2} (в покое {o2_0}).", "c3d_off": "Индекс активации дегидрогеназ мал ({act} %): цепь ускоряется за счёт расхода ATP (O₂ {o2}, в покое {o2_0}), и NADH окисляется быстрее, чем образуется: индекс восстановленности {nadh} (в покое {nadh0}).", "c3d_part": "Дегидрогеназы активированы слабо (индекс активации {act} %): цепь ускоряется (O₂ {o2}, в покое {o2_0}), а индекс восстановленности почти не меняется ({nadh}, в покое {nadh0}).", "c3d_rest_up": "Дегидрогеназы частично активированы уже в покое (индекс активации {act} %): индекс восстановленности {nadh} (в норме в покое {nadh_wt0}).", "c3p_open": "Пора открылась в {ptp} % митохондрий; через неё Ca²⁺ выходит из матрикса, и в момент показаний накоплено {lnow} % порога.", "c3p_open_csa": "Циклоспорин A повышает порог примерно вдвое ({lp2} %), но и этот порог превышен: пора открылась в {ptp} % митохондрий.", "c3p_csa": "Циклоспорин A связывается с циклофилином D и повышает порог примерно вдвое ({lp2} %): при накопленном Ca²⁺ {lnow} % исходного порога пора не открылась.", "c3p_csa0": "Циклоспорин A (связывается с циклофилином D) в этом состоянии показаний не меняет: накопленный Ca²⁺ ниже порога и без него.", "c3p_near": "Накопленный Ca²⁺ — {lnow} % порога поры; пора не открылась.", "c3a_rest": "Δψ {dpsi} мВ; митохондрии покрывают {cov} % потребности клетки в ATP.", "c3a_ok": "Расход ATP при сигнале вырос в {dm}, и митохондрии покрывают {cov} % потребности; Δψ {dpsi} мВ (в покое {dpsi0}).", "c3a_low": "Расход ATP при сигнале вырос в {dm}, а митохондрии покрывают {cov} % потребности (в покое {cov0} %); Δψ {dpsi} мВ (в покое {dpsi0}).", "c3a_ptp": "В митохондриях с открытой порой Δψ {dpsi_o} мВ; по допущению модели ATP-синтаза в них работает в обратном направлении. В остальных Δψ {dpsi_cl} мВ. Средний Δψ {dpsi} мВ, потребность в ATP покрыта на {cov} %.", "c3z_rest": "MICU1 обеспечивает пороговую регуляцию MCU: при обычной концентрации Ca²⁺ в цитоплазме канал почти закрыт. Поэтому в покое Ca²⁺ в матриксе не накапливается, а его перенос почти не снижает абсолютную величину Δψ.", "c3z_act": "Перенос Ca²⁺ в участке контакта согласует поступление электронов в дыхательную цепь с расходом ATP: тот же сигнал IP₃, который повышает расход ATP в клетке, активирует дегидрогеназы матрикса, и образование NADH растёт вместе с его потреблением.", "c3z_far": "MCU — канал с низким сродством к Ca²⁺ (Kd ≈ 10–20 мкМ). Высокая концентрация Ca²⁺ создаётся только в микродомене контакта, поэтому ответ митохондрии зависит как от силы сигнала, так и от расстояния до ЭПР (Csordás 2010).", "c3z_buf": "Концентрация свободного Ca²⁺ в матриксе сохраняется на уровне нескольких микромолей на литр благодаря связыванию Ca²⁺ с фосфатом. Поэтому открытие поры определяется общей накопленной нагрузкой Ca²⁺, а не только концентрацией его свободной формы (Chalmers & Nicholls 2003).", "c3z_ptp": "Тот же путь, который согласует метаболизм, при сильном или длительном сигнале может перегрузить матрикс Ca²⁺: растёт вероятность открытия поры, и внутренняя мембрана деполяризуется. Длительное открытие поры может вызвать набухание митохондрий и гибель клетки; у мышей без циклофилина D, который повышает чувствительность поры к Ca²⁺, выделенные клетки были защищены от гибели при перегрузке Ca²⁺ и окислительном повреждении, а сердце in vivo — от повреждения при ишемии–реперфузии (Baines 2005; Nakagawa 2005). Кратковременное открытие поры не обязательно ведёт к гибели клетки.", "c3z_csa": "Циклофилин D повышает чувствительность поры к Ca²⁺: в митохондриях без него для открытия поры нужна примерно вдвое большая нагрузка Ca²⁺, а циклоспорин A на них не действует (Basso 2005). Молекулярный состав поры не установлен.", "c3z_csa_open": "Циклоспорин A повышает порог, но не устраняет пору: в митохондриях без циклофилина D пора тоже открывается, только при примерно вдвое большей нагрузке Ca²⁺ (Basso 2005).", "c3z_tg": "Ответ митохондрий на сигнал IP₃ зависит от высвобождения Ca²⁺ из ЭПР: тапсигаргин истощает запасы ЭПР (Thastrup 1990), и микродомен у митохондрии не возникает.", "c3z_nomcu": "Если Ca²⁺ не поступает в матрикс, увеличение расхода ATP сопровождается ускорением дыхания только за счёт дыхательного контроля: ADP ускоряет синтез ATP и перенос электронов по дыхательной цепи. Индекс восстановленности снижается, а покрытие потребности в ATP уменьшается. У исследованной линии мышей MCU⁻/⁻ базальный обмен почти не изменён, но способность к интенсивной работе снижена (Pan 2013); сердце без MCU не отвечает на острую β-адренергическую стимуляцию (Luongo 2015).", "c3z_nomcu0": "В модели в покое вход Ca²⁺ через MCU мал, и Δψ, дыхание и покрытие потребности в ATP без него почти те же. У исследованной линии мышей MCU⁻/⁻ базальный обмен почти не изменён (Pan 2013), однако в культуре клеток без постоянной передачи Ca²⁺ от IP₃-рецепторов к митохондриям дыхание снижалось (Cárdenas 2010).", "c3z_micu": "MICU1 задаёт порог и кооперативность MCU: без него митохондрии накапливают Ca²⁺ в покое (Mallilankaraman 2012), а ответ на импульсы Ca²⁺, вызванные агонистом, ослаблен (Csordás 2013).", "c3z_cgp0": "NCLX — основной путь выхода Ca²⁺ из матрикса (Palty 2010): при его подавлении концентрация Ca²⁺ в матриксе повышена уже в покое.", "c3z_cgp": "NCLX — основной путь выхода Ca²⁺ из матрикса (Palty 2010): при его подавлении при том же сигнале накопление Ca²⁺ быстрее приближается к порогу открытия поры.", "p3b_1_q": "Клетка в покое; ЭПР и митохондрия сближены (щель ≈ 15 нм). Сигнал IP₃ 50 % действует 30 с. Как изменится индекс восстановленности NAD(H) матрикса к концу сигнала?", "p3b_1_o1": "Повысится: Ca²⁺ активирует дегидрогеназы", "p3b_1_o2": "Понизится: перенос электронов по цепи ускорится, и NADH будет окисляться быстрее", "p3b_1_o3": "Не изменится: в цитоплазме Ca²⁺ лишь 0,5 мкМ", "p3b_1_e": "IP₃-рецепторы ЭПР высвобождают Ca²⁺ в щель контакта, и у наружной мембраны [Ca²⁺] достигает 10 мкМ, тогда как в цитоплазме вне контакта — 0,54 мкМ. Такой концентрации достаточно, чтобы открыть MCU, и концентрация свободного Ca²⁺ в матриксе увеличивается с 0,10 до 1,11 мкМ. Ca²⁺ активирует PDH, IDH и OGDH (индекс активации 55 %): NADH образуется быстрее, и индекс восстановленности растёт с 0,31 до 0,39, хотя перенос электронов по цепи также ускорился (O₂ 0,60 → 1,29). Расход ATP при сигнале вырос, а митохондрии по-прежнему покрывают 98 % потребности.", "p3b_1_w2": "Перенос электронов по цепи действительно ускорился (O₂ 0,60 → 1,29), но одновременно Ca²⁺ активировал дегидрогеназы, и образование NADH выросло сильнее, чем его окисление. Индекс восстановленности снижается при ускорении переноса электронов по цепи, если Ca²⁺ в матрикс не поступает (шаг 2).", "p3b_1_w3": "В объёме цитоплазмы концентрация Ca²⁺ действительно невелика (0,54 мкМ), но у наружной мембраны напротив IP₃-рецепторов достигает 10 мкМ. MCU — канал низкого сродства и отвечает именно на эту локальную концентрацию.", "p3b_2_q": "Сигнал IP₃ той же силы (50 %) действует 30 с, но митохондрия удалена от ЭПР более чем на 50 нм. Как изменится концентрация свободного Ca²⁺ в матриксе к концу сигнала?", "p3b_2_o1": "Почти не повысится по сравнению с покоем", "p3b_2_o2": "Повысится так же, как при тесном контакте", "p3b_2_o3": "Повысится сильнее, чем при тесном контакте", "p3b_2_e": "Без контакта у наружной мембраны [Ca²⁺] лишь 0,84 мкМ — немногим больше, чем в объёме цитоплазмы (0,54 мкМ). В модели при таком [Ca²⁺] вход через MCU мал: концентрация свободного Ca²⁺ в матриксе составляет 0,07 мкМ (при тесном контакте — 1,11 мкМ) — даже немного ниже, чем в покое, потому что при снижении |Δψ| базальный вход Ca²⁺ через MCU уменьшается. Дегидрогеназы не активируются, а расход ATP увеличивается в той же степени, поэтому перенос электронов по цепи ускоряется (O₂ 0,95), NADH окисляется быстрее, чем образуется (индекс восстановленности 0,23, в покое 0,31), и митохондрии покрывают 79 % потребности в ATP (при тесном контакте 98 %).", "p3b_2_w2": "Концентрация Ca²⁺ повышается во всей цитоплазме, но лишь до 0,54 мкМ. Высокая концентрация Ca²⁺, необходимая для переноса через MCU, создаётся только в щели контакта (Rizzuto 1998; Csordás 2010).", "p3b_2_w3": "При отсутствии контакта концентрация Ca²⁺ у митохондрии составляет лишь 0,84 мкМ, а MCU — канал низкого сродства (Kd ≈ 10–20 мкМ; Lim 2021): вход Ca²⁺ определяет локальная концентрация, а не площадь поверхности.", "p3b_3_q": "Сигнал IP₃ усилили до 100 % (30 с, щель ≈ 15 нм). Что произойдёт к концу сигнала со средним мембранным потенциалом митохондрий (Δψ)?", "p3b_3_o1": "Деполяризация: в части митохондрий откроется пора", "p3b_3_o2": "Гиперполяризация: активность дегидрогеназ повышается", "p3b_3_o3": "Почти без изменений, как при сигнале 50 %", "p3b_3_e": "При сигнале 100 % Ca²⁺ входит через MCU быстрее, чем NCLX его выводит. Концентрация свободного Ca²⁺ в матриксе сохраняется около 3 мкМ (избыток связывается с фосфатом), а накопленный Ca²⁺ к 38,5 с достигает 106 % порога. Пора открывается в 52 % митохондрий: в них Δψ −3 мВ, в остальных — −136 мВ, а средний Δψ составляет −66 мВ (при сигнале 50 % — −139 мВ). Через открытую пору Ca²⁺ выходит из матрикса: в момент показаний (48 с) накоплено 72 % порога. Митохондрии покрывают лишь 45 % потребности в ATP. Порог открытия поры в модели условный; в митохондриях пора открывается при определённой общей нагрузке Ca²⁺ (Chalmers & Nicholls 2003).", "p3b_3_w2": "Дегидрогеназы действительно активированы почти максимально, но в митохондриях с открытой порой H⁺ возвращаются в матрикс через пору, и Δψ в них −3 мВ; в остальных митохондриях −136 мВ, а средний Δψ −66 мВ.", "p3b_3_w3": "При 50 % вход Ca²⁺ уравновешивается выходом через NCLX, и накопленный Ca²⁺ остаётся далеко от порога (9 %). При 100 % вход превышает выход, и за 30 с накопленный Ca²⁺ доходит до порога.", "p3a_1_q": "Сигнал IP₃ 50 % (30 с, щель ≈ 15 нм) повторили после добавления ингибитора MCU. Как изменятся к концу сигнала потребление O₂ дыхательной цепью и индекс восстановленности по сравнению с покоем?", "p3a_1_o1": "Потребление O₂ увеличится, индекс восстановленности снизится", "p3a_1_o2": "Потребление O₂ и индекс восстановленности увеличатся", "p3a_1_o3": "Потребление O₂ и индекс восстановленности снизятся", "p3a_1_e": "Ингибитор MCU подавляет поступление Ca²⁺: концентрация свободного Ca²⁺ в матриксе составляет 0,02 мкМ, и дегидрогеназы не активируются. Расход ATP при сигнале вырос, и перенос электронов по цепи ускоряется за счёт дыхательного контроля (O₂ 0,60 → 0,94): ADP ускоряет ATP-синтазу, мембрана частично деполяризуется (Δψ −126 мВ вместо −139 мВ), и цепь переносит электроны быстрее. NADH при этом окисляется быстрее, чем образуется: индекс восстановленности 0,31 → 0,23. Без ингибитора растут оба показателя (O₂ 1,29, индекс 0,39); в этой модели направление изменения индекса восстановленности при ускорении дыхания позволяет различить действие Ca²⁺ и увеличение расхода ATP.", "p3a_1_w2": "Без ингибитора так и было (O₂ 1,29, индекс восстановленности 0,39), но увеличение индекса восстановленности требует входа Ca²⁺ в матрикс: при ингибиторе MCU дегидрогеназы не активируются, и индекс восстановленности снижается до 0,23.", "p3a_1_w3": "Поступление электронов в цепь не снижено: дегидрогеназы работают с исходной активностью, а перенос электронов ускоряется из-за возросшего расхода ATP (O₂ 0,94).", "p3a_2_q": "Клетки без MICU1 находятся в покое, сигнал отсутствует; [Ca²⁺] в цитоплазме составляет 0,1 мкМ. Какова будет концентрация свободного Ca²⁺ в матриксе по сравнению с нормой?", "p3a_2_o1": "Выше: без MICU1 MCU пропускает Ca²⁺ и в покое", "p3a_2_o2": "Ниже: без MICU1 канал MCU не работает", "p3a_2_o3": "Такой же: при 0,1 мкМ MCU закрыт всегда", "p3a_2_e": "MICU1 обеспечивает пороговую регуляцию MCU: при низкой концентрации Ca²⁺ он удерживает канал закрытым. При отсутствии MICU1 MCU пропускает Ca²⁺ уже при 0,1 мкМ, и концентрация свободного Ca²⁺ в матриксе в покое составляет 0,18 мкМ вместо 0,10 мкМ. В клетках с подавленным MICU1 концентрация Ca²⁺ в матриксе в покое повышена (Mallilankaraman 2012). При сильном повышении концентрации Ca²⁺ соотношение меняется: без кооперативной активации MCU поступление Ca²⁺ при сигнале 50 % слабее, а концентрация свободного Ca²⁺ в матриксе ниже нормы (0,46 против 1,11 мкМ; Csordás 2013).", "p3a_2_w2": "Без MICU1 канал работает: в клетках с подавленным MICU1 концентрация Ca²⁺ в матриксе в покое повышена (Mallilankaraman 2012). MICU1 регулирует открытие MCU, а пору канала образует сам MCU (Baughman 2011; De Stefani 2011).", "p3a_2_w3": "В норме так и есть: MICU1 удерживает MCU закрытым при 0,1 мкМ. Без MICU1 этого порога нет, и в покое концентрация свободного Ca²⁺ в матриксе составляет 0,18 мкМ.", "p3a_3_q": "Сигнал IP₃ 50 % длится 120 с; без препаратов пора не открывается. Тот же сигнал повторили после CGP-37157; в этом учебном опыте учитывается только подавление NCLX, другие эффекты препарата исключены. Что покажет модель в конце сигнала (t = 138 с)?", "p3a_3_o1": "В части митохондрий откроется пора", "p3a_3_o2": "Концентрация Ca²⁺ в матриксе будет ниже, чем без препарата", "p3a_3_o3": "Показания не изменятся: Ca²⁺ выйдет другим путём", "p3a_3_e": "NCLX — основной путь выхода Ca²⁺ из матрикса (Palty 2010). При его подавлении выход отстаёт от входа через MCU даже при умеренном сигнале: накопленный Ca²⁺ к 51,5 с достигает 103 % порога, и пора открывается в 53 % митохондрий. После открытия поры Ca²⁺ выходит из матрикса, и в момент показаний (138 с) накоплено 21 % порога; средний Δψ −68 мВ. Без CGP-37157 тот же сигнал удерживает накопленный Ca²⁺ на уровне 9 % порога. В опыте CGP-37157 действует и на другие системы переноса Ca²⁺ (в препаратах саркоплазматического ретикулума подавляет SERCA и активирует рианодиновые рецепторы; Neumann 2011); в модели эти эффекты не учтены.", "p3a_3_w2": "CGP-37157 тормозит выход, а не вход Ca²⁺: концентрация свободного Ca²⁺ в матриксе повышена уже в покое (0,41 мкМ против 0,10 мкМ без препарата).", "p3a_3_w3": "Другие пути выхода Ca²⁺ в модели не учтены; в клетках основной путь — NCLX (Palty 2010), и при его подавлении Ca²⁺ накапливается в матриксе.", "p3a_4_q": "При сигнале IP₃ 100 % (30 с) в части митохондрий открывается пора. Тот же сигнал повторили после циклоспорина A. Какой будет доля митохондрий с открытой порой к концу сигнала?", "p3a_4_o1": "Около нуля: порог открытия поры выше примерно вдвое", "p3a_4_o2": "Около нуля: Ca²⁺ в матрикс не войдёт", "p3a_4_o3": "Та же: циклоспорин A на пору не действует", "p3a_4_e": "Циклоспорин A связывается с циклофилином D — белком матрикса, который повышает чувствительность поры к Ca²⁺. Без участия циклофилина D для открытия поры нужна примерно вдвое большая нагрузка Ca²⁺ (Basso 2005). К концу сигнала накопленный Ca²⁺ — 169 % исходного порога, но не нового (200 %), и пора остаётся закрытой: Δψ −136 мВ, митохондрии покрывают 97 % потребности в ATP. При сигнале 120 с порог превышается и при циклоспорине A: препарат задерживает открытие поры, но не исключает его при более длительной нагрузке Ca²⁺.", "p3a_4_w2": "Циклоспорин A не действует на MCU: Ca²⁺ входит в матрикс, и к концу сигнала накопленный Ca²⁺ — 169 % исходного порога.", "p3a_4_w3": "Циклоспорин A действует на пору через циклофилин D: в митохондриях без циклофилина D порог выше примерно вдвое, и циклоспорин A на них уже не влияет (Basso 2005).", "p3a_5_q": "Клетки обработали тапсигаргином — ингибитором Ca²⁺-АТФазы ЭПР (SERCA). После истощения запаса Ca²⁺ в ЭПР концентрация Ca²⁺ в цитоплазме — 0,25 мкМ. Затем подали сигнал IP₃ 50 %; вход Ca²⁺ через плазматическую мембрану в модели не учитывается. Как изменится концентрация свободного Ca²⁺ в матриксе к концу сигнала по сравнению с необработанными клетками?", "p3a_5_o1": "Почти не повысится: у MCU нет микродомена Ca²⁺", "p3a_5_o2": "Повысится сильнее: концентрация Ca²⁺ в цитоплазме уже повышена", "p3a_5_o3": "Повысится так же: IP₃-рецепторы открыты", "p3a_5_e": "SERCA
