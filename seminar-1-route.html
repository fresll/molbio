остановки насоса различие убывает с собственным характерным временем; для этого разрушать мембрану не нужно."],"mechanism":["В [[T07|стационарном неравновесном состоянии]] перенос насосом равен утечке через мембрану: различие постоянно, но не равновесно.","После остановки насоса утечка продолжается, и различие убывает; скорость убыли задают проводимость путей утечки и буферная ёмкость компартмента.","Времена различаются на порядки: Δψ — секунды и десятки секунд, свободный Ca²⁺ ЭПР — минуты, pH лизосомы — десятки минут."],"paragraphs":["Лизосомы макрофагов мыши линии RAW264.7 удерживают pH 4,71. После ингибирования V-АТФазы конканамицином A pH альвеолярных макрофагов мыши в первые минуты рос примерно на 0,20 единицы в минуту, а за час превышал 6,5 — верхний предел чувствительности сенсора (Steinberg 2010). В клетках A431 после 1 мкМ [[T22|бафиломицина A1]] pH лизосом поднимался с 5,1–5,5 примерно до 6,3 постепенно, примерно за 50 мин (Yoshimori 1991). Медленность объясняется высокой буферной ёмкостью просвета — 60–80 мМ на единицу pH (Steinberg 2010).","В клетках HEK293 в среде без Ca²⁺ свободный Ca²⁺ просвета ЭПР (около 370 мкМ по сенсору D1ER) после 1 мкМ [[T23|тапсигаргина]] за первые 1,5 мин снижался лишь на 6 %, а затем убывал экспоненциально с характерным временем около 162 с (Pick 2023): Ca²⁺ выходил путями утечки; в покое эту утечку уравновешивала SERCA.","Δψ митохондрии после остановки дыхательной цепи и ATP-синтазы падает быстрее — за секунды и десятки секунд (учебная оценка). Прямых измерений этой кинетики в прочитанных работах нет, поэтому в модели время Δψ — учебное значение.","Чтобы различие исчезло, разрушать мембрану не нужно: его рассеивает утечка. Но и по самому исчезновению различия целостность мембраны не установить — её проверяют отдельным контролем, например по удержанию меченого декстрана или груза в просвете (в модели целостность мембраны сохранена по условию). Выберите компартмент и время после остановки насоса. Различия измерены в собственных единицах — единицах pH, мкМ и мВ, поэтому сравнивают не проценты в один момент, а время, за которое каждое различие уменьшается вдвое."],"trap":["Если различие pH или Ca²⁺ между органеллой и цитозолем исчезло, значит, мембрана органеллы повреждена.","Остановка насоса не равна разрушению мембраны: при бафиломицине A1 лизосомы сохраняются и груз в них доставляется, но их просвет теряет кислотность (Yoshimori 1991). Различие рассеивает утечка, которую в покое компенсирует насос."],"conditions":"Схема — учебная модель практикума M1 (вопрос 1, базовый уровень): x(t) = x_off + (x₀ − x_off)·e^(−t/τ) (для ЭПР — после начальной фазы). Лизосома: pH 4,7 → 6,5, τ = 10 мин (начальная скорость 0,18 ед./мин; Steinberg 2010: альвеолярные макрофаги мыши, 1 мкМ конканамицина A, 0,20 ед./мин; Yoshimori 1991: клетки A431, 1 мкМ бафиломицина A1, около 6,3 к 50 мин, реферат). Плато 6,5 выбрано для учебного расчёта и из измерений не следует: выше 6,5 сенсор Steinberg 2010 значений не различает, поэтому конечный pH в этих опытах не определён. От выбранного плато зависит время уменьшения различия вдвое: при выравнивании с цитозолем (pH около 7,2) и той же начальной скорости оно составило бы около 10 мин вместо 12 — по-прежнему больше, чем у Ca²⁺ ЭПР. Просвет ЭПР: 370 мкМ → 0,1 мкМ двухфазно — за первые 90 с потеря около 6 % (в модели линейно), затем экспонента с τ = 162 с (Pick 2023: HEK293, сенсор D1ER, 1 мкМ тапсигаргина, среда без Ca²⁺; τ описывает фазу после точки перегиба; полный текст PMC). Матрикс: Δψ −150 → −5 мВ, τ = 20 с — учебное значение. «Мембрана не повреждена» — условие модели во всех состояниях; в опыте целостность проверяют отдельно. Время, за которое различие уменьшается вдвое, считается в собственных единицах каждого различия (ед. pH, мкМ, мВ): Δψ — 15 с, Ca²⁺ ЭПР — 3,2 мин, pH лизосомы — 12 мин.","sources":["Steinberg2010","Yoshimori1991","Pick2023"],"quiz":{"id":"S1-L04","question":"В клетках HEK293 после добавления тапсигаргина свободный Ca²⁺ в просвете ЭПР за 10 мин снизился с 370 мкМ в десятки раз; маркер просвета ЭПР в цитозоль не выходит. Какой вывод следует из этого опыта?","options":[{"id":"S1-L04-1","text":"Тапсигаргин разрушил мембрану ЭПР","correct":false,"feedback":"Тапсигаргин — ингибитор насоса SERCA. Такое снижение Ca²⁺ не требует разрыва мембраны: его объясняет утечка, которую больше не компенсирует насос. По одному снижению Ca²⁺ целостность мембраны не установить; для неё в условии дан отдельный контроль: маркер просвета ЭПР в цитозоль не выходит, значит, грубого разрыва мембраны нет. Удержание маркера, впрочем, не исключает проницаемости мембраны для малых ионов."},{"id":"S1-L04-2","text":"Различие поддерживала работа SERCA","correct":true,"feedback":"Тапсигаргин ингибирует SERCA, а пути утечки продолжают выпускать Ca²⁺. Различие исчезает потому, что его больше ничто не восстанавливает: оно было стационарным, а не равновесным."},{"id":"S1-L04-3","text":"Тапсигаргин открыл каналы IP₃R","correct":false,"feedback":"Тапсигаргин не открывает каналы ЭПР. Ca²⁺ выходит через пути утечки, которые работают и в покое, — тогда их уравновешивает SERCA."}],"rev":2},"widget":{"kind":"q1relax","title":"","s":{"title":"Релаксация после остановки насоса","status":"Учебная модель, условные величины","modes":["лизосома (pH)","просвет ЭПР (Ca²⁺)","матрикс (Δψ)"],"modes_label":"Компартмент","keys":["lys","er","mito"],"t_l":"Время после остановки насоса","t_lab":["0 с","5 с","15 с","30 с","1 мин","2 мин","5 мин","10 мин","20 мин","30 мин","1 ч"],"ax":["1 с","10 с","1 мин","10 мин","1 ч"],"y":"% исходного различия (ед. pH, мкМ, мВ)","x":"время после остановки насоса (логарифмическая шкала)","lg":["лизосома","ЭПР","матрикс"],"m_val":["pH просвета","свободный Ca²⁺","Δψ"],"m_rem":"Сохранилось различия","m_mem":"Мембрана (условие модели)","mem_ok":"не повреждена","units":["","мкМ","мВ"],"drug":["бафиломицин A1","тапсигаргин","антимицин A + олигомицин"],"note":"{drug}: через {t} сохранилось {r} исходного различия; целостность мембраны в модели сохранена по условию.","half":"½ за {t}","u_s":"с","u_min":"мин","legend":"Учебная модель практикума: времена для лизосомы и ЭПР согласованы с опытами (Steinberg 2010; Yoshimori 1991; Pick 2023), для Δψ — учебное значение. Различия измерены в собственных единицах, поэтому сравнивают время, за которое каждое уменьшается вдвое (кружки на линии 50 % и подписи в легенде), а не проценты в один момент. Пунктир — два других компартмента."}},"section":0,"number":4,"question":1},{"id":"mito-potential","questions":[1],"title":"Что поддерживает мембранный потенциал митохондрии и что от него зависит","keywords":["Δψ","мембранный потенциал","протон-движущая сила","ATP-синтаза","обратная работа","олигомицин","антимицин A","FCCP","TMRM","TIM23","MTS","деполяризация","проба с олигомицином"],"lead":["Δψ — состояние мембраны, а не поток: его величину задаёт баланс генераторов и путей возврата протонов, а от неё зависят синтез ATP, импорт белков через TIM23 и вход Ca²⁺."],"mechanism":["Дыхательная цепь выводит протоны из матрикса; [[T21|ATP-синтаза]] в прямом направлении возвращает их, синтезируя ATP.","При остановке дыхания ATP-синтаза может работать в обратном направлении: гидролизовать гликолитический ATP и поддерживать Δψ.","[[T13|TIM23]] переносит положительно заряженную MTS только при достаточном Δψ; от Δψ зависит и вход Ca²⁺ через MCU."],"paragraphs":["Перенос протонов дыхательной цепью создаёт [[T14|протон-движущую силу]] из двух частей — [[T04|Δψ]] и разности pH. В покоящихся нейронах коры крысы Δψ, измеренный калиброванной флуоресцентной методикой с зондом [[T26|TMRM]], равен −139 мВ (Gerencser 2012). TMRM показывает величину Δψ, но не скорость переноса электронов (Brand и Nicholls 2011).","С помощью ингибиторов определяют, какой генератор поддерживает Δψ. [[T24|Олигомицин]] закрывает возврат протонов через ATP-синтазу: Δψ становится немного отрицательнее, а потребление O₂ снижается до уровня, который задаёт утечка протонов. Протонофор [[T25|FCCP]] в заранее подобранной оптимальной концентрации снимает Δψ, и, если субстратов и O₂ достаточно, а у клеток есть дыхательный резерв (исходная скорость дыхания ниже максимальной), дыхание растёт до максимальной скорости, возможной в этих условиях (избыточная концентрация FCCP или ограничение окисления субстратов уменьшают этот ответ); ATP-синтаза при этом гидролизует гликолитический ATP, но Δψ не восстанавливается. Антимицин A снижает потребление O₂ до немитохондриального — у большинства клеток около 10 % исходного (Brand и Nicholls 2011). Потребление O₂ измеряют в закрытой ячейке с клетками кислородным электродом или флуоресцентным датчиком O₂ (например, в анализаторе Seahorse XF) и по ходу опыта последовательно добавляют олигомицин, FCCP, затем ротенон с антимицином A; схема — в режиме «Как измеряют потребление O₂».","После антимицина A при глюкозе в среде Δψ может сохраняться: его поддерживает ATP-синтаза, гидролизуя гликолитический ATP. Если олигомицин после этого вызывает [[T15|деполяризацию]], потенциал создавала обратная работа ATP-синтазы; если лёгкую гиперполяризацию — митохондрии ещё синтезировали ATP (проба с олигомицином, Brand и Nicholls 2011).","От Δψ зависит импорт белков: в изолированных митохондриях Neurospora crassa перенос N-концевых адресующих последовательностей (MTS) требовал именно Δψ, а не всей протон-движущей силы (Martin 1991). От него же зависит электрическая часть Δμ для входа Ca²⁺ через MCU."],"trap":["Если Δψ нормален, дыхательная цепь работает нормально.","Δψ — состояние, а не поток. При остановленном дыхании его может поддерживать ATP-синтаза, гидролизующая гликолитический ATP. О работе дыхательной цепи судят по потреблению O₂ или по ответу Δψ на олигомицин (Brand и Nicholls 2011)."],"conditions":"Схема — учебная модель практикума M1 (вопрос 1, продвинутый уровень): стационары пяти условий для клеток в среде с глюкозой; Δψ контроля −150 мВ, потребление O₂ и импорт — % от контроля, импорт — учебная крутая зависимость от Δψ, Δμ — расчёт для 0,1 мкМ Ca²⁺ в цитозоле и 1 мкМ в матриксе (после предшествующего захвата Ca²⁺). Качественные соотношения — по обзору Brand и Nicholls 2011 (полный текст PMC): лёгкая гиперполяризация и снижение дыхания после олигомицина, рост дыхания после протонофора в оптимальной концентрации у клеток с дыхательным резервом (в модели максимальная скорость — 220 % от контроля), немитохондриальное потребление O₂ около 10 %, проба с олигомицином, гидролиз ATP ATP-синтазой при протонофоре; TMRM уравновешивается между средой и клеткой около 60 мин, между цитозолем и матриксом — намного быстрее. Схема измерения потребления O₂ — по тому же обзору: закрытая ячейка (кислородный электрод или анализатор Seahorse XF), последовательные добавки олигомицина, FCCP, ротенона с антимицином A; уровни на схеме — из учебной модели практикума (контроль, олигомицин, FCCP, антимицин A). −139 мВ — нейроны коры крысы в культуре (Gerencser 2012, реферат). Импорт и Δψ — изолированные митохондрии Neurospora crassa (Martin 1991, реферат); транслоказы — обзор Wiedemann и Pfanner 2017 (реферат).","sources":["Brand2011","Gerencser2012","Martin1991","Wiedemann2017"],"quiz":{"id":"S1-L05","question":"Клетки в среде с глюкозой обработали олигомицином; дыхательная цепь не ингибирована. Как изменится Δψ по сравнению с контролем?","options":[{"id":"S1-L05-1","text":"Станет немного отрицательнее","correct":true,"feedback":"Олигомицин закрывает главный путь возврата протонов в матрикс — через ATP-синтазу. Остаётся только утечка, и Δψ немного растёт по абсолютной величине; потребление O₂ при этом падает."},{"id":"S1-L05-2","text":"Упадёт почти до нуля","correct":false,"feedback":"Так Δψ ведёт себя после олигомицина, только если его поддерживала ATP-синтаза за счёт гидролиза ATP, — например, после антимицина A. Здесь дыхательная цепь работает и продолжает выводить протоны."},{"id":"S1-L05-3","text":"Не изменится","correct":false,"feedback":"Δψ задаётся балансом вывода и возврата протонов. Олигомицин закрывает один из путей возврата, поэтому баланс смещается, и потенциал становится немного отрицательнее."}]},"widget":{"kind":"q1mito","title":"","s":{"title":"Митохондрия в клетке: пять условий","status":"Учебная модель, условные величины","modes":["контроль","олигомицин","антимицин A","антимицин A + олигомицин","FCCP","Как измеряют потребление O₂"],"modes_label":"Воздействие (среда с глюкозой)","keys":["ctrl","oligo","anti","antiol","fccp","o2meth"],"resp":"дыхательная цепь","atps":"ATP-синтаза","tim":"TIM23","mcu":"MCU","mts":"белок с MTS","mat":"матрикс","ims":"межмембранное пространство","fccp":"FCCP","atp_dir":{"syn":"синтез ATP","hyd":"гидролиз ATP","off":"заблокирована"},"m_psi":"Δψ","m_o2":"Потребление O₂","m_imp":"Импорт с MTS","m_ca":"Δμ для входа Ca²⁺","ctrl":"Потребление O₂ и импорт белков с MTS — в % от контроля.","mv":"мВ","kj":"кДж/моль","notes":{"ctrl":"Дыхательная цепь выводит протоны, ATP-синтаза возвращает их, синтезируя ATP; Δψ = −150 мВ.","oligo":"ATP-синтаза заблокирована: протоны возвращаются только утечкой, Δψ немного отрицательнее, дыхание снижено.","anti":"Дыхание остановлено, но Δψ в основном сохранён: ATP-синтаза гидролизует гликолитический ATP и выводит протоны.","antiol":"Оба генератора остановлены: Δψ почти нулевой, импорт с MTS остановлен, Δμ для входа Ca²⁺ положительна.","fccp":"Протонофор в оптимальной концентрации возвращает протоны в обход ATP-синтазы: Δψ мал, а дыхание максимально — поток и потенциал разошлись. ATP-синтаза гидролизует гликолитический ATP, но Δψ не восстанавливает.","o2meth":"Скорость потребления O₂ — поток, Δψ — состояние; нужны оба измерения. После олигомицина дыхание снижается до уровня утечки протонов, после FCCP в оптимальной концентрации — если у клеток есть дыхательный резерв — растёт до максимальной скорости, после ротенона с антимицином A остаётся немитохондриальное потребление — около 10 %."},"meth":{"cell":"клетки","ch":"закрытая ячейка","sens":"датчик O₂","inj":"добавки","y":"потребление O₂, % от исходного","x":"время опыта","add":["олигомицин","FCCP","ротенон + антимицин A"],"lv":["исходное","утечка H⁺","максимум","не митохондрии"],"legend":"Схема метода (Brand и Nicholls 2011): клетки в закрытой ячейке, скорость убыли O₂ регистрирует кислородный электрод или флуоресцентный датчик (Seahorse XF). Уровни — учебная модель практикума; в реальном опыте FCCP добавляют после олигомицина, и максимальная скорость зависит от дозы протонофора."},"legend":"Стрелки с пунктиром — перенос протонов, белка с MTS и Ca²⁺ через внутреннюю мембрану; бледные — перенос не идёт. Числа — учебная модель практикума (Brand и Nicholls 2011 — качественные соотношения)."}},"section":0,"number":5,"question":1},{"id":"isolation-exchange","questions":[1],"title":"Как одна граница одновременно изолирует реакции и обеспечивает обмен","keywords":["изоляция","кислые гидролазы","катепсины","проницаемость мембраны лизосомы","лизосомная гибель клетки","пероксисома","каталаза","челнок","малат-аспартатный","глицерофосфатный","TOM","TIM23","болезни накопления","болезнь Помпе"],"lead":["Граница компартмента разделяет несовместимые реакции, а избирательные переносчики, челноки и транслоказы ведут обмен через неё, не разрушая неравновесия."],"mechanism":["[[T17|Кислые гидролазы]] активны в кислом просвете лизосомы; при нарушении целостности её мембраны катепсины попадают в цитозоль и могут запустить гибель клетки.","NADH не проходит через внутреннюю мембрану митохондрии: восстановительные эквиваленты переносят [[T29|челночные системы]].","Белки матрикса поступают из цитозоля через транслоказы TOM и TIM23; каждый переносчик пропускает определённые вещества, и различия сохраняются."],"paragraphs":[{"h":"Изоляция"},"В лизосоме работают более 60 гидролаз (Xu 2015). Если мембрана лизосомы становится проницаемой, её содержимое выходит в цитозоль, и катепсины расщепляют цитозольные белки; в зависимости от масштаба утечки клетка погибает по типу некроза или апоптоза (Aits и Jäättelä 2013). Так же изолированы реакции пероксисомы: пероксид водорода, который образуется при β-окислении очень длинноцепочечных жирных кислот, разлагает каталаза той же органеллы (Schrader 2015).",{"h":"Обмен"},"Обмен идёт через избирательные белки. Малат-аспартатный челнок переносит восстановительные эквиваленты цитозольного NADH на NAD⁺ матрикса: оксалоацетат восстанавливается до малата, малат входит в матрикс через переносчик и там вновь окисляется с образованием NADH. Глицерофосфатный челнок передаёт электроны иначе — через митохондриальную глицерол-3-фосфатдегидрогеназу на внешней стороне внутренней мембраны прямо в пул убихинона, минуя комплекс I (Mráček 2013). Белки матрикса синтезируются в цитозоле и переносятся транслоказами TOM и TIM23, причём перенос через TIM23 требует Δψ (Wiedemann и Pfanner 2017).",{"h":"Значение"},"Болезни лизосомного накопления — более 70 наследственных болезней, большинство из них наследуются аутосомно-рецессивно. Их вызывают мутации генов лизосомных ферментов и мембранных белков; при дефекте этих белков нерасщеплённые вещества накапливаются в лизосомах (Platt 2018). Чаще причиной служат мутации генов гидролаз, но нарушения выноса продуктов и мембранного транспорта тоже приводят к накоплению (Xu 2015). Например, при болезни Помпе (гликогенозе II типа) из-за мутаций гена GAA недостаточна активность кислой α-глюкозидазы, и в лизосомах накапливается гликоген."],"trap":["Компартмент тем лучше выполняет свою функцию, чем меньше веществ проходит через его мембрану.","Изоляцию и обмен обеспечивают одни и те же избирательные белки: через внутреннюю мембрану митохондрии непрерывно идут метаболиты, ATP и ADP, белки с MTS, но каждый переносчик пропускает определённые вещества в определённом направлении, и неравновесие сохраняется."],"conditions":"Схема механизма; числа не показываются. Гидролазы лизосомы и болезни накопления — обзор Xu 2015 (полный текст PMC); проницаемость мембраны лизосомы и лизосомная гибель клетки — обзор Aits и Jäättelä 2013 (реферат); пероксисома — обзор Schrader 2015 (не прочитан); глицерофосфатный челнок — обзор Mráček 2013 (реферат); малат-аспартатный челнок — обзор Borst 2020 (реферат); импорт белков — Wiedemann и Pfanner 2017 (реферат); болезни лизосомного накопления — обзор Platt 2018 (реферат: более 70 болезней, чаще аутосомно-рецессивное наследование, суммарно около 1 случая на 5000 живорождённых). Пример болезни Помпе — по обзору Platt 2018 (рубрика «Glycogen Storage Disease Type II») и классическому описанию дефицита кислой α-глюкозидазы.","sources":["Xu2015","Aits2013","Schrader2015","Mracek2013","Borst2020","Wiedemann2017","Platt2018"],"quiz":{"id":"S1-L06","question":"Электроны цитозольного NADH передаются в дыхательную цепь глицерофосфатным челноком. Куда они поступают в митохондрии?","options":[{"id":"S1-L06-1","text":"На NAD⁺ матрикса с образованием NADH","correct":false,"feedback":"Так работает малат-аспартатный челнок: малат входит в матрикс и окисляется там с образованием NADH. Глицерофосфатный челнок матриксный NAD⁺ не использует."},{"id":"S1-L06-2","text":"В пул убихинона, минуя комплекс I","correct":true,"feedback":"Митохондриальная глицерол-3-фосфатдегидрогеназа на внешней стороне внутренней мембраны окисляет глицерол-3-фосфат и передаёт электроны через FAD прямо на убихинон (Mráček 2013)."},{"id":"S1-L06-3","text":"Прямо на комплекс IV и кислород","correct":false,"feedback":"Комплекс IV принимает электроны от цитохрома c, а не от дегидрогеназ челноков. Электроны глицерофосфатного челнока входят в цепь раньше — на уровне убихинона."}]},"widget":{"kind":"q1iso","title":"","s":{"title":"Изоляция и обмен через одну границу","status":"Схема механизма","modes":["Мембрана лизосомы не повреждена","Мембрана лизосомы повреждена","Малат-аспартатный челнок","Глицерофосфатный челнок","Импорт белка в матрикс"],"modes_label":"Ситуация","cyt":"цитозоль, pH 7,2","lum":"просвет, pH 4,5–5,0","hyd":"кислые гидролазы","cat":"катепсины","sub":"цитозольные белки","leak":"утечка содержимого","death":"гибель клетки","ok":"гидролазы активны внутри","ims":"межмембранное пространство","mat":"матрикс","im":"внутренняя мембрана","om":"наружная мембрана","nadh_c":"NADH","nad_c":"NAD⁺","oaa":"оксалоацетат","mal":"малат","asp":"аспартат","nadh_m":"NADH (матрикс)","c1":"комплекс I","dhap":"дигидроксиацетонфосфат","g3p":"глицерол-3-фосфат","gpd2":"mGPDH (FAD)","q":"убихинон","tom":"TOM","tim":"TIM23","pre":"предшественник с MTS","mpp":"MTS отщепляется","dpsi":"нужен Δψ","transfer":"перенос","notes":["Кислые гидролазы работают в просвете лизосомы, где pH близок к их оптимуму; мембрана отделяет их от цитозольных белков.","При нарушении целостности мембраны лизосомы катепсины выходят в цитозоль, расщепляют цитозольные белки и могут запустить гибель клетки (Aits и Jäättelä 2013).","NADH через внутреннюю мембрану не проходит: в матрикс переносится малат, а NADH образуется заново на матриксном NAD⁺ и отдаёт электроны комплексу I.","Глицерол-3-фосфат окисляется на внешней стороне внутренней мембраны; электроны через FAD поступают прямо в пул убихинона, минуя комплекс I (Mráček 2013).","Белок с N-концевой адресующей последовательностью проходит TOM и TIM23; перенос через TIM23 требует Δψ, после импорта MTS отщепляется (Wiedemann и Pfanner 2017)."],"legend":"Пунктир со стрелкой — перенос вещества через мембрану; сплошная стрелка — химическое превращение. Схема упрощена: переносчики малата и аспартата, ферменты челноков и протеаза, отщепляющая MTS, обозначены подписями."}},"section":0,"number":6,"question":1},{"id":"measure-ph","questions":[1],"title":"Как измеряют pH и редокс-потенциал внутри органеллы","keywords":["pH-сенсор","ратиометрия","калибровка","нигерицин","монензин","декстран","флуоресцеин","SypHer","roGFP2","Grx1-roGFP2","адресованный сенсор","метод"],"lead":["Обычный pH-микроэлектрод слишком велик для малых органелл, поэтому в них доставляют флуоресцентный сенсор. В рассматриваемой методике pH определяют по отношению сигналов при двух длинах волн после калибровки в той же клетке."],"mechanism":["Сенсор доставляют в компартмент: декстран с pH-чувствительным красителем — эндоцитозом в лизосомы, [[T08|генетически кодируемый сенсор]] — по адресующей последовательности.","[[T27|Ратиометрия]]: отношение сигналов при двух длинах волн возбуждения практически не зависит от количества сенсора.","[[T28|Калибровка]]: ионофоры уравнивают pH органеллы и буфера известного pH; по кривой «отношение — pH» сигнал переводят в pH."],"paragraphs":["Чтобы измерить pH лизосом макрофагов мыши, их загружали pH-чувствительным декстраном методом «пульс — погоня»: декстран поглощается эндоцитозом и накапливается в лизосомах. Флуоресценцию возбуждали при 490 и 440 нм и брали отношение сигналов (Steinberg 2010). Для матрикса митохондрий клеток HeLa использовали белковый сенсор SypHer с адресующей последовательностью и отношение сигналов при возбуждении 480 и 430 нм (Poburko 2011).","Яркость при одной длине волны зависит от количества сенсора, толщины клетки и выцветания, поэтому сама по себе не даёт pH. Отношение двух сигналов одного сенсора от количества сенсора практически не зависит, но остаётся условной величиной, пока его не откалибровали.","В конце опыта клетки переводили в растворы с высоким K⁺ и известным pH (4,0–6,5) с нигерицином; ионофор выравнивает pH органеллы с pH раствора, и по нескольким точкам строят кривую «отношение — pH» (Steinberg 2010). У сенсора есть рабочий диапазон: выше pH 6,5 краситель лизосом уже не различал значений. После калибровки сенсора SypHer в каждой клетке pH матрикса клеток HeLa составил 7,61 — ниже прежних оценок 7,8–8,1 (Poburko 2011).","Потенциал пары глутатиона измеряют сенсором Grx1-roGFP2: глутаредоксин быстро уравновешивает сенсор именно с парой GSH/GSSG (Gutscher 2008). Калибруют по крайним точкам — полностью восстановленному и полностью окисленному сенсору — и пересчитывают степень окисления в милливольты. Сенсор сам реагирует с глутатионом и потому входит в измеряемую систему."],"trap":["Чем ярче флуоресценция pH-сенсора в органелле, тем выше (или ниже) в ней pH.","Яркость одного канала зависит от количества сенсора, толщины клетки и выцветания. В рассматриваемой методике pH определяют по отношению двух сигналов после калибровки в той же клетке: отношение уменьшает зависимость от количества сенсора, а поправки на фон и выцветание проверяют отдельно. Есть и другие проверенные способы, например по времени жизни флуоресценции; без калибровки сигнал остаётся относительным."],"conditions":"Схемы методов; значения на кривой калибровки условные, кроме названных. Лизосомы: макрофаги мыши RAW264.7 и альвеолярные макрофаги, декстраны, возбуждение 490/440 нм, калибровка в растворах 145 мМ KCl с нигерицином 10 мкг/мл при pH 4,0–6,5, аппроксимация сигмоидой; верхний предел чувствительности — pH 6,5 (Steinberg 2010, полный текст PMC). Матрикс: клетки HeLa, mitoSypHer, возбуждение 480/430 нм, калибровка каждой клетки нигерицином и монензином; pH матрикса в покое 7,61 ± 0,02 (79 клеток; Poburko 2011, полный текст). Grx1-roGFP2 — Gutscher 2008 (реферат); калибровка по крайним точкам (полное окисление и полное восстановление сенсора) — схема метода.","sources":["Steinberg2010","Poburko2011","Gutscher2008"],"quiz":{"id":"S1-L07","question":"pH-сенсор в лизосомах регистрировали по яркости при одной длине волны возбуждения. В клетках, где сенсора вдвое больше, яркость оказалась вдвое выше. Что можно заключить о pH в лизосомах этих клеток?","options":[{"id":"S1-L07-1","text":"pH в лизосомах этих клеток выше","correct":false,"feedback":"Удвоение яркости объясняется удвоением количества сенсора. Чтобы судить о pH, нужна величина, не зависящая от количества сенсора, — отношение сигналов при двух длинах волн."},{"id":"S1-L07-2","text":"pH в лизосомах этих клеток ниже","correct":false,"feedback":"Связь яркости с pH здесь не установлена: сигнал вырос пропорционально количеству сенсора. По одному каналу без калибровки направление сдвига pH определить нельзя."},{"id":"S1-L07-3","text":"О pH из этих данных судить нельзя","correct":true,"feedback":"Яркость одного канала пропорциональна количеству сенсора, и двукратная разница полностью объясняется им. Сравнить pH позволяют ратиометрия и калибровка с ионофорами."}]},"widget":{"kind":"method","title":"","s":{"title":"Как измеряют pH и редокс-потенциал органеллы","status":"Схемы методов","modes":["Доставка сенсора","Ратиометрия","Калибровка","Редокс-сенсор"],"modes_label":"Этап метода","schemes":[{"draw":"q1load","h":270,"l":{"a":"краситель в лизосомах","b":"белковый сенсор в матриксе","dex":"декстран с красителем","endo":"эндоцитоз","chase":"«погоня»: декстран доходит до лизосом","lys":"лизосома","gene":"ген сенсора + MTS","mito":"матрикс","cyt":"цитозоль","import":"импорт"},"note":"Сенсор должен оказаться в нужном компартменте. Декстран с pH-чувствительным красителем поглощается эндоцитозом и после «погони» накапливается в лизосомах; белковый сенсор с адресующей последовательностью направляется в матрикс."},{"draw":"q1ratio","h":280,"data":{"pk":6.0},"l":{"x":"pH","y":"сигнал, условные единицы","e1":"возбуждение 490 нм","e2":"возбуждение 440 нм","r":"490/440 при pH 5","lo":"мало сенсора","hi":"вдвое больше сенсора","same":"отношение одинаково","leg":"сплошная линия — 1×, пунктир — 2× сенсора"},"note":"Сигнал при 490 нм зависит от pH, при 440 нм почти не зависит. Если сенсора вдвое больше, оба сигнала вдвое выше, а их отношение — то же: ратиометрия снимает зависимость от количества сенсора."},{"draw":"q1calib","h":290,"data":{"pk":6.0},"l":{"x":"pH буфера с нигерицином","y":"отношение 490/440","pts":"точки калибровки","meas":"измеренное отношение","res":"pH лизосомы","lim":"выше предела: pH ≥ 6,5","iono":"нигерицин + 145 мМ KCl, pH 4,0–6,5"},"note":"Ионофор выравнивает pH органеллы с pH раствора; по точкам строят кривую и по ней переводят измеренное отношение в pH. Вне рабочего диапазона кривая пологая, и значение можно указать только как «выше предела»."},{"draw":"q1redox","h":270,"l":{"red":"восстановлен","ox":"окислен","grx":"Grx1","ro":"roGFP2","gsh":"GSH","gssg":"GSSG","dtt":"ДТТ: 100 % восстановлен","dia":"диамид или H₂O₂: 100 % окислен","deg":"степень окисления → E по уравнению Нернста","ss":"S–S","sh":"SH   SH"},"note":"Глутаредоксин в составе сенсора уравновешивает roGFP2 с парой GSH/GSSG; отношение сигналов при двух длинах волн показывает степень окисления. Крайние точки задают восстановитель и окислитель, после чего степень окисления пересчитывают в милливольты."}]}},"section":0,"number":7,"question":1},{"id":"local-conc","questions":[2],"title":"Почему концентрация без указания объёма и формы не определена","keywords":["локальная концентрация","средняя концентрация","лизат","микродомен","Ca²⁺","буфер","число Авогадро","c = N/(N_A·V)"],"lead":["Одно и то же число молекул даёт разную концентрацию в зависимости от объёма, к которому его относят, и от того, какая часть молекул свободна."],"mechanism":["Концентрация c = N/(N_A·V): при неизменном числе частиц N она обратно пропорциональна объёму V.","Анализ лизата даёт [[T30|среднюю по клетке концентрацию]], а эффектор отвечает на [[T06|локальную]] — в том объёме, где он находится.","Для Ca²⁺ [[T05|общая концентрация]] намного выше свободной: большую часть вошедших ионов связывают [[T31|буферы]]."],"paragraphs":["Пусть через канал за короткое время вошло 10⁴ ионов Ca²⁺. Если бы они равномерно распределились по клетке объёмом 1 пл (10⁻¹² л), общая концентрация кальция выросла бы на c = N/(N_A·V) = 10⁴/(6,02·10²³ моль⁻¹ · 10⁻¹² л) ≈ 1,7·10⁻⁸ М, то есть примерно на 17 нМ. Это меньше фонового уровня свободного Ca²⁺ в цитозоле покоящейся клетки (около 100 нМ) и находится на пределе обнаружения.","Те же 10⁴ ионов в объёме 10⁻¹⁶ л — кубе со стороной около 0,5 мкм у устья канала — дают прибавку около 170 мкМ, в 10 000 раз больше. Это прибавка общего кальция; свободного Ca²⁺ будет заметно меньше, потому что большую часть вошедших ионов связывают цитозольные буферы (Rizzuto 2006). Но и с этой поправкой у канала создаётся концентрация, на порядки превышающая фоновую.","Поэтому утверждение «концентрация вещества выросла» неполно, пока не названы три вещи: где именно (объём), о какой форме идёт речь (свободная или общая) и с каким порогом чувствительности эффектора её сравнивают. Средняя концентрация в лизате полезна как мера общего содержания, но не говорит, достигнут ли порог там, где находится эффектор.","В калькуляторе выберите число ионов, объём и долю ионов, связанных буферами: схема сравнивает общую и свободную прибавку концентрации с фоновым уровнем свободного Ca²⁺."],"trap":["Если анализ лизата не показал роста концентрации вещества, сигнала не было.","Средняя по клетке концентрация почти не меняется, когда вещество накапливается в малом объёме: 10⁴ ионов дают 17 нМ в объёме клетки и 170 мкМ в микродомене. Неизменный результат анализа лизата совместим и с отсутствием сигнала, и с локальным событием, и с перераспределением вещества, которое произошло быстрее, чем длилось измерение."],"conditions":"Схема — расчёт по формуле c = N/(N_A·V) для заданных числа ионов и объёма; объёмы — порядки величины (клетка около 1 пл, микродомен у устья канала около 10⁻¹⁶ л), это учебные оценки. Доля ионов, связанных буферами, выбирается как условный параметр; то, что буферы связывают большую часть вошедшего Ca²⁺, — по обзору Rizzuto 2006. Фон свободного Ca²⁺ в цитозоле покоящейся клетки — около 100 нМ (там же).","sources":["Rizzuto2006"],"quiz":{"id":"S1-L08","question":"Через канал вошло 10⁴ ионов Ca²⁺, и все они остались в объёме 10⁻¹⁶ л у его устья. Какой будет прибавка общей концентрации кальция в этом объёме?","options":[{"id":"S1-L08-1","text":"Около 17 нМ","correct":false,"feedback":"17 нМ — прибавка, если те же ионы распределить по всей клетке объёмом 10⁻¹² л. Объём микродомена в 10 000 раз меньше, и концентрация во столько же раз выше."},{"id":"S1-L08-2","text":"Около 170 мкМ","correct":true,"feedback":"c = 10⁴/(6,02·10²³ моль⁻¹ · 10⁻¹⁶ л) ≈ 1,7·10⁻⁴ М. Это общий кальций: свободного будет меньше, потому что большую часть ионов связывают буферы."},{"id":"S1-L08-3","text":"Около 1,7 мкМ","correct":false,"feedback":"Ошибка на два порядка: при делении 10⁴ на 6,02·10²³ и на 10⁻¹⁶ получается 1,7·10⁻⁴ М, то есть 170 мкМ."}]},"widget":{"kind":"q2conc","title":"","s":{"title":"Сколько это — 10⁴ ионов?","status":"Расчёт по заданным параметрам","n_l":"Число ионов Ca²⁺","n_opts":["10³","10⁴","10⁵"],"n_vals":[1000.0,10000.0,100000.0],"v_l":"Объём","v_opts":["клетка, 10⁻¹² л","10⁻¹⁴ л","микродомен, 10⁻¹⁶ л"],"v_vals":[1e-12,1e-14,1e-16],"b_l":"Связано буферами","b_opts":["0 %","90 %","99 %"],"b_vals":[0,0.9,0.99],"axis":"концентрация (логарифмическая шкала)","bg":"фон свободного Ca²⁺ в покое, 100 нМ","tot":"общая прибавка","free":"свободная прибавка","m_tot":"Общая прибавка","m_free":"Свободная прибавка","m_ratio":"Свободная прибавка / фон","u":["пМ","нМ","мкМ","мМ"],"note_low":"Прибавка свободного Ca²⁺ ниже фона: в таком объёме вошедшие ионы почти не меняют концентрацию, на которую отвечают эффекторы.","note_high":"Прибавка свободного Ca²⁺ выше фона: в таком объёме вошедшие ионы создают микродомен, где концентрация во много раз превышает фоновую.","legend":"c = N/(N_A·V), N_A = 6,02·10²³ моль⁻¹. Доля ионов, связанных буферами, — условный параметр."}},"section":1,"number":8,"question":2},{"id":"crowding","questions":[2],"title":"Как краудинг меняет равновесие, диффузию и скорость реакций","keywords":["краудинг","исключённый объём","коэффициент диффузии","GFP","FRAP","mTORC1","рибосомы","равновесие сборки"],"lead":["Цитоплазма заполнена макромолекулами. Исключённый объём при прочих равных может благоприятствовать сборке комплексов, но в живой клетке действуют и неспецифические взаимодействия, поэтому итог зависит от белка; диффузия же в цитоплазме медленнее, чем в разбавленном растворе."],"mechanism":["Макромолекулы занимают 20–30 % объёма цитоплазмы (200–300 мг/мл), и для каждой новой крупной молекулы доступна лишь часть объёма — это [[T32|макромолекулярный краудинг]].","Исключённый объём при прочих равных благоприятствует компактным состояниям и ассоциации; неспецифические взаимодействия с другими белками могут действовать в обратную сторону.","[[T33|Коэффициент диффузии]] снижается: у GFP в цитоплазме клеток CHO он примерно втрое ниже, чем в солевом растворе."],"paragraphs":["Белки обычно изучают в разбавленных растворах, а в цитоплазме суммарная концентрация макромолекул составляет 200–300 мг/мл, и они занимают 20–30 % объёма (Ellis 2001). Значительная часть объёма недоступна для каждой новой крупной молекулы. Последствия этого удобно разделить на три величины.","Равновесие: эффективная активность макромолекул выше их номинальной концентрации, и исключённый объём при прочих равных благоприятствует сборке комплексов, укладке и полимеризации (Ellis 2001). Однако в цитоплазме действуют и неспецифические, в том числе электростатические, взаимодействия с окружающими белками: в клетках E. coli они меняли устойчивость небольшого белкового домена иначе, чем предсказывает теория краудинга (Smith 2016). Поэтому изменение устойчивости белка, а по данным других работ и связывания, зависит от конкретного белка и среды. Диффузия: по восстановлению флуоресценции после выцветания коэффициент диффузии GFP в цитоплазме клеток CHO оказался около 27 мкм²/с против 87 мкм²/с в солевом растворе (Swaminathan 1997); крупные комплексы замедляются сильнее.","Наблюдаемая скорость процесса — то, как быстро система приходит к новому состоянию, — зависит от обоих эффектов и от того, какая стадия лимитирует. Реакция, ограниченная частотой встреч партнёров, в цитоплазме идёт медленнее, чем в пробирке; сборка комплекса, определяемая равновесием, может дать больше комплекса, если неспецифические взаимодействия не действуют в обратную сторону. Поэтому рост локальной концентрации не гарантирует роста потока: если фермент насыщен субстратом, добавочный субстрат скорость почти не меняет.","Краудинг регулируется. В клетках дрожжей и HEK293 рапамицин, подавляющий mTORC1, за 2–3 ч снижал содержание рибосом, и подвижность частиц диаметром 40 нм росла; подвижность молекул размером 5 нм и меньше не менялась (Delarue 2018)."],"trap":["Если повысить локальную концентрацию субстрата у фермента, реакция всегда ускорится.","Скорость растёт, только пока фермент не насыщен и стадия встречи партнёров лимитирует. Насыщенный фермент на добавочный субстрат почти не отвечает, а в плотной цитоплазме встречи замедлены диффузией."],"conditions":"Доля занятого объёма и концентрация макромолекул — оценки обзора Ellis 2001 (полный текст). Коэффициенты диффузии GFP-S65T — данные опыта: FRAP в цитоплазме клеток CHO и в солевом растворе (Swaminathan 1997): время полувосстановления 83 и 30 мс, относительная вязкость цитоплазмы 3,2, D в растворе 87 мкм²/с. Регуляция краудинга — Delarue 2018: дрожжи и клетки HEK293, рапамицин 2–3 ч, трекинг частиц GEM диаметром 40 нм. Направления изменений на схеме — качественные, числа даны только для D. Неспецифические взаимодействия в клетке — Smith 2016 (клетки E. coli, ¹⁹F-ЯМР в клетке, SH3-домен белка drk; прочитан реферат).","sources":["Ellis2001","Swaminathan1997","Delarue2018","Smith2016"],"quiz":{"id":"S1-L09","question":"Фермент работает в режиме насыщения субстратом. Субстрат дополнительно сконцентрировали в малом объёме вокруг фермента; количество и каталитические свойства фермента, вязкость и другие условия не изменились. Как изменится скорость реакции?","options":[{"id":"S1-L09-1","text":"Вырастет пропорционально концентрации","correct":false,"feedback":"Пропорциональный рост скорости наблюдается, только пока концентрация субстрата намного ниже Kм. Насыщенный фермент уже работает почти с максимальной скоростью."},{"id":"S1-L09-2","text":"Почти не изменится","correct":true,"feedback":"Активные центры насыщенного фермента почти всё время заняты, поэтому добавочный субстрат скорость не повышает. Рост локальной концентрации увеличивает поток, только пока фермент не насыщен."},{"id":"S1-L09-3","text":"Снизится из-за краудинга","correct":false,"feedback":"Краудинг замедляет диффузию, но сам по себе не снижает скорость насыщенного фермента: его активные центры по-прежнему заняты субстратом."}],"rev":2},"widget":{"kind":"q2crowd","title":"","s":{"title":"Разбавленный раствор и цитоплазма","status":"Схема механизма; коэффициенты диффузии — данные опыта: GFP, клетки CHO, FRAP (Swaminathan 1997)","modes":["Разбавленный раствор","Цитоплазма"],"modes_label":"Среда","box":["белок в растворе","белок в цитоплазме"],"crowd":"другие макромолекулы","probe":"наблюдаемый белок","head":["Величина","Что меняется в цитоплазме"],"rows":[["Равновесие сборки комплекса","при прочих равных может смещаться к комплексу"],["Коэффициент диффузии GFP","≈27 мкм²/с против 87 мкм²/с в растворе"],["Реакция, ограниченная встречами партнёров","медленнее"],["Реакция насыщенного фермента","почти не меняется"]],"rows0":[["Равновесие сборки комплекса","исходное"],["Коэффициент диффузии GFP","87 мкм²/с"],["Реакция, ограниченная встречами партнёров","исходная скорость"],["Реакция насыщенного фермента","максимальная скорость"]],"notes":["В разбавленном растворе почти весь объём доступен для белка: так измеряют константы в пробирке.","В цитоплазме 20–30 % объёма заняты другими макромолекулами: эффективная активность белка выше, а его диффузия медленнее; как изменится устойчивость белка, зависит и от его взаимодействий с окружением."]}},"section":1,"number":9,"question":2},{"id":"source-sink","questions":[2],"title":"Как источник, диффузия и сток создают устойчивый градиент","keywords":["градиент","источник","сток","диффузия","длина диффузии","λ","стационарный профиль","Allbritton","IP₃"],"lead":["Неоднородность распределения растворимого вещества внутри одного объёма сохраняется, пока его непрерывно производит источник и удаляет сток; масштаб градиента — длина диффузии λ = √(D/k)."],"mechanism":["[[T34|Источник]] — локальный синтез, выход из депо или направленный транспорт — поддерживает концентрацию c₀ у мембраны.","Молекулы расходятся диффузией с коэффициентом D и удаляются [[T35|стоком]] с константой k; в стационаре профиль c(x) = фон + (c₀ − фон)·e^(−x/λ).","[[T36|Длина диффузии]] λ = √(D/k): ускорение стока сужает домен без изменения источника."],"paragraphs":["Простейшая модель устойчивой неоднородности внутри компартмента содержит три составляющие. Без источника нет неоднородности, без диффузии — распространения, а без стока вещество со временем распределится по всему объёму равномерно. Так устроены градиенты растворимых сигнальных молекул; закрепление вещества на мембране или цитоскелете — другой способ создать неоднородность.","В одномерной модели вещество образуется у плоскости x = 0, диффундирует с коэффициентом D и удаляется процессом первого порядка с константой k. В [[T37|стационарном профиле]] избыток концентрации над фоном убывает экспоненциально и на расстоянии λ = √(D/k) падает в e ≈ 2,7 раза. λ не следует путать со среднеквадратичным смещением √(2Dt) за время t: λ описывает профиль, который не меняется во времени.","Для свободного Ca²⁺ λ составляет десятые доли микрометра: из измерений в экстракте ооцитов шпорцевой лягушки дальность действия свободного Ca²⁺ до связывания буфером оценена в 0,1 мкм, а IP₃ (D = 283 мкм²/с) — в 24 мкм (Allbritton 1992). В интактных клетках диффузия IP₃ затруднена: в клетках нейробластомы человека D ≤ 10 мкм²/с, и дальность действия IP₃ меньше 5 мкм, поэтому в клетках млекопитающих IP₃ скорее местный, чем глобальный посредник (Dickinson 2016). Для фосфорилированного белка с D порядка 10 мкм²/с и временем жизни фосфорилированной формы в секунды λ — единицы микрометров (Brown и Kholodenko 1999).","Размер домена можно изменить, не трогая источник: повышение активности фосфодиэстеразы или фосфатазы сужает домен, подавление — расширяет. Быстрый ненасыщенный буфер действует как сток лишь в начальной фазе сигнала; в длительном стационаре связывание и отщепление уравновешиваются, а подвижный буфер может даже ускорять распространение. Локальность кальциевого сигнала поэтому условна: при сильном выбросе Ca²⁺ буферы насыщаются, и могут возникать подъёмы и волны, охватывающие всю клетку (Berridge 2003)."],"trap":["Если вещество диффундирует в 100 раз медленнее, его домен во столько же раз уже.","Длина диффузии λ пропорциональна квадратному корню из отношения D/k: при уменьшении D в 100 раз домен сужается в 10 раз, а одновременное изменение D и k в одно и то же число раз профиль не меняет."],"conditions":"Схема — учебная модель практикума (вопрос 2, базовый уровень): одномерный стационарный профиль — решение уравнения D·c″ − k·(c − фон) = 0 с постоянной концентрацией у источника c₀ и c → фон вдали от него; фон 5 % от c₀ поддерживает равномерный базальный источник k·фон. Показан участок полубесконечной среды длиной 20 мкм; это не точное решение для замкнутой клетки с непроницаемым дальним концом (такое решение — в модели шага «Микродомены cAMP»). Для точечного источника в трёх измерениях профиль спадает быстрее (множитель 1/r), но масштаб λ тот же. Дальность действия Ca²⁺ и IP₃ — расчёт Allbritton 1992 из коэффициентов диффузии, измеренных в цитозольном экстракте ооцитов Xenopus laevis, и времён жизни посредников. Оценка для фосфобелков — Brown и Kholodenko 1999 (расчёт по измеренным D и активностям киназ и фосфатаз). Волны Ca²⁺ — обзор Berridge 2003.","sources":["Allbritton1992","Dickinson2016","Brown1999","Kholodenko2006","Berridge2003"],"quiz":{"id":"S1-L10","question":"Белок фосфорилируется киназой у мембраны и дефосфорилируется фосфатазой в цитозоле; D = 10 мкм²/с. Активность фосфатазы повысили в 4 раза. Как изменится длина диффузии фосфорилированной формы?","options":[{"id":"S1-L10-1","text":"Уменьшится в 4 раза","correct":false,"feedback":"Константа стока выросла в 4 раза, но длина диффузии зависит от неё через квадратный корень: λ = √(D/k)."},{"id":"S1-L10-2","text":"Не изменится","correct":false,"feedback":"Киназа у мембраны действительно прежняя, но размер домена задаёт ещё и сток: фосфатаза быстрее дефосфорилирует белок, и фосфорилированная форма успевает продиффундировать от мембраны на меньшее расстояние."},{"id":"S1-L10-3","text":"Уменьшится в 2 раза","correct":true,"feedback":"λ = √(D/k): при росте k в 4 раза λ уменьшается в √4 = 2 раза. Так сток меняет размер домена, не меняя источник."}]},"widget":{"kind":"q2profile","title":"","s":{"title":"Профиль «источник — диффузия — сток»","status":"Учебная модель, условные величины (та же, что в практикуме)","D":"Коэффициент диффузии D, мкм²/с","k":"Константа стока k, с⁻¹","x":"расстояние от источника, мкм","y":"концентрация, % от c₀","cur":"текущий профиль","ref":"исходный (D = 10, k = 1)","m_lam":"λ, мкм","m_c1":"на 1 мкм, % от c₀","m_c5":"на 5 мкм, % от c₀","m_mean":"средняя на показанном участке 20 мкм, % от c₀","note":"Длина диффузии λ = {lam} мкм. Измените D и k в одно и то же число раз — профиль не изменится: он зависит от отношения D/k.","legend":"Шкалы ползунков логарифмические. Концентрация у источника c₀ постоянна; фон — 5 % от c₀, его поддерживает равномерный базальный источник."}},"section":1,"number":10,"question":2},{"id":"threshold","questions":[2],"title":"Как пороговый эффектор превращает плавный градиент в границу","keywords":["порог","коэффициент Хилла","сверхчувствительность","ультрасенситивность","нулевой порядок","Goldbeter","Koshland","позиционная информация","граница домена"],"lead":["Градиент — непрерывная величина, а ответ клетки часто дискретен. Преобразование выполняет эффектор, ответ которого зависит от концентрации круче гиперболы."],"mechanism":["Ответ эффектора R = cⁿ/(K½ⁿ + cⁿ): K½ задаёт положение границы домена, коэффициент Хилла n — её резкость.","При n = 1 ответ повторяет плавный профиль; при n = 4 для перехода от 10 до 90 % ответа концентрация должна вырасти всего в 3 раза.","[[T38|Сверхчувствительность]] ответа возникает при кооперативном связывании, многоступенчатом фосфорилировании и [[T39|насыщении субстратом киназы и фосфатазы]]."],"paragraphs":["Если ответ эффектора зависит от концентрации сигнала плавно, профиль ответа повторяет профиль градиента и остаётся размытым. Если же ответ зависит от концентрации круче гиперболы, в области, где концентрация выше порога, эффектор активен почти полностью, а за её пределами почти неактивен. Так градиент и порог вместе создают [[T40|позиционную информацию]]: профиль задаёт координату, порог превращает её в границу.","Крутизну описывают коэффициентом Хилла. При n = 1 ответ растёт от 10 до 90 %, когда концентрация увеличивается в 81 раз, при n = 4 — всего в 3 раза. При одном и том же K½ граница домена (ответ 50 %) остаётся на месте; меняются ширина переходной зоны и остаточный ответ вдали от источника.","Кооперативное связывание: занятие одного сайта повышает сродство остальных, как у кальмодулина с четырьмя сайтами Ca²⁺. Многоступенчатое фосфорилирование: белок активен только после присоединения нескольких фосфатов. Сверхчувствительность нулевого порядка: если киназа и фосфатаза насыщены субстратом, доля фосфорилированного белка очень резко зависит от отношения их активностей (Goldbeter и Koshland 1981; Ferrell и Ha 2014).","Для резкого ответа недостаточно требования двух независимых условий: коинцидентное узнавание — узнавание по совпадению двух и более признаков (вопрос 3) — повышает избирательность, но ответ на каждое условие остаётся гиперболическим."],"trap":["Чем выше коэффициент Хилла, тем чувствительнее эффектор и тем шире область, где он отвечает.","Коэффициент Хилла меняет крутизну, а не положение порога: при том же K½ граница домена остаётся на месте, а при концентрации ниже K½ кооперативный эффектор отвечает слабее некооперативного."],"conditions":"Режим «Градиент и эффектор» — учебная модель практикума (вопрос 2, базовый уровень) при D = 10 мкм²/с и k = 1 с⁻¹; ответ рассчитан по уравнению Хилла. Режим «Нулевой порядок» — расчёт стационарной доли фосфорилированного белка по формуле Goldbeter и Koshland 1981 при равных константах Михаэлиса киназы и фосфатазы, выраженных в долях общего количества белка-субстрата (1 — ферменты не насыщены, 0,01 — насыщены).","sources":["Goldbeter1981","Ferrell2014"],"quiz":{"id":"S1-L11","question":"Киназа и фосфатаза, действующие на один белок, насыщены субстратом, и их активности равны: фосфорилирована половина молекул. Активность киназы повысили на 10 %. Как изменится доля фосфорилированного белка?","options":[{"id":"S1-L11-1","text":"Вырастет примерно на 10 %","correct":false,"feedback":"Плавный, почти линейный ответ получается, когда ферменты не насыщены: тогда перевес киназы на 10 % повышает долю фосфорилированного белка лишь с 50 до 54 %. При насыщении эта доля зависит от отношения активностей очень резко."},{"id":"S1-L11-2","text":"Почти не изменится","correct":false,"feedback":"Насыщение не делает систему нечувствительной: каждый фермент работает почти с постоянной максимальной скоростью, и небольшой перевес киназы накапливается, пока почти весь белок не станет фосфорилированным."},{"id":"S1-L11-3","text":"Вырастет до большей части молекул","correct":true,"feedback":"Это сверхчувствительность нулевого порядка: при насыщении обоих ферментов перевес киназы на 10 % переводит долю фосфорилированного белка с 50 % примерно до 90 % (расчёт по Goldbeter и Koshland 1981)."}]},"widget":{"kind":"q2hill","title":"","s":{"title":"Порог и граница домена","status_a":"Учебная модель, условные величины (та же, что в практикуме)","status_b":"Расчёт по заданным параметрам (Goldbeter и Koshland 1981)","modes":["Градиент и эффектор","Нулевой порядок"],"modes_label":"Режим","n_l":"Коэффициент Хилла","n_opts":["1","2","4"],"K_l":"K½, % от c₀","K_opts":["10 %","30 %","60 %"],"x":"расстояние от источника, мкм","y":"%","c":"концентрация, % от c₀","r":"ответ эффектора, %","m_w":"Ширина домена, мкм","m_tz":"Переходная зона 90 → 10 %, мкм","m_r10":"Ответ на 10 мкм, %","tz_none":"ответ не падает ниже 10 %","tz_low":"ответ нигде не достигает 90 %","tz_mid":"ответ везде в пределах 10–90 %","note_a":"Граница домена проходит там, где концентрация равна K½; коэффициент Хилла определяет, насколько резко ответ падает за границей.","J_l":"Константа Михаэлиса / количество субстрата","J_opts":["1 (не насыщены)","0,1","0,01 (насыщены)"],"u_l":"Активность киназы / активность фосфатазы","xb":"активность киназы / активность фосфатазы","yb":"фосфорилировано, % молекул","m_p":"Фосфорилировано, %","note_b":"При насыщенных ферментах доля фосфорилированного белка переключается почти скачком около равенства активностей; при ненасыщенных растёт плавно."}},"section":1,"number":11,"question":2},{"id":"camp-domains","questions":[2],"title":"Почему одинаковый средний уровень cAMP даёт разные ответы","keywords":["cAMP","микродомен","аденилатциклаза","фосфодиэстераза","PKA","AKAP","IBMX","Ht31","изопротеренол","простагландин E1","кардиомиоциты"],"lead":["Аденилатциклаза — источник cAMP, фосфодиэстеразы — сток, AKAP удерживает PKA у мишени. Поэтому ответ мишени определяет концентрация cAMP рядом с ней, а не средний уровень в клетке."],"mechanism":["Гормон активирует [[T41|аденилатциклазу]] в своём мембранном домене; синтезированный cAMP гидролизуют [[T42|фосфодиэстеразы]].","[[T44|AKAP]] удерживают [[T43|PKA]], а часто и аденилатциклазу, PDE и фосфатазы рядом с определённой мишенью.","Средняя концентрация cAMP зависит только от общей скорости синтеза и стока; ответ мишени — от cAMP рядом с ней и от того, есть ли там PKA."],"paragraphs":[{"h":"Опыты на сердце"},"В изолированном перфузируемом сердце крысы изопротеренол (агонист β-адренорецепторов, 10 нМ) и простагландин E1 (30 мкМ) одинаково повышали содержание cAMP и активность PKA, но сократимость и активность гликогенфосфорилазы повышал только изопротеренол (Hayes 1979). В кардиомиоцитах взрослого кролика изопротеренол повышал cAMP и в растворимой фракции гомогената, и в нерастворимой (корпускулярной), а PGE1 — только в растворимой; PGE1 не активировал ни PKA нерастворимой фракции, ни фосфорилазу (Buxton и Brunton 1983).","Генетически кодируемые сенсоры позволили увидеть домены. В кардиомиоцитах новорождённой крысы β-адренергическая стимуляция создавала микродомены повышенного cAMP у мембраны Т-трубочек, дальность действия cAMP составляла около 1 мкм, его распространение ограничивали фосфодиэстеразы, а активировалась прежде всего PKA, закреплённая рядом (Zaccolo и Pozzan 2002). В тех же клетках ответ на β-агонист связан с PKA типа II и фосфорилированием фосфоламбана и тропонина I, а ответ на PGE1 — с PKA типа I, без фосфорилирования этих белков (Di Benedetto 2008).",{"h":"Как удерживается домен"},"Свободный cAMP диффундирует быстро — по измерениям 100–700 мкм²/с, — а фосфодиэстеразы работают медленно, и по этим числам домены удерживаться не могли бы. Возможное объяснение: при физиологических концентрациях большая часть cAMP связана с регуляторными субъединицами PKA и другими белками, и его перемещение замедлено («буферированная диффузия»); вокруг отдельных PDE возникают нанодомены низкого cAMP размером 10–30 нм (Bock 2020; обзор Bock 2024). Какого размера домены — десятки нанометров или микрометры — зависит от системы и остаётся предметом исследований.","На схеме — учебная модель практикума: при гормонах А и Б cAMP синтезируется с одинаковой скоростью, поэтому средний cAMP одинаков, а фосфорилирование мишени А — нет. [[T45|IBMX]], ингибируя PDE, расширяет домены; [[T46|пептид Ht31]] отделяет PKA от AKAP, и фосфорилирование мишени снижается при прежнем cAMP рядом с ней."],"trap":["Если два гормона одинаково повышают cAMP в лизате, они вызывают одинаковый ответ.","Лизат даёт среднюю концентрацию. Ответ мишени зависит от cAMP рядом с ней и от присутствия закреплённой PKA: в перфузируемом сердце изопротеренол и PGE1 одинаково повышали cAMP, но сократимость повышал только изопротеренол (Hayes 1979)."],"conditions":"Hayes 1979: изолированное перфузируемое сердце крысы, изопротеренол 10 или 80 нМ, PGE1 2 или 30 мкМ; измерены cAMP, активность PKA, фосфорилазы и dP/dt. Buxton и Brunton 1983: изолированные кардиомиоциты взрослого кролика, изопротеренол 1 мкМ, PGE1 10 мкМ; cAMP и PKA во фракциях гомогената (3000 g, 5 мин). Zaccolo и Pozzan 2002: кардиомиоциты новорождённой крысы, норадреналин, FRET-сенсор на основе субъединиц PKA (по реферату). Di Benedetto 2008: кардиомиоциты новорождённой крысы (по реферату). Bock 2020: клетки HEK293 (полный текст PMC); буферированная диффузия cAMP и нанодомены у PDE. Схема — учебная модель практикума (вопрос 2, продвинутый уровень): одномерная клетка 20 мкм, эффективный D cAMP 30 мкм²/с (учебный), величины условные.","sources":["Hayes1979","Buxton1983","ZaccoloPozzan2002","DiBenedetto2008","Bock2020","Bock2024","Zaccolo2021"],"quiz":{"id":"S1-L12","question":"Два гормона одинаково повысили средний cAMP в клетках, но фосфорилирование белка-мишени у мембраны вызвал только первый. Рассматривается стационарная модель, в которой константа гидролиза cAMP в обоих опытах одинакова. Какое объяснение согласуется с этим результатом?","options":[{"id":"S1-L12-1","text":"PDE гидролизуют cAMP второго гормона по пути к мишени","correct":true,"feedback":"В этой модели средний cAMP одинаков, потому что одинакова общая скорость синтеза. Но cAMP второго гормона гидролизуется фосфодиэстеразами по пути и до PKA у мишени почти не доходит."},{"id":"S1-L12-2","text":"При втором гормоне синтезируется меньше cAMP","correct":false,"feedback":"В этой модели равные стационарные средние концентрации при одинаковой константе удаления означают одинаковую общую скорость синтеза. Различие — в месте синтеза."},{"id":"S1-L12-3","text":"Первый гормон сам активирует PKA у мишени, без cAMP","correct":false,"feedback":"Гормон связывается с рецептором на внешней стороне мембраны и до PKA не доходит; PKA активируется cAMP, который связывается с её регуляторными субъединицами."}],"rev":2},"widget":{"kind":"q2camp","title":"","s":{"title":"Микродомены cAMP в клетке длиной 20 мкм","status":"Учебная модель, условные величины (та же, что в практикуме)","tA":"Гормон А","tB":"Гормон Б","tI":"IBMX","tH":"Ht31","x":"расстояние от домена А, мкм","y":"cAMP, × от покоя (логарифмическая шкала)","mean":"средний (лизат)","tg":"мишень А","k12":"K½ PKA","domA":"домен А: AC, AKAP–PKA, мишень А","domB":"домен Б: AC","m_mean":"Средний cAMP","m_ct":"cAMP у мишени А","m_amt":"PKA у мишени А","m_ph":"Мишень А фосфорилирована","lt1":"менее 1","notes":{"rest":"Покой: cAMP во всей клетке на базальном уровне.","A":"Средний cAMP — ×{m}, а у мишени А — ×{ct}: мишень отвечает на местный cAMP.","B":"Средний cAMP тот же, что от гормона А (×{m}), но у мишени А — только ×{ct}.","I":"PDE ингибированы: длина диффузии cAMP — {lam} мкм вместо 3,2 мкм, домены расширились.","H":"PKA отделена от AKAP: у мишени осталось 10 % киназы, фосфорилирование — {ph} %."},"legend":"Сплошная линия — профиль cAMP, штриховая — средний по клетке, пунктир — K½ активации PKA (учебная величина). В покое профиль совпадает со средним уровнем."}},"section":1,"number":12,"question":2},{"id":"ran-gradient","questions":[2],"title":"Как градиент RanGTP задаёт направление ядерного транспорта","keywords":["Ran","RanGTP","RCC1","RanGAP1","RanBP1","NTF2","импортин","экспортин","ядерный транспорт","митоз","веретено"],"lead":["Фактор обмена RCC1 связан с хроматином, а активатор гидролиза GTP RanGAP1 находится в цитоплазме; поэтому RanGTP сосредоточен в ядре, и импортины освобождают груз именно там."],"mechanism":["RCC1 на хроматине заменяет GDP на GTP в Ran; RanGAP1 вместе с RanBP1 в цитоплазме ускоряет гидролиз GTP на Ran.","Импортин связывает груз в цитоплазме и освобождает его в ядре при связывании RanGTP; комплекс импортин–RanGTP возвращается в цитоплазму.","NTF2 переносит RanGDP обратно в ядро; в митозе RanGTP образуется у хромосом и служит позиционной информацией для сборки веретена."],"paragraphs":["Ran — малая ГТФаза, существующая в форме, связанной с GTP, и в форме, связанной с GDP. Обмен и гидролиз нуклеотида на Ran ускоряют белки-регуляторы, а градиент возникает потому, что эти белки размещены в разных компартментах. Фактор обмена RCC1 связан с хроматином, то есть находится в ядре; активатор гидролиза RanGAP1 находится в цитоплазме, а белок RanBP1, связывающий RanGTP, ускоряет вызванный RanGAP1 гидролиз на порядок (Bischoff 1995).","Поэтому [[T47|RanGTP]] сосредоточен в ядре: FRET-сенсоры показали резкий перепад RanGTP между ядром и цитоплазмой в экстрактах яиц шпорцевой лягушки (Kalab 2002). Импортин связывает груз в цитоплазме, проходит через ядерную пору и в ядре связывает RanGTP, который освобождает груз. Комплекс импортин–RanGTP выходит в цитоплазму, где после гидролиза GTP импортин освобождается для нового цикла; экспортины, наоборот, связывают груз вместе с RanGTP в ядре (Stewart 2007).","Каждый цикл выносит Ran из ядра. Запас Ran в ядре восполняется белком NTF2: он связывает RanGDP и переносит его через пору; в ядре RCC1 заменяет GDP на GTP, а к RanGTP NTF2 сродства не имеет, и Ran остаётся в ядре (Ribbeck 1998). Направление транспорта задаёт не пора, а разделение источника RanGTP (RCC1) и его стока (RanGAP1).","В митозе ядерной оболочки нет, но RCC1 остаётся на хромосомах. В митотических клетках человека FRET-сенсор Rango показал, что вокруг хромосом свободных грузов импортина-β больше; этот градиент ускоряет сборку веретена, но для поддержания уже собранного веретена в основном не нужен (Kaláb 2006)."],"trap":["Направление ядерного импорта задаёт ядерная пора, пропускающая белки только внутрь.","Пора пропускает транспортные рецепторы в обе стороны. Направление задаёт асимметрия RanGTP: RCC1 в ядре и RanGAP1 в цитоплазме; импортин освобождает груз там, где связывает RanGTP, — в ядре."],"conditions":"Схема механизма; числа не показаны. Ускорение гидролиза RanBP1 — опыты с очищенными белками (Bischoff 1995). Перепад RanGTP между ядром и цитоплазмой — FRET-сенсоры в экстрактах яиц Xenopus laevis (Kalab 2002, по реферату). Импорт Ran при помощи NTF2 — система in vitro с пермеабилизированными клетками (Ribbeck 1998, по реферату). Градиент в митозе — клетки человека и экстракты яиц Xenopus, сенсор Rango, FRET и FLIM (Kaláb 2006, по реферату). Общая схема цикла — обзор Stewart 2007.","sources":["Bischoff1995","Kalab2002","Stewart2007","Ribbeck1998","Kalab2006"],"quiz":{"id":"S1-L13","question":"Мысленный опыт: RanGAP1 вместе с RanBP1 поместили в ядро, где RCC1 продолжает работать. Как изменится освобождение импортных грузов в ядре?","options":[{"id":"S1-L13-1","text":"Не изменится: груз освобождается в ядерной поре","correct":false,"feedback":"Пора пропускает комплекс импортина с грузом, но не разрывает его. Груз освобождается при связывании импортина с RanGTP."},{"id":"S1-L13-2","text":"Ослабнет: RanGTP в ядре станет меньше","correct":true,"feedback":"Сток RanGTP окажется рядом с источником: GTP на Ran будет гидролизоваться и в ядре, RanGTP станет меньше, и импортины будут хуже освобождать груз."},{"id":"S1-L13-3","text":"Усилится: Ran будет быстрее обменивать GTP","correct":false,"feedback":"RanGAP1 ускоряет не обмен, а гидролиз GTP на Ran. В ядре он превращал бы RanGTP в RanGDP, а RanGDP груз не освобождает."}]},"widget":{"kind":"q2ran","title":"","s":{"title":"Цикл Ran и направление транспорта","status":"Схема механизма","modes":["Градиент RanGTP","Импорт груза","Возврат Ran","Митоз"],"modes_label":"Этап","nuc":"ядро","cyt":"цитоплазма","pore":"ядерная пора","chrom":"хроматин","rcc1":"RCC1","gap":"RanGAP1 + RanBP1","rangtp":"RanGTP","rangdp":"RanGDP","imp":"импортин","cargo":"груз","ntf2":"NTF2","exch":"GDP → GTP","hydr":"GTP → GDP","release":"RanGTP освобождает груз","bind":"импортин связывает груз","spindle":"микротрубочки веретена","free":"свободные грузы импортина-β","chromos":"хромосомы","notes":["RCC1 на хроматине образует RanGTP в ядре; RanGAP1 с RanBP1 ускоряют гидролиз GTP на Ran в цитоплазме. RanGTP много в ядре и мало в цитоплазме.","Импортин связывает груз в цитоплазме; в ядре RanGTP связывается с импортином и освобождает груз. Комплекс импортин–RanGTP выходит в цитоплазму.","В цитоплазме гидролиз GTP освобождает импортин. RanGDP возвращается в ядро вместе с NTF2; там RCC1 снова заменяет GDP на GTP.","В митозе оболочки нет, но RCC1 остаётся на хромосомах: RanGTP образуется вокруг них и освобождает от импортина-β факторы сборки веретена (Kaláb 2006)."],"legend":"Сплошная стрелка — перемещение белка; пунктирная стрелка с подписью — химическое превращение нуклеотида на Ran."}},"section":1,"number":13,"question":2},{"id":"measure-gradients","questions":[2],"title":"Как измеряют градиенты в живой клетке и чем ограничены эти измерения","keywords":["биосенсор","FRET","сенсор cAMP","Epac","FRAP","оптогенетика","bPAC","рапамицин","FKBP","FRB","буферирование сенсором","калибровка"],"lead":["Лизат уничтожает пространственную информацию, поэтому градиенты измеряют в живых клетках: биосенсорами, методом FRAP и управляемым вмешательством. Каждый метод сам входит в измеряемую систему."],"mechanism":["Сенсор на основе [[T48|FRET]]: связывание лиганда меняет перенос энергии между двумя флуоресцентными белками; сенсор с одним флуоресцентным белком меняет яркость.","[[T49|FRAP]]: флуоресценцию в малой области гасят светом и по скорости её восстановления оценивают подвижность белка и долю неподвижных молекул.","Перенос фермента химически индуцируемым сближением или активация синтеза светом проверяет достаточность события; удаление белка — его необходимость."],"paragraphs":["[[T08|Генетически кодируемый биосенсор]] можно адресовать в нужное место клетки и измерять величину там, где идёт событие. Первые сенсоры Ca²⁺ были построены на FRET между двумя флуоресцентными белками, соединёнными кальмодулином (Miyawaki 1997). В сенсоре cAMP Epac1-camps cAMP-связывающий домен Epac находится между голубым и жёлтым флуоресцентными белками, и связывание cAMP уменьшает перенос энергии (Nikolaev 2004). Сегодня часто применяют сенсоры с одним флуоресцентным белком, яркость которого меняется при связывании лиганда (Greenwald 2018).","Сенсор связывает лиганд и потому буферирует его: при высокой экспрессии сенсора свободного cAMP или Ca²⁺ может становиться меньше, а его динамика и пространственный профиль — меняться. Насколько и как долго, зависит от синтеза и удаления лиганда, подвижности сенсора и обратных связей клетки (Bock 2020). Адресованный сенсор сообщает величину только для того места, куда он адресован, адресация может изменить его динамический диапазон, а без калибровки насыщение сенсора неотличимо от прекращения роста концентрации лиганда (Lyons 2023). Поэтому сообщение о локальной концентрации должно указывать сенсор, место, диапазон и способ калибровки.","FRAP измеряет подвижность: по восстановлению флуоресценции был определён коэффициент диффузии GFP в цитоплазме (Swaminathan 1997); неполное восстановление указывает на долю неподвижных молекул (Lippincott-Schwartz 2001).","Вмешательство проверяет достаточность. Фотоактивируемая аденилатциклаза bPAC при освещении повышает активность примерно в 300 раз и синтезирует cAMP в выбранный момент (Stierl 2011); рапамицин соединяет домены FKBP и FRB и за минуты переносит слитый с одним из них фермент к мембране, несущей другой домен (Putyrski и Schultz 2012)."],"trap":["Чем больше сенсора cAMP экспрессировано в клетке, тем точнее он измеряет концентрацию.","Сенсор связывает cAMP и буферирует его: избыток сенсора может снизить свободный cAMP и исказить его динамику и пространственный профиль. Нужны умеренная экспрессия, контроль количества сенсора и калибровка (Lyons 2023)."],"conditions":"Схемы методов; числа на схемах условные, кроме названных. Принцип FRET-сенсора Ca²⁺ — Miyawaki 1997, сенсора cAMP Epac1-camps — Nikolaev 2004 (по реферату). Ограничения сенсоров (буферирование, адресация, динамический диапазон, калибровка) — обзор Lyons 2023 (полный текст PMC). FRAP GFP в клетках CHO — Swaminathan 1997. bPAC: активность в темноте и на свету измерена в E. coli и ооцитах Xenopus, рост около 300 раз (Stierl 2011). Перенос белков рапамицином — обзор Putyrski и Schultz 2012 (по реферату). Режим «Сенсор буферирует» — расчёт связывания cAMP сенсором в закрытой системе: общее количество cAMP фиксировано (3 условные единицы), Kd сенсора — 1 условная единица, синтез и гидролиз не учитываются. Буферирование cAMP в клетке и нанодомены — Bock 2020 (клетки HEK293).","sources":["Miyawaki1997","Nikolaev2004","Greenwald2018","Lyons2023","Swaminathan1997","LippincottSchwartz2001","Stierl2011","Putyrski2012","Bock2020"],"quiz":{"id":"S1-L14","question":"Сенсор cAMP, адресованный к мембране домена, экспрессировали в 10 раз сильнее, чем в первом опыте; синтез cAMP и активность фосфодиэстераз в обоих опытах одинаковы, а ответ измеряли через 30 с после стимуляции, до установления стационара. После стимуляции гормоном доля сенсора, связавшего cAMP, у мембраны выросла меньше, чем при низкой экспрессии. Какое объяснение согласуется с этим результатом?","options":[{"id":"S1-L14-1","text":"Сенсор насытился cAMP раньше, чем при низкой экспрессии","correct":false,"feedback":"Насыщение означало бы, что почти весь сенсор связан с cAMP. При десятикратном избытке сенсора та же порция cAMP распределяется по большему числу молекул, и доля связанного сенсора, наоборот, ниже."},{"id":"S1-L14-2","text":"Отношение сигналов зависит от количества сенсора","correct":false,"feedback":"Отношение сигналов одного сенсора, в отличие от яркости, от его количества не зависит. Меньший ответ объясняется тем, что изменилась сама концентрация свободного cAMP."},{"id":"S1-L14-3","text":"Сенсор связал часть cAMP и снизил свободный cAMP","correct":true,"feedback":"Сенсор входит в измеряемую систему: в начальной фазе ответа он связывает часть cAMP и снижает свободную концентрацию (в длительном стационаре неподвижный обратимый сенсор её почти не меняет). Насколько и как долго, зависит от синтеза и гидролиза cAMP, подвижности сенсора и обратных связей, поэтому экспрессию сенсора держат умеренной и контролируют (Lyons 2023)."}],"rev":2},"widget":{"kind":"method","title":"","s":{"title":"Методы измерения градиентов","status":"Схемы методов","modes":["FRET-сенсор","Сенсор с одним белком","FRAP","Сенсор буферирует","Проверка достаточности"],"modes_label":"Метод","schemes":[{"draw":"q2fret","h":290,"l":{"a":"без cAMP","b":"cAMP связан","cfp":"CFP","yfp":"YFP","dom":"домен Epac","camp":"cAMP","ex":"возбуждение CFP светом 430 нм","fret":"перенос энергии","em1":"свечение YFP","em2":"свечение CFP","ratio":"Измеряют отношение свечения CFP / YFP: оно растёт при связывании cAMP и не зависит от количества сенсора."},"note":"FRET-сенсор: связывание cAMP меняет форму сенсора и расстояние между флуоресцентными белками, перенос энергии уменьшается. Отношение двух каналов не зависит от количества сенсора в данной точке клетки."},{"draw":"q2single","h":260,"l":{"a":"без лиганда","b":"лиганд связан","fp":"флуоресцентный белок","dom":"связывающий домен","lig":"лиганд","dim":"тускло","bright":"ярко","warn":"Яркость зависит и от количества сенсора: нужен второй, независимый от лиганда канал или калибровка."},"note":"Сенсор с одним флуоресцентным белком: связывание лиганда меняет яркость. Сигнал сильнее, чем у FRET-сенсоров, но яркость зависит от количества сенсора, поэтому нужен контроль количества."},{"draw":"q2frap","h":265,"l":{"a":"до выцветания","b":"сразу после вспышки","c":"восстановление","spot":"область выцветания","x":"время","y":"флуоресценция в области","mob":"подвижная доля","imm":"неподвижная доля","t12":"t½ — тем меньше, чем выше D"},"note":"FRAP: после выцветания в область диффундируют невыцветшие (флуоресцирующие) молекулы из окружающих участков, а выцветшие — из неё наружу. По времени полувосстановления рассчитывают коэффициент диффузии, по неполному восстановлению — долю неподвижных молекул."},{"draw":"q2buf","h":230,"data":{"Kd":1,"camp":3},"l":{"x":"сенсор, условные единицы","y":"свободный cAMP, % от опыта без сенсора","lo":"низкая экспрессия","hi":"высокая экспрессия"},"note":"В показанном расчёте общее количество cAMP фиксировано (3 условные единицы, Kd сенсора — 1 условная единица): дополнительный сенсор связывает часть cAMP и снижает свободную концентрацию. В живой клетке величина и длительность эффекта зависят также от синтеза, гидролиза, подвижности сенсора и обратных связей."},{"draw":"q2cid","h":250,"l":{"a":"сближение рапамицином","b":"синтез cAMP по свету","mem":"мембрана","frb":"FRB","fkbp":"FKBP","enz":"фермент","rapa":"рапамицин","min":"минуты","light":"синий свет","bpac":"bPAC","camp":"cAMP","dark":"темнота: активность низкая","on":"свет: активность ×300"},"note":"Проверка достаточности: фермент переносят на выбранную мембрану (рапамицин соединяет FKBP и FRB) или активируют синтез cAMP светом (bPAC) и смотрят, возникает ли ответ. Удаление белка отвечает на другой вопрос — о необходимости."}]}},"section":1,"number":14,"question":2},{"id":"lipid-code","questions":[3],"title":"Как минорные липиды размечают мембраны компартментов","keywords":["фосфоинозитиды","липидный код","PI(4,5)P₂","PI4P","PI3P","PI(3,5)P₂","PI(3,4,5)P₃","инозитольное кольцо","асимметрия","флиппаза","скрамблаза","фосфатидилсерин"],"lead":["Мембраны разных компартментов различаются характерным фосфоинозитидом — производным фосфатидилинозитола с фосфатами в положениях 3, 4 или 5 инозитольного кольца.","Это распределение называют липидным кодом, но точнее говорить о разметке, которую белки считывают вместе с другими признаками мембраны: один липид встречается в нескольких мембранах."],"mechanism":["Плазматическая мембрана размечена PI(4,5)P₂, аппарат Гольджи — PI4P, ранняя эндосома — PI3P, поздняя эндосома и лизосома — PI(3,5)P₂; PI(3,4,5)P₃ появляется после активации рецепторов.","Содержание метки распределено непрерывно: PI4P есть и на Гольджи, и в плазматической мембране, и на поздних эндосомах.","Разметка существует и поперёк бислоя: фосфатидилсерин удерживается в цитозольном монослое флиппазами и выходит наружу при активации скрамблаз."],"paragraphs":["Все мембраны клетки построены из одних и тех же основных классов липидов. Для быстрой разметки служат [[T09|фосфоинозитиды]] — малая по количеству группа производных фосфатидилинозитола (PI). Их инозитольное кольцо фосфорилировано в положениях 3, 4 или 5 в разных сочетаниях; головная группа обращена в цитозоль, где её узнают белки. Каждую комбинацию фосфатов на мембране создают и удаляют свои ферменты, поэтому метка меняется за секунды–минуты и может смениться без изменения основного липидного состава мембраны.","Распределение фосфоинозитидов по компартментам устойчиво и составляет то, что называют [[T50|липидным кодом]] (Balla 2013; Posor 2022). Слово «код» требует ограничения. Это не таблица адресов: [[T51|характерный фосфоинозитид]] обогащён в своём компартменте, но встречается и в других. Сенсор P4M, для связывания которого PI4P необходим и достаточен, показывает этот липид на Гольджи, на плазматической мембране и на поздних эндосомах (Hammond 2014). Белок узнаёт участок мембраны с вероятностью, которая зависит от сочетания метки, поверхностного заряда, кривизны и белков-партнёров (Posor 2022; Lai 2025).","Разметка существует и поперёк бислоя. Фосфатидилсерин сосредоточен в цитозольном монослое плазматической мембраны: его переносят туда ATP-зависимые флиппазы семейства P4-АТФаз. [[T62|Скрамблазы]] TMEM16F (активируется подъёмом Ca²⁺) и Xkr8 (активируется расщеплением каспазами при апоптозе) переносят липиды в обе стороны без затраты ATP и рассеивают асимметрию; фосфатидилсерин на внешней поверхности узнают фагоциты (Sakuragi 2023). Без скрамблазы спонтанный переход фосфолипида между монослоями занимает часы.","На схеме головная группа показана как кольцо с пронумерованными положениями — это схема, а не структурная формула. Карта меток построена по модели практикума: числа условны и показывают, где липид преобладает."],"trap":["Каждая мембрана несёт один фосфоинозитид, и этот липид служит её однозначным адресом.","Один и тот же фосфоинозитид присутствует в нескольких мембранах, и его содержание меняется непрерывно; мембрану узнают по сочетанию липида с другими признаками — зарядом, кривизной, белками-партнёрами."],"conditions":"Распределение фосфоинозитидов — по обзорам Balla 2013 и Posor 2022 (клетки млекопитающих); пулы PI4P на Гольджи, плазматической мембране и поздних эндосомах — Hammond 2014 (сенсор P4M, клетки COS-7 и другие линии). Асимметрия монослоёв, флиппазы и скрамблазы — обзор Sakuragi и Nagata 2023. Содержания на карте меток — учебная модель практикума (вопрос 3, базовый уровень), 100 у. е. — содержание липида на его характерной мембране. Головная группа показана схемой, без структурной формулы.","sources":["Balla2013","Posor2022","Lai2025","Hammond2014","Sakuragi2023"],"quiz":{"id":"S1-L15","question":"Сенсор P4M, для связывания которого PI4P необходим и достаточен, показал сигнал на аппарате Гольджи, на плазматической мембране и на поздних эндосомах. Что следует из этого для липидного кода?","options":[{"id":"S1-L15-1","text":"Один фосфоинозитид размечает несколько мембран","correct":true,"feedback":"PI4P характерен для Гольджи, но его синтезируют и в других мембранах. Поэтому метка обозначает не адрес, а один из признаков, по которым белок узнаёт мембрану вместе с другими."},{"id":"S1-L15-2","text":"Сенсор ошибается: PI4P бывает только на Гольджи","correct":false,"feedback":"Пул PI4P плазматической мембраны подтверждён удалением PI4P фосфатазой: после него P4M диссоциирует от этой мембраны (Hammond 2014)."},{"id":"S1-L15-3","text":"Эти три мембраны образуют один компартмент","correct":false,"feedback":"Компартменты различаются набором условий и белков, а не одним липидом; общий липид в разных мембранах не делает их одним компартментом."}]},"widget":{"kind":"q3code","title":"","s":{"title":"Липидная разметка мембран","status":["Схема механизма: головная группа, а не структурная формула","Учебная модель, условные величины (модель практикума)","Схема механизма"],"view_label":"Показать","views":["головную группу","карту меток","поперёк бислоя"],"lip_label":"Липид","lips":["PI","PI3P","PI4P","PI(3,5)P₂","PI(4,5)P₂","PI(3,4,5)P₃"],"lip_names":["PI — фосфатидилинозитол","PI3P","PI4P","PI(3,5)P₂","PI(4,5)P₂","PI(3,4,5)P₃"],"dag":"диацилглицерол","not_formula":"Схема, а не структурная формула: цифры — положения инозитольного кольца","head_notes":["Фосфатидилинозитол — исходный липид: кольцо без дополнительных фосфатов. Из него местные киназы образуют все фосфоинозитиды.","PI3P: фосфат в положении 3. Синтезируется киназой VPS34; характерен для ранних эндосом.","PI4P: фосфат в положении 4. Синтезируют PI-4-киназы; характерен для Гольджи, есть в плазматической мембране и на поздних эндосомах.","PI(3,5)P₂: фосфаты в положениях 3 и 5. Синтезируется киназой PIKfyve из PI3P; характерен для поздних эндосом и лизосом.","PI(4,5)P₂: фосфаты в положениях 4 и 5. Синтезируется киназой PIP5K из PI4P; характерен для плазматической мембраны.","PI(3,4,5)P₃: фосфаты в положениях 3, 4 и 5. Синтезируется PI3K класса I из PI(4,5)P₂ после активации рецептора."],"content_t":"содержание по мембранам (у. е.)","mems":["плазматическая мембрана","аппарат Гольджи","ранняя эндосома","поздняя эндосома, лизосома"],"ue":"у. е.","na":"в модели не рассчитывается","map_notes":["Фосфатидилинозитол есть во всех мембранах; модель рассчитывает только его фосфорилированные производные.","PI3P: 100 у. е. на ранней эндосоме и мало на поздней — его превращает PIKfyve.","PI4P: 100 у. е. на Гольджи, 67 — в плазматической мембране, 27 — на поздней эндосоме. Один липид размечает несколько мембран.","PI(3,5)P₂: 100 у. е. на поздней эндосоме, 15 — на ранней.","PI(4,5)P₂: в модели только в плазматической мембране.","PI(3,4,5)P₃ показан после фактора роста: 100 у. е. в плазматической мембране; в покое — около 4 у. е."],"scr_label":"Скрамблаза","scr":["неактивна","активирована (Ca²⁺ или каспазы)"],"out_side":"внеклеточная сторона","in_side":"цитозольная сторона","flip":"флиппаза (P4-АТФаза)","scramb":"скрамблаза","ps":"фосфатидилсерин","transfer":"пунктир со стрелкой — перенос липида между монослоями","scr_notes":["Флиппаза с затратой ATP переносит фосфатидилсерин в цитозольный монослой; внешний монослой его почти не содержит.","Активированная скрамблаза (TMEM16F — при подъёме Ca²⁺, Xkr8 — после расщепления каспазами) переносит липиды в обе стороны без затраты ATP: фосфатидилсерин появляется снаружи."]}},"section":2,"number":15,"question":3},{"id":"conversion","questions":[3],"title":"Как киназы и фосфатазы меняют метку при созревании эндосомы","keywords":["конверсия","липидкиназа","липидфосфатаза","VPS34","PIKfyve","Rab5","Rab7","созревание эндосомы","стационар","апилимод"],"lead":["Метку на мембране синтезирует местная киназа, а удаляют местные фосфатазы или следующая киназа; её содержание — стационар синтеза и удаления.","При созревании эндосомы одна метка сменяется другой: PI(4,5)P₂ ямки дефосфорилируется, на ранней эндосоме VPS34 заново синтезирует PI3P, затем PIKfyve превращает его в PI(3,5)P₂; одновременно Rab5 сменяется на Rab7."],"mechanism":["[[T52|Липидкиназы и липидфосфатазы]] сами локализованы на определённых мембранах, поэтому превращения идут не в объёме, а на конкретной мембране.","На ранней эндосоме [[T65|VPS34]] синтезирует PI3P; при созревании [[T66|PIKfyve]] превращает его в PI(3,5)P₂.","Смена метки сопровождается сменой малых ГТФаз ([[T63|Rab5 на Rab7]]) и набора белков-эффекторов."],"paragraphs":["Фосфоинозитиды взаимопревращаются набором ферментов, каждый из которых фосфорилирует или дефосфорилирует определённое положение кольца. Метка непрерывно обновляется: PI3P исчезает с эндосом вскоре после подавления PI3K, потому что фосфатазы продолжают его удалять (Hammond и Balla 2015). Содержание метки — [[T07|стационарное неравновесное состояние]] между синтезом и удалением.","Наиболее полно описана [[T53|смена метки]] при эндоцитозе (Wallroth и Haucke 2018; Posor 2022). Там, где формируется клатриновая ямка, PI(4,5)P₂ служит платформой для сборки белков эндоцитоза; при отделении пузырька его дефосфорилируют 5-фосфатазы. На образующейся ранней эндосоме VPS34, связанная с Rab5, синтезирует PI3P. При созревании PIKfyve фосфорилирует PI3P с образованием PI(3,5)P₂, а Rab5 см
