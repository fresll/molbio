крысы (Thastrup 1990); DTT — восстановление дисульфидных связей гемагглютинина вируса гриппа в клетках CHO (Braakman 1992); 4μ8C — Lys907 РНКазного домена IRE1 (Cross 2012); GSK2606414 — ингибитор PERK (Axten 2012), ингибирует также RIPK1 (Rojas-Rivera 2017). Сведения о веществах взяты из аннотаций этих работ.</p></details></article><article class="card print-unit" id="ns-keap1-nrf2"><div class="eyebrow">KEAP1–NRF2 · шаг 15 из 30</div><h2>Почему содержание NRF2 мало без электрофильного воздействия</h2><p class="lead">Без электрофильного воздействия <a href="#ns-g-S10-T34">NRF2</a> синтезируется постоянно, но его содержание остаётся низким: белок быстро разрушается. Скорость разрушения задаёт комплекс <a href="#ns-g-S10-T37">KEAP1–CUL3–RBX1</a>, который направляет NRF2 на <a href="#ns-g-S10-T38">убиквитинирование</a> и <a href="#ns-g-S10-T39">протеасомную деградацию</a>.</p><ol class="mech"><li><a href="#ns-g-S10-T33">KEAP1</a> связывает NRF2 и служит субстратным адаптером убиквитинлигазного комплекса CUL3–RBX1.</li><li>Комплекс присоединяет к NRF2 цепь убиквитина, и убиквитинированный NRF2 расщепляется протеасомой.</li><li>В стационарном состоянии NRF2 разрушается с той же общей скоростью, с какой синтезируется; его содержание тем выше, чем меньшая доля молекул разрушается за единицу времени, поэтому замедление разрушения при прежнем синтезе повышает содержание.</li></ol><p>NRF2 (продукт гена NFE2L2) — транскрипционный фактор, регулирующий гены защиты от электрофилов и окислителей. В клетке без такого воздействия мРНК NRF2 транслируется, и белок образуется непрерывно. Тем не менее NRF2 в клетке мало: по данным разных работ, период полужизни NRF2 в исходном состоянии составляет около 7–20 мин.</p><p>Быстрое удаление NRF2 зависит от KEAP1. Раньше KEAP1 считали пассивным «якорем», удерживающим NRF2 в цитоплазме. Эксперименты с трансфицированными клетками показали иное: KEAP1 связывает NRF2 и как субстратный адаптер присоединяет его к куллину CUL3, а белок RBX1 этого комплекса обеспечивает перенос убиквитина. Сам KEAP1 не протеаза и не фермент переноса убиквитина: он определяет, какой белок будет убиквитинирован. NRF2 с цепью убиквитина распознаётся и расщепляется протеасомой.</p><p>Содержание любого белка складывается из двух процессов — образования и удаления. При постоянной скорости синтеза замедление разрушения увеличивает стационарное содержание NRF2, а ускорение разрушения уменьшает его. Сразу после замедления разрушения NRF2 удаляется медленнее, чем образуется, и накапливается; новое стационарное содержание устанавливается, когда общая скорость разрушения — произведение числа молекул на разрушаемую долю — снова сравнивается со скоростью синтеза. Поэтому накопление NRF2 возможно без усиления транскрипции его гена: достаточно ослабить KEAP1-зависимое разрушение. Кроме KEAP1-зависимого пути есть и другой: киназа GSK3 фосфорилирует участок NRF2, и фосфорилированный участок распознаётся убиквитинлигазой с β-TrCP. Этот путь сохраняется при нарушенной работе KEAP1.</p><p>Тот же принцип — регуляция количества белка через скорость его разрушения — встретится в разделе о HIF-α. Там распознавание определяется гидроксилированием пролина, а убиквитинирование выполняет другой комплекс. Сходство здесь функциональное: в обоих случаях содержание фактора определяется скоростью его разрушения, хотя молекулярные участники разные.</p><div class="note trap"><strong>Типичная ошибка</strong> Если NRF2 в клетке мало, значит, его ген слабо транскрибируется или мРНК почти не транслируется.<p class="trap-fix">В исходном состоянии NRF2 синтезируется постоянно; его мало потому, что он быстро разрушается при участии KEAP1. Количество белка нельзя оценивать только по синтезу.</p></div><div class="static-quiz"><h3>В исходном стационарном состоянии скорость синтеза NRF2 постоянна. KEAP1-зависимое направление NRF2 на разрушение замедлилось; остальные пути распада не изменились. Какое изменение содержания NRF2 ожидается?</h3><ol><li><b>А.</b> Содержание уменьшится из-за усиления его убиквитинирования. <i>(неверный вариант)</i><br><span class="expl">В условии ослаблен путь к разрушению; увеличение убиквитинирования не является заданным изменением.</span></li><li><b>Б.</b> Содержание возрастёт за счёт замедленного распада. <i>(верный вариант)</i><br><span class="expl">При продолжающемся синтезе уменьшение скорости удаления приводит к накоплению белка.</span></li><li><b>В.</b> Содержание останется прежним, поскольку скорость синтеза не изменилась. <i>(неверный вариант)</i><br><span class="expl">Стационарное содержание зависит также от скорости распада; постоянный синтез не фиксирует количество белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1128/MCB.24.16.7130-7139.2004">Kobayashi A. et al. Oxidative stress sensor Keap1 functions as an adaptor for Cul3-based E3 ligase to regulate proteasomal degradation of Nrf2. Mol Cell Biol. 2004;24:7130–9.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li></ul><p>Схема механизма, качественные состояния; величины на шкалах условные (уровни «низкий — высокий»), а не измерения. KEAP1-зависимый путь показан как канонический для клеток млекопитающих. Период полужизни NRF2 7–18 мин в разных клетках приведён по обзору Ulasov 2022; менее 20 мин — Kobayashi 2004 (клетки млекопитающих в культуре, по аннотации). Путь GSK3–β-TrCP описан в обзоре Ulasov 2022; в схеме он показан пунктиром и не меняется.</p></details></article><article class="card print-unit" id="ns-keap1-cysteines"><div class="eyebrow">KEAP1–NRF2 · шаг 16 из 30</div><h2>Как модификация цистеинов KEAP1 изменяет устойчивость NRF2</h2><p class="lead"><a href="#ns-g-S10-T35">Электрофилы</a> ковалентно модифицируют <a href="#ns-g-S10-T36">тиоловые группы цистеинов</a> KEAP1, и комплекс KEAP1–CUL3–RBX1 перестаёт эффективно убиквитинировать NRF2. Для накопления NRF2 не обязательно, чтобы он отделился от KEAP1: связывание и продуктивное убиквитинирование — разные свойства комплекса.</p><ol class="mech"><li>Электрофил принимает электронную пару, а тиоловая группа цистеина служит её донором; при реакции образуется ковалентная связь с остатком цистеина.</li><li>Разные цистеины KEAP1 выполняют разные функции: Cys151 домена BTB нужен для ответа на сульфорафан и ряд других индукторов, а Cys273 и Cys288 промежуточной области IVR — для самого убиквитинирования NRF2.</li><li>После модификации KEAP1 может по-прежнему связывать NRF2, но убиквитинирование ослабевает; занятый KEAP1 не принимает новые молекулы NRF2, и они накапливаются.</li></ol><p>Электрофил — соединение, способное принимать электронную пару при образовании химической связи. Тиоловая группа (–SH) боковой цепи цистеина богата электронами и легко вступает в такие реакции. Электрофилы — это не то же самое, что свободные радикалы или любые окислители: перекись водорода, например, окисляет цистеины KEAP1, но по другому механизму и с участием других остатков.</p><p>В KEAP1 домен BTB обеспечивает образование димера и связывание с CUL3. Два домена Kelch этого димера распознают мотивы ETGE и DLG белка NRF2; связывание с ETGE прочнее, чем с DLG. Между доменами BTB и Kelch каждого мономера KEAP1 расположена промежуточная область IVR. Цистеины этих частей неравноценны. В экспериментах Zhang и Hannink (2003) на трансфицированных клетках замены Cys273 и Cys288 нарушали KEAP1-зависимое убиквитинирование NRF2, а Cys151 был нужен для того, чтобы сульфорафан и окислительное воздействие подавляли разрушение NRF2. Набор важных остатков зависит от индуктора, поэтому вывод о Cys151 нельзя переносить на все электрофилы.</p><p>Как модификация останавливает разрушение NRF2? По данным Baird и соавт. (2013), полученным в живых клетках, комплекс проходит цикл: сначала NRF2 связан с одним мономером KEAP1 через ETGE, затем с обоими — через ETGE и DLG; в этом «закрытом» состоянии NRF2 убиквитинируется. Индуктор останавливает цикл в закрытом состоянии без освобождения NRF2: KEAP1 остаётся занят, и вновь синтезированный NRF2 накапливается. Это одна из моделей; общий вывод обзоров — электрофилы мало меняют связывание, но подавляют функцию KEAP1 как адаптера убиквитинлигазы.</p><p>Возможен и другой путь — конкуренция за связывание без модификации цистеинов. Так действует p62: его мотив KIR связывается с доменом Kelch и вытесняет NRF2 из связи через DLG. Это иной механизм, и его следует отличать от электрофильной модификации.</p><div class="note trap"><strong>Типичная ошибка</strong> Все индукторы NRF2 действуют через один и тот же цистеин KEAP1 — Cys151.<p class="trap-fix">Набор важных остатков зависит от индуктора: ответ на сульфорафан требует Cys151, Cys273 и Cys288 нужны для самого убиквитинирования NRF2, а перекись водорода окисляет другие цистеины KEAP1.</p></div><div class="static-quiz"><h3>После действия электрофила KEAP1 продолжает связывать NRF2, но продуктивное убиквитинирование NRF2 уменьшается. Совместим ли такой результат с накоплением NRF2?</h3><ol><li><b>А.</b> Да: сохранённое связывание не означает сохранённого направления на разрушение. <i>(верный вариант)</i><br><span class="expl">Физическая связь и продуктивное убиквитинирование — разные свойства комплекса; первое может сохраняться при ослаблении второго.</span></li><li><b>Б.</b> Нет: NRF2 может накапливаться только после полного отделения от каждой молекулы KEAP1. <i>(неверный вариант)</i><br><span class="expl">Обязательная полная диссоциация не является общим условием электрофильной активации этого пути.</span></li><li><b>В.</b> Нет: любое связывание с KEAP1 обязательно ускоряет разрушение NRF2 в прежней степени. <i>(неверный вариант)</i><br><span class="expl">Модификация KEAP1 может менять функцию связанного комплекса без устранения самого взаимодействия.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1073/pnas.1305687110">Baird L. et al. Regulatory flexibility in the Nrf2-mediated stress response is conferred by conformational cycling of the Keap1-Nrf2 protein complex. Proc Natl Acad Sci U S A. 2013;110:15259–64.</a></li><li><a href="https://doi.org/10.1128/MCB.23.22.8137-8151.2003">Zhang DD., Hannink M. Distinct cysteine residues in Keap1 are required for Keap1-dependent ubiquitination of Nrf2 and for stabilization of Nrf2 by chemopreventive agents and oxidative stress. Mol Cell Biol. 2003;23:8137–51.</a></li><li><a href="https://doi.org/10.1073/pnas.172398899">Dinkova-Kostova A. T. et al. Direct evidence that sulfhydryl groups of Keap1 are the sensors regulating induction of phase 2 enzymes that protect against carcinogens and oxidants. Proc Natl Acad Sci USA. 2002;99:11908–11913.</a></li><li><a href="https://doi.org/10.1038/ncb2021">Komatsu M. et al. The selective autophagy substrate p62 activates the stress responsive transcription factor Nrf2 through inactivation of Keap1. Nat Cell Biol. 2010;12:213–23.</a></li></ul><p>Схема механизма, качественные состояния; показан один мономер KEAP1, хотя KEAP1 действует как димер. Zhang &amp; Hannink 2003 — трансфицированные клетки млекопитающих в культуре, сульфорафан и окислительное воздействие (прочитана аннотация; по индексам MeSH — клетки COS и NIH 3T3). Baird 2013 — живые клетки, перенос энергии флуоресценции, измеряемый методом времени жизни флуоресценции (по аннотации). Номера Cys151, Cys273 и Cys288 одинаковы для KEAP1 человека и мыши. Dinkova-Kostova 2002 — очищенный KEAP1 мыши (25 цистеинов), модификация дексаметазонмезилатом, масс-спектрометрия триптических пептидов: наиболее реакционноспособны C257, C273, C288, C297 (по аннотации). В экспериментах с очищенным белком авторы наблюдали разрушение комплекса KEAP1–Neh2 индукторами, а в клетках связывание в основном сохраняется — результат зависит от системы. Механизм p62 — Komatsu 2010, Liu 2022.</p></details></article><article class="card print-unit" id="ns-nrf2-transcription"><div class="eyebrow">KEAP1–NRF2 · шаг 17 из 30</div><h2>Как NRF2 регулирует транскрипцию через малые Maf и ARE</h2><p class="lead">Стабилизированный NRF2 действует в ядре: вместе с <a href="#ns-g-S10-T40">малым Maf-белком</a> он образует гетеродимер, который связывается с <a href="#ns-g-S10-T41">элементом антиоксидантного ответа</a> (ARE) в регуляторных областях генов-мишеней. Количество NRF2, его ядерная доля, связывание с ARE и синтез РНК генов-мишеней — четыре разных события, и их не следует сводить к одному показателю «активации».</p><ol class="mech"><li>Накопившийся NRF2 переносится в ядро; в цитоплазме и ядре его количество задаётся также соотношением импорта и экспорта.</li><li>NRF2 и малый Maf (MafF, MafG или MafK) образуют гетеродимер через лейциновые «молнии»; этот комплекс связывается с последовательностью ARE в ДНК.</li><li>Связывание с ARE усиливает транскрипцию соответствующих генов; на части генов ARE может быть занят репрессором BACH1 в комплексе с малым Maf.</li></ol><p>После того как разрушение NRF2 замедлилось, новые молекулы накапливаются и переходят в ядро. NRF2 содержит сигналы ядерной локализации и сигналы ядерного экспорта, поэтому его распределение между цитоплазмой и ядром определяется балансом импорта и экспорта. Ядерная доля — отдельная величина: она может меняться иначе, чем общее количество белка.</p><p>NRF2 принадлежит к белкам с основным участком и лейциновой «молнией» (bZIP). Связываться с ДНК он может только в паре с партнёром — одним из малых Maf-белков. Гетеродимер NRF2–Maf распознаёт ARE — короткую регуляторную последовательность ДНК в промоторах и энхансерах генов-мишеней. ARE — это участок ДНК, а не белок и не показатель окислительного повреждения. Не следует путать его с HRE — элементом, с которым связывается комплекс HIF-α с ARNT в ответе на гипоксию.</p><p>Малые Maf-белки образуют комплексы и с другими факторами. Один из них — репрессор BACH1: в комплексе с малым Maf он занимает ARE ряда генов, например гена HMOX1, и подавляет их транскрипцию. В клетках HaCaT арсенит выводил BACH1 из ядра уже за 30 мин, и HMOX1 индуцировался задолго до заметного накопления NRF2 в ядре. Значит, транскрипция гена-мишени зависит не только от количества NRF2, но и от того, свободен ли ARE.</p><p>Из этого следует порядок событий: стабилизация белка → накопление в ядре → связывание с ARE → синтез РНК. Каждое событие измеряют отдельно, и одно не доказывает другого. Наличие похожей на ARE последовательности в гене также не означает, что этот ген будет активирован в любой ткани: важны доступность хроматина и другие регуляторы.</p><div class="note trap"><strong>Типичная ошибка</strong> Если NRF2 оказался в ядре, все гены с последовательностью ARE обязательно активируются в любой клетке.<p class="trap-fix">Ядерная локализация — лишь одно из условий. Для транскрипции нужны гетеродимер с малым Maf, связывание с доступным ARE и отсутствие конкурирующих репрессоров, например BACH1.</p></div><div class="static-quiz"><h3>Какой комплекс непосредственно участвует в распознавании ARE в канонической транскрипционной программе NRF2?</h3><ol><li><b>А.</b> Комплекс NRF2 с KEAP1, который переносит оба белка к ARE. <i>(неверный вариант)</i><br><span class="expl">В каноническом ДНК-связывающем комплексе партнёром NRF2 служит малый Maf, а KEAP1 относится к регуляции его устойчивости.</span></li><li><b>Б.</b> Гетеродимер NRF2 с одним из малых Maf-белков. <i>(верный вариант)</i><br><span class="expl">Малые Maf служат партнёрами NRF2 в комплексе, связывающем соответствующие последовательности ДНК.</span></li><li><b>В.</b> Гетеродимер NRF2 с ARNT, который связывает HRE. <i>(неверный вариант)</i><br><span class="expl">ARNT и HRE относятся к канонической системе HIF; они не заменяют малые Maf и ARE в этом механизме.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li></ul><p>Схема механизма, качественные состояния; шкалы условные. Гетеродимер NRF2–малый Maf и ARE — обзоры Liu 2022 и Ulasov 2022. Сигналы ядерной локализации и экспорта NRF2 — обзор Ulasov 2022. Пример HMOX1: клетки HaCaT (кератиноциты человека), арсенит; выход BACH1 из ядра через 30 мин, накопление NRF2 в ядре к 3 ч — эксперимент, описанный в обзоре Liu 2022 (первичная работа в этой подготовке не прочитана).</p></details></article><article class="card print-unit" id="ns-nrf2-effectors"><div class="eyebrow">KEAP1–NRF2 · шаг 18 из 30</div><h2>Почему NRF2-зависимая защита требует синтеза ферментов</h2><p class="lead">NRF2 — транскрипционный фактор: он сам не восстанавливает пероксиды и не связывает электрофилы. Защиту обеспечивают ферменты, гены которых транскрибируются при участии NRF2. Поэтому между накоплением NRF2 и ростом содержания ферментов проходит время: нужны транскрипция и трансляция.</p><ol class="mech"><li>NRF2 усиливает транскрипцию генов ферментов синтеза глутатиона (<a href="#ns-g-S10-T46">GCLC и GCLM</a>), восстановления хинонов (<a href="#ns-g-S10-T45">NQO1</a>), тиоредоксиновой системы (<a href="#ns-g-S10-T47">TXNRD1</a>), расщепления гема (<a href="#ns-g-S10-T48">HO-1</a>) и др.</li><li>Глутатионпероксидаза катализирует реакцию 2 GSH + H₂O₂ → GSSG + 2 H₂O, а глутатионредуктаза — реакцию GSSG + NADPH + H⁺ → 2 GSH + NADP⁺.</li><li>Защитный эффект возникает после синтеза новых молекул ферментов и зависит от доступности их субстратов, в том числе <a href="#ns-g-S10-T44">NADPH</a>.</li></ol><p>Связавшийся с ARE гетеродимер NRF2–малый Maf усиливает транскрипцию генов-мишеней. Набор таких генов широк: ферменты синтеза и использования глутатиона, тиоредоксиновой системы, обезвреживания чужеродных веществ, образования NADPH и обмена гема. Для объяснения достаточно нескольких примеров. GCLC и GCLM — каталитическая и модифицирующая субъединицы глутамат-цистеин-лигазы, фермента первой стадии синтеза глутатиона. NQO1 восстанавливает хиноны. TXNRD1 восстанавливает тиоредоксин за счёт NADPH. HO-1 (продукт гена HMOX1) расщепляет гем; её ген регулируется не только NRF2, и рост HO-1 не означает защиты от любого повреждения.</p><p>Глутатион (<a href="#ns-g-S10-T43">GSH</a>) — трипептид γ-глутамилцистеинилглицин; его тиоловая группа служит донором электронов. Глутатионпероксидаза восстанавливает H₂O₂ до воды: 2 GSH + H₂O₂ → GSSG + 2 H₂O. Две молекулы глутатиона при этом окисляются и образуют дисульфид GSSG. Это первая реакция; пероксид в ней восстанавливается, а не превращается в глутатион.</p><p>Вторая, отдельная реакция возвращает глутатион в восстановленную форму. Глутатионредуктаза восстанавливает GSSG: GSSG + NADPH + H⁺ → 2 GSH + NADP⁺. Источником электронов служит именно NADPH; NADH в этой реакции его не заменяет. Поэтому защита зависит и от путей образования NADPH, которые рассматривались в семинаре 8.</p><p>Из этих реакций видно место NRF2. Он не участвует в химических превращениях, а меняет количество ферментов. Сначала растёт содержание NRF2 в ядре, затем — мРНК генов-мишеней, и лишь после трансляции — содержание ферментов. Поэтому ранний и поздний сроки эксперимента дают разные показания, и усиление транскрипции не означает автоматического уменьшения всех активных форм кислорода.</p><div class="note trap"><strong>Типичная ошибка</strong> Глутатион «превращается» в пероксид или пероксид — в GSSG: это одна реакция цикла.<p class="trap-fix">Реакций две. Глутатионпероксидаза восстанавливает H₂O₂ до воды, окисляя две молекулы GSH в GSSG; глутатионредуктаза затем восстанавливает GSSG до GSH за счёт NADPH.</p></div><div class="static-quiz"><h3>NRF2 накопился в ядре и связался с ARE в составе соответствующего комплекса. Какое событие связывает это с увеличением содержания защитных ферментов?</h3><ol><li><b>А.</b> Связанный с ДНК NRF2 непосредственно катализирует удаление пероксидов. <i>(неверный вариант)</i><br><span class="expl">NRF2 регулирует транскрипцию; каталитические реакции выполняют продукты соответствующих генов.</span></li><li><b>Б.</b> Изменение транскрипции генов-мишеней и последующий синтез соответствующих белков. <i>(верный вариант)</i><br><span class="expl">NRF2 действует через экспрессию генов; появление новых молекул ферментов отделено во времени от связывания фактора с ДНК.</span></li><li><b>В.</b> Ядерный NRF2 немедленно увеличивает количество уже существующих ферментов без синтеза новых молекул. <i>(неверный вариант)</i><br><span class="expl">Изменение содержания фермента требует изменения его синтеза или распада; само связывание регулятора с ДНК не создаёт новые молекулы фермента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li><li><a href="https://doi.org/10.1089/ars.2017.7342">Tonelli C., Chio I. I. C., Tuveson D. A. Transcriptional regulation by Nrf2. Antioxid Redox Signal. 2018;29:1727–1745.</a></li></ul><p>Схема механизма; ранний и поздний сроки показаны качественно, без часов. Набор генов-мишеней зависит от клетки и ткани; приведены примеры, описанные в обзорах Tonelli 2018 (по аннотации), Liu 2022 и Ulasov 2022. Стехиометрия реакций глутатионпероксидазы и глутатионредуктазы — общепринятая биохимическая. Утверждение, что ген глутатионпероксидазы регулируется NRF2, здесь не делается.</p></details></article><article class="card print-unit" id="ns-nrf2-feedback"><div class="eyebrow">KEAP1–NRF2 · шаг 19 из 30</div><h2>Как p62 связывает NRF2 с селективной аутофагией</h2><p class="lead"><a href="#ns-g-S10-T42">p62/SQSTM1</a> — рецептор селективной аутофагии, который может связываться с KEAP1 и тем самым ослаблять разрушение NRF2. NRF2 в свою очередь усиливает транскрипцию гена SQSTM1, кодирующего p62. Так замыкается положительная обратная связь.</p><ol class="mech"><li>NRF2 вместе с малым Maf связывается с ARE в промоторе SQSTM1 и усиливает синтез p62.</li><li>p62 связывается с доменом Kelch белка KEAP1 мотивом KIR и мешает связыванию NRF2; комплексы p62–KEAP1 удаляются аутофагией.</li><li>Оба действия поддерживают исходное изменение — накопление NRF2, поэтому петля положительная, хотя в ней есть звено торможения.</li></ol><p>p62 знаком по семинару 7: этот белок связывает убиквитинированные грузы и белок LC3 мембраны аутофагосомы и вместе с грузом удаляется аутофагией. Кроме того, p62 содержит мотив KIR, сходный с мотивом ETGE белка NRF2. Через этот мотив p62 связывается с доменом Kelch белка KEAP1 — тем же доменом, с которым связывается NRF2. Поэтому при большом количестве p62 часть KEAP1 оказывается занята и не направляет NRF2 на разрушение. Кроме того, комплексы p62–KEAP1 удаляются аутофагией; по данным обзоров, именно аутофагия, а не протеасома — основной путь разрушения KEAP1.</p><p>Ген SQSTM1 содержит ARE, с которым связывается NRF2 в комплексе с малым Maf. Значит, NRF2 усиливает синтез p62, а p62 ослабляет KEAP1-зависимое разрушение NRF2. Чтобы определить знак петли, нужно проследить действие на исходный узел: рост NRF2 → больше p62 → меньше свободного KEAP1 → медленнее разрушение NRF2 → ещё больше NRF2. Звено торможения в цепи есть, но оно подавляет разрушение NRF2, поэтому итоговое действие на NRF2 положительное.</p><p>Повышенное содержание p62 не всегда означает усиленный синтез. При нарушении аутофагии p62 перестаёт удаляться и накапливается; в печени мышей с выключенным геном Atg7 это сопровождалось стабилизацией Nrf2 и усилением транскрипции его генов-мишеней. Чтобы различить синтез и удаление, используют прослеживание меченой популяции белка во времени, а необходимость p62 проверяют выключением гена и восстановлением его функции.</p><p>Эта петля — не единственное объяснение накопления NRF2. NRF2 разрушается и без KEAP1: киназа GSK3 фосфорилирует участок домена Neh6, и лигаза с β-TrCP убиквитинирует NRF2. При сравнении генотипов нужно указывать, какие пути разрушения в них сохранены.</p><div class="note trap"><strong>Типичная ошибка</strong> Высокое содержание p62 всегда означает, что NRF2 усилил транскрипцию гена SQSTM1.<p class="trap-fix">p62 накапливается и при нарушенной аутофагии, когда он перестаёт удаляться. Синтез и удаление различают прослеживанием меченой популяции белка во времени.</p></div><div class="static-quiz"><h3>В условной системе увеличение p62 уменьшает KEAP1-зависимое разрушение NRF2, а NRF2 усиливает экспрессию SQSTM1. Какой тип связи образуют эти события?</h3><ol><li><b>А.</b> Положительную обратную связь, способную усиливать накопление NRF2. <i>(верный вариант)</i><br><span class="expl">Усиление NRF2 повышает количество фактора, который ослабляет его разрушение; оба действия поддерживают исходное изменение.</span></li><li><b>Б.</b> Отрицательную обратную связь, поскольку в схеме есть этап торможения. <i>(неверный вариант)</i><br><span class="expl">Тип петли определяют по суммарному действию на исходный узел, а не по наличию отдельного тормозящего взаимодействия.</span></li><li><b>В.</b> Только однонаправленный ответ: выход NRF2 не влияет на предшествующий регулятор. <i>(неверный вариант)</i><br><span class="expl">Через индукцию SQSTM1 выход возвращается к регуляции KEAP1, поэтому петля замыкается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1038/ncb2021">Komatsu M. et al. The selective autophagy substrate p62 activates the stress responsive transcription factor Nrf2 through inactivation of Keap1. Nat Cell Biol. 2010;12:213–23.</a></li><li><a href="https://doi.org/10.1074/jbc.M110.118976">Jain A. et al. p62/SQSTM1 is a target gene for transcription factor NRF2 and creates a positive feedback loop by inducing antioxidant response element-driven gene transcription. J Biol Chem. 2010;285:22576–22591.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li></ul><p>Схема механизма, качественные состояния; шкалы условные. Ген SQSTM1 как мишень NRF2 и связывание p62 с Kelch через мотив KIR — Jain 2010 (клетки человека и мыши в культуре, по аннотации); конкуренция p62 с NRF2 и стабилизация Nrf2 при нарушении аутофагии — Komatsu 2010 (печень мышей с выключенным Atg7, клетки в культуре; по аннотации). Аутофагия как основной путь разрушения KEAP1 и петля KEAP1 ⊣ NRF2 → p62 ⊣ KEAP1 — обзор Liu 2022 (клетки Hepa-1c1c7 и HepG2 в цитируемых экспериментах). Путь GSK3–β-TrCP — обзор Ulasov 2022. Схемы методов — принцип, а не результаты эксперимента.</p></details></article><article class="card print-unit" id="ns-nrf2-context"><div class="eyebrow">KEAP1–NRF2 · шаг 20 из 30</div><h2>Почему кратковременная защита и постоянная активность NRF2 имеют разные последствия</h2><p class="lead">Кратковременный ответ NRF2 на электрофил и постоянная активность NRF2 при нарушенном KEAP1 различаются прежде всего длительностью и зависимостью от внешнего стимула. Поэтому одна и та же защитная программа может способствовать адаптации нормальной клетки и поддерживать выживание опухолевой.</p><ol class="mech"><li>В нормальной клетке электрофил временно ослабляет KEAP1-зависимое разрушение NRF2; после удаления электрофила разрушение восстанавливается, и программа ослабевает.</li><li>Мутации и утрата гена KEAP1 в опухолевых клетках ослабляют разрушение NRF2 постоянно, и NRF2-зависимая транскрипция сохраняется без внешнего стимула.</li><li>Биологическое значение постоянной активности зависит от типа клетки и этапа процесса; его нельзя свести к оценке «полезно» или «вредно».</li></ol><p>В нормальной клетке ответ NRF2 ограничен во времени. Электрофил модифицирует KEAP1, разрушение NRF2 замедляется, и транскрипция генов-мишеней усиливается. Ферменты-мишени ускоряют обезвреживание электрофила; когда воздействие заканчивается, вновь синтезированный KEAP1 и разрушение модифицированного KEAP1 восстанавливают исходное разрушение NRF2. Так программа включается на время действия стимула и затем ослабевает.</p><p>В опухолевых клетках регуляция может быть нарушена постоянно. Singh и соавт. (2006) секвенировали ген KEAP1 в 12 линиях клеток и 54 образцах немелкоклеточного рака лёгкого. Соматические мутации нашли в шести линиях и в десяти опухолях; все они затрагивали домен Kelch или промежуточную область, а утрата второго аллеля была частой. В клетках со сниженной активностью KEAP1 NRF2 накапливался в ядре, и транскрипция генов антиоксидантной защиты, обезвреживания чужеродных веществ и выведения лекарств усиливалась. В такой клетке программа работает и без внешнего стимула.</p><p>Отсюда следует, что одна и та же программа имеет разные последствия в разных условиях. Кратковременный ответ облегчает адаптацию к электрофилам и окислителям. Постоянная активность в опухолевой клетке может поддерживать её выживание; авторы связывают её с устойчивостью к химиотерапевтическим веществам. Это наблюдение о молекулярном механизме, а не прогноз для больного и не основание для выбора лечения.</p><p>Похожие решения встречаются у далёких организмов. У кишечной палочки транскрипционный фактор OxyR активируется при образовании дисульфидной связи между его цистеинами под действием пероксида водорода и усиливает транскрипцию генов антиоксидантной защиты. Это функциональная аналогия с KEAP1–NRF2 — регуляция через тиоловые группы цистеинов, — а не доказательство общего происхождения этих систем: молекулярные участники и механизмы у них разные.</p><div class="note trap"><strong>Типичная ошибка</strong> Активация NRF2 всегда защищает организм, поэтому чем её больше и дольше, тем лучше.<p class="trap-fix">Последствия зависят от клетки и длительности. Кратковременный ответ помогает адаптации, а постоянная активность при нарушенном KEAP1 может поддерживать выживание опухолевых клеток.</p></div><div class="static-quiz"><h3>Какое различие важно при сравнении ответа нормальной клетки на краткий электрофильный стимул и опухолевой клетки с устойчиво нарушенной функцией KEAP1?</h3><ol><li><b>А.</b> В обеих клетках NRF2-зависимая программа прекращается вскоре после удаления электрофила. <i>(неверный вариант)</i><br><span class="expl">Стойкий дефект регулятора может поддерживать программу и после удаления внешнего воздействия.</span></li><li><b>Б.</b> Устойчивая активация NRF2 подавляет рост опухолевой клетки, как и краткий защитный ответ. <i>(неверный вариант)</i><br><span class="expl">Защитная программа может поддерживать выживание опухолевой клетки; результат нельзя переносить с одних клеток на другие без проверки.</span></li><li><b>В.</b> Во втором случае NRF2-зависимая программа может сохраняться без внешнего стимула. <i>(верный вариант)</i><br><span class="expl">Постоянное нарушение контроля отличается от ограниченного во времени действия индуктора.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1371/journal.pmed.0030420">Singh A. et al. Dysfunctional KEAP1-NRF2 interaction in non-small-cell lung cancer. PLoS Med. 2006;3:e420.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li><li><a href="https://doi.org/10.1126/science.279.5357.1718">Zheng M., Åslund F., Storz G. Activation of the OxyR transcription factor by reversible disulfide bond formation. Science. 1998;279:1718–1721.</a></li></ul><p>Временные кривые — качественная учебная схема, а не данные эксперимента. Singh 2006: 12 линий клеток и 54 образца немелкоклеточного рака лёгкого человека; соматические мутации KEAP1 — в 6 линиях и 10 опухолях, утрата гетерозиготности 19p13.2 — в 61 % линий и 41 % опухолей (по аннотации). Связь с устойчивостью к химиотерапии — интерпретация авторов. OxyR — Escherichia coli, активация образованием дисульфидной связи под действием H₂O₂ (Zheng 1998, по аннотации).</p></details></article><article class="card print-unit" id="ns-nrf2-measure"><div class="eyebrow">KEAP1–NRF2 · шаг 21 из 30</div><h2>Как отличить накопление NRF2 от изменения его функции</h2><p class="lead">Накопление NRF2, его ядерная локализация, связывание с ARE и изменение мРНК генов-мишеней — разные величины, и каждую измеряют своим методом. Изменение одного показателя, например мРНК HMOX1, не доказывает, что оно вызвано именно NRF2.</p><ol class="mech"><li>Содержание белка NRF2 определяют иммуноблотом, а скорость его распада — прослеживанием меченой популяции во времени.</li><li>Ядерную долю определяют иммунофлуоресценцией или разделением клеточных фракций; транскрипционный эффект — ARE-репортёром и ОТ-ПЦР мРНК генов-мишеней.</li><li>Зависимость ответа от NRF2 проверяют выключением гена NFE2L2 и восстановлением его функции.</li></ol><p>Каждый метод отвечает на свой вопрос. Иммуноблот показывает количество белка NRF2 в образце к моменту взятия пробы. Если NRF2 стало больше, это может быть следствием и усиленного синтеза, и замедленного распада; различить их позволяет прослеживание меченой популяции белка во времени. Иммунофлуоресценция и фракционирование показывают, где NRF2 находится, но не то, связался ли он с ARE.</p><p>Транскрипционный эффект измеряют по-другому. ARE-репортёр показывает, может ли данный элемент усиливать экспрессию в этих клетках, а ОТ-ПЦР — содержание мРНК эндогенного гена-мишени. Содержание мРНК определяется и синтезом, и распадом РНК, поэтому его не следует называть скоростью транскрипции.</p><p>Ген HMOX1 — удобный, но неоднозначный показатель. Его транскрипцию регулирует не только NRF2: в клетках HaCaT арсенит индуцировал HMOX1 после удаления репрессора BACH1 из ядра, ещё до заметного накопления NRF2 в ядре. Поэтому рост мРНК HMOX1 сам по себе не доказывает, что изменение вызвано NRF2.</p><p>Причинную зависимость проверяют генетически. Ген NFE2L2 выключают с помощью RNAi или редактирования генома, проверяют уменьшение РНК и белка и повторяют то же воздействие. Если без NRF2 рост мРНК гена-мишени исчезает, а возвращение NRF2 восстанавливает его, вывод о зависимости надёжен для этой системы. Для каждого эксперимента нужно указывать клетки, срок, контроль загрузки или чистоты фракций и эффективность выключения гена.</p><div class="note trap"><strong>Типичная ошибка</strong> Если иммунофлуоресценция показала NRF2 в ядре, транскрипция его генов-мишеней обязательно усилена.<p class="trap-fix">Ядерная локализация — отдельная величина. Связывание NRF2 с участками ARE проверяют, например, методом ChIP. Функциональный выход регуляторной конструкции оценивают ARE-репортёром, а содержание мРНК генов-мишеней — ОТ-ПЦР.</p></div><div class="static-quiz"><h3>После воздействия повысилось содержание мРНК HMOX1. Какой вывод допускает одно это наблюдение?</h3><ol><li><b>А.</b> Это наблюдение прямо отражает количество белка NRF2 в клетках. <i>(неверный вариант)</i><br><span class="expl">Количество мРНК гена-мишени не является прямым измерением белка NRF2 и не устанавливает единственный регулятор.</span></li><li><b>Б.</b> Связь с NRF2 возможна, но её проверяют выключением и восстановлением NRF2. <i>(верный вариант)</i><br><span class="expl">Сравнение с нарушением и восстановлением регулятора позволяет проверить причинную зависимость в выбранной системе.</span></li><li><b>В.</b> Это наблюдение доказывает, что воздействие действует через ARE и NRF2. <i>(неверный вариант)</i><br><span class="expl">Экспрессия HMOX1 зависит и от других регуляторов (например, BACH1), от типа клеток и воздействия; без проверки зависимости от NRF2 такой вывод преждевременен.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-10.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1016/j.lfs.2021.120111">Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.</a></li></ul><p>Схемы методов — принцип, а не результаты эксперимента. Пример HMOX1: клетки HaCaT, арсенит, выход BACH1 из ядра через 30 мин, накопление NRF2 в ядре к 3 ч — эксперимент, описанный в обзоре Liu 2022 (первичная работа в этой подготовке не прочитана). Состав методов — план шага (M01, M03, M07, M08, M09, M12). Флуоресцентные зонды на окислители здесь не рассматриваются: для них нужна отдельная схема реакции каждого зонда.</p></details></article><article class="card print-unit" id="ns-hif"><div class="eyebrow">PHD–pVHL–HIF · шаг 22 из 30</div><h2>Почему HIF-α накапливается при недостатке кислорода</h2><p class="lead"><a href="#ns-g-S10-T49">HIF</a> — транскрипционный комплекс из регулируемой α-субъединицы и постоянно присутствующего партнёра <a href="#ns-g-S10-T51">ARNT</a>. При достаточном O₂ α-субъединица синтезируется непрерывно и так же непрерывно разрушается. При недостатке кислорода разрушение замедляется, и содержание HIF-α растёт даже тогда, когда скорость его синтеза не меняется.</p><ol class="mech"><li>Содержание белка HIF-1α определяется соотношением скоростей его синтеза и распада.</li><li>При достаточном O₂ <a href="#ns-g-S10-T52">пролилгидроксилазы PHD</a> гидроксилируют HIF-1α; гидроксилированный белок распознаётся комплексом с <a href="#ns-g-S10-T55">pVHL</a>, убиквитинируется и разрушается протеасомой.</li><li>При сниженном O₂ гидроксилирование замедляется, вновь синтезированный HIF-1α накапливается, связывается с ARNT и активирует транскрипцию генов-мишеней.</li></ol><p>HIF (фактор, индуцируемый гипоксией) — семейство гетеродимерных транскрипционных факторов. Каждый комплекс состоит из α-субъединицы и β-субъединицы ARNT, которую называют также HIF-1β. У человека лучше всего изучены <a href="#ns-g-S10-T50">HIF-1α и HIF-2α</a>, продукты генов HIF1A и EPAS1; они регулируют частично разные наборы генов. Основная схема этого раздела построена для HIF-1α человека, а различия изоформ разобраны отдельно.</p><p>Содержание любого белка складывается из двух потоков — синтеза новых молекул и удаления существующих. В клетках HeLa и Hep3B мРНК HIF1A и ARNT выявлялись постоянно и при гипоксии заметно не менялись, а белок HIF-1α в нормоксии почти не определялся (Huang 1996). Его быстрый распад задаёт центральный кислород-зависимый домен деградации: через него белок направляется в убиквитин-протеасомный путь (Huang 1998).</p><p>При достаточном O₂ PHD присоединяют гидроксильные группы к двум остаткам пролина HIF-1α. Белок <a href="#ns-g-S10-T55">pVHL</a> в составе E3-комплекса распознаёт гидроксилированный HIF-1α, комплекс присоединяет к нему убиквитин, и протеасома разрушает белок. Когда кислорода становится меньше, PHD гидроксилируют HIF-1α медленнее, вновь синтезированные молекулы чаще избегают распознавания, и белок накапливается. Он связывается с ARNT, комплекс связывается с <a href="#ns-g-S10-T60">элементами ответа на гипоксию (HRE)</a> в регуляторных областях генов-мишеней и активирует их транскрипцию.</p><p>Накопление HIF-1α не требует обязательного усиления транскрипции HIF1A. Однако синтез белка тоже регулируется: в клетках рака молочной железы MCF-7 сигнал рецептора HER2 повышал скорость синтеза HIF-1α через путь PI3K–AKT–mTOR, не меняя периода его полужизни (Laughner 2001). На схеме синтез постоянен, чтобы отделить изменение распада от изменения синтеза. «Достаточный» и «сниженный» O₂ задаются условиями конкретной культуры или ткани: 21 % O₂ в газовой фазе инкубатора не является универсальной нормой для клеток организма.</p><div class="note trap"><strong>Типичная ошибка</strong> Раз HIF-1α при достаточном O₂ почти не выявляется, ген HIF1A в этих условиях не работает.<p class="trap-fix">мРНК HIF1A присутствует и белок синтезируется, но так же быстро разрушается. Низкое содержание белка отражает быстрый распад, а не отсутствие экспрессии гена.</p></div><div class="static-quiz"><h3>Скорость синтеза HIF-1α не изменилась, но в гипоксии его pVHL-зависимое разрушение замедлилось. Что может объяснить рост содержания HIF-1α?</h3><ol><li><b>А.</b> Стабилизация белка при продолжающемся синтезе. <i>(верный вариант)</i><br><span class="expl">Для накопления белка достаточно уменьшить скорость его удаления; увеличение транскрипции не является обязательным условием.</span></li><li><b>Б.</b> Обязательное увеличение количества мРНК HIF1A. <i>(неверный вариант)</i><br><span class="expl">Условие допускает накопление за счёт распада при неизменном синтезе; дополнительное изменение мРНК не требуется.</span></li><li><b>В.</b> Усиление разрушения HIF-1α при прежнем синтезе. <i>(неверный вариант)</i><br><span class="expl">Усиление удаления действовало бы в противоположном направлении: при прежнем синтезе содержание белка уменьшалось бы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li><li><a href="https://doi.org/10.1038/20459">Maxwell PH. et al. The tumour suppressor protein VHL targets hypoxia-inducible factors for oxygen-dependent proteolysis. Nature. 1999;399:271–5.</a></li><li><a href="https://doi.org/10.1074/jbc.271.50.32253">Huang L. E., Arany Z., Livingston D. M., Bunn H. F. Activation of hypoxia-inducible transcription factor depends primarily upon redox-sensitive stabilization of its alpha subunit. J Biol Chem. 1996;271:32253–32259.</a></li><li><a href="https://doi.org/10.1073/pnas.95.14.7987">Huang L. E., Gu J., Schau M., Bunn H. F. Regulation of hypoxia-inducible factor 1α is mediated by an O₂-dependent degradation domain via the ubiquitin-proteasome pathway. Proc Natl Acad Sci USA. 1998;95:7987–7992.</a></li><li><a href="https://doi.org/10.1128/MCB.21.12.3995-4004.2001">Laughner E., Taghavi P., Chiles K., Mahon P. C., Semenza G. L. HER2 (neu) signaling increases the rate of hypoxia-inducible factor 1α (HIF-1α) synthesis: novel mechanism for HIF-1-mediated vascular endothelial growth factor expression. Mol Cell Biol. 2001;21:3995–4004.</a></li></ul><p>Схема механизма: качественные состояния при фиксированной скорости синтеза HIF-1α. Постоянство мРНК HIF1A при гипоксии показано для клеток HeLa и Hep3B (Huang 1996); регуляция синтеза HIF-1α сигналом HER2 — для клеток MCF-7 и фибробластов мыши 3T3 (Laughner 2001). Уровни O₂ на схеме условные: «нормоксия» определяется условиями конкретной культуры или ткани.</p></details></article><article class="card print-unit" id="ns-phd"><div class="eyebrow">PHD–pVHL–HIF · шаг 23 из 30</div><h2>Как PHD используют кислород при гидроксилировании HIF-α</h2><p class="lead"><a href="#ns-g-S10-T52">Пролилгидроксилазы HIF (PHD)</a> используют молекулярный кислород как субстрат: один атом O₂ входит в гидроксильную группу пролина, второй — в сукцинат. Поэтому скорость гидроксилирования HIF-α непосредственно зависит от доступности O₂, а не только от энергетического обмена клетки.</p><ol class="mech"><li>PHD — Fe(II)- и <a href="#ns-g-S10-T54">2-оксоглутарат</a>-зависимые диоксигеназы: в одной реакции они гидроксилируют остаток пролина и окислительно декарбоксилируют 2-оксоглутарат до сукцината и CO₂.</li><li>O₂ и 2-оксоглутарат расходуются в каждом обороте, Fe(II) находится в активном центре и не расходуется, аскорбат повышает активность фермента, но в уравнение реакции не входит.</li><li>В HIF-1α человека гидроксилируются Pro402 и Pro564; <a href="#ns-g-S10-T57">пролилгидроксилирование</a> создаёт участок, который распознаёт pVHL.</li></ol><p>Суммарная реакция PHD записывается так: остаток пролина в HIF-α + O₂ + 2-оксоглутарат → остаток 4-гидроксипролина + сукцинат + CO₂. Фермент относится к Fe(II)- и 2-оксоглутарат-зависимым диоксигеназам: оба атома молекулы O₂ входят в продукты. Один присоединяется к атому C4 пирролидинового кольца пролина и образует группу OH, второй входит в карбоксильную группу сукцината, который образуется при окислительном декарбоксилировании 2-оксоглутарата. Гидроксилирование Pro564 требовало O₂ и железа (Jaakkola 2001).</p><p>Участники реакции играют разную роль. O₂ и 2-оксоглутарат расходуются в каждом обороте. Ион Fe(II) находится в активном центре и не входит в продукты, но без него реакция не идёт: поэтому хелаторы железа вызывают накопление HIF-α в нормоксии. Аскорбат повышал начальную скорость и полноту гидроксилирования очищенной PHD2 (Flashman 2010); в уравнение реакции он не входит.</p><p>У человека три фермента: <a href="#ns-g-S10-T53">PHD1 (ген EGLN2), PHD2 (EGLN1) и PHD3 (EGLN3)</a>. В клетках человека подавление PHD2 с помощью малых интерферирующих РНК было достаточно, чтобы HIF-1α стабилизировался при нормоксии, а подавление PHD1 или PHD3 — нет (Berra 2003). Вклад изоформ зависит от клеток. Номера Pro402 и Pro564 относятся к HIF-1α человека; каждый из двух участков может самостоятельно направлять белок к убиквитинированию с участием pVHL (Masson 2001).</p><p>Связь с метаболизмом идёт через 2-оксоглутарат — промежуточный продукт цикла трикарбоновых кислот. Сукцинат и фумарат по строению близки к нему и тормозят PHD. В клетках с подавленной сукцинатдегидрогеназой накапливался сукцинат и стабилизировался HIF-1α (Selak 2005); в опухолевых клетках почки без фумаратгидратазы фумарат вёл себя как конкурентный ингибитор PHD (Isaacs 2005). Такое торможение возникает при накоплении этих метаболитов, а не при любом изменении работы цикла.</p><div class="note trap"><strong>Типичная ошибка</strong> Аскорбат — такой же расходуемый субстрат PHD, как O₂ и 2-оксоглутарат.<p class="trap-fix">В уравнение реакции входят остаток пролина, O₂ и 2-оксоглутарат; продукты — гидроксипролин, сукцинат и CO₂. Аскорбат повышает активность фермента, но в продукты не входит.</p></div><div class="static-quiz"><h3>Какова непосредственная роль O₂ в реакции PHD, гидроксилирующей HIF-α?</h3><ol><li><b>А.</b> O₂ является субстратом реакции гидроксилирования, которую катализирует PHD. <i>(верный вариант)</i><br><span class="expl">Зависимость реакции от доступности молекулярного кислорода связывает гидроксилирование со снабжением клетки O₂.</span></li><li><b>Б.</b> O₂ нужен клеточному дыханию и влияет на PHD через образование ATP. <i>(неверный вариант)</i><br><span class="expl">Зависимость PHD от O₂ непосредственная: кислород участвует в реакции гидроксилирования, а не только в энергетическом обмене клетки.</span></li><li><b>В.</b> O₂ нужен на стадии распознавания гидроксилированного HIF белком pVHL. <i>(неверный вариант)</i><br><span class="expl">В показанной последовательности кислород нужен на предшествующей ферментативной стадии, которая создаёт гидроксилированный субстрат.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li><li><a href="https://doi.org/10.1126/science.1059796">Jaakkola P. et al. Targeting of HIF-alpha to the von Hippel-Lindau ubiquitylation complex by O2-regulated prolyl hydroxylation. Science. 2001;292:468–72.</a></li><li><a href="https://doi.org/10.1126/science.1059817">Ivan M. et al. HIFalpha targeted for VHL-mediated destruction by proline hydroxylation: implications for O2 sensing. Science. 2001;292:464–8.</a></li><li><a href="https://doi.org/10.1042/BJ20091609">Flashman E., Davies S. L., Yeoh K. K., Schofield C. J. Investigating the dependence of the hypoxia-inducible factor hydroxylases (factor inhibiting HIF and prolyl hydroxylase domain 2) on ascorbate and other reducing agents. Biochem J. 2010;427:135–142.</a></li><li><a href="https://doi.org/10.1093/emboj/cdg392">Berra E., Benizri E., Ginouvès A., Volmat V., Roux D., Pouysségur J. HIF prolyl-hydroxylase 2 is the key oxygen sensor setting low steady-state levels of HIF-1α in normoxia. EMBO J. 2003;22:4082–4090.</a></li><li><a href="https://doi.org/10.1093/emboj/20.18.5197">Masson N., Willam C., Maxwell P. H., Pugh C. W., Ratcliffe P. J. Independent function of two destruction domains in hypoxia-inducible factor-α chains activated by prolyl hydroxylation. EMBO J. 2001;20:5197–5206.</a></li><li><a href="https://doi.org/10.1016/j.ccr.2004.11.022">Selak M. A., Armour S. M., MacKenzie E. D. et al. Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-α prolyl hydroxylase. Cancer Cell. 2005;7:77–85.</a></li><li><a href="https://doi.org/10.1016/j.ccr.2005.06.017">Isaacs J. S., Jung Y. J., Mole D. R. et al. HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability. Cancer Cell. 2005;8:143–153.</a></li></ul><p>Схема реакции; состояния качественные, без единого порога O₂ и без константы Михаэлиса для клетки. Нумерация Pro402, Pro564 — HIF-1α человека. Потребность в O₂ и железе — эксперименты Jaakkola 2001 и Ivan 2001 (HIF-1α человека, клетки и бесклеточные системы); роль PHD2 — подавление siRNA в клетках человека (Berra 2003); влияние аскорбата — очищенная PHD2 in vitro (Flashman 2010); сукцинат — клетки с подавленной SDH (Selak 2005); фумарат — клетки рака почки с утратой FH и эксперименты с ферментом (Isaacs 2005). Структурные формулы показывают остаток пролина и остаток 4-гидроксипролина в полипептидной цепи без обозначения стереохимии; 2-оксоглутарат и сукцинат показаны в виде анионов, преобладающих при pH около 7.</p></details></article><article class="card print-unit" id="ns-vhl"><div class="eyebrow">PHD–pVHL–HIF · шаг 24 из 30</div><h2>Что распознаёт pVHL и почему его потеря стабилизирует HIF-α</h2><p class="lead"><a href="#ns-g-S10-T55">pVHL</a> не гидроксилирует HIF-α, а распознаёт уже гидроксилированный белок. Он входит в <a href="#ns-g-S10-T56">E3-комплекс</a> с элонгинами B и C, CUL2 и RBX1, который присоединяет к HIF-α убиквитин. Поэтому без pVHL гидроксилирование может продолжаться, а быстрое разрушение HIF-α нарушается.</p><ol class="mech"><li>PHD создают модификацию — гидроксилированные остатки пролина в HIF-α; pVHL связывает именно модифицированный участок.</li><li>В составе комплекса pVHL–элонгины B/C–CUL2–RBX1 это связывание ведёт к <a href="#ns-g-S10-T38">убиквитинированию</a> HIF-α и его <a href="#ns-g-S10-T39">протеасомной деградации</a>.</li><li>При отсутствии pVHL гидроксилирование сохраняется, но HIF-α не подвергается быстрому распаду и накапливается при любом содержании O₂.</li></ol><p>В кислород-зависимом распаде HIF-α участвуют два разных звена. Первое — реакция: PHD присоединяют гидроксильную группу к остаткам пролина. Второе — распознавание: белок pVHL, продукт гена-супрессора опухолей VHL, связывает участок HIF-α, содержащий гидроксипролин. Короткий пептид HIF связывался с pVHL только тогда, когда центральный остаток пролина был гидроксилирован (Ivan 2001; Jaakkola 2001).</p><p>Сам pVHL не присоединяет убиквитин. Он входит в E3-комплекс вместе с элонгинами B и C, куллином CUL2 и белком RBX1. pVHL связывает субстрат, элонгины соединяют его с CUL2, а RBX1 привлекает фермент, который несёт активированный убиквитин. Полиубиквитинированный HIF-α разрушается протеасомой.</p><p>Значение pVHL показали генетическим сравнением. В клеточных линиях рака почки с дефектом VHL субъединицы HIF-α были стабильны при любом содержании O₂, а после введения функционального гена VHL кислород-зависимая нестабильность восстанавливалась (Maxwell 1999). В клетках RCC4 без pVHL HIF-1α при нормоксии гидроксилирован по Pro402 и Pro564 почти полностью (Tian 2011): реакция PHD идёт, а отсутствует следующий этап. Медленный распад HIF-α по путям, не зависящим от pVHL, при этом возможен, поэтому корректнее говорить о нарушении быстрого кислород-зависимого распада, а не о полной неразрушимости белка.</p><p>Архитектура комплекса напоминает систему KEAP1–CUL3 из предыдущего раздела: белок, связывающий субстрат, соединён с куллином и RBX1. Различается то, что распознаётся. pVHL связывает HIF-α после модификации, которая зависит от O₂; KEAP1 связывает NRF2 без такой модификации, а электрофилы изменяют работу самого KEAP1.</p><div class="note trap"><strong>Типичная ошибка</strong> pVHL — это фермент, который сам разрушает HIF-α.<p class="trap-fix">pVHL связывает гидроксилированный HIF-α в составе E3-комплекса; присоединение убиквитина обеспечивает весь комплекс с CUL2 и RBX1, а разрушает белок протеасома.</p></div><div class="static-quiz"><h3>В клетке отсутствует pVHL, но PHD активны и кислорода достаточно. Какое сочетание возможно?</h3><ol><li><b>А.</b> HIF-α не гидроксилируется, потому что именно pVHL катализирует эту реакцию. <i>(неверный вариант)</i><br><span class="expl">Гидроксилирование катализируют PHD; pVHL участвует в распознавании продукта реакции.</span></li><li><b>Б.</b> HIF-α разрушается через pVHL с прежней скоростью, поскольку PHD сохранены. <i>(неверный вариант)</i><br><span class="expl">Сохранение предшествующей реакции не восстанавливает отсутствующий компонент следующего этапа.</span></li><li><b>В.</b> Гидроксилирование HIF-α сохраняется, но его быстрое pVHL-зависимое разрушение нарушено. <i>(верный вариант)</i><br><span class="expl">Модификация и её распознавание относятся к разным звеньям; нарушение второго не требует исчезновения первого.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/20459">Maxwell PH. et al. The tumour suppressor protein VHL targets hypoxia-inducible factors for oxygen-dependent proteolysis. Nature. 1999;399:271–5.</a></li><li><a href="https://doi.org/10.1126/science.1059796">Jaakkola P. et al. Targeting of HIF-alpha to the von Hippel-Lindau ubiquitylation complex by O2-regulated prolyl hydroxylation. Science. 2001;292:468–72.</a></li><li><a href="https://doi.org/10.1126/science.1059817">Ivan M. et al. HIFalpha targeted for VHL-mediated destruction by proline hydroxylation: implications for O2 sensing. Science. 2001;292:464–8.</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/21335549/">Tian YM. et al. Differential sensitivity of hypoxia inducible factor hydroxylation sites to hypoxia and hydroxylase inhibitors. J Biol Chem. 2011;286:13041–51.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li></ul><p>Схема механизма; состояния качественные. Распознавание гидроксилированного пептида — эксперименты с HIF-1α человека и очищенными компонентами (Ivan 2001; Jaakkola 2001); стабилизация HIF-α и её устранение после введения VHL — клеточные линии рака почки человека с дефектом VHL (Maxwell 1999); почти полное гидроксилирование Pro402, Pro564 и Asn803 при нормоксии — клетки RCC4 без pVHL, антитела к гидроксилированным остаткам и масс-спектрометрия (Tian 2011). Сравнение с KEAP1–CUL3 касается устройства комплекса, а не происхождения белков.</p></details></article><article class="card print-unit" id="ns-fih"><div class="eyebrow">PHD–pVHL–HIF · шаг 25 из 30</div><h2>Почему содержание HIF-α и его транскрипционная активность различаются</h2><p class="lead">Накопление HIF-α ещё не означает его полной транскрипционной активности. Вторая гидроксилаза, <a href="#ns-g-S10-T58">FIH</a>, модифицирует остаток аспарагина в домене активации и тем самым мешает связыванию <a href="#ns-g-S10-T59">коактиваторов p300/CBP</a>. Пролилгидроксилирование регулирует содержание HIF-α, а гидроксилирование аспарагина — его взаимодействие с коактиваторами.</p><ol class="mech"><li>FIH — Fe(II)- и 2-оксоглутарат-зависимая гидроксилаза; в HIF-1α человека она гидроксилирует Asn803 C-концевого домена активации.</li><li>Группа OH при Asn803 препятствует связыванию этого домена с p300/CBP; на распознавание pVHL она не влияет.</li><li><a href="#ns-g-S10-T64">Содержание HIF-α и его транскрипционная активность</a> регулируются разными модификациями и могут меняться неодинаково.</li></ol><p>HIF-α модифицируется в двух разных областях. Остатки Pro402 и Pro564 HIF-1α человека находятся в кислород-зависимом домене деградации; их гидроксилируют PHD, и от этого зависит распознавание pVHL и распад. Остаток Asn803 находится в C-концевом домене активации транскрипции; его гидроксилирует FIH (фактор, подавляющий HIF). FIH, как и PHD, относится к Fe(II)- и 2-оксоглутарат-зависимым диоксигеназам и использует O₂ как субстрат.</p><p>C-концевой домен активации стимулирует транскрипцию, связывая коактиваторы p300 и CBP. Гидроксилированный Asn803 такому связыванию препятствует. Ингибиторы Fe(II)- и 2-оксоглутарат-зависимых диоксигеназ предотвращали гидроксилирование этого аспарагина и позволяли домену связывать p300, а замена аспарагина на аланин давала постоянное связывание p300 и высокую транскрипционную активность (Lando 2002). В клетке с функциональным pVHL ограничение пролилгидроксилирования стабилизирует HIF-α, а уменьшение гидроксилирования Asn803 дополнительно облегчает связывание p300/CBP. Это разные этапы регуляции.</p><p>Поэтому накопившийся HIF-1α может иметь разную удельную активность. В экспериментах Tian 2011 при 1 % O₂ (5 ч) HIF-1α накапливался в клетках разных типов, но остаток Asn803 у значительной части молекул оставался гидроксилированным: в фибробластах кожи человека — более чем на 90 %, в клетках рака предстательной железы PC3 — примерно на 50 %. При 0,2 % O₂ гидроксилирование Asn803 было сильно подавлено. Чувствительность двух реакций к недостатку O₂ различается и зависит от клеток, поэтому единой ступенчатой «шкалы» O₂ для всех тканей нет.</p><p>Отсутствие связывания p300/CBP C-концевым доменом не означает отсутствия любых эффектов HIF: у HIF-α есть и другой, N-концевой домен активации, а набор генов, чувствительных к FIH, ограничен. Для объяснения важно другое: равное содержание HIF-1α ещё не означает равной транскрипционной активности.</p><div class="note trap"><strong>Типичная ошибка</strong> Если HIF-1α много, гены-мишени HIF работают в полную силу: содержание белка и его активность — одно и то же.<p class="trap-fix">Содержание HIF-1α определяется пролилгидроксилированием и распадом, а связывание коактиваторов — гидроксилированием Asn803. При одинаковом содержании белка его транскрипционная активность может различаться.</p></div><div class="static-quiz"><h3>Содержание HIF-1α одинаково в двух условных состояниях. В одном Asn803 гидроксилирован, в другом нет. Какое различие непосредственно относится к действию FIH?</h3><ol><li><b>А.</b> pVHL распознаёт Asn803-OH вместо гидроксилированных пролинов. <i>(неверный вариант)</i><br><span class="expl">Для pVHL-зависимого пути важны пролиновые модификации; подмена остатка смешивает разные уровни регуляции.</span></li><li><b>Б.</b> Связывание p300/CBP C-концевым доменом затруднено в состоянии с Asn803-OH. <i>(верный вариант)</i><br><span class="expl">Именно взаимодействие домена активации с коактиваторами является непосредственным выходом этой модификации.</span></li><li><b>В.</b> Asn803-OH усиливает распад белка тем же способом, что Pro402-OH и Pro564-OH. <i>(неверный вариант)</i><br><span class="expl">Asn- и Pro-гидроксилирование имеют разные непосредственные последствия; эффект FIH относится к взаимодействию с коактиватором.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1068592">Lando D. et al. Asparagine hydroxylation of the HIF transactivation domain a hypoxic switch. Science. 2002;295:858–61.</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/21335549/">Tian YM. et al. Differential sensitivity of hypoxia inducible factor hydroxylation sites to hypoxia and hydroxylase inhibitors. J Biol Chem. 2011;286:13041–51.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li></ul><p>Схема механизма; нумерация Asn803 — HIF-1α человека. Связывание p300 и мутация Asn → Ala — Lando 2002 (клеточные линии, конструкции HIF-1α и HIF-2α). Доли Asn803-OH при 1 % O₂ (5 ч): фибробласты кожи человека — более 90 %, клетки PC3 — около 50 %; подавление при 0,2 % O₂; избирательный ингибитор FIH (соединение E) в клетках RCC4 с восстановленным pVHL, 5 ч, гипоксия 1 % O₂ последние 2 ч (Tian 2011, иммуноблот с антителами к гидроксилированным остаткам, калибровка масс-спектрометрией). Состояния схемы качественные.</p></details></article><article class="card print-unit" id="ns-hif-time"><div class="eyebrow">PHD–pVHL–HIF · шаг 26 из 30</div><h2>Как изменяется ответ HIF при гипоксии и реоксигенации</h2><p class="lead">При переходе к <a href="#ns-g-S10-T61">гипоксии</a> доля молекул HIF-α с гидроксилированным пролином может снижаться за счёт обновления пула: новые молекулы поступают без этой модификации, а ранее гидроксилированные разрушаются. При реоксигенации PHD гидроксилируют накопившиеся молекулы HIF-α. Поэтому снижение доли гидроксилированного HIF-α не требует реакции, которая удаляла бы группу OH.</p><ol class="mech"><li>При снижении доступности O₂ замедляется образование новых гидроксилированных молекул HIF-α, а уже гидроксилированные продолжают разрушаться.</li><li>После восстановления O₂ гидроксилирование имеющихся молекул возобновляется, и HIF-α быстро исчезает через pVHL-зависимый распад.</li><li>мРНК и белки генов-мишеней, синтезированные при гипоксии, исчезают со своими скоростями; HIF индуцирует и PHD2, PHD3, что ускоряет распад HIF-α после реоксигенации.</li></ol><p>Пролилгидроксилирование HIF-α считают практически необратимым: фермента, который снимал бы группу OH с остатка пролина HIF, не описано. Молекула, получившая Pro-OH, остаётся гидроксилированной до своего распада. Поэтому важно различать две величины: химическое состояние отдельной молекулы и <a href="#ns-g-S10-T64">долю модифицированных молекул</a> в пуле, который постоянно обновляется за счёт синтеза и распада.</p><p>При переходе к гипоксии PHD гидроксилируют новые молекулы медленнее. Уже гидроксилированные молекулы продолжают распознаваться pVHL и разрушаться, а новые чаще остаются без Pro-OH. Доля гидроксилированного HIF-α падает, содержание белка растёт, и через какое-то время пул почти целиком состоит из молекул, синтезированных при гипоксии. Asn803 в части этих молекул может оставаться гидроксилированным: при умеренной гипоксии FIH сохраняет активность дольше, чем PHD (Tian 2011).</p><p>При восстановлении O₂ гидроксилирование возобновляется на уже накопленных молекулах. В клетках RCC4 после 4 ч при 0,1 % O₂ гидроксилирование Pro564 и Asn803 завершалось в течение 1 мин после возврата к 21 % O₂, а Pro402 гидроксилировался с задержкой (Tian 2011). В клетках HeLa и Hep3B HIF-1α после резкого повышения O₂ быстро исчезал (Huang 1996). Распаду помогает обратная связь: HIF индуцирует гены PHD2 и PHD3 (Berra 2003), и после гипоксии этих ферментов в клетке больше, чем до неё.</p><p>Белок HIF-1α исчезает быстрее, чем следствия его действия. мРНК генов-мишеней и синтезированные при гипоксии белки разрушаются со своими скоростями, поэтому транскрипционный ответ затухает постепенно. Конкретные минуты и часы зависят от клеток, глубины гипоксии и способа подачи газа к клеткам, поэтому на схеме показан только порядок событий.</p><div class="note trap"><strong>Типичная ошибка</strong> После восстановления O₂ гипоксический ответ исчезает мгновенно, потому что быстро исчезает HIF-1α.<p class="trap-fix">Белок HIF-1α действительно разрушается быстро, но мРНК и белки генов-мишеней, синтезированные при гипоксии, исчезают со своими скоростями, поэтому ответ затухает постепенно.</p></div><div class="static-quiz"><h3>При переходе к гипоксии доля гидроксилированного HIF-α в обновляющемся пуле уменьшилась. Требует ли это предположения, что с каждой ранее модифицированной молекулы удалили гидроксильную группу?</h3><ol><li><b>А.</b> Нет: новые молекулы могут поступать без модификации, а ранее модифицированные — разрушаться. <i>(верный вариант)</i><br><span class="expl">Обновление молекул меняет состав пула без необходимости вводить обратную реакцию гидроксилирования.</span></li><li><b>Б.</b> Да: уменьшение доли всегда означает обратную химическую реакцию на тех же молекулах. <i>(неверный вариант)</i><br><span class="expl">Доля может измениться при обновлении пула, даже если модификация каждой отдельной молекулы сохраняется.</span></li><li><b>В.</b> Да: иначе снижение доступности O₂ не могло бы повлиять на последующие реакции. <i>(неверный вариант)</i><br><span class="expl">Недостаток субстрата влияет на образование новых модифицированных молекул, не требуя удаления уже имеющихся групп.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pubmed.ncbi.nlm.nih.gov/21335549/">Tian YM. et al. Differential sensitivity of hypoxia inducible factor hydroxylation sites to hypoxia and hydroxylase inhibitors. J Biol Chem. 2011;286:13041–51.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li><li><a href="https://doi.org/10.1074/jbc.271.50.32253">Huang L. E., Arany Z., Livingston D. M., Bunn H. F. Activation of hypoxia-inducible transcription factor depends primarily upon redox-sensitive stabilization of its alpha subunit. J Biol Chem. 1996;271:32253–32259.</a></li><li><a href="https://doi.org/10.1093/emboj/cdg392">Berra E., Benizri E., Ginouvès A., Volmat V., Roux D., Pouysségur J. HIF prolyl-hydroxylase 2 is the key oxygen sensor setting low steady-state levels of HIF-1α in normoxia. EMBO J. 2003;22:4082–4090.</a></li></ul><p>Учебная схема без числовой кинетики: число значков не равно числу молекул. Реоксигенация: клетки RCC4 без pVHL, 4 ч при 0,1 % O₂ в чашках с газопроницаемым дном, затем 21 % O₂, иммуноблот с антителами к Hyp402, Hyp564 и Asn803-OH (Tian 2011). Быстрое исчезновение HIF-1α после повышения O₂ — клетки HeLa и Hep3B (Huang 1996). Индукция PHD2 при гипоксии — клетки человека (Berra 2003); индукция PHD2 и PHD3 — клетки HeLa и HT1080 (Tian 2011). Необратимость пролилгидроксилирования принята как допущение схемы: обратной реакции в использованных работах не описано.</p></details></article><article class="card print-unit" id="ns-hif-context"><div class="eyebrow">PHD–pVHL–HIF · шаг 27 из 30</div><h2>Как программы HIF зависят от изоформы и ткани</h2><p class="lead">HIF-1 и HIF-2 регулируют частично общие, а частично разные наборы генов, и результат зависит от ткани. HIF-1 связан прежде всего с переходом на гликолиз, а физиологическая регуляция эритропоэтина — преимущественно с HIF-2.</p><ol class="mech"><li>HIF-1 повышает экспрессию генов транспорта глюкозы и гликолиза (SLC2A1, LDHA) и гена <a href="#ns-g-S10-T63">киназы пируватдегидрогеназы PDK1</a>.</li><li>Регуляция эритропоэтина (EPO) у мышей зависит преимущественно от HIF-2 и связана с клетками почки и печени.</li><li>При потере pVHL HIF-α стабилен без снижения O₂ — это <a href="#ns-g-S10-T62">псевдогипоксический ответ</a>, и его мишени зависят от того, какая изоформа преобладает.</li></ol><p>Обе изоформы, HIF-1α и HIF-2α, образуют комплекс с ARNT и связываются с HRE, но наборы активируемых генов совпадают лишь частично. Для HIF-1 хорошо изучена метаболическая программа: он связывается с HRE в промоторах генов ферментов гликолиза, в том числе LDHA (Semenza 1996), повышает экспрессию транспортёра глюкозы GLUT1 (ген SLC2A1) и гена VEGFA — фактора роста эндотелия сосудов (Forsythe 1996).</p><p>К этой программе относится и киназа пируватдегидрогеназы 1 (PDK1). Её не следует путать с PDPK1, которую в литературе о пути PI3K–AKT тоже сокращают как PDK1. PDK1 фосфорилирует и подавляет пируватдегидрогеназу, поэтому пируват реже превращается в ацетил-CoA и меньше окисляется в митохондриях; в фибробластах без HIF-1α принудительная экспрессия PDK1 повышала содержание ATP и выживаемость при гипоксии (Kim 2006). Так связаны темы семинаров 8 и 10.</p><p>Эритропоэтин удобно приводить как пример тканевой специфичности. У взрослых мышей почка — основной источник эритропоэтина; гипоксическая индукция Epo в почке полностью зависела от Hif-2, а при удалении Hif-2 в почке основным регулятором становился Hif-2 печени (Kapitsinou 2010). Поэтому EPO нельзя считать универсальной мишенью HIF-1 в любой клетке.</p><p>Псевдогипоксический ответ возникает, когда часть гипоксической регуляции включается без снижения O₂, например при потере pVHL или при накоплении сукцината и фумарата. Это не синоним эффекта Варбурга. В клетках рака почки с дефектом VHL изоформы различались по мишеням: VEGFA, который в других клетках индуцирует и HIF-1 (Forsythe 1996), здесь отвечал преимущественно на HIF-2α (Raval 2005). Система HIF консервативна от нематоды Caenorhabditis elegans до позвоночных (Berra 2003); сходство функции у разных животных само по себе не говорит о времени её возникновения.</p><div class="note trap"><strong>Типичная ошибка</strong> PDK1 в программе HIF-1 — та же киназа, которая фосфорилирует AKT в пути PI3K.<p class="trap-fix">Мишень HIF-1 — киназа пируватдегидрогеназы 1, которая подавляет пируватдегидрогеназный комплекс. Киназу пути PI3K–AKT называют PDPK1; одинаковое сокращение не означает одного белка.</p></div><div class="static-quiz"><h3>Как корректно включить EPO в объяснение семейства HIF?</h3><ol><li><b>А.</b> Связать регуляцию EPO в организме преимущественно с HIF-2 и указать ткани. <i>(верный вариант)</i><br><span class="expl">Так сохраняется роль семейства HIF и различаются его изоформы и условия действия.</span></li><li><b>Б.</b> Описать EPO как прямую мишень HIF-1, общую для клеток разных тканей. <i>(неверный вариант)</i><br><span class="expl">Так теряются различия изоформ и тканей; этот вывод шире приведённых оснований.</span></li><li><b>В.</b> Исключить EPO, поскольку его синтез регулируется без участия HIF. <i>(неверный вариант)</i><br><span class="expl">HIF-зависимая регуляция EPO установлена; ограничение касается конкретной изоформы и типа клеток.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li><li><a href="https://doi.org/10.1182/blood-2010-02-270322">Kapitsinou PP. et al. Hepatic HIF-2 regulates erythropoietic responses to hypoxia in renal anemia. Blood. 2010;116:3039–48.</a></li><li><a href="https://doi.org/10.1074/jbc.271.51.32529">Semenza G. L., Jiang B. H., Leung S. W. et al. Hypoxia response elements in the aldolase A, enolase 1, and lactate dehydrogenase A gene promoters contain essential binding sites for hypoxia-inducible factor 1. J Biol Chem. 1996;271:32529–32537.</a></li><li><a href="https://doi.org/10.1128/MCB.16.9.4604">Forsythe J. A., Jiang B. H., Iyer N. V. et al. Activation of vascular endothelial growth factor gene transcription by hypoxia-inducible factor 1. Mol Cell Biol. 1996;16:4604–4613.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2006.02.002">Kim J. W., Tchernyshyov I., Semenza G. L., Dang C. V. HIF-1-mediated expression of pyruvate dehydrogenase kinase: a metabolic switch required for cellular adaptation to hypoxia. Cell Metab. 2006;3:177–185.</a></li><li><a href="https://doi.org/10.1128/MCB.25.13.5675-5686.2005">Raval R. R., Lau K. W., Tran M. G. B. et al. Contrasting properties of hypoxia-inducible factor 1 (HIF-1) and HIF-2 in von Hippel-Lindau-associated renal cell carcinoma. Mol Cell Biol. 2005;25:5675–5686.</a></li><li><a href="https://doi.org/10.1093/emboj/cdg392">Berra E., Benizri E., Ginouvès A., Volmat V., Roux D., Pouysségur J. HIF prolyl-hydroxylase 2 is the key oxygen sensor setting low steady-state levels of HIF-1α in normoxia. EMBO J. 2003;22:4082–4090.</a></li></ul><p>Схема механизма: качественные состояния, ткани подписаны по источникам. Гены гликолиза — клетки человека, HRE промоторов ALDOA, ENO1, LDHA (Semenza 1996); VEGF — клетки Hep3B, репортёрные конструкции (Forsythe 1996); PDK1 — фибробласты мыши без HIF-1α и клетки человека (Kim 2006); EPO — мыши с удалением Hif-2α в почке или печени (Kapitsinou 2010); различия изоформ — клетки рака почки с дефектом VHL и ксенотрансплантаты (Raval 2005). Схема не описывает лечение и не предсказывает ответ конкретного пациента.</p></details></article><article class="card print-unit" id="ns-hif-measure"><div class="eyebrow">PHD–pVHL–HIF · шаг 28 из 30</div><h2>Как различить гидроксилирование, стабильность и транскрипционный эффект HIF</h2><p class="lead">Гидроксилирование HIF-α, его распознавание pVHL, стабильность белка и транскрипционный ответ — разные этапы, и для каждого нужен свой способ измерения. Ни одно измерение не заменяет остальные: одинаковое содержание HIF-1α может сочетаться с разной модификацией и разной активностью.</p><ol class="mech"><li>Антитело к общему HIF-1α и антитела к Pro564-OH или Asn803-OH определяют разные формы белка; быстрый распад уменьшает видимое количество гидроксилированной формы.</li><li>Связывание гидроксилированного пептида с pVHL и прослеживание меченого белка во времени проверяют распознавание и скорость распада отдельно от содержания белка.</li><li>Репортёр с HRE и мРНК генов-мишеней характеризуют транскрипционный ответ, а генетические и фармакологические вмешательства — необходимость отдельных звеньев.</li></ol><p>Иммуноблот с антителами к общему HIF-1α показывает, сколько белка в образце в данный момент. Антитела, распознающие только гидроксилированный Pro402, Pro564 или Asn803, позволяют увидеть соответствующую модифицированную форму; их специфичность в экспериментах Tian 2011 проверяли масс-спектрометрией и мутантными белками. Но сигнал модифицированной формы зависит не только от скорости гидроксилирования. В клетках с работающим pVHL гидроксилированный HIF-1α быстро разрушается, и полоса Pro564-OH слабая, хотя реакция идёт. Поэтому для сравнения сайтов использовали клетки RCC4 без pVHL или ингибитор протеасомы MG132.</p><p>Распознавание проверяют отдельно: очищенный pVHL связывал пептид HIF только при гидроксилированном пролине, а пептид без гидроксильной группы служил контролем (Ivan 2001; Jaakkola 2001). Скорость распада оценивают по исчезновению меченой популяции белка во времени: содержание в одной временной точке не отделяет синтез от распада.</p><p>Вещества, которые называют «миметиками гипоксии», не равнозначны гипоксии и друг другу. В клетках RCC4 DMOG сильнее подавлял гидроксилирование Asn803, хелаторы железа — пролилгидроксилирование, а ионы кобальта подавляли пролилгидроксилирование, почти не затрагивая Asn803 (Tian 2011). Генетическое сравнение дополняет фармакологию: клетки без pVHL и те же клетки с восстановленным pVHL (Maxwell 1999) отделяют гидроксилирование от быстрого распада, хотя длительная потеря pVHL меняет и другие свойства клетки.</p><p>Транскрипционный эффект измеряют по мРНК генов-мишеней или по репортёру, в котором HRE управляет синтезом белка с удобно регистрируемым сигналом. Мутантный HRE служит контролем (Forsythe 1996). Такой репортёр показывает работу выбранного элемента ДНК, но не всю программу HIF в клетке.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое вещество, повышающее содержание HIF-1α, действует так же, как недостаток O₂.<p class="trap-fix">DMOG, хелаторы железа и ионы кобальта повышают содержание HIF-1α, но по-разному меняют гидроксилирование Pro и Asn803 и затрагивают другие ферменты. Совпадение одного показателя не означает одного механизма.</p></div><div class="static-quiz"><h3>При одинаковом содержании общего HIF-1α изменился сигнал антитела к Pro564-OH. Какой вывод непосредственно относится к такому измерению?</h3><ol><li><b>А.</b> Транскрипция HRE-зависимых генов изменилась в той же пропорции, что и этот сигнал. <i>(неверный вариант)</i><br><span class="expl">Между модификацией одного остатка и ответами разных генов есть дополнительные уровни регуляции.</span></li><li><b>Б.</b> Изменился сигнал Pro564-OH-формы; транскрипционную активность HIF нужно оценить отдельно. <i>(верный вариант)</i><br><span class="expl">Антитело характеризует конкретный эпитоп, а не суммарный функциональный выход транскрипционного комплекса.</span></li><li><b>В.</b> Установлена скорость гидроксилирования без дополнительных временных измерений. <i>(неверный вариант)</i><br><span class="expl">Количество модифицированной формы в выбранный момент зависит также от синтеза и р
