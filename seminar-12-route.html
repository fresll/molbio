их канал для липидов VPS13C.</p><p>Пути отчасти независимы: контакты с ЭПР включаются параллельно ESCRT, а при подавлении ESCRT клетки хуже переживают повреждение (Radulovic 2018). Как пути согласованы между собой и что ограничивает размер ремонтируемого повреждения, неизвестно.</p><div class="note trap"><strong>Типичная ошибка</strong> ESCRT-III запечатывает разрыв изнутри лизосомы, как заплата.<p class="trap-fix">ESCRT-III собирается на цитозольной стороне мембраны. Для его действия обсуждают несколько гипотез: втягивание повреждённого участка в просвет с образованием внутрипросветных пузырьков, временную закупорку разрыва и привлечение других белков ремонта. Точный механизм изучается.</p></div><div class="static-quiz"><h3>На лизосоме с небольшим повреждением подавили сборку ESCRT-III; остальные пути ремонта сохранены. Что ожидается в первые минуты?</h3><ol><li><b>А.</b> Ремонт ослаблен, хотя пути, не зависящие от ESCRT, продолжают работать. <i>(верный вариант)</i><br><span class="expl">Верно: ESCRT-III нужен для ремонта малых повреждений, а контакты с ЭПР и перенос липидов включаются параллельно и не заменяют его полностью.</span></li><li><b>Б.</b> Ремонт не нарушен, потому что ESCRT-III нужен только для лизофагии. <i>(неверный вариант)</i><br><span class="expl">ESCRT-III собирается на лизосоме в течение минут и работает до лизофагии: сборка не зависит от аппарата лизофагии.</span></li><li><b>В.</b> Мембрана восстанавливается полностью за счёт аннексинов. <i>(неверный вариант)</i><br><span class="expl">Аннексины A1 и A2 привлекаются к повреждениям с более крупными порами, а не заменяют ESCRT-III при малом повреждении.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.15252/embj.201899753">Radulovic M., Schink K.O., Wenzel E.M. et al. ESCRT-mediated lysosome repair precedes lysophagy and promotes cell survival. EMBO J. 2018;37:e99753</a></li><li><a href="https://doi.org/10.1038/s41586-022-05164-4">Tan J.X., Finkel T. A phosphoinositide signalling pathway mediates rapid lysosomal repair. Nature. 2022;609:815–821</a></li><li><a href="https://doi.org/10.1038/s41556-026-02062-z">Radulovic M., Pust S., Kournoutis A. et al. DFCP1-containing ER microdomains mediate lysosomal membrane repair. Nat Cell Biol. 2026;28:2036–2053</a></li><li><a href="https://doi.org/10.1038/s41580-025-00909-1">Burigotto M., Carlton J.G. ESCRT-III function in membrane fission and repair. Nat Rev Mol Cell Biol. 2026;27:297–315</a></li><li><a href="https://doi.org/10.1038/s41586-025-08950-y">Hurley J.H., Coyne A.N., Miączyńska M., Stenmark H. The expanding repertoire of ESCRT functions in cell biology and disease. Nature. 2025 (опубликовано онлайн 25 июня 2025)</a></li><li><a href="https://doi.org/10.3390/membranes12060633">Olmos Y. The ESCRT machinery: remodeling, repairing, and sealing membranes. Membranes (Basel). 2022;12:633</a></li></ul><p>Схема механизма; состояния качественные. Основные данные получены на культивируемых клетках человека (HeLa и другие) при повреждении LLOMe: сборка ESCRT-III и её последствия — Radulovic 2018; PI4K2A, PI4P и перенос липидов — Tan 2022; DFCP1 и VPS13C — Radulovic 2026; аннексины и сроки сборки ESCRT-III — обзор Meyer &amp; Kravic 2024. Механизм действия ESCRT-III обсуждается (Burigotto 2026; Hurley 2025); топология ESCRT-III-разделения мембран — по обзору Olmos 2022. Размер повреждения на схеме — качественное различие.</p></details></article><article class="card print-unit" id="ns-lysophagy"><div class="eyebrow">Повреждение лизосомы · шаг 16 из 26</div><h2>Как удаляют лизосому, которую не удалось починить</h2><p class="lead">Если ремонт не удался или повреждение слишком велико, лизосому разрушают целиком: этот процесс — <a href="#ns-g-S12-T40">лизофагия</a>, разновидность селективной макроаутофагии. Он занимает часы и опирается на убиквитиновую метку на поверхности органеллы.</p><ol class="mech"><li>Убиквитин-лигазы метят повреждённую лизосому цепями убиквитина — сначала K63, позже K48; <a href="#ns-g-S12-T42">VCP/p97</a> извлекает часть меченых белков.</li><li>Рецепторы (<a href="#ns-g-S12-T41">TAX1BP1</a> с доминирующей ролью; на лизосомах найдены также p62, OPTN и NDP52) связывают убиквитин и белки ATG8; TBK1 усиливает это связывание.</li><li>Рецепторы привлекают ULK1–FIP200, фагофор охватывает лизосому, и аутофагосома сливается с неповреждённой лизосомой.</li></ol><p>Если ремонт не удался, проницаемая лизосома остаётся источником протонов и ферментов. Убиквитин на ней служит сигналом для удаления: рецепторы аутофагии узнают именно его, а блокада убиквитинирования подавляет лизофагию.</p><p>Метка ставится двумя волнами: сначала преобладают цепи K63, которые рецепторы аутофагии, как правило, связывают лучше цепей K48, позже появляются цепи K48, и подключается VCP/p97. Связь с ремонтом описана для белка спартина: он узнаёт IST1 из ESCRT-III и участки разупорядоченных липидов и привлекает лигазу ITCH, ставящую цепи K63 (Hurley 2025). Лигаза, начинающая процесс в целом, и сигнал, который её запускает, не установлены (Meyer &amp; Kravic 2024), поэтому не известно, что именно отличает лизосому для удаления от лизосомы для ремонта.</p><p>В систематическом нокауте рецепторов доминирующая роль принадлежит TAX1BP1: вместе с TBK1 он необходим для лизофагического потока в клетках HeLa и в индуцированных нейронах, тогда как при отсутствии OPTN или NDP52 поток в HeLa сохраняется. Более ранние работы показывали снижение лизофагии и при истощении p62. TAX1BP1 связывает TBK1 и FIP200 через домен SKICH. ULK1-комплекс запускает фагофор, который строится вплотную к метке на лизосоме.</p><p>CASM — не лизофагия: ATG8 присоединяются к самой мембране повреждённой лизосомы без фагофора. Распознавание гликанов особенно важно при повреждении, которое вызывают бактерии, разрывающие мембрану. Результаты получены при остром повреждении в культивируемых клетках; вклад рецепторов в других клетках и при хроническом повреждении может отличаться.</p><div class="note trap"><strong>Типичная ошибка</strong> CASM упаковывает повреждённую лизосому в аутофагосому.<p class="trap-fix">При CASM белки ATG8 присоединяются к мембране самой лизосомы — через V-ATPase и ATG16L1 или через TECPR1 — без образования фагофора вокруг неё; следствия — микроаутофагия места повреждения, активация TFEB и образование трубчатых выпячиваний. Фагофор вокруг лизосомы строит ULK1–FIP200 по убиквитиновой метке, и это лизофагия.</p></div><div class="static-quiz"><h3>Ремонт лизосомы не удался; в клетках нет TAX1BP1, убиквитинирование и остальные рецепторы сохранены. Что ожидается?</h3><ol><li><b>А.</b> Лизофагический поток не меняется, потому что рецепторы взаимозаменяемы без ограничений. <i>(неверный вариант)</i><br><span class="expl">При отсутствии OPTN или NDP52 поток в HeLa сохраняется, а основная роль принадлежит TAX1BP1; взаимозаменяемость неполная.</span></li><li><b>Б.</b> Лизосомы не получают убиквитин, потому что TAX1BP1 ставит метку. <i>(неверный вариант)</i><br><span class="expl">TAX1BP1 — рецептор: он узнаёт готовую метку и связывает TBK1 и FIP200, но не является убиквитин-лигазой.</span></li><li><b>В.</b> Метка поставлена, но лизофагический поток снижен, потому что ослаблен мост между убиквитином и ATG8. <i>(верный вариант)</i><br><span class="expl">Верно: рецептор соединяет убиквитин на лизосоме с аппаратом аутофагосомы, и без основного рецептора поток снижается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1016/j.cub.2017.11.012">Papadopoulos C., Meyer H. Detection and clearance of damaged lysosomes by the endo-lysosomal damage response and lysophagy. Curr Biol. 2017;27:R1330–R1341</a></li><li><a href="https://doi.org/10.7554/eLife.72328">Eapen V.V., Swarup S., Hoyer M.J., Paulo J.A., Harper J.W. Quantitative proteomics reveals the selectivity of ubiquitin-binding autophagy receptors in the turnover of damaged lysosomes by lysophagy. eLife. 2021;10:e72328</a></li><li><a href="https://doi.org/10.1038/emboj.2013.171">Maejima I., Takahashi A., Omori H. et al. Autophagy sequesters damaged lysosomes to control lysosomal biogenesis and kidney injury. EMBO J. 2013;32:2336–2347</a></li><li><a href="https://doi.org/10.15252/embj.2022113012">Boyle K.B., Ellison C.J., Elliott P.R. et al. TECPR1 conjugates LC3 to damaged endomembranes upon detection of sphingomyelin exposure. EMBO J. 2023;42:e113012</a></li><li><a href="https://doi.org/10.1038/s41586-025-08950-y">Hurley J.H., Coyne A.N., Miączyńska M., Stenmark H. The expanding repertoire of ESCRT functions in cell biology and disease. Nature. 2025 (опубликовано онлайн 25 июня 2025)</a></li></ul><p>Схема механизма; состояния качественные. Роль TAX1BP1 и TBK1 установлена в клетках HeLa и индуцированных нейронах человека при остром повреждении (Eapen 2021). Две волны убиквитинирования описаны по окраске цепь-специфичными антителами (Papadopoulos 2017, Meyer &amp; Kravic 2024); ранние данные об аутофагическом захвате повреждённых лизосом — Maejima 2013. Начальная E3-лигаза и критерий выбора между ремонтом и удалением не определены; связь спартин–ITCH — по обзору Hurley 2025.</p></details></article><article class="card print-unit" id="ns-lyso-biogenesis"><div class="eyebrow">Повреждение лизосомы · шаг 17 из 26</div><h2>Как восстанавливается пул лизосом</h2><p class="lead">Удаление повреждённых лизосом уменьшает их число, поэтому повреждение одновременно запускает программу восстановления пула. Её главный регулятор — транскрипционный фактор <a href="#ns-g-S12-T43">TFEB</a> (а также TFE3). Новые лизосомы образуются двумя путями: из вновь синтезированных компонентов под контролем TFEB и из материала повреждённых лизосом.</p><ol class="mech"><li>mTORC1 на лизосоме фосфорилирует TFEB, и белки 14-3-3 удерживают его в цитозоле.</li><li>При повреждении mTORC1 отходит от лизосомы, а Ca²⁺ через TRPML1 активирует <a href="#ns-g-S12-T44">кальциневрин</a>; ATG8 на мембране (<a href="#ns-g-S12-T39">CASM</a>) усиливают выход Ca²⁺, и TFEB дефосфорилируется.</li><li>TFEB уходит в ядро и включает гены лизосомных и аутофагических белков; параллельно из повреждённой лизосомы вытягиваются трубки (<a href="#ns-g-S12-T45">LYTL и другие пути</a>).</li></ol><p>В неповреждённой клетке лизосомный mTORC1 фосфорилирует TFEB, и тот остаётся в цитозоле в комплексе с белками 14-3-3. Поэтому программа биогенеза выключена.</p><p>Повреждение лизосомы включает программу несколькими путями. mTORC1 отсоединяется от лизосомы: ATG8 на мембране связывает FLCN (на неповреждённой лизосоме FLCN и RAG C/D нужны для фосфорилирования TFEB), а Ca²⁺ активирует кальциневрин. Присоединение ATG8 к мембране усиливает сигнал: липидированный LC3 взаимодействует с TRPML1 и усиливает выход Ca²⁺; без системы конъюгации LC3 активация TFEB при повреждении в клетках HeLa и в почке мыши нарушена, а ATG8 на мембране также связывает FLCN. TFEB дефосфорилируется, уходит в ядро, связывается с мотивом CLEAR и включает гены лизосомных и аутофагических белков.</p><p>Это занимает часы: нужно накопить мРНК и белки и доставить их к эндосомам, которые созревают в лизосомы. В клетках без аутофагии при повреждении биогенез лизосом подавлен. Параллельно идёт регенерация из материала повреждённой органеллы: при LYTL киназа LRRK2 фосфорилирует RAB35 и RAB10, а адаптер JIP4 вытягивает трубки без LAMP1, из которых выходят мембранные пузырьки.</p><p>Границы вывода. B-fission, при котором DRP1 отщепляет почки от повреждённых лизосом, описан в клетках HeLa при гипоксии–реоксигенации; в этой работе повреждение LLOMe не использовали. Неизвестно, насколько регенерированные лизосомы нуждаются в новых гидролазах и как согласованы пути.</p><div class="note trap"><strong>Типичная ошибка</strong> TFEB активируется только при голодании, когда выключается mTORC1.<p class="trap-fix">Повреждение лизосом тоже активирует TFEB: mTORC1 отсоединяется, а Ca²⁺ через TRPML1 и кальциневрин дефосфорилируют TFEB, причём присоединение ATG8 к лизосомной мембране усиливает этот сигнал. Сигнал идёт с самой повреждённой лизосомы.</p></div><div class="static-quiz"><h3>В клетках нарушена система присоединения LC3 к липидам (нет ATG5). Лизосомы повредили, остальные процессы не изменены. Что ожидается с активацией TFEB?</h3><ol><li><b>А.</b> Активация TFEB не меняется, потому что её регулирует только mTORC1. <i>(неверный вариант)</i><br><span class="expl">При повреждении активация TFEB зависит и от Ca²⁺, и от присоединения LC3 к лизосомной мембране: без него TFEB активируется хуже.</span></li><li><b>Б.</b> Активация TFEB ослаблена, потому что нет присоединения LC3, усиливающего выход Ca²⁺ через TRPML1. <i>(верный вариант)</i><br><span class="expl">Верно: липидированный LC3 взаимодействует с TRPML1 и усиливает выход Ca²⁺, нужный для активации TFEB.</span></li><li><b>В.</b> Активация TFEB усилена, потому что без присоединения LC3 освобождается FLCN. <i>(неверный вариант)</i><br><span class="expl">Свободный FLCN, наоборот, помогает mTORC1 фосфорилировать TFEB и удерживать его в цитозоле, поэтому активация слабее.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1038/s41556-020-00583-9">Nakamura S., Shigeyama S., Minami S. et al. LC3 lipidation is essential for TFEB activation during the lysosomal damage response to kidney injury. Nat Cell Biol. 2020;22:1252–1263</a></li><li><a href="https://doi.org/10.1038/ncb3114">Medina D.L., Di Paola S., Peluso I. et al. Lysosomal calcium signalling regulates autophagy through calcineurin and TFEB. Nat Cell Biol. 2015;17:288–299</a></li><li><a href="https://doi.org/10.1126/sciadv.abb2454">Bonet-Ponce L., Beilina A., Williamson C.D. et al. LRRK2 mediates tubulation and vesicle sorting from lysosomes. Sci Adv. 2020;6:eabb2454</a></li><li><a href="https://doi.org/10.1038/s41556-026-02010-x">Luo Y., Yu J., Li Z. et al. Mitochondrial-derived vesicles drive budding-type fission of damaged lysosomes. Nat Cell Biol. 2026;28:1686–1699</a></li></ul><p>Схема механизма; состояния качественные. Роль CASM и LC3 в активации TFEB показана в клетках HeLa и в модели повреждения почки у мыши (Nakamura 2020); роль Ca²⁺ и кальциневрина впервые показана при голодании (Medina 2015); влияние аутофагии на биогенез — Maejima 2013; LYTL — Bonet-Ponce 2020 (клетки после LLOMe); B-fission — Luo 2026 (HeLa, гипоксия–реоксигенация). Значение путей регенерации в тканях неясно; время «часы» — качественная оценка.</p></details></article><article class="card print-unit" id="ns-lyso-measure"><div class="eyebrow">Повреждение лизосомы · шаг 18 из 26</div><h2>Как зарегистрировать повреждение и ремонт</h2><p class="lead">Повреждение лизосомы и ответ на него оценивают по разным признакам: появлению галектина-3 на лизосомах, утрате сигнала красителя, переходу TFEB в ядро и динамике этих показателей. Каждый признак отвечает на свой вопрос и имеет ограничения, поэтому выводы строят по нескольким признакам сразу.</p><ol class="mech"><li>Галектин-3 из цитозоля связывается с открытыми гликанами и образует точки на лизосомах с крупным повреждением.</li><li>LysoTracker накапливается в кислых отсеках, и повреждённые лизосомы теряют его сигнал.</li><li>TFEB переходит в ядро после повреждения, а динамику показателей получают, фиксируя клетки через разные сроки после импульса LLOMe.</li></ol><p>Для воспроизводимого повреждения клетки обрабатывают LLOMe коротким импульсом, отмывают вещество и фиксируют или снимают клетки через разные сроки. Так отделяют быстрые события (минуты: выход Ca²⁺, сборка ESCRT) от медленных (часы: лизофагия, ядерный TFEB, восстановление пула).</p><p>Метка галектина-3 показывает лизосомы с открытыми гликанами, то есть с крупным повреждением; точки считают на клетку в нескольких полях. LysoTracker показывает, сохранилась ли кислая среда; сигнал теряют лизосомы и с малым, и с крупным повреждением. Поэтому по галектину-3 повреждение может быть занижено, а по красителю не различить размер и причину. Ядерный TFEB показывает запуск программы биогенеза, но не образование лизосом.</p><p>Каждый показатель сопровождают контролем: клетки без LLOMe, клетки без катепсина C, нокауты и ингибиторы отдельных ступеней ответа. Число точек не равно числу повреждённых лизосом: малые повреждения, как правило, точек не дают (для малых повреждений вывод не установлен), а спад числа точек может отражать и ремонт, и удаление; близкие друг к другу лизосомы на изображении могут слиться в одну точку (предел разрешения микроскопа). Кривые на пиктограммах условные.</p><p>Граница вывода: все показатели косвенные, и ни один сам по себе не различает ремонт и удаление. Для этого сравнивают показатели при подавлении отдельных процессов.</p><div class="note trap"><strong>Типичная ошибка</strong> Число точек галектина-3 равно числу повреждённых лизосом.<p class="trap-fix">Точка отмечает отдельную лизосому с открытыми гликанами (Aits 2015), но малые повреждения, как правило, точек не дают (для малых повреждений вывод не установлен), а спад числа точек отражает и ремонт, и удаление. Поэтому число точек — показатель крупных повреждений, а не счётчик всех повреждённых лизосом.</p></div><div class="static-quiz"><h3>После короткого импульса LLOMe точек галектина-3 мало, но сигнал LysoTracker утрачен у большинства лизосом. Какое объяснение согласуется с обоими наблюдениями?</h3><ol><li><b>А.</b> Повреждения в основном малые: кислая среда потеряна, а гликаны остались закрытыми. <i>(верный вариант)</i><br><span class="expl">Верно: краситель теряют и лизосомы с малым повреждением, у которых нарушен протонный градиент, а галектин-3 связывается с гликанами, открытыми при более крупном повреждении.</span></li><li><b>Б.</b> Галектин-3 в этих клетках не экспрессируется, поэтому повреждений нет. <i>(неверный вариант)</i><br><span class="expl">Утрата сигнала LysoTracker уже показывает потерю кислой среды; отсутствие точек не означает отсутствия повреждений.</span></li><li><b>В.</b> Краситель выходит из лизосом при любой обработке, поэтому его сигнал ничего не показывает. <i>(неверный вариант)</i><br><span class="expl">У красителя есть ограничения, но он остаётся показателем сохранности кислой среды при контроле без LLOMe.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1080/15548627.2015.1063871">Aits S., Kricker J., Liu B. et al. Sensitive detection of lysosomal membrane permeabilization by lysosomal galectin puncta assay. Autophagy. 2015;11:1408–1424</a></li><li><a href="https://doi.org/10.1111/tra.12839">Barral D.C., Staiano L., Guimas Almeida C. et al. Current methods to analyze lysosome morphology, positioning, motility and function. Traffic. 2022;23:238–269</a></li><li><a href="https://doi.org/10.1038/ncb3114">Medina D.L., Di Paola S., Peluso I. et al. Lysosomal calcium signalling regulates autophagy through calcineurin and TFEB. Nat Cell Biol. 2015;17:288–299</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li></ul><p>Схема метода; пиктограммы условные, не данные эксперимента. Метод точек галектина описан в работе Aits 2015 (клетки человека и мыши, ткани); ограничения LysoTracker изложены в обзоре Barral 2022; ядерная локализация TFEB как показатель — Medina 2015; динамика ответа — по обзору Meyer &amp; Kravic 2024.</p></details></article><article class="card print-unit" id="ns-route-principle"><div class="eyebrow">Выбор маршрута · шаг 19 из 26</div><h2>Чем определяется судьба повреждённого белка</h2><p class="lead">Повреждённый белок может свернуться повторно, быть разрушен протеасомой, выведен через ERAD или удалён аутофагией. Распределение между этими маршрутами задают физические свойства субстрата и доступность общих молекул, а не оценка степени повреждения.</p><ol class="mech"><li>Одиночный развёрнутый полипептид — проходит в узкий канал протеасомы или повторно сворачивается с участием Hsp70.</li><li>Агрегат, крупный комплекс или органелла — не проходят в канал и удаляются аутофагией; растворимый белок просвета ЭПР сначала передаётся ERAD.</li><li>Маршруты используют общие молекулы — Hsp70, убиквитин, p62, p97, — поэтому снижение <a href="#ns-g-S12-T47">ёмкости</a> одного звена меняет нагрузку на остальные.</li></ol><p>Повреждённый белок потерял нативную структуру. Он может быть несвёрнутым полипептидом, агрегатом или белком мембраны органеллы. Для таких молекул есть четыре маршрута: повторное сворачивание шаперонами, 26S-протеасома, ERAD для белков эндоплазматического ретикулума и аутофагия.</p><p>Распределение молекул между маршрутами называют <a href="#ns-g-S12-T46">триажем белков</a>. Центральной системы, которая оценивала бы степень повреждения и выбирала путь, нет: убиквитин-протеасомная система и аутофагия управляются сродством связывания, локальными концентрациями, авидностью и разделением на отсеки (Pohl, Dikic 2019). Главный параметр — размер субстрата. Протеасома разрушает преимущественно одиночные развёрнутые полипептиды, а аутофагия — более крупные структуры: комплексы, агрегаты, органеллы.</p><p>Отсек тоже ограничивает доступ. Белки просвета ЭПР отделены мембраной от цитозольных протеасом, поэтому их сначала передаёт ERAD (Christianson 2023). Общие компоненты — шапероны, убиквитин, p97 и протеасомы — ограничены, и маршруты конкурируют за них. При старении и хронической экспрессии агрегирующих белков <a href="#ns-g-S12-T47">ёмкость</a> этих звеньев снижается, агрегаты захватывают шапероны и протеасомы, и несвёрнутых молекул становится больше (Hipp 2019).</p><p>Схема качественная: она показывает, какие маршруты доступны, но не доли молекул. Доли зависят от вида, ткани и воздействия, и общих значений в источниках нет. Агрегат или органелла — не «более тяжёлое повреждение» того же белка, а другая физическая форма субстрата.</p><div class="note trap"><strong>Типичная ошибка</strong> Маршрут повреждённого белка определяется тем, насколько сильно он повреждён: слабо повреждённые молекулы сворачиваются, сильно повреждённые уходят в аутофагию.<p class="trap-fix">Сама степень повреждения маршрут не задаёт. Судьбу определяют размер и олигомерное состояние субстрата, отсек, тип убиквитиновой метки и концентрации общих компонентов; маршруты конкурируют по скорости, а центрального механизма выбора нет (Pohl, Dikic 2019).</p></div><div class="static-quiz"><h3>Белок X в цитозоле существует в виде одиночных развёрнутых полипептидов. Затем молекулы X объединяются в крупный агрегат. Как изменится доступность X для 26S-протеасомы и для аутофагии?</h3><ol><li><b>А.</b> Протеасома продолжит принимать агрегат, но медленнее, пропорционально степени повреждения. <i>(неверный вариант)</i><br><span class="expl">Размер определяет не скорость, а возможность входа: агрегат в узкий канал протеасомы не проходит.</span></li><li><b>Б.</b> Протеасома перестанет принимать молекулу, а доступным основным маршрутом останется аутофагия. <i>(верный вариант)</i><br><span class="expl">Протеасома принимает преимущественно одиночные развёрнутые полипептиды, а агрегаты удаляет аутофагия (Pohl, Dikic 2019).</span></li><li><b>В.</b> Обе системы останутся одинаково доступными, потому что маршрут задаёт только степень повреждения. <i>(неверный вариант)</i><br><span class="expl">Степень повреждения сама маршрут не задаёт: доступность определяют размер, отсек и метка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li><li><a href="https://doi.org/10.1038/s41580-019-0101-y">Hipp M.S., Kasturi P., Hartl F.U. The proteostasis network and its decline in ageing. Nat Rev Mol Cell Biol. 2019;20:421–435</a></li><li><a href="https://doi.org/10.1038/s41580-023-00633-8">Christianson J.C., Jarosch E., Sommer T. Mechanisms of substrate processing during ER-associated protein degradation. Nat Rev Mol Cell Biol. 2023;24:777–796</a></li><li><a href="https://doi.org/10.1038/s41580-019-0133-3">Rosenzweig R., Nillegoda N.B., Mayer M.P., Bukau B. The Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2019;20:665–680</a></li><li><a href="https://doi.org/10.1093/hmg/ddr048">Chan N.C., Salazar A.M., Pham A.H. et al. Broad activation of the ubiquitin-proteasome system by Parkin is critical for mitophagy. Hum Mol Genet. 2011;20:1726–1737</a></li></ul><p>Схема механизма, качественные состояния; клетки эукариот. Основа — обзоры Pohl, Dikic 2019 и Hipp 2019 (полные тексты) и Christianson 2023 (полный текст; ERAD: распознавание субстратов в просвете ЭПР, рис. 2); реферат Rosenzweig 2019 (шапероны); Chan 2011 (митохондрии, клетки HeLa, SH-SY5Y и мыши; полный текст). Рамка из точек означает, что маршрут возможен, но в источниках не назван основным для этого субстрата; доли молекул на схеме не показаны. Состояние «общие компоненты заняты» показано качественно по Hipp 2019, количественно не оценено.</p></details></article><article class="card print-unit" id="ns-route-chaperone"><div class="eyebrow">Выбор маршрута · шаг 20 из 26</div><h2>Рефолдинг и передача на деградацию</h2><p class="lead">Hsp70 помогает несвёрнутому белку свернуться, а если свёртывание не удаётся, те же шапероны передают его на деградацию. Куда пойдёт субстрат, зависит от ко-шаперонов, присоединившихся к Hsp70.</p><ol class="mech"><li>Hsp70 — связывает несвёрнутый субстрат; J-белки и факторы обмена нуклеотида регулируют цикл АТФазы.</li><li><a href="#ns-g-S12-T48">CHIP</a> — присоединяется к Hsp70 и убиквитинирует субстрат, не способный свернуться, что направляет его в протеасому.</li><li><a href="#ns-g-S12-T49">BAG1</a> ведёт убиквитинированные белки в протеасому, <a href="#ns-g-S12-T49">BAG3</a> с HSPB8 и p62 — в аутофагию (<a href="#ns-g-S12-T50">CASA</a>).</li></ol><p>Hsp70 участвует во всех этапах жизни белка — от синтеза до деградации (Rosenzweig 2019). Он связывает несвёрнутые полипептиды. Цикл связывания и освобождения субстрата регулируют J-белки и факторы обмена нуклеотида; вместе с Hsp70 они составляют сеть шаперонов. Если белок принимает нативную структуру, он покидает комплекс: это рефолдинг.</p><p>Субстрат, который не может свернуться, долго остаётся в комплексе с шаперонами. Исход зависит от времени пребывания в комплексе. К такому комплексу присоединяется CHIP — убиквитинлигаза, связывающаяся с С-концом Hsp70 или Hsp90 (Hipp 2019). Она убиквитинирует субстрат и этим направляет его в протеасому. Для рецептора глюкокортикоидов показано, что CHIP смещает баланс от свёртывания к деградации (Connell 2001).</p><p>Дальнейший путь зависит от ко-шаперона. В культивируемых клетках BAG1 связан с протеасомной деградацией полиубиквитинированных белков, а BAG3 — с макроаутофагией; в моделях клеточного старения и в мозге грызунов доля BAG3 растёт (Gamerdinger 2009). BAG3 с Hsc70, HSPB8, CHIP и адаптером p62 образует комплекс CASA, который удаляет повреждённые белки Z-диска мышц (Arndt 2010). Как строится аутофагосома, разобрано в семинаре 11.</p><p>Схема описывает установленные комплексы. Как часто субстрат попадает в каждый из них, зависит от ткани и условий, и общей доли в источниках нет.</p><div class="note trap"><strong>Типичная ошибка</strong> Шапероны помогают белкам свернуться, а на деградацию их направляют другие системы без участия шаперонов.<p class="trap-fix">Те же шапероны участвуют в передаче на деградацию: CHIP присоединяется к Hsp70 и убиквитинирует субстрат, а BAG1 и BAG3 направляют его в протеасому или в аутофагию (Connell 2001; Gamerdinger 2009; Arndt 2010).</p></div><div class="static-quiz"><h3>В культивируемых клетках маршрут полиубиквитинированных белков зависит от соотношения BAG3 и BAG1. Соотношение BAG3 к BAG1 возрастает, как при клеточном старении. Как изменится доля макроаутофагии в удалении этих белков?</h3><ol><li><b>А.</b> Доля макроаутофагии снизится, потому что BAG3 усиливает передачу в протеасому. <i>(неверный вариант)</i><br><span class="expl">BAG3, а не BAG1, связан с макроаутофагией; BAG1 связан с протеасомным путём (Gamerdinger 2009).</span></li><li><b>Б.</b> Доля макроаутофагии не изменится, потому что маршрут задаёт только тип убиквитиновой цепи. <i>(неверный вариант)</i><br><span class="expl">Тип цепи важен, но не единственный фактор: при смещении к BAG3 чаще используется макроаутофагия.</span></li><li><b>В.</b> Доля макроаутофагии возрастёт, а доля протеасомного пути относительно уменьшится. <i>(верный вариант)</i><br><span class="expl">Переход от BAG1 к BAG3 означает более частое использование макроаутофагии для оборота полиубиквитинированных белков (Gamerdinger 2009).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-019-0133-3">Rosenzweig R., Nillegoda N.B., Mayer M.P., Bukau B. The Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2019;20:665–680</a></li><li><a href="https://doi.org/10.1038/35050618">Connell P., Ballinger C.A., Jiang J. et al. The co-chaperone CHIP regulates protein triage decisions mediated by heat-shock proteins. Nat Cell Biol. 2001;3:93–96</a></li><li><a href="https://doi.org/10.1038/s41580-019-0101-y">Hipp M.S., Kasturi P., Hartl F.U. The proteostasis network and its decline in ageing. Nat Rev Mol Cell Biol. 2019;20:421–435</a></li><li><a href="https://doi.org/10.1038/emboj.2009.29">Gamerdinger M., Hajieva P., Kaya A.M., Wolfrum U., Hartl F.U., Behl C. Protein quality control during aging involves recruitment of the macroautophagy pathway by BAG3. EMBO J. 2009;28:889–901</a></li><li><a href="https://doi.org/10.1016/j.cub.2009.11.022">Arndt V., Dick N., Tawo R. et al. Chaperone-assisted selective autophagy is essential for muscle maintenance. Curr Biol. 2010;20:143–148</a></li></ul><p>Схема механизма, качественные состояния. Данные: клетки COS (CHIP и рецептор глюкокортикоидов; Connell 2001, реферат); культивируемые клетки и мозг грызунов (BAG1 и BAG3; Gamerdinger 2009, реферат); Drosophila, мышь и мышечные клетки (CASA; Arndt 2010, реферат); сеть Hsp70 и CHIP — обзоры Rosenzweig 2019 (реферат) и Hipp 2019. Роль BAG1 и BAG3 как жёстких переключателей источники не утверждают.</p></details></article><article class="card print-unit" id="ns-route-proteasome"><div class="eyebrow">Выбор маршрута · шаг 21 из 26</div><h2>Что может разрушить протеасома и что нет</h2><p class="lead">26S-протеасома разрушает убиквитинированные полипептиды, которые проходят в её узкий канал. Агрегаты, крупные комплексы и целые органеллы она не принимает, но участвует в разрушении отдельных белков органелл.</p><ol class="mech"><li><a href="#ns-g-S12-T51">Цепь K48</a> — распространённый сигнал для протеасомы; в экспериментах с модельными субстратами эффективное узнавание требовало цепи из четырёх убиквитинов, но универсального порога нет.</li><li><a href="#ns-g-S12-T54">p97</a> — извлекает убиквитинированный белок из мембраны или комплекса и подаёт его в протеасому.</li><li>Протеасома — разворачивает субстрат и расщепляет его в канале; при её подавлении растёт синтез субъединиц через <a href="#ns-g-S12-T57">Nrf1</a>.</li></ol><p>Убиквитинированный белок узнают убиквитиновые рецепторы протеасомы или челночные белки, одновременно связывающие убиквитин и протеасому. Перед расщеплением внутри бочонка протеасомы субстрат деубиквитинируется и разворачивается (Pohl, Dikic 2019). Распространённый сигнал — цепь убиквитина на Lys48. Для модельных субстратов in vitro минимальным сигналом эффективной доставки оказался тетраубиквитин (Thrower 2000), однако часть белков в клетках человека и дрожжей разрушается протеасомой после присоединения отдельных молекул убиквитина, не связанных в цепь (Braten 2016). Ветвящиеся цепи K11–K48 относят к самым сильным сигналам для протеасомы (Pohl, Dikic 2019).</p><p>Размер ограничивает этот путь: в узкий канал проходят одиночные развёрнутые полипептиды, а агрегаты, комплексы и органеллы удаляет аутофагия. Целая органелла в канал не помещается, но протеасома участвует в её очищении. После деполяризации митохондрий Parkin убиквитинирует белки наружной мембраны; на митохондриях растёт доля цепей K48, привлекается 26S-протеасома, и, по данным Chan 2011, разрушаются многие белки наружной мембраны, причём независимо от аутофагии. Митофузины Mfn1 и Mfn2 извлекает p97 (Chan 2011; Tanaka 2010). Обзор Narendra, Youle (2024) оценивает это иначе: большинство субстратов Parkin остаётся на мембране и удаляется вместе с органеллой, а независимо от митофагии извлекаются и разрушаются немногие, среди них MFN1/2 и RHOT1/2.</p><p>Если протеасома подавлена, Parkin-зависимая митофагия не идёт в клетках HeLa, SH-SY5Y и мыши с экспрессией Parkin (Chan 2011); сходный результат получен при подавлении p97 (Tanaka 2010). Протеасома служит и мишенью: при голодании её удаляет аутофагия (<a href="#ns-g-S12-T58">протеафагия</a>). При подавлении протеасомы клетки повышают транскрипцию её субъединиц через Nrf1 (Radhakrishnan 2010).</p><p>Схема качественная; данные получены в клетках с экспрессией Parkin и при деполяризации митохондрий, на других органеллах они не проверены.</p><div class="note trap"><strong>Типичная ошибка</strong> Органеллы удаляет аутофагия, а протеасома в этом не участвует.<p class="trap-fix">Целую органеллу протеасома не принимает, но белки наружной мембраны митохондрий, помеченные Parkin, извлекает p97 и разрушает протеасома. В клетках с избытком Parkin после деполяризации подавление протеасомы или p97 блокировало Parkin-зависимую митофагию (Chan 2011; Tanaka 2010); для нейронов с эндогенным Parkin такие данные в источниках шага не приведены.</p></div><div class="static-quiz"><h3>В клетках HeLa с избытком Parkin митохондрии деполяризованы, белки наружной мембраны убиквитинированы. Активность 26S-протеасомы подавлена. Что ожидается для Parkin-зависимой митофагии в этой системе?</h3><ol><li><b>А.</b> Митофагия не пойдёт, так как ей нужна протеасомная очистка наружной мембраны от помеченных белков. <i>(верный вариант)</i><br><span class="expl">В клетках HeLa, SH-SY5Y и мыши с избытком Parkin подавление протеасомы блокировало Parkin-зависимую митофагию (Chan 2011). Для нейронов с эндогенным Parkin такие данные в источниках шага не приведены, поэтому переносить вывод на них нельзя.</span></li><li><b>Б.</b> Митофагия усилится, так как аутофагия полностью заменяет протеасому при любом нарушении. <i>(неверный вариант)</i><br><span class="expl">В клетках с избытком Parkin замены нет: для митофагии нужно разрушение белков наружной мембраны протеасомой (Chan 2011). Для других систем вывод требует отдельной проверки.</span></li><li><b>В.</b> Митофагия не изменится, так как органеллу удаляет аутофагия независимо от протеасомы. <i>(неверный вариант)</i><br><span class="expl">Эксперименты с подавлением протеасомы и p97 показывают противоположное (Tanaka 2010; Chan 2011).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li><li><a href="https://doi.org/10.1093/emboj/19.1.94">Thrower J.S., Hoffman L., Rechsteiner M., Pickart C.M. Recognition of the polyubiquitin proteolytic signal. EMBO J. 2000;19:94–102</a></li><li><a href="https://doi.org/10.1093/hmg/ddr048">Chan N.C., Salazar A.M., Pham A.H. et al. Broad activation of the ubiquitin-proteasome system by Parkin is critical for mitophagy. Hum Mol Genet. 2011;20:1726–1737</a></li><li><a href="https://doi.org/10.1083/jcb.201007013">Tanaka A., Cleland M.M., Xu S. et al. Proteasome and p97 mediate mitophagy and degradation of mitofusins induced by Parkin. J Cell Biol. 2010;191:1367–1380</a></li><li><a href="https://doi.org/10.1016/j.molcel.2010.02.029">Radhakrishnan S.K., Lee C.S., Young P. et al. Transcription factor Nrf1 mediates the proteasome recovery pathway after proteasome inhibition in mammalian cells. Mol Cell. 2010;38:17–28</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li><li><a href="https://doi.org/10.1073/pnas.1608644113">Braten O., Livneh I., Ziv T. et al. Numerous proteins with unique characteristics are degraded by the 26S proteasome following monoubiquitination. Proc Natl Acad Sci U S A. 2016;113:E4639–E4647</a></li></ul><p>Схема механизма, качественные состояния. Митохондрии: клетки HeLa, SH-SY5Y и мыши, деполяризация и Parkin (Chan 2011; Tanaka 2010, полные тексты); минимальный сигнал — очищенные модельные субстраты с определённым составом цепей (Thrower 2000, реферат); деградация после моноубиквитинирования — клетки человека и дрожжей (Braten 2016, реферат); Nrf1 — фибробласты мыши (Radhakrishnan 2010, реферат); размер субстрата и протеафагия — обзор Pohl, Dikic 2019; судьба белков наружной мембраны — обзор Narendra, Youle 2024 (полный текст). Обзор и первичные работы различаются по оценке числа белков наружной мембраны, разрушаемых независимо от митофагии (Chan 2011: многие; Narendra 2024: немногие). Подавление протеасомы на схеме показано как исходное воздействие без последующей компенсации: при длительном воздействии усиливается аутофагия.</p></details></article><article class="card print-unit" id="ns-route-er"><div class="eyebrow">Выбор маршрута · шаг 22 из 26</div><h2>Маршруты из ЭПР: ERAD и ER-фагия</h2><p class="lead">Белок, неправильно свёрнутый в просвете ЭПР, отделён мембраной от цитозольных протеасом. Растворимые субстраты выводит ERAD, а ERAD-устойчивые агрегаты удаляются в лизосому.</p><ol class="mech"><li>Комплекс HRD1–SEL1L — убиквитинирует несвёрнутый растворимый белок и выводит его из ЭПР в цитозоль.</li><li><a href="#ns-g-S12-T54">p97</a> — вытягивает убиквитинированный белок и подаёт его в протеасому.</li><li>Калнексин с FAM134B — связывает <a href="#ns-g-S12-T55">ERAD-устойчивый агрегат</a> и направляет его в лизосому (<a href="#ns-g-S12-T56">ER-фагия и ERLAD</a>).</li></ol><p>Белки секреторного пути сворачиваются в просвете ЭПР. Для контроля качества служит ERAD: убиквитин- и протеасомзависимый процесс, в котором встроенные в мембрану убиквитинлигазы передают неправильно свёрнутые белки на протеасому. Мутантный α1-антитрипсин передаётся комплексу HRD1–SEL1L, и без этого комплекса он не разрушается (Christianson 2008). Подавление p97 приводит к удержанию субстратов ERAD (Anderson 2015).</p><p>Агрегация препятствует выведению в цитозоль (дислокации), поэтому такой агрегат ERAD не принимает (Fregno 2018). Полимеры α1-антитрипсина Z (ATZ) и неправильно свёрнутый проколлаген остаются в просвете ЭПР и удаляются лизосомными путями. Рецептор FAM134B вместе с калнексином обеспечивает оборот таких ERAD-устойчивых белков (Forrester 2019; Fregno 2018). Для ATZ описан перенос в одномембранных везикулах, слияние которых с эндолизосомами зависит от STX17 и VAMP8 (ERLAD); в отличие от классической ER-фагии, ЭПР при этом не захватывается аутофагосомой. Авторы связывают это с отсутствием эффекта фармакологического усиления макроаутофагии при некоторых агрегопатиях просвета ЭПР.</p><p>Один субстрат может использовать оба пути. Мутантный NPC1 (I1061T) накапливается в ЭПР и разрушается двумя независимыми путями: нокдаун BECN1 или FAM134B вызывает накопление мутантного, но не нормального белка (Mochida 2022).</p><p>Отсюда не следует, что ER-фагия включается при сильном стрессе ЭПР: в источниках маршрут связан со свойствами субстрата, а не с тяжестью стресса.</p><div class="note trap"><strong>Типичная ошибка</strong> ER-фагия включается, когда стресс ЭПР становится сильным, и принимает на себя часть белков ERAD.<p class="trap-fix">Маршрут связан со свойствами субстрата: растворимые белки выводит ERAD, а ERAD-устойчивые агрегаты, например полимеры ATZ и проколлаген, распознаёт комплекс FAM134B с калнексином. Стресс ЭПР может усиливать ER-фагию, но для агрегата, который нельзя вывести в цитозоль, маршрут определяет невозможность ERAD; роль тяжести стресса как переключателя между ERAD и ER-фагией источники не показывают (Fregno 2018; Forrester 2019; Mochida 2022).</p></div><div class="static-quiz"><h3>Полимеры ATZ находятся в просвете ЭПР, а активность ERAD подавлена. Как изменится маршрут удаления этого агрегата?</h3><ol><li><b>А.</b> Агрегат перейдёт в ERAD, так как этот путь принимает любые агрегаты ЭПР. <i>(неверный вариант)</i><br><span class="expl">Агрегация препятствует выведению в цитозоль, поэтому ERAD такие агрегаты не принимает (Fregno 2018).</span></li><li><b>Б.</b> Агрегат не удалится, так как ER-фагия включается только при сильном стрессе ЭПР. <i>(неверный вариант)</i><br><span class="expl">Маршрут связан со свойствами субстрата, а не с тяжестью стресса; подавление ERAD лизосомный путь для агрегата не включает и не выключает.</span></li><li><b>В.</b> Маршрут не изменится: агрегат и так удаляется в лизосому с участием калнексина и FAM134B. <i>(верный вариант)</i><br><span class="expl">Полимеры ATZ устойчивы к протеасоме и в цитозоль не выводятся; их удаляет лизосомный путь ERLAD с участием калнексина и FAM134B (Fregno 2018), поэтому подавление ERAD его не меняет.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb1689">Christianson J.C., Shaler T.A., Tyler R.E., Kopito R.R. OS-9 and GRP94 deliver mutant α1-antitrypsin to the Hrd1–SEL1L ubiquitin ligase complex for ERAD. Nat Cell Biol. 2008;10:272–282</a></li><li><a href="https://doi.org/10.1016/j.ccell.2015.10.002">Anderson D.J., Le Moigne R., Djakovic S. et al. Targeting the AAA ATPase p97 as an approach to treat cancer through disruption of protein homeostasis. Cancer Cell. 2015;28:653–665</a></li><li><a href="https://doi.org/10.15252/embj.201899259">Fregno I., Fasana E., Bergmann T.J. et al. ER-to-lysosome-associated degradation of proteasome-resistant ATZ polymers occurs via receptor-mediated vesicular transport. EMBO J. 2018;37:e99259</a></li><li><a href="https://doi.org/10.15252/embj.201899847">Forrester A., De Leonibus C., Grumati P. et al. A selective ER-phagy exerts procollagen quality control via a Calnexin-FAM134B complex. EMBO J. 2019;38:e99847</a></li><li><a href="https://doi.org/10.15252/embr.202255192">Mochida K., Nakatogawa H. ER-phagy: selective autophagy of the endoplasmic reticulum. EMBO Rep. 2022;23:e55192</a></li></ul><p>Схема механизма, качественные состояния; культивируемые клетки млекопитающих. Комплекс HRD1–SEL1L и мутантный α1-антитрипсин — Christianson 2008 (реферат); p97 — Anderson 2015 (реферат, опухолевые клетки); ATZ — Fregno 2018 (реферат); проколлаген — Forrester 2019 (реферат); NPC1 I1061T — обзор Mochida 2022 (полный текст). ERLAD и ER-фагия на схеме объединены в один лизосомный маршрут; в источниках у них разные способы доставки. Вклад каждого пути на схеме не показан.</p></details></article><article class="card print-unit" id="ns-route-switch"><div class="eyebrow">Выбор маршрута · шаг 23 из 26</div><h2>Как p62 и убиквитин переключают маршрут</h2><p class="lead">Один и тот же белок p62 может вести субстрат и к протеасоме, и к аутофагии. Направление зависит от олигомерного состояния p62, а оно — от типа цепей убиквитина, концентрации свободного убиквитина и N-дегрона на субстрате.</p><ol class="mech"><li><a href="#ns-g-S12-T52">Димер p62</a> — узнаёт доменом UBA одиночные молекулы с цепью K48 и через PB1 подаёт их на протеасому.</li><li><a href="#ns-g-S12-T52">Олигомер p62</a> — образуется на цепях K63, при избытке свободного убиквитина (<a href="#ns-g-S12-T53">убиквитиновый стресс</a>) или на N-дегроне и ведёт груз в аутофагию через LIR.</li><li>Предпочтение цепей K48 и K63 не абсолютно: результат определяют авидность и концентрации, а не одна метка.</li></ol><p>p62 связывает убиквитинированные субстраты доменом UBA, протеасому — доменом PB1, а мембраны аутофагии — мотивом LIR. Поэтому p62 служит и челноком к протеасоме, и рецептором аутофагии (Pohl, Dikic 2019).</p><p>Направление зависит от состояния p62: конкуренцию протеасомного и лизосомного путей определяет авидность комплекса, а не сродство отдельного рецептора к убиквитину. Димер узнаёт одиночные молекулы с цепями K48 и подаёт их на протеасому. Цепи K63 вызывают олигомеризацию p62 по домену PB1 и фазовое разделение; образуются тельца p62, которые привлекают мембраны аутофагии. Фазовое разделение p62 с полиубиквитином показано in vitro (Sun 2018). В реконструированной системе скопления p62 формируются на субстратах, имеющих не менее двух цепей длиннее трёх убиквитинов (Zaffagnini 2018).</p><p>Олигомеризацию вызывают и другие воздействия. При высокой концентрации свободного убиквитина, например после теплового шока или при длительном подавлении протеасомы, убиквитинируется сам p62, димеризация нарушается, и груз направляется в аутофагию (Pohl, Dikic 2019). В реконструированной системе свободный убиквитин, напротив, подавлял образование скоплений p62 с субстратом (Zaffagnini 2018): направление эффекта зависит от условий. N-дегрон, например аргинилированный BiP, связывается с доменом ZZ (Cha-Molstad 2015) и вызывает олигомеры p62, связанные дисульфидными мостиками (Pohl, Dikic 2019).</p><p>Данные получены в основном при сверхэкспрессии и in vitro; неясно, определяет ли судьбу субстрата тип цепи, его количество или другие сигналы (Adriaenssens 2022).</p><div class="note trap"><strong>Типичная ошибка</strong> Цепь K48 всегда ведёт к протеасоме, а цепь K63 — к аутофагии.<p class="trap-fix">Это предпочтения, а не правила: они показаны в основном при сверхэкспрессии и in vitro и не абсолютны (Adriaenssens 2022). Направление зависит и от состояния p62 (димер или олигомер), и от концентрации свободного убиквитина, и от N-дегрона (Pohl, Dikic 2019).</p></div><div class="static-quiz"><h3>Субстрат с цепями K48 доставляет к протеасоме димер p62. Концентрация свободного убиквитина в клетке длительно повышена (убиквитиновый стресс). Какое изменение ожидается для p62?</h3><ol><li><b>А.</b> Димеров p62 станет больше, и весь груз будет направляться только к протеасоме. <i>(неверный вариант)</i><br><span class="expl">При избытке свободного убиквитина димеризация нарушается, а не усиливается (Pohl, Dikic 2019).</span></li><li><b>Б.</b> Димеризация нарушится, олигомеров p62 станет больше, и груз чаще пойдёт в аутофагию. <i>(верный вариант)</i><br><span class="expl">Убиквитинирование p62 при высокой концентрации свободного убиквитина блокирует димеризацию по UBA и способствует олигомеризации (Pohl, Dikic 2019).</span></li><li><b>В.</b> Состояние p62 не изменится, так как оно задаётся только числом звеньев в цепи. <i>(неверный вариант)</i><br><span class="expl">Число звеньев важно, но состояние p62 меняют и концентрация свободного убиквитина, и N-дегрон.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li><li><a href="https://doi.org/10.1038/s41422-018-0017-7">Sun D., Wu R., Zheng J., Li P., Yu L. Polyubiquitin chain-induced p62 phase separation drives autophagic cargo segregation. Cell Res. 2018;28:405–415</a></li><li><a href="https://doi.org/10.15252/embj.201798308">Zaffagnini G., Savova A., Danieli A. et al. p62 filaments capture and present ubiquitinated cargos for autophagy. EMBO J. 2018;37:e98308</a></li><li><a href="https://doi.org/10.1038/ncb3177">Cha-Molstad H., Sung K.S., Hwang J. et al. Amino-terminal arginylation targets endoplasmic reticulum chaperone BiP for autophagy through p62 binding. Nat Cell Biol. 2015;17:917–929</a></li><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li></ul><p>Схема механизма, качественные состояния. Фазовое разделение p62 с полиубиквитином — in vitro (Sun 2018, реферат); образование скоплений p62 на субстратах — реконструкция in vitro (Zaffagnini 2018, реферат); аргинилированный BiP и ZZ-домен — культивируемые клетки (Cha-Molstad 2015, реферат); убиквитиновый стресс и дисульфидные олигомеры — обзор Pohl, Dikic 2019. Влияние свободного убиквитина в обзоре (повышение олигомеризации) и в реконструкции in vitro (подавление образования скоплений) описано по-разному; на схеме показано положение обзора. Длительное подавление протеасомы на схеме приводит к аутофагии сразу; в клетках этот переход развивается при длительном воздействии.</p></details></article><article class="card print-unit" id="ns-route-measure"><div class="eyebrow">Выбор маршрута · шаг 24 из 26</div><h2>Как определить маршрут конкретного белка</h2><p class="lead">Маршрут белка определяют сравнением: как меняются его количество и скорость исчезновения, когда маршруты выключают по очереди. Один препарат показывает, что маршрут участвует, но не его долю.</p><ol class="mech"><li><a href="#ns-g-S12-T60">Период полужизни</a> — измеряют по убыли белка после остановки синтеза циклогексимидом.</li><li><a href="#ns-g-S12-T59">Ингибиторы</a> протеасомы, лизосомы, p97 и маннозидазы ЭПР — закрывают маршруты по очереди; накопление белка указывает, какой маршрут вносит вклад в его удаление.</li><li>Генетические контроли — клетки ATG7⁻/⁻ и нокаут рецептора — проверяют специфичность, потому что препараты действуют не только на свою мишень.</li></ol><p>Исходный вопрос: каким путём удаляется белок X. Сначала измеряют период полужизни: синтез белка останавливают циклогексимидом и определяют X на иммуноблоте в нескольких точках; скорость спада даёт период полужизни. Для субстратов убиквитин-протеасомной системы периоды полужизни лежат в диапазоне от секунд до часов (Pohl, Dikic 2019).</p><p>Затем измерение повторяют с ингибиторами. Накопление X при подавлении протеасомы (MG132, бортезомиб) согласуется с вкладом протеасомы; накопление при бафиломицине A1 или SAR405 согласуется с вкладом лизосомного пути. Кифунензин останавливает оборот белков ЭПР, зависящих от маннозидазы (Liu 1999), а CB-5083 подавляет p97 (Anderson 2015). Клетки без ATG7 или без рецептора подтверждают результат независимо от препарата.</p><p>Каждый препарат действует шире мишени. MG132 in vitro подавляет и кальпаин (Tsubuki 1996); SAR405 — ингибитор VPS34: подавляет образование аутофагосом и транспорт поздних эндосом и лизосом (Ronan 2014); бафиломицин A1 в клетках Drosophila блокирует слияние аутофагосом с лизосомами независимо от pH (Mauvezin 2015); CB-5083 вызывает общий протеотоксический стресс (Anderson 2015). Для слитых с HaloTag белков есть альтернатива циклогексимиду — импульс-погоня, которую авторы описали как нетоксичную (Merrill 2019).</p><p>Подавление одного маршрута усиливает другие, поэтому при длительной обработке накопление отражает уже перестроенную систему (Pohl, Dikic 2019). Вывод «X удаляет протеасома» становится надёжнее, если его подтверждают вторым препаратом и нокаутом; доля маршрута таким сравнением не определяется.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок накапливается при добавлении MG132, его удаляет протеасома и никакой другой путь.<p class="trap-fix">Накопление при MG132 согласуется с участием протеасомы, но MG132 подавляет и кальпаин (Tsubuki 1996), а при длительном воздействии усиливаются другие маршруты (Pohl, Dikic 2019). Мишень подтверждают ингибитором другого класса и генетическим контролем, а долю маршрута измеряют отдельно.</p></div><div class="static-quiz"><h3>В клетках на фоне циклогексимида уровень белка X за 6 ч упал, а при добавлении MG132 остался близким к исходному. Какой вывод допустим?</h3><ol><li><b>А.</b> Исчезновение X чувствительно к MG132, что согласуется с вкладом протеасомы; мишень и доли других маршрутов этим сравнением не установлены. <i>(верный вариант)</i><br><span class="expl">Результат совместим с участием протеасомы, но MG132 действует и на другие протеазы (Tsubuki 1996). Мишень подтверждают ингибитором другого класса или генетически.</span></li><li><b>Б.</b> X удаляется только протеасомой, так как MG132 действует исключительно на протеасому. <i>(неверный вариант)</i><br><span class="expl">MG132 — пептидный альдегид: in vitro он подавляет и кальпаин (Tsubuki 1996), поэтому одного такого результата для вывода «только протеасома» недостаточно.</span></li><li><b>В.</b> X удаляется аутофагией, так как при MG132 лизосомный путь всегда подавляется. <i>(неверный вариант)</i><br><span class="expl">Подавление протеасомы, напротив, может усиливать аутофагию (Pohl, Dikic 2019), поэтому утверждение «всегда» неверно. Сохранение X при MG132 согласуется с вкладом протеасомы, но само по себе его не доказывает: MG132 подавляет и кальпаин (Tsubuki 1996).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-12.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li><li><a href="https://doi.org/10.1093/oxfordjournals.jbchem.a021280">Tsubuki S., Saito Y., Tomioka M., Ito H., Kawashima S. Differential inhibition of calpain and proteasome activities by peptidyl aldehydes of di-leucine and tri-leucine. J Biochem. 1996;119:572–576</a></li><li><a href="https://doi.org/10.1038/ncomms8007">Mauvezin C., Nagy P., Juhász G., Neufeld T.P. Autophagosome–lysosome fusion is independent of V-ATPase-mediated acidification. Nat Commun. 2015;6:7007</a></li><li><a href="https://doi.org/10.1038/nchembio.1681">Ronan B., Flamand O., Vescovi L. et al. A highly potent and selective Vps34 inhibitor alters vesicle trafficking and autophagy. Nat Chem Biol. 2014;10:1013–1019</a></li><li><a href="https://doi.org/10.1016/j.ccell.2015.10.002">Anderson D.J., Le Moigne R., Djakovic S. et al. Targeting the AAA ATPase p97 as an approach to treat cancer through disruption of protein homeostasis. Cancer Cell. 2015;28:653–665</a></li><li><a href="https://doi.org/10.1074/jbc.274.9.5861">Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867</a></li><li><a href="https://doi.org/10.1074/jbc.RA119.010596">Merrill R.A., Song J., Kephart R.A., Klomp A.J., Noack C.E., Strack S. A robust and economical pulse-chase protocol to measure the turnover of HaloTag fusion proteins. J Biol Chem. 2019;294:16164–16171</a></li><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li></ul><p>Схема метода, условные пиктограммы: кривые и полосы показывают логику сравнения, а не данные эксперимента. Данные о препаратах: MG132 — очищенные ферменты, клетки PC12 и эритроциты кролика (Tsubuki 1996, реферат); SAR405 — опухолевые клетки (Ronan 2014, реферат); бафиломицин A1 — жировое тело Drosophila (Mauvezin 2015, реферат); CB-5083 — опухолевые клетки (Anderson 2015, реферат); кифунензин — гепатомные клетки, α1-антитрипсин (Liu 1999, реферат); циклогексимид — Merrill 2019 (реферат); избыточность рецепторов — обзор Adriaenssens 2022. Положение блока кифунензином относительно убиквитинирования выведено из порядка этапов и в рефератах прямо не показано.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 25 из 26</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">В каждом из четырёх вопросов семинара наблюдают разное: связывание, положение белка в клетке, доставку в лизосому, скорость исчезновения. Это разные величины, и каждую измеряют своим методом. Вывод о механизме получают только из сочетания величины, метода и контроля, а не из одного показания.</p><div class="note"><strong>Что показывает схема.</strong> Схема сопоставляет по одному примеру из каждого вопроса семинара: связывание рецептора, митофагия, повреждение лизосомы и маршрут белка. Для каждого примера указаны величина, метод, контроль и граница вывода.</div><ol class="mech"><li>Метод регистрирует определённое свойство: связывание двух белков, положение сигнала, долю доставки в кислый отсек, содержание белка во времени.</li><li>Одно и то же показание допускает несколько объяснений: исчезновение белка внешней мембраны митохондрии возможно и при митофагии, и при разрушении в протеасоме.</li><li>Контроль и генетическое выключение звена сужают число объяснений, но вывод остаётся относящимся к данной системе и данным условиям.</li></ol><p>Сначала выбирают величину, затем метод. Связывание <a href="#ns-g-S12-T02">рецептора</a> с убиквитином или с <a href="#ns-g-S12-T03">белком ATG8</a> выявляют иммунопреципитацией или реконструкцией из очищенных компонентов, а нужность рецептора для процесса — возвратом в клетки без рецепторов. Это разные вопросы: полоса на блоте говорит о связывании, но не о том, что рецептор работает на грузе (Lazarou 2015; Wurzer 2015).</p><p>Доставку митохондрии в лизосому показывают репортёры <a href="#ns-g-S12-T29">mt-Keima</a> и <a href="#ns-g-S12-T30">mito-QC</a>, работу <a href="#ns-g-S12-T16">PINK1</a> — полноразмерный белок и <a href="#ns-g-S12-T22">pS65-убиквитин</a> на блоте. Первые отвечают, дошёл ли материал до кислого отсека, вторые — работает ли киназа; ни то ни другое само по себе не подтверждает, что митофагию запустил именно этот путь (Narendra 2024). Повреждение лизосомы регистрируют по появлению <a href="#ns-g-S12-T34">галектина</a> на лизосоме, по утрате сигнала LysoTracker и по переходу <a href="#ns-g-S12-T43">TFEB</a> в ядро; первая величина отмечает только крупные повреждения (Aits 2015; Meyer, Kravic 2024).</p><p>Маршрут конкретного белка устанавливают по скорости его исчезновения после остановки синтеза и по накоплению под ингибиторами: протеасомы, лизосомной деградации, p97. Каждый препарат имеет побочное действие, а подавление одного маршрута усиливает другие, поэтому накопление под препаратом читают вместе с генетическими контролями (Pohl, Dikic 2019).</p><p>Контроль подбирают так, чтобы исключить другое объяснение: общий белок на той же мембране, мутант без нужного модуля, клетки без звена, ингибитор другого пути. Результат относят к виду, клеткам, воздействию и сроку, в которых он получен.</p><div class="note trap"><strong>Типичная ошибка</strong> Если показание изменилось в ожидаемую сторону, механизм доказан.<p class="trap-fix">Показание отвечает только на тот вопрос, для которого выбрана величина. Убыль белка, полоса на блоте или красные точки совместимы с несколькими механизмами; их различают контролями и генетическим выключением звена в данной системе.</p></div><div class="static-quiz"><h3>В клетках HeLa с Parkin после деполяризации белок матрикса исчез. Какой результат лучше всего подтверждает, что он исчез из-за митофагии, зависящей от PINK1?</h3><ol><li><b>А.</b> Белок внешней мембраны TOMM20 тоже исчез на блоте. <i>(неверный вариант)</i><br><span class="expl">Белки внешней мембраны, помеченные Parkin, разрушает и протеасома, поэтому их убыль не различает митофагию и разрушение в протеасоме.</span></li><li><b>Б.</b> Убыль белка матрикса отсутствует в клетках без PINK1 и в клетках без пяти рецепторов, а в клетках с восстановленным рецептором возвращается. <i>(верный вариант)</i><br><span class="expl">Исчезновение эффекта при выключении звена и его возврат при восстановлении согласуются с зависимостью от PINK1 и рецепторов в этой системе; вывод относится к этим клеткам и воздействию.</span></li><li><b>В.</b> На деполяризованных митохондриях выявлен pS65-убиквитин. <i>(неверный вариант)</i><br><span class="expl">pS65-убиквитин показывает работу PINK1, но не доставку митохондрий в лизосому.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.7554/eLife.08941">Wurzer B., Zaffagnini G., Fracchiolla D. et al. Oligomerization of p62 allows for selection of ubiquitinated cargo and isolation membrane during selective autophagy. eLife. 2015;4:e08941</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li><li><a href="https://doi.org/10.1080/15548627.2015.1063871">Aits S., Kricker J., Liu B. et al. Sensitive detection of lysosomal membrane permeabilization by lysosomal galectin puncta assay. Autophagy. 2015;11:1408–1424</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li></ul><p>Методический шаг: сопоставление методов, а не результат эксперимента. Пиктограммы — схемы операций без численных значений. Примеры взяты из работ с условиями, названными в шагах 6, 12, 18 и 24: Lazarou 2015 (HeLa с Parkin, клетки без пяти рецепторов), Wurzer 2015 (реконструкция и иммунопреципитация), Aits 2015 (клетки человека, LLOMe), Pohl, Dikic 2019 (обзор).</p></details></article><article class="card print-unit" id="ns-capstone"><div class="eyebrow">Исследование · шаг 26 из 26</div><h2>Судьба одного повреждения: от метки до лизосомы</h2><p class="lead">Повреждённый белок, агрегат, митохондрия и лизосома удаляются по-разному, но в цепи удаления повторяются одни и те же звенья: метка, молекула, которая её считывает, и аутофагосома. Различия задают размер и отсек субстрата, доступные метки и общие молекулы, за которые конкурируют маршруты.</p><div class="note"><strong>Что показывает схема.</strong> Схема сопоставляет четыре субстрата: растворимый белок, агрегат, митохондрию и лизосому. Для каждого указаны метка, молекула, которая её считывает, исход и то, что остаётся неизвестным.</div><ol class="mech"><li>Метка (убиквитин, pS65-убиквитин) показывает, что объект изменён; её читает шаперон, протеасома или рецептор. Галектин на лизосоме — признак повреждения: он привлекает белки ответа на повреждение, а мост к ATG8 строят убиквитиновые рецепторы.</li><li>Рецептор привлекает FIP200 и связывается с белками ATG8: аутофагосома строится у груза и сливается с лизосомой.</li><li>Выбор между маршрутами определяется кинетической конкуренцией за общие компоненты, а не единым решающим механизмом.</li></ol><p>Начнём с растворимого белка цитозоля. Его развёрнутые участки узнают <a href="#ns-g-S12-T48">шапероны и CHIP</a>: либо белок свёртывается повторно, либо метится убиквитином и уходит в протеасому. Если шапероны и протеасомы перегружены, молекулы агрегируют (Hipp 2019).</p><p>Агрегат в протеасому не помещается. Убиквитинированный агрегат связывает <a href="#ns-g-S12-T52">p62</a>, и <a href="#ns-g-S12-T02">рецептор</a> привлекает <a href="#ns-g-S12-T07">ULK1–FIP200</a>: аутофагосома строится у груза, а белки <a href="#ns-g-S12-T03">ATG8</a> нужны для слияния с лизосомой (Lazarou 2015; Nguyen 2016). В митохондрии метку создаёт цепочка <a href="#ns-g-S12-T16">PINK1</a> — <a href="#ns-g-S12-T22">pS65-убиквитин</a> — <a href="#ns-g-S12-T23">Parkin</a>; белки внешней мембраны извлекает <a href="#ns-g-S12-T54">p97</a> в протеасому, а OPTN и NDP52 запускают постройку аутофагосомы (Narendra 2024).</p><p>Лизосома устроена иначе: небольшое повреждение мембраны чинят <a href="#ns-g-S12-T36">ESCRT-III</a> и перенос липидов, а неотремонтированную лизосому метят убиквитином, и рецепторы, в первую очередь <a href="#ns-g-S12-T41">TAX1BP1</a>, запускают <a href="#ns-g-S12-T40">лизофагию</a>; пул восстанавливает <a href="#ns-g-S12-T43">TFEB</a> (Eapen 2021; Meyer, Kravic 2024). Критерий, по которому лизосома оказывается в ремонте или в удалении, неизвестен.</p><p>Общие молекулы — Hsp70, убиквитин, p62, p97 — связывают маршруты между собой: при подавлении протеасомы нагрузка на аутофагию растёт (Pohl, Dikic 2019). Схема ниже сводит четыре случая в одну таблицу.</p><div class="note trap"><strong>Типичная ошибка</strong> Для каждого типа повреждения у клетки есть собственный отдельный механизм удаления, никак не связанный с остальными.<p class="trap-fix">Звенья повторяются: метка, рецептор, FIP200, белки ATG8, лизосома. Субстраты различаются размером, отсеком и меткой, а маршруты конкурируют за общие молекулы.</p></div><div class="static-quiz"><h3>Что общего в удалении убиквитинированного агрегата в цитозоле и неотремонтированной лизосомы?</h3><ol><li><b>А.</b> В обоих случаях объект помещается в канал протеасомы после развёртывания. <i>(неверный вариант)</i><br><span class="expl">Агрегат и лизосома слишком велики для канала протеасомы; их удаляет аутофагия.</span></li><li><b>Б.</b> Метка убиквитином считывается рецептором, который привлекает FIP200, и аутофагосома строится у объекта. <i>(верный вариант)</i><br><span class="expl">Такая цепь описана для агрегатов и для лизофагии; набор рецепторов и метки различается, а критерий выбора лизофагии вместо ремонта неизвестен.</span></li><li><b>В.</b> В обоих случаях решение принимает один общий механизм, оценивающий степень повреждения. <i>(неверный вариант)</i><br><span class="expl">Такого механизма не описано: маршруты определяются размером и отсеком субстрата, метками и конкуренцией за общие молекулы.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-12.html#q1">Вопрос 1 →</a> <a href="seminar-12.html#q2">Вопрос 2 →</a> <a href="seminar-12.html#q3">Вопрос 3 →</a> <a href="seminar-12.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-019-0101-y">Hipp M.S., Kasturi P., Hartl F.U. The proteostasis network and its decline in ageing. Nat Rev Mol Cell Biol. 2019;20:421–435</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1083/jcb.201607039">Nguyen T.N., Padman B.S., Usher J., Oorschot V., Ramm G., Lazarou M. Atg8 family LC3/GABARAP proteins are crucial for autophagosome–lysosome fusion but not autophagosome formation during PINK1/Parkin mitophagy and starvation. J Cell Biol. 2016;215:857–874</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li><li><a href="https://doi.org/10.7554/eLife.72328">Eapen V.V., Swarup S., Hoyer M.J., Paulo J.A., Harper J.W. Quantitative proteomics reveals the selectivity of ubiquitin-binding autophagy receptors in the turnover of damaged lysosomes by lysophagy. eLife. 2021;10:e72328</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1126/science.aax3769">Pohl C., Dikic I. Cellular quality control by the ubiquitin-proteasome system and autophagy. Science. 2019;366:818–822</a></li></ul><p>Итоговая схема: качественное сопоставление выводов шагов 1–24. Данные получены на разных объектах: клетки HeLa с Parkin (митофагия, рецепторы), клетки человека с импульсом LLOMe (лизосома), обзоры по протеостазу. Доли молекул, идущих по каждому маршруту, в источниках не заданы.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S12-T01"><dt>Селективная аутофагия</dt><dd>Аутофагия, при которой в аутофагосому упаковывается определённый груз: белковые агрегаты, повреждённые органеллы, бактерии. Груз помечен, например убиквитином, и связан с <a href="#ns-g-S12-T02">рецептором</a>. Отличается от неселективной аутофагии при голодании, когда захватывается цитоплазма без отбора груза.</dd></div><div id="ns-g-S12-T02"><dt>Рецептор селективной аутофагии</dt><dd>Белок, который связывает груз и белки <a href="#ns-g-S12-T03">ATG8</a> на мембране фагофора и, как правило, привлекает к грузу белки инициации аутофагии. Бывает растворимым (p62, NBR1, TAX1BP1, NDP52, OPTN) и встроенным в мембрану органеллы (BNIP3, NIX, FUNDC1, FAM134B). Разрушается вместе с грузом. В литературе его называют также рецептором груза; не путать с рецептором плазматической мембраны.</dd></div><div id="ns-g-S12-T03"><dt>Белки семейства ATG8 (LC3 и GABARAP)</dt><dd>Шесть белков человека, подобных убиквитину: три LC3 и три GABARAP. Ковалентно присоединены к липиду мембраны фагофора и узнаются мотивом <a href="#ns-g-S12-T05">LIR</a>. В клетках HeLa без всех шести белков аутофагосомы образуются, но не сливаются с лизосомой (Nguyen 2016).</dd></div><div id="ns-g-S12-T04"><dt>Убиквитин-связывающий домен (UBD)</dt><dd>Участок рецептора, который узнаёт убиквитин. У разных рецепторов он разный: UBA у p62 и NBR1, UBZ у TAX1BP1, UBAN у OPTN, цинковые пальцы (ZnF) у NDP52. Сродство одиночного UBD к убиквитину невелико.</dd></div><div id="ns-g-S12-T05"><dt>Мотив LIR</dt><dd>Короткая последовательность длиной 15–20 аминокислот, которая связывается с LIR-связывающим участком (LDS) белков <a href="#ns-g-S12-T03">ATG8</a>. Название образовано от английского LC3-interacting region (Johansen &amp; Lamark 2020).</dd></div><div id="ns-g-S12-T06"><dt>Участок связывания FIP200 (FIR) и домен SKICH</dt><dd>FIR — короткий участок, которым рецептор связывает FIP200; название условное и относится к участку, а не к отдельному белку. NDP52 связывает FIP200 доменом SKICH, а у p62 участок связывания FIP200 (остатки 326–380) перекрывается с <a href="#ns-g-S12-T05">LIR</a>.</dd></div><div id="ns-g-S12-T07"><dt>Комплекс ULK1–FIP200</dt><dd>Комплекс начала построения аутофагосомы: протеинкиназа ULK1 с каркасным белком FIP200 и другими субъединицами. Привлечённый <a href="#ns-g-S12-T02">рецептором</a> к грузу, запускает построение мембраны у груза.</dd></div><div id="ns-g-S12-T08"><dt>Авидность</dt><dd>Суммарная прочность связи, возникающая при одновременном образовании нескольких слабых контактов. Сродство каждого контакта при этом не меняется, а частица отсоединяется медленнее. Пример: олигомер p62 дольше удерживается на поверхности с плотно расположенным LC3B, чем p62 без домена PB1 (Wurzer 2015).</dd></div><div id="ns-g-S12-T09"><dt>Конденсат p62</dt><dd>Скопление p62 и убиквитинированных белков без мембраны, возникающее при фазовом разделении. В пробирке для него нужны полимеризация p62 и цепь убиквитина; в работе Sun 2018 фазовое разделение вызывала цепь K63, а в клетках описаны жидкоподобные капли p62.</dd></div><div id="ns-g-S12-T10"><dt>Киназа TBK1</dt><dd>Протеинкиназа, которая фосфорилирует рецепторы OPTN, NDP52, TAX1BP1 и p62 (Richter 2016). Фосфорилирование UBAN у OPTN по Ser473 расширяет набор цепей убиквитина, которые он узнаёт (Richter 2016).</dd></div><div id="ns-g-S12-T11"><dt>Мембранный рецептор</dt><dd>Рецептор, встроенный в мембрану органеллы: BNIP3, NIX и FUNDC1 в наружной мембране митохондрии, FAM134B в мембране ЭПР. Путь не начинается с убиквитинирования поверхности органеллы. BNIP3 и NIX включаются димеризацией, FUNDC1 — дефосфорилированием (Adriaenssens 2022).</dd></div><div id="ns-g-S12-T12"><dt>N-дегрон</dt><dd>Сигнал деградации на N-конце белка. В работе Cha-Molstad 2015 N-концевой аргинин (Nt-Arg) белка BiP связывался с ZZ-доменом p62, вызывал олигомеризацию p62 и усиливал его связь с LC3, и BiP разрушался вместе с p62 (клетки человека).</dd></div><div id="ns-g-S12-T13"><dt>Фагофор</dt><dd>Растущая мембранная структура, из которой после замыкания образуется аутофагосома; на её мембране находятся белки <a href="#ns-g-S12-T03">ATG8</a>. Другое название — изолирующая мембрана. Формируется заново, а не из готовой органеллы.</dd></div><div id="ns-g-S12-T14"><dt>Совместная иммунопреципитация и pull-down</dt><dd>Методы выявления физического взаимодействия: белок-наживку (например, GST-LC3B) инкубируют с лизатом клеток или очищенным белком, гранулы промывают, связанный белок выявляют иммуноблотом. Слабые обратимые контакты при промывке теряются.</dd></div><div id="ns-g-S12-T15"><dt>Колокализация</dt><dd>Совпадение положения двух меток на изображении клетки. Показывает, что молекулы находятся рядом в пределах разрешения микроскопа, но не показывает прямого контакта.</dd></div><div id="ns-g-S12-T16"><dt>PINK1 (PTEN-induced kinase 1)</dt><dd>Киназа с митохондриальной сигнальной последовательностью; ген PINK1 (PARK6). Синтезируется постоянно: в здоровой митохондрии импортируется, разрезается и быстро разрушается (период полужизни около 27 мин в клетках человека). При остановке импорта остаётся на внешней мембране в комплексе с <a href="#ns-g-S12-T18">TOM</a>, образует димеры и автофосфорилируется по S228 и S402 (PINK1 человека). Фосфорилирует убиквитин и <a href="#ns-g-S12-T23">Parkin</a> по S65 (Kane 2014; Koyano 2014). Потеря функции обоих аллелей гена вызывает рецессивную форму болезни Паркинсона с ранним началом. На схемах положение отдельных доменов PINK1 не показано.</dd></div><div id="ns-g-S12-T17"><dt>Мембранный потенциал митохондрии (Δψ)</dt><dd>Разность электрических потенциалов на внутренней мембране митохондрии: со стороны матрикса заряд отрицательный. Создаётся дыхательной цепью и служит основной движущей силой импорта белков с положительно заряженными N-концевыми сигнальными последовательностями, в том числе <a href="#ns-g-S12-T16">PINK1</a>. Утрата потенциала (деполяризация) останавливает импорт. На схемах состояния «есть» и «утрачен» качественные, значения в милливольтах не приводятся.</dd></div><div id="ns-g-S12-T18"><dt>Транслоказы TOM и TIM23</dt><dd>TOM — транслоказа внешней мембраны, пора которой образована белком TOM40; TIM23 (вместе с TIM17) — транслоказа внутренней мембраны. Предшественники белков с N-концевой сигнальной последовательностью проходят через оба комплекса. При утрате потенциала N-конец <a href="#ns-g-S12-T16">PINK1</a> остаётся продетым через TOM и удержанным у TIM17/TIM23 (суперкомплекс TOM–TIM23), а киназный домен обращён в цитозоль. На схемах комплексы показаны как единые блоки, без субъединиц.</dd></div><div id="ns-g-S12-T19"><dt>PARL</dt><dd>Ромбоидная протеаза внутренней мембраны (presenilin-associated rhomboid-like). Разрезает <a href="#ns-g-S12-T16">PINK1</a> в трансмембранном сегменте непосредственно перед F104 (PINK1 человека), после того как протеаза матрикса MPP снимет сигнальную последовательность. Расщепление зависит от потенциала: при его утрате PINK1 до PARL не доходит. Без PARL PINK1 остаётся внутри митохондрии в форме около 60 кДа.</dd></div><div id="ns-g-S12-T20"><dt>N-дегрон и убиквитинлигазы UBR1, UBR2, UBR4</dt><dd>N-дегрон — N-концевой остаток, по которому убиквитинлигазы узнают белок и направляют на разрушение (правило N-конца). После разреза PARL N-конец <a href="#ns-g-S12-T16">PINK1</a> — остаток фенилаланина; фрагмент узнают убиквитинлигазы UBR1, UBR2 и UBR4, после чего его разрушает протеасома. Так объясняют очень короткий срок жизни PINK1 в здоровой митохондрии.</dd></div><div id="ns-g-S12-T21"><dt>CCCP</dt><dd>Карбонилцианид-м-хлорфенилгидразон — протонофор: переносит H⁺ через внутреннюю мембрану митохондрии и рассеивает <a href="#ns-g-S12-T17">потенциал</a> одновременно во всех митохондриях клетки. Стандартное воздействие в экспериментах на культурах клеток для запуска пути PINK1–Parkin. В организме повреждение чаще частичное и локальное, поэтому CCCP — удобная, но грубая модель; в части работ потенциал рассеивали олигомицином с антимицином A.</dd></div><div id="ns-g-S12-T22"><dt>pS65-убиквитин</dt><dd>Убиквитин, фосфорилированный киназой <a href="#ns-g-S12-T16">PINK1</a> по серину 65. Образуется на цепях убиквитина, присоединённых к белкам внешней мембраны. Связывается с <a href="#ns-g-S12-T23">Parkin</a> и освобождает его убиквитиноподобный домен; служит меткой для рецепторов OPTN и NDP52. Фосфорилирование убиквитина киназой PINK1 показано в клетках и in vitro (Kane 2014; Koyano 2014).</dd></div><div id="ns-g-S12-T23"><dt>Parkin (PRKN)</dt><dd>E3-убиквитинлигаза типа RBR (ген PRKN, PARK2). Состоит из убиквитиноподобного домена UBL, RING0 (UPD), RING1, IBR, REP и RING2; каталитический остаток — C431 в RING2 (Parkin человека). В покое аутоингибирован: UBL, RING0 и REP закрывают сайт связывания E2 и активный центр. Включается при связывании <a href="#ns-g-S12-T22">pS65-убиквитина</a> с RING1 и фосфорилировании S65 в UBL киназой <a href="#ns-g-S12-T16">PINK1</a>. Потеря функции обоих аллелей гена вызывает рецессивную форму болезни Паркинсона с ранним началом. На схеме домены показаны условно, без структуры.</dd></div><div id="ns-g-S12-T24"><dt>Митофузины MFN1 и MFN2</dt><dd>ГТФазы внешней мембраны митохондрии, обеспечивающие слияние митохондрий. Среди субстратов <a href="#ns-g-S12-T23">Parkin</a> убиквитинируются предпочтительно; их извлекает из мембраны <a href="#ns-g-S12-T25">p97</a>, а разрушает протеасома, в том числе при заблокированной митофагии. Убыль MFN2 на иммуноблоте показывает работу Parkin и протеасомы, но не удаление митохондрии. На схемах
