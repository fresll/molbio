<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 12 · Селективная аутофагия и контроль качества органелл — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ревизия сайта 25.10.2026 (версия 3.9): переход между семинарами, «К выводу», фокус справок, телефонная схема */
.semnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.semnav a,.semnav .sn-soon{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.semnav a:hover,.semnav a:focus-visible{border-color:var(--u-ui,#006CA3);outline:none;box-shadow:0 0 0 2px var(--u-ui,#006CA3) inset}
.semnav .sn-next,.semnav .sn-soon{text-align:right}
.semnav .sn-k{display:block;font-weight:700;font-size:14px;color:var(--u-ui,#006CA3)}

}

тор не может с ними связаться: с рецептором связано {f} % груза. ULK1–FIP200 привлечён к {fip} % груза, фагофор прилегает к {atg} %, индекс доставки {d} %.", "s1b_c_noubd_z": "Модули LIR и FIR связывают партнёров рецептора, но в модели удерживать рецептор у груза может лишь UBD. Без него рецептор не сводит груз ни с инициирующим комплексом, ни с мембраной.", "s1b_c_olf": "Рецептор олигомеризуется через PB1: на грузе могут связаться до {u} копий. При {n} метках с рецептором связано {f} % груза. LIR и FIR без мутаций: ULK1–FIP200 привлечён к {fip} % груза, фагофор прилегает через ATG8 к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_olf_z": "Несколько слабых контактов, занятых одновременно, удерживают груз надёжнее одного: число меток и олигомеризация рецептора вместе определяют, какая часть груза связана. Связанный груз получает обе функции рецептора: инициацию через ULK1–FIP200 и мост с ATG8. Так физический адаптер работает целиком.", "s1b_c_oxf": "Рецептор олигомеризуется через PB1: на грузе могут связаться до {u} копий. При {n} метках с рецептором связано {f} % груза. LIR мутирован: ULK1–FIP200 привлечён к {fip} % груза, а связь с ATG8 почти утрачена, фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_oxf_z": "Несколько слабых контактов, занятых одновременно, удерживают груз надёжнее одного: число меток и олигомеризация рецептора вместе определяют, какая часть груза связана. Без LIR инициация через ULK1–FIP200 сохраняется, а мост с ATG8 слаб. В клетках HeLa с Parkin потеря связи с ATG8 замедляла митофагию, но не останавливала её (Padman 2019).", "s1b_c_olx": "Рецептор олигомеризуется через PB1: на грузе могут связаться до {u} копий. При {n} метках с рецептором связано {f} % груза. FIR мутирован: ULK1–FIP200 привлечён к {fip} % груза. Мост с ATG8 цел, но без инициирующего комплекса мембраны у груза мало, и фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_olx_z": "Несколько слабых контактов, занятых одновременно, удерживают груз надёжнее одного: число меток и олигомеризация рецептора вместе определяют, какая часть груза связана. Без FIR инициирующий комплекс не привлекается, а мембрана с ATG8 строится после его привлечения (Turco 2019; Vargas 2019; Ravenhill 2019). Мост через LIR цел, но связывать ему нечего.", "s1b_c_oxx": "Рецептор олигомеризуется через PB1: на грузе могут связаться до {u} копий. При {n} метках с рецептором связано {f} % груза. LIR и FIR мутированы: рецептор связан с грузом, но не связывает ни ATG8, ни ULK1–FIP200. ULK1–FIP200 привлечён к {fip} % груза, фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_oxx_z": "Несколько слабых контактов, занятых одновременно, удерживают груз надёжнее одного: число меток и олигомеризация рецептора вместе определяют, какая часть груза связана. Рецептор лишь находится на грузе: нет ни инициации, ни моста с мембраной, поэтому связанный груз всё равно не доставляется.", "s1b_c_mlf": "Рецептор мономерный (PB1 не работает): на одной частице груза одновременно занят не более чем один контакт UBD–убиквитин. При {n} метках с рецептором связано {f} % груза. LIR и FIR без мутаций: ULK1–FIP200 привлечён к {fip} % груза, фагофор прилегает через ATG8 к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_mlf_z": "Один слабый контакт занят редко, и сколько бы меток ни нёс груз, связанной остаётся меньшая его часть. Связанный груз получает обе функции рецептора: инициацию через ULK1–FIP200 и мост с ATG8. Так физический адаптер работает целиком.", "s1b_c_mxf": "Рецептор мономерный (PB1 не работает): на одной частице груза одновременно занят не более чем один контакт UBD–убиквитин. При {n} метках с рецептором связано {f} % груза. LIR мутирован: ULK1–FIP200 привлечён к {fip} % груза, а связь с ATG8 почти утрачена, фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_mxf_z": "Один слабый контакт занят редко, и сколько бы меток ни нёс груз, связанной остаётся меньшая его часть. Без LIR инициация через ULK1–FIP200 сохраняется, а мост с ATG8 слаб. В клетках HeLa с Parkin потеря связи с ATG8 замедляла митофагию, но не останавливала её (Padman 2019).", "s1b_c_mlx": "Рецептор мономерный (PB1 не работает): на одной частице груза одновременно занят не более чем один контакт UBD–убиквитин. При {n} метках с рецептором связано {f} % груза. FIR мутирован: ULK1–FIP200 привлечён к {fip} % груза. Мост с ATG8 цел, но без инициирующего комплекса мембраны у груза мало, и фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_mlx_z": "Один слабый контакт занят редко, и сколько бы меток ни нёс груз, связанной остаётся меньшая его часть. Без FIR инициирующий комплекс не привлекается, а мембрана с ATG8 строится после его привлечения (Turco 2019; Vargas 2019; Ravenhill 2019). Мост через LIR цел, но связывать ему нечего.", "s1b_c_mxx": "Рецептор мономерный (PB1 не работает): на одной частице груза одновременно занят не более чем один контакт UBD–убиквитин. При {n} метках с рецептором связано {f} % груза. LIR и FIR мутированы: рецептор связан с грузом, но не связывает ни ATG8, ни ULK1–FIP200. ULK1–FIP200 привлечён к {fip} % груза, фагофор прилегает к {atg} %. Индекс доставки за 60 мин: {d} %.", "s1b_c_mxx_z": "Один слабый контакт занят редко, и сколько бы меток ни нёс груз, связанной остаётся меньшая его часть. Рецептор лишь находится на грузе: нет ни инициации, ни моста с мембраной, поэтому связанный груз всё равно не доставляется.", "s1b_take": "Рецептор — физический адаптер с тремя видами контактов: UBD узнаёт метки убиквитина на грузе, LIR удерживает белки ATG8 на мембране фагофора, FIR привлекает комплекс ULK1–FIP200, с которого начинается построение аутофагосомы. Каждый контакт слаб, поэтому груз связывается, когда одновременно заняты несколько контактов: важны число меток и олигомеризация рецептора через PB1. Потеря UBD разрывает связь с грузом, потеря FIR — с инициирующим комплексом, потеря LIR — с мембраной, но последствия различаются: в этой модели без FIR доставка падает сильнее, чем без LIR.", "p1b_1_q": "Рецептор олигомеризуется через PB1; на грузе одна метка убиквитина. Число меток увеличили до четырёх. Как изменится доля груза, связанная с рецептором?", "p1b_1_o1": "Возрастёт в несколько раз", "p1b_1_o2": "Возрастёт, но останется меньше четверти", "p1b_1_o3": "Не изменится", "p1b_1_e": "У олигомера несколько копий UBD, и при нескольких метках одновременно занимаются несколько контактов. Второй и третий контакты удерживают рецептор на грузе надёжнее первого, поэтому связанная доля растёт нелинейно: в модели с 14 до 80 %.", "p1b_1_w2": "Такой небольшой прирост дал бы мономерный рецептор, у которого одновременно занят один контакт: в модели с 4 до 14 %. У олигомера каждая новая метка добавляет возможность второго и третьего контакта.", "p1b_1_w3": "Сродство одного UBD к убиквитину действительно не меняется, но число меток определяет, сколько контактов может быть занято одновременно. Для олигомера это число растёт вместе с числом меток.", "p1b_2_q": "Груз несёт шесть меток, рецептор олигомеризуется, LIR и FIR без мутаций. У рецептора удалили UBD. Как изменится привлечение ULK1–FIP200 к грузу?", "p1b_2_o1": "Не изменится, так как FIR цел", "p1b_2_o2": "Снизится частично: рецептор удерживается через LIR", "p1b_2_o3": "Снизится почти до нуля", "p1b_2_e": "В модели UBD — единственный модуль, который связывает рецептор с грузом. Без него рецептор не остаётся на грузе, и его FIR не приближает ULK1–FIP200: привлечение падает с 78 до 0 %.", "p1b_2_w1": "Привлечение ULK1–FIP200 к грузу идёт через рецептор, который находится на грузе. Без UBD рецептор груз не удерживает, и целость FIR для груза значения не имеет.", "p1b_2_w2": "Рецепторы без UBD привлекались к митохондриям через LIR, если в клетке был ещё рецептор с функциональным UBD (Padman 2019). В модели рецептор один, поэтому удерживать его нечему.", "p1b_3_q": "Груз несёт шесть меток, рецептор олигомеризуется, все модули без мутаций; индекс доставки 68 %. В LIR внесли мутацию. Как изменится индекс доставки в аутофагосому?", "p1b_3_o1": "Упадёт почти до нуля", "p1b_3_o2": "Снизится частично", "p1b_3_o3": "Не изменится", "p1b_3_e": "LIR удерживает ATG8 и тем самым прижимает фагофор к грузу, но ULK1–FIP200 по-прежнему привлекается через FIR (78 % груза), и фагофор строится. Индекс снижается частично: с 68 до 49 %. В клетках HeLa с Parkin связывание с ATG8 не обязательно для охвата митохондрии мембраной, но ускоряет митофагию (Nguyen 2016; Padman 2019).", "p1b_3_w1": "Индекс упал бы почти до нуля при потере инициации: мутации FIR или делеции UBD. Мутация LIR не мешает привлечению ULK1–FIP200 к грузу.", "p1b_3_w3": "Мост с ATG8 вносит вклад в доставку: в модели без него индекс снижается. Но в клетках HeLa с Parkin связь с ATG8 для охвата митохондрии не обязательна, она ускоряет митофагию (Nguyen 2016; Padman 2019).", "p1b_4_q": "Груз несёт шесть меток, рецептор олигомеризуется, все модули без мутаций; фагофор прилегает через ATG8 к 54 % груза. В FIR внесли мутацию. Как изменится прилегание фагофора к грузу?", "p1b_4_o1": "Снизится в несколько раз", "p1b_4_o2": "Не изменится, так как LIR цел", "p1b_4_o3": "Возрастёт, так как рецептор чаще связывает ATG8", "p1b_4_e": "Мембрана с ATG8 строится после привлечения ULK1–FIP200 к грузу (Turco 2019; Vargas 2019; Ravenhill 2019). Без FIR привлечение падает с 78 до 8 %, мембраны у груза мало, и целому LIR нечего связывать: прилегание снижается с 54 до 12 %.", "p1b_4_w2": "Мост с ATG8 нужен фагофору, который уже построен. Здесь же построение начинается с привлечения ULK1–FIP200 через FIR, поэтому при мутации FIR у груза почти нет мембраны.", "p1b_4_w3": "Мутация FIR не освобождает LIR: число копий рецептора на грузе и состояние LIR прежние. Прилегание определяется наличием мембраны с ATG8 у груза, а она зависит от привлечения ULK1–FIP200.", "p1b_5_q": "Рецептор и все его модули без мутаций, груз несёт шесть меток, индекс доставки 68 %. Метки убиквитина с груза убрали. Как изменится индекс доставки?", "p1b_5_o1": "Снизится вдвое, так как остальные модули работают", "p1b_5_o2": "Не изменится, так как рецептор связывается с грузом и без метки", "p1b_5_o3": "Упадёт почти до нуля", "p1b_5_e": "Рецептор этого типа узнаёт груз по метке: UBD связывает убиквитин. Без метки рецептор на грузе не удерживается, ни ULK1–FIP200, ни фагофор к грузу не приближаются, и индекс падает с 68 до 0 %, хотя LIR, FIR и PB1 без мутаций.", "p1b_5_w1": "LIR, FIR и PB1 работают только на грузе, который рецептор удерживает. Без меток этого нет, поэтому индекс не снижается вдвое, а исчезает.", "p1b_5_w2": "В модели рецептор связывается с грузом через UBD и метку убиквитина. Так обеспечивается избирательность: немеченый груз рецептор не доставляет.", "s1a_area": "клетки HeLa без пяти рецепторов, с Parkin,", "s1a_area2": "после олигомицина и антимицина A (O/A)", "s1a_mito": "митохондрия", "s1a_n_none": "рецептора нет", "s1a_n_optn": "OPTN", "s1a_n_ndp": "NDP52", "s1a_n_tax": "TAX1BP1", "s1a_n_p62": "p62", "s1a_n_hid": "рецептор: ?", "s1a_mn_none": "связать метку и ATG8 некому", "s1a_mn_wt": "дикий тип", "s1a_mn_hid": "мутация: ?", "s1a_mn_optn_ubd": "UBAN: D474N", "s1a_mn_optn_lir": "LIR: F178A", "s1a_mn_ndp_ubd": "ZnF: делеция", "s1a_mn_ndp_lir": "LIR: V136S", "s1a_mn_ndp_fip": "SKICH: делеция", "s1a_tbk": "TBK1", "s1a_tbk_s": "TBK1 фосфорилирует", "s1a_tbk_s2": "рецептор", "s1a_cells_t": "mt-Keima: 10 клеток (условная пиктограмма)", "s1a_lg_g": "жёлтый — митохондрия в цитозоле", "s1a_lg_r": "красный — митохондрия в кислом отсеке (лизосоме)", "s1a_mask": "Рецептор и мутация скрыты", "s1a_mask2": "Определите по показаниям, какая функция рецептора нарушена", "s1a_t_rec": "Рецептор, восстановленный в клетках", "gt_q1_r0": "нет", "gt_q1_roptn": "OPTN", "gt_q1_rndp": "NDP52", "gt_q1_rtax": "TAX1BP1", "gt_q1_rp62": "p62", "s1a_t_mut": "Мутация рецептора", "gt_q1_m0": "нет", "gt_q1_mubd": "UBD", "gt_q1_mlir": "LIR", "gt_q1_mfip": "связывание FIP200", "s1a_t_tbk": "TBK1 в клетках есть", "s1a_av_none": "Мутации и TBK1 не изучаются: рецептора нет.", "s1a_av_optn": "Для OPTN в использованных работах есть мутации UBD и LIR; участок связывания FIP200 у OPTN не определён.", "s1a_av_ndp": "Для NDP52 в использованных работах есть мутации UBD, LIR и связывания FIP200 (домен SKICH).", "s1a_av_other": "Для этого рецептора в использованных работах нет ни мутантов, ни экспериментов без TBK1: кнопки отключены.", "s1a_reveal": "Показать рецептор и мутацию", "s1a_r_head": "Условные уровни: 100 % — OPTN или NDP52 дикого типа", "s1a_r_rec": "Рецептор на митохондриях, 3 ч", "s1a_r_fip": "Комплекс ULK1–FIP200 на митохондриях, 3 ч", "s1a_r_keima": "Клетки с красными митохондриями mt-Keima, 6 ч", "s1a_nd": "не определяли", "s1a_plot_t": "Клетки с красными митохондриями mt-Keima во времени", "s1a_ax_t": "время после O/A, ч", "s1a_ax_m": "% от дикого типа OPTN", "s1a_l_cur": "выбранный вариант", "s1a_l_ref": "OPTN дикого типа", "s1a_plot_note": "Кривая учебная: форма задана условно, уровень к 6 ч соответствует показанию выше. Качественные ориентиры — работы на клетках HeLa без пяти рецепторов (Lazarou 2015; Padman 2019; Vargas 2019), где митофагию оценивали по mt-Keima и по деградации CoxII.", "s1a_c_none": "Ни одного из пяти рецепторов в клетках нет. Метки убиквитина на митохондриях есть, но связывать их с аутофагосомой некому: ULK1–FIP200 на митохондриях остаётся на остаточном уровне ({f} %), красных митохондрий почти нет ({m} %).", "s1a_c_none_z": "Метка на грузе сама не привлекает ни комплекс ULK1–FIP200, ни мембрану с ATG8: нужен рецептор, который их соединяет (Lazarou 2015).", "s1a_c_p62": "p62 приходит к митохондриям ({r} %), но ULK1–FIP200 привлекается не лучше, чем без рецепторов ({f} %), и митофагия не восстанавливается ({m} %).", "s1a_c_p62_z": "Связывание с меткой — лишь одна из функций адаптера. В этих клетках p62 не обеспечивает вторую, привлечение инициирующего комплекса (Lazarou 2015), и не привлекает белки ATG8 к митохондриям (Padman 2019).", "s1a_c_tax": "TAX1BP1 приходит к митохондриям ({r} %) и восстанавливает митофагию лишь отчасти ({m} % от уровня при OPTN или NDP52). Привлечение ULK1–FIP200 в использованных работах не определяли.", "s1a_c_tax_z": "По строению TAX1BP1 близок к NDP52, но в этих клетках митофагию восстанавливает слабее: сходство доменов не гарантирует сходства функции (Lazarou 2015).", "s1a_c_optn_wt": "OPTN дикого типа: рецептор на митохондриях ({r} %), ULK1–FIP200 привлечён ({f} %), митофагия восстановлена ({m} %).", "s1a_c_optn_wt_z": "Выполняются все функции адаптера: узнавание метки, привлечение инициирующего комплекса и связь с ATG8. Уровень 100 % — условный эталон: OPTN и NDP52 дикого типа восстанавливали митофагию в этих клетках (Lazarou 2015).", "s1a_c_ndp_wt": "NDP52 дикого типа: рецептор на митохондриях ({r} %), ULK1–FIP200 привлечён ({f} %), митофагия восстановлена ({m} %).", "s1a_c_ndp_wt_z": "NDP52 связывает метку цинковыми пальцами, FIP200 — доменом SKICH, ATG8 — неканоническим LIR (Vargas 2019; Padman 2019). Уровень 100 % — условный эталон.", "s1a_c_optn_ubd": "OPTN с заменой D474N в UBAN не приходит к митохондриям ({r} %). В модели ULK1–FIP200 остаётся на уровне клеток без рецепторов ({f} %), митофагии нет ({m} %).", "s1a_c_optn_ubd_z": "Без узнавания метки остальные модули рецептора остаются вдали от груза: ни LIR, ни участок связывания FIP200 сами груз не находят (Lazarou 2015).", "s1a_c_ndp_ubd": "NDP52 без цинковых пальцев не приходит к митохондриям ({r} %). В модели ULK1–FIP200 остаётся на уровне клеток без рецепторов ({f} %), митофагии нет ({m} %).", "s1a_c_ndp_ubd_z": "Цинковые пальцы NDP52 удерживают его на метке. Без них SKICH и LIR остаются без груза: узнавание метки — условие остальных функций (Lazarou 2015; Padman 2019).", "s1a_c_optn_lir": "OPTN с заменой F178A в LIR приходит к митохондриям медленнее ({r} % через 3 ч). В модели ULK1–FIP200 привлекается слабее ({f} %), митофагия замедлена ({m} %).", "s1a_c_optn_lir_z": "ATG8 на растущем фагофоре удерживают рецепторы через LIR и усиливают их привлечение к митохондриям (Padman 2019). Без LIR узнавание метки идёт, но обратная связь слабее. В работе Lazarou 2015 замена F178A привлечению ULK1 не мешала; сниженные значения в модели — учебное допущение по данным Padman 2019 о замедлении митофагии.", "s1a_c_ndp_lir": "NDP52 с заменой V136S в LIR приходит к митохондриям медленнее ({r} % через 3 ч). В модели ULK1–FIP200 привлекается слабее ({f} %), митофагия идёт заметно хуже ({m} %).", "s1a_c_ndp_lir_z": "Различие между OPTN и NDP52 в модели учебное: в клетках с Parkin замены в LIR замедляли привлечение обоих рецепторов (Padman 2019). Другая работа в клетках без OPTN, NDP52 и TAX1BP1 такого дефекта не нашла (Vargas 2019).", "s1a_c_ndp_fip": "NDP52 без домена SKICH приходит к митохондриям ({r} %), но ULK1–FIP200 не привлекается ({f} %) и митофагия почти не идёт ({m} %).", "s1a_c_ndp_fip_z": "Узнавание метки и связывание FIP200 — разные функции: рецептор на грузе, а инициации нет (Vargas 2019, принудительная посадка NDP52 на митохондрию в HeLa).", "s1a_c_myst": "Рецептор и мутация скрыты. Известно лишь, что восстановлен один из двух рецепторов, восстанавливающих митофагию в этих клетках, и что TBK1 есть. По трём показаниям определите, какая функция рецептора нарушена.", "s1a_c_myst_z": "Сопоставьте, какой показатель сохранён, а какой снижен: узнавание метки, привлечение инициирующего комплекса и связь с ATG8 затрагивают показатели по-разному.", "s1a_ctk_optn": "TBK1 в клетках нет, а OPTN — единственный рецептор: его привлечение к митохондриям и остальные показатели снижены.", "s1a_ctk_optn_z": "TBK1 фосфорилирует OPTN и усиливает его связывание с убиквитином и ATG8; при отсутствии NDP52 митофагия через OPTN нуждается в TBK1 (Lazarou 2015; Richter 2016; Padman 2019).", "s1a_ctk_ndp": "TBK1 в клетках нет: уровень NDP52 на митохондриях не меняется, но ULK1–FIP200 удерживается хуже, а митофагия идёт медленнее.", "s1a_ctk_ndp_z": "У NDP52 зависимость от TBK1 слабее, чем у OPTN: TBK1 укрепляет связь NDP52 с FIP200 (Vargas 2019). В работе Lazarou 2015 нокаут TBK1 при наличии NDP52 митофагию не нарушал; различие в модели отражено умеренным снижением.", "s1a_take": "Рецептор должен выполнять три функции: узнать метку на грузе, привлечь комплекс ULK1–FIP200 и связать ATG8. Без узнавания метки (UBD) рецептор не приходит к грузу и теряет остальные функции. Без связывания FIP200 он приходит, но не запускает построение аутофагосомы. Без LIR запуск идёт, но обратная связь через ATG8 слабее и митофагия замедляется. p62 и TAX1BP1 приходят к митохондриям, но восстанавливают митофагию хуже OPTN и NDP52. Выводы относятся к клеткам HeLa с Parkin и рецепторами, введёнными в клетки без пяти рецепторов.", "p1a_1_q": "В клетках HeLa без пяти рецепторов, с Parkin, после O/A красных митохондрий mt-Keima почти нет (3 % от уровня при OPTN). Восстановили p62. Как изменится доля клеток с красными митохондриями к 6 ч?", "p1a_1_o1": "Возрастёт до уровня OPTN", "p1a_1_o2": "Возрастёт примерно вдвое", "p1a_1_o3": "Останется на уровне клеток без рецепторов", "p1a_1_e": "p62 приходит к митохондриям (0 → 100 %), но комплекс ULK1–FIP200 не привлекает: его уровень остаётся прежним, 20 %. Без инициации аутофагосома у митохондрии не строится, и доля клеток с красными митохондриями остаётся 3 % (Lazarou 2015; Padman 2019).", "p1a_1_w1": "OPTN восстанавливает митофагию, потому что привлекает ULK1–FIP200. p62 в этих клетках к митохондриям приходит, но этой функции не выполняет, и одного присутствия на грузе недостаточно.", "p1a_1_w2": "Частичное восстановление наблюдали у TAX1BP1 (в модели 40 % от уровня OPTN). У p62 в этих клетках оно не обнаружено: показание не отличается от клеток без рецепторов.", "p1a_2_q": "В клетках восстановлен NDP52 дикого типа, ULK1–FIP200 на митохондриях привлечён (100 %). Цинковые пальцы NDP52 удалили. Как изменится привлечение ULK1–FIP200 к митохондриям?", "p1a_2_o1": "Снизится почти до уровня клеток без рецепторов", "p1a_2_o2": "Не изменится, так как домен SKICH цел", "p1a_2_o3": "Снизится вдвое: рецептор удерживается через LIR", "p1a_2_e": "Цинковые пальцы NDP52 — его UBD. Без них рецептор не приходит к митохондриям (5 % вместо 100 %), и его SKICH не может привлечь комплекс: в модели уровень ULK1–FIP200 падает со 100 до 20 %, до уровня клеток без рецепторов (учебное допущение; Lazarou 2015; Padman 2019).", "p1a_2_w2": "SKICH связывает FIP200 только у рецептора, находящегося на грузе. Рецептор без UBD на митохондрии не приходит, поэтому цел SKICH или нет, для митохондрии значения не имеет.", "p1a_2_w3": "Через LIR рецептор привлекается к мембране с ATG8 лишь после того, как она построена. Без исходного узнавания метки такой мембраны у митохондрии нет, и удерживаться рецептору не на чем. При наличии другого рецептора с работающим UBD такой мутант наблюдали на митохондриях (Padman 2019).", "p1a_3_q": "В клетках восстановлен NDP52 дикого типа, рецептор на митохондриях через 3 ч — 100 %. В LIR внесли замену V136S. Как изменится привлечение рецептора к митохондриям через 3 ч?", "p1a_3_o1": "Не изменится, так как рецептор удерживает на митохондриях UBD", "p1a_3_o2": "Снизится частично", "p1a_3_o3": "Снизится почти до нуля", "p1a_3_e": "UBD по-прежнему узнаёт метку, но привлечение NDP52 усиливается положительной обратной связью: ATG8 на растущем фагофоре удерживают рецепторы через LIR (Padman 2019). Без LIR привлечение слабее, и уровень на митохондриях через 3 ч — около 60 % (учебное значение модели; Padman 2019 показал качественно более медленное привлечение). Кроме того, ниже ULK1–FIP200 (50 %) и митофагия к 6 ч (35 %).", "p1a_3_w1": "Узнавание метки действительно обеспечивает UBD, но привлечение рецептора к митохондриям этим не исчерпывается: позже его усиливают ATG8 через LIR. В клетках, лишённых всех шести ATG8, дикий тип OPTN и NDP52 приходили к митохондриям так же медленно, как LIR-мутанты (Padman 2019).", "p1a_3_w3": "Узнавание метки сохранено, поэтому рецептор приходит к митохондриям. Падение почти до нуля наблюдали при потере UBD, а не LIR.", "p1a_4_q": "В клетках с восстановленным OPTN дикого типа и TBK1 доля клеток с красными митохондриями mt-Keima к 6 ч составляет 100 %. В параллельных клетках TBK1 отсутствует с начала эксперимента; остальные условия те же. Какой будет эта доля?", "p1a_4_o1": "Не изменится, так как TBK1 не входит в состав рецептора", "p1a_4_o2": "Снизится меньше чем на четверть", "p1a_4_o3": "Снизится больше чем вдвое", "p1a_4_e": "В этих клетках OPTN — единственный восстановленный рецептор. TBK1 фосфорилирует OPTN и усиливает его связывание с убиквитином и ATG8; без TBK1 OPTN хуже удерживается на митохондриях (30 %), и доля клеток с красными митохондриями падает до 32 % (Lazarou 2015; Richter 2016; Padman 2019).", "p1a_4_w1": "Киназа не входит в рецептор, но управляет им: фосфорилирование OPTN усиливает связывание с убиквитином. Когда есть NDP52, потеря TBK1 митофагию не нарушала; без NDP52 нарушала (Lazarou 2015).", "p1a_4_w2": "Небольшое снижение было бы при наличии второго рецептора (NDP52), на которого можно переложить работу. В этой постановке такого рецептора нет.", "p1a_5_q": "В клетках восстановлен NDP52 без домена SKICH (не связывает FIP200): клетки с красными митохондриями mt-Keima к 6 ч — 5 % от уровня при диком типе. Домен SKICH вернули, а цинковые пальцы (UBD) удалили; доля клеток с красными митохондриями тоже низкая, 3 %. Как изменится рецептор на митохондриях через 3 ч, измеренный микроскопией?", "p1a_5_o1": "Снизится почти до нуля", "p1a_5_o2": "Не изменится, так как mt-Keima в обоих случаях низкий", "p1a_5_o3": "Снизится вдвое, как и mt-Keima", "p1a_5_e": "mt-Keima показывает итог всей цепи — доставку митохондрий в кислый отсек, но не место блока. Мутант без SKICH приходит к митохондриям (100 %), мутант без цинковых пальцев — нет (5 %). Эти варианты различает только положение рецептора, и для локализации блока нужны промежуточные показатели.", "p1a_5_w2": "Низкий mt-Keima — признак блока где-то на пути от узнавания метки до доставки в лизосому. Рецептор на митохондриях в этих двух вариантах разный, но mt-Keima этого не показывает.", "p1a_5_w3": "Снижение mt-Keima (с 5 до 3 %) невелико и отражает итог, а не положение рецептора. Рецептор на митохондриях падает не вдвое, а почти до нуля.", "p1a_6_q": "Рецептор (один из двух, восстанавливающих митофагию в этих клетках) и мутация скрыты; TBK1 в клетках есть. Через 3 ч рецептор на митохондриях — 100 %, ULK1–FIP200 — около 20 %, клетки с красными митохондриями mt-Keima к 6 ч — около 5 % от уровня при диком типе. Какая функция рецептора нарушена?", "p1a_6_o1": "Узнавание метки убиквитина (UBD)", "p1a_6_o2": "Связь с белками ATG8 (LIR)", "p1a_6_o3": "Связывание FIP200", "p1a_6_e": "Рецептор на митохондриях в обычном количестве, значит, метку он узнаёт. Но ULK1–FIP200 не привлекается (20 % — как без рецепторов), и митофагии нет: нарушена передача от рецептора к инициирующему комплексу, то есть связывание FIP200; для NDP52 это домен SKICH (Vargas 2019).", "p1a_6_w1": "При потере UBD рецептор не приходит к митохондриям (около 5 %). Здесь он на митохондриях полностью, поэтому узнавание метки сохранено.", "p1a_6_w2": "При потере LIR рецептор приходит медленнее (около 60 %), а ULK1–FIP200 и митофагия снижены лишь частично (около 50 и 35 %). Здесь рецептор на месте, а привлечение инициирующего комплекса отсутствует.", "gn_q1_rec": "Рецептор селективной аутофагии (карго-рецептор)", "g_q1_rec": "Белок, который связывает метку на грузе и белки ATG8 на мембране фагофора. У растворимых рецепторов (p62/SQSTM1, NBR1, OPTN, NDP52, TAX1BP1) метка — цепи убиквитина; как правило, рецептор привлекает и комплекс ULK1–FIP200, поэтому аутофагосома строится у груза. Мембранные рецепторы (BNIP3, NIX, FUNDC1, FAM134B) встроены в мембрану органеллы и убиквитин не требуют. Рецептор разрушается вместе с грузом и не нужен для аутофагии при голодании (Adriaenssens 2022; Vargas 2023). В модели 1б показан рецептор с UBD; число копий — 1 без олигомеризации и 4 при олигомеризации (учебное значение).", "gn_q1_cargo": "Груз с метками убиквитина", "g_q1_cargo": "Убиквитинированный белковый агрегат или повреждённая органелла. Убиквитин — один из основных сигналов, по которым растворимые рецепторы узнают груз (Adriaenssens 2022; Pohl & Dikic 2019). В модели груз — частица с N метками на поверхности (N от 1 до 6, учебное значение); доли в показаниях отнесены ко всему грузу.", "gn_q1_ub": "Метка убиквитина (Ub)", "g_q1_ub": "Убиквитин, присоединённый к грузу по одному или цепями. Рецепторы предпочитают цепи K63 и M1, протеасома — K48, но предпочтение не абсолютно и показано в основном при сверхэкспрессии и in vitro (Adriaenssens 2022). Одиночное взаимодействие UBD с убиквитином слабое: сродство UBA p62 к убиквитину очень низкое (Wurzer 2015; Adriaenssens 2022). В модели вес занятия одного контакта — 4 % (учебное значение), поэтому важны число меток и число копий рецептора.", "gn_q1_ubd": "UBD — убиквитин-связывающий домен", "g_q1_ubd": "Домен рецептора, узнающий убиквитин: UBA у p62 и NBR1, UBAN у OPTN, UBZ у TAX1BP1, цинковые пальцы (ZnF) у NDP52 (Adriaenssens 2022). Один UBD связывает убиквитин слабо; прочность даёт множество одновременных контактов (авидность). Замена D474N в UBAN у OPTN и делеция цинковых пальцев у NDP52 нарушали привлечение к митохондриям в клетках HeLa без пяти рецепторов (Lazarou 2015).", "gn_q1_pb1": "PB1 и олигомеризация рецептора", "g_q1_pb1": "Домен PB1 есть у p62 и NBR1. PB1 p62 образует филаменты: в пробирке олигомеризация не повышала сродство отдельного участка связывания, но замедляла отделение олигомера от поверхности, покрытой LC3B или убиквитином, то есть создавала авидность (Wurzer 2015; Zaffagnini 2018). PB1 NBR1 сам не полимеризуется (Adriaenssens 2022). В модели олигомер — четыре копии рецептора (учебное значение); «PB1 не работает» означает мономерный рецептор.", "gn_q1_lir": "LIR — мотив взаимодействия с белками ATG8", "g_q1_lir": "Короткий линейный мотив рецептора длиной 15–20 аминокислот, который связывается с LIR-связывающим участком (LDS) белков ATG8 на мембране фагофора (Birgisdottir 2013; Johansen & Lamark 2020). Взаимодействие слабое и обратимое. В клетках HeLa с Parkin рецепторы с мутацией LIR (OPTN F178A, NDP52 V136S) всё же собирали белки ATG8 на митохондриях, но приходили к ним медленнее, и митофагия замедлялась (Padman 2019); NDP52 с заменами в LIR-подобных участках в клетках без OPTN, NDP52 и TAX1BP1 митофагию восстанавливал (Vargas 2019). Нумерация остатков — белки человека.", "gn_q1_fir": "FIR — участок связывания FIP200", "g_q1_fir": "Короткий мотив FIR (FIP200-interacting region) или домен, которым рецептор связывает FIP200. NDP52 связывает FIP200 доменом SKICH (Vargas 2019), p62 — мотивом, взаимодействующим с «клешнёй» FIP200 (Turco 2019); у OPTN способ связывания FIP200 не определён (Adriaenssens 2022). Поэтому на схеме 1п у OPTN модуль подписан «FIR?». «FIR» в этом семинаре — условное название участка связывания FIP200.", "gn_q1_atg8": "Белки семейства ATG8 (LC3 и GABARAP)", "g_q1_atg8": "Шесть белков человека: LC3A, LC3B, LC3C, GABARAP, GABARAPL1 и GABARAPL2. Присоединены к фосфатидилэтаноламину мембраны фагофора. Служат точкой прикрепления рецепторов через LIR. В клетках HeLa с Parkin, лишённых всех шести ATG8, митохондрии охватывались мембраной, но аутофагосомы не сливались с лизосомами (Nguyen 2016): ATG8 нужны прежде всего для слияния.", "gn_q1_ulk": "Комплекс ULK1–FIP200", "g_q1_ulk": "Комплекс ULK1–ATG13–FIP200–ATG101, с которого начинается построение аутофагосомы. FIP200 — каркасный белок комплекса: с ним связываются рецепторы (Adriaenssens 2022). Рецепторы привлекают этот комплекс к грузу до появления мембраны с ATG8 (Lazarou 2015; Turco 2019; Vargas 2019; Ravenhill 2019), поэтому аутофагосома строится у груза, даже когда mTORC1 активен (Adriaenssens 2022).", "gn_q1_phag": "Фагофор (изолирующая мембрана)", "g_q1_phag": "Изолирующая мембрана, из которой строится двойная мембрана аутофагосомы; на ней находятся белки ATG8, присоединённые к липиду. В схеме 1б фагофор показан заранее, но яркость его линий отражает долю груза, у которой мембрана есть: в клетках она строится после привлечения комплекса ULK1–FIP200, и в модели без привлечения ULK1–FIP200 мембраны у груза мало.", "gn_q1_mito": "Митохондрия с метками убиквитина", "g_q1_mito": "Олигомицин с антимицином A деполяризуют митохондрии, и на их поверхности появляются цепи убиквитина (участие PINK1 и Parkin рассматривается во втором вопросе семинара). В схеме показаны четыре метки: для вопроса 1 важно не как они появились, а что рецептор их узнаёт.", "gn_q1_optn": "OPTN (оптинейрин)", "g_q1_optn": "Рецептор с доменом UBAN, мотивом LIR (F178) и участком фосфорилирования TBK1 (S177); нумерация — белок человека. Вместе с NDP52 основной рецептор PINK1/Parkin-митофагии в клетках HeLa: нокаут одного OPTN митофагию не нарушал, нокаут обоих нарушал (Lazarou 2015). В нейронах NDP52 не экспрессируется, и OPTN особенно важен (Adriaenssens 2022). Участок связывания FIP200 у OPTN не определён.", "gn_q1_ndp52": "NDP52 (CALCOCO2)", "g_q1_ndp52": "Рецептор с цинковыми пальцами (ZnF; UBD), доменом SKICH (связывание FIP200) и неканоническим LIR (CLIR, замена V136S). Привлекает ULK1 к митохондриям и бактериям (Lazarou 2015; Ravenhill 2019; Vargas 2019). По данным Vargas 2019, принудительное привлечение NDP52 к митохондрии в клетках HeLa запускает митофагию, если сохранён домен SKICH; мутации LIR не препятствовали этому процессу.", "gn_q1_tax1bp1": "TAX1BP1", "g_q1_tax1bp1": "Рецептор с доменами SKICH и UBZ, по строению близкий к NDP52. В клетках HeLa без пяти рецепторов с Parkin приходит к митохондриям и восстанавливает митофагию в меньшей степени, чем OPTN и NDP52 (Lazarou 2015); в обзоре Adriaenssens 2022 сказано, что самостоятельно он митофагию не восстанавливает, а вместе с p62 и NBR1 восстанавливает. Значение 40 % в модели — учебное. При аггрефагии NBR1 привлекает TAX1BP1, и он служит основным посредником в привлечении FIP200 (Adriaenssens 2022). В работе по лизофагии ведущую роль получил TAX1BP1 (Eapen 2021).", "gn_q1_p62": "p62 (SQSTM1)", "g_q1_p62": "Рецептор с доменами PB1, ZZ, LIR, FIR и UBA. Образует филаменты и конденсаты с полиубиквитинированными белками и накапливается при нарушении аутофагии (Bjørkøy 2005; Komatsu 2007; Pankiv 2007; Zaffagnini 2018). В клетках HeLa без пяти рецепторов с Parkin p62 приходит к митохондриям, но ULK1 не привлекает и митофагию не восстанавливает (Lazarou 2015); по данным Padman 2019, он не привлекал ни один из шести белков ATG8, хотя его LIR цел. На убиквитиновых конденсатах p62 связывает FIP200 (Turco 2019). Другие работы называли p62 главным рецептором митофагии в иных моделях (Adriaenssens 2022).", "gn_q1_tbk1": "TBK1", "g_q1_tbk1": "Киназа TBK1 фосфорилирует OPTN (S177) и UBA p62 (S403) и усиливает их связывание с убиквитином и ATG8 (Wild 2011; Richter 2016; Adriaenssens 2022). В клетках HeLa с Parkin при отсутствии NDP52 митофагия через OPTN нуждалась в TBK1 (Lazarou 2015; Padman 2019). Нокаут TBK1 в HeLa и HCT116 замедлял очистку от митохондрий, и связь NDP52 с FIP200 ослабевала, хотя NDP52 приходил к митохондриям не хуже (Vargas 2019); при наличии NDP52 другие авторы такого дефекта не нашли (Lazarou 2015). Для TAX1BP1 и p62 в использованных работах это не изучали.", "gn_q1_keima": "mt-Keima — как измеряют митофагию", "g_q1_keima": "Флуоресцентный белок Keima, направленный в матрикс митохондрий. При доставке митохондрий в кислую среду лизосомы спектр возбуждения сдвигается, и на рисунке сигнал краснеет; долю клеток с таким сигналом измеряют микроскопией или проточной цитометрией. В работах на клетках HeLa без пяти рецепторов митофагию оценивали по mt-Keima и по деградации белка CoxII (Lazarou 2015; в первые 3 ч — Padman 2019; через 3 и 6 ч — Vargas 2019). Метод показывает итог — доставку в кислый отсек, но не место блока и не участие конкретного рецептора. Пиктограмма условна: для OPTN дикого типа принято 5 красных клеток из 10.", "gn_q1_penta": "Клетки HeLa без пяти рецепторов", "g_q1_penta": "Геномным редактированием удалены NDP52, OPTN, TAX1BP1, NBR1 и p62; в HeLa нет собственного Parkin, поэтому его вводят. Олигомицин с антимицином A деполяризуют митохондрии, после чего восстанавливают один рецептор и смотрят, что он обеспечивает (Lazarou 2015). Ограничения: HeLa, избыток Parkin, рецептор синтезируется с вектора, срок 3–6 ч; в нейронах NDP52 не экспрессируется (Adriaenssens 2022).", "s2_cyto": "цитозоль", "s2_omm": "внешняя мембрана", "s2_imm": "внутренняя мембрана", "s2_matrix": "матрикс", "s2_synth": "постоянный синтез PINK1", "s2_ndeg": "N-дегрон", "s2_prot": "протеасома", "s2_psi": "потенциал Δψ", "s2_lg_tr": "перенос белка", "s2_lg_act": "действует на", "s2_lg_inh": "тормозит", "s2_lg_bind": "связывание", "s2b_pot_t": "Потенциал внутренней мембраны", "s2b_pot_on": "сохранён", "s2b_pot_off": "утрачен (CCCP)", "s2b_pk_t": "Parkin", "s2b_pk_on": "есть", "s2b_pk_off": "нет", "s2b_us_t": "USP30", "s2b_us_on": "активна", "s2b_us_off": "ингибирована", "s2b_ki_t": "Киназная активность PINK1", "s2b_ki_on": "есть", "s2b_ki_off": "нет (мутант)", "s2b_wash_t": "Отмыть CCCP на 20-й минуте", "s2b_wash_h": "Доступно после утраты потенциала.", "s2b_tm_t": "Время от начала эксперимента", "s2b_plotcap": "Доля от максимума модели (0–1). Вертикальная линия — выбранное время.", "s2b_l_st": "PINK1 на внешней мембране", "s2b_l_v": "pS65-Ub", "s2b_l_m": "Parkin на митохондрии", "s2b_l_c": "покрытие убиквитином", "s2b_mark_w": "отмывка", "s2b_usi_s": "ингибитор USP30", "s2b_washed_s": "CCCP отмыт", "s2b_r_imp": "Импорт PINK1", "s2b_imp_on": "идёт", "s2b_imp_off": "остановлен", "s2b_r_st": "PINK1 на внешней мембране", "s2b_r_v": "pS65-Ub (убиквитин с фосфатом на S65)", "s2b_r_m": "Parkin на митохондрии", "s2b_r_c": "Покрытие поверхности убиквитином", "s2b_r_pk": "Parkin", "s2b_pk_act": "активен", "s2b_pk_inact": "не активен", "s2b_c_ok": "Потенциал сохранён. PINK1 входит в митохондрию через TOM и TIM23, PARL разрезает его, и новый N-конец (остаток F104) служит N-дегроном: фрагмент разрушает протеасома. Синтез идёт постоянно, поэтому на внешней мембране PINK1 почти нет ({p} %) и pS65-Ub нет ({v} %). Выбор Parkin, USP30 и киназной активности здесь ничего не меняет: пока нет остановленного PINK1, нет и метки, которую они могли бы создавать или снимать.", "s2b_c_ok_z": "Быстрое разрушение PINK1 — это проверка импорта: молекула, прошедшая импорт, исчезает, а на внешней мембране остаётся только та, которая импортироваться не смогла.", "s2b_c_t0": "Время 0: CCCP только что добавлен. Состояние ещё такое же, как до него: PINK1 на внешней мембране нет ({p} %), убиквитина немного ({c} %: запас, который ставят другие убиквитинлигазы). Дальнейшие изменения видны при сдвиге ползунка времени.", "s2b_c_t0_z": "Отсчёт идёт от стационарного состояния: до воздействия PINK1 постоянно синтезируется и разрушается, и накопления нет.", "s2b_c_s": "{t} мин после добавления CCCP. Импорт остановлен, и PINK1 накапливается на внешней мембране: {p} % от максимума. Остановленные молекулы только начали фосфорилировать друг друга, поэтому pS65-Ub пока мало ({v} %), Parkin на митохондрии почти нет ({m} %), покрытие убиквитином исходное ({c} %).", "s2b_c_s_z": "Первым меняется PINK1: синтез не прекращается, а разрушение прекращается вместе с импортом. По обзору Narendra & Youle 2024, накопление PINK1 начинается через несколько минут после утраты потенциала.", "s2b_c_su": "{t} мин после добавления CCCP. Импорт остановлен, и PINK1 накапливается на внешней мембране: {p} % от максимума. pS65-Ub пока мало ({v} %), Parkin на митохондрии почти нет ({m} %), покрытие убиквитином исходное ({c} %). Ингибитор USP30 пока ничего не меняет: цепей, которые она снимает, ещё нет.", "s2b_c_su_z": "Ингибитор USP30 действует на уже поставленные цепи, поэтому в первые минуты, пока Parkin их не создал, разницы с контролем нет.", "s2b_c_e": "{t} мин. PINK1 накоплен на внешней мембране ({p} %), его остановленные молекулы автофосфорилированы и фосфорилируют убиквитин по S65: pS65-Ub {v} %. Parkin на митохондрии {m} %, но ещё не активен, покрытие убиквитином {c} %.", "s2b_c_e_z": "Parkin появляется на поверхности не сразу: PINK1 уже накоплен, а активация Parkin запаздывает. В клетках её задержку после утраты потенциала оценивают примерно в 30 мин; в модели она задана константами.", "s2b_c_eu": "{t} мин. PINK1 накоплен ({p} %) и фосфорилирует убиквитин: pS65-Ub {v} %. Parkin на митохондрии {m} %, но ещё не активен. USP30 ингибирована, но разница с контролем пока мала: цепей Parkin ещё немного, покрытие убиквитином {c} %.", "s2b_c_eu_z": "Ингибитор USP30 сказывается на сигнале, который уже есть: пока Parkin не поставил цепей, снимать почти нечего.", "s2b_c_r": "{t} мин. Parkin на митохондрии ({m} %) связан с pS65-Ub и фосфорилирован PINK1, поэтому активен. Он присоединяет к белкам внешней мембраны новые цепи убиквитина, покрытие растёт ({c} %). Новые цепи — новый субстрат для PINK1, так что pS65-Ub тоже растёт ({v} %): это положительная обратная связь.", "s2b_c_r_z": "Обратная связь объясняет, почему сигнал нарастает не равномерно, а с ускорением: каждый шаг (pS65-Ub, Parkin, новые цепи) усиливает следующий.", "s2b_c_ru": "{t} мин. Parkin на митохондрии ({m} %) активен и ставит новые цепи убиквитина. USP30 ингибирована, поэтому цепи снимаются медленнее, и покрытие ({c} %) выше, чем при активной USP30 в тот же момент. pS65-Ub {v} %.", "s2b_c_ru_z": "USP30 противодействует Parkin: чем она слабее, тем быстрее метка доходит до плотности, которую узнают рецепторы.", "s2b_c_f": "{t} мин. Поверхность митохондрии плотно покрыта убиквитином ({c} %), pS65-Ub {v} %, Parkin на митохондрии {m} %. Цепи с фосфатом на S65 хуже поддаются USP30, поэтому метка держится. Это сигнал для рецепторов OPTN и NDP52, которые связывают pS65-Ub и убиквитин и привлекают инициирующие комплексы (вопрос 1).", "s2b_c_f_z": "Митохондрию помечает не один белок, а вся поверхность: плотная метка и есть сигнал «удалить», который читают рецепторы.", "s2b_c_fu": "{t} мин. Поверхность митохондрии плотно покрыта убиквитином ({c} %), pS65-Ub {v} %, Parkin на митохондрии {m} %. USP30 ингибирована, поэтому цепи снимаются хуже, и покрытие выше, чем при активной USP30 (в модели).", "s2b_c_fu_z": "Ингибиторы USP30 разрабатывают как усилители удаления митохондрий: слабее фермент — плотнее метка. В клинических испытаниях находится ингибитор MTX325 (по обзору Narendra & Youle 2024).", "s2b_c_kd": "{t} мин. Киназа PINK1 выключена (мутант). Импорт всё равно остановлен, и PINK1 накапливается на внешней мембране ({p} %). Но фосфат на S65 убиквитина не ставится (pS65-Ub {v} %), Parkin на митохондрию не привлекается ({m} %), покрытие остаётся исходным ({c} %).", "s2b_c_kd_z": "Накопление PINK1 даёт остановка импорта, а метку создаёт его киназная активность: это два разных свойства молекулы.", "s2b_c_np": "{t} мин. Parkin нет. PINK1 накоплен на внешней мембране ({p} %) и фосфорилирует имеющийся там убиквитин: pS65-Ub {v} %, то есть не больше исходного запаса. Новые цепи ставить некому, покрытие остаётся исходным ({c} %).", "s2b_c_np_z": "Без Parkin PINK1 фосфорилирует то немногое, что есть, но усилить сигнал нечем: основную часть метки создаёт Parkin.", "s2b_c_wash": "{t} мин, CCCP отмыт на 20-й минуте. Потенциал восстановлен, импорт идёт, поэтому PINK1 снова разрушается (на внешней мембране {p} %). Остальные показатели отстают от PINK1: pS65-Ub {v} %, Parkin на митохондрии {m} %, покрытие убиквитином {c} %. Активным Parkin не становится: для этого нужен накопленный PINK1.", "s2b_c_wash_z": "Состояние обратимо, пока PINK1 можно снова импортировать и разрушить: в клетках HeLa после отмывки CCCP полноразмерный PINK1 резко убывает в течение 30 мин (Narendra 2010). Скорость, с которой уходят остальные показатели, задана учебными константами.", "s2b_c_wash_np": "{t} мин, CCCP отмыт на 20-й минуте. Parkin нет. Потенциал восстановлен, импорт идёт, и PINK1 снова разрушается (на внешней мембране {p} %); pS65-Ub уходит вместе с ним ({v} %). Покрытие убиквитином остаётся исходным ({c} %): новых цепей ставить некому.", "s2b_c_wash_np_z": "Без Parkin на поверхности нет новых цепей, которые нужно было бы снимать после отмывки: возвращается только фосфат на исходном убиквитине.", "s2b_c_wash_kd": "{t} мин, CCCP отмыт на 20-й минуте. Киназа PINK1 выключена. Потенциал восстановлен, импорт идёт, и накопленный PINK1 разрушается (на внешней мембране {p} %). Фосфат на S65 не ставился (pS65-Ub {v} %), Parkin на митохондрию не привлекался ({m} %), покрытие остаётся исходным ({c} %).", "s2b_c_wash_kd_z": "Быстрое исчезновение PINK1 после отмывки определяет импорт, а не киназная активность: мутант без киназы разрушается так же, как обычный PINK1.", "s2b_c_kdu": "{t} мин. Киназа PINK1 выключена (мутант). Импорт остановлен, и PINK1 накапливается на внешней мембране ({p} %), но фосфат на S65 убиквитина не ставится (pS65-Ub {v} %), Parkin на митохондрию не привлекается ({m} %), покрытие остаётся исходным ({c} %). Ингибитор USP30 ничего не меняет: цепей, которые она снимает, нет.", "s2b_c_kdu_z": "Ингибитор USP30 усиливает метку только там, где Parkin успел поставить цепи; без киназы PINK1 до этого не доходит.", "s2b_c_npu": "{t} мин. Parkin нет. PINK1 накоплен на внешней мембране ({p} %) и фосфорилирует имеющийся там убиквитин: pS65-Ub {v} %, то есть не больше исходного запаса. Покрытие остаётся исходным ({c} %). Ингибитор USP30 ничего не меняет: цепей, которые она снимает, Parkin не ставил.", "s2b_c_npu_z": "USP30 противодействует Parkin; пока Parkin нет, нечего защищать от USP30, и её ингибирование не видно.", "s2b_take": "Рецептору из вопроса 1 нужна метка на грузе, и для митохондрии её создаёт пара PINK1 и Parkin. PINK1 синтезируется постоянно и в здоровой митохондрии разрушается; при утрате потенциала он остаётся на внешней мембране, фосфорилирует убиквитин и Parkin, а Parkin и PINK1 поддерживают друг друга положительной обратной связью. Пока PINK1 можно снова импортировать, состояние обратимо.", "gn_q2_pink1": "PINK1", "g_q2_pink1": "Киназа с митохондриальной сигнальной последовательностью (PTEN-induced kinase 1). Синтезируется постоянно; в здоровой митохондрии быстро разрушается (период полужизни около 27 мин в клетках HEK293 без воздействия; в клетке около 490 молекул — Narendra & Youle 2024). При нарушенном импорте остаётся на внешней мембране в комплексе TOM–TIM23, образует димеры и трансавтофосфорилируется по S228 и S402 (человек; Okatsu 2012). Активный PINK1 фосфорилирует убиквитин по S65 и убиквитиноподобный домен Parkin. Это единственная установленная убиквитинкиназа. Киназно-неактивный PINK1 на деполяризованной митохондрии накапливается, но Parkin не привлекает.", "gn_q2_tom": "TOM и TIM23", "g_q2_tom": "TOM — комплекс транслоказы внешней мембраны, TIM23 (вместе с TIM17) — транслоказа внутренней мембраны. Белки с N-концевой митохондриальной сигнальной последовательностью проходят через оба комплекса, и для прохождения нужен потенциал внутренней мембраны. При его утрате N-конец PINK1 застревает у комплекса TIM17–TIM23, а киназный домен остаётся на цитозольной стороне, связанный с TOM; возникает суперкомплекс TOM–TIM23 (Lazarou 2012; Okatsu 2012; Narendra & Youle 2024). Если потенциал восстанавливается, импорт возобновляется: в клетках HeLa после отмывки CCCP полноразмерный PINK1 резко убывает в течение 30 мин (Narendra 2010).", "gn_q2_parl": "PARL", "g_q2_parl": "Ромбоидная протеаза внутренней мембраны. После того как протеаза матрикса MPP снимает сигнальную последовательность, PARL разрезает трансмембранный домен PINK1 непосредственно перед F104. Новый N-конец с остатком Phe — N-дегрон: его узнают убиквитинлигазы UBR1, UBR2 и UBR4, и фрагмент разрушает протеасома (Yamano & Youle 2013; Narendra & Youle 2024). Расщепление PARL зависит от потенциала (Jin 2010). Порядок разрезов: сначала MPP, затем PARL.", "gn_q2_prot": "Протеасома и N-дегрон", "g_q2_prot": "26S-протеасома разрушает убиквитинированные белки. В здоровой митохондрии она разрушает фрагмент PINK1 после распознавания N-дегрона (правило N-конца). Позже эта же протеасома разрушает белки внешней мембраны, которые метит Parkin и извлекает p97 (шаг об этом — на странице объяснений).", "gn_q2_parkin": "Parkin", "g_q2_parkin": "Убиквитинлигаза E3 (PRKN) типа RBR; мутации в гене вызывают рецессивную наследственную форму болезни Паркинсона с ранним началом (болезнь требует потери функции обеих копий). В покое Parkin аутоингибирован: убиквитиноподобный домен (UBL), RING0 и REP закрывают сайт E2 и каталитический остаток C431 (человек). Parkin освобождается при связывании pS65-Ub и фосфорилировании S65 в UBL киназой PINK1 (Narendra & Youle 2024). В модели Parkin считается присутствующим или отсутствующим; промежуточных состояний нет.", "gn_q2_usp30": "USP30", "g_q2_usp30": "Деубиквитиназа внешней мембраны митохондрии; противодействует убиквитинированию, которое осуществляет Parkin (Bingol 2014). Ингибитор MTX325 находится в клинических испытаниях (Narendra & Youle 2024). В модели «ингибирована» означает снижение скорости снятия убиквитина до 30 % (учебное значение).", "gn_q2_ub": "Убиквитин и pS65-Ub", "g_q2_ub": "Убиквитин на внешней мембране — исходный запас, который создают другие убиквитинлигазы; в модели его 8 % от максимума (учебное значение). PINK1 фосфорилирует убиквитин по S65; pS65-Ub связывается с Parkin и с рецепторами OPTN и NDP52. Parkin создаёт новые цепи, которые тоже могут фосфорилироваться: так возникает обратная связь. Покрытие в модели — доля от максимума, не число молекул.", "gn_q2_psi": "Потенциал Δψ и CCCP", "g_q2_psi": "Δψ — разность потенциалов на внутренней мембране митохондрии; её создаёт перенос протонов из матрикса в межмембранное пространство при дыхании. CCCP — протонофор: он переносит протоны через мембрану в обход АТФ-синтазы и рассеивает потенциал сразу во всех митохондриях клетки. В организме повреждение чаще частичное и локальное, поэтому такое воздействие — удобная, но грубая модель. В вопросе везде используется CCCP; в ряде работ (Lazarou 2015; Ordureau 2014) потенциал рассеивали олигомицином с антимицином A, а в других — CCCP (Narendra 2010); направление эффектов у этих воздействий одно.", "p2b_1_q": "Митохондрия с сохранённым потенциалом: PINK1 на внешней мембране почти нет. Добавили CCCP, потенциал утрачен. Что покажет шкала «PINK1 на внешней мембране» через 10 мин?", "p2b_1_o1": "Почти не изменится: PINK1 по-прежнему быстро разрушается", "p2b_1_o2": "Возрастёт до большей части максимума: PINK1 перестаёт импортироваться и разрушаться", "p2b_1_o3": "Возрастёт лишь после прихода Parkin: Parkin стабилизирует PINK1", "p2b_1_e": "Без потенциала PINK1 не проходит через TOM и TIM23, PARL его не разрезает, и N-дегрон не возникает. Синтез идёт постоянно, поэтому молекулы накапливаются на внешней мембране: через 10 мин их 84 % от максимума модели (учебные константы), а Parkin на митохондрии ещё нет (1 %). По обзору Narendra & Youle 2024, накопление PINK1 начинается через несколько минут.", "p2b_1_w1": "Быстро разрушается PINK1 только в митохондрии с потенциалом: цепочка «импорт, разрез PARL, N-дегрон, протеасома» начинается с прохождения через TIM23, а оно требует потенциала.", "p2b_1_w3": "Накопление PINK1 от Parkin не зависит: в клетках HeLa, почти не содержащих Parkin, PINK1 накапливается так же, как в клетках с Parkin (Narendra 2010). Parkin приходит к уже накопленному PINK1.", "p2b_2_q": "В контрольной культуре через 60 мин после добавления CCCP PINK1 накоплен, pS65-Ub составляет 68 %, Parkin на митохондриях — 56 %, покрытие убиквитином — 82 %. В параллельной культуре с начала эксперимента вместо нормального PINK1 присутствует киназно-неактивный мутант PINK1; остальные условия те же. Какие показания ожидаются в этой культуре на 60-й минуте?", "p2b_2_o1": "PINK1 останется на внешней мембране, а pS65-Ub и Parkin на митохондриях не появятся", "p2b_2_o2": "PINK1 не накопится: без киназной активности он разрушается так же, как в неповреждённых митохондриях", "p2b_2_o3": "PINK1 накопится, Parkin придёт на митохондрию, но останется неактивным", "p2b_2_e": "Накопление определяет остановка импорта, а не киназная активность: PINK1 без киназы остаётся на внешней мембране (100 %). Но фосфат на S65 убиквитина не ставится (0 %), Parkin не привлекается (0 %), и покрытие остаётся исходным (8 %). В клетках PINK1 с дефектной киназой не восстанавливает привлечение Parkin (Narendra 2010).", "p2b_2_w2": "Разрушение PINK1 зависит от импорта и потенциала, а не от киназного домена: мутация в киназном домене не возвращает молекулу на путь импорта, разреза PARL и распада в протеасоме.", "p2b_2_w3": "Parkin привлекается на митохондрию с помощью pS65-Ub и фосфорилированного UBL, а оба фосфата ставит киназа PINK1. Без киназы Parkin остаётся в цитозоле, а не приходит на митохондрию неактивным.", "p2b_3_q": "В контрольной культуре через 60 мин после добавления CCCP PINK1 накоплен, pS65-Ub составляет 68 %, покрытие убиквитином — 82 %. В параллельной культуре Parkin отсутствует с начала эксперимента; остальные условия те же. Какими будут показания PINK1, pS65-Ub и покрытия убиквитином на 60-й минуте?", "p2b_3_o1": "PINK1 не накопится; pS65-Ub и покрытие останутся на низком фоновом уровне", "p2b_3_o2": "PINK1 накопится; pS65-Ub и покрытие останутся высокими: цепи ставит сам PINK1", "p2b_3_o3": "PINK1 накопится; pS65-Ub и покрытие останутся на низком фоновом уровне: цепей, которые он мог бы фосфорилировать, мало", "p2b_3_e": "PINK1 накапливается и без Parkin (100 %), но убиквитина на внешней мембране мало: 8 % — фоновый уровень модели. pS65-Ub (8 %) не превышает этого уровня. Основной объём метки создаёт Parkin: он присоединяет новые цепи, а PINK1 их фосфорилирует. Без Parkin обратная связь не запускается, покрытие остаётся 8 %. По данным Ordureau 2014, накопление фосфорилированных цепей на деполяризованных митохондриях требует активного Parkin.", "p2b_3_w1": "Накопление PINK1 лежит выше Parkin по пути: в клетках с Parkin и без него PINK1 накапливается одинаково (Narendra 2010).", "p2b_3_w2": "PINK1 — киназа, а не убиквитинлигаза: он фосфорилирует уже существующий убиквитин, а новые цепи создаёт Parkin.", "p2b_4_q": "На 20-й минуте после добавления CCCP PINK1 накоплен (97 %), Parkin на митохондрии 5 %, покрытие убиквитином 14 %. CCCP отмыли, потенциал восстановился. Какой из показателей через 30 мин после отмывки (50-я минута) ближе всего к исходному уровню?", "p2b_4_o1": "Parkin на митохондрии: он уходит вместе с PINK1", "p2b_4_o2": "PINK1 на внешней мембране: импорт возобновился", "p2b_4_o3": "Покрытие убиквитином: USP30 сразу снимает цепи", "p2b_4_e": "При восстановлении потенциала PINK1 снова проходит импорт и разрушается: в клетках HeLa после отмывки CCCP количество полноразмерного PINK1 резко падает в течение 30 мин (Narendra 2010); в модели на 50-й минуте его 3 %. Остальные показатели следуют за PINK1 с запаздыванием: Parkin на митохондрии 26 %, покрытие убиквитином 24 % при исходных 8 %. Скорость их возврата задана учебными константами и не измерена.", "p2b_4_w1": "Parkin уходит с митохондрии медленнее, чем разрушается PINK1: он связан с pS65-Ub, а pS65-Ub убывает не сразу. В модели на 50-й минуте Parkin на митохондрии даже больше (26 %), чем в момент отмывки (5 %).", "p2b_4_w3": "Цепи убиквитина снимаются с конечной скоростью, а не сразу: на 50-й минуте покрытие ещё 24 % при исходных 8 %. Разрушение PINK1 идёт быстрее, чем уборка цепей.", "p2b_5_q": "Через 35 мин после добавления CCCP покрытие убиквитином 50 %, pS65-Ub 37 %. Повторили условия, но USP30 была ингибирована с момента добавления CCCP. Как изменится покрытие убиквитином к 35-й минуте?", "p2b_5_o1": "Возрастёт: цепи, которые ставит Parkin, снимаются медленнее", "p2b_5_o2": "Снизится: USP30 помогает Parkin ставить цепи", "p2b_5_o3": "Не изменится: USP30 не снимает убиквитин с цепей, которые поставил Parkin", "p2b_5_e": "USP30 — деубиквитиназа внешней мембраны, она противодействует Parkin (Bingol 2014). Когда её ингибируют, цепи снимаются медленнее, и при той же скорости их постановки покрытие растёт: к 35-й минуте 68 % вместо 50 %, а pS65-Ub 55 % вместо 37 % (учебные константы). Раньше растёт и доля Parkin на митохондрии: 32 % вместо 27 %.", "p2b_5_w2": "USP30 снимает убиквитин, а не помогает его ставить: цепи создаёт Parkin. Ингибитор ослабляет снятие, поэтому метка плотнее, а не слабее.", "p2b_5_w3": "USP30 снимает именно убиквитин, который Parkin присоединил к белкам внешней мембраны: при избытке USP30 метка на повреждённых митохондриях исчезает, а при снижении её активности в нейронах деградация митохондрий усиливается (Bingol 2014). Поэтому ингибитор заметно меняет покрытие.", "p2b_6_q": "Через 10 мин после добавления CCCP PINK1 накоплен на 84 %, а покрытие убиквитином исходное (8 %). Как изменится покрытие убиквитином к 40-й минуте?", "p2b_6_o1": "Останется исходным: PINK1 сам убиквитин не присоединяет", "p2b_6_o2": "Будет расти равномерно: PINK1 накоплен, и цепей становится всё больше с постоянной скоростью", "p2b_6_o3": "Сначала почти не изменится, затем вырастет с ускорением: Parkin активируется не сразу, а потом усиливает собственную активацию", "p2b_6_e": "Parkin активируется с задержкой: ему нужны pS65-Ub и фосфорилирование UBL. По обзору Narendra & Youle 2024, активация запаздывает примерно на 30 мин, хотя PINK1 начинает накапливаться через несколько минут. Затем работает положительная обратная связь: Parkin ставит цепи, PINK1 фосфорилирует новые цепи, pS65-Ub привлекает и активирует новые молекулы Parkin. В модели покрытие к 20-й минуте 14 %, к 40-й минуте 63 %. Механизм задержки (накопление двух молекул PINK1 на комплексе TOM) — гипотеза авторов обзора.", "p2b_6_w1": "PINK1 действительно не присоединяет убиквитин, но он запускает цепочку: фосфорилирует убиквитин и Parkin, а активный Parkin создаёт цепи. Поэтому покрытие вырастет, только не сразу.", "p2b_6_w2": "Скорость постановки цепей определяет число активных молекул Parkin, а оно само растёт по мере накопления метки. Поэтому кривая загибается вверх, а не идёт прямой линией.", "s2a_geno_t": "Клетки HeLa с Parkin: вариант", "gt_q2_wt": "Дикий тип", "gt_q2_pink1ko": "PINK1⁻/⁻", "gt_q2_parkinko": "Parkin⁻/⁻", "gt_q2_c431s": "Parkin C431S", "gt_q2_s65a": "Parkin S65A", "gt_q2_usp30ko": "USP30⁻/⁻", "gt_q2_penta": "без 5 рецепторов", "gt_q2_x": "образец X", "s2a_sg_wt": "Дикий тип", "s2a_sg_pink1ko": "PINK1⁻/⁻", "s2a_sg_parkinko": "Parkin⁻/⁻", "s2a_sg_c431s": "Parkin C431S", "s2a_sg_s65a": "Parkin S65A", "s2a_sg_usp30ko": "USP30⁻/⁻", "s2a_sg_penta": "Без 5 рецепторов", "s2a_sg_x": "Образец X", "s2a_lane_wt": "дикий", "s2a_lane_pink1ko": "PINK1⁻", "s2a_lane_parkinko": "Parkin⁻", "s2a_lane_c431s": "C431S", "s2a_lane_s65a": "S65A", "s2a_lane_usp30ko": "USP30⁻", "s2a_lane_penta": "5⁻", "s2a_lane_x": "X", "s2a_lane_e0": "0 ч", "s2a_exp_t": "Время после воздействия", "s2a_e0": "без CCCP", "s2a_e1": "1 ч", "s2a_e4": "4 ч", "s2a_e24": "24 ч", "s2a_e_cccp": "с CCCP", "s2a_e_dfp": "с DFP", "s2a_exp_h": "Время отсчитывается от начала воздействия. Для образца X задан срок 24 ч; вещество раскрывается после ответа.", "s2a_reveal": "Раскрыть образец X", "s2a_mask": "Схема скрыта: читайте блот и mt-Keima", "s2a_alt": "Путь без PINK1 и Parkin", "s2a_penta_s": "5 рецепторов нет", "s2a_phag": "фагофор", "s2a_lyso": "лизосома", "s2a_keima_t": "mt-Keima: клетка под микроскопом", "s2a_k_g": "зелёные: митохондрии в цитозоле", "s2a_k_r": "красные: митохондрии в лизосомах", "s2a_k_n": "красных: {n} %", "s2a_r_s": "Вариант", "s2a_r_e": "Время после воздействия", "s2a_r_k": "mt-Keima: доля красных митохондрий (условно)", "s2a_blot_t": "Блот: качественные уровни полос", "s2a_blot_rec": "Записать дорожку", "s2a_blot_note": "Строки: PINK1 в митохондриальной фракции, pS65-Ub, убиквитинированный MFN2 (MFN2-Ub), MFN2, TOMM20, COX II, актин как контроль нагрузки. Тёмнее полоса — больше белка. Уровни учебные, не измерены.", "s2a_key": "Дорожка {n}: {g}, {t}", "s2a_c_x": "Образец X: вариант и воздействие скрыты, срок 24 ч. Ориентируйтесь на блот и mt-Keima: что накоплено, что убыло, где оказались митохондрии.", "s2a_c_x_z": "Путь определяют по сочетанию показаний: одна строка блота путь не назовёт, а отсутствие маркеров на одном сроке не доказывает независимости от пути.", "s2a_c_xr": "Образец X раскрыт: клетки через 24 ч с DFP, хелатором железа (по данным Allen 2013 в клетках U2OS и SH-SY5Y; блот здесь учебный). PINK1 не накапливается, pS65-Ub и убиквитинированного MFN2 нет, Parkin не привлечён. Но белки внешней и внутренней мембран убыли, а mt-Keima высокий: митохондрии доставлены в лизосомы. Признаков работы пути PINK1–Parkin на этом сроке нет; для DFP независимость от пути в работе Allen 2013 показана отдельно: подавлением PINK1 и в клетках без Parkin.", "s2a_c_xr_z": "Один итог, митохондрии в лизосомах, достигается разными путями. Отсутствие PINK1 и pS65-Ub на одном сроке говорит лишь об отсутствии признаков пути в этот момент; независимость от него устанавливают выключением PINK1 или Parkin. Остальные PINK1–Parkin-независимые пути, например рецепторы BNIP3 и NIX при гипоксии (Terešak 2022), по этим показаниям от DFP не отличить.", "s2a_c_0": "Вариант «{g}», без CCCP. Потенциал сохранён: PINK1 импортируется и разрушается, в митохондриальной фракции его нет, pS65-Ub и убиквитинированного MFN2 нет, MFN2, TOMM20 и COX II на исходном уровне, mt-Keima низкий. Это контрольная дорожка.", "s2a_c_0_z": "Без воздействия все варианты выглядят одинаково (в модели); по контролю судят, что на других дорожках изменилось.", "s2a_c_wt1": "Дикий тип, CCCP 1 ч. Потенциал утрачен, PINK1 накоплен и автофосфорилирован, на поверхности митохондрии есть pS65-Ub. Parkin привлечён и активен: MFN2 убиквитинирован, а несшитого MFN2 уже меньше. TOMM20 и COX II почти не тронуты, mt-Keima низкий: митохондрии ещё не в лизосомах.", "s2a_c_wt1_z": "Сначала появляется метка и убывает MFN2, и лишь потом митохондрии оказываются в лизосомах: цепочка занимает часы.", "s2a_c_wt4": "Дикий тип, CCCP 4 ч. Метка на поверхности держится (pS65-Ub максимален). Убиквитинированный MFN2 убывает вместе с самим MFN2: его извлекает p97 и разрушает протеасома. TOMM20 зам
