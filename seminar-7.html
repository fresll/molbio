ы, освобождённые при действии лизосомных протеаз. При блокаде протеаз белки в аутолизосомах не расщепляются, и активность mTORC1 не восстанавливается.", "p4b_3_w3": "Блокада протеаз предотвращает восстановление активности mTORC1, поскольку аминокислоты из содержимого аутолизосом не освобождаются.", "p4b_4_q": "После трёх часов дефицита аминокислот, когда аутофагия выражена, добавим аминокислоты в среду. Как изменятся активность mTORC1 и образование аутофагосом?", "p4b_4_o1": "mTORC1 активируется, а образование новых аутофагосом резко уменьшится", "p4b_4_o2": "Изменений не будет до завершения аутофагии", "p4b_4_o3": "Аутофагия усилится", "p4b_4_e": "Добавленные аминокислоты быстро возвращают mTORC1 на лизосому. Он фосфорилирует ULK1, поэтому образование новых аутофагосом резко уменьшается; фосфорилированный TFEB возвращается в цитоплазму. Содержимое уже образовавшихся аутолизосом продолжает расщепляться.", "p4b_4_w2": "Завершения аутофагии для этого не требуется: добавленные аминокислоты сразу возвращают mTORC1 на лизосому. mTORC1 фосфорилирует ULK1, и новых аутофагосом образуется намного меньше. Уже образовавшиеся аутофагосомы продолжают сливаться с лизосомами.", "p4b_4_w3": "Дефицит аминокислот стимулирует инициацию аутофагии. После добавления аминокислот mTORC1 повторно подавляет этот этап.", "um": "мкм", "s4a_y": "аутофагосома: GFP + mCherry", "s4a_r": "аутолизосома: GFP гаснет в кислой среде", "s4a_y_baf": "оба сигнала: аутофагосома или незакисленная аутолизосома", "s4a_r_baf": "красных точек нет: без кислой среды GFP не гаснет", "gt_atg7": "нет ATG7", "gt_ampk": "нет AMPK", "int_t": "Воздействие", "int_none": "нет", "int_prot": "ингибиторы протеаз", "int_rapa": "рапамицин с 2 ч", "int_none_k": "без воздействия", "s4a_bafview": "Вторая чашка: + бафиломицин за 2 ч до измерения", "s4a_baf_on": "+ бафиломицин с {h} ч", "s4a_since": "без аминокислот {s} ч", "s4a_dish_ctrl": "Чашка без бафиломицина", "s4a_dish_baf": "Вторая чашка: + бафиломицин", "s4a_r_s6k": "mTORC1 → p-S6K (чувствителен к рапамицину)", "s4a_r_ulk": "mTORC1 → p-ULK1 S758 (во многом устойчив к рапамицину)", "blot_t4": "Вестерн-блот: LC3 и p62", "blot_rec4": "Снять блот ± бафиломицин", "blot_flux": "{h} · {g} · {i}: с бафиломицином за {x} ч LC3-II больше на {d} = {a} (расщеплён в контроле) + {b} (дополнительные аутофагосомы во второй чашке)", "blot_flux_zero": "{h} · {g} · {i}: за {x} ч в присутствии бафиломицина LC3-II не увеличился", "blot_flux0": "{h} · {g} · {i}: бафиломицин ещё не успел подействовать", "blot_fed": "аминокислоты в среде", "blot_refed": "после добавления аминокислот", "blot_starved": "{h} ч без аминокислот", "blot_note4": "−Б и +Б — образцы из двух чашек, измеренные одновременно. Во вторую чашку бафиломицин добавлен за 2 ч до измерения. Увеличение LC3-II включает два компонента: LC3-II, который за это время расщепился в контроле, и дополнительные аутофагосомы, образовавшиеся во второй чашке по сравнению с контролем. Числа условны.", "s4a_ny": "жёлтые точки", "s4a_nr": "красные точки", "s4a_c_fed": "При наличии аминокислот в среде флуоресцентных точек почти нет. Аутофагия сохраняется на базальном уровне, а LC3 находится преимущественно в форме LC3-I.", "s4a_c_fed_z": "Базальная аутофагия постоянно удаляет старые белки и органеллы, но интенсивность этого процесса невелика.", "s4a_c_early": "В начале дефицита аминокислот появляются жёлтые точки, соответствующие аутофагосомам. В них видна флуоресценция и GFP, и mCherry.", "s4a_c_early_z": "До слияния с лизосомой среда в аутофагосоме некислая, поэтому флуоресценция GFP сохраняется.", "s4a_c_peak": "Красных точек много: аутофагосомы слились с лизосомами. В кислой среде флуоресценция GFP гаснет, а флуоресценция mCherry сохраняется.", "s4a_c_peak_z": "Красные точки указывают на слияние аутофагосом с лизосомами. По этому признаку нельзя установить, происходит ли расщепление содержимого. Для оценки расщепления сравнивают образцы с бафиломицином и без него.", "s4a_c_react": "Активность mTORC1 восстанавливается, поэтому новые аутофагосомы образуются всё реже. В уже сформированных аутолизосомах продолжается расщепление содержимого.", "s4a_c_react_z": "Отрицательная обратная связь уменьшила образование новых аутофагосом.", "s4a_c_refed": "Аминокислоты добавлены в среду. mTORC1 активен, и образование новых аутофагосом ограничено.", "s4a_c_refed_z": "Внешних аминокислот достаточно, поэтому аутофагическое расщепление собственных компонентов ослабевает.", "s4a_c_atg7": "При отсутствии ATG7 LC3 не присоединяется к мембране. Флуоресцентные точки и LC3-II отсутствуют, флуоресценция LC3 распределена равномерно. p62 накапливается, а активность mTORC1 не восстанавливается.", "s4a_c_atg7_z": "При дефиците аминокислот нарушение канонической аутофагии лишает клетку главного внутреннего источника аминокислот.", "s4a_c_prot": "При блокаде протеаз количество красных точек увеличивается. Слияние и закисление продолжаются, но содержимое не расщепляется. LC3-II и p62 накапливаются.", "s4a_c_prot_z": "Большое количество точек и высокое содержание LC3-II не доказывают усиления аутофагического потока. Эти признаки могут возникать при блокаде расщепления содержимого.", "s4a_c_rapa": "Рапамицин присутствует со 2-го часа дефицита аминокислот. Сигнал p-S6K не восстанавливается, хотя аминокислоты из аутофагического расщепления уже доступны. ULK1 вновь фосфорилируется по S758: это фосфорилирование во многом устойчиво к рапамицину, поэтому в модели образование новых аутофагосом ограничено. После снижения к 4 ч количество свободных лизосом восстанавливается медленно и не полностью.", "s4a_c_rapa_z": "Чувствительность мишеней mTORC1 к рапамицину различается (Kang 2013). Восстановление лизосом зависит от чувствительной к рапамицину части активности mTORC1. В опытах Yu 2010 крупные аутолизосомы в присутствии рапамицина сохранялись и через 10 ч.", "s4a_c_ampk": "В данной модели при отсутствии AMPK аутофагия усилена и количество точек увеличено. Восстановление активности mTORC1 ослаблено.", "s4a_c_ampk_z": "При длительном дефиците аминокислот AMPK сдерживает аутофагию и поддерживает повторную активацию mTORC1. При отсутствии AMPK частота гибели клеток увеличивается (Kazyken 2024). Механизм этого эффекта ещё изучается.", "s4a_c_baf": "Во вторую чашку бафиломицин A1 добавлен {x} ч назад. Он ингибирует v-ATPase и нарушает закисление. Флуоресценция GFP не гаснет, поэтому и аутофагосомы, и аутолизосомы выглядят жёлтыми. Количество точек увеличено, поскольку за это время лизосомное расщепление было блокировано.", "s4a_c_baf_z": "Увеличение LC3-II во второй чашке включает LC3-II, расщеплённый за это время в контроле, и дополнительные аутофагосомы. В присутствии бафиломицина аминокислоты не освобождаются из лизосом, активность mTORC1 не восстанавливается, и образование аутофагосом продолжается дольше. Оба компонента показаны в подписи к блоту. Слияние в модели сохраняется при действии бафиломицина; это упрощение, поскольку в некоторых клетках он также нарушает слияние (Mauvezin 2015).", "s4a_c_baf_prot": "Во вторую чашку с ингибиторами протеаз добавлен бафиломицин. Содержимое аутолизосом перестаёт быть кислым, флуоресценция GFP восстанавливается, и красные точки становятся жёлтыми. Количество точек не изменилось, поскольку расщепление уже было блокировано; увеличения LC3-II почти нет.", "s4a_c_baf_prot_z": "Если лизосомное расщепление уже заблокировано, добавление бафиломицина почти не увеличивает LC3-II. Для оценки потока необходимо сравнить образцы с бафиломицином и без него.", "s4a_take": "Для оценки аутофагии нужен показатель потока; одного количества точек недостаточно. Без бафиломицина тандемный репортёр mCherry-GFP-LC3 выявляет аутофагосомы как жёлтые точки, а кислые аутолизосомы — как красные. Бафиломицин нарушает закисление, поэтому в модели обе структуры выглядят жёлтыми; в клетках он может также нарушать слияние. Увеличение LC3-II в присутствии бафиломицина помогает оценить оборот LC3-II, но не равно количеству расщеплённого содержимого: бафиломицин сам изменяет образование аутофагосом. ATG7 необходим для присоединения LC3 к мембране и канонической аутофагии, лизосомные протеазы — для освобождения аминокислот, а mTORC1 — для восстановления лизосом.", "p4a_1_q": "После 4 ч без аминокислот сигнал LC3-II на блоте выше, чем при их наличии. Означает ли это, что аутофагический поток усилился?", "p4a_1_o1": "Да: больше LC3-II — значит, больше аутофагосом", "p4a_1_o2": "Не обязательно: LC3-II растёт и при блокаде расщепления", "p4a_1_o3": "Нет: LC3-II накапливается, потому что аутофагия ослабла", "p4a_1_e": "В образце с бафиломицином LC3-II значительно больше. Почти вся прибавка — LC3-II, который за эти 2 ч расщепился в контрольной чашке: оборот LC3-II высокий (Klionsky 2021). Небольшую часть дают дополнительные аутофагосомы: с бафиломицином аминокислоты не освобождаются, и mTORC1 повторно не активируется.", "p4a_1_w1": "Содержание LC3-II увеличивается как при более частом образовании аутофагосом, так и при замедлении их расщепления. По одной полосе различить эти причины нельзя; необходим второй образец с бафиломицином.", "p4a_1_w3": "Повышение LC3-II само по себе не означает ослабления аутофагии: оно возможно и при усиленном образовании аутофагосом, и при замедленном расщеплении. Различить эти причины помогает образец с бафиломицином. За 2 ч в контроле было расщеплено 0,03 LC3-II при наличии аминокислот и 0,34 после 4 ч их дефицита; это условные величины из подписи к блоту. Оборот LC3-II увеличился, что в данной модели соответствует усилению аутофагического потока.", "p4a_2_q": "Лизосомные протеазы заблокированы. Какие флуоресцентные точки будут видны через 4 ч дефицита аминокислот?", "p4a_2_o1": "В основном жёлтые", "p4a_2_o2": "Много красных", "p4a_2_o3": "Никаких", "p4a_2_e": "Слияние и закисление продолжаются, и флуоресценция GFP гаснет. Однако содержимое не расщепляется, поэтому красные точки накапливаются.", "p4a_2_w1": "Ингибиторы протеаз не нарушают слияние и закисление в этой модели. В кислой аутолизосоме флуоресценция GFP гаснет, а флуоресценция mCherry сохраняется. Поэтому красные точки накапливаются.", "p4a_2_w3": "Аутофагосомы продолжают образовываться и сливаться с лизосомами. В кислой среде флуоресценция GFP гаснет. Однако протеазы заблокированы, и содержимое не расщепляется, поэтому красные структуры накапливаются.", "p4a_3_q": "Добавим бафиломицин. Что произойдёт с красными флуоресцентными точками?", "p4a_3_o1": "Станут жёлтыми", "p4a_3_o2": "Останутся красными: зелёный сигнал не появится", "p4a_3_o3": "Исчезнут", "p4a_3_e": "Бафиломицин ингибирует v-ATPase, и содержимое аутолизосом перестаёт быть кислым. Флуоресценция GFP восстанавливается, поэтому аутолизосомы тоже выглядят жёлтыми. Следовательно, жёлтая точка в присутствии бафиломицина не обязательно соответствует аутофагосоме (Kimura 2007).", "p4a_3_w2": "GFP в этих структурах не разрушен, поскольку протеазы заблокированы; его флуоресценцию гасила только кислая среда. После устранения закисления флуоресценция GFP и mCherry видна одновременно, поэтому точки становятся жёлтыми.", "p4a_3_w3": "Бафиломицин в этом опыте не разрушает флуоресцентные структуры. Он ингибирует протонный насос v-ATPase, и содержимое аутолизосом перестаёт быть кислым. Флуоресценция GFP восстанавливается и видна вместе с флуоресценцией mCherry, поэтому точки сохраняются, но становятся жёлтыми.", "p4a_4_q": "Клетки, как и в предыдущем шаге, 4 ч находятся без аминокислот в присутствии ингибиторов протеаз. Сравним образцы с бафиломицином и без него. Какой будет прибавка LC3-II?", "p4a_4_o1": "Большая: аутофагический поток усилен", "p4a_4_o2": "Почти никакой: лизосомное расщепление уже остановлено", "p4a_4_o3": "С бафиломицином LC3-II станет меньше", "p4a_4_e": "Ингибиторы протеаз уже блокировали расщепление, поэтому бафиломицин почти не меняет содержание LC3-II: в обоих образцах оно почти одинаково. Много точек и много LC3-II без прибавки от бафиломицина указывают на блокаду расщепления, а не на усиление потока.", "p4a_4_w1": "Высокое содержание LC3-II связано с блокадой расщепления. Поскольку ингибиторы протеаз уже подавили этот этап, добавление бафиломицина почти не увеличивает LC3-II.", "p4a_4_w3": "Бафиломицин не ускоряет расщепление LC3-II. Если этот процесс уже блокирован, содержание LC3-II в присутствии бафиломицина останется почти таким же.", "p4a_5_q": "Как изменятся полосы LC3-II, p62 и p-S6K на блоте клеток без ATG7 через 6 ч дефицита аминокислот?", "p4a_5_o1": "LC3-II и p-S6K отсутствуют, а содержание p62 увеличено", "p4a_5_o2": "Как в норме", "p4a_5_o3": "Содержание LC3-II и p62 увеличено, p-S6K отсутствует", "p4a_5_e": "ATG7 необходим для присоединения LC3 к фосфатидилэтаноламину. Без него LC3-II не образуется, а каноническая аутофагия почти отсутствует. p62 не расщепляется, освобождение аминокислот нарушено, поэтому активность mTORC1 и сигнал p-S6K не восстанавливаются.", "p4a_5_w2": "ATG7 — фермент E1, который активирует LC3 перед его присоединением к фосфатидилэтаноламину. Без ATG7 LC3-II не образуется, каноническая аутофагия почти отсутствует, а p62 накапливается. Сигнал p-S6K не восстанавливается.", "p4a_5_w3": "Без ATG7 LC3-II не образуется: на блоте нет полосы LC3-II, остаётся только LC3-I.", "p4a_6_q": "Через 2 ч после удаления аминокислот добавлен рапамицин. Что изменится к 8 ч от начала опыта?", "p4a_6_o1": "Всё будет так же, как без рапамицина", "p4a_6_o2": "p-S6K не восстановится, лизосомы восстановятся частично", "p4a_6_o3": "Аутофагосом будет образовываться больше", "p4a_6_e": "Аминокислоты освобождаются из аутолизосом, но рапамицин не даёт восстановиться сигналу p-S6K. Лизосомы восстанавливаются медленно: после снижения к 4 ч свободных лизосом становится больше, но к 8 ч намного меньше, чем без рапамицина (почти 90 %). Фосфорилирование ULK1 (S758) во многом устойчиво к рапамицину (Kang 2013), поэтому в модели новых аутофагосом образуется мало (в опыте Yu 2010 это не проверяли).", "p4a_6_w1": "Рапамицин подавляет ту часть активности mTORC1, от которой зависят фосфорилирование S6K и восстановление лизосом из аутолизосом. Поэтому сигнал p-S6K не восстанавливается, а свободных лизосом к 8 ч значительно меньше, чем при дефиците аминокислот без рапамицина.", "p4a_6_w3": "Фосфорилирование ULK1 (S758) во многом устойчиво к рапамицину. После освобождения аминокислот mTORC1 вновь подавляет ULK1, поэтому образование новых аутофагосом в модели ограничено.", "gn_rag": "Rag-ГТФазы (RagA/B · RagC/D)", "g_rag": "Пара малых ГТФаз, закреплённая на лизосоме комплексом Ragulator. При наличии аминокислот RagA/B связаны с GTP, а RagC/D — с GDP. Связываясь с Raptor, эта пара привлекает mTORC1 к лизосоме.", "gn_rheb": "RHEB", "g_rheb": "Малая ГТФаза, связанная с мембранами за счёт фарнезильного остатка. RHEB не находится постоянно на лизосоме (Angarola 2019); его изображение на лизосоме — упрощение схемы. В GTP-форме RHEB активирует mTORC1, после того как Rag-ГТФазы привлекли комплекс к лизосоме. TSC переводит RHEB в GDP-форму.", "gn_tsc": "TSC (TSC1 · TSC2 · TBC1D7)", "g_tsc": "Комплекс белков TSC1, TSC2 и TBC1D7; TSC2 ускоряет гидролиз GTP на RHEB (GAP). После фосфорилирования TSC2 киназой AKT комплекс покидает лизосому. При дефиците аминокислот Rag-ГТФазы возвращают его на лизосому. При дефиците энергии AMPK фосфорилирует TSC2 и усиливает его действие (Inoki 2003). Мутации генов TSC1 или TSC2 вызывают туберозный склероз.", "gn_akt": "AKT", "g_akt": "Киназа инсулинового сигнального пути (инсулин → рецептор → PI3K → PIP3 → AKT). Фосфорилирует TSC2 и PRAS40.", "gn_mtorc1": "mTORC1", "g_mtorc1": "Комплекс киназы mTOR с Raptor и mLST8. Стимулирует синтез белков, липидов и нуклеотидов; подавляет аутофагию и образование лизосом.", "gn_tfeb": "TFEB", "g_tfeb": "Транскрипционный фактор, регулирующий экспрессию генов лизосомных белков и белков аутофагии. После того как mTORC1 фосфорилирует TFEB по S211 (у человека), TFEB связывается с белками 14-3-3 и удерживается в цитоплазме. Дефосфорилированный TFEB перемещается в ядро.", "gn_s6k": "S6K1", "g_s6k": "Киназа, активируемая mTORC1 через фосфорилирование T389. Стимулирует синтез белка и образование рибосом. Через IRS1 ослабляет инсулиновый сигнал, образуя отрицательную обратную связь.", "gn_ebp": "4E-BP1", "g_ebp": "Связывается с фактором инициации трансляции eIF4E. Фосфорилированный комплексом mTORC1 белок 4E-BP1 диссоциирует от eIF4E, и eIF4E становится доступен для инициации трансляции.", "gn_ulk1": "ULK1", "g_ulk1": "Киназа, участвующая в инициации образования аутофагосомы. mTORC1 подавляет её, фосфорилируя S758 (у человека; у мыши это S757). AMPK фосфорилирует другие сайты ULK1. По классической схеме это стимулирует аутофагию, тогда как в новых работах при дефиците энергии скорее сдерживает её. Эффект зависит от условий.", "gn_sestrin": "Sestrin2", "g_sestrin": "Сенсор лейцина в цитоплазме (Kd около 20 мкМ). В отсутствие лейцина связывается с GATOR2 и подавляет его.", "gn_castor": "CASTOR1", "g_castor": "Сенсор аргинина в цитоплазме. В отсутствие аргинина связывается с GATOR2 и подавляет его.", "gn_samtor": "SAMTOR", "g_samtor": "Сенсор S-аденозилметионина (SAM). В отсутствие SAM связывается с GATOR1 и KICSTOR и усиливает подавление mTORC1.", "gn_gator2": "GATOR2", "g_gator2": "Комплекс, подавляющий GATOR1. Свободные Sestrin2 и CASTOR1 ингибируют GATOR2.", "gn_gator1": "GATOR1", "g_gator1": "GAP для RagA/B, переводящий их в GDP-форму при дефиците аминокислот. Мутации гена его субъединицы DEPDC5 вызывают фокальную эпилепсию.", "gn_flcn": "FLCN (фолликулин)", "g_flcn": "В комплексе с FNIP действует как GAP для RagC/D и переводит их в GDP-форму. Особенно важен для фосфорилирования TFEB, тогда как S6K в его отсутствие фосфорилируется почти как обычно (Napolitano 2020). Мутации FLCN вызывают синдром Бёрта — Хогга — Дюбе.", "gn_slc38a9": "SLC38A9", "g_slc38a9": "Транспортёр в мембране лизосомы. Воспринимает аргинин в её просвете и активирует Rag-ГТФазы. Переносит из лизосомы лейцин и другие незаменимые аминокислоты.", "gn_ampk": "AMPK", "g_ampk": "Состоит из трёх субъединиц: α обладает киназной активностью, β выполняет каркасную функцию, а γ связывает AMP, ADP или ATP. AMPK активна при фосфорилировании Thr172 в α-субъединице. Она подавляет процессы, потребляющие ATP, и стимулирует его образование.", "gn_lkb1": "LKB1", "g_lkb1": "Постоянно активная киназа, фосфорилирующая Thr172 в AMPK. Супрессор опухолей: наследственные мутации гена LKB1 (STK11) вызывают синдром Пейтца — Егерса, а соматическая утрата LKB1 часто встречается при аденокарциноме лёгкого.", "gn_camkk2": "CaMKK2", "g_camkk2": "Киназа, фосфорилирующая Thr172 при повышении содержания Ca²⁺ в цитоплазме, без участия AMP.", "gn_aldolase": "Альдолаза", "g_aldolase": "Фермент гликолиза. В отсутствие своего субстрата, фруктозо-1,6-бисфосфата, способствует сборке на лизосоме комплекса v-ATPase — Ragulator — AXIN — LKB1, и LKB1 фосфорилирует AMPK.", "gn_axin": "AXIN", "g_axin": "Каркасный белок. При дефиците глюкозы привлекает LKB1 к AMPK на лизосоме.", "gn_acc": "ACC (ацетил-CoA-карбоксилаза)", "g_acc": "Биотинзависимая карбоксилаза: превращает ацетил-CoA в малонил-CoA, используя HCO₃⁻ и ATP. AMPK подавляет её, фосфорилируя S79 в ACC1 и S212 в ACC2 (у мыши).", "gn_acc1": "ACC1", "g_acc1": "Цитоплазматическая ACC печени и жировой ткани. Образует малонил-CoA для синтеза жирных кислот. AMPK подавляет её, фосфорилируя S79 (у мыши).", "gn_acc2": "ACC2", "g_acc2": "ACC на наружной мембране митохондрий мышц, сердца и печени. Малонил-CoA, образующийся при её участии, ингибирует CPT1, расположенную рядом с ACC2. AMPK подавляет ACC2, фосфорилируя S212 (у мыши).", "gn_raptor": "Raptor", "g_raptor": "Каркасный белок mTORC1, который связывает субстраты и подводит их к киназе mTOR. AMPK фосфорилирует Raptor по S722 и S792, после чего с ним связывается белок 14-3-3, а активность mTORC1 подавляется. Этот путь сохраняется и при отсутствии TSC2 (Gwinn 2008).", "gn_ampkmtor": "Как AMPK тормозит mTORC1", "g_ampkmtor": "AMPK подавляет mTORC1 двумя путями. Она фосфорилирует TSC2 и усиливает его действие: TSC2 переводит RHEB в GDP-форму (Inoki 2003). Кроме того, AMPK фосфорилирует Raptor в составе mTORC1 и подавляет комплекс даже при отсутствии TSC2 (Gwinn 2008). Фосфорилирование не всегда означает подавление: TSC2 оно активирует, а Raptor ингибирует, и в обоих случаях активность mTORC1 снижается.", "gn_hmgcr": "HMGCR", "g_hmgcr": "ГМГ-CoA-редуктаза — ключевой фермент синтеза холестерина и мишень статинов. AMPK подавляет её активность.", "gn_mff": "MFF", "g_mff": "Белок наружной мембраны митохондрий, привлекающий DRP1. Фосфорилирование MFF под действием AMPK ускоряет деление митохондрий.", "gn_pgc1a": "PGC-1α", "g_pgc1a": "Коактиватор экспрессии генов, связанных с образованием митохондрий. AMPK повышает его активность и количество, в том числе через TFEB. Это способствует образованию новых митохондрий в течение часов и дней.", "gn_citrate": "Цитрат", "g_citrate": "При избытке углеводов цитрат выходит из митохондрий, служит источником ацетил-CoA для синтеза и активирует ACC.", "gn_fasn": "FASN (синтаза жирных кислот)", "g_fasn": "Катализирует синтез пальмитата из ацетил-CoA и 7 молекул малонил-CoA с расходованием 14 NADPH.", "gn_cpt1": "CPT1", "g_cpt1": "Карнитин-пальмитоилтрансфераза 1 на наружной мембране митохондрии. Переносит ацильную группу с CoA на карнитин. Ингибируется малонил-CoA и необратимо — этомоксиром. В печени представлена CPT1A, а в мышцах и сердце — CPT1B, во много раз более чувствительная к малонил-CoA. В раздробленных митохондриях чувствительность CPT1 к малонил-CoA снижена (Ngo 2023).", "gn_cact": "CACT", "g_cact": "Транспортёр внутренней мембраны, переносящий ацилкарнитин в матрикс в обмен на свободный карнитин.", "gn_cpt2": "CPT2", "g_cpt2": "Фермент на внутренней стороне внутренней мембраны. Переносит ацильную группу с карнитина на CoA в матриксе.", "src_01": "Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8", "src_02": "Settembre C., Perera R. M. Lysosomes as coordinators of cellular catabolism, metabolic signalling and organ physiology. Nat Rev Mol Cell Biol. 2024;25:223–245. doi:10.1038/s41580-023-00676-x", "src_03": "Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x", "src_04": "Kim J., Kundu M., Viollet B., Guan K.-L. AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1. Nat Cell Biol. 2011;13:132–141. doi:10.1038/ncb2152", "src_05": "Egan D. F. et al. Phosphorylation of ULK1 (hATG1) by AMP-activated protein kinase connects energy sensing to mitophagy. Science. 2011;331:456–461. doi:10.1126/science.1196371", "src_06": "Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3", "src_07": "Park J. M., Lee D. H., Kim D. H. Redefining the role of AMPK in autophagy and the energy stress response. Nat Commun. 2023;14:2994. doi:10.1038/s41467-023-38401-z", "src_08": "Kazyken D. et al. Unexpected roles for AMPK in the suppression of autophagy and the reactivation of MTORC1 signaling during prolonged amino acid deprivation. Autophagy. 2024;20:2017–2040. doi:10.1080/15548627.2024.2355074", "src_09": "Wolfson R. L. et al. Sestrin2 is a leucine sensor for the mTORC1 pathway. Science. 2016;351:43–48. doi:10.1126/science.aab2674", "src_10": "Chantranupong L. et al. The CASTOR proteins are arginine sensors for the mTORC1 pathway. Cell. 2016;165:153–164. doi:10.1016/j.cell.2016.02.035", "src_11": "Gu X. et al. SAMTOR is an S-adenosylmethionine sensor for the mTORC1 pathway. Science. 2017;358:813–818. doi:10.1126/science.aao3265", "src_12": "Bar-Peled L. et al. A tumor suppressor complex with GAP activity for the Rag GTPases that signal amino acid sufficiency to mTORC1. Science. 2013;340:1100–1106. doi:10.1126/science.1232044", "src_13": "Wyant G. A. et   let h = `<div class="k">${t('poe_step', { i: POE.i + 1, n: steps.length })}</div><div class="q">${t(P + '_q')}</div><div class="opts">`;
  const perm = poePerm(cur, POE.i, st.n, st.ok);
  for (let d = 0; d < st.n; d++){
    const j = perm[d];
    let cls = 'opt';
    if (POE.pick === j) cls += ' picked';
    if (POE.shown && j === st.ok) cls += ' right';
    if (POE.shown && POE.pick === j && j !== st.ok) cls += ' wrongpick';
    h += `<button class="${cls}" data-j="${j}"${STUDENT && POE.shown ? ' disabled' : ''}><span class="L">${letters[d]}</span><span>${t(P + '_o' + (j + 1))}</span></button>`;
  }
  h += `</div>`;
  if (POE.shown && STUDENT && POE.pick != null && POE.pick !== st.ok) h += `<p class="ex wrongex"><b>${t('poe_your')}</b> ${t(P + '_w' + (POE.pick + 1))}</p>`;
  if (POE.shown) h += `<p class="ex"><b>${t('poe_ans')}</b> ${t(P + '_e')}</p>`;
  const last = POE.i === steps.length - 1, needPick = STUDENT && POE.pick == null;
  const done = Object.keys(POE.res).filter(k => k.startsWith(cur + ':')), right = done.filter(k => POE.res[k]).length;
  h += `<div class="nav">` + (POE.shown ? '' : `<button class="btn" id="poeShow"${needPick ? ' disabled' : ''}>${t('poe_show')}</button>`) +
    (POE.i > 0 ? `<button class="btn ghost" id="poePrev">${t('poe_prev')}</button>` : '') +
    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT && POE.shown ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>`) +
    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); });
  if (needPick && !POE.shown) box.querySelector('.nav').insertAdjacentHTML('beforeend', `<span class="small" style="align-self:center">${t('poe_pick_first')}</span>`);
  if ($('poeShow')) $('poeShow').onclick = () => { if (STUDENT && POE.pick == null) return; POE.shown = true;
    const key = cur + ':' + POE.i; if (!(key in POE.res)) POE.res[key] = POE.pick === st.ok; st.apply(); S.update(); poeRender(); };
  if ($('poePrev')) $('poePrev').onclick = () => { POE.i--; POE.pick = null; POE.shown = false; poeSetup(); };
  if ($('poeNext')) $('poeNext').onclick = () => { POE.i++; POE.pick = null; POE.shown = false; poeSetup(); };
  $('poeExit').onclick = () => { POE.on = false; poeRender(); };
  box.scrollIntoView({ block: 'nearest' });
}
function poeSetup(){ const st = SCENES[cur].poe[POE.i]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

let cur = '1b', qn = 1, lvl = 'b';
function show(){
  cur = qn + lvl;
  Object.keys(SCENES).forEach(k => { $('sc' + k).hidden = k !== cur; });
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.q === qn)));
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lvl)));
  $('qline').textContent = t('q' + qn);
  POE.on = false; poeRender();
  SCENES[cur].update();

}
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;
  const top = sc.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--avail', Math.max(340, Math.floor(window.innerHeight - top - 10)) + 'px');
}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { qn = +b.dataset.q; show(); });
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => { lvl = b.dataset.l; show(); });
  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); poeSetup(); };
  $('capT').onchange = () => { document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !$('capT').checked); if (POE.on) poeRender(); };
  $('legendBtn').onclick = () => { try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };
  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ qn = +e.key; show(); }
    if (e.key === 'b' || e.key === 'и'){ lvl = lvl === 'b' ? 'a' : 'b'; show(); } });
  $('srcList').innerHTML = Object.keys(TEXTS).filter(k => k.startsWith('src_')).sort().map(k => `<li>${TEXTS[k]}</li>`).join('');
  let last = performance.now();
  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));
}

function mitoParticles(K, n){

  }

    p.st = 'cyto'; p.a = 1; p.kind = o.medium ? 'M' : 'L';
    if (o.fromFAS && Math.random() < o.fromFAS){ p.x = 112; p.y = 178; p.vx = 40 + Math.random() * 20; p.vy = (Math.random() - .5) * 20; }
    else { p.x = 220 + Math.random() * 230; p.y = 72 + Math.random() * 16; p.vx = (Math.random() - .5) * 30; p.vy = 14 + Math.random() * 16; }

    const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 3.2); c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'var(--muted)'); c.setAttribute('stroke-width', 1.6);

  }

    for (const p of P){
      if (p.st === 'cyto'){
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 200 && p.vx < 0 && p.y > 70) p.vx = Math.abs(p.vx);
        if (p.x > 462) p.vx = -Math.abs(p.vx);
        if (p.y < 70) p.vy = Math.abs(p.vy);
        if (p.y > 206){
          if (p.kind === 'L' && Math.abs(p.x - 302) < 28 && Math.random() < o.cpt1 * 6 * dt){ p.st = 'cpt1'; p.x = 302; }
          else if (p.kind === 'M' && p.x > 380 && Math.random() < o.mcfa * 6 * dt){ p.st = 'mdown'; }
          else if (p.y > 212){ p.y = 212; p.vy = -(10 + Math.random() * 20); p.vx = (Math.random() - .5) * 50; }

      } else if (p.st === 'box'){
        p.x += 55 * dt; p.y += (340 - p.y) * 1.6 * dt; p.a -= .7 * dt;

      }
      p.c.setAttribute('cx', p.x.toFixed(1)); p.c.setAttribute('cy', p.y.toFixed(1)); p.c.setAttribute('opacity', Math.max(0, p.a).toFixed(2));
      p.c.setAttribute('fill', p.kind === 'C' ? 'var(--carn)' : p.kind === 'M' ? 'var(--aa)' : 'var(--acyl)');

/* =====================================================================
   Вопрос 4. Аутофагия → лизосомный гидролиз → повторная активация mTORC1
   Общая модель во времени (часы). Параметры подобраны под порядок событий у Yu et al. 2010:
   mTORC1 гаснет за ~0,5 ч, возвращается к ~3–5 ч, аутофагия максимальна к ~4–5 ч,
   лизосом меньше всего к ~3 ч, восстановлены к ~8–12 ч. Числа условные.
   4b — базовый: мультфильм + график;  4a — «измерь поток»: микроскоп mCherry-GFP-LC3, блот ± бафиломицин, мутанты
   v2.1: у mTORC1 два выхода — чувствительный к рапамицину (S6K, восстановление лизосом) и устойчивый (ULK1 S757,
   торможение аутофагии; Thoreen 2009, Kang 2013). Бафиломицин — вторая чашка: копия клетки за 2 ч до съёмки,
   в которой ничего не переваривается; обе чашки измеряются в один момент.
   ===================================================================== */
const AUTO = { kb: .9, ks: 1.3, y: 4.5, ka: .7, kf: 1.44, kd: .235, c: 1.94, kr: .95, kbio: .036, tauA: 1.42, tauT: 2.4, alr: 2, kl: 2.5 };   // v2.1: подогнано под Yu 2010 (p-S6K подавлен к 2 ч, восстановлен к 6 ч; лизосом меньше всего около 3–4 ч)
const AUTO_KEYS = ['t', 'E', 'AA', 'A', 'AP', 'AL', 'Lc', 'L', 'T', 'R', 'p62', 'M', 'Mres', 'Mr', 'form', 'fus', 'deg', 'dipped'];
function autoCk(S){ const c = {}; AUTO_KEYS.forEach(k => c[k] = S[k]); return c; }
function autoNew(o){
  const S = Object.assign({ t: 0, E: 1, AA: 1, A: 0, AP: 0, AL: 0, Lc: 0, L: 1, T: 0, R: 1, p62: .5, M: 1, Mres: 1, Mr: 1, form: 0, fus: 0, deg: 0,
    hist: [], marks: [], refeed: [], ev: [], ck: [], run: false, dipped: false, geno: 'wt', inter: 'none', block: false, baf: false, t0: null }, o || {});
  if (!(o && o.raw)){                                        // сытая клетка в равновесии: идёт небольшая базальная аутофагия
    for (let i = 0; i < 800; i++) autoStep(S, .005);
    S.t = 0; S.dipped = false;
  }
  if (S.geno === 'atg7' && !(o && 'p62' in o)) S.p62 = .8;   // без ATG7 p62 повышен уже в сытости
  S.ck.push(autoCk(S)); return S;
}
function autoStep(S, dt){
  const P = AUTO, Mr = Math.min(1, Hn(S.AA, .45, 4));
  let Mres = Mr;                                               // выход mTORC1, устойчивый к рапамицину (ULK1 S757)
  if (S.geno === 'ampk' && !S.E && S.t0 != null) Mres *= 1 - .4 * clamp((S.t - S.t0 - 1) / 2);
  let M = Mres;                                                // выход, чувствительный к рапамицину (S6K, восстановление лизосом)
  if (S.inter === 'rapa' && S.t0 != null && S.t >= S.t0 + 2) M = .1 * Mres;
  const block = (S.block || S.inter === 'prot' || S.baf) ? 1 : 0, atg = S.geno === 'atg7' ? 0 : 1;
  const ka = P.ka * (S.geno === 'ampk' ? 1.4 : 1);
  const deg = P.kd * S.AL * (1 - block), form = ka * S.A * S.R * atg;
  const fusL = P.kf * S.L * S.AP, fusA = P.kf * S.AL / (1 + S.AL) * S.AP, fus = fusL + fusA;   // аутофагосомы сливаются с лизосомами и с уже готовыми аутолизосомами
  const dAA = S.E * (P.kb + P.ks) - S.AA * (P.kb + P.ks * M) + P.y * deg - 20 * Math.max(0, S.AA - 1);   // избыток аминокислот окисляется
  const dA = ((.05 + .95 * (1 - Mres)) - S.A) / P.tauA;   // небольшая базальная аутофагия идёт всегда
  const dL = -P.c * fusL + P.kr * M * (1 - S.L) * (1 + P.alr * S.AL) + P.kbio * S.T * (1 - S.L);

  S.M = M; S.Mres = Mres; S.Mr = Mr; S.form = form; S.fus = fus; S.deg = deg; S.t += dt;

function autoSnap(S){ return { t: S.t, AA: S.AA, M: S.M, form: S.form, deg: S.deg, L: S.L }; }

function autoStarve(S){ S.E = 0; S.dipped = false; S.marks.push(S.t); S.ev.push([S.t, 0]); if (S.t0 == null) S.t0 = S.t; }
function autoFeed(S){ S.E = 1; S.refeed.push(S.t); S.ev.push([S.t, 1]); }
/* повтор последних `hours` часов той же клетки из сохранённой точки: с бафиломицином (вторая чашка) или без него.
   onStep(чашка, dt) вызывается на каждом шаге — так считаются вклады в прибавку LC3-II */
function autoBranch(S, hours, baf, onStep){
  const from = S.t - hours;

    autoStep(B, d);
  }

}

}

    const docked = S.M > .5;
    move('s4b_mt', docked ? 0 : -30, docked ? 0 : -170); setOp('s4b_glow', S.M * .9);
    const tn = S.T > .5; move('s4b_tf', tn ? 222 : 0, tn ? -62 : 0); setOp('s4b_tfP', tn ? 0 : 1);
    const nAA = Math.round(Math.min(1.2, S.AA) / 1.2 * AA.length);
    $('s4b_aa').querySelectorAll('circle').forEach((c, i) => c.setAttribute('opacity', i < nAA ? .9 : 0));
    const nAP = Math.min(AU.length, Math.round(S.AP * 7)), nAL = Math.min(AL.length, Math.round(S.AL * 7));
    $('s4b_ap').querySelectorAll(':scope > g').forEach((g, i) => g.setAttribute('opacity', i < nAP ? 1 : 0));
    const alr = S.M > .5 && S.AL > .2 && !S.block;
    $('s4b_al').querySelectorAll(':scope > g').forEach((g, i) => { g.setAttribute('opacity', i < nAL ? 1 : 0); g.querySelector('.alr').setAttribute('opacity', alr ? 1 : 0); });
    const nL = Math.max(1, Math.min(LY.length, Math.round(S.L * LY.length)));
    $('s4b_ly').querySelectorAll('circle').forEach((c, i) => c.setAttribute('opacity', i < nL ? 1 : .07));
    const last = S.marks[S.marks.length - 1];
    let k;
    if (S.E && !S.marks.length) k = 's4_c_fed';
    else if (S.E) k = 's4_c_refed';
    else if (S.block && S.t - last > 1.05) k = 's4_c_block';
    else if (!S.dipped) k = 's4_c_fall';
    else if (S.M < .5 && S.t - last < 1.6) k = 's4_c_early';
    else if (S.M < .5) k = 's4_c_auto';
    else if (S.L < .8) k = 's4_c_react';
    else k = 's4_c_done';
    setCap(K, k);
    $('reads' + K).innerHTML = meterRow(t('r_mtorc1'), S.M, pct(S.M) + ' %') + meterRow(t('s4_r_ap'), S.AP / 1.2, fmt(S.AP, 1)) +
      meterRow(t('s4_r_al'), S.AL / 2, fmt(S.AL, 1)) + meterRow(t('s4_r_ly'), S.L, pct(S.L) + ' %');

  }
  function reset(){ S = autoNew({ block: $('s4b_block').checked }); S.hist.push(autoSnap(S)); draw(); }
  $('s4b_play').onclick = () => { if (S.t >= 12) reset(); S.run = !S.run; draw(); };
  $('s4b_feed').onclick = () => { if (S.E) autoStarve(S); else autoFeed(S); if (!S.run && S.t < 12) S.run = true; draw(); };
  $('s4b_reset').onclick = reset;
  $('s4b_block').onchange = () => { S.block = $('s4b_block').checked; draw(); };
  let acc = 0;
  function tick(dt){
    if (!S.run) return;
    autoAdvance(S, dt * .4);
    if (S.t >= 12) S.run = false;
    acc += dt; if (acc > .1 || !S.run){ acc = 0; draw(); }
  }
  const prep = (block, starveH) => { $('s4b_block').checked = block; S = autoNew({ block }); S.hist.push(autoSnap(S)); if (starveH != null){ autoStarve(S); autoRunTo(S, starveH); } };
  SCENES[K] = { update: draw, tick, redraw: draw, poe: [
    { n: 3, ok: 0, pre(){ prep(false); }, apply(){ autoStarve(S); autoRunTo(S, 1); } },
    { n: 3, ok: 1, pre(){ prep(false, 1); }, apply(){ autoRunTo(S, 7); } },

    { n: 3, ok: 0, pre(){ prep(false, 3); }, apply(){ autoFeed(S); autoRunTo(S, 5); } },
  ] };
  draw();
})();

(function(){

  <text x="16" y="26" class="lbl-l mono" font-size="13" style="fill:#C7D0DA">mCherry-GFP-LC3</text>
  <text x="584" y="26" class="lbl mono" id="s4a_clock" font-size="15" font-weight="700" style="fill:#F4F6F8;text-anchor:end"></text>
  <text x="584" y="48" class="lbl mono" id="s4a_sinceL" font-size="12" font-weight="600" style="fill:#C7D0DA;text-anchor:end"></text>

  <circle cx="24" cy="384" r="5" fill="${YEL}"/><text x="36" y="384" class="lbl-l" id="s4a_yL" font-size="12" style="fill:#E8EDF2">${t('s4a_y')}</text>
  <circle cx="24" cy="404" r="5" fill="${RED}"/><text x="36" y="404" class="lbl-l" id="s4a_rL" font-size="12" style="fill:#E8EDF2">${t('s4a_r')}</text>`;
  $('ctrl' + K).innerHTML = autoButtons('s4a') +

    segHTML('s4a_int', 'int_t', [['none', 'int_none'], ['prot', 'int_prot'], ['rapa', 'int_rapa']], 'none') +
    toggleHTML('s4a_baf', 's4a_bafview', false) +
    `<div class="timebox" id="s4a_time"></div><p class="small plotcap">${t('s4a_plotcap')}</p><canvas class="plot" id="s4a_plot"></canvas>` + autoLegend(true);
  $('reads' + K).innerHTML = `<div id="s4a_now" style="display:grid;gap:7px"></div>
    <div style="display:grid;gap:8px;margin-top:6px"><div class="label" style="margin:0">${t('blot_t4')}</div>
    <div class="btns"><button class="btn" id="s4a_rec">${t('blot_rec4')}</button><button class="btn ghost" id="s4a_clr">${t('blot_clr')}</button></div>
    <div id="s4a_blot"></div><div class="lanekey" id="s4a_key"></div><p class="small" style="margin:0">${t('blot_note4')}</p></div>`;
  $('take' + K).textContent = t('s4a_take');
  let S = autoNew(); S.hist.push(autoSnap(S));
  let lanes = [], keys = [];
  const BAF_H = 2;
  /* показания одной чашки: LC3-II на мембранах аутофагосом и внутри аутолизосом (там его разрушают протеазы) */
  function markers(C){
    const atg = C.geno !== 'atg7';
    const II = atg ? .12 + .5 * (C.AP + C.Lc) : 0;
    return { I: atg ? clamp(1 - .45 * Math.min(1, II)) : 1, II, p62: C.p62, s6k: C.M, ulk: C.Mres };
  }
  function renderBlot(){
    $('s4a_blot').innerHTML = blotHTML(['LC3-I', 'LC3-II', 'p62', 'p-S6K (T389)', t('b_ulk'), t('b_actin')], lanes);
    $('s4a_key').innerHTML = keys.map(k => `<span>${k}</span>`).join('');
  }
  function record(){
    const B = autoTwin(S, BAF_H), a = markers(S), b = markers(B), last = S.marks[S.marks.length - 1];
    const lab = S.E ? t(S.marks.length ? 'blot_refed_l' : 'blot_fed_l') : fmt(S.t - last, 1) + ' ' + t('h_short');
    const h = S.E ? t(S.marks.length ? 'blot_refed' : 'blot_fed') : t('blot_starved', { h: fmt(S.t - last, 1) });
    const sc = v => clamp(v / 1.6);
    lanes.push({ h1: lab, h2: '−Б', v: [a.I, sc(a.II), clamp(a.p62 / 1.2), a.s6k, a.ulk, .9] }, { h1: lab, h2: '+Б', v: [b.I, sc(b.II), clamp(b.p62 / 1.2), b.s6k, b.ulk, .9] });
    const dII = Math.max(0, b.II - a.II), dig = Math.min(dII, autoDigested(S, S.t - B.bafFrom)), r2 = v => Math.round(v * 100) / 100;

    while (lanes.length > 8){ lanes.splice(0, 2); keys.shift(); }
    renderBlot();
  }
  function draw(){

    const C = baf ? autoTwin(S, BAF_H) : S, exp = baf ? S.t - C.bafFrom : 0;

    setTxt('s4a_yL', t(baf ? 's4a_y_baf' : 's4a_y')); setTxt('s4a_rL', t(baf ? 's4a_r_baf' : 's4a_r'));

    $('s4a_feed').textContent = t(S.E ? 's4_starve' : 's4_feed');

    $('s4a_r').querySelectorAll(':scope > g').forEach((g, i) => { g.setAttribute('opacity', i < nR ? 1 : 0); g.querySelectorAll('circle').forEach(c => c.setAttribute('fill', baf ? YEL : RED)); });
    setOp('s4a_haze', atg ? .04 : .16);
    const m = markers(C), yel = baf ? nY + nR : nY, red = baf ? 0 : nR;
    $('s4a_now').innerHTML = readRow(t(baf ? 's4a_dish_baf' : 's4a_dish_ctrl'), '', '') +
      readRow(t('s4a_ny'), '', `<span class="v">${yel}</span>`) + readRow(t('s4a_nr'), '', `<span class="v">${red}</span>`) +
      meterRow(t('s4a_r_s6k'), C.M, pct(C.M) + ' %') + meterRow(t('s4a_r_ulk'), C.Mres, pct(C.Mres) + ' %') +
      meterRow(t('s4_r_ly'), C.L, pct(C.L) + ' %') + meterRow('p62', m.p62 / 1.2, fmt(m.p62, 2));
    const last = S.marks[S.marks.length - 1], sinceStarve = S.E ? 0 : S.t - last;
    let k;
    if (baf && atg && sinceStarve > 1.05 && S.inter === 'prot') k = 's4a_c_baf_prot';
    else if (baf && atg && sinceStarve > 1.05) k = 's4a_c_baf';
    else if (!S.marks.length) k = 's4a_c_fed';
    else if (S.E) k = 's4a_c_refed';
    else if (!atg) k = 's4a_c_atg7';
    else if (S.inter === 'prot' && sinceStarve > 1.05) k = 's4a_c_prot';
    else if (S.inter === 'rapa' && S.t0 != null && S.t >= S.t0 + 2 && S.Mres > .5) k = 's4a_c_rapa';
    else if (S.geno === 'ampk' && sinceStarve > 2.05) k = 's4a_c_ampk';
