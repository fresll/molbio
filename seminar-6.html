и таблица). Образцам соответствуют три условия, по одному на образец: нокаут TET, генетическое выключение поддерживающего метилирования (система DNMT1–UHRF1) и аскорбат. Какое условие у образца Z?", "p1a_8_o1": "Аскорбат: у Z разность сигналов бисульфита и oxBS-seq больше контрольной, значит, доля 5hmC повышена.", "p1a_8_o2": "Выключение DNMT1–UHRF1: на новой цепи метка появляется редко, поэтому у образца Z снижены оба сигнала.", "p1a_8_o3": "Нокаут TET: без окисления метка не поддерживается, поэтому у образца Z снижены оба сигнала.", "p1a_8_k": "Бисульфит читает 5mC и 5hmC вместе, а oxBS-seq — только 5mC, поэтому разность двух сигналов указывает на 5hmC. Аскорбат повышает активность TET: 5hmC накапливается, а 5mC убывает по мере делений.", "p1a_8_e": "В модели через 6 делений в контроле сигнал бисульфита составляет 70 %, а сигнал oxBS-seq — 68 %. У образца X при округлении оба сигнала составляют 74 %: без TET 5hmC не образуется (разность методов близка к нулю), а 5mC не окисляется, поэтому её немного больше нормы. У образца Y сигналы снижены до 18 % и 17 %: без копирования метка на новой цепи ставится лишь de novo, и разность методов мала. У образца Z сигнал бисульфита равен 54 %, а сигнал oxBS-seq — 48 %: разность в шесть процентных пунктов — это 5hmC (в модели её более чем вдвое больше, чем в контроле), а убыль 5mC вызвана окислением при повышенной активности TET. В ЭСК мыши аскорбат быстро повышал 5hmC, доли 5fC и 5caC возрастали более чем в 10 раз, а общее содержание 5mC снижалось примерно на две пятых (Yin 2013); в клетках без Tet1 и Tet2 эффекта не было (Blaschke 2013). Разность двух измерений оценивает долю 5hmC надёжно, когда 5hmC много; при малой доле 5hmC она ненадёжна (это соображение об устройстве метода, а не результат конкретной работы).", "p1a_8_w2": "Вариант приписывает Z потерю копирования. Без копирования метки (образец Y) оба сигнала снижены сильно, до 18 % и 17 %, а разности методов почти нет. У образца Z снижение умеренное (54 % и 48 %) и есть разность методов, поэтому причина — окисление 5mC, а не потеря копирования.", "p1a_8_w3": "Вариант считает TET ферментом поддержания метилирования. Без TET 5hmC не образуется, и сигналы бисульфита и oxBS-seq практически совпадают, а метилирование не падает, а немного растёт (образец X: 74 % и 74 % против 70 % и 68 % в контроле). Образец Z с разностью методов и умеренным снижением сигналов этому условию не соответствует.", "gn_m_measure": "Как измеряют", "g_m_measure": "Метилирование цитозина определяют бисульфитным секвенированием: бисульфит превращает неметилированный цитозин в урацил (в прочтении — T), а 5mC и 5hmC прочитываются как C, поэтому метод читает сумму 5mC и 5hmC и не различает их (Huang 2010; Booth 2012). Для разделения применяют oxBS-seq: 5hmC окисляют до 5fC, и остаётся сигнал только 5mC (Booth 2012; Booth 2013); в TAB-seq защищают 5hmC глюкозилированием и окисляют 5mC, и сигнал даёт 5hmC (Yu 2012). Для 5fC и 5caC существуют redBS-seq и CAB-seq (Booth 2014; Lu 2013). Метилирование обеих цепей одной молекулы читает шпилечный бисульфит (Laird 2004): по двум прочтениям видно, метилирована диада на обеих цепях (MM), на одной (MU) или ни на одной (UU); по обычному бисульфиту полуметилированность не видна. Доли MM, MU и UU на экране рассчитаны по модели, а не измерены; в опыте их получают из прочтений отдельных молекул с поправкой на неполноту реакции. Единица времени в сцене — число делений, поскольку в этой модели потеря и восстановление метки рассчитываются по циклам репликации; метилирование новой цепи отстаёт от репликации на часы (Charlton 2018), и это отставание модель не рассчитывает. Оговорка: в областях с малой долей 5hmC разность двух измерений (бисульфит минус oxBS-seq) ненадёжна; это соображение об устройстве метода, а не результат конкретной работы. В продвинутой сцене показаны все методы сразу: сигнал бисульфита (5mC и 5hmC), oxBS-seq (5mC), TAB-seq (5hmC), диады MU по шпилечному бисульфиту и 5fC с 5caC. Бисульфит читает 5fC и 5caC как неметилированный цитозин, поэтому их выявляют отдельными методами. На блоте строки — методы, дорожки — условия; плотность полосы — условная мера (TAB-seq и шпилечный бисульфит усилены, 5fC и 5caC даны на логарифмической шкале), а число полос не равно потоку.", "gn_m_model": "Что упрощено", "g_m_model": "Модель описывает один CpG-динуклеотид (диаду) в линии делящихся клеток. Состояние диады — пара состояний двух цепей; при репликации каждая дочерняя диада получает одну старую цепь и новую цепь. Новая цепь метилируется с вероятностью Em, если старая цепь метилирована (копирование DNMT1 с UHRF1), и с вероятностью Ed, если старая цепь не метилирована (метилирование de novo DNMT3A/B). Допущение: Em и Ed определяются совместным вкладом копирования и метилирования de novo; эти процессы представлены как независимые попытки метилирования, поэтому при нулевой активности копирования Em становится равной Ed, а при нулевом de novo Ed равна нулю. Другие допущения: сайты независимы, как в моделях Laird 2004 и Pfeifer 1990, а соседние CpG, положение в нуклеосоме и связывание факторов не учитываются (скорости поддержания в ЭСК мыши различаются до двух порядков; Ginno 2020); исходное состояние района стационарно, а воздействие начинается с первого деления; гибель клеток, влияние метки на транскрипцию и отставание метилирования новой цепи в пределах цикла (Charlton 2018) не рассчитываются. Значения Em = 96 % и Ed = 17 % для гиперметилированного острова — оценка по диадам одного района (Laird 2004); значения для других районов в продвинутой сцене — допущения построителя модели, потому что в использованных работах чисел для них нет. Продвинутая сцена добавляет четыре состояния цепи — C, 5mC, 5hmC и объединённые 5fC с 5caC — и 16 состояний диады. Между делениями TET окисляет 5mC в 5hmC, затем в 5fC и 5caC, а TDG с репарацией возвращает цитозин; скорости на цикл подобраны так, чтобы 5hmC составляла порядка процентов цепей, а доля 5fC и 5caC была в десятки раз меньше доли 5hmC (по порядку величины как в ЭСК мыши, Ito 2011), и не измерены. DNMT1 в модели не метилирует новую цепь напротив старых цепей с 5hmC, 5fC и 5caC (Hashimoto 2012: активность более чем в 60 раз ниже), DNMT3A/B ставят метку независимо от состояния старой цепи. Метилирующий потенциал — безразмерный множитель Em и Ed; препараты заданы множителями активности ферментов, подобранными под направление работ. Em и Ed повторов, PMD и острова без метки, скорость потери метилирования PMD и исходное состояние «молодой» линии — допущения построителя. Из-за окисления исходная доля MM в острове с меткой около 63 %, а не 78 %, как в базовой сцене.", "gn_m_uhrf1": "UHRF1", "g_m_uhrf1": "UHRF1 — белок, который узнаёт полуметилированный CpG и направляет к нему DNMT1. SRA-домен UHRF1 связывает полуметилированную ДНК и выворачивает 5mC из двойной спирали (структуры: Arita 2008; Avvakumov 2008; Hashimoto 2008). В клетках UHRF1 нужен для поддержания метилирования: в Np95-дефицитных ЭСК и эмбрионах мыши теряется глобальное и локальное метилирование (Bostick 2007; Sharif 2007). In vitro UHRF1 повышает активность DNMT1 примерно в 5 раз и её специфичность к полуметилированным CpG (Bashtrykov 2014). UHRF1 читает и гистоновую метку: ассоциация с метилированным H3K9 нужна для поддержания метилирования (Rothbart 2012); убиквитинирование гистона H3 с участием UHRF1 привлекает DNMT1 и раскрывает её активный центр (Nishiyama 2013; Qin 2015). В модели вклад UHRF1 и DNMT1 объединён в одну настройку «копирование метки»: потеря UHRF1 соответствует активности около одной пятой нормы (допущение по Bashtrykov 2014), нокаут DNMT1 — нулю. Оговорка: Np95-нулевые клетки гиперчувствительны к повреждающим агентам (Muto 2002), поэтому потеря UHRF1 не сводится к потере метилирования.", "gn_m_dnmt1": "DNMT1", "g_m_dnmt1": "DNMT1 — ДНК-метилтрансфераза (фермент, переносящий метильную группу от SAM на атом C5 цитозина), которая метилирует цитозин на новой цепи напротив 5mC на старой цепи. In vitro DNMT1 метилирует полуметилированный CpG в 30–40 раз быстрее неметилированного на олигонуклеотидах и в 15 раз на длинных субстратах, действует процессивно и с точностью выше 95 % на полуметилированной матрице (Goyal 2006; Vilkaitis 2005). На полуметилированном сайте с 5mC активность DNMT1 более чем в 60 раз выше, чем на сайте с 5hmC на одной цепи и на неметилированном (Hashimoto 2012). Без подходящей ДНК фермент автоингибирован: домен RFTS занимает ДНК-связывающий карман, а линкер CXXC–BAH1 закрывает активный центр (Song 2011; Takeshita 2011). В клетке DNMT1 направляется к полуметилированным сайтам белком UHRF1, поэтому в модели их активность задаёт одна настройка «копирование метки». Копирование неполное: вероятность метки на новой цепи при метилированной старой (Em) оценена в 96 % для гиперметилированного CpG-острова FMR1 неактивной X-хромосомы в лимфоцитах человека (Laird 2004), а для острова PGK1 в клонах другой линии оценка выше (Pfeifer 1990); в ЭСК мыши скорости поддержания различаются до двух порядков между сайтами с одинаковым стационарным метилированием (Ginno 2020). Поэтому Em зависит от района и системы и не является константой. Оговорка: DNMT1 обладает и активностью de novo на ретротранспозонах, зависящей от UHRF1 (Haggerty 2021); в модели она не рассчитывается.", "gn_m_dnmt3": "DNMT3A и DNMT3B", "g_m_dnmt3": "DNMT3A и DNMT3B — ДНК-метилтрансферазы метилирования de novo: они метилируют цитозин независимо от того, метилирована ли противоположная цепь. In vitro их активность на неметилированной, полуметилированной и полугидроксиметилированной ДНК примерно одинакова (Hashimoto 2012). В ЭСК и ранних эмбрионах мыши они нужны для установления метилирования (Okano 1999). Каталитически неактивный DNMT3L образует с DNMT3A тетрамер, а ADD-домен DNMT3A связывает хвост гистона H3 с немодифицированным K4 (Ooi 2007; Zhang 2018); DNMT3B направляется в тела транскрибируемых генов (Baubec 2015). В исследованных эмбриональных стволовых клетках мыши это связывание зависело от H3K36me3, которую создаёт SETD2, и от функционального PWWP-домена DNMT3B (Baubec 2015). Поэтому метилирование тела активно транскрибируемого гена нельзя автоматически истолковывать как подавление его промотора: в тех же клетках DNMT3A и DNMT3B не обнаруживались на активных промоторах и энхансерах (Baubec 2015). В модели DNMT3A/B ставят метку на новую цепь с вероятностью Ed, когда старая цепь не метилирована, и добавляют вклад к Em. Ed оценена в 17 % для гиперметилированного острова FMR1 (Laird 2004), а в неметилированных CpG-островках промоторов ошибки, в основном de novo метилирование, составляют около 0,1 % на сайт и поколение (Ushijima 2003; клетки молочной железы человека). Вклад в поддержание: на повторах и в ЭСК мыши DNMT3A/B возмещают неполноту копирования (Liang 2002; Chen 2003; Jones 2009), а в hESC без DNMT3A и DNMT3B метилирование снижалось примерно на одну десятую за около 20 пассажей (оценка по рисунку; Charlton 2018). Оговорка: мутации DNMT3B вызывают синдром ICF1 с потерей метилирования околоцентромерных сателлитов (Hansen 1999; Xu 1999), но это не общая потеря метилирования.", "gn_m_tet": "TET", "g_m_tet": "TET — семейство Fe(II)- и 2-оксоглутарат-зависимых диоксигеназ, которые окисляют 5mC в 5hmC, а затем в 5fC и 5caC. Белки TET окисляют 5mC в 5hmC и образуют также 5fC и 5caC (Tahiliani 2009; Ito 2010; Ito 2011; He 2011). В ЭСК мыши на 10⁶ цитозинов приходится около 1,3×10³ 5hmC, 20 5fC и 3 5caC, поэтому 5fC и 5caC в десятки и сотни раз реже 5hmC (расчёт из данных Ito 2011). 5hmC — в основном стабильная модификация, а не короткоживущий промежуточный продукт: в клетках человека и ЭСК мыши по изотопной метке она образуется медленно в течение около 30 ч после синтеза ДНК, а её глобальный уровень в тканях мыши связан с пролиферацией (Bachman 2014). Окисленные формы теряются и пассивно, разводясь при репликации (Inoue 2011; Kagiwada 2013). В модели настройка «TET» задаёт долю нормальной скорости окисления; при нуле 5hmC, 5fC и 5caC не образуются и разводятся делениями, а 5mC немного накапливается. Доля 5hmC в модели подобрана и составляет порядка процентов цепей острова. Оговорка: нокаут TET не останавливает метилирование вообще, потому что метку ставят DNMT; в тройном нокауте Tet в ЭСК мыши наблюдали нарушение дифференцировки и гиперметилирование промоторов в эмбриоидных тельцах (Dawlaty 2014).", "gn_m_tdg": "TDG и репарация", "g_m_tdg": "TDG — тимин-ДНК-гликозилаза, которая вырезает 5fC и 5caC из ДНК, после чего эксцизионная репарация оснований возвращает цитозин. TDG вырезает 5fC и 5caC (He 2011; Maiti 2011), а 5hmC среди её субстратов в использованных работах не названа (вырезается продукт дезаминирования 5hmC — 5hmU). В ЭСК мыши 5fC и 5caC накапливаются на регуляторных элементах при подавлении TDG (Shen 2013); нокаут Tdg у мыши летален для эмбриона (Cortázar 2011). Путь «окисление TET → вырезание TDG → репарация» — один из механизмов активного деметилирования, но его масштаб остаётся предметом спора: в тканях мыши 5fC и 5caC в одном исследовании не обнаружены (Globisch 2010), а в ЭСК они выявляются (Ito 2011; Shen 2013). В модели настройка «TDG» задаёт долю нормальной скорости возвращения 5fC и 5caC в цитозин; в норме скорость принята быстрой (допущение: чисел для неё в использованных рефератах нет).", "gn_m_sam": "SAM и SAH: метилирующий потенциал", "g_m_sam": "SAM (S-аденозилметионин) — донор метильной группы для ДНК-метилтрансфераз, а SAH (S-аденозилгомоцистеин) — продукт метилтрансферазной реакции. Метилирующий потенциал определяется не одним SAM: у мышей CBS⁺/⁻ на метил-дефицитной диете снижение SAM само по себе не снижало метилирование ДНК, а рост SAH (отдельно или вместе со снижением SAM) был наиболее последовательно связан с гипометилированием (Caudill 2001); механизм (ингибирование продуктом, недостаток субстрата или оба) в работе обсуждается. В клетках в культуре метилирование гистона H3K4me3 быстро и обратимо отвечает на метионин и SAM (Mentch 2015). В модели метилирующий потенциал g — безразмерный множитель вероятностей метки Em и Ed: при кнопке «SAM снижен» g около 0,95, при кнопке «SAH повышен» около 0,67. Значения подобраны под направление работы Caudill 2001 и не измерены: внутриклеточных концентраций SAM и SAH и констант DNMT по SAM в использованных работах нет.", "gn_m_region": "Район генома", "g_m_region": "Район задаёт опорные вероятности метки на новой цепи: Em при метилированной старой цепи и Ed при неметилированной. Остров с меткой: Em 96 %, Ed 17 % — оценка Laird 2004 для CpG-острова гена FMR1 неактивной X-хромосомы в лимфоцитах человека (шпилечный бисульфит); для острова PGK1 оценка Em выше (Pfeifer 1990), поэтому значения зависят от района и системы. Остров без метки: Ed около 0,1 % на сайт и поколение (Ushijima 2003; клетки молочной железы человека), Em — допущение. Повторы: Em и Ed — допущение; в ЭСК мыши без Dnmt3a и Dnmt3b метилирование повторов и одиночных генов теряется постепенно (Liang 2002; Chen 2003). Домен PMD — поздно реплицирующийся район с частичной потерей метилирования: потеря следует за числом делений (Zhou 2018; Endicott 2022), а значения Em и Ed и исходное состояние «молодой» линии — допущения. Оговорка: в модели сайты независимы, а скорости поддержания в ЭСК мыши различаются до двух порядков между сайтами с одинаковым стационарным метилированием (Ginno 2020).", "gn_m_ox": "5mC, 5hmC, 5fC и 5caC", "g_m_ox": "На схеме показаны четыре состояния цитозина в CpG: цитозин (C), 5-метилцитозин (5mC), 5-гидроксиметилцитозин (5hmC) и 5-формилцитозин с 5-карбоксилцитозином (5fC и 5caC вместе). 5mC ставят DNMT; TET окисляют 5mC в 5hmC, затем в 5fC и 5caC, а TDG с репарацией возвращает цитозин (Ito 2011; He 2011). In vitro DNMT1 метилирует цитозин напротив 5mC более чем в 60 раз активнее, чем напротив 5hmC (Hashimoto 2012), поэтому в модели напротив старой цепи с 5hmC, 5fC или 5caC DNMT1 новую цепь не метилирует; DNMT3A/B ставят метку при любом состоянии старой цепи примерно одинаково. Бисульфит читает 5mC и 5hmC как метилированные, а 5fC и 5caC — как неметилированный цитозин. Оговорка: окисленные основания влияют на метилирование противоположной цепи и соседнего CpG in vitro (Ji 2014), а масштаб активного деметилирования в тканях остаётся предметом спора (Globisch 2010).", "gn_m_drugs": "Препараты в модели", "g_m_drugs": "В сцене пять вариантов: без препарата, децитабин, азацитидин, нековалентный ингибитор DNMT1 и аскорбат; все действуют с первого деления. Децитабин (5-аза-2′-дезоксицитидин) включается в ДНК при репликации и ковалентно захватывает DNMT; токсичность в клетках млекопитающих в основном вызвана захватом фермента, а не деметилированием (Jones 1980; Santi 1984; Jüttermann 1994). В этой модели эффект децитабина без репликации не рассчитывается, а метилирование убывает по мере делений; в модели активность копирования к k-му делению составляет exp(−0,6k) от нормы (скорость подобрана). Азацитидин — рибонуклеозид: как считается, 80–90 % его включается в РНК и 10–20 % — в ДНК (Aimiuwu 2012); в модели он действует как децитабин, но с 15 % его силы. Клинический ответ не сводится к деметилированию: влияет и индукция апоптоза (Stresemann 2008; децитабин при миелодиспластических синдромах — Kantarjian 2006; азацитидин при MDS высокого риска — Fenaux 2009). RG108 — нековалентный блокатор DNMT: в низких микромолярных концентрациях он вызывал деметилирование без заметной токсичности в клетках человека (Brueckner 2005). GSK-3484862 вызывает деградацию DNMT1, зависящую от Uhrf1, и в ЭСК мыши снижал метилирование примерно с 70 % до менее 18 % за 6 сут; эффект обратим после отмены (Azevedo Portilho 2021; Chen 2023). В модели нековалентный ингибитор снижает активность копирования до 35 % нормы с первого деления и не накапливается. Аскорбат повышает активность TET: в ЭСК мыши быстро растёт 5hmC, доли 5fC и 5caC возрастают более чем в 10 раз, а общее содержание 5mC снижается примерно на две пятых (Yin 2013); в клетках без Tet1 и Tet2 эффекта нет (Blaschke 2013). В модели активность TET повышена в 5 раз. Оговорка: аскорбат — не «деметилирующий препарат» вообще: эффект зависит от TET и проявляется по мере делений; токсичность препаратов модель не показывает.", "gn_m_geno": "Нокауты и мутанты", "g_m_geno": "Настройки копирования метки, метилирования de novo, TET и TDG моделируют потерю белка (0 %) или частичное снижение его активности; результат зависит от клеток, и модель не заменяет опыт. Нокаут DNMT1 (копирование 0 %): метка убывает по делениям, накапливаются полуметилированные диады; в ЭСК мыши Dnmt1⁻/⁻ содержание m5C около трети нормы (Li 1992), а в HCT116 клеточный цикл останавливается в фазе G2, а клетки погибают в митозе (Chen 2007). Потеря UHRF1 (копирование около 20 % нормы — допущение по Bashtrykov 2014: UHRF1 повышает активность DNMT1 in vitro примерно в 5 раз): в Np95-дефицитных ЭСК и эмбрионах мыши теряется метилирование (Bostick 2007; Sharif 2007). Нокаут DNMT3A/B (de novo 0 %): метилирование повторов теряется постепенно (Liang 2002; Chen 2003). Нокаут TET (0 %): 5hmC исчезает, дифференцировка ЭСК нарушается (Dawlaty 2014). Подавление TDG (0 %): 5fC и 5caC накапливаются (Shen 2013). Допущение модели: воздействие начинается с первого деления, а исходное состояние стационарно; в линиях с давним нокаутом метилирование уже пришло к новому состоянию. Гибель клеток при потере DNMT1 или TDG модель не рассчитывает.", "fn_cyt": "цитозин (C)", "fn_mc": "5-метилцитозин (5mC)", "fn_hmc": "5-гидроксиметилцитозин (5hmC)", "fn_fc": "5-формилцитозин (5fC)", "fn_cac": "5-карбоксилцитозин (5caC), нейтральная форма", "fn_sam": "S-аденозилметионин (SAM), форма при pH 7", "fn_sah": "S-аденозилгомоцистеин (SAH), форма при pH 7", "fn_dac": "децитабин (5-аза-2′-дезоксицитидин)", "fn_aza": "5-азацитидин (рибонуклеозид)", "fn_asc": "L-аскорбиновая кислота (аскорбат)", "fn_rg108": "RG108 (N-фталоил-L-триптофан)", "s2_lb_e1": "энхансер E1", "s2_lb_e2": "энхансер E2", "s2_lb_a": "ген A", "s2_lb_b": "ген B", "s2_and": "и", "s2_ctcf_aria": "Сайт CTCF", "s2_me_aria": "Метилирование сайта CTCF", "s2_coh": "Когезин (RAD21)", "s2_coa": "коактиваторы", "s2_scale": "Расстояния на схеме сжаты; числа у дуг — настоящие расстояния в kb.", "s2_dm_1": "домен 1", "s2_dm_2": "домен 2", "s2_dm_none": "один домен, границы нет", "s2_dm_single": "один домен, один сайт CTCF", "s2_dm_rad": "границы нет: RAD21 удалён", "s2_dm_meth": "границы нет: сайты CTCF метилированы", "s2_rna_l": "РНК: {v}", "s2_sub_low": "совместимость ниже", "s2_sub_acc": "доступность {v}", "s2_sub_del": "удалён", "s2_chip_krab": "dCas9-KRAB на E1", "s2_chip_ldb": "ZF–Ldb1 у A", "s2_chip_bet1": "BET-ингибитор, низкая доза", "s2_chip_bet2": "BET-ингибитор, высокая доза", "s2_r_cA": "Контакт с A (Hi-C), индекс", "s2_r_cB": "Контакт с B (Hi-C), индекс", "s2_r_rA": "РНК гена A, × исходной", "s2_r_rB": "РНК гена B, × исходной", "s2_d": "Расстояние от энхансера E1 до промотора A", "s2_how": "Как измеряют", "s2_lim": "Что упрощено", "s2_h_d": "Энхансер E1 расположен в {d} от промотора A.", "s2a_h_n2": "Второй энхансер E2 расположен по другую сторону от A на таком же расстоянии.", "s2_h_b_none": "Между E1 и промотором B границы нет.", "s2_h_b_single": "Между E1 и промотором B расположен один сайт CTCF.", "s2_h_b_conv": "Между E1 и промотором B расположены два сайта CTCF в конвергентной ориентации.", "s2_h_b_div": "Между E1 и промотором B расположены два сайта CTCF в дивергентной ориентации.", "s2_gl": "Ген {g}: контакт с энхансером — {c} ({cl}); новосинтезированная РНК — {r} ({rl}).", "s2_gl2": "Ген {g}: контакт с энхансерами — {c} ({cl}); новосинтезированная РНК — {r} ({rl}).", "s2_cl_up": "выше исходного", "s2_rl_up": "выше исходной", "s2_cl_ref": "близок к исходному", "s2_rl_ref": "близка к исходной", "s2_cl_dn": "ниже исходного", "s2_rl_dn": "ниже исходной", "s2_cl_lo": "намного ниже исходного", "s2_rl_lo": "намного ниже исходной", "s2_cl_bg": "близок к нулю", "s2_rl_bg": "близка к фоновой", "s2_z_ref": "Это исходное состояние вкладки: контакт и РНК обоих генов приняты за 1,0, остальные состояния сравниваются с ним.", "s2_z_nob": "Границы нет, поэтому контакт промотора с энхансером определяется расстоянием: чем дальше промотор, тем реже контакт.", "s2_z_conv": "В этой модели два конвергентных сайта CTCF образуют границу домена. Вероятность контакта через границу снижена втрое (значение взято из одной системы, см. «Что упрощено»), но не до нуля; выход гена B падает сильнее контакта, потому что отклик промотора на контакт нелинеен.", "s2_z_single": "Один сайт CTCF почти не меняет контакт с B, но снижает вклад энхансера в выход гена B: инсуляция не сводится к разобщению элементов.", "s2_z_div": "В модели два дивергентных сайта CTCF образуют более слабый барьер, чем конвергентные: контакт с B и РНК гена B снижены меньше, чем при конвергентных сайтах. Для реальных границ это не общее правило.", "s2_z_near": "Чем ближе промотор A к энхансеру, тем выше вероятность контакта; РНК растёт слабее контакта, потому что отклик промотора насыщается.", "s2_z_near2": "Чем ближе промотор A к энхансеру, тем выше вероятность контакта и РНК гена A.", "s2_z_far": "С расстоянием вероятность контакта убывает, а РНК гена A — сильнее: отклик промотора на контакт нелинеен.", "s2_z_far2": "С расстоянием вероятность контакта и РНК гена A убывают.", "s2_z_n2": "Два энхансера действуют вместе: контакт и РНК гена A выше, чем с одним энхансером на том же расстоянии.", "s2b_bnd": "Граница между E1 и геном B (сайты CTCF)", "s2b_bnd_0": "Нет", "s2b_bnd_1": "Есть", "s2b_ref": "Серая риска на шкале — исходное состояние вкладки: энхансер в 100 kb от промотора A, границы нет, один энхансер. Контакт — условный индекс частоты контакта в Hi-C, РНК — индекс содержания новосинтезированной РНК; в исходном состоянии оба равны 1,0. Шкала логарифмическая.", "s2b_take": "Выход гена зависит от нескольких условий сразу. Вероятность контакта энхансера с промотором убывает с расстоянием, граница из сайтов CTCF снижает вероятность контакта через неё, но не обнуляет её, а ответ промотора на контакт нелинеен, поэтому небольшое изменение контакта сильно меняет новосинтезированную РНК. Числа модели — иллюстрация по одной системе (энхансер Sox2 в клетках mESC; Zuin 2022), а не закон; контакт в Hi-C показывает возможность активации, но не выход гена.", "p2b_1_q": "Энхансер E1 расположен в 100 kb от промотора A, границы нет. Расстояние до промотора A увеличивают до 300 kb в том же домене; остальные условия прежние. Как изменится новосинтезированная РНК гена A?", "p2b_1_o1": "Не изменится: энхансер усиливает транскрипцию на любом расстоянии одинаково.", "p2b_1_o2": "Снизится, но не до фонового уровня: контакт с промотором убывает с расстоянием.", "p2b_1_o3": "Упадёт до фонового уровня: за пределами 100 kb энхансер с промотором не контактирует.", "p2b_1_k": "Вероятность контакта энхансера с промотором убывает с расстоянием, а частота включения промотора зависит от контакта нелинейно, поэтому синтез РНК снижается сильнее, чем вероятность контакта, но остаётся выше фонового уровня.", "p2b_1_e": "В модели контакт с A снижается с 1,0 до 0,50, а РНК гена A — с ×1,0 до ×0,29: снижение РНК сильнее, потому что частота включения промотора описывается S-образной функцией Хилла (показатель 2,8, доверительный интервал 2,4–3,2 в опытах Zuin 2022 на клетках mESC, пара Sox2 и энхансер SCR). РНК гена B не меняется (×1,0): расстояние до B прежнее. В тех же опытах при перемещении энхансера по одному домену длиной 560 kb уровень eGFP-мРНК менялся примерно в 10 раз, а при вставке вне домена был близок к уровню промотора без энхансера (две линии из 264; Zuin 2022). Это числа одной системы и учебной модели; значение ×0,29 не измерено.", "p2b_1_w1": "В плазмидных тестах энхансер SV40 усиливал транскрипцию гена β-глобина на расстоянии в несколько тысяч пар оснований и в обеих ориентациях (Banerji 1981; Moreau 1981), но такие тесты проводят без нативного хроматина. В хромосоме вклад энхансера убывает с расстоянием: в одном домене mESC выход менялся примерно в 10 раз (Zuin 2022). Пропущено звено: вероятность контакта зависит от расстояния.", "p2b_1_w3": "Фоновый уровень соответствует промотору без энхансера. В опытах Zuin 2022 он наблюдался, когда энхансер оказывался вне домена, а в пределах домена длиной 560 kb контакт убывал плавно и у границы составлял около одной двадцатой значения вблизи промотора. В модели при 300 kb контакт равен 0,50, а не 0. Пропущено звено: расстояние снижает вероятность контакта, но не отменяет его.", "p2b_2_q": "Энхансер E1 расположен в 100 kb от промотора A и в 70 kb от промотора B (с другой стороны), границ нет. Между E1 и промотором B добавляют границу из двух сайтов CTCF в конвергентной ориентации. Как изменится новосинтезированная РНК гена B?", "p2b_2_o1": "Не изменится: сайты CTCF не влияют на действие энхансера на ген.", "p2b_2_o2": "Упадёт до фонового уровня: граница не пропускает энхансер к гену B.", "p2b_2_o3": "Снизится, но выше фона: граница уменьшает вероятность контакта.", "p2b_2_k": "В этой учебной модели добавленная граница снижает частоту контактов E1 с промотором B, но не устраняет их полностью, поэтому синтез РНК гена B уменьшается. Контакты E1 с промотором A по условиям модели не меняются. Такое поведение задано для этой схемы локуса; его нельзя предсказывать для любой пары сайтов CTCF только по их взаимной ориентации.", "p2b_2_e": "В модели контакт E1 с B снижается с 1,0 до 0,34 (примерно втрое, как в опытах Zuin 2022 на клетках mESC), а РНК гена B — до ×0,17: сильнее контакта, потому что ответ промотора нелинеен. Это не стена: РНК гена B остаётся выше уровня промотора без энхансера, а РНК гена A не меняется (×1,0). В хромосомах мыши удаление границы нередко не меняло экспрессию (Despang 2019; Williamson 2019), а перенос энхансера через границу вызывал неверную активацию генов (Lupiáñez 2015): граница ослабляет влияние энхансера, но не заменяет остальные условия — доступный восприимчивый промотор и сам энхансер. Число 0,34 взято из одной системы и принято в модели для двух конвергентных сайтов; у дивергентных сайтов барьер в модели слабее (продвинутая вкладка).", "p2b_2_w1": "Граница расположена между E1 и геном B, поэтому в модели контакт с B снижается (0,34 против 1,0), а РНК гена B падает до ×0,17. Пропущено звено: сайты CTCF вместе с когезином ограничивают петли домена, и энхансер реже контактирует с промотором за границей.", "p2b_2_w2": "Граница — вероятностный барьер, а не стена: в модели контакт через неё составляет 0,34 от исходного, а не 0, и РНК гена B (×0,17) остаётся выше фонового уровня. В опытах на мышах удаление границы нередко не меняло экспрессию (Despang 2019; Williamson 2019), а при перестройках энхансер получал доступ к чужим генам (Lupiáñez 2015). Пропущено звено: барьер снижает вероятность контакта, а не исключает его.", "p2b_3_q": "Между E1 и промотором B расположены два сайта CTCF в конвергентной ориентации. Границу убирают. Как соотносятся изменения контакта E1 с B и новосинтезированной РНК гена B?", "p2b_3_o1": "РНК вырастет сильнее контакта: отклик промотора на контакт нелинеен.", "p2b_3_o2": "РНК вырастет так же, как контакт: выход пропорционален контакту.", "p2b_3_o3": "РНК вырастет слабее контакта: отклик промотора на контакт насыщается.", "p2b_3_k": "Частота включения промотора зависит от контакта по S-образной кривой: на её крутой части небольшое изменение контакта сильно меняет выход, поэтому контакт и РНК растут непропорционально.", "p2b_3_e": "В модели контакт с B вырастает с 0,34 до 1,0, то есть примерно втрое, а РНК гена B — с ×0,17 до ×1,0, то есть почти в шесть раз. Причина — нелинейный ответ промотора: в опытах Zuin 2022 (клетки mESC, пара Sox2 и SCR) зависимость частоты включения от контакта описывалась функцией Хилла с показателем 2,8 (доверительный интервал 2,4–3,2). При таком показателе падение контакта втрое снижает выход сильнее, чем втрое; в модели — почти в шесть раз. РНК гена A не меняется (×1,0), так как граница лежит по другую сторону от E1. Числа — иллюстрация по одной системе; полунасыщение в модели подобрано.", "p2b_3_w2": "Пропорциональность выхода контакту не подтверждается: в клетках mESC частота включения промотора Sox2 описывалась S-образной функцией с показателем Хилла 2,8 (Zuin 2022). В модели контакт вырос примерно втрое (с 0,34 до 1,0), а РНК — почти в шесть раз (с ×0,17 до ×1,0). Пропущено звено: нелинейный ответ промотора.", "p2b_3_w3": "Насыщение отклика наблюдается при высоком контакте: в модели при расстоянии 10 kb контакт с A выше исходного примерно вчетверо, а РНК гена A — менее чем вдвое. Здесь исходный контакт мал (0,34), промотор находится на крутой части кривой, и поэтому РНК растёт быстрее контакта. Пропущено звено: положение на кривой отклика зависит от исходного контакта.", "s2a_bnd": "Граница между E1 и геном B: сайты CTCF (один или два)", "s2a_bnd_0": "Нет", "s2a_bnd_1": "Один сайт", "s2a_bnd_2": "Конвергентные", "s2a_bnd_3": "Дивергентные", "s2a_n": "Число энхансеров", "s2a_n_1": "Один (E1)", "s2a_n_2": "Два (E1, E2)", "s2a_cmp": "Совместимость промотора", "s2a_cmp_0": "Обычная", "s2a_cmp_1": "B ниже", "s2a_cmp_2": "A ниже", "s2a_int": "Воздействия", "s2a_meth": "Метилирование сайтов CTCF", "s2a_rad": "Деградация RAD21", "s2a_force": "ZF–Ldb1 у промотора A", "s2a_bet": "BET-ингибитор, доза", "s2a_bet_0": "Нет", "s2a_bet_1": "Низкая", "s2a_bet_2": "Высокая", "s2a_ivn": "Воздействие на E1", "s2a_ivn_0": "Нет", "s2a_ivn_1": "CRISPRi", "s2a_ivn_2": "Делеция", "s2a_h_int": "О воздействиях", "s2a_r_acE": "Доступность E1 (ATAC), % исходной", "s2a_r_acP": "Доступность промоторов (ATAC), % исходной", "s2a_ref": "Серая риска на шкале — исходное состояние вкладки: энхансер в 100 kb от промотора A, границы нет, один энхансер, воздействий нет. Контакт и РНК — индексы относительно него (в исходном состоянии 1,0), шкала логарифмическая; доступность — доля исходной. Прочерк вместо контакта означает, что в модели он не определяется (CRISPRi) или энхансера нет (делеция).", "s2a_take": "Воздействия на локус могут менять связывание CTCF на границе (метилирование сайтов CTCF), контакты (когезин, принудительное сближение), доступность элементов (CRISPRi), отклик промотора (совместимость) и вклад коактиваторов (BET-ингибитор). Частота контактов (Hi-C) и количество новосинтезированной РНК характеризуют разные стороны регуляции: контакт показывает, изменилась ли возможность активации, а РНК — изменился ли выход. Изменение РНК при прежнем контакте показывает, что одной частоты контактов недостаточно для объяснения результата, но само по себе не определяет молекулярный механизм: для этого нужны дополнительные измерения (например, доступность и связывание факторов) и независимые воздействия. CRISPRi и делеция при надлежащих контролях проверяют необходимость элемента, но не способ его действия. Числа модели иллюстрируют эти различия: основа взята из одной системы (энхансер Sox2 в клетках mESC; Zuin 2022), остальные эффекты подобраны автором, их статус указан в карточке «Что упрощено».", "s2a_ln_t": "Дорожки: сравнение условий", "s2a_ln_empty": "Дорожек пока нет. Задайте условия и нажмите «Добавить дорожку».", "s2a_ln_hint": "Каждая дорожка запоминает показания при условиях, заданных в момент добавления (до шести дорожек); условия подписаны под таблицей по номерам дорожек.", "s2a_blot_add": "Добавить дорожку", "s2a_blot_clear": "Очистить дорожки", "s2a_cd_n1": "один энхансер", "s2a_cd_n2": "два энхансера", "s2a_cd_b_none": "границы нет", "s2a_cd_b_single": "один сайт CTCF", "s2a_cd_b_conv": "два конвергентных сайта CTCF", "s2a_cd_b_div": "два дивергентных сайта CTCF", "s2a_act_meth": "метилирование сайтов CTCF", "s2a_act_rad": "деградация RAD21", "s2a_act_lowB": "сниженная совместимость промотора B", "s2a_act_lowA": "сниженная совместимость промотора A", "s2a_act_bet1": "BET-ингибитор в низкой дозе", "s2a_act_bet2": "BET-ингибитор в высокой дозе", "s2a_act_force": "принудительное сближение ZF–Ldb1", "s2a_act_cri": "CRISPRi на E1", "s2a_act_del": "делеция E1", "s2a_n_meth0": "Метилирование сайтов CTCF отмечено, но сайтов нет: показания не меняются.", "s2a_c_meth": "Сайты CTCF метилированы. Контакт E1 с B — {cB} (без воздействия — {c0B}); новосинтезированная РНК гена B — {rB} (без воздействия — {r0B}), гена A — {rA} (без воздействия — {r0A}).", "s2a_c_meth_z": "Метилирование CpG внутри сайта снижает связывание CTCF, и граница перестаёт ограничивать влияние энхансера на ген B (Bell 2000; Hark 2000). В модели показания обоих генов становятся такими же, как без границы. Перенос с импринтируемого района H19/Igf2 на другие границы — допущение.", "s2a_c_rad": "Острая деградация RAD21 (несколько часов). Контакт E1 с A — {cA} (без воздействия — {c0A}), с B — {cB} (без воздействия — {c0B}); новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_rad_z": "Когезин вытягивает петли, и острая потеря RAD21 устраняет петлевые домены (Rao 2017). Контакты близких энхансеров при этом в основном сохраняются, а контакты далёких ослабляются сильнее (Hsieh 2022; Kane 2022; Rinzema 2022). В модели граница снимается, а ослабление контакта растёт с расстоянием; его форма и характерное расстояние — допущения.", "s2a_c_low": "Совместимость промотора {g} с энхансером снижена. Контакт E1 с {g} — {cg} (без воздействия — {c0g}); новосинтезированная РНК гена {g} — {rg} (без воздействия — {r0g}); РНК гена {h} — {rh}, без изменений.", "s2a_c_low_z": "Совместимость — множитель, который меняет отклик одного промотора на тот же контакт (Bergman 2022; Martinez-Ara 2022): контакт остаётся прежним, а РНК этого гена меняется. Значение множителя в модели — допущение автора.", "s2a_c_bet1": "BET-ингибитор в низкой дозе. Контакты не меняются: с A — {cA}, с B — {cB}. Новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_bet1_z": "BET-ингибиторы препятствуют связыванию белков BET (в том числе BRD4) с ацетилированным лизином и снижают вклад коактиваторов, а контакты энхансер–промотор в основном сохраняются (Crump 2021). В модели контакт не меняется, а вклад коактиваторов снижен (на схеме меньше кружков).", "s2a_c_bet2": "BET-ингибитор в высокой дозе. Контакты не меняются: с A — {cA}, с B — {cB}. Новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_bet2_z": "При высокой дозе вклад коактиваторов снижен сильнее и подавляется также транскрипция, не зависящая от энхансера: препараты этого класса неадресны (Muhar 2018; Winter 2017). В модели контакты не меняются; доли подавления подобраны автором.", "s2a_c_force": "ZF–Ldb1 принудительно сближает промотор A с энхансером. Контакт E1 с A — {cA} (без воздействия — {c0A}), с B — {cB} (без воздействия — {c0B}); новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_force_z": "Принудительное сближение повышает долю клеток со всплесками транскрипции, а не размер всплеска (Bartman 2016); без энхансера эффекта нет (Deng 2012). Уровень, до которого поднимается контакт, подобран автором. Конкуренция за общий энхансер в модели слабая, поэтому контакт с B меняется мало.", "s2a_c_force0": "ZF–Ldb1 не меняет показания: контакт E1 с A — {cA}, РНК гена A — {rA}.", "s2a_c_force0_z": "Близкий промотор A контактирует с энхансером достаточно часто и без Ldb1: принудительное сближение повышает контакт только там, где он ниже заданного уровня.", "s2a_c_cri": "dCas9-KRAB направлен на энхансер E1. Доступность E1 — {accE} исходной, доступность промоторов — {accP}; контакт при CRISPRi в модели не определяется. Новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_cri_z": "dCas9-KRAB способствует образованию H3K9me3 на энхансере и снижает доступность не только E1, но и промоторов (Thakore 2015; Fulco 2016); подавление неполное (Fulco 2019). Метод показывает необходимость элемента, но не контакт и не механизм.", "s2a_c_del": "Энхансер E1 удалён, других энхансеров нет: контакта нет. Новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}); это уровень промоторов без энхансера.", "s2a_c_del_z": "Делеция удаляет последовательность энхансера, и остаётся вклад самих промоторов без энхансера. Она показывает необходимость элемента, но не механизм; в хромосоме делеция может убрать и другие элементы, например сайты CTCF.", "s2a_c_del2": "Энхансер E1 удалён, остаётся E2. Контакт с A — {cA} (без воздействия — {c0A}), с B — {cB} (без воздействия — {c0B}); новосинтезированная РНК гена A — {rA} (без воздействия — {r0A}), гена B — {rB} (без воздействия — {r0B}).", "s2a_c_del2_z": "Вклады энхансеров в модели складываются: после удаления E1 остаётся вклад E2, поэтому РНК гена A выше уровня промотора без энхансера. В хромосоме при избыточных энхансерах эффект единичной делеции может быть небольшим (Osterwalder 2018).", "s2a_c_multi": "Одновременно действуют: {list}. Новосинтезированная РНК гена A — {rA} (без воздействий — {r0A}), гена B — {rB} (без воздействий — {r0B}).", "s2a_c_multi_z": "Воздействия затрагивают разные звенья — границу, контакт, доступность, отклик промотора и вклад коактиваторов, — поэтому их эффекты не складываются по простому правилу. Добавляйте дорожки в таблицу и сравнивайте контакт и РНК при каждом воздействии отдельно.", "s2a_my_t": "Загадка: три образца", "s2a_my_p": "Контроль: энхансер E1 в {d} от промотора A, границы нет, воздействий нет. Образцы X, Y и Z получены из таких же клеток после трёх разных воздействий. Соответствие между воздействиями и образцами неизвестно.", "s2a_my_ctl": "Контроль", "s2a_my_h1": "Сравните каждый образец с контролем: изменился ли контакт и сколько генов затронуто.", "s2a_my_h2": "Различие: деградация RAD21 меняет контакты, BET-ингибитор снижает РНК обоих генов при прежних контактах, сниженная совместимость затрагивает один ген при прежних контактах.", "s2a_my_reads": "Показания контроля и образцов приведены в таблице на схеме: контакт (Hi-C) и новосинтезированная РНК.", "s2a_my_rad": "острая деградация RAD21", "s2a_my_bet": "BET-ингибитор в низкой дозе", "s2a_my_lowB": "сниженная совместимость промотора B", "s2a_my_line": "Образец {n}: контакт с A — {ca}, с B — {cb}; РНК гена A — {ra}, гена B — {rb}.", "s2a_my_ctl_line": "Контроль: контакт с A — {ca}, с B — {cb}; РНК гена A — {ra}, гена B — {rb}.", "s2a_c_myst": "Контроль: энхансер E1 в {d} от промотора A, границы нет. Образцы X, Y и Z получены после трёх разных воздействий; показания — в таблице на схеме.", "s2a_c_myst_z": "Контакт (Hi-C) и новосинтезированная РНК измеряют разные звенья пути от энхансера к гену: воздействие на контакт меняет оба показания, а воздействие на отклик промотора или на коактиваторы может менять РНК при прежнем контакте.", "s2a_c_myst2": "Образец X — {x}, образец Y — {y}, образец Z — {z}.", "s2a_c_myst2_z": "Воздействия различимы по двум признакам: меняются ли контакты и сколько генов затронуто. Деградация RAD21 меняет контакты (Rao 2017; Kane 2022); BET-ингибитор снижает РНК при прежнем контакте (Crump 2021); сниженная совместимость промотора затрагивает один ген (Bergman 2022).", "s2a_when_my": "Все данные для ответа приведены в таблице на схеме; образцы — установившиеся состояния модели при заданных условиях, а не результаты опыта.", "p2a_1_q": "Энхансер E1 расположен в 100 kb от промотора A и в 70 kb от промотора B, границы нет. В клетки вводят dCas9-KRAB (CRISPRi) с направляющей РНК к энхансеру E1. Как изменится новосинтезированная РНК гена A?", "p2a_1_o1": "Снизится, но останется выше фонового уровня: подавление неполное.", "p2a_1_o2": "Упадёт до фонового уровня: dCas9-KRAB полностью подавляет энхансер.", "p2a_1_o3": "Не изменится: dCas9-KRAB не разрезает ДНК и не удаляет энхансер.", "p2a_1_k": "dCas9-KRAB, направленный на энхансер, способствует образованию H3K9me3 и снижает доступность энхансера и близких промоторов. Подавление неполное, поэтому синтез РНК обоих генов снижается, но остаётся выше фонового уровня.", "p2a_1_e": "В модели доступность E1 снижается до 15 %, а доступность промоторов — до 75 %. РНК гена A падает с ×1,0 до ×0,16, РНК гена B — тоже до ×0,16: у обоих генов основной вклад даёт E1. Фоновый уровень (промотор без энхансера) ниже, так как подавление неполное. Контакт при CRISPRi в модели не определяется: метод показывает, что элемент необходим, но не как он действует. В клетках K562 эффекты CRISPRi на значимые пары лежали от слабых до почти полного подавления (Fulco 2019), а KRAB снижал доступность и промоторов-мишеней (Thakore 2015; Fulco 2016). Значения 15 % и 75 % подобраны автором модели.", "p2a_1_w2": "Подавление dCas9-KRAB неполное: эффекты CRISPRi на значимые пары в клетках K562 охватывали широкий диапазон, у части элементов оставался заметный выход (Fulco 2019). В модели доступность E1 снижена до 15 %, а не до нуля, и РНК гена A составляет ×0,16, то есть выше уровня промотора без энхансера. Пропущено звено: KRAB снижает доступность элемента, но не удаляет его.", "p2a_1_w3": "dCas9-KRAB действительно не разрезает ДНК, но через входящий в его состав домен KRAB способствует образованию H3K9me3 на энхансере и рядом с ним (Thakore 2015). В модели это снижает доступность E1 до 15 %, а промоторов — до 75 %, и РНК гена A падает с ×1,0 до ×0,16. Пропущено звено: подавление хроматина не требует изменения последовательности.", "p2a_2_q": "Энхансер E1 расположен в 100 kb от промотора A и в 70 kb от промотора B, границы нет. Клетки обрабатывают BET-ингибитором в низкой дозе. Как изменятся контакт E1 с A (Hi-C) и новосинтезированная РНК гена A?", "p2a_2_o1": "Контакт снизится вместе с РНК: белки BET удерживают петлю между энхансером и промотором.", "p2a_2_o2": "Контакт сохранится, а РНК снизится: ингибитор уменьшает вклад коактиваторов.", "p2a_2_o3": "Не изменятся ни контакт, ни РНК: низкая доза действует только на супер-энхансеры.", "p2a_2_k": "BET-ингибиторы вытесняют белки BET (в том числе BRD4) с ацетилированных гистонов и снижают вклад коактиваторов; контакты энхансер–промотор при этом в основном сохраняются.", "p2a_2_e": "В модели контакт E1 с A остаётся 1,0, а РНК гена A снижается с ×1,0 до ×0,60: на схеме вместо трёх кружков коактиваторов остаётся два. РНК гена B снижается так же (×0,60), потому что вклад коактиваторов нужен обоим генам. В клетках SEM BET-ингибиторы (JQ1, IBET-151, 1 µM) подавляли транскрипцию, почти не меняя контактов энхансер–промотор (Crump 2021). Сохранение контакта не означает сохранения синтеза РНК: эти показатели могут изменяться независимо. Уровни вклада коактиваторов подобраны автором модели.", "p2a_2_w1": "Контакты при BET-ингибировании почти не менялись (Crump 2021); в модели контакт с A остаётся 1,0, а РНК гена A падает до ×0,60. Пропущено звено: белки BET передают сигнал энхансера на транскрипцию, а не удерживают сближение энхансера с промотором.", "p2a_2_w3": "В модели нет отдельного класса супер-энхансеров: оба гена зависят от одного обычного энхансера E1, вклад коактиваторов снижен у обоих, и РНК гена A падает до ×0,60, а РНК гена B — тоже до ×0,60. В опытах избирательность по генам супер-энхансеров зависит от дозы, а при высокой дозе или деградации BET подавляется транскрипция в целом (Lovén 2013; Muhar 2018; Winter 2017). Пропущено звено: снижение вклада коактиваторов меняет РНК гена, который зависит от этого энхансера, а не только гена с кластером энхансеров.", "p2a_3_q": "Энхансер E1 расположен в 300 kb от промотора A и в 70 kb от промотора B, границы нет. Клетки обрабатывают так, что RAD21 быстро деградирует (несколько часов). Как изменится новосинтезированная РНК генов A и B?", "p2a_3_o1": "РНК обоих генов снизится одинаково: когезин нужен любому контакту поровну.", "p2a_3_o2": "РНК гена A не изменится: для контакта энхансера с промотором когезин не нужен.", "p2a_3_o3": "РНК гена A снизится сильнее, чем гена B: для далёких контактов когезин нужнее.", "p2a_3_k": "Когезин вытягивает петли, и после его потери контакты далёких энхансеров ослабляются сильнее, чем близких; поэтому синтез РНК гена A снижается сильнее, чем синтез РНК гена B.", "p2a_3_e": "В модели при 300 kb контакт E1 с A снижается с 0,50 до 0,21, а РНК гена A — с ×0,29 до ×0,07, то есть до значения, близкого к уровню промотора без энхансера. Контакт с B (70 kb) почти не меняется (0,95), РНК гена B — с ×1,0 до ×0,95. Острая потеря RAD21 устраняет петлевые домены (Rao 2017), но контакты энхансер–промотор в основном сохраняются, и транскрипция меняется у меньшинства генов (Hsieh 2022); когезин нужен главным образом далёким энхансерам (Kane 2022; Rinzema 2022). Форма зависимости от расстояния и характерное расстояние 250 kb — допущения автора.", "p2a_3_w1": "Если бы когезин одинаково нужен был любому контакту, РНК обоих генов снижалась бы поровну. В модели ослабление растёт с расстоянием: РНК гена B (70 kb) почти не меняется (×0,95), а РНК гена A (300 kb) падает до ×0,07. В опытах когезин нужен главным образом далёким энхансерам (Kane 2022; Rinzema 2022). Пропущено звено: зависимость от расстояния.", "p2a_3_w2": "Острая потеря RAD21 устраняет петлевые домены (Rao 2017); в модели контакт E1 с A снижается с 0,50 до 0,21, а РНК гена A — до ×0,07. Контакты близких энхансеров в основном сохраняются (Hsieh 2022), контакты далёких — нет. Пропущено звено: E1 расположен далеко от A, и зависимость от когезина для него выше.", "p2a_4_q": "Энхансер E1 расположен в 100 kb от промотора A. Между E1 и промотором B расположены два сайта CTCF в конвергентной ориентации. Остатки CpG внутри этих сайтов метилируют. Как изменится новосинтезированная РНК гена B?", "p2a_4_o1": "Снизится: метилирование ДНК подавляет транскрипцию соседних генов.", "p2a_4_o2": "Вырастет: метилирование снижает связывание CTCF и снимает границу.", "p2a_4_o3": "Не изменится: связывание CTCF с ДНК не зависит от метилирования.", "p2a_4_k": "Метилирование CpG внутри сайта снижает связывание CTCF; граница перестаёт ограничивать контакт, и ген B получает больший вклад энхансера.", "p2a_4_e": "В модели метилирование снимает границу: контакт E1 с B вырастает с 0,34 до 1,0, а РНК гена B — с ×0,17 до ×1,0; РНК гена A не меняется (×1,0). Это иной случай, чем метилирование промотора: метилированы сайты границы, а не промотор гена B. В импринтируемом районе H19/Igf2 неметилированный элемент на материнском аллеле связывает CTCF и блокирует энхансеры (Bell 2000; Hark 2000). Перенос на другие границы — допущение: связывание CTCF чувствительно к метилированию не во всех сайтах.", "p2a_4_w1": "Метилирование промотора обычно сопровождается подавлением его транскрипции, но здесь метилированы сайты CTCF между энхансером и промотором B, а не сам промотор. В модели граница снимается, и РНК гена B растёт с ×0,17 до ×1,0. Пропущено звено: метилирование разных элементов даёт разный результат.", "p2a_4_w3": "Метилирование CpG внутри сайта снижает связывание CTCF, и в районе H19/Igf2 метилированный аллель не блокирует энхансеры (Bell 2000; Hark 2000). В модели контакт с B вырастает с 0,34 до 1,0. Пропущено звено: связывание CTCF с ДНК чувствительно к метилированию, хотя и не во всех сайтах.", "p2a_5_q": "Энхансер E1 расположен в 300 kb от промотора A, границы нет. Энхансер активен и доступен, промотор A доступен и совместим с ним. К промотору A привязывают домен Ldb1, который принудительно сближает его с E1 (ZF–Ldb1). Как изменится новосинтезированная РНК гена A?", "p2a_5_o1": "Вырастет: активный энхансер будет чаще контактировать с промотором A.", "p2a_5_o2": "Не изменится: сближение без изменения энхансера не повышает транскрипцию.", "p2a_5_o3": "Снизится: домен Ldb1 мешает связыванию факторов транскрипции.", "p2a_5_k": "Принудительное сближение повышает частоту контакта промотора с активным энхансером независимо от расстояния; при активном энхансере растёт и выход гена.", "p2a_5_e": "В модели контакт E1 с A повышается с 0,50 до 2,0, а РНК гена A — с ×0,29 до ×1,7; РНК гена B почти не меняется (×0,97). Домен самоассоциации Ldb1, привязанный к промотору β-глобина, образовывал петлю с LCR и активировал ген в GATA1-нулевых клетках; без LCR активации не было (Deng 2012). Принудительное повышение частоты контактов увеличивает долю клеток со всплесками транскрипции, а не размер всплеска (Bartman 2016). Уровень, до которого ZF–Ldb1 поднимает контакт, подобран автором модели.", "p2a_5_w2": "Без активного энхансера сближение ничего не даёт (Deng 2012), но E1 активен: в модели контакт с A поднимается с 0,50 до 2,0, и РНК гена A вырастает с ×0,29 до ×1,7. Пропущено звено: контакт повышает выход, когда есть активный энхансер и совместимый промотор.", "p2a_5_w3": "В опытах Deng 2012 привязанный к промотору домен Ldb1 активировал ген β-глобина, а не подавлял его. В модели РНК гена A вырастает с ×0,29 до ×1,7. Приём искусственный: Ldb1 мог бы привлекать и другие компоненты, эти эффекты в модели не учтены. Пропущено звено: сближение с активным энхансером повышает выход.", "p2a_6_q": "Энхансер E1 расположен в 100 kb от промотора A. Между E1 и промотором B расположены два сайта CTCF в конвергентной ориентации. Ориентацию одного из них меняют на противоположную, и сайты становятся дивергентными. Как изменится в модели новосинтезированная РНК гена B?", "p2a_6_o1": "Снизится ещё сильнее: инверсия одного сайта делает барьер прочнее.", "p2a_6_o2": "Не изменится: барьер определяется числом сайтов CTCF, а не их ориентацией.", "p2a_6_o3": "Вырастет, но не до уровня без границы: барьер дивергентной пары слабее.", "p2a_6_k": "В этой учебной модели после изменения ориентации сайта задано ослабление границы. Поэтому ген B получает больший вклад энхансера, чем при исходной границе, но меньший, чем без неё. Конвергентная ориентация сайтов на концах петель CTCF предпочтительна, но это не значит, что любая граница домена образована такой парой: реальные границы могут содержать группы сайтов разной ориентации, и результат инверсии зависит от строения локуса.", "p2a_6_e": "В модели контакт E1 с B вырастает с 0,34 до 0,61, а РНК гена B — с ×0,17 до ×0,53; РНК гена A не меняется (×1,0). Сайты на основаниях петель чаще всего обращены друг к другу (Rao 2014), а инверсия сайта CTCF меняет петли и действие энхансеров (Guo 2015a). Величина ослабления барьера у дивергентных сайтов в модели — допущение автора: первичных измерений для этой пары нет. Реальные границы часто содержат группы сайтов в разной ориентации: в локусах Pcdh и HOXD мыши удаление направленных наружу сайтов ослабляло дальние контакты энхансер–промотор внутри домена (Ge 2023), поэтому дивергентные сайты нельзя считать заведомо слабой границей.", "p2a_6_w1": "Инверсия сайта меняет петли (Guo 2015a), но в модели конвергентные сайты образуют более прочный барьер: контакт с B при дивергентных сайтах 0,61, при конвергентных 0,34. Поэтому РНК гена B растёт с ×0,17 до ×0,53. Пропущено звено: в этой модели изменение ориентации сайта ослабляет границу.", "p2a_6_w2": "Якоря петель чаще всего образуют конвергентные сайты (Rao 2014), а инверсия одного сайта меняет петли и действие энхансеров (Guo 2015a). В модели ориентация задаёт силу барьера: контакт с B равен 0,61 при дивергентных сайтах и 0,34 при конвергентных. Пропущено звено: в модели ориентация сайтов определяет, насколько прочен барьер.", "p2a_7_q": "У промотора A два энхансера: E1 в 100 kb с одной стороны и E2 в 100 kb с другой стороны. Энхансер E1 удаляют. Как изменится новосинтезированная РНК гена A по сравнению с состоянием с двумя энхансерами?", "p2a_7_o1": "Снизится частично: останется вклад второго энхансера E2.", "p2a_7_o2": "Упадёт до фонового уровня: энхансер E1 в этой паре незаменим.", "p2a_7_o3": "Не изменится: второй энхансер E2 полностью заменяет E1.", "p2a_7_k": "Вклады энхансеров в модели складываются: при удалении E1 пропадает его вклад, но вклад E2 остаётся, поэтому РНК гена A снижается частично.", "p2a_7_e": "В модели контакт промотора A с энхансерами снижается с 2,0 до 1,0, а РНК гена A — с ×1,8 до ×1,0: остаётся вклад E2. Ген B лежит рядом с E1, и для него потеря заметнее: контакт снижается с 1,4 до 0,42, РНК — с ×1,2 до ×0,26. В хромосоме при избыточных энхансерах эффект единичной делеции нередко небольшой (Osterwalder 2018), а при удалении LCR β-глобина мыши остаётся часть нормального уровня (Epner 1998). Значение зависит от вклада удалённого элемента.", "p2a_7_w2": "Фоновый уровень соответствует промотору без энхансера, а у A остаётся энхансер E2. В модели РНК гена A снижается только до ×1,0, то есть до уровня с одним энхансером на том же расстоянии. Пропущено звено: вклады энхансеров складываются, и второй сохраняется.", "p2a_7_w3": "В модели вклады энхансеров складываются, поэтому удаление E1 снимает его вклад: РНК гена A снижается с ×1,8 до ×1,0, а контакт — с 2,0 до 1,0. В хромосоме при избыточных энхансерах эффект единичной делеции может быть небольшим (Osterwalder 2018), но это зависит от вклада элемента. Пропущено звено: учёт вклада E1.", "p2a_8_q": "Контроль: энхансер E1 в 200 kb от промотора A, границы нет. Три образца клеток X, Y и Z подвергли разным воздействиям: острой деградации RAD21, действию BET-ингибитора в низкой дозе и снижению совместимости промотора B. Соответствие между воздействиями и образцами неизвестно. В образце Z контакты с A и B и РНК гена A такие же, как в контроле, а РНК гена B ниже. Какое воздействие применили к образцу Z?", "p2a_8_o1": "Острую деградацию RAD21: она ослабляет контакты энхансера с промоторами.", "p2a_8_o2": "Снижение совместимости промотора B: отклик гена B на контакт ниже.", "p2a_8_o3": "BET-ингибитор в низкой дозе: он снижает вклад коактиваторов у обоих генов.", "p2a_8_k": "Воздействия различают по двум признакам: меняются ли контакты (Hi-C) и сколько генов затронуто. RAD21 меняет контакты; BET-ингибитор снижает РНК обоих генов при прежних контактах; сниженная совместимость затрагивает один ген при прежних контактах.", "p2a_8_e": "Контроль: контакт с A 0,64, с B 1,0; РНК гена A ×0,49, гена B ×1,0. В образце X контакт с A (0,40) и РНК гена A (×0,18) ниже, чем в контроле: меняются контакты, это деградация RAD21 (Rao 2017; Kane 2022). В образце Y контакты прежние (0,64 и 1,0), а РНК обоих генов ниже (×0,29 и ×0,61): это BET-ингибитор, который снижает вклад коактиваторов, а не контакт (Crump 2021). В образце Z контакты и РНК гена A прежние (0,64 и ×0,49), ниже только РНК гена B (×0,46): так выглядит снижение совместимости промотора B (Bergman 2022; Martinez-Ara 2022). Числа рассчитаны по модели; множитель совместимости подобран автором. В задаче выбор ограничен тремя воздействиями; в опыте такие же показания могут иметь и другие причины (например, сниженную доступность промотора), поэтому вывод проверяют дополнительными измерениями и независимым воздействием.", "p2a_8_w1": "Деградация RAD21 меняет контакты: в образце X контакт с A ниже, чем в контроле (0,40 против 0,64), и РНК гена A тоже (×0,18 против ×0,49). В образце Z контакты и РНК гена A остались прежними (0,64 и ×0,49). Пропущено звено: воздействие на контакт меняет оба показания.", "p2a_8_w3": "BET-ингибитор снижает РНК обоих генов при прежних контактах (образец Y: ×0,29 и ×0,61 против ×0,49 и ×1,0 в контроле; Crump 2021). В образце Z РНК гена A осталась прежней (×0,49), а ниже только РНК гена B (×0,46). Пропущено звено: сколько генов затронуто.", "gn_e_enh": "Энхансер", "g_e_enh": "Энхансер — участок ДНК, к которому присоединяются транскрипционные факторы и коактиваторы и который повышает транскрипцию генов на расстоянии. В репортёрных плазмидах энхансер SV40 усиливал транскрипцию гена β-глобина на расстоянии в несколько тысяч пар оснований и в обеих ориентациях (Banerji 1981; Moreau 1981), но в хромосоме выход убывает с расстоянием (Zuin 2022). Один энхансер может влиять на несколько генов, а на ген действуют несколько энхансеров: в клетках K562 энхансер влиял не более чем на пять генов, а ген получал вклад не более чем от четырнадцати дистальных элементов (Fulco 2019). Открытый хроматин энхансера (ATAC) показывает доступность элемента, но не его мишень и не его силу.", "gn_e_pa": "Промотор и ген A", "g_e_pa": "Промотор — участок ДНК вокруг точки начала транскрипции (TSS): с неё РНК-полимераза II начинает синтез РНК. На промоторе собирается преинициаторный комплекс — РНК-полимераза II с общими факторами транскрипции (Haberle 2018). Энхансер действует на этот этап: связанные с ним транскрипционные факторы и коактиваторы повышают вероятность сборки комплекса и начала синтеза РНК, поэтому условие действия — контакт энхансера с промотором (карточка «Контакт»). Ген A — основная мишень энхансера E1 в этой модели. Новосинтезированная РНК гена A зависит от четырёх условий: доступности промотора, контакта с энхансером, совместимости промотора с энхансером и вклада коактиваторов. В человеческой репортёрной системе активность пары энхансер–промотор близка к произведению активностей энхансера и промотора (R² = 0,82), так что совместимость выражена умеренно (Bergman 2022); в мышиных клетках более половины тестированных элементов избирательны (Martinez-Ara 2022). Оба результата получены на репортёрах без нативного хроматина.", "gn_e_pb": "Соседний промотор и ген B", "g_e_pb": "Ген B — соседний ген по другую сторону от энхансера E1, на расстоянии 70 kb. Он получает вклад энхансера, если ничто его не ограничивает, и конкурирует с геном A за контакт: после подавления промотора HDAC6 в клетках K562 экспрессия соседнего гена GATA1 повысилась на 9 % (Fulco 2016); в β-глобиновом кластере два гена на одном аллеле транскрибируются одновременно реже ожидаемого (Bartman 2016). В модели конкуренция слабая и измеренное значение +9 % не воспроизводит.", "gn_e_ctcf": "CTCF и его сайты", "g_e_ctcf": "CTCF — белок, который связывается с сайтами ДНК и вместе с когезином ограничивает петли и домены хроматина. Сайты CTCF в якорях петель чаще всего обращены друг к другу (конвергентная ориентация): так ориентированы более 90 % таких сайтов в клетках человека (Rao 2014). Инверсия сайта CTCF меняет петли и действие энхансеров (Guo 2015a). Метилирование CpG внутри сайта снижает связывание CTCF: в районе H19/Igf2 неметилированный элемент на материнском аллеле связывает CTCF и блокирует энхансеры (Hark 2000; Bell 2000). На схеме флажок — сайт CTCF, направление флажка — ориентация сайта.", "gn_e_tad": "Домен (TAD) и граница домена", "g_e_tad": "Топологически ассоциированный домен (TAD) — участок хромосомы, внутри которого контакты возникают чаще, чем с соседними участками. Границы доменов обогащены CTCF; медианная длина контактных доменов около 185 kb (Rao 2014). Домен — статистическая структура: в TAD Fbn2 клеток mESC замкнутая петля между границами занимает несколько процентов времени, а чаще домен частично экструдирован (Gabriele 2022). Граница — вероятностный барьер, а не стена: удаление всех основных сайтов CTCF в районе Sox9–Kcnj2 не меняло экспрессию (Despang 2019), перестройки границ вокруг Shh чаще всего тоже (Williamson 2019), а в других локусах перестройки, переносящие энхансер через границу, вызывают неверную активацию генов (Lupiáñez 2015).", "gn_e_contact": "Контакт энхансера с промотором", "g_e_contact": "Контакт — частота, с которой два участка ДНК оказываются рядом. Hi-C, Micro-C и Capture-C определяют её по лигированию фиксированных фрагментов в популяции клеток. Контакт — условие возможности активации, но не мера выхода: потеря петель за 3–6 ч меняет транскрипцию у меньшинства генов (Rao 2017; Hsieh 2022), а BET-ингибиторы подавляют транскрипцию, почти не меняя контактов (Crump 2021). Связь контакта с выходом нелинейна (Zuin 2022). На схеме толщина дуги показывает вероятность контакта в модели, число у дуги — настоящее расстояние в kb.", "gn_e_rna": "Новосинтезированная РНК", "g_e_rna": "Новосинтезированную РНК (PRO-seq, SLAM-seq и сходные методы) определяют по синтезу РНК за минуты–часы; общая мРНК отстаёт на время её жизни. На схеме число волнистых линий под геном пропорционально индексу РНК: четыре линии — исходный уровень, он принят за 1,0. Фоновый уровень — РНК гена без вклада энхансера; в модели он составляет около 0,05 исходного. Индекс РНК — условная величина модели, а не число молекул; он не различает частоту и размер всплесков транскрипции.", "gn_e_acc": "Доступность хроматина (ATAC)", "g_e_acc": "ATAC-seq определяет участки открытого хроматина. Доступность — необходимое условие связывания факторов, но не мера активности и не указатель мишени: открытый элемент не обязательно активен. В модели доступность энхансера E1 и промоторов принята за 100 %, пока её не снижает dCas9-KRAB (воздействие, а не выбор промотора).", "gn_e_compat": "Совместимость промотора", "g_e_compat": "Совместимость — множитель, показывающий, насколько данный промотор отвечает на данный энхансер при том же контакте. В человеческой репортёрной системе активность пары почти равна произведению активностей энхансера и промотора (R² = 0,82), избирательность умеренная (Bergman 2022); в мышиных клетках более половины элементов избирательны (Martinez-Ara 2022). Это данные эписомных репортёров без хроматина и без расстояния. Для замены промотора в хромосоме числа множителя в источниках нет: значение 0,4 для «менее совместимого» промотора в модели — допущение.", "gn_e_n2": "Второй энхансер и избыточность", "g_e_n2": "Энхансеры часто избыточны: делеция единичного энхансера нередко мало меняет экспрессию и фенотип (Osterwalder 2018), а при удалении LCR β-глобина мыши остаётся от 5 до 25 % нормального уровня (Epner 1998). На схеме второй энхансер E2 расположен по другую сторону от промотора A на таком же расстоянии, как E1. Вклады энхансеров в модели складываются; дуга от E2 к гену B показана, но вносит малый вклад.", "gn_e_coh": "Когезин и RAD21", "g_e_coh": "Когезин — кольцевой комплекс, который вытягивает петли ДНК: очищенный человеческий когезин делает это in vitro, а CTCF служит для него асимметричным барьером (Davidson 2019). RAD21 — субъединица когезина. Острая деградация RAD21 (6 ч, клетки HCT-116) устраняет петлевые домены (Rao 2017); контакты энхансер–промотор при 3 ч деградации в основном сохраняются, и транскрипция меняется у меньшинства генов (Hsieh 2022). Когезин нужен главным образом далёким энхансерам (Kane 2022; Rinzema 2022). В модели деградация снимает границу и ослабляет контакт тем сильнее, чем дальше энхансер; форма зависимости и характерное расстояние 250 kb — допущения.", "gn_e_coact": "Коактиваторы и BET-ингибиторы", "g_e_coact": "Коактиваторы — Mediator, p300/CBP, BRD4 и факторы элонгации — передают сигнал энхансера на РНК-полимеразу II; число кружков на схеме показывает их вклад (три — исходный). При быстрой деградации Mediator страдают прежде всего клеточно-специфические гены с высоким оборотом полимеразы, остальные гены в основном сохраняют выход (Jaeger 2020). BET-ингибиторы (JQ1, IBET-151) препятствуют связыванию белков BET с ацетилированным лизином: в клетках SEM (1 µM) они подавляли транскрипцию, почти не меняя контактов энхансер–промотор (Crump 2021). Препараты неадресны: при высокой дозе или деградации BET подавляется транскрипция в целом (Muhar 2018; Winter 2017). Ингибитор p300/CBP A-485 снижает H3K27ac на энхансерах и выход зависимых генов (Lasko 2017; Raisner 2018); данных по контактам для него нет, и отдельной настройкой он не представлен, потому что по показаниям не отличался бы от низкой дозы BET-ингибитора.", "gn_e_cri": "CRISPRi и делеция энхансера", "g_e_cri": "dCas9-KRAB, направленный на энхансер, способствует образованию H3K9me3 и снижает доступность не только энхансера, но и промоторов-мишеней (Thakore 2015; Fulco 2016); подавление неполное: в клетках K562 эффекты значимых пар лежали в диапазоне от 3 до 93 % (Fulco 2019). Метод показывает необходимость элемента, но не контакт и не расстояние. Делеция удаляет последовательность; при избыточных энхансерах эффект единичной делеции может быть малым (Osterwalder 2018), а сама делеция может удалить и другие элементы, например сайты CTCF. В модели при CRISPRi доступность E1 снижена до 15 %, промоторов — до 75 %, контакт не определяется.", "gn_e_force": "Принудительное сближение: ZF–Ldb1", "g_e_force": "Домен самоассоциации Ldb1, привязанный к промотору с помощью цинковых пальцев, образует петлю с LCR и активирует ген β-глобина в GATA1-нулевых эритробластах; без LCR активации нет (Deng 2012). Принудительное повышение частоты контактов увеличивает долю клеток со всплесками транскрипции, а не размер всплеска (Bartman 2016). Приём искусственный: он не показывает природный механизм, а Ldb1 мог бы привлекать и другие компоненты. В модели контакт A с энхансером поднимается до фиксированного уровня независимо от расстояния; без энхансера эффекта нет, а у промотора, частота контакта которого уже выше заданного уровня, показания не меняются.", "gn_e_meth": "Метилирование сайтов CTCF", "g_e_meth": "Метилирование CpG внутри сайта CTCF снижает связывание CTCF in vitro; в импринтируемом районе H19/Igf2 неметилированный элемент на материнском аллеле связывает CTCF и блокирует доступ энхансеров к гену Igf2 (Bell 2000; Hark 2000; мышь). Это иной уровень, чем метилирование промотора: здесь метилирован сайт границы, а не промотор гена B. В модели метилирование снимает действие границы, если она задана; без границы эффекта нет. Перенос на другие границы — допущение: действие метилирования зависит от контекста сайта.", "gn_e_modif": "Воздействия на вкладке", "g_e_modif": "Метилирование сайтов CTCF снижает связывание CTCF и снимает границу. Деградация RAD21 разрушает петли и ослабляет контакты далёких энхансеров. Более низкая совместимость меняет отклик одного промотора при прежнем контакте. BET-ингибитор снижает вклад коактиваторов при прежнем контакте. ZF–Ldb1 принудительно сближает промотор A с энхансером. dCas9-KRAB снижает доступность E1 и промоторов, делеция удаляет E1. Отдельными настройками не представлены ингибиторы CDK7 и CDK9, деградация BRD4, 1,6-гексадиол, ингибитор p300/CBP, нарушение Mediator и WAPL: они неадресны или не дают сведений о контактах (см. карточки «Коактиваторы» и «Что упрощено»).", "gn_e_measure": "Как измеряют", "g_e_measure": "Значения на экране рассчитаны по модели. В опыте контакт определяют методами Hi-C, Micro-C или Capture-C: они показывают частоту лигирования фиксированных фрагментов в популяции клеток, а не функцию и не расстояние в отдельной клетке. Выход гена измеряют по новосинтезированной РНК (PRO-seq, SLAM-seq): она отражает синтез за минуты–часы, а общая мРНК отстаёт на время её жизни. Доступность определяют методом ATAC-seq, занятость факторами — ChIP-seq или CUT&RUN. CRISPRi и делеция показывают необходимость элемента, но не механизм. Живая визуализация (метки на локусах, MS2 для транскрипции) ограничена точностью локализации около 50 нм (Alexander 2019), а связь близости локусов с транскрипцией зависит от системы.", "gn_e_model": "Что упрощено", "g_e_model": "Модель считает состояние при заданных условиях; время не рассчитывается. Выход гена — результат нескольких фильтров: доступность и контакт задают частоту включения промотора, совместимость и коактиваторы масштабируют её. Из одной системы (энхансер Sox2 в клетках mESC) взяты: примерно десятикратное падение выхода при перемещении энхансера по домену длиной 560 kb, трёхкратное снижение контакта через границу, показатель Хилла 2,8 (доверительный интервал 2,4–3,2) и снижение выхода за одним сайтом CTCF примерно на 60 % при неизменном контакте (Zuin 2022). Подобраны автором модели: форма убывания контакта с расстоянием, полунасыщение, частоты включения и выключения, барьер дивергентных сайтов, эффекты RAD21, совместимости, BET-ингибитора, CRISPRi и ZF–Ldb1; числовых измерений для них в использованных работах нет. Геометрия (ген B на 70 kb слева, E2 на таком же расстоянии за A) задана автором. Модель не воспроизводит измеренную конкуренцию промоторов, конденсаты, особые свойства супер-энхансеров, динамику контактов и неоэнхансеры. Расстояния на схеме сжаты; контакт и РНК — индексы относительно исходного состояния вкладки.", "lg_e_arc": "дуга — контакт энхансера с промотором (Hi-C); толщина и яркость показывают вероятность контакта в модели, число у дуги — расстояние в kb", "lg_e_flag": "флажок — сайт CTCF; направление флажка — ориентация сайта", "lg_e_dom": "полоса под осью — домен хроматина (TAD); две полосы — действующая граница между доменами", "lg_e_rna": "волнистые линии под геном — новосинтезированная РНК; четыре линии — исходный уровень, бледная линия — неполная", "lg_e_chip": "овал с рамкой — воздействие, включённое в этом состоянии (препарат, белок, изменение энхансера)", "lg_e_coa": "кружки — коактиваторы (BRD4, Mediator, p300/CBP); пунктирный кружок — вклад снижен", "s3_cyto": "Цитоплазма", "s3_nuc": "Ядро", "s3_sig": "Сигнал инсулина / IGF-1", "s3_rec": "Рецептор", "s3_p_u": "без фосфата", "s3_p_p": "с фосфатом AKT", "s3_p_pc": "фосфат + 14-3-3", "s3_imp": "импорт", "s3_exp": "экспорт", "s3_el": "Элемент ДНК", "s3_el_v": "занят на {c}", "s3_rna": "Новая РНК мишени", "s3_rna_g": "G6PC-подобная {x}", "s3_rna_p": "PCK1-подобная {x}", "s3_akt_v": "активность {a}", "s3_pakt_v": "pAKT {a}", "s3_note1": "Доли в рамках — часть всего белка FOXO.", "s3_note2": "Толщина стрелок переноса — поток.", "s3_chr_closed": "хроматин закрыт", "s3_how": "Как измеряют", "s3_lim": "Что упрощено", "s3_pl_inh": "Ингибитор PI3K/AKT", "s3_pl_ly": "LY294002 · ингибитор PI3K", "s3_pl_allo": "Аллостерический ингибитор AKT", "s3_pl_atp": "АТФ-конкурентный ингибитор AKT", "s3_pl_lmb": "Лептомицин B · блок CRM1", "s3_pl_aaa": "FOXO1-AAA · нет сайтов AKT", "s3_pl_dbd": "Foxo1-DBD⁻ · нет связи с ДНК", "s3_pl_foxo6": "FOXO6 · нет 3-го сайта и NES", "s3_pl_stress": "Стресс-киназы (JNK, MST1)", "s3_pl_ampk": "AMPK активна", "lg_f_pool": "рамка с полоской — пул FOXO (ядро или цитоплазма, с фосфатом AKT или без); длина полоски — доля всего белка", "lg_f_flux": "стрелки переноса через ядерную оболочку: чем толще и непрозрачнее, тем больше поток (доля белка в час)", "s3_r_akt": "Активность AKT по субстрату, % от максимума", "s3_r_pakt": "Фосфорилированная AKT (pT308/pS473), % от уровня при высоком сигнале", "s3_r_nuc": "Доля FOXO в ядре", "s3_r_pf": "Доля FOXO, фосфорилированного по сайту AKT", "s3_r_chip": "Занятость мишени FOXO (ChIP-подобная), доля", "s3_r_rna": "Новая РНК мишени, G6PC-подобная, относительно эталона", "s3_r_rna2": "Новая РНК мишени, PCK1-подобная, относительно эталона", "s3b_sig": "Сигнал инсулина / IGF-1", "s3b_sig_low": "Низкий", "s3b_sig_mid": "Средний", "s3b_sig_high": "Высокий", "s3b_iv": "Вмешательство", "s3b_iv_none": "Нет", "s3b_iv_inh": "Ингибитор PI3K/AKT", "s3b_iv_aaa": "FOXO1-AAA", "s3b_iv_lmb": "Лептомицин B", "s3b_ref": "Серая риска на полосе — эталонная клетка: дикий тип, низкий сигнал, вмешательства нет (РНК принята за ×1). Значения — расчёт учебной модели для установившегося состояния.", "s3b_take": "FOXO непрерывно перемещается между ядром и цитоплазмой, и AKT смещает баланс этих потоков: фосфорилированный FOXO хуже входит в ядро и быстрее экспортируется, но часть белка при этом остаётся в ядре. Вход в ядро, связывание с ДНК и синтез РНК — три разных события: лептомицин B блокирует экспорт и накапливает FOXO в ядре, а занятость мишени остаётся низкой, пока белок фосфорилирован.", "s3b_c_ref": "Сигнал низкий, активность AKT мала ({a}). FOXO непрерывно перемещается через ядерную оболочку, и в ядре находится {n} белка, а не весь белок. По сайтам AKT фосфорилировано {p}; занятость мишени {c}, синтез РНК мишени принят за {r}.", "s3b_c_ref_z": "Без инсулина FOXO не удерживается в ядре целиком: его положение задаётся балансом импорта и экспорта. Нахождение в ядре ещё не означает ни связывания с ДНК, ни синтеза РНК.", "s3b_c_sig": "Уровень сигнала — {s}: AKT активна ({a}) и фосфорилирует FOXO (фосфорилировано {p}). Фосфорилированный FOXO хуже входит в ядро и быстрее экспортируется, поэтому в ядре {n}; занятость мишени {c}, синтез РНК мишени {r} (эталон — ×1,0).", "s3b_c_sig_z": "AKT не удаляет весь FOXO из ядра, а смещает баланс потоков: чем выше активность AKT, тем меньше доля в ядре, занятость мишени и синтез её РНК. Часть синтеза РНК не зависит от FOXO.", "s3b_c_inh": "Ингибитор снижает активность AKT по субстрату до {a}. Фосфорилирование FOXO падает до {p}, но не исчезает: оставшаяся активность AKT продолжает фосфорилировать FOXO, а фосфатаза PP2A его дефосфорилирует, причём у белка, связанного в цитоплазме с 14-3-3, медленнее. В ядре {n}, занятость мишени {c}, синтез РНК мишени {r}.", "s3b_c_inh_z": "В установившемся состоянии ингибитор возвращает FOXO в ядро не целиком: остаточное фосфорилирование уравновешивается дефосфорилированием. Результат с одним ингибитором согласуется с участием PI3K/AKT; для причинного вывода нужен второй независимый подход.", "s3b_c_inh_low": "Сигнал низкий, и AKT малоактивна и без ингибитора; ингибитор снижает остаточную активность до {a}. Фосфорилировано {p} FOXO, в ядре {n}, занятость мишени {c}, синтез РНК мишени {r}.", "s3b_c_inh_low_z": "При низком сигнале остаётся небольшая базальная активность AKT. Ингибитор снижает и её, поэтому FOXO сдвигается в ядро ещё сильнее, чем в эталонной клетке.", "s3b_c_aaa": "FOXO1-AAA не имеет сайтов AKT (T24A/S256A/S319A), поэтому AKT ({a}) его не фосфорилирует ({p}). У нефосфорилированного белка в модели импорт быстрее экспорта: в ядре {n} при любом из трёх уровней сигнала. Занятость мишени {c}, синтез РНК мишени {r}.", "s3b_c_aaa_z": "Мутант не отвечает на инсулин по линии AKT, но ядерная локализация не равна максимальной активности: на синтез РНК влияют ещё партнёры и состояние хроматина.", "s3b_c_lmb_hi": "Лептомицин B блокирует экспорт белком CRM1, и FOXO накапливается в ядре ({n}). Но AKT активна ({a}) и белок остаётся фосфорилированным ({p}), а фосфорилированный FOXO связывается с ДНК хуже: занятость мишени {c} и синтез РНК {r} остаются ниже эталонных.", "s3b_c_lmb_hi_z": "Накопление в ядре — условие активности, но не её гарантия: вход в ядро, связывание с ДНК и синтез РНК — разные события. Лептомицин B — не физиологическое воздействие, это инструмент.", "s3b_c_lmb_lo": "Лептомицин B блокирует экспорт белком CRM1, и FOXO накапливается в ядре ({n}). AKT малоактивна, фосфорилировано лишь {p}, поэтому занятость мишени ({c}) и синтез РНК мишени ({r}) выше, чем в эталонной клетке.", "s3b_c_lmb_lo_z": "Когда белок мало фосфорилирован, накопление в ядре сопровождается более высокой занятостью мишени и более высоким синтезом РНК, чем в эталонной клетке. Лептомицин B — инструмент для оценки потока в ядро, а не физиологическое воздействие.", "p3b_1_q": "Клетка дикого типа находится при низком уровне сигнала инсулина/IGF-1, вмешательств нет. Уровень сигнала повысили до высокого. Как изменятся доля FOXO в ядре и синтез РНК мишени?", "p3b_1_o1": "Доля FOXO в ядре снизится почти до нуля, поэтому синтез РНК мишени полностью прекратится.", "p3b_1_o2": "Доля FOXO в ядре снизится, но не до нуля, а синтез РНК мишени снизится, но не прекратится.", "p3b_1_o3": "Доля FOXO в ядре почти не изменится, так как FOXO шаттлирует и без сигнала; РНК мишени не изменится.", "p3b_1_k": "AKT фосфорилирует FOXO; фосфорилированный белок хуже входит в ядро и быстрее экспортируется, но поток в ядро сохраняется, поэтому доля в ядре падает, не достигая нуля. Занятость мишени и синтез РНК снижаются вслед за ядерной долей, а часть синтеза РНК не зависит от FOXO.", "p3b_1_e": "В модели доля FOXO в ядре снижается с 62 % до 13 %, доля белка, фосфорилированного по сайту AKT, растёт с 34 % до 95 %, а синтез РНК мишени падает с ×1,0 до ×0,22. Часть белка остаётся в ядре, потому что и фосфорилированный FOXO импортируется, хотя медленнее (Brownawell 2001; Brunet 2002), а у нефосфорилированного белка экспорт через CRM1 тоже идёт. В мышечных волокнах потоки Foxo1 через ядерную оболочку почти уравновешены, а ингибирование AKT не делает вход одинаково высоким у всех волокон (Schachter 2012; Liu 2018). Небольшая часть синтеза РНК в модели не зависит от FOXO; ориентиром служат гепатоциты мыши без FoxO1, где эффект cAMP и дексаметазона на G6pc снижен более чем на четыре пятых, а на Pck1 — примерно на две пятых (Cook 2015). Перенос этих долей на уровень РНК — допущение модели, а значения на экране — расчёт, а не измерение в печени.", "p3b_1_w1": "Фосфорилирование не останавливает импорт FOXO, а лишь замедляет его и ускоряет экспорт, поэтому часть белка остаётся в ядре. РНК тоже не падает до нуля: часть синтеза РНК мишени не зависит от FOXO.", "p3b_1_w3": "Шаттлинг идёт при любом сигнале, но его баланс определяется фосфорилированием. Сигнал повышает активность AKT, смещает баланс в сторону экспорта, и доля в ядре падает; занятость мишени и синтез РНК следуют за ней.", "p3b_2_q": "Клетка дикого типа находится при высоком уровне сигнала. Добавили ингибитор PI3K/AKT. Как изменятся фосфорилирование FOXO по сайту AKT, доля FOXO в ядре и занятость мишени?", "p3b_2_o1": "Фосфорилирование FOXO полностью исчезнет, FOXO почти целиком окажется в ядре, занятость мишени вернётся к исходной.", "p3b_2_o2": "Фосфорилирование FOXO снизится, но доля в ядре почти не изменится, потому что вход в ядро не зависит от фосфорилирования.", "p3b_2_o3": "Фосфорилирование FOXO снизится, но останется; доля в ядре и занятость мишени вырастут, но не дойдут до исходных.", "p3b_2_k": "Ингибитор снижает активность AKT, но в данной модели оставляет 10 % её исходной активности. Базовая сцена показывает установившееся состояние: сохраняющийся поток фосфорилирования уравновешивается дефосфорилированием, и часть FOXO остаётся фосфорилированной. Поэтому доля FOXO в ядре и занятость мишени растут, но остаются ниже значений эталонной клетки. Медленное дефосфорилирование отдельно определяет время перехода после смены сигнала; эту динамику показывает продвинутая сцена.", "p3b_2_e": "В модели доля фосфорилированного FOXO снижается с 95 % до 63 %, доля в ядре растёт с 13 % до 39 %, занятость мишени — с 3 % до 23 %; доля в ядре и занятость остаются ниже, чем в эталонной клетке. Базовая сцена показывает установившееся состояние при сохранении 10 % активности AKT по субстрату: его определяет баланс фосфорилирования и дефосфорилирования фосфатазой PP2A, а в модели скорость фосфорилирования при остаточной активности AKT сопоставима со скоростью дефосфорилирования (константы подобраны, а не измерены). Дефосфорилирование в цитоплазме в модели
