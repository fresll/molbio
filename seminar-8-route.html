 при расщеплении некоторых аминокислот (валина, изолейцина, метионина, треонина) и жирных кислот с нечётным числом атомов углерода, карбоксилируется до метилмалонил-CoA; B₁₂-зависимая метилмалонил-CoA-мутаза превращает его в сукцинил-CoA. Поэтому глутамин нельзя считать главным источником восполнения для всех клеток. Какой вход преобладает, зависит от типа клеток и условий; это определяют экспериментально, например по распределению метки ¹³C; метод показан на схеме в шаге про прослеживание углерода."],"trap":["GLS превращает глутамин в α-КГ, поэтому её активности достаточно для восполнения цикла.","GLS освобождает аммоний из амидной группы глутамина. α-КГ образуется только после следующего превращения глутамата: трансаминирования или окислительного дезаминирования."],"conditions":"Схема качественная: показаны превращения углерода и азота глутамина. Различия вклада глутамина и PC получены на культивируемых клетках (глиобластома; SDH-дефицитные клетки мыши) и не обобщаются на все клетки (DeBerardinis и соавт., 2007 — полный текст; Cheng и соавт., 2011 — прочитана аннотация; Lussey-Lepoutre и соавт., 2015).","sources":["LNR2","DEBERARDINIS","CHENG","LUSSEY"],"quiz":{"id":"S8-L11","rev":2,"question":"В клетке активна GLS, но превращение глутамата в α-КГ ограничено. Достаточно ли активности GLS для поступления углерода глутамина в цикл?","options":[{"id":"S8-L11-2","text":"Да: глутамат, образованный GLS, сам является промежуточным соединением цикла.","correct":false,"feedback":"Глутамат не относится к промежуточным соединениям цикла; его углерод поступает в цикл через α-КГ."},{"id":"S8-L11-1","text":"Нет: необходима следующая реакция, которая образует α-КГ из глутамата.","correct":true,"feedback":"GLS образует глутамат; для включения его углерода в цикл нужен дополнительный этап."},{"id":"S8-L11-3","text":"Нет: глутамат входит в цикл только после превращения в оксалоацетат.","correct":false,"feedback":"Глутамат превращается в α-КГ трансаминированием или с участием GDH, а не в оксалоацетат."}]},"widget":{"kind":"net","title":"","s":{"title":"Путь углерода глутамина в цикл","status":"Схема механизма · качественные состояния","ctrls":[{"id":"a","type":"group","label":"Превращение глутамата в α-КГ","opts":["трансаминирование","GDH","ограничено"]},{"id":"r","type":"group","label":"Дальнейший путь α-КГ","opts":["окислительный","восстановительный"]}],"W":640,"H":380,"NW":340,"NH":550,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":368,"c":"mito","t":"митохондрия","lx":626,"ly":364,"n":[4,4,332,542,330,534],"a":"end"}],"mem":[],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,80,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,80,68,40],"fs":14},"iso":{"p":[346,190,100,40],"t":"изоцитрат","n":[282,180,94,40],"fs":14},"akg":{"p":[472,190,60,40],"t":"α-КГ","n":[282,280,54,40],"fs":14},"scoa":{"p":[472,305,98,46],"t":"сукцинил-\nCoA","n":[282,380,94,48],"fs":14},"suc":{"p":[332,305,90,40],"t":"сукцинат","n":[58,380,84,40],"fs":14},"fum":{"p":[201,305,80,40],"t":"фумарат","n":[58,280,78,40],"fs":14},"mal":{"p":[70,305,66,40],"t":"малат","n":[58,180,62,40],"fs":14},"gln":{"p":[472,34,92,30],"t":"глутамин","n":[150,172,90,30],"fs":13},"glu":{"p":[472,100,86,30],"t":"глутамат","n":[150,250,86,30],"fs":13},"prop":{"p":[150,247,100,44],"t":"пропионил-\nCoA","n":[110,462,124,30],"fs":13,"tn":"пропионил-CoA"},"mm":{"p":[300,247,126,44],"t":"метилмалонил-\nCoA","n":[270,472,108,44],"fs":13,"tn":"метил-\nмалонил-CoA"}},"edges":{"cs":{"a":"oaa","b":"cit","k":"rx","d":[0,-13],"dn":[0,-14]},"aco":{"a":"cit","b":"iso","k":"rx","d":[0,-13],"dn":[-26,0]},"idh":{"a":"iso","b":"akg","k":"rx","t":"IDH3","d":[0,-13],"dn":[-34,0]},"kgdh":{"a":"akg","b":"scoa","k":"rx","t":"α-КГДГ","d":[44,0],"dn":[-40,0]},"scs":{"a":"scoa","b":"suc","k":"rx","d":[0,32],"dn":[0,-26]},"sdh":{"a":"suc","b":"fum","k":"rx","d":[0,32],"dn":[52,0]},"fh":{"a":"fum","b":"mal","k":"rx","d":[0,30],"dn":[24,0]},"mdh":{"a":"mal","b":"oaa","k":"rx","d":[42,0],"dn":[34,0]},"rc1":{"a":"akg","b":"iso","k":"rx","t":"IDH1/IDH2\nNADPH, CO₂","tn":"IDH1/2\nNADPH, CO₂","d":[0,34],"dn":[-56,0]},"rc2":{"a":"iso","b":"cit","k":"rx","t":"ACO","d":[0,-13],"dn":[-26,0]},"gls":{"a":"gln","b":"glu","k":"rx","t":"GLS","d":[-30,0],"dn":[-28,0]},"ng":{"a":[478,67,154,211],"b":[566,67,100,211],"k":"rx","t":"NH₄⁺","d":[0,-12],"dn":[0,-12]},"gd":{"a":"glu","b":"akg","k":"rx","t":"аминотрансфераза","tn":"","d":[-68,0]},"ng2":{"a":[478,143,224,266],"b":[560,143,224,316],"k":"rx","t":"аминокислота","d":[10,-12],"dn":[0,18]},"pp":{"a":"prop","b":"mm","k":"rx"},"mu":{"a":"mm","b":"scoa","k":"rx","t":"мутаза, B₁₂","d":[22,-12],"dn":[-50,0]}},"st":{"0-0":{"n":{"glu":"base"},"e":{"gd":"on","rc1":"hide","rc2":"hide","kgdh":"on","idh":"on","aco":"on"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","трансаминирование"],["Путь α-КГ","окислительный"]],"note":"GLS образует глутамат, аминотрансфераза переносит его аминогруппу на кетокислоту, при этом образуется α-КГ, который превращается по окислительному пути в сукцинил-CoA.","et":{"gd":"аминотрансфераза","ng2":"аминокислота"}},"0-1":{"n":{"glu":"base"},"e":{"gd":"on","rc1":"on","rc2":"on","kgdh":"off","idh":"hide","aco":"hide"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","трансаминирование"],["Путь α-КГ","восстановительный"]],"note":"α-КГ из глутамина превращается по восстановительному пути: IDH1 или IDH2 в обратном направлении присоединяют CO₂ и расходуют NADPH, образуется изоцитрат, затем цитрат. Показан только этот путь; в клетке возможны оба.","et":{"gd":"аминотрансфераза","ng2":"аминокислота"}},"1-0":{"n":{"glu":"base"},"e":{"gd":"on","rc1":"hide","rc2":"hide","kgdh":"on","idh":"on","aco":"on"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","GDH, NH₄⁺"],["Путь α-КГ","окислительный"]],"note":"GDH окисляет глутамат до α-КГ и отщепляет аммоний; NAD⁺ или NADP⁺ при этом восстанавливается. α-КГ превращается по окислительному пути.","et":{"gd":"GDH","ng2":"NH₄⁺"}},"1-1":{"n":{"glu":"base"},"e":{"gd":"on","rc1":"on","rc2":"on","kgdh":"off","idh":"hide","aco":"hide"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","GDH, NH₄⁺"],["Путь α-КГ","восстановительный"]],"note":"GDH образует α-КГ, который превращается по восстановительному пути (IDH1 или IDH2 в обратном направлении) в изоцитрат и цитрат. Показан только этот путь; в клетке возможны оба.","et":{"gd":"GDH","ng2":"NH₄⁺"}},"2-0":{"n":{"glu":"on"},"e":{"gd":"off","ng2":"hide","rc1":"hide","rc2":"hide","kgdh":"off","idh":"on","aco":"on"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","ограничено"],["Восполнение α-КГ","снижено"]],"note":"GLS образует глутамат, но превращение глутамата в α-КГ ограничено: в цикл входит меньше углерода глутамина, и восполнение цикла глутамином снижается.","et":{}},"2-1":{"n":{"glu":"on"},"e":{"gd":"off","ng2":"hide","rc1":"off","rc2":"off","kgdh":"off","idh":"hide","aco":"hide"},"m":[["GLS","глутамин → глутамат"],["Глутамат → α-КГ","ограничено"],["Восполнение α-КГ","снижено"]],"note":"Глутамат образуется, но α-КГ из него образуется в ограниченном количестве, поэтому в окислительный и восстановительный пути превращения α-КГ поступает меньше углерода глутамина.","et":{}}},"nfs":13}}},{"id":"sdh-and-compensation","number":12,"section":1,"title":"Почему обходной приток не устраняет потерю SDH","question":2,"questions":[2],"keywords":["SDH","комплекс II","сукцинат","фумарат","FH","PC","аспартат","обходной путь","потеря SDH"],"lead":["Если [[T36|SDH]] утрачена, сукцинат не окисляется до фумарата и накапливается.","Приток углерода через PC может поддерживать синтез аспартата, но сам по себе не устраняет нарушение реакции SDH."],"mechanism":["SDH окисляет сукцинат до фумарата и передаёт электроны от связанного FAD убихинону; фумараза присоединяет воду к фумарату.","При утрате SDH сукцинат накапливается, образование фумарата из сукцината прерывается, а содержание фумарата и малата снижается; в исследованных моделях снижено и содержание аспартата.","Оксалоацетат образуется из пирувата под действием PC независимо от SDH, что поддерживает синтез аспартата; реакция сукцинат → фумарат при этом остаётся нарушенной."],"paragraphs":["SDH — комплекс II дыхательной цепи и единственный фермент ЦТК, встроенный во внутреннюю мембрану митохондрии. Она окисляет [[T34|сукцинат]] до [[T35|фумарата]]: электроны переходят на прочно связанный FAD, а затем на убихинон. [[T37|Фумараза]] (FH) гидратирует фумарат до малата. Потеря FH и потеря SDH — разные нарушения: при потере FH накапливается фумарат, при потере SDH — сукцинат.","При утрате SDH реакция сукцинат → фумарат не идёт, а сукцинат продолжает образовываться, поэтому он накапливается. В хромаффинных клетках мыши с делецией Sdhb и в опухолях человека с мутациями SDH накапливается сукцинат и снижено содержание аспартата; в клетках мыши ниже также содержание фумарата, малата и цитрата (Lussey-Lepoutre и соавт., 2015). Углерод глутамина включается в сукцинат, но по окислительному пути метка в малат и аспартат не переходит.","Аспартат образуется из оксалоацетата, а его синтез требует акцепторов электронов, которые регенерируются при работе дыхательной цепи (Sullivan и соавт., 2015). Образование оксалоацетата из пирувата реакцией PC акцептора электронов не требует, в отличие от окисления малата малатдегидрогеназой, которой нужен NAD⁺. При утрате SDH оксалоацетат в митохондриях образуется из пирувата под действием PC: по включению метки ¹³C из глюкозы (метод показан на схеме в шаге про прослеживание углерода) выявлен возросший вклад PC в аспартат, а подавление PC прекращало рост клеток без SDH и мало влияло на клетки дикого типа (Lussey-Lepoutre и соавт., 2015; Cardaci и соавт., 2015). Опыты проводили на клетках в среде с пируватом.","Поддержание содержания аспартата обходным путём не возвращает активность комплекса II. Реакция сукцинат → фумарат остаётся нарушенной, сукцинат продолжает накапливаться, и накопление сукцината конкурентно с α-КГ ингибирует α-КГ-зависимые диоксигеназы, в том числе деметилазы гистонов (Xiao и соавт., 2012; см. шаг про нарушения SDH, FH и IDH). Степень компенсации зависит от типа клеток и от других потоков углерода."],"trap":["Если усиленная PC поддерживает синтез аспартата, функция SDH возвращена.","Обходной путь пополняет оксалоацетат и поддерживает аспартат; реакция сукцинат → фумарат остаётся нарушенной, и сукцинат продолжает накапливаться."],"conditions":"Схема качественная: показано, какие реакции остаются при утрате SDH. Данные получены на клетках мыши с делецией Sdhb (хромаффинные клетки, фибробласты надпочечника, клетки почки) и на опухолях человека с мутациями SDH; в других клетках вклад PC и степень компенсации могут отличаться (Lussey-Lepoutre и соавт., 2015; Cardaci и соавт., 2015).","sources":["LNR2","LUSSEY","CARDACI","XIAO"],"quiz":{"id":"S8-L12","rev":2,"question":"При утрате SDH усиление PC ослабило нехватку аспартата. Что это означает для реакции SDH?","options":[{"id":"S8-L12-2","text":"Усиленная PC частично взяла на себя окисление сукцината, поэтому его накопление уменьшилось.","correct":false,"feedback":"У PC другая реакция и другие субстраты; окисление сукцината катализирует SDH."},{"id":"S8-L12-3","text":"Поддержание аспартата показывает, что комплекс II частично возобновил работу в дыхательной цепи.","correct":false,"feedback":"Аспартат можно поддержать обходным путём, не устраняя первичный дефект; по его содержанию активность SDH не определяют."},{"id":"S8-L12-1","text":"Нехватка аспартата ослаблена за счёт PC, но превращение сукцината в фумарат по-прежнему нарушено.","correct":true,"feedback":"PC образует оксалоацетат независимо от реакции сукцинат → фумарат."}]},"widget":{"kind":"net","title":"","s":{"title":"Утрата SDH и обходной путь через PC","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"SDH","opts":["активна","утрачена"]},{"id":"p","type":"group","label":"Приток через PC","opts":["исходный","усилен"]}],"W":640,"H":380,"NW":340,"NH":560,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":368,"c":"mito","t":"митохондрия","lx":626,"ly":364,"n":[4,4,332,552,330,544],"a":"end"}],"mem":[],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,190,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,190,68,40],"fs":14},"iso":{"p":[346,190,100,40],"t":"изоцитрат","n":[282,290,94,40],"fs":14},"akg":{"p":[472,190,60,40],"t":"α-КГ","n":[282,390,54,40],"fs":14},"scoa":{"p":[472,305,98,46],"t":"сукцинил-\nCoA","n":[282,490,94,48],"fs":14},"suc":{"p":[332,305,90,40],"t":"сукцинат","n":[58,490,84,40],"fs":14},"fum":{"p":[201,305,80,40],"t":"фумарат","n":[58,390,78,40],"fs":14},"mal":{"p":[70,305,66,40],"t":"малат","n":[58,290,62,40],"fs":14},"pyr":{"p":[60,60,78,30],"t":"пируват","n":[58,100,78,30],"fs":13},"asp":{"p":[190,100,86,30],"t":"аспартат","n":[170,108,86,30],"fs":13},"gln":{"p":[472,110,90,30],"t":"глутамин","n":[170,350,90,30],"fs":13},"sdhn":{"p":[264,346,64,28],"t":"SDH","n":[150,440,64,28],"fs":13}},"edges":{"cs":{"a":"oaa","b":"cit","k":"rx","d":[0,-13],"dn":[0,-14]},"aco":{"a":"cit","b":"iso","k":"rx","d":[0,-13],"dn":[-26,0]},"idh":{"a":"iso","b":"akg","k":"rx","d":[0,-44],"dn":[-56,0]},"kgdh":{"a":"akg","b":"scoa","k":"rx","d":[52,0],"dn":[-56,0]},"scs":{"a":"scoa","b":"suc","k":"rx","d":[0,32],"dn":[0,-26]},"sdh":{"a":"suc","b":"fum","k":"rx","d":[0,32],"dn":[52,0]},"fh":{"a":"fum","b":"mal","k":"rx","d":[0,30],"dn":[24,0]},"mdh":{"a":"mal","b":"oaa","k":"rx","d":[42,0],"dn":[34,0]},"pc":{"a":"pyr","b":"oaa","k":"rx","t":"PC","d":[18,0],"dn":[18,0]},"xa":{"a":"oaa","b":"asp","k":"rx"},"ig":{"a":"gln","b":"akg","k":"rx","t":"через\nглутамат","d":[44,0],"dn":[44,0],"dash":true}},"st":{"0-0":{"n":{"pyr":"base"},"e":{"pc":"on"},"m":[["Реакция SDH","идёт"],["Сукцинат","не накапливается"],["Содержание аспартата","поддерживается"]],"note":"SDH активна: сукцинат окисляется до фумарата, цикл замкнут, сукцинат не накапливается."},"0-1":{"n":{"pyr":"on","asp":"on"},"e":{"pc":"on"},"m":[["Реакция SDH","идёт"],["Приток через PC","усилен"],["Содержание аспартата","поддерживается"]],"note":"SDH активна, приток через PC усилен: оксалоацетата из пирувата образуется больше, и цикл продолжает работать."},"1-0":{"n":{"pyr":"base","sdhn":"abs","suc":"on","fum":"low","mal":"low","asp":"low"},"e":{"pc":"on","sdh":"off"},"m":[["Реакция SDH","нарушена"],["Сукцинат","накапливается"],["Содержание аспартата","снижено"]],"note":"SDH утрачена: сукцинат накапливается, образование фумарата из сукцината прервано, содержание аспартата снижено, как в исследованных моделях."},"1-1":{"n":{"pyr":"on","sdhn":"abs","suc":"on","fum":"low","mal":"low","asp":"base"},"e":{"pc":"on","sdh":"off"},"m":[["Реакция SDH","остаётся нарушенной"],["Сукцинат","продолжает накапливаться"],["Содержание аспартата","поддерживается через PC"]],"note":"SDH утрачена, PC усилена: PC частично поддерживает содержание оксалоацетата и аспартата, но реакция SDH остаётся нарушенной, и сукцинат продолжает накапливаться."}},"nfs":13}}},{"id":"reductive-carboxylation","number":13,"section":1,"title":"Как α-кетоглутарат может использоваться для образования цитрата","question":2,"questions":[2],"keywords":["восстановительное карбоксилирование","IDH1","IDH2","NADPH","изоцитрат","цитрат","α-КГ","гипоксия","R-2-HG"],"lead":["[[T38|Восстановительное карбоксилирование α-КГ]] образует изоцитрат из α-КГ, CO₂ и NADPH, а затем изоцитрат может превращаться в цитрат.","Это обращение лишь части реакций ЦТК; оно не связано с образованием R-2-HG."],"mechanism":["В окислительном направлении α-КГ превращается в сукцинил-CoA с выделением одного CO₂ и образованием NADH.","В обратном направлении NADPH-зависимые IDH1 (преимущественно цитозоль) и IDH2 (матрикс) присоединяют CO₂ к α-КГ и расходуют NADPH; образуется изоцитрат, из которого получается цитрат.","Мутантная IDH1 катализирует другую реакцию: α-КГ + NADPH → R-2-HG, и цитрат при этом не образуется."],"paragraphs":["У α-КГ есть два направления превращения. В окислительном направлении α-кетоглутаратдегидрогеназа (α-КГДГ) превращает α-КГ в сукцинил-CoA с выделением CO₂ и образованием NADH, и углерод переходит дальше к сукцинату и оксалоацетату. В восстановительном направлении изоцитратдегидрогеназы IDH1 и IDH2 катализируют реакцию, обратную прямой: прямая реакция — изоцитрат → α-КГ + CO₂ с образованием NADPH, обратная — α-КГ + CO₂ + NADPH → изоцитрат, то есть NADPH расходуется. Изоцитрат аконитаза превращает в цитрат. IDH1 находится преимущественно в цитозоле (и в пероксисомах), IDH2 — в митохондриальном матриксе; какая изоформа обеспечивает реакцию, зависит от клеток и условий.","Метка, характерная для этого пути, обнаруживалась во многих культивируемых линиях; вклад пути в чистый поток различается и возрастает при гипоксии, утрате белка VHL и нарушении работы дыхательной цепи. В части гипоксических линий глутамин становился главным источником цитрата (Wise и соавт., 2011). По данным Metallo и соавт. (2012), при гипоксии и при утрате белка VHL синтез липидов в большей мере зависел от восстановительного использования глутамина через IDH1. Путь преобладал в опухолевых клетках с мутациями комплексов I и III дыхательной цепи, при утрате FH и при острой блокаде дыхательной цепи (Mullen и соавт., 2012). Опыты проводили на культивируемых клетках, и вклад пути различался между линиями.","Это обращение только части реакций цикла, от α-КГ к цитрату, а не всего ЦТК. Вклад пути зависел от отношения содержания α-КГ к содержанию цитрата: восстановительный путь усиливался при воздействиях, которые повышали это отношение, например при нарушении превращения ацетил-CoA в цитрат (Fendt и соавт., 2013). Реакции IDH1 и IDH2 обратимы, поэтому часть метки ¹³C в цитрате может отражать обмен изоцитрат ⇄ α-КГ без чистого потока (метод показан на схеме в шаге про прослеживание углерода).","Мутантная IDH1 катализирует другую реакцию. Для IDH1 R132H показано, что фермент приобретает способность восстанавливать α-КГ до R-2-гидроксиглутарата (R-2-HG) за счёт NADPH (Dang и соавт., 2009). R-2-HG не входит в путь образования цитрата. 2-Гидроксиглутарат и α-КГ (2-оксоглутарат) — разные вещества (см. шаг про нарушения SDH, FH и IDH)."],"trap":["Восстановительное карбоксилирование — то же, что образование R-2-HG мутантной IDH.","Это разные реакции. Восстановительное карбоксилирование образует изоцитрат и цитрат и расходует NADPH и CO₂, а мутантная IDH превращает α-КГ в R-2-HG."],"conditions":"Схема качественная: показаны два направления превращения α-КГ и отдельная реакция мутантной IDH. Восстановительный путь описан в культивируемых клетках при гипоксии, дефектах дыхательной цепи, утрате FH или VHL; результат зависит от линии и условий (Metallo и соавт., 2012; Mullen и соавт., 2012; Wise и соавт., 2011 — прочитана аннотация; Dang и соавт., 2009 — аннотация).","sources":["LNR2","WISE","METALLO","MULLEN","FENDT","DANG"],"quiz":{"id":"S8-L13","rev":2,"question":"Что непосредственно образуется при восстановительном карбоксилировании α-КГ ферментами IDH1 и IDH2?","options":[{"id":"S8-L13-2","text":"R-2-HG, который затем служит предшественником цитрата.","correct":false,"feedback":"R-2-HG не входит в путь образования цитрата; его образует мутантная IDH отдельной реакцией."},{"id":"S8-L13-1","text":"Изоцитрат, из которого далее может образоваться цитрат.","correct":true,"feedback":"Реакция включает карбоксилирование и восстановление α-КГ за счёт NADPH; она обратна образованию NADPH при окислении изоцитрата."},{"id":"S8-L13-3","text":"Сукцинил-CoA с выделением CO₂ и образованием NADH.","correct":false,"feedback":"Так описывается окислительное превращение α-КГ с участием α-КГДГ; при восстановительном карбоксилировании CO₂ присоединяется, а NADPH расходуется."}]},"widget":{"kind":"net","title":"","s":{"title":"Два направления превращения α-КГ","status":"Схема механизма · качественные состояния","ctrls":[{"id":"r","type":"group","label":"Путь α-КГ","opts":["окислительный","восстановительный","оба пути"]},{"id":"m","type":"group","label":"Мутантная IDH","opts":["нет","есть"]}],"W":640,"H":380,"NW":340,"NH":560,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":368,"c":"mito","t":"митохондрия","lx":626,"ly":364,"n":[4,4,332,552,330,544],"a":"end"},{"x":6,"y":14,"w":330,"h":100,"c":"plain","t":"отдельная реакция","lx":14,"ly":106,"n":[6,6,328,104,12,100],"dash":"6 4"}],"mem":[],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,190,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,190,68, ,"acob":"on","rc2":"hide","rc2b":"on","kgdh":"on","mt":"off"},"m":[["Превращение α-КГ","обе ветви"],["CO₂ и кофермент","CO₂ выделяется и присоединяется; NADH образуется, NADPH расходуется"],["R-2-HG","не образуется"]],"note":"Обе ветви: часть α-КГ окисляется до сукцинил-CoA, часть карбоксилируется до изоцитрата. Их соотношение зависит от клеток и условий."},"2-1":{"n":{"ka":"base","rh":"on"},"e":{"idh":"hide","idhb":"on","rc1":"hide","rc1b":"on","aco":"hide","acob":"on","rc2":"hide","rc2b":"on","kgdh":"on","mt":"on"},"m":[["Превращение α-КГ","обе ветви"],["CO₂ и кофермент","CO₂ выделяется и присоединяется; NADH образуется, NADPH расходуется"],["R-2-HG","образуется мутантной IDH (отдельная реакция)"]],"note":"Обе ветви работают, а мутантная IDH1 образует R-2-HG из α-КГ; эта реакция не связана ни с одной из ветвей."}},"nfs":13}}},{"id":"carbon-tracing","number":14,"section":1,"title":"Как проследить происхождение углерода и не спутать мечение с потоком","question":2,"questions":[2],"keywords":["¹³C","мечение","изотополог","изотопомер","M+n","LC–MS","доля изотополога","цитрат","поток"],"lead":["При прослеживании углерода в среду вводят ¹³C-меченый субстрат и по [[T39|изотопологам]] продуктов судят, по какому пути превращался углерод.","Это определение маршрута при названных условиях, а не измерение величины потока."],"mechanism":["Меченый субстрат вносят в среду, и атомы ¹³C переходят в продукты реакций.","LC–MS разделяет вещества и различает изотопологи по массе; доля изотополога показывает, какая часть молекул содержит n меченых атомов.","В первом обороте цикла из [U-¹³C₅]глутамина окислительный путь даёт цитрат M+4, восстановительный — M+5; доля изотополога при этом не равна величине потока."],"paragraphs":["¹³C — стабильный изотоп углерода. Если часть глутамина в среде заменить на [[T42|универсально меченый]] [U-¹³C₅]глутамин, во всех его молекулах пять атомов углерода будут ¹³C, и на схеме (панель M02) видно, какие из них сохранятся в продукте. При окислительном превращении α-КГ в сукцинил-CoA один атом ¹³C выделяется в виде CO₂, а немеченый ацетил-CoA добавляет два атома ¹²C, поэтому в первом обороте цикла цитрат содержит четыре меченых атома. Если же α-КГ присоединяет CO₂, не теряя углерода, а источник CO₂ немечен, в цитрате остаются все пять меченых атомов.","Вещества извлекают из клеток и анализируют методом [[T80|LC–MS]] (на схеме — панель M03): жидкостная хроматография разделяет компоненты смеси по времени удерживания, а масс-спектрометр регистрирует ионы по отношению массы к заряду. Молекулы, различающиеся числом ¹³C, называют изотопологами и обозначают [[T41|M+n]], где n — число меченых атомов. Молекулы с тем же числом ¹³C в разных положениях — [[T40|изотопомеры]]; подсчёт M+n их не различает. [[T43|Доля меченого изотополога]] — отношение его количества к сумме всех изотопологов соединения после поправки на естественный ¹³C.","Доля изотополога не равна потоку. Она зависит от доли ¹³C в источнике, от разведения метки немечеными источниками, от времени мечения и числа оборотов, от обмена изоцитрата и α-КГ. Кроме того, экстракт целых клеток усредняет компартменты. В этом учебном примере показан первый оборот цикла, то есть мечение до установления изотопного стационарного состояния. При количественной интерпретации различают изотопное стационарное состояние и переходное мечение; способ расчёта выбирают с учётом времени мечения и того, находится ли метаболизм в стационарном состоянии (Buescher и соавт., 2015). Поэтому одну и ту же долю M+4 могут дать разные сочетания вклада пути и доли метки, а абсолютный поток требует модели и дополнительных измерений."],"trap":["Доля M+5 в цитрате равна скорости восстановительного карбоксилирования.","Доля изотополога показывает долю в пуле при заданных условиях, а не скорость; поток требует учёта разведения метки, обмена, времени мечения и модели."],"conditions":"Схемы M02 и M03 учебные: значения долей условные и не относятся к реальным клеткам; показан первый оборот цикла при немеченых остальных источниках. Принципы интерпретации мечения приведены по обзору Buescher и соавт. (2015, прочитан полный текст), примеры маршрутов — по работам Metallo, Mullen и Fendt с соавт.","sources":["BUESCHER","METALLO","MULLEN","FENDT"],"quiz":{"id":"S8-L14","rev":2,"question":"Клетки культивировали с [U-¹³C₅]глутамином, остальные источники углерода и CO₂ немечены. В первом обороте цикла обнаружен цитрат M+5. Какой вывод допустим?","options":[{"id":"S8-L14-2","text":"M+5 согласуется с окислительным превращением α-КГ, при котором меченый CO₂ выделяется.","correct":false,"feedback":"При окислительном превращении один меченый атом выделяется в виде ¹³CO₂, и в первом обороте образуется цитрат M+4, а не M+5."},{"id":"S8-L14-1","text":"M+5 согласуется с восстановительным карбоксилированием α-КГ; чистый поток нужно подтверждать отдельно.","correct":true,"feedback":"Пять атомов ¹³C исходного α-КГ сохраняются, а присоединённый CO₂ немечен, что даёт M+5. Однако M+5 не доказывает чистый поток по этому пути: часть M+5 может возникать при обмене изоцитрат ⇄ α-КГ."},{"id":"S8-L14-3","text":"Доля M+5 в цитрате допускает расчёт скорости потока по этому пути без дополнительной модели.","correct":false,"feedback":"Доля изотополога — не скорость: поток требует учёта разведения метки, обмена и модели."}]},"widget":{"kind":"s2_trace","title":"","s":{"title":"Происхождение углерода: ¹³C-мечение и LC–MS","status":"Схема метода · учебные значения, не данные опыта","sc_label":"Опыт","scs":[{"opt":"[U-¹³C₅]глутамин: окислительный путь","m":4,"chain":[{"t":"[U-¹³C₅]\nглутамин","a":"11111","m":"M+5"},{"t":"α-КГ","a":"11111","m":"M+5"},{"t":"оксалоацетат","a":"1111","m":"M+4"}],"gaps":["GLS и\nещё реакция","α-КГДГ: −¹³CO₂,\nчерез сукцинат"],"last":"цитрат-\nсинтаза","ac":true,"partner":{"t":"ацетил-CoA, немеченый","a":"00"},"final":{"t":"цитрат","a":"111100","m":"M+4"},"note":"Первый оборот окислительного пути: α-КГ M+5 теряет один атом ¹³C в виде ¹³CO₂, оксалоацетат M+4 соединяется с немеченым ацетил-CoA, и образуется цитрат M+4."},{"opt":"[U-¹³C₅]глутамин: восстановительное карбоксилирование","m":5,"chain":[{"t":"[U-¹³C₅]\nглутамин","a":"11111","m":"M+5"},{"t":"α-КГ","a":"11111","m":"M+5"}],"gaps":["GLS и\nещё реакция"],"last":"IDH1/IDH2, NADPH,\nзатем аконитаза","partner":{"t":"¹²CO₂, немеченый","a":"0"},"final":{"t":"цитрат","a":"111110","m":"M+5"},"note":"Восстановительное карбоксилирование: α-КГ M+5 присоединяет немеченый CO₂, образуются изоцитрат и цитрат M+5; все пять меченых атомов сохраняются."},{"opt":"[U-¹³C₆]глюкоза: через PDH","m":2,"chain":[{"t":"[U-¹³C₆]\nглюкоза","a":"111111","m":"M+6"},{"t":"пируват","a":"111","m":"M+3"},{"t":"ацетил-CoA","a":"11","m":"M+2"}],"gaps":["гликолиз","PDH: −¹³CO₂"],"last":"цитрат-\nсинтаза","ac":true,"partner":{"t":"оксалоацетат, немеченый","a":"0000"},"final":{"t":"цитрат","a":"110000","m":"M+2"},"note":"Путь через PDH: пируват M+3 теряет один атом ¹³C в виде ¹³CO₂, ацетил-CoA M+2 соединяется с немеченым оксалоацетатом, и образуется цитрат M+2."},{"opt":"[U-¹³C₆]глюкоза: через PC","m":3,"chain":[{"t":"[U-¹³C₆]\nглюкоза","a":"111111","m":"M+6"},{"t":"пируват","a":"111","m":"M+3"},{"t":"оксалоацетат","a":"1110","m":"M+3"}],"gaps":["гликолиз","PC: + ¹²CO₂"],"last":"цитрат-\nсинтаза","ac":true,"partner":{"t":"ацетил-CoA, немеченый","a":"00"},"final":{"t":"цитрат","a":"111000","m":"M+3"},"note":"Путь через PC: пируват M+3 присоединяет немеченый CO₂, оксалоацетат M+3 соединяется с немеченым ацетил-CoA, и образуется цитрат M+3."}],"sl_e":"Доля ¹³C в источнике (учебное значение)","sl_p":"Вклад этого пути в образование цитрата (учебное значение)","ck_nat":"Поправка на естественный ¹³C введена","hdrA":"M02 · перенос атомов (● — ¹³C, ○ — ¹²C)","acnote":"У ацетил-CoA кружки — два атома углерода ацетильной группы; углерод CoA не показан.","acnote_n":"ацетил-CoA: показан только углерод ацетила","hdrB":"M03 · LC–MS: разделение и регистрация ионов","hdrC":"Условия вывода (янтарная рамка — учесть в этом опыте)","hdrC_n":"Условия вывода (янтарь — учесть здесь)","chrom":"хроматограмма (учебная)","spec":"масс-спектр пика цитрата;\nчисла — доля изотополога, %","rt":"время удерживания","mz":"цитрат, [M−H]⁻: m/z 191,02 + 1,003·n","peaks":["изоцитрат","цитрат"],"limits":[{"t":"режим\nи время\nмечения","when":""},{"t":"разведение\nнемечеными\nисточниками","when":"dil"},{"t":"компартменты:\nэкстракт клетки\nдаёт среднее","when":""},{"t":"природный ¹³C:\nнужна\nпоправка","when":"nat"},{"t":"нормировка:\nклетки, белок,\nстандарт","when":""}],"m1":"Изотополог выбранного пути","m2":"Его доля среди изотопологов","m3":"Доля M+0","dyn":"Доля {iso} среди изотопологов цитрата — {f} при доле ¹³C в источнике {e} и вкладе пути {p} (учебные значения). Это доля изотополога, а не скорость потока: то же значение даёт другое сочетание этих величин.","nat_off":"Показан наблюдаемый спектр: пики M+1 и соседние частично создаёт естественный ¹³C; без поправки их нельзя считать результатом мечения.","nat_on":"Показан спектр после поправки на естественный ¹³C: остаётся распределение, созданное меткой (учебный расчёт только для атомов углерода)."}}},{"id":"acetyl-coa-compartments","number":15,"section":2,"title":"Откуда берётся ацетил-CoA для ацетилирования гистонов","question":3,"questions":[3],"keywords":["ацетил-CoA","ACLY","ACSS2","цитрат","ацетат","компартменты","внутренняя мембрана митохондрий","ацетилирование гистонов","SLC25A1"],"lead":["Внутренняя мембрана митохондрий не пропускает [[T44|ацетил-CoA]], поэтому его митохондриальный пул отделён от пула в цитозоле и ядре.","Вне митохондрий основными источниками ацетил-CoA служат цитрат (фермент [[T45|ACLY]]) и ацетат (фермент [[T46|ACSS2]]); вклад других путей, в том числе ацетилкарнитина, зависит от клеток."],"mechanism":["Главный путь выхода ацетильных групп из матрикса: ацетил-CoA конденсируется с оксалоацетатом в цитрат, и цитрат выходит в цитозоль через переносчик SLC25A1. Второй путь проходит через ацетилкарнитин.","В цитозоле и ядре ACLY расщепляет цитрат с участием CoA и ATP на ацетил-CoA и оксалоацетат, а ACSS2 образует ацетил-CoA из ацетата, CoA и ATP.","[[T47|Гистонацетилтрансферазы]] используют ацетил-CoA ядра и цитозоля. Этот пул пополняется цитратом и ацетатом, а по данным отдельных работ также ацетилкарнитином и локальным синтезом в ядре; митохондриальный пул пополняется иначе и с ним напрямую не смешивается."],"paragraphs":["В митохондриях ацетил-CoA образуется при окислении пирувата, жирных кислот и аминокислот и расходуется в ЦТК. Внутренняя мембрана митохондрий не пропускает ацетил-CoA, поэтому ацетильные группы покидают матрикс главным образом в составе цитрата: ацетил-CoA конденсируется с оксалоацетатом, и цитрат выходит через переносчик SLC25A1. Второй путь — через ацетилкарнитин: карнитинацетилтрансфераза (CrAT) переносит ацетильную группу на карнитин, и ацетилкарнитин выходит из митохондрий через переносчик SLC25A20.","Вне митохондрий ацетил-CoA образуется двумя основными путями. ACLY в присутствии CoA и ATP расщепляет цитрат на ацетил-CoA и оксалоацетат. ACSS2 присоединяет CoA к ацетату за счёт ATP. Оба фермента обнаружены и в цитозоле, и в ядре. Кроме того, ацетил-CoA из пирувата образует ядерный пируватдегидрогеназный комплекс (Sutendra и соавт., 2014). В клетках мышиной карциномы печени без ACLY и ACSS2 ацетильные группы поступали из митохондрий в виде ацетилкарнитина, а в клетках с ACLY отсутствие CrAT на синтез жирных кислот не влияло (Izzo и соавт., 2023).","Вклад путей зависит от клеток и условий. В клетках колоректальной карциномы человека HCT116 при снижении количества ACLY ацетилирование гистонов уменьшалось, а сверхфизиологические концентрации ацетата в среде возвращали ацетилирование гистонов (с участием ACSS2; Wellen и соавт., 2009). В фибробластах мыши (MEF) без ACLY ацетат в концентрации 100 мкМ поддерживал выживание, но не возвращал ацетилирование гистонов, а при 1 мМ ацетилирование повышалось (Zhao и соавт., 2016). В дифференцированных нейрональных клетках мыши ACSS2 расположена преимущественно в ядре, а ACLY — в цитозоле, и подавление ACSS2 снижало ацетилирование гистонов (Mews и соавт., 2017).","Из-за разделения пулов содержание ацетил-CoA в митохондриях не определяет, сколько субстрата получают ферменты хроматина. Пулы ядра и цитозоля обмениваются через ядерные поры, но по обзору Sivanand и соавт. (2018) локальный синтез в ядре и поступающий ацетат вносят в ацетилирование гистонов иной вклад, чем в синтез жирных кислот в цитозоле. Содержание ацетил-CoA в ядре измерено в ядерной фракции методом LC–MS с изотопно меченным внутренним стандартом (SILEC-SF; схема LC–MS — в шаге про величины, связывающие метаболизм с модификацией гистона): при дифференцировке адипоцитов оно возрастало примерно в 5 раз вместе с ацетилированием гистонов (Trefely и соавт., 2022)."],"trap":["Если содержание ацетил-CoA в митохондриях увеличилось, то ацетилирование гистонов автоматически возрастает.","Ацетил-CoA матрикса не проходит внутреннюю мембрану: ядерно-цитозольный пул образуется из цитрата (ACLY), ацетата (ACSS2) и, по отдельным данным, из пирувата в ядре и ацетилкарнитина. Для вывода об ацетилировании нужны сведения об этих путях и о содержании ацетил-CoA в нужном компартменте, а не только о митохондриях."],"conditions":"Схема качественная: числа не заданы, состояния показывают направление сдвига при прочих равных. Данные об ACLY и ацетате получены на клетках HCT116 (Wellen и соавт., 2009) и на фибробластах мыши MEF (Zhao и соавт., 2016), об ACSS2 — на нейрональных клетках CAD и нейронах мыши (Mews и соавт., 2017), о ядерном ацетил-CoA — на модели дифференцировки адипоцитов (Trefely и соавт., 2022). Ацетилкарнитиновый путь показан на схеме пунктиром, его вклад в клетках с ACLY мал (данные получены на мышиных клетках карциномы печени: Izzo и соавт., 2023). Ядерный пируватдегидрогеназный комплекс (Sutendra и соавт., 2014) на схеме не показан. Объединение пулов ядра и цитозоля в одну стрелку обмена — упрощение.","sources":["LNR2","WELLEN","MEWS","SIVANAND","ZHAO","SUTENDRA","TREFELY","IZZO"],"quiz":{"id":"S8-L15","rev":2,"question":"Содержание ацетил-CoA в митохондриях увеличилось. Почему из этого нельзя автоматически заключить об усилении ацетилирования гистонов?","options":[{"id":"S8-L15-1","text":"Доступность ядерно-цитозольного субстрата зависит от переноса предшественников и локального синтеза.","correct":true,"feedback":"Внутренняя митохондриальная мембрана разделяет пулы ацетил-CoA; они связаны переносом предшественников (цитрат, ацетилкарнитин), а не самого ацетил-CoA."},{"id":"S8-L15-2","text":"Гистонацетилтрансферазы используют не ацетил-CoA, а свободный ацетат как донор ацетильной группы.","correct":false,"feedback":"Гистонацетилтрансферазы переносят ацетильную группу именно с ацетил-CoA; ацетат служит лишь одним из его предшественников."},{"id":"S8-L15-3","text":"Ацетил-CoA матрикса переносится через внутреннюю мембрану специальным переносчиком и попадает в ядро.","correct":false,"feedback":"Внутренняя мембрана не пропускает ацетил-CoA: ацетильные группы покидают матрикс в составе цитрата или ацетилкарнитина."}]},"widget":{"kind":"net","title":"","s":{"title":"Откуда берётся ацетил-CoA для HAT","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"mit","type":"group","label":"Образование ацетил-CoA в митохондриях","opts":["обычное","усилено"]},{"id":"exp","type":"group","label":"Выход цитрата и ACLY","opts":["работают","ограничены"]},{"id":"ace","type":"group","label":"Ацетат в среде","opts":["нет","в избытке"]}],"W":640,"H":360,"NW":340,"NH":690,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пункт {"a":[161,178,206,94],"b":[262,178,62,276],"k":"tr","t":"ацетилкарнитин\n(CrAT)","tn":"CrAT","d":[0,30],"dn":[-30,-44],"bend":34,"bn":-48,"dash":true}},"st":{"0-0-0":{"n":{"m_ac":"base","m_cit":"base","c_cit":"base","c_acet":"off","c_ac":"base","n_ac":"base","n_mark":"base"},"e":{"exp":"on","acly":"on","acss":"off","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Исходное состояние: цитрат выходит из митохондрий, ACLY образует ацетил-CoA в цитозоле и ядре, и этот ацетил-CoA служит субстратом HAT. Ацетил-CoA матрикса через внутреннюю мембрану не проходит. Дополнительный путь через ацетилкарнитин (CrAT) показан пунктиром; в клетках с ACLY его вклад мал.","bars":[["Ацетил-CoA в митохондриях",2],["Ацетил-CoA в ядре и цитозоле",2],["Ацетилирование гистонов при прочих равных",2]]},"0-0-1":{"n":{"m_ac":"base","m_cit":"base","c_cit":"base","c_acet":"met","c_ac":"on","n_ac":"on","n_mark":"on"},"e":{"exp":"on","acly":"on","acss":"on","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Ацетат в избытке: ACSS2 образует из него ацетил-CoA, используя CoA и ATP, и ядерно-цитозольный ацетил-CoA дополнительно возрастает. Путь через цитрат при этом не ограничен.","bars":[["Ацетил-CoA в митохондриях",2],["Ацетил-CoA в ядре и цитозоле",3],["Ацетилирование гистонов при прочих равных",3]]},"0-1-0":{"n":{"m_ac":"base","m_cit":"base","c_cit":"low","c_acet":"off","c_ac":"low","n_ac":"low","n_mark":"low"},"e":{"exp":"off","acly":"off","acss":"off","noent":"off","carn":"on","exch":"on","loc":"off","hat":"on"},"note":"Выход цитрата или ACLY ограничены: поступление ацетильных групп по этому пути снижено, хотя содержание ацетил-CoA в митохондриях прежнее. Ядерно-цитозольный пул ацетил-CoA уменьшается, но не до нуля: насколько, зависит от других источников, например ацетилкарнитинового пути. Ацетилирование гистонов при этом снижается; так было в клетках HCT116 со сниженным ACLY (Wellen и соавт., 2009).","bars":[["Ацетил-CoA в митохондриях",2],["Ацетил-CoA в ядре и цитозоле",1],["Ацетилирование гистонов при прочих равных",1]]},"0-1-1":{"n":{"m_ac":"base","m_cit":"base","c_cit":"low","c_acet":"met","c_ac":"base","n_ac":"base","n_mark":"base"},"e":{"exp":"off","acly":"off","acss":"on","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Путь через цитрат ограничен, но ACSS2 образует ацетил-CoA из избытка ацетата, и ядерно-цитозольный пул пополняется. В клетках HCT116 со сниженным ACLY сверхфизиологические концентрации ацетата возвращали ацетилирование гистонов (Wellen и соавт., 2009); в клетках MEF без ACLY ацетат в концентрации 100 мкМ поддерживал выживание, но ацетилирование не возвращал, а при 1 мМ ацетилирование повышалось (Zhao и соавт., 2016).","bars":[["Ацетил-CoA в митохондриях",2],["Ацетил-CoA в ядре и цитозоле",2],["Ацетилирование гистонов при прочих равных",2]]},"1-0-0":{"n":{"m_ac":"on","m_cit":"on","c_cit":"on","c_acet":"off","c_ac":"on","n_ac":"on","n_mark":"on"},"e":{"exp":"on","acly":"on","acss":"off","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Ацетил-CoA и цитрата в митохондриях больше. Цитрат выходит в цитозоль, ACLY образует больше ядерно-цитозольного ацетил-CoA, и ацетилирование гистонов может возрасти. Значение имеет путь через цитрат, а не содержание ацетил-CoA в матриксе.","bars":[["Ацетил-CoA в митохондриях",3],["Ацетил-CoA в ядре и цитозоле",3],["Ацетилирование гистонов при прочих равных",3]]},"1-0-1":{"n":{"m_ac":"on","m_cit":"on","c_cit":"on","c_acet":"met","c_ac":"on","n_ac":"on","n_mark":"on"},"e":{"exp":"on","acly":"on","acss":"on","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Усилен путь через цитрат, и добавлен ацетат: ядерно-цитозольного ацетил-CoA достаточно для HAT.","bars":[["Ацетил-CoA в митохондриях",3],["Ацетил-CoA в ядре и цитозоле",3],["Ацетилирование гистонов при прочих равных",3]]},"1-1-0":{"n":{"m_ac":"on","m_cit":"on","c_cit":"low","c_acet":"off","c_ac":"low","n_ac":"low","n_mark":"low"},"e":{"exp":"off","acly":"off","acss":"off","noent":"off","carn":"on","exch":"on","loc":"off","hat":"on"},"note":"В митохондриях ацетил-CoA и цитрата больше, но выход цитрата или ACLY ограничены. Поступление ацетильных групп через цитрат снижено, поэтому рост митохондриального пула не приводит к росту ацетилирования гистонов; ядерно-цитозольный пул и ацетилирование уменьшаются в той мере, в какой их не восполняют другие источники.","bars":[["Ацетил-CoA в митохондриях",3],["Ацетил-CoA в ядре и цитозоле",1],["Ацетилирование гистонов при прочих равных",1]]},"1-1-1":{"n":{"m_ac":"on","m_cit":"on","c_cit":"low","c_acet":"met","c_ac":"base","n_ac":"base","n_mark":"base"},"e":{"exp":"off","acly":"off","acss":"on","noent":"off","carn":"on","exch":"on","loc":"on","hat":"on"},"note":"Выход цитрата или ACLY ограничены при усиленном образовании ацетил-CoA в митохондриях. Ацетат через ACSS2 пополняет ядерно-цитозольный пул; избыток ацетил-CoA в митохондриях влияет на него не напрямую, поскольку ацетил-CoA мембрану не пересекает, а только через цитрат или ацетилкарнитин.","bars":[["Ацетил-CoA в митохондриях",3],["Ацетил-CoA в ядре и цитозоле",2],["Ацетилирование гистонов при прочих равных",2]]}},"notes_svg":[{"x":211,"y":150,"t":"не проходит","a":"middle","n":[124,194],"tn":"не проходит"}]}}},{"id":"acetylation-balance","number":16,"section":2,"title":"Как устанавливается и удаляется ацетилирование гистонов","question":3,"questions":[3],"keywords":["ацетилирование гистонов","HAT","KAT","HDAC","сиртуины","NAD⁺","ацетил-лизин","деацетилирование","H3K9ac"],"lead":["[[T47|Гистонацетилтрансфераза]] переносит ацетильную группу с ацетил-CoA на остаток лизина, а деацетилазы — [[T48|HDAC]] и [[T49|сиртуины]] — её удаляют.","Поэтому доля ацетилированных сайтов определяется соотношением скоростей этих реакций, а не только количеством субстрата."],"mechanism":["Гистонацетилтрансфераза переносит ацетильную группу с ацетил-CoA на ε-аминогруппу лизина: образуются ацетил-лизин и CoA, а положительный заряд боковой группы нейтрализуется.","HDAC — Zn²⁺-зависимые ферменты, которые гидролизуют амидную связь ацетил-лизина; сиртуины катализируют другую реакцию, для которой необходим NAD⁺.","Доля ацетилированных сайтов при постоянстве условий определяется соотношением скоростей присоединения и удаления ацетильной группы и обновлением гистонов."],"paragraphs":["Ацетилирование гистона — перенос ацетильной группы с ацетил-CoA на ε-аминогруппу лизина. Реакцию катализирует гистонацетилтрансфераза (HAT, или KAT); кроме ацетил-лизина, образуется свободный CoA. Боковая группа лизина NH₃⁺ несёт положительный заряд, а ацетилированная боковая группа NH–CO–CH₃ заряда не имеет; потеря заряда может менять взаимодействие гистона с ДНК. Кроме того, ацетилированные остатки узнают особые белки, например белки с бромодоменами.","Удаляют ацетильную группу деацетилазы двух химических типов. Классические HDAC (классы I, II и IV; в этом шаге под HDAC понимают именно их) — Zn²⁺-зависимые ферменты: они гидролизуют амидную связь и освобождают ацетат (Seto и Yoshida, 2014). Сиртуины (по номенклатуре — класс III) катализируют другую реакцию: ацетильная группа переносится на ADP-рибозу, а из NAD⁺ образуется никотинамид. Поэтому активность сиртуинов зависит от доступности NAD⁺ в соответствующем компартменте и от их сродства к NAD⁺ (см. шаг про отношение NADH/NAD⁺), а HDAC в NAD⁺ не нуждаются. Не все сиртуины действуют на гистоны: SIRT6 деацетилирует [[T54|H3K9ac]] в теломерном хроматине (Michishita и соавт., 2008), а многие другие сиртуины действуют на негистоновые белки.","Доля ацетилированных сайтов зависит от нескольких реакций сразу. Пусть сайт ацетилируется с константой скорости k₁, в которую входит доступность ацетил-CoA, и деацетилируется с константой k₂ (обе константы псевдопервого порядка и постоянны). Тогда в стационарном состоянии доля ацетилированных сайтов равна k₁/(k₁ + k₂): она растёт и при ускорении присоединения, и при замедлении удаления. В клетках HCT116 ингибитор HDAC трихостатин A подавлял снижение ацетилирования гистонов, вызванное уменьшением количества ACLY (Wellen и соавт., 2009): когда удаление ацетильных групп замедлено, нехватка ацетил-CoA меньше влияет на ацетилирование.","Кроме того, гистоны обновляются: при репликации ДНК к родительским гистонам добавляются новые. По данным Alabert и соавт. (2015), модификации новых гистонов в основном устанавливались в течение одного клеточного цикла, а H3K9me3 и H3K27me3 — дольше; эти данные относятся главным образом к метилированию, и переносить их на ацетилирование без отдельной проверки нельзя. Итак, рост доли ацетилированных сайтов сам по себе не доказывает усиления присоединения ацетила: он мог возникнуть при ослаблении удаления. Нельзя также считать ацетилирование сигналом активации всех генов: связь метки с транскрипцией зависит от локуса."],"trap":["Если доля ацетилированных сайтов гистона возросла, то гистонацетилтрансфераза стала работать быстрее.","Доля ацетилированных сайтов зависит от присоединения, удаления и обновления гистонов. Тот же результат даёт замедление удаления при неизменном присоединении, например при подавлении HDAC."],"conditions":"Схема качественная: числа не заданы, направление изменения указано для одного сайта при прочих равных. Если изменены и присоединение, и удаление, итог зависит от величины сдвигов и на схеме показан как неопределяемый. Влияние ACLY и ингибитора HDAC описано на клетках HCT116 (Wellen и соавт., 2009), деацетилирование H3K9 сиртуином SIRT6 — на теломерном хроматине человека (Michishita и соавт., 2008), обновление гистонов — на культивируемых клетках человека, главным образом для метилирования (Alabert и соавт., 2015).","sources":["WELLEN","SETO","MICHISHITA","ALABERT"],"quiz":{"id":"S8-L16","rev":2,"question":"Скорость ацетилирования гистона сохранена, а скорость удаления ацетильной группы снижена. Как при прочих равных изменится доля ацетилированных сайтов?","options":[{"id":"S8-L16-1","text":"Возрастёт, поскольку баланс присоединения и удаления ацетила сместится.","correct":true,"feedback":"Накопление модификации возможно и без ускорения присоединения: достаточно замедлить удаление."},{"id":"S8-L16-2","text":"Снизится, поскольку избыток ацетилированных сайтов тормозит присоединение ацетила.","correct":false,"feedback":"По условию скорость присоединения сохранена; замедление удаления увеличивает, а не уменьшает долю ацетилированных сайтов."},{"id":"S8-L16-3","text":"Не изменится, поскольку доля определяется скоростью присоединения ацетила.","correct":false,"feedback":"Доля зависит и от удаления ацетильной группы, и от обновления гистонов."}]},"widget":{"kind":"net","title":"","s":{"title":"Присоединение и удаление ацетильной группы у гистона","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"add","type":"group","label":"Присоединение ацетила (HAT/KAT)","opts":["сохранено","снижено"]},{"id":"rem","type":"group","label":"Удаление ацетила","opts":["сохранено","HDAC подавлены","мало NAD⁺ для сиртуинов"]}],"W":640,"H":360,"NW":340,"NH":450,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":150,"h":340,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,100]},{"x":166,"y":6,"w":468,"h":340,"c":"nuc","t":"ядро","lx":176,"ly":24,"n":[4,112,332,330]}],"mem":[],"nodes":{"ac_coa":{"p":[81,76,120,40],"t":"ацетил-CoA","n":[170,62,120,40]},"lys":{"p":[250,170,130,50],"t":"лизин гистона\n(–NH₃⁺)","n":[66,215,96,56],"fs":13,"tn":"лизин\n(–NH₃⁺)"},"aclys":{"p":[555,170,142,50],"t":"ацетил-лизин\n(–NH–CO–CH₃)","n":[274,215,112,56],"fs":13,"tn":"ацетил-\nлизин"},"nad":{"p":[397,318,90,38],"t":"NAD⁺","n":[170,392,90,38]}},"edges":{"hat":{"a":"lys","b":"aclys","k":"rx","t":"HAT/KAT","d":[0,-14],"dn":[0,-14]},"feed":{"a":"ac_coa","b":[430,170,166,213],"k":"rx"},"hdac":{"a":[535,197,292,245],"b":[262,197,94,245],"k":"rx","bend":-50,"bn":-50},"sirt":{"a":[590,197,322,245],"b":[208,197,38,245],"k":"rx","bend":-110,"bn":-150},"nadf":{"a":"nad","b":[397,252,170,320],"k":"rx"}},"st":{"0-0":{"n":{"ac_coa":"base","nad":"base","aclys":"base"},"e":{"hat":"on","hdac":"on","sirt":"on","feed":"on","nadf":"on"},"note":"Присоединение и удаление ацетильной группы сохранены; доля ацетилированных сайтов принята за исходную.","bars":[["Присоединение ацетила (HAT/KAT)",2],["Удаление: HDAC",2],["Удаление: сиртуины",2],["Доля ацетилированных сайтов",2]]},"0-1":{"n":{"ac_coa":"base","nad":"base","aclys":"on"},"e":{"hat":"on","hdac":"off","sirt":"on","feed":"on","nadf":"on"},"note":"HDAC подавлены, присоединение сохранено: удаление ацетила замедлено, и доля ацетилированных сайтов возрастает, хотя скорость присоединения не изменилась.","bars":[["Присоединение ацетила (HAT/KAT)",2],["Удаление: HDAC",1],["Удаление: сиртуины",2],["Доля ацетилированных сайтов",3]]},"0-2":{"n":{"ac_coa":"base","nad":"low","aclys":"on"},"e":{"hat":"on","hdac":"on","sirt":"off","feed":"on","nadf":"on"},"note":"Содержание NAD⁺ снижено, поэтому сиртуины могут деацетилировать медленнее (это зависит от их сродства к NAD⁺); при сохранённых HAT и HDAC доля ацетилированных сайтов возрастает на сайтах, где действуют сиртуины.","bars":[["Присоединение ацетила (HAT/KAT)",2],["Удаление: HDAC",2],["Удаление: сиртуины",1],["Доля ацетилированных сайтов",3]]},"1-0":{"n":{"ac_coa":"low","nad":"base","aclys":"low"},"e":{"hat":"off","hdac":"on","sirt":"on","feed":"off","nadf":"on"},"note":"Присоединение снижено, удаление сохранено: доля ацетилированных сайтов снижается.","bars":[["Присоединение ацетила (HAT/KAT)",1],["Удаление: HDAC",2],["Удаление: сиртуины",2],["Доля ацетилированных сайтов",1]]},"1-1":{"n":{"ac_coa":"low","nad":"base","aclys":"base"},"e":{"hat":"off","hdac":"off","sirt":"on","feed":"off","nadf":"on"},"note":"Снижены и присоединение, и удаление: итог зависит от величины каждого сдвига, и без количественных данных направление изменения не определяется.","bars":[["Присоединение ацетила (HAT/KAT)",1],["Удаление: HDAC",1],["Удаление: сиртуины",2],["Доля ацетилированных сайтов",-1]]},"1-2":{"n":{"ac_coa":"low","nad":"low","aclys":"base"},"e":{"hat":"off","hdac":"on","sirt":"off","feed":"off","nadf":"on"},"note":"Снижены и присоединение, и удаление на сайтах сиртуинов: итог зависит от величины каждого сдвига, и без количественных данных направление изменения не определяется.","bars":[["Присоединение ацетила (HAT/KAT)",1],["Удаление: HDAC",2],["Удаление: сиртуины",1],["Доля ацетилированных сайтов",-1]]}},"notes_svg":[{"x":399,"y":189,"t":"присоединение снижено","a":"middle","n":[166,236],"tn":"снижено","only":["1-0","1-1","1-2"]},{"x":398,"y":241,"t":"HDAC (Zn²⁺)","a":"middle","n":[193,296],"only":["0-0","0-2","1-0","1-2"]},{"x":398,"y":241,"t":"HDAC подавлены","a":"middle","n":[193,296],"only":["0-1","1-1"]},{"x":300,"y":264,"t":"сиртуин","a":"middle","n":[250,338],"only":["0-0","0-1","1-0","1-1"]},{"x":300,"y":266,"t":"сиртуин: мало NAD⁺","a":"middle","n":[96,338],"only":["0-2","1-2"]}]}}},{"id":"sam-sah","number":17,"section":2,"title":"Как обмен метионина связан с переносом метильных групп","question":3,"questions":[3],"keywords":["SAM","SAH","метионин","MAT","метилтрансфераза","ингибирование продуктом","метиониновый цикл","гомоцистеин","фолаты"],"lead":["[[T50|S-аденозилметионин]] (SAM) образуется из метионина и ATP ферментом [[T52|MAT]] и служит донором метильной группы для [[T53|метилтрансфераз]].","После переноса метильной группы остаётся [[T51|S-аденозилгомоцистеин]] (SAH), который может тормозить метилтрансферазу."],"mechanism":["MAT присоединяет аденозильную группу ATP к атому серы метионина и образует SAM; из ATP при этом освобождаются фосфат и пирофосфат.","Метилтрансфераза переносит метильную группу с SAM на субстрат, например на лизин гистона; SAM превращается в SAH, который у многих метилтрансфераз связывается в активном центре и конкурирует с SAM.","SAH гидролизуется до гомоцистеина и аденозина, а гомоцистеин превращается в метионин: метионинсинтазой (кофермент — производное витамина B₁₂, донор метильной группы — 5-метилтетрагидрофолат) или, в печени и почках, бетаин-гомоцистеин-метилтрансферазой."],"paragraphs":["Метионин служит источником метильных групп не сам по себе, а после активации. Метионинаденозилтрансфераза (MAT) переносит аденозильную группу ATP на атом серы метионина и образует SAM — соединение с сульфониевым центром, легко отдающее метильную группу. SAM служит донором метильной группы при метилировании гистонов, ДНК, РНК и малых молекул; по обзору Ducker и Rabinowitz (2017), среди используемых ферментами молекул SAM по распространённости уступает только ATP.","Метилтрансфераза катализирует реакцию: SAM + субстрат → SAH + метилированный субстрат. У многих метилтрансфераз SAH связывается в активном центре и конкурирует с SAM, поэтому скорость метилирования зависит и от содержания SAM, и от содержания SAH. SAH гидролизуется аденозилгомоцистеиназой (AHCY) до гомоцистеина и аденозина; реакция обратима, поэтому при накоплении гомоцистеина и аденозина растёт и содержание SAH. Гомоцистеин превращается в метионин метионинсинтазой (MTR): её кофермент, производное витамина B₁₂, принимает метильную группу от 5-метилтетрагидрофолата (5-метил-ТГФ), а в печени и почках гомоцистеин метилирует также бетаин-гомоцистеин-метилтрансфераза (BHMT), для которой донором служит бетаин. Так метиониновый цикл связан с обменом фолатов; метильные группы 5-метил-ТГФ происходят из одноуглеродного обмена (см. шаг про поступление углерода глюкозы в биосинтез), но выраженность этой связи зависит от клеток и условий. Метилирование цитозина в ДНК (образование 5mC) катализируют ДНК-метилтрансферазы (DNMT), также использующие SAM; окисление 5mC — в шаге про диоксигеназы.","SAM можно рассматривать двояко. Как [[T57|косубстрат]] конкретной реакции он расходуется в каждом каталитическом цикле, и скорость реакции зависит от его концентрации вблизи фермента. Под «метильным пулом» клетки понимают суммарное содержание SAM; оно зависит от синтеза SAM из метионина, от его расхода в реакциях метилирования и от реметилирования гомоцистеина. Изменение суммарного содержания SAM неодинаково сказывается на разных реакциях, потому что ферменты различаются по сродству к SAM и по чувствительности к SAH.","В клетках HCT116 при снижении концентрации метионина в среде до 3 мкМ в течение 24 ч уменьшалось содержание и SAM, и SAH, а метилирование гистона H3 по нескольким лизинам снижалось; после возвращения метионина метилирование возвращалось к исходному уровню (Mentch и соавт., 2015). Отношение SAM/SAH не служит универсальным порогом: значение имеют концентрации SAM и SAH, их локализация и свойства фермента."],"trap":["Пока SAM доступен, метилтрансфераза работает с прежней скоростью.","Продукт реакции SAH связывается с метилтрансферазой и конкурирует с SAM при сохранённом содержании SAM. Скорость зависит от концентраций SAM и SAH вблизи фермента и от его свойств, а не только от содержания SAM."],"conditions":"Схема качественная: концентраций и числовых порогов на ней нет. Зависимость метилирования гистонов от метионина, SAM и SAH показана на клетках HCT116 и в печени мышей на диете с ограничением метионина, где снижались SAM, SAH и H3K4me3 при неизменном содержании метионина в печени (Mentch и соавт., 2015); для других клеток и ферментов она может быть иной. Компартменты показаны условно: в цитируемой работе измерено содержание в клетке целиком.","sources":["MENTCH","LNR2","DUCKER"],"quiz":{"id":"S8-L17","rev":2,"question":"Содержание SAM остаётся прежним, а SAH в ядре накапливается. Как при прочих равных изменится скорость метилирования лизина гистона метилтрансферазой, чувствительной к SAH?","options":[{"id":"S8-L17-2","text":"Скорость возрастёт, поскольку SAH служит вторым донором метильной группы.","correct":false,"feedback":"В этой реакции донор — SAM, а SAH является продуктом."},{"id":"S8-L17-3","text":"Скорость не изменится, поскольку содержание SAM осталось прежним.","correct":false,"feedback":"SAH конкурирует с SAM за активный центр, поэтому скорость снижается и при прежнем содержании SAM."},{"id":"S8-L17-1","text":"Скорость снизится, поскольку фермент тормозится продуктом реакции — SAH.","correct":true,"feedback":"Сохранение донора метильной группы не устраняет действие SAH."}]},"widget":{"kind":"net","title":"","s":{"title":"Метиониновый цикл и метилтрансфераза","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"met","type":"group","label":"Метионин","opts":["достаточно","ограничен"]},{"id":"sah","type":"group","label":"Отведение SAH","opts":["работает","ограничено"]}],"W":640,"H":360,"NW":340,"NH":640,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":398,"h":340,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,300]},{"x":414,"y":6,"w":220,"h":340,"c":"nuc","t":"ядро","lx":424,"ly":24,"n":[4,314,332,316]}],"mem":[],"nodes":{"met":{"p":[75,70,100,40],"t":"метионин","n":[80,62,100,38]},"sam":{"p":[310,178,80,40],"t":"SAM","n":[268,62,80,38]},"sah":{"p":[310,290,80,40],"t":"SAH","n":[80,270,80,38]},"hcy":{"p":[75,290,128,40],"t":"гомоцистеин","n":[80,170,128,38]},"thf":{"p":[205,178,110,36],"t":"5-метил-ТГФ","n":[196,116,110,36],"fs":13},"sub":{"p":[522,70,130,44],"t":"лизин гистона","n":[80,400,126,40],"fs":13},"mt":{"p":[522,178,152,48],"t":"метилтрансфераза","n":[250,500,152,44],"fs":13},"msub":{"p":[522,290,130,44],"t":"метил-лизин\nгистона","n":[80,590,126,44],"fs":13}},"edges":{"mat":{"a":"met","b":"sam","k":"rx","t":"MAT\n+ ATP","d":[-48,-12],"dn":[0,-26]},"give":{"a":"sam","b":"mt","k":"rx","t":"CH₃-группа","tn":"CH₃","d":[0,-12],"dn":[-15,0]},"prod":{"a":[470,204,224,480],"b":[352,284,125,291],"k":"rx","t":"SAH","d":[26,14],"dn":[36,0]},"ahcy":{"a":"sah","b":"hcy","k":"rx","t":"AHCY","d":[0,-12],"dn":[30,0]},"mtr":{"a":"hcy","b":"met","k":"rx","t":"MTR (B₁₂)\nBHMT","tn":"MTR, BHMT","d":[-4,0],"dn":[48,0]},"feed":{"a":"thf","b":[77,178,82,116],"k":"rx"},"inh":{"a":[338,268,95,291],"b":[446,194,194,480],"k":"inh","t":"тормозит","d":[-30,-6],"dn":[-44,0]},"s1":{"a":"sub","b":[522,154,176,500],"k":"rx"},"s2":{"a":"mt","b":"msub","k":"rx"}},"st":{"0-0":{"n":{"met":"base","sam":"on","sah":"base","hcy":"base","mt":"on","msub":"on"},"e":{"mat":"on","ahcy":"on","mtr":"on","inh":"hide","give":"on","prod":"on","s1":"on","s2":"on","feed":"on"},"note":"Метионина достаточно, SAH удаляется: SAM доступен, метилтрансфераза переносит метильные группы, а SAH превращается в гомоцистеин.","bars":[["SAM вблизи фермента",2],["SAH вблизи фермента",1],["Скорость метилирования субстрата",2]]},"0-1":{"n":{"met":"base","sam":"on","sah":"on","hcy":"low","mt":"low","msub":"low"},"e":{"mat":"on","ahcy":"off","mtr":"off","inh":"on","give":"on","prod":"on","s1":"on","s2":"off","feed":"off"},"note":"SAM доступен, но SAH удаляется медленно и накапливается: он связывается с метилтрансферазой и конкурирует с SAM, поэтому реакция идёт медленнее при неизменном содержании SAM.","bars":[["SAM вблизи фермента",2],["SAH вблизи фермента",3],["Скорость метилирования субстрата",1]]},"1-0":{"n":{"met":"low","sam":"low","sah":"base","hcy":"base","mt":"low","msub":"low"},"e":{"mat":"off","ahcy":"on","mtr":"on","inh":"hide","give":"on","prod":"on","s1":"on","s2":"off","feed":"on"},"note":"Метионина мало, поэтому SAM образуется медленнее и скорость метилирования снижается. Изменение SAH зависит от особенностей метионинового цикла в данных клетках.","bars":[["SAM вблизи фермента",1],["SAH вблизи фермента",1],["Скорость метилирования субстрата",1]]},"1-1":{"n":{"met":"low","sam":"low","sah":"on","hcy":"low","mt":"low","msub":"low"},"e":{"mat":"off","ahcy":"off","mtr":"off","inh":"on","give":"on","prod":"on","s1":"on","s2":"off","feed":"off"},"note":"Мало SAM и накапливается SAH: метилтрансферазе доступно меньше донора метильной группы, и она тормозится продуктом, поэтому скорость метилирования снижена. Это сочетание двух независимых воздействий, показанное качественно; в опыте Mentch и соавт. при ограничении метионина снижались и SAM, и SAH.","bars":[["SAM вблизи фермента",1],["SAH вблизи фермента",3],["Скорость метилирования субстрата",1]]}}}}},{"id":"site-specific-methylation","number":18,"section":2,"title":"Почему разные модификации гистонов изменяются неодинаково","question":3,"questions":[3],"keywords":["H3K4me3","H3K9me3","степень метилирования","метилтрансфераза","деметилаза","KMT2","KDM4","JmjC","баланс скоростей"],"lead":["Запись [[T55|H3K4me3]] означает гистон H3, лизин в положении 4 и три метильные группы; для [[T56|H3K9me3]] это лизин в положении 9.","Эти метки устанавливают и удаляют разные ферменты, поэтому при ограничении общего донора (SAM) их содержание может изменяться неодинаково."],"mechanism":["Метилтрансферазы KMT2 (для H3K4) и KMT1A/B (для H3K9) переносят метильные группы с SAM на лизин; у каждой метки свои ферменты установления.","Деметилазы JmjC KDM5 (для H3K4me3) и KDM4 (для H3K9me3 и H3K9me2) снижают степень метилирования на одну ступень; для этого им нужны α-КГ, O₂ и Fe(II), а не SAM.","Доля сайтов с меткой в области генома определяется балансом скоростей установления и удаления метки, а также обновлением нуклеосом; SAM нужен для установления метки, но не для её удаления деметилазами JmjC."],"paragraphs":["H3K4me3 сильно обогащена вблизи старта транскрипции и найдена как на активных, так и на неактивных промоторах, в том числе у генов, которые могут активироваться (Black и соавт., 2012). H3K9me3 характерна для ряда областей гетерохроматина. Эти ассоциации не означают, что метка сама достаточна для активации или репрессии гена.","У этих меток разные ферменты. KMT1A и KMT1B (SUV39H1/2) триметилируют H3K9 из состояния H3K9me1. Очищенная KMT2A (MLL1) образует H3K4me2, а в комплексе со своими партнёрами триметилирует H3K4; H3K4me3 в клетках создают и комплексы с SETD1A/B (Wu и соавт., 2008). Удаляют метки деметилазы JmjC: KDM4 снимает H3K9me3 и H3K9me2, но не H3K9me1, а деметилазы KDM5 снимают H3K4me3 (Klose и соавт., 2007). FAD-зависимая LSD1 (KDM1A) к JmjC не относится и удаляет метильные группы с H3K4me2 и H3K4me1 (Black и соавт., 2012); в комплексе с рецептором андрогенов она действует на H3K9me1 и H3K9me2, но не на H3K9me3 (Metzger и соавт., 2005). Метилтрансферазы, о которых идёт речь, используют SAM, а деметилазы JmjC — α-КГ (см. шаг про диоксигеназы).","Скорость установления метки зависит от сродства фермента к SAM, от торможения продуктом SAH и от доступа к нужному участку хроматина. Скорость удаления зависит от деметилазы и её косубстратов, а на долю метки влияют также обновление нуклеосом и репликация. Поэтому уменьшение содержания общего донора метильных групп не приводит к одинаковому снижению разных меток.","В клетках HCT116 при ограничении метионина (24 ч) снижалось триметилирование лизинов 4, 9 и 27 гистона H3, и наибольшим было снижение H3K4me3. Оно проявлялось уже при 10–25 мкМ метионина, когда изменялись содержание SAM и SAH (Mentch и соавт., 2015); наиболее сильное ограничение (3 мкМ) приведено в шаге про метиониновый цикл. Снижение H3K4me3 при ограничении метионина наблюдали в каждой из шести проверенных линий. Авторы допускают, что чувствительность определяют кинетические свойства метилтрансфераз, в частности сродство к SAM, но причина большего снижения H3K4me3 в работе не установлена."],"trap":["Если H3K4me3 снизилась сильнее других меток, то так будет в любых клетках, и причина состоит в меньшей стабильности этой метки.","Относительная чувствительность показана в конкретных условиях. Её причина в работе не установлена: возможны разные объяснения, и каждое требует отдельной проверки; без отдельной проверки переносить результат на другие клетки и метки нельзя."],"conditions":"Схема качественная; различие параметров ферментов принято в ней как допущение, чтобы показать механизм. Данные о метионине получены на клетках человека при ограничении метионина в среде на 24 ч (Mentch и соавт., 2015). Связь метки с активностью генов ассоциативна.","sources":["MENTCH","BLACK","METZGER","KLOSE","WU"],"quiz":{"id":"S8-L18","rev":2,"question":"После ограничения метионина H3K4me3 уменьшилась сильнее H3K9me3. Какой механизм допускает такой результат?","options":[{"id":"S8-L18-2","text":"Обе метки изменяются одинаково, поскольку метилтрансферазам обеих нужен SAM.","correct":false,"feedback":"Общий донор не устраняет различия ферментов и скоростей удаления."},{"id":"S8-L18-1","text":"Различаются кинетика ферментов этих меток и скорость обновления самих меток.","correct":true,"feedback":"Общий метаболит может по-разному ограничивать разные реакции."},{"id":"S8-L18-3","text":"Деметилазы JmjC используют SAM, поэтому удаление H3K4me3 зависит от него сильнее.","correct":false,"feedback":"Деметилазы JmjC используют α-КГ, O₂ и Fe(II), а не SAM."}]},"widget":{"kind":"net","title":"","s":{"title":"Один донор SAM, две метки","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"met","type":"group","label":"Метионин","opts":["достаточно","ограничен"]},{"id":"par","type":"group","label":"Параметры ферментов (допущение схемы)","opts":["одинаковые","различаются"]}],"W":640,"H":360,"NW":340,"NH":520,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":348,"c":"nuc","t":"ядро","lx":16,"ly":24,"n":[4,4,332,500]},{"x":16,"y":36,"w":268,"h":308,"c":"plain","t":"вблизи старта транскрипции","lx":26,"ly":56,"n":[100,30,232,214],"tn":"старт транскрипции"},{"x":356,"y":36,"w":268,"h":308,"c":"plain","t":"в областях гетерохроматина","lx":366,"ly":56,"n":[100,270,232,214],"tn":"гетерохроматин"}],"mem":[],"nodes":{"sam":{"p":[320,200,64,40],"t":"SAM","n":[52,253,64,40]},"k4a":{"p":[150,126,140,44],"t":"H3K4me1/me2","n":[230,112,132,44]},"k4b":{"p":[150,286,140,44],"t":"H3K4me3","n":[230,222,132,44]},"k9a":{"p":[490,126,140,44],"t":"H3K9me1/me2","n":[230,362,132,44]},"k9b":{"p":[490,286,140,44],"t":"H3K9me3","n":[230,472,132,44]}},"edges":{"w4":{"a":[196,150,170,136],"b":[196,262,170,198],"k":"rx","t":"KMT2\n(MLL)","tn":"KMT2","d":[34,36],"dn":[32,-14]},"r4":{"a":[104,262,266,198],"b":[104,150,266,136],"k":"rx","t":"KDM5\n(JmjC)","tn":"KDM5","d":[-38,0],"dn":[26,0]},"w9":{"a":[444,150,170,386],"b":[444,262,170,448],"k":"rx","t":"KMT1A/B\n(SUV39H1/2)","tn":"KMT1A/B","d":[-44,36],"dn":[34,18]},"r9":{"a":[536,262,266,448],"b":[536,150,266,386],"k":"rx","t":"KDM4\n(JmjC)","tn":"KDM4","d":[40,0],"dn":[26,0]},"m4":{"a":"sam","b":[200,206,170,167],"k":"rx","t":"CH₃","d":[0,-12],"dn":[-40,-10]},"m9":{"a":"sam","b":[440,206,170,417],"k":"rx","t":"CH₃","d":[0,-12],"dn":[-40,10]}},"st":{"0-0":{"n":{"sam":"base","k4b":"on","k9b":"on"},"e":{"w4":"on","r4":"on","w9":"on","r9":"on","m4":"on","m9":"on"},"note":"SAM достаточно: присоединение и удаление метильной группы для каждой метки сбалансированы, и содержание H3K4me3 и H3K9me3 принято за исходное.","bars":[["SAM в ядре",3],["Содержание H3K4me3 (относительно исходного)",3],["Содержание H3K9me3 (относительно исходного)",3]]},"0-1":{"n":{"sam":"base","k4b":"on","k9b":"on"},"e":{"w4":"on","r4":"on","w9":"on","r9":"on","m4":"on","m9":"on"},"note":"SAM достаточно: в исходном состоянии содержание каждой метки постоянно, так как скорости её установления и удаления равны; различие параметров ферментов этого не меняет.","bars":[["SAM в ядре",3],["Содержание H3K4me3 (относительно исходного)",3],["Содержание H3K9me3 (относительно исходного)",3]]},"1-0":{"n":{"sam":"low","k4b":"low","k9b":"low"},"e":{"w4":"on","r4":"on","w9":"on","r9":"on","m4":"on","m9":"on"},"note":"SAM ограничен, параметры ферментов приняты одинаковыми: присоединение метильных групп для обеих меток замедляется в равной мере, и обе метки снижаются одинаково.","bars":[["SAM в ядре",1],["Содержание H3K4me3 (относительно исходного)",2],["Содержание H3K9me3 (относительно исходного)",2]]},"1-1":{"n":{"sam":"low","k4b":"low","k9b":"low"},"e":{"w4":"on","r4":"on","w9":"on","r9":"on","m4":"on","m9":"on"},"note":"SAM ограничен, параметры ферментов различаются: установление H3K4me3 сильнее зависит от SAM, а H3K9me3 обновляется медленнее. Тогда H3K4me3 снижается заметнее. Это допущение схемы; причина различий в работе Mentch и соавт. не установлена.","bars":[["SAM в ядре",1],["Содержание H3K4me3 (относительно исходного)",1],["Содержание H3K9me3 (относительно исходного)",2]]}}}}},{"id":"dioxygenases","number":19,"section":2,"title":"Как α-кетоглутарат участвует в удалении метильных модификаций","question":3,"questions":[3],"keywords":["α-кетоглутарат","диоксигеназа","Fe(II)","JmjC","TET","5mC","5hmC","сукцинат","косубстрат"],"lead":["α-Кетоглутарат (α-КГ, 2-оксоглутарат) служит косубстратом Fe(II)- и O₂-зависимых диоксигеназ и в каждой реакции превращается в сукцинат и CO₂.","К этим ферментам относятся [[T58|JmjC-деметилазы]] гистонов и [[T59|белки TET]], окисляющие [[T60|5-метилцитозин]] (5mC) в ДНК."],"mechanism":["Диоксигеназа связывает Fe(II), α-КГ и субстрат; α-КГ декарбоксилируется до сукцината и CO₂, а один атом кислорода из O₂ переходит в субстрат.","JmjC-деметилаза окисляет метильную группу лизина, которая отщепляется в виде формальдегида; степень метилирования снижается на одну ступень, например с me3 до me2.","Белки TET окисляют 5mC до [[T61|5hmC]], затем до 5-формилцитозина (5fC) и 5-карбоксилцитозина (5caC); в клетках немодифицированный цитозин образуется прежде всего после вырезания основания с репарацией, а метка может убывать и при разбавлении репликацией."],"paragraphs":["У диоксигеназ три компонента, которые не следует смешивать. α-КГ и O₂ — косубстраты: в каждом цикле реакции они расходуются, и α-КГ превращается в сукцинат и CO₂. Fe(II) — кофактор: он удерживается в активном центре и не расходуется. Активность этих ферментов зависит от доступности α-КГ и O₂ в ядре, от содержания Fe(II) и от соединений, конкурирующих с α-КГ (см. шаг про нарушения SDH, FH и IDH). α-КГ — другое название 2-оксоглутарата; 2-гидроксиглутарат — другое соединение.","JmjC-деметилазы удаляют метильные группы лизинов гистонов окислением: метильная группа гидроксилируется и отщепляется в виде формальдегида. Степень метилирования при этом снижается на одну ступень: KDM4 переводит H3K9me3 в H3K9me2 и далее в H3K9me1, но H3K9me1 не удаляет (Black и соавт., 2012). Не все деметилазы гистонов относятся к семейству JmjC: FAD-зависимая LSD1 работает без α-КГ.","Белки TET окисляют 5mC последовательно: 5mC → 5hmC → 5fC → 5caC. Превращение 5mC в 5hmC белком TET1 показано в клетках и in vitro (Tahiliani и соавт., 2009), а окисление до 5fC и 5caC — на очищенных TET1–3 in vitro, в клетках с TET2 и в геноме эмбриональных стволовых клеток мыши (Ito и соавт., 2011). Ни одна из этих реакций не возвращает немодифицированный цитозин. Тимин-ДНК-гликозилаза (TDG) вырезает основания 5fC и 5caC, после чего эксцизионная репарация оснований (BER) вставляет на их место немодифицированный цитозин (He и соавт., 2011; Maiti и Drohat, 2011); прямое декарбоксилирование 5caC предполагали, но фермент не найден (Ito и соавт., 2011). Отдельный путь — пассивное разбавление при репликации: в новой цепи 5hmC и продукты его окисления не поддерживаются DNMT1-зависимым метилированием, и метка в дочерней ДНК убывает. Поэтому снижение содержания 5mC само по себе не доказывает работу TET."],"trap":["Одна реакция TET или JmjC полностью удаляет метку: метилированный лизин сразу становится лизином, а 5mC — цитозином.","JmjC-деметилаза снижает степень метилирования лизина на одну ступень. TET окисляет 5mC последовательно до 5hmC, 5fC и 5caC; цитозин образуется прежде всего после вырезания основания (TDG) и репарации либо при разбавлении метки репликацией."],"conditions":"Схема качественная: скорости и концентрации на ней не заданы. Окисление 5mC показано для TET1 в клетках и in vitro, для TET1–3 in vitro и в клетках с TET2 (Tahiliani и соавт., 2009; Ito и соавт., 2011); доли 5hmC, 5fC и 5caC в разных тканях различаются и здесь не рассматриваются.","sources":["BLACK","TAHILIANI","ITO","HE","MAITI"],"quiz":{"id":"S8-L19","rev":3,"question":"Активность TET снижена, а доступность 5mC, α-КГ, O₂ и Fe(II) не изменилась. Как изменится скорость образования 5hmC из 5mC?","options":[{"id":"S8-L19-2","text":"Не изменится: 5hmC образуется при метилировании цитозина без участия TET.","correct":false,"feedback":"Метилирование цитозина даёт 5mC, а 5hmC — продукт окисления 5mC."},{"id":"S8-L19-1","text":"Снизится, поскольку 5hmC образуется при окислении 5mC белками TET.","correct":true,"feedback":"При этих условиях снижение активности TET уменьшает скорость окисления 5mC до 5hmC. Содержание 5hmC зависит ещё от его дальнейшего окисления и разбавления при репликации."},{"id":"S8-L19-3","text":"Возрастёт, поскольку TET превращают 5hmC обратно в 5mC.","correct":false,"feedback":"TET окисляют 5mC и его производные; обратного превращения 5hmC в 5mC они не катализируют."}]},"widget":{"kind":"net","title":"","s":{"title":"Общие компоненты реакций α-КГ-зависимых диоксигеназ","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"tet","type":"group","label":"Активность TET","opts":["активны","снижены"]},{"id":"cof","type":"group","label":"α-КГ, O₂ и Fe(II)","opts":["достаточно","ограничены"]}],"W":640,"H":372,"NW":340,"NH":622,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"синтез новой цепи на родительской цепи (матрице)","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных этапов","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":112,"c":"plain","t":"TET: окисление 5mC в ДНК","lx":16,"ly":24,"n":[4,4,332,200]},{"x":6,"y":126,"w":628,"h":104,"c":"nuc","t":"общие компоненты реакций","lx":16,"ly":144,"n":[4,212,332,116]},{"x":6,"y":238,"w":300,"h":126,"c":"nuc","t":"JmjC-деметилазы","lx":16,"ly":256,"n":[4,336,332,126]},{"x":316,"y":238,"w":318,"h":126,"c":"plain","t":"репликация: пассивное разбавление метки","lx":326,"ly":256,"n":[4,470,332,136],"tn":"репликация: разбавление метки"}],"mem":[],"nodes":{"c5mC":{"p":[55,78,70,40],"t":"5mC","n":[50,76,70,40]},"c5hmC":{"p":[175,78,70,40],"t":"5hmC","n":[170,76,70,40]},"c5fC":{"p":[295,78,70,40],"t":"5fC","n":[290,76,70,40]},"c5caC":{"p":[415,78,70,40],"t":"5caC","n":[290,164,70,40]},"c0":{"p":[565,78,90,40],"t":"цитозин","n":[150,164,90,40]},"hub":{"p":[320,198,300,52],"t":"α-КГ + O₂ → сукцинат + CO₂\nFe(II) — кофактор, не расходуется","n":[170,284,300,54],"fs":13},"kme3":{"p":[60,312,100,46],"t":"лизин-me3","n":[65,408,100,46],"fs":13},"kme2":{"p":[248,312,100,46],"t":"лизин-me2","n":[275,408,100,46],"fs":13},"par":{"p":[392,300,140,46],"t":"родительская цепь\nс 5hmC или 5mC","n":[84,538,140,46],"fs":13},"new":{"p":[566,300,120,46],"t":"новая цепь\nс цитозином","n":[262,538,120,46],"fs":13}},"edges":{"t1":{"a":"c5mC","b":"c5hmC","k":"rx"},"t2":{"a":"c5hmC","b":"c5fC","k":"rx"},"t3":{"a":"c5fC","b":"c5caC","k":"rx"},"tdg":{"a":"c5caC","b":"c0","k":"rx","dash":true},"j":{"a":"kme3","b":"kme2","k":"rx"},"rep":{"a":"par","b":"new","k":"seq","dash":true},"f1":{"a":[262,173,60,257],"b":[235,86,110,82],"k":"bind"},"f2":{"a":[186,224,130,311],"b":[154,308,170,402],"k":"bind"}},"st":{"0-0":{"n":{"c5mC":"base","c5hmC":"base","c5fC":"base","c5caC":"base","c0":"base","hub":"base","kme3":"base","kme2":"base"},"e":{"t1":"on","t2":"on","t3":"on","tdg":"on","j":"on","rep":"on","f1":"on","f2":"on"},"note":"Косубстратов достаточно, TET активны: 5mC последовательно окисляется до 5hmC, 5fC и 5caC, а JmjC-деметилазы снижают степень метилирования лизина на одну ступень. Дальше возможны два пути: TDG вырезает 5fC и 5caC, а при репликации метка разбавляется, если поддерживающее метилирование не восстанавливает её в новой цепи.","bars":[["Окисление 5mC белками TET",3],["Деметилирование лизина JmjC",3]]},"0-1":{"n":{"c5mC":"on","c5hmC":"low","c5fC":"low","c5caC":"low","c0":"low","hub":"low","kme3":"on","kme2":"low"},"e":{"t1":"off","t2":"off","t3":"off","tdg":"on","j":"off","rep":"on","f1":"off","f2":"off"},"note":"α-КГ, O₂ или Fe(II) ограничены: реакции обоих семейств замедляются. Окисление 5mC и деметилирование лизина идут медленнее, и при прежнем присоединении метильных групп метилированных остатков лизина и 5mC становится больше.","bars":[["Окисление 5mC белками TET",2],["Деметилирование лизина JmjC",2]]},"1-0":{"n":{"c5mC":"on","c5hmC":"low","c5fC":"low","c5caC":"low","c0":"low","hub":"base","kme3":"base","kme2":"base"},"e":{"t1":"off","t2":"off","t3":"off","tdg":"on","j":"on","rep":"on","f1":"on","f2":"on"},"note":"Активность TET снижена, косубстратов д
