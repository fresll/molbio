<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 6 · Метилирование ДНК, регуляторные элементы и память — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-line:#B06E05; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --cyc:#2F5DA8; --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-line:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-line:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --cyc:#78A6EE; --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on-line);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl.locked{opacity:.55;position:relative}
.ctrl.locked::before{content:attr(data-lock);font-size:12.5px;color:var(--muted)}
[data-g]:focus-visible{outline:3px solid var(--on-line);outline-offset:2px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on-line)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on-line)}
.box.inh{fill:var(--surface-2);stroke:var(--off-ink);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* семинар 8: метаболические потоки */
.meter{position:relative}
.meter .tk{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.55;border-radius:1px}
.fmrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 2px}
.fm{margin:0;display:grid;gap:3px;justify-items:start;color:var(--ink)}
.fm figcaption{font-size:13px;color:var(--muted)} .fm figcaption b{color:var(--ink)}
.fm-s{color:var(--ink)}
.medium{fill:var(--surface-2)}
.matrix{fill:var(--mito-fill);stroke:none;opacity:.55}
.dot-nadh{fill:var(--ink)} .dot-nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
.dot-glc{fill:var(--on)} .dot-pyr{fill:var(--mtor)} .dot-lac{fill:var(--akt)}
.stub{fill:none;stroke:var(--off);stroke-width:1.6;stroke-dasharray:4 4}
.pool .nadh{fill:var(--ink)} .pool .nad{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.drugpill{fill:var(--bad)} .drugpill-t{fill:#fff;font-family:var(--f-body);font-weight:700;text-anchor:middle;dominant-baseline:central}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.res-grid{display:grid;gap:6px}

.meter{overflow:visible} .meter i{border-radius:5px}
.road{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
.halo{fill:none;stroke:var(--cyto);stroke-width:7}
.pool-fr{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.noxbox{fill:var(--good);stroke:none}
.medpill{fill:var(--surface);stroke:var(--on);stroke-width:2}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.mm .mt{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mm small{font-size:13px;line-height:1.2;color:var(--ink)}
.mm .v{font-family:var(--f-mono);font-size:14px;font-weight:600;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.legend .sw.line{display:inline-block}

.btn[hidden]{display:none!important}
.scene.wip .side > :not(.cap){display:none!important}
.scene.wip .cap .why{display:none}
.fm-s [class^="bond-"]{vector-effect:non-scaling-stroke;stroke-width:1.5px!important}

/* семинар 8: компактнее правая колонка (проектор 1280×720) */
.scene .ctrl{gap:8px} .scene input[type=range]{height:22px} .scene .slider{gap:0}
#capbox1a{order:-1} #poe1a{order:-2}
.tgrid .switch{font-size:14.5px;gap:8px}

/* семинар 8, вопрос 2: цикл трикарбоновых кислот */
.lv-tr{fill:var(--line)} .lv-f{fill:var(--mtor);transition:width .35s} .lv-f.fad{fill:var(--tfeb)}
.lv-tk{stroke:var(--ink);stroke-width:1.6;opacity:.75}
.dot-exit{fill:var(--carn)} .dot-cyc{fill:var(--cyc)} .dot-gln{fill:var(--aa)} .dot-fad{fill:var(--tfeb)}
.isr{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:end;margin-top:6px}
.isr > b{font-size:13px;padding-bottom:18px}
.isc{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.ic{display:grid;justify-items:center;gap:1px;min-width:34px}
.ic i{display:block;width:26px;background:var(--mtor);border-radius:3px 3px 0 0}
.ic i.z{background:var(--off)}
.ic em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.ic span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
#capbox2a{order:-1} #poe2a{order:-2}

/* вопрос 3: шкалы баланса, нуклеосома, метки */
.gbar{fill:var(--line)} .gfill{fill:var(--mtor);transition:width .35s} .gref{stroke:var(--ink);stroke-width:2;opacity:.6}
.dna{fill:none;stroke:var(--tfeb);stroke-width:7;opacity:.55} .octa{fill:var(--surface);stroke:var(--off-ink);stroke-width:2}
.tail{fill:none;stroke:var(--off-ink);stroke-width:5;stroke-linecap:round}
.ks{fill:var(--surface);stroke:var(--off-ink);stroke-width:2}
.k9c{fill:var(--line)} .mac{fill:var(--on)} .mme{fill:var(--cyc)} :root[data-theme="dark"] .mme{fill:#3E6FC0}
.cpg{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.edge.rem{stroke-dasharray:5 4} .edge.link{stroke-dasharray:2 4;opacity:.55}
.mono{font-family:var(--f-mono)}

/* вопрос 4: мембраны, АФК, пероксиредоксин */
.imm{stroke:var(--mito);stroke-width:4;opacity:.7} .pm{stroke:var(--off-ink);stroke-width:4;opacity:.6}
.nadhfill{fill:#2D3A4F} :root[data-theme="dark"] .nadhfill{fill:#8FA3C4}
.ros{fill:var(--rfp);fill-opacity:.25;stroke:var(--rfp);stroke-width:2;transition:r .3s}
.h2o2{fill:var(--on-soft);stroke:var(--on);stroke-width:2.2;transition:r .3s} .h2o2.hot{fill:var(--rfp);fill-opacity:.35;stroke:var(--bad)}
.prx-r{fill:var(--good)} .prx-s{fill:var(--on)} .prx-h{fill:var(--bad)}
.edge.ret{stroke:var(--bad);stroke-width:2.5}

/* v1.2 · вопрос 4: схематическое распределение форм пероксиредоксинов (не гель) */
.fd-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:2px 0 6px}
.fd-leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fd-row{margin:4px 0 8px}
.fd-lab{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.fd-pair{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.fd-pair small{font-size:11.5px;color:var(--muted)}
.fd-bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.fd-bar i{display:block;height:100%}
.fd-v{grid-column:2;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.fd-leg .prx-r,.fd-bar .prx-r{background:var(--good)} .fd-leg .prx-s,.fd-bar .prx-s{background:var(--on)} .fd-leg .prx-h,.fd-bar .prx-h{background:var(--bad)}
.fd-br{width:100%;max-width:440px;height:auto;display:block;margin-top:4px}

/* v1.2 · сценарий (аудит v1.1, V1/V4/V5): навигация и показатели «до → после → эталон» закреплены внизу панели */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.poe{display:flex;flex-direction:column}
.poe .poe-body{min-height:0}
.poe .poe-foot{flex:none;border-top:1px solid color-mix(in srgb,var(--on) 35%,transparent);margin-top:10px;padding-top:8px;background:var(--on-soft)}
@media (min-width:1001px){ .poe{max-height:calc(var(--avail,calc(100vh - 150px)) - 6px)} .poe .poe-body{overflow-y:auto;flex:1 1 auto;padding-right:4px} }
@media (max-width:1000px){ .poe .nav{position:sticky;bottom:0;z-index:2;background:var(--on-soft);padding:6px 0;margin-bottom:-4px;border-top:1px solid color-mix(in srgb,var(--on) 35%,transparent)} }
.poe .poe-when{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.poe .poe-res{font-size:16px;font-weight:700;margin:10px 0 0;padding:6px 10px;border-radius:8px;outline-offset:2px}
.poe .poe-res.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-left:4px solid var(--good)}
.poe .poe-res.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-left:4px solid var(--bad)}
.poe .opt.right .L::after{content:" ✓";color:var(--good)}
.poe .opt.wrongpick .L::after{content:" ✗";color:var(--bad)}
.poe .ex-more{margin-top:6px;font-size:15px}
.poe .ex-more summary{cursor:pointer;color:var(--on);font-weight:600}
.poe .ex-more p{margin:6px 0 0}
.poe .nav{margin-top:8px;align-items:center}
.poe .poe-step{font-family:var(--f-mono);font-size:13px;color:var(--muted);align-self:center}
.cmp{display:grid;gap:2px;font-size:13.5px}
.cmp-h,.cmp-r{display:grid;grid-template-columns:minmax(0,1.9fr) .8fr .25fr .8fr .8fr;gap:6px;align-items:baseline}
.cmp-h{font-size:12px;color:var(--muted);font-weight:600}
.cmp-n{overflow:hidden;text-overflow:ellipsis}
.cmp-a{text-align:center;font-weight:700}
.cmp-now{font-weight:700}
.cmp-ref{color:var(--muted)}

.poe.done .q{font-size:15.5px;margin:2px 0 6px}
.poe.done .poe-when{display:none}
.poe.done .opts{gap:4px}
.poe.done .opt{font-size:14px;padding:5px 10px}
.poe .poe-foot .poe-res{margin:0 0 6px;font-size:15px;padding:5px 9px}
.cmp{font-size:12.5px}

.poe .nav{flex:none}
.poe .ex-k{border-left:3px solid var(--on);padding-left:10px}
.cmp-note{font-size:11.5px;color:var(--muted);margin:3px 0 0}
.cmp2 .cmp-h,.cmp2 .cmp-r{grid-template-columns:minmax(0,1.9fr) 1fr 1fr}
.poe .poe-foot:empty{display:none}

/* ---------- значки OH / Ub (семинар 10), Me / Ac (семинар 6), частицы схем ---------- */
.pb.oh circle,.pb.me circle{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:1.6}
.pb.ub circle,.pb.ac circle{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:1.6}
.pb.oh text,.pb.ub text,.pb.me text,.pb.ac text{fill:var(--ink);font-size:9px}
.dot-1{fill:var(--mtor)} .dot-2{fill:var(--tfeb)} .dot-3{fill:var(--aa)} .dot-4{fill:var(--akt)} .dot-5{fill:var(--cyc)} .dot-6{fill:var(--mito)}
.clock .btns{margin-top:6px}

/* Семинар 10: контраст приглушённого текста на панели сценария в тёмной теме ≥ 4,5:1 (AC41) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .poe{--muted:#A9B4C0} }
:root[data-theme="dark"] .poe{--muted:#A9B4C0}

/* Семинар 10: до ответа все три варианта и кнопка «Показать» видны без прокрутки панели на 1280×720 и 1366×768 */
@media (min-width:1001px) and (max-height:800px){.poe .q{font-size:17px;margin:2px 0 8px}.poe .opt{font-size:14px;padding:6px 10px}.poe .opts{gap:5px}.poe .poe-when{font-size:12px;margin:-4px 0 6px}}
@media (min-width:1001px) and (max-height:800px){body.poe-on .qline{display:none}body.poe-on .qrow{margin-top:-4px}}
/* v2.0 (аудит v1.0): строка «расчёт модели» над показаниями (R10), справка в два уровня (R10), увеличение схемы на узком экране (R09) */
.rwrap{gap:4px}
.mnote{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.info-more{margin:4px 0 2px}
.info-more summary{cursor:pointer;color:var(--accent,var(--ink));font-weight:600;font-size:14px}
.info-more p{margin:6px 0 0}
/* справочные карточки без расчёта: метка, схема, вопрос для самопроверки */
.info.refcard{border-style:dashed}
.info.refcard b.k{color:var(--muted)}
.info p.reftag{font-size:13px;color:var(--muted);margin:0 0 4px}
.info .refp p+p,.info .refp figure+p{margin-top:7px}
.info .refp b{color:var(--ink)}
.btn.refbtn{border-style:dashed}
.selfq{margin:8px 0 2px;border-top:1px dashed var(--line);padding-top:6px}
.selfq summary{cursor:pointer;font-weight:600;font-size:14px}
.selfq p{margin:6px 0 0}
.selfq details{margin-top:6px}
.gfig{margin:8px 0 2px;overflow-x:auto}
.gfig svg{display:block;width:100%;min-width:400px;max-width:560px;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:8px}
.gfig figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.gfig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
/* пунктирная рамка-справка внутри схемы (I6-01): не входит в расчёт */
.stage svg .rc-chip{fill:var(--surface);stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 3}
.stage svg .rc-t{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:11.5px;text-anchor:middle;dominant-baseline:central}
.stage svg .rc-s{font-weight:500;font-size:10.5px;fill:var(--muted)}
/* схема перестроек локуса EPHA4 (I6-05) */
.gfig .gf-t{font-size:11.5px;font-weight:700}
.gfig .gf-dom{fill:var(--surface-2);stroke:var(--nuc-line);stroke-width:1}
.gfig .gf-bnd{fill:var(--ink)}
.gfig .gf-enh{fill:var(--on-soft);stroke:var(--on);stroke-width:1.6}
.gfig .gf-et{font-size:9.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.gfig .gf-pill{fill:var(--surface);stroke:var(--edge);stroke-width:1.2}
.gfig .gf-pt{font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.gfig .gf-brk{fill:none;stroke:var(--edge);stroke-width:2;stroke-linecap:round}
.gfig .gf-sep{stroke:var(--line);stroke-width:1}
.gfig .gf-arc{fill:none;stroke-linecap:round}
.gfig .gf-arc.norm{stroke:var(--muted);stroke-width:1.8}
.gfig .gf-arc.new{stroke:var(--bad);stroke-width:3.4}
.gfig .gf-arc.none{stroke:var(--muted);stroke-width:1.8;stroke-dasharray:4 3}
.gfig .gf-x{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.gfig .gf-lg{font-size:10.5px;fill:var(--muted)}
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}

/* ---------- вопрос 1 (метилирование ДНК): классы с префиксом s1- ---------- */
.s1-rowt{font-family:var(--f-body);fill:var(--ink);font-size:12.5px;font-weight:700}
.s1-note{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.s1-oc{font-family:var(--f-mono);fill:var(--ink);font-size:13px;font-weight:700}
.s1-sep{stroke:var(--line);stroke-width:1.2}
.s1-grid{stroke:var(--line);stroke-width:1}
.s1-tick{font-family:var(--f-mono);fill:var(--muted);font-size:11px}
/* значок диады: сплошная линия — старая цепь, штриховая — новая; закрашенный кружок — 5mC, пустой — цитозин без метки */
.s1-st{stroke:var(--edge);stroke-width:2.6;stroke-linecap:round;fill:none}
.s1-st.new{stroke:var(--off-ink);stroke-dasharray:4 3}
.s1-me{fill:var(--mtor);stroke:var(--mtor);stroke-width:1.5}
.s1-un{fill:var(--surface);stroke:var(--off-ink);stroke-width:1.8}
.s1-hm{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.s1-fc{fill:var(--on-soft);stroke:var(--on);stroke-width:2}
/* линии графика: форма штриха различает ряды без опоры на цвет */
.s1-lm{fill:none;stroke:var(--mtor);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.s1-lu{fill:none;stroke:var(--akt);stroke-width:3;stroke-dasharray:9 5;stroke-linecap:round;stroke-linejoin:round}
.s1-ln{fill:none;stroke:var(--off-ink);stroke-width:3;stroke-dasharray:1.5 5;stroke-linecap:round;stroke-linejoin:round}
.s1-q{stroke-width:1.6;opacity:.55}
.s1-cur{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3}
.s1-dot.s1-lm{fill:var(--mtor);stroke:var(--surface);stroke-width:1.5;stroke-dasharray:none}
.s1-dot.s1-lu{fill:var(--akt);stroke:var(--surface);stroke-width:1.5;stroke-dasharray:none}
.s1-dot.s1-ln{fill:var(--off-ink);stroke:var(--surface);stroke-width:1.5;stroke-dasharray:none}
/* дискретный курсор «число делений» */
.s1-nt{display:flex;justify-content:space-between;padding:0 7px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:-2px}
.s1-n output{color:var(--ink);font-weight:600}
/* ---- 1a: схема, приборы, загадка ---- */
.s1-rg{font-family:var(--f-body);fill:var(--mtor);font-size:12.5px;font-weight:700}
.s1-drug{font-family:var(--f-body);fill:var(--bad);font-size:12.5px;font-weight:700}
.lbl.s1-sub{fill:var(--muted)}
.s1-lh{fill:none;stroke:var(--tfeb);stroke-width:3;stroke-linecap:round}
.s1-lf{fill:none;stroke:var(--good);stroke-width:3;stroke-dasharray:9 5;stroke-linecap:round}
.s1-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.s1-g2 .slider label{font-size:14px;line-height:1.25}
.s1-det{margin:8px 0 0}
.s1-det > summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--mtor)}
.s1-plot{width:100%;height:112px;display:block;border-radius:8px;background:var(--surface-2);margin-top:2px}
.s1-leg{margin:4px 0 0;font-size:13px}
.s1-sw{width:30px;height:8px;flex:none}
.s1-bl .lanes{grid-auto-columns:56px}
.s1-bl .head{font-size:10.5px}
.s1-myst{position:absolute;inset:0;z-index:3;background:var(--surface);padding:16px 18px;overflow:auto}
.s1-myst-t{margin:0 0 4px;font-size:18px}
.s1-tbl{border-collapse:collapse;font-size:14px;margin:8px 0 2px;width:100%}
.s1-tbl th,.s1-tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.s1-tbl thead th{font-size:12.5px;color:var(--muted)}
.s1-tbl td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.s1-myst .lanes{grid-auto-columns:82px}
.s1-myst .head{font-size:11px}

/* ---------- вопрос 2 (энхансер и промотор): классы с префиксом s2- ---------- */
.s2-track{stroke:var(--off-ink);stroke-width:2.4;stroke-linecap:round}
.s2-dom{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:1.4;transition:width .3s,opacity .3s}
.s2-note{font-family:var(--f-body);fill:var(--muted);font-size:11.5px}
.s2-nm{font-family:var(--f-body);fill:var(--ink);font-size:12px;font-weight:600;text-anchor:middle}
.s2-nm2{font-family:var(--f-body);fill:var(--ink);font-size:11px;text-anchor:middle}
.s2-arc{fill:none;stroke:var(--akt);stroke-linecap:round;transition:opacity .35s,stroke-width .35s}
.s2-dist{font-family:var(--f-mono);fill:var(--ink);font-size:11.5px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--cyto);stroke-width:4px;stroke-linejoin:round}
.s2-pole{stroke:var(--tfeb);stroke-width:2.2}
.s2-flag{fill:var(--tfeb);stroke:var(--tfeb);stroke-width:1;stroke-linejoin:round}
.s2-rna{fill:none;stroke:var(--mtor);stroke-width:2.2;stroke-linecap:round}
.s2-val{font-family:var(--f-mono);fill:var(--ink);font-size:11.5px;font-weight:600;text-anchor:middle}
.s2-chip{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.s2-chip-t{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:11px;text-anchor:middle;dominant-baseline:central}
.s2-coa{fill:var(--mtor);stroke:var(--mtor);stroke-width:1.6;transition:opacity .3s}
.s2-coa.off{fill:none;stroke-dasharray:2.5 2.5;opacity:.5}
.box.s2-lowc{stroke:var(--bad);stroke-dasharray:5 3}
/* таблица дорожек и загадка */
.s2-ltw{overflow-x:auto;margin:4px 0 6px}
.s2-lt{width:100%;border-collapse:collapse;font-size:13px}
.s2-lt th,.s2-lt td{padding:3px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.s2-lt thead th{font-family:var(--f-mono);font-weight:600;color:var(--ink);text-align:right;font-size:12.5px}
.s2-lt tbody th{font-weight:500;text-align:left;color:var(--ink);font-size:12.5px}
.s2-lt td{text-align:right;font-family:var(--f-mono);font-weight:600}
.s2-lanes{margin:4px 0 8px;padding-left:20px;font-size:13.5px;color:var(--ink)}
ul.s2-lanes{list-style:none;padding-left:0}
.s2-lanes li{margin:2px 0}
.s2-myst{position:absolute;inset:0;z-index:3;background:var(--surface);padding:16px 18px;overflow:auto}
.s2-myst-t{margin:0 0 4px;font-size:18px}
.s2-myst .s2-lt{font-size:15px}
.s2-myst .s2-lt thead th,.s2-myst .s2-lt tbody th{font-size:14.5px}
.s2-sub{font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 2px}
.s2-row2{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.s2-row2 .grp{min-width:0}
#capbox2a{order:0} #sc2a .poe{order:-2}

#sc2a .tgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
#sc2a .tgrid .switch{font-size:13px;gap:6px;align-items:flex-start}
#sc2a .btns .btn{padding:6px 11px;font-size:13.5px}
/* узкий экран: загадка — таблица в потоке страницы вместо схемы; таблицы дорожек плотнее */
@media (max-width:700px){
  .stage.s2-mystOn svg,.stage.s2-mystOn .zoombtn{display:none}
  .stage.s2-mystOn .s2-myst{position:static;padding:12px 10px;overflow:visible}
  .s2-lt,.s2-myst .s2-lt{font-size:13px}
  .s2-lt thead th,.s2-lt tbody th,.s2-myst .s2-lt thead th,.s2-myst .s2-lt tbody th{font-size:12.5px}
  .s2-lt th,.s2-lt td{padding:3px 4px}
}

/* Вопрос 3 (FOXO): все классы с префиксом s3- */
/* плашки воздействий на схеме: ингибиторы и варианты FOXO; тёмная тема — те же фоны с белым текстом (контраст ≥ 4,5:1) */
#sc3b .drugpill,#sc3a .drugpill{fill:#B3261E;stroke:var(--ink);stroke-width:1.2}
.s3-genopill{fill:#5B3FA8;stroke:var(--ink);stroke-width:1.2}
/* блот: подписанные дорожки */
.s3-blot .lanes{grid-auto-columns:54px}
.s3-blot .head{font-size:10.5px;min-height:3.6em;white-space:nowrap;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;line-height:1.25}
.s3-blot .band{width:32px}
.s3-blot .hint{margin-top:6px}
.s3-key{display:grid;gap:2px;margin-top:6px}
.s3-key div{overflow-wrap:anywhere}
/* телефон: показания в один столбец (длинные названия показаний иначе расширяют страницу по горизонтали, AC29) */
@media (max-width:480px){ #sc3a .mgrid,#sc3b .mgrid{grid-template-columns:1fr} }
/* колонка показаний не шире экрана: блот с дорожками прокручивается внутри своего блока */
#reads3a,#reads3b{grid-template-columns:minmax(0,1fr)}
/* таблицы значений */
.s3-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.s3-tbl th,.s3-tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
.s3-tbl thead th{font-size:12.5px;color:var(--muted);font-weight:600}
.s3-tbl tbody th{font-weight:600;color:var(--ink)}
.s3-tbl td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* основная линия графиков: тёмно-янтарная в светлой теме (контраст к белому ≥ 3:1, AC41; токен ядра --on даёт 2,4:1), в тёмной — токен --on */
:root{--s3-a:#8A5A00}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--s3-a:#EFB13A} }
:root[data-theme="dark"]{--s3-a:#EFB13A}
/* графики: легенда с линиями того же вида, что на графике */
.s3-leg svg{vertical-align:middle}
.s3-l1{stroke:var(--s3-a);stroke-width:3.4}
.s3-l2{stroke:var(--cyc);stroke-width:2.8;stroke-dasharray:8 4}
.s3-l3{stroke:var(--good);stroke-width:3;stroke-dasharray:2 3}
#sc3a .ctrl .seg button:disabled,#sc3a .ctrl .switch input:disabled,#sc3a .ctrl input[type=range]:disabled{opacity:.45;cursor:not-allowed}
#sc3a .ctrl .switch input:disabled ~ span{opacity:.6}
#s3a_plotbox{margin-top:10px;display:grid;gap:8px}
#s3a_mysbox{margin-top:10px}
/* 3a: порядок панелей как в других вопросах (подпись выше ручек); в загадке блот лежит поверх скрытой схемы */
#capbox3a{order:-1} #poe3a{order:-2}
.s3-ov{position:absolute;inset:0;background:var(--surface);padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.s3-ov[hidden]{display:none}
.s3-ovh{margin:0;font-size:18px}
.s3-ov .s3-blot{margin-top:4px}
.s3-ov .lanes{grid-auto-columns:78px}
.s3-ov .head{font-size:13px;min-height:3.2em}
.s3-ov .rowlab{font-size:14px;height:38px}
.s3-ov .cell{height:38px}
.s3-ov .band{width:54px;height:14px}
.s3-ov .s3-key{font-size:14px}
#sc3a.s3-myst .ctrl > :not(.btns){display:none}

/* Вопрос 4 (хроматиновая память): стили схемы и приборов. Только переменные темы; классы с префиксом s4-. */
.s4-nuc{stroke-width:2.4}
.s4-nuc.m{fill:var(--mtor);stroke:var(--mtor)}
.s4-nuc.u{fill:var(--surface);stroke:var(--off-ink)}
.s4-nuc.n{fill:none;stroke:var(--off-ink);stroke-dasharray:3.5 3}
.s4-dna{fill:none;stroke:var(--tfeb);stroke-width:5;opacity:.45}
.s4-note{font-family:var(--f-body);fill:var(--muted);dominant-baseline:central}
.s4-val{font-family:var(--f-mono);fill:var(--ink);font-weight:700;dominant-baseline:central}
.s4-vb{font-family:var(--f-body);fill:var(--ink);font-weight:700;dominant-baseline:central}
.s4-drug{font-family:var(--f-body);fill:var(--bad);font-weight:700;dominant-baseline:central}
.s4-af{fill:var(--akt)}
.s4-seg{fill:var(--surface);stroke:var(--off-ink);stroke-width:1.3}
.s4-seg.on{fill:var(--on-soft);stroke:var(--ink);stroke-width:2.6}
.s4-segt{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central;text-anchor:middle;font-weight:600}
.s4-nul{font-family:var(--f-body);fill:var(--ink);font-weight:700;dominant-baseline:central;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.s4-card{fill:var(--surface);stroke:var(--off-ink);stroke-width:1.3}
.s4-cg{display:grid;gap:8px}
.s4-tg{display:flex;flex-wrap:wrap;gap:6px 22px}
.s4-plot{width:100%;height:132px;display:block;border-radius:8px;background:var(--surface-2)}
.s4-leg{margin:4px 0 0;font-size:13px;color:var(--muted)}
.s4-leg b{color:var(--ink)}
.s4-sw{display:inline-block;width:18px;height:0;border-top:3px solid currentColor;vertical-align:middle;margin-right:5px}
.s4-sw.d{border-top-style:dashed}
.s4-sw.dd{border-top-style:dotted}
.s4-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 0}
.s4-tbl th,.s4-tbl td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.s4-tbl td.num{font-family:var(--f-mono);white-space:nowrap}
.s4-bx{margin:6px 0 0}
.s4-bx .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.s4-bx .row small{color:var(--muted);font-size:13px}
.s4-bx .row .v{font-family:var(--f-body);font-weight:700;font-size:14.5px;text-align:right}
.s4-bx .none{color:var(--muted);font-weight:500}
.s4-myst{position:absolute;inset:0;z-index:3;background:var(--surface);padding:14px 16px;overflow:auto;border-radius:10px}
.s4-myst-t{margin:0 0 4px;font-size:17px;font-family:var(--f-display)}
.s4-myst p{margin:4px 0}
.s4-myst .btns{margin-top:8px}
.s4-myst label.opt2{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14.5px;cursor:pointer}
.s4-myst .res{font-weight:600;margin:8px 0 0}
/* Панель сценария в окне 1280×720: до ответа все три варианта должны помещаться без прокрутки панели (tests/q4_scene.mjs);
   правило локальное для вопроса 4 */
@media (min-width:1001px) and (max-height:740px){
  #poe4a .q,#poe4b .q{font-size:17px;margin:2px 0 8px}
  #poe4a .opt,#poe4b .opt{font-size:14px;padding:6px 10px}
  #poe4a .opts,#poe4b .opts{gap:5px}
  #poe4a .poe-when,#poe4b .poe-when{font-size:12px;margin:-4px 0 6px}
}

</style>

остаётся малой: метку на новой цепи восстанавливает метилирование de novo.", "p1b_1_o3": "Доля MM снижается, а доля MU растёт: старая цепь сохраняет метку, а на новой цепи она ставится лишь de novo.", "p1b_1_k": "При репликации старая цепь сохраняет 5mC, а новая цепь синтезируется без метки. В норме DNMT1 при участии UHRF1 метилирует новую цепь напротив 5mC старой. Если копирование выключено, метка на новой цепи появляется только в результате метилирования de novo, в модели с вероятностью 17 %: большинство диад MM становятся диадами MU. При следующих делениях старая цепь без метки попадает в часть дочерних диад, и доля UU растёт.", "p1b_1_e": "В модели при нулевой активности копирования вероятность метки на новой цепи при метилированной старой (Em) снижается с 96 % до 17 % и становится равной вероятности при неметилированной старой (Ed). Через 4 деления доля MM снижается с 78 % до 4 %, доля MU растёт с 6 % до 33 %, доля UU — с 16 % до 62 %; метилированных цепей остаётся 21 % вместо 81 %. Значения Em и Ed — оценка по диадам для гиперметилированного CpG-острова гена FMR1 неактивной X-хромосомы в лимфоцитах человека (Laird 2004); для острова PGK1 в клонах другой линии оценка Em выше (Pfeifer 1990), поэтому Em — не константа. Потеря метки при нарушении копирования зависит от клеток: в Np95-дефицитных ЭСК и эмбрионах мыши теряется глобальное метилирование (Bostick 2007; Sharif 2007), в ЭСК мыши Dnmt1⁻/⁻ содержание m5C составляет около трети нормы (Li 1992), а в клетках HCT116 после удаления DNMT1 около одной пятой CpG-диад становятся полуметилированными, клеточный цикл останавливается в фазе G2, а клетки погибают в митозе (Chen 2007). Гибель клеток модель не рассчитывает.", "p1b_1_w1": "Вариант считает, что потеря копирования стирает метку со старой цепи. Старая цепь при репликации не изменяется: её 5mC сохраняется, а меняется только новая цепь, на которой метка появляется редко (в модели вероятность снижается с 96 % до 17 %). Поэтому диады MM сначала становятся диадами MU, и доля MU растёт, а не снижается.", "p1b_1_w2": "Вариант приписывает DNMT3A/B копирование метки. Метилирование de novo не использует старую цепь как образец: in vitro DNMT3A и DNMT3B метилируют неметилированную, полуметилированную и полугидроксиметилированную ДНК примерно одинаково (Hashimoto 2012). Поэтому после потери копирования метка на новой цепи появляется с малой вероятностью Ed, и потери не возмещаются.", "p1b_2_q": "В линии клеток установилось стационарное состояние метилирования CpG-острова. Активность метилирования de novo (DNMT3A/B) снижают до нуля; копирование метки (DNMT1 с UHRF1) остаётся нормальным. Как изменятся доли диад MM и UU после 8 делений?", "p1b_2_o1": "Доля MM снижается умеренно, а доля UU растёт: копирование неполное, и метилирование de novo возмещало часть потерь.", "p1b_2_o2": "Доли MM и UU почти не меняются: метилирование de novo нужно для установления метки, а не для её поддержания.", "p1b_2_o3": "Доля MM снижается почти до нуля, а доля UU сильно растёт: без метилирования de novo метка теряется так же, как без копирования.", "p1b_2_k": "При поддерживающем метилировании (DNMT1 с UHRF1) метка на новой цепи появляется не во всех диадах: на части новых цепей её нет, и диада остаётся полуметилированной. Метилирование de novo (DNMT3A/B) ставит метку на неметилированную цепь независимо от старой и возмещает часть этих потерь. Когда его нет, потерянная при неполном копировании метка не восстанавливается, и доля UU растёт.", "p1b_2_e": "В модели при нулевой активности метилирования de novo вероятность метки на новой цепи при неметилированной старой (Ed) снижается с 17 % до 0 %, а вероятность при метилированной старой (Em) почти не меняется (с 96 % до 95 %). Через 8 делений доля MM снижается с 78 % до 65 %, доля MU — с 6 % до 3 %, доля UU растёт с 16 % до 32 %; метилированных цепей остаётся 67 % вместо 81 %. Потеря умеренная, потому что копирование в модели сохраняет метку на большинстве цепей. Вклад DNMT3A/B в поддержание показан на повторах и в ЭСК: в ЭСК мыши без Dnmt3a и Dnmt3b метилирование повторов и одиночных генов теряется постепенно (Liang 2002; Chen 2003), на LINE-1 высока доля полуметилированной ДНК даже в норме (Jones 2009), а в hESC без DNMT3A и DNMT3B метилирование снижается примерно на одну десятую за около 20 пассажей (значение прочитано по рисунку; Charlton 2018). В клетках HCT116 удаление DNMT3B снижало метилирование менее чем на 3 %, а одновременная потеря DNMT1 и DNMT3B — более чем на 95 % (Rhee 2002).", "p1b_2_w2": "Вариант делит роли без остатка: DNMT3A/B только устанавливают метку, DNMT1 только поддерживает. Но копирование неполное, и метка на части новых цепей не появляется; без метилирования de novo такие потери не возмещаются, поэтому доля MM снижается, а доля UU растёт. На повторах и в ЭСК мыши DNMT3A/B вносят вклад в поддержание именно так (Liang 2002; Chen 2003).", "p1b_2_w3": "Вариант приписывает DNMT3A/B роль копирования метки. Без копирования метка на новой цепи ставится лишь de novo (в модели с вероятностью 17 %), и диады MM быстро становятся диадами MU. При нормальном копировании метка на новой цепи появляется почти у всех диад, где старая цепь метилирована, поэтому потеря метилирования de novo лишает клетки только возмещения и снижает долю MM умеренно.", "p1b_3_q": "В линии клеток копирование метки (DNMT1 с UHRF1) снижено до нуля, метилирование de novo (DNMT3A/B) не меняется. После первого деления доля диад MU повышена. Как изменятся доли MU и UU к 4-му делению?", "p1b_3_o1": "Доля MU продолжает расти, а доля UU остаётся малой: потеря копирования накапливает полуметилированные диады.", "p1b_3_o2": "Доля MU снижается, а доля UU растёт: каждое деление передаёт цепь без метки половине дочерних диад.", "p1b_3_o3": "Доли MU и UU почти не меняются: новое состояние устанавливается уже после первого деления.", "p1b_3_k": "Без копирования метка на новых цепях появляется лишь de novo (в модели с вероятностью 17 %). Диада MU при делении образует две дочерние диады: в одну попадает старая цепь с меткой (в основном MU), в другую — старая цепь без метки (в основном UU). Поэтому доля MU достигает максимума после первого деления, а затем снижается, и доля UU растёт.", "p1b_3_e": "В модели при нулевой активности копирования после первого деления доля MU составляет 70 %, доля MM — 14 %, доля UU — 16 %; к 4-му делению доля MU снижается до 33 %, доля MM — до 4 %, а доля UU растёт до 62 %. Метилированных цепей остаётся 21 % вместо 49 %. Максимум MU на первом делении — результат арифметики модели: исходное состояние стационарно, а потеря копирования действует с первого деления; в опыте форма кривой зависит от скорости потери копирования и от клеток. Накопление полуметилированных диад при удалении DNMT1 показано в клетках HCT116: около одной пятой CpG-диад становятся полуметилированными, но клеточный цикл останавливается в фазе G2, а клетки погибают в митозе (Chen 2007); этот предел числа делений модель не учитывает.", "p1b_3_w1": "Вариант ошибочно предполагает, что диады MU — конечный результат нарушения поддерживающего метилирования. При репликации диады MU одна дочерняя диада получает старую цепь с меткой, а другая — старую цепь без метки. Последняя чаще остаётся неметилированной, поскольку метилирование de novo в этой модели происходит с вероятностью 17 %. Новые диады MU образуются из MM, но после первого деления доля MM уже мала.", "p1b_3_w3": "Вариант считает, что одно деление завершает перестройку. После первого деления метка есть на старых цепях диад MU, но при каждом следующем делении такая цепь попадает лишь в половину дочерних диад; поэтому доли MU и UU продолжают меняться по мере уменьшения доли дочерних диад, получивших исходную метилированную цепь.", "s1_k_sam": "SAM и SAH", "s1_k_tet": "TET", "s1_k_tdg": "TDG и репарация", "s1a_rowA": "Старая цепь с 5mC · метка на новой цепи (Em)", "s1a_rowB": "Старая цепь без 5mC · метка на новой цепи (Ed)", "s1a_rowC": "Между делениями: окисление 5mC (TET) и удаление 5fC и 5caC (TDG)", "s1a_newnote": UU (тонкие линии — норма)", "s1a_plot2_t": "Сигнал TAB-seq (5hmC) и 5fC и 5caC, логарифмическая шкала, % (тонкие линии — норма)", "s1a_unit_n": "делений", "s1a_leg_mm": "MM — 5mC на обеих цепях", "s1a_leg_mu": "MU — 5mC на одной цепи", "s1a_leg_uu": "UU — без 5mC", "s1a_leg_tab": "5hmC (TAB-seq)", "s1a_leg_f5": "5fC и 5caC", "s1a_leg_thin": "тонкие линии — норма", "s1a_tab1": "Число делений {n}: MM {mm} (норма {mm0}), MU {mu} ({mu0}), UU {uu} ({uu0}).", "s1a_tab2": "Число делений {n}: сигнал TAB-seq (5hmC) {tab} (норма {tab0}), 5fC и 5caC {f5} от исходных 5mC (норма {f50}).", "s1a_blot_t": "Блот: методы (строки) и условия (дорожки)", "s1a_blot_add": "Добавить дорожку", "s1a_blot_clear": "Очистить дорожки", "s1a_blot_hint": "Плотность полосы — условная мера: бисульфит и oxBS-seq показывают долю цепей, сигнал TAB-seq усилен в 10 раз, шпилечный бисульфит — в 3 раза, 5fC и 5caC даны на логарифмической шкале. Число полос и их плотность не равны потоку или абсолютному количеству.", "s1a_b_bs": "бисульфит", "s1a_b_ox": "oxBS-seq", "s1a_b_tab": "TAB-seq", "s1a_b_hp": "шпилечный: MU", "s1a_b_f5": "5fC и 5caC", "s1a_sh_ref": "норма", "s1a_sh_now": "сейчас", "s1a_sh_div": "дел.", "s1a_sh_multi": "и др.", "s1a_sh_a1": "копир. ↓", "s1a_sh_a1_0": "без DNMT1", "s1a_sh_a3": "de novo ↓", "s1a_sh_a3_0": "без DNMT3", "s1a_sh_aT": "TET ↓", "s1a_sh_aT_0": "без TET", "s1a_sh_aG": "TDG ↓", "s1a_sh_aG_0": "без TDG", "s1a_sh_samlo": "SAM ↓", "s1a_sh_sahhi": "SAH ↑", "s1a_sh_dac": "децитаб.", "s1a_sh_aza": "азацит.", "s1a_sh_ncv": "нековал.", "s1a_sh_asc": "аскорб.", "s1a_ctl_s": "контр.", "s1a_lane_ctl": "Дорожка 1 — норма (район: {rg}; число делений {n}).", "s1a_lane_now": "Дорожка 2 — сейчас (район: {rg}; {c}; число делений {n}).", "s1a_lane_n": "Дорожка {i} — сохранена (район: {rg}; {c}; число делений {n}).", "s1a_ln_ref": "без воздействий", "s1a_ln_a1": "копирование метки снижено до {a1} нормы", "s1a_ln_a1_0": "копирование метки отсутствует (0 % нормы)", "s1a_ln_a3": "метилирование de novo снижено до {a3} нормы", "s1a_ln_a3_0": "метилирование de novo отсутствует (0 % нормы)", "s1a_ln_aT": "активность TET снижена до {aT} нормы", "s1a_ln_aT_0": "активность TET отсутствует (0 % нормы)", "s1a_ln_aG": "удаление 5fC и 5caC (TDG) снижено до {aG} нормы", "s1a_ln_aG_0": "удаление 5fC и 5caC (TDG) отсутствует (0 % нормы)", "s1a_ln_samlo": "SAM снижен (метилирующий потенциал {g})", "s1a_ln_sahhi": "SAH повышен (метилирующий потенциал {g})", "s1a_ln_dac": "децитабин (активность копирования к этому делению {e1} нормы)", "s1a_ln_aza": "азацитидин (активность копирования к этому делению {e1} нормы)", "s1a_ln_ncv": "нековалентный ингибитор DNMT1 (активность копирования {e1} нормы)", "s1a_ln_asc": "аскорбат (активность TET повышена, в модели в 5 раз)", "s1a_c_rest": "Диада — пара цитозинов CpG на двух цепях ДНК; метка — 5mC. Норма для района «{rg}»: число делений {n}, диады MM {mm}, MU {mu}, UU {uu}; сигнал бисульфита (5mC и 5hmC) {bs}, сигнал oxBS-seq (5mC) {ox}.", "s1a_c_rest_z": "Потери метки при неполном копировании возмещаются метилированием de novo, а окисление 5mC (TET) и удаление 5fC и 5caC (TDG) идут с постоянной скоростью, поэтому доли диад от деления к делению не меняются; исключение — домен PMD, где метилирование de novo слабо и метка убывает по мере делений. Из-за окисления метилированных диад MM меньше, чем без окисления в базовой сцене.", "s1a_c_drift": "Воздействий нет: за {n} делений доля диад MM в районе «{rg}» снизилась до {mm}; MU {mu}, UU {uu}; сигнал бисульфита {bs}.", "s1a_c_drift_z": "В этом районе метилирование de novo (Ed) в модели слабо и не полностью возмещает потери при неполном копировании, поэтому метка убывает с каждым делением даже без воздействий. Потеря метилирования в доменах PMD нарастает с числом делений и следует за числом удвоений популяции первичных клеток человека (Zhou 2018; Endicott 2022); значения Em и Ed в модели — допущение.", "s1a_c_unmeth": "Район «{rg}»: метилированных диад мало (MM {mm}, MU {mu}, UU {uu}); сигнал бисульфита {bs}.", "s1a_c_unmeth_z": "В неметилированных CpG-островках промоторов ошибки, в основном метилирование de novo, составляют около 0,1 % на сайт и поколение (Ushijima 2003; клетки молочной железы человека), поэтому метка почти не накапливается; Em в этом районе — допущение. Воздействия на ферменты здесь меняют показания мало, потому что метилированных цепей мало.", "s1a_c_n0": "Делений не было: диады MM {mm}, MU {mu}, UU {uu} — как в норме для района «{rg}».", "s1a_c_n0_z": "В этой модели воздействие начинается с первого деления, поэтому при 0 делений показания равны норме.", "s1a_c_norm": "Диады MM {mm} (норма {mm0}), MU {mu} ({mu0}), UU {uu} ({uu0}): доли диад близки к норме.", "s1a_c_norm_z": "При этих настройках и числе делений {n} доли MM и MU отличаются от нормы меньше чем на 3 процентных пункта. Эффект может быть в других показаниях (сигнал TAB-seq, 5fC и 5caC) или проявиться при большем числе делений.", "s1a_c_shift": "Диады MM {mm} (норма {mm0}), MU {mu} ({mu0}), UU {uu} ({uu0}): доля MM близка к норме, а доля MU отличается.", "s1a_c_shift_z": "Вероятности метки на новой цепи — Em {em} при метилированной старой цепи и Ed {ed} при неметилированной; перераспределение между диадами MU и UU видно при том же числе MM. Сравните и другие показания (сигнал TAB-seq, 5fC и 5caC).", "s1a_c_up": "Диады MM {mm} (норма {mm0}), MU {mu} ({mu0}), UU {uu} ({uu0}): метилированных диад больше нормы.", "s1a_c_up_z": "5mC реже окисляется в 5hmC и далее, поэтому больше цепей сохраняет 5mC (сигнал oxBS-seq {ox} вместо {ox0}). Ферменты метилирования при этом не усилены: растёт доля 5mC, сохранившейся после окисления.", "s1a_c_hemi": "Диады MM {mm} (норма {mm0}), MU {mu} (норма {mu0}), UU {uu} (норма {uu0}): доля полуметилированных диад выше нормы.", "s1a_c_hemi_z": "Старая цепь сохраняет метку, а на новой цепи она появляется реже: вероятность метки на новой цепи при метилированной старой (Em) — {em}. Диады MU чаще образуются из MM, а при следующих делениях цепи без метки могут дать диады UU. Обычный бисульфит показывает лишь долю метилированных цепей ({bs}); полуметилированные диады видны шпилечным бисульфитом.", "s1a_c_oxh": "Диады MM {mm} (норма {mm0}), MU {mu} (норма {mu0}), UU {uu} (норма {uu0}): метилированных диад меньше нормы, полуметилированных больше.", "s1a_c_oxh_z": "Вероятность метки на новой цепи при метилированной старой (Em) не снижена ({em}), но часть 5mC окислена до 5hmC и далее: в модели DNMT1 не метилирует новую цепь напротив таких старых цепей (in vitro активность DNMT1 на полугидроксиметилированной ДНК более чем в 60 раз ниже; Hashimoto 2012). Диада с 5mC на одной цепи и 5hmC на другой относится к MU.", "s1a_c_fall": "Диады MM {mm} (норма {mm0}), MU {mu} (норма {mu0}), UU {uu} (норма {uu0}): метилированных диад меньше нормы, а доля полуметилированных заметно не выросла.", "s1a_c_fall_z": "Цепи без метки накапливаются: доля диад UU выше нормы. Вероятности метки на новой цепи — {em} при метилированной старой цепи (Em) и {ed} при неметилированной (Ed).", "s1a_o_h0": "Сигнал TAB-seq (5hmC) — {tab} вместо {tab0}.", "s1a_o_h0_z": "5hmC образуется из 5mC при участии TET, поэтому её меньше, когда мало активной TET или самой 5mC. Бисульфит читает 5mC и 5hmC вместе, и при потере 5hmC его сигнал ({bs}) приближается к сигналу oxBS-seq ({ox}).", "s1a_o_hup": "Сигнал TAB-seq (5hmC) — {tab} вместо {tab0}.", "s1a_o_hup_z": "5hmC образуется из 5mC при участии TET, и при большей активности TET её больше. Бисульфит читает 5mC и 5hmC вместе ({bs}), oxBS-seq — только 5mC ({ox}); их разность оценивает долю 5hmC.", "s1a_o_fup": "5fC и 5caC — {f5} от исходных 5mC вместо {f50}.", "s1a_o_fup_z": "TET образует 5fC и 5caC, а TDG и последующая репарация вырезанием оснований удаляют их, поэтому доля 5fC и 5caC растёт при большей активности TET или меньшей активности TDG. Бисульфит читает 5fC и 5caC как неметилированный цитозин (Booth 2014; Lu 2013), и его сигнал их не показывает.", "s1a_cause_a1": "Копирование метки снижено до {a1} нормы, поэтому вероятность метки на новой цепи при метилированной старой (Em) — {em}.", "s1a_cause_a1_0": "Копирование метки отсутствует, поэтому метка на новой цепи появляется с той же вероятностью, что и при неметилированной старой цепи: Em {em}, Ed {ed}.", "s1a_cause_a3": "Метилирование de novo снижено до {a3} нормы, поэтому вероятность метки на новой цепи при неметилированной старой (Ed) — {ed}.", "s1a_cause_a3_0": "Метилирование de novo в модели отсутствует: Ed — {ed}; копирование метки при метилированной старой цепи сохраняется (Em {em}).", "s1a_cause_aT": "Активность TET снижена до {aT} нормы: 5mC окисляется реже, и 5hmC образуется медленнее.", "s1a_cause_aT_0": "Активность TET отсутствует: 5mC не окисляется, 5hmC не образуется, а доля остающейся 5hmC уменьшается при делении клеток.", "s1a_cause_aG": "Удаление 5fC и 5caC (TDG с репарацией) снижено до {aG} нормы: окисленные формы возвращаются в цитозин медленнее и накапливаются по мере делений.", "s1a_cause_aG_0": "Удаление 5fC и 5caC (TDG) отсутствует: окисленные формы не возвращаются в цитозин и накапливаются по мере делений.", "s1a_cause_samlo": "Метилирующий потенциал снижен до {g} из-за уменьшения SAM; в модели это немного снижает и копирование, и метилирование de novo (Em {em}, Ed {ed}).", "s1a_cause_sahhi": "Метилирующий потенциал снижен до {g} из-за роста SAH; в модели Em снижается до {em}, Ed — до {ed}.", "s1a_cause_dac": "Децитабин включается в ДНК при репликации и ковалентно захватывает DNMT; в модели активность копирования к этому делению — {e1} нормы, Em — {em}.", "s1a_cause_aza": "Азацитидин в основном включается в РНК, и лишь меньшая доля достигает ДНК; в модели он действует как децитабин, но слабее: активность копирования к этому делению — {e1} нормы, Em — {em}.", "s1a_cause_ncv": "Нековалентный ингибитор DNMT1 не включается в ДНК; в модели он снижает активность копирования до {e1} нормы с первого деления, и Em — {em}.", "s1a_cause_asc": "Аскорбат повышает активность TET (в модели в 5 раз): 5mC окисляется чаще, а образующиеся 5hmC, 5fC и 5caC накапливаются по мере делений.", "s1a_c_multi": "Включено несколько воздействий: {list}. По этим показаниям вклад каждого из них не разделить; чтобы разделить, включайте воздействия по одному.", "s1a_take": "Метка поддерживается копированием (DNMT1 с UHRF1) и метилированием de novo (DNMT3A/B), а её убыль определяют ещё окисление 5mC (TET), удаление 5fC и 5caC (TDG) и метилирующий потенциал (SAM и SAH). Методы читают разное: бисульфит — 5mC и 5hmC вместе, oxBS-seq — 5mC, TAB-seq — 5hmC, а полуметилированные диады видны только шпилечным бисульфитом. Вывод относится к районам с принятыми параметрами: Em и Ed острова с меткой получены для одной системы, остальные значения — допущения, а гибель клеток, соседние CpG и транскрипция не рассчитаны. Связь с вопросом 2: метилирование CpG в сайтах связывания CTCF района H19/Igf2 устраняет связывание CTCF, а неметилированный район служит блокатором энхансера (Bell 2000; Hark 2000), поэтому унаследованное при делениях состояние метки определяет, какой аллель экспрессируется; сама по себе метка экспрессию не активирует.", "s1a_myst_t": "Загадка: образцы X, Y, Z", "s1a_myst_hint": "Образцы взяты из CpG-острова с меткой через {n} делений после воздействия. У каждого — одно из трёх условий: нокаут TET, генетическое выключение поддерживающего метилирования или аскорбат. Определите по блоту (бисульфит и oxBS-seq) и по таблице, какое условие у образца Z.", "s1a_myst_hint2": "Условия образцов указаны под блотом. Бисульфит читает 5mC и 5hmC вместе, oxBS-seq — только 5mC, поэтому повышение доли 5hmC выявляют по увеличению разности этих сигналов относительно контроля.", "s1a_myst_reads": "Доля цепей с сигналом метилирования:", "s1a_myst_line2": "Образец {n}: {c}.", "s1a_tbl_s": "Образец", "s1a_tbl_bs": "Бисульфит (5mC и 5hmC)", "s1a_tbl_ox": "oxBS-seq (5mC)", "s1a_tbl_ctl": "контроль (без воздействия)", "s1a_c_myst": "Три образца через {n} делений после воздействия. В контроле сигнал бисульфита {bs0}, сигнал oxBS-seq {ox0}. Условия образцов скрыты.", "s1a_c_myst_z": "Сравните два метода у каждого образца: бисульфит читает 5mC и 5hmC вместе, oxBS-seq — только 5mC.", "s1a_c_myst2": "Условия образцов раскрыты. В контроле через {n} делений сигнал бисульфита {bs0}, сигнал oxBS-seq {ox0}; сравните с таблицей.", "s1a_c_myst2_z": "Из трёх образцов заметная разность между сигналом бисульфита и сигналом oxBS-seq — у образца с аскорбатом; при нокауте TET или генетическом выключении поддерживающего метилирования разности почти нет.", "s1a_when4": "Прогноз на момент после 4 делений; единица времени — деление клетки (учебная модель).", "s1a_when6": "Прогноз на момент после 6 делений; единица времени — деление клетки (учебная модель).", "s1a_when8": "Прогноз на момент после 8 делений; единица времени — деление клетки (учебная модель).", "s1a_when12": "Прогноз на момент после 12 делений; единица времени — деление клетки (учебная модель).", "s1a_when_m": "Образцы взяты через 6 делений после воздействия; единица времени — деление клетки (учебная модель).", "s1a_ctl_norm": "норма", "s1a_ctl_n0": "исходное", "s1a_h_n0": "0 делений", "s1a_h_n12": "12 делений", "p1a_1_q": "В CpG-острове с высоким метилированием, где идёт и окисление 5mC, активность копирования метки (DNMT1 с UHRF1) снижают до нуля; остальные процессы не меняются. Как изменятся через 6 делений доли диад MM и MU и сигнал бисульфита?", "p1a_1_o1": "Доля MM почти не меняется, а сигнал бисульфита снижается мало: метилирование de novo возмещает потерю копирования.", "p1a_1_o2": "Доля MM резко снижается, доля MU растёт, сигнал бисульфита снижается: на новой цепи метка ставится лишь de novo.", "p1a_1_o3": "Доли MM и MU снижаются вместе с сигналом бисульфита: потеря копирования стирает метку со старой цепи.", "p1a_1_k": "При репликации новая цепь синтезируется без метки, а старая сохраняет 5mC. Без копирования метка на новой цепи ставится только de novo (в модели с вероятностью 17 %), поэтому большинство диад MM становятся диадами MU, а при следующих делениях часть дочерних диад получает старую цепь без метки и становится диадами UU.", "p1a_1_e": "В модели при нулевом копировании метки вероятность метки на новой цепи при метилированной старой (Em) снижается с 96 % до 17 % и становится равной вероятности при неметилированной (Ed). Через 6 делений доля MM снижается с 63 % до 3 %, доля MU растёт с 11 % до 28 %, доля UU — с 27 % до 69 %; сигнал бисульфита (5mC и 5hmC вместе) снижается с 70 % до 18 %. Доли MM и MU по обычному бисульфиту не определяются, потому что он читает цепи по отдельности; их различает шпилечный бисульфит, читающий обе цепи одной молекулы (Laird 2004). Исходные 96 % и 17 % — оценка Em и Ed по диадам для CpG-острова гена FMR1 неактивной X-хромосомы в лимфоцитах человека (Laird 2004). Потеря метки при нарушении копирования зависит от клеток: в Np95-дефицитных ЭСК и эмбрионах мыши теряется метилирование (Bostick 2007; Sharif 2007), а в клетках HCT116 после удаления DNMT1 клеточный цикл останавливается в фазе G2, а клетки погибают в митозе (Chen 2007). Гибель клеток модель не рассчитывает.", "p1a_1_w1": "Вариант приписывает DNMT3A/B возмещение потери копирования. Метилирование de novo не использует старую цепь как образец (Hashimoto 2012) и ставит метку на новую цепь с вероятностью Ed, равной 17 %, поэтому при нулевом копировании вероятность метки при метилированной старой цепи снижается до этой же величины, и доля MM падает до 3 %.", "p1a_1_w3": "Вариант считает, что потеря копирования стирает метку со старой цепи. При репликации старая цепь не изменяется, и её 5mC сохраняется; метка на новой цепи появляется редко (17 %). Поэтому диады MM сначала становятся диадами MU, и доля MU растёт с 11 % до 28 %, а не снижается.", "p1a_2_q": "В районе повторов установилось стационарное состояние метилирования. Активность метилирования de novo (DNMT3A/B) снижают до нуля; копирование метки остаётся нормальным. Как изменятся через 12 делений доли диад MM и MU и сигнал бисульфита?", "p1a_2_o1": "Доли MM и MU снижаются вместе с сигналом бисульфита: метилирование de novo пополняло полуметилированные диады.", "p1a_2_o2": "Доля MM почти не меняется, а сигнал бисульфита остаётся высоким: без метилирования de novo метку поддерживает копирование.", "p1a_2_o3": "Доля MM снижается, а доля MU растёт: старая цепь сохраняет метку, а на новой цепи она появляется редко.", "p1a_2_k": "Метилирование de novo ставит метку на цепь независимо от старой цепи; в этом районе оно возмещает потери, которые возникают при неполном копировании. Без DNMT3A/B цепи, потерявшие метку, её не получают, и доли MM и MU снижаются, а доля UU растёт.", "p1a_2_e": "В модели повторов (Em и Ed допущены, потому что чисел для повторов в использованных работах нет) при нулевом метилировании de novo вероятность метки на новой цепи при неметилированной старой (Ed) снижается с 30 % до 0 %, а вероятность при метилированной старой (Em) — с 93 % до 90 %. Через 12 делений доля MM снижается с 65 % до 29 %, доля MU — с 16 % до 4 %, доля UU растёт с 19 % до 67 %; сигнал бисульфита снижается с 76 % до 32 %. Направление согласуется с опытами на ЭСК мыши без Dnmt3a и Dnmt3b, где метилирование повторов и одиночных генов теряется постепенно (Liang 2002; Chen 2003), и с высокой долей полуметилированной ДНК на LINE-1 даже в норме (Jones 2009). Потеря в модели идёт быстрее, чем в hESC без DNMT3A и DNMT3B, где метилирование снижалось примерно на одну десятую за около 20 пассажей (значение прочитано по рисунку; Charlton 2018): значения Em и Ed повторов — допущение, поэтому модель показывает направление, а не скорость.", "p1a_2_w2": "Вариант делит роли без остатка: DNMT3A/B только устанавливают метку, а DNMT1 только поддерживает. Но копирование неполное (Em 93 %), и метка на части новых цепей не появляется; без метилирования de novo (Ed снижается с 30 % до 0 %) такие потери не возмещаются, и доля MM снижается с 65 % до 29 %.", "p1a_2_w3": "Вариант приписывает DNMT3A/B основную роль поддерживающего метилирования. В этом сценарии DNMT1 сохраняет нормальную активность (Em 90 %), поэтому большинство дочерних диад с метилированной старой цепью вновь становится MM. Диады MU продолжают образовываться при неполном поддерживающем метилировании, но без метилирования de novo они не образуются из UU. В результате доля MU снижается с 16 % до 4 %.", "p1a_3_q": "В клетках с метилированным CpG-островом активность TET (окисление 5mC) снижают до нуля; остальные процессы не меняются. Как изменятся через 6 делений сигналы TAB-seq (5hmC), oxBS-seq (5mC) и бисульфита (5mC и 5hmC вместе)?", "p1a_3_o1": "Сигнал TAB-seq падает почти до нуля, а сигналы oxBS-seq и бисульфита снижаются: без TET метка не поддерживается.", "p1a_3_o2": "Сигнал TAB-seq падает почти до нуля, но бисульфит по-прежнему даёт заметно больший сигнал, чем oxBS-seq: разность сохраняется.", "p1a_3_o3": "Сигнал TAB-seq падает почти до нуля, сигналы oxBS-seq и бисульфита близки и немного растут: метка не окисляется.", "p1a_3_k": "TET окисляет 5mC в 5hmC, а затем в 5fC и 5caC. Без TET 5hmC не образуется, поэтому сигнал TAB-seq падает почти до нуля (доля остающейся 5hmC уменьшается при делении клеток), а бисульфит, читающий 5mC и 5hmC вместе, практически совпадает с oxBS-seq. 5mC перестаёт окисляться, и её доля немного возрастает.", "p1a_3_e": "В модели при нулевой активности TET через 6 делений сигнал TAB-seq (5hmC) снижается с 2,4 % до 0,04 % (доля остающейся 5hmC уменьшается при делении клеток), сигнал oxBS-seq (5mC) растёт с 68 % до 74 %, сигнал бисульфита — с 70 % до 74 %: разность методов, равная доле 5hmC, становится близкой к нулю. Копирование (Em 96 %) и метилирование de novo (Ed 17 %) не меняются, а рост 5mC вызван тем, что 5mC перестаёт окисляться. Доля 5hmC в модели подобрана и составляет порядка процентов цепей острова; в тканях мыши 5hmC составляет от сотых до десятых долей процента dG (Globisch 2010). В тройном нокауте Tet в ЭСК мыши наблюдали нарушение дифференцировки и гиперметилирование промоторов в эмбриоидных тельцах (Dawlaty 2014); нокаут TET не останавливает метилирование вообще, потому что метку по-прежнему ставят DNMT.", "p1a_3_w1": "Вариант считает TET ферментом поддержания метилирования. TET окисляет 5mC, а метку не ставит и не копирует; копирование (Em 96 %) и метилирование de novo (Ed 17 %) при нулевой активности TET не меняются. Сигналы oxBS-seq и бисульфита поэтому не снижаются, а немного растут: 5mC больше не окисляется.", "p1a_3_w2": "Вариант сохраняет разность методов. Бисульфит читает 5mC и 5hmC вместе, а oxBS-seq — только 5mC (Booth 2012), поэтому разность равна доле 5hmC. Без TET 5hmC не образуется (сигнал TAB-seq 0,04 %), и разность практически исчезает: при округлении оба сигнала составляют 74 %.", "p1a_4_q": "В метилированном CpG-острове делящихся клеток с первого деления присутствует децитабин; остальные процессы не меняются. Как изменятся через 4 деления доли диад MM и MU и сигнал бисульфита?", "p1a_4_o1": "Доли MM и MU снижаются, а сигнал бисульфита падает сразу и целиком: децитабин удаляет метку независимо от репликации.", "p1a_4_o2": "Доля MM снижается, доля MU растёт, сигнал бисульфита снижается постепенно: децитабин ослабляет копирование метки.", "p1a_4_o3": "Доля MM почти не меняется, а сигнал бисульфита остаётся высоким: децитабин ослабляет только метилирование de novo.", "p1a_4_k": "Децитабин включается в ДНК при репликации и ковалентно захватывает DNMT; без репликации включения нет. С каждым делением активной DNMT1 становится меньше, метка на новой цепи появляется реже, и накапливаются диады MU.", "p1a_4_e": "В модели децитабин с первого деления снижает активность копирования: к 4-му делению она составляет 9 % нормы, а вероятность метки на новой цепи при метилированной старой (Em) снижается с 96 % до 37 %; Ed (17 %) не меняется. Доля MM снижается с 63 % до 16 %, доля MU растёт с 11 % до 37 %, доля UU — с 27 % до 47 %; сигнал бисульфита снижается с 70 % до 36 %. Включение 5-аза-2′-дезоксицитидина в ДНК при репликации и снижение метилирования описаны в клетках мыши (Jones 1980), а образование ковалентной связи с ДНК-цитозин-метилтрансферазой — in vitro для бактериальной метилтрансферазы HpaII (Santi 1984); токсичность в клетках млекопитающих в основном вызвана захватом фермента, а не деметилированием (Jüttermann 1994). Скорость убывания активности в модели подобрана, а не измерена; токсичность модель не рассчитывает.", "p1a_4_w1": "Вариант считает, что децитабин удаляет метку независимо от репликации. Децитабин должен включиться в ДНК при репликации, поэтому без деления эффекта нет, а с каждым делением он нарастает. Старая цепь сохраняет 5mC, и сначала растёт доля MU (с 11 % до 37 %), поэтому сигнал бисульфита снижается постепенно, до 36 % к 4-му делению.", "p1a_4_w3": "Вариант ограничивает действие децитабина метилированием de novo. Децитабин захватывает DNMT, а копирование метки на новую цепь зависит от DNMT1: в модели он снижает именно копирование (Em с 96 % до 37 %), и доля MM падает с 63 % до 16 %. Захват DNMT3A/B модель не учитывает (допущение).", "p1a_5_q": "В клетках с метилированным CpG-островом активность TDG (вырезание 5fC и 5caC) снижают до нуля; TET и остальные процессы не меняются. Как изменятся через 6 делений доля 5fC и 5caC от исходных 5mC и сигналы TAB-seq (5hmC) и бисульфита?", "p1a_5_o1": "Доля формилцитозина и карбоксилцитозина растёт, а сигнал бисульфита не меняется: он читает эти формы как цитозин.", "p1a_5_o2": "Сигнал TAB-seq растёт вместе с сигналом бисульфита: без TDG накапливается и гидроксиметилцитозин, который она вырезает.", "p1a_5_o3": "Доля формилцитозина и карбоксилцитозина не меняется, а сигнал бисульфита растёт: он читает эти формы как метилированные.", "p1a_5_k": "TET образует 5fC и 5caC, а TDG вырезает их, и последующая эксцизионная репарация оснований возвращает цитозин. Без TDG вырезания нет, и 5fC и 5caC накапливаются по мере делений. Сигналы 5hmC и бисульфита не меняются: 5hmC не входит в число субстратов TDG, а бисульфит читает 5fC и 5caC как неметилированный цитозин.", "p1a_5_e": "В модели при нулевой активности TDG через 6 делений доля 5fC и 5caC от исходных 5mC растёт с 0,06 % до 0,6 %, а сигналы TAB-seq (5hmC, 2,4 %) и бисульфита (70 %) не меняются. Абсолютная доля мала: 5fC и 5caC образуются из 5hmC, которой в модели порядка процентов, а в ЭСК мыши 5fC и 5caC в десятки и сотни раз реже 5hmC (расчёт из данных Ito 2011). Скорость вырезания в норме принята быстрой (допущение: чисел для неё в использованных рефератах нет; в опытах in vitro TDG быстро вырезает 5fC и 5caC, Maiti 2011), поэтому масштаб накопления условен. В ЭСК мыши 5fC и 5caC накапливаются на регуляторных элементах при подавлении TDG (Shen 2013); нокаут Tdg у мыши летален для эмбриона (Cortázar 2011). Бисульфит читает 5fC и 5caC как неметилированный цитозин (Booth 2014; Lu 2013), поэтому их выявляют отдельными методами (redBS-seq, CAB-seq).", "p1a_5_w2": "Вариант приписывает TDG вырезание 5hmC. В использованных работах субстратами TDG названы 5fC и 5caC (He 2011; Maiti 2011), а 5hmC среди них нет, поэтому в модели сигнал TAB-seq остаётся 2,4 %.", "p1a_5_w3": "Вариант считает, что бисульфит учитывает накопленные 5fC и 5caC как метилированные. Бисульфит читает их как неметилированный цитозин (Booth 2014; Lu 2013), поэтому его сигнал остаётся 70 %, а рост доли 5fC и 5caC с 0,06 % до 0,6 % виден только специальными методами.", "p1a_6_q": "В домене PMD в начальный момент (0 делений) заданы доли диад, воздействий нет. Как изменятся через 12 делений доли диад MM и MU и сигнал бисульфита?", "p1a_6_o1": "Доли диад и сигнал бисульфита не меняются: без воздействий метилирование района остаётся стационарным.", "p1a_6_o2": "Доля MM и сигнал бисульфита растут: метилирование de novo с каждым делением добавляет новые метки.", "p1a_6_o3": "Доля MM и сигнал бисульфита снижаются, доля MU почти не меняется: de novo не возмещает потерь.", "p1a_6_k": "В домене PMD метилирование de novo слабо, поэтому потери метилирования при неполном копировании возмещаются лишь частично, и доля метилированных диад убывает с каждым делением даже без воздействий. Убыль следует за числом делений, а не за временем.", "p1a_6_e": "В модели PMD (Em и Ed допущены, потому что чисел для PMD в использованных работах нет) за 12 делений доля MM снижается с 69 % до 54 %, доля UU растёт с 24 % до 41 %, доля MU остаётся около 6 %; сигнал бисульфита снижается с 75 % до 58 %. Это направление наблюдали в доменах PMD: потеря метилирования нарастает с числом делений, следует за числом удвоений популяции первичных клеток человека, замедляется при замедлении цикла и останавливается при блокаде репликации митомицином C (Zhou 2018; Endicott 2022). Скорость потери в модели — допущение: значения Em и Ed подобраны, а не измерены; часть потери в клетках может идти при внеплановой окислительной репарации (Endicott 2022).", "p1a_6_w1": "Вариант считает метилирование стационарным без воздействий. Оно стационарно, если потери при неполном копировании возмещаются: в острове с высокой Ed это так, а в домене PMD Ed мала (5 %), и при Em, меньшей 100 %, доля MM убывает с каждым делением (с 69 % до 54 %).", "p1a_6_w2": "Вариант приписывает метилированию de novo накопление метки. При Ed 5 % оно ставит метку на новую цепь редко и возмещает лишь часть потерь копирования, поэтому доля MM убывает, а не растёт. Рост был бы возможен, если бы Ed превышала значение, при котором потери копирования возмещаются; в этом районе это не так.", "p1a_7_q": "В клетках с метилированным CpG-островом метилирующий потенциал снижен из-за уменьшения SAM (состояние «до»). Затем вместо снижения SAM повышают SAH (продукт метилтрансферазной реакции); остальные процессы не меняются. Как изменятся через 8 делений доля MM и сигнал бисульфита по сравнению с состоянием «до»?", "p1a_7_o1": "Доля MM и сигнал бисульфита остаются прежними: SAM и SAH одинаково определяют метилирующий потенциал.", "p1a_7_o2": "Доля MM и сигнал бисульфита снижаются сильнее: повышение SAH действует сильнее снижения SAM.", "p1a_7_o3": "Доля MM и сигнал бисульфита растут: SAH — продукт реакции и метилированию не препятствует.", "p1a_7_k": "SAM — донор метильной группы для DNMT, а SAH — продукт метилтрансферазной реакции. В модели метилирующий потенциал (g) снижает вероятности метки Em и Ed: при сниженном SAM g составляет 0,95 и мало меняет метилирование, при повышенном SAH — 0,67 и заметно снижает его.", "p1a_7_e": "В модели метилирующий потенциал g — безразмерный множитель вероятностей метки: при сниженном SAM g = 0,95, при повышенном SAH g = 0,67 (принято: SAH вдвое выше нормы и ингибирование продуктом); это допущения построителя, не измерения. Через 8 делений при сниженном SAM вероятности метки Em и Ed составляют 95 % и 16 %, доля MM — 61 %, сигнал бисульфита — 68 %; при повышенном SAH Em и Ed снижаются до 88 % и 12 %, доля MM — до 44 %, сигнал бисульфита — до 52 %, а доля UU растёт с 28 % до 43 %. Направление взято из работы на мышах CBS⁺/⁻ на метил-дефицитной диете: снижение SAM само по себе не снижало метилирование ДНК, а рост SAH (отдельно или вместе со снижением SAM) был наиболее последовательно связан с гипометилированием (Caudill 2001); механизм (ингибирование продуктом, недостаток субстрата или оба) в работе обсуждается. Внутриклеточных концентраций SAM и SAH и констант DNMT по SAM в использованных работах нет.", "p1a_7_w1": "Вариант считает SAM и SAH равноценными. В модели небольшое снижение SAM даёт g 0,95 и мало меняет Em и Ed, а рост SAH даёт g 0,67 и заметно снижает их. Направление взято из работы Caudill 2001: снижение SAM само по себе не снижало метилирование ДНК.", "p1a_7_w3": "Вариант считает SAH безразличным продуктом реакции. Метилтрансферазная реакция даёт SAH, и рост SAH связан с гипометилированием ДНК (Caudill 2001; мыши CBS⁺/⁻); в модели повышение SAH снижает g до 0,67 и Em до 88 %, поэтому доля MM не растёт, а снижается.", "p1a_8_q": "Образцы X, Y и Z взяты из CpG-острова с высоким метилированием через 6 делений после воздействия; сигналы измерены бисульфитным секвенированием и oxBS-seq (блот
