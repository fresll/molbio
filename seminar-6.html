медленнее, чем в ядре; это согласуется с замедлением дефосфорилирования FOXO3 при связывании с 14-3-3 (Dobson 2011; Luperchio 2025), и от скорости этого процесса зависят и баланс потоков, и длительность перехода к новому состоянию. В клетках DLD1 ингибиторы PI3K и PKB меняли занятость РНК-полимеразой II и ацетилирование гистонов слабее и медленнее, чем прямая активация FOXO3A3; авторы объясняют это необходимостью дефосфорилирования (Eijkelenboom 2013a). Результат с одним ингибитором согласуется с участием PI3K/AKT; для причинного вывода нужны независимые вмешательства.", "p3b_2_w1": "Вариант предполагает полное исчезновение фосфорилирования. Но ингибитор не отключает AKT целиком (в модели остаётся 10 % активности), а фосфат с уже фосфорилированного белка удаляет только фосфатаза. Поэтому фосфорилирование сохраняется в установившемся состоянии, и возврат FOXO в ядро неполный.", "p3b_2_w2": "Фосфорилирование FOXO киназой AKT замедляет его импорт и ускоряет экспорт. Когда фосфорилирование снижается, баланс потоков смещается к ядру, и доля в ядре растёт; занятость мишени растёт вместе с ней.", "p3b_3_q": "Клетка дикого типа находится при высоком уровне сигнала. Добавили лептомицин B, блокатор экспортина CRM1. Как изменятся доля FOXO в ядре, занятость мишени и синтез РНК мишени?", "p3b_3_o1": "Доля FOXO в ядре станет почти полной, но занятость мишени и синтез РНК останутся ниже, чем при низком сигнале.", "p3b_3_o2": "Лептомицин B блокирует вход в ядро, поэтому доля FOXO в ядре снизится, а синтез РНК мишени упадёт ещё сильнее.", "p3b_3_o3": "FOXO окажется в ядре почти целиком, поэтому занятость мишени и синтез РНК станут такими же, как при низком сигнале.", "p3b_3_k": "Лептомицин B блокирует экспорт FOXO белком CRM1, и FOXO накапливается в ядре почти целиком. Но AKT остаётся активной, FOXO фосфорилирован, а фосфорилированный белок хуже связывается с ДНК, поэтому занятость мишени и синтез РНК остаются низкими.", "p3b_3_e": "В модели доля FOXO в ядре растёт с 13 % до 100 %, а занятость мишени — лишь с 3 % до 13 %, что заметно ниже, чем в эталонной клетке; синтез РНК мишени поднимается с ×0,22 до ×0,46, то есть остаётся меньше половины эталонного уровня. Лептомицин B быстро накапливает Foxo1-GFP в ядре мышечных волокон, что показывает постоянный экспорт (Schachter 2012), и в клетках SH-SY5Y предотвращает вызванный IGF-I выход GFP-FKHR (Schwab 2005). Фосфорилирование по S256 и связывание с 14-3-3 снижают связывание с ДНК in vitro (Zhang 2002; Obsil 2003); в модели занятость фосфорилированного FOXO принята в двадцать раз меньшей, чем нефосфорилированного (допущение). Опыта «лептомицин B при высоком сигнале» с измерением занятости и РНК в прочитанных работах нет: это прогноз модели.", "p3b_3_w2": "Лептомицин B блокирует CRM1, то есть выход из ядра, а не вход. Без экспорта FOXO накапливается в ядре даже при активной AKT.", "p3b_3_w3": "Накопление в ядре — лишь первое условие активности. Пока AKT фосфорилирует FOXO, белок в ядре связывается с ДНК хуже нефосфорилированного, и занятость мишени и синтез РНК остаются ниже уровня при низком сигнале.", "s3a_mode": "Режим сигнала инсулина / IGF-1", "s3a_mode_none": "Нет", "s3a_mode_step": "Ступень", "s3a_mode_pulse": "Импульс 15 мин", "s3a_mode_removal": "Снятие", "s3a_lvl": "Уровень сигнала (условно, % от максимального)", "s3a_inh": "Ингибитор или блокатор", "s3a_inh_none": "Нет", "s3a_inh_ly": "LY294002", "s3a_inh_allo": "AKT, аллостерический", "s3a_inh_atp": "AKT, АТФ-конкурентный", "s3a_inh_lmb": "Лептомицин B", "s3a_g_in": "Дополнительные входы", "s3a_pten": "Потеря PTEN", "s3a_str": "Стресс-киназы (JNK, MST1)", "s3a_amp": "AMPK активна", "s3a_var": "Вариант FOXO", "s3a_var_wt": "Дикий тип (FOXO1)", "s3a_var_aaa": "FOXO1-AAA", "s3a_var_dbd": "Foxo1-DBD⁻", "s3a_var_foxo6": "FOXO6", "s3a_chr": "Хроматин в районе мишени", "s3a_chr_open": "Открыт", "s3a_chr_closed": "Закрыт", "s3a_drugs_btn": "Препараты и мутанты", "s3a_myst_b0": "Загадка: образцы X, Y, Z", "s3a_myst_b1": "Раскрыть условия образцов", "s3a_myst_b2": "Вернуться к опыту", "s3a_ref": "Серая риска на полосе — эталонная клетка: дикий тип, открытый хроматин, сигнала нет, без препаратов (РНК принята за ×1). Значения — расчёт учебной модели; время на оси — условное.", "s3a_take": "Доля FOXO в ядре, связывание с ДНК и синтез РНК мишени — три разные величины со своими условиями и сроками: в модели активность AKT меняется за минуты, положение FOXO и занятость элемента ДНК — за десятки минут, а синтез РНК — за часы. Ядро — условие, но не гарантия активности: занятость зависит от варианта белка (FOXO6, Foxo1-DBD⁻), состояния хроматина и входов, не меняющих локализацию (AMPK). Результат с одним ингибитором согласуется с участием пути, но для причинного вывода нужен независимый подход, а сигнал pAKT не равен активности AKT. Модель не позволяет заключить, что результат одинаков для любых клеток, тканей и сроков.", "s3a_sg_none": "сигнала нет", "s3a_sg_rem0": "сигнал снят", "s3a_sg_step_on": "ступень {d}", "s3a_sg_step_off": "сигнал низкий", "s3a_sg_pulse_on": "импульс {d}", "s3a_sg_pulse_off": "импульс закончен", "s3a_sg_removal_on": "сигнал {d}", "s3a_sg_removal_off": "сигнал снят", "s3a_blot_t": "Блот: фосфорилирование и фракции FOXO", "s3a_blot_add": "Добавить дорожку", "s3a_blot_clear": "Очистить дорожки", "s3a_blot_hint": "Дорожка фиксирует условия и момент, выбранные сейчас. Блот учебный: полосы нарисованы по расчёту модели; слабая полоса означает «ниже предела обнаружения», а не нулевое содержание; яркость полос двух разных строк сравнивать нельзя.", "s3a_blot_hint_m": "Образцы взяты в один момент. Слабая полоса означает «ниже предела обнаружения», а не нулевое содержание; яркость полос двух разных строк сравнивать нельзя.", "s3a_b_pakt": "pAKT", "s3a_b_pf": "pFOXO", "s3a_b_nuc": "FOXO ядро", "s3a_b_cyt": "FOXO цитопл.", "s3a_b_load": "нагрузка", "s3a_sh_ctl": "контроль", "s3a_sh_ref": "эталон", "s3a_sh_now": "сейчас", "s3a_sh_aaa": "AAA", "s3a_sh_dbd": "DBD⁻", "s3a_sh_foxo6": "FOXO6", "s3a_sh_closed": "закрыт", "s3a_sh_pten": "PTEN⁻", "s3a_sh_step": "ступень", "s3a_sh_pulse": "импульс", "s3a_sh_removal": "снятие", "s3a_sh_ly": "LY", "s3a_sh_allo": "аллост.", "s3a_sh_atp": "АТФ-конк.", "s3a_sh_lmb": "LMB", "s3a_sh_stress": "стресс", "s3a_sh_ampk": "AMPK", "s3a_k_ctl": "контроль — эталонная клетка (дикий тип, сигнала нет, препаратов нет)", "s3a_k_hidden": "образец взят через {t}; условия скрыты", "s3a_dn_ref": "эталонная клетка", "s3a_dn_aaa": "FOXO1-AAA", "s3a_dn_dbd": "Foxo1-DBD⁻", "s3a_dn_foxo6": "FOXO6", "s3a_dn_closed": "хроматин закрыт", "s3a_dn_pten": "потеря PTEN", "s3a_dn_step": "ступень сигнала {d}", "s3a_dn_pulse": "импульс сигнала {d} (15 мин)", "s3a_dn_removal": "снятие сигнала {d}", "s3a_dn_ly": "LY294002", "s3a_dn_allo": "аллостерический ингибитор AKT", "s3a_dn_atp": "АТФ-конкурентный ингибитор AKT", "s3a_dn_lmb": "лептомицин B", "s3a_dn_stress": "стресс-киназы", "s3a_dn_ampk": "AMPK активна", "s3a_after": "через {t}", "s3a_plot1_t": "Положение и связывание FOXO во времени, доля", "s3a_plot2_t": "Новая РНК мишени во времени, относительно эталона", "s3a_lg_nuc": "FOXO в ядре", "s3a_lg_pf": "FOXO с фосфатом AKT", "s3a_lg_chip": "занятость мишени", "s3a_lg_g": "G6PC-подобная", "s3a_lg_p": "PCK1-подобная", "s3a_unit_h": "время, ч (учебная модель)", "s3a_tb_cap": "Значения показаний в выбранный момент и в конце опыта", "s3a_tb_name": "Показание", "s3a_tb_now": "в момент {t}", "s3a_tb_end": "в конце ({t})", "s3a_myst_svg1": "Образцы X, Y, Z", "s3a_myst_svg2": "Схема скрыта. Сравните блот и таблицу и определите условия, при которых получены образцы.", "s3a_myst_tt": "Занятость мишени и синтез РНК в образцах", "s3a_tb_sample": "Образец", "s3a_myst_note": "Образцы взяты через {t} после начала опыта. Блот и таблица — расчёт учебной модели.", "s3a_c_myst": "Образцы X, Y и Z получены при разных условиях, которые не названы. Сравните фосфорилирование AKT и FOXO, фракции FOXO, занятость мишени и новую РНК.", "s3a_c_myst_z": "Одно показание подходит нескольким условиям. Положение FOXO, его фосфорилирование и занятость мишени нужно читать вместе, а к ним добавить сведения о том, есть ли сигнал.", "s3a_c_myst2": "Условия образцов. X: {x}. Y: {y}. Z: {z}.", "s3a_c_myst2_z": "У X почти весь FOXO находится в ядре при сильном фосфорилировании, а занятость низка: экспорт заблокирован, но фосфорилированный белок связывается плохо. У Y нет полосы pFOXO при высоком pAKT, а занятость высока: нет сайтов AKT. У Z занятость нулевая при распределении, как в эталонной клетке: нет связывания с ДНК.", "s3a_c_ref": "Эталонная клетка: сигнала нет, AKT малоактивна ({a}). FOXO непрерывно перемещается через ядерную оболочку, в ядре {n} белка; по сайтам AKT фосфорилировано {p}. Занятость мишени {c}, новая РНК G6PC-подобной мишени принята за {r}, PCK1-подобной — за {r2}.", "s3a_c_ref_z": "Это точка отсчёта для всех сравнений: даже без сигнала FOXO не удерживается в ядре целиком, а занятость мишени и синтез её РНК не равны максимуму.", "s3a_c_g_aaa": "FOXO1-AAA не имеет сайтов AKT (T24A/S256A/S319A) и не фосфорилируется ({p}). В ядре {n} белка, занятость мишени {c}; новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_g_aaa_z": "Мутант без сайтов AKT не отвечает на сигнал по линии AKT и остаётся в основном в ядре. Включите сигнал: изменятся активность AKT и сигнал pAKT, а показания FOXO останутся прежними. Ядерная локализация не равна максимальной активности.", "s3a_c_g_dbd": "Foxo1-DBD⁻ не связывается с ДНК: занятость мишени {c}. Распределение и фосфорилирование как у дикого типа: в ядре {n}, фосфорилировано {p}. Новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2} — это часть, не зависящая от FOXO1.", "s3a_c_g_dbd_z": "Белок остаётся в ядре, но не связывается с элементом ДНК: вход в ядро не равен связыванию. Часть эффектов FoxO1 не требует связывания с ДНК, но FOXO-зависимый вклад в синтез РНК G6pc с этим мутантом отсутствует.", "s3a_c_g_foxo6": "У FOXO6 нет третьего сайта AKT и сигнала экспорта (NES), и он остаётся в ядре: {n} белка. Фосфорилировано {p}, занятость мишени {c}; новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_g_foxo6_z": "Включите сигнал: фосфорилирование растёт, занятость мишени падает, а доля в ядре остаётся высокой. У FOXO6 инсулин подавляет активность без смены распределения, поэтому «инсулин выводит FOXO из ядра» верно не для всех FOXO.", "s3a_c_closed": "Хроматин в районе мишени закрыт. Доля FOXO в ядре та же ({n}), но занятость мишени снижена ({c}), и новая РНК меньше: G6PC-подобная {r}, PCK1-подобная {r2}.", "s3a_c_closed_z": "Состояние хроматина до воздействия определяет, свяжется ли FOXO с мишенью: тот же FOXO в ядре даёт разную занятость и разный синтез РНК. В модели FOXO сам закрытый участок не открывает.", "s3a_c_pten": "Без PTEN PIP₃ накапливается, и AKT активна даже без сигнала ({a}). FOXO фосфорилирован ({p}), в ядре {n}; занятость мишени {c}, новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_pten_z": "Потеря фосфатазы PTEN повышает активность AKT независимо от инсулина, и FOXO удерживается в цитоплазме, как при высоком сигнале. Так в части линий опухолевых клеток FOXO функционально инактивирован без мутации самого FOXO.", "s3a_c_stress": "Стресс-киназы (JNK, MST1) ослабляют удержание фосфорилированного FOXO белками 14-3-3: в модели импорт фосфорилированного белка ускорен, экспорт замедлен. Активность AKT не меняется ({a}). В ядре {n}, фосфорилировано {p}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_stress_z": "Эти киназы действуют на FOXO независимо от AKT. Результат зависит от клеток, дозы и времени: в одних опытах стресс активирует FOXO, в других подавляет.", "s3a_c_ampk": "AMPK повышает транскрипционную активность FOXO на единицу занятости и не меняет его положение: в ядре {n}, фосфорилировано {p}, занятость мишени {c}. Новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_ampk_z": "Для FOXO3 в клетках млекопитающих AMPK изменяла активность без смены локализации (Greer 2007a). Другая работа находит участие AMPK и PP2A в ядерной транслокации (Luperchio 2025), поэтому вопрос остаётся спорным.", "s3a_c_lmb": "Лептомицин B блокирует экспорт белком CRM1, и FOXO накапливается в ядре по мере времени: сейчас {n}. Фосфорилировано {p}; занятость мишени ({c}) и новая РНК G6PC-подобной мишени ({r}) не ниже, чем в эталонной клетке.", "s3a_c_lmb_z": "Лептомицин B — инструмент: он показывает, что FOXO непрерывно выходит из ядра. Физиологическим воздействием он не является.", "s3a_c_i_ly": "LY294002 ингибирует PI3K; активность AKT по субстрату {a}. По мере дефосфорилирования FOXO его доля в ядре растёт: сейчас {n}, фосфорилировано {p}. Занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_i_ly_z": "Действие LY294002 не ограничивается PI3K: он подавляет также mTOR и бромодомены BET. Поэтому опыт с одним этим ингибитором не позволяет разделить вклад PI3K/AKT и других мишеней. Возврат FOXO идёт через дефосфорилирование и занимает часы.", "s3a_c_i_allo": "Аллостерический ингибитор подавляет и фосфорилирование AKT, и фосфорилирование её субстратов: pAKT {pa}, активность по субстрату {a}. По мере дефосфорилирования FOXO его доля в ядре растёт: сейчас {n}, фосфорилировано {p}. Занятость мишени {c}.", "s3a_c_i_allo_z": "У ингибиторов этого класса (Akti-1/2, MK-2206) оба показания AKT снижаются согласованно. Для сравнения проверьте АТФ-конкурентный ингибитор.", "s3a_c_i_atp": "АТФ-конкурентный ингибитор подавляет фосфорилирование субстратов AKT (активность по субстрату {a}), но сигнал pAKT ({pa}) выше, чем без ингибитора. По мере дефосфорилирования FOXO его доля в ядре растёт: сейчас {n}, фосфорилировано {p}.", "s3a_c_i_atp_z": "Для ингибитора A-443654 описано парадоксальное повышение фосфорилирования AKT при подавленном фосфорилировании субстратов. Поэтому активность AKT надо судить по субстрату (pFOXO, pGSK3), а не по pAKT.", "s3a_c_step0": "В начале опыта ступень сигнала {d} лишь подана, и состояние ещё исходное: AKT {a}, в ядре {n}, фосфорилировано {p}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_step0_z": "Сдвиньте время: сначала растёт активность AKT, затем меняется положение FOXO, потом занятость мишени и позже всего — синтез РНК.", "s3a_c_step_a": "Через {t} после подачи ступени {d}: активность AKT {a}, фосфорилировано {p}, в ядре {n}, занятость мишени {c}. Новая РНК G6PC-подобной мишени ({r}) отличается от эталона менее чем на десятую часть.", "s3a_c_step_a_z": "Порядок событий в модели: активность AKT меняется за минуты, положение FOXO и занятость мишени — за десятки минут, синтез РНК — за часы. Время на оси — учебное.", "s3a_c_step_b": "Через {t} после подачи ступени {d}: активность AKT {a}, фосфорилировано {p}, в ядре {n}, занятость мишени {c}. Новая РНК G6PC-подобной мишени снижена до {r}, PCK1-подобной — до {r2}.", "s3a_c_step_b_z": "Синтез РНК следует за занятостью с запаздыванием, а PCK1-подобная мишень снижается слабее: в ней больше вклад факторов, не зависящих от FOXO1.", "s3a_c_pulse0": "В начале опыта подан импульс сигнала {d} длительностью 15 минут, состояние ещё исходное: AKT {a}, в ядре {n}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_pulse0_z": "Сдвиньте время: короткий импульс вызывает недолгий ответ, который затухает после снятия сигнала.", "s3a_c_pulse_on": "Идёт импульс сигнала {d}, прошло {t}: активность AKT {a}, фосфорилировано {p}, в ядре {n}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_pulse_on_z": "Активность AKT нарастает за минуты, а положение FOXO и занятость мишени сдвигаются медленнее: за время импульса они смещаются лишь частично.", "s3a_c_pulse_off": "Импульс закончился, прошло {t}: активность AKT {a}, фосфорилировано {p}, в ядре {n}, занятость мишени {c}. Новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_pulse_off_z": "После импульса AKT становится малоактивной за минуты, а дефосфорилирование и возврат FOXO в ядро занимают часы, при этом синтез РНК восстанавливается с ещё большим запаздыванием. Сравните со ступенью той же высоты: через несколько часов ответы на импульс и на ступень различаются.", "s3a_c_removal0": "В начале опыта высокий сигнал снят, но состояние ещё прежнее: AKT {a}, фосфорилировано {p}, в ядре {n}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_removal0_z": "Сдвиньте время: активность AKT падает за минуты, а доля FOXO в ядре возвращается дольше.", "s3a_c_removal_a": "Сигнал снят, прошло {t}: активность AKT {a}, фосфорилировано {p}, в ядре {n}, то есть меньше половины белка. Занятость мишени {c}, новая РНК G6PC-подобной мишени {r}.", "s3a_c_removal_a_z": "Возврат FOXO в ядро идёт медленнее, чем падает активность AKT: фосфат снимает фосфатаза PP2A, а белок, связанный в цитоплазме с 14-3-3, дефосфорилируется ещё медленнее.", "s3a_c_removal_b": "Сигнал снят, прошло {t}: активность AKT {a}, фосфорилировано {p}, в ядре {n}. Занятость мишени {c}, новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_removal_b_z": "Положение FOXO, занятость мишени и синтез РНК возвращаются к исходным значениям по очереди, каждое со своим запаздыванием. Время на оси — учебное, а не измеренное.", "s3a_c_multi": "Включено несколько воздействий: {list}. Показания — расчёт модели для всей комбинации: активность AKT {a}, в ядре {n}, фосфорилировано {p}, занятость мишени {c}, новая РНК G6PC-подобной мишени {r}, PCK1-подобной {r2}.", "s3a_c_multi_z": "Вклад каждого воздействия по этой подписи не разделить. Чтобы приписать сдвиг одной причине, включайте воздействия по одному и сравнивайте с эталоном.", "s3a_pair_step_atp": "Ступень и АТФ-конкурентный ингибитор: сигнал pAKT ({pa}) выше, чем при ступени без ингибитора, а активность по субстрату ({a}) ниже; доля FOXO в ядре следует за активностью по субстрату, а не за pAKT.", "s3a_pair_aaa_ly": "FOXO1-AAA и LY294002: сайтов AKT нет, но в модели LY294002 повышает связывание такого белка с ДНК, поэтому занятость мишени ({c}) со временем растёт и становится выше, чем у FOXO1-AAA без ингибитора. Это 14-3-3-независимое действие LY294002 (Cahill 2001, ядерные мутанты DAF-16 в клетках HepG2); механизм не установлен.", "s3a_pair_foxo6_step": "FOXO6 и сигнал: у FOXO6 фосфорилирование ({p}) и занятость мишени ({c}) зависят от активности AKT, а положение белка от неё почти не зависит: в ядре {n}.", "s3a_pair_step_stress": "Ступень и стресс-киназы: стресс-киназы не меняют активность AKT ({a}), но ослабляют удержание фосфорилированного FOXO белками 14-3-3 и со временем сдвигают баланс потоков к ядру относительно ступени без них (сейчас в ядре {n}).", "s3a_when": "Прогноз — на момент 4 ч от начала воздействий; ось времени — учебная модель, а не измеренные часы.", "s3a_when_r": "Прогноз — на момент 1 ч после снятия сигнала; ось времени — учебная модель, а не измеренные часы.", "s3a_when_m": "Образцы взяты через 4 ч от начала опыта; ось времени — учебная модель, а не измеренные часы.", "p3a_1_q": "Ступень высокого сигнала подали одновременно с АТФ-конкурентным ингибитором AKT (тип A-443654) и сравнили с ответом на ту же ступень без ингибитора. Как через 4 ч изменятся сигнал pAKT (pT308/pS473), активность AKT по субстрату и доля FOXO, фосфорилированного по сайту AKT?", "p3a_1_o1": "Сигнал pAKT и активность по субстрату снизятся вместе, а фосфорилирование FOXO упадёт почти до нуля.", "p3a_1_o2": "Сигнал pAKT вырастет, а активность по субстрату упадёт; фосфорилирование FOXO снизится, но останется заметным.", "p3a_1_o3": "Сигнал pAKT вырастет, и с ним вырастет активность по субстрату, поэтому фосфорилирование FOXO усилится.", "p3a_1_k": "Ингибитор занимает АТФ-центр AKT и блокирует перенос фосфата на субстраты, в том числе на FOXO. При этом сама AKT оказывается более фосфорилированной по T308 и S473, поэтому сигнал pAKT растёт, хотя активность по субстрату падает.", "p3a_1_e": "В модели сигнал pAKT растёт со 100 % до 170 % от уровня при высоком сигнале без ингибитора, активность по субстрату падает со 100 % до 10 %, а доля FOXO, фосфорилированного по сайту AKT, — с 95 % до 63 %. АТФ-конкурентные ингибиторы (A-443654, GSK690693, AZD5363) снижают фосфорилирование субстратов AKT, включая GSK3β, PRAS40 и белки Forkhead (Rhodes 2008; Davies 2012), а для A-443654 описан парадоксальный рост фосфорилирования AKT по T308 и S473 (Okuzumi 2009). Это свойство отдельных ингибиторов класса, и рост pAKT в 1,7 раза в модели — допущение. Поэтому активность AKT оценивают по фосфорилированию субстратов (pGSK3, pFOXO), а не по pAKT. Фосфорилирование FOXO остаётся, так как сохраняются 10 % активности, а дефосфорилирование идёт медленно.", "p3a_1_w1": "Сигнал pAKT здесь не следует за активностью: АТФ-конкурентный ингибитор связывается с каталитическим центром, и для A-443654 описан рост фосфорилирования самой AKT. Фосфорилирование FOXO тоже не падает до нуля: часть активности и медленное дефосфорилирование сохраняют его.", "p3a_1_w3": "Активность AKT определяется переносом фосфата на субстраты, а не уровнем pAKT. Ингибитор блокирует этот перенос, поэтому при росте pAKT фосфорилирование FOXO снижается, а не усиливается.", "p3a_2_q": "В клетках с FOXO1-AAA, у которого нет сайтов AKT, сигнала инсулина нет. Добавили ингибитор PI3K LY294002. Как изменятся фосфорилирование FOXO по сайту AKT, занятость мишени и синтез РНК мишени?", "p3a_2_o1": "Фосфорилирование останется нулевым, но занятость мишени и синтез РНК вырастут: LY294002 действует и помимо AKT.", "p3a_2_o2": "Ничего не изменится: у FOXO1-AAA нет сайтов AKT, поэтому ингибитор PI3K не может повлиять на этот белок.", "p3a_2_o3": "Занятость мишени и синтез РНК снизятся, так как подавление PI3K уменьшает активность любых форм FOXO.", "p3a_2_k": "У FOXO1-AAA нет сайтов AKT, поэтому ингибитор PI3K не меняет его фосфорилирование по этим сайтам. Но действие LY294002 не ограничивается путём через AKT: у ядерных мутантов DAF-16 он повышал связывание с ДНК независимо от 14-3-3, и в модели занятость мишени растёт.", "p3a_2_e": "У FOXO1-AAA доля белка, фосфорилированного по сайту AKT, равна 0 % до и после ингибитора, но занятость мишени растёт с 47 % до 64 %, а синтез РНК G6PC-подобной мишени — с ×1,3 до ×1,6. В Cahill 2001 ядерные мутанты DAF-16 без сайтов AKT и 14-3-3, экспрессированные в клетках HepG2, отвечали на LY294002 ростом связывания с ДНК и транскрипции; механизм не установлен. LY294002 подавляет также mTOR и бромодомены BET (Brunn 1996; Dittmann 2014), поэтому опыт с одним этим ингибитором не позволяет разделить вклад PI3K, AKT и других мишеней. Перенос эффекта на FOXO1-AAA и его величина (двукратное повышение связывания) — допущения модели.", "p3a_2_w2": "Отсутствие сайтов AKT не означает, что ингибитор не влияет на белок. LY294002 подавляет не только PI3K, а у ядерных мутантов DAF-16 повышал связывание с ДНК независимо от AKT; опыт с одним ингибитором эти эффекты не разделяет.", "p3a_2_w3": "У дикого типа подавление PI3K снижает активность AKT и возвращает FOXO в ядро. У белка без сайтов AKT этот путь отсутствует, а наблюдаемое действие LY294002 направлено в сторону повышения связывания с ДНК, а не снижения.", "p3a_3_q": "Сравнивают две клетки дикого типа без сигнала: в одной хроматин в районе мишени открыт, в другой закрыт. Чем будут отличаться доля FOXO в ядре, занятость мишени и синтез РНК мишени в клетке с закрытым хроматином от тех же показателей в клетке с открытым хроматином?", "p3a_3_o1": "Все три величины не изменятся: FOXO находится в ядре, значит, он связывается с мишенью и обеспечивает синтез РНК.", "p3a_3_o2": "Занятость мишени снизится, а синтез РНК не изменится, так как его целиком определяют другие факторы транскрипции.", "p3a_3_o3": "Доля FOXO в ядре не изменится, а занятость мишени и синтез РНК снизятся, хотя ядро содержит тот же FOXO.", "p3a_3_k": "Закрытый хроматин ограничивает доступ FOXO к элементу ДНК, поэтому занятость падает, хотя положение белка в клетке не меняется. Синтез РНК следует за занятостью и сохраняет лишь часть, не зависящую от FOXO.", "p3a_3_e": "Доля FOXO в ядре остаётся 62 %, занятость мишени падает с 37 % до 8 %, а синтез РНК G6PC-подобной мишени — с ×1,0 до ×0,34. В клетках DLD1 FOXO3 связывается главным образом с наиболее активными энхансерами, и уровень активности хроматина до воздействия определяет связывание (Eijkelenboom 2013b). В клетках HepG2 связывание FoxO1 и FoxA1/A2 с промоторами IGFBP1 и G6PC взаимозависимо (Yalley 2016). Связывание не равно синтезу РНК: оставшийся синтез определяют другие факторы. Множитель доступности закрытого района (в несколько раз меньше, чем у открытого) — допущение модели.", "p3a_3_w1": "Нахождение в ядре — лишь первое условие. Связывание зависит ещё от доступности элемента ДНК: при закрытом хроматине тот же FOXO в ядре занимает мишень хуже, поэтому занятость и синтез РНК снижаются.", "p3a_3_w2": "В модели основная часть синтеза РНК G6PC-подобной мишени зависит от FOXO, поэтому снижение занятости уменьшает синтез. Сохраняется лишь вклад других факторов, и он не равен всему синтезу.", "p3a_4_q": "Ступень высокого сигнала подали клеткам с FOXO1 дикого типа и клеткам с FOXO6, у которого нет третьего сайта AKT и сигнала экспорта NES. Как у FOXO6 по сравнению с FOXO1 изменятся через 4 ч доля в ядре, фосфорилирование по сайту AKT и занятость мишени?", "p3a_4_o1": "Доля в ядре станет почти полной, хотя белок остаётся фосфорилированным; занятость мишени при этом останется низкой.", "p3a_4_o2": "FOXO6 не фосфорилируется инсулином, поэтому доля в ядре, фосфорилирование и занятость будут как при низком сигнале.", "p3a_4_o3": "Доля в ядре останется низкой, как у FOXO1: инсулин выводит из ядра все формы FOXO, и занятость мишени тоже.", "p3a_4_k": "У FOXO6 нет третьего сайта AKT и сигнала экспорта, поэтому он остаётся в ядре даже после фосфорилирования. Фосфорилирование по сайтам AKT всё же снижает связывание с ДНК, и занятость мишени остаётся низкой.", "p3a_4_e": "При одинаковом высоком сигнале ядерная доля FOXO6 составляет 99 %, а FOXO1 — 13 %. Доля фосфорилированного FOXO6 составляет 89 % против 95 % у FOXO1. Занятость мишени остаётся низкой: 13 % у FOXO6 против 3 % у FOXO1. Фосфорилирование в модели идёт так же, но в ядре дефосфорилирование быстрее, чем в цитоплазме, где FOXO1 удерживает 14-3-3. FOXO6 лишён высококонсервативного участка с несколькими сайтами фосфорилирования и остаётся в ядре после стимуляции ростовыми факторами (Jacobs 2003); в гепатоцитах инсулин фосфорилирует FoxO6 и подавляет его транскрипционную активность без изменения распределения (Kim 2011). Значение занятости 13 % — расчёт модели.", "p3a_4_w2": "Инсулин фосфорилирует и FOXO6: у него нет только третьего сайта и сигнала экспорта. Поэтому фосфорилирование сохраняется, а занятость мишени остаётся ниже, чем при низком сигнале; меняется не положение белка, а его связывание с ДНК.", "p3a_4_w3": "Положение в ядре зависит от баланса импорта и экспорта. У FOXO6 нет сигнала экспорта, поэтому фосфорилирование не уводит белок в цитоплазму; вывод «инсулин выводит из ядра все формы FOXO» неверен.", "p3a_5_q": "На клетки действует постоянный высокий сигнал. Дополнительно активированы стресс-киназы JNK и MST1. Как изменятся сигнал pAKT, доля FOXO в ядре и занятость мишени через 4 ч?", "p3a_5_o1": "Стресс-киназы подавляют AKT: сигнал pAKT снизится, и вслед за этим FOXO вернётся в ядро и займёт мишень.", "p3a_5_o2": "Стресс-киназы не влияют на FOXO, пока активна AKT, поэтому все три показателя останутся прежними.", "p3a_5_o3": "Сигнал pAKT не изменится, а доля FOXO в ядре и занятость мишени вырастут, хотя AKT остаётся активной.", "p3a_5_k": "JNK и MST1 фосфорилируют FOXO по другим остаткам, чем AKT, и ослабляют связывание с 14-3-3, поэтому фосфорилированный FOXO хуже удерживается в цитоплазме и чаще входит в ядро. AKT при этом остаётся активной, и сигнал pAKT не меняется.", "p3a_5_e": "Сигнал pAKT остаётся 100 %, доля FOXO в ядре растёт с 13 % до 53 %, занятость мишени — с 3 % до 17 %. MST1 фосфорилирует консервативный остаток в forkhead-домене FOXO, нарушает связывание с 14-3-3 и способствует ядерной транслокации в первичных нейронах при окислительном стрессе (Lehtinen 2006); JNK при слабом H2O2 фосфорилирует FOXO4 (Essers 2004). Направление эффекта зависит от клеток, дозы и времени: H2O2 может и подавлять FOXO через p66shc (Nemoto 2002), а в клетках MCF7 ответ отдельных клеток на H2O2 идёт по принципу «всё или ничего» (Lasick 2023). Объединение двух киназ в один вход и кратности — допущения модели.", "p3a_5_w1": "Стресс-киназы действуют на FOXO, а не на AKT: в модели активность AKT не меняется, и сигнал pAKT остаётся прежним. FOXO возвращается в ядро из-за ослабления удержания белками 14-3-3.", "p3a_5_w2": "Активная AKT удерживает FOXO в цитоплазме через 14-3-3, но стресс-киназы ослабляют это удержание независимо от AKT. Поэтому их влияние заметно именно при высокой активности AKT.", "p3a_6_q": "В одном опыте на клетки действует постоянный высокий сигнал, а в другом тот же сигнал подают только на 15 мин (импульс). Как через 4 ч от начала опыта доля FOXO в ядре, занятость мишени и синтез РНК после импульса будут отличаться от тех же показателей при постоянном сигнале?", "p3a_6_o1": "Показатели останутся такими же, как при ступени: короткий сигнал фосфорилирует весь FOXO, а дефосфорилирование занимает много часов.", "p3a_6_o2": "Все три показателя ближе к эталону, чем при ступени: FOXO дефосфорилируется, а синтез РНК восстанавливается с запаздыванием.", "p3a_6_o3": "Доля FOXO в ядре вернётся к исходной, а занятость мишени и синтез РНК останутся такими же низкими, как при ступени.", "p3a_6_k": "После 15-минутного импульса активность AKT быстро возвращается к исходной; фосфатаза снимает фосфат, FOXO возвращается в ядро и занимает мишень, а синтез РНК следует за этим с запаздыванием. При ступени AKT остаётся активной, и все показатели остаются сдвинутыми.", "p3a_6_e": "При ступени через 4 ч в ядре 13 %, занятость мишени 3 %, а новая РНК G6PC-подобной мишени — ×0,30. После импульса в ядре 60 %, занятость 35 %, РНК ×0,87: показатели близки к эталону, но РНК, отстающая от занятости, ещё немного ниже. Форма сигнала влияет на ответ. В клетках гепатомы крысы FAO импульс инсулина и устойчивый стимул кодируются в кратковременное и устойчивое фосфорилирование AKT, которые декодируют разные мишени (Kubota 2012; Noguchi 2013); FOXO в этих работах не измеряли, поэтому перенос на FOXO — предположение модели.", "p3a_6_w1": "Короткий сигнал действует недолго: активность AKT возвращается к исходной за минуты после его снятия, фосфорилирование FOXO не поддерживается, и за 4 ч белок возвращается в ядро.", "p3a_6_w3": "РНК следует за занятостью мишени, а не наоборот. К 4 ч занятость тоже возвращается почти к исходному уровню, поэтому синтез РНК лишь немного ниже эталона: запаздывание РНК измеряется часами, но здесь оно мало заметно.", "p3a_7_q": "Клетки долго находились при высоком сигнале, затем сигнал сняли. Как изменятся через 1 ч после снятия сигнал pAKT, доля FOXO в ядре и доля FOXO, фосфорилированного по сайту AKT?", "p3a_7_o1": "Все три показателя вернутся к исходным значениям: FOXO дефосфорилируется и входит в ядро сразу после падения pAKT.", "p3a_7_o2": "Фосфорилирование FOXO снизится быстрее, чем сигнал pAKT, потому что фосфатазы действуют быстрее киназ, а доля в ядре вернётся.", "p3a_7_o3": "Сигнал pAKT почти исчезнет, а FOXO останется в основном фосфорилированным, и доля в ядре вернётся лишь частично.", "p3a_7_k": "Активность AKT и сигнал pAKT падают за минуты после снятия сигнала, но фосфат с FOXO снимает фосфатаза PP2A, а в цитоплазме 14-3-3 замедляет этот процесс. Поэтому фосфорилирование FOXO и его возврат в ядро запаздывают за сигналом pAKT.", "p3a_7_e": "Сигнал pAKT падает со 100 % до 3 %, доля FOXO в ядре растёт с 13 % до 32 %, а доля фосфорилированного белка снижается лишь с 95 % до 65 %. Латентность активации AKT около 2 мин, полумаксимум — 5–8 мин (Gross 2016): в модели активность AKT выходит на новое значение за минуты (для снятия сигнала это допущение), а перераспределение FOXO занимает часы. 14-3-3 замедляет дефосфорилирование FOXO3 (Dobson 2011), а фосфатаза PP2A участвует в ядерной транслокации (Luperchio 2025). Это согласуется с наблюдением, что возврат FOXO1 в ядро после снижения сыворотки в клетках MCF7 занимает часы и сильно различается у отдельных клеток (Lasick 2023), но времена для разных систем и воздействий несопоставимы.", "p3a_7_w1": "Возврат занимает не минуты: дефосфорилирование идёт медленнее, чем падает активность AKT, а связывание с 14-3-3 в цитоплазме замедляет его ещё сильнее. Через час доля фосфорилированного FOXO остаётся заметной.", "p3a_7_w2": "Активность AKT спадает за минуты, а дефосфорилирование занимает часы, поэтому доля фосфорилированного FOXO снижается медленнее, чем сигнал pAKT. Фосфатаза удаляет фосфат с FOXO медленнее, чем киназа теряет активность.", "p3a_8_q": "Образцы X, Y и Z взяты через 4 ч от начала опыта при трёх разных условиях; названия условий скрыты. Сравните pAKT, pFOXO, фракции FOXO, занятость мишени и РНК. Какому условию соответствует образец X?", "p3a_8_o1": "Образец X: FOXO1 дикого типа, высокий сигнал инсулина и добавленный лептомицин B.", "p3a_8_o2": "Образец X: FOXO1-AAA без сайтов AKT, высокий сигнал инсулина, препаратов нет.", "p3a_8_o3": "Образец X: Foxo1-DBD⁻ без ДНК-связывающей активности, сигнала и препаратов нет.", "p3a_8_k": "В образце X высоки pAKT и pFOXO (сигнал есть, FOXO фосфорилирован), ядерная фракция почти полная, а занятость мишени низка: так выглядит фосфорилированный FOXO дикого типа с заблокированным экспортом.", "p3a_8_e": "В X сильные полосы pAKT и pFOXO и почти полная ядерная фракция, а занятость мишени всего 13 %, новая РНК G6PC-подобной мишени ×0,49: лептомицин B блокирует экспорт, и фосфорилированный белок накапливается в ядре, но связывается с ДНК плохо. В Y полосы pFOXO нет при высоком pAKT, ядерная фракция велика, занятость высока — 47 %, РНК ×1,3: так выглядит FOXO1-AAA. В Z pAKT слабый, фракции FOXO как в эталонной клетке, занятость 0 %, РНК ×0,15 (G6PC-подобная) и ×0,60 (PCK1-подобная): остаётся часть синтеза, не зависящая от FOXO1, как в гепатоцитах мыши с Foxo1, не связывающимся с ДНК (Cook 2015). Вывод опирается на сочетание показаний: каждое по отдельности подходит более чем одному образцу.", "p3a_8_w2": "У FOXO1-AAA нет сайтов AKT, поэтому полоса pFOXO у такого образца отсутствовала бы, а у X она есть. Занятость у AAA была бы высокой, как у Y, а у X она низкая.", "p3a_8_w3": "У DBD⁻ занятость нулевая, а у X она заметна — 13 %. Кроме того, у X сильная полоса pAKT: сигнал был, а у образца без сигнала, как Z, pAKT слабый.", "gn_f_signal": "Сигнал инсулина / IGF-1", "g_f_signal": "Полоса показывает уровень сигнала инсулина или IGF-1, который в модели задаёт активность PI3K и AKT: «низкий», «средний» и «высокий» — условные положения настройки, а не концентрации гормона. Инсулин даёт устойчивую активность AKT, а EGF и PDGF-AA — кратковременную (Gross 2016, живая визуализация единичных клеток), поэтому в сцене «сигнал» относится именно к инсулину и IGF-1. В гепатоците есть и входы, смещающие FoxO1 в противоположную сторону: глюкагон и cAMP через Ca²⁺ и CaMKII способствуют ядерной локализации FoxO1 при голодании (Ozcan 2012, мышь), но здесь они не моделируются.", "gn_f_receptor": "Рецептор инсулина / IGF-1", "g_f_receptor": "Рецептор инсулина и рецептор IGF-1 (IGF1R) — тирозинкиназы плазматической мембраны; после связывания гормона они запускают образование PIP₃ киназой PI3K. В модели у рецептора нет собственной динамики: ответ AKT на уровень сигнала задан одной функцией насыщения, а время выхода активности AKT на новое значение (t½ около 5 мин) по порядку взято из опытов с единичными клетками (Gross 2016: латентность около 2 мин, полумаксимальный пик за 5–8 мин). Сам FOXO повышает экспрессию рецептора инсулина и IRS2 в печени мыши (Kamagate 2010); авторы рассматривают это как обратную связь, усиливающую инсулиновый сигнал, но в сцене она не учитывается.", "gn_f_pi3k": "PI3K и PIP₃", "g_f_pi3k": "Киназа PI3K фосфорилирует липид PIP₂ по положению 3 инозитольного кольца, и образующийся PIP₃ привлекает к мембране киназы PDK1 и AKT. Для максимальной активации AKT нужны фосфорилирование T308 киназой PDK1, зависящее от PIP₃, и фосфорилирование S473 комплексом mTORC2 (Alessi 1997; Sarbassov 2005). Ингибиторы PI3K (LY294002, вортманнин) снижают образование PIP₃, но действуют и на другие мишени, например на mTOR (Brunn 1996); подробнее — в карточке LY294002.", "gn_f_pten": "PTEN", "g_f_pten": "Фосфатаза PTEN дефосфорилирует PIP₃ по положению 3 инозитольного кольца и тем самым снижает активацию AKT (Maehama 1998). При потере PTEN фосфорилирование AKT остаётся повышенным постоянно (Stambolic 1998, фибробласты мыши Pten−/−), а в PTEN-дефицитных опухолевых линиях FKHR цитоплазматичен, и восстановление PTEN возвращает его в ядро (Nakamura 2000). В модели при потере PTEN нижний уровень активности AKT повышен до 60 % от максимума: в работах измерено направление, число подобрано. Цитоплазматическое положение FOXO в опухоли не всегда объясняется PTEN: FOXO3 удерживается в цитоплазме и в опухолях без pAKT, где его фосфорилирует киназа IKK (Hu 2004).", "gn_f_akt": "AKT (PKB)", "g_f_akt": "Серин-треониновая киназа AKT в модели задаёт скорость фосфорилирования FOXO по трём сайтам AKT; под рамкой показана её активность по субстрату. AKT фосфорилирует FOXO1 человека по T24, S256 и S319 (Rena 1999; Tang 1999) и FOXO3 человека по T32, S253 и S315 (Brunet 1999); у FOXO4 в литературной нумерации это T28 и S193 (в UniProt на 4 больше; Obsil 2003). Нумерация зависит от вида: S253 мышиного Foxo1 — то же, что S256 человеческого FOXO1, а S253 человеческого FOXO3 — другой остаток. Сигнал pAKT (T308 и S473) и активность по субстрату могут расходиться, что видно при АТФ-конкурентных ингибиторах. Киназа SGK тоже фосфорилирует FOXO3 по T32 и S315 (Brunet 2001); в сцене этот вход отдельно не показан.", "gn_f_foxo": "FOXO без фосфата AKT", "g_f_foxo": "FOXO — семейство факторов транскрипции с ДНК-связывающим доменом типа «вилки» (forkhead): у человека это белки FOXO1, FOXO3, FOXO4 и FOXO6; FOXO6 как отдельный член группы описан в работе Jacobs 2003 (особенности FOXO6 разобраны в его карточке). Рамка показывает долю всего FOXO, не фосфорилированного по сайтам AKT; такой белок входит в ядро и может связываться с ДНК, но связывание ещё не означает синтез РНК. FOXO перемещается между ядром и цитоплазмой непрерывно: в мышечных волокнах мыши лептомицин B быстро накапливал Foxo1-GFP в ядре, то есть потоки входа и выхода были почти уравновешены (Schachter 2012). Поэтому нефосфорилированный белок есть и в цитоплазме, а доля в ядре при низком сигнале меньше 100 %. Foxo3A в тех же волокнах перемещался примерно в 20 раз медленнее Foxo1, а константы для гепатоцита неизвестны: числа в модели задают порядок и ранги потоков.", "gn_f_foxop": "FOXO, фосфорилированный AKT", "g_f_foxop": "Рамка показывает долю FOXO, фосфорилированного по сайтам AKT: такой белок хуже входит в ядро, быстрее экспортируется, связывается с 14-3-3 и слабее связывается с ДНК. Димер 14-3-3 связывает фосфорилированный белок по двум мотивам (у FOXO1 это T24 и S256, у FOXO4 — T28 и S193), и эта связь значительно прочнее связи по одному сайту (Obsil 2003; Zhao 2004). Фосфат S256 лежит в основной области ДНК-связывающего домена и снижает связывание с ДНК (Zhang 2002; Yalley 2016: имитатор фосфорилирования S→D, нуклеосомы in vitro). Роль 14-3-3 сложнее «маскирования ядерного сигнала»: в клетках 293 связывание с 14-3-3 не обязательно для исключения из ядра, вызванного IGF-1 (Rena 2001), зато 14-3-3 препятствует возвращению в ядро и замедляет дефосфорилирование (Brunet 2002; Dobson 2011). Маскирование сигнала ядерного импорта остаётся гипотезой: структуры такого комплекса нет, а модель по FRET (Silhan 2009) помещает ДНК-связывающий домен FOXO4 в канал димера 14-3-3.", "gn_f_crm1": "Перенос через ядерную оболочку, CRM1", "g_f_crm1": "Стрелки через ядерную оболочку показывают потоки белка в обе стороны: экспорт идёт через экспортин CRM1 и у нефосфорилированного FOXO, а у фосфорилированного белка импорт снижен и экспорт ускорен. AFX (FOXO4) в клетках млекопитающих связывает Crm1 независимо от фосфорилирования, а фосфорилирование S193 в нетипичном сигнале ядерного импорта снижает ядерное накопление (Brownawell 2001). Кластер S319–S329 FOXO1 ускоряет экспорт: после S319 киназа CK1 фосфорилирует S322 и S325 (Rena 2002). Распределение определяют несколько элементов — сигнал ядерного импорта в основной области ДНК-связывающего домена, сигнал экспорта, чувствительный к лептомицину B, и N-концевой участок 1–50 (Zhao 2004), поэтому единого переключателя нет. Толщина и непрозрачность стрелки пропорциональны потоку (доле всего белка в час); значения констант — допущения модели.", "gn_f_el": "Элемент ДНК мишени FOXO", "g_f_el": "Рамка показывает занятость элемента ДНК, с которым связывается FOXO: это ChIP-подобная величина, то есть доля копий элемента, занятых FOXO. Она зависит не только от доли белка в ядре: фосфорилированный FOXO связывается с ДНК слабее (в модели в 20 раз), а состояние хроматина до воздействия определяет связывание — FOXO3 связывается главным образом с наиболее активными энхансерами (Eijkelenboom 2013b, клетки DLD1), и у FOXO1 в клетках HepG2 связывание с FoxA1/A2 взаимозависимо (Yalley 2016). Присутствие у локуса — не синтез РНК: ChIP показывает связывание, а скорость синтеза РНК — следующий этап. Для мишени с закрытым хроматином модель снижает доступность элемента, но не утверждает, что FOXO1 сам открывает такой участок (в Yalley 2016 этого не показано).", "gn_f_rna": "Новая РНК мишени", "g_f_rna": "Мишени в сцене — гены двух ферментов глюконеогенеза печени: G6PC кодирует глюкозо-6-фосфатазу (отщепляет фосфат от глюкозо-6-фосфата, и глюкоза выходит из клетки), PCK1 — цитозольную фосфоенолпируваткарбоксикиназу (превращает оксалоацетат в фосфоенолпируват). Показание отражает скорость синтеза РНК мишени относительно эталонной клетки: она следует за занятостью элемента с запаздыванием порядка часа (допущение; порядок часов — по Eijkelenboom 2013a и Noguchi 2013). G6PC-подобная мишень сильнее зависит от FOXO1, чем PCK1-подобная: в гепатоцитах мыши без FoxO1 индукция G6pc под действием cAMP и дексаметазона снижалась более чем на 80 %, индукция Pck1 — примерно на 40 % (Cook 2015). Это пример одной системы, а не общее правило для печени; в модели соответствующие остаточные доли синтеза РНК (0,15 и 0,6 исходного уровня) заданы как допущение. Часть действия инсулина на гены G6PC и PCK1 не проходит через FOXO (Schmoll 2000; Hall 2007), и в сцене эта часть не моделируется.", "gn_f_ly": "LY294002", "g_f_ly": "LY294002 — ингибитор PI3K (IC50 около 1,4 мкМ in vitro), который снижает фосфорилирование AKT и FOXO; опыт с одним этим препаратом согласуется с зависимостью эффекта от PI3K, но не устанавливает её. LY294002 ингибирует также mTOR (при 1–30 мкМ) и бромодомены BET (Vlahos 1994; Brunn 1996; Dittmann 2014), поэтому для вывода о роли пути PI3K–AKT нужен второй независимый подход: другой ингибитор, siRNA или мутант. В клетках HepG2 LY294002 повышал связывание DAF-16 с ДНК и транскрипцию даже у мутантов без сайтов AKT и 14-3-3, то есть существует эффект, не зависящий от 14-3-3 (Cahill 2001); механизм не установлен. В сцене этот эффект перенесён на FOXO1-AAA (допущение): связывание с ДНК возрастает в 2 раза.", "gn_f_allo": "Аллостерические ингибиторы AKT", "g_f_allo": "Аллостерические ингибиторы AKT (MK-2206, Akti-1/2) зависят от PH-домена и блокируют активацию AKT: снижаются фосфорилирование T308 и S473 и фосфорилирование субстратов (Barnett 2005; Hirai 2010). В клетке неактивная AKT находится в конформации «PH-in» и переходит в «PH-out» при привлечении к мембране (Calleja 2007). В модели оба показания, pAKT и активность по субстрату, снижаются согласованно до 10 % исходного (остаток — допущение), поэтому на блоте полоса pAKT и активность AKT изменяются в одну сторону. Akti-1/2 различают изоформы AKT (Akt1 и Akt2), и в разных клетках нужная доза различается.", "gn_f_atp": "АТФ-конкурентные ингибиторы AKT", "g_f_atp": "АТФ-конкурентные ингибиторы AKT (A-443654, GSK690693, AZD5363, GDC-0068) занимают АТФ-связывающий центр и снижают фосфорилирование субстратов AKT: GSK3β, PRAS40, белков Forkhead (Rhodes 2008; Davies 2012; Blake 2012). Сигнал pAKT при этом может расти: A-443654 вызывает парадоксальное гиперфосфорилирование AKT по T308 и S473, связываясь с киназой напрямую (Okuzumi 2009). Поэтому «ингибитор снизил фосфорилирование AKT» и «ингибитор снизил активность AKT» — разные утверждения: активность оценивают по фосфорилированию субстрата. В модели парадокс перенесён на ингибитор этого типа (pAKT ×1,7 при активности по субстрату 10 % исходной); у других представителей класса он может быть выражен иначе. GSK690693 и AZD5363 повышают глюкозу крови у мышей (Rhodes 2008; Davies 2012), то есть действуют и на инсулиновый путь организма.", "gn_f_inh": "Ингибитор PI3K/AKT", "g_f_inh": "В базовой сцене «ингибитор PI3K/AKT» — обобщённое воздействие, которое снижает активность AKT по субстрату до 10 % от исходной; конкретный препарат не назван. В продвинутой сцене те же слова заменяют три препарата с разными ограничениями: LY294002, аллостерический и АТФ-конкурентный ингибиторы AKT. Результат такого опыта зависит от времени и системы: AFX-GFP в клетках CHO-K1 при сыворотке после вортманнина временно перемещается в ядро (Takaishi 1999). Результат с одним ингибитором согласуется с участием пути, а вывод о роли AKT требует второго независимого подхода.", "gn_f_lmb": "Лептомицин B", "g_f_lmb": "Лептомицин B (LMB) блокирует экспортин CRM1; в модели экспорт нефосфорилированного и фосфорилированного FOXO снижается до нуля, активность AKT остаётся прежней. В изолированных мышечных волокнах LMB быстро вызывал накопление Foxo1-GFP в ядре (Schachter 2012; Liu 2018), а в клетках SH-SY5Y предотвращал выход GFP-FKHR, вызванный IGF-I (Schwab 2005). В тех же опытах Schwab 2005 LMB снижал фосфорилирование FKHRL1 (FOXO3), но не FKHR (FOXO1), поэтому влияние препарата на сам фосфорилированный белок зависит от системы. Ядро в присутствии LMB — не связывание с ДНК: при высоком сигнале фосфорилированный белок, оказавшийся в ядре, связывается с ДНК слабо, и занятость элемента остаётся низкой.", "gn_f_aaa": "FOXO1-AAA", "g_f_aaa": "FOXO1-AAA — мутантный белок, у которого три сайта AKT заменены на аланин (FOXO1 человека T24A/S256A/S319A; Foxo1 мыши T24A/S253A/S316A), поэтому AKT его не фосфорилирует. Такой белок остаётся в ядре и устойчив к инсулину; AFX с тремя заменами на аланин находится только в ядре, а FKHR-AAA в клетках 293T усиливает транскрипцию и вызывает апоптоз, зависящий от связывания с ДНК (Tang 1999; Biggs 1999; Takaishi 1999). Ядро — условие, но не гарантия активности: на связывание влияют кластер S322–S329, ацетилирование и партнёры (Rena 2002; Matsuzaki 2005). Замены на аспартат лишь имитируют заряд фосфата и ведут себя по-разному: S→D в основной области ДНК-связывающего домена снижает связывание с нуклеосомой in vitro (Yalley 2016).", "gn_f_dbd": "Foxo1-DBD⁻", "g_f_dbd": "Мышиный аллель Foxo1-DBD⁻ кодирует белок с заменами N208A, H212R и K219R в ДНК-связывающем домене: белок не связывается с промоторами, но его распределение между ядром и цитоплазмой по-прежнему регулируется AKT (Cook 2015, гепатоциты и печень мыши). В модели занятость элемента равна нулю, а доля в ядре такая же, как у дикого типа, поэтому показание «новая РНК мишени» снижается до остаточной доли, не зависящей от FOXO1. Не все эффекты FoxO1 требуют связи с ДНК: конститутивно ядерный FoxO1 повышает фосфорилирование AKT, подавляя Trb3, без связывания с ДНК (Matsumoto 2006); такие эффекты в модель не включены. Этот мутант разделяет вход в ядро и связывание с ДНК.", "gn_f_foxo6": "FOXO6", "g_f_foxo6": "FOXO6 — представитель семейства FOXO без высококонсервативного участка с несколькими сайтами фосфорилирования; после стимуляции ростовыми факторами этот белок остаётся в ядре с высокой ядерной долей (Jacobs 2003, трансфицированные клетки). В гепатоцитах инсулин фосфорилирует FoxO6 и подавляет его транскрипционную активность без изменения распределения (Kim 2011, грызуны). В модели у FOXO6 нет третьего сайта AKT и экспорта: доля в ядре высока при любом сигнале, а занятость элемента при высоком сигнале снижается, так что фосфорилирование и локализация разделяются. FOXO6 — контрпример к утверждению «инсулин выводит все FOXO из ядра»; в разных тканях роль этого белка различается.", "gn_f_stress": "Стресс-киназы JNK и MST1", "g_f_stress": "Стресс-киназы JNK и MST1 фосфорилируют FOXO по другим остаткам, чем AKT, и в изученных системах способствуют его ядерному накоплению. MST1 фосфорилирует консервативный остаток forkhead-домена, нарушает связывание с 14-3-3 и способствует гибели нейронов при окислительном стрессе (Lehtinen 2006, первичные нейроны); JNK при слабом H2O2 через Ral фосфорилирует FOXO4 по T447 и T451 в литературной нумерации (Essers 2004), а также 14-3-3ζ по S184 (Sunayama 2005). В модели оба входа объединены в одну настройку, которая ослабляет удержание 14-3-3: импорт фосфорилированного белка растёт в 4 раза, экспорт снижается до 0,4 исходного (кратности — допущение). Направление действия окислительного стресса зависит от дозы, времени и клеток: H2O2 может подавлять FOXO через p66shc (Nemoto 2002), поэтому писать «стресс активирует FOXO» без условий нельзя.", "gn_f_ampk": "AMPK", "g_f_ampk": "AMPK фосфорилирует FOXO3 по шести новым сайтам и повышает его транскрипционную активность без изменения субклеточной локализации (Greer 2007a, клетки млекопитающих). В других опытах PP2A и AMPK вместе регулируют ядерную транслокацию нескольких FOXO после подавления метаболического сигнала или окислительного стресса, причём накопление в ядре идёт за счёт подавления экспорта, а не усиления импорта (Luperchio 2025). Эти заключения расходятся, поэтому в модели AMPK лишь повышает транскрипционную активность на единицу занятости элемента (×1,6, допущение) и локализацию не меняет; спор остаётся открытым. Номера шести сайтов в доступных рефератах не приведены; у C. elegans AMPK действует на DAF-16 (Greer 2007b).", "gn_f_measure": "Как измеряют", "g_f_measure": "Каждое показание сцены соответствует отдельному методу, а числа на экране — расчёт модели, а не измерение. Активность AKT оценивают по фосфорилированию её субстрата; долю FOXO в ядре — по иммунофлуоресценции или флуоресцентному слитому белку как отношение ядро/цитоплазма (N/C) либо по ядерной и цитоплазматической фракциям на блоте; долю фосфорилированного белка — антителами к фосфосайтам. Занятость элемента определяют методом ChIP, а синтез РНК мишени — по новосинтезированной (насцентной) РНК. У каждого метода есть ограничение: N/C — отношение концентраций, а не доля белка; в мышечных волокнах N/C заметно различается между волокнами (Schachter 2012); ChIP показывает присутствие у локуса, но не синтез РНК (Eijkelenboom 2013b).", "gn_f_model": "Что упрощено", "g_f_model": "Схема считает четыре пула FOXO (ядро и цитоплазма × без фосфата и с фосфатом AKT), занятость элемента ДНК и синтез РНК по заданным законам; это учебная модель, а числа в ней — допущения, подобранные для качественного согласия. Из работ взяты направления и порядки величин: ответ AKT за минуты (Gross 2016), непрерывный перенос и почти уравновешенные потоки (Schachter 2012), роль 14-3-3 и CRM1 (Brownawell 2001; Brunet 2002), снижение связывания с ДНК после фосфорилирования S256 (Zhang 2002) и остаточный синтез РНК без FoxO1 (Cook 2015). Подобраны константы потоков и дефосфорилирования, кратности и сроки. Показано установившееся состояние: время в этой сцене не учитывается. В модель не входят деградация FOXO, ацетилирование, киназы SGK, ERK и IKK, другие мишени и партнёры (например, PGC-1α).", "gn_f_measure_a": "Как измеряют", "g_f_measure_a": "На блоте накапливаются до пяти дорожек условий, и на каждой пять полос: pAKT, FOXO, фосфорилированный по сайту AKT, FOXO в ядерной и в цитоплазматической фракциях и контроль равной загрузки дорожек; интенсивность полос рассчитана моделью. Сигнал на блоте насыщается, поэтому различия в верхней части шкалы занижены, а отсутствие полосы не равно нулю: виден слабый фон, и малое содержание белка может лежать ниже предела обнаружения. Полоса pAKT не равна активности AKT: при АТФ-конкурентном ингибиторе pAKT растёт, а фосфорилирование субстрата снижается (Okuzumi 2009), поэтому нужна полоса фосфорилированного субстрата. Кривые во времени получены усреднением по клеткам; у отдельных клеток ответ может быть «всё или ничего», как у FOXO1 при H2O2 в клетках MCF7 (Lasick 2023), и усреднение скрывает форму ответа. Датчик FoxO1–clover измеряет активность AKT, а не функцию эндогенного FOXO (Gross 2016).", "gn_f_model_a": "Что упрощено", "g_f_model_a": "В продвинутой сцене те же четыре пула описаны уравнениями во времени: активность AKT выходит на новое значение с полупериодом около 5 мин, занятость элемента — около 20 мин, скорость синтеза РНК — около часа (допущения; данных по кинетике связывания FOXO в клетках нет). Времена в часах — условные: ориентиром служат ответ AKT за минуты (Gross 2016) и повторный вход FOXO1 в ядро спустя часы после снижения сыворотки в клетках MCF7 (Lasick 2023), но эти опыты в модель не подгонялись. Стресс-киназы JNK и MST1 объединены в один вход, у AMPK учтено только повышение активности на единицу занятости (Greer 2007a), потеря PTEN задана нижним уровнем активности AKT. Не учитываются деградация FOXO (Matsuzaki 2003; различие между перераспределением и разрушением разобрано в справке), ацетилирование и SIRT1 (механизм известен, но знак эффекта зависит от мишени и системы: Brunet 2004; Motta 2004; Daitoku 2004; разбор в справке), киназы ERK, IKK и SGK и обратные связи через экспрессию. Сравнение G6PC- и PCK1-подобных мишеней основано на одной системе (Cook 2015) и не переносится на все ткани.", "gn_f_drugs": "Препараты и мутанты: мишень и ограничение", "g_f_drugs": "У каждого воздействия в сцене есть мишень, прямое действие и ограничение, и результат с одним препаратом согласуется с участием мишени, но не устанавливает механизм. LY294002 ингибирует PI3K, а также mTOR и бромодомены BET; аллостерические ингибиторы AKT снижают и pAKT, и фосфорилирование субстратов; АТФ-конкурентные снижают фосфорилирование субстратов, а pAKT может расти. Лептомицин B блокирует экспорт через CRM1 и не влияет на AKT; FOXO1-AAA не имеет сайтов AKT; Foxo1-DBD⁻ не связывается с ДНК, но сохраняет регулируемое распределение; FOXO6 естественно лишён третьего сайта и экспорта. Рапамицин и ингибитор MEK PD98059 в клетках 293 не отменяли фосфорилирование FKHR, вызванное IGF-1 (Rena 1999), то есть mTORC1 и MEK для этого события не требовались. Для вывода о роли мишени нужен второй независимый подход: другой ингибитор, siRNA, мутант или возвращение функции.", "s4_key": "Домен у промотора мишени: 12 условных нуклеосом", "s4_row1": "До деления", "s4_row2": "После деления", "s4_row1_nd": "Начало цикла", "s4_row2_nd": "Без деления", "s4_row3": "Конец цикла", "s4_arr_div": "деление: метка вдвое реже", "s4_arr_nodiv": "деления нет", "s4_arr_fill": "достройка метки", "s4_n": "Число делений: {n}", "s4_n_nodiv": "Циклы без деления: {n}", "s4_eed_note": "узнаёт метку", "s4_wv": "активность {w}", "s4_prom": "Промотор", "s4_gene": "Ген-мишень", "s4_act": "Активность промотора мишени", "s4_theta": "Порог: половина максимума при метке {th}", "s4_note": "Учебная модель: числа — расчёт, а не измерение", "s4_tx": "Транскрипция", "s4_how": "Как измеряют", "s4_lim": "Что упрощено", "lg_h_nuc": "кружок — нуклеосома домена: закрашенный — с меткой H3K27me3, пустой — без метки, пунктирный — новая нуклеосома, собранная при репликации (метки на ней нет)", "s4_r_end": "Метка H3K27me3, конец цикла, доля исходной", "s4_r_aft": "Метка сразу после деления, доля исходной", "s4_r_act": "Активность промотора мишени, доля максимума", "s4_co_n0": "В начале опыта, до первого цикла, в домене {r} исходной метки H3K27me3.", "s4_co_hold": "После {n}-го деления в конце цикла остаётся {r} исходной метки: деление вдвое разводит её ({ra} сразу после деления), а за цикл метка достраивается почти до прежнего уровня.", "s4_co_mid": "После {n}-го деления в конце цикла остаётся {r} исходной метки ({ra} сразу после деления): деление вдвое разводит метку, а достройки за цикл не хватает, чтобы вернуть прежний уровень.", "s4_co_low": "После {n}-го деления остаётся {r} исходной метки ({ra} сразу после деления) — это ещё выше порога {th}.", "s4_co_below": "После {n}-го деления остаётся {r} исходной метки ({ra} сразу после деления) — это ниже порога {th}.", "s4_cp_off": "Активность промотора мишени {a} от максимума: пока метки достаточно, мишень остаётся подавленной.", "s4_cp_part": "Активность промотора мишени {a} от максимума: вблизи порога она растёт быстро.", "s4_cp_on": "Активность промотора мишени {a} от максимума: метки осталось мало, подавление снято.", "s4_cp_noise": "Активность промотора мишени {a} от максимума: вклад в неё вносят клетки, уже потерявшие домен. Средняя метка не показывает разброс состояний между клетками.", "s4_z_n0": "В норме домен H3K27me3 передаётся дочерним клеткам: после каждого деления метку достраивают, и мишень остаётся подавленной.", "s4_z_off": "Подавление мишени сохраняется, пока метки больше порога. Ответ промотора пороговый, а не пропорциональный доле метки.", "s4_z_part": "Вблизи порога небольшое изменение остатка метки заметно меняет активность мишени.", "s4_z_on": "Подавление снято в дочерних клетках без нового стимула: метка разведена делением. Это изменение состояния клеток после нескольких делений, а не мгновенный эффект воздействия.", "s4_znd_n0": "Без деления репликация метку не разводит: домен H3K27me3 сохраняется, пока достройка компенсирует медленное удаление метки, и мишень остаётся подавленной.", "s4_znd_on": "Подавление снято без деления клеток: метка убывает за счёт удаления и транскрипции, а не разведения. Это изменение состояния клеток за несколько циклов, а не мгновенный эффект воздействия.", "s4_z_noise": "Среднее по клеткам скрывает разброс: при высокой средней метке часть клеток уже потеряла домен, и промоторы в них активны.", "s4b_n_c": "Число делений (учебная модель)", "s4_w_c": "Активность EZH2, % от нормы", "s4b_ref": "Серая риска на полосе — эталон: клетки с нормальной активностью EZH2 после того же числа делений (кнопка «Сбросить» ставит 100 % и три деления). Метка — доля H3K27me3 в домене от уровня до первого деления (учебная модель; подробнее — «Как измеряют»).", "s4b_take": "Деление вдвое разводит метку H3K27me3: новые нуклеосомы собираются из гистонов без этой метки. Пока EZH2 достраивает метку быстрее, чем деление её разводит, домен сохраняется в дочерних клетках. Если активность EZH2 ниже критического значения, метка разводится с каждым делением, остаток падает ниже порога активации промотора, и мишень активируется спустя несколько делений. Ответ на снижение активности EZH2 пороговый: умеренное снижение компенсирует обратная связь через EED, а сильное она не компенсирует. Сохранение метки и память ответа — разные вещи: о памяти ответа судят по реакции клеток на повторный стимул в сравнении с наивными клетками (режим «Повторный стимул»), а не по одной метке.", "s4b_cm_norm": "EZH2 ставит метку H3K27me3, а EED узнаёт её и усиливает EZH2 на соседних нуклеосомах.", "s4b_cm_inh": "Активность EZH2 снижена до {w} от нормы: скорость метилирования снижена, и усиление через EED тоже слабее.", "s4b_ctl": "норма", "s4b_when": "Число делений задано условием и закреплено до показа ответа; показания берутся в конце цикла.", "p4b_1_q": "В делящихся клетках домен H3K27me3 удерживает промотор мишени подавленным. Активность EZH2 снижают до нуля и наблюдают клетки после одного деления. Как изменится доля исходной метки H3K27me3 в домене в конце цикла?", "p4b_1_o1": "Не изменится: при делении метка передаётся дочерним клеткам вместе с ДНК.", "p4b_1_o2": "Заметно снизится: деление разводит метку, а новая не ставится.", "p4b_1_o3": "Исчезнет полностью: без активного EZH2 метка снимается сразу.", "p4b_1_k": "При репликации родительские нуклеосомы с меткой распределяются между дочерними молекулами ДНК, а новые нуклеосомы собираются из гистонов без этой метки. Без активного EZH2 метка не восстанавливается. Сразу после репликации доля меченых нуклеосом вдвое меньше исходной, но метка не исчезает целиком: каждая дочерняя клетка получает часть родительских нуклеосом.", "p4b_1_e": "В модели при нулевой активности EZH2 доля исходной метки в конце первого цикла снижается с 97 % до 45 %: сразу после деления она равна 50 %, затем немного убывает из-за медленного удаления метки. Сразу после деления доля метки та же, что в норме (50 %), а в конце цикла различие возникает потому, что в норме метка достраивается. Каждое следующее деление снова вдвое разводит остаток, а порог, при котором активность промотора вдвое ниже максимума, задан как 12,5 % исходной метки (одна восьмая, то есть три деления). Разведение метки вдвое при репликации измерено масс-спектрометрией в клетках HeLa (Alabert 2015); в эпителии кишечника мыши и в клетках лимфомы активация генов после потери фермента, ставящего метку, требовала не менее трёх делений (Jadhav 2020). Порог и скорость удаления метки — допущения учебной модели.", "p4b_1_w1": "Метка не копируется вместе с ДНК автоматически: при репликации родительские нуклеосомы с меткой распределяются между дочерними молекулами ДНК, а новые нуклеосомы собираются из гистонов без метки (Alabert 2015). Пропущено звено: сохранение метки требует её достройки ферментом EZH2.", "p4b_1_w3": "Метка не исчезает сразу после ингибирования EZH2: доля метки уменьшается вследствие деметилирования и замены нуклеосом, но эти процессы протекают медленно, и H3K27me3 обновляется намного медленнее, чем H3K4me3 (Zheng 2014). Пропущено звено: основная потеря метки происходит из-за разведения при делении, поэтому она зависит от числа делений.", "p4b_2_q": "В делящихся клетках домен H3K27me3 удерживает промотор мишени подавленным. Активность EZH2 снижают до 80 % от нормы. После шести делений клетки сравнивают с контролем, в котором активность EZH2 не нарушена. Как изменится доля исходной метки в домене в конце цикла?", "p4b_2_o1": "Снизится на пятую часть: метка пропорциональна активности EZH2.", "p4b_2_o2": "Заметно снизится: каждое деление вдвое разводит метку, а EZH2 слабее.", "p4b_2_o3": "Изменится мало: обратная связь через EED достраивает метку.", "p4b_2_k": "Метка H3K27me3 усиливает EZH2 через EED, поэтому при умеренном снижении активности фермента достройка остаётся быстрее разведения, и домен возвращается почти к прежнему уровню.", "p4b_2_e": "В модели при активности EZH2 80 % от нормы доля исходной метки в конце цикла равна 92 % против 97 % в норме, а сразу после деления 46 % против 48 %: обратная связь через EED сохраняет домен, и активность промотора остаётся низкой. В модели порог, ниже которого обратная связь перестаёт удерживать метку, лежит ниже 80 % нормальной активности EZH2: при 80 % обратная связь ещё удерживает домен, а более сильное снижение показано на следующем шаге. Связь «метка — EED — усиление EZH2» показана на очищенном комплексе и в клетках (Margueron 2009; Lee 2018), но числовое значение порога в живых клетках не измерено: это результат расчёта учебной модели при принятых допущениях.", "p4b_2_w1": "Метка не пропорциональна активности EZH2: фермент усиливается самой меткой через EED (Margueron 2009), поэтому при умеренном снижении активности обратная связь компенсирует потерю. Пропущено звено: нелинейная обратная связь, при которой эффект зависит от порога.", "p4b_2_w2": "Деление вдвое разводит метку и в норме, но в конце цикла она достраивается; в норме разведение и достройка уравновешены. Пропущено звено: достройка зависит от активности EZH2 и усиливается самой меткой, так что умеренное снижение активности компенсируется.", "p4b_3_q": "В делящихся клетках домен H3K27me3 удерживает промотор мишени подавленным. Активность EZH2 снижают до 50 % от нормы. После шести делений клетки сравнивают с контролем, в котором активность EZH2 не нарушена. Как изменится активность промотора мишени в конце цикла?", "p4b_3_o1": "Возрастёт до высокого уровня: достройка метки медленнее её разведения.", "p4b_3_o2": "Возрастёт умеренно: половина фермента ставит половину нормальной метки.", "p4b_3_o3": "Почти не изменится: обратная связь через EED достраивает метку, как при 80 %.", "p4b_3_k": "Ниже порога активности достройка метки медленнее разведения, и обратная связь через EED не удерживает домен: метка разводится с каждым делением, остаток падает ниже порога активации промотора, и промотор мишени активируется.", "p4b_3_e": "В модели при активности EZH2 50 % от нормы доля исходной метки в конце цикла после шести делений равна 6 % против 97 % в норме, а активность промотора мишени — 95 % от максимума против < 2 % в норме. Порог активации промотора задан как 12,5 % исходной метки; в кишечных стволовых клетках мыши без EED и в клетках лимфомы под действием ингибиторов EZH2 активация многих генов требовала не менее трёх делений (Jadhav 2020). Ответ на снижение активности EZH2 пороговый: состояние домена качественно меняется где-то между умеренным и сильным снижением, а положение порога в модели — допущение.", "p4b_3_w2": "Активность EZH2 и метка связаны не линейно: ниже порога обратная связь через EED перестаёт достраивать метку (Margueron 2009), и разведение делением начинает преобладать. Пропущено звено: пороговый характер обратной связи, из-за которого небольшое различие по активности даёт качественно разный исход.", "p4b_3_w3": "Результат умеренного снижения не переносится на сильное: обратная связь через EED усиливает EZH2 в зависимости от метки, и при достаточной активности фермента она компенсирует разведение, а ниже порога — нет. Пропущено звено: порог активности EZH2, определяющий, достраивается ли метка быстрее, чем разводится.", "p4b_4_q": "Моноциты человека в культуре получили β-глюкан на 24 ч; после покоя (6–7 сут от начала опыта), когда β-глюкана в среде уже нет, клетки получили LPS. Контрольные клетки получили только LPS. Как изменится продукция цитокинов в ответ на LPS у клеток, прошедших первый стимул, по сравнению с контролем?", "p4b_4_o1": "Не изменится: после покоя первый стимул уже не влияет на клетки.", "p4b_4_o2": "Станет выше: после покоя клетки отвечают на LPS сильнее наивных.", "p4b_4_o3": "Станет ниже: после первого стимула клетки менее чувствительны.", "p4b_4_k": "Первый стимул оставляет в клетках состояние, которое сохраняется после покоя, хотя самого стимула уже нет: на повторный стимул клетки отвечают сильнее, чем наивные. О памяти ответа судят именно по такому сравнению с контролем, получившим только второй стимул.", "p4b_4_e": "В каталоге опубликованных опытов на моноцитах человека in vitro после β-глюкана и покоя ответ на LPS выше, чем у клеток, получивших только LPS, и H3K27ac на дистальных регуляторных элементах выше (Quintin 2012; Saeed 2014). Показания качественные: числа не рассчитываются. Шаги 1–3 показывали, сохраняется ли метка в делящихся клетках; здесь другой вопрос — изменился ли ответ клеток. Моноциты в культуре не реплицируют ДНК (Saeed 2014), поэтому разведение метки делением к этому опыту не относится. Высокий H3K27ac показывает связь с усиленным ответом, но причину из неё вывести нельзя: причинность проверяют отдельными опытами с контролями (они разобраны на продвинутом уровне).", "p4b_4_w1": "Если бы после покоя следа первого стимула не оставалось, ответ на LPS не отличался бы от ответа наивных клеток. В опытах на моноцитах человека он выше (Quintin 2012; Saeed 2014). Пропущено звено: состояние клеток сохраняется и без самого стимула, и его выявляют сравнением с контролем.", "p4b_4_w3": "Сниженный ответ на повторный LPS (толерантность) описан после первого LPS, а не после β-глюкана (Foster 2007; Novakovic 2016; Saeed 2014). Пропущено звено: знак изменения ответа зависит от первого стимула, и тренировку отличают от толерантности по сравнению с наивным контролем.", "gn_h_nuc": "Домен H3K27me3 и нуклеосомы", "g_h_nuc": "Нуклеосома — комплекс октамера гистонов и обёрнутого вокруг него участка ДНК; в модели домен у промотора мишени состоит из 12 условных нуклеосом, и каждая либо несёт метку H3K27me3 (триметилирование лизина 27 гистона H3), либо нет. H3K27me3 — репрессивная метка: PRC2 удерживается на немногих «сайтах зарождения» и оттуда распространяет метку по домену (Oksuz 2018). Верхний ряд на схеме — состояние до деления, средний — сразу после деления (половина нуклеосом новая и без метки), нижний — конец цикла после достройки метки. Число 12 выбрано для наглядности и не соответствует размеру реальных доменов.", "gn_h_div": "Деление и разведение метки", "g_h_div": "При репликации родительские нуклеосомы с меткой остаются на дочерних молекулах ДНК, а недостающие нуклеосомы собираются из новых гистонов без метки, поэтому доля нуклеосом с меткой сразу после деления вдвое меньше (Alabert 2015). В клетках HeLa метилирование новых гистонов восстанавливается за часы и сутки, а H3K27me3 на новых гистонах остаётся недопредставленным и через 24 ч (Alabert 2015; Reverón-Gómez 2018). Сохраняются ли родительские нуклеосомы при репликации, зависит от системы и метки: в клетках HeLa положение родительских меток воспроизводится рециклингом нуклеосом (Reverón-Gómez 2018), у дрозофилы метилированный H3 после репликации заменялся неметилированным (Petruk 2012), а в мышиных эмбриональных стволовых клетках репрессированные домены сохраняют родительские нуклеосомы локально (Escobar 2019); вопрос открыт. Стабильность самой метки не означает самоподдержания: H3K27me3 обновляется медленно (Zheng 2014), но без достройки её вдвое разводит каждое деление. Модель принимает разведение ×½ на деление.", "gn_h_ezh2": "EZH2: фермент, ставящий метку", "g_h_ezh2": "EZH2 — каталитическая субъединица комплекса PRC2: этот фермент присоединяет метильные группы к лизину 27 гистона H3 вплоть до H3K27me3. Настройка «Активность EZH2» задаёт долю нормальной активности: SAM-конкурентные ингибиторы (GSK126, EPZ005687, UNC1999) снижают её, но не удаляют уже стоящую метку мгновенно (McCabe 2012; Knutson 2012; Konze 2013). UNC1999 ингибирует и EZH1, поэтому не равен ингибированию одного EZH2 (Konze 2013). В модели порог по активности EZH2, ниже которого метка перестаёт удерживаться, — результат расчёта при принятых допущениях.", "gn_h_eed": "EED: белок, узнающий метку", "g_h_eed": "EED — субъединица PRC2, белок, узнающий метку (ридер): он связывает триметилированные остатки лизина на гистонах, в том числе H3K27me3, и аллостерически повышает активность EZH2 (Margueron 2009). Так возникает положительная обратная связь: метка на одной нуклеосоме усиливает постановку такой же метки на соседних. Мутантные EZH2 и EED в клетках млекопитающих могут связываться с хроматином, но почти не метилируют, поэтому присутствие комплекса на хроматине не равно его активности (Lee 2018). Ингибиторы EED (EED226, A-395, MAK683) занимают карман для метки и препятствуют этой активации, не блокируя каталитический центр EZH2 (Qi 2017; He 2017; Jadhav 2020).", "gn_h_prom": "Промотор мишени и порог", "g_h_prom": "Промотор — регуляторный участок ДНК, обеспечивающий инициацию транскрипции; в модели его активность — условный индекс от 0 до 100 % максимума, а не содержание мРНК. Индекс растёт по мере разведения метки: вдвое ниже максимума он при остатке метки, равном порогу (в базовой настройке 12,5 % исходной метки, то есть одна восьмая). Это значение выбрано по наблюдению, что в эпителии кишечника мыши и в клетках лимфомы активация многих генов после потери фермента, ставящего метку, требовала не менее трёх делений (Jadhav 2020). Порог зависит от гена: промоторы с высоким исходным H3K4me2/3 активируются при большем остатке метки (Jadhav 2020). Крутизна перехода и значения порогов — допущения учебной модели.", "gn_h_measure": "Как измеряют", "g_h_measure": "Долю метки H3K27me3 в домене измеряют иммунопреципитацией хроматина с антителом к метке и секвенированием (ChIP-seq) со стандартом, например с добавленным хроматином дрозофилы: он позволяет сравнить общий уровень метки между образцами. Метод усредняет сигнал по клеткам и аллелям: он не показывает ни доли нуклеосом с меткой в одной клетке, ни доли клеток в каждом состоянии, а результат зависит от антитела; одноклеточный ChIP в работах, разобранных здесь, не применялся (Jadhav 2020). Число делений определяют по разведению красителя (CellTrace). Разведение метки вдвое при репликации показано масс-спектрометрией: это общий уровень метки, а не уровень на одном локусе (Alabert 2015). Активность промотора определяют по мРНК (количественная ПЦР, секвенирование РНК); мРНК не равна белку. «Сразу после деления» и «конец цикла» — моменты расчёта: в асинхронной культуре клетки находятся на разных стадиях цикла, и ChIP усредняет их.", "gn_h_model": "Что упрощено", "g_h_model": "Модель учебная и описывает одну репрессивную метку (H3K27me3) в одном домене делящихся клеток. Метка ставится медленно при «зарождении» и быстро, если рядом уже есть метка и действует белок EED, узнающий метку (обратная связь); деление вдвое разводит метку, а за цикл идут достройка и медленное удаление метки. Константы подобраны и названы допущениями: скорость зарождения и обратной связи, кооперативность обратной связи (без неё устойчивого состояния с меткой нет: Dodd 2007), скорость удаления (H3K27me3 обновляется медленно: Zheng 2014), порог активации промотора и крутизна выхода. Измерены разведение вдвое на каждой репликации (Alabert 2015) и необходимость не менее трёх делений для активации многих генов после потери фермента, ставящего метку (Jadhav 2020). В контроле метка в конце цикла составляет 97 % исходной, а не 100 %: за один цикл достройка неполная. Порог по активности EZH2 (около двух третей нормы) — результат расчёта этой модели, а не измерение. Модель не воспроизводит остаток метки в эпителии кишечника мыши без Ezh2 (около 43,5 % от дикого типа: Jadhav 2020) и не описывает EZH1, H3K27me2, другие метки и локусы, неделящиеся клетки и тренированный иммунитет моноцитов: моноциты в культуре не реплицируют ДНК (Saeed 2014). Модель не определяет знак влияния метки на повторный ответ и не показывает причинность «метка — ответ».", "s4_eed_f": "усиление {f}", "s4_drug_ezh2": "Ингибитор EZH2, блок {b}", "s4_drug_eed": "Ингибитор EED, блок {b}", "s4_drug_koEzh2": "Нокаут Ezh2: остаётся часть активности (EZH1)", "s4_drug_koEed": "Нокаут Eed: обратной связи нет", "s4_drug_kd": "Ингибитор KDM6: удаление метки замедлено", "s4_drug_kd_add": "+ ингибитор KDM6", "s4_dom_n": "Размер домена: {N} нуклеосом, распределение меток между клетками случайное", "s4_dom_inf": "Размер домена: не учитывается, все клетки одинаковы", "s4_mem": "Что называют памятью", "s4_memhint": "Память ответа — иной ответ на повторный стимул после покоя, чем у клеток без первого воздействия; сохранение метки при делении — лишь одна из возможных причин.", "s4a_mode_c": "Что показывать", "s4a_mode_d": "Домен H3K27me3", "s4a_mode_b": "Повторный стимул", "s4a_mode_m": "Загадка: три образца", "s4a_kind_c": "Воздействие", "s4a_k_none": "нет", "s4a_k_ezh2": "ингибитор EZH2", "s4a_k_eed": "ингибитор EED", "s4a_k_koEzh2": "нокаут Ezh2", "s4a_k_koEed": "нокаут Eed", "s4a_b_c_ezh2": "Степень блока EZH2, %", "s4a_b_c_eed": "Степень блока EED, %", "s4a_th_c": "Промотор мишени", "s4a_th_normal": "обычный", "s4a_th_primed": "подготовленный", "s4a_pu_c": "Транскрипция гена в первых циклах", "s4a_pu_0": "нет", "s4a_pu_1": "1 цикл", "s4a_pu_2": "2 цикла", "s4a_pu_3": "3 цикла", "s4a_N_c": "Размер домена (случайность)", "s4a_N_0": "все клетки одинаковы", "s4a_N_80": "80 нуклеосом", "s4a_N_30": "30 нуклеосом", "s4a_kd_c": "Ингибитор KDM6", "s4a_dv_c": "Клетки делятся", "s4a_n_c_nd": "Число циклов без деления (допущение)", "s4a_exp_c": "Опыт", "s4a_e1": "β-глюкан → LPS", "s4a_e2": "β-глюкан, блок пути", "s4a_e3": "LPS → LPS", "s4a_e4": "LPS → LPS, без Eed", "s4a_e5": "IFN-γ → TLR4", "s4a_smp_c": "Образец", "s4a_smp_both": "оба стимула", "s4a_smp_second": "только второй (контроль)", "s4a_smp_first": "только первый", "s4a_rev_c": "Показать условия образцов", "s4_r_hi": "Клетки с доменом в высоком состоянии, доля", "s4_r_r2": "Ответ на второй стимул относительно наивных клеток", "s4_r_ac": "H3K27ac на регуляторных элементах относительно наивных клеток", "s4_r_me3": "H3K27me3 относительно наивных клеток", "s4a_plot_aria": "График: метка H3K27me3 и активность промотора по числу делений", "s4a_leg_mark": "метка в конце цикла", "s4a_leg_ctl": "метка в эталоне", "s4a_leg_act": "активность промотора", "s4a_leg_th": "порог {th}", "s4a_x_unit": "делений", "s4a_ref": "Серая риска на полосе — эталон: те же клетки без воздействия при том же числе делений (по оси графика — доля исходной метки и доля максимума активности, %). Когда все клетки одинаковы, доля клеток в высоком состоянии равна 0 или 100 %: чтобы клетки различались, выберите размер домена (учебная модель; подробнее — «Как измеряют»).", "s4a_ref_N": "Серая риска на полосе — эталон: те же клетки без воздействия. Домен из {N} нуклеосом: состояние каждой клетки случайно, метка и активность — средние по клеткам, а доля в высоком состоянии — доля клеток (учебная модель; подробнее — «Как измеряют»).", "s4a_refB": "Серая риска на полосе — уровень наивных клеток (получивших только второй стимул); «не измерено» значит, что в разобранных работах показание не определяли. Ответ — величина, измеренная в работе (чаще продукция цитокинов); изменения мРНК и белкового ответа не обязаны совпадать. Источники опыта:", "s4a_refM": "Показания трёх образцов при полном блоке EZH2 через два цикла (учебная модель). Условия образцов открывает переключатель «Показать условия образцов».", "s4a_ctl_n": "без воздействия", "s4a_ctl_nd": "без транскрипции", "s4a_ctl_b": "наивные клетки", "s4a_when": "Число делений задано условием и закреплено до показа ответа; показания берутся в конце цикла.", "s4a_whenB": "Опыт и образец заданы и закреплены до показа ответа; показания качественные («выше — ниже»), числа не рассчитываются.", "s4a_whenM": "Показания образцов видны на схеме; условия образцов откроются после ответа.", "s4a_take": "Метка H3K27me3 и активность промотора — разные показания. Деление вдвое разводит метку, поэтому ингибитор EZH2 меняет метку раньше, чем активность: промотор активируется, когда остаток метки опускается ниже порога, а порог зависит от гена. Состояние домена может теряться не во всех клетках: в малом домене случайность выводит из высокого состояния часть клеток, а в неделящихся клетках метка не разводится. Усиленный или ослабленный ответ на повторный стимул — функциональный итог после покоя, и по одной метке его знак предсказать нельзя: при потере Eed метка H3K27me3 ниже, а ответ слабее. Модель домена не объясняет тренированный иммунитет неделящихся моноцитов.", "s4a_cm_none": "Воздействий нет: EZH2 ставит метку, EED узнаёт её и усиливает EZH2 на соседних нуклеосомах.", "s4a_cm_ezh2": "Ингибитор EZH2 (блок {b}) снижает активность фермента до {w} от нормы; уже стоящую метку он не снимает.", "s4a_cm_eed": "Ингибитор EED (блок {b}) занимает карман для метки: усиление EZH2 снижено до {f} от нормы, каталитический центр EZH2 не заблокирован.", "s4a_cm_koEzh2": "В клетках без Ezh2 остаётся часть активности (EZH1 частично замещает EZH2); модель принимает её равной {w} от нормы.", "s4a_cm_koEed": "В клетках без Eed нет обратной связи: метка ставится лишь при медленном зарождении.", "s4a_x_pulse": "В модели транскрипция в первых {p} циклах ускоряет потерю метки.", "s4a_x_pulse1": "В модели транскрипция в первом цикле ускоряет потерю метки.", "s4a_x_kdm6": "Ингибитор KDM6 замедляет удаление метки.", "s4a_x_primed": "Промотор подготовлен (высокий исходный H3K4me2/3): он активируется при большем остатке метки, порог {th}.", "s4a_x_nodiv": "Клетки не делятся: метка не разводится.", "s4a_x_hi": "В высоком состоянии остаётся {h} клеток (домен из {N} нуклеосом).", "s4_cnd_hold": "После {n}-го цикла без деления в домене {r} исходной метки: разведения нет, метка теряется лишь за счёт удаления и достраивается.", "s4_cnd_mid": "После {n}-го цикла без деления в домене {r} и
