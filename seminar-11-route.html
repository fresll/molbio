<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-11.html">← Вернуться к семинару</a> · <a href="index.html">← Раздел II: семинары</a></p><h1>Протеостаз: Hsp70, убиквитин-протеасомная система, ERAD и аутофагический поток</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-hsp70-cycle"><div class="eyebrow">Цикл Hsp70 · шаг 1 из 26</div><h2>Как цикл ATP и ADP меняет сродство Hsp70 к субстрату</h2><p class="lead"><a href="#ns-g-S11-T01">Hsp70</a> связывает открытые гидрофобные участки развёрнутых белков, но прочность связывания зависит от нуклеотида в его <a href="#ns-g-S11-T02">нуклеотид-связывающем домене</a>. Гидролиз ATP закрывает <a href="#ns-g-S11-T03">крышку</a> над субстратом, а замена ADP на ATP её открывает.</p><ol class="mech"><li>Hsp70 в комплексе с ATP: субстрат-связывающий домен (SBD) открыт, субстрат связывается и отходит быстро.</li><li>Гидролиз ATP в NBD через линкер передаётся на SBD: крышка закрывается, и субстрат отходит медленно.</li><li>Выход ADP и связывание новой молекулы ATP открывают SBD, и субстрат освобождается.</li></ol><p>Hsp70 — шаперон, который связывает короткие гидрофобные участки полипептида. В нативном белке такие участки спрятаны внутри глобулы, а у развёрнутых, неправильно свёрнутых и ещё не достроенных молекул они открыты. Связывание с Hsp70 не даёт таким молекулам слипаться друг с другом.</p><p>Молекула Hsp70 состоит из двух доменов, соединённых линкером. Нуклеотид-связывающий домен (NBD) связывает и гидролизует ATP. Субстрат-связывающий домен (SBD) несёт карман для полипептида и α-спиральную крышку. Когда в NBD находится ATP, карман открыт: субстрат связывается быстро, но так же быстро и отходит. После гидролиза ATP до ADP конформация обоих доменов меняется, крышка закрывается, и субстрат отходит во много раз медленнее.</p><p>Цикл замыкается, когда ADP выходит из NBD и его место занимает ATP, которого в цитоплазме много. SBD снова открывается, и субстрат освобождается. Освобождённая молекула может свернуться сама или снова связаться с Hsp70.</p><p>Сочетание двух состояний даёт выигрыш, недоступный ни одному из них по отдельности: субстрат быстро захватывается в ATP-состоянии и медленно отходит в ADP-состоянии. Расчёты показывают, что за счёт расхода ATP эффективное сродство может быть на порядки выше равновесного; такое сродство называют неравновесным, или <a href="#ns-g-S11-T07">«сверхсродством»</a>. Hsp70 при этом не задаёт белку готовую нативную структуру. Связывание с шапероном может изменять конформацию субстрата и устранять ошибочно свёрнутые состояния; после освобождения часть молекул приобретает нативную структуру (Imamoglu 2020).</p><div class="note trap"><strong>Типичная ошибка</strong> Hsp70 сворачивает белок за счёт энергии ATP, как мотор, придающий цепи правильную форму.<p class="trap-fix">Энергия ATP расходуется на смену состояний Hsp70 — прочное связывание и освобождение субстрата. Правильная укладка цепи после освобождения определяется её аминокислотной последовательностью; за один цикл сворачивается лишь часть молекул, поэтому нужны повторные циклы.</p></div><div class="static-quiz"><h3>Hsp70 находится в ATP-состоянии и связал гидрофобный участок субстрата. Затем ATP в NBD гидролизовался до ADP. Как изменится скорость отхода субстрата от SBD?</h3><ol><li><b>А.</b> Не изменится: нуклеотид связан с другим доменом. <i>(неверный вариант)</i><br><span class="expl">Домены связаны аллостерически через линкер: смена нуклеотида в NBD меняет конформацию SBD и положение крышки.</span></li><li><b>Б.</b> Снизится: крышка закроется над субстратом. <i>(верный вариант)</i><br><span class="expl">После гидролиза ATP крышка SBD закрывается, и субстрат отходит во много раз медленнее, чем в ATP-состоянии.</span></li><li><b>В.</b> Возрастёт: ADP вытеснит субстрат из кармана. <i>(неверный вариант)</i><br><span class="expl">ADP связывается в NBD, а не в кармане SBD; вытеснения субстрата нет — наоборот, ADP-состояние удерживает его прочнее.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-019-0133-3">Rosenzweig R., Nillegoda N.B., Mayer M.P., Bukau B. The Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2019;20:665–680</a></li><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li><li><a href="https://doi.org/10.7554/eLife.02218">De Los Rios P., Barducci A. Hsp70 chaperones are non-equilibrium machines that achieve ultra-affinity by energy consumption. eLife. 2014;3:e02218</a></li><li><a href="https://doi.org/10.1038/s41467-019-14245-4">Imamoglu R., Balchin D., Hayer-Hartl M., Hartl F.U. Bacterial Hsp70 resolves misfolded states and accelerates productive folding of a multi-domain protein. Nat Commun. 2020;11:365</a></li></ul><p>Схема механизма, качественные состояния. Строение доменов и смена конформаций обобщены по обзорам Rosenzweig 2019 (реферат) и Wentink 2026 (полный текст). Неравновесное «сверхсродство» — вывод теоретической модели De Los Rios 2014 (реферат), а не прямое измерение в клетке. Устранение ошибочно свёрнутых промежуточных состояний люциферазы при связывании с DnaK — Imamoglu 2020 (in vitro, DnaK, DnaJ, GrpE; реферат). Слова «быстро», «медленно», «высокое», «низкое» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-hsp70-jdp"><div class="eyebrow">Цикл Hsp70 · шаг 2 из 26</div><h2>Как J-белок выбирает субстрат и запускает гидролиз ATP</h2><p class="lead">Собственный гидролиз ATP у Hsp70 медленный. <a href="#ns-g-S11-T04">J-доменный белок</a> связывает субстрат и одновременно через <a href="#ns-g-S11-T05">мотив HPD</a> стимулирует гидролиз ATP — так захват субстрата и закрытие крышки происходят вместе.</p><ol class="mech"><li>J-белок связывает развёрнутый белок своими субстрат-связывающими доменами и подводит его к Hsp70.</li><li>J-домен с мотивом His-Pro-Asp (HPD) взаимодействует с NBD и линкером Hsp70 и стимулирует гидролиз ATP.</li><li>Стимуляция сильнее всего, когда субстрат одновременно находится в SBD: гидролиз совпадает по времени с захватом.</li></ol><p>У человека около 50 J-доменных белков (JDP, прежнее название — Hsp40) и лишь 11 белков Hsp70. Разнообразие J-белков определяет, к каким субстратам и комплексам будет привлечён Hsp70. Одни J-белки узнают гидрофобные участки любых развёрнутых белков, другие связывают определённые белки, третьи прикрепляют Hsp70 к рибосоме или транслокону.</p><p>Общая часть всех J-белков — J-домен из примерно 70 остатков с консервативным мотивом His-Pro-Asp (HPD). J-домен связывается с Hsp70 в области NBD и линкера и запускает конформационную перестройку, ускоряющую гидролиз ATP. В экспериментах с бактериальными DnaK и DnaJ гидролиз ускорялся более чем в 1000 раз, но при низкой концентрации DnaJ — только в присутствии белкового субстрата. Значит, наибольший эффект дают одновременно связанные J-белок и субстрат.</p><p>Такое сопряжение имеет смысл для захвата субстрата. Если гидролиз произойдёт, пока субстрат находится в открытом кармане, крышка закроется именно над ним. Без стимуляции субстрат чаще отходит раньше, чем ATP будет гидролизован.</p><p>Замена гистидина мотива HPD (например, H32Q у J-белка DNAJB1 человека) лишает J-домен способности стимулировать гидролиз. Такой белок может связывать субстрат, но Hsp70 прочно его не захватывает. Поэтому замена в мотиве HPD показывает, что для работы системы нужна именно стимуляция гидролиза, а не только доставка субстрата.</p><div class="note trap"><strong>Типичная ошибка</strong> J-белок — фактор обмена нуклеотидов: он заменяет ADP на ATP и освобождает субстрат.<p class="trap-fix">J-белок ускоряет другую стадию цикла — гидролиз ATP, после которого субстрат удерживается прочно. Выход ADP и освобождение субстрата ускоряют факторы обмена нуклеотидов (NEF).</p></div><div class="static-quiz"><h3>В пробирке Hsp70, ATP и белковый субстрат. Добавили J-белок с заменой H→Q в мотиве HPD в той же концентрации, что и J-белок дикого типа в контроле. Как изменится скорость гидролиза ATP по сравнению с контролем?</h3><ol><li><b>А.</b> Будет выше: мутантный J-белок прочнее связывает субстрат. <i>(неверный вариант)</i><br><span class="expl">Прочность связывания субстрата J-белком не заменяет стимуляцию: гидролиз ATP у Hsp70 ускоряет именно J-домен с мотивом HPD.</span></li><li><b>Б.</b> Будет такой же: субстрат сам стимулирует гидролиз. <i>(неверный вариант)</i><br><span class="expl">Субстрат один ускоряет гидролиз слабо; сильная стимуляция требует одновременного действия субстрата и J-домена с мотивом HPD.</span></li><li><b>В.</b> Будет ниже: мотив HPD нужен для стимуляции гидролиза. <i>(верный вариант)</i><br><span class="expl">Замена гистидина в мотиве HPD лишает J-домен способности стимулировать гидролиз ATP, поэтому скорость будет близка к скорости без J-белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.96.10.5452">Laufen T., Mayer M.P., Beisel C. et al. Mechanism of regulation of hsp70 chaperones by DnaJ cochaperones. Proc Natl Acad Sci USA. 1999;96:5452–5457</a></li><li><a href="https://doi.org/10.1016/j.molcel.2017.12.003">Kityk R., Kopp J., Mayer M.P. Molecular mechanism of J-domain-triggered ATP hydrolysis by Hsp70 chaperones. Mol Cell. 2018;69:227–237</a></li><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li></ul><p>Схема механизма, качественные состояния. Числа стимуляции получены in vitro на бактериальных белках DnaK и DnaJ (Laufen 1999, реферат); структурная основа роли мотива HPD — кристаллическая структура комплекса DnaK с J-доменом (Kityk 2018, реферат). Число J-белков и Hsp70 у человека — по обзору Wentink 2026 (полный текст) с исправлением авторов 2026 г.: в рис. 1a добавлен HSPA6, в семействе Hsp70 11 белков, а не 10. Обозначения «низкий», «высокий» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-hsp70-nef"><div class="eyebrow">Цикл Hsp70 · шаг 3 из 26</div><h2>Почему для освобождения субстрата нужен фактор обмена нуклеотидов</h2><p class="lead">В ADP-состоянии Hsp70 удерживает субстрат, пока ADP не выйдет из NBD. <a href="#ns-g-S11-T06">Фактор обмена нуклеотидов</a> ускоряет этот выход и тем самым определяет, как долго длится связывание.</p><ol class="mech"><li>NEF связывается с NBD Hsp70 в ADP-состоянии и снижает его сродство к ADP.</li><li>ADP выходит, карман NBD занимает ATP, крышка SBD открывается, и субстрат освобождается.</li><li>Количество и тип NEF задают время удержания: и недостаток, и избыток NEF снижают выход сворачивания in vitro.</li></ol><p>Без NEF ADP выходит из NBD медленно, и комплекс Hsp70·ADP·субстрат существует долго. Субстрат защищён от агрегации, но не может свернуться: чтобы получить такую возможность, он должен быть освобождён.</p><p>NEF связывается с NBD и раскрывает карман нуклеотида. Структурно факторы обмена очень разные: у бактерий это GrpE, у человека — 13 белков четырёх семейств: GrpE-подобные белки митохондрий, <a href="#ns-g-S11-T08">Hsp110</a>, белки с повторами армадилло (HspBP1 и SIL1 в ЭПР) и <a href="#ns-g-S11-T09">белки BAG</a>. Несмотря на разное происхождение, все они действуют на один и тот же участок NBD. Эффективность различается: белки с повторами армадилло ускоряют выход ADP лишь в 5–10 раз, а BAG-1M в экспериментах in vitro ускорял выход ADP из Hsc70 до 900 раз.</p><p>Освобождение субстрата должно происходить вовремя. В экспериментах in vitro BAG-1M в высокой концентрации в отсутствие фосфата подавлял сворачивание люциферазы, а в низкой концентрации в присутствии фосфата усиливал его. Одно из объяснений: при слишком быстром обмене субстрат освобождается раньше, чем Hsp70 успевает изменить его конформацию. Противоположно NEF действует белок Hip: он стабилизирует ADP-состояние и продлевает связывание.</p><p>Значит, скорость и результат цикла определяются соотношением J-белков и NEF, а не одним из них.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем больше фактора обмена нуклеотидов, тем эффективнее сворачивание: больше циклов — больше попыток.<p class="trap-fix">Число циклов растёт, но при избытке NEF освобождение становится преждевременным, и доля молекул, свернувшихся после освобождения, падает. In vitro зависимость от количества NEF колоколообразная (Gässler 2001).</p></div><div class="static-quiz"><h3>В пробирке Hsp70, J-белок, ATP и развёрнутая люцифераза; NEF нет, и большая часть люциферазы находится в комплексе Hsp70·ADP. Добавили BAG1 в небольшом количестве. Как изменится время удержания люциферазы в одном цикле?</h3><ol><li><b>А.</b> Сократится: BAG1 ускорит выход ADP. <i>(верный вариант)</i><br><span class="expl">BAG1 связывается с NBD и ускоряет выход ADP; после связывания ATP крышка открывается, и люцифераза освобождается раньше.</span></li><li><b>Б.</b> Увеличится: BAG1 стабилизирует ADP-состояние. <i>(неверный вариант)</i><br><span class="expl">ADP-состояние стабилизирует белок Hip; BAG1 действует противоположно — ускоряет выход ADP.</span></li><li><b>В.</b> Не изменится: BAG1 действует только на гидролиз ATP. <i>(неверный вариант)</i><br><span class="expl">Гидролиз ATP ускоряет J-белок. BAG1 — фактор обмена нуклеотидов: он действует на следующую стадию, выход ADP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li><li><a href="https://doi.org/10.1074/jbc.M105328200">Gässler C.S., Wiederkehr T., Brehmer D., Bukau B., Mayer M.P. Bag-1M accelerates nucleotide release for human Hsc70 and Hsp70 and can act concentration-dependent as positive and negative cofactor. J Biol Chem. 2001;276:32538–32544</a></li></ul><p>Схема механизма, качественные состояния. Семейства NEF, диапазоны ускорения и действие Hip — по обзору Wentink 2026 (полный текст); ускорение выхода ADP до 900 раз и концентрационная зависимость сворачивания люциферазы — эксперименты in vitro с очищенными Hsc70/Hsp70 человека и BAG-1M (Gässler 2001, реферат). Состояние «избыток NEF» — качественная иллюстрация, а не измерение.</p></details></article><article class="card print-unit" id="ns-hsp70-triage"><div class="eyebrow">Цикл Hsp70 · шаг 4 из 26</div><h2>Как решается судьба субстрата: новая попытка, передача Hsp90 или деградация</h2><p class="lead">Hsp70 не «решает», что делать с субстратом: судьба белка определяется конкуренцией процессов. Белок, который свернулся, перестаёт связываться; белок, который долго остаётся развёрнутым, связывают <a href="#ns-g-S11-T11">Hsp90</a> или убиквитинлигаза <a href="#ns-g-S11-T10">CHIP</a>.</p><ol class="mech"><li>После освобождения субстрат либо сворачивается и прячет гидрофобные участки, либо снова связывается с Hsp70.</li><li>Белок HOP связывает Hsp70 и Hsp90 и помогает передать субстрат Hsp90; для передачи нужен NEF.</li><li>CHIP связывается с C-концевым мотивом EEVD Hsp70 и Hsp90 и убиквитинирует связанный субстрат — он направляется в протеасому.</li></ol><p>За один цикл связывания и освобождения сворачивается лишь часть молекул субстрата. Это показали ещё на бактериальной системе DnaK, DnaJ и GrpE: для полного восстановления активности люциферазы нужны многие циклы. Каждый цикл даёт молекуле новую попытку.</p><p>Белок, который свернулся, прячет гидрофобные участки внутрь глобулы и больше не узнаётся шаперонами. Белок, который остаётся развёрнутым, связывается снова и снова. Поэтому выбор между сворачиванием и деградацией описывают как кинетическую конкуренцию: участки, узнаваемые Hsp70, могут служить и сигналами деградации, если остаются открытыми долго.</p><p>Ход конкуренции смещают кошапероны. HOP связывается с C-концами Hsp70 и Hsp90 и помогает передать субстрат от одного шаперона другому. Убиквитинлигаза CHIP (STUB1) содержит домен TPR, которым связывается с теми же C-концевыми мотивами EEVD, и U-бокс, который переносит убиквитин на субстрат. В экспериментах CHIP вызывал убиквитинирование и протеасомную деградацию глюкокортикоидного рецептора — клиента Hsp90. Белок BAG1 своим убиквитиноподобным доменом связывается с протеасомой, а BAG3 направляет связанные с Hsp70 белки к аутофагии.</p><p>Так шаперонная система соединена с системами деградации: о протеасоме — вопрос 2 семинара, об аутофагии — вопрос 4.</p><div class="note trap"><strong>Типичная ошибка</strong> Hsp70 сам разрушает неправильно свёрнутые белки.<p class="trap-fix">У Hsp70 нет протеолитической активности. Неисправимый субстрат убиквитинирует связанная с шапероном лигаза CHIP, а расщепляет 26S-протеасома; часть субстратов направляется к аутофагии через BAG3.</p></div><div class="static-quiz"><h3>Развёрнутый белок прошёл много циклов связывания с Hsp70, но так и не свернулся. С Hsp70 связана убиквитинлигаза CHIP. Какое событие ожидается для этого белка?</h3><ol><li><b>А.</b> Hsp70 расщепит его в своём субстрат-связывающем домене. <i>(неверный вариант)</i><br><span class="expl">У Hsp70 нет протеолитического центра: SBD связывает полипептид, но не расщепляет его.</span></li><li><b>Б.</b> CHIP присоединит к нему убиквитин, и белок разрушит протеасома. <i>(верный вариант)</i><br><span class="expl">CHIP связывается с C-концом Hsp70 доменом TPR и через U-бокс убиквитинирует субстрат; убиквитинированный белок разрушает 26S-протеасома.</span></li><li><b>В.</b> CHIP ускорит гидролиз ATP, и белок свернётся. <i>(неверный вариант)</i><br><span class="expl">Гидролиз ATP у Hsp70 стимулируют J-белки; CHIP — убиквитинлигаза, она направляет субстрат на деградацию, а не на сворачивание.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.91.22.10345">Szabo A., Langer T., Schröder H. et al. The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ, and GrpE. Proc Natl Acad Sci USA. 1994;91:10345–10349</a></li><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li><li><a href="https://doi.org/10.1038/35050618">Connell P., Ballinger C.A., Jiang J. et al. The co-chaperone CHIP regulates protein triage decisions mediated by heat-shock proteins. Nat Cell Biol. 2001;3:93–96</a></li></ul><p>Схема механизма, качественные состояния. Многократные циклы — эксперименты in vitro с DnaK, DnaJ, GrpE и люциферазой (Szabo 1994, реферат). Роль HOP, CHIP, BAG1 и BAG3 и представление о кинетической конкуренции — по обзору Wentink 2026 (полный текст); убиквитинирование глюкокортикоидного рецептора CHIP — клетки COS (Connell 2001, реферат). На схеме один субстрат показан в трёх вариантах судьбы; вероятности не указаны.</p></details></article><article class="card print-unit" id="ns-hsp70-network"><div class="eyebrow">Цикл Hsp70 · шаг 5 из 26</div><h2>Где ещё работает цикл Hsp70 и что меняется при стрессе</h2><p class="lead">Один и тот же цикл ATP и ADP служит разным задачам: J-белок определяет, где и с каким субстратом работает Hsp70. При стрессе <a href="#ns-g-S11-T12">HSF1</a> усиливает синтез компонентов системы.</p><ol class="mech"><li>В ЭПР <a href="#ns-g-S11-T13">BiP</a> с J-белком DNAJC23 (Sec63) связывает входящую цепь у транслокона Sec61.</li><li>В цитоплазме HSPA8 с J-белком ауксилином (DNAJC6) снимает клатриновую оболочку с пузырьков.</li><li>У животных Hsp70 с J-белками классов A и B и Hsp110 растворяет белковые агрегаты.</li></ol><p>Hsp70 связывает гидрофобные участки почти любой последовательности, поэтому специфичность ему задают J-белки. В ЭПР BiP вместе с J-белком DNAJC23 (Sec63) связывает цепь, входящую через транслокон Sec61, и не даёт ей вернуться в цитоплазму. В митохондриях mtHsp70 (HSPA9) вместе с J-белками, закреплёнными в комплексе TIM, обеспечивает вход белков в матрикс. В цитоплазме HSPA8 с J-белком ауксилином (DNAJC6) разбирает клатриновую оболочку эндоцитозных пузырьков.</p><p>У бактерий, грибов и растений агрегаты растворяет AAA+-белок Hsp100 вместе с Hsp70, а в цитозоле животных дезагрегаз семейства Hsp100 нет. Вместо них работает комплекс Hsp70, J-белков классов A и B и Hsp110 в роли NEF: in vitro он растворял агрегаты люциферазы и других белков после нагревания, а у нематоды снижение содержания Hsp110 нарушало растворение агрегатов после теплового шока.</p><p>При тепловом шоке и других воздействиях, нарушающих сворачивание белков, транскрипционный фактор HSF1 усиливает синтез Hsp70, J-белков и NEF; локальные программы того же рода действуют в ЭПР (UPR) и в митохондриях. С возрастом ёмкость сети протеостаза снижается, а неправильно свёрнутые белки накапливаются, особенно в постмитотических клетках, например в нейронах.</p><p>Общее во всех случаях одно: ATP-зависимый цикл связывания и освобождения, направленный J-белком и завершённый NEF.</p><div class="note trap"><strong>Типичная ошибка</strong> Hsp70 нужен клетке только при тепловом шоке, поэтому его называют белком теплового шока.<p class="trap-fix">Многие Hsp70 синтезируются постоянно (Hsc70, BiP, mtHsp70) и работают и без стресса: в транслокации белков, снятии клатриновой оболочки, сворачивании новых цепей. При тепловом шоке HSF1 дополнительно усиливает синтез индуцибельных форм и кошаперонов.</p></div><div class="static-quiz"><h3>В клетках нематоды снизили содержание Hsp110, затем подвергли их тепловому шоку. Как изменится растворение образовавшихся белковых агрегатов по сравнению с контролем?</h3><ol><li><b>А.</b> Ускорится: Hsp110 конкурирует с Hsp70 за субстрат. <i>(неверный вариант)</i><br><span class="expl">Hsp110 у животных работает вместе с Hsp70 как фактор обмена нуклеотидов; без него растворение агрегатов ослабевает, а не ускоряется.</span></li><li><b>Б.</b> Не изменится: агрегаты растворяет Hsp100. <i>(неверный вариант)</i><br><span class="expl">В цитозоле животных нет дезагрегаз семейства Hsp100 (Hsp104 дрожжей, ClpB бактерий); эту функцию выполняет комплекс Hsp70 с J-белками и Hsp110.</span></li><li><b>В.</b> Замедлится: Hsp110 нужен Hsp70 для растворения агрегатов. <i>(верный вариант)</i><br><span class="expl">Hsp110 как фактор обмена нуклеотидов поддерживает работу Hsp70 и J-белков на агрегатах; у нематоды снижение его содержания нарушало растворение агрегатов после теплового шока (Rampelt 2012).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00890-9">Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. PMID 41145833. Связанные исправления: Publisher Correction, 2026;27:172, doi:10.1038/s41580-025-00932-2, PMID 41198871; Author Correction, 2026;27:875, doi:10.1038/s41580-026-01029-0, PMID 42716998 (рис. 1a: добавлен HSPA6, в семействе 11 белков вместо 10)</a></li><li><a href="https://doi.org/10.1038/emboj.2012.264">Rampelt H., Kirstein-Miles J., Nillegoda N.B. et al. Metazoan Hsp70 machines use Hsp110 to power protein disaggregation. EMBO J. 2012;31:4221–4235</a></li><li><a href="https://doi.org/10.1038/nature14884">Nillegoda N.B., Kirstein J., Szlachcic A. et al. Crucial HSP70 co-chaperone complex unlocks metazoan protein disaggregation. Nature. 2015;524:247–251</a></li><li><a href="https://doi.org/10.1038/s41580-019-0101-y">Hipp M.S., Kasturi P., Hartl F.U. The proteostasis network and its decline in ageing. Nat Rev Mol Cell Biol. 2019;20:421–435</a></li></ul><p>Схема механизма, качественные состояния. Функции BiP и DNAJC23, mtHsp70 и TIM, HSPA8 и ауксилина, роль HSF1 — по обзору Wentink 2026 (полный текст). Растворение агрегатов комплексом Hsp70, J-белков классов A и B и Hsp110: эксперименты in vitro с белками человека и эксперименты на C. elegans (Rampelt 2012; Nillegoda 2015, рефераты). Снижение ёмкости сети протеостаза при старении — обзор Hipp 2019 (полный текст).</p></details></article><article class="card print-unit" id="ns-hsp70-measure"><div class="eyebrow">Цикл Hsp70 · шаг 6 из 26</div><h2>Как проверить работу цикла: сворачивание люциферазы in vitro</h2><p class="lead">Работу шаперонной системы проверяют на модельном белке: <a href="#ns-g-S11-T14">люцифераза</a> после нагревания теряет активность, а свет при окислении люциферина излучают только вновь свернувшиеся молекулы.</p><ol class="mech"><li>Люциферазу разворачивают нагреванием или денатурирующим веществом и переносят в смесь с Hsp70, J-белком, NEF и ATP.</li><li>Через разные промежутки времени из смеси отбирают одинаковые пробы, разводят в регистрационной смеси с люциферином, ATP и Mg²⁺ и сразу измеряют свечение — долю активности от нативной люциферазы.</li><li>Контрольные смеси без одного компонента или с мутантным белком показывают, какая стадия цикла нужна для восстановления активности.</li></ol><p>Сворачивание белка в клетке трудно наблюдать непосредственно, поэтому механизм цикла Hsp70 изучали на очищенных белках. Удобный субстрат — люцифераза светлячка: её активность легко измерить, а развёрнутая люцифераза быстро агрегирует, если шаперонов нет. Восстановление свечения показывает, какая доля молекул вернулась в нативное состояние.</p><p>Полная смесь содержит Hsp70, J-белок, NEF и ATP. Её сравнивают с контролями: без ATP, без J-белка или с J-белком, у которого заменён мотив HPD, без NEF, с Hsp70 без гидролиза ATP (Hsc70 K71M связывает ATP, но не гидролизует его). Если активность не восстанавливается в одном из контролей, значит, соответствующая стадия необходима. Именно так было показано, что сворачивание требует многих циклов связывания и освобождения, а избыток BAG-1M подавляет сворачивание. Сворачивание и измерение разделены: ATP нужен и самой люциферазе для реакции свечения, поэтому все пробы измеряют в одинаковой регистрационной смеси с ATP, а в контроле «без ATP» его нет только на стадии сворачивания. Пробу измеряют сразу после разведения, чтобы стадия регистрации не стала дополнительным временем сворачивания. Полезно сравнивать кривые во времени, а не одну точку: в учебной модели без NEF активность растёт медленно, а без стимуляции гидролиза почти не растёт.</p><p>Метод имеет пределы. Концентрации белков подбирают экспериментаторы, люцифераза — не естественный субстрат, а условия (температура, ионы, фосфат) меняют результат. Поэтому вывод «компонент необходим in vitro» нельзя напрямую переносить на клетку: в клетках его проверяют отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> Если полная смесь восстановила активность люциферазы, то в клетке этот белок сворачивается так же.<p class="trap-fix">Эксперимент in vitro показывает, что выбранных компонентов достаточно в выбранных концентрациях. В клетке состав сети шаперонов, концентрации и субстраты другие; вывод требует проверки в клетках.</p></div><div class="static-quiz"><h3>Люциферазу развернули нагреванием и поместили в смесь Hsc70, J-белка, NEF и ATP. В контрольной смеси Hsc70 дикого типа заменили на Hsc70 K71M. Какой результат контроля ожидается?</h3><ol><li><b>А.</b> Активность почти не восстановится: без гидролиза ATP нет прочного захвата. <i>(верный вариант)</i><br><span class="expl">Hsc70 K71M связывает ATP, но не гидролизует его; крышка SBD не закрывается над субстратом, и люцифераза агрегирует почти как без шаперона.</span></li><li><b>Б.</b> Активность восстановится быстрее: ATP не будет тратиться впустую. <i>(неверный вариант)</i><br><span class="expl">Расход ATP не потеря: гидролиз нужен для прочного захвата субстрата; без него восстановления почти нет.</span></li><li><b>В.</b> Активность восстановится так же: связывания ATP достаточно. <i>(неверный вариант)</i><br><span class="expl">Связывание ATP оставляет Hsp70 в открытом состоянии с быстрым отходом субстрата; для захвата нужен гидролиз ATP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-11.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.91.22.10345">Szabo A., Langer T., Schröder H. et al. The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ, and GrpE. Proc Natl Acad Sci USA. 1994;91:10345–10349</a></li><li><a href="https://doi.org/10.1074/jbc.271.27.15874">O&#x27;Brien M.C., Flaherty K.M., McKay D.B. Lysine 71 of the chaperone protein Hsc70 is essential for ATP hydrolysis. J Biol Chem. 1996;271:15874–15878</a></li><li><a href="https://doi.org/10.1074/jbc.M105328200">Gässler C.S., Wiederkehr T., Brehmer D., Bukau B., Mayer M.P. Bag-1M accelerates nucleotide release for human Hsc70 and Hsp70 and can act concentration-dependent as positive and negative cofactor. J Biol Chem. 2001;276:32538–32544</a></li><li><a href="https://doi.org/10.1038/s41467-019-14245-4">Imamoglu R., Balchin D., Hayer-Hartl M., Hartl F.U. Bacterial Hsp70 resolves misfolded states and accelerates productive folding of a multi-domain protein. Nat Commun. 2020;11:365</a></li></ul><p>Схема метода · условные пиктограммы. Кривые на второй карточке рассчитаны по учебной модели практикума (вопрос 1, продвинутый уровень), а не взяты из статьи. Многократные циклы — DnaK, DnaJ, GrpE и люцифераза in vitro (Szabo 1994, реферат); разведение проб в регистрационной смеси и измерение в течение 2 с — Imamoglu 2020 (раздел Methods); Hsc70 K71M — ATPазный фрагмент Hsc70 быка, ATP связан, гидролиза нет (O'Brien 1996, реферат); подавление сворачивания избытком BAG-1M — Gässler 2001 (реферат).</p></details></article><article class="card print-unit" id="ns-ubiquitin-cascade"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 7 из 26</div><h2>Как каскад E1–E2–E3 присоединяет убиквитин к субстрату</h2><p class="lead"><a href="#ns-g-S11-T15">Убиквитин</a> присоединяется к белку-мишени не одним ферментом, а цепочкой из трёх: <a href="#ns-g-S11-T16">E1</a> активирует его за счёт ATP, <a href="#ns-g-S11-T17">E2</a> переносит, а <a href="#ns-g-S11-T18">убиквитинлигаза E3</a> выбирает субстрат.</p><ol class="mech"><li>E1 расходует ATP: образует аденилат убиквитина и присоединяет убиквитин тиоэфирной связью к собственному цистеину.</li><li>E1 передаёт убиквитин на цистеин E2, и E2·убиквитин связывается с убиквитинлигазой E3.</li><li>E3 связывает субстрат и обеспечивает перенос убиквитина на ε-аминогруппу остатка лизина субстрата.</li></ol><p>Убиквитин — белок из 76 аминокислот. Его C-концевой глицин может образовать связь с остатком лизина другого белка. Сам по себе убиквитин к белкам не присоединяется: его нужно активировать.</p><p>Активацию выполняет фермент E1 (у человека в основном UBA1). E1 использует энергию ATP: сначала образуется аденилат убиквитина и освобождается пирофосфат, затем убиквитин присоединяется тиоэфирной связью к цистеину активного центра E1. Далее убиквитин переходит на цистеин фермента E2 — у человека около 40 генов E2.</p><p>Выбор субстрата — работа убиквитинлигазы E3; таких генов у человека около 600. E3 одновременно связывает E2·убиквитин и субстрат. RING-лигазы сближают их, и убиквитин переходит прямо с E2 на лизин субстрата. HECT-лигазы сначала принимают убиквитин на собственный цистеин и уже затем переносят его на субстрат; RBR-лигазы сочетают оба способа.</p><p>Повторные циклы удлиняют цепь: следующий убиквитин присоединяется к лизину уже присоединённого убиквитина. Если ингибировать E1, например соединением TAK-243, остановится убиквитинирование всех субстратов, а если устранить одну E3 — только её субстратов. Поэтому избирательность системы определяется прежде всего многообразием E3.</p><div class="note trap"><strong>Типичная ошибка</strong> Протеасома сама находит белки, которые нужно разрушить, а убиквитин — лишь кофактор протеасомы.<p class="trap-fix">Белок выбирает убиквитинлигаза E3, узнающая его дегрон; протеасома связывает уже присоединённую цепь убиквитина и почти не различает субстраты по их последовательности.</p></div><div class="static-quiz"><h3>В клетках ингибировали одну убиквитинлигазу E3, а E1 и E2 продолжают работать. Как изменится убиквитинирование белков клетки?</h3><ol><li><b>А.</b> Остановится для всех белков клетки <i>(неверный вариант)</i><br><span class="expl">Общая стадия каскада — E1; ингибирование одной E3 не мешает другим лигазам переносить убиквитин на свои субстраты.</span></li><li><b>Б.</b> Нарушится только для субстратов этой E3 <i>(верный вариант)</i><br><span class="expl">Каждая E3 узнаёт свои дегроны; остальные лигазы продолжают работу, поэтому затронуты только её субстраты.</span></li><li><b>В.</b> Не изменится ни для одного белка <i>(неверный вариант)</i><br><span class="expl">У субстратов этой E3 убиквитинирование снизится: другие лигазы обычно не узнают их дегрон.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00870-z">Zhang Z., Mena E.L., Timms R.T., Koren I., Elledge S.J. Degrons: defining the rules of protein degradation. Nat Rev Mol Cell Biol. 2025;26:868–883. doi:10.1038/s41580-025-00870-z</a></li><li><a href="https://doi.org/10.1038/nm.4474">Hyer M.L., Milhollen M.A., Ciavarri J. et al. A small-molecule inhibitor of the ubiquitin activating enzyme for cancer treatment. Nat Med. 2018;24:186–193. doi:10.1038/nm.4474</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.04.023">Collins G.A., Goldberg A.L. The logic of the 26S proteasome. Cell. 2017;169:792–806. doi:10.1016/j.cell.2017.04.023</a></li></ul><p>Схема механизма, качественные состояния. Число E3 у человека — по обзору Zhang 2025 (полный текст); число E2 — около 40, по обзорам. Действие TAK-243 показано на клетках опухолевых линий человека: ингибитор E1 снижал содержание убиквитиновых конъюгатов (Hyer 2018, реферат). Обозначения «работает», «остановлено» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-degron"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 8 из 26</div><h2>Что такое дегрон и как убиквитинлигаза узнаёт субстрат</h2><p class="lead"><a href="#ns-g-S11-T19">Дегрон</a> — участок белка, который узнаёт убиквитинлигаза E3. Он может существовать всегда, а может возникать после модификации белка, например после <a href="#ns-g-S11-T20">фосфорилирования</a>.</p><ol class="mech"><li>Убиквитинлигаза E3 связывает дегрон субстрата своим узнающим модулем, например F-бокс-белком βTrCP в составе SCF.</li><li>Киназа фосфорилирует остатки мотива, и только фосфорилированный мотив связывается с βTrCP — так сигнал создаёт дегрон.</li><li>Замена ключевых остатков дегрона может лишить E3 возможности связать субстрат: тогда белок перестаёт убиквитинироваться и становится устойчивым.</li></ol><p>Дегроны разнообразны. N-дегрон — дестабилизирующий N-концевой остаток, который узнают специальные E3; C-дегрон — короткий мотив на C-конце. Внутренние дегроны — короткие мотивы внутри последовательности или гидрофобные участки, открывающиеся при нарушении сворачивания. У циклина B дегрон — D-бокс, его узнаёт лигаза APC/C.</p><p>Многие дегроны возникают по сигналу. В IκBα — ингибиторе транскрипционного фактора NF-κB — мотив DSGΨxS становится дегроном после фосфорилирования S32 и S36 киназой IKK. Фосфорилированный мотив связывает F-бокс-белок βTrCP в составе куллиновой лигазы SCF; такой же фосфодегрон есть у β-катенина. Замены S32A/S36A в IκBα не позволяют IKK фосфорилировать эти остатки, и IκBα не разрушается после стимула.</p><p>Дегрон и цепь убиквитина — разные сигналы. Дегрон узнаёт E3, и от этого узнавания зависит, будет ли белок убиквитинирован. Цепь убиквитина затем узнаёт протеасома. Поэтому замена ключевых остатков дегрона стабилизирует белок, хотя его последовательность почти не изменилась.</p><p>Дегроны известны лишь для небольшой части из примерно 600 E3 человека. Их ищут, систематически заменяя участки белков и измеряя устойчивость репортёров. Один и тот же белок может иметь несколько дегронов, которые узнают разные лигазы в разных условиях.</p><div class="note trap"><strong>Типичная ошибка</strong> Дегрон — это и есть цепь убиквитина на белке.<p class="trap-fix">Дегрон — участок самого субстрата, который узнаёт E3. Цепь убиквитина появляется после узнавания дегрона и служит сигналом уже для протеасомы.</p></div><div class="static-quiz"><h3>IκBα дикого типа и IκBα S32A/S36A экспрессируют в клетках и добавляют TNFα, который активирует IKK. Связывание с βTrCP какой формы IκBα усилится после стимула?</h3><ol><li><b>А.</b> Только формы дикого типа <i>(верный вариант)</i><br><span class="expl">У IκBα дикого типа IKK фосфорилирует S32 и S36, и фосфорилированный мотив связывается с βTrCP; у мутанта эти остатки заменены аланином.</span></li><li><b>Б.</b> Только мутантной формы <i>(неверный вариант)</i><br><span class="expl">Мутант S32A/S36A не может быть фосфорилирован по этим остаткам, а βTrCP связывает именно фосфорилированный мотив.</span></li><li><b>В.</b> Обеих форм в равной мере <i>(неверный вариант)</i><br><span class="expl">Связывание βTrCP требует фосфорилирования S32 и S36, поэтому две формы ведут себя по-разному.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00870-z">Zhang Z., Mena E.L., Timms R.T., Koren I., Elledge S.J. Degrons: defining the rules of protein degradation. Nat Rev Mol Cell Biol. 2025;26:868–883. doi:10.1038/s41580-025-00870-z</a></li><li><a href="https://doi.org/10.1073/pnas.1816596116">Varshavsky A. N-degron and C-degron pathways of protein degradation. Proc Natl Acad Sci USA. 2019;116:358–366. doi:10.1073/pnas.1816596116</a></li><li><a href="https://doi.org/10.1101/gad.13.3.270">Winston J.T., Strack P., Beer-Romero P. et al. The SCFβ-TRCP-ubiquitin ligase complex associates specifically with phosphorylated destruction motifs in IκBα and β-catenin and stimulates IκBα ubiquitination in vitro. Genes Dev. 1999;13:270–283. doi:10.1101/gad.13.3.270. Исправление: Genes Dev. 1999;13:1050 (заново напечатан рис. 3a)</a></li><li><a href="https://doi.org/10.1126/science.7878466">Brown K., Gerstberger S., Carlson L., Franzoso G., Siebenlist U. Control of IκB-α proteolysis by site-specific, signal-induced phosphorylation. Science. 1995;267:1485–1488. doi:10.1126/science.7878466</a></li><li><a href="https://doi.org/10.1038/349132a0">Glotzer M., Murray A.W., Kirschner M.W. Cyclin is degraded by the ubiquitin pathway. Nature. 1991;349:132–138. doi:10.1038/349132a0</a></li></ul><p>Схема механизма, качественные состояния. Фосфодегрон IκBα и β-катенина и его связывание с SCF(βTrCP) — по Winston 1999 (реферат; белки человека, клетки и in vitro); устойчивость мутанта S32A/S36A после стимула — по Brown 1995 и Chen 1995 (рефераты; клеточные линии человека). Классы дегронов — по обзорам Varshavsky 2019 (реферат) и Zhang 2025 (полный текст); D-бокс циклина — Glotzer 1991 (реферат через обзор).</p></details></article><article class="card print-unit" id="ns-ub-chain"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 9 из 26</div><h2>Какая цепь убиквитина направляет белок в протеасому</h2><p class="lead">Убиквитин сам содержит семь остатков лизина, поэтому цепи бывают разными. Классический сигнал для протеасомы — <a href="#ns-g-S11-T21">цепь, связанная через K48</a>; в экспериментах in vitro эффективной оказалась цепь из четырёх и более молекул убиквитина.</p><ol class="mech"><li>Следующий убиквитин присоединяется к одному из лизинов предыдущего; при связывании через K48 цепь узнают рецепторы 19S-частицы.</li><li>В экспериментах с модельными субстратами in vitro эффективным сигналом была цепь K48 из четырёх убиквитинов: более короткая цепь связывалась с протеасомой во много раз слабее.</li><li>Моноубиквитинирование и цепи K63 чаще служат сигналами эндоцитоза, репарации ДНК и сборки сигнальных комплексов; <a href="#ns-g-S11-T22">деубиквитиназы</a> снимают убиквитин.</li></ol><p>Убиквитин может присоединиться к белку одной молекулой (моноубиквитинирование), несколькими отдельными молекулами или цепью. В цепи каждый следующий убиквитин связан с одним из семи лизинов или с N-концевым метионином предыдущего. Тип связи определяет форму цепи и то, какие белки её узнают.</p><p>Классический сигнал протеасомного разрушения — цепь, связанная через K48. В экспериментах с однородными модельными субстратами эффективным сигналом была цепь из четырёх убиквитинов: укорочение цепи на две молекулы снижало её сродство к протеасоме примерно в 100 раз. Разветвлённые цепи K11/K48, которые строит лигаза APC/C, ускоряют разрушение ещё сильнее. Четыре убиквитина — не универсальный порог: часть белков клетки разрушается протеасомой и после присоединения отдельных молекул убиквитина, не связанных в цепь (Braten 2016); значение имеют и число меток, и их расположение, и свойства самого субстрата.</p><p>Цепи K63 и моноубиквитин обычно не направляют белок в протеасому. Они участвуют в эндоцитозе мембранных белков, в репарации ДНК и в сборке сигнальных комплексов, например в пути NF-κB. Поэтому формула «убиквитин — метка смерти» неточна.</p><p>Убиквитинирование обратимо. Деубиквитиназы отщепляют убиквитин и могут спасти белок от разрушения, а в протеасоме они отщепляют цепь перед расщеплением, и убиквитин используется снова. Итоговая судьба белка зависит от соотношения скоростей присоединения и снятия цепи.</p><div class="note trap"><strong>Типичная ошибка</strong> Любой убиквитин на белке означает, что белок будет разрушен протеасомой.<p class="trap-fix">Судьба белка зависит от типа и длины цепи: классический сигнал протеасомы — цепь K48, а моноубиквитинирование и цепи K63 обычно служат другим целям, хотя некоторые белки разрушаются протеасомой и после моноубиквитинирования.</p></div><div class="static-quiz"><h3>Модельный субстрат несёт одну молекулу убиквитина. Лигазу заменили на такую, которая присоединяет к нему цепь из четырёх убиквитинов, связанных через K48. Как изменится связывание субстрата с 26S-протеасомой?</h3><ol><li><b>А.</b> Ослабнет: длинная цепь мешает связыванию <i>(неверный вариант)</i><br><span class="expl">Рецепторы 19S связывают именно цепи K48; удлинение цепи до четырёх убиквитинов усиливает, а не ослабляет связывание.</span></li><li><b>Б.</b> Не изменится: важен сам факт убиквитинирования <i>(неверный вариант)</i><br><span class="expl">Для модельного субстрата важны длина и тип цепи: одиночный убиквитин связывается с протеасомой слабо, а цепь из четырёх убиквитинов K48 — эффективный сигнал.</span></li><li><b>В.</b> Усилится: такая цепь — эффективный сигнал протеасомы <i>(верный вариант)</i><br><span class="expl">В экспериментах in vitro цепь K48 из четырёх убиквитинов связывалась с протеасомой намного прочнее, чем одиночный убиквитин.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/emboj/19.1.94">Thrower J.S., Hoffman L., Rechsteiner M., Pickart C.M. Recognition of the polyubiquitin proteolytic signal. EMBO J. 2000;19:94–102. doi:10.1093/emboj/19.1.94</a></li><li><a href="https://doi.org/10.1016/j.cell.2014.03.037">Meyer H.-J., Rape M. Enhanced protein degradation by branched ubiquitin chains. Cell. 2014;157:910–921. doi:10.1016/j.cell.2014.03.037</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.04.023">Collins G.A., Goldberg A.L. The logic of the 26S proteasome. Cell. 2017;169:792–806. doi:10.1016/j.cell.2017.04.023</a></li><li><a href="https://doi.org/10.1073/pnas.1608644113">Braten O., Livneh I., Ziv T. et al. Numerous proteins with unique characteristics are degraded by the 26S proteasome following monoubiquitination. Proc Natl Acad Sci USA. 2016;113:E4639–E4647. doi:10.1073/pnas.1608644113</a></li></ul><p>Схема механизма, качественные состояния. Минимальный сигнал из четырёх убиквитинов и снижение сродства при укорочении цепи — по Thrower 2000 (реферат; in vitro, однородные цепи K48 и модельные субстраты, очищенная протеасома). Разветвлённые цепи K11/K48 — Meyer 2014 (реферат; клетки человека и in vitro, субстраты APC/C). Разрушение после моноубиквитинирования — Braten 2016 (реферат; клетки человека и дрожжей, убиквитин, не образующий цепей). Функции цепей K63 — по обзорам. Подписи «сильное», «слабое» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-proteasome-26s"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 10 из 26</div><h2>Как 26S-протеасома узнаёт, разворачивает и расщепляет субстрат</h2><p class="lead"><a href="#ns-g-S11-T23">26S-протеасома</a> состоит из 20S-частицы с протеолитическими центрами внутри и 19S-частиц, которые связывают цепь убиквитина, отщепляют её и за счёт ATP разворачивают белок.</p><ol class="mech"><li>Рецепторы 19S-частицы (Rpn1, Rpn10, Rpn13) связывают цепь K48, а кольцо ATPаз Rpt захватывает неструктурированный участок субстрата.</li><li>Когда белок уже захвачен, металлопротеаза <a href="#ns-g-S11-T24">Rpn11</a> отщепляет цепь целиком, и убиквитин используется снова.</li><li>ATPазы разворачивают белок и продвигают его в 20S-частицу, где центры β1, β2 и β5 расщепляют его до коротких пептидов.</li></ol><p>20S-частица — полый цилиндр из четырёх колец: два внешних α-кольца и два внутренних β-кольца. Протеолитические центры находятся внутри, в β-субъединицах: β1 расщепляет связи после кислых остатков, β2 — после основных, β5 — после гидрофобных. Вход в камеру узкий, и свёрнутый белок пройти в неё не может.</p><p>19S-частица решает эту задачу. Её рецепторы Rpn1, Rpn10 и Rpn13 связывают цепь убиквитина. Для начала расщепления нужен ещё неструктурированный участок субстрата: его захватывает кольцо из шести ATPаз Rpt. Модельный белок с цепью убиквитина, но без такого участка, разрушается медленно.</p><p>Цепь убиквитина в камеру не попадает: её целиком отщепляет металлопротеаза Rpn11, причём это происходит, когда белок уже захвачен. Деубиквитиназа UCH37, напротив, связана с Rpn13 и может укорачивать цепь до захвата. ATPазы Rpt за счёт гидролиза ATP разворачивают белок и протягивают его в 20S-частицу.</p><p>Продукты 26S-протеасомы — пептиды длиной от 3 до 22 остатков; их расщепляют до аминокислот цитоплазматические пептидазы. Ингибиторы <a href="#ns-g-S11-T29">бортезомиб</a> и карфилзомиб связываются прежде всего с центрами β5; в клетках при этом накапливаются полиубиквитинированные белки.</p><div class="note trap"><strong>Типичная ошибка</strong> Цепь убиквитина разрушается в протеасоме вместе с белком.<p class="trap-fix">Rpn11 отщепляет цепь убиквитина до того, как белок входит в 20S-частицу; убиквитин освобождается и используется снова.</p></div><div class="static-quiz"><h3>К тесно свёрнутому модельному белку присоединили цепь из четырёх убиквитинов K48, но у него нет неструктурированного участка. Как изменится скорость его расщепления 26S-протеасомой по сравнению с таким же белком, к которому добавлен неструктурированный хвост?</h3><ol><li><b>А.</b> Будет ниже <i>(верный вариант)</i><br><span class="expl">Цепь убиквитина обеспечивает связывание, но захват и разворачивание начинаются с неструктурированного участка; без него расщепление идёт медленно.</span></li><li><b>Б.</b> Будет выше <i>(неверный вариант)</i><br><span class="expl">Неструктурированный участок не мешает расщеплению, а нужен для его начала: без него белок разрушается медленнее, а не быстрее.</span></li><li><b>В.</b> Будет такой же <i>(неверный вариант)</i><br><span class="expl">Одной цепи недостаточно для эффективного расщепления свёрнутого белка: протеасоме нужен ещё участок инициации.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nsmb814">Prakash S., Tian L., Ratliff K.S., Lehotzky R.E., Matouschek A. An unstructured initiation site is required for efficient proteasome-mediated degradation. Nat Struct Mol Biol. 2004;11:830–837. doi:10.1038/nsmb814</a></li><li><a href="https://doi.org/10.1126/science.1075898">Verma R., Aravind L., Oania R. et al. Role of Rpn11 metalloprotease in deubiquitination and degradation by the 26S proteasome. Science. 2002;298:611–615. doi:10.1126/science.1075898</a></li><li><a href="https://doi.org/10.1038/nature01071">Yao T., Cohen R.E. A cryptic protease couples deubiquitination and degradation by the proteasome. Nature. 2002;419:403–407. doi:10.1038/nature01071</a></li><li><a href="https://doi.org/10.1038/sj.emboj.7601450">Qiu X.-B., Ouyang S.-Y., Li C.-J. et al. hRpn13/ADRM1/GP110 is a novel proteasome subunit that binds the deubiquitinating enzyme, UCH37. EMBO J. 2006;25:5742–5753. doi:10.1038/sj.emboj.7601450</a></li><li><a href="https://doi.org/10.1126/science.aav0725">de la Peña A.H., Goodall E.A., Gates S.N., Lander G.C., Martin A. Substrate-engaged 26S proteasome structures reveal mechanisms for ATP-hydrolysis-driven translocation. Science. 2018;362:eaav0725. doi:10.1126/science.aav0725</a></li><li><a href="https://doi.org/10.1074/jbc.274.6.3363">Kisselev A.F., Akopian T.N., Woo K.M., Goldberg A.L. The sizes of peptides generated from protein by mammalian 26 and 20 S proteasomes. J Biol Chem. 1999;274:3363–3371. doi:10.1074/jbc.274.6.3363</a></li></ul><p>Схема механизма, качественные состояния. Роль неструктурированного участка — Prakash 2004 (реферат; модельные белки с цепью убиквитина, очищенная протеасома). Rpn11 — Verma 2002 (дрожжи) и Yao 2002 (реферат); связь UCH37 с Rpn13 — Qiu 2006 (реферат; клетки человека). Работа ATPаз — крио-ЭМ структуры дрожжевой 26S-протеасомы с субстратом (de la Peña 2018, реферат). Длина пептидов — Kisselev 1999 (реферат; протеасомы из мышц кролика, денатурированные белки).</p></details></article><article class="card print-unit" id="ns-ups-regulation"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 11 из 26</div><h2>Как сигнал превращается в разрушение регулятора</h2><p class="lead">Разрушение белка-ингибитора — быстрый способ включить ответ без синтеза новых белков. Путь <a href="#ns-g-S11-T25">NF-κB</a> показывает, как сигнал рецептора создаёт дегрон, и как разные препараты останавливают этот путь на разных звеньях.</p><ol class="mech"><li>TNFα активирует IKK; IKK фосфорилирует IκBα по S32 и S36, и SCF(βTrCP) строит на IκBα цепь K48.</li><li>26S-протеасома расщепляет IκBα, и освобождённый NF-κB перемещается в ядро.</li><li>Активность куллиновых лигаз, в том числе SCF, требует присоединения NEDD8 к куллину; <a href="#ns-g-S11-T26">MLN4924</a> блокирует этот шаг.</li></ol><p>В покое NF-κB связан с IκBα и находится в цитоплазме. После связывания TNFα с рецептором активируется киназа IKK. Она фосфорилирует IκBα, лигаза SCF(βTrCP) убиквитинирует его, и 26S-протеасома расщепляет IκBα, ещё связанный с NF-κB. В клетках HeLa IκBα после стимула разрушается за десятки минут; ингибиторы протеаз этот распад предотвращали.</p><p>Порядок событий проверяют воздействиями на отдельные звенья. Замены S32A/S36A убирают сайты фосфорилирования. Ингибитор протеасомы не мешает фосфорилированию и убиквитинированию, поэтому накапливается полиубиквитинированный IκBα, а NF-κB не освобождается. MLN4924 ингибирует фермент, активирующий NEDD8: без присоединения NEDD8 к куллину лигаза SCF малоактивна, и в клетках накапливается фосфорилированный IκBα без цепи убиквитина.</p><p>Протеасомная система регулирует сама себя. При ингибировании протеасомы транскрипционный фактор NRF1 повышает экспрессию генов субъединиц протеасомы, и клетки частично восстанавливают протеолитическую активность.</p><p>В растущих клетках млекопитающих на 26S-протеасому приходится не меньше 80 % внутриклеточного распада белков. Ингибиторы протеасомы — бортезомиб и карфилзомиб — применяют при множественной миеломе: клетки, синтезирующие много иммуноглобулинов, особенно зависят от протеасомы.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование IκBα само отделяет его от NF-κB, и протеасома для активации NF-κB не нужна.<p class="trap-fix">Фосфорилированный и даже убиквитинированный IκBα остаётся связанным с NF-κB; NF-κB освобождается только после расщепления IκBα протеасомой, и ингибиторы протеасомы эту активацию блокируют.</p></div><div class="static-quiz"><h3>Клетки 60 мин инкубировали с MLN4924, затем добавили TNFα. Какая форма IκBα накопится через 20 мин?</h3><ol><li><b>А.</b> Полиубиквитинированный IκBα <i>(неверный вариант)</i><br><span class="expl">Цепь убиквитина на IκBα строит куллиновая лигаза SCF, которая без NEDD8 малоактивна; при MLN4924 цепь почти не образуется.</span></li><li><b>Б.</b> Фосфорилированный IκBα без цепи убиквитина <i>(верный вариант)</i><br><span class="expl">MLN4924 не действует на IKK: IκBα фосфорилируется, но SCF без NEDD8 почти не убиквитинирует его, и белок не разрушается.</span></li><li><b>В.</b> Никакая: IκBα разрушится, как в контроле <i>(неверный вариант)</i><br><span class="expl">Разрушение IκBα требует убиквитинирования куллиновой лигазой, а её активность при MLN4924 подавлена.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/365182a0">Henkel T., Machleidt T., Alkalay I. et al. Rapid proteolysis of IκB-α is necessary for activation of transcription factor NF-κB. Nature. 1993;365:182–185. doi:10.1038/365182a0</a></li><li><a href="https://doi.org/10.1101/gad.9.13.1586">Chen Z., Hagler J., Palombella V.J. et al. Signal-induced site-specific phosphorylation targets IκBα to the ubiquitin-proteasome pathway. Genes Dev. 1995;9:1586–1597. doi:10.1101/gad.9.13.1586</a></li><li><a href="https://doi.org/10.1016/s0092-8674(94)90482-0">Palombella V.J., Rando O.J., Goldberg A.L., Maniatis T. The ubiquitin-proteasome pathway is required for processing the NF-κB1 precursor protein and the activation of NF-κB. Cell. 1994;78:773–785. doi:10.1016/s0092-8674(94)90482-0</a></li><li><a href="https://doi.org/10.1182/blood-2010-03-272567">Milhollen M.A., Traore T., Adams-Duffy J. et al. MLN4924, a NEDD8-activating enzyme inhibitor, is active in diffuse large B-cell lymphoma models: rationale for treatment of NF-κB-dependent lymphoma. Blood. 2010;116:1515–1523. doi:10.1182/blood-2010-03-272567</a></li><li><a href="https://doi.org/10.1038/nature07884">Soucy T.A., Smith P.G., Milhollen M.A. et al. An inhibitor of NEDD8-activating enzyme as a new approach to treat cancer. Nature. 2009;458:732–736. doi:10.1038/nature07884</a></li><li><a href="https://doi.org/10.1016/j.molcel.2010.02.029">Radhakrishnan S.K., Lee C.S., Young P. et al. Transcription factor Nrf1 mediates the proteasome recovery pathway after proteasome inhibition in mammalian cells. Mol Cell. 2010;38:17–28. doi:10.1016/j.molcel.2010.02.029</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.04.023">Collins G.A., Goldberg A.L. The logic of the 26S proteasome. Cell. 2017;169:792–806. doi:10.1016/j.cell.2017.04.023</a></li></ul><p>Схема механизма, качественные состояния. Порядок событий — Henkel 1993 (реферат; клетки HeLa и другие линии, разные стимулы), Chen 1995 и Palombella 1994 (рефераты; клеточные линии человека, ингибиторы протеасомы). Накопление фосфорилированного IκBα при MLN4924 — Milhollen 2010 (реферат; клетки B-клеточной лимфомы); механизм MLN4924 — Soucy 2009 (реферат). Восстановление протеасом через NRF1 — Radhakrishnan 2010 (реферат; клетки млекопитающих). Доля протеасомного распада — обзор Collins 2017.</p></details></article><article class="card print-unit" id="ns-ups-measure"><div class="eyebrow">Дегрон и 26S-протеасома · шаг 12 из 26</div><h2>Как измерить скорость распада белка</h2><p class="lead">Количество белка на блоте не говорит, быстро ли он разрушается. Скорость распада измеряют, остановив синтез <a href="#ns-g-S11-T27">циклогексимидом</a> и проследив, как убывает белок; путь распада определяют ингибиторами.</p><ol class="mech"><li>Циклогексимид останавливает трансляцию, после чего содержание белка меняется только за счёт его распада.</li><li>Пробы, взятые через равные промежутки, анализируют иммуноблотом и строят кривую убывания; по ней находят <a href="#ns-g-S11-T28">период полужизни</a>.</li><li>Ингибитор протеасомы или лизосом и замена остатков дегрона показывают, каким путём и по какому сигналу белок разрушается.</li></ol><p>Стационарное содержание белка определяется соотношением скоростей синтеза и распада, поэтому одна полоса на блоте не различает «много синтезируется» и «медленно разрушается». Чтобы измерить распад, синтез останавливают. Циклогексимид ингибирует элонгацию трансляции на рибосоме, и новые молекулы перестают появляться.</p><p>После добавления циклогексимида клетки собирают через равные промежутки, например через 0, 15, 30 и 60 мин, и измеряют содержание белка иммуноблотом. Интенсивности полос, нормированные на контроль нанесения, откладывают на графике; время, за которое остаётся половина исходного количества, называют периодом полужизни.</p><p>Путь распада определяют ингибиторами. Если бортезомиб замедляет убывание белка, белок разрушается протеасомой; если действует бафиломицин, нарушающий работу лизосом, — участвует лизосомный путь. Замена остатков предполагаемого дегрона, которая стабилизирует белок, указывает на его сигнал узнавания.</p><p>У метода есть ограничения. Циклогексимид останавливает синтез и короткоживущих регуляторов самой системы деградации и вызывает стресс, поэтому прослеживание ограничивают несколькими часами. Ингибиторы при больших дозах действуют и на другие мишени. Измеренный период полужизни относится к данным клеткам и условиям.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белка на блоте много, значит он медленно разрушается.<p class="trap-fix">Содержание белка зависит и от синтеза, и от распада; скорость распада измеряют отдельно, остановив синтез и проследив убывание белка во времени.</p></div><div class="static-quiz"><h3>Клетки обработали циклогексимидом и через 0, 30 и 60 мин измерили белок X. Через 30 мин осталась половина исходного количества. В параллельных чашках с бортезомибом через 60 мин белка X почти столько же, сколько в начале. Какой вывод следует?</h3><ol><li><b>А.</b> X стабилен, его синтез идёт быстро <i>(неверный вариант)</i><br><span class="expl">Синтез остановлен циклогексимидом, поэтому сохранение белка не может объясняться синтезом; в контроле X убывает с периодом полужизни 30 мин.</span></li><li><b>Б.</b> X разрушается в основном протеасомой <i>(верный вариант)</i><br><span class="expl">При остановленном синтезе X убывает с периодом полужизни 30 мин, а ингибитор протеасомы почти останавливает это убывание.</span></li><li><b>В.</b> X разрушается в основном в лизосомах <i>(неверный вариант)</i><br><span class="expl">Бортезомиб ингибирует протеасому, а не лизосомы; чтобы проверить лизосомный путь, нужен ингибитор лизосом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-11.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/365182a0">Henkel T., Machleidt T., Alkalay I. et al. Rapid proteolysis of IκB-α is necessary for activation of transcription factor NF-κB. Nature. 1993;365:182–185. doi:10.1038/365182a0</a></li><li><a href="https://doi.org/10.1101/gad.9.13.1586">Chen Z., Hagler J., Palombella V.J. et al. Signal-induced site-specific phosphorylation targets IκBα to the ubiquitin-proteasome pathway. Genes Dev. 1995;9:1586–1597. doi:10.1101/gad.9.13.1586</a></li><li><a href="https://doi.org/10.1016/j.molcel.2010.02.029">Radhakrishnan S.K., Lee C.S., Young P. et al. Transcription factor Nrf1 mediates the proteasome recovery pathway after proteasome inhibition in mammalian cells. Mol Cell. 2010;38:17–28. doi:10.1016/j.molcel.2010.02.029</a></li></ul><p>Схема метода, условные пиктограммы и кривые — не данные конкретного эксперимента. Пример с IκBα — по Henkel 1993 и Chen 1995 (рефераты; клетки HeLa, TNFα, циклогексимид). Ограничения метода — общие для прослеживания с циклогексимидом; восстановление протеасом при их ингибировании — Radhakrishnan 2010 (реферат).</p></details></article><article class="card print-unit" id="ns-glycan-code"><div class="eyebrow">N-гликаны и ERAD · шаг 13 из 26</div><h2>Как N-гликан становится меткой состояния белка в ЭПР</h2><p class="lead">Почти каждый белок, поступающий в секреторный путь, получает в ЭПР крупный N-гликан. Его состав меняется по мере сворачивания белка, поэтому гликан служит меткой, по которой ферменты и лектины ЭПР определяют состояние белка.</p><ol class="mech"><li>Гликан-предшественник <a href="#ns-g-S11-T32">Glc₃Man₉GlcNAc₂</a> собирается на мембране ЭПР на липидном носителе — долихолпирофосфате (Dol-PP).</li><li><a href="#ns-g-S11-T31">Олигосахарилтрансфераза</a> переносит его целиком на остаток Asn растущей цепи, если этот Asn входит в <a href="#ns-g-S11-T30">секвон</a> Asn–X–Ser/Thr (X — не пролин).</li><li><a href="#ns-g-S11-T33">Глюкозидазы I и II</a> сразу начинают отщеплять глюкозы, и каждая форма гликана узнаётся своими ферментами и лектинами.</li></ol><p>Сборка гликана начинается на цитоплазматической стороне мембраны ЭПР. Здесь к долихолфосфату (Dol-P) присоединяется GlcNAc-фосфат, и на образовавшемся долихолпирофосфате (Dol-PP) собирается Man₅GlcNAc₂. Затем он переносится на люминальную сторону, где присоединяются ещё четыре маннозы и три глюкозы; их доноры — Dol-P-Man и Dol-P-Glc. В сборке участвуют более тридцати белков. Готовый предшественник Glc₃Man₉GlcNAc₂ олигосахарилтрансфераза (OST) переносит с Dol-PP на белок одним блоком.</p><p>Гликан присоединяется только к Asn секвона Asn–X–Ser/Thr; встречается и Asn–X–Cys, а X — любая аминокислота, кроме пролина. У человека два комплекса OST. OST-A с каталитической субъединицей STT3A связан с транслоконом Sec61 и гликозилирует цепь по мере её поступления в ЭПР. OST-B со STT3B гликозилирует посттрансляционно сайты, пропущенные OST-A; для этого сайт должен остаться доступным и не оказаться внутри свёрнутой структуры.</p><p>Сразу после переноса глюкозидаза I отщепляет крайнюю глюкозу, глюкозидаза II — вторую. Гликан с одной глюкозой связывают лектины-шапероны калнексин и кальретикулин, и с этого момента состав гликана сообщает, на каком этапе находится белок.</p><p>Схема показывает один гликан, хотя у многих белков их несколько. Сам гликан не меняет судьбу белка: значение метки определяют ферменты, которые её изменяют, и лектины, которые её узнают.</p><div class="note trap"><strong>Типичная ошибка</strong> N-гликан нужен белку прежде всего для растворимости и прикрепляется к любому остатку аспарагина.<p class="trap-fix">Гликан переносится только на Asn секвона Asn–X–Ser/Thr (X — не пролин), а в ЭПР он служит меткой сворачивания: отщепление и возвращение глюкозы и отщепление маннозы определяют связывание с лектинами-шаперонами и с лектинами ERAD.</p></div><div class="static-quiz"><h3>В белке, поступающем в ЭПР, последовательность Asn–Ala–Thr заменили на Asn–Pro–Thr. Будет ли OST переносить гликан на этот остаток Asn?</h3><ol><li><b>А.</b> Нет: в секвоне на месте X не может стоять пролин <i>(верный вариант)</i><br><span class="expl">Секвон имеет вид Asn–X–Ser/Thr, где X — любая аминокислота, кроме пролина. При Asn–Pro–Thr OST этот Asn не гликозилирует.</span></li><li><b>Б.</b> Да: для переноса достаточно Asn и Thr рядом <i>(неверный вариант)</i><br><span class="expl">Кроме Asn и Ser/Thr важен и средний остаток: пролин в положении X не допускает гликозилирования.</span></li><li><b>В.</b> Да, но только посттрансляционно, комплексом OST-B <i>(неверный вариант)</i><br><span class="expl">OST-B гликозилирует посттрансляционно доступные секвоны, пропущенные OST-A. Asn–Pro–Thr секвоном не является ни для OST-A, ни для OST-B.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-025-00855-y">Guay K.P., Chou W.-C., Canniff N.P., Paul K.B., Hebert D.N. N-glycan-dependent protein maturation and quality control in the ER. Nat Rev Mol Cell Biol. 2025;26:926–939</a></li><li><a href="https://doi.org/10.1016/j.cell.2008.11.047">Ruiz-Canada C., Kelleher D.J., Gilmore R. Cotranslational and posttranslational N-glycosylation of polypeptides by distinct mammalian OST isoforms. Cell. 2009;136:272–283</a></li><li><a href="https://doi.org/10.1016/0092-8674(95)90395-x">Hebert D.N., Foellmer B., Helenius A. Glucose trimming and reglucosylation determine glycoprotein association with calnexin in the endoplasmic reticulum. Cell. 1995;81:425–433</a></li><li><a href="https://doi.org/10.1038/s41467-022-35067-x">Ramírez A.S., de Capitani M., Pesciullesi G. et al. Molecular basis for glycan recognition and reaction priming of eukaryotic oligosaccharyltransferase. Nat Commun. 2022;13:7296</a></li></ul><p>Схема механизма; клетки млекопитающих. Сборка гликана, секвон и работа OST-A и OST-B описаны по обзору Guay 2025 (полный текст) и работе Ruiz-Canada 2009 (клетки млекопитающих; прочитана аннотация). Донор OST — олигосахарид на Dol-PP (Ramírez 2022, структура OST дрожжей; реферат). Символы гликана — номенклатура SNFG; на схеме показан один гликан из нескольких.</p></details></article><article class="card print-unit" id="ns-calnexin-cycle"><div class="eyebrow">N-гликаны и ERAD · шаг 14 из 26</div><h2>Как глюкоза возвращает несвёрнутый белок к калнексину</h2><p class="lead">Калнексин и кальретикулин узнают не форму белка, а гликан с одной глюкозой. Возвращать глюкозу или нет, определяет <a href="#ns-g-S11-T36">UGGT1</a> — фермент, который различает свёрнутый и несвёрнутый белок.</p><ol class="mech"><li><a href="#ns-g-S11-T34">Калнексин и кальретикулин</a> связывают гликан Glc₁Man₉GlcNAc₂; с ними работает оксидоредуктаза <a href="#ns-g-S11-T35">ERp57</a>.</li><li><a href="#ns-g-S11-T33">Глюкозидаза II</a> снимает последнюю глюкозу, и белок отходит от лектина.</li><li>UGGT1 возвращает одну глюкозу только несвёрнутому белку, и он снова входит в цикл калнексина; свёрнутый белок выходит из ЭПР.</li></ol><p>Калнексин — мембранный белок ЭПР, кальретикулин — его растворимый гомолог в просвете ЭПР. Оба связывают гликан с одной глюкозой. В экспериментах с микросомами и гемагглютинином вируса гриппа связывание с калнексином было специфичным именно для моноглюкозилированного гликана, а освобождение свёрнутого белка требовало снятия последней глюкозы глюкозидазой II (Hebert 1995).</p><p>Пока белок связан с лектином, он не агрегирует и находится рядом с ERp57, которая участвует в образовании и перестройке дисульфидных связей. После отщепления глюкозы белок свободен. Если он свернулся, гликан остаётся без глюкозы, и белок покидает ЭПР.</p><p>Если белок не свёрнут, его узнаёт UGGT1. Этот фермент присоединяет глюкозу к гликанам Man₇₋₉GlcNAc₂ только у белков с открытыми гидрофобными участками, а в экспериментах in vitro лучше всего модифицировал частично свёрнутые формы (Sousa 1995; Caramelo 2003). Так образуется цикл: глюкоза снимается и возвращается, пока белок не свернётся или пока его гликан не изменится иначе — за счёт отщепления маннозы (следующий шаг).</p><p>Ингибиторы глюкозидаз, например кастаноспермин, не дают образоваться гликану с одной глюкозой, и белок минует цикл калнексина. У человека есть и UGGT2; её роль изучена меньше.</p><div class="note trap"><strong>Типичная ошибка</strong> Калнексин, как и Hsp70, узнаёт гидрофобные участки несвёрнутого белка.<p class="trap-fix">Калнексин и кальретикулин — лектины: они узнают гликан с одной глюкозой. Свёрнутость белка «проверяет» UGGT1, которая возвращает глюкозу только несвёрнутому белку.</p></div><div class="static-quiz"><h3>Несвёрнутый гликопротеин отошёл от калнексина после того, как глюкозидаза II сняла последнюю глюкозу. Что произойдёт с его гликаном, если UGGT1 работает?</h3><ol><li><b>А.</b> UGGT1 вернёт три глюкозы, как у предшественника <i>(неверный вариант)</i><br><span class="expl">UGGT1 присоединяет к гликану одну глюкозу, а не восстанавливает исходные три. Гликан с одной глюкозой и узнают калнексин и кальретикулин.</span></li><li><b>Б.</b> UGGT1 вернёт одну глюкозу, и белок снова свяжется с калнексином <i>(верный вариант)</i><br><span class="expl">UGGT1 модифицирует только несвёрнутый белок. Одна глюкоза восстанавливает форму Glc₁Man₉GlcNAc₂, и белок снова входит в цикл калнексина.</span></li><li><b>В.</b> Гликан останется без глюкозы, и белок выйдет в аппарат Гольджи <i>(неверный вариант)</i><br><span class="expl">Так происходит со свёрнутым белком: UGGT1 его не узнаёт. Несвёрнутый белок с открытыми гидрофобными участками UGGT1 узнаёт.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/0092-8674(95)90395-x">Hebert D.N., Foellmer B., Helenius A. Glucose trimming and reglucosylation determine glycoprotein association with calnexin in the endoplasmic reticulum. Cell. 1995;81:425–433</a></li><li><a href="https://doi.org/10.1002/j.1460-2075.1995.tb00093.x">Sousa M., Parodi A.J. The molecular basis for the recognition of misfolded glycoproteins by the UDP-Glc:glycoprotein glucosyltransferase. EMBO J. 1995;14:4196–4203</a></li><li><a href="https://doi.org/10.1073/pnas.262661199">Caramelo J.J., Castro O.A., Alonso L.G., De Prat-Gay G., Parodi A.J. UDP-Glc:glycoprotein glucosyltransferase recognizes structured and solvent accessible hydrophobic patches in molten globule-like folding intermediates. Proc Natl Acad Sci USA. 2003;100:86–91</a></li><li><a href="https://doi.org/10.1038/s41580-025-00855-y">Guay K.P., Chou W.-C., Canniff N.P., Paul K.B., Hebert D.N. N-glycan-dependent protein maturation and quality control in the ER. Nat Rev Mol Cell Biol. 2025;26:926–939</a></li></ul><p>Схема механизма, качественные состояния. Специфичность калнексина к моноглюкозилированному гликану — Hebert 1995 (микросомы поджелудочной железы собаки, гемагглютинин; прочитана аннотация). Узнавание несвёрнутого белка UGGT — Sousa 1995 и Caramelo 2003 (очищенный фермент и модельные белки in vitro; прочитаны аннотации). UGGT1 и UGGT2 у человека — обзор Guay 2025.</p></details></article><article class="card print-unit" id="ns-mannose-timer"><div class="eyebrow">N-гликаны и ERAD · шаг 15 из 26</div><h2>Как отщепление маннозы направляет белок на деградацию</h2><p class="lead">Пока глюкоза возвращается и снимается, медленно идёт и другой процесс — отщепление маннозы. Белок, который долго не сворачивается, теряет маннозы, и его гликан становится сигналом для лектинов ERAD.</p><ol class="mech"><li><a href="#ns-g-S11-T37">EDEM2</a> в комплексе с TXNDC11 отщепляет маннозу ветви B: образуется Man₈B.</li><li>EDEM3 и EDEM1 отщепляют маннозу ветви C, и на гликане открывается α1,6-связанная манноза.</li><li>Такой гликан узнают лектины <a href="#ns-g-S11-T38">OS-9 и XTP3-B</a> и передают белок комплексу <a href="#ns-g-S11-T40">SEL1L–HRD1</a>; <a href="#ns-g-S11-T44">кифунензин</a> подавляет отщепление маннозы.</li></ol><p>Отщепление глюкозы и её возвращение идут быстро, а отщепление маннозы — медленно. Поэтому в ЭПР одновременно работают два «часовых механизма»: быстрый цикл глюкозы даёт белку новые попытки свернуться, а медленное отщепление маннозы ограничивает время, которое белок может провести в ЭПР.</p><p>По современной модели первую маннозу — на ветви B — отщепляет EDEM2, связанная дисульфидной связью с оксидоредуктазой TXNDC11 (Ninagawa 2014, клетки HCT116 и DT40; Guay 2025). Затем EDEM3 и EDEM1 удаляют маннозу ветви C и открывают α1,6-связанную маннозу. Активность EDEM1 и EDEM2 выше у несвёрнутых белков, поэтому отщепление маннозы касается прежде всего белков, которые долго не сворачиваются.</p><p>Гликан с открытой α1,6-маннозой узнаёт домен MRH лектина OS-9 (Hosokawa 2009, клетки человека, субстрат NHK). OS-9 и XTP3-B через SEL1L передают субстрат убиквитинлигазе HRD1 (Christianson 2008). У дрожжей такой сигнал создаёт маннозидаза Htm1, а распознаёт лектин Yos9 (Quan 2008).</p><p>Кифунензин подавляет α1,2-маннозидазы класса I. В клетках гепатомы он останавливал распад несвёрнутого α1-антитрипсина (Liu 1999). Это показывает, что для ERAD этого гликопротеина отщепление маннозы необходимо, хотя и не доказывает, какой именно фермент его выполняет.</p><div class="note trap"><strong>Типичная ошибка</strong> Белок отправляется на ERAD сразу, как только калнексин обнаружил, что он не свёрнут.<p class="trap-fix">Несвёрнутый белок сначала проходит цикл калнексина. Сигналом к ERAD становится медленное отщепление маннозы: Man₇ с открытой α1,6-маннозой узнаёт OS-9, и только тогда белок передаётся SEL1L–HRD1.</p></div><div class="static-quiz"><h3>Клетки, в которых синтезируется несвёрнутый NHK, обработали кифунензином. Как изменится скорость распада NHK?</h3><ol><li><b>А.</b> Возрастёт: несвёрнутый белок быстрее покинет цикл калнексина <i>(неверный вариант)</i><br><span class="expl">Выход из цикла калнексина на ERAD зависит от отщепления маннозы, а кифунензин его подавляет. Ускориться распад не может.</span></li><li><b>Б.</b> Не изменится: NHK узнаётся по гидрофобным участкам, а не по гликану <i>(неверный вариант)</i><br><span class="expl">Для ERAD гликопротеина NHK нужен гликан с отщеплёнными маннозами: без него распад тормозится (Liu 1999).</span></li><li><b>В.</b> Снизится: гликан Man₇ с открытой α1,6-маннозой почти не образуется <i>(верный вариант)</i><br><span class="expl">Кифунензин подавляет α1,2-маннозидазы. Без отщепления маннозы не возникает сигнал для OS-9, белок остаётся в цикле калнексина, и распад замедляется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-11.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.201404075">Ninagawa S., Okada T., Sumitomo Y. et al. EDEM2 initiates mammalian glycoprotein ERAD by catalyzing the first mannose trimming step. J Cell Biol. 2014;206:347–356</a></li><li><a href="https://doi.org/10.1038/s41580-025-00855-y">Guay K.P., Chou W.-C., Canniff N.P., Paul K.B., Hebert D.N. N-glycan-dependent protein maturation and quality control in the ER. Nat Rev Mol Cell Biol. 2025;26:926–939</a></li><li><a href="https://doi.org/10.1074/jbc.M809725200">Hosokawa N., Kamiya Y., Kamiya D., Kato K., Nagata K. Human OS-9, a lectin required for glycoprotein endoplasmic reticulum-associated degradation, recognizes mannose-trimmed N-glycans. J Biol Chem. 2009;284:17061–17068</a></li><li><a href="https://doi.org/10.1038/ncb1689">Christianson J.C., Shaler T.A., Tyler R.E., Kopito R.R. OS-9 and GRP94 deliver mutant α1-antitrypsin to the Hrd1–SEL1L ubiquitin ligase complex for ERAD. Nat Cell Biol. 2008;10:272–282</a></li><li><a href="https://doi.org/10.1016/j.molcel.2008.11.017">Quan E.M., Kamiya Y., Kamiya D. et al. Defining the glycan destruction signal for endoplasmic reticulum-associated degradation. Mol Cell. 2008;32:870–877</a></li><li><a href="https://doi.org/10.1074/jbc.274.9.5861">Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867</a></li></ul><p>Схема механизма; символы SNFG. Первый шаг EDEM2 — Ninagawa 2014 (нокауты в клетках HCT116 человека и DT40 курицы; прочитана аннотация); последовательность EDEM2 → EDEM3/EDEM1 и узнавание OS-9 и XTP3-B — обзор Guay 2025 (полный текст). Узнавание открытой α1,6-маннозы OS-9 — Hosokawa 2009, передача субстрата Hrd1–SEL1L — Christianson 2008 (клетки человека, субстрат NHK; аннотации). Кифунензин — Liu 1999 (клетки гепатомы; аннотация). Число отщепляемых маннозных остатков у разных субстратов различается; схема упрощена.</p></details></article><article class="card print-unit" id="ns-erad-machine"><div class="eyebrow">N-гликаны и ERAD · шаг 16 из 26</div><h2>Как дефектный белок покидает ЭПР и разрушается в цитозоле</h2><p class="lead">Протеасома находится в цитозоле, а дефектный гликопротеин — в просвете ЭПР. <a href="#ns-g-S11-T39">ERAD</a> переносит его через мембрану, убиквитинирует, извлекает из мембраны и передаёт протеасоме.</p><ol class="mech"><li>Лектины OS-9 и XTP3-B через SEL1L передают субстрат комплексу <a href="#ns-g-S11-T40">SEL1L–HRD1</a>, который служит каналом и убиквитинлигазой E3.</li><li>На цитоплазматической стороне HRD1 вместе с ферментами E2 строит на субстрате цепь убиквитина; ATPаза <a href="#ns-g-S11-T41">p97</a> с UFD1–NPL4 связывает цепь и извлекает белок из мембраны.</li><li><a href="#ns-g-S11-T42">NGLY1<
