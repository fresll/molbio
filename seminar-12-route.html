<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-12.html">← Вернуться к семинару</a> · <a href="index.html">← Раздел II: семинары</a></p><h1>Селективная аутофагия и контроль качества органелл</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-sar-adapter"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 1 из 26</div><h2>Что делает рецептор селективной аутофагии</h2><p class="lead"><a href="#ns-g-S12-T01">Селективная аутофагия</a> упаковывает в аутофагосому не любой участок цитоплазмы, а помеченный груз: белковые агрегаты, повреждённые органеллы, бактерии. Отбор выполняют <a href="#ns-g-S12-T02">рецепторы селективной аутофагии</a>: каждый из них связывает груз и белки <a href="#ns-g-S12-T03">ATG8</a> на мембране фагофора, а многие ещё и привлекают к грузу комплекс <a href="#ns-g-S12-T07">ULK1–FIP200</a>.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает груз с метками убиквитина, модули рецептора (UBD, LIR, FIR) и их партнёров: белки ATG8 на мембране и комплекс ULK1–FIP200. Четыре состояния: рецептор цел, нет UBD, нет LIR, нет участка связывания FIP200.</div><ol class="mech"><li>Груз несёт метку, чаще всего цепи убиквитина; растворимые рецепторы p62, NBR1, TAX1BP1, NDP52 и OPTN узнают её <a href="#ns-g-S12-T04">убиквитин-связывающим доменом</a>.</li><li>Тот же рецептор связывает белки ATG8 мотивом <a href="#ns-g-S12-T05">LIR</a>, и мембрана фагофора оказывается рядом с грузом.</li><li>Участком <a href="#ns-g-S12-T06">FIR или SKICH</a> рецептор связывает FIP200 и привлекает комплекс ULK1–FIP200, поэтому построение аутофагосомы начинается у груза.</li></ol><p>При голодании подавление киназы mTOR запускает неселективную аутофагию, которой рецепторы не нужны. Селективная аутофагия может идти и при активном mTOR: аутофагосому у груза строят рецепторы, которые связывают груз и привлекают белки аутофагии (Adriaenssens 2022).</p><p>Рецептором называют белок, который связывает груз и белки ATG8 на фагофоре. Рецептор, как правило, разрушается вместе с грузом: p62 прямо связывается с LC3 и GABARAP, а p62-положительные тельца разрушаются в аутолизосомах (Pankiv 2007).</p><p>Растворимые рецепторы p62, NBR1, TAX1BP1, NDP52 и OPTN узнают убиквитин на грузе. Мембранные рецепторы BNIP3, NIX и FUNDC1 встроены в наружную мембрану митохондрии и запускают путь без убиквитинирования её поверхности, а FAM134B встроен в мембрану эндоплазматического ретикулума (ЭПР) (Adriaenssens 2022).</p><p>Рецептор не только связывает груз и ATG8, но и привлекает к грузу комплекс ULK1–FIP200. Для NDP52 это показано при его принудительной посадке на митохондрию в клетках HeLa: без домена SKICH FIP200 не привлекался, и митофагия не наступала (Vargas 2019). Поэтому аутофагосома строится у груза, а не пристыковывается к готовой.</p><p>Граница вывода: сведения получены в культивируемых клетках человека, чаще в HeLa; набор рецепторов зависит от типа клеток, например NDP52 не экспрессируется в нейронах (Adriaenssens 2022).</p><div class="note trap"><strong>Типичная ошибка</strong> Рецептор лишь стыкует помеченный груз с готовой аутофагосомой.<p class="trap-fix">Рецепторы NDP52 и OPTN привлекали ULK1 к митохондриям независимо от связи с белками ATG8 (Lazarou 2015; Vargas 2019). Связь с ATG8 — лишь одна из функций рецептора.</p></div><div class="static-quiz"><h3>Рецептор находится на грузе; его убиквитин-связывающий домен и мотив LIR сохранены, а участок связывания FIP200 удалён. Какое звено цепи нарушается в первую очередь?</h3><ol><li><b>А.</b> Связь рецептора с убиквитином на грузе. <i>(неверный вариант)</i><br><span class="expl">Убиквитин рецептор связывает своим UBD, а он по условию сохранён. NDP52 без SKICH сохранял взаимодействие с белками LC3/GABARAP, но терял связь с FIP200 (Vargas 2019).</span></li><li><b>Б.</b> Привлечение комплекса ULK1–FIP200 к грузу. <i>(верный вариант)</i><br><span class="expl">Участок связывания FIP200 передаёт сигнал от рецептора к комплексу инициации. NDP52 без SKICH не привлекал FIP200 к митохондрии и не запускал митофагию (Vargas 2019).</span></li><li><b>В.</b> Связь рецептора с белками ATG8. <i>(неверный вариант)</i><br><span class="expl">За эту связь отвечает мотив LIR, а он сохранён. В модели без FIR нарушена не она, а привлечение инициирующего комплекса.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li><li><a href="https://doi.org/10.1074/jbc.M702824200">Pankiv S., Clausen T.H., Lamark T. et al. p62/SQSTM1 binds directly to Atg8/LC3 to facilitate degradation of ubiquitinated protein aggregates by autophagy. J Biol Chem. 2007;282:24131–24145</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.02.010">Vargas J.N.S., Wang C., Bunker E. et al. Spatiotemporal control of ULK1 activation by NDP52 and TBK1 during selective autophagy. Mol Cell. 2019;74:347–362</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1038/s41467-019-08335-6">Padman B.S., Nguyen T.N., Uoselis L. et al. LC3/GABARAPs drive ubiquitin-independent recruitment of Optineurin and NDP52 to amplify mitophagy. Nat Commun. 2019;10:408</a></li></ul><p>Определения даны по обзору Adriaenssens 2022. Привлечение FIP200 доменом SKICH показано в клетках HeLa при принудительной посадке NDP52 на митохондрию (метод описан в последнем шаге раздела; Vargas 2019); для p62 данные получены в клетках HeLa (Pankiv 2007); мутанты UBD и LIR изучали в клетках HeLa с Parkin (Lazarou 2015; Padman 2019). Схема качественная: показаны модули рецептора и звенья цепи, без трёхмерного строения.</p></details></article><article class="card print-unit" id="ns-sar-domains"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 2 из 26</div><h2>Из каких частей собран рецептор</h2><p class="lead">Рецептор селективной аутофагии — многодоменный белок: одни модули связывают груз, другие — белки ATG8, третьи — белки инициации. У каждого рецептора набор модулей свой, поэтому рецепторы выполняют разные функции.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает модули рецептора (PB1, UBD, LIR, FIR или SKICH) и их партнёров: другую копию рецептора, убиквитин на грузе, белки ATG8 и комплекс ULK1–FIP200. Можно выбрать p62, NDP52 или OPTN.</div><ol class="mech"><li>Рецептор состоит из независимых модулей: <a href="#ns-g-S12-T04">UBD</a> связывает убиквитин на грузе, <a href="#ns-g-S12-T05">LIR</a> — белки ATG8.</li><li>Участок <a href="#ns-g-S12-T06">FIR или SKICH</a> связывает FIP200 комплекса <a href="#ns-g-S12-T07">ULK1–FIP200</a>; у p62 он перекрывается с LIR.</li><li>Киназа <a href="#ns-g-S12-T10">TBK1</a> фосфорилирует модули рецепторов и усиливает их связывание.</li></ol><p>Убиквитин-связывающие домены у рецепторов разные: UBA у p62 и NBR1, UBZ у TAX1BP1, UBAN у OPTN, цинковые пальцы у NDP52. Домен PB1 есть у p62 и NBR1: у p62 он собирает олигомеры, а PB1 NBR1 сам полимеризоваться не может (Adriaenssens 2022).</p><p>LIR — короткая последовательность длиной 15–20 аминокислот; она связывается с LIR-связывающим участком (LDS) белков ATG8 на мембране фагофора. Известны и нетипичные взаимодействия с этим участком, а также взаимодействие, не зависящее от LIR (Johansen &amp; Lamark 2020).</p><p>Связывание FIP200 устроено по-разному. NDP52 связывает FIP200 доменом SKICH (Vargas 2019). У p62 FIP200 узнаёт участок из остатков 326–380, перекрывающийся с LIR, поэтому ATG8 и FIP200 конкурируют за p62 (Turco 2019). У OPTN способ связывания FIP200 не определён, известно лишь, что оно зависит от активности киназы TBK1 (Adriaenssens 2022).</p><p>Киназа TBK1 фосфорилирует OPTN, NDP52, TAX1BP1 и p62, в том числе убиквитин- и LC3-связывающие домены OPTN и p62 и домены SKICH у NDP52 и TAX1BP1. Фосфорилирование UBAN у OPTN по Ser473 расширяет набор цепей убиквитина, которые он связывает (Richter 2016).</p><p>Граница вывода: номера остатков даны для белков человека; схема не передаёт трёхмерного строения, а порядок модулей упрощён.</p><div class="note trap"><strong>Типичная ошибка</strong> У всех рецепторов один и тот же набор модулей, поэтому любой из них может выполнять функции другого.<p class="trap-fix">Наборы модулей различаются: PB1 есть у p62 и NBR1, у p62 участок связывания FIP200 перекрывается с LIR, а у OPTN способ связывания FIP200 не определён (Adriaenssens 2022; Turco 2019).</p></div><div class="static-quiz"><h3>Киназа TBK1 фосфорилирует UBAN-домен OPTN по Ser473. Как изменится способность OPTN связывать цепи убиквитина?</h3><ol><li><b>А.</b> Сузится: OPTN будет связывать меньше типов цепей. <i>(неверный вариант)</i><br><span class="expl">Наоборот: фосфорилирование расширяет набор цепей, которые связывает UBAN (Richter 2016).</span></li><li><b>Б.</b> Не изменится: фосфорилирование влияет на связь с ATG8, а не с убиквитином. <i>(неверный вариант)</i><br><span class="expl">Фосфорилирование влияет и на связывание убиквитина: по Ser473 оно расширяет набор цепей, которые узнаёт UBAN (Richter 2016).</span></li><li><b>В.</b> Расширится: OPTN свяжет более разнообразные цепи убиквитина. <i>(верный вариант)</i><br><span class="expl">TBK1-зависимое фосфорилирование UBAN по Ser473 расширяет связывающую способность OPTN; это часть положительной обратной связи при митофагии (Richter 2016).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li><li><a href="https://doi.org/10.1016/j.jmb.2019.07.016">Johansen T., Lamark T. Selective autophagy: ATG8 family proteins, LIR motifs and cargo receptors. J Mol Biol. 2020;432:80–103</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.01.035">Turco E., Witt M., Abert C. et al. FIP200 claw domain binding to p62 promotes autophagosome formation at ubiquitin condensates. Mol Cell. 2019;74:330–346</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.02.010">Vargas J.N.S., Wang C., Bunker E. et al. Spatiotemporal control of ULK1 activation by NDP52 and TBK1 during selective autophagy. Mol Cell. 2019;74:347–362</a></li><li><a href="https://doi.org/10.1073/pnas.1523926113">Richter B., Sliter D.A., Herhaus L. et al. Phosphorylation of OPTN by TBK1 enhances its binding to Ub chains and promotes selective autophagy of damaged mitochondria. Proc Natl Acad Sci USA. 2016;113:4039–4044</a></li></ul><p>Состав модулей — по обзору Adriaenssens 2022 и работам Vargas 2019, Turco 2019, Richter 2016 (клетки человека, in vitro). Нумерация остатков — для белков человека. Схема показывает только p62, NDP52 и OPTN; NBR1 и TAX1BP1 рассмотрены в других шагах.</p></details></article><article class="card print-unit" id="ns-sar-avidity"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 3 из 26</div><h2>Почему слабые связи дают избирательность</h2><p class="lead">Одиночный модуль рецептора связывает убиквитин или белок ATG8 слабо и обратимо. Избирательность возникает из сочетания многих таких контактов: <a href="#ns-g-S12-T08">авидность</a> частицы растёт, а сродство каждого контакта остаётся прежним.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает груз с метками убиквитина, рецептор p62 и белки ATG8 на мембране фагофора. Можно сравнить олигомер p62 и p62 без домена PB1 при одной молекуле убиквитина и при нескольких длинных цепях.</div><ol class="mech"><li>Один <a href="#ns-g-S12-T04">UBD</a> слабо и обратимо связывает одну молекулу убиквитина, а один <a href="#ns-g-S12-T05">LIR</a> — один белок <a href="#ns-g-S12-T03">ATG8</a>.</li><li>Домен PB1 собирает p62 в олигомеры, и на одной частице оказывается много модулей UBA и LIR.</li><li>Олигомер удерживается там, где метки и ATG8 расположены плотно: на грузе с несколькими цепями и на мембране <a href="#ns-g-S12-T13">фагофора</a>.</li></ol><p>Сродство одиночного UBA p62 к убиквитину очень низкое (Wurzer 2015). Такая слабость полезна: p62 связывается преимущественно с грузом, на котором метки сгруппированы, и не вмешивается в другие процессы с участием убиквитина (Adriaenssens 2022).</p><p>Домен PB1 собирает p62 в олигомеры: рекомбинантный p62 дикого типа состоял в среднем из 24 молекул, а вариант без PB1 — из трёх. Олигомеризация не повышала сродства отдельного LIR к LC3B, но снижала скорость отсоединения частицы от поверхности, плотно покрытой LC3B или убиквитином (Wurzer 2015).</p><p>После разведения раствора p62 дикого типа оставался на частицах с LC3B до 1,5 ч, а p62 без PB1 отсоединялся сразу. При снижении плотности LC3B на поверхности обмен p62 дикого типа ускорялся, а у p62 без PB1 не менялся (Wurzer 2015).</p><p>Имеет значение и устройство метки. В системе из очищенных белков p62 и убиквитинированные субстраты собирались в скопления, если у субстрата было не менее двух цепей длиной больше трёх убиквитинов (Zaffagnini 2018). Цепь K63 индуцировала фазовое разделение p62 с образованием <a href="#ns-g-S12-T09">жидкоподобных капель</a> в пробирке (Sun 2018).</p><p>Граница вывода: предпочтение цепей K63 или K48 в основном показано при сверхэкспрессии и in vitro (Adriaenssens 2022).</p><div class="note trap"><strong>Типичная ошибка</strong> Чем прочнее один контакт рецептора с меткой, тем точнее выбор груза.<p class="trap-fix">Избирательность определяется числом одновременных слабых контактов: олигомер p62 с множеством UBA и LIR удерживается на плотной поверхности с метками и ATG8, но не на одиночной молекуле убиквитина (Wurzer 2015; Adriaenssens 2022).</p></div><div class="static-quiz"><h3>Очищенный p62 дикого типа и p62 без домена PB1 удерживаются на гранулах, плотно покрытых LC3B. Плотность LC3B на гранулах снизили в 10 раз. Как изменится скорость обмена p62 между гранулами и раствором?</h3><ol><li><b>А.</b> У p62 дикого типа вырастет, у p62 без PB1 почти не изменится. <i>(верный вариант)</i><br><span class="expl">Олигомер удерживается множеством одновременных контактов, поэтому при снижении плотности LC3B число контактов падает, и обмен ускоряется. Вариант без PB1 держится на одиночных контактах и от плотности почти не зависит (Wurzer 2015).</span></li><li><b>Б.</b> У обоих вариантов вырастет примерно в одинаковой степени. <i>(неверный вариант)</i><br><span class="expl">У p62 без PB1 скорость обмена не менялась даже при снижении плотности LC3B в 10 раз: одновременных контактов у него и так немного (Wurzer 2015).</span></li><li><b>В.</b> У p62 дикого типа не изменится, у p62 без PB1 вырастет. <i>(неверный вариант)</i><br><span class="expl">Зависимость обратная: именно у p62 дикого типа обмен ускорялся при снижении плотности LC3B, потому что уменьшалось число одновременных контактов олигомера (Wurzer 2015).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.7554/eLife.08941">Wurzer B., Zaffagnini G., Fracchiolla D. et al. Oligomerization of p62 allows for selection of ubiquitinated cargo and isolation membrane during selective autophagy. eLife. 2015;4:e08941</a></li><li><a href="https://doi.org/10.15252/embj.201798308">Zaffagnini G., Savova A., Danieli A. et al. p62 filaments capture and present ubiquitinated cargos for autophagy. EMBO J. 2018;37:e98308</a></li><li><a href="https://doi.org/10.1038/s41422-018-0017-7">Sun D., Wu R., Zheng J., Li P., Yu L. Polyubiquitin chain-induced p62 phase separation drives autophagic cargo segregation. Cell Res. 2018;28:405–415</a></li><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li></ul><p>Данные Wurzer 2015 получены в пробирке на рекомбинантных белках и поверхностях, покрытых LC3B или убиквитином, а также в клетках HeLa; Zaffagnini 2018 — в системе из очищенных белков; Sun 2018 — в пробирке и в клетках. Количества контактов на схеме условные, числа молекул в частице взяты из Wurzer 2015.</p></details></article><article class="card print-unit" id="ns-sar-initiation"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 4 из 26</div><h2>Рецептор как организатор аутофагосомы</h2><p class="lead">Рецептор не только связывает груз и белки ATG8, но и привлекает к грузу <a href="#ns-g-S12-T07">комплекс ULK1–FIP200</a>. Так построение аутофагосомы начинается у груза, а белки ATG8 усиливают процесс и нужны для слияния с лизосомой.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает цепь событий: рецептор на грузе, комплекс ULK1–FIP200, построение фагофора, белки ATG8 на мембране и слияние с лизосомой. Можно сравнить три состояния: все модули на месте, нет участка связывания FIP200, нет всех шести белков ATG8.</div><ol class="mech"><li>Рецептор на грузе связывает FIP200 участком <a href="#ns-g-S12-T06">FIR или SKICH</a> и привлекает комплекс ULK1–FIP200 к грузу.</li><li>У груза строится <a href="#ns-g-S12-T13">фагофор</a>; белки <a href="#ns-g-S12-T03">ATG8</a> появляются на его мембране.</li><li>Через LIR белки ATG8 привлекают ещё рецепторы, а после замыкания аутофагосомы нужны для слияния с лизосомой.</li></ol><p>При голодании построение аутофагосомы запускает подавление mTOR. При селективной аутофагии аутофагосому у груза запускает рецептор, и mTOR при этом может оставаться активным (Adriaenssens 2022).</p><p>В клетках HeLa без пяти рецепторов NDP52 и OPTN привлекали ULK1 к митохондриям; при посадке PINK1 на митохондрию замена F178A в LIR OPTN привлечению ULK1 не мешала, поэтому оно идёт выше по цепи, чем связь с LC3 (Lazarou 2015). NDP52 связывает FIP200 доменом SKICH, и TBK1 облегчает эту связь. При принудительной посадке на митохондрию NDP52 без SKICH не привлекал FIP200, и митофагия не наступала; ULK1 активировался на грузе независимо от AMPK и mTOR (Vargas 2019).</p><p>Без всех шести белков ATG8 аутофагосомы вокруг митохондрий образуются, но не сливаются с лизосомами (Nguyen 2016). Белки ATG8 привлекают к растущей мембране ещё OPTN и NDP52 через LIR и усиливают митофагию; мутации LIR снижали эффективность митофагии (Padman 2019).</p><p>Граница вывода: данные получены в клетках HeLa, в нокаутных линиях и при принудительной посадке рецептора; в разных системах вклад LIR оценивают по-разному (Padman 2019; Vargas 2019).</p><div class="note trap"><strong>Типичная ошибка</strong> Без белков ATG8 аутофагосома не образуется, а отбор груза обеспечивает только связь LIR с ATG8.<p class="trap-fix">В клетках HeLa без всех шести белков ATG8 аутофагосомы образуются, но не сливаются с лизосомами (Nguyen 2016). Привлечение ULK1 рецепторами идёт выше по цепи, чем белки ATG8 (Lazarou 2015; Vargas 2019); ATG8 усиливают привлечение рецепторов (Padman 2019).</p></div><div class="static-quiz"><h3>В клетках HeLa с Parkin нет всех шести белков ATG8. В них запускают митофагию деполяризацией митохондрий. Что произойдёт с аутофагосомами вокруг повреждённых митохондрий?</h3><ol><li><b>А.</b> Не образуются: без ATG8 комплекс ULK1–FIP200 не привлекается к грузу. <i>(неверный вариант)</i><br><span class="expl">Привлечение ULK1 рецепторами идёт выше по цепи, чем белки ATG8, и не зависит от связи с LC3 (Lazarou 2015; Vargas 2019).</span></li><li><b>Б.</b> Образуются вокруг митохондрий, но не сливаются с лизосомами. <i>(верный вариант)</i><br><span class="expl">В клетках без всех шести белков ATG8 аутофагосомы вокруг митохондрий образуются, но слияние с лизосомой нарушено (Nguyen 2016). Они мельче, а начальная скорость образования ниже.</span></li><li><b>В.</b> Образуются и сливаются с лизосомами с прежней скоростью. <i>(неверный вариант)</i><br><span class="expl">Белки ATG8 нужны для слияния с лизосомой, и без них оно нарушено (Nguyen 2016); привлечение рецепторов к растущей мембране тоже ослаблено (Padman 2019).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.02.010">Vargas J.N.S., Wang C., Bunker E. et al. Spatiotemporal control of ULK1 activation by NDP52 and TBK1 during selective autophagy. Mol Cell. 2019;74:347–362</a></li><li><a href="https://doi.org/10.1038/s41467-019-08335-6">Padman B.S., Nguyen T.N., Uoselis L. et al. LC3/GABARAPs drive ubiquitin-independent recruitment of Optineurin and NDP52 to amplify mitophagy. Nat Commun. 2019;10:408</a></li><li><a href="https://doi.org/10.1083/jcb.201607039">Nguyen T.N., Padman B.S., Usher J., Oorschot V., Ramm G., Lazarou M. Atg8 family LC3/GABARAP proteins are crucial for autophagosome–lysosome fusion but not autophagosome formation during PINK1/Parkin mitophagy and starvation. J Cell Biol. 2016;215:857–874</a></li></ul><p>Клетки HeLa: нокаут пяти рецепторов и митофагия при повреждении митохондрий в клетках с Parkin; мутация F178A в LIR OPTN (Lazarou 2015; Padman 2019), принудительная посадка PINK1 или NDP52 на митохондрию (метод описан в последнем шаге раздела; Lazarou 2015; Vargas 2019), линии без белков ATG8 (Nguyen 2016). Сроки: часы после воздействия. Схема качественная.</p></details></article><article class="card print-unit" id="ns-sar-network"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 5 из 26</div><h2>Какие рецепторы работают на каком грузе</h2><p class="lead">Один и тот же рецептор работает на разных грузах, а один груз обслуживает несколько рецепторов. Какой рецептор ведущий, зависит от груза, метки и типа клеток.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает груз и рецепторы: пять растворимых и два вида мембранных. Для пяти грузов отмечено, какие рецепторы ведущие.</div><ol class="mech"><li>Растворимые <a href="#ns-g-S12-T02">рецепторы</a> p62, NBR1, TAX1BP1, NDP52 и OPTN узнают убиквитин на грузе, но на разных грузах ведущие разные.</li><li><a href="#ns-g-S12-T11">Мембранные рецепторы</a> BNIP3, NIX, FUNDC1 на митохондриях и FAM134B в ЭПР встроены в мембрану органеллы и не требуют убиквитинирования её поверхности.</li><li>Метка может быть и не убиквитином: <a href="#ns-g-S12-T12">N-концевой аргинин</a> белка BiP связывается с ZZ-доменом p62.</li></ol><p>Основными рецепторами для агрегатов названы p62, NBR1 и TAX1BP1, для митохондрий в системе PINK1–Parkin — OPTN и NDP52 (Adriaenssens 2022). У мышей с нарушенной аутофагией p62 нужен для появления убиквитин-положительных включений в гепатоцитах и нейронах (Komatsu 2007).</p><p>В клетках HeLa с Parkin и без пяти растворимых рецепторов митофагия останавливалась; восстанавливали её OPTN и NDP52, TAX1BP1 слабее. p62 и NBR1 приходили к митохондриям, но митофагию не восстанавливали, а нокаут одного NDP52 или одного OPTN дефекта не вызывал (Lazarou 2015).</p><p>Мембранные рецепторы BNIP3, NIX и FUNDC1 описаны при гипоксии, а BNIP3 и NIX — и при созревании эритроцитов; при потере железа вклад отдельных рецепторов не установлен. BNIP3 и NIX включаются димеризацией, FUNDC1 — дефосфорилированием (Adriaenssens 2022). FAM134B — рецептор ЭПР: при его подавлении ЭПР расширяется, при избытке фрагментируется и разрушается в лизосоме (Khaminets 2015).</p><p>BiP с N-концевым аргинином связывался с ZZ-доменом p62, вызывал олигомеризацию p62, усиливал его связь с LC3 и разрушался вместе с p62 (Cha-Molstad 2015).</p><p>Граница вывода: набор рецепторов зависит от типа клеток; NDP52 не экспрессируется в нейронах, и там OPTN особенно важен (Adriaenssens 2022).</p><div class="note trap"><strong>Типичная ошибка</strong> Любой рецептор, пришедший к грузу, может заменить другой.<p class="trap-fix">Приход рецептора к грузу не означает, что он ведёт аутофагию: p62 и NBR1 приходили к повреждённым митохондриям, но митофагию не восстанавливали (Lazarou 2015). Взаимозаменяемость зависит от груза и типа клеток (Adriaenssens 2022).</p></div><div class="static-quiz"><h3>В клетках HeLa с Parkin нет пяти растворимых рецепторов, и митофагия при повреждении митохондрий остановлена. В клетки по одному возвращают рецептор. Возвращение какого из перечисленных рецепторов восстановит митофагию?</h3><ol><li><b>А.</b> p62: связывает убиквитин на повреждённых митохондриях. <i>(неверный вариант)</i><br><span class="expl">p62 приходил к митохондриям, но митофагию не восстанавливал (Lazarou 2015): приход к грузу ещё не означает запуск аутофагосомы.</span></li><li><b>Б.</b> NBR1: связывает убиквитин и p62 на повреждённых митохондриях. <i>(неверный вариант)</i><br><span class="expl">NBR1, как и p62, приходил к митохондриям, но митофагию не восстанавливал (Lazarou 2015).</span></li><li><b>В.</b> OPTN: связывает убиквитин на повреждённых митохондриях. <i>(верный вариант)</i><br><span class="expl">OPTN и NDP52 восстанавливали митофагию, TAX1BP1 — слабее; мутанты OPTN без убиквитин-связывающего домена митофагию не восстанавливали (Lazarou 2015). OPTN, кроме того, привлекает ULK1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.10.035">Komatsu M., Waguri S., Koike M. et al. Homeostatic levels of p62 control cytoplasmic inclusion body formation in autophagy-deficient mice. Cell. 2007;131:1149–1163</a></li><li><a href="https://doi.org/10.1038/nature14498">Khaminets A., Heinrich T., Mari M. et al. Regulation of endoplasmic reticulum turnover by selective autophagy. Nature. 2015;522:354–358</a></li><li><a href="https://doi.org/10.1038/ncb3177">Cha-Molstad H., Sung K.S., Hwang J. et al. Amino-terminal arginylation targets endoplasmic reticulum chaperone BiP for autophagy through p62 binding. Nat Cell Biol. 2015;17:917–929</a></li></ul><p>Перечень основных рецепторов — по обзору Adriaenssens 2022. Данные для митофагии получены в клетках HeLa с Parkin после повреждения митохондрий (Lazarou 2015); для FAM134B — в клетках человека и у мышей (Khaminets 2015); для BiP — в клетках человека (Cha-Molstad 2015); для p62 — у мышей с нарушенной аутофагией (Komatsu 2007). Оценки «ведущий» и «слабее» качественные.</p></details></article><article class="card print-unit" id="ns-sar-measure"><div class="eyebrow">Рецепторы селективной аутофагии · шаг 6 из 26</div><h2>Как показать, что рецептор связывает груз и ATG8</h2><p class="lead">Связывание рецептора с грузом и с белком ATG8 проверяют на уровне белков, клеток и очищенных компонентов. Каждый метод отвечает на свой вопрос и имеет свою границу вывода.</p><div class="note"><strong>Что показывает схема.</strong> Схема описывает пять методов: иммунопреципитацию, колокализацию, реконструкцию из очищенных компонентов, возврат рецептора в клетки без рецепторов и принудительную посадку на органеллу. Для каждого метода указаны: что измеряют, как, контроль и граница вывода.</div><ol class="mech"><li><a href="#ns-g-S12-T14">Совместная иммунопреципитация и pull-down</a> показывают связывание белков в лизате или в пробирке, колокализация — положение в клетке.</li><li>Возврат рецептора или его мутанта в клетки без рецепторов проверяет функцию; реконструкция из очищенных компонентов и принудительная посадка на органеллу проверяют достаточность.</li><li>Контроли — мутация LIR, мутация UBD и клетки без рецептора; связывание не равно работе рецептора на грузе.</li></ol><p>Связывание проверяют так: белок-наживку на гранулах инкубируют с лизатом клеток или с очищенным рецептором, промывают гранулы и выявляют связанный белок иммуноблотом. Эндогенный p62 в клетках подавляют, чтобы анализировать только вариант с мутацией, а специфичность проверяют мутацией LIR или UBD и гранулами с одним GST или GFP (Wurzer 2015).</p><p>Промывка сохраняет лишь контакты, которые не успевают распасться, поэтому слабые обратимые взаимодействия этим методом выявляются плохо (Wurzer 2015). <a href="#ns-g-S12-T15">Колокализация</a> показывает общее положение сигналов, но не контакт: к митохондриям приходили все пять рецепторов, а митофагию восстанавливали не все (Lazarou 2015).</p><p>Функцию проверяют в клетках без рецепторов: возвращают целый рецептор или его мутанты и измеряют митофагию (Lazarou 2015). Достаточность проверяют принудительной посадкой рецептора на органеллу (Vargas 2019) и в реконструированной системе из очищенных белков (Zaffagnini 2018).</p><p>Граница вывода: различия между цепями K63 и K48 во многом получены при сверхэкспрессии и in vitro (Adriaenssens 2022); связывание в пробирке не показывает работу рецептора в клетке без проверки функции.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белки связываются при совместной иммунопреципитации, значит, рецептор ведёт аутофагию этого груза.<p class="trap-fix">Связывание показывает физическое взаимодействие, но не функцию: p62 и NBR1 приходили к повреждённым митохондриям, но митофагию не восстанавливали (Lazarou 2015). Функцию проверяют возвратом рецептора и его мутантов в клетки без рецепторов.</p></div><div class="static-quiz"><h3>В клетках HeLa p62 без домена PB1 после иммунопреципитации GFP-LC3B дал на блоте едва заметную полосу, хотя его LIR цел. Какое объяснение согласуется с этим результатом?</h3><ol><li><b>А.</b> Одиночный LIR связывает LC3B слабо и обратимо, поэтому связь частично теряется при промывке гранул. <i>(верный вариант)</i><br><span class="expl">Олигомеризация не меняет сродство отдельного LIR, но снижает скорость отсоединения. По интерпретации авторов, у варианта без PB1 слабые контакты частично теряются при промывке, и взаимодействие видно лишь при долгой экспозиции блота (Wurzer 2015).</span></li><li><b>Б.</b> LIR цел, поэтому связь с LC3B так же прочна, как у белка дикого типа, а слабая полоса случайна. <i>(неверный вариант)</i><br><span class="expl">Цельный LIR не делает связь такой же: у p62 дикого типа взаимодействие с LC3B сильнее, чем у варианта без PB1 (Wurzer 2015).</span></li><li><b>В.</b> Связи p62 без PB1 с LC3B нет совсем, так как для связи с LC3B необходим домен PB1, а не LIR. <i>(неверный вариант)</i><br><span class="expl">Связь есть: полоса p62 без PB1 становилась заметной при долгой экспозиции блота (Wurzer 2015). Слабая полоса не означает полного отсутствия связи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-12.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.7554/eLife.08941">Wurzer B., Zaffagnini G., Fracchiolla D. et al. Oligomerization of p62 allows for selection of ubiquitinated cargo and isolation membrane during selective autophagy. eLife. 2015;4:e08941</a></li><li><a href="https://doi.org/10.15252/embj.201798308">Zaffagnini G., Savova A., Danieli A. et al. p62 filaments capture and present ubiquitinated cargos for autophagy. EMBO J. 2018;37:e98308</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.02.010">Vargas J.N.S., Wang C., Bunker E. et al. Spatiotemporal control of ULK1 activation by NDP52 and TBK1 during selective autophagy. Mol Cell. 2019;74:347–362</a></li><li><a href="https://doi.org/10.1016/j.cub.2022.11.002">Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371</a></li></ul><p>Описаны методы иммунопреципитации, колокализации, реконструкции, возврата в нокаутные клетки и принудительной посадки (клетки HeLa, очищенные белки, гигантские везикулы). Пиктограммы условные: это не данные экспериментов.</p></details></article><article class="card print-unit" id="ns-pink1-import"><div class="eyebrow">PINK1 и Parkin · шаг 7 из 26</div><h2>Как PINK1 служит датчиком импорта в митохондрию</h2><p class="lead"><a href="#ns-g-S12-T16">PINK1</a> постоянно синтезируется в цитозоле и импортируется в митохондрию. Пока импорт идёт, белок разрезается и быстро разрушается, поэтому в здоровой митохондрии PINK1 почти нет.</p><ol class="mech"><li>Предшественник PINK1 проходит через <a href="#ns-g-S12-T18">TOM и TIM23</a>; движущей силой служит <a href="#ns-g-S12-T17">потенциал</a> на внутренней мембране.</li><li>Протеаза <a href="#ns-g-S12-T19">PARL</a> разрезает PINK1 во внутренней мембране перед F104, и фрагмент выходит в цитозоль.</li><li><a href="#ns-g-S12-T20">N-дегрон</a> нового N-конца узнают UBR1, UBR2 и UBR4, после чего протеасома разрушает фрагмент.</li></ol><p>PINK1 синтезируется в цитозоле постоянно. На его N-конце находится митохондриальная сигнальная последовательность, поэтому предшественник направляется к транслоказе внешней мембраны TOM, а затем к транслоказе внутренней мембраны TIM17/TIM23. Положительно заряженный N-конец втягивается в митохондрию потенциалом на внутренней мембране: основной движущей силой служит отрицательный заряд со стороны матрикса.</p><p>Пока потенциал сохранён, импорт доходит до внутренней мембраны. Протеаза матрикса MPP снимает сигнальную последовательность, а ромбоидная протеаза PARL разрезает PINK1 в трансмембранном сегменте непосредственно перед F104. Образовавшийся фрагмент выходит в цитозоль. Его новый N-концевой остаток фенилаланина служит N-дегроном: фрагмент узнают убиквитинлигазы UBR1, UBR2 и UBR4, и его разрушает протеасома (Yamano &amp; Youle 2013).</p><p>Поэтому PINK1 в здоровой митохондрии очень мало. Период её полужизни составляет около 27 мин, а в клетке HEK293 оценено около 490 молекул, то есть около трёх на 10 000 комплексов TOM (Narendra &amp; Youle 2024). Если PARL отсутствует, PINK1 не разрезается, не разрушается и остаётся внутри митохондрии в форме около 60 кДа (Jin 2010).</p><p>Схема качественная. Числа получены на культивируемых клетках человека; для других клеток и тканей они могут отличаться. Импорт PINK1 зависит от потенциала сильнее, чем от самого TIM23 (Sekine 2019), поэтому «потенциал» и «работа TIM23» не равнозначны.</p><div class="note trap"><strong>Типичная ошибка</strong> PINK1 появляется на митохондрии только при повреждении: повреждение запускает её синтез.<p class="trap-fix">PINK1 синтезируется постоянно. Повреждение, снижающее потенциал, не запускает синтез, а останавливает импорт и разрез PARL, поэтому PINK1 накапливается.</p></div><div class="static-quiz"><h3>Потенциал на внутренней мембране сохранён, и PINK1 на митохондриях почти не обнаруживается. Из клеток убрали протеазу PARL. Что произойдёт с PINK1?</h3><ol><li><b>А.</b> PINK1 накопится на внешней мембране, как после потери потенциала. <i>(неверный вариант)</i><br><span class="expl">Накопление на внешней мембране связано с остановкой импорта. Здесь импорт идёт, поэтому PINK1 проходит к внутренней мембране и остаётся внутри.</span></li><li><b>Б.</b> PINK1 не будет разрезаться и разрушаться и останется внутри митохондрии. <i>(верный вариант)</i><br><span class="expl">Без PARL нет разреза перед F104, нет фрагмента с N-дегроном, и PINK1 стабилизируется внутри митохондрии в форме около 60 кДа (Jin 2010).</span></li><li><b>В.</b> PINK1 исчезнет совсем: без PARL протеасома разрушает её быстрее. <i>(неверный вариант)</i><br><span class="expl">Протеасома разрушает фрагмент, который образовал PARL. Без разреза нет N-дегрона, и разрушение, наоборот, подавлено.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.4161/auto.24633">Yamano K., Youle R.J. PINK1 is degraded through the N-end rule pathway. Autophagy. 2013;9:1758–1769</a></li><li><a href="https://doi.org/10.1083/jcb.201008084">Jin S.M., Lazarou M., Wang C., Kane L.A., Narendra D.P., Youle R.J. Mitochondrial membrane potential regulates PINK1 import and proteolytic destabilization by PARL. J Cell Biol. 2010;191:933–942</a></li><li><a href="https://doi.org/10.1016/j.molcel.2019.01.002">Sekine S., Wang C., Sideris D.P., Bunker E., Zhang Z., Youle R.J. Reciprocal roles of Tom7 and OMA1 during mitochondrial import and activation of PINK1. Mol Cell. 2019;73:1028–1043</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема механизма, качественные состояния; размеры и расстояния не в масштабе. Клетки человека (HeLa, HEK293) и мыши. Yamano &amp; Youle 2013, Jin 2010 и Sekine 2019 — прочитаны рефераты; период полужизни 27 мин и оценка 490 молекул (клетки HEK293) взяты из обзора Narendra &amp; Youle 2024 (полный текст); порядок MPP, затем PARL и положение разреза перед F104 — по тому же обзору. Нумерация остатков дана для PINK1 человека.</p></details></article><article class="card print-unit" id="ns-pink1-stall"><div class="eyebrow">PINK1 и Parkin · шаг 8 из 26</div><h2>Что происходит с PINK1, когда импорт нарушен</h2><p class="lead">Если на внутренней мембране нет потенциала, PINK1 не доходит до PARL и остаётся на внешней мембране. Там она образует димеры, автофосфорилируется и становится киназой убиквитина.</p><ol class="mech"><li>При утрате <a href="#ns-g-S12-T17">потенциала</a> N-конец PINK1 остаётся продетым через <a href="#ns-g-S12-T18">TOM</a> и удержанным у TIM17/TIM23, а киназный домен — в цитозоле.</li><li>Молекулы PINK1 на димере TOM фосфорилируют друг друга по S228 и S402 и активируются.</li><li>Активная PINK1 фосфорилирует убиквитин по S65; после отмывки <a href="#ns-g-S12-T21">CCCP</a> импорт возобновляется, и PINK1 быстро исчезает.</li></ol><p>Потеря потенциала, например при добавлении протонофора CCCP, останавливает втягивание N-конца PINK1. Белок не доходит до PARL, не разрезается и не получает N-дегрон, поэтому разрушение прекращается. Полноразмерная форма PINK1 (около 63 кДа) накапливается на внешней мембране: в клетках HeLa её рост заметен через 30 мин и продолжается не менее 3 ч (Narendra 2010).</p><p>Остановленный PINK1 образует с TOM комплекс около 700 кДа (Lazarou 2012). Его N-конец продет через пору TOM, а киназный домен обращён в цитозоль. Молекулы PINK1 образуют димеры и фосфорилируют друг друга (транс-автофосфорилирование) по S228 и S402; замена этих остатков на аланин лишает PINK1 способности привлекать Parkin (Okatsu 2012). Активная киназа фосфорилирует по S65 убиквитин на белках внешней мембраны (Koyano 2014).</p><p>Накопление PINK1 начинается через несколько минут после потери потенциала, а активация Parkin запаздывает примерно на 30 мин. Авторы обзора предполагают, что для активации на одном димере TOM должны оказаться две молекулы PINK1, а в норме их около трёх на 10 000 комплексов; предварительное повышение содержания PINK1 эту задержку устраняет (Narendra &amp; Youle 2024). Это гипотеза о механизме.</p><p>Состояние обратимо: после отмывки CCCP в клетках HeLa полноразмерный PINK1 резко убывает в течение 30 мин, потому что расщепление возобновляется (Narendra 2010). Сохраняет ли митохондрия «память» о недавней деполяризации, не известно; гистерезис — гипотеза, данных для вывода недостаточно.</p><div class="note trap"><strong>Типичная ошибка</strong> PINK1 сама распознаёт повреждение митохондрии, например окисленные белки.<p class="trap-fix">PINK1 служит датчиком собственного импорта: при потере потенциала она остаётся на внешней мембране. Путь запускает прежде всего потеря потенциала; в обзоре упомянуты и агрегированные белки, но этот вариант на схеме не показан.</p></div><div class="static-quiz"><h3>Клетки HeLa 3 ч выдерживали с CCCP: полноразмерный PINK1 накоплен на митохондриях. Затем CCCP отмыли. Как изменится количество полноразмерного PINK1 через 30 мин?</h3><ol><li><b>А.</b> Останется высоким: накопленный PINK1 стабилен и не разрезается даже при восстановленном потенциале. <i>(неверный вариант)</i><br><span class="expl">Стабильность PINK1 зависит от потенциала. После отмывки импорт и расщепление возобновляются, и содержание PINK1 резко убывает (Narendra 2010).</span></li><li><b>Б.</b> Снизится только потому, что перестанет синтезироваться новый PINK1. <i>(неверный вариант)</i><br><span class="expl">Остановка синтеза уже накопленный PINK1 не убирает: циклогексимид его уровень почти не менял (Narendra 2010). Убыль даёт возобновившееся расщепление.</span></li><li><b>В.</b> Резко снизится: импорт и расщепление PINK1 возобновились. <i>(верный вариант)</i><br><span class="expl">Потенциал восстановился, PINK1 снова импортируется, PARL его разрезает, и фрагмент разрушается. Так показана обратимость состояния.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1371/journal.pbio.1000298">Narendra D.P., Jin S.M., Tanaka A. et al. PINK1 is selectively stabilized on impaired mitochondria to activate Parkin. PLoS Biol. 2010;8:e1000298</a></li><li><a href="https://doi.org/10.1016/j.devcel.2011.12.014">Lazarou M., Jin S.M., Kane L.A., Youle R.J. Role of PINK1 binding to the TOM complex and alternate intracellular membranes in recruitment and activation of the E3 ligase Parkin. Dev Cell. 2012;22:320–333</a></li><li><a href="https://doi.org/10.1038/ncomms2016">Okatsu K., Oka T., Iguchi M. et al. PINK1 autophosphorylation upon membrane potential dissipation is essential for Parkin recruitment to damaged mitochondria. Nat Commun. 2012;3:1016</a></li><li><a href="https://doi.org/10.1038/nature13392">Koyano F., Okatsu K., Kosako H. et al. Ubiquitin is phosphorylated by PINK1 to activate parkin. Nature. 2014;510:162–166</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема механизма, качественные состояния; «первые минуты» и «30 мин и дольше» взяты из обзора Narendra &amp; Youle 2024 (полный текст), точные сроки зависят от клеток и условий. Narendra 2010 — клетки HeLa, CCCP 3 ч и отмывка (полный текст); Lazarou 2012 — клетки HeLa, комплекс около 700 кДа (реферат); Okatsu 2012 — клетки HeLa, замены S228A и S402A (реферат); Koyano 2014 — клетки HeLa, in vitro (реферат). Гипотеза о подсчёте молекул PINK1 принадлежит авторам обзора.</p></details></article><article class="card print-unit" id="ns-parkin-activation"><div class="eyebrow">PINK1 и Parkin · шаг 9 из 26</div><h2>Как pS65-убиквитин и PINK1 включают Parkin</h2><p class="lead">В цитозоле <a href="#ns-g-S12-T23">Parkin</a> находится в аутоингибированном состоянии. Его включают два события, которые обеспечивает PINK1: фосфорилирование убиквитина на внешней мембране и фосфорилирование самого Parkin.</p><ol class="mech"><li><a href="#ns-g-S12-T22">pS65-убиквитин</a> связывается с RING1 Parkin и освобождает его домен UBL.</li><li>PINK1 фосфорилирует S65 в освобождённом UBL; фосфо-UBL связывается с RING0 и открывает RING2 с каталитическим C431.</li><li>Активный Parkin присоединяет убиквитин к белкам внешней мембраны, новые цепи фосфорилирует PINK1: возникает положительная обратная связь.</li></ol><p>Без PINK1 Parkin находится в закрытой конформации. Домены UBL, RING0 и REP загораживают сайт связывания E2 и активный центр с остатком C431 в домене RING2, поэтому активность Parkin in vitro низка (Narendra &amp; Youle 2024). Сама по себе близость к митохондрии Parkin не включает.</p><p>Первый шаг — убиквитин. PINK1 фосфорилирует по S65 убиквитин на белках внешней мембраны. pS65-убиквитин связывается с Parkin в консервативном фосфатном кармане; связывание выпрямляет спираль в домене RING1, и UBL высвобождается из ядра белка (Wauer 2015). Одновременно освобождается REP, и сайт связывания E2 открывается (Narendra &amp; Youle 2024). Такой убиквитин активирует in vitro даже Parkin без домена UBL, а немодифицированный убиквитин — нет (Kazlauskaite 2014).</p><p>Второй шаг — сам Parkin. Высвобождение UBL усиливает его фосфорилирование PINK1 (Wauer 2015). Фосфо-UBL связывается с доменом RING0 и высвобождает каталитический RING2 (Gladkova 2018). По данным in vitro, фосфорилирование S65 в UBL подготавливает Parkin к активации убиквитином (Kazlauskaite 2014).</p><p>Активный Parkin присоединяет убиквитин в основном к белкам внешней мембраны. Эти цепи тоже фосфорилирует PINK1, и новый pS65-убиквитин привлекает и активирует новые молекулы Parkin: обратная связь ускоряет покрытие мембраны меткой (Ordureau 2014). Для этого нужны PINK1 и убиквитинированные белки на той же мембране, поэтому активация остаётся на повреждённой митохондрии и не затрагивает соседние здоровые (Narendra &amp; Youle 2024).</p><div class="note trap"><strong>Типичная ошибка</strong> Parkin активен с того момента, как пришёл на митохондрию.<p class="trap-fix">Приход и активация — разные события. pS65-убиквитин привлекает Parkin и освобождает UBL и REP, но активный центр остаётся закрытым, пока фосфо-UBL не свяжется с RING0 и не высвободит RING2 (Gladkova 2018). Для полного включения Parkin с доменом UBL нужны оба события.</p></div><div class="static-quiz"><h3>К очищенному Parkin без домена UBL (в нём нет S65) в пробирке с E1, E2 и ATP добавили убиквитин, фосфорилированный по S65, вместо обычного убиквитина. Как изменится убиквитинлигазная активность Parkin?</h3><ol><li><b>А.</b> Возрастёт: pS65-убиквитин связывается с RING1 и включает Parkin без участия UBL. <i>(верный вариант)</i><br><span class="expl">pS65-убиквитин активирует Parkin и без UBL, а немодифицированный убиквитин — нет (Kazlauskaite 2014): связывание в RING1 само ослабляет автоингибирование.</span></li><li><b>Б.</b> Не изменится: в таком Parkin нет S65 в UBL, поэтому включить его нечем. <i>(неверный вариант)</i><br><span class="expl">Фосфорилирование UBL усиливает активацию, но не единственный путь. pS65-убиквитин действует через RING1 независимо от UBL.</span></li><li><b>В.</b> Возрастёт так же, как при добавлении немодифицированного убиквитина. <i>(неверный вариант)</i><br><span class="expl">Обычный убиквитин Parkin без UBL не активирует. Нужен фосфат на S65 убиквитина.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BJ20140334">Kazlauskaite A., Kondapalli C., Gourlay R. et al. Parkin is activated by PINK1-dependent phosphorylation of ubiquitin at Ser65. Biochem J. 2014;460:127–139</a></li><li><a href="https://doi.org/10.1038/nature14879">Wauer T., Simicek M., Schubert A., Komander D. Mechanism of phospho-ubiquitin-induced PARKIN activation. Nature. 2015;524:370–374</a></li><li><a href="https://doi.org/10.1038/s41586-018-0224-x">Gladkova C., Maslen S.L., Skehel J.M., Komander D. Mechanism of parkin activation by PINK1. Nature. 2018;559:410–414</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.09.007">Ordureau A., Sarraf S.A., Duda D.M. et al. Quantitative proteomics reveal a feedforward mechanism for mitochondrial PARKIN translocation and ubiquitin chain synthesis. Mol Cell. 2014;56:360–375</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема механизма, качественные состояния; домены показаны условно, без структуры. Kazlauskaite 2014 — очищенные белки in vitro и клетки HEK293 (реферат); Wauer 2015 — кристаллическая структура Parkin насекомого Pediculus humanus с pS65-убиквитином (реферат); Gladkova 2018 — обмен водорода на дейтерий и структура Parkin человека (реферат); Ordureau 2014 — клетки HeLa с Parkin, количественная протеомика. Обзор Narendra &amp; Youle 2024 (полный текст) — общая схема. Нумерация S65 и C431 дана для Parkin человека.</p></details></article><article class="card print-unit" id="ns-parkin-signal"><div class="eyebrow">PINK1 и Parkin · шаг 10 из 26</div><h2>Что Parkin метит и как метка превращается в сигнал</h2><p class="lead">Активный <a href="#ns-g-S12-T23">Parkin</a> метит убиквитином много белков внешней мембраны. Часть из них разрушается, а остальные остаются на мембране как метка, к которой присоединяются рецепторы аутофагии.</p><ol class="mech"><li>Parkin присоединяет цепи убиквитина к VDAC1/2, <a href="#ns-g-S12-T24">MFN1/2</a>, RHOT1/2 и другим белкам внешней мембраны; часть цепей фосфорилирует PINK1.</li><li><a href="#ns-g-S12-T25">p97</a> извлекает MFN1/2 и RHOT1/2, и их разрушает протеасома; деубиквитиназа <a href="#ns-g-S12-T26">USP30</a> снимает метку.</li><li>OPTN и NDP52 связывают цепи с pS65-убиквитином и привлекают ULK1 и TBK1: аутофагосома начинает строиться у самой метки.</li></ol><p>Активный Parkin убиквитинирует преимущественно белки внешней мембраны. В нейронах наиболее сильно помечены VDAC1 и VDAC2, MFN1 и MFN2, RHOT1 и RHOT2, CISD1. Занятость сайтов при этом мала: для любого сайта VDAC1 и VDAC2 убиквитинировано менее 2 % молекул (Narendra &amp; Youle 2024).</p><p>Часть субстратов убиквитинируется предпочтительно и удаляется. MFN1/2 и RHOT1/2 извлекает из мембраны p97 с кофакторами UFD1–NPL4, а протеасома их разрушает, даже если митофагия заблокирована. В клетках HeLa с избытком Parkin ингибиторы протеасомы подавляли убыль MFN1, MFN2, VDAC1 и TOMM20 (Tanaka 2010; Chan 2011). В нейронах с эндогенным Parkin белки VDAC1 и VDAC2, как правило, не удаляются из мембраны, а служат меткой (Narendra &amp; Youle 2024). Поэтому потеря одного белка внешней мембраны не означает удаления митохондрии.</p><p>Часть белков, например VDAC1/2, остаётся на мембране как метка. Цепи с pS65-убиквитином связывают рецепторы OPTN и NDP52; они привлекают ULK1, DFCP1 и WIPI1 к участкам рядом с митохондрией ещё до присоединения LC3 (Lazarou 2015). В клетках без пяти рецепторов Parkin приходит на митохондрии, а MFN1 и TOMM20 разрушаются протеасомой, но митофагии нет.</p><p>Деубиквитиназа USP30 во внешней мембране снимает убиквитин, поставленный Parkin: при избытке USP30 метка исчезает и митофагия подавлена, а при снижении её активности в нейронах деградация митохондрий усиливается (Bingol 2014). Вывод о составе метки основан в основном на клетках с избыточным Parkin.</p><div class="note trap"><strong>Типичная ошибка</strong> Parkin метит один белок, поэтому достаточно разрушения MFN2.<p class="trap-fix">Parkin метит множество белков внешней мембраны. Часть из них, прежде всего MFN1/2 и RHOT1/2, извлекает p97 и разрушает протеасома; многие остаются на мембране как метка для рецепторов. Убыль MFN2 показывает работу Parkin и протеасомы, но не удаление митохондрии.</p></div><div class="static-quiz"><h3>В клетках с активным Parkin на повреждённых митохондриях избыточно экспрессировали деубиквитиназу USP30. Как изменится убиквитин, поставленный Parkin на внешней мембране?</h3><ol><li><b>А.</b> Станет больше: USP30 присоединяет убиквитин к белкам внешней мембраны. <i>(неверный вариант)</i><br><span class="expl">USP30 — деубиквитиназа: она снимает убиквитин, а не присоединяет. Цепи ставит Parkin.</span></li><li><b>Б.</b> Не изменится: USP30 снимает убиквитин только внутри матрикса. <i>(неверный вариант)</i><br><span class="expl">USP30 закреплена во внешней мембране и действует на белки, которые метит Parkin (Bingol 2014).</span></li><li><b>В.</b> Станет меньше: USP30 снимает убиквитин, поставленный Parkin. <i>(верный вариант)</i><br><span class="expl">При избытке USP30 убиквитин на повреждённых митохондриях исчезает, и Parkin хуже запускает митофагию (Bingol 2014).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1093/hmg/ddr048">Chan N.C., Salazar A.M., Pham A.H. et al. Broad activation of the ubiquitin-proteasome system by Parkin is critical for mitophagy. Hum Mol Genet. 2011;20:1726–1737</a></li><li><a href="https://doi.org/10.1083/jcb.201007013">Tanaka A., Cleland M.M., Xu S. et al. Proteasome and p97 mediate mitophagy and degradation of mitofusins induced by Parkin. J Cell Biol. 2010;191:1367–1380</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1038/nature13418">Bingol B., Tea J.S., Phu L. et al. The mitochondrial deubiquitinase USP30 opposes parkin-mediated mitophagy. Nature. 2014;510:370–375</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема механизма, качественные состояния. Chan 2011 и Tanaka 2010 — клетки HeLa с Parkin, CCCP, ингибиторы протеасомы (рефераты и фрагменты полного текста); Lazarou 2015 — клетки HeLa, нокаут пяти рецепторов, олигомицин с антимицином A (полный текст); Bingol 2014 — клетки, нейроны крысы и дрозофила, избыточная экспрессия и нокдаун USP30 (реферат). Занятость сайтов VDAC — по обзору Narendra &amp; Youle 2024 (культивируемые нейроны с эндогенным Parkin). Роль TBK1 показана схематично.</p></details></article><article class="card print-unit" id="ns-mito-routes"><div class="eyebrow">PINK1 и Parkin · шаг 11 из 26</div><h2>Другие пути митофагии и значение PINK1–Parkin</h2><p class="lead">PINK1–Parkin — самый изученный, но не единственный способ запустить митофагию. Другие воздействия включают рецепторы, которым убиквитин не нужен, или иной путь, а PINK1 нужна не везде.</p><ol class="mech"><li>При гипоксии и созревании эритроцитов митохондрии удаляют рецепторы <a href="#ns-g-S12-T27">BNIP3 и NIX</a> во внешней мембране; убиквитин и PINK1–Parkin не требуются.</li><li>Хелатор железа <a href="#ns-g-S12-T28">деферипрон</a> запускает митофагию, не зависящую от PINK1 и Parkin.</li><li>В большинстве исследованных тканей мыши базальная митофагия идёт без PINK1; PINK1 и Parkin вносят вклад при стрессе и в части тканей.</li></ol><p>Рецепторы BNIP3 и NIX (BNIP3L) расположены во внешней мембране и сами несут мотив LIR, поэтому связывают белки ATG8 без убиквитина. При гипоксии их образование усиливает HIF1A, а NIX необходим для удаления митохондрий при созревании эритроидных клеток; PINK1 и Parkin для этого не нужны (Terešak 2022).</p><p>Другой пример — потеря железа. В клетках U2OS и SH-SY5Y деферипрон за 24 ч вызывал митофагию: митохондриальный белок внешней мембраны доставлялся в кислые лизосомы. Подавление PINK1 эффект не меняло, а сама PINK1 при этом не стабилизировалась; подавление BNIP3 эффект тоже не меняло (Allen 2013). Рецептор, который работает в этом случае, остаётся неизвестным.</p><p>Третий путь — митохондриальные пузырьки. При окислительном стрессе от митохондрий отпочковываются пузырьки с отобранным грузом, которые затем доставляются в лизосомы; для них нужны PINK1 и Parkin, но путь отличается от канонической митофагии (McLelland 2014).</p><p>У мышей с нокаутом Pink1 базальная митофагия в большинстве исследованных тканей, в том числе с высоким расходом энергии, сохранялась; исключением были островки поджелудочной железы, где при потере PINK1 митофагия, напротив, повышалась (McWilliams 2018). По обзору Narendra &amp; Youle 2024, в печени часть базальной митофагии, вероятно, зависит от BNIP3 и NIX, в скелетной мышце и сердце PINK1–Parkin, по-видимому, вносят вклад, а в мозге преобладающий путь не установлен. Значение PINK1–Parkin зависит от ткани и воздействия. Потеря обоих аллелей PINK1 или PRKN вызывает рецессивную форму болезни Паркинсона с ранним началом (Narendra &amp; Youle 2024).</p><div class="note trap"><strong>Типичная ошибка</strong> PINK1–Parkin — единственный путь митофагии.<p class="trap-fix">Есть пути, не зависящие от PINK1 и Parkin: рецепторы BNIP3 и NIX при гипоксии и созревании эритроцитов, ответ на потерю железа. В исследованных тканях мыши базальная митофагия часто идёт без PINK1. Значение PINK1–Parkin зависит от ткани и воздействия.</p></div><div class="static-quiz"><h3>В клетках U2OS подавили PINK1 с помощью siRNA, затем добавили хелатор железа деферипрон на 24 ч. Как изменится доставка митохондриального белка внешней мембраны в лизосомы по сравнению с клетками без деферипрона?</h3><ol><li><b>А.</b> Возрастёт: потеря железа запускает митофагию, для которой PINK1 не нужна. <i>(верный вариант)</i><br><span class="expl">Деферипрон вызывал митофагию в клетках U2OS и SH-SY5Y, а подавление PINK1 эффект не меняло (Allen 2013).</span></li><li><b>Б.</b> Не изменится: без PINK1 никакое воздействие не запускает митофагию. <i>(неверный вариант)</i><br><span class="expl">Это неверно: помимо PINK1–Parkin есть пути, которые включаются гипоксией или потерей железа и не требуют PINK1.</span></li><li><b>В.</b> Снизится: хелатор железа блокирует доставку митохондрий в лизосомы. <i>(неверный вариант)</i><br><span class="expl">Деферипрон не блокирует доставку, а запускает митофагию, не зависящую от PINK1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1080/15548627.2021.1888244">Terešak P., Lapao A., Subic N., Boya P., Elazar Z., Simonsen A. Regulation of PRKN-independent mitophagy. Autophagy. 2022;18:24–39</a></li><li><a href="https://doi.org/10.1038/embor.2013.168">Allen G.F.G., Toth R., James J., Ganley I.G. Loss of iron triggers PINK1/Parkin-independent mitophagy. EMBO Rep. 2013;14:1127–1135</a></li><li><a href="https://doi.org/10.1002/embj.201385902">McLelland G.-L., Soubannier V., Chen C.X., McBride H.M., Fon E.A. Parkin and PINK1 function in a vesicular trafficking pathway regulating mitochondrial quality control. EMBO J. 2014;33:282–295</a></li><li><a href="https://doi.org/10.1016/j.cmet.2017.12.008">McWilliams T.G., Prescott A.R., Montava-Garriga L. et al. Basal mitophagy occurs independently of PINK1 in mouse tissues of high metabolic demand. Cell Metab. 2018;27:439–449</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема маршрутов, качественные состояния. Terešak 2022 и Narendra &amp; Youle 2024 — обзоры (полный текст); Allen 2013 — клетки U2OS и SH-SY5Y, деферипрон 24 ч, подавление PINK1 и BNIP3 siRNA, репортёр на внешней мембране (прочитан текст статьи); McLelland 2014 — клетки HeLa, антимицин A (реферат); McWilliams 2018 — мыши с репортёром mito-QC, ткани и первичные клетки (прочитан текст статьи). Различия между тканями приведены по обзору Narendra &amp; Youle 2024, а не по собственным данным.</p></details></article><article class="card print-unit" id="ns-mito-measure"><div class="eyebrow">PINK1 и Parkin · шаг 12 из 26</div><h2>Как измерить митофагию</h2><p class="lead">Митофагию измеряют по доставке митохондриального материала в кислые лизосомы и по исчезновению митохондриальных белков. Ни один показатель сам по себе не подтверждает митофагию, поэтому их сочетают и проверяют контролями.</p><ol class="mech"><li>Репортёры <a href="#ns-g-S12-T29">mt-Keima</a> и <a href="#ns-g-S12-T30">mito-QC</a> меняют сигнал в кислой среде лизосомы и показывают доставку митохондрий.</li><li>Иммуноблот сравнивает белок внешней мембраны, который может разрушать протеасома, и белок внутренней мембраны.</li><li>Контроли — клетки без PINK1, без рецепторов или без аутофагии, бафиломицин A1 и сравнение воздействий по срокам.</li></ol><p>Репортёр mt-Keima направлен в матрикс митохондрии. Он устойчив к кислой среде, а цвет его сигнала зависит от pH, поэтому митохондрии в цитозоле и в лизосоме различаются (Katayama 2011). mito-QC — тандем mCherry–GFP на внешней мембране: в лизосоме кислая среда гасит GFP, а mCherry остаётся, и возникают красные точки без зелёного (McWilliams 2016).</p><p>На иммуноблоте сравнивают белок внешней мембраны и белок внутренней мембраны. После деполяризации в клетках HeLa с Parkin белки внешней мембраны MFN1 и TOMM20 разрушает протеасома: в клетках без пяти рецепторов они исчезают так же, как в клетках дикого типа, а белок внутренней мембраны COX II сохраняется, потому что митофагии нет (Lazarou 2015). Работу самого пути проверяют по накоплению полноразмерной PINK1 и по появлению pS65-убиквитина.</p><p>У репортёров есть границы. Доставка в кислый отсек происходит не только при митофагии, но и при неселективной аутофагии и гетерофагии, поэтому нужны блоки аутофагии (Narendra &amp; Youle 2024). Бафиломицин A1 повышает pH лизосом и убирает красный сигнал mCherry–GFP-репортёра (Allen 2013). Keima несовместим с фиксацией и его измеряют в живых клетках и тканях, а сигнал mito-QC при фиксации сохраняется. Кроме того, Keima выявляет и доставку в лизосомы, не зависящую от ATG5 (Katayama 2011), поэтому блок одного звена аутофагии не исключает остаточный сигнал.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок внешней мембраны исчез, значит, митохондрию удалила митофагия.<p class="trap-fix">Белки внешней мембраны, помеченные Parkin, разрушает протеасома, в том числе при заблокированной митофагии. Митофагию подтверждают белок внутренней мембраны или матрикса, репортёр и контроль с блокадой аутофагии.</p></div><div class="static-quiz"><h3>В клетках HeLa с Parkin после деполяризации исчезают белок внешней мембраны TOMM20 и белок внутренней мембраны COX II. Взяли такие же клетки без пяти рецепторов аутофагии (митофагия в них не идёт). Что покажет иммуноблот?</h3><ol><li><b>А.</b> TOMM20 и COX II сохранятся: без митофагии митохондриальные белки не разрушаются. <i>(неверный вариант)</i><br><span class="expl">Белки внешней мембраны, помеченные Parkin, разрушает и протеасома, поэтому TOMM20 убывает и без митофагии (Lazarou 2015).</span></li><li><b>Б.</b> TOMM20 убудет, как в клетках дикого типа, а COX II сохранится. <i>(верный вариант)</i><br><span class="expl">TOMM20 разрушает протеасома, COX II находится внутри митохондрии, поэтому его убыль служит показателем митофагии (Lazarou 2015).</span></li><li><b>В.</b> TOMM20 и COX II убудут так же, как в клетках дикого типа, их разрушает протеасома. <i>(неверный вариант)</i><br><span class="expl">Протеасома разрушает белки внешней мембраны, но до COX II во внутренней мембране не добирается: его убыль указывает на митофагию.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-12.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.chembiol.2011.05.013">Katayama H., Kogure T., Mizushima N., Yoshimori T., Miyawaki A. A sensitive and quantitative technique for detecting autophagic events based on lysosomal delivery. Chem Biol. 2011;18:1042–1052</a></li><li><a href="https://doi.org/10.1083/jcb.201603039">McWilliams T.G., Prescott A.R., Allen G.F.G. et al. mito-QC illuminates mitophagy and mitochondrial architecture in vivo. J Cell Biol. 2016;214:333–345</a></li><li><a href="https://doi.org/10.1038/nature14893">Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314</a></li><li><a href="https://doi.org/10.1038/embor.2013.168">Allen G.F.G., Toth R., James J., Ganley I.G. Loss of iron triggers PINK1/Parkin-independent mitophagy. EMBO Rep. 2013;14:1127–1135</a></li><li><a href="https://doi.org/10.1038/s41556-024-01513-9">Narendra D.P., Youle R.J. The role of PINK1–Parkin in mitochondrial quality control. Nat Cell Biol. 2024;26:1639–1651</a></li></ul><p>Схема метода, условные пиктограммы: число точек, интенсивность полос и цвета не являются данными эксперимента. Katayama 2011 — культивируемые клетки, Keima (реферат); McWilliams 2016 — репортёр mito-QC в клетках и тканях мыши (прочитан текст статьи); Lazarou 2015 — клетки HeLa с Parkin, нокаут пяти рецепторов, олигомицин с антимицином A (полный текст); Allen 2013 — клетки U2OS и SH-SY5Y, репортёр mCherry–GFP на внешней мембране, бафиломицин A1 (прочитан текст статьи). Narendra &amp; Youle 2024 — обзор (полный текст). Для mt-Keima контроль блокадой лизосомного закисления в первоисточниках раздела отдельно не проверялся; приведён нокаут ATG5 по обзору Narendra &amp; Youle 2024.</p></details></article><article class="card print-unit" id="ns-lyso-damage"><div class="eyebrow">Повреждение лизосомы · шаг 13 из 26</div><h2>Чем и как повреждается лизосомная мембрана</h2><p class="lead"><a href="#ns-g-S12-T31">Проницаемость лизосомной мембраны</a> — потеря мембраной барьерной функции: из кислой лизосомы с десятками гидролаз выходят протоны, ионы Ca²⁺ и ферменты. Повреждение бывает малым и крупным, и от его размера зависит, какие сигналы возникнут.</p><ol class="mech"><li>Детергент-подобные вещества и продукты окисления липидов нарушают упаковку липидов лизосомной мембраны; кристаллы и агрегаты, как предполагают, разрывают её механически, а бактерии образуют поры.</li><li><a href="#ns-g-S12-T32">LLOMe</a> проникает в лизосому, и <a href="#ns-g-S12-T33">катепсин C</a> превращает его в полилейцины, которые и нарушают мембрану.</li><li>Малое повреждение пропускает протоны и Ca²⁺; при крупном наружу выходят катепсины, а белки цитозоля получают доступ к гликанам внутренней стороны мембраны.</li></ol><p>Лизосома окружена одной мембраной. Внутри pH около 4,5–5 и более 50 гидролаз, а внутренняя поверхность мембраны выстлана гликанами, которые защищают её от ферментов. Концентрация Ca²⁺ в просвете высока, в цитозоле мала.</p><p>Проницаемость растёт тремя путями, которые зависят от вида и силы воздействия: диффузией через плохо упакованный бислой, временными тороидальными порами и осмотическими разрывами. Так действуют вещества с детергентными свойствами и продукты перекисного окисления липидов (лизосомы богаты железом, и в них легко образуются активные формы кислорода). Для фагоцитированных кристаллов и нейротоксичных агрегатов (тау, α-синуклеин, β-амилоид) предполагают механический разрыв мембраны; наночастицы кремнезёма, напротив, действуют через перекисное окисление липидов. Бактерии образуют поры или разрывают мембрану.</p><p>В эксперименте мембрану повреждают LLOMe. Он пассивно проникает в лизосому, протонируется и остаётся в ней; катепсин C конденсирует его в полилейцины со средней длиной около шести остатков. Поэтому чувствительность клеток к LLOMe зависит от уровня катепсина C.</p><p>Сначала через слабо упакованную мембрану проходят вода и протоны: pH просвета растёт и мембранный потенциал теряется, а это косвенно активирует каналы лизосомы, через которые выходит Ca²⁺ (Ca²⁺ выходит и через временные поры). Крупный разрыв или осмотический взрыв выпускает катепсины, а в просвет проникают сахар-связывающие белки цитозоля. Клетки способны пережить ограниченное повреждение, но утечка протонов и гидролаз при тяжёлом повреждении может запустить гибель клетки или воспаление. Как цитозольные белки получают доступ к гликанам при повреждении без разрыва, неизвестно.</p><div class="note trap"><strong>Типичная ошибка</strong> LLOMe повреждает любую мембрану одинаково, потому что сам является детергентом.<p class="trap-fix">LLOMe — предшественник. Он накапливается в кислых отсеках, где катепсин C превращает его в полилейцины; эти продукты нарушают мембрану, поэтому действие вещества зависит от уровня катепсина C.</p></div><div class="static-quiz"><h3>Клетки с нокаутом катепсина C обработали той же дозой LLOMe, которая повреждает лизосомы контрольных клеток. Какое изменение ожидается по сравнению с контролем?</h3><ol><li><b>А.</b> Повреждение выражено так же, потому что LLOMe нарушает мембрану без превращений. <i>(неверный вариант)</i><br><span class="expl">LLOMe — предшественник: мембрану нарушают полилейцины, а для их образования нужен катепсин C.</span></li><li><b>Б.</b> Повреждение выражено слабее, потому что полилейцины образуются в меньшем количестве. <i>(верный вариант)</i><br><span class="expl">Верно: токсичность LLOMe зависит от уровня катепсина C, поскольку мембрану повреждают продукты превращения, а не сам эфир.</span></li><li><b>В.</b> Повреждение выражено сильнее, потому что LLOMe не расходуется на образование полилейцинов. <i>(неверный вариант)</i><br><span class="expl">Токсичность зависит от катепсина C; мембрану, как считают, нарушают продукты конденсации (полилейцины), действие самого эфира не показано, поэтому избыток эфира без катепсина C не усиливает повреждение.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1016/j.cub.2017.11.012">Papadopoulos C., Meyer H. Detection and clearance of damaged lysosomes by the endo-lysosomal damage response and lysophagy. Curr Biol. 2017;27:R1330–R1341</a></li><li><a href="https://doi.org/10.1080/15548627.2015.1063871">Aits S., Kricker J., Liu B. et al. Sensitive detection of lysosomal membrane permeabilization by lysosomal galectin puncta assay. Autophagy. 2015;11:1408–1424</a></li><li><a href="https://doi.org/10.1126/science.aar5078">Skowyra M.L., Schlesinger P.H., Naismith T.V., Hanson P.I. Triggered recruitment of ESCRT machinery promotes endolysosomal repair. Science. 2018;360:eaar5078</a></li></ul><p>Схема механизма; состояния качественные. Сведения об LLOMe и о путях повышения проницаемости взяты из обзора Meyer &amp; Kravic 2024; эксперименты с LLOMe выполнены в основном на культивируемых клетках человека (HeLa и другие). Действие кристаллов, агрегатов и бактерий показано по обзорным данным; относительный вклад путей в тканях при болезнях изучен слабо.</p></details></article><article class="card print-unit" id="ns-lyso-signals"><div class="eyebrow">Повреждение лизосомы · шаг 14 из 26</div><h2>Какие сигналы сообщают о повреждении</h2><p class="lead">Повреждение лизосомной мембраны сопровождается несколькими физическими изменениями: выходом Ca²⁺, утечкой протонов, перемещением липидов и открытием гликанов. Каждое изменение узнаёт свой белок, поэтому сигналы различаются по чувствительности к размеру повреждения.</p><ol class="mech"><li>Ca²⁺, вышедший в цитозоль, связывается с <a href="#ns-g-S12-T35">ALG-2</a>, и тот привлекает компоненты ESCRT.</li><li>V-ATPase при потере протонов и сфингомиелин на цитозольной стороне привлекают ATG16L1 и TECPR1, которые присоединяют ATG8 к самой мембране (<a href="#ns-g-S12-T39">CASM</a>).</li><li><a href="#ns-g-S12-T34">Галектины</a> 3, 8 и 9 связывают гликаны внутренней стороны мембраны, открытые при крупном повреждении.</li></ol><p>В неповреждённой лизосоме Ca²⁺ и протоны находятся в просвете, сфингомиелин преобладает в слое мембраны, обращённом к просвету, а гликаны скрыты внутри. Для белков цитозоля все эти признаки недоступны.</p><p>Выход Ca²⁺ — ранний и очень чувствительный сигнал: Ca²⁺ покидает лизосому через временные поры и через каналы, которые активируют рост pH, потеря мембранного потенциала и рост активных форм кислорода, поэтому сигнал возникает даже при малом повреждении. Утечка протонов и рост активных форм кислорода заставляют V-ATPase привлечь комплекс ATG16L1. Сфингомиелин перемещается на цитозольную сторону и узнаётся белком TECPR1. Оба пути присоединяют белки ATG8 к самой мембране. При крупном повреждении гликопротеины и гликолипиды просвета обращены к цитозолю, и их связывают галектины.</p><p>Галектины не только метки. Галектин-3 помогает привлечь ALIX и TRIM16, галектин-8 способствует отсоединению mTORC1 от лизосомы, галектин-9 привлекает киназу TAK1. Но галектины связывают сахара, а не убиквитин: мост между убиквитином и ATG8 при лизофагии строят другие рецепторы.</p><p>Отсюда граница вывода: крупное повреждение выявляют по галектинам, а малое, которое быстро ремонтируется, остаётся без галектина. Отсутствие галектина-3 на лизосоме не означает отсутствия повреждения. Как цитозольные сенсоры получают доступ к гликанам при повреждении без разрыва, не решено.</p><div class="note trap"><strong>Типичная ошибка</strong> Галектин-3 — рецептор лизофагии.<p class="trap-fix">Рецептором селективной аутофагии называют белок, который соединяет метку на грузе с белком ATG8. В лизофагии эту роль выполняют TAX1BP1, p62, OPTN и NDP52, узнающие убиквитин. Галектины узнают открытые гликаны и привлекают другие белки ответа; галектин-3 удобен как метка крупного повреждения.</p></div><div class="static-quiz"><h3>Лизосома получила малое повреждение: временные поры пропускают ионы, но содержимое просвета остаётся внутри. Какой из перечисленных сигналов возникнет?</h3><ol><li><b>А.</b> Связывание галектина-3 с гликанами внутренней стороны мембраны. <i>(неверный вариант)</i><br><span class="expl">Гликаны остаются скрытыми, пока просвет не открыт цитозолю; этот сигнал связывают с более обширным повреждением.</span></li><li><b>Б.</b> Присоединение цепей убиквитина K48 и извлечение белков с помощью VCP/p97. <i>(неверный вариант)</i><br><span class="expl">Цепи K48 появляются позже K63, на этапе лизофагии, а не в первые минуты после малого повреждения.</span></li><li><b>В.</b> Связывание Ca²⁺, вышедшего в цитозоль, с белком ALG-2. <i>(верный вариант)</i><br><span class="expl">Верно: выход Ca²⁺ чувствителен даже к малому повреждению, и ALG-2 привлекает ESCRT уже в первые минуты.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-12.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-030222-102505">Meyer H., Kravic B. The endo-lysosomal damage response. Annu Rev Biochem. 2024;93:367–387</a></li><li><a href="https://doi.org/10.1016/j.devcel.2019.10.025">Jia J., Claude-Taupin A., Gu Y. et al. Galectin-3 coordinates a cellular system for lysosomal repair and removal. Dev Cell. 2020;52:69–87</a></li><li><a href="https://doi.org/10.15252/embj.2022113012">Boyle K.B., Ellison C.J., Elliott P.R. et al. TECPR1 conjugates LC3 to damaged endomembranes upon detection of sphingomyelin exposure. EMBO J. 2023;42:e113012</a></li><li><a href="https://doi.org/10.1083/jcb.202009128">Fischer T.D., Wang C., Padman B.S., Lazarou M., Youle R.J. STING induces LC3B lipidation onto single-membrane vesicles via the V-ATPase and ATG16L1-WD40 domain. J Cell Biol. 2020;219:e202009128</a></li><li><a href="https://doi.org/10.1080/15548627.2015.1063871">Aits S., Kricker J., Liu B. et al. Sensitive detection of lysosomal membrane permeabilization by lysosomal galectin puncta assay. Autophagy. 2015;11:1408–1424</a></li></ul><p>Схема механизма; состояния качественные. Ca²⁺ возникает даже при малом повреждении, галектины — при более обширном (Meyer &amp; Kravic 2024); пороги для V-ATPase и сфингомиелина не определены, поэтому на схеме они показаны при любом повреждении — это учебное упрощение. Функции TECPR1 изучены в основном на мембранах, повреждённых бактериями (Boyle 2023), а путь V-ATPase–ATG16L1 — на одномембранных пузырьках (Fischer 2020). Регистрация галектина-3 показана условной пиктограммой.</p></details></article><article class="card print-unit" id="ns-lyso-repair"><div class="eyebrow">Повреждение лизосомы · шаг 15 из 26</div><h2>Как лизосома ремонтируется</h2><p class="lead">Небольшое повреждение лизосомы не требует удаления органеллы: мембрану ремонтируют за минуты. Известны два способа ремонта: сузить место повреждения и убрать его в просвет, а также пополнить мембрану липидами; для более крупных повреждений нужны ещё аннексины.</p><ol class="mech"><li><a href="#ns-g-S12-T35">ALG-2</a> с Ca²⁺ привлекает <a href="#ns-g-S12-T36">ESCRT-III</a> к цитозольной стороне мембраны, и его полимеры вместе с VPS4 сужают место повреждения.</li><li>Ca²⁺ включает PI4K2A, а PI4P привлекает белки OSBP и ORP: они переносят холестерол и фосфатидилсерин из ЭПР, затем ATG2 и VPS13C переносят большие количества липидов (<a href="#ns-g-S12-T37">PITT</a>).</li><li><a href="#ns-g-S12-T38">Аннексины</a> A1 и A2 садятся на повреждённую мембрану независимо от ESCRT и участвуют в ремонте более крупных повреждений.</li></ol><p>После небольшого повреждения лизосома ещё сохраняет форму, но её мембрана стала проницаемой, и Ca²⁺ вышел в цитозоль. Этот сигнал запускает ремонт раньше, чем появляются метки для удаления.</p><p>ESCRT-III привлекают в течение минут: ALG-2 с Ca²⁺ садится на мембрану и вызывает сборку ESCRT через ESCRT-I (TSG101) и непосредственно через ALIX; для ремонта лизосом при осмотическом повреждении ALG-2 необходим (Hurley 2025). Эта сборка предшествует появлению галектина-3 и аппарата лизофагии. ESCRT-III вместе с АТФазой VPS4 осуществляет разделение мембран с «обратной» топологией: полимеры собираются внутри шейки, окружённой цитозолем (Olmos 2022). На повреждённой лизосоме они сужают место повреждения; по одной гипотезе, повреждённый участок уходит в просвет внутрипросветным пузырьком, по другой — разрыв временно закупоривается, но точный механизм не известен.</p><p>Параллельно Ca²⁺ активирует PI4K2A. PI4P на лизосомной мембране привлекает OSBP и ORP9, ORP10, ORP11; они создают контакты с ЭПР и переносят в мембрану холестерол и фосфатидилсерин в обмен на PI4P. Фосфатидилсерин привлекает ATG2. Недавно показано, что в ремонте участвуют домены ЭПР с PI3P: белок DFCP1 собирает на н
