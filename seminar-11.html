и распад не может ускориться.", "p3a_2_w3": "Распад NHK зависит от отщепления маннозы: гликан Man₇ узнаёт OS-9. Подавление маннозидаз меняет скорость распада.", "p3a_3_q": "Клетки с NHK прослеживают 4 ч. Какая полоса NHK появится в дорожках клеток без Endo H, если добавить бортезомиб?", "p3a_3_o1": "Полоса с подвижностью белка без гликана", "p3a_3_o2": "Полоса комплексной формы, устойчивая к Endo H", "p3a_3_o3": "Полоса NHK в дорожке среды", "p3a_3_e": "Бортезомиб ингибирует 26S-протеасому, а ретротранслокация и извлечение белка p97 продолжаются. В цитозоле NGLY1 отщепляет гликан, и NHK без гликана накапливается в убиквитинированной форме, поэтому появляется более быстрая полоса.", "p3a_3_w2": "Комплексный гликан образуется в аппарате Гольджи. NHK из ЭПР в аппарат Гольджи не выходит, и ингибитор протеасомы этого не меняет.", "p3a_3_w3": "Бортезомиб действует в цитозоле на последнем звене ERAD и не открывает NHK секреторный путь, поэтому в среде NHK не появится.", "p3a_4_q": "Клетки с NHK прослеживают 4 ч в присутствии CB-5083 — ингибитора ATPазы p97. Чувствительна ли к Endo H форма NHK, накопившаяся в клетках?", "p3a_4_o1": "Да: гликан остаётся высокоманнозным", "p3a_4_o2": "Нет: гликан уже отщеплён NGLY1", "p3a_4_o3": "Нет: белок прошёл medial-Гольджи", "p3a_4_e": "p97 извлекает убиквитинированный белок из мембраны ЭПР в цитозоль, где его гликан снимает NGLY1. При CB-5083 NHK убиквитинирован, но остаётся связанным с мембраной ЭПР с высокоманнозным гликаном, поэтому Endo H смещает полосу.", "p3a_4_w2": "NGLY1 работает в цитозоле с белком, который уже извлечён из мембраны. При блоке p97 NHK до NGLY1 не доходит, и гликан остаётся на месте.", "p3a_4_w3": "Ингибитор p97 не открывает NHK секреторный путь. Несвёрнутый белок не выходит в аппарат Гольджи и не получает комплексного гликана.", "p3a_5_q": "Клетки с α1-антитрипсином дикого типа прослеживают 4 ч в присутствии кифунензина. Как изменится реакция белка в среде на Endo H?", "p3a_5_o1": "Станет чувствительным: полоса после Endo H сместится", "p3a_5_o2": "Останется устойчивым: полоса не сместится", "p3a_5_o3": "Полосы в среде не будет: белок задержится в ЭПР", "p3a_5_e": "Кифунензин подавляет маннозидазу I аппарата Гольджи, без которой комплексный гликан не образуется (Elbein 1990). Свёрнутый белок секретируется, но с гликаном Man₉, а его Endo H отщепляет.", "p3a_5_w2": "Устойчивость к Endo H создают ферменты medial-Гольджи, которые достраивают гликан до комплексного. Для этого сначала нужно отщепить маннозы, а при кифунензине этого не происходит.", "p3a_5_w3": "Белок дикого типа сворачивается в цикле калнексина независимо от маннозидаз и выходит из ЭПР. Кифунензин меняет его гликан, но не секрецию.", "p3a_6_q": "В клетках линии X меченый NHK к 4 ч остаётся в клетках, его полоса чувствительна к Endo H, в среде его нет, и убиквитинированный NHK почти не выявляется. Какое звено ERAD нарушено в этих клетках?", "p3a_6_o1": "Ретротранслокация и убиквитинирование при участии SEL1L–HRD1", "p3a_6_o2": "Извлечение белка из мембраны ATPазой p97", "p3a_6_o3": "Расщепление белка 26S-протеасомой", "p3a_6_e": "Белок не выходит из ЭПР, сохраняет высокоманнозный гликан и не убиквитинируется. Значит, разрыв находится до убиквитинирования. В линии X снижено содержание HRD1: убиквитинлигаза, образующая канал ретротранслокации вместе с SEL1L, не работает (Christianson 2008). Похожий результат дало бы и нарушение доставки белка к комплексу, например без OS-9.", "p3a_6_w2": "При блоке p97 HRD1 успевает убиквитинировать NHK, и убиквитинированный белок с гликаном накапливается. В линии X убиквитинированного NHK почти нет.", "p3a_6_w3": "При блоке протеасомы NHK выводится в цитозоль и теряет гликан: появилась бы быстрая полоса, не смещаемая Endo H, и накопился бы убиквитинированный белок.", "gn_q3_a1at": "α1-антитрипсин и его вариант NHK", "g_q3_a1at": "α1-Антитрипсин — секретируемый гликопротеин печени, ингибитор сериновых протеаз; у человека он несёт три N-гликана. NHK (null Hong Kong) — вариант со сдвигом рамки считывания: синтезируется укороченный белок, который не может свернуться. В клетках гепатомы мыши NHK задерживался в шероховатом ЭПР и не секретировался (Sifers 1988), а затем разрушался протеасомой по пути ERAD (Liu 1999; Christianson 2008). Поэтому NHK стал модельным субстратом ERAD. На схеме показан один гликан, хотя у белка их три. Скорость распада в модели — учебное значение: период полужизни NHK около 1,5 ч.", "gn_q3_cnx": "Калнексин, кальретикулин и ERp57", "g_q3_cnx": "Калнексин (мембранный белок ЭПР) и кальретикулин (растворимый белок просвета ЭПР) — лектины-шапероны: они связывают гликан с одной глюкозой (Glc₁Man₉GlcNAc₂). Связывание определяется гликаном, а не открытыми гидрофобными участками белка (Hebert 1995, микросомы, гемагглютинин вируса гриппа). Оксидоредуктаза ERp57 в комплексе с ними участвует в образовании и перестройке дисульфидных связей. Белок отходит от лектина, когда глюкозидаза II снимает последнюю глюкозу (Guay 2025).", "gn_q3_uggt": "UGGT1 — датчик несвёрнутого состояния", "g_q3_uggt": "UDP-глюкоза:гликопротеин-глюкозилтрансфераза 1 (UGGT1) — растворимый фермент ЭПР. Она возвращает одну глюкозу на гликан Man₇₋₉GlcNAc₂, но только если белок не свёрнут: фермент узнаёт открытые гидрофобные участки несвёрнутого белка и внутренний остаток GlcNAc гликана (Sousa 1995; Caramelo 2003, белки in vitro). Так возникает цикл: глюкозидаза II снимает глюкозу, UGGT1 возвращает её несвёрнутому белку, и белок снова связывается с калнексином. У человека есть и UGGT2 (Guay 2025).", "gn_q3_gls": "Глюкозидазы I и II", "g_q3_gls": "После переноса Glc₃Man₉GlcNAc₂ на белок глюкозидаза I отщепляет крайнюю α1,2-глюкозу, а глюкозидаза II — две оставшиеся α1,3-глюкозы. Гликан с одной глюкозой связывают калнексин и кальретикулин; снятие последней глюкозы освобождает белок от лектина (Hebert 1995). Ингибиторы глюкозидаз (кастаноспермин) нарушают цикл калнексина.", "gn_q3_edem": "EDEM1–EDEM3: отщепление маннозы и кифунензин", "g_q3_edem": "В современной модели первую маннозу (на ветви B, до Man₈B) отщепляет EDEM2 в комплексе с TXNDC11 (Ninagawa 2014, клетки HCT116 и DT40). Затем EDEM3 и EDEM1 отщепляют маннозы до формы Man₇ с открытой α1,6-маннозой на ветви C, которую узнаёт OS-9 (Guay 2025). Отщепление идёт медленнее цикла глюкозы и служит таймером пребывания белка в ЭПР. Кифунензин ингибирует α1,2-маннозидазы класса I: в клетках гепатомы он останавливал распад NHK (Liu 1999), а маннозидазу I аппарата Гольджи подавлял уже в малой концентрации (Elbein 1990). В модели он почти останавливает отщепление маннозы. Число отщеплённых остатков на схеме упрощено.", "gn_q3_os9": "OS-9 и XTP3-B", "g_q3_os9": "OS-9 и XTP3-B (ERLEC1) — лектины ЭПР с доменом MRH. Они узнают гликан с открытой α1,6-маннозой (Hosokawa 2009) и через адаптер SEL1L передают субстрат убиквитинлигазе HRD1 (Christianson 2008, клетки человека, субстрат NHK). У дрожжей такой сигнал создаёт Htm1, а декодирует Yos9 (Quan 2008). Белки частично заменяют друг друга.", "gn_q3_hrd1": "SEL1L–HRD1 и сниженное содержание HRD1", "g_q3_hrd1": "HRD1 (SYVN1) — мембранная убиквитинлигаза ЭПР с RING-доменом. По структурным данным для дрожжевого белка Hrd1 образует в мембране канал, через который субстрат из просвета ЭПР переходит в цитозоль (Schoebel 2017). SEL1L связывает HRD1 с лектинами OS-9 и XTP3-B. Для распада NHK в клетках человека нужны и HRD1, и SEL1L (Christianson 2008). Вариант «HRD1 снижен» в модели означает подавление экспрессии HRD1: ретротранслокация и убиквитинирование почти не идут, и белок остаётся в ЭПР без убиквитина.", "gn_q3_p97": "p97 (VCP) и CB-5083", "g_q3_p97": "p97 (VCP; у дрожжей Cdc48) — гексамерная ATPаза AAA+. Вместе с кофакторами UFD1 и NPL4 она связывает убиквитиновую цепь и протягивает белок через центральную пору, извлекая его из мембраны ЭПР (Bodnar 2017, реконструкция с дрожжевыми белками). CB-5083 ингибирует p97: в опухолевых клетках накапливаются полиубиквитинированные белки и задерживаются субстраты ERAD (Anderson 2015). При продолжительном действии он вызывает выраженный стресс ЭПР. В модели CB-5083 почти останавливает извлечение, и белок остаётся с гликаном и убиквитином.", "gn_q3_ngly1": "NGLY1 — N-гликаназа цитозоля", "g_q3_ngly1": "NGLY1 отщепляет N-гликан от белка, уже выведенного в цитозоль; остаток Asn при этом превращается в Asp. Белок без гликана движется в геле быстрее, примерно как после обработки Endo H. Мутации NGLY1 у человека вызывают дефицит NGLY1 — врождённое нарушение, при котором у больных отмечали задержку развития, нарушения движений, гипотонию и сниженное слёзоотделение (Enns 2014).", "gn_q3_prot": "26S-протеасома и бортезомиб", "g_q3_prot": "Субстраты ERAD разрушает в цитозоле та же 26S-протеасома, что и белки цитозоля (вопрос 2). Бортезомиб ингибирует прежде всего химотрипсиноподобный центр β5. Субстраты ERAD при ингибировании протеасомы накапливаются в полиубиквитинированной форме (для CFTR — Ward 1995), а выведенные в цитозоль молекулы — уже без гликана (тяжёлые цепи MHC I при US11 — Wiertz 1996). В модели NHK при бортезомибе накапливается в цитозоле без гликана; ингибирование неполное, поэтому часть белка всё же разрушается.", "gn_q3_golgi": "Аппарат Гольджи и устойчивость к Endo H", "g_q3_golgi": "Свёрнутый белок выходит из ЭПР в аппарат Гольджи. В medial-Гольджи маннозидаза II и N-ацетилглюкозаминилтрансферазы достраивают высокоманнозный гликан до комплексного. Endo H отщепляет высокоманнозные и часть гибридных гликанов, но не комплексные, поэтому устойчивость к Endo H показывает, что белок прошёл medial-Гольджи. Чувствительный к Endo H белок может находиться в ЭПР или в cis-Гольджи.", "gn_q3_endoh": "Метод: импульсная метка, прослеживание и Endo H", "g_q3_endoh": "Клетки коротко (минуты) инкубируют с мечеными ³⁵S-метионином и ³⁵S-цистеином — это импульс. Затем добавляют избыток немеченых аминокислот и отбирают пробы через разное время — это прослеживание. Из клеток и среды осаждают белок антителами, делят пробу пополам, одну половину обрабатывают Endo H и разделяют обе электрофорезом. Метка видна только у молекул, синтезированных во время импульса, поэтому прослеживается одна когорта. Убывание полосы в клетках без её появления в среде означает разрушение. Ограничения: метод показывает судьбу всей когорты, а не отдельной молекулы, и не различает ЭПР и cis-Гольджи. Гель на экране рассчитан моделью.", "s4_lbl_cyto": "цитоплазма", "s4_lbl_nuc": "ядро", "s4b_pipe_t": "Этапы аутофагии по порядку (щелчок по этапу — справка)", "s4_st0a": "ULK1", "s4_st0b": "инициация", "s4_st1a": "VPS34", "s4_st1b": "PI3P", "s4_st2a": "WIPI2", "s4_st2b": "ATG16L1", "s4_st3a": "ATG7·ATG3", "s4_st3b": "LC3-II", "s4_st4a": "мембрана", "s4_st4b": "замыкание", "s4_st5a": "STX17", "s4_st5b": "слияние", "s4_st6a": "V-ATPase", "s4_st6b": "закисление", "s4_st7a": "катепсины", "s4_st7b": "расщепление", "s4_leg_ap": "аутофагосома", "s4_leg_al": "аутолизосома", "s4b_starve": "Среда без аминокислот (2 ч до измерения)", "s4_bafview": "Вторая чашка: + бафиломицин A1 за 2 ч до измерения", "s4_dish1": "Чашка без бафиломицина", "s4_dish2": "Вторая чашка: + бафиломицин", "s4_med_st": "2 ч без аминокислот", "s4_med_fed": "2 ч в полной среде", "s4_r_ap": "аутофагосомы (содержание, усл. ед.)", "s4_r_al": "аутолизосомы (содержание, усл. ед.)", "s4_r_ii": "LC3-II (усл. ед.)", "s4_r_d": "скорость расщепления содержимого (усл. ед. в час)", "s4_r_dii": "Прибавка LC3-II во второй чашке", "s4_r_dii_s": "LC3-II (+бафиломицин) − LC3-II (без бафиломицина), измерено одновременно", "s4b_plotcap": "Чашка без бафиломицина, 2 ч после смены среды; пунктир — LC3-II во второй чашке. Учебная модель, относительные величины.", "s4b_l_ap": "аутофагосомы", "s4b_l_al": "аутолизосомы", "s4b_l_d": "скорость расщепления", "s4b_l_ii": "LC3-II", "s4b_l_ii2": "LC3-II, вторая чашка", "s4b_leg_al": "аутолизосома, кислая среда", "s4b_leg_al0": "аутолизосома без кислой среды (бафиломицин)", "s4b_c_fed": "Полная среда. Аутофагия идёт на базальном уровне: аутофагосом и аутолизосом немного, содержимое аутолизосом расщепляется катепсинами.", "s4b_c_fed_z": "Базальная аутофагия постоянно обновляет часть белков и органелл цитоплазмы; в полной среде её скорость невелика.", "s4b_c_st": "Среда без аминокислот, 2 ч. Образование аутофагосом усилено; они сливаются с лизосомами, и содержимое аутолизосом расщепляется быстрее, чем в полной среде.", "s4b_c_st_z": "При отсутствии аминокислот в среде аутофагическое расщепление белков становится их внутренним источником.", "s4b_c_fed_baf": "Вторая чашка: полная среда, бафиломицин A1 добавлен за 2 ч до измерения. Без кислой среды содержимое аутолизосом не расщепляется, аутолизосомы накапливаются, и LC3-II больше на {d} усл. ед., чем в чашке без бафиломицина.", "s4b_c_fed_baf_z": "Прибавка LC3-II в полной среде отражает оборот LC3-II при базальной аутофагии; она меньше, чем без аминокислот, но не равна нулю.", "s4b_c_st_baf": "Вторая чашка: 2 ч без аминокислот, бафиломицин A1 добавлен за 2 ч до измерения. Аутофагосомы продолжают образовываться и сливаться, но содержимое аутолизосом не расщепляется. LC3-II больше на {d} усл. ед., чем в чашке без бафиломицина.", "s4b_c_st_baf_z": "Прибавка LC3-II во второй чашке показывает, сколько LC3-II за это время было бы расщеплено. В этой модели образование аутофагосом от бафиломицина не зависит; в клетках бафиломицин может изменять и образование аутофагосом, и их слияние с лизосомами.", "s4b_take": "Крупный материал, который не может разрушить протеасома (вопросы 2 и 3), доставляется в лизосому аутофагией. Аутофагический поток — это доставка материала в лизосомы и его расщепление за единицу времени, а не число аутофагосом. Без аминокислот образование аутофагосом усиливается, и при сохранённом слиянии и расщеплении поток растёт. Чтобы его оценить, сравнивают две чашки, измеренные одновременно: с бафиломицином и без него. В учебной модели прибавка LC3-II во второй чашке равна количеству LC3-II, которое было бы расщеплено за время действия препарата; в клетках бафиломицин может менять и образование аутофагосом, поэтому прибавка — оценка потока, а не его прямая мера.", "s4a_bl_t": "Нарушенный этап", "s4_bl_none": "нет", "s4_bl_ulk": "MRT68921 (ULK1)", "s4_bl_vps": "SAR405 (VPS34)", "s4_bl_atg7": "клетки ATG7⁻/⁻", "s4_bl_stx": "siRNA к STX17", "s4_bl_cq": "хлорохин", "s4_bl_baf": "бафиломицин A1", "s4_bl_prot": "E64d + пепстатин A", "s4a_mys": "Загадка: нарушенный этап скрыт", "s4a_blk": "Нарушенный этап отмечен крестом: {b}", "s4a_blk_x": "Неизвестный блок: этап скрыт", "s4a_y": "жёлтая точка — аутофагосома: GFP + mCherry", "s4a_r": "красная точка — кислая аутолизосома: GFP гаснет", "s4a_y_baf": "жёлтые точки: аутофагосомы и аутолизосомы без кислой среды", "s4a_r_baf": "красных точек нет: без кислой среды GFP не гаснет", "s4a_ny": "жёлтые точки", "s4a_nr": "красные точки", "s4a_r_long": "распад долгоживущих белков за 2 ч, % от меченых (чашка без бафиломицина)", "s4a_blot_t": "Вестерн-блот: LC3 и p62 в двух чашках", "s4a_rec": "Снять блот ± бафиломицин", "s4a_blot_note": "−Б и +Б — образцы из двух чашек, измеренные одновременно; во вторую чашку бафиломицин A1 добавлен за 2 ч до измерения. Интенсивность полос рассчитана по учебной модели, числа условны.", "s4a_lane_none": "нет", "s4a_lane_ulk": "MRT", "s4a_lane_vps": "SAR", "s4a_lane_atg7": "ATG7⁻/⁻", "s4a_lane_stx": "STX17↓", "s4a_lane_cq": "хлорохин", "s4a_lane_baf": "баф.", "s4a_lane_prot": "E64d+P", "s4a_lane_x": "X", "s4a_x": "неизвестный блок X", "s4a_key": "{b} · {m}: LC3-II {a} без бафиломицина и {c} с бафиломицином; прибавка {d}", "s4a_c_none_fed": "Полная среда, блока нет. Аутофагия идёт на базальном уровне: жёлтых и красных точек немного, LC3-II низкий, содержимое аутолизосом расщепляется.", "s4a_c_none_fed_z": "Это исходный уровень для сравнения: блок любого этапа сравнивают с клетками без блока в той же среде.", "s4a_c_none": "Без аминокислот, блока нет. Аутофагосомы (жёлтые точки) образуются и сливаются с лизосомами; в кислых аутолизосомах GFP гаснет (красные точки), и содержимое расщепляется.", "s4a_c_none_z": "Все этапы конвейера работают: число точек отражает равновесие между образованием, слиянием и расщеплением, а не одну скорость.", "s4a_c_init": "{b}: инициация подавлена. Аутофагосом образуется мало, поэтому жёлтых и красных точек немного, а LC3-II ниже, чем в клетках без блока в той же среде.", "s4a_c_init_z": "При блоке инициации и LC3-II, и прибавка LC3-II во второй чашке малы. По этим показателям ингибиторы ULK1 и VPS34 не различаются: оба действуют до появления LC3-II на мембране.", "s4a_c_atg7": "Клетки ATG7⁻/⁻: LC3 не присоединяется к фосфатидилэтаноламину. Полосы LC3-II нет, LC3 остаётся в форме LC3-I, флуоресценция репортёра распределена по цитоплазме равномерно, и точек нет.", "s4a_c_atg7_z": "ATG7 необходим для превращения LC3-I в LC3-II и для канонического образования аутофагосом (у мышей без Atg7 — Komatsu 2005). Без ATG7 канонической аутофагии почти нет, и бафиломицину нечего накапливать.", "s4a_c_fus": "{b}: слияние аутофагосом с лизосомами нарушено. Жёлтых точек больше, чем в клетках без блока, и LC3-II выше, хотя расщепление содержимого не усилено.", "s4a_c_fus_z": "Накопление аутофагосом и высокий LC3-II не означают усиленной аутофагии: здесь они возникают из-за задержки на этапе слияния. Хлорохин нарушает прежде всего слияние, а не закисление (Mauthe 2018); снижение содержания STX17 вызывает накопление аутофагосом (Itakura 2012).", "s4a_c_baf": "Бафиломицин A1 добавлен в момент смены среды. V-ATPase подавлена, кислой среды нет: GFP не гаснет, все точки жёлтые, содержимое аутолизосом не расщепляется, LC3-II накапливается.", "s4a_c_baf_z": "В модели бафиломицин нарушает только закисление; в клетках он может нарушать и слияние (в жировом теле дрозофилы — через SERCA, Mauvezin 2015). Поэтому его используют короткое время и только как часть сравнения двух чашек.", "s4a_c_prot": "E64d и пепстатин A подавляют лизосомные протеазы. Слияние и закисление сохраняются: красных точек становится больше, LC3-II накапливается, но содержимое аутолизосом не расщепляется.", "s4a_c_prot_z": "Много красных точек означает, что слияние и закисление идут; расщепление по этому признаку не оценить. Его оценивают по прибавке LC3-II во второй чашке или по распаду долгоживущих белков.", "s4a_c_b_big": "Вторая чашка: бафиломицин A1 добавлен за 2 ч до измерения. Красных точек нет: без кислой среды GFP не гаснет. LC3-II больше на {d} усл. ед., чем в чашке без бафиломицина.", "s4a_c_b_big_z": "В этой модели прибавка LC3-II равна количеству LC3-II, которое за 2 ч было бы расщеплено в чашке без бафиломицина. В клетках к ней может добавляться LC3-II новых аутофагосом, образовавшихся под действием самого бафиломицина (Klionsky 2021).", "s4a_c_b_small": "Вторая чашка: бафиломицин A1 добавлен за 2 ч до измерения, но прибавка LC3-II мала ({d} усл. ед.): расщепление в этих клетках уже нарушено, и бафиломицину почти нечего блокировать.", "s4a_c_b_small_z": "Высокий LC3-II без прибавки во второй чашке указывает на блок после слияния — закисления или протеаз, — а не на усиленную аутофагию.", "s4a_c_b_atg7": "Вторая чашка с клетками ATG7⁻/⁻: LC3-II нет ни без бафиломицина, ни с ним, поэтому и прибавки нет.", "s4a_c_b_atg7_z": "Прибавка LC3-II во второй чашке измеряет оборот LC3-II; если LC3-II не образуется, этот показатель неприменим, и поток оценивают иначе (например, по распаду долгоживущих белков).", "s4a_c_baf_same": "Бафиломицин A1 уже есть в обеих чашках: вторая чашка не отличается от первой, прибавки LC3-II нет.", "s4a_c_baf_same_z": "Повторное добавление того же блока не увеличивает разницу: заблокированный этап уже заблокирован в обеих чашках.", "s4a_c_mys": "Нарушенный этап скрыт. Сравните точки тандемного репортёра, LC3-II в двух чашках и распад долгоживущих белков с клетками без блока; затем назовите этап.", "s4a_c_mys_z": "Ни один показатель сам по себе этап не определяет: блок находят по сочетанию числа и цвета точек, LC3-II и его прибавки во второй чашке.", "s4a_take": "Нарушенный этап аутофагии определяют по сочетанию показателей. При блоке инициации (ULK1, VPS34) LC3-II и его прибавка во второй чашке малы. Без ATG7 нет LC3-II. При нарушении слияния накапливаются жёлтые точки, а прибавка LC3-II не выше, чем в клетках без блока. При блоке протеаз накапливаются красные точки, а прибавки почти нет. Много точек и высокий LC3-II не означают усиления аутофагии: так выглядит и задержка на любом позднем этапе. Поэтому поток оценивают по разнице между чашками с бафиломицином и без него или по распаду долгоживущих белков.", "p4b_1_q": "Клетки находятся в полной среде. Среду заменяют средой без аминокислот; измерение через 2 ч. Как изменится скорость расщепления содержимого аутолизосом?", "p4b_1_o1": "Увеличится", "p4b_1_o2": "Уменьшится", "p4b_1_o3": "Не изменится", "p4b_1_e": "Без аминокислот активность mTORC1 снижается, и ULK1 перестаёт фосфорилироваться по S758 (у человека); в модели образование аутофагосом усиливается в 4 раза (учебное значение). Слияние и расщепление не нарушены, поэтому через 2 ч скорость расщепления выросла примерно с 0,25 до 0,8 усл. ед. в час.", "p4b_1_w2": "Расщепление уменьшилось бы при нарушении закисления или протеаз. Смена среды эти этапы не блокирует, а образование аутофагосом при ней усиливается.", "p4b_1_w3": "Скорость расщепления определяется тем, сколько материала доставляется в лизосомы. Без аминокислот доставка возрастает, поэтому прежней скорость не останется.", "p4b_2_q": "Клетки 2 ч находятся в среде без аминокислот. Во вторую такую же чашку за 2 ч до измерения добавили бафиломицин A1. Как будет отличаться содержание LC3-II во второй чашке от чашки без бафиломицина?", "p4b_2_o1": "Будет выше", "p4b_2_o2": "Будет ниже", "p4b_2_o3": "Будет таким же", "p4b_2_e": "Бафиломицин подавляет V-ATPase, и среда в аутолизосомах перестаёт быть кислой. Катепсины не расщепляют содержимое, и LC3-II на внутренней мембране аутолизосом накапливается: во второй чашке его больше на 0,53 усл. ед.", "p4b_2_w2": "Бафиломицин не мешает присоединению LC3 к мембране: LC3-II продолжает образоваться, но перестаёт разрушаться, поэтому его содержание не падает.", "p4b_2_w3": "Одинаковое содержание означало бы, что за 2 ч LC3-II не расщеплялся бы и без бафиломицина. Без аминокислот поток идёт, поэтому блок расщепления даёт прибавку.", "p4b_3_q": "Клетки 2 ч находятся в полной среде; во вторую чашку за 2 ч до измерения добавили бафиломицин A1. Без аминокислот прибавка LC3-II составляла 0,53 усл. ед. Какой будет прибавка LC3-II в полной среде?", "p4b_3_o1": "Меньше, но не нулевая", "p4b_3_o2": "Нулевая", "p4b_3_o3": "Больше, чем без аминокислот", "p4b_3_e": "В полной среде аутофагия не прекращается, а идёт на базальном уровне. Аутофагосом образуется меньше, поэтому и LC3-II расщепляется меньше: прибавка во второй чашке — 0,25 усл. ед. против 0,53 без аминокислот.", "p4b_3_w2": "Нулевая прибавка означала бы полное отсутствие аутофагии. Базальная аутофагия идёт и в полной среде, поэтому бафиломицин и здесь задерживает часть LC3-II.", "p4b_3_w3": "Прибавка растёт вместе со скоростью доставки материала в лизосомы. В полной среде образование аутофагосом слабее, чем без аминокислот, поэтому прибавка не может быть больше.", "p4b_4_q": "Клетки 2 ч находятся в среде без аминокислот. Во второй чашке бафиломицин A1 добавлен за 2 ч до измерения, и аутолизосом в ней больше, чем в чашке без бафиломицина. Как изменилась скорость расщепления их содержимого во второй чашке?", "p4b_4_o1": "Выросла вместе с числом аутолизосом", "p4b_4_o2": "Упала почти до нуля", "p4b_4_o3": "Осталась такой же, как без бафиломицина", "p4b_4_e": "Аутолизосомы накапливаются именно потому, что их содержимое не расщепляется: без кислой среды катепсины не работают. Содержание структур — это пул, а не скорость; во второй чашке скорость расщепления близка к нулю.", "p4b_4_w1": "Число аутолизосом выросло из-за того, что они не освобождаются: каждая из них перестала расщеплять содержимое. Больше структур — не значит больше расщепления.", "p4b_4_w3": "Если бы расщепление шло как прежде, аутолизосомы не накапливались бы. Их накопление при неизменном образовании как раз показывает остановку расщепления.", "p4a_1_q": "Клетки 2 ч находятся в среде без аминокислот. Вместо клеток дикого типа берут клетки ATG7⁻/⁻ и снимают блот: чашка без бафиломицина и вторая чашка с бафиломицином A1 (2 ч). Что будет в строке LC3-II?", "p4a_1_o1": "Полосы нет в обеих чашках", "p4a_1_o2": "Полоса есть, и с бафиломицином она сильнее", "p4a_1_o3": "Полоса есть, но бафиломицин её не усиливает", "p4a_1_e": "ATG7 — E1-подобный фермент, без которого LC3 не присоединяется к фосфатидилэтаноламину. LC3-II не образуется, LC3 остаётся в форме LC3-I, и бафиломицину нечего накапливать.", "p4a_1_w2": "Так выглядели бы клетки дикого типа с идущим потоком. Без ATG7 LC3-II не образуется, и прибавке во второй чашке взяться неоткуда.", "p4a_1_w3": "Полоса без прибавки характерна для блока протеаз или закисления: LC3-II есть, но уже не расщепляется. Без ATG7 нет самого LC3-II.", "p4a_2_q": "Клетки с тандемным репортёром mCherry-GFP-LC3 находятся 2 ч в среде без аминокислот. В момент смены среды добавляют E64d и пепстатин A — ингибиторы лизосомных протеаз. Какие точки будут накапливаться по сравнению с клетками без ингибиторов?", "p4a_2_o1": "Жёлтые: аутофагосомы перестают сливаться с лизосомами", "p4a_2_o2": "Красные: аутолизосомы кислые, но содержимое не расщепляется", "p4a_2_o3": "Никакие: число и цвет точек не изменятся", "p4a_2_e": "Ингибиторы протеаз не мешают ни слиянию, ни закислению: в кислых аутолизосомах GFP гаснет, и они видны как красные точки. Содержимое не расщепляется, поэтому аутолизосомы не исчезают, и красных точек становится больше.", "p4a_2_w1": "Жёлтые точки накапливаются при нарушении слияния (например, при снижении содержания STX17). Ингибиторы протеаз действуют после слияния.", "p4a_2_w3": "Без протеаз аутолизосомы перестают освобождаться от содержимого, а новые продолжают поступать: их число не может остаться прежним.", "p4a_3_q": "Клетки из предыдущего шага (без аминокислот, E64d и пепстатин A) используют для блота: чашка без бафиломицина и вторая чашка с бафиломицином A1 (2 ч). В клетках без ингибиторов прибавка LC3-II составляла 0,53 усл. ед. Какой будет прибавка здесь?", "p4a_3_o1": "Почти нулевой", "p4a_3_o2": "Больше 0,53", "p4a_3_o3": "Такой же, около 0,53", "p4a_3_e": "Расщепление LC3-II уже остановлено ингибиторами протеаз в обеих чашках. Бафиломицин блокирует тот же итог — расщепление в аутолизосоме, — поэтому дополнительного накопления LC3-II почти нет.", "p4a_3_w2": "Высокий LC3-II в чашке без бафиломицина возник из-за блока протеаз, а не из-за усиления аутофагии. Второй блок того же итога разницы не увеличивает.", "p4a_3_w3": "Прибавка 0,53 отражает LC3-II, расщеплённый за 2 ч в клетках без ингибиторов. Здесь он не расщепляется и без бафиломицина, поэтому прибавка не сохранится.", "p4a_4_q": "Клетки с тандемным репортёром находятся 2 ч в среде без аминокислот. Содержание STX17 в них снижено с помощью siRNA. Какие точки будут преобладать?", "p4a_4_o1": "Красные: аутолизосом станет больше", "p4a_4_o2": "Точек почти не будет", "p4a_4_o3": "Жёлтые: аутофагосомы накапливаются", "p4a_4_e": "STX17 на наружной мембране замкнутой аутофагосомы вместе с SNAP29 и VAMP8 обеспечивает слияние с лизосомой (Itakura 2012). При его недостатке аутофагосомы продолжают образовываться, но сливаются медленно: накапливаются нейтральные структуры, где светятся и GFP, и mCherry.", "p4a_4_w1": "Красные точки — кислые аутолизосомы. Чтобы они образовались, нужно слияние, а оно как раз нарушено.", "p4a_4_w2": "Точек почти нет при блоке ранних этапов или без ATG7. STX17 действует после образования аутофагосом, и LC3-II на их мембранах сохраняется.", "p4a_5_q": "На блоте уже есть дорожки клеток без блока (2 ч без аминокислот). В момент смены среды к таким же клеткам добавляют MRT68921 — ингибитор ULK1. Каким будет LC3-II в чашке без бафиломицина и его прибавка во второй чашке?", "p4a_5_o1": "LC3-II выше, и прибавка больше", "p4a_5_o2": "LC3-II ниже, и прибавка меньше", "p4a_5_o3": "LC3-II выше, а прибавки нет", "p4a_5_e": "MRT68921 подавляет киназу ULK1, и аутофагосом образуется мало (в работе Petherick 2015 при этом накапливались незавершённые ранние структуры; в модели они не учитываются). LC3-II в модели — 0,12 против 0,66 усл. ед., прибавка — 0,22 против 0,53: в лизосомы доставляется меньше материала.", "p4a_5_w1": "Рост LC3-II и прибавки означал бы усиление образования аутофагосом. Ингибитор ULK1 действует на первый этап и образование ослабляет.", "p4a_5_w3": "Высокий LC3-II без прибавки — признак блока расщепления в аутолизосоме. ULK1 работает раньше: при её подавлении LC3-II мало, а не много.", "p4a_6_q": "Неизвестный блок X, 2 ч без аминокислот. Рассмотрите микроскоп, показатели и дорожки X на блоте. Какой этап, скорее всего, нарушен?", "p4a_6_o1": "Образование аутофагосом", "p4a_6_o2": "Слияние аутофагосом с лизосомами", "p4a_6_o3": "Расщепление в кислой аутолизосоме", "p4a_6_e": "Преобладают жёлтые точки, LC3-II выше, чем в клетках без блока, а прибавка во второй чашке меньше: аутофагосомы образуются, но медленно сливаются. Блок X — хлорохин; в клетках он нарушает прежде всего слияние, а не закисление (Mauthe 2018). Тот же признак дало бы снижение содержания STX17.", "p4a_6_w1": "При блоке образования точек и LC3-II было бы меньше, чем в клетках без блока, а здесь их больше.", "p4a_6_w3": "При блоке расщепления в кислой аутолизосоме накапливались бы красные точки, а прибавки LC3-II во второй чашке почти не было бы.", "gn_q4_ulk1": "ULK1 и инициация", "g_q4_ulk1": "Комплекс ULK1 (ULK1, ATG13, FIP200, ATG101) начинает образование изолирующей мембраны (Zachari 2017). mTORC1 подавляет его, фосфорилируя ULK1 по S758 у человека (S757 у мыши; Kim 2011). AMPK фосфорилирует другие сайты ULK1; по классической схеме это стимулирует аутофагию, а в новых работах при дефиците энергии — скорее сдерживает её (Park 2023); эффект зависит от условий. Ингибитор MRT68921 подавляет ULK1 и ULK2; в клетках накапливаются незавершённые ранние структуры, а аутофагия блокируется (Petherick 2015).", "gn_q4_vps34": "VPS34 и PI3P", "g_q4_vps34": "Комплекс фосфатидилинозитол-3-киназы класса III (VPS34, VPS15, BECN1, ATG14) образует на изолирующей мембране фосфатидилинозитол-3-фосфат (PI3P). ULK1 фосфорилирует BECN1 по S15 у человека (S14 у мыши) и усиливает активность комплекса с ATG14 (Russell 2013). SAR405 — селективный ингибитор VPS34: он подавляет аутофагию, но нарушает и работу поздних эндосом и лизосом (Ronan 2014), поэтому вывод «блок только инициации» при нём упрощён. Без ATG14 эти белки входят и в комплексы эндоцитарного пути.", "gn_q4_wipi2": "WIPI2 и ATG16L1", "g_q4_wipi2": "WIPI2 связывает PI3P на изолирующей мембране и привлекает комплекс ATG12–ATG5–ATG16L1, который ускоряет присоединение LC3 к мембране (Dooley 2014). Так образование PI3P связано с появлением LC3-II именно на этой мембране.", "gn_q4_atg7": "ATG7, ATG3 и LC3-II", "g_q4_atg7": "Протеаза ATG4 отщепляет C-концевой фрагмент LC3 и открывает остаток глицина (LC3-I). ATG7 (E1-подобный фермент) и ATG3 (E2-подобный) присоединяют LC3-I к фосфатидилэтаноламину; комплекс ATG12–ATG5–ATG16L1 ускоряет перенос. Получается LC3-II, связанный с мембраной; на блоте он движется быстрее LC3-I. У мышей без Atg7 нарушены конъюгация и образование аутофагосом, а в клетках накапливаются убиквитин-положительные агрегаты (Komatsu 2005). При неканоническом липидировании LC3 присоединяется и к одинарным мембранам, поэтому LC3-II не всегда означает аутофагосому (Durgan 2021).", "gn_q4_close": "Рост и замыкание мембраны", "g_q4_close": "Изолирующая мембрана растёт и замыкается вокруг груза, образуя аутофагосому с двойной мембраной. В экспериментах in vitro белок ATG2 переносил фосфолипиды между мембранами, а ATG9 перемещал их между слоями мембраны (обзор Nakatogawa 2020). В модели вопроса этот этап не блокируется отдельно.", "gn_q4_stx17": "STX17 и слияние", "g_q4_stx17": "STX17 находится на наружной мембране замкнутой аутофагосомы и вместе с SNAP29 и лизосомным VAMP8 образует комплекс SNARE, участвующий в слиянии (Itakura 2012). При снижении содержания STX17 аутофагосомы накапливаются, а их содержимое не расщепляется. В модели siRNA к STX17 замедляет слияние, но не останавливает его полностью: описан и STX17-независимый путь слияния с участием YKT6 (Matsui 2018). Хлорохин в клетках нарушает прежде всего слияние, а не закисление (Mauthe 2018).", "gn_q4_vatp": "V-ATPase, закисление и бафиломицин A1", "g_q4_vatp": "V-ATPase переносит протоны в просвет лизосомы и поддерживает кислую среду, нужную катепсинам. Бафиломицин A1 ингибирует V-ATPase: среда перестаёт быть кислой, флуоресценция GFP в тандемном репортёре не гаснет, расщепление останавливается. В жировом теле дрозофилы бафиломицин нарушал и слияние — через SERCA, а не через pH (Mauvezin 2015). В модели слияние при бафиломицине сохраняется; это упрощение. Препарат дают на короткое время, обычно не дольше нескольких часов (Klionsky 2021).", "gn_q4_cath": "Катепсины и их ингибиторы", "g_q4_cath": "Лизосомные протеазы (катепсины B, D, L и другие) расщепляют белки груза и внутреннюю мембрану аутолизосомы вместе с LC3-II. E64d ингибирует цистеиновые катепсины, пепстатин A — аспартатный катепсин D. Слияние и закисление при этом сохраняются: в тандемном репортёре накапливаются красные точки, а LC3-II не расщепляется.", "gn_q4_ap": "Аутофагосома", "g_q4_ap": "Замкнутая структура с двойной мембраной, несущей LC3-II. Среда в ней некислая, поэтому в тандемном репортёре светятся и GFP, и mCherry: точка жёлтая. Число аутофагосом — это содержание (пул): оно растёт и при усилении образования, и при задержке слияния.", "gn_q4_al": "Аутолизосома", "g_q4_al": "Структура, образующаяся после слияния аутофагосомы с лизосомой. В кислой среде катепсины расщепляют груз и внутреннюю мембрану; LC3-II на ней разрушается. Число аутолизосом растёт и при усиленной доставке, и при нарушенном расщеплении, поэтому скорость по нему не определить.", "gn_q4_tandem": "Тандемный репортёр mCherry-GFP-LC3", "g_q4_tandem": "LC3, слитый с двумя флуоресцентными белками. В нейтральной аутофагосоме светятся оба (жёлтая точка); в кислой аутолизосоме GFP гаснет, а mCherry сохраняется (красная точка; Kimura 2007). Доля красных точек говорит о слиянии и закислении, но не о расщеплении; отношение красных к жёлтым не пропорционально потоку. Для количественной оценки предложены другие репортёры, например GFP-LC3-RFP-LC3ΔG (Kaizuka 2016). Числа точек на схеме рассчитаны по учебной модели.", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 минут, на продвинутый — 8–10 минут. В режиме «Сценарий» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку.", "teacher_2": "Вопрос 1. В базовой модели скорости условны: J-белок ускоряет гидролиз ATP в 100 раз, NEF ускоряет выход ADP в 60 раз; в экспериментах с DnaK стимуляция гидролиза превышала 1000 раз (Laufen 1999), а BAG-1M ускорял выход ADP из Hsc70 до 900 раз (Gässler 2001). В продвинутой модели сворачивания люциферазы допущение «слишком быстрое освобождение непродуктивно» задаёт колоколообразную зависимость от количества BAG1; в экспериментах она зависела и от наличия фосфата (Gässler 2001). Hsc70 взят в избытке, без насыщения. Агрегаты в модели не растворяются, хотя Hsp70 с Hsp110 и J-белками классов A и B растворяет агрегаты in vitro (Rampelt 2012; Nillegoda 2015). Захват субстрата без ATP задан медленным и необратимым в пределах эксперимента — это допущение модели. Вопрос 2. Базовая модель — учебная: константы синтеза, убиквитинирования, деубиквитинирования и расщепления подобраны так, чтобы период полужизни белка с дегроном дикого типа был около 9 мин, а с заменами остатков дегрона — около 3 ч; бортезомиб оставляет 2 % активности протеасомы, и его действие рассчитывается во времени от исходного стационарного состояния. Продвинутая модель воспроизводит порядок событий после TNFα в клетках HeLa при циклогексимиде (Henkel 1993; Chen 1995): у дикого типа к 20 мин в модели остаётся около 1 % IκBα; точные сроки зависят от клеток и дозы. Препараты добавлены за 60 мин до TNFα; MLN4924, TAK-243 и бортезомиб оставляют по 1 % активности своей мишени. Общий сигнал убиквитиновых конъюгатов — условный показатель: при бортезомибе он растёт, при TAK-243 почти исчезает; его снижение при MLN4924 задано учебным коэффициентом. Доля освобождённого NF-κB принята равной доле разрушенного IκBα. «Линия X без βTrCP» — учебный пример; у человека два паралога βTrCP. Вопрос 3. Модель — когорта меченых молекул с семью пулами (цикл калнексина, свёрнутый белок в ЭПР, Гольджи, среда, Man₇ и HRD1, цитозоль, разрушенный белок). Константы скоростей учебные: период полужизни NHK в клетках около 1,5 ч, белок дикого типа большей частью секретируется за 1–2 ч. Об отщеплении маннозы, узнавании OS-9 и роли HRD1–SEL1L см. Liu 1999, Christianson 2008, Ninagawa 2014. У α1-антитрипсина три N-гликана, на схеме показан один; цикл глюкозилирования, отщепление маннозы и связывание лектинов сведены к переходам между пулами. На геле полосы рассчитаны моделью; дегликозилированный белок и белок после Endo H показаны с одинаковой подвижностью, хотя Endo H оставляет на Asn один GlcNAc. Кифунензин в модели почти останавливает отщепление маннозы в ЭПР и образование комплексных гликанов в Гольджи; убиквитинированный белок — условный показатель. Вопрос 4: модель — линейный конвейер «образование → аутофагосомы → слияние → аутолизосомы → расщепление» с учебными константами; повторная активация mTORC1 и восстановление лизосом здесь не учитываются (они показаны в семинаре о mTORC1). Чашки начинают с равновесия в полной среде; препарат добавляют в момент смены среды, измерение через 2 ч. Вторая чашка с бафиломицином — копия той же клетки, где бафиломицин действует последние 2 ч; обе читаются одновременно. В модели бафиломицин подавляет только закисление, слияние сохраняется (упрощение; Mauvezin 2015), поэтому прибавка LC3-II равна LC3-II, который был бы расщеплён за 2 ч. Ингибиторы ULK1 и VPS34 в модели дают одинаковые показатели; SAR405 действует и на эндосомы (Ronan 2014). Хлорохин и siRNA к STX17 замедляют слияние; без ATG7 LC3-II нет, а образование канонических аутофагосом почти прекращается (в модели — снижено в 10 раз, учебное значение). Распад долгоживущих белков: 2 % за 2 ч вне аутофагии плюс аутофагическая часть — учебные значения.", "teacher_3": "Уточнения к распространённым схемам приведены в справках по белкам и в «Объяснениях».", "src_01": "Rosenzweig R., Nillegoda N. B., Mayer M. P., Bukau B. The Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2019;20:665–680. doi:10.1038/s41580-019-0133-3", "src_02": "Wentink A., Rosenzweig R., Kampinga H., Bukau B. Mechanisms and regulation of the Hsp70 chaperone network. Nat Rev Mol Cell Biol. 2026;27:110–128. doi:10.1038/s41580-025-00890-9. Исправление авторов (Author Correction): Nat Rev Mol Cell Biol. 2026;27:875. doi:10.1038/s41580-026-01029-0", "src_03": "Laufen T., Mayer M. P., Beisel C. et al. Mechanism of regulation of hsp70 chaperones by DnaJ cochaperones. Proc Natl Acad Sci USA. 1999;96:5452–5457. doi:10.1073/pnas.96.10.5452", "src_04": "Kityk R., Kopp J., Mayer M. P. Molecular mechanism of J-domain-triggered ATP hydrolysis by Hsp70 chaperones. Mol Cell. 2018;69:227–237. doi:10.1016/j.molcel.2017.12.003", "src_05": "Szabo A., Langer T., Schröder H. et al. The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ, and GrpE. Proc Natl Acad Sci USA. 1994;91:10345–10349. doi:10.1073/pnas.91.22.10345", "src_06": "Gässler C. S., Wiederkehr T., Brehmer D., Bukau B., Mayer M. P. Bag-1M accelerates nucleotide release for human Hsc70 and Hsp70 and can act concentration-dependent as positive and negative cofactor. J Biol Chem. 2001;276:32538–32544. doi:10.1074/jbc.M105328200", "src_07": "O'Brien M. C., Flaherty K. M., McKay D. B. Lysine 71 of the chaperone protein Hsc70 is essential for ATP hydrolys function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- SVG: заготовки ---------- */
function defs(s){ return `<defs>
  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }
function move(id, dx, dy){ const e = $(id); if (e) e.style.transform = `translate(${dx}px,${dy}px)`; }
function PB(id, x, y){ return `<g class="pb fade" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="8.5"/><text x="${x}" y="${y + .5}">P</text></g>`; }
function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }
/* узел-прямоугольник: id группы, подпись, справка */
function BX(id, x, y, w, h, label, g, fs = 13){
  return `<g id="${id}" class="clickable" data-g="${g || ''}"><rect class="box" id="${id}_r" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="lbl" x="${x + w / 2}" y="${y + h / 2}" font-size="${fs}" font-weight="700">${label}</text></g>`;
}
function setBoxState(id, st){ setCls(id + '_r', st); }
function missing(id, on){ const g = $(id); if (g) g.classList.toggle('missing', !!on); }

function sliderHTML(id, k, val){ return `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O">${val} %</output></div><input type="range" id="${id}" min="0" max="100" value="${val}"></div>`; }

  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py собирает оба варианта) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 's11-355';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }
function poeUnits(K){
  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);
  }
  return units;
}
function poeIdx(i, K = cur){
  if (!POE_RND) return i;
  const n = SCENES[K].poe.length, keep = poeKeep(K); if (i >= n - keep) return i;
  const units = poeUnits(K), ord = poeShuffle(units.length, K + '/steps/' + POE_SEED);
  return [].concat(...ord.map(u => units[u]))[i];
}
function poeRender(){
  Object.keys(SCENES).forEach(k => { const b = $('poe' + k); b.hidden = true; b.innerHTML = ''; });
  const capOn = !$('capT') || $('capT').checked;
  document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !capOn);
  if (!POE.on) return;
  /* пока студенты думают, подпись и вывод скрыты: они могли бы подсказать ответ */
  if (!POE.shown){ $('capbox' + cur).hidden = true; $('take' + cur).parentElement.hidden = true; }
  const S = SCENES[cur], box = $('poe' + cur), steps = S.poe, si = poeIdx(POE.i), st = steps[si], P = `p${cur}_${si + 1}`;
  box.hidden = false;
  const letters = ['А', 'Б', 'В', 'Г'];
  let h = `<div class="k">${t('poe_step', { i: POE.i + 1, n: steps.length })}</div><div class="q">${t(P + '_q')}</div><div class="opts">`;
  const perm = poePerm(cur, si, st.n, st.ok);
  for (let d = 0; d < st.n; d++){
    const j = perm[d];
    let cls = 'opt';
    if (POE.pick === j) cls += ' picked';
    if (POE.shown && j === st.ok) cls += ' right';
    if (POE.shown && POE.pick === j && j !== st.ok) cls += ' wrongpick';
    h += `<button class="${cls}" data-j="${j}"${STUDENT && POE.shown ? ' disabled' : ''}><span class="L">${letters[d]}</span><span>${t(P + '_o' + (j + 1))}</span></button>`;
  }
  h += `</div>`;
  if (POE.shown && STUDENT && POE.pick != null && POE.pick !== st.ok) h += `<p class="ex wrongex"><b>${t('poe_your')}</b> ${t(P + '_w' + (POE.pick + 1))}</p>`;
  if (POE.shown) h += `<p class="ex"><b>${t('poe_ans')}</b> ${t(P + '_e')}</p>`;
  const last = POE.i === steps.length - 1, needPick = STUDENT && POE.pick == null;
  const done = Object.keys(POE.res).filter(k => k.startsWith(cur + ':')), right = done.filter(k => POE.res[k]).length;
  h += `<div class="nav">` + (POE.shown ? '' : `<button class="btn" id="poeShow"${needPick ? ' disabled' : ''}>${t('poe_show')}</button>`) +
    (POE.i > 0 ? `<button class="btn ghost" id="poePrev">${t('poe_prev')}</button>` : '') +
    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT && POE.shown ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>`) +
    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); });
  if (needPick && !POE.shown) box.querySelector('.nav').insertAdjacentHTML('beforeend', `<span class="small" style="align-self:center">${t('poe_pick_first')}</span>`);
  if ($('poeShow')) $('poeShow').onclick = () => { if (STUDENT && POE.pick == null) return; POE.shown = true;
    const key = cur + ':' + POE.i; if (!(key in POE.res)) POE.res[key] = POE.pick === st.ok; st.apply(); S.update(); poeRender(); };
  if ($('poePrev')) $('poePrev').onclick = () => { POE.i--; POE.pick = null; POE.shown = false; poeSetup(); };
  if ($('poeNext')) $('poeNext').onclick = () => { POE.i++; POE.pick = null; POE.shown = false; poeSetup(); };
  $('poeExit').onclick = () => { POE.on = false; poeRender(); };
  box.scrollIntoView({ block: 'nearest' });
}
function poeSetup(){ const st = SCENES[cur].poe[poeIdx(POE.i)]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

/* ---------- навигация ---------- */
let cur = '1b', qn = 1, lvl = 'b';
function show(){
  cur = qn + lvl;
  Object.keys(SCENES).forEach(k => { $('sc' + k).hidden = k !== cur; });
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.q === qn)));
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lvl)));
  $('qline').textContent = t('q' + qn);
  /* ссылки на страницу объяснений seminar-N-route.html: общая и к текущему вопросу (первый шаг его раздела).
     Адрес — ключ route_url, id шагов-входов разделов — ключ route_entries (через пробел); без route_url кнопок нет. */
  if (TEXTS.route_url){
    const ent = String(TEXTS.route_entries || '').split(/\s+/).filter(Boolean);
    $('routeAll').href = TEXTS.route_url + '#home';
    $('routeQ').hidden = !ent[qn - 1];
    if (ent[qn - 1]){ $('routeQ').href = TEXTS.route_url + '#' + ent[qn - 1]; $('routeQ').textContent = t('route_q') + ' ' + qn; }
  }
  POE.on = false; poeRender();
  SCENES[cur].update();
  fitStage();
}
/* возврат со страницы объяснений по ссылке seminar-N.html#q1…#q4 открывает нужный вопрос */
function fromHash(){ const s = urlState(); if (!s) return; if (s.q !== qn || s.l !== lvl){ qn = s.q; lvl = s.l; show(); } }
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;
  const top = sc.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--avail', Math.max(340, Math.floor(window.innerHeight - top - 10)) + 'px');
}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => navGo(+b.dataset.q, lvl));
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => navGo(qn, b.dataset.l));
  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); poeSetup(); };
  $('capT').onchange = () => { document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !$('capT').checked); if (POE.on) poeRender(); };
  $('legendBtn').onclick = () => { try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };
  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ navGo(+e.key, lvl); }
    if (e.key === 'b' || e.key === 'и'){ navGo(qn, lvl === 'b' ? 'a' : 'b'); } });
  $('srcList').innerHTML = Object.keys(TEXTS).filter(k => k.startsWith('src_')).sort().map(k => `<li>${TEXTS[k]}</li>`).join('');
  let last = performance.now();
  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));
}

/* ===== навигация (каркас 26.10.2026, из ревизии сайта 3.9): адрес вопроса и уровня, история, возврат, телефон,
   «↓ К выводу», клавиатура, переход между семинарами. Тексты — ключи to_take, zoom_hint, zoom_out, sn_* ===== */
/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;
   переход по истории браузера восстанавливает вопрос и уровень */
function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b' };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^level(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); qn = q; lvl = l; show(); syncUrl(push); }
window.addEventListener('popstate', fromHash);
/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;

/* =====================================================================
   Вопрос 1. ATP-зависимый цикл Hsp70 с J-доменным белком (JDP) и фактором обмена нуклеотидов (NEF)
   1b — базовый: цикл из двух состояний Hsp70 (ATP: SBD открыт; ADP: крышка закрыта, субстрат удерживается прочно).
        Учебные константы: гидролиз kh = 1 (без J-белка) или 100 (J-белок вместе с субстратом; в экспериментах с DnaK
        стимуляция больше чем в 1000 раз — Laufen 1999); выход ADP с последующим связыванием ATP kd = 3 (без NEF)
        или 180 (с NEF, ×60; BAG1 ускорял выход ADP до 900 раз — Gässler 2001). Стационарные доли состояний.
   1a — продвинутый: сворачивание люциферазы после теплового воздействия in vitro, кинетическая учебная модель:
        U — развёрнутая люцифераза (склонна к агрегации), B — в комплексе Hsc70·ADP, N — нативная, A — агрегаты.
        Захват = c · P_trap · U, P_trap = kh / (kh + koffT): субстрат «запирается», если гидролиз успевает до его ухода.
        Освобождение = kd · B; освобождённая молекула сворачивается с вероятностью f · ρ, ρ = krem / (krem + kd):
        допущение модели — при слишком быстром обмене нуклеотида субстрат освобождается раньше, чем его конформация
        изменилась (колоколообразная зависимость от NEF: Gässler 2001; Wentink 2026). Агрегаты в модели не растворяются.
   ===================================================================== */
const Q1 = {
  b: { kh0: 1, sJ: 100, kd0: 3, sN: 60 },
  a: { kagg: .08, ksp: .0015, c: 1.2, koffT: 50, kh0: 1, sJ: 100, kd0: .006, kH110: .35, kB: 2, krem: .25, f: .5, cADP: .05 }
};
/* базовый уровень: стационарный цикл */
function q1Cycle(j, nef){
  const P = Q1.b, kh = P.kh0 * (j ? P.sJ : 1), kd = P.kd0 * (nef ? P.sN : 1);
  const D = kh / (kh + kd), rate = kh * kd / (kh + kd), rate0 = P.kh0 * P.kd0 / (P.kh0 + P.kd0);
  return { kh, kd, D, rate: rate / rate0, hold: P.kd0 / kd, lim: kh < kd ? 'h' : 'd' };
}
/* продвинутый уровень: константы для набора компонентов */
function q1Rates(o){
  const P = Q1.a; let kh = 0, cap = 0, kd = 0;
  if (o.h !== 'none'){
    if (o.atp){
      kh = o.h === 'k71m' ? 0 : P.kh0 * (o.j === 'wt' ? P.sJ : 1);
      cap = P.c * kh / (kh + P.koffT);
      kd = P.kd0 + (o.nef === 'hsp110' ? P.kH110 : o.nef === 'bag1' ? P.kB * o.r : 0);
    } else { cap = P.cADP; kd = 0; }   // без ATP: медленное связывание в ADP-форме, освобождения нет
  }
  return { kh, cap, kd, rho: kd > 0 ? P.krem / (P.krem + kd) : 0 };
}
function q1Run(o, T = 60){
  const P = Q1.a, R = q1Rates(o), dt = .02; let U = 1, B = 0, N = 0, A = 0; const h = [[0, 0]];
  const F = { cap: 0, rel: 0, fold: 0, agg: 0, sp: 0 };   // сколько люциферазы прошло каждым путём (доли от всей, сумма по времени)
  const n = Math.round(T / dt);
  for (let i = 1; i <= n; i++){
    const rel = R.kd * B;
    const dU = -P.kagg * U - P.ksp * U - R.cap * U + rel * (1 - R.rho * P.f);
    const dN = P.ksp * U + rel * R.rho * P.f;
    const dB = R.cap * U - rel, dA = P.kagg * U;   // все производные — по состоянию начала шага: сумма долей сохраняется
    F.cap += R.cap * U * dt; F.rel += rel * (1 - R.rho * P.f) * dt; F.fold += rel * R.rho * P.f * dt; F.agg += dA * dt; F.sp += P.ksp * U * dt;
    U += dU * dt; B += dB * dt; N += dN * dt; A += dA * dt;
    if (i % 50 === 0) h.push([i * dt, N]);

}

        Модель (учебные константы, мин⁻¹): синтез ks; убиквитинирование kub (дегрон дикого типа) или kmut (замены остатков дегрона);
        деубиквитинирование kdub; расщепление полиубиквитинированной формы 26S-протеасомой kp; медленный распад
        другими путями kb. Без препарата — стационарное состояние; с бортезомибом — та же клетка, 60 мин после добавления
        (состояние считается во времени от исходного стационара, а не формулой стационара).
   2a — продвинутый: IκBα после TNFα в присутствии циклогексимида (клетки HeLa; Henkel 1993, Chen 1995, Palombella 1994).
        IKK фосфорилирует S32/S36 → SCF^βTrCP убиквитинирует фосфо-IκBα → 26S-протеасома. Препараты добавлены за 60 мин
        до TNFα. Отдельно считается общий пул Ub-конъюгатов всех белков (сигнал антител к убиквитину), × от контроля.
   ===================================================================== */
const Q2B = { ks: 1, kub: .08, kmut: .002, kdub: .03, kp: .6, kb: .002, bort: .02 };
function q2bSS(deg, kp){
  const P = Q2B, ku = deg ? P.kub : P.kmut;
  const S = P.ks / (ku + P.kb - ku * P.kdub / (P.kdub + kp)), U = ku * S / (P.kdub + kp);
  return { S, U };

/* T мин после добавления бортезомиба (или стационар без него); величины — × от клетки с дегроном без препарата */
function q2b(deg, bort, T = 60){
  const P = Q2B, ref = q2bSS(true, P.kp), ref0 = ref.S + ref.U, ku = deg ? P.kub : P.kmut, kp = bort ? P.kp * P.bort : P.kp;
  let { S, U } = q2bSS(deg, P.kp);

  const P = Q2B, dt = .005, half = (S + U) / 2;

  while (t < 5000){

function q2a(geno, drug){

/* =====================================================================
   Вопрос 3. N-гликановый контроль сворачивания в ЭПР и ERAD дефектных гликопротеинов
   Общая модель — когорта меченых молекул (импульсная метка в момент 0), время в часах.
   Пулы (доли когорты, сумма = 1 по построению):
     F — сворачивается в цикле калнексина/кальретикулина (Glc₁Man₉ ↔ Man₉, UGGT1);
     N — свёрнут, ещё в ЭПР (Man₉, без глюкозы), ждёт выхода;
     G — в аппарате Гольджи (после medial-Гольджи гликан комплексный, устойчив к Endo H);
     S — в среде (секретирован);
     E — маннозы отщеплены (Man₇, связан OS-9) и передан SEL1L–HRD1;
     R — выведен в цитозоль p97, гликан снят NGLY1, ждёт 26S-протеасому;
     D — разрушен.
   F → N (сворачивание, только дикий тип), F → E (отщепление маннозы), N → G → S, E → R → D.
   Учебные константы (1/ч) подобраны так, что у NHK период полужизни в клетках около 1,5 ч,
   а белок дикого типа большей частью секретируется за 1–2 ч. Это учебные значения, а не измерения.
   3b — базовый: белок и время после синтеза.  3a — импульсная метка, Endo H, препараты, HRD1.
   ===================================================================== */
const ER3 = { kf: 8, km: 0.9, kex: 2.0, ks: 2.5, kr: 1.5, kp: 8 };
/* константы скоростей для белка, препарата и клеток */
function er3Rates(prot, drug, cells){
  return {
    kf: prot === 'wt' ? ER3.kf : 0,
    km: ER3.km * (drug === 'kif' ? 0.1 : 1),
    kex: ER3.kex, ks: ER3.ks,
    kr: ER3.kr * ((drug === 'cb' || cells === 'hrd1') ? 0.08 : 1),
    kp: ER3.kp * (drug === 'btz' ? 0.04 : 1)
  };
}
/* интегрирование когорты до момента T (ч); точность — шаг 0,002 ч */
function er3Run(prot, drug, cells, T){
  const k = er3Rates(prot, drug, cells), dt = 0.002;
  const s = { F: 1, N: 0, G: 0, S: 0, E: 0, R: 0, D: 0 };
  let n = Math.round(T / dt);
  while (n-- > 0){
    const dF = -(k.kf + k.km) * s.F, dN = k.kf * s.F - k.kex * s.N, dG = k.kex * s.N - k.ks * s.G, dS = k.ks * s.G;
    const dE = k.km * s.F - k.kr * s.E, dR = k.kr * s.E - k.kp * s.R, dD = k.kp * s.R;
    s.F += dF * dt; s.N += dN * dt; s.G += dG * dt; s.S += dS * dt; s.E += dE * dt; s.R += dR * dt; s.D += dD * dt;
  }
  return s;
}

function q3GlySVG(x0, y0){

const afR2 = v => +v.toFixed(2);   /* то же округление, что у fmt(…, 2) */
/* =====================================================================
   Вопрос 4. Аутофагический поток: от ULK1 до лизосомного расщепления и его измерение
   Общая учебная модель — линейный конвейер во времени (часы), без обратной связи через mTORC1:
     образование аутофагосом F → пул аутофагосом AP → слияние (kf) → пул аутолизосом AL → расщепление (kd).
   Чашки начинают с равновесия в полной среде; в момент 0 меняют среду и добавляют препарат
   (генотипы ATG7⁻/⁻ и siRNA STX17 действуют с самого начала). Измерение — через AF.T ч.
   «+ бафиломицин» — вторая чашка: та же клетка, повторённая с момента AF.T − AF.BAF с бафиломицином;
   обе чашки читаются в один момент (как в семинаре 7). Бафиломицин в модели подавляет закисление;
   слияние в модели сохраняется (упрощение, оговорено в текстах: Mauvezin 2015).
   4b — базовый: конвейер, среда и вторая чашка, график 0–T ч.
   4a — «найдите заблокированный этап»: 7 блоков, блот LC3/p62 ± бафиломицин, тандемный репортёр,
        распад долгоживущих белков; итоговая загадка — неизвестный блок.
   Все величины — учебные, относительные.
   ===================================================================== */
const AF = { F_fed: .25, F_st: 1, kf: 1.5, kd: 1.2, ps: .06, kp0: .12, kq: .18, non: 2, kc: 2.7, T: 2, BAF: 2, dt: .005 };
/* блоки: init — образование аутофагосом (ULK1, VPS34), lip — присоединение LC3 к мембране (ATG7),
   fus — слияние, acid — закисление, prot — протеазы. gen — генетическое воздействие (действует и до момента 0) */
const AF_BLOCK = {
  none: {}, ulk: { init: .15 }, vps: { init: .15 }, atg7: { lip: 0, gen: 1 },
  stx: { fus: .15, gen: 1 }, baf: { acid: 0 }, cq: { fus: .25 }, prot: { prot: 0 }
};
const AF_STEP = { ulk: 0, vps: 1, atg7: 3, stx: 5, cq: 5, baf: 6, prot: 7 };   // какой этап конвейера нарушен
function afPar(block, starve, on, baf){
  const b = Object.assign({ init: 1, lip: 1, fus: 1, acid: 1, prot: 1 }, (on || AF_BLOCK[block].gen) ? AF_BLOCK[block] : {});
  if (baf) b.acid = 0;
  const F = (starve ? AF.F_st : AF.F_fed) * b.init * (b.lip ? 1 : .1);   // без ATG7 LC3 не присоединяется, образование аутофагосом резко снижено (Komatsu 2005)
  return { F, fus: b.fus, deg: b.acid * b.prot, lip: b.lip };
}
function afStep(S, p, dt){
  const fus = AF.kf * p.fus * S.AP, D = AF.kd * p.deg * S.AL;
  S.AP += (p.F - fus) * dt; S.AL += (fus - D) * dt;
  S.p62 += (AF.ps - S.p62 * (AF.kp0 + AF.kq * D)) * dt;
  S.D = D; S.Dint += D * dt;
}
/* равновесие в полной среде (с учётом генотипа), затем T ч в заданных условиях; baf — вторая чашка с момента T − BAF */
function afRun(o){
  const S = { AP: 0, AL: 0, p62: .3, D: 0, Dint: 0, hist: [] };
  const p0 = afPar(o.block, false, false, false);
  for (let i = 0; i < 3000; i++) afStep(S, p0, .01);
  S.Dint = 0;
  const n = Math.round(AF.T / AF.dt);
  for (let i = 0; i < n; i++){
    const tt = i * AF.dt, baf = o.baf && tt >= AF.T - AF.BAF - 1e-9;
    afStep(S, afPar(o.block, o.starve, true, baf), AF.dt);
    if (i % 10 === 0) S.hist.push([tt, S.AP, S.AL, S.D, afII(S, o.block)]);
  }
  S.hist.push([AF.T, S.AP, S.AL, S.D, afII(S, o.block)]);
  return S;
}
/* показатели одной чашки: LC3-II на мембранах аутофагосом и аутолизосом (внутренняя мембрана аутолизосомы разрушается вместе с содержимым) */
function afII(S, block){ return block === 'atg7' ? 0 : .5 * (S.AP + S.AL); }
function afRead(o){
  const S = afRun(o), II = afII(S, o.block), atg = o.block !== 'atg7';
  const acid = !(o.baf || o.block === 'baf');
  return { S, II, I: atg ? clamp(1 - .35 * Math.min(1, II)) : 1, p62: S.p62,
    yel: atg ? (acid ? S.AP : S.AP + S.AL) : 0, red: atg && acid ? S.AL : 0,
    D: S.D, long: AF.non + AF.kc * S.Dint, AP: S.AP, AL: S.AL };
}
/* шкалы рисунка подобраны по максимуму модели (проверено перебором всех блоков и сред), обрезания нет */
const AF_SC = { II: 2.4, dots: 9, p62: .6, pool: 2.6 };

/* конвейер этапов (общая часть схем 4b и 4a) */
function afPipe(K, y){
  const keys = ['ulk1', 'vps34', 'wipi2', 'atg7', 'close', 'stx17', 'vatp', 'cath'];
  let h = `<path class="edge" d="M10 ${y + 56} L588 ${y + 56}" marker-end="url(#a_${K})"/>`;
  keys.forEach((g, i) => {
    const x = 6 + i * 74;
    h += `<g id="${K}_st${i}" class="clickable" data-g="q4_${g}"><rect class="box" id="${K}_st${i}_r" x="${x}" y="${y}" width="70" height="46" rx="8"/>` +
      `<text class="lbl" x="${x + 35}" y="${y + 15}" font-size="10.5" font-weight="700">${t('s4_st' + i + 'a')}</text>` +
      `<text class="lbl" x="${x + 35}" y="${y + 32}" font-size="9.5">${t('s4_st' + i + 'b')}</text></g>` +
      XX(`${K}_stX${i}`, x + 4, y + 2, x + 66, y + 44);
  });
  return h;
}
function afPipeSet(K, block, hide){
  for (let i = 0; i < 8; i++){
    const bad = !hide && AF_STEP[block] === i;
    setBoxState(`${K}_st${i}`, bad ? 'inh' : 'on'); setOp(`${K}_stX${i}`, bad ? 1 : 0);

    const a = afRead({ block: b, starve: st }), c = afRead({ block: b, starve: st, baf: true });
    const lab = mys ? t('s4a_lane_x') : t('s4a_lane_' + b);
    lanes.push({ h1: lab, h2: '−Б', v: [a.I, a.II / AF_SC.II, a.p62 / AF_SC.p62, .9] }, { h1: lab, h2: '+Б', v: [c.I, c.II / AF_SC.II, c.p62 / AF_SC.p62, .9] });
    keys.push(t('s4a_key', { b: mys ? t('s4a_x') : blName(b), m: t(st ? 's4_med_st' : 's4_med_fed'), a: fmt(a.II, 2), c: fmt(c.II, 2), d: fmt(afR2(c.II) - afR2(a.II), 2) }));
    while (lanes.length > 8){ lanes.splice(0, 2); keys.shift(); }
    renderBlot();
  }
  function update(){
    const mys = $('s4a_mys').checked, b = cur4(), st = $('s4a_st').checked, baf = $('s4a_baf').checked;
    $('s4a_blW').style.display = mys ? 'none' : '';
    const C = afRead({ block: b, starve: st }), B = afRead({ block: b, starve: st, baf: true }), R = baf ? B : C, atg = b !== 'atg7';
    afPipeSet(K, b, mys);
    setTxt('s4a_blk', mys ? t('s4a_blk_x') : (b === 'none' ? '' : t('s4a_blk', { b: blName(b) })));
    const acid = !(baf || b === 'baf');
    const nY = Math.min(32, Math.round(R.yel * AF_SC.dots)), nR = Math.min(32, Math.round(R.red * AF_SC.dots));
    $('s4a_y').querySelectorAll(':scope > g').forEach((g, i) => g.setAttribute('opacity', i < nY ? 1 : 0));
    $('s4a_r').querySelectorAll(':scope > g').forEach((g, i) => g.setAttribute('opacity', i < nR ? 1 : 0));
    setOp('s4a_haze', atg ? .03 : .16);
    setTxt('s4a_dishL', t(baf ? 's4_dish2' : 's4_dish1'));
    setTxt('s4a_yL', t(acid ? 's4a_y' : 's4a_y_baf')); setTxt('s4a_rL', t(acid ? 's4a_r' : 's4a_r_baf'));
    $('s4a_now').innerHTML = readRow(t(baf ? 's4_dish2' : 's4_dish1'), t(st ? 's4_med_st' : 's4_med_fed'), '') +
      readRow(t('s4a_ny'), '', `<span class="v">${nY}</span>`) + readRow(t('s4a_nr'), '', `<span class="v">${nR}</span>`) +
      meterRow(t('s4_r_ii'), R.II / AF_SC.II, fmt(R.II, 2)) + meterRow('p62', R.p62 / AF_SC.p62, fmt(R.p62, 2)) +
      meterRow(t('s4_r_d'), R.D / AF.F_st, fmt(R.D, 2)) + meterRow(t('s4a_r_long'), C.long / 10, fmt(C.long, 1) + ' %') +
      readRow(t('s4_r_dii'), t('s4_r_dii_s'), `<span class="v">${fmt(afR2(B.II) - afR2(C.II), 2)}</span>`);
    const dII = afR2(B.II) - afR2(C.II);   /* прибавка из округлённых значений: совпадает с разностью чисел на экране */
    let k;
    if (mys) k = 's4a_c_mys';
    else if (baf && !atg) k = 's4a_c_b_atg7';
    else if (baf && b === 'baf') k = 's4a_c_baf_same';
    else if (baf) k = dII < .15 ? 's4a_c_b_small' : 's4a_c_b_big';
    else if (b === 'none') k = st ? 's4a_c_none' : 's4a_c_none_fed';
    else if (b === 'ulk' || b === 'vps') k = 's4a_c_init';
    else if (b === 'stx' || b === 'cq') k = 's4a_c_fus';
    else k = 's4a_c_' + b;
    setCap(K, k, { b: blName(b), d: fmt(dII, 2) });
  }
  wire(['s4a_bl', 's4a_st', 's4a_baf'], update);
  $('s4a_mys').onchange = () => { if ($('s4a_mys').checked) mysB = MYS[Math.floor(Math.random() * MYS.length)]; update(); };
  $('s4a_rec').onclick = record;
  $('s4a_clr').onclick = () => { lanes = []; keys = []; renderBlot(); };
  renderBlot();
  const clear = () => { lanes = []; keys = []; renderBlot(); };
  const set = (b, st, baf, mys) => { segSet('s4a_bl', b); $('s4a_st').checked = st; $('s4a_baf').checked = !!baf; $('s4a_mys').checked = !!mys; if (mys) mysB = mys; };
  SCENES[K] = { update, redraw: update, poe: [
    { n: 3, ok: 0, pre(){ clear(); set('none', true); }, apply(){ set('atg7', true); record(); } },
    { n: 3, ok: 1, pre(){ clear(); set('none', true); }, apply(){ set('prot', true); } },
    /* chain: продолжает предыдущий шаг (клетки с ингибиторами протеаз) — блот ± бафиломицин */
    { n: 3, ok: 0, chain: true, pre(){ clear(); set('prot', true); }, apply(){ record(); } },
    { n: 3, ok: 2, pre(){ clear(); set('none', true); }, apply(){ set('stx', true); } },
    { n: 3, ok: 1, pre(){ clear(); set('none', true); record(); }, apply(){ set('ulk', true); record(); } },
    /* last: загадка — блок скрыт; доказательства (блот и микроскоп) видны до ответа, ответ открывает название */
    { n: 3, ok: 1, last: true, pre(){ clear(); set('none', true, false, 'cq'); record(); }, apply(){ $('s4a_mys').checked = false; segSet('s4a_bl', 'cq'); } },
  ] };
  update();
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* страница объяснений: без адреса (ключ route_url) кнопки «Объяснения» не показываются */
if (!TEXTS.route_url) document.querySelector('.routes').hidden = true;
/* «← Все семинары»: на сайте ведёт на index.html рядом, в сохранённом файле — на адрес сайта */
(function(){ const a = $('homeLink'); if (a && location.hostname !== 'fresll.github.io') a.href = 'https://fresll.github.io/molbio/'; })();
window.addEventListener('hashchange', fromHash);
initNav(); fromHash(); show(); revInit();

</script>
