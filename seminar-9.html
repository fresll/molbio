<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры">
<title>Семинар 9 · Митохондрии как энергетический, сигнальный и генетический узел — Кафедра биологии и генетики, Медицинский университет Петровского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23; --chip-ink:#fff;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; --chip-ink:#151C23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; --chip-ink:#151C23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:11px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
/* справочные карточки без расчёта: метка, схема, вопрос для самопроверки */
.info.refcard{border-style:dashed}
.info.refcard b.k{color:var(--muted)}
.info p.reftag{font-size:13px;color:var(--muted);margin:0 0 4px}
.info .refp p+p,.info .refp figure+p{margin-top:7px}
.info .refp b{color:var(--ink)}
.btn.refbtn{border-style:dashed}
.selfq{margin:8px 0 2px;border-top:1px dashed var(--line);padding-top:6px}
.selfq summary{cursor:pointer;font-weight:600;font-size:14px}
.selfq p{margin:6px 0 0}
.selfq details{margin-top:6px}
.gfig{margin:8px 0 2px;overflow-x:auto}
.gfig svg{display:block;width:100%;min-width:400px;max-width:560px;height:auto;margin:0 auto;border:1px solid var(--line);border-radius:8px}
.gfig figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.gfig text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
/* схемы в справочных карточках вопросов 2 и 4 (I9-01…I9-06) */
.gfig .gf-box{fill:var(--surface-2);stroke:var(--edge);stroke-width:1.2}
.gfig .gf-box.d{fill:var(--surface);stroke:var(--muted);stroke-dasharray:4 3}
.gfig .gf-box.a{fill:var(--on-soft);stroke:var(--on)}
.gfig .gf-box.m{fill:var(--mito-fill);stroke:var(--mito)}
.gfig .gf-bt{font-size:10.5px;text-anchor:middle;dominant-baseline:central}
.gfig .gf-ct{font-size:11px;font-weight:700;text-anchor:middle}
.gfig .gf-cs{font-size:10px;fill:var(--muted);text-anchor:middle}
.gfig .gf-ls{font-size:10px;fill:var(--muted)}
.gfig .gf-lt{font-size:11px;font-weight:700}
.gfig .gf-ar{fill:none;stroke:var(--edge);stroke-width:1.6}
.gfig .gf-ar.d{stroke:var(--muted);stroke-dasharray:4 3}
.gfig .gf-ah{fill:var(--edge)}
.gfig .gf-ah.d{fill:var(--muted)}
.gfig .gf-chip{fill:var(--surface);stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
.gfig .gf-chipt{font-size:10px;text-anchor:middle;dominant-baseline:central}
.gfig .gf-stick{stroke:var(--muted);stroke-width:1}
.gfig .gf-lg{font-size:10.5px;fill:var(--muted)}
.gfig .gf-br{fill:none;stroke:var(--muted);stroke-width:1}
.gfig .gf-rl{font-size:10.5px;font-weight:700;fill:var(--ink)}
.gfig .gf-lgs{font-size:10px;fill:var(--muted)}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* ---------- семинар 9: митохондрия ---------- */
.pp{fill:var(--carn);stroke:var(--surface);stroke-width:.7}
.ims{fill:var(--cyto)} .mtx{fill:var(--mito-fill)}
.mband{fill:var(--mito);opacity:.22}
.mline{stroke:var(--mito);stroke-width:2;fill:none}
.el{stroke:var(--mal);stroke-width:3;fill:none;transition:opacity .3s}
.mk-e{fill:var(--mal)}
.gz{fill:var(--on);opacity:.28}
.gbar{fill:var(--surface-2);stroke:var(--off-ink);stroke-width:1.4}
.gtick{stroke:var(--muted);stroke-width:1.2}
.gmark{fill:var(--ink)}
.small-lbl{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.sgn{font-family:var(--f-mono);font-size:13px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.tagd{fill:var(--bad)}
.vlight{fill:none;stroke:var(--on);stroke-width:3;stroke-linecap:round}
/* Δp: сложенная полоса Δψ + ΔpH */
.stackbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:5px}
.stackbar i{display:block;height:100%}
.stackbar .a{background:var(--mtor)} .stackbar .b{background:var(--on)}
.stackkey{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.stackkey span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stackkey .a::before{background:var(--mtor)} .stackkey .b::before{background:var(--on)}
/* кривая O₂ и таблица параметров */
.tracebox{display:grid;gap:6px;margin-top:6px}
.tracebox canvas.plot{height:190px}
.trlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.trlegend span{display:inline-flex;align-items:center;gap:6px}
.ctrl .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.ctrl .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.ctrl .btns .btn{padding:6px 11px;font-size:14px}
.scene.wip .cap,.scene.wip .take,.scene.wip .reads,.scene.wip .info{display:none!important}
/* шаг-загадка: график стоит в левой панели вместо схемы */
.scene.puz .stage svg{display:none}
.scene.puz .reads{display:none}
.stage .tracebox{margin:0;padding:14px 16px 16px}
.stage .tracebox canvas.plot{height:290px}
#sc2a .stage .tracebox canvas.plot{height:clamp(180px,30vh,290px)}
/* структурные формулы в справке */
.fmrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 2px}
.fm{margin:0;display:grid;gap:3px;justify-items:start;color:var(--ink)}
.fm figcaption{font-size:13px;color:var(--muted);max-width:44ch}
.fm figcaption b{color:var(--ink)}
.fm-s{color:var(--ink);display:block}
.fm-s svg{display:block;width:var(--fw,170px);height:auto;max-width:100%}
.fm-s [class^="bond-"]{vector-effect:non-scaling-stroke;stroke-width:1.5px!important}
.fm-big .fm-s svg{width:min(100%,360px)}
.fm-mid .fm-s svg{width:min(100%,240px)}
@media (prefers-reduced-motion: reduce){ .el,.stackbar i{transition:none!important} }

/* продвинутый уровень вопроса 1: компактная панель управления (две колонки), чтобы подпись была видна без прокрутки */
.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:end}
.cg .dc{display:contents}
.cg .span2{grid-column:1/-1}
.cg .grp{display:grid;gap:5px}
.cg .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.cg .seg{display:flex;width:100%;flex-wrap:nowrap}
.cg .seg button{flex:1 1 auto;padding:5px 6px;font-size:13.5px;white-space:nowrap}
#sc2a .cg .seg button{padding:5px 3px}
.cg .drugs{display:flex;flex-wrap:wrap;gap:6px 16px}
.cg .switch{font-size:14px}
.cg .hint{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.3}
.cg .btns .btn{padding:5px 10px;font-size:13.5px}
@media (max-width:1000px){.cg{grid-template-columns:minmax(0,1fr)}}

/* ---------- семинар 9, вопрос 2: Δψ как общий ресурс ---------- */
.ppCa{fill:var(--aa);stroke:var(--surface);stroke-width:.7}
.ppIm{fill:var(--akt);stroke:var(--surface);stroke-width:.7}
.chip rect{fill:var(--bad)}
.chip text{fill:var(--chip-ink)}
.strip{fill:var(--surface-2);stroke:var(--off-ink);stroke-width:1.2}
.flagl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 2;opacity:.75}
.flagt{font-family:var(--f-body);font-size:11px;font-weight:600;fill:var(--ink)}
.flagt2{font-family:var(--f-body);font-size:9.5px;font-weight:600;fill:var(--muted)}
.ghost{opacity:.5}
.pinkf rect{fill:var(--tfeb)} .pinkf text{fill:var(--chip-ink)} .pinkf text.small-lbl{fill:var(--muted)}
.omm{stroke:var(--mito);stroke-width:2;fill:none;stroke-dasharray:6 4}
.pic rect{fill:var(--surface-2);stroke:var(--off);stroke-width:1.6;stroke-dasharray:4 3}

/* студенческая страница: блок ручек во время сценария (аудит P01) */
.scene.poe-lock .ctrl{pointer-events:none;opacity:.5}
.scene.poe-pre .stage .clickable,.scene.poe-pre .reads .gr{pointer-events:none}
.poelock{margin:6px 0 0;color:var(--muted)}
/* вопрос 3: контакт ЭПР–митохондрия */
.er{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.mdom{fill:var(--aa);transition:opacity .4s}
.tether{stroke:var(--tfeb);stroke-width:2;fill:none;stroke-dasharray:3 2}
.capi{fill:var(--off-ink)}
.ptpc{fill:var(--surface);stroke:var(--bad);stroke-width:1.8;stroke-dasharray:4 3;transition:fill .4s}
.ptpc.open{fill:var(--bad);stroke-dasharray:none}
.cypd{fill:var(--surface-2);stroke:var(--edge);stroke-width:1.4}
.box.micu{stroke-width:1.4}
@media (prefers-reduced-motion: reduce){ .mdom,.ptpc{transition:none!important} }
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{padding:6px 9px 7px;border-radius:10px;background:var(--surface-2);cursor:pointer;min-width:0}
.tile.wide{grid-column:span 2}
.tile .tn{font-size:13px;line-height:1.25;color:var(--ink);font-weight:600}
.tile .tv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;margin-top:2px}
.tile .meter{height:6px;margin-top:4px}
#sc3b .tracebox canvas.plot,#sc3a .tracebox canvas.plot{height:165px}
/* вопрос 4: два генома */
.gring{fill:none;stroke:var(--line);stroke-width:11}
.garc{fill:none;stroke-width:11}
.ribo{fill:var(--surface-2);stroke:var(--edge);stroke-width:1.6}
.ribo.mt{stroke:var(--mito)}
.cpy{fill:var(--mtor);opacity:.85;stroke:var(--surface);stroke-width:1}
.cpy.m{fill:var(--bad)}
.cpyh{fill:var(--surface)}
.tile.bad .tv{color:var(--bad)} .tile.good .tv{color:var(--good)}
#sc4b .tracebox canvas.plot,#sc4a .tracebox canvas.plot{height:170px}

/* ---------- версия 1.1 (аудит v1.0) ---------- */
/* вопрос 3: момент показаний, максимум нагрузки, две группы митохондрий */
.when{font-size:12.5px;color:var(--muted);margin:0 0 2px}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.25}
.poppanel{fill:var(--surface);stroke:var(--line);stroke-width:1.2;opacity:.94}
.popi.c,.popdot.c{fill:var(--aa)} .popi.o,.popdot.o{fill:var(--bad)}
.gpop{stroke-width:4;stroke-linecap:round} .gpop.c{stroke:var(--aa)} .gpop.o{stroke:var(--bad)}
/* вопрос 4: гистограмма «бутылочного горлышка» на месте схемы (шаг 4п-6); строка-цепочка от варианта до покрытия */
#sc4a .stage .tracebox canvas.plot{height:clamp(200px,42vh,330px)}
.chain4{font-size:10.5px;fill:var(--ink)}
/* сценарий: «было → стало» (аудит v1.0, V01) */
.poe .cmp{margin:8px 0 2px;padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.poe .cmp .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 0;border-top:1px solid var(--line);line-height:1.3}
.poe .cmp .r:first-of-type{margin-top:4px}
.poe .cmp .cn{flex:1 1 45%;min-width:0;font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)}
.poe .cmp .cv{flex:0 1 auto;max-width:60%;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.poe .cmp .cv i{font-style:normal;color:var(--muted);margin:0 5px}
.poe .cmp .r.lng .cv{max-width:66%} .poe .cmp .r.lng .cv i{margin-left:0}
.poe .cmp.none{font-size:13px;color:var(--muted)}
/* клавиатура (аудит v1.0, V07): видимый фокус */
.stage [data-g]:focus{outline:none}
.stage [data-g]:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.stage [data-g]:focus-visible rect.box,.stage [data-g]:focus-visible rect.ptpc{stroke:var(--on);stroke-width:3}
.reads [data-g]:focus-visible{outline:3px solid var(--on);outline-offset:1px}

ратов. Параметры согласованы с моделью семинара 8 (делящаяся клетка: O₂ 0,60; после олигомицина 0,15; с FCCP 0,99); Δψ −139 мВ — нейроны крысы в культуре (Gerencser 2012), модельная клетка условная. Доля химической части Δp — 20 % (в клетках ΔpH ≈ 0,3–1,2; Santo-Domingo & Demaurex 2012). Параметр расхода ATP задаёт условную нагрузку, а не измеренное отношение ATP/ADP и свободную энергию фосфорилирования. Кривая потребления O₂ — отдельный стандартный протокол (доза FCCP подобрана для достижения максимальной скорости дыхания), а не запись во времени. В вопросе 1 Ca²⁺ отдельно не моделируется; в вопросе 2 добавлен вход Ca²⁺ через MCU, в вопросе 3 — метаболическое действие Ca²⁺. При высокой потребности в ATP Δψ в модели меняется в узких пределах (−132 мВ), у нейронов при нагрузке — до −108 мВ (Gerencser 2012); Δψ при блоке цепи (−87 мВ) и при блоке цепи вместе с олигомицином (0) — расчётные результаты модели, а не результаты измерений.", "teacher_3": "Вопросы, требующие уточнения. Стехиометрия: на схеме показан перенос 10 и 6 H⁺ на пару электронов при окислении NADH и сукцината соответственно; соотношение 4 + 4 + 2 — перенос H⁺ комплексами I, III, IV (Alberts и др., гл. 14), а 4 + 2 + 4 — подсчёт перенесённых зарядов (Hinkle 2005), это разные величины. ATP-синтаза млекопитающих: c₈-кольцо, 8/3 ≈ 2,7 H⁺ на ATP через F₀F₁ (Watt 2010); суммарные затраты H⁺ с учётом переноса Pi и обмена ADP/ATP ≈ 3,7 (в модели). P/O: пределы модели 2,70 и 1,62; при 8/3 + 1 — 2,73 и 1,64 (Mookerjee 2017; исправление 2018); измеренные ≈ 2,5 и ≈ 1,5 (Hinkle 2005). Утечка: часть — протонный ток через ADP/ATP-переносчик, зависящий от жирных кислот (Bertholet 2019); для UCP1 механизм описан (Fedorenko 2012). Требуют уточнения ΔpH в клетке, условия работы ATP-синтазы в обратном направлении (доступность ATP, регуляция); остаточный Δψ при блоке цепи (в корковых нейронах крысы после ротенона или стигмателлина ≈ −85 мВ; Chinopoulos 2010). Перенос этих данных на условную клетку требует проверки. Пермеабилизованные клетки и изолированные митохондрии с сукцинатом — условия опыта, а не состояние интактной клетки.", "lbl_ims": "межмембранное пространство", "lbl_mtx": "матрикс", "lbl_in_v": "внутри везикулы (H⁺ накапливаются)", "lbl_out_v": "снаружи везикулы (F₁, синтез ATP)", "lbl_nadh1": "NADH", "lbl_nadh2": "→ NAD⁺", "lbl_succ1": "сукцинат", "lbl_succ2": "→ фумарат", "lbl_o2a": "O₂", "lbl_o2b": "→ H₂O", "lbl_leak": "утечка H⁺", "lbl_fccp": "FCCP", "lbl_syn": "ATP-синтаза", "lbl_adp": "ADP + Pi", "lbl_atp": "ATP", "lbl_use": "расход ATP", "lbl_use_v": "ATP в среде", "lbl_gauge": "Δψ, мВ", "lbl_gaugeV": "Δp, мВ", "lbl_zone1": "нейроны крысы", "lbl_zone2": "в культуре", "lbl_zoneV1": "везикулы", "lbl_zoneV2": "без дыхательной цепи", "lbl_br1": "бактерио-", "lbl_br2": "родопсин", "lbl_light": "свет", "lbl_h10": "10 H⁺ на 2 e⁻", "lbl_h6": "6 H⁺ на 2 e⁻", "tag_oligo": "олигомицин", "tag_pier": "пиерицидин A", "tag_anti": "антимицин A", "r_dp": "Δp (протонодвижущая сила)", "r_o2": "Потребление O₂ дыхательной цепью (отн. ед.)", "r_atp": "Покрытие потребности в ATP", "r_atp_s": "доля заданной потребности, покрываемая митохондриальным синтезом ATP; другие источники ATP не рассчитываются", "r_atp_v": "Ток H⁺, сопряжённый с синтезом ATP", "r_atp_vs": "ток H⁺ через ATP-синтазу в направлении синтеза", "v_rev": "гидролиз", "r_nadh": "Индекс восстановленности (усл.)", "r_ros": "Индекс АФК (усл.)", "r_byp": "Доля H⁺-тока в обход ATP-синтазы", "r_po": "P/O модели", "r_po_s": "ATP на ½ O₂ (на атом O)", "s1_d": "Расход ATP", "d_low": "низкий", "d_norm": "базальный", "d_high": "высокий", "s1b_f": "FCCP (доля дозы, подобранной при титровании)", "s1a_obj": "Объект", "obj_cell": "клетка", "obj_ves": "везикулы без дыхательной цепи", "s1a_in": "Путь поступления электронов", "in_nadh": "NADH-субстраты", "in_succ": "сукцинат", "s1a_in_hint": "При окислении NADH-субстратов электроны поступают в дыхательную цепь через комплекс I, при окислении сукцината — через комплекс II (в пермеабилизованных  (RCR)", "p_rcr_s": "отношение максимальной скорости дыхания к скорости после добавления олигомицина", "p_nm": "Немитохондриальное дыхание", "p_nm_s": "дыхание после добавления ингибиторов комплексов I и III; вычтено из приведённых выше показателей", "puz_x": "низкий расход ATP", "puz_y": "частичный дефект цепи", "puz_z": "усиленная утечка H⁺", "puz_row": "дыхание после олигомицина {a}; максимальное дыхание {m}; запасная дыхательная способность {s}; коэффициент сопряжения {c} %", "puz_hide": "Названия образцов показываются после ответа.", "s1b_take": "При достаточном поступлении субстратов увеличение расхода ATP ускоряет дыхание. Скорости переноса электронов и синтеза ATP взаимосвязаны через протонодвижущую силу Δp. В модели переход от низкого расхода ATP к высокому существенно изменяет поток электронов при небольшом изменении Δp. При разобщении дыхание и синтез ATP изменяются в противоположных направлениях.", "s1a_take": "Олигомицин блокирует перенос H⁺ через ATP-синтазу. FCCP создаёт дополнительный путь возврата H⁺ и в подходящей дозе позволяет определить максимальную скорость дыхания. При полном ингибировании комплексов I и III сохраняется заданное фоновое потребление O₂. Источником Δp может служить другой протонный насос, как в опыте Рэкера и Штукениуса. При наличии ATP синтаза может также поддерживать Δp, гидролизуя ATP.", "c_base": "В базальном состоянии окисление NADH сопровождается переносом H⁺ из матрикса в межмембранное пространство (10 H⁺ на 2 e⁻). Возврат H⁺ через ATP-синтазу сопряжён с синтезом ATP, покрывающим {syn} % потребности. Остальные H⁺ возвращаются по путям утечки: {byp} % суммарного протонного тока проходит в обход синтазы. Потребление O₂ составляет {o2}, Δψ — {dpsi} мВ.", "c_base_z": "В этом опыте доступность субстратов и кислорода, а также свойства мембраны неизменны. Изменение расхода ATP влияет на ток H⁺ через ATP-синтазу и скорость дыхания. В установившемся состоянии суммарные потоки H⁺ из матрикса и в матрикс равны.", "c_low": "При низком расходе ATP ток H⁺ через ATP-синтазу невелик; синтез ATP покрывает {syn} % потребности. Δp возрастает (Δψ {dpsi} мВ при базальном значении {dpsi_0} мВ), и окисление NADH замедляется: потребление O₂ составляет {o2} вместо базального {o2_0}. Доля тока в обход синтазы увеличивается до {byp} %. Индекс восстановленности составляет {nadh}, индекс АФК — {ros}.", "c_low_z": "Скорость дыхания изменяется вслед за расходом ATP: поток электронов меняется в несколько раз, тогда как Δψ — лишь на несколько мВ. Высокая Δp в сочетании с высокой долей NADH создаёт условия для образования супероксида (Murphy 2009).", "c_high": "При высоком расходе ATP ток H⁺ через ATP-синтазу возрастает. Δp несколько снижается (Δψ {dpsi} мВ при базальном значении {dpsi_0} мВ), и перенос электронов по дыхательной цепи ускоряется: потребление O₂ составляет {o2} вместо базального {o2_0}. Синтез ATP покрывает {syn} % потребности; {byp} % протонного тока проходит в обход синтазы.", "c_high_z": "При увеличении потребности в ATP перенос электронов по дыхательной цепи ускоряется, а Δψ изменяется мало. Скорости переноса электронов и синтеза ATP связаны через Δp. Для покрытия потребности, не обеспеченной окислительным фосфорилированием, необходимы другие источники ATP, например гликолиз; в вопросе 1 они не рассматриваются.", "c_fccp": "FCCP ({f} % дозы, подобранной при титровании) переносит H⁺ через мембрану в обход ATP-синтазы. В обход синтазы проходит {byp} % суммарного протонного тока против {byp_nf} % без FCCP. Мембрана деполяризуется: Δψ составляет {dpsi} мВ вместо {dpsi_nf} мВ. Потребление O₂ возрастает до {o2} вместо {o2_nf}, а синтез ATP покрывает {syn} % потребности вместо {syn_nf} %.", "c_fccp_z": "FCCP разобщает дыхание и синтез ATP. Максимальная скорость дыхания после добавления подходящей дозы FCCP и запасная дыхательная способность — разные показатели. Запасная дыхательная способность равна разности максимальной и базальной скоростей дыхания. Высокая скорость дыхания в присутствии FCCP не означает высокой скорости синтеза ATP.", "c_fccp_lim": "При FCCP ({f} % дозы, подобранной при титровании) скорость дыхания достигает предела ({o2} против {o2_nf} без FCCP), поэтому дальнейшее ускорение невозможно. Доля протонного тока в обход синтазы составляет {byp} % против {byp_nf} % без FCCP; Δψ — {dpsi} мВ против {dpsi_nf} мВ. Синтез ATP покрывает {syn} % потребности против {syn_nf} % без FCCP.", "c_fccp_lim_z": "Скорость дыхания ограничена максимальной мощностью дыхательной цепи, а не Δp: при входе электронов через сукцинат, высокой потребности в ATP или усиленной утечке дыхание уже близко к предельному, и протонофор перераспределяет ток между ATP-синтазой и обходным путём. Запасная дыхательная способность (разность максимальной и базальной скоростей дыхания) в таком состоянии мала.", "c_fccp_rev": "При FCCP ({f} % дозы, подобранной при титровании) Δp снижается до {dp} мВ, то есть ниже порога синтеза ATP. ATP-синтаза начинает гидролизовать ATP и переносить H⁺ из матрикса; её вклад в модели невелик. Скорость дыхания составляет {o2}.", "c_fccp_rev_z": "В этой модели при сильном разобщении и доступном ATP ATP-синтаза работает в обратном направлении. Реальная возможность и степень гидролиза зависят от доступности ATP, условий среды и регуляции фермента (Chinopoulos 2010).", "c_fx": "Избыток FCCP ({f} % дозы, подобранной при титровании): Δψ {dpsi} мВ, дыхание {o2} уже снижается с ростом дозы. В высоких дозах протонофор нарушает поступление субстрата и закисляет цитоплазму (Brand & Nicholls 2011); в модели это учтено эмпирическим снижением максимальной мощности дыхательной цепи.", "c_fx_z": "Зависимость скорости дыхания от дозы протонофора имеет колоколообразную форму: после достижения максимума скорость снижается. Поэтому для определения максимальной скорости дыхания дозу подбирают титрованием отдельно для каждой клеточной линии.", "c_o": "Олигомицин блокирует перенос H⁺ через ATP-синтазу, поэтому синтез ATP этим ферментом прекращается. H⁺ возвращаются в матрикс по путям утечки. Скорость дыхания снижается до {o2} против {o2_n} без олигомицина, а мембрана гиперполяризуется на {ddpsi} мВ: Δψ составляет {dpsi} мВ вместо {dpsi_n} мВ.", "c_o_z": "Остаточное дыхание после олигомицина позволяет оценить дыхание, поддерживающее утечку H⁺; оценка завышена из-за гиперполяризации. Разность дыхания до и после олигомицина — приближённая оценка дыхания, сопряжённого с синтезом ATP. Гиперполяризация после ингибирования ATP-синтазы указывает на то, что до добавления препарата она работала в направлении синтеза ATP (Brand & Nicholls 2011).", "c_of": "При добавлении олигомицина и FCCP ({f} %) ATP-синтаза заблокирована, и H⁺ возвращаются в матрикс по путям утечки и с участием FCCP. Скорость дыхания составляет {o2}, Δψ — {dpsi} мВ. При дозе FCCP, подобранной титрованием, дыхание достигает максимальной скорости, не ограниченной синтезом ATP.", "c_of_z": "Последовательное добавление олигомицина и FCCP позволяет оценить разные компоненты дыхания. После олигомицина сохраняется дыхание, поддерживающее утечку H⁺, а после FCCP достигается максимальная скорость дыхания, которую не ограничивают ни активность ATP-синтазы, ни высокая Δp.", "c_blk_f": "Дыхательная цепь заблокирована, добавлен FCCP ({f} %): мембрана деполяризуется (Δψ {dpsi} мВ, без FCCP {dpsi_nf} мВ). Перенос H⁺ из матрикса при блоке цепи в модели создают обратная работа ATP-синтазы и/или не полностью подавленная дыхательная цепь (в зависимости от ингибитора). FCCP добавляет путь возврата H⁺, поэтому в стационарном состоянии этот перенос и суммарный возврат H⁺ по путям утечки и с участием FCCP уравновешиваются при меньшей абсолютной величине Δψ; чем выше доза, тем сильнее деполяризация.", "c_blk_f_z": "При полном ингибировании комплекса III FCCP не восстанавливает перенос электронов к комплексу IV. Если ингибирован только комплекс I, в модели сохраняется небольшой митохондриальный поток электронов. Немитохондриальное дыхание оценивают отдельно, после добавления заключительной комбинации ингибиторов. Эти два компонента остаточного потребления O₂ необходимо различать.", "c_blk_f0": "Дыхательная цепь заблокирована, и работа ATP-синтазы в обратном направлении невозможна. В модели отсутствует перенос H⁺ из матрикса, поэтому Δψ составляет {dpsi} мВ. FCCP ({f} %) создаёт дополнительный путь возврата H⁺, но при этих условиях не изменяет потенциал.", "c_blk_f0_z": "FCCP увеличивает возврат H⁺ в матрикс и рассеивает Δp, но не создаёт источника протонного тока. Остаточное митохондриальное дыхание и немитохондриальный фон зависят от набора ингибиторов и учитываются раздельно.", "c_anti": "Антимицин A блокирует комплекс III: дыхательная цепь не переносит электроны к O₂ и не переносит H⁺ из матрикса. Δψ сохраняется ({dpsi} мВ в модели): ATP-синтаза работает в обратном направлении, гидролизует ATP и переносит H⁺ из матрикса. Индекс восстановленности составляет {nadh}, индекс АФК — {ros}; переносчики находятся в восстановленном состоянии.", "c_anti_z": "В модели остаточный Δψ поддерживает обратная работа ATP-синтазы, для которой в модели предусмотрен доступный ATP. В опыте одного остаточного потенциала недостаточно, чтобы установить его источник: дополнительная деполяризация после олигомицина поддерживает такое объяснение (Chinopoulos 2010). Значение −87 мВ — результат модели; в корковых нейронах крысы после добавления ротенона или стигмателлина Δψ составляет около −85 мВ (Chinopoulos 2010). Антимицин A усиливает образование H₂O₂ (Korshunov 1997).", "c_anti_lk": "Антимицин A блокирует комплекс III: дыхательная цепь не переносит электроны к O₂ и не переносит H⁺ из матрикса. Утечка усилена (×{lk}); перенос H⁺ из матрикса ATP-синтазой, работающей в режиме гидролиза ATP, уравновешивает их возврат только при меньшем Δp, поэтому Δψ {dpsi} мВ (при обычной утечке {dpsi_nl} мВ). Индекс восстановленности составляет {nadh}, индекс АФК — {ros}.", "c_anti_lk_z": "При ингибировании дыхательной цепи остаточный Δψ определяется соотношением двух токов: переноса H⁺ из матрикса ATP-синтазой, работающей в обратном направлении, и возврата H⁺ по путям утечки. Чем сильнее утечка, тем меньше абсолютная величина остаточного Δψ.", "c_ao": "Заблокированы дыхательная цепь и ATP-синтаза. В модели отсутствует перенос H⁺ из матрикса, Δψ составляет {dpsi} мВ, а потребление O₂ дыхательной цепью равно нулю. Индекс восстановленности составляет {nadh}, индекс АФК — {ros}.", "c_ao_z": "При ингибировании дыхательной цепи ATP-синтаза может частично поддерживать Δψ за счёт гидролиза ATP. В этом случае её ингибирование олигомицином вызывает дополнительную деполяризацию митохондрий; такой эффект показан для нейронов in situ (Chinopoulos 2010). Конечная величина Δψ зависит от условий опыта.", "c_pier": "Пиерицидин A подавляет комплекс I: перенос электронов от NADH почти прекращается (потребление O₂ {o2}), протонный ток дыхательной цепи невелик, Δψ {dpsi} мВ. Индекс восстановленности растёт до {nadh}, индекс АФК составляет {ros}. ATP-синтаза при низком Δp переходит на гидролиз ATP и частично поддерживает Δψ.", "c_pier_z": "При ингибировании комплекса I в модели сохраняется небольшой условный поток электронов от NADH вследствие неполного ингибирования; его происхождение отдельно не рассчитывается. Это остаточное митохондриальное дыхание, которое необходимо отличать от немитохондриального. При окислении сукцината электроны поступают к убихинону через комплекс II, поэтому ингибирование комплекса I не влияет на дыхание.", "c_po": "Заблокированы комплекс I и F₀: протонный ток дыхательной цепи невелик (потребление O₂ {o2}), а ATP-синтаза не работает ни в направлении синтеза, ни в направлении гидролиза ATP. Δψ составляет {dpsi} мВ против {dpsi_n} мВ без олигомицина. Эта разность отражает вклад работы ATP-синтазы в обратном направлении в поддержание Δψ.", "c_po_z": "При ингибировании дыхательной цепи олигомицин уменьшает абсолютную величину Δψ, тогда как при работающей цепи увеличивает её: направление сдвига Δψ после олигомицина показывает, синтезировали митохондрии ATP или гидролизовали его («null-point test»).", "c_pier_succ": "Пиерицидин A блокирует комплекс I, но электроны от сукцината поступают в дыхательную цепь через комплекс II, минуя комплекс I: дыхание ({o2}), Δψ ({dpsi} мВ) и синтез ATP (покрытие {syn} %) такие же, как без ингибитора.", "c_pier_succ_z": "Сочетание субстратов и ингибиторов показывает, на каком участке дыхательной цепи нарушен перенос электронов: ингибитор комплекса I не мешает дыханию при окислении сукцината. Такой подход применяют при исследовании пермеабилизованных клеток и изолированных митохондрий.", "c_leak": "Утечка H⁺ усилена (×{lk}): в стационарном состоянии протонный ток дыхательной цепи равен суммарному возвратному току H⁺ по путям утечки и через ATP-синтазу, поэтому потребление O₂ возрастает до {o2}. Доля тока в обход синтазы {byp} % (базальная {byp_0} %), Δψ {dpsi} мВ, покрытие потребности {syn} %, расчётное отношение P/O {po}.", "c_leak_z": "Утечка не изменяет число H⁺, необходимое для синтеза одной молекулы ATP, но уменьшает долю протонного тока через ATP-синтазу. Поэтому потребление O₂ увеличивается, а выход ATP на единицу потреблённого O₂ снижается. Регулируемая утечка через UCP1 лежит в основе теплопродукции бурой жировой ткани (Cannon & Nedergaard 2004).", "c_leak_lim": "Утечка H⁺ усилена (×{lk}): дыхание уже близко к предельному (O₂ {o2}), поэтому рост невелик; растёт доля тока в обход синтазы: {byp} % (базальная {byp_0} %), покрытие потребности снижается до {syn} %, Δψ {dpsi} мВ.", "c_leak_lim_z": "Утечка не изменяет число H⁺, необходимое для синтеза одной молекулы ATP, но уменьшает долю протонного тока через ATP-синтазу. Если скорость дыхания уже достигла предела, её дальнейшее увеличение невозможно, и скорость синтеза ATP снижается.", "c_succ": "При окислении сукцината электроны поступают в дыхательную цепь через комплекс II. H⁺ переносят из матрикса только комплексы III и IV: 6 H⁺ на 2 e⁻ вместо 10. При том же расходе ATP перенос электронов происходит быстрее, чем при окислении NADH-субстратов: потребление O₂ составляет {o2}, Δψ — {dpsi} мВ, покрытие потребности в ATP — {syn} %, расчётное отношение P/O — {po}.", "c_succ_z": "Число H⁺, переносимых из матрикса на один атом потреблённого кислорода, меньше, поэтому выход ATP на единицу потреблённого O₂ ниже: расчётные P/O 2,7 (NADH-субстраты) и 1,6 (сукцинат), измеренные ≈ 2,5 и ≈ 1,5 (Mookerjee 2017; Hinkle 2005).", "c_succ_lim": "При окислении сукцината и высоком расходе ATP на 2 e⁻ приходится перенос 6 H⁺ из матрикса. Скорость переноса электронов приближается к предельной (потребление O₂ {o2}). Синтез ATP покрывает {syn} % заданной потребности, Δψ составляет {dpsi} мВ, расчётное отношение P/O — {po}.", "c_succ_lim_z": "При окислении сукцината на 2 e⁻ переносится меньше H⁺ (6 H⁺), поэтому предельная скорость синтеза ATP ниже. При высокой потребности в ATP скорость переноса электронов раньше достигает максимума, чем при окислении NADH-субстратов. Для покрытия потребности, не обеспеченной окислительным фосфорилированием, необходимы другие источники ATP.", "cv_none": "Везикулы с ATP-синтазой, без дыхательной цепи; насос бактериородопсина выключен. Источника Δp нет, ток H⁺ через ATP-синтазу отсутствует, ATP не образуется.", "cv_none_z": "В этом опыте обратная работа ATP-синтазы исключена, поэтому при выключенном световом насосе источника Δp нет. В обратном режиме ATP-синтаза может создавать Δp за счёт гидролиза ATP (вопрос 1, шаги с антимицином A).", "cv_low": "При малой мощности светозависимого насоса Δp составляет {dp} мВ, что ниже порога синтеза ATP. ATP не образуется; H⁺ возвращаются по путям утечки, минуя ATP-синтазу.", "cv_low_z": "Для синтеза ATP нужен Δp не ниже порога, определяемого энергией синтеза ATP и числом H⁺, необходимым для образования одной молекулы ATP; при меньшем Δp ток через ATP-синтазу не идёт в сторону синтеза. В начале опыта с везикулами ATP в среде отсутствует, поэтому гидролиз при низком Δp в этом режиме не моделируется.", "cv_atp": "Свет ({pump} % мощности): бактериородопсин переносит H⁺ внутрь везикул, Δp {dp} мВ. H⁺ возвращаются наружу через F₀, вращают ротор F₁F₀, и образуется ATP; ток H⁺ через ATP-синтазу в направлении синтеза — {vatp} (усл. ед.). Дыхательной цепи нет: источником Δp служит светозависимый насос.", "cv_atp_z": "Синтез ATP определяется величиной Δp, а не самим переносом электронов. Его может обеспечить любой источник достаточной Δp: светозависимый насос бактериородопсина в везикулах (Racker & Stoeckenius 1974) или градиент H⁺ при переносе хлоропластов из кислой среды в щелочную (Jagendorf & Uribe 1966).", "cv_oligo": "Олигомицин блокирует F₀: H⁺ накапливаются внутри везикул, Δp растёт до {dp} мВ, ток через ATP-синтазу и синтез ATP прекращены.", "cv_oligo_z": "Увеличение Δp после ингибирования ATP-синтазы показывает, что до добавления препарата насос создавал Δp, а возврат H⁺ через синтазу уменьшал её. В клетке аналогичный эффект проявляется гиперполяризацией после добавления олигомицина.", "cv_fccp": "FCCP ({f} %) создаёт путь возврата H⁺ в обход ATP-синтазы: Δp снижается до {dp} мВ, ток H⁺ через ATP-синтазу в направлении синтеза — {vatp} (усл. ед.); вместе с ним снижается сопряжённый синтез ATP.", "cv_fccp_z": "Разобщитель снижает синтез ATP за счёт уменьшения Δp, а не повреждения ATP-синтазы: в опыте Рэкера и Штукениуса он устранял и светозависимое поглощение H⁺, и синтез ATP.", "c_puz": "Для трёх образцов (X, Y, Z) измерено потребление O₂ при последовательном добавлении препаратов; результаты представлены на графике. Определите, какой образец характеризуется низким расходом ATP, какой — частичным дефектом дыхательной цепи, а какой — усиленной утечкой H⁺.", "c_puz_z": "По одному значению базального дыхания причины различить нельзя. Для этого сопоставляют дыхание после добавления олигомицина, характеризующее утечку H⁺, максимальное дыхание после FCCP и запасную дыхательную способность — разность максимальной и базальной скоростей дыхания.", "c_puz_ans": "Образцы подписаны на графике. Для каждого образца в таблице под графиком приведены дыхание после добавления олигомицина, максимальное дыхание, запасная дыхательная способность и коэффициент сопряжения. Обоснование сопоставления содержится в объяснении к шагу.", "c_puz_ans_z": "Низкий коэффициент сопряжения может быть следствием как усиленной утечки H⁺, так и низкого расхода ATP. Если дыхание, сопряжённое с синтезом ATP, невелико, дыхание, поддерживающее утечку, составляет большую долю базального дыхания (у X коэффициент сопряжения 48 %). Поэтому сопоставляют дыхание после олигомицина, максимальное и базальное дыхание, а не судят по одному показателю.", "p1b_1_q": "Расход ATP снижают (переключатель «Расход ATP» — «низкий»). Как изменятся потребление O₂ и Δψ?", "p1b_1_o1": "Потребление O₂ уменьшится; мембрана немного гиперполяризуется (|Δψ| увеличится).", "p1b_1_o2": "Потребление O₂ не изменится: оно определяется количеством субстрата, а не потреблением ATP.", "p1b_1_o3": "Потребление O₂ уменьшится, и мембрана деполяризуется: при меньшем расходе ATP мембранный потенциал ниже.", "p1b_1_e": "Если ATP потребляется медленнее, уменьшается возврат H⁺ через ATP-синтазу. В модели Δp немного увеличивается: мембрана гиперполяризуется (Δψ −139 → −146 мВ), а дыхание замедляется (O₂ 0,60 → 0,24). Общее звено сопряжения — Δp; величина Δψ сама по себе не показывает скорость дыхания.", "p1b_1_w2": "Скорость дыхания зависит от Δp: небольшого роста Δp (на несколько мВ) достаточно, чтобы протонный ток дыхательной цепи в модели уменьшился в 2,5 раза. Субстрат доступен в достаточном количестве и не ограничивает скорость дыхания.", "p1b_1_w3": "В этом опыте мембрана немного гиперполяризуется: Δψ становится более отрицательным. Снижение возврата H⁺ через ATP-синтазу увеличивает Δp, и перенос электронов по дыхательной цепи замедляется.", "p1b_2_q": "Расход ATP повышают (переключатель «Расход ATP» — «высокий»). Как изменятся потребление O₂ и Δψ?", "p1b_2_o1": "Потребление O₂ увеличится, а мембрана деполяризуется почти до нуля: ток H⁺ через ATP-синтазу устраняет разность потенциалов.", "p1b_2_o2": "Потребление O₂ не изменится: скорость переноса электронов по цепи уже максимальна, и дополнительная потребность покрывается другими путями.", "p1b_2_o3": "Потребление O₂ увеличится; мембрана немного деполяризуется (|Δψ| уменьшится).", "p1b_2_e": "Рост потребления ATP усиливает ток H⁺ через ATP-синтазу. Δp слегка снижается (Δψ −139 → −132 мВ), и перенос электронов ускоряется: потребление O₂ составляет 0,86 вместо 0,60. Скорость переноса электронов резко зависит от Δp, поэтому небольшого изменения потенциала достаточно для изменения потока на десятки процентов.", "p1b_2_w1": "Для синтеза ATP нужна достаточная протонодвижущая сила Δp. В этой модели электрическая часть составляет 80 % Δp, поэтому деполяризация почти до нуля означала бы потерю движущей силы. В данном опыте |Δψ| уменьшается лишь на 7 мВ.", "p1b_2_w2": "Базальная скорость дыхания (0,60) значительно ниже предельной (около 1,0), поэтому при высоком расходе ATP дыхание ускоряется до 0,86.", "p1b_3_q": "Расход ATP соответствует базальному уровню. Добавляют разобщитель FCCP (100 % дозы, подобранной при титровании). Как изменятся потребление O₂, Δψ и синтез ATP?", "p1b_3_o1": "Потребление O₂ снизится, потому что при падении синтеза ATP перенос электронов по дыхательной цепи замедляется; мембрана гиперполяризуется.", "p1b_3_o2": "Потребление O₂ вырастет почти до максимума, мембрана деполяризуется, синтез ATP снизится.", "p1b_3_o3": "Потребление O₂ почти не изменится: FCCP деполяризует мембрану, но скорость окисления определяют субстраты.", "p1b_3_e": "FCCP — протонофор: переносит H⁺ в матрикс в обход ATP-синтазы. Δp снижается (Δψ −139 → −119 мВ), торможение переноса электронов ослабевает, и дыхание ускоряется до 0,99 (в 1,7 раза). ATP-синтаза покрывает 42 % потребности (было 98 %): энергия окисления рассеивается в виде тепла.", "p1b_3_w1": "ATP не служит субстратом дыхательной цепи: скорость переноса электронов определяется Δp и их поступлением в цепь. Снижение Δp ослабляет торможение переноса электронов, поэтому потребление O₂ увеличивается.", "p1b_3_w3": "Скорость переноса электронов зависит от Δp: при снижении Δp торможение ослабевает. Поэтому добавление FCCP вызывает деполяризацию мембраны и ускорение дыхания.", "p1a_1_q": "Клетка в базальном состоянии. Добавляют олигомицин (ингибитор F₀). Как изменятся потребление O₂ и Δψ?", "p1a_1_o1": "Потребление O₂ упадёт до нуля, мембрана деполяризуется: без работающей ATP-синтазы цепь остановится.", "p1a_1_o2": "Потребление O₂ уменьшится, но сохранится; мембрана немного гиперполяризуется.", "p1a_1_o3": "Потребление O₂ почти не изменится, а мембрана сильно гиперполяризуется: ATP-синтаза не влияет на скорость цепи.", "p1a_1_e": "Олигомицин закрывает путь H⁺ через ATP-синтазу, и H⁺ возвращаются в матрикс только через утечку. Перенос электронов замедляется по мере небольшого увеличения Δp (Δψ −139 → −149 мВ): O₂ 0,60 → 0,15. Остаточное дыхание (25 % базального) обеспечивает перенос H⁺ из матрикса, уравновешивающий их утечку; разность (0,45) — приближённая оценка дыхания, сопряжённого с синтезом ATP. Гиперполяризация показывает, что до добавления препарата ATP-синтаза работала в направлении синтеза ATP.", "p1a_1_w1": "Дыхание не прекращается: H⁺ продолжают возвращаться в матрикс по путям утечки, и их перенос из матрикса при окислении субстрата уравновешивает этот возврат. Остаточное дыхание после олигомицина позволяет оценить утечку H⁺.", "p1a_1_w3": "Гиперполяризация невелика (около 10 мВ), но её достаточно для резкого замедления переноса электронов: скорость окисления существенно зависит от Δp.", "p1a_2_q": "FCCP в дозе, подобранной при титровании, ускорил дыхание почти до максимума. Затем дозу увеличили втрое, до избыточной. Что произойдёт с потреблением O₂?", "p1a_2_o1": "Потребление O₂ снизится: избыток протонофора нарушает поступление субстрата и подавляет дыхание.", "p1a_2_o2": "Потребление O₂ увеличится ещё сильнее: чем сильнее разобщение, тем ниже Δp и тем быстрее переносятся электроны по дыхательной цепи.", "p1a_2_o3": "Потребление O₂ не изменится: максимальная скорость переноса электронов по цепи уже достигнута и дальше не растёт.", "p1a_2_e": "Зависимость скорости дыхания от дозы FCCP имеет колоколообразную форму: скорость увеличивается до оптимальной дозы, а затем снижается. В избытке протонофор нарушает поступление субстрата и вызывает закисление цитоплазмы (Brand & Nicholls 2011), поэтому для каждой клеточной линии дозу подбирают титрованием. В модели при дозе 300 % потребление O₂ составляет 0,50 (при 100 % — 0,99), а Δψ — −31 мВ. Снижение максимальной мощности дыхательной цепи задано эмпирически.", "p1a_2_w2": "Скорость переноса электронов имеет предел — около 1,0 по шкале модели. При дозе FCCP выше оптимальной усиление разобщения не ускоряет дыхание, а при избытке препарата скорость дыхания снижается.", "p1a_2_w3": "Максимум достигается при оптимальной дозе; при дозе выше оптимальной дыхание не остаётся на максимуме, а падает (колоколообразная зависимость).", "p1a_3_q": "В пермеабилизованных клетках или изолированных митохондриях переходят к окислению сукцината: электроны поступают в дыхательную цепь через комплекс II. Расход ATP сохраняют прежним. Как изменятся потребление O₂ и синтез ATP?", "p1a_3_o1": "Потребление O₂ снизится: путь через комплекс II короче, поэтому электронов поступает меньше.", "p1a_3_o2": "Потребление O₂ и синтез ATP почти не изменятся: путь электронов не влияет на число перенесённых H⁺.", "p1a_3_o3": "Потребление O₂ вырастет при почти том же синтезе ATP: на пару электронов переносится 6 H⁺ вместо 10.", "p1a_3_e": "При поступлении электронов через комплекс II в модели переносится 6 H⁺ на пару электронов вместо 10: комплекс II H⁺ не переносит. При той же заданной потребности в ATP потребление O₂ увеличивается 0,60 → 0,94, а синтез ATP немного снижается: покрытие потребности 98 → 94 %, ток через ATP-синтазу меньше примерно на 5 %. Расчётное отношение P/O снижается с 2,13 до 1,29 (предел модели 2,70 и 1,62; измеренные ≈ 2,5 и ≈ 1,5, Hinkle 2005). Это результат выбранной модели, а не универсальный коэффициент для любых субстратов.", "p1a_3_w1": "При окислении сукцината на пару электронов переносится меньше H⁺ (6 против 10). Поэтому для поддержания того же протонного тока требуется больший поток электронов, и дыхание ускоряется.", "p1a_3_w2": "Число H⁺, переносимых на пару электронов, зависит от пути электронов: комплекс I переносит H⁺ из матрикса, а комплекс II — нет. При поступлении электронов через комплекс II переносится меньше H⁺, поэтому для поддержания той же скорости синтеза ATP требуется больше O₂.", "p1a_4_q": "Модельная клетка в базальном состоянии; в матриксе есть ATP. Добавляют антимицин A (ингибитор комплекса III). Как изменится Δψ?", "p1a_4_o1": "Мембрана полностью деполяризуется: без переноса электронов цепь не переносит H⁺, и ничто не поддерживает Δψ.", "p1a_4_o2": "Мембрана деполяризуется, но часть Δψ сохранится за счёт гидролиза ATP и переноса H⁺ ATP-синтазой.", "p1a_4_o3": "Мембрана гиперполяризуется: электроны накапливаются перед блоком, и перенос H⁺ через мембрану усиливается.", "p1a_4_e": "В этой модели ингибирование комплекса III прекращает перенос электронов к комплексу IV, а ATP-синтаза при наличии ATP начинает работать в обратном направлении и частично поддерживает Δψ: −139 → −87 мВ. Обратная работа синтазы без одновременного изменения направления обмена через ADP/ATP-переносчик показана в определённых условиях; источник ATP в матриксе и вклад субстратного фосфорилирования зависят от объекта, конкретный вклад SUCLA2 в исследованных клетках непосредственно не установлен (Chinopoulos 2010). В корковых нейронах крысы после добавления ротенона или стигмателлина Δψ составляет около −85 мВ (там же).", "p1a_4_w1": "В условиях этой модели обратная работа ATP-синтазы обеспечена ATP, поэтому часть Δψ сохраняется. Без доступного ATP или при подавлении обратной работы результат был бы другим.", "p1a_4_w3": "Если дыхательная цепь не переносит H⁺ из матрикса, она не может увеличивать Δp. Накопление электронов перед ингибированным участком усиливает образование АФК, но не увеличивает абсолютную величину Δψ.", "p1a_5_q": "Цепь заблокирована антимицином A; часть Δψ поддерживает ATP-синтаза. Добавляют олигомицин. Как изменится Δψ?", "p1a_5_o1": "Мембрана деполяризуется сильнее: заблокирована ATP-синтаза, поддерживавшая Δψ гидролизом ATP.", "p1a_5_o2": "Мембрана гиперполяризуется, как при добавлении олигомицина к клетке с работающей цепью.", "p1a_5_o3": "Δψ не изменится: олигомицин действует на синтез ATP, а цепь заблокирована.", "p1a_5_e": "При ингибировании дыхательной цепи Δψ поддерживается переносом H⁺ из матрикса, сопряжённым с гидролизом ATP комплексом F₁F₀. Олигомицин блокирует перенос через F₀ в обоих направлениях. В модели Δψ изменяется с −87 до 0 мВ, поскольку других механизмов переноса H⁺ из матрикса не предусмотрено. При ингибировании дыхательной цепи в нейронах олигомицин также вызывал дополнительную деполяризацию (Chinopoulos 2010). Направление изменения Δψ после добавления олигомицина указывает на предшествующий режим работы ATP-синтазы: гиперполяризация соответствует синтезу ATP, а деполяризация — его гидролизу («null-point test», Brand & Nicholls 2011).", "p1a_5_w2": "Гиперполяризация после олигомицина возникает, когда ATP-синтаза работала в прямом направлении (синтез). При блоке цепи она работает в обратном направлении, и олигомицин вызывает деполяризацию мембраны.", "p1a_5_w3": "Олигомицин блокирует перенос H⁺ через F₀ в обоих направлениях и тем самым подавляет как синтез, так и гидролиз ATP. Поэтому при ингибировании дыхательной цепи, когда Δψ поддерживается за счёт гидролиза ATP, олигомицин вызывает дополнительную деполяризацию.", "p1a_6_q": "Цепь заблокирована антимицином A. Добавлен FCCP в дозе, подобранной при титровании. Что произойдёт с потреблением O₂?", "p1a_6_o1": "Потребление O₂ не изменится (останется близким к нулю): протонофор рассеивает Δp, но не создаёт потока электронов.", "p1a_6_o2": "Потребление O₂ увеличится почти до максимума: FCCP снимает торможение переноса электронов по цепи так же, как в клетках без блока.", "p1a_6_o3": "Потребление O₂ несколько увеличится: FCCP ускорит остаточный перенос электронов, но слабее, чем без блока.", "p1a_6_e": "FCCP ускоряет дыхание, снижая Δp и ослабляя торможение переноса электронов; при блоке комплекса III электроны дальше убихинола не проходят, и поток к комплексу IV равен нулю при любом Δp. В модели потребление O₂ остаётся равным 0,00; мембрана деполяризуется с −87 до −8 мВ: потенциал, который поддерживала ATP-синтаза, работавшая в обратном направлении, снижается вследствие переноса H⁺ с участием FCCP. Фоновое немитохондриальное потребление O₂ задано на кривой протокола отдельно.", "p1a_6_w2": "FCCP ослабляет торможение переноса электронов высокой Δp только при сохранной дыхательной цепи. При ингибировании комплекса III перенос электронов прекращается, поэтому ускорить его невозможно. Протонофор может лишь вызвать снижение абсолютной величины Δψ.", "p1a_6_w3": "При полном блоке комплекса III в этой модели поток электронов к комплексу IV равен нулю с FCCP и без него. Фоновое потребление O₂ на графике задано отдельно и постоянно; остаточный расход O₂ в реальном опыте нельзя автоматически приравнивать к этому фону.", "p1a_7_q": "Для трёх образцов получены кривые потребления O₂ при последовательном добавлении препаратов (см. график). Один образец характеризуется низким расходом ATP, второй — частичным дефектом дыхательной цепи, третий — усиленной утечкой H⁺. Какое сопоставление верно?", "p1a_7_o1": "X — усиленная утечка, Y — низкий расход ATP, Z — частичный дефект цепи.", "p1a_7_o2": "X — низкий расход ATP, Y — частичный дефект цепи, Z — усиленная утечка.", "p1a_7_o3": "X — частичный дефект цепи, Y — усиленная утечка, Z — низкий расход ATP.", "p1a_7_e": "У X базальное дыхание низкое (0,29), а максимальное дыхание после FCCP высокое (0,99), поэтому запасная дыхательная способность велика. Дыхание после олигомицина (0,15) соответствует норме: дыхание ограничено низким расходом ATP. У Y максимальное дыхание (0,45) лишь на 0,01 превышает базальное (0,44), поэтому запасная дыхательная способность близка к нулю: ограничена максимальная мощность цепи. У Z базальное дыхание высокое (0,89), после олигомицина сохраняется 0,52, а коэффициент сопряжения низкий (41 %): усилена утечка H⁺. У X коэффициент сопряжения также снижен (48 %), однако это связано с небольшой долей дыхания, сопряжённого с синтезом ATP, при обычной утечке H⁺.", "p1a_7_w1": "У X уровень дыхания после олигомицина (0,15) такой же, как в норме (0,15): утечка не усилена. Низкое дыхание X при большой запасной дыхательной способности — следствие низкого расхода ATP.", "p1a_7_w3": "У Y максимум после FCCP (0,45) лишь на 0,01 выше базального дыхания (0,44): в этой задаче это признак ограниченной мощности цепи. У Z высоки и базальное дыхание (0,89), и уровень дыхания после олигомицина (0,52): это признак усиленной утечки.", "p1a_8_q": "Везикулы содержат ATP-синтазу и бактериородопсин (светозависимый насос H⁺), дыхательной цепи нет. Что произойдёт при включении света?", "p1a_8_o1": "ATP не образуется: без цепи переноса электронов Δp создать нельзя.", "p1a_8_o2": "Δp возникает, но ATP не образуется: для синтеза нужен перенос электронов через комплексы.", "p1a_8_o3": "Возникает Δp и образуется ATP; ингибитор F₀ или протонофор подавляют синтез.", "p1a_8_e": "Синтез ATP определяется величиной Δp, которую может создавать не только дыхательная цепь, но и другой протонный насос. В опыте Рэкера и Штукениуса (1974) везикулы с бактериородопсином и митохондриальной ATP-синтазой на свету поглощали H⁺ и образовывали ATP; в темноте и с протонофором ATP не образовывался, а ингибитор переноса энергии (рутамицин) снижал синтез примерно на 70 %. Хлоропласты образуют ATP в темноте после переноса из кислой среды в щелочную (Jagendorf & Uribe 1966). В модели: при мощности насоса 60 % Δp составляет 162 мВ, ток H⁺ через ATP-синтазу в направлении синтеза 0,43 (усл. ед.); с олигомицином и с FCCP — 0,00. Этот ток сопряжён с синтезом ATP, но его значение — не количество ATP.", "p1a_8_w1": "Опыт с везикулами показывает, что Δp может создавать протонный насос другой природы — в данном случае бактериородопсин. Создаваемая им Δp обеспечивает работу ATP-синтазы, как и Δp, создаваемая дыхательной цепью.", "p1a_8_w2": "Работа ATP-синтазы не зависит от механизма создания Δp: ротор вращается при движении H⁺ по электрохимическому градиенту. На свету насос создаёт Δp, и начинается синтез ATP.", "lbl_omm": "наружная мембрана", "lbl_tom": "TOM", "lbl_pk_kda": "63 кДа", "lbl_chain": "цепь", "lbl_nadh_o2": "NADH → O₂", "lbl_nofo": "неполный F₀", "lbl_syn1": "синтаза", "lbl_pic": "PiC: электронейтральный перенос", "lbl_pre": "белок-предшественник", "lbl_gauge2": "Δψ, мВ", "g2_atp": "ATP", "g2_imp": "TIM23", "g2_ca": "MCU", "g2_n1": "полосы — справочные", "g2_n2": "зависимости от Δψ", "g2_n3": "без ингибиторов (усл.)", "gf_0": "0", "gf_67": "−67 ρ⁰", "gf_108": "−108 ANT", "gf_139": "−139", "tag_bka": "бонкрековая кислота", "tag_fccp": "FCCP {f} %", "tag_ca": "Ca²⁺ ×{k}", "tag_ru": "ингибитор MCU", "frag_chain": "при мощности цепи {c} % исходной", "who_o": "при заблокированной ATP-синтазе (олигомицин)", "who_b": "при заблокированном обмене ADP/ATP (бонкрековая кислота)", "who_ob": "при заблокированных ATP-синтазе и обмене ADP/ATP (олигомицин, бонкрековая кислота)", "s2b_c": "Максимальная мощность дыхательной цепи (% исходной)", "s2b_f": "FCCP (доля дозы, подобранной при титровании)", "s2a_obj": "Объект", "obj_rho": "ρ⁰ (без мтДНК)", "s2a_blk": "Ингибирование дыхательной цепи", "blk_none": "нет", "blk_pier": "пиерицидин", "blk_anti": "антимицин", "s2a_drugs": "Препараты", "tg_bka": "бонкрековая кислота", "s2a_f": "FCCP, % дозы, подобранной при титровании", "s2a_ca": "Условная нагрузка Ca²⁺ через MCU", "ca_norm": "обычная", "ca_mid": "×10", "ca_high": "×60", "tg_ru": "ингибитор MCU", "r2_dpsi": "Δψ внутренней мембраны", "r2_o2": "Потребление O₂ дыхательной цепью (отн. ед.)", "r2_o2_rho": "в модели вклад дыхательной цепи равен нулю; немитохондриальное потребление O₂ здесь не рассчитывается", "r2_atp": "Поступление ATP из митохондрий", "r2_atp_s": "модельная доля заданной потребности, обеспеченная поступлением ATP из митохондрий", "r2_atp_hid": "при повышенной нагрузке Ca²⁺ показатель не рассчитывается: он зависит от ускорения реакций, катализируемых дегидрогеназами (вопрос 3)", "r2_ca": "Поступление Ca²⁺ через MCU", "r2_ca_s": "относительно исходного состояния (1,00)", "r2_imp": "Импорт белка-предшественника (TIM23)", "r2_imp_s": "условный индекс Δψ-зависимого импорта при достаточном ATP в матриксе", "r2_pink": "Предпосылки накопления PINK1", "r2_pink_s": "условный индекс модели; количество PINK1 и время накопления не рассчитываются", "r2_pink_rho": "у ρ⁰ не приводится: прямых данных нет", "r2_tmrm": "Сигнал TMRM", "r2_tmrm_s": "относительно исходного сигнала; режим без тушения флуоресценции", "r2_ros": "Условный индекс АФК", "r2_ros_rho": "у ρ⁰ не приводится: цепи нет", "tr2_x": "фаза протокола", "tr2_t": "Сигнал TMRM текущего образца при последовательном добавлении препаратов", "tr2_t_puz": "Сигнал TMRM трёх образцов при последовательном добавлении препаратов", "tr2_c0": "Исходно → олигомицин → FCCP (минимальный сигнал модели). Сигнал относительный: 1,00 соответствует исходной клетке. Показаны три состояния отдельного образца в режиме без тушения флуоресценции; это не запись во времени. Состояние образца на основной схеме не меняется.", "tr2_c": "Исходно → олигомицин → FCCP. Сигнал относительный (1,00 — исходная клетка); режим без тушения флуоресценции.", "tr2_leg": "сигнал TMRM образца (отн. ед.)", "tm_p1": "Исходно", "tm_p2": "После олигомицина", "tm_p3": "После FCCP (минимальный сигнал)", "puz2_x": "ингибирование дыхательной цепи (антимицин A)", "puz2_y": "разобщитель (FCCP, 200 % дозы, подобранной при титровании)", "puz2_z": "клетки ρ⁰ (без мтДНК)", "puz2_row": "потребление O₂ до добавления препаратов {o}; сигнал TMRM: исходно {a}, после олигомицина {b}, после FCCP {c}", "puz2_hide": "Названия образцов показываются после ответа.", "s2b_take": "Дыхание, синтез и экспорт ATP, импорт белков и перенос Ca²⁺ связаны через потенциал внутренней мембраны. Эти процессы различаются по механизму и зависимости от Δψ. В данной модели умеренная деполяризация резко снижает поступление ATP из митохондрий, но импорт белков при достаточном ATP в матриксе ещё сохраняется; глубокая деполяризация препятствует импорту и создаёт условия для накопления PINK1. Численные пороги и индексы здесь условные.", "s2a_take": "Малая абсолютная величина Δψ и слабый сигнал TMRM сами по себе не устанавливают причину нарушения. В модельных образцах блок цепи, разобщение и отсутствие мтДНК различаются по дыханию и реакции на олигомицин. При работающей цепи блок ATP-синтазы увеличивает абсолютную величину Δψ и усиливает поступление Ca²⁺; при остановленной цепи он прекращает поддержание потенциала за счёт гидролиза ATP. В клетках ρ⁰ потенциал поддерживает электрогенный обмен через ANT в сочетании с гидролизом ATP на F₁.", "w_was": "было {v}", "w_was2": "было {v} при той же нагрузке Ca²⁺", "w_same": "показание прежнее", "c2h_base": "В исходном состоянии цепь переносит H⁺ из матрикса; Δψ составляет {dpsi} мВ, потребление O₂ дыхательной цепью — {o2}. На схеме сопоставлены синтез и экспорт ATP, импорт через TIM23 и вход Ca²⁺ через MCU. Их зависимости от потенциала различаются.", "c2h_chain": "Максимальная мощность цепи снижена до {c} % исходной. Перенос H⁺ из матрикса замедляется; Δψ составляет {dpsi} мВ ({dpsi_b}), потребление O₂ дыхательной цепью — {o2} ({o2_b}).", "c2h_f": "FCCP ({f} % дозы, подобранной при титровании){chain_frag} переносит H⁺ в матрикс в обход ATP-синтазы: Δψ {dpsi} мВ ({dpsi_b}), потребление O₂ {o2} ({o2_b}).", "c2h_fo": "FCCP ({f} % дозы, подобранной при титровании) {who}: H⁺ возвращаются в матрикс через утечку и протонофор, Δψ {dpsi} мВ, потребление O₂ {o2}.", "c2h_o": "Олигомицин блокирует перенос H⁺ через F₀ ATP-синтазы. Δψ составляет {dpsi} мВ ({dpsi_b}), потребление O₂ — {o2} ({o2_b}).", "c2h_b": "Бонкрековая кислота блокирует обмен ADP/ATP: в матрикс не поступает ADP, и ток H⁺ через ATP-синтазу прекращается; Δψ {dpsi} мВ ({dpsi_b}), потребление O₂ {o2} ({o2_b}).", "c2h_ob": "Заблокированы ATP-синтаза (олигомицин) и обмен ADP/ATP (бонкрековая кислота). Каждый из препаратов прекращает ток H⁺ через синтазу, поэтому в модели добавление второго препарата не изменяет результат. Δψ составляет {dpsi} мВ ({dpsi_b}), потребление O₂ — {o2} ({o2_b}); в скобках приведены значения без обоих препаратов.", "c2h_anti": "Антимицин A блокирует комплекс III: протонный ток дыхательной цепи прекращается, потребление O₂ составляет {o2}. Остаточный Δψ ({dpsi} мВ) поддерживает ATP-синтаза, которая гидролизует ATP и переносит H⁺ из матрикса. В нейронах после добавления ротенона или стигмателлина Δψ составлял ≈ −85 мВ (Chinopoulos 2010).", "c2h_anti_f": "Антимицин A и FCCP ({f} % дозы, подобранной при титровании): перенос электронов по цепи прекращён; H⁺ из матрикса переносит только ATP-синтаза, работающая в обратном направлении, а H⁺ возвращаются через протонофор и утечку; Δψ {dpsi} мВ.", "c2h_anti_off": "Комплекс III ингибирован антимицином A {who}. Ни дыхательная цепь, ни ATP-синтаза не переносят H⁺ из матрикса, поэтому Δψ составляет {dpsi} мВ.", "c2h_pier": "Пиерицидин A блокирует комплекс I: перенос электронов от NADH невелик, потребление O₂ составляет {o2} ({o2_b}). H⁺ из матрикса переносят как дыхательная цепь, так и ATP-синтаза, работающая в обратном направлении. Δψ составляет {dpsi} мВ ({dpsi_b}).", "c2h_pier_f": "Пиерицидин A и FCCP ({f} % дозы, подобранной при титровании): H⁺, переносимые из матрикса дыхательной цепью и ATP-синтазой, работающей в обратном направлении, возвращаются с участием протонофора и по путям утечки; Δψ {dpsi} мВ ({dpsi_b}), потребление O₂ {o2}.", "c2h_pier_off": "Комплекс I ингибирован пиерицидином A {who}. Протонный ток дыхательной цепи невелик, а работа ATP-синтазы в обратном направлении отсутствует. Δψ составляет {dpsi} мВ ({dpsi_b}), потребление O₂ — {o2}.", "c2h_rho": "У клеток ρ⁰ отсутствует мтДНК и нет функциональной дыхательной цепи. Её вклад в потребление O₂ в модели составляет {o2}. Δψ {dpsi} мВ (в обычной клетке — {dpsi_0}) поддерживается электрогенным обменом через ANT: ATP⁴⁻ входит в матрикс, ADP³⁻ выходит, а F₁-АТФаза неполного комплекса ATP-синтазы гидролизует ATP. Такой обмен переносит суммарно один отрицательный заряд внутрь за цикл; переноса H⁺ через неполную синтазу здесь нет (Appleby 1999; Buchet & Godinot 1998).", "c2h_rho_o": "В модельном образце ρ⁰ олигомицин не изменяет Δψ: {dpsi} мВ. Полноценный комплекс F₀F₁ отсутствует; потенциал поддерживается электрогенным обменом через ANT в сочетании с гидролизом ATP на F₁ (Appleby 1999; Buchet & Godinot 1998).", "c2h_rho_f": "FCCP ({f} % опорной дозы) увеличивает протонную проводимость внутренней мембраны клеток ρ⁰ и ослабляет потенциал, поддерживаемый электрогенным обменом ANT: Δψ {dpsi} мВ (без добавок — {dpsi_rho}).", "c2h_rho_bka": "Бонкрековая кислота блокирует ANT в клетках ρ⁰: электрогенный обмен ATP⁴⁻/ADP³⁻ остановлен, других механизмов поддержания потенциала в модели не предусмотрено, Δψ {dpsi} мВ (ρ⁰ без добавок — {dpsi_rho} мВ).", "c2h_ca": "Условная нагрузка Ca²⁺ ×{caL} увеличивает вход положительных зарядов через MCU. Δψ составляет {dpsi} мВ (исходно при обычной нагрузке — {dpsi_ref}), потребление O₂ дыхательной цепью — {o2} (исходно — {o2_ref}).", "c2h_ca_ru": "Нагрузка Ca²⁺ ×{caL} при ингибиторе MCU: Δψ {dpsi} мВ (исходный {dpsi_ref} мВ), потребление O₂ {o2} (исходное {o2_ref}).", "c2h_ru": "Ингибитор MCU при обычной нагрузке Ca²⁺: Δψ {dpsi} мВ (исходный {dpsi_ref} мВ) и потребление O₂ {o2} (исходное {o2_ref}) изменились слабо — Δψ менее чем на 1 мВ, O₂ примерно на 2 %: базальный ток Ca²⁺ составляет около 1,5 % протонного тока.", "c2a_hid": "Поступление ATP из митохондрий при повышенной нагрузке Ca²⁺ не рассчитывается: оно зависит от ускорения реакций, катализируемых дегидрогеназами матрикса, под действием Ca²⁺ (вопрос 3), которое здесь не моделируется; на схеме поток ATP показан серым.", "c2a_blk_r": "ATP из митохондрий не поступает: у клеток ρ⁰ нет субъединиц F₀ (ATP6, ATP8), ATP-синтаза неполная.", "c2a_blk_o": "ATP из митохондрий не поступает: F₀ заблокирован олигомицином.", "c2a_blk_b": "ATP из митохондрий не поступает: обмен ADP/ATP заблокирован бонкрековой кислотой.", "c2a_blk_ob": "ATP из митохондрий не поступает: заблокированы и F₀ (олигомицин), и обмен ADP/ATP (бонкрековая кислота).", "c2a_low_rev": "Поступление ATP из митохондрий в цитоплазму прекращается. При модуле Δψ {adp} мВ ATP-синтаза в модели гидролизует ATP и переносит H⁺ из матрикса. Ориентир изменения направления обмена через ANT около 108 мВ относится к выбранным условиям; изменения направления работы синтазы и обмена через ANT в модели объединены.", "c2a_low": "Поступление ATP из митохондрий почти отсутствует ({syn} % заданной потребности). При модуле Δψ {adp} мВ общий условный поток синтеза и экспорта ATP близок к нулю. Отметка 108 мВ — выбранный ориентир, зависящий от условий.", "c2a_part": "Поступление ATP из митохондрий обеспечивает {syn} % заданной потребности модели (исходно — {syn0} %). При модуле Δψ {adp} мВ условный поток синтеза и экспорта ATP уменьшен.", "c2a_on": "Поступление ATP из митохондрий обеспечивает {syn} % заданной потребности модели при модуле Δψ {adp} мВ. Синтез и экспорт ATP объединены в один условный поток.", "c2i_full": "Индекс импорта через TIM23 — {imp} % максимума модели при достаточном ATP в матриксе. В поляризованных митохондриях PINK1 импортируется, обрабатывается и разрушается; условия для его накопления на наружной мембране выражены условным индексом {pink} %.", "c2i_part": "Индекс импорта через TIM23 снижен до {imp} % максимума модели при достаточном ATP в матриксе. Условный индекс предпосылок накопления PINK1 составляет {pink} %; модель не рассчитывает его количество или скорость накопления.", "c2i_stop": "Импорт через TIM23 почти прекращается ({imp} % максимума модели). Нарушение импорта и обработки PINK1 создаёт условия для накопления белка на наружной мембране. Показание {pink} % — условный индекс этих условий, а не измеренная доля PINK1.", "c2i_full_r": "Импорт белков-предшественников через TIM23 идёт ({imp} % максимума) при Δψ {dpsi} мВ: в клетках ρ⁰ белки, кодируемые ядерным геномом, импортируются, хотя |Δψ| не больше ≈ 67 мВ (верхняя оценка по накоплению TPMP⁺; Appleby 1999).", "c2i_part_r": "Импорт белков-предшественников через TIM23 снижен до {imp} % максимума: |Δψ| {adp_eq} мВ ниже верхней оценки модуля Δψ клеток ρ⁰ (≈ 67 мВ; Appleby 1999), у которых белки, кодируемые ядерным геномом, импортируются; форма зависимости условная.", "c2i_stop_r": "Импорт белков-предшественников через TIM23 практически остановлен ({imp} % максимума): Δψ {dpsi} мВ.", "c2c_up": "Вход Ca²⁺ через MCU {ca} (исходный 1,00): ток Ca²⁺ растёт вместе с |Δψ| и не связан с гидролизом ATP (Kirichok 2004); крутизна зависимости в модели условная.", "c2c_dn": "Вход Ca²⁺ через MCU {ca} (исходный 1,00): ток Ca²⁺ снижается вместе с |Δψ|; порога у MCU в модели нет.", "c2c_0": "Вход Ca²⁺ через MCU {ca} (исходный 1,00).", "c2c_h": "Вход Ca²⁺ через MCU {ca} (исходный 1,00; нагрузка ×{caL}); зависимость тока от Δψ у MCU непрерывная, порога по Δψ в модели нет.", "c2c_l": "Нагрузка Ca²⁺ ×{caL} уменьшает модуль Δψ на {ddca} мВ относительно того же состояния при обычной нагрузке ({dpsi_nl} → {dpsi} мВ); вход Ca²⁺ через MCU {ca} (исходный 1,00).", "c2c_l0": "Нагрузка Ca²⁺ ×{caL} в этом состоянии не меняет Δψ в пределах точности показаний (при обычной нагрузке {dpsi_nl} мВ); вход Ca²⁺ через MCU {ca} (исходный 1,00).", "c2c_ru": "Ингибитор MCU подавляет поступление Ca²⁺ в матрикс: показание равно 0, и ток Ca²⁺ не снижает абсолютную величину Δψ.", "c2c_none": "Поступление Ca²⁺ в матрикс подавлено: показание равно 0, поэтому нагрузка Ca²⁺ в цитоплазме не влияет на Δψ.", "c2t_up"
