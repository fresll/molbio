ь нанесения, откладывают на графике; время, за которое остаётся половина исходного количества, называют периодом полужизни.","Путь распада определяют ингибиторами. Если бортезомиб замедляет убывание белка, белок разрушается протеасомой; если действует бафиломицин, нарушающий работу лизосом, — участвует лизосомный путь. Замена остатков предполагаемого дегрона, которая стабилизирует белок, указывает на его сигнал узнавания.","У метода есть ограничения. Циклогексимид останавливает синтез и короткоживущих регуляторов самой системы деградации и вызывает стресс, поэтому прослеживание ограничивают несколькими часами. Ингибиторы при больших дозах действуют и на другие мишени. Измеренный период полужизни относится к данным клеткам и условиям."],"trap":["Если белка на блоте много, значит он медленно разрушается.","Содержание белка зависит и от синтеза, и от распада; скорость распада измеряют отдельно, остановив синтез и проследив убывание белка во времени."],"conditions":"Схема метода, условные пиктограммы и кривые — не данные конкретного эксперимента. Пример с IκBα — по Henkel 1993 и Chen 1995 (рефераты; клетки HeLa, TNFα, циклогексимид). Ограничения метода — общие для прослеживания с циклогексимидом; восстановление протеасом при их ингибировании — Radhakrishnan 2010 (реферат).","sources":["Henkel1993","Chen1995","Radhakrishnan2010"],"quiz":{"id":"S11-L12","rev":1,"question":"Клетки обработали циклогексимидом и через 0, 30 и 60 мин измерили белок X. Через 30 мин осталась половина исходного количества. В параллельных чашках с бортезомибом через 60 мин белка X почти столько же, сколько в начале. Какой вывод следует?","options":[{"id":"S11-L12-1","text":"X стабилен, его синтез идёт быстро","correct":false,"feedback":"Синтез остановлен циклогексимидом, поэтому сохранение белка не может объясняться синтезом; в контроле X убывает с периодом полужизни 30 мин."},{"id":"S11-L12-2","text":"X разрушается в основном протеасомой","correct":true,"feedback":"При остановленном синтезе X убывает с периодом полужизни 30 мин, а ингибитор протеасомы почти останавливает это убывание."},{"id":"S11-L12-3","text":"X разрушается в основном в лизосомах","correct":false,"feedback":"Бортезомиб ингибирует протеасому, а не лизосомы; чтобы проверить лизосомный путь, нужен ингибитор лизосом."}]},"widget":{"kind":"cards","title":"","s":{"title":"Измерение распада белка","status":"Схема метода · условные пиктограммы","opts":["Прослеживание с циклогексимидом","Кривая и период полужизни","Ингибитор протеасомы","Замена в дегроне"],"opts_label":"Этап или приём","heads":["Что измеряют","Как","Контроль","Граница вывода"],"fixed":"Пиктограммы и кривые условны: они показывают устройство метода, а не данные конкретного эксперимента.","cards":[{"v":["Содержание белка после остановки синтеза.","Добавляют циклогексимид, отбирают пробы через равные промежутки, делают иммуноблот.","Актин как контроль количества нанесённого белка и проба, взятая в момент 0.","Циклогексимид вызывает стресс; длительное прослеживание искажает результат."],"note":"Пока синтез остановлен, содержание белка меняется только за счёт распада.","pic":{"kind":"steps","steps":["циклогексимид:\nсинтез остановлен","пробы:\n0, 15, 30, 60 мин","иммуноблот","интенсивность\nполос"],"hl":0}},{"v":["Скорость убывания и период полужизни.","Интенсивности полос, нормированные на актин, откладывают против времени.","Сравнение с белком известной устойчивости.","Период полужизни относится к данным клеткам и условиям."],"note":"Время, за которое остаётся половина белка, — период полужизни.","pic":{"kind":"lines","xlab":"время после циклогексимида, мин","ylab":"% от исходного","xmax":60,"ymax":100,"xticks":[0,15,30,45,60],"yticks":[0,50,100],"series":[{"name":"короткоживущий белок","pts":[[0,100],[15,71],[30,50],[45,35],[60,25]]},{"name":"устойчивый белок","pts":[[0,100],[30,97],[60,94]],"dash":true,"dy":-10}],"cap":"условные кривые"}},{"v":["Путь распада.","Параллельные чашки с бортезомибом или с ингибитором лизосом.","Чашка без ингибитора в те же моменты.","При больших дозах ингибиторы действуют и на другие мишени; при ингибировании протеасомы NRF1 повышает синтез её субъединиц."],"note":"Если ингибитор протеасомы останавливает убывание белка, белок разрушается протеасомой.","pic":{"kind":"lines","xlab":"время после циклогексимида, мин","ylab":"% от исходного","xmax":60,"ymax":100,"xticks":[0,30,60],"yticks":[0,50,100],"series":[{"name":"без ингибитора","pts":[[0,100],[30,50],[60,25]]},{"name":"+ бортезомиб","pts":[[0,100],[30,96],[60,92]],"dash":true,"dy":-10}],"cap":"условные кривые"}},{"v":["Сигнал узнавания.","Заменяют остатки предполагаемого дегрона и повторяют прослеживание.","Белок дикого типа в тех же условиях.","Замена может нарушить сворачивание белка, а не только узнавание дегрона."],"note":"Стабилизация мутанта указывает, что заменённые остатки входят в дегрон. На пиктограмме ДТ — IκBα дикого типа, AA — IκBα S32A/S36A.","pic":{"kind":"gel","title":"IκBα: минуты после TNFα","lanes":["0","20","0","20"],"lanes2":["ДТ","ДТ","AA","AA"],"bands":[[0,0.45,1],[1,0.45,0.05],[2,0.45,1],[3,0.45,0.95]],"marks":[[0.45,"IκBα"]]}}]}}},{"id":"glycan-code","number":13,"section":2,"question":3,"questions":[3],"title":"Как N-гликан становится меткой состояния белка в ЭПР","keywords":["N-гликозилирование","секвон","олигосахарилтрансфераза","OST","STT3A","STT3B","долихол","Glc3Man9GlcNAc2","SNFG"],"lead":["Почти каждый белок, поступающий в секреторный путь, получает в ЭПР крупный N-гликан. Его состав меняется по мере сворачивания белка, поэтому гликан служит меткой, по которой ферменты и лектины ЭПР определяют состояние белка."],"mechanism":["Гликан-предшественник [[T32|Glc₃Man₉GlcNAc₂]] собирается на мембране ЭПР на липидном носителе — долихолпирофосфате (Dol-PP).","[[T31|Олигосахарилтрансфераза]] переносит его целиком на остаток Asn растущей цепи, если этот Asn входит в [[T30|секвон]] Asn–X–Ser/Thr (X — не пролин).","[[T33|Глюкозидазы I и II]] сразу начинают отщеплять глюкозы, и каждая форма гликана узнаётся своими ферментами и лектинами."],"paragraphs":["Сборка гликана начинается на цитоплазматической стороне мембраны ЭПР. Здесь к долихолфосфату (Dol-P) присоединяется GlcNAc-фосфат, и на образовавшемся долихолпирофосфате (Dol-PP) собирается Man₅GlcNAc₂. Затем он переносится на люминальную сторону, где присоединяются ещё четыре маннозы и три глюкозы; их доноры — Dol-P-Man и Dol-P-Glc. В сборке участвуют более тридцати белков. Готовый предшественник Glc₃Man₉GlcNAc₂ олигосахарилтрансфераза (OST) переносит с Dol-PP на белок одним блоком.","Гликан присоединяется только к Asn секвона Asn–X–Ser/Thr; встречается и Asn–X–Cys, а X — любая аминокислота, кроме пролина. У человека два комплекса OST. OST-A с каталитической субъединицей STT3A связан с транслоконом Sec61 и гликозилирует цепь по мере её поступления в ЭПР. OST-B со STT3B гликозилирует посттрансляционно сайты, пропущенные OST-A; для этого сайт должен остаться доступным и не оказаться внутри свёрнутой структуры.","Сразу после переноса глюкозидаза I отщепляет крайнюю глюкозу, глюкозидаза II — вторую. Гликан с одной глюкозой связывают лектины-шапероны калнексин и кальретикулин, и с этого момента состав гликана сообщает, на каком этапе находится белок.","Схема показывает один гликан, хотя у многих белков их несколько. Сам гликан не меняет судьбу белка: значение метки определяют ферменты, которые её изменяют, и лектины, которые её узнают."],"trap":["N-гликан нужен белку прежде всего для растворимости и прикрепляется к любому остатку аспарагина.","Гликан переносится только на Asn секвона Asn–X–Ser/Thr (X — не пролин), а в ЭПР он служит меткой сворачивания: отщепление и возвращение глюкозы и отщепление маннозы определяют связывание с лектинами-шаперонами и с лектинами ERAD."],"conditions":"Схема механизма; клетки млекопитающих. Сборка гликана, секвон и работа OST-A и OST-B описаны по обзору Guay 2025 (полный текст) и работе Ruiz-Canada 2009 (клетки млекопитающих; прочитана аннотация). Донор OST — олигосахарид на Dol-PP (Ramírez 2022, структура OST дрожжей; реферат). Символы гликана — номенклатура SNFG; на схеме показан один гликан из нескольких.","sources":["Guay2025","RuizCanada2009","Hebert1995","Ramirez2022"],"quiz":{"id":"S11-L13","rev":1,"question":"В белке, поступающем в ЭПР, последовательность Asn–Ala–Thr заменили на Asn–Pro–Thr. Будет ли OST переносить гликан на этот остаток Asn?","options":[{"id":"S11-L13-1","text":"Нет: в секвоне на месте X не может стоять пролин","correct":true,"feedback":"Секвон имеет вид Asn–X–Ser/Thr, где X — любая аминокислота, кроме пролина. При Asn–Pro–Thr OST этот Asn не гликозилирует."},{"id":"S11-L13-2","text":"Да: для переноса достаточно Asn и Thr рядом","correct":false,"feedback":"Кроме Asn и Ser/Thr важен и средний остаток: пролин в положении X не допускает гликозилирования."},{"id":"S11-L13-3","text":"Да, но только посттрансляционно, комплексом OST-B","correct":false,"feedback":"OST-B гликозилирует посттрансляционно доступные секвоны, пропущенные OST-A. Asn–Pro–Thr секвоном не является ни для OST-A, ни для OST-B."}]},"widget":{"kind":"glycan","title":"","s":{"zone":"просвет ЭПР","protein":"полипептид","links":true,"branch":[{"at":"M3","t":"ветвь A","dy":-22},{"at":"M6","t":"B","dy":-18,"dx":0},{"at":"M8","t":"C","dy":20,"dx":-28}],"lg_glcnac":"GlcNAc","lg_man":"манноза","lg_glc":"глюкоза","title":"N-гликан от переноса на Asn до снятия глюкоз","status":"Схема механизма · символы SNFG","opts_label":"Этап","opts":["Перенос OST","После глюкозидазы I","После глюкозидазы II","Последняя глюкоза снята"],"lg_hl":"жёлтая обводка — мишень фермента или лектина","fixed":"Показан один гликан. Подписи связей (α1,2, α1,3, α1,6, β1,4) видны на широком экране.","st":[{"show":["N1","N2","M1","M2","M3","M4","G1","G2","G3","M5","M6","M7","M8","M9"],"hl":["G3"],"m":[["Форма гликана","Glc₃Man₉GlcNAc₂"],["Связывание с калнексином","нет"]],"note":"OST перенесла на Asn весь предшественник: две GlcNAc, девять маннозных и три глюкозных остатка. Глюкозидаза I отщепляет крайнюю α1,2-глюкозу."},{"show":["N1","N2","M1","M2","M3","M4","G1","G2","M5","M6","M7","M8","M9"],"hl":["G2"],"m":[["Форма гликана","Glc₂Man₉GlcNAc₂"],["Связывание с калнексином","нет"]],"note":"Осталось две глюкозы. Глюкозидаза II отщепляет следующую, α1,3-связанную глюкозу."},{"show":["N1","N2","M1","M2","M3","M4","G1","M5","M6","M7","M8","M9"],"hl":["G1"],"bound":"калнексин","m":[["Форма гликана","Glc₁Man₉GlcNAc₂"],["Связывание с калнексином","есть"]],"note":"Гликан с одной глюкозой связывают калнексин и кальретикулин. Белок удерживается рядом с ними и с ERp57, пока сворачивается."},{"show":["N1","N2","M1","M2","M3","M4","M5","M6","M7","M8","M9"],"hl":[],"m":[["Форма гликана","Man₉GlcNAc₂"],["Связывание с калнексином","нет"]],"note":"Глюкозидаза II сняла последнюю глюкозу, и белок отходит от лектина. Дальнейшая судьба зависит от того, свернулся ли он (следующий шаг)."}]}}},{"id":"calnexin-cycle","number":14,"section":2,"question":3,"questions":[3],"title":"Как глюкоза возвращает несвёрнутый белок к калнексину","keywords":["калнексин","кальретикулин","ERp57","UGGT1","глюкозидаза II","цикл калнексина","реглюкозилирование","кастаноспермин"],"lead":["Калнексин и кальретикулин узнают не форму белка, а гликан с одной глюкозой. Возвращать глюкозу или нет, определяет [[T36|UGGT1]] — фермент, который различает свёрнутый и несвёрнутый белок."],"mechanism":["[[T34|Калнексин и кальретикулин]] связывают гликан Glc₁Man₉GlcNAc₂; с ними работает оксидоредуктаза [[T35|ERp57]].","[[T33|Глюкозидаза II]] снимает последнюю глюкозу, и белок отходит от лектина.","UGGT1 возвращает одну глюкозу только несвёрнутому белку, и он снова входит в цикл калнексина; свёрнутый белок выходит из ЭПР."],"paragraphs":["Калнексин — мембранный белок ЭПР, кальретикулин — его растворимый гомолог в просвете ЭПР. Оба связывают гликан с одной глюкозой. В экспериментах с микросомами и гемагглютинином вируса гриппа связывание с калнексином было специфичным именно для моноглюкозилированного гликана, а освобождение свёрнутого белка требовало снятия последней глюкозы глюкозидазой II (Hebert 1995).","Пока белок связан с лектином, он не агрегирует и находится рядом с ERp57, которая участвует в образовании и перестройке дисульфидных связей. После отщепления глюкозы белок свободен. Если он свернулся, гликан остаётся без глюкозы, и белок покидает ЭПР.","Если белок не свёрнут, его узнаёт UGGT1. Этот фермент присоединяет глюкозу к гликанам Man₇₋₉GlcNAc₂ только у белков с открытыми гидрофобными участками, а в экспериментах in vitro лучше всего модифицировал частично свёрнутые формы (Sousa 1995; Caramelo 2003). Так образуется цикл: глюкоза снимается и возвращается, пока белок не свернётся или пока его гликан не изменится иначе — за счёт отщепления маннозы (следующий шаг).","Ингибиторы глюкозидаз, например кастаноспермин, не дают образоваться гликану с одной глюкозой, и белок минует цикл калнексина. У человека есть и UGGT2; её роль изучена меньше."],"trap":["Калнексин, как и Hsp70, узнаёт гидрофобные участки несвёрнутого белка.","Калнексин и кальретикулин — лектины: они узнают гликан с одной глюкозой. Свёрнутость белка «проверяет» UGGT1, которая возвращает глюкозу только несвёрнутому белку."],"conditions":"Схема механизма, качественные состояния. Специфичность калнексина к моноглюкозилированному гликану — Hebert 1995 (микросомы поджелудочной железы собаки, гемагглютинин; прочитана аннотация). Узнавание несвёрнутого белка UGGT — Sousa 1995 и Caramelo 2003 (очищенный фермент и модельные белки in vitro; прочитаны аннотации). UGGT1 и UGGT2 у человека — обзор Guay 2025.","sources":["Hebert1995","Sousa1995","Caramelo2003","Guay2025"],"quiz":{"id":"S11-L14","rev":1,"question":"Несвёрнутый гликопротеин отошёл от калнексина после того, как глюкозидаза II сняла последнюю глюкозу. Что произойдёт с его гликаном, если UGGT1 работает?","options":[{"id":"S11-L14-1","text":"UGGT1 вернёт три глюкозы, как у предшественника","correct":false,"feedback":"UGGT1 присоединяет к гликану одну глюкозу, а не восстанавливает исходные три. Гликан с одной глюкозой и узнают калнексин и кальретикулин."},{"id":"S11-L14-2","text":"UGGT1 вернёт одну глюкозу, и белок снова свяжется с калнексином","correct":true,"feedback":"UGGT1 модифицирует только несвёрнутый белок. Одна глюкоза восстанавливает форму Glc₁Man₉GlcNAc₂, и белок снова входит в цикл калнексина."},{"id":"S11-L14-3","text":"Гликан останется без глюкозы, и белок выйдет в аппарат Гольджи","correct":false,"feedback":"Так происходит со свёрнутым белком: UGGT1 его не узнаёт. Несвёрнутый белок с открытыми гидрофобными участками UGGT1 узнаёт."}]},"widget":{"kind":"net","title":"","s":{"title":"Цикл калнексина: глюкоза возвращается только к несвёрнутому белку","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Белок","opts":["Не свёрнут","Свёрнут","Не свёрнут + ингибитор глюкозидаз"]}],"W":600,"H":340,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","rx":"химическое превращение гликана","bind":"связывание","seq":"путь белка, порядок событий","tr":"перенос белка через мембрану","nodes":["жёлтая рамка — звено работает","пунктирная рамка — не работает или не участвует","красный крест — звено заблокировано"]},"zones":[{"x":6,"y":6,"w":588,"h":328,"c":"er","t":"просвет ЭПР","lx":16,"ly":326,"n":[4,4,332,372,12,368]}],"nodes":{"gp":{"p":[230,70,200,50],"t":"белок с гликаном\nGlc₁Man₉GlcNAc₂","n":[108,60,140,52],"fs":15,"tn":"белок с гликаном\nGlc₁Man₉GlcNAc₂"},"cnx":{"p":[480,70,200,50],"t":"калнексин /\nкальретикулин + ERp57","n":[274,60,116,64],"fs":14,"tn":"калнексин /\nкальретикулин\n+ ERp57"},"gls":{"p":[480,155,170,40],"t":"глюкозидаза II","n":[262,150,140,44],"fs":15,"tn":"глюкозидаза\nII"},"man9":{"p":[230,240,200,50],"t":"белок с гликаном\nMan₉GlcNAc₂","n":[108,240,140,52],"fs":15},"uggt":{"p":[70,155,100,40],"t":"UGGT1","n":[38,150,56,32],"fs":15},"exit":{"p":[480,300,200,40],"t":"выход в Гольджи","n":[262,330,128,50],"fs":14,"tn":"выход\nв Гольджи"}},"edges":{"b":{"a":"gp","b":"cnx","k":"bind","t":"связывание","tn":"","d":[0,-12]},"rx1":{"a":"gp","b":"man9","k":"rx","bend":-56,"bn":-24},"g":{"a":"gls","b":[262,155,128,150],"k":"act"},"rx2":{"a":"man9","b":"gp","k":"rx","bend":-56,"bn":-24},"u":{"a":"uggt","b":[198,155,94,150],"k":"act"},"ex":{"a":"man9","b":"exit","k":"seq","t":"свёрнут","d":[0,18],"ao":[100,10],"bo":[-100,-8]}},"notes_svg":[{"x":296,"y":128,"t":"− Glc","b":true,"n":[134,122]},{"x":168,"y":128,"t":"+ Glc","a":"end","b":true,"n":[84,122]}],"st":{"0":{"n":{"gp":"on","cnx":"on","gls":"on","man9":"on","uggt":"on","exit":"off"},"e":{"ex":"off"},"m":[["UGGT1","возвращает глюкозу"],["Выход из ЭПР","нет"]],"note":"Глюкозидаза II снимает глюкозу, белок отходит от калнексина, но UGGT1 узнаёт открытые гидрофобные участки несвёрнутого белка и возвращает одну глюкозу. Белок снова связывается с калнексином или кальретикулином и получает новую попытку свернуться."},"1":{"n":{"gp":"base","cnx":"base","gls":"on","man9":"on","uggt":"off","exit":"on"},"e":{"rx2":"off","u":"off","b":"off"},"m":[["UGGT1","не модифицирует белок"],["Выход из ЭПР","есть"]],"note":"У свёрнутого белка нет открытых гидрофобных участков, и UGGT1 не возвращает глюкозу. Гликан остаётся без глюкозы, белок не связывается с калнексином и выходит из ЭПР по секреторному пути."},"2":{"t":{"gp":"белок с гликаном\nGlc₃Man₉GlcNAc₂"},"tn":{"gp":"белок с гликаном\nGlc₃Man₉GlcNAc₂"},"n":{"gp":"on","cnx":"off","gls":"abs","man9":"off","uggt":"off","exit":"off"},"e":{"b":"off","rx1":"off","g":"off","rx2":"off","u":"off","ex":"off"},"m":[["Связывание с калнексином","нет"],["Цикл калнексина","не идёт"]],"note":"Если глюкозидазы ингибированы (например, кастаноспермином), глюкозы не отщепляются. Гликан с тремя глюкозами калнексин и кальретикулин не связывают, и белок не проходит цикл калнексина."}}}}},{"id":"mannose-timer","number":15,"section":2,"question":3,"questions":[3],"title":"Как отщепление маннозы направляет белок на деградацию","keywords":["EDEM1","EDEM2","EDEM3","TXNDC11","маннозидаза","Man8B","Man7","α1,6-манноза","OS-9","XTP3-B","кифунензин","таймер"],"lead":["Пока глюкоза возвращается и снимается, медленно идёт и другой процесс — отщепление маннозы. Белок, который долго не сворачивается, теряет маннозы, и его гликан становится сигналом для лектинов ERAD."],"mechanism":["[[T37|EDEM2]] в комплексе с TXNDC11 отщепляет маннозу ветви B: образуется Man₈B.","EDEM3 и EDEM1 отщепляют маннозу ветви C, и на гликане открывается α1,6-связанная манноза.","Такой гликан узнают лектины [[T38|OS-9 и XTP3-B]] и передают белок комплексу [[T40|SEL1L–HRD1]]; [[T44|кифунензин]] подавляет отщепление маннозы."],"paragraphs":["Отщепление глюкозы и её возвращение идут быстро, а отщепление маннозы — медленно. Поэтому в ЭПР одновременно работают два «часовых механизма»: быстрый цикл глюкозы даёт белку новые попытки свернуться, а медленное отщепление маннозы ограничивает время, которое белок может провести в ЭПР.","По современной модели первую маннозу — на ветви B — отщепляет EDEM2, связанная дисульфидной связью с оксидоредуктазой TXNDC11 (Ninagawa 2014, клетки HCT116 и DT40; Guay 2025). Затем EDEM3 и EDEM1 удаляют маннозу ветви C и открывают α1,6-связанную маннозу. Активность EDEM1 и EDEM2 выше у несвёрнутых белков, поэтому отщепление маннозы касается прежде всего белков, которые долго не сворачиваются.","Гликан с открытой α1,6-маннозой узнаёт домен MRH лектина OS-9 (Hosokawa 2009, клетки человека, субстрат NHK). OS-9 и XTP3-B через SEL1L передают субстрат убиквитинлигазе HRD1 (Christianson 2008). У дрожжей такой сигнал создаёт маннозидаза Htm1, а распознаёт лектин Yos9 (Quan 2008).","Кифунензин подавляет α1,2-маннозидазы класса I. В клетках гепатомы он останавливал распад несвёрнутого α1-антитрипсина (Liu 1999). Это показывает, что для ERAD этого гликопротеина отщепление маннозы необходимо, хотя и не доказывает, какой именно фермент его выполняет."],"trap":["Белок отправляется на ERAD сразу, как только калнексин обнаружил, что он не свёрнут.","Несвёрнутый белок сначала проходит цикл калнексина. Сигналом к ERAD становится медленное отщепление маннозы: Man₇ с открытой α1,6-маннозой узнаёт OS-9, и только тогда белок передаётся SEL1L–HRD1."],"conditions":"Схема механизма; символы SNFG. Первый шаг EDEM2 — Ninagawa 2014 (нокауты в клетках HCT116 человека и DT40 курицы; прочитана аннотация); последовательность EDEM2 → EDEM3/EDEM1 и узнавание OS-9 и XTP3-B — обзор Guay 2025 (полный текст). Узнавание открытой α1,6-маннозы OS-9 — Hosokawa 2009, передача субстрата Hrd1–SEL1L — Christianson 2008 (клетки человека, субстрат NHK; аннотации). Кифунензин — Liu 1999 (клетки гепатомы; аннотация). Число отщепляемых маннозных остатков у разных субстратов различается; схема упрощена.","sources":["Ninagawa2014","Guay2025","Hosokawa2009","Christianson2008","Quan2008","Liu1999"],"quiz":{"id":"S11-L15","rev":1,"question":"Клетки, в которых синтезируется несвёрнутый NHK, обработали кифунензином. Как изменится скорость распада NHK?","options":[{"id":"S11-L15-1","text":"Возрастёт: несвёрнутый белок быстрее покинет цикл калнексина","correct":false,"feedback":"Выход из цикла калнексина на ERAD зависит от отщепления маннозы, а кифунензин его подавляет. Ускориться распад не может."},{"id":"S11-L15-2","text":"Не изменится: NHK узнаётся по гидрофобным участкам, а не по гликану","correct":false,"feedback":"Для ERAD гликопротеина NHK нужен гликан с отщеплёнными маннозами: без него распад тормозится (Liu 1999)."},{"id":"S11-L15-3","text":"Снизится: гликан Man₇ с открытой α1,6-маннозой почти не образуется","correct":true,"feedback":"Кифунензин подавляет α1,2-маннозидазы. Без отщепления маннозы не возникает сигнал для OS-9, белок остаётся в цикле калнексина, и распад замедляется."}]},"widget":{"kind":"glycan","title":"","s":{"zone":"просвет ЭПР","protein":"полипептид","links":true,"branch":[{"at":"M3","t":"ветвь A","dy":-22},{"at":"M6","t":"B","dy":-18,"dx":0},{"at":"M8","t":"C","dy":20,"dx":-28}],"lg_glcnac":"GlcNAc","lg_man":"манноза","lg_glc":"глюкоза","title":"Отщепление маннозы: сигнал для лектина OS-9","status":"Схема механизма · символы SNFG","opts_label":"Состояние гликана","opts":["Man₉","Man₈B после EDEM2","Man₇: открыта α1,6-манноза","Кифунензин"],"lg_hl":"жёлтая обводка — мишень фермента или лектина","fixed":"Показан один гликан; у NHK их три. Порядок отщепления упрощён.","st":[{"show":["N1","N2","M1","M2","M3","M4","M5","M6","M7","M8","M9"],"hl":["M7"],"m":[["Форма гликана","Man₉GlcNAc₂"],["Связывание с OS-9","слабое"]],"note":"Глюкоз на гликане нет, все девять маннозных остатков на месте. EDEM2 отщепляет α1,2-маннозу на конце ветви B."},{"show":["N1","N2","M1","M2","M3","M4","M5","M6","M8","M9"],"hl":["M9"],"m":[["Форма гликана","Man₈GlcNAc₂ (Man₈B)"],["Связывание с OS-9","слабое"]],"note":"После EDEM2 осталось восемь маннозных остатков. EDEM3 и EDEM1 отщепляют α1,2-маннозу ветви C."},{"show":["N1","N2","M1","M2","M3","M4","M5","M6","M8"],"hl":["M8"],"bound":"OS-9 / XTP3-B","m":[["Форма гликана","Man₇GlcNAc₂"],["Связывание с OS-9","есть"]],"note":"На ветви C открыта α1,6-связанная манноза. Такой гликан узнаёт домен MRH лектина OS-9 (и XTP3-B), и белок передаётся комплексу SEL1L–HRD1."},{"show":["N1","N2","M1","M2","M3","M4","M5","M6","M7","M8","M9"],"hl":[],"dim":[],"m":[["Форма гликана","Man₉GlcNAc₂"],["Связывание с OS-9","слабое"]],"note":"Кифунензин подавляет α1,2-маннозидазы: маннозы не отщепляются, сигнал для OS-9 не образуется, и несвёрнутый белок дольше остаётся в цикле калнексина."}]}}},{"id":"erad-machine","number":16,"section":2,"question":3,"questions":[3],"title":"Как дефектный белок покидает ЭПР и разрушается в цитозоле","keywords":["ERAD","ретротранслокация","HRD1","SEL1L","DERL2","p97","VCP","UFD1","NPL4","NGLY1","CB-5083","ERAD-L","ERAD-M","ERAD-C"],"lead":["Протеасома находится в цитозоле, а дефектный гликопротеин — в просвете ЭПР. [[T39|ERAD]] переносит его через мембрану, убиквитинирует, извлекает из мембраны и передаёт протеасоме."],"mechanism":["Лектины OS-9 и XTP3-B через SEL1L передают субстрат комплексу [[T40|SEL1L–HRD1]], который служит каналом и убиквитинлигазой E3.","На цитоплазматической стороне HRD1 вместе с ферментами E2 строит на субстрате цепь убиквитина; ATPаза [[T41|p97]] с UFD1–NPL4 связывает цепь и извлекает белок из мембраны.","[[T42|NGLY1]] снимает с белка гликан, и его разрушает 26S-протеасома — та же, что разрушает белки цитозоля."],"paragraphs":["Перенос белка из просвета ЭПР в цитозоль называют ретротранслокацией. Для растворимых субстратов с повреждением в просвете ЭПР главный путь проходит через убиквитинлигазу HRD1. У дрожжей Hrd1 образует в мембране канал вместе с Der1 (Schoebel 2017), у млекопитающих канал, вероятно, образуют трансмембранные части HRD1, DERL2 и HERP (Christianson 2023). Белки с повреждением в мембранном или цитоплазматическом домене могут использовать другие лигазы. У дрожжей пути ERAD-L, ERAD-M и ERAD-C различаются набором убиквитинлигазных комплексов (Carvalho 2006).","Как только участок белка выходит в цитозоль, HRD1 с ферментами E2 присоединяет к нему убиквитин. Цепь связывает p97 (VCP; у дрожжей Cdc48) с кофакторами UFD1 и NPL4. За счёт гидролиза ATP p97 протягивает белок через свою центральную пору и разворачивает его (Bodnar 2017, реконструкция с дрожжевыми белками).","В цитозоле NGLY1 отщепляет гликан, и 26S-протеасома разрушает белок. Если звено нарушено, белок накапливается в разной форме. Без HRD1 он задерживается в ЭПР без убиквитина. При блоке p97 он убиквитинирован, но остаётся связанным с мембраной и несёт гликан. При блоке протеасомы он попадает в цитозоль без гликана.","Эти различия позволяют найти нарушенное звено экспериментально. Ингибиторы при этом действуют не только на ERAD: CB-5083 и бортезомиб вызывают накопление многих убиквитинированных белков и стресс ЭПР."],"trap":["Дефектный белок разрушается прямо в просвете ЭПР, где он и обнаружен.","В ЭПР нет протеасом. Белок переносится через мембрану при участии SEL1L–HRD1, убиквитинируется, извлекается p97 и разрушается 26S-протеасомой в цитозоле."],"conditions":"Схема механизма, качественные состояния; клетки млекопитающих. Структура канала Hrd1 — у дрожжей (Schoebel 2017; аннотация); состав канала у млекопитающих и порядок событий — обзор Christianson 2023 (полный текст). Работа p97 — реконструкция с дрожжевыми белками (Bodnar 2017; аннотация). Роль HRD1–SEL1L в распаде NHK — клетки человека (Christianson 2008); CB-5083 — опухолевые клетки (Anderson 2015). Пути ERAD-L/-M/-C определены у дрожжей (Carvalho 2006).","sources":["Christianson2023","Schoebel2017","Bodnar2017","Christianson2008","Anderson2015","Carvalho2006"],"quiz":{"id":"S11-L16","rev":1,"question":"В клетках с NHK снизили содержание HRD1. В какой форме NHK будет накапливаться?","options":[{"id":"S11-L16-1","text":"В цитозоле без гликана, в убиквитинированной форме","correct":false,"feedback":"Так выглядит блок протеасомы: белок уже прошёл мембрану и потерял гликан. Без HRD1 белок через мембрану не проходит."},{"id":"S11-L16-2","text":"В просвете ЭПР с гликаном и почти без убиквитина","correct":true,"feedback":"HRD1 нужен и для ретротранслокации, и для убиквитинирования. Без него NHK узнаётся OS-9, но остаётся в ЭПР с высокоманнозным гликаном и почти не убиквитинируется."},{"id":"S11-L16-3","text":"В среде: NHK будет секретирован вместо распада","correct":false,"feedback":"Нарушение ERAD не делает несвёрнутый белок свёрнутым. NHK по-прежнему не проходит контроль качества и в аппарат Гольджи не выходит."}]},"widget":{"kind":"net","title":"","s":{"title":"ERAD: от лектина в просвете ЭПР до протеасомы в цитозоле","status":"Схема механизма · качественные состояния","ctrls":[{"id":"b","type":"group","label":"Нарушенное звено","opts":["Нет","HRD1 снижен","p97: CB-5083","Протеасома: бортезомиб"]}],"W":620,"H":390,"NW":340,"NH":560,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","rx":"химическое превращение гликана","bind":"связывание","seq":"путь белка, порядок событий","tr":"перенос белка через мембрану","nodes":["жёлтая рамка — звено работает","пунктирная рамка — не работает или не участвует","красный крест — звено заблокировано"]},"zones":[{"x":6,"y":6,"w":608,"h":150,"c":"er","t":"просвет ЭПР","lx":16,"ly":26,"n":[4,4,332,196,12,24]},{"x":6,"y":186,"w":608,"h":198,"c":"cyto","t":"цитозоль","lx":16,"ly":376,"n":[4,250,332,306,12,548]}],"mem":[{"x1":6,"y1":171,"x2":614,"y2":171,"t":"мембрана ЭПР","lx":606,"ly":160,"a":"end","n":[4,216,336,216,0,0],"tn":""}],"nodes":{"sub":{"p":[115,70,170,50],"t":"NHK с гликаном\nMan₇GlcNAc₂","n":[80,60,140,50],"fs":15},"os9":{"p":[370,70,140,40],"t":"OS-9 / XTP3-B","n":[262,60,130,40],"fs":15,"tn":"OS-9 /\nXTP3-B"},"hrd":{"p":[370,171,210,50],"t":"SEL1L–HRD1\n(канал и E3)","n":[170,216,200,50],"fs":15},"ub":{"p":[120,264,180,48],"t":"цепь убиквитина\nна NHK","n":[80,340,140,48],"fs":15},"p97":{"p":[350,264,160,48],"t":"p97 + UFD1–NPL4","n":[262,340,130,48],"fs":14,"tn":"p97 +\nUFD1–NPL4"},"ngly":{"p":[572,264,80,40],"t":"NGLY1","n":[262,428,130,40],"fs":15},"prot":{"p":[430,350,180,40],"t":"26S-протеасома","n":[170,510,200,44],"fs":15}},"edges":{"b1":{"a":"sub","b":"os9","k":"bind","t":"узнавание\nгликана","tn":"","d":[0,-26]},"s1":{"a":"os9","b":"hrd","k":"seq","t":"передача через SEL1L","d":[70,0],"dn":[62,0]},"u1":{"a":"hrd","b":"ub","k":"act","t":"убиквитинирование","d":[-18,0],"anc":"end","tn":"убиквитини-\nрование","dn":[90,-2]},"x1":{"a":"ub","b":"p97","k":"bind"},"x2":{"a":"p97","b":"ngly","k":"seq","t":"извлечение","d":[0,-14]},"x3":{"a":"ngly","b":"prot","k":"seq","t":"гликан\nснят","d":[44,4],"dn":[47,-2],"ao":[-16,20],"bo":[60,-20]}},"st":{"0":{"n":{"sub":"on","os9":"on","hrd":"on","ub":"on","p97":"on","ngly":"on","prot":"on"},"m":[["Где задерживается NHK","нигде: разрушается"],["Гликан","снимается в цитозоле"],["Убиквитинированный NHK","мало"]],"note":"OS-9 узнаёт гликан Man₇ и через SEL1L передаёт NHK комплексу HRD1. Белок проходит через мембрану, HRD1 вместе с ферментами E2 строит на нём цепь убиквитина, p97 извлекает его в цитозоль, NGLY1 снимает гликан, и белок разрушает 26S-протеасома."},"1":{"n":{"sub":"on","os9":"on","hrd":"abs","ub":"off","p97":"off","ngly":"off","prot":"off"},"e":{"u1":"off","x1":"off","x2":"off","x3":"off"},"m":[["Где задерживается NHK","в просвете ЭПР"],["Гликан","высокоманнозный, сохраняется"],["Убиквитинированный NHK","почти нет"]],"note":"При сниженном содержании HRD1 белок узнаётся OS-9, но не проходит через мембрану и не убиквитинируется. NHK задерживается в ЭПР с высокоманнозным гликаном (Christianson 2008)."},"2":{"n":{"sub":"on","os9":"on","hrd":"on","ub":"on","p97":"abs","ngly":"off","prot":"off"},"e":{"x2":"off","x3":"off"},"m":[["Где задерживается NHK","у мембраны ЭПР"],["Гликан","высокоманнозный, сохраняется"],["Убиквитинированный NHK","накапливается"]],"note":"CB-5083 ингибирует ATPазу p97. NHK убиквитинирован, но не извлечён из мембраны: он остаётся связанным с ЭПР с гликаном, и убиквитинированные белки накапливаются (Anderson 2015)."},"3":{"n":{"sub":"on","os9":"on","hrd":"on","ub":"on","p97":"on","ngly":"on","prot":"abs"},"e":{"x3":"on"},"m":[["Где задерживается NHK","в цитозоле"],["Гликан","снят NGLY1"],["Убиквитинированный NHK","накапливается"]],"note":"При ингибировании протеасомы ретротранслокация и извлечение продолжаются. В цитозоле накапливается NHK без гликана в убиквитинированной форме."}}}}},{"id":"erad-disease","number":17,"section":2,"question":3,"questions":[3],"title":"Что происходит при нарушениях контроля качества в ЭПР","keywords":["α1-антитрипсин","NHK","CFTR","ΔF508","корректор","NGLY1","дефицит NGLY1","цитомегаловирус","US11","MHC I"],"lead":["Контроль качества ЭПР защищает клетку от несвёрнутых белков, но тот же механизм может лишить её белка, который частично работал бы. В разных случаях нарушается разное звено."],"mechanism":["Мутация в гене секреторного белка может нарушить его сворачивание: он задерживается в ЭПР и разрушается по пути ERAD, как NHK.","Белок со сниженной способностью сворачиваться (ΔF508-CFTR) тоже разрушается; корректоры, связывая его, повышают долю свёрнутого белка.","Нарушение самого ERAD (дефицит NGLY1) или его использование вирусом (US11 цитомегаловируса) меняет судьбу белков, проходящих этот путь."],"paragraphs":["NHK — укороченный вариант α1-антитрипсина, который не может свернуться. В клетках гепатомы мыши он задерживался в ЭПР и не секретировался (Sifers 1988), а затем разрушался протеасомой (Liu 1999). У носителя такого аллеля α1-антитрипсина в сыворотке не обнаружено. Этот пример показывает, что контроль качества задерживает белок, который не может свернуться, ещё до секреции.","Белок CFTR при мутации ΔF508 сворачивается плохо. Его незрелая форма разрушается по убиквитин-протеасомному пути, а при ингибировании протеасом накапливается в полиубиквитинированной форме (Ward 1995). Однако ингибирование ERAD не выводит на мембрану работающий канал: белок остаётся несвёрнутым. Корректоры люмакафтор и тезакафтор связываются с трансмембранным доменом TMD1 и стабилизируют его (Fiedorczuk 2022), поэтому до мембраны доходит больше свёрнутого белка.","При мутациях NGLY1 у больных отмечали задержку развития, нарушения движений, гипотонию и сниженное слёзоотделение (Enns 2014). Механизм этих проявлений обсуждается.","Белок US11 цитомегаловируса человека направляет тяжёлые цепи MHC I из ЭПР в цитозоль, где их гликан снимается и они разрушаются протеасомой (Wiertz 1996). В результате меньше молекул MHC I достигает поверхности клетки."],"trap":["При нарушении сворачивания белка в ЭПР достаточно ингибировать ERAD, и белок дойдёт до мембраны работоспособным.","Ингибирование ERAD сохраняет несвёрнутый белок в ЭПР, но не сворачивает его. Количество функционального CFTR на мембране повышают корректоры, которые стабилизируют его структуру."],"conditions":"Описания случаев по первичным работам (аннотации): NHK — клетки гепатомы мыши (Sifers 1988; Liu 1999); ΔF508-CFTR — культуры клеток (Ward 1995); механизм корректоров — криоэлектронная микроскопия очищенного CFTR (Fiedorczuk 2022); дефицит NGLY1 — описание 8 больных (Enns 2014); US11 — трансфицированные клетки человека (Wiertz 1996). Это примеры механизмов, а не рекомендации по лечению.","sources":["Sifers1988","Liu1999","Ward1995","Fiedorczuk2022","Enns2014","Wiertz1996"],"quiz":{"id":"S11-L17","rev":1,"question":"В культуре клеток с ΔF508-CFTR надо увеличить количество свёрнутого CFTR на плазматической мембране. Какое воздействие действует именно в этом направлении?","options":[{"id":"S11-L17-1","text":"Корректор, стабилизирующий структуру CFTR","correct":true,"feedback":"Корректоры связываются с CFTR и повышают долю свёрнутого белка, который проходит контроль качества и доходит до мембраны (Fiedorczuk 2022)."},{"id":"S11-L17-2","text":"Ингибитор протеасомы, останавливающий распад CFTR","correct":false,"feedback":"Ингибитор протеасомы сохраняет незрелую форму, но она остаётся несвёрнутой и накапливается в полиубиквитинированном виде, а не на мембране (Ward 1995)."},{"id":"S11-L17-3","text":"Ингибитор p97, задерживающий CFTR в мембране ЭПР","correct":false,"feedback":"Задержка извлечения не исправляет сворачивание. Несвёрнутый CFTR не проходит контроль качества и не выходит из ЭПР."}]},"widget":{"kind":"cards","title":"","s":{"title":"Где нарушена судьба белка","status":"Схема механизма · примеры по первичным работам","opts_label":"Пример","opts":["NHK (α1-антитрипсин)","ΔF508-CFTR","Дефицит NGLY1","US11 цитомегаловируса"],"heads":["Что нарушено","Что происходит с белком","Что наблюдали","Граница вывода"],"fixed":"Красная рамка — звено, на котором меняется судьба белка. Схемы упрощены.","cards":[{"v":["Белок укорочен и не может свернуться.","Проходит цикл калнексина, теряет маннозы, через SEL1L–HRD1 выводится в цитозоль и разрушается.","В клетках гепатомы белок задерживался в ЭПР и не секретировался; кифунензин и ингибитор протеасомы останавливали распад.","Это модельный субстрат; у больных с другими вариантами α1-антитрипсина белок может накапливаться в ЭПР."],"note":"Контроль качества работает правильно: несвёрнутый белок не секретируется.","pic":{"kind":"steps","steps":["синтез\nв ЭПР","цикл\nкалнексина","Man₇,\nOS-9","HRD1,\np97","протеасома"],"hl":2}},{"v":["Белок сворачивается плохо, но в принципе может свернуться.","Большая часть молекул разрушается по пути ERAD, до мембраны доходит мало.","При ингибиторах протеасомы накапливалась полиубиквитинированная незрелая форма; корректоры связываются с TMD1.","Ингибирование ERAD не создаёт свёрнутый белок; эффект корректоров зависит от мутации."],"note":"Корректор сдвигает равновесие к свёрнутой форме, и больше белка проходит контроль качества.","pic":{"kind":"steps","steps":["синтез\nв ЭПР","сворачивание\n(нарушено)","ERAD","мембрана"],"hl":1}},{"v":["Нет N-гликаназы цитозоля.","Белки, выведенные из ЭПР, не теряют гликан в цитозоле.","У больных — задержка развития, нарушения движений, гипотония, сниженное слёзоотделение.","Как отсутствие NGLY1 вызывает эти проявления, обсуждается."],"note":"Нарушено звено ERAD в цитозоле, после ретротранслокации.","pic":{"kind":"steps","steps":["HRD1","p97","NGLY1\n(нет)","протеасома"],"hl":2}},{"v":["Вирусный белок US11 направляет тяжёлые цепи MHC I на ERAD.","Молекулы MHC I выводятся в цитозоль, теряют гликан и разрушаются.","В трансфицированных клетках тяжёлые цепи появлялись в цитозоле без гликана и разрушались протеасомой.","Пример использования ERAD вирусом; другие вирусы действуют иначе."],"note":"Вирус использует нормальный механизм ERAD для удаления белка-хозяина.","pic":{"kind":"steps","steps":["MHC I\nв ЭПР","US11","выведение\nв цитозоль","протеасома"],"hl":1}}]}}},{"id":"erad-measure","number":18,"section":2,"question":3,"questions":[3],"title":"Как проследить судьбу гликопротеина: импульсная метка и Endo H","keywords":["импульсная метка","pulse-chase","прослеживание","иммунопреципитация","Endo H","PNGase F","medial-Гольджи","гель","период полужизни"],"lead":["Чтобы отличить задержку белка в ЭПР от его секреции или распада, прослеживают судьбу одной когорты меченых молекул и проверяют, какой у них гликан."],"mechanism":["Короткий импульс с ³⁵S-метионином и ³⁵S-цистеином метит только молекулы, синтезированные за эти минуты; затем метку «гасят» немечеными аминокислотами.","Через разное время белок осаждают антителами из клеток и среды и разделяют электрофорезом.","[[T43|Endo H]] отщепляет высокоманнозные и часть гибридных гликанов, но не комплексные: устойчивость к ней показывает, что белок прошёл medial-Гольджи; PNGase F снимает почти все N-гликаны."],"paragraphs":["При импульсной метке клетки несколько минут инкубируют с радиоактивными аминокислотами, затем переносят в среду с избытком немеченых. Поэтому на геле видна только когорта, синтезированная во время импульса, и её можно прослеживать часами. Убывание полосы в клетках с одновременным появлением её в среде означает секрецию, а убывание без появления в среде — разрушение.","Чтобы узнать, где находится белок, половину каждой пробы обрабатывают Endo H. Этот фермент отщепляет высокоманнозные гликаны, характерные для ЭПР и cis-Гольджи, и часть гибридных, но не комплексные, которые образуются в medial-Гольджи. Сдвиг полосы вниз после Endo H показывает, что белок ещё не прошёл medial-Гольджи. Если полоса не сдвигается после Endo H, но сдвигается после PNGase F, гликан комплексный.","Ингибиторы отдельных звеньев уточняют путь. Кифунензин замедляет распад гликопротеинов, если для него нужно отщепление маннозы. Ингибитор протеасомы показывает, что белок разрушается в цитозоле, а появление формы без гликана говорит, что он уже выведен из ЭПР.","Ограничения: метод показывает поведение всей когорты, Endo H не различает ЭПР и cis-Гольджи, а сами ингибиторы меняют клетку — например, кифунензин подавляет и маннозидазу I аппарата Гольджи, и тогда секретированный белок остаётся чувствительным к Endo H (Elbein 1990)."],"trap":["Если белок чувствителен к Endo H, значит, он находится в ЭПР, а если устойчив — значит, он уже на поверхности клетки.","Чувствительность к Endo H показывает только, что гликан высокоманнозный или гибридный, то есть ещё не комплексный: белок может быть и в ЭПР, и в cis-Гольджи. Устойчивость означает прохождение medial-Гольджи, а не обязательно выход на поверхность."],"conditions":"Схемы методов, условные пиктограммы, а не данные эксперимента. Принцип Endo H и PNGase F — общепринятый биохимический метод. Применение к NHK — Liu 1999 (клетки гепатомы; аннотация). Действие кифунензина на маннозидазу I аппарата Гольджи — Elbein 1990 (клетки MDCK и микросомы печени крысы; аннотация).","sources":["Liu1999","Elbein1990","Guay2025"],"quiz":{"id":"S11-L18","rev":1,"question":"Через 2 ч прослеживания полоса меченого гликопротеина из клеток не сдвигается после обработки Endo H, но сдвигается после обработки PNGase F. Что можно заключить?","options":[{"id":"S11-L18-1","text":"Белок находится в ЭПР: гликан высокоманнозный","correct":false,"feedback":"Высокоманнозный гликан Endo H отщепила бы, и полоса сдвинулась бы. Устойчивость к Endo H говорит о другом."},{"id":"S11-L18-2","text":"Белок потерял гликан в цитозоле после ERAD","correct":false,"feedback":"Белок без гликана не сдвигался бы и после PNGase F. Сдвиг после PNGase F показывает, что гликан на белке есть."},{"id":"S11-L18-3","text":"Белок прошёл medial-Гольджи: гликан стал комплексным","correct":true,"feedback":"Комплексный гликан Endo H не отщепляет, а PNGase F снимает. Значит, белок прошёл medial-Гольджи; где он сейчас — в Гольджи или дальше, — этот тест не показывает."}]},"widget":{"kind":"cards","title":"","s":{"title":"Импульсная метка, Endo H и ингибиторы","status":"Схема метода · условные пиктограммы","opts_label":"Метод","opts":["Импульсная метка и прослеживание","Endo H и PNGase F","Ингибиторы звеньев ERAD"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"fixed":"Полосы и кривые — условные пиктограммы метода, а не результаты эксперимента.","cards":[{"v":["Судьбу одной когорты молекул: сколько её осталось в клетках, сколько вышло в среду.","Импульс ³⁵S-аминокислот на минуты, затем избыток немеченых; пробы через разное время, иммунопреципитация, электрофорез.","Проба сразу после импульса (100 %); среда отдельно от клеток.","Показывает когорту, а не отдельную молекулу; не говорит, где именно белок разрушается."],"note":"Убывание полосы в клетках без появления её в среде означает разрушение.","pic":{"kind":"steps","steps":["импульс\n³⁵S","прослеживание\n0–4 ч","осаждение\nантителами","± Endo H","гель"],"hl":1}},{"v":["Тип гликана: высокоманнозный (ЭПР, cis-Гольджи) или комплексный (после medial-Гольджи).","Половину пробы обрабатывают Endo H или PNGase F и сравнивают подвижность.","Необработанная проба; PNGase F как контроль наличия гликана.","Endo H не различает ЭПР и cis-Гольджи; кифунензин сам меняет тип гликана."],"note":"Сдвиг после Endo H — белок ещё до medial-Гольджи; сдвиг только после PNGase F — гликан комплексный.","pic":{"kind":"gel","title":"Условная схема геля","lanes":["−","Endo H","PNGase F","−","Endo H","PNGase F"],"lanes2":["белок в ЭПР","","","белок после Гольджи","",""],"bands":[[0,0.32,1],[1,0.62,1],[2,0.62,1],[3,0.14,1],[4,0.14,1],[5,0.62,1]],"marks":[[0.14,"комплексный гликан"],[0.32,"высокоманнозный"],[0.62,"без гликана"]],"cap":"пиктограмма"}},{"v":["Какое звено нужно для распада белка.","Прослеживание с кифунензином, ингибитором p97 или протеасомы, сравнение с контролем.","Тот же белок без препарата; белок дикого типа.","Препараты действуют и на другие процессы; один ингибитор показывает участие звена, но не всю схему."],"note":"Замедление распада при кифунензине показывает участие отщепления маннозы; форма без гликана при ингибиторе протеасомы — что белок уже в цитозоле.","pic":{"kind":"lines","xlab":"время прослеживания, ч","ylab":"% в клетках","xmax":4,"ymax":100,"xticks":[0,1,2,3,4],"yticks":[0,50,100],"series":[{"name":"без препарата","pts":[[0,100],[1,70],[2,37],[3,17],[4,8]]},{"name":"кифунензин","pts":[[0,100],[1,95],[2,88],[3,81],[4,75]],"dash":true,"dy":-10}],"cap":"условные кривые"}}]}}},{"id":"autophagy-flux","number":19,"section":3,"title":"Что называют аутофагическим потоком","question":4,"questions":[4],"keywords":["аутофагия","аутофагический поток","аутофагосома","аутолизосома","лизосома","макроаутофагия","пул","скорость"],"lead":["При макроаутофагии участок цитоплазмы заключается в мембрану аутофагосомы, доставляется в лизосому и там расщепляется. [[T45|Аутофагический поток]] — скорость всего этого пути, а не число структур, видимых в клетке в данный момент."],"mechanism":["Комплекс ULK1 начинает образование [[T47|изолирующей мембраны]]; мембрана растёт, захватывает участок цитоплазмы и замыкается в [[T46|аутофагосому]].","Аутофагосома сливается с лизосомой и превращается в [[T48|аутолизосому]], где в кислой среде гидролазы расщепляют груз и внутреннюю мембрану.","Продукты расщепления — аминокислоты, жирные кислоты, нуклеозиды — переносятся в цитозоль и снова используются клеткой."],"paragraphs":["Аутофагия — путь доставки компонентов цитоплазмы в лизосому. В этом разделе речь идёт о макроаутофагии: груз заключается в двойную мембрану аутофагосомы. Другие формы (микроаутофагия, шаперон-опосредованная аутофагия) устроены иначе, а избирательное удаление органелл будет предметом следующего семинара.","Путь состоит из последовательных этапов: инициация, образование и рост изолирующей мембраны, её замыкание, слияние аутофагосомы с лизосомой и расщепление содержимого. Каждый этап можно нарушить отдельно, и тогда структуры, образовавшиеся до места блока, накапливаются. Например, при подавлении лизосомных протеаз путь останавливается на последнем этапе, и в клетке накапливаются аутолизосомы с нерасщеплённым грузом.","Поэтому число аутофагосом в клетке — это содержание (пул), которое зависит от двух скоростей: образования и удаления. Пул растёт и при усилении образования, и при задержке слияния или расщепления. Аутофагическим потоком называют скорость доставки материала в лизосомы и его расщепления (Klionsky 2021).","Отсюда главное правило измерения: одного снимка структур недостаточно. Нужно сравнение с условием, в котором удаление заблокировано, или прямая оценка расщепления. Как это делают на практике, разобрано в последнем шаге раздела."],"trap":["Чем больше аутофагосом в клетке, тем сильнее аутофагия.","Число аутофагосом — это пул: оно растёт и при усиленном образовании, и при нарушенном слиянии или расщеплении. Об аутофагии судят по потоку — скорости доставки и расщепления материала в лизосомах."],"conditions":"Схема механизма, качественные состояния; клетки млекопитающих в культуре, макроаутофагия. Определение потока и требования к его измерению — по руководству Klionsky 2021 (полный текст, разделы о LC3 и о распаде долгоживущих белков). Этапы образования аутофагосомы — по обзору Nakatogawa 2020. Уровни «мало / много» на схеме не являются измерениями.","sources":["Klionsky2021","Nakatogawa2020"],"quiz":{"id":"S11-L19","rev":1,"question":"В клетках через 2 ч после воздействия число аутофагосом в 3 раза больше, чем в контроле. Других измерений нет. Какой вывод об аутофагическом потоке допустим?","options":[{"id":"S11-L19-1","text":"Поток вырос примерно в 3 раза вслед за числом аутофагосом","correct":false,"feedback":"Число аутофагосом — пул. Его утроение возможно и при неизменном или сниженном потоке, если задержано слияние или расщепление."},{"id":"S11-L19-2","text":"Поток снизился, потому что аутофагосомы не сливаются","correct":false,"feedback":"Задержка слияния — лишь одно из возможных объяснений. Тот же пул дало бы и усиленное образование при сохранённом слиянии."},{"id":"S11-L19-3","text":"По этим данным изменение потока определить нельзя","correct":true,"feedback":"Рост пула возможен и при усилении образования, и при блоке позднего этапа. Нужен второй показатель: сравнение с условием, где удаление заблокировано, или оценка расщепления."}]},"widget":{"kind":"net","title":"","s":{"title":"Этапы аутофагии и два способа получить «много аутофагосом»","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Условия","opts":["Полная среда","Без аминокислот","Без аминокислот, расщепление заблокировано"]}],"W":640,"H":300,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества через мембрану или в другой компартмент","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий, путь мембраны или груза","dash":"связь, зависящая от условий","nodes":["жёлтая рамка — этап идёт или белок активен","мелкий пунктир — этап замедлен","пунктирная рамка — этап не идёт или блокирован","× — белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":288,"c":"cyto","t":"цитоплазма","lx":626,"ly":24,"a":"end","n":[4,4,332,462,330,22]}],"nodes":{"ini":{"p":[80,80,130,48],"t":"инициация\n(ULK1)","n":[90,60,140,46],"fs":15},"ap":{"p":[250,80,140,48],"t":"аутофагосома","n":[90,160,140,46],"fs":15},"lys":{"p":[250,200,120,44],"t":"лизосома","n":[250,160,120,44],"fs":15},"al":{"p":[430,80,140,48],"t":"аутолизосома","n":[90,260,140,46],"fs":15},"deg":{"p":[420,200,120,48],"t":"расщепление\nгруза","n":[82,360,124,48],"fs":15},"aa":{"p":[566,200,96,48],"t":"мономеры\nв цитозоль","n":[256,360,116,48],"fs":14}},"edges":{"e1":{"a":"ini","b":"ap","k":"seq","t":"образование"},"e2":{"a":"ap","b":"al","k":"seq","t":"слияние"},"e3":{"a":"lys","b":"al","k":"seq"},"e4":{"a":"al","b":"deg","k":"seq"},"e5":{"a":"deg","b":"aa","k":"tr"}},"st":{"0":{"n":{"ini":"low","ap":"base","lys":"base","al":"base","deg":"low","aa":"base"},"e":{},"m":[["Аутофагосомы","мало"],["Аутолизосомы","мало"],["Поток (скорость расщепления)","низкий, базальный"]],"note":"В полной среде аутофагия идёт на базальном уровне: аутофагосом образуется мало, они быстро сливаются с лизосомами, а содержимое расщепляется."},"1":{"n":{"ini":"on","ap":"on","lys":"on","al":"on","deg":"on","aa":"on"},"e":{},"m":[["Аутофагосомы","много"],["Аутолизосомы","много"],["Поток (скорость расщепления)","высокий"]],"note":"Без аминокислот образование аутофагосом усилено; при сохранённом слиянии и расщеплении растут и пул структур, и поток."},"2":{"n":{"ini":"on","ap":"on","lys":"on","al":"on","deg":"off","aa":"off"},"e":{"e4":"off","e5":"off"},"m":[["Аутофагосомы","много"],["Аутолизосомы","очень много"],["Поток (скорость расщепления)","почти нет"]],"note":"Если расщепление заблокировано, структуры тоже накапливаются, но груз не расщепляется: пул велик, а потока почти нет. По одному снимку это состояние не отличить от предыдущего."}}}}},{"id":"ulk1-init","number":20,"section":3,"title":"Как ULK1 и VPS34 начинают образование аутофагосомы","question":4,"questions":[4],"keywords":["ULK1","ATG13","FIP200","mTORC1","S758","AMPK","VPS34","BECN1","ATG14","PI3P","MRT68921","SAR405","TFEB","TFE3","лизосомные гены"],"lead":["Образование аутофагосомы начинается с киназного [[T49|комплекса ULK1]]. Когда mTORC1 перестаёт его подавлять, ULK1 фосфорилирует субъединицы [[T50|комплекса VPS34]], и на мембране появляется PI3P — сигнал для следующих белков аутофагии."],"mechanism":["При достатке аминокислот mTORC1 фосфорилирует ULK1 по S758 у человека (S757 у мыши) и ATG13, и комплекс ULK1 неактивен.","При снижении активности mTORC1 комплекс ULK1 (ULK1, ATG13, FIP200, ATG101) активируется и фосфорилирует BECN1 в составе комплекса VPS34 с ATG14.","VPS34 фосфорилирует фосфатидилинозитол и образует на изолирующей мембране фосфатидилинозитол-3-фосфат (PI3P), с которым связываются белки следующего этапа."],"paragraphs":["Комплекс ULK1 состоит из киназы ULK1 (у млекопитающих есть и близкая ULK2) и белков ATG13, FIP200 и ATG101 (Zachari 2017). Он собирается в месте будущей изолирующей мембраны, часто рядом с ЭПР, и служит платформой для других белков аутофагии.","При достатке аминокислот активный mTORC1 фосфорилирует ULK1 по S758 у человека (S757 у мыши) и ATG13; в таком состоянии комплекс почти не запускает аутофагию (Kim 2011). Когда аминокислот нет, активность mTORC1 снижается, ингибирующее фосфорилирование уменьшается, и ULK1 активируется. AMPK фосфорилирует другие сайты ULK1. По классической схеме это стимулирует аутофагию; в новых работах при дефиците энергии AMPK скорее сдерживает её (Park 2023). Эффект зависит от вида стресса, его длительности и типа клеток.","Активная ULK1 фосфорилирует BECN1 по S15 у человека (S14 у мыши) и усиливает активность комплекса фосфатидилинозитол-3-киназы класса III, содержащего VPS34, VPS15, BECN1 и ATG14 (Russell 2013). Этот комплекс образует на изолирующей мембране PI3P. Без ATG14 те же белки входят в комплексы эндоцитарного пути, поэтому VPS34 работает не только в аутофагии.","Ингибиторы помогают проверить последовательность этапов. При подавлении ULK1 препаратом MRT68921 аутофагия блокируется, а в клетках накапливаются незавершённые ранние структуры (Petherick 2015). SAR405 подавляет VPS34 и аутофагию, но нарушает и работу поздних эндосом и лизосом (Ronan 2014).","Кроме быстрого переключения ULK1, есть медленный, транскрипционный уровень регуляции. Активный mTORC1 фосфорилирует [[T64|транскрипционный фактор TFEB]] (в частности, по S211); фосфорилированный TFEB связывается с белками 14-3-3 и остаётся в цитоплазме (Martina 2012; Roczniak-Ferguson 2012). При снижении активности mTORC1 TFEB переходит в ядро и усиливает транскрипцию генов лизосомных белков (Sardiello 2009) и белков аутофагии (Martina 2012). Близкий фактор TFE3 регулируется сходным образом (Martina 2014). Фосфорилирование ULK1 меняется за минуты, а новые белки лизосом и аутофагии появляются позже, после транскрипции и трансляции. В результате при длительном голодании клетка не только запускает аутофагию, но и увеличивает ёмкость лизосом, в которые доставляется материал."],"trap":["ULK1 сама строит мембрану аутофагосомы, перенося на неё липиды.","ULK1 — протеинкиназа: она фосфорилирует белки, в том числе BECN1 в комплексе VPS34. Липид PI3P образует VPS34, а рост мембраны обеспечивают другие белки — ATG9, ATG2 и система присоединения LC3."],"conditions":"Схема механизма, качественные состояния; клетки млекопитающих в культуре, дефицит аминокислот или подавление mTORC1. Сайты фосфорилирования: ULK1 S758 человека (S757 мыши; Kim 2011, клетки мыши и человека), BECN1 S15 человека (S14 мыши; Russell 2013). Противоречивая роль AMPK — Park 2023 (экспериментальная работа на культурах клеток: при дефиците глюкозы или нарушении работы митохондрий AMPK подавляла активацию ULK1 и аутофагию, вызванные отсутствием аминокислот; реферат). При других воздействиях и в других клетках результат может быть иным. Ингибиторы: MRT68921 — Petherick 2015 (клетки мыши и человека, указаны рефераты); SAR405 — Ronan 2014. Транскрипционная регуляция через TFEB и TFE3 — Sardiello 2009, Martina 2012, Roczniak-Ferguson 2012, Martina 2014 (клетки человека и мыши; рефераты); на схеме этот уровень не показан. Уровни на схеме не являются измерениями.","sources":["Zachari2017","Kim2011","Park2023","Russell2013","Petherick2015","Ronan2014","Sardiello2009","Martina2012","RoczniakFerguson2012","Martina2014"],"quiz":{"id":"S11-L20","rev":1,"question":"Клетки находятся в среде без аминокислот; активность mTORC1 снижена. В среду добавили MRT68921 — ингибитор киназы ULK1. Как изменится образование PI3P на изолирующей мембране?","options":[{"id":"S11-L20-1","text":"Усилится: ULK1 больше не конкурирует с VPS34","correct":false,"feedback":"ULK1 не конкурирует с VPS34, а стимулирует её: фосфорилирование BECN1 повышает активность комплекса VPS34 с ATG14."},{"id":"S11-L20-2","text":"Снизится: ULK1 не активирует комплекс VPS34","correct":true,"feedback":"Активная ULK1 фосфорилирует BECN1 и усиливает работу комплекса VPS34 с ATG14. При подавлении ULK1 PI3P на изолирующей мембране образуется меньше, и инициация аутофагии нарушается."},{"id":"S11-L20-3","text":"Не изменится: VPS34 активируется только mTORC1","correct":false,"feedback":"mTORC1 действует на этот этап через ULK1, подавляя её; без активной ULK1 снижение активности mTORC1 не приводит к усилению работы VPS34."}]},"widget":{"kind":"net","title":"","s":{"title":"От mTORC1 к PI3P: инициация аутофагии","status":"Схема механизма · качественные состояния","ctrls":[{"id":"a","type":"group","label":"Аминокислоты в среде","opts":["Есть","Нет"]},{"id":"i","type":"check","label":"MRT68921 (ингибитор ULK1)"}],"W":640,"H":320,"NW":340,"NH":480,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества через мембрану или в другой компартмент","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий, путь мембраны или груза","dash":"связь, зависящая от условий","nodes":["жёлтая рамка — этап идёт или белок активен","мелкий пунктир — этап замедлен","пунктирная рамка — этап не идёт или блокирован","× — белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":230,"c":"cyto","t":"цитозоль","lx":626,"ly":24,"a":"end","n":[4,4,332,360,330,22]},{"x":6,"y":244,"w":628,"h":70,"c":"plain","t":"изолирующая мембрана","lx":16,"ly":306,"a":"start","n":[4,370,332,104,12,466]}],"nodes":{"mtor":{"p":[85,60,120,44],"t":"mTORC1","n":[80,54,130,42],"fs":16},"ulk":{"p":[300,60,236,52],"t":"комплекс ULK1\n(ULK1, ATG13, FIP200, ATG101)","n":[130,160,200,62],"fs":13,"tn":"комплекс ULK1\n(ULK1, ATG13,\nFIP200, ATG101)"},"mrt":{"p":[530,60,120,44],"t":"MRT68921","n":[255,54,130,40],"fs":15},"vps":{"p":[300,170,250,52],"t":"комплекс VPS34\n(VPS34, VPS15, BECN1, ATG14)","n":[140,290,230,62],"fs":13,"tn":"комплекс VPS34\n(VPS34, VPS15,\nBECN1, ATG14)"},"pi3p":{"p":[290,280,120,40],"t":"PI3P","n":[72,420,100,40],"fs":16},"wipi":{"p":[470,280,150,40],"t":"WIPI2 →\nследующий этап","n":[244,420,156,46],"fs":13}},"edges":{"p1":{"a":"mtor","b":"ulk","k":"inh","t":"P: ULK1 S758 (человек)","tn":"P: ULK1 S758\n(человек)","dn":[50,-8]},"p2":{"a":"ulk","b":"vps","k":"phos","t":"P: BECN1 S15"},"rx":{"a":"vps","b":"pi3p","k":"rx","t":"фосфатидилинозитол → PI3P","tn":"фосфатидилинозитол\n→ PI3P"},"bd":{"a":"pi3p","b":"wipi","k":"bind"},"dr":{"a":"mrt","b":"ulk","k":"inh"}},"st":{"0-0":{"n":{"mtor":"on","ulk":"off","mrt":"hide","vps":"low","pi3p":"off","wipi":"off"},"e":{"p1":"on","p2":"off","rx":"off","bd":"off","dr":"hide"},"b":{"ulk":{"t":"S758","at":"t"}},"m":[["mTORC1","активен"],["ULK1","фосфорилирована по S758, неактивна"],["PI3P на мембране","мало"]],"note":"При достатке аминокислот mTORC1 фосфорилирует ULK1 по S758 (у человека) и ATG13. Комплекс ULK1 не активирует VPS34, и инициация аутофагии подавлена."},"0-1":{"n":{"mtor":"on","ulk":"off","mrt":"on","vps":"low","pi3p":"off","wipi":"off"},"e":{"p1":"on","p2":"off","rx":"off","bd":"off","dr":"on"},"b":{"ulk":{"t":"S758","at":"t"}},"m":[["mTORC1","активен"],["ULK1","неактивна"],["PI3P на мембране","мало"]],"note":"При достатке аминокислот ULK1 и так подавлена mTORC1, поэтому ингибитор почти ничего не меняет: инициация аутофагии остаётся низкой."},"1-0":{"n":{"mtor":"off","ulk":"on","mrt":"hide","vps":"on","pi3p":"on","wipi":"on"},"e":{"p1":"off","p2":"on","rx":"on","bd":"on","dr":"hide"},"b":{},"m":[["mTORC1","неактивен"],["ULK1","активна"],["PI3P на мембране","много"]],"note":"Без аминокислот mTORC1 неактивен, ULK1 активируется и фосфорилирует BECN1. Комплекс VPS34 образует PI3P на изолирующей мембране; WIPI2 связывается с PI3P и передаёт сигнал следующему этапу."},"1-1":{"n":{"mtor":"off","ulk":"off","mrt":"on","vps":"low","pi3p":"low","wipi":"low"},"e":{"p1":"off","p2":"off","rx":"off","bd":"off","dr":"on"},"b":{},"m":[["mTORC1","неактивен"],["ULK1","ингибирована"],["PI3P на мембране","мало"]],"note":"Без аминокислот mTORC1 неактивен, но MRT68921 подавляет киназную активность ULK1. Комплекс VPS34 не активируется, PI3P мало, и в клетках накапливаются незавершённые ранние структуры (Petherick 2015)."}}}}},{"id":"lc3-lipidation","number":21,"section":3,"title":"Как LC3 присоединяется к мембране и что означает LC3-II","question":4,"questions":[4],"keywords":["LC3","LC3-I","LC3-II","ATG4","ATG7","ATG3","ATG16L1","WIPI2","фосфатидилэтаноламин","CASM","липидирование"],"lead":["[[T52|LC3]] присоединяется к липиду мембраны с помощью ферментов, похожих на ферменты убиквитинирования. Образующийся LC3-II — главный белковый признак мембран аутофагосом, но не абсолютный."],"mechanism":["Протеаза ATG4 отщепляет C-концевой фрагмент предшественника LC3 и открывает остаток глицина: образуется растворимый LC3-I.","[[T53|ATG7]] (E1-подобный фермент) и ATG3 (E2-подобный) присоединяют LC3-I к фосфатидилэтаноламину мембраны; так образуется LC3-II.","[[T51|WIPI2]] связывается с PI3P и привлекает [[T54|комплекс ATG12–ATG5–ATG16L1]], который направляет и ускоряет перенос LC3 именно на изолирующую мембрану."],"paragraphs":["LC3 — белок семейства ATG8 размером около 15 кДа. Предшественник LC3 разрезается протеазой ATG4, и на C-конце открывается остаток глицина; эту растворимую форму называют LC3-I. Цепь реакций присоединения напоминает убиквитинирование: ATG7 активирует LC3-I, затратив ATP, и передаёт его на ATG3, а ATG3 переносит LC3 на аминогруппу фосфатидилэтаноламина. ATG7 участвует и во второй системе — образовании конъюгата ATG12–ATG5, где роль E2-подобного фермента выполняет ATG10.","Место реакции задаёт предыдущий этап. WIPI2 связывается с PI3P на изолирующей мембране и привлекает комплекс ATG12–ATG5–ATG16L1 (Dooley 2014). Этот комплекс работает как E3-подобный фермент: он ускоряет перенос LC3 с ATG3 на липид. Так LC3-II появляется на обеих поверхностях растущей мембраны, а после замыкания — на наружной и внутренней мембранах аутофагосомы.","LC3-II на внутренней мембране разрушается в аутолизосоме вместе с грузом, а с наружной мембраны может отщепляться протеазой ATG4. На блоте LC3-II движется быстрее LC3-I. У мышей без Atg7 нарушены обе системы конъюгации и образование аутофагосом, а в клетках накапливаются убиквитин-положительные агрегаты (Komatsu 2005).","Граница вывода: LC3-II бывает не только на аутофагосомах. При неканоническом присоединении (CASM) белки ATG8 присоединяются к одинарным мембранам эндолизосомного пути, в том числе к фосфатидилсерину (Durgan 2021). Поэтому LC3-II — показатель присоединения LC3, а не прямое число аутофагосом."],"trap":["LC3-II — это особый белок, который синтезируется только при аутофагии.","LC3-II — тот же LC3, но присоединённый к липиду мембраны. Его образование зависит от ATG7 и ATG3, а содержание LC3-II отражает баланс между присоединением и разрушением, а не только синтез."],"conditions":"Схема механизма, качественные состояния; клетки млекопитающих. Последовательность реакций — по обзору Nakatogawa 2020 (полный текст). WIPI2 и ATG16L1 — Dooley 2014 (клетки человека, реферат). Мыши с условным нокаутом Atg7 — Komatsu 2005 (реферат). Неканоническое присоединение ATG8 к фосфатидилсерину — Durgan 2021 (клетки млекопитающих, реферат). Уровни на схеме условны.","sources":["Nakatogawa2020","Dooley2014","Komatsu2005","Durgan2021"],"quiz":{"id":"S11-L21","rev":1,"question":"В клетках нокаутирован ген ATG7. Клетки 2 ч держат в среде без аминокислот и снимают блот на LC3. Какой результат ожидается?","options":[{"id":"S11-L21-1","text":"Полоса LC3-II сильнее, чем в клетках дикого типа","correct":false,"feedback":"Сильная полоса LC3-II означала бы, что присоединение LC3 к мембране идёт. Без ATG7 нет E1-подобного фермента этой реакции."},{"id":"S11-L21-2","text":"Полоса LC3-I есть, полосы LC3-II нет","correct":true,"feedback":"ATG7 активирует LC3-I для переноса на фосфатидилэтаноламин. Без него LC3 остаётся в растворимой форме LC3-I, а LC3-II не образуется."},{"id":"S11-L21-3","text":"Нет ни полосы LC3-I, ни полосы LC3-II","correct":false,"feedback":"Без ATG7 не идёт присоединение LC3 к липиду, но сам белок LC3 синтезируется и разрезается ATG4; полоса LC3-I сохраняется."}]},"widget":{"kind":"net","title":"","s":{"title":"Присоединение LC3 к мембране","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Клетки и мембрана","opts":["Дикий тип: изолирующая мембрана","Клетки без ATG7","Неканоническое присоединение (одинарная мембрана)"]}],"W":640,"H":320,"NW":340,"NH":500,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества через мембрану или в другой компартмент","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий, путь мембраны или груза","dash":"связь, зависящая от условий","nodes":["жёлтая рамка — этап идёт или белок активен","мелкий пунктир — этап замедлен","пунктирная рамка — этап не идёт или блокирован","× — белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":220,"c":"cyto","t":"цитозоль","lx":626,"ly":24,"a":"end","n":[4,4,332,380,330,22]},{"x":6,"y":236,"w":628,"h":78,"c":"plain","t":"мембрана","lx":626,"ly":306,"a":"end","n":[4,390,332,106,330,490]}],"nodes":{"pro":{"p":[90,60,140,44],"t":"предшественник\nLC3","n":[80,60,140,46],"fs":14},"atg4":{"p":[80,160,100,40],"t":"ATG4","n":[80,150,100,40],"fs":15},"lc3i":{"p":[320,60,110,40],"t":"LC3-I","n":[250,60,110,40],"fs":16},"atg7":{"p":[320,160,120,44],"t":"ATG7 (E1)","n":[250,160,120,40],"fs":15},"atg3":{"p":[480,160,120,44],"t":"ATG3 (E2)","n":[255,260,110,40],"fs":15},"e3":{"p":[565,70,120,52],"t":"ATG12–ATG5–\nATG16L1","n":[80,260,130,50],"fs":13},"lc3ii":{"p":[470,275,170,44],"t":"LC3-II на мембране","n":[230,440,190,44],"fs":15}},"edges":{"c1":{"a":"pro","b":"lc3i","k":"rx","t":"отщепление\nC-конца","d":[0,-26]},"c0":{"a":"atg4","b":"pro","k":"act"},"c2":{"a":"lc3i","b":"atg7","k":"seq"},"c3":{"a":"atg7","b":"atg3","k":"seq"},"c4":{"a":"atg3","b":"lc3ii","k":"rx","t":"+ фосфатидил-\nэтаноламин","d":[12,-17],"dn":[-103,-8],"anc":"start"},"c5":{"a":"e3","b":"atg3","k":"act"}},"st":{"0":{"n":{"pro":"base","atg4":"on","lc3i":"on","atg7":"on","atg3":"on","e3":"on","lc3ii":"on"},"e":{},"m":[["LC3-I","есть"],["LC3-II","есть"],["Где LC3-II","двойная мембрана аутофагосомы"]],"note":"ATG4 открывает остаток глицина, ATG7 и ATG3 переносят LC3 на фосфатидилэтаноламин, а комплекс ATG12–ATG5–ATG16L1, привлечённый WIPI2, направляет реакцию на изолирующую мембрану."},"1":{"n":{"pro":"base","atg4":"on","lc3i":"on","atg7":"abs","atg3":"off","e3":"off","lc3ii":"off"},"e":{"c2":"off","c3":"off","c4":"off","c5":"off"},"m":[["LC3-I","накапливается"],["LC3-II","нет"],["Где LC3-II","—"]],"note":"Без ATG7 LC3-I не активируется, и LC3-II не образуется; не образуется и конъюгат ATG12–ATG5, поэтому каноническое образование аутофагосом нарушено (у мышей — Komatsu 2005)."},"2":{"n":{"pro":"base","atg4":"on","lc3i":"on","atg7":"on","atg3":"on","e3":"on","lc3ii":"on"},"e":{},"t":{"lc3ii":"LC3-II на одинарной\nмембране"},"tn":{"lc3ii":"LC3-II на одинарной\nмембране"},"m":[["LC3-I","есть"],["LC3-II","есть"],["Где LC3-II","одинарная мембрана эндолизосомного пути"]],"note":"При неканоническом присоединении те же ферменты переносят белки ATG8 на одинарные мембраны, в том числе на фосфатидилсерин (Durgan 2021). LC3-II есть, но аутофагосомы нет."}}}}},{"id":"fusion-degradation","number":22,"section":3,"title":"Как аутофагосома сливается с лизосомой и где расщепляется её содержимое","question":4,"questions":[4],"keywords":["STX17","SNAP29","VAMP8","YKT6","слияние","V-ATPase","катепсины","бафиломицин","хлорохин","E64d","пепстатин"],"lead":["Слияние, закисление и расщепление — три отдельных этапа после замыкания аутофагосомы. Их нарушают разные воздействия, и каждое оставляет свой след."],"mechanism":["[[T55|STX17]] встраивается в наружную мембрану замкнутой аутофагосомы и вместе с SNAP29 и лизосомным VAMP8 образует комплекс SNARE, сближающий мембраны.","После слияния [[T56|V-ATPase]] лизосомной мембраны поддерживает кислую среду, нужную лизосомным гидролазам.","Катепсины и другие гидролазы расщепляют груз и внутреннюю мембрану вместе с LC3-II; продукты переносятся в цитозоль."],"paragraphs":["STX17 появляется на наружной мембране аутофагосомы после её замыкания и отсутствует на незамкнутой изолирующей мембране (Itakura 2012). С SNAP29 и VAMP8 он образует комплекс SNARE, который участвует в слиянии с лизосомой. При снижении содержания STX17 аутофагосомы накапливаются, а их содержимое не расщепляется. Слияние может идти и без STX17: описан второй комплекс SNARE с YKT6, поэтому в клетках, нокаутных по STX17, слияние сохраняется частично (Matsui 2018).","В аутолизосоме V-ATPase переносит протоны в просвет и поддерживает кислую среду. Катепсины активны именно в ней. Бафиломицин A1 ингибирует V-ATPase и нарушает закисление. В жировом теле дрозофилы закисление и слияние удалось разделить: лизосомы без V-ATPase сливались с аутофагосомами, а бафиломицин слияние блокировал — через побочную мишень, Ca²⁺-насос SERCA (Mauvezin 2015).","Хлорохин накапливается в кислых органеллах; в клетках он нарушает прежде всего слияние аутофагосом с лизосомами, а не закисление (Mauthe 2018). E64d и пепстатин A ингибируют лизосомные протеазы: слияние и закисление сохраняются, но белки груза не расщепляются.","Эти воздействия часто называют одним словом «ингибиторы лизосом», но они блокируют разные этапы. Поэтому вывод «аутофагия заблокирована» нужно сопровождать указанием, какой именно этап нарушен."],"trap":["Бафиломицин, хлорохин и ингибиторы протеаз одинаково «выключают лизосому».","Они действуют на разные этапы: бафиломицин подавляет закисление (и в некоторых клетках слияние), хлорохин прежде всего нарушает слияние, ингибиторы протеаз — расщепление при сохранённом закислении."],"conditions":"Схема механизма, качественные состояния. STX17 — клетки млекопитающих (HeLa, MEF; Itakura 2012); YKT6 и частичное слияние без STX17 — клетки HeLa (Matsui 2018). Разделение закисления и слияния — жировое тело дрозофилы и клетки млекопитающих (Mauvezin 2015). Хлорохин — клетки человека и мыши, ткани мышей (Mauthe 2018). Указаны рефераты; уровни на схеме не являются измерениями.","sources":["Itakura2012","Matsui2018","Mauvezin2015","Mauthe2018"],"quiz":{"id":"S11-L22","rev":1,"question":"Клетки без аминокислот с тандемным репортёром mCherry-GFP-LC3 обработали E64d и пепстатином A — ингибиторами лизосомных протеаз. Что произойдёт с закислением аутолизосом?","options":[{"id":"S11-L22-1","text":"Закисление прекратится, как при бафиломицине","correct":false,"feedback":"Бафиломицин ингибирует V-ATPase. Ингибиторы протеаз действуют на ферменты внутри аутолизосомы и протонную помпу не затрагивают."},{"id":"S11-L22-2","text":"Закисление не начнётся, потому что слияние нарушено","correct":false,"feedback":"Нарушение слияния характерно для хлорохина или снижения содержания STX17. Ингибиторы протеаз действуют после слияния."},{"id":"S11-L22-3","text":"Закисление сохранится, но груз не будет расщепляться","correct":true,"feedback":"V-ATPase продолжает работать, среда в аутолизосомах кислая (красные точки репортёра), но протеазы подавлены, поэтому груз и LC3-II накапливаются."}]},"widget":{"kind":"net","title":"","s":{"title":"Слияние, закисление и расщепление: где действует каждый ингибитор","status":"Схема механизма · качественные состояния","ctrls":[{"id":"d","type":"group","label":"Воздействие","opts":["Нет","siRNA к STX17","Хлорохин","Бафиломицин A1","E64d + пепстатин A"]}],"W":640,"H":300,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества через мембрану или в другой компартмент","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий, путь мембраны или груза","dash":"связь, зависящая от условий","nodes":["жёлтая рамка — этап идёт или белок активен","мелкий пунктир — этап замедлен","пунктирная рамка — этап не идёт или блокирован","× — белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":288,"c":"cyto","t":"цитоплазма","lx":626,"ly":24,"a":"end","n":[4,4,332,462,330,22]}],"nodes":{"ap":{"p":[90,80,140,48],"t":"аутофагосома\nSTX17","n":[90,60,140,48],"fs":15},"ly":{"p":[90,210,140,48],"t":"лизосома\nVAMP8","n":[250,60,130,48],"fs":15},"al":{"p":[300,145,150,48],"t":"аутолизосома","n":[170,170,150,46],"fs":15},"vat":{"p":[300,260,150,44],"t":"V-ATPase: H⁺","n":[90,280,140,42],"fs":15},"cat":{"p":[500,145,160,48],"t":"катепсины:\nрасщепление","n":[250,280,130,50],"fs":15},"out":{"p":[500,260,160,44],"t":"аминокислоты\nв цитозоль","n":[170,400,160,46],"fs":14}},"edges":{"f1":{"a":"ap","b":"al","k":"seq","t":"слияние","ao":[70,10],"bo":[-75,-10]},"f2":{"a":"ly","b":"al","k":"seq","ao":[70,-10],"bo":[-75,10]},"h":{"a":"vat","b":"al","k":"tr","t":"закисление"},"c":{"a":"al","b":"cat","k":"seq"},"o":{"a":"cat","b":"out","k":"tr"}},"st":{"0":{"n":{"ap":"on","ly":"on","al":"on","vat":"on","cat":"on","out":"on"},"e":{},"m":[["Слияние","идёт"],["Кислая среда","есть"],["Расщепление","идёт"],["Тандемный репортёр","жёлтые и красные точки"]],"note":"Все три этапа работают: аутофагосомы сливаются с лизосомами, среда кислая, груз расщепляется, а продукты выходят в цитозоль."},"1":{"n":{"ap":"on","ly":"on","al":"low","vat":"on","cat":"low","out":"low"},"e":{"f1":"on"},"et":{"f1":"слияние\nзамедлено"},"m":[["Слияние","замедлено"],["Кислая среда","есть"],["Расщепление","снижено"],["Тандемный репортёр","больше жёлтых точек"]],"note":"Без STX17 замкнутые аутофагосомы сливаются медленнее и накапливаются (Itakura 2012); слияние частично сохраняется благодаря YKT6 (Matsui 2018)."},"2":{"n":{"ap":"on","ly":"on","al":"low","vat":"on","cat":"low","out":"low"},"e":{},"et":{"f1":"слияние\nнарушено"},"m":[["Слияние","нарушено"],["Кислая среда","в основном сохранена"],["Расщепление","снижено"],["Тандемный репортёр","больше жёлтых точек"]],"note":"Хлорохин в клетках нарушает прежде всего слияние аутофагосом с лизосомами, а не закисление (Mauthe 2018); он также вызывает дезорганизацию аппарата Гольджи и эндолизосомной системы."},"3":{"n":{"ap":"on","ly":"on","al":"on","vat":"off","cat":"off","out":"off"},"e":{"h":"off","c":"off","o":"off","f1":"on"},"m":[["Слияние","часто сохраняется; в некоторых клетках нарушено"],["Кислая среда","нет"],["Расщепление","почти нет"],["Тандемный репортёр","все точки жёлтые"]],"note":"Бафиломицин A1 ингибирует V-ATPase: кислой среды нет, катепсины не работают, GFP в репортёре не гаснет. В жировом теле дрозофилы препарат нарушал и слияние — через SERCA (Mauvezin 2015)."},"4":{"n":{"ap":"on","ly":"on","al":"on","vat":"on","cat":"off","out":"off"},"e":{"c":"off","o":"off"},"m":[["Слияние","идёт"],["Кислая среда","есть"],["Расщепление","почти нет"],["Тандемный репортёр","больше красных точек"]],"note":"E64d и пепстатин A подавляют цистеиновые и аспартатные катепсины: слияние и закисление сохраняются, но груз и LC3-II не расщепляются, и кислые аутолизосомы накапливаются."}}}}},{"id":"autophagy-significance","number":23,"section":3,"title":"Для чего клетке аутофагия и что происходит при её нарушении","question":4,"questions":[4],"keywords":["голодание","аминокислоты","p62","SQSTM1","агрегаты","Atg7","нейродегенерация","mTORC1","восстановление лизосом"],"lead":["Аутофагия поставляет мономеры при дефиците питательных веществ и удаляет то, что не может разрушить протеасома, — крупные агрегаты и органеллы. Её нарушение проявляется прежде всего в долгоживущих клетках."],"mechanism":["При дефиците аминокислот аутофагия расщепляет часть собственных белков; освобождённые аминокислоты снова активируют mTORC1, который ограничивает аутофагию и запускает восстановление лизосом.","Адаптер [[T58|p62]] связывает убиквитинированные белки и LC3 и вместе с грузом попадает в аутофагосому, где разрушается.","При нарушении аутофагии p62 и убиквитинированные белки накапливаются в агрегатах; в нейронах и гепатоцитах это сопровождается повреждением клеток."],"paragraphs":["При отсутствии аминокислот в среде аутофагия становится их внутренним источником. В клетках NRK после удаления сыворотки и глутамина активность mTORC1 сначала падала, а затем восстанавливалась за счёт продуктов аутофагического расщепления; повторная активация mTORC1 ограничивала аутофагию и запускала восстановление лизосом из аутолизосом (Yu 2010).","Второе назначение — контроль качества. Белок p62 (SQSTM1) связывает убиквитинированные белки своим UBA-доменом, а LC3 — мотивом LIR, и тем самым связывает груз с мембраной аутофагосомы; сам p62 разрушается вместе с грузом (Bjørkøy 2005). Так удаляются белковые агрегаты, которые не проходят в узкий канал протеасомы.","У мышей с условным нокаутом Atg7 в печени аутофагия при голодании нарушалась, а в гепатоцитах накапливались убиквитин-положительные агрегаты и деформированные митохондрии (Komatsu 2005). В таких клетках накапливается и p62; при одновременном удалении гена p62 агрегаты в гепатоцитах и нейронах почти не образуются, а повреждение печени ослабевает (Komatsu 2007). Нарушения системы аутофагия–лизосома описаны при нескольких нейродегенеративных болезнях; во многих случаях первично поражается лизосома, а не образование аутофагосом (Nixon 2024).","Граница вывода: связь нарушения аутофагии с болезнью не означает, что усиление аутофагии лечит болезнь. Это вопрос клинических исследований, а не механизма. Избирательное удаление повреждённых органелл с помощью рецепторов будет предметом следующего семинара."],"trap":["Аутофагия нужна клетке только при голодании.","Аутофагия идёт и в полной среде на базальном уровне: она постоянно обновляет часть белков и органелл и удаляет агрегаты. Без неё убиквитинированные белки и p62 накапливаются даже без голодания."],"conditions":"Схема механизма, качественные состояния. Повторная активация mTORC1 и восстановление лизосом — клетки NRK, среда без сыворотки и глутамина (Yu 2010, реферат). p62 и агрегаты — клетки человека и мыши (Bjørkøy 2005, реферат). Мыши с условным нокаутом Atg7 в печени и мозге — Komatsu 2005 и Komatsu 2007 (рефераты). Нарушения при нейродегенерации — обзор Nixon 2024 (полный текст). Уровни на схеме не являются измерениями.","sources":["Yu2010","Bjorkoy2005","Komatsu2005","Komatsu2007","Nixon2024"],"quiz":{"id":"S11-L23","rev":1,"question":"В гепатоцитах мыши удалён ген Atg7; мыши получают корм без ограничений. Как изменится содержание p62 в гепатоцитах по сравнению с мышами дикого типа?","options":[{"id":"S11-L23-1","text":"Повысится: p62 перестаёт разрушаться в лизосомах","correct":true,"feedback":"p62 разрушается вместе с грузом при аутофагии. Без Atg7 канонического образования аутофагосом нет, и p62 вместе с убиквитинированными белками накапливается (Komatsu 2007)."},{"id":"S11-L23-2","text":"Снизится: без аутофагии p62 некуда связываться","correct":false,"feedback":"p62 связывает убиквитинированные белки и без аутофагосом; отсутствие LC3-II мешает не связыванию, а доставке p62 в лизосому."},{"id":"S11-L23-3","text":"Не изменится, потому что голодания нет","correct":false,"feedback":"Аутофагия идёт и без голодания, на базальном уровне; её отсутствие сказывается и без голодания."}]},"widget":{"kind":"net","title":"","s":{"title":"Два назначения аутофагии: источник мономеров и удаление агрегатов","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Условия","opts":["Обычное питание","Голодание","Без Atg7"]}],"W":640,"H":300,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества через мембрану или в другой компартмент","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий, путь мембраны или груза","dash":"связь, зависящая от условий","nodes":["жёлтая рамка — этап идёт или белок активен","мелкий пунктир — этап замедлен","пунктирная рамка — этап не идёт или блокирован","× — белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":288,"c":"cyto","t":"цитоплазма","lx":626,"ly":24,"a":"end","n":[4,4,332,462,330,22]}],"nodes":{"ub":{"p":[90,60,140,48],"t":"убиквитини-\nрованные белки","n":[90,60,140,48],"fs":14},"p62":{"p":[270,60,100,44],"t":"p62","n":[250,60,100,44],"fs":16},"ap":{"p":[470,60,150,4
