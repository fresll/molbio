K.","Состояние mTORC1 отражает баланс входов. Одна из ветвей AKT — FOXO1 — от AMPK этим путём не зависит, поэтому дефицит энергии может подавить синтез, не возвращая FOXO1 в ядро."],"trap":["AMPK подавляет инсулиновый сигнал на уровне рецептора, поэтому при её активации выключаются все ветви AKT.","AMPK тормозит прежде всего mTORC1 — через TSC2 и Raptor. AKT остаётся фосфорилированной, и её другие ветви, например FOXO1, продолжают отвечать."],"conditions":"Сайты TSC2 — Inoki и соавт. (2003; конструкция TSC2 крысы), Raptor — Gwinn и соавт. (2008), аннотации и базы OMIM/Reactome; AKT → AMPKα1 S487 — Hawley и соавт. (2014, полный текст). Схема — механизм, не данные опыта; ответ клеток без TSC2 — Gwinn и соавт. (2008).","sources":["Inoki2003","Gwinn2008","Hawley2014","Goul2023"],"quiz":{"id":"S4-L21","question":"К гепатоцитам добавили инсулин, затем возник дефицит энергии, и AMPK активировалась. Как изменятся p-S6K и локализация FOXO1 в модели?","options":[{"id":"S4-L21-1","text":"p-S6K снизится, FOXO1 перейдёт в ядро","correct":false,"feedback":"AMPK подавляет mTORC1, но не AKT; FOXO1 по-прежнему фосфорилирован и остаётся в цитоплазме."},{"id":"S4-L21-2","text":"p-S6K снизится, FOXO1 останется в цитоплазме","correct":true,"feedback":"AMPK через TSC2 и Raptor подавляет mTORC1 и S6K; ветвь FOXO1 зависит от AKT, а та фосфорилирована."},{"id":"S4-L21-3","text":"p-S6K не изменится: инсулин перевешивает","correct":false,"feedback":"AMPK тормозит mTORC1 и при высоком инсулине: фосфорилирование Raptor действует независимо от TSC2."}]},"widget":{"kind":"net","title":"","s":{"title":"Два пути AMPK к mTORC1","status":"Схема механизма · не экспериментальные данные","modes_label":"Условия","modes":["Инсулин","Инсулин + дефицит энергии","Нет TSC2 + дефицит энергии"],"h":250,"w":640,"nodes":[{"id":"akt","x":20,"y":40,"w":90,"label":"AKT"},{"id":"tsc","x":160,"y":40,"w":90,"label":"TSC2"},{"id":"rheb","x":300,"y":40,"w":110,"label":"RHEB-GTP","fs":14},{"id":"mt","x":460,"y":40,"w":160,"label":"mTORC1 (Raptor)","fs":14},{"id":"ampk","x":160,"y":180,"w":90,"label":"AMPK"},{"id":"s6k","x":480,"y":180,"w":120,"label":"S6K, синтез","fs":14}],"edges":[{"id":"a1","pts":[110,60,158,60],"type":"inh"},{"id":"a2","pts":[250,60,298,60],"type":"inh","label":"GAP","lx":274,"ly":52},{"id":"a3","pts":[410,60,458,60],"type":"act"},{"id":"a4","pts":[205,178,205,82],"type":"act","label":"T1227, S1345","lx":140,"ly":135},{"id":"a5","pts":[250,200,470,160,520,82],"type":"inh","label":"Raptor: S722, S792","lx":400,"ly":200},{"id":"a6","pts":[540,82,540,178],"type":"act"}],"states":[{"on":["akt","rheb","mt","s6k"],"inh":["tsc"],"p":["akt","tsc"],"show":["a1","a3","a6"],"note":"Инсулин: AKT фосфорилирует и ослабляет TSC2, RHEB остаётся в GTP-форме и активирует mTORC1; S6K фосфорилирована."},{"on":["akt","tsc","ampk"],"inh":["mt"],"p":["akt","tsc","mt"],"show":["a2","a4","a5"],"note":"Инсулин и дефицит энергии: AMPK фосфорилирует TSC2 и усиливает его (меньше RHEB-GTP), а также фосфорилирует Raptor; mTORC1 подавлен, хотя AKT активна."},{"on":["rheb","ampk"],"miss":["tsc"],"inh":["mt"],"p":["mt"],"show":["a3","a5"],"hide":["a1","a2","a4"],"note":"Клетки без TSC2: RHEB-GTP высокий, но AMPK всё равно подавляет mTORC1 через фосфорилирование Raptor (Gwinn 2008). Поэтому два пути AMPK различимы опытом."}]}},"number":21,"question":4},{"id":"network-feedback","section":3,"questions":[4],"title":"Какие обратные связи ограничивают вход инсулиновой сети","keywords":["S6K","IRS1","Ser307","обратная связь","рапамицин","Copps","ингибитор PI3K","Hopkins","гипергликемия"],"lead":["S6K фосфорилирует IRS1 по серинам и ослабляет его связь с PI3K — отрицательная обратная связь от mTORC1 к входу сети.","Знак эффекта отдельного сайта зависит от системы: в культуре и в организме он может быть разным."],"mechanism":["Активная [[T53|S6K1]] фосфорилирует IRS1 по серину; IRS1 хуже связывает PI3K, и сигнал к AKT ослабевает.","[[T59|Рапамицин]] подавляет mTORC1 и S6K; петля ослабевает, и p-AKT повышается. Так бывает при кратком действии; длительный рапамицин в ряде клеток нарушает сборку mTORC2 и снижает p-AKT (Sarbassov 2006).","На уровне организма тоже есть петли: ингибитор PI3Kα вызывает гипергликемию, а компенсаторное повышение концентрации инсулина вновь активирует PI3K в опухоли."],"paragraphs":["Tremblay и Marette (2001) показали на мышечных клетках L6, что избыток аминокислот за час снижал стимулированный инсулином транспорт глюкозы почти вдвое; рапамицин это предотвращал. Аминокислоты через mTOR и S6K усиливали фосфорилирование IRS1 по серину и треонину и уменьшали его связь с p85. Harrington и соавт. (2004) нашли ту же петлю в клетках без TSC: постоянно активная S6K фосфорилировала IRS1 (S302 у мыши), и AKT активировалась слабо. Мыши без S6K1 на высокожировой диете сохраняли чувствительность к инсулину, хотя глюкоза и свободные жирные кислоты у них повышались (Um 2004). В адипоцитах 3T3-L1, впрочем, чувствительная к рапамицину петля, ограничивающая фосфорилирование AKT, по-видимому, идёт не через IRS1 (Tan 2012).","Но переносить вывод о роли одного сайта на целый организм нужно с осторожностью. Мыши, у которых Ser307 в IRS1 (Ser312 у человека) заменён на аланин, на высокожировой диете развивали более тяжёлую, а не более лёгкую инсулинорезистентность (Copps 2010). В краткосрочных опытах на культуре клеток фосфорилирование этого сайта ослабляет сигнал, а в длительных опытах на целом организме его роль иная. IRS1 тормозят несколько частично избыточных петель, и удаление одной перераспределяет вклад остальных.","Обратные связи действуют и между органами. Ингибиторы PI3Kα подавляют ответ на инсулин в мышцах, жире и печени и вызывают гипергликемию в первые часы. Поджелудочная железа отвечает выбросом инсулина, который вновь активирует PI3K в опухоли. В моделях на мышах кетогенная диета и ингибиторы SGLT2 снижали этот выброс и усиливали действие препарата (Hopkins 2018).","Наличие фосфорилированного «тормозящего» сайта само по себе не доказывает инсулинорезистентность: нужна проверка причинной связи."],"trap":["Фосфорилирование IRS1 по Ser307 всегда вызывает инсулинорезистентность.","В культуре клеток это фосфорилирование связано с ослаблением сигнала, но у мышей с заменой Ser307 резистентность была тяжелее. Знак эффекта зависит от системы и длительности."],"conditions":"L6 (Tremblay и Marette 2001), клетки без TSC (Harrington 2004, полный текст), мыши без S6K1 (Um 2004), мыши Irs1 S307A (Copps 2010), ингибиторы PI3K в моделях на мышах (Hopkins 2018, полный текст). Столбики — учебная модель практикума (вопрос 4).","sources":["TremblayMarette2001","Harrington2004","Um2004","Copps2010","Hopkins2018","Tan2012","Sarbassov2006"],"quiz":{"id":"S4-L22","rev":2,"question":"В модели гепатоцита (стационарный расчёт, mTORC2 сохранён) при умеренном инсулине добавили рапамицин. Как изменится p-AKT?","options":[{"id":"S4-L22-1","text":"Повысится: ослабнет петля S6K → IRS1","correct":true,"feedback":"Рапамицин подавляет S6K, IRS1 меньше фосфорилируется по серину и лучше передаёт сигнал к PI3K и AKT."},{"id":"S4-L22-2","text":"Снизится: рапамицин подавляет AKT","correct":false,"feedback":"Рапамицин действует на mTORC1, ниже AKT; AKT при этом не подавляется."},{"id":"S4-L22-3","text":"Не изменится: петли нет","correct":false,"feedback":"Отрицательная петля S6K → IRS1 показана в клетках разных типов; в модели её ослабление повышает p-AKT. При длительном действии рапамицин в ряде клеток нарушает сборку mTORC2 и снижает p-AKT (Sarbassov 2006) — этого модель не учитывает."}]},"widget":{"kind":"liver","title":"","s":{"r_akt":"p-AKT (S473)","r_fox":"p-FOXO1 (S256; у мыши S253)","r_pepck":"мРНК PEPCK","r_s6k":"p-S6K (T389)","r_srebp":"мРНК SREBP-1c","r_srebpn":"SREBP-1c в ядре","r_ampk":"активность AMPK","legend":"Учебная модель практикума (вопрос 4), гепатоцит; величины условные. мРНК PEPCK — % от уровня без инсулина, остальные — доля от наибольшего значения в модели.","title":"Петля S6K → IRS1","status":"Учебная модель, условные величины","modes_label":"Условия (инсулин 30 %)","modes":["Без препарата","Рапамицин","Ингибитор PI3Kα"],"conds":[{"ins":0.3},{"ins":0.3,"drug":"rapa"},{"ins":0.3,"drug":"pi3k"}],"notes":["Умеренный инсулин: S6K активна и через IRS1 ограничивает вход.","Рапамицин: S6K подавлена, петля ослабла — p-AKT выше, FOXO1 фосфорилирован сильнее.","Ингибитор PI3K: сигнал обрывается выше AKT — не отвечает ни одна ветвь."]}},"number":22,"question":4},{"id":"selective-ir","section":3,"questions":[4],"title":"Что такое селективная инсулинорезистентность печени","keywords":["селективная инсулинорезистентность","избирательная","LIRKO","ob/ob","SREBP-1c","глюконеогенез","липогенез","Brown","Goldstein"],"lead":["При селективной резистентности инсулин плохо подавляет глюконеогенез, но продолжает стимулировать липогенез.","Это рассогласование ветвей одной сети, а не равномерное ослабление сигнала."],"mechanism":["У мышей ob/ob — модели диабета 2 типа — печень продолжает выделять глюкозу при высоком инсулине, а [[T55|SREBP-1c]] и липогенез сохранены или усилены.","У мышей LIRKO (нет рецептора инсулина в гепатоцитах) не отвечает ни одна ветвь: SREBP-1c снижен, гипертриглицеридемии нет.","Ветви расходятся ниже AKT: подавление глюконеогенеза идёт через FOXO1, липогенез — через mTORC1 и SREBP-1c."],"paragraphs":["При диабете 2 типа резистентность печени к инсулину неполная: ветви инсулинового сигнала затронуты по-разному. Инсулин хуже подавляет глюконеогенез, и печень выделяет глюкозу при высокой концентрации гормона. Но липогенез через SREBP-1c сохраняется или усиливается. В итоге гипергликемия сочетается с гипертриглицеридемией — эту картину Brown и Goldstein (2008) назвали [[T56|селективной (избирательной) инсулинорезистентностью]].","Shimomura и соавт. (2000) нашли в печени мышей ob/ob и мышей с липодистрофией сниженную экспрессию IRS-2 при сохранённой способности инсулина стимулировать SREBP-1c. Полное выключение рецептора даёт иную картину: у мышей [[T57|LIRKO]] печень не отвечает на инсулин, возникает проатерогенный профиль липопротеинов, но SREBP-1c и секреция триглицеридов печенью снижены (Biddinger 2008). Это разные типы нарушения сети, а не точки одного градиента.","Почему одна ветвь страдает, а другая нет, до конца не установлено. Ветви расходятся ниже AKT и используют разных посредников (FOXO1 и mTORC1). По данным Titchenell и соавт. (2016), подавление продукции глюкозы печенью в значительной мере зависит от того, как инсулин подавляет липолиз в жировой ткани, тогда как липогенез требует сигнала в самом гепатоците.","В модели практикума рассогласование задано так: ветви AKT различаются чувствительностью, и при сниженном IRS-2 и высоком инсулине сигнала хватает для mTORC1, но не для FOXO1. Это учебное допущение, а не установленный механизм: в адипоцитах 3T3-L1 фосфорилирование FOXO1, напротив, чувствительнее к инсулину, чем фосфорилирование TSC2 и AS160 (Tan 2012). Данные Titchenell и соавт. (2016) указывают на другое объяснение: сигнал в гепатоците сохранён и поддерживает липогенез, а продукцию глюкозы печенью не подавляет избыток жирных кислот, поступающих из жировой ткани. И ещё одно ограничение: модель и опыты с мРНК сравнивают маркеры ветвей (мРНК PEPCK, мРНК и ядерный белок SREBP-1c), а не скорости глюконеогенеза и липогенеза; продукция глюкозы печенью включает и гликогенолиз."],"trap":["При инсулинорезистентности все действия инсулина в печени ослаблены одинаково.","При селективной резистентности подавление глюконеогенеза ослаблено, а липогенез сохранён. Полная потеря рецептора (LIRKO) даёт иной фенотип."],"conditions":"Мыши ob/ob и с липодистрофией (Shimomura 2000), LIRKO (Biddinger 2008), понятие селективной резистентности (Brown и Goldstein 2008), вклад жировой ткани (Titchenell 2016, полный текст), чувствительность субстратов AKT в адипоцитах (Tan 2012, полный текст). Столбики — учебная модель практикума (вопрос 4п); допущение о разной чувствительности ветвей — учебное.","sources":["BrownGoldstein2008","Shimomura2000","Biddinger2008","Titchenell2016","Tan2012"],"quiz":{"id":"S4-L23","question":"Чем селективная инсулинорезистентность печени отличается от полной потери рецептора (LIRKO)?","options":[{"id":"S4-L23-1","text":"Липогенез сохранён, а глюконеогенез не подавляется","correct":true,"feedback":"Ветвь mTORC1–SREBP-1c отвечает на инсулин, ветвь FOXO1 — нет; при LIRKO не отвечает ни одна ветвь."},{"id":"S4-L23-2","text":"Глюконеогенез подавлен, а липогенез нарушен","correct":false,"feedback":"Это обратная картина. При селективной резистентности печень продолжает выделять глюкозу и синтезировать липиды."},{"id":"S4-L23-3","text":"Ничем: при обоих состояниях нет ответа ни одной ветви","correct":false,"feedback":"При селективной резистентности ранние звенья работают и липогенная ветвь отвечает; этим и различаются фенотипы."}]},"widget":{"kind":"liver","title":"","s":{"r_akt":"p-AKT (S473)","r_fox":"p-FOXO1 (S256; у мыши S253)","r_pepck":"мРНК PEPCK","r_s6k":"p-S6K (T389)","r_srebp":"мРНК SREBP-1c","r_srebpn":"SREBP-1c в ядре","r_ampk":"активность AMPK","legend":"Учебная модель практикума (вопрос 4), гепатоцит; величины условные. мРНК PEPCK — % от уровня без инсулина, остальные — доля от наибольшего значения в модели.","title":"Три состояния печёночной сети (инсулин высокий)","status":"Учебная модель, условные величины","modes_label":"Печень","modes":["Норма","Селективная резистентность","LIRKO"],"conds":[{"ins":1},{"ins":1,"g":"sel"},{"ins":1,"g":"lirko"}],"notes":["Норма: обе ветви отвечают — PEPCK подавлен, SREBP-1c активен.","Селективная резистентность: p-AKT снижен примерно вдвое, мРНК PEPCK снижена слабо, а мРНК SREBP-1c почти такая же, как в норме.","LIRKO: нет p-AKT, и ни одна из ветвей не отвечает."]}},"number":23,"question":4},{"id":"test-branches","section":3,"questions":[4],"title":"Как проверяют, где расходятся ветви сети","keywords":["рапамицин","Li 2010","разветвление","резерв","spareness","фосфорилирование и активность","Titchenell"],"lead":["Точку разветвления находят с помощью воздействий, которые выключают одну ветвь и оставляют другую.","Рапамицин блокирует индукцию мРНК SREBP-1c, но не подавление мРНК PEPCK; ингибиторы PI3K и AKT блокируют обе."],"mechanism":["В гепатоцитах крысы рапамицин блокировал индукцию мРНК SREBP-1c инсулином, но не мешал снижению мРНК PEPCK (Li 2010).","Ингибиторы PI3K и AKT блокировали обе ветви — значит, они расходятся ниже AKT.","[[T58|Резерв сети]]: умеренное ослабление ранних узлов — числа рецепторов или фосфорилирования AKT — не обязательно меняет выход."],"paragraphs":["Li, Brown и Goldstein (2010) добавляли инсулин к свежевыделенным гепатоцитам крысы: мРНК SREBP-1c возрастала примерно в 25 раз, мРНК PEPCK снижалась примерно на 95 %. Ингибиторы PI3K и AKT блокировали оба ответа. Рапамицин в субнаномолярной концентрации блокировал индукцию мРНК SREBP-1c, но не подавление PEPCK; тот же результат получен у крыс и мышей при кормлении после голодания. Ингибитор S6K индукцию мРНК SREBP-1c не блокировал.","Отсюда вывод: ветви расходятся ниже AKT, на уровне mTORC1, а индукция мРНК SREBP-1c использует мишень mTORC1, отличную от S6K. Это относится к измеренной величине — мРНК. Owen и соавт. (2012) на гепатоцитах трансгенных крыс, у которых SREBP-1c синтезируется под постоянным промотором, отдельно изучили протеолитическое созревание белка: оно тоже требует mTORC1, но, в отличие от индукции мРНК, блокируется ингибитором S6K. Значит, после mTORC1 липогенная ветвь сама разветвляется. Именно на уровне mTORC1 возможно рассогласование ветвей при селективной резистентности.","Интерпретируя измерения, нужно учитывать резерв сети. В адипоцитах крупных тучных крыс число рецепторов инсулина было снижено на 30–40 %, но это лишь сдвигало кривую «доза — ответ» вправо, а максимальный транспорт глюкозы не менялся (Olefsky 1976). В адипоцитах 3T3-L1 подавление фосфорилирования AKT примерно на 85 % лишь немного снижало фосфорилирование её субстратов (Tan 2012). Поэтому умеренное изменение раннего узла не обязательно объясняет изменение физиологического ответа.","Наконец, фосфорилирование не тождественно активности: вывод о ветви делают по её выходу — фосфорилированию субстрата, локализации фактора, экспрессии гена-мишени."],"trap":["Если в печени снижено фосфорилирование AKT, то обязательно и пропорционально ослаблены все её действия.","У сети есть резерв: умеренное снижение p-AKT может почти не менять фосфорилирование субстратов, а ветви ниже AKT регулируются по-разному."],"conditions":"Гепатоциты крысы (Li 2010, аннотация: 25 раз, 95 %, субнаномолярный рапамицин; измерялась мРНК); созревание SREBP-1c — гепатоциты трансгенных крыс (Owen 2012, аннотация); резерв сети — адипоциты (Olefsky 1976, аннотация), адипоциты 3T3-L1 (Tan 2012, полный текст) и обзор Burchfield и соавт. (2025); роль жировой ткани — Titchenell и соавт. (2016). Таблица — схема опытов.","sources":["Li2010","Owen2012","Olefsky1976","Tan2012","Burchfield2025","Titchenell2016"],"quiz":{"id":"S4-L24","rev":2,"question":"Рапамицин блокирует индукцию мРНК SREBP-1c инсулином, но не подавление мРНК PEPCK, а ингибитор AKT блокирует оба ответа. Где расходятся эти ветви?","options":[{"id":"S4-L24-1","text":"Выше PI3K, на уровне рецептора","correct":false,"feedback":"Ингибиторы PI3K и AKT блокируют обе ветви, значит, до AKT они общие."},{"id":"S4-L24-2","text":"Ниже AKT: индукция мРНК SREBP-1c требует mTORC1","correct":true,"feedback":"Оба ответа зависят от AKT, а рапамицин выключает только индукцию мРНК SREBP-1c: разветвление ниже AKT, на уровне mTORC1."},{"id":"S4-L24-3","text":"На уровне S6K","correct":false,"feedback":"Ингибитор S6K не блокировал индукцию мРНК SREBP-1c (Li 2010). S6K нужна для другого этапа — созревания белка SREBP-1c (Owen 2012)."}]},"widget":{"kind":"table","title":"","s":{"title":"Опыты, разделяющие ветви","status":"Схема опытов · данные указанных работ","modes_label":"Опыт","modes":["Воздействия на гепатоциты","Генетические модели","Резерв сети"],"tables":[{"head":["Воздействие","мРНК SREBP-1c","созревание SREBP-1c","мРНК PEPCK"],"rows":[["инсулин","↑ ~25 раз","↑","↓ ~95 %"],["инсулин + ингибитор PI3K или AKT","не растёт","—","не снижается"],["инсулин + рапамицин","не растёт","блокировано","↓ как без рапамицина"],["инсулин + ингибитор S6K","растёт","блокировано","↓"]],"note":"мРНК — гепатоциты крысы (Li 2010); созревание белка — гепатоциты трансгенных крыс (Owen 2012); «—» — не измерялось. Ветви общие до AKT и расходятся на уровне mTORC1; индукция мРНК SREBP-1c не требует S6K, созревание белка — требует."},{"head":["Модель","Глюконеогенез","Липогенез","Источник"],"rows":[["ob/ob (диабет 2 типа)","не подавляется","сохранён, SREBP-1c ↑","Shimomura 2000"],["LIRKO","печень не отвечает на инсулин","снижен, SREBP-1c ↓","Biddinger 2008"],["печень без AKT1/2 и FOXO1","инсулин подавляет через жировую ткань","требует AKT в гепатоците","Titchenell 2016"]],"note":"Разные модели дают разные сочетания: резистентность — не одна величина, а состояние ветвей."},{"head":["Наблюдение","Система","Вывод"],"rows":[["подавление p-AKT на ~85 % мало меняет фосфорилирование субстратов","адипоциты 3T3-L1 (Tan 2012)","у сети есть резерв"],["снижение числа рецепторов на 30–40 % сдвигает кривую «доза — ответ», максимум сохраняется","адипоциты крысы (Olefsky 1976)","умеренное изменение раннего узла может не менять выход"]],"note":"Раннее изменение узла нельзя автоматически считать причиной изменения физиологического ответа."}]}},"number":24,"question":4},{"id":"methods","section":4,"questions":[1,2,3,4],"title":"Как выбрать измеряемую величину, метод и контроль","keywords":["оптогенетика","PhyB","PIF","ооциты","Cre–loxP","LIRKO","нокаут","ингибитор","siRNA","контроль","усреднение"],"lead":["Каждый вопрос семинара требует своей величины: крутизна — кривой доз, длительность — серии точек времени, переключатель — ответа отдельных клеток, ветвление — выходов разных ветвей.","Метод выбирают по величине, а контроль — по тому, какое другое объяснение нужно исключить."],"mechanism":["Оптогенетический вход задаёт профиль сигнала в обход рецептора и позволяет установить, на какой профиль сигнала отвечает нижележащий процесс.","Измерение отдельных ооцитов отличает переключатель «всё или ничего» от плавного ответа, который возникает при усреднении.","Тканеспецифический нокаут (система [[T60|Cre–loxP]]) выключает ген в одном типе клеток и позволяет отличить прямое действие от действия через другие органы."],"paragraphs":["Оптогенетика позволяет экспериментатору задавать входной сигнал. В опытах Toettcher и соавт. (2013) на мембране закрепили фоторецептор PhyB, а каталитический домен SOS соединили с белком PIF. Красный свет переводит PhyB в форму, связывающую PIF, и SOS переходит к мембране, где активирует RAS; дальний красный свет возвращает его в цитоплазму. Так можно подать на RAS импульс заданной длительности, не меняя рецепторы и их петли. Контроль — тот же свет в клетках без конструкции.","Переключатель проверяют по отдельным клеткам. Ferrell и Machleder (1998) измеряли активацию MAPK в каждом ооците лягушки отдельно. При промежуточной дозе прогестерона часть ооцитов была полностью активна, остальные — неактивны, а среднее по популяции выглядело плавным. Ответ отдельного ооцита соответствовал эффективному коэффициенту Хилла не меньше 35. Петлю проверяли так: в ооцитах с циклогексимидом Mos не синтезируется, и MAPK активировали введённым белком Mos — ответ отдельного ооцита становился постепенным (Ferrell 1999).","Действие гормона в одном органе проверяют тканеспецифическим нокаутом. Участок гена окружают сайтами loxP, а рекомбиназу Cre экспрессируют под контролем промотора, активного только в гепатоцитах, например промотором гена альбумина. Cre вырезает участок между сайтами, и белок исчезает только в печени. Так получены мыши LIRKO (Michael 2000) и мыши без AKT1/2 в печени (Titchenell 2016). Контроль — мыши с сайтами loxP, но без Cre.","Одно воздействие показывает зависимость, но не доказывает её. Вывод надёжен, если его подтверждают два независимых способа — например, ингибитор и siRNA к тому же белку, — а результат не зависит от побочного действия каждого. В опыте Li и соавт. (2010) ингибиторы PI3K, AKT, mTORC1 и S6K вместе указали, где расходятся ветви.","Два метода практикума измеряют то, что не видно на обычном блоте. Активный RAS выделяют из лизата доменом RAF, связывающим RAS (RBD), закреплённым на гранулах: он связывает только GTP-форму, и связавшийся RAS выявляют на блоте. Количество мРНК, например PEPCK, определяют методом ОТ-ПЦР: обратная транскриптаза переписывает мРНК в кДНК, которую затем умножают в ПЦР; чем больше исходной мРНК, тем раньше продукт достигает порога."],"trap":["Если среднее по популяции растёт плавно, то и каждая клетка отвечает плавно.","Плавное среднее может складываться из ответов «всё или ничего» в отдельных клетках с разным порогом. Переключатель видно только при измерении отдельных клеток."],"conditions":"Оптогенетика — клетки NIH3T3 (Toettcher 2013, полный текст); ооциты Xenopus (Ferrell и Machleder 1998, аннотация и обзор Ferrell 1999); Cre–loxP в печени — Michael и соавт. (2000, аннотация) и Titchenell и соавт. (2016, полный текст); анализ ветвей — Li и соавт. (2010). Схемы показывают устройство методов, не результаты опыта.","sources":["Toettcher2013","FerrellMachleder1998","Ferrell1999","Michael2000","Titchenell2016","Li2010","Copps2010"],"quiz":{"id":"S4-L25","question":"Нужно проверить, работает ли ответ клеток как переключатель «всё или ничего». Какой опыт для этого подходит?","options":[{"id":"S4-L25-1","text":"Измерить ответ отдельных клеток при разных дозах","correct":true,"feedback":"Только отдельные клетки показывают, есть ли два состояния; при промежуточной дозе часть клеток включена полностью, часть — нет."},{"id":"S4-L25-2","text":"Измерить лизат всей популяции при разных дозах","correct":false,"feedback":"Измерение в лизате усредняет ответ клеток: из ответов «всё или ничего» с разным порогом складывается плавная кривая."},{"id":"S4-L25-3","text":"Добавить ингибитор MEK при одной дозе","correct":false,"feedback":"Ингибитор покажет зависимость ответа от MEK, но не форму ответа отдельной клетки."}]},"widget":{"kind":"method","title":"","s":{"title":"Как устроены методы семинара","status":"Схемы методов · не экспериментальные данные","modes_label":"Метод","modes":["Оптогенетика","Отдельные ооциты","Нокаут в печени","Нокин и циклогексимид","Ингибитор и второй способ","RAS-GTP и мРНК"],"schemes":[{"draw":"opto","h":300,"l":{"pA":"А","a":"Темнота или дальний красный свет","pB":"Б","b":"Красный свет","mem":"мембрана","far":"дальний красный","red":"красный свет","cyto":"SOScat в цитоплазме,\nERK неактивна","erk":"RAS активен,\nERK фосфорилирована","read":"Выход измеряют в той же клетке: ERK в ядре, белки-мишени, фосфорилирование STAT3"},"note":"А — PIF–SOScat находится в цитоплазме и не достигает RAS. Б — красный свет переводит PhyB в форму, связывающую PIF, SOScat переходит к мембране и активирует RAS. Длительность и число импульсов задаёт экспериментатор."},{"draw":"oocyte","h":300,"data":[1,0,0,1,0,1,0,0,1,0,1,0],"l":{"pA":"А","a":"Лизат многих ооцитов","lysate":"лизат","mean":"среднее","pB":"Б","b":"Каждый ооцит отдельно","single1":"активация «всё или ничего»:","single2":"либо полная, либо нет"},"note":"Условный пример: при промежуточной дозе прогестерона 5 из 12 ооцитов полностью активны. А — в общем лизате видно среднее около 40 %, как при плавном ответе. Б — отдельные ооциты показывают два состояния без промежуточных."},{"draw":"cre","h":300,"l":{"pA":"А","a":"Ген рецептора инсулина с сайтами loxP","exon":"вырезаемый участок","lox":"сайты loxP","alb":"промотор альбумина → Cre","after":"после рекомбинации","pB":"Б","b":"Рецептор удалён только в гепатоцитах","liver":"гепатоциты","muscle":"мышцы","fat":"жировая ткань"},"note":"А — рекомбиназа Cre синтезируется только в гепатоцитах и вырезает участок гена между сайтами loxP. Б — в печени рецептора нет, в других тканях он сохранён. Контроль — мыши с сайтами loxP без Cre."},{"draw":"knockin","h":300,"l":{"pA":"А","a":"Нокин: замена одного сайта","wt":"норма","ki":"нокин S307A","prot1":"IRS1 Ser307","prot2":"IRS1 Ala307","res":"аланин не фосфорилируется:\nсайт выключен, белок сохранён","pB":"Б","b":"Циклогексимид","mrna":"мРНК","ribo":"рибосома","chx":"циклогексимид","newp":"новые: DUSP, SPRY, Mos","oldp":"уже имеющиеся: ERK","res2":"синтез белка остановлен;\nимеющиеся белки работают"},"note":"А — в нокине кодон серина заменён кодоном аланина: белок синтезируется, но этот остаток не фосфорилируется (так получены мыши Irs1 S307A, Copps 2010). Б — циклогексимид останавливает трансляцию на рибосоме: новые белки (DUSP, SPRY, Mos) не образуются, а уже имеющиеся работают. Поэтому он выключает медленную петлю, но действует на синтез всех белков сразу."},{"draw":"drug","h":280,"l":{"pA":"А","a":"Ингибитор MEK","pB":"Б","b":"siRNA к MEK1/2","target":"ген-мишень","inh":"ингибитор","si":"белка нет","res":"выход снижен"},"note":"А — ингибитор подавляет активность MEK, но при высокой дозе может действовать и на другие киназы. Б — siRNA снижает количество MEK иным путём; её ограничения — неполное подавление и компенсация. Если оба способа снижают выход, вывод о роли MEK надёжнее."},{"draw":"pulldown","h":300,"l":{"pA":"А","a":"RAS-GTP: связывание с доменом RBD","lysate":"лизат","bead":"RBD RAF","bind":"связывается\nтолько RAS-GTP","blot":"блот:\nRAS","pB":"Б","b":"мРНК: ОТ-ПЦР","mrna":"мРНК PEPCK","rt":"обратная\nтранскриптаза","cdna":"кДНК","pcr":"ПЦР","cycles":"циклы ПЦР","c1":"много мРНК","c2":"мало мРНК"},"note":"А — домен RAF, связывающий RAS (RBD), закреплён на гранулах и связывает только GTP-форму RAS; связавшийся белок выявляют на блоте антителами к RAS. Б — обратная транскриптаза переписывает мРНК в кДНК, которую затем умножают в ПЦР: чем больше исходной мРНК, тем раньше кривая накопления продукта превышает порог."}]}},"number":25,"question":0},{"id":"investigation","section":4,"questions":[1,2,3,4],"title":"Один каскад под действием ингибитора: четыре вопроса вместе","keywords":["меланома","BRAF V600E","вемурафениб","ингибитор MEK","площадь","интегральная активность","отскок","PI3K","инсулин","Hopkins"],"lead":["Опухоль с BRAF V600E под действием препарата объединяет все четыре вопроса семинара: усиление, длительность, обратные связи и перекрёстная регуляция сетей.","Успех лечения в модели определяет не минимум pERK в первый час, а то, сколько активности ERK остаётся за сутки."],"mechanism":["Усиление и резерв: остаточная активность RAF усиливается каскадом, а клеткам для деления хватает небольшой доли активной ERK.","Длительность и обратная связь: вемурафениб снимает ERK-зависимое торможение, и через часы pERK частично восстанавливается.","Перекрёстная регуляция сетей: при подавлении одного пути отвечают соседние — у ингибиторов PI3K это выброс инсулина, вновь активирующий PI3K в опухоли."],"paragraphs":["Вопрос 1 — усиление. Каскад усиливает сигнал, поэтому даже небольшая остаточная активность RAF поддерживает заметную долю pERK. Albeck и соавт. (2013) показали в эпителиальных клетках MCF-10A, что пролиферация останавливалась, только когда выход пути ERK (по уровню белка Fra-1) падал ниже примерно 10 % исходного; подавление выхода на 85 % снижало пролиферацию меньше чем вдвое. Перенос этого порога на меланому — допущение, но вывод общий: подавление должно быть глубоким.","Вопросы 2 и 3 — длительность и обратная связь. Измерение pERK через час завышает эффект препарата. Lito и соавт. (2012) показали, что после добавления вемурафениба DUSP и SPRY исчезают за 4–8 ч, RAS-GTP растёт и образуются RAF-димеры, на которые препарат действует слабо. Поэтому нужно измерять серию точек за сутки и оценивать интегральную активность — площадь под кривой pERK. В учебной модели вемурафениб снижает её примерно до 40 % от уровня без препарата, а сочетание с ингибитором MEK — до 8 %.","Вопрос 4 — перекрёстная регуляция сетей. Hopkins и соавт. (2018) показали, что ингибиторы PI3Kα вызывают гипергликемию, выброс инсулина вновь активирует PI3K–mTOR в опухоли, а ограничение этого выброса усиливает действие препарата у мышей. Сигнальная сеть клетки встроена в сеть организма, и её ответ на препарат зависит от гормонов.","Вывод: чтобы оценить действие ингибитора, нужны кривая доз (крутизна и порог), серия точек во времени (отскок и площадь), измерение обратных связей (DUSP, SPRY, RAS-GTP) и учёт соседних путей. Выбор схемы лечения — решение онколога; пример иллюстрирует системный подход."],"trap":["Препарат эффективен, если через час после добавления pERK снизился на 80 %.","Через час обратная связь ещё не перестроилась. Важно, сколько активности ERK остаётся за сутки, и ниже ли она порога, необходимого для деления клеток."],"conditions":"Порог 10 % — клетки MCF-10A (Albeck 2013, полный текст); отскок — клетки меланомы с BRAF V600E (Lito 2012, полный текст); выброс инсулина — модели на мышах (Hopkins 2018, полный текст). Кривые — учебная модель практикума (вопрос 3п), среда с сывороткой, относительные величины; площадь — за 48 ч относительно опыта без препарата.","sources":["Albeck2013","Lito2012","Hopkins2018"],"quiz":{"id":"S4-L26","question":"Какой показатель лучше всего отражает действие ингибитора RAF на клетки меланомы за сутки?","options":[{"id":"S4-L26-1","text":"pERK через 1 ч после добавления","correct":false,"feedback":"Через час pERK минимален: отрицательная обратная связь ещё не снята, а восстановление pERK ещё не началось."},{"id":"S4-L26-2","text":"Площадь под кривой pERK за 24–48 ч","correct":true,"feedback":"Площадь учитывает и глубину подавления, и частичное восстановление pERK после снятия обратной связи."},{"id":"S4-L26-3","text":"Количество общей ERK через 24 ч","correct":false,"feedback":"Ингибитор RAF меняет фосфорилирование ERK, а не её количество; общая ERK служит контролем загрузки."}]},"widget":{"kind":"course","title":"","s":{"title":"Меланома BRAF V600E: pERK за двое суток","status":"Учебная модель по данным Lito 2012; относительные величины","modes_label":"Препарат","modes":["Без препарата","Вемурафениб","Вемурафениб + ингибитор MEK"],"runs":[{"cfg":{"mode":"mel"},"input":"none","tmax":2880,"hours":true},{"cfg":{"mode":"mel","vem":true},"input":"none","tmax":2880,"hours":true},{"cfg":{"mode":"mel","vem":true,"trame":true},"input":"none","tmax":2880,"hours":true}],"keys":["E"],"key_labels":["pERK"],"ref":0,"ref_label":"без препарата","x":"время, мин","x_h":"время после добавления препарата, ч","y":"% соответствующей шкалы модели","scale":"Шкала: pERK — доля всей ERK, фосфорилированной по TEY. Расчёт модели; кривая не нормирована на собственный максимум.","u_min":"мин","points":[{"label":"pERK через 1 ч","key":"E","t":1},{"label":"pERK через 24 ч","key":"E","t":24},{"label":"площадь pERK за 48 ч","key":"E","kind":"area","of":0}],"notes":["Без препарата: pERK постоянно высокий; это точка отсчёта для площади.","Вемурафениб: глубокий минимум в первый час, затем частичное восстановление; площадь за 48 ч — около 40 % от уровня без препарата.","Вемурафениб и ингибитор MEK: отскок через RAF-димеры блокирован, площадь — около 8 %."]}},"number":26,"question":0}],"sections":[{"title":"Усиление и завершение","entry":"cascade","sub":"Как каскад усиливает сигнал и как сигнал завершается","intro":"Как устроен каскад RAS → RAF → MEK → ERK, чем каталитическое усиление отличается от крутизны ответа, какие механизмы завершают сигнал, что меняют потеря NF1 и мутация KRAS G12C и как измеряют активность каскада.","first":1,"last":6,"count":6},{"title":"Длительность сигнала","entry":"profile","sub":"Как длительность активности ERK определяет ответ клетки","intro":"Какими свойствами описывают временной профиль сигнала, почему EGF и NGF вызывают разные ответы клеток PC12, как доказывают причинную роль длительности, как c-Fos считывает длительность и почему важно измерять отдельные клетки.","first":7,"last":12,"count":6},{"title":"Обратные связи","entry":"feedback-vs-termination","sub":"Как петли регуляции формируют профиль и создают переключатель","intro":"Чем обратная связь отличается от завершения сигнала, как работают быстрая и медленная отрицательные петли, почему ингибитор RAF вызывает отскок ERK, как положительная петля создаёт бистабильность и гистерезис и какие бывают виды адаптации.","first":13,"last":18,"count":6},{"title":"Сеть инсулина","entry":"insulin-akt","sub":"Как AKT, mTORC1 и AMPK распределяют сигнал по ветвям","intro":"Как инсулин активирует AKT, как AKT снимает торможение с ветвей сети, как mTORC1 объединяет входы AKT и AMPK, какие петли ограничивают вход сети и что такое селективная инсулинорезистентность печени.","first":19,"last":24,"count":6},{"title":"Исследование","entry":"methods","sub":"Как выбрать величину, метод и контроль","integr":true,"intro":"Какой величиной, каким методом и с каким контролем проверяют каждое свойство сигнала и как четыре вопроса семинара объединяются при анализе одного ингибитора.","first":25,"last":26,"count":2}],"glossary":[{"id":"S4-T01","term":"Сигнальный каскад","section":0,"def":"Последовательность белков, в которой каждый активированный участник активирует следующий; в каскаде MAP-киназ это RAS → RAF → MEK → ERK."},{"id":"S4-T02","term":"MAP-киназный каскад","section":0,"def":"Три последовательных уровня протеинкиназ (MAPKKK → MAPKK → MAPK); в пути ERK это RAF → MEK → ERK."},{"id":"S4-T03","term":"Мотив TEY","section":0,"def":"Участок активационной петли ERK из треонина, глутамата и тирозина; фосфорилирование T202 и Y204 (у ERK1) делает ERK активной."},{"id":"S4-T04","term":"Киназа двойной специфичности","section":0,"def":"Протеинкиназа, которая фосфорилирует и тирозин, и серин или треонин; так MEK фосфорилирует ERK по двум остаткам мотива TEY."},{"id":"S4-T05","term":"Каталитическое усиление","section":0,"def":"Рост числа активных молекул по ходу каскада: одна активная киназа за время сигнала фосфорилирует много молекул субстрата."},{"id":"S4-T06","term":"Сверхчувствительность","section":0,"def":"Ответ, который при небольшом изменении стимула около порога меняется от почти нулевого до почти максимального; крутизну описывают коэффициентом Хилла."},{"id":"S4-T07","term":"Коэффициент Хилла","section":0,"def":"Показатель крутизны кривой «доза — ответ»: 1 соответствует гиперболической кривой, значения больше 1 — более крутому, сигмоидному ответу."},{"id":"S4-T08","term":"Переключение нулевого порядка","section":0,"def":"Крутой ответ цикла модификации, когда киназа и фосфатаза насыщены субстратом; описан Goldbeter и Koshland (1981)."},{"id":"S4-T09","term":"Дистрибутивное фосфорилирование","section":0,"def":"Фосфорилирование двух сайтов, при котором фермент после первого присоединения фосфата отделяется от субстрата и для второго связывается с ним заново."},{"id":"S4-T10","term":"Завершение сигнала","section":0,"def":"Возвращение пути в исходное состояние: гидролиз GTP в RAS, дефосфорилирование киназ, интернализация и разрушение рецептора."},{"id":"S4-T11","term":"GAP (белок, активирующий ГТФазу)","section":0,"def":"Белок, который многократно ускоряет гидролиз GTP малой ГТФазой и тем самым переводит её в неактивную GDP-форму; для RAS это, например, нейрофибромин."},{"id":"S4-T12","term":"SOS","section":0,"def":"Фактор обмена гуаниновых нуклеотидов (GEF) для RAS: заменяет GDP на GTP и активирует RAS у плазматической мембраны."},{"id":"S4-T13","term":"Нейрофибромин (NF1)","section":0,"def":"GAP для RAS; потеря его функции при нейрофиброматозе 1 типа удлиняет и усиливает сигнал RAS."},{"id":"S4-T14","term":"KRAS G12C","section":0,"def":"Онкогенная замена глицина 12 на цистеин в KRAS; мутантный белок почти нечувствителен к GAP и дольше остаётся в GTP-форме."},{"id":"S4-T15","term":"Соторасиб","section":0,"def":"Ковалентный ингибитор KRAS G12C; связывается с цистеином 12 в GDP-форме белка и удерживает KRAS в неактивном состоянии."},{"id":"S4-T16","term":"DUSP (фосфатазы двойной специфичности)","section":0,"def":"Фосфатазы, которые отщепляют фосфат и от треонина, и от тирозина мотива TEY и тем самым инактивируют ERK; часть из них синтезируется в ответ на сигнал ERK."},{"id":"S4-T17","term":"Интернализация рецептора","section":0,"def":"Перенос рецептора с поверхности клетки в эндосомы; затем рецептор возвращается на мембрану или разрушается в лизосомах."},{"id":"S4-T18","term":"pERK","section":0,"def":"Обозначение ERK, фосфорилированной по обоим остаткам мотива TEY. На графиках модели — рассчитанная доля такой ERK; на блоте антителами к фосфорилированной форме оценивают её относительное содержание после нормировки на общую ERK."},{"id":"S4-T19","term":"Временной профиль сигнала","section":1,"def":"Изменение активности сигнального белка во времени; описывается амплитудой, длительностью, числом и частотой импульсов и площадью под кривой."},{"id":"S4-T20","term":"Площадь под кривой","section":1,"def":"Интеграл активности по времени; одинаковая площадь может складываться из короткого высокого пика или длительного низкого плато."},{"id":"S4-T21","term":"Клетки PC12","section":1,"def":"Линия клеток феохромоцитомы крысы; при действии NGF они дифференцируются в нейроноподобные клетки, при действии EGF — делятся."},{"id":"S4-T22","term":"EGF и NGF","section":1,"def":"Факторы роста: эпидермальный фактор роста (EGF) и фактор роста нервов (NGF); активируют разные рецепторные тирозинкиназы — EGFR и TrkA."},{"id":"S4-T23","term":"Ген немедленного ответа","section":1,"def":"Ген, транскрипция которого начинается в первые минуты после стимула без синтеза новых белков, например c-fos."},{"id":"S4-T24","term":"c-Fos","section":1,"def":"Транскрипционный фактор, продукт гена немедленного ответа c-fos; при длительной активности ERK фосфорилируется и стабилизируется."},{"id":"S4-T25","term":"DEF-мотив (FXFP)","section":1,"def":"Участок связывания ERK в субстрате; в c-Fos становится доступным после первого фосфорилирования и позволяет ERK фосфорилировать белок дальше."},{"id":"S4-T26","term":"Оптогенетический вход","section":1,"def":"Управление сигнальным белком светом через светочувствительные белки; позволяет задать длительность и число импульсов в обход рецептора."},{"id":"S4-T27","term":"Паракринная программа","section":1,"def":"Ответ, при котором клетка выделяет сигнальные белки, действующие на соседние клетки; так длительный сигнал RAS вызывает фосфорилирование STAT3."},{"id":"S4-T28","term":"Популяционное измерение","section":1,"def":"Измерение суммарного сигнала многих клеток, например в лизате; оно показывает среднее и скрывает различия между клетками."},{"id":"S4-T29","term":"Репортёр активности ERK","section":1,"def":"Белковый сенсор, флуоресценция которого меняется при фосфорилировании ERK; показывает динамику в отдельной живой клетке."},{"id":"S4-T30","term":"Обратная связь","section":2,"def":"Связь, при которой выход пути влияет на его же вход или верхние звенья."},{"id":"S4-T31","term":"Отрицательная обратная связь","section":2,"def":"Обратная связь, при которой выход пути ослабляет собственную активацию; ограничивает амплитуду и длительность сигнала."},{"id":"S4-T32","term":"Положительная обратная связь","section":2,"def":"Обратная связь, при которой выход пути усиливает собственную активацию; может создавать устойчивое включённое состояние."},{"id":"S4-T33","term":"SPRY и SPRED","section":2,"def":"Белки, синтез которых индуцирует ERK; ослабляют активацию RAS и RAF и тем самым замыкают медленную отрицательную петлю."},{"id":"S4-T34","term":"Бистабильность","section":2,"def":"Существование двух устойчивых состояний при одном и том же стимуле; в каком из них находится система, зависит от предыстории."},{"id":"S4-T35","term":"Гистерезис","section":2,"def":"Зависимость ответа от предыстории: порог включения выше, чем порог выключения."},{"id":"S4-T36","term":"Необратимость ответа","section":2,"def":"Сохранение включённого состояния после удаления стимула; крайний случай гистерезиса."},{"id":"S4-T37","term":"Бимодальное распределение","section":2,"def":"Распределение клеток по ответу с двумя пиками — включёнными и выключенными клетками без промежуточных."},{"id":"S4-T38","term":"BRAF V600E","section":2,"def":"Мутация BRAF (замена валина 600 на глутамат), при которой киназа активна в виде мономера без RAS; частая мутация меланомы."},{"id":"S4-T39","term":"Вемурафениб","section":2,"def":"Ингибитор мономера BRAF V600E; на RAF-димеры действует слабо."},{"id":"S4-T40","term":"RAF-димеры","section":2,"def":"Комплексы двух молекул RAF (BRAF, CRAF), образующиеся при участии RAS-GTP; к ингибиторам мономера BRAF V600E относительно устойчивы."},{"id":"S4-T41","term":"Точная адаптация","section":2,"def":"Возвращение ответа к исходному уровню при постоянном стимуле; новый скачок стимула вызывает новый ответ."},{"id":"S4-T42","term":"Десенситизация","section":2,"def":"Снижение чувствительности системы после действия стимула, например из-за удаления рецепторов с поверхности клетки."},{"id":"S4-T43","term":"Возбудимость","section":2,"def":"Свойство системы отвечать на стимул выше порога одним стандартным импульсом с последующим возвратом в покой."},{"id":"S4-T44","term":"Рецептор инсулина (INSR)","section":3,"def":"Рецепторная тирозинкиназа; после связывания инсулина аутофосфорилируется и фосфорилирует адаптеры IRS."},{"id":"S4-T45","term":"IRS1 и IRS2","section":3,"def":"Адаптеры рецептора инсулина; их фосфотирозины связывают регуляторную субъединицу PI3K."},{"id":"S4-T46","term":"PI3K (фосфоинозитид-3-киназа)","section":3,"def":"Липидкиназа, которая фосфорилирует PIP₂ по 3-му положению инозитола с образованием PIP₃."},{"id":"S4-T47","term":"PIP₃","section":3,"def":"Фосфатидилинозитол-3,4,5-трифосфат — липид мембраны, который связывает PH-домены AKT, PDK1 и SIN1."},{"id":"S4-T48","term":"AKT (протеинкиназа B)","section":3,"def":"Серин-треониновая киназа; полностью активна после фосфорилирования киназами PDK1 (T308 у AKT1) и mTORC2 (S473 у AKT1)."},{"id":"S4-T49","term":"Снятие торможения","section":3,"def":"Активация процесса путём подавления его ингибитора: так AKT, подавляя TSC2, растормаживает mTORC1."},{"id":"S4-T50","term":"mTORC1","section":3,"def":"Комплекс киназы mTOR с Raptor; активируется на лизосоме при достатке аминокислот и RHEB-GTP и стимулирует синтез белков и липидов."},{"id":"S4-T51","term":"TSC2 и RHEB","section":3,"def":"TSC2 — GAP для малой ГТФазы RHEB; RHEB в GTP-форме активирует mTORC1. AKT ослабляет TSC2, AMPK усиливает его."},{"id":"S4-T52","term":"AMPK","section":3,"def":"Протеинкиназа, активируемая при дефиците энергии; подавляет mTORC1 через TSC2 и Raptor."},{"id":"S4-T53","term":"S6K1","section":3,"def":"Киназа, активируемая mTORC1; фосфорилирует рибосомный белок S6 и IRS1, замыкая отрицательную петлю."},{"id":"S4-T54","term":"FOXO1","section":3,"def":"Транскрипционный фактор, активирующий гены глюконеогенеза; после фосфорилирования под действием AKT выводится из ядра."},{"id":"S4-T55","term":"SREBP-1c","section":3,"def":"Транскрипционный фактор, активирующий гены синтеза жирных кислот. Инсулин через mTORC1 усиливает транскрипцию его гена (без участия S6K) и протеолитическое созревание белка (с участием S6K), после которого N-концевая часть переходит в ядро."},{"id":"S4-T56","term":"Селективная (избирательная) инсулинорезистентность","section":3,"def":"Состояние печени, при котором инсулин плохо подавляет глюконеогенез, но продолжает стимулировать липогенез."},{"id":"S4-T57","term":"LIRKO","section":3,"def":"Мыши без рецептора инсулина в гепатоцитах; печень не отвечает на инсулин ни по одной ветви."},{"id":"S4-T58","term":"Резерв сети","section":3,"def":"Избыток сигнальной способности: максимальный ответ сохраняется при заметном ослаблении ранних звеньев."},{"id":"S4-T59","term":"Рапамицин","section":3,"def":"Ингибитор mTORC1; в комплексе с белком FKBP12 связывает mTOR и подавляет часть его функций. При длительном действии в ряде клеток нарушает и сборку mTORC2."},{"id":"S4-T60","term":"Cre–loxP","section":4,"def":"Система рекомбинации: фермент Cre вырезает участок ДНК между двумя сайтами loxP; позволяет выключить ген в одном типе клеток."},{"id":"S4-T61","term":"Вестерн-блот","section":4,"def":"Разделение белков лизата электрофорезом, перенос на мембрану и выявление нужного белка или его фосфорилированной формы антителами."},{"id":"S4-T62","term":"FRET-сенсор","section":4,"def":"Белок с двумя флуоресцентными доменами; при изменении расстояния между ними меняется перенос энергии (FRET) и отношение цветов свечения."}],"sources":{"Albeck2013":{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4151532/","cite":"Albeck JG et al. 2013. Frequency-modulated pulses of ERK activity transmit quantitative proliferation signals. Mol Cell","doi":"10.1016/j.molcel.2012.11.002","pmid":"23219535"},"AlonEtAl1999":{"url":"https://doi.org/10.1038/16483","cite":"Alon U et al. 1999. Robustness in bacterial chemotaxis. Nature","doi":"10.1038/16483","pmid":"9923680"},"Anastasaki2022":{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8891636/","cite":"Anastasaki C et al. 2022. RAS and beyond: the many faces of the neurofibromatosis type 1 protein. Dis Model Mech","doi":"10.1242/dmm.049362","pmid":"35188187"},"Aoki2011":{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3150946/","cite":"Aoki K et al. 2011. Processive phosphorylation of ERK MAP kinase in mammalian cells. Proc Natl Acad Sci U S A","doi":"10.1073/pnas.1104030108","pmid":"21768338"},"BarkaiLeibler1997":{"url":"https://doi.org/10.1038/43199","cite":"Barkai N et al. 1997. Robustness in simple biochemical networks. Nature","doi":"10.1038/43199","pmid":"9202124"},"Biddinger2008":{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4251554/","cite":"Biddinger SB et al. 2008. Hepatic insulin resistance is sufficient to produce dyslipidemia and susceptibility to atherosclerosis. Cell Metab","doi":"10.1016/j.cmet.2007.11.013","pmid":"18249172"},"BrownGoldstein2008":{"url":"https://doi.org/10.1016/j.cmet.2007.12.009","cite":"Brown MS et al. 2008. Selective versus total insulin resistance: a pathogenic paradox. Cell Metab","doi":"10.1016/j.cmet.2007.12.009","pmid":"18249166"},"Burchfield2025":{"url":"https://doi.org/10.1038/s42255-0 const qrev = l => l.quiz.rev || 1;
(function () {

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => ORDER[l.id] || (ORDER[l.id] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id));

const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;
const slider = (id, label, min, max, value, step = 1, unit = '') => `<label for="${id}">${esc(label)}<output id="${id}-value">${value}${unit}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${esc(unit)}"></label>`;
const select = (id, label, opts, value = 0) => `<label for="${id}">${esc(label)}<select id="${id}">${opts.map((x, i) => `<option value="${i}"${i === value ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
const check = (id, label, on) => `<label class="chk" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> <span>${esc(label)}</span></label>`;

/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);
const lvlTag = (v) => `<span class="lvl lvl${v < 0 ? 'x' : v}">${esc(lvl(v))}</span>`;
function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.h).join(' '), l.quiz.question, ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {
  const q = ($('search').value || '').trim().toLowerCase(), n = stepsDone(), N = CONTENT.lessons.length;
  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  let html = `<div class="progress">${esc(U.progress_label)}: <b>${n} ${esc(U.of)} ${N}</b><progress value="${n}" max="${N}" aria-label="${esc(U.progress_label)}"></progress>` +
    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {
    const ls = CONTENT.lessons.filter(l => l.section === i && (!q || hay(l).includes(q)));
    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${esc(s.title)}</div>` + ls.map(l => {
      const done = store.steps[l.id] && store.steps[l.id].correct;
      return `<button data-nav="${l.id}" class="${l.id === current ? 'active' : ''}"${l.id === current ? ' aria-current="page"' : ''}><span class="tick" aria-hidden="true">${done ? '✓' : '○'}</span><span class="sr">${esc(done ? U.done : U.notdone)}: </span>${esc(l.title)}</button>`;
    }).join('');
  });
  if (q && !any) html += `<p class="empty">${esc(U.no_match)}</p>`;
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
  const r = $('reset-progress'); if (r) r.onclick = () => { store = {v: 1, steps: {}, exam: {}}; save(); if (current === 'exam') renderExam(); else if (lessonById(current)) renderLesson(lessonById(current)); };
}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

    `<ul class="src-list">${l.sources.map(k => { const s = CONTENT.sources[k]; return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)} ↗</a></li>`; }).join('')}</ul>` +
    `<p>${rt(l.conditions)}</p></details>`;
}
function quizHtml(l, scope = 'quiz') {
  const q = l.quiz, ord = optionOrder(l);
  const done = scope === 'quiz' && store.steps[l.id] && store.steps[l.id].correct;
  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +
    `<div class="answers" role="group" aria-labelledby="${scope}-${l.id}-q">${ord.map((id, i) => `<button data-answer="${id}"><b aria-hidden="true">${LETTERS[i]}</b><span>${rt(optById(l, id).text)}</span></button>`).join('')}</div>` +
    `<div class="quiz-feedback" aria-live="polite">${done ? `<p class="quiet">${esc(U.quiz_done_before)}</p>` : ''}</div></section>`;
}
function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);
    const r = rec[l.id] || (rec[l.id] = {attempts: 0, first: null, correct: false, rev: qrev(l)});
    if (last !== id) { r.attempts = (r.attempts || 0) + 1; if (r.first === null) r.first = ok; }
    last = id;
    if (ok) r.correct = true;
    save();
    const ret = boxEl.querySelector('[data-return]'); if (ret) ret.onclick = () => navigate(l.id);
  });
}

/* Стационарный каскад для вопроса 1б: на каждом уровне киназа и фосфатаза модифицируют общий субстрат.
   Доля активной формы — функция Голдбетера — Кошланда (1981): J — Km фермента, делённая на концентрацию
   субстрата. J ≫ 1 — ферменты не насыщены (ответ уровня гиперболический); J ≪ 1 — насыщены (переключение

    const g = G[!!sat], J = g.J;
    const ras = 0.85 * occ;                             // доля RAS-GTP пропорциональна доле занятых рецепторов
    const raf = gk(g.raf * ras, 1, J, J);
    const mek = gk(g.mek * raf, 1, J, J);
    const erk = gk(g.erk * mek, 1, J, J);
    const n = { ras: ras * CONC.ras, raf: raf * CONC.raf, mek: mek * CONC.mek, erk: erk * CONC.erk };
    return { ras, raf, mek, erk, n, amp: raf > 1e-4 ? n.erk / n.raf : 0 };

  function curve(sat, N = 101){ const a = []; for (let i = 0; i < N; i++){ const x = i / (N - 1); a.push([x, run(x, sat).erk]); } return a; }

    const top = pts[pts.length - 1][1], x10 = pts.find(p => p[1] >= .1 * top)[0], x90 = pts.find(p => p[1] >= .9 * top)[0];

    for (let A = 0.002; A < 2.2; A += 0.002){ const v = f(A, s, k1); if (prev * v < 0) r.push(A - 0.001); prev = v; } return r; }
  return { KF, f, relax, roots, SMAX: 0.6, HIGH: 0.6 };
})();
const NET = (() => {
  const P = { irsSel: 0.35, fb: 0.35, Km: 0.2, Kf: 0.6, nf: 4, Kp: 0.3, np: 1.5, aktAmpk: 0.35, ampkMt: 0.85 };
  function run({ ins = 1, ampk = 0, g = 'wt', drug = '0' }){
    const irsCap = g === 'sel' ? P.irsSel : 1, r = g === 'lirko' ? 0 : ins;
    let s6k = 0, akt = 0, ampkA = 0, irs = 1;
    for (let i = 0; i < 60; i++){            // петля S6K ⊣ IRS1: решение подбирается итерациями
      irs = irsCap * (1 - P.fb * s6k);
      akt = Hn(r * irs, P.Kp, P.np) * (drug === 'pi3k' ? 0.06 : 1);
      ampkA = ampk * (1 - P.aktAmpk * akt);   // AKT фосфорилирует AMPKα1 (S487) и ослабляет фосфорилирование T172
      s6k = Hn(akt, P.Km, 2) * (1 - P.ampkMt * ampkA) * (drug === 'rapa' ? 0.08 : 1);
    }
    const mt = Hn(akt, P.Km, 2) * (1 - P.ampkMt * ampkA);
    // индукция мРНК SREBP-1c требует mTORC1, но не S6K (Li 2010); протеолитическое созревание (ядерная форма) требует и S6K (Owen 2012)
    const srebp = mt * (drug === 'rapa' ? 0.12 : 1), srebpN = srebp * Hn(s6k, 0.3, 2);
    const pfoxo = Math.min(1, Hn(akt, P.Kf, P.nf));
    return { r, irs, akt, ampkA, mt: mt * (drug === 'rapa' ? 0.08 : 1), s6k, srebp, srebpN, pfoxo, pepck: 1 - 0.95 * pfoxo, gsk: Hn(akt, 0.25, 2) };

/* =====================================================================
   Схемы страницы объяснений семинара 4. Каждая схема — функция W.<kind>; kind задаётся в lesson.widget.kind.
   Все подписи берутся из lesson.widget.s (в коде — S); в коде нет учебных формулировок.
   Модели (ERK, CASC, BIS, NET) — те же функции, что в практикуме (копируются при сборке из src/ практикума),
   поэтому числа в объяснениях и в практикуме совпадают.
   ===================================================================== */
const C4 = { blue: '#145c96', orange: '#c3662f', teal: '#007b72', red: '#ae3347', gray: '#9db4c8', ink: '#152c45', amber: '#c98a0b', amberFill: '#fbe9c2', purple: '#6748b6', muted: '#6b7c8f' };
const n1 = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const p0 = x => Math.round(100 * x) + nb + '%';

/* стрелка или линия с поперечиной по квадратичной кривой: [x1,y1,x2,y2] или [x1,y1,cx,cy,x2,y2] */
function edge4(pts, type, faded){
  const c = { act: C4.blue, inh: C4.red, move: C4.muted, syn: C4.purple, bind: C4.teal }[type] || C4.blue;
  const dash = type === 'move' ? '6 5' : type === 'syn' ? '2 5' : type === 'dbt' ? '7 5' : '';
  const op = faded ? 0.22 : 1;
  let d, x2, y2, ax, ay;
  if (pts.length === 4){ [, , x2, y2] = pts; d = `M${pts[0]} ${pts[1]} L${x2} ${y2}`; ax = pts[0]; ay = pts[1]; }
  else { const [x1, y1, cx, cy] = pts; [, , , , x2, y2] = pts; d = `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`; ax = cx; ay = cy; }
  const a = Math.atan2(y2 - ay, x2 - ax);
  let head;
  if (type === 'inh') { const px = -Math.sin(a) * 9, py = Math.cos(a) * 9; head = `<line x1="${x2 - px}" y1="${y2 - py}" x2="${x2 + px}" y2="${y2 + py}" stroke="${c}" stroke-width="4"/>`; }
  else if (type === 'bind') head = `<circle cx="${x2}" cy="${y2}" r="4" fill="${c}"/>`;
  else { const L = 11, d1 = a + 2.6, d2 = a - 2.6; head = `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`; }
  return `<g opacity="${op}"><path d="${d}" fill="none" stroke="${c}" stroke-width="3"${dash ? ` stroke-dasharray="${dash}"` : ''}/>${head}</g>`;
}
const pBadge = (x, y) => circ(x, y, 10, '#f0b84a', 'stroke="#c98a0b" stroke-width="1.5"') + tx(x, y + 4, 'P', 11, 'middle');
/* узел сети: состояние on (активен, жёлтый), off, miss (нет: пунктир и крест), inh (подавлен фосфорилированием: пунктир) */
function node4(n, st){
  const on = st.on.includes(n.id), miss = st.miss.includes(n.id), inh = (st.inh || []).includes(n.id);
  const fill = on ? C4.amberFill : '#fff', stroke = on ? C4.amber : miss ? '#9aa7b3' : '#6d8ba5';
  let d = box(n.x, n.y, n.w, n.h || 40, n.label, { fill, stroke, dash: miss || inh ? '6 5' : '', size: n.fs || 15, sw: on ? 3 : 2 });
  if (miss) d += cross(n.x + n.w - 8, n.y + 8);
  if ((st.p || []).includes(n.id)) d += pBadge(n.x + n.w, n.y + 2);
  return d;
}

/* Сеть с переключаемыми состояниями. S.nodes, S.edges (id, pts, type), S.states[i] = {on, miss, inh, p, show (рёбра активны), hide (рёбра скрыты), drugs [[x,y,текст]], note, metrics [[подпись, значение]]} */
W.net = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('net-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const st = Object.assign({ on: [], miss: [], inh: [], p: [], show: [], hide: [], drugs: [], areas: [] }, S.states[s.mode]);
    let d = (S.areas || []).map(a => a.kind === 'nuc' ? `<ellipse cx="${a.x}" cy="${a.y}" rx="${a.rx}" ry="${a.ry}" fill="#eef0f7" stroke="#97a0ba" stroke-width="2.5"/>` + tx(a.lx, a.ly, a.label, 14, 'middle')
      : a.kind === 'mem' ? line(0, a.y, S.w || 640, a.y, '#556171', 4) + tx(a.lx, a.ly, a.label, 14, 'start') : tx(a.x, a.y, a.label, 14, a.anchor || 'start')).join('');
    S.edges.forEach(e => { if (st.hide.includes(e.id)) return; d += edge4(e.pts, e.type, !st.show.includes(e.id)); if (e.label) d += tx(e.lx, e.ly, e.label, 13, 'middle'); });
    S.nodes.forEach(n => { d += node4(n, st); });
    st.drugs.forEach(([x, y, t]) => { d += rect(x - 6, y - 15, t.length * 8.6 + 12, 22, C4.red, 11) + tx(x, y + 1, t, 13, 'start').replace('<text ', '<text style="fill:#fff;font-weight:700" '); });
    const m = st.metrics ? `<div class="metrics${st.metrics.length === 2 ? ' two' : ''}">${st.metrics.map(([a, b]) => metric(a, b)).join('')}</div>` : '';
    out(svg(d, S.title, S.h || 300, S.w || 640, st.note), m + result(`<p>${esc(st.note)}</p>`) + (S.legend ? `<p class="quiet">${esc(S.legend)}</p>` : ''));
  };
  onGroup('net-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Каскад в стационарном состоянии: доза EGF (лог. шкала) и режим ферментов; модель CASC практикума (вопрос 1б) */

  const draw = () => {

    const ser = [0, 1].map(k => ({ pts: ERK.CASC_CURVE[k].map(([x, y]) => [x * 100, y * 100]), label: S.curves[k], color: k ? C4.orange : C4.teal, dash: k === s.mode ? '' : '6 5' }));

/* Ход опыта во времени по общей модели каскада. S.runs[i] = {cfg, input, tmax, pre}; S.keys — какие величины рисовать;
   S.ref — номер прогона для сравнения (серый пунктир); S.points — показатели {label, key, t} или {label, key, kind: 'area'|'above'|'max'} */
function input4(spec){
  if (spec === 'egf') return () => ({ L: 1 });
  if (spec === 'none') return () => ({ L: 0 });
  if (spec.startsWith('wash:')){ const w = +spec.slice(5); return t => ({ L: t < w ? 1 : 0 }); }
  if (spec.startsWith('light:')){ const seg = JSON.parse(spec.slice(6)); return t => ({ light: seg.some(([a, b]) => t >= a && t < b) ? 1 : 0 }); }
  return () => ({ L: 0 });
}
const RUN4 = {};
function run4(r){
  const key = JSON.stringify(r);
  if (!RUN4[key]) RUN4[key] = ERK.run(r.cfg, input4(r.input), r.tmax || 120, Object.assign({ pre: r.pre || { trame: false, soto: false, vem: false } }, r.tmax > 600 ? { dt: 0.5, every: 5 } : {}));
  return RUN4[key];
}
W.course = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('crs-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const R = S.runs[s.mode], T = run4(R), sc = R.hours ? 1 / 60 : 1, maxX = (R.tmax || 120) * sc;
    const ser = [];
    if (S.ref != null && S.ref !== s.mode) ser.push({ pts: run4(S.runs[S.ref]).map(p => [p.t * sc, p.E * 100]), label: S.ref_label, color: '#8a96a6', dash: '3 5' });
    S.keys.forEach((k, i) => ser.push({ pts: T.map(p => [p.t * sc, Math.min(1, p[k] / (S.norm && S.norm[i] || 1)) * 100]), label: S.key_labels[i], color: [C4.orange, C4.blue, C4.purple, C4.teal][i], dash: i === 1 && S.keys.length > 1 && k === 'R' ? '7 5' : '' }));
    const ch = chart(ser, { xLabel: R.hours ? S.x_h : S.x, yLabel: S.y, maxX, maxY: 100, ticksX: R.hours ? 6 : (maxX > 150 ? 6 : 6), ticksY: 4, title: S.title, fmtY: v => v + nb + '%' });
    const tmin = x => R.hours ? x * 60 : x;
    const val = q => q.kind === 'area' ? ERK.area(T, q.key) / ERK.area(run4(S.runs[q.of]), q.key) : q.kind === 'above' ? ERK.above(T, q.thr, q.key) : q.kind === 'max' ? Math.max(...T.map(p => p[q.key])) / (q.norm || 1) : ERK.at(T, tmin(q.t))[q.key] / (q.norm || 1);
    const mets = (S.points || []).map(q => metric(q.label, q.kind === 'above' ? Math.round(val(q)) + nb + S.u_min : p0(Math.min(1, q.kind === 'area' ? val(q) : val(q)))));
    out(ch, (mets.length ? `<div class="metrics${mets.length === 2 ? ' two' : mets.length === 4 ? ' four' : ''}">${mets.join('')}</div>` : '') + result(`<p>${esc(S.notes[s.mode])}</p>`) + (S.scale ? `<p class="quiet">${esc(S.scale)}</p>` : ''));
  };
  onGroup('crs-mode', i => { s.mode = i; draw(); });
  draw();

/* Четыре свойства временного профиля: учебные профили одинаковой или разной площади. S.profiles[i] = {amp, on: [[начало, конец], …]} */
W.profile = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('prf-mode', S.modes, s.mode, S.modes_label));
  const shape = pr => { const pts = []; for (let t = 0; t <= 120; t += 0.5){ let v = 0; pr.on.forEach(([a, b]) => { if (t >= a && t <= b) v = pr.amp; else if (t > b && t < b + 6) v = Math.max(v, pr.amp * (1 - (t - b) / 6)); }); pts.push([t, v]); } return pts; };
  const props = pts => { const mx = Math.max(...pts.map(p => p[1])); let area = 0, above = 0, pulses = 0, was = false;
    for (let i = 1; i < pts.length; i++){ area += pts[i][1] * 0.5; const on = pts[i][1] > mx / 2; if (on) above += 0.5; if (on && !was) pulses++; was = on; }
    return { mx, area, above, pulses }; };
  const draw = () => {
    const pr = S.profiles[s.mode], pts = shape(pr), q = props(pts);
    const ser = [{ pts: pts.map(([t, v]) => [t, v]), label: S.modes[s.mode], color: C4.orange }];
    if (S.ref != null && S.ref !== s.mode) ser.unshift({ pts: shape(S.profiles[S.ref]), label: S.modes[S.ref], color: '#8a96a6', dash: '3 5' });

  };
  onGroup('prf-mode', i => { s.mode = i; draw(); });

/* Отдельные клетки и среднее по популяции: учебная модель асинхронных импульсов (не данные опыта) */

/* Бистабильный переключатель с историей: модель BIS практикума (вопрос 3б) */
W.bistable = ({S, s, set, out, onGroup, onRange}) => {
  s.fb ??= 2; s.p ??= 0; s.A ??= 0; s.trail ??= [];
  set(S.title, S.status, buttonGroup('bis-fb', S.fbs, s.fb, S.fb_label) + `<div class="controls">${slider('bis-s', S.stim, 0, 100, s.p, 1, nb + '%')}</div><div class="chips"><button id="bis-reset">${esc(S.reset)}</button></div>`);
  const k1 = () => [BIS.KF.none, BIS.KF.weak, BIS.KF.strong][s.fb];
  const draw = () => {
    const sv = s.p / 100 * BIS.SMAX;
    s.A = BIS.relax(s.A, sv, k1()); s.trail.push([s.p, s.A]); if (s.trail.length > 80) s.trail.shift();
    const br = []; for (let q = 0; q <= 100; q += 1){ const r = BIS.roots(q / 100 * BIS.SMAX, k1()); r.forEach(A => { const st = BIS.f(A + 0.01, q / 100 * BIS.SMAX, k1()) < 0 && BIS.f(Math.max(0, A - 0.01), q / 100 * BIS.SMAX, k1()) >= 0; br.push([q, A, st]); }); }
    const W0 = 640, H0 = 300, x0 = 70, x1 = 610, y0 = 250, y1 = 30, X = q => x0 + q / 100 * (x1 - x0), Y = a => y0 - Math.min(a, 2) / 2 * (y0 - y1);
    let d = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5) + tx((x0 + x1) / 2, H0 - 12, S.x, 16) + tx(x0, 18, S.y, 15, 'start');
    br.forEach(([q, A, st]) => { d += circ(X(q).toFixed(1), Y(A).toFixed(1), st ? 2.4 : 1.6, st ? C4.teal : '#9aa7b3'); });
    d += `<polyline points="${s.trail.map(([q, a]) => X(q).toFixed(1) + ',' + Y(a).toFixed(1)).join(' ')}" fill="none" stroke="${C4.purple}" stroke-width="2.5" stroke-dasharray="5 4"/>`;
    d += circ(X(s.p), Y(s.A), 8, '#f0b84a', 'stroke="#152c45" stroke-width="2"');
    const hi = s.A > BIS.HIGH, nr = BIS.roots(sv, k1()).length;
    out(svg(d, S.title, H0, W0), `<div class="metrics">${metric(S.m_a, n1(s.A, 2))}${metric(S.m_state, hi ? S.hi : S.lo)}${metric(S.m_n, nr >= 3 ? S.two : S.one)}</div>` + result(`<p>${esc(S.notes[s.fb])}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('bis-fb', i => { s.fb = i; s.trail = []; draw(); }); onRange('bis-s', v => { s.p = v; draw(); });
  $('bis-reset').onclick = () => { s.A = 0; s.trail = []; draw(); };
  draw();
};

/* Схемы методов: S.schemes[i] = {draw: 'blot'|'reporter'|'opto'|'oocyte'|'cre'|'drug'|'table', l: {подписи}, note, h, (head, rows для table)}.
   Все подписи — из S; буквы панелей (А, Б) — тоже из S (l.pA, l.pB). */
const MTH = {
  tl(x, y, str, size = 14, anchor = 'middle'){ return String(str).split('\n').map((t, i) => tx(x, y + i * size * 1.25, t, size, anchor)).join(''); },
  panel(x, y, letter, title){ return tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + tx(x + 22, y, title, 15, 'start'); },
  blot(l, b){
    let d = MTH.panel(10, 24, l.pA, l.a);

    [[0.35, C4.orange, l.c1, -96, -Hh + 22], [0.6, C4.blue, l.c2, 18, -24]].forEach(([c, col, lab, dx, dy]) => { let pts = ''; for (let i = 0; i <= 40; i++){ const x = i / 40, y = 1 / (1 + Math.exp(-(x - c) * 18)); pts += `${(X0 + x * W).toFixed(1)},${(Y0 - y * (Hh - 10)).toFixed(1)} `; } d += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/>` + tx(X0 + c * W + dx, Y0 + dy, lab, 11, 'start'); });

W.method = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('mth-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const sc = S.schemes[s.mode];
    if (sc.draw === 'table') { out(tbl(sc.head, sc.rows), result(`<p>${esc(sc.note)}</p>`)); return; }
    const body = MTH[sc.draw](sc.l, sc.data);
    out(svg(body, S.modes[s.mode], sc.h || 300, 640, sc.note), result(`<p>${esc(sc.note)}</p>`) + (sc.legend ? `<p class="quiet">${esc(sc.legend)}</p>` : ''));
  };
  onGroup('mth-mode', i => { s.mode = i; draw(); });
  draw();
};
