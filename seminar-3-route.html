  /* ГТФазная реакция в пробирке: метка γ-фосфата переходит из связанного GTP в свободный фосфат (v1.1, V09: заголовки в две строки) */
  gtpase(l) {
    const hdr = (x, y, letter, title) => tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + MTH.tl(x + 22, y, title, 15, 'start');
    const prot = x => rect(x, 84, 130, 100, '#eef3f7', 14, 'stroke="#9db4c8" stroke-width="2"') + tx(x + 65, 106, 'RAS', 14, 'middle');
    let d = hdr(10, 24, l.pA, l.a) + hdr(330, 24, l.pB, l.b);
    // А: RAS со связанным GTP; γ-фосфат помечен ³²P
    d += prot(40);
    d += circ(95, 146, 26, C4.amberFill, 'stroke="' + C4.amber + '" stroke-width="2"') + tx(95, 150, l.gtp, 12, 'middle');
    d += circ(140, 134, 11, C4.red);
    d += MTH.tl(186, 124, l.gp, 12, 'start').replace(/<text /g, '<text style="fill:' + C4.red + '" ');
    d += arrow(220, 168, 316, 168, C4.muted, 3) + tx(268, 190, 't', 13, 'middle');
    // Б: RAS со связанным GDP; свободный ³²Pi вне белка
    d += prot(360);
    d += circ(415, 146, 26, '#fff', 'stroke="#9db4c8" stroke-width="2"') + tx(415, 150, 'GDP', 12, 'middle');
    d += circ(560, 120, 11, C4.red);
    d += MTH.tl(560, 152, l.pi, 12, 'middle').replace(/<text /g, '<text style="fill:' + C4.red + '" ');
    d += MTH.tl(40, 232, l.read, 14, 'start');
    return d;
  },
});

/* =====================================================================
   Схемы раздела 4 страницы объяснений (STIM1–Orai1). Подписи — из lesson.widget.s (в коде русских фраз нет).
   Числа интерактивной схемы stim-sensor берутся из модели практикума M4 (та же, что в s4.js), поэтому
   доли STIM1 на обеих страницах совпадают.
   ===================================================================== */

/* Интерактив: ползунок [Ca²⁺] в просвете ЭПР → доля STIM1 без Ca²⁺ на EF-hand, доля в кластерах и ток CRAC (M4.eq).
   Рисунок «сложенный димер → распрямлённый кластер» меняется по тому же порогу, что и уровни. */
W.q4stim = ({ S, s, set, out, onRange }) => {
  s.E ??= 500;
  set(S.title, S.status, `<div class="controls">${slider('q4s-er', S.er_label, 0, 800, s.E, 20, ' ' + S.uM)}</div>`);
  const draw = () => {
    const m = M4.eq(s.E, 1), ext = m.clust > 0.5, W0 = 640;
    let d = line(0, 60, W0, 60, '#556171', 4) + tx(W0 - 8, 50, S.pm, 13, 'end') + tx(10, 82, S.cyto, 13, 'start').replace('<text ', '<text style="font-style:italic;fill:#6b7c8f" ');
    d += box(250, 40, 120, 26, 'Orai1', { size: 13, fill: ext ? C4.amberFill : '#fff', stroke: ext ? C4.amber : '#6d8ba5' });
    // ЭПР: верхняя мембрана на y = 172; STIM1 пересекает её одной трансмембранной спиралью
    d += rect(30, 172, W0 - 60, 120, '#d3ecec', 12, 'stroke="#007b72" stroke-width="2.5"') + tx(70, 262, S.er, 14, 'start').replace('<text ', `<text style="fill:#007b72;font-weight:600" `);
    d += tx(W0 - 60, 218, S.lumen, 13, 'end').replace('<text ', `<text style="fill:#007b72;font-weight:600" `);
    // просвет: точки Ca²⁺ ~ E/800
    const nd = Math.round(s.E / 800 * 10);
    for (let i = 0; i < 10; i++) d += circ(60 + (i % 5) * 38, 228 + Math.floor(i / 5) * 30, 5.5, '#c2185b', `opacity="${i < nd ? 0.85 : 0.08}"`);
    // STIM1: димер в покое (две субъединицы) или кластер (четыре); цитозольная часть складывается или распрямляется до Orai1;
    // EF-hand и SAM — внутри просвета, Ca²⁺ на EF-hand — только там (плотность точки = доля занятых мест)
    const xs = ext ? [258, 290, 322, 354] : [290, 322], bound = 1 - m.efNoCa;
    xs.forEach(x => {
      d += ext ? rect(x - 6, 70, 12, 94, C4.amberFill, 5, `stroke="${C4.amber}" stroke-width="2"`) : rect(x - 9, 134, 18, 30, '#fff', 6, 'stroke="#6d8ba5" stroke-width="2"');
      d += rect(x - 3.5, 160, 7, 24, '#eef3f7', 3, 'stroke="#6d8ba5" stroke-width="1.8"');
      d += rect(x - 10, 184, 20, 20, ext ? C4.amberFill : '#fff', 6, `stroke="${ext ? C4.amber : '#6d8ba5'}" stroke-width="2"`) + circ(x, 194, 4, '#c2185b', `opacity="${(0.12 + 0.88 * bound).toFixed(2)}"`);
    });
    d += tx(388, 128, 'STIM1', 13, 'start').replace('<text ', '<text style="font-weight:700" ') + tx(388, 146, ext ? S.extended : S.folded, 13, 'start');
    d += tx(388, 204, S.ef_note, 13, 'start');
    const bars = levelBars([
      { label: S.b_ef, v: Math.round(m.efNoCa * 3) === 0 && m.efNoCa > 0.1 ? 1 : Math.min(3, Math.round(m.efNoCa * 3)) },
      { label: S.b_clust, v: Math.min(3, Math.round(m.clust * 3)), cls: 'warn' },
      { label: S.b_crac, v: Math.min(3, Math.round(m.crac * 3)), cls: 'warn' }], 620);
    const info = `<p>${esc(S.ef)}: <strong>${p0(m.efNoCa)}</strong> · ${esc(S.clust)}: <strong>${p0(m.clust)}</strong> · ${esc(S.crac)}: <strong>${p0(m.crac)}</strong></p>`;
    out(svg(d, S.title, 300, W0).replace('<svg ', '<svg data-center="0.62" '), bars + result(info) + `<p class="quiet">${esc(S.note)}</p>`);
  };
  onRange('q4s-er', v => { s.E = v; draw(); });
  draw();
};

/* Схемы методов раздела 4 (добавляются к общим MTH). Все подписи — из sc.l. */
Object.assign(MTH, {
  /* патч-кламп whole-cell (FV102): пипетка образует плотный контакт с мембраной, мембрана под кончиком разрушена (доступ в цитозоль);
     Orai1 пересекает плазматическую мембрану, Ca²⁺ входит из среды в цитозоль; ток регистрирует усилитель между пипеткой и электродом в среде */
  q4patch(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    d += tx(20, 58, l.out, 12.5, 'start');
    const cx = 230, cy = 196, rx = 150, ry = 80, my = x => cy - ry * Math.sqrt(1 - Math.pow((x - cx) / rx, 2));
    d += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#f6f8fb" stroke="#556171" stroke-width="4"/>`;
    d += tx(cx, cy + 24, l.cyt, 13);
    // пипетка: кончик на мембране, под ним мембрана разрушена
    const px = 300, py = my(px);
    d += `<path d="M${px - 16} 58 L${px - 7} ${py - 1} L${px + 7} ${py - 1} L${px + 16} 58 Z" fill="#eef3f7" stroke="#6d8ba5" stroke-width="2"/>`;
    d += rect(px - 7, py - 4, 14, 9, '#f6f8fb', 0) + line(px - 9, py - 2, px - 9, py + 4, '#152c45', 3) + line(px + 9, py - 2, px + 9, py + 4, '#152c45', 3);
    d += MTH.tl(px + 36, 80, l.pip, 12, 'start');
    // измерительная цепь: пипетка — усилитель — электрод в среде
    d += line(px, 58, px, 46, '#556171', 2) + line(px, 46, 440, 46, '#556171', 2);
    d += box(440, 32, 150, 28, l.amp, { size: 12, fill: '#fff', stroke: '#556171' });
    d += line(590, 46, 612, 46, '#556171', 2) + line(612, 46, 612, 230, '#556171', 2) + line(602, 230, 622, 230, '#556171', 3) + line(606, 236, 618, 236, '#556171', 2);
    d += MTH.tl(604, 256, l.bath, 11.5, 'end');
    // канал Orai1 в плазматической мембране и вход Ca²⁺ из среды
    const ox = 150, oy = my(ox);
    d += rect(ox - 13, oy - 16, 10, 32, C4.amberFill, 3, `stroke="${C4.amber}" stroke-width="2"`) + rect(ox + 3, oy - 16, 10, 32, C4.amberFill, 3, `stroke="${C4.amber}" stroke-width="2"`);
    d += tx(ox - 22, oy - 22, 'Orai1', 12.5, 'end');
    for (let i = 0; i < 3; i++) d += arrow(ox, oy - 52 + i * 34, ox, oy - 34 + i * 34, '#c2185b', 2.4);
    d += tx(ox + 12, oy - 46, l.ion, 12.5, 'start');
    d += MTH.tl(320, 292, l.read, 12.5);
    return d;
  },
  /* FV107: картирование сцепления — условная родословная с рецессивным заболеванием и маркером участка 12q24 */
  linkage(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    const P = [[180, 76, 'm', 'car'], [300, 76, 'f', 'car'], [120, 172, 'm', 'aff'], [240, 172, 'f', 'aff'], [360, 172, 'm', 'ok']];
    const sym = (x, y, sex, st) => {
      const fill = st === 'aff' ? '#3d5a80' : '#fff', clip = `cl${x}${y}`;
      let s = sex === 'm' ? rect(x - 16, y - 16, 32, 32, fill, 2, 'stroke="#152c45" stroke-width="2"') : circ(x, y, 17, fill, 'stroke="#152c45" stroke-width="2"');
      if (st === 'car') s += sex === 'm' ? rect(x, y - 16, 16, 32, '#3d5a80', 0) + rect(x - 16, y - 16, 32, 32, 'none', 2, 'stroke="#152c45" stroke-width="2"')
        : `<path d="M${x} ${y - 17} A17 17 0 0 1 ${x} ${y + 17} Z" fill="#3d5a80"/>` + circ(x, y, 17, 'none', 'stroke="#152c45" stroke-width="2"');
      return s;
    };
    d += line(196, 76, 283, 76, '#152c45', 2) + line(240, 76, 240, 124, '#152c45', 2) + line(120, 124, 360, 124, '#152c45', 2);
    [120, 240, 360].forEach(x => { d += line(x, 124, x, 155, '#152c45', 2); });
    P.forEach(([x, y, sex, st], i) => { d += sym(x, y, sex, st) + tx(x, y + 36, l.g[i], 13.5).replace('<text ', `<text style="font-weight:700;fill:${l.g[i].indexOf(l.hit + '/' + l.hit) === 0 ? C4.red : '#152c45'}" `); });
    d += tx(20, 116, l.mk, 12, 'start');
    // обозначения
    d += sym(440, 66, 'm', 'aff') + tx(466, 71, l.aff, 12.5, 'start') + sym(440, 110, 'm', 'car') + tx(466, 115, l.car, 12.5, 'start') + sym(440, 154, 'm', 'ok') + tx(466, 159, l.ok, 12.5, 'start');
    d += MTH.tl(20, 240, l.res, 12.5, 'start');
    return d;
  },
  /* FV107: RNAi-скрининг с репортёром NFAT–GFP — лунки с подавлением разных генов, тапсигаргин, локализация GFP */
  rnaiscreen(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    d += MTH.tl(20, 50, l.top, 12.5, 'start');
    const X = [90, 230, 370, 510], hit = l.hit_i;
    X.forEach((x, i) => {
      const h = i === hit;
      d += circ(x, 146, 46, '#f3f5f8', `stroke="${h ? C4.red : '#9aa7b3'}" stroke-width="${h ? 3 : 2}"`);
      d += tx(x, 92, l.w[i], 12.5).replace('<text ', '<text style="font-weight:700" ');
      d += circ(x, 146, 28, h ? '#bfe8c9' : '#fff', 'stroke="#6d8ba5" stroke-width="1.5"');
      d += circ(x, 146, 11, h ? '#e9eef3' : '#2e9e57', 'stroke="#2c5f3f" stroke-width="1.5"');
      d += MTH.tl(x, 210, l.r[h ? 1 : 0], 11.5);
    });
    d += MTH.tl(20, 262, l.res, 12.5, 'start');
    return d;
  },
  /* вольт-амперная кривая тока CRAC: сильное входящее выпрямление, очень малый ток при деполяризации */
  q4iv(l){
    const x0 = 90, y0 = 150, W0 = 500, Hh = 120;
    let d = line(x0, y0, x0 + W0, y0, '#7f97ab', 1.5) + line(x0 + W0 / 2, y0 - Hh, x0 + W0 / 2, y0 + 60, '#7f97ab', 1.5);
    d += tx(x0 + W0 - 4, y0 + 18, l.v, 12, 'end') + tx(x0 + W0 / 2 + 6, y0 - Hh + 2, l.i, 12, 'start');
    // кривая: при отрицательных V — большой входящий ток (вниз), при положительных — почти ноль
    const pts = [];
    for (let mv = -120; mv <= 60; mv += 10){ const X = x0 + W0 / 2 + mv / 120 * (W0 / 2); let I = mv < 0 ? -Math.pow(-mv / 120, 1.2) : 0.01 * mv / 60; const Y = y0 - I * 70; pts.push([X, Y]); }
    d += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${C4.blue}" stroke-width="3"/>`;
    d += tx(x0 + 60, y0 + 40, l.inward, 11, 'middle') + tx(x0 + W0 - 70, y0 - 20, l.rev, 11, 'middle');
    return d;
  },
  /* Fura-2: возбуждение 340/380, отношение → [Ca²⁺] */
  q4fura(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    d += circ(330, 150, 30, '#eef3f7', 'stroke="#6d8ba5" stroke-width="2"') + tx(330, 155, 'Fura-2', 11);
    d += arrow(190, 110, 298, 140, '#3b5bdb', 3) + tx(180, 104, l.ex1, 12, 'end');
    d += arrow(190, 190, 298, 160, '#7048e8', 3) + tx(180, 196, l.ex2, 12, 'end');
    d += arrow(362, 150, 440, 150, C4.muted, 3) + tx(450, 154, l.ratio, 12, 'start');
    d += tx(330, 212, l.read, 12);
    return d;
  },

  /* импульс IP₃: SERCA работает или заблокирована тапсигаргином (модель практикума M4, протокол 2). Кривые: цитозольный Ca²⁺, Ca²⁺ в ЭПР, STIM1 в кластерах */
  q4refill(l){
    const P4 = M4.P, T = P4.T, x0 = 76, W0 = 540, rows = [
      { k: 'C', t: l.g1, ymax: 1400, sc: 1000, y: 56, h: 96, ref: 0 },
      { k: 'E', t: l.g2, ymax: 120, sc: 0, y: 206, h: 96, ref: 100 },
      { k: 'S', t: l.g3, ymax: 100, sc: 100, y: 356, h: 96, ref: 0 }];
    const runs = [{ tr: M4.run({ proto: 'ip3', tg: false }), col: C4.blue, dash: '' }, { tr: M4.run({ proto: 'ip3', tg: true }), col: C4.red, dash: '7 5' }];
    const X = t => x0 + t / T * W0;
    let d = rect(X(P4.tI0), 30, X(P4.tI1) - X(P4.tI0), 424, '#e6e8ec', 0) + tx((X(P4.tI0) + X(P4.tI1)) / 2, 22, l.pulse, 12);
    rows.forEach(r => {
      d += tx(x0, r.y - 8, r.t, 12.5, 'start');
      d += line(x0, r.y + r.h, x0 + W0, r.y + r.h, '#7f97ab', 1.5) + line(x0, r.y, x0, r.y + r.h, '#7f97ab', 1.5);
      const yr = r.y + r.h - r.ref / r.ymax * r.h;
      d += tx(x0 - 6, r.y + 10, r.ref ? '' : String(r.ymax), 11, 'end') + tx(x0 - 6, r.y + r.h + 4, '0', 11, 'end');
      if (r.ref) d += `<line x1="${x0}" y1="${yr}" x2="${x0 + W0}" y2="${yr}" stroke="#9aa7b3" stroke-width="1" stroke-dasharray="3 4"/>` + tx(x0 - 6, yr + 4, String(r.ref), 11, 'end');
      runs.forEach(u => {
        const Eb = u.tr.Eb;
        const pts = u.tr.map(q => { const v = r.k === 'E' ? q.E / Eb * 100 : q[r.k] * r.sc; return [X(q.t), r.y + r.h - clamp(v / r.ymax, 0, 1) * r.h]; });
        d += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${u.col}" stroke-width="3"${u.dash ? ` stroke-dasharray="${u.dash}"` : ''}/>`;
      });
    });
    for (let m = 0; m <= 20; m += 5) d += tx(X(m * 60), 470, String(m), 11) ;
    d += tx(x0 + W0 / 2, 488, l.x, 11.5);
    d += line(x0, 506, x0 + 40, 506, C4.blue, 3) + tx(x0 + 48, 510, l.a, 12.5, 'start');
    d += `<line x1="${x0}" y1="526" x2="${x0 + 40}" y2="526" stroke="${C4.red}" stroke-width="3" stroke-dasharray="7 5"/>` + tx(x0 + 48, 530, l.b, 12.5, 'start');
    return d;
  },
});

/* =====================================================================
   Схемы методов, добавленные при сборке 1.0: снижение количества белка (siRNA с контролем),
   нокаут гена, масс-спектрометрия фосфопептидов. Все подписи — из sc.l (content.json); в коде нет учебных формулировок.
   ===================================================================== */
Object.assign(MTH, {
  /* siRNA к гену-мишени против контрольной siRNA без мишени: ген → мРНК → белок */
  sirna(l){
    let d = '';
    [0, 330].forEach((ox, k) => {
      d += MTH.panel(ox + 10, 24, k ? l.pB : l.pA, k ? l.b : l.a);
      const cx = ox + 95, on = k === 1;
      d += box(cx - 70, 44, 140, 34, l.gene, { size: 13.5 });
      d += arrow(cx, 80, cx, 104, C4.blue, 3);
      d += box(cx - 70, 108, 140, 34, l.mrna, { size: 13.5, fill: on ? '#fff' : '#f3f5f8', dash: on ? '' : '6 5' });
      d += arrow(cx, 144, cx, 168, C4.blue, 3, on ? '' : '5 5');
      d += box(cx - 70, 172, 140, 34, l.prot, { size: 13.5, fill: on ? C4.amberFill : '#f3f5f8', stroke: on ? C4.amber : '#9aa7b3', dash: on ? '' : '6 5' });
      const bw = (k ? l.si_c : l.si).length * 7.6 + 16;
      d += rect(ox + 180, 113, bw, 24, k ? '#6b7c8f' : C4.red, 12) + tx(ox + 188, 130, k ? l.si_c : l.si, 12.5, 'start').replace('<text ', '<text style="fill:#fff;font-weight:700" ');
      if (!on) d += cross(cx + 52, 125);
      d += MTH.tl(cx, 230, k ? l.res_c : l.res, 13);
    });
    d += line(318, 40, 318, 250, '#c8d6e2', 2, 'stroke-dasharray="5 5"');
    d += MTH.tl(20, 282, l.foot, 12.5, 'start');
    return d;
  },
  /* нокаут: участок гена удалён — нет мРНК и белка */
  ko(l){
    let d = '';
    [0, 330].forEach((ox, k) => {
      d += MTH.panel(ox + 10, 24, k ? l.pB : l.pA, k ? l.b : l.a);
      const x0 = ox + 30, y = 70, del = k === 1;
      d += line(x0, y, x0 + 250, y, '#556171', 3);
      [[x0 + 20, 40], [x0 + 100, 50], [x0 + 190, 40]].forEach(([x, w], i) => {
        const gone = del && i === 1;
        d += rect(x, y - 13, w, 26, gone ? '#fff' : '#145c96', 4, gone ? 'stroke="#ae3347" stroke-width="2" stroke-dasharray="5 4"' : '');
      });
      if (del) d += cross(x0 + 125, y);
      d += tx(x0 + 125, y + 34, l.gene, 13);
      const cx = x0 + 125;
      d += arrow(cx, y + 44, cx, y + 70, C4.blue, 3, del ? '5 5' : '');
      d += box(cx - 70, y + 74, 140, 34, del ? l.mrna_no : l.mrna, { size: 13.5, fill: del ? '#f3f5f8' : '#fff', dash: del ? '6 5' : '', stroke: del ? '#9aa7b3' : '#6d8ba5' });
      d += arrow(cx, y + 110, cx, y + 134, C4.blue, 3, del ? '5 5' : '');
      d += box(cx - 70, y + 138, 140, 34, del ? l.prot_no : l.prot, { size: 13.5, fill: del ? '#f3f5f8' : C4.amberFill, stroke: del ? '#9aa7b3' : C4.amber, dash: del ? '6 5' : '' });
    });
    d += line(318, 40, 318, 250, '#c8d6e2', 2, 'stroke-dasharray="5 5"');
    d += MTH.tl(20, 272, l.foot, 12.5, 'start');
    return d;
  },
  /* масс-спектрометрия фосфопептидов: белок → пептиды → обогащение → спектр; сдвиг массы на 80 Да */
  ms(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    const steps = [l.s1, l.s2, l.s3, l.s4], ys = [44, 104, 164, 224];
    steps.forEach((t, i) => {
      d += box(24, ys[i], 160, 34, t, { size: 13, fill: i === 3 ? '#eef3f7' : '#fff' });
      if (i < 3) d += arrow(104, ys[i] + 36, 104, ys[i + 1] - 4, C4.blue, 3) + tx(118, ys[i] + 52, [l.e1, l.e2, l.e3][i], 12, 'start');
    });
    d += MTH.panel(300, 24, l.pB, l.b);
    const X0 = 330, Y0 = 236;
    d += arrow(X0, Y0, 622, Y0, '#556171', 2) + arrow(X0, Y0, X0, 56, '#556171', 2);
    d += tx(612, Y0 + 20, l.mz, 12, 'end') + tx(X0 + 8, 62, l.int, 12, 'start');
    d += line(430, Y0, 430, 96, C4.blue, 6) + tx(430, Y0 + 20, l.pk1, 12);
    d += line(530, Y0, 530, 146, C4.orange, 6) + tx(530, Y0 + 20, l.pk2, 12);
    d += line(430, 84, 530, 84, '#6b7c8f', 1.5, 'stroke-dasharray="4 4"') + tx(480, 78, l.shift, 12.5);
    d += arrow(186, 250, 318, 250, '#6b7c8f', 2, '5 5');
    d += MTH.tl(20, 286, l.foot, 12.5, 'start');
    /* FV108: спектр фрагментов указывает положение фосфата — пептид с двумя возможными участками (Ser и Thr) */
    if (l.seq) {
      d += MTH.panel(10, 346, l.pC, l.c);
      const x0 = 36, step = 40, y = 382;
      l.seq.forEach((r, i) => { const cand = i === l.site_s || i === l.site_t;
        d += circ(x0 + i * step, y, 15, cand ? '#eef3f7' : '#fff', `stroke="${cand ? C4.blue : '#9aa7b3'}" stroke-width="${cand ? 2.5 : 1.5}"`) + tx(x0 + i * step, y + 5, r, 13);
        if (i < l.seq.length - 1) d += line(x0 + i * step + 15, y, x0 + (i + 1) * step - 15, y, '#9aa7b3', 2); });
      d += pBadge(x0 + l.site_s * step + 14, y - 15);
      const br = (i1, i2, yy, col) => line(x0 + i1 * step - 18, yy, x0 + i2 * step + 18, yy, col, 3) + line(x0 + i1 * step - 18, yy - 6, x0 + i1 * step - 18, yy, col, 3) + line(x0 + i2 * step + 18, yy - 6, x0 + i2 * step + 18, yy, col, 3);
      const cut = l.site_s + 1;
      d += br(0, cut - 1, y + 28, C4.orange) + tx(x0 - 18, y + 46, l.f1, 12, 'start').replace('<text ', `<text style="fill:${C4.orange}" `);
      d += br(cut, l.seq.length - 1, y + 28, C4.blue) + tx(x0 + (l.seq.length - 1) * step + 18, y + 64, l.f2, 12, 'end').replace('<text ', `<text style="fill:${C4.blue}" `);
      d += MTH.tl(326, 372, l.res, 12.5, 'start');
    }
    return d;
  },
  /* FV107: контроль общей активности PKA в лизате и фосфорилирование PLN в клетке после разобщения PKA–AKAP (условная схема опыта) */
  pkalysate(l){
    let d = MTH.panel(10, 24, l.pA, l.a);
    d += MTH.tl(20, 52, l.mix, 12, 'start');
    [[80, l.c0], [210, l.c1]].forEach(([x, t]) => {
      d += `<path d="M${x - 22} 74 L${x - 22} 130 Q${x - 22} 150 ${x} 150 Q${x + 22} 150 ${x + 22} 130 L${x + 22} 74" fill="#eef3f7" stroke="#6d8ba5" stroke-width="2"/>`;
      d += tx(x, 168, t, 12);
      d += rect(x - 18, 252 - 62, 36, 62, C4.blue, 3) + line(x - 30, 252, x + 30, 252, '#556171', 2);
    });
    d += MTH.tl(145, 270, l.rate, 11.5);
    d += arrow(145, 120, 145, 182, C4.muted, 2, '4 4');
    d += line(318, 36, 318, 290, '#c8d6e2', 2, 'stroke-dasharray="5 5"');
    d += MTH.panel(330, 24, l.pB, l.b);
    const lx = [496, 584];
    lx.forEach((x, i) => { d += tx(x, 64, i ? l.c1s : l.c0s, 12); });
    [[l.row1, [1, 0.3]], [l.row2, [1, 1]]].forEach(([lab, v], r) => {
      const y = 96 + r * 54;
      d += tx(452, y + 5, lab, 12.5, 'end');
      lx.forEach((x, i) => { d += rect(x - 34, y - 9, 68, 18, '#152c45', 5, `opacity="${(0.15 + 0.85 * v[i]).toFixed(2)}"`); });
    });
    d += MTH.tl(340, 218, l.res, 12, 'start');
    return d;
  },
});


/* V05: на экране уже 760 px схема не сжимается до нечитаемых подписей, а лежит в прокручиваемой рамке (ширина не меньше 760 CSS-пикселей).
   Обёртка добавляется после каждой перерисовки виджета; подсказка берётся из CONTENT.ui.svg_hint (в коде русских фраз нет). */
(function(){
  const css = document.createElement('style');
  css.textContent = '@media (max-width:760px){.svgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.svgscroll::before{content:var(--svg-hint,"");display:block;position:sticky;left:0;font-size:12.5px;line-height:1.35;padding:6px 10px;color:var(--muted)}.svgscroll>svg{min-width:760px;border:0!important;border-radius:0!important}}';
  document.head.appendChild(css);
  document.documentElement.style.setProperty('--svg-hint', JSON.stringify(CONTENT.ui.svg_hint || ''));
  const wrap = root => root.querySelectorAll('.widget svg[viewBox]').forEach(sv => {
    if (sv.parentElement.classList.contains('svgscroll') || sv.classList.contains('lg') || sv.getAttribute('aria-label') === CONTENT.ui.chart_levels) return;
    const vb = sv.viewBox.baseVal; if (!vb || vb.width < 400) return;
    const d = document.createElement('div'); d.className = 'svgscroll'; sv.parentNode.insertBefore(d, sv); d.appendChild(sv);
    if (sv.dataset.center) d.scrollLeft = (d.scrollWidth - d.clientWidth) * parseFloat(sv.dataset.center);
  });
  new MutationObserver(() => wrap(document)).observe(document.body, { childList: true, subtree: true });
  wrap(document);
})();


/* P07: у урока может быть отдельная итоговая задача exam_quiz; в разделе «Проверить себя» показывается она, а не вопрос в конце шага
   (местное дополнение семинара 3 к оболочке: подменяет урок объектом с другим quiz; идентификаторы и отметки сохраняются по id урока). */
(function(){
  const qz = quizHtml, bq = bindQuiz;
  const view = (l, scope) => (scope === 'exam' && l.exam_quiz) ? Object.assign({}, l, { quiz: l.exam_quiz }) : l;
  const exOrder = {};   // порядок вариантов итоговой задачи хранится отдельно от порядка вопроса в конце шага
  quizHtml = (l, scope) => {
    const v = view(l, scope); if (v === l) return qz(l, scope);
    const keep = ORDER[l.id]; if (exOrder[l.id]) ORDER[l.id] = exOrder[l.id]; else delete ORDER[l.id];
    try { return qz(v, scope); } finally { exOrder[l.id] = ORDER[l.id]; if (keep) ORDER[l.id] = keep; else delete ORDER[l.id]; }
  };
  bindQuiz = (l, scope) => bq(view(l, scope), scope);
})();
