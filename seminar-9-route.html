/* условные пиктограммы методов (не данные эксперимента): точки микроскопии, полосы иммуноблота, кривая метки */
W._pic = (p, S) => {
  const w = 640, h = 150;
  let d = '';
  if (p.kind === 'micro') {
    [[0, '#7aa6cf', p.a], [1, '#d98f8f', p.b], [2, null, p.c]].forEach(([i, col, lab]) => {
      const x0 = 30 + i * 205; d += rect(x0, 18, 170, 100, '#1d2b38', 10);
      const pts = [[40, 30], [90, 55], [130, 35], [60, 75], [120, 80], [150, 60]];
      pts.forEach(([x, y], j) => {
        if (i < 2) d += circ(x0 + x - 20, 18 + y, 6, col);
        else { d += circ(x0 + x - 20, 18 + y, 6, j % 2 ? '#e2c26a' : '#7aa6cf'); }
      });
      d += tx(x0 + 85, 138, lab, 13);
    });
  } else if (p.kind === 'blot') {
    p.rows.forEach((r, i) => {
      const y = 22 + i * 46; d += tx(150, y + 18, r[0], 13, 'end');
      r[1].forEach((v, j) => { const x = 170 + j * 110; d += rect(x, y + 4, 80, 18, '#e9eef2', 4) + rect(x + 40 - 36 * v, y + 6, 72 * v, 14, '#2a3a48', 5, `opacity="${0.25 + 0.75 * v}"`); });
    });
    p.lanes.forEach((ln, j) => { d += tx(210 + j * 110, 142, ln, 12.5); });
  }
  return svg(d + (p.cap ? tx(w - 10, 12, p.cap, 11.5, 'end') : ''), S.title, h, w);
};

/* ---------- Раздел 1 семинара 9 ---------- */
/* Общие цвета семинара 9 */
const C9 = {blue: '#145c96', red: '#ae3347', teal: '#007b72', violet: '#6b4c9a', gray: '#5f7385', light: '#9aa7b3', ink: '#152c45', amber: '#b07d00', orange: '#c3662f', grid: '#e4ebf1', mem: '#8fa9c0', ims: '#f7f9fb', mat: '#fdf3e8'};
const lines9 = (x, y, label, size, anchor = 'middle', color = C9.ink, weight = 600) => String(label).split('\n').map((t, i) => `<text x="${x}" y="${y + i * size * 1.18}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" style="fill:${color}">${esc(t)}</text>`).join('');
const memH9 = (x1, x2, y) => line(x1, y - 6, x2, y - 6, C9.mem, 3) + line(x1, y + 6, x2, y + 6, C9.mem, 3);

/* Шаг 3: механизм изменения связывания (Бойер) и интерфейс a–c в F₀. Три центра β меняют состояния каждые 120° поворота γ;
   кольцо c₈ делает шаг 45° на один H⁺ (развёртка кольца: две соседние c-субъединицы у двух полуканалов субъединицы a).
   Модель — перечисление состояний и углы, без кинетики; M9.rotor и M9.rotorAng — чистые функции для проверки в node. */
const M9 = {};
M9.rotor = (turns, mode) => {
  /* состояние центра i после turns поворотов: 0 — открытый, 1 — связывает, 2 — прочно удерживает.
     Синтез: 0→1→2→0 (ADP+Pi → ATP → выход ATP). Гидролиз: обратный порядок содержимого. */
  const st = [0, 1, 2].map(i => ((i + (mode === 0 ? turns : -turns)) % 3 + 3) % 3);  /* гидролиз — обратный порядок состояний */
  return {st, atp: turns, h: turns * 8 / 3};
};
/* ang — угол ротора (кольцо и γ), angB — угол, на который уже отреагировали β-центры; sub — стадия шага одного H⁺ (0 — нет).
   При sub = 2 кольцо уже повернулось, но H⁺ этого шага ещё не высвобожден, поэтому он не засчитан. */
M9.rotorAng = (ang, angB, sub, mode) => {
  const r = M9.rotor(Math.floor(angB / 120), mode);
  return {st: r.st, atp: r.atp, h: ang / 45 - (sub === 2 ? 1 : 0), turns: ang / 120, left: 120 * (Math.floor(angB / 120) + 1) - angB};
};
W.rotor = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0; s.ang ??= (s.turns || 0) * 120; s.angB ??= s.ang; s.sub ??= 0;
  set(S.title, S.status, buttonGroup('rt-mode', S.modes, s.mode, S.mode_label) +
    `<div class="controls"><button id="rt-step" class="btn">${esc(S.btn)}</button> <button id="rt-sub" class="btn">${esc(S.btn_sub)}</button> <button id="rt-reset" class="btn ghost">${esc(S.btn_reset)}</button></div>`);
  NET_REDRAW = null;
  const wrap8 = u => ((u % 8) + 8) % 8;
  const draw = () => {
    const r = M9.rotorAng(s.ang, s.angB, s.sub, s.mode), syn = s.mode === 0, sub = s.sub;
    const hit = sub === 4 && s.hit;
    const W0 = 560, H0 = 500, P = 56, X0 = 56, UA = 3, UB = 4;      /* UA — слот полуканала в межмембранное пространство, UB — в матрикс */
    const XA = X0 + P * UA + P / 2, XB = X0 + P * UB + P / 2, XM = (XA + XB) / 2;
    const sg = syn ? -1 : 1, bindU = syn ? UA : UB, relU = syn ? UB : UA;
    const flow = on => sub === 0 ? {w: 4, op: 1} : on ? {w: 7, op: 1} : {w: 3, op: 0.3};
    const fUp = flow(sub === (syn ? 1 : 3)), fLo = flow(sub === (syn ? 3 : 1)), fRot = flow(sub === 2);
    let d = '';
    d += rect(4, 4, W0 - 8, 96, C9.ims, 12, `stroke="#d2dde7" stroke-width="2"`) + rect(4, 148, W0 - 8, H0 - 152, C9.mat, 12, `stroke="#c9955e" stroke-width="2"`);
    d += rect(4, 100, W0 - 8, 48, '#e6ecf2', 0) + line(4, 100, W0 - 4, 100, C9.mem, 3) + line(4, 148, W0 - 4, 148, C9.mem, 3);
    d += `<text x="16" y="26" font-size="16" font-style="italic" style="fill:#4d6275">${esc(S.ims)}</text><text x="${W0 - 16}" y="${H0 - 12}" font-size="16" font-style="italic" text-anchor="end" style="fill:#4d6275">${esc(S.matrix)}</text>`;
    d += `<text x="${W0 - 16}" y="26" font-size="16" text-anchor="end" font-weight="600" style="fill:${C9.blue}">${esc(S.f0)}</text>`;
    /* связь c-кольца с γ: планка за субъединицей a и стержень γ */
    d += rect(X0, 150, 8 * P, 8, '#c9d6e2', 3, `stroke="${C9.gray}" stroke-width="1.5"`);
    d += `<text x="${X0 + 4}" y="178" font-size="13.5" text-anchor="start" style="fill:${C9.gray}">${esc(S.bridge)}</text>`;
    /* субъединица a: неподвижный блок с двумя полуканалами и аргинином между ними */
    d += rect(226, 84, 108, 80, '#e3e9ef', 8, `stroke="${C9.gray}" stroke-width="2"`);
    d += rect(XA - 7, 82, 14, 34, '#cfe6f7', 3, `stroke="${C9.blue}" stroke-width="1"`) + rect(XB - 7, 132, 14, 36, '#cfe6f7', 3, `stroke="${C9.blue}" stroke-width="1"`);
    d += `<text x="304" y="106" font-size="18" text-anchor="middle" font-weight="700" style="fill:${C9.ink}">${esc(S.a)}</text>`;
    d += rect(XM - 8, 108, 16, 32, '#f7dfe3', 4, `stroke="${C9.red}" stroke-width="2"`) + `<text x="${XM}" y="130" font-size="17" text-anchor="middle" font-weight="700" style="fill:${C9.red}">+</text>`;
    d += `<text x="${XM}" y="157" font-size="13" text-anchor="middle" font-weight="600" style="fill:${C9.red}">${esc(S.arg)}</text>`;
    d += lines9(XA - 14, 52, S.hc_ims, 13, 'end', C9.blue, 600) + lines9(XB + 22, 178, S.hc_mat, 13, 'start', C9.blue, 600);
    /* c-кольцо в развёртке: правый край смыкается с левым; H — нейтральная (протонированная) группа, − — заряженная */
    const ring = s.ang / 45;
    for (let k = 0; k < 8; k++) {
      const ub = wrap8(k + sg * ring), slot = Math.round(ub) % 8, x = X0 + P / 2 + P * (wrap8(k + sg * ring + 0.5) - 0.5);
      let neutral = !(slot === UA || slot === UB);
      if (sub === 1 && slot === bindU) neutral = true;      /* присоединён H⁺ у полуканала-входа */
      if (sub === 2 && slot === relU) neutral = true;       /* субъединица только что дошла до полуканала-выхода и ещё несёт H⁺ */
      d += circ(x.toFixed(1), 124, 15, neutral ? '#d5f0ec' : '#ffffff', `stroke="${neutral ? C9.teal : C9.red}" stroke-width="2.5"`);
      d += `<text x="${x.toFixed(1)}" y="${neutral ? 129 : 130}" font-size="${neutral ? 14 : 18}" text-anchor="middle" font-weight="700" style="fill:${neutral ? C9.teal : C9.red}">${neutral ? 'H' : '−'}</text>`;
      if ((sub === 1 && slot === bindU) || (sub === 3 && slot === relU)) d += circ(x.toFixed(1), 124, 20, 'none', `stroke="${C9.amber}" stroke-width="4"`);
    }
    /* поток H⁺ через два полуканала: вход со стороны межмембранного пространства, выход в матрикс (в гидролизе — наоборот) */
    d += `<g opacity="${fUp.op}">` + (syn ? arrow(XA, 32, XA, 104, C9.teal, fUp.w) : arrow(XA, 104, XA, 32, C9.teal, fUp.w)) + `</g>`;
    d += `<g opacity="${fLo.op}">` + (syn ? arrow(XB, 142, XB, 206, C9.teal, fLo.w) : arrow(XB, 206, XB, 142, C9.teal, fLo.w)) + `</g>`;
    d += `<text x="${XA + 12}" y="50" font-size="16" text-anchor="start" font-weight="700" style="fill:${C9.teal}">${esc(S.h)}</text>`;
    d += `<text x="${XB + 14}" y="210" font-size="16" text-anchor="start" font-weight="700" style="fill:${C9.teal}">${esc(syn ? S.h_in : S.h_out)}</text>`;
    /* направление вращения кольца */
    d += `<g opacity="${fRot.op}">` + (syn ? arrow(500, 58, 424, 58, C9.orange, fRot.w) : arrow(424, 58, 500, 58, C9.orange, fRot.w)) + `</g>`;
    d += `<text x="500" y="80" font-size="14" text-anchor="end" font-weight="600" style="fill:${C9.orange}">${esc(S.ring_dir)}</text>`;
    /* γ: центральная ножка */
    d += rect(274, 164, 12, 90, '#c9d6e2', 3, `stroke="${C9.gray}" stroke-width="2"`);
    /* F1: три β-центра вокруг γ (вид со стороны мембраны, условно) */
    const cx = 280, cy = 348, R = 88;
    d += circ(cx, cy, 136, '#ffffff', `stroke="#c9d6e2" stroke-width="2"`);
    d += `<text x="${cx + 124}" y="${cy - 92}" font-size="16" text-anchor="start" font-weight="600" style="fill:${C9.ink}">${esc(S.f1)}</text>`;
    const cont = syn ? S.cont_syn : S.cont_hyd;
    r.st.forEach((k, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 3, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      const active = k === 2;
      const fill = active ? '#fbe3a6' : (k === 0 ? '#f3f5f7' : '#eaf2fb'), stroke = active ? C9.amber : (k === 0 ? C9.light : C9.blue);
      d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="46" fill="${fill}" stroke="${stroke}" stroke-width="${active ? 3.5 : 2.5}"${k === 0 ? ' stroke-dasharray="6 4"' : ''}/>`;
      if (hit) d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="51" fill="none" stroke="${C9.amber}" stroke-width="3" stroke-dasharray="3 4"/>`;
      d += lines9(x, y - (String(S.states[k]).includes('\n') ? 14 : 4), S.states[k], 13.5, 'middle', C9.ink, 600);
      const c = cont[k];
      if (c) d += `<text x="${x.toFixed(1)}" y="${(y + 22).toFixed(1)}" font-size="14" text-anchor="middle" font-weight="700" style="fill:${C9.violet}">${esc(c)}</text>`;
      if (k === 0) d += `<text x="${x.toFixed(1)}" y="${(y + 22).toFixed(1)}" font-size="13" text-anchor="middle" font-style="italic" style="fill:${C9.gray}">${esc(syn ? S.release_syn : S.release_hyd)}</text>`;
    });
    /* γ в F1: метка текущего угла и направление вращения */
    d += circ(cx, cy, 16, '#c9d6e2', `stroke="${C9.gray}" stroke-width="2"`) + `<text x="${cx}" y="${cy + 6}" font-size="16" text-anchor="middle" font-weight="700">${esc(S.gamma)}</text>`;
    { const th = -Math.PI / 2 + (syn ? 1 : -1) * s.ang * Math.PI / 180;
      d += line((cx + 17 * Math.cos(th)).toFixed(1), (cy + 17 * Math.sin(th)).toFixed(1), (cx + 29 * Math.cos(th)).toFixed(1), (cy + 29 * Math.sin(th)).toFixed(1), C9.orange, 4); }
    const ra = 24, a0 = syn ? -2.6 : 0.5, a1 = syn ? 0.5 : -2.6;
    const pA = [cx + ra * Math.cos(a0), cy + ra * Math.sin(a0)], pB = [cx + ra * Math.cos(a1), cy + ra * Math.sin(a1)];
    d += `<path d="M ${pA[0].toFixed(1)} ${pA[1].toFixed(1)} A ${ra} ${ra} 0 1 ${syn ? 1 : 0} ${pB[0].toFixed(1)} ${pB[1].toFixed(1)}" fill="none" stroke="${C9.orange}" stroke-width="3"/>`;
    { const tg = a1 + (syn ? Math.PI / 2 : -Math.PI / 2), L = 9; d += `<path d="M${(pB[0] + L * Math.cos(tg)).toFixed(1)} ${(pB[1] + L * Math.sin(tg)).toFixed(1)} L${(pB[0] + L * 0.9 * Math.cos(tg + 2.3)).toFixed(1)} ${(pB[1] + L * 0.9 * Math.sin(tg + 2.3)).toFixed(1)} L${(pB[0] + L * 0.9 * Math.cos(tg - 2.3)).toFixed(1)} ${(pB[1] + L * 0.9 * Math.sin(tg - 2.3)).toFixed(1)} Z" fill="${C9.orange}"/>`; }
    const txt = sub === 0 ? (syn ? S.note_syn : S.note_hyd)
      : sub === 4 ? (syn ? S.st4_syn : S.st4_hyd)[hit ? 0 : 1].replace('{ang}', String(s.ang)).replace('{left}', String(r.left))
      : (syn ? S.st_syn : S.st_hyd)[sub - 1];
    const stages = `<ol class="rt-stages">${S.stage_names.map((t, i) => `<li${sub === i + 1 ? ' aria-current="step"' : ''}>${sub === i + 1 ? '<strong>' : ''}${esc(t)}${sub === i + 1 ? '</strong>' : ''}</li>`).join('')}</ol>`;
    const html = svg(d, S.title, H0, W0, syn ? S.note_syn : S.note_hyd) + `<div class="legend-lines">${S.lg.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
    const turns = r.turns;
    out(html, `<div class="metrics three">${metric(S.m_turns, Number.isInteger(turns) ? String(turns) : num(turns, 2))}${metric(syn ? S.m_atp_syn : S.m_atp_hyd, String(r.atp))}${metric(syn ? S.m_h_syn : S.m_h_hyd, num(r.h, 1))}</div>` +
      result(`${stages}<p>${esc(txt)}</p><p class="quiet">${esc(S.fixed)}</p>`));
  };
  onGroup('rt-mode', v => { s.mode = v; s.ang = 0; s.angB = 0; s.sub = 0; s.hit = false; draw(); });
  $('rt-step').onclick = () => { s.ang += 120; s.angB = s.ang; s.sub = 0; s.hit = false; draw(); };
  $('rt-sub').onclick = () => {
    s.sub = s.sub % 4 + 1;
    if (s.sub === 2) s.ang += 45;                                  /* поворот кольца на одну c-субъединицу */
    if (s.sub === 4) { const k0 = Math.floor(s.angB / 120); s.angB = s.ang; s.hit = Math.floor(s.angB / 120) > k0; }
    draw();
  };
  $('rt-reset').onclick = () => { s.ang = 0; s.angB = 0; s.sub = 0; s.hit = false; draw(); };
  draw();
};

/* Шаг 7: учебная трасса O₂ и OCR при последовательных добавках. Числа — условные единицы на 10 тыс. клеток (S.fixed). */
M9.ocr = (cells, norm) => {
  const per = [100, 35, 220, 10];                 /* OCR в интервалах на 10 тыс. клеток */
  const k = norm ? 1 : cells / 10;
  const v = per.map(x => x * k);
  const nm = v[3];
  return {v, nm, basal: v[0] - nm, atp: v[0] - v[1], leak: v[1] - nm, max: v[2] - nm, res: v[2] - v[0]};
};
W.ocr = ({S, s, set, out, onGroup, onCheck}) => {
  s.view ??= 0; s.well ??= 0; s.norm ??= false;
  set(S.title, S.status, buttonGroup('oc-view', S.views, s.view, S.view_label) + buttonGroup('oc-well', S.wells, s.well, S.well_label) +
    `<div class="controls">${check('oc-norm', S.norm_label, s.norm)}</div>`);
  NET_REDRAW = null;
  const draw = () => {
    const cells = s.well ? 20 : 10, r = M9.ocr(cells, s.norm);
    const W0 = 560, H0 = 360, X0 = 64, X1 = 540, Y0 = 300, Y1 = 30;
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    const seg = (X1 - X0) / 4;
    for (let p = 1; p < 4; p++) d += line(X0 + p * seg, Y1, X0 + p * seg, Y0, C9.gray, 1.5, 'stroke-dasharray="5 4"');
    S.phases.forEach((t, p) => { d += `<text x="${X0 + p * seg + seg / 2}" y="${Y0 + 24}" font-size="15" text-anchor="middle">${esc(t)}</text>`; });
    if (s.view === 0) {
      /* концентрация O₂ в камере: исходная запись лунки; нормировка (s.norm) действует только на OCR и показатели (v3.9, S9-F10) */
      const raw = M9.ocr(cells, false).v, kk = (Y0 - Y1 - 20) / 900;
      let y = Y1 + 10, path = `M${X0},${y.toFixed(1)}`;
      raw.forEach((v, p) => { y += v * kk; path += ` L${(X0 + (p + 1) * seg).toFixed(1)},${y.toFixed(1)}`; });
      d += `<path d="${path}" fill="none" stroke="${C9.blue}" stroke-width="3.5"/>`;
      d += `<text x="${X0 + 6}" y="${Y1 - 10}" font-size="15" text-anchor="start">${esc(S.ax_o2)}</text><text x="${X1}" y="${H0 - 6}" font-size="15" text-anchor="end">${esc(S.ax_t)} →</text>`;
    } else {
      const vmax = 450, sc = (Y0 - Y1 - 10) / vmax;
      r.v.forEach((v, p) => {
        const h = v * sc, x = X0 + p * seg + seg * 0.25, w = seg * 0.5;
        d += rect(x, Y0 - h, w, h, [C9.blue, C9.gray, C9.orange, C9.light][p], 3);
        d += `<text x="${x + w / 2}" y="${Y0 - h - 6}" font-size="15" text-anchor="middle" font-weight="700">${num(v, 0)}</text>`;
      });
      const nmY = Y0 - r.nm * sc;
      d += line(X0, nmY, X1, nmY, C9.violet, 2, 'stroke-dasharray="6 4"');

/* Шаг 14: два эксперимента. Зонд TMRM (качественные уровни 0–3) и радиоавтограф импорта (условная интенсивность полос). */
M9.tmrm = (mode, cond) => {
  /* psi: 3 исходно, 2 частичная деполяризация, 3 при меньшей массе, 0 при FCCP; mass: 1 или 0.5 */
  const psi = [3, 2, 3, 0][cond], mass = cond === 2 ? 0.5 : 1;
  let mito, cyt;
  if (mode === 0) { mito = Math.round(psi * mass); cyt = cond === 1 ? 1 : (cond === 3 ? 1 : 0); }
  else { mito = cond === 1 ? 3 : (cond === 3 ? 0 : (cond === 2 ? 1 : 2)); cyt = cond === 1 ? 2 : (cond === 3 ? 1 : 0); }
  return {psi, mass, mito: Math.max(0, Math.min(3, mito)), cyt};
};
M9.importLanes = () => [
  {p: 1, m: 0}, {p: 0.1, m: 1}, {p: 0, m: 0}, {p: 0, m: 0}, {p: 0, m: 0}
];
W.assay = ({S, s, set, out, onGroup}) => {

/* ---------- Раздел 3 семинара 9 ---------- */
/* Шаг 15: качественный профиль [Ca²⁺] от открытого IP₃R (убывает с расстоянием). Условные единицы. */
M9.micro = x => 0.1 + 9.9 * Math.exp(-x / 40);   /* x — расстояние, усл. «нм»; 10 у канала, 0.1 — средний фон */

/* Шаги 18–19: свободный и общий Ca²⁺ матрикса после входа. Учебная модель в условных единицах:
   dC/dt = A·[идёт вход] − V·C/(K + C) (выход насыщаемый), общее содержание L = β·C (постоянная доля связанного Ca²⁺).
   Явный метод Эйлера с шагом 0,05. */
M9.catime = (md, D, V) => {
  const dt = 0.05, n = Math.round(md.T / dt), tt = [], C = [], L = [];
  let c = 0;
  for (let i = 0; i <= n; i++) {
    const t = i * dt, J = (t >= md.t0 && t < md.t0 + D) ? md.A : 0;
    tt.push(t); C.push(c); L.push(c * md.beta);
    c = Math.max(0, c + (J - V * c / (md.K + c)) * dt);
  }
  const iMax = C.indexOf(Math.max(...C)), cMax = C[iMax];
  let tHalf = null;
  for (let i = iMax; i < C.length; i++) if (C[i] <= cMax / 2) { tHalf = tt[i] - tt[iMax]; break; }
  return {tt, C, L, cMax, lMax: cMax * md.beta, tHalf, end: C[C.length - 1]};
};
W.catime = ({S, s, set, out, onGroup}) => {
  const ov = S.mode === 'overload', md = S.model;
  s.out ??= 0; s.q ??= 0; s.dur ??= 0;

  set(S.title, S.status, ctr);
  NET_REDRAW = null;
  const draw = () => {
    const D = ov ? md.D[s.dur] : md.D, V = md.V[s.out];

    const showTot = ov || s.q === 1;
    const W0 = 560, H0 = 330, X0 = 64, X1 = 540, Y0 = 280, Y1 = 30;
    const ser = showTot ? r.L : r.C, sref = showTot ? ref.L : ref.C;
    const ymax = Math.max(...ser, ...sref, ov ? md.risk[1] : 0) * 1.12;
    const xp = t => X0 + t / md.T * (X1 - X0), yp = v => Y0 - v / ymax * (Y0 - Y1);
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    /* полоса входа */
    d += rect(xp(md.t0), Y1, xp(md.t0 + D) - xp(md.t0), Y0 - Y1, '#e6f3ef', 0, 'opacity=".9"');
    if (ov) { const yr = yp(md.risk[0]); d += rect(X0, Y1, X1 - X0, yr - Y1, '#f8e1e5', 0, 'opacity=".55"') + `<text x="${X1 - 6}" y="${Y1 + 18}" font-size="13" text-anchor="end" style="fill:${C9.red}">${esc(S.zone)}</text>`; }
    d += `<text x="${xp(md.t0) + 2}" y="${Y0 + 18}" font-size="14" text-anchor="start" style="fill:${C9.teal}">${esc(S.pulse)}</text>`;

    if (!ov && s.out === 1) d += `<path d="M${P(sref)}" fill="none" stroke="${C9.light}" stroke-width="3" stroke-dasharray="6 5"/>`;
    d += `<path d="M${P(ser)}" fill="none" stroke="${showTot ? C9.violet : '#a63c72'}" stroke-width="3.5"/>`;
    d += `<text x="${X0 + 4}" y="${Y1 - 10}" font-size="14" text-anchor="start">${esc(showTot ? S.ax_tot : S.ax_free)}</text><text x="${X1}" y="${H0 - 10}" font-size="14" text-anchor="end">${esc(S.ax_t)}</text>`;
    let html = svg(d, S.title, H0, W0);
    if (!ov && s.out === 1) html += `<div class="legend-lines"><span>${esc(S.ref)}</span></div>`;
    let mets, note;
    if (ov) {
      const risk = r.lMax >= md.risk[1] ? 2 : (r.lMax >= md.risk[0] ? 1 : 0);
      mets = `<div class="metrics three">${metric(S.m_peak, num(r.lMax, 0) + ' ' + S.unit)}${metric(S.m_risk, S.risk[risk])}${metric(S.m_nadh, S.nadh[s.dur])}</div>`;
      note = `<p>${esc(S.notes[s.dur + '-' + s.out])}</p><p class="quiet">${esc(S.fixed)}</p>`;

    }

  };

  onGroup('ct-out', v => { s.out = v; draw(); });
  if (!ov) onGroup('ct-q', v => { s.q = v; draw(); });
  draw();
};

W.camethods = ({S, s, set, out, onGroup}) => {

/* Шаг 25: модель практикума (вопрос 4), упрощённо: обеспеченность субъединицей f = min(1, (1 − h)/W),
   относительная мощность комплекса g = (1 + R)·f / (R + f). */
M9.g = (h, R, W) => { const f = Math.min(1, (1 - h) / W); return f <= 0 ? 0 : (1 + R) * f / (R + f); };
M9.hThr = (R, need, W) => { /* g = need → f = nR/(1+R−n); h = 1 − W·f */ const f = need * R / (1 + R - need); return 1 - W * f; };
W.hcurve = ({S, s, set, out, onGroup, onRange}) => {

  NET_REDRAW = null;
  const draw = () => {
    const R = S.R[s.v], Wd = S.W, need = S.need[s.n], h = s.h / 100, g = M9.g(h, R, Wd), thr = M9.hThr(R, need, Wd);
    const W0 = 560, H0 = 330, X0 = 70, X1 = 540, Y0 = 280, Y1 = 30;
    const xp = x => X0 + x * (X1 - X0), yp = y => Y0 - y * (Y0 - Y1);
    let d = line(X0, Y0, X1, Y0, '#7f97ab', 1.5) + line(X0, Y1, X0, Y0, '#7f97ab', 1.5);
    [0, 0.25, 0.5, 0.75, 1].forEach(t => { d += `<text x="${xp(t)}" y="${Y0 + 22}" font-size="14" text-anchor="middle">${Math.round(t * 100)}</text><text x="${X0 - 8}" y="${yp(t) + 5}" font-size="14" text-anchor="end">${Math.round(t * 100)}</text>`; });
    /* другая кривая — бледно, для сравнения */
    const P = RR => { let p = ''; for (let i = 0; i <= 100; i++) { const x = i / 100; p += (i ? ' L' : 'M') + xp(x).toFixed(1) + ',' + yp(M9.g(x, RR, Wd)).toFixed(1); } return p; };
    d += `<path d="${P(S.R[1 - s.v])}" fill="none" stroke="${C9.light}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
    d += `<path d="${P(R)}" fill="none" stroke="${C9.blue}" stroke-width="3.5"/>`;

    d += `<text x="${X0}" y="${Y1 - 10}" font-size="14" text-anchor="start">${esc(S.ax_y)}</text><text x="${X1}" y="${H0 - 8}" font-size="14" text-anchor="end">${esc(S.ax_x)}</text>`;

  };
  onRange('hc-h', v => { s.h = v; draw(); });

  onGroup('hc-n', v => { s.n = v; draw(); });
  draw();

/* Шаг 27: независимые биномиальные выборки размера N из набора с долей 0,5. Генератор mulberry с фиксированным зерном,
   кнопка меняет зерно (воспроизводимо в тестах). */
M9.rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
M9.sample = (N, p, rnd) => { let k = 0; for (let i = 0; i < N; i++) if (rnd() < p) k++; return k / N; };
M9.bottle = (N, seed, reps = 2000, kids = 12) => {
  const rnd = M9.rng(seed), all = [];
  for (let i = 0; i < reps; i++) all.push(M9.sample(N, 0.5, rnd));
  const mean = all.reduce((a, b) => a + b, 0) / reps, sd = Math.sqrt(all.reduce((a, b) => a + (b - mean) ** 2, 0) / reps);
  const ext = all.filter(x => x <= 0.2 || x >= 0.8).length / reps;
  return {kids: all.slice(0, kids), all, mean, sd, ext};
};

    out(svg(d, S.title, H0, W0), `<div class="metrics three">${metric(S.m_mean, Math.round(r.mean * 100) + nb + '%')}${metric(S.m_sd, Math.round(r.sd * 100) + nb + '%')}${metric(S.m_ext, Math.round(r.ext * 100) + nb + '%')}</div>` + result(`<p>${esc(S.notes[s.n])}</p><p class="quiet">${esc(S.fixed)}</p>`));
