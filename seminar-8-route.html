S2.mdv = (m, e, share, nC = 6) => { const T = Array(nC + 1).fill(0), f = Math.max(0, Math.min(1, e * share)); T[0] = 1 - f; T[m] += f; return T; };

S2.raw = (T, nC = 6, p = S2.NAT) => { const R = Array(nC + 1).fill(0); T.forEach((t, i) => { for (let j = i; j <= nC; j++) R[j] += t * S2.binom(nC - i, j - i, p); }); return R; };
S2.gauss = (x, c, w, h) => h * Math.exp(-Math.pow((x - c) / w, 2) / 2);

      const slot = w / 7; let g = line(x0, y0 + h, x0 + w, y0 + h, GR, 2) + line(x0, y0, x0, y0 + h, GR, 2);
      vals.forEach((v, i) => {
        const bh = Math.max(v > 0.0005 ? 2 : 0, v * h * 0.92), bx = x0 + i * slot + slot * 0.18, bw = slot * 0.64;
        g += rect(bx, y0 + h - bh, bw, bh, i === sc.m ? '#e0a21b' : '#6d9ccc', 2, `stroke="${INK}" stroke-width="1"`);
        if (v >= 0.005) g += T(bx + bw / 2, y0 + h - bh - 5, (v * 100).toFixed(v >= 0.1 ? 0 : 1).replace('.', ','), narrow ? 12 : 14);
        g += T(bx + bw / 2, y0 + h + (narrow ? 16 : 19), 'M+' + i, narrow ? 12 : 14);
      });
      return g;
    };
    const chrom = (x0, y0, w, h) => {
      let g = line(x0, y0 + h, x0 + w, y0 + h, GR, 2) + line(x0, y0, x0, y0 + h, GR, 2);
      const peaks = [[0.3, 0.26, 0.55, LG], [0.66, 0.26, 0.9, '#e0a21b']];
      peaks.forEach(([c, wd, ht, col], k) => {
        let p = `M${x0},${y0 + h} `;
        for (let i = 0; i <= 60; i++) { const xx = x0 + w * i / 60, yy = y0 + h - S2.gauss(i / 60, c, wd / 4.2, ht * h * 0.92); p += `L${xx.toFixed(1)},${yy.toFixed(1)} `; }
        p += `L${x0 + w},${y0 + h} Z`;
        g += `<path d="${p}" fill="${col}" fill-opacity="${k ? 0.75 : 0.45}" stroke="${INK}" stroke-width="1.5"/>`;
        g += T(x0 + w * c, y0 + h - ht * h * 0.92 - 6, S.peaks[k], narrow ? 12 : 14);
      });
      return g;
    };
    const limits = (x0, y0, w, h, cols, gap, size) => S.limits.map((L, i) => {
      const cw = (w - gap * (cols - 1)) / cols, cx = x0 + (i % cols) * (cw + gap), cy = y0 + Math.floor(i / cols) * (h + gap);
      const on = (L.when === 'dil' && s.e < 100) || (L.when === 'nat' && !s.nat);
      return chip(cx, cy, cw, h, L.t, on, size);
    }).join('');
    let H;
    if (!narrow) {
      /* ---- ПК, 640 px ---- */
      d += T(14, 24, S.hdrA, 15, 'start');
      const xs = ch.length === 3 ? [75, 220, 365] : [75, 220], xf = 545, yr = 92;
      ch.forEach((c, i) => {
        d += T(xs[i], 62, c.t, 15) + atoms(xs[i], yr, c.a) + T(xs[i], 122, c.m, 15);
      });
      d += T(xf, 62, sc.final.t, 15) + atoms(xf, yr, sc.final.a) + T(xf, 122, sc.final.m, 15);
      for (let i = 0; i < ch.length - 1; i++) {
        const a = xs[i] + 52, b = xs[i + 1] - 52;
        d += arrow(a, yr, b, yr, GR, 2.5) + T((a + b) / 2, 146, sc.gaps[i], 14);
      }
      const la = xs[ch.length - 1] + 52, lb = xf - 52, mid = (la + lb) / 2;
      d += arrow(la, yr, lb, yr, GR, 2.5) + T(mid, 58, sc.last, 14);
      if (hasPartner) {
        d += arrow(mid, 190, mid, yr + 8, GR, 2.5) + atoms(mid, 206, sc.partner.a) + T(mid - sc.partner.a.length * 7.5 - 6, 211, sc.partner.t, 15, 'end');
      }
      if (sc.ac && S.acnote) d += T(14, 240, S.acnote, 13, 'start', GR);
      d += T(14, 262, S.hdrB, 15, 'start');
      d += T(14, 286, S.chrom, 14, 'start', GR) + chrom(24, 316, 262, 100) + T(155, 442, S.rt, 14, 'middle', GR);
      d += arrow(296, 366, 324, 366, GR, 2.5);
      d += T(334, 286, S.spec, 14, 'start', GR) + spec(340, 316, 284, 100, V) + T(482, 462, S.mz, 14, 'middle', GR);
      d += T(14, 498, S.hdrC, 15, 'start');
      d += limits(14, 510, 612, 68, 5, 8, 14);
      H = 592;
    } else {
      /* ---- телефон, 340 px ---- */
      d += T(10, 20, S.hdrA, 13, 'start');
      let y = 58;
      const rowsN = ch.length;
      ch.forEach((c, i) => {
        d += T(10, y + 4, c.t.replace(/\n/g, ' '), 13, 'start') + atoms(190, y, c.a, 'start') + T(300, y + 4, c.m, 13, 'start');
        if (i < rowsN - 1) { d += arrow(60, y + 15, 60, y + 52, GR, 2.5) + T(74, y + 30, sc.gaps[i], 12, 'start'); y += 68; }
      });
      if (hasPartner) {
        d += T(60, y + 36, '+', 18);
        y += 64;
        d += T(10, y + 4, sc.partner.t, 13, 'start') + atoms(190, y, sc.partner.a, 'start');
      }
      d += arrow(60, y + 15, 60, y + 52, GR, 2.5) + T(74, y + 30, sc.last, 12, 'start');
      y += 68;
      d += T(10, y + 4, sc.final.t, 13, 'start') + atoms(190, y, sc.final.a, 'start') + T(300, y + 4, sc.final.m, 13, 'start');
      y += 40;
      if (sc.ac && S.acnote_n) { d += T(10, y + 2, S.acnote_n, 12, 'start', GR); y += 24; }
      d += T(10, y + 8, S.hdrB, 13, 'start');
      y += 28;
      d += T(10, y, S.chrom, 12, 'start', GR) + chrom(16, y + 10, 308, 90) + T(170, y + 122, S.rt, 12, 'middle', GR);
      y += 148;
      d += T(10, y, S.spec, 12, 'start', GR) + spec(16, y + 34, 308, 100, V) + T(170, y + 174, S.mz, 12, 'middle', GR);
      y += 200;
      d += T(10, y, S.hdrC_n, 13, 'start');
      d += limits(10, y + 12, 320, 62, 2, 8, 12);
      H = y + 12 + 3 * 70 + 6;
    }
    const f = S.dyn.replace('{iso}', 'M+' + sc.m).replace('{f}', fmt(fr)).replace('{e}', s.e + ' %').replace('{p}', s.p + ' %');
    out(svg(d, S.title, H, W0, sc.note),
      `<div class="metrics">${metric(S.m1, 'M+' + sc.m)}${metric(S.m2, fmt(fr))}${metric(S.m3, fmt(V[0]))}</div>` +
      result(`<p>${esc(sc.note)}</p><p>${esc(f)}</p><p class="quiet">${esc(s.nat ? S.nat_on : S.nat_off)}</p>`));
  };
  NET_REDRAW = draw;
  onGroup('s2-sc', v => { s.sc = v; draw(); });
  onRange('s2-e', v => { s.e = v; draw(); });
  onRange('s2-p', v => { s.p = v; draw(); });
  onCheck('s2-nat', v => { s.nat = v; draw(); });
  draw();
};
/* ---------- Раздел 3, шаг 21 (s3): какие величины измеряют LC–MS, иммуноблот и дот-блот ---------- */
/* Расчётные модели — чистые функции M8.s3…; значения условные (учебные), не данные опыта. */

/* LC–MS: площадь пика метаболита и внутреннего стандарта при потерях при экстракции.
   N — количество метаболита в образце (усл. ед.), loss — доля потерь (0..1),
   before — внутренний стандарт добавлен до экстракции (тогда он теряется так же, как метаболит). */
M8.s3lcms = (N, loss, before) => {
  const k = 2, Nis = 40, f = 1 - loss;
  const A = k * N * f, Ais = k * Nis * (before ? f : 1);
  return {A, Ais, est: A / Ais * Nis};
};
/* Иммуноблот: load — количество гистонов в дорожке, frac — доля модифицированных молекул
   (обе величины относительно контрольной дорожки, = 1); cap — верхняя граница линейного диапазона
   (null — насыщения нет). Возвращает сигналы полос и их отношение. */
M8.s3blot = (load, frac, cap) => {
  const ac0 = load * frac, h0 = load;
  const ac = cap ? Math.min(ac0, cap) : ac0, h3 = cap ? Math.min(h0, cap) : h0;
  return {ac, h3, ratio: ac / h3, truth: frac, sat: !!cap && (ac0 > cap || h0 > cap)};
};
/* Дот-блот: сигнал точки при разведении d (доля нанесённой ДНК) пропорционален ДНК и доле 5hmC. */
M8.s3dot = (load, frac, d) => {
  const sig = load * frac * d;
  return {sig, dna: load * d, per: sig / (load * d)};
};

const s3wrap = (t, n) => {
  const w = String(t).split(' '), res = [];
  let cur = '';
  w.forEach(x => { if (cur && (cur + ' ' + x).length > n) { res.push(cur); cur = x; } else cur = cur ? cur + ' ' + x : x; });
  if (cur) res.push(cur);
  return res;
};
const s3ink = v => 0.1 + 0.9 * Math.max(0, Math.min(v / 1.5, 1));
const s3pct = v => Math.round(v * 100) + ' %';
const s3text = (x, y, t, anchor = 'middle', fill = '#152c45', size = 15, weight = 600) =>
  String(t).split('\n').map((ln, i) => `<text x="${x}" y="${y + i * 18}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" style="fill:${fill}">${esc(ln)}</text>`).join('');
const s3peak = (cx, base, h, w, col) => {
  let p = '';
  for (let dx = -3 * w; dx <= 3 * w + 0.01; dx += w / 4) p += (p ? 'L' : 'M') + (cx + dx).toFixed(1) + ',' + (base - h * Math.exp(-(dx * dx) / (2 * w * w))).toFixed(1);
  return `<path d="${p}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="3"/>`;
};
/* ряд блоков метода: на ПК горизонтально со стрелками, на телефоне столбцом */
const s3pipe = (steps, nar, y0) => {
  let d = '';
  if (!nar) {
    const n = steps.length, w = 118, gap = (628 - n * w) / (n - 1);
    steps.forEach((t, i) => {
      const x = 6 + i * (w + gap);
      d += box(x, y0, w, 74, s3wrap(t, 13).join('\n'), {size: 15});
      if (i) d += arrow(x - gap + 3, y0 + 37, x - 3, y0 + 37, C7.gray, 2.5);
    });
    return {d, bottom: y0 + 74};
  }
  let y = y0;
  steps.forEach((t, i) => {
    const lines = s3wrap(t, 31), h = 14 + lines.length * 19;
    d += box(20, y, 300, h, lines.join('\n'), {size: 15});
    y += h;
    if (i < steps.length - 1) { d += arrow(170, y + 2, 170, y + 16, C7.gray, 2.5); y += 18; }
  });
  return {d, bottom: y};
};

/* вид 0: одна проба — три разные величины */
const s3overview = (S, s, nar) => {
  const o = S.ov;
  let d = '', h;
  const dashed = {dash: '7 5', fill: '#f3f5f7', stroke: C7.light, color: '#5c6b78'};
  if (!nar) {
    d += box(210, 8, 220, 44, o.sample, {size: 15});
    [[110, o.m1, o.r1, false], [320, o.m2, o.r2, false], [530, o.m3, o.r3, true]].forEach(([cx, m, r, no]) => {
      const st = no ? dashed : {};
      d += arrow(320, 54, cx, 100, no ? C7.light : C7.gray, 2.5, no ? '6 5' : '');
      d += box(cx - 100, 104, 200, 74, s3wrap(m, 22).join('\n'), Object.assign({size: 15}, st));
      d += arrow(cx, 180, cx, 232, no ? C7.light : C7.gray, 2.5, no ? '6 5' : '');
      d += box(cx - 100, 236, 200, 74, s3wrap(r, 22).join('\n'), Object.assign({size: 15, fill: no ? '#f3f5f7' : '#e6f3ef', stroke: no ? C7.light : C7.teal}, no ? {dash: '7 5', color: '#5c6b78'} : {}));
    });
    h = 322;
  } else {
    d += box(70, 8, 200, 44, o.sample, {size: 15});
    [[o.m1, o.r1, false], [o.m2, o.r2, false], [o.m3, o.r3, true]].forEach(([m, r, no], i) => {
      const y = 66 + i * 112;
      d += box(6, y, 148, 88, s3wrap(m, 15).join('\n'), Object.assign({size: 15}, no ? dashed : {}));
      d += arrow(156, y + 44, 184, y + 44, no ? C7.light : C7.gray, 2.5, no ? '6 5' : '');
      d += box(186, y, 148, 88, s3wrap(r, 15).join('\n'), Object.assign({size: 15, fill: no ? '#f3f5f7' : '#e6f3ef', stroke: no ? C7.light : C7.teal}, no ? {dash: '7 5', color: '#5c6b78'} : {}));
    });
    h = 66 + 3 * 112;
  }
  return {d, h, metrics: '', note: S.notes.ov};
};

/* вид 1: LC–MS */
const s3lc = (S, s, nar) => {
  const r = M8.s3lcms(s.n, s.loss / 100, s.before);
  const p = s3pipe(S.pipe[0], nar, 8);
  let d = p.d, h;
  const maxA = 200;
  if (!nar) {
    const base = 312, k = 0.8;
    d += line(60, base, 620, base, '#7f97ab', 2) + line(60, 112, 60, base, '#7f97ab', 2);
    d += s3text(66, 126, S.axis_y, 'start', '#4d6275', 15, 500) + s3text(340, base + 24, S.axis_x, 'middle', '#4d6275', 15, 500);
    const h1 = Math.max(4, r.A * k), h2 = Math.max(4, r.Ais * k);
    d += s3peak(190, base, h1, 20, C7.blue) + s3peak(430, base, h2, 20, C7.amber);
    d += s3text(190, Math.max(146, base - h1 - 10), S.peak_m, 'middle', C7.blue) + s3text(430, Math.max(146, base - h2 - 10), S.peak_is, 'middle', '#7a5600');
    h = base + 36;
  } else {
    const base = p.bottom + 230, k = 0.5;
    d += line(24, base, 330, base, '#7f97ab', 2) + line(24, p.bottom + 32, 24, base, '#7f97ab', 2);
    d += s3text(30, p.bottom + 28, S.axis_y, 'start', '#4d6275', 15, 500) + s3text(180, base + 24, S.axis_x, 'middle', '#4d6275', 15, 500);
    const h1 = Math.max(4, r.A * k), h2 = Math.max(4, r.Ais * k);
    d += s3peak(100, base, h1, 16, C7.blue) + s3peak(250, base, h2, 16, C7.amber);
    d += s3text(100, Math.max(p.bottom + 70, base - h1 - 10), S.peak_m, 'middle', C7.blue) + s3text(250, Math.max(p.bottom + 70, base - h2 - 28), S.peak_is_n, 'middle', '#7a5600');
    h = base + 36;
  }
  const key = s.loss === 0 ? 'lc0' : (s.before ? 'lc1' : 'lc2');
  const m = S.m_lc;
  return {d, h, metrics: metric(m[0], `${num(r.A, 0)} ${S.u}`) + metric(m[1], `${num(r.Ais, 0)} ${S.u}`) + metric(`${m[2]} (${S.true_word} ${s.n})`, `${num(r.est, 0)} ${S.u}`), note: S.notes[key]};
};

/* вид 2: иммуноблот */
const s3blot = (S, s, nar) => {
  const cap = s.sat ? 1.2 : null;
  const c = M8.s3blot(1, 1, cap), t = M8.s3blot(s.load / 100, s.frac / 100, cap);
  const p = s3pipe(S.pipe[1], nar, 8);
  let d = p.d, h;
  const lanes = nar ? [160, 270] : [300, 440], lx = nar ? 104 : 232, bw = nar ? 90 : 110;
  const top = p.bottom + (nar ? 20 : 22);
  d += rect(nar ? 6 : 140, top + 24, nar ? 328 : 390, 118, '#eef3f7', 10, 'stroke="#c8d6e2"');
  d += s3text(lanes[0], top + 18, S.lane_c, 'middle', '#4d6275', 15, 600) + s3text(lanes[1], top + 18, S.lane_t, 'middle', '#4d6275', 15, 600);
  const rows = [[top + 62, S.row_ac, c.ac, t.ac, t.sat], [top + 112, S.row_h3, c.h3, t.h3, false]];
  rows.forEach(([y, lab, vc, vt]) => {
    d += s3text(lx, y + 5, lab, 'end', '#152c45', 15, 600);
    d += rect(lanes[0] - bw / 2, y - 12, bw, 24, '#1f2f3d', 5, `opacity="${s3ink(vc).toFixed(2)}"`);
    d += rect(lanes[1] - bw / 2, y - 12, bw, 24, '#1f2f3d', 5, `opacity="${s3ink(vt).toFixed(2)}"`);
  });
  if (t.sat) d += s3text(nar ? 170 : 370, top + 168, S.sat_word, 'middle', C7.red, 15, 700);
  h = top + 184;
  const key = t.sat ? 'bl_sat' : (Math.abs(t.ratio - 1) < 0.03 ? 'bl_same' : (t.ratio < 1 ? 'bl_low' : 'bl_high'));
  const m = S.m_bl;
  return {d, h, metrics: metric(m[0], s3pct(t.ac / c.ac)) + metric(m[1], s3pct(t.h3 / c.h3)) + metric(m[2], s3pct(t.ratio / c.ratio)), note: S.notes[key] + (t.sat ? ` ${S.true_word_bl} ${s3pct(t.truth)}.` : '')};
};

/* вид 4: ChIP — обогащение ДНК промотора с антителом к модификации и с IgG (условные значения из S.chip_vals) */
const s3chip = (S, s, nar) => {
  const p = s3pipe(S.pipe[3], nar, 8), V = S.chip_vals;
  let d = p.d;
  const top = p.bottom + 24, base = top + (nar ? 190 : 200), k = (nar ? 150 : 160) / 110;
  const x0 = nar ? 40 : 90, x1 = nar ? 334 : 630, gx = nar ? [92, 182, 272] : [220, 380, 540], bw = nar ? 24 : 40, off = nar ? 15 : 26;
  d += line(x0, base, x1, base, '#7f97ab', 2) + line(x0, top, x0, base, '#7f97ab', 2);
  d += s3text(x0 + 6, top + 4, nar && S.chip_axis_n ? S.chip_axis_n : S.chip_axis, 'start', '#4d6275', nar ? 13 : 15, 500);
  const yc = base - V.ab[0] * k;
  d += `<line x1="${x0}" y1="${yc.toFixed(1)}" x2="${x1}" y2="${yc.toFixed(1)}" stroke="${C7.blue}" stroke-width="1.5" stroke-dasharray="6 5" opacity=".55"/>`;
  gx.forEach((cx, i) => {
    const on = i === s.chip, op = on ? 1 : 0.35;
    if (on) d += rect(cx - off - bw / 2 - 8, top + 14, 2 * off + bw + 16, base - top - 12, '#fbe3a6', 8, `opacity=".45"`);
    const ha = V.ab[i] * k, hi = V.igg[i] * k;
    d += rect(cx - off - bw / 2, base - ha, bw, ha, C7.blue, 3, `opacity="${op}"`) + rect(cx + off - bw / 2, base - hi, bw, hi, C7.gray, 3, `opacity="${op}"`);
    d += s3text(cx, base + 22, S.chip_groups[i], 'middle', '#152c45', nar ? 13 : 15, on ? 700 : 500);
  });
  const ly = base + (nar ? 66 : 62);
  d += rect(x0, ly - 12, 16, 16, C7.blue, 3) + s3text(x0 + 24, ly + 1, S.chip_ab, 'start', '#152c45', nar ? 13 : 15, 500);
  d += rect(nar ? x0 : x0 + 260, nar ? ly + 12 : ly - 12, 16, 16, C7.gray, 3) + s3text(nar ? x0 + 24 : x0 + 284, nar ? ly + 25 : ly + 1, S.chip_igg, 'start', '#152c45', nar ? 13 : 15, 500);
  const m = S.m_ch;
  return {d, h: ly + (nar ? 40 : 18), metrics: metric(m[0], s3pct(V.ab[s.chip] / V.ab[0])) + metric(m[1], String(V.igg[s.chip])), note: S.notes['ch' + s.chip]};
};

/* вид 3: дот-блот 5hmC */
const s3dotv = (S, s, nar) => {
  const p = s3pipe(S.pipe[2], nar, 8);
  let d = p.d;
  const dil = [1, 0.5, 0.25], load = s.dload / 100, frac = s.dfrac / 100;
  const xs = nar ? [190, 252, 314] : [340, 440, 540], lx = nar ? 150 : 310, top = p.bottom + 22;
  d += rect(nar ? 6 : 180, top + 28, nar ? 328 : 450, 232, '#eef3f7', 10, 'stroke="#c8d6e2"');
  dil.forEach((v, j) => { d += s3text(xs[j], top + 20, s3pct(v), 'middle', '#4d6275', 15, 600); });
  const rows = [
    [top + 66, S.row_dc, c => M8.s3dot(1, 1, c).sig],
    [top + 116, S.row_dt, c => M8.s3dot(load, frac, c).sig],
    [top + 176, S.row_sc, c => M8.s3dot(1, 1, c).dna],
    [top + 226, S.row_st, c => M8.s3dot(load, frac, c).dna]];
  rows.forEach(([y, lab, f], i) => {
    d += s3text(lx, y - 4, lab, 'end', '#152c45', 15, 600);
    dil.forEach((c, j) => { d += circ(xs[j], y, 17, i < 2 ? '#1f2f3d' : '#3b6f8f', `fill-opacity="${s3ink(f(c)).toFixed(2)}"`); });
  });
  const per = M8.s3dot(load, frac, 1).per / M8.s3dot(1, 1, 1).per, sig = M8.s3dot(load, frac, 1).sig;
  const key = Math.abs(per - 1) < 0.03 ? 'dt_same' : (per < 1 ? 'dt_low' : 'dt_high');
  const m = S.m_dt;
  return {d, h: top + 272, metrics: metric(m[0], s3pct(sig)) + metric(m[1], s3pct(load)) + metric(m[2], s3pct(per)), note: S.notes[key]};
};

W.s3_methods = ({S, s, set, out, onGroup, onRange, onCheck}) => {
  s.mode ??= 0; s.n ??= 50; s.loss ??= 30; s.before ??= true;
  s.load ??= 100; s.frac ??= 100; s.sat ??= false; s.dload ??= 100; s.dfrac ??= 100; s.chip ??= 0;
  const hid = k => (s.mode === k ? '' : ' style="display:none"');
  set(S.title, S.status, buttonGroup('s3-mode', S.modes, s.mode, S.modes_label) +
    `<div class="controls" id="s3-p1"${hid(1)}>${slider('s3-n', S.sl_n, 10, 100, s.n, 10)}${slider('s3-loss', S.sl_loss, 0, 60, s.loss, 10, ' %')}${check('s3-before', S.ck_before, s.before)}</div>` +
    `<div class="controls" id="s3-p2"${hid(2)}>${buttonGroup('s3-pre', S.pre, (s.load === 100 && s.frac === 100) ? 0 : -1, S.pre_label)}${slider('s3-load', S.sl_load, 20, 150, s.load, 10, ' %')}${slider('s3-frac', S.sl_frac, 20, 150, s.frac, 10, ' %')}${check('s3-sat', S.ck_sat, s.sat)}</div>` +
    `<div class="controls" id="s3-p3"${hid(3)}>${slider('s3-dload', S.sl_dload, 20, 150, s.dload, 10, ' %')}${slider('s3-dfrac', S.sl_dfrac, 20, 150, s.dfrac, 10, ' %')}</div>` +
    `<div class="controls" id="s3-p4"${hid(4)}>${buttonGroup('s3-chip', S.chip_opts, s.chip, S.chip_label)}</div>`);
  const draw = () => {
    const nar = small();
    const r = [s3overview, s3lc, s3blot, s3dotv, s3chip][s.mode](S, s, nar);
    const grid = `<div class="mini-grid"><div class="mini"><h3>${esc(S.h_show)}</h3><p>${esc(S.show[s.mode])}</p></div><div class="mini"><h3>${esc(S.h_noshow)}</h3><p>${esc(S.noshow[s.mode])}</p></div></div>`;
    out(svg(r.d, S.title, r.h, nar ? 340 : 640, S.desc[s.mode]),

  onRange('s3-loss', v => { s.loss = v; draw(); });

  onGroup('s3-pre', v => { [s.load, s.frac] = [[100, 100], [50, 100], [100, 50]][v]; setSlider('s3-load', s.load); setSlider('s3-frac', s.frac); draw(); });
  onRange('s3-load', v => { s.load = v; clearPre(); draw(); });
  onRange('s3-frac', v => { s.frac = v; clearPre(); draw(); });
  onCheck('s3-sat', v => { s.sat = v; draw(); });
  onRange('s3-dload', v => { s.dload = v; draw(); });
  onRange('s3-dfrac', v => { s.dfrac = v; draw(); });
  onGroup('s3-chip', v => { s.chip = v; draw(); });
  draw();

/* ---------- Раздел 4 (s4): NADH/NAD⁺, сигнальное окисление и повреждение ----------
   Шаг 22 — W.s4_nad (расчёт отношения и пула), шаг 27 — W.s4_damage (импульс и длительное воздействие),
   шаг 28 — W.s4_sensors (схемы Peredox и HyPer7). Шаги 23–26 рисует общая W.net.
   Все подписи берутся из widget.s (S). Модели — чистые функции M8.s4_*, все значения учебные. */

/* ---- модели ---- */
/* пул P и отношение NADH/NAD⁺ = v/100: NAD⁺ = P/(1+r), NADH = P − NAD⁺ */
M8.s4_nad = (pool, v) => { const r = v / 100, np = pool / (1 + r), nh = pool - np; return {np, nh, ratio: r, frac: nh / pool}; };
/* свободные формы при заданных долях, связанных с белками (0..1) */
M8.s4_free = (np, nh, bn, bh) => {
  const fnp = np * (1 - bn), fnh = nh * (1 - bh);
  return {fnp, fnh, rTotal: np > 0 ? nh / np : null, rFree: fnp > 0 ? fnh / fnp : null};
};
/* окисленная доля x и стойко повреждённая D: dx/dt = a·u·(1−x−D) − (r+q)·x; dD/dt = q·x; u = 1 при t < tOn */
M8.s4_dyn = (a, r, q, tOn, T = 60, dt = 0.5) => {
  const n = Math.round(T / dt), t = [], x = [], D = [];
  let xi = 0, Di = 0;
  for (let i = 0; i <= n; i++) {
    t.push(i * dt); x.push(xi); D.push(Di);
    const u = i * dt < tOn ? 1 : 0, free = Math.max(0, 1 - xi - Di);
    const dx = a * u * free - (r + q) * xi, dD = q * xi;
    xi = Math.max(0, xi + dx * dt); Di = Math.min(1, Di + dD * dt);
  }
  return {t, x, D, xmax: Math.max(...x), xend: x[n], Dend: D[n]};
};
/* Peredox: доля сенсора с NADH f = re/(re + r50); у раннего варианта re = r·10^(7,4 − pH) */
M8.s4_peredox = (r, early, pH, r50 = 0.05) => { const re = early ? r * Math.pow(10, 7.4 - pH) : r; return {re, f: re / (re + r50)}; };
/* HyPer7: доля окисленного сенсора f = kox·H/(kox·H + kr); вариант C121S (variant = 1) не окисляется */
M8.s4_hyper = (H, kr, variant, kox = 1) => { const f = variant === 1 ? 0 : kox * H / (kox * H + kr); return {f, pct: f * 100, sat: f >= 0.9}; };

/* ---- общие помощники ---- */
const s4f1 = x => num(x, Math.abs(x - Math.round(x)) < 0.05 ? 0 : 1);
const F4 = 21;   /* единиц viewBox шириной 640: на экране 390 px даёт не менее 9,5 px */
const s4cap = t => `<p class="quiet" style="margin:.7rem 0 .15rem;font-weight:600">${esc(t)}</p>`;
const s4cat = (x, y, w, h, label, hi) => box(x, y, w, h, label, hi ? {fill: '#fbe3a6', stroke: C7.amber, sw: 3.5, size: F4} : {size: F4});
/* график с произвольной осью X: curves [{pts:[[x,y]], color, dash}], xt [[x, подпись]], xm: x → 0..1 */
function s4plot(curves, o) {
  const w = 640, h = o.h || 300, x0 = 84, x1 = w - 26, y0 = h - 74, y1 = 56;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= 4; i++) { const y = y0 - (y0 - y1) * i / 4; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 10, y + 6, String(25 * i), F4, 'end'); }
  o.xt.forEach(([v, lab]) => { const x = x0 + (x1 - x0) * o.xm(v); s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 28, lab, F4); });
  const px = v => x0 + (x1 - x0) * o.xm(v), py = v => y0 - (y0 - y1) * v / 100;
  if (o.hline) s += line(x0, py(o.hline[0]), x1, py(o.hline[0]), C7.light, 1.5, 'stroke-dasharray="4 5"');
  curves.forEach(c => { s += `<path d="${c.pts.map(([a, b], i) => `${i ? 'L' : 'M'}${px(a).toFixed(1)},${py(b).toFixed(1)}`).join(' ')}" fill="none" stroke="${c.color}" stroke-width="3.5"${c.dash ? ` stroke-dasharray="${c.dash}"` : ''}/>`; });
  if (o.mark) s += circ(px(o.mark[0]), py(o.mark[1]), 7.5, '#fff', `stroke="${o.mark[2] || C7.red}" stroke-width="3.5"`);
  s += tx(10, 25, o.ylabel, F4, 'start') + tx((x0 + x1) / 2, h - 12, o.xlabel, F4);
  const lg = curves.filter(c => c.label).map(c => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${c.color}" stroke-width="3.5"${c.dash ? ` stroke-dasharray="${c.dash}"` : ''}/></svg>${esc(c.label)}</span>`).join('');
  return svg(s, o.title, h, w) + (lg ? `<div class="legend-lines">${lg}</div>` : '');
}
/* одна молекула сенсора: флуоресцентный белок (яркий или тусклый) над доменом-датчиком; st = 1 — правое состояние */
function s4unit(x, y, st, kind) {
  let d = circ(x + 16, y + 12, 12, st ? '#f4d35e' : '#e8eef3', `stroke="${st ? C7.amber : C7.light}" stroke-width="2.5"`);
  d += rect(x, y + 28, 32, 24, '#efe9f7', 6, `stroke="${C7.violet}" stroke-width="2"`);
  if (kind === 'pe') d += circ(x + 16, y + 40, 6.5, st ? '#f0b36d' : C7.blue, `stroke="${st ? C7.amber : C7.ink}" stroke-width="1.5"`);
  else {
    d += circ(x + 8, y + 40, 4, C7.ink) + circ(x + 24, y + 40, 4, C7.ink);
    if (st) d += line(x + 8, y + 40, x + 24, y + 40, C7.ink, 2.5);
  }
  return d;
}

/* легенда вне SVG: items [тип, цвет, подпись] */
const s4legend = (items) => `<div class="legend-lines">${items.map(([k, c, t]) => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true">${k === 'r' ? `<rect x="10" y="0" width="14" height="10" rx="2" fill="#e6a1a1" stroke="${C7.red}" stroke-width="1.5"/>` : `<circle cx="17" cy="5" r="4.2" fill="${c}" stroke="${k === 'o' ? C7.amber : C7.ink}" stroke-width="1.2"/>`}</svg>${esc(t)}</span>`).join('')}</div>`;

/* ---------- Шаг 22: отношение и размер пула ---------- */
W.s4_nad = ({S, s, set, out, onGroup, onRange}) => {
  s.mode ??= 0; s.v ??= 10; s.pool ??= 55; s.vc ??= 10; s.vm ??= 30; s.bn ??= 20; s.bh ??= 60;
  const SC = 3.4, X0 = 190;
  const bar = (y, np, nh, bn, bh, hatch) => {
    let d = rect(X0, y, np * SC, 32, C7.blue, 5) + rect(X0 + np * SC, y, nh * SC, 32, '#f0b36d', 5, `stroke="${C7.amber}" stroke-width="2"`);
    if (hatch) {
      d += rect(X0 + np * SC * (1 - bn), y, np * SC * bn, 32, 'url(#s4h)', 0) + rect(X0 + np * SC + nh * SC * (1 - bh), y, nh * SC * bh, 32, 'url(#s4h)', 0);
    }
    return d;
  };
  const build = () => {
    let c = buttonGroup('n4-mode', S.modes, s.mode, S.modes_label);

    if (s.mode === 1) c += `<div class="controls">${slider('n4-vc', S.sl_vc, 1, 100, s.vc, 1)}${slider('n4-vm', S.sl_vm, 1, 100, s.vm, 1)}</div>`;
    if (s.mode === 2) c += `<div class="controls">${slider('n4-v', S.sl_v, 1, 100, s.v, 1)}${slider('n4-bn', S.sl_bn, 0, 90, s.bn, 5)}${slider('n4-bh', S.sl_bh, 0, 90, s.bh, 5)}</div>`;
    set(S.title, S.status, c);
    onGroup('n4-mode', v => { s.mode = v; build(); });
    const bind = (id, key) => onRange(id, v => { s[key] = v; draw(); });
    if (s.mode === 0) { bind('n4-v', 'v'); bind('n4-pool', 'pool'); }
    if (s.mode === 1) { bind('n4-vc', 'vc'); bind('n4-vm', 'vm'); }
    if (s.mode === 2) { bind('n4-v', 'v'); bind('n4-bn', 'bn'); bind('n4-bh', 'bh'); }
    NET_REDRAW = null; draw();
  };
  const draw = () => {
    let d = '<defs><pattern id="s4h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff" fill-opacity="0.35"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4d6275" stroke-width="3"/></pattern></defs>';
    d += circ(24, 20, 8, C7.blue) + tx(38, 27, S.l_np, F4, 'start') + circ(122, 20, 8, '#f0b36d', `stroke="${C7.amber}" stroke-width="2"`) + tx(136, 27, S.l_nh, F4, 'start');
    let met, rows = [];
    if (s.mode === 0) {
      const a = M8.s4_nad(110, s.v), b = M8.s4_nad(s.pool, s.v);
      rows = [[S.rowA, a], [S.rowB, b]];
      met = [S.mm0[0], f1(a.np), S.mm0[1], f1(b.np), S.mm0[2], num(a.ratio, 2), S.mm0[3], num(a.frac, 2)];
    } else if (s.mode === 1) {
      const a = M8.s4_nad(110, s.vc), b = M8.s4_nad(110, s.vm);
      rows = [[S.rowC, a], [S.rowM, b]];
      met = [S.mm1[0], num(a.ratio, 2), S.mm1[1], num(b.ratio, 2), S.mm1[2], `110 ${S.unit}`, S.mm1[3], `110 ${S.unit}`];
    } else {
      const a = M8.s4_nad(110, s.v), fr = M8.s4_free(a.np, a.nh, s.bn / 100, s.bh / 100);
      rows = [[S.rowT, a, true], [S.rowF, {np: fr.fnp, nh: fr.fnh}]];
      met = [S.mm2[0], num(fr.rTotal, 2), S.mm2[1], fr.rFree == null ? S.na : num(fr.rFree, 2), S.mm2[2], f1(fr.fnp), S.mm2[3], f1(fr.fnh)];
    }
    function f1(x) { return s4f1(x); }
    rows.forEach(([lab, r, hatch], i) => {
      const y = 54 + i * 92;
      d += tx(X0 - 12, y + 24, lab, F4, 'end') + bar(y, r.np, r.nh, s.bn / 100, s.bh / 100, hatch);
      d += tx(X0, y + 62, `${S.l_np} ${f1(r.np)} ${S.unit}; ${S.l_nh} ${f1(r.nh)} ${S.unit}`, F4, 'start');
    });
    if (s.mode === 2) d += rect(250, 8, 18, 18, 'url(#s4h)', 3, `stroke="${C7.gray}" stroke-width="1.5"`) + tx(276, 25, S.l_bound, F4, 'start');
    const H = 54 + rows.length * 92 + 6;
    const mh = [0, 2, 4, 6].map(i => metric(met[i], met[i + 1])).join('');
    out(svg(d, S.title, H, 640, S.notes[s.mode]), `<div class="metrics four">${mh}</div>` + result(`<p>${esc(S.notes[s.mode])}</p>`));
  };
  build();
};

/* ---------- Шаг 27: импульс и длительное воздействие ---------- */
W.s4_damage = ({S, s, set, out, onGroup, onRange}) => {
  s.mode ??= 0; s.r ??= 6;
  set(S.title, S.status, buttonGroup('d4-mode', S.modes, s.mode, S.modes_label) + `<div class="controls">${slider('d4-r', S.sl_r, 1, 10, s.r, 1)}</div>`);
  NET_REDRAW = null;
  const draw = () => {
    const r = s.r / 20, a = 0.4, q = 0.005, tOn = s.mode === 0 ? 8 : 60;
    const m = M8.s4_dyn(a, r, q, tOn);
    const pts = (arr) => arr.map((v, i) => [m.t[i], v * 100]).filter((_, i) => i % 2 === 0);
    const ch = s4plot([{pts: pts(m.x), label: S.s_ox, color: C7.blue}, {pts: pts(m.D), label: S.s_dm, color: '#c3662f', dash: '7 5'}],
      {xm: v => v / 60, xt: [0, 10, 20, 30, 40, 50, 60].map(v => [v, String(v)]), xlabel: S.x_label, ylabel: S.y_label, title: S.chart_title, h: 310});

    let d = '';
    Object.entries(pos).forEach(([k, [x, y]]) => { d += s4cat(x, y, 120, 42, P[k], hi.has(k)); });
    d += `<path d="M550,102 C550,52 70,52 70,100" fill="none" stroke="${C7.gray}" stroke-width="2.5"/>` + `<path d="M70,102 L62,90 L78,90 Z" fill="${C7.gray}"/>`;
    d += tx(310, 56, A.trx, F4, 'middle');
    d += arrow(134, 125, 246, 125, C7.gray, 2.5) + tx(190, 114, A.h2o2, F4, 'middle');
    d += arrow(374, 125, 486, 125, C7.gray, 2.5) + tx(430, 114, A.ds, F4, 'middle');
    d += arrow(310, 148, 310, 210, C7.gray, 2.5) + tx(320, 184, A.ex, F4, 'start');
    d += arrow(374, 235, 486, 235, C7.gray, 2.5);
    d += arrow(262, 210, 282, 150, C7.teal, 2.5) + tx(252, 192, A.srx, F4, 'end');
    d += tx(632, 280, A.irr, F4, 'end');
    let p = box(8, 22, 100, 44, S.pa.nad, {size: F4}) + box(156, 22, 120, 44, S.pa.enz, {size: F4, fill: '#fbe3a6', stroke: C7.amber, sw: 3.5}) + box(324, 12, 310, 64, S.pa.out, {size: F4});
    p += arrow(112, 44, 152, 44, C7.gray, 2.5) + arrow(280, 44, 320, 44, C7.gray, 2.5);
    const key = s.mode === 0 ? (s.r <= 3 ? 'pulse_slow' : 'pulse') : (s.r <= 3 ? 'long_slow' : 'long');
    out(ch + s4cap(S.sc_title) + svg(`<g transform="translate(0,-30)">${d}</g>`, S.sc_title, 262, 640) + s4cap(S.pa_title) + svg(p, S.pa_title, 88, 640),
      `<div class="metrics">${metric(S.mm[0], pct(m.xmax))}${metric(S.mm[1], pct(m.xend))}${metric(S.mm[2], pct(m.Dend))}</div>` +
      result(`<p>${esc(S.notes[key])}</p><p class="quiet">${esc(S.pa_note)}</p>`));
  };
  onGroup('d4-mode', v => { s.mode = v; draw(); });
  onRange('d4-r', v => { s.r = v; draw(); });
  draw();
};

/* ---------- Шаг 28: сенсоры Peredox и HyPer7 ---------- */
W.s4_sensors = ({S, s, set, out, onGroup, onRange, onSelect, onCheck}) => {
  s.k ??= 0; s.ri ??= 3; s.early ??= false; s.ph ??= 2; s.h ??= 3; s.kr ??= 3; s.var ??= 0; s.two ??= false;
  const rv = S.pe_opts.map(t => parseFloat(t.replace(',', '.'))), phv = S.pe_ph_opts.map(t => parseFloat(t.replace(',', '.')));
  const build = () => {
    let c = buttonGroup('s4-k', S.kinds, s.k, S.kinds_label);
    if (s.k === 0) c += `<div class="controls">${select('s4-ri', S.pe_sel, S.pe_opts, s.ri)}${check('s4-early', S.pe_early, s.early)}${select('s4-ph', S.pe_ph, S.pe_ph_opts, s.ph)}</div>`;
    else c += `<div class="controls">${slider('s4-h', S.hy_h, 0, 10, s.h, 0.5)}${slider('s4-kr', S.hy_r, 1, 10, s.kr, 1)}${select('s4-var', S.hy_var, S.hy_vars, s.var)}${check('s4-two', S.hy_two, s.two)}</div>`;
    set(S.title, S.status, c);
    onGroup('s4-k', v => { s.k = v; build(); });
    if (s.k === 0) {
      onSelect('s4-ri', v => { s.ri = v; draw(); }); onCheck('s4-early', v => { s.early = v; draw(); }); onSelect('s4-ph', v => { s.ph = v; draw(); });
    } else {
      onRange('s4-h', v => { s.h = v; draw(); }); onRange('s4-kr', v => { s.kr = v; draw(); }); onSelect('s4-var', v => { s.var = v; draw(); }); onCheck('s4-two', v => { s.two = v; draw(); });
    }
    NET_REDRAW = null; draw();
  };
  const cards = () => `<div class="mini-grid cards4">${S.heads.map((h, i) => `<div class="mini"><h3>${esc(h)}</h3><p>${esc(S.cards[s.k][i])}</p></div>`).join('')}</div>`;
  const draw = () => {
    let d = rect(8, 6, 624, s.k === 0 ? 112 : 216, 'none', 14, `stroke="${C7.light}" stroke-width="2" stroke-dasharray="6 5"`);
    let leg = '';
    let plot, met, note;
    if (s.k === 0) {
      const r = rv[s.ri], pH = phv[s.ph], mm = M8.s4_peredox(r, s.early, pH), n1 = Math.round(mm.f * 10);
      d += tx(20, 32, S.pe_zone, F4, 'start');
      for (let i = 0; i < 10; i++) d += s4unit(40 + i * 52, 46, i < n1 ? 1 : 0, 'pe');
      leg = s4legend([['r', '', S.pe_ref], ['b', C7.blue, `${S.pe_lab_oxd} — ${S.pe_dim}`], ['o', '#f0b36d', `${S.pe_lab_red} — ${S.pe_bright}`]]) + `<p class="quiet">${esc(S.pe_key)}</p>`;
      const logx = v => (Math.log10(v) + 3) / 3, cs = [], pts = (early) => { const a = []; for (let i = 0; i <= 60; i++) { const rr = Math.pow(10, -3 + 3 * i / 60); a.push([rr, 100 * M8.s4_peredox(rr, early, pH).f]); } return a; };
      cs.push({pts: pts(false), color: C7.blue, label: S.pe_c1});
      if (s.early) cs.push({pts: pts(true), color: '#c3662f', dash: '7 5', label: S.pe_c2});
      plot = s4plot(cs, {xm: logx, xt: [[0.001, '0,001'], [0.01, '0,01'], [0.1, '0,1'], [1, '1']], xlabel: S.pe_x, ylabel: S.pe_y, title: S.pe_chart, mark: [r, 100 * mm.f, C7.red]});
      met = [[S.pe_m[0], pct(mm.f)], [S.pe_m[1], num(100 * mm.f, 0) + ' %'.replace(' ', ' ')], [S.pe_m[2], num(mm.re, 3)]];
      note = S.pe_n[s.early && Math.abs(pH - 7.4) > 0.05 ? 1 : 0];
    } else {

/* ---------- Раздел 5 «Объединяем механизмы»: собственные виды схем (код s5) ---------- */
/* Шаг 30: динамика после подавления фермента — учебная модель последовательных процессов первого порядка. */
M8.s5lag = (t, ks) => {
  /* Доля неизрасходованного «избытка» на выходе цепи из n последовательных процессов первого порядка после ступенчатого вмешательства в t = 0.
     S_n(t) = Σ_i exp(−k_i t) Π_{j≠i} k_j / (k_j − k_i). Равные константы разводятся на 0,01 %, чтобы формула не вырождалась. */
  if (t < 0) return 1;
  const k = ks.map((x, i) => x * (1 + 1e-4 * i));
  let sum = 0;
  for (let i = 0; i < k.length; i++) {
    let c = 1;
    for (let j = 0; j < k.length; j++) if (j !== i) c *= k[j] / (k[j] - k[i]);
    sum += c * Math.exp(-k[i] * t);
  }
  return sum;
};

     клетки приближаются к rho последовательно с константами kP, kE и kF. */
  const rho = par.rho[ii], kP = par.kP, kE = par.kE[mi], kF = par.kF, f = n => rho + (1 - rho) * n;
  return {act: t < 0 ? 1 : rho, pool: f(M8.s5lag(t, [kP])), mark: f(M8.s5lag(t, [kP, kE])), func: f(M8.s5lag(t, [kP, kE, kF]))};
};
M8.s5half = (par, mi, stage) => {
  /* время, за которое снижение достигает половины итогового (stage: 0 — активность, 1 — пул, 2 — модификация, 3 — признак) */
  if (stage === 0) return 0;

  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (M8.s5lag(m, ks) > 0.5) lo = m; else hi = m; }
