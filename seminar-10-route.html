<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-10.html">← Вернуться к семинару</a> · <a href="index.html">← Раздел II: семинары</a></p><h1>Стрессовые программы: ISR, UPR, KEAP1–NRF2 и HIF</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-isr"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 1 из 30</div><h2>Как разные воздействия сходятся на eIF2α</h2><p class="lead"><a href="#ns-g-S10-T01">Интегрированный стрессовый ответ</a> (ISR) — система регуляции трансляции, в которой разные воздействия сходятся на одной модификации: фосфорилировании остатка Ser51 в α-субъединице фактора инициации eIF2. Поэтому ответы на недостаток аминокислот, стресс ЭПР, вирусную РНК и недостаток гема имеют общее звено, хотя запускаются разными киназами.</p><ol class="mech"><li>У млекопитающих четыре киназы — <a href="#ns-g-S10-T15">GCN2</a>, <a href="#ns-g-S10-T16">PERK</a>, <a href="#ns-g-S10-T17">PKR</a> и <a href="#ns-g-S10-T18">HRI</a> — фосфорилируют Ser51 <a href="#ns-g-S10-T08">eIF2α</a>.</li><li>eIF2 с фосфорилированной α-субъединицей подавляет обменную активность <a href="#ns-g-S10-T09">eIF2B</a>, и доступность тройного комплекса для инициации трансляции уменьшается.</li><li>Общий узел не означает одинакового ответа: исход зависит от силы и длительности воздействия и от других путей, которые оно активирует.</li></ol><p>Синтез белка начинается с инициации трансляции: малая субъединица рибосомы с инициаторной метионил-тРНК находит старт-кодон мРНК. Метионил-тРНК доставляет <a href="#ns-g-S10-T07">фактор инициации eIF2</a> в GTP-связанной форме. ISR изменяет именно этот этап. Поэтому ISR определяют не через «стресс вообще», а через конкретное молекулярное событие — фосфорилирование eIF2α по Ser51.</p><p>Это событие катализируют четыре киназы, каждая из которых воспринимает свой сигнал. GCN2 активируется незаряженными тРНК, которые накапливаются при недостатке аминокислот. PERK — трансмембранная киназа ЭПР; её активирует накопление неправильно свёрнутых белков в просвете ЭПР. PKR активируется двухцепочечной РНК, которая появляется при репликации многих вирусов. HRI связана с доступностью гема, а также с некоторыми другими воздействиями, в том числе с нарушением работы митохондрий. Соответствие «сигнал — киназа» описывает канонические условия: одно воздействие может активировать больше одной киназы.</p><p>Через PERK ISR пересекается с <a href="#ns-g-S10-T02">ответом на неправильно свёрнутые белки</a> (UPR). Но PERK — лишь одна из трёх ветвей UPR, а нарушение сворачивания в ЭПР — лишь один из входов ISR. Две другие ветви UPR, IRE1α и ATF6, фосфорилирование eIF2α не используют; GCN2, PKR и HRI фосфорилируют eIF2α без участия ЭПР.</p><p>Общий узел возник в эволюции рано. У пекарских дрожжей есть одна киназа eIF2α — Gcn2, связанная с недостатком аминокислот; у млекопитающих киназ четыре, и они воспринимают разные сигналы. Из сходства узла не следует, что вся сеть регуляторов у дрожжей и человека одинакова.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое нарушение работы ЭПР обязательно запускает ISR, а любой ISR — это ответ ЭПР.<p class="trap-fix">ЭПР связан с ISR только через PERK. Другие киназы фосфорилируют eIF2α без участия ЭПР, а ветви UPR IRE1α и ATF6 действуют без фосфорилирования eIF2α.</p></div><div class="static-quiz"><h3>Какое звено является общим для канонического ответа, запускаемого GCN2, PERK, PKR и HRI у млекопитающих?</h3><ol><li><b>А.</b> Удаление интрона из мРНК XBP1. <i>(неверный вариант)</i><br><span class="expl">Это выход РНКазной активности IRE1, а не общий выход четырёх eIF2α-киназ.</span></li><li><b>Б.</b> Расщепление мембранного белка ATF6 в аппарате Гольджи. <i>(неверный вариант)</i><br><span class="expl">Так активируется отдельная ветвь UPR; этот процесс не является общим этапом ISR.</span></li><li><b>В.</b> Фосфорилирование Ser51 в α-субъединице eIF2. <i>(верный вариант)</i><br><span class="expl">Все четыре киназы сходятся на этой модификации; дальнейший ответ зависит также от других регуляторов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aat5314">Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.</a></li><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1016/j.jbc.2024.107151">Ryoo H.D. The integrated stress response in metabolic adaptation. J Biol Chem. 2024.</a></li></ul><p>Схема механизма для клеток млекопитающих; состояния качественные. Соответствие воздействия и киназы приведено для канонических условий (обзоры Costa-Mattioli 2020, Wek 2023, Ryoo 2024); в конкретной клетке одно воздействие может активировать несколько киназ. Сравнение с дрожжами Saccharomyces cerevisiae (одна киназа Gcn2) не означает одинакового состава всей регуляторной сети.</p></details></article><article class="card print-unit" id="ns-eif2b"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 2 из 30</div><h2>Почему фосфорилирование eIF2α снижает общую трансляцию</h2><p class="lead">Для каждой новой инициации трансляции eIF2 должен снова связать GTP. Этот обмен нуклеотидов катализирует <a href="#ns-g-S10-T09">eIF2B</a>, и именно eIF2B подавляется, когда α-субъединица eIF2 фосфорилирована.</p><ol class="mech"><li><a href="#ns-g-S10-T07">eIF2</a> в GTP-связанной форме присоединяет <a href="#ns-g-S10-T11">инициаторную метионил-тРНК</a> и образует <a href="#ns-g-S10-T10">тройной комплекс</a> eIF2·GTP·Met-тРНКi.</li><li>После узнавания старт-кодона из комплекса выходит фосфат, образовавшийся при гидролизе GTP, и eIF2·GDP покидает рибосому; для нового цикла GDP должен быть заменён на GTP с участием eIF2B.</li><li><a href="#ns-g-S10-T08">eIF2(αP)</a> связывается с eIF2B прочнее, чем немодифицированный eIF2, и подавляет его обменную активность; тройного комплекса образуется меньше.</li></ol><p>Каноническая инициация трансляции у эукариот начинается с тройного комплекса: eIF2, связанный с GTP, присоединяет инициаторную метионил-тРНК (Met-тРНКi). Вместе с другими факторами инициации тройной комплекс связывается с малой субъединицей рибосомы (40S), и она просматривает 5′-область мРНК в поисках старт-кодона. Распознавание старт-кодона сопровождается высвобождением неорганического фосфата, образовавшегося при гидролизе GTP. После этого eIF2·GDP покидает рибосому, и к малой субъединице присоединяется большая.</p><p>eIF2·GDP не способен связать новую Met-тРНКi. Чтобы eIF2 снова участвовал в инициации, связанный GDP должен быть заменён на GTP. Сам eIF2 освобождает GDP медленно; обмен ускоряет <a href="#ns-g-S10-T09">фактор обмена гуаниновых нуклеотидов eIF2B</a> — крупный комплекс из двух копий пяти типов субъединиц. eIF2B не фосфорилирует GDP и не синтезирует GTP: он способствует освобождению GDP, после чего eIF2 связывает GTP из цитозоля.</p><p>Фосфорилирование Ser51 изменяет взаимодействие eIF2 с eIF2B. eIF2(αP) связывается с eIF2B прочнее немодифицированного eIF2 и, по структурным и биохимическим данным, переводит eIF2B в конформацию с низкой обменной активностью. Поэтому прежнее описание eIF2(αP) как простого конкурентного ингибитора считают неполным. Молекул eIF2B в клетке значительно меньше, чем молекул eIF2, и фосфорилирования даже небольшой части eIF2 достаточно, чтобы заметно замедлить обмен. В результате тройного комплекса образуется меньше, и инициация трансляции большинства мРНК замедляется.</p><p>Важно различать содержание eIF2B и его активность. В показанном случае количество eIF2B не меняется: уменьшается скорость катализируемого им обмена. Насколько снижается общий синтез белка, зависит от доли eIF2(αP), типа клеток и воздействия, поэтому одного универсального значения в процентах нет. Малая молекула ISRIB действует именно на этом звене: связываясь с eIF2B, она уменьшает его чувствительность к eIF2(αP), но не изменяет фосфорилирование eIF2α.</p><div class="note trap"><strong>Типичная ошибка</strong> eIF2B — это киназа, которая превращает GDP в GTP, а при ISR количество eIF2B в клетке уменьшается.<p class="trap-fix">eIF2B — фактор обмена нуклеотидов: он ускоряет освобождение GDP из eIF2, после чего eIF2 связывает GTP. При ISR количество eIF2B может оставаться прежним; снижается его обменная активность под действием eIF2(αP).</p></div><div class="static-quiz"><h3>Содержание eIF2B не изменилось, но его обменная активность уменьшилась вследствие связывания eIF2(αP). Какое непосредственное следствие ожидается?</h3><ol><li><b>А.</b> Доступность eIF2·GTP·Met-тРНКi уменьшится. <i>(верный вариант)</i><br><span class="expl">При замедленном обмене меньше eIF2 возвращается в GTP-связанную форму, способную образовать тройной комплекс.</span></li><li><b>Б.</b> Образование тройного комплекса ускорится. <i>(неверный вариант)</i><br><span class="expl">Обмен GDP на GTP необходим для повторного образования комплекса; подавление обмена не ускоряет этот процесс.</span></li><li><b>В.</b> Образование тройного комплекса сохранится, поскольку общее содержание eIF2B не изменилось. <i>(неверный вариант)</i><br><span class="expl">Содержание комплекса не задаёт его обменную активность; при её подавлении образование тройного комплекса может уменьшиться.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aat5314">Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.</a></li><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.7554/eLife.65703">Schoof M. et al. eIF2B conformation and assembly state regulate the integrated stress response. eLife. 2021;10:e65703.</a></li><li><a href="https://doi.org/10.1073/pnas.1815767116">Rabouw H. H. et al. Small molecule ISRIB suppresses the integrated stress response within a defined window of activation. Proc Natl Acad Sci U S A. 2019;116:2097–2102.</a></li></ul><p>Схема механизма, качественные состояния; клетки млекопитающих. Подавление eIF2B описано по обзору Wek 2023 (полный текст) и работе Schoof 2021 (очищенные белки и клетки человека; прочитаны тематические фрагменты об аллостерическом подавлении eIF2B и действии ISRIB). Состояние с ISRIB относится к умеренному ISR: при высокой доле eIF2(αP) ISRIB перестаёт восстанавливать трансляцию (Rabouw 2019: клеточные линии, заражение пикорнавирусами, poly(I:C) и арсенит; прочитана аннотация). Слова «высокая», «снижена» на схеме не являются измерениями.</p></details></article><article class="card print-unit" id="ns-atf4-uorf"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 3 из 30</div><h2>Как уменьшение доступности тройного комплекса усиливает трансляцию ATF4</h2><p class="lead">При ISR трансляция большинства мРНК замедляется, а синтез ATF4 усиливается. Причина — устройство 5′-области мРНК <a href="#ns-g-S10-T14">ATF4</a>: две короткие <a href="#ns-g-S10-T12">рамки uORF</a> с разными ролями и <a href="#ns-g-S10-T13">повторная инициация</a> после первой из них.</p><ol class="mech"><li>После трансляции короткой uORF1 малая субъединица рибосомы остаётся на мРНК и продолжает сканирование, но для новой инициации ей нужен новый <a href="#ns-g-S10-T10">тройной комплекс</a>.</li><li>Если тройного комплекса достаточно, субъединица присоединяет его до старт-кодона uORF2. uORF2 перекрывает начало рамки ATF4 в другой рамке считывания, и после её трансляции рибосома оказывается за стартом ATF4.</li><li>Если тройного комплекса меньше, часть субъединиц присоединяет его уже после старт-кодона uORF2 и начинает трансляцию на старт-кодоне ATF4.</li></ol><p>В 5′-области мРНК ATF4 млекопитающих перед основной рамкой считывания находятся две короткие открытые рамки. uORF1, ближайшая к 5′-концу, кодирует пептид из трёх аминокислот. uORF2 начинается дальше, а заканчивается уже за старт-кодоном ATF4, причём в другой рамке считывания: она перекрывает начало кодирующей области ATF4. Рибосома, транслирующая uORF2, не может начать синтез ATF4 — она проходит его старт-кодон, считывая другую рамку.</p><p>Малая субъединица рибосомы с тройным комплексом связывается у 5′-конца мРНК и начинает трансляцию на uORF1. После завершения этой короткой рамки малая субъединица часто не отделяется от мРНК и продолжает сканирование. Met-тРНКi уже израсходована, поэтому для следующей инициации субъединица должна заново присоединить тройной комплекс. Без стресса тройного комплекса много, он присоединяется быстро, и ближайшим старт-кодоном оказывается старт uORF2. Рибосома транслирует uORF2, завершает трансляцию за стартом ATF4 и отделяется от мРНК; синтез ATF4 остаётся низким.</p><p>При умеренном ISR доля eIF2(αP) возрастает, обмен на eIF2B замедляется, и тройного комплекса становится меньше. Сканирующей субъединице требуется больше времени, чтобы снова его присоединить. За это время часть субъединиц проходит старт uORF2 без инициации и присоединяет тройной комплекс уже между стартом uORF2 и стартом ATF4. Эти субъединицы начинают трансляцию ATF4. Количество мРНК ATF4 при этом может не меняться: усиливается её трансляция. Такую модель задержанной повторной инициации предложили Vattem и Wek (2004) по экспериментам с мРНК ATF4 мыши; сходный механизм у дрожжей регулирует трансляцию мРНК GCN4.</p><p>У механизма есть границы. Предполагают, что при очень сильном снижении доступности тройного комплекса уменьшается и число малых субъединиц, начинающих сканирование мРНК, поэтому синтез ATF4 не возрастает беспредельно с ростом доли eIF2(αP). Кроме того, uORF имеются во многих мРНК, но избирательную трансляцию при стрессе обеспечивают лишь некоторые из них: значение имеют положение, длина uORF и окружение их старт-кодонов.</p><div class="note trap"><strong>Типичная ошибка</strong> При ISR синтез ATF4 возрастает потому, что усиливается транскрипция гена ATF4.<p class="trap-fix">Канонический механизм — трансляционный: при неизменном количестве мРНК ATF4 изменяется место повторной инициации после uORF1. Изменения транскрипции ATF4 в отдельных условиях возможны, но они не объясняют, почему синтез ATF4 растёт, когда общая трансляция подавлена.</p></div><div class="static-quiz"><h3>Количество мРНК ATF4 не изменилось. При умеренном ISR повторное присоединение тройного комплекса после uORF1 замедлилось. Как это может усилить синтез ATF4?</h3><ol><li><b>А.</b> Реинициация на uORF2 усиливается, и те же рибосомы после её трансляции переходят к старту ATF4. <i>(неверный вариант)</i><br><span class="expl">В канонической схеме uORF2 перекрывает старт основной рамки ATF4. После трансляции uORF2 рибосома оказывается за этим стартом; усиление использования uORF2 не объясняет усиление трансляции ATF4.</span></li><li><b>Б.</b> Торможение общей трансляции одинаково усиливает использование всех стартов на мРНК ATF4. <i>(неверный вариант)</i><br><span class="expl">Разные старты не отвечают одинаково: значение имеют их положение и момент повторного присоединения тройного комплекса.</span></li><li><b>В.</b> Часть сканирующих субчастиц проходит старт uORF2 и повторно инициирует на ATF4. <i>(верный вариант)</i><br><span class="expl">Позднее присоединение тройного комплекса уменьшает использование ингибирующей uORF2 и позволяет использовать старт ATF4.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1073/pnas.0400541101">Vattem KM., Wek RC. Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells. Proc Natl Acad Sci U S A. 2004;101:11269–74.</a></li><li><a href="https://doi.org/10.1083/jcb.200408003">Lu PD. et al. Translation reinitiation at alternative open reading frames regulates gene expression in an integrated stress response. J Cell Biol. 2004;167:27–33.</a></li></ul><p>Схема механизма; каноническое устройство 5′-области мРНК ATF4 мыши и человека. Количество мРНК в схеме постоянно. Модель задержанной повторной инициации — Vattem и Wek 2004 (мРНК ATF4 мыши, клетки млекопитающих и репортёрные конструкции; прочитана аннотация) и Lu 2004 (библиографическая запись); полный текст — обзор Wek 2023. Длины рамок и расстояния на схеме условные; соотношения субъединиц, начинающих трансляцию на разных стартах, показаны качественно. Утверждение о спаде синтеза ATF4 при очень сильном дефиците тройного комплекса — предположение обзора, а не измерение.</p></details></article><article class="card print-unit" id="ns-isr-feedback"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 4 из 30</div><h2>Как GADD34 и CReP ограничивают фосфорилирование eIF2α</h2><p class="lead">ATF4 изменяет транскрипцию многих генов, в том числе гена <a href="#ns-g-S10-T19">GADD34</a> — регуляторной субъединицы фосфатазы. Так возникает отрицательная обратная связь: доля eIF2(αP) снижается, и инициация трансляции возобновляется.</p><ol class="mech"><li><a href="#ns-g-S10-T14">ATF4</a> действует в ядре как транскрипционный фактор: усиливает транскрипцию генов синтеза и переноса аминокислот (например, ASNS) и гена GADD34.</li><li>GADD34 и <a href="#ns-g-S10-T20">CReP</a> — регуляторные субъединицы, которые направляют каталитическую субъединицу <a href="#ns-g-S10-T21">PP1</a> к eIF2(αP); комплекс отщепляет фосфат от Ser51.</li><li>Доля eIF2(αP) определяется соотношением фосфорилирования и дефосфорилирования; когда она снижается, обменная активность eIF2B и инициация трансляции восстанавливаются.</li></ol><p>Важно различать регуляцию синтеза ATF4 и действие уже синтезированного белка. Синтез самого ATF4 регулируется при трансляции его мРНК (предыдущий шаг). Синтезированный ATF4 действует уже как транскрипционный фактор: перемещается в ядро и вместе с белками-партнёрами связывается с регуляторными участками генов. Среди его мишеней — гены синтеза и переноса аминокислот, например ген аспарагинсинтетазы ASNS, гены других транскрипционных факторов (CHOP, ATF5) и гены белков обратной связи.</p><p>Один из белков обратной связи — GADD34 (продукт гена PPP1R15A). Собственной фосфатазной активности у GADD34 нет: он связывает каталитическую субъединицу протеинфосфатазы 1 (PP1) и направляет её к eIF2(αP). Novoa и соавт. (2001) показали, что комплекс GADD34 с PP1 дефосфорилирует eIF2α in vitro, а при избытке GADD34 в клетках доля eIF2(αP) снижалась, хотя активность киназ PERK и GCN2 не изменялась. Образование GADD34 зависит от стресса: в клетках без PERK или GCN2 при соответствующем воздействии GADD34 не появлялся. мРНК GADD34 к тому же транслируется избирательно при повышенной доле eIF2(αP).</p><p>Вторая регуляторная субъединица, CReP (PPP1R15B), образуется постоянно и обеспечивает фоновое дефосфорилирование eIF2α. При подавлении CReP методом РНК-интерференции фосфорилирование eIF2α возрастало и ISR активировался без внешнего воздействия (Jousse 2003). Следовательно, доля eIF2(αP) в каждый момент — результат двух противоположных процессов: фосфорилирования киназами и дефосфорилирования комплексами PP1 с GADD34 или CReP.</p><p>Обратная связь через GADD34 срабатывает с задержкой: сначала должны образоваться ATF4, затем мРНК и белок GADD34. Поэтому в начале ответа доля eIF2(αP) высока, а позже, при той же активности киназ, снижается, и синтез белка частично возобновляется. Если нарушение сохраняется, обратная связь не устраняет его причину: киназы продолжают фосфорилировать eIF2α.</p><div class="note trap"><strong>Типичная ошибка</strong> Обратная связь через GADD34 сразу и полностью прекращает ISR, даже если вызвавшее его нарушение сохраняется.<p class="trap-fix">GADD34 образуется с задержкой и ускоряет дефосфорилирование eIF2α, но не устраняет причину стресса. При продолжающемся воздействии киназы остаются активными, поэтому фосфорилирование eIF2α и часть ответа сохраняются.</p></div><div class="static-quiz"><h3>При одинаковой активности киназ усилилось направляемое GADD34 дефосфорилирование eIF2α. Какое изменение соответствует отрицательной обратной связи ISR?</h3><ol><li><b>А.</b> Доля eIF2(αP) остаётся прежней, поскольку активность киназ не изменилась. <i>(неверный вариант)</i><br><span class="expl">Доля модифицированного белка зависит от соотношения фосфорилирования и дефосфорилирования, а не только от активности киназ.</span></li><li><b>Б.</b> Общая инициация снижается дальше из-за усиления подавления eIF2B. <i>(неверный вариант)</i><br><span class="expl">Дефосфорилирование eIF2α ослабляет, а не усиливает подавление eIF2B в показанной петле.</span></li><li><b>В.</b> Доля eIF2(αP) уменьшается, что способствует восстановлению инициации. <i>(верный вариант)</i><br><span class="expl">PP1 в комплексе с регуляторной субъединицей удаляет фосфат с eIF2α и ослабляет подавление eIF2B.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1016/j.jbc.2024.107151">Ryoo H.D. The integrated stress response in metabolic adaptation. J Biol Chem. 2024.</a></li><li><a href="https://doi.org/10.1083/jcb.153.5.1011">Novoa I. et al. Feedback inhibition of the unfolded protein response by GADD34-mediated dephosphorylation of eIF2alpha. J Cell Biol. 2001;153:1011–22.</a></li><li><a href="https://doi.org/10.1083/jcb.200308075">Jousse C. et al. Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells. J Cell Biol. 2003;163:767–75.</a></li></ul><p>Схема механизма, качественные состояния «раньше» и «позже» при одинаковой активности киназы; клетки млекопитающих. Novoa 2001 — клетки CHO и мышиные клетки без PERK или GCN2; стресс ЭПР и отсутствие аминокислот; избыточная экспрессия C-концевого фрагмента GADD34 (прочитана аннотация). Jousse 2003 — подавление CReP РНК-интерференцией в культуре клеток (прочитана аннотация). Обзоры Wek 2023 и Ryoo 2024 — полные тексты. Временная шкала не задана: «раньше» и «позже» обозначают порядок событий. ASNS и переносчики аминокислот приведены как примеры мишеней ATF4 (Wek 2023).</p></details></article><article class="card print-unit" id="ns-isr-outcomes"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 5 из 30</div><h2>Почему длительный ISR не означает неизбежной гибели клетки</h2><p class="lead">ISR — не программа гибели клетки. Его исход зависит от того, устранено ли вызвавшее его нарушение, насколько сильным и долгим был ответ и в какой клетке он идёт.</p><ol class="mech"><li>Раннее снижение общей трансляции уменьшает поступление новых полипептидов, в том числе в ЭПР, и уменьшает расход аминокислот на синтез белка.</li><li>ATF4 и связанные с ним регуляторы изменяют экспрессию генов синтеза и переноса аминокислот, обратной связи и других адаптационных процессов.</li><li>При длительном неустранённом нарушении часть выходов ISR, в том числе зависимых от <a href="#ns-g-S10-T22">CHOP</a>, может способствовать гибели клетки; само по себе содержание CHOP исход не определяет.</li></ol><p>Первое следствие ISR — замедление инициации трансляции большинства мРНК. В клетке со стрессом ЭПР это означает, что в просвет ЭПР поступает меньше новых полипептидов, которые нужно свернуть. В клетке с недостатком аминокислот на синтез белка расходуется меньше аминокислот. Одновременно избирательно транслируется мРНК ATF4, и ATF4 усиливает транскрипцию генов синтеза и переноса аминокислот, гена GADD34 и генов других транскрипционных факторов, например CHOP.</p><p>Если нарушение устранено — аминокислоты вернулись в среду, белки в ЭПР свернулись, — киназы eIF2α перестают активироваться. Комплексы PP1 с CReP и GADD34 дефосфорилируют eIF2α, обменная активность eIF2B восстанавливается, и трансляция возвращается к исходной. Белки, синтезированные во время ответа, ещё некоторое время сохраняются в клетке. В этом случае ISR завершается адаптацией.</p><p>Если нарушение сохраняется долго, состояние клетки меняется. Ось ATF4–CHOP–GADD34 возобновляет синтез белка, но при хронической активации ISR может способствовать гибели клетки (Ryoo 2024). <a href="#ns-g-S10-T22">CHOP (DDIT3)</a> — транскрипционный регулятор, который вместе с ATF4 изменяет экспрессию многих генов, в том числе генов, способствующих апоптозу. Однако повышенное содержание CHOP показывает лишь, что ISR активен давно или сильно, а не то, что клетка уже погибла или обязательно погибнет. Исход зависит от типа клеток, силы и длительности воздействия и от других сигнальных путей.</p><p>Отклонения в обе стороны связаны с болезнями. У мышей без PERK и у людей с мутациями её гена секреторные β-клетки поджелудочной железы не снижают синтез белка в ответ на стресс ЭПР, и уже в раннем возрасте развивается сахарный диабет. С диабетом связывают и мутацию, нарушающую CReP: β-клетки без CReP при постоянно повышенном фосфорилировании eIF2α легче вступают в апоптоз. Нормальной работе β-клеток нужен ответ, соответствующий нарушению, а не максимальный или нулевой.</p><div class="note trap"><strong>Типичная ошибка</strong> Длительный ISR всегда приводит клетку к гибели, а CHOP — однозначный признак уже погибшей клетки.<p class="trap-fix">ISR прежде всего обеспечивает адаптацию. При длительном неустранённом нарушении вклад механизмов, способствующих гибели, возрастает, но исход зависит от клетки, силы и длительности воздействия; CHOP — регулятор, а не показатель завершённого апоптоза.</p></div><div class="static-quiz"><h3>В клетке длительно повышено содержание CHOP. Достаточно ли этого признака, чтобы утверждать, что клетка уже погибла?</h3><ol><li><b>А.</b> Нет: CHOP может участвовать в ответе, но исход зависит от дополнительных условий. <i>(верный вариант)</i><br><span class="expl">Роль CHOP зависит от типа клеток и от того, сохраняется ли нарушение; один белок не определяет весь исход.</span></li><li><b>Б.</b> Да: образование CHOP само по себе равнозначно завершённому апоптозу. <i>(неверный вариант)</i><br><span class="expl">Регуляторный белок и исход клеточного процесса — разные уровни описания; его наличие не устанавливает факт гибели.</span></li><li><b>В.</b> Нет: CHOP регулирует только адаптацию и не может способствовать гибели. <i>(неверный вариант)</i><br><span class="expl">Отсутствие однозначного прогноза не означает отсутствия вклада CHOP в механизмы, способствующие гибели.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aat5314">Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.</a></li><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1016/j.jbc.2024.107151">Ryoo H.D. The integrated stress response in metabolic adaptation. J Biol Chem. 2024.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li></ul><p>Схема механизма, качественные состояния «раньше / позже»; обобщение по обзорам Costa-Mattioli 2020, Wek 2023, Ryoo 2024 (полные тексты) и Acosta-Alvear 2025. Количественный прогноз выживаемости и время начала апоптоза не задаются: они различаются для разных клеток и воздействий. Примеры с PERK и CReP — мыши без PERK, больные с синдромом Уолкотта–Раллисона и наблюдения на β-клетках, описанные в обзоре Costa-Mattioli 2020; выводов о лечении из них не следует.</p></details></article><article class="card print-unit" id="ns-isr-inputs"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 6 из 30</div><h2>Почему отсутствие PERK не устраняет все пути ISR</h2><p class="lead">Отсутствие одной киназы eIF2α выключает лишь один вход ISR. Другие киназы по-прежнему фосфорилируют тот же Ser51, если активирован их собственный сигнал.</p><ol class="mech"><li><a href="#ns-g-S10-T16">PERK</a> передаёт к eIF2α сигнал о нарушении сворачивания белков в ЭПР; без PERK этот вход нарушен.</li><li><a href="#ns-g-S10-T15">GCN2</a>, <a href="#ns-g-S10-T17">PKR</a> и <a href="#ns-g-S10-T18">HRI</a> фосфорилируют eIF2α независимо от PERK, когда активированы своими сигналами.</li><li>При нарушении работы митохондрий протеаза OMA1 расщепляет белок DELE1; фрагмент DELE1 выходит в цитозоль, связывается с HRI и активирует её.</li></ol><p>Четыре киназы eIF2α воспринимают разные сигналы, но действуют на общий субстрат. Поэтому выключение одной киназы — не то же самое, что выключение ISR. В клетках мыши без PERK накопление неправильно свёрнутых белков в ЭПР не вызывало фосфорилирования eIF2α, синтез белка оставался высоким, а клетки хуже переживали стресс ЭПР (Harding 2000). Если же в клетках без PERK активировать PKR двухцепочечной РНК, PKR фосфорилирует eIF2α, и дальнейшие события — подавление eIF2B, снижение общей трансляции и синтез ATF4 — развиваются так же, как при активации PERK.</p><p>Такое сравнение называют генетическим: клетки, различающиеся одним геном, подвергают отдельным воздействиям и определяют один и тот же показатель — фосфорилирование eIF2α. Вывод корректен, если остальные киназы и сам eIF2α сохранены, а каждое воздействие активирует известную киназу. На схеме сопоставлены исходные клетки и клетки без PERK при трёх воздействиях.</p><p>Значение отдельного входа видно и у человека. Мутации гена EIF2AK3, кодирующего PERK, вызывают синдром Уолкотта–Раллисона — редкое аутосомно-рецессивное заболевание, при котором сахарный диабет развивается в первые месяцы жизни, а позже появляются нарушения развития скелета (Delépine 2000). Синдром связывают с утратой именно PERK-зависимого входа в секреторных клетках, прежде всего в β-клетках поджелудочной железы, а не с утратой всех стрессовых ответов.</p><p>Перечень входов ISR не ограничен каноническими сигналами. Guo и соавт. (2020) показали на клетках человека, что при нарушении работы митохондрий митохондриальная протеаза OMA1 расщепляет белок DELE1, связанный с внутренней мембраной. Фрагмент DELE1 накапливается в цитозоле, связывается с HRI и активирует её, а HRI фосфорилирует eIF2α. Так состояние митохондрий (семинар 9) влияет на трансляцию в цитозоле. Этот путь не следует отождествлять с ответами, которые регулируют сворачивание белков внутри самих митохондрий.</p><div class="note trap"><strong>Типичная ошибка</strong> HRI отвечает только на недостаток гема, поэтому нарушение работы митохондрий на ISR не влияет.<p class="trap-fix">HRI активируется и другими воздействиями. При нарушении работы митохондрий OMA1 расщепляет DELE1, фрагмент DELE1 в цитозоле связывается с HRI и активирует её, и eIF2α фосфорилируется без участия PERK.</p></div><div class="static-quiz"><h3>В клетках отсутствует PERK, но PKR и eIF2α сохранены. Воздействие двухцепочечной РНК активировало PKR. Может ли при этих условиях повыситься фосфорилирование eIF2α?</h3><ol><li><b>А.</b> Нет: фосфорилировать eIF2α способна только PERK. <i>(неверный вариант)</i><br><span class="expl">PERK — одна из четырёх киназ этого субстрата; PKR создаёт независимый вход.</span></li><li><b>Б.</b> Нет: PKR может действовать на eIF2α только через предварительную активацию PERK. <i>(неверный вариант)</i><br><span class="expl">PKR сама является киназой eIF2α; PERK не является обязательным промежуточным звеном этого пути.</span></li><li><b>В.</b> Да: активная PKR может фосфорилировать сохранённый eIF2α. <i>(верный вариант)</i><br><span class="expl">Потеря одной киназы не устраняет путь от другой активной киназы к общему субстрату.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aat5314">Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.</a></li><li><a href="https://doi.org/10.1016/s1097-2765(00)80330-5">Harding H. P., Zhang Y., Bertolotti A., Zeng H., Ron D. Perk is essential for translational regulation and cell survival during the unfolded protein response. Mol Cell. 2000;5:897–904.</a></li><li><a href="https://doi.org/10.1038/s41586-020-2078-2">Guo X. et al. Mitochondrial stress is relayed to the cytosol by an OMA1-DELE1-HRI pathway. Nature. 2020;579:427–432.</a></li><li><a href="https://doi.org/10.1038/78085">Delépine M. et al. EIF2AK3, encoding translation initiation factor 2-alpha kinase 3, is mutated in patients with Wolcott-Rallison syndrome. Nat Genet. 2000;25:406–9.</a></li></ul><p>Схема генетического сравнения, качественные состояния; клетки млекопитающих, в которых остальные киназы и eIF2α сохранены; каждое воздействие задано как активирующее известную киназу (двухцепочечная РНК — PKR). Harding 2000 — эмбриональные клетки мыши с мутацией гена PERK, туникамицин (прочитана аннотация). Guo 2020 — клетки человека, нарушение работы митохондрий, скрининг CRISPRi (прочитана аннотация); обзор Wek 2023 — полный текст. Delépine 2000 — две семьи с синдромом Уолкотта–Раллисона, мутации EIF2AK3 (прочитана аннотация); выводов о лечении не делается.</p></details></article><article class="card print-unit" id="ns-isr-measure"><div class="eyebrow">ISR: eIF2α и ATF4 · шаг 7 из 30</div><h2>Как различить фосфорилирование eIF2α и изменение трансляции</h2><p class="lead">Фосфорилирование eIF2α, общий синтез белка и трансляция мРНК ATF4 — три разные величины. Каждую измеряют своим методом, и по одной из них нельзя заключить о другой.</p><ol class="mech"><li>Иммуноблот показывает содержание определённой формы белка — eIF2α с фосфорилированным Ser51 — в сравнении с общим eIF2α.</li><li>Кратковременное мечение новосинтезируемых белков характеризует общий синтез белка за выбранный интервал.</li><li>Репортёр с 5′-областью мРНК ATF4, полисомное и рибосомное профилирование показывают изменение трансляции определённых мРНК, если количество этих мРНК проконтролировано.</li></ol><h3>Фосфорилирование и общий синтез белка</h3><p>Фосфорилирование eIF2α определяют иммуноблотом. Белки клеточного лизата разделяют по размеру, переносят на мембрану и выявляют антителами к eIF2α с фосфорилированным Ser51 и к общему eIF2α. Сравнение двух сигналов при одинаковой загрузке показывает, как изменилась доля <a href="#ns-g-S10-T08">eIF2(αP)</a>; абсолютную долю без калибровки так не определить, а о скорости трансляции блот прямо не говорит. Общий синтез белка оценивают кратковременным мечением: клетки на короткое время переносят в среду с меченым метионином (радиоактивным или его химическим аналогом), затем определяют метку в белковой фракции. Метка отражает синтез за выбранный интервал, а не всё накопленное количество белка.</p><h3>Трансляция отдельных мРНК</h3><p>Репортёрная конструкция содержит 5′-область мРНК ATF4 перед последовательностью легко измеряемого белка, например люциферазы. Сигнал репортёра сравнивают при одинаковом количестве репортёрной мРНК и с вариантами, в которых изменён старт-кодон одной из uORF. Полисомное профилирование разделяет в градиенте плотности сахарозы свободные субъединицы, мРНК с одной рибосомой и полисомы — мРНК с несколькими рибосомами. При подавлении инициации доля полисом уменьшается. Рибосомное профилирование (Ribo-seq) устроено иначе: рибосома защищает от нуклеазы участок мРНК около 30 нуклеотидов, защищённые фрагменты секвенируют и по их положению видят, какие рамки транслируются — uORF или основная рамка.</p><h3>Пример: действие ISRIB</h3><p>При умеренном ISR <a href="#ns-g-S10-T23">ISRIB</a> восстанавливает общий синтез белка и снижает избирательный синтез ATF4, хотя сигнал фосфорилированного eIF2α на иммуноблоте почти не меняется. Это не противоречие: ISRIB связывается с eIF2B и уменьшает его чувствительность к eIF2(αP), а не действует на киназы или фосфатазы. При высокой доле eIF2(αP) эффект ISRIB пропадает (Rabouw 2019). Поэтому образцы «контроль», «стресс» и «стресс + ISRIB» сравнивают при одном сроке воздействия и одним набором методов.</p><div class="note trap"><strong>Типичная ошибка</strong> Полисомное профилирование и рибосомное профилирование — два названия одного метода.<p class="trap-fix">Полисомное профилирование разделяет мРНК по числу связанных рибосом в градиенте плотности. Рибосомное профилирование определяет секвенированием положение защищённых рибосомой фрагментов на мРНК и поэтому показывает, транслируется ли uORF или основная рамка.</p></div><div class="static-quiz"><h3>При умеренном ISR добавление ISRIB восстановило общую трансляцию, а сигнал p-eIF2α на иммуноблоте существенно не изменился. Какое объяснение согласуется с механизмом действия ISRIB?</h3><ol><li><b>А.</b> ISRIB непосредственно удалил фосфат с каждой молекулы eIF2α. <i>(неверный вариант)</i><br><span class="expl">Такой механизм не согласуется ни с мишенью ISRIB, ни с сохранённым сигналом p-eIF2α.</span></li><li><b>Б.</b> ISRIB ослабил подавление eIF2B, не изменив фосфорилирования eIF2α. <i>(верный вариант)</i><br><span class="expl">ISRIB действует на eIF2B; его эффект не равнозначен дефосфорилированию eIF2α.</span></li><li><b>В.</b> Иммуноблот p-eIF2α непосредственно измерил скорость синтеза всех белков. <i>(неверный вариант)</i><br><span class="expl">Блот определяет фосфорилированную форму; общую трансляцию регистрируют отдельно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-10.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1073/pnas.1815767116">Rabouw H. H. et al. Small molecule ISRIB suppresses the integrated stress response within a defined window of activation. Proc Natl Acad Sci U S A. 2019;116:2097–2102.</a></li><li><a href="https://doi.org/10.7554/eLife.65703">Schoof M. et al. eIF2B conformation and assembly state regulate the integrated stress response. eLife. 2021;10:e65703.</a></li><li><a href="https://doi.org/10.1073/pnas.0400541101">Vattem KM., Wek RC. Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells. Proc Natl Acad Sci U S A. 2004;101:11269–74.</a></li></ul><p>Схемы принципов методов и учебные рисунки сигналов — не данные эксперимента. Образцы «контроль», «стресс» и «стресс + ISRIB» сравниваются при одном сроке; общий eIF2α и загрузка считаются неизменными, сигналы — в линейном диапазоне регистрации. Действие ISRIB — обзор Wek 2023 (полный текст), Rabouw 2019 (клеточные линии; прочитана аннотация), Schoof 2021 (тематические фрагменты); репортёр с 5′-областью ATF4 — Vattem и Wek 2004 (прочитана аннотация). Длина защищённого рибосомой фрагмента (около 30 нуклеотидов) приведена как типичная для метода.</p></details></article><article class="card print-unit" id="ns-upr"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 8 из 30</div><h2>Когда нагрузка на ЭПР превышает возможности сворачивания белков</h2><p class="lead"><a href="#ns-g-S10-T03">Эндоплазматический ретикулум</a> (ЭПР) обрабатывает секреторные и многие мембранные белки. Стресс ЭПР возникает, когда <a href="#ns-g-S10-T04">белковая нагрузка</a> превышает <a href="#ns-g-S10-T05">функциональную ёмкость ЭПР</a>. Это несоответствие воспринимают три сенсора — PERK, IRE1α и ATF6, а <a href="#ns-g-S10-T02">ответ на неправильно свёрнутые белки</a> (UPR) восстанавливает соответствие с двух сторон.</p><ol class="mech"><li>Новые секреторные и мембранные полипептиды переносятся в ЭПР, где шапероны, ферменты образования дисульфидных связей и Ca²⁺-зависимые белки обеспечивают их сворачивание.</li><li>Если поступление белков растёт или возможности сворачивания снижаются, в просвете ЭПР накапливаются неправильно свёрнутые белки — это и есть стресс ЭПР.</li><li>Шаперон <a href="#ns-g-S10-T24">BiP</a> участвует в регуляции сенсоров UPR, но не является единственным механизмом их активации: неправильно свёрнутые белки и состояние мембраны тоже влияют на сенсоры.</li></ol><p>Почти все секреторные белки и большинство мембранных белков синтезируются рибосомами, связанными с мембраной ЭПР, и уже во время синтеза переносятся в его просвет. Здесь полипептид приобретает нативную структуру: его связывают шапероны, в том числе BiP, ферменты образуют дисульфидные связи, присоединяются олигосахариды, а белки, зависимые от Ca²⁺, работают при высокой концентрации этого иона в просвете ЭПР. Только правильно свёрнутые и собранные белки покидают ЭПР в транспортных пузырьках.</p><p>Белковой нагрузкой называют поступление белков, которые должны пройти эту обработку. Функциональная ёмкость ЭПР — совокупные возможности сворачивания, сборки и удаления дефектных молекул в данных условиях. Стресс ЭПР возникает при несоответствии двух величин, а не при росте одной из них: нагрузка может превысить ёмкость, если синтез белка усилен, например в плазматической клетке, или если ёмкость снижена — при нарушении работы шаперонов, условий образования дисульфидных связей или при уменьшении содержания Ca²⁺ в ЭПР.</p><p>У млекопитающих несоответствие воспринимают три трансмембранных белка ЭПР: PERK, IRE1α и ATF6. По классической модели BiP связан с их люминальными доменами и при накоплении неправильно свёрнутых белков переходит к ним, освобождая сенсоры. Эта модель неполна: развёрнутые участки белков могут непосредственно связываться с люминальными доменами IRE1α и, по сходству строения, PERK, а IRE1α и PERK реагируют также на изменение липидного состава мембраны ЭПР.</p><p>Поэтому стресс ЭПР и UPR различают: первое — отклонение от нормального состояния, второе — ответ на него, один из механизмов <a href="#ns-g-S10-T06">протеостаза</a> — согласования синтеза, сворачивания, транспорта и удаления белков. UPR уменьшает поступление новых белков, увеличивает ёмкость ЭПР и ускоряет удаление дефектных молекул; следующие шаги разбирают, какая ветвь что изменяет.</p><div class="note trap"><strong>Типичная ошибка</strong> Стресс ЭПР возникает только тогда, когда клетка синтезирует больше белка.<p class="trap-fix">Важно соотношение нагрузки и ёмкости. При прежнем синтезе стресс ЭПР развивается, если снижены возможности сворачивания, например при нарушении работы шаперонов или потере Ca²⁺ из ЭПР.</p></div><div class="static-quiz"><h3>Скорость поступления новых белков в ЭПР не изменилась, но работа шаперонов нарушилась. Может ли при этом возникнуть стресс ЭПР?</h3><ol><li><b>А.</b> Да: прежняя нагрузка может превысить снизившиеся возможности сворачивания. <i>(верный вариант)</i><br><span class="expl">Важны обе стороны соотношения: поступление белков и способность ЭПР обработать их.</span></li><li><b>Б.</b> Нет: при неизменном поступлении белков нагрузка всегда соответствует возможностям ЭПР. <i>(неверный вариант)</i><br><span class="expl">При прежнем поступлении белков возможности их обработки могут уменьшиться; сравнивать нужно обе стороны соотношения.</span></li><li><b>В.</b> Нет: уменьшение числа функциональных шаперонов само по себе снижает поступление белков в той же степени. <i>(неверный вариант)</i><br><span class="expl">Автоматического равного уменьшения поступления из условия не следует; в вопросе скорость поступления прямо зафиксирована.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li></ul><p>Схема механизма для клеток млекопитающих; нагрузка и ёмкость показаны как качественные состояния, а не как измеряемые величины с общей шкалой. Модели активации сенсоров (связывание BiP, непосредственное связывание развёрнутых белков, влияние липидного состава мембраны) изложены по обзорам Acosta-Alvear 2025 и Wiseman 2022; на схеме все три сенсора активируются одновременно — это упрощение, их чувствительность и кинетика в клетках различаются.</p></details></article><article class="card print-unit" id="ns-upr-perk"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 9 из 30</div><h2>Как PERK связывает стресс ЭПР с регуляцией трансляции</h2><p class="lead"><a href="#ns-g-S10-T16">PERK</a> — ветвь UPR, которая связывает состояние просвета ЭПР с регуляцией трансляции в цитозоле. Фосфорилируя eIF2α, PERK уменьшает общую инициацию трансляции, и в ЭПР поступает меньше новых белков.</p><ol class="mech"><li>PERK пересекает мембрану ЭПР: люминальный домен воспринимает нарушение сворачивания белков в просвете, а киназный домен находится в цитозоле.</li><li>Активированная PERK фосфорилирует Ser51 <a href="#ns-g-S10-T08">eIF2α</a>; обменная активность <a href="#ns-g-S10-T09">eIF2B</a> снижается, и тройного комплекса для инициации становится меньше.</li><li>Общая трансляция замедляется, поэтому в ЭПР поступает меньше новых полипептидов, и нагрузка на ЭПР уменьшается.</li></ol><p>PERK — трансмембранная киназа ЭПР. Её люминальный домен обращён в просвет ЭПР и сходен с люминальным доменом IRE1α; киназный домен расположен в цитозоле и сходен с доменами других киназ eIF2α — PKR и HRI. При накоплении неправильно свёрнутых белков молекулы PERK объединяются в олигомеры и фосфорилируют друг друга, после чего киназный домен фосфорилирует субстрат — остаток Ser51 в α-субъединице eIF2.</p><p>Дальше PERK использует тот же узел, что и другие киназы интегрированного стрессового ответа: фосфорилированный eIF2 подавляет обменную активность eIF2B, и тройной комплекс eIF2·GTP·Met-тРНКi образуется медленнее (подробно — в шаге «Почему фосфорилирование eIF2α снижает общую трансляцию»). Инициация трансляции на большинстве мРНК замедляется. Поскольку многие из этих мРНК кодируют секреторные и мембранные белки, в ЭПР поступает меньше новых полипептидов, и нагрузка на систему сворачивания снижается.</p><p>Это снижение, а не прекращение синтеза белка. Часть мРНК, например мРНК ATF4, при фосфорилировании eIF2α транслируется даже активнее. ATF4 изменяет транскрипцию позже, чем PERK изменяет трансляцию, и определяет следующий этап ответа. Гены шаперонов ЭПР, в том числе BiP, регулируются прежде всего ветвями IRE1α–XBP1s и ATF6, поэтому BiP не следует считать прямой мишенью ATF4 во всех клетках.</p><p>Значение этой разгрузки видно в генетическом эксперименте: в клетках мыши с мутацией гена Perk стресс ЭПР не вызывал фосфорилирования eIF2α, синтез белка оставался высоким, стресс ЭПР был сильнее, а выживание клеток ниже. У человека инактивирующие мутации PERK вызывают синдром Уолкотта–Раллисона с неонатальным сахарным диабетом: β-клетки поджелудочной железы особенно зависят от этой регуляции.</p><div class="note trap"><strong>Типичная ошибка</strong> Активированная PERK останавливает синтез всех белков клетки.<p class="trap-fix">PERK снижает общую инициацию трансляции, но не прекращает её: синтез белка продолжается с меньшей скоростью, а трансляция отдельных мРНК, например мРНК ATF4, даже усиливается.</p></div><div class="static-quiz"><h3>Какое раннее изменение непосредственно связано с киназным выходом PERK при стрессе ЭПР?</h3><ol><li><b>А.</b> Удаление 26-нуклеотидного интрона из мРНК XBP1. <i>(неверный вариант)</i><br><span class="expl">Это выход IRE1; PERK непосредственно фосфорилирует eIF2α.</span></li><li><b>Б.</b> Повышение p-eIF2α и уменьшение общей инициации трансляции. <i>(верный вариант)</i><br><span class="expl">Так киназный сигнал PERK уменьшает скорость поступления новых белков в систему ЭПР.</span></li><li><b>В.</b> Освобождение N-концевого фрагмента ATF6 в аппарате Гольджи. <i>(неверный вариант)</i><br><span class="expl">Это протеолитическая активация другой ветви UPR, а не непосредственный киназный выход PERK.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/16729">Harding HP. et al. Protein translation and folding are coupled by an endoplasmic-reticulum-resident kinase. Nature. 1999;397:271–4.</a></li><li><a href="https://doi.org/10.1016/s1097-2765(00)80330-5">Harding H. P., Zhang Y., Bertolotti A., Zeng H., Ron D. Perk is essential for translational regulation and cell survival during the unfolded protein response. Mol Cell. 2000;5:897–904.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li></ul><p>Схема механизма; ранний канонический ответ на стресс ЭПР в клетках млекопитающих, другие киназы eIF2α в схеме не активированы. Состояния качественные: сила торможения трансляции в разных клетках и при разных воздействиях различается. Эксперимент с Perk: клетки мыши с мутацией гена Perk, стресс ЭПР вызван туникамицином и другими воздействиями; измерены фосфорилирование eIF2α, синтез белка и выживание (Harding 2000, по аннотации). Синдром Уолкотта–Раллисона и роль PERK в β-клетках — по обзору Acosta-Alvear 2025.</p></details></article><article class="card print-unit" id="ns-ire1-xbp1"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 10 из 30</div><h2>Как IRE1 и РНК-лигаза образуют мРНК XBP1s</h2><p class="lead"><a href="#ns-g-S10-T25">IRE1α</a> — трансмембранный белок ЭПР с киназным и эндорибонуклеазным (РНКазным) доменами. При стрессе ЭПР его РНКазный домен вырезает из мРНК XBP1 короткий интрон. Соединяет части мРНК другой фермент — <a href="#ns-g-S10-T27">РНК-лигаза RtcB</a>; в результате образуется мРНК <a href="#ns-g-S10-T26">XBP1s</a>, кодирующая активный транскрипционный фактор.</p><ol class="mech"><li>При стрессе ЭПР молекулы IRE1α объединяются в олигомеры и фосфорилируют друг друга; при этом активируется их РНКазный домен, обращённый в цитозоль.</li><li>РНКазный домен IRE1α расщепляет мРНК XBP1 на границах интрона из 26 нуклеотидов, а РНК-лигаза RtcB соединяет 5′- и 3′-части мРНК.</li><li>Удаление 26 нуклеотидов сдвигает рамку считывания в 3′-части мРНК, и вместо белка XBP1u синтезируется XBP1s — транскрипционный фактор с доменом активации.</li></ol><p>Белок IRE1α кодирует ген ERN1. Его люминальный домен расположен в просвете ЭПР, а киназный и РНКазный домены — в цитозоле. При накоплении неправильно свёрнутых белков молекулы IRE1α образуют олигомеры и фосфорилируют друг друга; в таком состоянии РНКазный домен расщепляет определённые РНК. Главный субстрат — мРНК XBP1. Её доставляет к мембране ЭПР сам транслируемый полипептид XBP1u: гидрофобный участок этого белка распознаётся частицей узнавания сигнала, и мРНК оказывается рядом с IRE1α.</p><p>Удаление интрона из мРНК XBP1 называют <a href="#ns-g-S10-T28">неканоническим сплайсингом</a>: оно происходит в цитозоле без сплайсосомы. IRE1α разрезает мРНК в двух местах и освобождает интрон, у большинства позвоночных длиной 26 нуклеотидов. Концы мРНК сближаются, и РНК-лигаза RtcB вместе с кофактором археазой соединяет их. В клетках без RtcB сплайсинг мРНК XBP1 при стрессе ЭПР нарушался, а восстановление активной лигазы его возвращало. IRE1α разрезает мРНК, но не соединяет её части.</p><p>Число 26 не кратно трём, поэтому после удаления интрона 3′-часть мРНК читается в другой рамке. Белки XBP1u и XBP1s имеют общий N-концевой bZIP-домен, связывающий ДНК, но разные C-концы. У XBP1s C-конец содержит домен активации транскрипции, и этот белок усиливает экспрессию генов шаперонов, ферментов сворачивания и белков ERAD. XBP1u несёт дегрон, быстро разрушается и может выводить XBP1s и активный ATF6 из ядра, ограничивая ответ.</p><p>У почкующихся дрожжей Ire1 — единственный сенсор стресса ЭПР: он вырезает интрон из мРНК HAC1, и белок Hac1 регулирует транскрипцию. Hac1 и XBP1 сходны по строению, но мРНК HAC1 и XBP1 различаются длиной интрона и способами регуляции, поэтому число 26 и детали механизма нельзя переносить с одного организма на другой.</p><div class="note trap"><strong>Типичная ошибка</strong> IRE1α сам вырезает интрон и сшивает мРНК XBP1, как это делает сплайсосома.<p class="trap-fix">IRE1α только разрезает мРНК. Части мРНК соединяет отдельный фермент — РНК-лигаза RtcB; без неё мРНК XBP1s не образуется, хотя IRE1α активен.</p></div><div class="static-quiz"><h3>Как распределяются функции при образовании мРНК XBP1s у млекопитающих?</h3><ol><li><b>А.</b> IRE1α выполняет и разрезание мРНК, и соединение экзонов без отдельной лигазы. <i>(неверный вариант)</i><br><span class="expl">РНКазный домен выполняет разрезание, а соединение экзонов требует РНК-лигазы RtcB.</span></li><li><b>Б.</b> IRE1α расщепляет мРНК, а RtcB соединяет оставшиеся экзоны. <i>(верный вариант)</i><br><span class="expl">Эндорибонуклеазная реакция и лигирование выполняются разными белками.</span></li><li><b>В.</b> Сплайсосома удаляет интрон в ядре без участия IRE1α. <i>(неверный вариант)</i><br><span class="expl">Рассматриваемое событие — неканонический сплайсинг, зависящий от IRE1, а не канонический сплайсинг пре-мРНК сплайсосомой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1038/415092a">Calfon M. et al. IRE1 couples endoplasmic reticulum load to secretory capacity by processing the XBP-1 mRNA. Nature. 2002;415:92–6.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.06.032">Lu Y. et al. A synthetic biology approach identifies the mammalian UPR RNA ligase RtcB. Mol Cell. 2014;55:758–70.</a></li></ul><p>Схема механизма для клеток млекопитающих; этапы показаны последовательно и качественно. Длина интрона 26 нт относится к мРНК XBP1 большинства позвоночных (Acosta-Alvear 2025). Роль RtcB: клетки мыши с выключенным геном Rtcb и эксперименты сплайсинга in vitro (Lu 2014, по аннотации). IRE1 непосредственно расщепляет мРНК XBP1 in vitro; XBP1 необходим для UPR у нематоды Caenorhabditis elegans и для дифференцировки плазматических клеток у мыши (Calfon 2002, по аннотации).</p></details></article><article class="card print-unit" id="ns-atf6"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 11 из 30</div><h2>Почему ATF6 должен пройти через аппарат Гольджи</h2><p class="lead"><a href="#ns-g-S10-T30">ATF6α</a> синтезируется как мембранный белок ЭПР, и его транскрипционная часть не может попасть в ядро, пока не отделена от мембраны. Отделяют её протеазы аппарата Гольджи <a href="#ns-g-S10-T31">S1P и S2P</a>, поэтому при стрессе ЭПР ATF6α сначала переносится из ЭПР в аппарат Гольджи.</p><ol class="mech"><li>ATF6α — мембранный белок ЭПР; его N-концевая часть с bZIP-доменом обращена в цитозоль, C-концевая — в просвет ЭПР.</li><li>При стрессе ЭПР ATF6α переносится в пузырьках COPII в аппарат Гольджи, где S1P, а затем S2P расщепляют его.</li><li>Освобождённый N-концевой фрагмент ATF6f переходит в ядро и активирует транскрипцию генов шаперонов и других белков ЭПР.</li></ol><p>ATF6α — белок массой около 90 кДа, пересекающий мембрану ЭПР один раз. Его N-концевая половина с bZIP-доменом, способным связывать ДНК, обращена в цитозоль, а C-концевая часть — в просвет ЭПР. Пока белок закреплён в мембране, его транскрипционная часть в ядро не поступает. Поэтому ветвь ATF6 устроена иначе, чем ветвь IRE1α: изменяется не мРНК, а уже синтезированный белок.</p><p>При стрессе ЭПР ATF6α покидает ЭПР в пузырьках COPII. Для ATF6α показано, что при этом восстанавливаются межмолекулярные дисульфидные связи, удерживающие его в олигомерах, и восстановленный белок входит в транспортные пузырьки. В аппарате Гольджи ATF6α расщепляют две протеазы: S1P разрезает его со стороны просвета, затем S2P — внутри мембраны. Это те же протеазы, которые активируют транскрипционные факторы SREBP при недостатке холестерина. Освобождённый фрагмент массой около 50 кДа, ATF6f, переходит в ядро.</p><p>Перенос и протеолиз — два разных необходимых этапа. Если ATF6α не покидает ЭПР, протеазы с ним не встречаются. Если белок доставлен в аппарат Гольджи, но протеолиз заблокирован, полноразмерный ATF6α накапливается, а новый ATF6f не образуется. Поэтому различают образование фрагмента — скорость его освобождения — и содержание ATF6f в ядре, которое зависит также от его разрушения.</p><p>В ядре ATF6f вместе с XBP1s активирует гены шаперонов, ферментов сворачивания и белков ERAD. Вклад ATF6α и XBP1 в эти гены частично перекрывается: в фибробластах мыши подавление ATF6α или ATF6β методом РНК-интерференции мало изменяло индукцию изученных генов UPR, а при сочетании отсутствия XBP1 с подавлением ATF6α нарушения были выражены сильнее. Мыши без ATF6α или без ATF6β развиваются, а без обоих белков погибают на ранних стадиях развития.</p><div class="note trap"><strong>Типичная ошибка</strong> Как только ATF6α попадает в аппарат Гольджи, он уже работает как транскрипционный фактор.<p class="trap-fix">В аппарате Гольджи ATF6α ещё закреплён в мембране. Транскрипцию регулирует только N-концевой фрагмент ATF6f, который освобождается после расщепления S1P и S2P.</p></div><div class="static-quiz"><h3>В учебной системе ATF6α достиг аппарата Гольджи, но его расщепление S1P и S2P полностью блокировано. Что произойдёт с образованием активного N-концевого фрагмента?</h3><ol><li><b>А.</b> Образование продолжится с прежней скоростью, поскольку доставки ATF6α в аппарат Гольджи достаточно. <i>(неверный вариант)</i><br><span class="expl">Доставка и протеолитическое освобождение домена — разные этапы. В условии следующий необходимый этап блокирован.</span></li><li><b>Б.</b> Образование сохранится благодаря повышению количества полноразмерного ATF6α в аппарате Гольджи. <i>(неверный вариант)</i><br><span class="expl">Накопление полноразмерного субстрата не заменяет полностью блокированное образование его N-концевого фрагмента.</span></li><li><b>В.</b> Образование нового фрагмента по этому пути прекратится, хотя ATF6α доставлен в аппарат Гольджи. <i>(верный вариант)</i><br><span class="expl">Транспорт и протеолитическая активация — разные необходимые этапы показанного пути.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1091/mbc.10.11.3787">Haze K. et al. Mammalian transcription factor ATF6 is synthesized as a transmembrane protein and activated by proteolysis in response to endoplasmic reticulum stress. Mol Biol Cell. 1999;10:3787–99.</a></li><li><a href="https://doi.org/10.1016/s1097-2765(00)00133-7">Ye J., Rawson R. B., Komuro R. et al. ER stress induces cleavage of membrane-bound ATF6 by the same proteases that process SREBPs. Mol Cell. 2000;6:1355–1364.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li><li><a href="https://doi.org/10.1128/MCB.23.21.7448-7459.2003">Lee A.-H., Iwakoshi N. N., Glimcher L. H. XBP-1 regulates a subset of endoplasmic reticulum resident chaperone genes in the unfolded protein response. Mol Cell Biol. 2003;23:7448–7459.</a></li></ul><p>Схема механизма; ATF6α млекопитающих, состояния качественные. Мембранная топология и превращение p90 в p50 при стрессе ЭПР — клетки HeLa, туникамицин и тапсигаргин (Haze 1999, по аннотации). Расщепление S1P и S2P: в клетках CHO без S2P процессинг ATF6 блокирован полностью, без S1P — частично (Ye 2000, по аннотации); в вопросе блок обеих протеаз полный — это условие учебной задачи. Пузырьки COPII, восстановление дисульфидных связей ATF6α, фенотипы мышей без ATF6α и ATF6β — Acosta-Alvear 2025. Зависимость генов UPR от XBP1 и ATF6α — фибробласты мыши с нокаутом XBP1 и нокдауном ATF6α методом РНК-интерференции (Lee 2003). ATF6β и родственные белки семейства CREB3 здесь не рассматриваются.</p></details></article><article class="card print-unit" id="ns-upr-capacity"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 12 из 30</div><h2>Как UPR изменяет возможности секреторной клетки</h2><p class="lead">UPR восстанавливает соответствие нагрузки и ёмкости ЭПР тремя способами: уменьшает поступление новых белков, увеличивает возможности сворачивания и ускоряет удаление дефектных молекул. Последний путь — <a href="#ns-g-S10-T32">деградация, связанная с ЭПР</a> (ERAD): дефектный белок переносится из ЭПР в цитозоль и разрушается протеасомой.</p><ol class="mech"><li>PERK снижает общую инициацию трансляции, и в ЭПР поступает меньше новых белков; этот эффект развивается быстро.</li><li>XBP1s и ATF6f усиливают экспрессию генов шаперонов, ферментов сворачивания и белков ERAD; ёмкость ЭПР растёт медленнее — по мере синтеза этих белков.</li><li>ERAD распознаёт дефектный белок, переносит его через мембрану ЭПР в цитозоль, где белок убиквитинируется и разрушается протеасомой; повторное сворачивание, напротив, идёт в просвете ЭПР.</li></ol><p>Белок, поступивший в ЭПР, может пройти два пути. Если шапероны и ферменты сворачивания доводят его до нативной структуры, он покидает ЭПР и через аппарат Гольджи достигает места назначения. Если белок остаётся неправильно свёрнутым, его повторно связывают шапероны; а если и это не помогает, белок распознаётся как дефектный и направляется на ERAD. При ERAD белок переносится через мембрану ЭПР в цитозоль, по мере выхода убиквитинируется и разрушается протеасомой. Устойчивые к ERAD белки и агрегаты, например некоторые формы проколлагена и нестабильные варианты инсулина, удаляются иначе — при ER-фагии части ЭПР поступают в лизосомы. Подробно эти пути разбирает семинар 11.</p><p>UPR изменяет все три стороны баланса. PERK быстро снижает поступление новых белков. Транскрипционные факторы XBP1s и ATF6f увеличивают экспрессию генов шаперонов, ферментов сворачивания и белков ERAD, а также стимулируют синтез липидов и расширение мембран ЭПР. Ёмкость растёт медленнее, чем снижается поступление: для этого нужны транскрипция, трансляция и сборка новых белков. Уменьшение поступления не удаляет уже накопленные неправильно свёрнутые белки — для этого нужны повторное сворачивание и ERAD.</p><p>Значение такой перестройки видно в специализированных секреторных клетках. Покоящийся B-лимфоцит содержит мало ЭПР, а плазматическая клетка, образующаяся из него, заполнена ЭПР и секретирует тысячи молекул антител в секунду; ЭПР расширяется под действием IRE1α–XBP1s ещё до начала массового синтеза антител, а без XBP1 стимулированные B-клетки мыши не завершают секреторное созревание и интенсивная секреция антител нарушается. β-клетки поджелудочной железы после стимуляции глюкозой синтезируют до миллиона молекул проинсулина в минуту, но непостоянно; для них важны и XBP1s, и PERK.</p><div class="note trap"><strong>Типичная ошибка</strong> Если PERK снизила поступление белков, накопившиеся неправильно свёрнутые белки исчезают сами.<p class="trap-fix">PERK уменьшает только поступление новых белков. Уже накопленные дефектные молекулы должны быть повторно свёрнуты шаперонами или удалены — путём ERAD или ER-фагии.</p></div><div class="static-quiz"><h3>Какой процесс отличает ERAD от повторного сворачивания белка шаперонами в просвете ЭПР?</h3><ol><li><b>А.</b> Использование информации о качестве структуры белка. <i>(неверный вариант)</i><br><span class="expl">Оценка структуры относится к обоим маршрутам и поэтому не является их отличительным признаком.</span></li><li><b>Б.</b> Перенос дефектного белка в цитозоль и его разрушение протеасомой. <i>(верный вариант)</i><br><span class="expl">Этот маршрут удаления отличает ERAD от попытки восстановить структуру в просвете ЭПР.</span></li><li><b>В.</b> Сохранение белка в просвете ЭПР до восстановления нативной структуры. <i>(неверный вариант)</i><br><span class="expl">Так описывается путь повторного сворачивания, а не отличительный этап ERAD.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li></ul><p>Схема механизма; состояния качественные, «раннее» и «позднее» — порядок событий, а не измеренные сроки. Пути контроля качества, ERAD и ER-фагия, плазматические клетки (мышь, B-клетки ex vivo) и β-клетки (модели мыши и клеточные линии) — по обзору Wiseman 2022; это разные экспериментальные системы, и их данные не объединены в один эксперимент. Роль UPR в расширении мембран ЭПР — Acosta-Alvear 2025.</p></details></article><article class="card print-unit" id="ns-ire1-ridd"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 13 из 30</div><h2>Почему активность IRE1 не сводится к образованию XBP1s</h2><p class="lead">РНКазный домен IRE1α расщепляет не только мРНК XBP1. При <a href="#ns-g-S10-T29">RIDD</a> он разрушает и другие РНК, уменьшая их содержание, а фосфорилированный IRE1α может передавать сигнал на путь JNK. Поэтому образование XBP1s — лишь один из выходов IRE1α, и по одному показателю нельзя судить обо всех последствиях его активации.</p><ol class="mech"><li>Продуктивный выход РНКазного домена — сплайсинг мРНК XBP1, после которого синтезируется транскрипционный фактор XBP1s.</li><li>При RIDD IRE1α непосредственно расщепляет другие РНК, прежде всего мРНК, связанные с мембраной ЭПР; их содержание снижается без участия XBP1s.</li><li>Фосфорилированный IRE1α может связывать TRAF2 и активировать путь JNK; последствия этого сигнала зависят от клеток и условий.</li></ol><p>Сплайсинг мРНК XBP1 и RIDD выполняет один и тот же РНКазный домен IRE1α, но это разные события. При сплайсинге мРНК XBP1 не разрушается: из неё удаляется интрон, и образуется мРНК, кодирующая активный транскрипционный фактор. При RIDD IRE1α расщепляет другие РНК, и их фрагменты разрушаются клеточными нуклеазами. Содержание этих РНК снижается сразу, без транскрипции, которую регулирует XBP1s.</p><p>В фибробластах мыши мРНК разрушались при стрессе ЭПР в клетках с нормальным IRE1, но не в клетках с вариантом IRE1 без нуклеазной активности. С помощью варианта IRE1, который активируется аналогом ATP, удалось вызвать сплайсинг XBP1 без стресса ЭПР, однако RIDD при этом не наблюдался: для него потребовались и активность IRE1, и стресс ЭПР. Значит, разные состояния ЭПР могут включать разные выходы одного белка.</p><p>Субстраты RIDD часто кодируют секреторные и мембранные белки, поэтому RIDD уменьшает поступление белков в ЭПР. Описаны и более специальные мишени: расщепление мРНК BLOS1 изменяет расположение лизосом, мРНК DR5 — чувствительность к сигналам апоптоза, мРНК DGAT2 — синтез липидов. Фосфорилированный IRE1α связывает адаптерный белок TRAF2 и активирует путь JNK. Ни один из этих выходов сам по себе не определяет судьбу клетки.</p><p>Выходы Ire1 различаются и у дрожжей. У почкующихся дрожжей Ire1 действует главным образом через сплайсинг мРНК HAC1, а у делящихся дрожжей транскрипционной программы такого типа нет, и ответ опирается на RIDD. Это показывает, что один сенсор может использовать разные выходы, но не восстанавливает последовательность их появления в эволюции.</p><div class="note trap"><strong>Типичная ошибка</strong> XBP1s объясняет все последствия активации IRE1α, поэтому без XBP1 у IRE1α нет других эффектов.<p class="trap-fix">IRE1α непосредственно расщепляет и другие РНК (RIDD) и через TRAF2 влияет на путь JNK. Эти выходы не зависят от транскрипции, которую регулирует XBP1s, хотя используют тот же сенсор.</p></div><div class="static-quiz"><h3>Почему образование XBP1s не описывает все возможные последствия активации IRE1?</h3><ol><li><b>А.</b> РНКазные эффекты IRE1 сводятся к транскрипционному действию белка XBP1s. <i>(неверный вариант)</i><br><span class="expl">IRE1 может непосредственно расщеплять другие РНК; этот выход нельзя заменить последующей транскрипцией, регулируемой XBP1s.</span></li><li><b>Б.</b> По количеству XBP1s можно определить набор других РНК, расщеплённых IRE1. <i>(неверный вариант)</i><br><span class="expl">Показатель одного субстрата не задаёт автоматически набор и выраженность остальных РНКазных выходов.</span></li><li><b>В.</b> IRE1 может также расщеплять другие РНК, изменяя их содержание. <i>(верный вариант)</i><br><span class="expl">Помимо сплайсинга XBP1 у IRE1 есть и другие выходы, включая RIDD; их последствия зависят от субстратов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1083/jcb.200903014">Hollien J. et al. Regulated Ire1-dependent decay of messenger RNAs in mammalian cells. J Cell Biol. 2009;186:323–31.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li><li><a href="https://doi.org/10.1073/pnas.1115623109">Cross B. C. S., Bond P. J., Sadowski P. G. et al. The molecular basis for selective inhibition of unconventional mRNA splicing by an IRE1-binding small molecule. Proc Natl Acad Sci USA. 2012;109:E869–E878.</a></li></ul><p>Схема механизма; выходы показаны качественно и по отдельности. RIDD в клетках млекопитающих: фибробласты мыши, вариант IRE1 без нуклеазной активности и вариант, активируемый аналогом ATP (Hollien 2009, по аннотации). Примеры субстратов RIDD (BLOS1, DR5, DGAT2, MHC класса I) и различие выходов Ire1 у почкующихся и делящихся дрожжей — Acosta-Alvear 2025; набор субстратов зависит от типа клеток. Связь фосфорилированного IRE1 с TRAF2 и JNK — Wiseman 2022. 4μ8C подавляет сплайсинг XBP1 и RIDD, киназная активность сохраняется (Cross 2012, по аннотации).</p></details></article><article class="card print-unit" id="ns-upr-measure"><div class="eyebrow">UPR: три ветви ответа ЭПР · шаг 14 из 30</div><h2>Какие признаки позволяют различить три ветви UPR</h2><p class="lead">Каждую ветвь UPR определяют по её собственному молекулярному событию: PERK — по фосфорилированию eIF2α, IRE1α — по сплайсингу мРНК XBP1, ATF6 — по образованию N-концевого фрагмента. Один показатель не устанавливает состояние двух других ветвей, а p-eIF2α не указывает, какая киназа его фосфорилировала.</p><ol class="mech"><li>Фосфорилирование eIF2α — общий узел интегрированного стрессового ответа: при стрессе ЭПР его вызывает PERK, но тот же Ser51 фосфорилируют и другие киназы.</li><li>Сплайсинг мРНК XBP1 — признак одного выхода IRE1α; его определяют по продуктам ОТ-ПЦР разной длины.</li><li>Образование ATF6f — признак протеолитической активации ATF6; его определяют иммуноблотом по фрагменту меньшей массы.</li></ol><p>Три ветви UPR изменяют разные молекулы, поэтому и регистрируют их разными способами. Для ветви PERK обычно измеряют содержание фосфорилированного по Ser51 eIF2α относительно общего eIF2α (иммуноблот). Для ветви IRE1α — сплайсинг мРНК XBP1: из РНК получают кДНК, амплифицируют участок вокруг интрона и разделяют продукты XBP1u и XBP1s, различающиеся на 26 пар нуклеотидов. Для ветви ATF6 — появление N-концевого фрагмента ATF6f на иммуноблоте. Каждый показатель отвечает на свой вопрос и не заменяет двух других.</p><p>Стресс ЭПР вызывают веществами с известными первичными мишенями. Туникамицин ингибирует GlcNAc-1-P-трансферазу — фермент первой стадии N-гликозилирования в мембране ЭПР. Тапсигаргин ингибирует Ca²⁺-АТФазу ЭПР (SERCA), и запасы Ca²⁺ в ЭПР уменьшаются. DTT восстанавливает дисульфидные связи и препятствует их образованию во вновь синтезированных белках. Все три вещества нарушают сворачивание белков разными путями; ни одно из них не является прямым активатором сенсора.</p><p>Чтобы проверить вклад ветви, её подавляют. 4μ8C ковалентно связывается с остатком лизина в РНКазном домене IRE1 и подавляет сплайсинг XBP1 и RIDD, сохраняя киназный домен. GSK2606414 ингибирует PERK, но в той же или меньшей концентрации ингибирует и киназу RIPK1, поэтому вывод о PERK подтверждают генетически: клетки без PERK или IRE1α сравнивают с исходными и проверяют, восстанавливается ли ответ при возвращении белка.</p><p>Отрицательный результат тоже ограничен. Если полоса продукта XBP1s не видна, это значит, что его содержание ниже порога обнаружения метода, а не что IRE1α полностью неактивен; к тому же RIDD этим методом не регистрируется. Для проверки вклада выбранного фактора остальные условия — срок, дозу, генотип и способ подготовки образца — сохраняют сопоставимыми.</p><div class="note trap"><strong>Типичная ошибка</strong> Если продукт XBP1s в геле не виден, IRE1α в клетке полностью неактивен.<p class="trap-fix">Отсутствие полосы означает, что содержание мРНК XBP1s ниже чувствительности метода. Кроме того, IRE1α может работать через RIDD или путь JNK, которые ОТ-ПЦР XBP1 не регистрирует.</p></div><div class="static-quiz"><h3>В образце повышен p-eIF2α. Данных о XBP1s и расщеплении ATF6 нет. Какой вывод обоснован?</h3><ol><li><b>А.</b> Все три ветви UPR активированы, причём в одинаковой степени, поскольку они отвечают на один стресс ЭПР. <i>(неверный вариант)</i><br><span class="expl">Один показатель общего узла ISR не измеряет независимо выходы IRE1 и ATF6.</span></li><li><b>Б.</b> Источник сигнала однозначно установлен: фосфорилирование eIF2α в этом образце вызвала киназа PERK. <i>(неверный вариант)</i><br><span class="expl">Тот же Ser51 фосфорилируют и другие киназы; для установления входа требуется дополнительное сравнение.</span></li><li><b>В.</b> Повышено фосфорилирование eIF2α; источник сигнала и состояние двух других ветвей ещё не установлены. <i>(верный вариант)</i><br><span class="expl">Для различения ветвей нужны показатели их собственных молекулярных событий и соответствующие контроли.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-10.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.03.025">Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.06.032">Lu Y. et al. A synthetic biology approach identifies the mammalian UPR RNA ligase RtcB. Mol Cell. 2014;55:758–70.</a></li><li><a href="https://doi.org/10.1038/s41594-018-0031-y">Yoo J., Mashalidis E. H., Kuk A. C. Y. et al. GlcNAc-1-P-transferase–tunicamycin complex structure reveals basis for inhibition of N-glycosylation. Nat Struct Mol Biol. 2018;25:217–224.</a></li><li><a href="https://doi.org/10.1073/pnas.87.7.2466">Thastrup O., Cullen P. J., Drøbak B. K. et al. Thapsigargin, a tumor promoter, discharges intracellular Ca²⁺ stores by specific inhibition of the endoplasmic reticulum Ca²⁺-ATPase. Proc Natl Acad Sci USA. 1990;87:2466–2470.</a></li><li><a href="https://doi.org/10.1002/j.1460-2075.1992.tb05223.x">Braakman I., Helenius J., Helenius A. Manipulating disulfide bond formation and protein folding in the endoplasmic reticulum. EMBO J. 1992;11:1717–1722.</a></li><li><a href="https://doi.org/10.1073/pnas.1115623109">Cross B. C. S., Bond P. J., Sadowski P. G. et al. The molecular basis for selective inhibition of unconventional mRNA splicing by an IRE1-binding small molecule. Proc Natl Acad Sci USA. 2012;109:E869–E878.</a></li><li><a href="https://doi.org/10.1021/jm300713s">Axten J. M., Medina J. R., Feng Y. et al. Discovery of GSK2606414, a potent and selective first-in-class inhibitor of PKR-like endoplasmic reticulum kinase (PERK). J Med Chem. 2012;55:7193–7207.</a></li><li><a href="https://doi.org/10.1038/cdd.2017.58">Rojas-Rivera D., Delvaeye T., Roelandt R. et al. When PERK inhibitors turn out to be new potent RIPK1 inhibitors: critical issues on the specificity and use of GSK2606414 and GSK2656157. Cell Death Differ. 2017;24:1100–1110.</a></li></ul><p>Схемы методов и учебные рисунки полос — не данные эксперимента; интенсивности качественные, образцы условно собраны в один срок. Мишени веществ: туникамицин — GlcNAc-1-P-трансфераза человека (Yoo 2018); тапсигаргин — Ca²⁺-АТФаза ЭПР, микросомы печени
