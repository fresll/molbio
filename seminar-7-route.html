ase","snare":"low","al":"on","vat":"off","hyd":"off"},"e":{"v1":"off","h1":"off"},"m":[["Слияние","зависит от условий"],["Кислый pH просвета","нет"],["Расщепление выбранного субстрата","резко снижено"]],"note":"Бафиломицин A1 ингибирует V-ATPase: аутолизосомы и лизосомы перестают быть кислыми, расщепление падает. Нарушено ли при этом слияние, зависит от системы, концентрации и срока — это проверяют отдельно."}},"fixed":"Возможное сохранение слияния при нарушенном закислении — условие учебного сравнения, а не обещание одинакового действия бафиломицина во всех экспериментах.","static":["Аутофагосома и лизосома сливаются при участии SNARE-комплекса STX17–SNAP29–VAMP8 и комплекса HOPS; образуется аутолизосома. V-ATPase поддерживает кислый pH, гидролаза расщепляет субстрат. Нарушение слияния, закисления или отсутствие гидролазы меняют каждое своё звено. Бафиломицин A1 ингибирует V-ATPase; его действие на слияние зависит от условий."]}}},{"id":"reactivation","number":27,"section":3,"title":"Как лизосомное расщепление связано с повторной активацией mTORC1","question":4,"questions":[4],"keywords":["Лизосомные протеазы","SLC38A9","Восстановление лизосомного пула","mTORC1","Биогенез","Как лизосомное расщепление связано с повторной активацией mTORC1"],"lead":["Продукты расщепления могут вновь участвовать в регуляции аминокислотного входа к mTORC1.","Повторную активацию, образование новых аутофагосом и восстановление лизосомного пула нужно различать."],"mechanism":["Лизосомные протеазы освобождают аминокислоты из доставленных белков.","Доступные аминокислоты и их транспорт могут поддержать повторную активацию mTORC1 при остальных разрешающих условиях.","В описанных системах восстановление действия mTOR связано с образованием тубул и протолизосом из аутолизосом."],"paragraphs":["После удаления аминокислот события идут в определённом порядке. Сначала снижается активность mTORC1 и ослабевает торможение запуска аутофагии. Затем образуются аутофагосомы, они сливаются с лизосомами, и лизосомные протеазы расщепляют доставленные белки до аминокислот. Аминокислоты выходят из просвета в цитозоль через переносчики лизосомной мембраны. Если остальные условия разрешающие — есть RHEB–GTP, энергии достаточно, — часть активности mTORC1 восстанавливается.","Связь продуктов расщепления с mTORC1 идёт через тот же аминокислотный вход. Аргинин в просвете лизосомы связывается с SLC38A9, а SLC38A9 переносит лейцин и другие незаменимые аминокислоты в цитозоль; цитозольные аминокислоты действуют через сенсоры на Rag. По данным Wyant и соавт. (2017), без SLC38A9 клетки хуже используют аминокислоты, освобождённые в лизосомах при расщеплении белка. Аминокислоты не заменяют RHEB, энергию и другие условия: они восстанавливают только свой вход.","Восстановленный mTORC1 ограничивает образование новых аутофагосом и участвует в восстановлении пула лизосом. [[T92|Восстановление лизосомного пула из аутолизосом]] (autophagic lysosome reformation) описали Yu и соавт. (2010) на клетках NRK (эпителиальная линия почки крысы) в среде без сыворотки и глутамина: из аутолизосом вытягиваются мембранные тубулы, от них отделяются протолизосомы, которые созревают в функциональные лизосомы. Этот процесс отличается от биогенеза лизосом через TFEB: в первом случае лизосомы формируются из уже существующих мембран аутолизосом, во втором — меняется экспрессия генов и синтезируются новые лизосомные белки.","Какие физические стадии лежат в основе восстановления лизосом? Это не обычное слияние аутофагосом с лизосомами, а образование новых лизосом из мембран уже существующих аутолизосом. По данным обзора Nanayakkara и соавт. (2023), в изученных системах стадий три. Первая — выпячивание: на мембране аутолизосомы локально образуется PI(4,5)P₂, который привлекает адаптерный комплекс AP-2 и клатрин, и мембрана выпячивается в виде почки. Вторая — вытягивание трубочки: двигательный белок KIF5B, привлекаемый тем же PI(4,5)P₂, тянет мембрану вдоль микротрубочек (Du и соавт., 2016), а белок WHAMM запускает на поверхности аутолизосомы локальную полимеризацию актина (Dai и соавт., 2019). Третья — отделение: от конца трубочки отделяется протолизосома; в этом участвуют механизмы мембранного деления, включая динамин 2 (DNM2) (Schulze, McNiven, 2014), и образование PI3P комплексом VPS34–UVRAG (Munson, Ganley, 2015). Затем протолизосомы созревают в функциональные лизосомы. Повторная активация mTORC1 связана с регуляцией этого процесса, но сама мембрану не вытягивает: она влияет на перечисленные белки и липиды. Эффект фосфорилирования UVRAG и последующего образования PI3P на поздних этапах аутофагии зависит от субкомплекса, участка и условий, поэтому единой схемы для всех клеток нет.","Сроки и роль отдельных аминокислот зависят от системы. В экспериментах Yu и соавт. (2010) активность mTOR снижалась в первые часы и восстанавливалась к 6 ч, а восстановление лизосом продолжалось дольше. Tan и соавт. (2017) изучали лишение аминокислот и показали, что повторная активация mTORC1 зависит от метаболизма глутамина. Kazyken и соавт. (2024) показали участие AMPK при длительном лишении аминокислот. Это три разных эксперимента, и их нельзя объединить в одну кривую; график практикума — результат его собственной учебной модели. Повторная активация не прекращает мгновенно расщепление в уже образовавшихся аутолизосомах."],"trap":["Повторная активация mTORC1 означает мгновенное прекращение гидролиза в уже возникших аутолизосомах.","Она может ограничивать образование новых структур и участвовать в восстановлении лизосом; уже доставленный материал не обязан мгновенно перестать расщепляться."],"conditions":"Задан зависимый от протеолиза вход без альтернативного поступления. Это условная модель, не доказательство одинакового срока и полноты повторной активации во всех системах. Детали ALR (PI(4,5)P₂, AP-2 и клатрин, KIF5B, WHAMM, DNM2) получены главным образом на культивируемых клетках крысы и человека и не равны универсальной схеме.","sources":["Yu2010","Tan2017","Kazyken2024","Wyant2017","Smith2026","Nanayakkara2023","Du2016","Dai2019","Schulze2014","Munson2015"],"quiz":{"id":"S7-L27","question":"В модели повторная активация mTORC1 зависит от аминокислот, освобождённых лизосомными протеазами; внешнее поступление исключено. Протеазы блокированы. Что ожидается для этого входа?","options":[{"id":"S7-L27-2","text":"Освобождение аминокислот усиливается и автоматически заменяет все другие входы.","correct":false,"feedback":"Ингибирование протеаз не усиливает их каталитическое образование аминокислот."},{"id":"S7-L27-3","text":"Нерасщеплённый белковый груз непосредственно заменяет свободные аминокислоты.","correct":false,"feedback":"Сенсорная доступность свободных аминокислот не эквивалентна присутствию нерасщеплённого белка."},{"id":"S7-L27-1","text":"Освобождение аминокислот снижается и повторная активация через этот вход ограничивается.","correct":true,"feedback":"Блок гидролиза ограничивает источник продуктов в специально заданной модели."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"От снижения сигнала к восстановлению лизосом","status":"Качественная учебная модель · вход зависит только от протеолиза, внешнего поступления нет","ctrls":[{"id":"f","type":"group","label":"Фаза","opts":["1. снижение сигнала","2. переработка материала","3. повторная активация","4. восстановление лизосом"]},{"id":"b","type":"group","label":"Блок","opts":["нет","лизосомные протеазы","выход продуктов из лизосомы"]}],"W":640,"H":250,"NW":340,"NH":400,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"mtorc1":{"p":[90,60,120,44],"n":[80,56,130,44],"t":"mTORC1"},"ap":{"p":[260,60,150,44 осомах продолжается."},"2-1":{"n":{"mtorc1":"off","ap":"on","al":"met","aa":"off","ly":"off","tub":"hide"},"e":{"a2":"off","a3":"off","r1":"hide","r2":"hide"},"bars":[["активность mTORC1",1],["образование аутофагосом",3],["аутолизосомы",3],["свободные лизосомы",1],["аминокислоты в цитозоле из лизосом",0]],"note":"Протеазы заблокированы: груз доставлен, но белки не расщепляются, аминокислоты не освобождаются. В этой модели нет другого источника, поэтому mTORC1 остаётся подавленным, аутолизосомы с нерасщеплённым материалом накапливаются, лизосомный пул не восстанавливается."},"2-2":{"n":{"mtorc1":"low","ap":"low","al":"met","aa":"off","ly":"off","tub":"hide"},"e":{"a3":"off","r1":"hide","r2":"hide"},"bars":[["активность mTORC1",-1],["образование аутофагосом",-1],["аутолизосомы",3],["свободные лизосомы",1],["аминокислоты в цитозоле из лизосом",1]],"note":"Выход продуктов из лизосомы заблокирован: аминокислоты накапливаются в просвете, в цитозоль их поступает мало. Сигнал из просвета (например, аргинин и SLC38A9) и доступность аминокислот в цитозоле — разные входы; без уточнения системы направление ответа mTORC1 не задано («не определяется»)."},"3-0":{"n":{"mtorc1":"on","ap":"off","al":"base","aa":"off","ly":"base","tub":"on"},"e":{},"bars":[["активность mTORC1",2],["образование аутофагосом",1],["аутолизосомы",1],["свободные лизосомы",2],["аминокислоты в цитозоле из лизосом",1]],"note":"Из аутолизосом вытягиваются тубулы, отделяются протолизосомы, и пул свободных лизосом восстанавливается. Это не биогенез через TFEB."},"3-1":{"n":{"mtorc1":"off","ap":"on","al":"met","aa":"off","ly":"off","tub":"hide"},"e":{"a2":"off","a3":"off","r1":"hide","r2":"hide"},"bars":[["активность mTORC1",1],["образование аутофагосом",3],["аутолизосомы",3],["свободные лизосомы",1],["аминокислоты в цитозоле из лизосом",0]],"note":"Протеазы заблокированы: груз доставлен, но белки не расщепляются, аминокислоты не освобождаются. В этой модели нет другого источника, поэтому mTORC1 остаётся подавленным, аутолизосомы с нерасщеплённым материалом накапливаются, лизосомный пул не восстанавливается."},"3-2":{"n":{"mtorc1":"low","ap":"low","al":"met","aa":"off","ly":"off","tub":"hide"},"e":{"a3":"off","r1":"hide","r2":"hide"},"bars":[["активность mTORC1",-1],["образование аутофагосом",-1],["аутолизосомы",3],["свободные лизосомы",1],["аминокислоты в цитозоле из лизосом",1]],"note":"Выход продуктов из лизосомы заблокирован: аминокислоты накапливаются в просвете, в цитозоль их поступает мало. Сигнал из просвета (например, аргинин и SLC38A9) и доступность аминокислот в цитозоле — разные входы; без уточнения системы направление ответа mTORC1 не задано («не определяется»)."}},"fixed":"Условная модель: аминокислоты поступают только из лизосомного протеолиза; RHEB–GTP и энергия поддержаны. Это не доказательство одинакового срока и полноты повторной активации во всех системах.","static":["Четыре фазы: (1) после удаления аминокислот активность mTORC1 снижается, образование аутофагосом усиливается; (2) аутофагосомы сливаются с лизосомами, протеазы освобождают аминокислоты; (3) аминокислоты через лизосомные переносчики и Rag частично восстанавливают mTORC1, образование новых аутофагосом снижается, расщепление в уже образовавшихся аутолизосомах продолжается; (4) из аутолизосом через тубулы и протолизосомы восстанавливается пул лизосом. Блок протеаз лишает модель этого входа; блок выхода продуктов разделяет сигнал из просвета и доступность цитозольных аминокислот, и направление ответа mTORC1 без уточнения системы не задано."]}}},{"id":"autophagic-flux","number":28,"section":3,"title":"Как измеряют поток и оборот LC3-II","question":4,"questions":[4],"keywords":["Аутофагический поток","Оборот LC3-II","LC3-I/LC3-II","Бафиломицин A1","Контроль","p62/SQSTM1","Как измеряют поток и оборот LC3-II"],"lead":["Одно содержание LC3-II не показывает, сколько материала прошло весь путь до расщепления.","Сравнение с ингибитором проводится за одинаковый срок и требует учёта его дополнительных действий."],"mechanism":["Без ингибитора образование и удаление LC3-II происходят одновременно.","Во втором образце ингибитор изменяет процессы во время заданной экспозиции.","Разность сигналов описывает результат этой экспозиции и не всегда равна единственному физиологическому потоку."],"paragraphs":["Для оценки потока важно различать четыре величины. Запас маркера — содержание LC3-II в образце в данный момент, например в условных единицах интенсивности полосы. Скорость образования — сколько LC3-II появляется за единицу времени. Скорость удаления — сколько его исчезает за то же время, в основном при расщеплении в аутолизосомах. Изменение запаса за интервал — разность запаса в конце и в начале интервала. Если образование и удаление равны, запас не меняется, хотя через систему идёт поток.","Поэтому поток оценивают по [[T86|обороту LC3-II]] в двух параллельных культурах. Обе культуры берут из одного исходного состояния. В одну добавляют ингибитор лизосомного расщепления, например бафиломицин A1, в другую — нет; обе собирают в один и тот же момент. Если ингибитор полностью блокирует удаление и не меняет образование LC3-II, разность содержаний в конце экспозиции отражает количество маркера, удалённого за этот интервал в контрольной культуре. В него может входить и маркер, присутствовавший до начала эксперимента. Если исходное состояние стационарно, а скорости сохраняются, удаление равно образованию за тот же интервал. Результат каждой культуры нельзя получить, прибавив к исходному сигналу заранее назначенную величину: он зависит от того, что происходило в культуре за время экспозиции.","Ингибитор может менять и само образование аутофагосом. Например, если он нарушает расщепление белков в лизосомах, в цитозоль поступает меньше аминокислот, и через mTORC1 меняется запуск аутофагии. Тогда разность между культурами включает и изменение образования, и прекращение удаления, и её называют потоком только с этой оговоркой ([[T93|контроль]] срока, концентрации и исходного состояния обязателен).","Отдельно стоит случай уже полной блокады. Если удаление LC3-II (его расщепление в аутолизосомах) в обеих культурах уже было полностью заблокировано, второе добавление ингибитора того же пути удаления не создаёт дополнительной разности, если ингибитор не меняет образование: при 10 и 10 условных единицах разность равна 0. Но это не означает, что LC3-II нет: сами содержания остаются ненулевыми. LC3-II не равен количеству расщеплённого белкового груза. Содержание белка [[T98|p62]] (SQSTM1) — рецептора, связывающего груз с LC3 и расщепляющегося вместе с ним, — тоже зависит от образования и удаления этого белка, в том числе от его синтеза, и не является универсальным прямым измерением всего потока."],"trap":["Нулевая разность между образцами означает отсутствие LC3-II в обоих.","Одинаковое ненулевое содержание маркера даёт нулевую разность; содержание и дополнительный эффект — разные величины."],"conditions":"Числа 10 и 10 — отдельный явно условный арифметический пример; они не взяты из клеточного эксперимента. Нулевой дополнительный эффект не устанавливает автоматически причину отсутствия разности.","sources":["Klionsky2021","Smith2026","Kazyken2024"],"quiz":{"id":"S7-L28","question":"В двух сопоставимых образцах содержание LC3-II равно 10 условным единицам; разность после ингибитора равна нулю. Что установлено?","options":[{"id":"S7-L28-1","text":"Дополнительной разности нет, но ненулевой сигнал маркера сохраняется в обоих образцах.","correct":true,"feedback":"Разность 10 − 10 равна 0, но это не равенство каждого содержания нулю; причинную интерпретацию нужно обосновать отдельно."},{"id":"S7-L28-2","text":"LC3-II отсутствует в обоих образцах, поскольку разность сигналов нулевая.","correct":false,"feedback":"Здесь смешаны разность двух значений и сами значения."},{"id":"S7-L28-3","text":"Любая аутофагия отсутствует во всех клетках независимо от выбранного метода.","correct":false,"feedback":"Один маркер и одно сравнение не исключают всех путей и всех стадий аутофагии."}],"rev":1},"widget":{"kind":"flux2","title":"","s":{"title":"Две культуры: оборот LC3-II","status":"Учебная модель · условные единицы и параметры, не данные эксперимента","modes_label":"Задача","modes":["ингибитор с момента 0","удаление уже было полностью заблокировано","условный пример: 10 и 10"],"b_label":"Блок удаления LC3-II ингибитором, %","T_label":"Срок экспозиции","side_label":"Побочное действие ингибитора на образование","side_opts":["не учитывать","образование усилено в 1,5 раза"],"dishA":"без ингибитора","dishB":"с ингибитором","m_diff":"Разность (с ингибитором − без)","diff_lbl":"Разность:","x_label":"Время от добавления ингибитора, ч","y_label":"LC3-II, условные единицы","note0":"Обе культуры начинают из одного стационарного состояния (образование = удаление). Без ингибитора запас не меняется; с ингибитором удаление ослаблено, и LC3-II накапливается. Разность к концу срока — результат именно этой экспозиции.","note_side":"Ингибитор здесь ещё и усиливает образование LC3-II. Разность теперь включает и прекращение удаления, и усиление образования: называть её потоком можно только с этой оговоркой.","note_b0":"Блока удаления нет: запасы в двух культурах совпадают, разность равна 0, но LC3-II в обеих культурах есть.","note_b0_side":"Удаление не заблокировано, но образование усилено побочным действием ингибитора: разность появляется без какого-либо блока удаления.","note1":"Удаление LC3-II уже было полностью заблокировано в обеих культурах, поэтому добавление ингибитора того же пути удаления ничего не меняет: траектории совпадают, разность равна 0, а сами содержания LC3-II не нулевые и продолжают расти за счёт образования.","note1_side":"Удаление уже было полностью заблокировано, но ингибитор усиливает образование LC3-II: разность появляется только за счёт этого побочного действия, а не за счёт блока удаления.","note2":"Условный арифметический пример, не данные эксперимента: 10 − 10 = 0. Нулевая разность не означает, что LC3-II отсутствует: в каждом образце его 10 условных единиц. Причину отсутствия разности нужно установить отдельно.","fixed":"Модель: образование 2 усл. ед./ч; при работающем удалении его скорость пропорциональна запасу, коэффициент — 0,5 в час. В режиме «ингибитор с момента 0» исходный запас 4 усл. ед. стационарен. При уже полной блокаде удаления 4 усл. ед. — заданный начальный запас, который далее растёт. Числа учебные; модель отличается от модели практикума.","static":["Две культуры из одного исходного состояния собирают в один момент. Без ингибитора запас LC3-II постоянен (образование равно удалению); с ингибитором удаления LC3-II накапливается, и разность за срок экспозиции отражает оборот. Если ингибитор меняет и образование, разность включает оба эффекта. Если удаление LC3-II в обеих культурах уже полностью заблокировано, дополнительная разность равна 0, если ингибитор не меняет образование, но содержания LC3-II ненулевые (пример: 10 и 10)."]}}},{"id":"tandem-lc3","number":29,"section":3,"title":"Что показывает цвет тандемного репортёра LC3","question":4,"questions":[4],"keywords":["Тандемный репортёр LC3","LC3-I/LC3-II","Аутолизосома","Бафиломицин A1","Что показывает цвет тандемного репортёра LC3"],"lead":["Тандемный репортёр сочетает зелёный и красный флуорофоры с LC3.","Изменение цвета связано с условиями компартмента и не является само по себе измерением всего потока."],"mechanism":["До кислого лизосомного этапа могут регистрироваться оба флуорофора.","В кислых деградативных условиях зелёный сигнал уменьшается сильнее красного.","Нарушение кислотности меняет интерпретацию цвета независимо от простого подсчёта точек."],"paragraphs":["[[T94|Тандемный репортёр LC3]] — LC3, соединённый одновременно с зелёным флуоресцентным белком GFP и красным флуоресцентным белком. Kimura и соавт. (2007) описали вариант mRFP–GFP–LC3; в практикуме семинара используется близкий по смыслу вариант mCherry–GFP–LC3. Это разные конструкции с разными красными белками, и названия не следует смешивать. Репортёр включается в мембраны аутофагосом так же, как собственный LC3.","Флуоресценция GFP в кислой среде гасится, а красные белки mRFP и mCherry к кислотности устойчивее. При наложении двух каналов изображения структура, в которой регистрируются оба сигнала, выглядит жёлтой, а структура, в которой остался только красный, — красной. Аутофагосома до слияния с лизосомой имеет нейтральный просвет, поэтому выглядит жёлтой. После слияния с кислой лизосомой зелёный сигнал гаснет и структура становится красной.","Цвет зависит от кислотности, а не от самого факта слияния. Если кислотность нарушена, например бафиломицином, уже слившаяся аутолизосома сохраняет зелёный сигнал и выглядит жёлтой, как аутофагосома. Поэтому жёлтый цвет при нарушенном закислении не доказывает, что слияния не было; слияние проверяют другим методом, например по совпадению репортёра с маркером лизосом.","Число красных точек не измеряет непосредственно скорость полного расщепления груза. Оно зависит от скорости образования аутофагосом, скорости слияния, времени жизни аутолизосомы и от того, насколько полно гаснет GFP. Для вывода о потоке нужны динамика во времени, условия расщепления и независимый метод, например оборот LC3-II. В режиме «Без цвета» каналы на схеме подписаны словами."],"trap":["После бафиломицина все жёлтые точки обязательно являются аутофагосомами, которые ещё не слились с лизосомой.","Если кислотность снижена, уже слившаяся структура тоже может сохранять зелёный сигнал; её стадию нельзя установить только по цвету."],"conditions":"Схема не назначает реальный pH по цвету и не калибрует флуорофоры. mRFP исходной статьи и mCherry варианта практикума названы раздельно.","sources":["Kimura2007","Klionsky2021","Mauvezin2015"],"quiz":{"id":"S7-L29","question":"После нарушения кислотности структура сохраняет зелёный и красный сигналы LC3-репортёра. Что можно заключить о слиянии только по цвету?","options":[{"id":"S7-L29-3","text":"Слияние доказано: любые два сигнала означают завершённую доставку.","correct":false,"feedback":"Наличие двух сигналов также возможно до слияния и потому не доказывает завершённую доставку."},{"id":"S7-L29-1","text":"Одного цвета недостаточно; слияние проверяют независимым методом.","correct":true,"feedback":"В менее кислой слившейся структуре зелёный сигнал может сохраниться; цвет не различает эти варианты самостоятельно."},{"id":"S7-L29-2","text":"Слияние исключено: оба сигнала возможны только до контакта с лизосомой.","correct":false,"feedback":"Это игнорирует изменение среды и возможность сохранения зелёного сигнала после слияния."}],"rev":1},"widget":{"kind":"tandem","title":"","s":{"title":"Каналы тандемного репортёра LC3","status":"Схема, не микрофотография · цвет не калибрует pH","fus_label":"Стадия структуры","fus_opts":["аутофагосома (до слияния)","аутолизосома (после слияния)"],"ph_label":"Кислотность просвета аутолизосомы","ph_opts":["кислая","нарушена (например, бафиломицин)"],"ch_green":"зелёный канал (GFP)","ch_red":"красный канал (mCherry)","ch_merge":"наложение","ch_green_n":"GFP","ch_red_n":"mCherry","merge_red_n":"красный","merge_both_n":"жёлтый","sig_yes":"сигнал есть","sig_no":"сигнала нет","merge_both":"жёлтый: оба сигнала","merge_red":"красный: только красный сигнал","m_stage":"Стадия","m_merge":"Наложение каналов","m_concl":"Что можно заключить по цвету","stage":["до слияния","после слияния"],"concl":["оба сигнала; стадию по цвету не установить без условий","оба сигнала; стадию по цвету не установить без условий","преимущественно красный: кислый компартмент","оба сигнала, хотя слияние было"],"notes":["До слияния просвет аутофагосомы не кислый: регистрируются оба флуорофора, структура в наложении жёлтая. Кислотность лизосомы на эту стадию не действует.","До слияния просвет аутофагосомы не кислый: регистрируются оба флуорофора, структура жёлтая. Нарушение закисления лизосом не меняет цвет этой стадии.","После слияния в кислом просвете флуоресценция GFP гаснет, а красный сигнал сохраняется: структура в наложении красная.","Слияние произошло, но просвет не кислый: GFP не гаснет, структура выглядит жёлтой, как аутофагосома. Одного цвета недостаточно, слияние проверяют независимым методом."],"fixed":"Исходная работа Kimura и соавт. (2007) описывала mRFP–GFP–LC3; в практикуме используется mCherry–GFP–LC3. Схема не назначает pH по цвету.","static":["Тандемный репортёр LC3 (GFP и красный флуоресцентный белок). До слияния: оба сигнала, в наложении жёлтый. После слияния с кислой лизосомой: GFP гаснет, красный сохраняется. После слияния при нарушенной кислотности: оба сигнала, жёлтый, как до слияния, поэтому по цвету слияние не установить."]}}},{"id":"lysosomal-defects","number":30,"section":3,"title":"Как различить дефект образования, слияния и гидролиза","question":4,"questions":[4],"keywords":["GAA","Болезнь Помпе","Гидролаза","ATG7","Аутофагический поток","Мукополисахаридозы","Как различить дефект образования, слияния и гидролиза"],"lead":["Разные нарушения могут приводить к накоплению материала, но имеют разные молекулярные причины.","Недостаточность одной лизосомной гидролазы не равнозначна отсутствию кислой среды или всей аутофагии."],"mechanism":["ATG-зависимые системы участвуют в образовании аутофагической структуры.","Системы мембранного слияния обеспечивают доставку материала.","Кислая α-глюкозидаза [[T95|GAA]] расщепляет гликоген в лизосоме."],"paragraphs":["Накопление материала в клетке может иметь разные молекулярные причины, и каждая затрагивает своё звено. При утрате ATG7 нарушается ATG7-зависимая конъюгация, в том числе липидирование LC3, и эффективность аутофагической переработки резко снижается. Однако отсутствие LC3-II само по себе не доказывает отсутствия всех аутофагосомных структур: их образование, замыкание и слияние с лизосомами проверяют отдельно. В описанных экспериментах в клетках, лишённых систем конъюгации ATG, структуры, похожие на аутофагосомы, всё же образовывались, хотя медленнее, и сливались с лизосомами, но внутренняя мембрана в аутолизосомах расщеплялась со значительной задержкой (Tsuboyama и соавт., 2016). При нарушении слияния аутофагосомы образуются, но не сливаются с лизосомами и накапливаются. При отсутствии определённой лизосомной гидролазы доставка и кислая среда сохраняются, но субстрат этого фермента не расщепляется и накапливается в лизосомах.","[[T96|Болезнь Помпе]] — наследственное заболевание, вызванное мутациями гена GAA. Он кодирует лизосомную кислую α-глюкозидазу — фермент, который в лизосоме гидролизует гликоген до глюкозы. GAA расщепляет полисахарид, а не белковый груз. При недостаточности GAA гликоген, поступивший в лизосомы, накапливается в них; сильнее всего страдают сердце и скелетные мышцы. Первичный дефект при болезни Помпе — недостаточность гидролазы, а не утрата ATG7 или ULK1.","В мышечных волокнах при болезни Помпе находят и нарушения аутофагии: накопление аутофагического материала и изменение сигналов mTORC1 (Lim и соавт., 2014; Settembre, Perera, 2024). Это вторичные изменения: они развиваются в ответ на переполнение лизосом и зависят от ткани и стадии болезни. Результаты, полученные на животных моделях, не переносятся автоматически на людей.","Для сравнения, при [[T99|мукополисахаридозах]] нарушено лизосомное расщепление гликозаминогликанов — полисахаридных цепей из повторяющихся дисахаридных единиц, входящих в состав внеклеточного матрикса. Каждой форме соответствует недостаточность своего фермента, а накапливается не гликоген, а гликозаминогликаны. Общий смысл аутофагии и лизосомного расщепления — поддержание состава белков и органелл клетки. Избирательное удаление повреждённых митохондрий через белки PINK1 и Parkin (митофагия) относится к материалу другого семинара."],"trap":["При болезни Помпе первично отсутствует ATG7 или ULK1.","Основной дефект связан с GAA и лизосомным расщеплением гликогена; состояние аутофагического аппарата рассматривают отдельно."],"conditions":"Качественная модель выбранного дефекта GAA; не устанавливает клиническую тяжесть и не предлагает лечение. Первичный дефект и вторичные изменения аутофагии различены.","sources":["Lim2014","Noda2024","Klionsky2021","Settembre2024","Tsuboyama2016"],"quiz":{"id":"S7-L30","question":"В лизосоме сохранены кислая среда и доставка гликогена, но активность GAA резко снижена. Какое ближайшее изменение ожидается?","options":[{"id":"S7-L30-2","text":"Гликоген расщепляется с прежней скоростью только благодаря кислому pH.","correct":false,"feedback":"Кислотность создаёт условия реакции, но не катализирует её вместо недостаточно активной гидролазы."},{"id":"S7-L30-3","text":"Первично нарушается липидирование LC3, поскольку GAA входит в систему ATG7.","correct":false,"feedback":"GAA — гидролаза гликогена, а не компонент системы липидирования LC3; вторичные нарушения требуют отдельного исследования."},{"id":"S7-L30-1","text":"Ограничивается гидролиз гликогена, даже при сохранённых указанных условиях.","correct":true,"feedback":"Подходящая среда и доставка не заменяют каталитического действия нужного фермента."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Где нарушен путь: образование, слияние или гидролиз","status":"Схема механизма · первичный дефект и вторичные изменения различаются","ctrls":[{"id":"d","type":"group","label":"Дефект","opts":["нет дефекта","утрата ATG7","нарушено слияние","недостаточность GAA (болезнь Помпе)","недостаточность фермента расщепления гликозаминогликанов"]}],"W":640,"H":270,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"form":{"p":[90,70,140,50],"n":[80,40,136,50],"t":"образование\nаутофагосомы","fs":13},"fus":{"p":[260,70,120,50],"n":[262,40,136,50],"t":"слияние\nс лизосомой","fs":13},"lys":{"p":[460,70,190,50],"n":[170,140,220,50],"t":"лизосома: кислая\nсреда, гидролазы","fs":13},"prot":{"p":[250,200,130,44],"n":[70,250,120,44],"t":"белки","fs":14},"glyc":{"p":[410,200,130,44],"n":[175,330,120,44],"t":"гликоген","fs":14},"gag":{"p":[570,200,130,50],"n":[275,250,120,50],"t":"гликозамино-\nгликаны","fs":13}},"edges":{"s1":{"a":"form","b":"fus","k":"seq"},"s2":{"a":"fus","b":"lys","k":"seq","t":"доставка","d":[0,-12],"dn":[0,0]},"h1":{"a":"lys","b":"prot","k":"rx","t":"протеазы","d":[-40,0],"dn":[-40,0]},"h2":{"a":"lys","b":"glyc","k":"rx","t":"GAA","d":[22,0],"dn":[22,0]},"h3":{"a":"lys","b":"gag","k":"rx","t":"свои ферменты","d":[58,0],"dn":[50,0]}},"st":{"0":{"n":{"form":"on","fus":"on","lys":"on","prot":"base","glyc":"base","gag":"base"},"e":{},"m":[["Аутофагосомы","образуются"],["Слияние","идёт"],["Что накапливается","не накапливается"]],"note":"Все звенья работают: материал доставляется в лизосомы и расщепляется соответствующими ферментами."},"1":{"n":{"form":"low","fus":"low","lys":"on","prot":"base","glyc":"base","gag":"base"},"e":{"s1":"off","s2":"off"},"m":[["Аутофагосомы","образование и созревание нарушены; наличие структур проверяют отдельно"],["Слияние","число событий снижено вслед за образованием; само слияние проверяют отдельно"],["Что накапливается","аутофагический груз: переработка резко снижена"]],"note":"Без ATG7 нарушается липидирование LC3 и резко снижается эффективность аутофагической переработки. Отсутствие LC3-II не устанавливает отсутствие всех аутофагосомных структур; их наличие и слияние проверяют отдельно. В этой учебной модели лизосомы и их ферменты сохранены и могут расщеплять материал, доставленный другими путями."},"2":{"n":{"form":"on","fus":"abs","lys":"on","prot":"base","glyc":"base","gag":"base"},"e":{"s2":"off"},"m":[["Аутофагосомы","образуются и накапливаются"],["Слияние","нарушено"],["Что накапливается","груз аутофагосом не доставлен"]],"note":"Аутофагосомы образуются, но не сливаются с лизосомами и накапливаются в цитоплазме; лизосомы при этом кислые и содержат гидролазы."},"3":{"n":{"form":"on","fus":"on","lys":"base","prot":"base","glyc":"met","gag":"base"},"e":{"h2":"off"},"m":[["Аутофагосомы","образуются"],["Слияние","идёт"],["Что накапливается","гликоген в лизосомах"]],"note":"Недостаточность GAA: доставка и кислая среда сохранены, но гликоген в лизосомах не гидролизуется и накапливается. Это первичный дефект гидролазы; нарушения аутофагии в мышцах развиваются вторично."},"4":{"n":{"form":"on","fus":"on","lys":"base","prot":"base","glyc":"base","gag":"met"},"e":{"h3":"off"},"m":[["Аутофагосомы","образуются"],["Слияние","идёт"],["Что накапливается","гликозаминогликаны в лизосомах"]],"note":"Недостаточность фермента расщепления гликозаминогликанов (мукополисахаридоз): накапливаются эти полисахариды, а не гликоген. Каждой форме соответствует свой фермент."}},"fixed":"Качественная модель выбранных дефектов; клиническую тяжесть и лечение схема не описывает.","static":["Путь: образование аутофагосомы (ATG-системы) → слияние с лизосомой → расщепление в лизосоме: белки — протеазами, гликоген — GAA, гликозаминогликаны — своими ферментами. Утрата ATG7 нарушает конъюгацию и эффективное созревание аутофагических структур, нарушение слияния — доставку, недостаточность GAA (болезнь Помпе) — гидролиз гликогена, мукополисахаридозы — расщепление гликозаминогликанов."]}}},{"id":"methods","number":31,"section":4,"title":"Как выбрать величину, метод и контроль","question":null,"questions":[1,2,3,4],"keywords":["Метаболический поток","Изотопный индикатор","Контроль","Колокализация","Иммуноблоттинг","Как выбрать величину, метод и контроль"],"lead":["Исследование начинается с конкретного вопроса и измеряемой величины.","Одно наблюдение не заменяет одновременно локализацию, ферментативную активность и поток."],"mechanism":["Для локализации выбирают метод распределения сигнала в клетке.","Для химической модификации или метаболита выбирают соответствующий молекулярный анализ.","Для причинного вывода добавляют сопоставимое вмешательство, [[T93|контроль]] и при необходимости восстановление компонента."],"paragraphs":["Исследование начинается с вопроса, сформулированного через измеряемую величину. «Работает ли mTORC1?» — плохой вопрос: неясно, что измерять. «Изменилась ли доля mTOR, совпадающего с LAMP1, через 30 минут после добавления аминокислот?» и «Изменилось ли отношение p-S6K1 к общему S6K1?» — вопросы, на которые можно ответить. Для четырёх тем семинара это выглядит так. Локализацию mTORC1 определяют микроскопией с маркером лизосом. Состояние аденилатов и AMPK — ВЭЖХ или масс-спектрометрией и иммуноблоттингом. Малонил-CoA и окисление субстрата — масс-спектрометрией и меченым субстратом. Стадии аутофагии и лизосомное расщепление — оборотом LC3-II, тандемным репортёром и измерением расщепления определённого субстрата. Двухмембранные аутофагосомы видны на снимках электронной микроскопии; именно так аутофагию открыли в клетках мыши и крысы в конце 1950-х — начале 1960-х годов (Nakatogawa, 2020). Снимок показывает число и вид структур в момент фиксации, но не поток.","Для каждого измерения указывают нормировку, срок и то, чего метод сам по себе не доказывает. Фосфорилированный белок нормируют на общее содержание того же белка, общий белок — на белок контроля нанесения, по которому проверяют одинаковое количество белка в дорожках, метаболит — на количество клеток или белка в пробе. Сравниваемые образцы обрабатывают одинаково и собирают в один момент: аденилаты меняются за секунды, фосфорилирование — за минуты.","Повторы бывают двух видов. Биологические повторы — независимые культуры, животные или отдельно полученные биологические пробы; они позволяют проверить, воспроизводится ли результат на независимом материале. Технические повторы — несколько измерений одной и той же пробы; они позволяют оценить повторяемость измерения, но сами по себе не выявляют систематическую ошибку и не проверяют биологическую воспроизводимость. Вывод о воспроизводимости на биологическом материале делают по биологическим повторам.","Совместное изменение двух признаков ещё не доказывает причинной связи между ними. Если после активации AMPK одновременно выросли p-ACC и окисление жирных кислот, каждое из этих изменений могло быть вызвано действием AMPK на разные мишени. Чтобы проверить участие ACC в изменении окисления, вмешиваются именно в эту ветвь: например, сравнивают исходные клетки с клетками, где серин в участке ACC, фосфорилируемом AMPK, заменён аланином, при сохранённой регуляции других мишеней AMPK. Утрата AMPK и возвращение её исходного варианта проверяют другой вывод — зависит ли эффект от AMPK вообще. Несколько разных методов полезны, только если они измеряют звенья именно этой причинной цепи и имеют подходящие контроли."],"trap":["Несколько разных методов автоматически доказывают любой предложенный механизм.","Методы должны измерять звенья именно рассматриваемой причинной связи, иметь подходящие контроли и позволять проверить альтернативные объяснения результата."],"conditions":"Методические карточки, а не готовый протокол исследований на пациентах. Без незаданных доз, числа образцов и выдуманных измерений.","sources":["Smith2026","Divakaruni2018","Klionsky2021","Goul2023","Nakatogawa2020"],"quiz":{"id":"S7-L31","question":"Нужно проверить, изменилось ли окисление заданной жирной кислоты после активации AMPK. Какой подход наиболее прямо отвечает на этот вопрос?","options":[{"id":"S7-L31-1","text":"Измерение превращения заданного меченого субстрата с подходящим расчётом потока и контролями.","correct":true,"feedback":"Метод направлен на заданный субстрат и его превращения; модель расчёта и контроли остаются необходимыми."},{"id":"S7-L31-2","text":"Измерение только p-AMPK без регистрации превращений самой жирной кислоты.","correct":false,"feedback":"p-AMPK показывает регуляторный признак, а не окислительный поток конкретного субстрата."},{"id":"S7-L31-3","text":"Измерение только концентрации малонил-CoA без регистрации превращений самой жирной кислоты.","correct":false,"feedback":"Концентрация регуляторного метаболита не заменяет измерения скорости окисления субстрата."}],"rev":1},"widget":{"kind":"cards","title":"","s":{"title":"Величина, метод, контроль и граница вывода","status":"Учебные карточки · не протокол исследования; без доз и чисел образцов","opts_label":"Тема исследования","opts":["Локализация mTORC1","Аденилаты и AMPK","Малонил-CoA и окисление","Стадии аутофагии"],"heads":["Величина","Метод","Контроль","Граница вывода"],"cards":[{"v":["Доля сигнала mTOR, совпадающего с LAMP1.","Иммунофлуоресцентная микроскопия.","Клетки без аминокислот и с ними; клетки без Rag или Ragulator; одинаковая съёмка.","Не показывает фосфорилирование субстратов и прямое связывание."],"note":"Локализация — отдельная величина; действие на S6K1 измеряют иммуноблоттингом в тех же условиях."},{"v":["Отношения AMP/ATP и ADP/ATP; p-AMPK к общему AMPK; p-ACC к общему ACC.","ВЭЖХ или масс-спектрометрия; иммуноблоттинг.","Быстрая остановка реакций; клетки без AMPK и с возвращённой AMPK.","p-AMPK не измеряет всю активность и не доказывает, что эффект препарата зависит от AMPK."],"note":"Состояние пула и фосфорилирование измеряют раздельно: активация возможна и без обнаружимого изменения аденилатов."},{"v":["Концентрация малонил-CoA; превращение меченой жирной кислоты.","Масс-спектрометрия; изотопный индикатор с моделью расчёта потока.","Клетки с заменой участка ACC; генетическая утрата CPT1; контроль дозы ингибитора.","Малонил-CoA и p-ACC не измеряют поток окисления."],"note":"Поток окисления заданной жирной кислоты прямее всего оценивается по превращению меченого субстрата."},{"v":["Оборот LC3-II; цвет тандемного репортёра; расщепление выбранного субстрата.","Иммуноблоттинг двух культур (с ингибитором и без); микроскопия; биохимический анализ субстрата.","Одинаковые исходное состояние и срок; проверка слияния независимым методом; клетки без ATG7.","Содержание LC3-II и число точек не равны количеству расщеплённого груза."],"note":"Стадии — образование, слияние, закисление, гидролиз — проверяют раздельно."}],"fixed":"Карточки не суммируют показатели в один общий индекс «состояния клетки»: каждый показатель отвечает на свой вопрос.","static":["Четыре темы и методы: локализация mTORC1 (микроскопия с LAMP1), аденилаты и AMPK (ВЭЖХ или масс-спектрометрия, иммуноблоттинг p-AMPK и p-ACC), малонил-CoA и окисление (масс-спектрометрия, меченый субстрат), стадии аутофагии (оборот LC3-II, тандемный репортёр, расщепление субстрата). Для каждой указаны контроль и граница вывода."]}}},{"id":"integrated-study","number":32,"section":4,"title":"Как проверить согласование четырёх механизмов","question":null,"questions":[1,2,3,4],"keywords":["mTORC1","AMPK","ACC","CPT1","SLC38A9","Аутофагический поток","Контроль","Как проверить согласование четырёх механизмов"],"lead":["В итоговой учебной модели различаются аминокислотный вход, энергетическое состояние, регуляция ACC–CPT1 и переработка материала в лизосомах.","Вывод должен соответствовать именно выбранному вмешательству и сохранённым условиям."],"mechanism":["Изменение доступности аминокислот влияет на Rag-зависимую ветвь mTORC1.","Энергетическое состояние и AMPK могут менять регуляцию mTORC1 и ACC.","Лизосомный гидролиз и выход продуктов создают дополнительный источник аминокислот в заданной модели."],"paragraphs":["Итоговая модель объединяет четыре механизма семинара, но каждый вход задаётся отдельно. В исходном состоянии внешние аминокислоты есть, аденилатный пул в энергетически полноценном состоянии, RHEB–GTP поддержан, карнитиновый челнок работает. Затем меняется только одно условие, и прослеживается, какое звено затронуто непосредственно, а какие изменения следуют из этого при заданных условиях.","Удаление внешних аминокислот при сохранённых аденилатах ослабляет Rag-вход: mTORC1 перестаёт привлекаться к лизосоме, фосфорилирование S6K1 снижается, торможение запуска аутофагии ослабевает. Состояние AMPK от этого автоматически не меняется: слово «голодание» не задаёт энергетического стресса, и активацию AMPK назначают только при заданном изменении аденилатов, Ca²⁺ или другого её входа. Позже материал, доставленный в лизосомы, расщепляется, и освобождённые аминокислоты могут частично восстановить Rag-вход — если протеолиз и выход продуктов работают.","Каждое вмешательство затрагивает своё звено. Блок лизосомных протеаз при отсутствии внешних аминокислот лишает модель единственного источника аминокислот: Rag-вход остаётся слабым, и повторной активации через этот вход нет. Блок выхода продуктов из лизосомы сложнее: аргинин в просвете может по-прежнему связываться с SLC38A9, а аминокислоты в цитозоле остаются недоступны, поэтому без уточнения системы направление ответа mTORC1 не задано. Если повышенный расход ATP не компенсируется образованием ATP, в заданном энергетическом случае растёт отношение AMP к ATP и активируется AMPK. При сохранённом RHEB–GTP в этой модели AMPK тормозит mTORC1 через RAPTOR и снижает активность ACC; ингибирование CPT1 ослабевает, но поток β-окисления этим ещё не доказан. Изменение ACC само по себе меняет регуляцию входа в карнитиновый челнок, но не аминокислотный вход.","Для каждого вывода нужно независимое измерение: локализация mTORC1 и p-S6K1, аденилаты и p-AMPK, малонил-CoA и превращение меченого субстрата, оборот LC3-II и расщепление определённого субстрата. Возможные результаты модели — предсказания, а не экспериментальные данные. Если эксперимент даёт неожиданный результат, это повод проверить предпосылку — например, не изменились ли аденилаты при удалении аминокислот, — а не подгонять формулу под результат."],"trap":["Все показания можно вывести из одного общего ползунка «голод».","Разные воздействия меняют разные входы и стадии; состав среды, энергия и работа лизосом задаются отдельно."],"conditions":"Итог — качественная модель со специально ограниченными источниками и фиксированными предпосылками. Лизосомное распознавание аргинина и выход продуктов в цитозоль различаются; блок одного транспортёра не объявляет автоматически нулём весь сигнал mTORC1.","sources":["Goul2023","Smith2026","Wyant2017","Yu2010","Klionsky2021","Kazyken2024"],"quiz":{"id":"S7-L32","question":"В итоговой качественной модели удалили внешние аминокислоты. Их лизосомное освобождение заблокировано, другого источника нет. Аденилаты, Ca²⁺ и другие входы AMPK сохранены; RHEB–GTP поддержан. Какой ответ соответствует этим условиям?","options":[{"id":"S7-L32-3","text":"p-S6K1 сохраняется при исходной AMPK: RHEB–GTP заменяет аминокислотный вход.","correct":false,"feedback":"В рассматриваемой Rag-зависимой ветви RHEB–GTP не заменяет необходимый аминокислотный вход."},{"id":"S7-L32-1","text":"p-S6K1 снижается; обязательная активация AMPK из этих условий не следует.","correct":true,"feedback":"В модели нарушен Rag-зависимый вход к S6K1; удаления аминокислот недостаточно, чтобы автоматически назначить энергетический или кальциевый вход к AMPK."},{"id":"S7-L32-2","text":"p-S6K1 снижается; AMPK обязательно активируется при любом удалении аминокислот.","correct":false,"feedback":"Это смешение аминокислотного воздействия с заданным изменением энергии или Ca²⁺; универсального обязательного ответа здесь нет."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Итоговая модель: четыре слоя, одно вмешательство","status":"Качественная учебная модель со специально указанными предпосылками · не данные клеточного эксперимента","ctrls":[{"id":"c","type":"group","label":"Случай","opts":["исходное состояние","удалены внешние аминокислоты (аденилаты сохранены)","блок протеолиза, внешних аминокислот нет","некомпенсированный расход ATP (AMP/ATP повышено, аминокислоты есть)","блок выхода продуктов из лизосомы"]},{"id":"l","type":"group","label":"Слои","opts":["1: mTORC1","1–2: + AMPK","1–3: + ACC–CPT1","1–4: + лизосомы"],"def":3}],"W":640,"H":380,"NW":340,"NH":560,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh": ,["Rag-вход","сигнал из просвета есть, цитозольных аминокислот мало"],["p-S6K1","не определяется без уточнения системы"],["AMPK","автоматически не меняется"]],"note":"Выход продуктов из лизосомы заблокирован, внешних аминокислот нет: аргинин в просвете может связываться с SLC38A9, но в цитозоль аминокислот поступает мало. Сигнал из просвета и доступность цитозольных аминокислот — разные входы, и без уточнения системы направление ответа mTORC1 не задано. Откройте следующие слои, чтобы увидеть остальные звенья."},"4-2":{"n":{"aa":"off","ly":"hide","rag":"low","rheb":"on","mtorc1":"low","s6k":"low","ulk":"hide","adn":"base","ampk":"off","acc":"on","mal":"met","cpt1":"off"},"e":{"e1":"off","e9":"off","e10":"off","e2":"hide","e6":"hide","e7":"hide"},"b":{},"tab":[["Показатель","Состояние в модели"],["Rag-вход","сигнал из просвета есть, цитозольных аминокислот мало"],["p-S6K1","не определяется без уточнения системы"],["AMPK","автоматически не меняется"],["ACC → малонил-CoA ⊣ CPT1","без изменения через AMPK"]],"note":"Выход продуктов из лизосомы заблокирован, внешних аминокислот нет: аргинин в просвете может связываться с SLC38A9, но в цитозоль аминокислот поступает мало. Сигнал из просвета и доступность цитозольных аминокислот — разные входы, и без уточнения системы направление ответа mTORC1 не задано. Откройте следующие слои, чтобы увидеть остальные звенья."},"4-3":{"n":{"aa":"off","ly":"on","rag":"low","rheb":"on","mtorc1":"low","s6k":"low","ulk":"low","adn":"base","ampk":"off","acc":"on","mal":"met","cpt1":"off"},"e":{"e1":"off","e9":"off","e10":"off"},"b":{},"tab":[["Показатель","Состояние в модели"],["Rag-вход","сигнал из просвета есть, цитозольных аминокислот мало"],["p-S6K1","не определяется без уточнения системы"],["AMPK","автоматически не меняется"],["ACC → малонил-CoA ⊣ CPT1","без изменения через AMPK"],["Переработка в лизосомах","аминокислоты накапливаются в просвете"]],"note":"Выход продуктов из лизосомы заблокирован, внешних аминокислот нет: аргинин в просвете может связываться с SLC38A9, но в цитозоль аминокислот поступает мало. Сигнал из просвета и доступность цитозольных аминокислот — разные входы, и без уточнения системы направление ответа mTORC1 не задано."}},"fixed":"Предпосылки: RHEB–GTP поддержан; Ca²⁺ и другие входы AMPK не меняются, если это не указано; в случаях без внешних аминокислот единственный источник — лизосомный протеолиз. В энергетическом случае дополнительный расход ATP не компенсирован образованием ATP, а повышение AMP/ATP задано явно.","static":["Четыре слоя: (1) аминокислоты и лизосомный источник → Rag → mTORC1 → S6K1, mTORC1 тормозит запуск аутофагии; (2) аденилаты → AMPK ⊣ mTORC1; (3) AMPK → ACC → малонил-CoA ⊣ CPT1; (4) аутофагия доставляет груз в лизосомы, протеолиз даёт аминокислоты. Случаи: удаление внешних аминокислот снижает p-S6K1, но AMPK автоматически не активирует; блок протеолиза без внешних аминокислот лишает модель источника для Rag-входа; некомпенсированный дополнительный расход ATP при заданном повышении AMP/ATP активирует AMPK и тормозит mTORC1 через RAPTOR, а также снижает активность ACC; при блоке выхода продуктов направление ответа mTORC1 без уточнения системы не задано."]}}}],"glossary":[{"id":"S7-T01","term":"mTORC1","section":0,"def":"Комплекс с киназой mTOR и регуляторным белком RAPTOR, участвующий в согласовании сигналов и метаболических процессов. Разные субстраты имеют разные требования к его регуляции; локализация не равна действию на любой субстрат."},{"id":"S7-T02","term":"mTORC2","section":0,"def":"Другой комплекс киназы mTOR, содержащий RICTOR и участвующий, в частности, в регуляции AKT. Отличать состав, субстраты и режим чувствительности к препаратам от mTORC1."},{"id":"S7-T03","term":"RAPTOR","section":0,"def":"Регуляторный белок mTORC1, участвующий в организации взаимодействий комплекса с Rag и субстратами. Это компонент комплекса, а не самостоятельная киназа mTOR."},{"id":"S7-T04","term":"S6K1","section":0,"def":"Рибосомальная S6-киназа 1, один из субстратов mTORC1 и регуляторов синтеза белка. Фосфорилирование T389 характеризует выбранную ветвь, но не всю активность mTORC1; S6K1 и её субстрат S6 различаются."},{"id":"S7-T05","term":"4E-BP1","section":0,"def":"Белок, связывающий фактор инициации eIF4E и ограничивающий зависимую от него инициацию трансляции. Эффект фосфорилирования зависит от совокупности участков; T37/46 нельзя считать единственным показателем всей трансляции."},{"id":"S7-T06","term":"ULK1","section":0,"def":"Протеинкиназа в комплексе инициации канонической макроаутофагии с ATG13, FIP200 и ATG101. Изменение одного участка не описывает всю активность комплекса; S758 человека соответствует S757 мыши."},{"id":"S7-T07","term":"TFEB","section":0,"def":"Транскрипционный фактор, регулирующий экспрессию части генов лизосомных белков и аутофагического аппарата. Ядерная доля, фосфорилирование и транскрипционный результат измеряются отдельно; S211 человека не переносится на TFE3."},{"id":"S7-T08","term":"Rag","section":0,"def":"Семейство малых ГТФаз, образующих гетеродимеры RagA/B с RagC/D и регулирующих взаимодействия mTORC1. Для основной конфигурации связывания RAPTOR важны RagA/B–GTP и RagC/D–GDP, а не GTP у обоих партнёров."},{"id":"S7-T09","term":"Ragulator","section":0,"def":"Комплекс лизосомной мембраны, организующий положение и регуляторные взаимодействия Rag-ГТФаз. Не является рецептором инсулина и не переносит фосфорильную группу на S6K1."},{"id":"S7-T10","term":"GATOR1 и GATOR2","section":0,"def":"GATOR1 — комплекс DEPDC5–NPRL2–NPRL3, ускоряющий гидролиз GTP у RagA/B и ограничивающий основную аминокислотную ветвь. GATOR2 — другой белковый комплекс этого пути, функционально противодействующий GATOR1. Функции двух комплексов различаются. Утрата одного из них не задаёт одинакового ответа всех субстратов mTORC1; механизмы взаимодействий с отдельными сенсорами также следует различать."},{"id":"S7-T11","term":"GAP","section":0,"def":"Белок или комплекс, ускоряющий гидролиз GTP у определённой ГТФазы. Он ускоряет гидролиз, а не является общим «активатором» всех функций ГТФазы; нужно назвать мишень."},{"id":"S7-T12","term":"FLCN","section":0,"def":"Фолликулин — белок, в комплексе с FNIP участвующий в регуляции нуклеотидного состояния RagC/D. Зависимость TFEB от FLCN отличается от требований S6K1; недостаточность FLCN не означает одинакового подавления всех субстратов."},{"id":"S7-T13","term":"PI3K классов I и III (VPS34)","section":0,"def":"PI3K класса I образует PIP₃ из PI(4,5)P₂ в рассматриваемой ростовой ветви. VPS34 — каталитическая субъединица PI3K класса III, образующая PI3P; в аутофагический комплекс входят также VPS15, Beclin1 и ATG14. Два класса киназ образуют разные липиды и работают в разных комплексах. PI3P в аппарате фагофора не тождествен PIP₃ ростовой ветви."},{"id":"S7-T14","term":"PIP₃","section":0,"def":"Фосфатидилинозитол-3,4,5-трисфосфат — мембранный липид, образуемый PI3K класса I. Он способствует связыванию белков с соответствующими доменами, но не фосфорилирует AKT как киназа."},{"id":"S7-T15","term":"AKT","section":0,"def":"Протеинкиназа, участвующая в передаче ростовых и других сигналов, включая регуляцию TSC2. Её действие на TSC2 не равнозначно прямому фосфорилированию RHEB."},{"id":"S7-T16","term":"TSC","section":0,"def":"Комплекс TSC1–TSC2–TBC1D7; TSC2, или туберин, выполняет GAP-функцию по отношению к RHEB. TSC1 — гамартин; изменения действия комплекса зависят от локализации и условий, а не только от наличия TSC2."},{"id":"S7-T17","term":"RHEB","section":0,"def":"Малая ГТФаза, GTP-связанная форма которой взаимодействует с mTORC1 и способствует его активации. RHEB нельзя считать постоянно закреплённой исключительно на лизосоме; она не является киназой S6K1."},{"id":"S7-T18","term":"Sestrin2","section":0,"def":"Сенсорный белок, связывающий лейцин и взаимодействующий с GATOR2 в основной рассматриваемой ветви. Не является единственным сенсором всех аминокислот во всех клетках."},{"id":"S7-T19","term":"CASTOR1","section":0,"def":"Белок, связывающий цитозольный аргинин и регулирующий взаимодействие с GATOR2. Отличать его от SLC38A9 в лизосомной мембране и от сенсора лейцина."},{"id":"S7-T20","term":"SAM","section":0,"def":"S-аденозилметионин — метаболит и донор метильных групп в ряде реакций, воспринимаемый SAMTOR. Концентрация SAM не тождественна концентрации метионина."},{"id":"S7-T21","term":"SAMTOR","section":0,"def":"Сенсор SAM, регулирующий взаимодействия с GATOR1–KICSTOR в пути mTORC1. В этом пути воспринимаемым метаболитом служит SAM, а не сам метионин; сенсорная функция не доказывает метилтрансферазной активности."},{"id":"S7-T22","term":"SLC38A9","section":0,"def":"Лизосомный мембранный белок, участвующий в распознавании аргинина и выходе ряда аминокислот, включая лейцин. Сигнальная функция и транспорт различаются; это не единственный путь выхода всех аминокислот."},{"id":"S7-T23","term":"KICSTOR","section":0,"def":"Комплекс KPTN–ITFG2–C12orf66–SZT2, участвующий в организации GATOR1-зависимой регуляции у лизосомы. Участие компонентов KICSTOR в этом комплексе не означает, что каждый из них служит отдельным сенсором лейцина или инсулина."},{"id":"S7-T24","term":"FNIP1","section":0,"def":"Белок, взаимодействующий с FLCN; его фосфорилирование AMPK связано с регуляцией TFEB в описанном стрессовом ответе. FNIP1 и FNIP2 — разные партнёры FLCN; механизм AMPK–FNIP1 не переносить на FNIP2 без проверки."},{"id":"S7-T25","term":"14-3-3","section":0,"def":"Семейство белков, связывающих определённые фосфорилированные участки и меняющих взаимодействия или распределение партнёров. Это не киназа и не универсальный экспортный рецептор; для TFEB важен конкретный фосфорилированный участок."},{"id":"S7-T26","term":"Колокализация","section":0,"def":"Совпадение распределения двух регистрируемых сигналов в пределах пространственного разрешения метода. Не доказывает прямое связывание белков, их одинаковую концентрацию или каталитическую активность."},{"id":"S7-T27","term":"Рапамицин","section":0,"def":"Соединение, которое в комплексе с FKBP12 связывается с FRB-областью mTOR и ограничивает часть его функций. Не ATP-конкурентный ингибитор; чувствительность зависит от сайта, клетки и срока; длительное воздействие может затрагивать mTORC2."},{"id":"S7-T28","term":"Torin1","section":0,"def":"ATP-конкурентный ингибитор киназы mTOR. Может подавлять mTORC1 и mTORC2; не считать селективным ингибитором только одной ветви при любых условиях."},{"id":"S7-T29","term":"FKBP12–FRB","section":0,"def":"FKBP12 связывает рапамицин; этот комплекс взаимодействует с FRB-областью mTOR. FRB — область белка mTOR, а не отдельный растворимый фермент; не смешивать её с ATP-связывающим участком."},{"id":"S7-T30","term":"Иммуноблоттинг","section":0,"def":"Метод выявления выбранного белка или его модификации с помощью антител после разделения белков. Интенсивность сигнала зависит от условий анализа; фосфосигнал сопоставляют с общим белком и подходящей нормировкой."},{"id":"S7-T31","term":"LAMP1","section":0,"def":"Лизосомный мембранный белок, часто используемый как маркер эндолизосомных структур. Его сигнал не измеряет непосредственно кислотность, гидролиз или число исключительно функциональных лизосом."},{"id":"S7-T32","term":"Фосфорилирование","section":0,"def":"Перенос фосфорильной группы на молекулу; в рассматриваемых реакциях белков его катализирует протеинкиназа. Это химическая модификация, направление функционального эффекта зависит от конкретной мишени и участка."},{"id":"S7-T33","term":"Аденилатный пул: ATP, ADP и AMP","section":1,"def":"Аденилатный пул — совокупность ATP, ADP и AMP в оговорённом образце или компартменте. ATP, аденозинтрифосфат, участвует в сопряжении реакций; ADP, аденозиндифосфат, образуется, в частности, при гидролизе ATP. AMP, аденозинмонофосфат, служит регуляторным лигандом AMPK. Нужно уточнять, измеряются содержание, концентрации или доли нуклеотидов. Энергетический эффект определяется всей реакцией и её условиями; содержание ATP не описывает энергетическое состояние полностью. Действия AMP и ADP на AMPK различаются. AMP не тождествен циклическому AMP и не служит здесь донором фосфорильной группы; разные компартменты и свободные формы нуклеотидов не объединяют автоматически."},{"id":"S7-T34","term":"Аденилаткиназа","section":1,"def":"Фермент, катализирующий обратимое перераспределение фосфорильных групп: 2 ADP ⇌ ATP + AMP. Прямое направление образует ATP и AMP; конкретное относительное усиление AMP не универсально."},{"id":"S7-T35","term":"Энергетический заряд","section":1,"def":"Отношение ([ATP] + 0,5[ADP]) к сумме [ATP] + [ADP] + [AMP], характеризующее состояние заданного аденилатного пула. Это расчётный показатель 0–1, а не лиганд AMPK и не полное измерение термодинамического состояния клетки."},{"id":"S7-T36","term":"AMPK и родственная киназа Snf1","section":1,"def":"AMPK, AMP-активируемая протеинкиназа, — комплекс α-, β- и γ-субъединиц, регулирующий метаболические процессы. Дрожжевая Snf1 — родственная протеинкиназа, участвующая в регуляции использования источников углерода. Название AMPK не исключает других путей активации. Snf1 — гомолог, а не непосредственно наблюдаемый предок AMPK; родство не означает одинаковой регуляции нуклеотидами. Действие AMPK на аутофагию и mTORC1 зависит от условий."},{"id":"S7-T37","term":"Аллостерическая регуляция","section":1,"def":"Изменение свойств белка при связывании лиганда с участком, функционально связанным с каталитическим центром. Лиганд не обязательно является субстратом реакции и не обязан изменять степень фосфорилирования."},{"id":"S7-T38","term":"LKB1","section":1,"def":"Протеинкиназа, кодируемая STK11 и в комплексе со STRAD/MO25 фосфорилирующая AMPK и другие киназы. Не является прямым сенсором AMP; потеря LKB1 не устраняет автоматически CaMKK2-зависимый вход."},{"id":"S7-T39","term":"Активационная петля","section":1,"def":"Участок киназного домена, состояние которого влияет на каталитическую активность; часто регулируется фосфорилированием. Для AMPKα2 человека используется Thr172, для α1 человека соответствующий номер Thr183; обозначение лабораторного антитела проверять."},{"id":"S7-T40","term":"Метаболический поток","section":1,"def":"Скорость прохождения вещества через определённую реакцию или путь при заданных условиях. Содержание промежуточного метаболита и регуляторная модификация не равны потоку."},{"id":"S7-T41","term":"Альдолаза","section":1,"def":"Фермент гликолиза, расщепляющий фруктозо-1,6-бисфосфат и в описанном пути участвующий в его восприятии. Её каталитическая и сенсорная функции различаются; не объявлять единственным механизмом всех ответов на глюкозу."},{"id":"S7-T42","term":"FBP","section":1,"def":"Фруктозо-1,6-бисфосфат — промежуточный метаболит гликолиза, связываемый альдолазой. Отличать от фруктозо-2,6-бисфосфата, который имеет другую регуляторную функцию."},{"id":"S7-T43","term":"AXIN","section":1,"def":"Каркасный белок, участвующий в организации ряда сигнальных комплексов, включая описанную лизосомную ветвь LKB1–AMPK. Каркасная роль не равна киназному действию и не ограничена одним путём."},{"id":"S7-T44","term":"V-ATPase","section":1,"def":"Вакуолярная H⁺-ATPase — комплекс, использующий гидролиз ATP для переноса протонов и участвующий в поддержании кислотности. Кислотность зависит и от других свойств компартмента; это не протеаза и не самостоятельный маркер гидролиза."},{"id":"S7-T45","term":"CaMKK2","section":1,"def":"Ca²⁺/кальмодулин-зависимая протеинкиназа-киназа 2, способная фосфорилировать AMPK в подходящем клеточном контексте. Старое обозначение CaMKKβ относится к этому белку; путь не одинаково выражен во всех тканях."},{"id":"S7-T46","term":"Кальмодулин","section":1,"def":"Ca²⁺-связывающий регуляторный белок, взаимодействующий с рядом ферментов и других партнёров. Не является CaMKK2; Ca²⁺ служит сигналом, а не донором фосфорильной группы."},{"id":"S7-T47","term":"PGC-1α","section":1,"def":"Транскрипционный коактиватор, участвующий в программах окислительного метаболизма и митохондриального биогенеза. Рост его РНК не является сам по себе полным измерением образования митохондрий."},{"id":"S7-T48","term":"MFF","section":1,"def":"Белок наружной митохондриальной мембраны, участвующий в привлечении аппарата деления митохондрий и регулируемый AMPK. Деление, биогенез и митофагия — разные процессы."},{"id":"S7-T49","term":"Биогенез","section":1,"def":"Образование компонентов и структур органеллы, требующее синтеза и организации белков, липидов и других составляющих. Увеличение содержания органелл может отражать также снижение удаления; механизм и соответствующие измерения нужно различать."},{"id":"S7-T50","term":"ВЭЖХ/масс-спектрометрия","section":1,"def":"ВЭЖХ разделяет компоненты смеси, а масс-спектрометрия выявляет и оценивает молекулярные формы по их массам и другим характеристикам. Это разные, часто сочетаемые методы; количественная оценка требует подготовки образца, стандартов и нормировки."},{"id":"S7-T51","term":"AICAR/ZMP","section":1,"def":"В фармакологическом контексте AICAR обычно означает рибозид, который в клетке может превращаться в ZMP — AMP-подобный нуклеотид. AICAR и ZMP не взаимозаменяемые названия одной формы; действие не ограничено исключительно AMPK."},{"id":"S7-T52","term":"Метформин","section":1,"def":"Препарат, который влияет на клеточный метаболизм и в определённых условиях может менять активность AMPK. Эти эффекты нельзя свести к единственной цепи «комплекс I → AMP → AMPK»: механизм, включая косвенное влияние на AMPK, зависит от клеточной системы, дозы и времени воздействия."},{"id":"S7-T53","term":"Дорсоморфин (Compound C)","section":1,"def":"Соединение, которое в ряде исследований используют как ингибитор AMPK. Оно действует и на другие киназы, поэтому эффект одного дорсоморфина не доказывает специфической зависимости от AMPK."},{"id":"S7-T54","term":"PRKAG2","section":1,"def":"Ген γ2-субъединицы AMPK, определённые варианты которого связаны с наследственным сердечным синдромом. Не приписывать любому варианту одинаковое действие; ген и белковая субъединица — разные сущности."},{"id":"S7-T55","term":"ACC","section":1,"def":"Ацетил-CoA-карбоксилаза — биотин-зависимый фермент образования малонил-CoA; различаются ACC1 и ACC2. Изоформы и фосфосайты уточнять: пример Fullerton 2013 — мыши Acc1 Ser79 и Acc2 Ser212."},{"id":"S7-T56","term":"Ацетил-CoA","section":2,"def":"Тиоэфир коэнзима A и ацетильной группы, участвующий во многих реакциях обмена. Различать молекулу-переносчик и переносимую группу; принадлежность компартменту существенна."},{"id":"S7-T57","term":"Малонил-CoA","section":1,"def":"Тиоэфир коэнзима A и малонильной группы; субстрат синтеза жирных кислот и ингибитор CPT1. Содержание, скорость образования и локальная доступность различаются; не называть единственным регулятором всего окисления."},{"id":"S7-T58","term":"Биотин","section":2,"def":"Кофактор карбоксилаз, участвующий в переносе активируемой карбоксильной группы. В ACC связан с белком; не является источником ATP или заменой ацетил-CoA."},{"id":"S7-T59","term":"Синтез жирных кислот de novo и FASN","section":2,"def":"Синтез жирных кислот de novo — образование новых жирных кислот из более коротких углеродных предшественников. FASN, синтаза жирных кислот млекопитающих, — многофункциональный фермент, использующий малонил-CoA при построении ацильной цепи. ACC образует малонил-CoA, а FASN использует его в последующих реакциях; это разные ферменты. Синтез новой ацильной цепи следует отличать от образования триацилглицеролов из уже имеющихся жирных кислот."},{"id":"S7-T60","term":"CPT1","section":2,"def":"Карнитин-пальмитоилтрансфераза 1; митохондриальные CPT1A/B переносят ацильную группу с CoA на карнитин. Не транспортёр внутренней мембраны; чувствительность к малонил-CoA и тканевое распределение изоформ различаются."},{"id":"S7-T61","term":"CACT","section":2,"def":"Карнитин-ацилкарнитиновая транслоказа внутренней митохондриальной мембраны, кодируемая SLC25A20. Переносит ацилкарнитин и карнитин, а не выполняет реакцию ACC или CPT1."},{"id":"S7-T62","term":"CPT2","section":2,"def":"Карнитин-пальмитоилтрансфераза 2, восстанавливающая ацил-CoA на матриксной стороне внутренней мембраны. Место и направление реакции отличаются от CPT1; это не сам мембранный транспортёр CACT."},{"id":"S7-T63","term":"Карнитиновый челнок","section":2,"def":"Система реакций CPT1 и CPT2 и переноса ацилкарнитина белком CACT, обеспечивающая доставку длинноцепочечной ацильной группы в матрикс митохондрии. Необходимость этой системы зависит от длины цепи, формы субстрата и ткани. Внутреннюю мембрану пересекает ацилкарнитин; CoA не проходит через неё вместе с ацильной группой."},{"id":"S7-T64","term":"Ацилкарнитин","section":2,"def":"Соединение карнитина с ацильной группой, участвующее в её переносе и других метаболических превращениях. Не равен ацил-CoA; накопление не является само по себе измерением полного β-окисления."},{"id":"S7-T65","term":"β-окисление","section":2,"def":"Последовательное укорочение ацильной цепи с образованием ацетил-CoA и восстановительных эквивалентов. Зависит от субстрата, ферментов и реокисления коферментов; карнитиновый перенос — предшествующий этап для соответствующих субстратов."},{"id":"S7-T66","term":"CPT1C","section":2,"def":"Паралог CPT1, выраженный преимущественно в нервной системе и связанный главным образом с ЭПР. По функции в митохондриальном карнитиновом челноке CPT1C не равнозначна CPT1A и CPT1B."},{"id":"S7-T67","term":"Изоформа","section":2,"def":"Один из вариантов белка, различающихся последовательностью, происхождением или распределением; конкретное основание различия нужно назвать. ACC1/ACC2 и CPT1A/B/C кодируются разными генами; термин не означает взаимозаменяемости."},{"id":"S7-T68","term":"Длинноцепочечная жирная кислота","section":2,"def":"Жирная кислота с относительно длинной углеродной цепью; здесь основной пример — пальмитат C16. Границы категории зависят от принятой классификации; в модели важен названный субстрат, а не одно общее слово."},{"id":"S7-T69","term":"Среднецепочечная жирная кислота","section":2,"def":"Жирная кислота средней длины цепи; здесь пример — октаноат C8. Использование свободной формы без карнитина тканеспецифично; не делать вывод о диете из одного препарата ткани."},{"id":"S7-T70","term":"Этомоксир","section":2,"def":"Соединение, используемое для ингибирования CPT1 после образования активной формы в клетке. При высоких концентрациях возможны другие действия, включая нарушение обмена CoA; селективность проверяется в выбранной системе."},{"id":"S7-T71","term":"Изотопный индикатор","section":2,"def":"Меченый атомами определённого изотопа субстрат, по распределению метки которого изучают превращения вещества. Метка в промежуточном пуле не равна автоматически полному окислению; расчёт потока требует модели и условий."},{"id":"S7-T72","term":"SREBP1c","section":2,"def":"Транскрипционный фактор, участвующий в регуляции экспрессии генов синтеза липидов, особенно в обсуждаемом печёночном контексте. Результат действия инсулина может включать mTORC1-зависимые и независимые звенья."},{"id":"S7-T73","term":"PPARα","section":2,"def":"Ядерный рецептор, регулирующий экспрессию ряда генов окислительного метаболизма в зависимости от лигандов и ткани. Экспрессия фермента и мгновенная скорость реакции различаются; не считать любое голодание прямым связыванием рецептора с одним лигандом."},{"id":"S7-T74","term":"MCAD","section":2,"def":"Дегидрогеназа среднецепочечных ацил-CoA — фермент одной из реакций митохондриального β-окисления. Недостаточность MCAD нарушает последующую реакцию β-окисления и отличается от дефектов CPT1 и CPT2; клинические проявления этих состояний могут различаться."},{"id":"S7-T75","term":"Макроаутофагия","section":3,"def":"Путь доставки цитоплазматического материала к лизосомному расщеплению через образование аутофагосомы. В основной схеме рассматривается канонический аппарат; аутофагия не является синонимом клеточной гибели."},{"id":"S7-T76","term":"Фагофор","section":3,"def":"Растущая, ещё не замкнутая мембранная структура, охватывающая материал для макроаутофагии. Не путать с замкнутой аутофагосомой и аутолизосомой; расширение требует доставки и организации мембранных компонентов."},{"id":"S7-T77","term":"Аутофагический поток","section":3,"def":"Скорость прохождения материала через заданные этапы аутофагического пути, часто до лизосомной деградации. Всегда уточнять измеряемый материал и конечный этап; число точек и содержание LC3-II не заменяют поток автоматически."},{"id":"S7-T78","term":"PI3P","section":3,"def":"Фосфатидилинозитол-3-фосфат — мембранный липид, связываемый определёнными эффекторными белками. Не равен PIP₃ и не является свободным неорганическим фосфатом."},{"id":"S7-T79","term":"WIPI2","section":3,"def":"PI3P-связывающий белок, участвующий в организации аутофагического аппарата и привлечении ATG16L1-комплекса. Роль связывания липида отличается от образования самого PI3P комплексом VPS34."},{"id":"S7-T80","term":"ATG2","section":3,"def":"Белок переноса липидов, участвующий в контактах мембран и расширении фагофора. Не канал для прохода грузового белка в лизосому."},{"id":"S7-T81","term":"ATG9","section":3,"def":"Мембранный белок со скрамблазной активностью, участвующий в формировании аутофагической мембраны. Перераспределяет липиды между слоями мембраны; не синтезирует липиды вместо ферментов обмена."},{"id":"S7-T82","term":"ATG16L1-комплекс","section":3,"def":"Комплекс ATG12–ATG5–ATG16L1, организующий липидирование ATG8/LC3 в рассматриваемой системе. Его E3-подобная роль не означает убиквитинирования LC3."},{"id":"S7-T83","term":"LC3-I/LC3-II","section":3,"def":"LC3-I — растворимая обработанная форма; LC3-II — липидированная форма, связанная с мембраной. Это формы маркера, а не количественный эквивалент всего груза; разные пути липидирования требуют отдельного контекста."},{"id":"S7-T84","term":"ATG7 и ATG3","section":3,"def":"ATG7 — E1-подобный фермент систем конъюгации, участвующий, в частности, в активации LC3. ATG3 — E2-подобный фермент, участвующий в последующем переносе LC3 для присоединения к липиду. ATG7 и ATG3 выполняют разные этапы конъюгации. Утрата ATG7 нарушает выбранный канонический аппарат, но не удаляет все лизосомные реакции; ATG3 не является протеазой или фосфатазой."},{"id":"S7-T85","term":"PE","section":3,"def":"Фосфатидилэтаноламин — мембранный липид, к которому присоединяется LC3 в основной канонической схеме. Не считать белком или свободной жирной кислотой; возможные иные липидные связи обсуждаются отдельно."},{"id":"S7-T86","term":"Оборот LC3-II","section":3,"def":"Образование и удаление липидированной формы LC3 за заданное время. Не равен автоматически потоку расщепления всего белкового груза; нужно учитывать делипидирование и лизосомное удаление."},{"id":"S7-T87","term":"Аутофагосома","section":3,"def":"Замкнутая структура с двумя мембранами, содержащая захваченный цитоплазматический материал. Её наличие не доказывает завершения гидролиза; внешняя мембрана участвует в слиянии с лизосомным компартментом."},{"id":"S7-T88","term":"Аутолизосома","section":3,"def":"Структура, возникшая после слияния аутофагосомы с лизосомным или эндолизосомным компартментом. Слияние, pH и степень расщепления содержимого — разные признаки."},{"id":"S7-T89","term":"SNARE","section":3,"def":"Белки мембранного слияния; выбранный пример аппарата включает STX17, SNAP29 и VAMP8. Не единственный набор для каждого аутофагического слияния; участие HOPS и RAB7 рассматривается отдельно."},{"id":"S7-T90","term":"Лизосомные гидролазы и протеазы","section":3,"def":"Гидролаза катализирует расщепление определённой связи с участием воды. Лизосомные протеазы, включая соответствующие катепсины, — гидролазы, расщепляющие белки; другие лизосомные гидролазы действуют на иные субстраты. Кислая среда не заменяет отсутствующий фермент и его субстратную специфичность. В эксперименте с блокадой протеолиза нужно назвать ингибиторную комбинацию и полноту подавления; протеазы не обозначают все гидролазы."},{"id":"S7-T91","term":"Бафиломицин A1","section":3,"def":"Ингибитор V-ATPase, нарушающий поддержание кислой среды эндолизосомных компартментов. Может влиять на слияние и сигнальные процессы; не считать селективным измерительным выключателем одной реакции."},{"id":"S7-T92","term":"Восстановление лизосомного пула","section":3,"def":"Образование лизосомных структур из аутолизосом, описанное как autophagic lysosome reformation, ALR. Отличать от TFEB-зависимой экспрессии компонентов; время и необходимость конкретных регуляторов зависят от системы."},{"id":"S7-T93","term":"Контроль","section":3,"def":"Сопоставимое условие или образец, позволяющие проверить интерпретацию измерения и действие вмешательства. Нужно назвать, что сохранено и что изменено; генетическое восстановление, контроль количества нанесённого белка и растворитель решают разные задачи."},{"id":"S7-T94","term":"Тандемный репортёр LC3","section":3,"def":"Конструкция из двух флуорофоров и LC3, используемая для различения сигналов в условиях созревания компартментов. mRFP исходной работы и mCherry варианта семинара различаются; цвет чувствителен к среде и не равен полному потоку."},{"id":"S7-T95","term":"GAA","section":3,"def":"Кислая α-глюкозидаза — лизосомный фермент гидролиза гликогена. Недостаточность GAA не равна первичной утрате ATG7; это не протеаза белкового груза."},{"id":"S7-T96","term":"Болезнь Помпе","section":3,"def":"Наследственное заболевание, связанное с недостаточностью GAA и накоплением гликогена в лизосомах. Первичный ферментный дефект следует отличать от вторичных нарушений аутофагии."},{"id":"S7-T97","term":"HMGCR","section":1,"def":"3-гидрокси-3-метилглутарил-CoA-редуктаза — фермент образования мевалоната в пути синтеза стеролов. Его AMPK-зависимое ингибирование не следует путать с реакцией ACC или прямым синтезом ATP."},{"id":"S7-T98","term":"p62/SQSTM1","section":3,"def":"Белок-рецептор, участвующий в связывании части аутофагического груза и взаимодействиях с аппаратом ATG8/LC3. Его содержание зависит от экспрессии и деградации; оно не заменяет универсально измерение потока."},{"id":"S7-T99","term":"Мукополисахаридозы","section":3,"def":"Группа наследственных болезней накопления, при классических формах которых нарушено лизосомное расщепление определённых гликозаминогликанов. У каждой формы нужно различать накапливающийся субстрат, фермент, активность которого снижена, и первичный генетический дефект. Болезнь Помпе — другое заболевание: при ней снижена активность GAA и накапливается гликоген."}],"sources":{"Abu2001":{"url":"https://doi.org/10.1126/science.1056843","cite":"Abu-Elheiga L. et al. Continuous fatty acid oxidation and reduced fat storage in mice lacking acetyl-CoA carboxylase 2. Science. 2001;291:2613–2616. doi:10.1126/science.1056843","doi":"10.1126/science.1056843","pmid":"11283375"},"Alesi2021":{"url":"https://doi.org/10.1038/s41467-021-24499-6","cite":"Alesi N. et al. TSC2 regulates lysosome biogenesis via a non-canonical RAGC and TFEB-dependent mechanism. Nat Commun. 2021;12:4245. doi:10.1038/s41467-021-24499-6","doi":"10.1038/s41467-021-24499-6","pmid":""},"Angarola2019":{"url":"https://doi.org/10.1091/mbc.E19-03-0146","cite":"Angarola B., Ferguson S. M. Weak membrane interactions allow Rheb to activate mTORC1 signaling without major lysosome enrichment. Mol Biol Cell. 2019;30:2750–2760. doi:10.1091/mbc.E19-03-0146","doi":"10.1091/mbc.E19-03-0146","pmid":"31532697"},"Arad2003":{"url":"https://doi.org/10.1161/01.CIR.0000075270.13497.2B","cite":"Arad M. et al. Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy. Circulation. 2003;107:2850–2856. doi:10.1161/01.CIR.0000075270.13497.2B","doi":"10.1161/01.CIR.0000075270.13497.2B","pmid":"12782567"},"BarPeled2013":{"url":"https://doi.org/10.1126/science.1232044","cite":"Bar-Peled L. et al. A tumor suppressor complex with GAP activity for the Rag GTPases that signal amino acid sufficiency to mTORC1. Science. 2013;340:1100–1106. doi:10.1126/science.1232044","doi":"10.1126/science.123204   series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}
