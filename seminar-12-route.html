p":"UBA"}},"1-0":{"n":{"sub":"base","sig":"base","p62":"on","prot":"off","aut":"on"},"t":{"sub":"скопление\nмолекул","sig":"цепи K63","p62":"p62:\nолигомер"},"e":{"s_p":"on","sig_p":"on","p_prot":"off","p_aut":"on"},"m":[["Состояние p62","олигомер, тельца p62"],["Маршрут","аутофагия"]],"note":"Цепи K63 вызывают олигомеризацию p62 по домену PB1 и фазовое разделение: образуются тельца p62, которые привлекают мембраны аутофагии через LIR (Sun 2018; Zaffagnini 2018).","et":{"s_p":"UBA"}},"1-1":{"n":{"sub":"base","sig":"on","p62":"on","prot":"abs","aut":"on"},"t":{"sub":"скопление\nмолекул","sig":"цепи K63 +\nмного свободного Ub","p62":"p62:\nолигомер"},"e":{"s_p":"on","sig_p":"on","p_prot":"off","p_aut":"on"},"m":[["Состояние p62","олигомер"],["Маршрут","аутофагия"]],"note":"Скопление с цепями K63 и без того идёт в аутофагию; подавление протеасомы дополнительно повышает уровень свободного убиквитина.","et":{"s_p":"UBA"}},"2-0":{"n":{"sub":"base","sig":"on","p62":"on","prot":"low","aut":"on"},"t":{"sub":"субстрат\nс цепями Ub","sig":"много свободного\nубиквитина","p62":"p62:\nолигомер"},"e":{"s_p":"on","sig_p":"on","p_prot":"on","p_aut":"on"},"m":[["Состояние p62","олигомер"],["Маршрут","преимущественно аутофагия"]],"note":"При высокой концентрации свободного убиквитина (тепловой шок, длительное подавление протеасомы) убиквитинируется сам p62: UBA-зависимая димеризация нарушается, и олигомеры направляют груз в аутофагию (Pohl, Dikic 2019).","et":{"s_p":"UBA"}},"2-1":{"n":{"sub":"base","sig":"on","p62":"on","prot":"abs","aut":"on"},"t":{"sub":"субстрат\nс цепями Ub","sig":"много свободного\nубиквитина","p62":"p62:\nолигомер"},"e":{"s_p":"on","sig_p":"on","p_prot":"off","p_aut":"on"},"m":[["Состояние p62","олигомер"],["Маршрут","аутофагия"]],"note":"Подавление протеасомы закрывает основной путь и усиливает убиквитиновый стресс: свободного убиквитина становится больше (Pohl, Dikic 2019).","et":{"s_p":"UBA"}},"3-0":{"n":{"sub":"base","sig":"on","p62":"on","prot":"off","aut":"on"},"t":{"sub":"субстрат\nс N-дегроном","sig":"N-дегрон:\nArg на N-конце","p62":"p62:\nолигомер\n(ZZ, S–S)"},"e":{"s_p":"on","sig_p":"on","p_prot":"off","p_aut":"on"},"m":[["Состояние p62","олигомер с дисульфидными связями"],["Олигомеризация","не зависит от Ub"]],"note":"Аргинилированный BiP связывается с доменом ZZ: p62 образует олигомеры, стабилизированные дисульфидными мостиками, и сильнее связывается с LC3 (Cha-Molstad 2015; Pohl, Dikic 2019).","et":{"s_p":"ZZ"}},"3-1":{"n":{"sub":"base","sig":"on","p62":"on","prot":"abs","aut":"on"},"t":{"sub":"субстрат\nс N-дегроном","sig":"N-дегрон:\nArg на N-конце","p62":"p62:\nолигомер\n(ZZ, S–S)"},"e":{"s_p":"on","sig_p":"on","p_prot":"off","p_aut":"on"},"m":[["Состояние p62","олигомер"],["Олигомеризация","не зависит от Ub"]],"note":"Аргинилирование BiP индуцируется вместе с аутофагией при подавлении протеасомы (Cha-Molstad 2015).","et":{"s_p":"ZZ"}}},"fs":15,"nfs":13,"lfs":14,"zfs":14,"nlfs":12,"nzfs":12}}},{"id":"route-measure","number":24,"section":3,"title":"Как определить маршрут конкретного белка","question":4,"questions":[4],"keywords":["период полужизни","циклогексимид","MG132","бортезомиб","бафиломицин A1","SAR405","CB-5083","кифунензин","ингибиторный анализ","ATG7"],"lead":["Маршрут белка определяют сравнением: как меняются его количество и скорость исчезновения, когда маршруты выключают по очереди. Один препарат показывает, что маршрут участвует, но не его долю."],"mechanism":["[[T60|Период полужизни]] — измеряют по убыли белка после остановки синтеза циклогексимидом.","[[T59|Ингибиторы]] протеасомы, лизосомы, p97 и маннозидазы ЭПР — закрывают маршруты по очереди; накопление белка указывает, какой маршрут вносит вклад в его удаление.","Генетические контроли — клетки ATG7⁻/⁻ и нокаут рецептора — проверяют специфичность, потому что препараты действуют не только на свою мишень."],"paragraphs":["Исходный вопрос: каким путём удаляется белок X. Сначала измеряют период полужизни: синтез белка останавливают циклогексимидом и определяют X на иммуноблоте в нескольких точках; скорость спада даёт период полужизни. Для субстратов убиквитин-протеасомной системы периоды полужизни лежат в диапазоне от секунд до часов (Pohl, Dikic 2019).","Затем измерение повторяют с ингибиторами. Накопление X при подавлении протеасомы (MG132, бортезомиб) согласуется с вкладом протеасомы; накопление при бафиломицине A1 или SAR405 согласуется с вкладом лизосомного пути. Кифунензин останавливает оборот белков ЭПР, зависящих от маннозидазы (Liu 1999), а CB-5083 подавляет p97 (Anderson 2015). Клетки без ATG7 или без рецептора подтверждают результат независимо от препарата.","Каждый препарат действует шире мишени. MG132 in vitro подавляет и кальпаин (Tsubuki 1996); SAR405 — ингибитор VPS34: подавляет образование аутофагосом и транспорт поздних эндосом и лизосом (Ronan 2014); бафиломицин A1 в клетках Drosophila блокирует слияние аутофагосом с лизосомами независимо от pH (Mauvezin 2015); CB-5083 вызывает общий протеотоксический стресс (Anderson 2015). Для слитых с HaloTag белков есть альтернатива циклогексимиду — импульс-погоня, которую авторы описали как нетоксичную (Merrill 2019).","Подавление одного маршрута усиливает другие, поэтому при длительной обработке накопление отражает уже перестроенную систему (Pohl, Dikic 2019). Вывод «X удаляет протеасома» становится надёжнее, если его подтверждают вторым препаратом и нокаутом; доля маршрута таким сравнением не определяется."],"trap":["Если белок накапливается при добавлении MG132, его удаляет протеасома и никакой другой путь.","Накопление при MG132 согласуется с участием протеасомы, но MG132 подавляет и кальпаин (Tsubuki 1996), а при длительном воздействии усиливаются другие маршруты (Pohl, Dikic 2019). Мишень подтверждают ингибитором другого класса и генетическим контролем, а долю маршрута измеряют отдельно."],"conditions":"Схема метода, условные пиктограммы: кривые и полосы показывают логику сравнения, а не данные эксперимента. Данные о препаратах: MG132 — очищенные ферменты, клетки PC12 и эритроциты кролика (Tsubuki 1996, реферат); SAR405 — опухолевые клетки (Ronan 2014, реферат); бафиломицин A1 — жировое тело Drosophila (Mauvezin 2015, реферат); CB-5083 — опухолевые клетки (Anderson 2015, реферат); кифунензин — гепатомные клетки, α1-антитрипсин (Liu 1999, реферат); циклогексимид — Merrill 2019 (реферат); избыточность рецепторов — обзор Adriaenssens 2022. Положение блока кифунензином относительно убиквитинирования выведено из порядка этапов и в рефератах прямо не показано.","sources":["PohlDikic2019","Tsubuki1996","Mauvezin2015","Ronan2014","Anderson2015","Liu1999","Merrill2019","Adriaenssens2022"],"quiz":{"id":"S12-L24","rev":2,"question":"В клетках на фоне циклогексимида уровень белка X за 6 ч упал, а при добавлении MG132 остался близким к исходному. Какой вывод допустим?","options":[{"id":"S12-L24-1","text":"Исчезновение X чувствительно к MG132, что согласуется с вкладом протеасомы; мишень и доли других маршрутов этим сравнением не установлены.","correct":true,"feedback":"Результат совместим с участием протеасомы, но MG132 действует и на другие протеазы (Tsubuki 1996). Мишень подтверждают ингибитором другого класса или генетически."},{"id":"S12-L24-2","text":"X удаляется только протеасомой, так как MG132 действует исключительно на протеасому.","correct":false,"feedback":"MG132 — пептидный альдегид: in vitro он подавляет и кальпаин (Tsubuki 1996), поэтому одного такого результата для вывода «только протеасома» недостаточно."},{"id":"S12-L24-3","text":"X удаляется аутофагией, так как при MG132 лизосомный путь всегда подавляется.","correct":false,"feedback":"Подавление протеасомы, напротив, может усиливать аутофагию (Pohl, Dikic 2019), поэтому утверждение «всегда» неверно. Сохранение X при MG132 согласуется с вкладом протеасомы, но само по себе его не доказывает: MG132 подавляет и кальпаин (Tsubuki 1996)."}]},"widget":{"kind":"cards","title":"","s":{"title":"Определение маршрута белка: измерения и контроли","status":"Схема метода · условные пиктограммы","opts_label":"Метод","opts":["Порядок эксперимента","Период полужизни","Ингибиторы протеасомы","Ингибиторы лизосомы","Ингибиторы ERAD и p97","Генетические контроли"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"fixed":"Кривые и полосы на пиктограммах условные: они показывают логику сравнения, а не данные эксперимента.","cards":[{"v":["Какой маршрут удаляет белок X: по сравнению скорости убыли X в клетках без обработки, с одним ингибитором и с двумя.","Клетки делят на группы: контроль, один ингибитор, два ингибитора, нокауты. Добавляют циклогексимид и берут пробы через интервалы времени.","Контрольный белок с известным коротким временем жизни; белок для нормировки загрузки; группа без обработки.","Каждый шаг даёт вывод только вместе с остальными: один препарат или одна точка времени маршрут не подтверждают."],"note":"Порядок: группы, остановка синтеза, пробы, иммуноблот, расчёт периода полужизни. Дальше карточки показывают, что даёт и чего не даёт каждый шаг.","pic":{"kind":"steps","steps":["Группы:\nконтроль,\nингибиторы,\nнокауты","Циклогексимид:\nстоп синтеза","Пробы\nчерез\nинтервалы","Иммуноблот\nX и нагрузки","Период\nполужизни"],"hl":0,"cap":"учебная схема"}},{"v":["Время, за которое количество X падает вдвое после остановки синтеза белка.","Циклогексимид подавляет синтез белка; X определяют иммуноблотом в нескольких точках; по спаду строят кривую и находят период полужизни.","Белок с известным периодом полужизни; нормировка на белок с постоянным уровнем; независимые повторы.","Кривая показывает скорость исчезновения X, но не путь. Для слитых с HaloTag белков альтернатива циклогексимиду — импульс-погоня, описанная как нетоксичная (Merrill 2019)."],"note":"Кривые условные: при подавлении протеасомы спад замедляется сильно, при подавлении лизосомы — слабо. Такая картина согласуется с вкладом протеасомы; доли маршрутов она не даёт.","pic":{"kind":"lines","xlab":"время после циклогексимида, ч","ylab":"X, % от исходного","xmax":8,"ymax":100,"xticks":[0,2,4,6,8],"yticks":[0,50,100],"series":[{"name":"контроль","pts":[[0,100],[2,60],[4,36],[6,22],[8,13]],"dy":14},{"name":"+ ингибитор протеасомы","pts":[[0,100],[2,94],[4,88],[6,82],[8,77]],"dy":-8},{"name":"+ ингибитор лизосомы","pts":[[0,100],[2,66],[4,42],[6,27],[8,18]],"dash":true,"dy":-14}],"cap":"условные кривые"}},{"v":["Вклад протеасомы: накапливается ли X вместе с убиквитинированными формами, когда протеасома подавлена.","Клетки обрабатывают MG132 или бортезомибом, готовят лизат и определяют X и убиквитин на иммуноблоте.","Второй ингибитор другой химической природы; короткая и длительная обработка; контроль нагрузки геля (например, актин на том же блоте).","MG132 подавляет и кальпаин, особенно при высоких концентрациях (Tsubuki 1996). При длительном воздействии усиливаются синтез субъединиц протеасомы и аутофагия (Pohl, Dikic 2019)."],"note":"Полосы условные: при обоих ингибиторах X и его убиквитинированные формы накапливаются. Это согласуется с участием протеасомы, но не доказывает его и не означает, что других маршрутов нет.","pic":{"kind":"blot","rows":[["белок X",[0.25,0.9,0.85]],["X с цепями Ub",[0.1,0.85,0.8]]],"lanes":["контроль","MG132","бортезомиб"],"cap":"условные полосы"}},{"v":["Вклад лизосомного пути: накапливается ли X, когда лизосомная деградация или образование аутофагосом подавлено.","Клетки обрабатывают бафиломицином A1 (подавляет V-ATPase) или SAR405 (подавляет VPS34); X определяют иммуноблотом; в отдельной группе добавляют MG132.","Группа с двумя ингибиторами (протеасома и лизосома); клетки без ATG7 как независимое подтверждение; нагрузка геля.","Бафиломицин A1 в клетках Drosophila блокирует слияние независимо от pH (Mauvezin 2015); SAR405 подавляет VPS34 и затрагивает поздние эндосомы (Ronan 2014). Накопление X не показывает, каким путём груз попал в лизосому. Для α1-антитрипсина Z растворимую фракцию удаляет ERAD, а полимеры — лизосомные пути (Fregno 2018)."],"note":"Полосы условные: накопление X при бафиломицине A1 и SAR405 согласуется с вкладом лизосомного пути; наибольший уровень получается при подавлении обоих основных маршрутов.","pic":{"kind":"blot","rows":[["белок X",[0.3,0.7,0.65,1.0]],["нагрузка",[0.7,0.7,0.7,0.7]]],"lanes":["контроль","бафило-\nмицин A1","SAR405","MG132 +\nбафилом."],"cap":"условные полосы"}},{"v":["Вклад ERAD: накапливается ли белок ЭПР X, когда выведение в цитозоль заблокировано.","Кифунензин подавляет маннозидазу ЭПР, а CB-5083 — p97; клетки лизируют и определяют X и его убиквитинированные формы.","Неправильно свёрнутый растворимый гликопротеин ЭПР с известным оборотом, например α1-антитрипсин (Liu 1999); контроль без обработки; второй препарат.","Кифунензин останавливал оборот неправильно свёрнутого α1-антитрипсина в гепатомных клетках (Liu 1999); полимеры ATZ ERAD не принимает (Fregno 2018). CB-5083 задерживает субстраты ERAD, но вызывает общий протеотоксический стресс (Anderson 2015). Накопление X не отличает ERAD от других процессов с p97."],"note":"Полосы условные: кифунензин блокирует до убиквитинирования (убиквитинированных форм не прибавляется), CB-5083 блокирует после (они накапливаются). Положение блока выведено из порядка этапов.","pic":{"kind":"blot","rows":[["белок X",[0.3,0.85,0.9]],["X с цепями Ub",[0.12,0.1,0.85]]],"lanes":["контроль","кифунензин","CB-5083"],"cap":"условные полосы"}},{"v":["Специфичность вывода: подтверждает ли отсутствие аутофагии или рецептора результат, полученный с препаратами.","Сравнивают X в клетках дикого типа, клетках без ATG7 (не завершается присоединение белков ATG8) и клетках без одного рецептора.","Возвращение гена в нокаутные клетки; тот же эксперимент с MG132 в нокаутных клетках.","Нокаут одного рецептора может не изменить уровень X, если рецепторы перекрываются по функциям (Adriaenssens 2022)."],"note":"Полосы условные: X накапливается без ATG7 и слабо меняется при нокауте одного рецептора. Это не означает, что рецептор не нужен: возможно, его функцию выполняет другой.","pic":{"kind":"blot","rows":[["белок X",[0.3,0.85,0.4]],["нагрузка",[0.7,0.7,0.7]]],"lanes":["дикий тип","ATG7⁻/⁻","нокаут\nрецептора"],"cap":"условные полосы"}}]}}},{"id":"methods","number":25,"section":4,"title":"Как выбрать величину, метод и контроль","question":null,"questions":[1,2,3,4],"keywords":["измеряемая величина","метод","контроль","граница вывода","иммунопреципитация","mt-Keima","галектин-3","ингибиторный анализ","период полужизни","генетическое выключение"],"lead":["В каждом из четырёх вопросов семинара наблюдают разное: связывание, положение белка в клетке, доставку в лизосому, скорость исчезновения. Это разные величины, и каждую измеряют своим методом.","Вывод о механизме получают только из сочетания величины, метода и контроля, а не из одного показания."],"mechanism":["Метод регистрирует определённое свойство: связывание двух белков, положение сигнала, долю доставки в кислый отсек, содержание белка во времени.","Одно и то же показание допускает несколько объяснений: исчезновение белка внешней мембраны митохондрии возможно и при митофагии, и при разрушении в протеасоме.","Контроль и генетическое выключение звена сужают число объяснений, но вывод остаётся относящимся к данной системе и данным условиям."],"paragraphs":["Сначала выбирают величину, затем метод. Связывание [[T02|рецептора]] с убиквитином или с [[T03|белком ATG8]] выявляют иммунопреципитацией или реконструкцией из очищенных компонентов, а нужность рецептора для процесса — возвратом в клетки без рецепторов. Это разные вопросы: полоса на блоте говорит о связывании, но не о том, что рецептор работает на грузе (Lazarou 2015; Wurzer 2015).","Доставку митохондрии в лизосому показывают репортёры [[T29|mt-Keima]] и [[T30|mito-QC]], работу [[T16|PINK1]] — полноразмерный белок и [[T22|pS65-убиквитин]] на блоте. Первые отвечают, дошёл ли материал до кислого отсека, вторые — работает ли киназа; ни то ни другое само по себе не подтверждает, что митофагию запустил именно этот путь (Narendra 2024). Повреждение лизосомы регистрируют по появлению [[T34|галектина]] на лизосоме, по утрате сигнала LysoTracker и по переходу [[T43|TFEB]] в ядро; первая величина отмечает только крупные повреждения (Aits 2015; Meyer, Kravic 2024).","Маршрут конкретного белка устанавливают по скорости его исчезновения после остановки синтеза и по накоплению под ингибиторами: протеасомы, лизосомной деградации, p97. Каждый препарат имеет побочное действие, а подавление одного маршрута усиливает другие, поэтому накопление под препаратом читают вместе с генетическими контролями (Pohl, Dikic 2019).","Контроль подбирают так, чтобы исключить другое объяснение: общий белок на той же мембране, мутант без нужного модуля, клетки без звена, ингибитор другого пути. Результат относят к виду, клеткам, воздействию и сроку, в которых он получен."],"trap":["Если показание изменилось в ожидаемую сторону, механизм доказан.","Показание отвечает только на тот вопрос, для которого выбрана величина. Убыль белка, полоса на блоте или красные точки совместимы с несколькими механизмами; их различают контролями и генетическим выключением звена в данной системе."],"conditions":"Методический шаг: сопоставление методов, а не результат эксперимента. Пиктограммы — схемы операций без численных значений. Примеры взяты из работ с условиями, названными в шагах 6, 12, 18 и 24: Lazarou 2015 (HeLa с Parkin, клетки без пяти рецепторов), Wurzer 2015 (реконструкция и иммунопреципитация), Aits 2015 (клетки человека, LLOMe), Pohl, Dikic 2019 (обзор).","sources":["Lazarou2015","Wurzer2015","Narendra2024","Aits2015","MeyerKravic2024","PohlDikic2019"],"quiz":{"id":"S12-L25","rev":1,"question":"В клетках HeLa с Parkin после деполяризации белок матрикса исчез. Какой результат лучше всего подтверждает, что он исчез из-за митофагии, зависящей от PINK1?","options":[{"id":"S12-L25-1","text":"Белок внешней мембраны TOMM20 тоже исчез на блоте.","correct":false,"feedback":"Белки внешней мембраны, помеченные Parkin, разрушает и протеасома, поэтому их убыль не различает митофагию и разрушение в протеасоме."},{"id":"S12-L25-2","text":"Убыль белка матрикса отсутствует в клетках без PINK1 и в клетках без пяти рецепторов, а в клетках с восстановленным рецептором возвращается.","correct":true,"feedback":"Исчезновение эффекта при выключении звена и его возврат при восстановлении согласуются с зависимостью от PINK1 и рецепторов в этой системе; вывод относится к этим клеткам и воздействию."},{"id":"S12-L25-3","text":"На деполяризованных митохондриях выявлен pS65-убиквитин.","correct":false,"feedback":"pS65-убиквитин показывает работу PINK1, но не доставку митохондрий в лизосому."}]},"widget":{"kind":"cards","title":"","s":{"title":"Событие → величина → метод → контроль","status":"Схема метода · условные пиктограммы","static":["Схема сопоставляет по одному примеру из каждого вопроса семинара: связывание рецептора, митофагия, повреждение лизосомы и маршрут белка.","Для каждого примера указаны величина, метод, контроль и граница вывода."],"opts_label":"Вопрос","opts":["1. Рецептор и груз","2. Митофагия","3. Лизосома","4. Маршрут белка"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"cards":[{"v":["Связывание рецептора с ATG8 или с убиквитином.","Иммунопреципитация или реконструкция из очищенных компонентов; для функции — возврат рецептора в клетки без рецепторов.","Мутация LIR или UBD; клетки без рецептора; отдельная дорожка с исходным образцом.","Связывание не равно работе рецептора на грузе; пробирка не воспроизводит клеточные концентрации."],"note":"Примеры: Lazarou 2015 (клетки HeLa с Parkin без пяти рецепторов), Wurzer 2015 (реконструкция).","pic":{"kind":"steps","steps":["белок-\nнаживка","+ лизат или\nочищенный\nрецептор","промывка","блот"],"hl":3,"cap":"условная схема"}},{"v":["Доля митохондрий, доставленных в кислый отсек лизосомы; работа PINK1.","mt-Keima или mito-QC; блот полноразмерной PINK1 и pS65-убиквитина.","Клетки без PINK1 или без рецепторов; белок матрикса рядом с белком внешней мембраны.","Репортёр показывает доставку, а не путь запуска; убыль белка внешней мембраны возможна без митофагии."],"note":"Красные точки без зелёного — материал в кислой среде. Схема условная.","pic":{"kind":"cells","panels":[{"lab":"до воздействия","dots":[["green",8]]},{"lab":"после деполяризации","dots":[["green",4],["red",5]]}],"cap":"зелёный — нейтральная среда, красный — кислая; условная схема"}},{"v":["Повреждение мембраны лизосомы, ремонт и запуск программы восстановления.","Точки галектина-3, LysoTracker, доля TFEB в ядре; регистрация в нескольких сроках после импульса LLOMe.","Контроль без LLOMe; ингибиторы или нокауты звеньев ремонта и лизофагии.","Галектин отмечает только крупные повреждения; TFEB переходит в ядро и при других воздействиях."],"note":"Схема условная: число точек не равно числу повреждённых лизосом.","pic":{"kind":"cells","panels":[{"lab":"контроль","nuc":0.1,"cyt":0.6,"dots":[]},{"lab":"после LLOMe","nuc":0.8,"cyt":0.2,"dots":[["green",6]]}],"cap":"зелёные точки — галектин-3; свечение ядра — TFEB; условная схема"}},{"v":["Скорость исчезновения белка и вклад каждого маршрута.","Остановка синтеза, затем блот во времени; ингибиторы протеасомы, лизосомной деградации, p97.","Генетическое выключение звена; сочетание препаратов; сравнение с белком известного маршрута.","Препараты действуют не только на мишень, а подавление одного маршрута усиливает другие."],"note":"Кривые и полосы условные.","pic":{"kind":"lines","xlab":"время, ч","ylab":"белок X, условные единицы","xmax":6,"ymax":1,"xticks":[0,2,4,6],"yticks":[0,0.5,1],"series":[{"name":"контроль","pts":[[0,1],[2,0.6],[4,0.35],[6,0.2]]},{"name":"ингибитор","pts":[[0,1],[2,0.9],[4,0.85],[6,0.8]],"dash":true,"dy":-8}],"cap":"условные кривые, не данные"}}],"fixed":"Схема не заменяет подробных схем методов в шагах 6, 12, 18 и 24."}}},{"id":"capstone","number":26,"section":4,"title":"Судьба одного повреждения: от метки до лизосомы","question":null,"questions":[1,2,3,4],"keywords":["судьба повреждения","метка","рецептор","аутофагосома","лизосома","триаж","общие компоненты","избыточность рецепторов"],"lead":["Повреждённый белок, агрегат, митохондрия и лизосома удаляются по-разному, но в цепи удаления повторяются одни и те же звенья: метка, молекула, которая её считывает, и аутофагосома.","Различия задают размер и отсек субстрата, доступные метки и общие молекулы, за которые конкурируют маршруты."],"mechanism":["Метка (убиквитин, pS65-убиквитин) показывает, что объект изменён; её читает шаперон, протеасома или рецептор. Галектин на лизосоме — признак повреждения: он привлекает белки ответа на повреждение, а мост к ATG8 строят убиквитиновые рецепторы.","Рецептор привлекает FIP200 и связывается с белками ATG8: аутофагосома строится у груза и сливается с лизосомой.","Выбор между маршрутами определяется кинетической конкуренцией за общие компоненты, а не единым решающим механизмом."],"paragraphs":["Начнём с растворимого белка цитозоля. Его развёрнутые участки узнают [[T48|шапероны и CHIP]]: либо белок свёртывается повторно, либо метится убиквитином и уходит в протеасому. Если шапероны и протеасомы перегружены, молекулы агрегируют (Hipp 2019).","Агрегат в протеасому не помещается. Убиквитинированный агрегат связывает [[T52|p62]], и [[T02|рецептор]] привлекает [[T07|ULK1–FIP200]]: аутофагосома строится у груза, а белки [[T03|ATG8]] нужны для слияния с лизосомой (Lazarou 2015; Nguyen 2016). В митохондрии метку создаёт цепочка [[T16|PINK1]] — [[T22|pS65-убиквитин]] — [[T23|Parkin]]; белки внешней мембраны извлекает [[T54|p97]] в протеасому, а OPTN и NDP52 запускают постройку аутофагосомы (Narendra 2024).","Лизосома устроена иначе: небольшое повреждение мембраны чинят [[T36|ESCRT-III]] и перенос липидов, а неотремонтированную лизосому метят убиквитином, и рецепторы, в первую очередь [[T41|TAX1BP1]], запускают [[T40|лизофагию]]; пул восстанавливает [[T43|TFEB]] (Eapen 2021; Meyer, Kravic 2024). Критерий, по которому лизосома оказывается в ремонте или в удалении, неизвестен.","Общие молекулы — Hsp70, убиквитин, p62, p97 — связывают маршруты между собой: при подавлении протеасомы нагрузка на аутофагию растёт (Pohl, Dikic 2019). Схема ниже сводит четыре случая в одну таблицу."],"trap":["Для каждого типа повреждения у клетки есть собственный отдельный механизм удаления, никак не связанный с остальными.","Звенья повторяются: метка, рецептор, FIP200, белки ATG8, лизосома. Субстраты различаются размером, отсеком и меткой, а маршруты конкурируют за общие молекулы."],"conditions":"Итоговая схема: качественное сопоставление выводов шагов 1–24. Данные получены на разных объектах: клетки HeLa с Parkin (митофагия, рецепторы), клетки человека с импульсом LLOMe (лизосома), обзоры по протеостазу. Доли молекул, идущих по каждому маршруту, в источниках не заданы.","sources":["Hipp2019","Lazarou2015","Nguyen2016","Narendra2024","Eapen2021","MeyerKravic2024","PohlDikic2019"],"quiz":{"id":"S12-L26","rev":1,"question":"Что общего в удалении убиквитинированного агрегата в цитозоле и неотремонтированной лизосомы?","options":[{"id":"S12-L26-1","text":"В обоих случаях объект помещается в канал протеасомы после развёртывания.","correct":false,"feedback":"Агрегат и лизосома слишком велики для канала протеасомы; их удаляет аутофагия."},{"id":"S12-L26-2","text":"Метка убиквитином считывается рецептором, который привлекает FIP200, и аутофагосома строится у объекта.","correct":true,"feedback":"Такая цепь описана для агрегатов и для лизофагии; набор рецепторов и метки различается, а критерий выбора лизофагии вместо ремонта неизвестен."},{"id":"S12-L26-3","text":"В обоих случаях решение принимает один общий механизм, оценивающий степень повреждения.","correct":false,"feedback":"Такого механизма не описано: маршруты определяются размером и отсеком субстрата, метками и конкуренцией за общие молекулы."}]},"widget":{"kind":"cards","title":"","s":{"title":"Четыре повреждения: метка, рецептор, исход","status":"Схема маршрута · качественные состояния","static":["Схема сопоставляет четыре субстрата: растворимый белок, агрегат, митохондрию и лизосому.","Для каждого указаны метка, молекула, которая её считывает, исход и то, что остаётся неизвестным."],"opts_label":"Субстрат","opts":["Растворимый белок","Агрегат","Митохондрия без потенциала","Лизосома с разрывом"],"heads":["Метка и считывание","Рецептор и инициация","Исход","Что остаётся неизвестным"],"cards":[{"v":["Развёрнутые участки узнают шапероны; E3 CHIP метит субстраты Hsp70 убиквитином.","Протеасома считывает цепь; для части субстратов — CASA с BAG3.","Рефолдинг или разрушение в протеасоме; при перегрузке — агрегация.","Доли молекул по маршрутам в общем виде не определены."],"note":"Размер развёрнутой цепи позволяет ей пройти в канал протеасомы.","pic":{"kind":"steps","steps":["повреждённый\nбелок","шаперон,\nCHIP","протеасома\nили рефолдинг"],"hl":2,"cap":"условная схема"}},{"v":["Убиквитиновые цепи на агрегате; p62 связывает их и образует скопления.","Рецептор привлекает FIP200; белки ATG8 на мембране удерживают груз.","Аутофагосома, слияние с лизосомой, расщепление.","Различия между реконструкцией in vitro и клеткой в отношении p62 и свободного убиквитина."],"note":"Агрегат слишком велик для канала протеасомы.","pic":{"kind":"steps","steps":["агрегат +\nубиквитин","p62,\nрецептор","аутофагосома","лизосома"],"hl":3,"cap":"условная схема"}},{"v":["PINK1 накапливается на внешней мембране, pS65-убиквитин активирует Parkin; метка на внешней мембране.","OPTN и NDP52 привлекают ULK1 и TBK1 (клетки HeLa с Parkin).","Часть белков внешней мембраны извлекает p97 в протеасому; митохондрия — в аутофагосому.","Механизм задержки активации Parkin; доля пути в тканях без нагрузки."],"note":"Данные для клеток HeLa с Parkin; в тканях базальная митофагия идёт в основном без PINK1.","pic":{"kind":"steps","steps":["потеря\nпотенциала","PINK1,\npS65-Ub,\nParkin","OPTN,\nNDP52","аутофагосома"],"hl":3,"cap":"условная схема"}},{"v":["Открытые гликаны метятся галектинами; затем убиквитин на лизосоме.","TAX1BP1, p62, OPTN, NDP52; TBK1 и ULK1–FIP200.","Ремонт ESCRT-III или лизофагия; пул восстанавливает TFEB.","Критерий выбора между ремонтом и удалением; начальная E3-лигаза."],"note":"Ремонт идёт минуты, лизофагия и восстановление пула — часы.","pic":{"kind":"steps","steps":["разрыв\nмембраны","галектин,\nубиквитин","TAX1BP1,\nFIP200","лизофагия,\nTFEB"],"hl":2,"cap":"условная схема"}}],"fixed":"Схема качественная; доли не заданы."}}}],"glossary":[{"id":"S12-T01","term":"Селективная аутофагия","section":0,"def":"Аутофагия, при которой в аутофагосому упаковывается определённый груз: белковые агрегаты, повреждённые органеллы, бактерии. Груз помечен, например убиквитином, и связан с [[T02|рецептором]]. Отличается от неселективной аутофагии при голодании, когда захватывается цитоплазма без отбора груза."},{"id":"S12-T02","term":"Рецептор селективной аутофагии","section":0,"def":"Белок, который связывает груз и белки [[T03|ATG8]] на мембране фагофора и, как правило, привлекает к грузу белки инициации аутофагии. Бывает растворимым (p62, NBR1, TAX1BP1, NDP52, OPTN) и встроенным в мембрану органеллы (BNIP3, NIX, FUNDC1, FAM134B). Разрушается вместе с грузом. В литературе его называют также рецептором груза; не путать с рецептором плазматической мембраны."},{"id":"S12-T03","term":"Белки семейства ATG8 (LC3 и GABARAP)","section":0,"def":"Шесть белков человека, подобных убиквитину: три LC3 и три GABARAP. Ковалентно присоединены к липиду мембраны фагофора и узнаются мотивом [[T05|LIR]]. В клетках HeLa без всех шести белков аутофагосомы образуются, но не сливаются с лизосомой (Nguyen 2016)."},{"id":"S12-T04","term":"Убиквитин-связывающий домен (UBD)","section":0,"def":"Участок рецептора, который узнаёт убиквитин. У разных рецепторов он разный: UBA у p62 и NBR1, UBZ у TAX1BP1, UBAN у OPTN, цинковые пальцы (ZnF) у NDP52. Сродство одиночного UBD к убиквитину невелико."},{"id":"S12-T05","term":"Мотив LIR","section":0,"def":"Короткая последовательность длиной 15–20 аминокислот, которая связывается с LIR-связывающим участком (LDS) белков [[T03|ATG8]]. Название образовано от английского LC3-interacting region (Johansen & Lamark 2020)."},{"id":"S12-T06","term":"Участок связывания FIP200 (FIR) и домен SKICH","section":0,"def":"FIR — короткий участок, которым рецептор связывает FIP200; название условное и относится к участку, а не к отдельному белку. NDP52 связывает FIP200 доменом SKICH, а у p62 участок связывания FIP200 (остатки 326–380) перекрывается с [[T05|LIR]]."},{"id":"S12-T07","term":"Комплекс ULK1–FIP200","section":0,"def":"Комплекс начала построения аутофагосомы: протеинкиназа ULK1 с каркасным белком FIP200 и другими субъединицами. Привлечённый [[T02|рецептором]] к грузу, запускает построение мембраны у груза."},{"id":"S12-T08","term":"Авидность","section":0,"def":"Суммарная прочность связи, возникающая при одновременном образовании нескольких слабых контактов. Сродство каждого контакта при этом не меняется, а частица отсоединяется медленнее. Пример: олигомер p62 дольше удерживается на поверхности с плотно расположенным LC3B, чем p62 без домена PB1 (Wurzer 2015)."},{"id":"S12-T09","term":"Конденсат p62","section":0,"def":"Скопление p62 и убиквитинированных белков без мембраны, возникающее при фазовом разделении. В пробирке для него нужны полимеризация p62 и цепь убиквитина; в работе Sun 2018 фазовое разделение вызывала цепь K63, а в клетках описаны жидкоподобные капли p62."},{"id":"S12-T10","term":"Киназа TBK1","section":0,"def":"Протеинкиназа, которая фосфорилирует рецепторы OPTN, NDP52, TAX1BP1 и p62 (Richter 2016). Фосфорилирование UBAN у OPTN по Ser473 расширяет набор цепей убиквитина, которые он узнаёт (Richter 2016)."},{"id":"S12-T11","term":"Мембранный рецептор","section":0,"def":"Рецептор, встроенный в мембрану органеллы: BNIP3, NIX и FUNDC1 в наружной мембране митохондрии, FAM134B в мембране ЭПР. Путь не начинается с убиквитинирования поверхности органеллы. BNIP3 и NIX включаются димеризацией, FUNDC1 — дефосфорилированием (Adriaenssens 2022)."},{"id":"S12-T12","term":"N-дегрон","section":0,"def":"Сигнал деградации на N-конце белка. В работе Cha-Molstad 2015 N-концевой аргинин (Nt-Arg) белка BiP связывался с ZZ-доменом p62, вызывал олигомеризацию p62 и усиливал его связь с LC3, и BiP разрушался вместе с p62 (клетки человека)."},{"id":"S12-T13","term":"Фагофор","section":0,"def":"Растущая мембранная структура, из которой после замыкания образуется аутофагосома; на её мембране находятся белки [[T03|ATG8]]. Другое название — изолирующая мембрана. Формируется заново, а не из готовой органеллы."},{"id":"S12-T14","term":"Совместная иммунопреципитация и pull-down","section":0,"def":"Методы выявления физического взаимодействия: белок-наживку (например, GST-LC3B) инкубируют с лизатом клеток или очищенным белком, гранулы промывают, связанный белок выявляют иммуноблотом. Слабые обратимые контакты при промывке теряются."},{"id":"S12-T15","term":"Колокализация","section":0,"def":"Совпадение положения двух меток на изображении клетки. Показывает, что молекулы находятся рядом в пределах разрешения микроскопа, но не показывает прямого контакта."},{"id":"S12-T16","term":"PINK1 (PTEN-induced kinase 1)","section":1,"def":"Киназа с митохондриальной сигнальной последовательностью; ген PINK1 (PARK6). Синтезируется постоянно: в здоровой митохондрии импортируется, разрезается и быстро разрушается (период полужизни около 27 мин в клетках человека). При остановке импорта остаётся на внешней мембране в комплексе с [[T18|TOM]], образует димеры и автофосфорилируется по S228 и S402 (PINK1 человека). Фосфорилирует убиквитин и [[T23|Parkin]] по S65 (Kane 2014; Koyano 2014). Потеря функции обоих аллелей гена вызывает рецессивную форму болезни Паркинсона с ранним началом. На схемах положение отдельных доменов PINK1 не показано."},{"id":"S12-T17","term":"Мембранный потенциал митохондрии (Δψ)","section":1,"def":"Разность электрических потенциалов на внутренней мембране митохондрии: со стороны матрикса заряд отрицательный. Создаётся дыхательной цепью и служит основной движущей силой импорта белков с положительно заряженными N-концевыми сигнальными последовательностями, в том числе [[T16|PINK1]]. Утрата потенциала (деполяризация) останавливает импорт. На схемах состояния «есть» и «утрачен» качественные, значения в милливольтах не приводятся."},{"id":"S12-T18","term":"Транслоказы TOM и TIM23","section":1,"def":"TOM — транслоказа внешней мембраны, пора которой образована белком TOM40; TIM23 (вместе с TIM17) — транслоказа внутренней мембраны. Предшественники белков с N-концевой сигнальной последовательностью проходят через оба комплекса. При утрате потенциала N-конец [[T16|PINK1]] остаётся продетым через TOM и удержанным у TIM17/TIM23 (суперкомплекс TOM–TIM23), а киназный домен обращён в цитозоль. На схемах комплексы показаны как единые блоки, без субъединиц."},{"id":"S12-T19","term":"PARL","section":1,"def":"Ромбоидная протеаза внутренней мембраны (presenilin-associated rhomboid-like). Разрезает [[T16|PINK1]] в трансмембранном сегменте непосредственно перед F104 (PINK1 человека), после того как протеаза матрикса MPP снимет сигнальную последовательность. Расщепление зависит от потенциала: при его утрате PINK1 до PARL не доходит. Без PARL PINK1 остаётся внутри митохондрии в форме около 60 кДа."},{"id":"S12-T20","term":"N-дегрон и убиквитинлигазы UBR1, UBR2, UBR4","section":1,"def":"N-дегрон — N-концевой остаток, по которому убиквитинлигазы узнают белок и направляют на разрушение (правило N-конца). После разреза PARL N-конец [[T16|PINK1]] — остаток фенилаланина; фрагмент узнают убиквитинлигазы UBR1, UBR2 и UBR4, после чего его разрушает протеасома. Так объясняют очень короткий срок жизни PINK1 в здоровой митохондрии."},{"id":"S12-T21","term":"CCCP","section":1,"def":"Карбонилцианид-м-хлорфенилгидразон — протонофор: переносит H⁺ через внутреннюю мембрану митохондрии и рассеивает [[T17|потенциал]] одновременно во всех митохондриях клетки. Стандартное воздействие в экспериментах на культурах клеток для запуска пути PINK1–Parkin. В организме повреждение чаще частичное и локальное, поэтому CCCP — удобная, но грубая модель; в части работ потенциал рассеивали олигомицином с антимицином A."},{"id":"S12-T22","term":"pS65-убиквитин","section":1,"def":"Убиквитин, фосфорилированный киназой [[T16|PINK1]] по серину 65. Образуется на цепях убиквитина, присоединённых к белкам внешней мембраны. Связывается с [[T23|Parkin]] и освобождает его убиквитиноподобный домен; служит меткой для рецепторов OPTN и NDP52. Фосфорилирование убиквитина киназой PINK1 показано в клетках и in vitro (Kane 2014; Koyano 2014)."},{"id":"S12-T23","term":"Parkin (PRKN)","section":1,"def":"E3-убиквитинлигаза типа RBR (ген PRKN, PARK2). Состоит из убиквитиноподобного домена UBL, RING0 (UPD), RING1, IBR, REP и RING2; каталитический остаток — C431 в RING2 (Parkin человека). В покое аутоингибирован: UBL, RING0 и REP закрывают сайт связывания E2 и активный центр. Включается при связывании [[T22|pS65-убиквитина]] с RING1 и фосфорилировании S65 в UBL киназой [[T16|PINK1]]. Потеря функции обоих аллелей гена вызывает рецессивную форму болезни Паркинсона с ранним началом. На схеме домены показаны условно, без структуры."},{"id":"S12-T24","term":"Митофузины MFN1 и MFN2","section":1,"def":"ГТФазы внешней мембраны митохондрии, обеспечивающие слияние митохондрий. Среди субстратов [[T23|Parkin]] убиквитинируются предпочтительно; их извлекает из мембраны [[T25|p97]], а разрушает протеасома, в том числе при заблокированной митофагии. Убыль MFN2 на иммуноблоте показывает работу Parkin и протеасомы, но не удаление митохондрии. На схемах MFN1 и MFN2 показаны вместе; различия между ними не рассматриваются."},{"id":"S12-T25","term":"p97 (VCP)","section":1,"def":"AAA-АТФаза (VCP; у дрожжей Cdc48). С кофакторами UFD1–NPL4 извлекает убиквитинированные белки из мембран и передаёт их протеасоме. На митохондриях извлекает MFN1/2 и RHOT1/2, помеченные [[T23|Parkin]]. На схеме показана как один блок, без кофакторов."},{"id":"S12-T26","term":"USP30","section":1,"def":"Деубиквитиназа, закреплённая во внешней мембране митохондрии. Снимает убиквитин, который присоединил [[T23|Parkin]]: избыточная экспрессия USP30 подавляет митофагию, а снижение её активности усиливает деградацию митохондрий в нейронах (Bingol 2014). Ингибитор USP30 MTX325 вошёл в клинические испытания при болезни Паркинсона (Narendra & Youle 2024). В первоисточнике активность USP30 снижали РНК-интерференцией (нокдауном), а не нокаутом."},{"id":"S12-T27","term":"BNIP3 и NIX (BNIP3L)","section":1,"def":"Белки внешней мембраны митохондрии с мотивом LIR: рецепторы митофагии, которым убиквитин не нужен. При гипоксии их образование усиливает HIF1A; NIX необходим для удаления митохондрий при созревании эритроидных клеток. [[T16|PINK1]] и [[T23|Parkin]] для этих путей не нужны. Митофагия через BNIP3 менее избирательна к повреждённым митохондриям и при неконтролируемом усилении может приводить к истощению митохондриальной ДНК. Другие рецепторы этого типа (FUNDC1 и др.) здесь не рассматриваются."},{"id":"S12-T28","term":"Деферипрон (DFP)","section":1,"def":"Хелатор железа. В клетках U2OS и SH-SY5Y за 24 ч вызывал митофагию, не зависящую от PINK1 и Parkin: подавление PINK1 эффект не меняло, а PINK1 не стабилизировалась. BNIP3 для эффекта не требовался (Allen 2013). В первичных эмбриональных фибробластах мыши с репортёром mito-QC деферипрон увеличивал митофагию примерно в шесть раз (McWilliams 2016). Какой рецептор работает в этом случае, остаётся неизвестным."},{"id":"S12-T29","term":"mt-Keima","section":1,"def":"Флуоресцентный белок Keima из коралла, направленный в матрикс митохондрии. Его спектр возбуждения зависит от pH, поэтому митохондрии в нейтральном цитозоле и в кислой среде лизосомы дают сигналы разного цвета (Katayama 2011). Измеряют в живых клетках и тканях: с фиксацией Keima несовместим. Показывает доставку в кислый отсек, но не говорит, какой путь её запустил. Цвета на схемах условные."},{"id":"S12-T30","term":"mito-QC","section":1,"def":"Репортёр митофагии: тандем mCherry–GFP, закреплённый во внешней мембране митохондрии (участок FIS1 101–152). В нейтральной среде светятся оба белка; в лизосоме кислая среда гасит GFP, а mCherry остаётся, и возникают красные точки без зелёного (митолизосомы). Сигнал сохраняется при фиксации ткани. Красные точки возникают при любой доставке материала в кислый отсек, не только при митофагии. Цвета на схемах условные."},{"id":"S12-T31","term":"Проницаемость лизосомной мембраны (LMP)","section":2,"def":"Потеря лизосомной мембраной барьерной функции: через неё выходят протоны и ионы Ca²⁺, а при более тяжёлом повреждении и гидролазы, тогда как в просвет проникают белки цитозоля. Повреждение бывает частичным (малые временные поры, утечка ионов) и крупным (разрыв). Его вызывают лизосомотропные вещества, перекисное окисление липидов, агрегаты, кристаллы и бактерии."},{"id":"S12-T32","term":"LLOMe (L-лейцил-L-лейцин метиловый эфир)","section":2,"def":"Лизосомотропное вещество, которым в эксперименте повреждают лизосомы. Оно диффундирует в лизосому, протонируется и остаётся в ней; катепсин C превращает его в полилейцины (в среднем около шести остатков), нарушающие мембрану. Чувствительность клеток зависит от уровня катепсина C."},{"id":"S12-T33","term":"Катепсин C (CTSC, дипептидилпептидаза I)","section":2,"def":"Лизосомная дипептидилпептидаза I. В эксперименте с LLOMe она превращает это вещество в полилейцины, нарушающие мембрану, поэтому от её уровня зависит токсичность LLOMe для клеток."},{"id":"S12-T34","term":"Галектины 3, 8 и 9","section":2,"def":"Белки цитозоля, связывающие β-галактозиды. При крупном повреждении лизосомы они связываются с гликанами внутренней стороны мембраны, ставшими доступными. По ним в микроскопе выявляют повреждённые лизосомы. Они же привлекают белки ответа: галектин-3 — ALIX и TRIM16, галектин-8 влияет на отсоединение mTORC1, галектин-9 привлекает киназу TAK1. Они узнают сахара, а не убиквитин; рецепторы лизофагии — другие белки."},{"id":"S12-T35","term":"ALG-2 (PDCD6)","section":2,"def":"Ca²⁺-связывающий белок цитозоля. Связав Ca²⁺, вышедший из повреждённой лизосомы, он садится на мембрану и привлекает ESCRT-III двумя путями: через ESCRT-I (TSG101) и непосредственно через ALIX. Фосфатидилсерин, переносимый на цитозольную сторону мембраны из ЭПР, благоприятствует привлечению ALG-2."},{"id":"S12-T36","term":"ESCRT-III","section":2,"def":"Комплекс белков (CHMP1–7, IST1), которые полимеризуются в кольца и спирали на поверхности мембраны со стороны цитозоля; АТФаза VPS4 перестраивает эти полимеры. На повреждённой лизосоме их привлекают в течение минут. Считают, что они сужают место повреждения и убирают его в просвет в виде внутрипросветных пузырьков; обсуждают и временную закупорку разрыва. Точный механизм не установлен."},{"id":"S12-T37","term":"Перенос липидов, инициированный фосфоинозитидами (PITT)","section":2,"def":"Путь быстрого ремонта лизосомы: Ca²⁺ активирует PI4K2A, она образует фосфатидилинозитол-4-фосфат (PI4P) на повреждённой мембране. PI4P привлекает OSBP и ORP9–11, которые создают контакты с ЭПР и переносят холестерол и фосфатидилсерин в обмен на PI4P; затем подключается ATG2, переносящий большие количества липидов."},{"id":"S12-T38","term":"Аннексины A1 и A2","section":2,"def":"Ca²⁺-зависимые белки, образующие полимеры на повреждённой мембране. К повреждённым лизосомам привлекаются все повсеместно экспрессируемые аннексины, но для ремонта важны A1 и A2. Они приходят независимо от ESCRT и выбирают повреждения с более крупными порами."},{"id":"S12-T39","term":"CASM (присоединение ATG8 к одинарной мембране)","section":2,"def":"Присоединение белков семейства ATG8 к липидам самой лизосомной мембраны (к фосфатидилэтаноламину, а также к фосфатидилсерину) без образования фагофора. Идёт через комплекс ATG16L1–ATG5–ATG12, который привлекает V-ATPase, или через TECPR1–ATG5–ATG12, узнающий сфингомиелин на цитозольной стороне. Следствия: микроаутофагия места повреждения, активация TFEB, образование трубчатых выпячиваний. Это не упаковка лизосомы в аутофагосому."},{"id":"S12-T40","term":"Лизофагия","section":2,"def":"Избирательная макроаутофагия повреждённых лизосом. Повреждённая лизосома получает убиквитиновую метку, рецепторы связывают её и белки ATG8, ULK1-комплекс строит фагофор вокруг органеллы, аутофагосома сливается с неповреждённой лизосомой. Процесс занимает часы. Что определяет выбор между ремонтом и удалением, неизвестно."},{"id":"S12-T41","term":"TAX1BP1","section":2,"def":"Рецептор селективной аутофагии с доменом SKICH, который связывает TBK1 и FIP200 (RB1CC1). По результатам систематического нокаута рецепторов в клетках HeLa и индуцированных нейронах вместе с TBK1 он необходим для лизофагического потока; при отсутствии OPTN или NDP52 поток в HeLa сохраняется. Для его работы нужны ранее поставленные убиквитиновые метки."},{"id":"S12-T42","term":"VCP/p97","section":2,"def":"АТФаза семейства AAA, извлекающая убиквитинированные белки из мембран и комплексов. При лизофагии она, например, извлекает белок CNN2 с повреждённой лизосомы; в этой работе ей помогают YOD1, UBXD1 и PLAA. Болезнетворные мутации VCP нарушают лизофагию, и повреждённые лизосомы накапливаются в тканях больных."},{"id":"S12-T43","term":"TFEB и TFE3","section":2,"def":"Транскрипционные факторы семейства MiT/TFE, главные регуляторы биогенеза лизосом и аутофагии. В норме mTORC1 на лизосоме фосфорилирует TFEB, и белки 14-3-3 удерживают его в цитозоле. После дефосфорилирования TFEB переходит в ядро, связывается с мотивом CLEAR и включает гены лизосомных и аутофагических белков."},{"id":"S12-T44","term":"Кальциневрин","section":2,"def":"Ca²⁺- и кальмодулин-зависимая фосфатаза. Ca²⁺, вышедший через лизосомный канал TRPML1 (MCOLN1), активирует кальциневрин, и тот дефосфорилирует TFEB. При повреждении лизосомы присоединённые к мембране белки ATG8 усиливают выход Ca²⁺ через TRPML1."},{"id":"S12-T45","term":"Регенерация лизосом (LYTL, ALR, B-fission)","section":2,"def":"Образование новых лизосом из материала существующих. LYTL: киназа LRRK2 фосфорилирует RAB35 и RAB10, адаптер JIP4 вытягивает трубки без LAMP1, и от них отделяются пузырьки. ALR: отделение протолизосом от автолизосом. B-fission (budding-type fission) описан при гипоксии–реоксигенации в клетках HeLa: везикулы митохондриального происхождения доставляют MFF, и DRP1 отщепляет почки. Значение этих путей в тканях неясно."},{"id":"S12-T46","term":"Триаж белков (кинетическая конкуренция маршрутов)","section":3,"def":"Распределение повреждённых молекул между рефолдингом, протеасомой, ERAD и аутофагией. Оно складывается из скоростей конкурирующих процессов, которые зависят от сродства, локальных концентраций, авидности и разделения на отсеки; центральной системы, которая оценивала бы повреждение и выбирала маршрут, не обнаружено (Pohl, Dikic 2019). Термин «триаж» применили к балансу между свёртыванием и деградацией субстратов шаперонов (Connell 2001)."},{"id":"S12-T47","term":"Ёмкость протеостаза","section":3,"def":"Способность сети шаперонов, протеасом и аутофагии справляться с нагрузкой несвёрнутыми белками. При старении и при хронической экспрессии агрегирующих белков ёмкость снижается: агрегаты захватывают шапероны и протеасомы, из-за чего несвёрнутых молекул становится больше. Возникает положительная обратная связь, которая может привести к нарушению протеостаза (Hipp 2019). На схемах ёмкость показана качественно."},{"id":"S12-T48","term":"CHIP","section":3,"def":"Убиквитинлигаза E3 с TPR-доменом: присоединяется к С-концу Hsp70 или Hsp90 и убиквитинирует субстраты, не способные свернуться и долго остающиеся в комплексе с шаперонами (Hipp 2019). Для рецептора глюкокортикоидов показано, что CHIP смещает баланс от свёртывания к деградации в протеасоме (Connell 2001; клетки COS)."},{"id":"S12-T49","term":"BAG1 и BAG3","section":3,"def":"Ко-шапероны семейства BAG, регулирующие Hsc70 и Hsp70. BAG1 связан с протеасомной деградацией полиубиквитинированных белков, BAG3 — с макроаутофагией. В моделях клеточного старения и в нейронах стареющего мозга грызунов отношение BAG3 к BAG1 растёт (Gamerdinger 2009)."},{"id":"S12-T50","term":"CASA (шаперон-зависимая селективная аутофагия)","section":3,"def":"Путь, в котором комплекс BAG3, Hsc70 и HSPB8 с убиквитинлигазой CHIP и адаптером p62 направляет повреждённые белки в аутофагию. В мышцах он удаляет повреждённые белки Z-диска, например филамин; нарушение CASA приводит к распаду Z-диска и мышечной слабости (Arndt 2010; Drosophila, мышь). CASA отличается от шаперон-опосредованной аутофагии, при которой белок переносится через мембрану лизосомы без убиквитина."},{"id":"S12-T51","term":"Убиквитиновый код","section":3,"def":"Набор способов, которыми убиквитины соединены в цепь: через Met1 или Lys6, 11, 27, 29, 33, 48, 63; цепи бывают линейными и ветвящимися. Цепи K48 и ветвящиеся цепи K48–K11 — самые сильные сигналы для протеасомы (Pohl, Dikic 2019); для модельных субстратов in vitro минимальным сигналом эффективного узнавания был тетраубиквитин (Thrower 2000), но часть белков разрушается протеасомой и после моноубиквитинирования (Braten 2016). Предпочтение рецепторов аутофагии к цепям K63 и M1 и протеасомы к K48 показано в основном при сверхэкспрессии и in vitro и не абсолютно (Adriaenssens 2022)."},{"id":"S12-T52","term":"p62 (SQSTM1): димер и олигомер","section":3,"def":"Белок с доменами PB1, ZZ, UBA и мотивом LIR. Димер p62 узнаёт цепи K48 на одиночных молекулах и подаёт их к протеасоме через PB1. Олигомер формирует тельца p62 и привлекает мембраны аутофагии через LIR; он образуется на цепях K63 (Sun 2018, in vitro), при избытке свободного убиквитина или на N-дегроне (Pohl, Dikic 2019; Cha-Molstad 2015). На субстратах с двумя и более цепями длиннее трёх убиквитинов скопления p62 формируются в реконструированной системе (Zaffagnini 2018)."},{"id":"S12-T53","term":"Убиквитиновый стресс","section":3,"def":"Состояние с высокой концентрацией свободного убиквитина, например после теплового шока или при длительном подавлении протеасомы. Убиквитинирование p62 по нескольким лизинам нарушает димеризацию по домену UBA и способствует олигомеризации p62, то есть направлению груза в аутофагию (Pohl, Dikic 2019)."},{"id":"S12-T54","term":"p97 (VCP)","section":3,"def":"AAA-АТФаза, которая извлекает убиквитинированные белки из мембран и комплексов. p97 накапливается на деполяризованных митохондриях и нужен для разрушения митофузинов, помеченных Parkin (Tanaka 2010). Подавление p97 приводит к удержанию субстратов ERAD и накоплению полиубиквитинированных белков (Anderson 2015)."},{"id":"S12-T55","term":"ERAD-устойчивый агрегат","section":3,"def":"Агрегат белка в просвете ЭПР, который агрегация не позволяет вывести в цитозоль (Fregno 2018). Примеры — полимеры α1-антитрипсина Z (ATZ) и неправильно свёрнутый проколлаген. Такие агрегаты удаляют лизосомные пути с участием калнексина и FAM134B (Fregno 2018; Forrester 2019)."},{"id":"S12-T56","term":"ERLAD и ER-фагия","section":3,"def":"ERLAD — путь «от ЭПР к лизосоме» для устойчивых к протеасоме полимеров ATZ: калнексин и FAM134B направляют груз в одномембранные везикулы, происходящие из ЭПР; их слияние с эндолизосомами зависит от STX17 и VAMP8, а захват ЭПР аутофагосомой не требуется (Fregno 2018). ER-фагия — селективная аутофагия частей ЭПР с рецепторами FAM134B, RTN3, ATL3, TEX264, CCPG1; проколлаген удаляется через комплекс калнексина с FAM134B (Forrester 2019; Pohl, Dikic 2019). На схемах оба пути объединены как лизосомный маршрут."},{"id":"S12-T57","term":"Nrf1 и восстановление протеасомы","section":3,"def":"Транскрипционный фактор Nrf1 необходим для индуцированной транскрипции генов субъединиц протеасомы при подавлении её активности: так активность протеасомы согласуется с потребностью (Radhakrishnan 2010; фибробласты мыши). При подавлении протеасомы растёт также экспрессия p62 и GABARAP (Pohl, Dikic 2019)."},{"id":"S12-T58","term":"Протеафагия","section":3,"def":"Разрушение самих протеасом аутофагией. Наблюдается при длительном голодании по аминокислотам и, в меньшей степени, в базальных условиях; в этом процессе убиквитинирование привлекает p62 (Pohl, Dikic 2019). Пример связи двух систем: протеасома служит субстратом аутофагии."},{"id":"S12-T59","term":"Ингибиторный анализ маршрута","section":3,"def":"Подход, при котором маршрут деградации белка определяют по накоплению белка при подавлении одного маршрута и по сравнению с подавлением нескольких. Результат ограничен избирательностью препаратов и тем, что подавление одного маршрута усиливает другие (Pohl, Dikic 2019; Tsubuki 1996)."},{"id":"S12-T60","term":"Период полужизни белка","section":3,"def":"Время, за которое количество белка падает вдвое после остановки синтеза. Для субстратов убиквитин-протеасомной системы периоды полужизни лежат в диапазоне от секунд до часов (Pohl, Dikic 2019). Измеряют, например, после обработки циклогексимидом и сравнивают с ингибиторами маршрутов."},{"id":"S12-T61","term":"Измеряемая величина","section":4,"def":"Свойство объекта, которое регистрирует метод: связывание, положение белка, доля доставки в кислый отсек, содержание белка во времени. Выбор величины предшествует выбору метода."},{"id":"S12-T62","term":"Контроль эксперимента","section":4,"def":"Условие, которое исключает другое объяснение результата: мутант без нужного модуля, клетки без звена, общий белок на той же мембране, обработка без воздействия."},{"id":"S12-T63","term":"Граница вывода","section":4,"def":"Перечень того, чего данное показание не показывает: условия, клетки, срок и объяснения, которые оно не исключает."},{"id":"S12-T64","term":"Метка повреждения","section":4,"def":"Молекулярный признак, по которому объект отбирается для удаления: цепь убиквитина или pS65-убиквитин на митохондрии. Метка считывается шапероном, протеасомой или рецептором. Галектин на лизосоме отмечает повреждение, но рецептором аутофагии не считывается."}],"sources":{"Adriaenssens2022":{"url":"https://doi.org/10.1016/j.cub.2022.11.002","cite":"Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371","doi":"10.1016/j.cub.2022.11.002","pmid":"36538890"},"Cha-Molstad2015":{"url":"https://doi.org/10.1038/ncb3177","cite":"Cha-Molstad H., Sung K.S., Hwang J. et al. Amino-terminal arginylation targets endoplasmic reticulum chaperone BiP for autophagy through p62 binding. Nat Cell Biol. 2015;17:917–929","doi":"10.1038/ncb3177","pmid":"26075355"},"Johansen2020":{"url":"https://doi.org/10.1016/j.jmb.2019.07.016","cite":"Johansen T., Lamark T. Selective autophagy: ATG8 family proteins, LIR motifs and cargo receptors. J Mol Biol. 2020;432:80–103","doi":"10.1016/j.jmb.2019.07.016","pmid":"31310766"},"Khaminets2015":{"url":"https://doi.org/10.1038/nature14498","cite":"Khaminets A., Heinrich T., Mari M. et al. Regulation of endoplasmic reticulum turnover by selective autophagy. Nature. 2015;522:354–358","doi":"10.1038/nature14498","pmid":"26040720"},"Komatsu2007":{"url":"https://doi.org/10.1016/j.cell.2007.10.035","cite":"Komatsu M., Waguri S., Koike M. et al. Homeostatic levels of p62 control cytoplasmic inclusion body formation in autophagy-deficient mice. Cell. 2007;131:1149–1163","doi":"10.1016/j.cell.2007.10.035","pmid":"18083104"},"Lazarou2015":{"url":"https://doi.org/10.1038/nature14893","cite":"Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314","doi":"10.1038/nature14893","pmid":"26266977"},"Nguyen2016":{"url":"https://doi.org/10.1083/jcb.201607039","cite":"Nguyen T.N., Padman B.S., Usher J., Oorschot V., Ramm G., Lazarou M. Atg8 family LC3/GABARAP proteins are crucial for autophagosome–lysosome fusion but not autophagosome formation during PINK1/Parkin mitophagy and starvation. J Cell Biol. 2016;215:857–874","doi":"10.1083/jcb.201607039","pmid":"27864321"},"Padman2019":{"url":"https://doi.org/10.1038/s41467-019-08335-6","cite":"Padman B.S., Nguyen T.N., Uoselis L. et al. LC3/GABARAPs drive ubiquitin-independ id":"20385086"},"Christianson2008":{"url":"https://doi.org/10.1038/ncb1689","cite":"Christianson J.C., Shaler T.A., Tyler R.E., Kopito R.R. OS-9 and GRP94 deliver mutant α1-antitrypsin to the Hrd1–SEL1L ubiquitin ligase complex for ERAD. Nat Cell Biol. 2008;10:272–282","doi":"10.1038/ncb1689","pmid":"18264092"},"Anderson2015":{"url":"https://doi.org/10.1016/j.ccell.2015.10.002","cite":"Anderson D.J., Le Moigne R., Djakovic S. et al. Targeting the AAA ATPase p97 as an approach to treat cancer through disruption of protein homeostasis. Cancer Cell. 2015;28:653–665","doi":"10.1016/j.ccell.2015.10.002","pmid":"26555175"},"Fregno2018":{"url":"https://doi.org/10.15252/embj.201899259","cite":"Fregno I., Fasana E., Bergmann T.J. et al. ER-to-lysosome-associated degradation of proteasome-resistant ATZ polymers occurs via receptor-mediated vesicular transport. EMBO J. 2018;37:e99259","doi":"10.15252/embj.201899259","pmid":"30076131"},"Forrester2019":{"url":"https://doi.org/10.15252/embj.201899847","cite":"Forrester A., De Leonibus C., Grumati P. et al. A selective ER-phagy exerts procollagen quality control via a Calnexin-FAM134B complex. EMBO J. 2019;38:e99847","doi":"10.15252/embj.201899847","pmid":"30559329"},"Mochida2022":{"url":"https://doi.org/10.15252/embr.202255192","cite":"Mochida K., Nakatogawa H. ER-phagy: selective autophagy of the endoplasmic reticulum. EMBO Rep. 2022;23:e55192","doi":"10.15252/embr.202255192","pmid":"35758175"},"Tsubuki1996":{"url":"https://doi.org/10.1093/oxfordjournals.jbchem.a021280","cite":"Tsubuki S., Saito Y., Tomioka M., Ito H., Kawashima S. Differential inhibition of calpain and proteasome activities by peptidyl aldehydes of di-leucine and tri-leucine. J Biochem. 1996;119:572–576","doi":"10.1093/oxfordjournals.jbchem.a021280","pmid":"8830056"},"Mauvezin2015":{"url":"https://doi.org/10.1038/ncomms8007","cite":"Mauvezin C., Nagy P., Juhász G., Neufeld T.P. Autophagosome–lysosome fusion is independent of V-ATPase-mediated acidification. Nat Commun. 2015;6:7007","doi":"10.1038/ncomms8007","pmid":"25959678"},"Ronan2014":{"url":"https://doi.org/10.1038/nchembio.1681","cite":"Ronan B., Flamand O., Vescovi L. et al. A highly potent and selective Vps34 inhibitor alters vesicle trafficking and autophagy. Nat Chem Biol. 2014;10:1013–1019","doi":"10.1038/nchembio.1681","pmid":"25326666"},"Liu1999":{"url":"https://doi.org/10.1074/jbc.274.9.5861","cite":"Liu Y., Choudhury P., Cabral C.M., Sifers R.N. Oligosaccharide modification in the early secretory pathway directs the selection of a misfolded glycoprotein for degradation by the proteasome. J Biol Chem. 1999;274:5861–5867","doi":"10.1074/jbc.274.9.5861","pmid":"10026209"},"Merrill2019":{"url":"https://doi.org/10.1074/jbc.RA119.010596","cite":"Merrill R.A., Song J., Kephart R.A., Klomp A.J., Noack C.E., Strack S. A robust and economical pulse-chase protocol to measure the turnover of HaloTag fusion proteins. J Biol Chem. 2019;294:16164–16171","doi":"10.1074/jbc.RA119.010596","pmid":"31511325"},"Braten2016":{"url":"https://doi.org/10.1073/pnas.1608644113","cite":"Braten O., Livneh I., Ziv T. et al. Numerous proteins with unique characteristics are degraded by the 26S proteasome following monoubiquitination. Proc Natl Acad Sci U S A. 2016;113:E4639–E4647","doi":"10.1073/pnas.1608644113","pmid":"27385826"}},"questions":["Рецепторы селективной аутофагии как физический адаптер между убиквитинированным грузом и белками ATG8","PINK1 и Parkin: распознавание митохондрии с утраченным мембранным потенциалом","Ответ на повреждение лизосомной мембраны: ремонт, лизофагия и восстановление лизосомного пула","Выбор маршрута для повреждённого белка или органеллы между рефолдингом, протеасомой, ERAD и аутофагией"],"exam_ids":["sar-adapter","sar-avidity","sar-initiation","pink1-stall","parkin-activation","parkin-signal","lyso-repair","lysophagy","lyso-biogenesis","route-principle","route-proteasome","route-switch"],"practice_url":"seminar-12.html","open_questions":[{"q":"Почему рецептор селективной аутофагии нельзя считать пассивным соединителем между грузом и готовой мембраной? Объясните, какие модули несёт рецептор, почему отдельные взаимодействия слабые, а выбор груза избирательный, и что изменится при мутации UBD, LIR или участка связывания FIP200.","crit":"Названы модули рецептора: домен связывания убиквитина (UBD), мотив LIR для белков ATG8, участок связывания FIP200 (FIR или SKICH), у p62 и NBR1 ещё PB1. Отдельные контакты UBD–убиквитин и LIR–ATG8 слабые; избирательность даёт множественность контактов (авидность), в том числе олигомеризация p62 и скопления с убиквитиновыми цепями. Рецептор привлекает FIP200 и ULK1-комплекс, поэтому аутофагосома строится у груза. Мутация UBD не даёт рецептору связаться с грузом; мутация участка связывания FIP200 лишает его способности инициировать построение мембраны; мутация LIR не лишает рецептор способности узнавать повреждённую митохондрию, но снижает эффективность митофагии: рецептор медленнее накапливается на растущем фагофоре, а ранние стадии построения аутофагосомы идут слабее — очаги ATG13 мельче, на митохондриях меньше FIP200; это показано для OPTN и NDP52 в клетках HeLa с Parkin без пяти рецепторов (Padman 2019). Это воздействие отличается от удаления всех шести белков ATG8: в таких клетках митохондрия может быть охвачена мембраной, но слияние с лизосомой нарушено (Nguyen 2016). Выводы получены на клетках HeLa с Parkin и относятся к этим условиям."},{"q":"Как потеря мембранного потенциала митохондрии превращается в убиквитиновую метку на её поверхности? Объясните судьбу PINK1 в здоровой и в деполяризованной митохондрии, активацию Parkin и роль рецепторов, и предскажите результат в клетках без PINK1, с Parkin C431S и без пяти рецепторов.","crit":"В здоровой митохондрии PINK1 импортируется через TOM и TIM23, разрезается MPP и PARL и разрушается; повреждение останавливает импорт, и PINK1 накапливается на внешней мембране, димеризуется и фосфорилирует убиквитин по S65. pS65-убиквитин связывает Parkin; фосфорилирование UBL Parkin снимает автоингибирование. Parkin метит белки внешней мембраны (MFN1/2, VDAC, TOMM20 и др.); часть извлекает p97 в протеасому. OPTN и NDP52 связывают метку и привлекают ULK1 и TBK1. Без PINK1 нет pS65-убиквитина и активации Parkin; при C431S PINK1 накапливается, но обратная связь не запускается: pS65-убиквитин остаётся на низком исходном уровне; без пяти рецепторов метка и убыль MFN2 сохранены, а митофагия не идёт. Данные для клеток HeLa с Parkin; в тканях базальная митофагия идёт в основном без PINK1."},{"q":"Как клетка отвечает на повреждение мембраны лизосомы? Опишите сигналы повреждения, ремонт, лизофагию и восстановление пула лизосом и предскажите, что изменится после импульса LLOMe при нокдауне ESCRT-III, в клетках без TAX1BP1 и в клетках без TFEB.","crit":"Названы сигналы: выход Ca²⁺, галектины на открытых гликанах, сфингомиелин, V-ATPase и ATG16L1. Малое повреждение чинят ESCRT-III (со стороны цитозоля) и перенос липидов от ЭПР (PI4K2A–PI4P). Неотремонтированную лизосому метят убиквитином и удаляют лизофагией через рецепторы, главным образом TAX1BP1, при участии TBK1 и ULK1–FIP200. TFEB и TFE3 переходят в ядро и восстанавливают пул лизосом. Критерий выбора между ремонтом и удалением неизвестен. При нокдауне ESCRT-III ремонт замедлен, точек галектина-3 больше; без TAX1BP1 повреждённые лизосомы удаляются хуже и точки держатся дольше; без TFEB пул восстанавливается медленнее. Условия: клетки человека, импульс LLOMe, зависимость от экспрессии катепсина C."},{"q":"От чего зависит, по какому маршруту уйдёт повреждённый белок или органелла: рефолдинг, протеасома, ERAD или аутофагия? Сравните растворимый белок, агрегат, белок ЭПР и митохондрию и предскажите, что произойдёт при подавлении протеасомы.","crit":"Решающего механизма нет: распределение задают размер и отсек субстрата, тип убиквитиновой метки, состояние p62 и доступность общих молекул — Hsp70, убиквитина, p97 (кинетическая конкуренция). Растворимый развёрнутый белок идёт на рефолдинг или в протеасому; агрегат слишком велик для канала протеасомы и удаляется аутофагией; растворимый белок просвета ЭПР сначала передаётся ERAD, а ERAD-устойчивые агрегаты удаляют лизосомные пути (ERLAD, ER-фагия); белки внешней мембраны митохондрии, помеченные Parkin, извлекает p97 в протеасому, а органелла уходит митофагией. При подавлении протеасомы накапливаются убиквитинированные формы и растёт нагрузка на аутофагию, но компенсация неполная. Выводы получены на разных клетках и воздействиях."}]};

const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);

/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;

  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
