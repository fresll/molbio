><dt>Аденилатциклаза</dt><dd>Интегральный фермент мембраны; превращает ATP в cAMP. Активируется связыванием Gαs-GTP; форсколин активирует её напрямую, минуя рецептор.</dd></div><div id="ns-g-S3-T10"><dt>cAMP</dt><dd>Циклический AMP — вторичный посредник. Его концентрация определяется балансом синтеза аденилатциклазой и гидролиза фосфодиэстеразами; главный эффектор в этом пути — PKA.</dd></div><div id="ns-g-S3-T11"><dt>Фосфодиэстераза (PDE4)</dt><dd>Фермент, гидролизующий cAMP до 5'-AMP. На PDE4 приходится значительная часть гидролиза cAMP; PKA фосфорилирует и активирует её (отрицательная обратная связь). Ролипрам избирательно подавляет PDE4.</dd></div><div id="ns-g-S3-T12"><dt>PKA</dt><dd>Протеинкиназа A — тетрамер R₂C₂. cAMP связывается с регуляторными субъединицами (по два участка на каждую) и освобождает каталитические; зависимость от cAMP круче простого насыщения.</dd></div><div id="ns-g-S3-T13"><dt>Форсколин</dt><dd>Дитерпен, активирующий аденилатциклазу напрямую, минуя рецептор и G-белок. Повышает концентрацию cAMP, не вызывая агонист-зависимой десенситизации рецептора (с участием GRK и β-аррестина).</dd></div><div id="ns-g-S3-T14"><dt>Ролипрам</dt><dd>Избирательный ингибитор PDE4. Замедляя гидролиз cAMP, повышает его концентрацию и продлевает ответ; на рецептор не действует.</dd></div><div id="ns-g-S3-T15"><dt>Клеточный контекст (набор эффекторов)</dt><dd>Набор белков, которые PKA фосфорилирует в данной клетке. Именно он задаёт направление ответа: один путь Gs–cAMP–PKA даёт расслабление бронха, усиление работы сердца или липолиз.</dd></div><div id="ns-g-S3-T16"><dt>AKAP</dt><dd>Якорный белок протеинкиназы A; удерживает PKA (а часто и PDE, и циклазу) у определённого участка мембраны. Поэтому при одной и той же средней концентрации cAMP фосфорилируются разные субстраты.</dd></div><div id="ns-g-S3-T17"><dt>GRK</dt><dd>Киназа рецепторов, сопряжённых с G-белками. Фосфорилирует остатки серина и треонина во внутриклеточном хвосте активного рецептора и тем самым создаёт участок связывания β-аррестина. В клетках HEK293 из GRK2/3/5/6 на десенситизацию β2-рецептора влиял только нокдаун GRK6 (Violin 2008).</dd></div><div id="ns-g-S3-T18"><dt>β-аррестин (десенситизация)</dt><dd>Белок, связывающийся с фосфорилированным активным рецептором. Стерически препятствует связыванию G-белка (десенситизация) и направляет рецептор в эндосому (интернализация).</dd></div><div id="ns-g-S3-T19"><dt>FRET-сенсор</dt><dd>Белок с доменом связывания cAMP между двумя флуоресцентными белками. Связывание cAMP меняет перенос энергии (FRET); отношение сигналов двух цветов в реальном времени отражает изменения концентрации cAMP, а в абсолютную концентрацию переводится калибровкой.</dd></div><div id="ns-g-S3-T20"><dt>Протеинкиназа</dt><dd>Фермент, переносящий γ-фосфатную группу ATP на гидроксильную группу серина, треонина или тирозина белка. В геноме человека 518 генов протеинкиназ (Manning 2002).</dd></div><div id="ns-g-S3-T21"><dt>Протеинфосфатаза</dt><dd>Фермент, гидролизующий фосфоэфирную связь в фосфорилированном белке; делает фосфорилирование обратимым. Специфичность серин-треониновых фосфатаз во многом задают их регуляторные субъединицы.</dd></div><div id="ns-g-S3-T22"><dt>Занятость участка (стехиометрия)</dt><dd>Доля молекул белка, несущих фосфат на данном участке. Измеряется отдельными методами; интенсивность фосфопептида в масс-спектрометрии её прямо не показывает.</dd></div><div id="ns-g-S3-T23"><dt>Домены, распознающие фосфорилированные остатки</dt><dd>Участки белков, связывающие фосфорилированные остатки: домены SH2 и PTB распознают фосфотирозин, белки 14-3-3 — фосфосериновые мотивы. Через них фосфорилирование меняет партнёров белка.</dd></div><div id="ns-g-S3-T24"><dt>Стационарная доля p*</dt><dd>Доля фосфорилированных молекул, при которой скорости фосфорилирования и дефосфорилирования равны: p* = kк/(kк + kф) для ферментов, далёких от насыщения.</dd></div><div id="ns-g-S3-T25"><dt>Время релаксации τ</dt><dd>Характерное время выхода доли фосфорилированной формы на новый стационарный уровень: τ = 1/(kк + kф). За время τ доля проходит около 63 % пути к новому уровню. Чем выше обе активности, тем короче τ.</dd></div><div id="ns-g-S3-T26"><dt>Эффективная константа скорости</dt><dd>Константа первого порядка (с⁻¹), в которую уже входят количество и активность фермента; kк и kф описывают скорости фосфорилирования и дефосфорилирования одной молекулы субстрата.</dd></div><div id="ns-g-S3-T27"><dt>Фосфоламбан (PLN)</dt><dd>Белок мембраны саркоплазматического ретикулума кардиомиоцита; в нефосфорилированной форме снижает кажущееся сродство SERCA2a к Ca²⁺. PKA фосфорилирует его по Ser16, CaMKII — по Thr17.</dd></div><div id="ns-g-S3-T28"><dt>SERCA2a</dt><dd>Изоформа Ca²⁺-АТФазы саркоплазматического ретикулума сердца; переносит Ca²⁺ из цитозоля в ретикулум за счёт гидролиза ATP и регулируется фосфоламбаном.</dd></div><div id="ns-g-S3-T29"><dt>PP1</dt><dd>Протеинфосфатаза 1 — серин-треониновая фосфатаза; в кардиомиоците главная фосфатаза фосфоламбана. После фосфорилирования протеинкиназой A белок ингибитор-1 подавляет активность PP1.</dd></div><div id="ns-g-S3-T30"><dt>Опыт с подавлением киназы</dt><dd>Измерение спада фосфорилирования после полного подавления киназы: при kк = 0 доля фосфорилированной формы снижается с характерным временем 1/kф, что позволяет оценить активность фосфатазы.</dd></div><div id="ns-g-S3-T31"><dt>Сверхчувствительность нулевого порядка</dt><dd>Резкий переход доли фосфорилированной формы от почти нуля к почти единице при небольшом изменении отношения активностей, когда киназа и фосфатаза насыщены субстратом (Goldbeter и Koshland 1981).</dd></div><div id="ns-g-S3-T32"><dt>Многосайтовое фосфорилирование</dt><dd>Фосфорилирование нескольких участков одного белка; если для изменения свойств нужны все участки, зависимость ответа от активности киназы становится более резкой.</dd></div><div id="ns-g-S3-T33"><dt>Бистабильность</dt><dd>Существование двух устойчивых состояний при одном значении входного сигнала; требует эффективной положительной обратной связи — отдельной петли или возникающей внутри многосайтового цикла. Сверхчувствительность сама по себе бистабильности не даёт.</dd></div><div id="ns-g-S3-T34"><dt>Консенсусный мотив</dt><dd>Короткая последовательность вокруг фосфорилируемого остатка, которую преимущественно распознаёт каталитический центр киназы; для PKA — основные остатки перед серином (например, RRxS).</dd></div><div id="ns-g-S3-T35"><dt>Участок стыковки</dt><dd>Область поверхности киназы или субстрата вне каталитического центра; взаимодействие таких областей удерживает фермент на субстрате и повышает специфичность.</dd></div><div id="ns-g-S3-T36"><dt>Сигнальный каркасный белок (скаффолд; например, AKAP)</dt><dd>Белок, одновременно связывающий несколько участников пути и определяющий их локализацию; белки AKAP связывают PKA и закрепляют её рядом с определёнными мишенями.</dd></div><div id="ns-g-S3-T37"><dt>Фосфоспецифичное антитело</dt><dd>Антитело, распознающее белок, только если определённый остаток фосфорилирован; на вестерн-блоте показывает относительное изменение фосфорилирования, а не долю фосфорилированных молекул.</dd></div><div id="ns-g-S3-T38"><dt>λ-фосфатаза</dt><dd>Фосфатаза бактериофага λ, отщепляющая фосфатные группы от остатков серина, треонина и тирозина; обработка лизата λ-фосфатазой проверяет, что сигнал антитела обусловлен фосфорилированной формой.</dd></div><div id="ns-g-S3-T39"><dt>Фосфомиметическая замена</dt><dd>Замена серина или треонина на аспартат или глутамат, вносящая постоянный отрицательный заряд. Воспроизводит фосфорилирование лишь частично и необратима.</dd></div><div id="ns-g-S3-T40"><dt>малая ГТФаза</dt><dd>Белок суперсемейства Ras с G-доменом, связывающим гуаниновый нуклеотид и обладающим медленной собственной ГТФазной активностью. Существует в двух формах — с GTP (активной) и с GDP (неактивной).</dd></div><div id="ns-g-S3-T41"><dt>G-домен</dt><dd>Домен молекулярной массой около 20 кДа, образующий ядро малой ГТФазы; связывает GTP или GDP и обладает слабой собственной ГТФазной активностью.</dd></div><div id="ns-g-S3-T42"><dt>switch I и switch II</dt><dd>Две подвижные области G-домена, контактирующие с γ-фосфатом GTP. При связанном GTP они упорядочены и образуют поверхность для эффекторов; после гидролиза разупорядочиваются.</dd></div><div id="ns-g-S3-T43"><dt>γ-фосфат</dt><dd>Третья (концевая) фосфатная группа GTP. Её наличие удерживает switch I и switch II в упорядоченном состоянии; при гидролизе она отщепляется, и GTP превращается в GDP.</dd></div><div id="ns-g-S3-T44"><dt>GEF</dt><dd>Фактор обмена гуаниновых нуклеотидов: ускоряет замену GDP на GTP, снижая сродство ГТФазы к GDP. ATP не расходует; для RAS это, в частности, SOS1.</dd></div><div id="ns-g-S3-T45"><dt>GAP</dt><dd>Белок, активирующий ГТФазу: ускоряет гидролиз связанного GTP на несколько порядков, внося в активный центр каталитический остаток. Для RAS это NF1, p120GAP и другие.</dd></div><div id="ns-g-S3-T46"><dt>SOS1</dt><dd>Фактор обмена (GEF) для RAS; привлекается к мембране адаптером GRB2 после активации рецептора. Ускоряет обмен GDP на GTP.</dd></div><div id="ns-g-S3-T47"><dt>GRB2</dt><dd>Адаптерный белок без ферментативной активности: доменом SH2 связывается с фосфотирозином рецептора, доменом SH3 — с SOS1 и тем самым привлекает SOS1 к мембране.</dd></div><div id="ns-g-S3-T48"><dt>нейрофибромин (NF1)</dt><dd>GAP для RAS; вносит в активный центр каталитический аргинин. Потеря функции (нейрофиброматоз 1 типа) замедляет гидролиз GTP и удлиняет время жизни RAS-GTP.</dd></div><div id="ns-g-S3-T49"><dt>p120GAP (RASA1)</dt><dd>Ещё один GAP для RAS; действует по тому же механизму «аргининового пальца». Вместе с NF1 определяет суммарную скорость инактивации RAS.</dd></div><div id="ns-g-S3-T50"><dt>аргининовый палец</dt><dd>Каталитический аргинин, который GAP вносит в активный центр ГТФазы; стабилизирует переходное состояние реакции гидролиза GTP.</dd></div><div id="ns-g-S3-T51"><dt>эффекторы RAS</dt><dd>Белки, которые активный RAS (GTP-форма) привлекает к мембране и активирует. Три основные группы — RAF, PI3K класса I и RALGDS.</dd></div><div id="ns-g-S3-T52"><dt>RAF</dt><dd>Протеинкиназа — эффектор RAS; связывается с RAS-GTP и запускает каскад RAF → MEK → ERK (семинар 4).</dd></div><div id="ns-g-S3-T53"><dt>PI3K (класс I)</dt><dd>Фосфоинозитид-3-киназа — эффектор RAS; катализирует образование липида PIP₃ и запускает путь AKT.</dd></div><div id="ns-g-S3-T54"><dt>RALGDS</dt><dd>Эффектор RAS; сам является фактором обмена (GEF) для ГТФаз семейства Ral.</dd></div><div id="ns-g-S3-T55"><dt>онкогенные варианты RAS</dt><dd>Соматические замены в кодонах 12, 13 и 61, ослабляющие гидролиз GTP и/или чувствительность к GAP в разной степени и смещающие цикл к активной форме.</dd></div><div id="ns-g-S3-T56"><dt>KRAS G12C</dt><dd>Онкогенный вариант KRAS (глицин 12 → цистеин): почти нечувствителен к GAP, но сохраняет собственный гидролиз и продолжает переходить между GDP- и GTP-формами. Мишень ковалентных ингибиторов.</dd></div><div id="ns-g-S3-T57"><dt>соторасиб</dt><dd>Ингибитор KRAS G12C (AMG 510), ковалентно связывающийся с цистеином-12 в GDP-форме и удерживающий белок в неактивном состоянии; первый препарат этого класса, применяемый в клинике.</dd></div><div id="ns-g-S3-T58"><dt>BI-3406</dt><dd>Исследовательский ингибитор SOS1: препятствует ускорению обмена GDP на GTP в RAS и тем самым ослабляет активацию RAS.</dd></div><div id="ns-g-S3-T59"><dt>RBD pull-down</dt><dd>Метод измерения активного RAS: RBD-домен RAF на гранулах связывает только GTP-форму; осаждённый RAS выявляют в блоте, общий RAS служит контролем загрузки.</dd></div><div id="ns-g-S3-T60"><dt>депо-зависимый вход Ca²⁺ (SOCE)</dt><dd>Вход Ca²⁺ из внеклеточной среды через каналы плазматической мембраны, открывание которых вызвано не связыванием лиганда и не изменением мембранного потенциала, а снижением концентрации Ca²⁺ в эндоплазматическом ретикулуме.</dd></div><div id="ns-g-S3-T61"><dt>STIM1</dt><dd>Белок мембраны ЭПР и сенсор Ca²⁺ в депо. Каждая субъединица пересекает мембрану одной трансмембранной спиралью: домены EF-hand и SAM обращены в просвет ЭПР, цитозольная часть — в цитозоль. При опустошении депо STIM1 распрямляется и собирается в кластеры у контактов ЭПР с плазматической мембраной, где открывает Orai1.</dd></div><div id="ns-g-S3-T62"><dt>Orai1</dt><dd>Канал плазматической мембраны, обладающий высокой избирательностью к Ca²⁺ и малой проводимостью; его открывают кластеры STIM1. Замена R91W почти полностью устраняет проведение Ca²⁺ и вызывает иммунодефицит.</dd></div><div id="ns-g-S3-T63"><dt>EF-hand</dt><dd>Домен STIM1 в просвете ЭПР, связывающий Ca²⁺ с умеренным сродством (Kd около 200–600 мкМ). Диссоциация Ca²⁺ от этого домена при опустошении депо переводит STIM1 в активную форму.</dd></div><div id="ns-g-S3-T64"><dt>кластер STIM1</dt><dd>Скопление распрямлённых молекул STIM1 у контакта ЭПР с плазматической мембраной; доля STIM1 в кластерах резко меняется при изменении концентрации Ca²⁺ в ЭПР.</dd></div><div id="ns-g-S3-T65"><dt>контакт ЭПР–ПМ</dt><dd>Участок, где расстояние между мембраной ЭПР и плазматической мембраной составляет 10–25 нм. Такой зазор достаточно мал, чтобы цитозольная часть STIM1 достигала Orai1; при этом мембраны не сливаются.</dd></div><div id="ns-g-S3-T66"><dt>ток CRAC (ICRAC)</dt><dd>Ca²⁺-ток через Orai1, активируемый опустошением депо: высокоизбирательный к Ca²⁺, с очень малой проводимостью и входящим выпрямлением.</dd></div><div id="ns-g-S3-T67"><dt>входящее выпрямление</dt><dd>Свойство тока CRAC: при отрицательном мембранном потенциале ток велик (входящий), при деполяризации почти исчезает.</dd></div><div id="ns-g-S3-T68"><dt>SERCA</dt><dd>Ca²⁺-АТФаза мембраны ЭПР; закачивает Ca²⁺ в депо против градиента за счёт ATP. Необратимо подавляется тапсигаргином.</dd></div><div id="ns-g-S3-T69"><dt>тапсигаргин</dt><dd>Необратимый избирательный ингибитор SERCA; вызывает опустошение депо за счёт утечки Ca²⁺ без участия рецептора и без образования IP₃.</dd></div><div id="ns-g-S3-T70"><dt>IP₃</dt><dd>Инозитол-1,4,5-трисфосфат — растворимый посредник, образуемый фосфолипазой C из PIP₂; открывает IP₃-рецептор ЭПР, и Ca²⁺ выходит из депо.</dd></div><div id="ns-g-S3-T71"><dt>IP₃-рецептор</dt><dd>Канал мембраны ЭПР, через который Ca²⁺ выходит из депо; открывается при совместном связывании IP₃ и Ca²⁺ на цитозольной стороне.</dd></div><div id="ns-g-S3-T72"><dt>фосфолипаза Cβ</dt><dd>Фермент, активируемый рецепторами через белок Gq; расщепляет мембранный липид PIP₂ с образованием IP₃ и DAG.</dd></div><div id="ns-g-S3-T73"><dt>PIP₂</dt><dd>Фосфатидилинозитол-4,5-бисфосфат — мембранный липид, субстрат фосфолипазы C; из него образуются IP₃ и DAG.</dd></div><div id="ns-g-S3-T74"><dt>DAG</dt><dd>Диацилглицерол — гидрофобный продукт гидролиза PIP₂; остаётся в плазматической мембране и участвует в активации протеинкиназы C.</dd></div><div id="ns-g-S3-T75"><dt>кальмодулин</dt><dd>Небольшой Ca²⁺-связывающий белок; связав Ca²⁺, активирует набор мишеней, среди которых фосфатаза кальцинейрин.</dd></div><div id="ns-g-S3-T76"><dt>кальцинейрин</dt><dd>Серин-треониновая фосфатаза, активная только в комплексе с Ca²⁺–кальмодулином; дефосфорилирует NFAT. Подавляется комплексом циклоспорина A с циклофилином.</dd></div><div id="ns-g-S3-T77"><dt>NFAT</dt><dd>Транскрипционный фактор; в покое фосфорилирован и удерживается в цитоплазме, после дефосфорилирования кальцинейрином переходит в ядро. Для активации генов (в T-лимфоците — IL2) там нужны и другие факторы, прежде всего AP-1: один NFAT в ядре для ответа недостаточен.</dd></div><div id="ns-g-S3-T78"><dt>циклоспорин A</dt><dd>Иммунодепрессант; связывается с циклофилином, и комплекс подавляет кальцинейрин. Вход Ca²⁺ при этом не меняется, но NFAT остаётся в цитоплазме.</dd></div><div id="ns-g-S3-T79"><dt>Fura-2</dt><dd>Флуоресцентный индикатор Ca²⁺; возбуждают на 340 и 380 нм, отношение сигналов после калибровки пересчитывают в концентрацию Ca²⁺. Сам связывает Ca²⁺ и служит его буфером.</dd></div><div id="ns-g-S3-T80"><dt>RASGRP1</dt><dd>Фактор обмена гуаниновых нуклеотидов для RAS с DAG-связывающим доменом C1; в T-клетках передаёт сигнал от рецептора антигена через DAG на RAS (Dower 2000).</dd></div><div id="ns-g-S3-T81"><dt>AP-1</dt><dd>Транскрипционный фактор из белков семейств Fos и Jun; путь RAS → ERK усиливает их синтез и фосфорилирование.</dd></div><div id="ns-g-S3-T82"><dt>Составной элемент промотора</dt><dd>Участок ДНК с соседними местами связывания NFAT и AP-1; два фактора образуют на нём устойчивый тройной комплекс, и транскрипция гена активируется при совпадении двух сигналов.</dd></div><div id="ns-g-S3-T83"><dt>Интерлейкин-2 (IL-2)</dt><dd>Цитокин, синтез которого индуцируется при активации T-лимфоцита; транскрипция гена IL2 требует NFAT и AP-1.</dd></div><div id="ns-g-S3-T90"><dt>EGFR</dt><dd>Рецептор эпидермального фактора роста — рецепторная тирозинкиназа плазматической мембраны. Связав лиганд (например, EGF), рецептор образует димер и фосфорилирует остатки тирозина в собственном цитоплазматическом участке; фосфотирозины узнаются белками с доменами SH2, в том числе адаптером GRB2. В семинаре 4 EGFR служит началом пути RAS → ERK.</dd></div><div id="ns-g-S3-T91"><dt>мотив CAAX и липидный якорь RAS</dt><dd>Концевая последовательность RAS: цистеин, две алифатические аминокислоты и любая концевая аминокислота (CAAX). Цистеин фарнезилируется, три концевые аминокислоты отщепляются, карбоксильная группа метилируется; получившийся липидный остаток встраивается во внутренний слой плазматической мембраны. Для прочного закрепления нужен второй сигнал: пальмитоилирование соседних цистеинов у HRAS и NRAS либо участок положительно заряженных остатков лизина у KRAS (изоформа 4B).</dd></div><div id="ns-g-S3-T92"><dt>кальциевый микродомен</dt><dd>Небольшая область цитоплазмы у устья открытого канала (порядка десятков нанометров), в которой концентрация Ca²⁺ на время открытия значительно выше, чем в остальной цитоплазме. Ca²⁺ быстро рассеивается и связывается внутриклеточными буферами, поэтому такой подъём локален. Он не исключает, что при открытии многих каналов растёт и средняя («глобальная») концентрация Ca²⁺ в клетке.</dd></div><div id="ns-g-S3-T93"><dt>Резерв рецепторов</dt><dd>Ситуация, когда полный ответ клетки достигается при занятости лишь малой доли рецепторов, потому что после рецептора идут усиливающие ступени. Часть рецепторов можно выключить (необратимым антагонистом, интернализацией, снижением экспрессии): максимальный ответ при этом почти не изменится, а кривая «концентрация — ответ» сдвинется вправо. Когда резерв исчерпан, снижается и максимум. Резерв зависит от клетки и от ответа, который измеряют.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 3 — Рецепция и молекулярные переключатели","home_eyebrow":"Семинар 3 · самостоятельная подготовка","home_h1":"Как клетка узнаёт сигнал\nи переключает белки","home_lead":"Меняйте лиганд, активность ферментов, вариант RAS и концентрацию Ca²⁺ в депо и проследите, как рецептор и молекулярные переключатели переводят внешний сигнал в ответ клетки.","start":"Начать с β2-адренорецептора →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"В интерактиве разобраны четыре основных механизма семинара. Отдельные пункты развёрнутой программы и эволюционные пояснения в этот маршрут не включены. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Восемь опорных остановок образуют основной маршрут: связывание и активация; контекст клетки; сигнал и его прекращение; фосфат и его следствия; доля, поток и время; обмен и гидролиз; сенсор, канал и эффектор; проверка механизма. Они отмечены в начале шагов; остальные шаги углубляют маршрут. Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат опыта","practice_p":"46 сценариев с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 3.0 · 20 ок це","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 46 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Рецепция и молекулярные переключатели","stats":[["4 механизма","от рецептора к переключателю"],["Объяснения","с вопросами для самопроверки"],["46 сценариев","в отдельном практикуме"]],"num_fmt":"3.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары","svg_hint":"Схема шире экрана: прокрутите её по горизонтали, чтобы увидеть все подписи.","title_ver":"3.0","scheme_attr":"© Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5⁠–⁠6 семестры"},"lessons":[{"id":"receptor-equilibrium","questions":[1],"title":"Как агонист смещает равновесие конформаций рецептора","keywords":["β2-адренорецептор","агонист","частичный агонист","обратный агонист","антагонист","конформация","эффективность","резерв рецепторов","EC50","KD","опорная остановка"],"lead":["Опорная остановка 1 из 8 · связывание и активация: занятость рецептора лигандом и его активное состояние — разные величины; это начало маршрута.","[[T01|β2-адренорецептор]] и без лиганда переходит между неактивным и активным состояниями.","[[T02|Агонист]] не создаёт новую конформацию, а смещает равновесие в сторону активной."],"mechanism":["Рецептор существует в равновесии неактивной и активной конформаций; без лиганда он чаще неактивен.","Агонист связывается в кармане между спиралями и повышает долю времени, которую рецептор проводит в активной конформации.","[[T03|Обратный агонист]] смещает равновесие к неактивной конформации, антагонист сам равновесие не сдвигает."],"paragraphs":["Связывание лиганда с рецептором — обратимая нековалентная реакция, которая не требует гидролиза ATP и не меняет ковалентной структуры белка. Важно, как описывать её следствие. Рецептор и без лиганда самопроизвольно переходит между неактивной и активной конформациями, поэтому у популяции рецепторов есть небольшая [[T04|базальная активность]] даже без агониста. Агонист связывается в кармане, образованном спиралями III, V, VI и VII, и смещает равновесие в пользу активной конформации, увеличивая долю времени в ней.","Из такого описания следуют три наблюдаемых факта, которые формула «лиганд включает рецептор» не объясняет. Во-первых, базальная активность без лиганда. Во-вторых, частичные агонисты: даже при насыщающей концентрации они смещают равновесие не полностью и дают меньший максимальный ответ, потому что у них ниже эффективность, а не сродство. В-третьих, обратные агонисты, которые смещают равновесие к неактивному состоянию сильнее, чем в отсутствие лиганда, и снижают активность ниже базальной.","Антагонист занимает тот же карман, но равновесие конформаций сам не сдвигает: он лишь препятствует связыванию агониста или обратного агониста. В опытах на клетках с выраженной базальной активностью β-рецепторов пропранолол проявляет свойства обратного агониста; клинически его действие в основном объясняется конкурентной блокадой β-рецепторов. Структурные работы показывают, что активная конформация — это не одно состояние, а набор близких по энергии конформаций, различающихся тем, с каким внутриклеточным партнёром они преимущественно связываются; этот факт понадобится при разборе десенситизации и смещённого агонизма.","Занятость рецепторов и ответ клетки — разные величины. Занятость — доля рецепторов, связанных с лигандом; она растёт с концентрацией по гиперболе c/(c + KD), а KD (концентрация, при которой занята половина рецепторов) характеризует сродство. Ответ измеряют на выходе цепи — по cAMP, активности PKA или тонусу, — а между рецептором и выходом лежат усиливающие ступени: один активный рецептор успевает перевести в GTP-форму много молекул Gαs. Поэтому половина максимального ответа достигается при занятости, намного меньшей половины. В модели практикума половина максимального расслабления гладкой мышцы достигается при концентрации около 0,03 KD, то есть при занятости около 3 %. Для половины максимального прироста cAMP и доли Gαs-GTP нужна занятость около 20 %, а для PKA — около 9 %: резерв зависит от выбранного выхода. Такое свойство клетки называют [[T93|резервом рецепторов]]: часть рецепторов можно выключить, а максимальный ответ почти не изменится.","Если число рецепторов уменьшить (необратимым антагонистом, интернализацией, снижением экспрессии), кривая «концентрация — ответ» сдвигается вправо: для того же ответа нужно больше агониста, то есть чувствительность снижена (EC50 растёт). Сродство при этом не изменилось: KD остался прежним, а EC50 и KD — разные величины, и совпадать они не обязаны. Максимальный ответ почти сохраняется, пока оставшихся рецепторов хватает на полный ответ; когда резерв исчерпан, снижается и максимум. Так резерв выявляют классическим способом — необратимо выключают долю рецепторов и следят за кривой; понятие эффективности агониста ввёл Stephenson 1956, а связь занятости с ответом при этом описывает операциональная модель Black и Leff 1983. Усиление между ступенями видно и в клетках: у α2C-адренорецептора в клетках CHO-K1 для половины максимума в тесте на связывание GTPγS (на мембранах тех же клеток) нужна занятость примерно в 20 раз больше, чем для половины максимального подавления cAMP в целых клетках (Umland 2001). Откройте вид «Занятость и ответ»: сначала выберите прогноз, затем сравните кривые.","На схеме доля рецепторов в активной конформации показана условным столбиком: это учебные величины, иллюстрирующие смещение равновесия, а не измеренные доли."],"trap":["Агонист «включает» рецептор, переводя его из выключенного состояния во включённое.","Рецептор переходит между конформациями и без лиганда; агонист лишь смещает равновесие в пользу активной конформации. Поэтому существуют базальная активность, частичные и обратные агонисты."],"conditions":"Схема механизма и пороговые величины — по обзору Weis и Kobilka (2018) и структуре комплекса β2AR–Gs (Rasmussen 2011). Доли активной конформации на столбике — учебные, условные. Частичный, обратный агонист и антагонист — пример из фармакологии β-рецепторов. Вид «Занятость и ответ» — расчёт по модели практикума 1б (M1.basic): занятость c/(c + KD), ответ — доля максимального эффекта при занятости, умноженной на долю оставшихся рецепторов; это учебная модель, не измерение. Резерв рецепторов зависит от клетки и измеряемого ответа (Umland 2001, клетки CHO с α2C-адренорецептором).","sources":["Weis2018","Rasmussen2011","Stephenson1956","BlackLeff1983","Umland2001"],"quiz":{"id":"S3-receptor-equilibrium","question":"Частичный агонист добавили в насыщающей концентрации, так что он занял все рецепторы. Почему максимальный ответ ниже, чем у полного агониста?","options":[{"id":"S3-receptor-equilibrium-1","text":"У частичного агониста ниже сродство к рецептору","correct":false,"feedback":"Сродство определяет, при какой концентрации агонист занимает рецепторы, но не высоту максимального ответа. При насыщении все рецепторы заняты независимо от сродства."},{"id":"S3-receptor-equilibrium-2","text":"Он слабее смещает равновесие в сторону активной конформации","correct":true,"feedback":"Частичный агонист имеет меньшую эффективность: даже заняв все рецепторы, он переводит в активную конформацию меньшую их долю, поэтому максимальный ответ ниже."},{"id":"S3-receptor-equilibrium-3","text":"Он смещает равновесие к неактивной конформации","correct":false,"feedback":"К неактивной конформации равновесие смещает обратный агонист, снижая активность ниже базальной. Частичный агонист повышает активность, но не до максимума."}]},"widget":{"kind":"q1equil","title":"","s":{"title":"Равновесие конформаций рецептора","status":"Учебная модель, условные величины","modes_label":"Лиганд","modes":["нет лиганда","полный агонист","частичный агонист","обратный агонист","антагонист"],"caxis":"Доля рецепторов в активной конформации (R*)","bartop":"R*","rInact":"R\nнеактивен","rAct":"R*\nактивен","shift":["","равновесие смещено к R*","равновесие смещено к R* частично","равновесие смещено к R","равновесие не сдвинуто (карман занят)"],"lig":["базальная активность","полный агонист","частичный агонист","обратный агонист","антагонист"],"frac":[0.03,0.9,0.45,0.004,0.03],"notes":["Без лиганда доля рецепторов в активной конформации мала — это базальная активность рецептора.","Полный агонист сильно смещает равновесие: активна почти вся популяция рецепторов.","Частичный агонист смещает равновесие не полностью: даже при насыщении активна лишь часть рецепторов.","Обратный агонист смещает равновесие к неактивной конформации, снижая активность ниже базальной.","Антагонист занимает карман, но сам не сдвигает равновесие: доля R* остаётся такой же, как без лиганда."],"view_label":"Вид","views":["Конформации рецептора","Занятость и ответ"],"fw":[2,5,3.5,1,2],"bw":[3.5,1.5,2.5,5,3.5],"ligL":"меняет скорости переходов","legend":"Две встречные стрелки — два превращения; толщина стрелки — относительная скорость перехода (учебная величина). Лиганд (бирюзовая пунктирная стрелка) не заменяет эти переходы, а меняет их скорости и тем самым равновесное распределение; антагонист карман занимает, но скорости не меняет.","title2":"Занятость рецепторов и ответ клетки","status2":"Расчёт по модели практикума; числа учебные","fvals":[1,0.3,0.1,0.03],"fL":"Доля оставшихся рецепторов","fopts":["100 %","30 %","10 %","3 %"],"pred_q":"Прогноз. Необратимо выключили 70 % рецепторов, осталось 30 %. Что произойдёт с кривой «концентрация агониста — ответ клетки»?","pred_opts":["Кривая сдвинется вправо, а максимальный ответ почти не изменится","Максимум снизится втрое, а положение кривой не изменится","Кривая не изменится: рецепторов ещё достаточно"],"pred_fb_head":["Верно.","Неверно."],"pred_fb":["Резерв рецепторов позволяет сохранить почти полный ответ при меньшем числе рецепторов, но для него нужна более высокая концентрация агониста.","Максимум почти не снижается, потому что для полного ответа хватает малой доли занятых рецепторов; падает чувствительность, а не максимум. Положение кривой при этом меняется.","Сдвиг есть: при той же концентрации занято втрое меньше рецепторов от исходного числа, и для прежнего ответа нужно больше агониста."],"xticks":["0,001","0,01","0,1","1","10","100"],"xax":"концентрация агониста, в единицах KD (логарифмическая шкала)","yax":"доля от максимума, %","l_occ":"занятость","l_all":"ответ, все рецепторы","l_red":"ответ, осталось {f} % рецепторов","m_kd":"Занятость 50 % при","m_ec":"Ответ 50 % от своего максимума (EC50) при","m_max":"Максимальный ответ","note0":"Половина рецепторов занята при концентрации 1 KD, а половина максимального ответа достигается при концентрации около 0,03 KD. Поэтому кривая ответа лежит значительно левее кривой занятости. Выберите прогноз, чтобы увидеть, что будет при потере рецепторов.","note_all":"Рецепторы не выключены. EC50 ответа намного меньше KD: из-за усиления после рецептора для половины максимума достаточно малой занятости.","note_red":"Осталось {f} % рецепторов. EC50 ответа вырос с {e1} до {ec} KD (×{sh}), а максимальный ответ составляет {mx} % от прежнего. KD не изменился — изменилась чувствительность ответа.","legend2":"Числа получены из модели практикума 1б (клетка гладкой мышцы бронха); резерв зависит от клетки и от измеряемого ответа. Кривые построены по формулам, а не измерены."}},"section":0,"number":1,"question":1,"exam_quiz":{"question":"Полный агонист вызывает максимальный ответ ткани, когда занято около 20 % рецепторов: в ткани есть резерв рецепторов. Часть рецепторов необратимо выключили, осталась половина исходного числа. Как изменится кривая «концентрация агониста — ответ»?","options":[{"id":"S3-receptor-equilibrium-x2","text":"Максимум уменьшится вдвое вместе с числом рецепторов","correct":false,"feedback":"Так было бы без резерва, когда ответ пропорционален числу занятых рецепторов. При резерве максимум достигается при неполной занятости, поэтому половины рецепторов ещё достаточно."},{"id":"S3-receptor-equilibrium-x1","text":"Максимум сохранится, а кривая сдвинется вправо, к более высоким концентрациям","correct":true,"feedback":"Для прежнего максимума достаточно занять около 20 % исходного числа рецепторов, то есть около 40 % оставшихся. Это возможно, но при более высокой концентрации агониста: оставшиеся рецепторы нужно занять в большей доле. Максимум сохраняется, пока резерв не исчерпан."},{"id":"S3-receptor-equilibrium-x3","text":"Кривая не изменится, потому что сродство агониста к рецептору прежнее","correct":false,"feedback":"Сродство (KD) действительно прежнее, и занятость растёт с концентрацией по прежней кривой. Но число рецепторов уменьшилось, поэтому для того же ответа нужна большая занятость, а значит, и более высокая концентрация агониста: кривая ответа сдвигается."}]}},{"id":"gs-cycle","questions":[1],"title":"Как рецептор активирует Gαs и чем ограничено время её активности","keywords":["Gαs","GEF","обмен нуклеотида","GTP","ГТФаза","холерный токсин","аденилатциклаза"],"lead":["Активный рецептор служит фактором обмена гуаниновых нуклеотидов для [[T05|Gαs]].","Время активного состояния Gαs ограничено её собственной [[T07|ГТФазной активностью]]."],"mechanism":["Активный рецептор раскрывает нуклеотид-связывающий карман Gαs и ускоряет обмен GDP на GTP.","Gαs-GTP отделяется от βγ, связывается с аденилатциклазой и активирует синтез cAMP.","Субъединица αs за счёт собственной ГТФазной активности гидролизует GTP и возвращается в GDP-форму — передача сигнала прекращается."],"paragraphs":["Гетеротримерный G-белок в покое несёт на α-субъединице GDP, связанный настолько прочно, что самопроизвольный обмен занимает минуты. Активный рецептор, связавшись с гетеротримером, раскрывает нуклеотид-связывающий карман и на несколько порядков ускоряет высвобождение GDP; его место занимает GTP, концентрация которого в цитозоле выше. Иначе говоря, рецептор служит фактором обмена гуаниновых нуклеотидов (GEF) для Gαs: он не переносит фосфат и не расходует ATP, а снижает кинетический барьер диссоциации GDP.","Связывание GTP приводит к диссоциации гетеротримера: Gαs-GTP отделяется от димера βγ, связывается с аденилатциклазой и активирует её. Это первый пример механизма, который в главе повторяется: состояние переключателя задаётся не самим переключателем, а белками, ускоряющими переходы между его состояниями. Тот же принцип «рецептор — это GEF» лежит в основе цикла малой ГТФазы RAS (вопрос 3), где фактором обмена служит SOS1.","Инактивация происходит на уровне самого G-белка: α-субъединица — это ГТФаза, она гидролизует связанный GTP и воссоединяется с βγ. Для Gs ускорение этого гидролиза классическими RGS-белками, как правило, не показано, поэтому время существования активного Gs задаётся прежде всего собственной ГТФазной активностью αs. [[T08|Холерный токсин]] ADP-рибозилирует в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляет этот гидролиз: Gαs остаётся в GTP-форме и активирует аденилатциклазу без всякого агониста.","Переключите состояния на схеме: видно, как рецептор ускоряет обмен, Gαs-GTP активирует аденилатциклазу, а гидролиз GTP возвращает систему в покой."],"trap":["Рецептор передаёт сигнал, фосфорилируя Gαs или перенося на неё фосфат.","Рецептор не переносит фосфат: он ускоряет обмен GDP на GTP как фактор обмена гуаниновых нуклеотидов. Фосфат на Gαs не переносится: GTP поступает из цитозоля как целый нуклеотид."],"conditions":"Схема механизма — по Weis и Kobilka (2018) и структуре β2AR–Gs (Rasmussen 2011). Эффект холерного токсина — Cassel и Selinger (1977), мембраны эритроцитов индейки; остаток Arg187 короткой изоформы Gαs (Arg201 в длинной) — Freissmuth и Gilman (1989).","sources":["Weis2018","Rasmussen2011","Cassel1977","Freissmuth1989"],"quiz":{"id":"S3-gs-cycle","question":"Клетки обработали холерным токсином без добавления агониста. Как изменится концентрация cAMP?","options":[{"id":"S3-gs-cycle-1","text":"Останется исходной: без агониста рецептор не активирует Gαs","correct":false,"feedback":"Токсин делает Gαs активной в обход рецептора: агонист для этого не нужен. Концентрация cAMP повышается."},{"id":"S3-gs-cycle-2","text":"Повысится и останется повышенной: Gαs остаётся в GTP-форме","correct":true,"feedback":"Токсин подавляет гидролиз GTP на αs, поэтому Gαs-GTP накапливается и постоянно активирует аденилатциклазу без агониста."},{"id":"S3-gs-cycle-3","text":"Кратковременно повысится, затем вернётся к исходному значению из-за гидролиза GTP","correct":false,"feedback":"Токсин подавляет именно гидролиз GTP. Поэтому повышенная концентрация cAMP сохраняется и к исходному значению не возвращается."}]},"widget":{"kind":"net","title":"","s":{"title":"Цикл Gαs: обмен нуклеотида и гидролиз","status":"Схема механизма","modes_label":"Состояние","modes":["покой","агонист: обмен GDP → GTP","Gαs-GTP активирует циклазу","гидролиз: возврат","холерный токсин"],"h":250,"w":620,"areas":[{"kind":"mem","y":54,"lx":10,"ly":44,"label":"плазматическая мембрана"}],"nodes":[{"id":"rec","x":16,"y":70,"w":104,"h":40,"label":"β2-рецептор","fs":12.5},{"id":"gsd","x":180,"y":150,"w":120,"h":40,"label":"Gαs·GDP","fs":13},{"id":"gst","x":180,"y":70,"w":120,"h":40,"label":"Gαs·GTP","fs":13},{"id":"ac","x":380,"y":70,"w":150,"h":40,"label":"аденилатциклаза","fs":12.5}],"edges":[{"id":"ex","pts":[240,150,240,112],"type":"act","label":"обмен GDP → GTP","lx":120,"ly":135},{"id":"rec2","pts":[120,96,176,120],"type":"act"},{"id":"hy","pts":[292,112,292,148],"type":"move","label":"гидролиз GTP","lx":352,"ly":135},{"id":"ac2","pts":[300,90,378,90],"type":"act"}],"states":[{"on":[],"show":[],"note":"Без агониста Gαs почти вся в GDP-форме, активность аденилатциклазы низкая (базальная).","cur":["gsd"]},{"on":["rec","gst"],"show":["rec2","ex"],"note":"Агонист активировал рецептор; как фактор обмена он ускоряет замену GDP на GTP, и Gαs переходит в GTP-форму."},{"on":["rec","gst","ac"],"show":["rec2","ex","ac2"],"note":"Gαs-GTP отделилась от βγ и связала аденилатциклазу: начинается синтез cAMP."},{"on":[],"show":["hy"],"note":"Субъединица αs за счёт собственной ГТФазной активности гидролизовала GTP и вернулась в неактивную GDP-форму (синяя рамка — текущая форма, заливки нет): активация аденилатциклазы прекращается.","cur":["gsd"]},{"on":["gst","ac"],"show":["ac2"],"hide":["hy"],"drugs":[[300,150,"холерный токсин"]],"note":"Холерный токсин подавил гидролиз GTP: Gαs-GTP сохраняется и активирует аденилатциклазу без агониста."}],"legend":"Жёлтая заливка — активная форма белка; синяя рамка без заливки — текущая неактивная форма; пунктир — перенос или превращение."}},"section":0,"number":2,"question":1},{"id":"camp-pka","questions":[1],"title":"Как баланс синтеза и гидролиза задаёт концентрацию cAMP и как cAMP активирует PKA","keywords":["cAMP","аденилатциклаза","фосфодиэстераза","PDE4","PKA","форсколин","ролипрам","баланс"],"lead":["Концентрация [[T10|cAMP]] определяется балансом синтеза аденилатциклазой и гидролиза [[T11|фосфодиэстеразами]].","cAMP освобождает каталитические субъединицы [[T12|PKA]], снимая торможение регуляторными субъединицами."],"mechanism":["Аденилатциклаза синтезирует cAMP из ATP, фосфодиэстеразы гидролизуют его до 5'-AMP.","Стационарная концентрация cAMP устанавливается, когда скорость синтеза равна скорости гидролиза.","cAMP связывается с регуляторными субъединицами PKA (по два участка на каждую) и освобождает каталитические."],"paragraphs":["Концентрация cAMP в данном объёме меняется по уравнению баланса: скорость синтеза аденилатциклазой минус скорость гидролиза фосфодиэстеразами. Стационарная концентрация достигается, когда эти скорости равны. Отсюда два следствия, которые часто смешивают. Если после прекращения стимула синтез падает, концентрация снижается со скоростью гидролиза; если подавить фосфодиэстеразу при продолжающемся синтезе, концентрация растёт до нового стационарного значения. Поэтому [[T13|форсколин]] (прямой активатор аденилатциклазы) повышает концентрацию cAMP в обход рецептора, а [[T14|ролипрам]] (ингибитор PDE4) повышает её, замедляя гидролиз.","Меняйте на схеме положение ползунков синтеза и гидролиза: стационарная концентрация cAMP определяется их соотношением. Это объясняет, почему ингибитор фосфодиэстеразы продлевает ответ, не затрагивая рецептор, а β-блокатор действует на рецептор, не меняя скорость гидролиза cAMP. Два препарата меняют разные члены одного баланса.","Главный эффектор cAMP в этом пути — протеинкиназа A. В покое это тетрамер из двух регуляторных и двух каталитических субъединиц (R₂C₂); регуляторная субъединица закрывает у каталитической участок связывания субстрата. На каждой регуляторной субъединице есть два участка связывания cAMP. Связывание cAMP снимает торможение и освобождает каталитические субъединицы. Поскольку нужно занять несколько участков, зависимость активности PKA от концентрации cAMP круче простого гиперболического насыщения; так плавное изменение сигнала преобразуется в более резкий ответ.","У cAMP есть и мишени помимо PKA: например, каналы HCN проводящей системы сердца связывают cAMP напрямую. Но в разбираемом пути ответ опосредован PKA."],"trap":["Концентрацию cAMP определяют только фосфодиэстеразы, а не скорость синтеза.","Концентрацию cAMP определяют обе скорости: и синтез аденилатциклазой, и гидролиз фосфодиэстеразами. После остановки синтеза именно скорость гидролиза определяет, как быстро концентрация вернётся к исходной."],"conditions":"Уравнение баланса cAMP — §3.3 главы 3 и обзор Zaccolo (2021). Концентрация cAMP на схеме — расчёт по модели практикума (кратность относительно исходной концентрации). Форсколин — прямой активатор циклазы (Seamon 1981); ролипрам — избирательный ингибитор PDE4. Числовые доли фосфорилирования — учебные.","sources":["Zaccolo2020","Seamon1981","Weis2018"],"quiz":{"id":"S3-camp-pka","question":"В клетках с постоянным синтезом cAMP добавили ролипрам (ингибитор PDE4). Как изменится стационарная концентрация cAMP?","options":[{"id":"S3-camp-pka-1","text":"Повысится: при том же синтезе гидролиз замедлен","correct":true,"feedback":"Ролипрам подавляет часть гидролиза, поэтому при том же синтезе стационарная концентрация cAMP устанавливается выше."},{"id":"S3-camp-pka-2","text":"Снизится: ролипрам тормозит аденилатциклазу","correct":false,"feedback":"Ролипрам действует на фосфодиэстеразу, а не на циклазу: он замедляет удаление cAMP, а не синтез."},{"id":"S3-camp-pka-3","text":"Не изменится: концентрацию cAMP задаёт только синтез","correct":false,"feedback":"Концентрация cAMP определяется балансом синтеза и гидролиза. Подавляя гидролиз, ролипрам повышает её даже при неизменном синтезе."}]},"widget":{"kind":"q1balance","title":"","s":{"title":"Баланс синтеза и гидролиза cAMP","status":"Расчёт по заданным параметрам","synL":"Синтез (аденилатциклаза)","hydL":"Гидролиз (фосфодиэстеразы)","unit":"×","ac":"аденилатциклаза","pde":"фосфодиэстеразы","synL2":"синтез","hydL2":"гидролиз","freed":"cAMP освободил каталитические субъединицы PKA","bound":"PKA заторможена: тетрамер R₂C₂","note":"Концентрация cAMP в этих условиях — ×{c} от исходной. Усиление синтеза или замедление гидролиза повышает её.","amp":"5′-AMP","legend":"Синяя стрелка — превращение; пунктир с точкой — катализ: фосфодиэстераза ускоряет гидролиз cAMP до 5′-AMP, но не тормозит сам cAMP."}},"section":0,"number":3,"question":1,"exam_quiz":{"question":"В двух линиях клеток одинаковы количества β2-адренорецептора, Gs и аденилатциклазы, скорость гидролиза cAMP не изменена, связывание агониста с рецептором сохранено. В мутантной линии изопротеренол не повышает cAMP, а форсколин повышает его так же, как в контроле. Какое объяснение совместимо с этими данными?","options":[{"id":"S3-camp-pka-x2","text":"Аденилатциклаза полностью неактивна и не синтезирует cAMP даже при добавлении форсколина","correct":false,"feedback":"Форсколин действует на тот же фермент. Если бы аденилатциклаза была неактивна, cAMP не повысился бы и при добавлении форсколина."},{"id":"S3-camp-pka-x3","text":"PKA неактивна, и рецептор не передаёт сигнал к циклазе","correct":false,"feedback":"PKA активируется после образования cAMP. При неизменных количествах названных в условии белков и скорости гидролиза cAMP неактивность PKA сама по себе не объясняет, почему изопротеренол не повышает концентрацию cAMP, тогда как форсколин её повышает."},{"id":"S3-camp-pka-x1","text":"Нарушено сопряжение рецептора с аденилатциклазой через Gs","correct":true,"feedback":"Форсколин напрямую активирует аденилатциклазу в обход рецептора и Gs, и синтез cAMP восстанавливается: фермент работает. Агонист связывается, но cAMP не растёт, значит, нарушено звено между рецептором и активацией фермента. Это выбор среди заданных альтернатив: опыт не различает дефект активации Gs рецептором и дефект активации аденилатциклазы белком Gs, и один опыт не показывает, какой именно молекулярный дефект вызвал нарушение."}]}},{"id":"cell-context","questions":[1],"title":"Почему один и тот же путь даёт разные ответы в разных клетках","keywords":["клеточный контекст","мишени PKA","кардиомиоцит","гладкая мышца","адипоцит","β1","β2","α1","опорная остановка"],"lead":["Опорная остановка 2 из 8 · контекст клетки: один и тот же сигнал рецептора даёт разный ответ в разных клетках из-за набора мишеней; продолжает остановку 1.","Один путь Gs–cAMP–PKA даёт расслабление бронха, усиление работы сердца и липолиз.","Направление ответа задаёт [[T15|набор белков-эффекторов]], которые PKA фосфорилирует в данной клетке."],"mechanism":["Путь от рецептора до PKA в этих клетках одинаков; различаются мишени PKA.","В кардиомиоците PKA фосфорилирует CaV1.2, фосфоламбан и тропонин I — сила сокращения и скорость расслабления растут.","В гладкой мышце бронха PKA несколькими путями снижает тонус: уменьшает активность MLCK (вклад этого механизма in vivo обсуждается) и повышает выход K⁺. В результате наступает расслабление. В адипоците PKA фосфорилирует липазу и перилипин — липолиз усиливается."],"paragraphs":["Ответ клетки определяется не фактом активации рецептора, а тем, какие подтипы рецепторов в ней есть, с какими G-белками они сопряжены и какие эффекторы присутствуют. Расхождение ответов на адреналин возникает на двух уровнях. Первый — выбор G-белка: α1-рецепторы через Gq повышают концентрацию Ca²⁺, α2 через Gi снижают концентрацию cAMP, а β1 и β2 через Gs повышают её. Второй уровень — эффекторы клетки: β1 и β2 сопряжены с одним и тем же Gs (β2-рецептор кардиомиоцита может также сопрягаться с Gi; здесь рассматривается путь через Gs), и противоположный физиологический результат в сердце и бронхе задаётся тем, какие белки PKA фосфорилирует.","В кардиомиоците мишени PKA — белок Rad, тормозящий канал CaV1.2 (после фосфорилирования Rad вход Ca²⁺ через канал усиливается), фосфоламбан (снятие торможения SERCA2a ускоряет закачку Ca²⁺ в ретикулум) и тропонин I (расслабление ускоряется). В результате возрастают сила и скорость сокращения и ускоряется расслабление.","В гладкой мышце бронха PKA снижает сродство MLCK к Ca²⁺–кальмодулину, повышает активность K⁺-каналов (гиперполяризация уменьшает вход Ca²⁺) и тормозит образование IP₃. Суммарный результат — расслабление. Насколько велик вклад именно фосфорилирования MLCK in vivo, обсуждается: PKA действует на тонус несколькими путями. В адипоците PKA фосфорилирует гормон-чувствительную липазу и перилипин-1, открывая липазам доступ к липидной капле; в результате липолиз ускоряется. В гепатоците путь Gs–cAMP–PKA запускает глюкагон (адреналин действует здесь и через β2-рецепторы, и через α1-рецепторы с повышением концентрации Ca²⁺): PKA фосфорилирует и активирует киназу фосфорилазы, киназа фосфорилазы фосфорилирует и активирует гликогенфосфорилазу, и гликогенолиз ускоряется; одновременно фосфорилирование гликогенсинтазы тормозит синтез гликогена (Jiang и Zhang 2003; Roach 2012).","Заметим о подтипах рецепторов: в сердце человека преобладают β1-рецепторы (в предсердии примерно 70 % β1 и 30 % β2), а β2 составляет меньшую часть, но путь ниже рецептора тот же. В модели практикума всё выше PKA одинаково во всех трёх клетках — так выделена роль именно набора мишеней. На схеме значок P стоит только на белках, которые фосфорилирует PKA; образование IP₃ показано пунктирной рамкой как непрямое звено без значка P, а параллельные эффекты PKA сведены в общий итог."],"trap":["Расслабление бронха и усиление работы сердца противоположны, потому что в этих клетках работают разные G-белки.","В обеих клетках β-рецепторы сопряжены с Gs, и в обеих растёт концентрация cAMP и активируется PKA. Противоположный ответ задан разными мишенями PKA, а не выбором G-белка (он различает пару α1/β2, но не β1/β2)."],"conditions":"Мишени PKA — по обзору Billington (2013) для гладкой мышцы (Conti и Adelstein 1981; Kume 1994) и Bers (2002) для кардиомиоцита (регуляция CaV1.2 через Rad — Liu 2020); липолиз — Anthonsen (1998), Granneman (2009). Доли β1/β2 в предсердии человека — Michel и Brodde (1988). Числа на схеме — из модели практикума (занятость 80 %). Гликогенолиз в гепатоците — обзоры Jiang и Zhang (2003), Roach и соавт. (2012).","sources":["Billington2013","Bers2002","Liu2020","ContiAdelstein1981","Kume1994","Anthonsen1998","Granneman2009","Michel1988","JiangZhang2003","Roach2012"],"quiz":{"id":"S3-cell-context","question":"В кардиомиоците и в гладкой мышце бронха β-стимуляция одинаково повышает концентрацию cAMP. Почему сокращение усиливается в одной клетке и ослабевает в другой?","options":[{"id":"S3-cell-context-1","text":"В бронхе рецептор сопряжён с Gi, а в сердце — с Gs","correct":false,"feedback":"В обеих клетках β-рецепторы сопряжены с Gs и повышают концентрацию cAMP. Разница не в G-белке."},{"id":"S3-cell-context-2","text":"PKA фосфорилирует в этих клетках разные белки","correct":true,"feedback":"Путь до PKA одинаков, но набор белков-эффекторов разный, поэтому один посредник даёт противоположные физиологические ответы."},{"id":"S3-cell-context-3","text":"В бронхе cAMP не активирует PKA","correct":false,"feedback":"cAMP активирует PKA и в бронхе; PKA снижает тонус бронха несколькими путями: уменьшает активность MLCK (вклад этого пути in vivo обсуждается) и повышает активность K⁺-каналов."}]},"widget":{"kind":"q1cell","title":"","s":{"title":"Один путь — разные мишени PKA","status":"Результат модели практикума (занятость 80 %)","modes_label":"Клетка","modes":["гладкая мышца бронха","кардиомиоцит","адипоцит"],"pka":"PKA (активна)","outs":["тонус ↓ (расслабление)","сила сокращения и скорость расслабления ↑","липолиз ↑"],"outv":["расслабление","усиление сокращения","мобилизация жира"],"notes":["PKA снижает тонус гладкой мышцы: {out}.","PKA усиливает и ускоряет работу сердца: {out}.","PKA ускоряет липолиз в адипоците: {out}."],"tg":[[["MLCK","сродство к Ca²⁺–кальмодулину ↓","p",-1],["K⁺-каналы BK","активность ↑: вход Ca²⁺ ↓","p",-1],["образование IP₃ (непрямо)","высвобождение Ca²⁺ из депо ↓","i",-1]],[["Rad (тормозит CaV1.2)","вход Ca²⁺ ↑ (торможение снято)","p",1],["фосфоламбан (Ser16)","закачка Ca²⁺ в СР ↑","p",1],["тропонин I (Ser23/24)","расслабление быстрее","p",1]],[["гормон-чувствительная липаза","активность ↑","p",1],["перилипин-1","доступ липаз к капле ↑","p",1]]],"outn":["тонус гладкой мышцы","работа кардиомиоцита","обмен жира в адипоците"],"legend":"Значок P — белок фосфорилирован протеинкиназой A. Синяя стрелка к итогу — действие PKA через это звено повышает показатель, красный Т-образный знак — снижает его. Пунктирная рамка — непрямое звено: PKA снижает образование IP₃ через регуляторные белки, фосфорилируемый белок не показан. Жёлтая заливка — активная PKA и итоговый ответ."}},"section":0,"number":4,"question":1},{"id":"compartments","questions":[1],"title":"Почему место повышения концентрации cAMP важно так же, как её величина","keywords":["компартментализация","микродомен","AKAP","PDE4","длина диффузии","эндосома","λ"],"lead":["Повышение концентрации cAMP в клетке неоднородно: разные участки отвечают на один агонист по-разному.","Размер области повышенной концентрации cAMP определяется балансом источника и стока; [[T16|AKAP]] удерживает PKA у определённых мишеней."],"mechanism":["Источник cAMP — аденилатциклаза у рецептора; сток — фосфодиэстеразы, распределённые неравномерно.","Характерный размер области повышенной концентрации cAMP оценивается длиной диффузии λ = √(D/k).","Якорные белки AKAP удерживают PKA (а часто и PDE, и циклазу) у конкретного участка, поэтому при одной и той же средней концентрации cAMP фосфорилируются разные субстраты."],"paragraphs":["Классическая схема «рецептор на поверхности → посредник в объёме цитозоля → мишени по всей клетке» описывает опыты на суспензиях, но не наблюдения на отдельной живой клетке. Локализованные биосенсоры показали, что повышение концентрации cAMP неоднородно: разные участки одной клетки отвечают на один агонист по-разному, а разные агонисты с одинаковым суммарным повышением концентрации cAMP дают разные функциональные ответы.","Локальную концентрацию посредника задаёт тройка «источник — диффузия — сток», а характерный размер области повышенной концентрации оценивается длиной диффузии λ = √(D/k): здесь D — коэффициент диффузии cAMP, k — константа скорости его гидролиза. Меняйте на схеме активность фосфодиэстераз: чем выше их активность, тем меньше размер микродомена. Это расчёт по формуле из врезки главы, а не экспериментальные данные; реальная клетка сложнее (буферирование cAMP, вязкость, физические барьеры).","Протеинкиназа A, главная мишень cAMP, не распределена в клетке свободно, а закреплена в определённом месте якорными белками семейства AKAP. Поэтому PKA, закреплённая на участке ретикулума с SERCA, и PKA, закреплённая на плазматической мембране, фосфорилируют разные субстраты при одной и той же средней концентрации cAMP. AKAP нередко удерживают рядом и аденилатциклазу, и фосфодиэстеразы, собирая локальный узел регуляции.","Активность рецептора к тому же не заканчивается на поверхности: β2-рецепторы остаются активными в ранней эндосоме и дают там отсроченный эндосомный компонент ответа cAMP (Irannejad 2013). Отдельный второй пик суммарной концентрации при этом не обязателен: вклад эндосомного синтеза зависит от клетки и условий. Интернализация переносит источник cAMP из одного компартмента в другой, а не просто прекращает сигнал. В модели десенситизации (шаг «Десенситизация») этот компонент не учтён."],"trap":["Концентрация cAMP одинакова во всех участках клетки, поэтому важен только суммарный уровень cAMP.","Повышение концентрации cAMP неоднородно: его локальную концентрацию задают источник, диффузия и сток, а PKA закреплена в определённых местах якорными белками AKAP. Поэтому одинаковое суммарное повышение концентрации cAMP может иметь разные следствия в зависимости от того, где оно произошло."],"conditions":"Неоднородность cAMP и роль AKAP — обзор Zaccolo (2021); сигнал из эндосомы — Irannejad (2013), клетки HEK293 с конформационными биосенсорами. Кривая λ = √(D/k) — иллюстрация уравнения (расчёт по формуле), D ≈ 40 мкм²/с по Zaccolo (2021); не экспериментальные данные.","sources":["Zaccolo2020","Irannejad2013"],"quiz":{"id":"S3-compartments","question":"Что показывает оценка λ = √(D/k) для области повышенной концентрации cAMP?","options":[{"id":"S3-compartments-1","text":"Чем активнее фосфодиэстеразы, тем меньше область повышенной концентрации cAMP","correct":true,"feedback":"λ убывает с ростом k: при быстром гидролизе высокая концентрация cAMP сохраняется лишь вблизи источника, и микродомен сужается."},{"id":"S3-compartments-2","text":"Чем активнее фосфодиэстеразы, тем больше область повышенной концентрации cAMP","correct":false,"feedback":"Наоборот: больший k означает более быстрый гидролиз, и область повышенной концентрации cAMP сужается."},{"id":"S3-compartments-3","text":"Размер области не зависит от активности фосфодиэстераз","correct":false,"feedback":"Зависит: λ = √(D/k) прямо связывает размер домена с константой скорости гидролиза k."}]},"widget":{"kind":"q1domain","title":"","s":{"title":"Размер микродомена cAMP: λ = √(D/k)","status":"Расчёт по формуле (не экспериментальные данные)","kL":"Активность фосфодиэстераз (k)","kU":"с⁻¹","xax":"расстояние от источника, мкм","note":"При текущей активности фосфодиэстераз длина диффузии λ ≈ {l} мкм: на этом расстоянии концентрация cAMP снижается примерно в e раз."}},"section":0,"number":5,"question":1},{"id":"desensitization","questions":[1],"title":"Как ответ ослабевает при длительной стимуляции","keywords":["десенситизация","GRK","β-аррестин","интернализация","рекрутирование","смещённый агонизм","опорная остановка"],"lead":["Опорная остановка 3 из 8 · сигнал и его прекращение: ответ ослабевает не только из-за удаления агониста, но и из-за изменений самого рецептора; продолжает остановку 2.","При длительном действии агониста ответ рецептора ослабевает — это десенситизация.","Её запускают [[T17|GRK]], фосфорилирующие активный рецептор, и [[T18|β-аррестин]], связывающийся с фосфорилированным рецептором."],"mechanism":["GRK распознают активную конформацию рецептора и переносят фосфатные группы на его внутриклеточный хвост.","β-аррестин связывается с фосфорилированным рецептором и стерически препятствует связыванию G-белка: передача сигнала от этого рецептора через Gs блокируется.","β-аррестин направляет рецептор в эндосому (интернализация); дальше рецептор возвращается на поверхность или разрушается."],"paragraphs":["Активную конформацию рецептора распознаёт не только G-белок, но и киназы GRK: они переносят фосфатные группы на остатки серина и треонина внутриклеточного хвоста рецептора. Субстратом этих киназ служит преимущественно рецептор в активной конформации, поэтому его фосфорилирование следует за активацией, а степень фосфорилирования пропорциональна интенсивности стимуляции. Так механизм выключения запускается тем же событием, что и сам сигнал.","Дальше нужно различать четыре события, которые в старых учебниках объединены в одно. Привлечение (рекрутирование) — β-аррестин связывается с фосфорилированным активным рецептором. Десенситизация — связанный β-аррестин стерически перекрывает поверхность, с которой взаимодействует G-белок, и передача через Gs от этого рецептора прекращается. Интернализация — β-аррестин связывается с компонентами клатринового аппарата и направляет рецептор в эндосому; его дальнейшая судьба (возврат на поверхность за минуты или деградация за часы) определяет, как быстро восстановится чувствительность. Каркасная функция — β-аррестин служит каркасным белком (скаффолдом), на котором собираются белки других сигнальных путей.","В клетках HEK293 с эндогенным β2-рецептором (Violin 2008, 37 °C, 1 мкМ изопротеренола) максимум cAMP достигается в первые десятки секунд, затем сигнал спадает за несколько минут; по модели авторов, половина активных рецепторов инактивируется примерно за 70 с (полувремя инактивации). Из GRK2, GRK3, GRK5 и GRK6 на этот процесс влиял только нокдаун GRK6. Числа на схеме — из модели практикума, откалиброванной по этим данным. В модели практикума к 10-й минуте cAMP составляет около ×1,8 от исходного (на пике — около ×9), а активность PKA — около 17 % (исходно около 6 %): ответ сильно ослаблен, но не исчез. Синтез cAMP в эндосомах в модели не учтён.","Из каркасной функции долго делали вывод, что β-аррестин запускает «вторую ветвь» сигнала, независимую от G-белков. Как общее правило это не подтвердилось: в клетках без функциональных Gα-белков β-аррестин обеспечивал интернализацию, но не активацию ERK (Grundmann 2018). Поэтому смещённый агонизм — обоснованная стратегия поиска лекарств, а не установленный клинический принцип."],"trap":["β-аррестин связывается с рецептором — значит, он запускает собственный сигнал без G-белка.","Связывание β-аррестина — это прежде всего десенситизация и интернализация. Самостоятельный сигнал без G-белков как общее правило не подтверждён (Grundmann 2018): зависимость ответа от G-белков нужно проверять для каждого рецептора отдельно."],"conditions":"Четыре события β-аррестина — обзоры по GPCR (Weis 2018); проверка независимости от G-белков — Grundmann (2018), клетки HEK293 без функциональных Gα. Динамика cAMP — Violin (2008): HEK293 с эндогенным β2-рецептором (~100 фмоль/мг), сенсор ICUE2, 1 мкМ изопротеренол, 37 °C; нокдаун siRNA GRK2/3/5/6 (>90 %) на фоне H-89 и β-аррестинов 1 и 2 (~75 %). Числа на схеме — модель практикума, откалиброванная по этим данным; доля рецепторов в эндосоме — учебная оценка (интернализацию Violin не измеряли). Эндосомный синтез cAMP в модели не учтён; в живых клетках интернализованный β2-рецептор может продолжать передачу сигнала (Irannejad 2013).","sources":["Weis2018","Grundmann2018","Violin2008","Irannejad2013"],"quiz":{"id":"S3-desensitization","question":"В клетках с подавленным синтезом β-аррестина добавили изопротеренол в насыщающей концентрации. Как изменится спад сигнала cAMP по сравнению с обычными клетками?","options":[{"id":"S3-desensitization-1","text":"Спад станет быстрее: β-аррестин замедляет десенситизацию","correct":false,"feedback":"β-аррестин не замедляет, а обеспечивает десенситизацию. Без него она ослаблена, и спад идёт медленнее."},{"id":"S3-desensitization-2","text":"Спад исчезнет полностью: cAMP останется на пике","correct":false,"feedback":"Спад сохранится: PKA по-прежнему активирует PDE4 и ускоряет гидролиз cAMP. Без β-аррестина он лишь замедляется."},{"id":"S3-desensitization-3","text":"Спад замедлится: рецептор дольше активирует Gs","correct":true,"feedback":"Без β-аррестина фосфорилированный рецептор дольше активирует Gs, поэтому сигнал спадает медленнее, хотя активация PDE4 его всё же снижает."}]},"widget":{"kind":"net","title":"","s":{"title":"Десенситизация во времени","status":"Учебная модель, откалиброванная по Violin 2008 (HEK293, 1 мкМ изопротеренола, 37 °C)","modes_label":"Состояние","modes":["агонист, 1 мин","агонист, 5 мин","агонист, 20 мин","нокдаун β-аррестинов, 5 мин"],"h":230,"w":620,"areas":[{"kind":"mem","y":54,"lx":10,"ly":44,"label":"плазматическая мембрана"},{"x":470,"y":210,"label":"эндосома","anchor":"middle"}],"nodes":[{"id":"rec","x":40,"y":68,"w":120,"h":40,"label":"β2-рецептор","fs":12.5},{"id":"gs","x":210,"y":68,"w":110,"h":40,"label":"Gαs","fs":13},{"id":"arr","x":40,"y":140,"w":120,"h":38,"label":"β-аррестин","fs":12},{"id":"endo","x":410,"y":150,"w":120,"h":38,"label":"рецептор в эндосоме","fs":11}],"edges":[{"id":"e_gs","pts":[160,88,206,88],"type":"act"},{"id":"e_arr","pts":[100,140,100,112],"type":"inh"},{"id":"e_int","pts":[160,160,406,168],"type":"move","label":"интернализация","lx":280,"ly":150}],"states":[{"on":["rec","gs"],"p":["rec"],"show":["e_gs"],"metrics":[["сигнал сенсора cAMP","≈54 %"],["рецепторы на поверхности","≈99 %"],["рецепторы с β-аррестином","≈41 %"]],"note":"Через минуту концентрация cAMP ещё высокая, но киназы GRK уже фосфорилировали рецепторы, и β-аррестин связан с заметной их долей: половина активных рецепторов инактивируется примерно за 70 с (полувремя инактивации)."},{"on":["rec","arr"],"p":["rec"],"inh":["rec"],"show":["e_arr"],"metrics":[["сигнал сенсора cAMP","≈19 %"],["рецепторы на поверхности","≈78 %"],["рецепторы с β-аррестином","≈75 %"]],"note":"β-аррестин связался с фосфорилированным рецептором и стерически препятствует связыванию Gs: передача сигнала от этих рецепторов блокирована, концентрация cAMP снизилась, но остаётся выше исходной."},{"on":["arr","endo"],"p":["rec"],"inh":["rec"],"show":["e_arr","e_int"],"metrics":[["сигнал сенсора cAMP","≈22 %"],["рецепторы на поверхности","≈46 %"],["рецепторы в эндосоме","≈54 %"]],"note":"Значительная доля рецепторов интернализована; ответ значительно ослаб, хотя агонист остаётся в среде. Синтез cAMP в эндосомах в модели не учтён: в живых клетках интернализованный β2-рецептор может продолжать передачу сигнала (Irannejad 2013)."},{"on":["rec","gs"],"p":["rec"],"show":["e_gs"],"metrics":[["сигнал сенсора cAMP","≈51 %"],["рецепторы на поверхности","≈89 %"],["рецепторы с β-аррестином","≈43 %"]],"note":"siRNA снизила количество β-аррестинов (у Violin 2008 — в среднем на 75 %). Поэтому β-аррестин связывается лишь с частью рецепторов, а остальные дольше активируют Gs; на 5-й минуте сигнал ещё остаётся высоким."}]}},"section":0,"number":6,"question":1},{"id":"measure-camp","questions":[1],"title":"Как измеряют cAMP в живой клетке","keywords":["FRET-сенсор","Epac1-camps","CFP","YFP","форсколин","IBMX","калибровка","метод"],"lead":["Концентрацию cAMP в живой клетке измеряют [[T19|FRET-сенсором]] в реальном времени.","Сенсор даёт отношение сигналов двух цветов, а не абсолютную концентрацию cAMP."],"mechanism":["Домен связывания cAMP (из Epac) помещён между двумя флуоресцентными белками — CFP и YFP.","Без cAMP флуоресцентные белки сближены и эффективность переноса энергии (FRET) высока; связывание cAMP меняет конформацию, и FRET ослабевает.","Измеряют отношение сигналов CFP и YFP; максимум калибруют форсколином с IBMX, минимум — по отклику сенсора без связанного cAMP в проверенном протоколе калибровки; обычный исходный сигнал клетки нельзя автоматически считать этим минимумом."],"paragraphs":["Чтобы следить за cAMP в живой клетке, в неё вводят белковый сенсор: домен связывания cAMP (чаще из белка Epac) помещают между двумя флуоресцентными белками — голубым CFP и жёлтым YFP. Когда флуоресцентные белки сближены, энергия возбуждения переносится с CFP на YFP (резонансный перенос, FRET), и в свечении преобладает жёлтый. Связывание cAMP меняет конформацию домена, флуоресцентные белки расходятся, эффективность переноса энергии снижается, и отношение сигналов двух цветов отражает концентрацию cAMP в реальном времени.","Важно, какую величину регистрирует метод. Сенсор измеряет отношение сигналов двух цветов. В одноцепочечном сенсоре оба флуоресцентных белка находятся в одной молекуле, поэтому отношение в идеале уменьшает влияние количества сенсора в клетке: общий множитель сокращается. От количества сенсора зависят яркость и шум измерения, а при высокой экспрессии сенсор буферирует cAMP и сам меняет ответ. Чтобы перевести отношение в концентрацию cAMP, нужны калибровка и кривая отклика: максимум задают форсколином вместе с ингибитором фосфодиэстераз IBMX (сенсор насыщен cAMP), минимум — по отклику сенсора без связанного cAMP в проверенном протоколе калибровки; обычный исходный сигнал клетки нельзя автоматически считать этим минимумом, а связь отношения с концентрацией определяют по кривой связывания cAMP сенсором in vitro. Так Violin и соавт. (2008) с сенсором ICUE2 оценили максимум cAMP при изопротереноле в клетках HEK293 примерно в 10 мкМ. Без калибровки результат приводят в относительных величинах.","У метода есть ограничения, о которых нужно помнить. Сенсор сам связывает cAMP и при высокой экспрессии буферирует его, тем самым несколько изменяя измеряемую величину. Сигнал из целой клетки усредняет микродомены, поэтому локальные различия (шаг о компартментализации) без адресной версии сенсора не видны. Наконец, сенсор на основе одного домена Epac не обладает кооперативностью PKA, поэтому его кривая отклика отличается от зависимости активности PKA от cAMP.","Этим методом и получены данные о коротком всплеске cAMP и о роли PDE4 и десенситизации, на которые опирается продвинутый уровень практикума."],"trap":["FRET-сенсор прямо показывает концентрацию cAMP в молях на литр.","Сенсор даёт отношение сигналов двух цветов. В концентрацию cAMP его переводят только после калибровки: нужны проверенные минимальный и максимальный отклики и кривая связывания in vitro. Максимум получают при насыщении сенсора cAMP; минимум соответствует сенсору без связанного cAMP и требует отдельной проверки."],"conditions":"Схема метода — одноцепочечные сенсоры на домене Epac (Nikolaev 2004); калибровка FRET-сенсоров cAMP — Börner (2011). Данные о динамике cAMP в HEK293 получены сенсором ICUE2 (фрагмент Epac1 между CFP и цитрином, 37 °C; максимум — 50 мкМ форсколина с 200 мкМ IBMX; изопротеренол 1 мкМ давал около половины максимального изменения отношения, 30 ± 2 % против 60 ± 2 %) — Violin (2008). Схема — устройство метода, а не конкретный опыт.","sources":["Nikolaev2004","Boerner2011","Violin2008"],"quiz":{"id":"S3-measure-camp","question":"Что нужно, чтобы перевести изменение сигнала FRET-сенсора в концентрацию cAMP?","options":[{"id":"S3-measure-camp-1","text":"Калибровка: максимум и минимум сигнала и кривая связывания cAMP","correct":true,"feedback":"Сенсор даёт отношение сигналов двух цветов: оно уменьшает влияние количества сенсора, но не выражено в единицах концентрации. Связывает его с концентрацией cAMP только калибровка (проверенные минимальный и максимальный отклики и кривая отклика сенсора in vitro)."},{"id":"S3-measure-camp-2","text":"Ничего: отношение сигналов уже выражено в микромолях","correct":false,"feedback":"Отношение сигналов уменьшает влияние количества сенсора, но само по себе не выражено в единицах концентрации: нужны калибровка и кривая отклика сенсора."},{"id":"S3-measure-camp-3","text":"Достаточно измерить яркость одного жёлтого белка","correct":false,"feedback":"Яркость одного белка зависит от его количества в клетке; метод опирается на отношение двух сигналов и на калибровку."}]},"widget":{"kind":"method","title":"","s":{"title":"FRET-сенсор cAMP","status":"Схема метода","modes_label":"Показать","modes":["Сенсор Epac1-camps","Что метод показывает и чего не показывает"],"schemes":[{"draw":"q1fret","h":270,"l":{"pA":"","a":"Один домен Epac между CFP и YFP","epac":"Epac","off":"без cAMP:","on":"с cAMP:","offv":"белки сближены — FRET высокий","onv":"белки разошлись — FRET снижен","offr":"в свечении больше жёлтого (YFP)","onr":"доля голубого сигнала (CFP) увеличивается"},"note":"Отношение сигналов CFP и YFP отражает концентрацию cAMP. Максимум калибруют форсколином с IBMX, минимум — по отклику сенсора без связанного cAMP в проверенном протоколе калибровки; обычный исходный сигнал клетки нельзя автоматически считать этим минимумом.","legend":"Сенсор измеряет отношение сигналов; концентрацию cAMP даёт только калибровка."},{"draw":"table","head":["Элемент опыта","Что показывает","Ограничение"],"rows":[["FRET-сенсор cAMP в цитоплазме","изменение концентрации cAMP во времени (в относительных единицах)","усредняет сигналы микродоменов; сам буферирует cAMP"],["отношение сигналов CFP и YFP","уменьшает влияние количества сенсора в клетке","не даёт значения концентрации без калибровки; высокая экспрессия может изменить сам ответ"],["форсколин + IBMX","максимум сигнала сенсора (калибровка)","не относится к пути рецептора"],["ингибитор аденилатциклазы","минимум сигнала сенсора (калибровка)","может задавать минимум только в проверенном протоколе; базальный cAMP не равен нулю автоматически"],["адресная версия сенсора (у мембраны, у СР)","концентрация cAMP в конкретном компартменте","нужна отдельная калибровка"]],"note":"Без калибровки метод даёт лишь относительные значения; абсолютную концентрацию cAMP определяют после калибровки (так оценён пик ≈10 мкМ в HEK293, Violin 2008)."}]}},"section":0,"number":7,"question":1},{"id":"phospho-mark","questions":[2],"title":"Что фосфатная группа меняет в белке","keywords":["фосфорилирование","протеинкиназа","протеинфосфатаза","SH2","14-3-3","фосфотирозин","фосфосерин","опорная остановка"],"lead":["Опорная остановка 4 из 8 · фосфат и его следствия: присоединение фосфата — химическое событие, а изменение активности, партнёров, места или срока жизни белка — его следствия; продолжает остановку 3.","[[T20|Протеинкиназа]] переносит фосфатную группу ATP на остаток серина, треонина или тирозина в белке, [[T21|протеинфосфатаза]] её отщепляет.","Фосфат может изменить активность белка, его партнёров, место в клетке или время жизни — эти следствия нужно различать."],"mechanism":["Киназа переносит γ-фосфат ATP на гидроксильную группу остатка; фосфатаза гидролизует фосфоэфирную связь.","Фосфат вносит отрицательный заряд и меняет конформацию белка или создаёт участок узнавания для другого белка.","Фосфорилирование одного и того же участка может активировать белок, тормозить его или менять только его связи — направление эффекта задаёт сам белок."],"paragraphs":["Протеинкиназа переносит γ-фосфатную группу ATP на гидроксильную группу остатка серина, треонина или тирозина белка-субстрата, а протеинфосфатаза гидролизует образовавшуюся фосфоэфирную связь. Это две разные реакции с разными ферментами, а не прямая и обратная стадии одной реакции. Поэтому уровень фосфорилирования определяется парой ферментов, работающих одновременно. В геноме человека 518 генов протеинкиназ (Manning 2002), а в одной клеточной линии HeLa масс-спектрометрия выявила более 50 000 разных фосфопептидов (Sharma 2014).","Фосфатная группа при физиологическом pH несёт отрицательный заряд (около −1,5…−2), объёмна и образует несколько водородных связей. Рядом с каталитическим центром или в петле активации она меняет конформацию фермента и скорость катализа — в сторону активации или торможения. Например, у киназ семейства Src фосфорилирование петли активации повышает активность, а фосфорилирование тирозина на C-конце удерживает фермент в закрытой малоактивной форме.","Второй тип следствий — новые связи. Домены SH2 и PTB распознают фосфотирозин, а белки 14-3-3 — определённые фосфосериновые мотивы (Yaffe 1997). Белок при этом может не менять активности, но меняет партнёров, а значит — место в клетке. Третий и четвёртый типы — изменение локализации и времени жизни: фосфорилированный мотив может стать участком узнавания для убиквитин-лигазы, после чего белок расщепляется в протеасоме.","Переключите режимы схемы: на ней показаны четыре разных следствия одного и того же события — переноса фосфата."],"trap":["Фосфорилирование всегда активирует белок.","Направление эффекта зависит от участка и белка: фосфат может активировать фермент, тормозить его или менять только партнёров, локализацию или время жизни белка. Фосфоламбан (следующие шаги) после фосфорилирования перестаёт тормозить насос."],"conditions":"Схема механизма. Число генов протеинкиназ — Manning 2002 (анализ генома человека); число фосфопептидов — Sharma 2014 (одна линия клеток HeLa, масс-спектрометрия); мотивы узнавания 14-3-3 — Yaffe 1997 (пептидные библиотеки, кристаллическая структура). Заряд фосфата зависит от pH и окружения.","sources":["Manning2002","Sharma2014","Ubersax2007","Yaffe1997"],"quiz":{"id":"S3-phospho-mark","rev":2,"question":"Белок фосфорилировали по серину в пробирке; сохранность фосфата подтверждена, а проба для проверки активности не содержала фосфатазы. Каталитическая активность белка не изменилась. Какой вывод обоснован?","options":[{"id":"S3-phospho-mark-1","text":"Этот участок не регулирует белок","correct":false,"feedback":"Активность — лишь одно из возможных следствий. Фосфосерин может создавать участок узнавания для другого белка (например, белка 14-3-3 при подходящей последовательности), менять локализацию или время жизни белка; это нужно проверять отдельно."},{"id":"S3-phospho-mark-2","text":"Фосфорилирование этого участка может менять партнёров, место или время жизни белка","correct":true,"feedback":"Фосфат часто влияет не на катализ, а на связывание белка с партнёрами: фосфосериновые мотивы узнают белки 14-3-3, фосфорилированный мотив может стать участком узнавания убиквитин-лигазы. Домены SH2 и PTB, напротив, узнают фосфотирозин, а не фосфосерин. Если измеряют только каталитическую активность, такие эффекты не выявляются."},{"id":"S3-phospho-mark-3","text":"Фосфат на этом участке сразу снимается фосфатазой","correct":false,"feedback":"Условие исключает это объяснение: сохранность фосфата подтверждена, а проба фосфатазы не содержит. Отсутствие изменения активности означает лишь, что в этом тесте активность не изменилась; это не значит, что фосфат потерян."}]},"widget":{"kind":"net","title":"","s":{"title":"Четыре следствия фосфорилирования","status":"Схема механизма","modes_label":"Следствие","modes":["активность","связывание партнёра","место в клетке","время жизни","дефосфорилирование"],"w":640,"h":290,"nodes":[{"id":"kin","x":16,"y":40,"w":150,"h":40,"label":"протеинкиназа","fs":13},{"id":"pp","x":16,"y":210,"w":150,"h":40,"label":"протеинфосфатаза","fs":13},{"id":"sub","x":220,"y":124,"w":150,"h":40,"label":"белок-субстрат","fs":13},{"id":"act","x":432,"y":20,"w":196,"h":40,"label":"активность фермента","fs":12.5},{"id":"bind","x":432,"y":86,"w":196,"h":40,"label":"связь с SH2 / 14-3-3","fs":12.5},{"id":"loc","x":432,"y":152,"w":196,"h":40,"label":"место в клетке","fs":12.5},{"id":"deg","x":432,"y":218,"w":196,"h":40,"label":"расщепление в протеасоме","fs":12.5}],"edges":[{"id":"k1","pts":[166,66,218,132],"type":"act","label":"фосфат","lx":210,"ly":92},{"id":"p1","pts":[166,224,218,160],"type":"act","label":"снимает фосфат","lx":230,"ly":214},{"id":"e1","pts":[370,132,430,44],"type":"act"},{"id":"e2","pts":[370,138,430,106],"type":"act"},{"id":"e3","pts":[370,148,430,172],"type":"act"},{"id":"e4","pts":[370,156,430,236],"type":"act"}],"states":[{"on":["kin","sub","act"],"p":["sub"],"show":["k1","e1"],"note":"Фосфат около каталитического центра меняет конформацию и скорость катализа — в одних белках повышает её, в других снижает."},{"on":["kin","sub","bind"],"p":["sub"],"show":["k1","e2"],"note":"Домены SH2 и PTB распознают фосфотирозин, белки 14-3-3 — фосфосериновые мотивы: белок приобретает новых партнёров, не обязательно меняя активность."},{"on":["kin","sub","loc"],"p":["sub"],"show":["k1","e3"]
