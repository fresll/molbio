UT5 и DPPIV — конфокальная микроскопия, ≥ 100 клеток. Тетеринг экзоцистом и прекращение цикла Rab-белков через Rab-GAP — предположения авторов, прямо не проверенные.</p></details></article><article class="card print-unit" id="ns-neuron-migration"><div class="eyebrow">Полярность · шаг 27 из 30</div><h2>Как полярность устроена у нейрона и у мигрирующей клетки</h2><p class="lead">У нейрона полярность разделяет аксон и дендриты, у мигрирующей клетки — передний и задний края. Механизмы те же — избирательный транспорт и взаимное влияние модулей, — но устроены они по-разному.</p><ol class="mech"><li><a href="#ns-g-S2-T89">Начальный сегмент аксона</a> отделяет аксон от тела клетки и дендритов и ограничивает свободное перемещение белков.</li><li>Кинезин KIF5 связывается преимущественно с микротрубочками начального сегмента и потому избирательно переносит грузы в аксон.</li><li>У мигрирующей клетки <a href="#ns-g-S2-T73">RAC1</a> активен на переднем крае, RHOA — на заднем; на близком расстоянии они подавляют активность друг друга, а на дальнем — повышают.</li></ol><p>Нейрон — предельный пример полярности. Аксон и соматодендритный отдел различаются составом мембраны, а граница проходит по начальному сегменту аксона — участку у его основания с особой организацией цитоскелета; он генерирует потенциал действия и служит фильтром для белков и грузов (Leterrier 2018). Направленный транспорт тоже избирателен: кинезин KIF5 связывается предпочтительно с микротрубочками начального сегмента, и пузырьки с аксонными белками направляются из аппарата Гольджи прямо в аксон; низкие дозы паклитаксела нарушали эту избирательность, и аксонные белки попадали в кончики дендритов (Nakata и Hirokawa 2003, культивируемые нейроны мыши).</p><p>У мигрирующей клетки ось — передний и задний края. RAC1 запускает сборку разветвлённого актина и выпячивание переднего края, RHOA — сокращение актомиозина на заднем. Система этих ГТФаз ведёт себя как возбудимая среда: области активации возникают и гаснут, а градиент хемоаттрактанта лишь смещает вероятность их появления (Devreotes 2017).</p><p>Взаимное подавление RAC1 и RHOA рядом — не вся картина. В нейтрофилоподобных клетках HL-60 показано и дальнее взаимное возбуждение: выпячивания, созданные RAC1, повышают натяжение мембраны и через mTORC2 активируют RHOA на противоположной стороне, а сокращение, вызванное RHOA, через поток коры активирует RAC1 вдали; эта связь нужна для поляризации и миграции первичных Т-лимфоцитов человека (De Belly 2026). Устойчивая ось поддерживается сочетанием локального торможения и дальнего возбуждения.</p><div class="note trap"><strong>Типичная ошибка</strong> Аксон и дендриты различаются только тем, какие белки синтезирует нейрон.<p class="trap-fix">Многие белки синтезируются в теле нейрона, а затем избирательно доставляются и удерживаются в своём отделе: кинезин KIF5 связывается преимущественно с микротрубочками начального сегмента, а начальный сегмент аксона служит фильтром. Дополнительный вклад в состав отростков вносят транспорт мРНК и локальная трансляция. Поэтому различие аксона и дендритов определяется совместной работой этих механизмов и барьеров полярности.</p></div><div class="static-quiz"><h3>В мигрирующей клетке оптогенетически вызвали выпячивание переднего края. Как, по данным De Belly 2026, изменится активность RHOA на противоположной стороне клетки?</h3><ol><li><b>А.</b> Снизится: RAC1 подавляет RHOA во всей клетке <i>(неверный вариант)</i><br><span class="expl">Взаимное подавление RAC1 и RHOA действует только на близком расстоянии. На противоположной стороне выпячивание через натяжение мембраны и mTORC2 активирует RHOA.</span></li><li><b>Б.</b> Не изменится: сигнал не выходит за край <i>(неверный вариант)</i><br><span class="expl">Натяжение мембраны передаётся по всей клетке быстро, поэтому выпячивание на переднем крае влияет и на противоположную сторону.</span></li><li><b>В.</b> Повысится: натяжение мембраны активирует RHOA <i>(верный вариант)</i><br><span class="expl">Выпячивание, вызванное RAC1, повышает натяжение мембраны, и через mTORC2 RHOA активируется на противоположной стороне: передний и задний края активируют друг друга на расстоянии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200302175">Nakata T., Hirokawa N. 2003. Microtubules provide directional cues for polarized axonal transport through interaction with kinesin motor head. J Cell Biol</a></li><li><a href="https://doi.org/10.1523/JNEUROSCI.1922-17.2018">Leterrier C. 2018. The axon initial segment: an updated viewpoint. J Neurosci</a></li><li><a href="https://doi.org/10.1146/annurev-cellbio-100616-060739">Devreotes P. N. et al. 2017. Excitable signal transduction networks in directed cell migration. Annu Rev Cell Dev Biol</a></li><li><a href="https://doi.org/10.1038/s41556-026-01965-1">De Belly H. et al. 2026. Long-range mutual activation establishes Rho and Rac polarity during cell migration. Nat Cell Biol</a></li></ul><p>Nakata и Hirokawa 2003: культивируемые нейроны мыши, KIF5 и микротрубочки начального сегмента, низкие дозы паклитаксела. Начальный сегмент аксона — обзор Leterrier 2018. Возбудимая среда малых ГТФаз — обзор Devreotes 2017. Дальнее взаимное возбуждение RAC1 и RHOA — De Belly 2026 (оптогенетика в нейтрофилоподобных клетках HL-60 и первичных Т-лимфоцитах человека, сохраняется в эпителиальных клетках). Схема качественная.</p></details></article><article class="card print-unit" id="ns-measure-polarity"><div class="eyebrow">Полярность · шаг 28 из 30</div><h2>Как измерить полярность и отличить её от барьера</h2><p class="lead">Полярность — это распределение белков и липидов по доменам, барьер — проницаемость промежутков между клетками. Это разные величины, и измеряют их разными методами.</p><ol class="mech"><li>Распределение маркеров доменов показывают на вертикальном конфокальном срезе монослоя.</li><li>Подвижность белка в мембране и обмен между доменами измеряют <a href="#ns-g-S2-T08">FRAP</a>.</li><li>Барьер измеряют <a href="#ns-g-S2-T87">трансэпителиальным сопротивлением</a> и потоком меток между клетками.</li></ol><p>Полярность определяют по положению маркеров: апикальных (у клеток MDCK — gp135, эзрин) и базолатеральных (Na⁺/K⁺-АТФаза, Scribble). Монослой на фильтре метят антителами и рассматривают на вертикальном (XZ) конфокальном срезе; результат — доля маркера на каждой мембране. FRAP мембранного белка или липидного зонда показывает, обменивается ли он с соседними участками и пересекает ли границу доменов.</p><p>Барьер — отдельная величина. Трансэпителиальное сопротивление измеряют электродами, опущенными по обе стороны фильтра: оно отражает проницаемость межклеточных промежутков для ионов. Поток флуоресцентных меток разного размера с одной стороны монослоя на другую показывает проницаемость для молекул. Эти величины могут меняться независимо от распределения белков: без клаудинов сопротивление падает, а маркеры распределены как в норме (Otani 2019).</p><p>Медицинский пример — <a href="#ns-g-S2-T88">болезнь включений микроворсинок</a> (врождённая атрофия микроворсинок), наследственная болезнь новорождённых с тяжёлой диареей. Её основная причина — мутации MYO5B (Müller 2008; Ruemmele 2010): в энтероцитах меньше микроворсинок, под апикальной мембраной накапливаются пузырьки, а часть апикальных переносчиков, в том числе NHE3, не доставляется к мембране. Нарушена прежде всего доставка, то есть поддержание апикального домена; это видно по распределению белков и ультраструктуре энтероцитов.</p><div class="note trap"><strong>Типичная ошибка</strong> Если сопротивление монослоя снижено, значит, клетки утратили полярность.<p class="trap-fix">Сопротивление измеряет барьер для ионов в межклеточных промежутках. Полярность определяют по распределению маркеров доменов; эти величины меняются независимо.</p></div><div class="static-quiz"><h3>После воздействия сопротивление монослоя снизилось втрое, а апикальные и базолатеральные маркеры распределены как в контроле. Какой вывод правомерен?</h3><ol><li><b>А.</b> Нарушен барьер, полярность сохранена <i>(верный вариант)</i><br><span class="expl">Сопротивление отражает проницаемость межклеточных промежутков, а распределение маркеров — полярность. Изменилась только первая величина.</span></li><li><b>Б.</b> Нарушены и барьер, и полярность <i>(неверный вариант)</i><br><span class="expl">Полярность оценивают по распределению маркеров, а оно не изменилось. Снижение сопротивления само по себе о полярности не говорит.</span></li><li><b>В.</b> Нарушена полярность, барьер сохранён <i>(неверный вариант)</i><br><span class="expl">Снижение сопротивления как раз и означает ослабление барьера для ионов, а маркеры доменов распределены нормально.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.201812157">Otani T. et al. 2019. Claudins and JAM-A coordinately regulate tight junction formation and epithelial polarity. J Cell Biol</a></li><li><a href="https://doi.org/10.1038/ng.225">Müller T. et al. 2008. MYO5B mutations cause microvillus inclusion disease and disrupt epithelial cell polarity. Nat Genet</a></li><li><a href="https://doi.org/10.1002/humu.21224">Ruemmele F. M. et al. 2010. Loss-of-function of MYO5B is the main cause of microvillus inclusion disease: 15 novel mutations and a CaCo-2 RNAi cell model. Hum Mutat</a></li><li><a href="https://doi.org/10.1083/jcb.201506112">Vogel G. F. et al. 2015. Cargo-selective apical exocytosis in epithelial cells is conducted by Myo5B, Slp4a, Vamp7, and Syntaxin 3. J Cell Biol</a></li></ul><p>Маркеры, сопротивление и поток меток в клетках MDCK II — Otani 2019. Схема FRAP — в шаге «Чего не доказывает яркий фокус». Болезнь включений микроворсинок: Müller 2008 (мутации MYO5B у больных), Ruemmele 2010 (15 мутаций, подавление MYO5B в клетках Caco-2), Vogel 2015 (NHE3 в клетках Caco-2 с мутацией больного). Схемы методов не масштабны.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 29 из 30</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Для каждого механизма семинара сначала решают, какую величину измерять, затем — каким методом и с каким контролем. Во всех четырёх разделах вид клетки совместим с несколькими механизмами, и отделяет их только правильно выбранный контроль.</p><ol class="mech"><li>Величина: направление пробегов груза, частота событий слияния и деления, зависимость структуры от концентрации каркаса и распределение белка между структурой и окружением, контраст домена — это разные измерения, и одно не заменяет другое.</li><li>Метод: прижизненная съёмка с кимограммой, обмен матриксным маркером, FRAP и разведение, распределение маркеров доменов и трансэпителиальное сопротивление.</li><li>Контроль: вмешательство, которое меняет одно звено, — удаление белка показывает его <a href="#ns-g-S2-T90">необходимость</a>, а искусственное присоединение или индуцированная сборка — <a href="#ns-g-S2-T91">достаточность</a>.</li></ol><p>Каждый из четырёх механизмов описывается своей величиной. Для транспорта это направление и скорость пробегов отдельных грузов и доля подвижных грузов; их измеряют по кимограмме, построенной из прижизненной съёмки, а ориентацию треков в той же клетке определяют по меткам растущих плюс-концов. Для слияния и деления митохондрий морфология сети — лишь картина; процесс измеряют частотой событий и обменом матриксным маркером, а функцию — отдельно, по мембранному потенциалу и потреблению кислорода.</p><p>Для конденсата измеряют зависимость от концентрации каркасного компонента: исчезает ли структура при её снижении и появляется ли при повышении, как распределяется белок между структурой и окружением. Пороговая картина согласуется с фазовым разделением, но бывает и у других кооперативных сборок. FRAP добавляет сведения об обмене компонентов, слияние фокусов — о материальных свойствах, но ни один признак отдельно не доказывает фазового разделения. Для полярности измеряют распределение маркеров между доменами, а барьер плотного контакта — отдельно, по трансэпителиальному сопротивлению и потоку парацеллюлярного маркера: это разные функции.</p><p>Контроли во всех разделах устроены одинаково. Разрушение трека нокодазолом показывает, что процесс зависит от микротрубочек, но не указывает мотор. Удаление мотора, адаптера или машины слияния показывает необходимость белка, но не его достаточность и не прямой механизм. Достаточность проверяют противоположным экспериментом: мотор химически индуцируемой связью присоединяют к выбранному грузу, сборку конденсата индуцируют светом в оптогенетической системе. Возвращение белка дикого типа, восстанавливающее само измеряемое событие, поддерживает специфичность вывода, а вмешательство в противоположную машину лишь компенсирует фенотип.</p><p>Переключайте таблицы: для каждого механизма указаны величина, метод, контроль и ограничение вывода.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок необходим для процесса, его достаточно, чтобы этот процесс шёл.<p class="trap-fix">Удаление белка показывает только необходимость. Достаточность проверяют отдельным экспериментом: белок присоединяют к грузу или активируют в новом месте и смотрят, возникает ли процесс.</p></div><div class="static-quiz"><h3>После удаления белка процесс в клетке прекратился. Какой эксперимент проверит, достаточно ли этого белка для процесса?</h3><ol><li><b>А.</b> Повторить удаление белка в клетках другой линии <i>(неверный вариант)</i><br><span class="expl">Повтор в других клетках покажет, насколько общая необходимость белка, но не его достаточность: процесс по-прежнему изучают только в его отсутствие.</span></li><li><b>Б.</b> Присоединить белок в новом месте и проверить процесс <i>(верный вариант)</i><br><span class="expl">Если белок, присоединённый к новому грузу или активированный в новом месте, вызывает процесс там, где его раньше не было, — белок достаточен. Так проверяют мотор, присоединяя его к пероксисомам химически индуцируемой связью, и сборку конденсата, индуцируя её светом.</span></li><li><b>В.</b> Снизить количество белка наполовину и сравнить <i>(неверный вариант)</i><br><span class="expl">Частичное снижение покажет, зависит ли процесс от количества белка, но это по-прежнему эксперимент на необходимость: белок убирают, а не добавляют в новое место.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-2.html#q1">Вопрос 1 →</a> <a href="seminar-2.html#q2">Вопрос 2 →</a> <a href="seminar-2.html#q3">Вопрос 3 →</a> <a href="seminar-2.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bpj.2010.07.055">Kapitein L. C. et al. 2010. Probing intracellular motor protein activity using an inducible cargo trafficking assay. Biophys J</a></li><li><a href="https://doi.org/10.1016/j.cell.2016.11.054">Shin Y. et al. 2017. Spatiotemporal control of intracellular phase transitions using light-activated optoDroplets. Cell</a></li><li><a href="https://doi.org/10.1038/s41589-022-01204-2">Gao Y. et al. 2022. A brief guideline for studies of phase-separated biomolecular condensates. Nat Chem Biol</a></li><li><a href="https://doi.org/10.1038/s41580-026-00978-w">Günzel D., Lehmann M., Honigmann A. 2026. Tight junction structure, assembly and (dys)function. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.201308006">Anand R. et al. 2014. The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission. J Cell Biol</a></li></ul><p>Сводная таблица по шагам разделов 1–4; схемы каждого метода показаны в шагах «Как измеряют направление транспорта», «Как узнать, какая машина изменена», «Чего не доказывает яркий фокус» и в последнем шаге раздела о полярности. Индуцируемое присоединение мотора к пероксисомам — Kapitein 2010 (клетки COS-7); оптогенетическая сборка конденсатов — Shin 2017 (клетки NIH 3T3, U2OS); критерии конденсата — Gao 2022; барьер и полярность — Günzel 2026; восстановление механизма и компенсация — Anand 2014 (эмбриональные фибробласты мыши).</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 30 из 30</div><h2>Исследование одного нейрона: от тела клетки до синапса</h2><p class="lead">В нейроне с длинным аксоном все четыре механизма семинара работают одновременно. Нарушение каждого из них проявляется в одном и том же месте — в далёком от тела клетки синапсе, — но по разным причинам.</p><ol class="mech"><li>Полярность: начальный сегмент аксона, собранный на каркасе <a href="#ns-g-S2-T92">анкирина G</a>, отделяет аксон от соматодендритного отдела; кинезин KIF5 избирательно переносит грузы в аксон.</li><li>Транспорт и деление: митохондрия, разделённая DRP1, переносится кинезином-1 через TRAK и Miro и останавливается у активного синапса при участии Miro и синтафилина.</li><li>Конденсат на органелле: РНП-гранула через белок <a href="#ns-g-S2-T93">ANXA11</a> связывается с лизосомой и переносится вместе с ней к удалённым участкам аксона.</li></ol><p>Нейрон удобен как итоговый пример, потому что требования к пространственной организации в нём предельны: аксон длиннее тела клетки в тысячи раз, а синапс, где нужны ATP и буферирование Ca²⁺, находится на его конце. Сначала нужна сама полярность. Начальный сегмент аксона собирается на каркасе анкирина G; в культуре нейронов гиппокампа крысы подавление синтеза анкирина G разбирало начальный сегмент, и бывший аксон приобретал признаки дендрита: в него проникали белки соматодендритного отдела, а на нём собирались шипики и постсинаптические уплотнения (Hedstrom 2008).</p><p>Затем нужна доставка органелл. Митохондрия попадает в аксон и движется по нему, связываясь с кинезином-1 через адаптер TRAK и белок наружной мембраны Miro; в участке активного синапса повышение Ca²⁺ останавливает её, а синтафилин закрепляет на микротрубочке (Wang и Schwarz 2009; Kang 2008; Chen и Sheng 2013). Деление необходимо для нормального распределения митохондрий по отросткам: у дрозофилы с мутацией drp1 митохондрии почти отсутствовали в синапсах нервно-мышечного соединения, и при интенсивной стимуляции синаптическая передача не поддерживалась (Verstreken 2005); у мыши без Drp1 митохондрии в нейронах скапливались и плохо распределялись по отросткам, а образование синапсов нарушалось (Ishihara 2009). Что именно мешает переносу неразделённой сети — её размер или другие свойства, — эти эксперименты прямо не показывают.</p><p>Третий груз — рибонуклеопротеиновые гранулы, безмембранные сборки с мРНК, которые обеспечивают местный синтез белка вдали от ядра. В нейронах и клетках линий человека гранулы переносились, связываясь с движущимися лизосомами: белок ANXA11 своей неупорядоченной областью входит в гранулу, а другим доменом связывается с мембраной лизосомы; замены в ANXA11, найденные при боковом амиотрофическом склерозе, нарушали эту связь и перенос гранул (Liao 2019). Здесь соединяются конденсат (вопрос 3) и транспорт по треку (вопрос 1).</p><p>Переключайте нарушения на схеме: отсутствие DRP1, Miro без связывания Ca²⁺ или нейрон без синтафилина, замена в ANXA11, разборка начального сегмента. В каждом случае ответ на вопрос «что нарушено» требует своей величины — распределения органелл по аксону, доли остановленных у синапса митохондрий, переноса гранул, распределения маркеров доменов.</p><div class="note trap"><strong>Типичная ошибка</strong> Если в синапсе мало митохондрий, значит, нарушен мотор, который их переносит.<p class="trap-fix">Тот же результат дают нарушение деления, утрата закрепления синтафилином и Ca²⁺-зависимой остановки у синапса или нарушение полярности нейрона. Чтобы назвать причину, измеряют разные величины: распределение и подвижность митохондрий, долю остановленных у синапса, состав доменов.</p></div><div class="static-quiz"><h3>В нейронах без DRP1 митохондрии скапливаются у тела клетки и почти не попадают в синапсы. Какое объяснение согласуется с механизмами семинара?</h3><ol><li><b>А.</b> Без деления сеть митохондрий хуже переносится в аксон <i>(верный вариант)</i><br><span class="expl">Без деления митохондрии хуже распределяются по отросткам: в нейронах дрозофилы drp1 и мыши без Drp1 они скапливались в теле клетки. DRP1 при этом не мотор и не адаптер; какое свойство неразделённой сети мешает переносу, эти эксперименты прямо не показывают.</span></li><li><b>Б.</b> DRP1 сама переносит митохондрии к плюс-концу <i>(неверный вариант)</i><br><span class="expl">DRP1 — ГТФаза деления, которая собирается в кольцо на наружной мембране; переносит митохондрии по аксону кинезин-1, связанный с ними через TRAK и Miro.</span></li><li><b>В.</b> Без DRP1 у синапса не повышается концентрация Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">Ca²⁺ в участке синапса повышается от активности самого синапса; повышение Ca²⁺ останавливает уже пришедшие митохондрии, но не объясняет, почему они не доходят до аксона.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-2.html#q1">Вопрос 1 →</a> <a href="seminar-2.html#q2">Вопрос 2 →</a> <a href="seminar-2.html#q3">Вопрос 3 →</a> <a href="seminar-2.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200806112">Hedstrom K. L., Ogawa Y., Rasband M. N. 2008. AnkyrinG is required for maintenance of the axon initial segment and neuronal polarity. J Cell Biol</a></li><li><a href="https://doi.org/10.1523/JNEUROSCI.0425-06.2006">Ogawa Y. et al. 2006. Spectrins and ankyrinB constitute a specialized paranodal cytoskeleton. J Neurosci</a></li><li><a href="https://doi.org/10.1083/jcb.200302175">Nakata T., Hirokawa N. 2003. Microtubules provide directional cues for polarized axonal transport through interaction with kinesin motor head. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2008.11.046">Wang X., Schwarz T. L. 2009. The mechanism of Ca2+-dependent regulation of kinesin-mediated mitochondrial motility. Cell</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.11.024">Kang J.-S. et al. 2008. Docking of axonal mitochondria by syntaphilin controls their mobility and affects short-term facilitation. Cell</a></li><li><a href="https://doi.org/10.1083/jcb.201302040">Chen Y., Sheng Z.-H. 2013. Kinesin-1-syntaphilin coupling mediates activity-dependent regulation of axonal mitochondrial transport. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.neuron.2005.06.018">Verstreken P. et al. 2005. Synaptic mitochondria are critical for mobilization of reserve pool vesicles at Drosophila neuromuscular junctions. Neuron</a></li><li><a href="https://doi.org/10.1038/ncb1907">Ishihara N. et al. 2009. Mitochondrial fission factor Drp1 is essential for embryonic development and synapse formation in mice. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2019.08.050">Liao Y.-C. et al. 2019. RNA granules hitchhike on lysosomes for long-distance transport, using annexin A11 as a molecular tether. Cell</a></li></ul><p>Начальный сегмент и анкирин G — нейроны гиппокампа крысы в культуре (культура — по методике Ogawa 2006: эмбрионы крысы 18-го дня), РНК-интерференция (Hedstrom 2008); избирательный перенос KIF5 в аксон — Nakata и Hirokawa 2003. Остановка митохондрий у синапса — нейроны гиппокампа крысы, Miro с заменами в EF-мотивах (Wang и Schwarz 2009); доля подвижных митохондрий 36 и 76 % в нейронах гиппокампа мыши дикого типа и без синтафилина (Kang 2008); синтафилин и остановка при активности (Chen и Sheng 2013). Деление и распределение митохондрий — мотонейроны личинок дрозофилы drp1 (Verstreken 2005) и мыши без Drp1 (Ishihara 2009). Перенос РНП-гранул на лизосомах — нейроны крысы, нейроны из индуцированных плюрипотентных клеток человека и клетки линий человека (Liao 2019). Схема — качественная, распределения органелл условны.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S2-T01"><dt>Микротрубочка</dt><dd>Полый полимер из димеров α- и β-тубулина диаметром около 25 нм; служит треком для кинезинов и динеина. Её два конца различаются по строению и по скорости роста, поэтому у трека есть направление. В большинстве животных клеток минус-концы закреплены у центросомы, но в дифференцированных клетках значительная часть микротрубочек организуется вне неё.</dd></div><div id="ns-g-S2-T02"><dt>Плюс-конец и минус-конец</dt><dd>Названия двух структурно различных концов микротрубочки, а не электрические заряды. Плюс-конец быстрее растёт и разбирается; минус-конец обычно закреплён в центре организации микротрубочек. Направление движения мотора указывают относительно этих концов, а направление относительно частей клетки зависит от того, как в данной клетке расположены треки.</dd></div><div id="ns-g-S2-T03"><dt>Актиновый филамент</dt><dd>Двуспиральный полимер актина; его концы называют оперённым (+) и заострённым (−). Актиновые филаменты образуют кортикальную сеть под плазматической мембраной, пучки в выростах и сократительные структуры; по ним движутся миозины. В транспорте актиновая система обеспечивает последний короткий участок пути и удержание груза у мембраны.</dd></div><div id="ns-g-S2-T04"><dt>Молекулярный мотор</dt><dd>Белок, превращающий энергию гидролиза ATP в направленное перемещение вдоль полярного филамента. Мотор характеризуют направленностью (к какому концу филамента он движется), размером шага, процессивностью и скоростью. Процессивность — способность одной молекулы сделать много шагов подряд, не отсоединяясь от трека.</dd></div><div id="ns-g-S2-T05"><dt>Адаптер груза</dt><dd>Белок, который одновременно связывает мотор (или активирующий его комплекс) и определённый груз — мембранный белок органеллы, рибонуклеопротеиновую частицу. Адаптер определяет, какой груз переносит данный мотор; у динеина адаптер вместе с динактином ещё и переводит мотор в активное процессивное состояние.</dd></div><div id="ns-g-S2-T06"><dt>Стационарное состояние</dt><dd>Состояние системы, которое не меняется во времени, потому что противоположные потоки равны (например, слияния и деления, доставки и удаления), а не потому, что процессы остановились. Одна и та же стационарная картина совместима с разными значениями констант скоростей и разной частотой событий, поэтому по картине нельзя установить механизм. В модели сети митохондрий картину приближённо задаёт отношение констант слияния и деления, пока оба процесса идут намного быстрее роста клеток.</dd></div><div id="ns-g-S2-T07"><dt>Нокодазол и латрункулин A</dt><dd>Инструменты для разрушения треков. Нокодазол связывает тубулин и вызывает разборку микротрубочек; латрункулин A связывает мономеры актина и препятствует полимеризации. Они показывают, что процесс зависит от трека, но не указывают, какой мотор участвует: при разборке трека останавливается всё, что по нему движется.</dd></div><div id="ns-g-S2-T08"><dt>FRAP</dt><dd>Восстановление флуоресценции после фотообесцвечивания. Флуоресценцию в выбранном участке гасят ярким светом и измеряют, как она восстанавливается за счёт обмена молекул с окружением. Результат описывают подвижной фракцией (какая доля флуоресценции восстановилась) и временем полувосстановления. Оба числа зависят от диффузии, связывания, размера участка и фотохимии, поэтому быстрое восстановление показывает обмен компонентов, но само по себе не доказывает жидкого состояния.</dd></div><div id="ns-g-S2-T09"><dt>Мембранный потенциал митохондрии</dt><dd>Разность электрических потенциалов на внутренней мембране митохондрии (матрикс заряжен отрицательно), которую создаёт перенос протонов дыхательной цепью. Его оценивают по накоплению катионного зонда, например TMRM. Потенциал — состояние мембраны, а не поток: его нельзя заменить скоростью потребления кислорода, и наоборот. Протонофор CCCP снимает потенциал.</dd></div><div id="ns-g-S2-T10"><dt>Кинезин-1 (KIF5)</dt><dd>Мотор, движущийся по микротрубочке к плюс-концу шагами 8 нм. Две головки ходят попеременно, поэтому одиночная молекула in vitro проходит около микрометра, не отсоединяясь. Без груза автоингибирован. Переносит митохондрии (через TRAK и Miro), пузырьки и рибонуклеопротеиновые частицы. В нейроне избирательно переносит грузы в аксон (Nakata и Hirokawa 2003).</dd></div><div id="ns-g-S2-T11"><dt>Цитоплазматический динеин</dt><dd>Практически единственный мотор, переносящий органеллы по микротрубочке к минус-концу. Одиночный динеин автоингибирован; процессивно он движется только в комплексе с динактином и адаптером груза.</dd></div><div id="ns-g-S2-T12"><dt>Динактин</dt><dd>Многосубъединичный комплекс, необходимый для работы динеина. Сам мотором не является; вместе с адаптером груза собирает динеин в активный процессивный комплекс.</dd></div><div id="ns-g-S2-T13"><dt>Миозин V</dt><dd>Процессивный мотор, движущийся по актиновому филаменту к оперённому концу шагами около 36 нм. Переносит груз на коротком последнем участке пути у плазматической мембраны; свободный миозин V автоингибирован.</dd></div><div id="ns-g-S2-T14"><dt>Процессивность</dt><dd>Способность одной молекулы мотора сделать много шагов подряд, не отсоединяясь от трека. Процессивны кинезин-1, миозин V и динеин в комплексе с динактином и адаптером; миозин II непроцессивен и создаёт движение только в ансамбле головок.</dd></div><div id="ns-g-S2-T15"><dt>Автоингибирование</dt><dd>Неактивное состояние мотора без груза: у кинезина-1 хвост складывается на моторные домены и подавляет и гидролиз ATP, и связывание с треком; у динеина головки уложены так, что подавлены продуктивное связывание с треком и процессивное движение. Связывание груза и адаптеров снимает торможение.</dd></div><div id="ns-g-S2-T16"><dt>Центросома</dt><dd>Центр организации микротрубочек вблизи ядра: здесь закреплены минус-концы радиальной сети. В дифференцированных клетках значительная часть микротрубочек организуется вне центросомы — у аппарата Гольджи, в отростках нейронов, у ядер мышечного волокна.</dd></div><div id="ns-g-S2-T17"><dt>TRAK и Miro</dt><dd>Адаптерный комплекс митохондрии. Miro (MIRO1/2) — ГТФаза наружной мембраны с двумя Ca²⁺-связывающими EF-мотивами; адаптеры TRAK1/2 (у дрозофилы — Milton) связывают Miro с кинезином-1 и динеином.</dd></div><div id="ns-g-S2-T18"><dt>Синтафилин (SNPH)</dt><dd>Белок наружной мембраны митохондрий аксона, закрепляющий митохондрию на микротрубочке и подавляющий АТФазную активность кинезина-1. Без синтафилина доля подвижных митохондрий в аксонах нейронов мыши выше, а остановка при активности нейрона исчезает.</dd></div><div id="ns-g-S2-T19"><dt>EF-мотив</dt><dd>Участок белка из двух α-спиралей и петли между ними, связывающий ион Ca²⁺. У Miro два EF-мотива; замены в них устраняют связывание Ca²⁺ и Ca²⁺-зависимую остановку митохондрий, не нарушая самого движения.</dd></div><div id="ns-g-S2-T20"><dt>Антероградный и ретроградный транспорт</dt><dd>Перенос в аксоне от тела нейрона к окончанию (антероградный) и от окончания к телу (ретроградный). Поскольку плюс-концы в аксоне почти все обращены к окончанию, антероградный перенос выполняют кинезины, ретроградный — динеин.</dd></div><div id="ns-g-S2-T21"><dt>Модель перетягивания</dt><dd>Гипотеза двунаправленного движения: моторы обоих направлений на грузе активны одновременно, направление определяет механически преобладающая группа. Предсказывает, что ослабление моторов одного направления усилит движение в противоположную сторону.</dd></div><div id="ns-g-S2-T22"><dt>Модель согласованного переключения</dt><dd>Гипотеза двунаправленного движения: в каждый момент активна одна группа моторов, а моторы противоположных направлений нужны друг другу для активации. Предсказывает, что удаление моторов одного направления снизит движение в обе стороны.</dd></div><div id="ns-g-S2-T23"><dt>Кимограмма</dt><dd>Изображение «положение — время», построенное по прижизненной съёмке вдоль выбранной линии. Неподвижный объект даёт вертикальную линию, движущийся — наклонную; наклон показывает скорость, сторона наклона — направление движения вдоль линии.</dd></div><div id="ns-g-S2-T24"><dt>Маркеры плюс-концов (EB3)</dt><dd>Белки, связывающиеся с растущими плюс-концами микротрубочек. Флуоресцентная метка EB3-GFP движется вместе с растущим концом, поэтому направление её движения показывает ориентацию микротрубочек в данном участке клетки.</dd></div><div id="ns-g-S2-T25"><dt>Химически индуцируемая димеризация</dt><dd>Способ соединить два белка в живой клетке по команде: FKBP прикрепляют к грузу, фрагмент FRB — к мотору, и добавленный рапалог связывает их. Если груз начинает двигаться в предсказанную сторону, мотора достаточно для переноса.</dd></div><div id="ns-g-S2-T26"><dt>Позиционирование лизосом</dt><dd>Изменение распределения лизосом между периферией и областью вблизи ядра в зависимости от условий. В клетках HeLa в полной среде лизосомы распределены по периферии, в среде без питательных веществ собираются вблизи ядра; положение связано с активностью mTORC1 и аутофагией.</dd></div><div id="ns-g-S2-T27"><dt>Локальная трансляция</dt><dd>Синтез белка на мРНК, доставленной в определённую область клетки (в отросток нейрона, к переднему краю мигрирующей клетки) в составе рибонуклеопротеиновых частиц. Позволяет быстро изменить белковый состав удалённого участка.</dd></div><div id="ns-g-S2-T28"><dt>Наследственная спастическая параплегия</dt><dd>Группа наследственных болезней с поражением длинных двигательных аксонов спинного мозга и спастичностью нижних конечностей. Одна из форм (SPG10) связана с заменой в моторном домене кинезина KIF5A, другие — с заменами в KIF1A.</dd></div><div id="ns-g-S2-T29"><dt>Диффузия и захват</dt><dd>Способ накопления вещества без направленного переноса: молекула перемещается диффузией и задерживается там, где находится связывающий её белок. Работает на коротких расстояниях; для крупного груза на десятках микрометров нужен мотор.</dd></div><div id="ns-g-S2-T30"><dt>Гомотипическое слияние</dt><dd>Объединение двух органелл одного типа в одну, при котором сливаются ограничивающие мембраны (у митохондрии — сначала наружные, затем внутренние) и содержимое органелл может смешиваться. Отличается от контакта органелл, где мембраны сближены, но не сливаются, и от слияния органелл разных типов, например автофагосомы с лизосомой.</dd></div><div id="ns-g-S2-T31"><dt>Деление органеллы</dt><dd>Разделение одной органеллы на две с сужением и разрывом мембраны, которое выполняет механохимическая машина. В отличие от распада при повреждении, деление регулируется, и место разделения определено заранее.</dd></div><div id="ns-g-S2-T32"><dt>Митофузины MFN1 и MFN2</dt><dd>ГТФазы наружной мембраны митохондрии. Молекулы на соседних органеллах связываются в trans и удерживают наружные мембраны рядом; гидролиз GTP переводит контакт в слияние. Частично заменяют друг друга: без одного слияние ослаблено, без обоих отсутствует. Мутации MFN2 вызывают нейропатию Шарко — Мари — Тута типа 2A.</dd></div><div id="ns-g-S2-T33"><dt>OPA1</dt><dd>ГТФаза внутренней мембраны митохондрии, необходимая для слияния внутренних мембран и для строения крист. Работает вместе с кардиолипином: в реконструкции in vitro достаточно длинной формы в одной мембране и кардиолипина в противоположной (Ban 2017). Мутации OPA1 вызывают доминантную оптическую атрофию.</dd></div><div id="ns-g-S2-T34"><dt>Длинная и короткая формы OPA1</dt><dd>L-OPA1 закреплена во внутренней мембране; S-OPA1 образуется при её расщеплении протеазами OMA1 и YME1L. По данным Anand 2014, длинной формы достаточно для слияния, а накопление короткой связано с делением; по более ранним данным, нужна смесь форм (Song 2007). Соотношение форм оценивают на вестерн-блоте.</dd></div><div id="ns-g-S2-T35"><dt>Протеазы OMA1 и YME1L</dt><dd>Протеазы внутренней мембраны митохондрии, расщепляющие OPA1. YME1L работает постоянно; OMA1 активируется при потере мембранного потенциала или ATP и переводит почти всю длинную форму OPA1 в короткую, и слияние прекращается.</dd></div><div id="ns-g-S2-T36"><dt>DRP1</dt><dd>Цитозольная ГТФаза семейства динаминов (ген DNM1L), выполняющая деление митохондрий и пероксисом. Рецепторы наружной мембраны привлекают её к органелле, где она собирается в кольцо и при гидролизе GTP сжимает и разделяет мембраны.</dd></div><div id="ns-g-S2-T37"><dt>Рецепторы DRP1</dt><dd>Белки наружной мембраны MFF, FIS1, MiD49 и MiD51, привлекающие DRP1 из цитозоля к митохондрии. В фибробластах главный из них — MFF; MFF и FIS1 работают и на пероксисомах. Без одного рецептора деление ослабевает, но не исчезает.</dd></div><div id="ns-g-S2-T38"><dt>Контакт ЭПР с митохондрией</dt><dd>Участок, где трубочка ЭПР охватывает митохондрию и сужает её ещё до сборки DRP1, размечая место будущего деления. В этом месте полимеризуется актин; здесь же часто находятся реплицирующиеся нуклеоиды.</dd></div><div id="ns-g-S2-T39"><dt>CCCP</dt><dd>Протонофор (разобщитель): переносит протоны через внутреннюю мембрану в обход ATP-синтазы и снимает мембранный потенциал. Если концентрация протонофора оптимальна, субстратов достаточно, а у клеток есть дыхательный резерв, потребление кислорода растёт; избыток протонофора дыхание подавляет. Синтез ATP в митохондриях падает; через OMA1 CCCP прекращает слияние.</dd></div><div id="ns-g-S2-T40"><dt>TMRM</dt><dd>Положительно заряженный флуоресцентный зонд, который накапливается в митохондриях в зависимости от мембранного потенциала: по уравнению Нернста отношение его концентраций в матриксе и цитозоле растёт экспоненциально, примерно в 10 раз на каждые 60 мВ. Показывает состояние мембраны, а не поток; потребление кислорода и синтез ATP измеряют отдельно.</dd></div><div id="ns-g-S2-T41"><dt>Матриксный фотоактивируемый маркер</dt><dd>Флуоресцентный белок (PA-GFP), направленный в матрикс, который начинает светиться после освещения. Его активируют в части сети и следят, переходит ли флуоресценция в другие органеллы; так измеряют обмен содержимым при слиянии.</dd></div><div id="ns-g-S2-T42"><dt>Нуклеоид</dt><dd>Компактная белково-нуклеиновая частица в матриксе, содержащая одну или несколько молекул мтДНК; основной упаковывающий белок — TFAM. В клетках человека нуклеоиды сохраняют свою мтДНК и после слияния митохондрий.</dd></div><div id="ns-g-S2-T43"><dt>Комплементация</dt><dd>Восполнение дефекта одной органеллы продуктами другой после их слияния: тРНК, рРНК и белки двух геномов становятся общими. Комплементация митохондрий — обмен продуктами, а не обмен молекулами мтДНК.</dd></div><div id="ns-g-S2-T44"><dt>Гетероплазмия</dt><dd>Присутствие в клетке одновременно нормальных и мутантных копий мтДНК. Биохимический дефект проявляется, когда доля мутантных копий превышает порог; порог зависит от варианта мтДНК, ткани и числа копий.</dd></div><div id="ns-g-S2-T45"><dt>Митофагия</dt><dd>Удаление митохондрий аутофагией: органеллу окружает автофагосома, которая затем сливается с лизосомой. Небольшие деполяризованные фрагменты, отделённые делением, удаляются легче, чем протяжённая сеть.</dd></div><div id="ns-g-S2-T46"><dt>Пероксисома</dt><dd>Одномембранная органелла окисления жирных кислот с очень длинной цепью и обезвреживания пероксида водорода. Делится с участием PEX11, DRP1, MFF и FIS1; слияния зрелых пероксисом между собой у млекопитающих не показано (Bonekamp 2012).</dd></div><div id="ns-g-S2-T47"><dt>Атластины</dt><dd>ГТФазы мембраны ЭПР (ATL1–ATL3), сливающие трубочки ЭПР и соединяющие их в сеть. Мутации ATL1 вызывают наследственную спастическую параплегию SPG3A.</dd></div><div id="ns-g-S2-T48"><dt>SNARE, Rab и комплексы-привязки</dt><dd>Белки слияния мембран в секреторном и эндосомном пути. SNARE двух мембран образуют комплекс и сближают мембраны до слияния; малые ГТФазы Rab и комплексы-привязки (например, HOPS) определяют, какие мембраны встретятся. Митофузины и OPA1 к этим белкам не относятся.</dd></div><div id="ns-g-S2-T49"><dt>Восстановление механизма и компенсация фенотипа</dt><dd>Два разных результата восстановления фенотипа. Возвращение удалённого белка дикого типа может восстановить сам процесс — это проверяют измерением процесса при сопоставимом количестве и локализации белка; вмешательство в противоположную машину возвращает только картину (например, форму сети), а процесс остаётся нарушенным.</dd></div><div id="ns-g-S2-T50"><dt>Биомолекулярный конденсат</dt><dd>Компартмент без липидной мембраны, в котором белки и нуклеиновые кислоты локально обогащены по сравнению с окружением; в жидкоподобном состоянии быстро обменивается компонентами с окружением. Определение описывает обогащение, а не механизм: фазовое разделение доказывают отдельно. В части литературы термин употребляют уже — только для сборок, возникших путём фазового разделения.</dd></div><div id="ns-g-S2-T51"><dt>Фазовое разделение (разделение фаз)</dt><dd>Разделение однородного раствора на две сосуществующие фазы — плотную и разбавленную — при превышении концентрации насыщения. Один из возможных механизмов образования конденсата; яркий фокус в микроскопе его не доказывает.</dd></div><div id="ns-g-S2-T52"><dt>Мультивалентность</dt><dd>Наличие у молекулы нескольких участков связывания партнёров. Устойчивость мультивалентной сборки зависит от числа доступных контактов, их сродства, геометрии и времени жизни. Множество обратимых контактов может поддерживать устойчивую структуру при обмене отдельных компонентов.</dd></div><div id="ns-g-S2-T53"><dt>Внутренне неупорядоченная область (IDR)</dt><dd>Участок белка без устойчивой третичной структуры, существующий как ансамбль конформаций; обычно обогащён заряженными и ароматическими остатками, глицином и пролином. Облегчает множественные слабые контакты, но не гарантирует образования конденсата. В русской литературе её называют также неупорядоченным или неструктурированным участком. Частный случай — домены низкой сложности (LCD), в которых преобладают немногие аминокислоты.</dd></div><div id="ns-g-S2-T54"><dt>Каркасный белок и белок-клиент</dt><dd>Каркасные белки (каркасные компоненты) — мультивалентные молекулы, взаимодействия которых образуют конденсат; их удаление разрушает его. Белки-клиенты связываются с каркасом и накапливаются в конденсате, но для его образования не нужны. Роль каркаса или клиента относится к данной системе и условиям; каркасом может быть и РНК (NEAT1 в параспеклах).</dd></div><div id="ns-g-S2-T55"><dt>Концентрация насыщения (Cнас)</dt><dd>Концентрация каркасного компонента, выше которой раствор разделяется на плотную и разбавленную фазы; ниже неё существует только однородный раствор. В многокомпонентной системе порог зависит от концентраций всех участников.</dd></div><div id="ns-g-S2-T56"><dt>Плотная и разбавленная фазы</dt><dd>Две сосуществующие фазы после фазового разделения: плотная (капли, конденсат), где белок концентрирован во много раз, и разбавленная — окружающий раствор. Они обмениваются молекулами, но не смешиваются. Доля объёма, занятая плотной фазой, и доля молекул в ней — разные величины.</dd></div><div id="ns-g-S2-T57"><dt>Правило рычага</dt><dd>Соотношение для идеальной системы из одного каркасного компонента и растворителя: выше порога концентрация в разбавленной фазе равна концентрации насыщения, а избыток вещества уходит в плотную фазу, объём которой растёт пропорционально избытку.</dd></div><div id="ns-g-S2-T58"><dt>Материальное состояние конденсата</dt><dd>Физические свойства плотной фазы — жидкость, гель или твёрдоподобная сборка; характеристика, независимая от механизма образования. Жидкоподобные капли сливаются и округляются, твёрдоподобные — нет. Гель — сеть молекул, связанных слабыми межмолекулярными связями (Горшенева 2024). В отличие от жидкоподобной капли гель на времени наблюдения сохраняет форму: соприкоснувшиеся капли геля сливаются и округляются медленно или не сливаются вовсе.</dd></div><div id="ns-g-S2-T59"><dt>Переход жидкость — твёрдое</dt><dd>Необратимое или трудно обратимое изменение материальных свойств конденсата, при котором обмен компонентов резко замедляется. Изменение свойств конденсатов со временем в литературе называют «старением» (Горшенева 2024); переход жидкость — твёрдое — один из его возможных исходов. Показан для капель очищенных FUS и hnRNPA1 in vitro: переход развивается со временем, а патогенные замены в неупорядоченных областях его ускоряют. Прямых доказательств перехода конденсатов в амилоидные агрегаты в живой клетке практически нет (Горшенева 2024).</dd></div><div id="ns-g-S2-T60"><dt>Агрегат</dt><dd>Скопление ассоциированных белковых молекул. Агрегаты различаются по строению и свойствам: бывают аморфными и упорядоченными, в том числе амилоидными — с межмолекулярной кросс-β-структурой. В этом семинаре с жидкоподобными каплями сравнивается устойчивый агрегат с медленным обменом молекул; такой агрегат может образоваться внутри конденсата.</dd></div><div id="ns-g-S2-T61"><dt>Стресс-гранула</dt><dd>Цитоплазматический конденсат из нетранслируемых мРНК и белков, собирающийся после подавления инициации трансляции при стрессе и разбирающийся после его снятия. Следствие остановки трансляции, а не её причина.</dd></div><div id="ns-g-S2-T62"><dt>G3BP1 и G3BP2</dt><dd>Каркасные белки стресс-гранул клеток человека. При связывании свободной РНК меняют конформацию и образуют мультивалентную сеть с РНК и партнёрами; клетки без обоих белков гранул в ответ на арсенит не образуют.</dd></div><div id="ns-g-S2-T63"><dt>Ядрышко</dt><dd>Ядерный конденсат, где идут транскрипция рибосомной РНК и сборка рибосом. Ведёт себя как многофазная жидкость; существует всю интерфазу, хотя его белки непрерывно обмениваются с нуклеоплазмой.</dd></div><div id="ns-g-S2-T64"><dt>FUS</dt><dd>РНК-связывающий белок с протяжённой неупорядоченной областью низкой сложности. Образует жидкоподобные конденсаты; капли очищенного FUS при исследованных условиях in vitro со временем переходят в твёрдоподобное состояние, а патогенная замена G156E ускоряет этот переход.</dd></div><div id="ns-g-S2-T65"><dt>Плотность заполнения цитоплазмы</dt><dd>Доля объёма цитоплазмы, занятая макромолекулами, прежде всего рибосомами. От неё зависят подвижность крупных частиц и склонность белков к фазовому разделению; путь mTORC1 меняет её через концентрацию рибосом.</dd></div><div id="ns-g-S2-T66"><dt>1,6-гександиол</dt><dd>Алифатический спирт, растворяющий многие жидкоподобные сборки. Действует неизбирательно: в концентрациях 5–10 % почти полностью подавляет киназы и фосфатазы in vitro и меняет проницаемость мембран, поэтому не служит доказательством фазового разделения.</dd></div><div id="ns-g-S2-T67"><dt>Оптогенетическая сборка</dt><dd>Способ управлять конденсацией светом: белок с IDR соединяют со светочувствительным доменом, который олигомеризуется на синем свету и повышает валентность. Позволяет вызывать и обращать сборку светом и картировать порог в живой клетке.</dd></div><div id="ns-g-S2-T68"><dt>Замены, нарушающие только конденсацию</dt><dd>Аминокислотные замены, которые ослабляют множественные слабые контакты (например, замены ароматических остатков в IDR), но сохраняют известное специфическое связывание белка. Главный контроль при проверке роли конденсации в функции.</dd></div><div id="ns-g-S2-T69"><dt>P-гранулы</dt><dd>Рибонуклеопротеиновые гранулы зародышевой линии нематоды. Их поведение как капель жидкости — округлость, слияние, деформация потоком — было решающим наблюдением для понятия конденсата (Brangwynne 2009).</dd></div><div id="ns-g-S2-T70"><dt>Полярный домен</dt><dd>Участок плазматической мембраны, обогащённый определёнными белками и липидами (апикальный домен эпителия, аксон нейрона, передний край мигрирующей клетки). Существует дольше, чем нужно белку, чтобы разойтись по мембране диффузией, поэтому поддерживается потоками доставки, удержания и удаления.</dd></div><div id="ns-g-S2-T71"><dt>Апикальный и базолатеральный домены</dt><dd>Две области плазматической мембраны эпителиальной клетки: апикальная обращена в просвет органа, базолатеральная — к соседним клеткам и внеклеточному матриксу. Несут разные переносчики, поэтому поток веществ через эпителий направлен.</dd></div><div id="ns-g-S2-T72"><dt>Латеральная диффузия</dt><dd>Перемещение белков и липидов в плоскости мембраны. Время смещения на расстояние x оценивают как t ≈ x²/4D, где D — коэффициент диффузии: для мембранного белка животной клетки порядка 0,1 мкм²/с, для липида — порядка 0,5 мкм²/с.</dd></div><div id="ns-g-S2-T73"><dt>RAC1 и RHOA</dt><dd>Малые ГТФазы семейства Rho. В мигрирующей клетке RAC1 активен на переднем крае и запускает сборку разветвлённого актина, RHOA — на заднем и вызывает сокращение актомиозина. На близком расстоянии они подавляют друг друга, на дальнем — активируют.</dd></div><div id="ns-g-S2-T74"><dt>Ориентир</dt><dd>Пространственная метка, задающая, где образуется домен: градиент вещества, контакт с соседней клеткой или матриксом, внутренняя метка (у дрожжей — рубец от предыдущего деления). Ориентир слаб и сам резкой границы не создаёт.</dd></div><div id="ns-g-S2-T75"><dt>CDC42</dt><dd>Малая ГТФаза семейства Rho, центральный белок полярности у дрожжей и животных. Активна в форме, связанной с GTP; Cdc24 (фактор обмена нуклеотидов) переводит её в активную форму, белки-активаторы ГТФазы — обратно.</dd></div><div id="ns-g-S2-T76"><dt>Локальная положительная обратная связь</dt><dd>Механизм, при котором активный компонент в участке мембраны ускоряет дальнейшее накопление или активацию того же компонента именно там. При ограниченном общем запасе этот участок растёт за счёт остальных, и образуется один домен.</dd></div><div id="ns-g-S2-T77"><dt>Bem1 и Cdc24</dt><dd>Белки полярности почкующихся дрожжей. Bem1 — каркасный белок, который связывается с активной CDC42 через её эффектор, PAK-киназу Cla4; Cdc24 — фактор обмена нуклеотидов для CDC42. Вместе они активируют соседние молекулы CDC42 и замыкают положительную обратную связь.</dd></div><div id="ns-g-S2-T78"><dt>Нарушение симметрии</dt><dd>Образование оси полярности в клетке без внешних ориентиров. У дрожжей без ориентиров домен активной CDC42 возникает в случайном месте за счёт положительной обратной связи.</dd></div><div id="ns-g-S2-T79"><dt>Белки PAR</dt><dd>Консервативная система белков полярности. Передний (апикальный) модуль — PAR-3, PAR-6 и aPKC, задний (базолатеральный) — киназа PAR-1. Впервые описана в зиготе нематоды, работает в эпителии и нейронах.</dd></div><div id="ns-g-S2-T80"><dt>aPKC</dt><dd>Атипичная протеинкиназа C, входит в передний модуль PAR вместе с PAR-3 и PAR-6. Фосфорилирует PAR-1 (у человека PAR-1b по Thr595) и снижает его активность и связь с мембраной.</dd></div><div id="ns-g-S2-T81"><dt>Взаимное вытеснение</dt><dd>Механизм разделения мембраны на два домена: киназа каждого модуля фосфорилирует белки другого и удаляет их с мембраны. Две устойчивые области получаются только при достаточной нелинейности и подходящем соотношении концентраций.</dd></div><div id="ns-g-S2-T82"><dt>Направленная доставка</dt><dd>Перенос пузырьков с мембранными белками по ориентированным трекам к определённой области плазматической мембраны и их слияние с ней (при участии комплекса экзоциста и белков SNARE). Задаёт, где появляется домен.</dd></div><div id="ns-g-S2-T83"><dt>Рециклирующие эндосомы</dt><dd>Эндосомы, размеченные малой ГТФазой Rab11, через которые белки, удалённые эндоцитозом, возвращаются к плазматической мембране; через них проходят и новые белки на пути к апикальной мембране эпителия.</dd></div><div id="ns-g-S2-T84"><dt>Миозин Vb</dt><dd>Изоформа миозина V эпителиальных клеток — актиновый мотор. Rab11a и Rab8a связывают его с пузырьком, а по актину к апикальной мембране движется сам миозин Vb. Нужен для доставки части апикальных белков (NHE3, CFTR, GLUT5), но не всех (DPPIV доставляется без него).</dd></div><div id="ns-g-S2-T85"><dt>Плотный контакт</dt><dd>Контакт у апикальной границы соседних эпителиальных клеток из тяжей клаудинов и каркасных белков ZO-1 и ZO-2. Ограничивает поток веществ между клетками (барьер). Роль «изгороди» между доменами мембраны для многих белков не обязательна.</dd></div><div id="ns-g-S2-T86"><dt>Клаудины</dt><dd>Белки плотного контакта с четырьмя трансмембранными участками; полимеризуясь, образуют тяжи. Без пяти основных клаудинов в клетках MDCK II тяжей нет и сопротивление монослоя снижено, но полярность в основном сохранена; при одновременном удалении клаудинов и JAM-A она местами нарушается (Otani 2019).</dd></div><div id="ns-g-S2-T87"><dt>Трансэпителиальное сопротивление</dt><dd>Электрическое сопротивление монослоя клеток на пористом фильтре, измеряемое электродами по обе стороны. Отражает проницаемость межклеточных промежутков для ионов, то есть барьер; о распределении белков по доменам не говорит.</dd></div><div id="ns-g-S2-T88"><dt>Болезнь включений микроворсинок</dt><dd>Врождённая атрофия микроворсинок, наследственная болезнь новорождённых с тяжёлой диареей; основная причина — мутации MYO5B. В энтероцитах мало микроворсинок, под апикальной мембраной накапливаются пузырьки, часть апикальных переносчиков не доставляется к мембране.</dd></div><div id="ns-g-S2-T89"><dt>Начальный сегмент аксона</dt><dd>Участок у основания аксона с особой организацией цитоскелета. Генерирует потенциал действия и служит границей и фильтром между аксоном и соматодендритным отделом нейрона.</dd></div><div id="ns-g-S2-T90"><dt>Необходимость белка</dt><dd>Свойство, которое показывает эксперимент с удалением или подавлением белка: без белка процесс нарушается. Необходимость не означает, что белок сам выполняет процесс или что его достаточно: удаление может нарушить процесс косвенно, через другие звенья.</dd></div><div id="ns-g-S2-T91"><dt>Достаточность белка</dt><dd>Свойство, которое показывает эксперимент с добавлением: белок, присоединённый к новому грузу или активированный в новом месте, вызывает там процесс. Пример — химически индуцируемое присоединение мотора к пероксисомам или оптогенетическая индукция сборки конденсата.</dd></div><div id="ns-g-S2-T92"><dt>Анкирин G</dt><dd>Каркасный белок начального сегмента аксона, связывающий спектрин, натриевые каналы и молекулы адгезии с подмембранным цитоскелетом. В культуре нейронов гиппокампа крысы подавление его синтеза разбирало начальный сегмент, и аксон приобретал признаки дендрита (Hedstrom 2008).</dd></div><div id="ns-g-S2-T93"><dt>ANXA11</dt><dd>Аннексин A11 — белок, который неупорядоченной областью входит в РНП-гранулу, а другим доменом связывается с мембраной лизосомы и так связывает гранулу с движущейся лизосомой (Liao 2019). Замены в ANXA11 найдены при боковом амиотрофическом склерозе.</dd></div><div id="ns-g-S2-T94"><dt>Синтаксин 3 и комплекс слияния</dt><dd>Синтаксин 3 (STX3) — t-SNARE апикальной мембраны эпителиальных клеток. Вместе с Munc18-2, Slp4a пузырька и v-SNARE Vamp7 участвует в слиянии пузырька, пришедшего по актину, с плазматической мембраной; для NHE3 в клетках Caco-2 нужен синтаксин 3, но не Vamp3. На апикальную мембрану синтаксин 3 попадает и без миозина Vb (Vogel 2015). Мутации STX3 вызывают вариант болезни включений микроворсинок.</dd></div><div id="ns-g-S2-T95"><dt>Сближение, гемифузия и слияние мембран</dt><dd>Сближение (тетеринг) — удержание двух целых мембран на малом расстоянии: бислои раздельны, содержимое не смешивается. Гемифузия — промежуточное состояние, в котором соединены только обращённые друг к другу листки бислоёв. Слияние — состояние, в котором бислой становится непрерывным и содержимое может смешиваться. Для митофузинов и OPA1 гемифузия в источниках шага не разобрана.</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 2 — Транспорт, сети органелл, конденсаты и полярность","home_eyebrow":"Семинар 2 · самостоятельная подготовка","home_h1":"Как клетка распределяет\nсвоё содержимое в пространстве","home_lead":"Меняйте мотор и ориентацию треков, скорости слияния и деления, концентрацию каркасного белка и потоки доставки и удаления и проследите, как клетка задаёт положение органелл, их число, безмембранные компартменты и устойчивую асимметрию. В семинаре 1 разбиралось, чем различаются области клетки; здесь — какими процессами нужные компоненты доставляются и удерживаются в них.","start":"Начать с треков и моторов →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в этот интерактив. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат эксперимента","practice_p":"45 сценариев с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 4.0 · учебные материалы кафедры биологии и генетики.","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}","jump_label":"Перейти к  ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Транспорт, сети органелл, конденсаты и полярность","stats":[["4 механизма","от положения органеллы к полярности клетки"],["Объяснения","с вопросами для самопроверки"],["45 сценариев","в отдельном практикуме"]],"num_fmt":"2.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел I: семинары","svg_hint":"Схема шире экрана: прокрутите её по горизонтали, чтобы увидеть все подписи."},"lessons":[{"id":"tracks","questions":[1],"title":"Как трек задаёт направление движения груза в клетке","keywords":["микротрубочка","плюс-конец","минус-конец","центросома","аксон","дендрит","актиновый филамент","трек"],"lead":["Направленный перенос требует линии с направлением — полярного филамента — и мотора, который движется по ней в определённую сторону.","Куда в клетке попадёт груз, зависит не только от мотора, но и от того, как в данном участке ориентированы треки."],"mechanism":["Два конца [[T01|микротрубочки]] различаются по строению: [[T02|плюс-конец]] обычно обращён к периферии, минус-конец закреплён у [[T16|центросомы]].","Мотор движется к определённому концу трека; это свойство мотора, а не клетки.","В аксоне почти все плюс-концы обращены к окончанию, в дендрите ориентация смешанная, поэтому один и тот же мотор переносит груз в разные области."],"paragraphs":["Диффузия перемещает молекулы во всех направлениях одинаково и на расстояниях в десятки микрометров слишком медленна для крупного груза. Адресное накопление возможно и без мотора, если в нужном месте груз удерживается связывающим белком ([[T29|диффузия и захват]]), но перенос груза на большие расстояния требует линии, обладающей направлением, и белка, который движется по ней в одну сторону. Направление задаёт цитоскелет.","Микротрубочка и [[T03|актиновый филамент]] структурно полярны: их концы различаются по строению и по скорости сборки. В большинстве животных клеток микротрубочки образуют радиальную систему — минус-концы закреплены у центросомы вблизи ядра, плюс-концы обращены к периферии. Тогда движение к плюс-концу означает движение к периферии, а к минус-концу — к центру клетки.","В специализированных клетках геометрия иная. В аксоне нейронов гиппокампа крысы микротрубочки ориентированы однородно — плюс-концом к окончанию; в средней части дендрита примерно половина микротрубочек обращена плюс-концом к телу клетки (Baas 1988). По движению маркера растущих плюс-концов EB3 в проксимальной части дендритов около 65 % плюс-концов направлены наружу (Stepanova 2003). В эпителии и в мышечном волокне значительная часть микротрубочек организуется вне центросомы (Akhmanova 2022).","Отсюда главное правило раздела: направление относительно концов филамента задаёт мотор, а направление относительно частей клетки — организация треков. На схеме доли микротрубочек, обращённых плюс-концом наружу, — 100 % для клетки с центросомой, 98 % для аксона и 60 % для дендрита; это учебные значения, согласованные с названными работами."],"trap":["Кинезин всегда переносит груз к периферии клетки, а динеин — к ядру.","Кинезин-1 движется к плюс-концу, динеин — к минус-концу. Движение к плюс-концу означает движение к периферии только там, где плюс-концы обращены к периферии; на участке со смешанной ориентацией треков мотор, идущий к плюс-концу, переносит груз в обе стороны."],"conditions":"Ориентация микротрубочек: Baas 1988 — электронная микроскопия, нейроны гиппокампа крысы в культуре; Stepanova 2003 — EB3-GFP в нейронах гиппокампа мыши в культуре. Организация микротрубочек вне центросомы — обзор Akhmanova и Kapitein 2022. Избирательный перенос кинезином-1 в аксон — Nakata и Hirokawa 2003 (нейроны гиппокампа мыши); при индуцируемом присоединении моторов к грузу в нейронах крысы кинезин переносил груз в аксон, а динеин — в дендриты (Kapitein 2010, Curr Biol). Задача про кинезин-1 в дендрите — мысленный эксперимент. Доли на схеме (100, 98 и 60 %) и распределение грузов по зонам — учебная модель практикума (вопрос 1, базовый уровень).","sources":["Baas1988","Stepanova2003","Akhmanova2022","Nakata2003","Kapitein2010Curr"],"quiz":{"id":"S2-L01","question":"Мысленный эксперимент: в средней части дендрита около половины микротрубочек обращены плюс-концом к телу нейрона. Как будут распределены по направлению пробеги груза, принудительно соединённого с кинезином-1?","options":[{"id":"S2-L01-1","text":"Почти все пробеги будут направлены к дальнему концу дендрита","correct":false,"feedback":"Так было бы при однородной ориентации, как в аксоне. В дендрите кинезин-1 движется к плюс-концу и по трекам, обращённым плюс-концом к телу клетки."},{"id":"S2-L01-2","text":"Пробеги будут направлены в обе стороны примерно поровну","correct":true,"feedback":"Кинезин-1 всегда движется к плюс-концу, а плюс-концы в этой части дендрита обращены в обе стороны примерно поровну, поэтому и пробеги идут в обе стороны. В живом нейроне кинезин-1 переносит грузы преимущественно в аксон (Nakata и Hirokawa 2003), поэтому эксперимент мысленный: он проверяет только роль ориентации треков."},{"id":"S2-L01-3","text":"Почти все пробеги будут направлены к телу нейрона","correct":false,"feedback":"Почти все пробеги шли бы к телу нейрона, если бы к нему были обращены плюс-концы почти всех микротрубочек. В этой части дендрита так ориентирована лишь около половины микротрубочек, а кинезин-1 движется к плюс-концу любой из них, поэтому пробеги направлены в обе стороны. При смешанной ориентации и минус-концевой мотор переносил бы грузы в обе стороны."}]},"widget":{"kind":"q1tracks","title":"","s":{"title":"Мотор и трек: куда попадёт груз","status":"Учебная модель, условные величины (та же, что в практикуме)","seg_label":"Участок клетки","segs":["клетка с центросомой","аксон","дендрит"],"mot_label":"Мотор на грузе","mots":["нет","кинезин-1","динеин"],"near":["центр (у ядра)","тело нейрона","тело нейрона"],"far":["периферия","окончание аксона","дальний конец дендрита"],"zones":"Доля грузов в пяти зонах участка","m_out":"Пробеги наружу","m_far":"Грузы в дальней зоне","none":"пробегов нет","notes":[["Без мотора грузы распределены равномерно: трек сам груз не перемещает.","Кинезин-1 движется к плюс-концам, обращённым к периферии: грузы собираются у периферии.","Динеин движется к минус-концам у центросомы: грузы собираются у центра."],["Без мотора в аксоне направленного переноса нет.","Почти все плюс-концы в аксоне обращены к окончанию: кинезин-1 переносит груз к синапсу.","Минус-концы в аксоне обращены к телу клетки: динеин переносит груз к телу нейрона."],["Без мотора в дендрите направленного переноса нет.","Мысленный эксперимент: треки ориентированы смешанно, и кинезин-1 переносит груз в обе стороны с небольшим перевесом наружу; в живом нейроне KIF5 переносит грузы в аксон.","Динеин тоже движется по трекам обеих ориентаций; перевес — к телу нейрона."]]}},"section":0,"number":1,"question":1},{"id":"motors","questions":[1],"title":"Чем различаются кинезины, динеин и миозины","keywords":["кинезин-1","динеин","миозин V","миозин II","процессивность","шаг","попеременная ходьба","ATP"],"lead":["Три семейства моторов превращают энергию гидролиза ATP в направленное перемещение, но по разным трекам и в разные стороны.","Для транспорта важна [[T14|процессивность]]: способность одной молекулы сделать много шагов, не отсоединяясь от трека."],"mechanism":["[[T10|Кинезин-1]] движется по микротрубочке к плюс-концу шагами 8 нм; [[T11|цитоплазматический динеин]] — к минус-концу.","[[T13|Миозин V]] движется по актиновому филаменту к оперённому концу шагами около 36 нм и переносит груз на коротком участке у мембраны.","Гидролиз ATP сопряжён со сменой сродства головки к треку; у процессивных двуглавых моторов головки ходят попеременно."],"paragraphs":["Общее у трёх семейств [[T04|моторов]] — механохимический цикл: связывание ATP, гидролиз и высвобождение продуктов меняют конформацию моторной головки и её сродство к треку. Различаются трек, направление и способ движения. Кинезины (у человека более сорока генов) в большинстве движутся по микротрубочке к плюс-концу; к минус-концу органеллы в животной клетке переносит практически один мотор — цитоплазматический динеин (Reck-Peterson 2018).","Кинезин-1 — наиболее изученный представитель. Его две головки по очереди отсоединяются от микротрубочки, смещаются вперёд и вновь связываются, так что в каждый момент хотя бы одна головка связана с треком. Каждый шаг равен 8 нм — периоду решётки микротрубочки; одиночная молекула in vitro делает около ста шагов, то есть проходит около микрометра, со скоростью порядка 1 мкм/с (Yildiz 2025). Скорость и длина пробега задаются кинетикой одного и того же цикла.","Миозин V движется по актину шагами около 36 нм, соответствующими полупериоду двойной спирали филамента, и потому идёт вдоль него, не закручиваясь (Sweeney 2018). Миозин II, напротив, непроцессивен: одиночная молекула связана с актином лишь малую часть цикла, и перемещение создаётся ансамблем головок в биполярном филаменте. Попеременная ходьба — свойство отдельных процессивных моторов, а не общий закон всего семейства.","Часть кинезинов вообще не переносит груз: кинезины семейств 13 и 8 ускоряют разборку концов микротрубочки. Поэтому принадлежность белка к семейству ещё не говорит о его работе."],"trap":["Все моторы одного семейства ходят одинаково, и любой миозин переносит груз.","Миозин II непроцессивен и работает в ансамбле; груз переносят процессивные миозины V и VI. Среди кинезинов есть белки, которые не переносят груз, а разбирают концы микротрубочек."],"conditions":"Параметры кинезина-1 (шаг 8 нм, около ста шагов до отсоединения, скорость порядка 1 мкм/с) получены на одиночных молекулах in vitro (обзор Yildiz 2025); в клетке скорость и пробег зависят от груза, числа моторов и модификаций трека. Параметры миозина V и миозина II — обзор Sweeney и Holzbaur 2018. Динеин как практически единственный минус-концевой мотор органелл — обзор Reck-Peterson 2018.","sources":["Yildiz2024","Sweeney2018","ReckPeterson2018"],"quiz":{"id":"S2-L02","question":"Одиночную молекулу миозина II и одиночную молекулу миозина V поместили на актиновый филамент с ATP. Какая из них будет перемещаться вдоль филамента на много шагов, не отсоединяясь?","options":[{"id":"S2-L02-1","text":"Обе: все миозины процессивны","correct":false,"feedback":"Процессивность — свойство отдельных моторов, а не всего семейства. Одиночный миозин II связан с актином лишь малую часть цикла."},{"id":"S2-L02-2","text":"Только миозин II, работающий в мышце","correct":false,"feedback":"Миозин II создаёт движение только в ансамбле головок биполярного филамента; одиночная молекула быстро отсоединяется от трека."},{"id":"S2-L02-3","text":"Только миозин V, переносящий груз","correct":true,"feedback":"Головки миозина V ходят попеременно шагами около 36 нм, и одна из них всегда связана с актином, поэтому одиночная молекула проходит много шагов."}]},"widget":{"kind":"table","title":"","s":{"title":"Моторы: трек, направление и способ движения","status":"Сводка данных (обзоры Yildiz 2025, Sweeney 2018, Reck-Peterson 2018)","modes_label":"Показать","modes":["Транспортные моторы","Что значит «процессивный»"],"tables":[{"head":["Мотор","Трек","Направление","Шаг","Процессивность одиночной молекулы"],"rows":[["кинезин-1 (KIF5)","микротрубочка","к плюс-концу","8 нм","да, около ста шагов in vitro"],["цитоплазматический динеин","микротрубочка","к минус-концу","непостоянный","только в комплексе с динактином и адаптером"],["миозин V","актиновый филамент","к оперённому концу","около 36 нм","да"],["миозин II","актиновый филамент","к оперённому концу","—","нет: работает в ансамбле"]],"note":"Направление указано относительно концов филамента, а не частей клетки."},{"head":["Свойство","Процессивный мотор","Непроцессивный мотор"],"rows":[["связь с треком","хотя бы одна головка связана в каждый момент","связан малую часть цикла"],["движение одной молекулы","много шагов подряд","отсоединяется после рабочего хода"],["пример","кинезин-1, миозин V","миозин II"],["как создаётся перемещение груза","одним или несколькими моторами","ансамблем многих головок"]],"note":"Для переноса одиночного пузырька на микрометры нужны процессивные моторы."}]}},"section":0,"number":2,"question":1},{"id":"adaptors","questions":[1],"title":"Как мотор связывается со своим грузом и почему без груза он неактивен","keywords":["адаптер","автоингибирование","динактин","BICD2","HOOK3","TRAK","Miro","митохондрия"],"lead":["Один динеин переносит почти все грузы к минус-концу, значит, избирательность создаёт не сам мотор.","[[T05|Адаптер груза]] одновременно определяет, какой груз будет связан с мотором, и активирует мотор."],"mechanism":["Без груза кинезин-1 [[T15|автоингибирован]] и почти не гидролизует ATP; одиночный динеин находится в автоингибированной конформации и процессивно не движется.","Динеин движется процессивно только в комплексе с [[T12|динактином]] и адаптером (BICD2, HOOK3 и др.).","Митохондрия связывается с кинезином-1 и динеином через адаптеры [[T17|TRAK]] и белок наружной мембраны Miro."],"paragraphs":["Цитоплазматический динеин в отсутствие партнёров автоингибирован: его моторные головки уложены так, что процессивное движение невозможно. Очищенный динеин млекопитающих в экспериментах in vitro по микротрубочке процессивно не двигался; когда же он образовывал комплекс с динактином и одним из адаптеров груза, комплекс проходил расстояния, сравнимые с пробегами грузов в клетке (McKenney 2014). Динактин сам мотором не является: вместе с адаптером он собирает динеин в активный комплекс.","Отсюда понятно, как один мотор переносит множество разных грузов и почти не гидролизует ATP без груза. Адаптер связывается и с грузом, и с комплексом динеин — динактин, поэтому сборка комплекса на грузе одновременно определяет адрес и активирует мотор. Разные адаптеры включают в комплекс одну или две молекулы динеина: BICD2 чаще одну, BICDR1 и HOOK3 — две, и комплекс с двумя динеинами развивает большую силу и скорость (Urnavicius 2018).","Кинезин-1 устроен иначе, но логика та же: без груза его хвост складывается на моторные домены и подавляет и гидролиз ATP, и связывание с треком; связывание груза и адаптеров снимает это торможение (Yildiz 2025). Поэтому утверждения «мотор есть в клетке» и «мотор работает» различаются, и второе требует данных об активации.","Для митохондрий адаптерная система изучена особенно подробно. Белок наружной мембраны Miro через адаптеры TRAK1/2 (у дрозофилы — Milton) связывает митохондрию с кинезином-1 и с динеином. У Miro есть два Ca²⁺-связывающих EF-мотива; как эта связь управляет остановкой митохондрии, разобрано в шаге об остановке и закреплении."],"trap":["Динеин движется по микротрубочке сам, а адаптер лишь прикрепляет к нему груз.","Одиночный динеин автоингибирован и процессивно не движется; процессивное движение начинается в комплексе с динактином и адаптером, поэтому адаптер и определяет груз, и активирует мотор."],"conditions":"Активация динеина — эксперименты in vitro с очищенными белками млекопитающих (McKenney 2014; Urnavicius 2018: криоэлектронная микроскопия и одиночные молекулы). Автоингибирование кинезина-1 — обзор Yildiz 2025. Комплекс TRAK–Miro — обзор Misgeld и Schwarz 2017. Состояния на схеме — схема механизма, без чисел.","sources":["McKenney2014","Urnavicius2018","Yildiz2024","Misgeld2017"],"quiz":{"id":"S2-L03","question":"К очищенному динеину на микротрубочке добавили динактин, но без адаптера груза. Как будет двигаться динеин?","options":[{"id":"S2-L03-1","text":"Процессивно к минус-концу, как в составе груза","correct":false,"feedback":"Для процессивного движения нужен тройной комплекс: динактин без адаптера не собирает динеин в активную форму."},{"id":"S2-L03-2","text":"Процессивно к плюс-концу микротрубочки","correct":false,"feedback":"Направление динеина задано устройством мотора — к минус-концу; динактин его не меняет."},{"id":"S2-L03-3","text":"Процессивного движения не будет","correct":true,"feedback":"Только тройной комплекс динеин — динактин — адаптер движется процессивно (McKenney 2014); без адаптера динеин остаётся в неактивном состоянии."}]},"widget":{"kind":"net","title":"","s":{"title":"Адаптер связывает груз и активирует мотор","status":"Схема механизма","modes_label":"Состояние","modes":["кинезин-1 без груза","кинезин-1 на митохондрии","динеин один","динеин + динактин","динеин + динактин + адаптер"],"h":250,"w":640,"areas":[{"kind":"mem","y":210,"lx":10,"ly":232,"label":"микротрубочка: − слева, + справа"}],"nodes":[{"id":"kin","x":30,"y":140,"w":120,"h":40,"label":"кинезин-1","fs":14,"only":[0,1]},{"id":"trak","x":30,"y":80,"w":120,"h":36,"label":"TRAK","fs":14,"only":[1]},{"id":"miro","x":30,"y":24,"w":120,"h":36,"label":"Miro · митохондрия","fs":13,"only":[1]},{"id":"dyn","x":300,"y":140,"w":120,"h":40,"label":"динеин","fs":14,"only":[2,3,4]},{"id":"dctn","x":300,"y":80,"w":120,"h":36,"label":"динактин","fs":14,"only":[3,4]},{"id":"adp","x":300,"y":24,"w":120,"h":36,"label":"адаптер BICD2","fs":13,"only":[4]}],"edges":[{"id":"k1","pts":[90,116,90,138],"type":"bind"},{"id":"k0","pts":[90,60,90,78],"type":"bind"},{"id":"kmove","pts":[160,196,260,196],"type":"move","label":"к плюс-концу","lx":210,"ly":186},{"id":"d1","pts":[360,116,360,138],"type":"bind"},{"id":"d0","pts":[360,60,360,78],"type":"bind"},{"id":"dmove","pts":[560,196,460,196],"type":"move","label":"к минус-концу","lx":510,"ly":186}],"states":[{"on":[],"inh":["kin"],"show":[],"hide":["k1","k0","kmove","d1","d0","dmove"],"note":"Без груза хвост кинезина-1 сложен на моторные домены: мотор автоингибирован и почти не гидролизует ATP."},{"on":["kin","trak","miro"],"show":["k1","k0","kmove"],"hide":["d1","d0","dmove"],"note":"Связывание с адаптером TRAK и белком Miro на митохондрии снимает автоингибирование: кинезин-1 переносит митохондрию к плюс-концу."},{"on":[],"inh":["dyn"],"show":[],"hide":["k1","k0","kmove","d1","d0","dmove"],"note":"Одиночный динеин автоингибирован и процессивно не движется."},{"on":["dctn"],"inh":["dyn"],"show":["d1"],"hide":["k1","k0","kmove","d0","dmove"],"note":"Динактин сам мотором не является; без адаптера комплекс процессивно не движется."},{"on":["dyn","dctn","adp"],"show":["d1","d0","dmove"],"hide":["k1","k0","kmove"],"note":"Адаптер связывает груз и собирает динеин с динактином в активный комплекс: начинается процессивное движение к минус-концу."}],"legend":"Точка на конце линии — связывание белков; пунктир со стрелкой — перенос по треку. Пунктирная рамка — мотор в неактивном (автоингибированном) состоянии."}},"section":0,"number":3,"question":1},{"id":"bidirectional","questions":[1],"title":"Почему груз движется то в одну, то в другую сторону","keywords":["двунаправленное движение","перетягивание","согласованное переключение","кинезин","динеин","удаление мотора"],"lead":["На одном грузе обычно находятся и кинезины, и динеин, и большинство органелл движутся прерывисто, сменяя направление.","Две гипотезы объясняют это по-разному и дают противоположные предсказания для эксперимента с удалением одного мотора."],"mechanism":["[[T21|Модель перетягивания]]: моторы обоих направлений активны одновременно, направление задаёт механически преобладающая группа.","[[T22|Модель согласованного переключения]]: в каждый момент активна одна группа, а моторы противоположных направлений нужны друг другу.","Ослабление динеина в первой модели усиливает движение к плюс-концу, во второй — ослабляет движение в обе стороны."],"paragraphs":["Прижизненное наблюдение показывает, что большинство органелл и рибонуклеопротеиновых частиц движутся прерывисто: короткие пробеги в одну сторону сменяются пробегами в другую и остановками. Такое движение называют двунаправленным; оно связано с тем, что на грузе одновременно находятся моторы обоих направлений.","Модель перетягивания предполагает, что моторы обоих направлений активны одновременно, а наблюдаемое направление определяется тем, какая группа механически сильнее. Тогда ослабление динеина должно усиливать [[T20|антероградное]] движение: кинезину меньше противодействует мотор противоположного направления. Модель согласованного переключения предполагает, что в каждый момент работает одна группа моторов и что моторы противоположных направлений нужны друг другу для активации. Тогда ослабление динеина должно снижать движение в обе стороны.","Во многих системах удаление или подавление одного мотора действительно снижало движение в обе стороны; этот «парадокс взаимной зависимости» разобран в обзоре Hancock (2014). В клетках дрозофилы S2 подавление кинезина-1 прекращало и перенос пероксисом динеином, и наоборот (Ally 2009); в аксонах мотонейронов личинок дрозофилы мутации кинезина-1 нарушали и ретроградный перенос митохондрий, а мутации динеина не меняли и не усиливали перенос к окончанию аксона (Pilling 2006) — простое перетягивание предсказывало бы усиление. Вклад перетягивания в отдельных системах при этом не исключён.","Важно не выбрать модель, а уметь сформулировать оба предсказания и назвать эксперимент, который их различает. На схеме те же два предсказания посчитаны по модели практикума: это учебный расчёт, а не данные эксперимента."],"trap":["Если убрать динеин, кинезин без противодействия будет переносить груз к плюс-концу ещё активнее.","Это предсказание модели перетягивания. Во многих экспериментах удаление одного мотора снижало движение в обе стороны, что говорит о взаимной зависимости моторов."],"conditions":"Обзор Hancock 2014; Ally 2009 — клетки дрозофилы S2, пероксисомы, РНК-интерференция и замена моторов; Pilling 2006 — аксоны мотонейронов личинок дрозофилы, мутации кинезина-1 и динеина.
