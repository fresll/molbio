,{"rows":[{"t":"Связывание с пептидом","steps":["пептид HIF-1α:\nPro564-OH\nили без OH","добавление\nочищенного pVHL","отмывка\nнесвязавшегося\nбелка","pVHL, оставшийся\nна пептиде"]},{"t":"Коиммунопреципитация","steps":["лизат клеток\n+ входной\nконтроль","антитело к pVHL\nили контрольное","отмывка","HIF-α\nв осаждённой\nфракции"]}],"cells":["Связывание заданных очищенных компонентов (пептид — pVHL) или совместное выделение белков из лизата.","Пептид без гидроксилирования в тех же количествах; контрольное антитело; входной материал.","Упрощённая система не воспроизводит всю клетку; совместное выделение не всегда означает прямой контакт."],"note":"Пептид HIF связывал pVHL только при гидроксилированном пролине (Ivan 2001; Jaakkola 2001). pVHL и субъединицы HIF-α выделялись из клеток совместно, а после обработки хелатором железа или ионами кобальта HIF-1 отделялся от pVHL (Maxwell 1999)."},{"rows":[{"t":"","steps":["короткий\nимпульс\nметки","удаление\nметки","пробы\nв одинаковые\nсроки","выделение\nHIF-1α\nантителом","остаток\nмеченого\nбелка"]},{"t":"Сравнение параллельных культур","steps":["клетки с pVHL и клетки без pVHL: та же схема и те же сроки отбора проб"]}],"cells":["Исчезновение выбранной популяции молекул во времени, то есть скорость распада в условиях эксперимента.","Одинаковые сроки и число клеток; контроль повторного включения метки; одинаковые условия O₂.","Содержание белка в один момент без временного ряда не разделяет синтез и распад."],"note":"Импульсное мечение отделяет распад от синтеза: прослеживается только популяция молекул, синтезированных во время импульса. В клетках RCC4 без pVHL период полужизни HIF-1α был около 60 мин (Tian 2011, предварительные эксперименты); при работающем pVHL и достаточном O₂ белок разрушается быстрее."},{"rows":[{"t":"Утрата и восстановление функции","steps":["клетки рака\nпочки: pVHL\nне работает","HIF-α стабилен\nпри любом O₂","введение\nгена VHL","нестабильность\nHIF-α при O₂\nвосстановлена"]},{"t":"Подавление РНК (RNAi)","steps":["siRNA\nк мРНК PHD2","меньше мРНК\nи белка PHD2","HIF-1α стабилен\nпри нормоксии"]}],"cells":["Необходимость выбранного звена в данных клетках и условиях.","Проверка белка после вмешательства; восстановление функции; независимая siRNA; siRNA к PHD1 и PHD3 как сравнение.","Нокдаун не равен полному отсутствию белка; длительная потеря pVHL меняет клетку, например повышает содержание PHD2 и PHD3."],"note":"Введение функционального гена VHL в клетки с дефектом VHL восстановило зависимость стабильности HIF-α от O₂ (Maxwell 1999). Подавление PHD2, но не PHD1 и не PHD3, стабилизировало HIF-1α при нормоксии в клетках человека (Berra 2003)."},{"rows":[{"t":"DMOG","steps":["аналог\n2-оксоглутарата","тормозит PHD, FIH\nи другие ферменты","Asn803-OH подавлено\nсильнее, чем Pro-OH"]},{"t":"Хелатор железа (дефероксамин)","steps":["связывает\nжелезо","меньше активных\nгидроксилаз","Pro-OH подавлено\nсильнее, чем Asn803-OH"]},{"t":"Ионы кобальта (Co²⁺)","steps":["ионы\nкобальта","тормозят\nпролилгидроксилирование","Pro-OH снижено,\nAsn803-OH сохранено"]}],"cells":["Ответ на вещество в выбранной дозе и сроке.","Растворитель; диапазон доз; одинаковый срок; независимое генетическое подтверждение.","Вещества не равнозначны гипоксии и не специфичны для одного фермента; одинаковое накопление HIF-1α не означает одного механизма."],"note":"В клетках RCC4 (4–5 ч) DMOG сильнее подавлял гидроксилирование Asn803, чем пролилгидроксилирование; хелаторы железа сильнее подавляли пролилгидроксилирование; ионы кобальта подавляли пролилгидроксилирование, но не гидроксилирование Asn803 (Tian 2011). Эти соединения по-разному изменяют гидроксилирование, поэтому их нельзя считать функционально равноценными."},{"rows":[{"t":"Конструкция с HRE","steps":["HRE гена\nVEGF\n+ промотор","ген-репортёр","мРНК\nрепортёра","белок-репортёр","регистрируемый\nсигнал"]},{"t":"Контроль","steps":["HRE с заменой\nтрёх нуклеотидов","тот же\nрепортёр","нет усиления\nпри гипоксии"]}],"cells":["Способность выбранного элемента ДНК поддерживать HIF-зависимую транскрипцию.","Мутантный элемент; независимый внутренний репортёр; содержание мРНК репортёра.","Репортёр с одним элементом не воспроизводит всю программу эндогенных генов; сигнал зависит и от стабильности РНК и белка."],"note":"Участок из 47 пар нуклеотидов перед геном VEGF усиливал экспрессию репортёра в клетках Hep3B при гипоксии; замена трёх нуклеотидов в участке связывания HIF-1 отменяла и связывание, и ответ (Forsythe 1996)."}]}}},{"id":"methods","number":29,"section":4,"title":"Как соотнести молекулярное событие, измерение и контроль","question":null,"questions":[1,2,3,4],"keywords":["метод","измеряемая величина","контроль","граница вывода","иммуноблот","репортёр","ОТ-ПЦР","масс-спектрометрия","коиммунопреципитация","фракционирование","генетическое выключение"],"lead":["В каждом из четырёх путей можно различить изменение сенсора или фермента, изменение регулятора и последующее изменение синтеза белков-мишеней. Конкретные молекулярные события на этих этапах различаются.","Каждый этап характеризуется своей величиной, и каждую величину измеряют своим методом с собственным контролем."],"mechanism":["Метод регистрирует определённое свойство объекта: содержание формы белка, долю модификации, локализацию, связывание, содержание РНК или скорость синтеза.","Сходный результат может возникнуть разными путями: рост содержания NRF2 или HIF-α — из-за замедления распада или ускорения синтеза.","Набор согласованных показателей и контролей, включая генетическое выключение звена, ограничивает число возможных объяснений."],"paragraphs":["Четыре пути этого семинара устроены сходно. Сначала изменяется сенсор или фермент: киназа фосфорилирует [[T08|eIF2α]], [[T25|IRE1α]] разрезает мРНК XBP1, электрофил модифицирует цистеины [[T33|KEAP1]], недостаток O₂ ограничивает работу [[T52|PHD]]. Далее пути расходятся: снижение обменной активности eIF2B изменяет синтез ATF4; со сплайсированной мРНК XBP1s синтезируется белок XBP1s, а после протеолиза ATF6 образуется его N-концевой фрагмент. Замедление распада NRF2 или HIF-α повышает их содержание. Транскрипцию генов-мишеней в ядре регулируют белки ATF4, XBP1s, N-концевой фрагмент ATF6, NRF2 и комплекс HIF-α с ARNT. В результате меняется синтез белков-мишеней.","На каждом этапе нужно сначала выбрать величину, а уже потом метод. [[T64|Содержание, доля модификации и активность]] — разные величины. Иммуноблот показывает содержание определённой формы белка в образце, но не скорость реакции. Репортёрная конструкция показывает свойство участка мРНК или ДНК, но не всю регуляцию эндогенного гена. Количественная ОТ-ПЦР даёт содержание мРНК, но не количество белка. Масс-спектрометрия пептидов показывает химическое состояние остатка, но не его функцию.","Каждое измерение требует контроля, который исключает другие объяснения. Для фосфоформы это общий белок на той же мембране, для репортёра — вариант с изменённым регуляторным элементом, для коиммунопреципитации — контрольное антитело. Причинную роль звена проверяют генетическим выключением: если ответ исчезает в клетках без PERK, pVHL или NRF2 и возвращается после восстановления белка, звено необходимо в этих условиях.","Схема шага сводит события, величины, методы, контроли и границы вывода в одну таблицу. Рисунки этапов показывают порядок операций, а не результаты экспериментов. Подробные схемы методов с учебными рисунками сигналов даны в последних шагах четырёх разделов."],"trap":["Если два метода показали рост одного белка, неважно, какую величину измерил каждый из них.","Иммуноблот общего белка, его ядерная доля и транскрипция мишеней — разные величины. Совпадение направления изменений не означает, что все этапы пути проверены."],"conditions":"Методический шаг: сопоставление методов, а не экспериментальный результат. Рисунки этапов — схемы операций без численных значений. Примеры результатов взяты из работ с указанными в соответствующих шагах условиями: Schoof 2021 (очищенные белки человека, обмен нуклеотидов), Vattem 2004 и Lu 2004 (репортёр с 5′-областью ATF4, клетки млекопитающих), Ye 2000 (клетки CHO без S1P или S2P), Zhang 2003 (замены цистеинов KEAP1), Ivan 2001 и Jaakkola 2001 (связывание pVHL с пептидами HIF-1α), Lando 2002 (Asn803 и p300), Tian 2011 (иммуноблот форм HIF-1α). Число повторов, концентрации и сроки переносятся только из конкретной статьи.","sources":["Wek2023","Acosta2025","Liu2022","Tian2011","Schoof2021","Vattem2004","Ye2000","Zhang2003","Ivan2001","Lando2002"],"quiz":{"id":"S10-L29","rev":1,"question":"Что непосредственно покажет иммуноблот с антителом к общему NRF2 в суммарном клеточном лизате при корректном контроле загрузки?","options":[{"id":"S10-L29-2","text":"Относительное содержание белка NRF2 в этом образце.","correct":true,"feedback":"Такое измерение относится к содержанию белка; его локализация и функция требуют отдельных подходов."},{"id":"S10-L29-1","text":"Скорость транскрипции каждого гена с ARE.","correct":false,"feedback":"Для транскрипционного выхода нужны другие показатели; общий белок в лизате их не измеряет."},{"id":"S10-L29-3","text":"Абсолютную скорость KEAP1-зависимого разрушения NRF2.","correct":false,"feedback":"Одно измерение содержания не разделяет вклад синтеза и распада и не задаёт скорость удаления."}]},"widget":{"kind":"matrix_s5","title":"","s":{"title":"Событие → величина → метод → контроль","status":"Сопоставление методов · схемы операций, не данные эксперимента","rows_label":"Система","rows":["ISR","UPR","KEAP1–NRF2","HIF"],"rows_m":["ISR","UPR","NRF2","HIF"],"cols_label":"Этап пути","cols_short":["вход","передача","регулятор","мишени"],"steps_h":"Этапы","heads":["Событие и величина","Метод","Контроль","Граница вывода"],"cells":[[{"m":"иммуно-\nблот","name":"иммуноблота","steps":["лизат клеток\nодного срока","электрофорез\nи перенос","антитело\nк P-Ser51","антитело\nк общему eIF2α"],"v":["Фосфорилирование Ser51 eIF2α: содержание фосфоформы относительно общего eIF2α.","Иммуноблот с антителом к фосфорилированному Ser51 и к общему eIF2α на той же мембране.","Общий eIF2α и контроль загрузки; сигнал в линейном диапазоне; образцы одного срока.","Сигнал не указывает, какая киназа фосфорилировала eIF2α, и не равен скорости трансляции."],"note":"Иммуноблот отвечает на вопрос, изменилось ли содержание фосфорилированного eIF2α. Вклад отдельной киназы проверяют в клетках без неё, а трансляцию измеряют другими методами (шаг «Как различить фосфорилирование eIF2α и изменение трансляции»)."},{"m":"обмен\nGDP","name":"измерения обмена нуклеотидов","steps":["eIF2 с меченым\nGDP","добавление eIF2B\nи избытка GDP","освобождение\nметки во времени","сравнение\nс eIF2(αP)"],"v":["Обменная активность eIF2B: скорость освобождения меченого GDP из комплекса с eIF2.","Измерение с очищенными белками: флуоресцентно меченный GDP, связанный с eIF2, вытесняется немеченым GDP при участии eIF2B.","Проба без eIF2B (спонтанная диссоциация); одинаковые концентрации белков; eIF2 без фосфорилирования.","Условия в пробирке не воспроизводят концентрации и связывание белков в клетке."],"note":"Анализ с очищенными белками показывает, что eIF2(αP) подавляет обменную активность eIF2B, а ISRIB частично её восстанавливает (Schoof 2021). Перенос этих результатов на клетку требует отдельных измерений трансляции."},{"m":"мечение\nбелков","name":"кратковременного мечения","steps":["клетки\nв среде","короткий\nимпульс метки","метка\nв белках","синтез\nза интервал"],"v":["Общий синтез белка за время импульса метки.","Кратковременное мечение новосинтезируемых белков (например, включение пуромицина или меченой аминокислоты).","Одинаковая длительность импульса и количество белка; проба с ингибитором трансляции.","Показывает суммарный синтез, но не синтез отдельного белка вроде ATF4."],"note":"Снижение включения метки показывает уменьшение общей трансляции. Чтобы показать избирательное усиление синтеза ATF4, нужен отдельный подход — репортёр или рибосомное профилирование."},{"m":"репор-\nтёр","name":"репортёрного эксперимента","steps":["5′-область ATF4\nперед репортёром","вариант с\nизменённой uORF2","воздействие","сигнал\nи мРНК"],"v":["Влияние 5′-области мРНК ATF4 на трансляцию при неизменной кодирующей части.","Репортёрная конструкция: 5′-область ATF4 перед кодирующей последовательностью люциферазы.","Вариант с изменённым старт-кодоном uORF2; количество репортёрной мРНК; внутренний контрольный репортёр.","Показывает свойство 5′-области в конструкции, а не транскрипцию эндогенного гена ATF4."],"note":"Когда старт-кодон uORF2 изменён, репортёр транслируется и без стресса: так проверяют, что регуляция зависит от uORF (Vattem 2004; Lu 2004)."}],[{"m":"иммуно-\nблот","name":"иммуноблота","steps":["лизат клеток\nодного срока","электрофорез\nи перенос","антитело\nк p-eIF2α","антитело\nк общему eIF2α"],"v":["Выход ветви PERK: содержание p-eIF2α относительно общего eIF2α.","Иммуноблот, как в разделе ISR; для сравнения ветвей — в образцах одного срока.","Общий eIF2α; клетки без PERK для проверки вклада этой киназы.","Повышение p-eIF2α — общий признак ISR и не доказывает активации PERK без генетического контроля."],"note":"Один и тот же Ser51 фосфорилируют четыре киназы. Отнести повышение p-eIF2α к ветви PERK позволяет сравнение с клетками без PERK."},{"m":"ОТ-ПЦР\nXBP1","name":"ОТ-ПЦР с разделением продуктов","steps":["РНК\nобразца","обратная\nтранскрипция","ПЦР участка\nXBP1","разделение\nпродуктов"],"v":["Выход IRE1α: продукты, соответствующие мРНК XBP1u и XBP1s.","ОТ-ПЦР участка вокруг интрона XBP1 и разделение продуктов по длине.","Проба без обратной транскриптазы; ингибитор РНКазы IRE1α или клетки без IRE1α.","Сплайсинг XBP1 не равен количеству белка XBP1s и не показывает RIDD."],"note":"Продукт XBP1s короче на 26 нуклеотидов. Его появление показывает, что РНКаза IRE1α и лигаза RtcB обработали мРНК XBP1."},{"m":"иммуно-\nблот","name":"иммуноблота","steps":["лизат клеток\nодного срока","электрофорез\nи перенос","антитело\nк ATF6α","полосы ATF6α\nи фрагмента"],"v":["Выход ATF6: полноразмерный ATF6α и его N-концевой фрагмент.","Иммуноблот с антителом к N-концевой части ATF6α.","Клетки без S1P или S2P; одинаковый срок; контроль загрузки.","Содержание фрагмента зависит и от его распада; это не прямое измерение скорости протеолиза."],"note":"Появление N-концевого фрагмента показывает протеолиз ATF6α в аппарате Гольджи. Без S2P фрагмент не образуется (Ye 2000)."},{"m":"количеств.\nОТ-ПЦР","name":"количественной ОТ-ПЦР","steps":["РНК\nобразца","обратная\nтранскрипция","ПЦР с\nрегистрацией","сравнение\nс референсом"],"v":["Транскрипционный выход UPR: относительное содержание мРНК генов-мишеней (например, HSPA5, кодирующего BiP).","Количественная ПЦР после обратной транскрипции.","Референсные гены, не меняющиеся при воздействии; проба без обратной транскриптазы.","мРНК мишени регулируется несколькими ветвями; рост мРНК не указывает, какая ветвь его вызвала, и не равен количеству белка."],"note":"Чтобы отнести изменение мРНК к ветви, сравнивают клетки без IRE1α, без ATF6 или без PERK при одинаковом воздействии."}],[{"m":"пептиды\nс Cys","name":"анализа модифицированных пептидов","steps":["KEAP1 после\nвоздействия","расщепление\nна пептиды","масс-\nспектрометрия","пептиды с\nизменённым Cys"],"v":["Модификация определённых цистеинов KEAP1 выбранным электрофилом.","Анализ модифицированных цистеиновых пептидов масс-спектрометрией.","KEAP1 без воздействия; белок с заменой проверяемого цистеина.","Модификация остатка не доказывает, что именно она стабилизирует NRF2; это проверяют заменой остатка."],"note":"Масс-спектрометрия показывает химическое состояние остатков. Функциональную роль остатка проверяют в клетках с заменой цистеина (Zhang 2003)."},{"m":"распад\nво времени","name":"прослеживания белка во времени","steps":["метка или\nостановка синтеза","отбор проб\nво времени","определение\nNRF2","кривая\nисчезновения"],"v":["Распад NRF2: исчезновение выбранной популяции белка во времени.","Прослеживание меченой популяции белка (импульс — отмывка метки) или наблюдение после остановки синтеза.","Одинаковые сроки отбора проб; сравнение с клетками без воздействия.","Остановка синтеза ингибитором затрагивает все белки и может изменить сам распад."],"note":"Содержание NRF2 растёт при замедлении распада или ускорении синтеза. Прослеживание меченой популяции во времени позволяет отдельно оценить скорость её распада."},{"m":"фракции\nклетки","name":"определения локализации","steps":["клетки\nодного срока","фракции ядра\nи цитоплазмы","иммуноблот\nфракций","маркеры\nфракций"],"v":["Ядерная доля NRF2.","Фракционирование клеток или иммунофлуоресцентная микроскопия.","Маркеры ядерной и цитоплазматической фракций; специфичность антитела.","NRF2 в ядре ещё не означает связывания с ARE и усиления транскрипции."],"note":"Локализация — отдельная величина: рост общего NRF2 и его ядерной доли измеряют разными экспериментами."},{"m":"репор-\nтёр","name":"репортёрного эксперимента","steps":["ARE перед\nпромотором","вариант с\nизменённым ARE","воздействие","сигнал\nрепортёра"],"v":["Транскрипция, зависящая от ARE.","Репортёрная конструкция с ARE; дополнительно — ОТ-ПЦР мРНК NQO1 и других мишеней.","Конструкция с изменённым ARE; клетки без NRF2 при одинаковом воздействии.","Репортёр показывает свойство элемента в конструкции; ген с ARE может регулироваться и другими факторами."],"note":"Если сигнал зависит от ARE и исчезает в клетках без NRF2, связь «NRF2 — ARE — транскрипция» подтверждена для этих условий."}],[{"m":"пептид\nи pVHL","name":"связывания с пептидом","steps":["пептид HIF-1α:\nPro564-OH или Pro","очищенный\npVHL","отмывка","pVHL\nна пептиде"],"v":["Пролилгидроксилирование и его распознавание: связывание pVHL с пептидом HIF-1α.","Связывание очищенного pVHL с синтетическим пептидом с гидроксипролином или без него.","Пептид без гидроксилирования в тех же количествах.","Упрощённая система не воспроизводит клетку: показывает, что связывание требует гидроксипролина."],"note":"pVHL связывал пептид HIF-1α только с гидроксилированным пролином (Ivan 2001; Jaakkola 2001)."},{"m":"иммуно-\nблот","name":"иммуноблота","steps":["клетки\nодного срока","электрофорез\nи перенос","антитела:\nобщий HIF-1α\nи Pro564-OH","сигнал\nполос"],"v":["Содержание общего HIF-1α и формы с гидроксилированным Pro564.","Иммуноблот с антителами к общему HIF-1α и к Pro564-OH; ингибитор протеасомы для накопления гидроксилированной формы.","Одинаковые срок и загрузка; клетки без pVHL; ингибитор гидроксилаз.","Без калибровки сигнал не даёт долю модификации и скорость реакции."],"note":"При достаточном O₂ гидроксилированный HIF-1α быстро разрушается, поэтому его полоса слабая. При ингибировании протеасомы или без pVHL он накапливается (Tian 2011)."},{"m":"соосаж-\nдение","name":"коиммунопреципитации","steps":["лизат клеток\n+ входной\nконтроль","антитело\nк HIF-1α","отмывка","p300/CBP\nв осадке"],"v":["Связывание C-концевого домена HIF-α с коактиватором p300/CBP; его зависимость от Asn803.","Коиммунопреципитация — совместное выделение (соосаждение) белков из лизата антителом; замена Asn803 или ингибирование FIH.","Контрольное антитело; входной материал; одинаковое содержание HIF-1α.","Совместное выделение не всегда означает прямой контакт."],"note":"Гидроксилирование Asn803 ослабляет связывание с p300 без изменения количества HIF-1α (Lando 2002)."},{"m":"репор-\nтёр","name":"репортёрного эксперимента","steps":["HRE перед\nпромотором","вариант с\nизменённым HRE","гипоксия","сигнал\nрепортёра"],"v":["Транскрипция, зависящая от HRE.","Репортёрная конструкция с HRE; дополнительно — ОТ-ПЦР мРНК генов-мишеней.","Конструкция с изменённым HRE; клетки без HIF-1β (ARNT).","Репортёр отражает свойство элемента в конструкции, а не всю программу гена-мишени."],"note":"Ответ репортёра на гипоксию, исчезающий при изменённом HRE, показывает зависимость транскрипции от этого элемента."}]],"fixed":"Таблица сопоставляет методы; она не заменяет эксперимент. Этапы показаны без численных значений."}}},{"id":"integrate","number":30,"section":4,"title":"Как четыре механизма различаются при сочетании воздействий","question":null,"questions":[1,2,3,4],"keywords":["сочетание воздействий","условная клетка","PERK","IRE1α","ATF6","KEAP1","NRF2","pVHL","HIF-α","перекрёстная регуляция","генетическое выключение"],"lead":["В условной клетке можно по отдельности изменить нагрузку на ЭПР, добавить электрофил и снизить O₂, а также убрать PERK или pVHL.","Каждое воздействие действует через собственный первичный вход, поэтому ответ на их сочетание объясняют по состоянию каждого звена, а не как одну общую «активацию стрессовых путей»."],"mechanism":["Нарушение сворачивания в ЭПР активирует PERK, IRE1α и ATF6; электрофил модифицирует цистеины KEAP1; недостаток O₂ ограничивает гидроксилирование HIF-α ферментами PHD.","Отсутствие PERK устраняет PERK-зависимое фосфорилирование eIF2α, но не образование мРНК XBP1s и фрагмента ATF6; отсутствие pVHL замедляет распад HIF-α и при достаточном O₂.","Совпадение выходов (например, общие гены-мишени) или перекрёстная регуляция не делает пути тождественными и не означает, что любое воздействие активирует все четыре пути."],"paragraphs":["Рассмотрим условную клетку, в которой три входа управляются независимо: нагрузка на ЭПР, электрофильное воздействие и содержание O₂. Другие киназы eIF2α не активированы, а IRE1α, ATF6, KEAP1, PHD и pVHL работают нормально, пока их не убирает переключатель. Такая система — учебная модель: она показывает канонический качественный результат, а не измерения в определённых клетках.","Для каждого входа причинная цепь своя. Нарушение сворачивания в ЭПР активирует [[T16|PERK]], и фосфорилирование eIF2α усиливает синтез [[T14|ATF4]]; та же нагрузка активирует [[T25|IRE1α]], который вместе с [[T27|RtcB]] образует мРНК XBP1s, с которой синтезируется белок XBP1s, и [[T30|ATF6α]], который после протеолиза в аппарате Гольджи даёт N-концевой фрагмент. Электрофил модифицирует цистеины [[T33|KEAP1]], и распад [[T34|NRF2]] замедляется. При недостатке O₂ [[T52|PHD]] образуют меньше гидроксилированного HIF-α, [[T55|pVHL]] распознаёт меньше молекул, и HIF-α накапливается.","Генетическое выключение звена проверяет его необходимость. Без PERK стресс ЭПР не повышает p-eIF2α в этой системе, но IRE1α и ATF6 активируются собственными путями. Без pVHL HIF-α накапливается и при достаточном O₂, хотя PHD продолжают его гидроксилировать. Каждое такое сравнение отвечает на вопрос об одном звене и при одних условиях.","Между путями есть перекрёстная регуляция: например, PERK может фосфорилировать NRF2, а ATF4 и NRF2 регулируют часть общих генов. Модель эти связи не рассчитывает. Из их существования не следует, что любое воздействие обязательно активирует все четыре пути: при каждом сочетании нужно проверять состояние каждого звена отдельно."],"trap":["Если пути связаны перекрёстной регуляцией, любое стрессовое воздействие активирует все четыре пути сразу.","В этой учебной модели каждому пути задан собственный первичный вход: действие электрофила на сворачивание в ЭПР и влияние недостатка O₂ на KEAP1 не рассчитываются. В клетках перекрёстные связи существуют, а их вклад зависит от условий и проверяется отдельно."],"conditions":"Явно условная система: учебная модель, качественные канонические состояния, без расчёта межпутевых эффектов. Другие киназы eIF2α не активированы; IRE1α, ATF6, KEAP1, PHD и pVHL работают, если не выключены переключателем. Связи путей описаны по обзорам Costa-Mattioli 2020 (ISR), Acosta-Alvear 2025 (UPR), Liu 2022 (KEAP1–NRF2) и Kaelin 2008 (HIF). Фосфорилирование NRF2 киназой PERK показано в клетках млекопитающих при стрессе ЭПР (Cullinan 2003, прочитана аннотация) и в модель не включено.","sources":["Costa2020","Acosta2025","Liu2022","Kaelin2008","Cullinan2003"],"quiz":{"id":"S10-L30","rev":1,"question":"В условной системе стресс ЭПР активировал IRE1 и ATF6, но PERK отсутствует, а другие киназы eIF2α не активированы. Какое сочетание согласуется с этими условиями?","options":[{"id":"S10-L30-1","text":"XBP1s и активный фрагмент ATF6 образуются только после о BP1s и фрагмент ATF6","образуются"],["NRF2","накапливается"],["HIF-α","накапливается"]],"note":"Нарушение сворачивания в ЭПР активирует три ветви: PERK фосфорилирует eIF2α и усиливает синтез ATF4, IRE1α образует мРНК XBP1s, ATF6 после протеолиза в аппарате Гольджи даёт N-концевой фрагмент. Электрофил модифицирует цистеины KEAP1, распад NRF2 замедляется, и NRF2 активирует гены с ARE. Без pVHL HIF-α накапливается при любом содержании O₂: гидроксилированный HIF-α не распознаётся, а снижение O₂ дополнительно уменьшает его гидроксилирование ферментами PHD."},"1-1-1-1-0":{"n":{"er":"on","el":"on","hy":"on","perk":"abs","ire1":"on","atf6":"on","keap":"low","phd":"low","eif":"low","xbp":"on","a6n":"on","nrf2":"on","vhl":"base","atf4":"low","nuc":"on","are":"on","hif":"on"},"e":{"e1":"on","e2":"on","e3":"on","k1":"off","k2":"off","x1":"on","x2":"on","a1":"on","a2":"on","n0":"on","n1":"off","n2":"on","h0":"on","h1":"off","h2":"off"},"b":{},"m":[["ATF4 (через PERK)","не повышен"],["XBP1s и фрагмент ATF6","образуются"],["NRF2","накапливается"],["HIF-α","накапливается"]],"note":"Без PERK p-eIF2α не повышается (другие киназы eIF2α в этой системе не активированы), и синтез ATF4 не усилен; IRE1α и ATF6 при этом активируются собственными путями. Электрофил модифицирует цистеины KEAP1, распад NRF2 замедляется, и NRF2 активирует гены с ARE. При сниженном O₂ PHD образуют меньше гидроксилированного HIF-α, pVHL распознаёт меньше молекул, и HIF-α накапливается."},"1-1-1-1-1":{"n":{"er":"on","el":"on","hy":"on","perk":"abs","ire1":"on","atf6":"on","keap":"low","phd":"low","eif":"low","xbp":"on","a6n":"on","nrf2":"on","vhl":"abs","atf4":"low","nuc":"on","are":"on","hif":"on"},"e":{"e1":"on","e2":"on","e3":"on","k1":"off","k2":"off","x1":"on","x2":"on","a1":"on","a2":"on","n0":"on","n1":"off","n2":"on","h0":"on","h1":"off","h2":"off"},"b":{},"m":[["ATF4 (через PERK)","не повышен"],["XBP1s и фрагмент ATF6","образуются"],["NRF2","накапливается"],["HIF-α","накапливается"]],"note":"Без PERK p-eIF2α не повышается (другие киназы eIF2α в этой системе не активированы), и синтез ATF4 не усилен; IRE1α и ATF6 при этом активируются собственными путями. Электрофил модифицирует цистеины KEAP1, распад NRF2 замедляется, и NRF2 активирует гены с ARE. Без pVHL HIF-α накапливается при любом содержании O₂: гидроксилированный HIF-α не распознаётся, а снижение O₂ дополнительно уменьшает его гидроксилирование ферментами PHD."}},"fs":17,"nfs":14,"lfs":14,"zfs":13,"nlfs":13,"nzfs":13}}}],"sections":[{"title":"ISR: eIF2α и ATF4","entry":"isr","sub":"Как меняется инициация трансляции и избирательно усиливается синтез ATF4"},{"title":"UPR: три ветви ответа ЭПР","entry":"upr","sub":"Как снижается белковая нагрузка и изменяются возможности ЭПР"},{"title":"KEAP1–NRF2","entry":"keap1-nrf2","sub":"Как изменение распада регулятора усиливает защитную транскрипционную программу"},{"title":"PHD–pVHL–HIF","entry":"hif","sub":"Как доступность кислорода регулирует стабильность и действие HIF-α"},{"title":"Исследование","entry":"methods","sub":"Как различить четыре механизма и сопоставить измеряемые величины","integr":true}],"glossary":[{"id":"S10-T01","term":"Интегрированный стрессовый ответ (ISR)","section":0,"def":"Система регуляции трансляции, в которой разные воздействия вызывают фосфорилирование Ser51 в α-субъединице eIF2. В результате инициация трансляции большинства мРНК замедляется, а трансляция некоторых мРНК, например мРНК ATF4, усиливается. ISR не синоним UPR и не общее название любой реакции на повреждение."},{"id":"S10-T02","term":"Ответ на накопление неправильно свёрнутых белков (UPR)","section":0,"def":"Система регуляции, которая перестраивает работу ЭПР, когда белковая нагрузка превышает возможности сворачивания и обработки белков. У млекопитающих включает три ветви — PERK, IRE1α и ATF6. Запускается не только неправильно свёрнутыми белками, но и, например, изменением липидного состава мембраны ЭПР."},{"id":"S10-T03","term":"Эндоплазматический ретикулум (ЭПР)","section":1,"def":"Мембранная система клетки, в просвете которой проходят сворачивание, образование дисульфидных связей, гликозилирование и сборка многих секреторных и мембранных белков; здесь же хранится Ca²⁺. Обозначение «ЭР» в книгах означает то же самое."},{"id":"S10-T04","term":"Белковая нагрузка на ЭПР","section":1,"def":"Поступление в ЭПР белков, которые должны пройти сворачивание, сборку и обработку. Это поток, а не количество неправильно свёрнутых белков, накопленных к определённому моменту."},{"id":"S10-T05","term":"Функциональная ёмкость ЭПР","section":1,"def":"Совокупные возможности ЭПР сворачивать, обрабатывать и удалять белки в данных условиях: шапероны, ферменты сворачивания, Ca²⁺, система ERAD. Не равна объёму ЭПР и не сводится к количеству BiP."},{"id":"S10-T06","term":"Протеостаз","section":1,"def":"Поддержание функционального состава белков клетки за счёт согласования их синтеза, сворачивания, транспорта и удаления. Нарушение протеостаза не всегда проявляется видимыми агрегатами белков."},{"id":"S10-T07","term":"Фактор инициации eIF2","section":0,"def":"Фактор инициации трансляции из трёх субъединиц (α, β, γ). В GTP-связанной форме eIF2 присоединяет инициаторную метионил-тРНК и доставляет её к малой субъединице рибосомы. eIF2 — весь фактор, eIF2α — одна его субъединица."},{"id":"S10-T08","term":"eIF2α и eIF2(αP)","section":0,"def":"eIF2α — α-субъединица eIF2; eIF2(αP) — eIF2, у которого фосфорилирован Ser51 α-субъединицы. В коротких подписях используют обозначение p-eIF2α; его содержание сравнивают с содержанием общего eIF2α."},{"id":"S10-T09","term":"Фактор обмена гуаниновых нуклеотидов eIF2B","section":0,"def":"Фактор обмена гуаниновых нуклеотидов, состоящий из двух копий каждого из пяти типов субъединиц. eIF2B ускоряет освобождение GDP из eIF2·GDP, после чего eIF2 связывает GTP. eIF2B не превращает GDP в GTP и не является киназой; eIF2(αP) подавляет его обменную активность."},{"id":"S10-T10","term":"Тройной комплекс eIF2·GTP·Met-тРНКi","section":0,"def":"Комплекс eIF2·GTP·Met-тРНКi, необходимый для канонической инициации трансляции: он доставляет инициаторную метионил-тРНК к малой субъединице рибосомы. Это не весь преинициаторный комплекс 43S, а лишь его часть."},{"id":"S10-T11","term":"Инициаторная метионил-тРНК","section":0,"def":"Особая тРНК (Met-тРНКi), которая доставляет метионин к старт-кодону в начале синтеза полипептида. Метионин внутри полипептидной цепи включают другие молекулы метионил-тРНК — элонгаторные."},{"id":"S10-T12","term":"Открытая рамка считывания, начинающаяся перед основной рамкой (uORF)","section":0,"def":"Короткая открытая рамка считывания в 5′-области мРНК, старт-кодон которой расположен перед старт-кодоном основной рамки. uORF может заканчиваться до основной рамки или перекрывать её в другой рамке считывания. В мРНК ATF4 uORF1 позволяет повторную инициацию, а uORF2 препятствует трансляции ATF4; не все uORF подавляют трансляцию."},{"id":"S10-T13","term":"Повторная инициация трансляции (реинициация)","section":0,"def":"Начало трансляции следующей рамки после завершения предыдущей короткой рамки, когда малая субъединица рибосомы остаётся на мРНК, продолжает сканирование и вновь присоединяет тройной комплекс. Это не то же самое, что пропуск старт-кодона со слабым окружением при первом сканировании."},{"id":"S10-T14","term":"ATF4","section":0,"def":"Транскрипционный фактор семейства bZIP. При ISR трансляция его мРНК избирательно усиливается благодаря двум uORF в 5′-области; синтезированный ATF4 в ядре усиливает транскрипцию генов синтеза и переноса аминокислот, GADD34, CHOP и других. Усиление трансляции ATF4 и транскрипция его мишеней — разные этапы."},{"id":"S10-T15","term":"GCN2 (EIF2AK4)","section":0,"def":"Киназа eIF2α (ген EIF2AK4), которая активируется при недостатке аминокислот: её регуляторный домен связывает незаряженные тРНК; в активации участвуют и рибосомы. GCN2 есть и у дрожжей, где она служит единственной киназой eIF2α."},{"id":"S10-T16","term":"PERK (EIF2AK3)","section":0,"def":"Трансмембранная киназа ЭПР (ген человека EIF2AK3): её люминальный домен воспринимает нарушение сворачивания белков в ЭПР, а цитозольный киназный домен фосфорилирует Ser51 eIF2α. PERK — одновременно вход ISR и одна из трёх ветвей UPR."},{"id":"S10-T17","term":"PKR (EIF2AK2)","section":0,"def":"Киназа eIF2α (ген EIF2AK2), которую канонически активирует двухцепочечная РНК, в том числе образующаяся при репликации вирусов. Синтетическая двухцепочечная РНК poly(I:C) в экспериментах воспроизводит лишь этот сигнал, а не все события вирусной инфекции."},{"id":"S10-T18","term":"HRI (EIF2AK1)","section":0,"def":"Киназа eIF2α (ген EIF2AK1), которую ингибирует связанный гем: при недостатке гема HRI активируется, прежде всего в эритроидных клетках. HRI активируется и другими воздействиями, в частности фрагментом белка DELE1 при нарушении работы митохондрий (путь OMA1–DELE1–HRI)."},{"id":"S10-T19","term":"GADD34 (PPP1R15A)","section":0,"def":"Регуляторная субъединица протеинфосфатазы 1 (ген PPP1R15A), синтез которой индуцируется при ISR, в том числе с участием ATF4. GADD34 направляет PP1 к eIF2(αP); комплекс отщепляет фосфат от Ser51. Сам GADD34 не обладает ни фосфатазной, ни киназной активностью."},{"id":"S10-T20","term":"CReP (PPP1R15B)","section":0,"def":"Регуляторная субъединица протеинфосфатазы 1 (ген PPP1R15B), которая образуется преимущественно постоянно и обеспечивает фоновое дефосфорилирование eIF2α. В отличие от GADD34, CReP не требует индукции стрессом."},{"id":"S10-T21","term":"PP1","section":0,"def":"Протеинфосфатаза 1 — фермент, отщепляющий фосфатные группы от остатков серина и треонина. Какой белок дефосфорилирует PP1, во многом зависит от регуляторной субъединицы; дефосфорилирование eIF2α выполняют комплексы PP1 с GADD34 или CReP."},{"id":"S10-T22","term":"CHOP (DDIT3)","section":0,"def":"Транскрипционный регулятор семейства C/EBP (ген DDIT3), синтез которого повышается при длительном ISR и стрессе ЭПР. При сохраняющемся нарушении CHOP может способствовать экспрессии генов, участвующих в апоптозе, но наличие CHOP само по себе не доказывает гибели клетки."},{"id":"S10-T23","term":"ISRIB","section":0,"def":"Синтетическая малая молекула, которая связывается с eIF2B и делает его малочувствительным к eIF2(αP). ISRIB восстанавливает трансляцию при умеренном ISR, но не при высокой доле eIF2(αP); он не ингибирует киназы eIF2α и не дефосфорилирует eIF2α."},{"id":"S10-T24","term":"BiP (HSPA5, GRP78)","section":1,"def":"Шаперон семейства Hsp70 в просвете ЭПР (ген HSPA5, другое название GRP78); связывает развёрнутые участки белков и участвует в регуляции сенсоров UPR. Изменение его связывания с сенсорами — не единственный механизм их активации: развёрнутые белки могут связываться с IRE1α и PERK непосредственно."},{"id":"S10-T25","term":"IRE1α (ERN1)","section":1,"def":"Трансмембранный белок ЭПР (продукт гена ERN1) с люминальным доменом, воспринимающим стресс ЭПР, и цитозольными киназным и эндорибонуклеазным (РНКазным) доменами. Разрезает мРНК XBP1 и другие РНК, но не соединяет экзоны."},{"id":"S10-T26","term":"XBP1u и XBP1s","section":1,"def":"Несплайсированная (XBP1u) и сплайсированная (XBP1s) формы мРНК XBP1, а также белки, которые они кодируют. Белок XBP1s — активный транскрипционный фактор генов белков ЭПР; белок XBP1u нестабилен и ограничивает ответ. В тексте всегда указано, идёт речь о мРНК или о белке."},{"id":"S10-T27","term":"РНК-лигаза RtcB","section":1,"def":"Фермент, соединяющий 5′- и 3′-части мРНК XBP1 после того, как IRE1α вырежет интрон (у млекопитающих; работает с кофактором археазой). Без RtcB мРНК XBP1s не образуется, хотя IRE1α активен."},{"id":"S10-T28","term":"Неканонический сплайсинг XBP1","section":1,"def":"Удаление короткого интрона из мРНК XBP1 в цитозоле: IRE1α разрезает мРНК в двух местах, РНК-лигаза RtcB соединяет её части. Идёт без сплайсосомы и отличается от канонического сплайсинга пре-мРНК сплайсосомой в ядре."},{"id":"S10-T29","term":"Регулируемое IRE1-зависимое разрушение РНК (RIDD)","section":1,"def":"Регулируемое IRE1-зависимое разрушение РНК: IRE1α расщепляет определённые РНК, кроме мРНК XBP1, и их содержание снижается. Это отдельный выход IRE1α, а не другое название сплайсинга XBP1 и не обязательный сигнал гибели клетки."},{"id":"S10-T30","term":"ATF6α и его N-концевой фрагмент","section":1,"def":"ATF6α — мембранный белок ЭПР (около 90 кДа), N-концевая часть которого содержит bZIP-домен транскрипционного фактора. После расщепления в аппарате Гольджи освобождается N-концевой фрагмент ATF6f (около 50 кДа), который регулирует транскрипцию в ядре. Полноразмерный белок и фрагмент — разные формы."},{"id":"S10-T31","term":"Протеазы S1P и S2P","section":1,"def":"Протеазы аппарата Гольджи: S1P расщепляет ATF6α со стороны просвета, затем S2P — внутри мембраны, и освобождается ATF6f. Те же протеазы активируют транскрипционные факторы SREBP. В ЭПР и в свободном цитозоле ATF6α они не расщепляют."},{"id":"S10-T32","term":"Деградация, связанная с ЭПР (ERAD)","section":1,"def":"Деградация, связанная с ЭПР: дефектный белок распознаётся в ЭПР, переносится через мембрану в цитозоль, убиквитинируется и разрушается протеасомой. Отличается от повторного сворачивания (белок остаётся в ЭПР) и от ER-фагии (части ЭПР разрушаются в лизосомах)."},{"id":"S10-T33","term":"KEAP1","section":2,"def":"Белок, который связывает NRF2 доменом Kelch и служит субстратным адаптером убиквитинлигазного комплекса с CUL3 и RBX1. Цистеины KEAP1 модифицируются электрофилами и окислителями, после чего убиквитинирование NRF2 ослабевает. KEAP1 — не пассивный «якорь» в цитоплазме и не протеаза."},{"id":"S10-T34","term":"NRF2 (продукт NFE2L2)","section":2,"def":"Транскрипционный фактор семейства bZIP, продукт гена NFE2L2. В комплексе с малым Maf связывается с ARE и усиливает транскрипцию генов защиты от электрофилов и окислителей. Не путать с ядерным респираторным фактором 2 (NRF-2, GABP), регулирующим гены митохондриальных белков."},{"id":"S10-T35","term":"Электрофил","section":2,"def":"Соединение или частица, способные принимать электронную пару при образовании химической связи; с тиоловыми группами цистеинов электрофилы образуют ковалентные соединения. Электрофил — не синоним свободного радикала, пероксида или любого окислителя."},{"id":"S10-T36","term":"Тиоловая группа цистеина","section":2,"def":"Группа –SH боковой цепи остатка цистеина. Вступает в ковалентные реакции с электрофилами и окисляется окислителями, например с образованием дисульфидов. Модификация цистеина KEAP1 меняет функцию белка, но не обязательно разрушает его комплекс с NRF2."},{"id":"S10-T37","term":"Комплекс KEAP1–CUL3–RBX1","section":2,"def":"Убиквитинлигазный комплекс семейства куллин-RING: KEAP1 распознаёт NRF2, куллин CUL3 служит каркасом, RBX1 обеспечивает перенос убиквитина. Один KEAP1 полной убиквитинлигазой не является."},{"id":"S10-T38","term":"Убиквитинирование","section":2,"def":"Ковалентное присоединение убиквитина к белку или к уже присоединённому убиквитину с образованием цепи. Не всякое убиквитинирование ведёт к разрушению; в этом разделе рассматриваются цепи, направляющие белок в протеасому."},{"id":"S10-T39","term":"Протеасомная деградация","section":2,"def":"Расщепление белка протеасомой после того, как он помечен цепью убиквитина и распознан. Содержание белка и скорость его разрушения — разные величины: при постоянном синтезе замедление разрушения повышает содержание."},{"id":"S10-T40","term":"Малые Maf-белки","section":2,"def":"Небольшие белки MafF, MafG и MafK семейства bZIP, не имеющие собственного домена активации транскрипции. Образуют гетеродимеры с NRF2 и другими факторами, в том числе с репрессором BACH1, и связываются с регуляторными последовательностями ДНК. Партнёр NRF2 — малый Maf, а не ARNT (партнёр HIF-α)."},{"id":"S10-T41","term":"Элемент антиоксидантного ответа (ARE)","section":2,"def":"Регуляторная последовательность ДНК в промоторах и энхансерах генов-мишеней, с которой связывается гетеродимер NRF2–малый Maf. ARE — участок ДНК, а не белок и не показатель окислительного повреждения; его не следует путать с HRE, с которым связывается комплекс HIF."},{"id":"S10-T42","term":"p62/SQSTM1","section":2,"def":"Рецептор селективной аутофагии, связывающий убиквитинированные грузы и белок LC3. Мотивом KIR связывается с доменом Kelch белка KEAP1 и мешает связыванию NRF2; ген SQSTM1 — мишень NRF2. Высокое содержание p62 может отражать и усиленный синтез, и нарушенное удаление; универсальным субстратом KEAP1 p62 не является."},{"id":"S10-T43","term":"GSH и GSSG","section":2,"def":"Восстановленная (GSH) и окисленная, дисульфидная (GSSG) формы глутатиона — трипептида γ-глутамилцистеинилглицина. Две молекулы GSH окисляются в одну GSSG. Отношение форм, общее содержание глутатиона и скорость его обновления — разные величины."},{"id":"S10-T44","term":"NADPH","section":2,"def":"Восстановленная форма NADP⁺, донор электронов для восстановительных реакций биосинтеза и для восстановления GSSG глутатионредуктазой и тиоредоксина тиоредоксинредуктазой. NADPH и NADH — разные коферменты, и в этих реакциях один не заменяет другой."},{"id":"S10-T45","term":"NQO1","section":2,"def":"NAD(P)H:хиноноксидоредуктаза 1 — фермент, восстанавливающий хиноны; один из часто используемых показателей NRF2-зависимой программы. Количество мРНК NQO1, количество белка и его активность — разные величины."},{"id":"S10-T46","term":"GCLC и GCLM","section":2,"def":"Каталитическая (GCLC) и модифицирующая (GCLM) субъединицы глутамат-цистеин-лигазы — фермента первой стадии синтеза глутатиона. Их гены — мишени NRF2. Это ферментные субъединицы, а не сам глутатион."},{"id":"S10-T47","term":"TXNRD1","section":2,"def":"Тиоредоксинредуктаза 1 — фермент, восстанавливающий окисленный тиоредоксин за счёт NADPH; один из конкретных эффекторов NRF2-зависимой программы, а не обобщённый «антиоксидантный белок»."},{"id":"S10-T48","term":"HMOX1 и гемоксигеназа-1 (HO-1)","section":2,"def":"HMOX1 — ген, гемоксигеназа-1 (HO-1) — его белковый продукт, расщепляющий гем до биливердина, Fe²⁺ и CO. Транскрипцию HMOX1 регулирует не только NRF2 (например, и репрессор BACH1), поэтому рост HMOX1 не является ни исключительно NRF2-зависимым показателем, ни признаком защиты от любого повреждения."},{"id":"S10-T49","term":"HIF","section":3,"def":"Факторы, индуцируемые гипоксией, — семейство транскрипционных регуляторов. Комплексы HIF-1 и HIF-2 образованы регулируемой α-субъединицей и β-субъединицей ARNT; они связываются с элементами ответа на гипоксию (HRE) и активируют транскрипцию генов-мишеней. У HIF-3α есть функционально различные варианты, в том числе ингибирующие действие HIF-1. HIF-α — субъединица, а не весь комплекс."},{"id":"S10-T50","term":"HIF-1α и HIF-2α","section":3,"def":"Две наиболее изученные α-субъединицы HIF человека — продукты генов HIF1A и EPAS1. Обе регулируются гидроксилированием и pVHL-зависимым распадом, но активируют частично разные наборы генов и по-разному представлены в тканях: например, физиологическая регуляция эритропоэтина связана преимущественно с HIF-2."},{"id":"S10-T51","term":"ARNT/HIF-1β","section":3,"def":"β-Субъединица комплекса HIF (её называют также HIF-1β); в клетке присутствует постоянно, и её содержание мало зависит от O₂. Без α-субъединицы активного комплекса HIF нет. ARNT образует комплексы и с другими белками, например с рецептором ароматических углеводородов AHR."},{"id":"S10-T52","term":"Пролилгидроксилазы HIF (PHD)","section":3,"def":"Ферменты PHD1–3 (продукты генов EGLN), которые гидроксилируют определённые остатки пролина в HIF-α. Это Fe(II)- и 2-оксоглутарат-зависимые диоксигеназы: O₂ и 2-оксоглутарат расходуются в реакции, а Fe(II) находится в активном центре. Сокращение PHD здесь не означает пируватдегидрогеназу."},{"id":"S10-T53","term":"PHD1/EGLN2, PHD2/EGLN1, PHD3/EGLN3","section":3,"def":"Соответствие названий белков и генов человека: PHD1 — EGLN2, PHD2 — EGLN1, PHD3 — EGLN3; номера не совпадают. В клетках человека основную роль в поддержании низкого содержания HIF-1α при нормоксии играет PHD2; вклад PHD1 и PHD3 зависит от клеток."},{"id":"S10-T54","term":"2-Оксоглутарат (α-кетоглутарат)","section":3,"def":"Промежуточный продукт цикла трикарбоновых кислот (синоним — α-кетоглутарат). В реакции PHD и FIH он расходуется: окислительно декарбоксилируется до сукцината и CO₂, а один атом O₂ входит в сукцинат. Близкие по строению сукцинат и фумарат при накоплении могут тормозить PHD. В экспериментах с очищенными человеческими ферментами они ингибировали PHD1–3, но не FIH (Koivunen 2007)."},{"id":"S10-T55","term":"pVHL","section":3,"def":"Белковый продукт гена-супрессора опухолей VHL (VHL — ген, pVHL — белок). В составе E3-комплекса pVHL связывает HIF-α, гидроксилированный по остаткам пролина, и обеспечивает его убиквитинирование. Сам pVHL HIF-α не гидроксилирует."},{"id":"S10-T56","term":"Комплекс pVHL–элонгины B/C–CUL2–RBX1","section":3,"def":"Убиквитинлигазный комплекс, в котором pVHL связывает субстрат, элонгины B и C соединяют его с куллином CUL2, а RBX1 привлекает фермент, несущий активированный убиквитин. Комплекс присоединяет к гидроксилированному HIF-α цепь убиквитина, после чего белок разрушается протеасомой. CUL2 этого комплекса и CUL3 комплекса с KEAP1 — разные белки."},{"id":"S10-T57","term":"Пролилгидроксилирование HIF-α","section":3,"def":"Присоединение гидроксильной группы к атому C4 определённых остатков пролина HIF-α с образованием 4-гидроксипролина; реакцию катализируют PHD. В HIF-1α человека это Pro402 и Pro564; у HIF-2α номера остатков другие. Модификация создаёт участок, который распознаёт pVHL."},{"id":"S10-T58","term":"FIH","section":3,"def":"Фактор, подавляющий HIF (factor inhibiting HIF), — Fe(II)- и 2-оксоглутарат-зависимая гидроксилаза, которая модифицирует остаток аспарагина в C-концевом домене активации HIF-α (Asn803 в HIF-1α человека). Гидроксилированный аспарагин препятствует связыванию коактиваторов p300/CBP, но не направляет HIF-α к распаду."},{"id":"S10-T59","term":"Коактиваторы p300/CBP","section":3,"def":"Белки-коактиваторы транскрипции, которые связываются с доменами активации многих транскрипционных факторов, в том числе с C-концевым доменом HIF-α, если Asn803 не гидроксилирован. Они участвуют в усилении транскрипции генов-мишеней и не участвуют в распознавании HIF-α для распада."},{"id":"S10-T60","term":"Элемент ответа на гипоксию (HRE)","section":3,"def":"Участок ДНК в регуляторной области гена, с которым связывается комплекс HIF-α–ARNT; содержит основную последовательность 5′-RCGTG-3′. Для ответа обычно нужны и соседние участки связывания других белков. HRE — не то же, что элемент антиоксидантного ответа ARE, с которым связывается NRF2."},{"id":"S10-T61","term":"Гипоксия и реоксигенация","section":3,"def":"Гипоксия — доступность кислорода, недостаточная для рассматриваемой системы (культуры, ткани, органа); реоксигенация — последующее восстановление этой доступности. Содержание O₂ в газовой фазе, у самих клеток и в тканях различается, поэтому 21 % O₂ в инкубаторе не является универсальной нормой для клеток организма."},{"id":"S10-T62","term":"Псевдогипоксический ответ","section":3,"def":"Активация части гипоксической регуляции при достаточном O₂, например при потере pVHL или при накоплении сукцината или фумарата, тормозящих PHD. Для каждого случая указывают конкретную причину. Это не синоним эффекта Варбурга — усиленного превращения глюкозы в лактат при доступном кислороде."},{"id":"S10-T63","term":"Киназа пируватдегидрогеназы 1 (PDK1)","section":3,"def":"Киназа пируватдегидрогеназы 1 (ген PDK1): фосфорилирует и подавляет пируватдегидрогеназный комплекс, поэтому пируват реже превращается в ацетил-CoA. Её ген — одна из мишеней HIF-1. Не путать с PDPK1 (3-фосфоинозитид-зависимой киназой 1) пути PI3K–AKT, которую тоже сокращают как PDK1."},{"id":"S10-T64","term":"Содержание, доля модификации и активность","section":3,"def":"Три разные величины. Содержание — количество белка в образце; доля модификации — отношение числа молекул с данной модификацией к общему числу молекул этого белка; активность — его функция в заданных условиях, например скорость катализируемой реакции или способность активировать транскрипцию. Одно не следует из другого, поэтому вместо общего слова «уровень» называют конкретную величину."}],"sources":{"Costa2020":{"url":"https://doi.org/10.1126/science.aat5314","cite":"Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.","doi":"10.1126/science.aat5314","pmid":""},"Wek2023":{"url":"https://doi.org/10.1089/ars.2022.0123","cite":"Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.","doi":"10.1089/ars.2022.0123","pmid":""},"Acosta2025":{"url":"https://doi.org/10.1038/s41580-024-00794-0","cite":"Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.","doi":"10.1038/s41580-024-00794-0","pmid":""},"Wiseman2022":{"url":"https://doi.org/10.1016/j.molcel.2022.03.025","cite":"Wiseman R.L., Mesgarzadeh J.S., Hendershot L.M. Reshaping Endoplasmic Reticulum Quality Control Through the Unfolded Protein Response. Mol Cell. 2022.","doi":"10.1016/j.molcel.2022.03.025","pmid":""},"Liu2022":{"url":"https://doi.org/10.1016/j.redox.2022.102389","cite":"Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.","doi":"10.1016/j.redox.2022.102389","pmid":""},"Ulasov2022":{"url":"https://doi.org/10.1016/j.lfs.2021.120111","cite":"Ulasov A.V. et al. Nrf2/Keap1/ARE signaling: Towards specific regulation. Life Sci. 2022;291:120111; online 2021.","doi":"10.1016/j.lfs.2021.120111","pmid":""},"Ryoo2024":{"url":"https://doi.org/10.1016/j.jbc.2024.107151","cite":"Ryoo H.D. The integrated stress response in metabolic adaptation. J Biol Chem. 2024.","doi":"10.1016/j.jbc.2024.107151","pmid":""},"Kaelin2008":{"url":"https://doi.org/10.1016/j.molcel.2008.04.009","cite":"Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.","doi":"10.1016/j.molcel.2008.04.009","pmid":""},"Vattem2004":{"url":"https://doi.org/10.1073/pnas.0400541101","cite":"Vattem KM., Wek RC. Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells. Proc Natl Acad Sci U S A. 2004;101:11269–74.","doi":"10.1073/pnas.0400541101","pmid":""},"Lu2004":{"url":"https://doi.org/10.1083/jcb.200408003","cite":"Lu PD. et al. Translation reinitiation at alternative open reading frames regulates gene expression in an integrated stress response. J Cell Biol. 2004;167:27–33.","doi":"10.1083/jcb.200408003","pmid":""},"Novoa2001":{"url":"https://doi.org/10.1083/jcb.153.5.1011","cite":"Novoa I. et al. Feedback inhibition of the unfolded protein response by GADD34-mediated dephosphorylation of eIF2alpha. J Cell Biol. 2001;153:1011–22.","doi":"10.1083/jcb.153.5.1011","pmid":""},"Jousse2003":{"url":"https://doi.org/10.1083/jcb.200308075","cite":"Jousse C. et al. Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells. J Cell Biol. 2003;163:767–75.","doi":"10.1083/jcb.200308075","pmid":""},"Guo2020":{"url":"https://doi.org/10.1038/s41586-020-2078-2","cite":"Guo X. et al. Mitochondrial stress is relayed to the cytosol by an OMA1-DELE1-HRI pathway. Nature. 2020;579:427–432.","doi":"10.1038/s41586-020-2078-2","pmid":""},"Delepine2000":{"url":"https://doi.org/10.1038/78085","cite":"Delépine M. et al. EIF2AK3, encoding translation initiation factor 2-alpha kinase 3, is mutated in patients with Wolcott-Rallison syndrome. Nat Genet. 2000;25:406–9.","doi":"10.1038/78085","pmid":""},"Harding1999":{"url":"https://doi.org/10.1038/16729","cite":"Harding HP. et al. Protein translation and folding are coupled by an endoplasmic-reticulum-resident kinase. Nature. 1999;397:271–4.","doi":"10.1038/16729","pmid":""},"Calfon2002":{"url":"https://doi.org/10.1038/4 url":"https://doi.org/10.1093/emboj/cdg392","cite":"Berra E., Benizri E., Ginouvès A., Volmat V., Roux D., Pouysségur J. HIF prolyl-hydroxylase 2 is the key oxygen sensor setting low steady-state levels of HIF-1α in normoxia. EMBO J. 2003;22:4082–4090.","doi":"10.1093/emboj/cdg392","pmid":"12912907"},"Masson2001":{"url":"https://doi.org/10.1093/emboj/20.18.5197","cite":"Masson N., Willam C., Maxwell P. H., Pugh C. W., Ratcliffe P. J. Independent function of two destruction domains in hypoxia-inducible factor-α chains activated by prolyl hydroxylation. EMBO J. 2001;20:5197–5206.","doi":"10.1093/emboj/20.18.5197","pmid":"11566883"},"Selak2005":{"url":"https://doi.org/10.1016/j.ccr.2004.11.022","cite":"Selak M. A., Armour S. M., MacKenzie E. D. et al. Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-α prolyl hydroxylase. Cancer Cell. 2005;7:77–85.","doi":"10.1016/j.ccr.2004.11.022","pmid":"15652751"},"Isaacs2005":{"url":"https://doi.org/10.1016/j.ccr.2005.06.017","cite":"Isaacs J. S., Jung Y. J., Mole D. R. et al. HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability. Cancer Cell. 2005;8:143–153.","doi":"10.1016/j.ccr.2005.06.017","pmid":"16098467"},"Kim2006":{"url":"https://doi.org/10.1016/j.cmet.2006.02.002","cite":"Kim J. W., Tchernyshyov I., Semenza G. L., Dang C. V. HIF-1-mediated expression of pyruvate dehydrogenase kinase: a metabolic switch required for cellular adaptation to hypoxia. Cell Metab. 2006;3:177–185.","doi":"10.1016/j.cmet.2006.02.002","pmid":"16517405"},"Semenza1996":{"url":"https://doi.org/10.1074/jbc.271.51.32529","cite":"Semenza G. L., Jiang B. H., Leung S. W. et al. Hypoxia response elements in the aldolase A, enolase 1, and lactate dehydrogenase A gene promoters contain essential binding sites for hypoxia-inducible factor 1. J Biol Chem. 1996;271:32529–32537.","doi":"10.1074/jbc.271.51.32529","pmid":"8955077"},"Forsythe1996":{"url":"https://doi.org/10.1128/MCB.16.9.4604","cite":"Forsythe J. A., Jiang B. H., Iyer N. V. et al. Activation of vascular endothelial growth factor gene transcription by hypoxia-inducible factor 1. Mol Cell Biol. 1996;16:4604–4613.","doi":"10.1128/MCB.16.9.4604","pmid":"8756616"},"Raval2005":{"url":"https://doi.org/10.1128/MCB.25.13.5675-5686.2005","cite":"Raval R. R., Lau K. W., Tran M. G. B. et al. Contrasting properties of hypoxia-inducible factor 1 (HIF-1) and HIF-2 in von Hippel-Lindau-associated renal cell carcinoma. Mol Cell Biol. 2005;25:5675–5686.","doi":"10.1128/MCB.25.13.5675-5686.2005","pmid":"15964822"},"Cullinan2003":{"url":"https://doi.org/10.1128/MCB.23.20.7198-7209.2003","cite":"Cullinan S. B. et al. Nrf2 is a direct PERK substrate and effector of PERK-dependent cell survival. Mol Cell Biol. 2003;23:7198–7209.","doi":"10.1128/MCB.23.20.7198-7209.2003","pmid":"14517290"}},"questions":["Интегрированный стрессовый ответ: фосфорилирование eIF2α и избирательное усиление трансляции ATF4","Три ветви UPR при несоответствии белковой нагрузки и ёмкости ЭПР","KEAP1-NRF2: сенсор электрофилов на цистеиновых остатках и транскрипционная программа редокс-адаптации","Кислород-зависимая деградация HIF-α: пролилгидроксилазы PHD и убиквитинлигазный комплекс с pVHL"],"exam_ids":["isr","eif2b","atf4-uorf","isr-feedback","upr","upr-perk","ire1-xbp1","ire1-ridd","keap1-cysteines","nrf2-transcription","phd","fih"],"practice_url":"seminar-10.html","open_questions":[{"q":"Как фосфорилирование eIF2α меняет общую и избирательную трансляцию? В клетках млекопитающих активирована PKR. Содержание eIF2B и количество мРНК ATF4 не изменились; доступность тройного комплекса умеренно снизилась. Объясните, как эти условия могут одновременно уменьшить общую инициацию трансляции и усилить синтез ATF4. Затем проследите действие обратной связи через GADD34–PP1. Почему устранение PERK не отменяет заданный ответ и почему эффект ISRIB не требует дефосфорилирования eIF2α?","crit":"Различены eIF2 и его α-субъединица; назван Ser51. eIF2B определён как фактор обмена GDP на GTP, а не фермент превращения GDP в GTP. Снижение обменной активности связано с уменьшением доступности eIF2·GTP·Met-тРНКi. После uORF1 часть малых субчастиц продолжает сканирование; задержанное присоединение комплекса меняет выбор между ингибирующей uORF2 и основной рамкой ATF4. Показано перекрывание основной рамки uORF2 и оговорена умеренная сила ISR. Трансляция ATF4 отделена от транскрипции его мишеней. GADD34 названа регуляторной субъединицей PP1; объяснена отрицательная обратная связь. PKR может действовать без PERK. ISRIB действует на eIF2B, поэтому восстановление трансляции возможно без уменьшения p-eIF2α. Усиление ATF4 не распространяется автоматически на любые мРНК с uORF."},{"q":"Какие разные молекулярные события связывают стресс ЭПР с ядром? В клетке млекопитающего при прежней скорости поступления секреторных белков снизились возможности их сворачивания. Объясните три канонические ветви UPR. Затем разберите два независимых воздействия: в первой условной системе сохранено разрезание мРНК XBP1, но отсутствует РНК-лигазная активность RtcB; во второй ATF6α достигает аппарата Гольджи, но не расщепляется S1P/S2P. Какие продукты перестанут образовываться по соответствующим путям? Почему эти воздействия не равнозначны выключению PERK и почему высокий p-eIF2α сам по себе не доказывает активации всех ветвей UPR?","crit":"Функциональная ёмкость ЭПР объяснена через сворачивание и обработку, а не через один его объём. Для PERK названы цитозольный киназный домен, eIF2α, eIF2B и снижение общей инициации. Для IRE1α разделены два разреза мРНК XBP1 и соединение экзонов RtcB; 26 нуклеотидов отнесены к XBP1 млекопитающих. Для ATF6 показаны перенос в аппарат Гольджи, последовательный протеолиз и освобождение N-концевого транскрипционного фрагмента. При блокаде лигирования не завершается каноническое образование мРНК XBP1s; при блокаде протеолиза не образуется новый активный фрагмент ATF6. Предполагаются острое воздействие и сохранение остальных компонентов; отсроченные последствия потери RtcB для других РНК отдельно не моделируются. Не предполагается одновременное исчезновение всех выходов UPR. BiP описан как участник регуляции, а его отделение — как неполная универсальная модель активации сенсоров. Для RIDD и CHOP не заявлен неизбежный апоптоз."},{"q":"Как электрофильное воздействие меняет устойчивость NRF2 и работу его мишеней? В исходно стационарной клеточной системе после действия электрофила синтез NRF2 остаётся прежним, а KEAP1-зависимое убиквитинирование уменьшается. Остальные пути распада не изменены. Связывание части NRF2 с KEAP1 сохраняется. Объясните, почему содержание NRF2 может возрасти, как это изменение связано с комплексом NRF2–малый Maf–ARE и почему сам NRF2 не катализирует восстановление пероксидов. Включите в объяснение GSH/GSSG и NADPH. Затем сравните кратковременное воздействие с устойчивой потерей функции KEAP1 в опухолевой клетке.","crit":"KEAP1 определён как цистеинсодержащий сенсор и субстратный адаптер комплекса CUL3–RBX1. Содержание белка связано с соотношением синтеза и распада. Сохранённое физическое взаимодействие отделено от продуктивного убиквитинирования; не требуется обязательная полная диссоциация каждой пары KEAP1–NRF2. Цистеиновые остатки и характер действия зависят от индуктора; Cys151 не помещён в тот же домен, что Cys273/Cys288. Ядерная локализация, связывание ДНК, изменение транскрипции и образование ферментов показаны как разные этапы. Различены реакция глутатионпероксидазы и NADPH-зависимое восстановление GSSG глутатионредуктазой. p62 может замыкать положительную связь с NRF2, но накопление p62 не объявлено само по себе усилением аутофагического потока. Краткий адаптивный ответ не отождествлён с постоянной программой опухолевой клетки. Повышение HMOX1 не считается доказательством единственного регулятора."},{"q":"Как кислород регулирует стабильность HIF-1α и его взаимодействие с коактиваторами? Рассмотрите HIF-1α человека. В первой системе кислорода достаточно, PHD активны, но pVHL отсутствует. Во второй pVHL сохранён, а образование новых гидроксилированных форм HIF-1α ограничено недостатком O₂. Объясните, почему HIF-1α может накапливаться в обеих системах и чем различается судьба гидроксилированного субстрата. Отдельно сравните два состояния с одинаковым содержанием HIF-1α, но разным гидроксилированием Asn803. Что изменится после восстановления O₂ и почему РНК-мишени не обязаны исчезнуть одновременно с HIF-1α?","crit":"Названы O₂ и 2-оксоглутарат как расходуемые субстраты PHD, Fe(II) как каталитический компонент и поддерживающая роль аскорбата. Для HIF-1α человека указаны Pro402/Pro564; гидроксилирование отделено от распознавания pVHL в E3-комплексе с CUL2. Отсутствие pVHL не исключает образования Pro-OH и не означает отсутствия всех путей распада HIF. Ограничение гидроксилирования не требует удаления ранее присоединённых групп с тех же молекул. Для FIH назван остаток аспарагина Asn803 и ограничение связывания p300/CBP C-концевым доменом; это не та же метка, которую распознаёт pVHL. HIF-α отделён от полного комплекса с ARNT. При реоксигенации гидроксилирование и каноническое удаление возобновляются при сохранённых компонентах, а РНК-мишени обновляются со своими скоростями. Не заданы универсальные проценты O₂ и сроки. Физиологическую регуляцию EPO связывают преимущественно с HIF-2 в соответствующих тканях; PDK1 обозначает киназу пируватдегидрогеназы."}]};

/* ---------- порядок вариантов: перемешивается при открытии страницы; ?fixed — постоянный порядок ---------- */
const params = new URLSearchParams(location.search);
const FIXQ = params.has('fixed') ? '?fixed' : '';  /* сем. 7 v3.8 (аудит A09): ссылки на практикум сохраняют ?fixed */
const SHUFFLE = !params.has('fixed') && (/^https?:$/.test(location.protocol) || params.has('shuffle'));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedParam = params.get('shuffle');
const rand = seedParam && /^\d+$/.test(seedParam) ? mulberry(Number(seedParam)) : Math.random;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ORDER = {};
const optionOrder = l => ORDER[l.id] || (ORDER[l.id] = SHUFFLE ? shuffled(l.quiz.options.map(o => o.id)) : l.quiz.options.map(o => o.id));
const optById = (l, id) => l.quiz.options.find(o => o.id === id);
const EXAM_IDS = SHUFFLE ? shuffled(CONTENT.exam_ids) : CONTENT.exam_ids.slice();
const LETTERS = ['А', 'Б', 'В'];

/* ---------- примитивы схем ---------- */
const small = () => window.matchMedia('(max-width:760px)').matches;
const svg = (body, title, h = 260, w = 640, desc = '') => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${desc ? `<desc>${esc(desc)}</desc>` : ''}${body}</svg>`;
const tx = (x, y, s, size = 17, anchor = 'middle', cls = '') => `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const circ = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const rect = (x, y, w, h, fill, rx = 8, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11, d1 = a + 2.6, d2 = a - 2.6;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {
  const a = Math.atan2(y2 - y1, x2 - x1), px = -Math.sin(a) * 9, py = Math.cos(a) * 9;
  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};
const cross = (x, y, c = '#ae3347') => line(x - 9, y - 9, x + 9, y + 9, c, 4) + line(x - 9, y + 9, x + 9, y - 9, c, 4);
const box = (x, y, w, h, label, {fill = '#fff', stroke = '#6d8ba5', color = '#152c45', size = 17, dash = '', sw = 2, rx = 9} = {}) => {
  const lines = String(label).split('\n'), lh = size * 1.2, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` +
    (label !== '' ? lines.map((t, i) => tx(x + w / 2, y0 + i * lh, t, size, 'middle').replace('<text ', `<text style="fill:${color}" `)).join('') : '');
};
const buttonGroup = (id, opts, selected = 0, label = '') => `<div class="grp">${label ? `<span class="grp-label" id="${id}-l">${esc(label)}</span>` : ''}<div class="chips" id="${id}" role="group"${label ? ` aria-labelledby="${id}-l"` : ''}>${opts.map((x, i) => `<button data-choice="${i}" aria-pressed="${i === selected}">${esc(x)}</button>`).join('')}</div></div>`;
const slider = (id, label, min, max, value, step = 1, unit = '') => `<label for="${id}">${esc(label)}<output id="${id}-value">${value}${unit}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${esc(unit)}"></label>`;
const select = (id, label, opts, value = 0) => `<label for="${id}">${esc(label)}<select id="${id}">${opts.map((x, i) => `<option value="${i}"${i === value ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
const check = (id, label, on) => `<label class="chk" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> <span>${esc(label)}</span></label>`;
const metric = (label, value) => `<div>${esc(label)}<strong>${esc(value)}</strong></div>`;
const result = s => `<div class="result">${s}</div>`;
const tbl = (head, rows, cls = '') => `<div class="table-scroll"><table class="${cls}"><thead><tr>${head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/* знак уровня: не только цвет, но и текст */
const lvl = (v) => ({0: U.lv0, 1: U.lv1, 2: U.lv2, 3: U.lv3, '-1': U.lvx}[v]);
const lvlTag = (v) => `<span class="lvl lvl${v < 0 ? 'x' : v}">${esc(lvl(v))}</span>`;
function levelBars(rows, w = 640) {
  /* rows: [{label, v(0..3 или -1), note}] — качественные уровни без числовой шкалы */
  const h = 36 + rows.length * 46;
  let d = '';
  rows.forEach((r, i) => {
    const y = 28 + i * 46, x0 = 215, W = w - x0 - 20;
    d += tx(x0 - 12, y + 19, r.label, 17, 'end');
    d += rect(x0, y, W, 26, '#eef3f7', 6, 'stroke="#c8d6e2"');
    if (r.v >= 0) d += rect(x0, y, W * (r.v / 3), 26, r.cls === 'warn' ? '#c3662f' : '#145c96', 6, r.v === 0 ? 'opacity=".0"' : '');
    d += tx(x0 + W / 2, y + 19, lvl(r.v), 15, 'middle', 'barlabel');
  });
  return svg(d, U.chart_levels, h, w);
}
/* простой график: серии [{pts:[[x,y]], dash, label}] */
function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {
  const x0 = 70, x1 = w - 24, y0 = h - 62, y1 = 30;
  let s = line(x0, y0, x1, y0, '#7f97ab', 1.5) + line(x0, y1, x0, y0, '#7f97ab', 1.5);
  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

/* ---------- оглавление ---------- */
const hay = l => [l.title, l.lead.join(' '), l.paragraphs.map(p => typeof p === 'string' ? p : p.h).join(' '), l.quiz.question, ...(l.keywords || [])].join(' ').toLowerCase();
function renderNav() {
  const q = ($('search').value || '').trim().toLowerCase(), n = stepsDone(), N = CONTENT.lessons.length;
  const ex = CONTENT.exam_ids.map(id => store.exam[id]).filter(Boolean), exOk = ex.filter(e => e.correct).length, exTries = ex.reduce((a, e) => a + (e.attempts || 0), 0);
  let html = `<div class="progress">${esc(U.progress_label)}: <b>${n} ${esc(U.of)} ${N}</b><progress value="${n}" max="${N}" aria-label="${esc(U.progress_label)}"></progress>` +
    `<div class="exam-stat">${esc(U.exam_stat_label)}: <b>${exOk} ${esc(U.of)} ${CONTENT.exam_ids.length}</b>${exTries ? ` · ${esc(fmt(U.exam_tries, {n: exTries}))}` : ''}</div>` +
    `<small>${esc(U.progress_note)}</small>${(n || ex.length) ? `<button id="reset-progress">${esc(U.reset)}</button>` : ''}</div>`;
  let any = false;
  CONTENT.sections.forEach((s, i) => {
    const ls = CONTENT.lessons.filter(l => l.section === i && (!q || hay(l).includes(q)));
    if (!ls.length) return; any = true;
    html += `<div class="nav-group">${i + 1}. ${esc(s.title)}</div>` + ls.map(l => {
      const done = store.steps[l.id] && store.steps[l.id].correct;
      return `<button data-nav="${l.id}" class="${l.id === current ? 'active' : ''}"${l.id === current ? ' aria-current="page"' : ''}><span class="tick" aria-hidden="true">${done ? '✓' : '○'}</span><span class="sr">${esc(done ? U.done : U.notdone)}: </span>${esc(l.title)}</button>`;
    }).join('');
  });
  if (q && !any) html += `<p class="empty">${esc(U.no_match)}</p>`;
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));
  const r = $('reset-progress'); if (r) r.onclick = () => { store = {v: 1, steps: {}, exam: {}}; save(); if (current === 'exam') renderExam(); else if (lessonById(current)) renderLesson(lessonById(current)); };
}
function navigate(id) {
  let target = id, anchor = '';
  if (id.indexOf('glossary-') === 0) { anchor = id.slice(9); target = 'glossary'; }
  if (!['home', 'glossary', 'exam', 'all', 'practice'].includes(target) && !lessonById(target)) target = 'home';
  current = target; renderNav(); $('nav').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false');
  const want = anchor ? 'glossary-' + anchor : target;
  if (location.hash.slice(1) !== want) location.hash = want;
  document.body.classList.remove('practice-mode');
  if (target === 'practice') renderPractice(); else if (target === 'home') renderHome(); else if (target === 'glossary') renderGlossary(anchor);
  else if (target === 'exam') renderExam(); else if (target === 'all') renderAll(); else renderLesson(lessonById(target));
  if (anchor) { const el = $('g-' + anchor); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
  else window.scrollTo({top: 0, behavior: 'instant'});
  if (!anchor) $('main').focus({preventScroll: true});
  document.title = (lessonById(target) ? lessonById(target).title + ' — ' : '') + U.page_title;
}

  $('main').innerHTML = `<section class="card hero"><div class="eyebrow">${esc(U.home_eyebrow)}</div><h1>${esc(U.home_h1).replace('\n', '<br>')}</h1><p class="lead">${esc(U.home_lead)}</p>` +
    `<div class="stats">${U.stats.map(x => `<span><b>${esc(x[0])}</b>${esc(x[1])}</span>`).join('')}</div>` +
    `<button class="primary" id="start">${esc(U.start)}</button></section>` +
    `<section class="card"><h2>${esc(U.how_h)}</h2><div class="mechanism">${U.how_steps.map(x => `<div>${esc(x)}</div>`).join('')}</div><p>${esc(U.how_p1)}</p><p class="quiet">${esc(U.how_p2)}</p></section>` +
    `<div class="home-grid">${CONTENT.sections.map((s, i) => `<section class="card"><div class="num">${esc(i < CONTENT.questions.length && !s.integr ? fmt(U.num_fmt, {n: i + 1}) : U.integr)}</div><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p><button data-section="${i}">${esc(U.open_section)}</button></section>`).join('')}` +
    `<section class="card"><div class="num">${esc(U.practice_num)}</div><h2>${esc(U.practice_h)}</h2><p>${esc(U.practice_p)}</p><button id="practice-start">${esc(U.practice_open)}</button></section>` +
    `<section class="card"><div class="num">${esc(U.exam_num)}</div><h2>${esc(U.exam_h)}</h2><p>${esc(U.exam_p)}</p><button id="exam-start">${esc(U.exam_open)}</button></section></div>` +

  $('start').onclick = () => navigate(CONTENT.lessons[0].id);
  $('practice-start').onclick = () => navigate('practice'); $('exam-start').onclick = () => navigate('exam');

/* ---------- элементы шага ---------- */
function sourcesHtml(l) {
  return `<details class="sources" id="src-${l.id}"><summary>${esc(U.src_summary)}</summary>` +
    `<ul class="src-list">${l.sources.map(k => { const s = CONTENT.sources[k]; return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)} ↗</a></li>`; }).join('')}</ul>` +
    `<p>${rt(l.conditions)}</p></details>`;
}
function quizHtml(l, scope = 'quiz') {
  const q = l.quiz, ord = optionOrder(l);
  const done = scope === 'quiz' && store.steps[l.id] && store.steps[l.id].correct;
  return `<section class="quiz" id="${scope}-${l.id}" aria-labelledby="${scope}-${l.id}-q"><div class="eyebrow">${esc(U.quiz_eyebrow)}</div><h3 id="${scope}-${l.id}-q">${rt(q.question)}</h3>` +
    `<div class="answers" role="group" aria-labelledby="${scope}-${l.id}-q">${ord.map((id, i) => `<button data-answer="${id}"><b aria-hidden="true">${LETTERS[i]}</b><span>${rt(optById(l, id).text)}</span></button>`).join('')}</div>` +
    `<div class="quiz-feedback" aria-live="polite">${done ? `<p class="quiet">${esc(U.quiz_done_before)}</p>` : ''}</div></section>`;
}
function bindQuiz(l, scope = 'quiz') {
  const boxEl = $(`${scope}-${l.id}`); let last = null;
  boxEl.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
    const id = b.dataset.answer, o = optById(l, id), ok = !!o.correct;
    boxEl.querySelectorAll('[data-answer]').forEach(x => { x.classList.remove('correct', 'wrong'); x.setAttribute('aria-pressed', String(x === b)); });
    b.classList.add(ok ? 'correct' : 'wrong');
    boxEl.querySelector('.quiz-feedback').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${esc(ok ? U.fb_ok : U.fb_bad)}</strong> ${rt(o.feedback)}` +
      (scope === 'exam' ? `<p><button data-return="${l.id}">${esc(U.open_expl)}</button></p>` : '') + `</div>`;
    const rec = (scope === 'exam' ? store.exam : store.steps);
    const r = rec[l.id] || (rec[l.id] = {attempts: 0, first: null, correct: false, rev: qrev(l)});
    if (last !== id) { r.attempts = (r.attempts || 0) + 1; if (r.first === null) r.first = ok; }
    last = id;
    if (ok) r.correct = true;
    save();
    const ret = boxEl.querySelector('[data-return]'); if (ret) ret.onclick = () => navigate(l.id);
  });
}
/* печатная копия вопроса и разбора всех вариантов */

  const ord = l.quiz.options.map(o => o.id);
  return `<div class="static-quiz"><h3>${rt(l.quiz.question)}</h3><ol class="alpha">${ord.map((id, i) => { const o = optById(l, id); return `<li><b>${LETTERS[i]}.</b> ${rt(o.text)} <i>(${esc(o.correct ? U.static_right : U.static_wrong)})</i><br><span class="expl">${rt(o.feedback)}</span></li>`; }).join('')}</ol></div>`;
}
function paragraphsHtml(l) { return l.paragraphs.map(p => (typeof p === 'string') ? `<p>${rt(p)}</p>` : `<h3>${esc(p.h)}</h3>`).join(''); }
function practiceRow(l) {

function renderLesson(l) {

    `<p class="lead">${l.lead.map(x => rt(x)).join(' ')}</p>` +
    `<nav class="jump" aria-label="${esc(U.jump_label)}"><a href="#" data-jump="widget">${esc(U.jump_scheme)}</a><a href="#" data-jump="reading">${esc(U.jump_text)}</a><a href="#" data-jump="quiz-${l.id}">${esc(U.jump_quiz)}</a><a href="#" data-jump="src-${l.id}">${esc(U.jump_src)}</a></nav>` +

    `<div class="next-row"><button id="prev"${i === 0 ? ' disabled' : ''}>${esc(U.prev)}</button><button class="primary" id="next">${esc(i < N - 1 ? U.next : U.to_exam)}</button></div><footer>${esc(U.footer_lesson)}</footer>`;
  $('prev').onclick = () => navigate(CONTENT.lessons[i - 1].id);

  bindQuiz(l); initWidget(l);

function initWidget(l) {
  const w = l.widget, fn = W[w.kind], s = state[l.id] || (state[l.id] = {});
  if (!fn) { $('widget-title').textContent = w.title; return; }
  const set = (title, status, controls) => { $('widget-title').textContent = title; $('widget-status').textContent = status; $('widget-controls').innerHTML = controls; };
  const out = (drawing, text) => { $('widget-drawing').innerHTML = drawing; $('widget-result').innerHTML = text; };
  const onRange = (id, f) => { $(id).oninput = () => { $(id + '-value').textContent = $(id).value + ($(id).dataset.unit || ''); f(Number($(id).value)); }; };
  const onSelect = (id, f) => { $(id).onchange = () => f(Number($(id).value)); };
  const onCheck = (id, f) => { $(id).onchange = () => f($(id).checked); };
  const onGroup = (id, f) => { $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); f(Number(b.dataset.choice)); }); };
  fn({l, w, S: w.s, s, set, out, onRange, onSelect, onCheck, onGroup});
}

/* ---------- словарь, проверка, весь материал, практикум ---------- */

    groups.map(g => `<h2 class="gl-h">${esc(g.sec.title)}</h2><dl class="glossary">${g.items.map(t => `<div id="g-${t.id}"><dt>${esc(t.term)}</dt><dd>${rt(t.def)}</dd></div>`).join('')}</dl>`).join('') + `</section>`;
