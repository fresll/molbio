<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-8.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Метаболические потоки, биосинтез и редокс-состояние</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-carbon-flux"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 1 из 32</div><h2>Чем метаболический поток отличается от содержания метаболита</h2><p class="lead">Количество вещества в клетке показывает, сколько его есть в данный момент, а <a href="#ns-g-S8-T01">метаболический поток</a> — сколько вещества превращается за единицу времени. Два пула одинакового размера могут обновляться с разной скоростью.</p><ol class="mech"><li>Метаболит образуется в одних реакциях и расходуется в других; изменение его количества равно разности притока и расхода.</li><li>В стационарном состоянии приток равен расходу, поэтому количество постоянно, хотя вещество непрерывно превращается.</li><li>Чем больше равные друг другу приток и расход, тем быстрее обновляется пул при том же количестве вещества.</li></ol><p>Метаболит клетки находится в <a href="#ns-g-S8-T04">метаболическом пуле</a>: его молекулы образуются в одних реакциях и расходуются в других. Содержание вещества в пуле выражают как <a href="#ns-g-S8-T02">количество вещества</a> или, если известен объём компартмента, как <a href="#ns-g-S8-T03">концентрацию</a>. Поток — другая величина. Он показывает, сколько вещества проходит через реакцию или путь за единицу времени, и относится к названной реакции и системе; его нормируют, например, на число клеток или массу белка.</p><p>Изменение количества одного промежуточного соединения описывает баланс dN/dt = J(вх) − J(вых). Здесь N — количество вещества в пуле, J(вх) — суммарный поток его образования и поступления, J(вых) — суммарный поток его расхода и выхода. Если приток больше расхода, количество растёт, если меньше — снижается.</p><p>Особый случай — <a href="#ns-g-S8-T05">стационарное состояние</a>: приток равен расходу, и количество не меняется. Это не значит, что превращений нет. Возьмём две клетки с одинаковым количеством цитрата, например 12 условных единиц. В первой клетке образование и расход цитрата равны 3 условным единицам в минуту, во второй — 6. Количество цитрата в обеих клетках постоянно, но пул второй обновляется вдвое быстрее: среднее время пребывания молекулы в пуле, то есть частное от деления количества на поток, составляет 4 мин в первой клетке и 2 мин во второй.</p><p>Поэтому содержание метаболита само по себе не показывает скорость превращения. Оно может не измениться ни при ускорении притока и расхода, ни при их замедлении. В стационарном состоянии количество не меняется, поэтому его изменение о потоке не говорит. Поток оценивают отдельно: по накоплению или убыли вещества после блокирования одной из реакций, по потреблению субстрата в заданной системе или по динамике включения изотопной метки с учётом модели. Доля меченых молекул сама потоком не является (см. шаг про прослеживание происхождения углерода). Если же меняется объём клетки, концентрация может измениться и при неизменном количестве, поэтому каждую величину нужно называть точно.</p><div class="note trap"><strong>Типичная ошибка</strong> Если количество метаболита не изменилось, его потоки тоже не изменились.<p class="trap-fix">Постоянное количество совместимо с любыми значениями притока и расхода, если они равны. Поток определяют отдельно: по скорости превращения в названной системе.</p></div><div class="static-quiz"><h3>В двух клетках содержится одинаковое количество цитрата. В первой его образование и расход равны 2, во второй — 8 условным единицам в минуту. Какое различие между клетками следует из этих данных?</h3><ol><li><b>А.</b> Во второй клетке пул цитрата обновляется быстрее при том же его количестве. <i>(верный вариант)</i><br><span class="expl">Постоянное количество совместимо с разными скоростями образования и расхода.</span></li><li><b>Б.</b> Во второй клетке концентрация цитрата выше, так как через пул проходит больше вещества. <i>(неверный вариант)</i><br><span class="expl">Количество цитрата в клетках одинаково; концентрация определяется количеством и объёмом, а не потоком через пул.</span></li><li><b>В.</b> В обеих клетках пул обновляется одинаково, так как количество цитрата то же. <i>(неверный вариант)</i><br><span class="expl">Количество характеризует состояние, а не скорость превращений: при потоках 2 и 8 пул обновляется с разной скоростью.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://www.worldcat.org/search?q=Baker%20S%20%20A">Baker S. A., Rutter J. Metabolites as signalling molecules. Nat Rev Mol Cell Biol. 2023;24:355–374.</a></li></ul><p>Схема — расчёт по заданным условным параметрам: единицы потока, количество и время не являются данными опыта и не относятся к реальным клеткам. Различие между содержанием метаболита и потоком изложено в учебнике биохимии (Ленинджер, т. 2) и в обзоре Baker и Rutter (2023); у обзора прочитаны выбранные фрагменты о потоках.</p></details></article><article class="card print-unit" id="ns-ldh-nad"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 2 из 32</div><h2>Как образование лактата поддерживает гликолиз</h2><p class="lead">Окислительная реакция гликолиза восстанавливает NAD⁺ до NADH, а реакция лактатдегидрогеназы вновь окисляет NADH, восстанавливая пируват до лактата. Поэтому ЛДГ позволяет гликолизу продолжаться, хотя сама ATP не образует.</p><ol class="mech"><li>Глицеральдегид-3-фосфатдегидрогеназа окисляет глицеральдегид-3-фосфат и восстанавливает NAD⁺ до NADH.</li><li>Лактатдегидрогеназа восстанавливает пируват до лактата за счёт NADH, и NAD⁺ образуется вновь.</li><li>Окислительной реакции гликолиза (GAPDH) нужен NAD⁺, а ATP образуется в других реакциях пути.</li></ol><p>В <a href="#ns-g-S8-T07">гликолизе</a> (здесь — путь от глюкозы до лактата; в узком смысле гликолиз заканчивается пируватом) есть окислительная реакция: глицеральдегид-3-фосфатдегидрогеназа (GAPDH) превращает глицеральдегид-3-фосфат в 1,3-бисфосфоглицерат и переносит электроны на NAD⁺. Кофермент восстанавливается до NADH. Если NADH не окисляется вновь, количество свободного NAD⁺ уменьшается, и эта реакция замедляется. Поэтому гликолизу нужна <a href="#ns-g-S8-T12">регенерация NAD⁺</a>: образование окисленной формы из восстановленной. Новых молекул NAD при этом не появляется, уже имеющиеся лишь возвращаются в окисленную форму.</p><p>Один из способов регенерации — реакция <a href="#ns-g-S8-T11">лактатдегидрогеназы</a> (ЛДГ): пируват + NADH + H⁺ ⇄ лактат + NAD⁺. Пируват принимает электроны и превращается в <a href="#ns-g-S8-T10">лактат</a>, а NADH окисляется. Образовавшийся NAD⁺ снова доступен для GAPDH, и гликолиз продолжается без участия митохондрий. Стрелки на схеме показывают оборот кофермента: NAD⁺ восстанавливается в одной реакции и вновь образуется в другой, а углеродная цепь идёт отдельным путём от глицеральдегид-3-фосфата к пирувату и лактату. Гликолиз до лактата окислительно-восстановительно нейтрален: NADH, образованный в GAPDH, окисляется в реакции ЛДГ, поэтому образование лактата само по себе не создаёт дополнительного NAD⁺ для других окислительных синтезов (шаг про аспартат).</p><p>Реакции ЛДГ не следует приписывать синтез ATP. ATP образуется в гликолизе при <a href="#ns-g-S8-T13">субстратном фосфорилировании</a>: фосфорильная группа переносится с метаболита на ADP, как в реакциях фосфоглицераткиназы и пируваткиназы. В реакции ЛДГ такого переноса нет. Реакция ЛДГ лишь поддерживает содержание NAD⁺, необходимое для окислительной реакции GAPDH. Если NAD⁺ не регенерируется ни в реакции ЛДГ, ни челночными системами, не идут и следующие за GAPDH реакции с образованием ATP.</p><p>Реакция ЛДГ обратима: фермент ускоряет приближение к <a href="#ns-g-S8-T06">химическому равновесию</a>, но не задаёт его положения. Направление чистого потока определяют концентрации пирувата, лактата, NADH и NAD⁺ и значение pH. В клетках, где митохондрии быстро окисляют NADH и пируват, реакция ЛДГ может идти в обратном направлении, и лактат становится источником пирувата. Поэтому образование лактата зависит от баланса этих процессов, а не от свойств одного фермента.</p><div class="note trap"><strong>Типичная ошибка</strong> Лактат образуется потому, что реакция ЛДГ сама даёт ATP.<p class="trap-fix">ATP при восстановлении пирувата до лактата не синтезируется. Реакция окисляет NADH до NAD⁺; ATP образуется в других реакциях гликолиза, а NAD⁺ нужен окислительной реакции GAPDH, которая поставляет для них субстрат.</p></div><div class="static-quiz"><h3>Передача электронов NADH в митохондрии ограничена, но ЛДГ активна и пируват доступен. Что обеспечивает реакция ЛДГ для окислительной реакции гликолиза в этих условиях?</h3><ol><li><b>А.</b> Образует ATP из ADP при восстановлении пирувата до лактата. <i>(неверный вариант)</i><br><span class="expl">В реакции ЛДГ переноса фосфорильной группы на ADP нет.</span></li><li><b>Б.</b> Образует дополнительный NADH, который нужен для реакции GAPDH. <i>(неверный вариант)</i><br><span class="expl">При восстановлении пирувата NADH расходуется, а NAD⁺ образуется.</span></li><li><b>В.</b> Окисляет NADH и тем самым возвращает NAD⁺ для реакции GAPDH. <i>(верный вариант)</i><br><span class="expl">NAD⁺ вновь используется глицеральдегид-3-фосфатдегидрогеназой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://research.chalmers.se/publication/522133/file/522133_Fulltext.pdf">Luengo A. et al. Increased demand for NAD⁺ relative to ATP drives aerobic glycolysis. Mol Cell. 2021;81:691–707.e6.</a></li></ul><p>Схема показывает механизм без концентраций. Связь регенерации NAD⁺ с продолжением гликолиза рассмотрена в работе Luengo и соавт. (2021) на пролиферирующих клетках; стехиометрия реакций GAPDH и ЛДГ приведена по учебнику Ленинджера (т. 2).</p></details></article><article class="card print-unit" id="ns-aerobic-glycolysis"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 3 из 32</div><h2>Почему лактат образуется в присутствии кислорода</h2><p class="lead"><a href="#ns-g-S8-T08">Аэробный гликолиз</a> — образование лактата из глюкозы при достаточном содержании кислорода. Он отличается от усиления образования лактата при гипоксии и не исключает работы митохондрий.</p><ol class="mech"><li>При достаточном O₂ дыхательная цепь может работать, но часть пирувата всё равно восстанавливается до лактата.</li><li>При ограничении O₂ дыхание снижается, и образование лактата усиливается по другой причине.</li><li>Образование лактата и потребление O₂ в одной клетке могут идти одновременно.</li></ol><p>Лактат обычно связывают с недостатком кислорода. При <a href="#ns-g-S8-T09">гипоксии</a> дыхательная цепь окисляет NADH хуже, поэтому гликолиз и образование лактата усиливаются; к этому добавляется HIF-зависимое торможение PDH через киназу PDK1: окисление пирувата в митохондриях снижается, и больше пирувата восстанавливается до лактата (Kim и соавт., 2006). Однако многие делящиеся клетки образуют много лактата и при достаточном содержании кислорода. Такое состояние называют аэробным гликолизом, а когда его описывают для опухолевых клеток, говорят об эффекте Варбурга.</p><p>Различают три состояния. В первом кислород доступен, лактата образуется немного, и значительная часть пирувата окисляется. Во втором кислород тоже доступен, но лактата образуется много: это аэробный гликолиз. В третьем кислород ограничен, дыхание снижено, и лактата образуется много. Во втором состоянии митохондрии работают. Это показано на культивируемых клетках: при активации конканавалином А тимоциты крысы превращали в лактат непропорционально большую часть дополнительно поглощённой глюкозы, а окисление пирувата при этом тоже возрастало (Hume и соавт., 1978). Поэтому образование лактата не показывает, что дыхание остановлено или цепь повреждена.</p><p>Причины аэробного гликолиза не сводятся к одному механизму. По одной модели, в части делящихся клеток потребность в NAD⁺ для окислительных реакций превышает потребность в ATP; тогда дыхание ограничено сопряжением с оборотом ATP, а образование лактата поддерживает NAD⁺ (Luengo и соавт., 2021). По другой, в ряде линий клеток панели NCI-60 ёмкость челноков, переносящих восстановительные эквиваленты в митохондрии, оказывается насыщенной (Wang и соавт., 2022). Оба результата получены на конкретных клеточных моделях; ни один из них не объясняет явление во всех клетках и не исключает другой.</p><p>Аэробный гликолиз не служит специфическим признаком рака, и не всякое образование лактата называют эффектом Варбурга. Эритроциты, в которых нет митохондрий, образуют лактат, поскольку не могут окислять пируват в митохондриях; в скелетных мышцах при интенсивной нагрузке лактат образуется и при достаточном содержании O₂, когда скорость гликолиза превышает скорость окисления пирувата, а локальное ограничение O₂ возможно, но не обязательно (Gladden, 2004). Чтобы говорить об аэробном гликолизе, нужно назвать клетки, указать содержание O₂ и показать образование лактата в этих условиях.</p><div class="note trap"><strong>Типичная ошибка</strong> Лактат образуется только при недостатке O₂.<p class="trap-fix">Лактат образуется и при достаточном содержании O₂. В таком состоянии гликолиз и дыхание идут одновременно. Недостаток O₂ — одна из причин усиления образования лактата, но не единственная.</p></div><div class="static-quiz"><h3>Активированные лимфоциты в культуре при достаточном содержании O₂ выделяют больше лактата, чем покоящиеся, и продолжают потреблять O₂. Какое объяснение согласуется с этими данными?</h3><ol><li><b>А.</b> Лактат образуется потому, что кислород в культуре расходуется быстрее, чем поступает. <i>(неверный вариант)</i><br><span class="expl">Условие указывает на достаточное содержание O₂; ограничение его поступления не показано.</span></li><li><b>Б.</b> Часть пирувата восстанавливается до лактата, а часть окисляется в митохондриях. <i>(верный вариант)</i><br><span class="expl">Образование лактата в присутствии O₂ не требует остановки дыхания.</span></li><li><b>В.</b> В активированных клетках дыхательная цепь повреждена, и лактат образуется вместо дыхания. <i>(неверный вариант)</i><br><span class="expl">Потребление O₂ продолжается, поэтому образование лактата не означает, что цепь повреждена.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://research.chalmers.se/publication/522133/file/522133_Fulltext.pdf">Luengo A. et al. Increased demand for NAD⁺ relative to ATP drives aerobic glycolysis. Mol Cell. 2021;81:691–707.e6.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.07.007">Wang Y. et al. Saturation of the mitochondrial NADH shuttles drives aerobic glycolysis in proliferating cells. Mol Cell. 2022;82:3270–3283.e9.</a></li><li><a href="https://doi.org/10.1042/bj1740703">Hume D. A., Radik J. L., Ferber E., Weidemann M. J. Aerobic glycolysis and lymphocyte transformation. Biochem J. 1978;174:703–709.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2006.02.002">Kim J. W., Tchernyshyov I., Semenza G. L., Dang C. V. HIF-1-mediated expression of pyruvate dehydrogenase kinase: a metabolic switch required for cellular adaptation to hypoxia. Cell Metab. 2006;3:177–185.</a></li><li><a href="https://doi.org/10.1126/science.1160809">Vander Heiden M. G., Cantley L. C., Thompson C. B. Understanding the Warburg effect: the metabolic requirements of cell proliferation. Science. 2009;324:1029–1033.</a></li><li><a href="https://doi.org/10.1113/jphysiol.2003.058701">Gladden L. B. Lactate metabolism: a new paradigm for the third millennium. J Physiol. 2004;558:5–30.</a></li></ul><p>Схема качественная: лактат и дыхание показаны словами, числовых значений нет. Механизмы потребности в NAD⁺ и насыщения челноков получены на пролиферирующих культивируемых клетках (Luengo и соавт., 2021; Wang и соавт., 2022). Пример активированных тимоцитов крысы дан по аннотации Hume и соавт. (1978); данные о потреблении O₂ в ней не приводятся, сохранение дыхания показано по окислению пирувата. Статья Wang и соавт. (1976) о лимфоцитах мыши (DOI 10.1038/261702a0) при подготовке страницы не читалась: аннотации в PubMed нет. Положение о мышцах дано по аннотации обзора Gladden (2004): повышение образования лактата при гипоксии или дисоксии часто оказывается скорее исключением, чем правилом; детали механизма в мышце при нагрузке в аннотации не рассматриваются. Обзор Vander Heiden и соавт. (2009) использован как общая ссылка по теме, прочитана аннотация. Об HIF-зависимом торможении PDH прочитана аннотация Kim и соавт. (2006).</p></details></article><article class="card print-unit" id="ns-biosynthetic-branches"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 4 из 32</div><h2>Как углерод глюкозы поступает в биосинтез</h2><p class="lead">От глюкозо-6-фосфата отходят гликолиз и окислительная ветвь <a href="#ns-g-S8-T18">пентозофосфатного пути</a> (ПФП), а от 3-фосфоглицерата — синтез серина. Продукты этих ответвлений нужны для биосинтеза, а сами ответвления не исключают образования лактата.</p><ol class="mech"><li>Окислительная ветвь ПФП превращает глюкозо-6-фосфат в рибулозо-5-фосфат и образует NADPH и CO₂; из рибулозо-5-фосфата получают рибозо-5-фосфат.</li><li>Окисление 3-фосфоглицерата — первая реакция синтеза серина; серин служит источником одноуглеродных групп для одноуглеродного обмена.</li><li>Если приток глюкозо-6-фосфата возрастает и ферменты ответвлений не насыщены, потоки в ответвления и в лактат могут расти одновременно.</li></ol><p>Глюкоза фосфорилируется до глюкозо-6-фосфата (G6P), от которого начинаются гликолиз и ПФП. Промежуточные соединения этих путей служат <a href="#ns-g-S8-T20">биосинтетическими предшественниками</a>: из их атомов образуются другие вещества. Для прослеживания углерода на схеме указано число его атомов в каждом соединении.</p><p>Первое ответвление — окислительная ветвь ПФП. Три последовательные реакции — глюкозо-6-фосфатдегидрогеназа (G6PD), 6-фосфоглюконолактоназа и 6-фосфоглюконатдегидрогеназа — превращают G6P в рибулозо-5-фосфат и образуют две молекулы NADPH и одну молекулу CO₂ на молекулу G6P (Stincone и соавт., 2015). Из рибулозо-5-фосфата изомераза образует рибозо-5-фосфат для нуклеотидов. Рибозо-5-фосфат можно получить и в неокислительной ветви из фруктозо-6-фосфата и глицеральдегид-3-фосфата, но NADPH эта ветвь не образует. В гликолизе NADPH не образуется; его образуют также малик-фермент и цитозольная изоцитратдегидрогеназа (IDH1).</p><p>Второе ответвление начинается от 3-фосфоглицерата. Его окисление до 3-фосфогидроксипирувата, катализируемое фосфоглицератдегидрогеназой (PHGDH), — первая реакция синтеза серина de novo. Серин служит источником одноуглеродных групп для <a href="#ns-g-S8-T19">одноуглеродного обмена</a>, где работают фолатный и метиониновый циклы; эти группы используются для синтеза нуклеотидов и реакций метилирования. В части опухолевых клеток в синтез серина направлялось около 10 % 3-фосфоглицерата, а в других клетках поток в него не выявлялся (по обзору Locasale, 2013).</p><p>Остальной углерод превращается в пируват, который восстанавливается до лактата или окисляется до <a href="#ns-g-S8-T44">ацетил-CoA</a>. Поток в ответвление определяют приток G6P и активность ферментов ответвления, поэтому при ускорении поступления глюкозы потоки в ПФП, к серину и в лактат могут расти одновременно. Усиление потока в ответвление не создаёт новых путей: клетки человека, например, не синтезируют триптофан. Кроме того, в биомассе делящихся культивируемых клеток преобладает углерод аминокислот среды, а не глюкозы (Hosios и соавт., 2016).</p><div class="note trap"><strong>Типичная ошибка</strong> NADPH образуется в самом гликолизе при превращении пирувата в лактат.<p class="trap-fix">В реакции ЛДГ окисляется NADH, а NADPH в гликолизе не образуется. Его образуют окислительная ветвь ПФП и ряд других ферментов, например малик-фермент.</p></div><div class="static-quiz"><h3>При неизменном поступлении глюкозо-6-фосфата возрастает его поток через окислительную ветвь пентозофосфатного пути. Как изменится образование NADPH и пентозофосфатов?</h3><ol><li><b>А.</b> NADPH образуется в реакции ЛДГ, поэтому растёт образование лактата, а не пентозофосфатов. <i>(неверный вариант)</i><br><span class="expl">В реакции ЛДГ окисляется NADH, а NADPH не образуется; пентозофосфаты образует окислительная ветвь.</span></li><li><b>Б.</b> Образование NADPH снижается, поскольку окислительная ветвь потребляет NADPH и CO₂. <i>(неверный вариант)</i><br><span class="expl">Окислительная ветвь образует NADPH и CO₂, а не потребляет их.</span></li><li><b>В.</b> Образование NADPH и пентозофосфатов усиливается, а поток в гликолиз снижается. <i>(верный вариант)</i><br><span class="expl">Эта ветвь образует NADPH и рибулозо-5-фосфат, из которого получают рибозо-5-фосфат; при неизменном притоке в гликолиз остаётся меньше глюкозо-6-фосфата.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1111/brv.12140">Stincone A. et al. The return of metabolism: biochemistry and physiology of the pentose phosphate pathway. Biol Rev Camb Philos Soc. 2015;90:927–963.</a></li><li><a href="https://doi.org/10.1038/nrc3557">Locasale J. W. Serine, glycine and one-carbon units: cancer metabolism in full circle. Nat Rev Cancer. 2013;13:572–583.</a></li><li><a href="https://doi.org/10.1016/j.devcel.2016.02.012">Hosios A. M. et al. Amino acids rather than glucose account for the majority of cell mass in proliferating mammalian cells. Dev Cell. 2016;36:540–549.</a></li></ul><p>Схема качественная: числа атомов углерода — по структуре соединений, потоки заданы относительно и не получены в опыте. Две молекулы NADPH на G6P и неокислительная ветвь взяты из полного текста обзора Stincone и соавт. (2015), синтез серина и одноуглеродный обмен — из полного текста обзора Locasale (2013); значение около 10 % приведено в обзоре по данным ¹³C-глюкозы для части линий опухолевых клеток и не характеризует все клетки; вклад глюкозы в массу культивируемых клеток — по работе Hosios и соавт. (2016; полный текст).</p></details></article><article class="card print-unit" id="ns-atp-and-oxidation"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 5 из 32</div><h2>Почему выход ATP и регенерация NAD⁺ могут ограничивать разные процессы</h2><p class="lead"><a href="#ns-g-S8-T15">Выход ATP</a> на молекулу глюкозы и скорость образования ATP — разные величины. Окисление NADH в митохондриях зависит от сопряжения дыхания с расходом ATP, поэтому присутствие O₂ само по себе не означает окисления всего NADH.</p><ol class="mech"><li>Выход ATP на молекулу глюкозы при полном окислении больше, чем при образовании лактата, но скорость образования ATP равна произведению потока на выход.</li><li>Цитозольный NADH не проходит через внутреннюю мембрану: его электроны передают в матрикс челноки, а комплекс I окисляет NADH матрикса, и электроны переходят к O₂.</li><li>Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, он остаётся высоким и ограничивает перенос электронов.</li></ol><p>При превращении глюкозы в лактат образуются 2 молекулы ATP на молекулу глюкозы, при полном окислении — около 30 (учебное значение по Ленинджеру; в разных пособиях от 30 до 38 из-за разных допущений о стехиометрии). Это выход. Скорость образования ATP равна произведению потока через путь на выход, поэтому путь с малым выходом при большом потоке может давать столько же ATP за единицу времени, сколько путь с большим выходом при малом потоке.</p><p>NADH, образованный в цитозоле, внутреннюю митохондриальную мембрану не проходит. <a href="#ns-g-S8-T16">Восстановительные эквиваленты</a> — электроны, связанные с переносчиком, — передаёт в матрикс <a href="#ns-g-S8-T17">челночная система</a>. В малат-аспартатном челноке цитозольный NADH восстанавливает оксалоацетат до малата, а в матриксе малат вновь окисляется с образованием NADH; глицерол-3-фосфатный челнок передаёт электроны на убихинон, минуя комплекс I. Комплекс I окисляет NADH матрикса, электроны через убихинон и комплексы III и IV переходят к O₂, и этот перенос сопровождается переносом протонов через мембрану. Протонный градиент использует ATP-синтаза: так осуществляется <a href="#ns-g-S8-T14">окислительное фосфорилирование</a>.</p><p>Перенос электронов и синтез ATP сопряжены, поэтому скорость дыхания зависит от оборота ATP. Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, он остаётся высоким, и NADH окисляется медленнее даже при достаточном содержании O₂. В работе Luengo и соавт. (2021) на клеточных линиях человека активация <a href="#ns-g-S8-T28">пируватдегидрогеназного комплекса</a> (PDH) ингибитором его киназы (<a href="#ns-g-S8-T29">PDK</a>) AZD7545 повышала мембранный потенциал и отношение NADH/NAD⁺; FCCP или дополнительный гидролиз ATP возвращали оба показателя к исходным значениям. Общее отношение ATP/ADP при этом не менялось, поэтому нехватка ADP у ATP-синтазы остаётся предположением авторов.</p><p>Вмешательства различаются по мишеням: олигомицин подавляет ATP-синтазу, FCCP рассеивает градиент, пиерицидин ингибирует комплекс I, дихлорацетат (DCA) подавляет PDK; их действие показано на схеме переключателем «Вмешательство». Присутствие O₂ не снимает блок комплекса I; остаточное дыхание зависит от других входов электронов, например <a href="#ns-g-S8-T36">комплекса II (SDH)</a>. В клетках с дефицитом комплекса I дыхание поддерживали проникающие пролекарства сукцината (Ehinger и соавт., 2016).</p><div class="note trap"><strong>Типичная ошибка</strong> Если O₂ доступен, митохондрии окисляют весь цитозольный NADH.<p class="trap-fix">Присутствие O₂ не гарантирует окисления всего NADH: при медленном обороте ATP высокий градиент тормозит перенос электронов, а передача электронов из цитозоля ограничена ёмкостью челноков.</p></div><div class="static-quiz"><h3>В клетках снижен расход ATP, а O₂ достаточно. Рассматривается сопряжённое дыхание без разобщителей и ингибиторов цепи. Что ограничивает окисление NADH в митохондриях?</h3><ol><li><b>А.</b> Перенос электронов тормозится протонным градиентом, который медленно используется ATP-синтазой. <i>(верный вариант)</i><br><span class="expl">Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, и перенос электронов замедляется (в рамках модели Luengo и соавт., 2021).</span></li><li><b>Б.</b> Скорость переноса электронов определяется количеством NADH и не зависит от оборота ATP. <i>(неверный вариант)</i><br><span class="expl">Перенос электронов сопряжён с использованием градиента ATP-синтазой, поэтому его скорость зависит от оборота ATP.</span></li><li><b>В.</b> Снижение расхода ATP повышает потребность в ADP и ускоряет ATP-синтазу, поэтому NADH окисляется быстрее. <i>(неверный вариант)</i><br><span class="expl">При меньшем обороте ATP ATP-синтаза использует градиент медленнее, поэтому она не ускоряется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://research.chalmers.se/publication/522133/file/522133_Fulltext.pdf">Luengo A. et al. Increased demand for NAD⁺ relative to ATP drives aerobic glycolysis. Mol Cell. 2021;81:691–707.e6.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.07.007">Wang Y. et al. Saturation of the mitochondrial NADH shuttles drives aerobic glycolysis in proliferating cells. Mol Cell. 2022;82:3270–3283.e9.</a></li><li><a href="https://doi.org/10.1038/ncomms12317">Ehinger J. K. et al. Cell-permeable succinate prodrugs bypass mitochondrial complex I deficiency. Nat Commun. 2016;7:12317.</a></li></ul><p>Схема качественная: уровни показывают направление изменений, а не значения. Значения выхода ATP — учебные, по Ленинджеру; в этой работе по первоисточнику не перепроверялись. Сопряжение дыхания с оборотом ATP показано у Luengo и соавт. (2021) на клеточных линиях человека (по тексту статьи — 143B и H1299; список линий по легендам рисунков не проверялся) при 21 % O₂ с ингибитором PDK AZD7545, а не с DCA; отношение NAD⁺/NADH определяли в экстракте целой клетки и приводили как NAD⁺/NADH (здесь дана обратная запись NADH/NAD⁺); общее ATP/ADP не менялось, нехватка ADP у ATP-синтазы — гипотеза авторов. Насыщение челноков в клетках панели NCI-60 — у Wang и соавт. (2022). Эти работы выполнены на разных моделях и не исключают друг друга; один механизм нельзя считать общей причиной эффекта Варбурга. Возможность поддержать дыхание при блоке комплекса I через комплекс II показана на клетках с дефицитом комплекса I при подаче проникающих пролекарств сукцината (Ehinger и соавт., 2016; по аннотации).</p></details></article><article class="card print-unit" id="ns-aspartate"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 6 из 32</div><h2>Зачем делящейся клетке дыхание помимо синтеза ATP</h2><p class="lead">Дыхание нужно делящейся клетке не только для синтеза ATP: окисление NADH поддерживает содержание NAD⁺, необходимое для реакций синтеза <a href="#ns-g-S8-T21">аспартата</a>. Аспартат — исходное вещество для синтеза нуклеотидов и белков, поэтому его нехватка может замедлять деление клеток, хотя ATP достаточно.</p><ol class="mech"><li>Малатдегидрогеназа окисляет малат до оксалоацетата, и для этой реакции нужен NAD⁺.</li><li>Аспартатаминотрансфераза переносит аминогруппу с глутамата на оксалоацетат: образуются аспартат и α-КГ.</li><li>Если комплекс I подавлен, NAD⁺ может регенерироваться за счёт другого акцептора электронов: добавленного в среду пирувата в реакции ЛДГ или O₂ в реакции LbNOX.</li></ol><p>Аспартат образуется из <a href="#ns-g-S8-T32">оксалоацетата</a> в реакции <a href="#ns-g-S8-T31">трансаминирования</a>: аспартатаминотрансфераза (GOT) переносит аминогруппу с глутамата на оксалоацетат, и образуются аспартат и <a href="#ns-g-S8-T33">α-кетоглутарат</a> (α-КГ). Оксалоацетат возникает при окислении малата малатдегидрогеназой (MDH), которой нужен NAD⁺; если оксалоацетат образуется в окислительном пути из α-КГ, акцепторы электронов нужны также α-кетоглутаратдегидрогеназе и сукцинатдегидрогеназе (Sullivan и соавт., 2015). Образовавшийся NADH необходимо окислить, чтобы реакции продолжались: в матриксе это делает комплекс I, а в цитозоле — реакции, в которых другие соединения принимают электроны.</p><p>Эти положения проверяли на культивируемых клетках. В клетках 143B без функциональной дыхательной цепи (делеция в гене цитохрома b; среда с уридином) деление возвращали добавленные в среду пируват и α-кетобутират. Добавленные соединения служат экзогенными акцепторами электронов; пируват, образованный в клетке из глюкозы, такой функции не выполняет, поскольку гликолиз до лактата окислительно-восстановительно нейтрален (NADH из GAPDH окисляется в реакции ЛДГ). Дегидрогеназы, в том числе ЛДГ, восстанавливают α-кетобутират до α-гидроксибутирата за счёт NADH. Оба соединения снижали отношение NADH/NAD⁺, а α-кетобутират возвращал и содержание аспартата, но потребление O₂ не повышал. Добавление аспартата в избытке тоже возвращало деление, но не меняло ни потребление O₂, ни отношение NADH/NAD⁺: аспартат не принимает электроны, а восполняет недостающий предшественник (Sullivan и соавт., 2015).</p><p>В клетках Jurkat при подавлении комплекса I содержание аспартата снижалось, а добавленный в среду пируват (1 мМ) возвращал это содержание и деление клеток; для этого были нужны цитозольные MDH1 и GOT1, но не пируваткарбоксилаза (Birsoy и соавт., 2015). Эти данные согласуются с моделью, по которой NAD⁺, образованный при восстановлении добавленного пирувата, служит субстратом MDH1, а GOT1 синтезирует аспартат; без пирувата аспартат при подавлении комплекса I образовывался, в частности, путём восстановительного карбоксилирования α-КГ, образованного из глутамина.</p><p>Аналогичные результаты получены с водообразующей NADH-оксидазой LbNOX: она окисляет NADH до NAD⁺, восстанавливая O₂ до воды, и не синтезирует ATP. В клетках HeLa (среда с уридином, без пирувата) с подавленными комплексами I или III её экспрессия в цитозоле или в матриксе возвращала деление (Titov и соавт., 2016). Доступность аспартата зависит от типа клеток, транспорта аспартата и состава среды.</p><div class="note trap"><strong>Типичная ошибка</strong> Аспартат возвращает деление клеток без дыхания, потому что служит акцептором электронов.<p class="trap-fix">Аспартат не принимает электроны: добавление аспартата не повышало потребление O₂ и не меняло отношение NADH/NAD⁺ в клетках 143B, а восполняло нехватку самого предшественника (Sullivan и соавт., 2015).</p></div><div class="static-quiz"><h3>Содержание ATP достаточное, но регенерация NAD⁺ нарушена. Какое последствие может объяснить замедление деления?</h3><ol><li><b>А.</b> Аспартат принимает электроны, и без него дыхательная цепь не окисляет NADH. <i>(неверный вариант)</i><br><span class="expl">Аспартат не принимает электроны: его добавление не меняет потребление O₂ и отношение NADH/NAD⁺.</span></li><li><b>Б.</b> Нехватка аспартата как предшественника ограничивает синтез нуклеотидов. <i>(верный вариант)</i><br><span class="expl">Нуклеотиды синтезируются из аспартата; ATP этот субстрат не заменяет.</span></li><li><b>В.</b> Нехватка NAD⁺ нарушает синтез белков, а синтез нуклеотидов не затрагивает. <i>(неверный вариант)</i><br><span class="expl">Аспартат нужен и для синтеза нуклеотидов; при его нехватке они синтезируются хуже.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2015.07.017">Sullivan L. B. et al. Supporting Aspartate Biosynthesis Is an Essential Function of Respiration in Proliferating Cells. Cell. 2015;162:552–563.</a></li><li><a href="https://doi.org/10.1016/j.cell.2015.07.016">Birsoy K. et al. An essential role of the mitochondrial electron transport chain in cell proliferation is to enable aspartate synthesis. Cell. 2015;162:540–551.</a></li><li><a href="https://doi.org/10.1126/science.aad4017">Titov D. V. et al. Complementation of mitochondrial electron transport chain by manipulation of the NAD⁺/NADH ratio. Science. 2016;352:231–235.</a></li></ul><p>Схема показывает механизм без концентраций и времён. Результаты получены на культивируемых клетках разных линий: 143B с делецией в гене цитохрома b (среда с уридином; Sullivan и соавт., 2015), Jurkat (Birsoy и соавт., 2015) и HeLa (Titov и соавт., 2016). Пируват и α-кетобутират добавляли в среду экзогенно (у Birsoy и соавт. пируват — 1 мМ); среда для HeLa содержала уридин, но не содержала пирувата; аспартат добавляли в сверхфизиологических концентрациях (у Birsoy и соавт. 10 мМ против 150 мкМ в стандартной среде RPMI). Вывод не переносится на любые клетки и ткани: возвращение деления аспартатом не гарантировано.</p></details></article><article class="card print-unit" id="ns-extracellular-flux"><div class="eyebrow">Аэробный гликолиз и распределение углерода · шаг 7 из 32</div><h2>Что показывают потребление O₂ и внеклеточное закисление</h2><p class="lead">Внеклеточный анализ потоков (в литературе — анализатор Seahorse XF) регистрирует убыль O₂ и снижение pH в малом объёме над клетками и рассчитывает <a href="#ns-g-S8-T78">OCR</a> и <a href="#ns-g-S8-T79">ECAR</a>. Это косвенные показатели: ECAR не равен скорости образования лактата, а OCR — скорости синтеза ATP.</p><div class="note"><strong>Что показывает схема.</strong> Схема метода (текстовая копия). Клетки в монослое находятся под малым объёмом среды; O₂-датчик регистрирует убыль кислорода, pH-датчик — закисление. Скорости OCR и ECAR рассчитывают по наклону кривых во времени после последовательных добавлений олигомицина, FCCP и ингибиторов комплексов I и III. Закисление складывается из лактата с протоном и из CO₂ (CO₂ + H₂O ⇄ HCO₃⁻ + H⁺), поэтому ECAR не равен скорости образования лактата. Контроли: число клеток или белок, буферная ёмкость среды, лунка без клеток, немитохондриальное потребление O₂, отдельное измерение лактата в среде. Значения учебные.</div><ol class="mech"><li>Датчики регистрируют O₂ и pH во времени, и скорость определяют по наклону кривой, а не по значению в точке.</li><li>Закисление создают лактат, выходящий вместе с протоном, и CO₂, который гидратируется до HCO₃⁻ и H⁺, поэтому ECAR включает вклад дыхания.</li><li>Чтобы оценить скорость образования лактата, переводят ECAR в скорость выхода протонов с помощью буферной ёмкости среды, вычитают вклад CO₂ и сверяют результат с измерением лактата в среде.</li></ol><p>На схеме клетки в монослое покрыты малым объёмом среды, в котором O₂-датчик и pH-датчик регистрируют изменения во времени. OCR — скорость убыли O₂, ECAR — скорость снижения pH, в единицах mpH/мин. Обе величины — наклоны кривых и зависят от числа клеток в лунке, поэтому показания нормируют на число клеток или содержание белка. Последовательность добавлений показана на схеме: потребление O₂, подавляемое олигомицином, соответствует дыханию, связанному с синтезом ATP; после FCCP достигается максимальное потребление O₂; остаточное потребление O₂ после ингибиторов комплексов I и III считают немитохондриальным (Brand и Nicholls, 2011).</p><p>Закисление среды вызывают два основных процесса: лактат, выходящий вместе с протоном, и CO₂, образующийся при окислении субстратов (в том числе в цикле трикарбоновых кислот). В замкнутом объёме CO₂ остаётся в среде, гидратируется до HCO₃⁻ и отдаёт протон. В работе Mookerjee и соавт. (2015) на миобластах C2C12 с глюкозой дыхательный CO₂ составлял 34 % закисления; при отсутствии глюкозы или замене её пальмитатом либо пируватом — 67–100 %; в разных линиях клеток эта доля составляла от 3 до 100 %. При малой и постоянной доле CO₂ изменение ECAR примерно пропорционально изменению потока в лактат; при изменении дыхания (после олигомицина или FCCP) это допущение нарушается.</p><p>Поэтому ECAR пересчитывают: переводят в скорость выхода протонов с помощью буферной ёмкости среды, определённой титрованием кислотой (на схеме — контроль «буферная ёмкость среды»), вычитают вклад CO₂, рассчитанный по OCR за вычетом немитохондриального потребления O₂, и нормируют результат. Для проверки лактат измеряют в среде отдельным методом (на схеме — строка «лактат в среде: отдельное измерение»; Mookerjee и Brand, 2015). Расчёт скорости образования ATP требует ещё и модели сопряжения: OCR включает немитохондриальную часть и потребление O₂, не связанное с синтезом ATP.</p><div class="note trap"><strong>Типичная ошибка</strong> ECAR прямо измеряет скорость образования лактата.<p class="trap-fix">ECAR — скорость изменения pH. Чтобы перейти к потоку лактата, нужны буферная ёмкость, поправка на дыхательный CO₂ и нормировка, а результат сверяют с измерением лактата в среде.</p></div><div class="static-quiz"><h3>При одинаковом числе жизнеспособных клеток ECAR возрос; доля дыхательного CO₂ в закислении не измерена. Какой вывод допустим?</h3><ol><li><b>А.</b> Поток в лактат вырос пропорционально ECAR, поскольку закисление определяется образованием лактата. <i>(неверный вариант)</i><br><span class="expl">Пропорциональность выполняется только при малой и постоянной доле дыхательного CO₂ и известной буферной ёмкости; здесь доля не измерена.</span></li><li><b>Б.</b> Скорость синтеза ATP митохондриями выросла, так как закисление среды усилилось. <i>(неверный вариант)</i><br><span class="expl">ECAR непосредственно не измеряет митохондриальный синтез ATP; закисление создают и лактат, и CO₂.</span></li><li><b>В.</b> Внеклеточное закисление усилилось; доля лактата в нём без дополнительных измерений не определена. <i>(верный вариант)</i><br><span class="expl">pH-датчик регистрирует суммарный эффект, включая вклад дыхательного CO₂.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-8.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbabio.2014.10.005">Mookerjee S. A. et al. The contributions of respiration and glycolysis to extracellular acid production. Biochim Biophys Acta. 2015;1847:171–181.</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4692795/">Mookerjee S. A., Brand M. D. Measurement and Analysis of Extracellular Acid Production to Determine Glycolytic Rate. JoVE. 2015;106:53464.</a></li><li><a href="https://doi.org/10.1042/BJ20110162">Brand M. D., Nicholls D. G. Assessing mitochondrial dysfunction in cells. Biochem J. 2011;435:297–312.</a></li></ul><p>Кривые и числа на схеме учебные: условные единицы, постоянное образование лактата и 1 H⁺ на 1 молекулу O₂ (при дыхательном коэффициенте около 1 это соответствует 1 H⁺ на 1 молекулу CO₂) — допущения модели, а не данные опыта. Доли CO₂ (34 %; 67–100 %; 3–100 %) приведены по Mookerjee и соавт. (2015; полный текст) для C2C12 и других линий; пересчёт ECAR и контроль — по методической статье Mookerjee и Brand (JoVE, 2015), прочитанной в полном тексте. Назначение ингибиторов в тесте и показатели клеточного дыхательного контроля — по Brand и Nicholls (2011; по аннотации).</p></details></article><article class="card print-unit" id="ns-tca"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 8 из 32</div><h2>Почему цикл трикарбоновых кислот участвует и в окислении, и в биосинтезе</h2><p class="lead"><a href="#ns-g-S8-T22">Цикл трикарбоновых кислот</a> (ЦТК) окисляет ацетильную группу ацетил-CoA и регенерирует оксалоацетат. Его <a href="#ns-g-S8-T24">промежуточные соединения</a> служат также исходными веществами для биосинтеза, поэтому ЦТК называют <a href="#ns-g-S8-T23">амфиболическим путём</a>: он сочетает катаболическую и анаболическую роли.</p><ol class="mech"><li>Цитратсинтаза присоединяет ацетильную группу к оксалоацетату с образованием цитрата; в конце оборота оксалоацетат регенерируется.</li><li>За один полный окислительный оборот на одну вошедшую ацетильную группу образуются три NADH, одна молекула убихинола (QH₂; электроны от сукцината через связанный с SDH FAD), одна молекула GTP или ATP и две молекулы CO₂.</li><li>Электроны NADH и QH₂ передаются дыхательной цепи; если передача электронов нарушена, NAD⁺ и окисленный убихинон не регенерируются, и дегидрогеназные реакции цикла замедляются.</li></ol><p>Цикл начинается реакцией цитратсинтазы: ацетильная группа ацетил-CoA присоединяется к <a href="#ns-g-S8-T32">оксалоацетату</a>, и образуется цитрат. Затем аконитаза превращает цитрат в изоцитрат, изоцитратдегидрогеназа IDH3 окисляет изоцитрат до <a href="#ns-g-S8-T33">α-кетоглутарата</a> (α-КГ), α-кетоглутаратдегидрогеназа (α-КГДГ) — α-КГ до сукцинил-CoA, а сукцинил-CoA-синтетаза (SCS) образует сукцинат. Сукцинат окисляется сукцинатдегидрогеназой (<a href="#ns-g-S8-T36">SDH</a>, комплекс II) до фумарата, фумараза присоединяет воду с образованием малата, и малатдегидрогеназа вновь образует оксалоацетат.</p><p>Окислительные реакции переносят электроны на коферменты. IDH3, α-КГДГ и малатдегидрогеназа восстанавливают NAD⁺ до NADH, причём IDH3 и α-КГДГ выделяют по одной молекуле CO₂. SDH восстанавливает прочно связанный с ней FAD и передаёт электроны убихинону; свободный FADH₂ из фермента не выходит. SCS использует энергию тиоэфирной связи сукцинил-CoA для фосфорилирования GDP или ADP. Эти количества относятся к одному полному обороту на одну ацетильную группу. Два выделяющихся CO₂ образуются из углерода оксалоацетата, а не из ацетильной группы, вошедшей в том же обороте; углерод этой группы выделится в виде CO₂ в последующих оборотах (см. шаг про катаплероз).</p><p>В реакциях цикла O₂ не является субстратом. Однако работа цикла зависит от дыхательной цепи: NADH и QH₂ должны окисляться, а NAD⁺ и окисленный убихинон — регенерироваться. Если передача электронов дыхательной цепи нарушена, доступность NAD⁺ и окисленного убихинона снижается, и дегидрогеназные реакции цикла замедляются.</p><p>Те же промежуточные соединения служат исходными веществами для биосинтеза: из цитрата образуется ацетил-CoA для липидов, из оксалоацетата — аспартат, из α-КГ — глутамат, из сукцинил-CoA — гем. Поэтому ЦТК одновременно окисляет субстраты и поставляет предшественники. Это не значит, что каждая реакция выполняет обе функции. В открытой сети с ответвлениями стехиометрия полного оборота не задаёт величину каждого реального потока.</p><div class="note trap"><strong>Типичная ошибка</strong> В каждой реакции цикла непосредственно расходуется O₂.<p class="trap-fix">O₂ не субстрат реакций цикла. Цикл зависит от дыхательной цепи, которая окисляет NADH и QH₂ и передаёт электроны на O₂; без этой передачи NAD⁺ и убихинон не регенерируются.</p></div><div class="static-quiz"><h3>Почему цикл трикарбоновых кислот называют амфиболическим путём?</h3><ol><li><b>А.</b> Кислород служит субстратом нескольких реакций цикла, поэтому цикл связан и с окислением, и с синтезом. <i>(неверный вариант)</i><br><span class="expl">В реакциях цикла O₂ не является субстратом; связь с ним опосредована дыхательной цепью.</span></li><li><b>Б.</b> Цикл образует ATP субстратным фосфорилированием и одновременно расходует его на синтез промежуточных соединений. <i>(неверный вариант)</i><br><span class="expl">В реакциях цикла ATP (GTP) образует только SCS, а расходуют его не реакции цикла; «амфиболический» — сочетание катаболической и анаболической функций.</span></li><li><b>В.</b> Его реакции окисляют ацетильную группу, а промежуточные соединения служат источником предшественников для биосинтеза. <i>(верный вариант)</i><br><span class="expl">Обе функции связаны общими промежуточными соединениями.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Основы молекулярной биологии клетки.</a></li></ul><p>Схема качественная: показаны реакции, коферменты и ответвления без концентраций и скоростей; ферменты цикла находятся в матриксе митохондрий, кроме SDH, встроенной во внутреннюю мембрану. Стехиометрия полного окислительного оборота приведена по учебникам биохимии (Ленинджер, т. 2; Альбертс); количества не относятся к конкретным клеткам.</p></details></article><article class="card print-unit" id="ns-cataplerosis"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 9 из 32</div><h2>Как отток промежуточных соединений связывает цикл с биосинтезом</h2><p class="lead"><a href="#ns-g-S8-T25">Катаплероз</a> — чистый отток промежуточных соединений ЦТК в другие метаболические пути. Он связывает цикл с биосинтезом; без компенсации притоком углеродных скелетов количество промежуточных соединений в цикле убывает.</p><ol class="mech"><li>Цитрат выходит из матрикса через переносчик внутренней мембраны; в цитозоле ATP-цитратлиаза образует из него ацетил-CoA для синтеза липидов.</li><li>Оксалоацетат превращается в аспартат, α-КГ — в глутамат, сукцинил-CoA вступает в синтез гема.</li><li>Если приток углеродных скелетов не равен оттоку, количество промежуточных соединений изменяется; при преобладании оттока оно снижается.</li></ol><p>Промежуточные соединения ЦТК образуются в одних реакциях цикла и расходуются в других, поэтому при полном обороте их количество не изменяется. Но те же соединения служат исходными веществами для биосинтеза. Выход соединения из цикла в другой путь называют катаплерозом, если он приводит к чистому оттоку. Не всякое превращение, при котором вещество покидает цикл, считают катаплерозом: обратимая обменная реакция, у которой прямое и обратное направления уравновешены, чистого оттока не создаёт.</p><p>Цитрат покидает матрикс митохондрии через переносчик внутренней мембраны. В цитозоле ATP-цитратлиаза (ACLY) расщепляет его на ацетил-CoA и оксалоацетат с затратой ATP, и ацетил-CoA используется для синтеза липидов. Остальные три отведения происходят в матриксе: оксалоацетат превращается в аспартат, α-КГ — в глутамат, а сукцинил-CoA вступает в синтез гема. Оксалоацетат практически не проходит через внутреннюю мембрану; из матрикса выходит аспартат. Оксалоацетат, образованный ACLY в цитозоле, может превращаться в аспартат (цитозольная аминотрансфераза GOT1; см. шаг про аспартат) или в малат, а малат — в пируват с образованием NADPH (малик-фермент).</p><p>Чтобы количество промежуточных соединений сохранялось, отток должен компенсироваться <a href="#ns-g-S8-T26">анаплерозом</a>: поступлением углеродных скелетов из других путей, например из пирувата или глутамина (см. следующие шаги). Если отток цитрата на синтез липидов длительно усилен, а приток не изменился, количество промежуточных соединений в матриксе снижается до установления нового стационарного состояния (см. шаг про поток и содержание метаболита), и скорость реакций цикла может ограничиваться их доступностью. При преобладании притока количество, наоборот, может расти, пока не изменятся скорости других реакций.</p><p>Для иллюстрации (условные единицы): при оттоке 3 условные единицы в минуту и притоке 1 условной единице в минуту чистая потеря составляет 2 условные единицы в минуту. Ацетил-CoA, входящий в цикл, чистого притока промежуточных соединений не создаёт. Два его атома углерода в последующих оборотах выделяются в виде CO₂, а реакций, превращающих ацетил-CoA в оксалоацетат без потери углерода, в клетках человека нет. Поэтому для восполнения нужны реакции, вводящие в цикл дополнительный углерод.</p><div class="note trap"><strong>Типичная ошибка</strong> Отток цитрата не влияет на цикл, потому что цитрат синтезируется заново из ацетил-CoA.<p class="trap-fix">Для образования нового цитрата нужен оксалоацетат, а ацетил-CoA его не пополняет. Если отток не компенсирован притоком углерода, количество промежуточных соединений убывает.</p></div><div class="static-quiz"><h3>Отведение цитрата на синтез липидов длительно усилилось, а восполнение промежуточных соединений не изменилось. Что может ограничить дальнейший поток через цикл?</h3><ol><li><b>А.</b> Снижение количества оксалоацетата и других промежуточных соединений цикла в матриксе. <i>(верный вариант)</i><br><span class="expl">Без компенсации оттока количество промежуточных соединений в цикле снижается.</span></li><li><b>Б.</b> Избыток NADPH, образующегося при переносе цитрата в цитозоль и подавляющего реакции цикла. <i>(неверный вариант)</i><br><span class="expl">Перенос цитрата NADPH не образует; образование NADPH зависит от последующих реакций в цитозоле.</span></li><li><b>В.</b> Накопление цитрата в матриксе, которое по принципу обратной связи блокирует цитратсинтазу. <i>(неверный вариант)</i><br><span class="expl">При усиленном выходе цитрата его содержание в матриксе снижается, а не растёт.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема качественная: показаны положение реакций (матрикс, цитозоль) и направления оттока и притока; числа не заданы. Расположение реакций приведено по учебнику биохимии (Ленинджер, т. 2).</p></details></article><article class="card print-unit" id="ns-pyruvate-carboxylase"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 10 из 32</div><h2>Как пируваткарбоксилаза восполняет оксалоацетат</h2><p class="lead"><a href="#ns-g-S8-T27">Пируваткарбоксилаза</a> (PC) присоединяет CO₂ в форме бикарбоната к пирувату и образует оксалоацетат, то есть восполняет промежуточные соединения цикла. Образование ацетил-CoA пируватдегидрогеназным комплексом (PDH) — другой вход пирувата в цикл, при котором оксалоацетат не восполняется.</p><ol class="mech"><li>PC катализирует ATP-зависимое карбоксилирование пирувата до оксалоацетата; простетическая группа PC — ковалентно связанный биотин; в клетках человека реакция идёт в митохондриальном матриксе.</li><li>PDH окисляет пируват до ацетил-CoA с выделением CO₂ и образованием NADH; PC и PDH дают разные продукты и служат разными входами в цикл.</li><li>Ацетил-CoA — аллостерический активатор PC, но поступление ацетил-CoA в цикл само по себе чистого восполнения оксалоацетата не даёт.</li></ol><p>Пируваткарбоксилаза катализирует реакцию: пируват + HCO₃⁻ + ATP → оксалоацетат + ADP + Pi. Реакция идёт в два этапа. Сначала ковалентно связанный с ферментом биотин (простетическая группа) карбоксилируется за счёт бикарбоната и ATP, затем карбоксильная группа переносится на пируват. Реакция не расходует NADH и не выделяет CO₂, а присоединяет его. В клетках человека PC находится в митохондриальном матриксе.</p><p>Пируват может войти в цикл двумя путями. PDH окисляет его до ацетил-CoA с выделением CO₂ и образованием NADH. Ацетильная группа присоединяется цитратсинтазой к уже имеющемуся оксалоацетату, поэтому общее количество промежуточных соединений не увеличивается. PC превращает пируват непосредственно в оксалоацетат, то есть в промежуточное соединение цикла, и количество четырёхуглеродных промежуточных соединений растёт. Таким образом, PC и PDH — разные входы пирувата в цикл.</p><p>Ацетил-CoA — аллостерический активатор PC: он связывается вне активного центра и повышает активность фермента, поэтому при высоком содержании ацетил-CoA в матриксе образование оксалоацетата из пирувата может усиливаться. Сам по себе ацетил-CoA оксалоацетат не восполняет: чистый приток даёт реакция, вводящая в цикл дополнительный углерод. Анаплеротический эффект проявляется, если образовавшийся оксалоацетат не потребляется целиком реакциями отведения (см. шаг про катаплероз).</p><p>PC — не единственный путь анаплероза, а её вклад различается между клетками. В клетках глиобластомы подавление глутаминазы вызывало компенсаторное усиление анаплероза с участием PC, а клетки (в том числе других линий) с высокой активностью PC не зависели от глутамина, но для роста им была необходима PC (Cheng и соавт., 2011). В клетках мыши с утратой SDH PC существенно поддерживает синтез аспартата (см. шаг про SDH).</p><div class="note trap"><strong>Типичная ошибка</strong> Если ацетил-CoA поступает в цикл, оксалоацетат тем самым восполняется.<p class="trap-fix">Ацетил-CoA присоединяется к уже имеющемуся оксалоацетату. Чистое восполнение даёт реакция, вводящая дополнительный углерод, например карбоксилирование пирувата, катализируемое PC.</p></div><div class="static-quiz"><h3>Для восполнения оксалоацетата из пирувата усилена реакция PC. Какие вещества непосредственно необходимы для этой реакции?</h3><ol><li><b>А.</b> Пируват, бикарбонат (источник CO₂) и ATP как источник энергии. <i>(верный вариант)</i><br><span class="expl">PC катализирует ATP-зависимое карбоксилирование пирувата; простетическая группа фермента — биотин.</span></li><li><b>Б.</b> Пируват, NAD⁺ и CoA с выделением CO₂ при образовании продукта. <i>(неверный вариант)</i><br><span class="expl">Так описывается окислительное декарбоксилирование пирувата комплексом PDH; PC присоединяет CO₂, а не выделяет его.</span></li><li><b>В.</b> Пируват, ацетил-CoA и ATP: ацетил-CoA присоединяется к пирувату. <i>(неверный вариант)</i><br><span class="expl">Ацетил-CoA — аллостерический активатор PC, а не субстрат; к пирувату он не присоединяется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1073/pnas.1016627108">Cheng T. et al. Pyruvate carboxylase is required for glutamine-independent growth of tumor cells. Proc Natl Acad Sci USA. 2011;108:8674–8679.</a></li><li><a href="https://doi.org/10.1038/ncb3233">Cardaci S. et al. Pyruvate carboxylation enables growth of SDH-deficient cells by supporting aspartate biosynthesis. Nat Cell Biol. 2015;17:1317–1326.</a></li></ul><p>Схема качественная: показаны вещества, коферменты и два входа пирувата в цикл; числа не заданы. Реакция PC и активация ацетил-CoA приведены по учебнику биохимии (Ленинджер, т. 2); различия вклада PC описаны на культивируемых клетках (Cheng и соавт., 2011 — прочитана аннотация; Cardaci и соавт., 2015).</p></details></article><article class="card print-unit" id="ns-glutamine-anaplerosis"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 11 из 32</div><h2>Как углерод глутамина пополняет цикл</h2><p class="lead">Углерод глутамина входит в цикл в несколько этапов: <a href="#ns-g-S8-T30">глутаминаза</a> (GLS) превращает глутамин в глутамат, а затем другая реакция превращает глутамат в α-КГ. Вклад глутамина в анаплероз различается между клетками и не во всех клетках является главным.</p><ol class="mech"><li>GLS гидролизует амидную группу глутамина с образованием глутамата и NH₄⁺; α-КГ в этой реакции не образуется.</li><li>Глутамат превращается в α-КГ трансаминированием, при котором аминогруппа переходит на кетокислоту, или окислительным дезаминированием глутаматдегидрогеназой (GDH) с выделением NH₄⁺.</li><li>α-КГ превращается по окислительному пути в сукцинил-CoA или по восстановительному в изоцитрат; вклад глутамина и PC различается между клеточными линиями.</li></ol><p>Глутамин содержит пять атомов углерода и два атома азота, амидный и аминный. GLS гидролизует амидную группу: глутамин + H₂O → глутамат + NH₄⁺. Углеродный скелет при этом не меняется, и α-КГ не образуется, поэтому одной активности GLS недостаточно, чтобы углерод глутамина вошёл в цикл.</p><p>Превращение глутамата в α-КГ идёт двумя способами. При <a href="#ns-g-S8-T31">трансаминировании</a> аминотрансфераза переносит аминогруппу глутамата на кетокислоту-акцептор, например на оксалоацетат, и образуются α-КГ и аминокислота, в этом примере аспартат. Глутаматдегидрогеназа окисляет глутамат до α-КГ и отщепляет аммоний; NAD⁺ или NADP⁺ при этом восстанавливается до NADH или NADPH. В первом случае азот остаётся в составе аминокислоты, во втором выходит в виде NH₄⁺.</p><p>Далее α-КГ превращается в окислительном направлении через сукцинил-CoA и сукцинат или в восстановительном через изоцитрат и цитрат. Восстановительное направление — это реакция IDH1 или IDH2, обратная образованию NADPH: α-КГ + CO₂ + NADPH → изоцитрат (см. шаг про восстановительное карбоксилирование). Вклад глутамина различается. В одной линии клеток глиобластомы оксалоацетат для цикла образовывался из глутамина при низкой активности карбоксилирования пирувата (DeBerardinis и соавт., 2007), а при подавлении GLS возрастала роль PC (Cheng и соавт., 2011). О судьбе углерода глутамина при утрате SDH см. шаг про SDH.</p><p>Есть и другие входы. Пропионил-CoA, образующийся, например, при расщеплении некоторых аминокислот (валина, изолейцина, метионина, треонина) и жирных кислот с нечётным числом атомов углерода, карбоксилируется до метилмалонил-CoA; B₁₂-зависимая метилмалонил-CoA-мутаза превращает его в сукцинил-CoA. Поэтому глутамин нельзя считать главным источником восполнения для всех клеток. Какой вход преобладает, зависит от типа клеток и условий; это определяют экспериментально, например по распределению метки ¹³C; метод показан на схеме в шаге про прослеживание углерода.</p><div class="note trap"><strong>Типичная ошибка</strong> GLS превращает глутамин в α-КГ, поэтому её активности достаточно для восполнения цикла.<p class="trap-fix">GLS освобождает аммоний из амидной группы глутамина. α-КГ образуется только после следующего превращения глутамата: трансаминирования или окислительного дезаминирования.</p></div><div class="static-quiz"><h3>В клетке активна GLS, но превращение глутамата в α-КГ ограничено. Достаточно ли активности GLS для поступления углерода глутамина в цикл?</h3><ol><li><b>А.</b> Да: глутамат, образованный GLS, сам является промежуточным соединением цикла. <i>(неверный вариант)</i><br><span class="expl">Глутамат не относится к промежуточным соединениям цикла; его углерод поступает в цикл через α-КГ.</span></li><li><b>Б.</b> Нет: необходима следующая реакция, которая образует α-КГ из глутамата. <i>(верный вариант)</i><br><span class="expl">GLS образует глутамат; для включения его углерода в цикл нужен дополнительный этап.</span></li><li><b>В.</b> Нет: глутамат входит в цикл только после превращения в оксалоацетат. <i>(неверный вариант)</i><br><span class="expl">Глутамат превращается в α-КГ трансаминированием или с участием GDH, а не в оксалоацетат.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1073/pnas.0709747104">DeBerardinis R. J. et al. Beyond aerobic glycolysis: transformed cells can engage in glutamine metabolism that exceeds the requirement for protein and nucleotide synthesis. Proc Natl Acad Sci USA. 2007;104:19345–19350.</a></li><li><a href="https://doi.org/10.1073/pnas.1016627108">Cheng T. et al. Pyruvate carboxylase is required for glutamine-independent growth of tumor cells. Proc Natl Acad Sci USA. 2011;108:8674–8679.</a></li><li><a href="https://doi.org/10.1038/ncomms9784">Lussey-Lepoutre C. et al. Loss of succinate dehydrogenase activity results in dependency on pyruvate carboxylation for cellular anabolism. Nat Commun. 2015;6:8784.</a></li></ul><p>Схема качественная: показаны превращения углерода и азота глутамина. Различия вклада глутамина и PC получены на культивируемых клетках (глиобластома; SDH-дефицитные клетки мыши) и не обобщаются на все клетки (DeBerardinis и соавт., 2007 — полный текст; Cheng и соавт., 2011 — прочитана аннотация; Lussey-Lepoutre и соавт., 2015).</p></details></article><article class="card print-unit" id="ns-sdh-and-compensation"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 12 из 32</div><h2>Почему обходной приток не устраняет потерю SDH</h2><p class="lead">Если <a href="#ns-g-S8-T36">SDH</a> утрачена, сукцинат не окисляется до фумарата и накапливается. Приток углерода через PC может поддерживать синтез аспартата, но сам по себе не устраняет нарушение реакции SDH.</p><ol class="mech"><li>SDH окисляет сукцинат до фумарата и передаёт электроны от связанного FAD убихинону; фумараза присоединяет воду к фумарату.</li><li>При утрате SDH сукцинат накапливается, образование фумарата из сукцината прерывается, а содержание фумарата и малата снижается; в исследованных моделях снижено и содержание аспартата.</li><li>Оксалоацетат образуется из пирувата под действием PC независимо от SDH, что поддерживает синтез аспартата; реакция сукцинат → фумарат при этом остаётся нарушенной.</li></ol><p>SDH — комплекс II дыхательной цепи и единственный фермент ЦТК, встроенный во внутреннюю мембрану митохондрии. Она окисляет <a href="#ns-g-S8-T34">сукцинат</a> до <a href="#ns-g-S8-T35">фумарата</a>: электроны переходят на прочно связанный FAD, а затем на убихинон. <a href="#ns-g-S8-T37">Фумараза</a> (FH) гидратирует фумарат до малата. Потеря FH и потеря SDH — разные нарушения: при потере FH накапливается фумарат, при потере SDH — сукцинат.</p><p>При утрате SDH реакция сукцинат → фумарат не идёт, а сукцинат продолжает образовываться, поэтому он накапливается. В хромаффинных клетках мыши с делецией Sdhb и в опухолях человека с мутациями SDH накапливается сукцинат и снижено содержание аспартата; в клетках мыши ниже также содержание фумарата, малата и цитрата (Lussey-Lepoutre и соавт., 2015). Углерод глутамина включается в сукцинат, но по окислительному пути метка в малат и аспартат не переходит.</p><p>Аспартат образуется из оксалоацетата, а его синтез требует акцепторов электронов, которые регенерируются при работе дыхательной цепи (Sullivan и соавт., 2015). Образование оксалоацетата из пирувата реакцией PC акцептора электронов не требует, в отличие от окисления малата малатдегидрогеназой, которой нужен NAD⁺. При утрате SDH оксалоацетат в митохондриях образуется из пирувата под действием PC: по включению метки ¹³C из глюкозы (метод показан на схеме в шаге про прослеживание углерода) выявлен возросший вклад PC в аспартат, а подавление PC прекращало рост клеток без SDH и мало влияло на клетки дикого типа (Lussey-Lepoutre и соавт., 2015; Cardaci и соавт., 2015). Опыты проводили на клетках в среде с пируватом.</p><p>Поддержание содержания аспартата обходным путём не возвращает активность комплекса II. Реакция сукцинат → фумарат остаётся нарушенной, сукцинат продолжает накапливаться, и накопление сукцината конкурентно с α-КГ ингибирует α-КГ-зависимые диоксигеназы, в том числе деметилазы гистонов (Xiao и соавт., 2012; см. шаг про нарушения SDH, FH и IDH). Степень компенсации зависит от типа клеток и от других потоков углерода.</p><div class="note trap"><strong>Типичная ошибка</strong> Если усиленная PC поддерживает синтез аспартата, функция SDH возвращена.<p class="trap-fix">Обходной путь пополняет оксалоацетат и поддерживает аспартат; реакция сукцинат → фумарат остаётся нарушенной, и сукцинат продолжает накапливаться.</p></div><div class="static-quiz"><h3>При утрате SDH усиление PC ослабило нехватку аспартата. Что это означает для реакции SDH?</h3><ol><li><b>А.</b> Усиленная PC частично взяла на себя окисление сукцината, поэтому его накопление уменьшилось. <i>(неверный вариант)</i><br><span class="expl">У PC другая реакция и другие субстраты; окисление сукцината катализирует SDH.</span></li><li><b>Б.</b> Поддержание аспартата показывает, что комплекс II частично возобновил работу в дыхательной цепи. <i>(неверный вариант)</i><br><span class="expl">Аспартат можно поддержать обходным путём, не устраняя первичный дефект; по его содержанию активность SDH не определяют.</span></li><li><b>В.</b> Нехватка аспартата ослаблена за счёт PC, но превращение сукцината в фумарат по-прежнему нарушено. <i>(верный вариант)</i><br><span class="expl">PC образует оксалоацетат независимо от реакции сукцинат → фумарат.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1038/ncomms9784">Lussey-Lepoutre C. et al. Loss of succinate dehydrogenase activity results in dependency on pyruvate carboxylation for cellular anabolism. Nat Commun. 2015;6:8784.</a></li><li><a href="https://doi.org/10.1038/ncb3233">Cardaci S. et al. Pyruvate carboxylation enables growth of SDH-deficient cells by supporting aspartate biosynthesis. Nat Cell Biol. 2015;17:1317–1326.</a></li><li><a href="https://doi.org/10.1101/gad.191056.112">Xiao M. et al. Inhibition of α-KG-dependent histone and DNA demethylases by fumarate and succinate that are accumulated in mutations of FH and SDH tumor suppressors. Genes Dev. 2012;26:1326–1338.</a></li></ul><p>Схема качественная: показано, какие реакции остаются при утрате SDH. Данные получены на клетках мыши с делецией Sdhb (хромаффинные клетки, фибробласты надпочечника, клетки почки) и на опухолях человека с мутациями SDH; в других клетках вклад PC и степень компенсации могут отличаться (Lussey-Lepoutre и соавт., 2015; Cardaci и соавт., 2015).</p></details></article><article class="card print-unit" id="ns-reductive-carboxylation"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 13 из 32</div><h2>Как α-кетоглутарат может использоваться для образования цитрата</h2><p class="lead"><a href="#ns-g-S8-T38">Восстановительное карбоксилирование α-КГ</a> образует изоцитрат из α-КГ, CO₂ и NADPH, а затем изоцитрат может превращаться в цитрат. Это обращение лишь части реакций ЦТК; оно не связано с образованием R-2-HG.</p><ol class="mech"><li>В окислительном направлении α-КГ превращается в сукцинил-CoA с выделением одного CO₂ и образованием NADH.</li><li>В обратном направлении NADPH-зависимые IDH1 (преимущественно цитозоль) и IDH2 (матрикс) присоединяют CO₂ к α-КГ и расходуют NADPH; образуется изоцитрат, из которого получается цитрат.</li><li>Мутантная IDH1 катализирует другую реакцию: α-КГ + NADPH → R-2-HG, и цитрат при этом не образуется.</li></ol><p>У α-КГ есть два направления превращения. В окислительном направлении α-кетоглутаратдегидрогеназа (α-КГДГ) превращает α-КГ в сукцинил-CoA с выделением CO₂ и образованием NADH, и углерод переходит дальше к сукцинату и оксалоацетату. В восстановительном направлении изоцитратдегидрогеназы IDH1 и IDH2 катализируют реакцию, обратную прямой: прямая реакция — изоцитрат → α-КГ + CO₂ с образованием NADPH, обратная — α-КГ + CO₂ + NADPH → изоцитрат, то есть NADPH расходуется. Изоцитрат аконитаза превращает в цитрат. IDH1 находится преимущественно в цитозоле (и в пероксисомах), IDH2 — в митохондриальном матриксе; какая изоформа обеспечивает реакцию, зависит от клеток и условий.</p><p>Метка, характерная для этого пути, обнаруживалась во многих культивируемых линиях; вклад пути в чистый поток различается и возрастает при гипоксии, утрате белка VHL и нарушении работы дыхательной цепи. В части гипоксических линий глутамин становился главным источником цитрата (Wise и соавт., 2011). По данным Metallo и соавт. (2012), при гипоксии и при утрате белка VHL синтез липидов в большей мере зависел от восстановительного использования глутамина через IDH1. Путь преобладал в опухолевых клетках с мутациями комплексов I и III дыхательной цепи, при утрате FH и при острой блокаде дыхательной цепи (Mullen и соавт., 2012). Опыты проводили на культивируемых клетках, и вклад пути различался между линиями.</p><p>Это обращение только части реакций цикла, от α-КГ к цитрату, а не всего ЦТК. Вклад пути зависел от отношения содержания α-КГ к содержанию цитрата: восстановительный путь усиливался при воздействиях, которые повышали это отношение, например при нарушении превращения ацетил-CoA в цитрат (Fendt и соавт., 2013). Реакции IDH1 и IDH2 обратимы, поэтому часть метки ¹³C в цитрате может отражать обмен изоцитрат ⇄ α-КГ без чистого потока (метод показан на схеме в шаге про прослеживание углерода).</p><p>Мутантная IDH1 катализирует другую реакцию. Для IDH1 R132H показано, что фермент приобретает способность восстанавливать α-КГ до R-2-гидроксиглутарата (R-2-HG) за счёт NADPH (Dang и соавт., 2009). R-2-HG не входит в путь образования цитрата. 2-Гидроксиглутарат и α-КГ (2-оксоглутарат) — разные вещества (см. шаг про нарушения SDH, FH и IDH).</p><div class="note trap"><strong>Типичная ошибка</strong> Восстановительное карбоксилирование — то же, что образование R-2-HG мутантной IDH.<p class="trap-fix">Это разные реакции. Восстановительное карбоксилирование образует изоцитрат и цитрат и расходует NADPH и CO₂, а мутантная IDH превращает α-КГ в R-2-HG.</p></div><div class="static-quiz"><h3>Что непосредственно образуется при восстановительном карбоксилировании α-КГ ферментами IDH1 и IDH2?</h3><ol><li><b>А.</b> R-2-HG, который затем служит предшественником цитрата. <i>(неверный вариант)</i><br><span class="expl">R-2-HG не входит в путь образования цитрата; его образует мутантная IDH отдельной реакцией.</span></li><li><b>Б.</b> Изоцитрат, из которого далее может образоваться цитрат. <i>(верный вариант)</i><br><span class="expl">Реакция включает карбоксилирование и восстановление α-КГ за счёт NADPH; она обратна образованию NADPH при окислении изоцитрата.</span></li><li><b>В.</b> Сукцинил-CoA с выделением CO₂ и образованием NADH. <i>(неверный вариант)</i><br><span class="expl">Так описывается окислительное превращение α-КГ с участием α-КГДГ; при восстановительном карбоксилировании CO₂ присоединяется, а NADPH расходуется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1073/pnas.1117773108">Wise D. R. et al. Hypoxia promotes isocitrate dehydrogenase-dependent carboxylation of α-ketoglutarate to citrate to support cell growth and viability. PNAS. 2011;108:19611–19616.</a></li><li><a href="https://doi.org/10.1038/nature10602">Metallo C. M. et al. Reductive glutamine metabolism by IDH1 mediates lipogenesis under hypoxia. Nature. 2012;481:380–384.</a></li><li><a href="https://doi.org/10.1038/nature10642">Mullen A. R. et al. Reductive carboxylation supports growth in tumour cells with defective mitochondria. Nature. 2012;481:385–388.</a></li><li><a href="https://doi.org/10.1038/ncomms3236">Fendt S.-M. et al. Reductive glutamine metabolism is a function of the α-ketoglutarate to citrate ratio in cells. Nat Commun. 2013;4:2236.</a></li><li><a href="https://doi.org/10.1038/nature08617">Dang L. et al. Cancer-associated IDH1 mutations produce 2-hydroxyglutarate. Nature. 2009;462:739–744.</a></li></ul><p>Схема качественная: показаны два направления превращения α-КГ и отдельная реакция мутантной IDH. Восстановительный путь описан в культивируемых клетках при гипоксии, дефектах дыхательной цепи, утрате FH или VHL; результат зависит от линии и условий (Metallo и соавт., 2012; Mullen и соавт., 2012; Wise и соавт., 2011 — прочитана аннотация; Dang и соавт., 2009 — аннотация).</p></details></article><article class="card print-unit" id="ns-carbon-tracing"><div class="eyebrow">ЦТК, катаплероз и анаплероз · шаг 14 из 32</div><h2>Как проследить происхождение углерода и не спутать мечение с потоком</h2><p class="lead">При прослеживании углерода в среду вводят ¹³C-меченый субстрат и по <a href="#ns-g-S8-T39">изотопологам</a> продуктов судят, по какому пути превращался углерод. Это определение маршрута при названных условиях, а не измерение величины потока.</p><ol class="mech"><li>Меченый субстрат вносят в среду, и атомы ¹³C переходят в продукты реакций.</li><li>LC–MS разделяет вещества и различает изотопологи по массе; доля изотополога показывает, какая часть молекул содержит n меченых атомов.</li><li>В первом обороте цикла из [U-¹³C₅]глутамина окислительный путь даёт цитрат M+4, восстановительный — M+5; доля изотополога при этом не равна величине потока.</li></ol><p>¹³C — стабильный изотоп углерода. Если часть глутамина в среде заменить на <a href="#ns-g-S8-T42">универсально меченый</a> [U-¹³C₅]глутамин, во всех его молекулах пять атомов углерода будут ¹³C, и на схеме (панель M02) видно, какие из них сохранятся в продукте. При окислительном превращении α-КГ в сукцинил-CoA один атом ¹³C выделяется в виде CO₂, а немеченый ацетил-CoA добавляет два атома ¹²C, поэтому в первом обороте цикла цитрат содержит четыре меченых атома. Если же α-КГ присоединяет CO₂, не теряя углерода, а источник CO₂ немечен, в цитрате остаются все пять меченых атомов.</p><p>Вещества извлекают из клеток и анализируют методом <a href="#ns-g-S8-T80">LC–MS</a> (на схеме — панель M03): жидкостная хроматография разделяет компоненты смеси по времени удерживания, а масс-спектрометр регистрирует ионы по отношению массы к заряду. Молекулы, различающиеся числом ¹³C, называют изотопологами и обозначают <a href="#ns-g-S8-T41">M+n</a>, где n — число меченых атомов. Молекулы с тем же числом ¹³C в разных положениях — <a href="#ns-g-S8-T40">изотопомеры</a>; подсчёт M+n их не различает. <a href="#ns-g-S8-T43">Доля меченого изотополога</a> — отношение его количества к сумме всех изотопологов соединения после поправки на естественный ¹³C.</p><p>Доля изотополога не равна потоку. Она зависит от доли ¹³C в источнике, от разведения метки немечеными источниками, от времени мечения и числа оборотов, от обмена изоцитрата и α-КГ. Кроме того, экстракт целых клеток усредняет компартменты. В этом учебном примере показан первый оборот цикла, то есть мечение до установления изотопного стационарного состояния. При количественной интерпретации различают изотопное стационарное состояние и переходное мечение; способ расчёта выбирают с учётом времени мечения и того, находится ли метаболизм в стационарном состоянии (Buescher и соавт., 2015). Поэтому одну и ту же долю M+4 могут дать разные сочетания вклада пути и доли метки, а абсолютный поток требует модели и дополнительных измерений.</p><div class="note trap"><strong>Типичная ошибка</strong> Доля M+5 в цитрате равна скорости восстановительного карбоксилирования.<p class="trap-fix">Доля изотополога показывает долю в пуле при заданных условиях, а не скорость; поток требует учёта разведения метки, обмена, времени мечения и модели.</p></div><div class="static-quiz"><h3>Клетки культивировали с [U-¹³C₅]глутамином, остальные источники углерода и CO₂ немечены. В первом обороте цикла обнаружен цитрат M+5. Какой вывод допустим?</h3><ol><li><b>А.</b> M+5 согласуется с окислительным превращением α-КГ, при котором меченый CO₂ выделяется. <i>(неверный вариант)</i><br><span class="expl">При окислительном превращении один меченый атом выделяется в виде ¹³CO₂, и в первом обороте образуется цитрат M+4, а не M+5.</span>
