":"hide","b2":"hide","b3":"hide","nrf2":"on","p62":"on","keap":"low","auto":"on","deg":"low"},"e":{"ae0":"hide","ae1":"hide","ae2":"hide","be0":"hide","be1":"hide","be2":"hide","k":"off","dn":"off"},"note":"Содержание p62 повышено за счёт синтеза. p62 связывается с доменом Kelch KEAP1 и ослабляет связывание NRF2, вытесняя его мотив DLG, а комплексы p62–KEAP1 удаляются аутофагией. Разрушение NRF2 замедляется, NRF2 накапливается и усиливает транскрипцию гена SQSTM1 — петля замкнута, и её знак положительный.","bars":[["Содержание p62",3],["KEAP1, доступный для NRF2",1],["Содержание NRF2",3]]},"2":{"n":{"a0":"hide","a1":"hide","a2":"hide","a3":"hide","b0":"hide","b1":"hide","b2":"hide","b3":"hide","nrf2":"on","p62":"on","keap":"low","auto":"abs","deg":"low"},"e":{"ae0":"hide","ae1":"hide","ae2":"hide","be0":"hide","be1":"hide","be2":"hide","k":"off","dn":"off","a":"off"},"note":"Аутофагия нарушена: p62 не удаляется и накапливается, хотя его синтез не обязательно усилен. Накопившийся p62 связывает KEAP1, и NRF2 стабилизируется. Так было в печени мышей с выключенным геном Atg7. По одному содержанию p62 нельзя сказать, что изменилось — синтез или удаление.","bars":[["Содержание p62",3],["KEAP1, доступный для NRF2",1],["Содержание NRF2",3]]},"3":{"n":{"nrf2":"hide","p62":"hide","keap":"hide","auto":"hide","deg":"hide","a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{"ind":"hide","b":"hide","k":"hide","dn":"hide","a":"hide"},"t":{"a0":"Короткий\nимпульс\nметки","a1":"Удаление\nсвободной\nметки","a2":"Пробы в\nодинаковые\nсроки","a3":"Остаток\nмеченого\np62","b0":"Короткий\nимпульс\nметки","b1":"Удаление\nсвободной\nметки","b2":"Те же сроки,\nаутофагия\nподавлена","b3":"Сравнение\nскорости\nисчезновения"},"tn":{"a0":"Импульс\nметки","a1":"Удаление\nсвободной метки","a2":"Пробы в\nодни сроки","a3":"Остаток\nмеченого p62","b0":"Импульс\nметки","b1":"Удаление\nсвободной метки","b2":"Те же сроки,\nбез аутофагии","b3":"Сравнение\nисчезновения"},"m":[["Что измеряется","исчезновение меченой популяции p62 во времени"],["Контроль","одинаковые сроки и число клеток; нет повторного включения метки"]],"note":"Метод: прослеживание меченой белковой популяции. Белки метят коротким импульсом, затем удаляют свободную метку и в одинаковые сроки определяют, сколько меченого p62 осталось. Если при подавленной аутофагии меченый p62 исчезает медленнее, удаление зависит от аутофагии. Одно конечное содержание без временного ряда не разделяет синтез и распад."},"4":{"n":{"nrf2":"hide","p62":"hide","keap":"hide","auto":"hide","deg":"hide","a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{"ind":"hide","b":"hide","k":"hide","dn":"hide","a":"hide"},"t":{"a0":"RNAi или\nредакти-\nрование гена","a1":"Проверка\nРНК и\nбелка","a2":"Заданный\nстимул","a3":"Ответ:\nNRF2 и\nмишени","b0":"Клетки\nбез функции\nгена","b1":"Возврат\nпродукта\nгена","b2":"Проверка\nколичества\nи места","b3":"Сравнение\nответа"},"tn":{"a0":"RNAi или\nредактирование","a1":"Проверка\nРНК и белка","a2":"Заданный\nстимул","a3":"Ответ: NRF2\nи мишени","b0":"Клетки без\nфункции гена","b1":"Возврат\nпродукта","b2":"Проверка\nколичества, места","b3":"Сравнение\nответа"},"m":[["Что измеряется","необходимость звена (например, p62) для ответа"],["Контроль","независимые воздействия на мишень; восстановление функции"]],"note":"Метод: генетическое нарушение и восстановление функции. Ген (например, SQSTM1) выключают с помощью RNAi или редактирования генома, проверяют уменьшение РНК и белка и сравнивают ответ NRF2 со стимулом и без него. Затем возвращают функциональный продукт: если ответ восстанавливается, вывод о необходимости звена надёжнее. Нокдаун не равен полному отсутствию белка, а длительная потеря гена меняет клетку."}},"notes_svg":[{"t":"Прослеживание меченого p62","x":14,"y":14,"a":"start","only":["3"],"b":true,"n":[8,16],"tn":"Меченый p62"},{"t":"Тот же эксперимент при подавленной аутофагии","x":14,"y":142,"a":"start","only":["3"],"b":true,"n":[8,182],"tn":"Аутофагия подавлена"},{"t":"Выключение гена (например, SQSTM1)","x":14,"y":14,"a":"start","only":["4"],"b":true,"n":[8,16],"tn":"Выключение гена"},{"t":"Восстановление функции","x":14,"y":142,"a":"start","only":["4"],"b":true,"n":[8,182],"tn":"Восстановление"}],"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"nrf2-context","number":20,"section":2,"title":"Почему кратковременная защита и постоянная активность NRF2 имеют разные последствия","question":3,"questions":[3],"keywords":["NRF2","KEAP1","мутация KEAP1","NFE2L2","немелкоклеточный рак лёгкого","опухолевая клетка","утрата гетерозиготности","OxyR","кратковременный ответ","постоянная активация"],"lead":["Кратковременный ответ NRF2 на электрофил и постоянная активность NRF2 при нарушенном KEAP1 различаются прежде всего длительностью и зависимостью от внешнего стимула.","Поэтому одна и та же защитная программа может способствовать адаптации нормальной клетки и поддерживать выживание опухолевой."],"mechanism":["В нормальной клетке электрофил временно ослабляет KEAP1-зависимое разрушение NRF2; после удаления электрофила разрушение восстанавливается, и программа ослабевает.","Мутации и утрата гена KEAP1 в опухолевых клетках ослабляют разрушение NRF2 постоянно, и NRF2-зависимая транскрипция сохраняется без внешнего стимула.","Биологическое значение постоянной активности зависит от типа клетки и этапа процесса; его нельзя свести к оценке «полезно» или «вредно»."],"paragraphs":["В нормальной клетке ответ NRF2 ограничен во времени. Электрофил модифицирует KEAP1, разрушение NRF2 замедляется, и транскрипция генов-мишеней усиливается. Ферменты-мишени ускоряют обезвреживание электрофила; когда воздействие заканчивается, вновь синтезированный KEAP1 и разрушение модифицированного KEAP1 восстанавливают исходное разрушение NRF2. Так программа включается на время действия стимула и затем ослабевает.","В опухолевых клетках регуляция может быть нарушена постоянно. Singh и соавт. (2006) секвенировали ген KEAP1 в 12 линиях клеток и 54 образцах немелкоклеточного рака лёгкого. Соматические мутации нашли в шести линиях и в десяти опухолях; все они затрагивали домен Kelch или промежуточную область, а утрата второго аллеля была частой. В клетках со сниженной активностью KEAP1 NRF2 накапливался в ядре, и транскрипция генов антиоксидантной защиты, обезвреживания чужеродных веществ и выведения лекарств усиливалась. В такой клетке программа работает и без внешнего стимула.","Отсюда следует, что одна и та же программа имеет разные последствия в разных условиях. Кратковременный ответ облегчает адаптацию к электрофилам и окислителям. Постоянная активность в опухолевой клетке может поддерживать её выживание; авторы связывают её с устойчивостью к химиотерапевтическим веществам. Это наблюдение о молекулярном механизме, а не прогноз для больного и не основание для выбора лечения.","Похожие решения встречаются у далёких организмов. У кишечной палочки транскрипционный фактор OxyR активируется при образовании дисульфидной связи между его цистеинами под действием пероксида водорода и усиливает транскрипцию генов антиоксидантной защиты. Это функциональная аналогия с KEAP1–NRF2 — регуляция через тиоловые группы цистеинов, — а не доказательство общего происхождения этих систем: молекулярные участники и механизмы у них разные."],"trap":["Активация NRF2 всегда защищает организм, поэтому чем её больше и дольше, тем лучше.","Последствия зависят от клетки и длительности. Кратковременный ответ помогает адаптации, а постоянная активность при нарушенном KEAP1 может поддерживать выживание опухолевых клеток."],"conditions":"Временные кривые — качественная учебная схема, а не данные эксперимента. Singh 2006: 12 линий клеток и 54 образца немелкоклеточного рака лёгкого человека; соматические мутации KEAP1 — в 6 линиях и 10 опухолях, утрата гетерозиготности 19p13.2 — в 61 % линий и 41 % опухолей (по аннотации). Связь с устойчивостью к химиотерапии — интерпретация авторов. OxyR — Escherichia coli, активация образованием дисульфидной связи под действием H₂O₂ (Zheng 1998, по аннотации).","sources":["Liu2022","Singh2006","Ulasov2022","Zheng1998"],"quiz":{"id":"S10-L20","rev":1,"question":"Какое различие важно при сравнении ответа нормальной клетки на краткий электрофильный стимул и опухолевой клетки с устойчиво нарушенной функцией KEAP1?","options":[{"id":"S10-L20-1","text":"В обеих клетках NRF2-зависимая программа прекращается вскоре после удаления электрофила.","correct":false,"feedback":"Стойкий дефект регулятора может поддерживать программу и после удаления внешнего воздействия."},{"id":"S10-L20-3","text":"Устойчивая активация NRF2 подавляет рост опухолевой клетки, как и краткий защитный ответ.","correct":false,"feedback":"Защитная программа может поддерживать выживание опухолевой клетки; результат нельзя переносить с одних клеток на другие без проверки."},{"id":"S10-L20-2","text":"Во втором случае NRF2-зависимая программа может сохраняться без внешнего стимула.","correct":true,"feedback":"Постоянное нарушение контроля отличается от ограниченного во времени действия индуктора."}]},"widget":{"kind":"tl_s3","title":"","s":{"title":"Длительность NRF2-зависимой программы","status":"Учебная схема · качественные состояния, условная шкала времени","opts_label":"Клетка","opts":["Нормальная клетка, краткий электрофильный стимул","Клетка с устойчиво нарушенным KEAP1","Сравнить обе"],"stim":[2,4],"stim_label":"электрофил","stim_legend":"время действия электрофила","x_label":"время (условная шкала)","y_hi":"выс.","y_lo":"низ.","lanes":[{"label":"Нормальная клетка","legend":"NRF2-зависимая программа: нормальная клетка","pts":[[0,0.12],[2,0.12],[2.6,0.55],[3.4,0.85],[4,0.88],[4.8,0.6],[5.8,0.3],[7,0.15],[10,0.12]]},{"label":"Клетка с нарушенным KEAP1","legend":"NRF2-зависимая программа: KEAP1 нарушен","dash":true,"pts":[[0,0.85],[2,0.85],[3,0.9],[4,0.9],[5,0.86],[10,0.85]]}],"st":[{"m":[["Зависимость от стимула","программа усилена, пока действует электрофил"],["После удаления электрофила","возврат к исходному уровню"]],"note":"Краткий электрофильный стимул временно ослабляет KEAP1-зависимое разрушение NRF2. После удаления электрофила KEAP1 снова направляет NRF2 на разрушение, и программа возвращается к исходному уровню."},{"m":[["Зависимость от стимула","программа усилена и без стимула"],["После удаления электрофила","остаётся усиленной"]],"note":"При устойчивом нарушении KEAP1 (например, мутации гена KEAP1 в опухолевых клетках) разрушение NRF2 ослаблено постоянно. Программа усилена и без внешнего стимула, и удаление электрофила её не возвращает к исходному уровню."},{"m":[["Нормальная клетка","ответ ограничен временем действия стимула"],["Клетка с нарушенным KEAP1","ответ сохраняется без стимула"]],"note":"Различие не в «силе» NRF2, а в длительности и зависимости от стимула. Последствия постоянной активности зависят от клетки: в опухолевой клетке защитная программа может поддерживать её выживание."}],"fixed":"Кривые — качественная учебная схема, а не данные эксперимента; ось времени условная."}}},{"id":"nrf2-measure","number":21,"section":2,"title":"Как отличить накопление NRF2 от изменения его функции","question":3,"questions":[3],"keywords":["иммуноблот","иммунофлуоресценция","фракционирование","репортёр","ARE-репортёр","ОТ-ПЦР","количественная ПЦР","импульсное мечение","RNAi","нокаут","NFE2L2","HMOX1","NQO1","BACH1"],"lead":["Накопление NRF2, его ядерная локализация, связывание с ARE и изменение мРНК генов-мишеней — разные величины, и каждую измеряют своим методом.","Изменение одного показателя, например мРНК HMOX1, не доказывает, что оно вызвано именно NRF2."],"mechanism":["Содержание белка NRF2 определяют иммуноблотом, а скорость его распада — прослеживанием меченой популяции во времени.","Ядерную долю определяют иммунофлуоресценцией или разделением клеточных фракций; транскрипционный эффект — ARE-репортёром и ОТ-ПЦР мРНК генов-мишеней.","Зависимость ответа от NRF2 проверяют выключением гена NFE2L2 и восстановлением его функции."],"paragraphs":["Каждый метод отвечает на свой вопрос. Иммуноблот показывает количество белка NRF2 в образце к моменту взятия пробы. Если NRF2 стало больше, это может быть следствием и усиленного синтеза, и замедленного распада; различить их позволяет прослеживание меченой популяции белка во времени. Иммунофлуоресценция и фракционирование показывают, где NRF2 находится, но не то, связался ли он с ARE.","Транскрипционный эффект измеряют по-другому. ARE-репортёр показывает, может ли данный элемент усиливать экспрессию в этих клетках, а ОТ-ПЦР — содержание мРНК эндогенного гена-мишени. Содержание мРНК определяется и синтезом, и распадом РНК, поэтому его не следует называть скоростью транскрипции.","Ген HMOX1 — удобный, но неоднозначный показатель. Его транскрипцию регулирует не только NRF2: в клетках HaCaT арсенит индуцировал HMOX1 после удаления репрессора BACH1 из ядра, ещё до заметного накопления NRF2 в ядре. Поэтому рост мРНК HMOX1 сам по себе не доказывает, что изменение вызвано NRF2.","Причинную зависимость проверяют генетически. Ген NFE2L2 выключают с помощью RNAi или редактирования генома, проверяют уменьшение РНК и белка и повторяют то же воздействие. Если без NRF2 рост мРНК гена-мишени исчезает, а возвращение NRF2 восстанавливает его, вывод о зависимости надёжен для этой системы. Для каждого эксперимента нужно указывать клетки, срок, контроль загрузки или чистоты фракций и эффективность выключения гена."],"trap":["Если иммунофлуоресценция показала NRF2 в ядре, транскрипция его генов-мишеней обязательно усилена.","Ядерная локализация — отдельная величина. Связывание NRF2 с участками ARE проверяют, например, методом ChIP. Функциональный выход регуляторной конструкции оценивают ARE-репортёром, а содержание мРНК генов-мишеней — ОТ-ПЦР."],"conditions":"Схемы методов — принцип, а не результаты эксперимента. Пример HMOX1: клетки HaCaT, арсенит, выход BACH1 из ядра через 30 мин, накопление NRF2 в ядре к 3 ч — эксперимент, описанный в обзоре Liu 2022 (первичная работа в этой подготовке не прочитана). Состав методов — план шага (M01, M03, M07, M08, M09, M12). Флуоресцентные зонды на окислители здесь не рассматриваются: для них нужна отдельная схема реакции каждого зонда.","sources":["Liu2022","Ulasov2022"],"quiz":{"id":"S10-L21","rev":1,"question":"После воздействия повысилось содержание мРНК HMOX1. Какой вывод допускает одно это наблюдение?","options":[{"id":"S10-L21-1","text":"Это наблюдение прямо отражает количество белка NRF2 в клетках.","correct":false,"feedback":"Количество мРНК гена-мишени не является прямым измерением белка NRF2 и не устанавливает единственный регулятор."},{"id":"S10-L21-3","text":"Связь с NRF2 возможна, но её проверяют выключением и восстановлением NRF2.","correct":true,"feedback":"Сравнение с нарушением и восстановлением регулятора позволяет проверить причинную зависимость в выбранной системе."},{"id":"S10-L21-2","text":"Это наблюдение доказывает, что воздействие действует через ARE и NRF2.","correct":false,"feedback":"Экспрессия HMOX1 зависит и от других регуляторов (например, BACH1), от типа клеток и воздействия; без проверки зависимости от NRF2 такой вывод преждевременен."}]},"widget":{"kind":"net","title":"","s":{"title":"Какая величина каким методом измеряется","status":"Схемы методов · принцип, не данные эксперимента","ctrls":[{"id":"c","type":"group","label":"Величина и метод","opts":["Содержание NRF2: иммуноблот","Ядерная доля: микроскопия и фракционирование","Распад NRF2: меченая популяция","Транскрипция с ARE: репортёр","мРНК генов-мишеней: ОТ-ПЦР","Зависимость от NRF2: выключение и восстановление"]}],"W":560,"H":280,"NW":340,"NH":370,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"последовательность этапов метода","dash":"косвенная, условная или возможная связь","nodes":["зелёная рамка — этап метода"]},"zones":[],"mem":[],"nodes":{"a0":{"p":[70,56,106,62],"t":"","n":[82,50,140,48],"fs":14},"a1":{"p":[208,56,106,62],"t":"","n":[258,50,140,48],"fs":14},"a2":{"p":[348,56,106,62],"t":"","n":[258,126,140,48],"fs":14},"a3":{"p":[488,56,106,62],"t":"","n":[82,126,140,48],"fs":14},"b0":{"p":[70,184,106,62],"t":"","n":[82,216,140,48],"fs":14},"b1":{"p":[208,184,106,62],"t":"","n":[258,216,140,48],"fs":14},"b2":{"p":[348,184,106,62],"t":"","n":[258,292,140,48],"fs":14},"b3":{"p":[488,184,106,62],"t":"","n":[82,292,140,48],"fs":14}},"edges":{"ae0":{"a":"a0","b":"a1","k":"seq"},"ae1":{"a":"a1","b":"a2","k":"seq"},"ae2":{"a":"a2","b":"a3","k":"seq"},"be0":{"a":"b0","b":"b1","k":"seq"},"be1":{"a":"b1","b":"b2","k":"seq"},"be2":{"a":"b2","b":"b3","k":"seq"}},"st":{"0":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"hide","b1":"hide","b2":"hide","b3":"hide"},"e":{"be0":"hide","be1":"hide","be2":"hide"},"t":{"a0":"Клеточный\nлизат","a1":"Разделение\nбелков","a2":"Перенос и\nантитела","a3":"Сигнал\nNRF2"},"tn":{"a0":"Клеточный\nлизат","a1":"Разделение\nбелков","a2":"Перенос и\nантитела","a3":"Сигнал\nNRF2"},"m":[["Что измеряется","количество белка NRF2 в образце"],["Контроль","контроль загрузки, линейный диапазон, специфичность антитела"]],"note":"Иммуноблот показывает, сколько белка NRF2 в лизате при данном сроке. Он не показывает, где находится NRF2, связан ли он с ARE и усилена ли транскрипция."},"1":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{},"t":{"a0":"Фиксация\nклеток","a1":"Антитело и\nядерный\nмаркер","a2":"Получение\nизображения","a3":"Распреде-\nление\nNRF2","b0":"Подготовка\nклеток","b1":"Ядерная\nи другая\nфракции","b2":"Маркеры\nчистоты\nфракций","b3":"Иммуноблот\nNRF2"},"tn":{"a0":"Фиксация\nклеток","a1":"Антитело и\nядерный\nмаркер","a2":"Получение\nизображения","a3":"Распределение\nNRF2","b0":"Подготовка\nклеток","b1":"Ядерная\nи другая\nфракции","b2":"Маркеры\nчистоты\nфракций","b3":"Иммуноблот\nNRF2"},"m":[["Что измеряется","распределение NRF2 между ядром и цитоплазмой"],["Контроль","специфичность антитела; маркеры чистоты ядерной и цитоплазматической фракций"]],"note":"Иммунофлуоресценция и фракционирование показывают, где находится NRF2. Ядерная локализация не доказывает связывания с ARE и не равна усилению транскрипции."},"2":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"hide","b1":"hide","b2":"hide","b3":"hide"},"e":{"be0":"hide","be1":"hide","be2":"hide"},"t":{"a0":"Короткий\nимпульс\nметки","a1":"Удаление\nсвободной\nметки","a2":"Пробы в\nодинаковые\nсроки","a3":"Остаток\nмеченого\nNRF2"},"tn":{"a0":"Короткий\nимпульс\nметки","a1":"Удаление\nсвободной\nметки","a2":"Пробы в\nодинаковые\nсроки","a3":"Остаток\nмеченого\nNRF2"},"m":[["Что измеряется","скорость исчезновения меченой популяции NRF2"],["Контроль","одинаковые сроки и число клеток; условия без индуктора"]],"note":"Прослеживание меченой популяции разделяет синтез и распад: если при индукторе меченый NRF2 исчезает медленнее, распад замедлен. Одно конечное содержание этого не показывает."},"3":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{},"t":{"a0":"ARE и\nпромотор","a1":"Репортёрная\nРНК","a2":"Репортёрный\nбелок","a3":"Измеряемый\nсигнал","b0":"ARE с\nзаменами","b1":"Репортёрная\nРНК","b2":"Репортёрный\nбелок","b3":"Сигнал\nконтроля"},"tn":{"a0":"ARE и\nпромотор","a1":"Репортёрная\nРНК","a2":"Репортёрный\nбелок","a3":"Измеряемый\nсигнал","b0":"ARE с\nзаменами","b1":"Репортёрная\nРНК","b2":"Репортёрный\nбелок","b3":"Сигнал\nконтроля"},"m":[["Что измеряется","усиление экспрессии, зависящее от ARE в конструкции"],["Контроль","та же конструкция с изменённым ARE; независимый внутренний репортёр"]],"note":"Репортёр показывает, усиливает ли данный ARE экспрессию в этих клетках. Сигнал зависит и от стабильности репортёрных РНК и белка; репортёр не воспроизводит всю эндогенную программу."},"4":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"hide","b1":"hide","b2":"hide","b3":"hide"},"e":{"be0":"hide","be1":"hide","be2":"hide"},"t":{"a0":"РНК\nобразца","a1":"Обратная\nтранскрипция","a2":"ПЦР с\nрегистрацией\nсигнала","a3":"Нормиро-\nвание и\nсравнение"},"tn":{"a0":"РНК\nобразца","a1":"Обратная\nтранскрипция","a2":"ПЦР с\nрегистрацией\nсигнала","a3":"Нормирование и\nсравнение"},"m":[["Что измеряется","относительное содержание мРНК, например HMOX1 или NQO1"],["Контроль","проверенные референсные гены; контроль без обратной транскриптазы"]],"note":"ОТ-ПЦР показывает содержание мРНК гена-мишени. Оно зависит и от синтеза, и от распада РНК и само по себе не указывает, какой фактор изменил транскрипцию."},"5":{"n":{"a0":"met","a1":"met","a2":"met","a3":"met","b0":"met","b1":"met","b2":"met","b3":"met"},"e":{},"t":{"a0":"RNAi или\nредакти-\nрование","a1":"Проверка\nРНК и\nбелка","a2":"Тот же\nстимул","a3":"мРНК\nHMOX1\nи NQO1","b0":"Клетки\nбез NRF2","b1":"Возврат\nNRF2","b2":"Проверка\nколичества\nи места","b3":"Сравнение\nответа"},"tn":{"a0":"RNAi или\nредактирование","a1":"Проверка\nРНК и\nбелка","a2":"Тот же\nстимул","a3":"мРНК\nHMOX1\nи NQO1","b0":"Клетки\nбез NRF2","b1":"Возврат\nNRF2","b2":"Проверка\nколичества\nи места","b3":"Сравнение\nответа"},"m":[["Что измеряется","необходимость NRF2 для изменения мРНК гена-мишени"],["Контроль","независимые воздействия на NFE2L2; восстановление функции"]],"note":"Если без NRF2 рост мРНК HMOX1 исчезает, а возврат NRF2 его восстанавливает, ответ зависит от NRF2 в этой системе. Сохранившийся рост указывает на другие регуляторы."}},"notes_svg":[{"t":"Иммуноблот","x":14,"y":14,"a":"start","only":["0"],"b":true,"n":[8,16],"tn":"Иммуноблот"},{"t":"Иммунофлуоресценция","x":14,"y":14,"a":"start","only":["1"],"b":true,"n":[8,16],"tn":"Иммунофлуоресценция"},{"t":"Разделение клеточных фракций","x":14,"y":142,"a":"start","only":["1"],"b":true,"n":[8,182],"tn":"Фракционирование"},{"t":"Прослеживание меченого NRF2","x":14,"y":14,"a":"start","only":["2"],"b":true,"n":[8,16],"tn":"Меченый NRF2"},{"t":"Репортёр с ARE","x":14,"y":14,"a":"start","only":["3"],"b":true,"n":[8,16],"tn":"Репортёр с ARE"},{"t":"Контроль: ARE с заменами","x":14,"y":142,"a":"start","only":["3"],"b":true,"n":[8,182],"tn":"Мутантный ARE"},{"t":"Количественная ПЦР после обратной транскрипции","x":14,"y":14,"a":"start","only":["4"],"b":true,"n":[8,16],"tn":"ОТ-ПЦР"},{"t":"Выключение гена NFE2L2","x":14,"y":14,"a":"start","only":["5"],"b":true,"n":[8,16],"tn":"Выключение NFE2L2"},{"t":"Восстановление функции","x":14,"y":142,"a":"start","only":["5"],"b":true,"n":[8,182],"tn":"Восстановление"}],"fs":17,"nfs":14,"lfs":15,"zfs":15,"nlfs":13,"nzfs":13}}},{"id":"hif","number":22,"section":3,"title":"Почему HIF-α накапливается при недостатке кислорода","question":4,"questions":[4],"keywords":["HIF","HIF-1α","HIF-2α","ARNT","HIF-1β","гипоксия","стабилизация","синтез и распад","HIF1A","EPAS1","PHD","pVHL","HRE"],"lead":["[[T49|HIF]] — транскрипционный комплекс из регулируемой α-субъединицы и постоянно присутствующего партнёра [[T51|ARNT]]. При достаточном O₂ α-субъединица синтезируется непрерывно и так же непрерывно разрушается.","При недостатке кислорода разрушение замедляется, и содержание HIF-α растёт даже тогда, когда скорость его синтеза не меняется."],"mechanism":["Содержание белка HIF-1α определяется соотношением скоростей его синтеза и распада.","При достаточном O₂ [[T52|пролилгидроксилазы PHD]] гидроксилируют HIF-1α; гидроксилированный белок распознаётся комплексом с [[T55|pVHL]], убиквитинируется и разрушается протеасомой.","При сниженном O₂ гидроксилирование замедляется, вновь синтезированный HIF-1α накапливается, связывается с ARNT и активирует транскрипцию генов-мишеней."],"paragraphs":["HIF (фактор, индуцируемый гипоксией) — семейство гетеродимерных транскрипционных факторов. Каждый комплекс состоит из α-субъединицы и β-субъединицы ARNT, которую называют также HIF-1β. У человека лучше всего изучены [[T50|HIF-1α и HIF-2α]], продукты генов HIF1A и EPAS1; они регулируют частично разные наборы генов. Основная схема этого раздела построена для HIF-1α человека, а различия изоформ разобраны отдельно.","Содержание любого белка складывается из двух потоков — синтеза новых молекул и удаления существующих. В клетках HeLa и Hep3B мРНК HIF1A и ARNT выявлялись постоянно и при гипоксии заметно не менялись, а белок HIF-1α в нормоксии почти не определялся (Huang 1996). Его быстрый распад задаёт центральный кислород-зависимый домен деградации: через него белок направляется в убиквитин-протеасомный путь (Huang 1998).","При достаточном O₂ PHD присоединяют гидроксильные группы к двум остаткам пролина HIF-1α. Белок [[T55|pVHL]] в составе E3-комплекса распознаёт гидроксилированный HIF-1α, комплекс присоединяет к нему убиквитин, и протеасома разрушает белок. Когда кислорода становится меньше, PHD гидроксилируют HIF-1α медленнее, вновь синтезированные молекулы чаще избегают распознавания, и белок накапливается. Он связывается с ARNT, комплекс связывается с [[T60|элементами ответа на гипоксию (HRE)]] в регуляторных областях генов-мишеней и активирует их транскрипцию.","Накопление HIF-1α не требует обязательного усиления транскрипции HIF1A. Однако синтез белка тоже регулируется: в клетках рака молочной железы MCF-7 сигнал рецептора HER2 повышал скорость синтеза HIF-1α через путь PI3K–AKT–mTOR, не меняя периода его полужизни (Laughner 2001). На схеме синтез постоянен, чтобы отделить изменение распада от изменения синтеза. «Достаточный» и «сниженный» O₂ задаются условиями конкретной культуры или ткани: 21 % O₂ в газовой фазе инкубатора не является универсальной нормой для клеток организма."],"trap":["Раз HIF-1α при достаточном O₂ почти не выявляется, ген HIF1A в этих условиях не работает.","мРНК HIF1A присутствует и белок синтезируется, но так же быстро разрушается. Низкое содержание белка отражает быстрый распад, а не отсутствие экспрессии гена."],"conditions":"Схема механизма: качественные состояния при фиксированной скорости синтеза HIF-1α. Постоянство мРНК HIF1A при гипоксии показано для клеток HeLa и Hep3B (Huang 1996); регуляция синтеза HIF-1α сигналом HER2 — для клеток MCF-7 и фибробластов мыши 3T3 (Laughner 2001). Уровни O₂ на схеме условные: «нормоксия» определяется условиями конкретной культуры или ткани.","sources":["Kaelin2008","Maxwell1999","Huang1996","Huang1998","Laughner2001"],"quiz":{"id":"S10-L22","rev":1,"question":"Скорость синтеза HIF-1α не изменилась, но в гипоксии его pVHL-зависимое разрушение замедлилось. Что может объяснить рост содержания HIF-1α?","options":[{"id":"S10-L22-1","text":"Стабилизация белка при продолжающемся синтезе.","correct":true,"feedback":"Для накопления белка достаточно уменьшить скорость его удаления; увеличение транскрипции не является обязательным условием."},{"id":"S10-L22-2","text":"Обязательное увеличение количества мРНК HIF1A.","correct":false,"feedback":"Условие допускает накопление за счёт распада при неизменном синтезе; дополнительное изменение мРНК не требуется."},{"id":"S10-L22-3","text":"Усиление разрушения HIF-1α при прежнем синтезе.","correct":false,"feedback":"Усиление удаления действовало бы в противоположном направлении: при прежнем синтезе содержание белка уменьшалось бы."}]},"widget":{"kind":"net","title":"","s":{"title":"Синтез и распад определяют содержание HIF-1α","status":"Схема механизма · качественные состояния","ctrls":[{"id":"o","type":"group","label":"Доступность кислорода","opts":["Достаточный O₂","Сниженный O₂"]}],"W":600,"H":320,"NW":340,"NH":310,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение или модификация мишени (стрелка — к мишени)","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно, белка много","пунктирная рамка — снижено или неактивно"]},"zones":[],"mem":[],"nodes":{"mrna":{"p":[70,60,124,40],"t":"мРНК HIF1A","n":[60,40,108,44],"fs":16,"tn":"мРНК\nHIF1A"},"hif":{"p":[226,60,100,42],"t":"HIF-1α","n":[172,40,92,42],"fs":17},"arnt":{"p":[390,60,150,42],"t":"HIF-1α · ARNT","n":[282,40,100,52],"fs":16,"tn":"HIF-1α ·\nARNT"},"tg":{"p":[534,60,120,50],"t":"гены-мишени\n(HRE)","n":[283,130,112,48],"fs":15},"phd":{"p":[96,186,92,40],"t":"PHD","n":[60,150,84,40],"fs":17},"o2":{"p":[96,280,70,36],"t":"O₂","n":[60,250,64,36],"fs":17},"vhl":{"p":[300,190,150,52],"t":"pVHL–CUL2\n(E3-комплекс)","n":[172,180,124,52],"fs":15},"prot":{"p":[480,190,120,40],"t":"протеасома","n":[172,280,124,40],"fs":15}},"edges":{"tl":{"a":"mrna","b":"hif","k":"seq","t":"синтез","tn":"","d":[0,-16],"anc":"middle"},"dim":{"a":"hif","b":"arnt","k":"bind"},"tr":{"a":"arnt","b":"tg","k":"act"},"o":{"a":"o2","b":"phd","k":"rx","t":"субстрат","d":[30,0],"dn":[30,0],"anc":"start"},"hy":{"a":"phd","b":"hif","k":"rx","t":"гидроксилирует\nPro","d":[-6,-14],"dn":[-30,0],"anc":"end"},"rec":{"a":"hif","b":"vhl","k":"bind","t":"распознаёт\nPro-OH","d":[36,-6],"dn":[10,0],"anc":"start"},"ub":{"a":"vhl","b":"prot","k":"seq","t":"убиквитин","d":[0,-14],"dn":[10,0],"anc":"middle"}},"st":{"0":{"n":{"mrna":"on","hif":"low","arnt":"off","tg":"off","phd":"on","o2":"on","vhl":"on","prot":"on"},"e":{"dim":"off","tr":"off"},"m":[["мРНК HIF1A","присутствует, синтез идёт"],["Белок HIF-1α","низкое содержание"],["Транскрипция мишеней HIF","низкая"]],"note":"При достаточном O₂ PHD гидроксилируют вновь синтезированный HIF-1α. Комплекс с pVHL распознаёт гидроксилированный белок, HIF-1α убиквитинируется и разрушается протеасомой. Синтез продолжается, но содержание белка остаётся низким."},"1":{"n":{"mrna":"on","hif":"on","arnt":"on","tg":"on","phd":"low","o2":"low","vhl":"base","prot":"base"},"e":{"o":"off","hy":"off","rec":"off","ub":"off"},"m":[["мРНК HIF1A","присутствует, синтез идёт"],["Белок HIF-1α","накапливается"],["Транскрипция мишеней HIF","повышается"]],"note":"При сниженном O₂ гидроксилирование замедляется, и меньше молекул HIF-1α распознаётся комплексом с pVHL. При той же скорости синтеза белок накапливается, образует комплекс с ARNT и активирует транскрипцию генов, содержащих HRE. Активность PHD снижена, но не обязательно равна нулю."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13}}},{"id":"phd","number":23,"section":3,"title":"Как PHD используют кислород при гидроксилировании HIF-α","question":4,"questions":[4],"keywords":["PHD","EGLN","PHD2","EGLN1","PHD1","PHD3","диоксигеназа","2-оксоглутарат","α-кетоглутарат","Fe(II)","аскорбат","гидроксипролин","Pro402","Pro564","сукцинат","фумарат"],"lead":["[[T52|Пролилгидроксилазы HIF (PHD)]] используют молекулярный кислород как субстрат: один атом O₂ входит в гидроксильную группу пролина, второй — в сукцинат.","Поэтому скорость гидроксилирования HIF-α непосредственно зависит от доступности O₂, а не только от энергетического обмена клетки."],"mechanism":["PHD — Fe(II)- и [[T54|2-оксоглутарат]]-зависимые диоксигеназы: в одной реакции они гидроксилируют остаток пролина и окислительно декарбоксилируют 2-оксоглутарат до сукцината и CO₂.","O₂ и 2-оксоглутарат расходуются в каждом обороте, Fe(II) находится в активном центре и не расходуется, аскорбат повышает активность фермента, но в уравнение реакции не входит.","В HIF-1α человека гидроксилируются Pro402 и Pro564; [[T57|пролилгидроксилирование]] создаёт участок, который распознаёт pVHL."],"paragraphs":["Суммарная реакция PHD записывается так: остаток пролина в HIF-α + O₂ + 2-оксоглутарат → остаток 4-гидроксипролина + сукцинат + CO₂. Фермент относится к Fe(II)- и 2-оксоглутарат-зависимым диоксигеназам: оба атома молекулы O₂ входят в продукты. Один присоединяется к атому C4 пирролидинового кольца пролина и образует группу OH, второй входит в карбоксильную группу сукцината, который образуется при окислительном декарбоксилировании 2-оксоглутарата. Гидроксилирование Pro564 требовало O₂ и железа (Jaakkola 2001).","Участники реакции играют разную роль. O₂ и 2-оксоглутарат расходуются в каждом обороте. Ион Fe(II) находится в активном центре и не входит в продукты, но без него реакция не идёт: поэтому хелаторы железа вызывают накопление HIF-α в нормоксии. Аскорбат повышал начальную скорость и полноту гидроксилирования очищенной PHD2 (Flashman 2010); в уравнение реакции он не входит.","У человека три фермента: [[T53|PHD1 (ген EGLN2), PHD2 (EGLN1) и PHD3 (EGLN3)]]. В клетках человека подавление PHD2 с помощью малых интерферирующих РНК было достаточно, чтобы HIF-1α стабилизировался при нормоксии, а подавление PHD1 или PHD3 — нет (Berra 2003). Вклад изоформ зависит от клеток. Номера Pro402 и Pro564 относятся к HIF-1α человека; каждый из двух участков может самостоятельно направлять белок к убиквитинированию с участием pVHL (Masson 2001).","Связь с метаболизмом идёт через 2-оксоглутарат — промежуточный продукт цикла трикарбоновых кислот. Сукцинат и фумарат по строению близки к нему и тормозят PHD. В клетках с подавленной сукцинатдегидрогеназой накапливался сукцинат и стабилизировался HIF-1α (Selak 2005); в опухолевых клетках почки без фумаратгидратазы фумарат вёл себя как конкурентный ингибитор PHD (Isaacs 2005). Такое торможение возникает при накоплении этих метаболитов, а не при любом изменении работы цикла."],"trap":["Аскорбат — такой же расходуемый субстрат PHD, как O₂ и 2-оксоглутарат.","В уравнение реакции входят остаток пролина, O₂ и 2-оксоглутарат; продукты — гидроксипролин, сукцинат и CO₂. Аскорбат повышает активность фермента, но в продукты не входит."],"conditions":"Схема реакции; состояния качественные, без единого порога O₂ и без константы Михаэлиса для клетки. Нумерация Pro402, Pro564 — HIF-1α человека. Потребность в O₂ и железе — эксперименты Jaakkola 2001 и Ivan 2001 (HIF-1α человека, клетки и бесклеточные системы); роль PHD2 — подавление siRNA в клетках человека (Berra 2003); влияние аскорбата — очищенная PHD2 in vitro (Flashman 2010); сукцинат — клетки с подавленной SDH (Selak 2005); фумарат — клетки рака почки с утратой FH и эксперименты с ферментом (Isaacs 2005). Структурные формулы показывают остаток пролина и остаток 4-гидроксипролина в полипептидной цепи без обозначения стереохимии; 2-оксоглутарат и сукцинат показаны в виде анионов, преобладающих при pH около 7.","sources":["Kaelin2008","Jaakkola2001","Ivan2001","Flashman2010","Berra2003","Masson2001","Selak2005","Isaacs2005"],"quiz":{"id":"S10-L23","rev":1,"question":"Какова непосредственная роль O₂ в реакции PHD, гидроксилирующей HIF-α?","options":[{"id":"S10-L23-2","text":"O₂ является субстратом реакции гидроксилирования, которую катализирует PHD.","correct":true,"feedback":"Зависимость реакции от доступности молекулярного кислорода связывает гидроксилирование со снабжением клетки O₂."},{"id":"S10-L23-1","text":"O₂ нужен клеточному дыханию и влияет на PHD через образование ATP.","correct":false,"feedback":"Зависимость PHD от O₂ непосредственная: кислород участвует в реакции гидроксилирования, а не только в энергетическом обмене клетки."},{"id":"S10-L23-3","text":"O₂ нужен на стадии распознавания гидроксилированного HIF белком pVHL.","correct":false,"feedback":"В показанной последовательности кислород нужен на предшествующей ферментативной стадии, которая создаёт гидроксилированный субстрат."}]},"widget":{"kind":"phd_s4","title":"","s":{"title":"Реакция PHD: гидроксилирование остатка пролина HIF-α","status":"Схема реакции · качественные состояния","opts_label":"Условие","opts":["Все участники доступны","Сниженный O₂","Хелатор железа","Накопление сукцината или фумарата"],"sub_t":"остаток пролина (Pro564)","prod_t":"остаток 4-гидроксипролина","prev":"…","next":"NH…","enz":"PHD · Fe(II)","o2":"O₂","og_t":"+ 2-оксоглутарат","og_f":"⁻OOC–CH₂–CH₂–CO–COO⁻","co2":"CO₂","suc_t":"+ сукцинат","suc_f":"⁻OOC–CH₂–CH₂–COO⁻","coupling":"один атом O₂ → группа OH,\nвторой → сукцинат","n_l1":"O₂ + 2-оксоглутарат","n_l2":"→ CO₂ + сукцинат","o2_low":"O₂ меньше — реакция медленнее","og_comp":"сукцинат или фумарат тормозят PHD","asc":"Аскорбат повышает активность фермента, но в уравнение реакции не входит.","asc_n":"Аскорбат повышает активность PHD,\nно в уравнение реакции не входит.","fixed":"Атомы углерода кольца не подписаны (скелетная формула); 4 — атом C4 кольца.","st":[{"flux":"on","m":[["Гидроксилирование Pro402 и Pro564","идёт"],["Содержание HIF-1α","низкое"]],"note":"Все участники реакции доступны: PHD с Fe(II) в активном центре присоединяет один атом кислорода O₂ к атому C4 остатка пролина, а второй атом входит в сукцинат при окислительном декарбоксилировании 2-оксоглутарата."},{"flux":"low","o2_low":true,"m":[["Гидроксилирование Pro402 и Pro564","замедлено"],["Содержание HIF-1α","повышается"]],"note":"O₂ — субстрат реакции. При меньшей доступности O₂ скорость гидроксилирования снижается, меньше молекул HIF-α получают группу OH, и HIF-α накапливается. Реакция замедляется, но в умеренной гипоксии не обязательно прекращается."},{"flux":"vlow","fe_x":true,"m":[["Гидроксилирование Pro402 и Pro564","резко снижено"],["Содержание HIF-1α","повышается"]],"note":"Fe(II) не расходуется в реакции, но без него активный центр не работает. Хелаторы железа, например дефероксамин, снижают гидроксилирование HIF-α, и белок накапливается в нормоксии."},{"flux":"low","og_comp":true,"m":[["Гидроксилирование Pro402 и Pro564","замедлено"],["Содержание HIF-1α","повышается"]],"note":"Сукцинат и фумарат по строению близки к 2-оксоглутарату и тормозят PHD. Это показано в клетках с подавленной сукцинатдегидрогеназой (накопление сукцината) и с утратой фумаратгидратазы (накопление фумарата)."}]}}},{"id":"vhl","number":24,"section":3,"title":"Что распознаёт pVHL и почему его потеря стабилизирует HIF-α","question":4,"questions":[4],"keywords":["pVHL","VHL","CUL2","элонгин B","элонгин C","RBX1","E3-лигаза","CRL2","убиквитинирование","протеасома","Гиппеля — Линдау","RCC4","KEAP1","CUL3"],"lead":["[[T55|pVHL]] не гидроксилирует HIF-α, а распознаёт уже гидроксилированный белок. Он входит в [[T56|E3-комплекс]] с элонгинами B и C, CUL2 и RBX1, который присоединяет к HIF-α убиквитин.","Поэтому без pVHL гидроксилирование может продолжаться, а быстрое разрушение HIF-α нарушается."],"mechanism":["PHD создают модификацию — гидроксилированные остатки пролина в HIF-α; pVHL связывает именно модифицированный участок.","В составе комплекса pVHL–элонгины B/C–CUL2–RBX1 это связывание ведёт к [[T38|убиквитинированию]] HIF-α и его [[T39|протеасомной деградации]].","При отсутствии pVHL гидроксилирование сохраняется, но HIF-α не подвергается быстрому распаду и накапливается при любом содержании O₂."],"paragraphs":["В кислород-зависимом распаде HIF-α участвуют два разных звена. Первое — реакция: PHD присоединяют гидроксильную группу к остаткам пролина. Второе — распознавание: белок pVHL, продукт гена-супрессора опухолей VHL, связывает участок HIF-α, содержащий гидроксипролин. Короткий пептид HIF связывался с pVHL только тогда, когда центральный остаток пролина был гидроксилирован (Ivan 2001; Jaakkola 2001).","Сам pVHL не присоединяет убиквитин. Он входит в E3-комплекс вместе с элонгинами B и C, куллином CUL2 и белком RBX1. pVHL связывает субстрат, элонгины соединяют его с CUL2, а RBX1 привлекает фермент, который несёт активированный убиквитин. Полиубиквитинированный HIF-α разрушается протеасомой.","Значение pVHL показали генетическим сравнением. В клеточных линиях рака почки с дефектом VHL субъединицы HIF-α были стабильны при любом содержании O₂, а после введения функционального гена VHL кислород-зависимая нестабильность восстанавливалась (Maxwell 1999). В клетках RCC4 без pVHL HIF-1α при нормоксии гидроксилирован по Pro402 и Pro564 почти полностью (Tian 2011): реакция PHD идёт, а отсутствует следующий этап. Медленный распад HIF-α по путям, не зависящим от pVHL, при этом возможен, поэтому корректнее говорить о нарушении быстрого кислород-зависимого распада, а не о полной неразрушимости белка.","Архитектура комплекса напоминает систему KEAP1–CUL3 из предыдущего раздела: белок, связывающий субстрат, соединён с куллином и RBX1. Различается то, что распознаётся. pVHL связывает HIF-α после модификации, которая зависит от O₂; KEAP1 связывает NRF2 без такой модификации, а электрофилы изменяют работу самого KEAP1."],"trap":["pVHL — это фермент, который сам разрушает HIF-α.","pVHL связывает гидроксилированный HIF-α в составе E3-комплекса; присоединение убиквитина обеспечивает весь комплекс с CUL2 и RBX1, а разрушает белок протеасома."],"conditions":"Схема механизма; состояния качественные. Распознавание гидроксилированного пептида — эксперименты с HIF-1α человека и очищенными компонентами (Ivan 2001; Jaakkola 2001); стабилизация HIF-α и её устранение после введения VHL — клеточные линии рака почки человека с дефектом VHL (Maxwell 1999); почти полное гидроксилирование Pro402, Pro564 и Asn803 при нормоксии — клетки RCC4 без pVHL, антитела к гидроксилированным остаткам и масс-спектрометрия (Tian 2011). Сравнение с KEAP1–CUL3 касается устройства комплекса, а не происхождения белков.","sources":["Maxwell1999","Jaakkola2001","Ivan2001","Tian2011","Kaelin2008"],"quiz":{"id":"S10-L24","rev":1,"question":"В клетке отсутствует pVHL, но PHD активны и кислорода достаточно. Какое сочетание возможно?","options":[{"id":"S10-L24-1","text":"HIF-α не гидроксилируется, потому что именно pVHL катализирует эту реакцию.","correct":false,"feedback":"Гидроксилирование катализируют PHD; pVHL участвует в распознавании продукта реакции."},{"id":"S10-L24-2","text":"HIF-α разрушается через pVHL с прежней скоростью, поскольку PHD сохранены.","correct":false,"feedback":"Сохранение предшествующей реакции не восстанавливает отсутствующий компонент следующего этапа."},{"id":"S10-L24-3","text":"Гидроксилирование HIF-α сохраняется, но его быстрое pVHL-зависимое разрушение нарушено.","correct":true,"feedback":"Модификация и её распознавание относятся к разным звеньям; нарушение второго не требует исчезновения первого."}]},"widget":{"kind":"net","title":"","s":{"title":"Модификацию создают PHD, распознаёт pVHL","status":"Схема механизма · генетическое сравнение","ctrls":[{"id":"g","type":"group","label":"Клетки (кислорода достаточно)","opts":["pVHL есть","pVHL отсутствует","pVHL восстановлен"]},{"id":"c","type":"check","label":"Сравнить с KEAP1–CUL3"}],"W":620,"H":320,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно","пунктирная рамка — не происходит","× — белка нет"]},"zones":[{"x":458,"y":32,"w":144,"h":280,"c":"plain","t":"E3-комплекс","lx":530,"ly":304,"n":[214,104,124,196,276,296],"a":"middle"}],"mem":[],"nodes":{"phd":{"p":[262,142,84,38],"t":"PHD","n":[119,116,70,32],"fs":17},"hif":{"p":[140,60,96,40],"t":"HIF-α","n":[56,44,80,36],"fs":17},"hyp":{"p":[370,60,160,42],"t":"HIF-α · Pro-OH","n":[196,44,108,48],"fs":16,"tn":"HIF-α\nPro-OH"},"vhl":{"p":[530,60,110,38],"t":"pVHL","n":[276,128,104,34],"fs":16},"elo":{"p":[530,122,130,38],"t":"элонгины B/C","n":[276,174,120,34],"fs":15},"cul":{"p":[530,184,110,38],"t":"CUL2","n":[276,220,104,34],"fs":16},"rbx":{"p":[530,246,110,38],"t":"RBX1","n":[276,266,104,34],"fs":16},"ubh":{"p":[330,246,170,50],"t":"HIF-α · Pro-OH\n+ убиквитин","n":[110,250,150,50],"fs":15},"prot":{"p":[110,246,130,40],"t":"протеасома","n":[110,336,130,40],"fs":16}},"edges":{"hy":{"a":"phd","b":[262,68,119,54],"k":"act","t":"катализирует","d":[48,0],"dn":[40,0],"anc":"start"},"mod":{"a":"hif","b":"hyp","k":"rx","t":"O₂","d":[0,-14],"dn":[0,-14],"anc":"middle"},"rec":{"a":"hyp","b":"vhl","k":"bind","t":"распознаёт","d":[0,-14],"dn":[36,0],"anc":"middle"},"ub":{"a":"rbx","b":"ubh","k":"seq","t":"убиквитин","d":[0,-14],"dn":[-6,-12],"anc":"middle"},"tou":{"a":"hyp","b":"ubh","k":"seq","bend":0},"deg":{"a":"ubh","b":"prot","k":"seq"}},"st":{"0-0":{"n":{"phd":"on","hif":"base","hyp":"on","vhl":"on","elo":"on","cul":"on","rbx":"on","ubh":"on","prot":"on"},"m":[["Гидроксилирование Pro","идёт"],["Распознавание pVHL","есть"],["Содержание HIF-α","низкое"]],"note":"При достаточном O₂ PHD гидроксилируют HIF-α. pVHL в составе E3-комплекса связывает гидроксилированный HIF-α, RBX1 и CUL2 обеспечивают присоединение убиквитина, и протеасома разрушает белок."},"1-0":{"n":{"phd":"on","hif":"base","hyp":"on","vhl":"abs","elo":"base","cul":"base","rbx":"base","ubh":"off","prot":"base"},"e":{"rec":"off","ub":"off","tou":"off","deg":"off"},"m":[["Гидроксилирование Pro","идёт"],["Распознавание pVHL","нет"],["Содержание HIF-α","высокое при любом O₂"]],"note":"Без pVHL гидроксилирование HIF-α продолжается: PHD на месте и O₂ достаточно. Но гидроксилированный HIF-α не распознаётся, быстрое убиквитинирование не происходит, и белок накапливается. Медленный распад другими путями возможен."},"2-0":{"n":{"phd":"on","hif":"base","hyp":"on","vhl":"on","elo":"on","cul":"on","rbx":"on","ubh":"on","prot":"on"},"m":[["Гидроксилирование Pro","идёт"],["Распознавание pVHL","восстановлено"],["Содержание HIF-α","снова низкое при достаточном O₂"]],"note":"Генетическое сравнение: в клетки без функционального pVHL снова ввели ген VHL. Зависимая от O₂ нестабильность HIF-α восстановилась (Maxwell 1999). Так проверяют, что эффект вызван именно потерей pVHL, а не другими особенностями клеточной линии."},"0-1":{"n":{"phd":"hide","hif":"hide","hyp":"on","vhl":"on","elo":"hide","cul":"on","rbx":"on","ubh":"on","prot":"on"},"e":{"hy":"hide","mod":"hide"},"t":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"tn":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"m":[["Общее в архитектуре","белок, связывающий субстрат, + куллин + RBX1"],["Различие","что распознаётся в субстрате"]],"note":"Сравнение с разделом KEAP1–NRF2: KEAP1 так же служит белком, связывающим субстрат, в комплексе с куллином (CUL3) и RBX1. Но KEAP1 связывает NRF2 без предварительного гидроксилирования, а электрофилы меняют работу самого KEAP1. pVHL распознаёт модификацию субстрата, которая зависит от O₂. CUL2 и CUL3 не взаимозаменяемы.","et":{"rec":"связывает"}},"1-1":{"n":{"phd":"hide","hif":"hide","hyp":"on","vhl":"on","elo":"hide","cul":"on","rbx":"on","ubh":"on","prot":"on"},"e":{"hy":"hide","mod":"hide"},"t":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"tn":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"m":[["Общее в архитектуре","белок, связывающий субстрат, + куллин + RBX1"],["Различие","что распознаётся в субстрате"]],"note":"Сравнение с разделом KEAP1–NRF2: KEAP1 так же служит белком, связывающим субстрат, в комплексе с куллином (CUL3) и RBX1. Но KEAP1 связывает NRF2 без предварительного гидроксилирования, а электрофилы меняют работу самого KEAP1. pVHL распознаёт модификацию субстрата, которая зависит от O₂. CUL2 и CUL3 не взаимозаменяемы.","et":{"rec":"связывает"}},"2-1":{"n":{"phd":"hide","hif":"hide","hyp":"on","vhl":"on","elo":"hide","cul":"on","rbx":"on","ubh":"on","prot":"on"},"e":{"hy":"hide","mod":"hide"},"t":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"tn":{"hif":"NRF2","hyp":"NRF2","vhl":"KEAP1","cul":"CUL3","ubh":"NRF2\n+ убиквитин"},"m":[["Общее в архитектуре","белок, связывающий субстрат, + куллин + RBX1"],["Различие","что распознаётся в субстрате"]],"note":"Сравнение с разделом KEAP1–NRF2: KEAP1 так же служит белком, связывающим субстрат, в комплексе с куллином (CUL3) и RBX1. Но KEAP1 связывает NRF2 без предварительного гидроксилирования, а электрофилы меняют работу самого KEAP1. pVHL распознаёт модификацию субстрата, которая зависит от O₂. CUL2 и CUL3 не взаимозаменяемы.","et":{"rec":"связывает"}}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13}}},{"id":"fih","number":25,"section":3,"title":"Почему содержание HIF-α и его транскрипционная активность различаются","question":4,"questions":[4],"keywords":["FIH","Asn803","аспарагин","p300","CBP","коактиватор","C-концевой домен активации","CAD","транскрипционная активность","содержание белка","DMOG"],"lead":["Накопление HIF-α ещё не означает его полной транскрипционной активности. Вторая гидроксилаза, [[T58|FIH]], модифицирует остаток аспарагина в домене активации и тем самым мешает связыванию [[T59|коактиваторов p300/CBP]].","Пролилгидроксилирование регулирует содержание HIF-α, а гидроксилирование аспарагина — его взаимодействие с коактиваторами."],"mechanism":["FIH — Fe(II)- и 2-оксоглутарат-зависимая гидроксилаза; в HIF-1α человека она гидроксилирует Asn803 C-концевого домена активации.","Группа OH при Asn803 препятствует связыванию этого домена с p300/CBP; на распознавание pVHL она не влияет.","[[T64|Содержание HIF-α и его транскрипционная активность]] регулируются разными модификациями и могут меняться неодинаково."],"paragraphs":["HIF-α модифицируется в двух разных областях. Остатки Pro402 и Pro564 HIF-1α человека находятся в кислород-зависимом домене деградации; их гидроксилируют PHD, и от этого зависит распознавание pVHL и распад. Остаток Asn803 находится в C-концевом домене активации транскрипции; его гидроксилирует FIH (фактор, подавляющий HIF). FIH, как и PHD, относится к Fe(II)- и 2-оксоглутарат-зависимым диоксигеназам и использует O₂ как субстрат.","C-концевой домен активации стимулирует транскрипцию, связывая коактиваторы p300 и CBP. Гидроксилированный Asn803 такому связыванию препятствует. Ингибиторы Fe(II)- и 2-оксоглутарат-зависимых диоксигеназ предотвращали гидроксилирование этого аспарагина и позволяли домену связывать p300, а замена аспарагина на аланин давала постоянное связывание p300 и высокую транскрипционную активность (Lando 2002). В клетке с функциональным pVHL ограничение пролилгидроксилирования стабилизирует HIF-α, а уменьшение гидроксилирования Asn803 дополнительно облегчает связывание p300/CBP. Это разные этапы регуляции.","Поэтому накопившийся HIF-1α может иметь разную удельную активность. В экспериментах Tian 2011 при 1 % O₂ (5 ч) HIF-1α накапливался в клетках разных типов, но остаток Asn803 у значительной части молекул оставался гидроксилированным: в фибробластах кожи человека — более чем на 90 %, в клетках рака предстательной железы PC3 — примерно на 50 %. При 0,2 % O₂ гидроксилирование Asn803 было сильно подавлено. Чувствительность двух реакций к недостатку O₂ различается и зависит от клеток, поэтому единой ступенчатой «шкалы» O₂ для всех тканей нет.","Отсутствие связывания p300/CBP C-концевым доменом не означает отсутствия любых эффектов HIF: у HIF-α есть и другой, N-концевой домен активации, а набор генов, чувствительных к FIH, ограничен. Для объяснения важно другое: равное содержание HIF-1α ещё не означает равной транскрипционной активности."],"trap":["Если HIF-1α много, гены-мишени HIF работают в полную силу: содержание белка и его активность — одно и то же.","Содержание HIF-1α определяется пролилгидроксилированием и распадом, а связывание коактиваторов — гидроксилированием Asn803. При одинаковом содержании белка его транскрипционная активность может различаться."],"conditions":"Схема механизма; нумерация Asn803 — HIF-1α человека. Связывание p300 и мутация Asn → Ala — Lando 2002 (клеточные линии, конструкции HIF-1α и HIF-2α). Доли Asn803-OH при 1 % O₂ (5 ч): фибробласты кожи человека — более 90 %, клетки PC3 — около 50 %; подавление при 0,2 % O₂; избирательный ингибитор FIH (соединение E) в клетках RCC4 с восстановленным pVHL, 5 ч, гипоксия 1 % O₂ последние 2 ч (Tian 2011, иммуноблот с антителами к гидроксилированным остаткам, калибровка масс-спектрометрией). Состояния схемы качественные.","sources":["Lando2002","Tian2011","Kaelin2008"],"quiz":{"id":"S10-L25","rev":1,"question":"Содержание HIF-1α одинаково в двух условных состояниях. В одном Asn803 гидроксилирован, в другом нет. Какое различие непосредственно относится к действию FIH?","options":[{"id":"S10-L25-2","text":"pVHL распознаёт Asn803-OH вместо гидроксилированных пролинов.","correct":false,"feedback":"Для pVHL-зависимого пути важны пролиновые модификации; подмена остатка смешивает разные уровни регуляции."},{"id":"S10-L25-1","text":"Связывание p300/CBP C-концевым доменом затруднено в состоянии с Asn803-OH.","correct":true,"feedback":"Именно взаимодействие домена активации с коактиваторами является непосредственным выходом этой модификации."},{"id":"S10-L25-3","text":"Asn803-OH усиливает распад белка тем же способом, что Pro402-OH и Pro564-OH.","correct":false,"feedback":"Asn- и Pro-гидроксилирование имеют разные непосредственные последствия; эффект FIH относится к взаимодействию с коактиватором."}]},"widget":{"kind":"net","title":"","s":{"title":"Две модификации HIF-1α — два разных следствия","status":"Схема механизма · данные эксперимента (Tian 2011) в подписях","ctrls":[{"id":"c","type":"group","label":"Условие","opts":["Достаточный O₂","Умеренная гипоксия","Глубокая гипоксия","Умеренная гипоксия + ингибитор FIH"]}],"W":620,"H":280,"NW":340,"NH":370,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"гидроксилирование остатка мишени (стрелка — к мишени)","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — активно или происходит","пунктирная рамка — снижено","× — фермент ингибирован"]},"zones":[],"mem":[],"nodes":{"phd":{"p":[64,60,84,40],"t":"PHD","n":[46,54,72,36],"fs":17},"pro":{"p":[226,60,150,50],"t":"HIF-1α\nPro402 · Pro564","n":[160,54,128,50],"fs":15},"vhl":{"p":[396,60,92,40],"t":"pVHL","n":[288,54,76,36],"fs":16},"deg":{"p":[536,60,104,40],"t":"распад","n":[288,134,86,36],"fs":16},"fih":{"p":[64,210,84,40],"t":"FIH","n":[46,230,72,36],"fs":17},"asn":{"p":[226,210,168,50],"t":"HIF-1α · Asn803\n(C-концевой домен)","n":[160,230,128,56],"fs":15,"tn":"HIF-1α\nAsn803"},"p300":{"p":[408,210,108,40],"t":"p300/CBP","n":[288,310,86,36],"fs":16},"act":{"p":[552,210,128,50],"t":"транскрипция\nмишеней","n":[160,330,120,48],"fs":15}},"edges":{"pr":{"a":"phd","b":"pro","k":"rx","t":"Pro-OH","d":[0,-14],"dn":[0,-14],"anc":"middle"},"pv":{"a":"pro","b":"vhl","k":"bind"},"vd":{"a":"vhl","b":"deg","k":"seq"},"fa":{"a":"fih","b":"asn","k":"rx","t":"Asn-OH","d":[0,-14],"dn":[0,-14],"anc":"middle"},"ap":{"a":"asn","b":"p300","k":"bind","t":"связывание","d":[0,-14],"dn":[36,0],"anc":"middle"},"pa":{"a":"p300","b":"act","k":"act"}},"st":{"0":{"n":{"phd":"on","pro":"on","vhl":"on","deg":"on","fih":"on","asn":"on","p300":"base","act":"off"},"e":{"ap":"off","pa":"off"},"t":{"pro":"HIF-1α\nPro402-OH · Pro564-OH","asn":"HIF-1α · Asn803-OH\n(C-концевой домен)"},"tn":{"pro":"HIF-1α\nPro-OH","asn":"HIF-1α\nAsn803-OH"},"m":[["Содержание HIF-1α","низкое"],["Asn803-OH","есть"],["Связь C-концевого домена с p300/CBP","затруднена"]],"note":"При достаточном O₂ работают обе гидроксилазы. Pro-OH направляет HIF-1α к распаду через pVHL, а Asn803-OH мешает C-концевому домену активации связывать p300/CBP."},"1":{"n":{"phd":"low","pro":"base","vhl":"base","deg":"off","fih":"on","asn":"on","p300":"base","act":"low"},"e":{"pr":"off","pv":"off","vd":"off","ap":"off"},"t":{"asn":"HIF-1α · Asn803-OH\n(C-концевой домен)"},"tn":{"asn":"HIF-1α\nAsn803-OH"},"m":[["Содержание HIF-1α","высокое"],["Asn803-OH","сохраняется у значительной части молекул"],["Связь C-концевого домена с p300/CBP","ограничена"]],"note":"Умеренная гипоксия (1 % O₂, 5 ч): пролилгидроксилирование снижено, HIF-1α накапливается. Asn803 при этом во многом остаётся гидроксилированным: в фибробластах кожи человека — более чем на 90 %, в клетках PC3 — примерно наполовину (Tian 2011)."},"2":{"n":{"phd":"low","pro":"base","vhl":"base","deg":"off","fih":"low","asn":"on","p300":"on","act":"on"},"e":{"pr":"off","pv":"off","vd":"off","fa":"off"},"m":[["Содержание HIF-1α","высокое"],["Asn803-OH","резко снижено"],["Связь C-концевого домена с p300/CBP","возможна"]],"note":"Глубокая гипоксия (0,2 % O₂): гидроксилирование Asn803 тоже сильно подавлено. Накопившийся HIF-1α связывает p300/CBP C-концевым доменом и активнее стимулирует транскрипцию."},"3":{"n":{"phd":"low","pro":"base","vhl":"base","deg":"off","fih":"abs","asn":"on","p300":"on","act":"on"},"e":{"pr":"off","pv":"off","vd":"off","fa":"off"},"m":[["Содержание HIF-1α","высокое, как без ингибитора"],["Asn803-OH","снижено ингибитором FIH"],["Связь C-концевого домена с p300/CBP","возможна"]],"note":"Умеренная гипоксия и избирательный ингибитор FIH: содержание HIF-1α то же, что без ингибитора, но Asn803 не гидроксилирован (клетки RCC4 с восстановленным pVHL, Tian 2011). При одинаковом содержании белка различается его способность связывать коактиватор."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13}}},{"id":"hif-time","number":26,"section":3,"title":"Как изменяется ответ HIF при гипоксии и реоксигенации","question":4,"questions":[4],"keywords":["гипоксия","реоксигенация","обновление пула","доля модификации","Pro-OH","Asn-OH","PHD2","PHD3","обратная связь","кинетика","период полужизни"],"lead":["При переходе к [[T61|гипоксии]] доля молекул HIF-α с гидроксилированным пролином может снижаться за счёт обновления пула: новые молекулы поступают без этой модификации, а ранее гидроксилированные разрушаются. При реоксигенации PHD гидроксилируют накопившиеся молекулы HIF-α.","Поэтому снижение доли гидроксилированного HIF-α не требует реакции, которая удаляла бы группу OH."],"mechanism":["При снижении доступности O₂ замедляется образование новых гидроксилированных молекул HIF-α, а уже гидроксилированные продолжают разрушаться.","После восстановления O₂ гидроксилирование имеющихся молекул возобновляется, и HIF-α быстро исчезает через pVHL-зависимый распад.","мРНК и белки генов-мишеней, синтезированные при гипоксии, исчезают со своими скоростями; HIF индуцирует и PHD2, PHD3, что ускоряет распад HIF-α после реоксигенации."],"paragraphs":["Пролилгидроксилирование HIF-α считают практически необратимым: фермента, который снимал бы группу OH с остатка пролина HIF, не описано. Молекула, получившая Pro-OH, остаётся гидроксилированной до своего распада. Поэтому важно различать две величины: химическое состояние отдельной молекулы и [[T64|долю модифицированных молекул]] в пуле, который постоянно обновляется за счёт синтеза и распада.","При переходе к гипоксии PHD гидроксилируют новые молекулы медленнее. Уже гидроксилированные молекулы продолжают распознаваться pVHL и разрушаться, а новые чаще остаются без Pro-OH. Доля гидроксилированного HIF-α падает, содержание белка растёт, и через какое-то время пул почти целиком состоит из молекул, синтезированных при гипоксии. Asn803 в части этих молекул может оставаться гидроксилированным: при умеренной гипоксии FIH сохраняет активность дольше, чем PHD (Tian 2011).","При восстановлении O₂ гидроксилирование возобновляется на уже накопленных молекулах. В клетках RCC4 после 4 ч при 0,1 % O₂ гидроксилирование Pro564 и Asn803 завершалось в течение 1 мин после возврата к 21 % O₂, а Pro402 гидроксилировался с задержкой (Tian 2011). В клетках HeLa и Hep3B HIF-1α после резкого повышения O₂ быстро исчезал (Huang 1996). Распаду помогает обратная связь: HIF индуцирует гены PHD2 и PHD3 (Berra 2003), и после гипоксии этих ферментов в клетке больше, чем до неё.","Белок HIF-1α исчезает быстрее, чем следствия его действия. мРНК генов-мишеней и синтезированные при гипоксии белки разрушаются со своими скоростями, поэтому транскрипционный ответ затухает постепенно. Конкретные минуты и часы зависят от клеток, глубины гипоксии и способа подачи газа к клеткам, поэтому на схеме показан только порядок событий."],"trap":["После восстановления O₂ гипоксический ответ исчезает мгновенно, потому что быстро исчезает HIF-1α.","Белок HIF-1α действительно разрушается быстро, но мРНК и белки генов-мишеней, синтезированные при гипоксии, исчезают со своими скоростями, поэтому ответ затухает постепенно."],"conditions":"Учебная схема без числовой кинетики: число значков не равно числу молекул. Реоксигенация: клетки RCC4 без pVHL, 4 ч при 0,1 % O₂ в чашках с газопроницаемым дном, затем 21 % O₂, иммуноблот с антителами к Hyp402, Hyp564 и Asn803-OH (Tian 2011). Быстрое исчезновение HIF-1α после повышения O₂ — клетки HeLa и Hep3B (Huang 1996). Индукция PHD2 при гипоксии — клетки человека (Berra 2003); индукция PHD2 и PHD3 — клетки HeLa и HT1080 (Tian 2011). Необратимость пролилгидроксилирования принята как допущение схемы: обратной реакции в использованных работах не описано.","sources":["Tian2011","Kaelin2008","Huang1996","Berra2003"],"quiz":{"id":"S10-L26","rev":1,"question":"При переходе к гипоксии доля гидроксилированного HIF-α в обновляющемся пуле уменьшилась. Требует ли это предположения, что с каждой ранее модифицированной молекулы удалили гидроксильную группу?","options":[{"id":"S10-L26-2","text":"Нет: новые молекулы могут поступать без модификации, а ранее модифицированные — разрушаться.","correct":true,"feedback":"Обновление молекул меняет состав пула без необходимости вводить обратную реакцию гидроксилирования."},{"id":"S10-L26-1","text":"Да: уменьшение доли всегда означает обратную химическую реакцию на тех же молекулах.","correct":false,"feedback":"Доля может измениться при обновлении пула, даже если модификация каждой отдельной молекулы сохраняется."},{"id":"S10-L26-3","text":"Да: иначе снижение доступности O₂ не могло бы повлиять на последующие реакции.","correct":false,"feedback":"Недостаток субстрата влияет на образование новых модифицированных молекул, не требуя удаления уже имеющихся групп."}]},"widget":{"kind":"pool_s4","title":"","s":{"title":"Синтез и распад меняют состав пула HIF-1α","status":"Учебная схема · качественные состояния","phases_label":"Момент","phases":["Достаточный O₂","Гипоксия: начало","Гипоксия: часы","Реоксигенация: первые минуты","Реоксигенация: позже"],"bands":["O₂ достаточно","гипоксия","O₂ восстановлен"],"marks":[0.16,0.4,0.6,0.72,0.9],"pool_t":"молекулы HIF-1α в клетке","mol":"HIF-1α","tag_p":"OH","tag_a":"OH","leg_p":"слева — Pro-OH (PHD)","leg_a":"справа — Asn803-OH (FIH)","syn":"синтез: новые\nмолекулы без OH","prot":"распад через\npVHL и протеасому","fixed":"Пунктир и × — молекула распознана и разрушается вместе со своими метками. Реакции, удаляющей группу OH с HIF-α, на схеме нет.","st":[{"mols":["pad","n"],"deg":"on","mk":"новые молекулы быстро гидроксилируются и разрушаются","m":[["Содержание HIF-1α","низкое"],["Молекулы с Pro-OH","быстро удаляются"],["мРНК мишеней HIF","низкое содержание"]],"note":"При достаточном O₂ вновь синтезированная молекула быстро получает группы OH, распознаётся pVHL и разрушается. В каждый момент молекул HIF-1α в клетке мало.","mk_n":"новые молекулы быстро\nгидроксилируются и разрушаются"},{"mols":["pad","pad","n","n","na"],"deg":"on","mk":"молекулы с Pro-OH разрушаются, новые остаются без Pro-OH","m":[["Содержание HIF-1α","растёт"],["Доля молекул с Pro-OH","снижается"],["мРНК мишеней HIF","начинает расти"]],"note":"В начале гипоксии уже гидроксилированные молекулы по-прежнему распознаются pVHL и разрушаются. Новые молекулы реже получают Pro-OH и остаются в клетке. Доля молекул с Pro-OH падает без удаления групп OH: меняется состав пула.","mk_n":"молекулы с Pro-OH разрушаются;\nновые остаются без Pro-OH"},{"mols":["na","n","na","n","na","n","na","n","na"],"deg":"low","mk":"большинство молекул без Pro-OH; Asn803-OH — у части молекул","mk_n":"большинство молекул без Pro-OH;\nAsn803-OH — у части молекул","m":[["Содержание HIF-1α","высокое"],["Доля молекул с Pro-OH","низкая"],["мРНК мишеней HIF, в том числе PHD2 и PHD3","повышено"]],"note":"Через несколько часов пул почти целиком состоит из молекул, синтезированных при гипоксии. Asn803 у части из них гидроксилирован: при умеренной гипоксии FIH работает дольше, чем PHD. HIF активирует и гены PHD2 и PHD3: эта обратная связь ограничивает накопление HIF-α уже при гипоксии и ускоряет его распад после восстановления O₂."},{"mols":["pad","pad","pad","pad","pad","pad","na","na","n"],"deg":"on","mk":"гидроксилирование возобновилось на уже имеющихся молекулах","mk_n":"гидроксилирование возобновилось\nна уже имеющихся молекулах","m":[["Содержание HIF-1α","быстро снижается"],["Молекулы с Pro-OH","снова образуются"],["мРНК мишеней HIF","ещё повышено"]],"note":"После восстановления O₂ PHD гидроксилируют уже накопленные молекулы — в клетках RCC4 Pro564 и Asn803 были гидроксилированы в течение 1 мин, Pro402 — с задержкой (Tian 2011). Гидроксилированный HIF-1α распознаётся pVHL и разрушается; больше PHD2 и PHD3, синтезированных при гипоксии, ускоряет этот процесс."},{"mols":["pad","n"],"deg":"on","mk":"HIF-1α снова мало; мРНК и белки мишеней исчезают со своими скоростями","mk_n":"HIF-1α снова мало; мишени\nисчезают со своими скоростями","m":[["Содержание HIF-1α","низкое"],["мРНК мишеней HIF","снижается постепенно"],["Белки, синтезированные при гипоксии","удаляются не сразу"]],"note":"Содержание HIF-1α возвращается к низкому раньше, чем исчезают его следствия: мРНК и белки-мишени, синтезированные при гипоксии, разрушаются со своими скоростями. Поэтому ответ затухает постепенно."}]}}},{"id":"hif-context","number":27,"section":3,"title":"Как программы HIF зависят от изоформы и ткани","question":4,"questions":[4],"keywords":["HIF-1","HIF-2","EPAS1","EPO","эритропоэтин","GLUT1","SLC2A1","LDHA","PDK1","VEGFA","псевдогипоксия","VHL","рак почки","эволюция"],"lead":["HIF-1 и HIF-2 регулируют частично общие, а частично разные наборы генов, и результат зависит от ткани.","HIF-1 связан прежде всего с переходом на гликолиз, а физиологическая регуляция эритропоэтина — преимущественно с HIF-2."],"mechanism":["HIF-1 повышает экспрессию генов транспорта глюкозы и гликолиза (SLC2A1, LDHA) и гена [[T63|киназы пируватдегидрогеназы PDK1]].","Регуляция эритропоэтина (EPO) у мышей зависит преимущественно от HIF-2 и связана с клетками почки и печени.","При потере pVHL HIF-α стабилен без снижения O₂ — это [[T62|псевдогипоксический ответ]], и его мишени зависят от того, какая изоформа преобладает."],"paragraphs":["Обе изоформы, HIF-1α и HIF-2α, образуют комплекс с ARNT и связываются с HRE, но наборы активируемых генов совпадают лишь частично. Для HIF-1 хорошо изучена метаболическая программа: он связывается с HRE в промоторах генов ферментов гликолиза, в том числе LDHA (Semenza 1996), повышает экспрессию транспортёра глюкозы GLUT1 (ген SLC2A1) и гена VEGFA — фактора роста эндотелия сосудов (Forsythe 1996).","К этой программе относится и киназа пируватдегидрогеназы 1 (PDK1). Её не следует путать с PDPK1, которую в литературе о пути PI3K–AKT тоже сокращают как PDK1. PDK1 фосфорилирует и подавляет пируватдегидрогеназу, поэтому пируват реже превращается в ацетил-CoA и меньше окисляется в митохондриях; в фибробластах без HIF-1α принудительная экспрессия PDK1 повышала содержание ATP и выживаемость при гипоксии (Kim 2006). Так связаны темы семинаров 8 и 10.","Эритропоэтин удобно приводить как пример тканевой специфичности. У взрослых мышей почка — основной источник эритропоэтина; гипоксическая индукция Epo в почке полностью зависела от Hif-2, а при удалении Hif-2 в почке основным регулятором становился Hif-2 печени (Kapitsinou 2010). Поэтому EPO нельзя считать универсальной мишенью HIF-1 в любой клетке.","Псевдогипоксический ответ возникает, когда часть гипоксической регуляции включается без снижения O₂, например при потере pVHL или при накоплении сукцината и фумарата. Это не синоним эффекта Варбурга. В клетках рака почки с дефектом VHL изоформы различались по мишеням: VEGFA, который в других клетках индуцирует и HIF-1 (Forsythe 1996), здесь отвечал преимущественно на HIF-2α (Raval 2005). Система HIF консервативна от нематоды Caenorhabditis elegans до позвоночных (Berra 2003); сходство функции у разных животных само по себе не говорит о времени её возникновения."],"trap":["PDK1 в программе HIF-1 — та же киназа, которая фосфорилирует AKT в пути PI3K.","Мишень HIF-1 — киназа пируватдегидрогеназы 1, которая подавляет пируватдегидрогеназный комплекс. Киназу пути PI3K–AKT называют PDPK1; одинаковое сокращение не означает одного белка."],"conditions":"Схема механизма: качественные состояния, ткани подписаны по источникам. Гены гликолиза — клетки человека, HRE промоторов ALDOA, ENO1, LDHA (Semenza 1996); VEGF — клетки Hep3B, репортёрные конструкции (Forsythe 1996); PDK1 — фибробласты мыши без HIF-1α и клетки человека (Kim 2006); EPO — мыши с удалением Hif-2α в почке или печени (Kapitsinou 2010); различия изоформ — клетки рака почки с дефектом VHL и ксенотрансплантаты (Raval 2005). Схема не описывает лечение и не предсказывает ответ конкретного пациента.","sources":["Kaelin2008","Kapitsinou2010","Semenza1996","Forsythe1996","Kim2006","Raval2005","Berra2003"],"quiz":{"id":"S10-L27","rev":1,"question":"Как корректно включить EPO в объяснение семейства HIF?","options":[{"id":"S10-L27-3","text":"Связать регуляцию EPO в организме преимущественно с HIF-2 и указать ткани.","correct":true,"feedback":"Так сохраняется роль семейства HIF и различаются его изоформы и условия действия."},{"id":"S10-L27-1","text":"Описать EPO как прямую мишень HIF-1, общую для клеток разных тканей.","correct":false,"feedback":"Так теряются различия изоформ и тканей; этот вывод шире приведённых оснований."},{"id":"S10-L27-2","text":"Исключить EPO, поскольку его синтез регулируется без участия HIF.","correct":false,"feedback":"HIF-зависимая регуляция EPO установлена; ограничение касается конкретной изоформы и типа клеток."}]},"widget":{"kind":"net","title":"","s":{"title":"Программы HIF-1 и HIF-2","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Показать","opts":["Программа HIF-1","Программа HIF-2","Потеря pVHL при достаточном O₂"]}],"W":620,"H":340,"NW":340,"NH":444,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"мишень, общая для изоформ; вклад зависит от клеток","nodes":["жёлтая рамка — активно, экспрессия повышена","пунктирная рамка — подавлено"]},"zones":[{"x":216,"y":8,"w":168,"h":176,"c":"plain","t":"метаболизм глюкозы","lx":224,"ly":176,"n":[156,22,180,152,162,37],"a":"start"},{"x":216,"y":278,"w":398,"h":56,"c":"plain","t":"эритропоэз: почка, печень","lx":604,"ly":311,"n":[156,356,180,66,330,434],"tn":"почка, печень","a":"end"}],"mem":[],"nodes":{"h1":{"p":[90,90,150,44],"t":"HIF-1α · ARNT","n":[60,140,104,48],"fs":16,"tn":"HIF-1α\n· ARNT"},"h2":{"p":[90,300,150,44],"t":"HIF-2α · ARNT","n":[60,380,104,48],"fs":16,"tn":"HIF-2α\n· ARNT"},"glut":{"p":[300,40,150,34],"t":"SLC2A1 (GLUT1)","n":[242,60,164,32],"fs":15},"ldha":{"p":[300,86,150,34],"t":"LDHA","n":[242,104,164,32],"fs":15},"pdk":{"p":[300,132,150,34],"t":"PDK1","n":[242,148,164,32],"fs":15},"pdh":{"p":[520,132,150,46],"t":"пируват-\nдегидрогеназа","n":[252,214,150,44],"fs":14},"vegf":{"p":[300,222,150,34],"t":"VEGFA","n":[242,300,164,34],"fs":15},"epo":{"p":[300,300,150,34],"t":"EPO","n":[242,380,164,34],"fs":15}},"edges":{"a1":{"a":"h1","b":"glut","k":"act"},"a2":{"a":"h1","b":"ldha","k":"act"},"a3":{"a":"h1","b":"pdk","k":"act"},"ph":{"a":"pdk","b":"pdh","k":"phos"},"v1":{"a":"h1","b":"vegf","k":"act","dash":true},"v2":{"a":"h2","b":"vegf","k":"act","dash":true},"e2":{"a":"h2","b":"epo","k":"act"}},"st":{"0":{"n":{"h1":"on","h2":"base","glut":"on","ldha":"on","pdk":"on","pdh":"low","vegf":"on","epo":"base"},"e":{"a1":"on","a2":"on","a3":"on","ph":"on","v1":"on","v2":"off","e2":"off"},"m":[["Преимущественные мишени","SLC2A1, LDHA, PDK1"],["Следствие для метаболизма","гликолиз ↑, окисление пирувата в митохондриях ↓"]],"note":"HIF-1 повышает экспрессию генов транспортёра глюкозы GLUT1 и ферментов гликолиза, в том числе LDHA. Он индуцирует и киназу пируватдегидрогеназы PDK1: она фосфорилирует и подавляет пируватдегидрогеназу, и пируват реже превращается в ацетил-CoA (Kim 2006)."},"1":{"n":{"h1":"base","h2":"on","glut":"base","ldha":"base","pdk":"base","pdh":"base","vegf":"on","epo":"on"},"e":{"a1":"off","a2":"off","a3":"off","ph":"off","v1":"off","v2":"on","e2":"on"},"m":[["Преимущественная мишень в этом примере","EPO"],["Где показано","почка и печень мыши"]],"note":"Физиологическая регуляция эритропоэтина связана преимущественно с HIF-2: у мышей гипоксическая индукция Epo в почке полностью зависела от Hif-2, а без почечного Hif-2 основным регулятором становился Hif-2 печени (Kapitsinou 2010)."},"2":{"n":{"h1":"on","h2":"on","glut":"on","ldha":"on","pdk":"on","pdh":"low","vegf":"on","epo":"on"},"e":{"a1":"on","a2":"on","a3":"on","ph":"on","v1":"on","v2":"on","e2":"on"},"m":[["O₂","достаточно"],["HIF-1α и HIF-2α","стабильны без снижения O₂"]],"note":"Псевдогипоксический ответ: при потере pVHL HIF-α стабилен при достаточном O₂, и гены-мишени работают так, как при гипоксии, — в тех клетках, где эти гены доступны для транскрипции. В клетках рака почки с дефектом VHL HIF-1α и HIF-2α различались по мишеням; VEGFA там отвечал преимущественно на HIF-2α (Raval 2005)."}},"fs":17,"nfs":14,"lfs":17,"zfs":16,"nlfs":13}}},{"id":"hif-measure","number":28,"section":3,"title":"Как различить гидроксилирование, стабильность и транскрипционный эффект HIF","question":4,"questions":[4],"keywords":["иммуноблот","антитела к гидроксипролину","Pro564-OH","Asn803-OH","MG132","DMOG","дефероксамин","кобальт","CoCl₂","pVHL","пептид","коиммунопреципитация","импульсное мечение","siRNA","HRE","репортёр","RCC4"],"lead":["Гидроксилирование HIF-α, его распознавание pVHL, стабильность белка и транскрипционный ответ — разные этапы, и для каждого нужен свой способ измерения.","Ни одно измерение не заменяет остальные: одинаковое содержание HIF-1α может сочетаться с разной модификацией и разной активностью."],"mechanism":["Антитело к общему HIF-1α и антитела к Pro564-OH или Asn803-OH определяют разные формы белка; быстрый распад уменьшает видимое количество гидроксилированной формы.","Связывание гидроксилированного пептида с pVHL и прослеживание меченого белка во времени проверяют распознавание и скорость распада отдельно от содержания белка.","Репортёр с HRE и мРНК генов-мишеней характеризуют транскрипционный ответ, а генетические и фармакологические вмешательства — необходимость отдельных звеньев."],"paragraphs":["Иммуноблот с антителами к общему HIF-1α показывает, сколько белка в образце в данный момент. Антитела, распознающие только гидроксилированный Pro402, Pro564 или Asn803, позволяют увидеть соответствующую модифицированную форму; их специфичность в экспериментах Tian 2011 проверяли масс-спектрометрией и мутантными белками. Но сигнал модифицированной формы зависит не только от скорости гидроксилирования. В клетках с работающим pVHL гидроксилированный HIF-1α быстро разрушается, и полоса Pro564-OH слабая, хотя реакция идёт. Поэтому для сравнения сайтов использовали клетки RCC4 без pVHL или ингибитор протеасомы MG132.","Распознавание проверяют отдельно: очищенный pVHL связывал пептид HIF только при гидроксилированном пролине, а пептид без гидроксильной группы служил контролем (Ivan 2001; Jaakkola 2001). Скорость распада оценивают по исчезновению меченой популяции белка во времени: содержание в одной временной точке не отделяет синтез от распада.","Вещества, которые называют «миметиками гипоксии», не равнозначны гипоксии и друг другу. В клетках RCC4 DMOG сильнее подавлял гидроксилирование Asn803, хелаторы железа — пролилгидроксилирование, а ионы кобальта подавляли пролилгидроксилирование, почти не затрагивая Asn803 (Tian 2011). Генетическое сравнение дополняет фармакологию: клетки без pVHL и те же клетки с восстановленным pVHL (Maxwell 1999) отделяют гидроксилирование от быстрого распада, хотя длительная потеря pVHL меняет и другие свойства клетки.","Транскрипционный эффект измеряют по мРНК генов-мишеней или по репортёру, в котором HRE управляет синтезом белка с удобно регистрируемым сигналом. Мутантный HRE служит контролем (Forsythe 1996). Такой репортёр показывает работу выбранного элемента ДНК, но не всю программу HIF в клетке."],"trap":["Любое вещество, повышающее содержание HIF-1α, действует так же, как недостаток O₂.","DMOG, хелаторы железа и ионы кобальта повышают содержание HIF-1α, но по-разному меняют гидроксилирование Pro и Asn803 и затрагивают другие ферменты. Совпадение одного показателя не означает одного механизма."],"conditions":"Схемы принципа методов и учебный рисунок иммуноблота: полосы показывают ожидаемое направление различий, а не измеренные величины. Данные экспериментов: клетки RCC4 и RCC4 с восстановленным pVHL, иммуноблот с антителами к Hyp402, Hyp564 и Asn803-OH, DMOG 1 мМ, хелаторы железа и ионы металлов, 4–5 ч (Tian 2011); связывание пептидов HIF-1α человека с pVHL (Ivan 2001; Jaakkola 2001); клеточные линии рака почки с дефектом VHL и введение VHL, коиммунопреципитация (Maxwell 1999); siRNA к PHD1–3 в клетках человека (Berra 2003); репортёр с HRE гена VEGF в клетках Hep3B (Forsythe 1996). Этот шаг — дополнительный материал о методах.","sources":["Tian2011","Jaakkola2001","Maxwell1999","Ivan2001","Berra2003","Forsythe1996"],"quiz":{"id":"S10-L28","rev":1,"question":"При одинаковом содержании общего HIF-1α изменился сигнал антитела к Pro564-OH. Какой вывод непосредственно относится к такому измерению?","options":[{"id":"S10-L28-2","text":"Транскрипция HRE-зависимых генов изменилась в той же пропорции, что и этот сигнал.","correct":false,"feedback":"Между модификацией одного остатка и ответами разных генов есть дополнительные уровни регуляции."},{"id":"S10-L28-1","text":"Изменился сигнал Pro564-OH-формы; транскрипционную активность HIF нужно оценить отдельно.","correct":true,"feedback":"Антитело характеризует конкретный эпитоп, а не суммарный функциональный выход транскрипционного комплекса."},{"id":"S10-L28-3","text":"Установлена скорость гидроксилирования без дополнительных временных измерений.","correct":false,"feedback":"Количество модифицированной формы в выбранный момент зависит также от синтеза и распада, а не только от скорости реакции."}]},"widget":{"kind":"meth_s4","title":"","s":{"title":"Как измеряют разные этапы пути PHD–pVHL–HIF","status":"Схемы принципа методов · учебный рисунок, не данные эксперимента","opts_label":"Метод","opts":["Иммуноблот","Связывание с pVHL","Распад во времени","Генетическое сравнение","Вещества-ингибиторы","Репортёр с HRE"],"heads":["Что измеряют","Контроль","Предел вывода"],"fixed":"Схемы показывают порядок операций; полосы иммуноблота нарисованы как пример возможного результата, а не взяты из эксперимента.","methods":[{"rows":[{"t":"","steps":["клетки:\nодин срок","лизат: равное\nколичество\nбелка","электрофорез,\nперенос на\nмембрану","антитела:\nобщий HIF-1α,\nOH-формы","сигнал\nполосы"]}],"blot":{"rows":[["общий HIF-1α",[0.15,0.95,0.9,0.9]],["Pro564-OH",[0.08,0.9,0.85,0.08]],["Asn803-OH",[0.1,0.85,0.85,0.0]],["β-актин",[0.8,0.8,0.8,0.8]]],"lanes":["O₂ 21 %","O₂ 21 %\n+ MG132","без pVHL\n(RCC4)","DMOG"],"lanes_n":["21 %","MG132","RCC4","DMOG"],"cap":"учебный рисунок · один срок · не данные эксперимента"},"cells":["Содержание общего HIF-1α и содержание его форм с гидроксилированным Pro564 или Asn803 в образце.","Одинаковые срок и загрузка (β-актин); образцы с накопленным гидроксилированным белком (MG132, клетки без pVHL) и без гидроксилирования (DMOG) проверяют специфичность антител.","Сигнал антитела без калибровки не равен доле модификации и не показывает скорость реакции."],"note":"Быстрый распад уменьшает видимое количество гидроксилированного HIF-1α: при 21 % O₂ полоса Pro564-OH слабая, хотя реакция идёт. Когда протеасома ингибирована (MG132) или pVHL отсутствует, гидроксилированная форма накапливается и выявляется (Tian 2011)."}
