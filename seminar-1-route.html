 Krainc D. 2018. Mitochondria-lysosome contacts regulate mitochondrial fission via RAB7 GTP hydrolysis. Nature</a></li><li><a href="https://doi.org/10.1038/ng1341">Züchner S. et al. 2004. Mutations in the mitochondrial GTPase mitofusin 2 cause Charcot-Marie-Tooth neuropathy type 2A. Nat Genet</a></li><li><a href="https://doi.org/10.1016/j.cmet.2013.04.020">Csordás G. et al. 2013. MICU1 controls both the threshold and cooperative activation of the mitochondrial Ca²⁺ uniporter. Cell Metab</a></li><li><a href="https://doi.org/10.15252/embj.201796687">Mesmin B. et al. 2017. Sterol transfer, PI4P consumption, and control of membrane lipid order by endogenous OSBP. EMBO J</a></li><li><a href="https://doi.org/10.1126/science.adh9351">Naón D. et al. 2023. Splice variants of mitofusin 2 shape the endoplasmic reticulum and tether it to mitochondria. Science</a></li></ul><p>Деление в месте контакта с ЭПР — дрожжи и клетки COS-7 (Friedman 2011, реферат). Контакты митохондрий с лизосомами, Rab7 Q67L и мутанты TBC1D15 — клетки HeLa и HCT116, прижизненная микроскопия и ЭМ (Wong 2018, полный текст). MFN2 и болезнь Шарко — Мари — Тута типа 2A — генетическое исследование семей (Züchner 2004). Таблица — сводка данных.</p></details></article><article class="card print-unit" id="ns-prove-contact"><div class="eyebrow">Контактные сайты · шаг 28 из 30</div><h2>Как доказывают, что мембраны в контакте, а не слились</h2><p class="lead">Каждый метод устанавливает свой признак контакта и имеет свои ограничения. Колокализация в обычном световом микроскопе контакт не доказывает, а репортёр из двух половин может сам стабилизировать контакт.</p><ol class="mech"><li>Обычный световой микроскоп разрешает около 200–250 нм в плоскости препарата и 500–700 нм по оси z — много больше зазора контакта, поэтому контакт, слияние и соседство в нём неразличимы.</li><li><a href="#ns-g-S1-T87">Электронная томография</a> измеряет зазор; FRET и BRET дают сигнал только при сближении донора и акцептора примерно до 10 нм.</li><li><a href="#ns-g-S1-T89">Репортёр из двух половин</a> накапливает сигнал от всех контактов за время экспрессии и может их стабилизировать; раздельность содержимого проверяют маркерами просветов.</li></ol><p>Разрешение обычного светового микроскопа — около 200–250 нм в плоскости препарата и 500–700 нм по оси z (Scorrano 2019), а зазор контакта ЭПР — митохондрия — 10–30 нм. К тому же маркер находится не на самой поверхности мембраны. Поэтому перекрывание сигналов маркеров двух органелл одинаково выглядит при контакте, при слиянии и при простом соседстве: колокализация в обычном микроскопе не доказывает контакта и не даёт расстояния между мембранами.</p><p>Расстояние между мембранами измеряет электронная микроскопия, особенно томография, дающая трёхмерную картину зазора (Csordás 2006). Криоэлектронная томография обходится без химической фиксации: в клетках с избытком E-Syt зазор между ЭПР и плазматической мембраной составлял 19–22 нм (Fernández-Busnadiego 2015). ЭМ показывает геометрию в один момент, но не перенос.</p><p>Сигнал только при сближении дают FRET и BRET: при FRET возбуждённый донор безызлучательно передаёт энергию акцептору на расстоянии примерно до 10 нм, в BRET донором служит люцифераза. При комплементации расщеплённого флуоресцентного белка (split-GFP, SPLICS) половины, закреплённые на разных органеллах, при сближении собираются в целый белок. Сборка малообратима, поэтому репортёр накапливает сигнал от всех сближений за время экспрессии; версии SPLICS регистрировали узкие (8–10 нм) и широкие (40–50 нм) контакты ЭПР с митохондриями (Cieri 2018). При избыточной экспрессии такие репортёры способны стабилизировать контакты и увеличить измеряемую площадь (Filadi 2026).</p><p>От слияния контакт отличает раздельность содержимого: маркеры просветов двух органелл не смешиваются. Количественный вывод, полученный репортёром, подтверждают методом без искусственной привязки.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем ярче сигнал репортёра из двух половин, тем больше контактов было в клетке до измерения.<p class="trap-fix">Сборка половин малообратима: репортёр накапливает сигнал от всех контактов за время экспрессии и при избытке может их стабилизировать. Сигнал отражает и саму конструкцию, поэтому вывод проверяют методом без искусственной привязки, например ЭМ.</p></div><div class="static-quiz"><h3>FRET между донором на мембране ЭПР и акцептором на наружной мембране митохондрии вырос. Что показывает этот результат?</h3><ol><li><b>А.</b> Мембраны двух органелл слились <i>(неверный вариант)</i><br><span class="expl">FRET требует сближения донора и акцептора, но не слияния; о содержимом компартментов он ничего не говорит.</span></li><li><b>Б.</b> Донор и акцептор сблизились примерно до 10 нм <i>(верный вариант)</i><br><span class="expl">FRET возникает, когда донор и акцептор находятся на расстоянии около 10 нм и ближе. Это сближение конструкций; зазор между мембранами зависит ещё от их длины и ориентации.</span></li><li><b>В.</b> Через контакт стало проходить больше Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">FRET регистрирует сближение, а не поток; перенос Ca²⁺ измеряют отдельно, например сенсором Ca²⁺ в матриксе.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-1.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200604016">Csordás G. et al. 2006. Structural and functional features and significance of the physical linkage between ER and mitochondria. J Cell Biol</a></li><li><a href="https://doi.org/10.1073/pnas.1503191112">Fernández-Busnadiego R., Saheki Y., De Camilli P. 2015. Three-dimensional architecture of extended synaptotagmin-mediated endoplasmic reticulum-plasma membrane contact sites. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1038/s41418-017-0033-z">Cieri D. et al. 2018. SPLICS: a split green fluorescent protein-based contact site sensor for narrow and wide heterotypic organelle juxtaposition. Cell Death Differ</a></li><li><a href="https://doi.org/10.1038/s41556-026-02003-w">Filadi R. et al. 2026. Advanced imaging of membrane contact sites. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41580-025-00864-x">Calì T. et al. 2025. Key challenges and recommendations for defining organelle membrane contact sites. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41467-019-09253-3">Scorrano L. et al. 2019. Coming together to define membrane contact sites. Nat Commun</a></li></ul><p>Предел разрешения и сравнение методов — Scorrano 2019 (полный текст PMC: 250 нм в плоскости, 500–700 нм по оси z); обзоры Filadi 2026 и Calì 2025 (прочитаны рефераты). Электронная томография связей ЭПР — митохондрия — митохондрии печени крысы и клетки DT40 (Csordás 2006, полный текст). Криоэлектронная томография контактов E-Syt — клетки COS-7 (Fernández-Busnadiego 2015, реферат). SPLICS — клетки HeLa и HEK293, нейроны рыбки данио in vivo (Cieri 2018, полный текст). Схемы — схемы методов; расстояния не в масштабе.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 29 из 30</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Для каждого механизма семинара сначала решают, какую величину измерять, затем — каким методом и с каким контролем. Во всех четырёх разделах одно и то же наблюдение совместимо с несколькими механизмами, и разделяют их только правильно выбранные величина и контроль.</p><ol class="mech"><li>Величина: pH и свободный Ca²⁺ в просвете органеллы, концентрация в точке и средняя по клетке, содержание метки на мембране, расстояние между мембранами и поток через контакт — разные измерения, и одно не заменяет другое.</li><li>Метод: адресованный ратиометрический сенсор с калибровкой, прижизненная съёмка с пространственным разрешением, сенсор на основе липид-связывающего домена, электронная томография и измерение переноса.</li><li>Контроль: удаление белка или метки показывает <a href="#ns-g-S1-T90">необходимость</a>, а перенос фермента в новое место или искусственная привязка — <a href="#ns-g-S1-T91">достаточность</a>; каждый инструмент проверяют на то, не меняет ли он сам измеряемую величину.</li></ol><p>Каждый из четырёх механизмов описывается своей величиной. Для компартмента это pH, свободный Ca²⁺ или потенциал пары глутатиона в просвете конкретной органеллы; их измеряют сенсором, адресованным в эту органеллу, по отношению сигналов при двух длинах волн и с калибровкой в крайних точках. Для локальной концентрации нужна величина в точке, а не средняя: анализ лизата уничтожает именно ту пространственную информацию, которая определяет ответ.</p><p>Для липидного кода величина — содержание определённого фосфоинозитида на определённой мембране. Сенсор на основе одного домена показывает места, где липид сочетается с условиями связывания, и сам конкурирует с эндогенными эффекторами; липидомика даёт состав, но теряет локализацию. Причинность метки проверяют вмешательством: фосфатазу переносят на мембрану за минуты и смотрят, что меняется. Для контакта величины три: расстояние между мембранами (электронная томография), состав белков в зоне сближения и поток вещества, который измеряют отдельно.</p><p>Контроль отвечает на вопрос, который задаёт опыт. Удаление белка показывает, что без него процесс нарушается, но не то, что белок сам выполняет процесс. Достаточность проверяют добавлением: фермент переносят в новое место, мембраны соединяют искусственной привязкой. Наконец, у каждого инструмента есть собственное действие: сенсор буферирует лиганд, репортёр из двух половин стабилизирует контакт, ингибитор в высокой дозе действует и на другие мишени. Переключайте механизмы в таблице и сравнивайте строки «ограничение».</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок необходим для процесса, его достаточно, чтобы этот процесс шёл.<p class="trap-fix">Удаление белка показывает только необходимость. Достаточность проверяют отдельным опытом: фермент переносят в новое место или мембраны соединяют искусственной привязкой и смотрят, возникает ли процесс.</p></div><div class="static-quiz"><h3>После стимула общее содержание кальция в лизате клеток не изменилось. Какой вывод из этого измерения допустим?</h3><ol><li><b>А.</b> О локальном сигнале по этому измерению судить нельзя <i>(верный вариант)</i><br><span class="expl">Лизат даёт среднюю по клетке величину и общий, а не свободный кальций. Неизменное среднее совместимо и с отсутствием сигнала, и с локальным подъёмом в малом объёме, и с перераспределением между депо и цитозолем. Различить их можно только адресованным сенсором с разрешением во времени и пространстве.</span></li><li><b>Б.</b> Сигнала Ca²⁺ в клетках не было <i>(неверный вариант)</i><br><span class="expl">Отсутствие изменения среднего не доказывает отсутствия сигнала: 10⁴ ионов в объёме клетки прибавляют лишь около 17 нМ общего кальция, а в микродомене те же ионы дают около 170 мкМ.</span></li><li><b>В.</b> Сигнал был, но кальций связали буферы <i>(неверный вариант)</i><br><span class="expl">Этот вариант тоже делает вывод, которого измерение не поддерживает: общее содержание кальция не говорит ни о наличии сигнала, ни о том, какая часть ионов связана. Для такого заключения нужен отдельный опыт со свободным Ca²⁺.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-1.html#q1">Вопрос 1 →</a> <a href="seminar-1.html#q2">Вопрос 2 →</a> <a href="seminar-1.html#q3">Вопрос 3 →</a> <a href="seminar-1.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BCJ20220223">Lyons A. C., Mehta S., Zhang J. 2023. Fluorescent biosensors illuminate the spatial regulation of cell signaling across scales. Biochem J</a></li><li><a href="https://doi.org/10.1126/science.1222483">Hammond G. R. V. et al. 2012. PI4P and PI(4,5)P2 are essential but independent lipid determinants of membrane identity. Science</a></li><li><a href="https://doi.org/10.1038/s41580-025-00864-x">Calì T. et al. 2025. Key challenges and recommendations for defining organelle membrane contact sites. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nrm2820">Casey J. R., Grinstein S., Orlowski J. 2010. Sensors and regulators of intracellular pH. Nat Rev Mol Cell Biol</a></li></ul><p>Сводная таблица по шагам разделов 1–4; схемы методов показаны в шагах «Как измеряют pH и редокс-потенциал внутри органеллы», «Как измеряют градиенты в живой клетке и чем ограничены эти измерения», «Что показывают методы изучения фосфоинозитидов и где их пределы» и «Как доказывают, что мембраны в контакте, а не слились». Перенос фосфатазы на плазматическую мембрану рапамицином — Hammond 2012 (клетки COS-7); ограничения адресованных сенсоров — Lyons 2023; рекомендации к доказательству контакта — Calì 2025.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 30 из 30</div><h2>Исследование одной лизосомы: кислый просвет, метка, кальций и контакты</h2><p class="lead">Лизосома объединяет все четыре механизма семинара: насос поддерживает кислую среду просвета, мембрану размечает PI(3,5)P₂, выход Ca²⁺ через канал TRPML1 создаёт местный сигнал, а выход Ca²⁺ из ЭПР через IP₃R участвует в пополнении её запаса Ca²⁺ (путь в просвет лизосомы не установлен). Опыт Medina 2015 показывает, как отличить местный сигнал от общего подъёма Ca²⁺ по всей цитоплазме.</p><ol class="mech"><li>Компартмент и метка: V-АТФаза поддерживает pH просвета 4,5–5,0, а PI(3,5)P₂ поздних эндосом и лизосом активирует Ca²⁺-канал <a href="#ns-g-S1-T69">TRPML1</a> (MCOLN1).</li><li>Местный сигнал: в клетках HeLa в солевом растворе без аминокислот и сыворотки (HBSS) Ca²⁺ выходит из лизосом через TRPML1, <a href="#ns-g-S1-T92">кальциневрин</a> дефосфорилирует TFEB, и TFEB перемещается в ядро; экворин общего подъёма Ca²⁺ в объёме цитозоля при этом не обнаруживает.</li><li>Пополнение: выход Ca²⁺ из ЭПР через рецепторы IP₃ участвует в пополнении запаса Ca²⁺ лизосомы — блокада этих рецепторов прекращала пополнение. IP₃R находится в мембране ЭПР и не служит каналом через обе мембраны: в просвет лизосомы Ca²⁺ должен войти отдельным путём, который не установлен; участие тесного сближения органелл авторы предлагают как объяснение (Garrity 2016).</li></ol><p>Лизосома удобна как итоговый пример, потому что в ней сходятся все четыре вопроса. Её просвет — неравновесный компартмент: V-АТФаза закачивает протоны и поддерживает pH 4,5–5,0, а свободного Ca²⁺ в просвете — сотни микромолей при концентрации около 100 нМ в цитозоле. Мембрану поздней эндосомы и лизосомы размечает PI(3,5)P₂, синтезируемый киназой PIKfyve; в опытах с изолированными лизосомами этот липид прямо активировал канал TRPML1 (Dong 2010). Так метка мембраны оказывается условием работы её канала.</p><p>Medina и соавторы (2015) искали фосфатазу, которая дефосфорилирует фактор транскрипции TFEB. Ею оказался кальциневрин — Ca²⁺-зависимая фосфатаза. В клетках HeLa в солевом растворе без аминокислот и сыворотки TFEB перемещался в ядро, хотя экворин в объёме цитозоля не регистрировал подъёма Ca²⁺. Сигнал зарегистрировал сенсор GCaMP3, присоединённый к самому TRPML1, то есть закреплённый на поверхности лизосомы. Перемещение TFEB подавляли быстрый <a href="#ns-g-S1-T93">буфер Ca²⁺</a> BAPTA (но не медленный EGTA) и подавление синтеза TRPML1. Такой набор результатов согласуется с <a href="#ns-g-S1-T06">микродоменом</a> — тесным пространственно-временным сопряжением источника Ca²⁺ и мишени: ион связывается с ближайшей мишенью раньше, чем его перехватит медленный буфер или он разбавится в объёме цитозоля. Определённое расстояние из сравнения BAPTA и EGTA без кинетической модели не следует, тем более что одинаковые дозы BAPTA-AM и EGTA-AM не обязательно создают в клетке одинаковую буферную ёмкость.</p><p>Запас Ca²⁺ лизосомы ограничен, и после выброса он должен пополняться. Garrity и соавторы (2016) показали, что пополнение продолжалось при ингибиторе V-АТФазы, но прекращалось при опустошении ЭПР или блокаде рецепторов IP₃; авторы предположили, что Ca²⁺ поступает в местах тесного сближения ЭПР с лизосомой. Как Ca²⁺, вышедший из ЭПР, пересекает затем мембрану лизосомы, из этих опытов не следует; на схеме этот участок пути показан точками со знаком вопроса. Контакт лизосомы с митохондрией, в свою очередь, задаёт место деления митохондрии (Wong 2018). Переключайте условия на схеме и проследите, какое показание меняется в каждом опыте: pH просвета, сигнал у лизосомы, средний Ca²⁺ в цитоплазме или положение TFEB.</p><div class="note trap"><strong>Типичная ошибка</strong> Если средняя концентрация Ca²⁺ в цитозоле не выросла, то и Ca²⁺-зависимые ферменты не активировались.<p class="trap-fix">Фермент у источника отвечает на локальную концентрацию. В солевом растворе без аминокислот и сыворотки экворин в объёме цитозоля не регистрировал подъёма, а сенсор на поверхности лизосомы регистрировал, и кальциневрин дефосфорилировал TFEB; быстрый буфер BAPTA этот ответ подавлял, медленный EGTA — нет.</p></div><div class="static-quiz"><h3>В клетках HeLa в растворе без аминокислот и сыворотки TFEB перемещается в ядро. Сенсор GCaMP3, присоединённый к каналу TRPML1, регистрирует сигнал у лизосомы, а экворин общего подъёма Ca²⁺ в цитозоле не обнаруживает; подавление синтеза TRPML1 уменьшает перемещение TFEB. BAPTA подавляет перемещение, EGTA — нет. Что следует из этих результатов?</h3><ol><li><b>А.</b> Сигнал создаёт местный выброс Ca²⁺ у лизосомы <i>(верный вариант)</i><br><span class="expl">Источник — лизосома: сигнал регистрирует сенсор на TRPML1, а подавление синтеза TRPML1 уменьшает перемещение TFEB. На местный характер сигнала указывают отсутствие общего подъёма по экворину и действие быстрого буфера BAPTA при отсутствии эффекта медленного EGTA.</span></li><li><b>Б.</b> Перемещение TFEB не зависит от ионов Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">Против этого говорят условие — BAPTA подавляет перемещение — и другие опыты той же работы: ингибиторы кальциневрина и клетки без его регуляторной субъединицы уменьшали перемещение TFEB. Отсутствие общего подъёма Ca²⁺ по экворину не исключает местного сигнала.</span></li><li><b>В.</b> Сигнал создаёт медленный подъём Ca²⁺ во всём цитозоле <i>(неверный вариант)</i><br><span class="expl">Экворин общего подъёма Ca²⁺ в объёме цитозоля не обнаружил, а медленный буфер EGTA ответ не подавил. Оба результата согласуются с местным сигналом у лизосомы, а не с общим подъёмом.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-1.html#q1">Вопрос 1 →</a> <a href="seminar-1.html#q2">Вопрос 2 →</a> <a href="seminar-1.html#q3">Вопрос 3 →</a> <a href="seminar-1.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb3114">Medina D. L. et al. 2015. Lysosomal calcium signalling regulates autophagy through calcineurin and TFEB. Nat Cell Biol</a></li><li><a href="https://doi.org/10.7554/eLife.15887">Garrity A. G. et al. 2016. The endoplasmic reticulum, not the pH gradient, drives calcium refilling of lysosomes. eLife</a></li><li><a href="https://doi.org/10.1038/ncomms1037">Dong X.-P. et al. 2010. PI(3,5)P2 controls membrane trafficking by direct activation of mucolipin Ca2+ release channels in the endolysosome. Nat Commun</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021014-071649">Xu H., Ren D. 2015. Lysosomal physiology. Annu Rev Physiol</a></li><li><a href="https://doi.org/10.1038/nrm2820">Casey J. R., Grinstein S., Orlowski J. 2010. Sensors and regulators of intracellular pH. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nature25486">Wong Y. C., Ysselstein D., Krainc D. 2018. Mitochondria-lysosome contacts regulate mitochondrial fission via RAB7 GTP hydrolysis. Nature</a></li><li><a href="https://doi.org/10.1038/nrn3125">Eggermann E., Bucurenciu I., Goswami S. P., Jonas P. 2012. Nanodomain coupling between Ca²⁺ channels and sensors of exocytosis at fast mammalian synapses. Nat Rev Neurosci</a></li></ul><p>Выход Ca²⁺ через TRPML1, кальциневрин и TFEB — клетки HeLa (также HEK293 и мышечные волокна мыши); среда — солевой раствор HBSS без аминокислот и сыворотки; Ca²⁺ в объёме цитозоля — экворин, у лизосомы — сенсор ML1-GCaMP3 (ратиометрическое измерение при 474 и 410 нм); BAPTA-AM 5–25 мкМ, EGTA-AM 5 мкМ (Medina 2015, полный текст); принцип сравнения быстрого и медленного буферов — Eggermann 2012; дозы BAPTA-AM и EGTA-AM в работе различались, и равенство их внутриклеточной буферной ёмкости не проверялось. В опытах с буферами и с подавлением TRPML1 сигнал сенсора и средний Ca²⁺ не измеряли — на схеме «нет данных». Активация TRPML1 липидом PI(3,5)P₂ — электрофизиология изолированных эндолизосом (Dong 2010). Пополнение запаса Ca²⁺ лизосом из ЭПР через рецепторы IP₃ — клетки HEK293 и фибробласты, повторный вызов выброса агонистом TRPML1 (Garrity 2016, по реферату). Уровни на схеме качественные («нет / низкий / средний / высокий»), числа pH и Ca²⁺ — порядки величины для покоящихся клеток млекопитающих.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S1-T01"><dt>Компартмент</dt><dd>Область клетки, отделённая от окружения границей — биологической мембраной или фазовой границей, — внутри которой набор физико-химических условий (pH, ионный состав, редокс-состояние, состав липидов и белков) отличается от условий в окружающем объёме. Компартмент задан не формой, а границей и набором условий, которые она удерживает. Различие бывает равновесным (избирательное распределение веществ) или неравновесным — тогда его поддерживает избирательный транспорт с затратой энергии.</dd></div><div id="ns-g-S1-T02"><dt>Биологическая мембрана</dt><dd>Липидный бислой со встроенными и связанными с ним белками. Сам бислой почти непроницаем для ионов и полярных молекул и потому может удерживать различие концентраций, но не создаёт его; избирательный перенос через мембрану выполняют белки — насосы, каналы, переносчики и транслоказы.</dd></div><div id="ns-g-S1-T03"><dt>Разность электрохимического потенциала (Δμ)</dt><dd>Мера движущей силы переноса вещества через мембрану: Δμ = RT·ln(c₂/c₁) + zF·(ψ₂ − ψ₁), где первое слагаемое — химическая часть (разность концентраций), второе — электрическая (z — заряд иона, ψ — потенциал стороны). Если Δμ &lt; 0, перенос со стороны 1 на сторону 2 самопроизволен и для него достаточно канала; если Δμ &gt; 0, нужен насос или сопряжённый переносчик. Для иона «по градиенту» не всегда значит «в сторону меньшей концентрации».</dd></div><div id="ns-g-S1-T04"><dt>Мембранный потенциал митохондрии (Δψ)</dt><dd>Разность электрических потенциалов на внутренней мембране митохондрии (около −150…−180 мВ; матрикс заряжен отрицательно), которую создаёт перенос протонов дыхательной цепью. Вместе с разностью pH составляет протон-движущую силу. Δψ — состояние мембраны, а не поток: нормальный Δψ сам по себе не доказывает работы дыхательной цепи. Оценивают по накоплению катионного зонда, например TMRM; протонофор FCCP снимает Δψ.</dd></div><div id="ns-g-S1-T05"><dt>Свободная и общая концентрация</dt><dd>Свободная концентрация — концентрация вещества, не связанного с белками и другими лигандами; именно она определяет связывание с эффектором и движущую силу переноса. Общая концентрация — сумма свободной и связанной форм. Для Ca²⁺ они различаются во много раз: буферы связывают большую часть вошедших ионов, а в депо общий кальций намного выше свободного.</dd></div><div id="ns-g-S1-T06"><dt>Локальная концентрация и микродомен</dt><dd>Локальная концентрация — концентрация вещества в том малом объёме, где идёт рассматриваемая реакция (просвет органеллы, область у устья канала, поверхность мембраны), в отличие от средней концентрации, отнесённой к объёму всей клетки. Микродомен — область от десятков нанометров до нескольких микрометров, где концентрация сигнального вещества или другой параметр устойчиво отличается от среднего по компартменту.</dd></div><div id="ns-g-S1-T07"><dt>Стационарное неравновесное состояние</dt><dd>Состояние, которое не меняется во времени, потому что противоположные потоки равны (перенос насосом и утечка, синтез и удаление), а не потому, что процессы остановились. Оно поддерживается непрерывной затратой энергии и после остановки источника энергии релаксирует к равновесию; время релаксации у разных параметров различается на порядки.</dd></div><div id="ns-g-S1-T08"><dt>Генетически кодируемый биосенсор</dt><dd>Белок, кодируемый введённым в клетку геном, у которого связывание лиганда или изменение измеряемого параметра (pH, Ca²⁺, потенциал пары глутатиона, cAMP, фосфоинозитид) меняет флуоресценцию. Сенсор можно адресовать в нужный компартмент и измерять величину там, где идёт событие. Сенсор входит в измеряемую систему: он связывает лиганд и потому буферирует его, а его динамический диапазон ограничен.</dd></div><div id="ns-g-S1-T09"><dt>Фосфоинозитиды</dt><dd>Производные фосфатидилинозитола (PI), у которых инозитольное кольцо дополнительно фосфорилировано в положениях 3, 4 или 5 в разных сочетаниях (PI3P, PI4P, PI(3,5)P₂, PI(4,5)P₂, PI(3,4,5)P₃ и др.). Составляют малую долю мембранных фосфолипидов — заметно меньшую, чем сам фосфатидилинозитол, — но служат одним из основных признаков, по которым белки узнают мембрану того или иного компартмента; их взаимопревращают локализованные липидкиназы и липидфосфатазы.</dd></div><div id="ns-g-S1-T10"><dt>Насос (первично-активный переносчик)</dt><dd>Мембранный белок, переносящий вещество против его электрохимического градиента за счёт непосредственного сопряжения с источником энергии — гидролизом ATP (V-АТФаза, SERCA, Na⁺/K⁺-АТФаза) или переносом электронов (комплексы дыхательной цепи). Создаёт различие между компартментами; при остановке насоса различие постепенно рассеивается утечкой.</dd></div><div id="ns-g-S1-T11"><dt>Канал</dt><dd>Мембранный белок, через пору которого ион проходит только по электрохимическому градиенту (Δμ &lt; 0). Канал не создаёт различие, а расходует его — для передачи сигнала (рецептор IP₃, MCU) или для возврата к исходному состоянию. Избирательность канала определяет, какой ион пройдёт, но не направление переноса.</dd></div><div id="ns-g-S1-T12"><dt>Сопряжённый переносчик (вторично-активный транспорт)</dt><dd>Переносчик, перемещающий вещество против его градиента за счёт энергии градиента другого вещества, созданного насосом: симпортеры и антипортеры, например Na⁺/Ca²⁺-обменник плазматической мембраны. Сам ATP не гидролизует.</dd></div><div id="ns-g-S1-T13"><dt>Транслоказы TOM и TIM23; MTS</dt><dd>Белковые комплексы наружной (TOM) и внутренней (TIM23) мембран митохондрии, переносящие в матрикс белки, синтезированные в цитозоле. Сигналом служит N-концевая адресующая последовательность (MTS) — положительно заряженный пептид, который отщепляется после импорта. Перенос MTS через TIM23 требует Δψ, а не всей протон-движущей силы.</dd></div><div id="ns-g-S1-T14"><dt>Протон-движущая сила</dt><dd>Энергия, запасённая в градиенте протонов на внутренней мембране митохондрии: сумма электрической части (Δψ) и химической (разность pH между матриксом и межмембранным пространством). Используется ATP-синтазой и рядом переносчиков; Δψ отдельно движет импорт через TIM23 и вход Ca²⁺ через MCU.</dd></div><div id="ns-g-S1-T15"><dt>Деполяризация митохондрии</dt><dd>Снижение абсолютной величины Δψ (матрикс становится менее отрицательным), а не изменение формы органеллы. Последствия зависят от величины и длительности снижения и от причины: протонофор, остановка дыхания, открытие пор во внутренней мембране.</dd></div><div id="ns-g-S1-T16"><dt>Потенциал пары глутатиона E(GSH/GSSG)</dt><dd>Фактический окислительно-восстановительный потенциал пары 2GSH/GSSG в компартменте: E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]). Отличается от стандартного потенциала E°′ (около −240 мВ при pH 7,0) и зависит от отношения GSH:GSSG, от абсолютной концентрации GSH, от pH и температуры. Описывает только пару глутатиона: другие редокс-пары того же компартмента не обязаны быть с ней в равновесии.</dd></div><div id="ns-g-S1-T17"><dt>Кислые гидролазы; катепсины</dt><dd>Ферменты просвета лизосомы (протеазы, липазы, гликозидазы, нуклеазы — более 60), расщепляющие макромолекулы; их оптимум активности — в кислой среде. Катепсины — лизосомные протеазы; при выходе в цитозоль через повреждённую мембрану лизосомы они расщепляют цитозольные белки и могут запустить гибель клетки.</dd></div><div id="ns-g-S1-T18"><dt>V-АТФаза</dt><dd>Вакуолярная H⁺-АТФаза — насос мембран лизосом, эндосом и пузырьков аппарата Гольджи; за счёт гидролиза ATP переносит протоны из цитозоля в просвет. Создаёт кислую среду лизосомы; степень закисления зависит и от переноса противоионов. Ингибируется бафиломицином A1 и конканамицином A.</dd></div><div id="ns-g-S1-T19"><dt>SERCA</dt><dd>Ca²⁺-АТФаза мембраны ЭПР: за счёт гидролиза ATP переносит Ca²⁺ из цитозоля в просвет ЭПР и поддерживает там сотни микромолей свободного Ca²⁺. Необратимо ингибируется тапсигаргином.</dd></div><div id="ns-g-S1-T20"><dt>MCU (митохондриальный кальциевый унипортер)</dt><dd>Высокоселективный Ca²⁺-канал внутренней мембраны митохондрии. Ca²⁺ входит через него в матрикс по электрохимическому градиенту, который создаёт отрицательный Δψ; работу совершает дыхательная цепь, а не MCU. Регуляторы MICU1/MICU2 делают захват Ca²⁺ пороговым (раздел 4).</dd></div><div id="ns-g-S1-T21"><dt>ATP-синтаза</dt><dd>Комплекс внутренней мембраны митохондрии: протоны, возвращаясь в матрикс через Fo-часть, приводят в действие синтез ATP в F1-части. Реакция обратима: при сниженном Δψ и наличии ATP (например, гликолитического) фермент гидролизует ATP и выводит протоны из матрикса, поддерживая Δψ. Гликолитический ATP поступает в матрикс через транслокатор адениннуклеотидов; гидролиз ограничивает белок-ингибитор IF1.</dd></div><div id="ns-g-S1-T22"><dt>Бафиломицин A1</dt><dd>Ингибитор V-АТФазы; F-АТФазу митохондрий в тех же концентрациях не ингибирует. Мембрану лизосомы не разрушает: pH просвета растёт постепенно, а доставленный в лизосомы белок перестаёт расщепляться. Исследовательский инструмент, а не лекарство.</dd></div><div id="ns-g-S1-T23"><dt>Тапсигаргин</dt><dd>Необратимый ингибитор SERCA. Каналы ЭПР не открывает и мембрану не разрушает: Ca²⁺ выходит из просвета путями утечки (в покое утечку уравновешивает SERCA), и после короткой начальной фазы депо опустошается за минуты; опустошение запускает депо-зависимый вход Ca²⁺ через плазматическую мембрану.</dd></div><div id="ns-g-S1-T24"><dt>Антимицин A и олигомицин</dt><dd>Антимицин A ингибирует комплекс III дыхательной цепи и останавливает перенос электронов к кислороду. Олигомицин ингибирует Fo-часть ATP-синтазы и блокирует оба направления её работы. Вместе они останавливают оба генератора Δψ; по отдельности позволяют различить, что поддерживает потенциал.</dd></div><div id="ns-g-S1-T25"><dt>FCCP (протонофор)</dt><dd>Липофильная слабая кислота, переносящая протоны через внутреннюю мембрану в обход ATP-синтазы (разобщитель). Снимает Δψ и протонный градиент. Если концентрация протонофора оптимальна, субстратов достаточно, а у клеток есть дыхательный резерв, дыхание ускоряется до максимальной скорости, возможной в этих условиях (избыток протонофора дыхание подавляет), а синтез ATP в митохондриях прекращается; при глюкозе в среде ATP-синтаза гидролизует гликолитический ATP, но Δψ не восстанавливается. Дыхательную цепь не ингибирует.</dd></div><div id="ns-g-S1-T26"><dt>TMRM</dt><dd>Катионный флуоресцентный зонд, накапливающийся в матриксе тем сильнее, чем отрицательнее матрикс (распределение по уравнению Нернста). Отвечает и на потенциал плазматической мембраны. При загрузке в низких наномолярных концентрациях уравновешивается между средой и клеткой примерно за 60 мин, а между цитозолем и матриксом — намного быстрее, поэтому изменения Δψ видны за секунды и минуты (Brand и Nicholls 2011). Показывает состояние — Δψ, а не поток.</dd></div><div id="ns-g-S1-T27"><dt>Ратиометрия</dt><dd>Способ измерения, при котором берут отношение сигналов одного сенсора при двух длинах волн возбуждения или испускания. Отношение практически не зависит от количества сенсора, толщины клетки и (в первом приближении) выцветания, но становится числом pH или потенциала только после калибровки.</dd></div><div id="ns-g-S1-T28"><dt>Калибровка сенсора in situ</dt><dd>Перевод сигнала сенсора в физическую величину в той же клетке: для pH — растворы известного pH с ионофорами (нигерицин, монензин), выравнивающими pH органеллы и раствора; для редокс-сенсора — полное восстановление и полное окисление. Задаёт рабочий диапазон: вне его сенсор не различает значений.</dd></div><div id="ns-g-S1-T29"><dt>Челночные системы (малат-аспартатный и глицерофосфатный челноки)</dt><dd>Способы перенести восстановительные эквиваленты цитозольного NADH в митохондрию, не перенося сам NADH, для которого внутренняя мембрана непроницаема. Малат-аспартатный челнок восстанавливает NAD⁺ матрикса; глицерофосфатный передаёт электроны через FAD митохондриальной глицерол-3-фосфатдегидрогеназы в пул убихинона, минуя комплекс I.</dd></div><div id="ns-g-S1-T30"><dt>Средняя по клетке концентрация</dt><dd>Количество вещества, отнесённое к объёму всей клетки (или к массе белка), — то, что даёт анализ лизата: c = N/(N_A·V), где N — число молекул, N_A = 6,02·10²³ моль⁻¹, V — объём. Мера общего содержания; не показывает, какая концентрация достигнута там, где находится эффектор.</dd></div><div id="ns-g-S1-T31"><dt>Буфер (кальциевый буфер)</dt><dd>Белок или другая молекула, обратимо связывающая ион или посредник. В начальной фазе сигнала быстрый ненасыщенный буфер удаляет свободную форму как сток; в длительном стационаре связывание и отщепление уравновешиваются, и постоянного стока буфер не создаёт. Неподвижные буферы ограничивают распространение свободного Ca²⁺, подвижные могут его ускорять; насыщенный буфер перестаёт сужать домен.</dd></div><div id="ns-g-S1-T32"><dt>Макромолекулярный краудинг</dt><dd>Совокупность эффектов, вызванных тем, что 20–30 % объёма цитоплазмы занято макромолекулами (200–300 мг/мл): эффективная активность белков выше номинальной, исключённый объём при прочих равных благоприятствует сборке комплексов, диффузия замедлена. Неспецифические взаимодействия с окружающими белками могут действовать в обратную сторону, поэтому итог для устойчивости и связывания зависит от белка. Регулируется, например, через содержание рибосом.</dd></div><div id="ns-g-S1-T33"><dt>Коэффициент диффузии (D)</dt><dd>Мера подвижности молекулы, мкм²/с: среднеквадратичное смещение за время t в одном измерении — √(2Dt). Для IP₃ в цитозольном экстракте — 283 мкм²/с, для GFP в цитоплазме — около 27 мкм²/с, для мембранных белков в плоскости мембраны — 0,05–1 мкм²/с.</dd></div><div id="ns-g-S1-T34"><dt>Источник (в модели градиента)</dt><dd>Место, где вещество образуется или поступает в цитозоль: закреплённый фермент (аденилатциклаза, киназа), канал выхода из депо (рецептор IP₃) или направленный транспорт. Без источника неоднородности нет.</dd></div><div id="ns-g-S1-T35"><dt>Сток (в модели градиента)</dt><dd>Процесс, удаляющий вещество из отслеживаемой формы: ферментативное разрушение (PDE для cAMP), секвестрация (SERCA для Ca²⁺), а в начальной фазе сигнала — связывание ненасыщенным буфером; для фосфорилированного белка — фосфатаза. Ускорение стока сужает домен.</dd></div><div id="ns-g-S1-T36"><dt>Длина диффузии (λ)</dt><dd>Масштаб стационарного профиля «источник — диффузия — сток»: λ = √(D/k), где k — константа стока первого порядка. На расстоянии λ избыток концентрации над фоном падает в e ≈ 2,7 раза. Не путать со среднеквадратичным смещением √(2Dt) за время t.</dd></div><div id="ns-g-S1-T37"><dt>Стационарный профиль концентрации</dt><dd>Распределение вещества, которое не меняется во времени, потому что в каждой точке приток диффузией и от источника равен удалению стоком. В одномерной модели с равномерным базальным источником, поддерживающим фон: c(x) = фон + (c₀ − фон)·e^(−x/λ). Исчезает, если остановить источник или сток.</dd></div><div id="ns-g-S1-T38"><dt>Сверхчувствительность</dt><dd>Ответ, зависящий от концентрации сигнала круче гиперболы Михаэлиса. Крутизну описывает коэффициент Хилла n в уравнении R = cⁿ/(K½ⁿ + cⁿ): при n = 1 для перехода от 10 до 90 % ответа нужен рост концентрации в 81 раз, при n = 4 — в 3 раза.</dd></div><div id="ns-g-S1-T39"><dt>Сверхчувствительность нулевого порядка</dt><dd>Резкая зависимость доли модифицированного белка от отношения активностей киназы и фосфатазы, возникающая, когда оба фермента насыщены субстратом (Goldbeter и Koshland 1981). Не требует кооперативного связывания.</dd></div><div id="ns-g-S1-T40"><dt>Позиционная информация</dt><dd>Сведения о положении в клетке или ткани, которые несёт градиент: профиль концентрации задаёт координату, а эффектор с порогом превращает её в границу между областями с разным ответом.</dd></div><div id="ns-g-S1-T41"><dt>Аденилатциклаза (AC)</dt><dd>Мембранный фермент, синтезирующий cAMP из ATP; активируется белком Gs после связывания гормона с рецептором. Источник cAMP в своём мембранном домене; форсколин активирует её напрямую.</dd></div><div id="ns-g-S1-T42"><dt>Фосфодиэстеразы (PDE)</dt><dd>Ферменты, гидролизующие cAMP (и cGMP) до 5′-нуклеотидмонофосфата; cAMP гидролизуют восемь семейств. Многие изоформы закреплены у определённых мембран; работают как местный сток cAMP. IBMX — неизбирательный ингибитор.</dd></div><div id="ns-g-S1-T43"><dt>Протеинкиназа A (PKA)</dt><dd>Тетрамер из двух регуляторных и двух каталитических субъединиц; связывание cAMP с регуляторными субъединицами освобождает активность каталитических. Донор фосфата — ATP. Закрепляется у мишеней белками AKAP.</dd></div><div id="ns-g-S1-T44"><dt>AKAP (белки, закрепляющие PKA)</dt><dd>Якорные белки, связывающие регуляторные субъединицы PKA и удерживающие её у определённой мембраны или мишени; часто связывают также аденилатциклазу, PDE и фосфатазы. Определяют место работы PKA. Пептид Ht31 отделяет от них PKA типа II.</dd></div><div id="ns-g-S1-T45"><dt>IBMX</dt><dd>3-изобутил-1-метилксантин — неизбирательный ингибитор фосфодиэстераз. Повышает cAMP по всей клетке и размывает границы доменов; служит проверкой того, что домен поддерживается стоком.</dd></div><div id="ns-g-S1-T46"><dt>Пептид Ht31</dt><dd>Пептид из участка AKAP Ht31, связывающий регуляторную субъединицу RIIα PKA с наномолярным сродством и вытесняющий её из комплексов с AKAP. Проверяет, нужно ли закрепление PKA для ответа: активность PKA он не подавляет.</dd></div><div id="ns-g-S1-T47"><dt>Градиент RanGTP</dt><dd>Неравномерное распределение ГТФазы Ran в форме, связанной с GTP: её много в ядре (или у хромосом в митозе), где работает фактор обмена RCC1, и мало в цитоплазме, где гидролиз ускоряют RanGAP1 и RanBP1. Задаёт направление ядерного транспорта.</dd></div><div id="ns-g-S1-T48"><dt>FRET (фёрстеровский резонансный перенос энергии)</dt><dd>Безызлучательный перенос энергии от возбуждённого флуоресцентного белка-донора к акцептору, если они находятся на расстоянии в несколько нанометров. В сенсорах связывание лиганда меняет это расстояние, и измеряют отношение свечения донора и акцептора.</dd></div><div id="ns-g-S1-T49"><dt>FRAP</dt><dd>Восстановление флуоресценции после выцветания: флуоресценцию в малой области гасят интенсивным светом и следят за её восстановлением. Скорость восстановления характеризует подвижность белка, неполное восстановление — долю неподвижных молекул.</dd></div><div id="ns-g-S1-T50"><dt>Липидный код</dt><dd>Устойчивое распределение фосфоинозитидов по мембранам компартментов: PI(4,5)P₂ — плазматическая мембрана, PI4P — аппарат Гольджи (и плазматическая мембрана), PI3P — ранние эндосомы, PI(3,5)P₂ — поздние эндосомы и лизосомы. Точнее — разметка, которую белки считывают вместе с другими признаками мембраны: один липид встречается в нескольких мембранах, содержание меняется непрерывно, и белок узнаёт мембрану по сочетанию признаков, а не по одному липиду.</dd></div><div id="ns-g-S1-T51"><dt>Характерный фосфоинозитид</dt><dd>Фосфоинозитид, обогащённый в мембране данного компартмента по сравнению с другими мембранами. Это не самый массовый липид мембраны, а минорный компонент, по которому её узнают белки; «характерный» не значит «единственный».</dd></div><div id="ns-g-S1-T52"><dt>Липидкиназы и липидфосфатазы</dt><dd>Ферменты, присоединяющие фосфат к определённому положению инозитольного кольца (киназы: PI4K, PIP5K, PI3K, VPS34, PIKfyve) или отщепляющие его (фосфатазы: PTEN, SHIP, SAC1, OCRL, INPP5E, FIG4). Сами локализованы на определённых мембранах, поэтому определяют, где какой липид образуется.</dd></div><div id="ns-g-S1-T53"><dt>Смена метки (конверсия)</dt><dd>Смена фосфоинозитида мембраны под действием киназ и фосфатаз при переходе компартмента в другое состояние. Например, при созревании эндосомы PI(4,5)P₂ ямки дефосфорилируется, на ранней эндосоме VPS34 заново синтезирует PI3P, затем PIKfyve превращает его в PI(3,5)P₂. Смена метки сопровождается сменой малых ГТФаз и белков-эффекторов.</dd></div><div id="ns-g-S1-T54"><dt>Периферическое связывание</dt><dd>Обратимое связывание белка с поверхностью мембраны без встраивания в бислой: за счёт электростатического взаимодействия с головной группой липида и, у многих доменов, погружения гидрофобных участков в поверхностный слой. При изменении метки белок диссоциирует.</dd></div><div id="ns-g-S1-T55"><dt>PH-домен</dt><dd>Домен гомологии плекстрину; у части белков связывает фосфоинозитиды плазматической мембраны или Гольджи: PI(4,5)P₂ (PLCδ1), PI(3,4,5)P₃ и PI(3,4)P₂ (AKT), PI4P (OSBP, FAPP1). Многие PH-домены связывают липиды слабо и неизбирательно и требуют второго признака.</dd></div><div id="ns-g-S1-T56"><dt>FYVE-домен</dt><dd>Домен, связывающий PI3P; есть у EEA1 и HRS. Тандем из двух FYVE-доменов (2×FYVE) используют как сенсор PI3P ранних эндосом.</dd></div><div id="ns-g-S1-T57"><dt>PX-домен</dt><dd>Домен, у большинства белков связывающий PI3P; есть у сортирующих нексинов ранних эндосом.</dd></div><div id="ns-g-S1-T58"><dt>ENTH- и ANTH-домены</dt><dd>Домены белков эндоцитоза (эпсин, AP180), связывающие PI(4,5)P₂ в формирующейся клатриновой ямке.</dd></div><div id="ns-g-S1-T59"><dt>C2-домен</dt><dd>Домен, связывающий кислые фосфолипиды, у многих белков при участии Ca²⁺ (синаптотагмин, протеинкиназа C).</dd></div><div id="ns-g-S1-T60"><dt>Коинцидентное узнавание</dt><dd>Узнавание по совпадению двух и более признаков: механизм адресации, при котором белок прочно связывается с мембраной только при одновременном узнавании нескольких независимых признаков, например PI3P и Rab5-GTP у EEA1. В простейшей модели независимых сайтов доля связанного белка равна произведению занятостей: это даёт избирательность и авидность, но не порог, кооперативность или бистабильность. Признаки бывают неравноценны: для посадки EEA1 решающим оказался PI3P (Lawe 2002).</dd></div><div id="ns-g-S1-T61"><dt>Маркер и причинный детерминант</dt><dd>Маркер — признак, по которому исследователь узнаёт мембрану; причинный детерминант — признак, от которого зависят её свойства. Причинность доказывают вмешательством (удаление показывает необходимость, перенос фермента — достаточность), а не совпадением локализаций.</dd></div><div id="ns-g-S1-T62"><dt>Асимметрия монослоёв</dt><dd>Различие липидного состава наружного и цитозольного монослоёв: фосфатидилсерин и фосфатидилэтаноламин плазматической мембраны сосредоточены в цитозольном монослое. Создаётся ATP-зависимыми флиппазами (P4-АТФазы), рассеивается скрамблазами (TMEM16F — при подъёме Ca²⁺, Xkr8 — после расщепления каспазами) без затраты ATP.</dd></div><div id="ns-g-S1-T63"><dt>Rab5 и Rab7</dt><dd>Малые ГТФазы эндосом: Rab5 — ранних, Rab7 — поздних. В GTP-связанной форме связываются с эффекторами, после гидролиза GTP — нет. Rab5 S34N преимущественно связывает GDP, Rab5 Q79L почти не гидролизует GTP. При созревании эндосомы Rab5 сменяется на Rab7.</dd></div><div id="ns-g-S1-T64"><dt>PI3K класса I и PTEN</dt><dd>PI3K класса I после активации рецепторов фосфорилирует PI(4,5)P₂ в положении 3 и создаёт PI(3,4,5)P₃ в плазматической мембране; PTEN отщепляет этот фосфат и возвращает PI(4,5)P₂. Баланс двух ферментов задаёт содержание PI(3,4,5)P₃ и в покое, и после стимула.</dd></div><div id="ns-g-S1-T65"><dt>VPS34 (PI3K класса III)</dt><dd>Липидкиназа, синтезирующая PI3P из фосфатидилинозитола на ранних эндосомах (в комплексе, связанном с Rab5) и при аутофагии. Избирательные ингибиторы снижают PI3P и вместе с ним PI(3,5)P₂.</dd></div><div id="ns-g-S1-T66"><dt>PIKfyve</dt><dd>Липидкиназа поздних эндосом, превращающая PI3P в PI(3,5)P₂; работает в комплексе с VAC14 и фосфатазой FIG4. Подавляется апилимодом; при её подавлении поздние эндосомы и лизосомы увеличиваются.</dd></div><div id="ns-g-S1-T67"><dt>Рапамицин-индуцируемое сближение FKBP–FRB</dt><dd>Метод быстрого вмешательства: FRB закрепляют на выбранной мембране, фермент сливают с FKBP; рапамицин связывает оба домена, и фермент за минуты оказывается на мембране. Так удаляют липид в одной мембране; контроли — без рапамицина и с неактивным ферментом.</dd></div><div id="ns-g-S1-T68"><dt>Сенсор на основе липид-связывающего домена</dt><dd>Липид-связывающий домен, слитый с флуоресцентным белком. Показывает свободный и доступный ему липид в местах, где выполнены его условия связывания; насыщается, конкурирует с собственными белками клетки, а при сильной экспрессии может подавлять процессы, зависящие от липида.</dd></div><div id="ns-g-S1-T69"><dt>TRPML1</dt><dd>Канал мембраны поздних эндосом и лизосом, через который Ca²⁺ выходит из просвета; прямо активируется PI(3,5)P₂ (Dong 2010).</dd></div><div id="ns-g-S1-T70"><dt>Мембранный контактный сайт</dt><dd>Участок устойчивого сближения мембран двух органелл, которое удерживают тетеринг-белки; расстояние зависит от типа контакта (у контакта ЭПР — митохондрия порядка 10–30 нм); мембраны не сливаются, содержимое компартментов не смешивается. Через контакт идёт невезикулярный перенос липидов, Ca²⁺ и метаболитов. Scorrano и соавторы (2019) рекомендуют описывать контакт по удержанию мембран, отсутствию слияния, функции и набору белков и липидов; одно расстояние контакт не определяет.</dd></div><div id="ns-g-S1-T71"><dt>Тетеринг-белки</dt><dd>Белки или белковые комплексы (от англ. tether — привязь), одновременно связанные с мембранами двух органелл и удерживающие их на определённом расстоянии; не вызывают слияния. Отличаются от моторных адаптеров и белков слияния. Примеры: VAP с белками, несущими мотив FFAT; PDZD8; E-Syt; у дрожжей — комплекс ERMES.</dd></div><div id="ns-g-S1-T72"><dt>Три проверки контакта (в этом семинаре)</dt><dd>Геометрия (расстояние между мембранами; его типичная величина зависит от типа контакта), тетеринг-белки, удерживающие это расстояние (их удаление увеличивает зазор или уменьшает площадь), и раздельность содержимого. Каждую проверку выполняют отдельным методом; площадь сближения не говорит о переносе — его измеряют отдельно.</dd></div><div id="ns-g-S1-T73"><dt>Невезикулярный перенос липидов</dt><dd>Перенос липида между мембранами без пузырьков: липид-транспортный белок извлекает молекулу в гидрофобный карман и отдаёт её другой мембране. Обычно идёт в контактных сайтах, где белок может быть связан с обеими мембранами.</dd></div><div id="ns-g-S1-T74"><dt>OSBP (оксистерол-связывающий белок)</dt><dd>Белок контакта ЭПР — транс-Гольджи: PH-доменом связывается с PI4P Гольджи, мотивом FFAT — с VAP на ЭПР, доменом ORD переносит липиды. За цикл переносит молекулу холестерина из ЭПР в Гольджи и молекулу PI4P обратно; ATP не гидролизует.</dd></div><div id="ns-g-S1-T75"><dt>Контрградиент PI4P</dt><dd>Постоянный перепад содержания PI4P между аппаратом Гольджи (высокое) и ЭПР (низкое). Его создаёт PI-4-киназа Гольджи, расходующая ATP, и поддерживает фосфатаза SAC1 в ЭПР. Перепад движет обмен, при котором OSBP переносит холестерин против его градиента.</dd></div><div id="ns-g-S1-T76"><dt>VAP-A и VAP-B</dt><dd>Белки мембраны ЭПР, связывающие короткий мотив FFAT белков-партнёров (OSBP, ряд белков ORP, CERT). Пара VAP–FFAT удерживает контакт и привязывает к нему перенос липидов.</dd></div><div id="ns-g-S1-T77"><dt>ORP5 и ORP8</dt><dd>Белки ЭПР, родственные OSBP. В контактах ЭПР с плазматической мембраной обменивают фосфатидилсерин на PI4P: доставляют фосфатидилсерин в плазматическую мембрану, а PI4P — к фосфатазе SAC1 в ЭПР (Chung 2015).</dd></div><div id="ns-g-S1-T78"><dt>CERT</dt><dd>Белок, переносящий церамид из ЭПР в аппарат Гольджи, где из него синтезируется сфингомиелин. Связывается с PI4P Гольджи PH-доменом и с VAP на ЭПР мотивом FFAT; обмена на PI4P не выполняет.</dd></div><div id="ns-g-S1-T79"><dt>PI4KIIIβ</dt><dd>Фосфатидилинозитол-4-киназа аппарата Гольджи: переносит фосфат с ATP на положение 4 инозитольного кольца (PI → PI4P). В цикле OSBP — единственная стадия, где расходуется ATP. PI4P синтезируют и другие PI-4-киназы.</dd></div><div id="ns-g-S1-T80"><dt>OSW-1</dt><dd>Природное соединение, которое связывается с OSBP и родственным белком ORP4 и тормозит перенос липидов. В клетках повышает содержание PI4P в транс-Гольджи и смещает холестерин в ЭПР и липидные капли (Mesmin 2017). Цитотоксичен; исследовательский инструмент.</dd></div><div id="ns-g-S1-T81"><dt>MICU1 и MICU2</dt><dd>Регуляторы митохондриального кальциевого унипортера в межмембранном пространстве. MICU1 связывает Ca²⁺ EF-мотивами, удерживает MCU закрытым при низком Ca²⁺ и обеспечивает кооперативное открытие при высоком; отсюда кажущийся порог захвата около 1 мкМ. MICU2 работает в комплексе с MICU1.</dd></div><div id="ns-g-S1-T82"><dt>VDAC</dt><dd>Потенциал-зависимый анионный канал (порин) наружной мембраны митохондрии. Делает наружную мембрану проницаемой для ионов и небольших метаболитов; на контакте с ЭПР связан с рецептором IP₃ через шаперон GRP75.</dd></div><div id="ns-g-S1-T83"><dt>Ca²⁺-микродомен контакта ЭПР — митохондрия</dt><dd>Область зазора, где при открытии рецепторов IP₃ свободный Ca²⁺ достигает порядка 10 мкМ, тогда как в остальном цитозоле он поднимается примерно до 1 мкМ. Позволяет MCU с MICU1 открываться именно у контакта; при подъёме Ca²⁺ во всём цитозоле выше порога захват идёт и вне контактов.</dd></div><div id="ns-g-S1-T84"><dt>PDZD8</dt><dd>Белок ЭПР, участвующий в образовании контактов ЭПР с митохондриями в клетках млекопитающих (Hirabayashi 2017); его SMP-домен функционально соответствует домену белка Mmm1 дрожжевого комплекса ERMES. В нейронах мыши без PDZD8 митохондрии хуже захватывали Ca²⁺, вышедший из ЭПР.</dd></div><div id="ns-g-S1-T85"><dt>E-Syt (расширенные синаптотагмины)</dt><dd>Белки ЭПР (E-Syt1–3), связывающие ЭПР с плазматической мембраной и переносящие глицеролипиды. Работа E-Syt1 зависит от Ca²⁺: при его подъёме зазор контакта сокращается. У дрожжей родственные белки — трикальбины.</dd></div><div id="ns-g-S1-T86"><dt>STIM1 и Orai1</dt><dd>STIM1 — сенсор Ca²⁺ в мембране ЭПР; после опустошения депо он перемещается в контакты ЭПР с плазматической мембраной и связывается с каналом Orai1, открывая депо-зависимый вход Ca²⁺ в клетку.</dd></div><div id="ns-g-S1-T87"><dt>Электронная (крио)томография</dt><dd>Метод трёхмерной электронной микроскопии: серия снимков под разными углами восстанавливается в объёмное изображение. Позволяет измерить зазор между мембранами и увидеть связи; криоэлектронная томография исследует замороженные образцы без химической фиксации. Показывает геометрию в один момент, но не перенос.</dd></div><div id="ns-g-S1-T88"><dt>Митофузин 2 (MFN2)</dt><dd>ГТФаза наружной мембраны митохондрии, участвующая в их слиянии; часть белка локализуется на ЭПР. Ранние данные о его роли в удержании контакта ЭПР — митохондрия противоречивы; в 2023 году описаны ЭПР-специфические варианты сплайсинга: ERMIT2 удерживает ЭПР у митохондрии, связываясь с митофузинами, ERMIN2 участвует в организации ЭПР (Naón 2023). Мутации в гене MFN2 вызывают наследственную нейропатию Шарко — Мари — Тута типа 2A.</dd></div><div id="ns-g-S1-T89"><dt>Репортёр из двух половин (split-GFP, SPLICS)</dt><dd>Две половины флуоресцентного белка, закреплённые на мембранах разных органелл; при сближении собираются в целый флуоресцирующий белок. Сборка малообратима: репортёр накапливает сигнал от всех контактов за время экспрессии и при избыточной экспрессии может их стабилизировать. В отличие от него FRET и BRET регистрируют сближение донора и акцептора примерно до 10 нм без сборки белка.</dd></div><div id="ns-g-S1-T90"><dt>Необходимость белка</dt><dd>Свойство, которое показывает опыт с удалением или подавлением белка: без белка процесс нарушается. Необходимость не означает, что белок сам выполняет процесс или что его достаточно: удаление может нарушить процесс косвенно, через другие звенья.</dd></div><div id="ns-g-S1-T91"><dt>Достаточность</dt><dd>Свойство, которое показывает опыт с добавлением: фермент, перенесённый в новое место, или мембраны, соединённые искусственной привязкой, вызывают процесс там, где его раньше не было. Пример — перенос фосфатазы на плазматическую мембрану рапамицином в опыте Hammond 2012.</dd></div><div id="ns-g-S1-T92"><dt>Кальциневрин</dt><dd>Фосфатаза, которую активирует Ca²⁺ в комплексе с кальмодулином. Дефосфорилирует факторы транскрипции NFAT и TFEB, после чего они перемещаются в ядро. В опытах Medina 2015 кальциневрин дефосфорилировал TFEB по остаткам Ser142 и Ser211 (нумерация TFEB человека).</dd></div><div id="ns-g-S1-T93"><dt>Быстрый и медленный буферы Ca²⁺ (BAPTA и EGTA)</dt><dd>Хелаторы Ca²⁺ со сходным сродством, но с разной скоростью связывания: BAPTA связывает ион намного быстрее, чем EGTA. Поэтому BAPTA успевает связать Ca²⁺ на более коротком пути от источника к мишени, чем EGTA. Если при сопоставимых эффективных концентрациях и проверенной загрузке ответ подавляет BAPTA, но не EGTA, это согласуется с тесным пространственно-временным сопряжением источника Ca²⁺ и мишени. Определённое расстояние из такого сравнения без кинетической модели не следует: оно зависит от концентрации буферов, силы и длительности источника и свойств мишени (Eggermann 2012). В клетки их вводят в виде проникающих эфиров (BAPTA-AM, EGTA-AM).</dd></div></dl></section></noscript>
<script>const CONTENT = {"ui":{"page_title":"Семинар 1 — Компартменты, локальные условия и обмен","home_eyebrow":"Семинар 1 · самостоятельная подготовка","home_h1":"Как в клетке создаются\nи разделяются локальные условия","home_lead":"Останавливайте насосы, меняйте диффузию и сток, переписывайте липидные метки и разрывайте контакты органелл и проследите, как клетка создаёт различия между компартментами, удерживает их внутри одного объёма и обменивается веществом без слияния мембран.","start":"Начать с компартментов →","how_h":"Как пройти семинар","how_steps":["Прочитайте объяснение и рассмотрите участников механизма.","Измените условия в демонстрации и сопоставьте результат с объяснением.","Ответьте на вопрос. Разбор ошибки поможет вернуться к нужному механизму."],"how_p1":"Все обязательные объяснения включены в этот интерактив. Ссылки на статьи нужны для проверки источников и углубления, а не для прохождения маршрута. Любой шаг можно открыть из оглавления; отдельная проверка в конце помогает обнаружить пробелы.","how_p2":"Учебные схемы упрощены. Экспериментальные данные, расчёты по указанным параметрам и условные задачи обозначены отдельно.","integr":"Объединяем механизмы","open_section":"Открыть раздел →","practice_num":"Практикум","practice_h":"Предскажите результат опыта","practice_p":"49 сценариев с вмешательствами, показаниями и разбором каждого ответа. Пройдите их после объяснений соответствующего раздела.","practice_open":"Открыть практикум →","exam_num":"Проверка подготовки","exam_h":"Объяснить без подсказки","exam_p":"Вопросы объединяют разные механизмы. После ответа можно открыть разбор и нужный шаг.","exam_open":"Проверить себя →","footer":"Версия 3.4 · учебные материалы кафедры биологии и генетики.","footer_lesson":"Все объяснения для подготовки включены в маршрут.","step_of":"шаг {i} из {n}","jump_label":"Перейти к части шага","jump_scheme":"Схема","jump_text":"Текст","jump_quiz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод из опыта. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Вопросы из разных разделов. После ответа откройте разбор; если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 49 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Компартменты, локальные условия и обмен","stats":[["4 механизма","от условий в компартменте к обмену между органеллами"],["Объяснения","с вопросами для самопроверки"],["49 сценариев","в отдельном практикуме"]],"num_fmt":"1.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел I: семинары","svg_hint":"Схема шире экрана: прокрутите её по горизонтали, чтобы увидеть все подписи."},"lessons":[{"id":"compartment","questions":[1],"title":"Что делает органеллу компартментом","keywords":["компартмент","граница","мембрана","pH","свободный Ca²⁺","глутатион","фосфоинозитид","лизосома","ЭПР","матрикс"],"lead":["Компартмент задан не формой, а границей и условиями, которые эта граница удерживает: pH, концентрацией свободного Ca²⁺, потенциалом пары глутатиона и характерным фосфоинозитидом."],"mechanism":["[[T01|Компартмент]] — область клетки с собственным набором физико-химических условий и границей, которая этот набор удерживает.","[[T02|Липидный бислой]] почти непроницаем для ионов: он удерживает различие, но не создаёт его; создают различие насосы мембраны.","Соседние объёмы одной клетки различаются по концентрации протонов в сотни раз, а по свободному Ca²⁺ — в тысячи раз."],"paragraphs":["Лизосому часто описывают как пузырёк с ферментами. Для клетки важнее другое: в просвете лизосомы pH около 4,5–5,0, а в окружающем цитозоле — около 7,2. Кислые гидролазы имеют оптимум активности в кислой среде, и вне лизосомы их активность значительно ниже (Xu 2015). Лизосому как компартмент определяет сочетание границы и условий внутри неё.","Так же описывают и другие компартменты. В просвете эндоплазматического ретикулума (ЭПР) концентрация свободного Ca²⁺ составляет сотни микромолей при концентрации около 100 нМ в цитозоле покоящейся клетки, а потенциал пары глутатиона менее отрицателен, чем в цитозоле; это благоприятствует образованию дисульфидных связей в секретируемых белках. Матрикс митохондрии слабощелочной, и на внутренней мембране есть потенциал Δψ: матрикс заряжен отрицательно.","Граница — [[T02|биологическая мембрана]] — эти различия только удерживает. Создают и поддерживают их мембранные белки, прежде всего насосы, за счёт гидролиза ATP или переноса электронов. Если насос остановить, различие постепенно исчезает, хотя мембрана сохраняется: после ингибирования V-АТФазы бафиломицином A1 лизосомы сохраняются и груз в них доставляется, но не расщепляется (Yoshimori 1991).","На карте выберите параметр. Для каждого компартмента показан порядок величины и то, чем её измеряли. Значения зависят от типа клеток и метода, поэтому их запоминают как порядок величины и направление различия."],"trap":["Органеллу определяет её форма: лизосома — это мембранный пузырёк с ферментами.","Форма не определяет функцию. Лизосома расщепляет груз, пока V-АТФаза удерживает в её просвете pH 4,5–5,0; после ингибирования V-АТФазы мембрана и ферменты сохраняются, но белок, доставленный в лизосому, не расщепляется (Yoshimori 1991)."],"conditions":"Схема — сводка порядков величин для покоящихся культивируемых клеток млекопитающих. pH — адресованные pH-чувствительные флуоресцентные белки и красители (обзор Casey 2010); Ca²⁺ — свободная концентрация, измеренная адресованными индикаторами (обзор Rizzuto 2006); E(GSH/GSSG) — фактический потенциал пары, измеренный сенсорами на основе roGFP в клетках HeLa: цитозоль — Gutscher 2008 (от −280 до −320 мВ в зависимости от плотности культуры), просвет ЭПР — Birk 2013 (−208 мВ при pH 7,0), матрикс — Hanson 2004 (около −360 мВ при pH матрикса около 8,0). Опыт с бафиломицином A1 — клетки A431, 1 мкМ (Yoshimori 1991, реферат).","sources":["Xu2015","Casey2009","Rizzuto2006","Gutscher2008","Birk2013","Hanson2004","Yoshimori1991"],"quiz":{"id":"S1-L01","question":"V-АТФазу лизосом ингибировали бафиломицином A1; целостность мембраны лизосом не нарушена, гидролазы остались в просвете. Какой признак лизосомы как компартмента при этом теряется?","options":[{"id":"S1-L01-1","text":"Кислый pH просвета","correct":true,"feedback":"Кислую среду создаёт V-АТФаза, перенося протоны в просвет; без неё протоны выходят путями утечки, и pH растёт. Граница и набор ферментов сохраняются, но условие, при котором гидролазы активны, исчезает."},{"id":"S1-L01-2","text":"Целостность мембраны","correct":false,"feedback":"Бафиломицин A1 ингибирует насос, а не разрушает бислой: в опытах Yoshimori 1991 меченый EGF при бафиломицине A1 доставлялся в лизосомы и оставался в них."},{"id":"S1-L01-3","text":"Набор гидролаз в просвете","correct":false,"feedback":"Ферменты остаются в лизосоме — меняется не их количество, а их активность: она зависит от pH, который больше не поддерживается насосом."}]},"widget":{"kind":"q1map","title":"","s":{"title":"Карта компартментов: порядок величин","status":"Данные измерений: покоящиеся клетки млекопитающих, порядок величины","modes":["pH","Свободный Ca²⁺","E(GSH/GSSG)","Фосфоинозитид"],"modes_label":"Параметр","names":{"ext":"внеклеточная среда","cyt":"цитозоль","er":"просвет ЭПР","gol":"аппарат Гольджи","ee":"ранняя эндосома","lys":"лизосома","mito":"матрикс митохондрии","pm":"плазматическая мембрана"},"vals":[{"ext":"≈7,4","cyt":"≈7,2","er":"≈7,2","gol":"6,7→6,0","ee":"≈6,5","lys":"4,5–5,0","mito":"≈7,8"},{"ext":"≈1 мМ","cyt":"≈100 нМ","er":"100–800 мкМ","gol":"≈0,3 мМ (цис)","ee":"мало данных","lys":"≈0,4–0,6 мМ","mito":"0,1–10 мкМ"},{"ext":"—","cyt":"−320…−280 мВ","er":"−220…−180 мВ","gol":"нет данных","ee":"нет данных","lys":"нет данных","mito":"−360…−300 мВ"},{"ext":"—","cyt":"PI(4,5)P₂ на ПМ","er":"—","gol":"PI4P","ee":"PI3P","lys":"PI(3,5)P₂","mito":"—"}],"notes":["pH измерен адресованными pH-чувствительными белками и красителями. Разность между цитозолем и лизосомой — около 2,5 единицы pH, то есть различие концентрации протонов в сотни раз.","Показана свободная концентрация Ca²⁺, измеренная адресованными индикаторами. Общий кальций депо (ЭПР, лизосома) во много раз выше свободного: большая часть ионов связана белками просвета.","Показан фактический потенциал пары глутатиона, измеренный сенсорами в клетках HeLa; он не равен стандартному потенциалу E°′ (около −240 мВ при pH 7,0) и зависит от компартмента.","Показан характерный фосфоинозитид цитозольной стороны мембраны — минорный липид, по которому мембрану узнают белки (подробно — в разделе 3). ПМ — плазматическая мембрана."],"legend":"Значения — порядок величины для покоящихся культивируемых клеток млекопитающих; они зависят от типа клеток, метода и состояния клетки."}},"section":0,"number":1,"question":1},{"id":"four-parameters","questions":[1],"title":"Какими величинами описывают условия внутри компартмента","keywords":["pH","свободный Ca²⁺","общий кальций","глутатион","GSH","GSSG","редокс-потенциал","уравнение Нернста","E°′","roGFP","Grx1-roGFP2","фосфоинозитид"],"lead":["Компартменты сравнивают по pH, свободному Ca²⁺, потенциалу пары глутатиона и характерному фосфоинозитиду; для каждой величины нужно знать, что именно измерено."],"mechanism":["pH и свободный Ca²⁺ измеряют адресованными сенсорами; для Ca²⁺ важна [[T05|свободная]], а не общая концентрация.","[[T16|Потенциал пары глутатиона]] E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]) зависит не только от отношения GSH:GSSG, но и от абсолютной концентрации GSH.","Характерный [[T09|фосфоинозитид]] — минорный липид цитозольной стороны мембраны, по которому её узнают белки."],"paragraphs":["pH цистерн аппарата Гольджи снижается от 6,7 до 6,0, в ранних эндосомах он около 6,5, в лизосомах — 4,5–5,0 (Casey 2010). Свободный Ca²⁺ в цитозоле покоящейся клетки — около 100 нМ, в просвете ЭПР — сотни микромолей (Rizzuto 2006); общий кальций депо во много раз выше, потому что большая часть ионов связана белками просвета.","Редокс-состояние описывают потенциалом определённой пары, чаще всего глутатиона. Стандартный потенциал E°′ для 2GSH/GSSG — около −240 мВ при pH 7,0 (Schafer 2001), а фактический потенциал E задаёт уравнение Нернста. Поскольку GSH входит в него в квадрате, при неизменном отношении GSH:GSSG снижение концентрации GSH в 10 раз делает потенциал менее отрицательным примерно на 30 мВ.","Сенсор Grx1-roGFP2 улавливает изменения содержания GSSG на наномолярном уровне на фоне миллимолярного GSH; в цитозоле клеток HeLa потенциал пары составил от −280 до −320 мВ в зависимости от плотности культуры (Gutscher 2008). В цитозоле сенсор почти полностью восстановлен, поэтому около −320 мВ — осторожная оценка: истинный потенциал может быть ещё более отрицательным. При −320 мВ и общей концентрации глутатиона 1–10 мМ отношение GSH:GSSG составляет от 5·10⁴ до 5·10⁵ (Schwarzländer 2016), а не 100:1, как получалось при анализе лизатов. На дрожжах показано, почему лизат вводит в заблуждение: GSSG, не восстановленный в цитозоле, переносится в вакуоль, и его содержание во всей клетке ничего не говорит о цитозольном пуле (Morgan 2013).","В просвете ЭПР клеток HeLa потенциал пары — около −208 мВ при pH 7,0 (Birk 2013), в матриксе — около −360 мВ (Hanson 2004). В калькуляторе меняйте концентрацию GSH, отношение и pH и сравнивайте расчёт с измеренными значениями."],"trap":["В цитозоле отношение GSH:GSSG около 100:1, и одно это отношение описывает редокс-состояние компартмента.","Отношение 100:1 получено в лизатах, где GSSG завышен; сенсор в цитозоле клеток человека показывает от −280 до −320 мВ, что при миллимолярном GSH соответствует отношению от нескольких тысяч до сотен тысяч. Кроме того, потенциал зависит от абсолютной концентрации GSH и от pH, а не только от отношения."],"conditions":"Калькулятор — расчёт по уравнению Нернста E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]) при 37 °C (RT/2F·ln 10 ≈ 30,8 мВ); E°′ = −240 мВ при pH 7,0 (Schafer 2001), смещение E°′ — около −60 мВ на единицу pH (уравнение Нернста: в реакции пары участвуют два электрона и два протона); значения GSH и отношения выбираются как условные. Измеренные значения: цитозоль клеток HeLa, сенсор Grx1-roGFP2, от −280 до −320 мВ в зависимости от плотности культуры — Gutscher 2008 (полный текст); ЭПР клеток HeLa, сенсор, сопряжённый с глутаредоксином, −208 ± 4 мВ при pH 7,0 — Birk 2013 (реферат); матрикс клеток HeLa, roGFP1, около −360 мВ при pH около 8,0 — Hanson 2004 (реферат); осторожная оценка для цитозоля (около −320 мВ) и отношение GSH:GSSG при 1–10 мМ глутатиона, значения для ЭПР (около −210 мВ) и митохондрий (до −380 мВ из-за более щелочного pH) — обзор Schwarzländer 2016 (полный текст); границы диапазонов на шкале калькулятора — учебные. Механизм завышения GSSG в лизатах показан на дрожжах Saccharomyces cerevisiae (Morgan 2013, реферат) и не переносится на клетки человека без оговорки. pH — обзор Casey 2010; Ca²⁺ — обзор Rizzuto 2006.","sources":["Casey2009","Rizzuto2006","Schafer2001","Gutscher2008","Morgan2013","Birk2013","Hanson2004","Schwarzlander2015"],"quiz":{"id":"S1-L02","question":"В двух образцах pH одинаков и отношение GSH:GSSG одинаково (10⁴), но концентрация GSH во втором в 10 раз ниже. Каким будет фактический потенциал пары глутатиона во втором образце?","options":[{"id":"S1-L02-1","text":"Таким же, как в первом","correct":false,"feedback":"Отношение действительно одинаково, но в уравнение Нернста входит [GSH]²/[GSSG] = [GSH] · (GSH:GSSG). При десятикратно меньшем GSH это выражение уменьшается в 10 раз."},{"id":"S1-L02-2","text":"Менее отрицательным примерно на 30 мВ","correct":true,"feedback":"[GSH]²/[GSSG] уменьшается в 10 раз, и E сдвигается на (RT/2F)·ln 10 ≈ 30 мВ в положительную сторону. Поэтому потенциал нельзя восстановить по одному отношению GSH:GSSG."},{"id":"S1-L02-3","text":"Более отрицательным примерно на 30 мВ","correct":false,"feedback":"Направление обратное: чем меньше восстановленного глутатиона, тем слабее восстановительная способность пары, и потенциал становится менее отрицательным."}]},"widget":{"kind":"q1nernst","title":"","s":{"title":"Потенциал пары глутатиона по уравнению Нернста","status":"Расчёт по заданным параметрам","g_l":"Концентрация GSH","g_opts":["1 мМ","5 мМ","10 мМ"],"g_vals":[0.001,0.005,0.01],"r_l":"Отношение GSH:GSSG","r_opts":["10²","10³","10⁴","10⁵"],"r_vals":[100.0,1000.0,10000.0,100000.0],"p_l":"pH","p_opts":["7,0","7,2","7,8"],"p_vals":[7.0,7.2,7.8],"axis":"E(GSH/GSSG), мВ","e0":"E°′ при выбранном pH","calc":"расчёт","meas":[["цитозоль, HeLa",-320,-280],["просвет ЭПР, HeLa",-220,-180],["матрикс, HeLa",-360,-300]],"m_E":"Потенциал E","m_gssg":"Концентрация GSSG","m_e0":"E°′","u":["пМ","нМ","мкМ","мМ"],"mv":"мВ","note":"При выбранных условиях E = {E} мВ, концентрация GSSG — {gssg}.","legend":"E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]), 37 °C; E°′ = −240 мВ при pH 7,0 и сдвигается примерно на −60 мВ на единицу pH. Отметки — измеренные сенсорами значения (цитозоль — Gutscher 2008; ЭПР — Birk 2013; матрикс — Hanson 2004 и обзор Schwarzländer 2016)."}},"section":0,"number":2,"question":1},{"id":"pumps-channels","questions":[1],"title":"Почему для входа Ca²⁺ в матрикс достаточно канала, а для закисления лизосомы нужен насос","keywords":["насос","канал","переносчик","электрохимический потенциал","Δμ","MCU","SERCA","V-АТФаза","IP₃R","по градиенту","первично-активный транспорт"],"lead":["Направление самопроизвольного переноса иона задаёт электрохимический потенциал Δμ, а не одна разность концентраций; насос нужен там, где Δμ положительна."],"mechanism":["[[T10|Насос]] переносит вещество против электрохимического градиента за счёт гидролиза ATP или переноса электронов; [[T11|канал]] пропускает его только по градиенту.","[[T03|Δμ]] = RT·ln(c₂/c₁) + zF·Δψ: для Ca²⁺ (z = 2) при Δψ = −150 мВ электрическая часть (−29 кДж/моль) перевешивает химическую (+6 кДж/моль).","Поэтому Ca²⁺ входит в матрикс через канал [[T20|MCU]], а работу совершила дыхательная цепь, создавшая Δψ."],"paragraphs":["Различия между компартментами создают белки трёх классов. Насосы — V-АТФаза, [[T19|SERCA]], комплексы дыхательной цепи — переносят ионы против электрохимического градиента, используя энергию гидролиза ATP или переноса электронов. [[T12|Сопряжённые переносчики]] используют градиент другого вещества. Каналы пропускают ионы только по градиенту и потому не создают различие, а расходуют его — для передачи сигнала или для возврата к исходному состоянию.","Знак Δμ показывает, нужна ли работа. Для выхода Ca²⁺ из просвета ЭПР (около 370 мкМ свободного Ca²⁺) в цитозоль (0,1 мкМ) химическая часть равна RT·ln(0,1/370) ≈ −21 кДж/моль: достаточно открыть канал, рецептор IP₃. Обратный перенос требует +21 кДж/моль, и его выполняет SERCA за счёт гидролиза ATP.","С переносом Ca²⁺ в матрикс митохондрии дело обстоит иначе. Пусть в цитозоле 0,1 мкМ свободного Ca²⁺, а в матриксе — 1 мкМ (так бывает после предшествующего захвата Ca²⁺; в покое концентрация в матриксе близка к цитозольной, около 0,1 мкМ). Тогда химическая часть переноса из цитозоля в матрикс положительна: RT·ln 10 ≈ +5,9 кДж/моль. Но матрикс заряжен отрицательно, и при Δψ = −150 мВ электрическая часть 2F·Δψ ≈ −28,9 кДж/моль. Сумма −23 кДж/моль: Ca²⁺ входит против концентрационного, но по электрохимическому градиенту. MCU — высокоселективный Ca²⁺-канал внутренней мембраны, а не переносчик (Kirichok 2004). Если протонофор снизит Δψ до −10 мВ, Δμ станет положительной, и при 1 мкМ Ca²⁺ в матриксе вход через MCU прекратится.","Для протонов, закачиваемых в лизосому, уже химическая часть положительна: при pH 7,2 в цитозоле и 4,7 в просвете она равна RT·ln 10^2,5 ≈ +14,8 кДж/моль, поэтому нужен насос — V-АТФаза. Перенос заряда насосом делает просвет положительным, и без встречного переноса противоионов этот потенциал остановил бы закисление (Steinberg 2010)."],"trap":["Ион самопроизвольно движется только в сторону меньшей концентрации, поэтому накопление Ca²⁺ в матриксе требует насоса.","Для иона учитывают и электрическую часть Δμ. При Δψ около −150 мВ она для Ca²⁺ почти в пять раз больше химической, и Ca²⁺ входит в матрикс через канал MCU; работу совершает дыхательная цепь, создавшая Δψ."],"conditions":"Схема — расчёт Δμ = RT·ln(c₂/c₁) + zF·(ψ₂ − ψ₁) при 37 °C (RT = 2,58 кДж/моль, F = 96,5 кДж/(моль·В)). Концентрации — учебные значения порядка величин для покоящихся клеток млекопитающих: цитозоль 0,1 мкМ свободного Ca²⁺, матрикс 1 мкМ (после предшествующего захвата Ca²⁺; в покое — около 0,1 мкМ, как в модели вопроса 4), просвет ЭПР 370 мкМ (Pick 2023: клетки HEK293, сенсор D1ER). Для случая «Ca²⁺ в матрикс» расчёт совпадает с моделью практикума M1. Для мембраны ЭПР электрическая часть принята равной нулю (допущение модели); для лизосомы учтена только химическая часть — она уже положительна. MCU как канал — патч-кламп внутренней мембраны митохондрий клеток COS-7 (Kirichok 2004, реферат). Роль противоионов при закислении — Steinberg 2010 (полный текст, макрофаги мыши).","sources":["Kirichok2004","Steinberg2010","Pick2023"],"quiz":{"id":"S1-L03","question":"Свободный Ca²⁺ в цитозоле — 0,1 мкМ, в матриксе — 1 мкМ, Δψ = −150 мВ. Какой белок внутренней мембраны достаточен для входа Ca²⁺ в матрикс?","options":[{"id":"S1-L03-1","text":"Насос: перенос идёт против разности концентраций","correct":false,"feedback":"Против разности концентраций — да, но для иона решает электрохимический потенциал. При Δψ = −150 мВ электрическая часть делает Δμ отрицательной, и насос не нужен."},{"id":"S1-L03-2","text":"Никакой: бислой проницаем для Ca²⁺","correct":false,"feedback":"Липидный бислой почти непроницаем для ионов. Без канала Ca²⁺ не войдёт в матрикс даже при отрицательной Δμ: движущая сила есть, а пути нет."},{"id":"S1-L03-3","text":"Канал: Δμ для входа отрицательна","correct":true,"feedback":"Электрическая часть (≈ −29 кДж/моль) перевешивает химическую (≈ +6 кДж/моль), Δμ ≈ −23 кДж/моль. Перенос самопроизволен, и канала MCU достаточно; работу совершила дыхательная цепь, создав Δψ."}]},"widget":{"kind":"q1dmu","title":"","s":{"title":"Калькулятор Δμ: нужен ли насос","status":"Расчёт по заданным параметрам","modes":["Ca²⁺: цитозоль → матрикс","Ca²⁺: просвет ЭПР → цитозоль","Ca²⁺: цитозоль → просвет ЭПР","H⁺: цитозоль → лизосома"],"modes_label":"Перенос","psi_l":"Δψ внутренней мембраны митохондрии","psi_opts":["−180 мВ","−150 мВ","−125 мВ","−10 мВ (FCCP)"],"psi_vals":[-180,-150,-125,-10],"cases":[{"c1":0.1,"c2":1,"z":2,"from":"цитозоль 0,1 мкМ","to":"матрикс 1 мкМ","who_neg":"достаточно канала: MCU","who_pos":"канал не обеспечит вход: Δμ > 0"},{"c1":370,"c2":0.1,"z":2,"from":"просвет ЭПР 370 мкМ","to":"цитозоль 0,1 мкМ","who_neg":"достаточно канала: рецептор IP₃","who_pos":"нужен насос"},{"c1":0.1,"c2":370,"z":2,"from":"цитозоль 0,1 мкМ","to":"просвет ЭПР 370 мкМ","who_neg":"достаточно канала","who_pos":"нужен насос: SERCA (гидролиз ATP)"},{"c1":6.31e-08,"c2":2e-05,"z":1,"from":"цитозоль pH 7,2","to":"лизосома pH 4,7","who_neg":"достаточно канала","who_pos":"нужен насос: V-АТФаза (гидролиз ATP)"}],"chem":"химическая часть","el":"электрическая часть","tot":"Δμ","kj":"кДж/моль","el_na":"не учтена (допущение)","m_tot":"Δμ","m_who":"Что нужно для переноса","note_neg":"Δμ < 0: перенос самопроизволен, для него достаточно открытого канала.","note_pos":"Δμ > 0: перенос требует работы — насоса или сопряжённого переносчика.","legend":"Δμ = RT·ln(c₂/c₁) + zF·Δψ, 37 °C. Для мембран ЭПР и лизосомы электрическая часть не учтена: для ЭПР она принята равной нулю, для лизосомы уже химическая часть положительна, а перенос заряда насосом делает просвет положительным и лишь увеличивает Δμ."}},"section":0,"number":3,"question":1},{"id":"nonequilibrium","questions":[1],"title":"Почему различия между компартментами исчезают после остановки насосов","keywords":["неравновесие","стационар","утечка","релаксация","бафиломицин A1","тапсигаргин","антимицин A","олигомицин","характерное время","конканамицин A"],"lead":["Различия pH, Ca²⁺ и Δψ сохраняются, пока насос уравновешивает утечку. После
