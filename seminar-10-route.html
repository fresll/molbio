   W.pool_s4 — обновление пула HIF-1α при гипоксии и реоксигенации (качественная схема молекул);
   W.meth_s4 — схемы методов: последовательность операций, учебный иммуноблот, величина / контроль / предел вывода.
   Все подписи — в S (content.json); в коде только геометрия. Общие примитивы — из оболочки и 00_lib.js. */

/* ---------- структурная формула остатка пролина (или 4-гидроксипролина) в полипептидной цепи ----------
   Кольцо пирролидина: N, Cα (C2), Cβ (C3), Cγ (C4), Cδ (C5); атомы углерода не подписаны (скелетная формула).
   Атом N связан с Cα, Cδ и с карбонильным углеродом предыдущего остатка (амидная связь, атома H у N нет).
   Cα связан с карбонильной группой C=O, за которой следует NH следующего остатка. При hyd = true у Cγ (C4) — группа OH. */
function s4_proRes(cx, cy, hyd, S, k = 1) {
  const P = (x, y) => [cx + x * k, cy + y * k];
  const r = 26;
  const ang = {g: -90, b: -18, a: 54, n: 126, d: 198};
  const v = {};
  Object.entries(ang).forEach(([key, a]) => { const t = a * Math.PI / 180; v[key] = P(r * Math.cos(t), r * Math.sin(t)); });
  const col = '#2a3a48', w = 2.2 * k;
  const L = (p, q, c = col, ww = w) => line(p[0].toFixed(1), p[1].toFixed(1), q[0].toFixed(1), q[1].toFixed(1), c, ww, 'stroke-linecap="round"');
  const fs = 14 * k;
  let d = '';
  /* кольцо: N подписан, поэтому связи к N укорочены */
  const shrink = (p, q, f) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
  d += L(v.g, v.b) + L(v.b, v.a) + L(v.g, v.d);
  d += L(v.a, shrink(v.a, v.n, 0.72)) + L(v.d, shrink(v.d, v.n, 0.7));
  d += `<text x="${v.n[0].toFixed(1)}" y="${(v.n[1] + 5 * k).toFixed(1)}" font-size="${fs}" font-weight="700" text-anchor="middle" style="fill:#1f4e8c">N</text>`;
  /* амидная связь с предыдущим остатком: N — C(=O) */
  const cp = P(-48, 40), op = P(-48, 66);
  d += L(shrink(v.n, cp, 0.3), cp);
  d += L([cp[0] - 3 * k, cp[1]], [op[0] - 3 * k, op[1] - 10 * k]) + L([cp[0] + 3 * k, cp[1]], [op[0] + 3 * k, op[1] - 10 * k]);
  d += `<text x="${op[0].toFixed(1)}" y="${(op[1] + 5 * k).toFixed(1)}" font-size="${fs}" font-weight="700" text-anchor="middle" style="fill:#ae3347">O</text>`;
  d += L(cp, P(-76, 26));
  d += `<text x="${P(-80, 26)[0].toFixed(1)}" y="${(P(-80, 26)[1] + 5 * k).toFixed(1)}" font-size="${fs}" text-anchor="end" style="fill:#4d6275">${esc(S.prev || '')}</text>`;
  /* Cα — C(=O) — NH следующего остатка */
  const cq = P(48, 40), oq = P(48, 66), nq = P(76, 26);
  d += L(v.a, cq);
  d += L([cq[0] - 3 * k, cq[1]], [oq[0] - 3 * k, oq[1] - 10 * k]) + L([cq[0] + 3 * k, cq[1]], [oq[0] + 3 * k, oq[1] - 10 * k]);
  d += `<text x="${oq[0].toFixed(1)}" y="${(oq[1] + 5 * k).toFixed(1)}" font-size="${fs}" font-weight="700" text-anchor="middle" style="fill:#ae3347">O</text>`;
  d += L(cq, shrink(cq, nq, 0.62));
  d += `<text x="${(nq[0] + 4 * k).toFixed(1)}" y="${(nq[1] + 5 * k).toFixed(1)}" font-size="${fs}" font-weight="700" text-anchor="start" style="fill:#1f4e8c">${esc(S.next || 'NH')}</text>`;
  /* номер атома C4 */
  d += `<text x="${(v.g[0] - 9 * k).toFixed(1)}" y="${(v.g[1] + 2 * k).toFixed(1)}" font-size="${11 * k}" text-anchor="end" style="fill:#6d7d87">4</text>`;
  if (hyd) {
    const oh = P(0, -50);
    d += L(v.g, [oh[0], oh[1] + 6 * k], '#ae3347', w);
    d += `<text x="${oh[0].toFixed(1)}" y="${(oh[1] + 1 * k).toFixed(1)}" font-size="${fs}" font-weight="700" text-anchor="middle" style="fill:#ae3347">OH</text>`;
  }
  return d;
}

/* ---------- обновление пула HIF-1α: синтез новых молекул, гидроксилирование, распад ----------
   S.phases — подписи фаз; S.st[i] = {mols: ['pa', 'pad', 'n', 'na', …], deg: 'on'|'low', mk: …, m: [[…]], note}

W.pool_s4 = ({S, s, set, out, onGroup}) => {

    /* полоса времени */

    d += lab(px + 10, py + 20, S.pool_t, 12.5, 'start', '#4d6275', true);
    /* молекулы */

    st.mols.forEach((code, i) => {
      const r = Math.floor(i / cols), c = i % cols;
      const x = px + 12 + c * (mw + gx), y = py + 32 + r * (mh + gy);
      const dg = code.includes('d'), nw = code.includes('n');

      d += lab(x + mw / 2, y + 20, S.mol, 12.5, 'middle', dg ? '#5c6b78' : '#152c45', true);

/* ---------- схемы методов ----------
   S.methods[i] = {rows: [{t: заголовок ряда, steps: [...]}], blot?: {rows: [[подпись, [v…]]], lanes: [...], cap}, cells: [3 строки], note} */
function s4_blot(b, nar) {
  const W0 = nar ? 340 : 620, lw = nar ? 50 : 92, x0 = nar ? 96 : 190, rh = 34;
  const H0 = 24 + b.rows.length * rh + 46;
  let d = `<text x="${W0 - 8}" y="14" font-size="11.5" text-anchor="end" style="fill:#6d7d87">${esc(b.cap)}</text>`;
  b.rows.forEach((r, i) => {
    const y = 24 + i * rh;
    d += `<text x="${x0 - 8}" y="${y + 19}" font-size="${nar ? 11.5 : 13}" text-anchor="end" style="fill:#33495d">${esc(r[0])}</text>`;
    r[1].forEach((v, j) => {
      const x = x0 + j * (lw + 8);
      d += rect(x, y + 4, lw, 22, '#e9eef2', 4);
      if (v > 0) d += rect(x + lw / 2 - (lw / 2 - 4) * v, y + 7, (lw - 8) * v, 16, '#2a3a48', 5, `opacity="${(0.25 + 0.75 * v).toFixed(2)}"`);
    });
  });
  b.lanes.forEach((ln, j) => {
    const x = x0 + j * (lw + 8) + lw / 2, y = 24 + b.rows.length * rh + 14;
    String(nar && b.lanes_n ? b.lanes_n[j] : ln).split('\n').forEach((t, k) => { d += `<text x="${x}" y="${y + k * 14}" font-size="${nar ? 10.5 : 12}" text-anchor="middle" style="fill:#33495d">${esc(t)}</text>`; });
  });
  return svg(d, b.cap, H0, W0);
}
function s4_flow(rows, title, nar) {
  const W0 = nar ? 340 : 620;
  let d = '', y = 6;
  rows.forEach(r => {
    if (r.t) { d += `<text x="${nar ? 8 : 10}" y="${y + 15}" font-size="13" font-weight="700" style="fill:#152c45">${esc(r.t)}</text>`; y += 24; }
    const n = r.steps.length;
    if (!nar) {
      const gap = 22, bw = (W0 - 12 - (n - 1) * gap) / n, bh = 62;
      r.steps.forEach((t, i) => {
        const x = 6 + i * (bw + gap);
        d += box(x, y, bw, bh, t, {fill: '#edf3f8', stroke: '#8da7b9', size: 12.5, sw: 1.5});
        if (i < n - 1) d += edgeSvg('seq', x + bw + 2, y + bh / 2, x + bw + gap - 2, y + bh / 2, 'on', false, 0);
      });
      y += bh + 14;
    } else {
      const bw = 300, gap = 16, x = 20, MAXC = 42;   /* 3.9 (аудит V-01): длинная подпись переносится по словам, высота блока растёт */
      r.steps.forEach((t, i) => {
        const lines = [];
        String(t).replace(/\n/g, ' ').split(' ').forEach(w => { const L = lines.length ? lines[lines.length - 1] : null;
          if (L != null && (L + ' ' + w).length <= MAXC) lines[lines.length - 1] = L + ' ' + w; else lines.push(w); });
        const bh = Math.max(40, 14 * lines.length + 14);
        d += box(x, y, bw, bh, lines.join('\n'), {fill: '#edf3f8', stroke: '#8da7b9', size: 12, sw: 1.5});
        if (i < n - 1) d += edgeSvg('seq', x + bw / 2, y + bh + 1, x + bw / 2, y + bh + gap - 1, 'on', false, 0);
        y += bh + gap;
      });
      y += 2;
    }
  });
  return svg(d, title, y + 4, W0);
}
W.meth_s4 = ({S, s, set, out, onGroup}) => {

/* ---------- раздел 5, шаг 29: матрица «система × уровень измерения» (сем. 10) ----------
   Выбор системы и уровня открывает карточку: событие, величина, метод (схема этапов), контроль, граница вывода.
   Все подписи — из S (content.json). */
W.matrix_s5 = ({S, s, set, out, onGroup}) => {
  s.r ??= 0; s.c ??= 0;
  set(S.title, S.status, buttonGroup('mx-r', S.rows, s.r, S.rows_label) + buttonGroup('mx-c', S.cols_short, s.c, S.cols_label));
  NET_REDRAW = null;
  const draw = () => {
    const nar = small(), W0 = nar ? 340 : 600, fs = nar ? 14 : 15;
    const cell = S.cells[s.r][s.c];
    let d = '', y = 6;
    /* матрица 4 × 4 */
    const lab = nar ? 44 : 64, cw = (W0 - lab - 8) / 4, ch = nar ? 38 : 42, RL = S.rows_m || S.rows;
    S.cols_short.forEach((t, j) => { d += lines10(lab + j * cw + cw / 2, y + 14, t, nar ? 11.5 : 13, 'middle', C10.gray, 600); });
    y += nar ? 30 : 26;
    RL.forEach((t, i) => {
      d += lines10(lab - 8, y + i * (ch + 4) + ch / 2 + 5, t, nar ? 12.5 : 14, 'end', C10.ink, 700);
      S.cols_short.forEach((_, j) => {

        d += rect(x, yy, cw - 6, ch, on ? '#fbe3a6' : '#f3f6f9', 6, `stroke="${on ? C10.amber : '#c9d6e2'}" stroke-width="${on ? 3 : 1.5}"`);
        const ml = String(S.cells[i][j].m).split('\n').length, mf = nar ? 11.5 : 13.5;

      });

    /* этапы метода */
    d += `<text x="8" y="${y + 14}" font-size="${fs}" font-weight="700" style="fill:${C10.gray}">${esc(S.steps_h)} ${esc(cell.name)}</text>`;
    y += 26;
    const cols = nar ? 2 : 4, bw = nar ? 152 : 138, bh = nar ? 62 : 70, gx = nar ? 20 : 12, gy = 16;
    const x0 = (W0 - (cols * bw + (cols - 1) * gx)) / 2;

      d += circ(bx + 12, by + 12, 9, '#dbe8f5', `stroke="${C10.blue}" stroke-width="1.5"`) + `<text x="${bx + 12}" y="${by + 16}" font-size="11" text-anchor="middle" font-weight="700" style="fill:${C10.blue}">${i + 1}</text>`;
      const ln = String(t).split('\n');
      d += lines10(bx + bw / 2 + 6, by + bh / 2 - (ln.length - 1) * (fs - 2) * 0.59 + fs * 0.35, t, fs - 2, 'middle', C10.ink, 600);
      if (i < cell.steps.length - 1) {
        if (q < cols - 1) d += arrow(bx + bw + 2, by + bh / 2, bx + bw + gx - 2, by + bh / 2, '#7d95a8', 2.5);

      }
    });
    y += Math.ceil(cell.steps.length / cols) * (bh + gy) + 2;
    const cells = S.heads.map((h, i) => `<div class="mini"><h3>${esc(h)}</h3><p>${esc(cell.v[i])}</p></div>`).join('');
    out(svg(d, S.title, y, W0, cell.note), `<div class="mini-grid cards4">${cells}</div>` + result(`<p>${esc(cell.note)}</p><p class="quiet">${esc(S.fixed)}</p>`));

  onGroup('mx-r', v => { s.r = v; draw(); });
