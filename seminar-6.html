x_e5_rest": "срок — по работе", "s4_bx_e5_s2": "лиганд TLR4", "s4_bx_e5_sys": "Макрофаги человека", "s4_bx_e5_c": "Вмешательств нет.", "s4_bx_e5_src": "Qiao 2013.", "s4a_cb_e1": "Моноциты человека получили β-глюкан на 24 ч, после покоя — LPS: продукция цитокинов в ответ на LPS выше, чем у клеток, получивших только LPS, а H3K27ac на дистальных регуляторных элементах выше.", "s4a_cb_e2": "Если в первые 24 ч заблокирован путь Akt–mTOR–HIF-1α, усиленный ответ на LPS не формируется: продукция цитокинов такая же, как у клеток, получивших только LPS.", "s4a_cb_e3": "После LPS, покоя и повторного LPS ответ провоспалительных генов ниже, чем у клеток, получивших только второй LPS (толерантность); активные метки на этих генах не появляются.", "s4a_cb_e4": "В макрофагах без Eed H3K27me3 ниже и H3K27ac выше, чем у клеток дикого типа, но продукция TNF и IL-6 в ответ на повторный LPS ещё ниже: убыль репрессивной метки не усилила ответ.", "s4a_cb_e5": "После IFN-γ ответ на стимул TLR4 выше и продлён; на промоторах генов цитокинов выше занятость STAT1 и IRF1 и ацетилирование, а транскрипция до второго стимула не запускается.", "s4a_cs_both": "Образец «оба стимула» показывает итог после покоя.", "s4a_cs_second": "Образец «только второй стимул» — контроль: так отвечают клетки, не получавшие первого стимула.", "s4a_cs_first": "Образец «только первый стимул» показывает метки после первого стимула; второго стимула нет, поэтому ответа на него нет.", "s4a_zb_e1": "Сохраняется усиленный ответ на LPS в моноцитах человека после 24 ч β-глюкана и покоя; моноциты в культуре не реплицируют ДНК, поэтому разведение метки делением к этому опыту не относится.", "s4a_zb_e2": "Метаболический сигнал первого стимула нужен для формирования усиленного ответа; опыт не показывает, что тот же путь нужен для его сохранения после покоя.", "s4a_zb_e3": "Толерантность — тоже состояние после первого стимула, но противоположного знака: при той же схеме ответ ниже, и активные метки не возникают.", "s4a_zb_e4": "Знак эффекта метки нельзя вывести из метки: при потере Eed H3K27me3 ниже, а ответ слабее, вопреки ожиданию «меньше метки — больше ответа». Ослабление ответа после потери фермента само по себе не показывает, какую роль играет метка: нужны контроли жизнеспособности и общего ответа клеток на стимул.", "s4a_zb_e5": "Прайминг: хроматин подготовлен, транскрипция не запущена; различие с тренировкой — в том, возвращается ли активность к исходному уровню до второго стимула (Mishra 2024).", "s4_mkey": "Три образца: EZH2 заблокирован полностью, измерение через 2 цикла", "s4_m_smp": "Образец", "s4_m_mark": "Метка, доля исходной", "s4_m_act": "Активность промотора", "s4_m_ezh": "EZH2 заблокирован", "s4_m_div": "клетки делятся", "s4_m_nodiv": "клетки не делятся", "s4_m_primed": "промотор подготовлен", "s4_m_normal": "промотор обычный", "s4_m_th": "порог активации {th}", "s4_m_cond": "Условия образца", "s4_m_q0": "Условия образцов, кроме блока EZH2, скрыты.", "s4_m_q1": "Условия образцов открыты: сравните их с показаниями.", "s4a_cm_q": "Образцы X, Y и Z получены при полном блоке EZH2; в каждом измерены метка и активность промотора.", "s4a_zm_q": "Одинаковое воздействие даёт разные показания, если различаются сами клетки или промотор.", "s4a_cm_rev": "У X и Z метка одинакова, а активность различается из-за разного порога промотора: у подготовленного X он выше. В Y клетки не делятся, метка не разведена, и промотор остаётся подавленным.", "s4a_zm_rev": "Метка и активность промотора — разные показания: одна и та же метка может давать разную активность, а высокая метка — подавленный промотор. Для вывода о причине нужны оба.", "p4a_1_q": "В делящихся клетках домен H3K27me3 удерживает промотор мишени подавленным. К клеткам добавляют ингибитор EZH2 в полной дозе и через два деления измеряют метку в домене и активность промотора. Как изменятся показания?", "p4a_1_o1": "Метка снизится сильно, а активность промотора вырастет мало: метка ещё выше порога.", "p4a_1_o2": "Оба показания изменятся одинаково сильно: активность промотора пропорциональна метке.", "p4a_1_o3": "Метка почти не изменится, а активность промотора сразу вырастет: ингибитор снимает репрессию.", "p4a_1_k": "Ингибитор EZH2 останавливает постановку новой метки, а деление вдвое разводит имеющуюся; через два деления остаётся около пятой части метки, что ещё выше порога активации, поэтому активность промотора растёт мало.", "p4a_1_e": "В модели при полной блокаде EZH2 через два деления метка снижается с 97 % до 20 % исходной, а активность промотора вырастает с < 2 % только до 12 %: порог активации задан как 12,5 % исходной метки (при таком остатке активность вдвое ниже максимума), и остаток метки достигает его лишь после третьего деления. Доля клеток в высоком состоянии падает со 100 % до 0 %: домен уже потерял высокое состояние, а промотор ещё подавлен. Это согласуется с наблюдением, что в клетках лимфомы и в кишечнике мыши активация многих генов требовала не менее трёх делений (Jadhav 2020), а при ингибировании EZH2 за 24 ч родительская метка в клетках HeLa в основном сохранена (Reverón-Gómez 2018). Порог и скорости — допущения учебной модели.", "p4a_1_w2": "Активность промотора не пропорциональна метке: выход задан пороговой кривой, и пока остаток метки заметно выше порога, промотор остаётся подавленным; порог зависит от гена (Jadhav 2020). Пропущено звено: пороговый характер ответа промотора.", "p4a_1_w3": "Ингибитор не снимает метку сразу: фермент остановлен, но убыль метки идёт через разведение при каждой репликации (Alabert 2015), поэтому за два деления она заметно снижается; активность промотора растёт позже, когда остаток метки опускается ниже порога. Пропущены оба звена: разведение при делении и порог активации.", "p4a_2_q": "В делящихся клетках домен H3K27me3 удерживает промотор мишени подавленным. К клеткам добавляют ингибитор EED в полной дозе: он занимает карман для метки и не блокирует каталитический центр EZH2. Как изменится метка в домене через два деления?", "p4a_2_o1": "Не изменится: каталитический центр EZH2 не заблокирован, и метка ставится как прежде.", "p4a_2_o2": "Снизится заметно: без усиления через EED метка достраивается слишком медленно.", "p4a_2_o3": "Снизится слабо: EZH2 по-прежнему ставит метку, хотя и медленнее, чем при усилении.", "p4a_2_k": "EED узнаёт метку и усиливает EZH2 (положительная обратная связь); без этого усиления метка достраивается медленно даже при незаблокированном EZH2, и деление разводит её почти так же, как при блоке самого фермента.", "p4a_2_e": "В модели при полном блоке EED метка через два деления снижается с 97 % до 21 % исходной (при полном блоке EZH2 — почти так же): зарождение метки не зависит от EED, но слабое, и почти вся достройка идёт через обратную связь. Активность промотора возрастает с < 2 % до 12 %, а доля клеток в высоком состоянии снижается со 100 % до 0 %. EED226 подавляет и PRC2 с мутантом EZH2, устойчивым к SAM-конкурентным ингибиторам (Qi 2017), A-395 активен в линиях, устойчивых к каталитическим ингибиторам (He 2017), а MAK683 применяли в клетках лимфомы (Jadhav 2020); различие между этими классами лежит вне модели.", "p4a_2_w1": "Присутствие незаблокированного EZH2 не равно достройке метки: без аллостерического усиления через EED (Margueron 2009) фермент ставит метку медленно, а мутантные EZH2 и EED могут оставаться на хроматине, но почти не метилировать (Lee 2018). Пропущено звено: обратная связь через EED.", "p4a_2_w3": "Зарождение метки в модели не зависит от EED, но оно медленное; почти вся достройка идёт через обратную связь «метка — EED — EZH2» (Margueron 2009). Пропущено звено: вклад обратной связи в скорость достройки, а не только наличие активного фермента.", "p4a_3_q": "Моноциты человека получили β-глюкан на 24 ч, после покоя — LPS: ответ на LPS выше, чем у клеток, получивших только LPS. В повторном опыте в первые 24 ч заблокировали путь Akt–mTOR–HIF-1α. Как изменится ответ на LPS?", "p4a_3_o1": "Не изменится: усиленный ответ определяется хроматином и от метаболизма клеток не зависит.", "p4a_3_o2": "Станет ниже, чем у наивных клеток: блок подавляет и обычный ответ клеток на LPS.", "p4a_3_o3": "Станет таким же, как у наивных клеток: усиление требует метаболического сигнала.", "p4a_3_k": "Первый стимул запускает путь Akt–mTOR–HIF-1α и аэробный гликолиз; без этого пути усиленный ответ не формируется, и клетки отвечают на второй стимул как наивные.", "p4a_3_e": "В описанных опытах ингибиторы Akt, mTOR и HIF-1α, добавленные вместе с β-глюканом на первые 24 ч, блокировали обучение моноцитов: ответ на повторный стимул не усиливался (Cheng 2014). Показания блока и наивных клеток в каталоге совпадают по шкале ответа («как у наивных»); H3K27ac и H3K27me3 в этих опытах в разобранных работах не измеряли, поэтому показано «не измерено». Опыт показывает, что метаболический сигнал нужен для индукции; он не показывает, что тот же путь нужен для сохранения состояния после покоя.", "p4a_3_w1": "Усиленный ответ после β-глюкана зависит от метаболического перепрограммирования в первые 24 ч: блок пути Akt–mTOR–HIF-1α предотвращал обучение (Cheng 2014). Пропущено звено: первый стимул действует через метаболический сигнал, а не только через хроматин.", "p4a_3_w2": "В разобранной работе описано предотвращение обучения, а не подавление обычного ответа на LPS (Cheng 2014). Пропущено звено: различие между отсутствием усиления и подавлением ответа; образец «только второй стимул» показывает исходный уровень.", "p4a_4_q": "В делящихся клетках EZH2 заблокирован полностью. Сравнивают через два деления два промотора: обычный и «подготовленный» — с высоким исходным H3K4me2/3. Как различаются метка в домене и активность промотора?", "p4a_4_o1": "Метка одинакова, а подготовленный промотор активнее: порог выше.", "p4a_4_o2": "Метка выше у подготовленного промотора, поэтому его активность ниже.", "p4a_4_o3": "Различий нет: активность промотора определяется только остатком метки.", "p4a_4_k": "В этой модели число делений и восстановление H3K27me3 задают остаточную долю метки в домене независимо от состояния промотора. Промотор с высоким исходным H3K4me2/3 активируется уже при большем остатке H3K27me3, то есть порог активации у него выше.", "p4a_4_e": "В модели после двух делений метка одинакова у обоих промоторов — 20 % исходной, а активность равна 12 % при пороге 12,5 % и 69 % при пороге 25 %: разницу создаёт порог активации. В эпителии кишечника мыши гены с высоким исходным H3K4me2/3 на промоторе активировались при большем остатке метки (Jadhav 2020); величина порога 25 % для «подготовленного» промотора — допущение учебной модели.", "p4a_4_w2": "H3K4me2/3 — активная метка на промоторе; она не повышает H3K27me3 в домене, а тормозит PRC2 (Schmitges 2011). Прямое влияние H3K4me2/3 на PRC2 в этой модели не учитывается: остаток H3K27me3 определяется делениями и восстановлением метки и в обоих случаях одинаков. Пропущено звено: порог активации зависит от промотора, а метка домена — от деления.", "p4a_4_w3": "Активность промотора определяется остатком метки вместе с порогом, а порог зависит от гена: промоторы с высоким исходным H3K4me2/3 активируются при большем остатке метки (Jadhav 2020). Пропущено звено: зависимость порога от состояния промотора.", "p4a_5_q": "Домен H3K27me3 подавляет промотор мишени; в первых двух циклах идёт транскрипция гена, ускоряющая потерю метки. В делящихся клетках к шестому циклу домен потерян. Какой к тому же моменту будет доля клеток с доменом в высоком состоянии, если клетки не делятся, по сравнению с делящимися клетками?", "p4a_5_o1": "Не изменится: транскрипция удаляет метку независимо от деления клеток.", "p4a_5_o2": "Снизится: без деления метка достраивается хуже, чем в делящихся клетках.", "p4a_5_o3": "Возрастёт: без разведения домен переживает короткую транскрипцию.", "p4a_5_k": "В модели транскрипция ускоряет потерю метки, а деление вдвое разводит остаток; вместе они опускают метку ниже уровня, с которого обратная связь через EED уже не восстанавливает домен. Без деления разведения нет, и после окончания транскрипции домен достраивается.", "p4a_5_e": "В модели при транскрипции в первых двух циклах метка к шестому циклу снижается до < 1 % исходной в делящихся клетках, доля клеток в высоком состоянии равна 0 %, активность промотора — 100 %. Без деления метка остаётся на уровне 100 %, доля клеток в высоком состоянии — 100 %, активность промотора < 2 %. Активные метки H3K4me3 и H3K36me2/3 тормозят PRC2 на очищенных комплексах (Schmitges 2011), а вклад транскрипции в клетке отдельно не изолирован; деление разводит метку вдвое (Alabert 2015); моноциты в культуре не реплицируют ДНК (Saeed 2014), но данных о H3K27me3 в неделящихся клетках в числах нет, поэтому режим без деления — допущение учебной модели.", "p4a_5_w1": "Транскрипция ускоряет потерю метки только в первых циклах; затем обратная связь через EED может восстановить домен, если остаток метки достаточен, а деление вдвое разводит остаток (Alabert 2015). Пропущено звено: исход зависит от того, разведён ли остаток делением.", "p4a_5_w2": "В этой модели восстановление метки протекает одинаково в делящихся и неделящихся клетках; различие в том, что деление вдвое разводит метку (Alabert 2015), а без деления разведения нет. Пропущено звено: разведение при репликации, а не скорость достройки.", "p4a_6_q": "В делящихся клетках домен H3K27me3 подавляет промотор мишени; ингибитор EZH2 снижает активность фермента (блок 20 %). Если усреднять клетки, к восьмому делению домен остаётся в высоком состоянии. Как изменится доля клеток с доменом в высоком состоянии, если домен состоит из 30 нуклеосом, а метки распределяются между дочерними клетками случайно?", "p4a_6_o1": "Не изменится: клетки с одинаковой активностью EZH2 ведут себя одинаково, домен тот же.", "p4a_6_o2": "Снизится: случайное расхождение меток выводит часть клеток из высокого состояния.", "p4a_6_o3": "Станет нулевой: домен из 30 нуклеосом вообще не способен удерживать высокое состояние.", "p4a_6_k": "В малом домене метки расходятся между дочерними клетками случайно: одна клетка получает больше меток, другая меньше, и клетки с малой долей меток теряют высокое состояние, поэтому доля клеток в нём падает, хотя средняя метка меняется слабее.", "p4a_6_e": "В модели при блоке 20 % и усреднённых клетках метка к восьмому делению равна 92 % исходной и все клетки в высоком состоянии (100 %). Для домена из 30 нуклеосом средняя метка снижается до 40 %, доля клеток в высоком состоянии — до 45 %, активность промотора вырастает с < 2 % до 47 %. Даже без ингибитора в таком домене высокое состояние сохраняют около трёх четвертей клеток (столбец «без воздействия»): случайность сама выводит часть клеток из высокого состояния. В одиночных клетках млекопитающих подавление и реактивация репортёра происходят по принципу «всё или ничего»: регулятор меняет долю подавленных клеток, а не уровень в каждой (Bintu 2016); одноклеточного ChIP в работе Jadhav 2020 не было. Размер домена и порог высокого состояния — допущения.", "p4a_6_w1": "Одинаковая активность фермента не делает клетки одинаковыми: в малом домене число меток мало, и их распределение между дочерними клетками при делении случайно, поэтому клетки различаются (Bintu 2016: переходы «всё или ничего» в одиночных клетках). Пропущено звено: случайность при малом числе нуклеосом.", "p4a_6_w3": "Малый домен не теряет высокое состояние во всех клетках сразу: часть клеток сохраняет его, и по модели доля остаётся заметной. Пропущено звено: потеря происходит случайно и не во всех клетках, поэтому доля уменьшается, а не обращается в нуль.", "p4a_7_q": "Макрофаги получили LPS, а после покоя — повторно LPS: продукция TNF и IL-6 в ответ на второй LPS ниже, чем у наивных клеток (толерантность). Те же опыты повторили на клетках без Eed. Как изменится ответ на повторный LPS?", "p4a_7_o1": "Станет ещё слабее, хотя H3K27me3 в клетках ниже.", "p4a_7_o2": "Станет сильнее: меньше H3K27me3 — слабее подавление цитокиновых генов.", "p4a_7_o3": "Не изменится: потеря Eed не влияет на толерантность к LPS.", "p4a_7_k": "При потере Eed H3K27me3 снижается, но ответ на повторный LPS не растёт, а падает: в работе эффект связан с генами оси TGF-β/Runx3, а не с прямым снятием репрессии цитокиновых генов.", "p4a_7_e": "В макрофагах мыши без Eed H3K27me3 ниже, H3K27ac выше, а TNF и IL-6 при толерантности к LPS подавлены сильнее, чем у клеток дикого типа; ингибирование EED тоже снижало TNF и IL-6, и эффект связан с активацией генов оси TGF-β/Runx3, а не с прямым дерепрессированием цитокиновых генов (Boonmee 2024). Измерена продукция цитокинов TNF и IL-6; изменения мРНК, найденные в той же работе при РНК-секвенировании, не равнозначны изменению белкового ответа. В каталоге это строка «H3K27me3 ниже, H3K27ac выше, ответ ещё ниже»: модель домена не определяет знак эффекта метки на ответ. Показания даны словами; чисел в этом опыте нет. Ослабление ответа после потери Eed само по себе не показывает, какую роль играет метка: нужны контроли жизнеспособности и общего ответа клеток на стимул.", "p4a_7_w2": "Ожидание «меньше репрессивной метки — больше ответа» в этом опыте не подтвердилось: продукция TNF и IL-6 была ниже (Boonmee 2024). Пропущено звено: Eed влияет на ответ и через другие гены, поэтому знак эффекта нельзя вывести из метки.", "p4a_7_w3": "Потеря Eed изменила и метки, и ответ: H3K27me3 ниже, H3K27ac выше, TNF и IL-6 подавлены сильнее (Boonmee 2024). Пропущено звено: у Eed есть эффекты, не сводимые к одной метке, и вариант «не изменится» противоречит опыту.", "p4a_8_q": "В трёх образцах EZH2 заблокирован полностью, измерение — через два цикла. X: метка 20 %, активность промотора 69 %. Y: метка 82 %, активность < 2 %. Z: метка 20 %, активность 12 %. Какое объяснение согласуется с показаниями?", "p4a_8_o1": "X — клетки не делятся, Y — подготовленный промотор, Z — обычные делящиеся клетки.", "p4a_8_o2": "X — подготовленный промотор, Y — клетки не делятся, Z — обычные делящиеся клетки.", "p4a_8_o3": "X — обычные делящиеся клетки, Y — подготовленный промотор, Z — клетки не делятся.", "p4a_8_k": "При одинаковом блоке EZH2 метка зависит от деления: в неделящихся клетках репликация её не разводит, и она остаётся высокой (Y); при одинаковой метке активность определяется порогом промотора, у подготовленного он выше (X против Z).", "p4a_8_e": "В модели в образцах X и Z, где клетки делятся, метка после двух делений одинакова — 20 % исходной, а активность различается: 69 % при пороге 25 % (подготовленный промотор) и 12 % при пороге 12,5 % (обычный). В образце Y клетки не делятся: метка убывает только за счёт удаления (82 %), и промотор остаётся подавленным (< 2 %). Метка и активность — разные показания, и по одному из них условия образца определить нельзя. Разведение метки делением и зависимость порога от H3K4me2/3 показаны в клетках кишечника мыши и лимфомы (Jadhav 2020); сами значения образцов — расчёт учебной модели.", "p4a_8_w1": "Если бы клетки X не делились, метка в X осталась бы высокой, как в Y: без репликации разведения нет. В X метка снижена до 20 %, как в делящемся Z, поэтому клетки X делились. Пропущено звено: при условиях этой задачи остаточная доля метки позволяет различить делящиеся и неделящиеся клетки.", "p4a_8_w3": "В образце Z метка снижена до 20 %: так происходит при делении (Alabert 2015), а в неделящихся клетках метка осталась бы высокой, как в Y. Пропущено звено: неделящимся клеткам соответствует высокая метка, а не низкая активность при сниженной метке.", "gn_h_kdm6": "KDM6: деметилазы H3K27", "g_h_kdm6": "KDM6A (UTX) и KDM6B (JMJD3) — деметилазы, удаляющие метильные группы с H3K27me3 (Agger 2007). Переключатель «Ингибитор KDM6» замедляет удаление метки в модели (до 0,3 от исходной скорости; доза в работах не задана, это допущение). Селективный ингибитор каталитического центра этих ферментов снижал продукцию провоспалительных цитокинов в LPS-активированных макрофагах человека (Kruidenier 2012), но отсюда не следует, что эффект идёт через H3K27me3 конкретного гена: в макрофагах Jmjd3 регулирует транскрипцию и независимо от деметилирования H3K27 (De Santa 2009), а в кишечных стволовых клетках KDM6A на мишенях PRC2 не найдена (Jadhav 2020). TET — другая группа ферментов: они окисляют 5-метилцитозин в ДНК и гистоновых меток не снимают.", "gn_h_tx": "Транскрипция и метка", "g_h_tx": "Транскрипция гена связана с активными метками H3K4me3 и H3K36me2/3: на очищенных комплексах они тормозят PRC2, и нуклеосомы с ними метилируются слабее, а H3K27me3 стимулирует PRC2 (Schmitges 2011). В модели транскрипция в первых циклах представлена дополнительной потерей метки; её величина — допущение, а длительность (1–3 цикла) задаёт переключатель. Пока идёт транскрипция, метка теряется быстрее; после неё петля «метка — EED — EZH2» восстанавливает домен, если остаток метки достаточен, и не восстанавливает, если деление уже вдвое разбавило остаток.", "gn_h_noise": "Размер домена и случайность", "g_h_noise": "Домен из малого числа нуклеосом ведёт себя вероятностно: при делении каждая меченая нуклеосома достаётся данной дочерней клетке с вероятностью одна вторая, а достройка идёт случайно. Модель считает точное распределение числа меченых нуклеосом по клеткам. Показания — средние по клеткам; «клетки в высоком состоянии» — доля клеток, у которых метку несут не менее трёх десятых нуклеосом домена (порог выбран как допущение). При выборе «все клетки одинаковы» состояние одинаково у всех клеток, и доля равна 0 или 100 %. В одиночных клетках млекопитающих подавление и реактивация репортёра идут по принципу «всё или ничего»: регулятор меняет долю подавленных клеток, а не уровень экспрессии в каждой (Bintu 2016); в математической модели PRC2 медленная динамика метки фильтрует короткие импульсы активности факторов транскрипции (Berry 2017). Две группы клеток в один момент ещё не показывают бистабильность: её проверяют, изменяя вход и возвращая исходное условие (Bruno 2022). Размеры 80 и 30 нуклеосом — допущения.", "gn_h_drugs": "Воздействия: что делает каждое", "g_h_drugs": "Ингибитор EZH2 (SAM-конкурентный: GSK126, EPZ005687, EPZ-6438, UNC1999) снижает каталитическую активность и не удаляет метку сразу (McCabe 2012; Knutson 2012; Knutson 2014; Konze 2013): при 1 мкМ EPZ-6438 родительский ландшафт H3K27me3 в клетках HeLa через 24 ч в основном сохранён (Reverón-Gómez 2018). Ингибитор EED занимает карман для метки и препятствует аллостерической активации PRC2 (Qi 2017; He 2017); в модели он действует на обратную связь, а не на каталитический центр. Нокаут Ezh2 в кишечнике мыши оставляет около 43,5 % H3K27me3, мишени остаются подавленными, поскольку EZH1 частично замещает EZH2; в модели это остаточная активность выше порога, а число 43,5 % модель не воспроизводит. Нокаут Eed оставляет около 4,91 % метки и приводит к активации мишеней не раньше чем через три деления; в модели обратной связи нет (Jadhav 2020). Ингибиторы BET (JQ1, I-BET) вытесняют белки BET из хроматина, конкурируя за карман, узнающий ацетиллизин: они не снимают ацетилирование, а блокируют его чтение, и в этой сцене не моделируются (Filippakopoulos 2010; Nicodeme 2010). Ни одно из воздействий не «снимает метку»: они меняют скорость достройки или удаления, а результат зависит от числа делений.", "gn_h_b": "Повторный стимул: что показано", "g_h_b": "Этот режим показывает опубликованные исходы опытов, а не расчёт. Чтобы говорить о функциональной памяти ответа, нужны три образца: клетки, получившие оба стимула; только второй стимул (наивные клетки — контроль) и только первый. Тренированный иммунитет — усиленный ответ врождённых клеток на последующие стимулы; тренировку, прайминг и толерантность различают как разные процессы (Netea 2020; Divangahi 2021). Показания даны словами, потому что в разобранных работах нет сопоставимых чисел; «не измерено» значит, что работа этот показатель не определяла. Измеренная величина (продукция цитокинов, транскрипция, ChIP-сигнал) указана в подписи опыта; мРНК и белковый ответ могут изменяться по-разному. Моноциты в культуре не реплицируют ДНК (Saeed 2014), и разведение метки делением к этим опытам не относится. На уровне гемопоэтических стволовых клеток и клеток-предшественниц передача через деление возможна (Mitroulis 2018; Kaufmann 2018; Cirovic 2020), но какая метка или доступность хроматина её несёт, не показано: разведение H3K27me3 как основа тренировки остаётся гипотезой. Модель домена не определяет знак эффекта метки на ответ: при потере Eed метка H3K27me3 ниже, а продукция цитокинов при толерантности слабее (Boonmee 2024).", "gn_h_bm": "H3K27ac и H3K27me3 как показания", "g_h_bm": "H3K27ac — ацетилирование лизина 27 гистона H3: метка активных регуляторных элементов; на том же остатке H3K27me3 — репрессивная метка, и одновременно на одной копии хвоста они не стоят. В моноцитах β-глюкан создавал H3K27ac на примерно 3000 дистальных регуляторных элементов (при LPS — примерно на 500), и большая часть этих элементов уже была слабо помечена или доступна (Saeed 2014). Метки измеряют ChIP-seq: это среднее по клеткам, и наличие метки не показывает, что она — причина усиленного ответа; причинность проверяют адресными опытами с контролем инструмента (O'Geen 2017; Amabile 2016).", "gn_h_myst": "Загадка: три образца", "g_h_myst": "В трёх образцах EZH2 заблокирован полностью, измерены метка в домене и активность промотора. Метка зависит от деления и скорости удаления, а активность — ещё и от порога промотора: порог выше у промоторов с высоким исходным H3K4me2/3 (Jadhav 2020). Различие показаний при одинаковом воздействии указывает на различие самих клеток или промотора. Условия образцов — выбор учебной модели, а не данные одной работы.", "gn_h_mem": "Что называют памятью", "g_h_mem": "В этом разделе различают сохранение состояния хроматина и память ответа. О памяти ответа говорят, если после прекращения первого воздействия и периода покоя клетки отвечают на новый стимул иначе, чем сопоставимые наивные клетки, получившие только этот стимул. Слово «память» требует указать, что сохраняется, в каких клетках и после какого испытания. Здесь различают три вопроса: сохраняется ли состояние в одной клетке без деления (метка убывает за счёт удаления); передаётся ли оно дочерним клеткам при делении (метка разводится вдвое, и состояние сохраняется, только если достройка быстрее разведения); остаётся ли после покоя функциональный итог — усиленный или ослабленный ответ на повторный стимул. Метка — одна из возможных причин, но не сама память. Инактивация X — пример второго вопроса: в эмбриональных стволовых клетках подавление, вызванное Xist, обратимо в начале дифференцировки и к 72 ч становится необратимым и не зависит от Xist (Wutz 2000), а начало подавления зависит от SPEN и Polycomb параллельно (Bowness 2022); утверждение «Xist через PRC2 подавляет все гены» упрощено. Закладки митоза: GATA1 остаётся на ключевых генах кроветворных клеток, и его разрушение только в митозе замедляет их реактивацию (Kadauke 2012); H3K27ac влияет на ранний постмитотический запуск генов (Pelham-Webb 2021); «исключение» факторов из митотических хромосом в значительной мере — артефакт фиксации (Teves 2016). Для H3K4me3 показано сохранение в митозе, но не функция закладки.", "teacher_1": "На каждый вопрос отводится 5–7 минут на базовом уровне, затем 8–10 минут на продвинутом. В режиме «Сценарий» на каждом шаге задаётся вопрос: студенты выбирают ответ, после чего нажимают кнопку «Показать на схеме». До показа ответа настройки недоступны. Клавиши 1–4 переключают вопросы, клавиша B — уровень. Щелчок по белку или молекуле (или Tab и Enter) открывает справку. Единица времени у вкладок разная: в вопросах 1 и 4 — число клеточных делений, в вопросе 3 — часы учебной модели, вопрос 2 описывает состояние при заданных условиях и времени не содержит. Направления эффектов и порядки величин взяты из перечисленных работ, выполненных в разных системах; остальные параметры подобраны автором модели. Эти сведения не образуют одной измеренной кривой. Вкладки связаны одной историей: что именно сохраняет клетка о своём состоянии и о прошлом сигнале и как проверить, что сохраняется именно это. Метилирование сайта CTCF (вопрос 1) убирает границу, которую показывает вопрос 2; метка по числу делений считается одинаково в вопросах 1 и 4, но метилирование новой цепи ДНК восстанавливает DNMT1, используя метилирование родительской цепи как образец, а восстановление гистоновой метки в этой модели зависит главным образом от обратной связи «белок, узнающий метку, — фермент, ставящий метку»; состояние регуляторного элемента (вопрос 2) определяет, свяжется ли с ним FOXO, уже находящийся в ядре (вопрос 3), и как пойдёт ответ на повторный сигнал (вопрос 4). Три различения повторяются на всех вкладках: контакт не равен активации, вход в ядро не равен связыванию с ДНК и синтезу РНК, метка не равна памяти.", "teacher_2": "Вопрос 1 (метилирование ДНК). Модель описывает один CpG (диаду) в линии делящихся клеток: состояние диады — пара состояний двух цепей, за деление дочерняя диада получает одну старую цепь и новую; в продвинутой сцене между делениями идут окисление 5mC (TET) и удаление 5fC и 5caC (TDG). Из работ взяты: Em около 96 % и Ed около 17 % для метилированного острова FMR1 неактивной X-хромосомы (Laird 2004; лимфоциты человека, шпилечный бисульфит), Ed неметилированных островков около 0,1 % на сайт и поколение (Ushijima 2003), более чем 60-кратное предпочтение DNMT1 к 5mC перед 5hmC (Hashimoto 2012) и направление действия аскорбата (Yin 2013), децитабина (Jüttermann 1994) и SAH (Caudill 2001). Подобраны, а не измерены: скорости окисления и удаления, множители активности препаратов и метилирующего потенциала, Em и Ed повторов, PMD и острова без метки, исходное состояние «молодой» линии PMD. Не рассчитываются: гибель клеток, соседние CpG, нуклеосомы и факторы, отставание метилирования новой цепи в пределах цикла (Charlton 2018), влияние метки на транскрипцию. Исходное состояние стационарно, воздействие начинается с первого деления; для давних нокаутов это допущение. Спорно: масштаб активного пути деметилирования (Globisch 2010; Ito 2011) и значения Em и Ed вне одной системы (Pfeifer 1990; Ginno 2020). Вопрос 2 (энхансер и промотор). Обе сцены используют одну статическую модель: время не рассчитывается, контакт и новосинтезированная РНК — индексы относительно исходного состояния вкладки (энхансер в 100 kb от промотора A, границы нет). Из одной системы (энхансер Sox2 в клетках mESC; Zuin 2022) взяты: примерно десятикратное падение выхода по домену длиной 560 kb, трёхкратное снижение контакта через границу, показатель Хилла 2,8 (доверительный интервал 2,4–3,2) и снижение выхода за одним сайтом CTCF примерно на 60 % при прежнем контакте. Подобраны автором модели: форма убывания контакта с расстоянием, полунасыщение отклика, частоты включения и выключения промотора, барьер дивергентных сайтов (направление — Rao 2014; Guo 2015a), ослабление контактов при потере когезина с расстоянием (направление — Kane 2022; Rinzema 2022), множитель совместимости (Bergman 2022), ступени дозы BET-ингибитора (Crump 2021), доли доступности при CRISPRi (Fulco 2019), уровень контакта при ZF–Ldb1 (Deng 2012) и положения гена B и энхансера E2. Модель не воспроизводит измеренную конкуренцию промоторов (+9 % в Fulco 2016), динамику контактов (Gabriele 2022), конденсаты, особые свойства супер-энхансеров и неоэнхансеры. Спорно: перенос чисел одной пары элементов на другие локусы и степень ослабления контактов при остром удалении RAD21: в опытах Hsieh 2022 за 3 ч контакты в основном сохранялись. Вопрос 3 (FOXO). Модель считает четыре пула FOXO (ядро и цитоплазма × без фосфата и с фосфатом AKT), занятость элемента ДНК и синтез РНК мишени. Из работ взяты направления и порядки величин: активность AKT выходит на новое значение за минуты (Gross 2016); потоки Foxo1 через ядерную оболочку почти уравновешены, а Foxo3A перемещается примерно в 20 раз медленнее (Schachter 2012); фосфорилирование S256 снижает связывание с ДНК (Zhang 2002); без FoxO1 индукция G6pc снижается более чем на 80 %, индукция Pck1 — примерно на 40 % (Cook 2015). Подобраны константы потоков и дефосфорилирования, кратности (удержание 14-3-3, стресс-киназы, AMPK ×1,6, закрытый хроматин ×0,15) и времена выхода занятости и РНК на новое значение (около 20 мин и около 1 ч): кинетики связывания FOXO в клетках в прочитанных работах нет. Эффект LY294002 на связывание с ДНК перенесён с DAF-16 (Cahill 2001) на FOXO1-AAA, а парадоксальный рост pAKT при АТФ-конкурентном ингибиторе (Okuzumi 2009, A-443654) отнесён к ингибитору этого типа. Спорные вопросы в модель не включены: механизм действия 14-3-3 (маскирование сигнала импорта — гипотеза), влияние AMPK на локализацию (Greer 2007a и Luperchio 2025 расходятся), знак действия SIRT1 (Motta 2004 и Daitoku 2004). Не учтены деградация FOXO, киназы ERK, IKK и SGK, партнёры (PGC-1α) и обратные связи через экспрессию. Вопрос 4 (хроматиновая память). Модель описывает один репрессивный домен H3K27me3 (комплекс PRC2) в делящихся клетках: деление вдвое разводит метку (масс-спектрометрия в клетках HeLa: Alabert 2015), а достройку дают медленное зарождение и обратная связь «EED — EZH2» (Margueron 2009). Из работ взяты разведение вдвое и порядок порога: активация многих генов после потери фермента, ставящего метку, требовала не менее трёх делений (Jadhav 2020), что отвечает остатку метки 12,5 % исходной; это оценка авторов из числа делений. Подобраны и названы допущениями скорости зарождения, обратной связи и удаления метки, кооперативность (без неё второго устойчивого состояния нет: Dodd 2007), крутизна выхода промотора, порог «подготовленного» промотора (25 %), размеры доменов (80 и 30 нуклеосом), сила и длительность транскрипционного импульса и режим «без деления». Порог по активности EZH2 (около двух третей нормы) — результат расчёта. Остаток метки при нокауте Ezh2 (около 43,5 %: Jadhav 2020) модель не воспроизводит. Режим «повторный стимул» — каталог опубликованных исходов со шкалой «выше — ниже», а не расчёт. Спорно, зависит ли сохранение родительских нуклеосом при репликации от системы и метки (Petruk 2012; Escobar 2019). Тренированный иммунитет моноцитов модель не объясняет: они не реплицируют ДНК (Saeed 2014).", "teacher_3": "Вопрос 1: поправки к блоку координатора. Не следует утверждать, что метка «разбавляется вдвое за каждый цикл»: так выглядит потеря копирования при отсутствии метилирования de novo, а при неполном копировании доля убывает медленнее. Паттерн метилирования воспроизводится с ошибкой, поскольку копирование неполное (Laird 2004; Pfeifer 1990). 5hmC — не только промежуточный продукт деметилирования: она в основном стабильна (Bachman 2014). Бисульфит не отличает 5mC от 5hmC; их различают oxBS-seq и TAB-seq (Booth 2012; Yu 2012). «Ингибитор DNMT» — не один механизм: децитабин ковалентно захватывает фермент после включения в ДНК (Jüttermann 1994), азацитидин в основном включается в РНК (Aimiuwu 2012), RG108 и GSK-3484862 действуют нековалентно (Brueckner 2005; Azevedo Portilho 2021). Метилирующий потенциал определяет не один SAM (Caudill 2001). Мутации DNMT3B при синдроме ICF1 не дают общей потери метилирования (Hansen 1999; Xu 1999). Терминология и роли белков: термин «полуметилированный», а не «гемиметилированный»; DNMT1 метилирует полуметилированный CpG быстрее неметилированного (Goyal 2006), но не является белком, узнающим метку (ридером); UHRF1 — фактор поддержания метилирования, а не репрессор; метилирование промотора не подавляет экспрессию гена во всех контекстах. Вопрос 2: поправки к блоку координатора. (1) Избирательность не «строгая»: энхансер влиял не более чем на пять генов, ген получал вклад до четырнадцати элементов, а отнесение энхансера к ближайшему гену давало точность 47 % (Fulco 2019). (2) Независимость от расстояния и ориентации справедлива для репортёрных плазмид (Banerji 1981; Moreau 1981); в хромосоме выход убывает с расстоянием (Zuin 2022). (3) Граница домена — вероятностный барьер: слова «стена» и «перескочить» не использовать (Despang 2019; Lupiáñez 2015). (4) Контакт в Hi-C не равен активации: BET-ингибиторы подавляют транскрипцию при прежних контактах (Crump 2021). (5) H3K27ac и H3K4me1 — показатели состояния: в клетках mESC H3K27ac не необходима для активности большинства энхансеров (Zhang 2020), потеря H3K4me1 слабо меняет транскрипцию (Rickels 2017); термин «праймированный» определять (Calo 2013). (6) Ингибиторы BET и CDK7 действуют на общие транскрипционные белки, а не на пару энхансер–промотор: при высокой дозе подавляется транскрипция в целом (Muhar 2018; Winter 2017), эффект THZ1 нельзя целиком приписать CDK7 (Olson 2019). (7) Конденсаты коактиваторов наблюдаются (Sabari 2018), их причинная роль оспаривается (Chong 2018). (8) TAL1 при T-ALL — неоэнхансер, а не нарушение границы (Mansour 2014). (9) «FISH живых клеток» — ошибка: FISH выполняют на фиксированных клетках, динамику видно по меткам локусов (Alexander 2019). Вопрос 3: поправки к блоку координатора. Не следует утверждать: (1) «без инсулина FOXO находится в ядре и активирует гены» — FOXO непрерывно перемещается, доля в ядре задаётся балансом потоков (Schachter 2012); в клетках MCF7 после снижения сыворотки FOXO1 повторно входит в ядро лишь через часы (Lasick 2023); ядро — условие, но не гарантия: нужны связывание с ДНК, партнёры и доступный хроматин (Eijkelenboom 2013b). (2) «14-3-3 обеспечивает экспорт и маскирует сигнал импорта» — экспорт идёт через CRM1, 14-3-3 препятствует возврату в ядро (Brunet 2002; Rena 2001), маскирование — гипотеза. (3) «AMPK и JNK активируют FOXO» без условий: AMPK повышает активность FOXO3 без смены локализации (Greer 2007a), JNK действует на FOXO4 при слабом H2O2 (Essers 2004). (4) Название «FOXO1-3D», участие CDK2, редокс-регуляцию через остатки цистеина и номер S207 для MST1 источники не подтверждают; нумерацию давать с видом (FOXO1 человека T24, S256, S319). (5) Инсулин не выводит из ядра FOXO6 (Jacobs 2003). (6) Роль FOXO в опухолях, заживлении ран и продолжительности жизни зависит от контекста (Hornsveld 2018; Willcox 2008): ассоциация варианта FOXO3A с долголетием механизма не устанавливает. (7) G6PC и PCK1 — пример одной системы (Cook 2015). (8) Результат с одним ингибитором согласуется с участием мишени, но сам по себе не устанавливает её роль. Вопрос 4: чего не следует утверждать. TET окисляют 5-метилцитозин в ДНК и не являются деметилазами гистонов (Tahiliani 2009); метильные группы с H3K27me3 снимают KDM6 (Agger 2007). H3K4me3 — метка, а не «закладка» митоза: функцию закладки показали для фактора GATA1 (Kadauke 2012) и для H3K27ac (Pelham-Webb 2021), а «исключение» факторов из митотических хромосом отчасти объясняется артефактом фиксации (Teves 2016). Петля обратной связи «белок, узнающий метку, — фермент, ставящий метку» показана для PRC2 (Margueron 2009); для других меток её нельзя считать общим правилом. Ингибитор EZH2 прекращает достройку метки, но не снимает её сразу: активность промотора растёт после нескольких делений (Jadhav 2020). Ингибитор или нокаут показывает зависимость от фермента, а не от одной метки: при потере Eed метка ниже, а ответ при толерантности слабее (Boonmee 2024). Тренированные моноциты не делятся (Saeed 2014), поэтому разведение метки к ним не относится; эффекты БЦЖ в клинических исследованиях неоднородны (Prentice 2021; Pittet 2023); «память об ожирении» — предварительные данные на мыши (Hinte 2024). Утверждение «XIST через PRC2 подавляет все гены X» упрощено (Wutz 2000; Bowness 2022), роль конденсатов в памяти — гипотеза (Hnisz 2017). Слово «память» употреблять только с указанием, что сохраняется, в каких клетках и после какого испытания; формулировку «метка включает ген» не использовать.", "info_ref": "Справка · в расчёт не входит", "selfq": "Проверьте себя", "selfa": "Показать ответ", "lg_ref": "пунктирная рамка или кнопка — справка; в расчёт не входит", "rc_l1": "Белки, узнающие 5mC", "rc_l2": "MeCP2, MBD · справка", "rc_aria": "Справка: белки, узнающие 5-метилцитозин (MeCP2, MBD); в расчёт не входит", "gl_m_mbd": "Справка: белки, узнающие 5mC", "gl_e_tad_ex": "Справка: перестройки локуса EPHA4", "gl_f_ac": "Справка: ацетилирование FOXO", "gl_f_deg": "Справка: ядерная доля FOXO и общее количество белка", "gn_m_mbd": "Белки, узнающие 5mC: MeCP2, MBD1, MBD2 и MBD4 связываются с метилированным CpG", "gtag_m_mbd": "Справка к вопросу 1 · модель считает долю 5mC, но не связывание белков с метилированным CpG", "g_m_mbd": "<b>Определение.</b> Метилтрансферазы (DNMT) образуют 5mC в ДНК, а отдельные белки специфически связываются с метилированным CpG. MBD-домен (от англ. methyl-CpG-binding domain) у MeCP2, MBD1, MBD2 и MBD4 связывает метилированный CpG. Белки, связывающие метилированный CpG, могут взаимодействовать с корепрессорными комплексами и размещать их на ДНК. В рассматриваемом примере MeCP2 взаимодействует с комплексами NCoR/SMRT, содержащими HDAC3.\n<b>Что происходит.</b> У MeCP2 два разных участка: MBD связывается с метилированной ДНК, а участок около остатков 269–309 — с корепрессорными комплексами NCoR/SMRT, в которые входит деацетилаза гистонов HDAC3. Рабочая модель: MeCP2 служит мостом между метилированной ДНК и этим комплексом. В фибробластах мыши при экспрессии MeCP2-EGFP слитый белок TBL1-mCherry (TBL1 входит в комплекс NCoR/SMRT) переходил из цитоплазмы в плотно метилированные участки ядра. Вариант MeCP2-R306C-EGFP также находился в этих участках ядра, однако совместной локализации с TBL1-mCherry не наблюдали. В репортёрном опыте в клетках NIH-3T3 репрессию вызывал C-концевой фрагмент MeCP2, и она зависела от деацетилазной активности (трихостатин A её снимал; Lyst 2013).\n<b>Что наблюдали.</b> Миссенс-мутации MECP2 при синдроме Ретта в основном собраны в две области: в MBD (они часто нарушают связывание с метилированной ДНК) и в участке 302–306 (они отменяют связывание с NCoR/SMRT). У мышей с заменой R306C комплекс не связывался с MeCP2 в мозге, и развивались признаки, сходные с синдромом Ретта (Lyst 2013). Эти мутации затрагивают белок, связывающийся с 5mC и с корепрессорным комплексом, а не метилтрансферазы DNMT; поэтому их не следует приравнивать к общей потере метилирования.\n<b>Другие белки с MBD.</b> MBD2 входит в комплекс MeCP1/NuRD, который предпочтительно связывает, перестраивает и деацетилирует метилированные нуклеосомы (Feng 2001; опыты in vitro). MBD3 у млекопитающих метилированную ДНК не связывает ни in vitro, ни in vivo (Hendrich 1998). MBD4 — тимин-ДНК-гликозилаза: она удаляет тимин или урацил из неправильной пары в CpG, а её MBD предпочтительно связывает пару m5CpG·TpG — продукт дезаминирования 5mC; фермент может ограничивать мутации в метилированных CpG (Hendrich 1999; связывание показано in vitro).\n<b>Граница вывода.</b> Результат зависит от участка генома и типа клеток. В области CA1 гиппокампа мышей с делецией Hdac3 в возбуждающих нейронах переднего мозга из 303 генов с изменённой экспрессией у 194 она снижена и у 109 повышена; HDAC3 оказывается через MeCP2 на промоторах активных генов (Nott 2016). Совместное расположение NCoR/SMRT и MeCP2 по всему геному методом ChIP подтвердить не удалось: HDAC3 в мозге примерно в 300 раз менее обилен, чем MeCP2, а формальдегидная фиксация разрушала их связь (Lyst 2013). Эти данные не позволяют считать наличие 5mC достаточным признаком снижения транскрипции.\n<b>Связь с моделью.</b> Расчёт идёт по состояниям метки на цепях ДНК (в базовой сцене — доли диад MM, MU и UU); связывание белков с 5mC и размещение корепрессоров на ДНК в ней не рассчитывается, поэтому по изменению доли 5mC механизм репрессии вывести нельзя.", "gq_m_mbd": "Названы три белка: DNMT1, MeCP2 и HDAC3. Какой из них метилирует новую цепь, какой связывается с 5mC и какой входит в корепрессорный комплекс, с которым MeCP2 взаимодействует на метилированной ДНК?", "ga_m_mbd": "DNMT1 метилирует цитозин новой цепи напротив 5mC старой цепи; MeCP2 связывается с метилированной ДНК и взаимодействует с комплексом корепрессоров NCoR/SMRT; HDAC3 — деацетилаза в составе этого комплекса. Мутации, нарушающие функцию MeCP2, ослабляют его связывание с метилированной ДНК или с NCoR/SMRT. В расчёте сцены MeCP2 не участвует, поэтому доли метилированных диад от него не зависят.", "gn_f_ac": "Ацетилирование FOXO и деацетилаза SIRT1", "gtag_f_ac": "Справка к вопросу 3 · в расчёт не входит: знак эффекта зависит от мишени и системы", "g_f_ac": "<b>Определение.</b> Ацетилирование FOXO — присоединение ацетильной группы к остаткам лизина белка. С FOXO взаимодействуют ацетилтрансферазы p300/CBP, PCAF и KAT5 (Tip60) и деацетилазы SIRT1, SIRT2, SIRT3 и HDAC3; по данным обзора, эти ферменты меняют и ацетилирование лизинов в ДНК-связывающей области FOXO, что, как сообщают, изменяет сродство к ДНК и может влиять на выбор мишеней (Rodriguez-Colman 2024). Для Foxo1 ацетилирование лизинов K242, K245 и K262 ацетилтрансферазой CBP ослабляло связывание с ДНК (Matsuzaki 2005).\n<b>Что происходит.</b> SIRT1 — NAD⁺-зависимая деацетилаза; снижение содержания NAD⁺ снижает её активность (Rodriguez-Colman 2024). В клетках млекопитающих SIRT1 образует комплекс с FOXO3 при окислительном стрессе и деацетилирует его (Brunet 2004). В клетках млекопитающих для Foxo1 показано, что CBP ацетилирует, а Sir2 (так белок назван в статье) деацетилирует те же остатки лизина (Daitoku 2004).\n<b>Что наблюдали.</b> В опытах Brunet 2004 SIRT1 усиливал способность FOXO3 вызывать остановку клеточного цикла и устойчивость к окислительному стрессу, но подавлял способность FOXO3 вызывать гибель клеток. В опытах Motta 2004 SIRT1 подавлял активность FOXO3 и других форкхед-факторов и снижал форкхед-зависимый апоптоз. В опытах Daitoku 2004 деацетилазная активность Sir2 повышала экспрессию генов MnSOD (SOD2) и p27Kip1.\n<b>Граница вывода.</b> Утверждения «SIRT1 активирует FOXO» и «SIRT1 подавляет FOXO» эти данные не подтверждают как общее правило: знак эффекта может зависеть от мишени, формы FOXO, клеток и воздействия: эти работы различаются сразу по нескольким признакам, и вклад каждого из них они не разделяют. Результат описывают для названной мишени и показателя (остановка цикла, гибель клеток, РНК мишени). В сцене ацетилирование не рассчитывается: «занятость мишени» и «новая РНК» следуют из ядерной доли и фосфорилирования AKT (в продвинутой сцене — ещё из состояния хроматина мишени, варианта FOXO, AMPK и стресс-киназ), а воздействие SIRT1 в них не вводится.", "gq_f_ac": "В клетках без SIRT1 ацетилирование FOXO3 выросло. Можно ли по этому одному результату предсказать, повысится или снизится синтез РНК мишени p27Kip1?", "ga_f_ac": "Нет. В разных работах SIRT1 (в работе Daitoku 2004 — Sir2) усиливал одни ответы (остановку цикла у FOXO3; экспрессию p27Kip1 и SOD2 у Foxo1) и ослаблял другие (гибель клеток; в опытах Motta 2004 — активность форкхед-факторов); зависимость ответа от деацетилазной активности показана для Foxo1 (Daitoku 2004). Эти данные получены для разных белков FOXO и в разных клетках, поэтому РНК названной мишени нужно измерить в этой же системе; без такого измерения данных для предсказания недостаточно.", "gn_f_deg": "Ядерная доля FOXO и общее количество белка", "gtag_f_deg": "Справка к вопросу 3 · в расчёт не входит: в модели общее количество FOXO постоянно", "g_f_deg": "<b>Условие.</b> В сцене общее количество FOXO постоянно, а меняется его распределение: ядро и цитоплазма, форма, фосфорилированная по сайтам AKT, и нефосфорилированная форма. Отношение ядерного и цитоплазматического FOXO не показывает, сохранилось ли общее количество белка.\n<b>Что происходит.</b> В клетках HepG2 инсулин через путь PI3K — PKB (AKT) вызывал фосфорилирование FOXO1 (FKHR), его убиквитинирование и разрушение в протеасоме: ингибиторы протеасомы останавливали снижение содержания эндогенного FOXO1, а мутация сайтов, которые фосфорилирует PKB, подавляла убиквитинирование (Matsuzaki 2003).\n<b>Что наблюдали.</b> Эффективное убиквитинирование требовало и фосфорилирования, и удержания FOXO1 в цитоплазме (Matsuzaki 2003). Эти данные согласуются с такой последовательностью: фосфорилирование FOXO1 киназой AKT (PKB) и удержание белка в цитоплазме, затем убиквитинирование и разрушение в протеасоме. Порядок выведен из того, что для убиквитинирования нужны оба условия, а не из измерения во времени. Поэтому в опыте с продолжительным действием инсулина локализацию FOXO1 (иммунофлуоресценция или фракционирование) и общее содержание белка (иммуноблот целого лизата с контролем нагрузки, с ингибитором протеасомы и без него) измеряют отдельно: снижение ядерного сигнала может отражать и выход из ядра, и разрушение.\n<b>Граница вывода.</b> Результат получен для FOXO1 в клетках HepG2; считать этот результат обязательным ответом всех FOXO во всех тканях нельзя. Модель описывает перераспределение и фосфорилирование, а не этот поздний этап регуляции; постоянное общее количество FOXO — допущение модели, а не измерение.", "gq_f_deg": "В клетках HepG2 после инсулина ядерный сигнал FOXO1 в иммунофлуоресценции снизился. Какое дополнительное измерение отличит выход белка из ядра от его разрушения?", "ga_f_deg": "Общее содержание FOXO1 в целом лизате (иммуноблот с контролем нагрузки): при выходе из ядра оно сохраняется, при разрушении снижается. Если ингибитор протеасомы предотвращает снижение, вклад вносит протеасомное разрушение.", "gn_e_tad_ex": "Перестройки локуса EPHA4: какой контакт изменился", "gtag_e_tad_ex": "Справка к вопросу 2 · опубликованный пример; в расчёт вкладки не входит", "g_e_tad_ex": "<b>Условие.</b> В зачатке конечности мыши (E11.5) кластер энхансеров около 30 kb в центромерной части домена Epha4 контактирует с промотором Epha4 через область без генов, а с генами Pax3, Wnt6 и Ihh, лежащими за границами этого домена, почти не контактирует (4C-seq). Каждая граница домена содержит несколько пиков CTCF.\n<b>Что происходит.</b> Три перестройки меняют положение границы относительно кластера энхансеров, и к нему приближается другой ген (схема). Делеция DelB убирает границу между доменами Epha4 и Pax3, и энхансеры контактируют с Pax3. Инверсия InvF, воспроизводящая перестройку при синдроме F, помещает кластер рядом с WNT6. Делеция doublefoot (Dbf) у мыши и дупликация около 900 kb у человека (перестройки разного типа с одинаковым результатом) приближают к кластеру IHH. В каждом случае 4C-seq показал новый контакт гена с доменом Epha4 и с самим кластером энхансеров.\n<b>Что наблюдали.</b> В зачатке конечности повышалась экспрессия именно того гена, который оказался рядом с кластером, причём в области будущей кисти, где в норме экспрессируется Epha4: Pax3 у DelB/+, Wnt6 у InvF/InvF и Ihh у Dbf/+ (РНК-секвенирование и гибридизация in situ). Новые контакты не выходили за соседние границы: Ihh и Wnt6 не контактировали с доменом Pax3, и наоборот. В семьях с синдромом F экзомное секвенирование генов интервала сцепления 2q36 не выявило потенциально патогенных изменений, поэтому причину искали секвенированием генома и нашли некодирующую перестройку (инверсию около 1,1 Mb).\n<b>Граница вывода.</b> Делеции сопоставимого размера, которые оставляли целой область границы (DelBS и DbfS), давали контакт гена с доменом Epha4, сниженный по сравнению с DelB и Dbf почти до уровня дикого типа; эктопической экспрессии они не вызывали, и конечности оставались нормальными. Разница размеров делеций (100 kb для Dbf и DbfS, 200 kb для DelB и DelBS) по оценке авторов вряд ли объясняет это различие, хотя вклад расстояния исключить нельзя; по мнению авторов, существенно присутствие границы (Lupiáñez 2015). В других локусах удаление границы или всех основных сайтов CTCF заметно не меняло экспрессию (Sox9–Kcnj2: Despang 2019; Shh: Williamson 2019; в последнем случае только более крупная делеция одной границы дала эктопическое влияние энхансера на соседний ген Mnx1), поэтому удаление границы не гарантирует эффекта. Как эктопическая экспрессия PAX3 меняет скелет, авторы считали невыясненным, для WNT6 и IHH они предложили правдоподобное объяснение; новорождённые мыши InvF (получены агрегацией тетраплоидных эмбрионов) вскоре погибали по неустановленной причине и без явного порока конечностей. Схема показывает опубликованные перестройки и не предназначена для оценки конкретного пациента.", "gt_enh": "энх.", "gt_r0": "Норма: энхансеры в домене EPHA4 контактируют с EPHA4", "gt_r1": "DelB (брахидактилия): граница удалена — контакт с PAX3", "gt_r2": "InvF (инверсия, как при синдроме F): кластер на стороне WNT6", "gt_r3": "Dbf (полидактилия): граница удалена — контакт с IHH", "gt_r4": "DelBS: делеция вне границы — нового контакта почти нет", "gt_leg_enh": "кластер энхансеров домена EPHA4", "gt_leg_bnd": "граница домена (пики CTCF)", "gt_leg_brk": "удалённый участок", "gt_leg_norm": "контакт в норме", "gt_leg_new": "новый контакт", "gt_leg_none": "нового контакта почти нет", "gfa_e_tad_ex": "Схема: нормальный локус Epha4 мыши и четыре варианта: DelB, InvF, Dbf и DelBS (граница сохранена); показано, какой ген приближается к кластеру энхансеров Epha4 и возникает ли новый контакт", "gfc_e_tad_ex": "Схема не в масштабе: показаны только гены, значимые для примера, и упрощённый порядок элементов (по Lupiáñez 2015, рис. 1, 3 и 6). DbfS — аналогичный контроль для IHH.", "gq_e_tad_ex": "Две делеции сходного размера в локусе EPHA4: одна удаляет границу домена, другая оставляет её. В каком случае ожидают эктопическую экспрессию соседнего гена и на чём основан этот вывод?", "ga_e_tad_ex": "При удалённой границе (DelB, Dbf): энхансеры контактируют с соседним геном (Pax3, Ihh), и этот ген эктопически экспрессируется в зачатке конечности; при сохранённой границе (DelBS, DbfS) контакт почти не повышался и эктопической экспрессии не было. Вывод основан на сравнении делеций сходного размера с границей и без неё; авторы не исключают вклад расстояния (4C-seq и гибридизация in situ; Lupiáñez 2015). В других локусах (Sox9–Kcnj2, Shh) удаление границы или сайтов CTCF заметно не меняло экспрессию (у Williamson 2019 исключение — одна более крупная делеция границы, давшая эктопическое влияние энхансера на соседний ген), поэтому для нового локуса это проверяют опытом.", "src_001": "Agger K. et al. UTX and JMJD3 are histone H3K27 demethylases involved in HOX gene regulation and development. Natu function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function defs(s){ return `<defs>
  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }
function move(id, dx, dy){ const e = $(id); if (e) e.style.transform = `translate(${dx}px,${dy}px)`; }
function PB(id, x, y){ return `<g class="pb fade" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="8.5"/><text x="${x}" y="${y + .5}">P</text></g>`; }

function sliderHTML(id, k, val){ return `<div class="slider"><div class="row"><label for="${id}">${t(k)}</label><output id="${id}O">${val} %</output></div><input type="range" id="${id}" min="0" max="100" value="${val}"></div>`; }
function toggleHTML(id, k, on){ return `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span>${t(k)}</span></label>`; }
function segHTML(id, k, opts, val){ return `<div class="grp"><span>${t(k)}</span><div class="seg" id="${id}">` +

function segVal(id){ const b = $(id).querySelector('[aria-pressed="true"]'); return b ? b.dataset.v : null; }

function wire(ids, fn){ ids.forEach(id => { const e = $(id); if (!e) return;
  if (e.classList.contains('seg')) e.querySelectorAll('button').forEach(b => b.onclick = () => { segSet(id, b.dataset.v); fn(); });
  else e.addEventListener(e.type === 'checkbox' ? 'change' : 'input', fn); }); }
const SLIDER_FMT = {};   /* id ползунка -> функция подписи значения (по умолчанию «n %») */

function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(o.yfmt ? o.yfmt(v) : fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on-line'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* справка в два уровня: первое предложение (короткое определение) видно сразу, остальное — по раскрытию (аудит R10).
   Граница — конец предложения не раньше 50-го знака; инициалы вида «S. cerevisiae», «т. е.» и т. п. границей не считаются. */

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {}, cmp: '' };

const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;

function readMetrics(K){
  const out = {};
  document.querySelectorAll('#reads' + K + ' .mm').forEach(e => { if (e.closest('[hidden]')) return; const s = e.querySelector('small'), v = e.querySelector('.v'); if (s && v) out[s.textContent] = v.textContent; });
  const S = SCENES[K]; if (S && S.vals) for (const k in S.vals) out[t(k)] = S.vals[k];
  return out;
}
/* три показателя шага: список ключей подписей в шаге (st.m); без списка — три величины с наибольшим изменением */
function poeCompare(st, before, ref, after){
  const na = v => v == null || v === '' ? '—' : v;
  /* сравнение двух линий (а не «до → после»): строки — показатели, столбцы — линии (аудит v1.2, N5) */
  if (st.pairs){
    const rows = st.pairs.filter(([, a, b]) => t(a) in after && t(b) in after);
    if (!rows.length) return '';
    return `<div class="cmp cmp2" role="group" aria-label="${t('poe_m_lines')}"><div class="cmp-h"><span>${t('poe_m_lines')}</span><span>${t('poe_m_l1')}</span><span>${t('poe_m_l2')}</span></div>` +
      rows.map(([lab, a, b]) => `<div class="cmp-r"><span class="cmp-n">${t(lab)}</span><span class="mono cmp-now">${after[t(a)]}</span><span class="mono cmp-now">${after[t(b)]}</span></div>`).join('') + `</div>`;
  }
  let keys = st.m ? st.m.map(k => t(k)) : Object.keys(after).sort((a, b) => Math.abs(Math.log((numOf(after[b]) + 1e-3) / (numOf(before[b]) + 1e-3))) - Math.abs(Math.log((numOf(after[a]) + 1e-3) / (numOf(before[a]) + 1e-3)))).slice(0, 3);
  keys = keys.filter(k => k in after);
  if (!keys.length) return '';
  const arrow = (a, b) => { const x = numOf(a), y = numOf(b); if (!isFinite(x) || !isFinite(y)) return ''; const d = y - x, rel = Math.abs(d) / Math.max(Math.abs(x), Math.abs(y), .02); return rel < .04 ? '≈' : (d > 0 ? '↑' : '↓'); };
  const cells = keys.map(k => [k, na(before[k]), na(after[k]), na(ref[k])]);
  const dash = cells.some(c => c.slice(1).includes('—'));
  return `<div class="cmp" role="group" aria-label="${t('poe_m_t')}"><div class="cmp-h"><span>${t('poe_m_t')}</span><span>${t(st.hB || 'poe_m_before')}</span><span></span><span>${t(st.hA || 'poe_m_after')}</span><span>${t(st.ctlH || 'poe_m_ref')}</span></div>` +
    cells.map(([k, b, a, r]) => `<div class="cmp-r"><span class="cmp-n">${k}</span><span class="mono">${b}</span><span class="cmp-a">${arrow(b, a)}</span><span class="mono cmp-now">${a}</span><span class="mono cmp-ref">${r}</span></div>`).join('') +
    `<p class="cmp-note">${st.ctlH ? '' : t('poe_m_ref_note')}${dash ? ' ' + t('poe_m_na') : ''}</p></div>`;

    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;

  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); const nb = box.querySelector('.opt[data-j="' + b.dataset.j + '"]'); if (nb) try { nb.focus({ preventScroll: true }); } catch (e) {} });

function poeSetup(){ const st = SCENES[cur].poe[POE.i]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

let cur = '1b', qn = 1, lvl = 'b';
function show(){

  document.querySelectorAll('#tabs .tab').forEach(b => { const on = +b.dataset.q === qn; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lvl)));
  $('qline').textContent = t('q' + qn);
  POE.on = false; poeRender();
  $('poeBtn').hidden = !SCENES[cur].poe.length;   /* у заглушки нет сценария */
  SCENES[cur].update();

}
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;
  const top = sc.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--avail', Math.max(340, Math.floor(window.innerHeight - top - 10)) + 'px');
}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { qn = +b.dataset.q; show(); });
  $('tabs').addEventListener('keydown', e => { const k = e.key, m = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };

    if (STUDENT && POE.on) return;
    e.preventDefault(); qn = k === 'Home' ? 1 : k === 'End' ? 4 : ((qn - 1 + m[k] + 4) % 4) + 1; show();
    const b = document.querySelector('#tabs .tab[data-q="' + qn + '"]'); if (b) try { b.focus(); } catch (er) {} });
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => { lvl = b.dataset.l; show(); });
  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); poeSetup(); };
  $('capT').onchange = () => { document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !$('capT').checked); if (POE.on) poeRender(); };
  $('legendBtn').onclick = () => { try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };
  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ qn = +e.key; show(); }
    if (e.key === 'b' || e.key === 'и'){ lvl = lvl === 'b' ? 'a' : 'b'; show(); } });

  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));

/* =====================================================================
   Семинар 10. Общие средства для четырёх вопросов (не модель: модель каждого вопроса — в его файле sK.js).
   - GFORM, LEGEND_EXTRA: справочные формулы и дополнительные строки легенды (заполняют сцены);
   - числа и подписи: NB, fPct, fX, fRel, fH;
   - значки на схеме: BADGE (OH, Ub и др.);
   - время: rk4, integrate, Traj (траектория считается при любом изменении входов), clockHTML/clockWire;
   - мелкая арифметика: sig, lerp.
   Правила: 1) состояние на курсоре времени берётся из траектории, а не из «живых» тиков; 2) шаг сценария ставит курсор
   в заданный момент, поэтому разбор не зависит от скорости воспроизведения; 3) подписи величин — из реестра показателей.
   ===================================================================== */
const GFORM = {};            /* справка: ключ карточки -> список ключей структурных формул (formulas.js) */
const LEGEND_EXTRA = [];     /* дополнительные строки легенды: { svg: '<circle .../>', key: 'lg_...' } */
const NB = ' ';         /* неразрывный пробел */
const sig = x => 1 / (1 + Math.exp(-x));
const lerp = (a, b, u) => a + (b - a) * u;

/* ---------- подписи чисел ---------- */
const fPct = x => Math.round(x * 100) + NB + '%';                        /* доля: 0,37 -> «37 %» */
const fX = x => '×' + (x >= 10 ? Math.round(x) : x >= 1 ? fmt(x, 1) : fmt(x, 2));  /* кратность: «×3,2», «×0,35» */
const fRel = (x) => fX(x);                                                /* «относительно исходного» */
const fH = h => h < 1 ? Math.round(h * 60) + NB + 'мин' : (Math.abs(h - Math.round(h)) < .05 ? Math.round(h) : fmt(h, 1)) + NB + 'ч';

/* ---------- значок на схеме: P — фосфорилирование (PB из core.js); OH — гидроксилирование; Ub — убиквитин; X — прочая модификация ---------- */
function BADGE(id, x, y, txt, cls = ''){
  return `<g class="pb fade ${cls}" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="${txt.length > 1 ? 10 : 8.5}"/><text x="${x}" y="${y + .5}">${txt}</text></g>`;
}

/* ---------- полоса показания: имя, значение, метка эталона (серая риска), текст справа. Разметку читает readMetrics (core.js): small = имя, .v = значение ---------- */
const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
/* логарифмическая шкала для кратного роста: x (в разах от исходного) -> 0..1 на промежутке [1/lo, hi] */
const logScale = (x, lo, hi) => clamp((Math.log(Math.max(x, 1e-6)) - Math.log(1 / lo)) / (Math.log(hi) - Math.log(1 / lo)));

/* ---------- интегрирование ---------- */
/* f(t, y) -> dy (массив); y0 — массив; возвращает следующее y */
function rk4(f, t, y, dt){
  const n = y.length, add = (a, b, s) => a.map((v, i) => v + b[i] * s);
  const k1 = f(t, y), k2 = f(t + dt / 2, add(y, k1, dt / 2)), k3 = f(t + dt / 2, add(y, k2, dt / 2)), k4 = f(t + dt, add(y, k3, dt));
  const out = new Array(n); for (let i = 0; i < n; i++) out[i] = y[i] + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
  return out;
}
/* Траектория: y(t) на сетке 0..tEnd с шагом dt; at(t) — линейная интерполяция. Вход f зависит от t (события: добавление, отмывка).
   Состояния клипуются снизу нулём (концентрации не отрицательны). */
class Traj {
  constructor(f, y0, tEnd, dt = .05, sub = 1){
    this.dt = dt; this.tEnd = tEnd; this.ys = [y0.slice()]; let y = y0.slice();
    const n = Math.round(tEnd / dt), h = dt / sub;
    for (let i = 0; i < n; i++){ for (let s = 0; s < sub; s++) y = rk4(f, i * dt + s * h, y, h).map(v => Math.max(0, v)); this.ys.push(y.slice()); }
  }
  at(t){
    const u = clamp(t / this.dt, 0, this.ys.length - 1), i = Math.floor(u), j = Math.min(i + 1, this.ys.length - 1), w = u - i;
    return this.ys[i].map((v, k) => v + (this.ys[j][k] - v) * w);
  }
  series(k){ return this.ys.map((y, i) => [i * this.dt, y[k]]); }
}

/* ---------- часы: движок времени и воспроизведение ---------- */
/* Использование в сцене:  ctrl += clockHTML(P, tMax); … clock = clockWire(P, tMax, speed, onT);  S.tick = dt => clock.tick(dt);
   clock.t — часы от начала опыта; clock.set(t) — поставить курсор (например, в шаге сценария). */
function clockHTML(P, tMax){
  return `<div class="slider clock"><div class="row"><label for="${P}t">${t('clk_t')}</label><output id="${P}tO">0</output></div>` +
    `<input type="range" id="${P}t" min="0" max="${Math.round(tMax * 20)}" value="0"><div class="btns"><button class="btn ghost" id="${P}play" type="button">${t('clk_play')}</button></div></div>`;
}
function clockWire(P, tMax, speed, onT){
  const c = { t: 0, playing: false, set(v){ c.t = clamp(v, 0, tMax); $(P + 't').value = Math.round(c.t * 20); $(P + 'tO').textContent = fH(c.t); onT(c.t); },
              tick(dt){ if (!c.playing) return; const n = c.t + dt * speed; if (n >= tMax){ c.set(tMax); c.stop(); } else c.set(n); },
              stop(){ c.playing = false; $(P + 'play').textContent = t('clk_play'); } };
  $(P + 't').addEventListener('input', () => { c.stop(); c.set(+$(P + 't').value / 20); });
  $(P + 'play').addEventListener('click', () => { if (c.playing){ c.stop(); return; } if (c.t >= tMax) c.set(0); c.playing = true; $(P + 'play').textContent = t('clk_pause'); });
  $(P + 'tO').textContent = fH(0);
  return c;
}

/* =====================================================================

   Модуль B (повторный стимул) — КАЧЕСТВЕННЫЙ каталог опубликованных исходов: порядковая шкала, число не рассчитывается и не подгоняется.

  /* n — нормированные входы (M3.norm); v — показания; sg — уровень сигнала 0..1 и подпись; inhKey3b — подпись ингибитора базового уровня */

      Object.assign(stepD({ n: 2, kind: 'ezh2', b: 1, th: 'normal' }, { n: 2, kind: 'ezh2', b: 1, th: 'primed' }, { n: 2, th: 'primed' }, 's4a_ctl_n'), { ok: 0 }),
      Object.assign(stepD({ n: 6, pu: 2 }, { n: 6, pu: 2, dv: false }, { n: 6, dv: false }, 's4a_ctl_nd'), { ok: 2 }),
      Object.assign(stepD({ n: 8, kind: 'ezh2', b: .2 }, { n: 8, kind: 'ezh2', b: .2, N: 30 }, { n: 8, N: 30 }, 's4a_ctl_n'), { ok: 1 }),
      stepB(0, { exp: 'e3', smp: 'both' }, { exp: 'e4', smp: 'both' }, { exp: 'e4', smp: 'second' }),
      { n: 3, ok: 1, pre(){ setS({ mode: 'm', rev: false }); }, apply(){ setS({ mode: 'm', rev: true }); }, ctl(){ }, m: [], when: 's4a_whenM' }
    ] };
    update();
  })();
})();

/* Заглушки для сцен, которые ещё не построены (вопрос в работе): без подписи, вывода и показаний. Выполняется после s1…s4. */
['1b','1a','2b','2a','3b','3a','4b','4a'].forEach(k => {
  if (SCENES[k]) return;
  const sec = layout(k); sec.classList.add('wip');
  $('cap' + k).textContent = t('ph_wip', { n: k[0] });
  SCENES[k] = { update(){}, poe: [] };
});

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* дополнительные строки легенды: их добавляют сцены (LEGEND_EXTRA в stress.js) */
LEGEND_EXTRA.forEach(it => { const lg = document.getElementById('lgBox'); if (lg) lg.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 64 30">${it.svg}</svg><span>${t(it.key)}</span>`); });
/* v2.0 (аудит, A02): объект схемы с нулевой прозрачностью не остаётся в клавиатурном маршруте и в дереве доступности;
   при показе возвращается с прежним tabindex. Следим за изменениями opacity/style/tabindex на каждой схеме; обработчик выполняется до следующего нажатия клавиши. */
document.querySelectorAll('.stage svg').forEach(svg => {
  const eff = e => { let o = 1; for (let n = e; n && n !== svg.parentNode; n = n.parentNode){ if (n.nodeType !== 1) break; const v = n.style.opacity !== '' ? n.style.opacity : n.getAttribute('opacity'); if (v !== null && v !== '') o *= parseFloat(v); } return o; };
  const sync = () => {
    svg.querySelectorAll('[tabindex]').forEach(e => {
      if (eff(e) < .05){
        if (e.getAttribute('tabindex') !== '-1'){ e.dataset.ti = e.getAttribute('tabindex'); e.setAttribute('tabindex', '-1'); }
        e.setAttribute('aria-hidden', 'true'); e.dataset.fh = '1';
      } else if (e.dataset.fh){
        delete e.dataset.fh; e.removeAttribute('aria-hidden');
        if (e.dataset.ti){ if (e.getAttribute('tabindex') === '-1') e.setAttribute('tabindex', e.dataset.ti); delete e.dataset.ti; }
      }
    });
    obs.takeRecords();
  };
  const obs = new MutationObserver(sync);
  obs.observe(svg, { subtree: true, attributes: true, attributeFilter: ['opacity', 'style', 'tabindex'] });
  sync();
});
initNav(); show();
