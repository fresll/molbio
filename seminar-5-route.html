определяют распознавание и эффект.","Ни одна из этих меток не является обязательным сигналом полного удаления нуклеосом."]},"sources":["hp1","reader-phd","brd4","wdr5"],"program":["5.3","слайды 9, 12"]},{"id":"other-ptm","section":2,"title":"Фосфорилирование, убиквитинирование и SUMO","lead":"Функциональный результат зависит от конкретного остатка и процесса, в котором появилась модификация.","paragraphs":["Фосфорилирование серина, треонина или тирозина меняет заряд и белковые взаимодействия. H3S10ph участвует в разных контекстах, включая митоз и сигнальную регуляцию транскрипции. Поэтому его обнаружение нельзя автоматически трактовать только как активацию гена.","При ответе на двунитевой разрыв уже присутствующий H2A.X может фосфорилироваться по Ser139, образуя γH2AX. MDC1 распознаёт этот сигнал и участвует в организации ответа. γH2AX распространяется по хроматину вокруг повреждения: фокус не задаёт точную нуклеотидную координату каждого разрыва, а сигнал может встречаться и в других стрессовых условиях.","Убиквитинирование присоединяет небольшой белок убиквитин. H2AK119ub связан с Polycomb-регуляцией; H2BK120ub у человека участвует в регуляции транскрипции и взаимодействует с путями метилирования. Другие сайты убиквитинирования действуют в ответе на повреждение. SUMOилирование также создаёт поверхности для белковых контактов и в ряде контекстов связано с репрессией. Кротонилирование и другие ацильные модификации расширяют набор состояний, но их нельзя сводить к одной шкале «открыто — закрыто».","В пути H3S10ph участвуют, в зависимости от процесса, Aurora B или MSK1/2; фосфатазы, включая PP1, могут удалять фосфат. ATM, ATR и DNA-PK участвуют в фосфорилировании H2A.X в разных условиях ответа на повреждение. PRC1 содержит активность установки H2AK119ub, а RNF20/RNF40 устанавливают H2BK120ub. Деубиквитиназы, в том числе определённые USP-белки, удаляют убиквитин. Гистоны могут подвергаться также ADP-рибозилированию, лактилированию, сукцинилированию и цитруллинированию; их функция требует уточнения остатка и контекста, а не общего ярлыка «новая активирующая метка»."],"mechanism":["Уточните модифицированный остаток.","Определите распознающий белок и контекст.","Разделите маркер процесса и его непосредственный механизм."],"trap":"H2A.X — вариант гистона; γH2AX — модифицированное состояние этого варианта. Это не два независимых типа частиц.","widget":"damage","quiz":{"question":"Вокруг повреждения вырос сигнал γH2AX. Какое событие непосредственно создаёт этот сигнал?","options":["Фосфорилирование Ser139 уже присутствующего H2A.X.","Ацетилирование H3K27.","Встраивание совершенно нового варианта γH2AX с изменённой последовательностью."],"correct":0,"feedback":["Верно. После этого возникают контакты с участниками ответа, включая MDC1.","Это другая модификация и другой субстрат.","γH2AX обозначает фосфорилированный H2A.X, а не новую аминокислотную последовательность."]},"sources":["damage"],"program":["5.3","слайд 13"]},{"id":"context","section":2,"title":"Дифференцировка, память и метаболизм","lead":"Свойства хроматина связывают сигнальные и метаболические процессы с изменением экспрессии генов.","paragraphs":["При дифференцировке доступные регуляторные участки, ремоделирующие комплексы и модификации поддерживают разные программы экспрессии. Это состояние может воспроизводиться через сочетание факторов, обратных связей и восстановления модификаций после репликации. Ни одна метка сама по себе не объясняет всю клеточную идентичность.","В нейронах изменение экспрессии отдельных генов участвует в пластичности и долговременном закреплении памяти. В животных моделях вмешательства в CBP-зависимое ацетилирование и пути метилирования меняют определённые формы пластичности и обучения. EHMT1/2 устанавливают H3K9me1/2; KMT2A участвует в H3K4-метилировании. Их роль нельзя описать как простое подавление или усиление всех нейронных генов. Гистоновая модификация не является самостоятельным универсальным хранилищем воспоминания.","Доступность ацетил-КоА и SAM — доноров ацетильной и метильной групп — может влиять на скорость соответствующих реакций. NAD⁺ нужен сиртуинам; α-кетоглутарат, кислород и Fe²⁺ — JmjC-деметилазам. Метаболиты, включая 2-гидроксиглутарат, могут вмешиваться в некоторые ферментативные пути. Однако изменение концентрации метаболита не определяет единственный результат для всех локусов: важны фермент, его привлечение и клеточный контекст.","Сигнальные пути, включая AMPK, mTOR и стрессовые киназы, могут влиять на метаболизм, ферменты и состав комплексов. Гипоксия способна ограничивать кислород-зависимые реакции и менять экспрессию их участников; воспаление изменяет сигналы и регуляторные программы. Направление эффекта на выбранную метку нужно измерять. Метилирование ДНК является отдельным механизмом: DNMT3A/3B участвуют в установке метилирования, а DNMT1 — в его поддержании после репликации. Оно может влиять на связывание факторов и белков, распознающих метилированную ДНК, но метилированная ДНК и метилированный гистон — разные субстраты."],"mechanism":["Сигнал изменяет факторы и ферментативные реакции.","Меняются свойства определённых регуляторных участков.","Изменение экспрессии вносит вклад в клеточный фенотип."],"trap":"Из связи метаболита с реакцией не следует, что определённая диета предсказуемо программирует экспрессию всех генов человека.","widget":"cofactors","quiz":{"question":"При неизменной концентрации KDM6 снизилась доступность α-кетоглутарата. Какую величину нужно проверить отдельно?","options":["Только содержание белка: оно полностью определяет скорость реакции.","Активность деметилирования при данных условиях, отдельно от содержания фермента.","Ничего: концентрация любого кофактора не влияет на ферменты."],"correct":1,"feedback":["Содержание фермента и его активность различаются.","Верно. Дополнительно учитывают кислород, железо, конкурирующие метаболиты и локализацию.","Косубстрат может влиять на скорость, но величина эффекта требует проверки."]},"sources":["memory","memory-methyl","metabolism","akg","kmt-memory","ehmt-memory"],"program":["5.3","слайды 11–12, 18"]},{"id":"ptm-methods","section":2,"title":"Как проверить роль модификации","lead":"Изменение метки, связывания белка и образования РНК нужно измерять раздельно.","paragraphs":["Масс-спектрометрия позволяет определить модификации и их доли в исследованном пуле гистонов, но обычно не сообщает геномный адрес каждой молекулы. ChIP-seq, CUT&RUN и родственные подходы определяют обогащение выбранного эпитопа по геному; результат зависит от специфичности антител, доступности эпитопа и нормализации. При глобальном изменении меток полезны внешние стандарты и контроль общего H3.","Для причинной проверки изменяют фермент установки, фермент удаления или распознающий белок и проверяют прямую мишень. Ингибитор BET-бромодоменов, например JQ1, не является прямой деацетилазой. Ингибиторы HDAC, метилтрансфераз или деметилаз имеют собственную селективность; GSK-J4 нельзя считать абсолютно специфическим выключателем одного фермента. Снижение РНК после препарата может включать вторичные эффекты.","Временной ряд помогает установить последовательность: прямой эффект на мишень → изменение метки или связывания → изменение новой РНК → изменение общего содержания РНК. Содержание зрелой РНК зависит и от образования, и от распада. Генетическое вмешательство, независимый реагент, восстановление функции и контроль жизнеспособности усиливают вывод о механизме.","В качестве механистических примеров используют вориностат/SAHA (HDAC классов I и II) и ромидепсин (преимущественно HDAC класса I) для ингибирования деацетилаз, таземетостат/EPZ-6438 для EZH2, JQ1 для BET-бромодоменов и GSK-J4 для деметилазных путей с ограниченной селективностью. Азацитидин и децитабин — аналоги цитидина: встроившись в ДНК, они ковалентно захватывают DNMT, и метилирование ДНК теряется при следующих репликациях; азацитидин встраивается в основном в РНК. Выбор вмешательства требует проверки его прямого действия. Молекулярная мишень не определяет клиническую эффективность и безопасность: в марте 2026 г. производитель отозвал таземетостат (Tazverik) со всех рынков из-за повышенной частоты вторых злокачественных опухолей в подтверждающем испытании SYMPHONY-1, а 22 июня 2026 г. FDA отменило одобрение препарата. Здесь он остаётся только примером ингибитора EZH2.","FRAP измеряет восстановление флуоресценции после выцветания: оно зависит от движения и обмена наблюдаемого белка и не является прямым счётчиком удалённых химических групп."],"mechanism":["Проверьте прямое действие вмешательства.","Измерьте метку, белок и новую РНК независимо.","Сопоставьте время, контроль и восстановление функции."],"trap":"Кривую содержания зрелой РНК нельзя подписывать «скорость транскрипции» без дополнительной модели и измерений.","widget":"methods","quiz":{"question":"Сразу после ингибирования BET-бромодоменов связывание белка уменьшилось, а H3K27ac сохранился. Противоречат ли результаты друг другу?","options":["Да: каждый белок, связывающий ацетилированный гистон, сам является деацетилазой.","Да: наличие H3K27ac гарантирует неизменную занятость BRD4.","Нет: ингибирование распознавания ацетильных групп не обязано непосредственно удалять эти группы."],"correct":2,"feedback":["Распознавание и удаление выполняют разные участники.","BRD4 имеет несколько контактов; одна метка не задаёт универсальную занятость.","Верно. Последующие эффекты нужно измерять во времени."]},"sources":["brd4","histone-age","gsk-selectivity","taz-2026"],"program":["5.3","слайды 11–12, 17–18"]},{"id":"variants","section":3,"title":"Вариант гистона — изменение белка","lead":"Смена аминокислотной последовательности и добавление химической группы представляют разные механизмы.","paragraphs":["Варианты гистонов кодируются разными генами и отличаются последовательностью, структурой или путями включения в хроматин. Это понятие следует отличать от аллельного варианта одного гена и от посттрансляционной модификации белка. H3.1, H3.3 и CENP-A — разные белковые варианты; H3K27ac — состояние определённого остатка.","Канонические H3.1/H3.2 преимущественно включаются при репликационно сопряжённой сборке с участием CAF-1. H3.3 может включаться вне этого пути: HIRA нужен для включения H3.3 во многих активных и репрессированных генах, а в теломерах и ряде повторных областей H3.3 включается без HIRA, при участии ATRX–DAXX. CENP-A доставляется через специализированный путь с HJURP.","Наличие варианта зависит не только от синтеза белка, но и от шаперона, мишени, стадии клеточного цикла и обмена гистонов. Изменение варианта может менять контакты внутри частицы, взаимодействия с ДНК и распознающими белками. Оно не задаёт единственную функцию независимо от локуса.","DEK и другие белки могут участвовать в обращении с гистонами и изменении их распределения в определённых системах. Название дополнительного шаперона не заменяет проверку специфичности к варианту и геномному контексту."],"mechanism":["Синтезируется вариант с определённой последовательностью.","Шаперон и связанные факторы обеспечивают его доставку.","Сборка и обмен определяют его содержание в локусе."],"trap":"Нельзя считать H3.3 просто «ацетилированным H3.1», а γH2AX — отдельным генетически закодированным вариантом.","widget":"routes","quiz":{"question":"Какое событие является сменой варианта гистона?","options":["Замена H2A–H2B на H2A.Z–H2B в частице.","Фосфорилирование Ser139 H2A.X.","Добавление ацетильной группы к H3K27."],"correct":0,"feedback":["Верно. Здесь изменяется белковый состав частицы.","Это модификация уже имеющегося H2A.X.","Это модификация остатка, а не смена белковой последовательности."]},"sources":["h33","swr1"],"program":["5.4","слайды 14–15"]},{"id":"h33","section":3,"title":"H3.3: один вариант, разные маршруты","lead":"Наличие H3.3 не означает, что участок обязательно транскрипционно активен.","paragraphs":["В промоторах и телах ряда генов H3.3 включается через HIRA-зависимый путь. В ряде теломерных и повторных областей важны ATRX и DAXX. Поэтому один вариант встречается в функционально разных областях, а выключение одного шаперона не должно изображаться как одинаковое прекращение сборки H3.3 по всему геному.","После короткого импульса метки вновь синтезированный H3.3 можно отличить от старого пула. Возрастание меченого сигнала в локусе характеризует включение нового белка в данных условиях. Его дальнейшее уменьшение может включать обмен, репликационное разбавление и изменение пула клеток. Обычный ChIP по H3.3 показывает вариант, но не возраст молекул.","Для проверки маршрута сравнивают контроль и селективное нарушение HIRA либо ATRX–DAXX с самого начала заданного интервала. Если вмешательство выполнено позже, нужно учитывать историю до него. Также измеряют общий H3, клеточный цикл и количество доступного меченого белка: слабый сигнал может возникнуть из-за нарушения доставки, сниженного синтеза нового белка, неполного мечения или изменения числа клеток."],"mechanism":["Выберите локус и предполагаемый шаперон.","Пометьте новый белок в определённом интервале.","Измерьте включение и последующее обновление с контролем общего пула."],"trap":"Нельзя считать HIRA путём доставки H3.3 в теломеры: там H3.3 включается без HIRA, при участии ATRX–DAXX. Нельзя и превращать ChIP-обогащение в возраст белка.","widget":"pulse","quiz":{"question":"После выключения HIRA включение нового H3.3 в выбранный промотор снизилось. Что ещё нужно, чтобы связывать результат с доставкой?","options":["Проверить доступный меченый пул, общий H3, клеточный цикл и восстановление HIRA.","Ничего: возраст всех гистонов уже определён обычным ChIP.","Объявить, что ATRX–DAXX перестал работать во всех теломерах."],"correct":0,"feedback":["Верно. Эти проверки помогают отделить дефект включения от изменений метки и состава клеток.","Обычный ChIP не различает возраст молекул.","Из локального эффекта HIRA не следует такой глобальный результат другого пути."]},"sources":["h33","histone-age"],"program":["5.4","слайды 6, 14"]},{"id":"cenpa","section":3,"title":"CENP-A и воспроизведение центромеры","lead":"Сохранение старого пула и сборка нового пула — разные процессы.","paragraphs":["CENP-A замещает H3 в специализированных центромерных нуклеосомах и участвует в формировании платформы для кинетохора. Для нового CENP-A важен шаперон HJURP. В типичном изученном человеческом цикле основная сборка нового центромерного CENP-A происходит после митоза, в ранней G1; время сборки не следует переносить без проверки на все организмы.","Во время S-фазы родительский CENP-A распределяется между сестринскими хроматидами. В идеализированной модели равного распределения, без потери старого белка, исходно меченый пул на одной центромере уменьшается в среднем как 2⁻ⁿ после n репликаций. После митоза новая сборка может восстановить общий пул, не возвращая исходную метку старым молекулам.","Полное нарушение HJURP не равнозначно изолированной блокаде сборки в G1: HJURP участвует также в сохранении родительского CENP-A при репликации. Переключатель ниже означает именно селективную блокаду новой сборки при сохранённом старом пуле. Начальные 100 единиц — нормировка учебной модели, а не универсальное число молекул в человеческой центромере.","Центромерные белки CENP-C и CENP-N участвуют в распознавании CENP-A-содержащего хроматина и сборке комплекса, связывающего его с кинетохором. CENP-B связывает определённые ДНК-последовательности (CENP-B box), поэтому его нельзя относить вместе с CENP-C/N к белкам, распознающим гистоновый вариант."],"mechanism":["S-фаза: старый пул распределяется между копиями ДНК.","Митоз: копии расходятся в дочерние клетки.","G1: новый CENP-A пополняет центромерный пул."],"trap":"Уменьшение старой метки не равно уменьшению всего CENP-A; идеальная кривая 2⁻ⁿ не описывает любое выключение HJURP.","widget":"cycles","quiz":{"question":"Старая метка CENP-A уменьшилась вдвое, а общее содержание CENP-A восстановилось. Что объясняет сочетание?","options":["Метка автоматически перешла на все новые молекулы.","CENP-A был полностью заменён на H2A.Z.","Распределение старого пула при репликации и включение немеченого нового CENP-A после митоза."],"correct":2,"feedback":["Новая молекула не обязана наследовать метку старой.","Эти варианты заменяют разные компоненты и имеют разные функции.","Верно. Нужно различать исходно меченый пул и суммарное содержание варианта."]},"sources":["cenpa","hjurp","cenp-recognition"],"program":["5.4","слайд 14"]},{"id":"h2a","section":3,"title":"H2A.Z, H2A.X и macroH2A","lead":"Семейство H2A включает варианты с разными структурами и функциональными контекстами.","paragraphs":["H2A.Z часто встречается у регуляторных областей. Дрожжевой SWR1 и человеческие SRCAP/p400-связанные системы участвуют в его АТФ-зависимом включении через обмен димеров. Свойства H2A.Z-содержащей частицы зависят от других гистонов, модификаций и условий измерения: H2A.Z нельзя объявлять универсально нестабильным вариантом или обязательным активатором транскрипции.","H2A.X имеет участок, который фосфорилируется в ответе на повреждение, создавая γH2AX. H2A.X присутствует в хроматине до разрыва; повреждение не требует его сборки заново во всех окружающих частицах. macroH2A содержит большой дополнительный макродомен, обогащён в ряде репрессированных областей, включая неактивную X-хромосому, и может ограничивать перепрограммирование. Его присутствие само по себе не объясняет все этапы инактивации X.","Изменение варианта и модификации взаимосвязано: например, H2A.Z может быть ацетилирован, а H2A.X — фосфорилирован. Разные варианты H2B и H1 также имеют специализированные распределения и свойства. Для функционального вывода нужно назвать конкретный вариант, место, стадию и взаимодействующие белки.","H2A.B, ранее называвшийся H2A.Bbd, имеет изменённую структуру и встречается, среди прочих контекстов, в мужских половых клетках; его нельзя объявлять исключительным признаком сперматогенеза. Варианты H1.0 и H1X отличаются распределением и регуляцией. INO80 может участвовать в удалении H2A.Z в определённых системах, тогда как SWR1 способствует включению; эту противоположность нельзя переносить на все активности обоих комплексов. Ацетилированный и убиквитинированный H2A.Z встречаются в разных регуляторных контекстах."],"mechanism":["Обмен изменяет белковый состав нуклеосомы.","Модификация изменяет состояние конкретного варианта.","Эффект определяется локусом и партнёрами."],"trap":"H2A.Z не означает «ген включён», а macroH2A не означает, что измерены все механизмы репрессии.","widget":"variant-atlas","quiz":{"question":"В промоторе обнаружен H2A.Z. Какой вывод можно сделать без дополнительных измерений?","options":["Все нуклеосомы обязательно распались.","В промоторе присутствует этот вариант; активность гена и свойства частиц требуют отдельной проверки.","Ген обязательно сильно транскрибируется."],"correct":1,"feedback":["Вариант может присутствовать в сохранённых нуклеосомах.","Верно. Нужны измерения транскрипции, состава и состояния локуса.","H2A.Z встречается в разных регуляторных контекстах."]},"sources":["h2az","swr1","srcap","macro","damage","h2ab","macro-reprogram"],"program":["5.4","слайды 14–15"]},{"id":"inheritance","section":3,"title":"Возраст белка, вариант и модификация","lead":"Эпигенетическое воспроизведение состояния не означает, что каждая старая частица сохраняется целиком.","paragraphs":["При репликации родительские H3–H4 в основном возвращаются на обе дочерние ДНК, а новые гистоны восполняют вторую половину пула. Это не следует изображать как неизменные старые октамеры, которые всегда переносятся вместе со всеми своими метками. Димеры, тетрамеры и отдельные контакты имеют разные пути перестройки.","Часть родительских модификаций сохраняется, но другие изменяются; новый пул приобретает модификации с различной скоростью. Сам вариант может оставаться тем же, хотя возраст и состояние остатка изменились. Для H3K9me3 и H3K27me3 восстановление общего уровня после репликации может продолжаться дольше непосредственной сборки гистонов.","SILAC различает белковые пулы по изотопной метке, SNAP-подходы — по времени мечения белка, а ChIP и CUT&RUN добавляют информацию о выбранном эпитопе и его локализации. Чтобы проверить наследование, нужно сопоставить старые и новые молекулы, их модификации, фазу цикла и функцию локуса. Связь через распознающие белки и ферменты установки может восстанавливать сходное состояние без точного копирования каждой молекулы."],"mechanism":["Старые H3–H4 распределяются между дочерними ДНК.","Включаются новые гистоны.","Ферменты и регуляторные контакты восстанавливают модификации и функцию."],"trap":"«Старый», «H3.3» и «H3K27me3» отвечают на три разных вопроса; ни один признак автоматически не задаёт два остальных.","widget":"identity","quiz":{"question":"Старый H3 сохранился в хроматине, но потерял ацетильную группу. Как изменились признаки?","options":["Белок автоматически стал CENP-A.","Возраст и аминокислотный вариант обязательно изменились.","Возраст белка и вариант могут сохраниться; изменилось состояние модификации."],"correct":2,"feedback":["Для CENP-A требуется другой белок и специализированная сборка.","Удаление группы не синтезирует новый белок и не меняет его последовательность.","Верно. Эти измерения нужно разделять."]},"sources":["histone-age"],"program":["5.4","слайды 15, 19"]},{"id":"variant-disease","section":3,"title":"Онкогистоны, старение и клеточное состояние","lead":"Патогенное изменение гистона может действовать шире той части молекул, в которой оно присутствует.","paragraphs":["Замена K27M в H3 может нарушать PRC2-зависимую регуляцию и снижать общее содержание H3K27me3 с неоднородными локальными последствиями. Изменения G34R/V влияют на взаимодействия и модификации вблизи H3K36; их механизм не следует считать тождественным K27M. Эти изменения встречаются в определённых опухолевых контекстах и не означают одинакового фенотипа в любой ткани и при любом уровне экспрессии.","Нарушения ATRX/DAXX могут менять включение H3.3 в повторные и теломерные области. В определённых опухолях они связаны с альтернативным удлинением теломер (ALT), однако одной мутации недостаточно, чтобы объявить ALT доказанным. Нужно исследовать теломерные признаки и функцию системы.","При старении и клеточном старении меняются содержание гистонов, локальные модификации и организация хроматина. Клеточное старение — особое состояние с устойчивой остановкой пролиферации, а старение организма включает многие процессы и разные клетки. Единой обязательной последовательности изменений всех меток нет. Эпигенетическая терапия предполагает воздействие на конкретный фермент или взаимодействие; из изменения метки не следует доказанное омоложение.","Обогащение CENP-A вне центромер или изменение содержания H2A.Z может сопровождать опухолевые состояния, но ассоциация не устанавливает универсальный диагностический признак. Эпигенетические часы чаще основаны на паттернах метилирования ДНК; их нельзя считать прямым измерением возраста отдельных гистоновых вариантов. Изменения EZH2, CREBBP и KDM6A имеют различные последствия для модификаций; при опухолевом анализе важны тип изменения и остаточная функция."],"mechanism":["Изменение белка влияет на сборку или ферментативные контакты.","Локальные эффекты перераспределяются по регуляторной системе.","Фенотип зависит от ткани, времени и других нарушений."],"trap":"CREBBP/EP300 связаны с синдромом Рубинштейна—Тейби; синдром Коффина—Лоури связан с RPS6KA3. Эти названия нельзя подменять друг другом.","widget":"disease","quiz":{"question":"В опухоли найдена потеря ATRX. Как корректно проверить гипотезу об ALT?","options":["Объявить ALT доказанным только по этой находке.","Исследовать дополнительные признаки альтернативного поддержания теломер; генотип сам по себе не завершает проверку.","Считать все теломеры мгновенно исчезнувшими."],"correct":1,"feedback":["Ассоциация не гарантирует этот фенотип в каждом случае.","Верно. Генетическая ассоциация и доказанная работа пути — разные уровни вывода.","Нарушение пути не означает мгновенной потери всех теломер."]},"sources":["onco","g34","alt","aging","rts","cls"],"program":["5.4","слайд 18"]},{"id":"methods","section":4,"title":"План исследования: величина, метод, ограничение","lead":"Один локус нужно рассматривать через несколько независимых измерений.","paragraphs":["Положение частиц исследуют нуклеазными картами, доступность — ATAC/DNase или подходящим количественным тестом, модификацию и вариант — эпитоп-специфическими методами, контакты — Hi-C/Micro-C/ChIA-PET. Криоэлектронная микроскопия отвечает на структурные вопросы, FRET и одномолекулярное наблюдение — на вопросы расстояний и динамики. Эти измерения дополняют друг друга, но не заменяют.","Для динамики белкового пула полезны импульсные метки и наблюдение живых клеток; для транскрипции — методы измерения новой РНК. Обычное RNA-seq определяет содержание РНК и само по себе не отделяет синтез от распада. Усреднение по клеткам может скрыть, что высокий сигнал возникает в небольшой части популяции.","Сильный план проверяет альтернативы. Например, после снижения H3K27ac сравнивают прямой эффект на фермент, общий H3, связывание распознающего белка, доступность и новую РНК; добавляют контроль растворителя, независимое вмешательство и восстановление функции. Адресное привлечение с помощью dCas9 проверяет эффект в локусе, но требует контроля каталитически неактивного конструкта и dCas9 без присоединённого регуляторного белка."],"mechanism":["Назовите гипотезу и возможные альтернативы.","Сопоставьте каждую величину с методом.","Запланируйте вмешательство, время и контроль."],"trap":"Ни одна технология не даёт одновременно готовые ответы о положении, возрасте, модификации, контактах и причине изменения экспрессии.","widget":"methods","quiz":{"question":"Нужно различить уменьшение синтеза РНК и ускорение её распада. Чего не хватает одному измерению общего содержания РНК?","options":["Только ещё одной подписи на графике.","Независимого измерения образования новой РНК или кинетики распада.","Измерения диаметра всех нуклеосом."],"correct":1,"feedback":["Изменение подписи не добавляет недостающие данные.","Верно. Содержание РНК определяется как образованием, так и удалением.","Размер частицы не разделяет эти потоки РНК."]},"sources":["atac","qda","histone-age"],"program":["5.1–5.4","слайды 17, 19"]},{"id":"investigation","section":4,"title":"Расследование одного локуса","lead":"Сопоставьте воздействие, молекулярное событие, наблюдение и вывод.","paragraphs":["В виртуальном опыте выбран один регуляторный локус, в котором связывание фактора способствует привлечению BAF и p300, а BET-зависимые контакты помогают поддерживать транскрипцию. Это заданная учебная система. Её результаты нельзя переносить на любой промотор: доступность, ацетилирование, варианты гистонов и контакты действуют совместно, но не имеют одного универсального порядка.","Выберите воздействие и сначала предскажите, какой процесс нарушен непосредственно. Затем откройте качественные профили. Они заданы как условия задачи, а не получены из экспериментальной базы и не являются количественным прогнозом. Сопоставьте общий H3, доступность, H3K27ac, BET-белок, новый H3.3, контакты и новую РНК.","Заключение должно называть прямой механизм, согласующиеся наблюдения и хотя бы одну альтернативу. Для причины выберите контроль: восстановление функции, каталитически неактивный вариант, независимое вмешательство, контроль клеточного цикла или жизнеспособности. Даже полная схема должна оставлять место неопределённости: совместные изменения ещё не устанавливают их порядок."],"mechanism":["Воздействие изменяет активность конкретного участника или скорость реакции.","Разные методы дают независимые профили локуса.","Контроль помогает исключить альтернативное объяснение."],"trap":"Не пытайтесь угадать экспрессию только по цвету нуклеосомы. Уточняйте механизм и измеряемую величину.","widget":"investigation","quiz":{"question":"Какое заключение сильнее всего обосновано, если вмешательство, независимый реагент и восстановление функции согласованно меняют одну и ту же раннюю молекулярную величину?","options":["Не осталось никаких возможных альтернатив.","Любая метка на всех генах имеет ту же функцию.","Получены более сильные данные о зависимости этой величины от мишени в исследованных условиях."],"correct":2,"feedback":["Контроли усиливают вывод, но не устраняют все возможные альтернативы.","Локусный результат не устанавливает универсальную функцию.","Верно. Причинный вывод относится к выбранной системе, воздействию и временным условиям."]},"sources":["assembly","cohesin","brd4","h33"],"program":["5.1–5.4","слайд 19"]}],"sections":[["Нуклеосомы","Как упаковка ДНК влияет на доступ к регуляторным участкам"],["Ремоделирование","Как АТФ-зависимые комплексы изменяют нуклеосомы"],["Модификации","Как химические изменения гистонов приобретают функцию"],["Варианты","Как состав и обновление гистонов меняют хроматин"],["Исследование","Как проверить механизм на одном локусе"]],"sources":{"structure":["Luger et al., 1997 · структура нуклеосомной частицы","https://doi.org/10.1038/38444"],"rap1":["Mivelaz et al., 2020 · Rap1 на нуклеосомной ДНК","https://pmc.ncbi.nlm.nih.gov/articles/PMC7005674/"],"qda":["Chereji et al., 2019 · количественная доступность qDA-seq","https://pmc.ncbi.nlm.nih.gov/articles/PMC6886500/"],"atac":["Buenrostro et al., 2013 · принцип ATAC-seq","https://doi.org/10.1038/nmeth.2688"],"chromemt":["Ou et al., 2017 · организация хроматина в клетке","https://pmc.ncbi.nlm.nih.gov/articles/PMC5646685/"],"cohesin":["Rao et al., 2017 · потеря когезина и контактных доменов","https://pmc.ncbi.nlm.nih.gov/articles/PMC5846482/"],"assembly":["Krietenstein et al., 2016 · реконструкция организации нуклеосом","https://doi.org/10.1016/j.cell.2016.09.045"],"h33":["Goldberg et al., 2010 · локус-зависимая доставка H3.3","https://pmc.ncbi.nlm.nih.gov/articles/PMC2885838/"],"remodel-structure":["Liu et al., 2017 · структура комплекса Snf2–нуклеосома","https://pubmed.ncbi.nlm.nih.gov/28424519/"],"snf2h":["Gamarra et al., 2018 · кислотный участок нуклеосомы снимает автоингибирование SNF2h","https://elifesciences.org/articles/35322"],"swr1":["Mizuguchi et al., 2004 · АТФ-зависимый обмен H2A.Z","https://pubmed.ncbi.nlm.nih.gov/14645854/"],"nurd":["Xue et al., 1998 · ремоделирование и деацетилирование в NuRD","https://doi.org/10.1016/S1097-2765(00)80299-3"],"baf-assembly":["Mashtalir et al., 2018 · сборка комплексов SWI/SNF","https://doi.org/10.1016/j.cell.2018.09.032"],"css":["Santen et al., 2012 · ARID1B и синдром Коффина—Сириса","https://www.nature.com/articles/ng.2217"],"nbs":["Van Houdt et al., 2012 · SMARCA2 и синдром Николаидеса—Барайцера","https://pubmed.ncbi.nlm.nih.gov/22366787/"],"charge":["Vissers et al., 2004 · CHD7 и CHARGE","https://www.nature.com/articles/ng1407"],"synthetic":["Hoffman et al., 2014 · зависимость от SMARCA2 в опухолевых моделях","https://pubmed.ncbi.nlm.nih.gov/24520176/"],"acetyl-physics":["Gansen et al., 2009 · ацетилирование и динамика нуклеосом","https://pubmed.ncbi.nlm.nih.gov/18950220/"],"hp1":["Bannister et al., 2001 · распознавание H3K9me белком HP1","https://www.nature.com/articles/35065138"],"reader-phd":["Wysocka et al., 2006 · BPTF и H3K4me3","https://doi.org/10.1038/nature04815"],"brd4":["Zhu et al., 2026 · множественные контакты BRD4 с нуклеосомой","https://pubmed.ncbi.nlm.nih.gov/42561958/"],"damage":["Stucki et al., 2005 · MDC1 и фосфорилированный H2A.X","https://doi.org/10.1016/j.cell.2005.09.038"],"metabolism":["Wellen et al., 2009 · ацетил-КоА и ацетилирование","https://pmc.ncbi.nlm.nih.gov/articles/PMC2746744/"],"akg":["Carey et al., 2015 · α-кетоглутарат и клеточное состояние","https://pmc.ncbi.nlm.nih.gov/articles/PMC4336218/"],"memory":["Alarcón et al., 2004 · CBP, пластичность и память у мышей","https://pubmed.ncbi.nlm.nih.gov/15207239/"],"memory-methyl":["Gupta et al., 2010 · метилирование гистонов и обучение","https://pmc.ncbi.nlm.nih.gov/articles/PMC2859898/"],"histone-age":["Alabert et al., 2015 · новые гистоны и восстановление модификаций","https://doi.org/10.1101/gad.256354.114"],"cenpa":["Jansen et al., 2007 · сборка нового CENP-A в клеточном цикле","https://doi.org/10.1083/jcb.200701066"],"hjurp":["Zasadzińska et al., 2018 · HJURP и сохранение старого CENP-A","https://pmc.ncbi.nlm.nih.gov/articles/PMC6219920/"],"h2az":["Jin & Felsenfeld, 2007 · контекстная стабильность H2A.Z/H3.3","https://pmc.ncbi.nlm.nih.gov/articles/PMC1891429/"],"srcap":["Wong et al., 2007 · включение H2A.Z с участием SRCAP","https://doi.org/10.1074/jbc.M703418200"],"macro":["Costanzi & Pehrson, 1998 · macroH2A и неактивная X","https://www.nature.com/articles/31275"],"onco":["Lewis et al., 2013 · H3K27M и PRC2","https://pubmed.ncbi.nlm.nih.gov/23539183/"],"g34":["Bjerke et al., 2013 · H3.3 G34 и регуляция в глиоме","https://doi.org/10.1158/2159-8290.CD-12-0426"],"alt":["Heaphy et al., 2011 · ATRX/DAXX и ALT в опухолях","https://doi.org/10.1126/science.1207313"],"aging":["O’Sullivan et al., 2010 · содержание гистонов при клеточном старении","https://pmc.ncbi.nlm.nih.gov/articles/PMC2951278/"],"rts":["Roelfsema et al., 2005 · CREBBP/EP300 и синдром Рубинштейна—Тейби","https://pmc.ncbi.nlm.nih.gov/articles/PMC1199295/"],"arid-ezh2":["Bitler et al., 2015 · ARID1A и зависимость от EZH2 в моделях рака","https://pmc.ncbi.nlm.nih.gov/articles/PMC4352133/"],"foxa":["Iwafuchi-Doi et al., 2016 · FOXA и нуклеосомные энхансеры","https://pmc.ncbi.nlm.nih.gov/articles/pmid/27058788/"],"cenp-recognition":["Carroll et al., 2010 · распознавание CENP-A белками центромеры","https://pmc.ncbi.nlm.nih.gov/articles/PMC2894454/"],"wdr5":["Couture et al., 2006 · взаимодействие WDR5 с H3","https://pubmed.ncbi.nlm.nih.gov/16829960/"],"h2ab":["Ishibashi et al., 2010 · H2A.Bbd и тканевые контексты","https://pmc.ncbi.nlm.nih.gov/articles/PMC2847216/"],"kmt-memory":["Jakovcevski et al., 2015 · KMT2A и пластичность в мышиной модели","https://pmc.ncbi.nlm.nih.gov/articles/PMC4380991/"],"cls":["Trivier et al., 1996 · RSK2 и синдром Коффина—Лоури","https://www.nature.com/articles/384567a0"],"h4k16":["Shogren-Knaak et al., 2006 · H4K16ac и межнуклеосомные контакты","https://pubmed.ncbi.nlm.nih.gov/16469925/"],"macro-reprogram":["Gaspar-Maia et al., 2013 · macroH2A и перепрограммирование","https://www.nature.com/articles/ncomms2582"],"gsk-selectivity":["Heinemann et al., 2014 · ограничения селективности GSK-J1/J4","https://www.nature.com/articles/nature13688"],"ehmt-memory":["Schaefer et al., 2009 · GLP/G9a и функция нейронов","https://pmc.ncbi.nlm.nih.gov/articles/PMC2814156/"],"taz-2026":["FDA / Federal Register, 22 июня 2026 · отзыв одобрения Tazverik (NDA 211723)","https://public-inspection.federalregister.gov/2026-12367.pdf"]}}; const PRACTICE_HTML = "";
/* Чистые функции. Параметры учебных моделей не выдаются за экспериментальные данные. */
const SeminarModels = (() => {
  const phase = (m, t, w, e) => {
    if (w + e === 0) return m;
    const steady = w / (w + e);
    return steady + (m - steady) * Math.exp(-(w + e) * t);
  };
  function markAt(t, {m0=.2, w=.12, e=.06, switchAt=10, wAfter=0}={}) {
    if (t <= switchAt) return phase(m0, t, w, e);
    return phase(phase(m0, switchAt, w, e), t-switchAt, wAfter, e);
  }
  function binding(p, c, f) {
    const free = c/(1+c), nucleosomal = f===0 ? 0 : c/(c+1/f);
    return {free, nucleosomal, occupied:(1-p)*free+p*nucleosomal, accessible:1-p+p*f};
  }
  function cenpa(n, load=true) {
    const old = 100 * Math.pow(2,-n), fresh = load ? 100-old : 0;
    return {old, fresh, total:old+fresh};
  }
  function snf2h(e) { return 2.5*Math.pow(e,1.5)/(Math.pow(e,1.5)+Math.pow(61,1.5)); }
  function pulse(t, halfLife) { return 100*Math.pow(2,-t/halfLife); }
  return {phase, markAt, binding, cenpa, snf2h, pulse};
})();
if (typeof module !== 'undefined') module.exports = SeminarModels;

 if(!PRACTICE_HTML){document.body.classList.remove('practice-mode');$('main').innerHTML=`<section class="card practice-intro"><div><h1>Практикум: 44 сценария</h1><p>Практикум открывается отдельной страницей семинара. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; происхождение измеренных параметров указано в справке каждой сцены.</p></div><div class="practice-actions"><a class="practice-link" href="seminar-5.html">Открыть практикум</a><button id="back-route">Вернуться к объяснениям</button></div></section>`;$('back-route').onclick=()=>navigate('home');return;}
 $('main').innerHTML=`<section class="card practice-intro"><div><h1>Практикум: 44 сценария</h1><p>Показания рассчитываются по учебным моделям; происхождение измеренных параметров указано в справке. Предскажите эффект, откройте результат и сопоставьте его с объяснением. Условия и ограничения доступны в справке каждой сцены.</p></div><button id="back-route">Вернуться к объяснениям</button></section><iframe id="practice-frame" title="Практикум семинара 5: предсказание и разбор опытов"></iframe>`;
 $('practice-frame').srcdoc=PRACTICE_HTML;

}
function initProfiles(s,set,out,onGroup){
 s.condition??=0;
 const names=['Исходное состояние','Сдвиг нуклеосомы','Удаление частицы','Связывание ТФ'];
 const conclusions=[
  'Мотив в координате 0 перекрыт частицей. MNase-профиль указывает на защиту этого участка; низкий ATAC-сигнал сам по себе не доказывает репрессии гена.',
  'Центр защиты MNase сместился к +150 п.н., а мотив стал доступнее для Tn5. Число частиц сохранено. Повышение ChIP ТФ в этой задаче дополнительно задано условием, а не вычислено из ATAC.',
  'Защита около мотива уменьшилась, ATAC-сигнал вырос. В реальном опыте нужно проверить общий H3 и технические альтернативы: изменение профиля MNase само по себе не доказывает удаление октамера.',
  'В этом сравнении контроль — локус с доступным мотивом без центральной нуклеосомы. После связывания ТФ положение оставшихся нуклеосом сохранилось, ChIP ТФ вырос, а число вставок Tn5 в мотиве уменьшилось. Это условный футпринт: связывание белка не обязано повышать каждую точку ATAC-профиля.'
 ];
 set('Один локус — три разных измерения','Искусственные профили · общая координатная шкала',`<p>Мотив ТФ находится в координате 0. Сплошная линия — исходное состояние; пунктир — выбранное воздействие. Каждый метод имеет собственную относительную шкалу: высоты разных рядов напрямую не сравнивают. Для опыта со связыванием ТФ выбран отдельный контроль: доступный мотив без центральной частицы и без связанного ТФ.</p>${buttonGroup('profile-condition',names,s.condition)}`);
 const gauss=(x,c,w)=>Math.exp(-.5*((x-c)/w)**2);
 const signal=(method,x,condition)=>{
   let occupancy=(condition===2||condition===3)?0:1,center=condition===1?150:0;
   let protectedDNA=occupancy*gauss(x,center,43)+.6*gauss(x,-220,38)+.6*gauss(x,260,38);
   if(method===0){let v=.08+.8*Math.max(0,1-protectedDNA);if(condition===3)v*=1-.72*gauss(x,0,12);return v;}
   if(method===1)return .03+.85*protectedDNA;
   return .03+((condition===0||condition===2)?.08:.7)*gauss(x,0,28);
 };
 const draw=()=>{
  const baseline=s.condition===3?2:0;
  const controlName=s.condition===3?'Контроль без ТФ':'Исходное состояние';
  const w=small()?320:680,x0=42,x1=w-16,h=430;
  let d='';['ATAC: вставки Tn5','MNase: защищённые фрагменты','ChIP выбранного ТФ'].forEach((label,m)=>{
   let top=28+m*132,base=top+83;
   d+=tx(x0,top-8,label,small()?14:15,'start')+line(x0,base,x1,base,'#879dad',1)+line(x0,top,x0,base,'#879dad',1);
   [-300,-150,0,150,300].forEach(x=>{let px=x0+(x+300)/600*(x1-x0);d+=line(px,top,px,base,'#e0e8ee',1)+tx(px,base+18,String(x),small()?13:11);});
   [baseline,s.condition].forEach((cond,j)=>{let pts=Array.from({length:121},(_,i)=>{let x=-300+i*5;return `${i?'L':'M'}${x0+(x+300)/600*(x1-x0)},${base-72*signal(m,x,cond)}`;}).join(' ');d+=`<path d="${pts}" stroke="${j?'#c3662f':'#145c96'}" stroke-width="${j?3:2}" stroke-dasharray="${j?'7 4':'none'}" fill="none"/>`;});
  });
  d+=tx(w/2,424,'Координата относительно мотива, п.н.',small()?14:14);
  out(svg(d,'Три искусственных профиля одного локуса, исходное состояние и воздействие',h,w),`<div class="legend-lines"><span>━ ${controlName}</span><span>┄ ${esc(names[s.condition])}</span></div>${result(conclusions[s.condition])}<details><summary>Значения в координате мотива без различения цвета</summary><table><thead><tr><th>Метод</th><th>${controlName}</th><th>Выбранное</th></tr></thead><tbody>${['ATAC','MNase','ChIP ТФ'].map((m,i)=>`<tr><td>${m}</td><td>${signal(i,0,baseline).toFixed(2).replace('.',',')}</td><td>${signal(i,0,s.condition).toFixed(2).replace('.',',')}</td></tr>`).join('')}</tbody></table></details><p class="quiet">Формы заданы для обучения чтению профилей; это не экспериментальные данные и не алгоритм количественного предсказания секвенирования. Транскрипция здесь не измеряется. Отсутствие футпринта в реальных данных не исключает связывания ТФ.</p>`);
 };
 onGroup('profile-condition',i=>{s.condition=i;draw();});draw();
}
