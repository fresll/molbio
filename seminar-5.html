лабеют при деградации белка, а ингибитор и PFI-3 оставляют их неизменными.", "p2a_8_e": "В модели через 60 мин: BRM014 — SMARCA4 ×1,0, SMARCA2 ×1,0, ChIP ×0,70, ATAC ×0,20; ACBI1 — SMARCA4 ×0,30, SMARCA2 ×0,30, ChIP ×0,30, ATAC ×0,55; PFI-3 — все показатели ×1,0. Образец Y — единственный с ослабленными полосами.", "p2a_8_w1": "Ингибитор не уменьшает содержание белка: в образце X полосы ×1,0, а в Y — ×0,30.", "p2a_8_w3": "PFI-3 ничего не меняет из измеренного; доступность в Y ×0,55, а у PFI-3 было бы ×1,0.", "gn_r_baf": "Комплекс BAF и другие семейства", "g_r_baf": "BAF (SWI/SNF млекопитающих) — АТФазный ремоделер, моторная субъединица которого SMARCA4 или SMARCA2. По реферату Krietenstein 2016, в очищенной системе дрожжей RSC расчищает свободный от нуклеосом участок, INO80 и ISW2 ставят первую нуклеосому после него, а ISW1a уплотняет ряд; BAF — одно из семейств, и сцена показывает только его.", "gn_r_par": "Паралог SMARCA2", "g_r_par": "SMARCA2 — паралог SMARCA4 в тех же комплексах. По Schick 2021 (HAP1), при острой потере одного SMARCA4 доступность падает в большинстве районов, но не до фона. В модели SMARCA4 несёт 70 % работы мотора (допущение), без SMARCA2 — всю.", "gn_r_arid": "Субъединицы ARID1A и ARID1B", "g_r_arid": "ARID1A и ARID1B — взаимозаменяемые субъединицы BAF. По рефератам Kelso 2017 и Mathur 2017, ARID1B частично замещает ARID1A. В модели хроническая потеря ARID1A снижает вклад мотора до 0,8, потеря обеих — до 0,4 (допущение). В Trizzino 2018 потеря ARID1A мало меняет доступность, но нарушает паузирование Pol II; в модель это не входит.", "gn_r_pc": "Polycomb-локус", "g_r_pc": "Комплекс PRC1 ставит H2AK119ub1, PRC2 — H3K27me3. В Kadoch 2017 (фибробласты мыши, рапамицин 3 нМ) BAF садится на локус примерно за 2 мин, PRC1 уходит раньше PRC2, H2AK119ub1 исчезает раньше H3K27me3, доступность следует за снятием меток; общий H3 за первый час не меняется. Постоянные времени в модели подобраны.", "gn_r_motor": "Воздействия: BRM014, ACBI1, dTAG47, PFI-3, мутант", "g_r_motor": "BRM014 — ингибитор АТФазы SMARCA2/4 (Papillon 2018); в модели действует сразу и не разрушает белок. ACBI1 — деградер SMARCA2/4 и PBRM1 (Farnaby 2019), dTAG47 — деградер SMARCA4, слитого с dTAG (Schick 2021); оба убирают белок за часы (в модели τ = 50 мин). PFI-3 — лиганд бромодомена: АТФазный центр остаётся без воздействия (Vangamudi 2015, реферат). Мутант АТФазы SMARCA4 доминантно-негативный (Hodges 2018): в модели теряет половину активности мотора. Шаг мотора 1–2 п.н. измерен у RSC (Harada 2016), у других семейств размер шага не показан.", "gn_r_measure_a": "Как измеряют", "g_r_measure_a": "ATAC-seq читает доступность хроматина, вестерн-блот — содержание белка, ChIP — белок на хроматине, PRO-seq — новосинтезированную РНК. Вестерн-блот на экране условный и насыщается, «нет полосы» не означает нуля. Эксперименты Schick 2021 выполнены на HAP1, Iurlaro 2021 — на мышиных ES-клетках, Kadoch 2017 — на фибробластах мыши, поэтому перенос между системами — допущение.", "gn_r_model_a": "Что упрощено", "g_r_model_a": "Доступность района релаксирует к уровню, заданному работой мотора; два класса районов с τ = 10 и 40 мин подобраны в пределах 10–60 мин потери и 15–60 мин возврата (Iurlaro 2021, подписи рисунков). Фоновая доступность 0,1, доля SMARCA4 в работе мотора 0,7, вклад ARID (0,8 при потере ARID1A, 0,4 при потере обеих субъединиц), потеря половины активности мотора у мутанта и деградация белка с τ = 50 мин для обоих деградеров — допущения. Новая РНК следует за доступностью слабо и с запаздыванием (чувствительность 0,2). Времена в модели — учебные, число районов по классам не использовано.", "s3_min": "мин", "s3_t": "время после изменения активностей, мин (учебная модель)", "s3_how": "Как измеряют", "s3_lim": "Что упрощено", "s3_nuc_aria": "Нуклеосома с остатком K27 гистона H3", "s3_scale": "Схема условная: десять значков — нуклеосомы локуса, доли округлены.", "s3_r_M": "Доля нуклеосом с ацетилом на H3K27", "s3_r_R": "Занятость ридера", "s3_r_tau": "Время выхода на новый уровень (τ)", "s3b_w": "Активность писателя (p300/CBP), % нормы", "s3b_e": "Активность стирателя (HDAC), % нормы", "s3b_w_nm": "Писатель p300/CBP", "s3b_e_nm": "Стиратель HDAC", "s3b_r_nm": "Ридер BRD4", "s3b_w_do": "ставит ацетил", "s3b_e_do": "снимает ацетил", "s3b_r_do": "узнаёт ацетил", "s3b_rowt": "Нуклеосомы локуса: ацетил (Ac) на остатке K27 гистона H3 и ридер на нём", "s3b_leg1": "Значок Ac — метка на K27, треугольник — ридер на нуклеосоме с меткой.", "s3b_cnt": "Нуклеосом с меткой: {k} из {n}", "s3b_cnt2": "Нуклеосом с ридером: {r} из 10", "s3b_plot_aria": "График: доля нуклеосом с меткой и занятость ридера в зависимости от времени; ось времени логарифмическая", "s3b_ref": "Серая метка на полосе — значение при нормальных активностях обоих ферментов (100 %). Время отсчитывается от изменения активностей; ось логарифмическая, числа времени — учебная модель. Сплошная линия на графике — доля нуклеосом с меткой, пунктирная — занятость ридера, вертикальная черта — положение курсора.", "s3b_take": "Уровень метки задаёт отношение активностей писателя и стирателя, а скорость её обновления — сумма активностей: при одновременном росте обеих уровень остаётся прежним, но устанавливается быстрее. Ридер отвечает на изменение метки сильнее, чем меняется сама доля меченых нуклеосом.", "s3b_c_none": "Активности писателя и стирателя равны нулю: метка не ставится и не снимается, доля меченых нуклеосом остаётся исходной.", "s3b_c_none_z": "Без обоих ферментов уровень метки не обновляется; ридер продолжает занимать нуклеосомы с меткой, которые уже есть.", "s3b_c_ref": "При нормальных активностях писателя и стирателя метку несут {m} нуклеосом, а ридер занимает {r} своих сайтов; время выхода на новый уровень составляет {tau}.", "s3b_c_ref_z": "Обе реакции идут постоянно, поэтому метка обновляется, а её уровень остаётся стабильным.", "s3b_c_trans": "К моменту {t} после изменения активностей доля нуклеосом с меткой равна {m}; она ещё приближается к новому уровню — {ms}.", "s3b_c_trans_z": "Новый уровень устанавливается за время порядка τ ({tau}); до этого показания отражают переходное состояние.", "s3b_c_w0": "При нулевой активности писателя метка снимается, а новая не ставится: доля меченых нуклеосом равна {m}, занятость ридера — {r}.", "s3b_c_w0_z": "Без писателя нечем восполнять метку, которую снимает стиратель.", "s3b_c_e0": "При нулевой активности стирателя метка накапливается: доля меченых нуклеосом равна {m}, занятость ридера — {r}.", "s3b_c_e0_z": "Без стирателя метка не снимается, поэтому со временем её несут почти все нуклеосомы локуса.", "s3b_c_hi": "Активность писателя выше, чем нужно для исходного баланса: меченых нуклеосом {m}, ридер занимает {r} своих сайтов, время выхода на новый уровень — {tau}.", "s3b_c_hi_z": "Занятость ридера изменяется сильнее, чем доля меченых нуклеосом: в модели ридеру нужно несколько близких меток для прочного связывания.", "s3b_c_lo": "Активность стирателя выше, чем нужно для исходного баланса: меченых нуклеосом {m}, ридер занимает {r} своих сайтов, время выхода на новый уровень — {tau}.", "s3b_c_lo_z": "При малой доле меток ридер связывается редко: его занятость падает сильнее, чем доля меченых нуклеосом.", "s3b_c_same_fast": "Писатель и стиратель уравновешены на более высоком уровне активности: доля меченых нуклеосом равна {m}, а время выхода на новый уровень сокращено до {tau}.", "s3b_c_same_fast_z": "Уровень метки определяется отношением активностей, а скорость её обновления — их суммой.", "s3b_c_same_slow": "Писатель и стиратель уравновешены на более низком уровне активности: доля меченых нуклеосом равна {m}, а время выхода на новый уровень увеличено до {tau}.", "s3b_c_same_slow_z": "Уровень метки определяется отношением активностей, а скорость её обновления — их суммой.", "s3b_when": "Прогноз — для нового установившегося состояния (курсор в конце оси); время выхода на этот уровень показано как τ, числа времени — учебная модель.", "p3b_1_q": "На локусе ферменты p300/CBP (писатель) и HDAC (стиратель) действуют с нормальной активностью (по 100 %), ацетил на H3K27 несёт половина нуклеосом. Активность писателя повысили вдвое, активность стирателя оставили прежней. Как изменится доля нуклеосом с ацетилом на H3K27 в новом установившемся состоянии?", "p3b_1_o1": "Доля вырастет, но останется ниже насыщения, потому что стиратель продолжает снимать метку.", "p3b_1_o2": "Доля не изменится, потому что стиратель немедленно уравновесит рост активности писателя.", "p3b_1_o3": "Доля вырастет до насыщения, потому что активность стирателя не изменилась и метка накапливается.", "p3b_1_k": "Скорость постановки метки возросла, а скорость её снятия пропорциональна доле меченых нуклеосом и растёт вместе с этой долей; поэтому устанавливается более высокий, но не полный уровень.", "p3b_1_e": "В модели доля нуклеосом с ацетилом при вдвое повышенной активности писателя и прежней активности стирателя составляет 67 % против 50 % в исходном состоянии. Занятость ридера растёт сильнее, чем доля метки (с 50 % до 70 %), а время выхода на новый уровень сокращается с 5,0 до 3,3 мин, потому что оно определяется суммой активностей. Это учебная модель: порядок минут принят по возврату ацетилирования в дрожжах (Katan-Khaykovich 2002, по реферату), а для p300/CBP и HDAC человека константы не измерены.", "p3b_1_w2": "Стиратель не подстраивается под писателя: скорость снятия метки пропорциональна доле меченых нуклеосом и растёт лишь по мере накопления метки. Поэтому рост активности писателя сдвигает баланс к более высокому уровню.", "p3b_1_w3": "Метка не накапливается до насыщения, пока стиратель действует: чем больше нуклеосом помечено, тем больше меток он снимает за единицу времени. При вдвое повышенной активности писателя устанавливается промежуточный уровень.", "p3b_2_q": "На том же локусе активности писателя и стирателя в норме (по 100 %), ридер BRD4 занимает половину своих сайтов. Активность стирателя HDAC повысили вдвое, активность писателя оставили прежней. Как изменится занятость ридера в новом установившемся состоянии?", "p3b_2_o1": "Занятость ридера снизится так же, как доля нуклеосом с меткой, потому что ридер связывает любую нуклеосому с ацетилом.", "p3b_2_o2": "Занятость ридера не изменится, потому что ридер узнаёт ацетил независимо от того, сколько меток снимает стиратель.", "p3b_2_o3": "Занятость ридера снизится сильнее, чем доля нуклеосом с меткой, потому что ридеру нужны несколько близких меток.", "p3b_2_k": "Стиратель снимает ацетил, и доля нуклеосом с меткой падает; ридер прочно связывается при нескольких близких метках, поэтому его занятость снижается сильнее, чем доля меченых нуклеосом.", "p3b_2_e": "При вдвое повышенной активности стирателя в модели метку несут 33 % нуклеосом (было 50 %), а занятость ридера снижается с 50 % до 23 %. Кооперативность связывания — допущение модели: Kd BRD4 к нуклеосомам не измерен, но близко расположенные ацетил-лизины связываются заметно сильнее одиночного (Filippakopoulos 2012). Время выхода на новый уровень сокращается с 5,0 до 3,3 мин.", "p3b_2_w1": "Занятость ридера не повторяет долю метки: при малой доле метки многие нуклеосомы несут одну метку, и ридер удерживается на них слабо. Поэтому занятость падает сильнее, чем доля меченых нуклеосом (23 % против 33 %).", "p3b_2_w2": "Ридер узнаёт только нуклеосомы с ацетилом, поэтому его занятость определяется их долей. Стиратель уменьшает эту долю, и занятость ридера снижается вместе с ней.", "p3b_3_q": "На локусе активности писателя p300/CBP и стирателя HDAC в норме (по 100 %), ацетил несёт половина нуклеосом. Обе активности повысили вдвое. Как изменятся доля нуклеосом с ацетилом на H3K27 в новом установившемся состоянии и время выхода на этот уровень?", "p3b_3_o1": "Доля вырастет, потому что писатель ставит метку чаще; время выхода останется прежним.", "p3b_3_o2": "Доля останется прежней, потому что отношение активностей то же; время выхода сократится.", "p3b_3_o3": "Доля снизится, потому что стиратель снимает метку чаще; время выхода сократится.", "p3b_3_k": "Уровень метки задаётся отношением активностей, а скорость её обновления — их суммой: при одновременном росте обеих активностей отношение не меняется, а сумма вырастает.", "p3b_3_e": "В модели доля нуклеосом с ацетилом остаётся 50 %, занятость ридера тоже 50 %, а время выхода на новый уровень сокращается с 5,0 до 2,5 мин. По уровню метки в одной временной точке оборот метки оценить нельзя: нужен временной ряд, например масс-спектрометрия с изотопной меткой (Zee 2010, по реферату). Одновременный рост обеих активностей в клетках в литературе этого вопроса не измерен.", "p3b_3_w1": "Рост активности писателя сам по себе поднял бы метку, но здесь вдвое выросла и активность стирателя: скорость снятия метки возросла в той же мере, и баланс не сдвинулся.", "p3b_3_w3": "Рост активности стирателя сам по себе снизил бы метку, но здесь вдвое выросла и активность писателя: скорость постановки метки возросла в той же мере, и баланс не сдвинулся.", "gn_k_writer": "Писатель p300/CBP", "g_k_writer": "p300 и CBP — ферменты, ставящие ацетил на лизины гистонов, в том числе на K27 гистона H3; кофактор реакции — ацетил-КоА. В сцене 3b активность писателя — ручка: чем она выше, тем быстрее нуклеосомы без метки получают ацетил. Ингибитор A-485 конкурирует с ацетил-КоА и в клетках PC-3 за 3 ч снижает H3K27ac, не снижая H3K9ac (Lasko 2017); это показывает действие на конкретные метки, а не на всё ацетилирование.", "gn_k_eraser": "Стиратель HDAC", "g_k_eraser": "Гистоновые деацетилазы (HDAC) снимают ацетил с лизинов гистонов. В сцене 3b стиратель обобщён: изоформы и комплексы HDAC не различаются, а скорость снятия метки пропорциональна доле нуклеосом с ацетилом. Хемопротеомика ингибиторов HDAC показывает, что они действуют на комплексы HDAC, а не на отдельные изоформы (Bantscheff 2011, по реферату).", "gn_k_reader": "Ридер BRD4", "g_k_reader": "BRD4 — белок семейства BET: его бромодомены узнают ацетил-лизин. В сцене 3b занятость ридера зависит от доли нуклеосом с ацетилом по пороговой кривой. Одиночный ацетил-лизин связывается слабо, а близко расположенные ацетил-лизины — заметно сильнее (Filippakopoulos 2012); поэтому в модели принят пороговый отклик, число кооперативности подобрано (допущение). Ингибитор JQ1 занимает кармашек бромодоменов семейства BET, а не только BRD4 (Filippakopoulos 2010).", "gn_k_mark": "Остаток K27 гистона H3", "g_k_mark": "Лизин 27 гистона H3 может быть без метки, ацетилирован или триметилирован; на одной копии остатка две метки не совмещаются. В сцене 3b показана одна метка — ацетил; триметилирование (PRC2, KDM6) и конкуренция меток за остаток — в продвинутой сцене. Метка сама по себе не означает, что ген включён или подавлен: активность гена измеряют отдельно.", "gn_k_measure": "Как измеряют", "g_k_measure": "Показания сцены — расчёт модели, а не измерение. Долю нуклеосом с меткой оценивают масс-спектрометрией гистонов или ChIP метки, занятость ридера — ChIP ридера, время выхода на новый уровень — временным рядом после изменения активности фермента. Масс-спектрометрия с изотопной меткой даёт скорости образования метилирования (Zee 2010, по реферату); ChIP даёт относительные величины и не показывает абсолютную долю нуклеосом. В продвинутой сцене блот рисует полосы по модели: интенсивность растёт с логарифмом показания (от ×0,1 до ×10) и насыщается, поэтому отсутствие полосы не означает нулевое содержание, а число полос не равно потоку реакции. Общий H3K27me3 (иммуноблот) и локальный H3K27me3 (ChIP в локусе нуклеации PRC2) — разные показания и в модели могут меняться в разные стороны.", "gn_k_model": "Что упрощено", "g_k_model": "Модель содержит два состояния нуклеосом (без метки и с ацетилом): скорость постановки метки пропорциональна доле нуклеосом без метки, скорость снятия — доле нуклеосом с меткой. Константы подобраны так, чтобы при нормальных активностях метку несла половина нуклеосом, а время выхода на новый уровень составляло 5 мин. Порядок минут принят по возврату ацетилирования в дрожжах (Katan-Khaykovich 2002, по реферату); для p300/CBP и HDAC человека константы не измерены, поэтому время подписано «учебная модель». В продвинутой сцене остаток K27 имеет три несовместимых состояния (без метки, ацетил, триметил), переходы идут только через состояние без метки; me1 и me2 не показаны. Не показаны распространение метки по решётке нуклеосом, память, деления клеток, фармакокинетика и проникновение препаратов в клетку, изоформы HDAC, LSD1; доли метки усреднены по нуклеосомам локуса. Времена: ацетилирование — минуты (порядок из дрожжей), метилирование — часы (порядок перенесён с H3K9me3 клеток мыши, Hathaway 2012); периодов полужизни H3K27me3 и H3K27ac человека нет. Перекрёстные сдвиги меток (например, снижение H3K27ac при росте H3K27me3) — следствие допущения «один остаток», а не измерение. Мутантный гистон K27M (сцена 3a) задан функцией, общей с вкладкой 4: общий H3K27me3 снижается до 20 % исходного при доле K27M 17 % (26 % при 10 %), локальный растёт в 1,5 раза; сила ингибирования PRC2 мутантным гистоном подобрана под эту функцию, а числа взяты из согласования между вкладками, а не из измерения.", "gn_k_prc2": "Писатель PRC2 (EZH2)", "g_k_prc2": "PRC2 — комплекс, метилирующий H3K27 до триметила; каталитическая субъединица — EZH2, кофактор — SAM. Субъединица EED узнаёт H3K27me3 и повышает активность комплекса: в опытах in vitro с олигонуклеосомами насыщающий триметилпептид увеличивал активность примерно в семь раз (Margueron 2009). Активные метки H3K4me3 и H3K36me2/3 тормозят PRC2 in vitro (Schmitges 2011, по реферату). Таземетостат (EPZ-6438) конкурирует с SAM за EZH2 (Knutson 2014, по реферату). В сцене 3a обратная связь задана допущением: исходная сила подобрана, а число семь — предел при насыщении.", "gn_k_kdm": "Стиратель KDM6 (JmjC-деметилазы)", "g_k_kdm": "Деметилазы семейства KDM6 снимают метил с H3K27me3; для реакции нужны α-кетоглутарат и Fe²⁺. Ингибитор GSK-J4 в клетках повышал H3K27me3 (Kruidenier 2012), но роль именно KDM6 в этом эффекте оспаривается (Heinemann 2014). Онкометаболит 2-HG конкурирует с α-КГ и подавляет α-КГ-зависимые диоксигеназы (Xu 2011, по реферату). В модели стиратель метилирования — одна реакция; LSD1 и другие деметилазы не представлены.", "gn_k_eed": "Ридер EED", "g_k_eed": "EED — субъединица PRC2 с ароматической клеткой, узнающей H3K27me3. Связывание с триметилом повышает активность EZH2 и распространяет метку на соседние нуклеосомы (Margueron 2009). В сцене 3a занятость EED — пороговая функция доли триметилированных копий (пороги и кооперативность — допущение, потому что Kd к нуклеосомам не найден); ей пропорциональна обратная связь на схеме.", "gn_k_drugs": "Препараты и мутант в сцене 3a", "g_k_drugs": "A-485 конкурирует с ацетил-КоА за p300/CBP (Lasko 2017). Вориностат подавляет деацетилазы HDAC; изоформы в модели не различаются. JQ1 вытесняет белки BET с ацетилированного хроматина, не меняя саму метку (Filippakopoulos 2010). Таземетостат конкурирует с SAM за EZH2 (Knutson 2014). GSK-J4 подавляет деметилазы KDM6 и, возможно, другие (Kruidenier 2012; Heinemann 2014). 2-HG конкурирует с α-КГ (Xu 2011). K27M — замена лизина 27 метионином в части копий гистона H3: мутантный гистон ингибирует PRC2 (Lewis 2013), общий H3K27me3 падает, а в части локусов растёт (Chan 2013). Дозы всех препаратов заданы в единицах эффективной Ki: Ki в клетках не равна Ki in vitro, например для JQ1 Kd 50–90 нМ in vitro, а в опытах на клетках применяли около 500 нМ (Filippakopoulos 2010); нМ на экран не выносятся.", "lg_k_ac": "Ac — ацетил на K27 гистона H3", "lg_k_rd": "Треугольник — ридер на нуклеосоме с меткой (пунктир — свободный сайт)", "s3_h": "ч", "s3_d": "сут", "s3a_title": "Остаток K27 гистона H3: три несовместимых состояния", "s3a_st_a": "Ацетил", "s3a_st_u": "Без метки", "s3a_st_m": "Триметил", "s3a_hat_nm": "p300/CBP", "s3a_hdac_nm": "HDAC", "s3a_prc_nm": "PRC2", "s3a_kdm_nm": "KDM6", "s3a_brd_nm": "Ридер BRD4", "s3a_eed_nm": "Ридер EED", "s3a_cof_ac": "ацетил-КоА", "s3a_cof_sam": "SAM", "s3a_cof_akg": "α-КГ, Fe²⁺", "s3a_fb": "обратная связь", "s3a_scale": "Доли — среди копий H3 без замены K27M; прозрачность стрелок — скорость реакции.", "s3a_ki": "Ki", "s3a_qT": "K27M: {q} копий H3", "s3a_drug": "Препарат", "s3a_drug_none": "Без препарата", "s3a_sh_a485": "A-485", "s3a_sh_saha": "Вориностат", "s3a_sh_jq1": "JQ1", "s3a_sh_taz": "Таземетостат", "s3a_sh_gsk": "GSK-J4", "s3a_sh_hg": "2-HG", "s3a_sh_k27m": "K27M", "s3a_sh_enz": "изменена активность фермента или кофактора", "s3a_sh_ref": "Контроль", "s3a_sh_now": "Сейчас", "s3a_sh_multi": "несколько воздействий", "s3a_dose": "Доза препарата, в единицах эффективной Ki", "s3a_q": "Доля копий H3 с заменой K27M", "s3a_en_t": "Ферменты и кофактор", "s3a_wa": "Писатель ацетила (p300/CBP), % нормы", "s3a_ea": "Стиратель ацетила (HDAC), % нормы", "s3a_wm": "Писатель метила (PRC2), % нормы", "s3a_em": "Стиратель метила (KDM6), % нормы", "s3a_cac": "Ацетил-КоА, % нормы", "s3a_t": "время после воздействия (учебная модель, логарифмическая ось)", "s3a_myst_btn": "Загадка: образцы X, Y, Z", "s3a_myst_show": "Показать условия образцов", "s3a_myst_off": "Выйти из загадки", "s3a_drugs_btn": "Препараты и мутант", "s3a_r_ac": "H3K27ac, иммуноблот", "s3a_r_me": "H3K27me3, иммуноблот (общий)", "s3a_r_mel": "H3K27me3, ChIP (локус нуклеации PRC2)", "s3a_r_brd": "BRD4 на хроматине, ChIP", "s3a_r_rna": "Новосинтезированная РНК гена, зависимого от BRD4", "s3a_r_k9": "H3K9ac, контрольная метка", "s3a_ref": "Показания — расчёт учебной модели: условный индекс, 1,0 = исходное значение (серая метка на полосе); шкала логарифмическая, от ×0,1 до ×10. Время отсчитывается от воздействия.", "s3a_plot_t": "График во времени", "s3a_plot_aria": "График: H3K27ac, общий H3K27me3 и BRD4 на хроматине в зависимости от времени; обе оси логарифмические", "s3a_plot_leg": "Сплошная линия — H3K27ac, пунктир — общий H3K27me3, точки — BRD4 на хроматине; ось Y — кратность к исходному, ось времени — от 1 мин до 3 сут (учебная модель), вертикальная черта — курсор.", "s3a_blot_t": "Накопительный блот", "s3a_blot_add": "Добавить дорожку", "s3a_blot_clear": "Очистить дорожки", "s3a_blot_hint": "Дорожки: контроль, текущие условия и до шести сохранённых. Полоса — расчёт модели: интенсивность растёт с логарифмом показания и насыщается; отсутствие полосы не означает нуля.", "s3a_b_ac": "H3K27ac", "s3a_b_me": "H3K27me3", "s3a_b_k9": "H3K9ac", "s3a_b_brd": "BRD4 (ChIP)", "s3a_b_mel": "me3, локус (ChIP)", "s3a_lane_ctl": "Дорожка 1: контроль (без воздействия), {t} после начала отсчёта.", "s3a_lane_now": "Дорожка 2: текущие условия — {c}; {t} после воздействия.", "s3a_lane_n": "Дорожка {i}: {c}; {t} после воздействия.", "s3a_myst_t": "Образцы X, Y, Z", "s3a_myst_hint": "Три образца получили разные воздействия, каждый — одно: A-485, JQ1 или мутантный гистон K27M (17 % копий H3). Измерения сделаны через {t} после воздействия.", "s3a_myst_hint2": "Условия образцов раскрыты (K27M — 17 % копий H3); измерения сделаны через {t} после воздействия.", "s3a_myst_reads": "Значения — кратность к контролю (1,0 = без воздействия); расчёт модели.", "s3a_tbl_s": "Образец", "s3a_tbl_ac": "H3K27ac", "s3a_tbl_me": "H3K27me3 (общий)", "s3a_tbl_brd": "BRD4 (ChIP)", "s3a_tbl_ctl": "Контроль", "s3a_ctl_s": "без воздействия", "s3a_myst_line2": "Образец {n}: {c}.", "s3a_c_myst": "Показаны образцы X, Y и Z и контроль через {t} после воздействия; условия образцов скрыты (K27M — 17 % копий H3).", "s3a_c_myst_z": "По знакам изменений трёх показаний (снижено, не изменено, повышено) можно определить воздействие: каждое звено схемы даёт свой набор знаков.", "s3a_c_myst2": "Условия раскрыты: каждый образец получил одно воздействие (K27M — 17 % копий H3); измерения сделаны через {t}.", "s3a_c_myst2_z": "Ингибитор писателя ацетила снижает метку и, вторично, занятость ридера; ингибитор ридера снижает только занятость; K27M в модели снижает общий H3K27me3.", "s3a_c_rest": "Без воздействий состояние остаётся исходным: H3K27ac, общий H3K27me3 и занятость BRD4 равны исходным значениям ({ac}).", "s3a_c_multi": "Включено несколько воздействий: {c}.", "s3a_c_ac_dn": "Через {t} содержание H3K27ac снижено до {ac} от исходного.", "s3a_c_ac_eq": "Через {t} содержание H3K27ac близко к исходному ({ac}).", "s3a_c_ac_up": "Через {t} содержание H3K27ac выше исходного ({ac}).", "s3a_c_me_dn": "Общее содержание H3K27me3 снижено до {me}.", "s3a_c_me_eq": "Общее содержание H3K27me3 близко к исходному ({me}).", "s3a_c_me_up": "Общее содержание H3K27me3 выше исходного ({me}).", "s3a_c_br_dn": "Занятость BRD4 на хроматине снижена до {br}.", "s3a_c_br_eq": "Занятость BRD4 на хроматине близка к исходной ({br}).", "s3a_c_br_up": "Занятость BRD4 на хроматине выше исходной ({br}).", "s3a_c_loc": "В локусе нуклеации PRC2 H3K27me3 выше исходного ({mel}).", "s3a_cause_a485": "Причина: A-485 конкурирует с ацетил-КоА за p300/CBP.", "s3a_cause_saha": "Причина: вориностат подавляет деацетилазы HDAC.", "s3a_cause_jq1": "Причина: JQ1 вытесняет белки BET с ацетилированного хроматина и не меняет саму метку.", "s3a_cause_taz": "Причина: таземетостат конкурирует с SAM за метилтрансферазу EZH2 в составе PRC2.", "s3a_cause_gsk": "Причина: в модели GSK-J4 подавляет деметилазы KDM6.", "s3a_cause_hg": "Причина: 2-HG конкурирует с α-кетоглутаратом за деметилазы JmjC.", "s3a_cause_k27m": "Причина: в модели гистон с заменой K27M ингибирует PRC2, и метилируется меньше остальных копий H3.", "s3a_cause_enz": "Причина: изменена активность фермента или концентрация кофактора, заданная ручкой.", "s3a_z_rest": "Ацетил обновляется за минуты, а триметил за часы; без воздействий оба уровня стабильны.", "s3a_z_reader": "Занятость ридера и уровень метки — разные величины: BRD4 зависит от доли ацетилированных нуклеосом нелинейно, и препарат может снизить его занятость, не меняя метку.", "s3a_z_k27m": "Общий и локальный уровни H3K27me3 — разные показания: при K27M общий уровень падает, а у локусов нуклеации PRC2 метка накапливается.", "s3a_z_one": "На остатке K27 бывает одна из трёх меток, поэтому в модели изменение одной метки сдвигает долю другой; ацетил обновляется за минуты, метил за часы.", "s3a_z_time": "К этому моменту показания близки к исходным: метилирование обновляется за часы, ацетилирование за минуты, поэтому раннее изменение метилирования не видно.", "s3a_take": "Ацетил и триметил на K27 несовместимы, но обновляются с разной скоростью: ацетил за минуты, метил за часы. Препараты и мутации действуют на разные звенья «писатель — стиратель — ридер», поэтому по знакам изменений метки и занятости ридера можно определить, какое звено затронуто. Модель не показывает причинную роль метки в экспрессии гена: РНК рассчитана отдельно, как допущение.", "s3a_when60": "Прогноз на момент 60 мин после воздействия; ось времени — учебная модель, числа времени не измерены.", "s3a_when12": "Прогноз на момент 12 ч после воздействия; ось времени — учебная модель, числа времени не измерены.", "s3a_when3d": "Прогноз на момент 3 сут после воздействия; ось времени — учебная модель, числа времени не измерены.", "s3a_when_m": "Все данные для ответа — на экране: три образца и контроль через 3 сут после воздействия.", "s3a_ctl_norm": "Без воздействия", "p3a_1_q": "В клетках с нормальным балансом меток добавили A-485 (3,0 Ki) — ингибитор ацетилтрансфераз p300/CBP. Как изменится содержание H3K27ac через 60 мин?", "p3a_1_o1": "Снизится, потому что A-485 конкурирует с ацетил-КоА за p300/CBP, а HDAC продолжают снимать метку.", "p3a_1_o2": "Не изменится, потому что A-485 действует на метилтрансферазу PRC2, а не на ацетилтрансферазу.", "p3a_1_o3": "Вырастет, потому что A-485 подавляет деацетилазы HDAC, и ацетил перестаёт сниматься.", "p3a_1_k": "A-485 занимает центр связывания ацетил-КоА в p300/CBP, ацетил на K27 ставится медленнее, а деацетилазы продолжают его снимать; поэтому H3K27ac падает уже за десятки минут.", "p3a_1_e": "В модели через 60 мин после добавления A-485 (3,0 Ki) H3K27ac составляет ×0,44 от исходного, а занятость BRD4 на хроматине падает сильнее, до ×0,13: ридеру нужны несколько близких меток (допущение модели). Контрольная метка H3K9ac остаётся ×1,0. В клетках PC-3 A-485 за 3 ч снижает H3K27ac и не снижает H3K9ac (Lasko 2017); значения модели не являются измерениями, шкала времени — учебная модель.", "p3a_1_w2": "A-485 направлен не на метилтрансферазы, а на p300/CBP: он конкурирует с ацетил-КоА за этот фермент. Именно этот фермент ставит ацетил на H3K27, поэтому при его подавлении метка снижается.", "p3a_1_w3": "A-485 подавляет писатель, а не стиратель: деацетилазы HDAC сохраняют прежнюю активность. Ацетил ставится медленнее, а снимается с прежней скоростью, поэтому его доля падает.", "p3a_2_q": "К клеткам с нормальным балансом меток добавили вориностат (3,0 Ki) — ингибитор деацетилаз HDAC. Как изменится содержание общего H3K27me3 через 3 сут?", "p3a_2_o1": "Не изменится, потому что вориностат действует на деацетилазы, а не на метилирование.", "p3a_2_o2": "Вырастет, потому что ацетилирование K27 подготавливает остаток к триметилированию.", "p3a_2_o3": "Снизится, потому что остаток K27, занятый ацетилом, недоступен для PRC2.", "p3a_2_k": "Вориностат подавляет HDAC, доля ацетилированных K27 растёт; ацетил и триметил занимают один и тот же лизин, поэтому в модели доля копий H3 с триметилом падает.", "p3a_2_e": "В модели через 3 сут после вориностата (3,0 Ki) H3K27ac повышается до ×3,3, а общий H3K27me3 снижается до ×0,71; контрольная метка H3K9ac растёт до ×1,8. Снижение триметилирования в модели — следствие допущения «один остаток — одно состояние»: в клетках эта величина не измерена. Гиперацетилирование гистонов под действием ингибиторов HDAC показано для H4 в клетках эритролейкемии мыши (Richon 1998, по реферату).", "p3a_2_w1": "Метилирование связано с ацетилированием через общий остаток: ацетилированный K27 не может одновременно нести триметил. Поэтому подавление HDAC косвенно влияет и на метилирование.", "p3a_2_w2": "Ацетил на K27 не готовит остаток к метилированию, а занимает его: на одной копии H3 ацетил и триметил несовместимы. Рост ацетилирования уменьшает долю остатков, доступных для PRC2.", "p3a_3_q": "К клеткам с нормальным балансом меток добавили JQ1 (3,0 Ki) — ингибитор бромодоменов белков BET. Как изменится содержание H3K27ac через 12 ч?", "p3a_3_o1": "Снизится, потому что JQ1 подавляет ацетилтрансферазы p300/CBP, и метка перестаёт ставиться.", "p3a_3_o2": "Не изменится, потому что JQ1 вытесняет ридер BRD4, а метку ставят и снимают другие белки.", "p3a_3_o3": "Вырастет, потому что без BRD4 ацетил перестаёт сниматься деацетилазами HDAC.", "p3a_3_k": "JQ1 занимает кармашек бромодомена и вытесняет белки BET с ацетилированного хроматина; писатель и стиратель ацетила сохраняют прежнюю активность, поэтому доля ацетилированных нуклеосом не меняется, а занятость ридера падает.", "p3a_3_e": "В модели через 12 ч после JQ1 (3,0 Ki) H3K27ac остаётся ×1,0, BRD4 на хроматине падает до ×0,25, а новосинтезированная РНК гена, зависимого от BRD4, до ×0,25. Метка на месте, а ридер на ней не удерживается: наличие метки и работа ридера — разные величины. JQ1 связывается с бромодоменами всего семейства BET, а не только BRD4 (Filippakopoulos 2010); значения модели не являются измерениями.", "p3a_3_w1": "JQ1 направлен не на ацетилтрансферазы, а на бромодомен ридера. Ацетил ставят p300/CBP, их активность при JQ1 прежняя, поэтому метка не снижается.", "p3a_3_w3": "Ацетил снимают деацетилазы HDAC, а не BRD4: вытеснение ридера не меняет активность стирателя. Поэтому доля меченых нуклеосом остаётся прежней.", "p3a_4_q": "К клеткам с нормальным балансом меток добавили GSK-J4 (3,0 Ki) — ингибитор деметилаз KDM6. Как изменится содержание общего H3K27me3 через 3 сут?", "p3a_4_o1": "Вырастет, потому что триметил перестаёт сниматься, а PRC2 продолжает его ставить.", "p3a_4_o2": "Не изменится, потому что PRC2 замедляется вслед за KDM6 и сохраняет баланс меток.", "p3a_4_o3": "Снизится, потому что KDM6 нужны для работы PRC2 на этом остатке K27.", "p3a_4_k": "GSK-J4 снижает активность KDM6, триметил снимается медленнее, а PRC2 продолжает его ставить; поэтому доля триметилированных копий H3 растёт за часы.", "p3a_4_e": "В модели через 3 сут после GSK-J4 (3,0 Ki) общий H3K27me3 составляет ×1,9 от исходного. Остаток, занятый триметилом, недоступен для ацетила, поэтому H3K27ac в модели падает до ×0,40, а BRD4 на хроматине до ×0,10; этот перекрёстный сдвиг — следствие допущения «один остаток», а не измерение. Роль именно KDM6 в эффекте GSK-J4 в клетках оспаривается (Kruidenier 2012; Heinemann 2014).", "p3a_4_w2": "PRC2 не замедляется при подавлении KDM6: его активность задаётся собственным ферментом, кофактором SAM и обратной связью. Триметил снимается медленнее, а ставится с прежней скоростью, и его доля растёт.", "p3a_4_w3": "KDM6 не поддерживают работу PRC2: это стиратели метки. Когда их активность падает, триметил накапливается.", "p3a_5_q": "В клетках 17 % копий гистона H3 несут замену K27M. Как изменится содержание H3K27me3 в локусе нуклеации PRC2 (ChIP) через 3 сут по сравнению с клетками без замены?", "p3a_5_o1": "Снизится, как и общий уровень, потому что остаток K27M нельзя метилировать и метка не ставится.", "p3a_5_o2": "Не изменится, потому что мутантных копий H3 меньшинство, и PRC2 сохраняет активность на остальных копиях.", "p3a_5_o3": "Вырастет, хотя общий уровень падает, потому что PRC2 задерживается на K27M в локусе нуклеации.", "p3a_5_k": "Гистон K27M связывает PRC2 и ингибирует его, поэтому на остальных копиях H3 общий H3K27me3 падает; у локусов нуклеации PRC2 метка при этом сохраняется и накапливается.", "p3a_5_e": "В модели через 3 сут H3K27me3 в локусе нуклеации составляет ×1,5 от исходного, а общий H3K27me3 — ×0,20; H3K27ac растёт до ×1,2, потому что освобождается остаток (допущение «один остаток»). Рост метки в части локусов при падении общего уровня описан в клетках пациентов (Chan 2013, по реферату), ингибирование PRC2 мутантным гистоном — Lewis 2013 (по реферату). Числа модели согласованы с вопросом 4 и не являются измерениями.", "p3a_5_w1": "Общий уровень H3K27me3 действительно падает, но ChIP в локусе нуклеации показывает другое: там метка накапливается. Общий и локальный уровни — разные показания.", "p3a_5_w2": "Небольшая доля мутантных копий H3 сильно влияет на фермент: K27M связывает PRC2 и ингибирует его, поэтому на остальных нуклеосомах метка падает. Доля копий H3 не равна доле затронутых нуклеосом.", "p3a_6_q": "К клеткам с нормальным балансом меток добавили таземетостат (3,0 Ki) — ингибитор метилтрансферазы EZH2 в составе PRC2. Как изменится общий H3K27me3 через 60 мин?", "p3a_6_o1": "Снизится так же быстро, как H3K27ac под действием A-485, потому что обе метки обновляются за минуты.", "p3a_6_o2": "Почти не изменится, потому что триметильная метка обновляется за часы, и старая метка сохраняется.", "p3a_6_o3": "Вырастет, потому что PRC2 компенсирует подавление EZH2 усилением обратной связи через EED.", "p3a_6_k": "Таземетостат конкурирует с SAM за EZH2 и замедляет постановку триметила; триметил снимается медленно, поэтому за час доля меченых нуклеосом почти не меняется.", "p3a_6_e": "В модели через 60 мин после таземетостата (3,0 Ki) общий H3K27me3 составляет ×0,95 от исходного, H3K27ac — ×1,0, BRD4 на хроматине — ×1,1. Тот же час под действием A-485 снижает H3K27ac почти вдвое (шаг 1). Порядок «часы» для метилирования перенесён с другой метки (H3K9me3, стволовые клетки мыши; Hathaway 2012): периодов полужизни H3K27me3 в литературе вопроса нет; шкала времени — учебная модель.", "p3a_6_w1": "Ацетилирование и метилирование обновляются с разной скоростью: ацетил за минуты, триметил за часы. Новая метка после ингибирования EZH2 не ставится, но уже поставленный триметил снимается медленно.", "p3a_6_w3": "Обратная связь через EED усиливает PRC2 на нуклеосомах, уже несущих триметил, и не компенсирует подавление самого фермента: когда метки становится меньше, обратная связь слабеет.", "p3a_7_q": "В клетках под действием A-485 (3,0 Ki) H3K27ac через 60 мин снижено. Концентрацию ацетил-КоА повысили вдвое. Как изменится H3K27ac по сравнению с A-485 при нормальной концентрации ацетил-КоА?", "p3a_7_o1": "Вырастет, потому что A-485 конкурирует с ацетил-КоА за центр связывания в p300/CBP.", "p3a_7_o2": "Не изменится, потому что A-485 связывается с p300/CBP прочно, и ацетил-КоА его не вытесняет.", "p3a_7_o3": "Снизится ещё сильнее, потому что избыток ацетил-КоА усиливает связывание A-485 с p300/CBP.", "p3a_7_k": "A-485 и ацетил-КоА конкурируют за один центр p300/CBP; при большей концентрации ацетил-КоА меньше ферментов занято ингибитором, и ацетилирование восстанавливается частично.", "p3a_7_e": "В модели через 60 мин H3K27ac равно ×0,44 при нормальном ацетил-КоА и ×0,70 при вдвое повышенном; занятость BRD4 на хроматине растёт с ×0,13 до ×0,46. In vitro IC50 A-485 возрастает пропорционально концентрации ацетил-КоА (Lasko 2017); значения модели не являются измерениями. Уровень ацетил-КоА в клетках зависит от метаболизма: в модели это ручка, а не наблюдение.", "p3a_7_w2": "A-485 — конкурентный ингибитор: он занимает центр связывания ацетил-КоА, поэтому при повышении концентрации кофактора часть ферментов связывает ацетил-КоА, и ацетилирование восстанавливается.", "p3a_7_w3": "Конкуренция идёт в обратную сторону: чем больше ацетил-КоА, тем чаще центр p300/CBP занимает кофактор, а не ингибитор. Эффект A-485 при этом слабеет, а не усиливается.", "p3a_8_q": "В трёх образцах клеток через 3 сут после воздействия измерены H3K27ac, общий H3K27me3 и занятость BRD4 (дорожки X, Y, Z; контроль — клетки без воздействия). Воздействиями были A-485, JQ1 и мутантный гистон K27M (17 % копий H3), каждое в одном образце. Какое воздействие получил образец X?", "p3a_8_o1": "JQ1, потому что он снижает занятость BRD4 и уровень метки H3K27ac.", "p3a_8_o2": "K27M, потому что в этом образце сильно изменён общий уровень H3K27me3.", "p3a_8_o3": "A-485, потому что снижены H3K27ac и BRD4, а H3K27me3 почти не изменён.", "p3a_8_k": "A-485 снижает H3K27ac, а занятость BRD4 падает вторично, потому что ридеру нужен ацетил; общий H3K27me3 при этом почти не меняется. JQ1 снижает только занятость BRD4, K27M — общий H3K27me3.", "p3a_8_e": "Образец X: H3K27ac ×0,42, общий H3K27me3 ×1,1, BRD4 ×0,11 — снижены ацетил и занятость ридера, метилирование не снижено: это A-485. Образец Y: ×1,0, ×1,0, ×0,25 — метки не изменены, занятость ридера снижена: это JQ1. Образец Z: ×1,2, ×0,20, ×1,7 — общий H3K27me3 снижен, а ацетил и BRD4 выше исходных (в модели, из допущения «один остаток»): это K27M. Ответ определяют знаки изменений; точные величины — результат модели, а не измерение.", "p3a_8_w1": "JQ1 снижает занятость BRD4, но не меняет H3K27ac: он вытесняет ридер и не влияет на работу писателя. В образце X метка ацетилирования снижена, поэтому JQ1 не подходит.", "p3a_8_w2": "K27M снижает общий H3K27me3, а в образце X он не снижен (×1,1). Снижение ацетилирования и BRD4 при K27M не ожидается: в модели ацетил при K27M растёт.", "s4_key": "Один локус: 12 условных нуклеосом", "s4_n": "Число делений: {n}", "s4_row1": "Начало цикла", "s4_row1_0": "Исходное состояние", "s4_row2": "Конец цикла", "s4_row3": "После деления", "s4_v_par": "родит. {v}", "s4_v_h33": "H3.3 {v}", "s4_v_h31": "H3.1 {v}", "s4_arr_turn": "замена нуклеосом на месте", "s4a_arr_norep": "деления нет: состав прежний", "s4_arr_div": "деление: половина мест достаётся новым", "s4_chap_note": "H3.3 вносит HIRA, H3.1 — CAF-1", "s4_tx": "Транскрипция локуса", "s4_note": "Учебная модель: числа — расчёт, а не измерение", "s4_how": "Как измеряют", "s4_lim": "Что упрощено", "lg_v_nuc": "кружок — нуклеосома локуса: бирюзовый — родительская, светлый — новая с H3.1, оранжевый — новая с H3.3", "gn_v_nuc": "Нуклеосомы локуса", "g_v_nuc": "На схеме показаны 12 условных нуклеосом одного локуса. Бирюзовый кружок — родительская нуклеосома, то есть та, что стояла на локусе к началу наблюдения. Светлый кружок — новая нуклеосома с H3.1, оранжевый — новая нуклеосома с H3.3, вставленным после начала наблюдения. Число кружков каждого вида — доля, рассчитанная моделью и округлённая до целого числа кружков; точные доли подписаны справа от рядов.", "s4b_n_c": "Число делений (учебная модель)", "s4b_tx_c": "Транскрипция локуса", "s4b_tx_0": "низкая", "s4b_tx_1": "высокая", "s4_r_par": "Родительские нуклеосомы локуса, доля", "s4_r_h33": "Новый H3.3 на локусе, доля нуклеосом", "s4_r_h31": "Новые нуклеосомы с H3.1, доля", "s4b_ref": "Серая метка — тот же локус с низкой транскрипцией при том же числе делений. Показания — сразу после последнего деления; «новый H3.3» — H3.3, вставленный после начала наблюдения.", "s4b_plot_t": "Состав нуклеосом локуса по числу делений (учебная модель)", "s4b_ln_par": "родительские", "s4b_ln_h33": "новый H3.3", "s4b_ln_h31": "новые с H3.1", "s4b_ln_dil": "2^(−n) без оборота", "s4_unit_n": "дел.", "s4b_tb_cap": "Доли нуклеосом локуса при текущем числе делений и при шести делениях", "s4b_tb_name": "Величина", "s4b_tb_now": "{n} дел.", "s4b_tb_end": "{n} дел.", "s4b_c_n0": "До первого деления все нуклеосомы локуса родительские: они стояли на ДНК к началу наблюдения.", "s4b_c_n0_z": "Это точка отсчёта: от неё считается, какая часть локуса сохраняет прежние гистоны вместе с их метками (метки — вопрос 3).", "s4b_c_near": "После {n} дел. родительских нуклеосом {p}; при одном лишь делении было бы {d}. Оборот между делениями мал, места освободились в основном при репликации и заняты новыми нуклеосомами: H3.1 — {h31}, H3.3 — {h33}.", "s4b_c_near_z": "Доля родительских нуклеосом показывает, какая часть локуса сохраняет старые гистоны вместе с их метками (метки — вопрос 3).", "s4b_c_part": "После {n} дел. родительских нуклеосом {p} — меньше, чем при одном лишь делении ({d}): между делениями часть нуклеосом заменяется на месте, и на их место встаёт H3.3 (сейчас его {h33}).", "s4b_c_part_z": "Замена на месте убирает старые гистоны с заменённых нуклеосом независимо от деления; метки на новых нуклеосомах ставятся отдельно (вопрос 3).", "s4b_c_below": "После {n} дел. родительских нуклеосом {p}, заметно меньше, чем при одном лишь делении ({d}). Между делениями большая часть локуса заменяется на месте, поэтому новый H3.3 занимает {h33} нуклеосом.", "s4b_c_below_z": "Чем быстрее оборот на локусе, тем меньше на нём остаётся старых гистонов с их метками; одно деление этого не объясняет.", "s4b_take": "Каждое деление примерно вдвое уменьшает долю родительских нуклеосом локуса: родительские тетрамеры (H3–H4)₂ расходятся по двум дочерним нитям, а освободившиеся места занимают новые нуклеосомы. H3.1 вносится при репликации (шаперон CAF-1), H3.3 — и вне репликации (шаперон HIRA). На участках с быстрым оборотом старых нуклеосом остаётся меньше, чем при одном лишь делении. Модель показывает состав нуклеосом, но не метки на них и не активность гена.", "gn_v_hira": "HIRA", "g_v_hira": "HIRA — шаперон гистонов, который вносит H3.3 в нуклеосомы независимо от синтеза ДНК (Tagami 2004). В эмбриональных стволовых клетках и нейральных предшественниках мыши HIRA нужен для H3.3 в активных и репрессированных генах, но не обязателен на теломерах: там H3.3 вносит комплекс ATRX–DAXX (Goldberg 2010; Lewis 2010). Схема показывает HIRA как путь замены нуклеосом на месте; число замен в модели — допущение.", "gn_v_caf1": "CAF-1", "g_v_caf1": "CAF-1 — шаперон гистонов, связанный с репликацией: комплексы H3.1 и H3.3 содержат разные шапероны (CAF-1 и HIRA) и обеспечивают сборку нуклеосом, соответственно зависимую и независимую от синтеза ДНК (Tagami 2004). Поэтому на схеме H3.1 вносится при делении, а H3.3 — и при делении, и между делениями.", "gn_v_measure": "Как измеряют состав нуклеосом", "g_v_measure": "Новый H3.3 отслеживают индуцируемой меткой (HA- или FLAG-H3.3) и ChIP-seq: в эмбриональных фибробластах мыши (NIH/3T3) при блоке S-фазы чёткие пики нового H3.3 появляются на промоторах и энхансерах через 2–3 ч, на теломерах — через 48–72 ч (Kraushaar 2013). Доли старых и новых гистонов определяют изотопной меткой SILAC и масс-спектрометрией в клетках человека (Alabert 2015). Оборот всех нуклеосом измеряют меткой азидогомоаланином в клетках Drosophila (Deal 2010). ChIP показывает положение варианта, но не возраст нуклеосомы.", "gn_v_model": "Что упрощено в модели состава нуклеосом", "g_v_model": "Модель считает три доли локуса: родительские нуклеосомы, новые нуклеосомы с H3.1 и новый H3.3. Из работ взяты потеря гистона H4 около 0,4 % в час (Alabert 2015, клетки человека; при цикле 24 ч это около 9 % за цикл) и расхождение родительских тетрамеров по двум дочерним нитям (Petryk 2018, клетки мыши; Yu 2018, дрожжи: в обеих работах уклон к одной из нитей слабый, в модели принято строго поровну). Допущения: цикл длится 24 ч; при высокой транскрипции каждая нуклеосома заменяется в среднем один раз за цикл (порядок по Deal 2010 для Drosophila, для клеток человека не измерен); 20 % новых нуклеосом при репликации приходится на H3.3 (в новом хроматине H3.3 так же обилен, как в геноме в целом: Alabert 2015). Расщепление тетрамеров H3.3–H4 при репликации (Xu 2010) в расчёт не входит: числа в работе нет. Модель не различает промотор, тело гена и энхансер. В сцене продвинутого уровня добавлены три расчёта. K27M: шкала доли мутантного гистона q подогнана так, чтобы при q = 17 % глобальный H3K27me3 был в пять раз ниже исходного, — это подгонка под пятикратный рост H3K27me3 при удалении K27M в линиях глиом человека (среднее по Harutyunyan 2019); диапазон q 3–17 % процитирован во введении той же работы и сам не измерялся, то есть это цитата, а не измерение. CENP-A: около 400 молекул на центромеру (Bodor 2014); старые молекулы делятся поровну (Jansen 2007), новые достраивает HJURP. γH2AX: около 1 % H2AX на 1 Гр и максимум за 10 мин (Rogakou 1998); время затухания в работах не дано, поэтому затухание выражено условными единицами, а не минутами. Число разрывов (35 на 1 Гр) и область около 2 млн п.н. вокруг разрыва — оценки авторов Rogakou 1998, а не измерения; линейность по дозе вне 1 Гр — допущение. При подавленной PP2A скорость снятия фосфата в модели снижена в пять раз — допущение: в работе (Chowdhury 2005) измерено направление, величина не дана. Индекс γH2AX при стрессе репликации (0,5) условный и с долей от дозы излучения несравним. При потере HIRA или ATRX–DAXX остаточная доля нового H3.3 принята равной 20 % от нормы — допущение: в работах (Goldberg 2010; Lewis 2010) измерено направление, величина не дана.", "s4b_ctl": "исходное состояние шага", "s4b_when": "Число делений и транскрипция заданы условием шага и закреплены до показа ответа; показания — сразу после последнего деления.", "p4b_1_q": "На локусе с низкой транскрипцией прошло одно деление. Как изменится доля родительских нуклеосом, если клетки пройдут ещё два деления?", "p4b_1_o1": "Не изменится: родительские нуклеосомы остаются на ДНК и после деления.", "p4b_1_o2": "Уменьшится: при репликации половину мест занимают новые нуклеосомы.", "p4b_1_o3": "Увеличится: при репликации родительские нуклеосомы копируются вместе с ДНК.", "p4b_1_k": "Репликация удваивает число мест на ДНК, а число родительских тетрамеров (H3–H4)₂ не растёт: они расходятся по двум дочерним нитям, и половина мест достаётся новым нуклеосомам. Поэтому доля родительских нуклеосом на каждом делении уменьшается примерно вдвое.", "p4b_1_e": "В этой модели доля родительских нуклеосом снижается с 45 % после одного деления до 9 % после трёх; без оборота она составила бы 50 % и 12,5 % (2^(−n)). Доля нового H3.3 растёт с 15 % до 24 %, доля новых нуклеосом с H3.1 — с 40 % до 66 %. Разведение вдвое на деление следует из почти симметричного расхождения родительских тетрамеров по дочерним нитям (Petryk 2018, эмбриональные стволовые клетки мыши; Yu 2018, дрожжи). Небольшой фоновый оборот гистона H4 в клетках человека (Alabert 2015; число и допущение о длительности цикла — в справке «Что упрощено») добавляет потерю между делениями, поэтому доля чуть ниже 2^(−n). Числа — расчёт учебной модели, а не измерение.", "p4b_1_w1": "Вариант не учитывает, что репликация удваивает число мест на ДНК, а число родительских тетрамеров остаётся прежним: на каждой дочерней нити их вдвое меньше, чем было на материнской.", "p4b_1_w3": "Вариант принимает, что нуклеосомы копируются вместе с ДНК. Нуклеосомы не копируются: репликация копирует ДНК, родительские нуклеосомы расходятся по дочерним нитям, а освободившиеся места заполняют вновь собранные нуклеосомы (с H3.1 — при участии шаперона CAF-1).", "p4b_2_q": "На локусе после двух делений транскрипция низкая. Как изменится доля нового H3.3, вставленного после начала наблюдения, если транскрипция локуса станет высокой?", "p4b_2_o1": "Не изменится: H3.3 вносится только при репликации, а делений столько же.", "p4b_2_o2": "Уменьшится: на активных участках H3.1 вытесняет H3.3 при замене.", "p4b_2_o3": "Увеличится: нуклеосомы чаще заменяются на месте, и на их место встаёт H3.3.", "p4b_2_k": "Замена нуклеосомы на месте идёт без синтеза ДНК: шаперон HIRA вносит H3.3 (Tagami 2004). Чем быстрее оборот на локусе, тем больше мест между делениями занимает новый H3.3.", "p4b_2_e": "В этой модели при двух делениях доля нового H3.3 на локусе растёт с 21 % при низкой транскрипции до 49 % при высокой; доля родительских нуклеосом падает с 21 % до 3 %, доля новых нуклеосом с H3.1 — с 58 % до 47 %. Рост следует из допущения о частоте замен: при низкой транскрипции за цикл заменяется небольшая доля нуклеосом (по скорости потери гистона H4: Alabert 2015, клетки человека), при высокой — в среднем одна замена на нуклеосому за цикл (числа — в справке «Что упрощено»). Для клеток человека скорость оборота на активных участках не измерена; порядок ориентирован на Deal 2010 (клетки Drosophila: средняя продолжительность жизни нуклеосом около 1 ч за стартом транскрипции активных генов при цикле около 15 ч) и на Kraushaar 2013 (эмбриональные фибробласты мыши: у промоторов новый H3.3 появляется через 2–3 ч).", "p4b_2_w1": "Вариант переносит на H3.3 свойство H3.1. Сборка с участием CAF-1 связана с синтезом ДНК, а сборка с участием HIRA от него не зависит (Tagami 2004), поэтому при том же числе делений H3.3 вносится в заменённые нуклеосомы.", "p4b_2_w2": "Вариант предполагает конкуренцию H3.1 и H3.3 за места при замене. В модели замену на месте проводит HIRA и вносит H3.3; доля новых нуклеосом с H3.1 снижается потому, что их заменяет H3.3, а не потому, что H3.1 вытесняет H3.3.", "p4b_3_q": "После трёх делений на локусе с низкой транскрипцией часть нуклеосом остаётся родительской. Как изменится доля родительских нуклеосом при высокой транскрипции и том же числе делений?", "p4b_3_o1": "Уменьшится: на активном локусе нуклеосомы заменяются и между делениями.", "p4b_3_o2": "Не изменится: доля родительских нуклеосом определяется числом делений.", "p4b_3_o3": "Увеличится: активная транскрипция удерживает нуклеосомы на месте.", "p4b_3_k": "Деление разводит родительские нуклеосомы по закону 2^(−n), а замена на месте уменьшает их долю дополнительно: заменённая нуклеосома перестаёт быть родительской, даже если локус не реплицировался. На активном локусе таких замен между делениями больше.", "p4b_3_e": "В этой модели после трёх делений доля родительских нуклеосом составляет 9 % при низкой транскрипции и 1 % при высокой; без оборота она была бы 12,5 % (2^(−3)). Доля нового H3.3 растёт с 24 % до 51 %, доля новых нуклеосом с H3.1 снижается с 66 % до 49 %. Частота замен — допущение модели (при низкой транскрипции — небольшая доля нуклеосом за цикл по скорости потери гистона H4 в клетках человека: Alabert 2015; при высокой — в среднем одна замена на нуклеосому за цикл, по порядку из Deal 2010 для Drosophila и Kraushaar 2013 для клеток мыши). Расчёт показывает направление и порядок эффекта, а не измеренную долю для человека.", "p4b_3_w2": "Вариант считает деление единственным источником разведения. В модели родительская нуклеосома теряется и при замене на месте; чем чаще замены, тем меньше родительских нуклеосом остаётся при том же числе делений.", "p4b_3_w3": "Вариант переворачивает связь: в работах транскрипция и активные метки связаны с более быстрым, а не с более медленным оборотом нуклеосом (Deal 2010, клетки Drosophila; Kraushaar 2013, клетки мыши), поэтому на активном локусе родительские нуклеосомы заменяются чаще.", "s4a_chap_note": "H3.3 вносят HIRA (гены) и ATRX–DAXX (теломеры), H3.1 — CAF-1", "s4a_row2_norep": "Конец цикла (деления нет)", "s4a_row3_norep": "Репликации нет: состав не меняется", "s4a_tx_tel": "не задаётся", "s4a_cen_key": "Один центромерный локус: число молекул CENP-A", "s4a_cen_t": "CENP-A на одном центромере", "s4a_cen_plat": "≈ 400 молекул", "s4a_cen_v1": "всего на центромере: {v}", "s4a_cen_v2": "старых (были до начала наблюдения): {v}", "s4a_cen_v3": "новых (достроены HJURP): {v}", "s4a_ph_0": "исходное состояние", "s4a_ph_post": "сразу после митоза", "s4a_ph_g1": "G1 после сборки", "s4a_ph_c": "Фаза цикла", "s4a_hjurp_note": "достраивает CENP-A в G1", "s4a_dsb_key": "Один двунитевой разрыв ДНК и окружающий хроматин", "s4a_dsb_dom": "≈ 2 млн п.н. хроматина вокруг разрыва (расчёт авторов)", "s4a_dsb_v": "γH2AX: {v} всего H2AX", "s4a_dsb_v_rs": "γH2AX (условный индекс): {v}", "s4a_dsb_n": "{d} Гр, {m} мин", "s4a_dsb_note": "ATM и DNA-PK действуют избыточно; ATR — при стрессе репликации; PP2A снимает фосфат", "s4a_myst_svg1": "Три образца: X, Y, Z", "s4a_myst_svg2": "Три образца: у каждого одно вмешательство, условия скрыты. Данные — в таблице ниже: новый H3.3 на генах и на теломерах после трёх делений и H3K27me3 глобально.", "s4a_loc_c": "Локус", "s4a_loc_gene": "активный ген", "s4a_loc_tel": "теломера", "s4a_loc_cen": "центромера", "s4a_loc_dsb": "двунитевой разрыв", "s4a_iv_c": "Вмешательство", "s4a_iv_none": "нет", "s4a_iv_hira": "потеря HIRA", "s4a_iv_atrx": "потеря ATRX–DAXX", "s4a_iv_rep": "блок репликации", "s4a_iv_hjurp": "потеря HJURP", "s4a_iv_k27m": "K27M в H3", "s4a_iv_kin": "подавлены ATM и DNA-PK", "s4a_iv_pp2a": "подавлена PP2A", "s4a_iv_rs": "стресс репликации", "s4a_n_c": "Число делений (учебная модель)", "s4a_n_c_rep": "Число циклов (деления нет)", "s4a_n_c_cen": "Число делений", "s4a_q_c": "Доля мутантного H3 (K27M), q", "s4a_D_c": "Доза излучения", "s4a_tm_c": "Время после облучения", "s4a_u_c": "Затухание сигнала, условные единицы (не минуты)", "s4a_inst_c": "Прибор (что показывает график)", "s4a_inst_chip": "ChIP-seq H3.3", "s4a_inst_silac": "SILAC-масс-спектрометрия (возраст)", "s4a_inst_snap": "SNAP-метка CENP-A", "s4a_inst_if": "иммунофлуоресценция γH2AX", "s4a_inst_wb": "H3K27me3 (вестерн-блот)", "s4a_plot_aria": "График показания выбранного прибора; значение при текущих условиях отмечено вертикальной линией", "s4a_unit_min": "мин", "s4a_r_cen": "Молекул CENP-A на центромеру", "s4a_r_cold": "из них старых (были до начала наблюдения)", "s4a_r_br": "Разрывов ДНК на клетку (расчёт)", "s4a_r_gh": "γH2AX, доля всего H2AX", "s4a_r_rs": "γH2AX при стрессе репликации, условный индекс", "s4a_r_me3": "H3K27me3 глобально, доля от нормы", "s4a_ref": "Серая метка — тот же локус при тех же числах без вмешательства. Показания — сразу после последнего деления (или в выбранный момент после облучения).", "s4a_pl_b": "Новый H3.3 на локусе по числу делений (учебная модель)", "s4a_pl_b_n": "Цветная линия — с вмешательством, пунктир — без него.", "s4a_pl_p": "Родительские нуклеосомы по числу делений (учебная модель)", "s4a_pl_p_n": "Цветная линия — с вмешательством, точечная — без него, штриховая — 2^(−n) без оборота.", "s4a_pl_cen": "Молекулы CENP-A на центромеру по числу делений (учебная модель)", "s4a_pl_cen_n": "Синяя линия — с достройкой HJURP, штриховая — без достройки, точечная — старые молекулы.", "s4a_pl_gh": "γH2AX после облучения по времени (учебная модель)", "s4a_pl_gh_n": "Цветная линия — при выбранных условиях, штриховая — норма при той же дозе. Нарастание — по измеренным точкам (Rogakou 1998), затухание — условные единицы.", "s4a_pl_gh_u0": "Сейчас затухание равно 0: после пика γH2AX в модели не снимается, и линия остаётся на плато. Чтобы увидеть снятие фосфата, сдвиньте ползунок «Затухание сигнала».", "s4a_pl_me3": "H3K27me3 глобально по доле K27M (учебная модель)", "s4a_pl_me3_n": "Шкала доли K27M подогнана: при 17 % уровень в пять раз ниже исходного (Harutyunyan 2019, цитата, не измерение).", "s4a_c_loss_gene": "Без HIRA нового H3.3 на гене {h33} против {h33r} при нормальном шапероне; доля новых нуклеосом без H3.3 — {a}. Родительских нуклеосом {p}, почти как при нормальном шапероне.", "s4a_c_loss_gene_z": "HIRA вносит H3.3 при замене нуклеосом на месте. Без него замены идут, но H3.3 на гене почти не прибавляется; значение остаточной доли H3.3 в модели — допущение.", "s4a_c_loss_tel": "Без ATRX–DAXX нового H3.3 на теломере {h33} против {h33r} при нормальном шаперонном комплексе. Теломера обменивает нуклеосомы медленно, поэтому доля H3.3 и в норме невелика.", "s4a_c_loss_tel_z": "ATRX–DAXX — шаперонный комплекс, вносящий H3.3 на теломерных и перицентрических повторах (Goldberg 2010; Lewis 2010). На генах H3.3 вносит HIRA независимо от него.", "s4a_c_norep": "Репликации нет, поэтому разведения вдвое нет: родительских нуклеосом {p} против {pr} при делениях. Новый H3.3 — {h33}: он встраивается и без деления, на место заменённых нуклеосом.", "s4a_c_norep_z": "H3.3 вносит HIRA вне репликации, поэтому блок деления убирает разведение родительских нуклеосом, но не вставку H3.3. Новых нуклеосом с H3.1 без репликации в модели не появляется.", "s4a_c_cen_0": "До первого деления на центромере около {cen} молекул CENP-A: это плато, достигнутое сборкой в G1 (Bodor 2014).", "s4a_c_cen_0_z": "Число молекул CENP-A на центромеру задаёт «центромерное плато»; новая сборка идёт только в G1 (Jansen 2007).", "s4a_c_cen": "После {n} дел. на центромере {cen} молекул CENP-A, из них старых {cold}: каждое деление вдвое разводит старые молекулы, а в G1 HJURP достраивает недостающие до плато.", "s4a_c_cen_z": "Сразу после митоза CENP-A вдвое меньше плато; к концу G1 число восстанавливается. Старые молекулы остаются на сестринских центромерах (Jansen 2007; Falk 2015).", "s4a_c_cen_no": "Без HJURP достройки в G1 нет: после {n} дел. на центромере {cen} молекул CENP-A, все они старые. Число падает вдвое за каждое деление.", "s4a_c_cen_no_z": "HJURP — шаперон, достраивающий CENP-A в G1. Без него центромерный хроматин разводится, как родительские нуклеосомы на гене, по закону 2^(−n).", "s4a_c_dsb_0": "В модели без облучения двунитевых разрывов нет, и γH2AX практически нет ({g} всего H2AX).", "s4a_c_dsb_0_z": "H2AX фосфорилируется по серину 139 вокруг двунитевого разрыва (Rogakou 1998). Сигнал γH2AX — прибор, который показывает разрывы, а не их причину.", "s4a_c_dsb": "После облучения γH2AX — {g} всего H2AX: около 1 % на 1 Гр, максимум за 10 мин (Rogakou 1998). Область вокруг каждого разрыва — порядка 2 млн п.н. (оценка авторов).", "s4a_c_dsb_z": "γH2AX метит хроматин вокруг разрыва, чтобы собрать там ремонтные белки. Доля H2AX мала, потому что разрывов десятки на клетку, а H2AX — по всему геному.", "s4a_c_dsb_kin": "При подавленных ATM и DNA-PK γH2AX — {g} всего H2AX против {gr} в норме: фосфорилировать H2AX после облучения некому.", "s4a_c_dsb_kin_z": "ATM и DNA-PK избыточны: каждая из них фосфорилирует H2AX после облучения (Stiff 2004), поэтому подавлять надо обе. Роль одиночного ATM оценивают в работах по-разному (Burma 2001; Stiff 2004), в модель она не входит.", "s4a_c_dsb_pp2a": "При подавленной PP2A γH2AX на пике не меняется ({g}), но снимается медленнее: в модели скорость снятия фосфата снижена в пять раз.", "s4a_c_dsb_pp2a_z": "Фосфатаза PP2A дефосфорилирует γH2AX и этим завершает ответ на разрыв (Chowdhury 2005). Выраженность ослабления в модели — допущение: в работе направление измерено, величина не дана.", "s4a_c_dsb_rs": "При стрессе репликации в S-фазе (без облучения) возникает γH2AX: он зависит от ATR и показан условным индексом {rs}.", "s4a_c_dsb_rs_z": "Остановка репликационных вилок тоже запускает фосфорилирование H2AX, но через ATR, а не через ATM и DNA-PK (Ward 2001). Условный индекс нельзя сравнивать с долей от дозы излучения.", "s4a_c_k27": "При доле K27M {q} % H3K27me3 глобально составляет {me3} от нормы. На локусе состав нуклеосом не изменился: H3.3 — {h33}.", "s4a_c_k27_z": "K27M нарушает работу PRC2 и снижает H3K27me3 в среднем по геному (Lewis 2013; Harutyunyan 2019). Шкала доли K27M подогнана под пятикратный рост при его удалении (Harutyunyan 2019): число расчётное, а не измеренное.", "s4a_c_myst": "Показаны данные трёх образцов X, Y, Z; вмешательства скрыты. У каждого образца одно вмешательство.", "s4a_c_myst_z": "Сопоставьте: потеря HIRA, потеря ATRX–DAXX и K27M меняют разные величины; два прибора измеряют H3.3, третий — H3K27me3.", "s4a_c_myst2": "Условия образцов названы: X — потеря HIRA; Y — потеря ATRX–DAXX; Z — K27M в H3.", "s4a_c_myst2_z": "Один прибор не различает три вмешательства: нужны H3.3 на генах (HIRA), H3.3 на теломерах (ATRX–DAXX) и глобальный H3K27me3 (K27M).", "s4a_myst_b0": "Загадка X, Y, Z", "s4a_myst_b1": "Показать условия образцов", "s4a_myst_b2": "Вернуться к модели", "s4a_myst_tt": "Показания приборов (модель, три деления)", "s4a_tb_sample": "Образец", "s4a_tb_gene": "Новый H3.3 на генах, высокая транскрипция", "s4a_tb_tel": "Новый H3.3 на теломерах", "s4a_tb_me3": "H3K27me3 глобально, от нормы", "s4a_tb_ctl": "Контроль", "s4a_myst_note": "Числа — расчёт учебной модели при трёх делениях, а не измерения. Доли H3.3 — после начала наблюдения; H3K27me3 — доля от исходного уровня.", "s4a_take": "Состав нуклеосом локуса задают три вещи: деление разводит родительские нуклеосомы вдвое, замена на месте идёт независимо от деления, а тип вносимого гистона определяет шаперон места — HIRA на генах, ATRX–DAXX на теломерах, CAF-1 при репликации, HJURP на центромере. Прибор показывает следствие, а не причину: чтобы назвать причину, нужно сравнить несколько приборов.", "s4a_when": "Локус, число делений (или доза и время) заданы условием шага и закреплены до показа ответа; показания — сразу после последнего деления.", "s4a_when_m": "Три образца с неизвестными вмешательствами: ответ даётся по таблице показаний.", "gn_v_atrx": "ATRX–DAXX", "g_v_atrx": "DAXX — H3.3-специфичный шаперон гистонов: рекомбинантный DAXX собирает тетрамеры H3.3–H4 на ДНК, а комплекс ATRX–DAXX вносит H3.3 вне репликации (Lewis 2010). В эмбриональных стволовых клетках мыши Atrx и Daxx нужны для H3.3 на теломерах, а HIRA — для H3.3 на генах (Goldberg 2010). Модель использует только направление: потеря ATRX–DAXX снижает долю нового H3.3 на теломере до остаточной доли, принятой как допущение (20 % от нормы).", "gn_v_cenpa": "CENP-A и HJURP", "g_v_cenpa": "CENP-A — вариант гистона H3, определяющий центромеру. На типичном центромере человека около 400 молекул CENP-A (Bodor 2014). Старые молекулы делятся поровну между сестринскими центромерами, а новые добавляет шаперон HJURP в G1 после митоза (Jansen 2007). В модели без HJURP число молекул вдвое меньше после каждого деления; с HJURP оно возвращается к плато к концу G1.", "gn_v_gh2ax": "γH2AX после двунитевого разрыва", "g_v_gh2ax": "Двунитевой разрыв запускает фосфорилирование H2AX по серину 139 на протяжении мегабазного участка хроматина (Rogakou 1998; Rogakou 1999). Около 1 % H2AX фосфорилируется на 1 Гр; половина максимума достигается за минуту, максимум — за 10 минут. ATM и DNA-PK действуют избыточно (Stiff 2004); при репликативном стрессе фосфорилирование зависит от ATR (Ward 2001); PP2A снимает фосфат (Chowdhury 2005). Время затухания сигнала в этих работах не дано, поэтому в модели оно выражено условными единицами.", "gn_v_k27m": "K27M и H3K27me3", "g_v_k27m": "Замена лизина 27 на метионин в H3 (K27M) встречается в части детских глиом. K27M нарушает работу PRC2 и снижает H3K27me3 в среднем по геному, но на сотнях локусов уровень растёт (Lewis 2013; Chan 2013; Harutyunyan 2019).", "p4a_1_q": "На активном гене (высокая транскрипция) прошло три деления. Как изменится доля нового H3.3 на гене, если убрать шаперон HIRA?", "p4a_1_o1": "Не изменится: H3.3 вносится при репликации так же, как H3.1, и от HIRA не зависит.", "p4a_1_o2": "Увеличится: без HIRA замены на месте идут чаще, и H3.3 прибавляется быстрее.", "p4a_1_o3": "Уменьшится: без HIRA H3.3 на гене почти не встраивается, встают нуклеосомы без него.", "p4a_1_k": "HIRA вносит H3.3 при замене нуклеосом на месте, вне репликации (Tagami 2004; Goldberg 2010). Без него замены продолжаются, но H3.3 почти не прибавляется, а доля нуклеосом без H3.3 растёт.", "p4a_1_e": "В этой модели при трёх делениях и высокой транскрипции доля нового H3.3 падает с 51 % до 10 %, а доля новых нуклеосом без H3.3 растёт с 49 % до 89 %. Родительских нуклеосом остаётся около 1 % в обоих случаях: разведение и замена на месте от HIRA не зависят. Остаточная доля H3.3 без HIRA — допущение модели: в работе измерено направление (Goldberg 2010), а не величина.", "p4a_1_w1": "Вариант переносит на H3.3 свойство H3.1. Сборка с участием CAF-1 связана с синтезом ДНК, а HIRA вносит H3.3 вне репликации (Tagami 2004).", "p4a_1_w2": "Вариант предполагает, что потеря шаперона ускоряет замены. В модели частота замен от HIRA не зависит; от HIRA зависит только то, какой гистон встаёт на освободившееся место.", "p4a_2_q": "На теломере прошло три деления. Как изменится доля нового H3.3 на теломерном повторе, если убрать комплекс ATRX–DAXX?", "p4a_2_o1": "Уменьшится: ATRX–DAXX — шаперон, вносящий H3.3 на теломерных повторах.", "p4a_2_o2": "Не изменится: на всех локусах, включая теломеры, H3.3 вносит один шаперон HIRA.", "p4a_2_o3": "Увеличится: освободившиеся места займёт H3.3, вносимый шапероном HIRA.", "p4a_2_k": "ATRX–DAXX вносит H3.3 на теломерных и перицентрических повторах вне репликации (Lewis 2010; Goldberg 2010). Без него на теломерах H3.3 прибавляется заметно меньше, а HIRA этой задачи не берёт на себя.", "p4a_2_e": "В этой модели доля нового H3.3 на теломере после трёх делений снижается с 20 % до 4 %. В норме она невелика, потому что обмен нуклеосом на теломерах медленный: Kraushaar 2013 (клетки мыши) наблюдали новый H3.3 на теломерах позже, чем на промоторах, тРНК и рибосомных генах: примерно через 48 ч против 2–12 ч. Остаточная доля без ATRX–DAXX (20 % от нормы) — допущение модели.", "p4a_2_w2": "Вариант переносит свойство генов на теломеры. В эмбриональных стволовых клетках мыши HIRA не обязателен для H3.3 на теломерах, а Atrx и Daxx нужны (Goldberg 2010).", "p4a_2_w3": "Вариант допускает, что один шаперон заменяет другой. В работах потеря ATRX–DAXX снижала H3.3 на теломерах, а HIRA их не восполняла (Goldberg 2010; Lewis 2010).", "p4a_3_q": "На гене с низкой транскрипцией за три цикла (72 ч) родительских нуклеосом осталось мало. Как изменится их доля, если заблокировать репликацию на те же три цикла по времени?", "p4a_3_o1": "Не изменится: без деления на локусе ничего не происходит, и состав остаётся прежним.", "p4a_3_o2": "Увеличится: без деления нет разведения, родительские убывают лишь из-за замены.", "p4a_3_o3": "Уменьшится: без репликации новые нуклеосомы не появляются, и старые разрушаются.", "p4a_3_k": "Деление разводит родительские нуклеосомы вдвое; без него остаётся только медленная замена на месте. H3.3 при этом встраивается: HIRA действует вне репликации.", "p4a_3_e": "В этой модели при трёх циклах доля родительских нуклеосом на гене с низкой транскрипцией растёт с 9 % при делениях до 75 % при блоке репликации (убывает только из-за медленной замены на месте: по скорости фоновой потери гистона H4 в клетках человека, Alabert 2015). Доля нового H3.3 почти не меняется (24 % и 25 %), а доля новых нуклеосом с H3.1 падает с 66 % до нуля: без репликации CAF-1 нового H3.1 не вносит. Блок репликации в расчёте — идеальный; в клетке длительный блок вызывает и другие последствия.", "p4a_3_w1": "Вариант считает, что состав определяется только делением. В модели родительские нуклеосомы убывают и при замене на месте; без деления остаётся именно она.", "p4a_3_w3": "Вариант путает разведение и разрушение. Родительская нуклеосома перестаёт быть родительской при замене на месте; репликация сама ничего не разрушает, а делит родительские нуклеосомы между нитями.", "p4a_4_q": "На центромере человека прошло два деления; клетки в G1, когда сборка после митоза завершена. Как изменится число молекул CENP-A на центромеру, если убрать шаперон HJURP?", "p4a_4_o1": "Не изменится: CENP-A достраивается при репликации ДНК так же, как H3.1.", "p4a_4_o2": "Уменьшится вдвое: без HJURP потеряется только последняя по времени достройка.", "p4a_4_o3": "Упадёт примерно в четыре раза: старые молекулы разводятся, достроить их некому.", "p4a_4_k": "CENP-A достраивается в G1 шапероном HJURP, а не при репликации (Jansen 2007). Без него старые молекулы просто делятся поровну между сестринскими центромерами, и число падает вдвое за каждое деление.", "p4a_4_e": "В этой модели число молекул CENP-A на центромеру при двух делениях и работающем HJURP — около 400 (плато, Bodor 2014), а без HJURP — 100 (400, разделённые на 4), и все они старые; старых молекул в обоих случаях по 100, различие — в числе новых. Число 400 — ориентир по Bodor 2014 для типичного центромера человека; модель показывает порядок и направление, а не измерение конкретной клетки.", "p4a_4_w1": "Вариант переносит на CENP-A репликационную сборку. Новый CENP-A включается в G1 после митоза (Jansen 2007), а не при синтезе ДНК.", "p4a_4_w2": "Вариант считает потерянной только последнюю достройку. Но достройка нужна после каждого деления: без неё разведение накапливается за все деления.", "p4a_5_q": "Клетки в G1 без облучения. Их облучили дозой 2 Гр и через 10 минут измерили γH2AX. Как изменится доля фосфорилированного H2AX?", "p4a_5_o1": "Вырастет примерно до 2 % всего H2AX: около 1 % на 1 Гр.", "p4a_5_o2": "Не изменится: H2AX фосфорилируется только в S-фазе.", "p4a_5_o3": "Вырастет почти до 100 %: фосфат получает весь H2AX клетки.", "p4a_5_k": "После двунитевых разрывов H2AX фосфорилируется по серину 139 в протяжённой области вокруг каждого разрыва (Rogakou 1998; Rogakou 1999). На 1 Гр приходится около 1 % H2AX, а максимум достигается за 10 минут.", "p4a_5_e": "В этой модели при 2 Гр γH2AX на пике составляет около 2 % всего H2AX (35 разрывов на 1 Гр, около 2 млн п.н. на разрыв — оценка авторов Rogakou 1998). Без облучения — около нуля. Число разрывов (около 70 при 2 Гр) — оценка авторов Rogakou 1998, не измерение. Линейность по дозе вне 1 Гр — допущение модели.", "p4a_5_w2": "Вариант связывает γH2AX только с репликацией. Фосфорилирование H2AX после излучения идёт и в G1; при стрессе репликации оно запускается другим путём (через ATR; Ward 2001).", "p4a_5_w3": "Вариант завышает долю в десятки раз. Двунитевых разрывов десятки, и фосфорилирован хроматин вокруг каждого, но это малая часть всего H2AX в геноме.", "p4a_6_q": "Клетки облучили дозой 2 Гр и через 10 минут измерили γH2AX. Как изменится γH2AX, если подавить и ATM, и DNA-PK?", "p4a_6_o1": "Не изменится: фосфорилировать H2AX после облучения достаточно киназе ATR.", "p4a_6_o2": "Снизится почти до нуля: H2AX после облучения фосфорилируют ATM и DNA-PK.", "p4a_6_o3": "Вырастет: неотремонтированные разрывы накапливаются, и H2AX фосфорилируется сильнее.", "p4a_6_k": "ATM и DNA-PK избыточно фосфорилируют H2AX после облучения (Stiff 2004): подавление одной киназы другая компенсирует, подавление обеих убирает сигнал. Результаты по одиночному ATM в работах расходятся (Burma 2001), поэтому в сценарии подавлены обе. ATR участвует при стрессе репликации (Ward 2001).", "p4a_6_e": "В этой модели при 2 Гр и 10 мин γH2AX падает с 2 % до нуля, если подавлены обе киназы. Число разрывов при этом остаётся прежним (около 70): подавлено не повреждение ДНК, а сигнал о нём. Условие «обе» выбрано потому, что результаты по одиночному ATM в работах расходятся (Burma 2001; Stiff 2004): отдельно ATM в сценарий не вынесен.", "p4a_6_w1": "Вариант переносит стресс репликации на облучение. ATR-зависимый путь запускается остановкой вилок, а не излучением (Ward 2001).", "p4a_6_w3": "Вариант путает следствие с причиной сигнала: накопление разрывов без киназ не даёт фосфорилирования, а сигнал γH2AX зависит от киназ.", "p4a_7_q": "В клетках появился мутантный H3 K27M в количестве 10 % всего H3. Как изменится H3K27me3 в среднем по геному?", "p4a_7_o1": "Резко снизится: K27M нарушает работу PRC2.", "p4a_7_o2": "Не изменится: мутантного гистона мало.", "p4a_7_o3": "Вырастет: K27M вместо лизина не метилируется, и метилируются соседние нуклеосомы.", "p4a_7_k": "K27M ингибирует PRC2 и снижает H3K27me3 глобально, хотя мутантный гистон составляет малую долю (Lewis 2013; Harutyunyan 2019). Малая доля мутантного гистона не равна малому эффекту.", "p4a_7_e": "В этой модели при q = 10 % H3K27me3 глобально составляет 0,26 от исходного, а состав нуклеосом на гене не меняется. Шкала q подогнана под пятикратный рост H3K27me3 при удалении K27M (Harutyunyan 2019); диапазон q 3–17 % — цитата из введения этой работы, а не измерение.", "p4a_7_w2": "Вариант считает эффект пропорциональным доле мутантного гистона. В работах K27M доминантно снижает H3K27me3: эффект выше, чем доля мутантного H3 (Lewis 2013).", "p4a_7_w3": "Вариант переворачивает направление глобального эффекта. Локально на сотнях генов H3K27me3 растёт (Chan 2013), но в среднем по геному он падает.", "p4a_8_q": "У образца Y новый H3.3 на теломерах упал, а на генах и H3K27me3 глобально остались как в контроле. Какое вмешательство в образце Y?", "p4a_8_o1": "Потеря шаперона гистонов HIRA.", "p4a_8_o2": "Потеря комплекса ATRX–DAXX.", "p4a_8_o3": "Мутация K27M в гистоне H3 клеток.", "p4a_8_k": "H3.3 на теломерах вносит ATRX–DAXX, а на генах HIRA (Goldberg 2010; Lewis 2010). Если упал H3.3 только на теломерах, а глобальный H3K27me3 в норме, подходит потеря ATRX–DAXX.", "p4a_8_e": "В этой модели образец X (потеря HIRA): новый H3.3 на генах 10 % против 51 %, на теломерах 20 %, H3K27me3 1,00. Образец Y (потеря ATRX–DAXX): на генах 51 %, на теломерах 4 %, H3K27me3 1,00. Образец Z (K27M при q = 10 %): H3.3 на генах и теломерах как в контроле, H3K27me3 — 0,26. Три вмешательства различимы только по набору приборов.", "p4a_8_w1": "Вариант даёт образец X: потеря HIRA снижает H3.3 на генах, а на теломерах он остаётся прежним.", "p4a_8_w3": "Вариант даёт образец Z: K27M не меняет состав H3.3, а снижает H3K27me3 глобально.", "src_001": "Alabert C. et al. Two distinct modes for propagation of histone PTMs across the cell cycle. Genes Dev. 2015;29:585–90. doi:10.1101/gad.256354.114", "src_002": "Anderson JD. и Widom J. Sequence and position-dependence of the equilibrium accessibility of nucleosomal DNA target sites. J Mol Biol. 2000;296:979–87. doi:10.1006/jmbi.2000.3531", "src_003": "Bantscheff M. et al. Chemoproteomics profiling of HDAC inhibitors reveals selective targeting of HDAC complexes. Nat Biotechnol. 2011;29:255–65. doi:10.1038/nbt.1759", "src_004": "Blosser TR. et al. Dynamics of nucleosome remodelling by individual ACF complexes. Nature. 2009;462:1022–7. doi:10.1038/nature08627", "src_005": "Bodor DL. et al. The quantitative architecture of centromeric chromatin. Elife. 2014;3:e02137. doi:10.7554/eLife.02137", "src_006": "Buenrostro JD. et al. Transposition of native chromatin for fast and sensitive epigenomic profiling of open chromatin, DNA-binding proteins and nucleosome position. Nat Methods. 2013;10:1213–8. doi:10.1038/nmeth.2688", "src_007": "Burma S. et al. ATM phosphorylates histone H2AX in response to DNA double-strand breaks. J Biol Chem. 2001;276:42462–7. doi:10.1074/jbc.C100466200", "src_008": "Chan KM. et al. The histone H3.3K27M mutation in pediatric glioma reprograms H3K27 methylation and gene expression. Genes Dev. 2013;27:985–90. doi:10.1101/gad.217778.113", "src_009": "Chereji RV. et al. Accessibility of promoter DNA is not the primary determinant of chromatin-mediated gene regulation. Genome Res. 2019;29:1985–1995. doi:10.1101/gr.249326.119", "src_010": "Chowdhury D. et al. gamma-H2AX dephosphorylation by protein phosphatase 2A facilitates DNA double-strand break repair. Mol Cell. 2005;20:801–9. doi:10.1016/j.molcel.2005.10.003", "src_011": "Davey CA. et al. Solvent mediated interactions in the structure of the nucleosome core particle at 1.9 a reso
