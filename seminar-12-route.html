e4":"on","o1":"on","o2":"on","o3":"off","o4":"off"},"t":{"ag":"бактерии:\nпоры, разрывы"},"tn":{"ag":"бактерии:\nпоры, разрывы"},"m":[["Выход H⁺ и Ca²⁺","есть"],["Выход катепсинов","нет"],["Доступ к гликанам просвета","нет"]],"note":"Бактерии образуют поры или разрывают мембрану; при разрыве просвет открывается цитозолю. Малое повреждение: выходят в основном протоны и ионы Ca²⁺."},"4-0-1":{"n":{"ag":"on","ctsc":"hide","pl":"hide","mem":"on","h":"on","ca":"on","cat":"off","gly":"off"},"e":{"e1":"hide","e2":"hide","e3":"hide","e4":"on","o1":"on","o2":"on","o3":"off","o4":"off"},"t":{"ag":"бактерии:\nпоры, разрывы"},"tn":{"ag":"бактерии:\nпоры, разрывы"},"m":[["Выход H⁺ и Ca²⁺","есть"],["Выход катепсинов","нет"],["Доступ к гликанам просвета","нет"]],"note":"Бактерии образуют поры или разрывают мембрану; при разрыве просвет открывается цитозолю. Катепсин C на это воздействие не влияет. Малое повреждение: выходят в основном протоны и ионы Ca²⁺."},"4-1-0":{"n":{"ag":"on","ctsc":"hide","pl":"hide","mem":"on","h":"on","ca":"on","cat":"on","gly":"on"},"e":{"e1":"hide","e2":"hide","e3":"hide","e4":"on","o1":"on","o2":"on","o3":"on","o4":"on"},"t":{"ag":"бактерии:\nпоры, разрывы"},"tn":{"ag":"бактерии:\nпоры, разрывы"},"m":[["Выход H⁺ и Ca²⁺","есть"],["Выход катепсинов","есть"],["Доступ к гликанам просвета","есть"]],"note":"Бактерии образуют поры или разрывают мембрану; при разрыве просвет открывается цитозолю. Крупное повреждение: выходят и катепсины, открываются гликаны."},"4-1-1":{"n":{"ag":"on","ctsc":"hide","pl":"hide","mem":"on","h":"on","ca":"on","cat":"on","gly":"on"},"e":{"e1":"hide","e2":"hide","e3":"hide","e4":"on","o1":"on","o2":"on","o3":"on","o4":"on"},"t":{"ag":"бактерии:\nпоры, разрывы"},"tn":{"ag":"бактерии:\nпоры, разрывы"},"m":[["Выход H⁺ и Ca²⁺","есть"],["Выход катепсинов","есть"],["Доступ к гликанам просвета","есть"]],"note":"Бактерии образуют поры или разрывают мембрану; при разрыве просвет открывается цитозолю. Катепсин C на это воздействие не влияет. Крупное повреждение: выходят и катепсины, открываются гликаны."}}}}},{"id":"lyso-signals","number":14,"section":2,"title":"Какие сигналы сообщают о повреждении","question":3,"questions":[3],"keywords":["сигналы повреждения","Ca²⁺","ALG-2","галектины","галектин-3","сфингомиелин","TECPR1","V-ATPase","ATG16L1","CASM"],"lead":["Повреждение лизосомной мембраны сопровождается несколькими физическими изменениями: выходом Ca²⁺, утечкой протонов, перемещением липидов и открытием гликанов.","Каждое изменение узнаёт свой белок, поэтому сигналы различаются по чувствительности к размеру повреждения."],"mechanism":["Ca²⁺, вышедший в цитозоль, связывается с [[T35|ALG-2]], и тот привлекает компоненты ESCRT.","V-ATPase при потере протонов и сфингомиелин на цитозольной стороне привлекают ATG16L1 и TECPR1, которые присоединяют ATG8 к самой мембране ([[T39|CASM]]).","[[T34|Галектины]] 3, 8 и 9 связывают гликаны внутренней стороны мембраны, открытые при крупном повреждении."],"paragraphs":["В неповреждённой лизосоме Ca²⁺ и протоны находятся в просвете, сфингомиелин преобладает в слое мембраны, обращённом к просвету, а гликаны скрыты внутри. Для белков цитозоля все эти признаки недоступны.","Выход Ca²⁺ — ранний и очень чувствительный сигнал: Ca²⁺ покидает лизосому через временные поры и через каналы, которые активируют рост pH, потеря мембранного потенциала и рост активных форм кислорода, поэтому сигнал возникает даже при малом повреждении. Утечка протонов и рост активных форм кислорода заставляют V-ATPase привлечь комплекс ATG16L1. Сфингомиелин перемещается на цитозольную сторону и узнаётся белком TECPR1. Оба пути присоединяют белки ATG8 к самой мембране. При крупном повреждении гликопротеины и гликолипиды просвета обращены к цитозолю, и их связывают галектины.","Галектины не только метки. Галектин-3 помогает привлечь ALIX и TRIM16, галектин-8 способствует отсоединению mTORC1 от лизосомы, галектин-9 привлекает киназу TAK1. Но галектины связывают сахара, а не убиквитин: мост между убиквитином и ATG8 при лизофагии строят другие рецепторы.","Отсюда граница вывода: крупное повреждение выявляют по галектинам, а малое, которое быстро ремонтируется, остаётся без галектина. Отсутствие галектина-3 на лизосоме не означает отсутствия повреждения. Как цитозольные сенсоры получают доступ к гликанам при повреждении без разрыва, не решено."],"trap":["Галектин-3 — рецептор лизофагии.","Рецептором селективной аутофагии называют белок, который соединяет метку на грузе с белком ATG8. В лизофагии эту роль выполняют TAX1BP1, p62, OPTN и NDP52, узнающие убиквитин. Галектины узнают открытые гликаны и привлекают другие белки ответа; галектин-3 удобен как метка крупного повреждения."],"conditions":"Схема механизма; состояния качественные. Ca²⁺ возникает даже при малом повреждении, галектины — при более обширном (Meyer & Kravic 2024); пороги для V-ATPase и сфингомиелина не определены, поэтому на схеме они показаны при любом повреждении — это учебное упрощение. Функции TECPR1 изучены в основном на мембранах, повреждённых бактериями (Boyle 2023), а путь V-ATPase–ATG16L1 — на одномембранных пузырьках (Fischer 2020). Регистрация галектина-3 показана условной пиктограммой.","sources":["MeyerKravic2024","Jia2020","Boyle2023","Fischer2020","Aits2015"],"quiz":{"id":"S12-L14","rev":1,"question":"Лизосома получила малое повреждение: временные поры пропускают ионы, но содержимое просвета остаётся внутри. Какой из перечисленных сигналов возникнет?","options":[{"id":"S12-L14-1","text":"Связывание галектина-3 с гликанами внутренней стороны мембраны.","correct":false,"feedback":"Гликаны остаются скрытыми, пока просвет не открыт цитозолю; этот сигнал связывают с более обширным повреждением."},{"id":"S12-L14-2","text":"Присоединение цепей убиквитина K48 и извлечение белков с помощью VCP/p97.","correct":false,"feedback":"Цепи K48 появляются позже K63, на этапе лизофагии, а не в первые минуты после малого повреждения."},{"id":"S12-L14-3","text":"Связывание Ca²⁺, вышедшего в цитозоль, с белком ALG-2.","correct":true,"feedback":"Верно: выход Ca²⁺ чувствителен даже к малому повреждению, и ALG-2 привлекает ESCRT уже в первые минуты."}]},"widget":{"kind":"net","title":"","s":{"title":"Какие изменения при повреждении узнают белки","status":"Схема механизма · качественные состояния","ctrls":[{"id":"d","type":"group","label":"Повреждение лизосомы","opts":["Нет","Малое","Крупное"]},{"id":"m","type":"check","label":"Показать, что видно по галектину-3 в микроскопе"}],"W":640,"H":390,"NW":340,"NH":330,"fs":16,"nfs":12,"lfs":14,"zfs":14,"lg":{"title":"Обозначения на схеме","act":"вызывает, приводит к","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"выход или перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, узнавание","seq":"порядок событий","eq":"равновесие","dash":"гипотеза или отдельный процесс","nodes":["жёлтая рамка — сигнал или звено активно","пунктирная рамка — не возникает"]},"fixed":"Состояния качественные. Пороги для V-ATPase и сфингомиелина не определены: на схеме они показаны при любом повреждении.","zones":[],"mem":[],"nodes":{"ca":{"p":[100,52,170,54],"t":"Ca²⁺ выходит\nв цитозоль","n":[50,40,90,52],"tn":"Ca²⁺\nвыходит в\nцитозоль"},"alg":{"p":[320,52,150,54],"t":"ALG-2","n":[171,40,80,52]},"esc":{"p":[540,52,170,54],"t":"ESCRT:\nремонт мембраны","n":[291,40,86,52],"tn":"ESCRT:\nремонт"},"ph":{"p":[100,142,170,60],"t":"утечка H⁺,\nрост pH и АФК","n":[50,112,90,60],"tn":"утечка H⁺,\nрост pH\nи АФК"},"vat":{"p":[320,142,150,54],"t":"V-ATPase +\nATG16L1","n":[171,114,80,52]},"casm":{"p":[540,192,170,108],"t":"CASM: ATG8\nприсоединяется\nк мембране\nлизосомы","n":[291,150,86,112],"tn":"CASM:\nATG8 на\nмембране"},"sm":{"p":[100,232,170,62],"t":"сфингомиелин\nна цитозольной\nстороне","n":[50,190,90,66],"tn":"сфинго-\nмиелин на\nцитозольной\nстороне"},"tec":{"p":[320,232,150,54],"t":"TECPR1","n":[171,188,80,52]},"gl":{"p":[102,332,184,54],"t":"гликаны просвета\nдоступны цитозолю","n":[50,268,90,62],"tn":"гликаны\nпросвета\nдоступны"},"gal":{"p":[320,332,150,54],"t":"галектины\n3, 8, 9","n":[171,268,80,52]},"mic":{"p":[540,332,170,62],"t":"точки галектина-3\nв микроскопе","n":[291,268,86,62],"tn":"точки\nгалектина-3"}},"edges":{"a1":{"a":"ca","b":"alg","k":"bind"},"a2":{"a":"alg","b":"esc","k":"act"},"b1":{"a":"ph","b":"vat","k":"act"},"b2":{"a":"vat","b":"casm","k":"act"},"c1":{"a":"sm","b":"tec","k":"bind"},"c2":{"a":"tec","b":"casm","k":"act"},"d1":{"a":"gl","b":"gal","k":"bind"},"d2":{"a":"gal","b":"mic","k":"seq"}},"st":{"0-0":{"n":{"ca":"off","alg":"off","esc":"off","ph":"off","vat":"off","casm":"off","sm":"off","tec":"off","gl":"off","gal":"off","mic":"hide"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","d1":"off","d2":"hide"},"t":{},"tn":{},"m":[["Сигналы Ca²⁺, pH и липидов","нет"],["Открытие гликанов просвета","нет"]],"note":"Лизосома не повреждена: Ca²⁺ и протоны в просвете, сфингомиелин обращён к просвету, гликаны скрыты. Сенсоры цитозоля ничего не связывают."},"0-1":{"n":{"ca":"off","alg":"off","esc":"off","ph":"off","vat":"off","casm":"off","sm":"off","tec":"off","gl":"off","gal":"off","mic":"off"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","d1":"off","d2":"off"},"t":{"mic":"точек нет:\nгалектин-3\nв цитозоле"},"tn":{"mic":"точек нет"},"m":[["Сигналы Ca²⁺, pH и липидов","нет"],["Открытие гликанов просвета","нет"],["Точки галектина-3","нет"]],"note":"Лизосома не повреждена: Ca²⁺ и протоны в просвете, сфингомиелин обращён к просвету, гликаны скрыты. Сенсоры цитозоля ничего не связывают."},"1-0":{"n":{"ca":"on","alg":"on","esc":"on","ph":"on","vat":"on","casm":"on","sm":"on","tec":"on","gl":"off","gal":"off","mic":"hide"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","d1":"off","d2":"hide"},"t":{},"tn":{},"m":[["Сигналы Ca²⁺, pH и липидов","есть"],["Открытие гликанов просвета","нет"]],"note":"При малом повреждении выходит Ca²⁺ (сигнал, чувствительный даже к малому повреждению), растёт pH, сфингомиелин попадает на цитозольную сторону. Гликаны просвета остаются закрытыми, поэтому галектины на лизосоме не задерживаются."},"1-1":{"n":{"ca":"on","alg":"on","esc":"on","ph":"on","vat":"on","casm":"on","sm":"on","tec":"on","gl":"off","gal":"off","mic":"off"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","d1":"off","d2":"off"},"t":{"mic":"точек нет, хотя\nповреждение есть"},"tn":{"mic":"точек нет"},"m":[["Сигналы Ca²⁺, pH и липидов","есть"],["Открытие гликанов просвета","нет"],["Точки галектина-3","нет"]],"note":"При малом повреждении выходит Ca²⁺ (сигнал, чувствительный даже к малому повреждению), растёт pH, сфингомиелин попадает на цитозольную сторону. Гликаны просвета остаются закрытыми, поэтому галектины на лизосоме не задерживаются. По галектину-3 такое повреждение не видно, хотя ремонт и CASM уже идут."},"2-0":{"n":{"ca":"on","alg":"on","esc":"on","ph":"on","vat":"on","casm":"on","sm":"on","tec":"on","gl":"on","gal":"on","mic":"hide"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","d1":"on","d2":"hide"},"t":{},"tn":{},"m":[["Сигналы Ca²⁺, pH и липидов","есть"],["Открытие гликанов просвета","есть"]],"note":"При крупном повреждении к сигналам Ca²⁺, pH и сфингомиелина добавляется открытие гликанов просвета: галектины 3, 8 и 9 связываются с ними и образуют точки на повреждённой лизосоме."},"2-1":{"n":{"ca":"on","alg":"on","esc":"on","ph":"on","vat":"on","casm":"on","sm":"on","tec":"on","gl":"on","gal":"on","mic":"on"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","d1":"on","d2":"on"},"t":{"mic":"точки на\nповреждённых\nлизосомах"},"tn":{"mic":"точки\nесть"},"m":[["Сигналы Ca²⁺, pH и липидов","есть"],["Открытие гликанов просвета","есть"],["Точки галектина-3","есть"]],"note":"При крупном повреждении к сигналам Ca²⁺, pH и сфингомиелина добавляется открытие гликанов просвета: галектины 3, 8 и 9 связываются с ними и образуют точки на повреждённой лизосоме."}}}}},{"id":"lyso-repair","number":15,"section":2,"title":"Как лизосома ремонтируется","question":3,"questions":[3],"keywords":["ремонт лизосомы","ESCRT-III","ALG-2","VPS4","PI4K2A","PI4P","OSBP","ATG2","DFCP1","аннексины"],"lead":["Небольшое повреждение лизосомы не требует удаления органеллы: мембрану ремонтируют за минуты.","Известны два способа ремонта: сузить место повреждения и убрать его в просвет, а также пополнить мембрану липидами; для более крупных повреждений нужны ещё аннексины."],"mechanism":["[[T35|ALG-2]] с Ca²⁺ привлекает [[T36|ESCRT-III]] к цитозольной стороне мембраны, и его полимеры вместе с VPS4 сужают место повреждения.","Ca²⁺ включает PI4K2A, а PI4P привлекает белки OSBP и ORP: они переносят холестерол и фосфатидилсерин из ЭПР, затем ATG2 и VPS13C переносят большие количества липидов ([[T37|PITT]]).","[[T38|Аннексины]] A1 и A2 садятся на повреждённую мембрану независимо от ESCRT и участвуют в ремонте более крупных повреждений."],"paragraphs":["После небольшого повреждения лизосома ещё сохраняет форму, но её мембрана стала проницаемой, и Ca²⁺ вышел в цитозоль. Этот сигнал запускает ремонт раньше, чем появляются метки для удаления.","ESCRT-III привлекают в течение минут: ALG-2 с Ca²⁺ садится на мембрану и вызывает сборку ESCRT через ESCRT-I (TSG101) и непосредственно через ALIX; для ремонта лизосом при осмотическом повреждении ALG-2 необходим (Hurley 2025). Эта сборка предшествует появлению галектина-3 и аппарата лизофагии. ESCRT-III вместе с АТФазой VPS4 осуществляет разделение мембран с «обратной» топологией: полимеры собираются внутри шейки, окружённой цитозолем (Olmos 2022). На повреждённой лизосоме они сужают место повреждения; по одной гипотезе, повреждённый участок уходит в просвет внутрипросветным пузырьком, по другой — разрыв временно закупоривается, но точный механизм не известен.","Параллельно Ca²⁺ активирует PI4K2A. PI4P на лизосомной мембране привлекает OSBP и ORP9, ORP10, ORP11; они создают контакты с ЭПР и переносят в мембрану холестерол и фосфатидилсерин в обмен на PI4P. Фосфатидилсерин привлекает ATG2. Недавно показано, что в ремонте участвуют домены ЭПР с PI3P: белок DFCP1 собирает на них канал для липидов VPS13C.","Пути отчасти независимы: контакты с ЭПР включаются параллельно ESCRT, а при подавлении ESCRT клетки хуже переживают повреждение (Radulovic 2018). Как пути согласованы между собой и что ограничивает размер ремонтируемого повреждения, неизвестно."],"trap":["ESCRT-III запечатывает разрыв изнутри лизосомы, как заплата.","ESCRT-III собирается на цитозольной стороне мембраны. Для его действия обсуждают несколько гипотез: втягивание повреждённого участка в просвет с образованием внутрипросветных пузырьков, временную закупорку разрыва и привлечение других белков ремонта. Точный механизм изучается."],"conditions":"Схема механизма; состояния качественные. Основные данные получены на культивируемых клетках человека (HeLa и другие) при повреждении LLOMe: сборка ESCRT-III и её последствия — Radulovic 2018; PI4K2A, PI4P и перенос липидов — Tan 2022; DFCP1 и VPS13C — Radulovic 2026; аннексины и сроки сборки ESCRT-III — обзор Meyer & Kravic 2024. Механизм действия ESCRT-III обсуждается (Burigotto 2026; Hurley 2025); топология ESCRT-III-разделения мембран — по обзору Olmos 2022. Размер повреждения на схеме — качественное различие.","sources":["MeyerKravic2024","Radulovic2018","Tan2022","Radulovic2026","Burigotto2026","Hurley2025","Olmos2022"],"quiz":{"id":"S12-L15","rev":1,"question":"На лизосоме с небольшим повреждением подавили сборку ESCRT-III; остальные пути ремонта сохранены. Что ожидается в первые минуты?","options":[{"id":"S12-L15-1","text":"Ремонт ослаблен, хотя пути, не зависящие от ESCRT, продолжают работать.","correct":true,"feedback":"Верно: ESCRT-III нужен для ремонта малых повреждений, а контакты с ЭПР и перенос липидов включаются параллельно и не заменяют его полностью."},{"id":"S12-L15-2","text":"Ремонт не нарушен, потому что ESCRT-III нужен только для лизофагии.","correct":false,"feedback":"ESCRT-III собирается на лизосоме в течение минут и работает до лизофагии: сборка не зависит от аппарата лизофагии."},{"id":"S12-L15-3","text":"Мембрана восстанавливается полностью за счёт аннексинов.","correct":false,"feedback":"Аннексины A1 и A2 привлекаются к повреждениям с более крупными порами, а не заменяют ESCRT-III при малом повреждении."}]},"widget":{"kind":"net","title":"","s":{"title":"Три способа ремонта лизосомной мембраны","status":"Схема механизма · качественные состояния","ctrls":[{"id":"k","type":"group","label":"Размер повреждения","opts":["Малое","Крупное"]},{"id":"e","type":"check","label":"ESCRT-III выключен"},{"id":"l","type":"check","label":"Перенос липидов выключен (нет PI4K2A)"}],"W":640,"H":452,"NW":340,"NH":460,"fs":15,"nfs":13,"lfs":13,"zfs":14,"lg":{"title":"Обозначения на схеме","act":"вызывает, приводит к","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"выход или перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, узнавание","seq":"порядок событий","eq":"равновесие","dash":"гипотеза или отдельный процесс","nodes":["жёлтая рамка — звено активно","пунктирная рамка — не работает","пунктирная рамка с крестом — белок выключен"]},"fixed":"Состояния качественные: схема показывает, какие пути работают, а не скорость или долю закрытых повреждений.","zones":[],"mem":[],"nodes":{"ca":{"p":[320,40,230,42],"t":"Ca²⁺ вышел из просвета","n":[80,34,140,40],"tn":"Ca²⁺ вышел\nиз просвета"},"anx":{"p":[558,206,138,70],"t":"аннексины\nA1, A2 (крупные\nповреждения)","n":[262,34,140,60],"fs":14,"tn":"аннексины A1, A2\n(крупные\nповреждения)"},"alg":{"p":[110,130,190,52],"t":"ALG-2, ALIX:\nпривлекают ESCRT","n":[84,120,148,50],"tn":"ALG-2, ALIX"},"esc":{"p":[110,224,190,62],"t":"ESCRT-III + VPS4\nна цитозольной\nстороне","n":[84,208,148,66],"tn":"ESCRT-III\n+ VPS4 на\nцитозольной\nстороне"},"ilv":{"p":[110,322,190,68],"t":"участок сужен\nи убран в просвет\n(одна из гипотез)","n":[84,306,148,74],"tn":"участок сужен,\nубран в просвет\n(гипотеза)"},"pi4":{"p":[326,130,200,52],"t":"PI4K2A → PI4P\nна лизосоме","n":[256,120,148,50],"tn":"PI4K2A →\nPI4P"},"er":{"p":[326,222,200,62],"t":"контакт с ЭПР:\nOSBP, ORP9–11 —\nхолестерол, PS","n":[256,208,148,74],"tn":"контакт с ЭПР:\nOSBP, ORP —\nхолестерол,\nPS"},"ch":{"p":[326,320,200,76],"t":"ATG2, VPS13C\n(DFCP1, PI3P):\nбольшие потоки\nлипидов","n":[256,308,148,76],"tn":"ATG2, VPS13C\n(DFCP1, PI3P):\nлипиды в\nбольшом объёме"},"res":{"p":[320,416,540,44],"t":"мембрана восстановлена","n":[170,412,300,44],"fs":16}},"edges":{"c1":{"a":"ca","b":"alg","k":"act"},"c2":{"a":"ca","b":"pi4","k":"act"},"c3":{"a":"ca","b":"anx","k":"act"},"a1":{"a":"alg","b":"esc","k":"act"},"a2":{"a":"esc","b":"ilv","k":"seq"},"p1":{"a":"pi4","b":"er","k":"act"},"p2":{"a":"er","b":"ch","k":"act"},"r1":{"a":"ilv","b":"res","k":"act"},"r2":{"a":"ch","b":"res","k":"act"},"r3":{"a":"anx","b":[558,394],"k":"act","nn":true}},"st":{"0-0-0":{"n":{"ca":"on","anx":"off","alg":"on","esc":"on","ilv":"on","pi4":"on","er":"on","ch":"on","res":"on"},"e":{"c1":"on","c2":"on","c3":"off","r3":"off","a1":"on","a2":"on","r1":"on","p1":"on","p2":"on","r2":"on"},"t":{"res":"мембрана восстановлена"},"tn":{"res":"мембрана восстановлена"},"m":[["Работают пути ремонта","ESCRT-III, перенос липидов"],["Результат","ремонт идёт всеми путями"]],"note":"Малое повреждение: выход Ca²⁺ включает ESCRT-III и перенос липидов из ЭПР; аннексины привлекаются к более крупным повреждениям. Пути включаются параллельно и дополняют друг друга."},"0-0-1":{"n":{"ca":"on","anx":"off","alg":"on","esc":"on","ilv":"on","pi4":"abs","er":"off","ch":"off","res":"low"},"e":{"c1":"on","c2":"off","c3":"off","r3":"off","a1":"on","a2":"on","r1":"on","p1":"off","p2":"off","r2":"off"},"t":{"res":"ремонт ослаблен"},"tn":{"res":"ремонт ослаблен"},"m":[["Работают пути ремонта","ESCRT-III"],["Результат","ремонт ослаблен"]],"note":"Малое повреждение: выход Ca²⁺ включает ESCRT-III и перенос липидов из ЭПР; аннексины привлекаются к более крупным повреждениям. Без PI4K2A выключен перенос липидов из ЭПР; ESCRT-III продолжает работать, но ремонт слабее."},"0-1-0":{"n":{"ca":"on","anx":"off","alg":"on","esc":"abs","ilv":"off","pi4":"on","er":"on","ch":"on","res":"low"},"e":{"c1":"on","c2":"on","c3":"off","r3":"off","a1":"off","a2":"off","r1":"off","p1":"on","p2":"on","r2":"on"},"t":{"res":"ремонт ослаблен"},"tn":{"res":"ремонт ослаблен"},"m":[["Работают пути ремонта","перенос липидов"],["Результат","ремонт ослаблен"]],"note":"Малое повреждение: выход Ca²⁺ включает ESCRT-III и перенос липидов из ЭПР; аннексины привлекаются к более крупным повреждениям. Без ESCRT-III ремонт ослаблен, хотя пути, не зависящие от ESCRT, продолжают работать."},"0-1-1":{"n":{"ca":"on","anx":"off","alg":"on","esc":"abs","ilv":"off","pi4":"abs","er":"off","ch":"off","res":"off"},"e":{"c1":"on","c2":"off","c3":"off","r3":"off","a1":"off","a2":"off","r1":"off","p1":"off","p2":"off","r2":"off"},"t":{"res":"ремонт слабый или не завершён"},"tn":{"res":"ремонт слабый или не завершён"},"m":[["Работают пути ремонта","нет"],["Результат","ремонт слабый или не завершён"]],"note":"Малое повреждение: выход Ca²⁺ включает ESCRT-III и перенос липидов из ЭПР; аннексины привлекаются к более крупным повреждениям. Выключены оба основных пути: ремонт слабый или не завершён. Лизосома может быть направлена на удаление, но что определяет этот выбор, неизвестно."},"1-0-0":{"n":{"ca":"on","anx":"on","alg":"on","esc":"on","ilv":"on","pi4":"on","er":"on","ch":"on","res":"on"},"e":{"c1":"on","c2":"on","c3":"on","r3":"on","a1":"on","a2":"on","r1":"on","p1":"on","p2":"on","r2":"on"},"t":{"res":"мембрана восстановлена"},"tn":{"res":"мембрана восстановлена"},"m":[["Работают пути ремонта","ESCRT-III, перенос липидов, аннексины"],["Результат","ремонт идёт всеми путями"]],"note":"Крупное повреждение: к ESCRT-III и переносу липидов добавляются аннексины A1 и A2, которые привлекаются независимо от ESCRT. Пути включаются параллельно и дополняют друг друга."},"1-0-1":{"n":{"ca":"on","anx":"on","alg":"on","esc":"on","ilv":"on","pi4":"abs","er":"off","ch":"off","res":"low"},"e":{"c1":"on","c2":"off","c3":"on","r3":"on","a1":"on","a2":"on","r1":"on","p1":"off","p2":"off","r2":"off"},"t":{"res":"ремонт ослаблен"},"tn":{"res":"ремонт ослаблен"},"m":[["Работают пути ремонта","ESCRT-III, аннексины"],["Результат","ремонт ослаблен"]],"note":"Крупное повреждение: к ESCRT-III и переносу липидов добавляются аннексины A1 и A2, которые привлекаются независимо от ESCRT. Без PI4K2A выключен перенос липидов из ЭПР; ESCRT-III продолжает работать, но ремонт слабее."},"1-1-0":{"n":{"ca":"on","anx":"on","alg":"on","esc":"abs","ilv":"off","pi4":"on","er":"on","ch":"on","res":"low"},"e":{"c1":"on","c2":"on","c3":"on","r3":"on","a1":"off","a2":"off","r1":"off","p1":"on","p2":"on","r2":"on"},"t":{"res":"ремонт ослаблен"},"tn":{"res":"ремонт ослаблен"},"m":[["Работают пути ремонта","перенос липидов, аннексины"],["Результат","ремонт ослаблен"]],"note":"Крупное повреждение: к ESCRT-III и переносу липидов добавляются аннексины A1 и A2, которые привлекаются независимо от ESCRT. Без ESCRT-III ремонт ослаблен, хотя пути, не зависящие от ESCRT, продолжают работать."},"1-1-1":{"n":{"ca":"on","anx":"on","alg":"on","esc":"abs","ilv":"off","pi4":"abs","er":"off","ch":"off","res":"off"},"e":{"c1":"on","c2":"off","c3":"on","r3":"on","a1":"off","a2":"off","r1":"off","p1":"off","p2":"off","r2":"off"},"t":{"res":"ремонт слабый или не завершён"},"tn":{"res":"ремонт слабый или не завершён"},"m":[["Работают пути ремонта","аннексины"],["Результат","ремонт слабый или не завершён"]],"note":"Крупное повреждение: к ESCRT-III и переносу липидов добавляются аннексины A1 и A2, которые привлекаются независимо от ESCRT. Выключены оба основных пути: ремонт слабый или не завершён. Лизосома может быть направлена на удаление, но что определяет этот выбор, неизвестно."}}}}},{"id":"lysophagy","number":16,"section":2,"title":"Как удаляют лизосому, которую не удалось починить","question":3,"questions":[3],"keywords":["лизофагия","убиквитин","K63","K48","VCP/p97","TAX1BP1","TBK1","ULK1","FIP200","CASM"],"lead":["Если ремонт не удался или повреждение слишком велико, лизосому разрушают целиком: этот процесс — [[T40|лизофагия]], разновидность селективной макроаутофагии.","Он занимает часы и опирается на убиквитиновую метку на поверхности органеллы."],"mechanism":["Убиквитин-лигазы метят повреждённую лизосому цепями убиквитина — сначала K63, позже K48; [[T42|VCP/p97]] извлекает часть меченых белков.","Рецепторы ([[T41|TAX1BP1]] с доминирующей ролью; на лизосомах найдены также p62, OPTN и NDP52) связывают убиквитин и белки ATG8; TBK1 усиливает это связывание.","Рецепторы привлекают ULK1–FIP200, фагофор охватывает лизосому, и аутофагосома сливается с неповреждённой лизосомой."],"paragraphs":["Если ремонт не удался, проницаемая лизосома остаётся источником протонов и ферментов. Убиквитин на ней служит сигналом для удаления: рецепторы аутофагии узнают именно его, а блокада убиквитинирования подавляет лизофагию.","Метка ставится двумя волнами: сначала преобладают цепи K63, которые рецепторы аутофагии, как правило, связывают лучше цепей K48, позже появляются цепи K48, и подключается VCP/p97. Связь с ремонтом описана для белка спартина: он узнаёт IST1 из ESCRT-III и участки разупорядоченных липидов и привлекает лигазу ITCH, ставящую цепи K63 (Hurley 2025). Лигаза, начинающая процесс в целом, и сигнал, который её запускает, не установлены (Meyer & Kravic 2024), поэтому не известно, что именно отличает лизосому для удаления от лизосомы для ремонта.","В систематическом нокауте рецепторов доминирующая роль принадлежит TAX1BP1: вместе с TBK1 он необходим для лизофагического потока в клетках HeLa и в индуцированных нейронах, тогда как при отсутствии OPTN или NDP52 поток в HeLa сохраняется. Более ранние работы показывали снижение лизофагии и при истощении p62. TAX1BP1 связывает TBK1 и FIP200 через домен SKICH. ULK1-комплекс запускает фагофор, который строится вплотную к метке на лизосоме.","CASM — не лизофагия: ATG8 присоединяются к самой мембране повреждённой лизосомы без фагофора. Распознавание гликанов особенно важно при повреждении, которое вызывают бактерии, разрывающие мембрану. Результаты получены при остром повреждении в культивируемых клетках; вклад рецепторов в других клетках и при хроническом повреждении может отличаться."],"trap":["CASM упаковывает повреждённую лизосому в аутофагосому.","При CASM белки ATG8 присоединяются к мембране самой лизосомы — через V-ATPase и ATG16L1 или через TECPR1 — без образования фагофора вокруг неё; следствия — микроаутофагия места повреждения, активация TFEB и образование трубчатых выпячиваний. Фагофор вокруг лизосомы строит ULK1–FIP200 по убиквитиновой метке, и это лизофагия."],"conditions":"Схема механизма; состояния качественные. Роль TAX1BP1 и TBK1 установлена в клетках HeLa и индуцированных нейронах человека при остром повреждении (Eapen 2021). Две волны убиквитинирования описаны по окраске цепь-специфичными антителами (Papadopoulos 2017, Meyer & Kravic 2024); ранние данные об аутофагическом захвате повреждённых лизосом — Maejima 2013. Начальная E3-лигаза и критерий выбора между ремонтом и удалением не определены; связь спартин–ITCH — по обзору Hurley 2025.","sources":["MeyerKravic2024","Papadopoulos2017","Eapen2021","Maejima2013","Boyle2023","Hurley2025"],"quiz":{"id":"S12-L16","rev":1,"question":"Ремонт лизосомы не удался; в клетках нет TAX1BP1, убиквитинирование и остальные рецепторы сохранены. Что ожидается?","options":[{"id":"S12-L16-1","text":"Лизофагический поток не меняется, потому что рецепторы взаимозаменяемы без ограничений.","correct":false,"feedback":"При отсутствии OPTN или NDP52 поток в HeLa сохраняется, а основная роль принадлежит TAX1BP1; взаимозаменяемость неполная."},{"id":"S12-L16-2","text":"Лизосомы не получают убиквитин, потому что TAX1BP1 ставит метку.","correct":false,"feedback":"TAX1BP1 — рецептор: он узнаёт готовую метку и связывает TBK1 и FIP200, но не является убиквитин-лигазой."},{"id":"S12-L16-3","text":"Метка поставлена, но лизофагический поток снижен, потому что ослаблен мост между убиквитином и ATG8.","correct":true,"feedback":"Верно: рецептор соединяет убиквитин на лизосоме с аппаратом аутофагосомы, и без основного рецептора поток снижается."}]},"widget":{"kind":"net","title":"","s":{"title":"Путь повреждённой лизосомы к удалению","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Состояние лизосомы","opts":["Целая","Повреждена, ремонт удался","Повреждена, ремонт не удался"]},{"id":"t","type":"check","label":"Нет TAX1BP1 (нокаут)"},{"id":"c","type":"check","label":"Показать CASM на этой же лизосоме"}],"W":640,"H":424,"NW":340,"NH":436,"fs":15,"nfs":13,"lfs":13,"zfs":14,"lg":{"title":"Обозначения на схеме","act":"вызывает, приводит к","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"выход или перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, узнавание","seq":"порядок событий, путь белка","eq":"равновесие","dash":"отдельный процесс, не лизофагия","nodes":["жёлтая рамка — звено активно","пунктирная рамка — не работает или ослаблено","пунктирная рамка с крестом — белок отсутствует"]},"fixed":"Состояния качественные: схема показывает последовательность звеньев, а не скорость процесса.","zones":[],"mem":[],"nodes":{"dam":{"p":[270,36,250,50],"t":"лизосома","n":[170,34,250,46],"fs":16},"casm":{"p":[82,126,128,70],"t":"CASM: ATG8\nна мембране,\nбез фагофора","n":[262,112,140,70],"fs":14,"tn":"CASM: ATG8\nна мембране,\nбез фагофора"},"ub":{"p":[272,122,220,54],"t":"убиквитин на лизосоме:\nсначала K63, позже K48","n":[100,112,150,56],"tn":"убиквитин:\nK63, затем K48"},"p97":{"p":[548,122,170,54],"t":"VCP/p97 извлекает\nчасть белков","n":[88,190,150,44],"nn":true},"tax":{"p":[176,220,186,58],"t":"TAX1BP1 + TBK1\n(доминирует в HeLa)","n":[90,208,150,58],"tn":"TAX1BP1 +\nTBK1 (доминирует\nв HeLa)"},"oth":{"p":[364,220,160,58],"t":"p62, OPTN, NDP52\n(также найдены\nна лизосоме)","n":[252,208,150,58],"tn":"p62, OPTN,\nNDP52 (также\nна лизосоме)"},"ulk":{"p":[270,312,270,54],"t":"ULK1–FIP200:\nфагофор вокруг лизосомы","n":[170,298,250,54],"tn":"ULK1–FIP200:\nфагофор вокруг\nлизосомы"},"ap":{"p":[270,392,280,50],"t":"аутофагосома → слияние\nс неповреждённой лизосомой","n":[170,380,250,50],"tn":"аутофагосома,\nслияние с неповреждённой\nлизосомой"}},"edges":{"a1":{"a":"dam","b":"ub","k":"act"},"a2":{"a":"ub","b":"p97","k":"act","nn":true},"b1":{"a":"ub","b":"tax","k":"bind"},"b2":{"a":"ub","b":"oth","k":"bind"},"c1":{"a":"tax","b":"ulk","k":"act"},"c2":{"a":"oth","b":"ulk","k":"act"},"c3":{"a":"ulk","b":"ap","k":"act"},"k1":{"a":"dam","b":"casm","k":"act","dash":true}},"st":{"0-0-0":{"n":{"dam":"base","ub":"off","p97":"off","oth":"off","ulk":"off","ap":"off","tax":"off","casm":"hide"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","c3":"off","k1":"hide"},"t":{"dam":"лизосома не повреждена"},"tn":{"dam":"лизосома не повреждена"},"m":[["Убиквитиновая метка","нет"],["Фагофор вокруг лизосомы","нет"]],"note":"Лизосома не повреждена: убиквитиновой метки нет, рецепторы лизофагии и фагофор не привлекаются."},"0-0-1":{"n":{"dam":"base","ub":"off","p97":"off","oth":"off","ulk":"off","ap":"off","tax":"off","casm":"off"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","c3":"off","k1":"off"},"t":{"dam":"лизосома не повреждена"},"tn":{"dam":"лизосома не повреждена"},"m":[["Убиквитиновая метка","нет"],["Фагофор вокруг лизосомы","нет"],["CASM","нет"]],"note":"Лизосома не повреждена: убиквитиновой метки нет, рецепторы лизофагии и фагофор не привлекаются. Без повреждения CASM не включается."},"0-1-0":{"n":{"dam":"base","ub":"off","p97":"off","oth":"off","ulk":"off","ap":"off","tax":"abs","casm":"hide"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","c3":"off","k1":"hide"},"t":{"dam":"лизосома не повреждена"},"tn":{"dam":"лизосом f","c1":"off","c2":"off","c3":"off","k1":"hide"},"t":{"dam":"повреждена,\nремонт удался"},"tn":{"dam":"повреждена, ремонт удался"},"m":[["Убиквитиновая метка","нет"],["Фагофор вокруг лизосомы","нет"]],"note":"Ремонт удался: лизосома остаётся в клетке и на удаление не направляется. Что отличает такие лизосомы от неотремонтированных, неизвестно."},"1-1-1":{"n":{"dam":"on","ub":"off","p97":"off","oth":"off","ulk":"off","ap":"off","tax":"abs","casm":"on"},"e":{"a1":"off","a2":"off","b1":"off","b2":"off","c1":"off","c2":"off","c3":"off","k1":"on"},"t":{"dam":"повреждена,\nремонт удался"},"tn":{"dam":"повреждена, ремонт удался"},"m":[["Убиквитиновая метка","нет"],["Фагофор вокруг лизосомы","нет"],["CASM","есть"]],"note":"Ремонт удался: лизосома остаётся в клетке и на удаление не направляется. Что отличает такие лизосомы от неотремонтированных, неизвестно. CASM — отдельный процесс на той же лизосоме: белки ATG8 присоединяются к её мембране без фагофора и не заменяют лизофагию."},"2-0-0":{"n":{"dam":"on","ub":"on","p97":"on","oth":"on","ulk":"on","ap":"on","tax":"on","casm":"hide"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","c3":"on","k1":"hide"},"t":{"dam":"повреждена,\nремонт не удался"},"tn":{"dam":"повреждена, ремонт не удался"},"m":[["Убиквитиновая метка","есть"],["Фагофор вокруг лизосомы","есть"]],"note":"Лизосома получает цепи K63, позже K48; рецепторы связывают убиквитин и ATG8, ULK1–FIP200 строит фагофор вплотную к метке, аутофагосома сливается с неповреждённой лизосомой."},"2-0-1":{"n":{"dam":"on","ub":"on","p97":"on","oth":"on","ulk":"on","ap":"on","tax":"on","casm":"on"},"e":{"a1":"on","a2":"on","b1":"on","b2":"on","c1":"on","c2":"on","c3":"on","k1":"on"},"t":{"dam":"повреждена,\nремонт не удался"},"tn":{"dam":"повреждена, ремонт не удался"},"m":[["Убиквитиновая метка","есть"],["Фагофор вокруг лизосомы","есть"],["CASM","есть"]],"note":"Лизосома получает цепи K63, позже K48; рецепторы связывают убиквитин и ATG8, ULK1–FIP200 строит фагофор вплотную к метке, аутофагосома сливается с неповреждённой лизосомой. CASM — отдельный процесс на той же лизосоме: белки ATG8 присоединяются к её мембране без фагофора и не заменяют лизофагию."},"2-1-0":{"n":{"dam":"on","ub":"on","p97":"on","oth":"on","ulk":"on","ap":"low","tax":"abs","casm":"hide"},"e":{"a1":"on","a2":"on","b1":"off","b2":"on","c1":"off","c2":"on","c3":"on","k1":"hide"},"t":{"dam":"повреждена,\nремонт не удался","ap":"захват ослаблен"},"tn":{"dam":"повреждена, ремонт не удался","ap":"захват ослаблен"},"m":[["Убиквитиновая метка","есть"],["Фагофор вокруг лизосомы","ослаблен"]],"note":"Без TAX1BP1 метка на лизосоме поставлена, но лизофагический поток снижен: доминирующая роль в клетках HeLa и индуцированных нейронах принадлежит TAX1BP1 и TBK1: при отсутствии OPTN или NDP52 поток в HeLa сохраняется."},"2-1-1":{"n":{"dam":"on","ub":"on","p97":"on","oth":"on","ulk":"on","ap":"low","tax":"abs","casm":"on"},"e":{"a1":"on","a2":"on","b1":"off","b2":"on","c1":"off","c2":"on","c3":"on","k1":"on"},"t":{"dam":"повреждена,\nремонт не удался","ap":"захват ослаблен"},"tn":{"dam":"повреждена, ремонт не удался","ap":"захват ослаблен"},"m":[["Убиквитиновая метка","есть"],["Фагофор вокруг лизосомы","ослаблен"],["CASM","есть"]],"note":"Без TAX1BP1 метка на лизосоме поставлена, но лизофагический поток снижен: доминирующая роль в клетках HeLa и индуцированных нейронах принадлежит TAX1BP1 и TBK1: при отсутствии OPTN или NDP52 поток в HeLa сохраняется. CASM — отдельный процесс на той же лизосоме: белки ATG8 присоединяются к её мембране без фагофора и не заменяют лизофагию."}}}}},{"id":"lyso-biogenesis","number":17,"section":2,"title":"Как восстанавливается пул лизосом","question":3,"questions":[3],"keywords":["биогенез лизосом","TFEB","TFE3","mTORC1","кальциневрин","TRPML1","CASM","CLEAR","LYTL","регенерация лизосом"],"lead":["Удаление повреждённых лизосом уменьшает их число, поэтому повреждение одновременно запускает программу восстановления пула. Её главный регулятор — транскрипционный фактор [[T43|TFEB]] (а также TFE3).","Новые лизосомы образуются двумя путями: из вновь синтезированных компонентов под контролем TFEB и из материала повреждённых лизосом."],"mechanism":["mTORC1 на лизосоме фосфорилирует TFEB, и белки 14-3-3 удерживают его в цитозоле.","При повреждении mTORC1 отходит от лизосомы, а Ca²⁺ через TRPML1 активирует [[T44|кальциневрин]]; ATG8 на мембране ([[T39|CASM]]) усиливают выход Ca²⁺, и TFEB дефосфорилируется.","TFEB уходит в ядро и включает гены лизосомных и аутофагических белков; параллельно из повреждённой лизосомы вытягиваются трубки ([[T45|LYTL и другие пути]])."],"paragraphs":["В неповреждённой клетке лизосомный mTORC1 фосфорилирует TFEB, и тот остаётся в цитозоле в комплексе с белками 14-3-3. Поэтому программа биогенеза выключена.","Повреждение лизосомы включает программу несколькими путями. mTORC1 отсоединяется от лизосомы: ATG8 на мембране связывает FLCN (на неповреждённой лизосоме FLCN и RAG C/D нужны для фосфорилирования TFEB), а Ca²⁺ активирует кальциневрин. Присоединение ATG8 к мембране усиливает сигнал: липидированный LC3 взаимодействует с TRPML1 и усиливает выход Ca²⁺; без системы конъюгации LC3 активация TFEB при повреждении в клетках HeLa и в почке мыши нарушена, а ATG8 на мембране также связывает FLCN. TFEB дефосфорилируется, уходит в ядро, связывается с мотивом CLEAR и включает гены лизосомных и аутофагических белков.","Это занимает часы: нужно накопить мРНК и белки и доставить их к эндосомам, которые созревают в лизосомы. В клетках без аутофагии при повреждении биогенез лизосом подавлен. Параллельно идёт регенерация из материала повреждённой органеллы: при LYTL киназа LRRK2 фосфорилирует RAB35 и RAB10, а адаптер JIP4 вытягивает трубки без LAMP1, из которых выходят мембранные пузырьки.","Границы вывода. B-fission, при котором DRP1 отщепляет почки от повреждённых лизосом, описан в клетках HeLa при гипоксии–реоксигенации; в этой работе повреждение LLOMe не использовали. Неизвестно, насколько регенерированные лизосомы нуждаются в новых гидролазах и как согласованы пути."],"trap":["TFEB активируется только при голодании, когда выключается mTORC1.","Повреждение лизосом тоже активирует TFEB: mTORC1 отсоединяется, а Ca²⁺ через TRPML1 и кальциневрин дефосфорилируют TFEB, причём присоединение ATG8 к лизосомной мембране усиливает этот сигнал. Сигнал идёт с самой повреждённой лизосомы."],"conditions":"Схема механизма; состояния качественные. Роль CASM и LC3 в активации TFEB показана в клетках HeLa и в модели повреждения почки у мыши (Nakamura 2020); роль Ca²⁺ и кальциневрина впервые показана при голодании (Medina 2015); влияние аутофагии на биогенез — Maejima 2013; LYTL — Bonet-Ponce 2020 (клетки после LLOMe); B-fission — Luo 2026 (HeLa, гипоксия–реоксигенация). Значение путей регенерации в тканях неясно; время «часы» — качественная оценка.","sources":["MeyerKravic2024","Nakamura2020","Medina2015","BonetPonce2020","Luo2026"],"quiz":{"id":"S12-L17","rev":1,"question":"В клетках нарушена система присоединения LC3 к липидам (нет ATG5). Лизосомы повредили, остальные процессы не изменены. Что ожидается с активацией TFEB?","options":[{"id":"S12-L17-1","text":"Активация TFEB не меняется, потому что её регулирует только mTORC1.","correct":false,"feedback":"При повреждении активация TFEB зависит и от Ca²⁺, и от присоединения LC3 к лизосомной мембране: без него TFEB активируется хуже."},{"id":"S12-L17-2","text":"Активация TFEB ослаблена, потому что нет присоединения LC3, усиливающего выход Ca²⁺ через TRPML1.","correct":true,"feedback":"Верно: липидированный LC3 взаимодействует с TRPML1 и усиливает выход Ca²⁺, нужный для активации TFEB."},{"id":"S12-L17-3","text":"Активация TFEB усилена, потому что без присоединения LC3 освобождается FLCN.","correct":false,"feedback":"Свободный FLCN, наоборот, помогает mTORC1 фосфорилировать TFEB и удерживать его в цитозоле, поэтому активация слабее."}]},"widget":{"kind":"net","title":"","s":{"title":"Как повреждение запускает восстановление пула лизосом","status":"Схема механизма · качественные состояния","ctrls":[{"id":"s","type":"group","label":"Состояние лизосомы","opts":["Без повреждения","Повреждение"]},{"id":"c","type":"check","label":"Нет присоединения ATG8 к мембране (CASM)"},{"id":"t","type":"check","label":"Нет TFEB (нокаут)"}],"W":700,"H":480,"NW":340,"NH":620,"fs":15,"nfs":13,"lfs":13,"zfs":14,"lg":{"title":"Обозначения на схеме","act":"вызывает, приводит к","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"переход в ядро","rx":"химическое превращение","bind":"связывание, узнавание","seq":"порядок событий","eq":"равновесие","dash":"гипотеза или отдельный процесс","nodes":["жёлтая рамка — звено активно","пунктирная рамка — не работает","точечная рамка — ослаблено","пунктирная рамка с крестом — отсутствует","P — TFEB фосфорилирован"]},"fixed":"Состояния качественные: схема показывает последовательность звеньев. Время восстановления пула — часы (качественная оценка).","zones":[],"mem":[],"nodes":{"dm":{"p":[117,38,214,46],"t":"лизосома","n":[170,34,240,44],"fs":15},"mt":{"p":[100,130,180,60],"t":"mTORC1","n":[88,110,148,56],"fs":15,"nn":true},"ca":{"p":[330,38,160,46],"t":"Ca²⁺ через TRPML1","n":[88,112,148,46],"tn":"Ca²⁺ через\nTRPML1"},"casm":{"p":[584,88,184,80],"t":"CASM: ATG8 на мембране\nусиливают Ca²⁺-сигнал\nи связывают FLCN","n":[252,116,148,80],"fs":13,"tn":"CASM: ATG8\nна мембране\nусиливают Ca²⁺"},"cn":{"p":[330,134,160,46],"t":"кальциневрин","n":[88,218,148,44]},"tfeb":{"p":[165,238,290,62],"t":"TFEB","n":[170,322,262,62],"fs":15},"nuc":{"p":[150,332,230,56],"t":"ядро: гены лизосом\nи аутофагии (CLEAR)","n":[170,412,250,50],"tn":"ядро: гены лизосом\nи аутофагии"},"reg":{"p":[416,332,176,72],"t":"LYTL и другие\nтрубчатые пути:\nпузырьки из лизосомы","n":[88,494,148,66],"fs":13.5,"tn":"LYTL и другие\nтрубчатые пути"},"bf":{"p":[618,332,150,72],"t":"B-fission: другие\nусловия (гипоксия–\nреоксигенация)","n":[252,494,148,66],"fs":13,"tn":"B-fission: другие\nуслов
