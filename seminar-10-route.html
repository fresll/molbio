аспада, а не только от скорости реакции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-10.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pubmed.ncbi.nlm.nih.gov/21335549/">Tian YM. et al. Differential sensitivity of hypoxia inducible factor hydroxylation sites to hypoxia and hydroxylase inhibitors. J Biol Chem. 2011;286:13041–51.</a></li><li><a href="https://doi.org/10.1126/science.1059796">Jaakkola P. et al. Targeting of HIF-alpha to the von Hippel-Lindau ubiquitylation complex by O2-regulated prolyl hydroxylation. Science. 2001;292:468–72.</a></li><li><a href="https://doi.org/10.1038/20459">Maxwell PH. et al. The tumour suppressor protein VHL targets hypoxia-inducible factors for oxygen-dependent proteolysis. Nature. 1999;399:271–5.</a></li><li><a href="https://doi.org/10.1126/science.1059817">Ivan M. et al. HIFalpha targeted for VHL-mediated destruction by proline hydroxylation: implications for O2 sensing. Science. 2001;292:464–8.</a></li><li><a href="https://doi.org/10.1093/emboj/cdg392">Berra E., Benizri E., Ginouvès A., Volmat V., Roux D., Pouysségur J. HIF prolyl-hydroxylase 2 is the key oxygen sensor setting low steady-state levels of HIF-1α in normoxia. EMBO J. 2003;22:4082–4090.</a></li><li><a href="https://doi.org/10.1128/MCB.16.9.4604">Forsythe J. A., Jiang B. H., Iyer N. V. et al. Activation of vascular endothelial growth factor gene transcription by hypoxia-inducible factor 1. Mol Cell Biol. 1996;16:4604–4613.</a></li></ul><p>Схемы принципа методов и учебный рисунок иммуноблота: полосы показывают ожидаемое направление различий, а не измеренные величины. Данные экспериментов: клетки RCC4 и RCC4 с восстановленным pVHL, иммуноблот с антителами к Hyp402, Hyp564 и Asn803-OH, DMOG 1 мМ, хелаторы железа и ионы металлов, 4–5 ч (Tian 2011); связывание пептидов HIF-1α человека с pVHL (Ivan 2001; Jaakkola 2001); клеточные линии рака почки с дефектом VHL и введение VHL, коиммунопреципитация (Maxwell 1999); siRNA к PHD1–3 в клетках человека (Berra 2003); репортёр с HRE гена VEGF в клетках Hep3B (Forsythe 1996). Этот шаг — дополнительный материал о методах.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 29 из 30</div><h2>Как соотнести молекулярное событие, измерение и контроль</h2><p class="lead">В каждом из четырёх путей можно различить изменение сенсора или фермента, изменение регулятора и последующее изменение синтеза белков-мишеней. Конкретные молекулярные события на этих этапах различаются. Каждый этап характеризуется своей величиной, и каждую величину измеряют своим методом с собственным контролем.</p><ol class="mech"><li>Метод регистрирует определённое свойство объекта: содержание формы белка, долю модификации, локализацию, связывание, содержание РНК или скорость синтеза.</li><li>Сходный результат может возникнуть разными путями: рост содержания NRF2 или HIF-α — из-за замедления распада или ускорения синтеза.</li><li>Набор согласованных показателей и контролей, включая генетическое выключение звена, ограничивает число возможных объяснений.</li></ol><p>Четыре пути этого семинара устроены сходно. Сначала изменяется сенсор или фермент: киназа фосфорилирует <a href="#ns-g-S10-T08">eIF2α</a>, <a href="#ns-g-S10-T25">IRE1α</a> разрезает мРНК XBP1, электрофил модифицирует цистеины <a href="#ns-g-S10-T33">KEAP1</a>, недостаток O₂ ограничивает работу <a href="#ns-g-S10-T52">PHD</a>. Далее пути расходятся: снижение обменной активности eIF2B изменяет синтез ATF4; со сплайсированной мРНК XBP1s синтезируется белок XBP1s, а после протеолиза ATF6 образуется его N-концевой фрагмент. Замедление распада NRF2 или HIF-α повышает их содержание. Транскрипцию генов-мишеней в ядре регулируют белки ATF4, XBP1s, N-концевой фрагмент ATF6, NRF2 и комплекс HIF-α с ARNT. В результате меняется синтез белков-мишеней.</p><p>На каждом этапе нужно сначала выбрать величину, а уже потом метод. <a href="#ns-g-S10-T64">Содержание, доля модификации и активность</a> — разные величины. Иммуноблот показывает содержание определённой формы белка в образце, но не скорость реакции. Репортёрная конструкция показывает свойство участка мРНК или ДНК, но не всю регуляцию эндогенного гена. Количественная ОТ-ПЦР даёт содержание мРНК, но не количество белка. Масс-спектрометрия пептидов показывает химическое состояние остатка, но не его функцию.</p><p>Каждое измерение требует контроля, который исключает другие объяснения. Для фосфоформы это общий белок на той же мембране, для репортёра — вариант с изменённым регуляторным элементом, для коиммунопреципитации — контрольное антитело. Причинную роль звена проверяют генетическим выключением: если ответ исчезает в клетках без PERK, pVHL или NRF2 и возвращается после восстановления белка, звено необходимо в этих условиях.</p><p>Схема шага сводит события, величины, методы, контроли и границы вывода в одну таблицу. Рисунки этапов показывают порядок операций, а не результаты экспериментов. Подробные схемы методов с учебными рисунками сигналов даны в последних шагах четырёх разделов.</p><div class="note trap"><strong>Типичная ошибка</strong> Если два метода показали рост одного белка, неважно, какую величину измерил каждый из них.<p class="trap-fix">Иммуноблот общего белка, его ядерная доля и транскрипция мишеней — разные величины. Совпадение направления изменений не означает, что все этапы пути проверены.</p></div><div class="static-quiz"><h3>Что непосредственно покажет иммуноблот с антителом к общему NRF2 в суммарном клеточном лизате при корректном контроле загрузки?</h3><ol><li><b>А.</b> Относительное содержание белка NRF2 в этом образце. <i>(верный вариант)</i><br><span class="expl">Такое измерение относится к содержанию белка; его локализация и функция требуют отдельных подходов.</span></li><li><b>Б.</b> Скорость транскрипции каждого гена с ARE. <i>(неверный вариант)</i><br><span class="expl">Для транскрипционного выхода нужны другие показатели; общий белок в лизате их не измеряет.</span></li><li><b>В.</b> Абсолютную скорость KEAP1-зависимого разрушения NRF2. <i>(неверный вариант)</i><br><span class="expl">Одно измерение содержания не разделяет вклад синтеза и распада и не задаёт скорость удаления.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-10.html#q1">Вопрос 1 →</a> <a href="seminar-10.html#q2">Вопрос 2 →</a> <a href="seminar-10.html#q3">Вопрос 3 →</a> <a href="seminar-10.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1089/ars.2022.0123">Wek R.C., Anthony T.G., Staschke K.A. Surviving and Adapting to Stress: Translational Control and the Integrated Stress Response. Antioxid Redox Signal. 2023.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/21335549/">Tian YM. et al. Differential sensitivity of hypoxia inducible factor hydroxylation sites to hypoxia and hydroxylase inhibitors. J Biol Chem. 2011;286:13041–51.</a></li><li><a href="https://doi.org/10.7554/eLife.65703">Schoof M. et al. eIF2B conformation and assembly state regulate the integrated stress response. eLife. 2021;10:e65703.</a></li><li><a href="https://doi.org/10.1073/pnas.0400541101">Vattem KM., Wek RC. Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells. Proc Natl Acad Sci U S A. 2004;101:11269–74.</a></li><li><a href="https://doi.org/10.1016/s1097-2765(00)00133-7">Ye J., Rawson R. B., Komuro R. et al. ER stress induces cleavage of membrane-bound ATF6 by the same proteases that process SREBPs. Mol Cell. 2000;6:1355–1364.</a></li><li><a href="https://doi.org/10.1128/MCB.23.22.8137-8151.2003">Zhang DD., Hannink M. Distinct cysteine residues in Keap1 are required for Keap1-dependent ubiquitination of Nrf2 and for stabilization of Nrf2 by chemopreventive agents and oxidative stress. Mol Cell Biol. 2003;23:8137–51.</a></li><li><a href="https://doi.org/10.1126/science.1059817">Ivan M. et al. HIFalpha targeted for VHL-mediated destruction by proline hydroxylation: implications for O2 sensing. Science. 2001;292:464–8.</a></li><li><a href="https://doi.org/10.1126/science.1068592">Lando D. et al. Asparagine hydroxylation of the HIF transactivation domain a hypoxic switch. Science. 2002;295:858–61.</a></li></ul><p>Методический шаг: сопоставление методов, а не экспериментальный результат. Рисунки этапов — схемы операций без численных значений. Примеры результатов взяты из работ с указанными в соответствующих шагах условиями: Schoof 2021 (очищенные белки человека, обмен нуклеотидов), Vattem 2004 и Lu 2004 (репортёр с 5′-областью ATF4, клетки млекопитающих), Ye 2000 (клетки CHO без S1P или S2P), Zhang 2003 (замены цистеинов KEAP1), Ivan 2001 и Jaakkola 2001 (связывание pVHL с пептидами HIF-1α), Lando 2002 (Asn803 и p300), Tian 2011 (иммуноблот форм HIF-1α). Число повторов, концентрации и сроки переносятся только из конкретной статьи.</p></details></article><article class="card print-unit" id="ns-integrate"><div class="eyebrow">Исследование · шаг 30 из 30</div><h2>Как четыре механизма различаются при сочетании воздействий</h2><p class="lead">В условной клетке можно по отдельности изменить нагрузку на ЭПР, добавить электрофил и снизить O₂, а также убрать PERK или pVHL. Каждое воздействие действует через собственный первичный вход, поэтому ответ на их сочетание объясняют по состоянию каждого звена, а не как одну общую «активацию стрессовых путей».</p><ol class="mech"><li>Нарушение сворачивания в ЭПР активирует PERK, IRE1α и ATF6; электрофил модифицирует цистеины KEAP1; недостаток O₂ ограничивает гидроксилирование HIF-α ферментами PHD.</li><li>Отсутствие PERK устраняет PERK-зависимое фосфорилирование eIF2α, но не образование мРНК XBP1s и фрагмента ATF6; отсутствие pVHL замедляет распад HIF-α и при достаточном O₂.</li><li>Совпадение выходов (например, общие гены-мишени) или перекрёстная регуляция не делает пути тождественными и не означает, что любое воздействие активирует все четыре пути.</li></ol><p>Рассмотрим условную клетку, в которой три входа управляются независимо: нагрузка на ЭПР, электрофильное воздействие и содержание O₂. Другие киназы eIF2α не активированы, а IRE1α, ATF6, KEAP1, PHD и pVHL работают нормально, пока их не убирает переключатель. Такая система — учебная модель: она показывает канонический качественный результат, а не измерения в определённых клетках.</p><p>Для каждого входа причинная цепь своя. Нарушение сворачивания в ЭПР активирует <a href="#ns-g-S10-T16">PERK</a>, и фосфорилирование eIF2α усиливает синтез <a href="#ns-g-S10-T14">ATF4</a>; та же нагрузка активирует <a href="#ns-g-S10-T25">IRE1α</a>, который вместе с <a href="#ns-g-S10-T27">RtcB</a> образует мРНК XBP1s, с которой синтезируется белок XBP1s, и <a href="#ns-g-S10-T30">ATF6α</a>, который после протеолиза в аппарате Гольджи даёт N-концевой фрагмент. Электрофил модифицирует цистеины <a href="#ns-g-S10-T33">KEAP1</a>, и распад <a href="#ns-g-S10-T34">NRF2</a> замедляется. При недостатке O₂ <a href="#ns-g-S10-T52">PHD</a> образуют меньше гидроксилированного HIF-α, <a href="#ns-g-S10-T55">pVHL</a> распознаёт меньше молекул, и HIF-α накапливается.</p><p>Генетическое выключение звена проверяет его необходимость. Без PERK стресс ЭПР не повышает p-eIF2α в этой системе, но IRE1α и ATF6 активируются собственными путями. Без pVHL HIF-α накапливается и при достаточном O₂, хотя PHD продолжают его гидроксилировать. Каждое такое сравнение отвечает на вопрос об одном звене и при одних условиях.</p><p>Между путями есть перекрёстная регуляция: например, PERK может фосфорилировать NRF2, а ATF4 и NRF2 регулируют часть общих генов. Модель эти связи не рассчитывает. Из их существования не следует, что любое воздействие обязательно активирует все четыре пути: при каждом сочетании нужно проверять состояние каждого звена отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> Если пути связаны перекрёстной регуляцией, любое стрессовое воздействие активирует все четыре пути сразу.<p class="trap-fix">В этой учебной модели каждому пути задан собственный первичный вход: действие электрофила на сворачивание в ЭПР и влияние недостатка O₂ на KEAP1 не рассчитываются. В клетках перекрёстные связи существуют, а их вклад зависит от условий и проверяется отдельно.</p></div><div class="static-quiz"><h3>В условной системе стресс ЭПР активировал IRE1 и ATF6, но PERK отсутствует, а другие киназы eIF2α не активированы. Какое сочетание согласуется с этими условиями?</h3><ol><li><b>А.</b> XBP1s и активный фрагмент ATF6 образуются только после обязательного повышения p-eIF2α. <i>(неверный вариант)</i><br><span class="expl">В условии собственные входы IRE1 и ATF6 активированы; их выходы не требуют предварительного прохождения через PERK.</span></li><li><b>Б.</b> Без PERK исчезают все выходы UPR, включая XBP1s и фрагмент ATF6. <i>(неверный вариант)</i><br><span class="expl">Отсутствие одной ветви не тождественно выключению остальных сенсоров.</span></li><li><b>В.</b> XBP1s и активный фрагмент ATF6 могут образоваться без PERK-зависимого повышения p-eIF2α. <i>(верный вариант)</i><br><span class="expl">Раздельные молекулярные ветви допускают такое сочетание; это не утверждение об универсальном отсутствии перекрёстной регуляции.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-10.html#q1">Вопрос 1 →</a> <a href="seminar-10.html#q2">Вопрос 2 →</a> <a href="seminar-10.html#q3">Вопрос 3 →</a> <a href="seminar-10.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.aat5314">Costa-Mattioli M., Walter P. The integrated stress response: From mechanism to disease. Science. 2020.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00794-0">Acosta-Alvear D. et al. Homeostasis control in health and disease by the unfolded protein response. Nat Rev Mol Cell Biol. 2025.</a></li><li><a href="https://doi.org/10.1016/j.redox.2022.102389">Liu S., Pi J., Zhang Q. Signal amplification in the KEAP1-NRF2-ARE antioxidant response pathway. Redox Biol. 2022;54:102389.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2008.04.009">Kaelin W.G. Jr, Ratcliffe P.J. Oxygen sensing by metazoans: the central role of the HIF hydroxylase pathway. Mol Cell. 2008;30:393–402.</a></li><li><a href="https://doi.org/10.1128/MCB.23.20.7198-7209.2003">Cullinan S. B. et al. Nrf2 is a direct PERK substrate and effector of PERK-dependent cell survival. Mol Cell Biol. 2003;23:7198–7209.</a></li></ul><p>Явно условная система: учебная модель, качественные канонические состояния, без расчёта межпутевых эффектов. Другие киназы eIF2α не активированы; IRE1α, ATF6, KEAP1, PHD и pVHL работают, если не выключены переключателем. Связи путей описаны по обзорам Costa-Mattioli 2020 (ISR), Acosta-Alvear 2025 (UPR), Liu 2022 (KEAP1–NRF2) и Kaelin 2008 (HIF). Фосфорилирование NRF2 киназой PERK показано в клетках млекопитающих при стрессе ЭПР (Cullinan 2003, прочитана аннотация) и в модель не включено.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S10-T01"><dt>Интегрированный стрессовый ответ (ISR)</dt><dd>Система регуляции трансляции, в которой разные воздействия вызывают фосфорилирование Ser51 в α-субъединице eIF2. В результате инициация трансляции большинства мРНК замедляется, а трансляция некоторых мРНК, например мРНК ATF4, усиливается. ISR не синоним UPR и не общее название любой реакции на повреждение.</dd></div><div id="ns-g-S10-T02"><dt>Ответ на накопление неправильно свёрнутых белков (UPR)</dt><dd>Система регуляции, которая перестраивает работу ЭПР, когда белковая нагрузка превышает возможности сворачивания и обработки белков. У млекопитающих включает три ветви — PERK, IRE1α и ATF6. Запускается не только неправильно свёрнутыми белками, но и, например, изменением липидного состава мембраны ЭПР.</dd></div><div id="ns-g-S10-T03"><dt>Эндоплазматический ретикулум (ЭПР)</dt><dd>Мембранная система клетки, в просвете которой проходят сворачивание, образование дисульфидных связей, гликозилирование и сборка многих секреторных и мембранных белков; здесь же хранится Ca²⁺. Обозначение «ЭР» в книгах означает то же самое.</dd></div><div id="ns-g-S10-T04"><dt>Белковая нагрузка на ЭПР</dt><dd>Поступление в ЭПР белков, которые должны пройти сворачивание, сборку и обработку. Это поток, а не количество неправильно свёрнутых белков, накопленных к определённому моменту.</dd></div><div id="ns-g-S10-T05"><dt>Функциональная ёмкость ЭПР</dt><dd>Совокупные возможности ЭПР сворачивать, обрабатывать и удалять белки в данных условиях: шапероны, ферменты сворачивания, Ca²⁺, система ERAD. Не равна объёму ЭПР и не сводится к количеству BiP.</dd></div><div id="ns-g-S10-T06"><dt>Протеостаз</dt><dd>Поддержание функционального состава белков клетки за счёт согласования их синтеза, сворачивания, транспорта и удаления. Нарушение протеостаза не всегда проявляется видимыми агрегатами белков.</dd></div><div id="ns-g-S10-T07"><dt>Фактор инициации eIF2</dt><dd>Фактор инициации трансляции из трёх субъединиц (α, β, γ). В GTP-связанной форме eIF2 присоединяет инициаторную метионил-тРНК и доставляет её к малой субъединице рибосомы. eIF2 — весь фактор, eIF2α — одна его субъединица.</dd></div><div id="ns-g-S10-T08"><dt>eIF2α и eIF2(αP)</dt><dd>eIF2α — α-субъединица eIF2; eIF2(αP) — eIF2, у которого фосфорилирован Ser51 α-субъединицы. В коротких подписях используют обозначение p-eIF2α; его содержание сравнивают с содержанием общего eIF2α.</dd></div><div id="ns-g-S10-T09"><dt>Фактор обмена гуаниновых нуклеотидов eIF2B</dt><dd>Фактор обмена гуаниновых нуклеотидов, состоящий из двух копий каждого из пяти типов субъединиц. eIF2B ускоряет освобождение GDP из eIF2·GDP, после чего eIF2 связывает GTP. eIF2B не превращает GDP в GTP и не является киназой; eIF2(αP) подавляет его обменную активность.</dd></div><div id="ns-g-S10-T10"><dt>Тройной комплекс eIF2·GTP·Met-тРНКi</dt><dd>Комплекс eIF2·GTP·Met-тРНКi, необходимый для канонической инициации трансляции: он доставляет инициаторную метионил-тРНК к малой субъединице рибосомы. Это не весь преинициаторный комплекс 43S, а лишь его часть.</dd></div><div id="ns-g-S10-T11"><dt>Инициаторная метионил-тРНК</dt><dd>Особая тРНК (Met-тРНКi), которая доставляет метионин к старт-кодону в начале синтеза полипептида. Метионин внутри полипептидной цепи включают другие молекулы метионил-тРНК — элонгаторные.</dd></div><div id="ns-g-S10-T12"><dt>Открытая рамка считывания, начинающаяся перед основной рамкой (uORF)</dt><dd>Короткая открытая рамка считывания в 5′-области мРНК, старт-кодон которой расположен перед старт-кодоном основной рамки. uORF может заканчиваться до основной рамки или перекрывать её в другой рамке считывания. В мРНК ATF4 uORF1 позволяет повторную инициацию, а uORF2 препятствует трансляции ATF4; не все uORF подавляют трансляцию.</dd></div><div id="ns-g-S10-T13"><dt>Повторная инициация трансляции (реинициация)</dt><dd>Начало трансляции следующей рамки после завершения предыдущей короткой рамки, когда малая субъединица рибосомы остаётся на мРНК, продолжает сканирование и вновь присоединяет тройной комплекс. Это не то же самое, что пропуск старт-кодона со слабым окружением при первом сканировании.</dd></div><div id="ns-g-S10-T14"><dt>ATF4</dt><dd>Транскрипционный фактор семейства bZIP. При ISR трансляция его мРНК избирательно усиливается благодаря двум uORF в 5′-области; синтезированный ATF4 в ядре усиливает транскрипцию генов синтеза и переноса аминокислот, GADD34, CHOP и других. Усиление трансляции ATF4 и транскрипция его мишеней — разные этапы.</dd></div><div id="ns-g-S10-T15"><dt>GCN2 (EIF2AK4)</dt><dd>Киназа eIF2α (ген EIF2AK4), которая активируется при недостатке аминокислот: её регуляторный домен связывает незаряженные тРНК; в активации участвуют и рибосомы. GCN2 есть и у дрожжей, где она служит единственной киназой eIF2α.</dd></div><div id="ns-g-S10-T16"><dt>PERK (EIF2AK3)</dt><dd>Трансмембранная киназа ЭПР (ген человека EIF2AK3): её люминальный домен воспринимает нарушение сворачивания белков в ЭПР, а цитозольный киназный домен фосфорилирует Ser51 eIF2α. PERK — одновременно вход ISR и одна из трёх ветвей UPR.</dd></div><div id="ns-g-S10-T17"><dt>PKR (EIF2AK2)</dt><dd>Киназа eIF2α (ген EIF2AK2), которую канонически активирует двухцепочечная РНК, в том числе образующаяся при репликации вирусов. Синтетическая двухцепочечная РНК poly(I:C) в экспериментах воспроизводит лишь этот сигнал, а не все события вирусной инфекции.</dd></div><div id="ns-g-S10-T18"><dt>HRI (EIF2AK1)</dt><dd>Киназа eIF2α (ген EIF2AK1), которую ингибирует связанный гем: при недостатке гема HRI активируется, прежде всего в эритроидных клетках. HRI активируется и другими воздействиями, в частности фрагментом белка DELE1 при нарушении работы митохондрий (путь OMA1–DELE1–HRI).</dd></div><div id="ns-g-S10-T19"><dt>GADD34 (PPP1R15A)</dt><dd>Регуляторная субъединица протеинфосфатазы 1 (ген PPP1R15A), синтез которой индуцируется при ISR, в том числе с участием ATF4. GADD34 направляет PP1 к eIF2(αP); комплекс отщепляет фосфат от Ser51. Сам GADD34 не обладает ни фосфатазной, ни киназной активностью.</dd></div><div id="ns-g-S10-T20"><dt>CReP (PPP1R15B)</dt><dd>Регуляторная субъединица протеинфосфатазы 1 (ген PPP1R15B), которая образуется преимущественно постоянно и обеспечивает фоновое дефосфорилирование eIF2α. В отличие от GADD34, CReP не требует индукции стрессом.</dd></div><div id="ns-g-S10-T21"><dt>PP1</dt><dd>Протеинфосфатаза 1 — фермент, отщепляющий фосфатные группы от остатков серина и треонина. Какой белок дефосфорилирует PP1, во многом зависит от регуляторной субъединицы; дефосфорилирование eIF2α выполняют комплексы PP1 с GADD34 или CReP.</dd></div><div id="ns-g-S10-T22"><dt>CHOP (DDIT3)</dt><dd>Транскрипционный регулятор семейства C/EBP (ген DDIT3), синтез которого повышается при длительном ISR и стрессе ЭПР. При сохраняющемся нарушении CHOP может способствовать экспрессии генов, участвующих в апоптозе, но наличие CHOP само по себе не доказывает гибели клетки.</dd></div><div id="ns-g-S10-T23"><dt>ISRIB</dt><dd>Синтетическая малая молекула, которая связывается с eIF2B и делает его малочувствительным к eIF2(αP). ISRIB восстанавливает трансляцию при умеренном ISR, но не при высокой доле eIF2(αP); он не ингибирует киназы eIF2α и не дефосфорилирует eIF2α.</dd></div><div id="ns-g-S10-T24"><dt>BiP (HSPA5, GRP78)</dt><dd>Шаперон семейства Hsp70 в просвете ЭПР (ген HSPA5, другое название GRP78); связывает развёрнутые участки белков и участвует в регуляции сенсоров UPR. Изменение его связывания с сенсорами — не единственный механизм их активации: развёрнутые белки могут связываться с IRE1α и PERK непосредственно.</dd></div><div id="ns-g-S10-T25"><dt>IRE1α (ERN1)</dt><dd>Трансмембранный белок ЭПР (продукт гена ERN1) с люминальным доменом, воспринимающим стресс ЭПР, и цитозольными киназным и эндорибонуклеазным (РНКазным) доменами. Разрезает мРНК XBP1 и другие РНК, но не соединяет экзоны.</dd></div><div id="ns-g-S10-T26"><dt>XBP1u и XBP1s</dt><dd>Несплайсированная (XBP1u) и сплайсированная (XBP1s) формы мРНК XBP1, а также белки, которые они кодируют. Белок XBP1s — активный транскрипционный фактор генов белков ЭПР; белок XBP1u нестабилен и ограничивает ответ. В тексте всегда указано, идёт речь о мРНК или о белке.</dd></div><div id="ns-g-S10-T27"><dt>РНК-лигаза RtcB</dt><dd>Фермент, соединяющий 5′- и 3′-части мРНК XBP1 после того, как IRE1α вырежет интрон (у млекопитающих; работает с кофактором археазой). Без RtcB мРНК XBP1s не образуется, хотя IRE1α активен.</dd></div><div id="ns-g-S10-T28"><dt>Неканонический сплайсинг XBP1</dt><dd>Удаление короткого интрона из мРНК XBP1 в цитозоле: IRE1α разрезает мРНК в двух местах, РНК-лигаза RtcB соединяет её части. Идёт без сплайсосомы и отличается от канонического сплайсинга пре-мРНК сплайсосомой в ядре.</dd></div><div id="ns-g-S10-T29"><dt>Регулируемое IRE1-зависимое разрушение РНК (RIDD)</dt><dd>Регулируемое IRE1-зависимое разрушение РНК: IRE1α расщепляет определённые РНК, кроме мРНК XBP1, и их содержание снижается. Это отдельный выход IRE1α, а не другое название сплайсинга XBP1 и не обязательный сигнал гибели клетки.</dd></div><div id="ns-g-S10-T30"><dt>ATF6α и его N-концевой фрагмент</dt><dd>ATF6α — мембранный белок ЭПР (около 90 кДа), N-концевая часть которого содержит bZIP-домен транскрипционного фактора. После расщепления в аппарате Гольджи освобождается N-концевой фрагмент ATF6f (около 50 кДа), который регулирует транскрипцию в ядре. Полноразмерный белок и фрагмент — разные формы.</dd></div><div id="ns-g-S10-T31"><dt>Протеазы S1P и S2P</dt><dd>Протеазы аппарата Гольджи: S1P расщепляет ATF6α со стороны просвета, затем S2P — внутри мембраны, и освобождается ATF6f. Те же протеазы активируют транскрипционные факторы SREBP. В ЭПР и в свободном цитозоле ATF6α они не расщепляют.</dd></div><div id="ns-g-S10-T32"><dt>Деградация, связанная с ЭПР (ERAD)</dt><dd>Деградация, связанная с ЭПР: дефектный белок распознаётся в ЭПР, переносится через мембрану в цитозоль, убиквитинируется и разрушается протеасомой. Отличается от повторного сворачивания (белок остаётся в ЭПР) и от ER-фагии (части ЭПР разрушаются в лизосомах).</dd></div><div id="ns-g-S10-T33"><dt>KEAP1</dt><dd>Белок, который связывает NRF2 доменом Kelch и служит субстратным адаптером убиквитинлигазного комплекса с CUL3 и RBX1. Цистеины KEAP1 модифицируются электрофилами и окислителями, после чего убиквитинирование NRF2 ослабевает. KEAP1 — не пассивный «якорь» в цитоплазме и не протеаза.</dd></div><div id="ns-g-S10-T34"><dt>NRF2 (продукт NFE2L2)</dt><dd>Транскрипционный фактор семейства bZIP, продукт гена NFE2L2. В комплексе с малым Maf связывается с ARE и усиливает транскрипцию генов защиты от электрофилов и окислителей. Не путать с ядерным респираторным фактором 2 (NRF-2, GABP), регулирующим гены митохондриальных белков.</dd></div><div id="ns-g-S10-T35"><dt>Электрофил</dt><dd>Соединение или частица, способные принимать электронную пару при образовании химической связи; с тиоловыми группами цистеинов электрофилы образуют ковалентные соединения. Электрофил — не синоним свободного радикала, пероксида или любого окислителя.</dd></div><div id="ns-g-S10-T36"><dt>Тиоловая группа цистеина</dt><dd>Группа –SH боковой цепи остатка цистеина. Вступает в ковалентные реакции с электрофилами и окисляется окислителями, например с образованием дисульфидов. Модификация цистеина KEAP1 меняет функцию белка, но не обязательно разрушает его комплекс с NRF2.</dd></div><div id="ns-g-S10-T37"><dt>Комплекс KEAP1–CUL3–RBX1</dt><dd>Убиквитинлигазный комплекс семейства куллин-RING: KEAP1 распознаёт NRF2, куллин CUL3 служит каркасом, RBX1 обеспечивает перенос убиквитина. Один KEAP1 полной убиквитинлигазой не является.</dd></div><div id="ns-g-S10-T38"><dt>Убиквитинирование</dt><dd>Ковалентное присоединение убиквитина к белку или к уже присоединённому убиквитину с образованием цепи. Не всякое убиквитинирование ведёт к разрушению; в этом разделе рассматриваются цепи, направляющие белок в протеасому.</dd></div><div id="ns-g-S10-T39"><dt>Протеасомная деградация</dt><dd>Расщепление белка протеасомой после того, как он помечен цепью убиквитина и распознан. Содержание белка и скорость его разрушения — разные величины: при постоянном синтезе замедление разрушения повышает содержание.</dd></div><div id="ns-g-S10-T40"><dt>Малые Maf-белки</dt><dd>Небольшие белки MafF, MafG и MafK семейства bZIP, не имеющие собственного домена активации транскрипции. Образуют гетеродимеры с NRF2 и другими факторами, в том числе с репрессором BACH1, и связываются с регуляторными последовательностями ДНК. Партнёр NRF2 — малый Maf, а не ARNT (партнёр HIF-α).</dd></div><div id="ns-g-S10-T41"><dt>Элемент антиоксидантного ответа (ARE)</dt><dd>Регуляторная последовательность ДНК в промоторах и энхансерах генов-мишеней, с которой связывается гетеродимер NRF2–малый Maf. ARE — участок ДНК, а не белок и не показатель окислительного повреждения; его не следует путать с HRE, с которым связывается комплекс HIF.</dd></div><div id="ns-g-S10-T42"><dt>p62/SQSTM1</dt><dd>Рецептор селективной аутофагии, связывающий убиквитинированные грузы и белок LC3. Мотивом KIR связывается с доменом Kelch белка KEAP1 и мешает связыванию NRF2; ген SQSTM1 — мишень NRF2. Высокое содержание p62 может отражать и усиленный синтез, и нарушенное удаление; универсальным субстратом KEAP1 p62 не является.</dd></div><div id="ns-g-S10-T43"><dt>GSH и GSSG</dt><dd>Восстановленная (GSH) и окисленная, дисульфидная (GSSG) формы глутатиона — трипептида γ-глутамилцистеинилглицина. Две молекулы GSH окисляются в одну GSSG. Отношение форм, общее содержание глутатиона и скорость его обновления — разные величины.</dd></div><div id="ns-g-S10-T44"><dt>NADPH</dt><dd>Восстановленная форма NADP⁺, донор электронов для восстановительных реакций биосинтеза и для восстановления GSSG глутатионредуктазой и тиоредоксина тиоредоксинредуктазой. NADPH и NADH — разные коферменты, и в этих реакциях один не заменяет другой.</dd></div><div id="ns-g-S10-T45"><dt>NQO1</dt><dd>NAD(P)H:хиноноксидоредуктаза 1 — фермент, восстанавливающий хиноны; один из часто используемых показателей NRF2-зависимой программы. Количество мРНК NQO1, количество белка и его активность — разные величины.</dd></div><div id="ns-g-S10-T46"><dt>GCLC и GCLM</dt><dd>Каталитическая (GCLC) и модифицирующая (GCLM) субъединицы глутамат-цистеин-лигазы — фермента первой стадии синтеза глутатиона. Их гены — мишени NRF2. Это ферментные субъединицы, а не сам глутатион.</dd></div><div id="ns-g-S10-T47"><dt>TXNRD1</dt><dd>Тиоредоксинредуктаза 1 — фермент, восстанавливающий окисленный тиоредоксин за счёт NADPH; один из конкретных эффекторов NRF2-зависимой программы, а не обобщённый «антиоксидантный белок».</dd></div><div id="ns-g-S10-T48"><dt>HMOX1 и гемоксигеназа-1 (HO-1)</dt><dd>HMOX1 — ген, гемоксигеназа-1 (HO-1) — его белковый продукт, расщепляющий гем до биливердина, Fe²⁺ и CO. Транскрипцию HMOX1 регулирует не только NRF2 (например, и репрессор BACH1), поэтому рост HMOX1 не является ни исключительно NRF2-зависимым показателем, ни признаком защиты от любого повреждения.</dd></div><div id="ns-g-S10-T49"><dt>HIF</dt><dd>Факторы, индуцируемые гипоксией, — семейство транскрипционных регуляторов. Комплексы HIF-1 и HIF-2 образованы регулируемой α-субъединицей и β-субъединицей ARNT; они связываются с элементами ответа на гипоксию (HRE) и активируют транскрипцию генов-мишеней. У HIF-3α есть функционально различные варианты, в том числе ингибирующие действие HIF-1. HIF-α — субъединица, а не весь комплекс.</dd></div><div id="ns-g-S10-T50"><dt>HIF-1α и HIF-2α</dt><dd>Две наиболее изученные α-субъединицы HIF человека — продукты генов HIF1A и EPAS1. Обе регулируются гидроксилированием и pVHL-зависимым распадом, но активируют частично разные наборы генов и по-разному представлены в тканях: например, физиологическая регуляция эритропоэтина связана преимущественно с HIF-2.</dd></div><div id="ns-g-S10-T51"><dt>ARNT/HIF-1β</dt><dd>β-Субъединица комплекса HIF (её называют также HIF-1β); в клетке присутствует постоянно, и её содержание мало зависит от O₂. Без α-субъединицы активного комплекса HIF нет. ARNT образует комплексы и с другими белками, например с рецептором ароматических углеводородов AHR.</dd></div><div id="ns-g-S10-T52"><dt>Пролилгидроксилазы HIF (PHD)</dt><dd>Ферменты PHD1–3 (продукты генов EGLN), которые гидроксилируют определённые остатки пролина в HIF-α. Это Fe(II)- и 2-оксоглутарат-зависимые диоксигеназы: O₂ и 2-оксоглутарат расходуются в реакции, а Fe(II) находится в активном центре. Сокращение PHD здесь не означает пируватдегидрогеназу.</dd></div><div id="ns-g-S10-T53"><dt>PHD1/EGLN2, PHD2/EGLN1, PHD3/EGLN3</dt><dd>Соответствие названий белков и генов человека: PHD1 — EGLN2, PHD2 — EGLN1, PHD3 — EGLN3; номера не совпадают. В клетках человека основную роль в поддержании низкого содержания HIF-1α при нормоксии играет PHD2; вклад PHD1 и PHD3 зависит от клеток.</dd></div><div id="ns-g-S10-T54"><dt>2-Оксоглутарат (α-кетоглутарат)</dt><dd>Промежуточный продукт цикла трикарбоновых кислот (синоним — α-кетоглутарат). В реакции PHD и FIH он расходуется: окислительно декарбоксилируется до сукцината и CO₂, а один атом O₂ входит в сукцинат. Близкие по строению сукцинат и фумарат при накоплении могут тормозить PHD. В экспериментах с очищенными человеческими ферментами они ингибировали PHD1–3, но не FIH (Koivunen 2007).</dd></div><div id="ns-g-S10-T55"><dt>pVHL</dt><dd>Белковый продукт гена-супрессора опухолей VHL (VHL — ген, pVHL — белок). В составе E3-комплекса pVHL связывает HIF-α, гидроксилированный по остаткам пролина, и обеспечивает его убиквитинирование. Сам pVHL HIF-α не гидроксилирует.</dd></div><div id="ns-g-S10-T56"><dt>Комплекс pVHL–элонгины B/C–CUL2–RBX1</dt><dd>Убиквитинлигазный комплекс, в котором pVHL связывает субстрат, элонгины B и C соединяют его с куллином CUL2, а RBX1 привлекает фермент, несущий активированный убиквитин. Комплекс присоединяет к гидроксилированному HIF-α цепь убиквитина, после чего белок разрушается протеасомой. CUL2 этого комплекса и CUL3 комплекса с KEAP1 — разные белки.</dd></div><div id="ns-g-S10-T57"><dt>Пролилгидроксилирование HIF-α</dt><dd>Присоединение гидроксильной группы к атому C4 определённых остатков пролина HIF-α с образованием 4-гидроксипролина; реакцию катализируют PHD. В HIF-1α человека это Pro402 и Pro564; у HIF-2α номера остатков другие. Модификация создаёт участок, который распознаёт pVHL.</dd></div><div id="ns-g-S10-T58"><dt>FIH</dt><dd>Фактор, подавляющий HIF (factor inhibiting HIF), — Fe(II)- и 2-оксоглутарат-зависимая гидроксилаза, которая модифицирует остаток аспарагина в C-концевом домене активации HIF-α (Asn803 в HIF-1α человека). Гидроксилированный аспарагин препятствует связыванию коактиваторов p300/CBP, но не направляет HIF-α к распаду.</dd></div><div id="ns-g-S10-T59"><dt>Коактиваторы p300/CBP</dt><dd>Белки-коактиваторы транскрипции, которые связываются с доменами активации многих транскрипционных факторов, в том числе с C-концевым доменом HIF-α, если Asn803 не гидроксилирован. Они участвуют в усилении транскрипции генов-мишеней и не участвуют в распознавании HIF-α для распада.</dd></div><div id="ns-g-S10-T60"><dt>Элемент ответа на гипоксию (HRE)</dt><dd>Участок ДНК в регуляторной области гена, с которым связывается комплекс HIF-α–ARNT; содержит основную последовательность 5′-RCGTG-3′. Для ответа обычно нужны и соседние участки связывания других белков. HRE — не то же, что элемент антиоксидантного ответа ARE, с которым связывается NRF2.</dd></div><div id="ns-g-S10-T61"><dt>Гипоксия и реоксигенация</dt><dd>Гипоксия — доступность кислорода, недостаточная для рассматриваемой системы (культуры, ткани, органа); реоксигенация — последующее восстановление этой доступности. Содержание O₂ в газовой фазе, у самих клеток и в тканях различается, поэтому 21 % O₂ в инкубаторе не является универсальной нормой для клеток организма.</dd></div><div id="ns-g-S10-T62"><dt>Псевдогипоксический ответ</dt><dd>Активация части гипоксической регуляции при достаточном O₂, например при потере pVHL или при накоплении сукцината или фумарата, тормозящих PHD. Для каждого случая указывают конкретную причину. Это не синоним эффекта Варбурга — усиленного превращения глюкозы в лактат при доступном кислороде.</dd></div><div id="ns-g-S10-T63"><dt>Киназа пируватдегидрогеназы 1 (PDK1)</dt><dd>Киназа пируватдегидрогеназы 1 (ген PDK1): фосфорилирует и подавляет пируватдегидрогеназный комплекс, поэтому пируват реже превращается в ацетил-CoA. Её ген — одна из мишеней HIF-1. Не путать с PDPK1 (3-фосфоинозитид-зависимой киназой 1) пути PI3K–AKT, которую тоже сокращают как PDK1.</dd></div><div id="ns-g-S10-T64"><dt>Содержание, доля модификации и активность</dt><dd>Три разные величины. Содержание — количество белка в образце; доля модификации — отношение числа молекул с данной модификацией к общему числу молекул этого белка; активность — его функция в заданных условиях, например скорость катализируемой реакции или способность активировать транскрипцию. Одно не следует из другого, поэтому вместо общего слова «уровень» называют конкретную величину.</dd></div></dl></section></noscript>

Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Этот шаг объединяет материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Стрессовые программы: ISR, UPR, KEAP1–NRF2 и HIF","stats":[["4 механизма","от трансляции к стабильности регуляторов"],["Объяснения","с вопросами для самопроверки"],["44 сценария","в отдельном практикуме"]],"num_fmt":"10.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел II: семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе"},"lessons":[{"id":"isr","number":1,"section":0,"title":"Как разные воздействия сходятся на eIF2α","question":1,"questions":[1],"keywords":["ISR","интегрированный стрессовый ответ","eIF2α","Ser51","GCN2","PERK","PKR","HRI","EIF2AK1","EIF2AK2","EIF2AK3","EIF2AK4","киназы eIF2α","UPR"],"lead":["[[T01|Интегрированный стрессовый ответ]] (ISR) — система регуляции трансляции, в которой разные воздействия сходятся на одной модификации: фосфорилировании остатка Ser51 в α-субъединице фактора инициации eIF2.","Поэтому ответы на недостаток аминокислот, стресс ЭПР, вирусную РНК и недостаток гема имеют общее звено, хотя запускаются разными киназами."],"mechanism":["У млекопитающих четыре киназы — [[T15|GCN2]], [[T16|PERK]], [[T17|PKR]] и [[T18|HRI]] — фосфорилируют Ser51 [[T08|eIF2α]].","eIF2 с фосфорилированной α-субъединицей подавляет обменную активность [[T09|eIF2B]], и доступность тройного комплекса для инициации трансляции уменьшается.","Общий узел не означает одинакового ответа: исход зависит от силы и длительности воздействия и от других путей, которые оно активирует."],"paragraphs":["Синтез белка начинается с инициации трансляции: малая субъединица рибосомы с инициаторной метионил-тРНК находит старт-кодон мРНК. Метионил-тРНК доставляет [[T07|фактор инициации eIF2]] в GTP-связанной форме. ISR изменяет именно этот этап. Поэтому ISR определяют не через «стресс вообще», а через конкретное молекулярное событие — фосфорилирование eIF2α по Ser51.","Это событие катализируют четыре киназы, каждая из которых воспринимает свой сигнал. GCN2 активируется незаряженными тРНК, которые накапливаются при недостатке аминокислот. PERK — трансмембранная киназа ЭПР; её активирует накопление неправильно свёрнутых белков в просвете ЭПР. PKR активируется двухцепочечной РНК, которая появляется при репликации многих вирусов. HRI связана с доступностью гема, а также с некоторыми другими воздействиями, в том числе с нарушением работы митохондрий. Соответствие «сигнал — киназа» описывает канонические условия: одно воздействие может активировать больше одной киназы.","Через PERK ISR пересекается с [[T02|ответом на неправильно свёрнутые белки]] (UPR). Но PERK — лишь одна из трёх ветвей UPR, а нарушение сворачивания в ЭПР — лишь один из входов ISR. Две другие ветви UPR, IRE1α и ATF6, фосфорилирование eIF2α не используют; GCN2, PKR и HRI фосфорилируют eIF2α без участия ЭПР.","Общий узел возник в эволюции рано. У пекарских дрожжей есть одна киназа eIF2α — Gcn2, связанная с недостатком аминокислот; у млекопитающих киназ четыре, и они воспринимают разные сигналы. Из сходства узла не следует, что вся сеть регуляторов у дрожжей и человека одинакова."],"trap":["Любое нарушение работы ЭПР обязательно запускает ISR, а любой ISR — это ответ ЭПР.","ЭПР связан с ISR только через PERK. Другие киназы фосфорилируют eIF2α без участия ЭПР, а ветви UPR IRE1α и ATF6 действуют без фосфорилирования eIF2α."],"conditions":"Схема механизма для клеток млекопитающих; состояния качественные. Соответствие воздействия и киназы приведено для канонических условий (обзоры Costa-Mattioli 2020, Wek 2023, Ryoo 2024); в конкретной клетке одно воздействие может активировать несколько киназ. Сравнение с дрожжами Saccharomyces cerevisiae (одна киназа Gcn2) не означает одинакового состава всей регуляторной сети.","sources":["Costa2020","Wek2023","Ryoo2024"],"quiz":{"id":"S10-L01","rev":1,"question":"Какое звено является общим для канонического ответа, запускаемого GCN2, PERK, PKR и HRI у млекопитающих?","options":[{"id":"S10-L01-2","text":"Удаление интрона из мРНК XBP1.","correct":false,"feedback":"Это выход РНКазной активности IRE1, а не общий выход четырёх eIF2α-киназ."},{"id":"S10-L01-3","text":"Расщепление мембранного белка ATF6 в аппарате Гольджи.","correct":false,"feedback":"Так активируется отдельная ветвь UPR; этот процесс не является общим этапом ISR."},{"id":"S10-L01-1","text":"Фосфорилирование Ser51 в α-субъединице eIF2.","correct":true,"feedback":"Все четыре киназы сходятся на этой модификации; дальнейший ответ зависит также от других регуляторов."}]},"widget":{"kind":"net","title":"","s":{"title":"Четыре киназы сходятся на Ser51 eIF2α","status":"Схема механизма · качественные состояния","ctrls":[{"id":"i","type":"group","label":"Воздействие","opts":["Без воздействия","Недостаток аминокислот","Нарушение сворачивания в ЭПР","Двухцепочечная РНК","Недостаток гема"]},{"id":"u","type":"check","label":"Показать другие ветви UPR"}],"W":516,"H":372,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"ветви UPR, не связанные с eIF2α","nodes":["жёлтая рамка — киназа или звено активно","пунктирная рамка — неактивно или снижено","P — фосфорилирован Ser51"]},"zones":[],"mem":[],"nodes":{"aa":{"p":[64,40,118,50],"t":"недостаток\nаминокислот","n":[7
