_w3": "Агрегаты при разбавлении не растворяются, а жидкоподобные капли в этой модели образованы слабыми контактами и растворяются ниже порога.", "p3b_5_q": "У белков с четырьмя модулями порог — 60 мкМ, в каплях белок концентрирован в 100 раз. Общая концентрация — 120 мкМ. Какая доля молекул белка находится в каплях?", "p3b_5_o1": "Около половины", "p3b_5_o2": "Около одного процента", "p3b_5_o3": "Почти все молекулы", "p3b_5_e": "Избыток над порогом — 60 мкМ из 120, то есть половина молекул; он и уходит в плотную фазу. Капли при этом занимают всего около 1 % объёма раствора: белок в них концентрирован в сто раз. Долю объёма и долю молекул нельзя путать.", "p3b_5_w2": "Около 1 % — это доля объёма, занятая каплями, а не доля молекул. Поскольку в каплях белок концентрирован в 100 раз, в этом малом объёме находится половина молекул.", "p3b_5_w3": "Вне капель белок остаётся в концентрации порога, 60 мкМ, — это половина от 120 мкМ. Поэтому в каплях может быть только другая половина.", "s3a_m_t": "Эксперимент", "s3a_m_foci": "яркие фокусы в клетке", "s3a_m_mat": "созревание капель FUS", "s3a_f_t": "Фокус", "s3a_f1": "фокус 1", "s3a_f2": "фокус 2", "s3a_f3": "фокус 3", "s3a_f4": "фокус 4", "s3a_my": "Загадка: природа фокуса скрыта", "s3a_e_t": "Проверка", "s3a_e_frap": "FRAP", "s3a_e_dil": "снизить концентрацию белка", "s3a_e_fuse": "сближение двух фокусов", "s3a_e_mem": "маркер мембраны", "s3a_e_arom": "замена ароматических остатков в IDR", "s3a_e_hex": "1,6-гександиол", "s3a_var_t": "Белок", "s3a_var_wt": "FUS дикого типа", "s3a_var_g": "FUS G156E", "s3a_h_t": "Время после образования капель", "s3a_note_foci": "Клетки экспрессируют флуоресцентный белок, распределённый в виде ярких фокусов. За четырьмя одинаковыми на вид фокусами скрыты четыре разные структуры: конденсат, комплексы постоянного состава с обратимо связанным белком, белок на мембране невидимой в этом канале органеллы и агрегат. Числа — учебные величины.", "s3a_note_mat": "Капли очищенного белка FUS в пробирке. Подвижная фракция FRAP измерена в момент образования капель и через выбранное время. Числа — учебная модель; качественно — по экспериментам Patel 2015: капли FUS с патогенной заменой G156E теряют жидкоподобные свойства быстрее.", "s3a_before": "До проверки", "s3a_after_frap": "Через 60 с после фотообесцвечивания", "s3a_after_dil": "Концентрация белка снижена вдвое", "s3a_after_fuse": "Через минуту после сближения", "s3a_after_mem": "Второй канал: маркер мембраны", "s3a_after_arom": "Белок с заменой ароматических остатков", "s3a_after_hex": "Через 2 мин после 1,6-гександиола", "s3a_imnote_frap": "пунктир — фокус, флуоресценцию которого погасили светом", "s3a_imnote_dil": "новая концентрация ниже концентрации насыщения, найденной для этого белка в пробирке", "s3a_imnote_fuse": "два фокуса внизу снимка сближаются до соприкосновения", "s3a_imnote_mem": "красные кольца — маркер мембраны органеллы во втором канале", "s3a_imnote_arom": "замены не нарушают известного специфического связывания белка с партнёром", "s3a_imnote_hex": "1,6-гександиол в концентрации, растворяющей многие жидкоподобные сборки (5 %)", "s3a_imnote_mat": "слева — капли сразу после образования, справа — через выбранное время", "s3a_noplot": "кривая FRAP — при проверке FRAP", "s3a_frap_t": "FRAP: флуоресценция погашенного участка", "s3a_frap_x": "время после обесцвечивания, с", "s3a_frap_y": "доля исходной яркости", "s3a_frap_leg": "на графике пунктир — FRAP сразу после образования капель", "s3a_what_t": "Что это за структура", "s3a_what_hidden": "Природа фокуса скрыта", "s3a_name_cond": "конденсат", "s3a_name_cplx": "комплексы постоянного состава", "s3a_name_org": "белок на мембране органеллы", "s3a_name_agg": "агрегат", "s3a_mat_t0": "Сразу после образования капель", "s3a_mat_th": "Через {h} ч", "s3a_mat_cond": "очищенный белок, in vitro, учебные величины", "s3a_state_liq": "жидкоподобные капли: быстрый обмен", "s3a_state_mid": "обмен замедлен", "s3a_state_sol": "твёрдоподобные капли: обмена почти нет", "s3a_r_focus": "Исследуемый фокус", "s3a_r_mf": "Подвижная фракция FRAP (доля исходной яркости через 60 с)", "s3a_r_th": "Время полувосстановления", "s3a_r_th_s": "за какое время восстанавливается половина подвижной фракции", "s3a_r_th_none": "не определяется", "s3a_r_res": "Результат проверки", "s3a_r_state": "Состояние капель", "s3a_r_note": "Учебная модель: числа показывают характер ответа каждой структуры, а не измеренные величины конкретной работы.", "s3a_r_note_mat": "Подвижная фракция FRAP — доля флуоресценции, восстановившаяся за 60 с после обесцвечивания. Учебная модель; условия: очищенный белок FUS, капли in vitro.", "s3a_res_dil_gone": "фокусы исчезли", "s3a_res_dil_dim": "фокусы остались, стали тусклее", "s3a_res_dil_same": "фокусы не изменились", "s3a_res_fuse_merge": "слились в один округлый фокус", "s3a_res_fuse_touch": "соприкасаются, но не сливаются", "s3a_res_mem_yes": "фокусы совпадают с маркером мембраны", "s3a_res_mem_no": "фокусы не совпадают с маркером мембраны", "s3a_res_arom_gone": "фокусов нет", "s3a_res_arom_kept": "фокусы сохранились", "s3a_res_hex_gone": "фокусы растворились", "s3a_res_hex_kept": "фокусы сохранились", "s3a_open_pre": "Это {name}.", "s3a_c_frap_fast": "После фотообесцвечивания флуоресценция фокуса восстановилась на {mf} %, время полувосстановления — {th} с: меченый белок быстро обменивается с окружением.", "s3a_c_frap_fast_z": "Быстрый FRAP показывает обмен компонентов, но не различает конденсат и обратимо связанный белок.", "s3a_c_frap_none": "После фотообесцвечивания флуоресценция фокуса за минуту восстановилась лишь на {mf} %: молекулы фокуса почти не обмениваются с окружением.", "s3a_c_frap_none_z": "Отсутствие обмена характерно для агрегата или твёрдоподобной сборки; жидкоподобный конденсат так себя не ведёт.", "s3a_c_dil_gone": "После снижения концентрации белка вдвое, ниже концентрации насыщения, фокусы исчезли: белок перешёл в однородный раствор.", "s3a_c_dil_gone_z": "Исчезновение ниже порога согласуется с фазовым разделением, но само по себе его не доказывает: от концентрации зависят и другие обратимые сборки.", "s3a_c_dil_dim": "После снижения концентрации белка вдвое фокусы сохранились, но стали тусклее: в них меньше меченого белка, а сама структура осталась.", "s3a_c_dil_dim_z": "В модели структура, на которой белок удерживается связыванием (комплекс, мембрана органеллы), ниже порога не исчезает, а только тускнеет; в реальной клетке исход зависит от прочности связывания.", "s3a_c_dil_same": "После снижения концентрации белка вдвое фокусы не изменились: уже образовавшаяся структура не растворяется.", "s3a_c_dil_same_z": "Нечувствительность к снижению концентрации говорит против жидкоподобного конденсата и характерна для устойчивой сборки, например агрегата.", "s3a_c_fuse_merge": "Два соприкоснувшихся фокуса слились и приняли форму одного округлого фокуса.", "s3a_c_fuse_merge_z": "Слияние с последующим округлением — признак жидкоподобного поведения (решающее наблюдение для P-гранул, Brangwynne 2009), но само по себе оно не показывает, каким механизмом образована фаза.", "s3a_c_fuse_touch": "Два фокуса соприкоснулись, но не слились: каждый сохранил свои размеры и форму.", "s3a_c_fuse_touch_z": "Без слияния жидкоподобное состояние не подтверждается; так ведут себя комплексы, органеллы и агрегаты.", "s3a_c_mem_yes": "Фокусы совпадают с маркером мембраны органеллы во втором канале: белок сосредоточен на органелле, невидимой в канале белка.", "s3a_c_mem_yes_z": "Совпадение с органеллой объясняет вид фокуса без отдельной фазы; при разрешении около 200 нм оно ещё не доказывает прямого связывания белка с мембраной.", "s3a_c_mem_no": "Маркер мембраны во втором канале виден, но с фокусами не совпадает: фокусы не лежат на этой органелле.", "s3a_c_mem_no_z": "Отрицательный результат исключает одну из альтернатив — скопление белка на этой мембранной органелле, — но конденсата ещё не доказывает.", "s3a_c_arom_gone": "Белок с заменой ароматических остатков в неупорядоченной области фокусов не образует, хотя известное специфическое связывание с партнёром у него сохранено.", "s3a_c_arom_gone_z": "Фокусы образованы множественными слабыми контактами неупорядоченной области. Если при этом нарушается и функция, это довод в пользу того, что для неё нужна именно конденсация.", "s3a_c_arom_kept": "Белок с заменой ароматических остатков в неупорядоченной области по-прежнему образует фокусы.", "s3a_c_arom_kept_z": "Фокусы образованы не слабыми контактами неупорядоченной области, а специфическим связыванием или уже сложившейся устойчивой структурой.", "s3a_c_hex_gone": "Через 2 мин после добавления 1,6-гександиола фокусы растворились.", "s3a_c_hex_gone_z": "Растворение гександиолом не доказывает ни фазового разделения, ни его роли в функции: гександиол действует неизбирательно.", "s3a_c_hex_kept": "Через 2 мин после добавления 1,6-гександиола фокусы сохранились.", "s3a_c_hex_kept_z": "Устойчивость к гександиолу говорит против жидкоподобного конденсата, но гександиол меняет и активность ферментов, и проницаемость мембран, поэтому результат требует других проверок.", "s3a_c_mat_wt_liq": "Капли FUS дикого типа через {h} ч остаются жидкоподобными: подвижная фракция FRAP — {mf} %.", "s3a_c_mat_wt_liq_z": "Жидкоподобное состояние капель очищенного FUS сохраняется часами, но оно метастабильно: со временем обмен постепенно замедляется.", "s3a_c_mat_wt_mid": "Капли FUS дикого типа через {h} ч обмениваются медленнее: подвижная фракция FRAP снизилась до {mf} %.", "s3a_c_mat_wt_mid_z": "Созревание идёт и у белка дикого типа; патогенные замены лишь ускоряют его.", "s3a_c_mat_wt_sol": "Капли FUS дикого типа через {h} ч почти не обмениваются с окружением: подвижная фракция FRAP — {mf} %.", "s3a_c_mat_wt_sol_z": "Капля перешла в твёрдоподобное состояние; её уже нельзя отличить от агрегата по одному FRAP.", "s3a_c_mat_g156e_liq": "Капли FUS G156E через {h} ч ещё жидкоподобны: подвижная фракция FRAP — {mf} %.", "s3a_c_mat_g156e_liq_z": "Сразу после образования капли с заменой G156E по обмену не отличаются от капель белка дикого типа.", "s3a_c_mat_g156e_mid": "Капли FUS G156E через {h} ч обмениваются заметно медленнее: подвижная фракция FRAP снизилась до {mf} %.", "s3a_c_mat_g156e_mid_z": "Замена в неупорядоченной области ускоряет переход жидкость — твёрдое.", "s3a_c_mat_g156e_sol": "Капли FUS G156E через {h} ч почти не обмениваются с окружением: подвижная фракция FRAP — {mf} %.", "s3a_c_mat_g156e_sol_z": "Капли с патогенной заменой переходят в твёрдоподобное состояние быстрее, чем капли белка дикого типа; такие замены найдены у больных боковым амиотрофическим склерозом.", "s3a_take": "Яркий фокус в микроскопе одинаково выглядит у конденсата, у комплексов с обратимо связанным белком, у белка на мембране органеллы и у агрегата. Быстрый FRAP показывает только обмен компонентов, а гександиол действует неизбирательно. На конденсат указывает лишь сочетание признаков — исчезновение при снижении концентрации, обмен с окружением, слияние с округлением, потеря фокусов при заменах, нарушающих только слабые контакты, — и каждый из них ограничен: пороговую зависимость от концентрации дают и другие кооперативные сборки. Капли очищенного FUS in vitro со временем теряют жидкоподобные свойства, а замена G156E ускоряет этот переход.", "gn_s3cond": "Конденсат", "g_s3cond": "Компартмент без мембраны, в котором белки и РНК локально обогащены. В модели фокус-конденсат — жидкоподобная плотная фаза, образованная множественными слабыми контактами: она существует, пока концентрация каркаса выше порога, обменивается компонентами с окружением, а соприкоснувшиеся капли сливаются и округляются. Меченый белок — каркасный компонент, поэтому при снижении концентрации ниже порога и при замене ароматических остатков в его неупорядоченной области фокусы исчезают.", "gn_s3cplx": "Комплексы постоянного состава", "g_s3cplx": "Крупные белковые комплексы определённой стехиометрии, с которыми меченый белок обратимо связывается через специфические домены. Пока комплексы существуют, белок скапливается на них; его обмен с раствором идёт быстро, поэтому FRAP восстанавливается почти как у конденсата (McSwiggen 2019). В модели комплексы существуют независимо от меченого белка, поэтому при снижении его концентрации фокусы лишь тускнеют; если же сборка самих комплексов кооперативна, фокусы могут исчезать при разведении и без фазового разделения. Комплексы не сливаются при соприкосновении.", "gn_s3org": "Белок на мембране органеллы", "g_s3org": "Белок, обратимо связанный с мембраной органеллы, которая сама в канале этого белка не видна (в модели — пероксисома). Органеллы выглядят как яркие фокусы; связывание и отделение белка дают быстрый FRAP. Отличить такой фокус помогает второй канал с маркером мембраны. Слияния зрелых пероксисом между собой у млекопитающих не показано (вопрос 2), поэтому при соприкосновении фокусы остаются раздельными.", "gn_s3agg": "Агрегат", "g_s3agg": "Скопление ассоциированных белковых молекул; агрегаты бывают аморфными и упорядоченными, в том числе амилоидными. В модели — устойчивый агрегат с очень медленным обменом молекул: FRAP почти не восстанавливается, структура не растворяется при снижении концентрации и при добавлении гександиола, фокусы неправильной формы не сливаются. Агрегат может образоваться внутри созревшего конденсата, но наблюдение конденсата не является наблюдением агрегата (Visser 2024).", "gn_frap": "FRAP", "g_frap": "Восстановление флуоресценции после фотообесцвечивания: флуоресценцию участка гасят ярким светом и измеряют, как она восстанавливается за счёт обмена молекул с окружением. Подвижная фракция — доля восстановившейся флуоресценции, время полувосстановления — за сколько секунд восстанавливается половина подвижной фракции. Оба числа зависят от диффузии, связывания, размера участка и выбранной модели расчёта (Taylor 2019), поэтому быстрое восстановление показывает обмен компонентов, но не доказывает жидкого состояния.", "gn_fus": "FUS и замена G156E", "g_fus": "РНК-связывающий белок с протяжённой неупорядоченной областью низкой сложности. В клетках FUS собирается в жидкоподобные конденсаты в местах повреждения ДНК и в цитоплазме при стрессе. Капли очищенного FUS in vitro со временем теряют подвижность и переходят в волокнистое твёрдоподобное состояние; патогенная замена G156E, найденная у больных боковым амиотрофическим склерозом, ускоряет этот переход (Patel 2015). Числа в практикуме — учебные.", "p3a_1_q": "Фокус 1: после фотообесцвечивания его флуоресценция за секунды восстановилась почти полностью. Какой вывод следует из этого результата?", "p3a_1_o1": "Меченый белок быстро обменивается с окружением", "p3a_1_o2": "Фокус — жидкая капля, образованная фазовым разделением", "p3a_1_o3": "Фокус — агрегат с медленным обменом молекул", "p3a_1_e": "Быстрое и почти полное восстановление показывает, что молекулы фокуса обмениваются с окружением. Так же восстанавливаются и жидкий конденсат, и белок, обратимо связанный с комплексами или с мембраной органеллы, поэтому один FRAP их не различает. Природу фокуса выявляют другие проверки: порог по концентрации, слияние, замены в IDR, второй канал с маркером мембраны.", "p3a_1_w2": "Быстрый обмен совместим и с другими структурами — например, с комплексами, на которых белок удерживается обратимым связыванием. Один FRAP не доказывает ни жидкого состояния, ни фазового разделения.", "p3a_1_w3": "У агрегата флуоресценция после обесцвечивания почти не восстанавливается. Быстрое и почти полное восстановление говорит против агрегата.", "p3a_2_q": "Фокус 2 — конденсат. Концентрацию меченого каркасного белка снизили вдвое, ниже концентрации насыщения. Как изменятся число и яркость фокусов?", "p3a_2_o1": "Исчезнут: белок перейдёт в раствор", "p3a_2_o2": "Останутся, но станут тусклее", "p3a_2_o3": "Останутся без всяких изменений", "p3a_2_e": "Конденсат существует, только пока концентрация каркаса выше порога: ниже концентрации насыщения плотной фазы нет, и фокусы растворяются. В реальном эксперименте одного исчезновения при разведении недостаточно: от концентрации зависят и другие обратимые сборки, а тусклый фокус может уйти ниже предела обнаружения.", "p3a_2_w2": "Тусклее, но сохраняясь, в модели становятся фокусы, где белок связан с устойчивым комплексом или с мембраной. Конденсат ниже порога в модели исчезает полностью; в реальной клетке исход разведения зависит и от механизма сборки, и от условий связывания.", "p3a_2_w3": "Без изменений остаётся устойчивая сборка, например агрегат. Конденсат образован обратимыми слабыми контактами и ниже порога растворяется.", "p3a_3_q": "Фокус 3 не растворяется при снижении концентрации белка, а его края неровные. Как восстановится его флуоресценция после фотообесцвечивания?", "p3a_3_o1": "Лишь на несколько процентов за минуту", "p3a_3_o2": "Почти полностью за несколько секунд", "p3a_3_o3": "Наполовину за несколько секунд", "p3a_3_e": "Устойчивость к снижению концентрации и неровная форма указывают на агрегат. Молекулы агрегата почти не обмениваются с окружением, поэтому за минуту флуоресценция восстанавливается лишь на 5 %. Сам по себе медленный FRAP тоже не определяет структуру однозначно: так же ведёт себя и созревшая твёрдоподобная капля.", "p3a_3_w2": "Быстро и почти полностью восстанавливаются структуры с быстрым обменом молекул — конденсат, белок на комплексах или на мембране. Фокус, не растворяющийся при снижении концентрации, с неровными краями, скорее агрегат.", "p3a_3_w3": "Частичное быстрое восстановление означало бы, что половина молекул фокуса быстро обменивается. У агрегата подвижной фракции почти нет.", "p3a_4_q": "Фокус 2 — конденсат. Замены ароматических остатков в неупорядоченной области (IDR) сохранили связывание с партнёром, но устранили фокусы и нарушили функцию. Что показывает эксперимент?", "p3a_4_o1": "Конденсация, вероятно, нужна для функции", "p3a_4_o2": "Для функции нужна сама IDR, а не весь белок", "p3a_4_o3": "Фокусы до замены были агрегатами", "p3a_4_e": "Замены ослабляют множественные слабые контакты неупорядоченной области, но сохраняют специфическое связывание. Если при этом исчезают фокусы и страдает функция, это довод в пользу того, что для функции необходима именно конденсация. Ароматические остатки могут участвовать и в других взаимодействиях, поэтому вывод усиливают замены разного типа с одинаковым эффектом.", "p3a_4_w2": "Неупорядоченная область — часть самого белка; эксперимент сравнивает белок со слабыми контактами и без них, а не белок и его отсутствие.", "p3a_4_w3": "По условию фокус 2 — конденсат, и эксперимент с заменами этого не опровергает: он проверяет, нужны ли слабые контакты неупорядоченной области для функции, а не тип исходной сборки.", "p3a_5_q": "Фокус 2 — конденсат. В среду добавили 5 % 1,6-гександиола, и фокусы растворились. Доказывает ли этот эксперимент, что конденсат нужен для функции белка?", "p3a_5_o1": "Нет: гександиол действует неизбирательно", "p3a_5_o2": "Да: гександиол растворяет только конденсаты", "p3a_5_o3": "Да, если после гександиола нарушается функция", "p3a_5_e": "Гександиол растворяет многие жидкоподобные сборки, но в той же концентрации почти полностью подавляет киназы и фосфатазы (Düster 2021, in vitro) и меняет проницаемость мембран (обзор Горшенева 2024). Нарушение функции после него нельзя приписать растворению конденсата: нужны избирательные вмешательства, например замены в IDR.", "p3a_5_w2": "Гександиол влияет не только на конденсаты: в концентрациях 5–10 % он почти полностью подавляет киназы и фосфатазы in vitro (Düster 2021) и, по данным обзоров, меняет проницаемость мембран (Горшенева 2024).", "p3a_5_w3": "Функция может нарушиться и без конденсата: гександиол в той же концентрации подавляет киназы и фосфатазы. Нарушение функции поэтому не указывает на причину.", "p3a_6_q": "Капли очищенного FUS дикого типа и FUS G156E инкубировали 8 ч. Как будет отличаться подвижная фракция FRAP у капель с заменой G156E?", "p3a_6_o1": "Будет ниже, чем у белка дикого типа", "p3a_6_o2": "Будет такой же, как у белка дикого типа", "p3a_6_o3": "Будет выше, чем у белка дикого типа", "p3a_6_e": "Жидкоподобное состояние капель очищенного FUS метастабильно: со временем обмен замедляется, и капли переходят в твёрдоподобное состояние. Замена G156E в неупорядоченной области ускоряет этот переход (Patel 2015), поэтому через 8 ч подвижная фракция у капель с заменой ниже: в модели 8 % против 43 % у белка дикого типа.", "p3a_6_w2": "Сразу после образования капли обоих белков жидкоподобны (в модели обмен одинаков), но замена G156E ускоряет созревание, и со временем различие растёт.", "p3a_6_w3": "Патогенная замена не усиливает обмен, а ускоряет переход в твёрдоподобное состояние, в котором молекулы почти не обмениваются.", "p3a_7_q": "Какой набор экспериментов убедительнее всего показывает, что яркий фокус — конденсат, необходимый для функции белка?", "p3a_7_o1": "Порог по концентрации и замены, нарушающие только конденсацию", "p3a_7_o2": "Быстрое восстановление FRAP и округлая форма всех фокусов", "p3a_7_o3": "Растворение фокусов 1,6-гександиолом за несколько минут", "p3a_7_e": "Ни один признак не достаточен сам по себе. Порог по концентрации согласуется с фазовым разделением, но бывает и у других сборок, а замены, нарушающие слабые контакты при сохранённом связывании, проверяют роль конденсации в функции. Быстрый FRAP и округлость лишь дополняют этот набор.", "p3a_7_w2": "Быстрый FRAP показывает только обмен компонентов, а округлыми бывают и органеллы. Оба признака совместимы с другими структурами и ничего не говорят о функции.", "p3a_7_w3": "Гександиол действует неизбирательно: подавляет киназы и фосфатазы и меняет проницаемость мембран (обзор Горшенева 2024). Растворение фокусов гександиолом не доказывает ни фазового разделения, ни его роли в функции.", "s4b_p": "Доставка к полюсу (доля потока)", "s4b_k": "Скорость эндоцитоза, константа kэнд", "s4b_u_k": "с⁻¹", "s4b_note": "Учебная модель: мембрана клетки длиной 30 мкм по окружности, коэффициент латеральной диффузии белка D = 0,1 мкм²/с (порядок величины для мембранного белка животной клетки). Поток доставки постоянен и не зависит от скорости эндоцитоза; меняется только, какая его доля приходит к полюсу, а какая — равномерно по всей мембране. Возврат удалённого белка к полюсу отдельно не моделируется, поэтому оптимума, описанного Marco 2007 (при слишком быстром удалении на мембране остаётся мало белка и домен ослабевает), в модели нет.", "s4b_pole": "полюс доставки", "s4b_opp": "противоположная сторона", "s4b_src": "Гольджи", "s4b_lg_t": "Белок в мембране", "s4b_lg_lo": "мало", "s4b_lg_hi": "много", "s4b_lg_del": "доставка пузырьками", "s4b_lg_endo": "эндоцитоз", "s4b_lg_diff": "латеральная диффузия", "s4b_cell_t": "Что задаёт домен", "s4b_cell_1": "доставка — куда приходит белок;", "s4b_cell_2": "диффузия — как он расходится;", "s4b_cell_3": "эндоцитоз — как быстро удаляется.", "s4b_lam_sym": "λ = √(D/kэнд)", "s4b_con_sym": "контраст", "s4b_r_con": "Контраст домена", "s4b_r_con_s": "концентрация у полюса / на противоположной стороне", "s4b_r_lam": "Длина спада λ", "s4b_r_lam_s": "расстояние, на котором избыток белка у полюса снижается в e ≈ 2,7 раза", "s4b_r_res": "Среднее время пребывания на мембране", "s4b_r_res_s": "1/kэнд", "s4b_r_diff": "Время прохода 10 мкм диффузией", "s4b_r_diff_s": "оценка для плоской мембраны t ≈ x²/4D; порядок величины; не зависит от ползунков", "s4b_r_tot": "Белок на мембране", "s4b_r_tot_s": "от исходного состояния (90 % к полюсу, kэнд = 0,005 с⁻¹)", "s4b_pcap": "Профиль концентрации от полюса (0) до противоположной стороны (15 мкм). Учебная модель, относительные величины: 1 — концентрация у полюса в исходном состоянии.", "s4b_l_now": "текущие условия", "s4b_l_unif": "та же доставка, распределённая равномерно", "s4b_c_none": "Доставка распределена по всей мембране равномерно: контраст ×{c}, домена нет. Эндоцитоз удаляет белок везде одинаково и сам домена не создаёт.", "s4b_c_none_z": "Домен возникает там, куда направлена доставка; без направленной доставки нет и асимметрии.", "s4b_c_blur": "Домен размыт: контраст ×{c}, длина спада {l} мкм. Белок успевает разойтись диффузией по мембране, прежде чем удаляется эндоцитозом.", "s4b_c_blur_z": "Если время пребывания белка на мембране намного больше времени диффузии через клетку, направленная доставка почти не создаёт различия сторон.", "s4b_c_dom": "У полюса образуется домен: контраст ×{c}, длина спада {l} мкм. Белок поступает к полюсу, расходится диффузией и удаляется эндоцитозом раньше, чем распределится по всей мембране.", "s4b_c_dom_z": "Домен — стационарное состояние трёх потоков, а не неподвижная структура: его поддерживает непрерывный оборот белка.", "s4b_c_sharp": "Домен резкий: контраст ×{c}, длина спада {l} мкм. Быстрый эндоцитоз удаляет белок вблизи места доставки; белка на мембране ×{m} от исходного.", "s4b_c_sharp_z": "Чем быстрее удаление, тем резче граница домена, но тем больше белка нужно доставлять, чтобы сохранить его количество на мембране.", "s4b_take": "Мембранный белок проходит 10 мкм диффузией за несколько минут, а домен существует часами, поэтому домен удерживается не сам по себе, а потоками. Направленная доставка задаёт, где будет домен; диффузия его размывает; эндоцитоз удаляет белок раньше, чем он разойдётся. Ширину домена определяет отношение D/kэнд (длина спада λ = √(D/kэнд)), а контраст — ещё и доля доставки, приходящая к полюсу.", "gn_dom": "Полярный домен мембраны", "g_dom": "Участок плазматической мембраны, обогащённый определёнными белками и липидами. Домен существует дольше, чем нужно белку, чтобы разойтись по мембране диффузией, поэтому поддерживается потоками: доставкой в домен, удержанием в нём и удалением тех молекул, которые из него ушли. У почкующихся дрожжей так поддерживается полярность белка Snc1: он сосредоточен в почке, и для этого необходим его эндоцитоз (Valdez-Taubas и Pelham 2003).", "gn_golgi": "Источник доставки", "g_golgi": "Новые мембранные белки поступают к плазматической мембране в пузырьках из аппарата Гольджи, а белки, удалённые эндоцитозом, могут вернуться через рециклирующие эндосомы. На схеме оба пути показаны как один поток доставки; модель задаёт только, какая доля этого потока приходит к полюсу.", "gn_endo": "Эндоцитоз", "g_endo": "Образование пузырька из участка плазматической мембраны и его отделение внутрь клетки. Эндоцитоз удаляет мембранный белок из мембраны; белок затем возвращается к мембране через рециклирующие эндосомы или направляется на деградацию. В модели эндоцитоз идёт по всей мембране с одной и той же константой kэнд; 1/kэнд — среднее время, которое молекула проводит в мембране.", "gn_ldiff": "Латеральная диффузия", "g_ldiff": "Перемещение белков и липидов в плоскости мембраны за счёт теплового движения. Коэффициент диффузии D мембранного белка животной клетки — порядка 0,1 мкм²/с, липида — порядка 0,5 мкм²/с (Günzel 2026); в плазматической мембране дрожжей белок Snc1 диффундирует примерно в 40 раз медленнее — около 0,0025 мкм²/с (Valdez-Taubas и Pelham 2003). Время, за которое молекула смещается на расстояние x, оценивают как t ≈ x²/4D: для белка животной клетки и 10 мкм — около 250 с.", "p4b_1_q": "У полюса существует домен: 90 % доставки приходится на полюс, kэнд = 0,005 с⁻¹. Эндоцитоз замедлили в 10 раз, доставка прежняя. Как изменится контраст домена?", "p4b_1_o1": "Вырастет: белок дольше остаётся на мембране", "p4b_1_o2": "Снизится: белок успеет разойтись по мембране", "p4b_1_o3": "Не изменится: его задаёт только доставка", "p4b_1_e": "Среднее время пребывания белка на мембране выросло с 3,3 до 33 мин, а 10 мкм диффузией белок проходит примерно за 4 мин. Теперь до удаления молекула успевает разойтись по всей мембране: длина спада выросла с 4,5 до 14,1 мкм, контраст снизился с ×8,4 до ×1,5. Белка на мембране стало в 10 раз больше, но распределён он почти равномерно.", "p4b_1_w1": "Белка на мембране действительно становится больше, но этот избыток расходится диффузией по всей мембране. Контраст зависит от того, успевает ли эндоцитоз удалить белок до того, как он отойдёт от полюса.", "p4b_1_w3": "Доставка задаёт, где появляется белок, но удержание различия сторон требует удаления: при медленном эндоцитозе диффузия выравнивает концентрацию.", "p4b_2_q": "У полюса существует домен: 90 % доставки приходится на полюс, kэнд = 0,005 с⁻¹. Доставку сделали равномерной по всей мембране, эндоцитоз прежний. Как изменится контраст домена?", "p4b_2_o1": "Станет равным ×1: домен исчезнет", "p4b_2_o2": "Сохранится: его удержит эндоцитоз", "p4b_2_o3": "Вырастет: белок распределится точнее", "p4b_2_e": "Эндоцитоз в модели идёт по всей мембране одинаково, поэтому сам различия сторон не создаёт. Если и доставка равномерна, концентрация белка одинакова везде: контраст ×1,0 вместо ×8,4. Положение домена задаёт направленная доставка.", "p4b_2_w2": "Эндоцитоз удаляет белок одинаково по всей мембране и лишь сохраняет различие, которое создала доставка. Без направленной доставки удерживать нечего.", "p4b_2_w3": "Равномерная доставка распределяет белок по всей мембране одинаково, и различие между полюсом и противоположной стороной исчезает.", "p4b_3_q": "У полюса существует домен: 90 % доставки приходится на полюс, kэнд = 0,005 с⁻¹. Эндоцитоз ускорили в 4 раза. Как изменится длина спада домена λ?", "p4b_3_o1": "Увеличится: белок чаще возвращается к полюсу", "p4b_3_o2": "Не изменится: её задаёт только диффузия", "p4b_3_o3": "Уменьшится: белок удаляется ближе к полюсу", "p4b_3_e": "Длина спада равна √(D/kэнд): при четырёхкратном ускорении эндоцитоза она уменьшается вдвое — с 4,5 до 2,2 мкм. Белок удаляется раньше, чем отойдёт далеко от полюса, поэтому домен становится уже и резче: контраст вырос с ×8,4 до ×38,4.", "p4b_3_w1": "Ускорение эндоцитоза сокращает путь, который молекула проходит до удаления. Поток доставки к полюсу в модели постоянен, поэтому быстрое удаление домен не расширяет.", "p4b_3_w2": "Диффузия задаёт, как быстро белок расходится, а эндоцитоз — сколько времени белок остаётся на мембране до удаления. Длина спада зависит от обеих величин.", "p4b_4_q": "У полюса существует домен: 90 % доставки приходится на полюс, kэнд = 0,005 с⁻¹. Долю доставки к полюсу снизили до 50 %, эндоцитоз прежний. Как изменится длина спада домена λ?", "p4b_4_o1": "Уменьшится вдвое", "p4b_4_o2": "Не изменится", "p4b_4_o3": "Увеличится вдвое", "p4b_4_e": "Длина спада √(D/kэнд) зависит только от диффузии и эндоцитоза: она осталась 4,5 мкм. Снизился контраст — с ×8,4 до ×3,1, потому что к полюсу приходит меньшая доля белка, а остальной белок доставляется равномерно по всей мембране.", "p4b_4_w1": "Уменьшить длину спада могло бы ускорение эндоцитоза. Доля доставки к полюсу меняет высоту домена над фоном, но не расстояние, на котором избыток белка спадает.", "p4b_4_w3": "Увеличить длину спада могло бы замедление эндоцитоза или ускорение диффузии. При тех же D и kэнд белок отходит от полюса на то же расстояние.", "p4b_5_q": "У полюса существует домен: 90 % доставки приходится на полюс, kэнд = 0,005 с⁻¹, поток доставки постоянен. Эндоцитоз ускорили вдвое. Как изменится количество белка на мембране?", "p4b_5_o1": "Снизится вдвое, хотя домен станет резче", "p4b_5_o2": "Вырастет вдвое вместе с контрастом", "p4b_5_o3": "Не изменится: меняется только форма домена", "p4b_5_e": "В стационарном состоянии поток доставки равен потоку удаления, поэтому количество белка на мембране равно потоку доставки, делённому на kэнд. При вдвое более быстром эндоцитозе белка становится вдвое меньше (×0,5 от исходного), а контраст растёт с ×8,4 до ×19,5. Более резкая граница домена требует ускоренного оборота белка.", "p4b_5_w2": "Контраст действительно вырастет, но количество белка определяется балансом доставки и удаления. Ускоренное удаление при той же доставке уменьшает количество белка на мембране.", "p4b_5_w3": "Количество белка на мембране не постоянно: в стационарном состоянии оно равно отношению потока доставки к kэнд и меняется вместе с эндоцитозом.", "s4a_g_t": "Эпителиальные клетки", "s4a_g_myo5b": "нет миозина Vb", "s4a_g_cldn": "нет клаудинов", "s4a_c_t": "Апикальный белок", "s4a_c_nhe3": "NHE3", "s4a_c_dppiv": "DPPIV", "s4a_d_t": "Воздействие", "s4a_d0": "нет", "s4a_ddyn": "ингибитор эндоцитоза, 4 ч", "s4a_note": "Учебная модель клетки эпителия кишечника. Направления изменений — по экспериментам на клетках Caco-2 (миозин Vb, Vogel 2015) и MDCK II (клаудины, Otani 2019); числа условны, кроме сопротивления без клаудинов. Эксперимент с ингибитором эндоцитоза (подавляет динамин) рассчитан как отдельная чашка: 4 ч, начиная от стационарного состояния без ингибитора.", "s4a_lumen": "просвет кишки", "s4a_api": "апикальная мембрана (микроворсинки)", "s4a_bl": "базолатеральная мембрана", "s4a_tj": "плотный контакт", "s4a_golgi": "Гольджи", "s4a_re": "эндосомы Rab11", "s4a_myo": "миозин Vb", "s4a_ves": "пузырьки в цитоплазме", "s4a_lg_del": "доставка пузырьками", "s4a_lg_endo": "эндоцитоз (нужен динамин)", "s4a_lg_dot": "молекулы белка", "s4a_ter_t": "Трансэпителиальное сопротивление монослоя — мера барьера, а не полярности", "s4a_ter_of": "от нормы", "s4a_ter_na": "в модели не рассчитывается", "s4a_r_a": "Белок на апикальной мембране", "s4a_r_b": "Белок на базолатеральной мембране", "s4a_r_i": "Белок внутри клетки (эндосомы и пузырьки)", "s4a_r_ter": "Трансэпителиальное сопротивление", "s4a_r_ter_s": "барьер для ионов; измеряется отдельно от распределения белка", "s4a_r_note": "Доли белка — от всего его количества в клетке, сумма 100 %. Стационарное состояние учебной модели.", "s4a_r_note_dyn": "Доли белка — от всего его количества в клетке, сумма 100 %. Чашка с ингибитором эндоцитоза через 4 ч; без ингибитора — стационарное состояние той же модели.", "s4a_k_wt": "Норма: NHE3 доставляется к апикальной мембране через эндосомы Rab11 при участии миозина Vb; на апикальной мембране {a} %, на базолатеральной {b} %, внутри клетки {i} %.", "s4a_k_wt_z": "Переносчик натрия и протонов работает только на апикальной мембране, обращённой в просвет кишки: так всасывание натрия направлено из просвета в клетку.", "s4a_k_wt_dppiv": "Норма: фермент щёточной каёмки DPPIV на апикальной мембране — {a} %, на базолатеральной {b} %, внутри клетки {i} %.", "s4a_k_wt_dppiv_z": "Разные апикальные грузы доставляются к мембране разными путями.", "s4a_k_myo5b": "Без миозина Vb NHE3 не доставляется к апикальной мембране: на ней {a} %, внутри клетки — в пузырьках цитоплазмы — {i} %.", "s4a_k_myo5b_z": "Миозин Vb вместе с Rab11 и Rab8 переносит пузырьки с NHE3 к апикальной мембране; при мутациях MYO5B развивается болезнь включений микроворсинок с тяжёлой диареей.", "s4a_k_myo5b_dppiv": "Без миозина Vb DPPIV по-прежнему на апикальной мембране: {a} %. Этот фермент доставляется другим путём, не зависящим от миозина Vb.", "s4a_k_myo5b_dppiv_z": "Миозин Vb нужен для доставки части апикальных грузов, а не всех: апикальный домен как таковой сохраняется.", "s4a_k_cldn": "Без тяжей плотного контакта (как в клетках MDCK II без клаудинов) сопротивление монослоя {ter} % от нормы; в модели {name} по-прежнему на апикальной мембране ({a} %, на базолатеральной {b} %).", "s4a_k_cldn_z": "Барьер для ионов и распределение белков по доменам — разные величины: без тяжей клаудинов барьер ослаблен, а полярность в основном сохраняется. При одновременном удалении клаудинов и JAM-A полярность местами нарушается (Otani 2019).", "s4a_k_dyn": "Через 4 ч после подавления эндоцитоза {name} на базолатеральной мембране — {b} % (без ингибитора {b0} %): ошибочно доставленный белок не удаляется и накапливается.", "s4a_k_dyn_z": "Удаление эндоцитозом исправляет ошибки доставки; без него домены постепенно смешиваются.", "s4a_k_myo5b_dyn": "Без миозина Vb и через 4 ч после подавления эндоцитоза: на апикальной мембране {a} %, на базолатеральной {b} %, внутри клетки {i} % (без ингибитора внутри {i0} %).", "s4a_k_myo5b_dyn_z": "Когда эндоцитоз подавлен, белок, хотя бы медленно доставленный к мембране, перестаёт с неё удаляться; это сочетание — расчёт модели, а не результат эксперимента.", "s4a_take": "Апикальный домен эпителиальной клетки поддерживают направленная доставка, удержание и удаление. Миозин Vb и Rab11 нужны для доставки части апикальных грузов, например NHE3, но не DPPIV; без миозина Vb NHE3 остаётся в пузырьках цитоплазмы. Эндоцитоз удаляет ошибочно доставленный белок. Без тяжей плотного контакта сопротивление монослоя резко падает, а распределение белков по доменам почти не меняется: барьер и полярность — разные величины, и их измеряют разными методами.", "gn_nhe3": "NHE3 (переносчик Na⁺/H⁺)", "g_nhe3": "Переносчик апикальной мембраны энтероцита, обменивающий ион натрия из просвета кишки на протон из клетки; основной путь всасывания натрия в тонкой кишке. В клетках Caco-2 доставка NHE3 к апикальной мембране требует Rab11, миозина Vb и синтаксина 3; без миозина Vb NHE3 распределяется в пузырьках по цитоплазме (Vogel 2015). У мышей без NHE3 развивается диарея.", "gn_dppiv": "DPPIV (дипептидилпептидаза IV)", "g_dppiv": "Фермент щёточной каёмки энтероцита. В клетках Caco-2 без миозина Vb или без синтаксина 3 DPPIV, как и сахараза-изомальтаза и аминопептидаза N, по-прежнему находится на апикальной мембране (Vogel 2015): эти белки доставляются другим путём. В модели DPPIV служит контролем избирательности.", "gn_rab11": "Rab11 и рециклирующие эндосомы", "g_rab11": "Малая ГТФаза Rab11 в форме, связанной с GTP, размечает рециклирующие эндосомы и пузырьки, идущие к плазматической мембране. Через эти эндосомы проходят и новые белки на пути к апикальной мембране, и белки, вернувшиеся с мембраны после эндоцитоза. Rab11a и Rab8a связываются с миозином Vb; у мышей без Rab11a NHE3 распределён неправильно (обсуждается в Vogel 2015).", "gn_myo5b": "Миозин Vb (MYO5B)", "g_myo5b": "Изоформа миозина V эпителиальных клеток: движется по актиновым филаментам к оперённому концу и переносит пузырьки Rab11 и Rab8 на последнем участке пути к апикальной мембране. В клетках Caco-2 с мутацией MYO5B больного NHE3, CFTR и GLUT5 не доставляются к апикальной мембране, а DPPIV доставляется (Vogel 2015). Мутации MYO5B — основная причина болезни включений микроворсинок (Müller 2008; Ruemmele 2010).", "gn_mvid": "Болезнь включений микроворсинок", "g_mvid": "Болезнь включений микроворсинок (врождённая атрофия микроворсинок) — наследственная болезнь новорождённых с тяжёлой диареей. В энтероцитах уменьшено число микроворсинок, под апикальной мембраной накапливаются пузырьки, в цитоплазме появляются вакуоли, выстланные микроворсинками (Müller 2008). Основная причина — мутации гена MYO5B; реже — мутации гена синтаксина 3.", "gn_tj": "Плотный контакт", "g_tj": "Контакт у апикальной границы соседних эпителиальных клеток, образованный тяжами клаудинов и каркасными белками ZO-1 и ZO-2. Его главная функция — ограничивать поток веществ между клетками (барьер). Долго считалось, что тяжи служат и «изгородью» для мембранных белков и липидов между доменами, но в клетках без тяжей полярная сортировка многих апикальных белков сохраняется (Günzel 2026). На схеме пунктир с крестом — тяжей нет.", "gn_cldn": "Клаудины", "g_cldn": "Белки плотного контакта с четырьмя трансмембранными участками; полимеризуясь, образуют тяжи. В клетках MDCK II без пяти основных клаудинов тяжей нет, сопротивление монослоя снижено с 52,5 до 14,5–19,8 Ом·см² (около трети), но клетки остаются поляризованными: апикальные и базолатеральные маркеры распределены как в норме (Otani 2019).", "gn_ter4": "Трансэпителиальное сопротивление", "g_ter4": "Электрическое сопротивление монослоя клеток, выращенного на пористом фильтре; отражает проницаемость межклеточных промежутков для ионов, то есть барьер. О распределении белков между апикальной и базолатеральной мембраной оно не говорит; полярность измеряют по локализации маркеров доменов. Для клеток без миозина Vb модель сопротивление не рассчитывает: в клетках с подавлением MYO5B описаны изменения клаудинов (Knowles 2014), но числа для модели нет.", "gn_vesv": "Пузырьки в цитоплазме", "g_vesv": "Пузырьки с грузом, не доставленные к мембране. В клетках Caco-2 без миозина Vb под апикальной мембраной накапливаются пузырьки, похожие на рециклирующие эндосомы и секреторные пузырьки (Vogel 2015). В модели такие пузырьки — отдельный компартмент, из которого белок медленно направляется на деградацию.", "gn_dyn2": "Ингибитор эндоцитоза (динамин)", "g_dyn2": "Динамин — ГТФаза, отделяющая эндоцитозный пузырёк от плазматической мембраны. Ингибиторы динамина подавляют эндоцитоз с обеих мембран. В модели эндоцитоз снижается в 10 раз и чашка считается 4 ч; длительное подавление эндоцитоза нарушает и другие процессы, поэтому это мысленный эксперимент с учебными числами.", "gn_golgi4": "Аппарат Гольджи", "g_golgi4": "Здесь новые мембранные белки сортируются в пузырьки разных путей. В модели 85 % NHE3 уходит в эндосомы Rab11, откуда доставляется к апикальной мембране, 15 % ошибочно уходит на базолатеральную мембрану; DPPIV идёт к апикальной мембране путём, не зависящим от миозина Vb.", "p4a_1_q": "В модели эпителиального монослоя убрали тяжи плотного контакта, как в клетках MDCK II без пяти основных клаудинов. Как изменится трансэпителиальное сопротивление монослоя?", "p4a_1_o1": "Вырастет: клетки сомкнутся плотнее", "p4a_1_o2": "Не изменится: барьер создают мембраны клеток", "p4a_1_o3": "Снизится: ионы легче пройдут между клетками", "p4a_1_e": "Тяжи клаудинов ограничивают поток ионов между клетками. Без них сопротивление монослоя клеток MDCK II снизилось с 52,5 до 14,5–19,8 Ом·см² (Otani 2019); в модели — 30 % от нормы.", "p4a_1_w1": "Клаудины и образуют тяжи, сужающие межклеточный промежуток. Без них ионы проходят между клетками легче, и сопротивление падает.", "p4a_1_w2": "Мембраны клеток ионы почти не пропускают, но между клетками есть промежуток. Его закрывают именно тяжи плотного контакта.", "p4a_2_q": "В той же модели без тяжей плотного контакта определяют распределение апикального переносчика NHE3. Как изменится его доля на апикальной мембране?", "p4a_2_o1": "Снизится примерно до половины", "p4a_2_o2": "Почти не изменится", "p4a_2_o3": "Вырастет почти до 100 %", "p4a_2_e": "В клетках MDCK II без тяжей плотного контакта апикальные маркеры gp135 и эзрин и базолатеральная Na⁺/K⁺-АТФаза распределены как в норме (Otani 2019). NHE3 в этой работе не изучали; в модели он ведёт себя так же: на апикальной мембране 86 % против 89 % в норме, хотя утечка через область контакта задана вчетверо большей (допущение модели).", "p4a_2_w1": "Половина означала бы почти полное смешивание доменов. Распределение белков удерживают доставка и удаление, а не только «изгородь» плотного контакта.", "p4a_2_w3": "Удаление клаудинов не улучшает доставку и не убирает белок с базолатеральной мембраны; утечка между доменами, наоборот, немного растёт.", "p4a_3_q": "В клетки Caco-2 ввели мутацию гена MYO5B, найденную у больного, и миозина Vb в них нет. Где окажется большая часть переносчика NHE3?", "p4a_3_o1": "В пузырьках в цитоплазме", "p4a_3_o2": "На базолатеральной мембране", "p4a_3_o3": "На апикальной мембране, как в норме", "p4a_3_e": "Миозин Vb вместе с Rab11 переносит пузырьки с NHE3 на последнем участке пути к апикальной мембране. Без него NHE3 распределяется в пузырьках по цитоплазме (Vogel 2015): в модели внутри клетки 77 %, на апикальной мембране 19 %.", "p4a_3_w2": "На базолатеральную мембрану попадает лишь небольшая доля NHE3, ошибочно направленная туда из аппарата Гольджи. Без миозина Vb груз задерживается в пузырьках, а не перенаправляется.", "p4a_3_w3": "Для NHE3 миозин Vb необходим: без него пузырьки не доходят до апикальной мембраны, и апикальная доля резко падает.", "p4a_4_q": "В тех же клетках Caco-2 без миозина Vb определяют распределение фермента щёточной каёмки DPPIV. Как изменится его доля на апикальной мембране?", "p4a_4_o1": "Упадёт, как у NHE3", "p4a_4_o2": "Упадёт сильнее, чем у NHE3", "p4a_4_o3": "Почти не изменится", "p4a_4_e": "DPPIV, сахараза-изомальтаза и аминопептидаза N в клетках Caco-2 без миозина Vb остаются на апикальной мембране (Vogel 2015): их доставляет другой путь. В модели апикальная доля DPPIV 97 % и без миозина Vb. Миозин Vb необходим для доставки части апикальных грузов, а не для апикального домена как такового.", "p4a_4_w1": "Если бы все апикальные белки доставлялись одним путём, DPPIV распределился бы так же, как NHE3. Но доставка к апикальной мембране избирательна, и DPPIV от миозина Vb не зависит.", "p4a_4_w2": "Сильнее, чем у NHE3, апикальная доля упала бы, если бы DPPIV ещё больше зависел от миозина Vb. В экспериментах DPPIV от него не зависит.", "p4a_5_q": "В нормальных клетках подавили эндоцитоз ингибитором динамина. Как изменится через 4 ч доля NHE3 на базолатеральной мембране?", "p4a_5_o1": "Снизится: доставка к ней прекратится", "p4a_5_o2": "Вырастет: белок с неё не удаляется", "p4a_5_o3": "Не изменится: эндоцитоз на неё не влияет", "p4a_5_e": "Часть NHE3 из аппарата Гольджи ошибочно попадает на базолатеральную мембрану; в модели эндоцитоз быстро удаляет этот белок оттуда, и он возвращается через эндосомы Rab11 к апикальной мембране. Без эндоцитоза ошибка не исправляется: базолатеральная доля выросла с 2 до 10 %. Это расчёт учебной модели, иллюстрирующий роль удаления.", "p4a_5_w1": "Ингибитор динамина подавляет удаление белка с мембраны, а не доставку к ней. Ошибочная доставка продолжается, поэтому белок на базолатеральной мембране накапливается.", "p4a_5_w3": "Эндоцитоз как раз и удаляет ошибочно доставленный белок с базолатеральной мембраны. Без него доля белка там растёт.", "p4a_6_q": "После подавления эндоцитоза NHE3 обнаружили и на базолатеральной мембране. Какое измерение покажет, нарушен ли при этом барьер монослоя?", "p4a_6_o1": "Трансэпителиальное сопротивление монослоя", "p4a_6_o2": "Доля NHE3 на базолатеральной мембране", "p4a_6_o3": "Общее количество NHE3 в лизате клеток", "p4a_6_e": "Барьерную функцию характеризует проницаемость межклеточных промежутков; её оценивают по сопротивлению монослоя (и по потоку меток между клетками). Распределение белка по мембранам отражает полярность. В модели сопротивление осталось 100 % от нормы: нарушено распределение белка, а не барьер. Без клаудинов, наоборот, сопротивление падает при почти нормальном распределении.", "p4a_6_w2": "Доля белка на базолатеральной мембране показывает нарушение полярности, но о проницаемости межклеточных промежутков ничего не говорит: эти величины меняются независимо.", "p4a_6_w3": "Количество белка в лизате не говорит ни о его положении в клетке, ни о проницаемости монослоя.", "s3a_cmp_pre": "Для сравнения показан фокус 2 — конденсат.", "teacher_t": "Для преподавателя: проведение занятия, упрощения моделей и источники", "src_t_st": "Источники", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 мин, на продвинутый — 8–10 мин. В режиме «Сценарий: предскажите и проверьте» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку. На студенческой странице сайта порядок шагов и вариантов ответа перемешивается при каждом открытии; для проектора откройте страницу с параметром ?fixed — порядок будет тот же, что в этом файле и в гиде. Кнопки «Объяснения» открывают страницу объяснений семинара к нужному вопросу. Сквозная связь вопросов: направление относительно филамента задаёт мотор, а относительно частей клетки — организация треков (вопрос 1), и та же ориентированная доставка поддерживает полярный домен (вопрос 4); миозин V завершает перенос по актину (вопрос 1), миозин Vb доставляет апикальные грузы эпителия (вопрос 4); деление облегчает перенос митохондрий по аксону (вопросы 1 и 2); картина — стационарное состояние потоков: сеть митохондрий (вопрос 2) и домен мембраны (вопрос 4); вид не равен механизму: фрагментация сети (вопрос 2), яркий фокус (вопрос 3) и белок на обеих мембранах (вопрос 4).", "teacher_2": "Все величины условны, кроме прямо взятых из названных работ; модели передают направление изменений и порядок событий. Вопрос 1б: доли микротрубочек, обращённых плюс-концом наружу, — 100, 98 и 60 % (дендрит — учебное значение по Baas 1988 и Stepanova 2003); распределение грузов — стационарное состояние переноса с диффузией. Вопрос 1п: 60 митохондрий на участке аксона 150 мкм, запись 10 мин, одна и та же исходная расстановка во всех условиях; границы участка периодические (вышедшая за край митохондрия возвращается с другого края); доли подвижных 37 и 75 % подобраны по Kang 2008 (36 ± 15 и 76 ± 20 %, нейроны гиппокампа мыши); остановка у активного синапса требует и EF-мотивов Miro, и синтафилина (Wang и Schwarz 2009; Chen и Sheng 2013); нокодазол убирает трек полностью (упрощение); гипотезы перетягивания и согласованного переключения — мысленный эксперимент. Вопрос 2б: сеть общей длиной 120 мкм; частота делений ∝ kдел·M, слияний ∝ kсл·(n − 1) с поправкой на рост массы; ползунки задают константы скоростей; каждое положение — стационарное состояние, переходы во времени не рассчитываются; пока процессы идут намного быстрее роста клеток, форму приближённо задаёт отношение констант (при очень малых константах заметна поправка на рост), частота событий зависит и от констант, и от числа органелл; при остановке обеих машин модель сохраняет последнее рассчитанное состояние, и оно зависит от порядка выключения. Вопрос 2п: эмбриональные фибробласты мыши; доли остаточного слияния и деления у мутантов, время расщепления OPA1 (10 мин) и дыхание после CCCP — учебные. Вопрос 3б: правило рычага для одного эффективного каркасного компонента в растворителе (смесь по типу SH3ₙ + PRMₙ в неизменном соотношении 1 : 1 рассматривается как один компонент; Li 2012); пороги 120, 60 и 30 мкМ для 3, 4 и 5 модулей и обогащение плотной фазы в 100 раз — учебные (у Li 2012 обогащение 82–116 раз). Вопрос 3п: характер ответа четырёх структур на эксперименты задан качественно; созревание FUS — направление по Patel 2015 (in vitro), числа FRAP учебные. Вопрос 4б: окружность 30 мкм, D = 0,1 мкм²/с, поток доставки постоянен и не зависит от скорости эндоцитоза; возврат удалённого белка к полюсу отдельно не моделируется, поэтому оптимума эндоцитоза, описанного Marco 2007, в модели нет. Вопрос 4п: компартментная модель эпителиальной клетки; направления — по Vogel 2015 (Caco-2, миозин Vb) и Otani 2019 (MDCK II без клаудинов; NHE3 там не изучали, его поведение без тяжей — допущение модели); ингибитор динамина — отдельная чашка, 4 ч.", "teacher_3": "Уточнения к распространённым схемам. «Кинезин везёт к периферии, динеин — к ядру» верно лишь там, где плюс-концы обращены к периферии; в дендритах нейронов млекопитающих ориентация микротрубочек смешанная. Цитоплазматический динеин сам по себе автоингибирован и движется процессивно только в комплексе с динактином и адаптером; LIS1 и NDE1 — регуляторы, а не адаптеры груза. Фрагментация митохондрий не равна нарушению функции и не указывает, какая машина изменена; подавление DRP1 устраняет фрагментацию и при ослабленном слиянии — это компенсация, а не доказательство причины. Саму фрагментацию после CCCP выполняет DRP1, а OMA1 прекращает слияние (Head 2009). Яркий фокус белка не доказывает фазового разделения; исчезновение при разведении согласуется с ним, но бывает и у других кооперативных сборок; постоянная концентрация вне капель ожидается только в простейшей однокомпонентной модели (Riback 2020); быстрый FRAP показывает обмен, но не жидкое состояние; 1,6-гександиол действует неизбирательно. Созревание капель очищенного FUS показано in vitro и не переносится на все конденсаты. Стресс-гранула — следствие остановки трансляции, а не её причина: клетки без G3BP1/2 подавляют синтез белка так же (Kedersha 2016). Плотный контакт ограничивает парацеллюлярный поток; полярность мембранных доменов в клетках без тяжей плотного контакта во многом сохраняется (Umeda 2006 — клетки EpH4; Otani 2019 — MDCK II), хотя при одновременном удалении клаудинов и JAM-A она местами нарушается (Otani 2019), поэтому низкое трансэпителиальное сопротивление говорит о барьере, а не о полярности.", "src_01": "Baas P. W. et al. Polarity orientation of microtubules in hippocampal neurons: uniformity in the axon and non    Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */

/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }

  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });

/* интегрирование ОДУ методом Рунге–Кутты 4-го порядка: f(s, t) → производные; s — объект с числовыми полями */
function rk4(f, s0, t0, t1, dt, every, out){

/* значение траектории в момент tt (линейная интерполяция) */
function atT(tr, tt){
  if (tt <= tr[0].t) return tr[0];
  for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
    const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };

/* Модель вопроса 1 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   1b. Доля микротрубочек, обращённых плюс-концом к периферии (к окончанию аксона, к дальнему концу дендрита):
       клетка с центросомой — 100 %, аксон — 98 % («почти все», Baas 1988), дендрит — 60 % (учебное значение между ~50 % в средней
       части дендрита по Baas 1988 и ~65 % движений EB3 в проксимальной части по Stepanova 2003). Кинезин-1 идёт к плюс-концу,
       динеин — к минус-концу: доля пробегов наружу = p или 1 − p. Распределение грузов по пяти зонам — стационар
       направленного переноса с диффузией в замкнутом участке: c(x) ∝ exp(PE·(2f − 1)·x), PE = 2,4 (учебное).
   1a. Митохондрии в участке аксона длиной 150 мкм (нейроны гиппокампа в культуре), запись 10 мин, шаг 2 с.
       Два состояния: закреплена и подвижна. Доля подвижных в стационаре m = 0,28 (норма) и 0,73 (без синтафилина) —
       подобрана так, чтобы доля митохондрий, сдвинувшихся за запись, была около 36 % и 76 % (Kang 2008).
       Скорость в подвижном состоянии 0,3 мкм/с, смена направления 0,004 с⁻¹; доля антероградного направления 0,55.
       Активность синапса (с 2-й мин, зона 70–90 мкм): подвижная митохондрия в зоне останавливается со скоростью 0,05 с⁻¹
       и не отсоединяется, пока активность продолжается; для этого нужны Ca²⁺-связывающие EF-мотивы Miro (Wang 2009,
       Macaskill 2009) и синтафилин (Chen 2013). Нокодазол: треков нет — движения нет.
       Сниженный динеин — мысленный эксперимент с двумя гипотезами: перетягивание (подвижность та же, направление смещается
       к окончанию) и согласованное переключение (доля подвижного состояния снижается до 0,10 и смещается направление).
       Случайные числа — с постоянным зерном: во всех условиях те же исходные митохондрии и те же случайные события. */
const M1 = (() => {
  const P_OUT = { cell: 1, axon: 0.98, dend: 0.6 };
  const PE = 2.4;
  /* доля пробегов наружу (к периферии, окончанию аксона, дальнему концу дендрита); null — направленного движения нет */
  const outFrac = (seg, motor) => motor === 'kin' ? P_OUT[seg] : motor === 'dyn' ? 1 - P_OUT[seg] : null;
  function zones(seg, motor){
    const f = outFrac(seg, motor), d = f == null ? 0 : 2 * f - 1;
    const z = [0, 1, 2, 3, 4].map(i => Math.exp(PE * d * (i + 0.5) / 5)), s = z.reduce((a, b) => a + b, 0);
    return z.map(v => v / s);
  }
  /* --- 1a --- */
  const A = { N: 60, L: 150, T: 600, dt: 2, z0: 70, z1: 90, tAct: 120, v: 0.3, ku: 0.0002, m: 0.28, mSnph: 0.73, mCoord: 0.10,
              ksw: 0.004, ant: 0.55, antDyn: 0.85, ks: 0.05, seed: 8 };
  function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function params(c){
    let m = A.m, ant = A.ant;
    if (c.geno === 'snph') m = A.mSnph;
    if (c.geno === 'dyn'){ ant = A.antDyn; if (c.hyp === 'coord') m = A.mCoord; }
    const kd = A.ku * (1 - m) / m;
    const arrest = c.act && (c.geno === 'wt' || c.geno === 'dyn');   // нужны и EF-мотивы Miro, и синтафилин
    return { m, ant, kd, arrest, v: c.drug === 'noc' ? 0 : A.v };
  }

    const P = params(c), R = rng(A.seed), n = Math.round(A.T / A.dt);
    const mito = [];
    for (let i = 0; i < A.N; i++){
      /* одинаковые для всех условий случайные числа: положение, «жребий» состояния, направления */
      const x = R() * A.L, u = R(), w = R();
      mito.push({ x, mov: u < P.m, dir: w < P.ant ? 1 : -1, path: 0, track: [[0, x]], lock: false, ep: null, eps: [] });
    }
    const zone = x => x >= A.z0 && x <= A.z1;
    const still = o => !o.mov || P.v === 0;   // при нокодазоле не движется ни одна митохондрия
    const inZone0 = mito.filter(o => zone(o.x) && still(o)).length;   // неподвижные в зоне синапса в начале записи
    for (let k = 1; k <= n; k++){
      const t = k * A.dt;
      mito.forEach(o => {
        const r1 = R(), r2 = R(), r3 = R();
        const act = P.arrest && t > A.tAct && zone(o.x);
        if (o.mov){
          if (act && r1 < A.ks * A.dt){ o.mov = false; o.lock = true; }
          else if (r1 < P.kd * A.dt) o.mov = false;
          else if (r2 < A.ksw * A.dt) o.dir = r3 < P.ant ? 1 : -1;
        } else if (!(o.lock && P.arrest && t > A.tAct) && r1 < A.ku * A.dt){ o.mov = true; o.lock = false; o.dir = r3 < P.ant ? 1 : -1; }
        if (o.mov && P.v > 0){
          const dx = o.dir * P.v * A.dt; o.x += dx; o.path += Math.abs(dx);
          if (!o.ep || o.ep.dir !== o.dir){ o.ep = { dir: o.dir, len: 0 }; o.eps.push(o.ep); }
          o.ep.len += Math.abs(dx);
          if (o.x > A.L){ o.x -= A.L; o.track.push(null); }
          if (o.x < 0){ o.x += A.L; o.track.push(null); }
        } else o.ep = null;
        o.track.push([t, o.x]);
      });
    }
    const motile = mito.filter(o => o.path > 2).length / A.N;
    /* суммарный путь всех митохондрий участка в каждом направлении, мкм за минуту записи */
    const runs = d => mito.reduce((s, o) => s + o.eps.filter(e => e.dir === d).reduce((a, e) => a + e.len, 0), 0) / (A.T / 60);
    const inZone1 = mito.filter(o => zone(o.x) && still(o)).length;
    return { motile, ant: runs(1), ret: runs(-1), z0: inZone0, z1: inZone1, mito, P };
  }
  return { P_OUT, PE, outFrac, zones, A, sim, params };
})();

/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   Сеть митохондрий клетки — общая длина M = 120 мкм (постоянна: биогенез и митофагия не учитываются),
   разделённая на n органелл (1 ≤ n ≤ nMax = M / 0,5 мкм). Средняя длина = M / n.
   Частота делений в клетке:   Fдел = kдел · M · (1 − n/nMax)   (делится любой участок, кроме предельно мелких фрагментов);
   частота слияний в клетке:   Fсл  = kсл · (n − 1)            (сливаться может каждая органелла, если в клетке их больше одной);
   разбавление при росте и делении клеток: g · n, g = 0,0006 мин⁻¹ (удвоение культуры примерно за 19 ч; масса сети на клетку
   постоянна, потому что биогенез восполняет разбавление). Без этого члена в клетках без слияния деление в модели останавливалось бы.
   Ползунки задают константы скоростей (kсл — на органеллу, kдел — на единицу длины сети); частоты событий в клетке зависят
   ещё и от числа органелл. Если обе константы равны нулю, стационара нет (см. basic).
   Стационар:  n* = (kдел·M + kсл) / (kсл + g + kдел·M/nMax). Пока g мало по сравнению с kсл, n* задаётся почти только
   отношением скоростей, а число событий в минуту — их абсолютными значениями (Chen 2005: одновременное ослабление обоих
   процессов сохраняет форму сети; Sesaki и Jensen 1999 — у дрожжей без Dnm1 и Fzo1 форма сети нормальная).
   Нормальные скорости (учебные): kсл = 0,05 мин⁻¹ на органеллу, kдел = 0,0125 мкм⁻¹·мин⁻¹ → n* ≈ 28, средняя длина ≈ 4,4 мкм.
   2а. Эмбриональные фибробласты мыши (MEF). Генотип задаёт множители скоростей (fс — слияния, fд — деления):
     норма 1/1; Mfn1⁻/⁻Mfn2⁻/⁻ — слияния нет (Chen 2003, 2005); Mfn2⁻/⁻ — слияние снижено, но сохранено (учебное 25 %, Chen 2005);
     Opa1⁻/⁻ — слияния нет (Song 2007; Chen 2005 — РНК-интерференция OPA1); Drp1⁻/⁻ — частота делений ниже в 17 раз (Wakabayashi 2009);
     Mff⁻/⁻ — деление снижено (учебное 30 %; Losón 2013, Otera 2010). Подавление DRP1 (siRNA) — учебное ×0,25.
     CCCP с 0 мин: потенциал снимается; OMA1 переводит длинную форму OPA1 в короткую (τ = 10 мин, учебное; Head 2009, Ehses 2009),
     слияние ∝ доле длинной формы (Song 2007, Anand 2014); количество DRP1 на наружной мембране ×1,8 (учебное; Cereghetti 2008).
     Морфология через 60 мин рассчитывается во времени (Эйлер, шаг 0,25 мин) от стационара данных клеток.
   Доля клеток с фрагментированной сетью (клетки культуры различаются) — учебная зависимость 1 / (1 + (L/2,5)^2,5).
   Обмен матриксным маркером: фотоактивировано 23 % сети (как у Anand 2014), доля сети с маркером растёт как
   dl/dt = kсл · l · (1 − l). Потенциал, дыхание, формы OPA1, DRP1 на мембране, пероксисомы — таблица учебных величин
   с направлением изменений по названным работам. */
const M2 = (() => {
  const P = { M: 120, Lmin: 0.5, g: 0.0006, kf0: 0.1, kd0: 0.025, T: 60, dt: 0.25, l0: 0.23, L50: 2.5, h: 2.5, tauOMA: 10, drpCCCP: 1.8, si: 0.25 };
  const nMax = P.M / P.Lmin;
  /* стационарное число органелл; null — оба процесса остановлены: стационара, заданного скоростями, нет (аудит v1.0, S01) */
  function steadyN(kf, kd){
    if (kf === 0 && kd === 0) return null;
    const n = (kd * P.M + kf) / (kf + P.g + kd * P.M / nMax);
    return Math.max(1, Math.min(nMax, n));
  }
  const meanL = n => P.M / n;
  const fusRate = (kf, n) => kf * (n - 1);
  const fisRate = (kd, n) => kd * P.M * (1 - n / nMax);
  const frag = L => 1 / (1 + Math.pow(L / P.L50, P.h));
  const netClass = L => L < 2 ? 'frag' : L < 8 ? 'mid' : 'long';
  /* 2б: доли ползунков 0…1 → константы скоростей и показания стационара.
     Если обе машины остановлены, стационар не определён: сеть сохраняется такой, какой была в момент остановки (nPrev —
     число органелл в последнем состоянии; без него — норма). Рост и биогенез за это время модель не описывает. */
  function basic(sf, sd, nPrev){
    const kf = P.kf0 * sf, kd = P.kd0 * sd;
    if (kf === 0 && kd === 0){
      const n = nPrev ?? steadyN(P.kf0 / 2, P.kd0 / 2), L = meanL(n);
      return { kf, kd, n, L, fus: 0, fis: 0, mixT: Infinity, frag: frag(L), cls: netClass(L), stop: true };
    }
    const n = steadyN(kf, kd), L = meanL(n);
    return { kf, kd, n, L, fus: fusRate(kf, n), fis: fisRate(kd, n), mixT: kf > 0 && n > 1.5 ? 1 / kf : Infinity, frag: frag(L), cls: netClass(L), stop: false };
  }
  /* 2а: генотипы MEF */
  const G = {
    wt:   { f: 1,    d: 1,    low: 0.05, resp: 1.00, opa: true,  drp: 1,   px: 1 },
    mfn:  { f: 0,    d: 1,    low: 0.35, resp: 0.55, opa: true,  drp: 1,   px: 1 },
    mfn2: { f: 0.25, d: 1,    low: 0.08, resp: 0.90, opa: true,  drp: 1,   px: 1 },
    opa1: { f: 0,    d: 1,    low: 0.35, resp: 0.50, opa: false, drp: 1,   px: 1 },
    drp1: { f: 1,    d: 1/17, low: 0.05, resp: 1.00, opa: true,  drp: 0,   px: 4 },
    mff:  { f: 1,    d: 0.30, low: 0.05, resp: 1.00, opa: true,  drp: 0.3, px: 3 },
  };
  const L_OPA = 0.55;   // доля длинной формы OPA1 в покое (учебная; обе формы присутствуют — Song 2007, Anand 2014)
  function cell(geno, drug){
    const g = G[geno], si = drug === 'si' && geno !== 'drp1' ? P.si : 1;
    const kf = P.kf0 / 2 * g.f, kd = P.kd0 / 2 * g.d * si;
    const n0 = steadyN(kf, kd);
    let n = n0, l = P.l0, Lfrac = 1, t = 0;
    const cccp = drug === 'cccp';
    const drpM = g.drp * si * (cccp && g.drp > 0 ? P.drpCCCP : 1);
    let kfT = kf, kdT = kd * (cccp && g.drp > 0 ? P.drpCCCP : 1);   /* остаточное деление без DRP1 от привлечения DRP1 не зависит (рецензия, находка 1) */
    for (; t < P.T - 1e-9; t += P.dt){
      if (cccp) Lfrac = Math.exp(-(t + P.dt) / P.tauOMA);
      kfT = kf * Lfrac;
      n += P.dt * (fisRate(kdT, n) - fusRate(kfT, n) - P.g * n); n = Math.max(1, Math.min(nMax, n));
      l += P.dt * kfT * l * (1 - l);
    }
    const L = meanL(n);
    const opaL = g.opa ? L_OPA * Lfrac : 0, opaS = g.opa ? 1 - L_OPA * Lfrac : 0;
    return { kf: kfT, kd: kdT, n0, n, L, frag: frag(L), cls: netClass(L), fus: fusRate(kfT, n), fis: fisRate(kdT, n),
             mark: l, low: cccp ? 0.97 : g.low, resp: g.resp * (cccp ? 1.7 : 1), opaL, opaS, opa: g.opa, drpM, drpPresent: g.drp > 0,
             px: drug === 'si' && geno !== 'drp1' ? (g.px === 1 ? 2 : Math.min(4, g.px + 1)) : g.px };
  }
  return { P, nMax, steadyN, meanL, fusRate, fisRate, frag, netClass, basic, G, cell, L_OPA };
})();
/*MODEL-END*/

/* =====================================================================
   Вопрос 2. Слияние и деление мембранных органелл: митохондрии как модель и границы обобщения
   2b — базовый: баланс двух машин (ползунки скоростей слияния и деления, стационар M2.basic)
   2a — продвинутый: что изменено — слияние или деление? (MEF: генотипы, CCCP, подавление DRP1; митохондрии и пероксисомы)
   ===================================================================== */
/* общий рисунок клетки и сети: одна длинная извилистая линия (вся сеть, 120 мкм) режется на n органелл */
const S2V = (() => {
  const CX = 300, CY = 205, RX = 268, RY = 168, NX = 300, NY = 205, NRX = 62, NRY = 46;
  function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const inside = (x, y) => ((x - CX) / (RX - 18)) ** 2 + ((y - CY) / (RY - 18)) ** 2 < 1 && ((x - NX) / (NRX + 14)) ** 2 + ((y - NY) / (NRY + 14)) ** 2 > 1;
  /* извилистый путь из 240 отрезков по 5 px (1 мкм ≈ 10 px): случайное блуждание внутри цитоплазмы с постоянным зерном */
  const PATH = (() => {
    const R = rng(11), pts = [[120, 110]]; let a = 0.3;
    while (pts.length < 241){
      const [x, y] = pts[pts.length - 1];
      let ok = false;
      for (let k = 0; k < 40 && !ok; k++){
        const aa = a + (R() - 0.5) * (0.9 + k * 0.15), nx = x + 5 * Math.cos(aa), ny = y + 5 * Math.sin(aa);
        if (inside(nx, ny)){ pts.push([nx, ny]); a = aa; ok = true; }
      }
      if (!ok){ a += Math.PI * 0.8; }
    }
    return pts;
  })();
  /* доли длин органелл: постоянные «случайные» веса, чтобы рисунок менялся плавно */
  const W = (() => { const R = rng(5); return Array.from({ length: 240 }, () => -Math.log(1 - R() * 0.98)); })();
  function cellSVG(){
    return `<ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" class="box" style="fill:var(--surface-2);stroke-width:2.5"/>
      <ellipse cx="${NX}" cy="${NY}" rx="${NRX}" ry="${NRY}" fill="var(--nuc)" stroke="var(--nuc-line)" stroke-width="2"/>`;
  }
  /* сеть из n органелл: путь режется на n участков с длинами по весам; каждая органелла занимает 60 % своего участка,
     остальное — промежуток, видимый как разрыв; мелкие фрагменты слегка смещены поперёк пути, чтобы не сливались в линию */
  const J = (() => { const R = rng(31); return Array.from({ length: 240 }, () => [R() - 0.5, R() - 0.5]); })();
  const at = u => { const i = Math.min(239, Math.floor(u)), f = u - i, a = PATH[i], b = PATH[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; };
  function mitoSVG(n){
    n = Math.max(1, Math.min(240, Math.round(n)));
    const line = pts => `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--mito)" stroke-width="${n > 120 ? 5 : 6}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (n === 1) return line(PATH);
    const w = W.slice(0, n), s = w.reduce((a, b) => a + b, 0);
    let pos = 0, out = '';
    for (let i = 0; i < n; i++){
      const por = 240 * w[i] / s, a = pos + por * 0.2, b = pos + por * 0.8, jx = n > 40 ? J[i][0] * 12 : 0, jy = n > 40 ? J[i][1] * 12 : 0;
      const pts = []; for (let u = a; u < b; u += 0.5) pts.push(at(u)); pts.push(at(Math.min(240, b)));
      out += line(pts.map(p => [p[0] + jx, p[1] + jy]));
      pos += por;
    }
    return out;
  }
  /* пероксисомы: 26 органелл; k — относительная длина (1 — округлые) */
  const PX = (() => { const R = rng(23), out = []; while (out.length < 26){ const x = 60 + R() * 480, y = 60 + R() * 290; if (inside(x, y)) out.push([x, y, R() * Math.PI]); } return out; })();
  function peroxSVG(k){
    return PX.map(([x, y, a]) => { const L = 4 * (k - 1); const dx = L * Math.cos(a), dy = L * Math.sin(a);
      return `<line x1="${(x - dx).toFixed(1)}" y1="${(y - dy).toFixed(1)}" x2="${(x + dx).toFixed(1)}" y2="${(y + dy).toFixed(1)}" stroke="var(--aa)" stroke-width="9" stroke-linecap="round"/>`; }).join('');
  }
  return { cellSVG, mitoSVG, peroxSVG, CX, CY };
})();

/* Модель вопроса 3 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   3b. Идеальная модель фазового разделения с одним эффективным каркасным компонентом (смесь двух мультивалентных каркасных белков 1 : 1,
       как SH3ₙ + PRMₙ у Li 2012). Ниже концентрации насыщения Cнас — только однородный раствор; выше —
       концентрация в разбавленной фазе остаётся равной Cнас, избыток уходит в плотную фазу (правило рычага).
       Концентрация в плотной фазе Cпл = 100·Cнас (в экспериментах Li 2012 белки в каплях были концентрированы в 82–116 раз).
       Объёмная доля капель φ = (c − Cнас)/(Cпл − Cнас); доля молекул в плотной фазе = φ·Cпл/c.
       Cнас при 3, 4 и 5 модулях — 120, 60 и 30 мкМ; при 2 модулях в диапазоне 0–200 мкМ капли не образуются.
       Это учебные величины: Li 2012 показали, что порог снижается с ростом валентности, но наши числа подобраны
       для наглядности. В многокомпонентной клетке концентрация разбавленной фазы не остаётся строго постоянной (Riback 2020).
   3a. Четыре структуры, одинаково выглядящие как яркий фокус (McSwiggen 2019), и ответы на шесть экспериментов.
       FRAP: восстановление f(t) = mf·(1 − 2^(−t/t½)) (доля от исходной яркости; учебные величины).
       Созревание капель FUS (in vitro): подвижная фракция mf(h) = 0,05 + 0,85·exp(−h/τ), τ = 10 ч у белка дикого типа
       и 2,5 ч у FUS G156E (учебные величины; качественно — по Patel 2015: капли с G156E переходят в
       твёрдоподобное состояние быстрее). */
const M3 = (() => {
  const CSAT = { 2: Infinity, 3: 120, 4: 60, 5: 30 }, ENR = 100, CMAX = 200;
  function phase(c, v){
    const cs = CSAT[v];
    if (!(c > cs)) return { csat: cs, dil: c, phi: 0, fd: 0, sep: false };
    const cd = ENR * cs, phi = (c - cs) / (cd - cs);
    return { csat: cs, dil: cs, phi, fd: phi * cd / c, sep: true, cden: cd };
  }
  /* 3a: четыре структуры. frap: [подвижная фракция, время полувосстановления, с]; остальные — класс результата эксперимента */
  const ST = {
    cond: { frap: [0.9, 5],  dil: 'gone', fuse: 'merge', mem: 'no',  arom: 'gone', hex: 'gone' },
    cplx: { frap: [0.85, 8], dil: 'dim',  fuse: 'touch', mem: 'no',  arom: 'kept', hex: 'kept' },
    org:  { frap: [0.8, 3],  dil: 'dim',  fuse: 'touch', mem: 'yes', arom: 'kept', hex: 'kept' },
    agg:  { frap: [0.05, null], dil: 'same', fuse: 'touch', mem: 'no', arom: 'kept', hex: 'kept' },
  };
  const MYST = ['cplx', 'cond', 'agg', 'org'];         // фокусы 1–4 в режиме загадки
  const EXPS = ['frap', 'dil', 'fuse', 'mem', 'arom', 'hex'];
  function result(st, exp){
    const r = ST[st];
    if (exp === 'frap') return { cls: r.frap[0] > 0.3 ? 'fast' : 'none', mf: r.frap[0], th: r.frap[1] };
    return { cls: r[exp] };
  }
  const frapAt = (mf, th, s) => th ? mf * (1 - Math.pow(2, -s / th)) : mf * Math.min(1, s / 60);
  /* созревание FUS */
  const TAU = { wt: 10, g156e: 2.5 };
  function mature(v, h){
    const mf = 0.05 + 0.85 * Math.exp(-h / TAU[v]);
    const th = 5 + 20 * (1 - (mf - 0.05) / 0.85);   // по мере созревания обмен и замедляется
    return { mf, th, state: mf > 0.6 ? 'liq' : mf > 0.25 ? 'mid' : 'sol' };
  }
  return { CSAT, ENR, CMAX, phase, ST, MYST, EXPS, result, frapAt, TAU, mature };
})();
/*MODEL-END*/

/* Модель вопроса 4 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   4b. Мембрана клетки как окружность длиной C = 30 мкм (учебная клетка диаметром около 10 мкм). Мембранный белок
       доставляется пузырьками: доля p — к полюсу (гауссово распределение шириной σ = 1 мкм), остальное — равномерно по
       всей мембране; поток доставки Q постоянен. Белок диффундирует в мембране (D = 0,1 мкм²/с — порядок величины для мембранного белка животной клетки, учебная оценка) и удаляется эндоцитозом с константой k по всей мембране.
       Стационар уравнения D·c'' − k·c + s(x) = 0 на окружности находится точно: функция Грина
       G(x) = λ·ch((C/2 − |x|)/λ) / (2D·sh(C/(2λ))), λ = √(D/k) — длина спада. Баланс массы: белка на мембране Q/k.
       Так поддерживают полярность дрожжи (Valdez-Taubas и Pelham 2003; Marco 2007): домен — стационар доставки,
       диффузии и эндоцитоза, а не неподвижная структура. Числа условны.
   4a. Эпителиальная клетка (энтероцит, клетки Caco-2): апикальный груз NHE3, доставка которого зависит от Rab11 и
       миозина Vb, и груз сравнения DPPIV, доставляемый другим путём (Vogel 2015). Компартменты: A — апикальная мембрана,
       B — базолатеральная, R — рециклирующие эндосомы (Rab11), V — пузырьки, не доставленные к мембране.
       Потоки (в минуту, учебные): синтез 1; NHE3 из Гольджи 85 % в R, 15 % на B; DPPIV 90 % прямо на A, 10 % на B;
       R → A 0,5 (без миозина Vb — 20 % от этого, остальное R → V); R → B 0,02; деградация из R 0,02, из V 0,06;
       эндоцитоз с A 0,05 (DPPIV 0,01), с B 0,2 — ошибочно доставленный белок удаляется быстро; латеральная утечка
       через область контакта 0,002 (без тяжей плотного контакта — 0,008: допущение модели).
       Генотипы и груз — стационарное состояние. Ингибитор эндоцитоза (динамин; эндоцитоз ×0,1) — отдельная чашка, которая
       стартует из стационара без ингибитора и считается 4 ч. Трансэпителиальное сопротивление — отдельная величина
       барьера: без клаудинов около 30 % от нормы (Otani 2019, клетки MDCK II); для клеток без миозина Vb не
       рассчитывается; ингибитор в модели барьер не меняет (допущение). */
const M4 = (() => {
  const P = { C: 30, D: 0.1, sig: 1, NB: 120, Q: 1 };
  const KE = [0.0005, 0.001, 0.002, 0.003, 0.005, 0.007, 0.01, 0.015, 0.02];   // константы эндоцитоза, с⁻¹
  const K0 = 4, P0 = 0.9;                                                         // исходное состояние: k = 0,005 с⁻¹, 90 % к полюсу
  const lam = k => Math.sqrt(P.D / k);
  function profile(p, k){
    const L = lam(k), dx = P.C / P.NB, xs = [...Array(P.NB)].map((_, i) => -P.C / 2 + (i + 0.5) * dx);
    const G = x => { x = Math.abs(x) % P.C; if (x > P.C / 2) x = P.C - x; return L * Math.cosh((P.C / 2 - x) / L) / (2 * P.D * Math.sinh(P.C / (2 * L))); };
    const g = xs.map(x => Math.exp(-x * x / (2 * P.sig * P.sig))), gs = g.reduce((a, b) => a + b, 0);
    const c = xs.map(x => (1 - p) * P.Q / (P.C * k) + p * P.Q * xs.reduce((s, xj, j) => s + g[j] / gs * G(x - xj), 0));
    const total = c.reduce((a, b) => a + b, 0) * dx;
    const pole = Math.max(...c), opp = Math.min(...c);
    return { xs, c, lam: L, contrast: pole / opp, total, pole, opp };
  }
  const total0 = () => P.Q / KE[K0];
  /* время прохода расстояния x диффузией, оценка t ≈ x²/4D */
  const tDiff = x => x * x / (4 * P.D);
  /* --- 4a --- */
  const E = { S: 1, fAn: 0.85, fAd: 0.9, kRA: 0.5, res: 0.2, kRB: 0.02, kRd: 0.02, kVd: 0.06, kAeN: 0.05, kAeD: 0.01, kBe: 0.2,
              kL: 0.002, kLc: 0.008, dyn: 0.1, T: 240, terC: 0.3 };
  function solve(M, b){ const n = b.length, a = M.map((r, i) => [...r, b[i]]);
    for (let i = 0; i < n; i++){ let q = i; for (let j = i + 1; j < n; j++) if (Math.abs(a[j][i]) > Math.abs(a[q][i])) q = j; [a[i], a[q]] = [a[q], a[i]];
      for (let j = 0; j < n; j++) if (j !== i){ const f = a[j][i] / a[i][i]; for (let k = i; k <= n; k++) a[j][k] -= f * a[i][k]; } }
    return a.map((r, i) => r[n] / r[i]); }
  function rates(c, drugOn){
    const nhe = c.cargo === 'nhe3', m5 = c.geno !== 'myo5b', d = drugOn ? E.dyn : 1;
    return { rRA: nhe ? (m5 ? E.kRA : E.kRA * E.res) : E.kRA, rAV: nhe && !m5 ? E.kRA * (1 - E.res) : 0,
             kAe: (nhe ? E.kAeN : E.kAeD) * d, kBe: E.kBe * d, kL: c.geno === 'cldn' ? E.kLc : E.kL,
             sR: nhe ? E.S * E.fAn : 0, sA: nhe ? 0 : E.S * E.fAd, sB: E.S * (1 - (nhe ? E.fAn : E.fAd)) };
  }
  function deriv(x, r){ const [A, B, R, V] = x;
    return [r.sA + r.rRA * R - r.kAe * A - r.kL * A + r.kL * B,
            r.sB + E.kRB * R - r.kBe * B - r.kL * B + r.kL * A,
            r.sR + r.kAe * A + r.kBe * B - (r.rRA + r.rAV + E.kRB + E.kRd) * R,
            r.rAV * R - E.kVd * V]; }
  function steady(c){ const r = rates(c, false);
    const M = [[-(r.kAe + r.kL), r.kL, r.rRA, 0], [r.kL, -(r.kBe + r.kL), E.kRB, 0], [r.kAe, r.kBe, -(r.rRA + r.rAV + E.kRB + E.kRd), 0], [0, 0, r.rAV, -E.kVd]];
    return solve(M, [-r.sA, -r.sB, -r.sR, 0]); }
  function epi(c){
    let x = steady(c);
    if (c.drug === 'dyn'){ const r = rates(c, true), dt = 0.05; for (let t = 0; t < E.T; t += dt){ const d = deriv(x, r); x = x.map((v, i) => v + dt * d[i]); } }
    const [A, B, R, V] = x, T = A + B + R + V;
    return { A: A / T, B: B / T, In: (R + V) / T, R: R / T, V: V / T, ter: c.geno === 'cldn' ? E.terC : (c.geno === 'myo5b' ? null : 1) };
  }
  /* целые проценты трёх долей, сумма ровно 100 (метод наибольших остатков): числа на экране складываются */
  function pct3(r){
    const v = [r.A, r.B, r.In].map(x => x * 100), f = v.map(Math.floor); let rest = 100 - f.reduce((a, b) => a + b, 0);
    v.map((x, i) => [x - f[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0){ f[i]++; rest--; } });
    return { a: f[0], b: f[1], i: f[2] };
  }
  return { P, KE, K0, P0, lam, profile, total0, tDiff, E, epi, steady, pct3 };
})();
