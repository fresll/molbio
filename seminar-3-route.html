орости в пробирке не равны клеточным: в клетке на цикл влияют GEF, GAP, концентрации нуклеотидов и расположение белков.","Чтобы понять, почему количество RAS-GTP не меняется при добавлении ингибитора, одного pull-down недостаточно. Нужны независимые данные: генотип клеток (секвенирование гена) и содержание ингибитора в клетках (масс-спектрометрия). Только вместе с ними результат pull-down можно истолковать."],"trap":["Сильная полоса RAS в блоте означает, что в клетке много активной формы RAS.","Полоса общего RAS показывает всё количество белка; активную форму показывает только дорожка после RBD pull-down. Их нужно сравнивать."],"conditions":"Схемы методов: RBD pull-down — de Rooij и Bos (1997); измерение ГТФазной активности очищенных вариантов — Hunter (2015). Это схемы методов, а не данные конкретного опыта; что измеряется и каков контроль, указано на схеме.","sources":["deRooij1997","Hunter2015"],"quiz":{"id":"S3-measure-ras","question":"Что показывает дорожка RAS после осаждения на RBD-домене RAF?","options":[{"id":"S3-measure-ras-1","text":"Количество RAS в GTP-форме в момент лизиса","correct":true,"feedback":"RBD-домен связывает только GTP-форму, поэтому осаждённый RAS — это активная форма; общий RAS служит контролем загрузки."},{"id":"S3-measure-ras-2","text":"Всё количество белка RAS в клетке","correct":false,"feedback":"Всё количество показывает дорожка общего RAS. После RBD pull-down осаждается только активная, GTP-форма."},{"id":"S3-measure-ras-3","text":"Скорость собственного гидролиза GTP у RAS","correct":false,"feedback":"Скорость гидролиза измеряют отдельно, в пробирке по освобождению фосфата. Pull-down даёт количество, а не скорость."}]},"widget":{"kind":"method","title":"","s":{"title":"Как измеряют активный RAS","status":"Схемы методов · не экспериментальные данные","modes_label":"Метод","modes":["RBD pull-down","ГТФазная реакция в пробирке","Секвенирование: какая замена","Содержание ингибитора в клетках","Что показывает каждый метод"],"schemes":[{"draw":"rbd","h":300,"l":{"pA":"А","a":"Лизат клеток: смесь RAS-GTP и RAS-GDP","gtp":"RAS-GTP","gdp":"RAS-GDP","pB":"Б","b":"Гранулы с RBD-доменом RAF","wash":"RAS-GDP смывается","pC":"В","c":"Блот","row1":"RAS (после pull-down) — активная форма","row2":"RAS общий — контроль загрузки"},"note":"RBD-домен RAF связывает только GTP-форму RAS; несвязанный RAS-GDP смывается. Полоса после pull-down — количество активного RAS, общий RAS — контроль. Контроль метода: лизат, в котором RAS заранее связан с GTPγS (сильная полоса) или с GDP (слабая)."},{"draw":"gtpase","h":290,"l":{"pA":"А","a":"Очищенный RAS,\nсвязанный с [γ-³²P]GTP","gtp":"GTP","gp":"γ-фосфат\n(метка ³²P)","pB":"Б","b":"Через время t\nγ-фосфат отщеплён","pi":"³²Pi\n(свободный фосфат)","read":"Скорость реакции определяют по количеству ³²Pi,\nосвобождаемому за единицу времени:\nметка переходит из белковой фракции в свободный фосфат."},"note":"В пробирке на очищенном белке измеряют освобождение меченого γ-фосфата (или неорганического фосфата) из GTP. Так получают собственную и GAP-стимулированную скорость гидролиза вариантов. Скорости в пробирке не равны клеточным."},{"draw":"seq","h":330,"l":{"pA":"А","a":"Как читают генотип","s1":"клетки линии","s2":"ДНК","s3":"фрагмент гена KRAS","s4":"чтение ДНК","pB":"Б","b":"Что видно в кодонах 11–13","cod":"кодон","r0":"норма","r1":"KRAS G12C","r2":"KRAS G12D","a1":"Ала","a2":"Гли","a3":"Цис","a4":"Асп"},"note":"Секвенирование показывает, какая замена есть в кодоне 12: G12C — триплет TGT (цистеин) вместо GGT (глицин), G12D — GAT (аспарагиновая кислота). Красным выделен изменённый нуклеотид. Результат секвенирования не заменяет измерение реакции клеток на ингибитор; генотип и ответ на препарат определяют независимо."},{"draw":"msdrug","h":320,"l":{"pA":"А","a":"Как измеряют содержание ингибитора в клетках","s1":"экстракт клеток","s2":"разделение","s3":"масс-спектрометр","pB":"Б","b":"Спектры двух культур","c1":"контрольные клетки","c2":"неизвестные клетки","std":"стандарт","drug":"ингибитор","mz":"m/z"},"note":"Масс-спектрометр определяет вещества по отношению массы к заряду (m/z); высота пика ингибитора относительно внутреннего стандарта показывает его количество в клетках. Одинаковые пики означают, что препарат попал в клетки обеих культур в сходном количестве; присоединился ли он к белку, этот опыт не показывает."},{"draw":"table","head":["Метод","Что показывает","Чего не показывает"],"rows":[["RBD pull-down","количество RAS-GTP в момент лизиса","скорости обмена и гидролиза"],["ГТФазная реакция в пробирке","собственную и GAP-стимулированную скорость гидролиза","поведение в живой клетке"],["Секвенирование гена KRAS","какая замена есть в кодоне 12 и в какой доле аллелей образца она обнаружена","скорости обмена и гидролиза; активность RAS"],["Масс-спектрометрия: ингибитор в клетках","сколько препарата содержат клетки","связался ли он с мишенью и в какой форме находится RAS"],["pERK, pAKT в блоте","активность путей-эффекторов","прямо — долю RAS-GTP"]],"note":"Для количества активной формы берут pull-down, для скоростей — реакцию в пробирке, для генотипа — секвенирование, для содержания препарата — масс-спектрометрию. Ни один метод не даёт всего сразу."}]}},"section":2,"number":20,"question":3},{"id":"gq-ip3","questions":[4],"title":"Как опустошается депо Ca²⁺","keywords":["Gq","фосфолипаза C","PLCβ","PIP2","IP3","DAG","IP3-рецептор","депо","ЭПР"],"lead":["Депо-зависимый вход запускается после опустошения запаса Ca²⁺ в ЭПР.","В физиологических условиях это происходит при активации ветви Gq; посредником служит растворимый IP₃."],"mechanism":["Рецептор, сопряжённый с Gq, через Gq активирует фосфолипазу Cβ, которая расщепляет [[T73|PIP₂]] с образованием [[T70|IP₃]] и [[T74|DAG]].","Растворимый IP₃ диффундирует в цитозоле и открывает [[T71|IP₃-рецептор]] в мембране ЭПР.","Через IP₃-рецептор Ca²⁺ выходит из депо в цитозоль. Скорость выхода превышает скорость обратной закачки насосом [[T68|SERCA]], поэтому депо опустошается."],"paragraphs":["Депо-зависимый вход начинается не с внешнего Ca²⁺, а с опустошения внутреннего запаса. Рецептор, сопряжённый с белком Gq, активирует фосфолипазу Cβ. Этот фермент гидролизует мембранный липид PIP₂ и образует сразу два посредника с разной локализацией: растворимый IP₃ и мембранный диацилглицерол (DAG).","IP₃ диффундирует в цитозоле и связывается с IP₃-рецептором — каналом мембраны ЭПР. Канал открывается при совместном связывании IP₃ и Ca²⁺ на цитозольной стороне и выпускает Ca²⁺ из просвета ЭПР. Пока выход превышает закачку насосом SERCA, концентрация свободного Ca²⁺ в просвете депо снижается.","Запас Ca²⁺ в ЭПР ограничен: объём ЭПР — малая часть объёма клетки. Поэтому при высвобождении Ca²⁺ его концентрация в цитозоле быстро повышается, но по мере истощения запаса этот источник Ca²⁺ исчерпывается. Длительный ответ (например, активация транскрипции в лимфоците) требует входа Ca²⁺ из внешней среды — и именно снижение концентрации Ca²⁺ в ЭПР служит сигналом к открытию пути входа Ca²⁺ из среды.","В практикуме отдельную ветвь Gq не моделируют: опустошение депо задают напрямую — ползунком концентрации Ca²⁺ в ЭПР (базовый уровень), тапсигаргином или кратким импульсом IP₃ (продвинутый уровень, два протокола). Так состояние депо отделено от рецепторного сигнала; исход импульса зависит от работы SERCA (шаг о протоколе с тапсигаргином)."],"trap":["IP₃ сам открывает канал на плазматической мембране и впускает Ca²⁺ снаружи.","IP₃ открывает канал IP₃-рецептора в мембране ЭПР и выпускает Ca²⁺ из депо; вход снаружи идёт позже и через другой канал — Orai1."],"conditions":"По обзорам Berridge (2016), Prakriya и Lewis (2015) и главе 3 пособия. Схема — механизм, не данные опыта.","sources":["Berridge2016","Prakriya2015"],"quiz":{"id":"S3-gq-ip3","question":"Фосфолипаза Cβ активирована. Где окажется образовавшийся IP₃ и на что он подействует?","options":[{"id":"S3-gq-ip3-1","text":"Останется в мембране и активирует протеинкиназу C","correct":false,"feedback":"В мембране остаётся DAG; он участвует в активации протеинкиназы C. IP₃ растворим и диффундирует в цитозоль."},{"id":"S3-gq-ip3-2","text":"Перейдёт в цитозоль и откроет IP₃-рецептор ЭПР","correct":true,"feedback":"Растворимый IP₃ диффундирует к IP₃-рецептору мембраны ЭПР и открывает его; Ca²⁺ выходит из депо, и депо опустошается."},{"id":"S3-gq-ip3-3","text":"Откроет Orai1 на плазматической мембране","correct":false,"feedback":"Orai1 открывают кластеры STIM1 после опустошения депо, а не IP₃ напрямую."}]},"widget":{"kind":"net","title":"","s":{"title":"Ветвь Gq опустошает депо","status":"Схема механизма","modes_label":"Состояние","modes":["Покой","Агонист на Gq-рецепторе"],"h":300,"w":640,"areas":[{"kind":"mem","y":58,"lx":440,"ly":48,"label":"плазматическая мембрана"},{"kind":"text","x":250,"y":290,"label":"просвет ЭПР (депо Ca²⁺)","anchor":"middle"}],"nodes":[{"id":"rec","x":20,"y":30,"w":96,"label":"Gq-рецептор","fs":12},{"id":"plc","x":140,"y":30,"w":80,"label":"PLCβ"},{"id":"pip2","x":250,"y":70,"w":80,"label":"PIP₂"},{"id":"ip3","x":250,"y":150,"w":70,"label":"IP₃"},{"id":"dag","x":360,"y":70,"w":70,"label":"DAG"},{"id":"ip3r","x":246,"y":222,"w":88,"label":"IP₃R"}],"edges":[{"id":"e1","pts":[116,43,138,43],"type":"act"},{"id":"e2","pts":[180,56,240,80],"type":"act"},{"id":"e3","pts":[285,96,285,146],"type":"move","label":"гидролиз","lx":330,"ly":124},{"id":"e4","pts":[300,86,360,92],"type":"move"},{"id":"e5","pts":[285,176,285,218],"type":"bind"},{"id":"e6","pts":[285,284,285,254],"type":"act","label":"Ca²⁺ из депо","lx":400,"ly":272}],"states":[{"on":[],"note":"В покое Gq-рецептор неактивен, PIP₂ цел, депо заполнено."},{"on":["rec","plc","pip2","ip3","dag","ip3r"],"show":["e1","e2","e3","e4","e5","e6"],"note":"Агонист активирует PLCβ; из PIP₂ образуются IP₃ и DAG; IP₃ открывает IP₃-рецептор, и Ca²⁺ выходит из депо — депо опустошается."}]}},"section":3,"number":21,"question":4},{"id":"stim-sensor","questions":[4],"title":"Как опустошение депо активирует STIM1","keywords":["STIM1","EF-hand","SAM","димер","кластер","сенсор","Luik","Stathopulos","опорная остановка"],"lead":["Опорная остановка 7 из 8 · сенсор, канал и эффектор: звенья цепи STIM1 → Orai1 → кальцинейрин — разные белки, и отдельный опыт указывает на отдельное звено; продолжает остановку 6.","STIM1 — сенсор Ca²⁺ в депо: его домен EF-hand связывает Ca²⁺ в просвете ЭПР.","Диссоциация Ca²⁺ от этого домена переводит STIM1 в активную форму. Изменяйте ползунком концентрацию Ca²⁺ в ЭПР и проследите за долей STIM1 в кластерах."],"mechanism":["Домен [[T63|EF-hand]] STIM1 в просвете ЭПР связывает Ca²⁺ с умеренным сродством (Kd около 200–600 мкМ).","При опустошении депо Ca²⁺ диссоциирует от домена EF-hand, люминальные домены перестраиваются, цитозольная часть распрямляется.","Молекулы STIM1 в распрямлённой форме собираются в [[T64|кластеры]]; доля STIM1 в кластерах резко меняется при изменении концентрации Ca²⁺ в ЭПР."],"paragraphs":["STIM1 — белок мембраны ЭПР. Его обращённый в просвет участок (домен EF-hand вместе с доменом SAM) связывает Ca²⁺ с умеренным сродством — таким, что Ca²⁺ диссоциирует именно при физиологическом опустошении депо. Важно правильно описать исходное состояние: в покое полноразмерный STIM1 — уже димер в компактной, «сложенной» конформации, а не одиночная молекула. Каждая субъединица пересекает мембрану ЭПР одной трансмембранной спиралью: домены EF-hand и SAM лежат в просвете ЭПР, а цитозольная часть — в цитозоле. Поэтому Ca²⁺ на домене EF-hand находится внутри ЭПР, и STIM1 служит сенсором концентрации Ca²⁺ в просвете, а не в цитозоле (на схеме точка Ca²⁺ нарисована только в просвете; её плотность показывает долю занятых мест).","При снижении концентрации Ca²⁺ в просвете ЭПР ион диссоциирует от домена EF-hand, люминальные домены перестраиваются, цитозольная часть распрямляется и открывает участок связывания канала. Распрямлённые димеры собираются в кластеры. В схеме доля STIM1 в кластерах рассчитана по учебной модели практикума как функция Хилла от концентрации Ca²⁺ в ЭПР (K½ около 187 мкМ, коэффициент около 4 по Luik 2008).","Высокий коэффициент Хилла означает, что зависимость крутая: около порога небольшое снижение Ca²⁺ в ЭПР резко увеличивает долю STIM1 в кластерах. Поэтому вход Ca²⁺ активируется почти пороговым образом, а не плавно нарастает с каждым потерянным ионом.","Не следует переносить на целый белок поведение изолированного люминального фрагмента: в растворе такой фрагмент действительно олигомеризуется только после потери Ca²⁺, но полноразмерный STIM1 в покое уже димер (Zhou 2013)."],"trap":["STIM1 в покое — одиночная молекула, которая объединяется в димеры только после опустошения депо.","Полноразмерный STIM1 в покое уже димер в сложенной форме; опустошение депо распрямляет его и собирает димеры в кластеры."],"conditions":"Модель схемы — учебная (вопрос 4 практикума), доля STIM1 в кластерах по Luik 2008 (Jurkat, клетки с ЭПР-индикатором): перераспределение STIM1 — функция Хилла с K½ около 190 мкМ и коэффициентом около 4 (в модели схемы принято 187 мкМ и 3,8). Сродство EF-hand — Stathopulos 2006 (рекомбинантный домен, Kd 200–600 мкМ). Строение в покое — Zhou 2013.","sources":["Luik2008","Stathopulos2006","Zhou2013"],"quiz":{"id":"S3-stim-sensor","question":"Концентрацию Ca²⁺ в просвете ЭПР снизили с 500 до 150 мкМ. Какой станет доля STIM1 в кластерах?","options":[{"id":"S3-stim-sensor-1","text":"Почти не изменится: в ЭПР ещё много Ca²⁺","correct":false,"feedback":"150 мкМ уже ниже порога кластеризации (K½ ≈ 187 мкМ). В этой области зависимость крутая, и доля STIM1 в кластерах растёт с 2 % до 70 %."},{"id":"S3-stim-sensor-2","text":"Большая часть STIM1 соберётся в кластеры","correct":true,"feedback":"При 150 мкМ домены EF-hand в значительной мере теряют Ca²⁺, и в модели около 70 % STIM1 находится в кластерах (при 500 мкМ — около 2 %)."},{"id":"S3-stim-sensor-3","text":"Кластеры распадутся: STIM1 свяжет больше Ca²⁺","correct":false,"feedback":"При снижении концентрации Ca²⁺ в ЭПР домен EF-hand теряет Ca²⁺, а не связывает его. Потеря Ca²⁺ и вызывает распрямление и кластеризацию STIM1."}]},"widget":{"kind":"q4stim","title":"","s":{"title":"STIM1 как сенсор Ca²⁺ в депо","status":"Учебная модель (вопрос 4 практикума), условные величины","er_label":"[Ca²⁺] в просвете ЭПР","uM":"мкМ","pm":"плазматическая мембрана","er":"ЭПР (депо Ca²⁺)","folded":"сложенный димер","extended":"распрямлён, в кластерах","b_ef":"STIM1 без Ca²⁺","b_clust":"STIM1 в кластерах","b_crac":"ток CRAC","ef":"без Ca²⁺ на EF-hand","clust":"в кластерах","crac":"ток CRAC","note":"Доли рассчитаны по модели практикума: та же функция Хилла, что на базовом уровне вопроса 4. Спираль STIM1 пересекает мембрану ЭПР; домены EF-hand и SAM — внутри просвета, где и связывается Ca²⁺; цитозольная часть складывается или распрямляется до Orai1.","lumen":"просвет ЭПР","cyto":"цитоплазма","ef_note":"Ca²⁺ на EF-hand — в просвете ЭПР"}},"section":3,"number":22,"question":4,"exam_quiz":{"question":"В линии клеток после тапсигаргина проверили три величины. (1) STIM1 образует кластеры у плазматической мембраны, как в норме. (2) Ток CRAC почти не регистрируется, а при добавлении Ca²⁺ в среду концентрация Ca²⁺ в цитозоле не растёт. (3) Ионофор Ca²⁺ переводит NFAT в ядро. Какое звено повреждено?","options":[{"id":"S3-stim-sensor-x2","text":"Повреждён сенсор: STIM1 не воспринимает опустошение депо","correct":false,"feedback":"Образование кластеров показывает, что STIM1 воспринимает опустошение депо. Нарушено звено, расположенное после этой стадии."},{"id":"S3-stim-sensor-x3","text":"Повреждены кальцинейрин или NFAT, поэтому Ca²⁺ не вызывает переноса NFAT в ядро","correct":false,"feedback":"Ионофор переводит NFAT в ядро, значит, путь от кальцинейрина к ядерному переносу NFAT сохранён. Кроме того, отсутствие тока CRAC указывает на нарушение входа Ca²⁺, предшествующего активации кальцинейрина и NFAT."},{"id":"S3-stim-sensor-x1","text":"Повреждён канал Orai1 или его активация кластерами STIM1","correct":true,"feedback":"Кластеры показывают, что STIM1 воспринимает опустошение депо, а перенос NFAT при действии ионофора — что путь от кальцинейрина к ядерному переносу NFAT сохранён. Остаётся звено между кластерами и входом. Эти данные не различают дефект самого канала и нарушенное связывание кластера с каналом: для этого нужны дополнительные опыты."}]}},{"id":"contact-site","questions":[4],"title":"Почему вход Ca²⁺ происходит именно в участке контакта двух мембран","keywords":["контакт ЭПР–ПМ","ER-PM junction","10-25 нм","захват Orai1","микродомен","геометрия"],"lead":["Депо Ca²⁺ находится в просвете ЭПР, а канал, через который Ca²⁺ входит из среды, — в плазматической мембране.","Передачу сигнала обеспечивает участок, где расстояние между мембранами составляет 10–25 нм."],"mechanism":["Кластеры распрямлённых молекул [[T61|STIM1]] накапливаются в [[T65|контактах ЭПР–ПМ]], где расстояние между мембранами составляет 10–25 нм.","Цитозольная часть STIM1 достигает [[T62|Orai1]] в плазматической мембране, связывается с ним и непосредственно открывает канал.","У открытого Orai1 образуется локальный микродомен с особенно высокой концентрацией Ca²⁺; одновременно может повышаться и средняя концентрация Ca²⁺ в цитозоле. Мишени по-разному отвечают на локальный и общий сигналы."],"paragraphs":["Между двумя событиями — снижением Ca²⁺ внутри ЭПР и открыванием канала в плазматической мембране — нет ни общего компартмента, ни диффундирующего посредника. Их связывает структура — контакт ЭПР и плазматической мембраны, где расстояние между мембранами составляет порядка 10–25 нм.","Этот зазор достаточно мал, чтобы цитозольная часть распрямлённого STIM1 достигала Orai1 и при этом мембраны не сливались. STIM1 диффундирует в мембране ЭПР и задерживается именно в контактах; там он связывается с молекулами Orai1 и непосредственно открывает их. Участок контакта здесь — необходимое условие: белок одной мембраны служит лигандом канала другой мембраны, а радиус его действия задан геометрией контакта.","Отсюда следует и локальность сигнала: у устья открытого Orai1 образуется [[T92|микродомен]] с особенно высокой концентрацией Ca²⁺. Локальный и общий сигналы не исключают друг друга: при длительном входе ионы рассеиваются, и повышается также средняя концентрация Ca²⁺ в цитозоле — именно её показывает индикатор в практикуме. Мишени различают эти сигналы: в неэлектровозбудимых клетках NFAT1 переходил в ядро особенно эффективно при входе через CRAC-каналы, но не через канал TRPC3, хотя оба пути входа повышали концентрацию Ca²⁺ в цитозоле (Kar 2011). Поэтому подавление микродомена (например, быстрым хелатором Ca²⁺) не обязательно меняет среднюю концентрацию Ca²⁺ в цитозоле, а повышение средней концентрации не означает, что у канала есть микродомен.","Если увеличить зазор (в схеме — условный режим «60 нм»), цитозольная часть STIM1 не достигает Orai1, и канал не открывается, несмотря на опустошённое депо. Это показывает, что важна именно геометрия контакта."],"trap":["STIM1 перемещается в плазматическую мембрану и сам становится каналом для Ca²⁺.","STIM1 остаётся в мембране ЭПР; в участке контакта он лишь связывает и открывает Orai1, канал плазматической мембраны."],"conditions":"По обзору Prakriya и Lewis (2015) и работе Wu и соавт. (2006): при опустошении депо STIM1 накапливается в участках ЭПР на расстоянии 10–25 нм от плазматической мембраны. Режим «зазор 60 нм» — условная иллюстрация роли геометрии, не данные опыта. Различие локального и общего сигналов — Kar 2011 (неэлектровозбудимые клетки): NFAT1 особенно чувствителен к микродомену у открытых каналов CRAC. Показания «у устья канала» и «в объёме цитозоля» на схеме — качественные, не измеренные величины.","sources":["Prakriya2015","Wu2006","Kar2011"],"quiz":{"id":"S3-contact-site","question":"Депо опустошено, STIM1 распрямлён, но зазор между мембранами в контакте искусственно увеличен. Откроется ли Orai1?","options":[{"id":"S3-contact-site-1","text":"Откроется: опустошения депо достаточно","correct":false,"feedback":"Опустошение депо распрямляет STIM1, но открыть Orai1 он может, только достигнув его; при большом зазоре этого не происходит."},{"id":"S3-contact-site-2","text":"Не откроется: STIM1 не достигнет Orai1","correct":true,"feedback":"При увеличенном зазоре цитозольная часть STIM1 не достигает Orai1, и канал не открывается, хотя депо пусто."},{"id":"S3-contact-site-3","text":"Откроется: STIM1 перейдёт в плазматическую мембрану к Orai1","correct":false,"feedback":"STIM1 остаётся в мембране ЭПР и не переходит в плазматическую мембрану; он действует через контакт на расстоянии."}]},"widget":{"kind":"net","title":"","s":{"title":"Контакт ЭПР–ПМ","status":"Схема механизма (режим «зазор 60 нм» — условная иллюстрация)","modes_label":"Состояние","modes":["Депо полное","Депо пустое","Зазор 60 нм (условно)"],"h":300,"w":640,"areas":[{"kind":"mem","y":54,"lx":440,"ly":44,"label":"плазматическая мембрана"},{"kind":"text","x":320,"y":290,"label":"мембрана ЭПР","anchor":"middle"}],"nodes":[{"id":"orai","x":260,"y":34,"w":120,"label":"Orai1"},{"id":"stim","x":266,"y":210,"w":108,"label":"STIM1"}],"edges":[{"id":"cpl","pts":[320,206,320,64],"type":"bind","label":"захват и открытие","lx":430,"ly":140}],"states":[{"on":[],"note":"Депо полное: STIM1 сложен и не достигает Orai1, канал закрыт.","metrics":[["Концентрация Ca²⁺ у устья Orai1","исходная"],["Средняя концентрация Ca²⁺ в цитозоле","исходная"]]},{"on":["orai","stim"],"show":["cpl"],"note":"Депо пустое: кластеры распрямлённых молекул STIM1 в контакте связывают и открывают Orai1 — через зазор 10–25 нм.","metrics":[["Концентрация Ca²⁺ у устья Orai1","высокая (микродомен)"],["Средняя концентрация Ca²⁺ в цитозоле","повышена"]]},{"on":["stim"],"hide":["cpl"],"note":"Зазор увеличен до ~60 нм: STIM1 распрямлён, но не достигает Orai1, и канал закрыт (условная иллюстрация роли геометрии).","metrics":[["Концентрация Ca²⁺ у устья Orai1","исходная (канал закрыт)"],["Средняя концентрация Ca²⁺ в цитозоле","исходная"]]}]}},"section":3,"number":23,"question":4},{"id":"crac-current","questions":[4],"title":"Что показывают ток CRAC и генетика Orai1","keywords":["ток CRAC","ICRAC","патч-кламп","входящее выпрямление","избирательность","R91W","Feske","RNAi-скрининг"],"lead":["Ток через Orai1 обладает характерными свойствами, по которым его отличают от других токов.","А молекулярную идентичность канала установила генетика: замена R91W в ORAI1 у больных с иммунодефицитом."],"mechanism":["[[T66|Ток CRAC]] (ICRAC) регистрируют патч-клампом в конфигурации whole-cell после опустошения депо.","Его характерные свойства: высокая избирательность к Ca²⁺, очень малая проводимость, [[T67|входящее выпрямление]].","У больных с заменой R91W в ORAI1 ток CRAC отсутствует, а введение нормального Orai1 его восстанавливает."],"paragraphs":["Электрофизиологические измерения выявляют характерные свойства тока CRAC. При опустошении депо в конфигурации whole-cell регистрируют входящий ток, очень избирательный к Ca²⁺ (потенциал реверсии выше +90 мВ), с очень малой одноканальной проводимостью и входящим выпрямлением: при отрицательном потенциале ток велик, при деполяризации почти исчезает. Этот набор свойств позволяет отличить ICRAC от других токов, но не указывает, какой белок образует канал.","Белок канала идентифицировали двумя независимыми подходами (Feske 2006). Картирование сцепления в семье больных тяжёлым комбинированным иммунодефицитом указало участок хромосомы 12q24, а RNAi-скрининг в клетках дрозофилы, где после тапсигаргина следили за переходом NFAT–GFP в ядро, выявил ген dOrai (оба подхода показаны на схеме). Его человеческий гомолог ORAI1 расположен в том же участке; больные гомозиготны по замене R91W.","В T-клетках больных депо-зависимый вход и ток CRAC отсутствуют. Введение нормального Orai1 восстанавливает и вход, и ток, а Orai1 R91W — нет, хотя оба белка синтезируются в равном количестве и находятся у плазматической мембраны. В опытах с экспрессией в клетках HEK293 Orai1 R91W сохраняет взаимодействие со STIM1 (Muik 2008): нарушено само проведение Ca²⁺.","Вывод относится к этому классу замен с потерей функции; не любая замена в ORAI1 даёт иммунодефицит. Убедительным считают совпадение независимых данных — фармакологических, электрофизиологических и генетических — вместе с восстановлением функции нормальным белком."],"trap":["Замена R91W мешает STIM1 собираться в кластеры, поэтому вход Ca²⁺ пропадает.","Orai1 R91W находится у мембраны и сохраняет взаимодействие со STIM1 (опыты на клетках HEK293); нарушено проведение Ca²⁺ самим каналом."],"conditions":"Feske и соавт. (2006): T-клеточные линии и фибробласты двух больных и их родственников. Вход Ca²⁺ — пик и начальная скорость роста [Ca²⁺] после тапсигаргина и возврата Ca²⁺ во внешнюю среду. ICRAC — whole-cell, пассивное опустошение депо 8 мМ BAPTA в пипетке, 20 мМ Ca²⁺ снаружи; ток восстановленных клеток полностью блокировался 2 мкМ La³⁺. Взаимодействие R91W со STIM1 — Muik 2008 (клетки HEK293, FRET). Вольт-амперная кривая на схеме — качественная.","sources":["Feske2006","Muik2008","Prakriya2015"],"quiz":{"id":"S3-crac-current","question":"В T-клетках больного с ORAI1 R91W депо опустошили хелатором BAPTA в пипетке. Что покажет патч-кламп?","options":[{"id":"S3-crac-current-1","text":"Нормальный ток CRAC: мутантный белок есть у мембраны","correct":false,"feedback":"Orai1 R91W действительно находится у плазматической мембраны, но канал не проводит Ca²⁺, поэтому ток CRAC не развивается."},{"id":"S3-crac-current-2","text":"Ток CRAC не развивается, несмотря на опустошение депо","correct":true,"feedback":"В T-клетках больных с R91W ток CRAC при опустошении депо не развивается; нормальный Orai1 его восстанавливает (Feske 2006)."},{"id":"S3-crac-current-3","text":"Ток CRAC с выходящим выпрямлением","correct":false,"feedback":"Для тока CRAC характерно входящее выпрямление; замена R91W не меняет этого свойства, а устраняет проведение Ca²⁺."}]},"widget":{"kind":"method","title":"","s":{"title":"Ток CRAC и генетика Orai1","status":"Схемы метода · данные Feske 2006 (генетика); родословная и лунки — условные","modes_label":"Что показано","modes":["Патч-кламп whole-cell","Вольт-амперная кривая","Поиск гена: сцепление","Поиск гена: RNAi-скрининг","Генетика R91W"],"h":240,"schemes":[{"draw":"q4patch","l":{"pA":"А","a":"Регистрация тока CRAC в конфигурации whole-cell","out":"внеклеточная среда: 2 мМ Ca²⁺","cyt":"цитозоль","ion":"Ca²⁺","pip":"пипетка: плотный контакт с мембраной;\nмембрана под кончиком разрушена —\nраствор пипетки сообщается с цитозолем\n(в нём BAPTA; депо опустошают IP₃,\nингибитором SERCA или самим хелатором)","amp":"усилитель: ток I","bath":"электрод\nв среде","read":"Регистрируют входящий ток через Orai1 после опустошения депо"},"note":"Кончик пипетки образует плотный контакт с мембраной, мембрану под ним разрушают, и раствор пипетки сообщается с цитозолем. Усилитель поддерживает заданный потенциал и регистрирует ток между пипеткой и электродом в среде; после опустошения депо это входящий ток Ca²⁺ через Orai1.","h":310},{"draw":"q4iv","l":{"v":"мембранный потенциал","i":"ток","inward":"большой входящий ток","rev":"при деполяризации почти нет"},"note":"Характерные свойства тока CRAC: высокая избирательность к Ca²⁺, очень малая проводимость, входящее выпрямление."},{"draw":"linkage","h":300,"l":{"pA":"Б","a":"Картирование сцепления в семье (условная родословная)","mk":"маркер 12q24:","g":["A/B","B/C","B/B","B/B","A/C"],"hit":"B","aff":"болен","car":"носитель (здоров)","ok":"здоров","res":"Больные дети получили от обоих родителей один и тот же аллель B маркера участка 12q24,\nздоровый ребёнок — нет: болезнь наследуется вместе с этим участком. При достаточном числе\nсемей это указывает на участок 12q24; какой именно это ген, сцепление не показывает."},"note":"Картирование сцепления сопоставляет наследование болезни и аллелей маркеров в семье. Больные с рецессивным заболеванием получили от обоих родителей один и тот же аллель маркера, а здоровые родственники — нет; так выделяют участок хромосомы (у Feske 2006 — 12q24). Сам ген внутри участка устанавливают другими методами."},{"draw":"rnaiscreen","h":316,"l":{"pA":"В","a":"RNAi-скрининг с репортёром NFAT–GFP (условная схема)","top":"В каждой лунке клетки дрозофилы получают двуцепочечную РНК к одному гену;\nзатем во все лунки добавляют тапсигаргин и снимают распределение NFAT–GFP.","w":["контрольная РНК","ген 1","ген 2","ген dOrai"],"hit_i":3,"r":["NFAT–GFP\nв ядре","NFAT–GFP\nв цитоплазме"],"res":"Лунку без ядерного сигнала отбирают: подавленный ген нужен на пути от опустошения депо\nдо переноса NFAT в ядро. Участвует ли он в самом входе Ca²⁺, проверяют отдельно —\nизмерением концентрации Ca²⁺ и тока CRAC."},"note":"Во всех лунках депо опустошают тапсигаргином. Если путь цел, кальцинейрин дефосфорилирует NFAT–GFP, и зелёный сигнал собирается в ядре. Лунки, где сигнал остаётся в цитоплазме, указывают на гены, нужные на этом пути; так в клетках дрозофилы нашли ген dOrai (Feske 2006). Отсутствие ядерного сигнала ещё не показывает, на каком звене действует ген."},{"draw":"table","head":["T-клетки","Вход Ca²⁺ после тапсигаргина","Ток CRAC"],"rows":[["здорового донора","есть","есть"],["больного (ORAI1 R91W)","резко снижен","не развивается"],["больного + нормальный Orai1","восстановлен","восстановлен"],["больного + Orai1 R91W","не восстановлен","не развивается"]],"note":"Генетика устанавливает идентичность канала: нормальный Orai1 восстанавливает вход и ток, Orai1 R91W — нет, хотя оба белка находятся у мембраны в равном количестве (Feske 2006)."}]}},"section":3,"number":24,"question":4},{"id":"calcineurin-nfat","questions":[4],"title":"Как вход Ca²⁺ приводит к активации транскрипции","keywords":["кальмодулин","кальцинейрин","фосфатаза","NFAT","дефосфорилирование","циклоспорин A","циклофилин"],"lead":["Длительный вход Ca²⁺ активирует фосфатазу кальцинейрин.","Она дефосфорилирует NFAT, и тот переходит в ядро — сигнал передаётся активацией фосфатазы, а не киназы."],"mechanism":["Ca²⁺ связывается с [[T75|кальмодулин]]ом; комплекс Ca²⁺–кальмодулин активирует фосфатазу [[T76|кальцинейрин]].","Кальцинейрин дефосфорилирует [[T77|NFAT]], открывая его сигнал ядерной локализации; NFAT переходит в ядро и там вместе с партнёром AP-1 участвует в активации генов (для IL2 нужны оба).","Продолжающаяся активность кальцинейрина поддерживает ядерный NFAT. После прекращения Ca²⁺-сигнала NFAT рефосфорилируется и постепенно выходит из ядра; этот ответ может заметно переживать сам сигнал."],"paragraphs":["Изменение концентрации Ca²⁺ меняет занятость Ca²⁺-связывающих белков. Центральный из них — кальмодулин: связав Ca²⁺, он меняет конформацию и активирует набор мишеней. Одна из них — кальцинейрин, серин-треониновая фосфатаза, активная только в комплексе с Ca²⁺–кальмодулином.","Субстрат кальцинейрина — транскрипционный фактор NFAT. В покое NFAT фосфорилирован по многим участкам и удерживается в цитоплазме. Дефосфорилирование кальцинейрином открывает сигнал ядерной локализации, и NFAT переходит в ядро. Одного ядерного NFAT для ответа недостаточно: на промоторе гена интерлейкина-2 он связывается с ДНК совместно с AP-1 (Fos–Jun), и без партнёра комплекс не образуется кооперативно (Peterson 1996; Macián 2001). Поэтому переход NFAT в ядро — необходимое, но не достаточное условие транскрипции IL2.","Здесь используется положение из общей части семинара: сигнал передаётся не активацией киназы, а активацией фосфатазы. Стационарный уровень фосфорилирования NFAT сдвигается за счёт активности фосфатазы. Многосайтовое фосфорилирование делает переход резким. После прекращения входа Ca²⁺ NFAT рефосфорилируется, но его выход из ядра происходит постепенно. В опытах Kar 2011 ядерный NFAT1 сохранялся значительно дольше Ca²⁺-сигнала; полувремя рефосфорилирования и выхода NFAT1 из ядра в этом опыте составляло около 24 минут.","На этот путь действует иммунодепрессант циклоспорин A. Он связывается с внутриклеточным белком циклофилином, и уже образовавшийся комплекс подавляет кальцинейрин. Вход Ca²⁺ при этом не меняется, но NFAT не дефосфорилируется и остаётся в цитоплазме — на этом основано предотвращение отторжения трансплантата."],"trap":["Циклоспорин A блокирует вход Ca²⁺ через Orai1, поэтому NFAT не идёт в ядро.","Циклоспорин A не действует на вход Ca²⁺: он через циклофилин подавляет кальцинейрин, и NFAT остаётся фосфорилированным в цитоплазме."],"conditions":"По обзору Hogan и соавт. (2003) и Hogan и соавт. (2010). Зависимость удержания NFAT в ядре от длительности сигнала — Timmerman 1996, Tomida 2003. Мишень циклоспорина — Liu 1991 (кальцинейрин — общая мишень комплексов циклофилин–циклоспорин A и FKBP–FK506). Кооперативное связывание NFAT и AP-1 с ДНК — Peterson 1996 (опыты со связыванием белков с ДНК in vitro), Macián 2001 (обзор). В клетках NFAT1 остаётся в ядре заметно дольше самого сигнала Ca²⁺, а лимитирует его пребывание в ядре скорость выхода из ядра: NFAT1 остаётся в ядре примерно в 10 раз дольше сигнала Ca²⁺ (Kar 2011).","sources":["Hogan2003","Hogan2010","Timmerman1996","Tomida2003","Liu1991","Peterson1996","Macian2001","Kar2011"],"quiz":{"id":"S3-calcineurin-nfat","question":"В клетке с нормальным входом Ca²⁺ NFAT находится в ядре. Добавили циклоспорин A. Как изменятся концентрация Ca²⁺ в цитозоле и локализация NFAT?","options":[{"id":"S3-calcineurin-nfat-1","text":"Концентрация Ca²⁺ снизится, NFAT вернётся в цитоплазму","correct":false,"feedback":"Циклоспорин A не действует на каналы, поэтому вход Ca²⁺ и его концентрация в цитозоле не снижаются; меняется только локализация NFAT."},{"id":"S3-calcineurin-nfat-2","text":"Концентрация Ca²⁺ не изменится, NFAT вернётся в цитоплазму","correct":true,"feedback":"Вход Ca²⁺ не меняется, но кальцинейрин подавлен: киназы рефосфорилируют NFAT, и он возвращается в цитоплазму."},{"id":"S3-calcineurin-nfat-3","text":"Концентрация Ca²⁺ не изменится, NFAT останется в ядре","correct":false,"feedback":"Удержание NFAT в ядре требует непрерывной активности кальцинейрина. Без неё киназы рефосфорилируют NFAT, и он покидает ядро, хотя Ca²⁺ входит нормально."}]},"widget":{"kind":"net","title":"","s":{"title":"Кальцинейрин и NFAT","status":"Схема механизма","modes_label":"Состояние","modes":["Покой","Длительный вход Ca²⁺","Вход Ca²⁺ и AP-1","+ циклоспорин A"],"h":340,"w":640,"areas":[{"kind":"nuc","x":470,"y":262,"rx":155,"ry":78,"lx":598,"ly":204,"label":"ядро"}],"nodes":[{"id":"ca","x":20,"y":40,"w":86,"label":"Вход Ca²⁺","fs":12},{"id":"cam","x":130,"y":40,"w":110,"label":"Ca²⁺·кальмодулин","fs":10.5},{"id":"cn","x":264,"y":40,"w":110,"label":"кальцинейрин","fs":11},{"id":"nfat","x":264,"y":130,"w":100,"label":"NFAT (цитоплазма)","fs":11},{"id":"nfatn","x":358,"y":218,"w":100,"label":"NFAT (ядро)","fs":11,"only":[1,2]},{"id":"ap1","x":508,"y":218,"w":80,"label":"AP-1","fs":12,"only":[1,2]},{"id":"gene","x":420,"y":288,"w":120,"label":"гены (IL2 и др.)","fs":11}],"edges":[{"id":"e1","pts":[106,53,128,53],"type":"act"},{"id":"e2","pts":[240,53,262,53],"type":"act"},{"id":"e3","pts":[314,80,314,126],"type":"act","label":"дефосфорилирует","lx":390,"ly":108},{"id":"e4","pts":[330,172,380,214],"type":"move","label":"в ядро","lx":306,"ly":204},{"id":"e5","pts":[408,258,446,286],"type":"bind"},{"id":"e6","pts":[548,258,520,286],"type":"bind"}],"states":[{"on":[],"p":["nfat"],"note":"В покое кальцинейрин неактивен, NFAT фосфорилирован и удерживается в цитоплазме."},{"on":["ca","cam","cn","nfatn"],"miss":["ap1"],"show":["e1","e2","e3","e4"],"note":"Длительный вход Ca²⁺ активирует кальцинейрин; кальцинейрин дефосфорилирует NFAT, и NFAT переходит в ядро. Партнёра AP-1 в этом опыте нет, поэтому транскрипция IL2 не активируется, даже если NFAT находится в ядре."},{"on":["ca","cam","cn","nfatn","ap1","gene"],"show":["e1","e2","e3","e4","e5","e6"],"note":"NFAT и AP-1 совместно связываются с промотором IL2 — это отдельная стадия после переноса в ядро, показанная связями с ДНК; транскрипция генов-мишеней активируется только при совпадении обоих сигналов."},{"on":["ca","cam"],"inh":["cn"],"p":["nfat"],"show":["e1","e2"],"drugs":[[264,36,"циклоспорин A"]],"note":"Циклоспорин A через циклофилин подавляет кальцинейрин: вход Ca²⁺ прежний, но NFAT остаётся фосфорилированным в цитоплазме."}]}},"section":3,"number":25,"question":4,"exam_quiz":{"question":"Ионофор Ca²⁺ в T-лимфоцитах переводит NFAT в ядро, но сам по себе (без других воздействий) не вызывает сильной индукции гена IL2. Добавление активатора протеинкиназы C к ионофору вызывает сильную индукцию. Как это объяснить?","options":[{"id":"S3-calcineurin-nfat-x1","text":"Ядерного NFAT недостаточно: для сильной индукции IL2 нужен также AP-1 из другой ветви","correct":true,"feedback":"NFAT связывается с промотором IL2 совместно с AP-1 (Fos–Jun). Ионофор запускает кальциевую ветвь, а активатор протеинкиназы C дополнительно включает ветвь, приводящую к образованию AP-1."},{"id":"S3-calcineurin-nfat-x2","text":"Ионофор не вызывает дефосфорилирования NFAT, поэтому NFAT остаётся в цитоплазме","correct":false,"feedback":"По условию NFAT переходит в ядро: дефосфорилирование произошло. Недостаёт другого условия транскрипции."},{"id":"S3-calcineurin-nfat-x3","text":"Для индукции IL2 нужен только вход Ca²⁺, а добавка влияет на жизнеспособность клеток","correct":false,"feedback":"Если бы достаточно было Ca²⁺ и NFAT в ядре, ионофор сам вызывал бы сильную индукцию. Усиление при добавке указывает на второй сигнальный путь, а не на жизнеспособность."}]}},{"id":"addback","questions":[4],"title":"Как отделяют вход Ca²⁺ из среды от высвобождения из депо","keywords":["тапсигаргин","возврат Ca²⁺","add-back","Fura-2","340/380","контроль","буферирование","импульс IP₃","пополнение депо","SERCA"],"lead":["Проверяя зависимость входа Ca²⁺ от состояния депо, используют тапсигаргин и возврат Ca²⁺ в среду.","Концентрацию Ca²⁺ в цитозоле при этом измеряют индикатором Fura-2."],"mechanism":["[[T69|Тапсигаргин]] подавляет SERCA; депо опустошается за счёт утечки Ca²⁺ — без участия рецептора и IP₃.","В среде без Ca²⁺ виден лишь преходящий подъём его концентрации в цитозоле за счёт высвобождения из депо; после возврата Ca²⁺ сразу развивается длительный вход.","[[T79|Fura-2]] возбуждают на 340 и 380 нм; отношение сигналов пересчитывают в концентрацию Ca²⁺."],"paragraphs":["Этот протокол позволяет разделить вклад отдельных звеньев пути. Сначала клетки держат в среде без Ca²⁺ и добавляют тапсигаргин — необратимый ингибитор SERCA. Закачка Ca²⁺ в ЭПР прекращается, депо опустошается за счёт постоянной утечки, и если вход Ca²⁺ из среды возникает без агониста, это показывает его зависимость от состояния депо. Без внешнего Ca²⁺ виден лишь небольшой преходящий подъём (он обусловлен высвобождением из депо); после возврата Ca²⁺ в среду сразу развивается длительный вход.","Концентрацию Ca²⁺ в цитозоле измеряют флуоресцентным индикатором Fura-2. Его возбуждают поочерёдно светом 340 и 380 нм; при связывании Ca²⁺ сигнал на 340 нм растёт, а на 380 нм падает. Отношение двух сигналов (340/380) не зависит от количества красителя в клетке и после калибровки пересчитывается в концентрацию Ca²⁺.","Каждый контроль позволяет сравнить определённые составляющие сигнала. Удаление внешнего Ca²⁺ отделяет вход снаружи от высвобождения из депо: длительная составляющая исчезает, а возврат Ca²⁺ её восстанавливает. Нокаут STIM1 или Orai1 и блокатор CRAC подавляют депо-зависимый вход; полнота подавления зависит от эффективности нокаута (проверяют белок и ток CRAC) и от компенсации Orai2, Orai3 или STIM2.","Тапсигаргин — не единственный способ опустошить депо, и он не показывает, как сигнал выключается в обычной клетке. Рассмотрим краткий импульс IP₃ в среде с Ca²⁺. Ca²⁺ выходит из ЭПР через IP₃-рецептор, STIM1 собирается в кластеры, Orai1 открывается. Когда импульс заканчивается, SERCA закачивает Ca²⁺ в ЭПР, в том числе вошедший через Orai1: депо пополняется, Ca²⁺ снова связывается с доменом EF-hand, кластеры разбираются, вход прекращается. Orai1 переносит Ca²⁺ из среды только в цитозоль; в просвет ЭПР его переносит SERCA. Если SERCA заблокирована тапсигаргином, депо не пополняется даже при наличии Ca²⁺ в среде, STIM1 остаётся в кластерах, и вход продолжается. Третий режим схемы сравнивает эти два случая; тот же опыт есть в практикуме (4а, протокол «импульс IP₃»).","У метода есть ограничение: сам индикатор связывает Ca²⁺ и служит буфером, а перевод отношения 340/380 в наномолярную концентрацию требует калибровки. Концентрации на графиках практикума рассчитаны в учебной модели, а не измерены."],"trap":["Преходящий подъём концентрации Ca²⁺ сразу после тапсигаргина — это уже вход снаружи через Orai1.","Пока внешнего Ca²⁺ нет, вход снаружи невозможен; преходящий подъём обусловлен утечкой Ca²⁺ из ЭПР при подавленной SERCA."],"conditions":"T-лимфоциты и другие клетки (Prakriya и Lewis 2015; Zweifach и Lewis 1993). Тапсигаргин — необратимый ингибитор SERCA (Thastrup 1990). Fura-2 — Grynkiewicz 1985 (отношение 340/380, пересчёт в концентрацию после калибровки). Буферирование Ca²⁺ — Clapham 2007. Числа на графиках практикума — учебная модель. Режим «импульс IP₃» — учебная модель практикума (вопрос 4, 4а): время пополнения депо в модели задано условно и не откалибровано по эксперименту; сохранён порядок событий — пополнение депо, разборка кластеров STIM1, закрытие Orai1.","sources":["Prakriya2015","Thastrup1990","Grynkiewicz1985","Clapham2007","Zweifach1993"],"quiz":{"id":"S3-addback","question":"Клетки находятся в среде без Ca²⁺. После добавления тапсигаргина измерение с Fura-2 показало небольшой преходящий подъём концентрации Ca²⁺ в цитозоле. Откуда поступил этот Ca²⁺?","options":[{"id":"S3-addback-1","text":"Вошёл снаружи через Orai1","correct":false,"feedback":"Внешнего Ca²⁺ в среде нет, поэтому вход через Orai1 невозможен; преходящее повышение концентрации Ca²⁺ не может быть обусловлено входом из среды."},{"id":"S3-addback-2","text":"Вышел из ЭПР за счёт утечки","correct":true,"feedback":"Тапсигаргин подавил SERCA, и депо опустошается за счёт утечки; именно этот Ca²⁺ вызывает преходящий подъём концентрации Ca²⁺ в цитозоле."},{"id":"S3-addback-3","text":"Это артефакт: Fura-2 сам светится ярче","correct":false,"feedback":"Отношение 340/380 как раз устраняет зависимость от количества и яркости красителя; подъём отражает реальное высвобождение из депо."}]},"widget":{"kind":"method","title":"","s":{"title":"Тапсигаргин + возврат Ca²⁺ и измерение Fura-2","status":"Схема метода","modes_label":"Что показано","modes":["Fura-2: как измеряют","Протокол и контроли","Импульс IP₃: при активной и заблокированной SERCA"],"h":240,"schemes":[{"draw":"q4fura","l":{"pA":"","a":"Индикатор Fura-2","ex1":"возбуждение 340 нм","ex2":"возбуждение 380 нм","ratio":"отношение 340/380","read":"→ [Ca²⁺] после калибровки"},"note":"Fura-2 возбуждают на 340 и 380 нм; при связывании Ca²⁺ сигнал на 340 нм растёт, на 380 нм падает. Отношение не зависит от количества красителя.","legend":"Ограничение: индикатор связывает Ca²⁺ (служит буфером), пересчёт в нМ требует калибровки."},{"draw":"table","head":["Условие (контроль)","Что показывает"],"rows":[["без внешнего Ca²⁺ + тапсигаргин","преходящий подъём из депо; длительного входа нет"],["возврат 2 мМ Ca²⁺","длительный вход через Orai1 восстанавливается"],["нокаут STIM1 или Orai1","депо-зависимый вход подавлен"],["блокатор CRAC","подавляется вход, пик из депо сохранён"]],"note":"Контрольные опыты позволяют отделить вход Ca²⁺ из среды от высвобождения из депо и установить роль STIM1/Orai1."},{"draw":"q4refill","h":546,"l":{"a":"SERCA активна","b":"SERCA заблокирована (тапсигаргин)","g1":"[Ca²⁺] в цитозоле, нМ","g2":"[Ca²⁺] в просвете ЭПР, % от исходного","g3":"STIM1 в кластерах, %","x":"мин","pulse":"импульс IP₃"},"note":"Синяя линия — клетка с активной SERCA: после импульса депо пополняется, кластеры STIM1 разбираются, концентрация Ca²⁺ в цитозоле возвращается к уровню покоя. Красная пунктирная линия — SERCA заблокирована: депо остаётся пустым, STIM1 в кластерах, вход продолжается. Кривые рассчитаны по модели практикума; скорости не калибровались по эксперименту.","legend":"Серая полоса — импульс IP₃ (2–3 мин). Снаружи 2 мМ Ca²⁺ в обоих опытах."}]}},"section":3,"number":26,"question":4,"exam_quiz":{"question":"При 2 мМ Ca²⁺ снаружи на клетку подают краткий импульс IP₃. В одной клетке SERCA работает, в другой заблокирована тапсигаргином с начала импульса. Что происходит после окончания импульса?","options":[{"id":"S3-addback-x2","text":"В обеих клетках вход прекратится после окончания импульса IP₃ независимо от работы SERCA","correct":false,"feedback":"Импульс лишь опустошает депо. Вход определяется состоянием депо, а не присутствием IP₃: при заблокированной SERCA депо не пополняется."},{"id":"S3-addback-x3","text":"Orai1 пополняет депо непосредственно, поэтому при блокаде SERCA оно тоже восстановится","correct":false,"feedback":"Orai1 открывается в плазматической мембране и переносит Ca²⁺ в цитозоль, а не в ЭПР. Пополнение депо требует работы SERCA."},{"id":"S3-addback-x1","text":"При активной SERCA депо пополнится и вход прекратится; при её блокаде вход продолжится","correct":true,"feedback":"Orai1 переносит Ca²⁺ из среды в цитозоль, а в просвет ЭПР его переносит SERCA. Пока депо пусто, STIM1 остаётся в кластерах, и канал открыт. Пополнение депо возвращает STIM1 в исходное состояние."}]}},{"id":"methods","questions":[1,2,3,4],"title":"Как выбрать величину, метод и контроль","keywords":["метод","контроль","FRET","фосфоспецифичное антитело","RBD","Fura-2","величина","опорная остановка"],"lead":["Опорная остановка 8 из 8 · проверка механизма: один результат совместим с несколькими механизмами, а выбрать между ними позволяет контроль; продолжает остановки 1–7.","Для каждого переключателя сначала решают, какую величину измерять, затем — каким методом и с каким контролем.","Один и тот же результат опыта часто совместим с несколькими механизмами; контрольный опыт позволяет их различить."],"mechanism":["Измеряемые величины различны: концентрация посредника, доля фосфорилированного белка, доля GTP-формы ГТФазы и поток ионов.","Метод: FRET-сенсор cAMP, вестерн-блот с фосфоспецифичным антителом, осаждение RAS-GTP доменом RBD, флуоресцентный индикатор Ca²⁺.","Контроль: вмешательство, которое меняет только одно звено (ингибитор, нокаут, замена остатка, удаление внеклеточного Ca²⁺)."],"paragraphs":["Каждый из четырёх разобранных переключателей описывается своей величиной. Для β2-рецептора это концентрация cAMP в цитоплазме во времени; её измеряют в живой клетке FRET-сенсором, а калибровка по сигналу при прямой активации аденилатциклазы форсколином вместе с ингибитором фосфодиэстераз IBMX позволяет сравнивать опыты. Для фосфорилирования — доля фосфорилированного участка; на блоте видна её относительная динамика, а λ-фосфатаза проверяет, что антитело распознаёт фосфорилированную форму.","Для RAS измеряемая величина — количество RAS в GTP-форме: лизат инкубируют с доменом RBD киназы RAF, который связывает только RAS-GTP, и выявляют осаждённый RAS на блоте. Контролем служат лизаты, в которых RAS заранее связан с негидролизуемым аналогом GTP или с GDP. Для депо-зависимого входа Ca²⁺ величина — вход Ca²⁺ из среды; его оценивают по росту концентрации Ca²⁺ в цитозоле после возврата Ca²⁺ в среду, когда депо заранее опустошено тапсигаргином.","Главная ошибка — заменить одну величину другой: рост концентрации cAMP не означает определённого ответа клетки, рост фосфорилирования — активации киназы, высокая доля RAS-GTP — усиления сигнала рецептора, а повышение концентрации Ca²⁺ — входа через Orai1. В каждом случае есть альтернативное объяснение, и контроль выбирают так, чтобы его исключить: отличить подавление фосфатазы от активации киназы, потерю GAP — от усиления GEF, высвобождение из депо — от входа из среды.","Переключайте таблицы: для каждого переключателя указаны величина, метод, контроль и ограничение вывода."],"trap":["Если величина изменилась в нужную сторону, механизм доказан.","Одно измерение совместимо с несколькими механизмами. Механизм называют только после контроля, который меняет одно звено пути и исключает альтернативное объяснение."],"conditions":"Сводная таблица по шагам разделов 1–4; схемы каждого метода показаны в шагах «Как измеряют cAMP в живой клетке», «Как доказать, что участок фосфорилирования регулирует белок», «Чем измеряют количество активного RAS» и шагах о токе CRAC и протоколе с тапсигаргином.","sources":["Violin2008","Dephoure2013","deRooij1997","Feske2006","Prakriya2015","Mou2017"],"quiz":{"id":"S3-methods","question":"Фосфорилирование белка в клетке выросло после воздействия. Какой опыт отличит активацию киназы от торможения фосфатазы?","options":[{"id":"S3-methods-1","text":"Повторно измерить фосфорилирование через час","correct":false,"feedback":"Повторное измерение той же величины покажет тот же рост, но не его причину: доля фосфорилированного белка зависит от отношения активностей обоих ферментов."},{"id":"S3-methods-2","text":"Подавить киназу и сравнить скорость спада фосфорилирования","correct":true,"feedback":"После полного подавления киназы доля снижается с характерным временем 1/kф. Если воздействие подавило фосфатазу, спад будет медленнее, чем в контроле; если оно активировало киназу, скорость спада не изменится."},{"id":"S3-methods-3","text":"Заменить участок на аспартат и измерить функцию","correct":false,"feedback":"Фосфомиметическая замена отвечает на другой вопрос — достаточно ли заряда на участке для функции. О том, какой фермент изменил активность, она не говорит."}]},"widget":{"kind":"method","title":"","s":{"title":"Величина, метод, контроль","status":"Схема метода","modes_label":"Что показано","modes":["β2-рецептор → cAMP","фосфорилирование","цикл RAS","STIM1–Orai1","siRNA и контроль","нокаут гена"],"schemes":[{"draw":"table","head":["Что","Содержание"],"rows":[["величина","концентрация cAMP в цитоплазме во времени"],["метод","FRET-сенсор cAMP в живой клетке"],["контроль","форсколин + IBMX (максимум сигнала), ингибитор фосфодиэстераз, β-блокатор"],["ограничение","сенсор сам связывает cAMP; сигнал целой клетки не различает микродомены"]],"note":"Рост концентрации cAMP показывает активацию пути, но не определённый ответ клетки: ответ задают мишени PKA в данной клетке."},{"draw":"table","head":["Что","Содержание"],"rows":[["величина","доля фосфорилированного участка"],["метод","вестерн-блот с фосфоспецифичным антителом; масс-спектрометрия"],["контроль","λ-фосфатаза, антитело к общему белку, замена S→A, ингибиторы киназы и фосфатазы"],["ограничение","блот даёт относительное изменение, а не долю молекул"]],"note":"Рост фосфорилирования совместим и с активацией киназы, и с торможением фосфатазы: их различают по скорости спада после подавления киназы."},{"draw":"table","head":["Что","Содержание"],"rows":[["величина","количество RAS в GTP-форме"],["метод","осаждение RAS-GTP доменом RBD киназы RAF, затем блот"],["контроль","лизаты, в которых RAS заранее связан с GTPγS или с GDP; общий RAS"],["ограничение","в лизате GTP может гидролизоваться; метод не различает места в клетке"]],"note":"Высокая доля RAS-GTP может означать усиление GEF, потерю GAP или наличие онкогенного варианта. Эти возможности различают, определяя генотип и применяя ингибиторы, например ингибитор SOS1."},{"draw":"table","head":["Что","Содержание"],"rows":[["величина","вход Ca²⁺ из среды"],["метод","индикатор Ca²⁺ (Fura-2) в протоколе «тапсигаргин без Ca²⁺ → возврат Ca²⁺»; ток CRAC"],["контроль","среда без Ca²⁺, блокатор CRAC (La³⁺), нокаут STIM1 или ORAI1"],["ограничение","индикатор буферирует Ca²⁺; пересчёт в нМ требует калибровки"]],"note":"Повышение концентрации Ca²⁺ в цитозоле может быть обусловлено высвобождением из депо или входом из среды; возврат Ca²⁺ после опустошения депо позволяет выделить вход."},{"draw":"sirna","h":310,"l":{"pA":"А","a":"siRNA к GRK6","pB":"Б","b":"Контрольная siRNA","gene":"ген GRK6","mrna":"мРНК GRK6","prot":"белок GRK6","si":"siRNA","si_c":"без мишени","res":"белка меньше\nболее чем на 90 %","res_c":"белка столько же,\nсколько без siRNA","foot":"Количество белка проверяют иммуноблотом. Вывод надёжнее, если вторая siRNA\nс другой последовательностью к тому же гену даёт тот же эффект."},"note":"siRNA спаривается с комплементарной мРНК и направляет её на разрушение: белок-мишень синтезируется в меньшем количестве, но полностью не исчезает. Контрольная siRNA не имеет мишени в клетке и учитывает неспецифическое действие трансфекции. В клетках HEK293 siRNA к GRK6 снизила количество белка более чем на 90 % и замедлила спад cAMP, а siRNA к GRK2, GRK3 и GRK5 спад не меняли; вторая siRNA к GRK6 с другой последовательностью дала тот же эффект (Violin 2008)."},{"draw":"ko","h":335,"l":{"pA":"А","a":"Исходная клетка","pB":"Б","b":"Нокаут","gene":"ген Orai1 (экзоны)","mrna":"мРНК","mrna_no":"мРНК без экзона","prot":"белок Orai1","prot_no":"белок не выявляется","foot":"Нокаут подтверждают на уровне ДНК, белка и функции. Остаточная экспрессия,\nкомпенсация другими белками семейства (Orai2, Orai3) и состав клеточной\nпопуляции требуют отдельного контроля."},"note":"В схеме показан подтверждённый полный функциональный нокаут в исследуемых клетках: участок гена (например, экзон) удалён, а функциональный белок не образуется. Это подтверждают на уровне ДНК (секвенирование), белка (иммуноблот) и функции (например, ток CRAC). Из изменения экзона само по себе не следует отсутствие всех форм белка: возможны пропуск экзона или крупная делеция (Mou 2017), другие изоформы, сохранение ранее синтезированного белка и смесь клеток с разными изменениями (Mou 2017). Отсутствие эффекта при нокауте само по себе не обосновывает вывод о ненужности белка: нужно проверить белок и восстановить функцию нормальным белком. Роль STIM1 и Orai1 в депо-зависимом входе установлена для T-клеток и ряда других типов клеток (Prakriya и Lewis 2015); для другого типа клеток её проверяют отдельно."}]}},"section":4,"number":27,"question":0,"exam_quiz":{"question":"В клетках получили линию с изменением экзона гена Orai1, подтверждённым секвенированием ДНК. Ток CRAC в ней сохраняется. Какой вывод допустим?","options":[{"id":"S3-methods-x2","text":"Orai1 не нужен для входа Ca²⁺, потому что нокаут не изменил ток","correct":false,"feedback":"Отсутствие эффекта не обосновывает этот вывод: сначала нужно показать, что белок исчез во всех исследуемых клетках, и исключить компенсацию."},{"id":"S3-methods-x1","text":"Изменение ДНК само по себе ещё не доказывает утраты функции Orai1","correct":true,"feedback":"Изменение ДНК не доказывает отсутствия функционального белка: возможны пропуск изменённого экзона при сплайсинге, сохранение ранее синтезированного белка, смесь клеток с разными изменениями. Нужны иммуноблот и измерение функции."},{"id":"S3-methods-x3","text":"Секвенирование доказывает отсутствие белка, поэтому ток создаёт другой канал","correct":false,"feedback":"Секвенирование показывает изменение ДНК, но не отсутствие белка. Вывод о другом канале требует независимой проверки белка и функции."}]}},{"id":"investigation","questions":[1,2,3,4],"title":"Как четыре переключателя работают вместе в T-лимфоците","keywords":["T-лимфоцит","TCR","NFAT","AP-1","RASGRP1","IL2","интерлейкин-2","кальцинейрин","циклоспорин"],"lead":["В активированном T-лимфоците один стимул запускает и вход Ca²⁺, и цикл RAS.","Для транскрипции гена интерлейкина-2 необходимы обе ветви, а повышение концентрации cAMP её ослабляет."],"mechanism":["Рецептор антигена активирует фосфолипазу Cγ1, которая образует IP₃ и DAG: IP₃ опустошает депо и запускает вход Ca²⁺ через STIM1–Orai1, DAG связывается с [[T80|RASGRP1]], и RASGRP1 активирует RAS.","Ca²⁺ активирует фосфатазу кальцинейрин, дефосфорилированный NFAT переходит в ядро; путь RAS → ERK повышает количество и активность белков [[T81|AP-1]].","NFAT и AP-1 вместе связываются с [[T82|составными элементами]] промотора IL2; повышение концентрации cAMP подавляет индукцию IL-2."],"paragraphs":["T-лимфоцит удобен как итоговый пример, потому что в нём работают все механизмы семинара. Связывание антигена рецептором T-клетки запускает каскад тирозиновых киназ и активирует фосфолипазу Cγ1. Она, как фосфолипаза Cβ ветви Gq, гидролизует PI(4,5)P₂ с образованием IP₃ и DAG. IP₃ опустошает депо Ca²⁺, STIM1 открывает Orai1, и длительный вход Ca²⁺ активирует кальцинейрин. Дефосфорилированный NFAT переходит в ядро — сигнал передаётся через фосфатазу.","DAG связывается с C1-доменом белка RASGRP1, фактора обмена гуаниновых нуклеотидов для RAS. У мышей без RASGRP1 тимоциты не активировали RAS в ответ на стимуляцию рецептора антигена или аналоги DAG (Dower 2000). RAS-GTP запускает путь ERK, который повышает синтез и фосфорилирование белков семейств Fos и Jun, образующих AP-1. Цикл RAS здесь управляется тем же принципом, что в вопросе 3: доля RAS-GTP задаётся активностью GEF и GAP.","Транскрипция гена интерлейкина-2 требует совпадения двух сигналов: NFAT и AP-1 образуют на составных элементах промотора прочный тройной комплекс с ДНК (Macián 2001). Поэтому ни вход Ca²⁺ без AP-1, ни AP-1 без NFAT недостаточны. У больных с заменой ORAI1 R91W T-клетки лишены депо-зависимого входа Ca²⁺ (Feske 2006), а циклоспорин A подавляет кальцинейрин — оба нарушения затрагивают разные звенья одной ветви. Повышение концентрации cAMP (в опытах — форсколином и аналогами cAMP) в линиях T-клеток подавляло индукцию IL-2, но не IL-4, частично на уровне транскрипции (Novak и Rothenberg 1990): ответ на один и тот же cAMP снова зависит от того, какие гены и белки задействованы в данной клетке.","Отключайте звенья на схеме и следите, какие сигналы доходят до гена IL2."],"trap":["Для активации T-лимфоцита достаточно повышения концентрации Ca²⁺ в цитозоле.","Ca²⁺ через кальцинейрин активирует NFAT, но для транскрипции IL2 нужен ещё AP-1, образование которого зависит от ветви DAG → RASGRP1 → RAS → ERK. Транскрипция гена активируется при совпадении двух сигналов."],"conditions":"Схема механизма, объединяющая данные разных систем: RASGRP1 — мыши без RASGRP1, тимоциты (Dower 2000); NFAT и AP-1 на промоторе IL2 — обзор Macián 2001; ORAI1 R91W — T-клеточные линии больных (Feske 2006); действие cAMP на IL-2 — линии T-клеток мыши, форсколин и аналоги cAMP (Novak и Rothenberg 1990). Состояния схемы качественные, без расчётов.","sources":["Dower2000","Macian2001","Feske2006","Hogan2003","Novak1990"],"quiz":{"id":"S3-investigation","question":"T-лимфоциты без RASGRP1 стимулировали через рецептор антигена. Вход Ca²⁺ и доля NFAT в ядре соответствуют норме. Как изменится индукция гена IL2?","options":[{"id":"S3-investigation-1","text":"Не изменится: NFAT в ядре достаточно","correct":false,"feedback":"NFAT на промоторе IL2 действует совместно с AP-1. Без активации RAS и ERK AP-1 почти не образуется, и одного NFAT для полной индукции недостаточно."},{"id":"S3-investigation-2","text":"Ослабнет: без активации RAS мало AP-1","correct":true,"feedback":"Обе ветви сходятся на промоторе: NFAT от кальциевой ветви и AP-1 от ветви RAS → ERK. Отсутствие RASGRP1 лишает промотор второго партнёра."},{"id":"S3-investigation-3","text":"Усилится: Ca²⁺ не тратится на путь RAS","correct":false,"feedback":"Ca²⁺ не расходуется путём RAS, а ветви не конкурируют за общий ресурс. Подавление ветви RAS снижает, а не повышает индукцию IL2."}]},"widget":{"kind":"net","title":"","s":{"title":"T-лимфоцит: две ветви сходятся на гене IL2","status":"Схема механизма","modes_label":"Условия","modes":["покой","стимуляция рецептора антигена","+ блокатор CRAC","+ циклоспорин A","нет RASGRP1","+ форсколин (cAMP ↑)"],"w":640,"h":320,"nodes":[{"id":"tcr","x":14,"y":14,"w":150,"h":36,"label":"рецептор антигена","fs":12},{"id":"plc","x":14,"y":74,"w":150,"h":36,"label":"PLCγ1","fs":13},{"id":"ip3","x":14,"y":134,"w":70,"h":36,"label":"IP₃","fs":13},{"id":"dag","x":200,"y":134,"w":80,"h":36,"label":"DAG","fs":13},{"id":"soce","x":14,"y":194,"w":150,"h":36,"label":"STIM1–Orai1","fs":12.5},{"id":"cn","x":14,"y":262,"w":150,"h":36,"label":"кальцинейрин","fs":12.5},{"id":"nfat","x":196,"y":262,"w":110,"h":36,"label":"NFAT","fs":13},{"id":"ras","x":200,"y":194,"w":110,"h":36,"label":"RASGRP1","fs":12.5},{"id":"erk","x":348,"y":194,"w":150,"h":36,"label":"RAS → ERK → AP-1","fs":12},{"id":"il2","x":400,"y":262,"w":226,"h":36,"label":"транскрипция гена IL2","fs":12.5},{"id":"b2","x":476,"y":14,"w":150,"h":36,"label":"аденилатциклаза","fs":12.5},{"id":"pka","x":476,"y":74,"w":150,"h":36,"label":"cAMP → PKA","fs":12.5}],"edges":[{"id":"e1","pts":[89,50,89,72],"type":"act"},{"id":"e2","pts":[50,110,50,132],"type":"act"},{"id":"e3","pts":[150,110,220,132],"type":"act"},{"id":"e4","pts":[50,170,50,192],"type":"act"},{"id":"e5","pts":[89,230,89,260],"type":"act","label":"Ca²⁺","lx":116,"ly":250},{"id":"e6","pts":[164,280,194,280],"type":"act"},{"id":"e7","pts":[306,280,398,280],"type":"act"},{"id":"e8","pts":[240,170,240,192],"type":"act"},{"id":"e9","pts":[310,212,346,212],"type":"act"},{"id":"e10","pts":[430,230,470,260],"type":"act"},{"id":"e11","pts":[551,50,551,72],"type":"act"},{"id":"e12","pts":[580,110,580,258],"type":"inh"}],"states":[{"show":[],"note":"Без стимула фосфолипаза Cγ1 неактивна, депо полное, NFAT фосфорилирован и находится в цитоплазме; ген IL2 не транскрибируется.","drugs":[]},{"on":["tcr","plc","ip3","dag","soce","cn","nfat","ras","erk","il2"],"show":["e1","e2","e3","e4","e5","e6","e7","e8","e9","e10"],"note":"Обе ветви активны: длительный вход Ca²⁺ переводит NFAT в ядро, а сигнализация через RAS стимулирует образование AP-1. NFAT и AP-1 совместно индуцируют транскрипцию IL2.","drugs":[]},{"on":["tcr","plc","ip3","dag","ras","erk"],"inh":["soce"],"show":["e1","e2","e3","e4","e8","e9"],"drugs":[[96,186,"блокатор"]],"note":"Депо опустошено, но вход Ca²⁺ подавлен: кальцинейрин не активируется, NFAT остаётся в цитоплазме; одного AP-1 для индукции IL2 недостаточно."},{"on":["tcr","plc","ip3","dag","soce","ras","erk"],"inh":["cn"],"show":["e1","e2","e3","e4","e5","e8","e9"],"drugs":[[24,252,"CsA"]],"note":"Вход Ca²⁺ сохранён, но комплекс циклоспорина A с циклофилином подавляет кальцинейрин: NFAT остаётся фосфорилированным и не входит в ядро."},{"on":["tcr","plc","ip3","dag","soce","cn","nfat"],"miss":["ras"],"show":["e1","e2","e3","e4","e5","e6"],"note":"Без RASGRP1 сигнал DAG не активирует RAS (в тимоцитах мыши — Dower 2000): AP-1 образуется мало, и одного NFAT недостаточно для полной индукции IL2.","drugs":[]},{"on":["tcr","plc","ip3","dag","soce","cn","nfat","ras","erk","b2","pka"],"show":["e1","e2","e3","e4","e5","e6","e7","e8","e9","e10","e11","e12"],"drugs":[[372,36,"форсколин"]],"note":"Форсколин активирует аденилатциклазу в обход рецептора; повышение концентрации cAMP подавляет индукцию IL2 при сохранённой стимуляции, частично на уровне транскрипции (Novak и Rothenberg 1990); механизм этого торможения многоступенчатый и на схеме не детализирован."}]}},"section":4,"number":28,"question":0}],"sections":[{"title":"β2-адренорецептор","entry":"receptor-equilibrium","sub":"Как рецептор активирует Gs и почему ответ зависит от клетки","intro":"Как агонист смещает равновесие конформаций рецептора, как рецептор активирует Gs, как cAMP активирует PKA, почему один и тот же сигнал вызывает разные ответы в разных клетках, как ответ ослабевает при длительной стимуляции и как измеряют cAMP в живой клетке.","first":1,"last":7,"count":7},{"title":"Фосфорилирование","entry":"phospho-mark","sub":"Как пара киназа — фосфатаза переключает белок","intro":"Что фосфатная группа меняет в белке, как пара киназа — фосфатаза задаёт стационарный уровень и время отклика, как фосфоламбан управляет SERCA, откуда берётся резкость ответа, чем задаётся специфичность и как доказывают роль участка фосфорилирования.","first":8,"last":13,"count":6},{"title":"Цикл RAS","entry":"gtpase-switch","sub":"Как GEF и GAP управляют малой ГТФазой","intro":"Почему нуклеотид служит переключателем, как GEF и GAP задают долю RAS-GTP, как рецептор доставляет SOS1 к RAS, как эффекторы узнают активный RAS, чем различаются онкогенные варианты, как работает ковалентный ингибитор KRAS G12C и как измеряют RAS-GTP.","first":14,"last":20,"count":7},{"title":"STIM–Orai","entry":"gq-ip3","sub":"Как опустошение депо открывает канал в другой мембране","intro":"Как ветвь Gq опустошает депо Ca²⁺, как STIM1 реагирует на концентрацию Ca²⁺ в ЭПР, как в контакте мембран STIM1 открывает Orai1, чем ток CRAC отличается от других токов, как кальцинейрин и NFAT превращают вход Ca²⁺ в ответ и как вход Ca²⁺ измеряют.","first":21,"last":26,"count":6},{"title":"Исследование","entry":"methods","sub":"Как выбрать величину, метод и контроль","integr":true,"intro":"Какую величину измеряют, каким методом пользуются и какой контроль выбирают для проверки каждого переключателя; как четыре механизма семинара действуют совместно в одной клетке.","first":27,"last":28,"count":2}],"glossary":[{"id":"S3-T01","term":"β2-адренорецептор","section":0,"def":"Рецептор, сопряжённый с G-белком; содержит семь трансмембранных спиралей, связывает адреналин и норадреналин и в активной конформации служит фактором обмена гуаниновых нуклеотидов для Gαs."},{"id":"S3-T02","term":"Агонист (эффективность)","section":0,"def":"Лиганд, смещающий равновесие конформаций рецептора в сторону активной. Эффективность — степень этого смещения; полный агонист даёт максимальный ответ, частичный — меньший даже при насыщении."},{"id":"S3-T03","term":"Обратный агонист","section":0,"def":"Лиганд, смещающий равновесие к неактивной конформации и снижающий активность рецептора ниже базальной. Пропранолол ведёт себя в основном как обратный агонист β-рецепторов."},{"id":"S3-T04","term":"Базальная активность","section":0,"def":"Небольшая активность рецептора без лиганда, следствие самопроизвольного перехода между конформациями. Антагонист занимает карман, но базальную активность не меняет."},{"id":"S3-T05","term":"Gαs","section":0,"def":"α-субъединица гетеротримерного G-белка Gs. В GTP-форме связывает и активирует аденилатциклазу; время активного состояния ограничено её собственной ГТФазной активностью."},{"id":"S3-T06","term":"Фактор обмена гуаниновых нуклеотидов (GEF)","section":0,"def":"Белок, ускоряющий замену GDP на GTP в ГТФазе. Активный β2-рецептор — GEF для Gαs; тот же механизм у SOS1 для RAS (вопрос 3)."},{"id":"S3-T07","term":"ГТФазная активность","section":0,"def":"Способность Gαs гидролизовать связанный GTP до GDP и тем самым переходить в неактивную форму. Для Gs ускорение этого гидролиза RGS-белками, как правило, не показано."},{"id":"S3-T08","term":"Холерный токсин","section":0,"def":"Бактериальный токсин, ADP-рибозилирующий в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляющий гидролиз GTP. Gαs остаётся в GTP-форме и активирует аденилатциклазу без агониста."},{"id":"S3-T09","term":"Аденилатциклаза","section":0,"def":"Интегральный фермент мембраны; превращает ATP в cAMP. Активируется связыванием Gαs-GTP; форсколин активирует её напрямую, минуя рецептор."},{"id":"S3-T10","term":"cAMP","section":0,"def":"Циклический AMP — вторичный посредник. Его концентрация определяется балансом синтеза аденилатциклазой и гидролиза фосфодиэстеразами; главный эффектор в этом пути — PKA."},{"id":"S3-T11","term":"Фосфодиэстераза (PDE4)","section":0,"def":"Фермент, гидролизующий cAMP до 5'-AMP. На PDE4 приходится значительная часть гидролиза cAMP; PKA фосфорилирует и активирует её (отрицательная обратная связь). Ролипрам избирательно подавляет PDE4."},{"id":"S3-T12","term":"PKA","section":0,"def":"Протеинкиназа A — тетрамер R₂C₂. cAMP связывается с регуляторными субъединицами (по два участка на каждую) и освобождает каталитические; зависимость от cAMP круче простого насыщения."},{"id":"S3-T13","term":"Форсколин","section":0,"def":"Дитерпен, активирующий аденилатциклазу напрямую, минуя рецептор и G-белок. Повышает концентрацию cAMP, не вызывая агонист-зависимой десенситизации рецептора (с участием GRK и β-аррестина)."},{"id":"S3-T14","term":"Ролипрам","section":0,"def":"Избирательный ингибитор PDE4. Замедляя гидролиз cAMP, повышает его концентрацию и продлевает ответ; на рецептор не действует."},{"id":"S3-T15","term":"Клеточный контекст (набор эффекторов)","section":0,"def":"Набор белков, которые PKA фосфорилирует в данной клетке. Именно он задаёт направление ответа: один путь Gs–cAMP–PKA даёт расслабление бронха, усиление работы сердца или липолиз."},{"id":"S3-T16","term":"AKAP","section":0,"def":"Якорный белок протеинкиназы A; удерживает PKA (а часто и PDE, и циклазу) у определённого участка мембраны. Поэтому при одной и той же средней концентрации cAMP фосфорилируются разные субстраты."},{"id":"S3-T17","term":"GRK","section":0,"def":"Киназа рецепторов, сопряжённых с G-белками. Фосфорилирует остатки серина и треонина во внутриклеточном хвосте активного рецептора и тем самым создаёт участок связывания β-аррестина. В клетках HEK293 из GRK2/3/5/6 на десенситизацию β2-рецептора влиял только нокдаун GRK6 (Violin 2008)."},{"id":"S3-T18","term":"β-аррестин (десенситизация)","section":0,"def":"Белок, связывающийся с фосфорилированным активным рецептором. Стерически препятствует связыванию G-белка (десенситизация) и направляет рецептор в эндосому (интернализация)."},{"id":"S3-T19","term":"FRET-сенсор","section":0,"def":"Белок с доменом связывания cAMP между двумя флуоресцентными белками. Связывание cAMP меняет перенос энергии (FRET); отношение сигналов двух цветов в реальном времени отражает изменения концентрации cAMP, а в абсолютную концентрацию переводится калибровкой."},{"id":"S3-T20","term":"Протеинкиназа","section":1,"def":"Фермент, переносящий γ-фосфатную группу ATP на гидроксильную группу серина, треонина или тирозина белка. В геноме человека 518 генов протеинкиназ (Manning 2002)."},{"id":"S3-T21","term":"Протеинфосфатаза","section":1,"def":"Фермент, гидролизующий фосфоэфирную связь в фосфорилированном белке; делает фосфорилирование обратимым. Специфичность серин-треониновых фосфатаз во многом задают их регуляторные субъединицы."},{"id":"S3-T22","term":"Занятость участка (стехиометрия)","section":1,"def":"Доля молекул белка, несущих фосфат на данном участке. Измеряется отдельными методами; интенсивность фосфопептида в масс-спектрометрии её прямо не показывает."},{"id":"S3-T23","term":"Домены, распознающие фосфорилированные остатки","section":1,"def":"Участки белков, связывающие фосфорилированные остатки: домены SH2 и PTB распознают фосфотирозин, белки 14-3-3 — фосфосериновые мотивы. Через них фосфорилирование меняет партнёров белка."},{"id":"S3-T24","term":"Стационарная доля p*","section":1,"def":"Доля фосфорилированных молекул, при которой скорости фосфорилирования и дефосфорилирования равны: p* = kк/(kк + kф) для ферментов, далёких от насыщения."},{"id":"S3-T25","term":"Время релаксации τ","section":1,"def":"Характерное время выхода доли фосфорилированной формы на новый стационарный уровень: τ = 1/(kк + kф). За время τ доля проходит около 63 % пути к новому уровню. Чем выше обе активности, тем короче τ."},{"id":"S3-T26","term":"Эффективная константа скорости","section":1,"def":"Константа первого порядка (с⁻¹), в которую уже входят количество и активность фермента; kк и kф описывают скорости фосфорилирования и дефосфорилирования одной молекулы субстрата."},{"id":"S3-T27","term":"Фосфоламбан (PLN)","section":1,"def":"Белок мембраны саркоплазматического ретикулума кардиомиоцита; в нефосфорилированной форме снижает кажущееся сродство SERCA2a к Ca²⁺. PKA фосфорилирует его по Ser16, CaMKII — по Thr17."},{"id":"S3-T28","term":"SERCA2a","section":1,"def":"Изоформа Ca²⁺-АТФазы саркоплазматического ретикулума сердца; переносит Ca²⁺ из цитозоля в ретикулум за счёт гидролиза ATP и регулируется фосфоламбаном."},{"id":"S3-T29","term":"PP1","section":1,"def":"Протеинфосфатаза 1 — серин-треониновая фосфатаза; в кардиомиоците главная фосфатаза фосфоламбана. После фосфорилирования протеинкиназой A белок ингибитор-1 подавляет активность PP1."},{"id":"S3-T30","term":"Опыт с подавлением киназы","section":1,"def":"Измерение спада фосфорилирования после полного подавления киназы: при kк = 0 доля фосфорилированной формы снижается с характерным временем 1/kф, что позволяет оценить активность фосфатазы."},{"id":"S3-T31","term":"Сверхчувствительность нулевого порядка","section":1,"def":"Резкий переход доли фосфорилированной формы от почти нуля к почти единице при небольшом изменении отношения активностей, когда киназа и фосфатаза насыщены субстратом (Goldbeter и Koshland 1981)."},{"id":"S3-T32","term":"Многосайтовое фосфорилирование","section":1,"def":"Фосфорилирование нескольких участков одного белка; если для изменения свойств нужны все участки, зависимость ответа от активности киназы становится более резкой."},{"id":"S3-T33","term":"Бистабильность","section":1,"def":"Существование двух устойчивых состояний при одном значении входного сигнала; требует эффективной положительной обратной связи — отдельной петли или возникающей внутри многосайтового цикла. Сверхчувствительность сама по себе бистабильности не даёт."},{"id":"S3-T34","term":"Консенсусный мотив","section":1,"def":"Короткая последовательность вокруг фосфорилируемого остатка, которую преимущественно распознаёт каталитический центр киназы; для PKA — основные остатки перед серином (например, RRxS)."},{"id":"S3-T35","term":"Участок стыковки","section":1,"def":"Область поверхности киназы или субстрата вне каталитического центра; взаимодействие таких областей удерживает фермент на субстрате и повышает специфичность."},{"id":"S3-T36","term":"Сигнальный каркасный белок (скаффолд; например, AKAP)","section":1,"def":"Белок, одновременно связывающий несколько участников пути и определяющий их локализацию; белки AKAP связывают PKA и закрепляют её рядом с определёнными мишенями."},{"id":"S3-T37","term":"Фосфоспецифичное антитело","section":1,"def":"Антитело, распознающее белок, только если определённый остаток фосфорилирован; на вестерн-блоте показывает относительное изменение фосфорилирования, а не долю фосфорилированных молекул."},{"id":"S3-T38","term":"λ-фосфатаза","section":1,"def":"Фосфатаза бактериофага λ, отщепляющая фосфатные группы от остатков серина, треонина и тирозина; обработка лизата λ-фосфатазой проверяет, что сигнал антитела обусловлен фосфорилированной формой."},{"id":"S3-T39","term":"Фосфомиметическая замена","section":1,"def":"Замена серина или треонина на аспартат или глутамат, вносящая постоянный отрицательный заряд. Воспроизводит фосфорилирование лишь частично и необратима."},{"id":"S3-T40","term":"малая ГТФаза","section":2,"def":"Белок суперсемейства Ras с G-доменом, связывающим гуаниновый нуклеотид и обладающим медленной собственной ГТФазной активностью. Существует в двух формах — с GTP (активной) и с GDP (неактивной)."},{"id":"S3-T41","term":"G-домен","section":2,"def":"Домен молекулярной массой около 20 кДа, образующий ядро малой ГТФазы; связывает GTP или GDP и обладает слабой собственной ГТФазной активностью."},{"id":"S3-T42","term":"switch I и switch II","section":2,"def":"Две подвижные области G-домена, контактирующие с γ-фосфатом GTP. При связанном GTP они упорядочены и образуют поверхность для эффекторов; после гидролиза разупорядочиваются."},{"id":"S3-T43","term":"γ-фосфат","section":2,"def":"Третья (концевая) фосфатная группа GTP. Её наличие удерживает switch I и switch II в упорядоченном состоянии; при гидролизе она отщепляется, и GTP превращается в GDP."},{"id":"S3-T44","term":"GEF","section":2,"def":"Фактор обмена гуаниновых нуклеотидов: ускоряет замену GDP на GTP, снижая сродство ГТФазы к GDP. ATP не расходует; для RAS это, в частности, SOS1."},{"id":"S3-T45","term":"GAP","section":2,"def":"Белок, активирующий ГТФазу: ускоряет гидролиз связанного GTP на несколько порядков, внося в активный центр каталитический остаток. Для RAS это NF1, p120GAP и другие."},{"id":"S3-T46","term":"SOS1","section":2,"def":"Фактор обмена (GEF) для RAS; привлекается к мембране адаптером GRB2 после активации рецептора. Ускоряет обмен GDP на GTP."},{"id":"S3-T47","term":"GRB2","section":2,"def":"Адаптерный белок без ферментативной активности: доменом SH2 связывается с фосфотирозином рецептора, доменом SH3 — с SOS1 и тем самым привлекает SOS1 к мембране."},{"id":"S3-T48","term":"нейрофибромин (NF1)","section":2,"def":"GAP для RAS; вносит в активный центр каталитический аргинин. Потеря функции (нейрофиброматоз 1 типа) замедляет гидролиз GTP и удлиняет время жизни RAS-GTP."},{"id":"S3-T49","term":"p120GAP (RASA1)","section":2,"def":"Ещё один GAP для RAS; действует по тому же механизму «аргининового пальца». Вместе с NF1 определяет суммарную скорость инактивации RAS."},{"id":"S3-T50","term":"аргининовый палец","section":2,"def":"Каталитический аргинин, который GAP вносит в активный центр ГТФазы; стабилизирует переходное состояние реакции гидролиза GTP."},{"id":"S3-T51","term":"эффекторы RAS","section":2,"def":"Белки, которые активный RAS (GTP-форма) привлекает к мембране и активирует. Три основные группы — RAF, PI3K класса I и RALGDS."},{"id":"S3-T52","term":"RAF","section":2,"def":"Протеинкиназа — эффектор RAS; связывается с RAS-GTP и запускает каскад RAF → MEK → ERK (семинар 4)."},{"id":"S3-T53","term":"PI3K (класс I)","section":2,"def":"Фосфоинозитид-3-киназа — эффектор RAS; катализирует образование липида PIP₃ и запускает путь AKT."},{"id":"S3-T54","term":"RALGDS","section":2,"def":"Эффектор RAS; сам является фактором обмена (GEF) для ГТФаз семейства Ral."},{"id":"S3-T55","term":"онкогенные варианты RAS","section":2,"def":"Соматические замены в кодонах 12, 13 и 61, ослабляющие гидролиз GTP и/или чувствительность к GAP в разной степени и смещающие цикл к активной форме."},{"id":"S3-T56","term":"KRAS G12C","section":2,"def":"Онкогенный вариант KRAS (глицин 12 → цистеин): почти нечувствителен к GAP, но сохраняет собственный гидролиз и продолжает переходить между GDP- и GTP-формами. Мишень ковалентных ингибиторов."},{"id":"S3-T57","term":"соторасиб","section":2,"def":"Ингибитор KRAS G12C (AMG 510), ковалентно связывающийся с цистеином-12 в GDP-форме и удерживающий белок в неактивном состоянии; первый препарат этого класса, применяемый в клинике."},{"id":"S3-T58","term":"BI-3406","section":2,"def":"Исследовательский ингибитор SOS1: препятствует ускорению обмена GDP на GTP в RAS и тем самым ослабляет активацию RAS."},{"id":"S3-T59","term":"RBD pull-down","section":2,"def":"Метод измерения активного RAS: RBD-домен RAF на гранулах связывает только GTP-форму; осаждённый RAS выявляют в блоте, общий RAS служит контролем загрузки."},{"id":"S3-T60","term":"депо-зависимый вход Ca²⁺ (SOCE)","section":3,"def":"Вход Ca²⁺ из внеклеточной среды через каналы плазматической мембраны, открывание которых вызвано не связыванием лиганда и не изменением мембранного потенциала, а снижением концентрации Ca²⁺ в эндоплазматическом ретикулуме."},{"id":"S3-T61","term":"STIM1","section":3,"def":"Белок мембраны ЭПР и сенсор Ca²⁺ в депо. Каждая субъединица пересекает мембрану одной трансмембранной спиралью: домены EF-hand и SAM обращены в просвет ЭПР, цитозольная часть — в цитозоль. При опустошении депо STIM1 распрямляется и собирается в кластеры у контактов ЭПР с плазматической мембраной, где открывает Orai1."},{"id":"S3-T62","term":"Orai1","section":3,"def":"Канал плазматической мембраны, обладающий высокой избирательностью к Ca²⁺ и малой проводимостью; его открывают кластеры STIM1. Замена R91W почти полностью устраняет проведение Ca²⁺ и вызывает иммунодефицит."},{"id":"S3-T63","term":"EF-hand","section":3,"def":"Домен STIM1 в просвете ЭПР, связывающий Ca²⁺ с умеренным сродством (Kd около 200–600 мкМ). Диссоциация Ca²⁺ от этого домена при опустошении депо переводит STIM1 в активную форму."},{"id":"S3-T64","term":"кластер STIM1","section":3,"def":"Скопление распрямлённых молекул STIM1 у контакта ЭПР с плазматической мембраной; доля STIM1 в кластерах резко меняется при изменении концентрации Ca²⁺ в ЭПР."},{"id":"S3-T65","term":"контакт ЭПР–ПМ","section":3,"def":"Участок, где расстояние между мембраной ЭПР и плазматической мембраной составляет 10–25 нм. Такой зазор достаточно мал, чтобы цитозольная часть STIM1 достигала Orai1; при этом мембраны не сливаются."},{"id":"S3-T66","term":"ток CRAC (ICRAC)","section":3,"def":"Ca²⁺-ток через Orai1, активируемый опустошением депо: высокоизбирательн
