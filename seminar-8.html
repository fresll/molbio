/* =====================================================================
   Общая модель клетки для семинара 8 (все четыре вопроса используют этот файл).
   Величины относительные («учебная модель»); связи — стехиометрия, а не подгонка.
   Вопрос 1: распределение потока глюкозы, NADH цитоплазмы и матрикса, дыхание, деление.
   Порт model_q1.py; сверен с Python по сетке (test_model.mjs).
   ===================================================================== */
const CM = {
  LEAK: .15,        /* утечка протонов: ≈ четверть дыхания делящейся клетки (доля зависит от клеток: Brand & Nicholls 2011) */
  V_SHUTTLE: .60,   /* предел челноков NADH (идея Wang 2022: насыщение при высоком потоке гликолиза) */
  K_NADH: .15,      /* полунасыщение челноков, LbNOX и ЛДГ по NADH цитоплазмы */
  PDH_BASE: .27,    /* ёмкость входа пирувата в митохондрии (PDH под тормозом PDK) */
  LDH_MAX: 1.0,     /* ёмкость ЛДГ */
  LDH_RESID: .45,   /* остаток ЛДГ с ингибитором: оксамат 50 мМ даёт 51–57 % (Seliger 2013) */
  NOX_V: .20,       /* ёмкость LbNOX при умеренной экспрессии */
  PYR_ACC: .20,     /* ёмкость акцептора, когда в среде есть пируват (ЛДГ в обратную сторону) */
  K_GAPDH: .05,     /* GAPDH тормозится, когда NAD⁺ мало */
  RHO_K: 69,        /* лактат/пируват = RHO_K·x/(1−x): ЛДГ близка к равновесию */
  OTHER_V: .04,     /* прочие реакции, потребляющие NADH цитоплазмы */
  E_PYR: 5,         /* NADH-эквивалентов от одного пирувата: PDH 1 + ЦТК 3 NADH + 1 FADH₂ */
  KAPPA: 1.4,       /* насколько ёмкость цепи разгружает матрикс */
  J_MAX: 4,         /* шкала ёмкости цепи */
  S_OTH_MAX: 2.4,   /* электроны от других топлив (глутамин, жирные кислоты) при полной загрузке */
  DCA_MULT: [1, 1.8, 3],   /* ёмкость PDH: нет / доза / максимум (мысленный опыт) */
  FLUX_FULL: 1.25,  /* шкала потоков на экране: 100 % полосы = 1,25 условной единицы */
  ATP_SCALE: 16,    /* перевод «спроса» в единицы ATP */
  ATP_PER_E: 2.5,   /* ATP на NADH-эквивалент цепи (Hinkle 2005) */
  PASTEUR: .6,      /* во сколько раз дефицит ATP ускоряет гликолиз */
  ASP_CYT: .70,     /* предел синтеза аспартата цитоплазматическим путём MDH1–GOT1 (условно; почти полное восстановление деления — Sullivan 2015; Birsoy 2015) */
  X_ASP_ON: .26, X_ASP_OFF: .32,   /* доля NADH цитоплазмы: путь MDH1–GOT1 полностью доступен ниже 0,26 и закрыт выше 0,32 (условно) */
  PYR_SAT: .25      /* пируват из среды повышает насыщение ЛДГ субстратом: ёмкость ×1,25 (условно) */
};

/* Баланс NADH цитоплазмы: производится столько, сколько окисляется. Решаем для доли NADH (x) делением пополам. */
function cellInner(glc_cap, pdh_eff, v_sh, nox_v, ldh_cap, acc_v){
  const parts = x => {
    const g = glc_cap * (1 - x) / (1 - x + CM.K_GAPDH);
    const mito = Math.min(pdh_eff, g), out = g - mito, sat = x / (x + CM.K_NADH);
    const sh = Math.min(v_sh * sat, g), nx = nox_v * sat, ot = CM.OTHER_V * sat;
    const rho = CM.RHO_K * x / Math.max(1e-9, 1 - x), share = rho / (1 + rho);
    /* ЛДГ одна: пируват гликолиза и пируват из среды делят общую ёмкость (аудит Q1, M06) */
    const lacD = out * share, acD = acc_v * sat, capL = ldh_cap * x / (x + CM.K_NADH) * (acc_v > 0 ? 1 + CM.PYR_SAT : 1), kL = Math.min(1, capL / Math.max(1e-12, lacD + acD));
    const lac = lacD * kL, ac = acD * kL;
    return { g, mito, out, sh, nx, ac, lac, ot };
  };
  const F = x => { const q = parts(x); return q.g - q.sh - q.nx - q.ac - q.lac - q.ot; };
  let lo = 1e-4, hi = 1 - 1e-4;
  for (let i = 0; i < 60; i++){ const mid = .5 * (lo + hi); if (F(mid) > 0) lo = mid; else hi = mid; }
  const x = .5 * (lo + hi);
  return Object.assign({ x }, parts(x));
}

/* p: o2 (доступность 0..1), grow (сигнал к делению 0..1), atp (расход ATP 0..1),
   oligo, fccp, pier, ldhi, lbnox, pyr, asp (булевы), dca (0 нет · 1 доза · 2 максимум) */
function cellModel(p){
  const o2 = p.o2, grow = p.grow, atpUse = p.atp || 0, dcaI = p.dca | 0;
  const hif = (1 - o2) * .75;
  const glc0 = (.15 + .57 * grow + .28 * hif) * (p.fccp ? .85 : 1);
  const demand = .20 + .25 * grow + atpUse;
  const drain = CM.LEAK + (p.oligo ? 0 : demand) + (p.fccp ? 1.5 : 0);
  const cI = p.pier ? .08 : 1;
  const C = CM.J_MAX * o2 * cI * Math.min(1, drain);
  const ldh_cap = CM.LDH_MAX * (p.ldhi ? CM.LDH_RESID : 1);
  const nox_v = p.lbnox ? CM.NOX_V : 0, acc_v = p.pyr ? CM.PYR_ACC : 0;
  const pdh0 = CM.PDH_BASE * (.25 + .75 * o2) * CM.DCA_MULT[dcaI];
  const cpl = p.oligo ? 0 : (p.fccp ? .3 : 1);
  let n = .3, lim = 1, atp = 1, q, S_glc, S_oth, S;
  for (let it = 0; it < 500; it++){
    const accept = 1 - n, fa = .25 + .75 * Math.min(1, accept / .8);
    const glc_cap = glc0 * (1 + CM.PASTEUR * (1 - atp));
    q = cellInner(glc_cap, pdh0 * fa * lim, CM.V_SHUTTLE * Math.min(1, accept / .70) * lim, nox_v, ldh_cap, acc_v);
    S_glc = CM.E_PYR * q.mito + q.sh;
    S_oth = Math.min(CM.S_OTH_MAX * fa, Math.max(0, C - S_glc));
    S = S_glc + S_oth;
    const S_pot = S_glc / Math.max(lim, .02);
    const n_new = S_pot / (S_pot + CM.KAPPA * C + 1e-9);
    const lim_new = Math.min(1, lim * C / Math.max(S_glc, 1e-9));
    const atp_new = Math.min(1, (q.g + CM.ATP_PER_E * S * cpl) / (CM.ATP_SCALE * demand));
    n += .3 * (n_new - n); lim += .3 * (Math.max(.02, lim_new) - lim); atp += .3 * (atp_new - atp);
  }
  const accept = 1 - n, lac_tot = q.lac + q.ac, pyr_net = q.g - q.mito - lac_tot, pyr_out = Math.max(0, pyr_net);
  let asp = (.05 + .95 * accept * (.25 + .75 * Math.min(1, q.mito / .24))) * (p.aspMul ?? 1);   /* aspMul — множитель из вопроса 2 (обеспеченность аспартата по уровню малата/ОАА); по умолчанию 1: числа вопроса 1 не меняются */
  /* цитоплазматический путь MDH1 → GOT1 (Birsoy 2015): MDH1 окисляет малат до ОАА, если в цитоплазме достаточно NAD⁺ (доля NADH x ниже порога).
     Путь учитывается, когда в цитоплазме есть дополнительный акцептор электронов (пируват из среды или LbNOX); его вклад — по доле NADH x, одно правило для обоих (аудит Q1, M01). Матриксный путь — выше (accept). */
  const asp_cyt = (acc_v > 0 || nox_v > 0) ? CM.ASP_CYT * clamp((CM.X_ASP_OFF - q.x) / (CM.X_ASP_OFF - CM.X_ASP_ON)) : 0;
  asp = Math.max(asp, asp_cyt);
  if (p.asp) asp = Math.max(asp, .60);     /* допущение: аспартат в среде; частичное восстановление (Birsoy 2015, клетки Jurkat) */
  const need = .20 + .40 * grow;
  const redox_c = 1 - .6 * Math.max(0, q.x - .5) / .5;
  const prolif = (.1 + .9 * grow) * Math.min(asp / .70, q.g / need, atp / .15, redox_c);
  return { glc: q.g, lac: lac_tot, pyr_out, pyr_net, lac_glc: q.lac, mito: q.mito, ocr: Math.min(1, S / CM.J_MAX),
    nadh_c: q.x, nadh_m: n, asp: Math.min(1, asp), atp, prolif: Math.min(1, prolif), shuttle: q.sh, nox: q.nx, acc: q.ac,
    redox_c, S, C, S_glc, hif, demand, cpl, drain, leak: CM.LEAK + (p.fccp ? 1.5 : 0), atp_ch: CM.ATP_PER_E * S * cpl };
}

const GFORM = {};   /* справка: ключ карточки -> список ключей структурных формул (formulas.js); заполняют сцены */

/* кислород: на шкале ползунка — парциальное давление; доступность p/(p + 0,5 %), нормирована на 21 % */
const O2_MIN = .1, O2_MAX = 21, O2_K = .5;
function o2Pressure(u){ return O2_MIN * Math.pow(O2_MAX / O2_MIN, u); }            /* u 0..1 → % O₂ */
function o2Avail(pp){ return (pp / (pp + O2_K)) / (O2_MAX / (O2_MAX + O2_K)); }   /* % O₂ → 0..1 */
function o2FromAvail(a){ const k = a * (O2_MAX / (O2_MAX + O2_K)); return O2_K * k / (1 - k); }   /* обратная */
/* контроль: то же состояние клетки без препаратов и добавок в среде */
function cellControl(p){ return cellModel({ o2: p.o2, grow: p.grow, atp: p.atp }); }


/* =====================================================================
   Вопрос 2. Цикл трикарбоновых кислот: четыре пула (цитрат, α-КГ, сукцинат, малат/ОАА), приток (GLS, ПК), оттоки (цитрат, глутамат, аспартат, гем, малат),
   восстановительное карбоксилирование, мечение ¹³C. Единицы потока — те же, что в вопросе 1; 1,00 = эталонная делящаяся клетка (2 мМ глутамина).
   Баланс решается для пула малата/ОАА (деление пополам); остальные пулы — из линейных балансов. Порт proto/cycle2.mjs.
   ===================================================================== */
const CQ = {
  A_OTH: .025,     /* ацетил-CoA из прочих источников (не из PDH), поток */
  KO: .5,          /* насыщение цитратсинтазы по ОАА */
  KPC: .15, PC_CAP: 6,   /* ПК: усиление при низком уровне малата/ОАА, не более чем в 6 раз */
  RET: .5,         /* доля экспортированного цитрата, возвращающая ОАА (ACLY) */
  KG: .5,          /* условное Km глутаминазы по глутамину, мМ */
  CX: .045, GX: .035, AX: .060, MX: .045, HX: .005, SX: .0015,   /* оттоки: цитрат, глутамат, аспартат, малат (m³), гем, прочее от сукцината */
  KRED: .12,       /* восстановительное карбоксилирование ∝ (NADH матрикса − 0,5)/0,5 */
  ACC_REF: 1 - .321, KA: .2,
  RES: .1,         /* остаточная активность при ингибировании GLS и нокдауне ПК (условно) */
  PHI_P: .85, PHI_G: 1   /* доля меченого пирувата при ¹³C-глюкозе; меченого глутамина при ¹³C-глутамине */
};
const CQ_CELLS = { A: { G: .150, PC: .019 }, B: { G: .060, PC: .109 } };   /* линии: GLS и ПК; сумма анаплероза одинакова */
const CQ_BASE = { o2: 1, grow: .8, atp: 0 };
const cqFa = acc => .25 + .75 * Math.min(1, acc / .8);
const cqHa = m => m * (1 + CQ.KA) / (m + CQ.KA);

/* base — результат cellModel для того же состояния (нужны mito и nadh_m); p: cell 'A'|'B', gln (мМ), cat (отток на синтез, 1 = эталон), glsi, pcKD, sdh */
function cycleModel(base, p){
  p = p || {};
  const cellT = CQ_CELLS[p.cell || 'A'];
  const accept = 1 - base.nadh_m, f = cqFa(accept) / cqFa(CQ.ACC_REF);
  const a = base.mito + CQ.A_OTH, aRef = .239 + CQ.A_OTH;
  const dem = p.cat ?? 1, gl = p.gln ?? 2;
  const vgls = cellT.G * (gl / (gl + CQ.KG)) / (2 / (2 + CQ.KG)) * (p.glsi ? CQ.RES : 1);
  const pcm = p.pcKD ? CQ.RES : 1, sdhAlive = p.sdh ? 0 : 1;
  const r = Math.max(0, (base.nadh_m - .5) / .5);
  const vcsR = aRef, vidhR = vcsR - CQ.CX, vkgR = vidhR + cellT.G - CQ.GX, vsdhR = vkgR - CQ.HX - CQ.SX;
  const K = { idh: vidhR, kg: vkgR, sdh: vsdhR };
  const psi = m => m * (1 + CQ.KO) / (m + CQ.KO);
  const pcRef = cellT.PC, vpcFn = m => Math.min(CQ.PC_CAP * pcRef, pcRef * pcm * (1 + CQ.KPC) / (CQ.KPC + m));
  const solve = m => {
    const vcs = a * psi(m), vpc = vpcFn(m), kRed = CQ.KRED * r;
    const dC = K.idh * f + CQ.CX * dem, dA = kRed + K.kg * f + CQ.GX * dem, dS = K.sdh * sdhAlive + CQ.HX + CQ.SX;
    const al = (K.idh * f * vcs / dC + vgls) / (dA - K.idh * f * kRed / dC);
    const c = (vcs + kRed * al) / dC, s = K.kg * f * al / dS;
    return { vcs, vpc, c, al, s, kRed };
  };
  const nadf = accept / CQ.ACC_REF;
  const F = m => { const q = solve(m); return q.vcs + CQ.AX * dem * nadf * cqHa(m) + CQ.MX * m * m * m - K.sdh * sdhAlive * q.s - q.vpc - CQ.RET * CQ.CX * dem * q.c; };
  let lo = 1e-4, hi = 8; for (let i = 0; i < 80; i++){ const mid = .5 * (lo + hi); if (F(mid) > 0) hi = mid; else lo = mid; }
  const m = .5 * (lo + hi), q = solve(m);
  const fl = { cs: q.vcs, idh: K.idh * f * q.c, kgdh: K.kg * f * q.al, sdh: K.sdh * sdhAlive * q.s, pc: q.vpc, gls: vgls, red: q.kRed * q.al,
    cit_x: CQ.CX * dem * q.c, glu_x: CQ.GX * dem * q.al, asp_x: CQ.AX * dem * nadf * cqHa(m), me_x: CQ.MX * m * m * m, heme: CQ.HX * q.s, suc_x: CQ.SX * q.s,
    ret: CQ.RET * CQ.CX * dem * q.c, pdh: base.mito };
  const lev = { cit: q.c, akg: q.al, suc: q.s, mal: m };
  const mdh = Math.max(0, fl.sdh - fl.me_x);   /* чистый поток MДГ (малат → ОАА) = поток SDH − выход малата на малатный фермент */
  return { fl, lev, mdh, elec: fl.idh + fl.kgdh + fl.sdh + mdh, nadh_n: fl.idh + fl.kgdh + mdh, fad_n: fl.sdh };
}
/* всё вместе: цикл + деление по формуле вопроса 1 через обеспеченность аспартата; эталон — тот же базовый режим без вмешательств цикла */
function cycleFull(inp){
  const bp = { o2: 1, grow: .8, atp: 0, pier: !!inp.pier };
  const base = cellModel(bp);
  const o = cycleModel(base, inp), e0 = cycleModel(base, { cell: inp.cell });
  const satA = cqHa(o.lev.mal) / cqHa(e0.lev.mal);
  const cm = cellModel({ ...bp, aspMul: satA });
  return { o, e0, base, satA, cm, div: cm.prolif, asp: cm.asp };
}

/* ¹³C: стационарное распределение изотопомеров по положениям атомов (цитрат 64, α-КГ 32, сукцинат 16, малат/ОАА 16 состояний) */
const popc = x => { let n = 0; while (x){ n += x & 1; x >>= 1; } return n; };
const bitOf = (x, i) => (x >> i) & 1;
function isoModel(o, tracer){
  const fl = o.fl, phiP = CQ.PHI_P, phiG = CQ.PHI_G;
  const PYR = new Float64Array(8), GLN = new Float64Array(32);
  if (tracer === 'glc'){ PYR[7] = phiP; PYR[0] = 1 - phiP; } else PYR[0] = 1;
  if (tracer === 'gln'){ GLN[31] = phiG; GLN[0] = 1 - phiG; } else GLN[0] = 1;
  const AC = new Float64Array(4); const aT = fl.pdh + CQ.A_OTH;
  for (let s = 0; s < 8; s++) AC[bitOf(s, 1) | (bitOf(s, 2) << 1)] += PYR[s] * fl.pdh / aT;
  AC[0] += CQ.A_OTH / aT;
  let CIT = new Float64Array(64), AKG = new Float64Array(32), SUC = new Float64Array(16), MAL = new Float64Array(16);
  CIT[0] = AKG[0] = SUC[0] = MAL[0] = 1;
  const norm = v => { let s = 0; for (const x of v) s += x; if (s > 0) for (let i = 0; i < v.length; i++) v[i] /= s; return v; };
  for (let it = 0; it < 4000; it++){
    const nC = new Float64Array(64);
    for (let m = 0; m < 16; m++) if (MAL[m]) for (let ac = 0; ac < 4; ac++) if (AC[ac]) nC[m | (ac << 4)] += fl.cs * MAL[m] * AC[ac];
    for (let k = 0; k < 32; k++) if (AKG[k]){
      const s = (bitOf(k, 2) << 1) | (bitOf(k, 1) << 2) | (bitOf(k, 0) << 3) | (bitOf(k, 4) << 4) | (bitOf(k, 3) << 5); nC[s] += fl.red * AKG[k]; }
    CIT = norm(nC);
    const nA = new Float64Array(32);
    for (let c = 0; c < 64; c++) if (CIT[c]){ const k = bitOf(c, 3) | (bitOf(c, 2) << 1) | (bitOf(c, 1) << 2) | (bitOf(c, 5) << 3) | (bitOf(c, 4) << 4); nA[k] += fl.idh * CIT[c]; }
    for (let k = 0; k < 32; k++) nA[k] += fl.gls * GLN[k];
    AKG = norm(nA);
    const nS = new Float64Array(16);
    for (let k = 0; k < 32; k++) if (AKG[k]) nS[k >> 1] += AKG[k];
    SUC = norm(nS);
    const nM = new Float64Array(16);
    for (let s = 0; s < 16; s++) if (SUC[s]){ const rev = bitOf(s, 3) | (bitOf(s, 2) << 1) | (bitOf(s, 1) << 2) | (bitOf(s, 0) << 3); nM[s] += .5 * fl.sdh * SUC[s]; nM[rev] += .5 * fl.sdh * SUC[s]; }
    for (let s = 0; s < 8; s++) if (PYR[s]) nM[s] += fl.pc * PYR[s];
    for (let c = 0; c < 64; c++) if (CIT[c]) nM[c & 15] += fl.ret * CIT[c];
    MAL = norm(nM);
  }
  const mdv = (v, n) => { const o2 = new Array(n + 1).fill(0); for (let s = 0; s < v.length; s++) o2[popc(s)] += v[s]; return o2; };
  const ACc = [0, 0, 0]; for (let c = 0; c < 64; c++) ACc[bitOf(c, 4) + bitOf(c, 5)] += CIT[c];
  return { cit: mdv(CIT, 6), akg: mdv(AKG, 5), suc: mdv(SUC, 4), mal: mdv(MAL, 4), acc: ACc };
}

/* =====================================================================
   Вопрос 3. Метаболиты и хроматин: ацетил-CoA : CoA → H3K9ac; SAM : SAH → H3K4me3, H3K9me3; α-КГ против сукцината, фумарата и R-2-HG → KDM4, TET, PHD.
   Параметры и их статус (прямой / пересчёт / подогнан / допущение) — Записка_вопрос_3_v0.1/Параметры_и_проверка_модели_вопрос_3.md.
   α-КГ и сукцинат берутся из модели цикла вопроса 2 (глутамин → GLS → α-КГ; потеря SDH). Связь «цитрат цикла → ацетил-CoA ядра» выключена (нет данных).
   Величины относительные: 1,00 = эталонная клетка (глюкоза 10 мМ, метионин 100 мкМ, глутамин 2 мМ).
   ===================================================================== */
const CH = {
  G_REF: 10, KG: 4.6, ACLY: .88, ACSS: .07, OTH: .05, ACLY_KD: .30, ACETATE: 10, IDH_AC: .55,
  KR: 3, C_AC: 3, SIRT: .35, KN: 1, VOR: .05,
  M_REF: 100, KM: 10, SAH_FLOOR: .5, C_K4: 1, C_K9: 1,
  AKG: 60, S0: 50, F0: 30, H2HG: 10000, IDH_AKG: .75, DM: 3, FH_F: 40, FH_S: 3, SDH_F: .5,
  KDM4: { km: 25, s: 160, f: 300, h: 3000 }, TET: { km: 57, s: 107, f: 77, h: 2000 }, PHD: { km: 60, s: 400, f: 65, h: Infinity },
  PHD_ON: .35, MARK_MAX: 2,
  K9_EU: .2, K9_HET: .3,   /* доли сайтов H3K9: участки активного хроматина (Ac) и гетерохроматин (me3); сумма ≤ 1, условно (аудит v1.1, S1) */
  H_FLOOR: .05, TAU_H: .6, TAU_K: 3, TAU_AC: 2, TAU_HMC: 2, TAU_D: 14, D_PERSIST: .25
};
/* пул K9 в популяции: Ac и me3 на одном остатке несовместимы, поэтому доли считаются для разных участков хроматина и в сумме не превышают 1 */
const k9Pool = r => { const ac = CH.K9_EU * r.ac9 / (1 + CH.C_AC), me = CH.K9_HET * r.k9 / (1 + CH.C_K9); return { ac, me, oth: 1 - ac - me }; };
const chAct = (E, a, s, f, h) => a / (a + E.km * (1 + s / E.s + f / E.f + h / E.h));
const CH_Q2REF = cycleFull({ cell: 'A' });
/* p: glc (мМ), met (мкМ), nad (доля эталона), gln (мМ), glsi, geno 'ref'|'idh'|'sdh'|'fh', acly (нокдаун), acetate, dm, vor;
   hn — доля «избытка» 2-HG для кривой времени (1 = мутант без ингибитора, 0 = 2-HG на остаточном уровне) */
function chromRaw(p){
  const geno = p.geno || 'ref', idh = geno === 'idh', hn = idh ? (p.hn ?? 1) : 0;
  const gN = (p.glc / (p.glc + CH.KG)) / (CH.G_REF / (CH.G_REF + CH.KG));
  const idhAc = idh ? 1 - (1 - CH.IDH_AC) * hn : 1;
  const r = (CH.ACLY * gN * (p.acly ? CH.ACLY_KD : 1) + CH.OTH) * idhAc + CH.ACSS * (p.acetate ? CH.ACETATE : 1);
  const hat = (r / (r + CH.KR)) / (1 / (1 + CH.KR));
  const nadS = (p.nad / (p.nad + CH.KN)) / (1 / (1 + CH.KN));
  const rem = (1 - CH.SIRT) * (p.vor ? CH.VOR : 1) + CH.SIRT * nadS;
  const ac9 = (hat / (hat + CH.C_AC * rem)) / (1 / (1 + CH.C_AC));
  const sam = (p.met / (p.met + CH.KM)) / (CH.M_REF / (CH.M_REF + CH.KM)), sah = CH.SAH_FLOOR + (1 - CH.SAH_FLOOR) * sam, m = sam / sah;
  const occ = (w, c) => (w / (w + c)) / (1 / (1 + c));
  const k4 = occ(m * m, CH.C_K4);
  const q2 = cycleFull({ cell: 'A', gln: p.gln ?? 2, glsi: !!p.glsi, sdh: geno === 'sdh' });
  const akgQ = q2.o.lev.akg / CH_Q2REF.o.lev.akg, sucQ = q2.o.lev.suc / CH_Q2REF.o.lev.suc;
  const akgR = akgQ * (idh ? 1 - (1 - CH.IDH_AKG) * hn : 1) * (p.dm && !idh ? CH.DM : 1);
  const sucR = sucQ * (geno === 'fh' ? CH.FH_S : 1), fumR = geno === 'fh' ? CH.FH_F : geno === 'sdh' ? CH.SDH_F : 1;
  const hgR = idh ? CH.H_FLOOR + (1 - CH.H_FLOOR) * hn : 0;            /* в долях исходного уровня при IDH1 R132H */
  const a = CH.AKG * akgR, s = CH.S0 * sucR, f = CH.F0 * fumR, h = CH.H2HG * hgR;
  const rel = E => chAct(E, a, s, f, h) / chAct(E, CH.AKG, CH.S0, CH.F0, 0);
  const kdm4 = rel(CH.KDM4), tet = rel(CH.TET), phd = rel(CH.PHD);
  const k9 = occ(m / kdm4, CH.C_K9);
  return { r, ac9, sam, sah, m, k4, k9, hmc: tet, kdm4, tet, phd, akg: akgR, suc: sucR, fum: fumR, hg: hgR, hgAbs: h, gN, q2, nadS };
}
/* кривая времени: IDH1 R132H, ингибитор мутантной IDH1 с суток 0. Вторая чашка — без ингибитора (исходное состояние). */
function chromTime(p, tmax = 28, dt = .02){
  const h0 = 1, st0 = chromRaw({ ...p, geno: 'idh', hn: 1 });
  let K9 = st0.k9, AC = st0.ac9, HM = st0.hmc, D = 1;
  const out = [{ t: 0, hg: 1, k9: K9, ac9: AC, hmc: HM, D, k4: st0.k4 }];
  for (let i = 1, t = dt; t <= tmax + 1e-9; i++, t = i * dt){
    const hn = Math.exp(-t / CH.TAU_H), tg = chromRaw({ ...p, geno: 'idh', hn });
    K9 += (tg.k9 - K9) * dt / CH.TAU_K; AC += (tg.ac9 - AC) * dt / CH.TAU_AC; HM += (tg.hmc - HM) * dt / CH.TAU_HMC;
    const Dt = CH.D_PERSIST + (1 - CH.D_PERSIST) * hn; D += (Dt - D) * dt / CH.TAU_D;
    if (Math.abs(t * 4 - Math.round(t * 4)) < 1e-6) out.push({ t: +t.toFixed(2), hg: tg.hg, k9: K9, ac9: AC, hmc: HM, D, k4: tg.k4 });
  }
  return out;
}

/* =====================================================================
   Вопрос 4. NADH/NAD⁺ матрикса → образование супероксида → H₂O₂ в матриксе и цитоплазме; пероксиредоксин (восстановлен / дисульфид / переокислен),
   сигнал (окисление PTP1B → p-Akt), повреждение (8-oxoG, перекисное окисление липидов), PARP1 и NAD⁺, PKM2 → NADPH.
   Величины относительные; доля NADH матрикса и действие олигомицина и FCCP — из модели вопроса 1 (cellModel), остальное — допущения (карточка «Что упрощено»).
   ===================================================================== */
const CR = {
  J0: .2, JK: 2.8, KN: .55,               /* супероксид матрикса: J0 + JK·h(NADH матрикса); h — крутая функция (прямой перенос электронов; Murphy 2009) */
  PSI_OLIGO: 1.3, PSI_FCCP: .4,           /* зависимость от протонного потенциала (Korshunov 1997) — условные множители */
  ANT_M: .25, ANT_C: .6,                  /* антимицин A: супероксид комплекса III в матрикс и в межмембранное пространство (Muller 2004) */
  RET: 1.5, DMM: .1,                     /* обратный перенос электронов при реперфузии; диметилмалонат до ишемии снижает накопление сукцината (Chouchani 2014) */
  JC0: .3, NOX: .6, LEAK_C: .15,          /* H₂O₂ цитоплазмы: базальный, NOX при сигнале роста, доля H₂O₂ матрикса, выходящая в цитоплазму */
  KPRX: 10, KT: 10, KOTH: 1, PEG: 20,     /* пероксиредоксин, восстановление тиоредоксином (∝ ёмкости), прочие стоки (GPx, каталаза), ПЭГ-каталаза */
  KH: 1.2, KH_NOSRX: .6,                   /* переокисление Prx (Prx-SO₂H): полунасыщение по H₂O₂, без сульфиредоксина ниже */
  HD: .8, KS: .15,                       /* повреждение: крутая функция H₂O₂; окисление PTP1B (по H₂O₂ цитоплазмы) */
  PKM2: .5, KPK: .1, PK0: .05, PARP: .6            /* окисление PKM2 → пентозофосфатный путь → NADPH (Anastasiou 2011); PARP1 расходует NAD⁺ */
};
const crH = n => Math.pow(n, 4) / (Math.pow(n, 4) + Math.pow(CR.KN, 4));
/* p: n (доля NADH матрикса без препаратов), anti (антиоксидантная ёмкость 0..1, эталон 0,6), gf (сигнал роста → NOX), oligo, fccp, anti_a (антимицин A), peg, nosrx, pkm2cs, olap, rep (реперфузия), dmm */
function redox(p){
  const c0 = cellModel({ o2: 1, grow: .8, atp: 0 }), cd = cellModel({ o2: 1, grow: .8, atp: 0, oligo: p.oligo, fccp: p.fccp });
  let n = clamp(p.n + (cd.nadh_m - c0.nadh_m), .02, .98);
  if (p.anti_a) n = Math.max(n, .85);
  if (p.rep) n = Math.max(n, .7);
  const psi = (p.oligo ? CR.PSI_OLIGO : 1) * (p.fccp ? CR.PSI_FCCP : 1) * (p.anti_a ? .6 : 1);
  const Jm = CR.J0 + CR.JK * crH(n) * psi + (p.anti_a ? CR.ANT_M : 0) + (p.rep ? CR.RET * (p.dmm ? CR.DMM : 1) * (p.fccp ? CR.PSI_FCCP : 1) : 0);
  const solve = (J, A, kx) => {   /* стационарное H₂O₂: образование = сток через Prx + прочие стоки */
    const Kh = p.nosrx ? CR.KH_NOSRX : CR.KH;
    const parts = H => { const hyp = H * H / (H * H + Kh * Kh), red = CR.KT * A * (1 - hyp) / (CR.KT * A + CR.KPRX * H); return { hyp, red, ss: Math.max(0, 1 - hyp - red), rm: H * (CR.KPRX * red + kx) }; };
    let lo = 0, hi = 1e3; for (let i = 0; i < 90; i++){ const m = .5 * (lo + hi); if (parts(m).rm > J) hi = m; else lo = m; }
    const H = .5 * (lo + hi); return Object.assign({ H }, parts(H));
  };
  /* NADPH-зависимая ёмкость: в цитоплазме добавка от окисления PKM2 (поток глюкозы в пентозофосфатный путь); у PKM2 C358S её нет */
  const A0 = clamp(p.anti ?? .6, .02, 1);
  const m = solve(Jm, A0, CR.KOTH);
  const Jc = CR.JC0 + (p.gf ? CR.NOX : 0) + (p.anti_a ? CR.ANT_C : 0) + CR.LEAK_C * Jm;
  let pk = 0, c;
  for (let it = 0; it < 30; it++){ const A = clamp(A0 * (1 + (p.pkm2cs ? 0 : pk)), .02, 1.5); c = solve(Jc, A, CR.KOTH * (p.peg ? CR.PEG : 1)); const e = Math.max(0, c.H - CR.PK0); pk = CR.PKM2 * e / (e + CR.KPK); }
  const dmg = H => { const x = Math.pow(H / CR.HD, 3); return x / (1 + x); };
  const dam = Math.max(dmg(c.H), dmg(m.H));
  const ptp = c.H / (c.H + CR.KS);
  const nad = 1 - CR.PARP * clamp((dam - .1) / .8) * (p.olap ? .05 : 1);
  /* p-Akt: сигнал роста активирует PI3K–Akt; H₂O₂ усиливает его, окисляя PTP1B и PTEN (Lee 1998; Meng 2002); без сигнала роста — базальный уровень */
  const pakt = p.gf ? clamp(.35 + .45 * ptp / .40) : clamp(.12 + .08 * ptp / .19);
  return { n, Jm, Jc, Hm: m.H, Hc: c.H, prxM: m, prxC: c, dam, ptp, pakt, pk: p.pkm2cs ? 0 : pk, nad, nadph: clamp(A0 * (1 + (p.pkm2cs ? 0 : pk)) * c.red / .95) };
}

    setBoxState(P + 'pdh', m.mito > .03 ? 'on' : null);
    setBoxState(P + 'pdk', inp.dca > 0 ? 'inh' : 'on');
    setBoxState(P + 'shut', m.shuttle > .02 ? 'on' : null);
    setBoxState(P + 'cI', inp.pier ? 'inh' : (m.ocr > .03 ? 'on' : null));
    setBoxState(P + 'c34', m.ocr > .03 ? 'on' : null);
    setBoxState(P + 'atps', inp.oligo ? 'inh' : (m.atp_ch > .1 ? 'on' : null));
    $(P + 'poolD').setAttribute('width', Math.max(2, 126 * m.nadh_c).toFixed(1));
    $(P + 'poolM').setAttribute('width', Math.max(2, 170 * m.nadh_m).toFixed(1));
    const w = (id, v) => { const e = $(id); e.style.strokeWidth = (1.5 + 3.7 * clamp(v)).toFixed(2); setEdge(id, v > .03); };
    w(P + 'eNC', m.ocr); w(P + 'eC', m.ocr); w(P + 'eO2', m.ocr); w(P + 'eATP', m.atp_ch / (CM.ATP_PER_E * CM.J_MAX));
    w(P + 'eLeak', m.leak / Math.max(m.drain, .05) * .8); w(P + 'eAsp', m.asp);
    $(P + 'ePDK').style.opacity = inp.dca > 0 ? .16 : 1;
    if (adv){
      const vis = (id, on) => { setOp(id, on ? 1 : 0); const e = $(id); if (e) e.style.pointerEvents = on ? 'auto' : 'none'; };
      vis(P + 'dOligo', inp.oligo); vis(P + 'dPier', inp.pier); vis(P + 'dFccp', inp.fccp); vis(P + 'dDca', inp.dca > 0); setOp(P + 'eDCA', inp.dca > 0 ? 1 : 0);
      vis(P + 'dOxa', inp.ldhi); vis(P + 'noxg', inp.lbnox); setOp(P + 'dPyr', inp.pyr ? 1 : 0); setOp(P + 'dAsp', inp.asp ? 1 : 0);
    }
    const nad = m.lac_glc + m.acc;
    dotsSet(F, 'glc', m.glc); dotsSet(F, 'pm', m.mito); dotsSet(F, 'pl', m.lac_glc); dotsSet(F, 'lx', m.lac); dotsSet(F, 'px', m.pyr_out); dotsSet(F, 'pi', pin);
    dotsSet(F, 'g1', m.glc); dotsSet(F, 'g2', m.glc); dotsSet(F, 'l1', nad); dotsSet(F, 'l2', nad); dotsSet(F, 's1', m.shuttle); dotsSet(F, 's2', m.shuttle);
    dotsPlace(F);
  }

  /* ---- показатели ---- */
  const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
  const nd = v => fmt(v, 2);

  /* ---- подпись по состоянию: те же переменные и пороги, что и у показателей ---- */
  /* сравнение с контролем по тем же числам, что на полосах: перечисляются только показатели, ушедшие от контроля больше чем на 4 % шкалы */
  const pyx = m => fl(Math.max(0, m.pyr_net));         /* выход пирувата: полоса «Выход пирувата» (при пирувате в среде полоса показывает «из среды» и 0) */
  const CMP = [['glc', m => fl(m.glc)], ['lac', m => fl(m.lac)], ['pyx', pyx], ['mito', m => fl(m.mito)], ['o2', m => m.ocr], ['atp', m => m.atp],
    ['nc', m => m.nadh_c], ['nm', m => m.nadh_m], ['asp', m => m.asp], ['div', m => m.prolif]];
  function cmpText(m, c){
    const ch = [], same = [];
    CMP.forEach(([k, f]) => { const d = f(m) - f(c); if (d > .04) ch.push(t('cmpn_' + k) + ' ' + t('cmp_up')); else if (d < -.04) ch.push(t('cmpn_' + k) + ' ' + t('cmp_dn')); else same.push(k); });
    if (!ch.length) return t('s1a_cmp_none');
    return t('s1a_cmp', { list: ch.join('; ') }) + (same.length ? ' ' + t('s1a_cmp_rest') : '');
  }
  /* подпись базовых состояний: условия — по тем же величинам, что на полосах; «покой при 21 % O₂» (REST) — серая метка на полосах */
  /* оксамат: действие видно на полосах, если лактат или NADH цитоплазмы ушли от контроля больше чем на 4 % шкалы (как в cmpText) */
  const oxaSeen = (m, c) => Math.abs(fl(c.lac) - fl(m.lac)) > .04 || Math.abs(m.nadh_c - c.nadh_c) > .04 || pyx(m) - pyx(c) > .04;
  function baseKey(m, inp){
    const grow = inp.grow >= .3, low = inp.o2 < .8, fast = m.glc > REST.glc * 1.1, nmUp = m.nadh_m > REST.nadh_m + .05;
    if (fl(m.lac) < .03 && fl(m.pyr_out) < .03) return (inp.atp || 0) > .3 ? 's1_c_work' : 's1_c_quiet';
    if (!grow && low && fast && m.ocr < REST.ocr * .95 && nmUp) return 's1_c_hypox';
    if (grow && !low && fast && m.ocr >= REST.ocr * .95) return 's1_c_growth';
    if (grow && low && fast && nmUp) return 's1_c_both';
    return 's1_c_mid';
  }

  /* ===================== 1b: базовый уровень ===================== */
  (function(){
    const K = '1b', P = 's1b_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, false);
    SLIDER_FMT[P + 'o2'] = o2txt;
    $('ctrl' + K).innerHTML = sliderHTML(P + 'o2', 's1_o2', 100) + sliderHTML(P + 'gr', 's1_gr', 0) + REFROW(['branch']) + `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s1_how')}</button><button class="btn ghost" id="${P}lim">${t('s1_lim')}</button></div>`;
    $('take' + K).textContent = t('s1b_take');
    const F = dotsInit(K);
    const inputs = () => { const u = sv(P + 'o2'), grow = sv(P + 'gr'); return { u, grow, o2: o2Avail(o2Pressure(u)), dca: 0 }; };
    function update(){
      const inp = inputs(), m = cellModel({ o2: inp.o2, grow: inp.grow });
      paint(K, m, inp, false, F);
      $('reads' + K).innerHTML = `<div class="mgrid">` +
        mm(t('s1_r_glc'), fl(m.glc), fl(REST.glc), pc(m.glc) + ' %') + mm(t('s1_r_lac'), fl(m.lac), fl(REST.lac), pc(m.lac) + ' %') +
        mm(t('s1_r_pyrx'), pyx(m), pyx(REST), pc(m.pyr_out) + ' %') + mm(t('s1_r_mito'), fl(m.mito), fl(REST.mito), pc(m.mito) + ' %') +
        mm(t('s1_r_o2'), m.ocr, REST.ocr, pct(m.ocr) + ' %') + mm(t('s1_r_div'), m.prolif, REST.prolif, pct(m.prolif) + ' %') + `</div><p class="hint">${t('s1b_ref')}</p>`;
      setCap(K, baseKey(m, inp));
    }
    wire([P + 'o2', P + 'gr'], update);
    $(P + 'reset').onclick = () => { setSlider(P + 'o2', 1); setSlider(P + 'gr', 0); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'measure'); $(P + 'lim').onclick = () => showInfo(K, 'model');
    const set = (u, g) => { setSlider(P + 'o2', u); setSlider(P + 'gr', g); };
    SCENES[K] = { update, tick: dt => dotsTick(F, dt), redraw: () => dotsPlace(F), decor: true, poe: [
      { n: 3, ok: 0, pre(){ set(1, 1); }, apply(){ set(1, 0); }, m: ['s1_r_lac', 's1_r_mito', 's1_r_o2'] },
      { n: 3, ok: 0, pre(){ set(1, 0); }, apply(){ set(U02, 0); }, m: ['s1_r_lac', 's1_r_o2', 's1_r_glc'] },
      { n: 3, ok: 1, pre(){ set(1, 0); }, apply(){ set(1, 1); }, m: ['s1_r_lac', 's1_r_o2', 's1_r_div'] },
    ] };
  })();

  /* ===================== 1a: продвинутый уровень ===================== */
  (function(){
    const K = '1a', P = 's1a_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, true);
    SLIDER_FMT[P + 'o2'] = o2txt;
    const tg = (id, k) => toggleHTML(P + id, k, false);
    $('ctrl' + K).innerHTML = sliderHTML(P + 'o2', 's1_o2', 100) + sliderHTML(P + 'gr', 's1_gr', 80) + sliderHTML(P + 'atp', 's1_atp', 0) +
      `<div class="grp"><span>${t('s1_g_drugs')}</span><div class="tgrid">${tg('oligo', 's1_oligo')}${tg('fccp', 's1_fccp')}${tg('pier', 's1_pier')}${tg('oxa', 's1_oxa')}</div></div>` +
      segHTML(P + 'dca', 's1_dca', [['0', 'dca_0'], ['1', 'dca_1'], ['2', 'dca_2']], '0') +
      `<div class="grp"><span>${t('s1_g_other')}</span><div class="tgrid">${tg('nox', 's1_nox')}${tg('pyr', 's1_pyrm')}${tg('asp', 's1_aspm')}</div></div>` +
      REFROW(['branch']) +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s1_how')}</button><button class="btn ghost" id="${P}lim">${t('s1_lim')}</button></div>`;
    $('reads' + K).innerHTML = `<div id="${P}now"></div>
      <p class="plotcap" style="margin-top:10px">${t('s1_curve_t')}</p><canvas class="plot" id="${P}cv" style="height:170px"></canvas>
      <div class="legend" style="margin-top:2px"><span><i class="sw line" style="background:var(--muted)"></i>${t('s1_curve_ctrl')}</span><span><i class="sw line" style="background:var(--mtor)"></i>${t('s1_curve_now')}</span></div>`;
    $('take' + K).textContent = t('s1a_take');
    const F = dotsInit(K);
    const IDS = ['oligo', 'fccp', 'pier', 'oxa', 'nox', 'pyr', 'asp'];
    const inputs = () => { const u = sv(P + 'o2'), grow = sv(P + 'gr'), atp = sv(P + 'atp');
      return { u, grow, atp, o2: o2Avail(o2Pressure(u)), oligo: $(P + 'oligo').checked, fccp: $(P + 'fccp').checked, pier: $(P + 'pier').checked, ldhi: $(P + 'oxa').checked,
        lbnox: $(P + 'nox').checked, pyr: $(P + 'pyr').checked, asp: $(P + 'asp').checked, dca: +segVal(P + 'dca') }; };
    const run = inp => cellModel({ o2: inp.o2, grow: inp.grow, atp: inp.atp, oligo: inp.oligo, fccp: inp.fccp, pier: inp.pier, ldhi: inp.ldhi, lbnox: inp.lbnox, pyr: inp.pyr, asp: inp.asp, dca: inp.dca });
    const S = { m: null, c: null };
    function curve(){
      const cv = $(P + 'cv'), m = S.m, c = S.c; if (!m || !cv.clientWidth) return;
      const pts = k => [...Array(11).keys()].map(i => [i / 2, k * i / 2]);
      plotLines(cv, [{ data: pts(c.prolif), color: '--muted', dash: [6, 4], w: 2.2 }, { data: pts(m.prolif), color: '--mtor', w: 3 }],
        { xmax: 5, xstep: 1, xunit: t('s1_days'), ymax: 5, yticks: [0, 1, 2, 3, 4, 5], yfmt: v => String(v) });
    }
    function update(){
      const inp = inputs(), m = run(inp), c0 = cellControl(inp), any = IDS.some(i => $(P + i).checked) || inp.dca > 0, c = any ? c0 : REST;
      S.m = m; S.c = c0; paint(K, m, inp, true, F);
      const nPyr = m.pyr_net < -.012 ? t('s1_pyr_in') : pc(m.pyr_out) + ' %';
      $(P + 'now').innerHTML = `<div class="mgrid">` +
        mm(t('s1_r_glc'), fl(m.glc), fl(c.glc), pc(m.glc) + ' %') + mm(t('s1_r_lac'), fl(m.lac), fl(c.lac), pc(m.lac) + ' %') +
        mm(t('s1_r_pyrx'), fl(Math.max(0, m.pyr_net)), fl(Math.max(0, c.pyr_net)), nPyr) + mm(t('s1_r_mito'), fl(m.mito), fl(c.mito), pc(m.mito) + ' %') +
        mm(t('s1_r_o2'), m.ocr, c.ocr, pct(m.ocr) + ' %') + mm(t('s1_r_atp'), m.atp, c.atp, pct(m.atp) + ' %') +
        mm(t('s1_r_nc'), m.nadh_c, c.nadh_c, nd(m.nadh_c)) + mm(t('s1_r_nm'), m.nadh_m, c.nadh_m, nd(m.nadh_m)) +
        mm(t('s1_r_asp'), m.asp, c.asp, pct(m.asp) + ' %') + mm(t('s1_r_div'), m.prolif, c.prolif, pct(m.prolif) + ' %') + `</div><p class="hint">${t(any ? 's1a_ref' : 's1a_ref0')}</p>`;
      curve();
      /* подпись: механизм по тому, что включено (только то, что действительно включено), затем сравнение с контролем по тем же числам, что на полосах */
      const on = IDS.filter(i => $(P + i).checked).concat(inp.dca > 0 ? ['dca' + inp.dca] : []);
      /* пары воздействий, которые разобраны в сценарии, имеют свои подписи; остальные сочетания — общая подпись */
      const PAIRS = { 'pier+pyr': 's1a_c_pier_pyr', 'asp+pier': 's1a_c_pier_asp', 'nox+pier': 's1a_c_pier_nox', 'fccp+oligo': 's1a_c_oligo_fccp' };
      let mech;
      if (!on.length) mech = [baseKey(m, inp)];
      else if (on.length > 1) mech = [(on.length === 2 && PAIRS[on.slice().sort().join('+')]) || 's1a_c_multi'];
      else mech = ['s1a_c_' + on[0]];
      /* второе предложение механизма — только по тому, что видно на полосах (те же пороги, что у cmpText) */
      const sub = [];
      if (on.length === 1 && on[0] === 'oxa'){ sub.push(oxaSeen(m, c) ? 's1a_oxa_act' : 's1a_oxa_flat'); if (pyx(m) - pyx(c) > .04) sub.push('s1a_oxa_pyr'); }
      if (on.length === 1 && (on[0] === 'dca1' || on[0] === 'dca2')) sub.push(fl(m.mito) - fl(c.mito) > .04 ? 's1a_dca_up' : 's1a_dca_flat');
      /* LbNOX и пируват в среде: если на полосах нет сдвигов (те же пороги, что у cmpText), так и сказано */
      if (on.length === 1 && (on[0] === 'nox' || on[0] === 'pyr') && !CMP.some(([k, f]) => Math.abs(f(m) - f(c)) > .04)) sub.push('s1a_' + on[0] + '_flat');
      const NAMES = { oligo: 's1_oligo', fccp: 's1_fccp', pier: 's1_pier', oxa: 's1_oxa', nox: 's1_nox', pyr: 's1_pyrm', asp: 's1_aspm' };
      const list = on.map(i => NAMES[i] ? t(NAMES[i]) : t('drug_dca') + ' — ' + t('dca_' + i.slice(3))).join('; ');
      const parts = mech.concat(sub).map(k => t(k, { list }));
      if (on.length) parts.push(cmpText(m, c));
      $('cap' + K).textContent = parts.join(' ');
      $('why' + K).textContent = t(mech[0] + '_z');
    }
    wire([P + 'o2', P + 'gr', P + 'atp', ...IDS.map(i => P + i), P + 'dca'], update);
    const DEF = { u: 1, gr: .8, atp: 0, oligo: 0, fccp: 0, pier: 0, oxa: 0, nox: 0, pyr: 0, asp: 0, dca: '0' };
    const st = o => { const d = Object.assign({}, DEF, o);
      setSlider(P + 'o2', d.u); setSlider(P + 'gr', d.gr); setSlider(P + 'atp', d.atp);
      IDS.forEach(i => { $(P + i).checked = !!d[i]; }); segSet(P + 'dca', String(d.dca)); };
    $(P + 'reset').onclick = () => { st({}); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'measure'); $(P + 'lim').onclick = () => showInfo(K, 'model');
    SCENES[K] = { update, tick: dt => dotsTick(F, dt), redraw: () => { dotsPlace(F); curve(); }, decor: true, poe: [
      { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ oligo: 1 }); }, m: ['s1_r_o2', 's1_r_lac', 's1_r_nm'] },
      { n: 3, ok: 0, pre(){ st({}); }, apply(){ st({ fccp: 1 }); }, m: ['s1_r_o2', 's1_r_nm', 's1_r_lac'] },
      { n: 3, ok: 1, pre(){ st({ pier: 1 }); }, apply(){ st({ pier: 1, pyr: 1 }); }, m: ['s1_r_div', 's1_r_o2', 's1_r_asp'] },
      { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ dca: '1' }); }, m: ['s1_r_lac', 's1_r_div', 's1_r_mito'] },
      { n: 3, ok: 1, pre(){ st({ dca: '1' }); }, apply(){ st({ dca: '2' }); }, m: ['s1_r_div', 's1_r_lac', 's1_r_mito'] },
      { n: 3, ok: 0, ctl(){ st({ u: 1, gr: 0 }); }, ctlH: 'poe_m_ctl_o2', pre(){ st({ u: U02, gr: 0 }); }, apply(){ st({ u: 1, gr: 0 }); }, m: ['s1_r_lac', 's1_r_o2', 's1_r_glc'] },
      { n: 3, ok: 0, ctl(){ st({ u: 1, gr: 0 }); }, ctlH: 'poe_m_ctl_o2', pre(){ st({ u: U02, gr: 0, pier: 1 }); }, apply(){ st({ u: 1, gr: 0, pier: 1 }); }, m: ['s1_r_o2', 's1_r_lac', 's1_r_div'] },
    ] };
  })();
})();

/* =====================================================================
   Вопрос 2. Цикл трикарбоновых кислот: уровни промежуточных задаёт баланс притока (GLS, ПК) и оттока на синтез (катаплероз)
   2b — базовый: «Отток на синтез» и «Глутамин в среде»
   2a — продвинутый: ингибитор GLS, подавление ПК, потеря SDH, пиерицидин, две линии клеток, метка ¹³C, показатели, сценарии
   Модель — cell.js (cycleFull, isoModel). Схема, показатели, подпись и график изотопологов берут числа из одного расчёта.
   ===================================================================== */
(function(){
  const FQ = .45;                   /* 100 % толщины стрелки потока = 0,45 условной единицы (единицы те же, что в вопросе 1) */
  const LV = 1.5;                   /* шкала полосы уровня и потока: 0…1,5 от эталона; метка эталона — 1,00 */
  const NDOT = 7;
  const REFS = { A: cycleFull({ cell: 'A' }), B: cycleFull({ cell: 'B' }) };   /* эталон каждой линии: ровно те же условия без вмешательств */
  const catOf = v => v <= .5 ? .3 + 1.4 * v : 1 + 2 * (v - .5);      /* ползунок 0…1 → отток 0,3…2 (эталон 1,00 посередине) */
  const glnOf = v => 4 * v;                                          /* ползунок 0…1 → глутамин 0…4 мМ (эталон 2 мМ посередине) */
  const ftx = x => x >= 10 ? fmt(x, 0) : fmt(x, 2);

  /* ---- справка: какие формулы показывать в карточках ---- */
  Object.assign(GFORM, { cit: ['cit'], akg: ['akg'], suc: ['suc'], mal: ['mal', 'oaa'], gln: ['gln'], glu: ['glu'], gls: ['gln', 'glu'], pc: ['pyr', 'oaa'],
    accoa: ['accoa'], glsi: ['tela', 'bptes'], pier: ['pier'], asp: ['asp'] });

  /* ---- показатели: значение, шкала, вид (x — отношение к эталону; a — абсолютная доля, как в вопросе 1) ---- */
  const ITEM = {
    cit: [r => r.o.lev.cit, LV, 'x'], akg: [r => r.o.lev.akg, LV, 'x'], suc: [r => r.o.lev.suc, LV, 'x'], mal: [r => r.o.lev.mal, LV, 'x'],
    gls: [r => r.o.fl.gls, LV, 'x'], pc: [r => r.o.fl.pc, 3, 'x'], cs: [r => r.o.fl.cs, LV, 'x'],
    nadh: [r => r.o.nadh_n, LV, 'x'], fad: [r => r.o.fl.sdh, LV, 'x'], cit_x: [r => r.o.fl.cit_x, LV, 'x'], glu_x: [r => r.o.fl.glu_x, LV, 'x'],
    asp: [r => r.asp, 1, 'a'], div: [r => r.div, 1, 'a']
  };
  function rd(k, r, REF){
    const [f, sc, kind] = ITEM[k], v = f(r), v0 = f(REF);
    if (kind === 'a') return { v, frac: clamp(v), tick: clamp(v0), text: pct(v) + ' %', d: clamp(v) - clamp(v0) };
    const x = v / v0;
    return { v: x, frac: clamp(x / sc), tick: 1 / sc, text: '×' + ftx(x), d: clamp(x / sc) - 1 / sc };
  }
  const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
  const mk = (k, r, REF) => { const q = rd(k, r, REF); return mm(t('s2_r_' + k), q.frac, q.tick, q.text); };
  const SEEN = .04;                  /* показатель «ушёл от эталона», если полоса сместилась больше чем на 4 % шкалы (как в вопросе 1) */
  const CMP_A = ['cit', 'akg', 'suc', 'mal', 'gls', 'pc', 'cs', 'nadh', 'fad', 'cit_x', 'glu_x', 'asp', 'div'];
  const CMP_B = CMP_A.filter(k => k !== 'fad');      /* на базовом уровне полосы FADH₂ нет, в сравнении её тоже нет */
  /* сравнение с эталоном: до двух показателей с наибольшим отклонением (те же полосы, тот же порог 4 % шкалы) */
  function cmpText(r, REF, adv){
    const ch = (adv ? CMP_A : CMP_B).map(k => [k, rd(k, r, REF).d]).filter(x => Math.abs(x[1]) > SEEN).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
    if (!ch.length) return t('s2_cmp_none');
    const top = ch.slice(0, 2).map(([k, d]) => t('s2_cmpn_' + k) + ' ' + t(d > 0 ? 'cmp_up' : 'cmp_dn'));
    return t('s2_cmp', { list: top.join('; ') }) + ' ' + t(ch.length > 2 ? 's2_cmp_more' : 's2_cmp_rest');
  }

  /* ---- какие воздействия заданы (по ним выбирается механизм в подписи) ---- */
  function devsOf(inp){
    const d = [];
    if (inp.gln < .02) d.push('gln0'); else if (inp.gln < 2 - .05) d.push('glnL'); else if (inp.gln > 2 + .05 && !inp.glsi) d.push('glnH');
    if (inp.cat > 1.02) d.push('catH'); else if (inp.cat < .98) d.push('catL');
    if (inp.glsi) d.push('glsi'); if (inp.pcKD) d.push('pckd'); if (inp.sdh) d.push('sdh'); if (inp.pier) d.push('pier');
    return d;
  }
  function classOf(d){
    if (!d.length) return 'ref';

    if (d.includes('pier')) return 'pier';
    const inn = d.some(x => ['gln0', 'glnL', 'glsi', 'pckd'].includes(x)), out = d.some(x => x === 'catH' || x === 'catL');
    return inn && out ? 'mix' : inn ? 'in' : out ? (d.includes('catH') ? 'outH' : 'outL') : 'glnH';
  }

  /* ---- схема ---- */
  const markers = K => `<defs>

  function scheme(K, adv){

  ${adv ? `<g id="${P}redg" class="fade"><path id="${P}eRED" class="edge dash" d="M392 103 C 380 74, 220 74, 208 101" marker-end="url(#fa_${K})"/><g class="clickable" data-g="red"><text class="lbl" x="300" y="68" font-size="10.5" fill="var(--muted)">${t('s2_redl')}</text></g></g>` : ''}

  <g id="${P}dots"></g>

  <!-- ферменты на краях -->
  ${BX(P + 'cs', 166, 203, 48, 24, t('s2_cs'), 'cs', 12)}
  ${BX(P + 'idh', 272, 118, 56, 24, t('s2_idh'), 'idh', 12)}

  ${node(P + 'nC', 144, 105, 's2_cit', 'cit', adv)}${node(P + 'nA', 364, 105, 's2_akg', 'akg', adv)}
  ${node(P + 'nS', 364, 275, 's2_suc', 'suc', adv)}${node(P + 'nM', 144, 275, 's2_mal', 'mal', adv)}

  <!-- электронные носители -->

    <rect class="lv-tr" x="296" y="197" width="46" height="8" rx="4"/><rect class="lv-f" id="${P}car_n" x="296" y="197" width="2" height="8" rx="4"/><line class="lv-tk" x1="${296 + 46 / LV}" y1="194" x2="${296 + 46 / LV}" y2="208"/>

    <text class="lbl" id="${P}chain" x="300" y="248" font-size="10" fill="var(--muted)">${t('s2_chain')}</text></g>
  ${adv ? `<g id="${P}dPier" class="fade" opacity="0" style="pointer-events:none"><rect class="drugpill" x="256" y="239" width="88" height="18" rx="9"/><text class="drugpill-t" x="300" y="248.5" font-size="11">${t('s2_p_pier')}</text></g>` : ''}
  ${adv ? pillS(P + 'dGlsi', 456, 82, 78, 's2_p_glsi', 'glsi') + pillS(P + 'dPc', 58, 316, 82, 's2_p_pckd', 'pckd') + pillS(P + 'dSdh', 262, 316, 76, 's2_p_sdh', 'sdhl') +

  /* ---- частицы: число частиц на ветви — посчитанный поток ---- */
  const FLOWS = [['ac', 'eAC', 'dot-pyr'], ['cs', 'eCS', 'dot-cyc'], ['idh', 'eIDH', 'dot-cyc'], ['kg', 'eKG', 'dot-cyc'], ['sdh', 'eSDH', 'dot-cyc'], ['red', 'eRED', 'dot-cyc'],
    ['gln', 'eGLN', 'dot-gln'], ['pc', 'ePC', 'dot-pyr'], ['xc', 'eXc', 'dot-exit'], ['xg', 'eXg', 'dot-exit'], ['xa', 'eXa', 'dot-exit'], ['xm', 'eXm', 'dot-exit'], ['xh', 'eXh', 'dot-exit'],
    ['ni', 'eNI', 'dot-nadh'], ['nk', 'eNK', 'dot-nadh'], ['nm', 'eNM', 'dot-nadh'], ['nf', 'eNF', 'dot-fad']];
  function dotsInit(K, adv){
    const P = 's' + K + '_', g = $(P + 'dots'), F = {};
    FLOWS.forEach(([id, path, cls]) => {
      if (!$(P + path)) return;
      const el = [];
      for (let i = 0; i < NDOT; i++){ const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', cls === 'dot-nadh' || cls === 'dot-fad' ? 3 : 3.4); c.setAttribute('class', cls); c.setAttribute('opacity', 0); g.appendChild(c); el.push(c); }
      F[id] = { path: $(P + path), el, n: 0, ph: [...Array(NDOT).keys()].map(i => i / NDOT), len: 0 };
    });
    return F;
  }
  const dotsSet = (F, id, v) => { const f = F[id]; if (f) f.n = v < .008 ? 0 : Math.max(1, Math.round(NDOT * clamp(v / FQ))); };
  function dotsPlace(F){
    for (const id in F){ const f = F[id]; if (!f.len){ try { f.len = f.path.getTotalLength(); } catch (e) { f.len = 0; } }
      f.el.forEach((c, i) => { const on = f.len > 0 && i < f.n; c.setAttribute('opacity', on ? .95 : 0); if (!on) return;
        const pt = f.path.getPointAtLength(f.ph[i] * f.len); c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1)); }); }
  }

  /* ---- обновление схемы по состоянию модели ---- */
  function paint(K, r, REF, inp, adv, F){
    const P = 's' + K + '_', fl = r.o.fl, lev = r.o.lev, L0 = REF.o.lev;

    ew('eAC', fl.pdh + CQ.A_OTH); ew('eCS', fl.cs); ew('eIDH', fl.idh); ew('eKG', fl.kgdh); ew('eSDH', fl.sdh); ew('eGLN', fl.gls); ew('ePC', fl.pc);
    ew('eXc', fl.cit_x); ew('eXg', fl.glu_x); ew('eXa', fl.asp_x); ew('eXm', fl.me_x);
    ew('eNI', fl.idh); ew('eNK', fl.kgdh); ew('eNM', r.o.mdh); ew('eNF', fl.sdh);
    setEdge(P + 'eXh', true); $(P + 'eXh').style.strokeWidth = (1.5 + 3.8 * clamp((fl.heme + fl.suc_x) / FQ)).toFixed(2);   /* выход «гем и прочее» всегда нарисован; толщина — посчитанный поток */
    if (adv){ ew('eRED', fl.red); setOp(P + 'redg', fl.red > .008 ? 1 : .35); }
    [['nC', 'cit'], ['nA', 'akg'], ['nS', 'suc'], ['nM', 'mal']].forEach(([id, k]) => {
      const x = lev[k] / L0[k];
      $(P + id + '_f').setAttribute('width', Math.max(2, 76 * clamp(x / LV)).toFixed(1));
      setBoxState(P + id, x > .04 ? 'on' : null);
      setTxt(P + id + '_n', '×' + ftx(x));
    });
    $(P + 'car_n').setAttribute('width', Math.max(2, 46 * clamp(r.o.nadh_n / REF.o.nadh_n / LV)).toFixed(1));
    $(P + 'car_f').setAttribute('width', Math.max(2, 46 * clamp(fl.sdh / REF.o.fl.sdh / LV)).toFixed(1));
    setBoxState(P + 'cs', fl.cs > .008 ? 'on' : null); setBoxState(P + 'idh', fl.idh > .008 ? 'on' : null); setBoxState(P + 'kg', fl.kgdh > .008 ? 'on' : null);
    setBoxState(P + 'sdhE', inp.sdh ? 'inh' : (fl.sdh > .008 ? 'on' : null));
    setBoxState(P + 'gls', inp.glsi ? 'inh' : (fl.gls > .008 ? 'on' : null)); setBoxState(P + 'pc', inp.pcKD ? 'inh' : (fl.pc > .008 ? 'on' : null));
    if (adv){

      vis(P + 'dGlsi', inp.glsi); vis(P + 'dPc', inp.pcKD); vis(P + 'dSdh', inp.sdh); setOp(P + 'xPc', inp.pcKD ? 1 : 0); setOp(P + 'xSdh', inp.sdh ? 1 : 0);
      setOp(P + 'dPier', inp.pier ? 1 : 0); setOp(P + 'chain', inp.pier ? 0 : 1);
    }
    dotsSet(F, 'ac', fl.pdh + CQ.A_OTH); dotsSet(F, 'cs', fl.cs); dotsSet(F, 'idh', fl.idh); dotsSet(F, 'kg', fl.kgdh); dotsSet(F, 'sdh', fl.sdh); dotsSet(F, 'red', fl.red);

  /* ---- график изотопологов (установившееся мечение) ---- */
  function isoHTML(iso){
    const row = (k, v) => `<div class="isr"><b>${t(k)}</b><div class="isc">` + v.map((x, i) => `<div class="ic"><em>${pct(x)}</em><i class="${i ? '' : 'z'}" style="height:${Math.max(1, Math.round(60 * x))}px"></i><span>M+${i}</span></div>`).join('') + `</div></div>`;
    return row('s2_iso_cit', iso.cit) + row('s2_iso_asp', iso.mal);
  }

  /* ---- подпись: те же величины и пороги, что у полос ---- */
  function caption(r, REF, inp, iso, adv){
    const d = devsOf(inp), cls = classOf(d), parts = [];
    if (!d.length) parts.push(t('s2_c_ref'));
    else if (d.length > 2) parts.push(t('s2_m_multi', { list: d.map(x => t('s2_dn_' + x)).join('; ') }));
    else d.forEach(x => parts.push(t('s2_m_' + x)));
    const Q = k => rd(k, r, REF), fl = r.o.fl, F0 = REF.o.fl;
    const found = [];                 /* наблюдения: каждое верно по числам на экране; по метке — первыми, затем по порядку важности; всего не больше двух предложений на подпись, кроме механизма */
    if (iso){
      if (inp.tr === 'gln' && iso.cit[5] > .05) found.push(['s2_f_m5', { x: pct(iso.cit[5]) }]);
      if (inp.tr === 'glc' && iso.mal[3] > .05) found.push([inp.sdh ? (r.o.fl.red > .02 ? 's2_f_m3r' : 's2_f_m3s') : 's2_f_m3', { x: pct(iso.mal[3]), phi: pct(CQ.PHI_P) }]);
    }
    const csR = Q('cs').v, malR = Q('mal').v, pcR = Q('pc').v, sucR = Q('suc').v, pdhR = fl.pdh / F0.pdh;
    if (!inp.pier && csR < .5 && malR < .5) found.push(['s2_f_ace']);
    if (inp.sdh && sucR > 1.5) found.push(['s2_f_sdh']);
    if (inp.pier && pdhR < .9 && csR < .9) found.push(['s2_f_pier']);
    if (fl.red > .02) found.push(['s2_f_red']);
    if (!inp.pier && malR < .94 && csR < .94 && !found.some(x => x[0] === 's2_f_ace')) found.push(['s2_f_oaa']);
    if (pcR > 1.12 && malR < .94) found.push(['s2_f_pc']);
    if (Q('asp').d < -SEEN && Q('div').d < -SEEN) found.push(['s2_f_asp']);
    const budget = d.length === 1 ? 2 : 1;
    found.slice(0, budget).forEach(([k, v]) => parts.push(t(k, v)));
    if (d.length) parts.push(cmpText(r, REF, adv));
    return { text: parts.join(' '), why: t('s2_z_' + cls) };
  }

  /* уровни метаболитов (в узлах схемы) и доля цитрата M+5 — для строки «до → после» сценария */
  const levVals = (r, REF, iso) => { const q = k => { const x = r.o.lev[k] / REF.o.lev[k]; return '×' + fmt(x, x >= 10 ? 0 : 2); }; const v = { s2_cit: q('cit'), s2_akg: q('akg'), s2_suc: q('suc'), s2_mal: q('mal') }; if (iso) v.poe_m_citm5 = pct(iso.cit[5]) + ' %'; return v; };
  const READS_B = ['gls', 'pc', 'cs', 'nadh', 'cit_x', 'glu_x', 'asp', 'div'];
  const READS_A = ['gls', 'pc', 'cs', 'nadh', 'fad', 'cit_x', 'glu_x', 'asp', 'div'];

  /* ===================== 2b: базовый уровень ===================== */
  (function(){
    const K = '2b', P = 's2b_';
    layout(K);

    SLIDER_FMT[P + 'cat'] = v => fmt(catOf(v), 2);

    $('ctrl' + K).innerHTML = sliderHTML(P + 'cat', 's2_cat', 50) + sliderHTML(P + 'gln', 's2_gln_s', 50) +
      REFROW(['prop', 'pepck']) +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}terms">${t('s2_terms')}</button><button class="btn ghost" id="${P}how">${t('s2_how')}</button><button class="btn ghost" id="${P}lim">${t('s1_lim')}</button></div>`;
    $('take' + K).textContent = t('s2b_take');
    const Fd = dotsInit(K, false);
    const inputs = () => ({ cell: 'A', cat: catOf(sv(P + 'cat')), gln: glnOf(sv(P + 'gln')) });
    function update(){
      const inp = inputs(), r = cycleFull(inp), REF = REFS.A;
      paint(K, r, REF, inp, false, Fd);
      $('reads' + K).innerHTML = `<div class="mgrid">` + READS_B.map(k => mk(k, r, REF)).join('') + `</div><p class="hint">${t('s2b_ref')}</p>`;
      if (SCENES[K]) SCENES[K].vals = levVals(r, REF, null);
      const c = caption(r, REF, inp, null, false); $('cap' + K).textContent = c.text; $('why' + K).textContent = c.why;

    ${BX(P + 'akt', 488, 278, 80, 24, 'p-Akt', 'rx_sig', 11.5)}
    <path id="${P}ePtp" class="edge inh" d="M528 256 L528 276" marker-end="url(#b_${K})"/>
    <path id="${P}ePtp1" class="edge inh" d="M583 213 C 598 236, 594 274, 570 288" marker-end="url(#b_${K})"/>
    <!-- повреждение -->
    ${BX(P + 'dna', 60, 236, 96, 24, t('s4_dna'), 'rx_dmg', 11)}${BX(P + 'lip', 60, 270, 96, 24, t('s4_lip'), 'rx_dmg', 11)}
    <path id="${P}eDmg" class="edge" d="M302 244 L158 254" marker-end="url(#a_${K})"/>
    ${t('s4_dmg_note').split('; ').map((x, i) => `<text class="lbl-l" x="164" y="${277 + i * 12}" font-size="9.5" fill-opacity=".8">${x}${i ? '' : ';'}</text>`).join('')}
    ${BX(P + 'parp', 60, 316, 96, 24, 'PARP1', 'rx_parp', 11.5)}
    <path class="edge" d="M60 248 C 38 258, 38 318, 58 328" marker-end="url(#a_${K})"/>
    <text id="${P}nadV" class="lbl-l" x="162" y="328" font-size="11.5"></text>
    <!-- PKM2 → пентозофосфатный путь → NADPH -->
    ${BX(P + 'pkm2', 380, 320, 74, 24, 'PKM2', 'rx_pkm2', 11.5)}${BX(P + 'ppp', 470, 320, 100, 24, t('s4_ppp'), 'rx_pkm2', 11)}
    <path id="${P}ePk" class="edge" d="M454 332 L468 332" marker-end="url(#a_${K})"/>
    <path id="${P}ePkOx" class="edge inh" d="M330 256 L392 318" marker-end="url(#b_${K})"/>
    <text id="${P}nphV" class="lbl" x="520" y="360" font-size="11"></text>
    <path class="edge" d="M500 318 C 492 292, 476 266, 446 258" marker-end="url(#a_${K})" stroke-dasharray="4 4"/>
    <!-- плазматическая мембрана и NOX -->
    <line class="pm" x1="14" y1="404" x2="586" y2="404"/>
    ${BX(P + 'nox', 270, 380, 100, 24, t('s4_nox'), 'rx_nox', 11)}
    <path id="${P}eNox" class="edge fade" d="M320 378 L320 258" marker-end="url(#a_${K})" opacity="0"/>
    ${adv ? `<g id="${P}pegP" class="fade" opacity="0"><rect class="drugpill" x="232" y="226" width="56" height="20" rx="10"/><text class="lbl kin-lbl" x="260" y="236" font-size="10">${t('s4_peg_s')}</text></g>
      <g id="${P}amaP" class="fade" opacity="0"><rect class="drugpill" x="196" y="164" width="72" height="18" rx="9"/><text class="lbl kin-lbl" x="232" y="173" font-size="10">${t('s4_ama_s')}</text></g>` : ''}`;
  }

  function paint(K, r, inp, adv){
    const P = 's' + K + '_';
    $(P + 'nF').setAttribute('width', (120 * clamp(r.n)).toFixed(1)); setTxt(P + 'nV', f2(r.n));
    const rel = (h, h0) => h / h0;
    const hm = rel(r.Hm, REF.Hm), hc = rel(r.Hc, REF.Hc);
    const rad = x => (12 + 10 * clamp(Math.log10(Math.max(x, .3)) / 2 + .2)).toFixed(1);
    $(P + 'hm').setAttribute('r', rad(hm)); $(P + 'hc').setAttribute('r', rad(hc));
    $(P + 'hm').classList.toggle('hot', r.prxM.hyp > .2 || r.dam > .2); $(P + 'hc').classList.toggle('hot', r.prxC.hyp > .2);
    setTxt(P + 'hmV', '×' + ftx(hm)); setTxt(P + 'hcV', '×' + ftx(hc));
    $(P + 'sox').setAttribute('r', (10 + 6 * clamp(r.Jm / 2)).toFixed(1));
    const pb = (id, q) => { $(P + id + 'r').setAttribute('width', (90 * q.red).toFixed(1)); $(P + id + 's').setAttribute('x', (+$(P + id + 'r').getAttribute('x') + 90 * q.red).toFixed(1));
      $(P + id + 's').setAttribute('width', (90 * q.ss).toFixed(1)); $(P + id + 'h').setAttribute('x', (+$(P + id + 'r').getAttribute('x') + 90 * (q.red + q.ss)).toFixed(1)); $(P + id + 'h').setAttribute('width', (90 * q.hyp).toFixed(1)); };
    pb('pm', r.prxM); pb('pc', r.prxC);
    setBoxState(P + 'c1', inp.rep ? 'on' : 'on'); setBoxState(P + 'c3', inp.anti_a ? 'inh' : 'on');
    setBoxState(P + 'ptp', r.ptp > .3 ? 'inh' : 'on'); setBoxState(P + 'pten', r.ptp > .3 ? 'inh' : 'on'); setBoxState(P + 'akt', r.pakt > .5 ? 'on' : '');
    setBoxState(P + 'dna', r.dam > .2 ? 'on' : ''); setBoxState(P + 'lip', r.dam > .2 ? 'on' : ''); setBoxState(P + 'parp', r.dam > .2 && !inp.olap ? 'on' : (inp.olap ? 'inh' : ''));
    setBoxState(P + 'pkm2', inp.pkm2cs ? '' : (r.pk > .1 ? 'inh' : 'on')); setBoxState(P + 'ppp', r.pk > .1 ? 'on' : '');
    setBoxState(P + 'nox', inp.gf ? 'on' : ''); setOp(P + 'eNox', inp.gf ? 1 : 0); setEdge(P + 'eDmg', clamp(r.dam * 1.2));
    setOp(P + 'eRet', inp.rep ? 1 : 0); setOp(P + 'retT', inp.rep ? 1 : 0); setOp(P + 'eIms', inp.anti_a ? 1 : 0);
    if (adv){ setOp(P + 'pegP', inp.peg ? 1 : 0); setOp(P + 'amaP', inp.anti_a ? 1 : 0); }
    setTxt(P + 'nadV', t('s4_nad_v', { x: f2(r.nad) })); setTxt(P + 'nphV', t('s4_nadph_v', { x: f2(r.nadph / REF.nadph) }));
    missing(P + 'pkm2', !!inp.pkm2cs);
  }

  const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
  const lg = (k, x) => mm(t('s4_r_' + k), (Math.log10(Math.max(x, .1)) + 1) / 3, 1 / 3, '×' + ftx(x));
  const ab = (k, v, v0) => mm(t('s4_r_' + k), v, v0, f2(v));
  /* схематическое распределение форм пероксиредоксинов (не изображение геля; аудит v1.1, S4) + развилка пероксидазного цистеина (S3) */
  function forms(r, K){
    const seg = (q) => [['prx-r', q.red], ['prx-s', q.ss], ['prx-h', q.hyp]].map(([c, v]) => `<i class="${c}" style="width:${(100 * clamp(v)).toFixed(1)}%"></i>`).join('');
    const row = (lab, q0, q) => `<div class="fd-row"><span class="fd-lab">${lab}</span><div class="fd-pair"><small>${t('b3_ref')}</small><div class="fd-bar">${seg(q0)}</div><small>${t('b3_now')}</small><div class="fd-bar">${seg(q)}</div><span class="fd-v">${t('b4_v', { r: pct(q.red), d: pct(q.ss), h: pct(q.hyp) })}</span></div></div>`;
    const leg = `<div class="fd-leg"><span><i class="prx-r"></i>${t('b4_lg_r')}</span><span><i class="prx-s"></i>${t('b4_lg_d')}</span><span><i class="prx-h"></i>${t('b4_lg_h')}</span></div>`;
    const br = `<svg class="fd-br" viewBox="0 0 420 118" role="img" aria-label="${t('b4_br_t')}">
      <defs><marker id="a_fd${K}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker></defs>
      <text x="4" y="12" class="lbl-l" font-size="11" font-weight="600">${t('b4_br_t')}</text>
      <text x="26" y="62" class="lbl" font-size="12" font-weight="700">SH</text><text x="112" y="62" class="lbl" font-size="12" font-weight="700">SOH</text>
      <text x="214" y="38" class="lbl" font-size="12" font-weight="700">S–S</text><text x="214" y="86" class="lbl" font-size="12" font-weight="700">SO₂H</text><text x="340" y="86" class="lbl" font-size="12" font-weight="700">SO₃H</text>
      <path class="edge" d="M42 62 L92 62" marker-end="url(#a_fd${K})"/><text x="66" y="54" class="lbl" font-size="9.5">H₂O₂</text>
      <path class="edge" d="M134 56 L196 42" marker-end="url(#a_fd${K})"/><path class="edge" d="M134 68 L190 82" marker-end="url(#a_fd${K})"/><text x="168" y="90" class="lbl" font-size="9.5">H₂O₂</text>
      <path class="edge" d="M198 30 C 140 18, 60 22, 30 50" marker-end="url(#a_fd${K})" stroke-dasharray="4 3"/><text x="236" y="38" class="lbl-l" font-size="9.5">${t('b4_br_trx')}</text>
      <path class="edge" d="M196 94 C 140 108, 60 104, 30 74" marker-end="url(#a_fd${K})" stroke-dasharray="4 3"/><text x="96" y="114" class="lbl" font-size="9.5">${t('b4_br_srx')}</text>
      <path class="edge" d="M240 86 L312 86" marker-end="url(#a_fd${K})"/><text x="276" y="78" class="lbl" font-size="9.5">H₂O₂</text>
      <text x="340" y="104" class="lbl" font-size="9.5" fill-opacity=".8">${t('b4_br_irr')}</text></svg>`;
    return `<p class="plotcap" style="margin-top:8px">${t('b4_t')}</p>${leg}` + row(t('b4_row_m'), REF.prxM, r.prxM) + row(t('b4_row_c'), REF.prxC, r.prxC) + `<p class="hint">${t('b4_hint')}</p>` + br;
  }

  function devsOf(inp, adv){
    const d = [];
    if (inp.n > B.n + .03) d.push('nH'); else if (inp.n < B.n - .03) d.push('nL');
    if (inp.anti < B.anti - .03) d.push('aL'); else if (inp.anti > B.anti + .03) d.push('aH');
    if (adv) ['gf', 'peg', 'oligo', 'fccp', 'anti_a', 'nosrx', 'pkm2cs', 'olap', 'rep', 'dmm'].forEach(k => { if (inp[k]) d.push(k); });
    return d;
  }
  function caption(r, inp, adv){
    const d = devsOf(inp, adv), parts = [];
    if (!d.length) parts.push(t('s4_c_ref'));
    else if (d.length > 2) parts.push(t('s4_m_multi', { list: d.map(x => t('s4_dn_' + x)).join('; ') }));
    else d.forEach(x => parts.push(t('s4_m_' + x)));
    const hm = r.Hm / REF.Hm, hc = r.Hc / REF.Hc;
    const zone = (r.dam > .2 || r.prxM.hyp > .2 || r.prxC.hyp > .2) ? 'dmg' : ((hm > 1.5 || hc > 1.5) ? 'sig' : (hm < .8 ? 'low' : 'base'));
    const mz = hm >= hc;
    if (d.length) parts.push(t('s4_f_' + zone, { hm: ftx(hm), hc: ftx(hc), hyp: pct(Math.max(r.prxM.hyp, r.prxC.hyp)), dam: f2(r.dam), ss: pct(mz ? r.prxM.ss : r.prxC.ss), prx: t(mz ? 's4_prx3' : 's4_prx2') }));
    if (adv && inp.gf) parts.push(t(r.pakt > .6 ? 's4_f_akt_hi' : 's4_f_akt_lo', { x: f2(r.pakt) }));
    if (adv && r.nad < .9) parts.push(t('s4_f_nad', { x: f2(r.nad) }));
    let z = zone === 'dmg' ? 'dmg' : zone === 'sig' ? 'sig' : 'ref';
    if (adv){ if (inp.rep) z = 'rep'; else if (inp.peg && inp.gf) z = 'peg'; else if (inp.olap) z = 'parp'; else if (inp.pkm2cs) z = 'pkm2'; else if (inp.nosrx) z = 'srx'; else if (inp.gf && zone !== 'dmg') z = 'nox'; else if (inp.fccp) z = 'fccp'; }
    return { text: parts.join(' '), why: t('s4_z_' + z) };
  }

  /* ===================== 4b ===================== */
  (function(){
    const K = '4b', P = 's4b_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, false);
    SLIDER_FMT[P + 'n'] = v => fmt(nOf(v), 2); SLIDER_FMT[P + 'a'] = v => fmt(aOf(v), 2);
    $('ctrl' + K).innerHTML = sliderHTML(P + 'n', 's4_n', 28) + sliderHTML(P + 'a', 's4_a', 58) +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s2_how')}</button><button class="btn ghost" id="${P}lim">${t('s1_lim')}</button></div>`;
    $('take' + K).textContent = t('s4b_take');
    const inputs = () => ({ n: nOf(sv(P + 'n')), anti: aOf(sv(P + 'a')) });
    function update(){
      const inp = inputs(), r = redox(inp);
      paint(K, r, inp, false);
      $('reads' + K).innerHTML = `<div class="mgrid">${ab('n', r.n, REF.n)}${lg('hm', r.Hm / REF.Hm)}${lg('hc', r.Hc / REF.Hc)}${ab('hyp', r.prxM.hyp, REF.prxM.hyp)}${ab('ptp', r.ptp, REF.ptp)}${ab('dam', r.dam, REF.dam)}</div><p class="hint">${t('s4b_ref')}</p>` + forms(r, K);
      const c = caption(r, inp, false); $('cap' + K).textContent = c.text; $('why' + K).textContent = c.why;
    }
    wire([P + 'n', P + 'a'], update);
    const set = (n, a) => { setSlider(P + 'n', uN(n)); setSlider(P + 'a', uA(a)); };
    $(P + 'reset').onclick = () => { set(B.n, B.anti); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'rx_measure'); $(P + 'lim').onclick = () => showInfo(K, 'rx_model');
    set(B.n, B.anti);
    SCENES[K] = { update, poe: [
      { n: 3, ok: 1, pre(){ set(.32, .6); }, apply(){ set(.6, .6); }, m: ['s4_r_hm', 's4_r_dam', 's4_r_hyp'] },
      { n: 3, ok: 2, pre(){ set(.6, .6); }, apply(){ set(.6, .15); }, m: ['s4_r_hyp', 's4_r_dam', 's4_r_hm'] },
      { n: 3, ok: 0, pre(){ set(.6, .15); }, apply(){ set(.32, .15); }, m: ['s4_r_hm', 's4_r_hyp', 's4_r_dam'] },
    ] };
  })();

  /* ===================== 4a ===================== */
  (function(){
    const K = '4a', P = 's4a_';
    layout(K);
    $('svg' + K).innerHTML = scheme(K, true);
    SLIDER_FMT[P + 'n'] = v => fmt(nOf(v), 2); SLIDER_FMT[P + 'a'] = v => fmt(aOf(v), 2);
    const tg = (id, k) => toggleHTML(P + id, k, false);
    const IDS = ['gf', 'peg', 'oligo', 'fccp', 'anti_a', 'nosrx', 'pkm2cs', 'olap', 'dmm'];
    $('ctrl' + K).innerHTML = sliderHTML(P + 'n', 's4_n', 28) + sliderHTML(P + 'a', 's4_a', 58) +
      `<div class="grp"><span>${t('s4_g_drugs')}</span><div class="tgrid">${IDS.filter(i => i !== 'dmm').map(i => tg(i, 's4_' + i)).join('')}</div></div>` +
      segHTML(P + 'rep', 's4_rep', [['0', 's4_rep0'], ['1', 's4_rep1']], '0') + `<div id="${P}dmmBox" hidden>${tg('dmm', 's4_dmm')}</div>` +
      `<div class="btns"><button class="btn ghost" id="${P}reset">${t('reset')}</button><button class="btn ghost" id="${P}how">${t('s2_how')}</button><button class="btn ghost" id="${P}lim">${t('s1_lim')}</button></div>`;
    $('take' + K).textContent = t('s4a_take');
    const inputs = () => { const o = { n: nOf(sv(P + 'n')), anti: aOf(sv(P + 'a')), rep: segVal(P + 'rep') === '1' }; IDS.forEach(i => o[i] = $(P + i).checked); if (!o.rep) o.dmm = false; return o; };
    function update(){
      const inp = inputs(), r = redox(inp);
      $(P + 'dmmBox').hidden = !inp.rep;
      paint(K, r, inp, true);
      $('reads' + K).innerHTML = `<div class="mgrid">${ab('n', r.n, REF.n)}${lg('hm', r.Hm / REF.Hm)}${lg('hc', r.Hc / REF.Hc)}${ab('hyp', r.prxM.hyp, REF.prxM.hyp)}${ab('ptp', r.ptp, REF.ptp)}${ab('akt', r.pakt, inp.gf ? REFG.pakt : REF.pakt)}${ab('dam', r.dam, REF.dam)}${ab('nad', r.nad, 1)}${mm(t('s4_r_nadph'), r.nadph / REF.nadph / 2, .5, '×' + f2(r.nadph / REF.nadph))}</div><p class="hint">${t('s4a_ref')}</p>` + forms(r, K);
      const c = caption(r, inp, true); $('cap' + K).textContent = c.text; $('why' + K).textContent = c.why;
    }
    wire([P + 'n', P + 'a', P + 'rep', ...IDS.map(i => P + i)], update);
    const DEF = { n: B.n, anti: B.anti, rep: 0 };
    const st = o => { const d = Object.assign({}, DEF, o); setSlider(P + 'n', uN(d.n)); setSlider(P + 'a', uA(d.anti)); IDS.forEach(i => { $(P + i).checked = !!d[i]; }); segSet(P + 'rep', d.rep ? '1' : '0'); };
    $(P + 'reset').onclick = () => { st({}); update(); };
    $(P + 'how').onclick = () => showInfo(K, 'rx_measure'); $(P + 'lim').onclick = () => showInfo(K, 'rx_model');
    st({});
    const HI = { n: .6, anti: .15 };
    SCENES[K] = { update, poe: [
      { n: 3, ok: 2, pre(){ st({}); }, apply(){ st({ gf: 1 }); }, m: ['s4_r_ptp', 's4_r_dam', 's4_r_hc'] },
      { n: 3, ok: 0, ctl(){ st({ gf: 1 }); }, ctlH: 'poe_m_ctl_gf', pre(){ st({ gf: 1 }); }, apply(){ st({ gf: 1, peg: 1 }); }, m: ['s4_r_akt', 's4_r_hc', 's4_r_ptp'] },
      { n: 3, ok: 1, pre(){ st({}); }, apply(){ st({ fccp: 1 }); }, m: ['s4_r_hm', 's4_r_n', 's4_r_dam'] },
      { n: 3, ok: 2, pre(){ st(HI); }, apply(){ st({ ...HI, nosrx: 1 }); }, m: ['s4_r_hyp', 's4_r_hm', 's4_r_dam'] },
      { n: 3, ok: 0, pre(){ st({ ...HI, gf: 1 }); }, apply(){ st({ ...HI, gf: 1, pkm2cs: 1 }); }, m: ['s4_r_nadph', 's4_r_hc', 's4_r_dam'] },
      { n: 3, ok: 1, pre(){ st(HI); }, apply(){ st({ ...HI, olap: 1 }); }, m: ['s4_r_nad', 's4_r_dam', 's4_r_hm'] },
      { n: 3, ok: 2, pre(){ st({ rep: 1 }); }, apply(){ st({ rep: 1, dmm: 1 }); }, m: ['s4_r_hm', 's4_r_dam', 's4_r_nad'] },
    ] };
  })();
})();

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
initNav(); show();

</script>
