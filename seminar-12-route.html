бным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Этот шаг объединяет материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Селективная аутофагия и контроль качества органелл","stats":[["4 процесса","от рецептора до лизосомы"],["Объяснения","с вопросами для самопроверки"],["47 сценариев","в отдельном практикуме"]],"num_fmt":"12.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел II: семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Уменьшить схему","zoom_area":"Увеличенная схема: прокрутите в сторону, чтобы увидеть её целиком"},"sections":[{"title":"Рецепторы селективной аутофагии","entry":"sar-adapter","sub":"Как рецептор связывает помеченный груз и белки ATG8 и запускает построение аутофагосомы"},{"title":"PINK1 и Parkin","entry":"pink1-import","sub":"Как нарушение импорта в митохондрию превращается в убиквитиновую метку на её поверхности"},{"title":"Повреждение лизосомы","entry":"lyso-damage","sub":"Как лизосома ремонтируется, удаляется и восстанавливается после повреждения мембраны"},{"title":"Выбор маршрута","entry":"route-principle","sub":"Чем определяется судьба повреждённого белка или органеллы"},{"title":"Исследование","entry":"methods","sub":"Как выбрать измеряемую величину и проследить судьбу одного повреждения","integr":true}],"lessons":[{"id":"sar-adapter","number":1,"section":0,"title":"Что делает рецептор селективной аутофагии","question":1,"questions":[1],"keywords":["селективная аутофагия","рецептор","адаптер","ATG8","убиквитин","LIR","FIP200","фагофор","груз"],"lead":["[[T01|Селективная аутофагия]] упаковывает в аутофагосому не любой участок цитоплазмы, а помеченный груз: белковые агрегаты, повреждённые органеллы, бактерии.","Отбор выполняют [[T02|рецепторы селективной аутофагии]]: каждый из них связывает груз и белки [[T03|ATG8]] на мембране фагофора, а многие ещё и привлекают к грузу комплекс [[T07|ULK1–FIP200]]."],"mechanism":["Груз несёт метку, чаще всего цепи убиквитина; растворимые рецепторы p62, NBR1, TAX1BP1, NDP52 и OPTN узнают её [[T04|убиквитин-связывающим доменом]].","Тот же рецептор связывает белки ATG8 мотивом [[T05|LIR]], и мембрана фагофора оказывается рядом с грузом.","Участком [[T06|FIR или SKICH]] рецептор связывает FIP200 и привлекает комплекс ULK1–FIP200, поэтому построение аутофагосомы начинается у груза."],"paragraphs":["При голодании подавление киназы mTOR запускает неселективную аутофагию, которой рецепторы не нужны. Селективная аутофагия может идти и при активном mTOR: аутофагосому у груза строят рецепторы, которые связывают груз и привлекают белки аутофагии (Adriaenssens 2022).","Рецептором называют белок, который связывает груз и белки ATG8 на фагофоре. Рецептор, как правило, разрушается вместе с грузом: p62 прямо связывается с LC3 и GABARAP, а p62-положительные тельца разрушаются в аутолизосомах (Pankiv 2007).","Растворимые рецепторы p62, NBR1, TAX1BP1, NDP52 и OPTN узнают убиквитин на грузе. Мембранные рецепторы BNIP3, NIX и FUNDC1 встроены в наружную мембрану митохондрии и запускают путь без убиквитинирования её поверхности, а FAM134B встроен в мембрану эндоплазматического ретикулума (ЭПР) (Adriaenssens 2022).","Рецептор не только связывает груз и ATG8, но и привлекает к грузу комплекс ULK1–FIP200. Для NDP52 это показано при его принудительной посадке на митохондрию в клетках HeLa: без домена SKICH FIP200 не привлекался, и митофагия не наступала (Vargas 2019). Поэтому аутофагосома строится у груза, а не пристыковывается к готовой.","Граница вывода: сведения получены в культивируемых клетках человека, чаще в HeLa; набор рецепторов зависит от типа клеток, например NDP52 не экспрессируется в нейронах (Adriaenssens 2022)."],"trap":["Рецептор лишь стыкует помеченный груз с готовой аутофагосомой.","Рецепторы NDP52 и OPTN привлекали ULK1 к митохондриям независимо от связи с белками ATG8 (Lazarou 2015; Vargas 2019). Связь с ATG8 — лишь одна из функций рецептора."],"conditions":"Определения даны по обзору Adriaenssens 2022. Привлечение FIP200 доменом SKICH показано в клетках HeLa при принудительной посадке NDP52 на митохондрию (метод описан в последнем шаге раздела; Vargas 2019); для p62 данные получены в клетках HeLa (Pankiv 2007); мутанты UBD и LIR изучали в клетках HeLa с Parkin (Lazarou 2015; Padman 2019). Схема качественная: показаны модули рецептора и звенья цепи, без трёхмерного строения.","sources":["Adriaenssens2022","Pankiv2007","Vargas2019","Lazarou2015","Padman2019"],"quiz":{"id":"S12-L01","rev":1,"question":"Рецептор находится на грузе; его убиквитин-связывающий домен и мотив LIR сохранены, а участок связывания FIP200 удалён. Какое звено цепи нарушается в первую очередь?","options":[{"id":"S12-L01-1","text":"Связь рецептора с убиквитином на грузе.","correct":false,"feedback":"Убиквитин рецептор связывает своим UBD, а он по условию сохранён. NDP52 без SKICH сохранял взаимодействие с белками LC3/GABARAP, но терял связь с FIP200 (Vargas 2019)."},{"id":"S12-L01-2","text":"Привлечение комплекса ULK1–FIP200 к грузу.","correct":true,"feedback":"Участок связывания FIP200 передаёт сигнал от рецептора к комплексу инициации. NDP52 без SKICH не привлекал FIP200 к митохондрии и не запускал митофагию (Vargas 2019)."},{"id":"S12-L01-3","text":"Связь рецептора с белками ATG8.","correct":false,"feedback":"За эту связь отвечает мотив LIR, а он сохранён. В модели без FIR нарушена не она, а привлечение инициирующего комплекса."}]},"widget":{"kind":"net","title":"","s":{"title":"Рецептор как физический адаптер: четыре состояния","status":"Схема механизма · качественные состояния","static":["Схема показывает груз с метками убиквитина, модули рецептора (UBD, LIR, FIR) и их партнёров: белки ATG8 на мембране и комплекс ULK1–FIP200.","Четыре состояния: рецептор цел, нет UBD, нет LIR, нет участка связывания FIP200."],"ctrls":[{"id":"m","type":"group","label":"Состояние рецептора","opts":["Рецептор цел","Нет UBD","Нет LIR","Нет участка связывания FIP200"]}],"W":516,"H":372,"NW":340,"NH":392,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"усиление без обязательного участия","nodes":["жёлтая рамка — модуль или звено работает","пунктирная рамка — не работает или снижено","крест — модуль удалён или мутирован"]},"zones":[{"x":150,"y":56,"w":170,"h":274,"lx":160,"ly":322,"t":"один белок-рецептор","tn":"один белок-рецептор","c":"plain","n":[30,66,280,156,118,212]}],"mem":[],"nodes":{"cg":{"p":[70,186,124,84],"n":[170,36,200,44],"t":"груз\nс метками Ub","fs":16,"tn":"груз с метками Ub"},"lir":{"p":[235,96,96,40],"n":[84,154,112,38],"t":"LIR","fs":17},"ubd":{"p":[235,186,96,40],"n":[170,98,112,38],"t":"UBD","fs":17},"fir":{"p":[235,276,96,40],"n":[256,154,112,38],"t":"FIR","fs":17},"at8":{"p":[440,96,116,54],"n":[84,252,124,50],"t":"ATG8\nна мембране","fs":15},"ulk":{"p":[440,276,116,54],"n":[256,252,124,50],"t":"ULK1–\nFIP200","fs":15,"tn":"ULK1–\nFIP200"},"bld":{"p":[440,186,116,54],"n":[170,342,230,46],"t":"построение\nфагофора","fs":15,"tn":"построение фагофора у груза"}},"edges":{"e1":{"a":"cg","b":"ubd","k":"bind"},"e2":{"a":"lir","b":"at8","k":"bind"},"e3":{"a":"fir","b":"ulk","k":"bind"},"e4":{"a":"ulk","b":"bld","k":"seq"},"e5":{"a":"bld","b":"at8","k":"seq","bend":0,"bn":0}},"st":{"0":{"n":{"cg":"on","lir":"on","ubd":"on","fir":"on","at8":"on","ulk":"on","bld":"on"},"e":{"e1":"on","e2":"on","e3":"on","e4":"on","e5":"on"},"b":{},"m":[["Рецептор на грузе","да"],["Комплекс ULK1–FIP200 у груза","привлечён"],["Белки ATG8 на мембране у груза","связаны через LIR"]],"note":"Рецептор цел: UBD держит его на грузе, FIR привлекает комплекс ULK1–FIP200, и фагофор строится у груза; LIR связывает белки ATG8 на мембране."},"1":{"n":{"cg":"base","lir":"base","ubd":"abs","fir":"base","at8":"base","ulk":"base","bld":"off"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","e5":"off"},"b":{},"m":[["Рецептор на грузе","нет"],["Комплекс ULK1–FIP200 у груза","не привлечён"],["Белки ATG8 на мембране у груза","не связаны"]],"note":"Без UBD рецептор не удерживается на грузе. LIR и FIR сохранены, но действуют вдали от груза, поэтому ни комплекс ULK1–FIP200, ни мембрана с ATG8 у груза не появляются. Мутанты OPTN и NDP52 без убиквитин-связывающих доменов не приходили к митохондриям и не восстанавливали митофагию (Lazarou 2015, клетки HeLa)."},"2":{"n":{"cg":"on","lir":"abs","ubd":"on","fir":"on","at8":"on","ulk":"on","bld":"low"},"e":{"e1":"on","e2":"off","e3":"on","e4":"on","e5":"on"},"b":{},"m":[["Рецептор на грузе","да, но медленнее"],["Комплекс ULK1–FIP200 у груза","привлечён"],["Белки ATG8 на мембране у груза","через LIR не связаны"]],"note":"Без LIR рецептор по-прежнему узнаёт груз через UBD, но аутофагосома строится слабее и медленнее. Мутация F178A в LIR OPTN не мешала привлечению ULK1 (Lazarou 2015), мутации LIR NDP52 не влияли на связывание FIP200 (Vargas 2019); в клетках HeLa с Parkin при мутации LIR очаги ATG13 были мельче, на митохондриях было меньше FIP200, а митофагия шла медленнее (Padman 2019)."},"3":{"n":{"cg":"on","lir":"on","ubd":"on","fir":"abs","at8":"off","ulk":"base","bld":"off"},"e":{"e1":"on","e2":"off","e3":"off","e4":"off","e5":"off"},"b":{},"m":[["Рецептор на грузе","да"],["Комплекс ULK1–FIP200 у груза","не привлечён"],["Белки ATG8 на мембране у груза","мембраны у груза нет"]],"note":"Без участка связывания FIP200 рецептор остаётся на грузе, но комплекс инициации не привлекается, и мембрана с ATG8 у груза не строится: NDP52 без SKICH митофагию не запускал (Vargas 2019). Связь с ATG8 не может заменить привлечение инициирующего комплекса."}},"fs":15,"nfs":14,"lfs":12.5,"zfs":13}}},{"id":"sar-domains","number":2,"section":0,"title":"Из каких частей собран рецептор","question":1,"questions":[1],"keywords":["UBD","UBA","UBAN","цинковый палец","PB1","SKICH","LIR","FIR","TBK1","модуль"],"lead":["Рецептор селективной аутофагии — многодоменный белок: одни модули связывают груз, другие — белки ATG8, третьи — белки инициации.","У каждого рецептора набор модулей свой, поэтому рецепторы выполняют разные функции."],"mechanism":["Рецептор состоит из независимых модулей: [[T04|UBD]] связывает убиквитин на грузе, [[T05|LIR]] — белки ATG8.","Участок [[T06|FIR или SKICH]] связывает FIP200 комплекса [[T07|ULK1–FIP200]]; у p62 он перекрывается с LIR.","Киназа [[T10|TBK1]] фосфорилирует модули рецепторов и усиливает их связывание."],"paragraphs":["Убиквитин-связывающие домены у рецепторов разные: UBA у p62 и NBR1, UBZ у TAX1BP1, UBAN у OPTN, цинковые пальцы у NDP52. Домен PB1 есть у p62 и NBR1: у p62 он собирает олигомеры, а PB1 NBR1 сам полимеризоваться не может (Adriaenssens 2022).","LIR — короткая последовательность длиной 15–20 аминокислот; она связывается с LIR-связывающим участком (LDS) белков ATG8 на мембране фагофора. Известны и нетипичные взаимодействия с этим участком, а также взаимодействие, не зависящее от LIR (Johansen & Lamark 2020).","Связывание FIP200 устроено по-разному. NDP52 связывает FIP200 доменом SKICH (Vargas 2019). У p62 FIP200 узнаёт участок из остатков 326–380, перекрывающийся с LIR, поэтому ATG8 и FIP200 конкурируют за p62 (Turco 2019). У OPTN способ связывания FIP200 не определён, известно лишь, что оно зависит от активности киназы TBK1 (Adriaenssens 2022).","Киназа TBK1 фосфорилирует OPTN, NDP52, TAX1BP1 и p62, в том числе убиквитин- и LC3-связывающие домены OPTN и p62 и домены SKICH у NDP52 и TAX1BP1. Фосфорилирование UBAN у OPTN по Ser473 расширяет набор цепей убиквитина, которые он связывает (Richter 2016).","Граница вывода: номера остатков даны для белков человека; схема не передаёт трёхмерного строения, а порядок модулей упрощён."],"trap":["У всех рецепторов один и тот же набор модулей, поэтому любой из них может выполнять функции другого.","Наборы модулей различаются: PB1 есть у p62 и NBR1, у p62 участок связывания FIP200 перекрывается с LIR, а у OPTN способ связывания FIP200 не определён (Adriaenssens 2022; Turco 2019)."],"conditions":"Состав модулей — по обзору Adriaenssens 2022 и работам Vargas 2019, Turco 2019, Richter 2016 (клетки человека, in vitro). Нумерация остатков — для белков человека. Схема показывает только p62, NDP52 и OPTN; NBR1 и TAX1BP1 рассмотрены в других шагах.","sources":["Adriaenssens2022","Johansen2020","Turco2019","Vargas2019","Richter2016"],"quiz":{"id":"S12-L02","rev":1,"question":"Киназа TBK1 фосфорилирует UBAN-домен OPTN по Ser473. Как изменится способность OPTN связывать цепи убиквитина?","options":[{"id":"S12-L02-1","text":"Сузится: OPTN будет связывать меньше типов цепей.","correct":false,"feedback":"Наоборот: фосфорилирование расширяет набор цепей, которые связывает UBAN (Richter 2016)."},{"id":"S12-L02-2","text":"Не изменится: фосфорилирование влияет на связь с ATG8, а не с убиквитином.","correct":false,"feedback":"Фосфорилирование влияет и на связывание убиквитина: по Ser473 оно расширяет набор цепей, которые узнаёт UBAN (Richter 2016)."},{"id":"S12-L02-3","text":"Расширится: OPTN свяжет более разнообразные цепи убиквитина.","correct":true,"feedback":"TBK1-зависимое фосфорилирование UBAN по Ser473 расширяет связывающую способность OPTN; это часть положительной обратной связи при митофагии (Richter 2016)."}]},"widget":{"kind":"net","title":"","s":{"title":"Модули трёх рецепторов и их партнёры","status":"Схема механизма · качественные состояния","static":["Схема показывает модули рецептора (PB1, UBD, LIR, FIR или SKICH) и их партнёров: другую копию рецептора, убиквитин на грузе, белки ATG8 и комплекс ULK1–FIP200.","Можно выбрать p62, NDP52 или OPTN."],"ctrls":[{"id":"r","type":"group","label":"Рецептор","opts":["p62","NDP52","OPTN"]}],"W":516,"H":384,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"усиление без обязательного участия","nodes":["жёлтая рамка — модуль или звено работает","пунктирная рамка — не работает или снижено","крест — модуль удалён или мутирован"]},"zones":[{"x":62,"y":18,"w":160,"h":346,"lx":72,"ly":360,"t":"рецептор","tn":"рецептор","c":"plain","n":[8,18,170,352,18,362]}],"mem":[],"nodes":{"pb":{"p":[142,50,120,44],"n":[92,50,130,40],"t":"PB1","fs":17},"ub":{"p":[142,130,120,44],"n":[92,140,130,40],"t":"UBA","fs":16},"lr":{"p":[142,210,120,44],"n":[92,230,130,40],"t":"LIR","fs":17},"fi":{"p":[142,290,134,52],"n":[92,320,130,40],"t":"FIR","fs":15},"pp":{"p":[410,50,150,44],"n":[260,50,130,40],"t":"другая копия\nрецептора","fs":14,"tn":"другая копия\nрецептора"},"uu":{"p":[410,130,150,44],"n":[260,140,130,40],"t":"убиквитин\nна грузе","fs":14,"tn":"убиквитин\nна грузе"},"aa":{"p":[410,210,150,44],"n":[260,230,130,40],"t":"ATG8\nна мембране","fs":14,"tn":"ATG8\nна мембране"},"ff":{"p":[410,290,150,44],"n":[260,320,130,40],"t":"ULK1–\nFIP200","fs":14,"tn":"ULK1–\nFIP200"}},"edges":{"b1":{"a":"pb","b":"pp","k":"bind"},"b2":{"a":"ub","b":"uu","k":"bind"},"b3":{"a":"lr","b":"aa","k":"bind"},"b4":{"a":"fi","b":"ff","k":"bind"}},"st":{"0":{"n":{"pb":"on","ub":"on","lr":"on","fi":"on","pp":"on","uu":"on","aa":"on","ff":"on"},"e":{"b1":"on","b2":"on","b3":"on","b4":"on"},"t":{"ub":"UBA","lr":"LIR","fi":"FIR, перекрыт\nс LIR"},"tn":{"fi":"FIR (с LIR)"},"b":{},"m":[["Узнавание убиквитина","UBA"],["Олигомеризация","PB1"],["Связывание FIP200","участок, перекрытый с LIR"]],"note":"У p62 есть PB1, UBA, LIR и участок связывания FIP200. Участок FIP200 перекрывается с LIR: на одной молекуле p62 FIP200 и ATG8 конкурируют за связывание (Turco 2019, эксперименты in vitro)."},"1":{"n":{"pb":"off","ub":"on","lr":"on","fi":"on","pp":"hide","uu":"on","aa":"on","ff":"on"},"e":{"b1":"hide","b2":"on","b3":"on","b4":"on"},"t":{"ub":"цинковые\nпальцы","lr":"LIR\n(CLIR)","fi":"SKICH","pb":"PB1: нет"},"tn":{"ub":"цинковые\nпальцы","lr":"LIR (CLIR)","fi":"SKICH","pb":"PB1: нет"},"b":{},"m":[["Узнавание убиквитина","цинковые пальцы"],["Олигомеризация","PB1 нет"],["Связывание FIP200","домен SKICH"]],"note":"NDP52 связывает убиквитин цинковыми пальцами, ATG8 — неканоническим LIR (CLIR), FIP200 — доменом SKICH. К митохондриям NDP52 приходит и без SKICH: для этого нужен цинковый палец ZF2, но без SKICH FIP200 не связывается (Vargas 2019)."},"2":{"n":{"pb":"off","ub":"on","lr":"on","fi":"low","pp":"hide","uu":"on","aa":"on","ff":"base"},"e":{"b1":"hide","b2":"on","b3":"on","b4":"off"},"t":{"ub":"UBAN","lr":"LIR","fi":"FIR?\nне определён","pb":"PB1: нет"},"tn":{"ub":"UBAN","lr":"LIR","fi":"FIR?","pb":"PB1: нет"},"b":{},"m":[["Узнавание убиквитина","UBAN"],["Олигомеризация","PB1 нет"],["Связывание FIP200","способ не определён"]],"note":"У OPTN есть UBAN и LIR. Способ связывания FIP200 не определён: известно, что оно зависит от киназной активности TBK1 (Adriaenssens 2022)."}},"fs":15,"nfs":14,"lfs":12.5,"zfs":13}}},{"id":"sar-avidity","number":3,"section":0,"title":"Почему слабые связи дают избирательность","question":1,"questions":[1],"keywords":["авидность","олигомеризация","PB1","p62","убиквитин","LC3B","скорость отсоединения","конденсат","цепи убиквитина"],"lead":["Одиночный модуль рецептора связывает убиквитин или белок ATG8 слабо и обратимо.","Избирательность возникает из сочетания многих таких контактов: [[T08|авидность]] частицы растёт, а сродство каждого контакта остаётся прежним."],"mechanism":["Один [[T04|UBD]] слабо и обратимо связывает одну молекулу убиквитина, а один [[T05|LIR]] — один белок [[T03|ATG8]].","Домен PB1 собирает p62 в олигомеры, и на одной частице оказывается много модулей UBA и LIR.","Олигомер удерживается там, где метки и ATG8 расположены плотно: на грузе с несколькими цепями и на мембране [[T13|фагофора]]."],"paragraphs":["Сродство одиночного UBA p62 к убиквитину очень низкое (Wurzer 2015). Такая слабость полезна: p62 связывается преимущественно с грузом, на котором метки сгруппированы, и не вмешивается в другие процессы с участием убиквитина (Adriaenssens 2022).","Домен PB1 собирает p62 в олигомеры: рекомбинантный p62 дикого типа состоял в среднем из 24 молекул, а вариант без PB1 — из трёх. Олигомеризация не повышала сродства отдельного LIR к LC3B, но снижала скорость отсоединения частицы от поверхности, плотно покрытой LC3B или убиквитином (Wurzer 2015).","После разведения раствора p62 дикого типа оставался на частицах с LC3B до 1,5 ч, а p62 без PB1 отсоединялся сразу. При снижении плотности LC3B на поверхности обмен p62 дикого типа ускорялся, а у p62 без PB1 не менялся (Wurzer 2015).","Имеет значение и устройство метки. В системе из очищенных белков p62 и убиквитинированные субстраты собирались в скопления, если у субстрата было не менее двух цепей длиной больше трёх убиквитинов (Zaffagnini 2018). Цепь K63 индуцировала фазовое разделение p62 с образованием [[T09|жидкоподобных капель]] в пробирке (Sun 2018).","Граница вывода: предпочтение цепей K63 или K48 в основном показано при сверхэкспрессии и in vitro (Adriaenssens 2022)."],"trap":["Чем прочнее один контакт рецептора с меткой, тем точнее выбор груза.","Избирательность определяется числом одновременных слабых контактов: олигомер p62 с множеством UBA и LIR удерживается на плотной поверхности с метками и ATG8, но не на одиночной молекуле убиквитина (Wurzer 2015; Adriaenssens 2022)."],"conditions":"Данные Wurzer 2015 получены в пробирке на рекомбинантных белках и поверхностях, покрытых LC3B или убиквитином, а также в клетках HeLa; Zaffagnini 2018 — в системе из очищенных белков; Sun 2018 — в пробирке и в клетках. Количества контактов на схеме условные, числа молекул в частице взяты из Wurzer 2015.","sources":["Wurzer2015","Zaffagnini2018","Sun2018","Adriaenssens2022"],"quiz":{"id":"S12-L03","rev":1,"question":"Очищенный p62 дикого типа и p62 без домена PB1 удерживаются на гранулах, плотно покрытых LC3B. Плотность LC3B на гранулах снизили в 10 раз. Как изменится скорость обмена p62 между гранулами и раствором?","options":[{"id":"S12-L03-1","text":"У p62 дикого типа вырастет, у p62 без PB1 почти не изменится.","correct":true,"feedback":"Олигомер удерживается множеством одновременных контактов, поэтому при снижении плотности LC3B число контактов падает, и обмен ускоряется. Вариант без PB1 держится на одиночных контактах и от плотности почти не зависит (Wurzer 2015)."},{"id":"S12-L03-2","text":"У обоих вариантов вырастет примерно в одинаковой степени.","correct":false,"feedback":"У p62 без PB1 скорость обмена не менялась даже при снижении плотности LC3B в 10 раз: одновременных контактов у него и так немного (Wurzer 2015)."},{"id":"S12-L03-3","text":"У p62 дикого типа не изменится, у p62 без PB1 вырастет.","correct":false,"feedback":"Зависимость обратная: именно у p62 дикого типа обмен ускорялся при снижении плотности LC3B, потому что уменьшалось число одновременных контактов олигомера (Wurzer 2015)."}]},"widget":{"kind":"net","title":"","s":{"title":"Число контактов и удержание на грузе","status":"Схема механизма · качественные состояния","static":["Схема показывает груз с метками убиквитина, рецептор p62 и белки ATG8 на мембране фагофора.","Можно сравнить олигомер p62 и p62 без домена PB1 при одной молекуле убиквитина и при нескольких длинных цепях."],"ctrls":[{"id":"r","type":"group","label":"Рецептор","opts":["Олигомер p62 (PB1 цел)","p62 без PB1 (три молекулы)"]},{"id":"m","type":"group","label":"Метки на грузе","opts":["Одна молекула убиквитина","Несколько длинных цепей"]}],"W":516,"H":250,"NW":340,"NH":392,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"усиление без обязательного участия","nodes":["жёлтая рамка — удержание на грузе долгое","точечная рамка — удержание кратковременное"]},"zones":[],"mem":[],"nodes":{"cg":{"p":[66,122,110,116],"n":[170,60,270,64],"t":"груз с метками\nубиквитина","fs":14,"tn":"груз с метками убиквитина"},"rc":{"p":[258,122,124,116],"n":[170,196,270,84],"t":"рецептор p62","fs":15,"tn":"рецептор p62"},"at":{"p":[446,122,110,116],"n":[170,330,270,64],"t":"белки ATG8\nна мембране\nфагофора","fs":14,"tn":"белки ATG8 на мембране фагофора"}},"edges":{"e1":{"a":"cg","b":"rc","k":"bind","d":[0,-24],"dn":[92,4]},"e2":{"a":"rc","b":"at","k":"bind","d":[0,-24],"dn":[92,4]}},"st":{"0-0":{"n":{"cg":"on","rc":"low","at":"on"},"e":{"e1":"on","e2":"on"},"t":{"cg":"одна\nмолекула\nубиквитина","rc":"олигомер p62:\nмного UBA\nи LIR"},"tn":{"cg":"одна молекула убиквитина","rc":"олигомер p62: много UBA и LIR"},"et":{"e1":"один\nконтакт","e2":"много\nконтактов"},"b":{},"m":[["Одновременных контактов с грузом","один"],["Удержание на грузе","кратковременное"]],"note":"Одна молекула убиквитина даёт олигомеру только один контакт, остальные UBA не задействованы. Обмен p62 на поверхности с моноубиквитином шёл быстрее, чем на поверхности с тетраубиквитином, и ускорялся при снижении плотности убиквитина (Wurzer 2015, в пробирке)."},"0-1":{"n":{"cg":"on","rc":"on","at":"on"},"e":{"e1":"on","e2":"on"},"t":{"cg":"несколько\nцепей из\nубиквитинов","rc":"олигомер p62:\nмного UBA\nи LIR"},"tn":{"cg":"несколько цепей из убиквитинов","rc":"олигомер p62: много UBA и LIR"},"et":{"e1":"много\nконтактов","e2":"много\nконтактов"},"b":{},"m":[["Одновременных контактов с грузом","много"],["Удержание на грузе","долгое"]],"note":"Олигомер одновременно удерживается на нескольких цепях убиквитина и на нескольких белках ATG8. После разведения p62 дикого типа оставался на частицах с LC3B до 1,5 ч (Wurzer 2015); субстраты с двумя и более цепями длиной больше трёх убиквитинов собирались с p62 в скопления (Zaffagnini 2018). Условия: очищенные белки."},"1-0":{"n":{"cg":"on","rc":"low","at":"on"},"e":{"e1":"on","e2":"on"},"t":{"cg":"одна\nмолекула\nубиквитина","rc":"p62 без PB1:\nмалые\nкомплексы"},"tn":{"cg":"одна молекула убиквитина","rc":"p62 без PB1: малые комплексы"},"et":{"e1":"один\nконтакт","e2":"несколько\nконтактов"},"b":{},"m":[["Одновременных контактов с грузом","один"],["Удержание на грузе","кратковременное"]],"note":"p62 без PB1 образует малые комплексы (в работе — тримеры). На одной молекуле убиквитина контакт слабый и обратимый, и комплекс быстро обменивается с раствором (Wurzer 2015, в пробирке)."},"1-1":{"n":{"cg":"on","rc":"low","at":"on"},"e":{"e1":"on","e2":"on"},"t":{"cg":"несколько\nцепей из\nубиквитинов","rc":"p62 без PB1:\nмалые\nкомплексы"},"tn":{"cg":"несколько цепей из убиквитинов","rc":"p62 без PB1: малые комплексы"},"et":{"e1":"несколько\nконтактов","e2":"несколько\nконтактов"},"b":{},"m":[["Одновременных контактов с грузом","несколько"],["Удержание на грузе","кратковременное"]],"note":"p62 без PB1 удерживается на поверхности с убиквитином хуже олигомера: оба варианта частично отсоединялись после разведения, но олигомер оставался связанным стабильнее (Wurzer 2015, в пробирке)."}},"fs":15,"nfs":14,"lfs":12.5,"zfs":13}}},{"id":"sar-initiation","number":4,"section":0,"title":"Рецептор как организатор аутофагосомы","question":1,"questions":[1],"keywords":["ULK1","FIP200","SKICH","ATG8","инициация","mTORC1","NDP52","OPTN","TBK1","слияние с лизосомой"],"lead":["Рецептор не только связывает груз и белки ATG8, но и привлекает к грузу [[T07|комплекс ULK1–FIP200]].","Так построение аутофагосомы начинается у груза, а белки ATG8 усиливают процесс и нужны для слияния с лизосомой."],"mechanism":["Рецептор на грузе связывает FIP200 участком [[T06|FIR или SKICH]] и привлекает комплекс ULK1–FIP200 к грузу.","У груза строится [[T13|фагофор]]; белки [[T03|ATG8]] появляются на его мембране.","Через LIR белки ATG8 привлекают ещё рецепторы, а после замыкания аутофагосомы нужны для слияния с лизосомой."],"paragraphs":["При голодании построение аутофагосомы запускает подавление mTOR. При селективной аутофагии аутофагосому у груза запускает рецептор, и mTOR при этом может оставаться активным (Adriaenssens 2022).","В клетках HeLa без пяти рецепторов NDP52 и OPTN привлекали ULK1 к митохондриям; при посадке PINK1 на митохондрию замена F178A в LIR OPTN привлечению ULK1 не мешала, поэтому оно идёт выше по цепи, чем связь с LC3 (Lazarou 2015). NDP52 связывает FIP200 доменом SKICH, и TBK1 облегчает эту связь. При принудительной посадке на митохондрию NDP52 без SKICH не привлекал FIP200, и митофагия не наступала; ULK1 активировался на грузе независимо от AMPK и mTOR (Vargas 2019).","Без всех шести белков ATG8 аутофагосомы вокруг митохондрий образуются, но не сливаются с лизосомами (Nguyen 2016). Белки ATG8 привлекают к растущей мембране ещё OPTN и NDP52 через LIR и усиливают митофагию; мутации LIR снижали эффективность митофагии (Padman 2019).","Граница вывода: данные получены в клетках HeLa, в нокаутных линиях и при принудительной посадке рецептора; в разных системах вклад LIR оценивают по-разному (Padman 2019; Vargas 2019)."],"trap":["Без белков ATG8 аутофагосома не образуется, а отбор груза обеспечивает только связь LIR с ATG8.","В клетках HeLa без всех шести белков ATG8 аутофагосомы образуются, но не сливаются с лизосомами (Nguyen 2016). Привлечение ULK1 рецепторами идёт выше по цепи, чем белки ATG8 (Lazarou 2015; Vargas 2019); ATG8 усиливают привлечение рецепторов (Padman 2019)."],"conditions":"Клетки HeLa: нокаут пяти рецепторов и митофагия при повреждении митохондрий в клетках с Parkin; мутация F178A в LIR OPTN (Lazarou 2015; Padman 2019), принудительная посадка PINK1 или NDP52 на митохондрию (метод описан в последнем шаге раздела; Lazarou 2015; Vargas 2019), линии без белков ATG8 (Nguyen 2016). Сроки: часы после воздействия. Схема качественная.","sources":["Adriaenssens2022","Lazarou2015","Vargas2019","Padman2019","Nguyen2016"],"quiz":{"id":"S12-L04","rev":1,"question":"В клетках HeLa с Parkin нет всех шести белков ATG8. В них запускают митофагию деполяризацией митохондрий. Что произойдёт с аутофагосомами вокруг повреждённых митохондрий?","options":[{"id":"S12-L04-1","text":"Не образуются: без ATG8 комплекс ULK1–FIP200 не привлекается к грузу.","correct":false,"feedback":"Привлечение ULK1 рецепторами идёт выше по цепи, чем белки ATG8, и не зависит от связи с LC3 (Lazarou 2015; Vargas 2019)."},{"id":"S12-L04-2","text":"Образуются вокруг митохондрий, но не сливаются с лизосомами.","correct":true,"feedback":"В клетках без всех шести белков ATG8 аутофагосомы вокруг митохондрий образуются, но слияние с лизосомой нарушено (Nguyen 2016). Они мельче, а начальная скорость образования ниже."},{"id":"S12-L04-3","text":"Образуются и сливаются с лизосомами с прежней скоростью.","correct":false,"feedback":"Белки ATG8 нужны для слияния с лизосомой, и без них оно нарушено (Nguyen 2016); привлечение рецепторов к растущей мембране тоже ослаблено (Padman 2019)."}]},"widget":{"kind":"net","title":"","s":{"title":"От рецептора на грузе к слиянию с лизосомой","status":"Схема механизма · качественные состояния","static":["Схема показывает цепь событий: рецептор на грузе, комплекс ULK1–FIP200, построение фагофора, белки ATG8 на мембране и слияние с лизосомой.","Можно сравнить три состояния: все модули на месте, нет участка связывания FIP200, нет всех шести белков ATG8."],"ctrls":[{"id":"m","type":"group","label":"Изменение","opts":["Все модули на месте","Нет участка связывания FIP200","Нет всех шести белков ATG8"]}],"W":516,"H":372,"NW":340,"NH":392,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"усиление без обязательного участия","nodes":["жёлтая рамка — модуль или звено работает","пунктирная рамка — не работает или снижено","крест — модуль удалён или мутирован"]},"zones":[],"mem":[],"nodes":{"rc":{"p":[70,66,116,62],"n":[62,52,112,56],"t":"рецептор\nна грузе","fs":15},"ul":{"p":[258,66,116,62],"n":[270,52,112,56],"t":"ULK1–\nFIP200","fs":15,"tn":"ULK1–\nFIP200"},"bl":{"p":[446,66,116,62],"n":[270,150,120,56],"t":"построение\nфагофора","fs":15,"tn":"построение\nфагофора"},"a8":{"p":[446,196,116,62],"n":[270,248,120,56],"t":"ATG8 на\nмембране","fs":15,"tn":"ATG8 на\nмембране"},"fu":{"p":[446,316,116,62],"n":[270,340,120,56],"t":"слияние с\nлизосомой","fs":15,"tn":"слияние с\nлизосомой"}},"edges":{"e1":{"a":"rc","b":"ul","k":"bind","t":"FIR или\nSKICH","d":[0,-24],"tn":"FIR или\nSKICH","dn":[0,-8]},"e2":{"a":"ul","b":"bl","k":"seq","d":[0,-8]},"e3":{"a":"bl","b":"a8","k":"seq"},"e4":{"a":"a8","b":"fu","k":"seq"},"e5":{"a":"a8","b":"rc","k":"act","t":"ещё рецепторы\nчерез LIR","tn":"ещё рецепторы\nчерез LIR","d":[26,48]}},"st":{"0":{"n":{"rc":"on","ul":"on","bl":"on","a8":"on","fu":"on"},"e":{"e1":"on","e2":"on","e3":"on","e4":"on","e5":"on"},"b":{},"m":[["Комплекс ULK1–FIP200 у груза","привлечён"],["Фагофор у груза","строится"],["Слияние с лизосомой","идёт"]],"note":"Рецептор привлекает ULK1–FIP200 и тем начинает построение фагофора у груза. Белки ATG8 на мембране привлекают ещё рецепторы и после замыкания аутофагосомы нужны для слияния с лизосомой (Lazarou 2015; Padman 2019; Nguyen 2016)."},"1":{"n":{"rc":"on","ul":"base","bl":"off","a8":"base","fu":"off"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","e5":"off"},"b":{},"m":[["Комплекс ULK1–FIP200 у груза","не привлечён"],["Фагофор у груза","не строится"],["Слияние с лизосомой","нет"]],"note":"Рецептор остаётся на грузе, но без участка связывания FIP200 комплекс инициации не привлекается. NDP52 без SKICH при посадке на митохондрию не привлекал FIP200, и митофагия не наступала (Vargas 2019; клетки HeLa)."},"2":{"n":{"rc":"on","ul":"on","bl":"low","a8":"abs","fu":"off"},"e":{"e1":"on","e2":"on","e3":"on","e4":"off","e5":"off"},"b":{},"m":[["Комплекс ULK1–FIP200 у груза","привлечён"],["Фагофор у груза","строится, аутофагосомы мельче"],["Слияние с лизосомой","нарушено"]],"note":"Без всех шести белков ATG8 аутофагосомы образуются и захватывают митохондрии, но не сливаются с лизосомами; они мельче, и начальная скорость их образования ниже (Nguyen 2016). Привлечение рецепторов к растущей мембране ослаблено (Padman 2019)."}},"fs":15,"nfs":14,"lfs":12.5,"zfs":13,"nlfs":12}}},{"id":"sar-network","number":5,"section":0,"title":"Какие рецепторы работают на каком грузе","question":1,"questions":[1],"keywords":["p62","NBR1","TAX1BP1","NDP52","OPTN","BNIP3","FAM134B","N-дегрон","митофагия","ЭПР-фагия"],"lead":["Один и тот же рецептор работает на разных грузах, а один груз обслуживает несколько рецепторов.","Какой рецептор ведущий, зависит от груза, метки и типа клеток."],"mechanism":["Растворимые [[T02|рецепторы]] p62, NBR1, TAX1BP1, NDP52 и OPTN узнают убиквитин на грузе, но на разных грузах ведущие разные.","[[T11|Мембранные рецепторы]] BNIP3, NIX, FUNDC1 на митохондриях и FAM134B в ЭПР встроены в мембрану органеллы и не требуют убиквитинирования её поверхности.","Метка может быть и не убиквитином: [[T12|N-концевой аргинин]] белка BiP связывается с ZZ-доменом p62."],"paragraphs":["Основными рецепторами для агрегатов названы p62, NBR1 и TAX1BP1, для митохондрий в системе PINK1–Parkin — OPTN и NDP52 (Adriaenssens 2022). У мышей с нарушенной аутофагией p62 нужен для появления убиквитин-положительных включений в гепатоцитах и нейронах (Komatsu 2007).","В клетках HeLa с Parkin и без пяти растворимых рецепторов митофагия останавливалась; восстанавливали её OPTN и NDP52, TAX1BP1 слабее. p62 и NBR1 приходили к митохондриям, но митофагию не восстанавливали, а нокаут одного NDP52 или одного OPTN дефекта не вызывал (Lazarou 2015).","Мембранные рецепторы BNIP3, NIX и FUNDC1 описаны при гипоксии, а BNIP3 и NIX — и при созревании эритроцитов; при потере железа вклад отдельных рецепторов не установлен. BNIP3 и NIX включаются димеризацией, FUNDC1 — дефосфорилированием (Adriaenssens 2022). FAM134B — рецептор ЭПР: при его подавлении ЭПР расширяется, при избытке фрагментируется и разрушается в лизосоме (Khaminets 2015).","BiP с N-концевым аргинином связывался с ZZ-доменом p62, вызывал олигомеризацию p62, усиливал его связь с LC3 и разрушался вместе с p62 (Cha-Molstad 2015).","Граница вывода: набор рецепторов зависит от типа клеток; NDP52 не экспрессируется в нейронах, и там OPTN особенно важен (Adriaenssens 2022)."],"trap":["Любой рецептор, пришедший к грузу, может заменить другой.","Приход рецептора к грузу не означает, что он ведёт аутофагию: p62 и NBR1 приходили к повреждённым митохондриям, но митофагию не восстанавливали (Lazarou 2015). Взаимозаменяемость зависит от груза и типа клеток (Adriaenssens 2022)."],"conditions":"Перечень основных рецепторов — по обзору Adriaenssens 2022. Данные для митофагии получены в клетках HeLa с Parkin после повреждения митохондрий (Lazarou 2015); для FAM134B — в клетках человека и у мышей (Khaminets 2015); для BiP — в клетках человека (Cha-Molstad 2015); для p62 — у мышей с нарушенной аутофагией (Komatsu 2007). Оценки «ведущий» и «слабее» качественные.","sources":["Adriaenssens2022","Lazarou2015","Komatsu2007","Khaminets2015","Cha-Molstad2015"],"quiz":{"id":"S12-L05","rev":1,"question":"В клетках HeLa с Parkin нет пяти растворимых рецепторов, и митофагия при повреждении митохондрий остановлена. В клетки по одному возвращают рецептор. Возвращение какого из перечисленных рецепторов восстановит митофагию?","options":[{"id":"S12-L05-1","text":"p62: связывает убиквитин на повреждённых митохондриях.","correct":false,"feedback":"p62 приходил к митохондриям, но митофагию не восстанавливал (Lazarou 2015): приход к грузу ещё не означает запуск аутофагосомы."},{"id":"S12-L05-2","text":"NBR1: связывает убиквитин и p62 на повреждённых митохондриях.","correct":false,"feedback":"NBR1, как и p62, приходил к митохондриям, но митофагию не восстанавливал (Lazarou 2015)."},{"id":"S12-L05-3","text":"OPTN: связывает убиквитин на повреждённых митохондриях.","correct":true,"feedback":"OPTN и NDP52 восстанавливали митофагию, TAX1BP1 — слабее; мутанты OPTN без убиквитин-связывающего домена митофагию не восстанавливали (Lazarou 2015). OPTN, кроме того, привлекает ULK1."}]},"widget":{"kind":"net","title":"","s":{"title":"Ведущие рецепторы для разных грузов","status":"Схема механизма · качественные состояния","static":["Схема показывает груз и рецепторы: пять растворимых и два вида мембранных.","Для пяти грузов отмечено, какие рецепторы ведущие."],"ctrls":[{"id":"g","type":"group","label":"Груз","opts":["Агрегаты белков","Митохондрия, Parkin","Митохондрия, гипоксия","ЭПР","Белок с N-концевым Arg"]}],"W":516,"H":442,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"усиление без обязательного участия","nodes":["жёлтая рамка — ведущий рецептор для этого груза","точечная рамка — участвует слабее","пунктирная рамка — ведущим не назван"]},"zones":[{"x":284,"y":14,"w":218,"h":292,"lx":492,"ly":296,"t":"растворимые рецепторы","tn":"растворимые","c":"plain","n":[198,14,134,292,324,298],"a":"end"},{"x":284,"y":316,"w":218,"h":118,"lx":492,"ly":334,"t":"в мембране органеллы","tn":"в мембране","c":"er","n":[198,316,134,114,324,334],"a":"end"}],"mem":[],"nodes":{"cg":{"p":[84,136,120,100],"n":[64,206,116,340],"t":"груз","fs":15,"tn":"груз"},"p62":{"p":[392,44,170,34],"n":[262,44,130,34],"t":"p62","fs":17},"nbr":{"p":[392,90,170,34],"n":[262,90,130,34],"t":"NBR1","fs":17},"tax":{"p":[392,136,170,34],"n":[262,136,130,34],"t":"TAX1BP1","fs":17},"ndp":{"p":[392,182,170,34],"n":[262,182,130,34],"t":"NDP52","fs":17},"opt":{"p":[392,228,170,34],"n":[262,228,130,34],"t":"OPTN","fs":17},"bn":{"p":[392,360,170,44],"n":[262,366,130,44],"t":"BNIP3, NIX,\nFUNDC1","fs":15,"tn":"BNIP3, NIX,\nFUNDC1"},"fam":{"p":[392,406,170,28],"n":[262,416,130,28],"t":"FAM134B","fs":16}},"edges":{"p62":{"a":"cg","b":"p62","k":"bind"},"nbr":{"a":"cg","b":"nbr","k":"bind"},"tax":{"a":"cg","b":"tax","k":"bind"},"ndp":{"a":"cg","b":"ndp","k":"bind"},"opt":{"a":"cg","b":"opt","k":"bind"},"bn":{"a":"cg","b":"bn","k":"bind"},"fam":{"a":"cg","b":"fam","k":"bind"}},"st":{"0":{"n":{"p62":"on","nbr":"on","tax":"on","ndp":"off","opt":"off","bn":"off","fam":"off","cg":"on"},"e":{"p62":"on","nbr":"on","tax":"on","ndp":"hide","opt":"hide","bn":"hide","fam":"hide"},"t":{"cg":"агрегаты\nбелков с\nубиквитином"},"tn":{"cg":"агрегаты\nбелков с\nубиквитином"},"b":{},"m":[["Ведущие рецепторы","p62, NBR1, TAX1BP1"],["Метка на грузе","убиквитин"]],"note":"Для агрегатов основными названы p62, NBR1 и TAX1BP1 (Adriaenssens 2022). У мышей с нарушенной аутофагией p62 был нужен для появления убиквитин-положительных включений в гепатоцитах и нейронах (Komatsu 2007).","p":{"cg":[84,90]}},"1":{"n":{"p62":"off","nbr":"off","tax":"low","ndp":"on","opt":"on","bn":"off","fam":"off","cg":"on"},"e":{"p62":"hide","nbr":"hide","tax":"on","ndp":"on","opt":"on","bn":"hide","fam":"hide"},"t":{"cg":"митохондрия\nс Parkin,\nубиквитин"},"tn":{"cg":"митохондрия\nс Parkin,\nубиквитин"},"b":{},"m":[["Ведущие рецепторы","NDP52, OPTN"],["Метка на грузе","убиквитин, фосфорилированный PINK1"]],"note":"В клетках HeLa с Parkin митофагию восстанавливали NDP52 и OPTN, TAX1BP1 слабее; p62 и NBR1 приходили к митохондриям, но митофагию не восстанавливали (Lazarou 2015).","p":{"cg":[84,182]}},"2":{"n":{"p62":"off","nbr":"off","tax":"off","ndp":"off","opt":"off","bn":"on","fam":"off","cg":"on"},"e":{"p62":"hide","nbr":"hide","tax":"hide","ndp":"hide","opt":"hide","bn":"on","fam":"hide"},"t":{"cg":"митохондрия,\nгипоксия"},"tn":{"cg":"митохондрия,\nгипоксия"},"b":{},"m":[["Ведущие рецепторы","BNIP3, NIX, FUNDC1"],["Метка на грузе","рецептор в мембране"]],"note":"Эти мембранные рецепторы описаны при гипоксии и созревании эритроцитов (при потере железа вклад отдельных рецепторов не установлен) и участвуют в базальном обороте митохондрий. Они встроены в мембрану; BNIP3 и NIX включаются димеризацией, FUNDC1 — дефосфорилированием (Adriaenssens 2022).","p":{"cg":[84,372]}},"3":{"n":{"p62":"off","nbr":"off","tax":"off","ndp":"off","opt":"off","bn":"off","fam":"on","cg":"on"},"e":{"p62":"hide","nbr":"hide","tax":"hide","ndp":"hide","opt":"hide","bn":"hide","fam":"on"},"t":{"cg":"ЭПР"},"tn":{"cg":"ЭПР"},"b":{},"m":[["Ведущий рецептор","FAM134B"],["Метка на грузе","рецептор в мембране ЭПР"]],"note":"FAM134B — резидентный белок ЭПР, который связывает LC3 и GABARAP. В клетках человека его подавление приводит к расширению ЭПР, а избыток — к фрагментации и разрушению в лизосоме (Khaminets 2015).","p":{"cg":[84,372]}},"4":{"n":{"p62":"on","nbr":"off","tax":"off","ndp":"off","opt":"off","bn":"off","fam":"off","cg":"on"},"e":{"p62":"on","nbr":"hide","tax":"hide","ndp":"hide","opt":"hide","bn":"hide","fam":"hide"},"t":{"cg":"белок с\nN-концевым\nаргинином"},"tn":{"cg":"белок с\nN-концевым\nаргинином"},"b":{},"m":[["Ведущий рецептор","p62 (ZZ-домен)"],["Метка на грузе","N-концевой аргинин"]],"note":"BiP с N-концевым аргинином связывался с ZZ-доменом p62; p62 олигомеризовался, усиливал связь с LC3, и BiP разрушался вместе с p62 (Cha-Molstad 2015, клетки человека).","p":{"cg":[84,60]}}},"fs":15,"nfs":14,"lfs":12.5,"zfs":13}}},{"id":"sar-measure","number":6,"section":0,"title":"Как показать, что рецептор связывает груз и ATG8","question":1,"questions":[1],"keywords":["иммунопреципитация","pull-down","колокализация","реконструкция","нокаут","LIR-мутант","связывание и функция","сверхэкспрессия"],"lead":["Связывание рецептора с грузом и с белком ATG8 проверяют на уровне белков, клеток и очищенных компонентов.","Каждый метод отвечает на свой вопрос и имеет свою границу вывода."],"mechanism":["[[T14|Совместная иммунопреципитация и pull-down]] показывают связывание белков в лизате или в пробирке, колокализация — положение в клетке.","Возврат рецептора или его мутанта в клетки без рецепторов проверяет функцию; реконструкция из очищенных компонентов и принудительная посадка на органеллу проверяют достаточность.","Контроли — мутация LIR, мутация UBD и клетки без рецептора; связывание не равно работе рецептора на грузе."],"paragraphs":["Связывание проверяют так: белок-наживку на гранулах инкубируют с лизатом клеток или с очищенным рецептором, промывают гранулы и выявляют связанный белок иммуноблотом. Эндогенный p62 в клетках подавляют, чтобы анализировать только вариант с мутацией, а специфичность проверяют мутацией LIR или UBD и гранулами с одним GST или GFP (Wurzer 2015).","Промывка сохраняет лишь контакты, которые не успевают распасться, поэтому слабые обратимые взаимодействия этим методом выявляются плохо (Wurzer 2015). [[T15|Колокализация]] показывает общее положение сигналов, но не контакт: к митохондриям приходили все пять рецепторов, а митофагию восстанавливали не все (Lazarou 2015).","Функцию проверяют в клетках без рецепторов: возвращают целый рецептор или его мутанты и измеряют митофагию (Lazarou 2015). Достаточность проверяют принудительной посадкой рецептора на органеллу (Vargas 2019) и в реконструированной системе из очищенных белков (Zaffagnini 2018).","Граница вывода: различия между цепями K63 и K48 во многом получены при сверхэкспрессии и in vitro (Adriaenssens 2022); связывание в пробирке не показывает работу рецептора в клетке без проверки функции."],"trap":["Если белки связываются при совместной иммунопреципитации, значит, рецептор ведёт аутофагию этого груза.","Связывание показывает физическое взаимодействие, но не функцию: p62 и NBR1 приходили к повреждённым митохондриям, но митофагию не восстанавливали (Lazarou 2015). Функцию проверяют возвратом рецептора и его мутантов в клетки без рецепторов."],"conditions":"Описаны методы иммунопреципитации, колокализации, реконструкции, возврата в нокаутные клетки и принудительной посадки (клетки HeLa, очищенные белки, гигантские везикулы). Пиктограммы условные: это не данные экспериментов.","sources":["Wurzer2015","Zaffagnini2018","Lazarou2015","Vargas2019","Adriaenssens2022"],"quiz":{"id":"S12-L06","rev":1,"question":"В клетках HeLa p62 без домена PB1 после иммунопреципитации GFP-LC3B дал на блоте едва заметную полосу, хотя его LIR цел. Какое объяснение согласуется с этим результатом?","options":[{"id":"S12-L06-1","text":"Одиночный LIR связывает LC3B слабо и обратимо, поэтому связь частично теряется при промывке гранул.","correct":true,"feedback":"Олигомеризация не меняет сродство отдельного LIR, но снижает скорость отсоединения. По интерпретации авторов, у варианта без PB1 слабые контакты частично теряются при промывке, и взаимодействие видно лишь при долгой экспозиции блота (Wurzer 2015)."},{"id":"S12-L06-2","text":"LIR цел, поэтому связь с LC3B так же прочна, как у белка дикого типа, а слабая полоса случайна.","correct":false,"feedback":"Цельный LIR не делает связь такой же: у p62 дикого типа взаимодействие с LC3B сильнее, чем у варианта без PB1 (Wurzer 2015)."},{"id":"S12-L06-3","text":"Связи p62 без PB1 с LC3B нет совсем, так как для связи с LC3B необходим домен PB1, а не LIR.","correct":false,"feedback":"Связь есть: полоса p62 без PB1 становилась заметной при долгой экспозиции блота (Wurzer 2015). Слабая полоса не означает полного отсутствия связи."}]},"widget":{"kind":"cards","title":"","s":{"title":"Методы: связывание, положение, функция","status":"Схема метода · условные пиктограммы","static":["Схема описывает пять методов: иммунопреципитацию, колокализацию, реконструкцию из очищенных компонентов, возврат рецептора в клетки без рецепторов и принудительную посадку на органеллу.","Для каждого метода указаны: что измеряют, как, контроль и граница вывода."],"opts_label":"Метод","opts":["Иммунопреципитация","Колокализация","Реконструкция","Возврат в нокаутные клетки","Принудительная посадка"],"heads":["Что измеряют","Как","Контроль","Граница вывода"],"cards":[{"v":["Связывается ли рецептор с убиквитином или с белком ATG8 в лизате клеток или в пробирке.","Белок-наживку (например, GST-LC3B на гранулах или GFP-LC3B, выделенный антителом) инкубируют с лизатом клеток или с очищенным рецептором, гранулы промывают, связанный белок выявляют иммуноблотом.","Рецептор с мутацией LIR или мутацией UBD; гранулы с одним GST или одним GFP; фракция «вход» на отдельной дорожке.","Промывка сохраняет контакты, которые за её время не успевают распасться, и слабые обратимые связи теряются. Полоса показывает связывание, но не работу рецептора на грузе."],"note":"Условная схема: на гранулах с LC3B полоса есть у рецептора с целым LIR и почти нет у мутанта. В клетках HeLa p62 без PB1 выявлялся после выделения GFP-LC3B лишь при длинной экспозиции блота, а полоса p62 дикого типа была заметно сильнее (Wurzer 2015).","pic":{"kind":"blot","rows":[["Вход: рецептор",[0.8,0.8,0.8]],["На гранулах",[0.0,0.9,0.06]]],"lanes":["только GST","LIR цел","LIR мутант"],"cap":"условная схема, не данные"}},{"v":["Находятся ли рецептор и груз в одном месте клетки.","Рецептор метят флуоресцентным белком, груз выявляют другим цветом, клетки снимают на конфокальном микроскопе и оценивают совпадение сигналов.","Рецептор с мутацией UBD; клетки без рецептора; метки двух цветов меняют местами.","Совпадение сигналов в пределах разрешения микроскопа не показывает прямого контакта. Приход к митохондрии не означает участия в митофагии: p62 и NBR1 приходили к митохондриям, но митофагию не восстанавливали (Lazarou 2015)."],"note":"Условная схема: зелёный — рецептор, красный — груз, жёлтый — совпадение. Мутанты OPTN и NDP52 без убиквитин-связывающих доменов не приходили к митохондриям (Lazarou 2015).","pic":{"kind":"cells","panels":[{"lab":"рецептор цел","dots":[["yellow",7],["red",1]]},{"lab":"мутация UBD","dots":[["green",5],["red",5]]},{"lab":"нет рецептора","dots":[["red",6]]}],"cap":"зелёный — рецептор, красный — груз, жёлтый — совпадение; условная схема"}},{"v":["Достаточно ли очищенных компонентов — рецептора, убиквитинированного груза и ATG8 на мембране, — чтобы груз собрался в скопление или мембрана изогнулась вокруг него.","Очищенный p62 смешивают с убиквитинированным субстратом и наблюдают скопления (Zaffagnini 2018) либо добавляют к гигантским везикулам с LC3B на мембране и частицам с убиквитином и наблюдают изгиб мембраны (Wurzer 2015).","Рецептор с мутацией LIR или без PB1; субстрат без убиквитина; добавление свободного убиквитина или LC3B, которые подавляли образование скоплений (Zaffagnini 2018).","Показывает, что компонентов достаточно в упрощённой системе, но не то, что так происходит в клетке: в пробирке нет других белков, мембран и клеточных концентраций."],"note":"Порядок операций условный. В реконструированной системе взаимодействия p62 с убиквитином и LC3B было достаточно, чтобы мембрана изогнулась вокруг частицы с убиквитином (Wurzer 2015).","pic":{"kind":"steps","steps":["очищенный\np62","+ субстрат\nс убиквитином","+ мембрана\nс LC3B","наблюдение:\nскопления,\nизгиб мембраны"],"hl":3,"cap":"условная схема"}},{"v":["Нужен ли рецептор и его модуль для функции — митофагии, а не только для связывания.","В клетках без нескольких рецепторов (генное редактирование) по одному возвращают целый рецептор или рецептор с мутацией модуля, повреждают митохондрии и измеряют митофагию.","Клетки без рецепторов с пустым вектором; целый рецептор; мутации UBD, LIR и участка связывания FIP200.","Результат относится к данной линии клеток и воздействию (HeLa с Parkin); уровень возвращённого белка отличается от природного. В работе Lazarou 2015 нокаут пяти рецепторов не менял содержания остальных."],"note":"Порядок операций условный. В клетках без пяти рецепторов митофагию восстанавливали NDP52 и OPTN, но не их мутанты без убиквитин-связывающих доменов (Lazarou 2015).","pic":{"kind":"steps","steps":["нокаут пяти\nрецепторов","возврат целого\nили мутантного\nрецептора","повреждение\nмитохондрий","измерение\nмитофагии"],"hl":1,"cap":"условная схема"}},{"v":["Достаточно ли рецептора на органелле, чтобы привлечь белки аутофагии и запустить митофагию.","Рецептор, слитый с FKBP, и белок наружной мембраны митохондрии, слитый с FRB, сближают добавлением рапалога; затем смотрят на привлечение FIP200 и на митофагию (Vargas 2019).","Рецептор без SKICH или с мутацией LIR; клетки без PINK1; клетки без рапалога.","Показывает достаточность рецептора в искусственных условиях, а не необходимость в природном процессе: рецептор посажен на органеллу без сигнала повреждения."],"note":"Порядок операций условный. При посадке NDP52 на митохондрию в клетках HeLa привлекались белки аутофагии, в том числе FIP200, и запускалась митофагия; без SKICH FIP200 не привлекался (Vargas 2019).","pic":{"kind":"steps","steps":["рецептор\nс FKBP","FRB в мембране\nмитохондрии","рапалог\nсводит пару","привлечение FIP200,\nмитофагия"],"hl":2,"cap":"условная схема"}}],"fixed":"Пиктограммы условные и не являются данными эксперимента."}}},{"id":"pink1-import","number":7,"section":1,"title":"Как PINK1 служит датчиком импорта в митохондрию","question":2,"questions":[2],"keywords":["PINK1","импорт в митохондрию","TOM","TIM23","PARL","MPP","N-дегрон","UBR1","протеасома","потенциал"],"lead":["[[T16|PINK1]] постоянно синтезируется в цитозоле и импортируется в митохондрию. Пока импорт идёт, белок разрезается и быстро разрушается, поэтому в здоровой митохондрии PINK1 почти нет."],"mechanism":["Предшественник PINK1 проходит через [[T18|TOM и TIM23]]; движущей силой служит [[T17|потенциал]] на внутренней мембране.","Протеаза [[T19|PARL]] разрезает PINK1 во внутренней мембране перед F104, и фрагмент выходит в цитозоль.","[[T20|N-дегрон]] нового N-конца узнают UBR1, UBR2 и UBR4, после чего протеасома разрушает фрагмент."],"paragraphs":["PINK1 синтезируется в цитозоле постоянно. На его N-конце находится митохондриальная сигнальная последовательность, поэтому предшественник направляется к транслоказе внешней мембраны TOM, а затем к транслоказе внутренней мембраны TIM17/TIM23. Положительно заряженный N-конец втягивается в митохондрию потенциалом на внутренней мембране: основной движущей силой служит отрицательный заряд со стороны матрикса.","Пока потенциал сохранён, импорт доходит до внутренней мембраны. Протеаза матрикса MPP снимает сигнальную последовательность, а ромбоидная протеаза PARL разрезает PINK1 в трансмембранном сегменте непосредственно перед F104. Образовавшийся фрагмент выходит в цитозоль. Его новый N-концевой остаток фенилаланина служит N-дегроном: фрагмент узнают убиквитинлигазы UBR1, UBR2 и UBR4, и его разрушает протеасома (Yamano & Youle 2013).","Поэтому PINK1 в здоровой митохондрии очень мало. Период её полужизни составляет около 27 мин, а в клетке HEK293 оценено около 490 молекул, то есть около трёх на 10 000 комплексов TOM (Narendra & Youle 2024). Если PARL отсутствует, PINK1 не разрезается, не разрушается и остаётся внутри митохондрии в форме около 60 кДа (Jin 2010).","Схема качественная. Числа получены на культивируемых клетках человека; для других клеток и тканей они могут отличаться. Импорт PINK1 зависит от потенциала сильнее, чем от самого TIM23 (Sekine 2019), поэтому «потенциал» и «работа TIM23» не равнозначны."],"trap":["PINK1 появляется на митохондрии только при повреждении: повреждение запускает её синтез.","PINK1 синтезируется постоянно. Повреждение, снижающее потенциал, не запускает синтез, а останавливает импорт и разрез PARL, поэтому PINK1 накапливается."],"conditions":"Схема механизма, качественные состояния; размеры и расстояния не в масштабе. Клетки человека (HeLa, HEK293) и мыши. Yamano & Youle 2013, Jin 2010 и Sekine 2019 — прочитаны рефераты; период полужизни 27 мин и оценка 490 молекул (клетки HEK293) взяты из обзора Narendra & Youle 2024 (полный текст); порядок MPP, затем PARL и положение разреза перед F104 — по тому же обзору. Нумерация остатков дана для PINK1 человека.","sources":["Yamano2013","Jin2010","Sekine2019","Narendra2024"],"quiz":{"id":"S12-L07","rev":1,"question":"Потенциал на внутренней мембране сохранён, и PINK1 на митохондриях почти не обнаруживается. Из клеток убрали протеазу PARL. Что произойдёт с PINK1?","options":[{"id":"S12-L07-1","text":"PINK1 накопится на внешней мембране, как после потери потенциала.","correct":false,"feedback":"Накопление на внешней мембране связано с остановкой импорта. Здесь импорт идёт, поэтому PINK1 проходит к внутренней мембране и остаётся внутри."},{"id":"S12-L07-2","text":"PINK1 не будет разрезаться и разрушаться и останется внутри митохондрии.","correct":true,"feedback":"Без PARL нет разреза перед F104, нет фрагмента с N-дегроном, и PINK1 стабилизируется внутри митохондрии в форме около 60 кДа (Jin 2010)."},{"id":"S12-L07-3","text":"PINK1 исчезнет совсем: без PARL протеасома разрушает её быстрее.","correct":false,"feedback":"Протеасома разрушает фрагмент, который образовал PARL. Без разреза нет N-дегрона, и разрушение, наоборот, подавлено."}]},"widget":{"kind":"net","title":"","s":{"title":"Импорт PINK1 в здоровой митохондрии и его остановка","status":"Схема механизма · качественные состояния","ctrls":[{"id":"v","type":"group","label":"Потенциал на внутренней мембране","opts":["Потенциал сохранён","Потенциал утрачен"]},{"id":"p","type":"check","label":"Протеаза PARL удалена"}],"W":680,"H":442,"NW":340,"NH":578,"lg":{"title":"Обозначения на схеме","act":"активирует, привлекает, ведёт к","inh":"закрывает, тормозит, снимает","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос через мембрану","rx":"химическое превращение (разрез, снятие группы)","bind":"связывание","seq":"порядок событий","dash":"условная или возможная связь","nodes":["жёлтая рамка — звено работает","голубая рамка — белок несёт метку","пунктирная рамка — мало или не действует"]},"zones":[{"x":8,"y":8,"w":664,"h":120,"c":"cyto","t":"цитозоль","lx":662,"ly":118,"a":"end","n":[6,6,328,160,12,154],"tn":"цитозоль","an":"start"},{"x":8,"y":136,"w":664,"h":298,"c":"mito","t":"митохондрия","lx":662,"ly":426,"a":"end","n":[6,172,328,402,328,568],"tn":"митохондрия"}],"mem":[{"x1":96,"y1":180,"x2":666,"y2":180,"lx":0,"ly":0,"n":[84,225,334,225,0,0]},{"x1":96,"y1":282,"x2":666,"y2":282,"lx":0,"ly":0,"n":[84,345,334,345,0,0]}],"notes_svg":[{"x":10,"y":176,"t":"внешняя\nмембрана","n":[8,220],"fs":12,"tn":"внешняя\nмембрана"},{"x":10,"y":278,"t":"внутренняя\nмембрана","n":[8,340],"fs":12,"tn":"внутр.\nмембрана"},{"x":440,"y":236,"t":"межмембранное пространство","n":[8,280],"tn":"межмембранное\nпространство"},{"x":420,"y":414,"t":"матрикс","n":[276,408],"tn":"матрикс"}],"nodes":{"pink1":{"p":[150,58,140,46],"n":[130,40,84,36],"t":"PINK1\nпредшественник","tn":"PINK1","fs":14},"frag":{"p":[390,58,130,46],"n":[250,112,128,44],"t":"фрагмент PINK1\nс N-дегроном","tn":"фрагмент PINK1\nс N-дегроном","fs":14},"ubrp":{"p":[560,58,150,46],"n":[268,40,120,44],"t":"UBR1/2/4,\nпротеасома","tn":"UBR1/2/4,\nпротеасома","fs":14},"tom":{"p":[150,180,84,34],"n":[130,225,66,32],"t":"TOM","tn":"TOM"},"stuck":{"p":[450,180,190,44],"n":[252,225,124,44],"t":"PINK1 удержан\nв TOM–TIM23","tn":"PINK1 удержан\nв TOM–TIM23","fs":14},"tim":{"p":[150,282,124,34],"n":[130,345,98,34],"t":"TIM17/TIM23","tn":"TIM17/\nTIM23","fs":14},"parl":{"p":[400,282,160,44],"n":[262,345,72,36],"t":"2. PARL разрезает\nперед F104","tn":"PARL","fs":14},"full":{"p":[570,362,170,46],"n":[262,468,146,56],"t":"PINK1 около 60 кДа\nвнутри митохондрии","tn":"PINK1 ~60 кДа\nвнутри\nмитохондрии","fs":14},"mpp":{"p":[335,360,170,58],"n":[146,420,68,32],"t":"1. MPP снимает\nсигнальную\nпоследовательность","tn":"MPP","fs":14},"pot":{"p":[150,398,170,46],"n":[130,526,150,40],"t":"потенциал Δψ:\nсила импорта","tn":"потенциал Δψ:\nсила импорта","fs":14}},"edges":{"imp":{"a":"pink1","b":"tom","k":"tr","t":"импорт","tn":"импорт","d":[28,0],"dn":[26,0]},"tt":{"a":"tom","b":"tim","k":"tr"},"mpp":{"a":"tim","b":"mpp","k":"rx","tn":"1. MPP","d":[-10,24],"dn":[0,0],"anc":"end"},"parl":{"a":"mpp","b":"parl","k":"seq","tn":"2. PARL","d":[24,22],"dn":[8,0],"anc":"start"},"exit":{"a":"parl","b":"frag","k":"tr","t":"выход в цитозоль","tn":"выход в\nцитозоль","d":[10,50],"dn":[10,0],"anc":"start"},"ubr":{"a":"frag","b":"ubrp","k":"bind","t":"N-дегрон","tn":"N-дегрон","d":[0,-22],"dn":[0,-20]},"pot":{"a":"pot","b":"tim","k":"act"},"stk":{"a":"tom","b":"stuck","k":"bind","t":"N-конец продет\nчерез TOM","tn":"N-конец\nпродет","d":[0,-22],"dn":[0,-26]},"fl":{"a":"parl","b":"full","k":"seq","t":"нет разреза","tn":"","d":[30,-8],"dn":[22,0]}},"base":{"n":{"pink1":"on","frag":"on","ubrp":"on","tom":"on","tim":"on","parl":"on","mpp":"on","pot":"on","stuck":"hide","full":"hide"}},"st":{"0-0":{"n":{},"e":{"stk":"hide","fl":"hide"},"m":[["Импорт PINK1","идёт"],["Разрез PARL","идёт"],["PINK1 в митохондрии","почти нет"]],"note":"Потенциал сохранён: N-конец PINK1 втягивается через TOM и TIM17/TIM23. MPP снимает сигнальную последовательность, PARL разрезает PINK1 перед F104, фрагмент выходит в цитозоль. Его N-дегрон узнают UBR1, UBR2 и UBR4, и протеасома разрушает фрагмент. Поэтому PINK1 в здоровой митохондрии почти нет."},"0-1":{"n":{"parl":"abs","frag":"off","ubrp":"off","full":"on"},"e":{"exit":"hide","ubr":"off","stk":"hide"},"t":{"parl":"PARL удалена"},"tn":{"parl":"PARL\nнет"},"m":[["Импорт PINK1","идёт"],["Разрез PARL","нет"],["PINK1","стабильна, внутри митохондрии"]],"note":"PARL удалена: PINK1 импортируется, но не разрезается перед F104. Фрагмента с N-дегроном нет, протеасома его не разрушает, и PINK1 остаётся внутри митохондрии в форме около 60 кДа (Jin 2010)."},"1-0":{"n":{"pot":"abs","tim":"low","mpp":"off","parl":"off","frag":"off","ubrp":"off","stuck":"on","full":"hide","pink1":"on"},"e":{"tt":"off","mpp":"off","parl":"off","exit":"hide","ubr":"hide","pot":"off","fl":"hide"},"t":{"pot":"потенциал\nутрачен"},"tn":{"pot":"потенциал\nутрачен"},"m":[["Импорт PINK1","остановлен"],["Разрез PARL","нет"],["PINK1","накапливается на внешней мембране"]],"note":"Потенциал утрачен: втягивание N-конца PINK1 останавливается. Белок не доходит до MPP и PARL, фрагмент с N-дегроном не образуется, поэтому разрушение прекращается, а PINK1 накапливается на внешней мембране в комплексе с TOM–TIM23."},"1-1":{"n":{"pot":"abs","tim":"low","mpp":"off","parl":"abs","frag":"off","ubrp":"off","stuck":"on","full":"hide","pink1":"on"},"e":{"tt":"off","mpp":"off","parl":"off","exit":"hide","ubr":"hide","pot":"off","fl":"hide"},"t":{"pot":"потенциал\nутрачен","parl":"PARL удалена"},"tn":{"pot":"потенциал\nутрачен","parl":"PARL\nнет"},"m":[["Импорт PINK1","остановлен"],["Разрез PARL","не нужен: PINK1 до PARL не доходит"],["PINK1","накапливается на внешней мембране"]],"note":"Потенциал утрачен и PARL удалена: результат такой же, как при потере одного потенциала. PINK1 не доходит до PARL, поэтому отсутствие PARL на судьбу PINK1 на внешней мембране не влияет."}},"fs":15,"nfs":14,"lfs":12.5,"nlfs":12,"zfs":14,"nzfs":13}}},{"id":"pink1-stall","number":8,"section":1,"title":"Что происходит с PINK1, когда импорт нарушен","question":2,"questions":[2],"keywords":["PINK1","потеря потенциала","CCCP","TOM","димер","автофосфорилирование","S228","убиквитин","S65","отмывка"],"lead":["Если на внутренней мембране нет потенциала, PINK1 не доходит до PARL и остаётся на внешней мембране. Там она образует димеры, автофосфорилируется и становится киназой убиквитина."],"mechanism":["При утрате [[T17|потенциала]] N-конец PINK1 остаётся продетым через [[T18|TOM]] и удержанным у TIM17/TIM23, а киназный домен — в цитозоле.","Молекулы PINK1 на димере TOM фосфорилируют друг друга по S228 и S402 и активируются.","Активная PINK1 фосфорилирует убиквитин по S65; после отмывки [[T21|CCCP]] импорт возобновляется, и PINK1 быстро исчезает."],"paragraphs":["Потеря потенциала, например при добавлении протонофора CCCP, останавливает втягивание N-конца PINK1. Белок не доходит до PARL, не разрезается и не получает N-дегрон, поэтому разрушение прекращается. Полноразмерная форма PINK1 (около 63 кДа) накапливается на внешней мембране: в клетках HeLa её рост заметен через 30 мин и продолжается не менее 3 ч (Narendra 2010).","Остановленный PINK1 образует с TOM комплекс около 700 кДа (Lazarou 2012). Его N-конец продет через пору TOM, а киназный домен обращён в цитозоль. Молекулы PINK1 образуют димеры и фосфорилируют друг друга (транс-автофосфорилирование) по S228 и S402; замена этих остатков на аланин лишает PINK1 способности привлекать Parkin (Okatsu 2012). Активная киназа фосфорилирует по S65 убиквитин на белках внешней мембраны (Koyano 2014).","Накопление PINK1 начинается через несколько минут после потери потенциала, а активация Parkin запаздывает примерно на 30 мин. Авторы обзора предполагают, что для активации на одном димере TOM должны оказаться две молекулы PINK1, а в норме их около трёх на 10 000 комплексов; предварительное повышение содержания PINK1 эту задержку устраняет (Narendra & Youle 2024). Это гипотеза о механизме.","Состояние обратимо: после отмывки CCCP в клетках HeLa полноразмерный PINK1 резко убывает в течение 30 мин, потому что расщепление возобновляется (Narendra 2010). Сохраняет ли митохондрия «память» о недавней деполяризации, не известно; гистерезис — гипотеза, данных для вывода недостаточно."],"trap":["PINK1 сама распознаёт повреждение митохондрии, например окисленные белки.","PINK1 служит датчиком собственного импорта: при потере потенциала она остаётся на внешней мембране. Путь запускает прежде всего потеря потенциала; в обзоре упомянуты и агрегированные белки, но этот вариант на схеме не показан."],"conditions":"Схема механизма, качественные состояния; «первые минуты» и «30 мин и дольше» взяты из обзора Narendra & Youle 2024 (полный текст), точные сроки зависят от клеток и условий. Narendra 2010 — клетки HeLa, CCCP 3 ч и отмывка (полный текст); Lazarou 2012 — клетки HeLa, комплекс около 700 кДа (реферат); Okatsu 2012 — клетки HeLa, замены S228A и S402A (реферат); Koyano 2014 — клетки HeLa, in vitro (реферат). Гипотеза о подсчёте молекул PINK1 принадлежит авторам обзора.","sources":["Narendra2010","Lazarou2012","Okatsu2012","Koyano2014","Narendra2024"],"quiz":{"id":"S12-L08","rev":1,"question":"Клетки HeLa 3 ч выдерживали с CCCP: полноразмерный PINK1 накоплен на митохондриях. Затем CCCP отмыли. Как изменится количество полноразмерного PINK1 через 30 мин?","options":[{"id":"S12-L08-1","text":"Останется высоким: накопленный PINK1 стабилен и не разрезается даже при восстановленном потенциале.","correct":false,"feedback":"Стабильность PINK1 зависит от потенциала. После отмывки импорт и расщепление возобновляются, и содержание PINK1 резко убывает (Narendra 2010)."},{"id":"S12-L08-2","text":"Снизится только потому, что перестанет синтезироваться новый PINK1.","correct":false,"feedback":"Остановка синтеза уже накопленный PINK1 не убирает: циклогексимид его уровень почти не менял (Narendra 2010). Убыль даёт возобновившееся расщепление."},{"id":"S12-L08-3","text":"Резко снизится: импорт и расщепление PINK1 возобновились.","correct":true,"feedback":"Потенциал восстановился, PINK1 снова импортируется, PARL его разрезает, и фрагмент разрушается. Так показана обратимость состояния."}]},"widget":{"kind":"net","title":"","s":{"title":"PINK1 при остановке импорта и после её снятия","status":"Схема механизма · качественные состояния","ctrls":[{"id":"g","type":"gro
