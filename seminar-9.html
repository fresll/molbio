 переносит Ca²⁺ в ЭПР; после её ингибирования запасы ЭПР истощаются (Thastrup 1990), и сигнал IP₃ уже не создаёт микродомена высокой концентрации Ca²⁺ в зоне контакта. В модели [Ca²⁺] в цитоплазме 0,25 мкМ, при таком [Ca²⁺] вход через MCU мал, и концентрация свободного Ca²⁺ в матриксе составляет 0,10 мкМ (без тапсигаргина — 1,11 мкМ). Результат относится к состоянию после истощения ЭПР; сразу после добавления тапсигаргина Ca²⁺, выходящий из ЭПР, временно повышает [Ca²⁺] в цитоплазме. Расход ATP в этом состоянии модели при сигнале не растёт, поскольку не растёт [Ca²⁺] в цитоплазме; поэтому потребление O₂ и расход ATP здесь нельзя сравнивать с необработанными клетками как результат одного изменения.", "p3a_5_w2": "[Ca²⁺] в цитоплазме действительно выше (0,25 мкМ), но в модели вход через MCU заметно растёт лишь при микромолярном [Ca²⁺], а такой [Ca²⁺] возникает только в микродомене при высвобождении Ca²⁺ из ЭПР.", "p3a_5_w3": "IP₃-рецепторы открываются, но после обработки тапсигаргином запас Ca²⁺ в ЭПР почти истощён, поэтому Ca²⁺ через них почти не выходит.", "p3a_6_q": "Загадка. Мыши без MCU (MCU⁻/⁻) исследованной линии жизнеспособны, и их базальный обмен почти не изменён (Pan 2013). Значит ли это, что вход Ca²⁺ в матрикс не нужен? Что покажет модель для клеток без MCU при сигнале IP₃ 50 %?", "p3a_6_o1": "Потребность в ATP покрывается хуже, чем в норме", "p3a_6_o2": "Показания те же, что в норме: вход Ca²⁺ не нужен", "p3a_6_o3": "Пора откроется легче, чем у клеток в норме", "p3a_6_e": "В покое клетки без MCU почти не отличаются от нормы: Δψ −139 мВ, O₂ 0,59, ATP 98 % потребности. При сигнале расход ATP растёт, но без Ca²⁺ дегидрогеназы не активируются: индекс восстановленности 0,23 (в норме 0,39), митохондрии покрывают 79 % потребности (в норме 98 %). У исследованной линии мышей MCU⁻/⁻ снижена способность к интенсивной работе (Pan 2013), а сердце без MCU не отвечает на острую β-адренергическую стимуляцию (Luongo 2015). В модели вход Ca²⁺ согласует образование NADH с возросшим расходом ATP. Сохранный базальный обмен у этих мышей не означает, что Ca²⁺ митохондриям в покое не нужен: в культуре клеток без постоянной передачи Ca²⁺ от IP₃-рецепторов к митохондриям дыхание снижалось (Cárdenas 2010). Постоянное отсутствие белка и острое подавление его активности могут давать разный результат: при постоянном отсутствии возможны компенсаторные изменения.", "p3a_6_w2": "В покое различий почти нет, но при сигнале без MCU дегидрогеназы не активируются, и митохондрии покрывают 79 % потребности в ATP (в норме 98 %).", "p3a_6_w3": "Без MCU Ca²⁺ в матрикс почти не входит, и накопленный Ca²⁺ остаётся далеко от порога; в митохондриях мышей MCU⁻/⁻ не обнаружено признаков открытия поры, вызванного Ca²⁺ (Pan 2013).", "gn_er3": "ЭПР как хранилище Ca²⁺", "g_er3": "В просвете ЭПР концентрация Ca²⁺ на три–четыре порядка выше, чем в цитоплазме: сотни микромолей на литр против ≈ 0,1 мкМ. Ca²⁺ переносится в ЭПР Ca²⁺-АТФазой SERCA. IP₃-рецепторы обеспечивают высвобождение Ca²⁺ из ЭПР в цитоплазму. В модели запас Ca²⁺ в ЭПР постоянен, а тапсигаргин вызывает его истощение.", "gn_ip3r": "IP₃-рецептор (IP₃R)", "g_ip3r": "Ca²⁺-канал мембраны ЭПР. Открывается при связывании IP₃, который образуется фосфолипазой C после активации рецепторов плазматической мембраны (например, гистаминовых). Часть IP₃-рецепторов находится в контактах с митохондриями. В модели сигнал — один прямоугольный импульс, его амплитуда задаётся ползунком.", "gn_grp75": "Контакт IP₃R — GRP75 — VDAC1", "g_grp75": "Шаперон GRP75 связывает IP₃-рецептор ЭПР с каналом VDAC1 наружной мембраны; в клетках HeLa этот комплекс повышает накопление Ca²⁺ митохондриями, и при нокдауне GRP75 эффект исчезает (Szabadkai 2006). Контакт удерживают и другие белки. Роль MFN2 спорна: по одним данным, MFN2 сближает мембраны (de Brito & Scorrano 2008; Naon 2016), по другим — препятствует чрезмерному сближению (Filadi 2015).", "gn_vdac": "VDAC1", "g_vdac": "Канал наружной мембраны, пропускающий ионы и небольшие метаболиты, в том числе Ca²⁺. В модели наружная мембрана вход Ca²⁺ не ограничивает.", "gn_mdom": "Микродомен контакта", "g_mdom": "В узкой щели между ЭПР и митохондрией Ca²⁺, высвобожденный IP₃-рецепторами, не успевает рассеяться, и концентрация Ca²⁺ у поверхности митохондрии выше, чем в объёме цитоплазмы (HeLa; Rizzuto 1998). В щели [Ca²⁺] превышал 9 мкМ (Csordás 2010); в HeLa — 4–17 мкМ (Lim 2021). Зависимость от ширины щели двухфазная: оптимум 15–20 нм, при 30 нм [Ca²⁺] не менее чем в 4 раза ниже (Lim 2021). В модели: 20 мкМ × сигнал при 15 нм, в 4 раза меньше при 30 нм, в 33 раза меньше при > 50 нм (условно).", "gn_cyto3": "Ca²⁺ в цитоплазме", "g_cyto3": "Вне контактов при сигнале IP₃ [Ca²⁺] повышается примерно от 0,1 до 1 мкМ; для MCU с его низким сродством этого мало. В модели: 0,1 + 0,9 × сигнал, мкМ.", "gn_mcu3": "Унипортер Ca²⁺ (MCU)", "g_mcu3": "Канал внутренней мембраны: MCU образует пору (Baughman 2011; De Stefani 2011), а MICU1 со стороны межмембранного пространства управляет её открытием. Сродство к Ca²⁺ низкое (Kd ≈ 10–20 мкМ; Lim 2021). Ca²⁺ входит в матрикс по электрическому градиенту, и при снижении |Δψ| вход уменьшается — это тот же MCU, что на вкладке 2. Через MCU переносится Ca²⁺, а не H⁺; в модели перенос положительного заряда учитывается в балансе электрических токов через мембрану, который определяет Δψ.", "gn_micu1": "MICU1", "g_micu1": "Белок межмембранного пространства, связывающий Ca²⁺ с помощью мотивов «EF-рука» (Perocchi 2010). При низком [Ca²⁺] удерживает MCU закрытым (порог), при высоком — облегчает его открытие (кооперативность). Без MICU1 митохондрии накапливают Ca²⁺ в покое (Mallilankaraman 2012), а ответ на импульсы Ca²⁺, вызванные агонистом, ослаблен (печень мыши, культуры клеток; Csordás 2013).", "gn_nclx": "NCLX", "g_nclx": "Обменник Na⁺/Ca²⁺ (переносит и Li⁺) внутренней мембраны — основной путь выхода Ca²⁺ из матрикса; ингибируется CGP-37157 (Palty 2010). В модели скорость выведения Ca²⁺ имеет предел насыщения, CGP-37157 оставляет 30 % активности, Na⁺ не моделируется (условно). CGP-37157 действует и на другие системы переноса Ca²⁺: в препаратах саркоплазматического ретикулума он подавляет SERCA и активирует рианодиновые рецепторы (Neumann 2011); в модели учитывается только подавление NCLX.", "gn_dh": "Ca²⁺-зависимые дегидрогеназы", "g_dh": "Ca²⁺ матрикса активирует три фермента: пируватдегидрогеназу (через Ca²⁺-зависимую фосфатазу, которая её дефосфорилирует), NAD-зависимую изоцитратдегидрогеназу (IDH3) и 2-оксоглутаратдегидрогеназу (Denton 2009). Концентрации Ca²⁺, соответствующие половине максимальной активации: PDH ≈ 1 мкМ, OGDH 0,2–2 мкМ, IDH 5–50 мкМ (Lim 2021). Ферменты восстанавливают NAD⁺ до NADH, и поступление электронов в дыхательную цепь увеличивается. В модели одна кривая активации, достигающая половины максимального значения при 1 мкМ (условно); показание «индекс Ca²⁺-зависимой активации» — значение этой кривой, а не доля каталитической активности трёх ферментов.", "gn_nadh3": "Индекс восстановленности (вопрос 3)", "g_nadh3": "Условный индекс восстановленности: рассчитывается по активации дегидрогеназ и скорости дыхания (как на вкладке 1, с поправкой на Ca²⁺). Модель не вычисляет концентрации NADH и NAD⁺ и не даёт измеренной доли NADH в пуле NAD. Индекс растёт, когда в заданных условиях преобладает образование восстановительных эквивалентов (активация дегидрогеназ под действием Ca²⁺, блок цепи), и снижается при их ускоренном окислении (перенос электронов по цепи ускоряется вследствие увеличения расхода ATP). Автофлуоресценция NAD(P)H в опыте — отдельный наблюдаемый показатель и не тождественна этому индексу.", "gn_load3": "Накопленный Ca²⁺ матрикса и фосфатный буфер", "g_load3": "Большая часть Ca²⁺, вошедшего в матрикс, связывается с фосфатом. В митохондриях печени и мозга крысы при росте общей нагрузки от 10 до 500 нмоль/мг белка концентрация свободного Ca²⁺ в матриксе оставалась около 1–5 мкМ, а пора открывалась при определённой общей нагрузке, не зависящей от скорости поступления Ca²⁺ (Chalmers & Nicholls 2003). В модели накопленный Ca²⁺ выражен в процентах порога без циклоспорина A, концентрация свободного Ca²⁺ не превышает 3 мкМ (условно).", "gn_ptp": "Пора переходной проницаемости (mPTP)", "g_ptp": "При перегрузке матрикса Ca²⁺ вероятность перехода внутренней мембраны в состояние высокой проницаемости может увеличиваться; этому способствуют окислительный стресс и фосфат. Этот переход связывают с открытием неселективного канала — поры переходной проницаемости (mPTP): через открытую пору проходят молекулы массой до ≈ 1,5 кДа (Bernardi 2023). Длительное открытие поры нарушает ионные градиенты, снижает Δψ и может вызвать осмотическое набухание митохондрий. При наличии ATP и падении Δψ ATP-синтаза способна перейти к гидролизу ATP; этому препятствует белок-ингибитор ATPIF1 (IF1) (Acin-Perez 2023). Набухание в некоторых условиях приводит к повреждению наружной мембраны и выходу белков межмембранного пространства, но это не обязательное следствие любого кратковременного открытия поры: кратковременное открытие может происходить и в физиологических условиях (Bernardi 2023). Выход цитохрома c при BAX/BAK-зависимой проницаемости наружной мембраны — отдельный механизм: клетки без циклофилина D — белка матрикса, который повышает чувствительность поры к Ca²⁺, — нормально гибли от апоптотических стимулов, но были защищены от гибели при перегрузке Ca²⁺ и окислительном повреждении (Baines 2005; Nakagawa 2005). Молекулярный состав поры остаётся предметом исследования (Bernardi 2023).\nВ модели пороговое открытие поры — допущение: доля митохондрий с открытой порой растёт, пока накопленный Ca²⁺ выше порога. При открытой поре на схеме показаны две группы митохондрий (с открытой порой и остальные), поэтому средний Δψ не равен Δψ каждой из них; в митохондриях с открытой порой ATP-синтаза по допущению модели работает в обратном направлении. Набухание, выход белков межмембранного пространства и гибель клеток модель не рассчитывает.", "gn_cypd": "Циклофилин D и циклоспорин A", "g_cypd": "Циклофилин D — пептидил-пролил-изомераза матрикса, повышающая чувствительность поры к Ca²⁺; циклоспорин A связывается с ним и повышает порог. В митохондриях печени мышей без циклофилина D для открытия поры нужна примерно вдвое большая нагрузка Ca²⁺, и циклоспорин A на них не действует (Basso 2005). Мыши без циклофилина D защищены от гибели клеток, вызванной перегрузкой Ca²⁺ и окислительным стрессом, но не от гибели, регулируемой белками семейства Bcl-2 (Baines 2005).", "gn_tg": "Тапсигаргин", "g_tg": "Специфический ингибитор Ca²⁺-АТФазы ЭПР (SERCA) (Thastrup 1990). Ca²⁺ продолжает выходить из ЭПР, но обратно в ЭПР не переносится: запасы истощаются, и сигнал IP₃ уже почти не высвобождает Ca²⁺. Сразу после добавления тапсигаргина Ca²⁺, выходящий из ЭПР, временно повышает [Ca²⁺] в цитоплазме; этот переход не моделируется. В модели показано состояние после истощения ЭПР: концентрация Ca²⁺ в цитоплазме задана постоянной (0,25 мкМ, условно), вход Ca²⁺ через плазматическую мембрану во время сигнала не учитывается, и расход ATP при сигнале не растёт.", "gn_dpsi3": "Δψ на вкладке 3", "g_dpsi3": "Шкала и показание дают среднее значение Δψ по митохондриям клетки. Митохондрии с открытой порой полностью деполяризованы (Δψ ≈ 0), остальные сохраняют потенциал; если пора открыта в половине митохондрий, среднее значение близко к половине исходного (около −66 мВ вместо −139 мВ).", "gn_measure3": "Как измеряют", "g_measure3": "Концентрацию Ca²⁺ в матриксе и межмембранном пространстве измеряют генетически кодируемыми индикаторами с митохондриальной сигнальной последовательностью (экворин, флуоресцентные белки) или красителем rhod-2. Для измерения Ca²⁺ в щели контакта используют флуоресцентные индикаторы, закреплённые на белковой связке между ЭПР и наружной мембраной митохондрии (Csordás 2010). Активацию дегидрогеназ оценивают по автофлуоресценции NAD(P)H, а Δψ — по сигналу TMRM. Чувствительность поры определяют по способности митохондрий удерживать Ca²⁺: изолированным митохондриям добавляют Ca²⁺ порциями до его высвобождения и деполяризации. Циклоспорин A повышает количество Ca²⁺, удерживаемое до открытия поры (Basso 2005; Chalmers & Nicholls 2003).", "gn_model3": "Что упрощено в вопросе 3", "g_model3": "В модели задан один прямоугольный импульс IP₃ вместо повторяющихся повышений концентрации Ca²⁺; частота таких повышений влияет на активацию дегидрогеназ (гепатоциты; Hajnóczky 1995). Расход ATP при сигнале растёт в 1 + 2,5 × сигнал раза вместе с подъёмом [Ca²⁺] в цитоплазме (Ca²⁺-зависимая работа клетки, условно); после тапсигаргина сигнал не повышает [Ca²⁺] в цитоплазме, и расход не растёт. ЭПР — неисчерпаемый запас Ca²⁺ (кроме опыта с тапсигаргином). Одна кривая активации для трёх дегидрогеназ; Na⁺ для NCLX не моделируется; связывание Ca²⁺ с фосфатом описано плавно насыщающейся зависимостью; открытие поры определяется порогом накопленной нагрузки Ca²⁺ без учёта окислительного стресса и фосфата; Δψ — среднее по двум группам митохондрий (с открытой и закрытой порой); при открытой поре обе группы показаны на схеме и на шкале Δψ. Протонный контур и MCU — те же, что в вопросах 1 и 2. Все коэффициенты условные: числа показывают направление и порядок изменений, а не значения для конкретной клетки.", "teacher_7": "Вопрос 3: базовый уровень 5–7 минут, продвинутый 8–10 минут. Показания и схема относятся к моменту за 2 с до конца сигнала (48 или 138 с; момент и максимум накопленного Ca²⁺ до него отмечены на графике), график показывает весь протокол (300 с). При открытой поре схема показывает две группы митохондрий, а шкала Δψ — среднее и значения обеих групп. После тапсигаргина сигнал не повышает [Ca²⁺] в цитоплазме, и расход ATP в модели не растёт (показание «Расход ATP клеткой относительно покоя»). Модель вопроса 3 — надстройка над протонным контуром вопросов 1–2: тот же MCU (перенос заряда Ca²⁺ входит в баланс электрических токов, определяющих Δψ), добавлены микродомен контакта, регуляция MCU белком MICU1, NCLX, связывание Ca²⁺ с фосфатом, активация дегидрогеназ и пора с порогом по накопленному Ca²⁺. Вопросы, требующие уточнения: молекулярный состав поры не установлен; роль MFN2 в контактах (сближает или разделяет мембраны) обсуждается; частотное кодирование сигнала (Hajnóczky 1995) в модели не воспроизводится.", "lbl4_nuc": "ядро", "lbl4_nuc_cy": "ядро клетки ρ⁰ (норма)", "lbl4_nuc1": "гены ≈ 77 субъединиц I–V,", "lbl4_nuc2": "факторов сборки, репликации", "lbl4_nuc3": "и экспрессии мтДНК", "lbl4_nucmut": "ген субъединицы I: обе копии мутантны", "lbl4_ribo": "рибосома цитоплазмы", "lbl4_mrna": "мРНК", "lbl4_prec": "белки-предшественники", "lbl4_nucsub": "субъединицы, кодируемые ядром", "lbl4_sI": "7 из 45", "lbl4_sII": "0 из 4", "lbl4_sIII": "1 из 10", "lbl4_sIV": "3 из 14", "lbl4_sV": "2 из 17", "lbl4_mt1": "мтДНК", "lbl4_mt2": "16 569 п. н.", "lbl4_cp": "копий на рисунке: {n} (мутантных {m}, дикого типа {w})", "lbl4_mribo": "рибосома митохондрий: 13 белков", "mut4_ND": "MT-ND5", "mut4_CO": "MT-CO1", "mut4_ATP6": "m.8993", "mut4_TL1": "m.3243", "s4_h": "Доля мутантной мтДНК", "s4_t": "Потребность ткани в энергии", "ts4_low": "низкая", "ts4_norm": "средняя", "ts4_high": "высокая", "tsg4_low": "с низкой", "tsg4_norm": "со средней", "tsg4_high": "с высокой", "s4_g": "Ген мтДНК с мутацией", "g4_ND": "MT-ND5 (I)", "g4_CO": "MT-CO1 (IV)", "g4_ATP6": "MT-ATP6 (V)", "g4_TL1": "MT-TL1 (тРНК)", "gn4_ND": "MT-ND5: ген субъединицы комплекса I", "gn4_CO": "MT-CO1: ген субъединицы комплекса IV", "gn4_ATP6": "MT-ATP6: ген субъединицы ATP-синтазы; вариант m.8993T>G", "gn4_TL1": "ген тРНК-Leu(UUR) MT-TL1; вариант m.3243A>G", "cx4_I": "комплекс I", "cx4_IV": "комплекс IV", "cx4_V": "ATP-синтаза", "s4_n": "Число копий мтДНК (% обычного числа)", "s4_b": "«Бутылочное горлышко»: размер выборки, копий мтДНК", "b4_s": "10", "b4_m": "50", "b4_l": "200", "tg4_nuc": "мутация в ядерном гене (комплекс I)", "tg4_cy": "цибрид: ядро клетки ρ⁰", "r4_h": "Мутантная мтДНК, % копий", "r4_wt": "Копии дикого типа, % обычного числа", "r4_cx": "Работающие комплексы, % нормы", "r4_cx_v": "I {fI} · III {fIII} · IV {fIV} · V {fV}", "r4_cap": "Максимальная мощность цепи, % нормы", "r4_vs": "Максимальная мощность ATP-синтазы, % нормы", "r4_dpsi": "Δψ внутренней мембраны", "r4_st": "Заданная потребность в ATP (граница 90 %)", "r4_ok": "покрыта", "r4_def": "не покрыта", "r4_th": "Порог для этих условий", "tr4_t": "Порог: покрытие потребности в ATP при разной доле мутантной мтДНК", "tr4_c": "По горизонтали — доля мутантной мтДНК; по вертикали — % потребности в ATP, покрытой митохондриями (сплошная линия — выбранная ткань, штрихи — две другие), пунктир — максимальная мощность цепи, % нормы; красные штрихи — граница дефицита (90 %); вертикальная линия — текущая доля.", "tr4_c_nuc": "При мутации в ядерном гене мтДНК нормальна: график относится к мутациям мтДНК и показан для сравнения.", "tr4_x": "% мутантной мтДНК", "tr4_l_low": "низкая потребность", "tr4_l_norm": "средняя", "tr4_l_high": "высокая", "tr4_l_cap": "максимальная мощность цепи", "tr4_l_def": "граница дефицита", "tr4_ht": "«Бутылочное горлышко»: доля мутантной мтДНК у потомков", "tr4_hx": "% мутантной мтДНК у потомка", "tr4_hc": "Мать: {h} % мутантной мтДНК; для каждого потомка — независимая случайная выборка из {nb} копий (условная эффективная выборка). По вертикали — % потомков; красные столбцы — выше модельного порога ({th} %), чёрная линия — доля у матери. Выше порога — {a} % потомков; вероятность заболевания не рассчитывается.", "tr4_hc_pre": "Распределение появится после ответа.", "tr4_hc_nuc": "При мутации в ядерном гене распределение не применимо: ядерный ген наследуется от обоих родителей по законам Менделя.", "s4b_take": "Дыхательная цепь включает белки, кодируемые двумя геномами. Пока копий мтДНК дикого типа и функциональных комплексов достаточно, а максимальная мощность цепи превышает необходимую для покрытия потребности ткани в ATP, снижение функции комплекса может не вызывать дефицита ATP. В модели копии дикого типа частично компенсируют наличие мутантных копий. Выше порога резерв исчерпывается, и покрытие потребности в ATP резко уменьшается. В тканях с высокой потребностью в энергии порог ниже; числа в модели условные.", "s4a_take": "Порог недостаточного митохондриального синтеза ATP зависит от варианта мтДНК, числа её копий и потребности ткани; в выбранных вариантах модели порог для MT-TL1 выше, чем для MT-CO1, но это не общее правило для генов тРНК и белков. Для ядерной мутации в модели задана одинаковая остаточная функция комплекса I во всех клетках. Цибриды позволяют оценить вклад мтДНК и ядерного генетического фона при соответствующих контролях. Случайная выборка копий мтДНК при передаче потомкам объясняет, почему при малой эффективной выборке доля мутантной мтДНК у детей одной матери сильно различается.", "c4h_wt": "Мутантной мтДНК нет: все копии — дикого типа, и комплексы I, III, IV и V собираются из полных наборов субъединиц, кодируемых мтДНК и ядерной ДНК.", "c4h_wt_n": "Мутантной мтДНК нет; копий мтДНК {copies} % обычного числа.", "c4h_mt": "Мутантная мтДНК — {h} % копий ({gene}); копий дикого типа {wt} % обычного числа.", "c4h_mt_cy": "Цибрид: мтДНК пациента ({h} % мутантной; {gene}) перенесена в клетку ρ⁰ с нормальным ядром; копий дикого типа {wt} % обычного числа.", "c4h_nuc": "В модели мутация есть в обеих копиях ядерного гена субъединицы комплекса I; мтДНК нормальна, гетероплазмии нет. Для всех сравниваемых клеток задана одинаковая остаточная функция комплекса I.", "c4h_nuc_cy": "Цибрид: нормальная мтДНК пациента перенесена в клетку ρ⁰ с нормальным ядром — мутантного ядерного гена в цибриде нет.", "c4f_ok": "Количество продукта гена достаточно: копии мтДНК дикого типа имеются в избытке, и функция {cx} составляет {f} % нормы.", "c4f_low": "Копий мтДНК дикого типа недостаточно: функция {cx} составляет {f} % нормы, а максимальная мощность дыхательной цепи — {cap} %.", "c4f_low_v": "Копий мтДНК дикого типа недостаточно: функция ATP-синтазы составляет {f} % нормы, её максимальная мощность — {vs} %, а максимальная мощность дыхательной цепи — {cap} %.", "c4f_trna_ok": "тРНК необходима для синтеза всех 13 белков, кодируемых мтДНК. тРНК дикого типа имеется в избытке, поэтому функция комплексов I, III, IV и V составляет {fmin} % нормы.", "c4f_trna": "тРНК необходима для синтеза всех 13 белков, кодируемых мтДНК. При недостатке тРНК дикого типа снижается функция комплексов I, III, IV и V. В модели снижение одинаково для всех этих комплексов — до {fmin} % нормы; максимальная мощность дыхательной цепи составляет {cap} %.", "c4f_nuc": "Во всех митохондриях функция комплекса I составляет {fI} % нормы, а максимальная мощность дыхательной цепи — {cap} %.", "c4f_copies": "При малом числе копий мтДНК синтезируется меньше кодируемых ею белков. Функция комплексов составляет {fmin} % нормы, а максимальная мощность дыхательной цепи — {cap} %.", "c4a_wt": "Ткань {tissue} потребностью в энергии: митохондрии покрывают {cov} % потребности в ATP, Δψ {dpsi} мВ, потребление O₂ дыхательной цепью {o2}.", "c4a_ok": "Ткань {tissue} потребностью в энергии: максимальная мощность цепи достаточна, митохондрии покрывают {cov} % заданной потребности в ATP, Δψ {dpsi} мВ, потребление O₂ {o2}. Функция отдельных комплексов может быть уже снижена, но покрытие потребности сохраняется.", "c4a_def": "Ткань {tissue} потребностью в энергии: максимальная мощность цепи недостаточна, митохондрии покрывают {cov} % заданной потребности в ATP, Δψ {dpsi} мВ, потребление O₂ {o2}. Митохондриального синтеза ATP не хватает для заданной нагрузки; содержание ATP в клетке модель не рассчитывает.", "c4a_def_v": "Ткань {tissue} потребностью в энергии: дыхательная цепь функционирует, но максимальная мощность ATP-синтазы недостаточна. Митохондрии покрывают {cov} % заданной потребности в ATP, потребление O₂ снижено до {o2}, а Δψ сохраняется на уровне {dpsi} мВ. В модели H⁺ медленнее возвращаются в матрикс через ATP-синтазу.", "c4t": "Порог для этих условий — ≈ {th} % мутантной мтДНК.", "c4t_0": "При таком числе копий дефицит есть и без мутантной мтДНК.", "c4t_none": "Дефицита нет даже при 100 % мутантной мтДНК.", "c4z_wt": "Дыхательная цепь включает белки, кодируемые двумя геномами: мтДНК кодирует 13 субъединиц комплексов I, III, IV и V, ядерная ДНК — остальные субъединицы (весь комплекс II), а также факторы сборки комплексов, репликации и экспрессии мтДНК (Russell 2020).", "c4z_below": "Ниже порога сохраняется функциональный резерв: копий мтДНК дикого типа достаточно для поддержания большей части функции комплексов, а максимальная мощность цепи превышает необходимую для покрытия заданной потребности в ATP. В модели копии дикого типа частично компенсируют наличие мутантных копий; патогенные мутации мтДНК обычно функционально рецессивны (Russell 2020). Биохимические изменения могут появляться раньше, чем снижается покрытие потребности в ATP.", "c4z_above": "Выше порога функциональный резерв исчерпан: небольшое увеличение доли мутантной мтДНК резко снижает покрытие потребности в ATP, поэтому переход от нормы к дефициту выглядит пороговым (Rossignol 2003).", "c4z_copies": "От числа копий мтДНК зависит, сколько белков, кодируемых мтДНК, синтезируется в клетке; при малом числе копий запас исчерпывается раньше.", "c4z_nuc": "В этой модели одинаковая остаточная функция комплекса I задана для всех сравниваемых клеток, а выраженность недостаточного митохондриального синтеза ATP зависит от потребности ткани. Одинаковый ядерный генотип сам по себе не означает одинакового дефекта в любых тканях.", "c4z_nuc_def": "При одинаковой заданной остаточной функции комплекса I его недостаточность раньше проявляется в ткани с высокой потребностью в ATP. У детей митохондриальные болезни чаще вызваны мутациями ядерных генов (Russell 2020).", "c4z_cy_nuc": "Цибриды помогают оценить вклад двух геномов (King & Attardi 1989). В этом модельном опыте функция восстановлена, поскольку ядро клетки ρ⁰ нормально; в реальном исследовании такой вывод проверяют на сопоставимых клонах с контролем мтДНК.", "c4z_cy_mt": "Цибриды помогают оценить вклад двух геномов (King & Attardi 1989). Сохранение дефекта при нормальном ядре поддерживает предположение о вкладе мтДНК; в реальном опыте контролируют гетероплазмию, число копий мтДНК и различия между клонами.", "c4_puz": "Загадка: клетки X и Y из одной ткани (средняя потребность), мутация одна и та же (MT-CO1), доля мутантной мтДНК в обеих 70 %. На схеме — клетка X.", "c4_puz_z": "Сравните показания двух клеток справа: чем может отличаться Y, если ткань, ген и доля мутантной мтДНК одинаковы?", "c4_puz_ans": "В клетке Y число копий мтДНК вдвое меньше. При одинаковой доле мутантной мтДНК (70 %) число копий дикого типа у Y составляет 15 % обычного числа, а у X — 30 %. Поэтому у Y функциональный резерв исчерпан. На схеме показана клетка Y.", "c4_puz_ans_z": "Порог зависит не только от доли мутантной мтДНК: необходимо учитывать, достаточно ли продуктов экспрессии копий дикого типа и максимальной мощности дыхательной цепи для покрытия потребности ткани в ATP.", "puz4_row_t": "Клетка {k}", "puz4_row": "покрытие потребности в ATP {cov} % · максимальная мощность цепи {cap} % · потребление O₂ {o} · Δψ {d} мВ", "puz4_row_n": "· копий мтДНК {n} % обычного числа", "puz4_hide": "Число копий мтДНК показывается после ответа.", "p4b_1_q": "Ткань со средней потребностью в энергии. Доля мутантной мтДНК (мутация в гене MT-CO1, субъединица комплекса IV) выросла с 0 до 60 %. Как изменится доля потребности в ATP, которую покрывают митохондрии?", "p4b_1_o1": "Почти не изменится: функционального резерва достаточно", "p4b_1_o2": "Снизится на 60 %: столько копий мутантны", "p4b_1_o3": "Снизится примерно вдвое: максимальная мощность цепи снизится", "p4b_1_e": "При 60 % мутантной мтДНК копий дикого типа 40 % обычного числа, и их почти хватает: комплекс IV работает на 85 % нормы, максимальная мощность цепи 92 %, а клетке со средней потребностью нужно около 60 % максимальной мощности. Митохондрии покрывают 98 % потребности, как и без мутации (98 %), Δψ −138 мВ. Функция комплекса IV уже снижена, но митохондриального синтеза ATP не хватает лишь выше порога для заданной нагрузки: в модели копии дикого типа частично компенсируют мутантные (Russell 2020).", "p4b_1_w2": "Доля мутантной мтДНК не определяет степень нарушения функции напрямую. Оставшихся копий дикого типа почти достаточно для полного синтеза субъединицы, а избыток комплекса IV и функциональный резерв дыхательной цепи компенсируют снижение её количества.", "p4b_1_w3": "Максимальная мощность цепи снизилась лишь до 92 % нормы, тогда как для покрытия средней потребности в ATP необходимо около 60 %. Поэтому имеющегося резерва достаточно.", "p4b_2_q": "Доля мутантной мтДНК выросла ещё на 30 процентных пунктов — с 60 до 90 %. Как изменится покрытие потребности в ATP?", "p4b_2_o1": "Резко снизится: резерв исчерпан", "p4b_2_o2": "Почти не изменится, как от 0 до 60 %", "p4b_2_o3": "Снизится пропорционально, на 30 %", "p4b_2_e": "При 90 % мутантной мтДНК копий дикого типа лишь 10 % обычного числа: комплекс IV работает на 25 % нормы, максимальная мощность цепи 40 %, и её уже не хватает. Митохондрии покрывают 62 % потребности в ATP, Δψ −122 мВ, потребление O₂ 0,39. Порог для этих условий ≈ 83 %: выше него функциональный резерв исчерпан, и увеличение доли мутантной мтДНК на каждый процентный пункт заметно снижает покрытие потребности.", "p4b_2_w2": "При увеличении доли мутантной мтДНК от 0 до 60 % функциональный резерв компенсировал дефект. При увеличении от 60 до 90 % резерв исчерпывается: максимальная мощность цепи снижается до 40 % нормы и становится недостаточной для покрытия потребности ткани в ATP.", "p4b_2_w3": "Зависимость нелинейна: до порога покрытие почти не меняется, а после порога падает круче, чем растёт доля мутантной мтДНК (график под показаниями).", "p4b_3_q": "Доля мутантной мтДНК 75 % (MT-CO1). В ткани со средней потребностью дефицита нет. Что будет в ткани с высокой потребностью в энергии при той же доле?", "p4b_3_o1": "Дефицит появится: порог здесь ниже", "p4b_3_o2": "Дефицита не будет: доля мутантной та же", "p4b_3_o3": "Дефицит уменьшится: цепь работает быстрее", "p4b_3_e": "При доле мутантной мтДНК 75 % максимальная мощность цепи одинакова в обеих тканях (76 % нормы), но для покрытия высокой потребности в ATP требуется большая её часть. Митохондрии покрывают 88 % потребности против 96 % в ткани со средней потребностью; Δψ составляет −130 мВ. Порог для ткани с высокой потребностью составляет ≈ 74 %, а со средней — ≈ 83 %. Поэтому при мутациях мтДНК нарушения раньше проявляются в тканях с высокой потребностью в энергии.", "p4b_3_w2": "Доля мутантной мтДНК и максимальная мощность цепи одинаковы (76 % нормы). Различается расход ATP в ткани, поэтому для его покрытия требуется разная доля максимальной мощности цепи.", "p4b_3_w3": "Перенос электронов действительно происходит быстрее (потребление O₂ 0,69 против 0,58), однако максимальной мощности цепи недостаточно: покрытие потребности снижается до 88 %.", "p4a_1_q": "Доля мутантной мтДНК 75 % (MT-CO1, средняя потребность), дефицита нет. Как изменится покрытие потребности в ATP, если число копий мтДНК в клетке снизится вдвое, а доля мутантной мтДНК останется прежней?", "p4a_1_o1": "Снизится: копий дикого типа вдвое меньше", "p4a_1_o2": "Не изменится: доля мутантной мтДНК та же", "p4a_1_o3": "Повысится: мутантных копий тоже меньше", "p4a_1_e": "При той же доле мутантной мтДНК копий дикого типа становится 13 % обычного числа вместо 25 %. Комплекс IV работает на 31 % нормы (было 61 %), максимальная мощность цепи 44 %, митохондрии покрывают 69 % потребности (было 96 %). Порог для этих условий снижается с ≈ 83 до ≈ 61 %. Число копий мтДНК в клетках разных тканей различается: от сотен до нескольких тысяч (Filograna 2021).", "p4a_1_w2": "Доля та же, но копий дикого типа вдвое меньше, а количество продукта гена зависит именно от числа копий дикого типа.", "p4a_1_w3": "В этой модели мутантные копии не подавляют работу копий дикого типа. Важно их абсолютное число: при уменьшении общего числа копий мтДНК вдвое копий дикого типа тоже становится вдвое меньше.", "p4a_2_q": "При 85 % мутантной мтДНК в гене MT-CO1 есть дефицит ATP (средняя потребность). Что покажет модель при той же доле 85 %, если мутация находится в гене тРНК MT-TL1 (вариант m.3243A>G)?", "p4a_2_o1": "Дефицита не будет: тРНК дикого типа в избытке", "p4a_2_o2": "Дефицит сильнее: затронуты несколько комплексов", "p4a_2_o3": "Будет такой же дефицит: доля одна и та же", "p4a_2_e": "тРНК необходима для синтеза всех 13 белков, кодируемых мтДНК, но тРНК дикого типа требуется немного: в цибридах с мутацией 3243 более 6 % копий дикого типа защищали от дефекта синтеза белков и дыхания (Chomyn 1992). В модели при 85 % комплексы I, III, IV и V работают на 84 % нормы, максимальная мощность цепи 76 %, митохондрии покрывают 96 % потребности (при MT-CO1 — 85 %). При выбранных коэффициентах модели порог для MT-TL1 выше: ≈ 88 % против ≈ 83 % для MT-CO1; это не общее правило для генов тРНК и белков. Изменения в клетке начинаются и ниже порога дефицита: в цибридах с 3243 при 20–30 % и 50–90 % мутантной мтДНК менялась экспрессия ядерных генов (Picard 2014).", "p4a_2_w2": "При выбранных коэффициентах выше ≈ 88 % заметно снижается функция комплексов I, III, IV и V, но при 85 % тРНК дикого типа ещё хватает для большей части их функции. Тяжесть определяют остаточная функция и потребность в ATP, а не только число затронутых комплексов.", "p4a_2_w3": "Порог зависит от гена: для белкового гена важна доля копий дикого типа с этим геном, а для тРНК достаточно небольшого количества тРНК дикого типа.", "p4a_3_q": "В обеих копиях ядерного гена субъединицы комплекса I имеется мутация. В модели для всех клеток задана одинаковая остаточная функция комплекса I — около 45 % нормы. В ткани с низкой потребностью в энергии дефицита нет. Что произойдёт в ткани с высокой потребностью?", "p4a_3_o1": "Дефицит появится во всех клетках", "p4a_3_o2": "Дефицита не будет: гетероплазмии нет", "p4a_3_o3": "Дефицит появится лишь в части клеток", "p4a_3_e": "По условию ядерная мутация и остаточная функция комплекса I одинаковы во всех сравниваемых клетках; доля мутантной мтДНК здесь не применима. В модели максимальная мощность цепи везде 55 %: ткани с низкой потребностью этого хватает (97 % потребности), а ткани с высокой — нет (67 %, Δψ −123 мВ). Выраженность дефекта определяется потребностью ткани. У детей митохондриальные болезни чаще вызваны мутациями ядерных генов (Russell 2020).", "p4a_3_w2": "Гетероплазмии нет, но дефект есть во всех клетках: максимальная мощность цепи снижена до 55 %, и ткани с высокой потребностью её не хватает.", "p4a_3_w3": "По условию остаточная функция комплекса I одинакова во всех клетках, поэтому в ткани с высокой потребностью дефицит есть во всех клетках. Различия между клетками по доле мутантной мтДНК — свойство гетероплазмии; при ядерных вариантах мозаицизм возможен лишь при постзиготических мутациях.", "p4a_4_q": "Мысленный опыт: единственная заданная причина дефекта комплекса I у пациента — мутация в ядерном гене, мтДНК пациента нормальна. Эту мтДНК перенесли в клетки ρ⁰ с нормальным ядром и получили цибриды с обычным числом копий мтДНК. Будет ли в цибридах дефект комплекса I?", "p4a_4_o1": "Нет: мутантный ген остался в ядре пациента", "p4a_4_o2": "Да: дефект переносится с митохондриями", "p4a_4_o3": "Да: в клетках ρ⁰ комплекс I не собирается", "p4a_4_e": "Цибрид получает мтДНК донора, а ядро — от клетки ρ⁰ (King & Attardi 1989). При этом мтДНК пациента нормальна, а мутантного ядерного гена в цибриде нет: комплекс I работает полностью, митохондрии покрывают 98 % потребности. В реальном исследовании сравнение цибридов помогает оценить вклад мтДНК и ядерного генетического фона, но вывод требует контроля числа копий мтДНК, гетероплазмии и различий между клонами (Picard 2014).", "p4a_4_w2": "С митохондриями переносится мтДНК, а не ядерные гены: субъединицы комплекса I, кодируемые ядерной ДНК, в цибриде синтезируются по нормальным генам ядра клетки ρ⁰.", "p4a_4_w3": "У самих клеток ρ⁰ нет мтДНК, и комплекс I в них действительно не собирается. Цибрид получает нормальную мтДНК пациента: субъединицы комплекса I, закодированные в мтДНК, синтезируются, и комплекс собирается вместе с субъединицами, кодируемыми нормальной ядерной ДНК.", "p4a_5_q": "Загадка. Клетки X и Y одной ткани с одной и той же мутацией MT-CO1 и одинаковой долей мутантной мтДНК — 70 %. В X дефицита нет, в Y он есть (показания — справа). Чем Y может отличаться от X?", "p4a_5_o1": "В Y меньше копий мтДНК", "p4a_5_o2": "В Y больше копий мтДНК", "p4a_5_o3": "Ничем: при 70 % исход случаен", "p4a_5_e": "В модели у Y число копий мтДНК вдвое меньше. При одинаковой доле мутантной мтДНК (70 %) число копий дикого типа у Y составляет 15 % обычного числа, а у X — 30 %. Функция комплекса IV у Y составляет 38 % нормы против 70 % у X; максимальная мощность цепи — 50 % против 83 %, а покрытие потребности в ATP — 79 % против 97 %. Порог зависит не только от доли мутантной мтДНК: важны также число копий мтДНК, потребность ткани и ген с мутацией. Порог может различаться даже у больных с одной и той же мутацией (Russell 2020).", "p4a_5_w2": "Больше копий дало бы больше копий дикого типа и повысило бы порог: при 200 % копий порог ≈ 91 %.", "p4a_5_w3": "В модели исход не случаен: при одинаковых доле, гене, ткани и числе копий показания одинаковы. Различие X и Y объясняется числом копий.", "p4a_6_q": "В учебной модели у матери 60 % мутантной мтДНК (MT-CO1), порог для ткани со средней потребностью ≈ 83 %. Для каждого потомка независимо берётся случайная выборка из 200 копий мтДНК, и почти у всех потомков доля мутантной мтДНК 50–70 %. Каким будет распределение, если эффективная выборка уменьшится до 10 копий?", "p4a_6_o1": "Шире: у части потомков доля выше порога", "p4a_6_o2": "Таким же: доля задаётся долей у матери", "p4a_6_o3": "Уже: все потомки получат ровно 60 %", "p4a_6_e": "Чем меньше эффективная случайная выборка, тем сильнее разброс гетероплазмии у потомков. При 10 копиях доля мутантной мтДНК у потомков — от 0 до 100 % с шагом 10 %, и у 5 % потомков она выше порога; при 200 копиях — менее 0,1 %. В родословных человека эффективное «бутылочное горлышко» оценено в 7–10 сегрегирующих единиц мтДНК, а отбор в зародышевой линии сдерживает рост доли вредных вариантов (Zaidi 2019); у мыши число копий мтДНК в первичных половых клетках снижается примерно до 200 (Cree 2008; Xie 2026). Число копий и эффективный размер выборки — разные величины, а 10 и 200 здесь — учебные значения, а не число молекул, передаваемых ребёнку. Учебный расчёт показывает механизм случайного разброса; его 5 % нельзя считать оценкой риска рождения больного ребёнка.", "p4a_6_w2": "Средняя доля у потомков действительно около 60 %, но при малой выборке разброс велик, и у части потомков доля выше порога.", "p4a_6_w3": "Выборка из 10 копий редко воспроизводит долю матери точно: ровно 6 мутантных копий из 10 получает около 25 % потомков.", "gn_nuc4": "Ядерный геном и митохондрии", "g_nuc4": "Ядерная ДНК кодирует подавляющее большинство белков митохондрий (более 1200), в том числе большую часть субъединиц дыхательной цепи, весь комплекс II, факторы сборки комплексов, ДНК-полимеразу γ и другие белки репликации и экспрессии мтДНК (Russell 2020). Эти белки синтезируются на рибосомах цитоплазмы и импортируются в митохондрии; для доставки разных групп белков используются разные пути импорта, один из которых разобран на вкладке 2 (Δψ). Репликация мтДНК, её экспрессия и согласование двух геномов разобраны в справочных карточках (кнопки ниже). Патогенные варианты ядерных генов, нужных для поддержания мтДНК (POLG, POLG2, TWNK), могут вторично изменять саму мтДНК: снижать число её копий или приводить к множественным делециям. Варианты самой мтДНК обычно передаются по материнской линии, тогда как наследование вариантов ядерных генов подчиняется законам Менделя (Viscomi, Zeviani 2017). Конституциональный вариант обычно есть во всех клетках, но выраженность дефекта различается между тканями; постзиготические варианты могут давать мозаицизм.", "gn_ribo4": "Рибосома цитоплазмы", "g_ribo4": "На рибосомах цитоплазмы синтезируются субъединицы дыхательной цепи, кодируемые ядерной ДНК. Все они затем импортируются в митохондрии. Многие несут отщепляемую N-концевую сигнальную последовательность, другие — внутренние сигналы; пути импорта различаются, и один из них разобран на вкладке 2 (Δψ).", "gn_mribo4": "Рибосома митохондрий", "g_mribo4": "В матриксе синтезирует 13 белков, закодированных в мтДНК; для этого нужны 2 рРНК и 22 тРНК, тоже закодированные в мтДНК (Russell 2020). Патогенный вариант гена тРНК может нарушать митохондриальную трансляцию и снижать функцию нескольких комплексов, содержащих субъединицы, кодируемые мтДНК; одинаковое снижение функции комплексов I, III, IV и V — упрощение модели.", "gn_mtdna4": "мтДНК человека", "g_mtdna4": "Кольцевая молекула 16 569 п. н. (Anderson 1981). В митохондрии мтДНК упакована белком TFAM в нуклеоиды; в культивируемых клетках нуклеоид обычно содержит одну копию мтДНК, а при увеличении числа копий растёт число нуклеоидов, а не их размер (Kukat 2015). Кодирует 13 белков (7 субъединиц комплекса I, 1 — комплекса III, 3 — комплекса IV, 2 — ATP-синтазы), 22 тРНК и 2 рРНК (Russell 2020). На кольце цвет гена соответствует комплексу; серым показаны гены рРНК и тРНК; координаты — по эталонной последовательности.", "gn_cI4": "Комплекс I", "g_cI4": "45 субъединиц, из них 7 закодированы в мтДНК (Signes & Fernandez-Vizarra 2018). Заливка блока — доля работающих комплексов в модели.", "gn_cII4": "Комплекс II", "g_cII4": "4 субъединицы, все кодируются ядерной ДНК (Signes & Fernandez-Vizarra 2018): мутации мтДНК не меняют их последовательность. Вторичные изменения количества или активности комплекса II при нарушении функции митохондрий возможны; в модели они не учитываются.", "gn_cIII4": "Комплекс III", "g_cIII4": "10 субъединиц в мономере, из них одна — цитохром b — закодирована в мтДНК (Signes & Fernandez-Vizarra 2018).", "gn_cIV4": "Комплекс IV", "g_cIV4": "13–14 субъединиц, из них 3 закодированы в мтДНК (Signes & Fernandez-Vizarra 2018). В митохондриях скелетной мышцы и мозга крысы дыхание снижалось лишь после ингибирования комплекса IV примерно на 75–80 %, в линиях клеток человека — примерно на 40 % (биохимический порог; Rossignol 2003).", "gn_copies4": "Копии мтДНК", "g_copies4": "В клетке сотни или тысячи копий мтДНК: в сердце человека ≈ 4–6 тыс., в печени, почке и лёгком ≈ 0,5–2 тыс. на клетку, в ооците ≈ 100 тыс. (Filograna 2021). При делении клеток копии распределяются случайно, и доля мутантной мтДНК в дочерних клетках может смещаться (Johnston 2026). На рисунке 20 кружков соответствуют обычному числу копий. Число копий в модели задано независимо от доли мутантной мтДНК; образование копий (репликация мтДНК) в расчёт не входит и описано в справочной карточке.", "gn_hetero4": "Гетероплазмия и гомоплазмия", "g_hetero4": "Гетероплазмия — присутствие разных вариантов мтДНК в одной клетке; в этих опытах — мутантных копий и копий дикого типа. При гомоплазмии все копии одинаковы. Порог зависит от варианта, ткани и критерия дефекта: в обзорах приводят ориентиры 60–80 % (Xie 2026) и выше ≈ 70 % для многих патогенных вариантов в отдельной клетке (Russell 2020). Picard (2014) обсуждает ассоциации m.3243A>G: ≈ 10–30 % — с диабетом, ≈ 50–90 % — с энцефаломиопатиями, ≈ 90–100 % — с перинатальной гибелью. Для m.8993T>G приводят ориентиры 60–70 % для синдрома NARP и выше 90 % для синдрома Лея (Fraser 2010). По одному проценту гетероплазмии диагноз не устанавливают: значение зависит от исследованной ткани, возраста и других особенностей организма. Если первичный дефект находится в ядерном гене репликации (например, POLG), доля одного варианта мтДНК механизм не описывает.", "gn_cx4": "Работающие комплексы", "g_cx4": "Показатель отражает долю комплексов, собранных с функциональными субъединицами, относительно нормы. В модели белок-кодирующий ген мтДНК обеспечивает достаточное количество продукта, пока число копий дикого типа не ниже ≈ 40 % обычного числа; для гена тРНК соответствующее значение составляет ≈ 15 % (условно; Chomyn 1992: более 6 % копий дикого типа защищали цибриды с мутацией 3243).", "gn_cap4": "Максимальная мощность дыхательной цепи", "g_cap4": "Максимальная мощность дыхательной цепи — предельный поток электронов при данном наборе комплексов, выраженный в процентах нормы. Благодаря функциональному резерву комплекса снижение его количества вызывает менее выраженное снижение предельного потока электронов (биохимический порог; Rossignol 2003). Для ATP-синтазы соответствующий показатель характеризует предельную скорость её работы.", "gn_thr4": "Порог и дефицит", "g_thr4": "«Дефицит» в модели — митохондрии покрывают меньше 90 % заданной потребности ткани в ATP (условная граница): митохондриального синтеза ATP не хватает для покрытия заданной потребности. Содержание ATP в клетке модель не рассчитывает (гликолиз и другие источники не учтены); снижение функции отдельных комплексов может быть и при полном покрытии потребности. «Порог для этих условий» — доля мутантной мтДНК, при которой покрытие падает до 90 % при выбранных гене, числе копий и потребности ткани. Различают фенотипический, биохимический и трансляционный пороги (Rossignol 2003); в модели они действуют вместе. Если дефицит есть и без мутантной мтДНК (число копий мало или мутация в ядерном гене), порог равен 0 % или не определён: причина дефицита не в доле мутантного варианта.", "gn_dpsi4": "Δψ на вкладке 4", "g_dpsi4": "Та же шкала, что на вкладках 1–3. При дефекте цепи |Δψ| снижается; при дефекте ATP-синтазы в модели Δψ сохраняется, потому что H⁺ медленнее возвращаются через синтазу (в клетках с m.8993T>G данные о Δψ различаются).", "gn_measure4": "Как измеряют", "g_measure4": "Долю мутантной мтДНК определяют секвенированием (в том числе длинных прочтений и отдельных клеток) или количественной ПЦР в тканях и отдельных клетках; число копий — по соотношению мтДНК и ядерной ДНК. Порог ищут в цибридах с разной долей мутантной мтДНК: измеряют синтез митохондриальных белков, активность комплексов и дыхание (Chomyn 1992; Rossignol 2003; Picard 2014). Цибриды получают, перенося митохондрии пациента в клетки ρ⁰ (King & Attardi 1989).", "gn_model4": "Что упрощено в вопросе 4", "g_model4": "В модели количество продукта гена мтДНК ограничено числом копий дикого типа и уровнем насыщения: 40 % обычного числа для белок-кодирующего гена и 15 % для гена тРНК. Переход к насыщению описан сглаженной функцией минимума. Предельный поток через комплекс увеличивается с его количеством до насыщения, а максимальная мощность дыхательной цепи рассчитывается как произведение вкладов комплексов I, III и IV. Для клетки используется модель вкладки 1 с выбранной потребностью ткани. Мутантные копии не подавляют работу копий дикого типа: доминантно-негативное действие отсутствует. Не моделируются митофагия, сегрегация мтДНК при делении клеток, ретроградная сигнализация и перестройка экспрессии генов (Picard 2014). «Бутылочное горлышко» представлено одной независимой случайной выборкой копий для каждого потомка — условной эффективной выборкой — без последующей сегрегации и отбора. Вероятность заболевания не рассчитывается. Мутация MT-CO1 — учебный вариант без указания конкретной замены; коэффициенты функционального резерва условны и не задают общего порядка порогов для генов тРНК и белок-кодирующих генов. Все коэффициенты условные: числа показывают направление и порядок изменений.", "teacher_8": "Вопрос 4: базовый уровень 5–7 минут, продвинутый 8–10 минут. Модель — надстройка над вкладкой 1: доля мутантной мтДНК и число копий задают долю работающих комплексов, а клетка с выбранной потребностью ткани показывает покрытие потребности в ATP. Пороговый эффект определяется тремя видами функционального резерва: избытком копий дикого типа, избытком комплексов и резервом максимальной мощности цепи. Спорное и упрощённое: численные пороги условны и зависят от мутации, ткани и ядерного генетического фона; сегрегация мтДНК при делении клеток, митофагия и ретроградная сигнализация в модели не учтены; «бутылочное горлышко» показано одной случайной выборкой копий (эффективная выборка; 10 и 200 — учебные значения, вероятность заболевания не рассчитывается). На шаге 6 продвинутого уровня вместо схемы показана гистограмма; после ответа контуром показано распределение при 200 копиях.", "lg_ca": "ионы Ca²⁺: число частиц в потоках отражает скорость переноса, а в ЭПР, цитоплазме и матриксе — концентрацию", "lg_cp": "копии мтДНК: бирюзовые — дикого типа, красные — мутантные (вкладка 4)", "lg_fill": "заливка блока комплекса — доля работающих комплексов (вкладка 4)", "r3_when": "Показания в момент {tr} с (за 2 с до конца сигнала)", "r3_load_mx": "максимум к {tr} с: {lmax} % (на {tmax} с)", "tr3_now": "показания: {t} с", "tr3_max": "максимум", "r3_dem": "Расход ATP клеткой относительно покоя", "gn_dem3": "Расход ATP клеткой", "g_dem3": "Показатель отражает, во сколько раз расход ATP клеткой выше, чем в покое. В модели расход растёт вместе с подъёмом [Ca²⁺] в цитоплазме при сигнале IP₃ (работа Ca²⁺-АТФаз и других Ca²⁺-зависимых процессов): в 1 + 2,5 × сигнал раза (условно). После тапсигаргина сигнал не повышает [Ca²⁺] в цитоплазме, и расход в модели не растёт; поэтому при сравнении потребления O₂ и расхода ATP с необработанными клетками различаются сразу два условия.", "lbl3_pop_t": "Пора в митохондриях (значки — доли)", "lbl3_pop_c": "закрыта: {p} % · Δψ {d} мВ · {a}", "lbl3_pop_o": "открыта: {p} % · Δψ {d} мВ · {a}", "lbl3_syn": "синтез ATP", "lbl3_hyd": "гидролиз ATP", "tr4_hc_ref": "Контур — распределение при выборке из {nb0} копий (до изменения).", "poe_cmp": "Показания: было → стало", "poe_cmp_none": "Показания на панели не изменились.", "lbl4_ch1": "{g}: копии дикого типа {wt} % → {cxs} {f} %", "lbl4_ch2": "→ максимальная мощность цепи {cap} % → покрытие потребности {cov} %", "lbl4_ch2v": "→ максимальная мощность ATP-синтазы {vs} % → покрытие потребности {cov} %", "lbl4_ch_nuc": "ядерный ген субъединицы комплекса I → комплекс I {f} %", "cx4_all": "комплексы I, III, IV, V", "gs4_ND": "MT-ND5", "gs4_CO": "MT-CO1", "gs4_ATP6": "MT-ATP6", "gs4_TL1": "MT-TL1 (тРНК)", "info_ref": "Справка · в расчёт не входит", "ref_grp": "Справка · в расчёт не входит", "lg_ref": "пунктирная кнопка — справка; в расчёт не входит", "gl_imp": "Справка: другие пути импорта", "gl_tim23": "Справка: TOM и TIM23", "gl_repl": "Справка: репликация мтДНК", "gl_expr": "Справка: от мтДНК к комплексам", "gl_coord": "Справка: согласование геномов", "gl_polg": "Справка: ядерные гены репликации", "gl_hetero4": "Справка: гетероплазмия и гомоплазмия", "gl_nuc4": "Справка: ядерный геном и митохондрии", "gn_imp": "Другие пути импорта белков в митохондрии", "gtag_imp": "Справка к вопросу 2 · в расчёт не входит: в модели рассчитан только индекс импорта через TIM23", "g_imp": "<b>Определение.</b> Митохондрии импортируют из цитоплазмы около 1000 разных белков у дрожжей и около 1300 у человека; через комплекс TOM наружной мембраны входят более 90 % из них (Pfanner 2025). Дальше разные системы — транслоказы — доставляют белки в разные отделы митохондрии: у них различаются сигналы узнавания и условия переноса.\n<b>Что происходит.</b> Около двух третей импортируемых белков имеют отщепляемую N-концевую сигнальную последовательность и идут через TOM и комплекс TIM23: Δψ необходим для переноса сигнальной последовательности, мотор PAM с mtHsp70 протягивает белок в матрикс за счёт ATP, а сигнальную последовательность отщепляет митохондриальная процессирующая пептидаза. У других белков такой последовательности нет, и они идут иначе. Малые Tim-белки межмембранного пространства доставляют многопроходные белки-переносчики внутренней мембраны (например, переносчик ADP/ATP) к комплексу TIM22; TIM22 встраивает их во внутреннюю мембрану, и этот путь тоже зависит от Δψ. Те же малые Tim-белки передают белки с β-бочонком комплексу SAM, и он встраивает их в наружную мембрану. Богатые цистеином белки межмембранного пространства импортирует система MIA (Mia40, у человека CHCHD4) путём окислительного фолдинга. Белки наружной мембраны с α-спиральными сегментами встраивает комплекс MIM у грибов, а в клетках человека — белок MTCH2 (Pfanner 2025).\n<b>Что наблюдали.</b> В изолированных митохондриях клеток человека HEK293T меченный радиоактивной серой переносчик ADP/ATP (ANT3) образовывал комплекс 120 кДа только при наличии Δψ; без Δψ в межмембранном пространстве накапливался промежуточный продукт импорта. После нокдауна TIM29 — субъединицы транслоказы TIM22 (siRNA; содержание TIM29 в митохондриях снижено примерно вдвое, а содержание TIM22 — примерно на треть) — образование этого комплекса к 45 мин было заметно меньше; вклад одного TIM29 по этому опыту не отделён (Callegari 2016).\n<b>Граница вывода.</b> Данные получены на изолированных митохондриях и клетках в культуре для одного белка-субстрата; нокдаун TIM29 снижал и содержание TIM22. Снижение импорта одного белка-предшественника не доказывает одинакового нарушения всех путей доставки митохондриальных белков: у путей разные белки-субстраты, транслоказы и условия переноса.\n<b>Связь с моделью.</b> В вопросе 2 рассчитан один показатель — условный индекс Δψ-зависимого импорта через TIM23 при достаточном ATP в матриксе. Пути через TIM22, SAM, MIA и MIM/MTCH2 в модели не представлены, и индекс импорта через TIM23 их не описывает.", "gfc_imp": "Схема: пути доставки белков в митохондрии. Залит путь, рассчитанный в модели вопроса 2; пунктир — пути, которых в модели нет.", "gfa_imp": "Схема. Пять путей импорта. Белки с отщепляемой сигнальной последовательностью идут через TOM и TIM23 с мотором PAM во внутреннюю мембрану и матрикс; этот путь есть в модели. Многопроходные переносчики идут через TOM, малые Tim и TIM22 во внутреннюю мембрану. Белки с β-бочонком идут через TOM, малые Tim и SAM в наружную мембрану. Богатые цистеином белки идут через TOM и систему MIA в межмембранное пространство. α-Спиральные белки наружной мембраны встраивают MIM у грибов и MTCH2 у человека.", "fg_im_a1": "Белки с отщепляемой|N-концевой сигнальной|последовательностью", "fg_im_b1": "TOM → TIM23 + мотор PAM|(mtHsp70, ATP); нужен Δψ|(в модели)", "fg_im_c1": "внутренняя|мембрана,|матрикс", "fg_im_a2": "Многопроходные|переносчики|(ANT и др.)", "fg_im_b2": "TOM → малые Tim → TIM22|нужен Δψ", "fg_im_c2": "внутренняя|мембрана", "fg_im_a3": "Белки наружной|мембраны|с β-бочонком", "fg_im_b3": "TOM → малые Tim → SAM", "fg_im_c3": "наружная|мембрана", "fg_im_a4": "Богатые цистеином белки|межмембранного|пространства", "fg_im_b4": "TOM → MIA (Mia40;|у человека CHCHD4):|окислительный фолдинг", "fg_im_c4": "межмембранное|пространство", "fg_im_a5": "α-Спиральные белки|наружной мембраны", "fg_im_b5": "MIM (грибы);|MTCH2 (человек)", "fg_im_c5": "наружная|мембрана", "fg_im_note": "Залито — путь модели; пунктир — пути вне модели", "gn_repl": "Репликация мтДНК: полимераза γ, TWINKLE, mtSSB", "gtag_repl": "Справка к вопросу 4 · в расчёт не входит: репликация и образование копий мтДНК в модели не рассчитываются", "g_repl": "<b>Определение.</b> Все белки репликации мтДНК кодирует ядерный геном: они синтезируются на рибосомах цитоплазмы и импортируются в митохондрии (Milenkovic 2013). Минимальный набор для синтеза ДНК in vitro — ДНК-полимераза γ, хеликаза TWINKLE и белок mtSSB, связывающий одноцепочечную ДНК.\n<b>Что происходит.</b> Каталитическая субъединица полимеразы γ (белок POLγA, ген POLG) синтезирует ДНК и обладает 3′→5′-экзонуклеазной активностью. Добавочная субъединица POLγB (ген POLG2) повышает сродство полимеразы к ДНК и необходима для работы репликационного комплекса на двухцепочечной матрице. Хеликаза TWINKLE (ген TWNK) раскручивает двойную спираль в направлении 5′→3′, а mtSSB связывает освободившуюся одноцепочечную ДНК. Полимераза γ не может использовать двухцепочечную ДНК как матрицу, а TWINKLE в одиночку раскручивает лишь короткие участки; вместе они синтезируют длинные цепи ДНК на двухцепочечной матрице (Korhonen 2004; Farge 2007).\n<b>Что наблюдали.</b> В системе из очищенных белков человека полимераза γ и TWINKLE синтезировали на двухцепочечной матрице цепи длиной около 2 тыс. нуклеотидов, а добавление mtSSB увеличивало продукты до ≈ 16 тыс. нуклеотидов — размера мтДНК (Korhonen 2004; Farge 2007). У мышей, у которых ген Twinkle удалили в сердце и скелетной мышце, содержание мтДНК в сердце к 4-й неделе жизни составляло менее 30 % нормы, а к 16-й — 6 %; уменьшалось содержание мтДНК-кодируемых РНК и белков COX1 и COX2, нарушалась сборка дыхательных комплексов. При повышении содержания TWINKLE в 2–3 раза у трансгенных мышей содержание мтДНК увеличивалось на 20–50 % (Milenkovic 2013).\n<b>Граница вывода.</b> Это минимальная система из очищенных белков (синтетическая мини-кольцевая матрица с готовой вилкой и затравкой, синтез только ведущей цепи; Farge 2007) и опыты на мышах; в клетке репликации нужны и другие белки (для образования праймеров, вероятно, митохондриальная РНК-полимераза POLRMT; Milenkovic 2013). Нарушение репликации может менять и число копий мтДНК, и её структуру (делеции), но это разные следствия: при полной потере TWINKLE у мышей мтДНК истощалась без накопления делеций (Milenkovic 2013). Какие изменения мтДНК возникают при конкретном дефекте, разбирает карточка «Ядерные гены репликации». Число копий мтДНК и доля мутантного варианта (гетероплазмия) — разные величины.\n<b>Связь с моделью.</b> Репликация в вопросе 4 не рассчитывается. Число копий мтДНК задаётся (на продвинутом уровне — ползунком «Число копий мтДНК», на базовом — обычное число копий), а доля мутантного варианта — отдельным параметром. Кружки на схеме показывают заданное число копий, а не реплицирующиеся молекулы.", "gfc_repl": "Схема: минимальный репликационный комплекс мтДНК. Не рассчитывается: в вопросе 4 число копий задано.", "gfa_repl": "Схема. Полимераза γ состоит из каталитической субъединицы POLγA (ген POLG), синтезирующей ДНК, и добавочной субъединицы POLγB (ген POLG2). Хеликаза TWINKLE (ген TWNK) раскручивает двойную спираль, белок mtSSB связывает одноцепочечную ДНК. Вместе они составляют минимальный набор, который в системе из очищенных белков на синтетической мини-кольцевой матрице синтезирует цепи ДНК длиной с мтДНК (около 16 тысяч нуклеотидов).", "fg_rp_pol": "полимераза γ", "fg_rp_a": "POLγA|(ген POLG)|синтез ДНК", "fg_rp_b": "POLγB|(ген POLG2)|добавочная|субъединица", "fg_rp_c": "TWINKLE|(ген TWNK)|хеликаза:|раскручивает ДНК", "fg_rp_d": "mtSSB|связывает|одноцепочечную|ДНК", "fg_rp_res": "Синтез ДНК in vitro: цепи длиной около 16 тыс. нуклеотидов", "fg_rp_note": "Число копий мтДНК и доля мутантного варианта — разные величины", "gn_polg": "Ядерные гены репликации и вторичные изменения мтДНК", "gtag_polg": "Справка к вопросу 4 · в расчёт не входит: мутации генов POLG, POLG2 и TWNK в модели не задаются", "g_polg": "<b>Условие.</b> Первичный дефект может находиться не в мтДНК, а в ядерном гене, белковый продукт которого участвует в поддержании мтДНК. К таким генам относятся POLG, POLG2 и TWNK: они кодируют полимеразу γ, её добавочную субъединицу и хеликазу TWINKLE (Viscomi, Zeviani 2017).\n<b>Что происходит.</b> Патогенные варианты этих генов нарушают работу репликационного комплекса, и в тканях вторично изменяется мтДНК: снижается число её копий (истощение), накапливаются множественные делеции или возникают оба изменения. Вариант в гене мтДНК действует иначе: изменён сам продукт мтДНК (белок, тРНК или рРНК). Общее правило для вариантов самой мтДНК иное: точковые патогенные варианты обычно передаются по материнской линии, а крупные перестройки чаще возникают спорадически (Viscomi, Zeviani 2017). Болезни, вызванные вариантами ядерных генов поддержания мтДНК, наследуются по законам Менделя (аутосомно-доминантно или рецессивно), а не по материнской линии (Viscomi, Zeviani 2017).\n<b>Что наблюдали.</b> Гетерозиготные варианты TWNK у человека связаны с множественными делециями мтДНК, а рецессивные варианты POLG — и с делециями, и с истощением мтДНК (при синдроме Альперса — Хуттенлохера описано истощение); одни и те же варианты POLG встречаются при разных синдромах (Viscomi, Zeviani 2017). У мышей полная потеря TWINKLE в сердце и скелетной мышце вызывала истощение мтДНК без делеций (Milenkovic 2013), а у ранее созданных трансгенных «делетор-мышей» с мутантным белком TWINKLE (дупликация 13 аминокислот в линкерной области) множественные делеции мтДНК накапливались в позднем возрасте (Tyynismaa 2005).\n<b>Граница вывода.</b> Тип изменения мтДНК зависит от гена, варианта и ткани: один и тот же ген может быть связан и с истощением, и с делециями. По доле одного варианта мтДНК нельзя определить ни этот механизм, ни тяжесть заболевания: для вывода нужны данные о конкретном варианте, гене, ткани и типе изменения мтДНК (число копий или делеции). Пороги гетероплазмии, найденные для вариантов мтДНК, на такие болезни не переносятся.\n<b>Связь с моделью.</b> Мутации POLG, POLG2 и TWNK в модели не задаются. Ближайшая модельная ситуация — снижение числа копий мтДНК при нулевой доле мутантной мтДНК (продвинутый уровень): дефицит ATP возможен и без мутантных копий; множественные делеции модель не воспроизводит. Это разбирается в задании 7 сценария «предскажи и проверь» продвинутого уровня. Режим «мутация в ядерном гене (комплекс I)» показывает другой случай: поражён ген субъединицы комплекса I, а мтДНК не изменена.", "gfc_polg": "Схема: уровень первичного дефекта. Вверху — ядерный ген репликации (вторичные изменения мтДНК), внизу — вариант в гене мтДНК. Не рассчитывается.", "gfa_polg": "Схема. Верхний ряд: вариант в ядерном гене POLG, POLG2 или TWNK нарушает работу комплекса репликации; вторично возникают истощение мтДНК или множественные делеции, и функция комплексов снижается. Нижний ряд: вариант в гене мтДНК изменяет продукт этого гена; при варианте гена белка снижается функция комплекса, содержащего этот белок, а при варианте гена тРНК или рРНК может нарушаться синтез белков мтДНК; в модели при этом одинаково снижается функция комплексов I, III, IV и V.", "fg_pg_r1": "Первичный дефект в ядерном геноме", "fg_pg_a1": "Вариант в гене|POLG, POLG2|или TWNK", "fg_pg_a2": "Нарушена работа|комплекса|репликации", "fg_pg_a3": "Вторично:|истощение мтДНК|и/или делеции", "fg_pg_a4": "Снижена|функция|комплексов", "fg_pg_r2": "Первичный дефект в гене мтДНК", "fg_pg_b1": "Вариант в гене|мтДНК", "fg_pg_b2": "Изменён продукт|гена: белок,|тРНК или рРНК", "fg_pg_b3": "Снижена функция|комплексов с белками мтДНК", "fg_pg_note": "Мутации POLG, POLG2 и TWNK в модели не задаются", "gn_expr": "От мтДНК к дыхательным комплексам: транскрипция, процессинг РНК, митотрансляция", "gtag_expr": "Справка к вопросу 4 · в расчёт не входит: этапы экспрессии мтДНК в модели не рассчитываются", "g_expr": "<b>Определение.</b> Гены мтДНК экспрессируются в самой митохондрии, но все белки, нужные для поддержания и экспрессии мтДНК, кодирует ядерный геном (Milenkovic 2013). Тринадцать белков мтДНК — субъединицы комплексов I, III, IV и V; комплекс II целиком кодируется ядерным геномом (Scarpulla 2011).\n<b>Что происходит.</b> Транскрипция мтДНК начинается на промоторах контрольной области. В её инициации участвуют митохондриальная РНК-полимераза POLRMT и два фактора — TFAM и TFB2M; в очищенной системе человека для транскрипции генов мтДНК достаточно этих трёх белков (Yakubovskaya 2014; Litonin 2010). TFAM действует на мтДНК в митохондрии и не является фактором транскрипции ядерных генов. Каждая цепь транскрибируется как длинный предшественник с несколькими генами; тРНК, расположенные между генами рРНК и белков, вырезаются, и это освобождает отдельные мРНК и рРНК («пунктуация тРНК»; Mercer 2011). Миторибосомы, связанные с внутренней мембраной, синтезируют 13 белков мтДНК (митотрансляция); инсертаза OXA1L связывается с большой субъединицей миторибосомы и сопрягает синтез белка с доставкой в мембрану (Itoh 2021). При участии факторов сборки митохондриально-кодируемые белки объединяются с ядерно-кодируемыми субъединицами в дыхательные комплексы и ATP-синтазу.\n<b>Что наблюдали.</b> В митохондриях клеток человека линии 143B содержание отдельных РНК сильно различалось, хотя все они образуются из общих предшественников; это указывает на роль посттранскрипционных механизмов, в том числе стабильности РНК, для экспрессии мтДНК (секвенирование РНК и анализ концов РНК; Mercer 2011); такая же неравномерность содержания разных РНК наблюдалась в 16 тканях человека. Структуры миторибосом человека с растущим полипептидом, связанным с OXA1L, получены методом криоэлектронной микроскопии (Itoh 2021). У мышей с удалением гена Twinkle в сердце при истощении мтДНК уменьшалось содержание мтДНК-кодируемых транскриптов и белков COX1 и COX2, тогда как содержание субъединицы SDH2 комплекса II, который целиком кодируется ядерным геномом, не менялось (Milenkovic 2013).\n<b>Граница вывода.</b> Показаны не все участники: на каждом этапе работают и другие белки. Данные получены на очищенных белках, культивируемых клетках и мышах. Стрелки на схеме поясняют последовательность этапов, а не скорости. Одинаковое снижение дыхания может возникать при нарушении разных этапов экспрессии двух геномов, поэтому по нему самому этап нарушения определить нельзя.\n<b>Связь с моделью.</b> В вопросе 4 рассчитаны число копий дикого типа (плавное насыщение с условными параметрами: 40 % обычного числа для белок-кодирующего гена и 15 % для гена тРНК), доля работающих комплексов, максимальная мощность цепи и покрытие потребности в ATP. Транскрипция, процессинг РНК и встраивание в мембрану не рассчитываются. Вариант гена тРНК в модели снижает функцию сразу комплексов I, III, IV и V, потому что тРНК нужны для синтеза всех 13 белков мтДНК; одинаковое снижение — упрощение.", "gfc_expr": "Схема: от гена мтДНК до дыхательного комплекса (пояснительная, без скоростей). Не рассчитывается.", "gfa_expr": "Схема. Шесть этапов сверху вниз. мтДНК: 13 белков, 22 тРНК, 2 рРНК; транскрипцию начинают TFAM, POLRMT и TFB2M. Первичные транскрипты: тРНК вырезаются, освобождаются мРНК и рРНК. Зрелые мРНК, тРНК и рРНК. Митотрансляция на миторибосоме, связанной с внутренней мембраной. Встраивание белков в мембрану с участием OXA1L. Сборка комплексов I, III, IV и V вместе с ядерными субъединицами и факторами сборки.", "fg_ex_b1": "мтДНК|13 белков, 22 тРНК, 2 рРНК", "fg_ex_c1": "POLRMT, TFAM и TFB2M|начинают транскрипцию", "fg_ex_b2": "первичные транскрипты|(длинные, с несколькими генами)", "fg_ex_c2": "тРНК вырезаются:|освобождаются мРНК и рРНК", "fg_ex_b3": "зрелые мРНК, тРНК и рРНК", "fg_ex_c3": "мРНК — матрицы синтеза белка;|рРНК и тРНК — участники синтеза", "fg_ex_b4": "митотрансляция|(13 белков мтДНК)", "fg_ex_c4": "миторибосома связана|с внутренней мембраной", "fg_ex_b5": "встраивание в мембрану|(OXA1L)", "fg_ex_c5": "OXA1L связана с большой|субъединицей миторибосомы", "fg_ex_b6": "сборка комплексов I, III, IV, V|вместе с ядерными субъединицами", "fg_ex_c6": "нужны факторы сборки;|комплекс II — только ядерные субъединицы", "fg_ex_note": "Стрелки поясняют последовательность этапов, а не скорости", "gn_coord": "Согласование двух геномов: PGC-1α, NRF1 и TFAM", "gtag_coord": "Справка к вопросу 4 · в расчёт не входит: регуляция биогенеза митохондрий в модели не рассчитывается", "g_coord": "<b>Определение.</b> Субъединицы дыхательных комплексов кодируются двумя геномами, поэтому их экспрессия должна быть согласована. Одно из звеньев согласования — ядерные транскрипционные факторы и их коактиваторы, которые активируют транскрипцию генов белков митохондрий, в том числе гена TFAM. Коактиватор PGC-1α сам не связывает ДНК: он действует через транскрипционные факторы, в том числе NRF1, NRF-2 (GABP) и ERRα (Scarpulla 2011). Не путайте два разных белка с похожим названием: ядерный дыхательный фактор NRF-2 — это GABP, активатор из семейства ETS (Virbasius 1993), а NRF2 (ген NFE2L2), который рассматривается в семинаре 10, — фактор ответа на окислительный стресс; по структуре он относится к семейству bZIP (Moi 1994).\n<b>Что происходит.</b> PGC-1α повышает экспрессию генов NRF1 и NRF-2 и коактивирует NRF1 на промоторе гена TFAM (Wu 1999). Белок TFAM участвует в репликации и транскрипции мтДНК и упаковывает её в нуклеоиды (Kukat 2015), а NRF1 связан с экспрессией многих ядерных генов, нужных дыхательному аппарату (Scarpulla 2011). Так ядерная программа экспрессии связана с поддержанием и экспрессией мтДНК.\n<b>Что наблюдали.</b> В культуре мышечных клеток избыточная экспрессия PGC-1 (в современной номенклатуре PGC-1α) усиливала митохондриальный биогенез и дыхание (Wu 1999). По обзору Scarpulla (2011), в культивируемых клетках избыточная экспрессия PGC-1α повышала содержание белков COXIV и цитохрома c и содержание мтДНК, а доминантно-отрицательный вариант NRF1 блокировал действие PGC-1α на митохондриальный биогенез.\n<b>Граница вывода.</b> PGC-1α участвует в регуляции, но не управляет биогенезом единолично: он входит в сеть коактиваторов (PGC-1α, PGC-1β, PRC) и факторов (NRF1, NRF-2, ERRα и других), которая сама зависит от внешних сигналов и от модификаций коактиваторов (Scarpulla 2011). Данные получены главным образом на культивируемых клетках; по ним нельзя рассчитать, во сколько раз изменится число копий мтДНК или содержание комплексов.\n<b>Связь с моделью.</b> Регуляция биогенеза в вопросе 4 не рассчитывается: число копий мтДНК и доля мутантного варианта заданы, а вклад ядерных генов в комплексы считается нормальным (кроме режима «мутация в ядерном гене»). Показатель «Работающие комплексы» отражает баланс вкладов двух геномов, но не механизм, который их согласует; универсального регулятора с фиксированным усилением в модели нет.", "gfc_coord": "Схема: одно звено сети, согласующей экспрессию двух геномов. Не рассчитывается.", "gfa_coord": "Схема. Внешние сигналы действуют на коактиватор PGC-1α. PGC-1α действует через транскрипционные факторы NRF1, NRF-2 (GABP), ERRα и другие. Они активируют транскрипцию ядерных генов белков митохондрий, в том числе гена TFAM; белок TFAM участвует в репликации и транскрипции мтДНК.", "fg_co_sig": "внешние|сигналы", "fg_co_pgc": "PGC-1α|(коактиватор)", "fg_co_tf": "транскрипционные|факторы:|NRF1, NRF-2 (GABP),|ERRα и другие", "fg_co_nuc": "ядерные гены|белков|митохондрий", "fg_co_tfam": "ген TFAM →|TFAM: мтДНК|(репликация,|транскрипция)", "fg_co_note": "Показано одно звено сети: в ней есть и PGC-1β, и PRC", "p4a_7_q": "У пациента найдены патогенные варианты гена POLG (ядерного гена каталитической субъединицы ДНК-полимеразы γ) в обоих аллелях. В клетках ткани со средней потребностью в энергии число копий мтДНК снижено до 25 % обычного числа, а мутантных копий мтДНК нет (доля 0 %). Модель не рассчитывает репликацию: снижение числа копий задано вручную. Что покажет модель и где находится первичный дефект?", "p4a_7_o1": "Дефицит ATP есть, хотя мутантной мтДНК нет: первичный дефект в ядерном гене, а копий мтДНК слишком мало", "p4a_7_o2": "Дефицита не будет: при доле мутантной мтДНК 0 % все копии нормальны", "p4a_7_o3": "Дефицит будет, потому что мутация находится в мтДНК", "p4a_7_e": "По условию мутантных копий мтДНК нет (0 %), но копий всего 25 % обычного числа (насыщение в модели плавное; условный параметр для белок-кодирующего гена — 40 %). В модели функция комплексов I, III, IV и V составляет 61 % нормы, максимальная мощность цепи — 43 %, митохондрии покрывают 67 % потребности в ATP (при обычном числе копий — 98 %), Δψ −124 мВ: дефицит есть без единой мутантной копии. Первичный дефект находится в ядерном гене POLG: он нарушает работу репликационного комплекса, а число копий мтДНК снижается вторично (истощение мтДНК; Viscomi, Zeviani 2017). В опыте на мышах полная потеря TWINKLE в сердце снижала содержание мтДНК до 6 % нормы к 16-й неделе (Milenkovic 2013). Модель воспроизводит только снижение числа копий; при вариантах POLG возможны и множественные делеции, и разные синдромы, поэтому по числу копий или доле одного варианта нельзя определить ни ген, ни тяжесть болезни. В ткани с низкой потребностью при тех же 25 % копий покрытие остаётся около 91 % — дефицита нет.", "p4a_7_w2": "Число копий важно и тогда, когда все они дикого типа: при 25 % обычного числа копий функция комплексов в модели снижается до 61 % нормы (насыщение плавное, 40 % — условный параметр), максимальная мощность цепи — до 43 %, а покрытие потребности в ATP составляет 67 %, что ниже принятого в модели порога дефицита 90 %. Доля мутантной мтДНК показывает состав копий, а не их число.", "p4a_7_w3": "По условию мутантных копий мтДНК нет (0 %); модель показывает дефицит и без них. Первичный дефект здесь в ядерном гене репликации POLG, а мтДНК меняется вторично. Вариант в гене мтДНК действовал бы через изменённый продукт этого гена и долю мутантных копий — как в первых заданиях сценария.", "src_001": "Brand M. D., Nicholls D. G. Assessing mitochondrial dysfunction in cells. Biochem J. 2011;435:297–312. doi:10.1042/BJ20110162", "src_002": "Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3", "src_003": "Nicholls D. G., Darley-Usmar V. M., Wu M., Jensen P. B., Rogers G. W., Ferrick D. A. Bioenergetic profile experiment using C2C12 myoblast cells. J Vis Exp. 2010;(46):2511. doi:10.3791/2511", "src_004": "Hinkle P. C. P/O ratios of mitochondrial oxidative phosphorylation. Biochim Biophys Acta. 2005;1706:1–11. doi:10.1016/j.bbabio.2004.09.004", "src_005": "Mookerjee S. A., Gerencser A. A., Nicholls D. G., Brand M. D. Quantifying intracellular rates of glycolytic and oxidative ATP production and consumption using extracellular flux measurements. J Biol Chem. 2017;292:7189–7207. doi:10.1074/jbc.M116.774471. Исправление: J Biol Chem. 2018;293:12649–12652. doi:10.1074/jbc.AAC118.004855", "src_006": "Watt I. N., Montgomery M. G., Runswick M. J., Leslie A. G. W., Walker J. E. Bioenergetic cost of making an adenosine triphosphate molecule in animal mitochondria. Proc function t(k, v){ let s = (k in TEXTS) ? TEXTS[k] : ('⟨' + k + '⟩'); if (v) for (const a in v) s = s.split('{' + a + '}').join(v[a]); return s; }
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function defs(s){ return `<defs>
  <marker id="a_${s}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
  <marker id="b_${s}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="10" orient="auto"><path d="M3.5 0 L6.5 0 L6.5 10 L3.5 10 z" class="mk"/></marker>
</defs>`; }
function E(id, d, kind, s, extra = ''){ return `<path id="${id}" class="edge ${extra}" d="${d}" marker-end="url(#${kind === 'inh' ? 'b' : 'a'}_${s})"/>`; }
function setEdge(id, v){ const e = $(id); if (e) e.style.opacity = (typeof v === 'boolean' ? (v ? 1 : .16) : (.16 + .84 * clamp(v))).toFixed(2); }
function setCls(id, cls){ const e = $(id); if (!e) return; e.classList.remove('on', 'off', 'inh'); if (cls) e.classList.add(cls); }
function setOp(id, v){ const e = $(id); if (e) e.setAttribute('opacity', (+v).toFixed(2)); }
function setTxt(id, s){ const e = $(id); if (e) e.textContent = s; }

function XX(id, x1, y1, x2, y2){ return `<g class="cross fade" id="${id}" opacity="0"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x2}" y1="${y1}" x2="${x1}" y2="${y2}"/></g>`; }

function segVal(id){ const b = $(id).querySelector('[aria-pressed="true"]'); return b ? b.dataset.v : null; }

function wire(ids, fn){ ids.forEach(id => { const e = $(id); if (!e) return;

function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = o.xunit ? 36 : 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    if (o.xnum !== false){ c.textAlign = 'center'; c.fillText(String(i), X(i), Hh - (o.xunit ? 21 : 7)); } }

/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py --student) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же

function poePerm(key, i, n, ok){
  let h = 2166136261; for (const c of key + '/' + i + '/' + (POE_SALTS[key] || POE_SALT)) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;

    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : (POE.shown ? `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>` : '')) +   /* «Сценарий закончен» — только после ответа (аудит P02) */
