</li><li><b>Б.</b> M+5 согласуется с восстановительным карбоксилированием α-КГ; чистый поток нужно подтверждать отдельно. <i>(верный вариант)</i><br><span class="expl">Пять атомов ¹³C исходного α-КГ сохраняются, а присоединённый CO₂ немечен, что даёт M+5. Однако M+5 не доказывает чистый поток по этому пути: часть M+5 может возникать при обмене изоцитрат ⇄ α-КГ.</span></li><li><b>В.</b> Доля M+5 в цитрате допускает расчёт скорости потока по этому пути без дополнительной модели. <i>(неверный вариант)</i><br><span class="expl">Доля изотополога — не скорость: поток требует учёта разведения метки, обмена и модели.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-8.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.copbio.2015.02.003">Buescher J. M. et al. A roadmap for interpreting ¹³C metabolite labeling patterns from cells. Curr Opin Biotechnol. 2015;34:189–201.</a></li><li><a href="https://doi.org/10.1038/nature10602">Metallo C. M. et al. Reductive glutamine metabolism by IDH1 mediates lipogenesis under hypoxia. Nature. 2012;481:380–384.</a></li><li><a href="https://doi.org/10.1038/nature10642">Mullen A. R. et al. Reductive carboxylation supports growth in tumour cells with defective mitochondria. Nature. 2012;481:385–388.</a></li><li><a href="https://doi.org/10.1038/ncomms3236">Fendt S.-M. et al. Reductive glutamine metabolism is a function of the α-ketoglutarate to citrate ratio in cells. Nat Commun. 2013;4:2236.</a></li></ul><p>Схемы M02 и M03 учебные: значения долей условные и не относятся к реальным клеткам; показан первый оборот цикла при немеченых остальных источниках. Принципы интерпретации мечения приведены по обзору Buescher и соавт. (2015, прочитан полный текст), примеры маршрутов — по работам Metallo, Mullen и Fendt с соавт.</p></details></article><article class="card print-unit" id="ns-acetyl-coa-compartments"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 15 из 32</div><h2>Откуда берётся ацетил-CoA для ацетилирования гистонов</h2><p class="lead">Внутренняя мембрана митохондрий не пропускает <a href="#ns-g-S8-T44">ацетил-CoA</a>, поэтому его митохондриальный пул отделён от пула в цитозоле и ядре. Вне митохондрий основными источниками ацетил-CoA служат цитрат (фермент <a href="#ns-g-S8-T45">ACLY</a>) и ацетат (фермент <a href="#ns-g-S8-T46">ACSS2</a>); вклад других путей, в том числе ацетилкарнитина, зависит от клеток.</p><ol class="mech"><li>Главный путь выхода ацетильных групп из матрикса: ацетил-CoA конденсируется с оксалоацетатом в цитрат, и цитрат выходит в цитозоль через переносчик SLC25A1. Второй путь проходит через ацетилкарнитин.</li><li>В цитозоле и ядре ACLY расщепляет цитрат с участием CoA и ATP на ацетил-CoA и оксалоацетат, а ACSS2 образует ацетил-CoA из ацетата, CoA и ATP.</li><li><a href="#ns-g-S8-T47">Гистонацетилтрансферазы</a> используют ацетил-CoA ядра и цитозоля. Этот пул пополняется цитратом и ацетатом, а по данным отдельных работ также ацетилкарнитином и локальным синтезом в ядре; митохондриальный пул пополняется иначе и с ним напрямую не смешивается.</li></ol><p>В митохондриях ацетил-CoA образуется при окислении пирувата, жирных кислот и аминокислот и расходуется в ЦТК. Внутренняя мембрана митохондрий не пропускает ацетил-CoA, поэтому ацетильные группы покидают матрикс главным образом в составе цитрата: ацетил-CoA конденсируется с оксалоацетатом, и цитрат выходит через переносчик SLC25A1. Второй путь — через ацетилкарнитин: карнитинацетилтрансфераза (CrAT) переносит ацетильную группу на карнитин, и ацетилкарнитин выходит из митохондрий через переносчик SLC25A20.</p><p>Вне митохондрий ацетил-CoA образуется двумя основными путями. ACLY в присутствии CoA и ATP расщепляет цитрат на ацетил-CoA и оксалоацетат. ACSS2 присоединяет CoA к ацетату за счёт ATP. Оба фермента обнаружены и в цитозоле, и в ядре. Кроме того, ацетил-CoA из пирувата образует ядерный пируватдегидрогеназный комплекс (Sutendra и соавт., 2014). В клетках мышиной карциномы печени без ACLY и ACSS2 ацетильные группы поступали из митохондрий в виде ацетилкарнитина, а в клетках с ACLY отсутствие CrAT на синтез жирных кислот не влияло (Izzo и соавт., 2023).</p><p>Вклад путей зависит от клеток и условий. В клетках колоректальной карциномы человека HCT116 при снижении количества ACLY ацетилирование гистонов уменьшалось, а сверхфизиологические концентрации ацетата в среде возвращали ацетилирование гистонов (с участием ACSS2; Wellen и соавт., 2009). В фибробластах мыши (MEF) без ACLY ацетат в концентрации 100 мкМ поддерживал выживание, но не возвращал ацетилирование гистонов, а при 1 мМ ацетилирование повышалось (Zhao и соавт., 2016). В дифференцированных нейрональных клетках мыши ACSS2 расположена преимущественно в ядре, а ACLY — в цитозоле, и подавление ACSS2 снижало ацетилирование гистонов (Mews и соавт., 2017).</p><p>Из-за разделения пулов содержание ацетил-CoA в митохондриях не определяет, сколько субстрата получают ферменты хроматина. Пулы ядра и цитозоля обмениваются через ядерные поры, но по обзору Sivanand и соавт. (2018) локальный синтез в ядре и поступающий ацетат вносят в ацетилирование гистонов иной вклад, чем в синтез жирных кислот в цитозоле. Содержание ацетил-CoA в ядре измерено в ядерной фракции методом LC–MS с изотопно меченным внутренним стандартом (SILEC-SF; схема LC–MS — в шаге про величины, связывающие метаболизм с модификацией гистона): при дифференцировке адипоцитов оно возрастало примерно в 5 раз вместе с ацетилированием гистонов (Trefely и соавт., 2022).</p><div class="note trap"><strong>Типичная ошибка</strong> Если содержание ацетил-CoA в митохондриях увеличилось, то ацетилирование гистонов автоматически возрастает.<p class="trap-fix">Ацетил-CoA матрикса не проходит внутреннюю мембрану: ядерно-цитозольный пул образуется из цитрата (ACLY), ацетата (ACSS2) и, по отдельным данным, из пирувата в ядре и ацетилкарнитина. Для вывода об ацетилировании нужны сведения об этих путях и о содержании ацетил-CoA в нужном компартменте, а не только о митохондриях.</p></div><div class="static-quiz"><h3>Содержание ацетил-CoA в митохондриях увеличилось. Почему из этого нельзя автоматически заключить об усилении ацетилирования гистонов?</h3><ol><li><b>А.</b> Доступность ядерно-цитозольного субстрата зависит от переноса предшественников и локального синтеза. <i>(верный вариант)</i><br><span class="expl">Внутренняя митохондриальная мембрана разделяет пулы ацетил-CoA; они связаны переносом предшественников (цитрат, ацетилкарнитин), а не самого ацетил-CoA.</span></li><li><b>Б.</b> Гистонацетилтрансферазы используют не ацетил-CoA, а свободный ацетат как донор ацетильной группы. <i>(неверный вариант)</i><br><span class="expl">Гистонацетилтрансферазы переносят ацетильную группу именно с ацетил-CoA; ацетат служит лишь одним из его предшественников.</span></li><li><b>В.</b> Ацетил-CoA матрикса переносится через внутреннюю мембрану специальным переносчиком и попадает в ядро. <i>(неверный вариант)</i><br><span class="expl">Внутренняя мембрана не пропускает ацетил-CoA: ацетильные группы покидают матрикс в составе цитрата или ацетилкарнитина.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1126/science.1164097">Wellen K. E. et al. ATP-citrate lyase links cellular metabolism to histone acetylation. Science. 2009;324:1076–1080.</a></li><li><a href="https://doi.org/10.1038/nature22405">Mews P. et al. Acetyl-CoA synthetase regulates histone acetylation and hippocampal memory. Nature. 2017;546:381–386.</a></li><li><a href="https://doi.org/10.1016/j.tibs.2017.11.004">Sivanand S., Viney I., Wellen K. E. Spatiotemporal control of acetyl-CoA metabolism in chromatin regulation. Trends Biochem Sci. 2018;43:61–74.</a></li><li><a href="https://doi.org/10.1016/j.celrep.2016.09.069">Zhao S. et al. ATP-citrate lyase controls a glucose-to-acetate metabolic switch. Cell Rep. 2016;17:1037–1052.</a></li><li><a href="https://doi.org/10.1016/j.cell.2014.04.046">Sutendra G. et al. A nuclear pyruvate dehydrogenase complex is important for the generation of acetyl-CoA and histone acetylation. Cell. 2014;158:84–97.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2021.11.006">Trefely S. et al. Quantitative subcellular acyl-CoA analysis reveals distinct nuclear metabolism and isoleucine-dependent histone propionylation. Mol Cell. 2022;82:447–462.</a></li><li><a href="https://doi.org/10.1126/sciadv.adf0115">Izzo L. T. et al. Acetylcarnitine shuttling links mitochondrial metabolism to histone acetylation and lipogenesis. Sci Adv. 2023;9:eadf0115.</a></li></ul><p>Схема качественная: числа не заданы, состояния показывают направление сдвига при прочих равных. Данные об ACLY и ацетате получены на клетках HCT116 (Wellen и соавт., 2009) и на фибробластах мыши MEF (Zhao и соавт., 2016), об ACSS2 — на нейрональных клетках CAD и нейронах мыши (Mews и соавт., 2017), о ядерном ацетил-CoA — на модели дифференцировки адипоцитов (Trefely и соавт., 2022). Ацетилкарнитиновый путь показан на схеме пунктиром, его вклад в клетках с ACLY мал (данные получены на мышиных клетках карциномы печени: Izzo и соавт., 2023). Ядерный пируватдегидрогеназный комплекс (Sutendra и соавт., 2014) на схеме не показан. Объединение пулов ядра и цитозоля в одну стрелку обмена — упрощение.</p></details></article><article class="card print-unit" id="ns-acetylation-balance"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 16 из 32</div><h2>Как устанавливается и удаляется ацетилирование гистонов</h2><p class="lead"><a href="#ns-g-S8-T47">Гистонацетилтрансфераза</a> переносит ацетильную группу с ацетил-CoA на остаток лизина, а деацетилазы — <a href="#ns-g-S8-T48">HDAC</a> и <a href="#ns-g-S8-T49">сиртуины</a> — её удаляют. Поэтому доля ацетилированных сайтов определяется соотношением скоростей этих реакций, а не только количеством субстрата.</p><ol class="mech"><li>Гистонацетилтрансфераза переносит ацетильную группу с ацетил-CoA на ε-аминогруппу лизина: образуются ацетил-лизин и CoA, а положительный заряд боковой группы нейтрализуется.</li><li>HDAC — Zn²⁺-зависимые ферменты, которые гидролизуют амидную связь ацетил-лизина; сиртуины катализируют другую реакцию, для которой необходим NAD⁺.</li><li>Доля ацетилированных сайтов при постоянстве условий определяется соотношением скоростей присоединения и удаления ацетильной группы и обновлением гистонов.</li></ol><p>Ацетилирование гистона — перенос ацетильной группы с ацетил-CoA на ε-аминогруппу лизина. Реакцию катализирует гистонацетилтрансфераза (HAT, или KAT); кроме ацетил-лизина, образуется свободный CoA. Боковая группа лизина NH₃⁺ несёт положительный заряд, а ацетилированная боковая группа NH–CO–CH₃ заряда не имеет; потеря заряда может менять взаимодействие гистона с ДНК. Кроме того, ацетилированные остатки узнают особые белки, например белки с бромодоменами.</p><p>Удаляют ацетильную группу деацетилазы двух химических типов. Классические HDAC (классы I, II и IV; в этом шаге под HDAC понимают именно их) — Zn²⁺-зависимые ферменты: они гидролизуют амидную связь и освобождают ацетат (Seto и Yoshida, 2014). Сиртуины (по номенклатуре — класс III) катализируют другую реакцию: ацетильная группа переносится на ADP-рибозу, а из NAD⁺ образуется никотинамид. Поэтому активность сиртуинов зависит от доступности NAD⁺ в соответствующем компартменте и от их сродства к NAD⁺ (см. шаг про отношение NADH/NAD⁺), а HDAC в NAD⁺ не нуждаются. Не все сиртуины действуют на гистоны: SIRT6 деацетилирует <a href="#ns-g-S8-T54">H3K9ac</a> в теломерном хроматине (Michishita и соавт., 2008), а многие другие сиртуины действуют на негистоновые белки.</p><p>Доля ацетилированных сайтов зависит от нескольких реакций сразу. Пусть сайт ацетилируется с константой скорости k₁, в которую входит доступность ацетил-CoA, и деацетилируется с константой k₂ (обе константы псевдопервого порядка и постоянны). Тогда в стационарном состоянии доля ацетилированных сайтов равна k₁/(k₁ + k₂): она растёт и при ускорении присоединения, и при замедлении удаления. В клетках HCT116 ингибитор HDAC трихостатин A подавлял снижение ацетилирования гистонов, вызванное уменьшением количества ACLY (Wellen и соавт., 2009): когда удаление ацетильных групп замедлено, нехватка ацетил-CoA меньше влияет на ацетилирование.</p><p>Кроме того, гистоны обновляются: при репликации ДНК к родительским гистонам добавляются новые. По данным Alabert и соавт. (2015), модификации новых гистонов в основном устанавливались в течение одного клеточного цикла, а H3K9me3 и H3K27me3 — дольше; эти данные относятся главным образом к метилированию, и переносить их на ацетилирование без отдельной проверки нельзя. Итак, рост доли ацетилированных сайтов сам по себе не доказывает усиления присоединения ацетила: он мог возникнуть при ослаблении удаления. Нельзя также считать ацетилирование сигналом активации всех генов: связь метки с транскрипцией зависит от локуса.</p><div class="note trap"><strong>Типичная ошибка</strong> Если доля ацетилированных сайтов гистона возросла, то гистонацетилтрансфераза стала работать быстрее.<p class="trap-fix">Доля ацетилированных сайтов зависит от присоединения, удаления и обновления гистонов. Тот же результат даёт замедление удаления при неизменном присоединении, например при подавлении HDAC.</p></div><div class="static-quiz"><h3>Скорость ацетилирования гистона сохранена, а скорость удаления ацетильной группы снижена. Как при прочих равных изменится доля ацетилированных сайтов?</h3><ol><li><b>А.</b> Возрастёт, поскольку баланс присоединения и удаления ацетила сместится. <i>(верный вариант)</i><br><span class="expl">Накопление модификации возможно и без ускорения присоединения: достаточно замедлить удаление.</span></li><li><b>Б.</b> Снизится, поскольку избыток ацетилированных сайтов тормозит присоединение ацетила. <i>(неверный вариант)</i><br><span class="expl">По условию скорость присоединения сохранена; замедление удаления увеличивает, а не уменьшает долю ацетилированных сайтов.</span></li><li><b>В.</b> Не изменится, поскольку доля определяется скоростью присоединения ацетила. <i>(неверный вариант)</i><br><span class="expl">Доля зависит и от удаления ацетильной группы, и от обновления гистонов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1164097">Wellen K. E. et al. ATP-citrate lyase links cellular metabolism to histone acetylation. Science. 2009;324:1076–1080.</a></li><li><a href="https://doi.org/10.1101/cshperspect.a018713">Seto E., Yoshida M. Erasers of histone acetylation: the histone deacetylase enzymes. Cold Spring Harb Perspect Biol. 2014;6:a018713.</a></li><li><a href="https://doi.org/10.1038/nature06736">Michishita E. et al. SIRT6 is a histone H3 lysine 9 deacetylase that modulates telomeric chromatin. Nature. 2008;452:492–496.</a></li><li><a href="https://doi.org/10.1101/gad.256354.114">Alabert C. et al. Two distinct modes for propagation of histone PTMs across the cell cycle. Genes Dev. 2015;29:585–590.</a></li></ul><p>Схема качественная: числа не заданы, направление изменения указано для одного сайта при прочих равных. Если изменены и присоединение, и удаление, итог зависит от величины сдвигов и на схеме показан как неопределяемый. Влияние ACLY и ингибитора HDAC описано на клетках HCT116 (Wellen и соавт., 2009), деацетилирование H3K9 сиртуином SIRT6 — на теломерном хроматине человека (Michishita и соавт., 2008), обновление гистонов — на культивируемых клетках человека, главным образом для метилирования (Alabert и соавт., 2015).</p></details></article><article class="card print-unit" id="ns-sam-sah"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 17 из 32</div><h2>Как обмен метионина связан с переносом метильных групп</h2><p class="lead"><a href="#ns-g-S8-T50">S-аденозилметионин</a> (SAM) образуется из метионина и ATP ферментом <a href="#ns-g-S8-T52">MAT</a> и служит донором метильной группы для <a href="#ns-g-S8-T53">метилтрансфераз</a>. После переноса метильной группы остаётся <a href="#ns-g-S8-T51">S-аденозилгомоцистеин</a> (SAH), который может тормозить метилтрансферазу.</p><ol class="mech"><li>MAT присоединяет аденозильную группу ATP к атому серы метионина и образует SAM; из ATP при этом освобождаются фосфат и пирофосфат.</li><li>Метилтрансфераза переносит метильную группу с SAM на субстрат, например на лизин гистона; SAM превращается в SAH, который у многих метилтрансфераз связывается в активном центре и конкурирует с SAM.</li><li>SAH гидролизуется до гомоцистеина и аденозина, а гомоцистеин превращается в метионин: метионинсинтазой (кофермент — производное витамина B₁₂, донор метильной группы — 5-метилтетрагидрофолат) или, в печени и почках, бетаин-гомоцистеин-метилтрансферазой.</li></ol><p>Метионин служит источником метильных групп не сам по себе, а после активации. Метионинаденозилтрансфераза (MAT) переносит аденозильную группу ATP на атом серы метионина и образует SAM — соединение с сульфониевым центром, легко отдающее метильную группу. SAM служит донором метильной группы при метилировании гистонов, ДНК, РНК и малых молекул; по обзору Ducker и Rabinowitz (2017), среди используемых ферментами молекул SAM по распространённости уступает только ATP.</p><p>Метилтрансфераза катализирует реакцию: SAM + субстрат → SAH + метилированный субстрат. У многих метилтрансфераз SAH связывается в активном центре и конкурирует с SAM, поэтому скорость метилирования зависит и от содержания SAM, и от содержания SAH. SAH гидролизуется аденозилгомоцистеиназой (AHCY) до гомоцистеина и аденозина; реакция обратима, поэтому при накоплении гомоцистеина и аденозина растёт и содержание SAH. Гомоцистеин превращается в метионин метионинсинтазой (MTR): её кофермент, производное витамина B₁₂, принимает метильную группу от 5-метилтетрагидрофолата (5-метил-ТГФ), а в печени и почках гомоцистеин метилирует также бетаин-гомоцистеин-метилтрансфераза (BHMT), для которой донором служит бетаин. Так метиониновый цикл связан с обменом фолатов; метильные группы 5-метил-ТГФ происходят из одноуглеродного обмена (см. шаг про поступление углерода глюкозы в биосинтез), но выраженность этой связи зависит от клеток и условий. Метилирование цитозина в ДНК (образование 5mC) катализируют ДНК-метилтрансферазы (DNMT), также использующие SAM; окисление 5mC — в шаге про диоксигеназы.</p><p>SAM можно рассматривать двояко. Как <a href="#ns-g-S8-T57">косубстрат</a> конкретной реакции он расходуется в каждом каталитическом цикле, и скорость реакции зависит от его концентрации вблизи фермента. Под «метильным пулом» клетки понимают суммарное содержание SAM; оно зависит от синтеза SAM из метионина, от его расхода в реакциях метилирования и от реметилирования гомоцистеина. Изменение суммарного содержания SAM неодинаково сказывается на разных реакциях, потому что ферменты различаются по сродству к SAM и по чувствительности к SAH.</p><p>В клетках HCT116 при снижении концентрации метионина в среде до 3 мкМ в течение 24 ч уменьшалось содержание и SAM, и SAH, а метилирование гистона H3 по нескольким лизинам снижалось; после возвращения метионина метилирование возвращалось к исходному уровню (Mentch и соавт., 2015). Отношение SAM/SAH не служит универсальным порогом: значение имеют концентрации SAM и SAH, их локализация и свойства фермента.</p><div class="note trap"><strong>Типичная ошибка</strong> Пока SAM доступен, метилтрансфераза работает с прежней скоростью.<p class="trap-fix">Продукт реакции SAH связывается с метилтрансферазой и конкурирует с SAM при сохранённом содержании SAM. Скорость зависит от концентраций SAM и SAH вблизи фермента и от его свойств, а не только от содержания SAM.</p></div><div class="static-quiz"><h3>Содержание SAM остаётся прежним, а SAH в ядре накапливается. Как при прочих равных изменится скорость метилирования лизина гистона метилтрансферазой, чувствительной к SAH?</h3><ol><li><b>А.</b> Скорость возрастёт, поскольку SAH служит вторым донором метильной группы. <i>(неверный вариант)</i><br><span class="expl">В этой реакции донор — SAM, а SAH является продуктом.</span></li><li><b>Б.</b> Скорость не изменится, поскольку содержание SAM осталось прежним. <i>(неверный вариант)</i><br><span class="expl">SAH конкурирует с SAM за активный центр, поэтому скорость снижается и при прежнем содержании SAM.</span></li><li><b>В.</b> Скорость снизится, поскольку фермент тормозится продуктом реакции — SAH. <i>(верный вариант)</i><br><span class="expl">Сохранение донора метильной группы не устраняет действие SAH.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cmet.2015.08.024">Mentch S. J. et al. Histone Methylation Dynamics and Gene Regulation Occur through the Sensing of One-Carbon Metabolism. Cell Metab. 2015;22:861–873.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2016.08.009">Ducker G. S., Rabinowitz J. D. One-carbon metabolism in health and disease. Cell Metab. 2017;25:27–42.</a></li></ul><p>Схема качественная: концентраций и числовых порогов на ней нет. Зависимость метилирования гистонов от метионина, SAM и SAH показана на клетках HCT116 и в печени мышей на диете с ограничением метионина, где снижались SAM, SAH и H3K4me3 при неизменном содержании метионина в печени (Mentch и соавт., 2015); для других клеток и ферментов она может быть иной. Компартменты показаны условно: в цитируемой работе измерено содержание в клетке целиком.</p></details></article><article class="card print-unit" id="ns-site-specific-methylation"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 18 из 32</div><h2>Почему разные модификации гистонов изменяются неодинаково</h2><p class="lead">Запись <a href="#ns-g-S8-T55">H3K4me3</a> означает гистон H3, лизин в положении 4 и три метильные группы; для <a href="#ns-g-S8-T56">H3K9me3</a> это лизин в положении 9. Эти метки устанавливают и удаляют разные ферменты, поэтому при ограничении общего донора (SAM) их содержание может изменяться неодинаково.</p><ol class="mech"><li>Метилтрансферазы KMT2 (для H3K4) и KMT1A/B (для H3K9) переносят метильные группы с SAM на лизин; у каждой метки свои ферменты установления.</li><li>Деметилазы JmjC KDM5 (для H3K4me3) и KDM4 (для H3K9me3 и H3K9me2) снижают степень метилирования на одну ступень; для этого им нужны α-КГ, O₂ и Fe(II), а не SAM.</li><li>Доля сайтов с меткой в области генома определяется балансом скоростей установления и удаления метки, а также обновлением нуклеосом; SAM нужен для установления метки, но не для её удаления деметилазами JmjC.</li></ol><p>H3K4me3 сильно обогащена вблизи старта транскрипции и найдена как на активных, так и на неактивных промоторах, в том числе у генов, которые могут активироваться (Black и соавт., 2012). H3K9me3 характерна для ряда областей гетерохроматина. Эти ассоциации не означают, что метка сама достаточна для активации или репрессии гена.</p><p>У этих меток разные ферменты. KMT1A и KMT1B (SUV39H1/2) триметилируют H3K9 из состояния H3K9me1. Очищенная KMT2A (MLL1) образует H3K4me2, а в комплексе со своими партнёрами триметилирует H3K4; H3K4me3 в клетках создают и комплексы с SETD1A/B (Wu и соавт., 2008). Удаляют метки деметилазы JmjC: KDM4 снимает H3K9me3 и H3K9me2, но не H3K9me1, а деметилазы KDM5 снимают H3K4me3 (Klose и соавт., 2007). FAD-зависимая LSD1 (KDM1A) к JmjC не относится и удаляет метильные группы с H3K4me2 и H3K4me1 (Black и соавт., 2012); в комплексе с рецептором андрогенов она действует на H3K9me1 и H3K9me2, но не на H3K9me3 (Metzger и соавт., 2005). Метилтрансферазы, о которых идёт речь, используют SAM, а деметилазы JmjC — α-КГ (см. шаг про диоксигеназы).</p><p>Скорость установления метки зависит от сродства фермента к SAM, от торможения продуктом SAH и от доступа к нужному участку хроматина. Скорость удаления зависит от деметилазы и её косубстратов, а на долю метки влияют также обновление нуклеосом и репликация. Поэтому уменьшение содержания общего донора метильных групп не приводит к одинаковому снижению разных меток.</p><p>В клетках HCT116 при ограничении метионина (24 ч) снижалось триметилирование лизинов 4, 9 и 27 гистона H3, и наибольшим было снижение H3K4me3. Оно проявлялось уже при 10–25 мкМ метионина, когда изменялись содержание SAM и SAH (Mentch и соавт., 2015); наиболее сильное ограничение (3 мкМ) приведено в шаге про метиониновый цикл. Снижение H3K4me3 при ограничении метионина наблюдали в каждой из шести проверенных линий. Авторы допускают, что чувствительность определяют кинетические свойства метилтрансфераз, в частности сродство к SAM, но причина большего снижения H3K4me3 в работе не установлена.</p><div class="note trap"><strong>Типичная ошибка</strong> Если H3K4me3 снизилась сильнее других меток, то так будет в любых клетках, и причина состоит в меньшей стабильности этой метки.<p class="trap-fix">Относительная чувствительность показана в конкретных условиях. Её причина в работе не установлена: возможны разные объяснения, и каждое требует отдельной проверки; без отдельной проверки переносить результат на другие клетки и метки нельзя.</p></div><div class="static-quiz"><h3>После ограничения метионина H3K4me3 уменьшилась сильнее H3K9me3. Какой механизм допускает такой результат?</h3><ol><li><b>А.</b> Обе метки изменяются одинаково, поскольку метилтрансферазам обеих нужен SAM. <i>(неверный вариант)</i><br><span class="expl">Общий донор не устраняет различия ферментов и скоростей удаления.</span></li><li><b>Б.</b> Различаются кинетика ферментов этих меток и скорость обновления самих меток. <i>(верный вариант)</i><br><span class="expl">Общий метаболит может по-разному ограничивать разные реакции.</span></li><li><b>В.</b> Деметилазы JmjC используют SAM, поэтому удаление H3K4me3 зависит от него сильнее. <i>(неверный вариант)</i><br><span class="expl">Деметилазы JmjC используют α-КГ, O₂ и Fe(II), а не SAM.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cmet.2015.08.024">Mentch S. J. et al. Histone Methylation Dynamics and Gene Regulation Occur through the Sensing of One-Carbon Metabolism. Cell Metab. 2015;22:861–873.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2012.11.006">Black J. C., Van Rechem C., Whetstine J. R. Histone lysine methylation dynamics: establishment, regulation, and biological impact. Mol Cell. 2012;48:491–507.</a></li><li><a href="https://doi.org/10.1038/nature04020">Metzger E. et al. LSD1 demethylates repressive histone marks to promote androgen-receptor-dependent transcription. Nature. 2005;437:436–439.</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.02.013">Klose R. J. et al. The retinoblastoma binding protein RBP2 is an H3K4 demethylase. Cell. 2007;128:889–900.</a></li><li><a href="https://doi.org/10.1128/MCB.00976-08">Wu M. et al. Molecular regulation of H3K4 trimethylation by Wdr82, a component of human Set1/COMPASS. Mol Cell Biol. 2008;28:7337–7344.</a></li></ul><p>Схема качественная; различие параметров ферментов принято в ней как допущение, чтобы показать механизм. Данные о метионине получены на клетках человека при ограничении метионина в среде на 24 ч (Mentch и соавт., 2015). Связь метки с активностью генов ассоциативна.</p></details></article><article class="card print-unit" id="ns-dioxygenases"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 19 из 32</div><h2>Как α-кетоглутарат участвует в удалении метильных модификаций</h2><p class="lead">α-Кетоглутарат (α-КГ, 2-оксоглутарат) служит косубстратом Fe(II)- и O₂-зависимых диоксигеназ и в каждой реакции превращается в сукцинат и CO₂. К этим ферментам относятся <a href="#ns-g-S8-T58">JmjC-деметилазы</a> гистонов и <a href="#ns-g-S8-T59">белки TET</a>, окисляющие <a href="#ns-g-S8-T60">5-метилцитозин</a> (5mC) в ДНК.</p><ol class="mech"><li>Диоксигеназа связывает Fe(II), α-КГ и субстрат; α-КГ декарбоксилируется до сукцината и CO₂, а один атом кислорода из O₂ переходит в субстрат.</li><li>JmjC-деметилаза окисляет метильную группу лизина, которая отщепляется в виде формальдегида; степень метилирования снижается на одну ступень, например с me3 до me2.</li><li>Белки TET окисляют 5mC до <a href="#ns-g-S8-T61">5hmC</a>, затем до 5-формилцитозина (5fC) и 5-карбоксилцитозина (5caC); в клетках немодифицированный цитозин образуется прежде всего после вырезания основания с репарацией, а метка может убывать и при разбавлении репликацией.</li></ol><p>У диоксигеназ три компонента, которые не следует смешивать. α-КГ и O₂ — косубстраты: в каждом цикле реакции они расходуются, и α-КГ превращается в сукцинат и CO₂. Fe(II) — кофактор: он удерживается в активном центре и не расходуется. Активность этих ферментов зависит от доступности α-КГ и O₂ в ядре, от содержания Fe(II) и от соединений, конкурирующих с α-КГ (см. шаг про нарушения SDH, FH и IDH). α-КГ — другое название 2-оксоглутарата; 2-гидроксиглутарат — другое соединение.</p><p>JmjC-деметилазы удаляют метильные группы лизинов гистонов окислением: метильная группа гидроксилируется и отщепляется в виде формальдегида. Степень метилирования при этом снижается на одну ступень: KDM4 переводит H3K9me3 в H3K9me2 и далее в H3K9me1, но H3K9me1 не удаляет (Black и соавт., 2012). Не все деметилазы гистонов относятся к семейству JmjC: FAD-зависимая LSD1 работает без α-КГ.</p><p>Белки TET окисляют 5mC последовательно: 5mC → 5hmC → 5fC → 5caC. Превращение 5mC в 5hmC белком TET1 показано в клетках и in vitro (Tahiliani и соавт., 2009), а окисление до 5fC и 5caC — на очищенных TET1–3 in vitro, в клетках с TET2 и в геноме эмбриональных стволовых клеток мыши (Ito и соавт., 2011). Ни одна из этих реакций не возвращает немодифицированный цитозин. Тимин-ДНК-гликозилаза (TDG) вырезает основания 5fC и 5caC, после чего эксцизионная репарация оснований (BER) вставляет на их место немодифицированный цитозин (He и соавт., 2011; Maiti и Drohat, 2011); прямое декарбоксилирование 5caC предполагали, но фермент не найден (Ito и соавт., 2011). Отдельный путь — пассивное разбавление при репликации: в новой цепи 5hmC и продукты его окисления не поддерживаются DNMT1-зависимым метилированием, и метка в дочерней ДНК убывает. Поэтому снижение содержания 5mC само по себе не доказывает работу TET.</p><div class="note trap"><strong>Типичная ошибка</strong> Одна реакция TET или JmjC полностью удаляет метку: метилированный лизин сразу становится лизином, а 5mC — цитозином.<p class="trap-fix">JmjC-деметилаза снижает степень метилирования лизина на одну ступень. TET окисляет 5mC последовательно до 5hmC, 5fC и 5caC; цитозин образуется прежде всего после вырезания основания (TDG) и репарации либо при разбавлении метки репликацией.</p></div><div class="static-quiz"><h3>Активность TET снижена, а доступность 5mC, α-КГ, O₂ и Fe(II) не изменилась. Как изменится скорость образования 5hmC из 5mC?</h3><ol><li><b>А.</b> Не изменится: 5hmC образуется при метилировании цитозина без участия TET. <i>(неверный вариант)</i><br><span class="expl">Метилирование цитозина даёт 5mC, а 5hmC — продукт окисления 5mC.</span></li><li><b>Б.</b> Снизится, поскольку 5hmC образуется при окислении 5mC белками TET. <i>(верный вариант)</i><br><span class="expl">При этих условиях снижение активности TET уменьшает скорость окисления 5mC до 5hmC. Содержание 5hmC зависит ещё от его дальнейшего окисления и разбавления при репликации.</span></li><li><b>В.</b> Возрастёт, поскольку TET превращают 5hmC обратно в 5mC. <i>(неверный вариант)</i><br><span class="expl">TET окисляют 5mC и его производные; обратного превращения 5hmC в 5mC они не катализируют.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2012.11.006">Black J. C., Van Rechem C., Whetstine J. R. Histone lysine methylation dynamics: establishment, regulation, and biological impact. Mol Cell. 2012;48:491–507.</a></li><li><a href="https://doi.org/10.1126/science.1170116">Tahiliani M. et al. Conversion of 5-methylcytosine to 5-hydroxymethylcytosine in mammalian DNA by MLL partner TET1. Science. 2009;324:930–935.</a></li><li><a href="https://doi.org/10.1126/science.1210597">Ito S. et al. Tet proteins can convert 5-methylcytosine to 5-formylcytosine and 5-carboxylcytosine. Science. 2011;333:1300–1303.</a></li><li><a href="https://doi.org/10.1126/science.1210944">He Y.-F. et al. Tet-mediated formation of 5-carboxylcytosine and its excision by TDG in mammalian DNA. Science. 2011;333:1303–1307.</a></li><li><a href="https://doi.org/10.1074/jbc.C111.284620">Maiti A., Drohat A. C. Thymine DNA glycosylase can rapidly excise 5-formylcytosine and 5-carboxylcytosine. J Biol Chem. 2011;286:35334–35338.</a></li></ul><p>Схема качественная: скорости и концентрации на ней не заданы. Окисление 5mC показано для TET1 в клетках и in vitro, для TET1–3 in vitro и в клетках с TET2 (Tahiliani и соавт., 2009; Ito и соавт., 2011); доли 5hmC, 5fC и 5caC в разных тканях различаются и здесь не рассматриваются.</p></details></article><article class="card print-unit" id="ns-oncometabolites"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 20 из 32</div><h2>Как нарушения SDH, FH и IDH по-разному меняют метаболиты</h2><p class="lead">Потеря сукцинатдегидрогеназы (SDH) ведёт к накоплению сукцината, потеря фумаразы (FH) — к накоплению фумарата, а мутация IDH1 R132H — к образованию <a href="#ns-g-S8-T62">R-2-гидроксиглутарата</a> (R-2-HG). Эти метаболиты образуются разными путями, но каждый может тормозить α-КГ-зависимые диоксигеназы.</p><ol class="mech"><li>SDH окисляет сукцинат до фумарата, а FH гидратирует фумарат до малата; при потере SDH накапливается сукцинат, при потере FH — фумарат.</li><li>Мутантная IDH1 R132H утрачивает способность катализировать реакцию изоцитрат → α-КГ и приобретает <a href="#ns-g-S8-T63">неоморфную активность</a>: NADPH-зависимое восстановление α-КГ до R-2-HG.</li><li>Сукцинат, фумарат и 2-гидроксиглутарат (2-HG) структурно сходны с α-КГ и конкурируют с ним за активный центр α-КГ-зависимых диоксигеназ, в том числе JmjC-деметилаз и белков TET; эффект зависит от фермента, изомера и концентрации.</li></ol><p>При потере SDH сукцинат не окисляется до фумарата и накапливается; при потере FH накапливается фумарат. Для обоих метаболитов показано конкурентное ингибирование α-КГ-зависимых деметилаз гистонов и ДНК (Xiao и соавт., 2012). Первичные дефекты при этом разные: при потере SDH или FH нарушена реакция ЦТК, а мутантная IDH1 приобретает новую реакцию.</p><p>Мутации IDH1 по остатку R132 не сводятся к потере функции. На очищенном рекомбинантном ферменте и в лизатах клеток 293T IDH1 R132H утрачивал способность превращать изоцитрат в α-КГ и приобретал способность восстанавливать α-КГ до R-2-HG с расходом NADPH. В линиях глиобластомы человека U87MG и LN-18 с исходно немутантной IDH1 экспрессия R132H приводила к накоплению 2-HG, углерод которого происходил из глутамина. В образцах глиом измеряли только содержание 2-HG: в опухолях с мутациями R132 оно составляло 5–35 мкмоль на 1 г ткани, более чем в 100 раз выше, чем в опухолях без мутаций (12 мутантных и 10 немутантных образцов; Dang и соавт., 2009). α-КГ и 2-HG — разные соединения: у 2-HG при втором атоме углерода вместо кетогруппы находится гидроксильная группа.</p><p>Действие 2-HG на разные ферменты различается. По более ранним биохимическим данным, на которые ссылаются Losman и соавт. (2013), оба энантиомера тормозят ряд α-КГ-зависимых ферментов, S-2-HG сильнее тормозит TET2, а на пролилгидроксилазы EglN энантиомеры действуют противоположно. В клетках эритролейкоза человека TF-1 мутантная IDH1 и R-2-HG, но не S-2-HG, вызывали независимость от цитокинов и блок дифференцировки, а в мышиных клетках SCF ER-Hoxb8 — блок дифференцировки, хотя TET2 сильнее тормозит S-2-HG; авторы объясняют это различным действием энантиомеров на EglN. Когда из среды убирали проникающий в клетку эфир R-2-HG, способность клеток дифференцироваться быстро возвращалась, а возврат зависимости от цитокинов требовал тем больше времени, чем выше были доза и длительность прежнего воздействия. Модификации хроматина в этой работе не измеряли, поэтому по ней нельзя судить о скорости возврата меток.</p><p>Сходный итог для хроматина, например повышенное метилирование H3K9, может возникать при разных первичных дефектах. По состоянию метки нельзя судить, какой метаболит накопился, а по накоплению метаболита — какие ферменты заторможены в данной клетке.</p><div class="note trap"><strong>Типичная ошибка</strong> Мутантная IDH1 просто накапливает α-КГ, а потеря SDH, потеря FH и мутация IDH1 одинаково влияют на хроматин.<p class="trap-fix">α-КГ и 2-HG — разные соединения: мутантная IDH1 образует R-2-HG из α-КГ. Сукцинат, фумарат и R-2-HG возникают разными путями, а их действие на диоксигеназы зависит от фермента, изомера и концентрации.</p></div><div class="static-quiz"><h3>В двух клеточных линиях содержание H3K9me3 повышено сходно. В одной утрачена активность SDH, в другой присутствует мутантная IDH1 R132H. Какие первичные метаболические изменения ожидаются?</h3><ol><li><b>А.</b> В первой накапливается сукцинат, во второй образуется R-2-HG. <i>(верный вариант)</i><br><span class="expl">Сходный результат для хроматина может возникать через разные метаболиты.</span></li><li><b>Б.</b> В обеих накапливается α-КГ, поскольку 2-HG — другое название α-КГ. <i>(неверный вариант)</i><br><span class="expl">α-КГ — 2-оксоглутарат; 2-гидроксиглутарат является другим соединением.</span></li><li><b>В.</b> В обеих накапливается сукцинат, поскольку оба нарушения затрагивают ЦТК. <i>(неверный вариант)</i><br><span class="expl">SDH окисляет сукцинат, а мутантная IDH1 R132H непосредственно образует R-2-HG. Наличие мутации IDH1 само по себе не позволяет заключить о накоплении сукцината.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1101/gad.191056.112">Xiao M. et al. Inhibition of α-KG-dependent histone and DNA demethylases by fumarate and succinate that are accumulated in mutations of FH and SDH tumor suppressors. Genes Dev. 2012;26:1326–1338.</a></li><li><a href="https://doi.org/10.1038/nature08617">Dang L. et al. Cancer-associated IDH1 mutations produce 2-hydroxyglutarate. Nature. 2009;462:739–744.</a></li><li><a href="https://doi.org/10.1126/science.1231677">Losman J. A. et al. (R)-2-hydroxyglutarate is sufficient to promote leukemogenesis and its effects are reversible. Science. 2013;339:1621–1625.</a></li></ul><p>Данные об R-2-HG получены на очищенном рекомбинантном ферменте, лизатах клеток 293T, трансфицированных линиях глиобластомы U87MG и LN-18 и образцах глиом (Dang и соавт., 2009), а также на клетках эритролейкоза человека TF-1 и мышиных клетках SCF ER-Hoxb8 (Losman и соавт., 2013; сравнение R- и S-2-HG по силе действия на TET2 приведено в этой работе по более ранним биохимическим данным); для сукцината и фумарата приведены выводы работы Xiao и соавт. (2012) без числовых данных. Схема качественная, пороговых концентраций на ней нет.</p></details></article><article class="card print-unit" id="ns-metabolites-and-marks"><div class="eyebrow">Метаболиты и модификации хроматина · шаг 21 из 32</div><h2>Какие величины связывают изменение метаболизма с модификацией гистона</h2><p class="lead">Содержание метаболита, доля модифицированного гистона и транскрипция гена — разные величины, и каждую измеряют отдельным способом. Здесь рассмотрено, какие величины определяют методы LC–MS и <a href="#ns-g-S8-T81">иммуноблот</a> и какие остаются неизмеренными; на схеме ниже эти методы показаны по режимам.</p><ol class="mech"><li>При LC–MS (на схеме — режим «LC–MS: метаболит») метаболиты разделяют по времени удерживания, определяют по отношению массы к заряду и после калибровки и учёта внутреннего стандарта получают количество метаболита в экстракте; экстракт целых клеток не разделяет компартменты.</li><li>При иммуноблоте (на схеме — режим «Иммуноблот: H3K9ac») сигнал антитела к модификации сравнивают с сигналом общего гистона H3 в линейном диапазоне регистрации; отношение показывает относительное изменение доли модифицированного гистона.</li><li>Ни один из этих методов не указывает положение модификации в геноме и не измеряет транскрипцию; 5hmC в ДНК определяют отдельным дот-блотом с контролем количества ДНК (на схеме — режим «Дот-блот: 5hmC»).</li></ol><p>Содержание метаболита определяют методом LC–MS (на схеме — режим «LC–MS: метаболит»). Принцип метода описан в шаге про прослеживание углерода. Площадь пика не равна количеству вещества: её связывают с ним калибровкой, а потери при экстракции учитывают внутренним стандартом, добавленным до экстракции. Экстракт целых клеток не разделяет компартменты, и по нему нельзя судить о содержании ацетил-CoA или SAM именно в ядре; ядерный ацетил-CoA измеряли в ядерной фракции с меченым внутренним стандартом (SILEC-SF; Trefely и соавт., 2022). Более 300 метаболитов в клетках HCT116 при ограничении метионина Mentch и соавт. (2015) измеряли в экстрактах целых клеток.</p><p>Модификацию гистона определяют иммуноблотом (на схеме — режим «Иммуноблот: H3K9ac»): белки разделяют электрофорезом, переносят на мембрану и выявляют антителом к модификации и антителом к общему H3. Сигнал модификации зависит и от количества гистона в дорожке, и от доли модифицированных молекул, поэтому его сравнивают с сигналом общего H3 в линейном диапазоне регистрации. Антитело должно быть специфичным: при проверке около 200 антител к 57 модификациям гистонов более 25 % не прошли тесты на специфичность (Egelhofer и соавт., 2011).</p><p>Для 5hmC в ДНК применяют дот-блот (на схеме — режим «Дот-блот: 5hmC»): ДНК наносят на мембрану точками и нормируют сигнал антитела к 5hmC на количество ДНК, а не на белок H3. Ни иммуноблот, ни дот-блот не показывают положение модификации в геноме и не измеряют транскрипцию. Модификацию гистонов на определённом участке генома выявляют иммунопреципитацией хроматина (ChIP; на схеме — режим «ChIP: метка у промотора»): фрагменты хроматина с модифицированным гистоном осаждают антителом к модификации, а количество ДНК выбранного участка в осадке определяют количественной ПЦР и выражают долей от входной ДНК. Каждый из этих методов измеряет свою величину, поэтому связь метаболита, доли метки и работы гена требует отдельных измерений. Так, по Wellen и соавт. (2009), подавление ATP-цитратлиазы (ACLY) снижало ацетилирование гистонов в клетках HCT116. В адипоцитах 3T3-L1 оно снижало экспрессию генов Glut4, HK2, PFK-1 и LDHA, которую возвращал ацетат. Ацетилирование гистонов H3 и H4 на промоторе Glut4 определяли методом ChIP: при подавлении ACLY оно снижалось, а ацетат его возвращал.</p><div class="note trap"><strong>Типичная ошибка</strong> Содержание метаболита, измеренное в экстракте клеток, показывает его концентрацию в ядре, где работают ферменты модификации хроматина.<p class="trap-fix">Экстракт целых клеток не разделяет компартменты, а площадь пика соответствует количеству только после калибровки и учёта внутреннего стандарта. Содержание метаболита в ядре и изменение метки на конкретном участке хроматина требуют отдельных измерений.</p></div><div class="static-quiz"><h3>После воздействия сигнал H3K9ac уменьшился вдвое, а сигнал общего H3 тоже уменьшился вдвое. Что можно заключить по этим полосам о доле ацетилированного H3?</h3><ol><li><b>А.</b> По этим полосам доля H3K9ac не изменилась: отношение к общему H3 осталось прежним. <i>(верный вариант)</i><br><span class="expl">При линейной регистрации одинаковое уменьшение обеих полос не доказывает изменения доли.</span></li><li><b>Б.</b> Доля снизилась вдвое: сигнал H3K9ac стал вдвое слабее, чем в контроле. <i>(неверный вариант)</i><br><span class="expl">Сигнал зависит и от количества загруженного гистона.</span></li><li><b>В.</b> Долю иммуноблотом оценить нельзя: метод показывает лишь наличие модификации. <i>(неверный вариант)</i><br><span class="expl">Сравнение сигнала модификации с сигналом общего H3 позволяет оценить долю модифицированного гистона.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-8.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1164097">Wellen K. E. et al. ATP-citrate lyase links cellular metabolism to histone acetylation. Science. 2009;324:1076–1080.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2015.08.024">Mentch S. J. et al. Histone Methylation Dynamics and Gene Regulation Occur through the Sensing of One-Carbon Metabolism. Cell Metab. 2015;22:861–873.</a></li><li><a href="https://doi.org/10.1038/nsmb.1972">Egelhofer T. A. et al. An assessment of histone-modification antibody quality. Nat Struct Mol Biol. 2011;18:91–93.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2021.11.006">Trefely S. et al. Quantitative subcellular acyl-CoA analysis reveals distinct nuclear metabolism and isoleucine-dependent histone propionylation. Mol Cell. 2022;82:447–462.</a></li></ul><p>Схема учебная: площади пиков, сигналы полос и точек даны в условных единицах и не взяты из опыта. Результаты Mentch и соавт. (2015) получены на клетках HCT116 при ограничении метионина, результаты Wellen и соавт. (2009) — на клетках HCT116 и адипоцитах 3T3-L1 при подавлении ATP-цитратлиазы (полный текст), данные Trefely и соавт. (2022) — на субклеточных фракциях клеток, а данные Egelhofer и соавт. (2011) относятся к проверке антител к модификациям гистонов. В опыте ChIP Wellen и соавт. (2009) использовали адипоциты 3T3-L1, антитела к ацетилированным H3 и H4 и контрольную геномную последовательность; IgG на схеме — общий контроль метода, а высота столбцов условная.</p></details></article><article class="card print-unit" id="ns-nad-redox"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 22 из 32</div><h2>Что означает отношение NADH/NAD⁺ в конкретном компартменте</h2><p class="lead"><a href="#ns-g-S8-T64">Отношение NADH/NAD⁺</a> — частное содержаний восстановленной и окисленной форм кофермента в одном компартменте. Оно не задаёт ни общее количество кофермента, ни универсальную норму для клетки.</p><ol class="mech"><li>NAD⁺ принимает от субстрата гидрид-ион и превращается в NADH, а в обратной реакции NADH отдаёт электроны акцептору.</li><li>Отношение форм описывает окислительно-восстановительное состояние пары, а сумма NAD⁺ и NADH — размер пула; при одном отношении пул может быть разным.</li><li>Мембраны свободно не пропускают NAD(H), поэтому у цитозоля и матрикса отдельные пулы и свои отношения форм; электроны между ними переносят челночные системы.</li></ol><p>Никотинамидадениндинуклеотид существует в окисленной (NAD⁺) и восстановленной (NADH) формах. В реакциях дегидрогеназ NAD⁺ принимает от субстрата гидрид-ион, то есть два электрона и протон, и превращается в NADH; в обратной реакции NADH отдаёт эти электроны акцептору, как в реакции лактатдегидрогеназы (см. шаг про образование лактата). Частное содержаний двух форм, отношение NADH/NAD⁺, характеризует окислительно-восстановительное состояние пары, а сумма NAD⁺ и NADH составляет общий пул.</p><p>Отношение и пул — разные величины. Рассмотрим два состояния с одинаковым отношением 0,1 (учебные значения). В первом пул равен 110 условным единицам: 100 приходится на NAD⁺ и 10 на NADH. Во втором пул вдвое меньше, 55 единиц: 50 на NAD⁺ и 5 на NADH. Отношение прежнее, а количество NAD⁺ уменьшилось вдвое. Отношение NADH/NAD⁺ не равно доле NADH в пуле: в первом состоянии она составляет 10/110, то есть около 0,09.</p><p>Отношение определяют для конкретного компартмента. Внутренняя мембрана митохондрий свободно не пропускает NAD(H) и NADP(H), а электроны между цитозолем и митохондриями передают многоступенчатые челночные системы (Lewis и соавт., 2014). Для самого NAD⁺ описан митохондриальный переносчик SLC25A51 (Luongo и соавт., 2020), так что обмен NAD⁺ между компартментами возможен, но у цитозоля и матрикса остаются отдельные пулы и свои отношения форм, и значение для одного компартмента нельзя переносить на другой или на клетку в целом.</p><p>Результат зависит и от того, какую форму кофермента измеряют: свободную или связанную с белками. Часть кофермента связана с белками, причём NADH — в большей степени, чем NAD⁺, поэтому отношение суммарных форм в образце может намного превышать отношение свободных форм в живой клетке (Hung и соавт., 2011; измерение свободных форм сенсорами показано в шаге про сенсоры NADH/NAD⁺ и H₂O₂). Отношение меняется при реакциях образования и окисления NADH, а размер пула — при синтезе кофермента из предшественников и при его расходовании ферментами, не окисляющими NADH. К ним относятся сиртуины и PARP: они используют NAD⁺ как субстрат, а концентрация свободного NAD⁺ в компартментах близка к константам Михаэлиса этих ферментов (Cambronne и соавт., 2016). Универсальной нормы NADH/NAD⁺ нет: значение зависит от типа клеток, компартмента и способа измерения.</p><div class="note trap"><strong>Типичная ошибка</strong> Если отношение NADH/NAD⁺ не изменилось, то и количество NAD⁺ осталось прежним.<p class="trap-fix">Отношение двух форм не задаёт размер пула. При том же отношении общее количество кофермента, а с ним и количество NAD⁺, может быть другим.</p></div><div class="static-quiz"><h3>В обоих состояниях NADH/NAD⁺ = 1/4, но общий пул во втором состоянии втрое меньше. Как соотносятся количества NAD⁺ в этих состояниях?</h3><ol><li><b>А.</b> Количество NAD⁺ в состояниях одинаково, поскольку отношение форм не изменилось. <i>(неверный вариант)</i><br><span class="expl">Отношение не задаёт абсолютное количество кофермента: при том же отношении оно зависит от размера пула.</span></li><li><b>Б.</b> Во втором состоянии NAD⁺ втрое меньше, хотя отношение форм одинаково. <i>(верный вариант)</i><br><span class="expl">При неизменном отношении уменьшение общего пула во столько же раз уменьшает обе формы.</span></li><li><b>В.</b> Во втором состоянии NAD⁺ в четыре раза меньше, поскольку NADH/NAD⁺ = 1/4. <i>(неверный вариант)</i><br><span class="expl">Отношение форм не задаёт, во сколько раз меняется количество NAD⁺: оно уменьшается во столько же раз, во сколько уменьшен пул.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2014.05.008">Lewis C. A. et al. Tracing compartmentalized NADPH metabolism in the cytosol and mitochondria of mammalian cells. Mol Cell. 2014;55:253–263.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2011.08.012">Hung Y. P. et al. Imaging Cytosolic NADH–NAD⁺ Redox State with a Genetically Encoded Fluorescent Biosensor. Cell Metab. 2011;14:545–554.</a></li><li><a href="https://doi.org/10.1126/science.aad5168">Cambronne X. A. et al. Biosensor reveals multiple sources for mitochondrial NAD⁺. Science. 2016;352:1474–1477.</a></li><li><a href="https://doi.org/10.1038/s41586-020-2741-7">Luongo T. S. et al. SLC25A51 is a mammalian mitochondrial NAD⁺ transporter. Nature. 2020;588:174–179.</a></li></ul><p>Схема — расчёт по заданным учебным значениям: отношения, размеры пула и доли связанных форм не взяты из опыта и не являются нормой. Раздельность пулов описана в работе Lewis и соавт. (2014), а более сильное связывание NADH белками — в работе Hung и соавт. (2011); обе прочитаны в полном тексте. Близость содержания свободного NAD⁺ к константам Михаэлиса сиртуинов и PARP — по аннотации работы Cambronne и соавт. (2016); переносчик SLC25A51 — по аннотации работы Luongo и соавт. (2020). Синтез NAD⁺ из предшественников — общепринятое положение без отдельного прочитанного источника.</p></details></article><article class="card print-unit" id="ns-ros-sources"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 23 из 32</div><h2>От чего зависит образование супероксида в митохондриях</h2><p class="lead">В дыхательной цепи электроны в основном передаются O₂ в комплексе IV с образованием воды, но при переносе одного электрона на O₂ на других участках цепи возникает <a href="#ns-g-S8-T67">супероксид-анион-радикал</a>. Скорость его образования зависит от участка цепи и состояния переносчиков, а не от одного отношения NADH/NAD⁺.</p><ol class="mech"><li>Присоединение одного электрона к O₂ даёт супероксид; скорость этой побочной реакции определяют доля восстановленного донора в данном участке и содержание O₂.</li><li>На флавине FMN комплекса I супероксид образуется при высоком NADH/NAD⁺ в матриксе; при обратном переносе электронов от восстановленного Q-пула место его образования остаётся предметом обсуждения (флавин или участок связывания Q).</li><li>Обратный перенос идёт при высокой протондвижущей силе и резко подавляется при её небольшом снижении, поэтому одинаковое отношение NADH/NAD⁺ не гарантирует одинаковой скорости образования супероксида.</li></ol><p>В дыхательной цепи O₂ в основном восстанавливается до воды: в комплексе IV он принимает четыре электрона. Супероксид (O₂•⁻) возникает в побочной реакции, когда восстановленный переносчик, например флавин, отдаёт молекуле O₂ один электрон. Супероксид относится к <a href="#ns-g-S8-T66">активным формам кислорода</a> (АФК). В матриксе он быстро превращается в H₂O₂ ферментативно (см. шаг про удаление H₂O₂), поэтому его содержание мало, и рассматривают прежде всего скорость его образования.</p><p>Первый источник — флавин FMN комплекса I. Электроны от NADH поступают на FMN, и доля полностью восстановленного FMN определяется отношением NADH/NAD⁺ в матриксе. Если это отношение высоко, например при нарушении цепи, скорость образования супероксида на FMN возрастает; протондвижущая сила влияет на это образование лишь косвенно, через потребление NADH и степень восстановленности переносчиков (Murphy, 2009).</p><p>Второй источник — <a href="#ns-g-S8-T76">обратный перенос электронов</a> (RET). Если Q-пул восстановлен, а протондвижущая сила (Δp) высока, электроны из Q-пула могут идти через комплекс I в обратном направлении (к NAD⁺ и O₂), и скорость образования супероксида высока. Q-пул восстанавливается, например, когда сукцинат окисляется сукцинатдегидрогеназой. Место образования супероксида при RET остаётся предметом обсуждения: Murphy (2009) допускал участок связывания Q, а Pryde и Hirst (2011) на субмитохондриальных частицах сердца быка связали и этот процесс с восстановленным флавином. Ротенон подавляет RET, но при прямом переносе от NADH усиливает образование супероксида. RET очень сильно зависит от Δp: небольшое её снижение резко подавляет образование супероксида (Murphy, 2009).</p><p>Супероксид образуют и другие участки, например Qo-участок комплекса III и 2-оксокислотные дегидрогеназы; вклад зависит от ткани, субстрата и условий. В изолированных митохондриях без антимицина A вклад комплекса III обычно меньше вклада комплекса I (Murphy, 2009; Brand, 2016). В модели ишемии и реперфузии сердца мыши сукцинат накапливался при ишемии, а при восстановлении кровотока быстро окислялся; по заключению авторов, это поддерживало образование АФК при RET (Chouchani и соавт., 2014). У дрозофилы АФК, образованные при RET через комплекс I, продлевали жизнь (Scialò и соавт., 2016): действие АФК зависит от места образования, а не только от количества. Обе работы получены на моделях и не переносятся на другие ткани.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем выше NADH/NAD⁺, тем быстрее митохондрии образуют супероксид.<p class="trap-fix">Общей зависимости нет: скорость задают источник электронов, субстрат и направление переноса. Одно отношение NADH/NAD⁺ эти различия не отражает.</p></div><div class="static-quiz"><h3>Почему одинаковое отношение NADH/NAD⁺ не гарантирует одинаковую скорость образования митохондриального супероксида?</h3><ol><li><b>А.</b> Потому что скорость определяется суммарным пулом NAD⁺ и NADH, а не отношением этих форм. <i>(неверный вариант)</i><br><span class="expl">На каждом источнике скорость зависит от восстановленности его донора электронов и от условий, а не от размера пула NAD(H) как такового.</span></li><li><b>Б.</b> Потому что у источников своя зависимость: при RET скорость связана с Q-пулом и протондвижущей силой. <i>(верный вариант)</i><br><span class="expl">При RET скорость зависит от восстановленности Q-пула и протондвижущей силы, а не только от отношения NADH/NAD⁺.</span></li><li><b>В.</b> Потому что основная часть супероксида образуется в комплексе IV при восстановлении O₂ до воды. <i>(неверный вариант)</i><br><span class="expl">В комплексе IV O₂ принимает четыре электрона и превращается в воду; супероксид возникает в побочной реакции на других участках.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BJ20081386">Murphy M. P. How mitochondria produce reactive oxygen species. Biochem J. 2009;417:1–13.</a></li><li><a href="https://doi.org/10.1074/jbc.M110.186841">Pryde K. R., Hirst J. Superoxide is produced by the reduced flavin in mitochondrial complex I: a single, unified mechanism that applies during both forward and reverse electron transfer. J Biol Chem. 2011;286:18056–18065.</a></li><li><a href="https://doi.org/10.1016/j.freeradbiomed.2016.04.001">Brand M. D. Mitochondrial generation of superoxide and hydrogen peroxide as the source of mitochondrial redox signaling. Free Radic Biol Med. 2016;100:14–31.</a></li><li><a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4255242/fullTextXML">Chouchani E. T. et al. Ischaemic accumulation of succinate controls reperfusion injury through mitochondrial ROS. Nature. 2014;515:431–435.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2016.03.009">Scialò F. et al. Mitochondrial ROS produced via reverse electron transport extend animal lifespan. Cell Metab. 2016;23:725–734.</a></li></ul><p>Схема качественная: состояния показаны условно, измеренных значений нет. Источники и режимы описаны для изолированных митохондрий в обзоре Murphy (2009, полный текст); место образования супероксида при RET Murphy называет неясным, а Pryde и Hirst (2011, аннотация) связывают с флавином. Вклад других участков — по Brand (2016, аннотация). Реперфузионный механизм получен на модели сердца мыши (Chouchani и соавт., 2014, полный текст); роль RET при избыточном восстановлении Q-пула у дрозофилы показана Scialò и соавт. (2016, полный текст).</p></details></article><article class="card print-unit" id="ns-h2o2-removal"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 24 из 32</div><h2>Как образование и удаление H₂O₂ формируют его содержание</h2><p class="lead"><a href="#ns-g-S8-T69">Супероксиддисмутаза</a> превращает супероксид в <a href="#ns-g-S8-T68">пероксид водорода</a> и O₂, но не удаляет окислитель полностью. Содержание H₂O₂ определяется соотношением скоростей его образования и ферментативного удаления.</p><ol class="mech"><li>SOD ускоряет дисмутацию двух молекул супероксида до H₂O₂ и O₂; нерадикальный H₂O₂ остаётся и удаляется другими ферментами.</li><li>H₂O₂ восстанавливают до воды пероксиредоксины (в матриксе, в частности, Prx3) и глутатионпероксидазы, а каталаза, находящаяся преимущественно в пероксисомах, разлагает его на воду и O₂.</li><li>При постоянной скорости образования содержание H₂O₂ достигает значения, при котором скорость удаления равна скорости образования; замедление удаления повышает это значение.</li></ol><p>Супероксид превращается в H₂O₂ реакцией дисмутации: 2 O₂•⁻ + 2 H⁺ → H₂O₂ + O₂. Её ускоряет SOD; в матриксе митохондрий действует форма с марганцем, MnSOD, а спонтанная дисмутация при этом вносит малый вклад (Murphy, 2009). Продукт реакции — H₂O₂, а не вода, поэтому SOD снижает содержание супероксида, но не удаляет активные формы кислорода в целом. H₂O₂ не является радикалом и относительно стабилен, поэтому способен диффундировать от места образования (Pak и соавт., 2020); время жизни H₂O₂ в клетке задают системы его удаления.</p><p>Удаляют H₂O₂ три группы ферментов. <a href="#ns-g-S8-T70">Пероксиредоксины</a> (Prx) восстанавливают его до воды за счёт тиола каталитического цистеина; у типичных 2-Cys-пероксиредоксинов окисленный фермент затем восстанавливается тиоредоксином (Trx), а окисленный Trx — тиоредоксинредуктазой за счёт NADPH (см. шаг про NADPH и антиоксидантные системы). Глутатионпероксидазы (GPx) восстанавливают H₂O₂ за счёт глутатиона (GSH), который окисляется до GSSG. Каталаза превращает две молекулы H₂O₂ в воду и O₂ и находится преимущественно в пероксисомах. Какой путь работает, зависит от локализации: в матриксе митохондрий действует, в частности, Prx3.</p><p>Содержание H₂O₂ задаётся соотношением скоростей его образования и удаления. Изменение количества H₂O₂ (N) в одном компартменте, как и для метаболического пула, описывает уравнение dN/dt = J(обр) − J(уд), где J(обр) и J(уд) — скорости образования и удаления. Если скорость удаления пропорциональна количеству, J(уд) = k·N (k — константа скорости удаления), то при постоянном образовании количество стремится к J(обр)/k, и уменьшение k вдвое удваивает его. Это учебная модель без числовых значений.</p><p>Итак, скорость образования окислителя и его содержание — разные величины. Окислительное повреждение — третья величина: оно зависит ещё от мишеней и длительности воздействия (см. шаг про окислительное повреждение). Локализация ферментов тоже важна: подавление каталазы пероксисом прямо не меняет удаление H₂O₂ в матриксе, где действуют Prx3 и GPx.</p><div class="note trap"><strong>Типичная ошибка</strong> Супероксиддисмутаза удаляет активные формы кислорода из клетки.<p class="trap-fix">SOD превращает супероксид в H₂O₂ и O₂. Образовавшийся H₂O₂ удаляют другие ферменты, поэтому SOD снижает содержание супероксида, но не удаляет все АФК.</p></div><div class="static-quiz"><h3>Скорость образования H₂O₂ не изменилась, а скорость его ферментативного удаления снизилась. Как изменится содержание H₂O₂ в компартменте при прочих равных?</h3><ol><li><b>А.</b> Увеличится до нового состояния баланса скоростей образования и удаления. <i>(верный вариант)</i><br><span class="expl">Содержание H₂O₂ задаётся соотношением скоростей образования и удаления; при замедлении удаления оно растёт до нового баланса.</span></li><li><b>Б.</b> Уменьшится, поскольку при замедлении удаления снижается и скорость образования H₂O₂. <i>(неверный вариант)</i><br><span class="expl">По условию скорость образования не изменилась; снижена именно скорость удаления.</span></li><li><b>В.</b> Не изменится, поскольку содержание H₂O₂ определяется скоростью его образования. <i>(неверный вариант)</i><br><span class="expl">Скорость удаления также входит в баланс, поэтому её снижение меняет содержание.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BJ20081386">Murphy M. P. How mitochondria produce reactive oxygen species. Biochem J. 2009;417:1–13.</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7088435/">Pak V. V. et al. Ultrasensitive Genetically Encoded Indicator for Hydrogen Peroxide Identifies Roles for the Oxidant in Cell Migration and Mitochondrial Function. Cell Metab. 2020;31:642–653.e6.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00730-2">Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.</a></li></ul><p>Схема качественная: состояния показаны условно, числовых значений нет. Дисмутация и MnSOD в матриксе — по обзору Murphy (2009, полный текст); участие Prx, GPx и тиоредоксиновой и глутатионовой систем — по введению работы Pak и соавт. (2020, полный текст); каталаза пероксисом — по обзору Sies и соавт. (2024). Положение Prx3 и GPx в матриксе — общепринятые сведения, которые отдельным прочитанным источником здесь не подтверждены.</p></details></article><article class="card print-unit" id="ns-nadph-defense"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 25 из 32</div><h2>Как NADPH поддерживает восстановление антиоксидантных систем</h2><p class="lead">Пара <a href="#ns-g-S8-T65">NADPH/NADP⁺</a> отличается от пары NADH/NAD⁺ дополнительной фосфатной группой и набором реакций. За счёт NADPH восстанавливаются глутатион и тиоредоксин — компоненты <a href="#ns-g-S8-T72">глутатионовой системы</a> и <a href="#ns-g-S8-T71">тиоредоксиновой системы</a>, которые поддерживают работу ферментов удаления H₂O₂.</p><ol class="mech"><li>Глутатионредуктаза восстанавливает GSSG до GSH за счёт NADPH, а GSH необходим глутатионпероксидазе для восстановления H₂O₂.</li><li>Тиоредоксинредуктаза восстанавливает тиоредоксин за счёт NADPH, а тиоредоксин восстанавливает окисленные пероксиредоксины и другие белки.</li><li>NADPH образуется в нескольких реакциях и расходуется не только в системах защиты, но и NADPH-оксидазой, которая образует супероксид.</li></ol><p>Пары NADH/NAD⁺ и NADPH/NADP⁺ различаются: NADPH содержит дополнительную фосфатную группу, и ферменты различают эти коферменты. NADH в основном передаёт электроны дыхательной цепи, а NADPH используется в восстановительных биосинтезах и в системах защиты от окислителей, хотя чёткой границы между ними нет: восстановление окислительных модификаций обеспечивают оба кофермента (Sies и соавт., 2024). Содержание NADPH в клетке невелико и непрерывно обновляется, поэтому по нему одному нельзя судить о скорости использования NADPH, то есть о потоке.</p><p>От NADPH начинаются две цепи. В глутатионовой системе глутатионредуктаза (GR) переносит электроны с NADPH на окисленный глутатион (GSSG), а восстановленный глутатион (GSH) служит донором электронов для глутатионпероксидазы (GPx), которая восстанавливает H₂O₂ до воды. В тиоредоксиновой системе тиоредоксинредуктаза (TrxR) передаёт электроны с NADPH на тиоредоксин (Trx), а тиоредоксин восстанавливает окисленные пероксиредоксины (Prx). Электроны от звена к звену передают конкретные ферменты (GR, TrxR, Trx, Prx); NADPH не восстанавливает H₂O₂ напрямую (Pak и соавт., 2020).</p><p>NADPH образуется в окислительной ветви пентозофосфатного пути и в реакциях фолатного обмена (ферменты MTHFD). Его образуют также малик-фермент (малат → пируват) и изоцитратдегидрогеназы IDH1 (цитозоль) и IDH2 (митохондрии) — в прямой реакции изоцитрат → α-кетоглутарат. При восстановительном карбоксилировании (α-кетоглутарат → изоцитрат; см. шаг про образование цитрата из α-кетоглутарата) те же ферменты, напротив, расходуют NADPH. Трансгидрогеназа внутренней мембраны митохондрий тоже образует NADPH: при высокой протондвижущей силе она переносит электроны с NADH на NADP⁺, а направление реакции зависит от Δp и соотношения пар. Вклад путей зависит от клеток и компартмента. В клетках рака лёгкого A549 и H1299 по включению ²H из [3-²H]глюкозы в липогенный NADPH окислительная ветвь пентозофосфатного пути вносила заметный вклад, а вклад MTHFD1 был минимальным (Lewis и соавт., 2014); в пролиферирующих клетках в другой работе обнаружен вклад одноуглеродного обмена с серином, почти сопоставимый с вкладом пентозофосфатного пути (Fan и соавт., 2014).</p><p>NADPH расходуется не только в защите. NADPH-оксидазы (NOX) передают с него электроны на O₂ и образуют супероксид или H₂O₂, поэтому по содержанию NADPH одному нельзя судить об эффективности защиты: результат зависит от ферментов, локализации и скорости регенерации кофермента.</p><div class="note trap"><strong>Типичная ошибка</strong> NADPH восстанавливает H₂O₂ и другие окислители напрямую, поэтому чем его больше, тем сильнее защита.<p class="trap-fix">NADPH отдаёт электроны ферментам GR и TrxR. H₂O₂ удаляют GPx и Prx, а результат зависит также от локализации и от скорости регенерации NADPH, который расходуется и в реакции NOX.</p></div><div class="static-quiz"><h3>Как снижение доступности NADPH для глутатионредуктазы отразится на удалении H₂O₂ глутатионпероксидазой при сохранённой скорости образования H₂O₂?</h3><ol><li><b>А.</b> Скорость удаления снизится, потому что GSSG медленнее восстанавливается до GSH, который нужен глутатионпероксидазе. <i>(верный вариант)</i><br><span class="expl">NADPH поддерживает оборот восстановленной формы глутатиона через редуктазу, а GSH необходим глутатионпероксидазе.</span></li><li><b>Б.</b> Скорость удаления не изменится, потому что глутатионпероксидаза получает электроны от NADPH напрямую, минуя глутатион. <i>(неверный вариант)</i><br><span class="expl">Глутатионпероксидаза получает электроны от GSH; NADPH передаёт электроны глутатионредуктазе, а не пероксидазе.</span></li><li><b>В.</b> Скорость удаления не изменится, потому что глутатионредуктаза использует NADH, а NADPH нужен лишь для биосинтезов. <i>(неверный вариант)</i><br><span class="expl">Глутатионредуктаза использует NADPH; NADH в основном передаёт электроны дыхательной цепи.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00730-2">Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.05.008">Lewis C. A. et al. Tracing compartmentalized NADPH metabolism in the cytosol and mitochondria of mammalian cells. Mol Cell. 2014;55:253–263.</a></li><li><a href="https://doi.org/10.1038/nature13236">Fan J. et al. Quantitative flux analysis reveals folate-dependent NADPH production. Nature. 2014;510:298–302.</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7088435/">Pak V. V. et al. Ultrasensitive Genetically Encoded Indicator for Hydrogen Peroxide Identifies Roles for the Oxidant in Cell Migration and Mitochondrial Function. Cell Metab. 2020;31:642–653.e6.</a></li></ul><p>Схема качественная, числовых значений нет. Различие вкладов путей в образование NADPH получено на конкретных клеточных линиях (Lewis и соавт., 2014 — полный текст; Fan и соавт., 2014 — прочитана аннотация: наибольший вклад окислительного ПФП и почти сопоставимый — одноуглеродного обмена) и не обобщается на все клетки. Реакция трансгидрогеназы, малик-фермент (кроме упоминания в аннотации Fan и соавт.), направление реакций IDH и роль NADPH в синтезе — общепринятые сведения, отдельным прочитанным источником здесь не подтверждённые.</p></details></article><article class="card print-unit" id="ns-redox-signaling"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 26 из 32</div><h2>Как локальное образование H₂O₂ меняет передачу сигнала</h2><p class="lead">Краткое локальное образование H₂O₂ может обратимо окислять определённые остатки цистеина и тем менять активность белков. Пространство и время такого сигнала ограничивают ферменты, которые удаляют H₂O₂ и восстанавливают окисленные белки.</p><ol class="mech"><li>После активации рецептора NADPH-оксидаза образует супероксид, из которого возникает H₂O₂ в ограниченной области клетки.</li><li>H₂O₂ обратимо окисляет реакционноспособный цистеин фосфатазы; при сохранённой активности киназы фосфорилирование мишени возрастает.</li><li>Окисление может передаваться и через пероксиредоксин (<a href="#ns-g-S8-T74">редокс-реле</a>), а восстановление белков тиоредоксиновой системой ограничивает сигнал.</li></ol><p>Образование окислителя при действии сигнала связывают с NADPH-оксидазами (NOX; Sies и соавт., 2024). Изоформы NOX активируются по-разному (например, NOX2 — фосфорилированием субъединиц и сборкой комплекса, NOX5 и DUOX — ионами Ca²⁺). Большинство изоформ передаёт электроны с NADPH на O₂ и образует супероксид, из которого ферментативной дисмутацией возникает H₂O₂, а NOX4 и DUOX образуют преимущественно H₂O₂. Внеклеточный H₂O₂ может проходить в клетку через специальные каналы, пероксипорины. Так в ограниченной области клетки на короткое время повышается содержание H₂O₂.</p><p>При прямом окислении H₂O₂ реагирует с тиолатом определённого остатка цистеина, например в каталитическом центре протеинтирозинфосфатазы, и активность фермента снижается. Если окисленный остаток затем восстанавливается, воздействие обратимо. Если активность киназы сохранена, а активность фосфатазы снижена, доля фосфорилированной мишени возрастает; повышения активности киназы для этого не требуется. Реакционная способность цистеинов различна, и не все остатки окисляются H₂O₂ одинаково; при активных пероксиредоксинах прямое окисление таких мишеней возможно при высоком локальном содержании H₂O₂ или ослаблении его удаления, этот механизм обсуждается.</p><p>Многие регулируемые белки реагируют с H₂O₂ медленно, а Prx2 — один из наиболее реакционноспособных к H₂O₂ белков клетки. В редокс-реле Prx2 окисляется H₂O₂ и передаёт окислительный эквивалент транскрипционному фактору STAT3; образуются дисульфидно связанные олигомеры STAT3 с ослабленной транскрипционной активностью (Sobotta и соавт., 2015). Прямое окисление и реле — разные механизмы: во втором мишень окисляется белком-посредником, а не самим H₂O₂.</p><p>Область и длительность сигнала ограничивают пероксидазы и системы восстановления. В клетках HeLa с адресным образованием H₂O₂ его распределение по компартментам, по данным одной работы, определяла тиоредоксиновая, а не глутатионовая система (Mishina и соавт., 2019); результат относится к этой модели. Время действия сигнала зависит и от образования, и от удаления H₂O₂. Прекращение сигнала не означает защиты клетки от повреждения: это разные процессы.</p><div class="note trap"><strong>Типичная ошибка</strong> Окисление белка пероксидом водорода всегда неспецифично и повреждает белок.<p class="trap-fix">Локальное обратимое окисление определённых остатков цистеина может менять активность белка и входить в передачу сигнала. Повреждением называют стойкое нарушение функции, а не само окисление.</p></div><div class="static-quiz"><h3>Локальный H₂O₂ обратимо снизил активность фосфатазы при сохранённой активности киназы. Как изменится доля фосфорилированного субстрата этой фосфатазы?</h3><ol><li><b>А.</b> Уменьшится, поскольку окисленный остаток цистеина блокирует присоединение фосфатной группы к субстрату. <i>(неверный вариант)</i><br><span class="expl">Фосфатную группу присоединяет киназа, активность которой сохранена, а фосфатаза её удаляет.</span></li><li><b>Б.</b> Не изменится, поскольку фосфорилирование субстрата определяется активностью киназы, а она сохранена. <i>(неверный вариант)</i><br><span class="expl">Доля фосфорилированного субстрата определяется балансом киназы и фосфатазы, а не одной киназой; при сниженной активности фосфатазы она растёт.</span></li><li><b>В.</b> Увеличится, поскольку удаление фосфатных групп от субстрата замедлилось при сохранённой активности киназы. <i>(верный вариант)</i><br><span class="expl">Доля фосфорилированного субстрата определяется балансом активностей киназы и фосфатазы; при сниженной активности фосфатазы баланс смещается и без усиления киназы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00730-2">Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.</a></li><li><a href="https://doi.org/10.1038/nchembio.1695">Sobotta M. C. et al. Peroxiredoxin-2 and STAT3 form a redox relay for H₂O₂ signaling. Nat Chem Biol. 2015;11:64–70.</a></li><li><a href="https://doi.org/10.1089/ars.2018.7697">Mishina N. M. et al. Which antioxidant system shapes intracellular H₂O₂ gradients? Antioxid Redox Signal. 2019;31:664–670.</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7088435/">Pak V. V. et al. Ultrasensitive Genetically Encoded Indicator for Hydrogen Peroxide Identifies Roles for the Oxidant in Cell Migration and Mitochondrial Function. Cell Metab. 2020;31:642–653.e6.</a></li></ul><p>Схема качественная: состояния показаны условно, числа не заданы. Реле Prx2–STAT3 показано в клетках человека (Sobotta и соавт., 2015, прочитана аннотация) и не обобщается на все пероксиредоксины и мишени. Роль тиоредоксиновой системы показана в клетках HeLa (Mishina и соавт., 2019, прочитана аннотация). Участие NOX в сигнале — по обзору Sies и соавт. (2024); различия изоформ NOX и окисление фосфатаз — общепринятые положения без отдельного прочитанного источника.</p></details></article><article class="card print-unit" id="ns-oxidative-damage"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 27 из 32</div><h2>Когда окислительное воздействие приводит к повреждению</h2><p class="lead">Локальное обратимое окисление отличается от повреждения длительностью, местом и мишенью воздействия. О повреждении говорят, когда нарушение функции стойко, а удаление окислителя и восстановление мишеней не компенсируют воздействие.</p><ol class="mech"><li>H₂O₂ окисляет тиол цистеина до сульфеновой формы, которая может образовать дисульфид (его затем восстанавливают) либо окисляться дальше до сульфиновой и сульфоновой форм.</li><li>Сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов восстанавливает сульфиредоксин за счёт ATP, а сульфоновую форму обычно считают необратимой.</li><li>Стойкое нарушение возникает при длительном воздействии на важные мишени; расходование NAD⁺ при активации PARP после повреждения ДНК — отдельный процесс, не относящийся к окислению цистеина.</li></ol><p>Краткий локальный импульс окислителя, после которого мишень восстанавливается, меняет активность белка обратимо и входит в регуляцию. <a href="#ns-g-S8-T75">Окислительным стрессом</a> называют нарушение баланса окислителей и защитных систем, при котором нарушаются редокс-регуляция и (или) возникает молекулярное повреждение (Sies и соавт., 2024). Его нельзя определить только по наличию H₂O₂ или по одному пороговому значению: общего числа, разделяющего «полезн
