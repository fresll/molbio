эксперимента показывает сигнал при полной деполяризации, олигомицин — вклад ATP-синтазы. Перевод сигнала в милливольты требует отдельной калибровки (Gerencser 2012).</p><p>Импорт белка проверяют в другом эксперименте. Предшественник, меченный радиоактивной аминокислотой, инкубируют с изолированными митохондриями, затем добавляют протеиназу K. Белок, вошедший в митохондрию, защищён мембранами и сохраняется; часто он ещё и укорачивается, потому что MPP отщепила сигнальную последовательность. Если мембраны растворить детергентом, защита исчезает. Если перед импортом снять потенциал разобщителем, защищённого продукта нет (Martin 1991).</p><p>Только сопоставление обоих экспериментов позволяет связать частичную деполяризацию с нарушением импорта конкретного белка.</p><div class="note trap"><strong>Типичная ошибка</strong> Уменьшение интенсивности TMRM само по себе доказывает прекращение импорта.<p class="trap-fix">Сигнал TMRM зависит от режима измерения, массы митохондрий и потенциала плазматической мембраны. Даже подтверждённая частичная деполяризация не показывает, насколько нарушен импорт данного белка: импорт проверяют отдельным экспериментом с защитой от протеазы.</p></div><div class="static-quiz"><h3>После воздействия снизилась флуоресценция TMRM. Достаточно ли этого наблюдения, чтобы утверждать, что импорт белка в матрикс полностью прекратился?</h3><ol><li><b>А.</b> Недостаточно: нужно проверить условия регистрации зонда и сам импорт белка. <i>(верный вариант)</i><br><span class="expl">Сигнал зависит от нескольких факторов. Даже подтверждённая частичная деполяризация ещё не устанавливает степень нарушения конкретного импортного пути.</span></li><li><b>Б.</b> Достаточно: любое уменьшение флуоресценции означает полное исчезновение Δψm. <i>(неверный вариант)</i><br><span class="expl">Падение сигнала не означает автоматически нулевой потенциал. Требуются соответствующие контроли и режим измерения.</span></li><li><b>В.</b> Достаточно: интенсивность TMRM прямо равна числу импортированных молекул. <i>(неверный вариант)</i><br><span class="expl">TMRM отражает распределение потенциалчувствительного зонда и не измеряет число молекул импортированного белка.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-9.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1113/jphysiol.2012.228387">Gerencser A. A., Chinopoulos C., Birket M. J., Jastroch M., Vitelli C., Nicholls D. G., Brand M. D. Quantitative measurement of mitochondrial membrane potential in cultured cells: calcium-induced de- and hyperpolarization of neuronal mitochondria. J Physiol. 2012;590:2845–2871. doi:10.1113/jphysiol.2012.228387</a></li><li><a href="https://doi.org/10.2144/000113610">Perry S. W., Norman J. P., Barbieri J., Brown E. B., Gelbard H. A. Mitochondrial membrane potential probes and the proton gradient: a practical usage guide. BioTechniques. 2011;50:98–115.</a></li><li><a href="https://doi.org/10.1016/S0021-9258(18)55235-2">Martin J., Mahlke K., Pfanner N. Role of an energized inner membrane in mitochondrial protein import. Δψ drives the movement of presequences. J Biol Chem. 1991;266:18051–18057. doi:10.1016/S0021-9258(18)55235-2</a></li><li><a href="https://doi.org/10.1038/s41586-023-06477-8">Fielden L. F. et al. Central role of Tim17 in mitochondrial presequence protein translocation. Nature. 2023;621:627–634.</a></li></ul><p>Учебная модель: яркость и полосы — условные качественные уровни, не данные эксперимента. Распределение катионного зонда через две мембраны, режимы с гашением и без него, необходимость калибровки — Gerencser 2012, Perry 2011. Эксперимент импорта с защитой от протеазы и зависимость от Δψm — изолированные митохондрии Neurospora crassa и дрожжей (Martin 1991); роль транслоказы — Fielden 2023. Для вопроса исходное наблюдение — изменение флуоресценции без калибровки и без измерения импорта.</p></details></article><article class="card print-unit" id="ns-calcium-contacts"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 15 из 30</div><h2>Почему локальный сигнал Ca²⁺ отличается от среднего цитозольного</h2><p class="lead">Ca²⁺, выходящий из ЭПР через <a href="#ns-g-S9-T42">IP₃R</a>, создаёт около открытого канала <a href="#ns-g-S9-T41">локальную микрообласть</a> высокой концентрации. Митохондрия, расположенная в <a href="#ns-g-S9-T39">контакте с ЭПР</a>, оказывается внутри этой микрообласти. Поэтому вход Ca²⁺ в митохондрии определяется не средней концентрацией в цитозоле, а концентрацией у их поверхности.</p><ol class="mech"><li>IP₃R открывается при связывании IP₃ и выпускает Ca²⁺ из просвета ЭПР; около канала концентрация Ca²⁺ на короткое время много выше средней по цитозолю.</li><li>В участках контакта мембраны ЭПР и наружная мембрана митохондрии сближены на десятки нанометров, но не сливаются; Ca²⁺ проходит наружную мембрану через <a href="#ns-g-S9-T43">VDAC</a>, а внутреннюю — через MCU.</li><li>Митохондрия вблизи канала получает высокую локальную концентрацию Ca²⁺, а удалённая — низкую, даже если средний сигнал по клетке одинаков.</li></ol><p>В покое свободная [Ca²⁺] в цитозоле составляет порядка 0,1 мкМ, а в просвете ЭПР — сотни микромолей. Когда гормон или медиатор вызывает образование IP₃, рецепторы IP₃R мембраны ЭПР открываются, и Ca²⁺ выходит в цитозоль. Ион быстро связывается белками-буферами и закачивается обратно в ЭПР Ca²⁺-ATPазой <a href="#ns-g-S9-T47">SERCA</a>, поэтому около открытого канала возникает небольшая область высокой концентрации, которая с расстоянием быстро убывает.</p><p>Многие митохондрии расположены вплотную к ЭПР. В участках контакта мембраны двух органелл сближены на расстояние порядка 10–50 нм и связаны белками; при этом каждая органелла сохраняет свою мембрану. У наружной мембраны митохондрии, находящейся ближе 50 нм к источнику Ca²⁺, концентрация Ca²⁺ может в десятки раз превышать среднюю по цитозолю (Cartes-Saavedra 2025). Классические эксперименты с адресованными зондами показали, что митохондрии, близкие к ЭПР, накапливают Ca²⁺ быстрее и сильнее (Rizzuto 1998).</p><p>Через наружную мембрану Ca²⁺ проходит по каналам VDAC, а через внутреннюю — по каналу MCU. Белки, участвующие в связи органелл, включают комплекс IP₃R–GRP75–VDAC и митофузин 2, но это не сплошной «туннель» для Ca²⁺: ион проходит через цитозольный зазор и два разных канала. Роль митофузина 2 спорна: в одних моделях его удаление уменьшало число контактов, в других — увеличивало (Lim 2021).</p><p>Участки ЭПР, прилегающие к митохондриям, называют <a href="#ns-g-S9-T40">MAM</a> — митохондрия-ассоциированными мембранами. Это не отдельная органелла, а часть ЭПР. Расстояние между мембранами само по себе не измеряет поток Ca²⁺ — это обсуждается в шаге о методах.</p><p>Состав контакта зависит от типа клеток. В сердечной мышце Ca²⁺ к митохондриям поступает и через <a href="#ns-g-S9-T71">рианодиновые рецепторы</a> RyR2 саркоплазматического ретикулума: небольшая часть саркоплазматического ретикулума остаётся связанной с изолированными митохондриями сердца крысы и передаёт им Ca²⁺ локально (García-Pérez 2008). В MAM сосредоточен шаперон ЭПР <a href="#ns-g-S9-T72">SIGMAR1</a>: при снижении [Ca²⁺] в ЭПР он отделяется от шаперона BiP, стабилизирует IP₃R3 и тем самым продлевает поступление Ca²⁺ в митохондрии (Hayashi 2007, клетки CHO). Положение митохондрий тоже регулируется: кинезин перемещает их по микротрубочкам, связываясь с белком наружной мембраны <a href="#ns-g-S9-T73">Miro</a> через адаптер Milton; связывание Ca²⁺ с Miro останавливает движение митохондрий (Wang 2009, нейроны гиппокампа крысы).</p><div class="note trap"><strong>Типичная ошибка</strong> Средняя [Ca²⁺] в цитозоле полностью задаёт концентрацию у MCU.<p class="trap-fix">Концентрация Ca²⁺ в цитозоле неоднородна: около открытого IP₃R она много выше средней. Митохондрия в контакте с ЭПР получает высокую локальную концентрацию, удалённая — низкую, даже при одинаковом среднем сигнале.</p></div><div class="static-quiz"><h3>В двух клетках средний цитозольный сигнал Ca²⁺ одинаков. Может ли поступление Ca²⁺ в митохондрии различаться из-за организации контактов с ЭПР?</h3><ol><li><b>А.</b> Не может: средняя [Ca²⁺] одинакова во всех точках цитозоля. <i>(неверный вариант)</i><br><span class="expl">Среднее по клетке не означает пространственной однородности концентрации.</span></li><li><b>Б.</b> Может: локальная [Ca²⁺] у митохондриальной поверхности может различаться. <i>(верный вариант)</i><br><span class="expl">Одинаковое пространственное среднее не исключает разных локальных микрообластей Ca²⁺. Их положение относительно митохондрии влияет на поступление иона.</span></li><li><b>В.</b> Не может: в контакте мембраны сливаются и Ca²⁺ проходит без каналов. <i>(неверный вариант)</i><br><span class="expl">Контакт сохраняет самостоятельность мембран. Для пути Ca²⁺ важны мембранные каналы и локальная диффузия.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00820-1">Cartes-Saavedra B., Ghosh A., Hajnóczky G. The roles of mitochondria in global and local intracellular calcium signalling. Nat Rev Mol Cell Biol. 2025;26:456–475.</a></li><li><a href="https://doi.org/10.1126/science.280.5370.1763">Rizzuto R., Pinton P., Carrington W., Fay F. S., Fogarty K. E., Lifshitz L. M., Tuft R. A., Pozzan T. Close contacts with the endoplasmic reticulum as determinants of mitochondrial Ca²⁺ responses. Science. 1998;280:1763–1766.</a></li><li><a href="https://doi.org/10.1074/jbc.M803385200">García-Pérez C., Hajnóczky G., Csordás G. Physical coupling supports the local Ca²⁺ transfer between sarcoplasmic reticulum subdomains and the mitochondria in heart muscle. J Biol Chem. 2008;283:32771–32780.</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.08.036">Hayashi T., Su T.-P. Sigma-1 receptor chaperones at the ER–mitochondrion interface regulate Ca²⁺ signaling and cell survival. Cell. 2007;131:596–610.</a></li><li><a href="https://doi.org/10.1016/j.cell.2008.11.046">Wang X., Schwarz T. L. The mechanism of Ca²⁺-dependent regulation of kinesin-mediated mitochondrial motility. Cell. 2009;136:163–174.</a></li></ul><p>Учебная модель: профиль концентрации качественный, числа на оси условные. Сравнивается разное расстояние при одинаковом высвобождении, буферировании, состоянии MCU и Δψm. Порядок величин (до ≈ 10 мкМ в пределах 50 нм от источника при среднем сигнале ≈ 0,1–1 мкМ) — Cartes-Saavedra 2025; связь близости к ЭПР с накоплением Ca²⁺ — клетки HeLa с адресованным экворином и цифровой микроскопией (Rizzuto 1998); противоречивые данные о митофузине 2 — Lim 2021; RyR2 и митохондрии — изолированные митохондрии сердца крысы (García-Pérez 2008); SIGMAR1 — клетки CHO (Hayashi 2007); Miro, Milton и кинезин — нейроны гиппокампа крысы (Wang 2009).</p></details></article><article class="card print-unit" id="ns-calcium-uniplex"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 16 из 30</div><h2>Как MCU и его регуляторы ограничивают поступление Ca²⁺</h2><p class="lead">Митохондриальный Ca²⁺-унипортер — комплекс нескольких белков. MCU образует пору, EMRE связывает пору с регуляторными субъединицами, а <a href="#ns-g-S9-T45">MICU1 и MICU2</a> со стороны межмембранного пространства контролируют её открывание. При низкой концентрации Ca²⁺ MICU-белки удерживают пору закрытой, а при повышенной — связывают Ca²⁺ и пропускают ион.</p><ol class="mech"><li>Четыре субъединицы MCU образуют избирательную для Ca²⁺ пору во внутренней мембране; EMRE необходим для работы поры у млекопитающих и связывает её с MICU1.</li><li>MICU1 в паре с MICU2 (или MICU3) содержит Ca²⁺-связывающие EF-мотивы: при низкой [Ca²⁺] димер ограничивает проводимость поры, при повышенной — связывает Ca²⁺ и снимает ограничение.</li><li>Без MCU быстрый вход Ca²⁺ в матрикс почти исчезает; без MICU1 пора открыта и при низкой [Ca²⁺], а результат зависит от ткани и компенсаторных изменений.</li></ol><p>Унипортер состоит из порообразующего белка MCU и регуляторных субъединиц. Четыре субъединицы MCU образуют в мембране канал с высокой избирательностью для Ca²⁺. Небольшой белок EMRE пронизывает мембрану рядом с порой: у млекопитающих без него пора не работает, и он же закрепляет на комплексе регуляторную субъединицу MICU1.</p><p>MICU1 расположен со стороны межмембранного пространства и образует димер с MICU2 или MICU3. Эти белки содержат EF-мотивы, связывающие Ca²⁺. При низкой концентрации Ca²⁺ димер MICU ограничивает прохождение ионов через пору. Когда концентрация у поверхности митохондрии повышается (по оценкам, выше ≈ 0,4–0,6 мкМ), EF-мотивы связывают Ca²⁺, и пора открывается. Поэтому зависимость входа от концентрации крутая: при покое ион почти не входит, а в микрообласти около IP₃R вход резко ускоряется (Cartes-Saavedra 2025).</p><p>Удаление MCU в клетках и тканях мыши почти устраняет быстрый вход Ca²⁺ в митохондрии, хотя медленное накопление Ca²⁺ другими путями может сохраняться. Удаление MICU1 даёт иной результат: пора перестаёт закрываться при низкой концентрации, и Ca²⁺ входит в матрикс уже в покое. У мышей без MICU1 при этом наблюдали компенсаторное снижение содержания MCU и EMRE, поэтому итог зависит от ткани и длительности изменения.</p><p>MCU и MICU1 — не два названия одного канала, а разные белки одного комплекса: пора и её регулятор.</p><div class="note trap"><strong>Типичная ошибка</strong> MCU и MICU1 — два названия одного и того же канала.<p class="trap-fix">MCU — порообразующая субъединица во внутренней мембране, MICU1 — Ca²⁺-связывающий регулятор со стороны межмембранного пространства. Без MCU пора отсутствует, без MICU1 пора есть, но теряет закрывание при низкой концентрации Ca²⁺.</p></div><div class="static-quiz"><h3>При одинаковом цитозольном импульсе Ca²⁺ и сохранном Δψm из модели удалён MCU. Как изменится быстрый вход Ca²⁺ в матрикс по сравнению с исходной моделью?</h3><ol><li><b>А.</b> Он возрастёт, поскольку MICU1 самостоятельно заменит проводящий канал. <i>(неверный вариант)</i><br><span class="expl">Регуляторный белок MICU1 не заменяет отсутствующий порообразующий MCU.</span></li><li><b>Б.</b> Он уменьшится, поскольку отсутствует основной проводящий компонент комплекса. <i>(верный вариант)</i><br><span class="expl">MCU образует проводящий путь комплекса. Это не означает, что любой остаточный Ca²⁺ в матриксе обязан исчезнуть.</span></li><li><b>В.</b> Он сохранится, поскольку MCU переносит только H⁺, а не Ca²⁺. <i>(неверный вариант)</i><br><span class="expl">MCU проводит Ca²⁺. Перенос H⁺ дыхательной цепью и вход Ca²⁺ — разные процессы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature10234">Baughman J. M., Perocchi F., Girgis H. S., Plovanich M., Belcher-Timme C. A., Sancak Y., Bao X. R., Strittmatter L., Goldberger O., Bogorad R. L., Koteliansky V., Mootha V. K. Integrative genomics identifies MCU as an essential component of the mitochondrial calcium uniporter. Nature. 2011;476:341–345. doi:10.1038/nature10234</a></li><li><a href="https://doi.org/10.1038/nature10230">De Stefani D., Raffaello A., Teardo E., Szabò I., Rizzuto R. A forty-kilodalton protein of the inner membrane is the mitochondrial calcium uniporter. Nature. 2011;476:336–340. doi:10.1038/nature10230</a></li><li><a href="https://doi.org/10.1038/nature02246">Kirichok Y., Krapivinsky G., Clapham D. E. The mitochondrial calcium uniporter is a highly selective ion channel. Nature. 2004;427:360–364. doi:10.1038/nature02246</a></li><li><a href="https://doi.org/10.1038/s41580-024-00820-1">Cartes-Saavedra B., Ghosh A., Hajnóczky G. The roles of mitochondria in global and local intracellular calcium signalling. Nat Rev Mol Cell Biol. 2025;26:456–475.</a></li></ul><p>Схема механизма; состояния качественные. Сравниваются ранние MCU-зависимые ответы при сопоставимом цитозольном импульсе и сохранном Δψm; компенсаторные перестройки не моделируются. Состав комплекса и порог открывания MICU1–MICU2 (≈ 0,4–0,6 мкМ) — Cartes-Saavedra 2025; идентификация MCU — Baughman 2011, De Stefani 2011; MCU как канал — Kirichok 2004.</p></details></article><article class="card print-unit" id="ns-calcium-metabolism"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 17 из 30</div><h2>Как Ca²⁺ связывает клеточную активность с образованием NADH</h2><p class="lead">Ca²⁺ в матриксе активирует три дегидрогеназы, образующие NADH: пируватдегидрогеназный комплекс, NAD-зависимую изоцитратдегидрогеназу (IDH3) и оксоглутаратдегидрогеназу (OGDH). Механизмы разные: пируватдегидрогеназа активируется через дефосфорилирование фосфатазой <a href="#ns-g-S9-T48">PDP1</a>, а две другие дегидрогеназы — прямым связыванием Ca²⁺.</p><ol class="mech"><li>Киназа PDK фосфорилирует субъединицу E1 пируватдегидрогеназного комплекса и ингибирует его; Ca²⁺ активирует фосфатазу PDP1, которая снимает это ингибирующее фосфорилирование.</li><li>IDH3 и OGDH активируются Ca²⁺ без фосфорилирования: связывание иона повышает их сродство к субстратам. Половина максимальной активации OGDH достигается при [Ca²⁺] около 1 мкМ, IDH3 — при более высокой концентрации.</li><li>Образуется больше NADH, дыхательная цепь получает больше электронов, и при доступных субстратах, O₂ и ADP синтез ATP может ускориться вслед за потребностью.</li></ol><p>Многие сигналы, повышающие [Ca²⁺] в цитозоле, одновременно увеличивают расход ATP: Ca²⁺ запускает сокращение мышечного волокна, секрецию, работу насосов. Ca²⁺, вошедший в матрикс, позволяет митохондриям ускорить образование NADH одновременно с ростом потребности, а не только после того, как ADP начнёт накапливаться.</p><p>Пируватдегидрогеназный комплекс (PDH) превращает пируват в ацетил-CoA и образует NADH. Его активность регулируется фосфорилированием: киназы PDK фосфорилируют субъединицу E1 и ингибируют комплекс, а фосфатазы PDP снимают фосфатные группы. Из двух фосфатаз чувствительна к Ca²⁺ только PDP1: Ca²⁺ способствует её связыванию с комплексом, и доля дефосфорилированного, активного PDH растёт (Denton 2009).</p><p>NAD-зависимая изоцитратдегидрогеназа цикла трикарбоновых кислот (IDH3) и оксоглутаратдегидрогеназный комплекс (OGDH) регулируются иначе. Ca²⁺ непосредственно связывается с ними и повышает их сродство к субстратам; фосфорилирование здесь не участвует. Чувствительность ферментов к Ca²⁺ разная: в митохондриях сердца крысы половина максимальной активации OGDH достигалась при [Ca²⁺] около 1 мкМ, а IDH3 — при 5–43 мкМ, причём в присутствии ATP требовалась в 3–10 раз более высокая концентрация, чем в присутствии ADP (Rutter 1988; Denton 2009). Ещё одна Ca²⁺-чувствительная дегидрогеназа, FAD-зависимая глицерол-3-фосфатдегидрогеназа, расположена на наружной поверхности внутренней мембраны и отвечает на цитозольный Ca²⁺.</p><p>Итог — больше NADH и больше электронов для дыхательной цепи. Ca²⁺ сам не синтезирует ATP: ускорение синтеза возможно, только если дыхательная цепь и ATP-синтаза работают, а субстраты, O₂ и ADP доступны. Регуляция этих дегидрогеназ ионами Ca²⁺ описана у позвоночных (Denton 2009).</p><div class="note trap"><strong>Типичная ошибка</strong> Ca²⁺ одинаково активирует все изоформы всех дегидрогеназ.<p class="trap-fix">Пируватдегидрогеназа активируется через Ca²⁺-чувствительную фосфатазу PDP1 (PDP2 к Ca²⁺ нечувствительна), IDH3 и OGDH — прямым связыванием Ca²⁺. NADP-зависимые изоцитратдегидрогеназы и большинство других ферментов матрикса к Ca²⁺ нечувствительны.</p></div><div class="static-quiz"><h3>В матриксе умеренно повысилась [Ca²⁺], активировалась PDP1; пируват доступен. Какое изменение пируватдегидрогеназного комплекса соответствует этому механизму?</h3><ol><li><b>А.</b> Дефосфорилирование комплекса способствует увеличению его активности. <i>(верный вариант)</i><br><span class="expl">PDP1 — фосфатаза. Она снимает ингибирующее фосфорилирование пируватдегидрогеназного комплекса.</span></li><li><b>Б.</b> PDP1 повышает активность комплекса без изменения его фосфорилирования. <i>(неверный вариант)</i><br><span class="expl">В рассматриваемом механизме PDP1 действует как фосфатаза. Активация связана со снятием ингибирующего фосфорилирования.</span></li><li><b>В.</b> PDP1 фосфорилирует комплекс и тем самым повышает его активность. <i>(неверный вариант)</i><br><span class="expl">Вариант меняет направление модификации: фосфатаза катализирует дефосфорилирование.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbabio.2009.01.005">Denton R. M. Regulation of mitochondrial dehydrogenases by calcium ions. Biochim Biophys Acta. 2009;1787:1309–1316. doi:10.1016/j.bbabio.2009.01.005</a></li><li><a href="https://doi.org/10.1042/bj2520181">Rutter G. A., Denton R. M. Regulation of NAD⁺-linked isocitrate dehydrogenase and 2-oxoglutarate dehydrogenase by Ca²⁺ ions within toluene-permeabilized rat heart mitochondria. Interactions with regulation by adenine nucleotides and NADH/NAD⁺ ratios. Biochem J. 1988;252:181–189.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00820-1">Cartes-Saavedra B., Ghosh A., Hajnóczky G. The roles of mitochondria in global and local intracellular calcium signalling. Nat Rev Mol Cell Biol. 2025;26:456–475.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма; изменения качественные. Позвоночные, сохранные ферменты, доступный пируват; кратковременный умеренный импульс Ca²⁺ в матриксе; субстраты, O₂ и ADP доступны. Утверждение о PDP относится к Ca²⁺-чувствительной изоформе PDP1. K½ активации ионами Ca²⁺: OGDH — около 1 мкМ, IDH3 — 5–43 мкМ в зависимости от отношения ATP/ADP (митохондрии сердца крысы, сделанные проницаемыми толуолом, — Rutter 1988; обзор, в том числе очищенные ферменты, — Denton 2009). В обзорах для IDH3 приводят 5–50 мкМ (как в справке практикума). K½ активации не равна константе диссоциации Ca²⁺.</p></details></article><article class="card print-unit" id="ns-calcium-extrusion"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 18 из 30</div><h2>Как NCLX участвует в восстановлении матричного Ca²⁺</h2><p class="lead">После импульса Ca²⁺ выводится из матрикса прежде всего Na⁺-зависимым путём, который классически связывают с обменником <a href="#ns-g-S9-T46">NCLX</a>. Вход через MCU быстрый, выход — медленнее, поэтому матричный сигнал продолжается дольше цитозольного. Большая часть вошедшего Ca²⁺ связывается буферами матрикса, поэтому <a href="#ns-g-S9-T49">свободная концентрация Ca²⁺</a> и его общая концентрация — разные величины.</p><ol class="mech"><li>При Na⁺-зависимом выходе Ca²⁺ покидает матрикс в обмен на Na⁺, который входит в матрикс; энергию даёт градиент Na⁺, поддерживаемый за счёт протондвижущей силы. В учебной модели этот путь назван NCLX; какой белок переносит ионы, в работах 2025–2026 гг. обсуждается.</li><li>Матричные буферы — прежде всего фосфат — связывают большую часть вошедшего Ca²⁺; свободная [Ca²⁺] поэтому много меньше общей концентрации Ca²⁺ в матриксе.</li><li>Когда вход прекращается, свободная [Ca²⁺] снижается со скоростью выхода; если этот выход ослаблен, спад замедляется.</li></ol><p>Прекращение входа через MCU не удаляет из матрикса уже вошедший Ca²⁺. В митохондриях сердца и мозга его выводит в основном Na⁺-зависимый путь внутренней мембраны: Ca²⁺ выходит, а Na⁺ входит в матрикс. С 2010 г. этот обмен связывают с белком NCLX: при снижении его содержания в клетках Na⁺-зависимый выход Ca²⁺ уменьшался (Palty 2010). Градиент Na⁺ поддерживают Na⁺/H⁺-обменники, использующие градиент H⁺, поэтому выход Ca²⁺ в конечном счёте тоже зависит от протондвижущей силы. Описаны и другие пути выхода, например обменник TMBIM5, работающий без Na⁺ (Cartes-Saavedra 2025).</p><p>Скорость Na⁺-зависимого выхода меньше максимальной скорости входа через MCU. Поэтому при коротком импульсе Ca²⁺ в матриксе повышается быстро, а снижается медленнее: матричный сигнал продолжается дольше цитозольного. Если этот выход подавлен генетически или фармакологически, спад замедляется ещё больше. Для такого эксперимента применяют ингибитор CGP-37157, но он действует и на другие системы переноса Ca²⁺, а по новым данным связывается с белком TMEM65 (Zhang 2025). Поэтому ответ на CGP-37157 согласуется с участием CGP-чувствительного выхода Ca²⁺, но сам по себе не доказывает ни этого, ни роли именно NCLX.</p><p>Работы 2025–2026 гг. сделали молекулярную основу этого пути предметом спора. В нескольких линиях клеток человека без NCLX Na⁺-зависимый выход Ca²⁺, подавляемый CGP-37157, сохранялся (Fan 2025). О том, на какие ионы обменивает Ca²⁺ сам NCLX, данные расходятся: по одним экспериментам — на H⁺ (Fan 2025: ооциты шпорцевой лягушки и митохондрии клеток HeLa), по другим — на разные одновалентные катионы, в том числе Na⁺ (Zhang 2026: белок на плазматической мембране клеток HEK). Белок внутренней мембраны TMEM65 одни авторы считают необходимым регулятором NCLX (Garbincius 2025), другие — самостоятельным Na⁺/Ca²⁺-обменником (Zhang 2025; Vetralla 2026). Поэтому в этом семинаре «выход через NCLX» означает Na⁺-зависимый выход Ca²⁺ в классической интерпретации, а не окончательно установленный белок-переносчик; точная стехиометрия обмена тоже обсуждается.</p><p>В матриксе большая часть вошедшего Ca²⁺ связывается буферами, прежде всего фосфатом, а также ATP и другими анионами. Свободная [Ca²⁺] в матриксе в покое составляет порядка 0,1–0,2 мкМ. Общая концентрация, включающая свободный и связанный Ca²⁺ в расчёте на тот же объём матрикса, после сильной нагрузки может во много раз превышать свободную. Индикатор Ca²⁺ регистрирует свободные ионы, поэтому одинаковый сигнал индикатора не означает одинакового общего количества Ca²⁺ в матриксе.</p><div class="note trap"><strong>Типичная ошибка</strong> После закрытия MCU выход Ca²⁺ больше не нужен.<p class="trap-fix">Закрытие MCU прекращает вход, но не удаляет уже вошедший Ca²⁺. Чтобы свободная [Ca²⁺] вернулась к исходной, ион должен выйти из матрикса, прежде всего Na⁺-зависимым путём; связанный буферами Ca²⁺ высвобождается и выводится постепенно.</p></div><div class="static-quiz"><h3>После одинакового импульса вход Ca²⁺ прекратился; NCLX исходно выводит Ca²⁺ из матрикса. При сохранных Δψm, Na⁺-градиенте и буферировании активность NCLX снизили. Как может измениться спад свободной [Ca²⁺] в матриксе?</h3><ol><li><b>А.</b> Спад может замедлиться из-за уменьшения одного из путей выхода Ca²⁺. <i>(верный вариант)</i><br><span class="expl">При заданных сопоставимых условиях уменьшение выхода через NCLX способствует более длительному сохранению матричного сигнала. Конкретная кинетика зависит и от других путей и буферирования.</span></li><li><b>Б.</b> Спад ускорится, поскольку NCLX в этих условиях переносит Ca²⁺ только внутрь. <i>(неверный вариант)</i><br><span class="expl">Здесь рассматривается обычное направление Na⁺-зависимого выхода Ca²⁺. Обратное направление требует иных условий.</span></li><li><b>В.</b> Сигнал сразу станет нулевым, поскольку закрытие MCU удаляет весь Ca²⁺. <i>(неверный вариант)</i><br><span class="expl">Прекращение входа не удаляет уже накопленный Ca²⁺; нужны выход и взаимодействие с буферами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li><li><a href="https://doi.org/10.1073/pnas.0908099107">Palty R., Silverman W. F., Hershfinkel M., Caporale T., Sensi S. L., Parnis J., Nolte C., Fishman D., Shoshan-Barmatz V., Herrmann S., Khananshvili D., Sekler I. NCLX is an essential component of mitochondrial Na⁺/Ca²⁺ exchange. Proc Natl Acad Sci USA. 2010;107:436–441.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00820-1">Cartes-Saavedra B., Ghosh A., Hajnóczky G. The roles of mitochondria in global and local intracellular calcium signalling. Nat Rev Mol Cell Biol. 2025;26:456–475.</a></li><li><a href="https://doi.org/10.1038/s41586-025-09491-0">Fan M., Tsai C.-W., Zhang J., Zhang J., Krishnan A. R., Liu T.-Y., Huang Y.-L., Aydin D., Du S., Sobecks B. L., Rodriguez M. X., Reiter A. H., Bertozzi C. R., Dror R. O., Tsai M.-F., Feng L. Structure and mechanism of the mitochondrial calcium transporter NCLX. Nature. 2025;646:1272–1280.</a></li><li><a href="https://doi.org/10.1038/s42255-025-01250-9">Garbincius J. F., Salik O., Cohen H. M., Choya-Foces C., Mangold A. S., Makhoul A. D., Schmidt A. E., Khalil D. Y., Doolittle J. J., Wilkinson A. S., Murray E. K., Lazaropoulos M. P., Hildebrand A. N., Tomar D., Elrod J. W. TMEM65 regulates and is required for NCLX-dependent mitochondrial calcium efflux. Nat Metab. 2025;7:714–729.</a></li><li><a href="https://doi.org/10.1038/s41556-025-01721-x">Zhang J. L., Chang Y.-C., Lai P.-H., Yeh H.-I., Tsai C.-W., Huang Y.-L., Liu T.-Y., Lee I.-C., Foulon N., Xu Y., Rao B., Shih H.-M., Tu Y.-C., Reyes A. V., Xu S.-L., Feng L., Tsai M.-F. TMEM65 functions as the mitochondrial Na⁺/Ca²⁺ exchanger. Nat Cell Biol. 2025;27:1301–1310.</a></li><li><a href="https://doi.org/10.1038/s41467-025-67647-y">Vetralla M., Wischhof L., Kahsay A., Cadenelli V., Scifo E., Xie B., Sbrissa M., Habert M. S., Ehninger D., Rizzuto R., Bano D., De Stefani D. TMEM65-dependent Ca²⁺ extrusion safeguards mitochondrial homeostasis. Nat Commun. 2026;17:923 (опубликовано онлайн 17.12.2025).</a></li><li><a href="https://doi.org/10.1038/s41467-026-75483-x">Zhang L., Han Y., Zeng W., Xue J., Wang Y., Jiang Y. Molecular mechanisms of mitochondrial Ca²⁺ exchanger NCLX. Nat Commun. 2026;17.</a></li></ul><p>Учебная модель: кривые рассчитаны по условным параметрам (одинаковый импульс входа, постоянная доля связанного Ca²⁺, насыщаемый выход); это не данные эксперимента. Сохранены Δψm и градиент Na⁺, вход и буферирование сопоставимы; объём матрикса постоянен, поэтому свободная и общая концентрации отнесены к одному объёму. Выход в модели — Na⁺-зависимый путь, классически приписываемый NCLX (Palty 2010). Сохранение этого выхода в линиях клеток без NCLX и обмен Ca²⁺ на H⁺ через NCLX — Fan 2025 (клетки HeLa, HEK293, HCT116; ооциты шпорцевой лягушки, где часть белка находилась на плазматической мембране); TMEM65 как необходимый регулятор NCLX — Garbincius 2025 (клетки и мыши); TMEM65 как Na⁺/Ca²⁺-обменник — Zhang 2025 (в том числе белок в липосомах) и Vetralla 2026; широкая катионная избирательность NCLX — белок на плазматической мембране клеток HEK (Zhang 2026), что ограничивает перенос вывода на митохондрии. Другие пути и буферирование фосфатом — Cartes-Saavedra 2025; обзор — Lim 2021.</p></details></article><article class="card print-unit" id="ns-calcium-overload"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 19 из 30</div><h2>Когда кальциевый сигнал становится перегрузкой</h2><p class="lead">Краткий импульс Ca²⁺ ускоряет образование NADH и затем выводится. Длительное или чрезмерное поступление Ca²⁺ ведёт к его накоплению в матриксе — <a href="#ns-g-S9-T50">кальциевой перегрузке</a>. Общее количество Ca²⁺ в матриксе растёт, когда вход превышает выход; буферы ограничивают рост свободной концентрации, но не выводят Ca²⁺ из матрикса. Чрезмерное накопление повышает вероятность перехода проницаемости внутренней мембраны, но единого порога гибели нет.</p><ol class="mech"><li>При длительном входе общее количество Ca²⁺ в матриксе растёт, потому что Na⁺-зависимый выход медленнее входа через MCU.</li><li>Накопленный Ca²⁺ вместе с фосфатом и окислительным стрессом способствует переходу проницаемости внутренней мембраны; этому противодействуют сохранный потенциал и восстановленное состояние матрикса.</li><li>Вход каждого Ca²⁺ расходует электрическую составляющую градиента; при перегрузке митохондрия хуже поддерживает Δψm и синтез ATP.</li></ol><p>Последствия одного и того же иона зависят от дозы и длительности. Краткий умеренный импульс повышает свободную [Ca²⁺] в матриксе до микромолярного диапазона, активирует дегидрогеназы и затем выводится из матрикса. При длительном или очень сильном поступлении — например, при постоянном высвобождении Ca²⁺ из ЭПР или при избыточном входе Ca²⁺ в клетку — вход надолго превышает выход, и общее количество Ca²⁺ в матриксе растёт.</p><p>Накопленный Ca²⁺ сам по себе не ускоряет синтез ATP. Напротив, каждый входящий ион вносит в матрикс положительные заряды: вход Ca²⁺ расходует электрическую составляющую градиента, и меньшая её часть остаётся для синтеза ATP. При значительном накоплении Ca²⁺ вместе с фосфатом и окислительным стрессом повышается вероятность митохондриального перехода проницаемости — резкого увеличения проницаемости внутренней мембраны (следующий шаг).</p><p>Где проходит граница между сигналом и перегрузкой, зависит от многих условий: скорости выхода, буферной ёмкости матрикса, содержания фосфата, окислительно-восстановительного состояния и способности митохондрии поддерживать мембранные градиенты. Поэтому универсальной концентрации Ca²⁺, после которой митохондрия обязательно повреждается, нет; на схеме риск показан качественно.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем выше матричный Ca²⁺, тем больше синтез ATP при любых условиях.<p class="trap-fix">Ca²⁺ ускоряет образование NADH в определённом диапазоне концентраций и при работающей цепи. Чрезмерное накопление расходует мембранный потенциал на вход ионов и повышает вероятность перехода проницаемости, что нарушает синтез ATP.</p></div><div class="static-quiz"><h3>Почему краткий импульс матричного Ca²⁺ и длительное накопление Ca²⁺ могут иметь разные последствия?</h3><ol><li><b>А.</b> Ca²⁺ при любой длительности действует только как субстрат синтеза ATP. <i>(неверный вариант)</i><br><span class="expl">Ca²⁺ — регулятор и переносимый ион, а не субстрат образования ATP; его действие ограничено состоянием системы.</span></li><li><b>Б.</b> Любой краткий импульс обязательно разрушает внутреннюю мембрану. <i>(неверный вариант)</i><br><span class="expl">Краткие физиологические сигналы не равнозначны обязательному повреждению. Важны интенсивность, длительность и условия.</span></li><li><b>В.</b> При длительном накоплении повышается риск нарушения мембранных градиентов и функции. <i>(верный вариант)</i><br><span class="expl">Умеренный сигнал способен поддерживать метаболическую регуляцию, тогда как перегрузка зависит от баланса входа, выхода, буферирования и состояния митохондрии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li><li><a href="https://doi.org/10.1016/j.bbabio.2009.01.005">Denton R. M. Regulation of mitochondrial dehydrogenases by calcium ions. Biochim Biophys Acta. 2009;1787:1309–1316. doi:10.1016/j.bbabio.2009.01.005</a></li><li><a href="https://doi.org/10.1038/s41418-023-01187-0">Bernardi P. et al. Identity, structure, and function of the mitochondrial permeability transition pore: controversies, consensus, recent advances, and future directions. Cell Death Differ. 2023;30:1869–1885. doi:10.1038/s41418-023-01187-0</a></li></ul><p>Учебная модель: свободный Ca²⁺ и риск перехода проницаемости рассчитаны по условным параметрам и показаны качественно; это не предсказание жизнеспособности ткани. Зависимость перехода проницаемости от Ca²⁺, фосфата и окислительного стресса — Bernardi 2023; регуляция дегидрогеназ в микромолярном диапазоне — Denton 2009; баланс входа, выхода и буферирования — Lim 2021.</p></details></article><article class="card print-unit" id="ns-permeability-apoptosis"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 20 из 30</div><h2>Чем переход проницаемости отличается от MOMP</h2><p class="lead"><a href="#ns-g-S9-T51">Митохондриальный переход проницаемости (mPT)</a> — резкое увеличение проницаемости внутренней мембраны для небольших молекул. <a href="#ns-g-S9-T52">MOMP</a> — пермеабилизация наружной мембраны белками BAX и BAK. Это разные события в разных мембранах; они могут быть связаны, но ни одно не следует из другого обязательно.</p><ol class="mech"><li>При перегрузке Ca²⁺ вместе с фосфатом и окислительным стрессом во внутренней мембране открывается неспецифическая пора; циклофилин D облегчает её открывание.</li><li>Через пору выравниваются концентрации малых веществ, потенциал падает, матрикс набухает; растяжение может вторично повредить наружную мембрану.</li><li>При MOMP белки BAX и BAK образуют проницаемые структуры в наружной мембране; цитохром c выходит в цитозоль и запускает образование апоптосомы и активацию каспаз.</li></ol><p>Митохондриальный переход проницаемости — это внезапное увеличение проницаемости внутренней мембраны для растворённых веществ массой примерно до 1,5 кДа. Его вызывает накопление Ca²⁺ в матриксе, особенно вместе с высоким содержанием фосфата и окислительным стрессом. Белок матрикса циклофилин D облегчает открывание поры, а его ингибитор циклоспорин A повышает необходимую для открывания нагрузку Ca²⁺. Молекулярный состав поры обсуждается: рассматривают участие ATP-синтазы и переносчика ANT, а VDAC, когда-то считавшийся обязательным компонентом, для перехода проницаемости не нужен (Baines 2007; Bernardi 2023).</p><p>Когда пора открыта, потенциал на внутренней мембране исчезает, синтез ATP прекращается, а вода входит в матрикс вслед за осмотически активными веществами. Матрикс набухает; при этом наружная мембрана может разорваться, и белки межмембранного пространства выходят в цитозоль. Клетки мышей без циклофилина D были устойчивы к некоторым формам некротической гибели, а на апоптотические стимулы отвечали обычно (Nakagawa 2005).</p><p>MOMP — другой механизм. При внутреннем пути апоптоза белки BAX и BAK олигомеризуются в наружной мембране и делают её проницаемой для белков межмембранного пространства. Цитохром c выходит в цитозоль, связывается с белком APAF1, образуется апоптосома, и активируются каспазы. Внутренняя мембрана при этом может долго оставаться непроницаемой.</p><p>Выход цитохрома c в цитозоль сам по себе не показывает, какой механизм сработал: он возможен и при MOMP, и при разрыве наружной мембраны после набухания. Поэтому mPT и MOMP нельзя считать двумя названиями одной поры или обязательными звеньями одной цепи.</p><div class="note trap"><strong>Типичная ошибка</strong> mPTP и MOMP — разные названия одной поры.<p class="trap-fix">Переход проницаемости затрагивает внутреннюю мембрану и связан с Ca²⁺, фосфатом, окислительным стрессом и циклофилином D. MOMP затрагивает наружную мембрану и осуществляется белками BAX и BAK. Механизмы могут взаимодействовать, но это разные события.</p></div><div class="static-quiz"><h3>В одном случае возникает неселективная проницаемость внутренней мембраны для малых растворённых веществ с набуханием матрикса. В другом цитохром c выходит через BAX/BAK-зависимые структуры наружной мембраны. Как соотносятся эти события?</h3><ol><li><b>А.</b> Это переход проницаемости в обоих случаях: выход цитохрома c требует набухания. <i>(неверный вариант)</i><br><span class="expl">BAX/BAK-зависимая MOMP может происходить без набухания матрикса, связанного с переходом проницаемости внутренней мембраны.</span></li><li><b>Б.</b> Это MOMP в обоих случаях: изменение проницаемости относится к наружной мембране. <i>(неверный вариант)</i><br><span class="expl">Первый случай прямо относится к внутренней мембране и неспецифическому переходу проницаемости. MOMP обозначает проницаемость наружной мембраны.</span></li><li><b>В.</b> Это переход проницаемости внутренней мембраны и MOMP соответственно. <i>(верный вариант)</i><br><span class="expl">Митохондриальный переход проницаемости и MOMP могут взаимодействовать, но различаются по затронутой мембране и механизму.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41418-023-01187-0">Bernardi P. et al. Identity, structure, and function of the mitochondrial permeability transition pore: controversies, consensus, recent advances, and future directions. Cell Death Differ. 2023;30:1869–1885. doi:10.1038/s41418-023-01187-0</a></li><li><a href="https://doi.org/10.1038/ncb1575">Baines C. P., Kaiser R. A., Sheiko T., Craigen W. J., Molkentin J. D. Voltage-dependent anion channels are dispensable for mitochondrial-dependent cell death. Nat Cell Biol. 2007;9:550–555.</a></li><li><a href="https://doi.org/10.1038/nature03317">Nakagawa T. et al. Cyclophilin D-dependent mitochondrial permeability transition regulates some necrotic but not apoptotic cell death. Nature. 2005;434:652–658. doi:10.1038/nature03317</a></li><li><a href="https://doi.org/10.1038/s41580-019-0173-8">Bock F. J., Tait S. W. G. Mitochondria as multifaceted regulators of cell death. Nat Rev Mol Cell Biol. 2020;21:85–100.</a></li></ul><p>Схема механизма; события показаны качественно, без обязательной последовательности. Состав поры и роль ATP-синтазы и ANT — предмет исследований (Bernardi 2023); необязательность VDAC — митохондрии мышей без VDAC1, VDAC3 или обоих и фибробласты без всех трёх изоформ VDAC (Baines 2007); роль циклофилина D в некрозе, но не в апоптозе — мыши без циклофилина D (Nakagawa 2005); MOMP и апоптосома — Bock 2020.</p></details></article><article class="card print-unit" id="ns-calcium-measurement"><div class="eyebrow">Ca²⁺ и контакты с ЭПР · шаг 21 из 30</div><h2>Как сопоставляют локальный Ca²⁺, матричный сигнал и контакт мембран</h2><p class="lead">Контакт ЭПР и митохондрии, концентрацию Ca²⁺ и ток через MCU измеряют разными методами, и каждый метод даёт свою величину. Геометрия контакта не измеряет перенос иона: для вывода о переносе Ca²⁺ нужен функциональный сигнал в нужных компартментах.</p><ol class="mech"><li>Генетически кодируемые индикаторы с сигналом адресации регистрируют свободную [Ca²⁺] в цитозоле, на поверхности митохондрий или в матриксе; нужны контроли pH и правильной локализации.</li><li>Расстояние между мембранами измеряют электронной микроскопией, сверхразрешающей микроскопией или сенсорами сближения; обычный световой микроскоп нанометровый зазор не разрешает.</li><li>Ток через унипортер регистрируют методом пэтч-кламп на митопластах — митохондриях без наружной мембраны.</li></ol><p>Свободную [Ca²⁺] в определённом компартменте измеряют генетически кодируемыми индикаторами: экворином, GCaMP и их вариантами. К белку-индикатору присоединяют сигнал адресации, например N-концевую последовательность белка матрикса, и индикатор накапливается в матриксе. Затем регистрируют изменение флуоресценции или люминесценции во времени после стимула. Необходимы контроли: проверка локализации индикатора, его чувствительности к pH (у некоторых флуоресцентных индикаторов сигнал меняется при сдвиге pH), а также запись цитозольного сигнала в тех же условиях.</p><p>Геометрию контакта оценивают по-другому. Электронная микроскопия и электронная томография показывают расстояние между мембранами ЭПР и митохондрии с нанометровым разрешением, но на фиксированных препаратах. Сверхразрешающая световая микроскопия разрешает объекты мельче предела обычного микроскопа и позволяет работать с более сохранными образцами. Сенсоры сближения — пары флуоресцентных белков для FRET или фрагменты, восстанавливающие сигнал только при близком расположении, — выявляют сближение мембран в живых клетках. Совпадение окрасок ЭПР и митохондрий в обычном световом микроскопе не разрешает зазор в десятки нанометров.</p><p>Ток через унипортер прямо измерили на митопластах — митохондриях, у которых наружная мембрана удалена осмотическим разрывом. Электрод присасывают к внутренней мембране и регистрируют ток Ca²⁺ при заданном потенциале (Kirichok 2004).</p><p>Каждый метод отвечает на свой вопрос. Увеличение площади контакта не доказывает усиления переноса Ca²⁺, а содержание MCU — его проводимости. Для такого вывода нужно сравнить динамику Ca²⁺ в соответствующих компартментах при сопоставимом исходном высвобождении Ca²⁺ из ЭПР и Δψm.</p><div class="note trap"><strong>Типичная ошибка</strong> Более тесный контакт мембран сам по себе доказывает увеличение потока Ca²⁺.<p class="trap-fix">Расстояние между мембранами — структурный показатель. Поток Ca²⁺ зависит также от высвобождения из ЭПР, состояния MCU и Δψm, поэтому его измеряют отдельно — по динамике свободного Ca²⁺ в цитозоле и в матриксе.</p></div><div class="static-quiz"><h3>На изображениях увеличилась площадь сближения ЭПР и митохондрий. Какое дополнительное наблюдение нужно для вывода об изменении переноса Ca²⁺?</h3><ol><li><b>А.</b> Только повторное измерение площади того же контакта при другом увеличении. <i>(неверный вариант)</i><br><span class="expl">Повторная оценка геометрии повышает надёжность описания контакта, но не заменяет измерение Ca²⁺.</span></li><li><b>Б.</b> Динамика Ca²⁺ в соответствующих компартментах при сопоставимых исходных условиях. <i>(верный вариант)</i><br><span class="expl">Геометрия контакта не измеряет перенос иона. Нужны функциональный сигнал, правильная адресация индикаторов и учёт Δψm и исходного высвобождения Ca²⁺.</span></li><li><b>В.</b> Только увеличение содержания MCU в тех же клетках. <i>(неверный вариант)</i><br><span class="expl">Содержание канала не измеряет его текущую проводимость или перенос Ca²⁺. Нужна динамика иона при сопоставимых условиях.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-9.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li><li><a href="https://doi.org/10.1038/nature02246">Kirichok Y., Krapivinsky G., Clapham D. E. The mitochondrial calcium uniporter is a highly selective ion channel. Nature. 2004;427:360–364. doi:10.1038/nature02246</a></li><li><a href="https://doi.org/10.1126/science.280.5370.1763">Rizzuto R., Pinton P., Carrington W., Fay F. S., Fogarty K. E., Lifshitz L. M., Tuft R. A., Pozzan T. Close contacts with the endoplasmic reticulum as determinants of mitochondrial Ca²⁺ responses. Science. 1998;280:1763–1766.</a></li><li><a href="https://doi.org/10.1083/jcb.200604016">Csordás G., Renken C., Várnai P., Walter L., Weaver D., Buttle K. F., Balla T., Mannella C. A., Hajnóczky G. Structural and functional features and significance of the physical linkage between ER and mitochondria. J Cell Biol. 2006;174:915–921.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00820-1">Cartes-Saavedra B., Ghosh A., Hajnóczky G. The roles of mitochondria in global and local intracellular calcium signalling. Nat Rev Mol Cell Biol. 2025;26:456–475.</a></li></ul><p>Принципиальные схемы методов, не данные экспериментов. Ток унипортера в митопластах — клетки COS-7 (Kirichok 2004); близость ЭПР и накопление Ca²⁺ — адресованный экворин и микроскопия в клетках HeLa (Rizzuto 1998); электронная томография и искусственные связки ЭПР с митохондриями — Csordás 2006; обзор методов и ограничений — Lim 2021, Cartes-Saavedra 2025. Не следует объединять разные препараты, виды и методики в один якобы проведённый эксперимент.</p></details></article><article class="card print-unit" id="ns-dual-genome"><div class="eyebrow">Два генома и гетероплазмия · шаг 22 из 30</div><h2>Почему дыхательный аппарат зависит от двух геномов</h2><p class="lead">Дыхательный аппарат человека собирается из продуктов двух геномов. <a href="#ns-g-S9-T54">Митохондриальная ДНК</a> кодирует 13 белков, 22 тРНК и 2 рРНК, а все остальные митохондриальные белки — более тысячи — кодирует ядро. Комплекс II целиком кодируется ядром; белки мтДНК входят в состав комплексов I, III, IV и ATP-синтазы. Это и есть <a href="#ns-g-S9-T53">двойной генетический контроль</a>.</p><ol class="mech"><li>мтДНК человека — кольцевая молекула длиной около 16,6 тыс. пар нуклеотидов; её 13 белков — гидрофобные субъединицы комплексов I, III, IV и V, синтезируемые на миторибосомах в матриксе.</li><li>22 тРНК и 2 рРНК мтДНК нужны для митохондриальной трансляции; все белки самой системы трансляции, репликации и транскрипции кодирует ядро.</li><li>Субъединицы, кодируемые ядром, синтезируются в цитозоле, импортируются и собираются вместе с митохондриальными субъединицами при участии ядерно кодируемых факторов сборки.</li></ol><p>Последовательность мтДНК человека определили в 1981 г. (Anderson 1981). Это кольцевая молекула длиной около 16,6 тыс. пар нуклеотидов, содержащая 37 генов: 13 кодируют белки, 22 — тРНК и 2 — рРНК. Все 13 белков — субъединицы дыхательных комплексов: семь субъединиц комплекса I (ND1–ND6 и ND4L), цитохром b комплекса III, три субъединицы цитохромоксидазы (COX1–COX3) и две субъединицы ATP-синтазы (ATP6 и ATP8). тРНК и рРНК мтДНК используются только для синтеза этих 13 белков на миторибосомах.</p><p>Все остальные белки митохондрии кодирует ядро — по обзору Russell 2020, более 1200. Среди них большинство субъединиц дыхательных комплексов, все четыре субъединицы комплекса II, белки миторибосом, ферменты репликации и транскрипции мтДНК и факторы сборки комплексов. Ядерно кодируемые белки синтезируются в цитозоле и импортируются, а митохондриально кодируемые синтезируются в матриксе. Комплексы I, III, IV и V собираются только тогда, когда доступны субъединицы обоих происхождений.</p><p>Поэтому дефект дыхательной цепи может быть вызван патогенным вариантом в любом из двух геномов. Варианты ядерных генов наследуются по законам Менделя; аутосомный ген представлен в клетке двумя копиями, и вариант может находиться в одной из них или в обеих — проявление зависит от гена и самого варианта. мтДНК человека наследуется по материнской линии, а её вариант может присутствовать лишь в части многочисленных молекул мтДНК клетки.</p><p>Происхождение двух геномов объясняет эндосимбиотическая теория: митохондрии произошли от бактерий, и большая часть их генов в ходе эволюции перешла в ядро. Почему небольшая часть генов осталась в органелле, обсуждается; одна из гипотез связывает это с возможностью регулировать синтез ключевых гидрофобных субъединиц прямо на месте сборки.</p><div class="note trap"><strong>Типичная ошибка</strong> Все белки дыхательной цепи кодируются мтДНК.<p class="trap-fix">мтДНК кодирует только 13 белков. Большинство субъединиц дыхательных комплексов, все субъединицы комплекса II и все белки, обеспечивающие репликацию и экспрессию самой мтДНК, кодирует ядро.</p></div><div class="static-quiz"><h3>Какое утверждение о генетическом контроле комплексов окислительного фосфорилирования человека верно?</h3><ol><li><b>А.</b> Все субъединицы комплексов I–V кодируются митохондриальной ДНК. <i>(неверный вариант)</i><br><span class="expl">Большинство митохондриальных белков, включая многие субъединицы и факторы сборки, кодируется ядерными генами.</span></li><li><b>Б.</b> Все субъединицы комплекса II кодируются ядерными генами; часть субъединиц комплексов I, III, IV и V — мтДНК. <i>(верный вариант)</i><br><span class="expl">У человека 13 белков, кодируемых мтДНК, входят в состав комплексов I, III, IV и V. Все субъединицы комплекса II кодируются ядерными генами.</span></li><li><b>В.</b> Все субъединицы комплекса II кодируются мтДНК, а субъединицы комплексов I, III, IV и V — ядерными генами. <i>(неверный вариант)</i><br><span class="expl">Здесь обращено распределение: все субъединицы II кодируются ядерными генами, а у остальных перечисленных комплексов есть вклад мтДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1038/290457a0">Anderson S., Bankier A. T., Barrell B. G., de Bruijn M. H., Coulson A. R., Drouin J., Eperon I. C., Nierlich D. P., Roe B. A., Sanger F., Schreier P. H., Smith A. J., Staden R., Young I. G. Sequence and organization of the human mitochondrial genome. Nature. 1981;290:457–465.</a></li><li><a href="https://doi.org/10.1042/EBC20170098">Signes A., Fernandez-Vizarra E. Assembly of mammalian oxidative phosphorylation complexes I–V and supercomplexes. Essays Biochem. 2018;62:255–270.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li></ul><p>Схема механизма. Числа 37/13/22/2 относятся к мтДНК человека (Anderson 1981), а не ко всем эукариотам. Число субъединиц в комплексах — принятый подсчёт для комплексов млекопитающих (Signes 2018; совпадает с практикумом); подсчёт зависит от того, учитывают ли дополнительные субъединицы и изоформы. Число ядерно кодируемых митохондриальных белков — Russell 2020.</p></details></article><article class="card print-unit" id="ns-expression-assembly"><div class="eyebrow">Два генома и гетероплазмия · шаг 23 из 30</div><h2>Как экспрессия мтДНК связана со сборкой комплексов</h2><p class="lead">Экспрессия мтДНК проходит несколько этапов: транскрипцию, процессинг РНК, трансляцию на миторибосомах, встраивание белка в мембрану и сборку комплекса с ядерно кодируемыми субъединицами. Нарушение любого этапа может помешать образованию комплекса, поэтому наличие мРНК ещё не означает, что комплекс собран.</p><ol class="mech"><li>РНК-полимераза POLRMT вместе с TFAM и TFB2M транскрибирует мтДНК с образованием длинных полицистронных предшественников РНК.</li><li>Нуклеазы вырезают из предшественника тРНК, расположенные между генами мРНК и рРНК, и высвобождают отдельные РНК; мРНК стабилизируются белками, в частности LRPPRC.</li><li>Миторибосома, связанная с внутренней мембраной, синтезирует белок, OXA1L встраивает его в мембрану, и он собирается в комплекс с импортированными субъединицами.</li></ol><p>Транскрипцию мтДНК осуществляет митохондриальная РНК-полимераза POLRMT, кодируемая ядром. Для начала транскрипции с промоторов мтДНК в очищенной системе достаточно двух факторов — TFAM и TFB2M (Litonin 2010). Транскрипция идёт на большие расстояния, и образуются длинные полицистронные предшественники, содержащие сразу много генов. Белок <a href="#ns-g-S9-T75">MTERF1</a>, связывающийся с мтДНК сразу за генами рРНК, долго считали регулятором соотношения рРНК и мРНК. У мышей без MTERF1 содержание рРНК не изменилось, но снизилась транскрипция с промотора лёгкой цепи; на этом основании авторы заключили, что MTERF1 останавливает транскрипцию противоположной цепи мтДНК и не даёт ей мешать началу транскрипции с промотора лёгкой цепи (Terzioglu 2013).</p><p>В мтДНК гены тРНК расположены между генами мРНК и рРНК. Нуклеазы узнают тРНК в составе предшественника и вырезают их: по 5′-концу тРНК предшественник разрезает митохондриальная <a href="#ns-g-S9-T74">RNase P</a> — у человека это белковый комплекс из трёх субъединиц (MRPP1–3), в отличие от рибонуклеопротеиновой RNase P бактерий и ядра (Holzmann 2008), а по 3′-концу — другая эндонуклеаза. При этом освобождаются и отдельные мРНК и рРНК. Такую схему назвали моделью тРНК-пунктуации (Ojala 1981). Дальше РНК созревают: к тРНК присоединяется CCA-конец, мРНК полиаденилируются и стабилизируются белками, например LRPPRC. Эти белки участвуют в определённых этапах, а не управляют всей экспрессией.</p><p>Миторибосомы синтезируют 13 белков, используя 22 тРНК и 2 рРНК мтДНК. Миторибосома связана с внутренней мембраной, и новосинтезированный гидрофобный белок сразу встраивается в мембрану инсертазой OXA1L (Itoh 2021). Для трансляции отдельных мРНК нужны свои активаторы: например, TACO1 необходим для эффективного синтеза COX1 (Weraarpachai 2009).</p><p>Наконец, белки мтДНК собираются в комплексы вместе с импортированными ядерно кодируемыми субъединицами при участии факторов сборки. Транскрипт, белок и собранный комплекс — разные уровни: при сохранной мРНК, но нарушенной трансляции субъединица не синтезируется, и комплекс не собирается. Несобранные и повреждённые белки удаляют <a href="#ns-g-S9-T76">протеазы митохондрий</a>: LONP1 — в матриксе, AAA-протеазы внутренней мембраны — YME1L1 с активным центром в межмембранном пространстве и m-AAA-протеаза с активным центром в матриксе; OMA1 активируется при стрессе, например при потере мембранного потенциала, и расщепляет белок слияния OPA1 (Deshwal 2020).</p><div class="note trap"><strong>Типичная ошибка</strong> Наличие мРНК субъединицы означает, что соответствующий комплекс уже собран.<p class="trap-fix">Между мРНК и собранным комплексом есть трансляция, встраивание в мембрану и сборка с ядерно кодируемыми субъединицами. Если нарушен любой из этих этапов, мРНК есть, а комплекса нет.</p></div><div class="static-quiz"><h3>В клетке сохранена мРНК митохондриальной субъединицы, но нарушена её трансляция. Что можно заключить о наличии собранного комплекса?</h3><ol><li><b>А.</b> Комплекс обязательно собран, поскольку его ядерные субъединицы продолжают синтезироваться. <i>(неверный вариант)</i><br><span class="expl">Продолжение синтеза субъединиц, кодируемых ядерными генами, не компенсирует нарушение синтеза субъединицы, кодируемой мтДНК. Для сборки необходимы оба компонента.</span></li><li><b>Б.</b> Комплекс обязательно собран, поскольку для сборки достаточно самой мРНК. <i>(неверный вариант)</i><br><span class="expl">мРНК служит матрицей для синтеза белка и не заменяет его в дыхательном комплексе.</span></li><li><b>В.</b> Сохранение мРНК само по себе не гарантирует синтез субъединицы и сборку. <i>(верный вариант)</i><br><span class="expl">Транскрипт, белок и собранный комплекс — разные уровни. Между ними необходимы трансляция, встраивание и сборка с другими субъединицами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1074/jbc.C110.128918">Litonin D. et al. Human mitochondrial transcription revisited: only TFAM and TFB2M are required for transcription of the mitochondrial genes in vitro. J Biol Chem. 2010;285:18129–18133. doi:10.1074/jbc.C110.128918</a></li><li><a href="https://doi.org/10.1038/290470a0">Ojala D., Montoya J., Attardi G. tRNA punctuation model of RNA processing in human mitochondria. Nature. 1981;290:470–474.</a></li><li><a href="https://doi.org/10.1126/science.abe0763">Itoh Y. et al. Mechanism of membrane-tethered mitochondrial protein synthesis. Science. 2021;371:846–849. doi:10.1126/science.abe0763</a></li><li><a href="https://doi.org/10.1038/ng.390">Weraarpachai W., Antonicka H., Sasarman F., Seeger J., Schrank B., Kolesar J. E., Lochmüller H., Chevrette M., Kaufman B. A., Horvath R., Shoubridge E. A. Mutation in TACO1, encoding a translational activator of COX I, results in cytochrome c oxidase deficiency and late-onset Leigh syndrome. Nat Genet. 2009;41:833–837.</a></li><li><a href="https://doi.org/10.1016/j.cell.2008.09.013">Holzmann J., Frank P., Löffler E., Bennett K. L., Gerner C., Rossmanith W. RNase P without RNA: identification and functional reconstitution of the human mitochondrial tRNA processing enzyme. Cell. 2008;135:462–474.</a></li><li><a href="https://doi.org/10.1016/j.cmet.2013.03.006">Terzioglu M., Ruzzenente B., Harmel J., Mourier A., Jemt E., López M. D., Kukat C., Stewart J. B., Wibom R., Meharg C., Habermann B., Falkenberg M., Gustafsson C. M., Park C. B., Larsson N.-G. MTERF1 binds mtDNA to prevent transcriptional interference at the light-strand promoter but is dispensable for rRNA gene transcription regulation. Cell Metab. 2013;17:618–626.</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-062917-012739">Deshwal S., Fiedler K. U., Langer T. Mitochondrial proteases: multifaceted regulators of mitochondrial plasticity. Annu Rev Biochem. 2020;89:501–528.</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li></ul><p>Схема механизма для митохондрий человека; скорости этапов и полный набор факторов созревания РНК не показаны. Минимальная система транскрипции POLRMT–TFAM–TFB2M — очищенные белки человека (Litonin 2010); модель тРНК-пунктуации — Ojala 1981; связь миторибосомы с OXA1L — структурные данные (Itoh 2021); RNase P — белки человека, реконструкция активности (Holzmann 2008); MTERF1 — мыши с удалённым геном (Terzioglu 2013); протеазы — обзор Deshwal 2020. Разные дефекты дают разную остаточную функцию.</p></details></article><article class="card print-unit" id="ns-biogenesis-maintenance"><div class="eyebrow">Два генома и гетероплазмия · шаг 24 из 30</div><h2>Как ядро регулирует биогенез и поддержание мтДНК</h2><p class="lead">Ядро не только кодирует большинство субъединиц, но и регулирует количество митохондриального аппарата и поддерживает саму мтДНК. Совокупность этих процессов называют <a href="#ns-g-S9-T68">митохондриальным биогенезом</a>. Коактиватор <a href="#ns-g-S9-T58">PGC-1α</a> усиливает экспрессию ядерных генов митохондриальных белков, а ядерно кодируемые <a href="#ns-g-S9-T56">TFAM</a> и белки репликации <a href="#ns-g-S9-T57">POLG, POLG2 и TWNK</a> поддерживают мтДНК.</p><ol class="mech"><li>PGC-1α сам не связывается с ДНК: он коактивирует транскрипционные факторы, прежде всего NRF1 и NRF-2 (GABP), которые активируют гены митохондриальных белков, в том числе TFAM.</li><li>TFAM упаковывает мтДНК в <a href="#ns-g-S9-T55">нуклеоиды</a> и участвует в её транскрипции; ДНК-полимераза γ (POLG и POLG2) и хеликаза TWNK реплицируют мтДНК.</li><li>Дефект ядерного гена поддержания мтДНК может уменьшить число копий мтДНК или привести к её делециям без какого-либо исходного варианта мтДНК.</li></ol><p>Количество митохондрий и их белков меняется при физической нагрузке, охлаждении, изменении питания. Одним из регуляторов этого служит PGC-1α — коактиватор транскрипции. Он не связывается с ДНК сам, а взаимодействует с транскрипционными факторами и усиливает их действие. В культуре мышечных клеток повышение содержания PGC-1 усиливало экспрессию NRF1 и NRF-2 и через них — экспрессию TFAM и митохондриальный биогенез (Wu 1999). PGC-1α — не единственный регулятор: в сеть входят и другие коактиваторы и факторы (Scarpulla 2011).</p><p>NRF-2 — второе название фактора GABP (Virbasius 1993). Его не следует путать с <a href="#ns-g-S9-T59">NRF2 (NFE2L2)</a> — фактором ответа на окислительный стресс, который регулирует антиоксидантные гены (Moi 1994). Названия похожи, а белки и функции разные.</p><p>TFAM кодируется ядром, импортируется в матрикс и упаковывает мтДНК в нуклеоиды; он же участвует в транскрипции мтДНК. Реплицируют мтДНК ядерно кодируемые белки: каталитическая субъединица ДНК-полимеразы γ (POLG), её вспомогательная субъединица (POLG2) и хеликаза TWNK. Эти белки вместе с белком, связывающим одноцепочечную ДНК, образуют минимальную систему репликации in vitro (Korhonen 2004).</p><p>Поэтому митохондриальная болезнь может быть вызвана мутацией ядерного гена. Мутации POLG или TWNK могут уменьшать число копий мтДНК (истощение мтДНК) или приводить к множественным делециям — без исходной гетероплазмии одного точечного варианта. Связь идёт и в обратную сторону: состояние митохондрий меняет экспрессию ядерных генов (<a href="#ns-g-S9-T69">ретроградная сигнализация</a>); стрессовые ответы такого рода рассматривает семинар 10.</p><div class="note trap"><strong>Типичная ошибка</strong> TFAM — фактор транскрипции ядерных генов, а PGC-1α сам связывает их промоторы.<p class="trap-fix">TFAM работает в матриксе: упаковывает мтДНК и участвует в её транскрипции. PGC-1α — коактиватор: он не связывает ДНК сам, а усиливает действие ядерных факторов NRF1 и NRF-2 (GABP).</p></div><div class="static-quiz"><h3>При дефекте ядерного гена POLG число копий мтДНК уменьшилось, но исследуемого мутантного варианта мтДНК нет. Возможен ли дефицит дыхательной функции?</h3><ol><li><b>А.</b> Невозможен: любой дефект дыхания требует высокой доли мутантной мтДНК. <i>(неверный вариант)</i><br><span class="expl">Митохондриальные болезни могут быть связаны с ядерными генами и истощением мтДНК, а не только с гетероплазмией точечной мутации.</span></li><li><b>Б.</b> Возможен: уменьшение числа копий мтДНК может снизить синтез кодируемых ею белков. <i>(верный вариант)</i><br><span class="expl">Число копий и доля определённого варианта — разные характеристики. Ядерные дефекты поддержания мтДНК могут нарушать дыхательный аппарат и без данного варианта.</span></li><li><b>В.</b> Невозможен: ядерные гены не участвуют в поддержании мтДНК. <i>(неверный вариант)</i><br><span class="expl">POLG кодируется в ядре; его продукт участвует в репликации мтДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1016/S0092-8674(00)80611-X">Wu Z. et al. Mechanisms controlling mitochondrial biogenesis and respiration through the thermogenic coactivator PGC-1. Cell. 1999;98:115–124. doi:10.1016/S0092-8674(00)80611-X</a></li><li><a href="https://doi.org/10.1016/j.bbamcr.2010.09.019">Scarpulla R.C. Metabolic control of mitochondrial biogenesis through the PGC-1 family regulatory network. Biochim Biophys Acta. 2011;1813:1269–1278. doi:10.1016/j.bbamcr.2010.09.019</a></li><li><a href="https://doi.org/10.1101/gad.7.3.380">Virbasius J.V., Virbasius C.A., Scarpulla R.C. Identity of GABP with NRF-2, a multisubunit activator of cytochrome oxidase expression, reveals a cellular role for an ETS domain activator of viral promoters. Genes Dev. 1993;7:380–392. doi:10.1101/gad.7.3.380</a></li><li><a href="https://doi.org/10.1073/pnas.91.21.9926">Moi P., Chan K., Asunis I., Cao A., Kan Y.W. Isolation of NF-E2-related factor 2 (Nrf2), a NF-E2-like basic leucine zipper transcriptional activator that binds to the tandem NF-E2/AP1 repeat of the beta-globin locus control region. Proc Natl Acad Sci USA. 1994;91:9926–9930. doi:10.1073/pnas.91.21.9926</a></li><li><a href="https://doi.org/10.1038/sj.emboj.7600257">Korhonen J.A., Pham X.H., Pellegrini M., Falkenberg M. Reconstitution of a minimal mtDNA replisome in vitro. EMBO J. 2004;23:2423–2429. doi:10.1038/sj.emboj.7600257</a></li></ul><p>Структурная карта связей, а не модель фиксированного усиления биогенеза. PGC-1, NRF и TFAM — культура мышечных клеток C2C12 (Wu 1999); идентичность GABP и NRF-2 — Virbasius 1993; NRF2 (NFE2L2) — Moi 1994; минимальная система репликации — очищенные белки человека (Korhonen 2004); болезни поддержания мтДНК — Russell 2020. Причины болезни зависят от конкретного варианта гена.</p></details></article><article class="card print-unit" id="ns-heteroplasmy-threshold"><div class="eyebrow">Два генома и гетероплазмия · шаг 25 из 30</div><h2>Почему эффект гетероплазмии может проявляться нелинейно</h2><p class="lead">При <a href="#ns-g-S9-T60">гетероплазмии</a> в клетке сосуществуют молекулы мтДНК разных вариантов; при <a href="#ns-g-S9-T61">гомоплазмии</a> все анализируемые молекулы одинаковы. Функция обычно снижается не пропорционально <a href="#ns-g-S9-T62">доле варианта</a>, а нелинейно: пока молекул дикого типа достаточно, дефект скрыт, а после некоторой доли проявляется. Эту долю называют <a href="#ns-g-S9-T64">порогом гетероплазмии</a>.</p><ol class="mech"><li>Каждая клетка содержит сотни или тысячи копий мтДНК; патогенный вариант может присутствовать в части из них.</li><li>Мутации мтДНК функционально рецессивны: молекулы дикого типа обеспечивают синтез нормальных субъединиц, а у комплексов есть резерв мощности.</li><li>Поэтому функция почти не меняется до высокой доли варианта, а затем резко падает; где именно — зависит от варианта, ткани и выбранного показателя.</li></ol><p>Митохондриальная ДНК присутствует в клетке во многих копиях. Если патогенный вариант возник в части молекул, клетка гетероплазмична; долю варианта выражают отношением числа молекул с вариантом к общему числу проанализированных молекул. Если все молекулы несут один вариант, клетка гомоплазмична.</p><p>Мутации мтДНК функционально рецессивны: оставшиеся молекулы дикого типа продолжают кодировать нормальные субъединицы. Кроме того, мощность дыхательной цепи в покое обычно используется не полностью. Поэтому при росте доли варианта функция сначала почти не меняется, а затем, когда молекул дикого типа становится слишком мало, снижается резко. По обзору Russell 2020, для биохимического дефекта в отдельной клетке патогенный вариант обычно должен достигать высокой доли — более 70 %.</p><p>Порог — не свойство варианта вообще, а результат сравнения в определённых условиях. Он зависит от самого варианта (вариант гена тРНК затрагивает синтез всех 13 белков, вариант гена одной субъединицы — один комплекс), от ткани и её потребности в ATP, от выбранного показателя и критерия «дефицита». В клетках с вариантом m.3243A&gt;G при постепенном росте его доли экспрессия генов менялась скачкообразно в нескольких диапазонах (Picard 2014).</p><p>Поэтому универсальной границы вроде «60–90 % для всех болезней» нет. Одна и та же доля варианта не означает одинаковой тяжести болезни: у носителей одного варианта при сходной гетероплазмии проявления сильно различаются, в том числе из-за ядерных генетических факторов (Russell 2020).</p><div class="note trap"><strong>Типичная ошибка</strong> Одна доля мутантной мтДНК соответствует одинаковой тяжести любой болезни.<p class="trap-fix">Порог зависит от варианта, ткани, измеряемой функции и критерия дефицита, а тяжесть болезни — ещё и от ядерного генетического фона. Одна и та же доля варианта может давать разные последствия.</p></div><div class="static-quiz"><h3>Для одного варианта мтДНК найден порог снижения определённого дыхательного показателя. Можно ли использовать это число как общий порог всех митохондриальных болезней?</h3><ol><li><b>А.</b> Можно: доля мутантной мтДНК всегда прямо равна доле погибающих клеток. <i>(неверный вариант)</i><br><span class="expl">Доля молекул варианта не определяет непосредственно ни распределение по клеткам, ни гибель клеток.</span></li><li><b>Б.</b> Можно: любой ген мтДНК изменяет все комплексы в одинаковой степени. <i>(неверный вариант)</i><br><span class="expl">Белок-кодирующий вариант и вариант тРНК могут иметь разный спектр последствий; даже варианты одного гена не равнозначны.</span></li><li><b>В.</b> Нельзя: порог зависит от варианта, клеточного контекста и выбранной функции. <i>(верный вариант)</i><br><span class="expl">Порог — результат определённого функционального сравнения. Его перенос на другой вариант, ткань или показатель требует самостоятельного обоснования.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1073/pnas.1414028111">Picard M., Zhang J., Hancock S., Derbeneva O., Golhar R., Golik P., O&#x27;Hearn S., Levy S., Potluri P., Lvova M., Davila A., Lin C. S., Perin J. C., Rappaport E. F., Hakonarson H., Trounce I. A., Procaccio V., Wallace D. C. Progressive increase in mtDNA 3243A&gt;G heteroplasmy causes abrupt transcriptional reprogramming. Proc Natl Acad Sci USA. 2014;111:E4033–E4042. doi:10.1073/pnas.1414028111</a></li></ul><p>Учебная модель, общая с практикумом (вопрос 4), в упрощённом виде: обеспеченность субъединицей f = min(1, (1 − h)/0,40) — полного синтеза субъединицы достигают уже 40 % молекул дикого типа (условный параметр практикума), относительная мощность комплекса g = (1 + R)·f / (R + f), R — условный параметр резерва; критерий дефицита задан как доля мощности, необходимая при низкой или высокой потребности. Кривая — не данные пациента и не диагностический порог. Нелинейный ответ на m.3243A&gt;G — цибриды с разной долей варианта (Picard 2014); порог &gt; 70 % для дефекта в отдельной клетке и клиническая изменчивость — Russell 2020.</p></details></article><article class="card print-unit" id="ns-copy-number"><div class="eyebrow">Два генома и гетероплазмия · шаг 26 из 30</div><h2>Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа</h2><p class="lead">Доля варианта — относительная величина; <a href="#ns-g-S9-T63">число копий мтДНК</a> — абсолютная. Одинаковая доля варианта в клетках с разным числом копий означает разное абсолютное число молекул дикого типа. Арифметика простая, но она ещё не говорит, хватит ли этих молекул для функции.</p><ol class="mech"><li>Число копий дикого типа равно общему числу копий, умноженному на долю дикого типа: Nдт = Nобщ · (1 − h).</li><li>При h = 70 % и 1000 копиях остаётся 300 молекул дикого типа, а при 500 копиях — 150.</li><li>Хватит ли этих молекул, зависит от экспрессии, потребности ткани и типа варианта: вариант тРНК нарушает синтез всех 13 белков, вариант субъединицы — один комплекс.</li></ol><p>Чтобы сравнивать клетки, нужно различать два показателя. Доля варианта h — это отношение числа молекул с вариантом к общему числу молекул мтДНК. Число копий — сколько всего молекул мтДНК находится в клетке или в образце в расчёте на выбранную единицу (клетку, диплоидный ядерный геном).</p><p>Пусть в клетке X 1000 копий мтДНК, в клетке Y — 500, и в обеих доля варианта 70 %. Тогда доля дикого типа — 30 %, и в X остаётся 1000 · 0,3 = 300 молекул дикого типа, а в Y — 500 · 0,3 = 150. Доля одинаковая, а абсолютное число нормальных молекул различается вдвое. Число мутантных молекул — 700 и 350.</p><p>Из этой арифметики ещё не следует, что Y работает вдвое хуже. Функция зависит от того, сколько РНК и белка синтезируется с каждой молекулы, какова потребность ткани и сколько резерва у комплексов. Значение имеет и тип варианта. Вариант в гене одной субъединицы затрагивает один комплекс. Вариант в гене тРНК, например m.3243A&gt;G в гене тРНК лейцина, нарушает синтез всех 13 белков мтДНК и поэтому затрагивает комплексы I, III, IV и V.</p><p>Поэтому в генетическом анализе определяют и долю варианта, и число копий (шаг о методах), а о функции судят по отдельным измерениям.</p><div class="note trap"><strong>Типичная ошибка</strong> При одинаковой гетероплазмии число молекул дикого типа одинаково.<p class="trap-fix">Одинакова только доля. Абсолютное число молекул дикого типа равно общему числу копий, умноженному на долю дикого типа, и при разном числе копий различается.</p></div><div class="static-quiz"><h3>В каждой из двух клеток есть только молекулы мтДНК дикого типа и данного мутантного варианта. В X всего 1000 копий, в Y — 500; в обеих доля мутантного варианта 70 %. Сколько копий дикого типа остаётся в каждой клетке?</h3><ol><li><b>А.</b> В X и Y — по 300 копий дикого типа. <i>(неверный вариант)</i><br><span class="expl">Одинаковая доля не устраняет различия общего числа молекул: в Y их вдвое меньше.</span></li><li><b>Б.</b> В X — 300, в Y — 150 копий дикого типа. <i>(верный вариант)</i><br><span class="expl">Доля дикого типа равна 30 %. Умножение на общее число даёт 300 и 150; вывод о функции требует дополнительных условий.</span></li><li><b>В.</b> В X — 700, в Y — 350 копий дикого типа. <i>(неверный вариант)</i><br><span class="expl">Это число копий мутантного варианта, а не дикого типа.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li></ul><p>Арифметический пример по заданным значениям: Nобщ = 1000 и 500, h = 0,70; это не измерение клеток и не кривая болезни. Не предполагается, что каждая копия дикого типа вносит одинаковый вклад во всех тканях. Влияние варианта тРНК на все белки мтДНК — Russell 2020.</p></details></article><article class="card print-unit" id="ns-segregation"><div class="eyebrow">Два генома и гетероплазмия · шаг 27 из 30</div><h2>Как наследование и сегрегация меняют распределение вариантов мтДНК</h2><p class="lead">мтДНК человека наследуется по материнской линии. При делениях клеток молекулы распределяются между дочерними клетками случайно, и доля варианта у них может различаться — это <a href="#ns-g-S9-T65">митотическая сегрегация</a>. В зародышевой линии на одном из этапов передаётся небольшое эффективное число молекул — <a href="#ns-g-S9-T66">генетическое бутылочное горлышко</a>; поэтому дети одной матери могут получить очень разную долю варианта.</p><ol class="mech"><li>При делении клетки копии мтДНК распределяются между дочерними клетками случайно, а репликация отдельных молекул не связана с клеточным циклом.</li><li>Чем меньше эффективное число независимо передаваемых единиц, тем сильнее доли варианта у потомков отклоняются от исходной в обе стороны.</li><li>Случайный дрейф меняет распределение дол
