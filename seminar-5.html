 "src_067": "Xu M. et al. Partitioning of histone H3-H4 tetramers during DNA replication-dependent chromatin assembly. Science. 2010;328:94–8. doi:10.1126/science.1178994", "src_068": "Xu W. et al. Oncometabolite 2-hydroxyglutarate is a competitive inhibitor of α-ketoglutarate-dependent dioxygenases. Cancer Cell. 2011;19:17–30. doi:10.1016/j.ccr.2010.12.014", "src_069": "Yin Y. et al. Impact of cytosine methylation on DNA binding specificities of human transcription factors. Science. 2017;356:eaaj2239. doi:10.1126/science.aaj2239", "src_070": "Yu C. et al. A mechanism for preventing asymmetric histone segregation onto replicating DNA strands. Science. 2018;361:1386–1389. doi:10.1126/science.aat8849", "src_071": "Zee BM. et al. In vivo residue-specific histone methylation dynamics. J Biol Chem. 2010;285:3341–50. doi:10.1074/jbc.M109.063784", "src_072": "Zhu F. et al. The interaction landscape between transcription factors and the nucleosome. Nature. 2018;562:76–81. doi:10.1038/s41586-018-0549-5", "teacher_1": "На каждый вопрос отводится 5–7 минут на базовом уровне и 8–10 минут на продвинутом. В режиме «Сценарий: предскажите и проверьте» на каждом шаге задаётся вопрос: студенты выбирают ответ, затем нажимают «Показать на схеме»; до показа ответа ручки недоступны. Клавиши 1–4 переключают вопросы, клавиша B — уровень. Щелчок по белку или молекуле (или Tab и Enter) открывает справку: сначала краткое пояснение, затем блок «Подробнее: обоснование и источники» с системой опыта, числами и ссылками. В вопросе 1 курсора времени нет (показано равновесие); в вопросах 2–4 у сцены свой курсор, единица времени указана в его подписи (минуты, часы или число делений). Числа на схеме и в показаниях — расчёт учебной модели; числа из литературы получены в разных системах (in vitro, дрожжи, клетки мыши и человека) и не образуют одной измеренной кривой. Вкладки связаны одной историей: как регуляторная ДНК остаётся доступной, если она упакована в нуклеосомы, и почему у каждого механизма свой масштаб времени. ДНК на нуклеосоме самопроизвольно раскрывается и закрывается за доли секунды (вопрос 1); время пребывания транскрипционного фактора на сайте — секунды, а мотор ремоделера сдвигает нуклеосому за секунды–минуты (вопрос 2); метки гистонов выходят на новый уровень за минуты (ацетилирование) и часы–сутки (метилирование) (вопрос 3); состав нуклеосом разбавляется при каждом делении и обновляется за часы (вопрос 4). Три различения повторяются на всех вкладках: доступность ДНК не равна связыванию фактора и активности гена; метка гистона не равна экспрессии; опыт с ингибитором указывает на участие мишени, но один такой опыт не устанавливает механизм.", "teacher_2": "Модель вопроса 1 равновесная: время не рассчитывается, показания — расчёт, а не данные прибора. Измерено: времена пребывания Rap1 на свободной ДНК, у входа нуклеосомы (SHL 6,5) и на SHL 4,5 — 452, 46 и 7,7 с (Mivelaz 2020; одиночные молекулы, очищенные компоненты, in vitro), в фибрилле из 12 нуклеосом — 16,8 с; доля развёрнутого конца при H3K56ac 13 → 28 % (Neumann 2009); отношения сродства Oct4 и Klf4 к нуклеосоме и свободной ДНК (Soufi 2015, EMSA). Рассчитано: константа раскрытия из отношения времён; независимая проверка — доля раскрытого конца около 15 % против 4–17 % по реферату Li 2005. Допущено: экспонента K по SHL и все числа глубже SHL 4,5; остаток нуклеосомы над сайтом после ремоделера (5 %); множители H1, poly(dA:dT) и метилирования (знаки по Iwasaki 2016, Iyer 1995, Yin 2017); порог видимости футпринта 10 с (Sung 2014); фон ATAC-seq. Модель не разделяет положение и последовательность (сайт S1 у SHL 4,5 держит Rap1 дольше, чем S2, перенесённый на то же положение), не описывает несколько ТФ, динамику ремоделирования и разнородность клеток. Спорно: перенос Rap1 на другие ТФ, поскольку у 220 ТФ предпочтения положения различны (Zhu 2018). Вопрос 2. Сцена 2b (пробирка). Из работы Gamarra 2018 (SNF2h человека, нуклеосомы 0/60, нативный гель, 20 °C, 5 мМ АТФ·MgCl₂) взяты форма k = kmax·E^h/(KMapp^h + E^h) и числа kmax = 2,5 мин⁻¹, KMapp = 61 нМ, h = 1,5; период полупревращения около 17 с рассчитан из kmax. Допущены автором модели: полный переход в сдвинутое положение, нулевой сдвиг без АТФ, остаточная доступность сайта 5 %, диапазон содержания фермента. Сцена 2a (клетки, минуты — часы). Доступность района (ATAC) релаксирует к уровню, который задаёт работа мотора BAF; ручки: воздействие (BRM014, ACBI1, dTAG47, PFI-3, мутант АТФазы), паралог SMARCA2, субъединицы ARID, тип района (BAF-зависимый район или Polycomb-локус), отмывка BRM014, время 0–360 мин. Измерено в названных работах: потеря доступности за 10–60 мин и возврат за 15–60 мин после отмывки (Iurlaro 2021, мышиные ES-клетки, по подписям рисунков); острая потеря обеих АТФаз почти полностью лишает BAF-зависимые районы доступности, деградация SMARCA4-dTAG почти полная за 2–3 ч (Schick 2021, HAP1); порядок событий на Polycomb-локусе — посадка BAF около 2 мин, PRC1 уходит раньше PRC2, H2AK119ub1 исчезает раньше H3K27me3 (Kadoch 2017, фибробласты мыши). Допущения автора модели (источником не подкреплены): остаточная доступность 0,1; две постоянные времени районов 10 и 40 мин; деградация с τ = 50 мин для обоих деградеров; доля работы мотора, которую несёт SMARCA4, 0,7; потеря половины активности мотора у мутанта; вклад ARID 0,8 и 0,4; чувствительность новой РНК 0,2 и её запаздывание 30 мин; снижение ChIP эндогенного SMARCA2 после BRM014 до 0,7; постоянные времени на Polycomb-локусе (PRC1 8 мин, H2AK119ub1 15 мин, H3K27me3 60 мин; задержка посадки BAF 2 мин взята из текста Kadoch 2017, где приведён и 95 % доверительный интервал 2,2–4,8 мин — 2 мин лежит вне этого интервала, значение для сверки с первичным текстом). Сценарий 2a: восемь шагов — BRM014; PFI-3 (следствие механизма, не измерение ATAC); dTAG47 при наличии SMARCA2; то же с нокаутом SMARCA2; Polycomb-локус с мутантом АТФазы; ACBI1 против BRM014 за 30 мин; отмывка BRM014; загадка X, Y, Z (BRM014, ACBI1, PFI-3 на 60 мин): образец Y определяется по ослабленным полосам вестерн-блота. Вопрос 3. Модель учебная: показания рассчитаны, а не измерены. В базовой сцене метка — ацетил на H3K27, нуклеосомы делятся на две доли; константы подобраны так, чтобы при нормальных активностях метку несла половина нуклеосом, а время выхода на новый уровень составляло 5 мин. Порядок минут принят по дрожжам (Katan-Khaykovich 2002, по реферату), константы p300/CBP и HDAC человека не измерены. В продвинутой сцене остаток K27 имеет три несовместимых состояния (без метки, ацетил, триметил), переходы идут через состояние без метки; me1 и me2 не показаны. Из работ взято: усиление PRC2 ридером EED примерно в семь раз при насыщении триметилпептидом in vitro (Margueron 2009); линейный рост IC50 A-485 с концентрацией ацетил-КоА in vitro (Lasko 2017); различие Kd JQ1 in vitro и в клетках (Filippakopoulos 2010). Подобрано: исходные доли меток, пороги и кооперативность ридеров, исходная сила обратной связи, сила ингибирования PRC2 мутантным гистоном (по согласованию с вопросом 4), масштаб «часы» для метилирования (перенесён с H3K9me3, Hathaway 2012). Не показаны: распространение метки по решётке нуклеосом, память, деления клеток, фармакокинетика препаратов, изоформы HDAC. Перекрёстные сдвиги меток — следствие допущения «один остаток». Вопрос 4. Модель учебная: показания рассчитаны, а не измерены. Измерено: потеря гистона H4 около 0,4 % в час в клетках человека (Alabert 2015); около 400 молекул CENP-A на центромеру человека (Bodor 2014); около 1 % H2AX фосфорилируется на 1 Гр, максимум за 10 мин (Rogakou 1998); H3.3 зависит от HIRA на генах и от ATRX–DAXX на теломерах (Goldberg 2010; Lewis 2010), направление измерено, величина нет; на теломерах новый H3.3 появляется позже, чем на промоторах, тРНК и рибосомных генах (Kraushaar 2013, клетки мыши); ATM и DNA-PK действуют избыточно (Stiff 2004). Рассчитано: доли родительских, новых с H3.1 и новых с H3.3 нуклеосом по числу делений (цикл 24 ч). Допущения, не измеренные: оборот на активном гене — одна замена на нуклеосому за цикл (порядок по Deal 2010 для Drosophila); остаточная доля H3.3 без своего шаперона 20 %; доля H3.3 среди новых нуклеосом при репликации 20 %; время затухания γH2AX (в модели безразмерное); ослабление снятия фосфата при подавленной PP2A (в пять раз — допущение; в работе измерено направление, величина не дана); число разрывов 35 на 1 Гр и область около 2 млн п.н. на разрыв (оценки авторов Rogakou 1998, не измерения; линейность по дозе вне 1 Гр — допущение); индекс γH2AX при стрессе репликации 0,5 (условный, с долей от дозы излучения несравним). Шкала доли K27M подогнана под пятикратный рост H3K27me3 при удалении K27M (Harutyunyan 2019, линии глиом человека); диапазон 3–17 % — цитата из введения этой работы, а не измерение.", "teacher_3": "Не утверждать, что нуклеосома закрывает сайт насквозь: ДНК у входа раскрыта примерно 4–17 % времени (расчёт по реферату Li 2005), доступность — вероятность. Не утверждать, что положение нуклеосомы однозначно определяет, свяжется ли ТФ: Rap1 присоединяется к нуклеосомной ДНК со сходной скоростью, но время его пребывания на ней сокращено примерно в 10 раз и более (Mivelaz 2020; у входа 452 против 46 с), а предпочтения положения у ТФ различны (Zhu 2018). Rap1 нуклеосому сам не вытесняет: в опытах для этого нужен ремоделер RSC. Ацетилирование не «открывает хроматин» вообще: прямой эффект на одиночную нуклеосому показан для H3K56ac (Neumann 2009), а H4K16ac действует на контакты в фибрилле (Shogren-Knaak 2006). Пик ATAC-seq — вероятность вставки Tn5, а не занятость ТФ (Buenrostro 2013); отсутствие футпринта не означает отсутствия ТФ (Sung 2014). Метилирование ДНК не закрывает сайт универсально: знак зависит от ТФ (Yin 2017). Промоторная область без нуклеосом не постоянно доступна: для зонда AluI в ядрах дрожжей сайт доступен примерно в 53 % клеток (Chereji 2019). Фибриллу 30 нм получали in vitro (Song 2014), в клетках по ChromEMT видна неупорядоченная цепь (Ou 2017). Поправки к блоку координатора: 147 п.н. — около 1,65 витка, а не 1,7 (Luger 1997; Davey 2002); синдром Коффина–Лоури вызывает RPS6KA3, а не CREBBP/EP300. Вопрос 2 (поправки и ограничения). Шаг мотора 1–2 п.н. измерен у RSC (Harada 2016), у ISWI паузы наступают после около 7 п.н., затем 3–4 п.н. (Blosser 2009); для остальных семейств размер шага не показан. Время пребывания ремоделера на хроматине в дрожжах составляет 4–7 с (Kim 2021). Сцена 2a: вестерн-блот условный и насыщается, «нет полосы» не равно нулю; PFI-3 не вытесняет эндогенный SMARCA2 (Vangamudi 2015, по реферату) — в сцене это следствие механизма, а не измерение; на Polycomb-локусе опыта с BRM014 нет, прочерк по механизму (Stanton 2017, по реферату); роль ARID1B как замещающей субъединицы взята по рефератам Kelso 2017 и Mathur 2017, а в Trizzino 2018 потеря ARID1A мало меняет доступность, но нарушает паузирование Pol II (в модель не входит). Системы разные (HAP1, мышиные ES-клетки, фибробласты мыши), перенос между ними — допущение. Различия семейств ремоделеров (RSC, INO80, ISW2, ISW1a) взяты по реферату Krietenstein 2016 и в сцену числами не входят. Вопрос 3: чего не следует утверждать студентам. Первое: метка не равна состоянию гена; JQ1 снижает занятость BRD4 и синтез РНК, не меняя H3K27ac, а причинная роль метки в транскрипции остаётся предметом спора. Второе: роль KDM6 в эффекте GSK-J4 в клетках не доказана, препарат подавляет и другие деметилазы (Kruidenier 2012; Heinemann 2014). Третье: K27M не отключает PRC2 везде; общий H3K27me3 падает, а в части локусов растёт (Chan 2013; Lewis 2013). Четвёртое: периоды полужизни H3K27ac и H3K27me3 человека в источниках вопроса не найдены; «минуты» и «часы» на экране — учебная модель. Пятое: рост H3K27ac при K27M в модели следует из допущения «один остаток»; в клетках он не измерен, и направление нужно проверить по первичной работе. Шестое: дозы препаратов заданы в единицах Ki, потому что Ki в клетках не равна Ki in vitro; нМ на экран не вынесены. Седьмое: направление действия вориностата на ацетилирование известно по реферату для гистона H4 (Richon 1998), влияние на H3K27me3 в клетках не измерено. Восьмое: Kd ридеров к нуклеосомам не найден, поэтому занятость ридера задана пороговой функцией. Девятое: в сцене 3a нет ползунков SAM, α-КГ и силы обратной связи EED → PRC2; в модели они есть, а на экране кофактор метилирования и α-КГ меняются препаратом (таземетостат, 2-HG), обратная связь задана допущением. Вопрос 4: чего не следует утверждать студентам. Первое: H3.3 нельзя называть «гистоном активных генов»: на теломерах и перицентрических повторах его вносит ATRX–DAXX вне репликации, а HIRA нужен не на всех локусах (Goldberg 2010; Lewis 2010). Второе: числа оборота нельзя переносить между системами: 0,4 % H4 в час — клетки человека (Alabert 2015), а быстрый обмен нуклеосом на активных участках измерен у Drosophila (Deal 2010). Третье: сигнал γH2AX показывает разрыв, но не причину и не исход репарации; роль одиночного ATM в работах оценена по-разному (Burma 2001; Stiff 2004). Четвёртое: K27M не отключает PRC2 везде: глобально H3K27me3 падает, а на части локусов растёт (Chan 2013). Пятое: числа остаточной доли H3.3 без шаперона (20 %), разрывов на грей, области на разрыв и ослабления при подавленной PP2A — допущения или оценки авторов, а не результаты измерений; блок репликации и потерю шаперона модель считает идеальными, в клетке они вызывают и другие последствия."};

function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(o.yfmt ? o.yfmt(v) : fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on-line'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

function setCap(key, k, v){ $('cap' + key).textContent = t(k, v); $('why' + key).textContent = t(k + '_z', v); }
/* структурная формула: рисунок RDKit из formulas.js, подпись — название (ключ fn_*) и брутто-формула */
function fmHTML(k){ const f = FORMULAS[k]; if (!f) return '';
  return `<figure class="fm"><svg viewBox="0 0 ${f.w} ${f.h}" style="width:${Math.round(f.w * FM_SCALE)}px;height:auto" role="img" aria-label="${t('fn_' + k)}">${f.svg}</svg><figcaption><b>${t('fn_' + k)}</b>${f.bf ? ' <span class="mono">' + f.bf + '</span>' : ''}</figcaption></figure>`; }
const FM_SCALE = .8;
/* та же формула внутри схемы: группа с масштабом в точке (x, y), ширина w в единицах схемы (вложенный svg не годится: .stage svg растягивает его на всю схему) */
function fmSVG(k, x, y, w){ const f = FORMULAS[k]; return `<g class="fm-s" transform="translate(${x} ${y}) scale(${(w / f.w).toFixed(4)})">${f.svg}</g>`; }
/* справка в два уровня: первое предложение (короткое определение) видно сразу, остальное — по раскрытию (аудит R10).
   Граница — конец предложения не раньше 50-го знака; инициалы вида «S. cerevisiae», «т. е.» и т. п. границей не считаются. */
function infoSplit(s){
  const re = /([.!?])\s+(?=[А-ЯЁA-Z«(])/g; let m;
  while ((m = re.exec(s))){ const i = m.index;
    if (i < 50) continue;
    const prev = s.slice(Math.max(0, i - 4), i);
    if (/(^|[\s(])[A-Za-zА-Яа-яё]$/.test(prev) || /(т\. ?е|др|рис|см|ок|стр|им)$/.test(prev)) continue;
    const rest = s.slice(i + 1).trim();
    return rest.length < 60 ? [s, ''] : [s.slice(0, i + 1), rest];
  }

}

  $('infoX' + key).onclick = close;

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {}, cmp: '' };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py --student) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 's5-12542';
/* ---------- v1.2 (аудит v1.1, V1/V4/V5): показатели «до → после → эталон», текст результата, закреплённая навигация ---------- */
let TXT_INV = null;
const numOf = s => { const m = String(s).replace(/ /g, ' ').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? +m[0] : NaN; };
/* показатели текущей сцены: полосы .mm в блоке показателей (по подписи) + дополнительные величины сцены (S.vals) */
function readMetrics(K){
  const out = {};
  document.querySelectorAll('#reads' + K + ' .mm').forEach(e => { if (e.closest('[hidden]')) return; const s = e.querySelector('small'), v = e.querySelector('.v'); if (s && v) out[s.textContent] = v.textContent; });
  const S = SCENES[K]; if (S && S.vals) for (const k in S.vals) out[t(k)] = S.vals[k];
  return out;
}
/* три показателя шага: список ключей подписей в шаге (st.m); без списка — три величины с наибольшим изменением */
function poeCompare(st, before, ref, after){
  const na = v => v == null || v === '' ? '—' : v;
  /* сравнение двух линий (а не «до → после»): строки — показатели, столбцы — линии (аудит v1.2, N5) */
  if (st.pairs){
    const rows = st.pairs.filter(([, a, b]) => t(a) in after && t(b) in after);
    if (!rows.length) return '';
    return `<div class="cmp cmp2" role="group" aria-label="${t('poe_m_lines')}"><div class="cmp-h"><span>${t('poe_m_lines')}</span><span>${t('poe_m_l1')}</span><span>${t('poe_m_l2')}</span></div>` +
      rows.map(([lab, a, b]) => `<div class="cmp-r"><span class="cmp-n">${t(lab)}</span><span class="mono cmp-now">${after[t(a)]}</span><span class="mono cmp-now">${after[t(b)]}</span></div>`).join('') + `</div>`;
  }
  let keys = st.m ? st.m.map(k => t(k)) : Object.keys(after).sort((a, b) => Math.abs(Math.log((numOf(after[b]) + 1e-3) / (numOf(before[b]) + 1e-3))) - Math.abs(Math.log((numOf(after[a]) + 1e-3) / (numOf(before[a]) + 1e-3)))).slice(0, 3);
  keys = keys.filter(k => k in after);
  if (!keys.length) return '';
  const arrow = (a, b) => { const x = numOf(a), y = numOf(b); if (!isFinite(x) || !isFinite(y)) return ''; const d = y - x, rel = Math.abs(d) / Math.max(Math.abs(x), Math.abs(y), .02); return rel < .04 ? '≈' : (d > 0 ? '↑' : '↓'); };
  const cells = keys.map(k => [k, na(before[k]), na(after[k]), na(ref[k])]);
  const dash = cells.some(c => c.slice(1).includes('—'));
  return `<div class="cmp" role="group" aria-label="${t('poe_m_t')}"><div class="cmp-h"><span>${t('poe_m_t')}</span><span>${t(st.hB || 'poe_m_before')}</span><span></span><span>${t(st.hA || 'poe_m_after')}</span><span>${t(st.ctlH || 'poe_m_ref')}</span></div>` +
    cells.map(([k, b, a, r]) => `<div class="cmp-r"><span class="cmp-n">${k}</span><span class="mono">${b}</span><span class="cmp-a">${arrow(b, a)}</span><span class="mono cmp-now">${a}</span><span class="mono cmp-ref">${r}</span></div>`).join('') +
    `<p class="cmp-note">${st.ctlH ? '' : t('poe_m_ref_note')}${dash ? ' ' + t('poe_m_na') : ''}</p></div>`;
}
function poeLive(msg){ let l = $('poeLive'); if (!l){ l = document.createElement('div'); l.id = 'poeLive'; l.className = 'sr-only'; l.setAttribute('aria-live', 'polite'); document.body.appendChild(l); } l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30); }

/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;

function initNav(){

  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); poeSetup(); };

  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ qn = +e.key; show(); }
    if (e.key === 'b' || e.key === 'и'){ lvl = lvl === 'b' ? 'a' : 'b'; show(); } });

  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };

/* =====================================================================
   Семинар 10. Общие средства для четырёх вопросов (не модель: модель каждого вопроса — в его файле sK.js).
   - GFORM, LEGEND_EXTRA: справочные формулы и дополнительные строки легенды (заполняют сцены);
   - числа и подписи: NB, fPct, fX, fRel, fH;
   - значки на схеме: BADGE (OH, Ub и др.);
   - время: rk4, integrate, Traj (траектория считается при любом изменении входов), clockHTML/clockWire;
   - мелкая арифметика: sig, lerp.
   Правила: 1) состояние на курсоре времени берётся из траектории, а не из «живых» тиков; 2) шаг сценария ставит курсор
   в заданный момент, поэтому разбор не зависит от скорости воспроизведения; 3) подписи величин — из реестра показателей.
   ===================================================================== */
const GFORM = {};            /* справка: ключ карточки -> список ключей структурных формул (formulas.js) */
const LEGEND_EXTRA = [];     /* дополнительные строки легенды: { svg: '<circle .../>', key: 'lg_...' } */
const NB = ' ';         /* неразрывный пробел */
const sig = x => 1 / (1 + Math.exp(-x));
const lerp = (a, b, u) => a + (b - a) * u;

/* ---------- подписи чисел ---------- */
const fPct = x => Math.round(x * 100) + NB + '%';                        /* доля: 0,37 -> «37 %» */
const fX = x => '×' + (x >= 10 ? Math.round(x) : x >= 1 ? fmt(x, 1) : fmt(x, 2));  /* кратность: «×3,2», «×0,35» */
const fRel = (x) => fX(x);                                                /* «относительно исходного» */
const fH = h => h < 1 ? Math.round(h * 60) + NB + 'мин' : (Math.abs(h - Math.round(h)) < .05 ? Math.round(h) : fmt(h, 1)) + NB + 'ч';

/* ---------- значок на схеме: P — фосфорилирование (PB из core.js); OH — гидроксилирование; Ub — убиквитин; X — прочая модификация ---------- */
function BADGE(id, x, y, txt, cls = ''){
  return `<g class="pb fade ${cls}" id="${id}" opacity="0"><circle cx="${x}" cy="${y}" r="${txt.length > 1 ? 10 : 8.5}"/><text x="${x}" y="${y + .5}">${txt}</text></g>`;
}

/* ---------- полоса показания: имя, значение, метка эталона (серая риска), текст справа. Разметку читает readMetrics (core.js): small = имя, .v = значение ---------- */
const mm = (name, v, ctrl, text) => `<div class="mm"><div class="mt"><small>${name}</small><span class="v">${text}</span></div><div class="meter"><i style="width:${Math.round(clamp(v) * 100)}%"></i>${ctrl == null ? '' : `<u class="tk" style="left:calc(${(clamp(ctrl) * 100).toFixed(1)}% - 1px)"></u>`}</div></div>`;
/* логарифмическая шкала для кратного роста: x (в разах от исходного) -> 0..1 на промежутке [1/lo, hi] */
const logScale = (x, lo, hi) => clamp((Math.log(Math.max(x, 1e-6)) - Math.log(1 / lo)) / (Math.log(hi) - Math.log(1 / lo)));

/* ---------- интегрирование ---------- */
/* f(t, y) -> dy (массив); y0 — массив; возвращает следующее y */
function rk4(f, t, y, dt){
  const n = y.length, add = (a, b, s) => a.map((v, i) => v + b[i] * s);
  const k1 = f(t, y), k2 = f(t + dt / 2, add(y, k1, dt / 2)), k3 = f(t + dt / 2, add(y, k2, dt / 2)), k4 = f(t + dt, add(y, k3, dt));
  const out = new Array(n); for (let i = 0; i < n; i++) out[i] = y[i] + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
  return out;
}
/* Траектория: y(t) на сетке 0..tEnd с шагом dt; at(t) — линейная интерполяция. Вход f зависит от t (события: добавление, отмывка).
   Состояния клипуются снизу нулём (концентрации не отрицательны). */
class Traj {
  constructor(f, y0, tEnd, dt = .05, sub = 1){
    this.dt = dt; this.tEnd = tEnd; this.ys = [y0.slice()]; let y = y0.slice();
    const n = Math.round(tEnd / dt), h = dt / sub;
    for (let i = 0; i < n; i++){ for (let s = 0; s < sub; s++) y = rk4(f, i * dt + s * h, y, h).map(v => Math.max(0, v)); this.ys.push(y.slice()); }
  }
  at(t){
    const u = clamp(t / this.dt, 0, this.ys.length - 1), i = Math.floor(u), j = Math.min(i + 1, this.ys.length - 1), w = u - i;
    return this.ys[i].map((v, k) => v + (this.ys[j][k] - v) * w);
  }
  series(k){ return this.ys.map((y, i) => [i * this.dt, y[k]]); }
}

/* ---------- часы: движок времени и воспроизведение ---------- */
/* Использование в сцене:  ctrl += clockHTML(P, tMax); … clock = clockWire(P, tMax, speed, onT);  S.tick = dt => clock.tick(dt);
   clock.t — часы от начала опыта; clock.set(t) — поставить курсор (например, в шаге сценария). */
function clockHTML(P, tMax){
  return `<div class="slider clock"><div class="row"><label for="${P}t">${t('clk_t')}</label><output id="${P}tO">0</output></div>` +
    `<input type="range" id="${P}t" min="0" max="${Math.round(tMax * 20)}" value="0"><div class="btns"><button class="btn ghost" id="${P}play" type="button">${t('clk_play')}</button></div></div>`;
}
function clockWire(P, tMax, speed, onT){
  const c = { t: 0, playing: false, set(v){ c.t = clamp(v, 0, tMax); $(P + 't').value = Math.round(c.t * 20); $(P + 'tO').textContent = fH(c.t); onT(c.t); },
              tick(dt){ if (!c.playing) return; const n = c.t + dt * speed; if (n >= tMax){ c.set(tMax); c.stop(); } else c.set(n); },
              stop(){ c.playing = false; $(P + 'play').textContent = t('clk_play'); } };
  $(P + 't').addEventListener('input', () => { c.stop(); c.set(+$(P + 't').value / 20); });
  $(P + 'play').addEventListener('click', () => { if (c.playing){ c.stop(); return; } if (c.t >= tMax) c.set(0); c.playing = true; $(P + 'play').textContent = t('clk_pause'); });
  $(P + 'tO').textContent = fH(0);
  return c;
}

const FORMULAS = {};   /* структурные формулы (RDKit): заполняется после проверки по InChIKey */

/* =====================================================================
   Модель M1 (вопрос 1 семинара 5): доступность сайта ТФ на нуклеосомной ДНК в равновесии (без курсора времени).
   Чистые функции без DOM. Допущения собраны в PAR и в claims/q1_params.md (статус каждого числа: измерено / расчёт из измеренного / допущение).

   Что считает модель.
   1. Положение сайта задано сверхспиральным положением SHL: 7 — конец нуклеосомной ДНК (вход), 0 — ось симметрии (дьяда). Шаг ~10 п.н. на единицу SHL (Zhu 2018: период ~10 п.н.).
   2. Константа раскрытия K(SHL) = [сайт раскрыт]/[сайт закрыт]: убывает от входа к оси (Anderson & Widom 2000: только монотонность; числа в реферате нет).
      Форма — экспонента по SHL; две точки получены из кажущихся Kd для Rap1 (Mivelaz 2020: τ_off,2 452 с на свободной ДНК, 46 с при SHL ≈ 6,5, 7,7 с при SHL ≈ 4,5):
      эквивалентная константа K = 1/(r − 1), где r = τ(свободная)/τ(нуклеосома) = Kd,каж/Kd(свободная ДНК) при равной скорости присоединения. Независимая проверка (не подгонка):
      на конце (SHL 7) модель даёт K ≈ 0,18 и долю раскрытого состояния ≈ 15 %, а расчёт по Li 2005 (реферат: 250 мс завёрнута, 10–50 мс развёрнута) даёт K ≈ 0,04–0,2 и долю 4–17 %.
      За пределами SHL 4,5…6,5 (глубже) форма — экстраполяция, допущение: на экране подписывается «учебная модель».
   3. Кажущаяся константа диссоциации ТФ: Kd,каж = Kd(свободная ДНК) · g, где g(SHL) — множитель нуклеосомы (g = 1 на свободной ДНК).
      Два предельных механизма с одним и тем же g (поэтому одинаковой равновесной занятостью, но разной кинетикой — их различает одномолекулярный прибор):
      'dissoc' — ускоренная диссоциация (Rap1; Mivelaz 2020): скорость присоединения как на свободной ДНК, время пребывания в g раз короче;
      'capture' — захват раскрытого состояния (Polach & Widom 1995): время пребывания как на свободной ДНК, скорость присоединения в g раз ниже, g = 1 + 1/K.
   4. Занятость θ = c/(c + Kd,каж/Kd0) при содержании ТФ c в единицах Kd на свободной неметилированной ДНК.
   Модель НЕ считает: последовательность (601 против природной), несколько ТФ (кооперативность), вращательную фазу ~10 п.н., динамику сдвига нуклеосомы (вопрос 2), метки (вопрос 3) и варианты гистонов (вопрос 4), транскрипцию.
   ===================================================================== */
const M1 = (function(){
  /* ---------------- параметры: «источник / статус» ---------------- */
  const PAR = {
    /* Rap1, одиночные молекулы, in vitro, сайт S2; τ_off,2 — долгая фаза (Mivelaz 2020, Fig. 2; измерено) */
    TAU_FREE: 452,        /* с, свободная ДНК (измерено) */
    TAU_MONO_65: 46,      /* с, мононуклеосома 601, SHL ≈ 6,5 (измерено) */
    TAU_MONO_45: 7.7,     /* с, тот же сайт перенесён на SHL ≈ 4,5 (измерено) */
    TAU_FIB_65: 16.8,     /* с, фибрилла 12×601, тот же сайт (измерено) */
    /* Li 2005 (реферат, in vitro): 250 мс завёрнута; 10–50 мс развёрнута → K конца = 10/250…50/250 = 0,04…0,2 (расчёт) */
    K_END_LO: .04, K_END_HI: .2,
    SHL_END: 7, SHL_DYAD: 0, SHL_A: 6.5, SHL_B: 4.5,
    /* Soufi 2015, Table 1 (EMSA, нуклеосома и свободная ДНК LIN28B): Kd(нуклеосома)/Kd(ДНК) — расчёт из измеренных Kd */
    G_OCT4: 1.17 / .92,   /* 1,27 (белок из бактерий) */
    G_SOX2: .39 / .68,    /* 0,57 */
    G_KLF4: 7.21 / 2.26,  /* 3,19; из клеток HEK293: 13,97/1,12 = 12,5 */
    /* Neumann 2009 (smFRET, мононуклеосомы 147 п.н.): доля нуклеосом с развёрнутым концом 13 % → 28 % (шанс ×2,60); внутренний зонд 11 % → 14 % (×1,32) */
    OR_K56_END: (.28 / .72) / (.13 / .87),
    OR_K56_IN: (.14 / .86) / (.11 / .89),
    SHL_K56_IN: 5,        /* допущение: привязка внутреннего зонда Neumann к SHL не проверена по полному тексту */
    /* ДОПУЩЕНИЯ (числа не из источников; на экране — только направление, величины названы «учебная модель») */
    G_DYAD: .5,           /* ТФ с предпочтением оси симметрии (RFX5, SOX; Zhu 2018): сродство у оси выше, чем к свободной ДНК; величина допущена */
    W_DYAD: 1.5,          /* ширина окна около оси в единицах SHL (допущение) */
    PCOV_REM: .05,        /* доля времени, когда нуклеосома закрывает сайт после работы ремоделера (RSC; качественно по Mivelaz 2020) */
    F_H1: .5,             /* линкерный гистон H1: константа раскрытия ×0,5 (направление по Iwasaki 2016, дрозофила; величина допущена) */
    F_POL: 2,             /* poly(dA:dT) рядом: константа раскрытия ×2 (направление по Iyer & Struhl 1995, дрожжи in vivo; величина допущена) */
    F_ME: 3,              /* метилирование CpG: Kd0 ×3 (ТФ, чувствительный к метилированию) или ×1/3 (ТФ, предпочитающий метил-CpG); Yin 2017: только знак зависит от ТФ; величина допущена */
    TAU_FP: 10,           /* с: время пребывания, при котором футпринт виден наполовину (Sung 2014: у ТФ с пребыванием порядка секунд футпринта нет; число допущено) */
    ATAC_BG: .02,         /* фон ATAC-seq (допущение: «нет сигнала» ≠ нулю) */
    LOGC_MIN: -2, LOGC_MAX: 4   /* ось содержания ТФ: 10^-2 … 10^4 единиц Kd0 */
  };
  const g65 = PAR.TAU_FREE / PAR.TAU_MONO_65, g45 = PAR.TAU_FREE / PAR.TAU_MONO_45;
  const K65 = 1 / (g65 - 1), K45 = 1 / (g45 - 1);
  const LAM = Math.log(K65 / K45) / (PAR.SHL_A - PAR.SHL_B);   /* спад ln K на единицу SHL */
  const FIB = PAR.TAU_MONO_65 / PAR.TAU_FIB_65;                 /* 2,74: во столько раз фибрилла сокращает пребывание Rap1 (измерено) */

  /* ТФ: механизм и множитель; kin — кинетика измерена (только Rap1) */
  const TFS = {
    rap1: { mech: 'dissoc', kin: true,  fib: true  },   /* Rap1 (дрожжи): измерено */
    edge: { mech: 'capture', kin: false, fib: true  },  /* ТФ с предпочтением конца (bZIP, bHLH, C2H2; Zhu 2018): модель захвата */
    dyad: { mech: 'dissoc', kin: false, fib: true  },   /* ТФ с предпочтением оси симметрии (RFX5, SOX; Zhu 2018) */
    pion: { mech: 'dissoc', kin: false, fib: false, gfix: PAR.G_OCT4 },   /* пионерный ТФ (Oct4: частичный мотив, Soufi 2015) */
    klf4: { mech: 'dissoc', kin: false, fib: false, gfix: PAR.G_KLF4 }    /* Klf4 (Soufi 2015): хуже связывает нуклеосому */
  };
  const TF_IDS = Object.keys(TFS);

  /* ---------------- положение и константа раскрытия ---------------- */
  const shlOf = u => PAR.SHL_END + (PAR.SHL_DYAD - PAR.SHL_END) * clamp(u, 0, 1);       /* ползунок 0…1 → SHL 7…0 */
  const cOf = u => Math.pow(10, PAR.LOGC_MIN + (PAR.LOGC_MAX - PAR.LOGC_MIN) * clamp(u, 0, 1));   /* ползунок 0…1 → содержание ТФ, ед. Kd0 */
  const bpFrom = shl => (PAR.SHL_END - shl) * 10;        /* расстояние от конца ДНК, п.н. (≈10 п.н. на SHL) */
  const measured = shl => shl >= PAR.SHL_B - 1e-9 && shl <= PAR.SHL_A + 1e-9;   /* SHL 4,5…6,5 — область опытов Rap1; остальное — экстраполяция */
  const Kbase = shl => K65 * Math.exp(-LAM * (PAR.SHL_A - shl));

  /* шанс разворачивания, множитель H3K56ac по положению: у конца 2,60, у SHL 5 — 1,32, глубже SHL 3 — 1 (линейно по ln; привязка допущена) */
  function k56factor(shl){
    const a = Math.log(PAR.OR_K56_END), b = Math.log(PAR.OR_K56_IN);
    if (shl >= PAR.SHL_END) return Math.exp(a);
    if (shl >= PAR.SHL_K56_IN) return Math.exp(b + (a - b) * (shl - PAR.SHL_K56_IN) / (PAR.SHL_END - PAR.SHL_K56_IN));
    if (shl >= 3) return Math.exp(b * (shl - 3) / (PAR.SHL_K56_IN - 3));
    return 1;
  }

  /* ---------------- входы ---------------- */
  /* shl: 0…7; c: содержание ТФ (ед. Kd0, >0); tf: ключ TFS; nfr: сайт в нуклеосомно-свободной области (нет нуклеосомы);
     rem: ремоделер сдвинул нуклеосому (RSC); fib: фибрилла 12×601 вместо мононуклеосомы; ac: 'none' | 'k56' | 'k16';
     pol: poly(dA:dT) рядом; h1: линкерный гистон H1; me: 0 | 1 (метилирование снижает сродство) | -1 (повышает) */
  const DEF = { shl: 6.5, c: 1, tf: 'rap1', nfr: false, rem: false, fib: false, ac: 'none', pol: false, h1: false, me: 0 };
  const norm = inp => Object.assign({}, DEF, inp || {});

  /* ---------------- основной расчёт ---------------- */
  function calc(inp){
    const d = norm(inp), tf = TFS[d.tf];
    const shl = clamp(d.shl, 0, PAR.SHL_END), c = Math.max(d.c, 1e-9);
    /* константа раскрытия с поправками */
    let K = Kbase(shl) * (d.ac === 'k56' ? k56factor(shl) : 1) * (d.h1 ? PAR.F_H1 : 1) * (d.pol ? PAR.F_POL : 1);
    const fopen = K / (1 + K);                                    /* доля времени, когда сайт раскрыт (на нуклеосоме) */
    /* покрытие сайта нуклеосомой */
    const pcov = d.nfr ? 0 : (d.rem ? PAR.PCOV_REM : 1);
    /* множитель нуклеосомы g для мононуклеосомы */
    let g;
    if (tf.gfix) g = tf.gfix;
    else {
      g = 1 + 1 / K;
      if (d.tf === 'dyad'){ const w = Math.exp(-Math.pow(shl / PAR.W_DYAD, 2)); g = g * (1 - w) + PAR.G_DYAD * w; }
      if (d.fib && tf.fib && d.ac !== 'k16') g *= FIB;           /* H4K16ac подавляет фибриллу (Shogren-Knaak 2006, качественно): множитель фибриллы снимается */
    }
    const gEff = pcov * g + (1 - pcov);                           /* смесь «сайт закрыт нуклеосомой / свободен» */
    const kf = d.me === 1 ? PAR.F_ME : d.me === -1 ? 1 / PAR.F_ME : 1;   /* Kd0 с метилированием / Kd0 без */
    const theta = c / (c + kf * gEff);
    const thetaFree = c / (c + kf);
    const thetaRef = c / (c + 1);                                 /* свободная неметилированная ДНК */
    /* кинетика относительно свободной ДНК той же метилированности */
    const kon = tf.mech === 'capture' ? 1 / gEff : 1;
    const tauRel = tf.mech === 'dissoc' ? 1 / gEff : 1;
    const tau = PAR.TAU_FREE * tauRel;                            /* с; осмысленно только для Rap1 (измерено) */
    /* приборы */
    const acc = (1 - pcov) + pcov * fopen;                        /* доступность сайта для зонда (доля времени/клеток) */
    const atac = Math.min(1, acc + PAR.ATAC_BG);                  /* ATAC-seq: вставка Tn5, не занятость */
    const mnase = pcov;                                           /* MNase-seq: доля молекул с нуклеосомой на сайте (защита ~147 п.н.) */
    const fpVis = tau / (tau + PAR.TAU_FP);                       /* видимость футпринта растёт с временем пребывания */
    const fp = theta * fpVis;                                     /* футпринт DNase: нужна и занятость, и долгое пребывание */
    const chip = theta;                                           /* ChIP-seq: усреднённая занятость */
    return { shl, bp: bpFrom(shl), c, K, fopen, pcov, g, gEff, theta, thetaFree, thetaRef, kf,
             kon, tau, tauRel, mech: tf.mech, kin: tf.kin, acc, atac, mnase, fp, fpVis, chip, measured: measured(shl) };
  }

  /* кривая титрования занятости по содержанию ТФ: свободная ДНК и нуклеосомная ДНК */
  function curve(inp, n){
    n = n || 61; const cs = [], free = [], nuc = [];
    for (let i = 0; i < n; i++){
      const c = cOf(i / (n - 1)); cs.push(c);
      free.push(c / (c + 1));
      nuc.push(calc(Object.assign({}, inp, { c })).theta);
    }
    return { c: cs, free, nuc };
  }

  return { PAR, TFS, TF_IDS, DEF, norm, calc, curve, shlOf, cOf, bpFrom, measured, Kbase, k56factor, FIB, LAM, K65, K45 };
})();

/* =====================================================================
   Семинар 5 · Вопрос 2 · АТФ-зависимое ремоделирование нуклеосом · модель M2
   Чистые функции без DOM. Две модели в одном объекте:
   (1) M2.tube — сцена 2b: пробирка, нативный гель, минуты. Одноэкспоненциальный сдвиг нуклеосомы SNF2h из положения у конца ДНК к середине,
       скорость k = kmax·E^h/(KM^h + E^h) (Gamarra 2018). Ручки: содержание фермента E (нМ) и АТФ (нет / есть). Курсор: 0…10 мин (учебная модель).
   (2) M2.cell — сцена 2a: клетки, минуты—часы. Доступность района (ATAC) релаксирует к уровню, который задаёт активность мотора SWI/SNF;
       активность мотора зависит от вмешательства (ингибитор АТФазы, деградер, ингибитор бромодомена, мутант АТФазы), паралога SMARCA2, ARID1A/ARID1B;
       отдельный режим — Polycomb-локус после посадки BAF (PRC1 → H2AK119ub1 → H3K27me3).
   Метки: [И] — число измерено в названной работе (система одна, перенос на другую — допущение); [Р] — расчёт из измеренного;
          [О] — оценка по описанию в работе; [Д] — допущение/подгонка автора модели (источником не подкреплено).
   Таблица «параметр → значение → источник → система → статус» — claims/q2_params.md.
   Единицы: время — минуты (учебная модель); относительные величины — «1 = клетки без воздействия»; доли — 0…1.
   ===================================================================== */
const M2 = (function(){
  const clampU = x => Math.max(0, Math.min(1, x));

  /* ------------------------------------------------------------------ 2b · пробирка */
  const TB = {
    /* [И] Gamarra 2018 (29664398), рис. 1D, подпись: SNF2h человека, нуклеосомы дикого типа 0/60, нативный гель, фермент в избытке над нуклеосомами,
       20 °C, 5 мМ АТФ·MgCl2; подгонка k = kmax·X^h/(KMapp^h + X^h): KMapp = 61 нМ (по концентрации фермента), kmax = 2,5 мин⁻¹, h = 1,5. Только для SNF2h и этих условий. */
    KM: 61, KMAX: 2.5, H: 1.5,
    /* [Д] «Без АТФ — нет сдвига»: мотор АТФ-зависимого ремоделера не работает без АТФ; контроль без АТФ в тексте Gamarra 2018 не читали (A20, Blosser 2009: связывание, трансляция и выход из паузы зависят от АТФ). */
    /* [Д] Остаточная доступность сайта, перекрытого нуклеосомой у конца ДНК (кратковременное раскрытие конца, «дыхание»); порядок — по вопросу 1 (map.md §3); величина подобрана. */
    A0: 0.05,
    /* диапазон ручки «фермент», нМ (учебный; в тексте Gamarra 2018 пример опыта — 1 мкМ SNF2h при 20 нМ нуклеосом); шкала логарифмическая */
    E_MIN: 10, E_MAX: 1000, E_LIST: [10, 20, 30, 60, 100, 200, 300, 500, 1000],   /* сетка ручки «фермент», нМ (9 положений) */
    /* курсор времени, мин (учебная модель) */
    T_MAX: 10,
  };
  const eFromU = u => TB.E_MIN * Math.pow(TB.E_MAX / TB.E_MIN, clampU(u));
  const uFromE = e => Math.log(e / TB.E_MIN) / Math.log(TB.E_MAX / TB.E_MIN);
  /* наблюдаемая константа скорости сдвига, мин⁻¹ */
  function kObs(E, atp){
    if (!atp || E <= 0) return 0;
    const a = Math.pow(E, TB.H);
    return TB.KMAX * a / (Math.pow(TB.KM, TB.H) + a);
  }
  /* состояние пробирки: shifted — доля сдвинутых нуклеосом (гель), open — доля копий с доступным сайтом, tHalf — период полупревращения (мин) = ln2/k (расчёт); null — нет сдвига */
  function tube(o, t){
    const E = o.E, atp = o.atp ? 1 : 0, k = kObs(E, atp);
    const shifted = 1 - Math.exp(-k * t);
    const open = TB.A0 + (1 - TB.A0) * shifted;
    return { E, atp, t, k, shifted, open, tHalf: k > 0 ? Math.LN2 / k : null, bound: E / (E + TB.KM) /* доля связанного фермента — только иллюстрация насыщения, не показание */ };
  }
  const TUBE_REF = { E: 100, atp: 1 };

  /* ------------------------------------------------------------------ 2a · клетки */
  const CP = {
    /* Относительная доступность района, который поддерживается работой мотора: da/dt = (a* − a)/τ, a* = FLOOR + (1 − FLOOR)·M·A, M — активность мотора (0…1), A — вклад ARID.
       [Д] FLOOR = 0,1 — остаточная доступность без мотора: в Schick 2021 (HAP1) при острой потере обоих АТФаз доступность на BAF-зависимых районах почти полностью теряется — «почти», число не измерено. */
    FLOOR: 0.10,
    /* [Д] Два класса районов с разной скоростью (Schick 2021: кластеры II–V теряют доступность с разной скоростью; Iurlaro 2021: потеря за 10–60 мин, возврат за 15–60 мин после отмывки — измерены времена проб, константы не выведены).
       τ = 10 мин (быстрые) и 40 мин (медленные) подобраны в пределах этого интервала; возврат принят с теми же τ (допущение); доли классов поровну (число районов по классам не использовано). */
    TAU_F: 10, TAU_S: 40, W_F: 0.5,
    /* [Д] Ингибитор АТФазы (BRM014) действует на мотор мгновенно в масштабе опыта: проникновение и связывание много короче минимальной пробы 5 мин (Schick 2021, HAP1, 1 мкМ; Iurlaro 2021, mESC, 10 мкМ). */
    /* [Р] Деградация: P(t) = exp(−t/τ_дег). dTAG47 (SMARCA4-dTAG, HAP1): «почти полная потеря за 2–3 ч» (Schick 2021, [И]); принято 95 % потери за 2,5 ч → τ = 2,5 ч / ln 20 ≈ 50 мин.
       [Д] ACBI1: «за несколько часов» (Schick 2021, 3 мкМ; DC50 за 18 ч — Farnaby 2019, MV-4-11) — принят тот же τ; различие деградеров по скорости не моделируется. */
    TAU_DEG: 50,
    /* [Д] Доля работы мотора на BAF-зависимом районе, которую несёт SMARCA4 при наличии SMARCA2: S4 = 0,7; остальное — SMARCA2 (паралог частично замещает: Schick 2021 — при острой потере только SMARCA4 доступность падает в большинстве районов; число не измерено).
       Без SMARCA2 (нокаут паралога) всю работу несёт SMARCA4 (A10: «почти полная потеря» при острой потере в фоне без паралога). */
    S4: 0.7,
    /* [Д] Мутант АТФазы SMARCA4 (доминантно-негативный, гетерозиготно; Hodges 2018, mESC: тысячи районов теряют доступность): доля потери активности мотора DN = 0,5 (не измерена); состояние хроническое (с t = 0). */
    DN: 0.5,
    /* [Д] Хроническая потеря ARID1A / ARID1A + ARID1B: множитель A вклада мотора в доступность энхансерных районов; ARID1B частично замещает (Kelso 2017; Mathur 2017 — по рефератам); числа не измерены.
       В Trizzino 2018 (OCCC человека) потеря ARID1A мало меняет доступность, но нарушает паузирование Pol II — в модель не входит. */
    ARID: { none: 1, a1a: 0.8, both: 0.4 },
    /* Новосинтезированная РНК (PRO-seq): следует за доступностью слабо и с запаздыванием. [Д] G_RNA = 0,2 (чувствительность), TAU_R = 30 мин: качественно по Schick 2021 (PRO-seq через 10–60 мин BRM014 меняется слабо, изменения следуют за доступностью)
       и Hodges 2018 (при тысячах районов 49 генов вверх и 191 вниз). */
    G_RNA: 0.2, TAU_R: 30,
    /* [Д] ChIP эндогенного SMARCA2: BRM014 снижает долю BAF на хроматине по IP (Schick 2021, доп. рис. 5b, качественно) — множитель 0,7; PFI-3 не вытесняет эндогенный SMARCA2 (Vangamudi 2015, реферат) — 1. */
    CHIP_BRM: 0.7,
    /* курсор времени, мин (учебная модель): 0…360 */
    T_MAX: 360,
    /* Polycomb-локус после посадки BAF (Kadoch 2017, MEF, рапамицин 3 нМ): [И] задержка посадки ≈ 2 мин; PRC1 уходит раньше PRC2, H2AK119ub1 исчезает раньше H3K27me3, доступность следует за снятием меток;
       общий H3, H2A.Z и H3K9me3 за первый час не меняются. [Д] константы: τ посадки 1 мин, τ ухода PRC1 8 мин, τ потери ub1 15 мин после ухода PRC1, τ потери me3 60 мин после потери ub1; порядок событий измерен, величины подобраны. */
    PC: { LAG: 2, TAU_B: 1, TAU_P1: 8, TAU_UB: 15, TAU_ME3: 60, A_LOW: 0.1 },
  };

  const DEF = { ivn: 'none', par: 1, arid: 'none', wash: null, loc: 'enh' };
  const IVN = ['none', 'brm', 'acbi', 'dtag', 'pfi', 'mut'];
  const norm = o => Object.assign({}, DEF, o || {});
  const P = (t) => Math.exp(-t / CP.TAU_DEG);

  /* доля работы мотора, которую несёт SMARCA4 */
  const s4 = o => (o.par ? CP.S4 : 1);
  /* активность мотора M(t) ∈ [0, 1] при вмешательстве; wash — момент отмывки ингибитора, мин (null — нет) */
  function motor(o, t){
    switch (o.ivn){
      case 'brm': return (o.wash != null && t >= o.wash) ? 1 : 0;
      case 'acbi': return P(t);
      case 'dtag': return s4(o) * P(t) + (1 - s4(o));
      case 'mut': return 1 - CP.DN;
      default: return 1;                       /* none, pfi: мотор не затронут */
    }
  }
  const target = (M, o) => CP.FLOOR + (1 - CP.FLOOR) * M * CP.ARID[o.arid];
  const rnaTarget = a => 1 - CP.G_RNA * (1 - a);

  /* траектория [aF, aS, r] на 0…T_MAX с шагом 1 мин (Traj из stress.js; RK4, два подшага) */
  function cellTraj(opts){
    const o = norm(opts);
    const M0 = o.ivn === 'mut' ? 1 - CP.DN : 1;
    const a0 = target(M0, o), r0 = rnaTarget(a0);
    const f = (t, y) => {
      const a = target(motor(o, t), o);
      const aMean = CP.W_F * y[0] + (1 - CP.W_F) * y[1];
      return [(a - y[0]) / CP.TAU_F, (a - y[1]) / CP.TAU_S, (rnaTarget(aMean) - y[2]) / CP.TAU_R];
    };
    return new Traj(f, [a0, a0, r0], CP.T_MAX, 1, 2);
  }
  const trajCache = new Map();
  function traj(opts){
    const o = norm(opts), key = JSON.stringify([o.ivn, o.par, o.arid, o.wash]);
    if (!trajCache.has(key)){ if (trajCache.size > 64) trajCache.clear(); trajCache.set(key, cellTraj(o)); }
    return trajCache.get(key);
  }

  /* Polycomb-локус: [PRC1, ub1, me3, доступность]. Мотор в этом режиме: у мутанта без АТФазы рекрутируемый SMARCA4 лишён АТФазы, мотор = 0 [Д] (Stanton 2017, реферат: АТФазные мутации нарушают вытеснение PRC1);
     BRM014 — 0 пока не отмыт [О]: вытеснение зависит от АТФ (Stanton 2017), прямого опыта с BRM014 на этом локусе нет; PFI-3 — не влияет [Д]. Остальное как в motor(). */
  const pcMotor = (o, t) => (o.ivn === 'mut' ? 0 : motor(o, t));
  function pcTraj(opts){
    const o = norm(opts), Q = CP.PC;
    const f = (t, y) => {
      const B = t < Q.LAG ? 0 : 1 - Math.exp(-(t - Q.LAG) / Q.TAU_B);
      const m = pcMotor(o, t);
      const x1 = y[0], u = y[1], me = y[2];
      return [-B * m * x1 / Q.TAU_P1, -(1 - x1) * u / Q.TAU_UB, -(1 - u) * me / Q.TAU_ME3, 0];
    };
    return new Traj(f, [1, 1, 1, 0], 360, 0.5, 2);
  }
  const pcCache = new Map();
  function pcTr(opts){
    const o = norm(opts), key = JSON.stringify([o.ivn, o.par, o.wash]);
    if (!pcCache.has(key)){ if (pcCache.size > 32) pcCache.clear(); pcCache.set(key, pcTraj(o)); }
    return pcCache.get(key);
  }

  /* состояние клетки на курсоре t (мин). Все относительные величины: 1 = клетки без воздействия (дикий тип, A = 1) */
  function cell(opts, t){
    const o = norm(opts);
    if (o.loc === 'pc'){
      const y = pcTr(o).at(t), Q = CP.PC;
      return { o, t, loc: 'pc', prc1: y[0], ub1: y[1], me3: y[2], h3: 1,
               acc: Q.A_LOW + (1 - Q.A_LOW) * (1 - y[1]), motor: pcMotor(o, t) };
    }
    const y = traj(o).at(t), M = motor(o, t);
    const aF = y[0], aS = y[1], atac = CP.W_F * aF + (1 - CP.W_F) * aS;
    const deg4 = (o.ivn === 'acbi' || o.ivn === 'dtag') ? P(t) : 1;
    const deg2 = !o.par ? null : (o.ivn === 'acbi' ? P(t) : 1);               /* null — SMARCA2 отсутствует (нокаут) */
    const chip2 = !o.par ? null : (o.ivn === 'brm' && !(o.wash != null && t >= o.wash) ? CP.CHIP_BRM : (o.ivn === 'acbi' ? P(t) : 1));
    return { o, t, loc: 'enh', motor: M, aF, aS, atac, rna: y[2], s4: deg4, s2: deg2, chip2 };
  }
  const CELL_REF = o => Object.assign({}, norm(o), { ivn: 'none', wash: null });   /* контроль: те же ручки без воздействия */

  /* ---------- уровни показаний для подписей (классификация по числу, которое видно на экране, как fX) ---------- */
  const disp = x => (x >= 10 ? Math.round(x) : x >= 1 ? +x.toFixed(1) : +x.toFixed(2));
  /* доступность ATAC относительно исходной: «исходная» ≥ 0,9; «снижена» 0,5…0,89; «сильно снижена» 0,25…0,49; «почти потеряна» < 0,25 */
  function accLevel(x){
    const d = disp(x);
    return d >= 0.9 ? 'ref' : d >= 0.5 ? 'dn' : d >= 0.25 ? 'lo' : 'bg';
  }
  const shiftLevel = x => { const d = Math.round(x * 100); return d >= 80 ? 'hi' : d >= 40 ? 'mid' : d >= 10 ? 'lo' : 'none'; };

  /* ---------- шаги сценария: pre — условия до, apply — одно изменение, t — курсор (мин, учебная модель), ok — номер верного варианта в таблице текстов (0…2) ---------- */
  const STEPS = {
    '2b': [
      { pre: { E: 300, atp: 0, t: 1 }, apply: { atp: 1 }, ok: 1 },
      { pre: { E: 30, atp: 1, t: 1 }, apply: { E: 300 }, ok: 2 },
      { pre: { E: 300, atp: 1, t: 1 }, apply: { E: 1000 }, ok: 0 },
    ],
    '2a': [
      { pre: { t: 60 }, apply: { ivn: 'brm' }, ok: 0 },
      { pre: { t: 60 }, apply: { ivn: 'pfi' }, ok: 1 },
      { pre: { t: 360, ivn: 'none' }, apply: { ivn: 'dtag' }, ok: 2 },
      { pre: { t: 360, ivn: 'dtag' }, apply: { par: 0 }, ok: 1 },
      { pre: { t: 30, loc: 'pc' }, apply: { ivn: 'mut' }, ok: 2 },
      { pre: { t: 30, ivn: 'acbi' }, apply: { ivn: 'brm' }, ok: 0 },
      { pre: { t: 120, ivn: 'brm', wash: null }, apply: { wash: 60 }, ok: 2 },
      { myst: true, ok: 1 },
    ],
  };
  /* загадка: основа — HAP1 с SMARCA2, курсор 60 мин; образцы X, Y, Z получены тремя разными воздействиями (порядок не совпадает с порядком вариантов ответа) */
  const MYST = { t: 60, samples: [['X', 'brm', { ivn: 'brm' }], ['Y', 'acbi', { ivn: 'acbi' }], ['Z', 'pfi', { ivn: 'pfi' }]] };

  return { TB, CP, DEF, IVN, norm, eFromU, uFromE, kObs, tube, TUBE_REF, motor, cell, traj, CELL_REF, disp, accLevel, shiftLevel, STEPS, MYST, P };
})();

/* =====================================================================
   Вопрос 3. Модель метки H3K27: писатель — стиратель — ридер (M3). Чистые функции, без DOM.
   Загружается в Node через tests/lib.mjs: loadModel(['m3.js'], ['M3']).

   Что считает модель.
   БАЗА (3b): одна метка на остатке, две доли нуклеосом (без метки / с меткой), M — доля нуклеосом с меткой:
       dM/dt = kw·W·(1 − M) − ke·E·M;   M* = kw·W/(kw·W + ke·E);   τ = 1/(kw·W + ke·E);   ридер R = M^n/(K^n + M^n).
   ПРОДВИНУТЫЙ (3a): один остаток H3K27 на одной копии гистона, три несовместимых состояния: u (без метки), a (ацетил), m (триметил).
   Цепь u ⇄ a и u ⇄ m: прямой переход a ⇄ m невозможен (занят один и тот же лизин), поэтому метилирование идёт через u.
       du/dt = −(kA + kM(m))·u + dA·a + dM·m;  da/dt = kA·u − dA·a;  dm/dt = kM(m)·u − dM·m;  u + a + m = 1.
   Обратная связь «ридер → писатель»: kM(m) = KM·W_M·(1 + (FB − 1)·R_m(m)) (EED узнаёт метку и активирует PRC2; Margueron 2009).
   Время — минуты (учебная модель). Значения констант помечены: [И] измерено в работе; [Р] рассчитано из измеренного;
   [Д] допущение или подгонка (в справке «Что упрощено»). Тип показаний: доли — %, остальное — условный индекс (1 = исходное).
   Решение интегрируется неявным шагом Эйлера на геометрической сетке времени (устойчив при любом шаге; сумма долей = 1).
   ===================================================================== */
const M3 = (function(){
  /* ---------- база (3b): ацетилирование как быстрая метка ---------- */
  const B_KW = 0.1;      /* ставит метку, мин⁻¹ при W = 1 [Д]; порядок минут: возврат ацетилирования 1,5 мин и деацетилирования 5–8 мин (Katan-Khaykovich 2002, дрожжи, по реферату) */
  const B_KE = 0.1;      /* снимает метку, мин⁻¹ при E = 1 [Д]; при W = E = 1 доля меченых 50 % (удобный эталон) */
  const B_K = 0.5;       /* порог ридера (доля меченых нуклеосом) [Д]: Kd ридеров к нуклеосомам не найден (claims/q3.md B) */
  const B_N = 3;         /* кооперативность ридера [Д]: близкие ацетил-лизины связываются заметно сильнее одиночного (Filippakopoulos 2012) */

  /* ---------- продвинутый (3a) ---------- */
  const KA = 0.02;       /* HAT (p300/CBP): u → a, мин⁻¹ [Д] */
  const DA = 0.12;       /* HDAC: a → u, мин⁻¹ [Д]; τ_ac = 1/(KA + DA) ≈ 7 мин — порядок «минуты» (Katan-Khaykovich 2002, дрожжи) */
  const KM = 0.0005;     /* PRC2: u → m, мин⁻¹ при R_m = 0 [Д] */
  const DM = 0.0015;     /* KDM6: m → u, мин⁻¹ [Д]; τ_me порядка 10 ч: «часы» (Hathaway 2012: ≈6–8 ч на шаг, H3K9me3, мышь — порядок, не перенос) */
  const FB_MAX = 7;      /* максимум обратной связи, кратность [И] ×7 при насыщении пептидом (Margueron 2009, in vitro) */
  const FB0 = 3;         /* исходная сила обратной связи в клетке [Д] (между 1 и 7) */
  const KHM = 0.3;       /* порог ридера EED по доле метки [Д] */
  const NHM = 2;         /* кооперативность ридера EED [Д]; бистабильность требует n ≥ 2–3 и дальнего действия (Dodd 2007) */
  const KHA = 0.1;       /* порог ридера BRD4 по доле ацетил-нуклеосом [Д] */
  const NHA = 3;         /* кооперативность BRD4 [Д] */
  const KCOF = 1;        /* K_m кофактора в единицах нормальной концентрации [Д]: числа Km не найдены; 1 = эластичность ½ */
  const KALPHA = 1;      /* то же для α-КГ [Д] */
  const Q_C = 0.04;      /* K27M: форма насыщения s(q) — общая с вопросом 4 (m4.js k27m): s = (1 − e^(−q/Q_C))/(1 − e^(−Q_MAX/Q_C)) [согласовано с координатором] */
  const Q_MAX = 0.17;
  const GL = 0.5;        /* K27M: локальный рост H3K27me3 = 1 + GL·s(q) [Д]; ×1,5 при q = 0,17 — по согласованию с вопросом 4; направление — Chan 2013, величина не измерена */
  const CROSS = 4;       /* активные метки (H3K4me3, H3K36me2/3) тормозят PRC2: 1/(1 + CROSS·act) [Д]; направление — Schmitges 2011, in vitro */
  const TAU_RNA = 20;    /* запаздывание РНК за приводом, мин [Д]: числа нет */
  const S_K9 = 1;        /* SAHA: рост общего ацетилирования (K9ac как контрольная метка) = 1 + S_K9·s/(1 + s), s = доза/Ki [Д]; направление — Richon 1998 (H4) */
  const G_RNA = 1;       /* репрессия РНК меткой me3: g = 1/(1 + G_RNA·m) [Д] */

  const DEF = { WA: 1, EA: 1, WM: 1, EM: 1, cAc: 1, cSAM: 1, aKG: 1, fb: FB0, act: 0, q: 0,
                a485: 0, saha: 0, jq1: 0, taz: 0, gsk: 0, hg: 0 };
  /* все дозы препаратов — в единицах эффективной Ki (1 = половинное действие): Ki в клетке не равна Ki in vitro (Filippakopoulos 2010: Kd 50–90 нМ, в клетках 500 нМ) */
  function norm(o){ return Object.assign({}, DEF, o || {}); }
  const sQ = q => (1 - Math.exp(-Math.max(q, 0) / Q_C)) / (1 - Math.exp(-Q_MAX / Q_C));
  const hill = (x, K, n) => { const a = Math.pow(Math.max(x, 0), n); return a / (Math.pow(K, n) + a); };

  /* ---------- база ---------- */
  function basic(W, E){
    const kw = B_KW * W, ke = B_KE * E, s = kw + ke;
    const Mst = s > 0 ? kw / s : 0.5;                  /* при W = E = 0 состояние не меняется: эталон 50 % */
    return { Mst, tau: s > 0 ? 1 / s : Infinity, R: hill(Mst, B_K, B_N), rate: s };
  }
  /* M(t) из состояния при W = E = 1 (M0 = 50 %) после изменения активностей в момент 0 */

    return Math.sqrt(lo * hi);
  }

  return {
    sQ, DEF, B_KW, B_KE, B_K, B_N, KA, DA, KM, DM, FB_MAX, FB0, KHM, NHM, KHA, NHA, KCOF, trap, Q_MAX, GL, CROSS, TAU_RNA, S_K9, G_RNA, T_SS,

      if (s.loc === 'gene' || s.loc === 'tel') h += mm(t('s4_r_par'), v.P, r.P, fPct(v.P)) + mm(t('s4_r_h33'), v.B, r.B, fPct(v.B)) + mm(t('s4_r_h31'), v.A, r.A, fPct(v.A));
      if (s.loc === 'cen') h += mm(t('s4a_r_cen'), v.cen.total / M.N_CENPA, r.cen.total / M.N_CENPA, fN(v.cen.total)) + mm(t('s4a_r_cold'), v.cen.old / M.N_CENPA, r.cen.old / M.N_CENPA, fN(v.cen.old));
      if (s.loc === 'dsb'){ h += mm(t('s4a_r_gh'), v.g.frac / .04, r.g.frac / .04, fPct(v.g.frac)) + mm(t('s4a_r_br'), v.breaks / 140, r.breaks / 140, fN(v.breaks)); if (s.iv === 'rs') h += mm(t('s4a_r_rs'), v.g.rs, r.g.rs, f2(v.g.rs)); }
      h += mm(t('s4a_r_me3'), v.k.global, r.k.global, f2(v.k.global));
      return h;
    }
    /* подпись по величинам на экране */
    function caption(s, v, r){
      const vars = { n: s.n, p: s.loc === 'cen' || s.loc === 'dsb' ? '' : fPct(v.P), d: fD(M.dil(s.n)), h33: fPct(v.B || 0), h33r: fPct(r.B || 0), cen: v.cen ? fN(v.cen.total) : '', cold: v.cen ? fN(v.cen.old) : '', g: v.g ? fPct(v.g.frac) : '', gr: r.g ? fPct(r.g.frac) : '', rs: v.g ? f2(v.g.rs) : '', me3: f2(v.k.global), q: Math.round(s.q * 100), pr: fPct(r.P || 0), a: fPct(v.A || 0) };
      let key;
      if (s.iv === 'k27m') key = 'k27';
      else if (s.loc === 'cen') key = s.iv === 'hjurp' ? 'cen_no' : s.n === 0 ? 'cen_0' : 'cen';
      else if (s.loc === 'dsb') key = s.iv === 'kin' ? 'dsb_kin' : s.iv === 'pp2a' ? 'dsb_pp2a' : s.iv === 'rs' ? 'dsb_rs' : s.D === 0 ? 'dsb_0' : 'dsb';
      else if (s.iv === 'hira' || s.iv === 'atrx') key = 'loss_' + s.loc;
      else if (s.iv === 'rep') key = 'norep';
      else key = s.n === 0 ? 'n0' : 'cmp_' + capKey(v, s.n);
      const k4 = key.startsWith('cmp_') || key === 'n0' ? 's4b_c_' + key.replace('cmp_', '') : 's4a_c_' + key;
      $('cap' + K).textContent = t(k4, vars); $('why' + K).textContent = t(k4 + '_z', vars);
    }
    function plotPart(s, v){
      const ser = (data, color, w, dash) => ({ color, w: w || 3, dash, data }), pc = y => Math.round(y * 100) + NB + '%'; let ttl, series, o, rows = [];
      const sRef = base(s);
      if (s.inst === 'wb'){
        ttl = 's4a_pl_me3'; const d = []; for (let q = 0; q <= 17; q++) d.push([q, M.k27m(q / 100).global]);
        series = [ser(d, '--mtor', 3.4)]; o = { xmax: 17, xstep: 4, xunit: '%', ymax: 1, yticks: [0, .5, 1], yfmt: y => f2(y), cursor: s.iv === 'k27m' ? s.q * 100 : 0 };
        rows = [[t('s4a_r_me3'), f2(M.k27m(s.q).global), f2(M.k27m(.17).global)]]; o.cols = ['s4a_tb_q', s.q * 100, 17];
      } else if (s.inst === 'snap' && s.loc === 'cen'){
        ttl = 's4a_pl_cen'; const a = [], b = [], c = []; for (let n = 0; n <= 6; n++){ a.push([n, M.cenpa({ N: n, hjurp: 1, phase: s.phase }).total]); b.push([n, M.cenpa({ N: n, hjurp: 0, phase: s.phase }).total]); c.push([n, M.cenpa({ N: n, hjurp: s.iv === 'hjurp' ? 0 : 1, phase: s.phase }).old]); }
        series = [ser(a, '--on-line'), ser(b, '--mtor', 3, [6, 4]), ser(c, '--ink', 2.2, [2, 3])]; o = { xmax: 6, xstep: 1, xunit: t('s4_unit_n'), ymax: 400, yticks: [0, 200, 400], yfmt: y => fN(y), cursor: s.n };
      } else if (s.inst === 'if' && s.loc === 'dsb'){
        ttl = 's4a_pl_gh'; const a = [], b = []; for (let m = 0; m <= 30; m++){ a.push([m, M.gh2ax(Object.assign({}, v.s, { D: s.D, tmin: m, atm: s.iv === 'kin' ? 0 : 1, dnapk: s.iv === 'kin' ? 0 : 1, pp2a: s.iv === 'pp2a' ? 0 : 1, rs: 0 })).frac]); b.push([m, M.gh2ax({ D: s.D, tmin: m, u: 0 }).frac]); }
        series = [ser(a, '--on-line'), ser(b, '--ink', 2.2, [6, 4])]; o = { xmax: 30, xstep: 5, xunit: t('s4a_unit_min'), ymax: .04, yticks: [0, .02, .04], yfmt: pc, cursor: s.tmin };
      } else {
        const c = v.c, c0 = M.comp({ kind: s.loc === 'tel' ? 'tel' : 'gene', act: s.loc === 'tel' ? 0 : s.act }), dil = c.P.map((_, i) => [i, M.dil(i)]);
        const zip = arr => arr.map((y, i) => [i, y]);
        if (s.inst === 'silac'){ ttl = 's4a_pl_p'; series = [ser(zip(c.P), '--mtor', 3.4), ser(zip(c0.P), '--ink', 2.2, [2, 3]), ser(dil, '--ink', 2.2, [6, 4])]; }
        else { ttl = 's4a_pl_b'; series = [ser(zip(c.B), '--on-line', 3.4), ser(zip(c0.B), '--ink', 2.2, [6, 4])]; }
        o = { xmax: 6, xstep: 1, xunit: t('s4_unit_n'), ymax: 1, yticks: [0, .5, 1], yfmt: pc, cursor: s.n };
      }
      $(P + 'pt').textContent = t(ttl);
      plotLines($(P + 'cv'), series, o);
      $(P + 'tbl').innerHTML = `<p class="hint">${t(ttl + '_n')}${ttl === 's4a_pl_gh' && !s.u ? ' ' + t('s4a_pl_gh_u0') : ''}</p>`;
    }
    function mystPart(){
      const box = $(P + 'mysbox'); box.hidden = !myst; if (!myst){ box.innerHTML = ''; return; }
      const rows = [{ n: t('s4a_tb_ctl'), r: M.mystRow({ iv: 'none' }) }].concat(M.MYST.map(m => ({ n: m.n, r: M.mystRow(m), iv: m.iv })));
      box.innerHTML = `<p class="plotcap">${t('s4a_myst_tt')}</p><table class="s4-tbl"><caption class="sr-only">${t('s4a_myst_tt')}</caption><thead><tr><th scope="col">${t('s4a_tb_sample')}</th><th scope="col">${t('s4a_tb_gene')}</th><th scope="col">${t('s4a_tb_tel')}</th><th scope="col">${t('s4a_tb_me3')}</th></tr></thead><tbody>` +
        rows.map((x, i) => `<tr><th scope="row">${x.n}${myst > 1 && x.iv ? ' — ' + ivName(x.iv) : ''}</th><td class="num">${fPct(x.r.gene)}</td><td class="num">${fPct(x.r.tel)}</td><td class="num">${f2(x.r.me3)}</td></tr>`).join('') + `</tbody></table><p class="hint">${t('s4a_myst_note')}</p>`;
    }
    function update(){
      let s = stateNow(); const inM = myst > 0;
      /* допустимые вмешательства и приборы для локуса */
      $(P + 'iv').querySelectorAll('button').forEach(b => { b.disabled = inM || !IV_OK[s.loc].includes(b.dataset.v); });
      $(P + 'inst').querySelectorAll('button').forEach(b => { b.disabled = inM || !INST_OK[s.loc].includes(b.dataset.v); });
      if (!IV_OK[s.loc].includes(s.iv)){ segSet(P + 'iv', 'none'); s.iv = 'none'; }
      if (!INST_OK[s.loc].includes(s.inst)){ segSet(P + 'inst', INST_OK[s.loc][0]); s.inst = INST_OK[s.loc][0]; }
      const gc = s.loc === 'gene' || s.loc === 'tel';
      const show = (id, on) => { const e = $(P + id); if (e) e.hidden = !on; };
      show('nW', s.loc !== 'dsb'); show('txW', s.loc === 'gene'); show('phW', s.loc === 'cen'); show('qW', s.iv === 'k27m'); show('DW', s.loc === 'dsb'); show('tmW', s.loc === 'dsb'); show('uW', s.loc === 'dsb');
      $('ctrl' + K).querySelectorAll('input,.seg button,.btn').forEach(e => { if (inM && !FREE.has(e.id)) e.disabled = true; else if (!inM && e.tagName === 'INPUT') e.disabled = false; });
      $(P + 'myst').textContent = t('s4a_myst_b' + myst);
      const lab = $(P + 'nW').querySelector('label'); lab.textContent = t(s.iv === 'rep' ? 's4a_n_c_rep' : s.loc === 'cen' ? 's4a_n_c_cen' : 's4a_n_c');
      $(P + 'nO').textContent = s.n; $(P + 'qO').textContent = fN(s.q * 100) + NB + '%'; $(P + 'DO').textContent = fmt(s.D, 1) + NB + 'Гр'; $(P + 'tmO').textContent = s.tmin + NB + 'мин'; $(P + 'uO').textContent = fmt(s.u, 1);
      $(P + 'body').style.visibility = inM ? 'hidden' : 'visible'; $(P + 'ov').hidden = !inM; $('sc' + K).classList.toggle('s4-myst', inM);
      $(P + 'now').hidden = inM; $(P + 'pt').hidden = inM; $(P + 'cv').hidden = inM; $(P + 'tbl').hidden = inM;
      if (inM){ mystPart(); $('cap' + K).textContent = t(myst > 1 ? 's4a_c_myst2' : 's4a_c_myst'); $('why' + K).textContent = t(myst > 1 ? 's4a_c_myst2_z' : 's4a_c_myst_z'); return; }
      mystPart();
      const v = M.view(s), r = M.view(base(s));
      $(P + 'comp').setAttribute('display', gc ? 'inline' : 'none'); $(P + 'cen').setAttribute('display', s.loc === 'cen' ? 'inline' : 'none'); $(P + 'dsb').setAttribute('display', s.loc === 'dsb' ? 'inline' : 'none');
      if (gc) paintComp(s); if (s.loc === 'cen') paintCen(s, v); if (s.loc === 'dsb') paintDsb(s, v);
      $(P + 'now').innerHTML = `<div class="mgrid">${readsHtml(s, v, r)}</div><p class="hint">${t('s4a_ref')}</p>`;
      caption(s, v, r); plotPart(s, v);
    }
    wire([P + 'loc', P + 'iv', P + 'n', P + 'tx', P + 'ph', P + 'q', P + 'D', P + 'tm', P + 'u', P + 'inst'], update);
    $(P + 'iv').addEventListener('click', () => { if (segVal(P + 'iv') === 'k27m' && rv('q') === 0) $(P + 'q').value = 10; });
    $(P + 'reset').onclick = () => { st({}); update(); };
    $(P + 'myst').onclick = () => { myst = (myst + 1) % 3; update(); };
    $(P + 'how').onclick = () => showInfo(K, 'v_measure'); $(P + 'lim').onclick = () => showInfo(K, 'v_model');
    st({});
    const S = M.STEPS4A, pre = i => S[i].pre, app = i => Object.assign({}, S[i].pre, S[i].apply), q = (i, o) => Object.assign({ iv: 'none' }, o);
    const step = (ok, i, m) => ({ n: 3, ok, pre(){ st(Object.assign({}, DEFS, { q: 0 }, pre(i))); }, apply(){ st(Object.assign({}, DEFS, { q: 0 }, app(i))); }, m, ctl(){ st(Object.assign({}, DEFS, { q: 0 }, pre(i))); }, ctlH: 's4b_ctl', when: 's4a_when' });
    const B3 = ['s4_r_h33', 's4_r_par', 's4_r_h31'];
    SCENES[K] = { update, redraw: update, poe: [
      step(2, 0, B3), step(0, 1, B3), step(1, 2, ['s4_r_par', 's4_r_h31', 's4a_r_me3']), step(2, 3, ['s4a_r_cen', 's4a_r_cold', 's4a_r_me3']),
      step(0, 4, ['s4a_r_gh', 's4a_r_br', 's4a_r_me3']), step(1, 5, ['s4a_r_gh', 's4a_r_br', 's4a_r_me3']), step(0, 6, ['s4a_r_me3', 's4_r_h33', 's4_r_par']),
      { n: 3, ok: 1, pre(){ st({ myst: 1 }); }, apply(){ st({ myst: 2 }); }, m: [], when: 's4a_when_m' }
    ], vals: {} };
    update();
  })();
})();

/* Заглушки для сцен, которые ещё не построены (вопрос в работе): без подписи, вывода и показаний. Выполняется после s1…s4. */
['1b','1a','2b','2a','3b','3a','4b','4a'].forEach(k => {
  if (SCENES[k]) return;
  const sec = layout(k); sec.classList.add('wip');
  $('cap' + k).textContent = t('ph_wip', { n: k[0] });
  SCENES[k] = { update(){}, poe: [] };
});

/* ---------- запуск ---------- */
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
document.title = t('doc_title');
/* версия на странице: по ней видно, что сохранённая копия устарела */
document.querySelectorAll('.foot').forEach(f => { f.textContent = t('footer') + ' ' + t('version'); });
/* студенческий вариант: без советов преподавателю, остаются только источники */
if (STUDENT){ const d = document.querySelector('details.teacher'); if (d){ d.querySelectorAll('p').forEach(x => x.remove()); d.querySelector('summary').textContent = t('src_t_st'); } }
/* подпись кафедры под каждой схемой: остаётся на любом снимке экрана */
document.querySelectorAll('.stage svg').forEach(svg => {
  svg.setAttribute('viewBox', '0 0 600 440');
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', '0'); r.setAttribute('y', '420'); r.setAttribute('width', '600'); r.setAttribute('height', '20'); r.setAttribute('fill', 'var(--surface)');
  svg.appendChild(r);
  const w = document.createElementNS(NS, 'text');
  w.setAttribute('class', 'wm'); w.setAttribute('x', '594'); w.setAttribute('y', '430'); w.textContent = t('wm');
  svg.appendChild(w);
});
/* дополнительные строки легенды: их добавляют сцены (LEGEND_EXTRA в stress.js) */
LEGEND_EXTRA.forEach(it => { const lg = document.getElementById('lgBox'); if (lg) lg.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 64 30">${it.svg}</svg><span>${t(it.key)}</span>`); });
/* v2.0 (аудит, A02): объект схемы с нулевой прозрачностью не остаётся в клавиатурном маршруте и в дереве доступности;
   при показе возвращается с прежним tabindex. Следим за изменениями opacity/style/tabindex на каждой схеме; обработчик выполняется до следующего нажатия клавиши. */
document.querySelectorAll('.stage svg').forEach(svg => {
  const eff = e => { let o = 1; for (let n = e; n && n !== svg.parentNode; n = n.parentNode){ if (n.nodeType !== 1) break; const v = n.style.opacity !== '' ? n.style.opacity : n.getAttribute('opacity'); if (v !== null && v !== '') o *= parseFloat(v); } return o; };
  const sync = () => {
    svg.querySelectorAll('[tabindex]').forEach(e => {
      if (eff(e) < .05){
        if (e.getAttribute('tabindex') !== '-1'){ e.dataset.ti = e.getAttribute('tabindex'); e.setAttribute('tabindex', '-1'); }
        e.setAttribute('aria-hidden', 'true'); e.dataset.fh = '1';
      } else if (e.dataset.fh){
        delete e.dataset.fh; e.removeAttribute('aria-hidden');
        if (e.dataset.ti){ if (e.getAttribute('tabindex') === '-1') e.setAttribute('tabindex', e.dataset.ti); delete e.dataset.ti; }
      }
    });
    obs.takeRecords();
  };
  const obs = new MutationObserver(sync);
  obs.observe(svg, { subtree: true, attributes: true, attributeFilter: ['opacity', 'style', 'tabindex'] });
  sync();
});
initNav(); show();
