<title>Семинар 3 · Рецепция и молекулярные переключатели — Кафедра биологии и генетики, Медицинский университет Петровского · 3.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Проекционный стол: слева большая схема, справа управление, подпись к текущему состоянию и вывод.
   Один визуальный язык во всех сценах: жёлтый — активен, «P» — фосфорилирован, пунктир с крестом — белка нет,
   стрелка — активирует, линия с поперечиной — тормозит. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6676; --line:#D3DAE3;
  --cyto:#F8FAFC; --lyso:#AE3A6C; --lyso-fill:#F6E3EB; --nuc:#E6E9F2; --nuc-line:#97A0BA;
  --on:#DC930F; --on-soft:#FCEBC4; --off:#BCC4CE; --off-ink:#556171;
  --mtor:#0D6E73; --mtor-soft:#D3ECEC; --tfeb:#6748B6; --tfeb-soft:#E7E0F6;
  --aa:#2C7B45; --akt:#C0561B; --bad:#C42B2B; --good:#1E7848; --edge:#3F4B5A;
  --mito:#B5651D; --mito-fill:#FBEFE3; --mal:#6748B6; --acyl:#C0561B; --carn:#C2185B; --adp:#8A96A6;
  --gfp:#E8C21A; --rfp:#D62F4B; --micro:#10151B;
  --p-ink:#1A1E23;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222B; --ink:#E4E9EF; --muted:#97A3B0; --line:#29333E;
  --cyto:#121920; --lyso:#DE6A9B; --lyso-fill:#381C29; --nuc:#1B2130; --nuc-line:#56607B;
  --on:#EFB13A; --on-soft:#4A3913; --off:#404A56; --off-ink:#B3BDC8;
  --mtor:#33B6BB; --mtor-soft:#123A3C; --tfeb:#A28CEC; --tfeb-soft:#2A2343;
  --aa:#6BC486; --akt:#EF8A4A; --bad:#F06666; --good:#4FC58C; --edge:#AEB8C4;
  --mito:#E39A57; --mito-fill:#2E2116; --mal:#A28CEC; --acyl:#EF8A4A; --carn:#F06AA0; --adp:#7D8896;
  --gfp:#F2D23A; --rfp:#FF5B73; --micro:#07090C;
  --p-ink:#1A1E23; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.affil{margin:0 0 8px;padding:0 0 6px;border-bottom:2px solid var(--mtor);color:var(--mtor);font-size:15px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.wm{font-family:var(--f-body);font-size:9.2px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2vw,25px);margin:0;text-wrap:balance}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
/* вкладки вопросов и кнопки «Объяснения» в одной строке */
.barrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin:10px 0 8px}
.barrow .bar{margin:0}
.routes{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
/* «← Все семинары» в правом верхнем углу */
.topnav{position:relative}
.homelink{position:absolute;right:0;top:3px;font-size:14px;font-weight:650;color:var(--u-ui,#006CA3);text-decoration:none;white-space:nowrap;padding:2px 0;line-height:1.3}
.homelink:hover,.homelink:focus-visible{text-decoration:underline;color:var(--u-ui-2,#00507A)}
@media(max-width:1000px){.topnav .affil{padding-right:132px}}
@media(max-width:600px){.homelink{position:static;display:block;margin:0 0 6px;padding:4px 0}.topnav .affil{padding-right:0}}
@media print{.homelink,.routes{display:none}}
.tab{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;gap:9px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;flex:none}
.tab[aria-selected="true"]{background:var(--mtor);border-color:var(--mtor);color:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 10px}
.qline{color:var(--ink);font-size:16px;margin:0;font-weight:500;max-width:80ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none;font-size:15px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--off);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked{background:var(--mtor)}
.switch input:checked::after{transform:translateX(18px)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1.5px solid var(--mtor);background:var(--mtor);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--mtor)}
.btn.warn{border-color:var(--on);background:var(--on);color:var(--p-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.scene{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
@media (min-width:1001px){.side{max-height:var(--avail,calc(100vh - 150px));overflow-y:auto;padding-right:4px}}
@media (max-width:1000px){.scene{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stage{padding:0;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:calc(var(--avail,calc(100vh - 160px)) - 2px)}
/* невысокий экран (проектор 1280×720, 1366×768): шапка компактнее, схема целиком в окне */
@media (min-width:1001px) and (max-height:860px){
  .wrap{padding-block:4px 16px}
  .affil{font-size:13px;margin:0 0 4px;padding:0 0 3px}
  h1{font-size:18px}
  header .btn{padding:5px 10px;font-size:14px} header .switch{font-size:14px}
  .bar{margin:5px 0 4px} .barrow{margin:5px 0 4px} .routes .btn{padding:5px 10px;font-size:14px} .tab{padding:5px 10px;font-size:14px}
  .qrow{margin:0 0 6px;gap:6px 14px} .qline{font-size:15px} .qrow .btn{padding:5px 11px;font-size:14px} .qrow .seg button{padding:4px 9px}
  .scene{gap:10px} .side{gap:9px} .side .panel{padding:11px}
}
.side{display:grid;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.slider{display:grid;gap:2px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider label{font-weight:600;font-size:15.5px}
.slider output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--mtor);height:30px;margin:0}
.ctrl{display:grid;gap:12px}
.ctrl .grp{display:grid;gap:6px}
.ctrl .grp > span{font-size:13px;color:var(--muted);font-weight:600}
.reads{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.read b{font-family:var(--f-mono);font-weight:600;font-size:14.5px}
.read small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.read .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--mtor);transition:width .3s}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.p{background:var(--on);color:var(--p-ink)}
.pill.np{background:var(--surface);color:var(--off-ink);border:1px solid var(--line)}
.pill.cy{background:var(--tfeb-soft);color:var(--tfeb);border:1px solid var(--tfeb)}
.pill.nu{background:var(--nuc);color:var(--ink);border:1px solid var(--nuc-line)}
.cap{border-left:4px solid var(--mtor)}
.cap p{margin:0;font-size:16.5px}
.cap .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.cap .why b,.take b,.info b.k{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cap .why b{color:var(--good)}
.take{border:2px solid var(--mtor);background:var(--mtor-soft)}
.take b{color:var(--mtor)}
.take p{margin:0;font-size:15.5px}
.info{border:2px solid var(--tfeb);background:var(--tfeb-soft)}
.info b.k{color:var(--tfeb)}
.info p{margin:0;font-size:15.5px}
.info h4{margin:0 0 4px;font-family:var(--f-mono);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.line{width:18px;height:4px;border-radius:2px}
canvas.plot{width:100%;height:200px;display:block;border-radius:8px;background:var(--surface-2)}
.plotcap{margin:0 0 -4px;font-size:13px;color:var(--muted)}
.timebox{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted);margin:0}

/* сценарий занятия */
.poe{border:2px solid var(--on);background:var(--on-soft)}
.poe .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.poe .q{font-size:19px;font-weight:700;margin:4px 0 10px;text-wrap:balance}
.poe .opts{display:grid;gap:6px}
.poe .opt{font:inherit;text-align:left;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.poe .opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.poe .opt.picked{border-color:var(--ink)}
.poe .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.poe .opt.wrongpick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.poe .ex{margin:10px 0 0;font-size:16px}
.poe .ex.wrongex{border-left:3px solid var(--bad);padding-left:10px}
.poe .opt:disabled{cursor:default}
.poe .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* блот */
.blotbox{overflow-x:auto}
.blotgrid{display:grid;grid-template-columns:max-content max-content;justify-content:start}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:46px}
.rowlab{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);padding-right:10px;display:flex;align-items:center;height:28px;white-space:nowrap}
.head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:5px;font-variant-numeric:tabular-nums}
.film{background:#E4E8EC;border:1px solid #C5CCD5;border-radius:4px;padding:3px 0}
.cell{height:28px;display:grid;place-items:center}
.band{width:32px;height:10px;border-radius:50%;background:radial-gradient(ellipse at center,#191D22 0%,#191D22 40%,transparent 72%);filter:blur(.5px)}
.lanekey{font-size:13px;color:var(--muted);margin:6px 0 0;display:grid;gap:2px}

/* модальная легенда */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px}
dialog::backdrop{background:rgba(10,14,20,.45)}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:15.5px}
.lg svg{width:64px;height:30px}
details.teacher{margin-top:14px}
details.teacher summary{cursor:pointer;font-weight:600}
details.teacher p,details.teacher li{max-width:100ch;font-size:15px}
.noscript{max-width:640px;margin:40px auto;padding:20px;border:2px solid #C42B2B;border-radius:12px;font:16px/1.5 system-ui,sans-serif;color:#15202B;background:#fff}

/* схемы */
.cyto{fill:var(--cyto)}
.lyso{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:4}
.lyso-s{fill:var(--lyso-fill);stroke:var(--lyso);stroke-width:3;transition:opacity .5s}
.nuc{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:3}
.nuc2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.7}
.lbl{font-family:var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lbl-l{font-family:var(--f-body);fill:var(--ink);dominant-baseline:central}
.area{font-family:var(--f-body);fill:var(--muted);font-size:14px;font-style:italic}
.area-lyso{fill:var(--lyso);font-size:16px;font-weight:600;font-style:normal}
.area-mito{fill:var(--mito);font-size:15px;font-weight:600;font-style:normal}
.mono{font-family:var(--f-mono)}
.node{stroke-width:2.2;transition:fill .45s,stroke .45s,opacity .4s}
.node.on{fill:var(--on-soft);stroke:var(--on)}
.node.off{fill:var(--surface);stroke:var(--off)}
.box{fill:var(--surface);stroke:var(--off-ink);stroke-width:2;transition:fill .4s,stroke .4s,opacity .4s}
.box.on{fill:var(--on-soft);stroke:var(--on)}
.box.inh{fill:var(--surface-2);stroke:var(--off);stroke-dasharray:3 3}
.ragulator{fill:var(--surface-2);stroke:var(--lyso);stroke-width:1.6}
.mtor-body{fill:var(--mtor-soft);stroke:var(--mtor);stroke-width:2.5}
.glow{fill:none;stroke:var(--on);stroke-width:7;transition:opacity .5s}
.tfeb-body{fill:var(--tfeb-soft);stroke:var(--tfeb);stroke-width:2}
.kin{fill:var(--akt);transition:opacity .4s}
.kin-lbl{fill:#FFFFFF;font-weight:700}
.pb circle{fill:var(--on)}
.pb text{fill:var(--p-ink);font-family:var(--f-mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.aa-dot{transition:opacity .35s}
.edge{fill:none;stroke:var(--edge);stroke-width:2;transition:opacity .4s}
.edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--edge)}
/* телефон: кнопка «Увеличить схему» (общий контракт 22.10.2026; кнопка видна и в альбомной ориентации телефона) */
.zwrap{display:block}
.zoombtn{display:none;margin:0 0 6px auto;font-size:14px;padding:5px 12px;background:var(--surface)}
@media (max-width:700px), (max-height:500px){
  .zoombtn{display:block}
  .stage.zoomed .zwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
  .stage.zoomed svg{width:880px;max-width:none;max-height:none}
}
.cross{pointer-events:none} /* крест «белка нет» не перехватывает касание по белку (22.10.2026) */
/* телефон: панели под схемой не шире экрана — блот и таблицы прокручиваются в своей рамке, длинные подписи и кнопки-переключатели переносятся на новую строку (22.10.2026) */
@media (max-width:700px){body{overflow-wrap:break-word}.side *{min-width:0}.side .v,.side .switch span{white-space:normal}.side .v{min-width:auto}.side .mt{flex-wrap:wrap}.side .seg,.side .cg .seg{flex-wrap:wrap}.side .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}.side output{white-space:nowrap;flex:none}.side [class*="-row2"]{grid-template-columns:minmax(0,1fr)}.side table{display:block;max-width:100%;overflow-x:auto}.side .isc{overflow-x:auto}}@media (max-width:420px){.side .mgrid{grid-template-columns:minmax(0,1fr)!important}}
.cross line{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round}
.missing{opacity:.55}
.mov{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s}
.fade{transition:opacity .4s}
.col-atp{fill:var(--mtor)} .col-adp{fill:var(--adp)} .col-amp{fill:var(--on)}
.col{transition:y .4s,height .4s}
.ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:3}
.mito2{fill:none;stroke:var(--mito);stroke-width:1.6}
.flux{fill:none;stroke-linecap:round;transition:stroke-width .4s,opacity .4s}
.drug{fill:var(--bad)}
.clickable{cursor:help}
.clickable:hover > rect:first-of-type,.clickable:hover > circle:first-of-type{stroke-width:3.2}
.drop{fill:#F5E6B8;stroke:#C9A43A;stroke-width:2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop{fill:#4A3E1C;stroke:#C9A43A}}
:root[data-theme="dark"] .drop{fill:#4A3E1C;stroke:#C9A43A}
@media (prefers-reduced-motion: reduce){ .mov,.fade,.node,.glow,.col,.edge,.box,.flux,.meter i{transition:none!important} }

/* v1.1: управление недоступно, пока студент не дал прогноз (сценарий «предскажите и проверьте») */
.poelock[inert]{opacity:.5;filter:grayscale(.35);cursor:not-allowed}

/* v1.1 (P11): развилка «клетка → две пробы» под блотом вопроса 2п */
.fork{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.35fr);gap:8px;align-items:center;margin:8px 0 2px}
.fk-box{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;line-height:1.3}
.fk-box b{display:block;font-size:14px}
.fk-box span{display:block;color:var(--muted);font-size:13px}
.fk-lam{border-color:var(--bad)}
.fk-ar{display:grid;justify-items:center;font-size:13px;color:var(--muted);max-width:92px;text-align:center}
.fk-ar i{font-style:normal;font-size:20px;line-height:1}
.fk-two{display:grid;gap:8px}
@media (max-width:640px){.fork{grid-template-columns:minmax(0,1fr)}.fk-ar{max-width:none}.fk-ar i{transform:rotate(90deg)}}

/* V05 (аудит 16.10.2026): на узком экране схема не сжимается до нечитаемых подписей, а показывается в масштабе ≥1,2× с горизонтальной прокруткой */
@media (max-width:760px){
  .stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .stage::before{content:var(--svg-hint,'');display:block;position:sticky;left:0;font-size:12.5px;line-height:1.35;padding:6px 10px;color:var(--muted,#566);background:var(--surface-2,#f4f6f8)}
  .stage svg{width:auto;min-width:720px;max-height:none}
}

 пути Gs–cAMP–PKA низкая, и мышца сохраняет исходный тонус. Базальная активность рецепторов поддерживает лишь небольшую фоновую концентрацию cAMP.", "s1b_c_rest_cm": "Агониста нет. Gαs почти весь в GDP-форме, концентрация cAMP исходная, активность PKA низкая. Базальные доли фосфорилированных мишеней малы, сила и скорость сокращения исходные.", "s1b_c_rest_cm_z": "В отсутствие агониста активность пути низкая, и сократимость кардиомиоцита не повышена. Исходный режим работы сохраняется в промежутках между эпизодами симпатической стимуляции.", "s1b_c_rest_ad": "Агониста нет. Gαs почти весь в GDP-форме, концентрация cAMP исходная, активность PKA низкая. Базальные доли фосфорилированных липазы и перилипина-1 малы, скорость липолиза исходная.", "s1b_c_rest_ad_z": "Без сигнала запасённый жир не мобилизуется. Базальный липолиз поддерживает лишь небольшой постоянный выход жирных кислот.", "s1b_c_weak_br": "Агонист связан лишь с малой долей рецепторов. Доля Gαs-GTP и концентрация cAMP уже повышены, но активность PKA мала, поэтому стационарная доля фосфорилированных мишеней невелика. На этом уровне потоки фосфорилирования и дефосфорилирования равны. Тонус снижен лишь немного.", "s1b_c_weak_br_z": "Между повышением концентрации cAMP и ответом клетки лежит порог: фосфатазы противодействуют PKA, дефосфорилируя её мишени. Поэтому слабый сигнал передаётся лишь частично.", "s1b_c_weak_cm": "Агонист связан лишь с малой долей рецепторов. Доля Gαs-GTP и концентрация cAMP уже повышены, но активность PKA мала, поэтому стационарная доля фосфорилированных мишеней невелика. На этом уровне потоки фосфорилирования и дефосфорилирования равны. Сила сокращения и скорость расслабления выросли незначительно.", "s1b_c_weak_cm_z": "Между повышением концентрации cAMP и ответом сердца лежит порог. Слабый симпатический сигнал меняет работу кардиомиоцита лишь слегка.", "s1b_c_weak_ad": "Агонист связан лишь с малой долей рецепторов. Доля Gαs-GTP и концентрация cAMP уже повышены, но активность PKA мала, поэтому стационарная доля фосфорилированных мишеней невелика. На этом уровне потоки фосфорилирования и дефосфорилирования равны. Липолиз ускорен незначительно.", "s1b_c_weak_ad_z": "Между повышением концентрации cAMP и мобилизацией жира лежит порог. Слабый сигнал даёт лишь небольшой прирост липолиза.", "s1b_c_res_br": "Агонист связан с {o} % рецепторов, а доля Gαs-GTP и концентрация cAMP уже заметно выше исходных: активный рецептор успевает перевести в GTP-форму много молекул Gαs (резерв рецепторов). PKA фосфорилирует MLCK и K⁺-каналы BK и снижает образование IP₃; в результате тонус заметно снижен.", "s1b_c_res_br_z": "Из-за резерва рецепторов и усиления на каждой ступени малая занятость даёт уже значительный ответ. Поэтому расслабление наступает при концентрациях агониста ниже тех, что занимают все рецепторы.", "s1b_c_res_cm": "Агонист связан с {o} % рецепторов, а доля Gαs-GTP и концентрация cAMP уже заметно выше исходных: активный рецептор успевает перевести в GTP-форму много молекул Gαs (резерв рецепторов). PKA фосфорилирует белок Rad (снимая торможение канала CaV1.2), фосфоламбан и тропонин I; в результате сила сокращения и скорость расслабления заметно выросли.", "s1b_c_res_cm_z": "Из-за резерва рецепторов и усиления малая занятость даёт уже значительный ответ сердца. Так сердце быстро отвечает на умеренный выброс адреналина.", "s1b_c_res_ad": "Агонист связан с {o} % рецепторов, а доля Gαs-GTP и концентрация cAMP уже заметно выше исходных: активный рецептор успевает перевести в GTP-форму много молекул Gαs (резерв рецепторов). PKA фосфорилирует гормон-чувствительную липазу и перилипин-1, липолиз заметно ускорен.", "s1b_c_res_ad_z": "Из-за резерва рецепторов и усиления малая занятость уже заметно ускоряет липолиз. Запасённый жир мобилизуется и при умеренной стимуляции.", "s1b_c_on_br": "Агонист связан с {o} % рецепторов. Доля Gαs-GTP, концентрация cAMP (× {c}) и активность PKA близки к максимуму. MLCK и K⁺-каналы BK фосфорилированы, образование IP₃ снижено; суммарный результат — расслабление: тонус снижен до {out}.", "s1b_c_on_br_z": "В гладкой мышце бронха путь Gs–cAMP–PKA снижает тонус. На этом основано действие β2-агонистов при бронхоспазме.", "s1b_c_on_cm": "Агонист связан с {o} % рецепторов. Доля Gαs-GTP, концентрация cAMP (× {c}) и активность PKA близки к максимуму. Rad, фосфоламбан и тропонин I фосфорилированы: торможение канала CaV1.2 снято, вход Ca²⁺ в клетку и его закачка в СР ускорены; сила сокращения и скорость расслабления выросли: {out}.", "s1b_c_on_cm_z": "В кардиомиоците тот же путь усиливает и ускоряет работу сердца. Один и тот же адреналин действует на бронх и на сердце по-разному из-за разного набора мишеней PKA.", "s1b_c_on_ad": "Агонист связан с {o} % рецепторов. Доля Gαs-GTP, концентрация cAMP (× {c}) и активность PKA близки к максимуму. Гормон-чувствительная липаза и перилипин-1 фосфорилированы, липаза получает доступ к липидной капле: скорость липолиза возросла до {out}.", "s1b_c_on_ad_z": "В адипоците тот же путь мобилизует запасённый жир. Один сигнал даёт три разных ответа, потому что PKA фосфорилирует в этих клетках разные белки.", "s1b_take": "Путь от β2-рецептора до PKA в модели одинаков во всех трёх клетках: агонист смещает равновесие конформаций рецептора в сторону активной, активный рецептор ускоряет обмен GDP на GTP в Gαs, Gαs-GTP активирует аденилатциклазу, cAMP освобождает каталитические субъединицы PKA. Различные физиологические ответы — расслабление бронха, усиление работы сердца, липолиз — заданы не самим путём, а тем, какие белки PKA фосфорилирует в данной клетке. Из-за резерва рецепторов и усиления на каждой ступени ответ заметен уже при малой занятости рецепторов.", "p1b_1_q": "Рассматривается гладкомышечная клетка бронха; агонист отсутствует. Занятость β-рецепторов повышают с 0 до 50 %. Как изменится тонус гладкой мышцы?", "p1b_1_o1": "Снизится: наступит расслабление гладкой мышцы", "p1b_1_o2": "Повысится: мышца сократится сильнее", "p1b_1_o3": "Не изменится: cAMP на тонус бронха не влияет", "p1b_1_e": "При повышении занятости рецепторов возрастают доля Gαs-GTP и концентрация cAMP. PKA фосфорилирует K⁺-каналы BK и MLCK и снижает образование IP₃; вклад фосфорилирования MLCK в расслабление интактной мышцы обсуждается. Суммарный результат — расслабление: тонус снижается примерно до трети исходного.", "p1b_1_w2": "PKA в гладкой мышце бронха снижает сократимость, а не повышает её. Сокращение бронха вызывают агонисты рецепторов, сопряжённых с Gq (например, ацетилхолин через M3-рецепторы); активация Gs его не вызывает.", "p1b_1_w3": "cAMP влияет на тонус бронха через PKA: она действует на MLCK, K⁺-каналы BK и путь IP₃. Повышение концентрации cAMP снижает тонус, это и есть механизм бронходилатации.", "p1b_2_q": "Занятость рецепторов 50 %. В модели гладкомышечную клетку бронха заменяют кардиомиоцитом (путь до PKA в модели одинаков). Как изменится сила сокращения?", "p1b_2_o1": "Снизится: cAMP расслабляет любую мышцу", "p1b_2_o2": "Возрастёт: в кардиомиоците у PKA другие мишени", "p1b_2_o3": "Не изменится: концентрация cAMP в модели та же", "p1b_2_e": "Концентрация cAMP и активность PKA в модели те же, но мишени PKA другие. В кардиомиоците PKA фосфорилирует белок Rad, фосфоламбан и тропонин I. Фосфорилирование Rad снимает торможение канала CaV1.2 и усиливает вход Ca²⁺, фосфорилирование фосфоламбана ускоряет закачку Ca²⁺ в саркоплазматический ретикулум (СР); в результате сила сокращения и скорость расслабления растут.", "p1b_2_w1": "В кардиомиоците тот же cAMP усиливает сокращение, а не расслабляет: набор мишеней PKA здесь другой, чем в гладкой мышце. Направление ответа задаётся мишенями, а не самим посредником.", "p1b_2_w3": "Одинаковая концентрация cAMP не означает одинакового ответа: в кардиомиоците PKA фосфорилирует другой набор белков. Вопрос о силе сокращения, а не о концентрации посредника.", "p1b_3_q": "Занятость рецепторов 50 %, клетка — адипоцит. Какие белки фосфорилирует в этой клетке протеинкиназа A и какой процесс в результате ускоряется?", "p1b_3_o1": "Фосфоламбан; закачка Ca²⁺ в ретикулум", "p1b_3_o2": "MLCK; расслабление гладкой мышцы", "p1b_3_o3": "Липаза и перилипин-1; липолиз", "p1b_3_e": "В адипоците мишени PKA — гормон-чувствительная липаза и перилипин-1. Их фосфорилирование открывает липазам доступ к липидной капле, и липолиз ускоряется: растёт выход глицерола и жирных кислот.", "p1b_3_w1": "Фосфоламбан — мишень PKA в кардиомиоците, а не в адипоците. Набор мишеней задаётся тем, какие белки экспрессирует данная клетка.", "p1b_3_w2": "MLCK — мишень PKA в гладкой мышце. Снижение тонуса — ответ гладкомышечной клетки; в адипоците PKA действует на другие белки, и ответ клетки — липолиз, а не расслабление.", "p1b_4_q": "Рассматривается гладкомышечная клетка бронха; агонист отсутствует. Занятость рецепторов повышают до 10 %. Какой станет концентрация cAMP по отношению к максимальному ответу?", "p1b_4_o1": "Концентрация cAMP почти не изменится: занято лишь 10 % рецепторов", "p1b_4_o2": "Концентрация cAMP вырастет строго на 10 % от максимума", "p1b_4_o3": "Концентрация cAMP достигнет заметной доли максимума: около трети", "p1b_4_e": "При занятости 10 % концентрация cAMP в модели вырастает примерно на 30 % от максимального прироста (около ×3,9 при максимуме ×10,5). Активный рецептор служит фактором обмена гуаниновых нуклеотидов для Gαs и успевает перевести в GTP-форму много таких молекул, поэтому ответ нарастает быстрее, чем занятость (резерв рецепторов): половина прироста доли Gαs-GTP между нулевой и полной занятостью достигается в модели примерно при 20 % занятости.", "p1b_4_w1": "Ответ не пропорционален занятости: из-за резерва рецепторов и усиления даже 10 % занятых рецепторов дают заметный прирост концентрации cAMP. Малая занятость — не малый ответ.", "p1b_4_w2": "Прямой пропорции между занятостью рецепторов и концентрацией cAMP нет. Из-за резерва рецепторов концентрация cAMP, выраженная как доля максимального значения, заметно выше доли занятых рецепторов.", "s1a_iv_t": "Вмешательство", "s1a_iv_0": "нет", "s1a_iv_rol": "ролипрам", "s1a_iv_grk": "нокдаун GRK6", "s1a_iv_arr": "нокдаун β-аррестинов", "s1a_iv_prop": "пропранолол (10 мин)", "s1a_iv_fsk": "форсколин", "s1a_iv_ctx": "холерный токсин", "s1a_ivlong_0": "изопротеренол с 1-й минуты, без вмешательств", "s1a_ivlong_rol": "изопротеренол + ролипрам (ингибитор PDE4), предобработка", "s1a_ivlong_grk": "изопротеренол, синтез GRK6 подавлен siRNA", "s1a_ivlong_arr": "изопротеренол, синтез β-аррестинов 1 и 2 подавлен siRNA", "s1a_ivlong_prop": "изопротеренол, пропранолол добавлен на 10-й минуте", "s1a_ivlong_fsk": "форсколин с 1-й минуты, без агониста", "s1a_ivlong_ctx": "предобработка холерным токсином, без агониста", "s1a_tslider": "Время от начала опыта", "s1a_isoL": "изопротеренол", "s1a_propL": "пропранолол", "s1a_rec": "β2-рецептор", "s1a_surfN": "на поверхности: {p} %", "s1a_arrL": "β-аррестин", "s1a_bind": "препятствует связыванию Gs", "s1a_intL": "интернализация", "s1a_endo": "эндосома", "s1a_recL": "возврат", "s1a_ctxL": "холерный токсин", "s1a_ac": "аденилатциклаза", "s1a_fskL": "форсколин", "s1a_conv": "синтез из ATP", "s1a_senL": "FRET-сенсор cAMP", "s1a_senV": "связал cAMP: {p} %", "s1a_hyd": "гидролиз cAMP", "s1a_amp": "5′-AMP", "s1a_rolL": "ролипрам", "s1a_leg1": "Жёлтый — белок активен, «P» — фосфорилирован.", "s1a_leg2": "Бледный белок — синтез частично подавлен; пунктир — перенос или катализ.", "s1a_clock": "{m} мин", "s1a_cellsL": "Клетки HEK293 (эндогенный β2-рецептор), сенсор cAMP ICUE2", "s1a_cellsL2": "в цитоплазме, 37 °C (по Violin 2008). Величины относительные.", "s1a_r_sen": "сигнал сенсора cAMP", "s1a_r_camp": "cAMP", "s1a_r_camp_s": "во сколько раз выше исходного (в модели)", "s1a_r_surf": "рецепторы на поверхности", "s1a_r_arr": "рецепторы, связанные с β-аррестином", "s1a_r_pka": "активность PKA", "s1a_r_pde": "активность PDE4", "s1a_r_pde_s": "× от исходной", "s1a_pde_rol": "подавлена ролипрамом", "s1a_l_sen": "сигнал сенсора cAMP", "s1a_l_pka": "активность PKA", "s1a_l_surf": "рецепторы на поверхности", "s1a_pcap": "Учебная модель, относительные величины; время от начала опыта. {c}.", "s1a_mk_iso": "изопротеренол", "s1a_mk_fsk": "форсколин", "s1a_mk_prop": "пропранолол", "s1a_c_pre": "Изопротеренол ещё не добавлен. Рецепторы на поверхности и не фосфорилированы, Gαs в GDP-форме, концентрация cAMP исходная. Сенсор почти не связан с cAMP.", "s1a_c_pre_z": "Это исходное стационарное состояние, от которого отсчитывается ответ. До добавления агониста сохраняется низкая базальная активность пути.", "s1a_c_pre_rol": "Изопротеренол ещё не добавлен, но PDE4 уже подавлена ролипрамом. Поэтому даже без агониста базальная концентрация cAMP немного выше исходной.", "s1a_c_pre_rol_z": "Ролипрам частично подавляет гидролиз cAMP. Поэтому ещё до стимуляции стационарная концентрация cAMP, определяемая балансом синтеза и гидролиза, становится выше.", "s1a_c_peak": "Ранний ответ: в первые десятки секунд после добавления изопротеренола концентрация cAMP (× {c}) и активность PKA близки к пику. Большая доля молекул сенсора связана с cAMP. Механизмы завершения сигнала уже действуют: GRK фосфорилирует рецептор, β-аррестин начинает с ним связываться, PKA активирует PDE4.", "s1a_c_peak_z": "Процессы, повышающие и снижающие концентрацию cAMP, запускаются почти одновременно. В момент пика скорости синтеза и гидролиза равны; затем гидролиз преобладает: десенситизация рецептора снижает скорость синтеза, а PDE4, активированная PKA, ускоряет гидролиз.", "s1a_c_peak_rol": "Ранний ответ при подавленной PDE4: концентрация cAMP (× {c}) выше, чем без ролипрама; сигнал сенсора около 80 % от максимального — сенсор близок к насыщению и дальнейший рост концентрации cAMP отражает слабо. Гидролиз cAMP замедлен, поэтому пик выше.", "s1a_c_peak_rol_z": "Ролипрам не действует на рецептор, а подавляет гидролиз cAMP. Поэтому при той же скорости синтеза концентрация cAMP устанавливается выше.", "s1a_c_fall": "Концентрация cAMP (× {c}) снижается, хотя изопротеренол ещё в среде. Большая часть рецепторов фосфорилирована киназой GRK и связана с β-аррестином ({a} %), который стерически препятствует связыванию Gs; PKA активировала PDE4. Оба механизма ослабляют сигнал.", "s1a_c_fall_z": "Присутствие агониста само по себе не поддерживает сигнал: десенситизация рецептора и активация PDE4 заметно снижают концентрацию cAMP, хотя остаточный ответ сохраняется.", "s1a_c_late": "Поздний этап: концентрация cAMP (× {c}) заметно ниже пика, но выше исходного уровня. Значительная доля рецепторов десенситизирована и интернализована ({i} % в эндосоме), PDE4 активна. Ответ значительно ослаб, хотя агонист остаётся в среде. Синтез cAMP в эндосомах в модели не учтён.", "s1a_c_late_z": "Так выглядит десенситизация: при длительной стимуляции ответ ослабевает и без удаления агониста. Модель не учитывает, что интернализованный β2-рецептор может продолжать передачу сигнала из эндосомы (Irannejad 2013), поэтому из этой модели нельзя сделать вывод о полном прекращении передачи сигнала. Клинически этому соответствует ослабление ответа на повторные ингаляции.", "s1a_c_late_rol": "При подавленной PDE4 концентрация cAMP (× {c}) снижается медленнее и остаётся выше исходной дольше, чем без ролипрама. Спад всё же идёт: десенситизация рецептора киназой GRK продолжается и при подавленной PDE4.", "s1a_c_late_rol_z": "Ролипрам продлевает и усиливает ответ cAMP, но не отменяет десенситизацию рецептора. Это два независимых механизма завершения сигнала.", "s1a_c_late_grk": "Синтез GRK6 подавлен siRNA. Рецептор фосфорилируется медленнее, β-аррестин связывается позже, и концентрация cAMP (× {c}) снижается медленнее. Спад всё же идёт: PKA по-прежнему активирует PDE4. В опытах Violin 2008 эффект нокдауна GRK6 отчётливо проявлялся при подавлении PKA, а нокдаун GRK2, GRK3 или GRK5 на концентрацию cAMP не влиял.", "s1a_c_late_grk_z": "В клетках HEK293 скорость десенситизации β2-рецептора определяется его фосфорилированием киназой GRK6. Подавляя синтез GRK6, siRNA замедляет этот этап и продлевает ответ, но ускоренный гидролиз cAMP всё равно снижает сигнал.", "s1a_c_late_arr": "Синтез β-аррестинов 1 и 2 подавлен siRNA (в опытах Violin 2008 — в среднем на 75 %). Рецептор фосфорилируется, но связать β-аррестин может лишь часть рецепторов ({a} %), Gs дольше остаётся доступным, и концентрация cAMP (× {c}) снижается медленнее. PDE4 по-прежнему активна.", "s1a_c_late_arr_z": "Именно связывание β-аррестина прекращает активацию Gs фосфорилированным рецептором. Без достаточного количества β-аррестина рецептор дольше активирует Gs, но ускоренный гидролиз cAMP всё равно снижает сигнал.", "s1a_c_prop_fall": "Пропранолол вытесняет изопротеренол из связи с рецептором, и β-аррестин за несколько секунд диссоциирует. Новые молекулы Gαs в GTP-форму не переводятся, уже активные Gαs инактивируются за счёт собственной ГТФазной активности, а активированная PDE4 быстро гидролизует cAMP (× {c}); скорость спада определяется гидролизом cAMP.", "s1a_c_prop_fall_z": "Время возврата концентрации cAMP к исходной определяется скоростью его гидролиза, а не рецептором: по Violin 2008, после добавления пропранолола лимитирующая стадия — гидролиз cAMP фосфодиэстеразами.", "s1a_c_prop_rec": "После пропранолола концентрация cAMP (× {c}) вернулась к исходному уровню и даже опустилась немного ниже: PDE4 ещё фосфорилирована. β-аррестин диссоциировал; рецепторы постепенно возвращаются из эндосомы на поверхность.", "s1a_c_prop_rec_z": "Концентрация cAMP возвращается к исходной примерно за минуту (это определяется скоростью гидролиза), а исходное распределение рецепторов восстанавливается медленнее, по мере их возврата из эндосомы.", "s1a_c_fsk": "Форсколин активирует аденилатциклазу напрямую, минуя рецептор и Gs. Концентрация cAMP (× {c}) превышает пиковую концентрацию при действии изопротеренола и остаётся повышенной (как и в опытах Violin 2008 с 50 мкМ форсколина): рецептор агонистом не занят, GRK его не фосфорилирует, β-аррестин не связывается — рецепторы остаются на поверхности. PDE4 всё же активируется через PKA.", "s1a_c_fsk_z": "При действии форсколина синтез cAMP не зависит от рецептора. Так видно, что десенситизация рецептора и регуляция PDE4 — разные механизмы: форсколин обходит первый механизм, но не второй.", "s1a_c_ctx": "После предобработки холерным токсином Gαs остаётся в GTP-форме без агониста: токсин ADP-рибозилирует в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляет гидролиз GTP. Концентрация cAMP (× {c}) повышена постоянно, хотя изопротеренол не добавляли.", "s1a_c_ctx_z": "Холерный токсин подавляет гидролиз GTP — собственный механизм инактивации Gαs. Поэтому аденилатциклаза остаётся активной без сигнала от рецептора.", "s1a_take": "Изопротеренол в насыщающей концентрации (1 мкМ) даёт в клетках HEK293 кратковременное повышение концентрации cAMP: максимум — в первые десятки секунд, спад — за несколько минут, хотя агонист остаётся в среде (Violin 2008, сенсор ICUE2, 37 °C). Спад задают два механизма: фосфорилирование рецептора киназой GRK6 со связыванием β-аррестина (десенситизация; половина активных рецепторов инактивируется примерно за 70 с) и активация PDE4 протеинкиназой A (отрицательная обратная связь). Подавление любого из них продлевает ответ, но не отменяет спад; к 10-й минуте концентрация cAMP остаётся выше исходной, потому что часть рецепторов остаётся на поверхности и продолжает активировать Gs, а активация PDE4 лишь частично компенсирует синтез; синтез cAMP в эндосомах в модели не учтён и мог бы дать дополнительный вклад. Ролипрам повышает концентрацию cAMP и продлевает ответ; пропранолол прекращает синтез, и время возврата определяется гидролизом; форсколин активирует аденилатциклазу в обход рецептора, поэтому рецепторы остаются на поверхности; холерный токсин поддерживает Gαs в активном состоянии без агониста (Cassel 1977).", "p1a_1_q": "Клетки HEK293, изопротеренол добавлен на 1-й минуте и остаётся в среде, вмешательств нет. На 2-й минуте сигнал сенсора cAMP близок к пику. Каким он будет к 10-й минуте?", "p1a_1_o1": "Останется на уровне пика: агонист в среде", "p1a_1_o2": "Ниже пика, но выше исходного", "p1a_1_o3": "Станет ниже исходного уровня", "p1a_1_e": "В модели концентрация cAMP на 2-й минуте около ×9 от исходной, а к 10-й минуте около ×1,8: ответ сильно ослаб, но не исчез, хотя изопротеренол ещё в среде. Рецептор фосфорилирован киназой GRK и связан с β-аррестином, часть рецепторов интернализована, а PKA активировала PDE4. Так развивается десенситизация. Синтез cAMP в эндосомах в модели не учтён: в живых клетках интернализованный β2-рецептор может продолжать передачу сигнала (Irannejad 2013).", "p1a_1_w1": "Присутствие агониста не поддерживает сигнал: рецептор десенситизируется, PDE4 ускоряет гидролиз cAMP. Поэтому концентрация cAMP снижается и при агонисте в среде.", "p1a_1_w3": "Механизмы завершения снижают концентрацию cAMP до исходного уровня, но не ниже него. Базальная концентрация cAMP определяется балансом слабого синтеза и гидролиза, и этот баланс сохраняется.", "p1a_2_q": "Сравните сигнал cAMP в первые минуты без вмешательств и с ролипрамом (ингибитор PDE4). Каким будет сигнал cAMP при действии ролипрама?", "p1a_2_o1": "Выше: гидролиз cAMP замедлен, спад медленнее", "p1a_2_o2": "Таким же: PDE4 на концентрацию cAMP не влияет", "p1a_2_o3": "Ниже: ролипрам тормозит аденилатциклазу", "p1a_2_e": "Ролипрам подавляет гидролиз cAMP фосфодиэстеразой PDE4 — основной фосфодиэстеразой клеток HEK293, поэтому при том же синтезе концентрация cAMP устанавливается выше и спад замедляется. Так же действовали ингибиторы фосфодиэстераз в опытах на этих клетках: ролипрам у Xin 2008, IBMX у Violin 2008.", "p1a_2_w2": "Концентрация cAMP определяется балансом синтеза и гидролиза, а значительная часть гидролиза приходится на PDE4. Подавляя её, ролипрам повышает концентрацию cAMP.", "p1a_2_w3": "Ролипрам действует на фосфодиэстеразу, а не на аденилатциклазу: он замедляет удаление cAMP, а не его синтез. Поэтому концентрация cAMP растёт, а не снижается.", "p1a_3_q": "Сравните сигнал cAMP на 5-й минуте в обычных клетках и в клетках, где siRNA подавила синтез β-аррестинов 1 и 2. Каким будет сигнал cAMP при нокдауне β-аррестинов?", "p1a_3_o1": "Ниже: β-аррестин нужен для синтеза cAMP", "p1a_3_o2": "Таким же: β-аррестин на концентрацию cAMP не влияет", "p1a_3_o3": "Выше: рецептор дольше активирует Gs", "p1a_3_e": "β-аррестина стало меньше, и связать его может лишь часть фосфорилированных рецепторов. Остальные не десенситизируются и дольше поддерживают синтез cAMP, поэтому на 5-й минуте концентрация cAMP выше, а спад медленнее (Violin 2008: нокдаун повышал и продлевал ответ). Спад всё же идёт — через активацию PDE4.", "p1a_3_w1": "β-аррестин не участвует в синтезе cAMP: он завершает сигнал, связываясь с фосфорилированным рецептором. Без β-аррестина концентрация cAMP не ниже, а выше.", "p1a_3_w2": "β-аррестин влияет на концентрацию cAMP: связываясь с рецептором, он стерически препятствует связыванию Gs и тем самым прекращает активацию аденилатциклазы этим рецептором. Без β-аррестина сигнал спадает медленнее.", "p1a_4_q": "Изопротеренол в среде, на 10-й минуте добавили пропранолол. Как изменится сигнал сенсора cAMP в следующие 1–2 мин?", "p1a_4_o1": "Останется прежним: cAMP уже накоплен", "p1a_4_o2": "Быстро вернётся к исходному уровню", "p1a_4_o3": "Вырастет: пропранолол снимает десенситизацию", "p1a_4_e": "Пропранолол вытесняет изопротеренол из связи с рецептором, новые молекулы Gαs в GTP-форму не переводятся. Уже активные Gαs инактивируются за счёт собственной ГТФазной активности, а активированная PDE4 в течение минуты гидролизует накопленный cAMP, и сигнал возвращается к исходному уровню (в модели даже немного ниже: PDE4 ещё фосфорилирована). По Violin 2008, скорость этого спада определяется гидролизом cAMP фосфодиэстеразами.", "p1a_4_w1": "cAMP не запасается: он постоянно гидролизуется фосфодиэстеразами. Как только синтез прекращается, концентрация cAMP быстро снижается.", "p1a_4_w3": "Пропранолол — антагонист, он прекращает активацию Gs, а не усиливает сигнал. Снятие десенситизации не приводит к синтезу cAMP без активации рецептора агонистом, и концентрация cAMP снижается.", "p1a_5_q": "Сравните два опыта на 30-й минуте: изопротеренол в среде без вмешательств и форсколин вместо агониста. Что отличает клетки с форсколином?", "p1a_5_o1": "Концентрация cAMP высокая, а рецепторы по-прежнему находятся на поверхности", "p1a_5_o2": "Концентрация cAMP высокая, а рецепторы перешли с поверхности в эндосомы", "p1a_5_o3": "Концентрация cAMP низкая: форсколин без активации рецептора не действует", "p1a_5_e": "Форсколин активирует аденилатциклазу напрямую, минуя рецептор и Gs, поэтому концентрация cAMP остаётся высокой. Рецептор агонистом не занят, GRK его не фосфорилирует, β-аррестин не связывается — рецепторы остаются на поверхности.", "p1a_5_w2": "Десенситизацию рецептора запускает занятость его агонистом. Форсколин рецептор не активирует, поэтому GRK и β-аррестин на него не действуют, и рецепторы не интернализуются.", "p1a_5_w3": "Форсколин действует на аденилатциклазу напрямую и не нуждается в рецепторе. Поэтому концентрация cAMP высокая даже без агониста.", "p1a_6_q": "Клетки предобработали холерным токсином и агониста не добавляли. Каким будет сигнал cAMP?", "p1a_6_o1": "Исходным: без агониста путь не запускается", "p1a_6_o2": "Кратковременным: всплеск сменится спадом", "p1a_6_o3": "Повышенным и без спада, хотя агониста нет", "p1a_6_e": "Холерный токсин ADP-рибозилирует в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляет гидролиз GTP. Gαs остаётся в GTP-форме и поддерживает активность аденилатциклазы без агониста, поэтому концентрация cAMP постоянно повышена (Cassel 1977; остаток — Freissmuth и Gilman 1989).", "p1a_6_w1": "Холерный токсин делает Gαs активным без рецептора, поэтому концентрация cAMP повышается и без агониста. Исходным сигнал не остаётся.", "p1a_6_w2": "Всплеск со спадом даёт активация через рецептор с последующей десенситизацией. Токсин подавляет гидролиз GTP, и концентрация cAMP остаётся повышенной, а не спадает.", "gn_b2ar": "β2-адренорецептор", "g_b2ar": "Рецептор с семью трансмембранными спиралями, сопряжённый с G-белком; связывает адреналин и норадреналин. Агонист смещает равновесие конформаций рецептора в сторону активной, а не создаёт новую конформацию. Активный рецептор служит фактором обмена гуаниновых нуклеотидов (GEF) для Gαs. При длительной стимуляции фосфорилируется киназами GRK и связывает β-аррестин.", "gn_gs": "Gαs", "g_gs": "α-субъединица гетеротримерного G-белка Gs. Активный β2-рецептор ускоряет обмен GDP на GTP в Gαs; Gαs-GTP связывает и активирует аденилатциклазу. Время активного состояния ограничено собственной ГТФазной активностью αs: субъединица гидролизует GTP и воссоединяется с βγ. Ускорение гидролиза GTP в Gs классическими RGS-белками, как правило, не показано.", "gn_ac": "аденилатциклаза", "g_ac": "Интегральный фермент плазматической мембраны; превращает ATP в циклический AMP (cAMP) с отщеплением пирофосфата. Активируется связыванием Gαs-GTP. Форсколин активирует её напрямую, минуя рецептор и Gs.", "gn_camp": "cAMP", "g_camp": "Циклический AMP — вторичный посредник. Его концентрация определяется балансом синтеза аденилатциклазой и гидролиза фосфодиэстеразами. Главный эффектор cAMP в этом пути — протеинкиназа A. В модели концентрация cAMP выражена как отношение к исходной концентрации (× от базальной).", "gn_pka": "PKA", "g_pka": "Протеинкиназа A — тетрамер из двух регуляторных и двух каталитических субъединиц (R₂C₂). cAMP связывается с регуляторными субъединицами (по два участка на каждую) и освобождает каталитические. Поскольку участков связывания несколько, зависимость активности от концентрации cAMP круче простой гиперболы. Якорные белки AKAP удерживают PKA у определённых мишеней.", "gn_pde4": "PDE4", "g_pde4": "Фосфодиэстераза 4-го семейства — фермент, гидролизующий cAMP до 5'-AMP. В клетках HEK293 на неё приходится значительная часть гидролиза cAMP. PKA фосфорилирует PDE4 и повышает её активность — это отрицательная обратная связь, ограничивающая повышение концентрации cAMP. Ролипрам избирательно подавляет PDE4.", "gn_grk": "GRK", "g_grk": "Киназа рецепторов, сопряжённых с G-белками. Распознаёт активную конформацию β2-рецептора и переносит фосфатные группы на остатки серина и треонина его хвоста; после фосфорилирования рецептора с ним может связываться β-аррестин. В клетках HEK293 из GRK2, GRK3, GRK5 и GRK6 на динамику cAMP влиял только нокдаун GRK6 (Violin 2008), а сверхэкспрессия GRK6 ускоряла десенситизацию. В других клетках, например в гладкой мышце дыхательных путей, важны GRK2/3 (Billington 2013).", "gn_arrb": "β-аррестин", "g_arrb": "Белок, связывающийся с фосфорилированным активным рецептором. Различают четыре этапа его действия: привлечение к рецептору, десенситизацию (β-аррестин стерически препятствует связыванию G-белка, и передача сигнала через Gs прекращается), интернализацию (направляет рецептор в эндосому) и функцию каркасного белка (скаффолда) для других сигнальных белков. В модели вопроса 1 β-аррестины 1 и 2 не различаются (как у Violin 2008); их количество ограничено — примерно вдвое больше, чем рецепторов.", "gn_akap": "AKAP", "g_akap": "Якорный белок протеинкиназы A. Удерживает PKA (а часто и фосфодиэстеразы, и аденилатциклазу) у определённого участка мембраны. Поэтому PKA, закреплённая в разных местах, фосфорилирует разные субстраты при одной и той же средней концентрации cAMP.", "gn_mlck": "киназа лёгких цепей миозина", "g_mlck": "MLCK — фермент гладкой мышцы, активируемый Ca²⁺–кальмодулином. PKA фосфорилирует MLCK, не связанную с кальмодулином, и снижает её сродство к Ca²⁺–кальмодулину (Conti и Adelstein 1981). Насколько велик вклад именно этого механизма в расслабление бронха in vivo, обсуждается: PKA действует на тонус и через другие мишени.", "gn_bk": "K⁺-каналы BK", "g_bk": "Калиевые каналы большой проводимости, активируемые Ca²⁺ и напряжением. PKA повышает их активность. Выход K⁺ из клетки гиперполяризует мембрану, и в результате потенциал-зависимые Ca²⁺-каналы закрываются и вход Ca²⁺ уменьшается. Это один из путей, которыми cAMP снижает тонус гладкой мышцы (Kume 1994).", "gn_cav12": "белок Rad и канал CaV1.2", "g_cav12": "Потенциал-зависимый Ca²⁺-канал L-типа плазматической мембраны кардиомиоцита. При β-адренергической стимуляции вход Ca²⁺ через него растёт. Усиление зависит не только от прямого фосфорилирования: ключевую роль играет фосфорилирование белка Rad протеинкиназой A, которое устраняет тормозящее действие Rad на канал (Liu 2020).", "gn_trop": "тропонин I", "g_trop": "Регуляторный белок тонкой нити кардиомиоцита. PKA фосфорилирует его по Ser23/24, что снижает сродство тропонина C к Ca²⁺ и ускоряет расслабление (люзитропный эффект). Вместе с фосфоламбаном определяет ускорение расслабления при β-адренергической стимуляции.", "gn_hsl": "гормон-чувствительная липаза", "g_hsl": "HSL — липаза адипоцита. PKA фосфорилирует её (у крысы по Ser659 и Ser660 — главным активирующим участкам, а также по Ser563), после чего HSL перемещается к поверхности липидной капли (Anthonsen 1998). Вместе с фосфорилированием перилипина это ускоряет расщепление запасённых триглицеридов.", "gn_plin": "перилипин-1", "g_plin": "Белок поверхности липидной капли адипоцита. В нефосфорилированном виде удерживает коактиватор ABHD5 (CGI-58) и ограничивает липолиз. Фосфорилирование перилипина протеинкиназой A освобождает ABHD5, который активирует липазу ATGL, и открывает доступ липаз к капле (Granneman 2009).", "gn_sensor": "FRET-сенсор cAMP", "g_sensor": "Белок с доменом связывания cAMP (из Epac или PKA), помещённым между двумя флуоресцентными белками. Связывание cAMP меняет расстояние между ними и, следовательно, эффективность переноса энергии (FRET); отношение сигналов двух цветов отражает концентрацию cAMP в реальном времени. В опытах Violin 2008 использован сенсор ICUE2 (фрагмент Epac1 между CFP и цитрином); максимальный сигнал получали, насыщая сенсор cAMP при действии форсколина с IBMX, а сигнал калибровали по кривой связывания cAMP in vitro.", "gn_ctx": "холерный токсин", "g_ctx": "Бактериальный токсин, который ADP-рибозилирует в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляет гидролиз GTP. Gαs остаётся в GTP-форме и постоянно активирует аденилатциклазу без агониста (Cassel 1977; остаток — Freissmuth и Gilman 1989). В модели — предобработка клеток без добавления агониста.", "gn_fsk": "форсколин", "g_fsk": "Дитерпен, активирующий аденилатциклазу напрямую, минуя рецептор и G-белок (Seamon 1981). Повышает концентрацию cAMP без участия β2-рецептора, поэтому не вызывает его десенситизации; PDE4 при этом остаётся активной.", "s2_lumen": "просвет СР", "s2_srm": "мембрана СР", "s2_pln_free": "PLN (Ser16)", "s2_pln_p": "pSer16-PLN", "s2_u_s1": "с⁻¹", "s2_u_ms": "мс", "s2_kk_sym": "kк", "s2_kf_sym": "kф", "s2_vk_sym": "vк", "s2_vf_sym": "vф", "s2b_inh_form": "тормозит SERCA2a", "s2b_free_form": "торможение снято", "s2b_pool": "10 значков — все молекулы PLN", "s2b_pool2": "жёлтый — без фосфата; P — pSer16", "s2b_pump": "насос Ca²⁺", "s2b_ca_c": "Ca²⁺ в цитозоле: 0,3 мкМ", "s2b_ca_up": "закачка: {v} % от скорости без PLN", "s2b_lg_conv": "фосфорилирование и дефосфорилирование (превращение PLN)", "s2b_lg_inh": "торможение", "s2b_lg_tr": "перенос Ca²⁺ в просвет СР", "s2b_kk": "Активность PKA, kк", "s2b_kf": "Активность PP1, kф", "s2b_note": "kк и kф — эффективные константы скорости первого порядка: в них уже входят количество и активность фермента. Закачка Ca²⁺ в саркоплазматический ретикулум (СР) рассчитана для [Ca²⁺] в цитозоле 0,3 мкМ.", "s2b_r_p": "Стационарная доля pSer16-PLN, p*", "s2b_r_flux0": "Потоки сразу после изменения, vк / vф (при p = {a})", "s2b_r_flux0s": "vк = kк(1 − p), vф = kф·p; доли пула в секунду. Пока потоки различаются, доля меняется", "s2b_r_flux": "Потоки на плато (p = p*), vк = vф", "s2b_r_fluxs": "доли пула в секунду. Реакции идут, но доля постоянна: фосфорилируется столько же молекул, сколько дефосфорилируется", "s2b_r_tau": "Время релаксации τ", "s2b_r_taus": "τ = 1/(kк + kф); за время τ доля проходит около 63 % пути к новому уровню", "s2b_r_u": "Доля нефосфорилированного PLN (тормозит SERCA2a), 1 − p*", "s2b_r_k": "Кажущаяся K SERCA2a", "s2b_r_ks": "концентрация Ca²⁺ для половины максимальной скорости; без PLN — 0,25 мкМ", "s2b_r_up": "Скорость закачки Ca²⁺ в СР, % от скорости без PLN", "s2b_pcap": "Доля pSer16-PLN после последнего изменения: от {a} к {b}. Расчёт по учебной модели пары киназа — фосфатаза, время в секундах.", "s2b_l_p": "доля pSer16-PLN", "s2b_l_new": "новый стационарный уровень p*", "s2b_c_zero": "PKA неактивна (kк = 0): PP1 дефосфорилирует весь PLN, доля pSer16-PLN равна нулю. Весь PLN тормозит SERCA2a, закачка Ca²⁺ в СР — {up} % от скорости без PLN. После подавления киназы доля фосфорилированной формы снижается с характерным временем 1/kф = {tf} с.", "s2b_c_zero_z": "Без киназы фосфорилирование не поддерживается: PP1 непрерывно возвращает PLN в тормозящую форму. Скорость этого возврата определяется только активностью фосфатазы.", "s2b_c_low": "Константа дефосфорилирования больше константы фосфорилирования (kф > kк): стационарная доля pSer16-PLN — {p}, большая часть PLN тормозит SERCA2a, закачка Ca²⁺ — {up} % от скорости без PLN. На плато потоки равны, поэтому доля постоянна. Новый уровень устанавливается за время порядка τ = {tau} с.", "s2b_c_low_z": "Низкая доля задаётся отношением kк/kф, а не отсутствием киназы: PKA работает постоянно, но фосфорилированных молекул мало, и поток дефосфорилирования kф·p уравновешивает поток фосфорилирования kк(1 − p) уже при малой доле.", "s2b_c_mid": "Активности PKA и PP1 сопоставимы: доля pSer16-PLN — {p}, скорость закачки Ca²⁺ — {up} % от скорости без PLN. Новый уровень устанавливается за время порядка τ = {tau} с.", "s2b_c_mid_z": "Стационарная доля зависит только от отношения kк/kф. Одна и та же доля достигается как повышением активности PKA, так и снижением активности PP1.", "s2b_c_high": "Активность PKA выше активности PP1: доля pSer16-PLN — {p}, торможение SERCA2a в основном снято, закачка Ca²⁺ — {up} % от скорости без PLN. Время релаксации τ = {tau} с.", "s2b_c_high_z": "Фосфорилирование Ser16 снимает торможение SERCA2a: Ca²⁺ быстрее возвращается в СР, и спад свободного Ca²⁺ в цитозоле ускоряется. При постоянной доле реакции не прекращаются: потоки равны, а скорость выхода на новый уровень задаёт сумма kк + kф.", "s2b_take": "Доля фосфорилированного PLN задаётся парой ферментов: стационарный уровень p* = kк/(kк + kф) зависит от отношения активностей PKA и PP1, а время выхода на него τ = 1/(kк + kф) — от их суммы. На плато потоки фосфорилирования и дефосфорилирования равны: kк(1 − p*) = kф·p*, поэтому доля не меняется, хотя реакции продолжаются. Рост фосфорилирования сам по себе не указывает, какой из ферментов изменился. Фосфорилирование Ser16 снимает торможение SERCA2a и ускоряет закачку Ca²⁺ в СР.", "p2b_1_q": "Исходно kк = 0,01 с⁻¹, kф = 0,04 с⁻¹, стационарная доля pSer16-PLN 0,2. Активность PKA утроили (kк = 0,03 с⁻¹), активность PP1 не меняли. Какой станет стационарная доля pSer16-PLN?", "p2b_1_o1": "0,6 — доля станет втрое больше исходной", "p2b_1_o2": "Около 0,43 — меньше чем втрое", "p2b_1_o3": "0,2 — уровень задаёт только PP1", "p2b_1_e": "p* = kк/(kк + kф) = 0,03/(0,03 + 0,04) ≈ 0,43. Доля выросла меньше чем втрое, потому что вместе с числителем вырос и знаменатель. Время релаксации сократилось с 20 до 14 с.", "p2b_1_w1": "Доля не пропорциональна kк: при росте фосфорилирования растёт и число молекул, которые дефосфорилирует PP1. Поэтому p* приближается к 1 медленнее, чем растёт kк.", "p2b_1_w3": "Стационарный уровень зависит от отношения kк/kф. Если выросла kк, отношение изменилось, и доля pSer16-PLN выросла.", "p2b_2_q": "Исходно kк = 0,01 с⁻¹, kф = 0,04 с⁻¹ (τ = 20 с). Активность PP1 снизили в четыре раза (kф = 0,01 с⁻¹), активность PKA не меняли. Как изменится время выхода на новый стационарный уровень τ?", "p2b_2_o1": "Сократится: меньше фосфатазы — быстрее переход", "p2b_2_o2": "Не изменится: τ зависит только от киназы", "p2b_2_o3": "Увеличится: с 20 до 50 с, сумма констант меньше", "p2b_2_e": "τ = 1/(kк + kф) = 1/(0,01 + 0,01) = 50 с. Доля pSer16-PLN выросла до 0,5 — так же, как при повышении активности PKA, — но новый уровень устанавливается дольше, потому что сумма констант уменьшилась. За время τ доля проходит около 63 % пути к новому уровню, за 3τ — около 95 %.", "p2b_2_w1": "Время релаксации обратно пропорционально сумме kк + kф. Когда одна из констант уменьшается, сумма уменьшается, и выход на новый уровень замедляется.", "p2b_2_w2": "В τ входят обе константы. Фосфатаза участвует в установлении любого уровня, даже если отношение изменила киназа.", "p2b_3_q": "Исходно kк = 0,01 с⁻¹, kф = 0,04 с⁻¹: доля pSer16-PLN 0,2, τ = 20 с. Обе активности увеличили в пять раз (kк = 0,05 с⁻¹, kф = 0,2 с⁻¹). Как изменятся стационарная доля pSer16-PLN и τ?", "p2b_3_o1": "Доля останется 0,2, τ сократится до 4 с", "p2b_3_o2": "Доля вырастет до 1, а время τ останется равным 20 с", "p2b_3_o3": "Доля останется 0,2, τ вырастет до 100 с", "p2b_3_e": "Отношение kк/kф не изменилось, поэтому p* = 0,05/0,25 = 0,2. Сумма констант выросла впятеро, и τ = 1/0,25 = 4 с. При высоких активностях обоих ферментов новый уровень устанавливается быстрее при той же стационарной доле, но цикл фосфорилирования и дефосфорилирования непрерывно расходует больше ATP.", "p2b_3_w2": "Обе константы выросли одинаково, отношение осталось прежним, поэтому стационарная доля не изменилась. Изменилась сумма констант, а с ней и время релаксации.", "p2b_3_w3": "τ = 1/(kк + kф): чем больше сумма констант, тем короче время. При пятикратном росте обеих констант время сокращается впятеро.", "p2b_4_q": "Исходно kк = kф = 0,04 с⁻¹, доля pSer16-PLN 0,5. Активность PKA полностью подавили (kк = 0). Чем определяется скорость, с которой снижается доля pSer16-PLN?", "p2b_4_o1": "Распадом прежних молекул PLN и синтезом новых молекул белка", "p2b_4_o2": "Скоростью, с которой падает активность PKA", "p2b_4_o3": "Активностью PP1: время спада 1/kф = 25 с", "p2b_4_e": "При kк = 0 уравнение сводится к dp/dt = −kф·p: доля экспоненциально снижается до нуля с характерным временем 1/kф = 25 с. Так в опыте оценивают активность фосфатазы — по спаду фосфорилирования после подавления киназы.", "p2b_4_w1": "Дефосфорилируется та же молекула PLN: фосфатаза гидролизует фосфоэфирную связь за секунды, и синтеза нового белка для этого не требуется.", "p2b_4_w2": "В этом шаге PKA подавлена сразу и полностью. После этого PLN остаётся фосфорилированным, пока его не дефосфорилирует PP1, поэтому скорость спада определяется активностью фосфатазы.", "p2b_5_q": "Исходно kк = 0,01 с⁻¹, kф = 0,04 с⁻¹: доля pSer16-PLN 0,2. Стало kк = 0,04 с⁻¹, kф = 0,01 с⁻¹. Как изменится скорость закачки Ca²⁺ в СР при [Ca²⁺] в цитозоле 0,3 мкМ?", "p2b_5_o1": "Вырастет: примерно с 59 до 88 % от скорости без PLN", "p2b_5_o2": "Снизится: фосфорилированный PLN сильнее тормозит насос SERCA2a", "p2b_5_o3": "Не изменится: фосфоламбан не влияет на скорость закачки Ca²⁺ в СР", "p2b_5_e": "Доля pSer16-PLN выросла до 0,8. Тормозящей (нефосфорилированной) формы осталось 0,2, кажущаяся K SERCA2a для Ca²⁺ снизилась с 0,41 до 0,29 мкМ, и при 0,3 мкМ Ca²⁺ насос работает быстрее: около 88 % от скорости без PLN вместо 59 %.", "p2b_5_w2": "Тормозит SERCA2a нефосфорилированный PLN. Фосфорилирование Ser16 снимает торможение, поэтому рост доли pSer16-PLN ускоряет, а не замедляет закачку.", "p2b_5_w3": "PLN снижает кажущееся сродство SERCA2a к Ca²⁺. При субмикромолярной [Ca²⁺], как в цитозоле при спаде Ca²⁺-транзиента, это непосредственно снижает скорость закачки.", "s2a_out": "внеклеточная среда", "s2a_cell": "кардиомиоцит мыши", "s2a_iso_l": "изопротеренол", "s2a_rec": "β-рецепторы", "s2a_gs": "Gs → AC → cAMP", "s2a_trop": "другие мишени PKA", "s2a_trop2": "поправка q (не откачка Ca²⁺)", "s2a_ser16": "Ser16", "s2a_deph": "дефосфорилирование", "s2a_thr17": "Thr17 (в модели не учтён)", "s2a_ca": "Ca²⁺ из цитозоля в СР", "s2a_prop_s": "пропранолол", "s2a_caly_s": "каликулин A", "s2a_lpp_box": "λ-фосфатаза (в лизате)", "s2a_lg_conv": "активирует / фосфорилирует / дефосфорилирует", "s2a_clock": "{m} мин", "s2a_ko": "нет PLN (PLN⁻/⁻)", "s2a_s16a": "PLN S16A", "s2a_iso_t": "Изопротеренол с 1-й мин", "s2a_iso_on": "добавлен", "s2a_iso_off": "без агониста", "s2a_iso_short": "изопротеренол", "s2a_iv_t": "Вмешательство", "s2a_iv0": "нет", "s2a_prop": "пропранолол на 8-й мин", "s2a_caly": "каликулин A с 1-й мин", "s2a_pki": "ингибитор PKA (PKI)", "s2a_tslider": "Время от начала опыта", "s2a_noPLN": "PLN нет", "s2a_noSite": "Ser16 нет (S16A)", "s2a_r_p": "Доля PLN, фосфорилированного по Ser16", "s2a_r_ps": "в модели; на блоте — полоса pSer16-PLN", "s2a_r_a": "Активность PKA, % от максимальной при изопротереноле", "s2a_r_flux": "Потоки по Ser16, vк / vф", "s2a_r_fluxs": "kк(1 − p) / kф·p; доли пула в секунду. На плато потоки равны, пока они различаются — доля меняется", "s2a_r_th": "Время полуспада свободного Ca²⁺ (транзиента)", "s2a_r_ths": "характеризует скорость удаления Ca²⁺ из цитозоля, но не силу сокращения и не длину клетки; в этих клетках до воздействий — {b} мс", "s2a_r_d": "Изменение времени полуспада Ca²⁺", "s2a_r_ds": "относительно 0 мин в этих же клетках; минус — спад свободного Ca²⁺ быстрее", "s2a_pcap": "Учебная модель, относительные величины: {c}. Время от начала опыта.", "s2a_l_p": "доля pSer16-PLN", "s2a_l_a": "активность PKA", "s2a_l_ref": "pSer16-PLN в норме с изопротеренолом (для сравнения)", "s2a_mk_iso": "+ изопротеренол", "s2a_mk_caly": "+ каликулин A", "s2a_mk_prop": "+ пропранолол", "s2a_blot_rec": "Записать дорожки 0–15 мин", "s2a_blot_lam": "Дорожка: лизат + λ-фосфатаза", "s2a_b_p": "pSer16-PLN", "s2a_b_tot": "PLN общий", "s2a_b_gapdh": "GAPDH (контроль загрузки)", "s2a_bc_wt": "N", "s2a_bc_ko": "KO", "s2a_bc_s16a": "S16A", "s2a_bl_lam": "лизат обработан λ-фосфатазой", "s2a_fk_aria": "Схема контроля: клетки лизируют, пробу делят на две части, одну обрабатывают λ-фосфатазой, другую не обрабатывают", "s2a_fk_cell": "Живые клетки", "s2a_fk_cell2": "{c}; на {m}-й мин опыта", "s2a_fk_lysis": "лизис, проба делится на две части", "s2a_fk_a": "Проба 1: без обработки", "s2a_fk_a2": "полосы pSer16-PLN и общего PLN выявлены", "s2a_fk_a2_ko": "полос PLN нет", "s2a_fk_a2_s16": "полосы pSer16-PLN нет; общий PLN выявлен", "s2a_fk_b": "Проба 2: + λ-фосфатаза", "s2a_fk_b2": "полоса pSer16-PLN исчезает, общий PLN остаётся", "s2a_fk_b2_ko": "полос PLN нет", "s2a_fk_b2_s16": "полосы pSer16-PLN по-прежнему нет; общий PLN остаётся", "s2a_fk_note": "Обработана только проба. Дорожки без обработки показывают состояние клетки до лизиса.", "s2a_c_wt_base": "Клетки без β-стимуляции: базальная активность PKA мала, PP1 удерживает долю pSer16-PLN низкой ({p}). Нефосфорилированный PLN тормозит SERCA2a, время полуспада Ca²⁺-транзиента — {th} мс.", "s2a_c_wt_base_z": "Это исходное состояние для сравнения: от него отсчитываются изменения фосфорилирования и времени полуспада Ca²⁺-транзиента.", "s2a_c_lam": "Клетки собраны на {m}-й мин опыта и лизированы. λ-фосфатазой обработана только выделенная проба, а не живая клетка: сигнал pSer16-PLN в пробе исчез, общий PLN сохранён.", "s2a_c_lam_z": "Это контроль специфичности антитела, а не вмешательство в клетку: исчезновение полосы после обработки пробы ничего не говорит о Ca²⁺-транзиенте или сокращении клетки. Состояние клетки до лизиса показывают дорожки без обработки.", "s2a_c_lam_ko": "Клетки собраны на {m}-й мин опыта и лизированы. В клетках без PLN нет ни pSer16-PLN, ни общего PLN, поэтому λ-фосфатаза полос не меняет. Обработана только проба, а не живая клетка.", "s2a_c_lam_ko_z": "Такая дорожка — отрицательный контроль антитела: полос PLN нет ни в одной пробе. Сигнал, оставшийся в клетках PLN⁻/⁻, указывал бы на неспецифическое связывание антитела.", "s2a_c_lam_s16": "Клетки собраны на {m}-й мин опыта и лизированы. В клетках PLN S16A нет серина-16, сигнала pSer16-PLN нет и без обработки, а общий PLN сохранён. Обработана только проба, а не живая клетка.", "s2a_c_lam_s16_z": "Это отрицательный контроль антитела: если бы сигнал не зависел от фосфорилирования Ser16, он остался бы и у мутанта, и после обработки.", "s2a_c_wt_rise": "Изопротеренол активировал β-рецепторы, PKA уже активна, но фосфорилирование PLN ещё нарастает: доля pSer16-PLN — {p}. Пока поток фосфорилирования больше потока дефосфорилирования, доля растёт. Время полуспада транзиента сокращается: {th} мс.", "s2a_c_wt_rise_z": "Фосфорилирование следует за активностью PKA с запаздыванием порядка τ = 1/(kк + kф): новое стационарное состояние устанавливается за минуты.", "s2a_c_wt_iso": "При изопротереноле константа фосфорилирования выросла: при полной активации PKA она в три раза больше константы дефосфорилирования. Сначала фосфорилирование преобладало; по мере накопления pSer16-PLN потоки уравновесились, и доля pSer16-PLN приблизилась к стационарному значению 0,75 (сейчас {p}). Торможение SERCA2a в основном снято; PKA фосфорилирует и другие мишени. Время полуспада Ca²⁺-транзиента сократилось с {th0} до {th} мс.", "s2a_c_wt_iso_z": "Ускоренная закачка Ca²⁺ в СР ускоряет снижение концентрации свободного Ca²⁺ в цитозоле. Скорость механического расслабления кардиомиоцита зависит как от этого снижения, так и от свойств миофиламентов, которые изменяются, в частности, при фосфорилировании тропонина I. В модели сила сокращения и длина клетки не рассчитываются. Вклад фосфоламбана в ускорение спада Ca²⁺ основной, но не единственный.", "s2a_c_wt_prop_fall": "Пропранолол, добавленный на 8-й мин, связался с β-рецепторами, активность PKA снизилась, и PP1 дефосфорилирует PLN: доля pSer16-PLN снижается ({p}), время полуспада Ca²⁺-транзиента растёт ({th} мс).", "s2a_c_wt_prop_fall_z": "После пропранолола активность PKA снижается не мгновенно и сохраняет базальный уровень, поэтому спад доли зависит и от остаточного фосфорилирования. Для отдельной оценки константы дефосфорилирования нужна быстрая полная остановка киназы, как в опыте 2б.", "s2a_c_wt_prop_done": "Через несколько минут после пропранолола доля pSer16-PLN вернулась почти к исходной ({p}), время полуспада транзиента — {th} мс, почти как до стимуляции.", "s2a_c_wt_prop_done_z": "Фосфорилирование обратимо без синтеза и разрушения белка: когда сигнал прекращается, PP1 возвращает PLN в тормозящую форму.", "s2a_c_wt_caly": "Агониста нет, но каликулин A ингибирует PP1 и PP2A: дефосфорилирование ослаблено, прежний баланс с базальной активностью PKA нарушен, и доля pSer16-PLN растёт ({p}). Остаточная активность фосфатазы сохраняется, поэтому в новом стационаре потоки снова равны (в модели доля около 0,60). Время полуспада Ca²⁺-транзиента — {th} мс.", "s2a_c_wt_caly_z": "Рост фосфорилирования не доказывает активации киназы: к тому же результату приводит ослабление фосфатазы. Каликулин A неизбирателен и повышает фосфорилирование многих белков; в модели дефосфорилирование Ser16 приписано одной PP1 — это упрощение.", "s2a_c_wt_caly_iso": "Изопротеренол активировал PKA, а каликулин A подавил PP1: доля pSer16-PLN выше, чем при одном изопротереноле ({p}); время полуспада транзиента — {th} мс.", "s2a_c_wt_caly_iso_z": "Степень фосфорилирования определяется отношением активностей киназы и фосфатазы: подавление фосфатазы повышает её даже при той же активности PKA.", "s2a_c_wt_pki": "Ингибитор PKA (пептид PKI) добавлен заранее: PKA подавлена, и изопротеренол (если он добавлен) почти не повышает долю pSer16-PLN: {p} (без ингибитора при изопротереноле — около 0,75). PLN тормозит SERCA2a, время полуспада транзиента — {th} мс.", "s2a_c_wt_pki_z": "Подавление киназы показывает, что при β-стимуляции фосфорилирование Ser16 осуществляет PKA. Для вывода о функции нужен ещё опыт с заменой аминокислотного остатка (S16A).", "s2a_c_ko_base": "В клетках без PLN торможения SERCA2a нет: даже без β-стимуляции Ca²⁺ закачивается в СР быстро, время полуспада транзиента — {th} мс (в норме около 180 мс).", "s2a_c_ko_base_z": "Нокаут показывает, что PLN тормозит SERCA2a в покое: без него спад Ca²⁺-транзиента уже в покое быстрый.", "s2a_c_ko_iso": "В клетках без PLN изопротеренол активирует PKA, но субстрата для фосфорилирования по Ser16 нет. Время полуспада Ca²⁺-транзиента сокращается лишь немного — до {th} мс — за счёт других мишеней PKA (в модели их вклад задан одной поправкой q).", "s2a_c_ko_iso_z": "Ответ на β-стимуляцию у клеток без PLN ослаблен: в норме значительная часть ускорения спада Ca²⁺ обусловлена фосфорилированием PLN, остальное — другими мишенями.", "s2a_c_ko_prop": "После пропранолола активность PKA упала, другие мишени PKA дефосфорилируются, и время полуспада транзиента возвращается к исходному для клеток без PLN ({th} мс).", "s2a_c_ko_prop_z": "Без PLN обратимый ответ на β-сигнал остаётся, но он меньше: его обеспечивают только другие мишени PKA.", "s2a_c_ko_caly": "Клетки без PLN, каликулин A без агониста: растёт фосфорилирование других мишеней PKA, время полуспада транзиента немного сокращается ({th} мс).", "s2a_c_ko_caly_z": "Ингибитор фосфатаз действует на многие белки сразу, поэтому изменение скорости спада Ca²⁺ нельзя приписать одному участку без генетического контроля.", "s2a_c_ko_caly_iso": "Клетки без PLN: изопротеренол вместе с каликулином A повышает фосфорилирование других мишеней PKA; время полуспада транзиента — {th} мс.", "s2a_c_ko_caly_iso_z": "Без PLN подавление фосфатаз лишь немного усиливает ответ: SERCA2a и без того не заторможена.", "s2a_c_ko_pki": "Клетки без PLN, PKA подавлена пептидом PKI: время полуспада транзиента — {th} мс; β-стимуляция почти не действует.", "s2a_c_ko_pki_z": "В модели быстрый базальный спад Ca²⁺ в клетках без PLN не зависит от PKA: он определяется отсутствием тормозящего белка.", "s2a_c_s16_base": "Клетки с PLN S16A (замена серина-16 на аланин на фоне PLN⁻/⁻): Ser16 нет, PLN тормозит SERCA2a, время полуспада транзиента — {th} мс.", "s2a_c_s16_base_z": "Белок PLN присутствует, но участок фосфорилирования заменён; такой опыт проверяет, необходим ли именно этот участок для ответа.", "s2a_c_s16_iso": "PKA при изопротереноле активна, но PLN S16A не фосфорилируется: торможение SERCA2a сохраняется. Время полуспада Ca²⁺-транзиента сокращается только за счёт других мишеней PKA: с {th0} до {th} мс.", "s2a_c_s16_iso_z": "Замена одного участка ослабляет ответ на β-стимуляцию: фосфорилирование Ser16 нужно для полного ускорения спада Ca²⁺. Замена на аланин показывает необходимость участка, а не его достаточность. У замены могут быть и другие последствия: после изопротеренола в сердцах мышей с PLN S16A не выявляли и фосфорилирования Thr17 (Luo 1998). Это не означает, что Thr17 у S16A невозможно фосфорилировать в других условиях: in vitro он оставался субстратом Ca²⁺–кальмодулин-зависимой киназы.", "s2a_c_s16_prop": "После пропранолола активность PKA упала, другие мишени дефосфорилируются, время полуспада транзиента возвращается к исходному ({th} мс).", "s2a_c_s16_prop_z": "У клеток с PLN S16A обратим только ответ, который идёт через другие мишени PKA.", "s2a_c_s16_caly": "Клетки с PLN S16A, каликулин A без агониста: PLN по-прежнему не фосфорилируется, растёт фосфорилирование других мишеней, время полуспада транзиента — {th} мс.", "s2a_c_s16_caly_z": "Ингибитор фосфатаз меняет состояние многих белков; Ser16 в этом опыте заменён на аланин.", "s2a_c_s16_caly_iso": "Клетки с PLN S16A: изопротеренол и каликулин A повышают фосфорилирование других мишеней PKA, но не PLN; время полуспада транзиента — {th} мс.", "s2a_c_s16_caly_iso_z": "Даже при подавленной фосфатазе торможение SERCA2a не снимается, если участок фосфорилирования заменён.", "s2a_c_s16_pki": "Клетки с PLN S16A, PKA подавлена пептидом PKI: время полуспада транзиента — {th} мс, β-стимуляция почти не действует.", "s2a_c_s16_pki_z": "Без активности PKA не фосфорилируются ни PLN, ни другие её мишени.", "s2a_take": "Роль участка фосфорилирования доказывают несколькими независимыми опытами. Фосфоспецифичное антитело с контролем λ-фосфатазой (обрабатывают пробу, а не клетку) показывает, что Ser16 фосфорилируется при β-стимуляции; специфичный ингибитор PKA (например, пептид PKI) — что фосфорилирование зависит от PKA; замена S16A — что для полного ускорения спада Ca²⁺-транзиента нужен именно этот участок, а нокаут PLN — что нужен сам белок. Скорость дефосфорилирования после подавления киназы определяется активностью фосфатазы, а ингибитор фосфатаз повышает фосфорилирование без активации киназы.", "p2a_1_q": "На блоте уже есть дорожки 0–15 мин для нормальных кардиомиоцитов с изопротеренолом. Тот же опыт повторяют на клетках с PLN S16A (на фоне PLN⁻/⁻). Какие полосы будут на новых дорожках?", "p2a_1_o1": "pSer16-PLN появится, как в норме, но позже", "p2a_1_o2": "Полосы pSer16-PLN не будет; полоса общего PLN тоже исчезнет", "p2a_1_o3": "Полосы pSer16-PLN не будет; полоса общего PLN сохранится", "p2a_1_e": "Белок PLN S16A экспрессирован (полоса общего PLN есть), но серина в положении 16 нет, и сигнала антитела к pSer16 нет. В опытах Chu 2000 на кардиомиоцитах мышей с PLN S16A фосфорилирование PLN после изопротеренола не выявлялось.", "p2a_1_w1": "Замена S16A не замедляет фосфорилирование, а исключает его: на месте серина стоит аланин без гидроксильной группы, к которой PKA могла бы присоединить фосфат.", "p2a_1_w2": "Клетки получены на фоне PLN⁻/⁻, но несут белок с заменой S16A, поэтому общий PLN на блоте есть. Нет только фосфорилирования по Ser16.", "p2a_2_q": "Кардиомиоциты с PLN S16A, до изопротеренола время полуспада Ca²⁺-транзиента 192 мс. Изопротеренол добавили на 1-й мин. Как изменится время полуспада к 10-й мин опыта?", "p2a_2_o1": "Не изменится: без Ser16 PKA не ускоряет спад Ca²⁺", "p2a_2_o2": "Сократится, но слабее, чем в норме", "p2a_2_o3": "Сократится так же, как в норме, — на 40 %", "p2a_2_e": "В модели время полуспада сокращается с 192 до 151 мс (на 22 %; в норме на 40 %). PLN S16A продолжает тормозить SERCA2a, а ускорение спада Ca²⁺ обусловлено другими эффектами β-стимуляции (в модели — одна общая поправка). В опытах Chu 2000 у мышей с PLN S16A ответ кардиомиоцитов на изопротеренол был ослаблен, но не отсутствовал.", "p2a_2_w1": "Остаётся вклад других эффектов β-стимуляции, например фосфорилирования тропонина I, которое меняет связывание Ca²⁺ с миофиламентами. Поэтому ответ ослаблен, но сохраняется.", "p2a_2_w3": "Без фосфорилирования Ser16 торможение SERCA2a не снимается, и основная часть ускорения спада Ca²⁺, наблюдаемого в норме, теряется. Ответ не может быть таким же, как в норме.", "p2a_3_q": "Нормальные кардиомиоциты: изопротеренол с 1-й мин, на 8-й мин добавили пропранолол. Доля pSer16-PLN в этот момент около 0,75. Как изменится эта доля к 14-й мин и чем определяется скорость её изменения?", "p2a_3_o1": "Снизится почти до исходной: PP1 дефосфорилирует PLN", "p2a_3_o2": "Останется высокой: фосфат удаляется только при замене белка", "p2a_3_o3": "Упадёт до нуля мгновенно вместе с активностью PKA", "p2a_3_e": "Пропранолол вытесняет агонист, активность PKA снижается примерно за минуту, и PP1 дефосфорилирует PLN: доля pSer16-PLN снижается вдвое примерно за 2 мин и к 14-й мин возвращается почти к исходной (0,15 против 0,13). Время полуспада транзиента возвращается к 176 мс.", "p2a_3_w2": "Фосфорилирование обратимо без синтеза белка: фосфатаза PP1 гидролизует фосфоэфирную связь на той же молекуле PLN.", "p2a_3_w3": "Подавление киназы само по себе не дефосфорилирует PLN, а активность PKA после пропранолола падает не мгновенно и сохраняет базальный уровень. Доля pSer16-PLN снижается за минуты, по мере того как PP1 дефосфорилирует PLN.", "p2a_4_q": "Нормальные кардиомиоциты без агониста; доля pSer16-PLN 0,13. С 1-й мин добавили каликулин A (ингибитор PP1 и PP2A). Какой будет доля pSer16-PLN к 15-й мин?", "p2a_4_o1": "Прежней: без агониста PKA не фосфорилирует фосфоламбан", "p2a_4_o2": "Выше, около 0,5: активность фосфатазы снижена", "p2a_4_o3": "Ниже: каликулин A подавляет фосфорилирование PLN киназой PKA", "p2a_4_e": "В покое PKA обладает небольшой базальной активностью, а PP1 удерживает долю pSer16-PLN низкой: потоки равны уже при малой доле (около 0,13). Каликулин A ослабляет дефосфорилирование (в модели константа уменьшена в 10 раз, но не равна нулю), поэтому прежний баланс нарушен и доля растёт. Остаточная активность фосфатазы сохраняется, и в новом стационаре потоки снова равны: доля стремится к 0,60 и к 15-й мин составляет около 0,54. Рост фосфорилирования здесь вызван ослаблением фосфатазы, а не активацией киназы. Каликулин A ингибирует PP1 и PP2A; отнесение дефосфорилирования Ser16 к одной PP1 — упрощение модели.", "p2a_4_w1": "Базальная активность PKA не равна нулю. Без агониста низкая доля pSer16-PLN поддерживается фосфатазой PP1, и подавление PP1 эту долю повышает.", "p2a_4_w3": "Каликулин A — ингибитор серин-треониновых фосфатаз PP1 и PP2A; на PKA он непосредственно не действует. Его эффект на PLN — рост, а не снижение фосфорилирования.", "p2a_5_q": "Лизат нормальных кардиомиоцитов, взятый на 10-й мин опыта с изопротеренолом, перед электрофорезом обработали λ-фосфатазой. Что изменится на этой дорожке блота по сравнению с необработанным лизатом?", "p2a_5_o1": "Исчезнет только полоса pSer16-PLN; полосы общего PLN и GAPDH сохранятся", "p2a_5_o2": "Исчезнут обе полосы PLN — и pSer16-PLN, и общего белка; GAPDH сохранится", "p2a_5_o3": "Полоса pSer16-PLN станет сильнее, остальные не изменятся", "p2a_5_e": "λ-фосфатаза отщепляет фосфатные группы от остатков серина, треонина и тирозина белков лизата, но не разрушает сами белки. Если антитело распознаёт именно фосфорилированный Ser16, его полоса исчезает, а полосы общего PLN и GAPDH остаются. Это стандартный контроль специфичности фосфоспецифичного антитела. Обрабатывают только пробу после лизиса: живая клетка до лизиса отвечала на изопротеренол, и исчезновение полосы в пробе ничего не говорит о Ca²⁺-транзиенте самой клетки.", "p2a_5_w2": "Фосфатаза не протеаза: она отщепляет фосфатные группы, а белок PLN остаётся в лизате, и антитело к общему PLN его выявляет.", "p2a_5_w3": "λ-фосфатаза удаляет фосфат, а не добавляет его. Сигнал антитела к фосфорилированной ф
