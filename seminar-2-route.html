/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   Сеть митохондрий клетки — общая длина M = 120 мкм (постоянна: биогенез и митофагия не учитываются),
   разделённая на n органелл (1 ≤ n ≤ nMax = M / 0,5 мкм). Средняя длина = M / n.
   Частота делений в клетке:   Fдел = kдел · M · (1 − n/nMax)   (делится любой участок, кроме предельно мелких фрагментов);
   частота слияний в клетке:   Fсл  = kсл · (n − 1)            (сливаться может каждая органелла, если в клетке их больше одной);
   разбавление при росте и делении клеток: g · n, g = 0,0006 мин⁻¹ (удвоение культуры примерно за 19 ч; масса сети на клетку
   постоянна, потому что биогенез восполняет разбавление). Без этого члена в клетках без слияния деление в модели останавливалось бы.
   Ползунки задают константы скоростей (kсл — на органеллу, kдел — на единицу длины сети); частоты событий в клетке зависят
   ещё и от числа органелл. Если обе константы равны нулю, стационара нет (см. basic).
   Стационар:  n* = (kдел·M + kсл) / (kсл + g + kдел·M/nMax). Пока g мало по сравнению с kсл, n* задаётся почти только
   отношением скоростей, а число событий в минуту — их абсолютными значениями (Chen 2005: одновременное ослабление обоих
   процессов сохраняет форму сети; Sesaki и Jensen 1999 — у дрожжей без Dnm1 и Fzo1 форма сети нормальная).
   Нормальные скорости (учебные): kсл = 0,05 мин⁻¹ на органеллу, kдел = 0,0125 мкм⁻¹·мин⁻¹ → n* ≈ 28, средняя длина ≈ 4,4 мкм.
   2а. Эмбриональные фибробласты мыши (MEF). Генотип задаёт множители скоростей (fс — слияния, fд — деления):
     норма 1/1; Mfn1⁻/⁻Mfn2⁻/⁻ — слияния нет (Chen 2003, 2005); Mfn2⁻/⁻ — слияние снижено, но сохранено (учебное 25 %, Chen 2005);
     Opa1⁻/⁻ — слияния нет (Song 2007; Chen 2005 — РНК-интерференция OPA1); Drp1⁻/⁻ — частота делений ниже в 17 раз (Wakabayashi 2009);
     Mff⁻/⁻ — деление снижено (учебное 30 %; Losón 2013, Otera 2010). Подавление DRP1 (siRNA) — учебное ×0,25.
     CCCP с 0 мин: потенциал снимается; OMA1 переводит длинную форму OPA1 в короткую (τ = 10 мин, учебное; Head 2009, Ehses 2009),
     слияние ∝ доле длинной формы (Song 2007, Anand 2014); количество DRP1 на наружной мембране ×1,8 (учебное; Cereghetti 2008).
     Морфология через 60 мин рассчитывается во времени (Эйлер, шаг 0,25 мин) от стационара данных клеток.
   Доля клеток с фрагментированной сетью (клетки культуры различаются) — учебная зависимость 1 / (1 + (L/2,5)^2,5).
   Обмен матриксным маркером: фотоактивировано 23 % сети (как у Anand 2014), доля сети с маркером растёт как
   dl/dt = kсл · l · (1 − l). Потенциал, дыхание, формы OPA1, DRP1 на мембране, пероксисомы — таблица учебных величин
   с направлением изменений по названным работам. */
const M2 = (() => {
  const P = { M: 120, Lmin: 0.5, g: 0.0006, kf0: 0.1, kd0: 0.025, T: 60, dt: 0.25, l0: 0.23, L50: 2.5, h: 2.5, tauOMA: 10, drpCCCP: 1.8, si: 0.25 };
  const nMax = P.M / P.Lmin;
  /* стационарное число органелл; null — оба процесса остановлены: стационара, заданного скоростями, нет (аудит v1.0, S01) */
  function steadyN(kf, kd){
    if (kf === 0 && kd === 0) return null;
    const n = (kd * P.M + kf) / (kf + P.g + kd * P.M / nMax);
    return Math.max(1, Math.min(nMax, n));
  }
  const meanL = n => P.M / n;
  const fusRate = (kf, n) => kf * (n - 1);
  const fisRate = (kd, n) => kd * P.M * (1 - n / nMax);
  const frag = L => 1 / (1 + Math.pow(L / P.L50, P.h));
  const netClass = L => L < 2 ? 'frag' : L < 8 ? 'mid' : 'long';
  /* 2б: доли ползунков 0…1 → константы скоростей и показания стационара.
     Если обе машины остановлены, стационар не определён: сеть сохраняется такой, какой была в момент остановки (nPrev —
     число органелл в последнем состоянии; без него — норма). Рост и биогенез за это время модель не описывает. */
  function basic(sf, sd, nPrev){
    const kf = P.kf0 * sf, kd = P.kd0 * sd;
    if (kf === 0 && kd === 0){
      const n = nPrev ?? steadyN(P.kf0 / 2, P.kd0 / 2), L = meanL(n);
      return { kf, kd, n, L, fus: 0, fis: 0, mixT: Infinity, frag: frag(L), cls: netClass(L), stop: true };
    }
    const n = steadyN(kf, kd), L = meanL(n);
    return { kf, kd, n, L, fus: fusRate(kf, n), fis: fisRate(kd, n), mixT: kf > 0 && n > 1.5 ? 1 / kf : Infinity, frag: frag(L), cls: netClass(L), stop: false };
  }
  /* 2а: генотипы MEF */
  const G = {
    wt:   { f: 1,    d: 1,    low: 0.05, resp: 1.00, opa: true,  drp: 1,   px: 1 },
    mfn:  { f: 0,    d: 1,    low: 0.35, resp: 0.55, opa: true,  drp: 1,   px: 1 },
    mfn2: { f: 0.25, d: 1,    low: 0.08, resp: 0.90, opa: true,  drp: 1,   px: 1 },
    opa1: { f: 0,    d: 1,    low: 0.35, resp: 0.50, opa: false, drp: 1,   px: 1 },
    drp1: { f: 1,    d: 1/17, low: 0.05, resp: 1.00, opa: true,  drp: 0,   px: 4 },
    mff:  { f: 1,    d: 0.30, low: 0.05, resp: 1.00, opa: true,  drp: 0.3, px: 3 },
  };
  const L_OPA = 0.55;   // доля длинной формы OPA1 в покое (учебная; обе формы присутствуют — Song 2007, Anand 2014)
  function cell(geno, drug){
    const g = G[geno], si = drug === 'si' && geno !== 'drp1' ? P.si : 1;
    const kf = P.kf0 / 2 * g.f, kd = P.kd0 / 2 * g.d * si;
    const n0 = steadyN(kf, kd);
    let n = n0, l = P.l0, Lfrac = 1, t = 0;
    const cccp = drug === 'cccp';
    const drpM = g.drp * si * (cccp && g.drp > 0 ? P.drpCCCP : 1);
    let kfT = kf, kdT = kd * (cccp && g.drp > 0 ? P.drpCCCP : 1);   /* остаточное деление без DRP1 от привлечения DRP1 не зависит (рецензия, находка 1) */
    for (; t < P.T - 1e-9; t += P.dt){
      if (cccp) Lfrac = Math.exp(-(t + P.dt) / P.tauOMA);
      kfT = kf * Lfrac;
      n += P.dt * (fisRate(kdT, n) - fusRate(kfT, n) - P.g * n); n = Math.max(1, Math.min(nMax, n));
      l += P.dt * kfT * l * (1 - l);
    }
    const L = meanL(n);
    const opaL = g.opa ? L_OPA * Lfrac : 0, opaS = g.opa ? 1 - L_OPA * Lfrac : 0;
    return { kf: kfT, kd: kdT, n0, n, L, frag: frag(L), cls: netClass(L), fus: fusRate(kfT, n), fis: fisRate(kdT, n),
             mark: l, low: cccp ? 0.97 : g.low, resp: g.resp * (cccp ? 1.7 : 1), opaL, opaS, opa: g.opa, drpM, drpPresent: g.drp > 0,
             px: drug === 'si' && geno !== 'drp1' ? (g.px === 1 ? 2 : Math.min(4, g.px + 1)) : g.px };
  }
  return { P, nMax, steadyN, meanL, fusRate, fisRate, frag, netClass, basic, G, cell, L_OPA };
})();


/* модель вопроса 3 (из src/s3.js) */

/* Модель вопроса 3 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   3b. Идеальная модель фазового разделения с одним эффективным каркасным компонентом (смесь двух мультивалентных каркасных белков 1 : 1,
       как SH3ₙ + PRMₙ у Li 2012). Ниже концентрации насыщения Cнас — только однородный раствор; выше —
       концентрация в разбавленной фазе остаётся равной Cнас, избыток уходит в плотную фазу (правило рычага).
       Концентрация в плотной фазе Cпл = 100·Cнас (в экспериментах Li 2012 белки в каплях были концентрированы в 82–116 раз).
       Объёмная доля капель φ = (c − Cнас)/(Cпл − Cнас); доля молекул в плотной фазе = φ·Cпл/c.
       Cнас при 3, 4 и 5 модулях — 120, 60 и 30 мкМ; при 2 модулях в диапазоне 0–200 мкМ капли не образуются.
       Это учебные величины: Li 2012 показали, что порог снижается с ростом валентности, но наши числа подобраны
       для наглядности. В многокомпонентной клетке концентрация разбавленной фазы не остаётся строго постоянной (Riback 2020).
   3a. Четыре структуры, одинаково выглядящие как яркий фокус (McSwiggen 2019), и ответы на шесть экспериментов.
       FRAP: восстановление f(t) = mf·(1 − 2^(−t/t½)) (доля от исходной яркости; учебные величины).
       Созревание капель FUS (in vitro): подвижная фракция mf(h) = 0,05 + 0,85·exp(−h/τ), τ = 10 ч у белка дикого типа
       и 2,5 ч у FUS G156E (учебные величины; качественно — по Patel 2015: капли с G156E переходят в
       твёрдоподобное состояние быстрее). */
const M3 = (() => {
  const CSAT = { 2: Infinity, 3: 120, 4: 60, 5: 30 }, ENR = 100, CMAX = 200;
  function phase(c, v){
    const cs = CSAT[v];
    if (!(c > cs)) return { csat: cs, dil: c, phi: 0, fd: 0, sep: false };
    const cd = ENR * cs, phi = (c - cs) / (cd - cs);
    return { csat: cs, dil: cs, phi, fd: phi * cd / c, sep: true, cden: cd };
  }
  /* 3a: четыре структуры. frap: [подвижная фракция, время полувосстановления, с]; остальные — класс результата эксперимента */
  const ST = {
    cond: { frap: [0.9, 5],  dil: 'gone', fuse: 'merge', mem: 'no',  arom: 'gone', hex: 'gone' },
    cplx: { frap: [0.85, 8], dil: 'dim',  fuse: 'touch', mem: 'no',  arom: 'kept', hex: 'kept' },
    org:  { frap: [0.8, 3],  dil: 'dim',  fuse: 'touch', mem: 'yes', arom: 'kept', hex: 'kept' },
    agg:  { frap: [0.05, null], dil: 'same', fuse: 'touch', mem: 'no', arom: 'kept', hex: 'kept' },
  };
  const MYST = ['cplx', 'cond', 'agg', 'org'];         // фокусы 1–4 в режиме загадки
  const EXPS = ['frap', 'dil', 'fuse', 'mem', 'arom', 'hex'];
  function result(st, exp){
    const r = ST[st];
    if (exp === 'frap') return { cls: r.frap[0] > 0.3 ? 'fast' : 'none', mf: r.frap[0], th: r.frap[1] };
    return { cls: r[exp] };
  }
  const frapAt = (mf, th, s) => th ? mf * (1 - Math.pow(2, -s / th)) : mf * Math.min(1, s / 60);
  /* созревание FUS */
  const TAU = { wt: 10, g156e: 2.5 };
  function mature(v, h){
    const mf = 0.05 + 0.85 * Math.exp(-h / TAU[v]);
    const th = 5 + 20 * (1 - (mf - 0.05) / 0.85);   // по мере созревания обмен и замедляется
    return { mf, th, state: mf > 0.6 ? 'liq' : mf > 0.25 ? 'mid' : 'sol' };
  }
  return { CSAT, ENR, CMAX, phase, ST, MYST, EXPS, result, frapAt, TAU, mature };
})();


/* модель вопроса 4 (из src/s4.js) */

/* Модель вопроса 4 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   4b. Мембрана клетки как окружность длиной C = 30 мкм (учебная клетка диаметром около 10 мкм). Мембранный белок
       доставляется пузырьками: доля p — к полюсу (гауссово распределение шириной σ = 1 мкм), остальное — равномерно по
       всей мембране; поток доставки Q постоянен. Белок диффундирует в мембране (D = 0,1 мкм²/с — порядок величины для мембранного белка животной клетки, учебная оценка) и удаляется эндоцитозом с константой k по всей мембране.
       Стационар уравнения D·c'' − k·c + s(x) = 0 на окружности находится точно: функция Грина
       G(x) = λ·ch((C/2 − |x|)/λ) / (2D·sh(C/(2λ))), λ = √(D/k) — длина спада. Баланс массы: белка на мембране Q/k.
       Так поддерживают полярность дрожжи (Valdez-Taubas и Pelham 2003; Marco 2007): домен — стационар доставки,
       диффузии и эндоцитоза, а не неподвижная структура. Числа условны.
   4a. Эпителиальная клетка (энтероцит, клетки Caco-2): апикальный груз NHE3, доставка которого зависит от Rab11 и
       миозина Vb, и груз сравнения DPPIV, доставляемый другим путём (Vogel 2015). Компартменты: A — апикальная мембрана,
       B — базолатеральная, R — рециклирующие эндосомы (Rab11), V — пузырьки, не доставленные к мембране.
       Потоки (в минуту, учебные): синтез 1; NHE3 из Гольджи 85 % в R, 15 % на B; DPPIV 90 % прямо на A, 10 % на B;
       R → A 0,5 (без миозина Vb — 20 % от этого, остальное R → V); R → B 0,02; деградация из R 0,02, из V 0,06;
       эндоцитоз с A 0,05 (DPPIV 0,01), с B 0,2 — ошибочно доставленный белок удаляется быстро; латеральная утечка
       через область контакта 0,002 (без тяжей плотного контакта — 0,008: допущение модели).
       Генотипы и груз — стационарное состояние. Ингибитор эндоцитоза (динамин; эндоцитоз ×0,1) — отдельная чашка, которая
       стартует из стационара без ингибитора и считается 4 ч. Трансэпителиальное сопротивление — отдельная величина
       барьера: без клаудинов около 30 % от нормы (Otani 2019, клетки MDCK II); для клеток без миозина Vb не
       рассчитывается; ингибитор в модели барьер не меняет (допущение). */
const M4 = (() => {
  const P = { C: 30, D: 0.1, sig: 1, NB: 120, Q: 1 };
  const KE = [0.0005, 0.001, 0.002, 0.003, 0.005, 0.007, 0.01, 0.015, 0.02];   // константы эндоцитоза, с⁻¹
  const K0 = 4, P0 = 0.9;                                                         // исходное состояние: k = 0,005 с⁻¹, 90 % к полюсу
  const lam = k => Math.sqrt(P.D / k);
  function profile(p, k){
    const L = lam(k), dx = P.C / P.NB, xs = [...Array(P.NB)].map((_, i) => -P.C / 2 + (i + 0.5) * dx);
    const G = x => { x = Math.abs(x) % P.C; if (x > P.C / 2) x = P.C - x; return L * Math.cosh((P.C / 2 - x) / L) / (2 * P.D * Math.sinh(P.C / (2 * L))); };
    const g = xs.map(x => Math.exp(-x * x / (2 * P.sig * P.sig))), gs = g.reduce((a, b) => a + b, 0);
    const c = xs.map(x => (1 - p) * P.Q / (P.C * k) + p * P.Q * xs.reduce((s, xj, j) => s + g[j] / gs * G(x - xj), 0));
    const total = c.reduce((a, b) => a + b, 0) * dx;
    const pole = Math.max(...c), opp = Math.min(...c);
    return { xs, c, lam: L, contrast: pole / opp, total, pole, opp };
  }
  const total0 = () => P.Q / KE[K0];
  /* время прохода расстояния x диффузией, оценка t ≈ x²/4D */
  const tDiff = x => x * x / (4 * P.D);
  /* --- 4a --- */
  const E = { S: 1, fAn: 0.85, fAd: 0.9, kRA: 0.5, res: 0.2, kRB: 0.02, kRd: 0.02, kVd: 0.06, kAeN: 0.05, kAeD: 0.01, kBe: 0.2,
              kL: 0.002, kLc: 0.008, dyn: 0.1, T: 240, terC: 0.3 };
  function solve(M, b){ const n = b.length, a = M.map((r, i) => [...r, b[i]]);
    for (let i = 0; i < n; i++){ let q = i; for (let j = i + 1; j < n; j++) if (Math.abs(a[j][i]) > Math.abs(a[q][i])) q = j; [a[i], a[q]] = [a[q], a[i]];
      for (let j = 0; j < n; j++) if (j !== i){ const f = a[j][i] / a[i][i]; for (let k = i; k <= n; k++) a[j][k] -= f * a[i][k]; } }
    return a.map((r, i) => r[n] / r[i]); }
  function rates(c, drugOn){
    const nhe = c.cargo === 'nhe3', m5 = c.geno !== 'myo5b', d = drugOn ? E.dyn : 1;
    return { rRA: nhe ? (m5 ? E.kRA : E.kRA * E.res) : E.kRA, rAV: nhe && !m5 ? E.kRA * (1 - E.res) : 0,
             kAe: (nhe ? E.kAeN : E.kAeD) * d, kBe: E.kBe * d, kL: c.geno === 'cldn' ? E.kLc : E.kL,
             sR: nhe ? E.S * E.fAn : 0, sA: nhe ? 0 : E.S * E.fAd, sB: E.S * (1 - (nhe ? E.fAn : E.fAd)) };
  }
  function deriv(x, r){ const [A, B, R, V] = x;
    return [r.sA + r.rRA * R - r.kAe * A - r.kL * A + r.kL * B,
            r.sB + E.kRB * R - r.kBe * B - r.kL * B + r.kL * A,
            r.sR + r.kAe * A + r.kBe * B - (r.rRA + r.rAV + E.kRB + E.kRd) * R,
            r.rAV * R - E.kVd * V]; }
  function steady(c){ const r = rates(c, false);
    const M = [[-(r.kAe + r.kL), r.kL, r.rRA, 0], [r.kL, -(r.kBe + r.kL), E.kRB, 0], [r.kAe, r.kBe, -(r.rRA + r.rAV + E.kRB + E.kRd), 0], [0, 0, r.rAV, -E.kVd]];
    return solve(M, [-r.sA, -r.sB, -r.sR, 0]); }
  function epi(c){
    let x = steady(c);
    if (c.drug === 'dyn'){ const r = rates(c, true), dt = 0.05; for (let t = 0; t < E.T; t += dt){ const d = deriv(x, r); x = x.map((v, i) => v + dt * d[i]); } }
    const [A, B, R, V] = x, T = A + B + R + V;
    return { A: A / T, B: B / T, In: (R + V) / T, R: R / T, V: V / T, ter: c.geno === 'cldn' ? E.terC : (c.geno === 'myo5b' ? null : 1) };
  }
  /* целые проценты трёх долей, сумма ровно 100 (метод наибольших остатков): числа на экране складываются */
  function pct3(r){
    const v = [r.A, r.B, r.In].map(x => x * 100), f = v.map(Math.floor); let rest = 100 - f.reduce((a, b) => a + b, 0);
    v.map((x, i) => [x - f[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0){ f[i]++; rest--; } });
    return { a: f[0], b: f[1], i: f[2] };
  }
  return { P, KE, K0, P0, lam, profile, total0, tDiff, E, epi, steady, pct3 };
})();


/* =====================================================================
   Схемы страницы объяснений семинара 2 (общая часть). Каждая схема — функция W.<kind>; kind задаётся в lesson.widget.kind.
   Все подписи берутся из lesson.widget.s (в коде — S); в коде нет учебных формулировок.
   Модели M1…M4 — те же функции, что в практикуме (копируются при сборке из src/s1…s4.js),
   поэтому числа в объяснениях и в практикуме совпадают.
   ===================================================================== */
const C4 = { blue: '#145c96', orange: '#c3662f', teal: '#007b72', red: '#ae3347', gray: '#9db4c8', ink: '#152c45', amber: '#c98a0b', amberFill: '#fbe9c2', purple: '#6748b6', muted: '#6b7c8f' };
const n1 = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const p0 = x => Math.round(100 * x) + nb + '%';

/* стрелка или линия с поперечиной по квадратичной кривой: [x1,y1,x2,y2] или [x1,y1,cx,cy,x2,y2] */
function edge4(pts, type, faded){
  const c = { act: C4.blue, inh: C4.red, move: C4.muted, syn: C4.purple, bind: C4.teal }[type] || C4.blue;
  const dash = type === 'move' ? '6 5' : type === 'syn' ? '2 5' : type === 'dbt' ? '7 5' : '';
  const op = faded ? 0.22 : 1;
  let d, x2, y2, ax, ay;
  if (pts.length === 4){ [, , x2, y2] = pts; d = `M${pts[0]} ${pts[1]} L${x2} ${y2}`; ax = pts[0]; ay = pts[1]; }
  else { const [x1, y1, cx, cy] = pts; [, , , , x2, y2] = pts; d = `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`; ax = cx; ay = cy; }
  const a = Math.atan2(y2 - ay, x2 - ax);
  let head;
  if (type === 'inh') { const px = -Math.sin(a) * 9, py = Math.cos(a) * 9; head = `<line x1="${x2 - px}" y1="${y2 - py}" x2="${x2 + px}" y2="${y2 + py}" stroke="${c}" stroke-width="4"/>`; }
  else if (type === 'bind') head = `<circle cx="${x2}" cy="${y2}" r="4" fill="${c}"/>`;
  else { const L = 11, d1 = a + 2.6, d2 = a - 2.6; head = `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`; }
  return `<g opacity="${op}"><path d="${d}" fill="none" stroke="${c}" stroke-width="3"${dash ? ` stroke-dasharray="${dash}"` : ''}/>${head}</g>`;
}
const pBadge = (x, y) => circ(x, y, 10, '#f0b84a', 'stroke="#c98a0b" stroke-width="1.5"') + tx(x, y + 4, 'P', 11, 'middle');
/* узел сети: состояние on (активен, жёлтый), cur (текущая форма неактивного белка: синяя рамка, без заливки), off, miss (нет: пунктир и крест), inh (подавлен фосфорилированием: пунктир) */
function node4(n, st){
  const on = st.on.includes(n.id), miss = st.miss.includes(n.id), inh = (st.inh || []).includes(n.id), cur = (st.cur || []).includes(n.id);
  const fill = on ? C4.amberFill : '#fff', stroke = on ? C4.amber : cur ? C4.blue : miss ? '#9aa7b3' : '#6d8ba5';
  let d = box(n.x, n.y, n.w, n.h || 40, n.label, { fill, stroke, dash: miss || inh ? '6 5' : '', size: n.fs || 15, sw: on || cur ? 3 : 2 });
  if (miss) d += cross(n.x + n.w - 8, n.y + 8);
  if ((st.p || []).includes(n.id)) d += pBadge(n.x + n.w, n.y + 2);
  return d;
}

/* Сеть с переключаемыми состояниями. S.nodes (необязательно only: [номера режимов, где узел рисуется], not: [номера режимов, где не рисуется]), S.edges (id, pts, type), S.states[i] = {on, miss, inh, p, show (рёбра активны), hide (рёбра скрыты), drugs [[x,y,текст]], note, metrics [[подпись, значение]]} */
W.net = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('net-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const st = Object.assign({ on: [], miss: [], inh: [], p: [], show: [], hide: [], drugs: [], areas: [] }, S.states[s.mode]);
    let d = (S.areas || []).map(a => a.kind === 'nuc' ? `<ellipse cx="${a.x}" cy="${a.y}" rx="${a.rx}" ry="${a.ry}" fill="#eef0f7" stroke="#97a0ba" stroke-width="2.5"/>` + tx(a.lx, a.ly, a.label, 14, 'middle')
      : a.kind === 'mem' ? line(0, a.y, S.w || 640, a.y, '#556171', 4) + tx(a.lx, a.ly, a.label, 14, 'start') : tx(a.x, a.y, a.label, 14, a.anchor || 'start')).join('');
    S.edges.forEach(e => { if (st.hide.includes(e.id)) return; d += edge4(e.pts, e.type, !st.show.includes(e.id)); if (e.label) d += tx(e.lx, e.ly, e.label, 13, 'middle'); });
    S.nodes.forEach(n => { if ((n.only && !n.only.includes(s.mode)) || (n.not && n.not.includes(s.mode))) return; d += node4(n, st); });
    st.drugs.forEach(([x, y, t]) => { d += rect(x - 6, y - 15, t.length * 8.6 + 12, 22, C4.red, 11) + tx(x, y + 1, t, 13, 'start').replace('<text ', '<text style="fill:#fff;font-weight:700" '); });
    const m = st.metrics ? `<div class="metrics${st.metrics.length === 2 ? ' two' : ''}">${st.metrics.map(([a, b]) => metric(a, b)).join('')}</div>` : '';
    out(svg(d, S.title, S.h || 300, S.w || 640, st.note), m + result(`<p>${esc(st.note)}</p>`) + (S.legend ? `<p class="quiet">${esc(S.legend)}</p>` : ''));
  };
  onGroup('net-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Таблица с переключаемыми вариантами: S.tables[i] = {head, rows, note} */
W.table = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('tab-mode', S.modes, s.mode, S.modes_label));
  const draw = () => { const T = S.tables[s.mode]; out(tbl(T.head, T.rows), result(`<p>${esc(T.note)}</p>`)); };
  onGroup('tab-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Схемы методов: S.schemes[i] = {draw: <имя функции MTH>|'table', l: {подписи}, data, note, h, (head, rows для table)}.
   Функции рисования MTH добавляются в widgets_q*.js через Object.assign(MTH, {...}). */
const MTH = {
  tl(x, y, str, size = 14, anchor = 'middle'){ return String(str).split('\n').map((t, i) => tx(x, y + i * size * 1.25, t, size, anchor)).join(''); },
  panel(x, y, letter, title){ return tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + tx(x + 22, y, title, 15, 'start'); },
};
W.method = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('mth-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const sc = S.schemes[s.mode];
    if (sc.draw === 'table') { out(tbl(sc.head, sc.rows), result(`<p>${esc(sc.note)}</p>`)); return; }
    const body = MTH[sc.draw](sc.l, sc.data);
    out(svg(body, S.modes[s.mode], sc.h || 300, 640, sc.note), result(`<p>${esc(sc.note)}</p>`) + (sc.legend ? `<p class="quiet">${esc(sc.legend)}</p>` : ''));
  };
  onGroup('mth-mode', i => { s.mode = i; draw(); });
  draw();
};

/* =====================================================================
   Схемы раздела 1 (транспорт по цитоскелету). Новые W.<kind> с префиксом q1 и методы MTH.
   Числа берутся из модели практикума M1 (копируется из src/s1.js); подписи — только из lesson.widget.s.
   ===================================================================== */

/* Мотор и трек: пять треков со знаками концов, распределение грузов по пяти зонам (M1.zones, как в практикуме 1б) */
W.q1tracks = ({ S, s, set, out, onGroup }) => {
  s.seg ??= 0; s.mot ??= 1;
  const SEGS = ['cell', 'axon', 'dend'], MOTS = ['none', 'kin', 'dyn'];
  const ORI = { cell: [1, 1, 1, 1, 1], axon: [1, 1, 1, 1, 1], dend: [1, -1, 1, 1, -1] };
  set(S.title, S.status, buttonGroup('q1t-seg', S.segs, s.seg, S.seg_label) + buttonGroup('q1t-mot', S.mots, s.mot, S.mot_label));
  const draw = () => {
    const seg = SEGS[s.seg], mot = MOTS[s.mot], z = M1.zones(seg, mot), f = M1.outFrac(seg, mot);
    const X0 = 80, X1 = 560, Y = [56, 84, 112, 140, 168];
    let d = tx(X0 - 30, 30, S.near[s.seg], 14, 'start').replace('<text ', '<text style="font-weight:700" ') +
            tx(X1 + 30, 30, S.far[s.seg], 14, 'end').replace('<text ', '<text style="font-weight:700" ');
    Y.forEach((y, i) => { const o = ORI[seg][i];
      d += line(X0, y, X1, y, '#556171', 4) + tx(X0 - 16, y + 5, o > 0 ? '−' : '+', 16, 'middle') + tx(X1 + 16, y + 5, o > 0 ? '+' : '−', 16, 'middle');
      if (mot !== 'none'){ const dir = (mot === 'kin' ? 1 : -1) * o, xm = (X0 + X1) / 2 + (i - 2) * 40;
        d += arrow(xm - dir * 40, y - 12, xm + dir * 40, y - 12, mot === 'kin' ? C4.teal : C4.purple, 2.5, '6 5'); } });
    const w = (X1 - X0) / 5;
    d += tx(320, 206, S.zones, 13, 'middle');
    z.forEach((v, i) => { const h = 70 * v / 0.5, x = X0 + i * w + 8;
      d += rect(x, 290 - h, w - 16, h, C4.amberFill, 4, `stroke="${C4.amber}" stroke-width="1.5"`) + tx(x + (w - 16) / 2, 282 - h, Math.round(v * 100) + nb + '%', 13, 'middle'); });
    d += line(X0, 290, X1, 290, '#556171', 1.5);
    const note = S.notes[s.seg][s.mot];
    out(svg(d, S.title, 300, 640, note),
      `<div class="metrics two">${metric(S.m_out, f == null ? S.none : Math.round(f * 100) + nb + '%')}${metric(S.m_far, Math.round(z[4] * 100) + nb + '%')}</div>` + result(`<p>${esc(note)}</p>`));
  };
  onGroup('q1t-seg', i => { s.seg = i; draw(); });
  onGroup('q1t-mot', i => { s.mot = i; draw(); });
  draw();
};

/* Две гипотезы двунаправленного движения: путь к окончанию и к телу нейрона по M1.sim (как в мысленном эксперименте практикума 1п) */
W.q1bidir = ({ S, s, set, out, onGroup }) => {
  s.hyp ??= 0; s.dyn ??= 0;
  set(S.title, S.status, buttonGroup('q1b-hyp', S.hyps, s.hyp, S.hyp_label) + buttonGroup('q1b-dyn', S.dyns, s.dyn, S.dyn_label));
  const draw = () => {
    const c = { geno: s.dyn ? 'dyn' : 'wt', drug: '0', act: false, hyp: s.hyp ? 'coord' : 'tug' };
    const r = M1.sim(c), r0 = M1.sim({ geno: 'wt', drug: '0', act: false, hyp: 'tug' });
    const mx = 300, bar = (y, v, v0, lab, col) => {
      const w = 330 * v / mx, w0 = 330 * v0 / mx;
      return tx(14, y - 6, lab, 15, 'start') + rect(14, y, w, 26, col, 4) + line(14 + w0, y - 4, 14 + w0, y + 30, '#556171', 2, 'stroke-dasharray="4 3"') +
        tx(20 + w, y + 19, Math.round(v) + '', 15, 'start');
    };
    let d = tx(14, 20, S.unit, 14, 'start');
    d += bar(56, r.ant, r0.ant, S.ant, C4.teal) + bar(120, r.ret, r0.ret, S.ret, C4.purple);
    d += tx(14, 184, S.mot + ': ' + Math.round(r.motile * 100) + nb + '%', 15, 'start');
    const note = S.notes[s.hyp][s.dyn];
    out(svg(d, S.title, 200, 420, note), result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q1b-hyp', i => { s.hyp = i; draw(); });
  onGroup('q1b-dyn', i => { s.dyn = i; draw(); });
  draw();
};

/* Кимограмма митохондрий в аксоне по M1.sim (те же условия и числа, что в практикуме 1п) */
W.q1axon = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  const C = [{ geno: 'wt', act: false }, { geno: 'wt', act: true }, { geno: 'miro', act: true }, { geno: 'snph', act: false }, { geno: 'snph', act: true }];
  set(S.title, S.status, buttonGroup('q1a-mode', S.modes, s.mode, S.mode_label));
  const draw = () => {
    const c = Object.assign({ drug: '0', hyp: 'tug' }, C[s.mode]), r = M1.sim(c), A = M1.A;
    const X0 = 70, X1 = 610, Y0 = 20, Y1 = 260, kx = x => X0 + (X1 - X0) * x / A.L, ky = t => Y0 + (Y1 - Y0) * t / A.T;
    let d = rect(X0, Y0, X1 - X0, Y1 - Y0, '#10151b', 0);
    if (c.act) d += rect(kx(A.z0), ky(A.tAct), kx(A.z1) - kx(A.z0), Y1 - ky(A.tAct), C4.amber, 0, 'opacity="0.25"') + line(kx(A.z0) - 20, ky(A.tAct), kx(A.z1) + 20, ky(A.tAct), C4.amber, 2, 'stroke-dasharray="5 4"');
    r.mito.forEach(o => { let seg = [];
      const flush = () => { if (seg.length > 1) d += `<polyline points="${seg.join(' ')}" fill="none" stroke="#e8c21a" stroke-width="1.2" opacity="0.85"/>`; seg = []; };
      o.track.forEach((p, i) => { if (p === null) { flush(); return; } if (i % 3 === 0 || i === o.track.length - 1) seg.push(kx(p[1]).toFixed(1) + ',' + ky(p[0]).toFixed(1)); });
      flush(); });
    [0, 2, 4, 6, 8, 10].forEach(m => { d += tx(X0 - 8, ky(m * 60) + 4, String(m), 12, 'end'); });
    [0, 50, 100, 150].forEach(x => { d += tx(kx(x), Y1 + 16, String(x), 12, 'middle'); });
    d += tx(X0 - 40, (Y0 + Y1) / 2, S.y, 12, 'middle').replace('<text ', `<text transform="rotate(-90 ${X0 - 40} ${(Y0 + Y1) / 2})" `);
    d += tx((X0 + X1) / 2, Y1 + 32, S.x, 12, 'middle');
    if (c.act) d += tx((kx(A.z0) + kx(A.z1)) / 2, Y0 - 6, S.zone, 12, 'middle');

  };
  onGroup('q1a-mode', i => { s.mode = i; draw(); });
  draw();
};

Object.assign(MTH, {
  /* кимограмма: кадры съёмки с линией вдоль отростка → изображение «положение — время» */
  q1kymo(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(340, 22, l.pB, l.b);
    const pos = [[60, 60, 60, 60], [120, 140, 160, 180], [250, 230, 210, 190]];   // три объекта в четырёх кадрах
    [0, 1, 2, 3].forEach(k => { const y = 52 + k * 52;
      d += rect(20, y, 280, 36, '#10151b', 6) + line(30, y + 18, 290, y + 18, '#556171', 1.5, 'stroke-dasharray="3 3"');
      pos.forEach(p => { d += circ(20 + p[k], y + 18, 6, '#e8c21a'); });
      d += tx(306, y + 23, l.frames + ' ' + (k + 1), 11, 'start'); });
    const X0 = 360, Y0 = 50, W = 250, Hh = 200;
    d += rect(X0, Y0, W, Hh, '#10151b', 4);
    const kx = x => X0 + x * W / 280, ky = k => Y0 + 10 + k * 60;
    pos.forEach(p => { d += `<polyline points="${p.map((x, k) => kx(x) + ',' + ky(k)).join(' ')}" fill="none" stroke="#e8c21a" stroke-width="3"/>`; });
    d += arrow(X0 - 14, Y0 + 4, X0 - 14, Y0 + Hh, '#556171', 2) + tx(X0 - 22, Y0 + Hh / 2, l.t, 12, 'middle').replace('<text ', `<text transform="rotate(-90 ${X0 - 22} ${Y0 + Hh / 2})" `);
    d += arrow(X0, Y0 + Hh + 14, X0 + W, Y0 + Hh + 14, '#556171', 2) + tx(X0 + W / 2, Y0 + Hh + 32, l.x, 12, 'middle');
    const wt = s => s.replace('<text ', '<text style="fill:#fff" ');
    /* v3.0 (аудит v2.0, 09): «неподвижен» — внизу у своей вертикальной линии, «вправо» и «влево» — вверху у начала своих линий: подписи не перекрываются */
    d += wt(tx(kx(60) + 6, Y0 + Hh - 8, l.still, 12, 'start')) + wt(tx(kx(120) + 6, Y0 + 16, l.plus, 12, 'start')) + wt(tx(kx(250) - 6, Y0 + 16, l.minus, 12, 'end'));
    return d;
  },
  /* EB3: метки растущих плюс-концов в аксоне (однонаправленно) и в дендрите (в обе стороны) */
  q1eb3(l){
    let d = '';
    [[0, l.pA, l.a, [1, 1, 1, 1, 1, 1], l.res_a], [140, l.pB, l.b, [1, -1, 1, -1, 1, 1], l.res_b]].forEach(([oy, P, title, dirs, res]) => {
      d += MTH.panel(10, 22 + oy, P, title);
      d += circ(60, 70 + oy, 28, '#f6f8fa', 'stroke="#556171" stroke-width="2.5"') + tx(60, 75 + oy, l.soma, 12, 'middle');
      d += rect(88, 58 + oy, 470, 24, '#f6f8fa', 12, 'stroke="#556171" stroke-width="2"');
      dirs.forEach((dir, i) => { const x = 130 + i * 70, y = 70 + oy;
        d += arrow(x - dir * 18, y, x + dir * 18, y, C4.teal, 2.5) + circ(x + dir * 18, y, 5, '#2c7b45'); });
      d += tx(320, 108 + oy, res, 13, 'middle');
    });
    d += circ(30, 262, 5, '#2c7b45') + tx(42, 267, l.comet, 12.5, 'start');
    return d;
  },
  /* индуцируемое присоединение мотора к грузу: FKBP на пероксисоме, FRB на моторе, рапалог соединяет их */
  q1recruit(l){
    let d = '';
    [[0, l.pA, l.a, false, l.res_a], [325, l.pB, l.b, true, l.res_b]].forEach(([ox, P, title, on, res]) => {
      d += MTH.panel(ox + 10, 22, P, title);
      const cx = ox + 155, cy = 135;

      d += circ(cx, cy, 6, '#556171') + tx(cx, cy - 12, l.cs, 11.5, 'middle');
      [0, 60, 120, 180, 240, 300].forEach(a => { const r = a * Math.PI / 180; d += line(cx, cy, cx + 125 * Math.cos(r), cy + 80 * Math.sin(r), '#9db4c8', 1.5); });
      const pts = on ? [[cx + 118, cy - 20], [cx - 112, cy + 30], [cx + 60, cy + 70], [cx - 70, cy - 64], [cx + 100, cy + 44]]
                     : [[cx + 40, cy - 30], [cx - 60, cy + 20], [cx + 20, cy + 50], [cx - 30, cy - 50], [cx + 70, cy + 10]];
      pts.forEach(([x, y]) => { d += circ(x, y, 8, '#e3f1e6', 'stroke="#2c7b45" stroke-width="2"'); if (on) d += rect(x + 6, y - 14, 10, 8, C4.teal, 2); });
      d += tx(cx, 252, res, 12.5, 'middle');

    /* легенда: пероксисома — FKBP — рапалог — FRB — мотор */
    const y = 280;
    d += circ(30, y, 8, '#e3f1e6', 'stroke="#2c7b45" stroke-width="2"') + tx(44, y + 5, l.px, 12, 'start');
    d += rect(150, y - 8, 46, 16, '#fff', 4, 'stroke="#2c7b45" stroke-width="1.5"') + tx(173, y + 5, l.fkbp, 11, 'middle');
    d += circ(212, y, 7, C4.red) + tx(212, y - 12, l.rap, 11, 'middle');
    d += rect(228, y - 8, 40, 16, '#fff', 4, 'stroke="#007b72" stroke-width="1.5"') + tx(248, y + 5, l.frb, 11, 'middle');
    d += rect(272, y - 6, 18, 12, C4.teal, 2) + tx(296, y + 5, l.mot, 12, 'start');
    return d;
  },
});

/* =====================================================================

/* Баланс слияния и деления: два ползунка, сеть клетки (120 мкм) как полоса, разрезанная на n органелл (M2.basic, как в практикуме 2б) */
W.q2balance = ({ S, s, set, out, onRange }) => {
  s.f ??= 50; s.d ??= 50;
  set(S.title, S.status, '<div class="controls">' + slider('q2b-f', S.fus, 0, 100, s.f, 5, nb + '%') + slider('q2b-d', S.fis, 0, 100, s.d, 5, nb + '%') + '</div>');
  const draw = () => {
    const r = M2.basic(s.f / 100, s.d / 100, s.nLast), n = Math.max(1, Math.round(r.n));
    if (!r.stop) s.nLast = r.n;   /* обе машины остановлены — сеть сохраняется такой, какой была (аудит v1.0, S01) */
    const X0 = 20, X1 = 620, rows = 4, rowW = (X1 - X0), per = 120 / rows;   // сеть 120 мкм уложена в 4 строки по 30 мкм
    let d = tx(X0, 22, S.net, 14, 'start');
    const len = 120 / n, gap = n === 1 ? 0 : Math.min(0.8, len * 0.35), cap = len > 1.5 ? 'round' : 'butt';
    for (let i = 0; i < n; i++){
      let a = i * len + gap / 2, b = (i + 1) * len - gap / 2;
      while (a < b - 1e-6){
        const row = Math.min(rows - 1, Math.floor(a / per)), rowEnd = (row + 1) * per, e = Math.min(b, rowEnd);
        const y = 48 + row * 34, xa = X0 + (a - row * per) / per * rowW, xb = X0 + (e - row * per) / per * rowW;
        d += `<line x1="${xa.toFixed(1)}" y1="${y}" x2="${Math.max(xa + 2, xb).toFixed(1)}" y2="${y}" stroke="#b5651d" stroke-width="10" stroke-linecap="${cap}"/>`;
        a = e + 1e-6; if (e >= b) break;
      }
    }
    /* v3.0 (аудит v2.0, 07; независимая проверка, IR-01): порядок выбора — как в практикуме (s2.js): остановка, нет деления, нет слияния,
       затем избыток делений ≥ 10 % (заметна поправка на рост клеток), иначе общий текст */
    const slow = r.fis > 0 && (r.fis - r.fus) / r.fis >= 0.1;
    const note = r.stop ? S.note_stop : r.kd === 0 ? S.note_nofis : r.kf === 0 ? S.note_nofus : (slow ? S.note_slow : S.note_tpl).replace('{cls}', S.cls[r.cls]);
    out(svg(d, S.title, 170, 640, note),
      `<div class="metrics">${metric(S.m_n, String(n))}${metric(S.m_L, n1(r.L, r.L >= 10 ? 0 : 1))}${metric(S.m_ev, n1(r.fus, 2) + ' / ' + n1(r.fis, 2))}</div>` +
      result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onRange('q2b-f', v => { s.f = v; draw(); });
  onRange('q2b-d', v => { s.d = v; draw(); });
  draw();
};

/* Что дают слияние и деление: две митохондрии с разными мтДНК, общий матрикс после слияния, неравное деление */
W.q2mix = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q2m-mode', S.modes, s.mode, S.modes_label));
  const A = '#2c7b45', B = '#6748b6', M = '#b5651d', MF = '#fbefe3';
  const mito = (x, y, w, h, fill = MF) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${M}" stroke-width="3"/>`;
  const nucleoid = (x, y, c) => circ(x, y, 9, c, 'stroke="#152c45" stroke-width="1.5"');
  const dots = (x0, y0, w, h, c, k) => Array.from({ length: k }, (_, i) => circ(x0 + ((i * 37) % w), y0 + ((i * 23) % h), 3.5, c)).join('');
  const draw = () => {
    let d = '';
    if (s.mode === 0){
      d += mito(30, 50, 250, 70) + nucleoid(80, 85, A) + dots(110, 65, 150, 40, A, 9) + tx(155, 145, S.mA, 14, 'middle');
      d += mito(360, 50, 250, 70) + nucleoid(410, 85, B) + dots(440, 65, 150, 40, B, 9) + tx(485, 145, S.mB, 14, 'middle');
    } else if (s.mode === 1){
      d += mito(30, 50, 580, 70) + nucleoid(80, 85, A) + nucleoid(560, 85, B) + dots(110, 62, 420, 46, A, 14) + dots(125, 66, 400, 40, B, 14);
      d += tx(320, 145, S.fused, 14, 'middle');
    } else {
      d += mito(30, 40, 200, 60, '#fbe9c2') + tx(130, 120, S.hi, 13, 'middle') + mito(300, 40, 120, 60, '#eef0f4') + tx(360, 120, S.lo, 13, 'middle');
      d += arrow(130, 132, 130, 160, '#145c96', 3, '6 5') + tx(130, 178, S.refuse, 13, 'middle');
      d += arrow(360, 132, 360, 160, '#6b7c8f', 3, '6 5') + tx(360, 178, S.auto, 13, 'middle');
    }
    if (s.mode < 2){
      d += nucleoid(40, 175, '#9db4c8') + tx(56, 180, S.nuc, 13, 'start') + circ(170, 175, 3.5, A) + tx(180, 180, S.prodA, 13, 'start') + circ(380, 175, 3.5, B) + tx(390, 180, S.prodB, 13, 'start');
    }
    const note = S.notes[s.mode];
    out(svg(d, S.title, 200, 640, note), result(`<p>${esc(note)}</p>`));
  };
  onGroup('q2m-mode', i => { s.mode = i; draw(); });
  draw();
};

Object.assign(MTH, {
  /* подсчёт событий слияния и деления по кадрам прижизненной съёмки */
  q2live(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(380, 22, l.pB, l.b);
    const M = '#e39a57';
    /* три кадра: деление (одна органелла → две) и слияние (две → одна) */
    [[0, 'f0'], [1, 'f1'], [2, 'f2']].forEach(([k]) => {
      const y = 46 + k * 62;
      d += rect(20, y, 330, 50, '#10151b', 6) + tx(30, y + 14, 't' + (k + 1), 11, 'start').replace('<text ', '<text style="fill:#97a3b0" ');
      const dv = k === 0 ? [[60, 140]] : [[60, 96], [104, 140]];
      dv.forEach(([a, b]) => { d += line(a, y + 30, b, y + 30, M, 9, 'stroke-linecap="round"'); });
      const fu = k < 2 ? [[210, 250], [262, 320]] : [[210, 320]];
      fu.forEach(([a, b]) => { d += line(a, y + 30, b, y + 30, M, 9, 'stroke-linecap="round"'); });
    });
    d += tx(100, 246, l.fis, 13, 'middle') + tx(265, 246, l.fus, 13, 'middle');
    d += rect(400, 60, 220, 150, '#f6f8fa', 8, 'stroke="#9db4c8"');
    d += tx(510, 92, l.fis + ': 1', 15, 'middle') + tx(510, 122, l.fus + ': 1', 15, 'middle') + tx(510, 170, l.res, 12, 'middle');
    return d;
  },
  /* матриксный фотоактивируемый GFP: распространение флуоресценции в норме и без слияния */
  q2pagfp(l){
    let d = '';
    const G = '#e8c21a', O = '#556171';
    [[0, l.pA, l.a, true], [130, l.pB, l.b, false]].forEach(([oy, P, title, fuse]) => {
      d += MTH.panel(10, 22 + oy, P, title);
      [[0, l.t0], [320, l.t60]].forEach(([ox, lab], j) => {

        for (let i = 0; i < 8; i++){
          const x = 40 + ox + (i % 4) * 66, y = 66 + oy + Math.floor(i / 4) * 26;
          const lit = j === 0 ? i < 2 : (fuse ? i < 7 : i < 2);
          d += line(x, y, x + 46, y, lit ? G : O, 8, 'stroke-linecap="round"');
        }
      });
      d += arrow(312, 71 + oy, 336, 71 + oy, '#556171', 2);
    });
    d += line(20, 278, 46, 278, G, 8, 'stroke-linecap="round"') + tx(56, 282, l.act, 12.5, 'start');

  },
  /* вестерн-блот OPA1: норма, CCCP, Opa1⁻/⁻ */
  q2blot(l){
    let d = tx(20, 26, l.t, 15, 'start').replace('<text ', '<text style="font-weight:700" ');
    const lanes = [[l.l1, 1, 0.56], [l.l2, 0.02, 1], [l.l3, 0, 0]];
    const X0 = 170, LW = 120;

    d += rect(X0 - 6, 70, LW * 3 + 12, 150, '#f6f8fa', 6, 'stroke="#9db4c8"');
    [[l.L, 100, 1], [l.S, 140, 2], [l.c, 190, 3]].forEach(([lab, y, row]) => {
      d += tx(X0 - 14, y + 4, lab, 13, 'end');
      lanes.forEach(([, Lv, Sv], i) => { const v = row === 1 ? Lv : row === 2 ? Sv : 0.8;
        d += rect(X0 + i * LW + 14, y - 7, LW - 28, 14, '#152c45', 4, `opacity="${(0.05 + 0.95 * v).toFixed(2)}"`); });
    });
    return d;
  },
  /* DRP1 на наружной мембране: скопления на митохондриях и распределение между фракциями */
  q2drp(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(340, 22, l.pB, l.b);
    [[40, l.n1, 6], [150, l.n2, 2]].forEach(([y, lab, k]) => {

      d += line(50, y + 48, 280, y + 48, '#e39a57', 10, 'stroke-linecap="round"');
      for (let i = 0; i < k; i++) d += circ(70 + i * 36, y + 48, 6, '#f06aa0');
    });
    d += circ(40, 250, 6, '#f06aa0') + tx(52, 254, l.dot, 12, 'start');
    const CY = '#9db4c8', MI = '#c98a0b';
    const bar = (x, v, col) => rect(x, 180 - 120 * v, 44, 120 * v, col, 4) + tx(x + 22, 174 - 120 * v, Math.round(v * 100) + nb + '%', 12, 'middle');
    d += line(360, 180, 630, 180, '#556171', 1.5);
    d += bar(380, 0.8, CY) + bar(430, 0.2, MI) + tx(427, 200, l.n1, 12.5, 'middle');

    return d;
  },
  /* TMRM (состояние) и потребление кислорода (поток) в норме и после CCCP; числа — модель практикума M2 */
  q2tmrm(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(340, 22, l.pB, l.b);
    const wt = M2.cell('wt', '0'), cc = M2.cell('wt', 'cccp');
    const bar = (x, v, max, lab, txt, col) => { const h = 150 * v / max; return rect(x, 210 - h, 70, h, col, 4) + tx(x + 35, 202 - h, txt, 13, 'middle') + tx(x + 35, 230, lab, 12.5, 'middle'); };
    d += line(30, 210, 300, 210, '#556171', 1.5) + line(360, 210, 630, 210, '#556171', 1.5);
    d += bar(60, wt.low, 1, l.n, Math.round(wt.low * 100) + nb + '%', '#9db4c8') + bar(190, cc.low, 1, l.c, Math.round(cc.low * 100) + nb + '%', '#ae3347');
    d += bar(390, wt.resp, 2, l.n, Math.round(wt.resp * 100) + nb + '%', '#9db4c8') + bar(520, cc.resp, 2, l.c, Math.round(cc.resp * 100) + nb + '%', '#007b72');
    d += tx(165, 252, l.u1, 12, 'middle') + tx(495, 252, l.u2, 12, 'middle');
    return d;
  },
});

/* Валентность и сеть: молекулы с 1, 2, 3, 5 участками связывания и что из них собирается */
/* Граф взаимодействий для схемы валентности (аудит v2.0, 04): 24 молекулы (12 с модулями — тип 1, 12 с участками связывания — тип 0)
   при одной общей концентрации 80 мкМ. Связь соединяет только молекулы разных типов; каждый контакт занимает один модуль
   у каждого партнёра, поэтому число связей узла не превышает валентности v. Возвращает {nodes: [[x, y, тип]], edges: [[i, j]], drop}. */
function q3valGraph(v){
  const N = [], Ed = [], add = (x, y, k) => { N.push([Math.round(x * 10) / 10, Math.round(y * 10) / 10, k]); return N.length - 1; };
  const link = (a, b) => Ed.push([a, b]);
  if (v === 1){
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++){ const x = 62 + c * 96 + (r % 2) * 18, y = 132 + r * 46; link(add(x - 13, y, 1), add(x + 13, y, 0)); }
    return { nodes: N, edges: Ed, drop: null };
  }
  if (v === 2){
    const chain = (x0, y0, n, k0 = 1) => { let prev = -1; for (let i = 0; i < n; i++){ const k = add(x0 + i * 27, y0 + (i % 2) * 14, i % 2 === 0 ? k0 : 1 - k0); if (prev >= 0) link(prev, k); prev = k; } };
    chain(36, 122, 5); chain(222, 128, 6); chain(36, 206, 7, 0);
    const cx = 318, cy = 222, ring = []; for (let i = 0; i < 6; i++){ const a = i * Math.PI / 3; ring.push(add(cx + 24 * Math.cos(a), cy + 24 * Math.sin(a), i % 2 === 0 ? 1 : 0)); }
    for (let i = 0; i < 6; i++) link(ring[i], ring[(i + 1) % 6]);
    return { nodes: N, edges: Ed, drop: null };
  }
  if (v === 3){
    /* два шестичленных кольца с боковыми ветвями и одно небольшое разветвлённое дерево: конечные ассоциаты, степень ≤ 3 */
    const hex = (cx, cy, armOn) => { const ring = [];
      for (let i = 0; i < 6; i++){ const a = Math.PI / 6 + i * Math.PI / 3; ring.push(add(cx + 22 * Math.cos(a), cy + 22 * Math.sin(a), i % 2 === 0 ? 1 : 0)); }
      for (let i = 0; i < 6; i++) link(ring[i], ring[(i + 1) % 6]);
      for (let i = 0; i < 6; i++){ const k = N[ring[i]][2]; if (k !== armOn) continue; const a = Math.PI / 6 + i * Math.PI / 3;
        link(ring[i], add(cx + 48 * Math.cos(a), cy + 48 * Math.sin(a), 1 - k)); } };
    hex(92, 182, 1); hex(232, 172, 0);
    const a0 = add(342, 186, 1), b1 = add(342, 158, 0), b2 = add(318, 202, 0), b3 = add(366, 202, 0);
    link(a0, b1); link(a0, b2); link(a0, b3); link(b1, add(342, 130, 1)); link(b2, add(300, 226, 1));
    return { nodes: N, edges: Ed, drop: null };
  }
  /* v = 5: 15 молекул в капле плотной фазы (63 % при 80 мкМ, порог 30 мкМ — модель M3), 9 — в окружающем растворе */
  const drop = { cx: 222, cy: 184, rx: 128, ry: 64 };
  const P = [[-96, -8], [-70, -40], [-66, 26], [-40, -12], [-30, 44], [-14, -46], [-6, 12], [20, -22], [26, 40], [44, -48], [52, 8], [78, -24], [84, 34], [104, -2], [-104, 30]];
  const inside = P.map(([dx, dy], i) => add(drop.cx + dx, drop.cy + dy, i % 2 === 0 ? 1 : 0));   // 8 молекул с модулями и 7 — с участками
  const cand = [];
  inside.forEach(a => inside.forEach(b => { if (a < b && N[a][2] !== N[b][2]){ const d = Math.hypot(N[a][0] - N[b][0], N[a][1] - N[b][1]); if (d < 95) cand.push([d, a, b]); } }));
  cand.sort((p, q) => p[0] - q[0]);
  const deg = {}; cand.forEach(([, a, b]) => { if ((deg[a] || 0) < v && (deg[b] || 0) < v){ link(a, b); deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; } });
  /* раствор вокруг капли: три пары и три свободные молекулы (4 + 5 = 9 молекул) */
  [[40, 120], [370, 124], [44, 252]].forEach(([x, y]) => link(add(x - 12, y, 1), add(x + 12, y, 0)));
  add(392, 246, 1); add(300, 262, 0); add(150, 262, 0);
  return { nodes: N, edges: Ed, drop };
}

W.q3valency = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 2;
  set(S.title, S.status, buttonGroup('q3v-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const v = S.vals[s.mode];
    /* молекула-образец */
    let d = tx(14, 26, S.a, 14, 'start');
    for (let i = 0; i < v; i++) d += rect(240 + i * 30, 12, 20, 20, '#d3ecec', 4, 'stroke="#0d6e73" stroke-width="2"') + (i < v - 1 ? line(260 + i * 30, 22, 270 + i * 30, 22, '#0d6e73', 2) : '');
    d += tx(14, 60, S.b, 14, 'start');
    for (let i = 0; i < v; i++) d += circ(250 + i * 30, 56, 10, '#f6e3eb', 'stroke="#ae3a6c" stroke-width="2"') + (i < v - 1 ? line(260 + i * 30, 56, 270 + i * 30, 56, '#ae3a6c', 2) : '');
    d += tx(210, 96, S.res_t, 14, 'middle');
    const G = q3valGraph(v);
    if (G.drop) d += `<ellipse cx="${G.drop.cx}" cy="${G.drop.cy}" rx="${G.drop.rx}" ry="${G.drop.ry}" fill="#fbe9c2" stroke="#c98a0b" stroke-width="2.5"/>` + tx(G.drop.cx + G.drop.rx - 6, G.drop.cy - G.drop.ry - 6, S.drop, 12.5, 'end');
    G.edges.forEach(([a, b]) => { d += line(G.nodes[a][0], G.nodes[a][1], G.nodes[b][0], G.nodes[b][1], '#556171', 1.8); });
    G.nodes.forEach(([x, y, k]) => { d += k ? rect(x - 8, y - 8, 16, 16, '#d3ecec', 3, 'stroke="#0d6e73" stroke-width="2"') : circ(x, y, 8, '#f6e3eb', 'stroke="#ae3a6c" stroke-width="2"'); });
    const degs = G.nodes.map((_, i) => G.edges.filter(e => e[0] === i || e[1] === i).length);
    const avg = degs.reduce((a, b) => a + b, 0) / degs.length, mx = Math.max(...degs);
    const cs = M3.CSAT[v];
    const note = S.notes[s.mode];
    out(svg(d, S.title, 275, 420, note),
      `<div class="metrics two">${metric(S.m_cs, cs && isFinite(cs) ? cs + nb + 'мкМ' : S.none)}${metric(S.m_deg, n1(avg, 1) + ' (' + S.m_max + nb + mx + ')')}</div>` +
      result(`<p><b>${esc(S.res[s.mode])}.</b> ${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q3v-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Правило рычага: концентрация в разбавленной фазе против общей (M3.phase, как в практикуме 3б) */
W.q3phase = ({ S, s, set, out, onGroup, onRange }) => {
  s.c ??= 100; s.v ??= 1; s.cl ??= 0;
  set(S.title, S.status, slider('q3p-c', S.c_label, 0, 200, s.c, 5, '') + buttonGroup('q3p-v', S.vs, s.v, S.v_label) + buttonGroup('q3p-cl', S.cls, s.cl, S.cl_label));
  const draw = () => {
    const v = S.vals[s.v], P = M3.phase(s.c, v), pts = [];
    for (let x = 0; x <= 200; x += 2) pts.push([x, M3.phase(x, v).dil]);
    const fig = chart([{ pts, color: '#c98a0b', label: S.l_dil }, { pts: [[0, 0], [200, 200]], dash: '6 5', color: '#6b7c8f', label: S.l_none }],
      { xLabel: S.x, yLabel: S.y, maxX: 200, maxY: 200, w: 420, h: 280, ticksX: 4, ticksY: 4, title: S.title, marks: [[s.c, P.dil, '#145c96']] });
    const fd = Math.round(P.fd * 100), phi = (P.phi * 100).toFixed(1).replace('.', ',');
    const note = (P.sep ? S.n_above : S.n_below) + (s.cl ? ' ' + S.n_client : '');
    out(fig, `<div class="metrics">${metric(S.m_dil, Math.round(P.dil) + nb + S.u)}${metric(S.m_fd, fd + nb + '%')}${metric(S.m_phi, phi + nb + '%')}</div>` + result(`<p>${esc(note)}</p>`));
  };
  onRange('q3p-c', x => { s.c = x; draw(); });
  onGroup('q3p-v', i => { s.v = i; draw(); });
  onGroup('q3p-cl', i => { s.cl = i; draw(); });
  draw();
};

/* Сдвиг порога: условная шкала концентрации каркаса, положение порога до и после воздействия */
W.q3reg = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q3r-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    /* для воздействия, снижающего порог, исходная концентрация каркаса ниже исходного порога (нефрин без фосфорилирования) */
    const sh = S.shift[s.mode], X0 = 30, X1 = 390, cur = sh < 0 ? 130 : 230, thr0 = 170, thr = thr0 + sh * 100;
    let d = line(X0, 110, X1, 110, '#556171', 3) + arrow(X1 - 20, 110, X1, 110, '#556171', 3) + tx((X0 + X1) / 2, 140, S.axis, 14, 'middle');
    if (sh) d += line(thr0, 92, thr0, 128, '#9aa7b3', 3, 'stroke-dasharray="5 4"') + arrow(thr0, 60, thr, 60, sh > 0 ? '#ae3347' : '#007b72', 3);
    d += line(thr, 90, thr, 130, '#c98a0b', 5) + line(cur, 86, cur, 120, '#145c96', 4);
    /* легенда линий */
    d += line(30, 172, 54, 172, '#145c96', 4) + tx(60, 177, S.cur, 13, 'start');
    d += line(230, 172, 254, 172, '#c98a0b', 5) + tx(260, 177, S.thr, 13, 'start');
    if (sh) d += line(30, 198, 54, 198, '#9aa7b3', 3, 'stroke-dasharray="5 4"') + tx(60, 203, S.thr0, 13, 'start');
    /* капли или однородный раствор: до и после воздействия */
    const box2 = (x, lab, on) => tx(x + 85, 232, lab, 13, 'middle') + rect(x, 240, 170, 30, on ? '#fbe9c2' : '#f6f8fa', 8, `stroke="${on ? '#c98a0b' : '#9aa7b3'}" stroke-width="2"`) + tx(x + 85, 260, on ? S.drops : S.nodrops, 14, 'middle');
    d += sh ? box2(30, S.before, cur > thr0) + box2(220, S.after, cur > thr) : box2(125, S.before0, cur > thr0);
    const note = S.notes[s.mode];
    out(svg(d, S.title, 280, 420, note), result(`<p>${esc(note)}</p>`));
  };
  onGroup('q3r-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Созревание капель FUS: подвижная фракция FRAP от времени (M3.mature, как в практикуме 3п) */
W.q3mature = ({ S, s, set, out, onRange }) => {
  s.h ??= 4;
  set(S.title, S.status, slider('q3m-h', S.h_label, 0, 8, s.h, 0.5, ''));
  const draw = () => {
    const ser = v => { const p = []; for (let h = 0; h <= 8.001; h += 0.25) p.push([h, 100 * M3.mature(v, h).mf]); return p; };
    const a = M3.mature('wt', s.h), b = M3.mature('g156e', s.h);
    const fig = chart([{ pts: ser('wt'), color: '#c98a0b', label: S.l_wt }, { pts: ser('g156e'), color: '#ae3347', label: S.l_g }],
      { xLabel: S.x, yLabel: S.y, maxX: 8, maxY: 100, w: 420, h: 280, ticksX: 4, ticksY: 4, title: S.title,
        marks: [[s.h, 100 * a.mf, '#c98a0b'], [s.h, 100 * b.mf, '#ae3347']] });
    out(fig, `<div class="metrics two">${metric(S.m_wt, Math.round(100 * a.mf) + nb + '% · ' + S.st[a.state])}${metric(S.m_g, Math.round(100 * b.mf) + nb + '% · ' + S.st[b.state])}</div>` + result(`<p>${esc(S.note)}</p>`));
  };
  onRange('q3m-h', x => { s.h = x; draw(); });
  draw();
};

Object.assign(MTH, {
  /* FRAP: фокус до, сразу после и через 30 с после обесцвечивания; кривая с подвижной фракцией */
  q3frap(l){
    let d = MTH.panel(10, 22, l.pA, l.a) + MTH.panel(340, 22, l.pB, l.b);
    [[l.t0, 1], [l.t1, 0.1], [l.t2, 0.85]].forEach(([lab, f], i) => { const x = 60 + i * 95;
      d += rect(x - 40, 50, 80, 80, '#10151b', 6) + circ(x, 90, 24, '#e8c21a', `opacity="${f}"`);
      if (i) d += circ(x, 90, 30, 'none', 'stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"');
      d += tx(x, 152, lab, 14, 'middle'); });
    const X0 = 370, X1 = 620, Y0 = 58, Y1 = 220, xx = t => X0 + (X1 - X0) * t / 60, yy = f => Y1 - (Y1 - Y0) * f;
    d += line(X0, Y1, X1, Y1, '#556171', 2) + line(X0, Y0, X0, Y1, '#556171', 2);
    const p = []; for (let t = 0; t <= 60; t += 2) p.push(xx(t) + ',' + yy(t === 0 ? 0.1 : 0.1 + 0.75 * (1 - Math.pow(2, -t / 6))));
    d += `<polyline points="${p.join(' ')}" fill="none" stroke="#c98a0b" stroke-width="3.5"/>`;
    d += line(X0, yy(1), X1, yy(1), '#9aa7b3', 1.5, 'stroke-dasharray="4 3"') + line(X0, yy(0.85), X1, yy(0.85), '#c98a0b', 1.5, 'stroke-dasharray="4 3"');
    d += tx(X1, yy(0.85) - 8, l.mf, 13, 'end') + line(xx(6), yy(0.475), xx(6), Y1, '#145c96', 1.5, 'stroke-dasharray="3 3"') + tx(xx(6) + 6, Y1 - 10, l.th, 13, 'start');
    d += tx((X0 + X1) / 2, Y1 + 22, l.x, 13, 'middle') + tx(X0 + 6, Y0 - 14, l.y, 13, 'start');
    return d;
  },
  /* слияние: жидкоподобные капли сливаются и округляются, твёрдоподобные — нет */
  q3fuse(l){
    let d = '';
    [[80, l.row_l, true, l.res_l], [210, l.row_s, false, l.res_s]].forEach(([y, row, liq, res]) => {
      d += tx(10, y - 48, row + ': ' + res, 15, 'start');
      [0, 1, 2].forEach(k => { const x = 120 + k * 170;
        if (k === 0 && !liq) d += `<path d="M${x - 70} ${y} l12 -20 l22 4 l12 16 l-10 18 l-24 2 z M${x + 22} ${y} l14 -18 l24 6 l8 16 l-14 16 l-22 -4 z" fill="#e4ebf1" stroke="#556171" stroke-width="2.5"/>`;
        else if (k === 0) d += circ(x - 26, y, 22, '#fbe9c2', 'stroke="#c98a0b" stroke-width="2.5"') + circ(x + 26, y, 22, '#fbe9c2', 'stroke="#c98a0b" stroke-width="2.5"');
        else if (liq) d += `<ellipse cx="${x}" cy="${y}" rx="${k === 1 ? 40 : 30}" ry="${k === 1 ? 24 : 30}" fill="#fbe9c2" stroke="#c98a0b" stroke-width="2.5"/>`;
        else d += `<path d="M${x - 48} ${y} l12 -20 l22 4 l12 16 l-10 18 l-24 2 z M${x + 2} ${y} l14 -18 l24 6 l8 16 l-14 16 l-22 -4 z" fill="#e4ebf1" stroke="#556171" stroke-width="2.5"/>`;
        d += tx(x, y + 44, l.t[k], 13, 'middle'); });
    });
    return d;
  },
  /* порог по концентрации: при 0,5 и 0,9 порога фокусов нет, при 1,5 и 3 — есть */
  q3dil(l){
    let d = tx(320, 24, l.t, 15, 'middle') + arrow(40, 40, 600, 40, '#556171', 2);
    d += line(277, 30, 277, 210, '#c98a0b', 3, 'stroke-dasharray="6 4"') + tx(283, 60, l.cs, 14, 'start');
    [[90, 0], [205, 0], [350, 1], [490, 2]].forEach(([x, n], i) => {
      d += rect(x - 46, 70, 92, 100, '#10151b', 8);
      const spots = n === 0 ? [] : n === 1 ? [[-18, -14], [16, 18]] : [[-24, -20], [18, -12], [-4, 20], [26, 26]];
      spots.forEach(([dx, dy]) => { d += circ(x + dx, 120 + dy, n === 1 ? 9 : 12, '#e8c21a'); });
      if (!n) d += rect(x - 46, 70, 92, 100, '#e8c21a', 8, 'opacity="0.15"');
      d += tx(x, 190, l.c[i], 13, 'middle') + tx(x, 210, n ? l.above : l.below, 13, 'middle');
    });
    return d;
  },
  /* оптогенетическая сборка: темнота — свет — темнота */
  q3opto(l){
    let d = '';
    [[l.a, false], [l.b, true], [l.c, false]].forEach(([lab, on], i) => { const x = 110 + i * 210;
      d += rect(x - 80, 40, 160, 130, on ? '#dbe8ff' : '#10151b', 10) + tx(x, 30, lab, 14, 'middle');
      if (on){ [[-40, -20], [20, -30], [-10, 25], [40, 20]].forEach(([dx, dy]) => { d += circ(x + dx, 105 + dy, 13, '#e8c21a', 'stroke="#c98a0b" stroke-width="2"'); }); }
      else d += rect(x - 80, 40, 160, 130, '#e8c21a', 10, 'opacity="0.18"');
      if (i < 2) d += arrow(x + 86, 105, x + 124, 105, '#556171', 2.5);
    });
    d += rect(40, 196, 70, 20, '#d3ecec', 4, 'stroke="#0d6e73" stroke-width="2"') + tx(75, 211, 'IDR', 13, 'middle') + rect(110, 196, 44, 20, '#cfe0ff', 4, 'stroke="#145c96" stroke-width="2"');
    d += tx(166, 211, l.con, 13, 'start');
    d += tx(40, 244, l.res, 13, 'start') + tx(40, 264, l.deep, 13, 'start');
    return d;
  },
  /* замены в IDR, нарушающие только конденсацию: связывание сохранено, фокусов и функции нет */
  q3sep(l){
    let d = '';
    [[20, l.wt, true], [340, l.mut, false]].forEach(([x, lab, wt]) => {
      d += tx(x, 26, lab, 15, 'start');
      d += rect(x, 44, 90, 24, '#cfe0ff', 6, 'stroke="#145c96" stroke-width="2"');
      /* IDR: волнистая линия с ароматическими остатками (Y) или заменами (S) */
      let path = `M${x + 90} 56`; for (let i = 1; i <= 8; i++) path += ` q 9 ${i % 2 ? -14 : 14} 18 0`;
      d += `<path d="${path}" fill="none" stroke="#0d6e73" stroke-width="2.5"/>`;
      [1, 3, 5, 7].forEach(i => { d += tx(x + 90 + i * 18, i % 2 ? 40 : 76, wt ? 'Y' : 'S', 13, 'middle'); });
      const rows = [[l.bind, l.keep, true], [l.foci, wt ? l.yes : l.no, wt], [l.fun, wt ? l.yes : l.no, wt]];
      rows.forEach(([k, v, ok], j) => { const y = 120 + j * 44;
        d += tx(x, y, k, 14, 'start') + rect(x + 178, y - 18, 100, 28, ok ? '#e3f1e6' : '#fbe3e6', 6, `stroke="${ok ? '#2c7b45' : '#ae3347'}" stroke-width="2"`) + tx(x + 228, y + 1, v, 14, 'middle'); });
    });
    return d;
  },
  /* гександиол: фокусы растворились, но побочные действия неизбирательны */
  q3hex(l){
    let d = '';
    [[90, l.a, true], [270, l.b, false]].forEach(([x, lab, on]) => {
      d += rect(x - 70, 40, 140, 110, '#10151b', 8) + tx(x, 30, lab, 13, 'middle');
      if (on) [[-30, -20], [20, -24], [-6, 22], [34, 18]].forEach(([dx, dy]) => { d += circ(x + dx, 95 + dy, 11, '#e8c21a'); });
      else d += rect(x - 70, 40, 140, 110, '#e8c21a', 8, 'opacity="0.15"');
    });
    d += arrow(165, 95, 195, 95, '#556171', 2.5);
    d += tx(380, 50, l.side, 15, 'start');
    [l.s1, l.s2, l.s3].forEach((t, i) => { d += circ(390, 78 + i * 52, 5, '#ae3347') + MTH.tl(402, 83 + i * 52, t, 13.5, 'start'); });
    return d;
  },
});

/* =====================================================================
   Схемы раздела 4 (полярность). Новые W.<kind> с префиксом q4 и методы MTH.q4*.
   Числа схем three-fluxes и epithelium — из модели практикума M4 (копируется из src/s4.js); подписи — только из lesson.widget.s.
   Ширина схем 480 по viewBox: на экране 390 px подписи остаются не мельче 11 px.
   ===================================================================== */
const q4w = 480;
const q4F = v => (small() ? Math.round(v * 1.25) : v);   // на узком экране подписи крупнее (не мельче ~11 px)
const q4fmtT = (sec, S) => sec >= 120 ? n1(sec / 60, 1) + nb + S.u_min : Math.round(sec) + nb + S.u_s;

/* Оценка t ≈ x²/4D: молекула и расстояние → время; сравнение с временем жизни домена */
W.q4diff = ({ S, s, set, out, onGroup }) => {
  s.mol ??= 0; s.d ??= 2;
  set(S.title, S.status, buttonGroup('q4d-mol', S.mols, s.mol, S.mol_label) + buttonGroup('q4d-dist', S.dists, s.d, S.dist_label));
  const draw = () => {
    const D = S.D[s.mol], x = S.x[s.d], tt = x * x / (4 * D);
    const X0 = 30, X1 = 450, sc = (X1 - X0) / 20;
    let d = rect(X0 - 10, 40, X1 - X0 + 20, 26, '#eef3f7', 13, 'stroke="#c8d6e2"') + tx((X0 + X1) / 2, 30, S.cell, q4F(15));
    d += circ(X0, 53, 9, C4.amber) + tx(X0 - 8, 90, S.start, q4F(15), 'start');
    d += edge4([X0 + 10, 53, X0 + x * sc, 53], 'move') + circ(X0 + x * sc, 53, 9, C4.amberFill, `stroke="${C4.amber}" stroke-width="3"`);
    d += tx(Math.min(X1, X0 + x * sc), 110, S.dists[s.d], q4F(15), x * sc > 380 ? 'end' : 'middle');
    /* полосы времени: диффузия против домена (логарифмическая шкала от 1 с до 10 ч) */
    const L = v => X0 + (X1 - X0) * Math.log10(Math.max(1, v)) / Math.log10(36000);
    d += tx(X0, 130, S.m_t + ': ' + q4fmtT(tt, S), q4F(16), 'start') + rect(X0, 140, Math.max(4, L(tt) - X0), 22, C4.blue, 5);
    d += tx(X0, 192, S.m_dom + ': ' + S.dom, q4F(16), 'start') + rect(X0, 202, L(4 * 3600) - X0, 22, C4.amber, 5);
    [1, 60, 3600, 36000].forEach((v, i) => { const lab = S.ticks[i]; d += line(L(v), 232, L(v), 240, '#7f97ab', 2) + tx(L(v), 258, lab, q4F(14)); });
    const note = S.note.replace('{x}', x).replace('{t}', q4fmtT(tt, S));
    out(svg(d, S.title, 270, q4w, note),
      `<div class="metrics two">${metric(S.m_t, q4fmtT(tt, S))}${metric(S.m_dom, S.dom)}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q4d-mol', i => { s.mol = i; draw(); });
  onGroup('q4d-dist', i => { s.d = i; draw(); });
  draw();
};

/* Ориентир, обратная связь и запас CDC42: качественные исходы (клетка — окружность, домен — дуга) */
W.q4fb = ({ S, s, set, out, onGroup }) => {
  s.cue ??= 0; s.fb ??= 0; s.pool ??= 0;
  set(S.title, S.status, buttonGroup('q4f-cue', S.cues, s.cue, S.cue_label) + buttonGroup('q4f-fb', S.fbs, s.fb, S.fb_label) + buttonGroup('q4f-pool', S.pools, s.pool, S.pool_label));
  const draw = () => {
    const cue = s.cue === 0, fb = s.fb === 0, pool = s.pool === 0;
    const key = `${+cue}-${+fb}-${+pool}`;
    let res = fb && pool ? (cue ? 'one_cue' : 'one_rand') : (cue && !fb ? 'weak' : 'none');
    const cx = 140, cy = 150, r = 100, aCue = -90, aRand = 25;
    let d = circ(cx, cy, r, 'none', 'stroke="#9db4c8" stroke-width="10"') + tx(cx, cy + 5, S.mem, q4F(15));
    const arc = (a0, span, w, col, op = 1) => { const A = a => (a * Math.PI) / 180, x0 = cx + r * Math.cos(A(a0 - span)), y0 = cy + r * Math.sin(A(a0 - span)), x1 = cx + r * Math.cos(A(a0 + span)), y1 = cy + r * Math.sin(A(a0 + span));
      return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}" stroke-linecap="round"/>`; };
    if (res === 'one_cue') d += arc(aCue, 28, 16, C4.amber);
    if (res === 'one_rand') d += arc(aRand, 28, 16, C4.amber);
    if (res === 'weak') d += arc(aCue, 60, 12, C4.amber, 0.35);
    if (cue){ const x = cx, y = cy - r - 22; d += `<path d="M${x - 9} ${y - 12} L${x + 9} ${y - 12} L${x} ${y + 2} Z" fill="${C4.purple}"/>` + tx(x + 16, y - 4, S.cue, q4F(15), 'start'); }
    const outTxt = { one_cue: S.out_one_cue, one_rand: S.out_one_rand, weak: S.out_weak, none: S.out_none }[res];
    const wrap = small() ? 15 : 20, lines = outTxt.split(' ').reduce((acc, w) => { const lst = acc[acc.length - 1]; if ((lst + ' ' + w).trim().length > wrap) acc.push(w); else acc[acc.length - 1] = (lst + ' ' + w).trim(); return acc; }, ['']);
    const lh = q4F(15) * 1.25;
    d += rect(262, 100, 210, 46 + lines.length * lh, '#eef3f7', 10, 'stroke="#c8d6e2"');
    d += tx(367, 128, S.dom, q4F(15)).replace('<text ', '<text style="font-weight:700" ');
    lines.forEach((ln, i) => { d += tx(367, 128 + (i + 1) * lh, ln, q4F(15)); });
    const note = S.notes[key];
    out(svg(d, S.title, 290, q4w, note), result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q4f-cue', i => { s.cue = i; draw(); });
  onGroup('q4f-fb', i => { s.fb = i; draw(); });
  onGroup('q4f-pool', i => { s.pool = i; draw(); });
  draw();
};

/* Взаимное вытеснение модулей PAR: эпителиальная клетка в разрезе, апикальный модуль (жёлтый) и базолатеральный (лиловый) */
W.q4par = ({ S, s, set, out, onGroup }) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('q4p-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const X0 = 120, X1 = 360, Y0 = 60, Y1 = 250;
    let d = rect(X0, Y0, X1 - X0, Y1 - Y0, '#fff', 12, 'stroke="#9db4c8" stroke-width="2"');
    d += tx((X0 + X1) / 2, Y0 - 14, S.api, q4F(15)) + tx((X0 + X1) / 2, Y1 + 26, S.bas, q4F(15));
    const basCol = C4.purple, apiCol = C4.amber;
    /* апикальный модуль; при PAR-3 без участков для PAR-1 — ещё и эктопически на латеральной мембране (смещён внутрь, чтобы был виден) */
    d += line(X0 + 10, Y0, X1 - 10, Y0, apiCol, 9);
    if (s.mode === 1) { d += line(X0 + 9, Y0 + 20, X0 + 9, Y1 - 40, apiCol, 7) + line(X1 - 9, Y0 + 20, X1 - 9, Y1 - 40, apiCol, 7); }
    /* базолатеральный модуль; при PAR-1 без участка для aPKC — ещё и под апикальной мембраной */
    const basTop = s.mode === 2 ? Y0 + 4 : Y0 + 26;
    d += line(X0, basTop, X0, Y1 - 10, basCol, 6) + line(X1, basTop, X1, Y1 - 10, basCol, 6) + line(X0 + 10, Y1, X1 - 10, Y1, basCol, 6);
    if (s.mode === 2) d += line(X0 + 40, Y0 + 9, X1 - 40, Y0 + 9, basCol, 5, 'opacity="0.8"');
    /* фосфорилирование с вытеснением (линия с поперечиной): aPKC → PAR-1, PAR-1 → PAR-3 */
    if (s.mode !== 2) d += edge4([190, Y0 + 14, 150, 120, X0 + 14, 160], 'inh') + tx(200, 130, S.ph1, q4F(14), 'start');
    if (s.mode !== 1) d += edge4([X1 - 14, 210, 330, 150, 290, Y0 + 14], 'inh') + tx(280, 214, S.ph2, q4F(14), 'end');
    d += rect(20, 300, 14, 14, apiCol, 3) + tx(42, 312, S.ant, q4F(14), 'start');
    d += rect(20, 326, 14, 14, basCol, 3) + tx(42, 338, S.post, q4F(14), 'start');
    const note = S.notes[s.mode];
    out(svg(d, S.title, 352, q4w, note), result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q4p-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Профиль концентрации от полюса (M4.profile — та же модель, что в практикуме 4б) */
W.q4prof = ({ S, s, set, out, onGroup }) => {
  s.p ??= 2; s.k ??= 1;
  set(S.title, S.status, buttonGroup('q4r-p', S.ps, s.p, S.p_label) + buttonGroup('q4r-k', S.ks, s.k, S.k_label));
  const draw = () => {
    const p = S.pv[s.p], k = M4.KE[S.kv[s.k]], r = M4.profile(p, k), r0 = M4.profile(M4.P0, M4.KE[M4.K0]), ref = r0.pole, half = M4.P.NB / 2;
    const pts = []; for (let j = half; j < M4.P.NB; j++) pts.push([r.xs[j], r.c[j] / ref]);
    const cu = M4.P.Q / (M4.P.C * k) / ref, ymax = Math.max(1, Math.ceil(Math.max(...pts.map(q => q[1]), cu) * 2) / 2);
    const con = n1(r.contrast, 1), lam = n1(r.lam, 1), tot = Math.round(r.total / M4.total0() * 100);
    const note = S.note.replace('{c}', con).replace('{l}', lam).replace('{m}', tot);
    out(chart([{ pts, color: C4.amber }, { pts: [[0, cu], [15, cu]], dash: '6 5', color: C4.muted }],
               { xLabel: S.x, yLabel: S.y, maxX: 15, maxY: ymax, w: q4w, h: 280, ticksX: 3, ticksY: 2, title: S.title, fmtY: v => n1(v, 1) }),
        `<div class="metrics">${metric(S.m_con, '×' + con)}${metric(S.m_lam, lam + nb + S.u_um)}${metric(S.m_tot, tot + nb + '%')}</div>` + result(`<p>${esc(note)}</p>`) + `<p class="quiet">${esc(S.legend)}</p>`);
  };
  onGroup('q4r-p', i => { s.p = i; draw(); });
  onGroup('q4r-k', i => { s.k = i; draw(); });
  draw();
};

/* Схемы методов шага measure-polarity */
Object.assign(MTH, {

    let d = MTH.panel(10, 24, l.pA, l.a) + MTH.panel(250, 24, l.pB, l.b);
    /* А: монослой на фильтре (вид сбоку) */
    d += rect(10, 170, 220, 10, '#c8d6e2', 2) + tx(120, 200, l.filter, q4F(14));
    [0, 1, 2, 3].forEach(i => { const x = 14 + i * 54; d += rect(x, 90, 50, 80, '#fff', 6, 'stroke="#6d8ba5" stroke-width="2"') + line(x + 4, 90, x + 46, 90, C4.amber, 5) + line(x, 96, x, 166, C4.purple, 3) + line(x + 50, 96, x + 50, 166, C4.purple, 3); });
    d += line(10, 130, 230, 130, C4.red, 2, 'stroke-dasharray="6 4"') + tx(120, 78, l.z, q4F(14));
    /* Б: срез XZ */
    d += rect(270, 80, 190, 110, '#10151b', 6);
    [0, 1, 2].forEach(i => { const x = 280 + i * 60; d += line(x, 92, x + 52, 92, '#e8c21a', 6) + line(x, 98, x, 178, '#d62f4b', 4) + line(x + 52, 98, x + 52, 178, '#d62f4b', 4); });
    d += rect(20, 230, 14, 14, '#e8c21a', 3) + tx(42, 242, l.api, q4F(14), 'start') + rect(20, 256, 14, 14, '#d62f4b', 3) + tx(42, 268, l.bas, q4F(14), 'start');
    return d;
  },
  q4frap(l){
    let d = MTH.panel(10, 24, l.pA, l.a) + MTH.panel(250, 24, l.pB, l.b);
    d += line(20, 110, 230, 110, C4.amber, 10) + line(120, 98, 120, 122, '#556171', 2) + tx(120, 90, l.dom, q4F(14));
    d += rect(55, 100, 40, 20, '#10151b', 3, 'opacity="0.85"') + tx(75, 145, l.bleach, q4F(14));
    d += edge4([30, 160, 55, 160], 'move') + edge4([110, 160, 96, 160], 'move');
    const X0 = 270, Y0 = 210;
    d += line(X0, Y0, 460, Y0, '#7f97ab', 1.5) + line(X0, 70, X0, Y0, '#7f97ab', 1.5);
    let pth = `M${X0} 80 L${X0 + 30} 80 L${X0 + 30} 190`;
    for (let i = 0; i <= 20; i++) { const x = X0 + 30 + i * 8, y = 190 - 100 * (1 - Math.exp(-i / 4)); pth += ` L${x} ${y.toFixed(1)}`; }
    d += `<path d="${pth}" fill="none" stroke="${C4.blue}" stroke-width="3"/>` + tx(370, 232, l.t, q4F(14)) + tx(X0 + 4, 64, l.f, q4F(14), 'start');
    return d;
  },
  q4ter(l){
    let d = MTH.panel(10, 24, l.pA, l.a) + MTH.panel(250, 24, l.pB, l.b);
    d += rect(20, 60, 210, 170, '#eef3f7', 8, 'stroke="#9db4c8" stroke-width="2"') + rect(60, 130, 130, 10, '#c8d6e2', 2);
    [0, 1, 2, 3].forEach(i => { d += rect(62 + i * 32, 118, 28, 12, '#fff', 3, 'stroke="#6d8ba5"'); });
    d += tx(125, 160, l.mono, q4F(13)) + tx(125, 80, l.ap, q4F(13)) + tx(125, 220, l.bl, q4F(13));
    d += line(40, 70, 40, 115, C4.red, 4) + line(40, 145, 40, 215, C4.red, 4) + tx(30, 250, l.el, q4F(13), 'start');
    const Y0 = 220, H = 116;
    d += line(270, Y0, 460, Y0, '#7f97ab', 1.5) + tx(270, 62, l.y, q4F(13), 'start');
    d += rect(300, Y0 - H, 50, H, C4.teal, 4) + tx(325, Y0 + 20, l.norm, q4F(13)) + rect(390, Y0 - H * 0.3, 50, H * 0.3, C4.teal, 4) + tx(415, Y0 + 20, l.ko, q4F(13));
    d += tx(325, Y0 - H - 8, l.v_norm, q4F(13)) + tx(415, Y0 - H * 0.3 - 8, l.v_ko, q4F(13));
    return d;
  },
  q4flux(l){
    let d = MTH.panel(10, 24, l.pA, l.a) + MTH.panel(250, 24, l.pB, l.b);

      if (after) [0, 1, 2, 3].forEach(i => { s += circ(x0 + 40 + i * 36, 180, 5, C4.amber); });
      return s; };
    d += well(20, false) + well(260, true);
    d += circ(30, 252, 5, C4.amber) + tx(42, 257, l.small, q4F(13), 'start') + circ(160, 252, 9, C4.purple, 'opacity="0.8"') + tx(176, 257, l.big, q4F(13), 'start');
    return d;
  },
});

    const st = S.states[s.mode];

      d += line(x1, y1, x2, y2, '#6d8ba5', 7, 'stroke-linecap="round"');

    d += tx(14, 284, S.dend, 15, 'start');

    d += tx(88, 155, S.nuc, 12.5, 'middle') + tx(95, 222, S.soma, 15, 'middle');
    /* аксон */
    d += line(145, 150, 556, 150, '#6d8ba5', 9, 'stroke-linecap="round"');
    d += tx(380, 128, S.axon, 15, 'middle');
    /* начальный сегмент */
    if (st.ais) d += rect(152, 140, 52, 20, '#d3ecec', 5, 'stroke="#0d6e73" stroke-width="2.5"');
    else d += rect(152, 140, 52, 20, '#fff', 5, 'stroke="#9aa7b3" stroke-width="2" stroke-dasharray="5 4"') + cross(178, 150);
    d += tx(186, 186, S.ais, 13.5, 'start');
    /* шипики на бывшем аксоне (если начальный сегмент разобран) */
    if (st.spines) for (let k = 0; k < 5; k++){ const px = 250 + k * 60; d += line(px, 146, px + 7, 134, '#6d8ba5', 3) + circ(px + 8, 131, 4, '#6d8ba5'); }
    /* синапс */
    d += circ(586, 150, 30, '#fbe9c2', 'stroke="#c98a0b" stroke-width="3"') + tx(632, 108, S.syn, 14.5, 'end');
    /* лизосомы на аксоне и РНП-гранулы */
    const lys = [[270, 160], [390, 160], [500, 160]];
    lys.forEach(([x, y]) => { d += circ(x, y + 6, 8, '#f6e3eb', 'stroke="#ae3a6c" stroke-width="2"'); if (st.rnp) d += circ(x + 9, y + 15, 5.5, '#6748b6'); });
    if (!st.rnp) [[110, 128], [118, 172], [72, 172], [126, 150]].forEach(([x, y]) => { d += circ(x, y, 5.5, '#6748b6'); });
    /* митохондрии: тело, аксон, синапс */
    const [m0, m1, m2] = st.mito;
    const somaPos = [[70, 120], [108, 118], [66, 182], [112, 182], [60, 150], [122, 140], [100, 196]];
    for (let k = 0; k < NM.soma[m0]; k++) d += mito(somaPos[k][0], somaPos[k][1], k * 25);
    const axPos = [235, 300, 345, 430, 465, 530];
    for (let k = 0; k < NM.axon[m1]; k++) d += mito(axPos[k], 140, 0);
    const synPos = [[574, 140], [598, 142], [580, 162], [600, 160]];
    for (let k = 0; k < NM.syn[m2]; k++) d += mito(synPos[k][0], synPos[k][1], 15);
    /* легенда */
    d += mito(250, 252) + tx(268, 257, S.lg_mito, 13, 'start');
    d += circ(380, 252, 8, '#f6e3eb', 'stroke="#ae3a6c" stroke-width="2"') + tx(394, 257, S.lg_lyso, 13, 'start');
    d += circ(480, 252, 5.5, '#6748b6') + tx(492, 257, S.lg_rnp, 13, 'start');
    const lv = i => S.lv[i];
    out(svg(d, S.title, 300, 640, st.note),
      `<div class="metrics">${metric(S.m_soma, lv(m0))}${metric(S.m_axon, lv(m1))}${metric(S.m_syn, lv(m2))}${metric(S.m_rnp, lv(st.rnp))}</div>` + result(`<p>${esc(st.note)}</p>`));
  };
  onGroup('q5n-mode', i => { s.mode = i; draw(); });
  draw();
};


/* Как у семинара 3 (V05): на экране уже 760 px схема не сжимается до нечитаемых подписей, а лежит в прокручиваемой рамке (ширина не меньше 760 CSS-пикселей).
   Обёртка добавляется после каждой перерисовки виджета; подсказка берётся из CONTENT.ui.svg_hint (в коде русских фраз нет). */
(function(){
  const css = document.createElement('style');
  css.textContent = '@media (max-width:760px){.svgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}.svgscroll::before{content:var(--svg-hint,"");display:block;position:sticky;left:0;font-size:12.5px;line-height:1.35;padding:6px 10px;color:var(--muted)}.svgscroll>svg{min-width:760px;border:0!important;border-radius:0!important}}';
  document.head.appendChild(css);
  document.documentElement.style.setProperty('--svg-hint', JSON.stringify(CONTENT.ui.svg_hint || ''));
  const wrap = root => root.querySelectorAll('.widget svg[viewBox]').forEach(sv => {
    if (sv.parentElement.classList.contains('svgscroll') || sv.classList.contains('lg') || sv.getAttribute('aria-label') === CONTENT.ui.chart_levels) return;
    const vb = sv.viewBox.baseVal; if (!vb || vb.width < 560) return;
    const d = document.createElement('div'); d.className = 'svgscroll'; sv.parentNode.insertBefore(d, sv); d.appendChild(sv);
    if (sv.dataset.center) d.scrollLeft = (d.scrollWidth - d.clientWidth) * parseFloat(sv.dataset.center);
  });
  new MutationObserver(() => wrap(document)).observe(document.body, { childList: true, subtree: true });
  wrap(document);
})();
