отдельным опытом: фермент переносят в новое место или мембраны соединяют искусственной привязкой и смотрят, возникает ли процесс."],"conditions":"Сводная таблица по шагам разделов 1–4; схемы методов показаны в шагах «Как измеряют pH и редокс-потенциал внутри органеллы», «Как измеряют градиенты в живой клетке и чем ограничены эти измерения», «Что показывают методы изучения фосфоинозитидов и где их пределы» и «Как доказывают, что мембраны в контакте, а не слились». Перенос фосфатазы на плазматическую мембрану рапамицином — Hammond 2012 (клетки COS-7); ограничения адресованных сенсоров — Lyons 2023; рекомендации к доказательству контакта — Calì 2025.","sources":["Lyons2023","Hammond2012","Cali2025","Casey2009"],"quiz":{"id":"S1-L29","question":"После стимула общее содержание кальция в лизате клеток не изменилось. Какой вывод из этого измерения допустим?","options":[{"id":"S1-L29-1","text":"О локальном сигнале по этому измерению судить нельзя","correct":true,"feedback":"Лизат даёт среднюю по клетке величину и общий, а не свободный кальций. Неизменное среднее совместимо и с отсутствием сигнала, и с локальным подъёмом в малом объёме, и с перераспределением между депо и цитозолем. Различить их можно только адресованным сенсором с разрешением во времени и пространстве."},{"id":"S1-L29-2","text":"Сигнала Ca²⁺ в клетках не было","correct":false,"feedback":"Отсутствие изменения среднего не доказывает отсутствия сигнала: 10⁴ ионов в объёме клетки прибавляют лишь около 17 нМ общего кальция, а в микродомене те же ионы дают около 170 мкМ."},{"id":"S1-L29-3","text":"Сигнал был, но кальций связали буферы","correct":false,"feedback":"Этот вариант тоже делает вывод, которого измерение не поддерживает: общее содержание кальция не говорит ни о наличии сигнала, ни о том, какая часть ионов связана. Для такого заключения нужен отдельный опыт со свободным Ca²⁺."}]},"widget":{"kind":"table","title":"","s":{"title":"Величина, метод, контроль","status":"Схема метода (сводная таблица)","modes_label":"Механизм","modes":["компартмент","локальная концентрация","фосфоинозитиды","контактный сайт"],"tables":[{"head":["Что","Содержание"],"rows":[["величина","pH, свободный Ca²⁺ или потенциал пары глутатиона в просвете названной органеллы; Δψ митохондрии"],["метод","сенсор с сигналом адресации в органеллу; отношение сигналов при двух длинах волн; калибровка в крайних точках (ионофоры, полное окисление и восстановление); TMRM для Δψ"],["контроль","ингибитор насоса (бафиломицин A1, тапсигаргин) — различие поддерживается работой; протонофор FCCP — нижняя точка Δψ"],["ограничение","интенсивность одного канала зависит от количества сенсора; нормальный Δψ не доказывает работы дыхательной цепи"]],"note":"Число без названия сенсора, места адресации и способа калибровки не сравнимо между работами."},{"head":["Что","Содержание"],"rows":[["величина","концентрация в точке и её профиль; отдельно — средняя по клетке; свободная или общая форма"],["метод","генетически кодируемые сенсоры (FRET и с одним флуоресцентным белком), адресованные к месту события; FRAP — подвижность"],["контроль","изменение стока (ингибитор PDE, фосфатазы) при неизменном источнике; отделение фермента от места (пептид Ht31)"],["ограничение","сенсор связывает лиганд и буферирует его; без калибровки насыщение сенсора неотличимо от прекращения роста концентрации лиганда"]],"note":"Анализ лизата даёт среднюю величину и не может показать микродомен."},{"head":["Что","Содержание"],"rows":[["величина","содержание определённого фосфоинозитида на определённой мембране; доля эффектора на мембране"],["метод","сенсор на основе липид-связывающего домена при низкой экспрессии; липидомика — общий состав"],["контроль","перенос фосфатазы на мембрану рапамицином за минуты; неактивная фосфатаза и опыт без рапамицина"],["ограничение","сенсор на основе одного домена показывает места, где липид сочетается с условиями связывания, и конкурирует с эндогенными эффекторами"]],"note":"Метку можно считать причиной, только если её удаление меняет поведение мембраны."},{"head":["Что","Содержание"],"rows":[["величина","расстояние между мембранами; тетеринг-белки в зоне сближения; раздельность содержимого; поток вещества через контакт"],["метод","электронная и криоэлектронная томография; FRET и репортёры из двух половин; отдельное измерение переноса липида или Ca²⁺"],["контроль","удаление тетеринг-белка — геометрия и функция; искусственная привязка — достаточность сближения"],["ограничение","колокализация в обычном световом микроскопе (разрешение около 200 нм) контакта не доказывает; репортёр из двух половин может стабилизировать контакт"]],"note":"Площадь контакта и перенос через него — разные величины: перенос измеряют отдельно."}]}},"section":4,"number":29,"question":0},{"id":"investigation","questions":[1,2,3,4],"title":"Исследование одной лизосомы: кислый просвет, метка, кальций и контакты","keywords":["лизосома","TRPML1","MCOLN1","кальциневрин","TFEB","BAPTA","EGTA","HBSS","рецептор IP₃","контакт","PI(3,5)P₂"],"lead":["Лизосома объединяет все четыре механизма семинара: насос поддерживает кислую среду просвета, мембрану размечает PI(3,5)P₂, выход Ca²⁺ через канал TRPML1 создаёт местный сигнал, а выход Ca²⁺ из ЭПР через IP₃R участвует в пополнении её запаса Ca²⁺ (путь в просвет лизосомы не установлен).","Опыт Medina 2015 показывает, как отличить местный сигнал от общего подъёма Ca²⁺ по всей цитоплазме."],"mechanism":["Компартмент и метка: V-АТФаза поддерживает pH просвета 4,5–5,0, а PI(3,5)P₂ поздних эндосом и лизосом активирует Ca²⁺-канал [[T69|TRPML1]] (MCOLN1).","Местный сигнал: в клетках HeLa в солевом растворе без аминокислот и сыворотки (HBSS) Ca²⁺ выходит из лизосом через TRPML1, [[T92|кальциневрин]] дефосфорилирует TFEB, и TFEB перемещается в ядро; экворин общего подъёма Ca²⁺ в объёме цитозоля при этом не обнаруживает.","Пополнение: выход Ca²⁺ из ЭПР через рецепторы IP₃ участвует в пополнении запаса Ca²⁺ лизосомы — блокада этих рецепторов прекращала пополнение. IP₃R находится в мембране ЭПР и не служит каналом через обе мембраны: в просвет лизосомы Ca²⁺ должен войти отдельным путём, который не установлен; участие тесного сближения органелл авторы предлагают как объяснение (Garrity 2016)."],"paragraphs":["Лизосома удобна как итоговый пример, потому что в ней сходятся все четыре вопроса. Её просвет — неравновесный компартмент: V-АТФаза закачивает протоны и поддерживает pH 4,5–5,0, а свободного Ca²⁺ в просвете — сотни микромолей при концентрации около 100 нМ в цитозоле. Мембрану поздней эндосомы и лизосомы размечает PI(3,5)P₂, синтезируемый киназой PIKfyve; в опытах с изолированными лизосомами этот липид прямо активировал канал TRPML1 (Dong 2010). Так метка мембраны оказывается условием работы её канала.","Medina и соавторы (2015) искали фосфатазу, которая дефосфорилирует фактор транскрипции TFEB. Ею оказался кальциневрин — Ca²⁺-зависимая фосфатаза. В клетках HeLa в солевом растворе без аминокислот и сыворотки TFEB перемещался в ядро, хотя экворин в объёме цитозоля не регистрировал подъёма Ca²⁺. Сигнал зарегистрировал сенсор GCaMP3, присоединённый к самому TRPML1, то есть закреплённый на поверхности лизосомы. Перемещение TFEB подавляли быстрый [[T93|буфер Ca²⁺]] BAPTA (но не медленный EGTA) и подавление синтеза TRPML1. Такой набор результатов согласуется с [[T06|микродоменом]] — тесным пространственно-временным сопряжением источника Ca²⁺ и мишени: ион связывается с ближайшей мишенью раньше, чем его перехватит медленный буфер или он разбавится в объёме цитозоля. Определённое расстояние из сравнения BAPTA и EGTA без кинетической модели не следует, тем более что одинаковые дозы BAPTA-AM и EGTA-AM не обязательно создают в клетке одинаковую буферную ёмкость.","Запас Ca²⁺ лизосомы ограничен, и после выброса он должен пополняться. Garrity и соавторы (2016) показали, что пополнение продолжалось при ингибиторе V-АТФазы, но прекращалось при опустошении ЭПР или блокаде рецепторов IP₃; авторы предположили, что Ca²⁺ поступает в местах тесного сближения ЭПР с лизосомой. Как Ca²⁺, вышедший из ЭПР, пересекает затем мембрану лизосомы, из этих опытов не следует; на схеме этот участок пути показан точками со знаком вопроса. Контакт лизосомы с митохондрией, в свою очередь, задаёт место деления митохондрии (Wong 2018). Переключайте условия на схеме и проследите, какое показание меняется в каждом опыте: pH просвета, сигнал у лизосомы, средний Ca²⁺ в цитоплазме или положение TFEB."],"trap":["Если средняя концентрация Ca²⁺ в цитозоле не выросла, то и Ca²⁺-зависимые ферменты не активировались.","Фермент у источника отвечает на локальную концентрацию. В солевом растворе без аминокислот и сыворотки экворин в объёме цитозоля не регистрировал подъёма, а сенсор на поверхности лизосомы регистрировал, и кальциневрин дефосфорилировал TFEB; быстрый буфер BAPTA этот ответ подавлял, медленный EGTA — нет."],"conditions":"Выход Ca²⁺ через TRPML1, кальциневрин и TFEB — клетки HeLa (также HEK293 и мышечные волокна мыши); среда — солевой раствор HBSS без аминокислот и сыворотки; Ca²⁺ в объёме цитозоля — экворин, у лизосомы — сенсор ML1-GCaMP3 (ратиометрическое измерение при 474 и 410 нм); BAPTA-AM 5–25 мкМ, EGTA-AM 5 мкМ (Medina 2015, полный текст); принцип сравнения быстрого и медленного буферов — Eggermann 2012; дозы BAPTA-AM и EGTA-AM в работе различались, и равенство их внутриклеточной буферной ёмкости не проверялось. В опытах с буферами и с подавлением TRPML1 сигнал сенсора и средний Ca²⁺ не измеряли — на схеме «нет данных». Активация TRPML1 липидом PI(3,5)P₂ — электрофизиология изолированных эндолизосом (Dong 2010). Пополнение запаса Ca²⁺ лизосом из ЭПР через рецепторы IP₃ — клетки HEK293 и фибробласты, повторный вызов выброса агонистом TRPML1 (Garrity 2016, по реферату). Уровни на схеме качественные («нет / низкий / средний / высокий»), числа pH и Ca²⁺ — порядки величины для покоящихся клеток млекопитающих.","sources":["Medina2015","Garrity2016","Dong2010","Xu2015","Casey2009","Wong2018","Eggermann2012"],"quiz":{"id":"S1-L30","question":"В клетках HeLa в растворе без аминокислот и сыворотки TFEB перемещается в ядро. Сенсор GCaMP3, присоединённый к каналу TRPML1, регистрирует сигнал у лизосомы, а экворин общего подъёма Ca²⁺ в цитозоле не обнаруживает; подавление синтеза TRPML1 уменьшает перемещение TFEB. BAPTA подавляет перемещение, EGTA — нет. Что следует из этих результатов?","options":[{"id":"S1-L30-1","text":"Сигнал создаёт местный выброс Ca²⁺ у лизосомы","correct":true,"feedback":"Источник — лизосома: сигнал регистрирует сенсор на TRPML1, а подавление синтеза TRPML1 уменьшает перемещение TFEB. На местный характер сигнала указывают отсутствие общего подъёма по экворину и действие быстрого буфера BAPTA при отсутствии эффекта медленного EGTA."},{"id":"S1-L30-2","text":"Перемещение TFEB не зависит от ионов Ca²⁺","correct":false,"feedback":"Против этого говорят условие — BAPTA подавляет перемещение — и другие опыты той же работы: ингибиторы кальциневрина и клетки без его регуляторной субъединицы уменьшали перемещение TFEB. Отсутствие общего подъёма Ca²⁺ по экворину не исключает местного сигнала."},{"id":"S1-L30-3","text":"Сигнал создаёт медленный подъём Ca²⁺ во всём цитозоле","correct":false,"feedback":"Экворин общего подъёма Ca²⁺ в объёме цитозоля не обнаружил, а медленный буфер EGTA ответ не подавил. Оба результата согласуются с местным сигналом у лизосомы, а не с общим подъёмом."}],"rev":2},"widget":{"kind":"q5lyso","title":"","s":{"title":"Одна лизосома: насос, метка, канал и контакт","status":"Схема механизма; качественные уровни по данным Medina 2015 и Garrity 2016 (клетки HeLa и HEK293)","modes_label":"Условия","modes":["полная среда","без аминокислот и сыворотки","то же + BAPTA","то же + EGTA","то же, TRPML1 снижен","повторный выброс, блокада IP₃R"],"lys":"лизосома","lumen":"просвет: pH 4,5–5,0, Ca²⁺ — сотни мкМ","vatp":"V-АТФаза","trpml1":"TRPML1","pip":"PI(3,5)P₂","er":"ЭПР","ip3r":"IP₃R","can":"кальциневрин","tfeb":"TFEB","nuc":"ядро","cyto":"цитозоль","bapta":"BAPTA","egta":"EGTA","sensor":"сенсор на TRPML1","aeq":"экворин в цитозоле","lg_ca":"Ca²⁺","lg_h":"H⁺","lg_tr":"перенос иона","lg_act":"активирует","lg_buf":"буфер связывает Ca²⁺","m_ph":"pH просвета","m_loc":"Ca²⁺ у лизосомы (сенсор на TRPML1)","m_bulk":"Ca²⁺ в объёме цитозоля (экворин)","m_tfeb":"TFEB в ядре","m_store":"запас Ca²⁺ лизосомы","lv":["нет","низкий","средний","высокий","нет данных"],"ph_acid":"кислый","states":[{"loc":1,"bulk":1,"tfeb":1,"store":3,"buf":"","chan":1,"ip3r":1,"note":"В полной среде выброс Ca²⁺ из лизосом невелик; TFEB фосфорилирован и находится преимущественно в цитоплазме."},{"loc":3,"bulk":1,"tfeb":3,"store":4,"buf":"","chan":1,"ip3r":1,"note":"В растворе без аминокислот и сыворотки Ca²⁺ выходит через TRPML1: сенсор на поверхности лизосомы регистрирует сигнал, экворин в объёме цитозоля — нет. Кальциневрин у лизосомы дефосфорилирует TFEB, и TFEB перемещается в ядро."},{"loc":4,"bulk":4,"tfeb":1,"store":4,"buf":"bapta","chan":1,"ip3r":1,"note":"Быстрый буфер BAPTA связывает Ca²⁺ рядом с каналом, раньше, чем ион доходит до кальциневрина: перемещение TFEB подавлено."},{"loc":4,"bulk":4,"tfeb":3,"store":4,"buf":"egta","chan":1,"ip3r":1,"note":"Медленный буфер EGTA не успевает связать Ca²⁺ на коротком пути от канала к кальциневрину: TFEB перемещается в ядро, как без буфера."},{"loc":4,"bulk":4,"tfeb":1,"store":4,"buf":"","chan":0,"ip3r":1,"note":"При подавлении синтеза TRPML1 канала в мембране лизосомы меньше, и перемещение TFEB в ядро в растворе без аминокислот и сыворотки уменьшено."},{"loc":1,"bulk":4,"tfeb":4,"store":1,"buf":"","chan":1,"ip3r":0,"note":"После выброса запас Ca²⁺ лизосомы пополняется при участии выхода Ca²⁺ из ЭПР через рецепторы IP₃: при их блокаде пополнение прекращалось, и повторный вызов выброса агонистом TRPML1 давал меньший сигнал (Garrity 2016). Каким путём Ca²⁺ затем входит в лизосому, не установлено (точки со знаком вопроса)."}],"path_q":"вход в лизосому: путь не установлен"}},"section":4,"number":30,"question":0}],"sections":[{"title":"Компартменты и локальные условия","entry":"compartment","sub":"Как граница и работа насосов создают собственные условия внутри органеллы"},{"title":"Локальная концентрация","entry":"local-conc","sub":"Как источник, диффузия и сток создают градиент внутри одного объёма"},{"title":"Фосфоинозитиды","entry":"lipid-code","sub":"Как минорные липиды размечают мембраны и как эту разметку читают"},{"title":"Контактные сайты","entry":"contact-site","sub":"Как органеллы обмениваются липидами и Ca²⁺ без слияния мембран"},{"title":"Исследование","entry":"methods","sub":"Как выбрать величину, метод и контроль","integr":true}],"glossary":[{"id":"S1-T01","term":"Компартмент","section":0,"def":"Область клетки, отделённая от окружения границей — биологической мембраной или фазовой границей, — внутри которой набор физико-химических условий (pH, ионный состав, редокс-состояние, состав липидов и белков) отличается от условий в окружающем объёме. Компартмент задан не формой, а границей и набором условий, которые она удерживает. Различие бывает равновесным (избирательное распределение веществ) или неравновесным — тогда его поддерживает избирательный транспорт с затратой энергии."},{"id":"S1-T02","term":"Биологическая мембрана","section":0,"def":"Липидный бислой со встроенными и связанными с ним белками. Сам бислой почти непроницаем для ионов и полярных молекул и потому может удерживать различие концентраций, но не создаёт его; избирательный перенос через мембрану выполняют белки — насосы, каналы, переносчики и транслоказы."},{"id":"S1-T03","term":"Разность электрохимического потенциала (Δμ)","section":0,"def":"Мера движущей силы переноса вещества через мембрану: Δμ = RT·ln(c₂/c₁) + zF·(ψ₂ − ψ₁), где первое слагаемое — химическая часть (разность концентраций), второе — электрическая (z — заряд иона, ψ — потенциал стороны). Если Δμ < 0, перенос со стороны 1 на сторону 2 самопроизволен и для него достаточно канала; если Δμ > 0, нужен насос или сопряжённый переносчик. Для иона «по градиенту» не всегда значит «в сторону меньшей концентрации»."},{"id":"S1-T04","term":"Мембранный потенциал митохондрии (Δψ)","section":0,"def":"Разность электрических потенциалов на внутренней мембране митохондрии (около −150…−180 мВ; матрикс заряжен отрицательно), которую создаёт перенос протонов дыхательной цепью. Вместе с разностью pH составляет протон-движущую силу. Δψ — состояние мембраны, а не поток: нормальный Δψ сам по себе не доказывает работы дыхательной цепи. Оценивают по накоплению катионного зонда, например TMRM; протонофор FCCP снимает Δψ."},{"id":"S1-T05","term":"Свободная и общая концентрация","section":0,"def":"Свободная концентрация — концентрация вещества, не связанного с белками и другими лигандами; именно она определяет связывание с эффектором и движущую силу переноса. Общая концентрация — сумма свободной и связанной форм. Для Ca²⁺ они различаются во много раз: буферы связывают большую часть вошедших ионов, а в депо общий кальций намного выше свободного."},{"id":"S1-T06","term":"Локальная концентрация и микродомен","section":1,"def":"Локальная концентрация — концентрация вещества в том малом объёме, где идёт рассматриваемая реакция (просвет органеллы, область у устья канала, поверхность мембраны), в отличие от средней концентрации, отнесённой к объёму всей клетки. Микродомен — область от десятков нанометров до нескольких микрометров, где концентрация сигнального вещества или другой параметр устойчиво отличается от среднего по компартменту."},{"id":"S1-T07","term":"Стационарное неравновесное состояние","section":0,"def":"Состояние, которое не меняется во времени, потому что противоположные потоки равны (перенос насосом и утечка, синтез и удаление), а не потому, что процессы остановились. Оно поддерживается непрерывной затратой энергии и после остановки источника энергии релаксирует к равновесию; время релаксации у разных параметров различается на порядки."},{"id":"S1-T08","term":"Генетически кодируемый биосенсор","section":0,"def":"Белок, кодируемый введённым в клетку геном, у которого связывание лиганда или изменение измеряемого параметра (pH, Ca²⁺, потенциал пары глутатиона, cAMP, фосфоинозитид) меняет флуоресценцию. Сенсор можно адресовать в нужный компартмент и измерять величину там, где идёт событие. Сенсор входит в измеряемую систему: он связывает лиганд и потому буферирует его, а его динамический диапазон ограничен."},{"id":"S1-T09","term":"Фосфоинозитиды","section":2,"def":"Производные фосфатидилинозитола (PI), у которых инозитольное кольцо дополнительно фосфорилировано в положениях 3, 4 или 5 в разных сочетаниях (PI3P, PI4P, PI(3,5)P₂, PI(4,5)P₂, PI(3,4,5)P₃ и др.). Составляют малую долю мембранных фосфолипидов — заметно меньшую, чем сам фосфатидилинозитол, — но служат одним из основных признаков, по которым белки узнают мембрану того или иного компартмента; их взаимопревращают локализованные липидкиназы и липидфосфатазы."},{"id":"S1-T10","term":"Насос (первично-активный переносчик)","section":0,"def":"Мембранный белок, переносящий вещество против его электрохимического градиента за счёт непосредственного сопряжения с источником энергии — гидролизом ATP (V-АТФаза, SERCA, Na⁺/K⁺-АТФаза) или переносом электронов (комплексы дыхательной цепи). Создаёт различие между компартментами; при остановке насоса различие постепенно рассеивается утечкой."},{"id":"S1-T11","term":"Канал","section":0,"def":"Мембранный белок, через пору которого ион проходит только по электрохимическому градиенту (Δμ < 0). Канал не создаёт различие, а расходует его — для передачи сигнала (рецептор IP₃, MCU) или для возврата к исходному состоянию. Избирательность канала определяет, какой ион пройдёт, но не направление переноса."},{"id":"S1-T12","term":"Сопряжённый переносчик (вторично-активный транспорт)","section":0,"def":"Переносчик, перемещающий вещество против его градиента за счёт энергии градиента другого вещества, созданного насосом: симпортеры и антипортеры, например Na⁺/Ca²⁺-обменник плазматической мембраны. Сам ATP не гидролизует."},{"id":"S1-T13","term":"Транслоказы TOM и TIM23; MTS","section":0,"def":"Белковые комплексы наружной (TOM) и внутренней (TIM23) мембран митохондрии, переносящие в матрикс белки, синтезированные в цитозоле. Сигналом служит N-концевая адресующая последовательность (MTS) — положительно заряженный пептид, который отщепляется после импорта. Перенос MTS через TIM23 требует Δψ, а не всей протон-движущей силы."},{"id":"S1-T14","term":"Протон-движущая сила","section":0,"def":"Энергия, запасённая в градиенте протонов на внутренней мембране митохондрии: сумма электрической части (Δψ) и химической (разность pH между матриксом и межмембранным пространством). Используется ATP-синтазой и рядом переносчиков; Δψ отдельно движет импорт через TIM23 и вход Ca²⁺ через MCU."},{"id":"S1-T15","term":"Деполяризация митохондрии","section":0,"def":"Снижение абсолютной величины Δψ (матрикс становится менее отрицательным), а не изменение формы органеллы. Последствия зависят от величины и длительности снижения и от причины: протонофор, остановка дыхания, открытие пор во внутренней мембране."},{"id":"S1-T16","term":"Потенциал пары глутатиона E(GSH/GSSG)","section":0,"def":"Фактический окислительно-восстановительный потенциал пары 2GSH/GSSG в компартменте: E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]). Отличается от стандартного потенциала E°′ (около −240 мВ при pH 7,0) и зависит от отношения GSH:GSSG, от абсолютной концентрации GSH, от pH и температуры. Описывает только пару глутатиона: другие редокс-пары того же компартмента не обязаны быть с ней в равновесии."},{"id":"S1-T17","term":"Кислые гидролазы; катепсины","section":0,"def":"Ферменты просвета лизосомы (протеазы, липазы, гликозидазы, нуклеазы — более 60), расщепляющие макромолекулы; их оптимум активности — в кислой среде. Катепсины — лизосомные протеазы; при выходе в цитозоль через повреждённую мембрану лизосомы они расщепляют цитозольные белки и могут запустить гибель клетки."},{"id":"S1-T18","term":"V-АТФаза","section":0,"def":"Вакуолярная H⁺-АТФаза — насос мембран лизосом, эндосом и пузырьков аппарата Гольджи; за счёт гидролиза ATP переносит протоны из цитозоля в просвет. Создаёт кислую среду лизосомы; степень закисления зависит и от переноса противоионов. Ингибируется бафиломицином A1 и конканамицином A."},{"id":"S1-T19","term":"SERCA","section":0,"def":"Ca²⁺-АТФаза мембраны ЭПР: за счёт гидролиза ATP переносит Ca²⁺ из цитозоля в просвет ЭПР и поддерживает там сотни микромолей свободного Ca²⁺. Необратимо ингибируется тапсигаргином."},{"id":"S1-T20","term":"MCU (митохондриальный кальциевый унипортер)","section":0,"def":"Высокоселективный Ca²⁺-канал внутренней мембраны митохондрии. Ca²⁺ входит через него в матрикс по электрохимическому градиенту, который создаёт отрицательный Δψ; работу совершает дыхательная цепь, а не MCU. Регуляторы MICU1/MICU2 делают захват Ca²⁺ пороговым (раздел 4)."},{"id":"S1-T21","term":"ATP-синтаза","section":0,"def":"Комплекс внутренней мембраны митохондрии: протоны, возвращаясь в матрикс через Fo-часть, приводят в действие синтез ATP в F1-части. Реакция обратима: при сниженном Δψ и наличии ATP (например, гликолитического) фермент гидролизует ATP и выводит протоны из матрикса, поддерживая Δψ. Гликолитический ATP поступает в матрикс через транслокатор адениннуклеотидов; гидролиз ограничивает белок-ингибитор IF1."},{"id":"S1-T22","term":"Бафиломицин A1","section":0,"def":"Ингибитор V-АТФазы; F-АТФазу митохондрий в тех же концентрациях не ингибирует. Мембрану лизосомы не разрушает: pH просвета растёт постепенно, а доставленный в лизосомы белок перестаёт расщепляться. Исследовательский инструмент, а не лекарство."},{"id":"S1-T23","term":"Тапсигаргин","section":0,"def":"Необратимый ингибитор SERCA. Каналы ЭПР не открывает и мембрану не разрушает: Ca²⁺ выходит из просвета путями утечки (в покое утечку уравновешивает SERCA), и после короткой начальной фазы депо опустошается за минуты; опустошение запускает депо-зависимый вход Ca²⁺ через плазматическую мембрану."},{"id":"S1-T24","term":"Антимицин A и олигомицин","section":0,"def":"Антимицин A ингибирует комплекс III дыхательной цепи и останавливает перенос электронов к кислороду. Олигомицин ингибирует Fo-часть ATP-синтазы и блокирует оба направления её работы. Вместе они останавливают оба генератора Δψ; по отдельности позволяют различить, что поддерживает потенциал."},{"id":"S1-T25","term":"FCCP (протонофор)","section":0,"def":"Липофильная слабая кислота, переносящая протоны через внутреннюю мембрану в обход ATP-синтазы (разобщитель). Снимает Δψ и протонный градиент. Если концентрация протонофора оптимальна, субстратов достаточно, а у клеток есть дыхательный резерв, дыхание ускоряется до максимальной скорости, возможной в этих условиях (избыток протонофора дыхание подавляет), а синтез ATP в митохондриях прекращается; при глюкозе в среде ATP-синтаза гидролизует гликолитический ATP, но Δψ не восстанавливается. Дыхательную цепь не ингибирует."},{"id":"S1-T26","term":"TMRM","section":0,"def":"Катионный флуоресцентный зонд, накапливающийся в матриксе тем сильнее, чем отрицательнее матрикс (распределение по уравнению Нернста). Отвечает и на потенциал плазматической мембраны. При загрузке в низких наномолярных концентрациях уравновешивается между средой и клеткой примерно за 60 мин, а между цитозолем и матриксом — намного быстрее, поэтому изменения Δψ видны за секунды и минуты (Brand и Nicholls 2011). Показывает состояние — Δψ, а не поток."},{"id":"S1-T27","term":"Ратиометрия","section":0,"def":"Способ измерения, при котором берут отношение сигналов одного сенсора при двух длинах волн возбуждения или испускания. Отношение практически не зависит от количества сенсора, толщины клетки и (в первом приближении) выцветания, но становится числом pH или потенциала только после калибровки."},{"id":"S1-T28","term":"Калибровка сенсора in situ","section":0,"def":"Перевод сигнала сенсора в физическую величину в той же клетке: для pH — растворы известного pH с ионофорами (нигерицин, монензин), выравнивающими pH органеллы и раствора; для редокс-сенсора — полное восстановление и полное окисление. Задаёт рабочий диапазон: вне его сенсор не различает значений."},{"id":"S1-T29","term":"Челночные системы (малат-аспартатный и глицерофосфатный челноки)","section":0,"def":"Способы перенести восстановительные эквиваленты цитозольного NADH в митохондрию, не перенося сам NADH, для которого внутренняя мембрана непроницаема. Малат-аспартатный челнок восстанавливает NAD⁺ матрикса; глицерофосфатный передаёт электроны через FAD митохондриальной глицерол-3-фосфатдегидрогеназы в пул убихинона, минуя комплекс I."},{"id":"S1-T30","term":"Средняя по клетке концентрация","section":1,"def":"Количество вещества, отнесённое к объёму всей клетки (или к массе белка), — то, что даёт анализ лизата: c = N/(N_A·V), где N — число молекул, N_A = 6,02·10²³ моль⁻¹, V — объём. Мера общего содержания; не показывает, какая концентрация достигнута там, где находится эффектор."},{"id":"S1-T31","term":"Буфер (кальциевый буфер)","section":1,"def":"Белок или другая молекула, обратимо связывающая ион или посредник. В начальной фазе сигнала быстрый ненасыщенный буфер удаляет свободную форму как сток; в длительном стационаре связывание и отщепление уравновешиваются, и постоянного стока буфер не создаёт. Неподвижные буферы ограничивают распространение свободного Ca²⁺, подвижные могут его ускорять; насыщенный буфер перестаёт сужать домен."},{"id":"S1-T32","term":"Макромолекулярный краудинг","section":1,"def":"Совокупность эффектов, вызванных тем, что 20–30 % объёма цитоплазмы занято макромолекулами (200–300 мг/мл): эффективная активность белков выше номинальной, исключённый объём при прочих равных благоприятствует сборке комплексов, диффузия замедлена. Неспецифические взаимодействия с окружающими белками могут действовать в обратную сторону, поэтому итог для устойчивости и связывания зависит от белка. Регулируется, например, через содержание рибосом."},{"id":"S1-T33","term":"Коэффициент диффузии (D)","section":1,"def":"Мера подвижности молекулы, мкм²/с: среднеквадратичное смещение за время t в одном измерении — √(2Dt). Для IP₃ в цитозольном экстракте — 283 мкм²/с, для GFP в цитоплазме — около 27 мкм²/с, для мембранных белков в плоскости мембраны — 0,05–1 мкм²/с."},{"id":"S1-T34","term":"Источник (в модели градиента)","section":1,"def":"Место, где вещество образуется или поступает в цитозоль: закреплённый фермент (аденилатциклаза, киназа), канал выхода из депо (рецептор IP₃) или направленный транспорт. Без источника неоднородности нет."},{"id":"S1-T35","term":"Сток (в модели градиента)","section":1,"def":"Процесс, удаляющий вещество из отслеживаемой формы: ферментативное разрушение (PDE для cAMP), секвестрация (SERCA для Ca²⁺), а в начальной фазе сигнала — связывание ненасыщенным буфером; для фосфорилированного белка — фосфатаза. Ускорение стока сужает домен."},{"id":"S1-T36","term":"Длина диффузии (λ)","section":1,"def":"Масштаб стационарного профиля «источник — диффузия — сток»: λ = √(D/k), где k — константа стока первого порядка. На расстоянии λ избыток концентрации над фоном падает в e ≈ 2,7 раза. Не путать со среднеквадратичным смещением √(2Dt) за время t."},{"id":"S1-T37","term":"Стационарный профиль концентрации","section":1,"def":"Распределение вещества, которое не меняется во времени, потому что в каждой точке приток диффузией и от источника равен удалению стоком. В одномерной модели с равномерным базальным источником, поддерживающим фон: c(x) = фон + (c₀ − фон)·e^(−x/λ). Исчезает, если остановить источник или сток."},{"id":"S1-T38","term":"Сверхчувствительность","section":1,"def":"Ответ, зависящий от концентрации сигнала круче гиперболы Михаэлиса. Крутизну описывает коэффициент Хилла n в уравнении R = cⁿ/(K½ⁿ + cⁿ): при n = 1 для перехода от 10 до 90 % ответа нужен рост концентрации в 81 раз, при n = 4 — в 3 раза."},{"id":"S1-T39","term":"Сверхчувствительность нулевого порядка","section":1,"def":"Резкая зависимость доли модифицированного белка от отношения активностей киназы и фосфатазы, возникающая, когда оба фермента насыщены субстратом (Goldbeter и Koshland 1981). Не требует кооперативного связывания."},{"id":"S1-T40","term":"Позиционная информация","section":1,"def":"Сведения о положении в клетке или ткани, которые несёт градиент: профиль концентрации задаёт координату, а эффектор с порогом превращает её в границу между областями с разным ответом."},{"id":"S1-T41","term":"Аденилатциклаза (AC)","section":1,"def":"Мембранный фермент, синтезирующий cAMP из ATP; активируется белком Gs после связывания гормона с рецептором. Источник cAMP в своём мембранном домене; форсколин активирует её напрямую."},{"id":"S1-T42","term":"Фосфодиэстеразы (PDE)","section":1,"def":"Ферменты, гидролизующие cAMP (и cGMP) до 5′-нуклеотидмонофосфата; cAMP гидролизуют восемь семейств. Многие изоформы закреплены у определённых мембран; работают как местный сток cAMP. IBMX — неизбирательный ингибитор."},{"id":"S1-T43","term":"Протеинкиназа A (PKA)","section":1,"def":"Тетрамер из двух регуляторных и двух каталитических субъединиц; связывание cAMP с регуляторными субъединицами освобождает активность каталитических. Донор фосфата — ATP. Закрепляется у мишеней белками AKAP."},{"id":"S1-T44","term":"AKAP (белки, закрепляющие PKA)","section":1,"def":"Якорные белки, связывающие регуляторные субъединицы PKA и удерживающие её у определённой мембраны или мишени; часто связывают также аденилатциклазу, PDE и фосфатазы. Определяют место работы PKA. Пептид Ht31 отделяет от них PKA типа II."},{"id":"S1-T45","term":"IBMX","section":1,"def":"3-изобутил-1-метилксантин — неизбирательный ингибитор фосфодиэстераз. Повышает cAMP по всей клетке и размывает границы доменов; служит проверкой того, что домен поддерживается стоком."},{"id":"S1-T46","term":"Пептид Ht31","section":1,"def":"Пептид из участка AKAP Ht31, связывающий регуляторную субъединицу RIIα PKA с наномолярным сродством и вытесняющий её из комплексов с AKAP. Проверяет, нужно ли закрепление PKA для ответа: активность PKA он не подавляет."},{"id":"S1-T47","term":"Градиент RanGTP","section":1,"def":"Неравномерное распределение ГТФазы Ran в форме, связанной с GTP: её много в ядре (или у хромосом в митозе), где работает фактор обмена RCC1, и мало в цитоплазме, где гидролиз ускоряют RanGAP1 и RanBP1. Задаёт направление ядерного транспорта."},{"id":"S1-T48","term":"FRET (фёрстеровский резонансный перенос энергии)","section":1,"def":"Безызлучательный перенос энергии от возбуждённого флуоресцентного белка-донора к акцептору, если они находятся на расстоянии в несколько нанометров. В сенсорах связывание лиганда меняет это расстояние, и измеряют отношение свечения донора и акцептора."},{"id":"S1-T49","term":"FRAP","section":1,"def":"Восстановление флуоресценции после выцветания: флуоресценцию в малой области гасят интенсивным светом и следят за её восстановлением. Скорость восстановления характеризует подвижность белка, неполное восстановление — долю неподвижных молекул."},{"id":"S1-T50","term":"Липидный код","section":2,"def":"Устойчивое распределение фосфоинозитидов по мембранам компартментов: PI(4,5)P₂ — плазматическая мембрана, PI4P — аппарат Гольджи (и плазматическая мембрана), PI3P — ранние эндосомы, PI(3,5)P₂ — поздние эндосомы и лизосомы. Точнее — разметка, которую белки считывают вместе с другими признаками мембраны: один липид встречается в нескольких мембранах, содержание меняется непрерывно, и белок узнаёт мембрану по сочетанию признаков, а не по одному липиду."},{"id":"S1-T51","term":"Характерный фосфоинозитид","section":2,"def":"Фосфоинозитид, обогащённый в мембране данного компартмента по сравнению с другими мембранами. Это не самый массовый липид мембраны, а минорный компонент, по которому её узнают белки; «характерный» не значит «единственный»."},{"id":"S1-T52","term":"Липидкиназы и липидфосфатазы","section":2,"def":"Ферменты, присоединяющие фосфат к определённому положению инозитольного кольца (киназы: PI4K, PIP5K, PI3K, VPS34, PIKfyve) или отщепляющие его (фосфатазы: PTEN, SHIP, SAC1, OCRL, INPP5E, FIG4). Сами локализованы на определённых мембранах, поэтому определяют, где какой липид образуется."},{"id":"S1-T53","term":"Смена метки (конверсия)","section":2,"def":"Смена фосфоинозитида мембраны под действием киназ и фосфатаз при переходе компартмента в другое состояние. Например, при созревании эндосомы PI(4,5)P₂ ямки дефосфорилируется, на ранней эндосоме VPS34 заново синтезирует PI3P, затем PIKfyve превращает его в PI(3,5)P₂. Смена метки сопровождается сменой малых ГТФаз и белков-эффекторов."},{"id":"S1-T54","term":"Периферическое связывание","section":2,"def":"Обратимое связывание белка с поверхностью мембраны без встраивания в бислой: за счёт электростатического взаимодействия с головной группой липида и, у многих доменов, погружения гидрофобных участков в поверхностный слой. При изменении метки белок диссоциирует."},{"id":"S1-T55","term":"PH-домен","section":2,"def":"Домен гомологии плекстрину; у части белков связывает фосфоинозитиды плазматической мембраны или Гольджи: PI(4,5)P₂ (PLCδ1), PI(3,4,5)P₃ и PI(3,4)P₂ (AKT), PI4P (OSBP, FAPP1). Многие PH-домены связывают липиды слабо и неизбирательно и требуют второго признака."},{"id":"S1-T56","term":"FYVE-домен","section":2,"def":"Домен, связывающий PI3P; есть у EEA1 и HRS. Тандем из двух FYVE-доменов (2×FYVE) используют как сенсор PI3P ранних эндосом."},{"id":"S1-T57","term":"PX-домен","section":2,"def":"Домен, у большинства белков связывающий PI3P; есть у сортирующих нексинов ранних эндосом."},{"id":"S1-T58","term":"ENTH- и ANTH-домены","section":2,"def":"Домены белков эндоцитоза (эпсин, AP180), связывающие PI(4,5)P₂ в формирующейся клатриновой ямке."},{"id":"S1-T59","term":"C2-домен","section":2,"def":"Домен, связывающий кислые фосфолипиды, у многих белков при участии Ca²⁺ (синаптотагмин, протеинкиназа C)."},{"id":"S1-T60","term":"Коинцидентное узнавание","section":2,"def":"Узнавание по совпадению двух и более признаков: механизм адресации, при котором белок прочно связывается с мембраной только при одновременном узнавании нескольких независимых признаков, например PI3P и Rab5-GTP у EEA1. В простейшей модели независимых сайтов доля связанного белка равна произведению занятостей: это даёт избирательность и авидность, но не порог, кооперативность или бистабильность. Признаки бывают неравноценны: для посадки EEA1 решающим оказался PI3P (Lawe 2002)."},{"id":"S1-T61","term":"Маркер и причинный детерминант","section":2,"def":"Маркер — признак, по которому исследователь узнаёт мембрану; причинный детерминант — признак, от которого зависят её свойства. Причинность доказывают вмешательством (удаление показывает необходимость, перенос фермента — достаточность), а не совпадением локализаций."},{"id":"S1-T62","term":"Асимметрия монослоёв","section":2,"def":"Различие липидного состава наружного и цитозольного монослоёв: фосфатидилсерин и фосфатидилэтаноламин плазматической мембраны сосредоточены в цитозольном монослое. Создаётся ATP-зависимыми флиппазами (P4-АТФазы), рассеивается скрамблазами (TMEM16F — при подъёме Ca²⁺, Xkr8 — после расщепления каспазами) без затраты ATP."},{"id":"S1-T63","term":"Rab5 и Rab7","section":2,"def":"Малые ГТФазы эндосом: Rab5 — ранних, Rab7 — поздних. В GTP-связанной форме связываются с эффекторами, после гидролиза GTP — нет. Rab5 S34N преимущественно связывает GDP, Rab5 Q79L почти не гидролизует GTP. При созревании эндосомы Rab5 сменяется на Rab7."},{"id":"S1-T64","term":"PI3K класса I и PTEN","section":2,"def":"PI3K класса I после активации рецепторов фосфорилирует PI(4,5)P₂ в положении 3 и создаёт PI(3,4,5)P₃ в плазматической мембране; PTEN отщепляет этот фосфат и возвращает PI(4,5)P₂. Баланс двух ферментов задаёт содержание PI(3,4,5)P₃ и в покое, и после стимула."},{"id":"S1-T65","term":"VPS34 (PI3K класса III)","section":2,"def":"Липидкиназа, синтезирующая PI3P из фосфатидилинозитола на ранних эндосомах (в комплексе, связанном с Rab5) и при аутофагии. Избирательные ингибиторы снижают PI3P и вместе с ним PI(3,5)P₂."},{"id":"S1-T66","term":"PIKfyve","section":2,"def":"Липидкиназа поздних эндосом, превращающая PI3P в PI(3,5)P₂; работает в комплексе с VAC14 и фосфатазой FIG4. Подавляется апилимодом; при её подавлении поздние эндосомы и лизосомы увеличиваются."},{"id":"S1-T67","term":"Рапамицин-индуцируемое сближение FKBP–FRB","section":2,"def":"Метод быстрого вмешательства: FRB закрепляют на выбранной мембране, фермент сливают с FKBP; рапамицин связывает оба домена, и фермент за минуты оказывается на мембране. Так удаляют липид в одной мембране; контроли — без рапамицина и с неактивным ферментом."},{"id":"S1-T68","term":"Сенсор на основе липид-связывающего домена","section":2,"def":"Липид-связывающий домен, слитый с флуоресцентным белком. Показывает свободный и доступный ему липид в местах, где выполнены его условия связывания; насыщается, конкурирует с собственными белками клетки, а при сильной экспрессии может подавлять процессы, зависящие от липида."},{"id":"S1-T69","term":"TRPML1","section":2,"def":"Канал мембраны поздних эндосом и лизосом, через который Ca²⁺ выходит из просвета; прямо активируется PI(3,5)P₂ (Dong 2010)."},{"id":"S1-T70","term":"Мембранный контактный сайт","section":3,"def":"Участок устойчивого сближения мембран двух органелл, которое удерживают тетеринг-белки; расстояние зависит от типа контакта (у контакта ЭПР — митохондрия порядка 10–30 нм); мембраны не сливаются, содержимое компартментов не смешивается. Через контакт идёт невезикулярный перенос липидов, Ca²⁺ и метаболитов. Scorrano и соавторы (2019) рекомендуют описывать контакт по удержанию мембран, отсутствию слияния, функции и набору белков и липидов; одно расстояние контакт не определяет."},{"id":"S1-T71","term":"Тетеринг-белки","section":3,"def":"Белки или белковые комплексы (от англ. tether — привязь), одновременно связанные с мембранами двух органелл и удерживающие их на определённом расстоянии; не вызывают слияния. Отличаются от моторных адаптеров и белков слияния. Примеры: VAP с белками, несущими мотив FFAT; PDZD8; E-Syt; у дрожжей — комплекс ERMES."},{"id":"S1-T72","term":"Три проверки контакта (в этом семинаре)","section":3,"def":"Геометрия (расстояние между мембранами; его типичная величина зависит от типа контакта), тетеринг-белки, удерживающие это расстояние (их удаление увеличивает зазор или уменьшает площадь), и раздельность содержимого. Каждую проверку выполняют отдельным методом; площадь сближения не говорит о переносе — его измеряют отдельно."},{"id":"S1-T73","term":"Невезикулярный перенос липидов","section":3,"def":"Перенос липида между мембранами без пузырьков: липид-транспортный белок извлекает молекулу в гидрофобный карман и отдаёт её другой мембране. Обычно идёт в контактных сайтах, где белок может быть связан с обеими мембранами."},{"id":"S1-T74","term":"OSBP (оксистерол-связывающий белок)","section":3,"def":"Белок контакта ЭПР — транс-Гольджи: PH-доменом связывается с PI4P Гольджи, мотивом FFAT — с VAP на ЭПР, доменом ORD переносит липиды. За цикл переносит молекулу холестерина из ЭПР в Гольджи и молекулу PI4P обратно; ATP не гидролизует."},{"id":"S1-T75","term":"Контрградиент PI4P","section":3,"def":"Постоянный перепад содержания PI4P между аппаратом Гольджи (высокое) и ЭПР (низкое). Его создаёт PI-4-киназа Гольджи, расходующая ATP, и поддерживает фосфатаза SAC1 в ЭПР. Перепад движет обмен, при котором OSBP переносит холестерин против его градиента."},{"id":"S1-T76","term":"VAP-A и VAP-B","section":3,"def":"Белки мембраны ЭПР, связывающие короткий мотив FFAT белков-партнёров (OSBP, ряд белков ORP, CERT). Пара VAP–FFAT удерживает контакт и привязывает к нему перенос липидов."},{"id":"S1-T77","term":"ORP5 и ORP8","section":3,"def":"Белки ЭПР, родственные OSBP. В контактах ЭПР с плазматической мембраной обменивают фосфатидилсерин на PI4P: доставляют фосфатидилсерин в плазматическую мембрану, а PI4P — к фосфатазе SAC1 в ЭПР (Chung 2015)."},{"id":"S1-T78","term":"CERT","section":3,"def":"Белок, переносящий церамид из ЭПР в аппарат Гольджи, где из него синтезируется сфингомиелин. Связывается с PI4P Гольджи PH-доменом и с VAP на ЭПР мотивом FFAT; обмена на PI4P не выполняет."},{"id":"S1-T79","term":"PI4KIIIβ","section":3,"def":"Фосфатидилинозитол-4-киназа аппарата Гольджи: переносит фосфат с ATP на положение 4 инозитольного кольца (PI → PI4P). В цикле OSBP — единственная стадия, где расходуется ATP. PI4P синтезируют и другие PI-4-киназы."},{"id":"S1-T80","term":"OSW-1","section":3,"def":"Природное соединение, которое связывается с OSBP и родственным белком ORP4 и тормозит перенос липидов. В клетках повышает содержание PI4P в транс-Гольджи и смещает холестерин в ЭПР и липидные капли (Mesmin 2017). Цитотоксичен; исследовательский инструмент."},{"id":"S1-T81","term":"MICU1 и MICU2","section":3,"def":"Регуляторы митохондриального кальциевого унипортера в межмембранном пространстве. MICU1 связывает Ca²⁺ EF-мотивами, удерживает MCU закрытым при низком Ca²⁺ и обеспечивает кооперативное открытие при высоком; отсюда кажущийся порог захвата около 1 мкМ. MICU2 работает в комплексе с MICU1."},{"id":"S1-T82","term":"VDAC","section":3,"def":"Потенциал-зависимый анионный канал (порин) наружной мембраны митохондрии. Делает наружную мембрану проницаемой для ионов и небольших метаболитов; на контакте с ЭПР связан с рецептором IP₃ через шаперон GRP75."},{"id":"S1-T83","term":"Ca²⁺-микродомен контакта ЭПР — митохондрия","section":3,"def":"Область зазора, где при открытии рецепторов IP₃ свободный Ca²⁺ достигает порядка 10 мкМ, тогда как в остальном цитозоле он поднимается примерно до 1 мкМ. Позволяет MCU с MICU1 открываться именно у контакта; при подъёме Ca²⁺ во всём цитозоле выше порога захват идёт и вне контактов."},{"id":"S1-T84","term":"PDZD8","section":3,"def":"Белок ЭПР, участвующий в образовании контактов ЭПР с митохондриями в клетках млекопитающих (Hirabayashi 2017); его SMP-домен функционально соответствует домену белка Mmm1 дрожжевого комплекса ERMES. В нейронах мыши без PDZD8 митохондрии хуже захватывали Ca²⁺, вышедший из ЭПР."},{"id":"S1-T85","term":"E-Syt (расширенные синаптотагмины)","section":3,"def":"Белки ЭПР (E-Syt1–3), связывающие ЭПР с плазматической мембраной и переносящие глицеролипиды. Работа E-Syt1 зависит от Ca²⁺: при его подъёме зазор контакта сокращается. У дрожжей родственные белки — трикальбины."},{"id":"S1-T86","term":"STIM1 и Orai1","section":3,"def":"STIM1 — сенсор Ca²⁺ в мембране ЭПР; после опустошения депо он перемещается в контакты ЭПР с плазматической мембраной и связывается с каналом Orai1, открывая депо-зависимый вход Ca²⁺ в клетку."},{"id":"S1-T87","term":"Электронная (крио)томография","section":3,"def":"Метод трёхмерной электронной микроскопии: серия снимков под разными углами восстанавливается в объёмное изображение. Позволяет измерить зазор между мембранами и увидеть связи; криоэлектронная томография исследует замороженные образцы без химической фиксации. Показывает геометрию в один момент, но не перенос."},{"id":"S1-T88","term":"Митофузин 2 (MFN2)","section":3,"def":"ГТФаза наружной мембраны митохондрии, участвующая в их слиянии; часть белка локализуется на ЭПР. Ранние данные о его роли в удержании контакта ЭПР — митохондрия противоречивы; в 2023 году описаны ЭПР-специфические варианты сплайсинга: ERMIT2 удерживает ЭПР у митохондрии, связываясь с митофузинами, ERMIN2 участвует в организации ЭПР (Naón 2023). Мутации в гене MFN2 вызывают наследственную нейропатию Шарко — Мари — Тута типа 2A."},{"id":"S1-T89","term":"Репортёр из двух половин (split-GFP, SPLICS)","section":3,"def":"Две половины флуоресцентного белка, закреплённые на мембранах разных органелл; при сближении собираются в целый флуоресцирующий белок. Сборка малообратима: репортёр накапливает сигнал от всех контактов за время экспрессии и при избыточной экспрессии может их стабилизировать. В отличие от него FRET и BRET регистрируют сближение донора и акцептора примерно до 10 нм без сборки белка."},{"id":"S1-T90","term":"Необходимость белка","section":4,"def":"Свойство, которое показывает опыт с удалением или подавлением белка: без белка процесс нарушается. Необходимость не означает, что белок сам выполняет процесс или что его достаточно: удаление может нарушить процесс косвенно, через другие звенья."},{"id":"S1-T91","term":"Достаточность","section":4,"def":"Свойство, которое показывает опыт с добавлением: фермент, перенесённый в новое место, или мембраны, соединённые искусственной привязкой, вызывают процесс там, где его раньше не было. Пример — перенос фосфатазы на плазматическую мембрану рапамицином в опыте Hammond 2012."},{"id":"S1-T92","term":"Кальциневрин","section":4,"def":"Фосфатаза, которую активирует Ca²⁺ в комплексе с кальмодулином. Дефосфорилирует факторы транскрипции NFAT и TFEB, после чего они перемещаются в ядро. В опытах Medina 2015 кальциневрин дефосфорилировал TFEB по остаткам Ser142 и Ser211 (нумерация TFEB человека)."},{"id":"S1-T93","term":"Быстрый и медленный буферы Ca²⁺ (BAPTA и EGTA)","section":4,"def":"Хелаторы Ca²⁺ со сходным сродством, но с разной скоростью связывания: BAPTA связывает ион намного быстрее, чем EGTA. Поэтому BAPTA успевает связать Ca²⁺ на более коротком пути от источника к мишени, чем EGTA. Если при сопоставимых эффективных концентрациях и проверенной загрузке ответ подавляет BAPTA, но не EGTA, это согласуется с тесным пространственно-временным сопряжением источника Ca²⁺ и мишени. Определённое расстояние из такого сравнения без кинетической модели не следует: оно зависит от концентрации буферов, силы и длительности источника и свойств мишени (Eggermann 2012). В клетки их вводят в виде проникающих эфиров (BAPTA-AM, EGTA-AM)."}],"sources":{"Aits2013":{"url":"https://doi.org/10.1242/jcs.091181","cite":"Aits S., Jäättelä M. 2013. Lysosomal cell death at a glance. J Cell Sci","doi":"10.1242/jcs.091181","pmid":"23720375"},"Allbritton1992":{"url":"https://doi.org/10.1126/science.1465619","cite":"Allbritton N. L., Meyer T., Stryer L. 1992. Range of messenger action of calcium ion and inositol 1,4,5-trisphosphate. Science","doi":"10.1126/science.1465619","pmid":"1465619"},"Attree1992":{"url":"https://doi.org/10.1038/358239a0","cite":"Attree O. et al. 1992. The Lowe's oculocerebrorenal syndrome gene encodes a protein highly homologous to inositol polyphosphate-5-phosphatase. Nature","doi":"10.1038/358239a0","pmid":"1321346"},"Balla2013":{"url":"https://doi.org/10.1152/physrev.00028.2012","cite":"Balla T. 2013. Phosphoinositides: tiny lipids with giant impact on cell regulation. Physiol Rev","doi":"10.1152/physrev.00028.2012","pmid":"23899561"},"Berridge2003":{"url":"https://doi.org/10.1038/nrm1155","cite":"Berridge M. J., Bootman M. D., Roderick H. L. 2003. Calcium signalling: dynamics, homeostasis and remodelling. Nat Rev Mol Cell Biol","doi":"10.1038/nrm1155","pmid":"12838335"},"Bielas2009":{"url":"https://doi.org/10.1038/ng.423","cite":"Bielas S. L. et al. 2009. Mutations in INPP5E, encoding inositol polyphosphate-5-phosphatase E, link phosphatidyl inositol signaling to the ciliopathies. Nat Genet","doi":"10.1038/ng.423","pmid":"19668216"},"Birk2013":{"url":"https://doi.org/10.1242/jcs.117218","cite":"Birk J. et al. 2013. Endoplasmic reticulum: reduced and oxidized glutathione revisited. J Cell Sci","doi":"10.1242/jcs.117218","pmid":"23424194"},"Bischoff1995":{"url":"https://doi.org/10.1002/j.1460-2075.1995.tb07049.x","cite":"Bischoff F. R. et al. 1995. Co-activation of RanGTPase and inhibition of GTP dissociation by Ran-GTP binding protein RanBP1. EMBO J","doi":"10.1002/j.1460-2075.1995.tb07049.x","pmid":"7882974"},"Bock2020":{"url":"https://doi.org/10.1016/j.cell.2020.07.035","cite":"Bock A. et al. 2020. Optical mapping of cAMP signaling at the nanometer scale. Cell","doi":"10.1016/j.cell.2020.07.035","pmid":"32846156"},"Bock2024":{"url":"https://doi.org/10.1016/j.tibs.2024.01.004","cite":"Bock A., Irannejad R., Scott J. D. 2024. cAMP signaling: a remarkably regional affair. Trends Biochem Sci","doi":"10.1016/j.tibs.2024.01.004","pmid":"38310024"},"Brand2011":{"url":"https://doi.org/10.1042/BJ20110162", /* общие функции моделей практикума (core.js, s0_common.js) */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
function rk4(f, s0, t0, t1, dt, every, out){
  let s = Object.assign({}, s0), t = t0; const res = out || []; let k = 0;
  const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
  res.push(Object.assign({ t }, s));
  while (t < t1 - 1e-9){
    const h = Math.min(dt, t1 - t);
    const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
    const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
    s = n; t += h; k++;
    if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
  }
  return res;
}
/* значение траектории в момент tt (линейная интерполяция) */
function atT(tr, tt){
  if (tt <= tr[0].t) return tr[0];
  for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
    const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
    for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
    return r;
  }
  return tr[tr.length - 1];
}

/* модель вопроса 1 (из src/s1.js) */

/* Модель вопроса 1 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   1b. Релаксация неравновесного различия после остановки насоса; мембрана при этом цела.
       x(t) = xOff + (x0 − xOff)·exp(−t/τ): x0 — стационар при работающем насосе, xOff — уровень, к которому идёт
       параметр без насоса, τ — характерное время.
       Лизосома: pH 4,7 (макрофаги RAW264.7, Steinberg 2010); без V-АТФазы — к pH 6,5 с τ = 10 мин: начальная скорость
         подщелачивания 0,18 ед. pH/мин (у Steinberg 2010 — 0,20 ед. pH/мин, альвеолярные макрофаги мыши, 1 мкМ
         конканамицина A); за 50 мин — около 6,5 (Yoshimori 1991: клетки A431, 1 мкМ бафиломицина A1, 5,1–5,5 → ≈6,3
         постепенно за ≈50 мин; Steinberg 2010: за 1 ч ≥ 6,5 — верхний предел чувствительности сенсора). Цитозоль — pH 7,2.
         Плато 6,5 — допущение модели, а не измеренный стационар: выше 6,5 сенсор Steinberg 2010 значений не различает,
         в клетках A431 к 50 мин ≈6,3; полного выравнивания с цитозолем в этих опытах не измеряли, и модель его не показывает
         (так сказано в s1b_r_note и в условиях шага nonequilibrium).
       Просвет ЭПР: свободный Ca²⁺ 370 мкМ; после тапсигаргина — двухфазно (Pick 2023: HEK293, D1ER, 1 мкМ тапсигаргина,
         среда без Ca²⁺; базальный уровень 370 мкМ): за первые ≈90 с теряется лишь ≈6 % (370 → 348 мкМ; в модели — линейно),
         затем экспонента к уровню цитозоля (0,1 мкМ) с τ = 162 с (у авторов τ описывает позднюю фазу после точки перегиба).
       Матрикс митохондрии: Δψ −150 мВ (учебное значение; у нейронов коры крысы измерено −139 мВ, Gerencser 2012); антимицин A + олигомицин останавливают и дыхательную цепь, и обратную работу
         ATP-синтазы; Δψ падает до −5 мВ с τ = 20 с. τ — учебное значение порядка «секунд — десятков секунд» (прямых измерений кинетики Δψ в прочитанных работах нет, см. notes/doi_needed.md).
       Следствия: активность кислых гидролаз — учебная зависимость 1/(1 + 10^(pH − 5,6)) (доля от максимальной);
       движущая сила выхода Ca²⁺ из ЭПР Δμ = RT·ln(0,1 мкМ / [Ca²⁺]ЭПР) (электрическая часть на мембране ЭПР не
       учитывается — допущение); импорт белков с MTS через TIM23 — учебная крутая зависимость от Δψ (Martin 1991:
       импорт требует именно Δψ), в % от контроля.
   1a. Митохондрия в клетке, глюкоза в среде (гликолиз даёт ATP). Пять условий — стационары учебной модели протонного
       цикла (Brand и Nicholls 2011): Δψ, направление работы ATP-синтазы, потребление O₂ (% от контроля),
       импорт через TIM23 (% от контроля), Δμ для входа Ca²⁺ из цитозоля (0,1 мкМ) в матрикс (1 мкМ).
       Числа условны; качественные соотношения — по Brand и Nicholls 2011: олигомицин слегка повышает Δψ и снижает
       дыхание до уровня утечки; FCCP снижает Δψ и повышает дыхание; ингибиторы дыхательной цепи снижают потребление O₂
       до немитохондриального (около 10 %); при остановке дыхания Δψ может поддерживаться гидролизом гликолитического
       ATP ATP-синтазой, и тогда олигомицин снижает Δψ (проба с олигомицином; oligomycin null-point test).
       При FCCP ATP-синтаза не синтезирует ATP, а гидролизует гликолитический ATP (Brand и Nicholls 2011: при протонофоре
       синтез ATP митохондриями прекращается); выведенные ею протоны протонофор сразу возвращает, поэтому Δψ остаётся низким. */
const M1 = (() => {
  const RT = 2.577;            // кДж/моль при 37 °C
  const F = 96.485;            // кДж/(моль·В)
  const C = {
    lys:  { x0: 4.7, xOff: 6.5, xEq: 7.2, tau: 600 },     // pH
    er:   { x0: 370, xOff: 0.1, xEq: 0.1, tau: 162, lag: 90, lagLoss: 0.06 },   // мкМ свободного Ca²⁺; задержка 90 с, потеря 6 %
    mito: { x0: -150, xOff: -5, xEq: 0, tau: 20 },        // мВ
  };
  const TIMES = [0, 5, 15, 30, 60, 120, 300, 600, 1200, 1800, 3600];   // с после остановки насоса
  const val = (c, on, t) => {
    const p = C[c]; if (on) return p.x0;
    if (!p.lag) return p.xOff + (p.x0 - p.xOff) * Math.exp(-t / p.tau);
    /* двухфазное опустошение ЭПР (Pick 2023): медленная начальная фаза, затем экспонента с τ */
    const x1 = p.x0 - (p.x0 - p.xOff) * p.lagLoss;
    return t < p.lag ? p.x0 - (p.x0 - x1) * t / p.lag : p.xOff + (x1 - p.xOff) * Math.exp(-(t - p.lag) / p.tau);
  };
  /* доля исходного различия с цитозолем, которая ещё сохранилась (знаменатель — различие при работающем насосе) */
  const remain = (c, x) => { const p = C[c]; return (x - p.xEq) / (p.x0 - p.xEq); };
  /* время, за которое различие (в собственных единицах: ед. pH, мкМ, мВ) уменьшается вдвое, с — для сравнения характерных времён */
  const half = c => { let a = 0, b = 7200; for (let i = 0; i < 60; i++){ const m = (a + b) / 2; if (remain(c, val(c, false, m)) > 0.5) a = m; else b = m; } return (a + b) / 2; };
  /* подпись времени полуспада: «15 с», «3,2 мин», «12 мин» */
  const halfTxt = (c, uS = 'с', uMin = 'мин') => { const h = half(c); return h < 60 ? Math.round(h) + '\u00a0' + uS : (h < 600 ? (h / 60).toFixed(1).replace('.', ',') : String(Math.round(h / 60))) + '\u00a0' + uMin; };
  /* импорт, % от контроля, для показа: < 0,5 % — «< 1»; в пределах 5 % от контроля (кроме самого контроля) — «≈ 100»
     (учебная кривая не различает такие значения; данных о росте импорта при гиперполяризации нет) */
  const impTxt = v => v < 0.005 ? '<\u00a01' : (v !== 1 && Math.abs(v - 1) < 0.05) ? '≈\u00a0100' : String(Math.round(v * 100));
  const hydrolase = pH => 1 / (1 + Math.pow(10, pH - 5.6));
  const dmuExitER = ca => RT * Math.log(0.1 / ca);                 // выход Ca²⁺ из ЭПР в цитозоль (0,1 мкМ)
  const imp0 = psi => { const a = Math.abs(psi), K = 110, n = 8; return Math.pow(a, n) / (Math.pow(K, n) + Math.pow(a, n)); };
  const importRel = psi => imp0(psi) / imp0(C.mito.x0);         // относительно контроля (−150 мВ)
  /* Δμ для переноса Ca²⁺ (z = 2) из цитозоля (c1) в матрикс (c2); Δψ = ψматрикса − ψцитозоля, мВ */
  const dmuCa = (psi, c1 = 0.1, c2 = 1) => { const ch = RT * Math.log(c2 / c1), el = 2 * F * psi / 1000; return { ch, el, tot: ch + el }; };
  /* 1a: стационары пяти условий (глюкоза в среде) */
  const COND = {
    ctrl:   { psi: -150, o2: 1.00, atp: 'syn' },
    oligo:  { psi: -160, o2: 0.30, atp: 'off' },
    anti:   { psi: -125, o2: 0.10, atp: 'hyd' },
    antiol: { psi: -5,   o2: 0.10, atp: 'off' },
    fccp:   { psi: -10,  o2: 2.20, atp: 'hyd' },
  };
  const cond = k => { const c = COND[k]; return Object.assign({ key: k, imp: importRel(c.psi), ca: dmuCa(c.psi) }, c); };
  return { RT, F, C, TIMES, val, remain, half, halfTxt, impTxt, hydrolase, dmuExitER, importRel, dmuCa, COND, cond };
})();

/* Модель вопроса 2 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают. Все величины — учебные, кроме названных коэффициентов диффузии
   (отметки ползунка D: Allbritton 1992, Swaminathan 1997, Lippincott-Schwartz 2001; см. notes/claims.md).

   2б. Одномерная стационарная модель «источник — диффузия — сток»:
     вещество образуется у плоскости x = 0, концентрация там поддерживается постоянной (c₀ = 1, т. е. 100 % от c₀),
     диффундирует с коэффициентом D в сторону x > 0 и удаляется стоком первого порядка с константой k.
     Стационарный профиль: c(x) = фон + (c₀ − фон)·e^(−x/λ), λ = √(D/k); фон = 5 % от c₀.
     Это решение уравнения D·c″ − k·(c − фон) = 0: ненулевой фон поддерживает равномерный базальный источник k·фон
     (аудит v1.0, S1-16). Граничные условия: c(0) = c₀, вдали от источника c → фон (полубесконечная среда);
     показан участок длиной 20 мкм — это не точное решение для замкнутой клетки с непроницаемым дальним концом
     (такое решение используется в модели 2а).
     Средняя по клетке длиной L = 20 мкм (как в лизате): фон + (c₀ − фон)·(λ/L)·(1 − e^(−L/λ)).
     Эффектор: ответ R = cⁿ/(K½ⁿ + cⁿ) — доля активного эффектора (0…1), n — коэффициент Хилла.
     Ширина домена — расстояние, на котором R > 0,5, то есть c > K½: x½ = λ·ln((c₀ − фон)/(K½ − фон)).
     Переходная зона — участок, где R падает от 0,9 до 0,1 (c от K½·9^(1/n) до K½·9^(−1/n)).
   2а. Микродомены cAMP в одномерной клетке длиной L = 20 мкм (отрезок 0…L, стенки непроницаемы):
     домен А у x = 0 (рецептор гормона А, AC, AKAP с PKA рядом с мишенью А, мишень А на x = 0,5 мкм),
     домен Б у x = L (рецептор гормона Б, AC). Гормон включает синтез cAMP в своём домене (поток J через стенку);
     базальный синтез cAMP равномерен по клетке (j₀); PDE распределены по цитозолю — сток первого порядка k.
     Стационар (точное решение для отрезка с непроницаемыми концами; профиль — сумма гиперболических косинусов,
     то есть экспонент, от двух источников):
       c(x) = j₀/k + A·(J·λ/D)·ch((L − x)/λ)/sh(L/λ) + Б·(J·λ/D)·ch(x/λ)/sh(L/λ),  λ = √(D/k).
     Средняя по клетке (явно): c̄ = j₀/k + (A + Б)·J/(k·L) — от места синтеза не зависит.
     k = k₀ + kPDE (k₀ — путь, не чувствительный к IBMX: выход cAMP из клетки и PDE, малочувствительные к IBMX);
     IBMX ингибирует 80 % kPDE (учебное). D = 30 мкм²/с — эффективная (буферированная) величина, учебная:
     у свободного cAMP измерено 100–700 мкм²/с (обзор Bock 2024), а связывание с регуляторными субъединицами PKA
     замедляет его перемещение (Bock 2020).
     cAMP выражен в единицах базального уровня (покой = 1, «×k от покоя»).
     PKA у мишени А: доля активной f = c²/(K²+c²), K = 12 (учебное; кооперативное связывание cAMP).
     Количество PKA у мишени: закреплённая AKAP — 1; после Ht31 PKA распределена по цитозолю — 0,1 (учебное).
     Фосфорилирование мишени А (доля 0…1): φ = r·a/(r·a + 1), a = количество·f, r = 3 (отношение скоростей
     PKA и фосфатазы при полной активности закреплённой PKA, учебное). */
const M2 = (() => {
  const B = { L: 20, bg: 0.05 };
  const lam = (D, k) => Math.sqrt(D / k);
  /* 2б: профиль, средняя, ответ эффектора и границы домена */
  function basic(D, k, n, K){
    const l = lam(D, k), L = B.L, bg = B.bg;
    const c = x => bg + (1 - bg) * Math.exp(-x / l);
    const R = x => { const v = c(x); return Math.pow(v, n) / (Math.pow(K, n) + Math.pow(v, n)); };
    const xAt = v => v >= 1 ? 0 : v <= bg ? Infinity : l * Math.log((1 - bg) / (v - bg));   /* где c(x) = v */
    const mean = bg + (1 - bg) * (l / L) * (1 - Math.exp(-L / l));
    const w = xAt(K);                       /* ширина домена: ответ > 50 % */
    const x90 = xAt(K * Math.pow(9, 1 / n)), x10 = xAt(K * Math.pow(9, -1 / n));
    return { D, k, n, K, lam: l, c, R, mean, c1: c(1), c5: c(5), c20: c(L), r10: R(10), r0: R(0), w, whole: w >= L,
             x90, x10, tz: isFinite(x10) ? x10 - x90 : Infinity, L, bg };
  }
  /* 2а: клетка с двумя доменами */
  const P = { L: 20, D: 30, k0: 0.3, kP: 2.7, inh: 0.8, J: 240, j0: 3, K: 12, n: 2, r: 3, xt: 0.5, amtHt: 0.1 };
  function cell(s){
    const k = P.k0 + P.kP * (s.I ? 1 - P.inh : 1), l = lam(P.D, k), bg = P.j0 / k / (P.j0 / (P.k0 + P.kP));
    const base = P.j0 / (P.k0 + P.kP);                 /* базальный уровень без IBMX — единица шкалы */
    const amp = P.J * l / P.D / Math.sinh(P.L / l) / base;
    const c = x => bg + (s.A ? amp * Math.cosh((P.L - x) / l) : 0) + (s.B ? amp * Math.cosh(x / l) : 0);
    const mean = bg + ((s.A ? 1 : 0) + (s.B ? 1 : 0)) * P.J / (k * P.L) / base;
    const ct = c(P.xt), f = ct * ct / (P.K * P.K + ct * ct), amt = s.H ? P.amtHt : 1, a = amt * f, ph = P.r * a / (P.r * a + 1);
    return { k, lam: l, bg, c, mean, ct, f, amt, ph, L: P.L, xt: P.xt, K: P.K };
  }
  /* числа для подписей D-шкалы (мкм²/с; данные названных работ, см. справку) */
  const DMARKS = [[0.05, 1, 'mem'], [10, 30, 'prot'], [13, 65, 'ca'], [270, 300, 'ip3']];
  return { B, P, lam, basic, cell, DMARKS };
})();

         для белков: pm — на мембране, cyt — переходит в цитозоль; sac — химера PJ-Sac, dead — PJ-Dead) --- */
  const HAM = {
    none: { pip2: 'n', pi4p: 'n', plcd: 'pm', osh: 'pm', marcks: 'pm', golgi: 'n' },
    dead: { pip2: 'n', pi4p: 'n', plcd: 'pm', osh: 'pm', marcks: 'pm', golgi: 'nd' },
    e5:   { pip2: 'dn', pi4p: 'up', plcd: 'cyt', osh: 'pm', marcks: 'pm', golgi: 'nd' },
    sac:  { pip2: 'n', pi4p: 'dn', plcd: 'pm', osh: 'pm', marcks: 'pm', golgi: 'nd' },
    pj:   { pip2: 'dn', pi4p: 'dn', plcd: 'cyt', osh: 'cyt', marcks: 'cyt', golgi: 'n' } };
  const ham = (enz, rapa) => HAM[rapa ? enz : 'none'];
  return { P, ARF, RAB, raw, state, occ, occ1, SENS, LIPID, MEMS, REF, pi3pEE, fA, eea1, HAM, ham };
})();


/* модель вопроса 4 (из src/s4.js) */

/* Модель вопроса 4 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   4b. Ca²⁺ на контакте ЭПР — митохондрия (учебная квазистационарная модель на время стимула).
       Свободный Ca²⁺ в остальном цитозоле: покой 0,1 мкМ; открытие IP₃R — 0,8 мкМ («около 1 мкМ»);
       глобальный подъём за счёт входа Ca²⁺ извне — умеренный 0,4 мкМ (Csordás 2013: 300–400 нМ при депо-зависимом входе)
       или сильный 3 мкМ. У поверхности митохондрии в зоне контакта при открытии IP₃R — 15 мкМ (Csordás 2010: в среднем
       около 9 мкМ, в части клеток до 25 мкМ; Giacomello 2010: в 5–10 раз выше, чем в остальном цитозоле); при сниженном
       числе тетеринг-белков зазор шире и у поверхности митохондрии лишь 2 мкМ (учебное значение). При глобальном подъёме
       микродомена нет: Ca²⁺ в зазоре равен цитозольному (Giacomello 2010). Доля поверхности митохондрии в контакте:
       12 % (в пределах 5–20 %, Rizzuto 1998) или 4 % при сниженном числе тетеринг-белков.
       Скорость захвата через MCU (доля от максимальной скорости митохондрии с MICU1 при насыщающем Ca²⁺) — уравнение Хилла:
       с MICU1 K = 3,5 мкМ, n = 3 (крутое открытие выше ≈ 1 мкМ; наклон 2,9–3,4 у Csordás 2013); без MICU1 K = 3,28 мкМ,
       n = 2,1, максимум 0,6 (захват заметен уже ниже 0,5 мкМ, кооперативность ниже: 1,6–2,1 у Csordás 2013;
       кривые пересекаются около 2 мкМ). Захват = f·J(Ca в зазоре) + (1 − f)·J(Ca в цитозоле).
       Свободный Ca²⁺ в матриксе (квазистационар захвата и выхода): 0,1 мкМ + 20 мкМ × скорость захвата (учебное допущение;
       выведение, буферирование и Δψ не моделируются; текст s4b_r_note показывает формулу студенту — аудит v1.0, S1-17).
       Доля активной формы Ca²⁺-зависимых дегидрогеназ: Ca/(Ca + 1 мкМ) (учебное значение K).
   4a. Цикл OSBP на контакте ЭПР — транс-Гольджи (стационар, условные единицы; контроль: синтез PI4P = 1, PI4P Гольджи = 1).
       Синтез PI4P PI-4-киназами s (1 ATP на молекулу; ингибитор PI4KIIIβ оставляет 20 % — синтез другими PI-4-киназами).
       Обмен OSBP: J = V·o·t·(PI4P_Г·Хол_ЭПР − PI4P_ЭПР·Хол_Г) — молекула холестерина ЭПР → Гольджи в обмен на молекулу PI4P
       Гольджи → ЭПР; o — активность OSBP (OSW-1: 0,03), t — мостики VAP–OSBP (VAP-A/B подавлены: 0,08) × площадь контакта.
       Другие пути расхода PI4P в Гольджи: 0,2·PI4P_Г (в контроле OSBP обменивает 80 % синтезированного PI4P Гольджи — учебное
       значение; Mesmin 2017 оценили долю для всего клеточного пула PI4P, а не для пула Гольджи: около половины).
       PI4P в ЭПР гидролизует SAC1: h·PI4P_ЭПР (SAC1 подавлена — 3 % активности). Холестерин ЭПР — резервуар (= 1);
       холестерин Гольджи = 1 + (J + J0)/kb (J0 — доставка другими путями). Контроль: перенос 0,8; отношение Гольджи/ЭПР = 4. */
const M4 = (() => {
  const B = { cRest: 0.1, cIp3: 0.8, cMod: 0.4, cHigh: 3, gapOn: 15, gapLow: 2, fOn: 0.12, fLow: 0.04,
              Kc: 3.5, nc: 3, Kk: 3.28, nk: 2.1, Jk: 0.6, m0: 0.1, G: 20, Kdh: 1 };
  const hill = (c, K, n) => Math.pow(c, n) / (Math.pow(K, n) + Math.pow(c, n));
  /* скорость захвата через MCU при свободном Ca²⁺ c (мкМ) у внешней стороны внутренней мембраны */
  const Jmcu = (c, micu) => micu ? hill(c, B.Kc, B.nc) : B.Jk * hill(c, B.Kk, B.nk);
  const BULK = { rest: B.cRest, ip3: B.cIp3, mod: B.cMod, high: B.cHigh };
  const mRef = B.m0 + B.G * Jmcu(B.cRest, true);
  /* o = { contact: 'on' | 'low', stim: 'rest' | 'ip3' | 'mod' | 'high', micu: true | false } */
  function ca(o){
    const bulk = BULK[o.stim], f = o.contact === 'on' ? B.fOn : B.fLow;
    const gap = o.stim === 'ip3' ? (o.contact === 'on' ? B.gapOn : B.gapLow) : bulk;
    const jc = f * Jmcu(gap, o.micu), jb = (1 - f) * Jmcu(bulk, o.micu), U = jc + jb;
    const m = B.m0 + B.G * U;
    return { bulk, gap, f, U, jc, jb, share: jc / U, m, mRel: m / mRef, dh: m / (m + B.Kdh) };
  }
  /* --- 4a --- */
  const O = { s: 1, ko: 0.2, h: 16, V: 1, kb: 0.8 / 1.4, J0: 1.6 * 0.8 / 1.4, Ce: 1, kinRes: 0.2, oswRes: 0.03, vapRes: 0.08, sacRes: 0.03 };
  /* Вмешательства неполные (аудит v1.0, S1-11): «SAC1 подавлена» — остаточный гидролиз PI4P в ЭПР 3 % (sacRes),
     «VAP-A и VAP-B подавлены» — остаточная эффективность переноса 8 % (vapRes); так их и называют тексты (нокдаун, а не отсутствие белка). */
  /* c = { pi4k: true, osbp: true, sac1: true, vap: true, area: 1, syn: 1 }; syn — множитель синтеза PI4P (только для схемы объяснений «площадь и перенос») */
  function osbp(c){
    const s = O.s * (c.pi4k ? 1 : O.kinRes) * (c.syn || 1), o = c.osbp ? 1 : O.oswRes, tt = (c.vap ? 1 : O.vapRes) * (c.area || 1), h = O.h * (c.sac1 ? 1 : O.sacRes);
    const st = J => { const Pg = (s - J) / O.ko, Pe = J / h, Cg = O.Ce + (J + O.J0) / O.kb; return { Pg, Pe, Cg, f: O.V * o * tt * (Pg * O.Ce - Pe * Cg) - J }; };
    let lo = 0, hi = s;
    for (let i = 0; i < 80; i++){ const m = (lo + hi) / 2; if (st(m).f > 0) lo = m; else hi = m; }
    const J = (lo + hi) / 2, r = st(J);
    return { J, Pg: r.Pg, Pe: r.Pe, Cg: r.Cg, ratio: r.Cg / O.Ce, syn: s, use: J / s };
  }
  const CTRL = osbp({ pi4k: true, osbp: true, sac1: true, vap: true, area: 1 });
  return { B, O, Jmcu, ca, osbp, CTRL, mRef };
})();


/* =====================================================================
   Схемы страницы объяснений семинара 1 (общая часть). Каждая схема — функция W.<kind>; kind задаётся в lesson.widget.kind.
   Все подписи берутся из lesson.widget.s (в коде — S); в коде нет учебных формулировок.
   Модели M1…M4 — те же функции, что в практикуме (копируются при сборке из src/s1…s4.js),
   поэтому числа в объяснениях и в практикуме совпадают.
   ===================================================================== */
const C4 = { blue: '#145c96', orange: '#c3662f', teal: '#007b72', red: '#ae3347', gray: '#9db4c8', ink: '#152c45', amber: '#c98a0b', amberFill: '#fbe9c2', purple: '#6748b6', muted: '#6b7c8f' };
const n1 = (x, d = 1) => Number(x).toFixed(d).replace('.', ',');
const p0 = x => Math.round(100 * x) + nb + '%';

/* стрелка или линия с поперечиной по квадратичной кривой: [x1,y1,x2,y2] или [x1,y1,cx,cy,x2,y2] */
function edge4(pts, type, faded){
  const c = { act: C4.blue, inh: C4.red, move: C4.muted, syn: C4.purple, bind: C4.teal }[type] || C4.blue;
  const dash = type === 'move' ? '6 5' : type === 'syn' ? '2 5' : type === 'dbt' ? '7 5' : '';
  const op = faded ? 0.22 : 1;
  let d, x2, y2, ax, ay;
  if (pts.length === 4){ [, , x2, y2] = pts; d = `M${pts[0]} ${pts[1]} L${x2} ${y2}`; ax = pts[0]; ay = pts[1]; }
  else { const [x1, y1, cx, cy] = pts; [, , , , x2, y2] = pts; d = `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`; ax = cx; ay = cy; }
  const a = Math.atan2(y2 - ay, x2 - ax);
  let head;
  if (type === 'inh') { const px = -Math.sin(a) * 9, py = Math.cos(a) * 9; head = `<line x1="${x2 - px}" y1="${y2 - py}" x2="${x2 + px}" y2="${y2 + py}" stroke="${c}" stroke-width="4"/>`; }
  else if (type === 'bind') head = `<circle cx="${x2}" cy="${y2}" r="4" fill="${c}"/>`;
  else { const L = 11, d1 = a + 2.6, d2 = a - 2.6; head = `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`; }
  return `<g opacity="${op}"><path d="${d}" fill="none" stroke="${c}" stroke-width="3"${dash ? ` stroke-dasharray="${dash}"` : ''}/>${head}</g>`;
}
const pBadge = (x, y) => circ(x, y, 10, '#f0b84a', 'stroke="#c98a0b" stroke-width="1.5"') + tx(x, y + 4, 'P', 11, 'middle');
/* узел сети: состояние on (активен, жёлтый), cur (текущая форма неактивного белка: синяя рамка, без заливки), off, miss (нет: пунктир и крест), inh (подавлен фосфорилированием: пунктир) */
function node4(n, st){
  const on = st.on.includes(n.id), miss = st.miss.includes(n.id), inh = (st.inh || []).includes(n.id), cur = (st.cur || []).includes(n.id);
  const fill = on ? C4.amberFill : '#fff', stroke = on ? C4.amber : cur ? C4.blue : miss ? '#9aa7b3' : '#6d8ba5';
  let d = box(n.x, n.y, n.w, n.h || 40, n.label, { fill, stroke, dash: miss || inh ? '6 5' : '', size: n.fs || 15, sw: on || cur ? 3 : 2 });
  if (miss) d += cross(n.x + n.w - 8, n.y + 8);
  if ((st.p || []).includes(n.id)) d += pBadge(n.x + n.w, n.y + 2);
  return d;
}

/* Сеть с переключаемыми состояниями. S.nodes (необязательно only: [номера режимов, где узел рисуется], not: [номера режимов, где не рисуется]), S.edges (id, pts, type), S.states[i] = {on, miss, inh, p, show (рёбра активны), hide (рёбра скрыты), drugs [[x,y,текст]], note, metrics [[подпись, значение]]} */
W.net = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('net-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const st = Object.assign({ on: [], miss: [], inh: [], p: [], show: [], hide: [], drugs: [], areas: [] }, S.states[s.mode]);
    let d = (S.areas || []).map(a => a.kind === 'nuc' ? `<ellipse cx="${a.x}" cy="${a.y}" rx="${a.rx}" ry="${a.ry}" fill="#eef0f7" stroke="#97a0ba" stroke-width="2.5"/>` + tx(a.lx, a.ly, a.label, 14, 'middle')
      : a.kind === 'mem' ? line(0, a.y, S.w || 640, a.y, '#556171', 4) + tx(a.lx, a.ly, a.label, 14, 'start') : tx(a.x, a.y, a.label, 14, a.anchor || 'start')).join('');
    S.edges.forEach(e => { if (st.hide.includes(e.id)) return; d += edge4(e.pts, e.type, !st.show.includes(e.id)); if (e.label) d += tx(e.lx, e.ly, e.label, 13, 'middle'); });
    S.nodes.forEach(n => { if ((n.only && !n.only.includes(s.mode)) || (n.not && n.not.includes(s.mode))) return; d += node4(n, st); });
    st.drugs.forEach(([x, y, t]) => { d += rect(x - 6, y - 15, t.length * 8.6 + 12, 22, C4.red, 11) + tx(x, y + 1, t, 13, 'start').replace('<text ', '<text style="fill:#fff;font-weight:700" '); });
    const m = st.metrics ? `<div class="metrics${st.metrics.length === 2 ? ' two' : ''}">${st.metrics.map(([a, b]) => metric(a, b)).join('')}</div>` : '';
    out(svg(d, S.title, S.h || 300, S.w || 640, st.note), m + result(`<p>${esc(st.note)}</p>`) + (S.legend ? `<p class="quiet">${esc(S.legend)}</p>` : ''));
  };
  onGroup('net-mode', i => { s.mode = i; draw(); });
  draw();
};

/* Таблица с переключаемыми вариантами: S.tables[i] = {head, rows, note} */
W.table = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;

/* Схемы методов: S.schemes[i] = {draw: <имя функции MTH>|'table', l: {подписи}, data, note, h, (head, rows для table)}.
   Функции рисования MTH добавляются в widgets_q*.js через Object.assign(MTH, {...}). */
const MTH = {
  tl(x, y, str, size = 14, anchor = 'middle'){ return String(str).split('\n').map((t, i) => tx(x, y + i * size * 1.25, t, size, anchor)).join(''); },
  panel(x, y, letter, title){ return tx(x, y, letter, 17, 'start').replace('<text ', '<text style="font-weight:700" ') + tx(x + 22, y, title, 15, 'start'); },
};
W.method = ({S, s, set, out, onGroup}) => {
  s.mode ??= 0;
  set(S.title, S.status, buttonGroup('mth-mode', S.modes, s.mode, S.modes_label));
  const draw = () => {
    const sc = S.schemes[s.mode];
    if (sc.draw === 'table') { out(tbl(sc.head, sc.rows), result(`<p>${esc(sc.note)}</p>`)); return; }
    const body = MTH[sc.draw](sc.l, sc.data);
    out(svg(body, S.modes[s.mode], sc.h || 300, 640, sc.note), result(`<p>${esc(sc.note)}</p>`) + (sc.legend ? `<p class="quiet">${esc(sc.legend)}</p>` : ''));
  };
  onGroup('mth-mode', i => { s.mode = i; draw(); });
  draw();
};

/* =====================================================================
   Схемы раздела 1 (компартменты и локальные условия). Новые W.<kind> с префиксом q1 и методы MTH.
   Числа схем q1relax, q1mito и случая «Ca²⁺ в матрикс» схемы q1dmu — из модели практикума M1 (копируется из src/s1.js);
   подписи — только из lesson.widget.s.
   ===================================================================== */
/* на узком экране (≤ 760 px) подписи схем крупнее, чтобы после масштабирования SVG оставаться не мельче ~9 px */
const q1F = v => (small() ? Math.max(19, Math.round(v * 1.45)) : v);
const q1tx = (x, y, str, size = 14, anchor = 'middle', cls = '') => tx(x, y, str, q1F(size), anchor, cls);
const q1b = (x, y, str, size = 14, anchor = 'middle') => q1tx(x, y, str, size, anchor).replace('<text ', '<text style="font-weight:700" ');
/* многострочная подпись с переносом по словам (ширина — в единицах viewBox) */
const q1tl = (x, y, str, size = 13, anchor = 'middle', width = 600) => {
  const per = Math.max(8, Math.floor(width / (q1F(size) * 0.56))), lines = [''];
  String(str).split(' ').forEach(w => { const L = lines[lines.length - 1]; if ((L + ' ' + w).trim().length > per) lines.push(w); else lines[lines.length - 1] = (L + ' ' + w).trim(); });
  return lines.map((t, i) => q1tx(x, y + i * q1F(size) * 1.22, t, size, anchor)).join('');
};
const q1n = (x, d = 1) => Number(x).toFixed(d).replace('.', ',').replace('-', '−');
const q1sgn = (x, d = 1) => (x < 0 ? '−' : '+') + Math.abs(x).toFixed(d).replace('.', ',');
/* перенос через мембрану: пунктир со стрелкой (не путать со стрелкой активации) */
const q1tr = (x1, y1, x2, y2, c = '#6b7c8f', on = true) => `<g opacity="${on ? 1 : 0.2}">` + arrow(x1, y1, x2, y2, c, 2.5, '6 5') + '</g>';

/* compartment: карта компартментов с выбором параметра + таблица значений (читается и на телефоне) */
W.q1map = ({ S, s, set, out, onGroup }) => {

    d += `<path d="M40 110 q20 -14 40 0 t40 0 t40 0 t40 0 l0 70 q-20 14 -40 0 t-40 0 t-40 0 t-40 0 z" fill="#e8f1fa" stroke="#2d7fc1" stroke-width="2.5"/>`;
    d += q1tx(120, 135, N.er, 13) + val(120, 160, 'er');

    d += q1tx(320, 150, N.gol, 13) + val(320, 172, 'gol');
    /* ранняя эндосома */
    d += circ(530, 135, 62, '#eef6ec', 'stroke="#4d8b44" stroke-width="2.5"') + q1tx(530, 128, N.ee, 12) + val(530, 152, 'ee');
    /* митохондрия */
    d += `<ellipse cx="160" cy="262" rx="130" ry="52" fill="#fbeee4" stroke="#c3662f" stroke-width="2.5"/>`;
    d += `<ellipse cx="160" cy="262" rx="118" ry="41" fill="none" stroke="#c3662f" stroke-width="1.5" opacity=".6"/>`;
    d += q1tx(160, 250, N.mito, 13) + val(160, 284, 'mito');

    out(svg(d, S.title, 336, 640, S.notes[s.mode]),
