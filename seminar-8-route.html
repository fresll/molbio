ые» и «вредные» АФК, и универсального времени перехода от регуляции к повреждению нет.</p><p>Окисление тиола цистеина пероксидом водорода даёт сульфеновую форму (Cys-SOH). Она может образовать дисульфид с другим тиолом, и дисульфид восстанавливают тиоредоксин или глутатион. При избытке окислителя сульфеновая форма окисляется до сульфиновой (Cys-SO₂H), а затем до сульфоновой (Cys-SO₃H). Сульфиновая форма каталитического цистеина типичных 2-Cys-Prx не всегда необратима: её восстанавливает до сульфеновой формы <a href="#ns-g-S8-T73">сульфиредоксин</a> (Srx) за счёт ATP (Rhee и соавт., 2007; Lowther, Haynes, 2011). Сульфоновую форму обычно считают необратимой. Srx не является универсальным восстановителем сульфиновых групп любых белков.</p><p>Обратимое сульфинирование 2-Cys-Prx снижает их пероксидазную активность; предполагают, что оно предотвращает преждевременное удаление H₂O₂ в области сигнала, но физиологическое значение этого остаётся предметом обсуждения (Jeong и соавт., 2012). Окисление становится повреждением, когда оно длительно, затрагивает функционально важные мишени и не компенсируется удалением окислителя и восстановлением мишеней. Окисление затрагивает не только белки: возможны перекисное окисление липидов мембран и окисление оснований ДНК, а ионы железа усиливают повреждение, катализируя образование из H₂O₂ гидроксильного радикала (реакция Фентона); вклад этих процессов зависит от условий. Поэтому важны длительность, компартмент и мишень, а не содержание одного окислителя.</p><p>Повреждение ДНК активирует <a href="#ns-g-S8-T77">PARP</a>1. Фермент расщепляет NAD⁺, присоединяет остатки ADP-рибозы к белкам и высвобождает никотинамид (Shah и соавт., 2011); при повреждении ДНК такой расход снижал содержание NAD⁺ и менял метаболизм клеток (Murata и соавт., 2019). Это не окислительно-восстановительная реакция кофермента: NADH не образуется. Ингибирование PARP1 может сохранить NAD⁺, но само не устраняет повреждение ДНК и его причины, в том числе образование окислителей.</p><div class="note trap"><strong>Типичная ошибка</strong> Сульфинирование цистеина всегда необратимо.<p class="trap-fix">Сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов восстанавливает сульфиредоксин за счёт ATP. Необратимой обычно считают сульфоновую форму.</p></div><div class="static-quiz"><h3>При повреждении ДНК активировалась PARP1 и снизилось содержание NAD⁺. Ингибирование PARP1 уменьшило расход NAD⁺. Какой вывод следует из этого непосредственно?</h3><ol><li><b>А.</b> Повреждение ДНК устраняется быстрее, поскольку NAD⁺ не расходуется на работу PARP1. <i>(неверный вариант)</i><br><span class="expl">Снижение расхода NAD⁺ не показывает, что повреждение ДНК устранено.</span></li><li><b>Б.</b> Потеря NAD⁺ из-за PARP1 уменьшается, но повреждение ДНК этим не устраняется. <i>(верный вариант)</i><br><span class="expl">Расход кофермента и само повреждение ДНК — разные звенья.</span></li><li><b>В.</b> Отношение NADH/NAD⁺ во всех компартментах выравнивается, поскольку расход NAD⁺ снизился. <i>(неверный вариант)</i><br><span class="expl">Расход NAD⁺ при активации PARP1 не образует NADH, но может менять отношение NADH/NAD⁺, поскольку изменяет количество NAD⁺. Из снижения этого расхода не следует выравнивание отношений во всех компартментах.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-024-00730-2">Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.</a></li><li><a href="https://doi.org/10.1038/sj.ki.5002380">Rhee S. G. et al. Sulfiredoxin, the cysteine sulfinic acid reductase specific to 2-Cys peroxiredoxin: its discovery, mechanism of action, and biological significance. Kidney Int Suppl. 2007;(106):S3–S8.</a></li><li><a href="https://doi.org/10.1089/ars.2010.3564">Lowther W. T., Haynes A. C. Reduction of cysteine sulfinic acid in eukaryotic, typical 2-Cys peroxiredoxins by sulfiredoxin. Antioxid Redox Signal. 2011;15:99–109.</a></li><li><a href="https://doi.org/10.1016/j.freeradbiomed.2012.05.020">Jeong W. et al. Role of sulfiredoxin as a regulator of peroxiredoxin function and regulation of its expression. Free Radic Biol Med. 2012;53:447–456.</a></li><li><a href="https://doi.org/10.1007/978-1-61779-270-0_1">Shah G. M. et al. Approaches to detect PARP-1 activation in vivo, in situ, and in vitro. Methods Mol Biol. 2011;780:3–34.</a></li><li><a href="https://doi.org/10.1091/mbc.E18-10-0650">Murata M. M. et al. NAD⁺ consumption by PARP1 in response to DNA damage triggers metabolic shift critical for damaged cell survival. Mol Biol Cell. 2019;30:2584–2597.</a></li></ul><p>Временные кривые — расчёт по заданным учебным параметрам: они иллюстрируют различие импульса и длительного воздействия и не задают порогов. Химия Prx и Srx дана по обзорам Rhee и соавт. (2007), Lowther и Haynes (2011), Jeong и соавт. (2012): прочитаны аннотации. Расход NAD⁺ при активации PARP1 — по Shah и соавт. (2011) и Murata и соавт. (2019): прочитаны аннотации. Необратимость сульфоновой формы, перекисное окисление липидов, окисление ДНК и реакция Фентона — общепринятые положения без отдельного прочитанного источника (об окислении оснований ДНК см. также Sies и соавт., 2024).</p></details></article><article class="card print-unit" id="ns-redox-sensors"><div class="eyebrow">NADH/NAD⁺, сигнальное окисление и повреждение · шаг 28 из 32</div><h2>Как соотносятся сигналы сенсоров NADH/NAD⁺ и H₂O₂</h2><p class="lead"><a href="#ns-g-S8-T82">Peredox</a> (схема M05) сообщает об отношении NADH/NAD⁺ в цитозоле, а <a href="#ns-g-S8-T83">HyPer7</a> (схема M06) — о степени окисления сенсора пероксидом водорода в том компартменте, в который направлен сенсор. Один сенсор отвечает на состояние пары NADH/NAD⁺, другой — на окисление пероксидом водорода; сигнал каждого читают с учётом калибровки, диапазона и локализации.</p><ol class="mech"><li>Peredox состоит из NADH-связывающего белка Rex и флуоресцентного белка: NAD⁺ и NADH конкурируют за Rex, и флуоресценция приближённо отражает отношение форм.</li><li>HyPer7 окисляется H₂O₂ и восстанавливается клеточными системами; отношение интенсивностей флуоресценции при двух длинах волн возбуждения показывает долю окисленного сенсора.</li><li>Для интерпретации сигнала нужны калибровка по крайним состояниям, диапазон отклика, локализация и контроли; показания сенсоров в разных компартментах могут не совпадать, потому что сенсоры измеряют разные величины.</li></ol><p>Peredox (схема M05) — генетически кодируемый сенсор цитозольного NADH/NAD⁺. В нём циркулярно пермутированный флуоресцентный белок T-Sapphire встроен между двумя субъединицами димера NADH-связывающего белка Rex, а для нормировки на количество сенсора присоединён красный белок mCherry. NAD⁺ и NADH конкурируют за связывание с Rex, поэтому отклик зависит от обеих форм и лишь приближённо отражает отношение NADH/NAD⁺: трёхкратное изменение общего содержания NAD⁺ сдвигало диапазон отношений, в котором сенсор чувствителен, примерно вдвое. Калибруют сенсор добавлением лактата и пирувата. Ранний вариант реагировал на величину [NADH]·[H⁺]/[NAD⁺]; зависимость от pH у Peredox сильно снижена мутагенезом (Hung и соавт., 2011).</p><p>HyPer7 (схема M06) — сенсор H₂O₂, в котором флуоресцентный белок встроен в регуляторный домен белка OxyR (Pak и соавт., 2020). H₂O₂ окисляет цистеины сенсора, и отношение интенсивностей флуоресценции при двух длинах волн возбуждения меняется; восстановление клеточными системами возвращает исходное состояние. При регистрации по этому отношению показание устойчиво к изменению pH; контролем служит вариант C121S, не реагирующий на H₂O₂.</p><p>Выводы по показаниям сенсоров ограничены. Peredox описан для цитозоля (в первичных клетках для этого использовали и версию с ядерной локализацией) и не измеряет суммарный пул NAD(H); при направлении в матрикс его сигнал не менялся при метаболических воздействиях. HyPer7 показывает степень окисления сенсора в своём компартменте, то есть баланс между окислением сенсора пероксидом водорода и его восстановлением, а не все АФК и не повреждение. Для каждого сенсора определяют крайние состояния, проверяют насыщение, содержание сенсора в клетках и его локализацию. Поэтому показания двух сенсоров в разных компартментах могут расходиться; это не противоречие, поскольку сенсоры измеряют разные величины.</p><div class="note trap"><strong>Типичная ошибка</strong> Если HyPer7 в матриксе показывает окисление, то в клетке выросло содержание всех АФК.<p class="trap-fix">HyPer7 отвечает на H₂O₂ в том компартменте, куда направлен сенсор. Среди АФК он практически специфичен к H₂O₂ (на органические гидропероксиды отвечает при высоких концентрациях), не показывает повреждение и не заменяет измерение NADH/NAD⁺.</p></div><div class="static-quiz"><h3>Сигнал матриксного HyPer7 вырос, а цитозольный Peredox почти не изменился. Какой вывод допустим?</h3><ol><li><b>А.</b> Один из сенсоров работает неверно, поскольку оба отражают одну и ту же величину — NADH/NAD⁺. <i>(неверный вариант)</i><br><span class="expl">HyPer7 не является сенсором NADH/NAD⁺: он отвечает на окисление пероксидом водорода.</span></li><li><b>Б.</b> В матриксе возросло содержание всех АФК, включая супероксид, а в цитозоле оно не менялось. <i>(неверный вариант)</i><br><span class="expl">HyPer7 практически специфичен к H₂O₂, поэтому по его сигналу нельзя судить о содержании всех АФК, включая супероксид.</span></li><li><b>В.</b> Сенсоры отражают разные величины в разных компартментах, поэтому результаты не противоречат друг другу. <i>(верный вариант)</i><br><span class="expl">Первый отражает степень окисления сенсора пероксидом водорода в матриксе, второй — приближённо цитозольное NADH/NAD⁺.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-8.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cmet.2011.08.012">Hung Y. P. et al. Imaging Cytosolic NADH–NAD⁺ Redox State with a Genetically Encoded Fluorescent Biosensor. Cell Metab. 2011;14:545–554.</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7088435/">Pak V. V. et al. Ultrasensitive Genetically Encoded Indicator for Hydrogen Peroxide Identifies Roles for the Oxidant in Cell Migration and Mitochondrial Function. Cell Metab. 2020;31:642–653.e6.</a></li></ul><p>Схемы упрощены; числа и кривые на них учебные и не являются данными опыта. Устройство и калибровка Peredox даны по работе Hung и соавт. (2011), устройство HyPer7 — по работе Pak и соавт. (2020); обе прочитаны в полном тексте. Версия с ядерной локализацией использована в работе как приближение для цитозоля; при направлении в матрикс сигнал не менялся.</p></details></article><article class="card print-unit" id="ns-integrated-carbon"><div class="eyebrow">Объединяем механизмы · шаг 29 из 32</div><h2>Как одновременно поддерживаются образование лактата и биосинтез</h2><p class="lead">Углерод глюкозы одновременно распределяется между лактатом, пентозофосфатным путём, синтезом серина и окислением в митохондриях. Поэтому выделение лактата не означает, что биосинтез или дыхание остановлены.</p><div class="note"><strong>Что показывает схема.</strong> Карта объединяет четыре механизма: углерод глюкозы идёт к лактату (ЛДГ, NADH → NAD⁺), в пентозофосфатный путь (NADPH), к серину и в митохондрии (PDH, PC); цикл трикарбоновых кислот пополняется глутамином (GLS образует глутамат, из которого затем образуется α-КГ), цитрат экспортируется для образования ацетил-CoA. Состояния: исходное, ускоренное поступление глюкозы, подавленная ЛДГ, отсутствие глутамина.</div><ol class="mech"><li>От глюкозо-6-фосфата и 3-фосфоглицерата ответвляются пентозофосфатный путь, образующий NADPH, и синтез серина, а остальной углерод доходит до пирувата.</li><li>Пируват восстанавливается до лактата за счёт NADH, который при этом окисляется до NAD⁺, и параллельно поступает в митохондрии.</li><li>Цитрат отводится в биосинтез, а промежуточные соединения цикла пополняются глутамином и пируватом.</li></ol><p>Углерод глюкозы поступает в несколько путей одновременно, и на карте каждый показан своей линией. Глюкозо-6-фосфат может превращаться в ходе гликолиза или входить в окислительную ветвь пентозофосфатного пути, где образуются NADPH и рибозо-5-фосфат; от 3-фосфоглицерата ответвляется синтез серина. На карте обозначены раздельно NADH гликолиза и NADPH пентозофосфатного пути: это разные коферменты. Пируват тоже может превращаться несколькими путями. В реакции лактатдегидрогеназы (ЛДГ) он принимает электроны от NADH и превращается в лактат, а NAD⁺ регенерируется (шаг «Как образование лактата поддерживает гликолиз»). Другая часть пирувата поступает в митохондрии, где пируватдегидрогеназный комплекс (PDH) превращает его в ацетил-CoA, а пируваткарбоксилаза (PC) — в оксалоацетат.</p><p>Цикл трикарбоновых кислот служит и путём окисления, и источником предшественников для биосинтеза. Цитрат переносится в цитозоль, где ATP-цитратлиаза (ACLY) образует из него ацетил-CoA. Отток не истощает цикл, потому что его промежуточные соединения пополняются: глутаминаза превращает глутамин в глутамат, из которого образуется α-кетоглутарат (α-КГ). Подавление PDH киназой PDK и вклад PC различаются между клетками, поэтому доли ветвей схема не задаёт. В культивируемых клетках глиобластомы, выделявших в среду значительную часть углерода глюкозы в виде лактата, цикл оставался активным, из него отводились предшественники биосинтеза, а оксалоацетат пополнялся преимущественно глутамином при подавленном карбоксилировании пирувата (DeBerardinis и соавт., 2007); при высокой активности PC соотношение иное.</p><p>Выделение лактата показывает, что часть углерода глюкозы превратилась в лактат, но не означает, что остальной углерод глюкозы и углерод других субстратов не используются в биосинтезе. Углерод глутамина может и окисляться до CO₂, и оставаться в предшественниках. Нельзя складывать доли с разной нормировкой, например долю углерода глюкозы, превратившуюся в лактат, и долю цитрата, происходящую из глутамина: это разные величины, а не потоки одной реакции. Одна из моделей объясняет высокую скорость образования лактата тем, что скорость окисления NADH в дыхательной цепи недостаточна для регенерации NAD⁺ (Luengo и соавт., 2021).</p><div class="note trap"><strong>Типичная ошибка</strong> Если клетка выделяет много лактата, то весь углерод глюкозы потерян для биосинтеза, а цикл не работает.<p class="trap-fix">Лактат — лишь один из путей превращения пирувата. Углерод глюкозы одновременно идёт в пентозофосфатный путь и к серину, а цикл, пополняемый глутамином, служит и путём окисления, и источником предшественников.</p></div><div class="static-quiz"><h3>Клетка выделяет много лактата, а цикл пополняется углеродом глутамина. Может ли клетка при этом одновременно окислять пируват в цикле и отводить промежуточные соединения цикла в биосинтез?</h3><ol><li><b>А.</b> Да: цикл может окислять пируват и одновременно отдавать цитрат и другие промежуточные соединения в биосинтез. <i>(верный вариант)</i><br><span class="expl">Образование лактата не исключает входа пирувата в митохондрии, а глутамин пополняет цикл, поэтому окисление и отток предшественников в биосинтез могут идти одновременно.</span></li><li><b>Б.</b> Нет: выделение лактата означает, что пируват в митохондрии не поступает, а цикл окисляет другие субстраты. <i>(неверный вариант)</i><br><span class="expl">Выделение лактата показывает, что часть пирувата превратилась в лактат; это не исключает, что другая часть поступает в митохондрии через пируватдегидрогеназный комплекс или пируваткарбоксилазу.</span></li><li><b>В.</b> Да, но углерод глутамина в цикле окисляется до CO₂ и в биосинтетические предшественники не попадает. <i>(неверный вариант)</i><br><span class="expl">Углерод глутамина может и окисляться до CO₂, и оставаться в предшественниках, например в цитрате; эти судьбы не исключают друг друга.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал нескольких вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://www.worldcat.org/search?q=%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%D0%94%20%2C%20%D0%9A%D0%BE%D0%BA%D1%81%20%D0%9C">Нельсон Д., Кокс М. Основы биохимии Ленинджера. Том 2.</a></li><li><a href="https://research.chalmers.se/publication/522133/file/522133_Fulltext.pdf">Luengo A. et al. Increased demand for NAD⁺ relative to ATP drives aerobic glycolysis. Mol Cell. 2021;81:691–707.e6.</a></li><li><a href="https://www.worldcat.org/search?q=Baker%20S%20%20A">Baker S. A., Rutter J. Metabolites as signalling molecules. Nat Rev Mol Cell Biol. 2023;24:355–374.</a></li><li><a href="https://doi.org/10.1073/pnas.0709747104">DeBerardinis R. J. et al. Beyond aerobic glycolysis: transformed cells can engage in glutamine metabolism that exceeds the requirement for protein and nucleotide synthesis. Proc Natl Acad Sci USA. 2007;104:19345–19350.</a></li></ul><p>Схема качественная: числа и доли ветвей не заданы, она объединяет механизмы разделов 1–2. Работа цикла при пополнении глутамином показана на культивируемых клетках глиобластомы при подавленном карбоксилировании пирувата (DeBerardinis и соавт., 2007), зависимость от регенерации NAD⁺ — на пролиферирующих клетках (Luengo и соавт., 2021); в других клетках вклад ветвей иной. Реакции пентозофосфатного пути, синтеза серина и цикла приведены по учебникам биохимии.</p></details></article><article class="card print-unit" id="ns-integrated-chromatin"><div class="eyebrow">Объединяем механизмы · шаг 30 из 32</div><h2>Почему метаболиты и модификации хроматина восстанавливаются с разной скоростью</h2><p class="lead">После подавления мутантной IDH содержание R-2-HG, содержание модификаций хроматина и фенотип клетки могут изменяться в разное время. Это разные звенья цепи с собственными скоростями обновления; полный возврат к прежнему состоянию не гарантирован.</p><div class="note"><strong>Что показывает схема.</strong> Схема: четыре кривые после подавления мутантной IDH в условных единицах времени; по оси — доля исходного избытка (до подавления 1, как в контроле 0). Активность фермента снижается ступенчато в момент вмешательства; избыток R-2-HG, избыток метки на хроматине и отклонение фенотипа клетки от контроля убывают последовательно и с разной скоростью. Переключатели: быстрее или медленнее обновляется метка; полное или частичное подавление (остаточная активность 0 или 0,4). Кружки отмечают половину итогового изменения. Кривые учебные.</div><ol class="mech"><li>Мутантная IDH образует R-2-HG; после её подавления содержание R-2-HG убывает за счёт расходования и выхода из клетки.</li><li>Содержание метки на гистоне или ДНК меняется по мере сдвига баланса скоростей её внесения, удаления и разбавления новым материалом.</li><li>Фенотип клетки зависит ещё от экспрессии генов, содержания белков и РНК, поэтому может меняться в другое время, чем метка.</li></ol><p>Ожидаемая цепь событий, которую проверяют в каждой системе, такова: снижается активность фермента, затем скорость образования R-2-HG, затем содержание R-2-HG в клетке, затем скорость реакций, которые тормозит R-2-HG, и лишь затем количество модификации. R-2-HG — метаболит, а не ковалентная модификация гистона. На схеме эти звенья показаны отдельными кривыми: активность фермента меняется ступенчато в момент вмешательства, а остальные величины постепенно приближаются к новому стационарному значению.</p><p>Содержание метаболита уменьшается, когда образование прекращается, а расходование и выход из клетки продолжаются. Вместе с ним ослабевает торможение α-КГ-зависимых диоксигеназ, к которым относятся деметилазы гистонов и белки TET. Для сукцината и фумарата такое торможение показано на деметилазах гистонов и ДНК (Xiao и соавт., 2012), а R-2-HG тормозит ряд α-КГ-зависимых ферментов (Losman и соавт., 2013). Эффект R-2-HG не сводится к одному ферменту: R-2-HG слабее, чем S-2-HG, подавляет TET2, но воспроизводит блок дифференцировки в использованных моделях.</p><p>Содержание накопленной метки убывает, когда её удаляют ферменты или когда она разбавляется при обновлении, например при синтезе новых гистонов в ходе деления. Скорость удаления и обновления различается у разных меток. В клетках HEK293 ацетилирование гистонов обновляется в целом медленнее, чем фосфорилирование, но быстрее, чем метилирование; скорость зависит от гистона, остатка и соседних модификаций (Evertts и соавт., 2013). В клетках TF-1 с IDH2 R140Q обработка ингибитором мутантного фермента AGI-6780 снижала гиперметилирование гистонов уже через 7 дней, а число участков ДНК со сниженным метилированием возрастало при продлении обработки с 7 до 28 дней (Kernytsky и соавт., 2015).</p><p>Фенотип определяется не только меткой, но и накопленными белками и РНК, у которых тоже есть оборот, поэтому порядок «метаболит, метка, фенотип» не универсален. В клетках TF-1, обработанных проникающим в клетку эфиром R-2-HG, после его удаления способность к дифференцировке возвращалась быстро, а время возврата зависимости от цитокинов определялось дозой и длительностью воздействия; метки в этой работе не измеряли, и авторы допускают, что они динамичнее, чем считалось, либо что фенотип связан с другими функциями ферментов (Losman и соавт., 2013). Содержание метаболита или метки не равно скорости образования: один и тот же пул возможен при разных потоках.</p><div class="note trap"><strong>Типичная ошибка</strong> Если содержание R-2-HG уже снизилось, а метка ещё не вернулась, то R-2-HG не влияет на метку.<p class="trap-fix">Содержание метаболита и содержание метки определяются разными процессами: расходом метаболита, с одной стороны, и удалением или разбавлением накопленной модификации — с другой. Различие во времени не опровергает связь.</p></div><div class="static-quiz"><h3>После подавления неоморфной активности IDH избыток R-2-HG устранился раньше, чем убыл избыток модификаций. Противоречит ли это метаболической регуляции хроматина?</h3><ol><li><b>А.</b> Да: если R-2-HG влиял на метку, она должна была вернуться к исходному уровню вместе со снижением R-2-HG. <i>(неверный вариант)</i><br><span class="expl">Метаболит убывает за счёт расходования и выхода из клетки, а метка — за счёт удаления и разбавления; скорости этих процессов различны, поэтому одновременного возврата ожидать нельзя.</span></li><li><b>Б.</b> Да: если метка не вернулась к исходному уровню, то R-2-HG не влиял на её содержание в этой системе. <i>(неверный вариант)</i><br><span class="expl">Запаздывание метки не отменяет влияния R-2-HG: накопленная метка сохраняется и после снижения метаболита, пока её не удалят ферменты или не разбавит новый материал.</span></li><li><b>В.</b> Нет: после снижения R-2-HG избыток метки убывает по мере её удаления и разбавления, на что нужно время. <i>(верный вариант)</i><br><span class="expl">Расход метаболита и удаление накопленной метки — разные процессы со своими скоростями, поэтому запаздывание метки не противоречит регуляции.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал нескольких вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1231677">Losman J. A. et al. (R)-2-hydroxyglutarate is sufficient to promote leukemogenesis and its effects are reversible. Science. 2013;339:1621–1625.</a></li><li><a href="https://doi.org/10.1101/gad.191056.112">Xiao M. et al. Inhibition of α-KG-dependent histone and DNA demethylases by fumarate and succinate that are accumulated in mutations of FH and SDH tumor suppressors. Genes Dev. 2012;26:1326–1338.</a></li><li><a href="https://doi.org/10.1074/jbc.M112.428318">Evertts A. G. et al. Quantitative dynamics of the link between cellular metabolism and histone acetylation. J Biol Chem. 2013;288:12142–12151.</a></li><li><a href="https://doi.org/10.1182/blood-2013-10-533604">Kernytsky A. et al. IDH2 mutation-induced histone and DNA hypermethylation is progressively reversed by small-molecule inhibition. Blood. 2015;125:296–303.</a></li></ul><p>Кривые построены в условных единицах времени и не соответствуют ни одному опыту: порядок «метаболит, метка, фенотип» — гипотеза, проверяемая измерением в каждой системе, а не закон. В клетках TF-1 с IDH2 R140Q ингибитор AGI-6780 снижал гиперметилирование гистонов через 7 дней, а гиперметилирование ДНК уменьшалось постепенно: число участков со сниженным метилированием возрастало от 7 к 28 дням (Kernytsky и соавт., 2015; полный текст); для других меток, сайтов и клеток сроки иные.</p></details></article><article class="card print-unit" id="ns-integrated-redox"><div class="eyebrow">Объединяем механизмы · шаг 31 из 32</div><h2>Как изменение углеродного потока связано с редокс-адаптацией</h2><p class="lead">Окислительная ветвь пентозофосфатного пути образует NADPH, за счёт которого восстанавливаются тиоредоксиновая и глутатионовая системы, поддерживающие пероксидазы, удаляющие H₂O₂. В клетках A549 окисление PKM2 снижает её активность, а при действии диамида усиливается поток глюкозы в эту ветвь; механизм не универсален.</p><div class="note"><strong>Что показывает схема.</strong> Схема: глюкозо-6-фосфат → окислительная ветвь пентозофосфатного пути → NADPH → восстановление тиоредоксина и глутатиона → удаление H₂O₂ (по механизму). Отдельная петля: H₂O₂ окисляет Cys358 PKM2, активность PKM2 снижается, а при действии диамида выше по пути накапливается глюкозо-6-фосфат (клетки A549). Переключатели: белок PKM2 (дикий тип или C358S) и окислительное воздействие (нет или есть).</div><ol class="mech"><li>Окислительная ветвь пентозофосфатного пути превращает глюкозо-6-фосфат с образованием NADPH.</li><li>NADPH служит донором электронов для восстановления тиоредоксина и глутатиона, которые поддерживают пероксидазы, удаляющие H₂O₂.</li><li>В клетках A549 окисление Cys358 снижало активность PKM2, а при действии диамида накапливался глюкозо-6-фосфат и усиливался поток в окислительную ветвь.</li></ol><p>Окислительная ветвь пентозофосфатного пути превращает глюкозо-6-фосфат в рибулозо-5-фосфат; на каждую молекулу субстрата образуются две молекулы NADPH. Через тиоредоксинредуктазу и глутатионредуктазу электроны NADPH восстанавливают тиоредоксин (Trx) и глутатион (GSH): Trx восстанавливает пероксиредоксины, а GSH служит донором электронов для глутатионпероксидаз, удаляющих H₂O₂ (шаг «Как NADPH поддерживает восстановление антиоксидантных систем»; Sies и соавт., 2024). Углеродный обмен связан с этими системами через NADPH, а не через NADH.</p><p>Один из механизмов перераспределения потока описали Anastasiou и соавт. (2011) на клетках рака лёгкого человека A549. Пируваткиназа M2 (PKM2) переносит фосфорильную группу с фосфоенолпирувата на ADP. H₂O₂ (1 мМ), диамид (250 мкМ) и гипоксия (1 % O₂ в газовой смеси, а не измеренная концентрация кислорода в клетке) снижали активность PKM2; замена Cys358 на серин (C358S) устраняла окисление этого остатка, и активность варианта была менее чувствительна к окислителю. Усиление потока в окислительную ветвь и рост содержания глюкозо-6-фосфата в 2,3 раза за 30 мин показаны для диамида; активатор PKM2 препятствовал и снижению активности, и этому усилению потока.</p><p>В клетках с вариантом C358S было ниже содержание восстановленного глутатиона и выше чувствительность к диамиду; при концентрации глюкозы в среде 5,6 мМ, но не 25 мМ, такие клетки росли медленнее. Для тиоредоксиновой системы измерений в работе нет, и на схеме она показана по механизму. Данные получены на одной клеточной линии и не позволяют судить о других клетках: поток через пентозофосфатный путь определяется всей сетью, включая поступление глюкозы, активность других ферментов и расход NADPH в биосинтезе.</p><p>Устойчивость к повреждению и сохранение физиологического редокс-сигнала не равнозначны. В физиологических концентрациях H₂O₂ служит сигнальной молекулой, а при избытке повреждает биомолекулы; избыток восстановительных эквивалентов (редуктивный дистресс) тоже может нарушать функции клетки (Sies и соавт., 2024). Поэтому большее содержание NADPH само по себе не означает лучшей адаптации.</p><div class="note trap"><strong>Типичная ошибка</strong> PKM2 сама образует NADPH, поэтому её активность поддерживает антиоксидантные системы.<p class="trap-fix">PKM2 переносит фосфорильную группу с фосфоенолпирувата на ADP, а NADPH образуется в окислительной ветви пентозофосфатного пути. Окисление PKM2 снижает её активность, и больше глюкозо-6-фосфата может входить в эту ветвь.</p></div><div class="static-quiz"><h3>В клетках A549 при действии диамида окисление PKM2 снижало её активность, а поток глюкозы в пентозофосфатный путь усиливался. Какое звено связывает усиление этого потока с удалением H₂O₂?</h3><ol><li><b>А.</b> Образование NADPH самой PKM2 при её окислении: оно снабжает электронами глутатион и тиоредоксин. <i>(неверный вариант)</i><br><span class="expl">PKM2 переносит фосфорильную группу с фосфоенолпирувата на ADP и NADPH не образует; NADPH образуется в окислительной ветви пентозофосфатного пути.</span></li><li><b>Б.</b> Образование NADH в гликолизе: им напрямую восстанавливаются пероксидазы, удаляющие H₂O₂. <i>(неверный вариант)</i><br><span class="expl">Глутатионредуктаза и тиоредоксинредуктаза используют NADPH, а не NADH; NADH гликолиза окисляется в других реакциях.</span></li><li><b>В.</b> Образование NADPH в окислительной ветви: этот кофермент передаёт электроны глутатиону и тиоредоксину. <i>(верный вариант)</i><br><span class="expl">Электроны NADPH через глутатионредуктазу и тиоредоксинредуктазу восстанавливают глутатион и тиоредоксин, а те поддерживают пероксидазы, удаляющие H₂O₂. В этом опыте измеряли глутатион, но не тиоредоксин.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал нескольких вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1211485">Anastasiou D. et al. Inhibition of pyruvate kinase M2 by reactive oxygen species contributes to cellular antioxidant responses. Science. 2011;334:1278–1283.</a></li><li><a href="https://doi.org/10.1038/s41580-024-00730-2">Sies H., Mailloux R. J., Jakob U. Fundamentals of redox regulation in biology. Nat Rev Mol Cell Biol. 2024. DOI 10.1038/s41580-024-00730-2.</a></li></ul><p>Схема качественная, числа не заданы. Снижение активности PKM2 в клетках A549 вызывали H₂O₂ (1 мМ), диамид (250 мкМ) и гипоксия (1 % O₂); окисление Cys358 непосредственно показано для диамида и гипоксии, а усиление потока в окислительную ветвь и рост глюкозо-6-фосфата — только для диамида (Anastasiou и соавт., 2011); у варианта C358S измеряли глутатион, чувствительность к окислителю и рост, но не поток. Тиоредоксиновая система и связь NADPH с Trx и GSH показаны по механизму (Sies и соавт., 2024); универсальность механизма не показана.</p></details></article><article class="card print-unit" id="ns-causal-comparison"><div class="eyebrow">Объединяем механизмы · шаг 32 из 32</div><h2>Как проверить предполагаемую связь метаболита и модификации</h2><p class="lead">Чтобы проверить, влияет ли метаболит на модификацию, изменяют количество или активность фермента и сравнивают четыре состояния при одинаковых условиях. Вывод ограничен измеренным показателем и заданными условиями.</p><div class="note"><strong>Что показывает схема.</strong> Схема M07: контрольная РНК, снижение ACLY малой РНК, введение устойчивой к РНК функциональной ACLY и каталитически неактивного варианта; в каждом состоянии оценивают активность ACLY, ацетил-CoA и H3K9ac относительно общего H3. Вывод зависит от того, восстанавливает ли ацетилирование неактивный вариант, измерены ли ацетил-CoA и количество вариантов. Схема M08: ингибитор подавляет ACLY, образуется ацетил-CoA, ацетилируется H3; отдельно показаны побочная мишень вещества и обходной источник ацетат. Методы LC–MS (M03) и иммуноблот (M04) показаны в шаге про величины, связывающие метаболизм и модификацию гистона.</div><ol class="mech"><li>Воздействие (РНК-интерференция или вещество) изменяет фермент, и это изменение проверяют отдельно от измерения метки.</li><li>Введение функционального и каталитически неактивного вариантов фермента показывает, нужен ли катализ.</li><li>Метаболит и модификацию измеряют отдельно, а побочные мишени и обходные источники исключают независимыми контролями.</li></ol><p>Совпадение двух изменений не показывает, что одно вызвало другое. Поэтому гипотезу «ATP-цитратлиаза (ACLY) образует ацетил-CoA, из которого ацетилируется гистон H3 по лизину 9 (H3K9ac)» проверяют вмешательством и выделяют три этапа: воздействие на ACLY, проверку изменения мишени и измерение метаболита и модификации.</p><p>На схеме M07 показан опыт с РНК-интерференцией: малая РНК, комплементарная мРНК ACLY, уменьшает количество мРНК, а уменьшение белка и активности проверяют отдельно. Затем вводят ACLY в функциональном или каталитически неактивном варианте; её мРНК устойчива к этой малой РНК (опыт с возвращением функции, рескью). Сравнивают четыре состояния при одинаковых условиях и времени: контроль; снижение ACLY; снижение с введением функциональной ACLY; снижение с введением неактивного варианта. Если ацетилирование H3K9 восстанавливается только при введении функционального варианта, а количество и локализация белка сопоставимы, это согласуется с тем, что в данных условиях для ацетилирования H3K9 необходима каталитическая активность ACLY. Ацетил-CoA измеряют методом LC–MS (схема M03), а H3K9ac нормируют на общий H3 при иммуноблоте (схема M04); обе схемы — в шаге «Какие величины связывают изменение метаболизма с модификацией гистона».</p><p>На схеме M08 показано фармакологическое воздействие. Оно требует других контролей: растворителя, диапазона концентраций, жизнеспособности клеток и независимого вмешательства. Вещество может действовать на побочные мишени, и обходной источник, например ацетат в сверхфизиологических концентрациях, способен вернуть метку, не устраняя нарушения ACLY: введение фермента и обходной источник субстрата отвечают на разные вопросы. Восстановление одной модификации поддерживает конкретную связь, но не доказывает восстановления всех функций клетки.</p><div class="note trap"><strong>Типичная ошибка</strong> Если после снижения ACLY снизились и содержание ацетил-CoA, и ацетилирование H3K9, то связь доказана.<p class="trap-fix">Совпадение изменений не отличает причину от сопутствующего эффекта. Связь поддерживают подтверждённое изменение мишени, восстановление показателя при введении функционального варианта и отсутствие такого восстановления при введении неактивного, а также независимое вмешательство.</p></div><div class="static-quiz"><h3>После подавления ACLY (РНК-интерференция) ацетилирование H3 уменьшилось. Введение функциональной ACLY, синтезируемой с мРНК, устойчивой к РНК-интерференции, восстановило ацетилирование, а введение каталитически неактивного варианта с таким же количеством и локализацией белка — нет. Какой вывод наиболее обоснован?</h3><ol><li><b>А.</b> Результат показывает, что ACLY образует основную часть ацетил-CoA для ацетилирования гистонов в этих клетках. <i>(неверный вариант)</i><br><span class="expl">В опыте не измеряли ацетил-CoA и не сравнивали вклад других источников, например ацетата; нужен катализ ACLY для этого показателя, но доля её вклада не определена.</span></li><li><b>Б.</b> Результат поддерживает вывод, что в этих условиях для ацетилирования H3 нужна каталитическая активность ACLY. <i>(верный вариант)</i><br><span class="expl">При сопоставимых количестве и локализации вариантов сравнение поддерживает роль катализа, но не устанавливает все промежуточные механизмы.</span></li><li><b>В.</b> Восстановление ацетилирования H3 показывает, что восстановлены и другие функции клетки, зависящие от ACLY. <i>(неверный вариант)</i><br><span class="expl">Измеряли одно ацетилирование H3; восстановление других функций клетки (экспрессии генов, пролиферации) в опыте не проверяли.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал нескольких вопросов практикума. <a href="seminar-8.html#q1">Вопрос 1 →</a> <a href="seminar-8.html#q2">Вопрос 2 →</a> <a href="seminar-8.html#q3">Вопрос 3 →</a> <a href="seminar-8.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1164097">Wellen K. E. et al. ATP-citrate lyase links cellular metabolism to histone acetylation. Science. 2009;324:1076–1080.</a></li></ul><p>Схемы M07 и M08 учебные, без экспериментальных чисел; результаты А–В — условный план опыта, а не воспроизведение работы Wellen и соавт. (2009). В этой работе подавление ACLY (РНК-интерференция) снижало ацетилирование коровых гистонов, а сверхфизиологический ацетат его возвращал. В адипоцитах 3T3-L1 снижалась экспрессия генов Glut4, HK2, PFK-1 и LDHA, и ацетат эту экспрессию возвращал; ацетилирование гистонов на промоторе определяли только для Glut4. Прямой связи экспрессии остальных генов с ацетилированием в работе не измеряли, а функциональный и неактивный варианты ACLY не сопоставляли. Результаты клеточных культур не переносятся на организм без отдельной проверки.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S8-T01"><dt>Метаболический поток</dt><dd>Количество вещества, превращаемого в определённой реакции или пути за единицу времени. Поток всегда относят к названной реакции, системе и основе нормировки; концентрация единицей потока не является.</dd></div><div id="ns-g-S8-T02"><dt>Количество вещества</dt><dd>Число молей определённого вещества в выбранной системе. Само по себе оно не определяет концентрацию: для её расчёта необходим объём системы.</dd></div><div id="ns-g-S8-T03"><dt>Концентрация метаболита</dt><dd>Количество вещества, отнесённое к объёму выбранной среды или компартмента. Локальная концентрация относится к конкретному компартменту и не определяется общим содержанием вещества в клетке.</dd></div><div id="ns-g-S8-T04"><dt>Метаболический пул</dt><dd>Совокупность молекул определённого метаболита или группы взаимопревращающихся форм в заданной системе. Состав пула задаёт, какие формы учитываются; одинаковое отношение форм возможно при разном общем количестве вещества.</dd></div><div id="ns-g-S8-T05"><dt>Стационарное состояние</dt><dd>Состояние, в котором выбранные величины постоянны во времени при сохраняющихся потоках: приток равен расходу. В отличие от химического равновесия, в открытой системе чистые потоки при этом не равны нулю.</dd></div><div id="ns-g-S8-T06"><dt>Химическое равновесие</dt><dd>Состояние конкретной обратимой реакции, при котором прямой и обратный потоки равны, а чистый поток равен нулю. Клетка в стационарном состоянии равновесной не является, поскольку в ней поддерживаются ненулевые чистые потоки.</dd></div><div id="ns-g-S8-T07"><dt>Гликолиз</dt><dd>Последовательность реакций превращения глюкозы в пируват с образованием ATP и NADH (гликолиз в узком смысле). В широком смысле, как в шаге «Как образование лактата поддерживает гликолиз», гликолизом называют путь от глюкозы до лактата, включающий восстановление пирувата; NADPH гликолиз не образует.</dd></div><div id="ns-g-S8-T08"><dt>Аэробный гликолиз</dt><dd>Метаболический фенотип, при котором значительная часть глюкозы превращается в лактат при достаточном содержании кислорода; при описании опухолевых клеток его называют эффектом Варбурга. Он не равнозначен гипоксии и не ограничен опухолевыми клетками.</dd></div><div id="ns-g-S8-T09"><dt>Гипоксия</dt><dd>Недостаточная для рассматриваемого процесса доступность кислорода в клетке или ткани. Доля O₂ в газовой смеси инкубатора не равна локальной концентрации кислорода у клеток.</dd></div><div id="ns-g-S8-T10"><dt>Лактат</dt><dd>Анион молочной кислоты, образующийся, в частности, при восстановлении пирувата NADH. Лактат не только конечный продукт: он может окисляться обратно до пирувата, а его образование не обязательно связано с нехваткой O₂.</dd></div><div id="ns-g-S8-T11"><dt>Лактатдегидрогеназа (ЛДГ, LDH)</dt><dd>Фермент обратимого взаимопревращения пирувата и лактата, сопряжённого с парой NADH/NAD⁺: пируват + NADH + H⁺ ⇄ лактат + NAD⁺. LDHA — субъединица, кодируемая одним геном; ЛДГ в целом представлена несколькими изоферментами.</dd></div><div id="ns-g-S8-T12"><dt>Регенерация NAD⁺</dt><dd>Образование окисленной формы кофермента при окислении NADH, например в реакции ЛДГ или на комплексе I. Новые молекулы NAD при этом не синтезируются, и общий пул NAD(H) не увеличивается.</dd></div><div id="ns-g-S8-T13"><dt>Субстратное фосфорилирование</dt><dd>Синтез ATP или GTP за счёт энергии высокоэнергетического промежуточного соединения (1,3-бисфосфоглицерата, фосфоенолпирувата, сукцинил-CoA), при котором фосфорильная группа переносится на нуклеозиддифосфат. Протекает без ATP-синтазы и протондвижущей силы.</dd></div><div id="ns-g-S8-T14"><dt>Окислительное фосфорилирование</dt><dd>Синтез ATP, сопряжённый через протондвижущую силу с переносом электронов по дыхательной цепи; у человека конечным акцептором электронов служит O₂. Скорость потребления кислорода (OCR) включает расход, не связанный с синтезом ATP, поэтому скорости синтеза ATP не равна.</dd></div><div id="ns-g-S8-T15"><dt>Выход ATP</dt><dd>Количество ATP, образованного на заданное количество превращённого субстрата, например на молекулу глюкозы. Выход отличается от скорости образования ATP (количества за единицу времени) и от содержания ATP в клетке.</dd></div><div id="ns-g-S8-T16"><dt>Восстановительные эквиваленты</dt><dd>Электроны, переносимые в окислительно-восстановительных реакциях коферментами и другими переносчиками, например NADH, NADPH, FADH₂ или убихинолом. NADH цитозоля через внутреннюю митохондриальную мембрану не проходит; его эквиваленты передают челночные системы.</dd></div><div id="ns-g-S8-T17"><dt>Челночная система NADH</dt><dd>Совокупность сопряжённых реакций и переноса метаболитов, передающая восстановительные эквиваленты цитозольного NADH на дыхательную цепь митохондрий; сам NADH внутреннюю мембрану не пересекает. В малат-аспартатном челноке NADH вновь образуется в матриксе, в глицерол-3-фосфатном электроны передаются на убихинон.</dd></div><div id="ns-g-S8-T18"><dt>Пентозофосфатный путь</dt><dd>Совокупность реакций превращения сахарофосфатов: окислительная ветвь образует NADPH и рибулозо-5-фосфат, неокислительная обратимо взаимопревращает пентозофосфаты и другие сахарофосфаты. Собственно в этом пути NADPH образуется только в окислительной ветви.</dd></div><div id="ns-g-S8-T19"><dt>Одноуглеродный обмен</dt><dd>Связанные реакции переноса одноуглеродных групп на коферменты, в том числе в фолатном и метиониновом циклах. Переносчиками служат производные тетрагидрофолата и SAM (метильная группа); биотинзависимое карбоксилирование к этому обмену не относится.</dd></div><div id="ns-g-S8-T20"><dt>Биосинтетический предшественник</dt><dd>Соединение, атомы которого используются для образования другого вещества в биосинтетическом пути. Понятие относится к определённой паре «предшественник — продукт» в определённом пути.</dd></div><div id="ns-g-S8-T21"><dt>Аспартат</dt><dd>Аминокислота, образующаяся, в частности, трансаминированием оксалоацетата (в цитозоле — GOT1, в митохондриях — GOT2) и используемая для синтеза белков и нуклеотидов. Её доступность определяется образованием, транспортом между компартментами и расходом.</dd></div><div id="ns-g-S8-T22"><dt>Цикл трикарбоновых кислот (ЦТК)</dt><dd>Связанная последовательность реакций в матриксе митохондрий (SDH встроена во внутреннюю мембрану), в которой при полном обороте окисляется ацетильная группа ацетил-CoA и регенерируется оксалоацетат. Синонимы: цикл Кребса, цикл лимонной кислоты.</dd></div><div id="ns-g-S8-T23"><dt>Амфиболический путь</dt><dd>Метаболический путь, участвующий и в катаболизме, и в образовании предшественников для анаболизма. Это свойство пути в целом: отдельная реакция не обязательно выполняет обе функции одновременно.</dd></div><div id="ns-g-S8-T24"><dt>Промежуточное соединение</dt><dd>Соединение, которое образуется в одной реакции рассматриваемого пути и расходуется в другой; в ЦТК это, например, цитрат, α-КГ, сукцинат и малат. Синоним — «интермедиат».</dd></div><div id="ns-g-S8-T25"><dt>Катаплероз</dt><dd>Чистый отток промежуточных соединений ЦТК в другие метаболические пути. Выход отдельной молекулы через мембрану катаплерозом ещё не является: значение имеет суммарный баланс оттока и обратного притока.</dd></div><div id="ns-g-S8-T26"><dt>Анаплероз</dt><dd>Восполнение промежуточных соединений ЦТК за счёт поступления углеродных скелетов из других путей. Поступление ацетил-CoA в цикл чистого восполнения оксалоацетата у человека не обеспечивает.</dd></div><div id="ns-g-S8-T27"><dt>Пируваткарбоксилаза (PC, ПК)</dt><dd>Биотинсодержащий фермент, катализирующий ATP-зависимое карбоксилирование пирувата до оксалоацетата. Источником CO₂ служит бикарбонат; в клетках человека реакция протекает в митохондриях.</dd></div><div id="ns-g-S8-T28"><dt>Пируватдегидрогеназный комплекс (PDH)</dt><dd>Мультиферментный комплекс матрикса митохондрий, катализирующий окислительное декарбоксилирование пирувата до ацетил-CoA с образованием CO₂ и NADH. Он отличается от пируваткарбоксилазы (PC), образующей оксалоацетат, и от регулирующей его киназы PDK.</dd></div><div id="ns-g-S8-T29"><dt>Пируватдегидрогеназная киназа (PDK)</dt><dd>Киназа, фосфорилирующая и тем самым ингибирующая пируватдегидрогеназный комплекс (у человека четыре изоформы, PDK1–PDK4). Фосфоинозитид-зависимая протеинкиназа PDPK1, которую в литературе нередко тоже называют PDK1, — другой фермент.</dd></div><div id="ns-g-S8-T30"><dt>Глутаминаза (GLS)</dt><dd>Фермент гидролиза амидной группы глутамина с образованием глутамата и аммония. Образование α-КГ из глутамата требует отдельной реакции (трансаминирования или окислительного дезаминирования), которую глутаминаза не катализирует.</dd></div><div id="ns-g-S8-T31"><dt>Трансаминирование</dt><dd>Перенос аминогруппы между аминокислотой и кетокислотой с образованием новых аминокислоты и кетокислоты (аминотрансферазы, кофермент — пиридоксальфосфат). Например, GOT переносит аминогруппу с глутамата на оксалоацетат; гидролиз глутамина трансаминированием не является.</dd></div><div id="ns-g-S8-T32"><dt>Оксалоацетат</dt><dd>Четырёхуглеродная кетодикарбоновая кислота, промежуточное соединение ЦТК и предшественник аспартата. При физиологическом pH она существует в виде аниона (оксалоацетата); сокращённо — ОАА.</dd></div><div id="ns-g-S8-T33"><dt>α-Кетоглутарат (α-КГ, 2-оксоглутарат)</dt><dd>Пятиуглеродная кетодикарбоновая кислота (в виде аниона), промежуточное соединение ЦТК и косубстрат ряда диоксигеназ. Названия α-кетоглутарат и 2-оксоглутарат обозначают одно соединение; 2-гидроксиглутарат — другое вещество.</dd></div><div id="ns-g-S8-T34"><dt>Сукцинат</dt><dd>Анион янтарной кислоты, промежуточное соединение ЦТК, окисляемое сукцинатдегидрогеназой до фумарата. Его содержание определяется балансом образования и расхода, а не одной реакцией.</dd></div><div id="ns-g-S8-T35"><dt>Фумарат</dt><dd>Анион фумаровой кислоты; образуется при окислении сукцината сукцинатдегидрогеназой и превращается фумаразой в малат. Потеря фумаразы и потеря SDH — разные нарушения: накапливаются разные метаболиты (фумарат и сукцинат).</dd></div><div id="ns-g-S8-T36"><dt>Сукцинатдегидрогеназа (SDH, комплекс II)</dt><dd>Комплекс II дыхательной цепи и фермент ЦТК во внутренней мембране митохондрий: окисляет сукцинат до фумарата и передаёт электроны через прочно (ковалентно) связанный FAD и железо-серные кластеры убихинону. Свободный FADH₂ при этом не высвобождается.</dd></div><div id="ns-g-S8-T37"><dt>Фумараза (FH)</dt><dd>Фермент обратимой гидратации фумарата до L-малата. Присоединение воды по двойной связи не является окислительным декарбоксилированием: переноса электронов и выделения CO₂ в этой реакции нет.</dd></div><div id="ns-g-S8-T38"><dt>Восстановительное карбоксилирование α-КГ</dt><dd>Образование изоцитрата из α-КГ с присоединением CO₂ и расходом NADPH; реакцию в направлении, обратном образованию NADPH, катализируют IDH1 (преимущественно цитозоль) и IDH2 (матрикс), вклад которых зависит от клеток. Изоцитрат затем может превращаться в цитрат; это обращение лишь части реакций ЦТК.</dd></div><div id="ns-g-S8-T39"><dt>Изотополог</dt><dd>Молекула, отличающаяся от других молекул того же соединения числом атомов тяжёлого изотопа, например ¹³C. Изотопологи различаются числом меченых атомов, а изотопомеры — их положением в молекуле.</dd></div><div id="ns-g-S8-T40"><dt>Изотопомер</dt><dd>Молекула с тем же числом изотопных атомов, что и другая молекула соединения, но с иным их расположением в структуре. Позиционные варианты с одинаковым числом ¹³C дают один и тот же сигнал M+n, поэтому обычный подсчёт M+n их не различает.</dd></div><div id="ns-g-S8-T41"><dt>M+n</dt><dd>Обозначение изотополога, масса которого на n единиц больше немеченой формы (M+0) из-за n атомов ¹³C. M+n описывает распределение молекул по числу меченых атомов и величиной потока не является.</dd></div><div id="ns-g-S8-T42"><dt>[U-¹³C]субстрат</dt><dd>Исходное соединение, в молекуле которого углерод во всех положениях представлен ¹³C. Обозначение U относится к молекуле субстрата и не означает, что все молекулы этого вещества и его продуктов в клетке полностью меченые.</dd></div><div id="ns-g-S8-T43"><dt>Доля меченого изотополога</dt><dd>Отношение количества выбранного изотополога к сумме количеств всех изотопологов соединения. Его рассчитывают после поправки на естественную изотопную распространённость (для ¹³C около 1,1 %); доля показывает распределение метки, а не абсолютный поток.</dd></div><div id="ns-g-S8-T44"><dt>Ацетил-CoA</dt><dd>Тиоэфир ацетильной группы и кофермента A; донор ацетильной группы в реакциях ацетилирования и субстрат цитратсинтазы. Внутреннюю мембрану митохондрий он не пересекает, поэтому пулы в матриксе и в цитозоле разделены; ацетильные группы переходят между ними в составе цитрата или ацетилкарнитина.</dd></div><div id="ns-g-S8-T45"><dt>ATP-цитратлиаза (ACLY)</dt><dd>Фермент ATP-зависимого расщепления цитрата: цитрат + ATP + CoA → ацетил-CoA + оксалоацетат + ADP + Pi. Фермент работает в цитозоле и ядре, вне митохондрий.</dd></div><div id="ns-g-S8-T46"><dt>Ацетил-CoA-синтетаза 2 (ACSS2)</dt><dd>Фермент образования ацетил-CoA из ацетата: ацетат + CoA + ATP → ацетил-CoA + AMP + пирофосфат. Эта реакция отличается от реакции ACLY, использующей цитрат и образующей ADP.</dd></div><div id="ns-g-S8-T47"><dt>Гистонацетилтрансфераза (HAT, KAT)</dt><dd>Фермент переноса ацетильной группы с ацетил-CoA на ε-аминогруппу остатка лизина гистона. Обозначение KAT (лизинацетилтрансфераза) шире и охватывает ферменты с негистоновыми субстратами; HAT относится к гистоновой реакции.</dd></div><div id="ns-g-S8-T48"><dt>Гистоновая деацетилаза (HDAC)</dt><dd>Фермент гидролитического удаления ацетильной группы с остатка лизина гистона. К HDAC относят Zn²⁺-зависимые ферменты классов I, II и IV; NAD⁺-зависимые сиртуины катализируют иную реакцию.</dd></div><div id="ns-g-S8-T49"><dt>Сиртуин</dt><dd>Семейство NAD⁺-зависимых деацилаз (SIRT1–SIRT7): деацетилирование сопровождается расходом NAD⁺ и образованием никотинамида. Сиртуины различаются по субстратам и локализации, и лишь часть из них действует преимущественно на гистоны.</dd></div><div id="ns-g-S8-T50"><dt>S-Аденозилметионин (SAM)</dt><dd>Соединение, образующееся из метионина и ATP и служащее донором метильной группы во многих реакциях метилирования. Ацетильные группы SAM не переносит: их донором служит ацетил-CoA.</dd></div><div id="ns-g-S8-T51"><dt>S-Аденозилгомоцистеин (SAH)</dt><dd>Продукт SAM-зависимых реакций метилирования; образуется после отдачи метильной группы и тормозит многие метилтрансферазы. Отношение SAM/SAH характеризует состояние пула, но универсальным числовым условием активности метилтрансфераз не является.</dd></div><div id="ns-g-S8-T52"><dt>Метионинаденозилтрансфераза (MAT)</dt><dd>Фермент, образующий SAM из метионина и ATP. Метилтрансферазы — другие ферменты: они используют уже образованный SAM и переносят его метильную группу на субстрат.</dd></div><div id="ns-g-S8-T53"><dt>Метилтрансфераза</dt><dd>Фермент переноса метильной группы с донора на определённый субстрат. В рассматриваемых реакциях донором служит SAM, субстратом — остаток лизина в гистоне или цитозин ДНК, и образуется SAH.</dd></div><div id="ns-g-S8-T54"><dt>H3K9ac</dt><dd>Ацетилирование остатка лизина в положении 9 гистона H3. Количество модифицированного гистона, доля модифицированных сайтов и сигнал антитела в иммуноблоте — разные величины.</dd></div><div id="ns-g-S8-T55"><dt>H3K4me3</dt><dd>Триметилирование лизина 4 гистона H3. Метка обогащена вблизи старта транскрипции, в том числе на неактивных промоторах, поэтому её наличие само по себе не показывает, что конкретный ген активен.</dd></div><div id="ns-g-S8-T56"><dt>H3K9me3</dt><dd>Триметилирование лизина 9 гистона H3, характерное для ряда областей гетерохроматина. Метилирование гистонов в целом репрессивным не является: например, H3K4me3 обогащена вблизи старта транскрипции.</dd></div><div id="ns-g-S8-T57"><dt>Косубстрат</dt><dd>Дополнительный субстрат реакции, химически превращающийся в каждом каталитическом цикле: например, SAM у метилтрансфераз, ацетил-CoA у ацетилтрансфераз, NAD⁺ у сиртуинов, α-КГ (в сукцинат и CO₂) и O₂ у диоксигеназ. Fe(II) — кофактор, в реакции он не расходуется.</dd></div><div id="ns-g-S8-T58"><dt>JmjC-деметилазы</dt><dd>Гистоновые деметилазы с JmjC-доменом; это Fe(II)- и α-КГ-зависимые диоксигеназы, использующие O₂. Гистоновые деметилазы другого типа, например LSD1 (KDM1A), используют FAD и к этой группе не относятся.</dd></div><div id="ns-g-S8-T59"><dt>Белки TET</dt><dd>Fe(II)/α-КГ-зависимые диоксигеназы (TET1–TET3), последовательно окисляющие 5mC до 5hmC, 5-формилцитозина (5fC) и 5-карбоксилцитозина (5caC). Появление 5hmC — лишь первый этап, поскольку возвращение к немодифицированному цитозину требует дальнейших стадий: вырезания основания с репарацией или разбавления метки при репликации.</dd></div><div id="ns-g-S8-T60"><dt>5-Метилцитозин (5mC)</dt><dd>Производное цитозина с метильной группой в положении 5 пиримидинового кольца; метка ДНК. Её значение зависит от последовательности, положения в гене и клеточного контекста; наличие метки не означает подавления любого гена.</dd></div><div id="ns-g-S8-T61"><dt>5-Гидроксиметилцитозин (5hmC)</dt><dd>Продукт окисления 5mC белками TET с гидроксиметильной группой в положении 5 пиримидинового кольца. Он отличается от немодифицированного цитозина и не является завершённым деметилированием.</dd></div><div id="ns-g-S8-T62"><dt>R-2-Гидроксиглутарат (R-2-HG, D-2-HG)</dt><dd>Стереоизомер 2-гидроксиглутарата, образующийся, в частности, из α-КГ при неоморфной активности мутантных IDH1/IDH2 с расходом NADPH. Это вещество отличается от α-КГ, а свойства другого изомера, S-2-HG (L-2-HG), на него автоматически не переносятся.</dd></div><div id="ns-g-S8-T63"><dt>Неоморфная активность</dt><dd>Приобретённая в результате мутации способность фермента катализировать реакцию, несвойственную ферменту дикого типа. Для IDH1 R132H это восстановление α-КГ до R-2-HG с расходом NADPH.</dd></div><div id="ns-g-S8-T64"><dt>NADH/NAD⁺</dt><dd>Отношение содержаний восстановленной и окисленной форм никотинамидадениндинуклеотида в одном компартменте. Его указывают для определённого компартмента и для определённых форм (свободных или суммарных); оно не равно доле NADH в пуле и не задаёт размер пула.</dd></div><div id="ns-g-S8-T65"><dt>NADPH/NADP⁺</dt><dd>Отношение содержаний восстановленной и окисленной форм фосфорилированного кофермента. NADPH и NADH различаются набором реакций и ферментов; NADPH используется в восстановительных биосинтезах и в системах защиты от окислителей.</dd></div><div id="ns-g-S8-T66"><dt>Активные формы кислорода (АФК)</dt><dd>Собирательное название реакционноспособных кислородсодержащих частиц, включая супероксид и пероксид водорода. Это группа веществ с разными свойствами, поэтому единой концентрации «АФК» нет.</dd></div><div id="ns-g-S8-T67"><dt>Супероксид-анион-радикал (O₂•⁻)</dt><dd>Продукт одноэлектронного восстановления молекулярного кислорода; имеет неспаренный электрон. Отличается от пероксида водорода, который радикалом не является.</dd></div><div id="ns-g-S8-T68"><dt>Пероксид водорода (H₂O₂)</dt><dd>Нерадикальная активная форма кислорода, участвующая в окислительных реакциях и в регуляции белков. Образуется, например, при дисмутации супероксида.</dd></div><div id="ns-g-S8-T69"><dt>Супероксиддисмутаза (SOD)</dt><dd>Фермент дисмутации супероксида с образованием O₂ и H₂O₂. Образовавшийся H₂O₂ удаляют другие ферменты.</dd></div><div id="ns-g-S8-T70"><dt>Пероксиредоксин (Prx)</dt><dd>Тиолзависимая пероксидаза, восстанавливающая пероксиды за счёт каталитического цистеина; у типичных 2-Cys-пероксиредоксинов окисленный фермент восстанавливается тиоредоксином. В матриксе митохондрий действует, в частности, Prx3; некоторые Prx участвуют в редокс-реле.</dd></div><div id="ns-g-S8-T71"><dt>Тиоредоксиновая система</dt><dd>Система тиоредоксина и тиоредоксинредуктазы, получающая восстановительные эквиваленты от NADPH. Она восстанавливает определённые субстраты, в том числе окисленные пероксиредоксины.</dd></div><div id="ns-g-S8-T72"><dt>Глутатионовая система</dt><dd>Связанные реакции с участием восстановленного (GSH) и окисленного (GSSG) глутатиона и глутатионредуктазы. Глутатионпероксидаза использует GSH, а глутатионредуктаза восстанавливает GSSG за счёт NADPH.</dd></div><div id="ns-g-S8-T73"><dt>Сульфиредоксин (Srx)</dt><dd>Фермент, восстанавливающий за счёт ATP сульфиновую форму каталитического цистеина типичных 2-Cys-пероксиредоксинов. Универсальным восстановителем сульфиновых групп любых белков он не является.</dd></div><div id="ns-g-S8-T74"><dt>Редокс-реле</dt><dd>Передача окислительного эквивалента от первично окисленного белка к определённой белковой мишени, например от Prx2 к STAT3. Это не свободная диффузия окислителя ко всем цистеинам.</dd></div><div id="ns-g-S8-T75"><dt>Окислительный стресс</dt><dd>Нарушение редокс-регуляции и (или) молекулярное повреждение при смещении баланса между окислительными процессами и защитными системами. Его нельзя определить только по наличию H₂O₂ или одному пороговому значению.</dd></div><div id="ns-g-S8-T76"><dt>Обратный перенос электронов (RET)</dt><dd>Перенос электронов от восстановленного Q-пула через комплекс I в обратном направлении при высокой протондвижущей силе. Он сопровождается образованием супероксида на комплексе I (точное место образования обсуждается); электроны при этом могут восстанавливать NAD⁺. Направление противоположно обычному переносу от NADH к Q.</dd></div><div id="ns-g-S8-T77"><dt>PARP</dt><dd>Семейство ферментов, часть которых (при повреждении ДНК — прежде всего PARP1) переносит остатки ADP-рибозы с NAD⁺ на белки, высвобождая никотинамид. Эффекты разных членов семейства не сводятся друг к другу.</dd></div><div id="ns-g-S8-T78"><dt>OCR</dt><dd>Скорость потребления кислорода, рассчитываемая по убыли O₂ в малом объёме среды над клетками во времени (схема M01). Показатель нормируют на число клеток или содержание белка; часть потребления O₂ немитохондриальная, и OCR не равен скорости синтеза ATP.</dd></div><div id="ns-g-S8-T79"><dt>ECAR</dt><dd>Скорость внеклеточного закисления, рассчитываемая по изменению pH среды над клетками во времени (схема M01). Закисление создают лактат, выходящий вместе с протоном, и дыхательный CO₂, гидратирующийся до HCO₃⁻ и H⁺, поэтому ECAR не равна скорости образования лактата.</dd></div><div id="ns-g-S8-T80"><dt>Жидкостная хроматография — масс-спектрометрия (LC–MS)</dt><dd>Сочетание жидкостной хроматографии, разделяющей компоненты смеси по времени удерживания, с масс-спектрометрией, регистрирующей ионы по отношению массы к заряду (схема M03). Количественное определение требует калибровки и внутреннего стандарта; экстракт целых клеток компартменты не разделяет.</dd></div><div id="ns-g-S8-T81"><dt>Иммуноблот</dt><dd>Определение белкового антигена с помощью антител после электрофоретического разделения белков и переноса на мембрану (схема M04). Сигнал антитела к модификации гистона зависит от количества гистона в дорожке, поэтому его сравнивают с сигналом общего гистона.</dd></div><div id="ns-g-S8-T82"><dt>Peredox</dt><dd>Генетически кодируемый флуоресцентный сенсор NADH/NAD⁺ в цитозоле (схема M05). Отклик зависит от обеих форм кофермента; сенсор не измеряет суммарный пул NAD(H). При направлении в матрикс в рассмотренной работе его сигнал не менялся при метаболических воздействиях.</dd></div><div id="ns-g-S8-T83"><dt>HyPer7</dt><dd>Генетически кодируемый флуоресцентный сенсор H₂O₂ (схема M06): его состояние меняется при окислении пероксидом водорода и восстановлении клеточными системами. Показание относится к компартменту, куда направлен сенсор; среди АФК он практически специфичен к H₂O₂ (на органические гидропероксиды отвечает при высоких концентрациях).</dd></div></dl></section></noscript>

iz":"Вопрос","jump_src":"Источники","what_happens":"Что происходит","trap_label":"Типичная ошибка","prev":"← Назад","next":"Следующий шаг →","to_exam":"Перейти к проверке →","progress_label":"Правильные ответы","of":"из","progress_note":"Ответы и маршрут сохраняются в этом браузере.","reset":"Сбросить отметки ответов","exam_stat_label":"Итоговая проверка","exam_tries":"ответов: {n}","done":"пройден","notdone":"не пройден","no_match":"Ничего не найдено.","quiz_eyebrow":"Проверьте понимание","quiz_done_before":"На вопрос этого шага уже был дан верный ответ.","fb_ok":"Верно.","fb_bad":"Ответ неверен.","open_expl":"Открыть объяснение →","static_right":"верный вариант","static_wrong":"неверный вариант","src_summary":"Источники и условия научного вывода","gl_eyebrow":"Слова и измеряемые величины","gl_h1":"Краткий словарь","gl_lead":"Определения помогают читать схемы и формулировать вывод из опыта. Подчёркнутые в тексте шагов термины ведут к этому словарю.","exam_eyebrow":"Проверка без объяснений перед вопросом","exam_h1":"Объясните механизм","exam_lead":"Двенадцать вопросов из разных разделов. После ответа откройте разбор. Если механизм остался непонятен, вернитесь к объяснению.","exam_note":"Это повторение ключевых связей, а не гарантия освоения всей темы. Результаты показаны в оглавлении отдельно и не отмечают шаги пройденными.","all_eyebrow":"Повторение всего объяснения","all_h1":"Все объяснения на одной странице","all_p":"Здесь собраны объяснения всех шагов, вопросы с разбором вариантов и ссылки на практикум. Демонстрации открываются по ссылкам в заголовках. Этот режим удобен для поиска по странице и печати.","print":"Распечатать объяснения","pr_h1":"Практикум: 40 сценариев","pr_p":"Практикум открывается отдельной страницей семинара. Выберите вопрос или откройте весь практикум. Предскажите эффект, откройте результат и сопоставьте его с разбором. Показания рассчитываются по учебным моделям; условия и ограничения указаны в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Этот шаг объединяет материал нескольких вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Метаболические потоки, биосинтез и редокс-состояние","stats":[["4 механизма","от потока углерода к редокс-сигналу"],["Объяснения","с вопросами для самопроверки"],["40 сценариев","в отдельном практикуме"]],"num_fmt":"8.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"Все семинары"},"lessons":[{"id":"carbon-flux","number":1,"section":0,"title":"Чем метаболический поток отличается от содержания метаболита","question":1,"questions":[1],"keywords":["поток","скорость превращения","стационарное состояние","оборот","пул","приток и расход","dN/dt","количество вещества","концентрация"],"lead":["Количество вещества в клетке показывает, сколько его есть в данный момент, а [[T01|метаболический поток]] — сколько вещества превращается за единицу времени.","Два пула одинакового размера могут обновляться с разной скоростью."],"mechanism":["Метаболит образуется в одних реакциях и расходуется в других; изменение его количества равно разности притока и расхода.","В стационарном состоянии приток равен расходу, поэтому количество постоянно, хотя вещество непрерывно превращается.","Чем больше равные друг другу приток и расход, тем быстрее обновляется пул при том же количестве вещества."],"paragraphs":["Метаболит клетки находится в [[T04|метаболическом пуле]]: его молекулы образуются в одних реакциях и расходуются в других. Содержание вещества в пуле выражают как [[T02|количество вещества]] или, если известен объём компартмента, как [[T03|концентрацию]]. Поток — другая величина. Он показывает, сколько вещества проходит через реакцию или путь за единицу времени, и относится к названной реакции и системе; его нормируют, например, на число клеток или массу белка.","Изменение количества одного промежуточного соединения описывает баланс dN/dt = J(вх) − J(вых). Здесь N — количество вещества в пуле, J(вх) — суммарный поток его образования и поступления, J(вых) — суммарный поток его расхода и выхода. Если приток больше расхода, количество растёт, если меньше — снижается.","Особый случай — [[T05|стационарное состояние]]: приток равен расходу, и количество не меняется. Это не значит, что превращений нет. Возьмём две клетки с одинаковым количеством цитрата, например 12 условных единиц. В первой клетке образование и расход цитрата равны 3 условным единицам в минуту, во второй — 6. Количество цитрата в обеих клетках постоянно, но пул второй обновляется вдвое быстрее: среднее время пребывания молекулы в пуле, то есть частное от деления количества на поток, составляет 4 мин в первой клетке и 2 мин во второй.","Поэтому содержание метаболита само по себе не показывает скорость превращения. Оно может не измениться ни при ускорении притока и расхода, ни при их замедлении. В стационарном состоянии количество не меняется, поэтому его изменение о потоке не говорит. Поток оценивают отдельно: по накоплению или убыли вещества после блокирования одной из реакций, по потреблению субстрата в заданной системе или по динамике включения изотопной метки с учётом модели. Доля меченых молекул сама потоком не является (см. шаг про прослеживание происхождения углерода). Если же меняется объём клетки, концентрация может измениться и при неизменном количестве, поэтому каждую величину нужно называть точно."],"trap":["Если количество метаболита не изменилось, его потоки тоже не изменились.","Постоянное количество совместимо с любыми значениями притока и расхода, если они равны. Поток определяют отдельно: по скорости превращения в названной системе."],"conditions":"Схема — расчёт по заданным условным параметрам: единицы потока, количество и время не являются данными опыта и не относятся к реальным клеткам. Различие между содержанием метаболита и потоком изложено в учебнике биохимии (Ленинджер, т. 2) и в обзоре Baker и Rutter (2023); у обзора прочитаны выбранные фрагменты о потоках.","sources":["LNR2","BAKER"],"quiz":{"id":"S8-L01","rev":2,"question":"В двух клетках содержится одинаковое количество цитрата. В первой его образование и расход равны 2, во второй — 8 условным единицам в минуту. Какое различие между клетками следует из этих данных?","options":[{"id":"S8-L01-1","text":"Во второй клетке пул цитрата обновляется быстрее при том же его количестве.","correct":true,"feedback":"Постоянное количество совместимо с разными скоростями образования и расхода."},{"id":"S8-L01-2","text":"Во второй клетке концентрация цитрата выше, так как через пул проходит больше вещества.","correct":false,"feedback":"Количество цитрата в клетках одинаково; концентрация определяется количеством и объёмом, а не потоком через пул."},{"id":"S8-L01-3","text":"В обеих клетках пул обновляется одинаково, так как количество цитрата то же.","correct":false,"feedback":"Количество характеризует состояние, а не скорость превращений: при потоках 2 и 8 пул обновляется с разной скоростью."}]},"widget":{"kind":"pool","title":"","s":{"title":"Один пул при разных притоке и расходе","status":"Расчёт по заданным параметрам · условные единицы","modes_label":"Состояние пула","modes":["Клетка 1: приток и расход по 3","Клетка 2: приток и расход по 6","Приток больше расхода","Расход больше притока"],"sl_in":"Приток J(вх), усл. ед./мин","sl_out":"Расход J(вых), усл. ед./мин","pool":"пул цитрата","in":"приток","out":"расход","dot":"одна точка — одна условная единица количества; жёлтая — прибавилась за 1 мин; пунктирная — убыла за 1 мин","m_n0":"Количество сейчас","m_n1":"Количество через 1 мин","m_d":"Изменение за 1 мин (dN/dt)","m_tau":"Время пребывания N/J","na":"не определено","u_min":"мин","u_au":"усл. ед.","notes":{"steady":"Приток равен расходу: количество цитрата постоянно. Поток при этом ненулевой, и пул обновляется за время пребывания, равное частному от деления количества на поток.","gain":"Приток больше расхода: количество вещества в пуле растёт. Время пребывания N/J здесь не определяется, потому что пул не находится в стационарном состоянии.","loss":"Расход больше притока: количество вещества в пуле снижается. Время пребывания N/J здесь не определяется, потому что пул не находится в стационарном состоянии.","zero":"Приток и расход равны нулю: превращений нет, количество постоянно. Постоянное количество само по себе не позволяет отличить этот случай от стационарного состояния с ненулевым потоком."}}}},{"id":"ldh-nad","number":2,"section":0,"title":"Как образование лактата поддерживает гликолиз","question":1,"questions":[1],"keywords":["ЛДГ","лактатдегидрогеназа","NAD⁺","NADH","регенерация NAD⁺","GAPDH","лактат","гликолиз","пируват"],"lead":["Окислительная реакция гликолиза восстанавливает NAD⁺ до NADH, а реакция лактатдегидрогеназы вновь окисляет NADH, восстанавливая пируват до лактата. Поэтому ЛДГ позволяет гликолизу продолжаться, хотя сама ATP не образует."],"mechanism":["Глицеральдегид-3-фосфатдегидрогеназа окисляет глицеральдегид-3-фосфат и восстанавливает NAD⁺ до NADH.","Лактатдегидрогеназа восстанавливает пируват до лактата за счёт NADH, и NAD⁺ образуется вновь.","Окислительной реакции гликолиза (GAPDH) нужен NAD⁺, а ATP образуется в других реакциях пути."],"paragraphs":["В [[T07|гликолизе]] (здесь — путь от глюкозы до лактата; в узком смысле гликолиз заканчивается пируватом) есть окислительная реакция: глицеральдегид-3-фосфатдегидрогеназа (GAPDH) превращает глицеральдегид-3-фосфат в 1,3-бисфосфоглицерат и переносит электроны на NAD⁺. Кофермент восстанавливается до NADH. Если NADH не окисляется вновь, количество свободного NAD⁺ уменьшается, и эта реакция замедляется. Поэтому гликолизу нужна [[T12|регенерация NAD⁺]]: образование окисленной формы из восстановленной. Новых молекул NAD при этом не появляется, уже имеющиеся лишь возвращаются в окисленную форму.","Один из способов регенерации — реакция [[T11|лактатдегидрогеназы]] (ЛДГ): пируват + NADH + H⁺ ⇄ лактат + NAD⁺. Пируват принимает электроны и превращается в [[T10|лактат]], а NADH окисляется. Образовавшийся NAD⁺ снова доступен для GAPDH, и гликолиз продолжается без участия митохондрий. Стрелки на схеме показывают оборот кофермента: NAD⁺ восстанавливается в одной реакции и вновь образуется в другой, а углеродная цепь идёт отдельным путём от глицеральдегид-3-фосфата к пирувату и лактату. Гликолиз до лактата окислительно-восстановительно нейтрален: NADH, образованный в GAPDH, окисляется в реакции ЛДГ, поэтому образование лактата само по себе не создаёт дополнительного NAD⁺ для других окислительных синтезов (шаг про аспартат).","Реакции ЛДГ не следует приписывать синтез ATP. ATP образуется в гликолизе при [[T13|субстратном фосфорилировании]]: фосфорильная группа переносится с метаболита на ADP, как в реакциях фосфоглицераткиназы и пируваткиназы. В реакции ЛДГ такого переноса нет. Реакция ЛДГ лишь поддерживает содержание NAD⁺, необходимое для окислительной реакции GAPDH. Если NAD⁺ не регенерируется ни в реакции ЛДГ, ни челночными системами, не идут и следующие за GAPDH реакции с образованием ATP.","Реакция ЛДГ обратима: фермент ускоряет приближение к [[T06|химическому равновесию]], но не задаёт его положения. Направление чистого потока определяют концентрации пирувата, лактата, NADH и NAD⁺ и значение pH. В клетках, где митохондрии быстро окисляют NADH и пируват, реакция ЛДГ может идти в обратном направлении, и лактат становится источником пирувата. Поэтому образование лактата зависит от баланса этих процессов, а не от свойств одного фермента."],"trap":["Лактат образуется потому, что реакция ЛДГ сама даёт ATP.","ATP при восстановлении пирувата до лактата не синтезируется. Реакция окисляет NADH до NAD⁺; ATP образуется в других реакциях гликолиза, а NAD⁺ нужен окислительной реакции GAPDH, которая поставляет для них субстрат."],"conditions":"Схема показывает механизм без концентраций. Связь регенерации NAD⁺ с продолжением гликолиза рассмотрена в работе Luengo и соавт. (2021) на пролиферирующих клетках; стехиометрия реакций GAPDH и ЛДГ приведена по учебнику Ленинджера (т. 2).","sources":["LNR2","LUENGO"],"quiz":{"id":"S8-L02","rev":2,"question":"Передача электронов NADH в митохондрии ограничена, но ЛДГ активна и пируват доступен. Что обеспечивает реакция ЛДГ для окислительной реакции гликолиза в этих условиях?","options":[{"id":"S8-L02-2","text":"Образует ATP из ADP при восстановлении пирувата до лактата.","correct":false,"feedback":"В реакции ЛДГ переноса фосфорильной группы на ADP нет."},{"id":"S8-L02-3","text":"Образует дополнительный NADH, который нужен для реакции GAPDH.","correct":false,"feedback":"При восстановлении пирувата NADH расходуется, а NAD⁺ образуется."},{"id":"S8-L02-1","text":"Окисляет NADH и тем самым возвращает NAD⁺ для реакции GAPDH.","correct":true,"feedback":"NAD⁺ вновь используется глицеральдегид-3-фосфатдегидрогеназой."}]},"widget":{"kind":"net","title":"","s":{"title":"Оборот NAD⁺ в гликолизе","status":"Схема механизма · качественные состояния","ctrls":[{"id":"ldh","type":"group","label":"Лактатдегидрогеназа","opts":["активна","подавлена"]},{"id":"mito","type":"group","label":"Передача электронов NADH в митохондрии","opts":["возможна","ограничена"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":288,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,432]}],"mem":[],"nodes":{"gap":{"p":[84,66,150,46],"t":"глицеральдегид-\n3-фосфат","n":[100,58,158,46],"fs":13},"bpg":{"p":[266,66,130,46],"t":"1,3-бисфосфо-\nглицерат","n":[100,132,158,46],"fs":13},"pyr":{"p":[436,66,90,40],"t":"пируват","n":[100,205,100,40]},"lac":{"p":[574,66,90,40],"t":"лактат","n":[100,275,100,40]},"nad":{"p":[160,222,90,38],"t":"NAD⁺","n":[240,80,80,36]},"nadh":{"p":[500,222,90,38],"t":"NADH","n":[240,262,80,36]}},"edges":{"g1":{"a":"gap","b":"bpg","k":"rx","t":"GAPDH","d":[0,-10],"dn":[36,0]},"g2":{"a":"bpg","b":"pyr","k":"rx","t":"ряд реакций","d":[0,-10],"dn":[46,0],"dash":true},"g3":{"a":"pyr","b":"lac","k":"rx","t":"ЛДГ","d":[0,-10],"dn":[36,0]},"c1":{"a":"nad","b":"nadh","k":"rx","t":"восстановление NAD⁺","tn":"восстановление","d":[0,-10],"dn":[-52,0]},"c2":{"a":"nadh","b":"nad","k":"rx","t":"окисление NADH","tn":"окисление","d":[0,36],"dn":[60,0],"bend":-34,"bn":55}},"st":{"0-0":{"n":{"gap":"on","bpg":"base","pyr":"base","lac":"met","nad":"on","nadh":"base"},"m":[["Окисление NADH","идёт двумя путями"],["Доступность NAD⁺","поддерживается"],["Реакция GAPDH","идёт"]],"note":"NADH окисляется и в реакции ЛДГ, и челночными системами, передающими его электроны в митохондрии. NAD⁺ доступен, и GAPDH продолжает работать."},"0-1":{"n":{"gap":"on","bpg":"base","pyr":"base","lac":"met","nad":"on","nadh":"base"},"m":[["Окисление NADH","в реакции ЛДГ"],["Доступность NAD⁺","поддерживается"],["Реакция GAPDH","идёт"]],"note":"Передача электронов NADH в митохондрии ограничена, но ЛДГ активна: пируват принимает электроны, образуется лактат, и NAD⁺ возвращается в оборот. Гликолиз продолжается."},"1-0":{"n":{"gap":"on","lac":"off","pyr":"base","nad":"base","nadh":"base"},"e":{"g3":"off"},"m":[["Окисление NADH","челночными системами"],["Доступность NAD⁺","зависит от челноков"],["Реакция GAPDH","идёт"]],"note":"Без ЛДГ лактат не образуется, и NAD⁺ в цитозоле регенерируется в основном челночными системами, передающими электроны NADH в митохондрии. Если этого пути достаточно, гликолиз продолжается, и пируват может окисляться.","et":{"c2":"окисление челноками"}},"1-1":{"n":{"gap":"off","bpg":"off","lac":"off","pyr":"off","nad":"off","nadh":"on"},"e":{"g3":"off","g1":"off","g2":"off","c1":"off","c2":"off"},"m":[["Окисление NADH","ограничено"],["Доступность NAD⁺","снижена"],["Реакция GAPDH","замедлена"]],"note":"Ни ЛДГ, ни челночные системы не окисляют NADH. NAD⁺ превращается в NADH и не образуется вновь, GAPDH замедляется, и гликолиз ограничивается нехваткой окисленного кофермента."}}}}},{"id":"aerobic-glycolysis","number":3,"section":0,"title":"Почему лактат образуется в присутствии кислорода","question":1,"questions":[1],"keywords":["аэробный гликолиз","эффект Варбурга","гипоксия","лактат","кислород","дыхание","тимоциты"],"lead":["[[T08|Аэробный гликолиз]] — образование лактата из глюкозы при достаточном содержании кислорода.","Он отличается от усиления образования лактата при гипоксии и не исключает работы митохондрий."],"mechanism":["При достаточном O₂ дыхательная цепь может работать, но часть пирувата всё равно восстанавливается до лактата.","При ограничении O₂ дыхание снижается, и образование лактата усиливается по другой причине.","Образование лактата и потребление O₂ в одной клетке могут идти одновременно."],"paragraphs":["Лактат обычно связывают с недостатком кислорода. При [[T09|гипоксии]] дыхательная цепь окисляет NADH хуже, поэтому гликолиз и образование лактата усиливаются; к этому добавляется HIF-зависимое торможение PDH через киназу PDK1: окисление пирувата в митохондриях снижается, и больше пирувата восстанавливается до лактата (Kim и соавт., 2006). Однако многие делящиеся клетки образуют много лактата и при достаточном содержании кислорода. Такое состояние называют аэробным гликолизом, а когда его описывают для опухолевых клеток, говорят об эффекте Варбурга.","Различают три состояния. В первом кислород доступен, лактата образуется немного, и значительная часть пиру
