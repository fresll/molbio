 какая машина изменена: слияние или деление</h2><p class="lead">Морфологию, процесс, состояние белков и функцию измеряют отдельно: это разные величины. Восстановление формы вмешательством в противоположную машину — <a href="#ns-g-S2-T49">компенсация</a>, а не доказательство причины.</p><ol class="mech"><li>Процесс измеряют прямо: число событий слияния и деления при прижизненной съёмке и обмен <a href="#ns-g-S2-T41">матриксным маркером</a> между органеллами.</li><li>Состояние машин показывают соотношение длинной и короткой форм OPA1 на блоте и количество DRP1 на наружной мембране.</li><li>Функцию измеряют отдельно: <a href="#ns-g-S2-T40">TMRM</a> — потенциал (состояние мембраны), потребление кислорода — поток.</li></ol><p>Морфология сети чувствительна ко многим воздействиям, в том числе к условиям съёмки и фиксации, а одна и та же фрагментация совместима с разными механизмами. Поэтому вывод начинают с прямого измерения процессов. При прижизненной съёмке считают события слияния и деления на органеллу или на клетку в минуту: в эмбриональных фибробластах без DRP1 частота делений оказалась в 17 раз ниже, чем в норме (Wakabayashi 2009). Обмен содержимым измеряют матриксным фотоактивируемым GFP: его активируют светом в части сети и следят, как флуоресценция распространяется на другие органеллы; без слияния она остаётся в исходных органеллах (Anand 2014).</p><p>Состояние машин оценивают по белкам. На вестерн-блоте видно соотношение длинной и короткой форм OPA1: при потере потенциала почти вся длинная форма исчезает. Для DRP1 важно не общее количество в лизате, а доля на наружной мембране — её оценивают по скоплениям DRP1 на митохондриях при иммунофлуоресценции или по митохондриальной фракции. Функцию измеряют отдельно: TMRM показывает мембранный потенциал, то есть состояние мембраны, а потребление кислорода — поток. После CCCP потенциал падает, а потребление кислорода при оптимальной концентрации протонофора, достаточном количестве субстратов и наличии дыхательного резерва растёт: эти величины нельзя подменять друг другом. Избыток протонофора дыхание подавляет (условия разобраны в семинаре 1).</p><p>Наконец, нужно различать два вида восстановления фенотипа. Возвращение удалённого белка дикого типа поддерживает вывод о механизме, если возвращается само измеряемое событие, а количество и локализация белка сопоставимы с нормой. Вмешательство в противоположную машину — например, подавление DRP1 при ослабленном слиянии — восстанавливает форму сети, но не слияние: это компенсация фенотипа. Поэтому восстановление формы обходным путём не указывает исходную причину; различать нужно, вернулось ли измеряемое событие.</p><p>Переключайте схемы методов: для каждого показано, что именно он измеряет и чего не измеряет.</p><div class="note trap"><strong>Типичная ошибка</strong> Если подавление DRP1 устранило фрагментацию, значит, причиной фрагментации было усиленное деление.<p class="trap-fix">Подавление деления устраняет фрагментацию при любой причине, в том числе при ослабленном слиянии. Это компенсация; о причине судят по измерению самих событий слияния и деления.</p></div><div class="static-quiz"><h3>В двух линиях клеток сеть митохондрий фрагментирована одинаково. Какое измерение покажет, в какой из них подавлено слияние, а в какой усилено деление?</h3><ol><li><b>А.</b> Средняя длина митохондрий на фотографиях <i>(неверный вариант)</i><br><span class="expl">По условию форма сети одинакова, а она совместима с обоими механизмами. Нужно измерять сами события, а не их результат.</span></li><li><b>Б.</b> Общее количество DRP1 в лизате клеток <i>(неверный вариант)</i><br><span class="expl">Общее количество DRP1 не показывает, сколько её на мембране и как часто идут деления; о слиянии оно не говорит ничего.</span></li><li><b>В.</b> Обмен матриксным маркером и частота событий <i>(верный вариант)</i><br><span class="expl">При подавленном слиянии матриксный маркер распространяется медленнее и событий слияния меньше; при усиленном делении слияние идёт и событий в целом больше.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-2.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200903065">Wakabayashi J. et al. 2009. The dynamin-related GTPase Drp1 is required for embryonic and brain development in mice. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.201308006">Anand R. et al. 2014. The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and fission. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200704110">Song Z. et al. 2007. OPA1 processing controls mitochondrial fusion and is regulated by mRNA splicing, membrane potential, and Yme1L. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200906083">Head B. et al. 2009. Inducible proteolytic inactivation of OPA1 mediated by the OMA1 protease in mammalian cells. J Cell Biol</a></li><li><a href="https://doi.org/10.1038/s42255-023-00783-1">Monzel A. S., Enríquez J. A., Picard M. 2023. Multifaceted mitochondria: moving mitochondrial science beyond function and dysfunction. Nat Metab</a></li></ul><p>Схемы методов. Частота делений в клетках Drp1⁻/⁻ — эмбриональные фибробласты мыши, съёмка матриксного GFP (Wakabayashi 2009); обмен матриксным PA-GFP — фибробласты мыши, активировано около 23 % сети, наблюдение 60 мин (Anand 2014); формы OPA1 при потере потенциала — Song 2007 (клетки без OPA1 с отдельными формами OPA1 человека, 20 мкМ CCCP, 4 ч) и Head 2009 (клетки HeLa, 10 мкМ CCCP, 30 мин); ложные выводы из морфологии — учебный разбор. Числа на схемах — учебные.</p></details></article><article class="card print-unit" id="ns-condensate"><div class="eyebrow">Конденсаты · шаг 15 из 30</div><h2>Чем компартмент без мембраны отличается от мембранного</h2><p class="lead">В цитоплазме и ядре есть структуры с устойчивым составом, но без мембраны: ядрышко, ядерные спеклы, стресс-гранулы. Их называют <a href="#ns-g-S2-T50">биомолекулярными конденсатами</a>: белки и нуклеиновые кислоты в них локально обогащены, хотя ограничивающей липидной мембраны нет; если сборка возникает путём фазового разделения, её граница — это граница между плотной и разбавленной фазами.</p><ol class="mech"><li>Белки и РНК конденсата удерживаются вместе множеством слабых контактов, а не липидной мембраной.</li><li>В жидкоподобном конденсате молекулы непрерывно переходят между плотной фазой и окружением; мембраны с насосами и переносчиками нет, а состав избирательно задают взаимодействия молекул между собой.</li><li>Быстрый обмен молекул не означает короткой жизни структуры: ядрышко существует всю интерфазу.</li></ol><p>Долгое время ядрышко, ядерные спеклы, тельца Кахаля и цитоплазматические гранулы оставались морфологическими объектами. Их называли по-разному — РНК-гранулами, рибонуклеопротеиновыми тельцами, безмембранными (немембранными) органеллами (Горшенева 2024), — видели в микроскопе, но не понимали, что удерживает эти структуры вместе. Перелом наступил, когда P-гранулы зародыша нематоды повели себя как капли жидкости: они были округлыми, сливались при соприкосновении, деформировались потоком и снова собирались (Brangwynne 2009). Сегодня к конденсатам относят десятки структур, среди них параспеклы и PML-тельца в ядре, P-тельца и транспортные РНК-гранулы нейронов в цитоплазме, кластеры нефрина и других мембранных рецепторов у плазматической мембраны (Горшенева 2024, таблица).</p><p>Биомолекулярный конденсат — компартмент без липидной мембраны, в котором белки и нуклеиновые кислоты локально обогащены по сравнению с окружением. Термин предложили Banani и соавторы (2017); в русской литературе употребляют и краткую форму «биоконденсат» (Горшенева 2024). Такое определение описывает наблюдаемое обогащение, а не механизм: <a href="#ns-g-S2-T51">фазовое разделение</a> жидкость — жидкость — лишь один из возможных механизмов сборки, и его нужно доказывать отдельно. Материальное состояние конденсата — жидкость, гель или твёрдоподобная сборка — третья, независимая характеристика (Banani 2017; Mittag 2022). В части литературы слово «конденсат» употребляют уже — только для обратимых сборок, возникших путём фазового разделения, и противопоставляют им агрегаты по строению (Горшенева 2024, рис. 4); в этом семинаре принято широкое описательное определение.</p><p>Сравним конденсат с мембранным компартментом. Собственный состав есть у обоих, а плотность, ионный состав и другие физико-химические свойства конденсата могут отличаться от окружающей среды. При фазовом разделении возникает граница сосуществующих фаз. Ограничивающей мембраны с насосами и переносчиками у конденсата нет, но состав его избирателен: одни молекулы преимущественно включаются в конденсат, другие исключаются из него; так, полностью собранные рибонуклеопротеиновые частицы вытесняются из ядрышка (Riback 2020). Избирательность задают взаимодействия молекул между собой.</p><p>Свойства конденсата удобно описывать тремя разными временами. Отдельные молекулы обмениваются с окружением за секунды, структура собирается или разбирается при изменении условий за секунды или минуты, а сама структура может существовать долго: ядрышко — всю интерфазу, стресс-гранула — десятки минут. Переключите варианты на схеме и сравните эти три времени у разных компартментов.</p><div class="note trap"><strong>Типичная ошибка</strong> Если молекулы конденсата обмениваются с окружением за секунды, сам конденсат существует лишь секунды.<p class="trap-fix">Обмен отдельных молекул и срок существования структуры — разные величины. Ядрышко обменивается белками за секунды и минуты, но существует всю интерфазу.</p></div><div class="static-quiz"><h3>Белки ядрышка обмениваются с нуклеоплазмой за десятки секунд. Как долго существует само ядрышко в интерфазной клетке?</h3><ol><li><b>А.</b> Десятки секунд, как и обмен его белков <i>(неверный вариант)</i><br><span class="expl">Время обмена отдельных молекул не равно сроку существования структуры. Молекулы непрерывно обмениваются с окружением, а ядрышко как целое сохраняется.</span></li><li><b>Б.</b> Всю интерфазу, хотя его белки обновляются <i>(верный вариант)</i><br><span class="expl">Ядрышко существует, пока идёт транскрипция рибосомной РНК, то есть всю интерфазу; его отдельные молекулы при этом непрерывно обмениваются с окружением.</span></li><li><b>В.</b> Десятки минут, как стресс-гранула <i>(неверный вариант)</i><br><span class="expl">Ядрышко не временная реакция на воздействие, а постоянная структура интерфазного ядра. Короткоживущие конденсаты, например стресс-гранулы, исчезают после снятия стресса.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1172046">Brangwynne C. P. et al. 2009. Germline P granules are liquid droplets that localize by controlled dissolution/condensation. Science</a></li><li><a href="https://doi.org/10.1038/nrm.2017.7">Banani S. F. et al. 2017. Biomolecular condensates: organizers of cellular biochemistry. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.018">Mittag T., Pappu R. V. 2022. A conceptual framework for understanding phase separation and addressing open questions and challenges. Mol Cell</a></li><li><a href="https://doi.org/10.1038/s41580-020-0272-6">Lafontaine D. L. J. et al. 2021. The nucleolus as a multiphase liquid condensate. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41586-020-2256-2">Riback J. A. et al. 2020. Composition-dependent thermodynamics of intracellular phase separation. Nature</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Сравнение по обзорам Banani 2017, Mittag 2022, Lafontaine 2021, Горшенева 2024 (с. 398–408); избирательное исключение собранных частиц из ядрышка — Riback 2020 (клетки человека); P-гранулы — Brangwynne 2009, зародыш C. elegans. Времена в таблице — порядок величин из этих работ, а не измерение одного эксперимента.</p></details></article><article class="card print-unit" id="ns-multivalency"><div class="eyebrow">Конденсаты · шаг 16 из 30</div><h2>Почему множество слабых контактов собирает молекулы в сеть</h2><p class="lead">Конденсат удерживают многие слабые контакты; устойчивость сборки зависит и от их числа, и от силы отдельных взаимодействий. Для этого молекулы должны быть <a href="#ns-g-S2-T52">мультивалентными</a> — иметь несколько участков связывания.</p><ol class="mech"><li>Молекула с одним участком связывания образует с партнёром только пару; с двумя — цепочки; с тремя и более — разветвлённую сеть.</li><li>Чем больше участков связывания, тем при меньшей концентрации возникает сеть, захватывающая много молекул.</li><li>Мультивалентность белка создают повторы доменов или несколько взаимодействующих участков <a href="#ns-g-S2-T53">внутренне неупорядоченной области</a>; РНК тоже может связывать несколько партнёров и входить в сеть.</li></ol><p>Решающий модельный эксперимент поставили Li и соавторы (2012). Они собрали два искусственных белка: один из нескольких повторов SH3-домена, другой из стольких же пролиновых мотивов, с которыми SH3 связывается. Каждый отдельный контакт слаб: константа диссоциации около 350 мкМ. При смешивании выше определённой концентрации раствор мутнел, и в микроскопе появлялись капли диаметром от микрометра до десятков микрометров, сливавшиеся друг с другом. В каплях белки были концентрированы примерно в сто раз.</p><p>Порог зависел от валентности: чем больше модулей в молекулах, тем ниже концентрация, при которой появлялись капли. Моновалентный лиганд PRM(H)₁, связывающий SH3 значительно прочнее обычного мотива (константа диссоциации около 10 мкМ), в концентрации 1 мМ препятствовал образованию капель, а обычный одиночный мотив PRM₁ в той же концентрации — нет: важна и сила связывания конкурента. Мультивалентное связывание позволяет молекулам образовывать крупные разветвлённые ассоциаты. Но возникновение связной сети и разделение раствора на фазы — разные переходы: сеть может образоваться и без выделения плотной фазы. В экспериментах Li 2012 образование сети сопровождалось разделением фаз; насколько эти переходы связаны, зависит и от свойств спейсеров — участков, соединяющих модули (Harmon 2017; Горшенева 2024).</p><p>В природных конденсатах мультивалентность создают повторы доменов межбелкового взаимодействия (например, SH3-доменов белка Nck), протяжённые неупорядоченные области белков (IDR), в том числе домены низкой сложности, а также РНК-связывающие домены вместе с самой РНК (Горшенева 2024). В доменах низкой сложности преобладают немногие аминокислоты, например глицин, пролин, глутамин. Взаимодействия таких молекул описывает модель «липких участков и спейсеров». Липкие участки соединяют молекулы между собой: это могут быть целые модули, как SH3-домены и пролиновые мотивы в эксперименте Li 2012, или отдельные остатки — например, тирозин и фенилаланин, вступающие в катион-π-взаимодействия с аргинином. Спейсеры расположены между липкими участками, и от их взаимодействия с растворителем зависит, сопровождается ли образование сети разделением фаз (Harmon 2017).</p><p>IDR при этом не обязательна и не достаточна: сеть образуют и глобулярные домены, как в эксперименте с SH3, а многие белки с обширными IDR конденсатов не образуют. Последовательность IDR важна: от распределения заряженных и ароматических остатков зависят и склонность к конденсации, и свойства фазы (Holehouse 2024). По типу партнёров различают гомотипические взаимодействия — между молекулами одного вида, например FUS с FUS, — и гетеротипические — между молекулами разных видов: белка с другим белком или с РНК (Горшенева 2024). Контакты SH3-доменов с пролиновыми мотивами в эксперименте Li 2012 гетеротипические. В ядрышке, тельцах Кахаля, стресс-гранулах и P-тельцах клеток человека, которые состоят из многих белков и РНК, преобладают гетеротипические взаимодействия (Riback 2020).</p><p>Переключите число модулей на схеме и посмотрите, какие ассоциаты образуются и как меняется порог.</p><div class="note trap"><strong>Типичная ошибка</strong> Если у белка есть протяжённая неупорядоченная область, он обязательно образует конденсат.<p class="trap-fix">IDR облегчает образование множественных слабых контактов, но не гарантирует его: многие белки с IDR конденсатов не образуют, а сеть могут создавать и глобулярные мультивалентные домены.</p></div><div class="static-quiz"><h3>Мысленный эксперимент: к раствору белков SH3₅ и PRM₅, образующих капли, добавили большой избыток одиночного пролинового мотива PRM(H)₁, который связывает SH3 прочнее обычного (константа диссоциации около 10 мкМ). Что произойдёт с каплями?</h3><ol><li><b>А.</b> Капли растворятся: участки связывания будут заняты <i>(верный вариант)</i><br><span class="expl">Одиночный мотив занимает SH3-домены, но не соединяет молекулы между собой. Число связей в сети падает, и в этом мысленном эксперименте капли растворяются. В работе Li 2012 PRM(H)₁ в концентрации 1 мМ не давал каплям образоваться (по фазовым диаграммам другой пары белков, SH3₅ и PRM(N-WASP)₈); растворение готовых капель там не показано.</span></li><li><b>Б.</b> Капли укрупнятся: в сеть войдут новые молекулы <i>(неверный вариант)</i><br><span class="expl">Одиночный мотив имеет один участок связывания и не может соединить две молекулы. Он не достраивает сеть, а разрывает её.</span></li><li><b>В.</b> Капли не изменятся: каждый контакт слишком слабый <i>(неверный вариант)</i><br><span class="expl">Слабость исходных контактов не защищает сеть от прочного конкурента. PRM(H)₁ связывает SH3 прочнее обычного мотива и при большом избытке занимает участки, через которые соединяются молекулы каркаса; система оказывается ниже порога. А слабый одиночный мотив PRM₁ в той же концентрации образованию капель не мешал (Li 2012): важна сила связывания конкурента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature10879">Li P. et al. 2012. Phase transitions in the assembly of multivalent signalling proteins. Nature</a></li><li><a href="https://doi.org/10.7554/eLife.30294">Harmon T. S., Holehouse A. S., Rosen M. K., Pappu R. V. 2017. Intrinsically disordered linkers determine the interplay between phase separation and gelation in multivalent proteins. eLife</a></li><li><a href="https://doi.org/10.1038/s41580-023-00673-0">Holehouse A. S., Kragelund B. B. 2024. The molecular basis for cellular function of intrinsically disordered protein regions. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nrm.2017.7">Banani S. F. et al. 2017. Biomolecular condensates: organizers of cellular biochemistry. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41586-020-2256-2">Riback J. A. et al. 2020. Composition-dependent thermodynamics of intracellular phase separation. Nature</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Li 2012 — очищенные белки SH3ₙ и PRMₙ (n = 1–5) in vitro, а также их коэкспрессия в клетках HeLa; конкуренты — приложение, рис. S8: фазовые диаграммы SH3₅ и PRM(N-WASP)₈ без конкурента и с 1 мМ PRM(H)₁ или PRM₁; сеть и фаза как разные переходы, роль спейсеров — Harmon 2017 (компьютерное моделирование и теория ассоциативных полимеров); источники мультивалентности, модель липких участков и спейсеров, гомо- и гетеротипические взаимодействия — обзор Горшенева 2024 (с. 409–411); преобладание гетеротипических взаимодействий — Riback 2020 (ядрышко, тельца Кахаля, стресс-гранулы и P-тельца клеток человека); IDR — обзор Holehouse 2024. Пороги на схеме — учебная модель практикума (вопрос 3, базовый уровень), а не числа из работы Li 2012.</p></details></article><article class="card print-unit" id="ns-threshold"><div class="eyebrow">Конденсаты · шаг 17 из 30</div><h2>Что такое концентрация насыщения и почему сборка конденсата носит пороговый характер</h2><p class="lead">Ниже <a href="#ns-g-S2-T55">концентрации насыщения</a> каркасный белок существует только в растворе; выше избыток уходит в плотную фазу. Существование порога превращает сборку конденсата в переключатель: малое изменение концентрации вблизи порога меняет состояние системы.</p><ol class="mech"><li>При любой концентрации каркасного белка ниже порога капель нет.</li><li>Выше порога концентрация в разбавленной фазе в идеальном случае остаётся равной порогу, а весь избыток уходит в <a href="#ns-g-S2-T56">плотную фазу</a>.</li><li><a href="#ns-g-S2-T54">Белки-клиенты</a> распределяются в готовую плотную фазу, но для её образования не нужны.</li></ol><p>Состав конденсата задаётся асимметрично. Различают каркасные белки и белки-клиенты (Горшенева 2024). Каркасные белки — мультивалентные молекулы, контакты между которыми образуют сеть; без них конденсата нет. Белки-клиенты связываются с каркасом и накапливаются в конденсате, но их удаление меняет лишь состав, а не существование структуры. Каркасом может служить и РНК: длинная некодирующая РНК NEAT1 служит структурной основой параспеклов (Горшенева 2024).</p><p>В простейшем случае — один каркасный компонент в растворителе или два партнёра в неизменном соотношении, которые приближённо рассматривают как один компонент, — поведение системы описывает <a href="#ns-g-S2-T57">правило рычага</a>. Пока общая концентрация ниже концентрации насыщения, раствор однороден. Как только она превышает порог, однородный раствор разделяется на две фазы: разбавленную, концентрация в которой равна порогу, и плотную, где белок концентрирован во много раз сильнее. Фазы сосуществуют и обмениваются молекулами, но не смешиваются. Каждая новая молекула сверх порога уходит в плотную фазу, поэтому растёт объём капель, а не концентрация вокруг них.</p><p>Отсюда следует неочевидное: капли могут занимать около процента объёма и при этом содержать половину молекул белка, если в них белок концентрирован в сто раз. Долю объёма и долю молекул нельзя путать.</p><p>Реальная клетка сложнее идеального случая. Когда компонентов много, концентрация в разбавленной фазе не остаётся строго постоянной, а состав плотной фазы зависит от концентраций всех участников (Riback 2020). Поэтому порог — свойство конкретного набора компонентов, а не одного белка. Двигайте ползунок концентрации на схеме и сравните кривую с прямой, которая была бы без фазового разделения.</p><div class="note trap"><strong>Типичная ошибка</strong> Если концентрация белка вне капель растёт вместе с его общим количеством, фазового разделения нет.<p class="trap-fix">Постоянная концентрация вне капель — свойство идеальной системы из одного каркасного компонента и растворителя. В многокомпонентных конденсатах клетки концентрация насыщения может не быть постоянной: у ядрышка и других исследованных конденсатов клеток человека концентрация вне капель росла вместе с общим количеством белка (Riback 2020). Поэтому отсутствие плато само по себе фазового разделения не исключает.</p></div><div class="static-quiz"><h3>Порог для каркасного белка — 60 мкМ. Его общую концентрацию подняли со 100 до 200 мкМ. Как изменится концентрация белка в разбавленной фазе в идеальной модели?</h3><ol><li><b>А.</b> Удвоится вместе с общей концентрацией <i>(неверный вариант)</i><br><span class="expl">Так было бы без фазового разделения. Выше порога избыток уходит в капли, и раствор вокруг них остаётся насыщенным.</span></li><li><b>Б.</b> Останется равной порогу, 60 мкМ <i>(верный вариант)</i><br><span class="expl">В идеальной модели с одним эффективным каркасным компонентом разбавленная фаза насыщена, её концентрация равна порогу; прибавка белка увеличивает объём плотной фазы.</span></li><li><b>В.</b> Упадёт до нуля: весь белок уйдёт в капли <i>(неверный вариант)</i><br><span class="expl">Капли находятся в равновесии с насыщенным раствором: вне капель остаётся белок в концентрации порога.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature10879">Li P. et al. 2012. Phase transitions in the assembly of multivalent signalling proteins. Nature</a></li><li><a href="https://doi.org/10.1038/s41586-020-2256-2">Riback J. A. et al. 2020. Composition-dependent thermodynamics of intracellular phase separation. Nature</a></li><li><a href="https://doi.org/10.1016/j.molcel.2022.05.018">Mittag T., Pappu R. V. 2022. A conceptual framework for understanding phase separation and addressing open questions and challenges. Mol Cell</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Идеальная модель с одним эффективным каркасным компонентом: смесь двух партнёров 1 : 1 рассматривается как один компонент (правило рычага); числа — учебная модель практикума (вопрос 3, базовый уровень): пороги 120, 60 и 30 мкМ для 3, 4 и 5 модулей, обогащение плотной фазы в 100 раз (порядок данных Li 2012). Отклонение от идеального поведения в клетке — Riback 2020 (ядрышко и другие конденсаты клеток человека); каркасные белки и белки-клиенты, структурная роль РНК NEAT1, сосуществующие фазы — обзор Горшенева 2024 (с. 398, 409, 412).</p></details></article><article class="card print-unit" id="ns-regulation"><div class="eyebrow">Конденсаты · шаг 18 из 30</div><h2>Что сдвигает порог сборки конденсата</h2><p class="lead">Порог зависит от концентрации компонентов, силы контактов между ними и свойств растворителя. В клетке все три величины меняются: модифицируются белки, меняются количество РНК и плотность цитоплазмы.</p><ol class="mech"><li>Фосфорилирование меняет заряд неупорядоченной области и набор её контактов; оно может и растворять конденсат, и создавать его.</li><li>Действие РНК зависит от её отношения к белку: при низком отношении РНК соединяет молекулы белка и способствует сборке, при высоком — препятствует ей.</li><li>Плотность цитоплазмы, ионная сила и pH меняют силу слабых контактов и сдвигают порог.</li></ol><p>Знак действия фосфорилирования заранее не задан. Фосфорилирование карбоксиконцевого домена РНК-полимеразы II киназой CDK7 растворяет его капли in vitro (Boehning 2018), а в клетке переводит полимеразу из конденсатов с медиатором в конденсаты с факторами сплайсинга (Guo 2019). Фосфорилирование тирозинов нефрина, напротив, создаёт участки связывания для адаптера Nck; через N-WASP возникает мультивалентная сеть, и на мембране появляются домены, которых без фосфорилирования нет (Li 2012; Kim 2019). Модификация меняет весь ансамбль слабых контактов сразу, поэтому изменение нескольких остатков переключает состояние целой структуры.</p><p>РНК несёт много участков связывания, но знак её действия зависит от соотношения с белком. При низком отношении РНК к белку она соединяет молекулы белка и способствует образованию капель; при высоком белок связывается в отдельные растворимые комплексы с РНК, и капли не образуются или растворяются (Banerjee 2017; Maharana 2018). Так, высокая концентрация РНК в ядре поддерживает растворимость РНК-связывающих белков FUS и TDP-43, а в цитоплазме, где РНК меньше, они легче образуют конденсаты (Maharana 2018). Поэтому количество РНК в компартменте — регулятор фазового состояния, а не только субстрат.</p><p>Порог зависит и от растворителя. Delarue и соавторы (2018) показали, что подавление пути mTORC1 снижает концентрацию рибосом в цитоплазме дрожжей и клеток человека; от этого более чем вдвое возрастает эффективная подвижность частиц диаметром 20 нм и более и меняется склонность белков к фазовому разделению. При снижении pH остатки гистидина протонируются, а повышение ионной силы ослабляет электростатические контакты.</p><p>Переключите воздействия на схеме: видно, в какую сторону сдвигается порог и что происходит с каплями при той же концентрации каркаса.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование всегда растворяет конденсаты, потому что добавляет отрицательный заряд.<p class="trap-fix">Знак действия зависит от того, какие контакты меняются: фосфорилирование CTD РНК-полимеразы II растворяет его капли, а фосфорилирование нефрина создаёт участки связывания и вызывает сборку.</p></div><div class="static-quiz"><h3>В клетках подавили путь mTORC1, и концентрация рибосом в цитоплазме снизилась. Как это может изменить склонность белков к фазовому разделению?</h3><ol><li><b>А.</b> Никак: рибосомы не входят в состав конденсатов <i>(неверный вариант)</i><br><span class="expl">Рибосомы влияют не как компоненты, а как часть плотно заполненного объёма цитоплазмы: от их концентрации зависят подвижность крупных частиц и порог фазового разделения.</span></li><li><b>Б.</b> Изменит: меняется плотность заполнения цитоплазмы <i>(верный вариант)</i><br><span class="expl">Рибосомы занимают значительную часть объёма цитоплазмы. Снижение их концентрации меняет плотность заполнения и вместе с ней склонность белков к фазовому разделению (Delarue 2018).</span></li><li><b>В.</b> Изменит: mTORC1 фосфорилирует каркасные белки <i>(неверный вариант)</i><br><span class="expl">В экспериментах Delarue 2018 эффект шёл через концентрацию рибосом, а не через прямое фосфорилирование каркасных белков киназой mTORC1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41594-018-0112-y">Boehning M. et al. 2018. RNA polymerase II clustering through carboxy-terminal domain phase separation. Nat Struct Mol Biol</a></li><li><a href="https://doi.org/10.1038/s41586-019-1464-0">Guo Y. E. et al. 2019. Pol II phosphorylation regulates a switch between transcriptional and splicing condensates. Nature</a></li><li><a href="https://doi.org/10.1091/mbc.E18-12-0823">Kim S. et al. 2019. Phosphorylation of nephrin induces phase separated domains that move through actomyosin contraction. Mol Biol Cell</a></li><li><a href="https://doi.org/10.1038/nature10879">Li P. et al. 2012. Phase transitions in the assembly of multivalent signalling proteins. Nature</a></li><li><a href="https://doi.org/10.1002/anie.201703191">Banerjee P. R. et al. 2017. Reentrant phase transition drives dynamic substructure formation in ribonucleoprotein droplets. Angew Chem Int Ed Engl</a></li><li><a href="https://doi.org/10.1126/science.aar7366">Maharana S. et al. 2018. RNA buffers the phase separation behavior of prion-like RNA binding proteins. Science</a></li><li><a href="https://doi.org/10.1016/j.cell.2018.05.042">Delarue M. et al. 2018. mTORC1 controls phase separation and the biophysical properties of the cytoplasm by tuning crowding. Cell</a></li></ul><p>CTD — Boehning 2018 (очищенный белок, CDK7) и Guo 2019 (клетки млекопитающих); нефрин — Li 2012 (in vitro) и Kim 2019 (мембраны и клетки); РНК — Banerjee 2017 (капли синтетических аргининбогатых пептидов и белка FUS с РНК in vitro; растворение при избытке РНК авторы связывают с инверсией заряда комплексов) и Maharana 2018 (FUS и TDP-43 in vitro и в клетках HeLa); плотность цитоплазмы — Delarue 2018 (дрожжи и клетки HEK293). Направления сдвига на схеме — по этим работам; положение порога условное, без чисел.</p></details></article><article class="card print-unit" id="ns-functions"><div class="eyebrow">Конденсаты · шаг 19 из 30</div><h2>Какие функции выполняют конденсаты: концентрирование, секвестрация, организация ядра</h2><p class="lead">Конденсат может ускорять реакцию, изымать молекулы из работы и делить пространство ядра без мембран. Но каждую функцию нужно отделять от сопутствующих событий: <a href="#ns-g-S2-T61">стресс-гранула</a> — следствие остановки трансляции, а не её причина.</p><ol class="mech"><li>Концентрирование фермента и субстрата ускоряет реакцию, но лишь в определённых пределах.</li><li>При стрессе инициация трансляции подавляется, рибосомы диссоциируют от мРНК, и свободные мРНК с <a href="#ns-g-S2-T62">G3BP1/G3BP2</a> собираются в гранулы.</li><li>Клетки без G3BP1 и G3BP2 гранул не образуют, но синтез белка при стрессе подавляют так же.</li></ol><p>Обзоры перечисляют много функций конденсатов: участие в реализации генетической информации, быстрый и обратимый ответ на стресс, регуляцию концентрации белков и нуклеиновых кислот, ускорение химических реакций, временную инактивацию молекул, сортировку и транспорт макромолекул, образование центров нуклеации, передачу сигнала (Горшенева 2024). Ниже разобраны три: повышение локальной концентрации участников реакции, секвестрация и организация ядра.</p><p>Первая функция — повышение локальной концентрации участников реакции. В реконструированной системе ферменты SUMO-илирования, собранные в капли, работали до 36 раз быстрее, чем в окружающем растворе; ускорение складывалось из повышения концентрации и изменения сродства фермента к субстрату и зависело от субстрата (Peeples 2021). Повышение концентрации само по себе ускорения не гарантирует.</p><p>Вторая функция — секвестрация, временное изъятие молекул из работы. Здесь полезно разделить события. Стресс подавляет инициацию трансляции (например, через фосфорилирование eIF2α), рибосомы диссоциируют от мРНК, и появляется пул свободных рибонуклеопротеинов. Затем белки G3BP1 и G3BP2 при связывании свободной РНК меняют конформацию и собирают гранулу (Guillén-Boixet 2020; Yang 2020). Клетки U2OS без G3BP1 и G3BP2 гранул в ответ на арсенит не образовывали, но синтез белка подавляли так же, как обычные клетки (Kedersha 2016). Значит, гранула — следствие остановки трансляции.</p><p>Третья функция — организация ядра. Ядро не имеет внутренних мембран, и ядрышко, спеклы, тельца Кахаля являются конденсатами. Ядрышко ведёт себя как многофазная жидкость: его слои соответствуют последовательным этапам сборки рибосом (Lafontaine 2021). Роль фазового разделения в транскрипционных конденсатах на энхансерах пока остаётся открытым вопросом (Pei 2025).</p><p>Переключите состояния на схеме и проследите, какие события стресса зависят от G3BP, а какие нет.</p><div class="note trap"><strong>Типичная ошибка</strong> Стресс-гранула останавливает трансляцию, поглощая мРНК и рибосомы.<p class="trap-fix">Последовательность обратная: сначала подавляется инициация трансляции, затем из освободившихся мРНК собирается гранула. Клетки без G3BP1 и G3BP2 гранул не образуют, но синтез белка при стрессе подавляют так же.</p></div><div class="static-quiz"><h3>Клетки без G3BP1 и G3BP2 обработали арсенитом натрия. Как изменится синтез белка по сравнению с обработанными обычными клетками?</h3><ol><li><b>А.</b> Будет подавлен так же, хотя гранул нет <i>(верный вариант)</i><br><span class="expl">Подавление трансляции при стрессе идёт через фосфорилирование eIF2α и не требует гранул: в экспериментах Kedersha 2016 клетки без G3BP1/2 подавляли синтез белка так же, как обычные.</span></li><li><b>Б.</b> Не будет подавлен: нечем изъять мРНК <i>(неверный вариант)</i><br><span class="expl">Гранула не причина, а следствие остановки инициации трансляции. Без G3BP1/2 гранул нет, а синтез белка всё равно подавляется.</span></li><li><b>В.</b> Будет подавлен сильнее, чем в обычных клетках <i>(неверный вариант)</i><br><span class="expl">В экспериментах Kedersha 2016 синтез белка при стрессе подавлялся в клетках без G3BP1/2 так же, как в обычных, — не сильнее и не слабее.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41589-021-00801-x">Peeples W., Rosen M. K. 2021. Mechanistic dissection of increased enzymatic rate in a phase-separated compartment. Nat Chem Biol</a></li><li><a href="https://doi.org/10.1083/jcb.201508028">Kedersha N. et al. 2016. G3BP-Caprin1-USP10 complexes mediate stress granule condensation and associate with 40S subunits. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2020.03.049">Guillén-Boixet J. et al. 2020. RNA-induced conformational switching and clustering of G3BP drive stress granule assembly by condensation. Cell</a></li><li><a href="https://doi.org/10.1016/j.cell.2020.03.046">Yang P. et al. 2020. G3BP1 is a tunable switch that triggers phase separation to assemble stress granules. Cell</a></li><li><a href="https://doi.org/10.1038/s41580-020-0272-6">Lafontaine D. L. J. et al. 2021. The nucleolus as a multiphase liquid condensate. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41580-024-00789-x">Pei G. et al. 2025. Transcription regulation by biomolecular condensates. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Перечень функций — обзор Горшенева 2024 (с. 400). Ускорение реакции — Peeples 2021 (реконструированная система SUMO-илирования). Стресс-гранулы — Kedersha 2016 (клетки U2OS без G3BP1/2, арсенит натрия; синтез белка оценён по включению пуромицина), Guillén-Boixet 2020 и Yang 2020 (G3BP как переключатель сборки). Ядрышко — Lafontaine 2021; транскрипционные конденсаты — обзор Pei 2025. Схема — последовательность событий, без чисел.</p></details></article><article class="card print-unit" id="ns-maturation"><div class="eyebrow">Конденсаты · шаг 20 из 30</div><h2>Почему жидкоподобная капля может превратиться в агрегат</h2><p class="lead">Капли некоторых белков со временем меняют физические свойства, и обмен молекул в них замедляется; так ведут себя, например, капли очищенного FUS in vitro. Замены в неупорядоченных областях FUS и hnRNPA1, найденные у больных, в экспериментах in vitro ускоряют этот <a href="#ns-g-S2-T59">переход жидкость — твёрдое</a>.</p><ol class="mech"><li>В каплях очищенных FUS и hnRNPA1 при длительной инкубации in vitro могут возникать упорядоченные межмолекулярные структуры, и обмен молекул замедляется.</li><li>В экспериментах in vitro патогенная замена G156E ускоряет переход капель очищенного FUS в твёрдоподобное, волокнистое состояние.</li><li><a href="#ns-g-S2-T60">Агрегаты</a> бывают аморфными и упорядоченными; конденсат может ускорять агрегацию, но может и препятствовать ей.</li></ol><p>Белки с протяжёнными неупорядоченными областями низкой сложности — <a href="#ns-g-S2-T64">FUS</a>, hnRNPA1, TDP-43 — образуют жидкоподобные конденсаты. Patel и соавторы (2015) показали, что FUS собирается в жидкоподобные компартменты в местах повреждения ДНК и в цитоплазме при стрессе. Капли очищенного FUS in vitro со временем теряли подвижность и переходили в агрегированное состояние с амилоидоподобными фибриллами, а замены, найденные у больных боковым амиотрофическим склерозом, ускоряли этот переход. Для hnRNPA1 показано, что в каплях плотной фазы образование фибрилл ускоряется (Molliex 2015).</p><p>Многие патогенные замены в FUS, hnRNPA1 и TDP-43 расположены в неупорядоченных областях, и эксперименты in vitro показывают один из возможных путей их действия. Однако прямых доказательств перехода конденсатов в амилоидные агрегаты в живой клетке практически нет (Горшенева 2024), поэтому эксперимент с каплями очищенного белка не устанавливает механизма болезни.</p><p>Важно различать механизм сборки и её материальное состояние. Термин «конденсат» в семинаре описывает обогащение без мембраны и включает жидкоподобные, гелеподобные и твёрдоподобные сборки (шаг «Что такое биомолекулярный конденсат»). Агрегаты могут быть аморфными или упорядоченными; амилоидные фибриллы — один из вариантов. В этом сравнении речь идёт об устойчивой сборке с медленным обменом. Внутри конденсата агрегация может ускоряться за счёт высокой концентрации, но в других условиях конденсация препятствует ей, изымая белок из раствора (Visser 2024). Поэтому ни яркий фокус, ни даже медленный обмен сами по себе не устанавливают механизм сборки.</p><p>На схеме — учебная модель созревания: подвижная фракция FRAP у капель FUS дикого типа и с заменой G156E в зависимости от времени.</p><div class="note trap"><strong>Типичная ошибка</strong> Конденсат и агрегат — одно и то же: оба выглядят как яркие скопления белка.<p class="trap-fix">По виду фокуса нельзя установить ни механизм сборки, ни её материальное состояние. В учебной модели свежие капли быстро обмениваются компонентами и растворяются ниже порога, а агрегат обменивается медленно; созревание капли в агрегат — отдельный, обычно медленный процесс. Эти модельные признаки не являются общим определением всех конденсатов и агрегатов.</p></div><div class="static-quiz"><h3>Капли FUS дикого типа сразу после образования обмениваются молекулами за секунды. Как изменится их подвижная фракция FRAP через много часов in vitro?</h3><ol><li><b>А.</b> Останется прежней: жидкое состояние устойчиво <i>(неверный вариант)</i><br><span class="expl">Жидкоподобное состояние капель очищенного FUS метастабильно: in vitro они со временем теряют подвижность и переходят в твёрдоподобное состояние.</span></li><li><b>Б.</b> Постепенно снизится: капли созревают <i>(верный вариант)</i><br><span class="expl">При длительной инкубации капель очищенного FUS обмен молекул в них замедляется, и подвижная фракция падает; замена G156E ускоряет этот процесс (Patel 2015).</span></li><li><b>В.</b> Вырастет: капли сольются в одну большую <i>(неверный вариант)</i><br><span class="expl">Слияние меняет размер капель, но не делает обмен молекул быстрее. Со временем обмен в каплях FUS замедляется.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2015.07.047">Patel A. et al. 2015. A liquid-to-solid phase transition of the ALS protein FUS accelerated by disease mutation. Cell</a></li><li><a href="https://doi.org/10.1016/j.cell.2015.09.015">Molliex A. et al. 2015. Phase separation by low complexity domains promotes stress granule assembly and drives pathological fibrillization. Cell</a></li><li><a href="https://doi.org/10.1038/s41570-024-00635-w">Visser B. S. et al. 2024. The role of biomolecular condensates in protein aggregation. Nat Rev Chem</a></li><li><a href="https://doi.org/10.1016/j.cell.2018.12.035">Alberti S. et al. 2019. Considerations and challenges in studying liquid-liquid phase separation and biomolecular condensates. Cell</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Patel 2015 — очищенный FUS in vitro и клетки HeLa; Molliex 2015 — hnRNPA1 in vitro; Visser 2024 — обзор; различие экспериментов in vitro и данных о живых клетках, типы агрегатов — обзор Горшенева 2024 (с. 404–408). Кривые на схеме — учебная модель практикума (вопрос 3, продвинутый уровень): подвижная фракция 0,05 + 0,85·exp(−t/τ), τ = 10 ч у белка дикого типа и 2,5 ч у G156E; направление различия — по Patel 2015, числа условные.</p></details></article><article class="card print-unit" id="ns-criteria"><div class="eyebrow">Конденсаты · шаг 21 из 30</div><h2>Что доказывает и чего не доказывает яркий фокус в микроскопе</h2><p class="lead">Яркий фокус одинаково выглядит у конденсата, у комплексов с обратимо связанным белком, у белка на невидимой органелле и у агрегата. Ни один признак не достаточен сам по себе: нужен набор независимых проверок.</p><ol class="mech"><li><a href="#ns-g-S2-T08">FRAP</a> характеризует обмен компонентов, слияние — жидкоподобное поведение, а зависимость от концентрации помогает проверить фазовую модель сборки, но сама её не доказывает.</li><li>Замены, нарушающие только слабые контакты и сохраняющие специфическое связывание, проверяют, нужна ли для функции именно конденсация.</li><li><a href="#ns-g-S2-T66">1,6-гександиол</a> растворяет многие сборки, но действует неизбирательно и не годится как доказательство.</li></ol><p>Наблюдение, что белок сосредоточен в ярких фокусах, не доказывает фазового разделения. Тот же вид имеют устойчивый комплекс, скопление белка на мембранной структуре, невидимой в этом канале, и агрегат (McSwiggen 2019). Различие не косметическое: от него зависит, обратима ли структура, зависит ли она от концентрации и как на неё можно воздействовать.</p><p>Методические рекомендации требуют набора признаков (Gao 2022). Обратимость и зависимость от концентрации: структура исчезает при снижении концентрации каркаса и появляется при её повышении; самый прямой вариант — <a href="#ns-g-S2-T67">оптогенетическая сборка</a>, когда светом управляют олигомеризацией белка и картируют порог прямо в живой клетке (Shin 2017; Bracha 2018). Зависимость от концентрации ещё не отличает фазовое разделение от других кооперативных сборок; её дополняют измерением концентраций внутри и вне структуры (McSwiggen 2019). В простейшей равновесной системе из одного каркасного компонента и растворителя концентрации сосуществующих фаз при неизменных условиях постоянны и не растут вместе с общим количеством белка. В многокомпонентном конденсате они могут меняться вместе с составом системы, поэтому отсутствие такого плато само по себе фазового разделения не исключает (Riback 2020). Обмен компонентов: FRAP. Материальные свойства: округлость, слияние при соприкосновении, деформация.</p><p>Каждый признак ограничен. Быстрое восстановление FRAP показывает обмен, но не доказывает жидкого состояния: числа зависят от размера обесцвеченного участка и модели расчёта (Taylor 2019). 1,6-гександиол в концентрациях 5–10 %, которыми растворяют капли, почти полностью подавляет киназы и фосфатазы in vitro (Düster 2021) и меняет проницаемость мембран (Горшенева 2024). Наблюдение может менять и сам объект: повышенная экспрессия меченого белка повышает его концентрацию в клетке и способна вызвать конденсацию, которой при обычном уровне белка нет (Горшенева 2024).</p><p>Самое трудное — показать, что конденсация нужна для функции. Для этого вводят замены, которые нарушают множественные слабые контакты неупорядоченной области, но сохраняют известное специфическое связывание, и проверяют, нарушается ли функция. Этот контроль в работах области часто отсутствует (McSwiggen 2019). Схемы методов — ниже.</p><div class="note trap"><strong>Типичная ошибка</strong> Если белок образует в клетке яркие округлые фокусы, это доказывает фазовое разделение.<p class="trap-fix">Округлые яркие фокусы дают и комплексы, и органеллы, и агрегаты. О механизме сборки судят по совокупности независимых измерений — зависимости от концентрации и составу сосуществующих фаз; обмен компонентов и слияние характеризуют динамику и материальное состояние. Постоянство концентраций ожидается лишь в простейшей фазовой модели, а исчезновение фокусов при разведении требует контроля чувствительности регистрации. Роль конденсации в функции проверяют заменами, нарушающими только конденсацию.</p></div><div class="static-quiz"><h3>Какой эксперимент прямо проверяет, что для функции белка нужна именно его конденсация, а не только связывание с партнёром?</h3><ol><li><b>А.</b> Замены в IDR, сохраняющие связывание с партнёром <i>(верный вариант)</i><br><span class="expl">Замены ароматических остатков в неупорядоченной области разделяют две способности белка: если исчезают и фокусы, и функция, а связывание сохранено, это довод в пользу роли конденсации.</span></li><li><b>Б.</b> Растворение фокусов гександиолом и проверка функции <i>(неверный вариант)</i><br><span class="expl">Гександиол действует неизбирательно: он подавляет киназы и фосфатазы и меняет мембраны, поэтому нарушение функции нельзя приписать растворению конденсата.</span></li><li><b>В.</b> Быстрое восстановление флуоресценции фокусов (FRAP) <i>(неверный вариант)</i><br><span class="expl">FRAP показывает обмен компонентов, но ничего не говорит о том, нужна ли конденсация для функции; быстро восстанавливается и белок, обратимо связанный с комплексами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-2.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1101/gad.331520.119">McSwiggen D. T. et al. 2019. Evaluating phase separation in live cells: diagnosis, caveats, and functional consequences. Genes Dev</a></li><li><a href="https://doi.org/10.1038/s41589-022-01204-2">Gao Y. et al. 2022. A brief guideline for studies of phase-separated biomolecular condensates. Nat Chem Biol</a></li><li><a href="https://doi.org/10.1038/s41586-020-2256-2">Riback J. A. et al. 2020. Composition-dependent thermodynamics of intracellular phase separation. Nature</a></li><li><a href="https://doi.org/10.1016/j.bpj.2019.08.030">Taylor N. O. et al. 2019. Quantifying dynamics in phase-separated condensates using fluorescence recovery after photobleaching. Biophys J</a></li><li><a href="https://doi.org/10.1016/j.cell.2016.11.054">Shin Y. et al. 2017. Spatiotemporal control of intracellular phase transitions using light-activated optoDroplets. Cell</a></li><li><a href="https://doi.org/10.1016/j.cell.2018.10.048">Bracha D. et al. 2018. Mapping local and global liquid phase behavior in living cells using photo-oligomerizable seeds. Cell</a></li><li><a href="https://doi.org/10.1016/j.jbc.2021.100260">Düster R. et al. 2021. 1,6-Hexanediol, commonly used to dissolve liquid-liquid phase separated condensates, directly impairs kinase and phosphatase activities. J Biol Chem</a></li><li><a href="https://doi.org/10.1134/S0006297924140116">Горшенева Н. А., Сопова Ю. В., Азаров В. В., Гризель А. В., Рубель А. А. 2024. Биомолекулярные конденсаты: структура, функции, методы изучения. Успехи биологической химии, т. 64, с. 397–430 (англ. версия: Biochemistry (Moscow), т. 89, прил. 1, с. S205–S223)</a></li></ul><p>Критерии — McSwiggen 2019, Gao 2022; FRAP — Taylor 2019 (капли in vitro и конденсаты клеток HEK293); оптогенетика — Shin 2017 (optoDroplets: IDR FUS, DDX4, HNRNPA1 в клетках NIH 3T3) и Bracha 2018 (Corelets); гександиол — Düster 2021 (ферменты in vitro) и Горшенева 2024 (обзор, с. 413–418: сочетание методов и их ограничения); непостоянство концентрации насыщения в многокомпонентных конденсатах — Riback 2020 (ядрышко и другие конденсаты клеток человека). Схемы — схемы методов, числа условные.</p></details></article><article class="card print-unit" id="ns-polar-cell"><div class="eyebrow">Полярность · шаг 22 из 30</div><h2>Почему полярный домен не может удерживаться сам по себе</h2><p class="lead">Стороны полярной клетки различаются: участки её мембраны несут разный набор белков и липидов. Белки мембраны перемешиваются диффузией за минуты, а домены существуют часами, поэтому полярность требует непрерывного поддержания.</p><ol class="mech"><li>Мембранный белок с D ≈ 0,1 мкм²/с проходит 10 мкм <a href="#ns-g-S2-T72">латеральной диффузией</a> примерно за 250 с.</li><li><a href="#ns-g-S2-T70">Полярный домен</a> существует часами, значит, его поддерживают потоки доставки и удаления и удержание белков на каркасах, а не отсутствие диффузии.</li><li>Положение будущего домена задаёт слабый <a href="#ns-g-S2-T74">ориентир</a>: внешний градиент, контакт с соседней клеткой или матриксом, внутренняя метка.</li></ol><p>Клеточная полярность — устойчивая асимметрия клетки: участки плазматической мембраны различаются по составу белков и липидов, цитоскелет ориентирован относительно оси клетки, органеллы распределены неравномерно. У эпителиальной клетки это <a href="#ns-g-S2-T71">апикальный и базолатеральный домены</a>, у нейрона — аксон и дендриты, у мигрирующей клетки — передний и задний края.</p><p>Определение содержит количественное условие. Время, за которое молекула смещается диффузией на расстояние x, оценивают как t ≈ x²/4D. Для мембранного белка с D ≈ 0,1 мкм²/с путь в 10 мкм занимает около 250 с, для липида с D ≈ 0,5 мкм²/с — меньше минуты. Домен, который сохраняется часами, не может удерживаться пассивно: без непрерывной работы диффузия выровняла бы состав мембраны.</p><p>Исходная асимметрия задаётся ориентиром. У эпителия это контакт с соседними клетками и с внеклеточным матриксом, у дрожжей — рубец от предыдущего деления, у мигрирующей клетки — градиент хемоаттрактанта. Ориентир обычно слаб: концентрация хемоаттрактанта на двух сторонах клетки может различаться на несколько процентов, а различие доменов качественное. Значит, между ориентиром и доменом действует механизм усиления (следующие шаги).</p><p>Схема рассчитывает оценку t ≈ x²/4D; это порядок величины, а не время конкретного эксперимента.</p><div class="note trap"><strong>Типичная ошибка</strong> Полярность — застывшая структура: белки однажды доставлены к своей мембране и остаются там.<p class="trap-fix">Мембранные белки и липиды перемешиваются диффузией за минуты. Домен, существующий часами, поддерживается непрерывными потоками доставки, удержания и удаления.</p></div><div class="static-quiz"><h3>Мембранный белок проходит 10 мкм диффузией примерно за 4 мин, а апикальный домен эпителиальной клетки сохраняется часами. Какой вывод следует из этого сравнения?</h3><ol><li><b>А.</b> Белки домена не диффундируют в мембране <i>(неверный вариант)</i><br><span class="expl">Белки мембраны диффундируют; именно поэтому домен и требует поддержания. Неподвижные белки не нуждались бы в доставке и удалении.</span></li><li><b>Б.</b> Домен поддерживается непрерывными потоками <i>(верный вариант)</i><br><span class="expl">Если бы домен удерживался пассивно, диффузия выровняла бы состав мембраны за минуты. Он существует часами, значит, его поддерживают доставка, удержание и удаление.</span></li><li><b>В.</b> Домен однажды создан и далее не меняется <i>(неверный вариант)</i><br><span class="expl">Неизменный домен расплылся бы за минуты: состав мембраны выравнивается диффузией. Сохранение домена — результат постоянного оборота белков.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-026-00978-w">Günzel D., Lehmann M., Honigmann A. 2026. Tight junction structure, assembly and (dys)function. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1146/annurev-cellbio-100616-060739">Devreotes P. N. et al. 2017. Excitable signal transduction networks in directed cell migration. Annu Rev Cell Dev Biol</a></li><li><a href="https://doi.org/10.1038/nrm3775">Rodriguez-Boulan E., Macara I. G. 2014. Organization and execution of the epithelial polarity programme. Nat Rev Mol Cell Biol</a></li></ul><p>Оценка t ≈ x²/4D — расчёт по заданным параметрам. D ≈ 0,1 мкм²/с — порядок величины для мембранного белка животной клетки; D ≈ 0,5 мкм²/с для липидов эпителиальной клетки — обзор Günzel 2026. Градиент хемоаттрактанта в несколько процентов — обзор Devreotes 2017 (мигрирующие клетки, в том числе Dictyostelium и нейтрофилы).</p></details></article><article class="card print-unit" id="ns-feedback"><div class="eyebrow">Полярность · шаг 23 из 30</div><h2>Как слабый ориентир превращается в резкий домен</h2><p class="lead">Различие, заданное ориентиром, усиливает <a href="#ns-g-S2-T76">локальная положительная обратная связь</a>. При ограниченном общем запасе компонента домен образуется только в одном участке мембраны.</p><ol class="mech"><li>Активная <a href="#ns-g-S2-T75">CDC42</a>, связанная с GTP, удерживает на мембране <a href="#ns-g-S2-T77">каркасный белок Bem1 вместе с Cdc24</a>.</li><li>Cdc24 — фактор обмена нуклеотидов: он переводит соседние молекулы CDC42 в активную форму, и кластер растёт.</li><li>Общий запас CDC42 ограничен, поэтому рост в одном участке идёт за счёт остальной мембраны, и образуется один домен.</li></ol><p>Наиболее полно разобранный пример — малая ГТФаза CDC42 почкующихся дрожжей. В активной форме, связанной с GTP, она задаёт место сборки актиновых кабелей и роста почки. Активная CDC42 через свой эффектор, PAK-киназу Cla4, связывает каркасный белок Bem1, а с ним — фактор обмена нуклеотидов Cdc24; Cdc24 переводит соседние молекулы CDC42 из GDP-формы в GTP-форму, и в участке мембраны возникает самоусиливающийся кластер.</p><p>Ориентиром у дрожжей служит рубец от предыдущего деления, сигнал от которого передаёт ГТФаза Rsr1. Эксперименты с клетками без ориентиров показали главное: они всё равно образуют один домен активной CDC42, но в случайном месте. В работе Irazoqui 2003 кластер возникал и без ориентиров, и без микротрубочек и актина, но требовал Bem1; в работе Wedlich-Söldner 2003 поляризация активированной CDC42 зависела от доставки по актиновым кабелям. Ориентир задаёт положение домена, а обратная связь — само его существование.</p><p>Почему домен один? Общий запас CDC42 в клетке ограничен. Участок, где положительная обратная связь установилась раньше, связывает молекулы CDC42 из цитоплазмы, и в соседних участках их становится недостаточно для собственного кластера; в моделях это называют конкуренцией «победитель получает всё» (Goryachev и Pokhilko 2008). По тем же моделям при слишком малом запасе устойчивого кластера не образуется.</p><p>Схема показывает качественные исходы для сочетаний трёх условий; это не расчёт.</p><div class="note trap"><strong>Типичная ошибка</strong> Положение и само существование домена задаёт ориентир; без ориентира клетка не поляризуется.<p class="trap-fix">Ориентир лишь смещает положение домена. Клетки без ориентиров образуют один домен в случайном месте: его существование обеспечивает положительная обратная связь при ограниченном запасе.</p></div><div class="static-quiz"><h3>У дрожжей удалили ГТФазу Rsr1, передающую сигнал от ориентира, но Bem1 и Cdc24 сохранены. Где будет домен активной CDC42?</h3><ol><li><b>А.</b> Домена не будет: без ориентира нет поляризации <i>(неверный вариант)</i><br><span class="expl">Ориентир определяет только место. Клетки без ориентиров образуют домен активной CDC42 за счёт положительной обратной связи через Bem1 и Cdc24.</span></li><li><b>Б.</b> Будет один домен в случайном месте мембраны <i>(верный вариант)</i><br><span class="expl">Обратная связь через Bem1 и Cdc24 усиливает случайное различие, а ограниченный запас CDC42 оставляет один домен. Без ориентира его положение случайно.</span></li><li><b>В.</b> Появятся домены по всей мембране одновременно <i>(неверный вариант)</i><br><span class="expl">Общий запас CDC42 ограничен: участок, где кластер вырос раньше, связывает молекулы, которых тогда не хватает остальным участкам, поэтому в норме остаётся один домен.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb1068">Irazoqui J. E., Gladfelter A. S., Lew D. J. 2003. Scaffold-mediated symmetry breaking by Cdc42p. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1126/science.1080944">Wedlich-Söldner R. et al. 2003. Spontaneous cell polarization through actomyosin-based delivery of the Cdc42 GTPase. Science</a></li><li><a href="https://doi.org/10.1016/j.febslet.2008.03.029">Goryachev A. B., Pokhilko A. V. 2008. Dynamics of Cdc42 network embodies a Turing-type mechanism of yeast cell polarity. FEBS Lett</a></li><li><a href="https://doi.org/10.1146/annurev-cellbio-100616-060856">Chiou J.-G., Balasubramanian M. K., Lew D. J. 2017. Cell polarity in yeast. Annu Rev Cell Dev Biol</a></li></ul><p>Почкующиеся дрожжи Saccharomyces cerevisiae. Irazoqui 2003: клетки без ориентиров (rsr1), с разрушенными микротрубочками и актином; поляризация требовала Bem1 и гидролиза GTP белком CDC42. Wedlich-Söldner 2003: экспрессия активированной CDC42; поляризация требовала направленной секреции по актиновым кабелям. Конкуренция участков и порог по запасу — расчёт моделей (Goryachev и Pokhilko 2008; обзор Chiou 2017). Исходы на схеме качественные.</p></details></article><article class="card print-unit" id="ns-mutual-exclusion"><div class="eyebrow">Полярность · шаг 24 из 30</div><h2>Как два модуля белков PAR разделяют мембрану на два домена</h2><p class="lead">Усиленное различие превращается в два взаимоисключающих домена, когда модули фосфорилируют друг друга. Так работает система белков <a href="#ns-g-S2-T79">PAR</a>: передний модуль вытесняет задний, задний — передний.</p><ol class="mech"><li><a href="#ns-g-S2-T80">aPKC</a> переднего модуля фосфорилирует PAR-1 и снижает его способность удерживаться на мембране.</li><li>PAR-1 заднего модуля фосфорилирует PAR-3; с фосфорилированным PAR-3 связывается белок 14-3-3, и комплекс PAR-3 — PAR-6 — aPKC не собирается.</li><li>При достаточной нелинейности каждый участок мембраны занят одним модулем, и граница доменов резкая.</li></ol><p>Систему PAR впервые описали в зиготе нематоды, затем нашли у дрозофилы, в эпителии и нейронах млекопитающих. Передний (в эпителии — апикальный) модуль включает PAR-3, PAR-6 и атипичную протеинкиназу C (aPKC), задний (базолатеральный) — киназу PAR-1. Ключ механизма — во <a href="#ns-g-S2-T81">взаимном вытеснении</a>: киназа каждого модуля фосфорилирует компоненты другого и тем удаляет их с мембраны.</p><p>Оба звена показаны прямо. aPKC фосфорилирует PAR-1b человека по Thr595, и это фосфорилирование снижает и киназную активность PAR-1b, и его связь с плазматической мембраной (Hurov 2004, клетки HeLa). PAR-1 у дрозофилы фосфорилирует Bazooka (PAR-3) по двум консервативным остаткам серина; с ними связывается белок 14-3-3, и Bazooka не образует комплекс с PAR-6 и aPKC. Bazooka без этих участков образует эктопические комплексы на латеральной мембране (Benton и St Johnston 2003).</p><p>Взаимное ингибирование само по себе не гарантирует двух устойчивых доменов. Нужна достаточная нелинейность — кооперативное связывание или олигомеризация на мембране — и подходящее соотношение концентраций; при других параметрах та же схема даёт одно смешанное состояние (Lang и Munro 2017). В зиготе нематоды домены PAR закладываются потоком коры, который сдвигает передние белки к одному полюсу (Goehring 2011). Перенос выводов между зиготой, эпителием и нейроном требует оговорок.</p><div class="note trap"><strong>Типичная ошибка</strong> Каждый белок PAR сам по себе находит «свою» сторону клетки.<p class="trap-fix">Положение модулей задаёт их взаимодействие: каждый модуль фосфорилирует белки другого и вытесняет их с мембраны. Если убрать участок фосфорилирования, белок оказывается и на «чужой» мембране.</p></div><div class="static-quiz"><h3>В эпителии дрозофилы экспрессировали Bazooka (PAR-3) с заменами двух остатков серина, которые фосфорилирует PAR-1. Где окажется этот белок?</h3><ol><li><b>А.</b> Только на апикальной мембране, как в норме <i>(неверный вариант)</i><br><span class="expl">В норме Bazooka остаётся только на апикальной мембране потому, что PAR-1 вытесняет её с латеральной. Без участков фосфорилирования это вытеснение не действует.</span></li><li><b>Б.</b> Во всей цитоплазме, без связи с мембраной <i>(неверный вариант)</i><br><span class="expl">Фосфорилирование киназой PAR-1 удаляет Bazooka с мембраны; без участков фосфорилирования белок не теряет связь с мембраной, а, наоборот, удерживается и там, где в норме отсутствует.</span></li><li><b>В.</b> На апикальной и на латеральной мембране <i>(верный вариант)</i><br><span class="expl">PAR-1 не может фосфорилировать этот белок, 14-3-3 с ним не связывается, и комплексы Bazooka с PAR-6 и aPKC образуются и на латеральной мембране (Benton и St Johnston 2003).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2004.04.007">Hurov J. B., Watkins J. L., Piwnica-Worms H. 2004. Atypical PKC phosphorylates PAR-1 kinases to regulate localization and activity. Curr Biol</a></li><li><a href="https://doi.org/10.1016/s0092-8674(03)00938-3">Benton R., St Johnston D. 2003. Drosophila PAR-1 and 14-3-3 inhibit Bazooka/PAR-3 to establish complementary cortical domains in polarized cells. Cell</a></li><li><a href="https://doi.org/10.1242/dev.139063">Lang C. F., Munro E. 2017. The PAR proteins: from molecular circuits to dynamic self-stabilizing cell polarity. Development</a></li><li><a href="https://doi.org/10.1126/science.1208619">Goehring N. W. et al. 2011. Polarization of PAR proteins by advective triggering of a pattern-forming system. Science</a></li></ul><p>Hurov 2004: PAR-1b человека, клетки HeLa, остаток Thr595 фосфорилируется киназой aPKC. Benton и St Johnston 2003: эпителий и ооцит дрозофилы, Bazooka (PAR-3) фосфорилируется киназой PAR-1 по двум остаткам серина. Условия бистабильности — обзор Lang и Munro 2017; поток коры в зиготе нематоды — Goehring 2011. Схема качественная.</p></details></article><article class="card print-unit" id="ns-three-fluxes"><div class="eyebrow">Полярность · шаг 25 из 30</div><h2>Как доставка, диффузия и эндоцитоз поддерживают домен</h2><p class="lead">Домен — <a href="#ns-g-S2-T06">стационарное состояние</a> трёх потоков: доставки в домен, удержания в нём и удаления ушедших молекул. Резкость границы определяется скоростью удаления: при быстром эндоцитозе белок не успевает отойти далеко от места доставки.</p><ol class="mech"><li><a href="#ns-g-S2-T82">Направленная доставка</a> приносит белок в определённую область мембраны по ориентированным трекам.</li><li>Латеральная диффузия размывает домен, а эндоцитоз удаляет молекулы раньше, чем они уйдут далеко.</li><li>Ширину домена задаёт длина спада λ = √(D/kэнд); в клетке удалённый белок может возвращаться в домен через <a href="#ns-g-S2-T83">рециклирующие эндосомы</a>, в учебной модели этот возврат отдельно не моделируется.</li></ol><p>Поддержание домена складывается из трёх процессов, и все они уже знакомы. Направленная доставка: секреторные пузырьки перемещаются по микротрубочкам и актиновым филаментам к определённой области мембраны и сливаются с ней при участии комплекса экзоциста. Удержание: каркасные белки коры связывают белки домена с цитоскелетом. Удаление: эндоцитоз изымает молекулы, ушедшие из домена, и они возвращаются через рециклирующие эндосомы или направляются на деградацию.</p><p>У почкующихся дрожжей так поддерживается полярность белка Snc1: он сосредоточен в почке и на кончике выроста, и для этого необходим его эндоцитоз. В мембране дрожжей Snc1 диффундирует примерно в 40 раз медленнее, чем мембранный белок животной клетки (около 0,0025 мкм²/с), и малой клетке хватает местной доставки и эндоцитозного возврата (Valdez-Taubas и Pelham 2003). Модель, построенная для активированной CDC42, показала, что баланса диффузии, направленного транспорта и эндоцитоза достаточно, чтобы описать форму домена (Marco 2007).</p><p>В стационарном состоянии профиль концентрации спадает от места доставки с характерной длиной λ = √(D/kэнд). Чем быстрее эндоцитоз, тем уже и резче домен, но тем меньше белка на мембране при том же потоке доставки. Поэтому, если удалённый белок возвращается к полюсу, у скорости эндоцитоза есть оптимум: при слишком быстром удалении на мембране остаётся так мало белка, что домен ослабевает. Marco и соавторы (2007) показали, что измеренные у дрожжей скорости эндоцитоза близки к такому оптимуму. Схема рассчитана по учебной модели практикума: поток доставки в ней постоянен и не зависит от скорости эндоцитоза, возврат удалённого белка к полюсу отдельно не моделируется, поэтому оптимума, описанного Marco 2007, в ней нет.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем больше белка доставлено к полюсу, тем резче домен; эндоцитоз только мешает полярности.<p class="trap-fix">Без удаления белок расходится диффузией по всей мембране. Эндоцитоз сужает домен: он убирает молекулы раньше, чем они уйдут от места доставки.</p></div><div class="static-quiz"><h3>Белок доставляется к полюсу клетки; эндоцитоз ускорили в 4 раза, доставка и диффузия прежние. Как изменится ширина домена?</h3><ol><li><b>А.</b> Уменьшится: белок удаляется ближе к полюсу <i>(верный вариант)</i><br><span class="expl">Длина спада λ = √(D/kэнд) при четырёхкратном ускорении эндоцитоза уменьшается вдвое: молекулы удаляются раньше, чем отойдут от места доставки.</span></li><li><b>Б.</b> Увеличится: белок быстрее возвращается к полюсу <i>(неверный вариант)</i><br><span class="expl">В модели поток доставки постоянен, поэтому быстрое удаление домен не расширяет. Ширину определяет путь, который молекула проходит диффузией до удаления, — он сокращается.</span></li><li><b>В.</b> Не изменится: ширину задаёт только доставка <i>(неверный вариант)</i><br><span class="expl">Доставка задаёт место и высоту домена над фоном, а ширину — отношение диффузии к скорости удаления. Ускорение эндоцитоза сужает домен.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cub.2003.09.001">Valdez-Taubas J., Pelham H. R. B. 2003. Slow diffusion of proteins in the yeast plasma membrane allows polarity to be maintained by endocytic cycling. Curr Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.02.043">Marco E. et al. 2007. Endocytosis optimizes the dynamic localization of membrane proteins that regulate cortical polarity. Cell</a></li></ul><p>Snc1 у почкующихся дрожжей — Valdez-Taubas и Pelham 2003; модель для активированной CDC42 у дрожжей — Marco 2007. Схема — расчёт учебной модели практикума (вопрос 4, базовый уровень): окружность 30 мкм, D = 0,1 мкм²/с, постоянный поток доставки; числа условны.</p></details></article><article class="card print-unit" id="ns-epithelium"><div class="eyebrow">Полярность · шаг 26 из 30</div><h2>Что удерживает апикальный домен эпителиальной клетки</h2><p class="lead">Апикальный и базолатеральный домены эпителия получают белки разными путями доставки. Плотный контакт закрывает промежуток между клетками, но распределение белков по доменам удерживается прежде всего транспортом.</p><ol class="mech"><li>NHE3 проходит через рециклирующие эндосомы с Rab11a; Rab11a и Rab8a связывают с пузырьком <a href="#ns-g-S2-T84">миозин Vb</a>, и этот мотор переносит пузырёк по актину к апикальной мембране.</li><li>У апикальной мембраны <a href="#ns-g-S2-T94">синтаксин 3</a> вместе с Munc18-2, Slp4a и Vamp7 обеспечивает слияние пузырька с мембраной, после которого NHE3 оказывается на поверхности.</li><li>Ошибочно доставленный белок удаляется эндоцитозом и возвращается через рециклирующие эндосомы; без тяжей <a href="#ns-g-S2-T86">клаудинов</a> <a href="#ns-g-S2-T85">плотного контакта</a> барьер для ионов слабеет, а распределение белков по доменам сохраняется.</li></ol><p>Энтероцит всасывает вещества потому, что переносчики апикальной и базолатеральной мембран различны: вход и выход вещества разделены, и поток направлен. Белки апикальной мембраны приходят к ней разными путями. В клетках Caco-2 доставка переносчиков NHE3, CFTR и GLUT5 требует Rab11, Rab8, миозина Vb и синтаксина 3; без миозина Vb эти белки распределяются в пузырьках по цитоплазме, а DPPIV, сахараза-изомальтаза и аминопептидаза N остаются на апикальной мембране (Vogel 2015). Доставка избирательна: миозин Vb нужен части грузов, а не домену как таковому.</p><p>Путь NHE3 удобно разобрать по передачам: на каждой из них груз принимает другой белок или комплекс. NHE3 выбран потому, что для него прямо показана зависимость от миозина Vb и синтаксина 3 и независимость от Vamp3 (Vogel 2015). Сначала, по модели авторов, NHE3 из аппарата Гольджи попадает в рециклирующие эндосомы, на мембране которых находится Rab11a в форме, связанной с GTP; по какому сигналу NHE3 выбирает этот путь, неизвестно. Rab11a и Rab8a служат метками и местами связывания: они удерживают миозин Vb на пузырьке, а по актину движется сам миозин Vb за счёт гидролиза ATP. Миозин Vb с мутациями, нарушающими связь с Rab11 или Rab8, не располагается строго у апикальной мембраны и не восстанавливает полярность клеток без этого миозина (Vogel 2015).</p><p>Дальше пузырёк оказывается рядом с синтаксином 3. Этот <a href="#ns-g-S2-T94">t-SNARE</a> находится в апикальной мембране и без миозина Vb, но взаимодействие синтаксина 3 с Slp4a (белком пузырька, который связывает Rab8a) и с Munc18-2 в клетках без миозина Vb утрачивается; ослабевает и связь синтаксина 3 с Vamp7, а связь с Vamp3 сохраняется. Пузырёк, по предположению авторов, удерживается комплексом экзоциста (субъединица Sec15). Затем, как при любом SNARE-зависимом слиянии, сборка комплекса сближает мембраны пузырька и плазматической мембраны и приводит к их слиянию, и NHE3 оказывается в апикальной мембране. Белки-активаторы ГТФазы Rab (Rab-GAP) TBC1D30 и Evi5 связываются с синтаксином 3 и, как предполагают, переводят Rab8a и Rab11a в неактивную форму, завершая цикл.</p><p>Границы применимости. Результаты получены на клетках Caco-2 без миозина Vb (мутация 1125G&gt;A, нонсенс-кодон), а взаимодействия белков показаны совместной очисткой из клеточных лизатов: это ассоциация, а не обязательно прямой контакт, и порядок передач — вывод авторов из таких данных. Для NHE3 непосредственно проверены миозин Vb, синтаксин 3 и Vamp3; участие Rab11a, Rab8a, Slp4a, Munc18-2 и Vamp7 следует из их взаимодействий и из нарушений полярности клеток, а не из отдельной проверки положения NHE3. Роль экзоциста и завершающая роль Rab-GAP остаются предположениями. Сигналы, по которым белки распределяются между путями, не найдены; для DPPIV, сахаразы-изомальтазы и аминопептидазы N предполагают путь в обход рециклирующих эндосом, но это не доказано. У части больных и у мышей без Rab8 или Rab11 эти ферменты задерживаются внутри клетки, а в других биоптатах доставка DPPIV и сахаразы-изомальтазы сохранена (обсуждение в Vogel 2015), поэтому разделение путей — результат на клетках Caco-2, а не правило для всех апикальных грузов и тканей.</p><p>Долго считалось, что тяжи плотного контакта — «изгородь», не пропускающая белки и липиды между доменами. Проверка вмешательством оказалась поучительной. В клетках MDCK II без пяти основных клаудинов тяжей нет, сопротивление монослоя снижено примерно втрое, но апикальные и базолатеральные маркеры распределены как в норме (Otani 2019). Значит, граница доменов поддерживается в основном доставкой, удержанием на каркасах и удалением. Мембранные белки контакта при этом не безразличны: при одновременном удалении клаудинов и JAM-A у части клеток полярность нарушалась (Otani 2019). Для липидов, которые диффундируют быстрее, барьер у контакта, вероятно, важнее (Günzel 2026).</p><p>Каркас плотного контакта ZO-1 и ZO-2 — отдельный вопрос: в клетках MDCK II без обоих белков полярность нарушалась (Otani 2019), а в клетках EpH4 с подавлением обоих белков сохранялась (Umeda 2006). Результат зависит от типа клеток. Схема рассчитана по учебной модели практикума.</p><div class="note trap"><strong>Типичная ошибка</strong> Полярность эпителия поддерживается плотным контактом: без него белки апикальной и базолатеральной мембран сразу перемешиваются.<p class="trap-fix">Без тяжей клаудинов слабеет барьер, но распределение многих белков по доменам сохраняется: его поддерживают направленная доставка и удаление ошибочно доставленного белка.</p></div><div class="static-quiz"><h3>В клетках Caco-2 нет миозина Vb. Где окажутся переносчик NHE3 и фермент DPPIV?</h3><ol><li><b>А.</b> NHE3 и DPPIV — на апикальной мембране, как в норме <i>(неверный вариант)</i><br><span class="expl">DPPIV действительно остаётся на апикальной мембране, но NHE3 без миозина Vb туда не доставляется и распределяется в пузырьках по цитоплазме.</span></li><li><b>Б.</b> NHE3 — в пузырьках, DPPIV — на апикальной мембране <i>(верный вариант)</i><br><span class="expl">Миозин Vb переносит пузырьки с NHE3 к апикальной мембране, а DPPIV доставляется другим путём; так показана избирательность апикальной доставки (Vogel 2015).</span></li><li><b>В.</b> NHE3 и DPPIV — в пузырьках под апикальной мембраной <i>(неверный вариант)</i><br><span class="expl">Миозин Vb нужен не всем апикальным белкам: DPPIV доставляется другим путём и остаётся на апикальной мембране, в пузырьках задерживается только NHE3.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-2.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.201506112">Vogel G. F. et al. 2015. Cargo-selective apical exocytosis in epithelial cells is conducted by Myo5B, Slp4a, Vamp7, and Syntaxin 3. J Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.201812157">Otani T. et al. 2019. Claudins and JAM-A coordinately regulate tight junction formation and epithelial polarity. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/j.cell.2006.06.043">Umeda K. et al. 2006. ZO-1 and ZO-2 independently determine where claudins are polymerized in tight-junction strand formation. Cell</a></li><li><a href="https://doi.org/10.1038/s41580-026-00978-w">Günzel D., Lehmann M., Honigmann A. 2026. Tight junction structure, assembly and (dys)function. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nrm3775">Rodriguez-Boulan E., Macara I. G. 2014. Organization and execution of the epithelial polarity programme. Nat Rev Mol Cell Biol</a></li></ul><p>Vogel 2015: клетки Caco-2 с мутацией MYO5B больного (1125G&gt;A), фильтры и трёхмерные цисты. Otani 2019: клетки MDCK II без пяти основных клаудинов, сопротивление 52,5 → 14,5–19,8 Ом·см². Umeda 2006: клетки EpH4 с нокаутом ZO-1 и подавлением ZO-2. Схема — расчёт учебной модели практикума (вопрос 4, продвинутый уровень), числа условны, кроме сопротивления без клаудинов. Цепочка передач: Vogel 2015 — клетки Caco-2 (нокин MYO5B 1125G&gt;A, нокауты Stx3, Rab8a, Vamp3 методом CRISPR/Cas9, подавление Rab11a малой шпилечной РНК); взаимодействия — совместная очистка активных мутантов Rab8a Q67L и Rab11a Q70L из лизатов; положение NHE3, CFTR, GL
