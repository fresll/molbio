орме после такой обработки исчезает.", "p2a_6_q": "Кардиомиоциты без PLN (PLN⁻/⁻): до изопротеренола время полуспада Ca²⁺-транзиента 110 мс. Изопротеренол добавили на 1-й мин. Как изменится время полуспада к 10-й мин опыта?", "p2a_6_o1": "Не изменится: без PLN у PKA нет мишеней", "p2a_6_o2": "Сократится примерно на 40 %, как в нормальных клетках с PLN", "p2a_6_o3": "Сократится немного, примерно на 14 %", "p2a_6_e": "Без PLN торможения SERCA2a нет уже в покое, поэтому базальный спад Ca²⁺ быстрый (110 мс против 180 мс в норме). При изопротереноле время полуспада сокращается лишь до 95 мс — за счёт других эффектов β-стимуляции. В опытах Wolska 1996 ответ кардиомиоцитов PLN⁻/⁻ на изопротеренол был меньше, чем в норме, но сохранялся.", "p2a_6_w1": "PKA в кардиомиоците фосфорилирует много белков, в том числе тропонин I, поэтому небольшое ускорение спада Ca²⁺ сохраняется и без PLN.", "p2a_6_w2": "В норме большая часть ускорения спада Ca²⁺ обусловлена снятием торможения SERCA2a, которое создаёт фосфоламбан. Без PLN этот путь отсутствует, и ответ гораздо меньше.", "gn_pln": "Фосфоламбан (PLN)", "g_pln": "Небольшой мембранный белок саркоплазматического ретикулума кардиомиоцита (52 аминокислоты). Нефосфорилированный PLN связывается с SERCA2a и снижает её кажущееся сродство к Ca²⁺, поэтому при субмикромолярной [Ca²⁺] насос работает медленнее. PKA фосфорилирует PLN по Ser16, CaMKII — по Thr17 (нумерация у человека и мыши совпадает); фосфорилирование снимает торможение, PP1 возвращает PLN в тормозящую форму. В модели учтён только Ser16.", "gn_serca": "SERCA", "g_serca": "Ca²⁺-АТФаза мембраны эндоплазматического (в мышцах — саркоплазматического) ретикулума: за счёт гидролиза ATP переносит Ca²⁺ из цитозоля в просвет против градиента концентрации. В кардиомиоците работает изоформа SERCA2a, которую тормозит фосфоламбан; в большинстве других клеток — SERCA2b. Тапсигаргин необратимо подавляет все изоформы SERCA (Lytton 1991). Ca²⁺, вошедший в клетку через Orai1, сначала оказывается в цитозоле; в просвет ЭПР его переносит SERCA.", "gn_pp1": "PP1", "g_pp1": "Протеинфосфатаза 1 — серин-треониновая фосфатаза; её каталитическая субъединица образует множество голоферментов с разными регуляторными субъединицами, которые определяют субстратную специфичность и внутриклеточную локализацию. В кардиомиоците PP1 — основная фосфатаза фосфоламбана; при β-стимуляции PKA фосфорилирует белок ингибитор-1, и фосфорилированный ингибитор-1 подавляет PP1 (Kranias и Hajjar 2012). В модели активность PP1 постоянна.", "gn_pki": "PKI", "g_pki": "Пептидный ингибитор PKA, производный от природного белка-ингибитора: связывается с каталитической субъединицей в участке связывания субстрата (Ki порядка нМ — Cheng 1986). Он избирательнее низкомолекулярных ингибиторов вроде H-89, который при используемых в клетках концентрациях подавляет и другие киназы; но и у вариантов PKI, проникающих через мембрану, описаны эффекты, не связанные с PKA (Liao 2011).", "gn_caly": "Каликулин A", "g_caly": "Природный токсин, ингибитор серин-треониновых фосфатаз PP1 и PP2A в наномолярных концентрациях (IC50 около 2 нМ для PP1 и 0,5–1 нМ для PP2A — Ishihara 1989). Неизбирателен: повышает фосфорилирование очень многих белков, поэтому рост фосфорилирования одного белка после каликулина не указывает, какая фосфатаза его дефосфорилирует.", "gn_lpp": "λ-фосфатаза", "g_lpp": "Фосфатаза бактериофага λ, отщепляющая фосфат от остатков серина, треонина и тирозина. Обработка лизата λ-фосфатазой перед электрофорезом — контроль специфичности фосфоспецифичного антитела: сигнал, который исчезает после обработки, принадлежит фосфорилированной форме белка (Dephoure 2013).", "gn_camk2": "CaMKII", "g_camk2": "Ca²⁺/кальмодулин-зависимая протеинкиназа II. В кардиомиоците фосфорилирует фосфоламбан по Thr17 при высокой концентрации Ca²⁺ (например, при частой стимуляции). Фосфорилирование Thr17 in vivo зависит от предварительного фосфорилирования Ser16 (Luo 1998). В модели этот участок не учтён.", "s3_memb": "плазматическая мембрана (внутренняя сторона)", "s3_out": "цитоплазма", "gt_nonf1": "нет NF1", "gt_g12c": "KRAS G12C", "gt_g12v": "KRAS G12V", "gt_q61l": "KRAS Q61L", "gt_dead": "KRAS G12C + Q61L", "gt_other": "клетки без KRAS G12C", "gt_x": "неизвестные", "s3b_gdp": "RAS-GDP", "s3b_gtp": "RAS-GTP", "s3b_exlab": "обмен GDP на GTP", "s3b_hylab": "гидролиз GTP", "s3b_sos": "GEF (SOS1)", "s3b_nf1": "NF1 (GAP)", "s3b_gap": "p120GAP и др.", "s3b_surf": "одна поверхность switch I/II: конкуренция", "s3b_gef": "Активность GEF (SOS1)", "s3b_pcap": "Зависимость стационарной доли RAS-GTP от активности GEF (учебная модель, относительные величины)", "s3b_pcap_blind": "Показан контроль — нормальные клетки. Результат для проверяемого варианта появится на графике после ответа (учебная модель, относительные величины).", "s3b_l_var": "выбранный вариант", "s3b_l_wt": "норма", "s3b_r_gtp": "Доля RAS в GTP-форме (% всего RAS)", "s3b_r_tau": "Время релаксации", "s3b_r_tau_s": "время выхода на новое стационарное состояние, τ = 1/(сумма эффективных констант); учебные единицы", "s3b_r_basal": "Доля RAS-GTP без сигнала", "s3b_r_basal_s": "при активности GEF, равной нулю", "s3b_r_gain": "Прирост от сигнала", "s3b_r_gain_s": "разность между текущей долей RAS-GTP и долей без сигнала (в процентных пунктах)", "s3b_r_gain_wt": "Прирост у нормального RAS", "s3b_r_gain_wt_s": "при той же активности GEF, для сравнения (в процентных пунктах)", "s3b_r_raf": "RAS-GTP, связанный с RAF (% всего RAS)", "s3b_r_pi3k": "RAS-GTP, связанный с PI3K (% всего RAS)", "s3b_r_ralgds": "RAS-GTP, связанный с RALGDS (% всего RAS)", "s3b_take": "Долю RAS в активной GTP-форме определяют собственные скорости обмена нуклеотида и гидролиза GTP у данного варианта RAS, а также активность GEF (SOS1), ускоряющего обмен, и GAP (NF1 и p120GAP), ускоряющих гидролиз. В норме без сигнала доля RAS-GTP мала; сигнал от рецептора повышает её, усиливая обмен. Повысить долю RAS-GTP можно и ослаблением гидролиза: при потере NF1 при той же активности GEF доля активной формы выше. Онкогенные варианты смещают цикл по-разному: G12C и G12V сохраняют зависимость от сигнала, Q61L почти её утратил. Три группы эффекторов связываются с одной и той же поверхностью switch I / switch II и конкурируют за активный RAS.", "s3b_c_wt_rest": "Активность GEF близка к нулю: обмен GDP на GTP идёт только с собственной медленной скоростью, а гидролиз, ускоренный GAP, быстро возвращает RAS в GDP-форму. Поэтому доля RAS-GTP мала, и эффекторы почти не привлекаются к мембране.", "s3b_c_wt_rest_z": "В отсутствие сигнала путь RAS неактивен: базальная доля активной формы низкая, и без внешнего стимула пролиферация не запускается.", "s3b_c_wt_sig": "Сигнал от рецептора повышает активность GEF: SOS1 ускоряет обмен GDP на GTP, и доля RAS-GTP растёт. GAP продолжают ускорять гидролиз, поэтому стационарная доля задаётся отношением двух активностей, а не одним обменом.", "s3b_c_wt_sig_z": "Сила ответа определяется долей активной формы: чем выше активность GEF, тем больше RAS-GTP и тем сильнее привлечение эффекторов.", "s3b_c_nonf1_rest": "GAP-активность клетки снижена (нейрофибромина нет, остаются p120GAP и другие GAP). Без сигнала обмен всё равно медленный, поэтому доля RAS-GTP пока невелика, но уже немного выше, чем в норме.", "s3b_c_nonf1_rest_z": "Ослабление инактивации RAS само по себе, без стимула, повышает базальную долю активной формы лишь немного: при нулевой активности GEF активной формы образуется мало, и то, что она дольше сохраняется, почти не сказывается.", "s3b_c_nonf1_sig": "При той же активности GEF доля RAS-GTP выше, чем в норме (сплошная линия на графике идёт над пунктиром): гидролиз замедлен, и активная форма сохраняется дольше. Сигнал усилен не за счёт активации рецептора, а за счёт ослабления инактивации RAS.", "s3b_c_nonf1_sig_z": "Клинически значимое повышение активности пути достигается двумя способами — усилением прямой реакции (обмена) или ослаблением обратной (гидролиза). Потеря NF1 — пример второго.", "s3b_c_g12c_rest": "Активности GEF нет. KRAS G12C сохраняет собственный гидролиз почти как у нормального белка, но GAP его почти не ускоряет. Поэтому соотношение собственных скоростей обмена и гидролиза поддерживает заметную долю белка в GTP-форме и без сигнала — выше, чем в норме, но ниже, чем у этого же варианта при сигнале.", "s3b_c_g12c_rest_z": "G12C не зафиксирован во включённом состоянии: он продолжает переходить между GDP- и GTP-формами, и доля GTP-формы зависит от вышележащего сигнала. На этом свойстве основано действие ковалентного ингибитора.", "s3b_c_g12c_sig": "Сигнал через GEF ускоряет обмен, и доля RAS-GTP у KRAS G12C высокая. Собственный гидролиз сохранён почти как у нормального белка, но GAP его почти не ускоряет, поэтому инактивация ослаблена и активная форма преобладает.", "s3b_c_g12c_sig_z": "Поскольку зависимость от вышележащего сигнала сохранена, подавление этого сигнала (ингибитор EGFR или SOS1) снижает долю RAS-GTP и у онкогенного G12C.", "s3b_c_g12v_rest": "Гидролиз GTP у KRAS G12V почти не ускоряется GAP, а собственный гидролиз снижен сильнее, чем у G12C. Поэтому без сигнала доля RAS-GTP ещё выше, чем у G12C, хотя и не предельная.", "s3b_c_g12v_rest_z": "Разные замены ослабляют гидролиз по-разному: описывать их одной фразой «выключатель навсегда включён» неверно, различие имеет фармакологические следствия.", "s3b_c_g12v_sig": "При сигнале доля RAS-GTP у KRAS G12V приближается к предельной: обмен ускорен, а гидролиз ослаблен сильнее, чем у G12C. Зависимость от сигнала сохраняется, но ослаблена.", "s3b_c_g12v_sig_z": "Чем сильнее ослаблен гидролиз, тем выше доля активной формы и тем слабее она зависит от рецептора.", "s3b_c_q61l_rest": "KRAS Q61L почти лишён и собственного, и GAP-стимулированного гидролиза: глутамин 61 — каталитический остаток. Поэтому даже без сигнала большая часть белка находится в GTP-форме.", "s3b_c_q61l_rest_z": "Когда гидролиз почти остановлен, связанный GTP сохраняется, и доля активной формы остаётся высокой независимо от сигнала.", "s3b_c_q61l_sig": "Повышение активности GEF увеличивает долю RAS-GTP у KRAS Q61L меньше, чем у нормального RAS: прирост около 16 процентных пунктов против 39. Доля активной формы высока уже без сигнала (около 83 %). Гидролиз почти утрачен, поэтому соотношение обмена и гидролиза смещено к активной форме при любой активности GEF.", "s3b_c_q61l_sig_z": "Зависимость от сигнала у Q61L почти исчезла. Ковалентные ингибиторы KRAS G12C на этот вариант не действуют: у него нет цистеина-12. Двойной мутант G12C + Q61L к таким ингибиторам устойчив по другой причине: его GDP-форма почти не образуется (продвинутый уровень).", "p3b_1_q": "Нормальные клетки, RAS дикого типа. Активность GEF (SOS1) повышают с нуля до 60 % от максимальной. Как изменится доля RAS в GTP-форме?", "p3b_1_o1": "Заметно вырастет: обмен ускорен", "p3b_1_o2": "Почти не изменится", "p3b_1_o3": "Доля RAS-GTP снизится", "p3b_1_e": "SOS1 ускоряет обмен GDP на GTP, поэтому стационарная доля активной формы повышается. Доля RAS-GTP растёт примерно с 1 до 40 %. GAP продолжают ускорять гидролиз, поэтому доля RAS-GTP выходит на новое стационарное значение, а не на предельное.", "p3b_1_w2": "Повышение активности GEF непосредственно ускоряет обмен GDP на GTP, и доля активной формы не может остаться прежней: без сигнала она была около 1 %, при 60 % активности GEF — около 40 %.", "p3b_1_w3": "Снижение доли RAS-GTP означало бы ускорение гидролиза или замедление обмена. Здесь усилен обмен, поэтому активной формы становится больше, а не меньше.", "p3b_2_q": "В клетках без нейрофибромина (NF1) активность GEF поддерживают на уровне 60 %. Как доля RAS-GTP соотносится с долей в нормальных клетках при той же активности GEF (пунктир на графике)?", "p3b_2_o1": "Такая же, как в норме", "p3b_2_o2": "Ниже, чем в норме", "p3b_2_o3": "Выше, чем в норме", "p3b_2_e": "NF1 — GAP для RAS: он ускоряет гидролиз GTP. Без него GAP-активность клетки снижена, активная форма сохраняется дольше, и при той же активности GEF доля RAS-GTP выше (около 57 % против 40 % в норме — сплошная линия идёт над пунктиром). Другие GAP (p120GAP и др.) сохраняются, поэтому инактивация RAS ослаблена, но не устранена.", "p3b_2_w1": "Нейрофибромин действует не на рецептор, а на сам RAS: его GAP-домен ускоряет гидролиз GTP. Поэтому его потеря меняет долю активной формы, а не работу рецептора.", "p3b_2_w2": "Ослабление гидролиза не может снизить долю активной формы. При замедленной инактивации RAS-GTP сохраняется дольше, и его доля выше нормы, а не ниже.", "p3b_3_q": "Клетки с KRAS G12C. В модели активность GEF равна нулю: нет ни сигнала от рецептора, ни базальной активности GEF. Какова доля RAS-GTP?", "p3b_3_o1": "Близка к нулю, как у нормального RAS без сигнала", "p3b_3_o2": "Повышена, но при включении сигнала растёт ещё", "p3b_3_o3": "Предельная и от сигнала не зависит", "p3b_3_e": "KRAS G12C сохраняет собственный гидролиз почти как у нормального белка, но GAP его почти не ускоряет. Поэтому соотношение собственных скоростей обмена и гидролиза поддерживает около 45 % белка в GTP-форме даже при нулевой активности GEF. При включении сигнала (активность GEF 60 %) доля поднимается примерно до 97 %. Этот вариант продолжает переходить между GDP- и GTP-формами, и доля RAS-GTP зависит от сигнала.", "p3b_3_w1": "В отличие от нормального RAS, у G12C гидролиз почти не ускоряется GAP, поэтому часть белка остаётся в GTP-форме и без сигнала. Доля активной формы здесь не близка к нулю, а повышена.", "p3b_3_w3": "G12C не зафиксирован в активном состоянии: собственный гидролиз у него сохранён, и включение сигнала заметно повышает долю RAS-GTP. Значит, она зависит от сигнала.", "p3b_4_q": "Клетки с KRAS Q61L (гидролиз GTP почти утрачен). Активность GEF повышают с нуля до 60 %. Показан контроль — нормальный RAS при тех же значениях активности GEF. Как прибавка доли RAS-GTP (в процентных пунктах) у Q61L соотносится с прибавкой у нормального RAS?", "p3b_4_o1": "Меньше, чем у нормального RAS", "p3b_4_o2": "Такая же, как у нормального RAS", "p3b_4_o3": "Больше, чем у нормального RAS", "p3b_4_e": "Глутамин 61 — каталитический остаток гидролиза; его замена почти лишает RAS и собственного, и GAP-стимулированного гидролиза. Поэтому большая часть белка находится в GTP-форме уже без сигнала (около 83 %), и при повышении активности GEF до 60 % доля возрастает почти до 100 %: прибавка около 16 процентных пунктов против 39 у нормального RAS. Зависимость от сигнала у Q61L почти исчезла.", "p3b_4_w2": "Такой же прирост был бы, если бы гидролиз у Q61L оставался ускоренным GAP, как у нормального RAS. Но он почти утрачен: GTP-форма преобладает ещё до сигнала, и возможный прирост её доли мал. Прибавка меньше, чем у нормального RAS (около 16 процентных пунктов против 39).", "p3b_4_w3": "Большей прибавки получить нельзя: при почти утраченном гидролизе активная форма преобладает ещё до сигнала, а доля RAS-GTP не может превысить 100 %. Поэтому прибавка у Q61L меньше, чем у нормального RAS.", "p3b_5_q": "Активность GEF повышают с нуля до 60 % по очереди в клетках с KRAS G12C и в клетках с KRAS G12V. Как изменится доля RAS-GTP?", "p3b_5_o1": "Заметно растёт у обоих вариантов", "p3b_5_o2": "Не меняется ни у одного варианта", "p3b_5_o3": "Растёт у KRAS G12V, но не изменяется у KRAS G12C", "p3b_5_e": "У обоих вариантов GAP почти не ускоряет гидролиз, но собственный гидролиз сохранён, поэтому белок продолжает переходить между GDP- и GTP-формами. При включении сигнала доля RAS-GTP заметно растёт: у G12C примерно с 45 до 97 %, у G12V примерно с 71 до 99 %. Прибавка у G12C больше: его собственный гидролиз сохранён почти как у нормального белка, поэтому без сигнала доля RAS-GTP ниже. Оба отличаются от Q61L, у которого зависимость от сигнала почти исчезла.", "p3b_5_w2": "Практически зафиксирован в GTP-форме вариант с почти утраченным гидролизом, например Q61L. У G12C и G12V гидролиз сохранён, поэтому при включении сигнала доля активной формы заметно растёт.", "p3b_5_w3": "Рост не ограничен одним вариантом: доля RAS-GTP растёт с активностью GEF и у G12C, и у G12V. Различаются лишь исходная доля и величина прибавки.", "s3a_hylab": "гидролиз GTP", "s3a_hylab_g12c": "собственный гидролиз GTP сохранён", "s3a_hylab_dead": "гидролиз GTP резко замедлен", "s3a_hylab_other": "гидролиз GTP (другой вариант RAS)", "s3a_inh": "ковалентный ингибитор\nG12C", "s3a_bound": "KRAS G12C, связанный \nс ингибитором", "s3a_mut_t": "KRAS", "s3a_iv_t": "Вместе с ингибитором", "iv3_none": "нет", "iv3_egf": "EGF", "iv3_egfri": "ингибитор EGFR", "iv3_egfri_s": "ингибитор EGFR", "iv3_bi": "BI-3406 (SOS1)", "s3a_tslider": "Время после добавления ингибитора", "myst_show": "Показать ответ", "s3a_mask": "Что можно заключить по блоту?", "s3a_l_b": "связано с ингибитором", "s3a_l_ras": "RAS-GTP", "s3a_l_ref": "контроль: G12C без добавок, связано с ингибитором", "s3a_blot_rec": "Записать дорожки 0–30–60–120 мин", "s3a_clock": "{m} мин", "s3a_pcap": "{c}. Доли от всего KRAS G12C. Исходное состояние одно для всех условий — клетки без добавок; ингибитор и добавки внесены в момент 0 (учебная модель по Lito 2016).", "s3a_pcap_blind": "{c}. Показаны исходное состояние (0 мин) и контроль — KRAS G12C без добавок (серый пунктир). Ход опыта появится на графике после ответа.", "s3a_pcap_x": "Неизвестные клетки: данные записаны только в блот; график и показания скрыты до раскрытия.", "s3a_r_bound": "KRAS, связанный с ингибитором (% всего KRAS G12C)", "s3a_r_ras": "KRAS в GTP-форме, RAS-GTP (% всего KRAS G12C)", "s3a_r_rel": "RAS-GTP относительно исходного", "s3a_r_rel_s": "100 % — доля RAS-GTP в момент добавления ингибитора; значение может быть выше 100 %", "s3a_r_perk": "pERK (% максимального ответа в модели)", "s3a_take": "Ковалентный ингибитор связывается с KRAS G12C только в GDP-форме и необратимо удерживает белок в этом состоянии. Поэтому захват идёт не мгновенно, а по мере того, как молекулы гидролизуют GTP и проходят через GDP-форму. Скорость захвата зависит от скорости гидролиза, скорости обмена и скорости связывания ингибитора с GDP-формой: если гидролиз почти утрачен (двойной мутант G12C + Q61L), GDP-форма почти не образуется и захвата почти нет; EGF ускоряет обмен и замедляет захват, а подавление сигнала выше RAS (ингибитор EGFR или ингибитор SOS1 BI-3406) ускоряет его. Вслед за долей RAS-GTP снижается содержание pERK.", "b3_rasgtp": "RAS-GTP (pull-down с RBD RAF)", "b3_ras": "RAS общий", "b3_perk": "pERK", "b3_erk": "ERK общий", "s3a_blot_note": "Интенсивность полос: RAS-GTP — доля всего KRAS G12C в GTP-форме; pERK — доля максимального ответа в модели; общий RAS и общий ERK — контроль загрузки; во всех дорожках их количество одинаково.", "bl3_egfri": "иEGFR", "bl3_bi": "BI", "s3a_c_none_start": "Ингибитор только что добавлен. KRAS G12C переходит между GTP- и GDP-формами: часть белка находится в GTP-форме, часть — в GDP-форме. Связанных с ингибитором молекул ещё почти нет, доля RAS-GTP и содержание pERK близки к исходным значениям.", "s3a_c_none_start_z": "Отсчёт идёт от исходного состояния до добавления ингибитора: так видно, что захват развивается во времени, а не мгновенно.", "s3a_c_none": "Молекулы KRAS G12C захватываются по мере того, как они гидролизуют GTP и переходят в GDP-форму: связанная с ингибитором доля растёт, а RAS-GTP и pERK снижаются. Без дополнительного EGF захват зависит от гидролиза GTP, сохраняющегося базального обмена и скорости связывания ингибитора.", "s3a_c_none_z": "Захват необратим, поэтому со временем всё больше молекул выходит из цикла в связанное состояние, а передача сигнала к RAF и ERK ослабевает.", "s3a_c_none_late": "Большая часть KRAS G12C уже связана с ингибитором; доля RAS-GTP и содержание pERK заметно снижены относительно исходных значений. Оставшиеся свободные молекулы продолжают переходить в GDP-форму и захватываться.", "s3a_c_none_late_z": "Ковалентная связь удерживает белок в неактивном состоянии надолго, поэтому эффект накапливается и сохраняется.", "s3a_c_egf": "EGF активирует SOS1, обмен GDP на GTP ускоряется, и доля RAS-GTP быстро возрастает: большая часть KRAS G12C находится в GTP-форме. GDP-формы, которую связывает ингибитор, остаётся мало, поэтому захват идёт медленнее, чем без добавок (серый пунктир).", "s3a_c_egf_z": "Вышележащий сигнал поддерживает активную форму и защищает онкобелок от ингибитора: это объясняет, почему эффект препарата зависит от сигнального окружения клетки.", "s3a_c_fast_start": "Сигнал от рецептора подавлен, обмен GDP на GTP замедлен. Ингибитор только что добавлен, связанных молекул ещё мало, но условия для быстрого захвата уже созданы.", "s3a_c_fast_start_z": "Подавление обмена смещает цикл к GDP-форме — той самой, которую связывает ингибитор.", "s3a_c_fast": "Сигнал от рецептора подавлен (ингибитор EGFR или BI-3406), обмен замедлен, поэтому KRAS G12C чаще находится в GDP-форме и захватывается ингибитором быстрее, чем без добавок (серый пунктир). Доля RAS-GTP и содержание pERK снижаются быстрее.", "s3a_c_fast_z": "Сочетание ковалентного ингибитора с подавлением обмена усиливает и ускоряет подавление пути; на этом основаны комбинированные схемы лечения.", "s3a_c_dead": "У двойного мутанта KRAS G12C + Q61L гидролиз GTP почти утрачен, поэтому GDP-форма почти не образуется. Ингибитор связывает только GDP-форму, и захвата почти нет: доля RAS-GTP и содержание pERK остаются близкими к исходным значениям.", "s3a_c_dead_z": "Это проверка механизма: если гидролиз GTP устранён, ингибитор перестаёт действовать; следовательно, он действует именно через GDP-форму, которая образуется при гидролизе GTP.", "s3a_c_myst": "Записаны две серии дорожек: контрольный KRAS G12C и неизвестные клетки. В неизвестных клетках RAS-GTP не снижается. Такое наблюдение совместимо с несколькими причинами, поэтому состояние клеток по дорожкам не определить. Нажмите «Показать ответ», когда решите.", "s3a_c_myst_z": "Метод RBD pull-down измеряет, сколько RAS находится в GTP-форме, но не определяет генотип и не объясняет причину. Для вывода о генотипе и о захвате мишени нужны независимые опыты — секвенирование и измерение связывания ингибитора.", "s3a_c_ans_g12c": "В неизвестных клетках экспрессируется обычный KRAS G12C: RAS-GTP со временем снижается, как в контроле. Гидролиз сохранён, GDP-форма образуется, ингибитор захватывает белок.", "s3a_c_ans_g12c_z": "Снижение доли RAS-GTP при действии ингибитора показывает, что белок продолжает переходить между GTP- и GDP-формами.", "s3a_c_ans_dead": "В неизвестных клетках экспрессируется двойной мутант KRAS G12C + Q61L: RAS-GTP почти не снижается. Гидролиз почти утрачен, GDP-форма почти не образуется, и ингибитору не с чем связываться.", "s3a_c_ans_dead_z": "В этой учебной загадке раскрыт двойной мутант G12C + Q61L. В реальном опыте наличие цистеина-12, одинаковое накопление препарата и прежняя активность SOS1 ещё не устанавливают причину устойчивости: требуются измерение гидролиза и секвенирование всего гена KRAS.", "s3a_c_ans_other": "Неизвестные клетки не содержат KRAS G12C: ингибитору не с чем связываться, а RBD-проба выявляет активную форму другой ГТФазы RAS. RAS-GTP не снижается — внешне так же, как у двойного мутанта.", "s3a_c_ans_other_z": "Одинаковые дорожки получены при разных состояниях клеток. Поэтому по одному pull-down причину установить нельзя: её различают секвенированием генотипа и измерением захвата мишени.", "p3a_1_q": "Клетки с двойным мутантом KRAS G12C + Q61L (гидролиз GTP почти утрачен). В момент 0 добавлен ковалентный ингибитор G12C, дополнительный EGF не вносят. Серым пунктиром показан контроль — связывание ингибитора в клетках с обычным KRAS G12C. Какая доля KRAS окажется связанной с ингибитором через 2 ч?", "p3a_1_o1": "Почти весь белок", "p3a_1_o2": "Около половины", "p3a_1_o3": "Лишь малая доля молекул", "p3a_1_e": "Ингибитор связывает KRAS G12C только в GDP-форме. При почти утраченном гидролизе (замена Q61L) белок почти не переходит в GDP-форму, поэтому за 2 ч связывается менее 5 % молекул, а RAS-GTP остаётся на прежнем уровне. Двойной мутант устойчив к ингибитору.", "p3a_1_w1": "Полный захват требует, чтобы белок проходил через GDP-форму. Без гидролиза этого почти не происходит, поэтому за 2 ч связывается лишь малая доля.", "p3a_1_w2": "Даже половинного захвата не будет: GDP-форма, которую связывает ингибитор, при почти утраченном гидролизе почти не образуется.", "p3a_2_q": "Клетки с KRAS G12C. В момент 0 одновременно добавлены ингибитор G12C и EGF; исходное состояние клеток — как в контроле. Как изменится скорость захвата по сравнению с контролем — клетками без EGF (серый пунктир)?", "p3a_2_o1": "Скорость станет выше", "p3a_2_o2": "Скорость станет ниже", "p3a_2_o3": "Скорость не изменится", "p3a_2_e": "EGF активирует SOS1 и ускоряет обмен GDP на GTP: доля RAS-GTP быстро возрастает более чем вдвое. KRAS G12C чаще находится в GTP-форме, GDP-формы, которую связывает ингибитор, остаётся меньше, и захват идёт медленнее: за 2 ч связано около 45 % против примерно 90 % без EGF.", "p3a_2_w1": "EGF усиливает обмен и удерживает белок в GTP-форме, а не в GDP-форме. Поэтому мишени для ингибитора становится меньше и захват замедляется, а не ускоряется.", "p3a_2_w3": "Сигнал от рецептора меняет долю GDP-формы, а значит и скорость захвата. Кривая с EGF идёт заметно ниже кривой без добавок.", "p3a_3_q": "Клетки с KRAS G12C. В момент 0 одновременно добавлены ингибитор G12C и ингибитор EGFR; исходное состояние клеток — как в контроле. Как изменится скорость захвата по сравнению с контролем — клетками без ингибитора EGFR (серый пунктир)?", "p3a_3_o1": "Скорость станет выше", "p3a_3_o2": "Скорость станет ниже", "p3a_3_o3": "Скорость не изменится", "p3a_3_e": "Ингибитор EGFR ослабляет активацию SOS1 и замедляет обмен GDP на GTP. KRAS G12C чаще оказывается в GDP-форме, и ингибитор G12C захватывает его быстрее: за 1 ч связано около 79 % против примерно 71 % без ингибитора EGFR, а доля RAS-GTP снижается до 19 % от исходной против 44 %.", "p3a_3_w2": "Подавление сигнала от рецептора не замедляет захват: оно смещает цикл к GDP-форме — мишени ингибитора. Поэтому захват ускоряется.", "p3a_3_w3": "Снижение обмена меняет долю GDP-формы, поэтому захват не остаётся прежним, а ускоряется.", "p3a_4_q": "Клетки с KRAS G12C. В момент 0 одновременно добавлены ингибитор G12C и BI-3406 — ингибитор SOS1; исходное состояние клеток — как в контроле. Как изменится скорость захвата по сравнению с контролем — клетками без BI-3406 (серый пунктир)?", "p3a_4_o1": "Скорость станет ниже", "p3a_4_o2": "Скорость не изменится", "p3a_4_o3": "Скорость станет выше", "p3a_4_e": "BI-3406 подавляет SOS1 — фактор обмена, поэтому обмен GDP на GTP замедляется, как и при ингибиторе EGFR. KRAS G12C чаще находится в GDP-форме, и захват ускоряется: за 1 ч связано около 79 % против примерно 71 % без BI-3406.", "p3a_4_w1": "Подавление обмена не замедляет захват: чем медленнее обмен, тем больше GDP-формы, которую связывает ингибитор, поэтому захват идёт быстрее.", "p3a_4_w2": "BI-3406 меняет скорость обмена, а значит и долю GDP-формы, поэтому захват не остаётся таким же, как без добавок, а ускоряется.", "p3a_5_q": "Клетки с KRAS G12C. В момент 0 добавлен ингибитор G12C, дополнительный EGF не вносят. При сохранной базальной активности SOS1 какой процесс образует GDP-форму, необходимую для дальнейшего захвата ингибитором?", "p3a_5_o1": "Обмен GDP на GTP, ускоряемый SOS1", "p3a_5_o2": "Собственный гидролиз GTP у KRAS G12C", "p3a_5_o3": "Связывание ингибитора G12C с активной GTP-формой KRAS", "p3a_5_e": "Гидролиз GTP образует GDP-форму, которую связывает ингибитор. Базальный обмен через SOS1 при этом сохраняется и возвращает часть GDP-формы в GTP-форму. Чем быстрее гидролиз, тем чаще образуется GDP-форма и тем быстрее идёт захват. Именно сохранённый гидролиз делает KRAS G12C доступным для ингибитора.", "p3a_5_w1": "SOS1 ускоряет обмен GDP на GTP, поэтому уменьшает доступный для ингибитора пул GDP-формы. Базальный обмен в этой модели сохраняется и без добавленного EGF; новую GDP-форму из GTP-формы образует гидролиз.", "p3a_5_w3": "Ингибитор связывает не GTP-, а GDP-форму и сам её не образует: он лишь необратимо удерживает GDP-форму, которая уже образовалась при гидролизе GTP.", "p3a_6_q": "Загадка, часть 1. После добавления ингибитора G12C записаны две серии дорожек 0–30–60–120 мин: первая — контрольные клетки с KRAS G12C, вторая — неизвестные клетки. В неизвестных клетках RAS-GTP за 2 ч почти не снизился. Что можно заключить из этих дорожек?", "p3a_6_o1": "По дорожкам причину не определить", "p3a_6_o2": "Это обязательно клетки с утратой гидролиза GTP, например двойной мутант KRAS G12C + Q61L", "p3a_6_o3": "Это обязательно клетки без KRAS G12C", "p3a_6_e": "Метод RBD pull-down выявляет активную форму RAS, но не определяет генотип и не объясняет, почему доля RAS-GTP не меняется. Такие дорожки получатся и при утрате гидролиза (GDP-форма почти не образуется, и ингибитору не с чем связываться), и в клетках без KRAS G12C, где активен другой вариант RAS, не являющийся мишенью аллель-специфичного ингибитора. Возможны и другие причины, например недостаточное действие препарата. Чтобы выбрать между ними, нужны независимые опыты на генотип и на захват мишени.", "p3a_6_w2": "Утрата гидролиза — одно из возможных объяснений, но не единственное. Неизменный RAS-GTP наблюдают и тогда, когда в клетках нет KRAS G12C, а активен другой вариант RAS: он не мишень ингибитора G12C, но RBD-проба выявляет его активную форму. Вывод «обязательно» дорожки не обосновывают.", "p3a_6_w3": "Отсутствие KRAS G12C — одно из возможных объяснений, но не единственное. Тот же результат даёт и KRAS G12C с почти утраченным гидролизом: GDP-форма почти не образуется, и ингибитору не с чем связываться. По дорожкам эти причины не различить.", "p3a_7_q": "Загадка, часть 2. Провели независимые опыты. 1) Секвенирование: цистеин-12 есть и в контрольных, и в неизвестных клетках. 2) Масс-спектрометрия: содержание ингибитора внутри клеток в обеих культурах одинаково. 3) Рецептор дополнительно не стимулировали, активность SOS1 в обеих культурах одинакова. Какое из предложенных объяснений согласуется с этими результатами и требует отдельной проверки?", "p3a_7_o1": "Утрата гидролиза GTP: белок редко переходит в GDP-форму, которую связывает ингибитор", "p3a_7_o2": "В неизвестных клетках отсутствует цистеин в положении 12 KRAS, поэтому у ингибитора G12C нет мишени и захват белка не происходит", "p3a_7_o3": "Содержание ингибитора в неизвестных клетках ниже, чем в контрольных, поэтому его концентрации недостаточно для захвата KRAS G12C", "p3a_7_e": "Цистеин-12 присутствует, а накопление препарата не снижено. Из предложенных объяснений этим данным соответствует утрата гидролиза GTP: белок редко переходит в GDP-форму, которую связывает ингибитор. Однако одинаковая активность SOS1 не доказывает одинаковой скорости обмена: её может повысить дополнительная замена в самом KRAS. Поэтому утрату гидролиза проверяют прямым измерением его скорости, а вторую замену устанавливают секвенированием всего гена. В этой учебной загадке неизвестные клетки — двойной мутант KRAS G12C + Q61L; измеренные дорожки остаются прежними, раскрывается только название клеток.", "p3a_7_w2": "Секвенирование показало цистеин-12 в обеих культурах. Мишень ингибитора на месте, поэтому дело не в её отсутствии.", "p3a_7_w3": "Масс-спектрометрия показала одинаковое содержание ингибитора в клетках обеих культур. Недостаточное накопление исключено, но связывание с мишенью этот опыт не показывает.", "gn_ras": "RAS", "g_ras": "Малая ГТФаза, закреплённая липидной модификацией на внутренней стороне плазматической мембраны. Переключается между неактивной GDP-формой и активной GTP-формой; только GTP-форма образует поверхность связывания эффекторов. Собственные скорости обмена и гидролиза низки, поэтому долю RAS-GTP задают факторы обмена гуаниновых нуклеотидов (GEF) и белки, активирующие ГТФазу (GAP). У человека три гена — HRAS, NRAS, KRAS; в опухолях чаще других мутирует KRAS.", "gn_sos1": "SOS1", "g_sos1": "Фактор обмена гуаниновых нуклеотидов (GEF) для RAS. Раскрывает нуклеотид-связывающий карман RAS и снижает его сродство к GDP; GDP диссоциирует, и его место занимает GTP, концентрация которого в цитозоле выше. ATP при этом не расходуется. К мембране, где находится RAS, SOS1 привлекается адаптером GRB2. Активная ERK и киназа RSK фосфорилируют SOS1 и снижают его активность (отрицательная обратная связь).", "gn_grb2": "GRB2", "g_grb2": "Адаптерный белок без собственной ферментативной активности. Доменом SH2 связывается с фосфотирозинами активированной рецепторной тирозинкиназы, доменом SH3 удерживает SOS1. Функция этого комплекса пространственная: цитозольный SOS1 перемещается к мембране, где находится RAS.", "gn_nf1": "Нейрофибромин (NF1)", "g_nf1": "Крупный белок с GAP-доменом для RAS: вносит в активный центр RAS каталитический аргинин («аргининовый палец») и правильно ориентирует глутамин самой ГТФазы и молекулу воды, ускоряя гидролиз GTP на несколько порядков. При нейрофиброматозе 1 типа функция NF1 утрачена, время существования RAS-GTP увеличивается: активность пути повышается за счёт ослабленной инактивации RAS, а не усиленной стимуляции.", "gn_gap120": "p120GAP (RASA1)", "g_gap120": "Ещё один GAP для RAS, действующий по тому же механизму «аргининового пальца». Вместе с нейрофибромином и другими GAP определяет суммарную скорость инактивации RAS в клетке, поэтому при потере одного GAP инактивация ослаблена, но не устранена. Потеря функции RASA1 связана с капиллярными и артериовенозными мальформациями.", "gn_raf": "RAF", "g_raf": "Протеинкиназа — эффектор RAS первой группы (ARAF, BRAF, CRAF). Связывается с RAS-GTP на поверхности switch I / switch II, привлекается к мембране и активируется; запускает каскад RAF → MEK → ERK (подробно в семинаре 4). Конкурирует с другими эффекторами за связывание с одной и той же поверхностью активного RAS.", "gn_pi3k": "PI3K (класс I)", "g_pi3k": "Фосфоинозитид-3-киназа класса I — эффектор RAS второй группы. Её каталитическая субъединица связывается с активным RAS и катализирует образование липида PIP₃, запускающего путь AKT. Как и другие эффекторы, связывается с поверхностью switch I / switch II.", "gn_ralgds": "RALGDS", "g_ralgds": "Эффектор RAS третьей группы; сам является фактором обмена (GEF) для малых ГТФаз семейства Ral. Связывается с той же поверхностью активного RAS, что и RAF, и PI3K, поэтому три группы эффекторов конкурируют за активный RAS. Относительный вклад ветвей зависит от типа клетки.", "gn_g12c": "KRAS G12C и ковалентный ингибитор", "g_g12c": "Онкогенная замена глицина 12 на цистеин почти лишает KRAS чувствительности к GAP, но собственный гидролиз сохраняется почти как у нормального белка (Hunter 2015), поэтому белок продолжает переходить между GTP- и GDP-формами. Ковалентный ингибитор (ARS-853 в опытах, соторасиб и адаграсиб в клинике) связывается с цистеином, возникшим в результате замены, в кармане возле switch II, но только в GDP-форме, и удерживает белок в неактивном состоянии. Поэтому эффект развивается постепенно и зависит от скорости гидролиза и от вышележащего сигнала.", "gn_bi3406": "BI-3406", "g_bi3406": "Исследовательский ингибитор SOS1: связывается с каталитическим карманом SOS1 и препятствует ускорению обмена GDP на GTP в RAS. Ослабляет активацию RAS, поэтому в клетках с KRAS G12C смещает белок к GDP-форме и ускоряет действие ковалентного ингибитора.", "gn_egfr": "EGFR", "g_egfr": "Рецепторная тирозинкиназа семейства ErbB. Связав лиганд (EGF), образует активный димер и фосфорилирует тирозины своих цитоплазматических участков; к ним через GRB2 присоединяется SOS1, и сигнал передаётся на цикл RAS. Ингибиторы EGFR снижают активность SOS1 и замедляют обмен GDP на GTP в RAS.", "gn_erk": "ERK1/2", "g_erk": "Конечная киназа каскада RAF → MEK → ERK, одного из эффекторных путей RAS. Активна после фосфорилирования мотива TEY; фосфорилирует множество субстратов. Содержание фосфорилированной ERK (pERK) служит удобным показателем активности пути RAS, в том числе при действии ингибиторов.", "s4_ext": "внеклеточная среда", "s4_cao_yes": "Ca²⁺ снаружи: 2 мМ", "s4_cao_no": "Ca²⁺ снаружи нет (EGTA)", "s4_cain": "вход Ca²⁺", "s4_cn": "Ca²⁺·кальмодулин\nкальциневрин", "s4_gap": "контакт ЭПР–ПМ, 10–25 нм", "s4_dephos": "дефосфорилирует", "s4_er": "ЭПР (депо Ca²⁺)", "s4_lumen": "просвет ЭПР", "s4_pump": "закачка в ЭПР", "s4_il2": "гены (IL2 и др.)", "s4_il2_on": "NFAT в ядре: возможна регуляция генов; для индукции гена IL2 нужны и другие факторы (AP-1)", "s4_il2_off": "NFAT в цитоплазме: в ядро не переходит, гены не регулирует", "s4_stim_fold": "сложен (покой)", "s4_stim_ext": "распрямлён, кластер", "s4_r_ef": "STIM1 без Ca²⁺ на домене EF-hand: доля молекул", "s4_r_clust": "STIM1 в кластерах у контактов ЭПР–ПМ: доля молекул", "s4_r_crac": "ток CRAC: % от максимального в модели", "s4_r_cyt": "[Ca²⁺] в цитозоле (свободный)", "s4_r_cyt_s": "покой — около 55 нМ", "s4_r_nfat": "NFAT в ядре: доля от общего NFAT", "s4_er_sl": "[Ca²⁺] в просвете ЭПР", "s4_ext_t": "Ca²⁺ во внеклеточной среде", "s4_ca2": "2 мМ", "s4_egta": "нет (EGTA)", "s4b_c_full": "Депо почти заполнено. Домен EF-hand STIM1 связывает Ca²⁺, STIM1 остаётся сложенным димером, кластеров у контактов почти нет (в модели единицы процентов), ток CRAC близок к нулю. В клетку поступает лишь небольшое базальное количество Ca²⁺; концентрация Ca²⁺ в цитозоле низкая, NFAT удерживается в цитоплазме.", "s4b_c_full_z": "При заполненном депо STIM1 неактивен: вход Ca²⁺ из внеклеточной среды не запускается, пока запас Ca²⁺ в ЭПР не снизится.", "s4b_c_mid": "Депо опустошено частично. Около порога (K½ ≈ 187 мкМ) доля STIM1 в кластерах круто растёт, но ещё не превышает половины; ток CRAC растёт, но далёк от максимума. Концентрация Ca²⁺ в цитозоле и доля NFAT в ядре имеют промежуточные значения.", "s4b_c_mid_z": "Крутая (кооперативная) зависимость превращает плавное снижение концентрации Ca²⁺ в ЭПР в почти пороговую активацию входа Ca²⁺: небольшое изменение около порога заметно меняет ток CRAC.", "s4b_c_low": "Депо сильно опустошено. Ca²⁺ диссоциирует от домена EF-hand, STIM1 распрямляется, собирается в кластеры у контактов ЭПР с плазматической мембраной, связывает и открывает каналы Orai1. Ток CRAC близок к максимальному, концентрация Ca²⁺ в цитозоле высокая.", "s4b_c_low_z": "Опустошение депо непосредственно открывает канал в другой мембране: состояние ЭПР передаётся на плазматическую мембрану через кластеры STIM1 в участке контакта двух мембран.", "s4b_c_low_nfat": "Депо сильно опустошено, ток CRAC близок к максимальному, концентрация Ca²⁺ в цитозоле высокая. Комплекс Ca²⁺–кальмодулин активирует кальциневрин; кальциневрин дефосфорилирует NFAT, и большая часть этого фактора переходит в ядро.", "s4b_c_low_nfat_z": "Длительное повышение концентрации Ca²⁺ в цитозоле приводит к перемещению NFAT в ядро через активацию фосфатазы кальциневрина — пример передачи сигнала дефосфорилированием.", "s4b_c_egta_full": "Внешнего Ca²⁺ нет (EGTA), депо заполнено. STIM1 сложен и связывает Ca²⁺ на EF-hand; источника Ca²⁺ для входа нет, концентрация Ca²⁺ в цитозоле — на уровне покоя, NFAT в цитоплазме.", "s4b_c_egta_full_z": "Без внешнего Ca²⁺ депо-зависимый вход невозможен независимо от состояния сенсора; это контроль, отделяющий вход снаружи от высвобождения из депо.", "s4b_c_egta_empty": "Внешнего Ca²⁺ нет (EGTA), депо опустошено. STIM1 распрямлён и собран в кластеры, но тока через Orai1 нет. Концентрация Ca²⁺ в цитозоле остаётся на уровне покоя, NFAT в цитоплазме.", "s4b_c_egta_empty_z": "Кластеризация STIM1 определяется заполнением депо и не зависит от входа Ca²⁺: STIM1 активирован, но без внешнего Ca²⁺ концентрация Ca²⁺ в цитозоле не повышается.", "s4b_take": "Состояние STIM1 зависит от концентрации Ca²⁺ в просвете ЭПР. Пока депо заполнено, домен EF-hand STIM1 связывает Ca²⁺ и STIM1 сложен; при опустошении Ca²⁺ диссоциирует от EF-hand, STIM1 распрямляется, собирается в кластеры у контактов ЭПР с плазматической мембраной и открывает Orai1. Зависимость крутая (коэффициент Хилла около 4 по Luik 2008), поэтому вход Ca²⁺ активируется почти пороговым образом. Длительное повышение концентрации Ca²⁺ в цитозоле через кальциневрин приводит к перемещению NFAT в ядро. Кластеризация зависит только от заполнения депо, а вход требует ещё и внешнего Ca²⁺.", "p4b_1_q": "Депо заполнено ([Ca²⁺]ЭПР около 500 мкМ), внешний Ca²⁺ 2 мМ. Концентрацию Ca²⁺ в просвете ЭПР снизили до 300 мкМ. Какой станет доля STIM1 в кластерах?", "p4b_1_o1": "Резко вырастет: большинство STIM1 соберётся в кластеры", "p4b_1_o2": "В кластерах останется малая доля STIM1", "p4b_1_o3": "Не изменится: кластеров не было и не появится", "p4b_1_e": "При 300 мкМ доля STIM1 в кластерах в модели около 14 %: она растёт, но большинство молекул STIM1 ещё находится в сложенной конформации. Порог кластеризации (K½) по Luik 2008 около 187 мкМ, поэтому заметный рост начинается при более глубоком опустошении.", "p4b_1_w1": "Большинство STIM1 собирается в кластеры лишь при снижении [Ca²⁺]ЭПР ниже порога; при 300 мкМ депо опустошено ещё недостаточно.", "p4b_1_w3": "Доля в кластерах зависит от концентрации Ca²⁺ в ЭПР и при снижении с 500 до 300 мкМ немного возрастает — примерно с 2 до 14 %.", "p4b_2_q": "Депо заполнено (около 500 мкМ), внешний Ca²⁺ 2 мМ. Концентрацию Ca²⁺ в просвете ЭПР снизили до 100 мкМ. Каким станет ток CRAC?", "p4b_2_o1": "Почти максимальным", "p4b_2_o2": "Примерно половинным", "p4b_2_o3": "Практически нулевым", "p4b_2_e": "При 100 мкМ доля STIM1 в кластерах около 92 %, и ток CRAC в модели близок к максимальному (около 90 %). Зависимость крутая (коэффициент Хилла около 4 по Luik 2008), поэтому глубокое опустошение открывает почти все каналы.", "p4b_2_w2": "Половинный ток был бы около порога (примерно 170 мкМ); при 100 мкМ опустошение глубже, и ток близок к максимальному.", "p4b_2_w3": "Нулевым ток остаётся при заполненном депо; снижение до 100 мкМ, напротив, открывает почти все каналы.", "p4b_3_q": "Депо опустошено (около 100 мкМ), затем из внешней среды удалили Ca²⁺ (EGTA). Как изменятся кластеры STIM1 и вход Ca²⁺?", "p4b_3_o1": "Кластеры распадутся, вход прекратится", "p4b_3_o2": "Кластеры сохранятся, вход продолжится", "p4b_3_o3": "Кластеры сохранятся, вход прекратится", "p4b_3_e": "Кластеризация STIM1 задаётся концентрацией Ca²⁺ в ЭПР, а не входом, поэтому кластеры сохраняются (в модели около 92 %). Без внешнего Ca²⁺ ток CRAC равен нулю, и концентрация Ca²⁺ в цитозоле возвращается к уровню покоя (около 55 нМ).", "p4b_3_w1": "К распаду кластеров привело бы повторное заполнение депо, а не удаление внешнего Ca²⁺: депо осталось пустым, и кластеры сохраняются.", "p4b_3_w2": "Вход требует Ca²⁺ во внешней среде; после удаления внешнего Ca²⁺ ток CRAC прекращается, хотя каналы открыты.", "p4b_4_q": "Депо опустошено (около 100 мкМ), внешний Ca²⁺ 2 мМ, NFAT в ядре. Из внешней среды удалили Ca²⁺ (EGTA). Где будет преимущественно находиться NFAT после установления нового стационарного состояния?", "p4b_4_o1": "Вернётся в цитоплазму: входа Ca²⁺ больше нет", "p4b_4_o2": "Останется в ядре: кластеры STIM1 сохраняются", "p4b_4_o3": "Останется в ядре: депо по-прежнему пустое", "p4b_4_e": "После удаления внешнего Ca²⁺ ток CRAC прекращается, концентрация Ca²⁺ в цитозоле снижается до уровня покоя, кальциневрин теряет активность, и NFAT рефосфорилируется и возвращается в цитоплазму (в модели доля в ядре падает примерно с 84 до 1 %). Показаны стационарные состояния: после удаления Ca²⁺ NFAT постепенно возвращается в цитоплазму, а не выходит из ядра мгновенно.", "p4b_4_w2": "Кластеры STIM1 сохраняются, но без внешнего Ca²⁺ входа нет. После прекращения Ca²⁺-сигнала NFAT постепенно выходит из ядра; сами кластеры не поддерживают его ядерное состояние.", "p4b_4_w3": "Пустое депо поддерживает кластеры, но не вход: без внешнего Ca²⁺ концентрация Ca²⁺ в цитозоле снижается и NFAT покидает ядро.", "p4b_5_q": "Внешний Ca²⁺ 2 мМ. Концентрацию Ca²⁺ в просвете ЭПР снизили с 260 до 200 мкМ. Как изменится ток CRAC?", "p4b_5_o1": "Почти не изменится: сдвиг слишком мал", "p4b_5_o2": "Заметно вырастет: примерно вдвое", "p4b_5_o3": "Ток CRAC снизится: вход Ca²⁺ станет слабее", "p4b_5_e": "Около порога зависимость крутая, поэтому снижение всего на 60 мкМ увеличивает ток CRAC в модели примерно с 14 до 33 % — более чем вдвое. В этом смысл высокого коэффициента Хилла: небольшое изменение концентрации Ca²⁺ в ЭПР у порога резко меняет вход.", "p4b_5_w1": "Малый сдвиг даёт малый эффект вдали от порога; около порога та же разница в 60 мкМ заметно меняет ток.", "p4b_5_w3": "Снижение концентрации Ca²⁺ в ЭПР — это и есть опустошение депо; оно усиливает вход, а не ослабляет его: ток CRAC растёт.", "s4_tglbl": "тапсигаргин", "s4_csalbl": "циклоспорин A", "s4_ip3lbl": "импульс IP₃", "s4a_gt": "Клетки", "s4a_nostim": "нет STIM1", "s4a_r91w": "ORAI1 R91W", "s4a_d76a": "STIM1 D76A", "s4a_prt": "Протокол", "s4a_pr_tg": "тапсигаргин и возврат Ca²⁺", "s4a_pr_ip3": "импульс IP₃", "s4a_st": "SERCA", "s4a_s_on": "работает", "s4a_s_tg": "заблокирована тапсигаргином", "s4a_nostim_lbl": "STIM1 отсутствует", "s4a_ivt": "Вмешательство", "s4a_iv0": "нет", "s4_la": "блокатор CRAC", "s4_csa_b": "циклоспорин A", "s4a_tslider": "Время", "s4a_r_er": "[Ca²⁺] в ЭПР: % от исходного", "s4a_pcap": "Клетки Jurkat (линия T-лимфоцитов), учебная модель. Условия: {c}. Три графика построены по общей оси времени; шкала каждого указана в его заголовке.", "s4a_pl_cyt": "[Ca²⁺] в цитозоле, нМ", "s4a_pl_er": "[Ca²⁺] в просвете ЭПР, % от исходного значения (100 % — около 400 мкМ в модели)", "s4a_pl_nfat": "NFAT в ядре, % от всего NFAT", "s4a_mk_tg": "тапсигаргин", "s4a_mk_add": "+2 мМ Ca²⁺", "s4a_mk_ip3": "импульс IP₃", "s4a_mk_ip3tg": "тапсигаргин + импульс IP₃", "s4a_c_pre": "До тапсигаргина. Среда без Ca²⁺, депо заполнено, STIM1 сложен и связывает Ca²⁺. Входа нет, концентрация Ca²⁺ в цитозоле — на уровне покоя. Состояние стационарно — отсчёт опыта начинается отсюда.", "s4a_c_pre_z": "Опыт начинают в среде без Ca²⁺, чтобы отделить высвобождение из депо от входа снаружи.", "s4a_c_tg": "Тапсигаргин подавил SERCA. Закачка Ca²⁺ в ЭПР прекратилась, и депо опустошается за счёт постоянной утечки. Концентрация Ca²⁺ в цитозоле ненадолго немного повышается (на десятки — сотню нМ) и снижается: PMCA выводит вышедшие ионы из клетки, а внешнего Ca²⁺ ещё нет. STIM1 распрямляется и собирается в кластеры.", "s4a_c_tg_z": "Опустошение депо без агониста (тапсигаргином) показывает, что вход вызывается именно состоянием депо, а не рецептором.", "s4a_c_add": "После возврата 2 мМ Ca²⁺ кластеры STIM1 удерживают каналы Orai1 в открытом состоянии, и Ca²⁺ входит в клетку. Концентрация Ca²⁺ в цитозоле резко возрастает (пик около 1,2 мкМ), а затем выходит на плато около 0,5 мкМ: вход уравновешен выведением Ca²⁺ через PMCA.", "s4a_c_add_z": "Большой подъём именно при возврате Ca²⁺ показывает депо-зависимый вход через Orai1.", "s4a_c_add_nfat": "После возврата 2 мМ Ca²⁺ через открытые каналы Orai1 идёт вход, концентрация Ca²⁺ в цитозоле сохраняется на плато около 0,5 мкМ. Длительный вход активирует кальциневрин; кальциневрин дефосфорилирует NFAT, и большая часть этого фактора переходит в ядро.", "s4a_c_add_nfat_z": "Для перехода NFAT в ядро важна не величина отдельного всплеска, а длительность входа Ca²⁺.", "s4a_c_nostim_pre": "STIM1 отсутствует. До тапсигаргина депо заполнено, входа нет, концентрация Ca²⁺ в цитозоле — на уровне покоя. Без сенсора опустошение депо в дальнейшем не откроет Orai1.", "s4a_c_nostim_pre_z": "Контроль без STIM1: показывает, какой ответ исчезает без сенсора депо.", "s4a_c_nostim_tg": "STIM1 отсутствует. Тапсигаргин опустошает депо, но без STIM1 это состояние не передаётся на плазматическую мембрану: кластеры не образуются. Концентрация Ca²⁺ в цитозоле лишь немного повышается за счёт утечки из ЭПР.", "s4a_c_nostim_tg_z": "Без сенсора STIM1 опустошение депо не открывает Orai1 — сенсор необходим для передачи сигнала между мембранами.", "s4a_c_nostim_add": "STIM1 отсутствует, кластеры не образуются, Orai1 не открывается. После возврата 2 мМ Ca²⁺ концентрация Ca²⁺ в цитозоле почти не повышается (в модели около 70 нМ) — только базальный вход.", "s4a_c_nostim_add_z": "Потеря STIM1 устраняет депо-зависимый вход: у T-клеток мыши без STIM1 депо-зависимый вход Ca²⁺ резко снижен (Oh-hora 2008).", "s4a_c_r91w_tg": "ORAI1 R91W. Тапсигаргин опустошает депо, STIM1 распрямляется и собирается в кластеры (в модели — как в норме). Концентрация Ca²⁺ в цитозоле немного повышается за счёт утечки из ЭПР.", "s4a_c_r91w_tg_z": "Нарушен сам канал, а не сенсор: при экспрессии в клетках HEK293 Orai1 R91W сохраняет взаимодействие со STIM1 (Muik 2008).", "s4a_c_r91w_add": "ORAI1 R91W. Кластеры STIM1 есть и взаимодействуют с каналом, но Orai1 R91W почти не проводит Ca²⁺. После возврата 2 мМ Ca²⁺ концентрация Ca²⁺ в цитозоле повышается слабо (в модели около 160 нМ).", "s4a_c_r91w_add_z": "В T-клетках больных с ORAI1 R91W депо-зависимый вход и ток CRAC отсутствуют, а нормальный Orai1 их восстанавливает (Feske 2006); взаимодействие R91W со STIM1 при этом сохраняется (Muik 2008, клетки HEK293).", "s4a_c_d76a_pre": "STIM1 D76A, до тапсигаргина. Замена в домене EF-hand нарушает связывание Ca²⁺, поэтому STIM1 распрямлён и собран в кластеры уже при полном депо. Внешнего Ca²⁺ ещё нет, концентрация Ca²⁺ в цитозоле — на уровне покоя.", "s4a_c_d76a_pre_z": "D76A показывает, что именно диссоциация Ca²⁺ от домена EF-hand переводит STIM1 в активную форму (Liou 2005; Zhang 2005).", "s4a_c_d76a_tg": "STIM1 D76A. Кластеры были собраны уже при полном депо, тапсигаргин их состояния не меняет. Концентрация Ca²⁺ в цитозоле пока низкая: внешнего Ca²⁺ нет.", "s4a_c_d76a_tg_z": "У D76A состояние кластеров не зависит от тапсигаргина — сенсор уже активен независимо от концентрации Ca²⁺ в депо.", "s4a_c_d76a_add": "STIM1 D76A. Кластеры образовались ещё при заполненном депо, поэтому сразу после возврата 2 мМ Ca²⁺ через Orai1 начинается вход и концентрация Ca²⁺ в цитозоле быстро растёт: предварительное опустошение депо не требуется.", "s4a_c_d76a_add_z": "Конститутивно активный STIM1 D76A обеспечивает вход при заполненном депо; это подтверждает, что STIM1 активируется при диссоциации Ca²⁺ от домена EF-hand.", "s4a_c_la_add": "Блокатор CRAC. Кластеры STIM1 собраны, но канал Orai1 перекрыт снаружи. После возврата 2 мМ Ca²⁺ повышение концентрации Ca²⁺ в цитозоле подавлено (в модели около 160 нМ); преходящий пик после тапсигаргина при этом сохранён — он обусловлен высвобождением Ca²⁺ из депо.", "s4a_c_la_add_z": "Блокатор подавляет именно составляющую кривой, обусловленную входом Ca²⁺, не затрагивая высвобождение из депо, — так отделяют вход от высвобождения.", "s4a_c_csa_add": "Циклоспорин A. Вход Ca²⁺ не отличается от нормы (плато около 0,5 мкМ): препарат не действует на STIM1 и Orai1. Но комплекс циклоспорина с циклофилином подавляет кальциневрин, поэтому NFAT остаётся в цитоплазме.", "s4a_c_csa_add_z": "Циклоспорин A действует на этапе после входа Ca²⁺ — подавляет кальциневрин; Ca²⁺-сигнал сохраняется, а NFAT-ответ подавлен (основа иммуносупрессии).", "s4a_c_ip_pre": "До импульса IP₃. Снаружи 2 мМ Ca²⁺, депо заполнено, SERCA работает. STIM1 сложен и связывает Ca²⁺ на домене EF-hand в просвете ЭПР, кластеров почти нет, Orai1 закрыт. Небольшой базальный вход уравновешен выведением Ca²⁺ через PMCA: концентрация Ca²⁺ в цитозоле — на уровне покоя (в модели около 70 нМ).", "s4a_c_ip_pre_z": "Исходное состояние: выходу Ca²⁺ из депо противостоит работающая SERCA, а каналы Orai1 остаются закрытыми, пока депо заполнено.", "s4a_c_ip_pulse": "Импульс IP₃. IP₃-рецепторы открываются, и в первые секунды выход Ca²⁺ из ЭПР превышает закачку SERCA: депо опустошается и в модели устанавливается примерно на трети исходного уровня, где выход и закачка снова равны. Концентрация Ca²⁺ в цитозоле растёт. Ca²⁺ диссоциирует от домена EF-hand, STIM1 распрямляется и собирается в кластеры, Orai1 открывается. Вошедший Ca²⁺ оказывается в цитозоле, а в просвет ЭПР его переносит SERCA.", "s4a_c_ip_pulse_z": "Пока IP₃-рецепторы открыты, выход Ca²⁺ из ЭПР уравновешивается закачкой SERCA лишь при низкой концентрации Ca²⁺ в просвете, поэтому депо остаётся неполным. Вход через Orai1 включается с задержкой в десятки секунд, поэтому в начале импульса кластеров ещё мало.", "s4a_c_ipt_pulse": "Импульс IP₃ при заблокированной тапсигаргином SERCA. Закачки Ca²⁺ в ЭПР нет, поэтому депо опустошается почти полностью. STIM1 распрямляется и собирается в кластеры, Orai1 открывается, и Ca²⁺ входит из среды в цитозоль.", "s4a_c_ipt_pulse_z": "Без SERCA Ca²⁺, вышедший из ЭПР, не возвращается в него. Путь из внешней среды в просвет ЭПР ведёт через цитозоль и SERCA.", "s4a_c_ip_refill": "Импульс закончился. IP₃-рецепторы закрыты, SERCA закачивает Ca²⁺ в ЭПР, в том числе вошедший через Orai1, и депо пополнено (в модели — за секунды; это время задано условно и не откалибровано по эксперименту). Ca²⁺ снова связывается с доменом EF-hand, но кластеры STIM1 разбираются ещё десятки секунд, поэтому ток через Orai1 и повышенная концентрация Ca²⁺ в цитозоле на время сохраняются.", "s4a_c_ip_refill_z": "Сигнал выключается в определённом порядке: пополнение депо, затем разборка кластеров STIM1, затем закрытие Orai1. Состояние STIM1 следует за заполнением депо с задержкой.", "s4a_c_ip_rest": "Депо заполнено, STIM1 вернулся в сложенное состояние, Orai1 закрыт, концентрация Ca²⁺ в цитозоле вернулась к уровню покоя. NFAT, частично перешедший в ядро во время сигнала, постепенно возвращается в цитоплазму: киназы рефосфорилируют его, когда кальциневрин перестаёт быть активным.", "s4a_c_ip_rest_z": "Короткий импульс даёт лишь частичный и обратимый ответ NFAT: для устойчивого перехода в ядро нужен длительный вход Ca²⁺.", "s4a_c_ipt_after": "Импульс IP₃ закончился, но SERCA заблокирована. Закачки в ЭПР нет, депо остаётся опустошённым, хотя снаружи 2 мМ Ca²⁺. STIM1 остаётся в кластерах, Orai1 открыт: концентрация Ca²⁺ в цитозоле держится на плато (в модели около 0,5 мкМ), NFAT накапливается в ядре. Через Orai1 Ca²⁺ попадает только в цитозоль; в просвет ЭПР его переносит SERCA.", "s4a_c_ipt_after_z": "Одной доступности внешнего Ca²⁺ для пополнения депо недостаточно: нужен работающий насос SERCA. Пока депо пусто, STIM1 удерживает Orai1 открытым.", "s4a_take": "Протокол «тапсигаргин + возврат Ca²⁺» позволяет разделить вклад отдельных звеньев пути. Тапсигаргин в среде без Ca²⁺ опустошает депо и вызывает небольшое преходящее повышение концентрации Ca²⁺ в цитозоле за счёт выхода из ЭПР; после возврата Ca²⁺ через открытые каналы Orai1 развивается вход: концентрация Ca²⁺ в цитозоле достигает высокого пика, а затем выходит на плато. Потеря STIM1 и замена ORAI1 R91W устраняют вход по разным причинам: без STIM1 нет кластеров, при R91W кластеры есть, но канал не проводит Ca²⁺. STIM1 D76A активен при полном депо. Блокатор CRAC подавляет составляющую, обусловленную входом, а циклоспорин A оставляет Ca²⁺-сигнал, но подавляет кальциневрин и удерживает NFAT в цитоплазме.", "s4a_take_ip3": "Опустошение депо физиологическим сигналом — импульсом IP₃ — тоже включает вход Ca²⁺ через Orai1, но в клетке с работающей SERCA сигнал выключается сам: вошедший Ca²⁺ закачивается в ЭПР, депо пополняется, Ca²⁺ снова связывается с доменом EF-hand, кластеры STIM1 разбираются, и Orai1 закрывается. Короткий импульс даёт лишь частичный и обратимый ответ NFAT. Если SERCA подавлена тапсигаргином, депо не пополняется даже при наличии Ca²⁺ в среде, STIM1 остаётся в кластерах и вход идёт непрерывно: Orai1 переносит Ca²⁺ только в цитозоль, а в просвет ЭПР его переносит SERCA.", "p4a_1_q": "Клетки без STIM1, протокол тапсигаргин + возврат Ca²⁺. На 10-й минуте вернули 2 мМ Ca²⁺. Как изменится концентрация Ca²⁺ в цитозоле?", "p4a_1_o1": "Почти не повысится: STIM1 нет", "p4a_1_o2": "Повысится так же, как в норме", "p4a_1_o3": "Повысится сильнее, чем в норме", "p4a_1_e": "Без STIM1 опустошение депо не передаётся на плазматическую мембрану: кластеры не образуются, Orai1 закрыт. После возврата Ca²⁺ концентрация Ca²⁺ в цитозоле в модели остаётся около 70 нМ: сохраняется только базальный вход.", "p4a_1_w2": "В норме подъём обеспечивают кластеры STIM1, открывающие Orai1; без STIM1 этого звена нет, и подъём почти отсутствует.", "p4a_1_w3": "Потеря STIM1 устраняет, а не усиливает вход: депо-зависимый ток CRAC без сенсора не возникает.", "p4a_2_q": "Клетки с ORAI1 R91W. После опустошения депо тапсигаргином STIM1 собрался в кластеры. Как изменится вход Ca²⁺ после возврата 2 мМ Ca²⁺?", "p4a_2_o1": "Вход нормальный: кластеры STIM1 открыли канал", "p4a_2_o2": "Входа нет, потому что кластеры STIM1 не образовались", "p4a_2_o3": "Вход почти отсутствует, хотя кластеры STIM1 собраны", "p4a_2_e": "Orai1 R91W сохраняет взаимодействие со STIM1 (опыты с экспрессией в клетках HEK293 — Muik 2008), но почти не проводит Ca²⁺. После возврата Ca²⁺ концентрация Ca²⁺ в цитозоле в модели остаётся около 160 нМ — подъём мал. В T-клетках больных с этой заменой ток CRAC не развивается, хотя мутантный белок находится у плазматической мембраны (Feske 2006).", "p4a_2_w1": "Кластеры STIM1 действительно собраны, но нормальным вход не будет: канал Orai1 R91W почти не проводит Ca²⁺.", "p4a_2_w2": "Кластеры STIM1 при R91W образуются нормально — нарушен сам канал, а не сенсор; поэтому вход мал при собранных кластерах.", "p4a_3_q": "Нормальные клетки, протокол тапсигаргин + возврат Ca²⁺. Добавили блокатор CRAC. Какая часть кривой концентрации Ca²⁺ в цитозоле будет подавлена?", "p4a_3_o1": "Будут подавлены оба подъёма Ca²⁺: и после тапсигаргина, и после возврата Ca²⁺ в среду", "p4a_3_o2": "Будет подавлен подъём при возврате Ca²⁺; пик после тапсигаргина сохранится", "p4a_3_o3": "Будет подавлен пик после тапсигаргина; подъём при возврате Ca²⁺ сохранится", "p4a_3_e": "Блокатор перекрывает Orai1, поэтому подавляется именно вход при возврате Ca²⁺ (в модели подъём около 160 нМ вместо примерно 1,2 мкМ). Преходящий пик после тапсигаргина сохраняется — он обусловлен высвобождением Ca²⁺ из депо, а не входом через канал.", "p4a_3_w1": "Преходящий пик после тапсигаргина обусловлен выходом Ca²⁺ из ЭПР и не зависит от Orai1, поэтому блокатор его не подавляет.", "p4a_3_w3": "Пик после тапсигаргина как раз сохраняется; блокатор подавляет подъём при возврате Ca²⁺, обусловленный входом.", "p4a_4_q": "Нормальные клетки, протокол тапсигаргин + возврат Ca²⁺. Добавили циклоспорин A. Какими будут концентрация Ca²⁺ в цитозоле и локализация NFAT после возврата Ca²⁺?", "p4a_4_o1": "Концентрация Ca²⁺ как в норме; NFAT остаётся в цитоплазме", "p4a_4_o2": "Концентрация Ca²⁺ снижается, но NFAT после добавления Ca²⁺ переходит в ядро", "p4a_4_o3": "Концентрация Ca²⁺ снижается, и NFAT после добавления Ca²⁺ остаётся в цитоплазме", "p4a_4_e": "Циклоспорин A не действует на STIM1 и Orai1, поэтому вход Ca²⁺ не отличается от нормы (плато около 0,5 мкМ). Но комплекс циклоспорина с циклофилином подавляет кальциневрин, NFAT не дефосфорилируется и остаётся в цитоплазме (в модели доля в ядре около 2 %).", "p4a_4_w2": "Циклоспорин A действует на кальциневрин, а не на каналы: вход Ca²⁺ не снижается, и NFAT в ядро не переходит.", "p4a_4_w3": "Локализация NFAT указана верно, но концентрация Ca²⁺ при этом не снижена: препарат не действует на вход, а подавляет кальциневрин.", "p4a_5_q": "В норме при полном депо (до тапсигаргина) STIM1 не собран в кластеры. В каком состоянии находится STIM1 в клетках с STIM1 D76A при том же заполнении депо?", "p4a_5_o1": "Сложен, как в норме: без тапсигаргина кластеров нет", "p4a_5_o2": "Сложен; кластеризация начнётся при самом малом опустошении депо", "p4a_5_o3": "Собран в кластеры уже при полном депо: EF-hand не связывает Ca²⁺", "p4a_5_e": "Замена D76A в домене EF-hand нарушает связывание Ca²⁺, поэтому STIM1 ведёт себя как при пустом депо и собран в кластеры уже при полном депо (в модели около 100 %). Именно диссоциация Ca²⁺ от домена EF-hand, а не само опустошение, переводит STIM1 в активную форму (Liou 2005; Zhang 2005).", "p4a_5_w1": "В норме при полном депо STIM1 сложен, но D76A не связывает Ca²⁺ на EF-hand и поэтому собран в кластеры независимо от концентрации Ca²⁺ в депо.", "p4a_5_w2": "Для D76A опустошение депо не требуется: этот белок уже собран в кластеры при полном депо, потому что EF-hand не связывает Ca²⁺.", "p4a_6_q": "Нормальные клетки, среда без Ca²⁺. Вскоре после тапсигаргина (ещё до возврата внешнего Ca²⁺) концентрация Ca²⁺ в цитозоле немного повысилась. Каков источник этого Ca²⁺?", "p4a_6_o1": "Вошёл снаружи через Orai1", "p4a_6_o2": "Из ЭПР за счёт утечки", "p4a_6_o3": "Высвободился из митохондрий", "p4a_6_e": "Внешнего Ca²⁺ в среде ещё нет, поэтому вход через Orai1 невозможен. Тапсигаргин подавил SERCA, и депо опустошается за счёт постоянной утечки: именно этот Ca²⁺ вызывает небольшое преходящее повышение концентрации в цитозоле, а затем PMCA выводит его из клетки ([Ca²⁺] в ЭПР на схеме падает).", "p4a_6_w1": "Вход снаружи невозможен без внешнего Ca²⁺: в среде его нет (EGTA), и Orai1 не может его провести.", "p4a_6_w3": "В этой модели преходящий подъём обусловлен утечкой Ca²⁺ из ЭПР при подавленной SERCA, а не высвобождением из митохондрий.", "p4a_7_q": "Нормальные клетки, снаружи 2 мМ Ca²⁺, SERCA работает. Краткий импульс IP₃ опустошил депо, STIM1 собрался в кластеры, Orai1 открыт. Что произойдёт после окончания импульса, к 6-й минуте?", "p4a_7_o1": "Депо пополнится, кластеры STIM1 разберутся и вход Ca²⁺ через Orai1 прекратится", "p4a_7_o2": "Депо останется опустошённым, пока Ca²⁺ есть в среде: вход через Orai1 продолжится", "p4a_7_o3": "Депо пополнится, но кластеры STIM1 сохранятся: Orai1 останется открытым", "p4a_7_e": "После окончания импульса IP₃-рецепторы закрываются, а SERCA закачивает Ca²⁺ в ЭПР, в том числе вошедший через Orai1. Депо пополняется (в модели — за секунды; это время задано условно и не откалибровано по эксперименту), Ca²⁺ снова связывается с доменом EF-hand, кластеры STIM1 разбираются, ток через Orai1 затухает. К 6-й минуте концентрация Ca²⁺ в цитозоле почти вернулась к исходной (в модели около 100 нМ при исходных 70 нМ), а NFAT, частично перешедший в ядро, возвращается в цитоплазму.", "p4a_7_w2": "Наличие Ca²⁺ в среде само по себе вход не поддерживает: Orai1 открыт, только пока депо опустошено. При работающей SERCA депо пополняется, и вход выключается.", "p4a_7_w3": "Состояние STIM1 определяется заполнением депо: когда оно пополнено, Ca²⁺ связывается с доменом EF-hand и STIM1 возвращается в сложенное состояние, а Orai1 закрывается. Разборка кластеров занимает десятки секунд, а не весь остаток опыта.", "p4a_8_q": "Нормальные клетки, снаружи 2 мМ Ca²⁺. Одновременно с импульсом IP₃ добавили тапсигаргин: SERCA заблокирована. Что произойдёт с депо и входом Ca²⁺ после окончания импульса, к 8-й минуте?", "p4a_8_o1": "Ca²⁺ из среды пополнит депо, как при работающей SERCA", "p4a_8_o2": "Депо останется пустым, STIM1 — в кластерах; вход Ca²⁺ продолжится", "p4a_8_o3": "Депо останется опустошённым, но вход прекратится вместе с импульсом IP₃", "p4a_8_e": "Orai1 переносит Ca²⁺ из среды только в цитозоль, а в просвет ЭПР его закачивает SERCA. Пока она заблокирована, одна доступность внешнего Ca²⁺ депо не пополняет: депо остаётся пустым, STIM1 — в кластерах, Orai1 — открытым. Концентрация Ca²⁺ в цитозоле держится на плато (в модели около 0,55 мкМ), NFAT накапливается в ядре (к 8-й минуте — около 70 % в модели).", "p4a_8_w1": "Прямого пути из среды в просвет ЭПР нет: Orai1 переносит Ca²⁺ в цитозоль, а закачивает его в ЭПР только SERCA, которая заблокирована.", "p4a_8_w3": "Вход определяет не IP₃, а состояние депо: после окончания импульса депо остаётся пустым, поэтому STIM1 остаётся в кластерах, а Orai1 открыт.", "gn_stim1": "STIM1", "g_stim1": "Белок мембраны ЭПР и сенсор Ca²⁺ в депо. Каждая субъединица пересекает мембрану ЭПР одной трансмембранной спиралью: домены EF-hand и SAM обращены в просвет ЭПР и связывают там Ca²⁺ с умеренным сродством (Kd около 200–600 мкМ, Stathopulos 2006), а цитозольная часть остаётся в цитозоле. В покое STIM1 — димер в сложенной конформации; при опустошении депо Ca²⁺ диссоциирует от домена EF-hand, люминальные домены сближаются, цитозольная часть распрямляется и достигает Orai1, STIM1 собирается в кластеры у контактов ЭПР с плазматической мембраной и открывает канал. На схеме Ca²⁺ на домене EF-hand нарисован только внутри просвета ЭПР; интенсивность окраски точки показывает долю участков, связанных с Ca²⁺. В учебной модели доля STIM1 в кластерах задана функцией Хилла от [Ca²⁺]ЭПР (K½ около 187 мкМ, коэффициент около 4 по Luik 2008).", "gn_orai1": "Orai1", "g_orai1": "Канал плазматической мембраны, высокоизбирательный к Ca²⁺ и с малой проводимостью. Его непосредственно открывают молекулы STIM1 в распрямлённой конформации, собранные в кластеры в участках контакта ЭПР с плазматической мембраной; регистрируемый ток называют ICRAC. Замена R91W в начале первого трансмембранного сегмента вызывает тяжёлый комбинированный иммунодефицит: в T-клетках больных нет депо-зависимого входа и тока CRAC, а нормальный Orai1 их восстанавливает (Feske 2006). Взаимодействие Orai1 R91W со STIM1 сохраняется (Muik 2008, клетки HEK293). В модели ток CRAC — функция Хилла от [Ca²⁺]ЭПР (K½ около 169 мкМ по Luik 2008), умноженная на наличие внешнего Ca²⁺.", "gn_ip3r": "IP₃-рецептор", "g_ip3r": "Канал мембраны ЭПР, через который Ca²⁺ выходит из депо в цитозоль. Открывается при совместном связывании IP₃ и Ca²⁺ на цитозольной стороне. Физиологически депо опустошается именно через IP₃-рецептор после активации фосфолипазы C; в практикуме опустошение задают напрямую (ползунком или тапсигаргином), чтобы отделить состояние депо от рецепторного сигнала; во втором протоколе 4а опустошение вызывает краткий импульс IP₃, а то, что происходит после него, зависит от работы SERCA.", "gn_ip3br": "образование IP₃", "g_ip3br": "Инозитол-1,4,5-трисфосфат (IP₃) образуется при гидролизе фосфолипида фосфолипазой C после активации Gq-сопряжённых рецепторов. Фосфорилируют белки, а не IP₃: PKA снижает его образование через регуляторные белки пути, и точная мишень зависит от клетки и остаётся предметом обсуждения. Поэтому на схеме это звено показано без значка P.", "gn_plc": "Фосфолипаза C", "g_plc": "Фермент, гидролизующий мембранный липид PI(4,5)P₂ до IP₃ и диацилглицерола. Растворимый IP₃ диффундирует в цитозоле и открывает IP₃-рецептор ЭПР, опустошая депо и запуская депо-зависимый вход. В T-лимфоците фосфолипазу C активирует рецептор антигена (через PLCγ); в практикуме этот участок не моделируется отдельно.", "gn_cn": "Кальциневрин", "g_cn": "Серин-треониновая фосфатаза, активная только в комплексе с Ca²⁺–кальмодулином. Дефосфорилирует транскрипционный фактор NFAT и открывает его сигнал ядерной локализации. Так сигнал передаётся активацией фосфатазы, а не киназы. Комплексы циклоспорина A с циклофилином и такролимуса с FKBP12 подавляют кальциневрин — на этом основана иммуносупрессия (Liu 1991; Hogan 2003).", "gn_nfat": "NFAT", "g_nfat": "Транскрипционный фактор; в покое фосфорилирован по многим участкам и удерживается в цитоплазме. Дефосфорилирование кальциневрином открывает сигнал ядерной локализации, и NFAT переходит в ядро, где вместе с другими факторами (в T-лимфоците — с AP-1) участвует в активации генов, среди которых IL2; для индукции IL2 одного ядерного NFAT недостаточно. Многосайтовое фосфорилирование делает переход резким. Ядерное состояние NFAT поддерживает продолжающаяся активность кальциневрина; после прекращения Ca²⁺-сигнала киназы рефосфорилируют NFAT, и он постепенно выходит из ядра — в опытах Kar 2011 ядерный NFAT1 сохранялся заметно дольше самого сигнала (Hogan 2003; Tomida 2003; Kar 2011).", "gn_cam": "Кальмодулин", "g_cam": "Небольшой Ca²⁺-связывающий белок. Связав Ca²⁺, меняет конформацию и активирует набор мишеней, среди которых фосфатаза кальциневрин. В модели доля активного кальциневрина задана крутой функцией от концентрации Ca²⁺ в цитозоле (многосайтовое дефосфорилирование NFAT делает ответ резким).", "gn_pmca": "PMCA", "g_pmca": "Ca²⁺-АТФаза плазматической мембраны; выводит Ca²⁺ из клетки против градиента за счёт ATP и возвращает концентрацию Ca²⁺ в цитозоле к уровню покоя. При повышении концентрации Ca²⁺ её активность возрастает с задержкой — примерно в пять раз, с восстановлением исходной активности около 4 мин (Bautista 2002); из-за этой задержки возврат Ca²⁺ даёт сначала высокий пик, а затем плато. В модели скорость переноса Ca²⁺ через PMCA задана насыщающейся функцией его концентрации в цитозоле.", "gn_tg": "Тапсигаргин", "g_tg": "Необратимый избирательный ингибитор SERCA. Блокирует закачку Ca²⁺ в ЭПР, и депо опустошается за счёт постоянной утечки — без участия рецептора и без образования IP₃ (Thastrup 1990). Поэтому если вход Ca²⁺ снаружи возникает после тапсигаргина, он вызван именно опустошением депо. Это основной инструмент, показывающий зависимость входа от состояния депо.", "gn_csa": "Циклоспорин A", "g_csa": "Иммунодепрессант. Связывается с внутриклеточным белком циклофилином, и уже образовавшийся комплекс подавляет кальциневрин (Liu 1991). Вход Ca²⁺ через Orai1 при этом не меняется, но NFAT не дефосфорилируется и остаётся в цитоплазме, поэтому NFAT-зависимые гены не активируются. На этом основано предотвращение отторжения трансплантата.", "gn_la": "Блокатор CRAC", "g_la": "Общее обозначение веществ, перекрывающих канал Orai1 снаружи. Трёхвалентные ионы (La³⁺, Gd³⁺) в низких концентрациях полностью блокируют ток CRAC: в клетках DT40 около 300 нМ Gd³⁺ или La³⁺ достаточно для полной блокады (Hogan 2010), а ток, восстановленный нормальным Orai1 в T-клетках больных, полностью блокировался La³⁺ в концентрации 2 мкМ (Feske 2006). Трёхвалентные ионы неизбирательны (действуют и на другие каналы), поэтому опыт с ними указывает на роль Orai1, но не доказывает её. В модели блокатор задан как резкое снижение проводимости канала.", "teacher_t": "Для преподавателя: проведение занятия, упрощения моделей и источники", "src_t_st": "Источники", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 мин, на продвинутый — 8–10 мин. В режиме «Сценарий: предскажите и проверьте» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку. На студенческой странице сайта порядок шагов и вариантов ответа перемешивается при каждом открытии; для проектора откройте страницу с параметром ?fixed — порядок будет тот же, что в этом файле и в гиде. Кнопки «Объяснения» открывают страницу объяснений семинара к нужному вопросу. Сквозная связь вопросов: активный рецептор — фактор обмена гуаниновых нуклеотидов для Gαs (вопрос 1) так же, как SOS1 для RAS (вопрос 3); стационарная доля активной формы в паре киназа — фосфатаза (вопрос 2) и в паре GEF — GAP (вопрос 3) задаётся отношением констант скорости прямой и обратной реакций (сами потоки в стационаре равны), а время переключения — суммой этих констант; PKA из вопроса 1 фосфорилирует фосфоламбан в вопросе 2; насос SERCA из вопроса 2 подавляется тапсигаргином в вопросе 4, и депо опустошается; в вопросе 4 сигнал передаёт фосфатаза кальциневрин.", "teacher_2": "Все величины условны, кроме прямо взятых из названных работ; модели передают направление изменений и порядок событий. Вопрос 1б: путь β-рецептор → Gαs → аденилатциклаза → cAMP → PKA в трёх клетках намеренно задан одинаковым (учебное допущение), различаются только мишени PKA; в модели учтены резерв рецепторов (половина прироста доли Gαs-GTP между 0 и 100 % занятости достигается примерно при 20 % занятости; при 10 % занятости достигается около 30 % прироста; значения не взяты из Violin 2008 и зависят от выбранного знаменателя) и кооперативная зависимость активности PKA от концентрации cAMP. Вопрос 1п: клетки HEK293 с эндогенным β2-рецептором и сенсором cAMP ICUE2, изопротеренол 1 мкМ, 37 °C (Violin 2008); спад cAMP задают GRK6 + β-аррестины и PKA-зависимая активация PDE4; половина активных рецепторов инактивируется примерно за 70 с (полувремя инактивации); при нокдауне GRK6 время полуспада в модели около 135 с (в опыте 105 с), эффект нокдауна β-аррестинов в модели заметнее, чем в опыте без H-89; ответ к 10-й минуте ослабевает, но остаётся выше исходного (в модели cAMP ×1,8, PKA 17 % против исходных 6 %), синтез cAMP в эндосомах не учтён. Вопрос 2б — расчёт по формулам стационарного баланса: p* = kк/(kк + kф), τ = 1/(kк + kф); нефосфорилированный фосфоламбан повышает на 0,2 мкМ концентрацию Ca²⁺, необходимую для половины максимальной активности SERCA2a (кажущуюся K½) (порядок данных Mahaney 2000). Вопрос 2п: кардиомиоцит мыши, изопротеренол с 1-й мин; константа дефосфорилирования PP1 (0,01 с⁻¹) — учебная, прямых измерений скорости дефосфорилирования PLN в клетке мы не нашли; время полуспада Ca²⁺-транзиента — учебная оценка, рассчитывается только спад свободного Ca²⁺ в цитозоле (сила и длина клетки не моделируются), вклад других эффектов β-стимуляции (фосфорилирование тропонина I и других белков) задан одной феноменологической поправкой q, а не откачкой Ca²⁺; дефосфорилирование Ser16 приписано одной PP1 (каликулин A ингибирует PP1 и PP2A) — это упрощение; Thr17 не учтён; стационар при изопротереноле: потоки vк = kк(1 − p) и vф = kф·p равны (0,0075 доли пула в секунду при p = 0,75). Вопрос 3б: собственный и GAP-стимулированный гидролиз вариантов KRAS — по табл. 1 Hunter 2015 (очищенный белок, p120GAP в ненасыщающей концентрации), обмен нуклеотида у вариантов как у нормального белка, масштаб клеточных констант учебный; эффекторы конкурируют за RAS-GTP с учебными сродствами. Вопрос 3п: захват GDP-формы KRAS G12C ковалентным ингибитором откалиброван по клеточным данным Lito 2016 (ARS-853, клетки рака лёгкого), поэтому константа гидролиза G12C в 3п задана отдельно от пробирочной в 3б. Вопрос 4б: [Ca²⁺] в ЭПР задаётся вручную, обратное влияние входа на наполнение депо не учитывается; перераспределение STIM1 и ток CRAC зависят от [Ca²⁺] в ЭПР по Luik 2008 (K½ около 190 и 170 мкМ, коэффициенты Хилла около 4). Вопрос 4п: модель на обыкновенных дифференциальных уравнениях (ОДУ) с SERCA, утечкой из ЭПР, PMCA, буферированием (свободным остаётся около 1 % вошедших ионов), активацией STIM1/Orai1 с задержкой 30–60 с и кальциневрин-зависимым переходом NFAT в ядро. Во втором протоколе 4п (импульс IP₃ длительностью 1 мин на 2-й минуте при 2 мМ Ca²⁺ снаружи, SERCA работает или заблокирована тапсигаргином) выход Ca²⁺ из ЭПР задан потоком, пропорциональным разности концентраций; время пополнения депо в модели задано условно (секунды) и не откалибровано по эксперименту, сохранён только порядок событий: пополнение депо, разборка кластеров STIM1, закрытие Orai1; перед опытом состояние доводится до стационарного состояния при 2 мМ Ca²⁺, поэтому исходная концентрация Ca²⁺ в цитозоле в нём около 70 нМ, а в первом протоколе в среде без Ca²⁺ — около 55 нМ.", "teacher_3": "Уточнения к распространённым схемам. Противоположные ответы бронха и сердца на адреналин в паре β1/β2 задаёт не выбор G-белка (оба сопряжены с Gs), а набор мишеней PKA; выбор G-белка различает пару α1/β2. Усиление тока CaV1.2 при β-стимуляции во многом обусловлено фосфорилированием белка Rad, а не только самого канала (Liu 2020). «β-аррестин запускает сигнал без G-белков» — не общее правило (Grundmann 2018); переключение β2-рецептора с Gs на Gi после фосфорилирования PKA описано в клетках HEK293 (Daaka 1997), но в опытах Violin 2008 на тех же клетках PKA не переключала рецептор на Gi — вопрос остаётся спорным. Рост фосфорилирования белка не доказывает активации киназы: к тому же результату приводит подавление фосфатазы. Фосфомиметики (S→D/E) воспроизводят фосфорилирование лишь частично: фосфоламбан S16E сохраняет около трети тормозящего действия (Lockamy 2011). «Онкогенный RAS навсегда включён» — неточно: у всех частых вариантов KRAS почти исчезает ответ на GAP, но собственный гидролиз у G12C почти как у нормального белка, а у Q61L почти отсутствует (Hunter 2015); G12C продолжает переходить между GTP- и GDP-формами, и на этом основано действие ингибитора, связывающегося с GDP-формой. STIM1 в покое — уже димер в сложенной конформации (Zhou 2013); он остаётся в мембране ЭПР и связывает Orai1 в участке контакта ЭПР с плазматической мембраной. Orai1 R91W сохраняет взаимодействие со STIM1 (Muik 2008, клетки HEK293), но в T-клетках больных ток CRAC не развивается (Feske 2006). Преходящий подъём Ca²⁺ после тапсигаргина в среде без Ca²⁺ обусловлен высвобождением из депо, а не входом из среды.", "src_01": "Weis W. I., Kobilka B. K. The Molecular Basis of G Protein-Coupled Receptor Activation. Annu Rev Biochem. 2018. doi:10.1146/annurev-biochem-060614-033910", "src_02": "Rasmussen S. G. F. et al. Crystal structure of the β2 adrenergic receptor-Gs protein complex. Nature. 2011. doi:10.1038/nature10361", "src_03": "Xin W. et al. Roles of GRK and PDE4 activities in the regulation of β-adrenergic signaling. J Gen Physiol. 2008. doi:10.1085/jgp.200709881", "src_04": "Violin J. D. et al. β2-adrenergic receptor signaling and desensitization elucidated by quantitative modeling of real time cAMP dynamics. J Biol Chem. 2008. doi:10.1074/jbc.M707009200", "src_05": "Nikolaev V. O. et al. Novel single chain cAMP sensors for receptor-induced signal propagation. J Biol Chem. 2004. doi:10.1074/jbc.C400302200", "src_06": "Irannejad R. et al. Conformational biosensors reveal GPCR signalling from endosomes. Nature. 2013. doi:10.1038/nature12000", "src_07": "Zaccolo M. et al. Subcellular Organization of the cAMP Signaling Pathway. Pharmacol Rev. 2021. doi:10.1124/pharmrev.120.000086", "src_08": "Billington C. K. et al. cAMP regulation of airway smooth muscle function. Pulm Pharmacol Ther. 2013. doi:10.1016/j.pupt.2012.05.007", "src_09": "Kume H. et al. β-adrenergic agonists regulate KCa channels in airway smooth muscle by cAMP-dependent and -independent mechanisms. J Clin Invest. 1994. doi:10.1172/JCI116969", "src_10": "Conti M. A., Adelstein R. S. The relationship between calmodulin binding and phosphorylation of smooth muscle myosin kinase by the catalytic subunit of cAMP-dependent protein kinase. J Biol Chem. 1981. PMID: 6259152; doi:10.1016/S0021-9258(19)69586-4", "src_11": "Bers D. M. Cardiac excitation-contraction coupling. Nature. 2002. doi:10.1038/415198a", "src_12": "Liu G. et al. Mechanism of adrenergic CaV1.2 stimulatio     Kpka: 4, nH: 2,  // PKA: полумаксимальная активность при cAMP ×4, коэффициент Хилла 2 (по два участка на R)
    kp4: 3, kdp4: 1, // фосфорилирование PDE4 протеинкиназой A и дефосфорилирование, мин⁻¹
    kgrk: 1,         // GRK (в HEK293 — прежде всего GRK6): фосфорилирование занятого агонистом рецептора, мин⁻¹
    kdp: 0.05,       // дефосфорилирование рецептора на поверхности, мин⁻¹
    karr: 3,         // связывание β-аррестина с фосфорилированным рецептором, мин⁻¹ (вместе с kgrk: полужизнь активного рецептора ≈70 с, Violin 2008)
    karrOff: 10,     // диссоциация β-аррестина после ухода агониста, мин⁻¹ (t½ ≈ 3 с после пропранолола, Violin 2008)
    kint: 0.08,      // интернализация комплекса рецептор–β-аррестин, мин⁻¹
    krec: 0.05,      // возврат рецептора из эндосомы на поверхность, мин⁻¹ (учебная оценка)
    phi: 1,          // фосфорилированный GRK рецептор без β-аррестина сохраняет сопряжение с Gs (инактивирует только β-аррестин; Violin 2008)
    kon: 30, koffProp: 30, // связывание изопротеренола и вытеснение его пропранололом — секунды (у Violin 2008 считаются мгновенными), мин⁻¹
    kdGrk: 0.4,      // siRNA к GRK6: активность GRK снижена на 60 % (так в модели Violin 2008)
    kdArr: 0.25,     // siRNA к β-аррестинам 1 и 2: в среднем 75 % подавления (Violin 2008)
    arrTot: 2,       // β-аррестина в 2 раза больше, чем рецепторов (так в модели Violin 2008); пул ограничен
  };
