ко именно, зависит от других регуляторов локуса, и это измеряют отдельно.","Промотор удалён вместе с TSS: факторы по-прежнему могут связываться с энхансером, но без промотора комплекс инициации не собирается, и РНК с этого места не синтезируется."],"m_tf":"Сайты для факторов энхансера","m_init":"Сборка комплекса инициации","m_rna":"Новосинтезированная РНК с этого промотора","v_tf":["есть","нет","есть"],"v_init":["возможна","возможна","невозможна"],"v_rna":["исходный уровень","может снизиться","не синтезируется"],"l_enh":"Энхансер","l_prom":"Промотор","l_tsa":"TSS","l_gene":"Ген","l_tf":"факторы","l_co":"коактиваторы","l_pic":"комплекс инициации","l_loop":"сближение участков при укладке хроматина","l_dist":"расстояние по последовательности ДНК","l_del":"удалён","static":["Схема показывает на одной шкале ДНК энхансер, промотор, место начала транскрипции (TSS) и ген. Факторы занимают энхансер, коактиваторы, по основной модели, передают влияние на комплекс инициации промотора при сближении участков.","При удалении энхансера промотор и TSS сохраняются, а количество РНК может снизиться; при удалении промотора РНК с него синтезироваться не будет."]}}},{"id":"specificity","number":10,"section":1,"title":"От чего зависит избирательность действия энхансера","question":2,"questions":[2],"keywords":["избирательность","совместимость","контакт","новосинтезированная РНК","ExP STARR-seq","K562"],"lead":["Действие энхансера на промотор зависит сразу от нескольких условий, а не от одного свойства.","Доступность участков, частота контактов и свойства промотора измеряют отдельно, потому что они не заменяют друг друга."],"mechanism":["Первое условие — доступ факторов к своим мотивам в данном типе клеток.","Второе условие — сближение энхансера и промотора: контакт создаёт возможность взаимодействия, но не гарантирует его результат.","Третье условие — способность промотора собрать продуктивный комплекс; результат измеряют по [[T52|новосинтезированной РНК]] за заданный интервал."],"paragraphs":["[[T31|Избирательность взаимодействия энхансера и промотора]] — это преимущественное влияние энхансера на определённые промоторы в заданных условиях. Она количественна и зависит от клеточной системы, поэтому не сводится к жёсткому правилу «один энхансер — один промотор». Её удобно разложить на несколько условий, которые не заменяют друг друга.","Первое условие — доступность. Мотив энхансера может быть открыт в клетках одного типа и закрыт нуклеосомой в клетках другого, а в разных клетках его занимают разные комбинации факторов. Второе условие — пространственные контакты: чем чаще энхансер сближается с промотором, тем больше возможностей для их взаимодействия. Третье — свойства самого промотора: его последовательность и набор факторов определяют, насколько продуктивно он отвечает на влияние энхансера.","Совместимость последовательностей проверяли в репортёрной системе. В опыте ExP STARR-seq на клетках человека линии K562 попарно сопоставили 1000 энхансеров и 1000 промоторов. Большинство энхансеров активировало большинство промоторов примерно одинаково, а активность пары описывалась произведением собственных активностей энхансера и промотора: такая модель объясняла 82 % дисперсии сигнала (R² = 0,82). Различия оказались тоньше: промоторы генов «домашнего хозяйства» слабее отвечали на энхансеры, чем промоторы генов с переменной экспрессией. Такой результат ограничивает универсальные утверждения о жёстких парах, но не отменяет избирательности в эндогенном локусе, где добавляются состояние хроматина и пространственная организация.","Отсюда вывод: частота контакта и синтез РНК — разные величины. После вмешательства контакт может участиться, а количество новосинтезированной РНК останется прежним, если, например, промотор недоступен или его ответ ограничен другими условиями. И наоборот, количество РНК может измениться без заметного изменения контакта. Поэтому частоту контакта, доступность и количество РНК измеряют независимо и на сопоставимых сроках."],"trap":["Если энхансер чаще контактирует с промотором, синтез РНК этого гена обязательно растёт пропорционально.","Контакт создаёт возможность взаимодействия, но не гарантирует результат. Доступность, набор факторов и свойства промотора ограничивают ответ, а связь частоты контакта с синтезом РНК не обязана быть линейной."],"conditions":"Результаты ExP STARR-seq получены на репортёрных конструкциях в клетках человека линии K562 (Bergman и соавт., 2022); эндогенный локус дополнительно ограничен хроматином и топологией (Yang и соавт., 2024; Hafner и соавт., 2023). Числа на схеме условные: формула учебной модели показана рядом, и это не результат измерения.","sources":["Bergman2022","Yang2024","Hafner2023"],"quiz":{"id":"S6-L10","question":"После вмешательства частота контакта энхансера с промотором выросла, но количество новосинтезированной РНК не изменилось. Какое объяснение допустимо?","options":[{"id":"S6-L10-1","text":"Контакт участился, а продуктивный ответ промотора ограничен другими условиями.","correct":true,"feedback":"Контакт создаёт возможность взаимодействия. Доступность, факторы и свойства промотора определяют результат."},{"id":"S6-L10-2","text":"Такой результат невозможен: контакт и транскрипция всегда меняются пропорционально.","correct":false,"feedback":"Частота контакта и синтез РНК — отдельные величины; строгая пропорциональность не установлена."},{"id":"S6-L10-3","text":"Наличие контакта позволяет исключить влияние доступности промотора и его факторов.","correct":false,"feedback":"Контакт не устраняет других условий продуктивной транскрипции. Состояние промотора остаётся самостоятельным ограничением."}]},"widget":{"kind":"compat","title":"","s":{"title":"Контакт, доступность и ответ промотора","status":"Условная учебная модель · числа не измерены","p_label":"Какой промотор изменять","promoters":["Промотор A","Промотор B"],"c_label":"Условная частота контакта энхансера E1 с выбранным промотором","cp_label":"Совместимость промотора с факторами энхансера","cp":["низкая","средняя","высокая"],"acc_label":"Промотор доступен для факторов","t_head":["Показатель","Промотор A","Промотор B"],"t_rows":["Условная частота контакта","Доступность для факторов","Совместимость","Новосинтезированная РНК, условный индекс"],"yes":"да","no":"нет","e1":"Энхансер E1","x_lab":"Частота контакта, условные единицы","y_lab":"Новосинтезированная РНК, условный индекс","chart_title":"Зависимость количества новосинтезированной РНК от частоты контакта в учебной модели","n_closed":"Промотор недоступен: рост частоты контакта не меняет синтез РНК. Контакт создаёт возможность взаимодействия, а не его результат.","n_sat":"Ответ промотора близок к насыщению: дальнейший рост частоты контакта почти не увеличивает синтез РНК.","n_low":"Совместимость промотора низкая: при той же частоте контакта РНК образуется меньше, чем у более совместимого промотора.","n_gen":"Ответ промотора растёт вместе с частотой контакта, но не пропорционально ей; связь определяют и другие условия.","formula":"Формула учебной модели: РНК = совместимость × доступность × c² / (50² + c²) × 100, где c — условная частота контакта. Это допущение модели, а не измеренная зависимость.","weights":"Значения совместимости в модели: низкая — 0,3; средняя — 0,6; высокая — 0,9. Для недоступного промотора доступность равна 0, для доступного — 1.","static":["Схема показывает энхансер E1 и два промотора. Для каждого промотора независимо заданы условная частота контакта, доступность и совместимость, а условный индекс новосинтезированной РНК рассчитывается по формуле учебной модели.","Если промотор недоступен, рост частоты контакта не меняет синтез РНК; при высоких частотах ответ насыщается."]}}},{"id":"loops","number":11,"section":1,"title":"Как когезин и CTCF меняют контакты хроматина","question":2,"questions":[2],"keywords":["когезин","CTCF","TAD","петля","Hi-C","RAD21","экструзия","граница"],"lead":["Когезин увеличивает петлю хроматина, а ориентированные сайты CTCF могут остановить её увеличение.","Топологически ассоциированный домен (TAD) — свойство усреднённой карты контактов, а не замкнутая «коробка»."],"mechanism":["[[T36|Когезин]] перемещается вдоль ДНК и увеличивает петлю; этот процесс называют [[T37|экструзией петли]].","Сайты связывания [[T38|CTCF]] могут задерживать когезин, и результат зависит от ориентации мотива.","На усреднённой карте контактов это видно как [[T39|TAD]]: внутри домена контакты встречаются чаще, чем через границу, но граница не абсолютна."],"paragraphs":["Когезин — кольцевой комплекс из семейства SMC. Он может перемещаться вдоль ДНК и процессивно увеличивать петлю: две удалённые по последовательности точки хроматина при этом сближаются. NIPBL участвует в загрузке когезина на ДНК, а WAPL — в его высвобождении; на схеме показан только основной процесс.","Продвижение когезина могут задерживать сайты связывания CTCF, и важна ориентация мотива. Для многих петель характерна конвергентная ориентация двух сайтов: их мотивы направлены навстречу друг другу. Эту закономерность нельзя без проверки переносить на каждую реальную границу: положение сайтов, время пребывания когезина на ДНК, скорость его высвобождения и состояние участка меняют распределение контактов.","Карта Hi-C показывает частоту контактов, усреднённую по множеству клеток. Области с повышенной частотой внутренних контактов видны на ней как TAD. Это статистическая картина, а не конформация одной клетки: петля не обязана существовать в каждой клетке непрерывно. Граница домена снижает вероятность части контактов через неё, но не исключает их. Поэтому положение энхансера внутри домена сужает поиск мишени, но не делает любой контакт за границей домена физически невозможным.","Что происходит при потере когезина? В опытах на клетках линии HCT-116 (колоректальная карцинома человека) быстрая деградация когезина привела через 6 ч к исчезновению всех петлевых доменов, тогда как компартментные домены и гистоновые метки остались прежними. Широкой эктопической активации генов не было, но экспрессия значительного меньшинства активных генов изменилась. Организация контактов и транскрипционный ответ зависят от разных условий и меняются в разных временных масштабах, поэтому влияние потери петель на конкретный ген проверяют в его клетках и на нужном сроке."],"trap":["TAD — замкнутая «коробка»: контакты через её границу полностью исключены.","Граница снижает вероятность части контактов, но не исключает их. TAD — статистическая характеристика популяции клеток и условий измерения, а не неподвижная структура с непроницаемой стенкой."],"conditions":"Свойства SMC-комплексов, экструзия петель и роль CTCF описаны в обзоре Hoencamp и соавт. (2023); результаты быстрой деградации когезина — в работе Rao и соавт. (2017; клетки линии HCT-116, 6 ч после добавления ауксина). Схема качественная: конкретные частоты контактов в ней не рассчитываются, а ориентации сайтов CTCF показывают логику правила, а не закон для каждого локуса.","sources":["Rao2017","Hoencamp2023"],"quiz":{"id":"S6-L11","question":"После быстрого удаления субъединицы когезина RAD21 исчезла значительная часть когезин-зависимых петель. В ранний срок количество РНК многих генов изменилось мало. Какой вывод обоснован?","options":[{"id":"S6-L11-1","text":"Организация контактов и транскрипция могут меняться в разной степени и с разной скоростью.","correct":true,"feedback":"Потеря петель не вызывает одинакового немедленного эффекта для каждого гена."},{"id":"S6-L11-2","text":"Если петля исчезла, экспрессия каждого гена внутри неё уже должна быть полностью подавлена.","correct":false,"feedback":"Такой обязательной связи нет: роль петли и время ответа проверяют для каждого локуса отдельно."},{"id":"S6-L11-3","text":"CTCF и когезин вообще не влияют на пространственную организацию генома в клетках.","correct":false,"feedback":"Уже первое наблюдение условия — исчезновение петель после удаления RAD21 — показывает, что организация контактов изменилась."}]},"widget":{"kind":"loop","title":"","s":{"title":"Экструзия петли и ориентация сайтов CTCF","status":"Качественная схема · не расчёт по данным","t_label":"Время экструзии, условные единицы","l_label":"Мотив левого сайта CTCF направлен","r_label":"Мотив правого сайта CTCF направлен","dirs":["вправо","влево"],"rad":"Когезин удалён (RAD21)","one_title":"Одна клетка в один момент (схема)","map_title":"Усреднённая карта контактов (качественная схема)","l_cohesin":"когезин","l_ctcf":"CTCF","l_left":"левый сайт","l_right":"правый сайт","m_state":"Состояние петли","m_domain":"Домен на карте","m_gene":"Транскрипционный ответ","st":["петель нет","ограничена с обеих сторон","ограничена с одной стороны","не ограничена сайтами CTCF","пока не выросла"],"dom":["не выражен","выражен, виден угловой пик","выражен частично","размыт"],"gene_v":"измеряют отдельно","n":["Когезина нет: петли не образуются, на карте остаётся убывание частоты контактов с расстоянием; компартменты в схеме не показаны. Влияние на транскрипцию в схеме не рассчитывается; его проверяют по новосинтезированной РНК.","Когезин дошёл до обоих сайтов, мотивы которых направлены навстречу друг другу, и остановился. Контакты внутри домена чаще, чем через границу, но контакты через границу не исключены.","Когезин остановился у одного сайта, а с другой стороны продолжает увеличивать петлю. Граница выражена только частично.","Мотивы направлены так, что сайты не задерживают когезин, и петля продолжает расти. Это логика схемы; поведение реальных границ зависит от положения сайтов и от времени пребывания когезина на ДНК.","Когезин ещё не успел значительно увеличить петлю: нужно больше времени экструзии."],"static":["Схема показывает, как когезин увеличивает петлю между двумя точками хроматина и как ориентированные сайты CTCF могут её ограничить. Рядом показана усреднённая карта контактов: внутри домена контакты чаще, чем через границу, но граница не исключает контактов.","При удалении когезина петли не образуются; транскрипционный ответ в схеме не рассчитывается."]}}},{"id":"coactivators","number":12,"section":1,"title":"Как факторы и коактиваторы связывают контакт с транскрипцией","question":2,"questions":[2],"keywords":["Mediator","CBP/p300","BRD4","H3K27ac","BET-ингибитор","коактиватор","конденсат"],"lead":["Mediator, CBP/p300 и BRD4 по-разному участвуют в передаче влияния энхансера на транскрипцию.","Связывание белка, ацетилирование гистона и изменение синтеза РНК — разные события, и измеряют их отдельно."],"mechanism":["[[T33|Mediator]] способствует взаимодействию активаторов, связанных с энхансером, с аппаратом РНК-полимеразы II.","[[T34|CBP/p300]] — ацетилтрансферазы: они присоединяют ацетильные группы к лизинам, в том числе к лизину 27 гистона H3 ([[T58|H3K27ac]]).","[[T35|BRD4]] связывает ацетилированные участки хроматина и участвует в регуляции транскрипции."],"paragraphs":["[[T32|Коактиватор]] — белок или комплекс, который способствует транскрипции, взаимодействуя с регуляторами и с транскрипционным аппаратом. На энхансере действуют сразу несколько таких белков, и их функции не совпадают.","Mediator — многосубъединичный комплекс. Его хвостовой модуль связывается с активаторами на энхансере и облегчает сборку преинициаторного комплекса РНК-полимеразы II на промоторе. По данным обзора Yang и соавт., после острого удаления Mediator частота контактов энхансера с промотором, измеренная методом Hi-C, менялась мало (авторы обзора оговаривают технические ограничения таких методов). Это согласуется с тем, что связь между энхансером и промотором не сводится к одному белку, а контакт и функция коактиватора — разные величины.","CBP и p300 — родственные ацетилтрансферазы. Они присоединяют ацетильную группу к лизинам гистонов, в частности к лизину 27 гистона H3, и поэтому на активных энхансерах появляется метка H3K27ac. Воздействия на эти белки бывают разными. Каталитический ингибитор A-485 конкурирует с ацетил-КоА и в клетках линии PC-3 снижал H3K27ac, но не H3K9ac. Блокада бромодомена CBP/p300 в моделях гематологических опухолей приводила к потере H3K27ac на энхансерах при сохранении самих белков на хроматине. Это два разных вмешательства, и результаты нельзя объединять в одно утверждение.","BRD4 относится к BET-белкам: его бромодомены связывают ацетилированные лизины, поэтому BRD4 локализуется на ацетилированном хроматине. BET-ингибитор препятствует такому связыванию, и присутствие BRD4 в локусе уменьшается. Присутствие BRD4 — показатель связывания; он не равен ни контакту энхансера с промотором, ни синтезу РНК.","Скопления коактиваторов в ядре описывают как возможные локальные конденсаты. Одной микрофотографии для вывода о [[T42|фазовом разделении]] недостаточно; критерии и ограничения разобраны в следующем шаге."],"trap":["Если BET-ингибитор уменьшил присутствие BRD4 на энхансере, то синтез РНК мишени тоже снизился.","Присутствие BRD4, контакт энхансера с промотором и синтез РНК — разные величины. Влияние ингибитора на транскрипцию оценивают по новосинтезированной РНК в том же временном интервале, а не по одному из первых двух показателей."],"conditions":"Роль Mediator и данные о контактах после его острого удаления даны по обзору Yang и соавт. (2024); A-485 как каталитический ингибитор CBP/p300 (клетки PC-3, снижение H3K27ac, но не H3K9ac) — по работе Lasko и соавт. (2017); зависимость активности энхансера от бромодомена CBP/p300 в моделях гематологических опухолей — по аннотации работы Raisner и соавт. (2018). Сведения о BRD4 и о действии BET-ингибиторов — общие, в источниках шага не проверялись. Состояния на схеме выбираются вручную и показывают логику измерений, а не результаты опытов.","sources":["Yang2024","Hafner2023","Lasko2017","Raisner2018"],"quiz":{"id":"S6-L12","question":"BET-ингибитор уменьшил присутствие BRD4 в локусе, а контакт энхансера с промотором в тот же срок сохранился. Что необходимо измерить, чтобы оценить транскрипционный эффект?","options":[{"id":"S6-L12-1","text":"Новосинтезированную РНК мишени в том же временном интервале.","correct":true,"feedback":"Сохранение контакта не отвечает на вопрос о продуктивности транскрипции. Нужен отдельный показатель синтеза РНК."},{"id":"S6-L12-2","text":"Исходное расстояние между элементами по последовательности ДНК.","correct":false,"feedback":"По исходному расстоянию нельзя судить о действии BRD4 на текущую транскрипцию."},{"id":"S6-L12-3","text":"Наличие CTCF в другом локусе.","correct":false,"feedback":"Наличие CTCF в другом локусе не служит прямым показателем ответа исследуемой мишени."}]},"widget":{"kind":"coact","title":"","s":{"title":"Четыре независимых показателя","status":"Логика измерений · состояния задаются вручную","preset_label":"Пример условия","presets":["Исходное: ничего не измерено","BET-ингибитор: присутствие BRD4 снижено, контакт сохраняется","Каталитический ингибитор CBP/p300: H3K27ac снижен"],"ctl_label":"Состояния показателей","names":["Контакт энхансера с промотором","H3K27ac на энхансере","Присутствие BRD4 в локусе","Новосинтезированная РНК мишени"],"states":["не измерено","ниже","без изменений","выше"],"legend_bind":"связывание","legend_react":"химическая реакция (ацетилирование)","legend_fun":"функциональное влияние","l_enz":"CBP/p300","l_prom":"промотор","l_enh":"энхансер","c_title":"Что можно заключить","c_none":"Транскрипционный эффект не оценён: ни контакт, ни H3K27ac, ни присутствие BRD4 не заменяют измерения новосинтезированной РНК.","c_rna":"Количество новосинтезированной РНК мишени: {s}.","c_nocontact":"Количество новосинтезированной РНК изменилось, а контакт — нет: контакт не был единственным звеном.","c_brd_same":"Присутствие BRD4 снижено, а синтез РНК не изменился: связь присутствия BRD4 с синтезом РНК в этом локусе и на этом сроке не подтверждена.","c_brd_contact":"Контакт сохраняется при сниженном присутствии BRD4: это разные величины.","c_ac":"H3K27ac снижен: присутствие BRD4 и синтез РНК нужно измерять отдельно, потому что метка не определяет их автоматически.","c_unm":"Не измерено: {s}.","static":["Схема показывает четыре независимых показателя: контакт энхансера с промотором, H3K27ac, присутствие BRD4 и новосинтезированную РНК. Связывание, ацетилирование и функциональное влияние обозначены разными стрелками.","Если новосинтезированная РНК не измерена, транскрипционный эффект не оценён: контакт, H3K27ac и присутствие BRD4 не заменяют такого измерения."]}}},{"id":"super-enhancers","number":13,"section":1,"title":"Что называют суперэнхансером","question":2,"questions":[2],"keywords":["суперэнхансер","H3K27ac","порог","ранжирование","конденсат","фазовое разделение","BRD4","MED1"],"lead":["Суперэнхансер — группа соседних регуляторных элементов, выделенная по заданному критерию высокого суммарного сигнала.","Порог такого отбора условен, а принадлежность к суперэнхансерам сама по себе не доказывает влияние на конкретный ген."],"mechanism":["Соседние элементы с высоким сигналом H3K27ac или связывания коактиваторов объединяют в группу, если расстояние между ними меньше выбранного предела.","Группы ранжируют по суммарному сигналу; к [[T41|суперэнхансерам]] относят те, что превышают заданный порог.","Влияние группы на ген проверяют отдельно: нарушают функцию элементов и измеряют РНК предполагаемой мишени с контролями."],"paragraphs":["Суперэнхансер — не особая последовательность, а группа регуляторных элементов, выделенная по конкретному критерию: например, по высокому суммарному сигналу H3K27ac или связывания коактиваторов, таких как BRD4 и MED1. Один из способов выделения состоит в том, чтобы объединить близко расположенные элементы и проранжировать получившиеся группы по суммарному сигналу.","Критерий условен. Если изменить расстояние, на котором соседние элементы объединяют, или порог суммарного сигнала, состав списка изменится: часть групп попадёт в него или выйдет из него. Поэтому «суперэнхансер» — операционное понятие, и в каждой работе нужно выяснить, по какой метке, при каком объединении и при каком пороге группу выделили.","Выделенные так группы часто расположены рядом с генами клеточной идентичности. Например, в эмбриональных стволовых клетках мыши суперэнхансеры связаны с геном Nanog, а также с генами Klf4, Mir290 и Trim28 (Sabari и соавт., 2018). Однако высокий сигнал H3K27ac помогает лишь выбрать кандидатов: он не показывает, какой ген регулируется группой и нужна ли она для экспрессии этого гена. Для этого нарушают функцию элементов, например удаляют их или подавляют адресно, и измеряют новосинтезированную РНК предполагаемой мишени с контролями. Ближайший ген мишенью автоматически не считают.","На суперэнхансерах эмбриональных стволовых клеток мыши BRD4 и MED1 образуют скопления с жидкоподобными свойствами; опыты in vitro и с 1,6-гександиолом поддерживают модель конденсации. Это не доказывает, что каждый суперэнхансер образует конденсат или что конденсат необходим для транскрипции: критерии косвенные, а 1,6-гександиол неспецифичен. Одинаковую чувствительность всех суперэнхансеров к BET-ингибитору тоже нельзя предполагать заранее."],"trap":["Суперэнхансер — одна очень длинная последовательность с особой функцией, а высокий сигнал H3K27ac доказывает регуляцию ближайшего гена.","Суперэнхансер — группа соседних элементов, выделенная по заданному критерию с условным порогом. Сигнал H3K27ac помогает найти кандидатов, а мишень и необходимость группы устанавливают отдельным функциональным тестом."],"conditions":"Определение по критерию сигнала и ограничения интерпретации даны по обзорам Hafner и соавт. (2023) и Yang и соавт. (2024); скопления BRD4 и MED1 в эмбриональных стволовых клетках мыши, опыты in vitro и с 1,6-гександиолом, а также связь суперэнхансеров с генами Nanog, Klf4, Mir290 и Trim28 — по работе Sabari и соавт. (2018). Значения на схеме искусственные и показывают логику классификации.","sources":["Hafner2023","Yang2024","Sabari2018"],"quiz":{"id":"S6-L13","question":"Группу элементов отнесли к суперэнхансерам по высокому суммарному сигналу H3K27ac. Какой дополнительный тест нужен, чтобы установить её влияние на выбранный ген?","options":[{"id":"S6-L13-1","text":"Нарушить функцию элементов и измерить РНК предполагаемой мишени с контролями.","correct":true,"feedback":"Критерий классификации и функциональное действие проверяют отдельно."},{"id":"S6-L13-2","text":"Ограничиться высоким сигналом H3K27ac, потому что он уже доказывает функциональную связь.","correct":false,"feedback":"Метка помогает выделить кандидатов, но не доказывает причинную связь с конкретным геном."},{"id":"S6-L13-3","text":"Выбрать ближайший ген, потому что суперэнхансеры действуют только на него.","correct":false,"feedback":"По близости расположения нельзя установить мишень регуляторного элемента."}]},"widget":{"kind":"super","title":"","s":{"title":"Классификация зависит от критерия","status":"Искусственные данные · иллюстрация критерия","gap_label":"Объединять элементы, расстояние между которыми меньше","gap_unit":" kb","thr_label":"Порог суммарного сигнала, условные единицы","axis_lab":"Положение вдоль участка генома, kb (условно)","sig_lab":"Сигнал H3K27ac, условные единицы","rank_title":"Группы, ранжированные по суммарному сигналу","super_lab":"суперэнхансер по этому критерию","other_lab":"ниже порога","m_groups":"Групп после объединения","m_super":"Отнесено к суперэнхансерам","m_fun":"Влияние на ген проверено","v_fun":"нет: нужен функциональный тест","n_yes":"По выбранным критериям к суперэнхансерам отнесено групп: {k}. Изменение расстояния объединения или порога меняет этот список, хотя сами элементы остаются прежними.","n_none":"При таком пороге ни одна группа не отнесена к суперэнхансерам. Критерий задаёт исследователь, а не природа элементов.","n_fun":"Принадлежность к списку не показывает мишень группы. Для этого нарушают функцию элементов и измеряют новосинтезированную РНК предполагаемого гена-мишени с контролями.","tip_g":"группа","tip_sum":"сумма","static":["Схема показывает ряд соседних регуляторных элементов с условным сигналом H3K27ac. Соседние элементы объединяются по заданному расстоянию, группы ранжируются по суммарному сигналу, а порог определяет, какие из них отнесены к суперэнхансерам.","Изменение расстояния и порога меняет список; влияние группы на ген в схеме не проверяется."]}}},{"id":"enhancer-test","number":14,"section":1,"title":"Как проверить мишень энхансера и последствия перестройки","question":2,"questions":[2],"keywords":["мишень энхансера","Hi-C","ATAC","CUT&Tag","CRISPRi","делеция","репортёр","EPHA4","перестройка"],"lead":["Чтобы установить мишень энхансера, нужно вмешаться в исходный локус и измерить новосинтезированную РНК.","Контакт, доступность, метки хроматина и репортёрный тест — отдельные свидетельства, и каждое отвечает на свой вопрос."],"mechanism":["Hi-C и 4C показывают контакты, ATAC — доступность, ChIP и CUT&Tag — присутствие белка или модификации; вместе они помогают выбрать кандидата, но не доказывают регуляцию.","Репортёрный тест показывает, что фрагмент способен усиливать транскрипцию в конкретной системе, а не то, что он регулирует данный ген в исходном локусе.","Мишень устанавливают вмешательством в локус — делецией, подавлением (CRISPRi) или заменой мотива — и независимым измерением новосинтезированной РНК."],"paragraphs":["Методы отвечают на разные вопросы. Hi-C и 4C измеряют частоту пространственной близости участков, ATAC — доступность хроматина для транспозазы, ChIP и CUT&Tag — присутствие белка или модификации около участка. Эти показатели помогают выбрать кандидатов в энхансеры и в мишени, однако ни один из них не доказывает, что элемент регулирует данный ген. Высокий сигнал ATAC в смеси клеток может отражать небольшую популяцию, а контакт не равен синтезу РНК.","Репортёрный тест проверяет, способен ли фрагмент усиливать транскрипцию в конструкции. После переноса фрагмента меняются соседство, число копий и хроматиновый контекст. Поэтому положительный результат показывает активность фрагмента в этой системе, но система воспроизводит не все ограничения исходного локуса.","Ближе к физиологии вмешательство в самом локусе. Делеция проверяет необходимость участка, но одновременно изменяет расстояния между соседними последовательностями. Точечная замена мотива точнее указывает на роль конкретного сайта связывания фактора, хотя может создать новый мотив. Подавление участка с помощью dCas9-KRAB (CRISPRi) даёт другую проверку, но вмешательство может менять местный хроматин. Если разные способы приводят к согласованному изменению новосинтезированной РНК, вывод устойчивее. Отсутствие эффекта одной делеции не доказывает, что элемент нефункционален: соседние элементы могут частично компенсировать его утрату.","Перестройки показывают, как состав мишеней может меняться. В локусе WNT6/IHH/EPHA4/PAX3, охватывающем несколько TAD, делеции, инверсии и дупликации вызывают у людей разные пороки формирования конечности. В мышиных моделях с соответствующими перестройками кластер энхансеров конечности, в норме связанный с Epha4 внутри одного TAD, оказывался смещён относительно границ TAD и запускал эктопическую экспрессию другого гена локуса. Такое перераспределение контактов происходило только в тех случаях, когда вариант нарушал границу, связанную с CTCF."],"trap":["Если фрагмент усиливает репортёр и расположен рядом с геном A, то он регулирует ген A в исходном локусе.","Репортёрный тест показывает активность фрагмента в конструкции, а близость и доступность лишь помогают выбрать кандидата. Мишень в исходном локусе устанавливают вмешательством и независимым измерением новосинтезированной РНК."],"conditions":"Возможности и ограничения методов описаны в обзорах Preissl и соавт. (2023) и Yang и соавт. (2024); совместимость последовательностей в репортёрной системе — в работе Bergman и соавт. (2022); перестройки района EPHA4 — в работе Lupiáñez и соавт. (2015; люди, модельные мыши, фибробласты пациентов). Сравнение делеции, замены мотива и CRISPRi дано как общее методическое знание: в названных обзорах оно не разбирается. Схема качественная и не содержит результатов измерений; она не заменяет интерпретацию нового варианта у конкретного пациента.","sources":["Lupianez2015","Bergman2022","Preissl2023","Yang2024"],"quiz":{"id":"S6-L14","question":"В репортёрном тесте фрагмент усиливает экспрессию. Какой результат сильнее подтверждает, что в исходном локусе он регулирует именно ген A?","options":[{"id":"S6-L14-1","text":"Вмешательство в локус меняет новосинтезированную РНК A; независимое вмешательство даёт тот же результат.","correct":true,"feedback":"Функциональное вмешательство в исходной системе связывает элемент с измеряемым ответом; нужны также контроль специфичности и жизнеспособности."},{"id":"S6-L14-2","text":"Фрагмент расположен ближе к гену A, чем к любому другому гену, находящемуся рядом с этим локусом.","correct":false,"feedback":"Расстояние полезно для выбора кандидата, но не устанавливает функциональную связь."},{"id":"S6-L14-3","text":"Фрагмент имеет высокий ATAC-сигнал в смеси клеток, в которых экспрессируется ген A, и связывает активаторы.","correct":false,"feedback":"Доступность хроматина и связывание активаторов сами по себе не определяют ген-мишень."}]},"widget":{"kind":"enhtest","title":"","s":{"title":"Методы проверки и перестройка границы","status":"Качественная схема · не результаты измерений","m_label":"Метод или показатель","m_head":["Что показывает","Чего сам по себе не показывает"],"methods":[["Hi-C и 4C","частоту пространственной близости участков в популяции клеток","длительность контакта в одной клетке и причинную роль контакта в транскрипции"],["ATAC-seq","доступность хроматина для транспозазы","связывание конкретного фактора и продуктивную транскрипцию"],["ChIP-seq и CUT&Tag","присутствие белка или модификации около участка","какой ген регулируется и идёт ли транскрипция"],["Репортёрный тест","способность фрагмента усиливать транскрипцию в конструкции","регуляцию гена в исходном локусе: меняются соседство, число копий и хроматиновый контекст"],["Делеция энхансера в локусе","необходимость участка для ответа в исходном локусе","вклад отдельных мотивов; соседние элементы могут компенсировать потерю и скрыть эффект"],["CRISPRi (dCas9-KRAB)","снижение активности участка без удаления последовательности","отсутствие побочных изменений хроматина вокруг подавляемого участка"],["Замена мотива","роль конкретного сайта связывания фактора","отсутствие нового мотива и вклад других сайтов"],["Новосинтезированная РНК","скорость синтеза РНК мишени за выбранный интервал","причину изменения без вмешательства и контролей"]],"r_label":"Вариант локуса","r":["Исходный локус","Делеция границы","Энхансеры смещены за границу","Перестройка, сохраняющая границу"],"l_enh":"энхансеры конечности","l_bound":"граница, связанная с CTCF","l_a":"ген A","l_b":"ген B","l_ect":"эктопическая экспрессия","rm_contact":"Контакт энхансеров с геном B","rm_rna":"РНК гена B в конечности","rm_bound":"Граница","rv_contact":["ограничен границей","возможен","возможен","ограничен границей"],"rv_rna":["нет эктопической","эктопическая","эктопическая","нет эктопической"],"rv_bound":["есть","нарушена","смещена относительно энхансеров","сохранена"],"rn":["Исходный локус: граница, связанная с CTCF, отделяет энхансеры конечности от гена B. Контакты через границу снижены, но не исключены.","Граница удалена: энхансеры получают доступ к гену B, и в тканях, где энхансеры активны, возможна эктопическая экспрессия этого гена.","Энхансеры оказались по другую сторону границы относительно прежней мишени и сближаются с геном B; в мышиных моделях в таких случаях наблюдали эктопическую экспрессию другого гена локуса.","Перестройка сходного масштаба не затрагивает границу: эктопические контакты заметно слабее, эктопической экспрессии нет. Именно такие перестройки в работе служили контролем."],"static":["Схема сопоставляет методы и их ограничения (контакты, доступность, присутствие белка, репортёрный тест, делеция, CRISPRi, замена мотива, новосинтезированная РНК), а также показывает локус с границей, связанной с CTCF.","При нарушении границы энхансеры получают доступ к другому гену, и возможна его эктопическая экспрессия; перестройка, сохраняющая границу, этого не вызывает."]}}},{"id":"foxo","number":15,"section":2,"title":"Как сигнал инсулина достигает FOXO","question":3,"questions":[3],"keywords":["FOXO","инсулин","IGF-1","PI3K","PIP₃","AKT","PTEN","pAKT","IRS"],"lead":["Сигнал инсулина или IGF-1 доходит до FOXO по цепи реакций: рецептор → IRS → PI3K → PIP₃ → AKT → FOXO.","PI3K фосфорилирует липид в мембране, а AKT — белок FOXO; количество AKT, её фосфорилирование и каталитическая активность — разные величины."],"mechanism":["Рецептор инсулина или рецептор IGF-1 фосфорилирует белки IRS, к которым присоединяется липидкиназа PI3K.","PI3K превращает мембранный PI(4,5)P₂ в PIP₃; фосфатаза PTEN снижает содержание PIP₃.","PIP₃ привлекает AKT к мембране, где её фосфорилируют PDK1 и mTORC2; активная AKT фосфорилирует [[T44|FOXO]] по определённым участкам."],"paragraphs":["После связывания инсулина или IGF-1 рецептор фосфорилирует адаптерные белки IRS, и к ним присоединяется липидкиназа PI3K. Её субстрат — мембранный фосфоинозитид PI(4,5)P₂: PI3K превращает его в PIP₃. На этом этапе FOXO ещё не затронут, а сам PIP₃ остаётся в мембране.","PIP₃ служит местом связывания для киназы AKT, поэтому AKT локализуется у мембраны. Там её фосфорилируют PDK1 (по Thr308) и mTORC2 (по Ser473). Фосфатаза PTEN дефосфорилирует PIP₃ и тем самым снижает содержание этого липида; при потере PTEN оно может быть повышенным и без внешнего сигнала.","Активная AKT фосфорилирует FOXO. В человеческом FOXO1 это остатки Thr24, Ser256 и Ser319; в клетках 293 их фосфорилирование при стимуляции IGF-1 подавлялось вортманнином, ингибитором PI3K, но не рапамицином. Поэтому порядок событий таков: сначала фосфорилируется липид, затем киназа AKT, затем транскрипционный фактор FOXO1.","Для AKT различают три величины: количество белка, его фосфорилирование по Thr308 и Ser473 (pAKT) и [[T51|каталитическую активность]] — способность фосфорилировать заданный субстрат. Эти величины не обязательно изменяются одновременно: pAKT показывает модификацию самой киназы, а активность оценивают по фосфорилированию её субстрата (шаг 20)."],"trap":["PI3K — киназа, поэтому она сама фосфорилирует FOXO.","Субстрат PI3K — фосфоинозитид в мембране, а не белок FOXO. FOXO1 фосфорилируется киназой AKT, которая активируется ниже по цепи, поэтому подавление PI3K действует на FOXO опосредованно — через PIP₃ и AKT."],"conditions":"Фосфорилирование человеческого FOXO1 киназой PKB/AKT по Thr24, Ser256 и Ser319, его зависимость от PI3K (вортманнин) и независимость от рапамицина показаны в клетках 293 при стимуляции IGF-1 (Rena и соавт., 1999); эти же номера остатков названы в работе Zhao и соавт. (2004). Зависимость гиперфосфорилирования AKT по Thr308 и Ser473 от PI3K, PDK1 и mTORC2 описана в клетках HEK293 (Okuzumi и соавт., 2009). Роль PTEN дана как общее сведение о пути и в источниках шага не измерялась. Схема качественная: уровни условны и не измерены.","sources":["RodriguezColman2024","Zhao2004","Rena1999","Okuzumi2009"],"quiz":{"id":"S6-L15","question":"В клетках с сохранными рецептором и IRS селективно подавлена PI3K. Какое звено рассматриваемой цепи нарушено непосредственно?","options":[{"id":"S6-L15-1","text":"Образование мембранного PIP₃ из PI(4,5)P₂.","correct":true,"feedback":"PI3K фосфорилирует фосфоинозитид. Дальнейшие изменения AKT и FOXO следуют из нарушения этого звена."},{"id":"S6-L15-2","text":"Экспорт FOXO1 из ядра в цитоплазму переносчиком PI3K.","correct":false,"feedback":"PI3K — липидкиназа, а не экспортный рецептор. Перенос FOXO меняется на последующих этапах сигнальной цепи."},{"id":"S6-L15-3","text":"Фосфорилирование FOXO1 самой киназой PI3K.","correct":false,"feedback":"В рассматриваемой цепи субстрат PI3K — мембранный фосфоинозитид. FOXO1 фосфорилируется киназой AKT."}]},"widget":{"kind":"pathway","title":"","s":{"title":"Цепь от рецептора до FOXO1: что меняется при разных воздействиях","status":"Качественная схема · уровни условные, не измерения","cond_label":"Условие","conds":["Сигнала нет","Сигнал инсулина или IGF-1","Сигнал и селективный ингибитор PI3K","Сигнал и АТФ-конкурентный ингибитор AKT","Потеря PTEN, сигнала нет","Сигнал и рапамицин"],"rows":["Активность рецептора и IRS","Активность PI3K","PIP₃ в мембране","pAKT (Thr308 и Ser473)","Каталитическая активность AKT по субстрату","Фосфорилирование FOXO1 по участкам AKT"],"notes":["Сигнала нет: активность рецептора, PI3K и AKT остаётся на исходном низком уровне, PIP₃ в мембране мало, FOXO1 по участкам AKT почти не фосфорилирован.","Сигнал активирует рецептор и PI3K, в мембране образуется PIP₃, AKT фосфорилируется и фосфорилирует FOXO1 по Thr24, Ser256 и Ser319.","Селективный ингибитор PI3K подавляет образование PIP₃. AKT не привлекается к мембране и не активируется, поэтому фосфорилирование FOXO1 остаётся низким, хотя рецептор активен. Вортманнин подавлял фосфорилирование FOXO1 при стимуляции IGF-1 в клетках 293 (Rena и соавт., 1999).","АТФ-конкурентный ингибитор подавляет фосфорилирование субстратов AKT, но pAKT при этом остаётся высоким: связывание ингибитора с АТФ-связывающим участком вызывает гиперфосфорилирование самой киназы (Okuzumi и соавт., 2009, клетки HEK293). Фосфорилирование FOXO в этой работе не измеряли, поэтому на схеме оно «не определяется».","При потере PTEN липид PIP₃ не дефосфорилируется и накапливается даже без внешнего сигнала, поэтому AKT частично активна, а FOXO1 частично фосфорилирован. Степень этих изменений зависит от клеточной системы. Это общее свойство пути; в источниках шага оно не измерялось.","Рапамицин действует на mTORC1, а не на PI3K и AKT. Фосфорилирование FOXO1 по Thr24, Ser256 и Ser319 при стимуляции IGF-1 он не подавлял (клетки 293, Rena и соавт., 1999). Фосфорилирование и активность AKT в этих опытах не определяли."],"res_title":"Что показывает схема в этом условии","t_head":["Показатель","Уровень"],"lvl_note":"Уровни качественные. «Не определяется» означает, что показатель в источниках не измеряли или к условию он неприменим. Если pAKT и активность AKT по субстрату различаются, обе строки подсвечены.","akt_const":"Допущение схемы: количество белка AKT во всех условиях одинаково.","l_ext":"Вне клетки","l_mem":"Мембрана","l_cyt":"Цитоплазма","l_nuc":"Ядро","l_lig":"Инсулин / IGF-1","l_rec":"Рецептор","l_pip2":"PI(4,5)P₂","l_pip3":"PIP₃","l_pi3k":"PI3K","l_pten":"PTEN","l_akt":"AKT","l_pdk":"PDK1","l_mtor":"mTORC2","l_pakt":"pAKT","l_act":"активность AKT","l_foxo":"FOXO1","l_foxop":"FOXO1–P","l_mtor1":"mTORC1","l_inh":"Ингибитор","l_inh_akt":"Ингибитор AKT","l_rap":"Рапамицин","static":["Схема показывает цепь: инсулин или IGF-1 → рецептор → IRS → PI3K → PIP₃ в мембране → AKT (при участии PDK1 и mTORC2) → FOXO1. PTEN снижает содержание PIP₃.","Без сигнала все показатели цепи низкие, при сигнале они повышаются по всей цепи. Селективный ингибитор PI3K снижает содержание PIP₃ и фосфорилирование FOXO1 при активном рецепторе. АТФ-конкурентный ингибитор AKT снижает фосфорилирование субстратов при высоком pAKT. Рапамицин не подавлял фосфорилирование FOXO1 по участкам AKT в клетках 293."]}}},{"id":"foxo-transport","number":16,"section":2,"title":"Как фосфорилирование меняет распределение FOXO1","question":3,"questions":[3],"keywords":["перенос","импорт","экспорт","14-3-3","CRM1","XPO1","лептомицин B","NLS","NES","Thr24","Ser256","Ser319"],"lead":["Фосфорилирование FOXO1 меняет баланс между переносом белка в ядро и из ядра.","Перенос в ядро и из ядра, связывание с ДНК и синтез РНК — разные события, и измеряют их отдельно."],"mechanism":["FOXO1 постоянно перемещается между ядром и цитоплазмой; в белке есть [[T45|сигнал ядерной локализации (NLS)]] и [[T46|сигнал ядерного экспорта (NES)]].","Фосфорилирование Thr24, Ser256 и Ser319 влияет на перенос несколькими способами: с фосфорилированным FOXO1 связываются белки [[T47|14-3-3]], а Ser319 и соседние остатки действуют совместно с NES.","Экспорт FOXO1 из ядра чувствителен к лептомицину B; экспортным рецептором такого сигнала служит [[T48|CRM1/XPO1]] (для FOXO1 в источнике шага CRM1 прямо не показан)."],"paragraphs":["FOXO1 не закреплён ни в ядре, ни в цитоплазме: он постоянно переходит между ними. В белке есть сигнал ядерной локализации в C-концевой области ДНК-связывающего домена, богатой основными аминокислотами, и лейцин-богатый сигнал ядерного экспорта, чувствительный к лептомицину B. [[T50|Доля FOXO1 в ядре]] определяется соотношением скоростей импорта и экспорта, а не одной из них.","Фосфорилирование Thr24, Ser256 и Ser319 смещает это соотношение несколькими способами. Белки 14-3-3 связываются с фосфорилированным FOXO1, и для этого существенны одновременно Thr24 и Ser256. Ser319 и три соседних остатка действуют совместно с сигналом экспорта. Участок 1–50, слитый с GFP, достаточен для исключения белка из ядра, и для этого необходимо фосфорилирование Thr24. Эти способы не заменяют друг друга и не сводятся к одному остатку.","Белок 14-3-3 — партнёр связывания, а не экспортный рецептор. FOXO1 переносится из ядра рецептором CRM1/XPO1, поэтому при активном сигнале инсулина под действием лептомицина B FOXO1 должен накапливаться в ядре, а его фосфорилирование — сохраняться. Связывание фосфорилированного FOXO1 с ДНК при этом может оставаться слабым. Это предсказание вытекает из устройства пути: в источниках шага такой опыт не описан.","У других паралогов схема иная. Для FOXO4 (AFX) в клетках 3T3 показано, что AKT фосфорилирует белок в ядре по Ser193 внутри неклассического сигнала ядерной локализации и ослабляет импорт, а экспорт фосфорилированием не регулируется. Поэтому, говоря о переносе, называют белок, участок и клетки."],"trap":["Фосфорилированный FOXO1 связан с 14-3-3, значит, 14-3-3 выводит его из ядра.","Белки 14-3-3 связывают фосфорилированные мотивы, но экспортным рецептором служит CRM1/XPO1. Авторы источника (Zhao и соавт., 2004) допускают, что белок 14-3-3, связанный в районе Ser256, может препятствовать ядерному импорту FOXO1 и его связыванию с ДНК; вклад каждого механизма зависит от участка и белка."],"conditions":"Остатки Thr24, Ser256, Ser319, участие 14-3-3 и участок 1–50 описаны для FOXO1 человека (Zhao и соавт., 2004; в реферате не названы киназа, клеточная линия и CRM1: сведение о CRM1 как экспортном рецепторе и о действии лептомицина B общее). Данные по FOXO4 (AFX) получены в клетках 3T3 (Brownawell и соавт., 2001). Схема на экране — учебная модель с условными константами скорости, а не измерения.","sources":["Zhao2004","Brownawell2001","RodriguezColman2024"],"quiz":{"id":"S6-L16","question":"На фоне активного сигнала инсулина в клетках с FOXO1 добавили лептомицин B, подавляющий CRM1-зависимый экспорт. Какое изменение следует проверять непосредственно?","options":[{"id":"S6-L16-1","text":"Уменьшение CRM1-зависимого экспорта и изменение доли FOXO1 в ядре.","correct":true,"feedback":"Подавление экспорта и последующее изменение доли FOXO1 в ядре — разные события; фосфорилирование и связывание с ДНК измеряют отдельно."},{"id":"S6-L16-2","text":"Снятие всех фосфатных групп с FOXO1 ингибитором экспорта.","correct":false,"feedback":"Ингибитор экспортного рецептора не является фосфатазой."},{"id":"S6-L16-3","text":"Активация всех мишеней FOXO1 независимо от состояния их хроматина.","correct":false,"feedback":"Удержание FOXO1 в ядре не гарантирует ни связывания с локусом, ни синтеза РНК."}]},"widget":{"kind":"shuttle","title":"","s":{"title":"Перенос FOXO1 между ядром и цитоплазмой: учебная модель","status":"Условная модель с двумя константами скорости · числа не измерены","var_label":"Как фосфорилирование меняет перенос (допущение модели)","vars":["Ослабляет импорт","Усиливает экспорт","Ослабляет импорт и усиливает экспорт"],"p_label":"Уровень фосфорилирования FOXO1 (условный)","t_label":"Время после добавления лептомицина B (условные единицы)","lmb_label":"Добавить лептомицин B (подавляет CRM1-зависимый экспорт)","l_nuc":"Ядро","l_cyt":"Цитоплазма","l_imp":"импорт","l_exp":"экспорт","l_lmb":"лептомицин B","ser_now":"при выбранных условиях","ser_ref":"без фосфорилирования","x_lab":"Время, условные единицы","y_lab":"Доля FOXO1 в ядре, %","chart_title":"Изменение доли FOXO1 в ядре во времени в учебной модели","m_nuc":"Доля в ядре","m_kin":"Константа импорта","m_kout":"Константа экспорта","m_fin":"Поток импорта","m_fout":"Поток экспорта","legend":"Толщина стрелки показывает константу скорости, а не поток. Поток импорта равен константе импорта, умноженной на долю белка вне ядра, а поток экспорта — константе экспорта, умноженной на долю белка в ядре. Когда распределение перестаёт меняться, потоки равны, хотя константы различаются. Исходное состояние — распределение при выбранном уровне фосфорилирования без лептомицина B.","n_base":"Без фосфорилирования импорт преобладает над экспортом, и большая часть FOXO1 находится в ядре; белок при этом продолжает перемещаться в обе стороны.","n_p":"При фосфорилировании доля FOXO1 в ядре уменьшается, но не до нуля: импорт и экспорт продолжаются, а доля в ядре определяется их соотношением.","n_lmb":"Лептомицин B снижает константу экспорта, и FOXO1 накапливается в ядре, даже если уровень фосфорилирования высокий. Фосфорилирование при этом не исчезает: ингибитор экспорта не дефосфорилирует белок. Модель не рассчитывает связывание с ДНК; фосфорилированный FOXO1 в ядре может связываться с ДНК слабее.","n_var":["Допущение: фосфорилирование снижает константу импорта и не меняет константу экспорта.","Допущение: фосфорилирование повышает константу экспорта и не меняет константу импорта.","Допущение: фосфорилирование снижает константу импорта и повышает константу экспорта."],"n_foxo4":"Какой из способов преобладает, зависит от белка и клеток. Для FOXO4 (AFX) в клетках 3T3 описано ослабление импорта при экспорте, который фосфорилированием не регулируется (Brownawell и соавт., 2001); у FOXO1 одновременно действуют несколько механизмов (Zhao и соавт., 2004).","static":["Модель показывает FOXO1, который постоянно перемещается между ядром и цитоплазмой. Доля белка в ядре определяется соотношением констант импорта и экспорта. Фосфорилирование ослабляет импорт, усиливает экспорт или делает и то и другое, поэтому доля в ядре уменьшается, но не до нуля.","Лептомицин B подавляет CRM1-зависимый экспорт: FOXO1 накапливается в ядре, но остаётся фосфорилированным, и его связывание с ДНК может быть слабым."]}}},{"id":"foxo-context","number":17,"section":2,"title":"Почему фосфорилирование FOXO даёт разные результаты","question":3,"questions":[3],"keywords":["JNK","MST1","AMPK","SGK","ацетилирование","CBP","SIRT1","знак эффекта","FOXO3","FOXO4"],"lead":["Фосфатная группа сама по себе не определяет результат: он зависит от киназы, участка белка, паралога и клеточных условий.","Ацетилирование и деацетилирование добавляют ещё один независимый уровень регуляции."],"mechanism":["AKT и SGK фосфорилируют FOXO и подавляют его транскрипционную активность.","Киназы JNK и MST1 фосфорилируют FOXO по другим участкам; в описанных системах это усиливает активность FOXO и способствует его переходу в ядро.","AMPK изменяет активность FOXO3 без перемещения между ядром и цитоплазмой; ацетилирование и деацетилирование меняют транскрипционные свойства FOXO."],"paragraphs":["Для вывода о влиянии фосфата нужно знать киназу, участок и белок. Фосфорилирование FOXO киназой AKT подавляет его транскрипционную активность. Для FOXO4 in vitro показано, что фосфорилирование Thr28 и Ser193 создаёт два мотива связывания для [[T47|14-3-3]], и для полного подавления связывания с ДНК нужны оба.","Стрессовые киназы действуют иначе. При окислительном стрессе JNK фосфорилирует FOXO4 по Thr447 и Thr451; это фосфорилирование участвует в переходе белка в ядро и в активации транскрипции. В первичных нейронах киназа MST1 фосфорилирует консервативный участок forkhead-домена FOXO и нарушает связь FOXO с 14-3-3; перенос FOXO в ядро приводит к гибели нейронов. Эти результаты получены на разных паралогах и в разных клетках, поэтому в одну схему их не складывают.","AMPK фосфорилирует FOXO3 человека по шести участкам и усиливает его транскрипционную активность без изменения локализации; значит, активность FOXO нельзя вывести только из его положения. Ацетилирование образует отдельный уровень регуляции: при пероксидном стрессе CBP ацетилирует FOXO4 и подавляет его активность, а SIRT1 деацетилирует FOXO и продлевает транскрипцию генов ответа на стресс. На FOXO3 SIRT1 действует двояко: усиливает остановку клеточного цикла и устойчивость к окислительному стрессу, но подавляет индукцию гибели клеток.","Убиквитинирование и протеасомная деградация FOXO — ещё один способ регуляции; он зависит от условий и здесь не рассматривается."],"trap":["Любое фосфорилирование FOXO выводит его из ядра и подавляет его работу.","Для AKT это показано, но JNK, MST1 и AMPK фосфорилируют другие участки, и в описанных системах активность FOXO при этом растёт; у AMPK — без изменения локализации. Знак эффекта определяют участок, киназа, паралог и клетки."],"conditions":"Участки и результаты приведены по рефератам первичных работ и относятся к разным системам: FOXO1 в клетках 293 и 293T (Rena и соавт., 1999; Tang и соавт., 1999); FOXO3 с SGK и AMPK (Brunet и соавт., 2001; Greer и соавт., 2007); FOXO4 с JNK и CBP в клетках и с 14-3-3 in vitro (Essers и соавт., 2004; van der Horst и соавт., 2004; Obsil и соавт., 2003); первичные нейроны с MST1 (Lehtinen и соавт., 2006; вид по индексации PubMed — крыса); SIRT1 и FOXO3 (Brunet и соавт., 2004). Обзор Rodriguez-Colman и соавт. (2024) дан как общая рамка.","sources":["RodriguezColman2024","Zhao2004","Rena1999","Tang1999","Brunet2001","Essers2004","Lehtinen2006","Greer2007","vanderHorst2004","Brunet2004","Obsil2003"],"quiz":{"id":"S6-L17","question":"AKT и стрессовая киназа фосфорилируют FOXO по разным участкам. Можно ли предсказать одинаковый эффект только по наличию фосфата?","options":[{"id":"S6-L17-1","text":"Нет; нужно знать участок, киназу, паралог и клеточные условия.","correct":true,"feedback":"Разные модификации меняют разные взаимодействия и функции."},{"id":"S6-L17-2","text":"Да; фосфорилирование по любому участку полностью активирует FOXO.","correct":false,"feedback":"Для AKT в изучаемом механизме фосфорилирование ограничивает доступ FOXO к части ядерных мишеней."},{"id":"S6-L17-3","text":"Да; фосфорилирование по любому участку разрушает белок FOXO.","correct":false,"feedback":"Наличие фосфатной группы само по себе не означает, что белок будет расщеплён протеасомой."}]},"widget":{"kind":"modmap","title":"","s":{"title":"Карта модификаций FOXO: фермент, участок, система, результат","status":"Данные по рефератам статей · системы разные, результаты не складываются в одну схему","sel_label":"Фермент и модификация","mods":["AKT","SGK1","JNK","MST1","AMPK","CBP: ацетилирование","SIRT1: деацетилирование"],"l_loc":"Локализация","l_act":"Транскрипционная активность","l_sys":"Система","legend":"Знаки: ↑ — доля в ядре больше или активность выше; ↓ — доля в ядре меньше или активность ниже; = — без изменений; ↕ — эффект двоякий; ? — в реферате не указано. Знак относится к указанной системе и не переносится на другие паралоги и клетки.","t_head":["Фермент и модификация","Белок и участок","Система","Локализация","Транскрипционная активность"],"rows":[{"enz":"AKT (PKB)","mod":"фосфорилирует","g":"P","prot":"FOXO1 человека","site":"Thr24, Ser256, Ser319","sys":"клетки 293 и 293T","loc":"исключается из ядра","ld":-1,"act":"подавляется","ad":-1},{"enz":"SGK1","mod":"фосфорилирует","g":"P","prot":"FOXO3 (FKHRL1)","site":"Thr32, Ser315 (преимущественно SGK), Ser253 (преимущественно AKT)","sys":"клетки млекопитающих","loc":"не указана","ld":null,"act":"подавляется","ad":-1},{"enz":"JNK (через Ral)","mod":"фосфорилирует","g":"P","prot":"FOXO4","site":"Thr447, Thr451","sys":"клетки; H₂O₂ в малых дозах или TNFα","loc":"участвует в переходе в ядро","ld":1,"act":"усиливается","ad":1},{"enz":"MST1","mod":"фосфорилирует","g":"P","prot":"FOXO в первичных нейронах","site":"консервативный участок forkhead-домена","sys":"нейроны; окислительный стресс","loc":"переход в ядро, нарушена связь с 14-3-3","ld":1,"act":"активируется, нейроны погибают","ad":1},{"enz":"AMPK","mod":"фосфорилирует","g":"P","prot":"FOXO3 человека","site":"шесть участков","sys":"клетки млекопитающих","loc":"не меняется","ld":0,"act":"усиливается","ad":1},{"enz":"CBP","mod":"ацетилирует","g":"Ac","prot":"FOXO4","site":"участок в реферате не указан","sys":"клетки человека; пероксидный стресс","loc":"не указана","ld":null,"act":"подавляется","ad":-1},{"enz":"SIRT1","mod":"деацетилирует","g":"Ac","prot":"FOXO3","site":"участок в реферате не указан","sys":"клетки млекопитающих; окислительный стресс","loc":"не указана","ld":null,"act":"двоякий эффект: сильнее остановка цикла и устойчивость к стрессу, слабее гибель клеток","ad":2}],"static":["AKT фосфорилирует FOXO1 человека по Thr24, Ser256 и Ser319: белок исключается из ядра, активность подавляется. SGK1 фосфорилирует FOXO3, предпочитая Ser315, тогда как AKT предпочитает Ser253; обе киназы фосфорилируют Thr32.","JNK (через Ral) фосфорилирует FOXO4 по Thr447 и Thr451; это фосфорилирование участвует в переходе FOXO4 в ядро и усиливает его активность. MST1 фосфорилирует консервативный участок forkhead-домена в первичных нейронах, нарушает связь с 14-3-3 и способствует переходу FOXO в ядро.","AMPK фосфорилирует FOXO3 по шести участкам и усиливает его активность без изменения локализации. CBP ацетилирует FOXO4 и подавляет его активность, SIRT1 деацетилирует FOXO3 и действует двояко: усиливает остановку клеточного цикла и устойчивость к стрессу, но ослабляет гибель клеток."]}}},{"id":"foxo-binding","number":18,"section":2,"title":"От ядерной локализации к связыванию с ДНК и синтезу РНК","question":3,"questions":[3],"keywords":["занятость участка","доля в ядре","ДНК-связывающий домен","ChIP","FoxA1","HepG2","IGFBP1","G6Pase","пионерный фактор","новая РНК"],"lead":["Присутствие FOXO в ядре — условие его работы, но не доказательство связывания с участком ДНК и не доказательство синтеза РНК.","Доля белка в ядре, занятость участка и новосинтезированная РНК — три разные величины со своими условиями."],"mechanism":["Сначала FOXO перемещается между цитоплазмой и ядром; соотношение импорта и экспорта определяет [[T50|долю FOXO в ядре]].","Затем FOXO связывается с доступным участком ДНК с помощью ДНК-связывающего домена; [[T49|занятость участка]] зависит также от концентрации белка, сродства и других факторов.","Наконец, на промоторе идёт транскрипция; её измеряют по [[T52|новосинтезированной РНК]]."],"paragraphs":["Ядерная локализация определяет, сколько молекул FOXO вообще может связаться с хроматином, но не говорит о том, какие участки заняты. Занятость конкретного участка зависит от концентрации FOXO в ядре, его сродства к последовательности, доступности участка в хроматине и времени, в течение которого фактор остаётся связанным. Поэтому в двух образцах с одинаковой долей FOXO в ядре занятость одного и того же участка может различаться.","Если участок закрыт нуклеосомой, FOXO может не связаться с ним, хотя в ядре присутствует. Если ДНК-связывающий домен нарушен так, что ядерный импорт сохранён, белок остаётся в ядре, но не связывается с мотивом. Важны и другие факторы: на промоторах IGFBP1 и G6PC в клетках HepG2 связывание FOXO1 и FoxA1/A2 было взаимозависимым, и после снижения связывания одного из них уменьшалось связывание другого и РНК-полимеразы II.","Ранее для промотора IGFBP1 было показано, что FOXO1 открывает и перестраивает хроматин; фосфомиметическая замена серина в ДНК-связывающем мотиве ослабляла связывание FOXO1 с нуклеосомой. Эти данные получены на двух промоторах в одной клеточной линии, поэтому на все локусы и клетки их не переносят.","Синтез РНК тоже проверяют отдельно: даже при занятом участке результат зависит от условий на промоторе. Поэтому локализацию FOXO, связывание с участком и новосинтезированную РНК измеряют разными методами (шаг 20)."],"trap":["Если FOXO находится в ядре, его мотивы в каждом локусе постоянно заняты.","Занятость зависит от концентрации, сродства, доступности участка и времени; постоянное насыщение участков не гарантировано. Закрытый хроматин и нарушенный ДНК-связывающий домен ограничивают связывание при сохранной ядерной локализации."],"conditions":"Взаимозависимое связывание FOXO1 и FoxA1/A2, снижение связывания РНК-полимеразы II и ацетилирования H3K27 показаны на промоторах IGFBP1 и G6PC в клетках HepG2 (Yalley и соавт., 2016; реферат); авторы считают, что механизм, возможно, кооперативный. Фосфомиметическая замена не равна фосфорилированию киназой. Схема на экране — учебная модель, уровни качественные.","sources":["Yalley2016","RodriguezColman2024"],"quiz":{"id":"S6-L18","question":"В двух образцах доля FOXO в ядре одинакова. В одном из них доступность участка связывания FOXO снижена. Следует ли ожидать одинакового связывания FOXO с этим участком и синтеза РНК мишени?","options":[{"id":"S6-L18-1","text":"Нет; доступность участка и другие условия могут ограничить связывание и синтез РНК.","correct":true,"feedback":"Локализация — лишь одно звено механизма. Проверяют связывание с исследуемым участком и синтез РНК мишени."},{"id":"S6-L18-2","text":"Да; одинаковая доля FOXO в ядре полностью определяет и связывание, и синтез РНК мишени.","correct":false,"feedback":"По доле FOXO в ядре нельзя судить о доступности каждого локуса и об условиях на промоторе."},{"id":"S6-L18-3","text":"Да; наличие FOXO в ядре означает, что каждый его мотив в геноме постоянно занят белком.","correct":false,"feedback":"Занятость зависит от концентрации, сродства, доступности и времени; постоянное насыщение участков не гарантировано."}]},"widget":{"kind":"bind3","title":"","s":{"title":"Доля FOXO в ядре, занятость участка и новосинтезированная РНК: два образца","status":"Условная учебная модель · уровни качественные","loc_label":"Доля FOXO в ядре в образце 2","loc_opts":["низкая","средняя","высокая"],"acc_label":"Участок связывания FOXO доступен в образце 2","bad_label":"ДНК-связывающий домен нарушен, ядерный импорт сохранён","par_label":"Присутствует партнёрский фактор (например, FoxA1/A2)","prom_label":"На промоторе мишени выполнены другие условия транскрипции","s1":"Образец 1 (эталон)","s2":"Образец 2","rows":["Доля FOXO в ядре","Занятость участка FOXO","Новосинтезированная РНК мишени, вклад FOXO"],"res_title":"Сравнение образцов","n_same":"Доля FOXO в ядре в образцах одинакова, а занятость участка различается: локализация показывает, сколько FOXO есть в ядре, но не определяет, какие участки заняты.","n_diff":"Занятость участка в образцах различается.","n_rna":"Занятость участка одинакова, а новосинтезированная РНК различается: связывание фактора не гарантирует транскрипцию.","n_bad":"ДНК-связывающий домен нарушен: FOXO остаётся в ядре, но не связывается с мотивом, поэтому занятость участка и вклад FOXO в синтез РНК минимальны.","n_acc":"Участок недоступен (например, закрыт нуклеосомой): связывание ограничено при той же доле FOXO в ядре.","n_par":"Партнёрского фактора нет. На изученных промоторах IGFBP1 и G6PC в клетках HepG2 связывание FOXO1 и FoxA1/A2 было взаимозависимым (Yalley и соавт., 2016), поэтому в образце 2 занятость участка ниже.","n_loc":"Доля FOXO в ядре снижена, и занятость участка ограничена ею.","n_prom":"Другие условия транскрипции на промоторе не выполнены, поэтому синтез РНК ограничен даже при связывании FOXO.","n_eq":"Образцы совпадают по всем трём показателям.","static":["Схема сравнивает два образца по трём величинам: доля FOXO в ядре, занятость участка и новосинтезированная РНК мишени. При одинаковой доле в ядре занятость участка ниже, если участок недоступен, нарушен ДНК-связывающий домен или нет партнёрского фактора; синтез РНК, кроме того, зависит от условий на промоторе."]}}},{"id":"foxo-paralogs","number":19,"section":2,"title":"Почему эффект FOXO зависит от паралога и ткани","question":3,"questions":[3],"keywords":["паралог","FOXO1","FOXO3","FOXO4","FOXO6","G6PC","PCK1","SOD2","ткань","мишени"],"lead":["FOXO1, FOXO3, FOXO4 и FOXO6 — продукты разных генов, а не разные состояния одного белка.","Схему регуляции, установленную для одного паралога, проверяют для другого, а результат зависит от ткани и мишени."],"mechanism":["Четыре белка [[T44|FOXO]] человека кодируются разными генами и регулируются неодинаково.","У FOXO1, FOXO3 и FOXO4 три консервативных района с мотивом фосфорилирования PKB; в мышином FoxO6 одного из них нет.","Мишени и результат зависят от ткани: в печени это гены глюконеогенеза, в других системах — гены антиоксидантной защиты, регуляции клеточного цикла и клеточной гибели."],"paragraphs":["FOXO1, FOXO3, FOXO4 и FOXO6 близки по ДНК-связывающему домену, но кодируются разными генами и регулируются неодинаково. Их нельзя считать состояниями одного белка: FOXO6 не является «дефосфорилированным FOXO1». Вывод, сделанный для одного паралога, поэтому проверяют для другого.","Различие хорошо видно на FoxO6 мыши. В нём нет одного из трёх консервативных районов с мотивом фосфорилирования PKB, которые есть у других членов группы. В опытах с трансфекцией GFP-слитый FoxO6 после обработки ростовыми факторами оставался преимущественно в ядре, а FoxO1 и FoxO3 были преимущественно цитоплазматическими. При этом экспорт FoxO6 зависел от пути PI3K/PKB, так что у него иная схема регуляции, а не её отсутствие.","Ткань и мишень тоже влияют на результат. В клетках HepG2 FOXO1 связан с промоторами IGFBP1 и G6PC; к генам глюконеогенеза относят также PCK1. В других системах среди мишеней FOXO называют SOD2, каталазу, CDKN1B, гены аутофагии и апоптоза. Набор мишеней зависит от паралога, доступности хроматина и сигнала, поэтому перечень не означает, что все они регулируются в одной клетке.","Связь FOXO с продолжительностью жизни показана на модельных организмах, например на C. elegans, у которого ортолог FOXO — белок DAF-16. Это не даёт оснований для утверждений о продлении жизни человека или о лечебном эффекте."],"trap":["Если FOXO6 остаётся в ядре после обработки ростовыми факторами, он не зависит от сигнала PI3K и AKT.","Экспорт мышиного FoxO6 зависит от пути PI3K/PKB, но схема регуляции переноса у него иная, чем у FOXO1: нет одного из трёх консервативных районов. Неполный ответ на сигнал не означает отсутствия регуляции."],"conditions":"Сведения о FoxO6 — по реферату работы Jacobs и соавт. (2003): белок мыши, GFP-слитая конструкция, трансфекция; клеточная линия и остатки в реферате не названы, количественных данных нет. Участки FOXO1, FOXO3 и FOXO4 даны по Rena и соавт. (1999), Brunet и соавт. (2001) и Obsil и соавт. (2003). Мишени в HepG2 — по Yalley и соавт. (2016). Перечень мишеней в других системах, а также PCK1 даны по программе курса и общим сведениям и не проверялись по первичным работам.","sources":["Jacobs2003","RodriguezColman2024","Yalley2016","Rena1999","Brunet2001","Obsil2003","Brownawell2001"],"quiz":{"id":"S6-L19","question":"При одинаковом стимуле доля FOXO6 в ядре меняется иначе, чем доля FOXO1. Что следует учитывать, объясняя это различие?","options":[{"id":"S6-L19-1","text":"У паралогов различаются элементы регуляции переноса и модификаций.","correct":true,"feedback":"Механизм, установленный для FOXO1, нельзя автоматически переносить на FOXO6."},{"id":"S6-L19-2","text":"FOXO6 представляет собой полностью дефосфорилированное состояние молекулы FOXO1.","correct":false,"feedback":"FOXO6 и FOXO1 — продукты разных генов. Различие паралогов не сводится к наличию фосфатных групп."},{"id":"S6-L19-3","text":"Достаточно измерить pAKT; перенос каждого паралога отдельно оценивать не требуется.","correct":false,"feedback":"По pAKT нельзя судить о распределении FOXO. Особенности паралогов требуют прямого анализа локализации и связывания."}]},"widget":{"kind":"paralogs","title":"","s":{"title":"Паралоги FOXO: участки регуляции, система и результат","status":"Данные по рефератам статей · системы разные","sel_label":"Паралог","names":["FOXO1","FOXO3","FOXO4","FoxO6 (мышь)"],"regions":[3,3,3,2],"cnt":"Районов с мотивом PKB: {n} из 3","note_order":"Кружки не показывают положение районов в белке; для FoxO6 реферат не называет, какого из трёх районов нет.","k_head":["Участки и регуляция","Система в источнике","Чего источник не позволяет утверждать"],"cards":[["Thr24, Ser256, Ser319 (нумерация человеческого белка). В переносе участвуют 14-3-3, сигнал экспорта и N-концевой участок.","Клетки 293 при стимуляции IGF-1; клетки HepG2 (промоторы IGFBP1 и G6PC).","Свойства FOXO1 нельзя автоматически переносить на другие паралоги и на другие клетки."],["Thr32, Ser253, Ser315. AKT и SGK фосфорилируют Thr32; AKT предпочитает Ser253, SGK — Ser315.","Клетки млекопитающих; линия в реферате не указана.","Нельзя называть все три участка «участками AKT» без оговорки о роли SGK."],["Thr28 и Ser193 фосфорилируются киназой PKB и создают два мотива связывания 14-3-3; Ser193 находится в неклассическом сигнале ядерной локализации.","Фрагмент 11–213 in vitro; клетки 3T3 для локализации.","Результаты in vitro и в клетках 3T3 нельзя переносить на FOXO1 без проверки."],["Нет одного из трёх консервативных районов с мотивом PKB. После обработки ростовыми факторами GFP-слитый белок остаётся преимущественно в ядре; экспорт зависит от пути PI3K/PKB.","FoxO6 мыши; GFP-слитая конструкция в трансфекции; линия клеток в реферате не указана.","Нельзя заключить, что FOXO6 не регулируется AKT, что человеческий белок ведёт себя так же или что картина сохраняется в нативных клетках."]],"t_head":["Паралог","Система","Мишень или участок","Показано"],"rows":[["FOXO1","клетки 293; клетки HepG2","Thr24, Ser256, Ser319; промоторы IGFBP1 и G6PC","исключение из ядра при фосфорилировании; взаимозависимое связывание с FoxA1/A2 на промоторах"],["FOXO3","клетки млекопитающих","Thr32, Ser253, Ser315","AKT и SGK фосфорилируют разные участки; FOXO3 инактивируется"],["FOXO4","in vitro; клетки 3T3","Thr28, Ser193","оба мотива связывания 14-3-3 нужны для полного подавления связывания с ДНК in vitro; Ser193 находится в сигнале ядерной локализации"],["FoxO6 (мышь)","GFP-слитый белок, трансфекция","два из трёх районов с мотивом PKB","остаётся преимущественно в ядре после ростовых факторов; экспорт зависит от PI3K/PKB"]],"static":["FOXO1, FOXO3 и FOXO4 имеют три консервативных района с мотивом фосфорилирования PKB; в мышином FoxO6 одного из них нет. При трансфекции GFP-слитый FoxO6 после обработки ростовыми факторами остаётся преимущественно в ядре, но его экспорт зависит от пути PI3K/PKB.","FOXO1: Thr24, Ser256, Ser319; FOXO3: Thr32, Ser253, Ser315 (AKT предпочитает Ser253, SGK — Ser315); FOXO4: Thr28 и Ser193 (два мотива связывания 14-3-3 in vitro)."]}}},{"id":"foxo-measure","number":20,"section":2,"title":"Как проверить прямое звено регуляции FOXO","question":3,"questions":[3],"keywords":["pAKT","субстратный тест","АТФ-конкурентный ингибитор","аллостерический ингибитор","FOXO1-AAA","фосфомиметик","ChIP","CUT&RUN","иммунофлуоресценция"],"lead":["Каждый показатель отвечает на свой вопрос: где находится FOXO, связан ли он с ДНК, фосфорилирован ли он и синтезируется ли РНК.","Высокий pAKT не доказывает, что AKT фосфорилирует субстрат; для этого измеряют фосфорилирование самого субстрата."],"mechanism":["Положение FOXO определяют иммунофлуоресценцией или в ядерной и цитоплазматической фракциях; фосфорилирование — фосфоспецифическими антителами.","Связывание с участком ДНК измеряют методами ChIP или CUT&RUN, а синтез РНК — по новосинтезированной РНК.","[[T51|Каталитическую активность AKT]] оценивают по фосфорилированию её субстрата, а не по pAKT."],"paragraphs":["Метод подбирают к вопросу. Положение FOXO показывают иммунофлуоресценция и анализ ядерной и цитоплазматической фракций, но связывание с ДНК они не показывают. Фосфорилирование конкретного остатка выявляют фосфоспецифические антитела. Занятость участка оценивают методами ChIP или CUT&RUN; их сигнал не равен абсолютной доле занятых молекул. О синтезе РНК за заданный интервал судят по [[T52|новосинтезированной РНК]], тогда как количество суммарной РНК зависит ещё и от распада.","Особый случай — ингибиторы AKT. В клетках HEK293 АТФ-конкурентный ингибитор A-443654 вызывал гиперфосфорилирование AKT по Thr308 и Ser473, при этом фосфорилирование субстрата GSK3β по Ser9 было подавлено. Гиперфосфорилирование возникало и у каталитически неактивных вариантов AKT, поэтому его связывают с присоединением ингибитора к АТФ-связывающему участку. Для аллостерического ингибитора Akti-1,2 гиперфосфорилирование, напротив, подавлялось. Поэтому класс ингибитора называют явно, а активность AKT оценивают по субстрату. FOXO в этой работе не измеряли.","Варианты белка также называют точно. FOXO1-AAA — белок с заменой Thr24, Ser256 и Ser319 на аланин; по этим участкам он не может быть фосфорилирован. Фосфомиметическая замена вносит отрицательный заряд, но не воспроизводит фосфорилирование полностью. Вывод о роли AKT поэтому строят на сравнении вариантов в одной системе и подтверждают независимым подходом."],"trap":["Фосфомиметический вариант FOXO1 ведёт себя так же, как фосфорилированный белок.","Замена на остаток с отрицательным зарядом имитирует фосфат лишь отчасти. В работе Yalley и соавт. такая замена в ДНК-связывающем мотиве ослабляла связывание FoxO1 с нуклеосомой, но из этого не следует, что фосфорилирование киназой AKT в клетке даёт тот же результат."],"conditions":"Результаты с A-443654 получены в клетках HEK293; часть подтверждений на каталитически неактивных вариантах — в других линиях (Okuzumi и соавт., 2009). Дозы и сроки обработки даны на рисунках работы и здесь не приводятся; фосфорилирование FOXO в ней не измеряли. Тройная замена на аланин — по реферату Tang и соавт. (1999, клетки 293T). Схема на экране показывает качественное соответствие показателей, а не измерения.","sources":["RodriguezColman2024","Okuzumi2009","Zhao2004","Tang1999","Yalley2016"],"quiz":{"id":"S6-L20","question":"После АТФ-конкурентного ингибитора pAKT остаётся высоким, но фосфорилирование проверенного субстрата AKT снижено. Какой вывод лучше подтверждён?","options":[{"id":"S6-L20-1","text":"Каталитическая активность AKT по этому субстрату подавлена, хотя pAKT высок.","correct":true,"feedback":"Субстратный тест непосредственно относится к исследуемой активности. Модификация самой киназы — другой показатель."},{"id":"S6-L20-2","text":"AKT по-прежнему активна по всем субстратам, потому что pAKT остаётся высоким.","correct":false,"feedback":"При таком классе ингибиторов уровень pAKT и фосфорилирование субстрата могут расходиться."},{"id":"S6-L20-3","text":"Общее количество белка AKT в обработанных клетках уменьшилось до нуля.","correct":false,"feedback":"Ни фосфорилирование, ни субстратный тест сами по себе не показывают исчезновение всего белка."}]},"widget":{"kind":"foxomeas","title":"","s":{"title":"Какой показатель отвечает на какой вопрос: методы, ингибиторы AKT, варианты FOXO1","status":"Качественное сопоставление по литературным данным · не измерения","mode_label":"Раздел","modes":["Метод и показатель","Ингибиторы AKT","Варианты белка FOXO1"],"m_label":"Метод","methods":[["Иммунофлуоресценция","Положение FOXO в клетке: ядро, цитоплазма или оба отдела.","Связывание с ДНК, фосфорилирование конкретного остатка и активность AKT.",[2,0,0,0,0]],["Ядерная и цитоплазматическая фракции, иммуноблот","Долю белка в каждой фракции в популяции клеток.","Различия между отдельными клетками и связывание с ДНК; чистоту фракций контролируют отдельно.",[2,0,0,0,0]],["Фосфоспецифические антитела","Наличие фосфата на конкретном остатке: на FOXO1 (например, Ser256) или на AKT (Thr308, Ser473).","Положение белка и каталитическую активность киназы по субстрату.",[0,2,0,1,0]],["Субстратный тест AKT","Фосфорилирование известного субстрата, например GSK3β по Ser9, как результат работы киназы.","Фосфорилирование FOXO и положение белка; субстрат могут фосфорилировать и другие киназы.",[0,0,0,2,0]],["ChIP или CUT&RUN","Присутствие FOXO на заданном участке ДНК в популяции клеток.","Абсолютную долю занятых молекул и синтез РНК.",[0,0,2,0,0]],["Новосинтезированная РНК","Синтез РНК мишени за заданный интервал.","Связывание FOXO с участком ДНК; количество суммарной зрелой РНК зависит ещё и от распада.",[0,0,0,0,2]]],"yn":["нет","частично","да"],"k_shows":"Что показывает","k_not":"Чего не показывает","t_title":"На какие вопросы отвечает метод","t_first":"Метод","q_cols":["Положение FOXO","Фосфорилирование остатка","Связывание с участком ДНК","Активность AKT","Синтез РНК"],"inh_label":"Условие","inhs":["Без ингибитора, стимуляция IGF-1","АТФ-конкурентный ингибитор AKT","АТФ-конкурентный ингибитор, каталитически неактивный вариант AKT"],"i_rows":["pAKT (Thr308 и Ser473)","Фосфорилирование субстрата GSK3β по Ser9","Фосфорилирование FOXO"],"i_notes":["Клетки HEK293 при стимуляции IGF-1: AKT фосфорилирована и фосфорилирует субстрат GSK3β по Ser9.","Клетки HEK293, A-443654: pAKT по Thr308 и Ser473 повышается (гиперфосфорилирование), а фосфорилирование GSK3β по Ser9 подавлено. Вывод об активности делают по субстрату, а не по pAKT.","Гиперфосфорилирование возникало и у каталитически неактивных вариантов AKT при действии АТФ-конкурентных ингибиторов: оно связано с присоединением ингибитора к АТФ-связывающему участку, а не с работой киназы. Фосфорилирование субстрата здесь не определяют: вариант каталитически неактивен."],"i_lim":"Фосфорилирование FOXO в этих опытах не измеряли. Гиперфосфорилированная AKT после иммунопреципитации и отмывки была активнее в пробирке, но в клетках рост фосфорилирования субстрата авторы не наблюдали. Для аллостерического ингибитора Akti-1,2 гиперфосфорилирование, напротив, подавлялось.","t_head":["Показатель","Уровень"],"var_label":"Вариант белка","vars":["FOXO1 без замен","FOXO1-AAA","Фосфомиметический вариант"],"v_head":["Что заменено","Что показано в источниках","Чего нельзя заключить"],"v_cards":[["Замен нет: AKT может фосфорилировать Thr24, Ser256 и Ser319.","Фосфорилирование этих остатков связано с исключением FOXO1 из ядра (Zhao и соавт., 2004).","Нельзя считать, что все три участка фосфорилируются одинаково эффективно во всех клетках."],["Thr24, Ser256 и Ser319 заменены на аланин: фосфат присоединиться не может.","Для FKHR (FOXO1 человека) с тремя заменами на аланин в клетках 293T показаны повышенная транскрипционная активность, устойчивость к подавляющему действию AKT и апоптоз, зависимый от связывания с ДНК (Tang и соавт., 1999).","Нельзя заключить, что произойдёт в других клетках, у других паралогов и при фосфорилировании других участков."],["Серин заменён остатком с отрицательным зарядом, имитирующим фосфат.","Замена серина в ДНК-связывающем мотиве, имитирующая фосфорилирование, ослабляла связывание FoxO1 с нуклеосомой (Yalley и соавт., 2016; остаток и киназа в реферате не названы).","Фосфомиметик не эквивалентен фосфорилированному белку и не доказывает, что фосфорилирование киназой AKT in vivo ослабляет связывание FoxO1 с нуклеосомой."]],"static":["Положение FOXO показывают иммунофлуоресценция и анализ фракций; фосфорилирование остатка — фосфоспецифические антитела; активность AKT — фосфорилирование субстрата; связывание с ДНК — ChIP или CUT&RUN; транскрипцию — новосинтезированная РНК.","При АТФ-конкурентном ингибиторе AKT pAKT может быть высоким при подавленном фосфорилировании субстрата GSK3β; при аллостерическом ингибиторе Akti-1,2 гиперфосфорилирование подавлялось.","FOXO1-AAA не может быть фосфорилирован по Thr24, Ser256 и Ser319; фосфомиметическая замена имитирует фосфат лишь отчасти."]}}},{"id":"memory","number":21,"section":3,"title":"Что нужно показать, чтобы говорить о клеточной памяти","question":4,"questions":[4],"keywords":["клеточная память","контроль","отмывка","покой","повторный стимул","остаток реагента","состав популяции","митотическое наследование","тренированный иммунитет"],"lead":["О клеточной памяти говорят, если изменённое состояние или изменённый ответ сохраняется после того, как исходное воздействие прекратилось.","Остаток реагента, смена состава клеток и изменение хроматина могут давать внешне одинаковый результат, поэтому второй ответ сравнивают с контролем, получившим только второй стимул, а причину различия проверяют отдельными измерениями."],"mechanism":["Клетки получают первое воздействие, затем его удаляют отмывкой, после чего наступает период покоя.","Опытная группа и контроль того же возраста, не получавший первого воздействия, одновременно получают второй стимул.","Различие ответов показывает, что первое воздействие оставило след; [[T53|хроматиновую память]] подтверждают только измерение хроматина и вмешательство в предполагаемый признак."],"paragraphs":["О клеточной памяти говорят, когда изменённое состояние или изменённый ответ сохраняется после того, как исходное воздействие прекратилось. В опыте это выглядит так: клетки получают первый стимул, его удаляют отмывкой, а после периода покоя клетки стимулируют повторно. Если ответ на второй стимул отличается от ответа клеток, которые первого воздействия не получали, возникает вопрос, какой след оставило первое воздействие.","Чтобы ответить на этот вопрос, нужно различать несколько понятий. Состояние хроматина — это модификации гистонов, метилирование ДНК и доступность участков; его измеряют отдельно. Синтез РНК в данный момент и ответ на повторный стимул — функциональные показатели, и они не тождественны состоянию хроматина. Сохранение состояния в клетках, которые не делились, и передача его дочерним клеткам после митоза — разные утверждения: для проверки второго нужны деление клеток и наблюдение за потомками, и только передачу называют [[T54|эпигенетическим наследованием]].","Контролем служит группа того же возраста, получившая только второй стимул в тот же срок. Сравнение с первым ответом тех же клеток не подходит: за время покоя могли измениться дифференцировка, плотность и состав культуры. Вклад остатка реагента ограничивают отмывкой и периодом покоя, а содержание вещества в среде проверяют отдельно. Изменение состава популяции выявляют подсчётом клеток разных типов и оценкой их выживаемости. Только после этого различие ответов связывают с первым воздействием, а носитель следа называют лишь после прямого измерения признака и в
