8],"t":"аутофагосома\n(LC3-II)","n":[250,160,150,48],"fs":15},"ly":{"p":[470,170,150,48],"t":"расщепление\nв лизосоме","n":[250,270,150,48],"fs":15},"aa":{"p":[300,262,140,44],"t":"аминокислоты","n":[250,380,140,44],"fs":15},"mt":{"p":[90,262,120,44],"t":"mTORC1","n":[80,300,120,44],"fs":15},"agg":{"p":[100,160,160,44],"t":"агрегаты p62\nи убиквитина","n":[80,200,150,44],"fs":14}},"edges":{"b1":{"a":"ub","b":"p62","k":"bind"},"b2":{"a":"p62","b":"ap","k":"bind","t":"LIR — LC3"},"s1":{"a":"ap","b":"ly","k":"seq"},"s2":{"a":"ly","b":"aa","k":"tr"},"a1":{"a":"aa","b":"mt","k":"act","aon":[-70,-6],"bon":[60,8]},"i1":{"a":"mt","b":"ap","k":"inh","dash":true},"g":{"a":"p62","b":"agg","k":"seq"}},"st":{"0":{"n":{"ub":"base","p62":"on","ap":"low","ly":"low","aa":"base","mt":"on","agg":"off"},"e":{"g":"off"},"m":[["Аутофагия","базальная"],["p62","низкое содержание"],["Агрегаты","почти нет"]],"note":"Без голодания mTORC1 активен, аутофагия идёт на базальном уровне, а p62 с убиквитинированным грузом постоянно доставляется в лизосомы."},"1":{"n":{"ub":"base","p62":"on","ap":"on","ly":"on","aa":"on","mt":"low","agg":"off"},"e":{"g":"off"},"m":[["Аутофагия","усилена"],["p62","расходуется"],["Аминокислоты из лизосом","поступают"]],"note":"При голодании активность mTORC1 снижена, аутофагия усилена, и продукты расщепления пополняют пул аминокислот; со временем они снова активируют mTORC1, что ограничивает аутофагию (Yu 2010)."},"2":{"n":{"ub":"on","p62":"on","ap":"off","ly":"off","aa":"off","mt":"base","agg":"on"},"e":{"b2":"off","s1":"off","s2":"off","a1":"off","i1":"off","g":"on"},"m":[["Аутофагия","каноническая нарушена"],["p62","накапливается"],["Агрегаты","убиквитин-положительные"]],"note":"Без Atg7 LC3-II не образуется, и p62 с убиквитинированными белками не попадает в лизосомы: в гепатоцитах мышей накапливаются агрегаты p62 и убиквитина (Komatsu 2005; Komatsu 2007)."}}}}},{"id":"flux-measure","number":24,"section":3,"title":"Как измерить аутофагический поток","question":4,"questions":[4],"keywords":["LC3-II","бафиломицин","поток","p62","тандемный репортёр","mCherry-GFP-LC3","GFP-LC3-RFP-LC3ΔG","долгоживущие белки","вестерн-блот"],"lead":["Поток оценивают по тому, что исчезает, а не по тому, что видно. Для этого сравнивают клетки с заблокированным удалением и без блока или прямо измеряют расщепление."],"mechanism":["Вестерн-блот LC3-II в двух чашках — без бафиломицина и с ним — показывает, сколько LC3-II разрушилось бы за время действия препарата.","[[T59|Тандемный репортёр]] mCherry-GFP-LC3 различает некислые аутофагосомы (жёлтые точки) и кислые аутолизосомы (красные точки).","Распад долгоживущих белков, меченных аминокислотой, измеряет само расщепление; аутофагическую часть выделяют с помощью блока аутофагии."],"paragraphs":["Основной биохимический тест — оборот LC3-II. Клетки делят на две чашки; в одну за короткое время до измерения (обычно 2–4 ч) добавляют [[T57|бафиломицин A1]] или другой ингибитор лизосомного расщепления. Если поток идёт, LC3-II во второй чашке накапливается сильнее. Прибавка — не чистый поток: сам препарат может менять образование аутофагосом, а длительная обработка токсична (Klionsky 2021).","Содержание p62 обычно снижается при активной аутофагии и растёт при её блоке. Но ген SQSTM1 регулируется транскрипционно, в том числе фактором NRF2, поэтому одно содержание p62 поток не определяет (Klionsky 2021).","Тандемный репортёр mCherry-GFP-LC3 различает этапы: в кислой аутолизосоме GFP гаснет, а mCherry сохраняется (Kimura 2007). Жёлтые точки накапливаются при замедленном слиянии или нарушенном закислении, красные — при усиленной доставке в кислые компартменты или замедленном расщеплении. Поэтому цвет и число точек сами по себе не определяют скорость расщепления. Отношение красных точек к жёлтым показывает созревание, но не пропорционально потоку. Количественно удобнее зонд GFP-LC3-RFP-LC3ΔG: ATG4 разрезает его на две части, GFP-LC3 разрушается при аутофагии, а RFP-LC3ΔG остаётся внутренним контролем (Kaizuka 2016).","Прямой метод — распад долгоживущих белков: белки метят аминокислотой, затем измеряют освобождение метки. Значительная часть распада неаутофагическая, поэтому параллельно ставят пробы с блоком аутофагии и вычитают их (Klionsky 2021)."],"trap":["Высокий LC3-II в одной пробе означает усиленную аутофагию.","Высокий LC3-II возникает и при усиленном образовании аутофагосом, и при нарушенном расщеплении. Поток оценивают по разнице между пробами с ингибитором лизосомного расщепления и без него или по распаду меченых белков."],"conditions":"Схема метода, условные пиктограммы: значения полос, точек и кривых нарисованы для объяснения и не являются данными конкретного эксперимента. Требования к тестам — руководство Klionsky 2021 (полный текст, разделы о LC3, p62, тандемных репортёрах и распаде долгоживущих белков). Тандемный репортёр — Kimura 2007; зонд GFP-LC3-RFP-LC3ΔG — Kaizuka 2016 (клетки, рыбки данио, мыши; рефераты).","sources":["Klionsky2021","Kimura2007","Kaizuka2016"],"quiz":{"id":"S11-L24","rev":1,"question":"В клетках с тандемным репортёром mCherry-GFP-LC3 после воздействия красных точек стало вдвое больше, а жёлтых — столько же. Какой вывод следует только из этих данных?","options":[{"id":"S11-L24-1","text":"Аутофагический поток вырос примерно вдвое","correct":false,"feedback":"Красные точки говорят о слиянии и закислении, но не о расщеплении: их накопление возможно и при блоке протеаз. Отношение точек не пропорционально потоку."},{"id":"S11-L24-2","text":"Больше кислых аутолизосом; расщепление не измерено","correct":true,"feedback":"Красный сигнал без GFP означает кислую среду после слияния. Сохраняется ли расщепление, по этим данным не определить: нужен оборот LC3-II или распад меченых белков."},{"id":"S11-L24-3","text":"Слияние аутофагосом с лизосомами нарушено","correct":false,"feedback":"При нарушении слияния накапливались бы жёлтые точки — аутофагосомы с некислой средой. Здесь растёт число красных точек."}]},"widget":{"kind":"cards","title":"","s":{"title":"Методы оценки аутофагического потока","status":"Схема метода · условные пиктограммы","opts":["LC3-II ± бафиломицин","p62","mCherry-GFP-LC3","GFP-LC3-RFP-LC3ΔG","Долгоживущие белки"],"opts_label":"Метод","heads":["Что измеряют","Как","Контроль","Граница вывода"],"fixed":"Пиктограммы условны: они показывают принцип метода, а не результат конкретного эксперимента.","cards":[{"v":["Содержание LC3-II в двух чашках, измеренных одновременно.","Во вторую чашку за 2–4 ч до измерения добавляют бафиломицин A1; лизаты разделяют электрофорезом и проводят вестерн-блот с антителами к LC3.","Актин как контроль количества нанесённого белка; чашка без ингибитора; клетки с блоком образования аутофагосом (без ATG7).","Прибавка LC3-II — не чистый поток: препарат может менять и образование аутофагосом; LC3-II бывает и на одинарных мембранах."],"note":"«Норма» — клетки с идущим потоком, «блок» — клетки с нарушенным расщеплением; −Б и +Б — чашки без бафиломицина и с ним. Поток идёт, если LC3-II во второй чашке заметно больше; без прибавки высокий LC3-II указывает на блок позднего этапа.","pic":{"kind":"gel","title":"вестерн-блот (условная схема)","lanes":["норма","норма","блок","блок"],"lanes2":["−Б","+Б","−Б","+Б"],"bands":[[0,0.12,0.8],[1,0.12,0.7],[2,0.12,0.7],[3,0.12,0.7],[0,0.32,0.35],[1,0.32,0.9],[2,0.32,0.85],[3,0.32,0.88],[0,0.85,0.9],[1,0.85,0.9],[2,0.85,0.9],[3,0.85,0.9]],"marks":[[0.12,"LC3-I"],[0.32,"LC3-II"],[0.85,"актин"]]}},{"v":["Содержание белка p62 (SQSTM1).","Вестерн-блот в тех же пробах, что и LC3.","Те же чашки с бафиломицином и без него; уровень мРНК SQSTM1.","Ген SQSTM1 регулируется транскрипционно (в том числе NRF2), поэтому p62 может расти и без блока аутофагии."],"note":"«Норма» и «блок» — как на блоте LC3. p62 — вспомогательный показатель; поток по нему одному не определяют.","pic":{"kind":"gel","title":"вестерн-блот (условная схема)","lanes":["норма","норма","блок","блок"],"lanes2":["−Б","+Б","−Б","+Б"],"bands":[[0,0.2,0.4],[1,0.2,0.75],[2,0.2,0.8],[3,0.2,0.82],[0,0.85,0.9],[1,0.85,0.9],[2,0.85,0.9],[3,0.85,0.9]],"marks":[[0.2,"p62"],[0.85,"актин"]]}},{"v":["Число жёлтых (GFP + mCherry) и красных (только mCherry) точек.","Флуоресцентная микроскопия живых или фиксированных клеток, экспрессирующих mCherry-GFP-LC3.","Клетки без воздействия; бафиломицин: красных точек нет, все жёлтые.","Красные точки показывают слияние и закисление, но не расщепление; отношение цветов не пропорционально потоку."],"note":"Жёлтые точки накапливаются при замедленном слиянии или нарушенном закислении, красные — при усиленной доставке или замедленном расщеплении; скорость расщепления по цвету точек не определить.","pic":{"kind":"tandem","panels":[{"lab":"контроль","y":3,"r":4},{"lab":"слияние\nнарушено","y":9,"r":1},{"lab":"протеазы\nподавлены","y":3,"r":9},{"lab":"бафило-\nмицин","y":10,"r":0}]}},{"v":["Отношение флуоресценции GFP к RFP в клетке.","Зонд GFP-LC3-RFP-LC3ΔG разрезается ATG4: GFP-LC3 присоединяется к мембране и разрушается в лизосомах, RFP-LC3ΔG остаётся в цитозоле.","RFP-LC3ΔG — внутренний контроль количества зонда; клетки без ATG7.","Метод требует экспрессии зонда; отношение отражает накопленное разрушение за время наблюдения."],"note":"Снижение отношения GFP/RFP означает, что GFP-LC3 доставлялся в лизосомы и разрушался (Kaizuka 2016).","pic":{"kind":"steps","steps":["зонд\nGFP-LC3-\nRFP-LC3ΔG","ATG4\nразрезает\nзонд","GFP-LC3 →\nаутофагосома →\nлизосома","RFP-LC3ΔG\nостаётся\nв цитозоле","отношение\nGFP/RFP\nснижается"],"hl":4}},{"v":["Долю меченых долгоживущих белков, расщеплённых за время наблюдения.","Белки метят аминокислотой (например, [14C]-валином), отмывают и выдерживают, чтобы распались короткоживущие белки; затем измеряют освобождение метки в среду.","Параллельные пробы с блоком аутофагии (бафиломицин, SAR405 или клетки без ATG-белков); их значение вычитают.","Значительная часть распада неаутофагическая; освобождённую аминокислоту нужно разбавлять немеченой, иначе она снова включается в белки."],"note":"Это прямая оценка расщепления: измеряется исчезновение белка, а не число структур (Klionsky 2021).","pic":{"kind":"lines","xlab":"время прослеживания, ч","ylab":"распад, % от метки","xmax":4,"ymax":20,"xticks":[0,1,2,3,4],"yticks":[0,10,20],"series":[{"name":"без аминокислот","pts":[[0,0],[1,4],[2,8],[3,12],[4,16]]},{"name":"полная среда","pts":[[0,0],[1,2],[2,4],[3,6],[4,8]],"dy":-6},{"name":"блок аутофагии","pts":[[0,0],[1,1.2],[2,2.4],[3,3.6],[4,4.8]],"dash":true,"dy":16}],"cap":"условные кривые"}}]}}},{"id":"methods","number":25,"section":4,"title":"Как выбрать измеряемую величину, метод и контроль","question":null,"questions":[1,2,3,4],"keywords":["метод","контроль","люцифераза","циклогексимид","Endo H","импульсная метка","LC3-II","бафиломицин","тандемный репортёр","период полужизни"],"lead":["Четыре системы протеостаза отвечают на разные вопросы, поэтому и измеряют в них разное: долю свернувшихся молекул, скорость распада, прохождение по секреторному пути, поток через лизосому. Вывод надёжен, только если измеряемая величина и контроль выбраны под вопрос."],"mechanism":["Сначала формулируют, что изменилось: доля нативного белка, скорость распада, место в клетке или скорость доставки в лизосому.","Затем выбирают метод, который измеряет именно эту величину, и контроль, который отделяет её от соседних процессов.","Граница вывода задаётся условиями: in vitro или клетки, доза и время воздействия, побочные эффекты препарата."],"paragraphs":["Для цикла Hsp70 удобна система in vitro: денатурированную люциферазу смешивают с очищенными белками и измеряют восстановление её активности. Контроли — смесь для сворачивания без ATP, Hsp70 без гидролиза (K71M) и J-белок с заменой в мотиве HPD. Вывод относится к очищенным белкам; в клетке концентрации и партнёры другие.","Для убиквитин-протеасомной системы главная величина — скорость распада. Её измеряют, остановив синтез циклогексимидом, а путь распада определяют ингибиторами: бортезомиб для протеасомы, бафиломицин для лизосом. Замена остатков дегрона проверяет, какой участок узнаёт лигаза.","В ЭПР важно, где находится белок и что с ним стало. Импульсная метка выделяет когорту молекул, синтезированных за короткое время, а обработка Endo H показывает, прошли ли они medial-Гольджи. Сумма белка в клетках и в среде, убывающая со временем, указывает на распад.","Для аутофагии измеряют не число структур, а поток: сравнивают LC3-II в чашках с бафиломицином и без него, считают жёлтые и красные точки тандемного репортёра, измеряют распад долгоживущих белков. Ни один показатель не достаточен сам по себе, поэтому выводы делают по согласию нескольких."],"trap":["Количество белка или число структур на снимке достаточно, чтобы судить о скорости процесса.","Количество — результат баланса образования и удаления. Скорость измеряют отдельно: при остановленном синтезе, в когорте меченых молекул или по разнице между чашками с ингибитором и без него."],"conditions":"Схема выбора методов; пиктограммы условны. Методы и их ограничения описаны в шагах «Как проверить работу цикла», «Как измерить скорость распада белка», «Как проследить судьбу гликопротеина» и «Как измерить аутофагический поток» с источниками там же: Szabo 1994, Henkel 1993, Liu 1999, Klionsky 2021.","sources":["Szabo1994","Henkel1993","Liu1999","Klionsky2021"],"quiz":{"id":"S11-L25","rev":2,"question":"В клетках без белка Y содержание LC3-II на блоте выросло вдвое. Какое дополнительное измерение позволит выяснить, ускорилось ли образование аутофагосом или замедлилось их удаление?","options":[{"id":"S11-L25-1","text":"Добавить бафиломицин только к клеткам без Y и оценить прибавку LC3-II","correct":false,"feedback":"Прибавка в одних клетках без Y показывает, что оборот LC3-II сохраняется, но не говорит, изменилось ли образование: без контрольной пары частичное нарушение удаления не отличить от усиленного образования."},{"id":"S11-L25-2","text":"Сравнить прибавку LC3-II с бафиломицином в клетках без Y и в контроле","correct":true,"feedback":"Нужны четыре чашки: контрольные клетки и клетки без Y, каждые без бафиломицина и с ним, при одинаковом времени обработки. Прибавка показывает, что оборот LC3-II сохраняется; об изменении образования судят, сравнивая её с прибавкой в контроле. Если прибавка такая же или меньше, а LC3-II без бафиломицина выше, чем в контроле, удаление нарушено; если прибавка больше, образование, скорее всего, усилено."},{"id":"S11-L25-3","text":"Измерить в клетках без Y содержание мРНК LC3","correct":false,"feedback":"Количество мРНК не говорит о скорости образования и удаления аутофагосом; LC3-II — липидированная форма белка, её количество зависит от потока."}]},"widget":{"kind":"cards","title":"","s":{"title":"Величина, метод и контроль в четырёх вопросах","status":"Схема метода · условные пиктограммы","opts":["Сворачивание с Hsp70","Распад белка","Путь гликопротеина","Аутофагический поток"],"opts_label":"Вопрос","heads":["Что измеряют","Как","Контроль","Граница вывода"],"fixed":"Пиктограммы условны: они показывают устройство метода, а не данные конкретного эксперимента.","cards":[{"v":["Долю нативных молекул люциферазы.","Денатурированную люциферазу инкубируют с Hsp70, J-белком, NEF и ATP; пробы разводят в регистрационной смеси с люциферином, ATP и Mg²⁺ и измеряют свечение.","Без ATP только на стадии сворачивания; Hsc70 K71M; J-белок с заменой в HPD.","Очищенные белки in vitro; в клетке концентрации и партнёры другие."],"note":"Восстановление активности — признак правильного сворачивания.","pic":{"kind":"steps","steps":["нагрев:\nлюцифераза\nденатурирована","сворачивание:\nHsp70, J-белок,\nNEF, ATP","проба →\nлюциферин,\nATP, Mg²⁺","% от нативной\nактивности"],"hl":2}},{"v":["Скорость распада и её путь.","Циклогексимид, пробы во времени, иммуноблот; параллельно — с ингибитором.","Проба, взятая в момент 0; контроль количества нанесённого белка; чашка без ингибитора.","Циклогексимид вызывает стресс; ингибиторы в больших дозах неспецифичны."],"note":"Период полужизни измеряют при остановленном синтезе.","pic":{"kind":"lines","xlab":"время, мин","ylab":"% от исходного","xmax":60,"ymax":100,"xticks":[0,30,60],"yticks":[0,50,100],"series":[{"name":"без ингибитора","pts":[[0,100],[30,50],[60,25]]},{"name":"+ бортезомиб","pts":[[0,100],[30,95],[60,90]],"dash":true,"dy":-10}],"cap":"условные кривые"}},{"v":["Где находится когорта белка и сколько её осталось.","Импульсная метка ³⁵S, прослеживание, иммунопреципитация, Endo H, гель; среда отдельно.","Белок дикого типа; проба 0 ч; обработка PNGase F.","Endo H-чувствительность — ЭПР или cis-Гольджи; меченая когорта — не весь белок."],"note":"Устойчивость к Endo H появляется после medial-Гольджи.","pic":{"kind":"gel","title":"клетки, часы прослеживания","lanes":["0","0","2","2"],"lanes2":["−","Endo H","−","Endo H"],"bands":[[0,0.35,1],[1,0.62,1],[2,0.25,0.7],[3,0.25,0.7]],"marks":[[0.25,"комплексный гликан"],[0.62,"без гликана"]]}},{"v":["Скорость доставки и расщепления содержимого аутофагосом.","LC3-II в двух чашках (с бафиломицином 2 ч и без); тандемный репортёр; распад долгоживущих белков.","Чашка без бафиломицина в тот же момент; клетки без ATG7.","Прибавка LC3-II — не чистый поток; бафиломицин может нарушать и слияние."],"note":"Поток оценивают по согласию нескольких показателей.","pic":{"kind":"tandem","panels":[{"lab":"полная среда","y":2,"r":3},{"lab":"без аминокислот","y":4,"r":8},{"lab":"+ бафиломицин","y":11,"r":0}]}}]}}},{"id":"protein-fate","number":26,"section":4,"title":"Судьба одного белка: от Hsp70 до протеасомы и лизосомы","question":null,"questions":[1,2,3,4],"keywords":["протеостаз","сортировка белков","CHIP","ERAD","p62","агрегат","протеасома","лизосома","контроль качества"],"lead":["[[T60|Протеостаз]] — это сеть, в которой судьба разных повреждённых белков определяется по-разному: цитозольный белок получает повторные попытки свернуться, белок ЭПР проходит гликановый контроль, а агрегат удаляется аутофагией. Схема объединяет четыре механизма семинара."],"mechanism":["Hsp70 с J-белком связывает открытые гидрофобные участки; NEF освобождает белок для новой попытки свернуться.","Если попытки неудачны, CHIP убиквитинирует белок, связанный с Hsp70, и цепь K48 направляет его в 26S-протеасому; в ЭПР тот же итог даёт ERAD.","[[T63|Агрегаты]], недоступные протеасоме, связывает p62, и они удаляются аутофагией в лизосоме."],"paragraphs":["Предположим, тепловой стресс развернул часть белков клетки. Открытые гидрофобные участки связывают J-белки и Hsp70. Каждый цикл ATP и ADP даёт белку попытку свернуться; за одну попытку сворачивается лишь часть молекул, поэтому нужны повторные циклы, а факторы обмена нуклеотидов определяют их скорость. Если открытые участки остаются доступными долго, они служат сигналом для систем деградации; так происходит [[T61|сортировка белков]].","Убиквитинлигаза [[T62|CHIP]] связывается с C-концом Hsp70 и Hsp90 и убиквитинирует удерживаемый ими белок; цепь K48 направляет его в 26S-протеасому. Так шаперон и протеасома конкурируют за один и тот же белок: исход определяется тем, что произойдёт раньше — сворачивание или убиквитинирование.","Белок, синтезированный в ЭПР, проходит другой контроль: глюкоза на N-гликане возвращает его к калнексину, отщепление маннозы направляет к SEL1L–HRD1. После выведения в цитозоль такой белок разрушает та же 26S-протеасома.","Крупные агрегаты протеасома разрушить не может: её канал пропускает только развёрнутую цепь. Убиквитинированные агрегаты связывает p62, который взаимодействует с LC3 на мембране аутофагосомы; после слияния с лизосомой агрегат расщепляется. Если нарушено одно звено, нагрузка на соседние растёт: при ингибировании протеасомы усиливается синтез её субъединиц через NRF1, а белки могут перенаправляться в аутофагию."],"trap":["Шапероны, протеасома и аутофагия — три независимые системы, каждая со своими субстратами.","Это связанная сеть: Hsp70 и CHIP передают белок в протеасому, ERAD заканчивается в протеасоме, а убиквитинированные агрегаты через p62 попадают в аутофагию; нарушение одного звена перераспределяет нагрузку на другие."],"conditions":"Схема механизма, качественные состояния; объединяет данные шагов разделов 1–4. Передача белков от Hsp70 к CHIP — Connell 2001 (реферат) и обзор Wentink 2026; ERAD — Christianson 2023; p62 в агрегатах — Bjørkøy 2005; восстановление протеасом — Radhakrishnan 2010. Последовательность «сначала шапероны, затем деградация» — схема кинетической конкуренции, а не жёсткий порядок.","sources":["Wentink2026","Connell2001","Christianson2023","Bjorkoy2005","Radhakrishnan2010","Hipp2019"],"quiz":{"id":"S11-L26","rev":1,"question":"Неисправимый цитозольный белок связан с Hsp70 и убиквитинируется лигазой CHIP. Клетки обработали бортезомибом. Как изменится этот белок в первые часы?","options":[{"id":"S11-L26-1","text":"Накопится в полиубиквитинированной форме","correct":true,"feedback":"Убиквитинирование продолжается, а расщепление в протеасоме остановлено, поэтому полиубиквитинированный белок накапливается."},{"id":"S11-L26-2","text":"Свернётся благодаря новым циклам Hsp70","correct":false,"feedback":"Ингибирование протеасомы не исправляет дефект сворачивания; неисправимый белок остаётся несвёрнутым и убиквитинированным."},{"id":"S11-L26-3","text":"Полностью разрушится в лизосомах","correct":false,"feedback":"Перенаправление части белков в аутофагию при ингибировании протеасомы описано, но оно медленнее и не полное; в первые часы полиубиквитинированный белок накапливается."}]},"widget":{"kind":"net","title":"","s":{"fs":16,"nfs":14,"lfs":14,"zfs":14,"nlfs":12.5,"nzfs":12.5,"title":"Пути повреждённого белка","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Случай","opts":["белок свернулся","неисправимый белок цитозоля","дефектный гликопротеин ЭПР","агрегат"]}],"W":560,"H":380,"NW":340,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","bind":"связывание, узнавание","seq":"порядок событий, путь субстрата","tr":"перенос, доставка","dash":"ослабленная или условная связь","nodes":["жёлтая рамка — путь, по которому идёт белок в выбранном случае","пунктирная рамка — путь не используется"]},"nodes":{"un":{"p":[90,60,150,50],"n":[82,40,140,46],"t":"развёрнутый\nбелок","fs":15},"hsp":{"p":[280,60,150,50],"n":[258,125,140,46],"t":"Hsp70, J-белок,\nNEF","fs":14,"tn":"Hsp70 + JDP\n+ NEF"},"nat":{"p":[470,60,140,50],"n":[258,40,140,46],"t":"нативный\nбелок","fs":15},"chip":{"p":[280,170,150,50],"n":[82,125,140,46],"t":"CHIP: цепь K48","fs":14},"er":{"p":[90,170,150,50],"n":[82,300,140,46],"t":"ЭПР: гликан,\nSEL1L–HRD1","fs":14,"tn":"ЭПР: ERAD"},"prot":{"p":[280,280,150,50],"n":[82,210,140,46],"t":"26S-протеасома","fs":14},"agg":{"p":[470,170,140,50],"n":[258,210,140,46],"t":"агрегат\n+ p62","fs":15},"lys":{"p":[470,280,140,50],"n":[258,300,140,46],"t":"аутофагосома\n→ лизосома","fs":14}},"edges":{"a":{"a":"un","b":"hsp","k":"bind","t":""},"b":{"a":"hsp","b":"nat","k":"seq","t":""},"c":{"a":"hsp","b":"chip","k":"seq","t":""},"d":{"a":"chip","b":"prot","k":"tr","t":""},"e":{"a":"er","b":"prot","k":"tr","t":""},"f":{"a":"hsp","b":"agg","k":"seq","t":"","dash":true},"g":{"a":"agg","b":"lys","k":"tr","t":""}},"base":{"n":{"un":"base","hsp":"off","nat":"off","chip":"off","er":"off","prot":"off","agg":"off","lys":"off"},"e":{"a":"off","b":"off","c":"off","d":"off","e":"off","f":"off","g":"off"}},"st":{"0":{"n":{"un":"on","hsp":"on","nat":"on"},"e":{"a":"on","b":"on"},"m":[["Что решает исход","повторные циклы Hsp70"],["Где заканчивается путь","нативный белок в цитоплазме"]],"note":"Несколько циклов связывания и освобождения дают белку время свернуться; после этого открытых гидрофобных участков не остаётся, и системы деградации его не узнают."},"1":{"n":{"un":"on","hsp":"on","chip":"on","prot":"on"},"e":{"a":"on","c":"on","d":"on"},"m":[["Что решает исход","открытые участки остаются, CHIP успевает раньше"],["Где заканчивается путь","26S-протеасома"]],"note":"Белок, который не сворачивается после многих циклов, убиквитинирует CHIP, связанная с Hsp70, и цепь K48 направляет его в протеасому."},"2":{"n":{"er":"on","prot":"on"},"e":{"e":"on"},"m":[["Что решает исход","отщепление маннозы, лектин OS-9"],["Где заканчивается путь","26S-протеасома в цитозоле"]],"note":"Гликопротеин ЭПР, не свернувшийся вовремя, теряет маннозу, передаётся на SEL1L–HRD1, выводится в цитозоль и разрушается протеасомой."},"3":{"n":{"un":"on","hsp":"low","agg":"on","lys":"on"},"e":{"a":"on","f":"on","g":"on"},"m":[["Что решает исход","агрегат недоступен протеасоме"],["Где заканчивается путь","лизосома"]],"note":"Агрегат слишком велик для канала протеасомы; убиквитинированный агрегат связывает p62, и аутофагосома доставляет его в лизосому."}}}}}],"glossary":[{"id":"S11-T01","term":"Hsp70 (шапероны семейства Hsp70)","section":0,"def":"ATP-зависимые шапероны из нуклеотид-связывающего (NBD) и субстрат-связывающего (SBD) доменов. Связывают открытые гидрофобные участки полипептидов и предотвращают их агрегацию. У человека 11 белков семейства (Wentink 2026, с исправлением авторов): Hsc70 (HSPA8) синтезируется постоянно, синтез HSPA1A усиливается при стрессе, BiP работает в ЭПР, mtHsp70 — в митохондриях. Hsp70 не задаёт белку готовую нативную структуру, но, связывая и освобождая его, может устранять ошибочно свёрнутые состояния (Wentink 2026; Imamoglu 2020)."},{"id":"S11-T02","term":"NBD (нуклеотид-связывающий домен)","section":0,"def":"N-концевой домен Hsp70, который связывает и гидролизует ATP. От нуклеотида в NBD (ATP или ADP) через линкер зависит конформация SBD. С NBD связываются J-домен (стимулирует гидролиз) и факторы обмена нуклеотидов (ускоряют выход ADP)."},{"id":"S11-T03","term":"SBD и крышка","section":0,"def":"C-концевой субстрат-связывающий домен Hsp70: β-складчатая часть с карманом для гидрофобного участка полипептида и α-спиральная крышка. В ATP-состоянии карман открыт, после гидролиза ATP крышка закрывается, и субстрат отходит медленно."},{"id":"S11-T04","term":"J-доменный белок (JDP, Hsp40)","section":0,"def":"Кошаперон Hsp70. Связывает субстраты или прикрепляет Hsp70 к определённым комплексам и своим J-доменом стимулирует гидролиз ATP у Hsp70. У человека около 50 J-белков; у бактерий основной — DnaJ. Пример — DNAJB1 (класс B, цитоплазма)."},{"id":"S11-T05","term":"Мотив HPD","section":0,"def":"Консервативная последовательность His-Pro-Asp в J-домене. Необходима для стимуляции гидролиза ATP у Hsp70: замена гистидина (например, H32Q у DNAJB1 человека) сохраняет белок, но лишает его этой способности (Kityk 2018)."},{"id":"S11-T06","term":"Фактор обмена нуклеотидов (NEF)","section":0,"def":"Белок, который связывается с NBD Hsp70 в ADP-состоянии и ускоряет выход ADP; после связывания ATP субстрат освобождается. У бактерий — GrpE; у человека 13 NEF четырёх семейств: GrpE-подобные, Hsp110, белки с повторами армадилло (HspBP1, SIL1) и белки BAG (Wentink 2026). Количество NEF влияет на результат: избыток in vitro подавлял сворачивание (Gässler 2001)."},{"id":"S11-T07","term":"Неравновесное сродство («сверхсродство»)","section":0,"def":"Теоретически обоснованное свойство Hsp70: субстрат быстро связывается в ATP-состоянии и медленно отходит в ADP-состоянии, а гидролиз ATP переводит одно состояние в другое. Расход ATP позволяет получить эффективное сродство выше, чем у любого равновесного состояния (De Los Rios 2014). Это вывод модели, а не прямое измерение в клетке."},{"id":"S11-T08","term":"Hsp110 (HSPH1 и др.)","section":0,"def":"Белки, родственные Hsp70, которые служат для него фактором обмена нуклеотидов. У животных Hsp110 вместе с Hsp70 и J-белками классов A и B растворяет белковые агрегаты (Rampelt 2012; Nillegoda 2015)."},{"id":"S11-T09","term":"Белки BAG (BAG1, BAG3)","section":0,"def":"Семейство факторов обмена нуклеотидов с BAG-доменом. BAG1 ускоряет выход ADP из Hsc70 (Gässler 2001) и своим убиквитиноподобным доменом связывается с протеасомой; BAG3 направляет связанные с Hsp70 белки к аутофагии (Wentink 2026)."},{"id":"S11-T10","term":"CHIP (STUB1)","section":0,"def":"Убиквитинлигаза E3, которая доменом TPR связывается с C-концевыми мотивами EEVD Hsp70 и Hsp90, а U-боксом переносит убиквитин на связанный субстрат. Направляет неисправимые субстраты шаперонов на протеасомную деградацию (Connell 2001)."},{"id":"S11-T11","term":"Hsp90 и HOP","section":0,"def":"Hsp90 — ATP-зависимый шаперон, который продолжает созревание части клиентов Hsp70, например рецепторов стероидных гормонов и протеинкиназ. HOP — кошаперон, связывающийся доменами TPR с C-концами Hsp70 и Hsp90 и помогающий передать субстрат; для передачи нужен NEF (Wentink 2026)."},{"id":"S11-T12","term":"HSF1","section":0,"def":"Транскрипционный фактор, который при тепловом шоке и других воздействиях, нарушающих сворачивание белков, усиливает транскрипцию генов шаперонов, в том числе Hsp70, J-белков и NEF (Wentink 2026)."},{"id":"S11-T13","term":"BiP (HSPA5, GRP78)","section":0,"def":"Hsp70 эндоплазматического ретикулума. С J-белком DNAJC23 (Sec63) связывает цепь, входящую через транслокон Sec61; участвует в сворачивании белков в ЭПР. Его NEF — SIL1 и GRP170. Роль BiP в регуляции UPR разобрана в семинаре 10."},{"id":"S11-T14","term":"Люцифераза как модельный субстрат","section":0,"def":"Фермент светлячка, который после нагревания или денатурирующих веществ теряет активность. Свет при окислении люциферина излучают только правильно свёрнутые молекулы, поэтому по свечению определяют долю нативной люциферазы в экспериментах со сворачиванием in vitro (Szabo 1994; Gässler 2001). Свечение измеряют в отдельной регистрационной смеси с люциферином, ATP и Mg²⁺; в контроле «без ATP» ATP нет только на стадии сворачивания (Imamoglu 2020)."},{"id":"S11-T15","term":"Убиквитин","section":1,"def":"Белок из 76 аминокислот, который присоединяется C-концевым глицином к остаткам лизина других белков (или к другому убиквитину, образуя цепь). Присоединение требует каскада E1–E2–E3. Смысл метки зависит от числа молекул и типа цепи: цепь K48 обычно направляет белок в протеасому, моноубиквитин и цепи K63 чаще служат другим целям."},{"id":"S11-T16","term":"E1 (фермент, активирующий убиквитин)","section":1,"def":"Фермент, который за счёт ATP образует аденилат убиквитина и затем присоединяет убиквитин тиоэфирной связью к своему цистеину, после чего передаёт его на E2. У человека основной E1 — UBA1. Ингибитор E1 (TAK-243) останавливает убиквитинирование всех субстратов."},{"id":"S11-T17","term":"E2 (фермент, переносящий убиквитин)","section":1,"def":"Фермент, принимающий убиквитин от E1 на собственный цистеин и передающий его на субстрат вместе с E3. У человека около 40 генов E2; от пары E2–E3 во многом зависит тип строящейся цепи."},{"id":"S11-T18","term":"Убиквитинлигаза E3","section":1,"def":"Белок или комплекс, который одновременно связывает субстрат (по его дегрону) и E2·убиквитин и обеспечивает перенос убиквитина на субстрат. У человека около 600 генов E3. RING-лигазы переносят убиквитин прямо с E2, HECT-лигазы — через собственный цистеин."},{"id":"S11-T19","term":"Дегрон","section":1,"def":"Участок белка, который узнаёт убиквитинлигаза E3; его наличие определяет скорость убиквитинирования и разрушения белка. Бывают N- и C-концевые, внутренние и возникающие после модификации дегроны. Дегрон — сигнал для E3, а цепь убиквитина — сигнал для протеасомы."},{"id":"S11-T20","term":"Фосфодегрон","section":1,"def":"Дегрон, который узнаётся только после фосфорилирования. Пример: мотив DSGΨxS IκBα после фосфорилирования S32 и S36 киназой IKK связывается с F-бокс-белком βTrCP лигазы SCF. Замена этих серинов аланином делает белок устойчивым после стимула."},{"id":"S11-T21","term":"Цепь K48","section":1,"def":"Цепь убиквитина, в которой каждый следующий убиквитин присоединён к остатку K48 предыдущего. В экспериментах in vitro с модельными субстратами эффективным сигналом для 26S-протеасомы была цепь из четырёх и более убиквитинов K48 (Thrower 2000). Это не универсальный порог: часть белков разрушается после моноубиквитинирования (Braten 2016)."},{"id":"S11-T22","term":"Деубиквитиназа","section":1,"def":"Протеаза, отщепляющая убиквитин от белков или укорачивающая цепь. Делает убиквитинирование обратимым. В 26S-протеасоме три деубиквитиназы: Rpn11 (металлопротеаза, отщепляет цепь целиком), USP14 и UCH37 (связана с Rpn13)."},{"id":"S11-T23","term":"26S-протеасома","section":1,"def":"АТФ-зависимая протеаза из 20S-частицы (четыре кольца α7β7β7α7, протеолитические центры β1, β2, β5 внутри) и одной или двух 19S-частиц, которые связывают цепь убиквитина, отщепляют её и разворачивают белок. Продукты — пептиды из 3–22 остатков."},{"id":"S11-T24","term":"Rpn11","section":1,"def":"Субъединица крышки 19S-частицы, цинковая металлопротеаза (у человека PSMD14). Отщепляет цепь убиквитина целиком, когда субстрат уже захвачен ATPазами; без её активности убиквитинированные белки не разрушаются (у дрожжей замена гистидинов активного центра на аланин летальна)."},{"id":"S11-T25","term":"NF-κB и IκBα","section":1,"def":"NF-κB — транскрипционный фактор (например, димер p65–p50); в покое связан с ингибитором IκBα и находится в цитоплазме. После фосфорилирования IκBα киназой IKK и его разрушения 26S-протеасомой NF-κB перемещается в ядро и активирует гены-мишени."},{"id":"S11-T26","term":"MLN4924 и неддилирование","section":1,"def":"NEDD8 — белок, похожий на убиквитин; его присоединение к куллину (неддилирование) нужно для активности куллиновых лигаз, например SCF. MLN4924 (певонедистат) ингибирует фермент, активирующий NEDD8, и стабилизирует субстраты куллиновых лигаз; на HECT-лигазы не действует."},{"id":"S11-T27","term":"Циклогексимид","section":1,"def":"Ингибитор элонгации трансляции у эукариот. Используется, чтобы остановить синтез белка и проследить его распад. Сам вызывает стресс и останавливает синтез короткоживущих регуляторов, поэтому прослеживание ограничивают несколькими часами."},{"id":"S11-T28","term":"Период полужизни белка","section":1,"def":"Время, за которое при остановленном синтезе остаётся половина исходного количества белка. Зависит от клеток и условий; у регуляторов с активным дегроном — минуты, у структурных белков — часы и сутки."},{"id":"S11-T29","term":"Бортезомиб","section":1,"def":"Ингибитор 26S-протеасомы, связывающийся прежде всего с химотрипсиноподобными центрами β5. В клетках вызывает накопление полиубиквитинированных белков; применяется при множественной миеломе. При больших дозах действует и на другие мишени."},{"id":"S11-T30","term":"N-гликан и секвон","section":2,"def":"Олигосахарид, присоединённый к атому азота боковой цепи Asn. Гликан переносится только на Asn в последовательности Asn–X–Ser/Thr (встречается и Asn–X–Cys), где X — любая аминокислота, кроме пролина. Такую последовательность называют секвоном."},{"id":"S11-T31","term":"Олигосахарилтрансфераза (OST)","section":2,"def":"Мембранный комплекс ЭПР, переносящий гликан-предшественник с долихолпирофосфата (Dol-PP) на Asn секвона. У человека OST-A (каталитическая субъединица STT3A) работает котрансляционно у транслокона Sec61, OST-B (STT3B) — посттрансляционно, на сайтах, пропущенных OST-A (Ruiz-Canada 2009)."},{"id":"S11-T32","term":"Glc₃Man₉GlcNAc₂","section":2,"def":"Гликан-предшественник: две GlcNAc, девять маннозных и три глюкозных остатка. На кор-маннозе ветвятся α1,3- и α1,6-ветви; глюкозы находятся на конце ветви A. На схемах использованы символы SNFG: синий квадрат — GlcNAc, зелёный круг — манноза, синий круг — глюкоза."},{"id":"S11-T33","term":"Глюкозидазы I и II","section":2,"def":"Ферменты ЭПР: глюкозидаза I отщепляет крайнюю α1,2-глюкозу, глюкозидаза II — две α1,3-глюкозы. После первых двух отщеплений образуется гликан с одной глюкозой, после третьего белок отходит от калнексина. Ингибиторы глюкозидаз (кастаноспермин) нарушают цикл калнексина."},{"id":"S11-T34","term":"Калнексин и кальретикулин","section":2,"def":"Лектины-шапероны ЭПР: калнексин — мембранный, кальретикулин — растворимый. Они связывают гликан с одной глюкозой (Glc₁Man₉GlcNAc₂), а не гидрофобные участки белка (Hebert 1995), и удерживают белок в ЭПР, пока он сворачивается."},{"id":"S11-T35","term":"ERp57 (PDIA3)","section":2,"def":"Тиол-дисульфидная оксидоредуктаза ЭПР, работающая в комплексе с калнексином и кальретикулином: участвует в образовании и перестройке дисульфидных связей у связанных ими гликопротеинов."},{"id":"S11-T36","term":"UGGT1","section":2,"def":"UDP-глюкоза:гликопротеин-глюкозилтрансфераза 1 — фермент ЭПР, возвращающий одну глюкозу на гликан только у несвёрнутого белка с открытыми гидрофобными участками (Sousa 1995; Caramelo 2003). Поэтому его называют датчиком несвёрнутого состояния. У человека есть и UGGT2."},{"id":"S11-T37","term":"Отщепление маннозы: EDEM1–3","section":2,"def":"Медленное отщепление маннозных остатков ограничивает время пребывания несвёрнутого белка в ЭПР. Первую маннозу (ветвь B) отщепляет EDEM2 с TXNDC11 (Ninagawa 2014), затем EDEM3 и EDEM1 открывают α1,6-маннозу ветви C."},{"id":"S11-T38","term":"OS-9 и XTP3-B","section":2,"def":"Лектины ЭПР с доменом MRH. Они узнают гликан с открытой α1,6-маннозой (Hosokawa 2009) и через SEL1L передают субстрат убиквитинлигазе HRD1 (Christianson 2008)."},{"id":"S11-T39","term":"ERAD","section":2,"def":"ER-associated degradation — деградация, связанная с ЭПР: путь, которым дефектные белки ЭПР распознаются, переносятся через мембрану в цитозоль, убиквитинируются и разрушаются 26S-протеасомой. Отличается от повторного сворачивания белка и от разрушения участков ЭПР в лизосоме."},{"id":"S11-T40","term":"SEL1L–HRD1","section":2,"def":"Комплекс мембраны ЭПР: HRD1 — убиквитинлигаза E3 с RING-доменом, SEL1L — адаптер, связывающий её с лектинами OS-9 и XTP3-B. По данным для дрожжей, Hrd1 вместе с Der1 образует канал ретротранслокации (Schoebel 2017); у млекопитающих канал, вероятно, образуют HRD1, DERL2 и HERP (Christianson 2023)."},{"id":"S11-T41","term":"p97 (VCP)","section":2,"def":"Гексамерная ATPаза AAA+ (у дрожжей Cdc48). С кофакторами UFD1 и NPL4 она связывает убиквитиновую цепь и за счёт гидролиза ATP протягивает белок через центральную пору, извлекая его из мембраны ЭПР (Bodnar 2017). Ингибитор — CB-5083 (Anderson 2015)."},{"id":"S11-T42","term":"NGLY1","section":2,"def":"N-гликаназа цитозоля: отщепляет N-гликан от белка, уже выведенного из ЭПР, при этом Asn превращается в Asp. Мутации NGLY1 у человека вызывают дефицит NGLY1 (Enns 2014)."},{"id":"S11-T43","term":"Endo H и PNGase F","section":2,"def":"Ферменты, отщепляющие N-гликаны в пробе белка. Endo H расщепляет высокоманнозные и часть гибридных гликанов (ЭПР, cis-Гольджи), но не комплексные, образующиеся в medial-Гольджи; PNGase F снимает почти все N-гликаны. Сдвиг полосы в геле показывает, был ли гликан и какого типа."},{"id":"S11-T44","term":"Кифунензин","section":2,"def":"Ингибитор α1,2-маннозидаз класса I. Подавляет маннозидазу I аппарата Гольджи (Elbein 1990), и тогда комплексные гликаны не образуются; в клетках гепатомы останавливал распад несвёрнутого α1-антитрипсина (Liu 1999)."},{"id":"S11-T45","term":"Аутофагический поток","section":3,"def":"Скорость доставки компонентов цитоплазмы в лизосомы и их расщепления в лизосомах. Поток — скорость, а не число аутофагосом: пул структур растёт и при усиленном образовании, и при задержке слияния или расщепления (Klionsky 2021)."},{"id":"S11-T46","term":"Аутофагосома","section":3,"def":"Замкнутая структура с двойной мембраной, несущей LC3-II, которая заключает участок цитоплазмы. Среда в ней некислая. Аутофагосома сливается с лизосомой; до слияния её содержимое не расщепляется."},{"id":"S11-T47","term":"Изолирующая мембрана (фагофор)","section":3,"def":"Растущая мембрана, из которой образуется аутофагосома. Её образование начинает комплекс ULK1; на ней VPS34 образует PI3P, и к ней присоединяется LC3. STX17 на незамкнутой мембране отсутствует."},{"id":"S11-T48","term":"Аутолизосома","section":3,"def":"Структура, образованная слиянием аутофагосомы с лизосомой. В кислой среде гидролазы расщепляют груз и внутреннюю мембрану вместе с LC3-II. Число аутолизосом не равно скорости расщепления."},{"id":"S11-T49","term":"Комплекс ULK1","section":3,"def":"Протеинкиназа ULK1 вместе с ATG13, FIP200 и ATG101 (Zachari 2017). Начинает образование изолирующей мембраны. mTORC1 подавляет комплекс, фосфорилируя ULK1 по S758 у человека (S757 у мыши); действие AMPK зависит от условий (Kim 2011; Park 2023)."},{"id":"S11-T50","term":"Комплекс VPS34 и PI3P","section":3,"def":"Фосфатидилинозитол-3-киназа класса III (VPS34, VPS15, BECN1, ATG14) образует на изолирующей мембране фосфатидилинозитол-3-фосфат (PI3P). ULK1 усиливает её работу, фосфорилируя BECN1 (S15 у человека; Russell 2013). Ингибитор — SAR405."},{"id":"S11-T51","term":"WIPI2","section":3,"def":"Белок, связывающий PI3P на изолирующей мембране и привлекающий комплекс ATG12–ATG5–ATG16L1; так присоединение LC3 происходит там, где образован PI3P (Dooley 2014)."},{"id":"S11-T52","term":"LC3 (LC3-I и LC3-II)","section":3,"def":"Белок семейства ATG8. LC3-I — растворимая форма с открытым C-концевым глицином; LC3-II — LC3, присоединённый к фосфатидилэтаноламину мембраны. LC3-II на внутренней мембране разрушается в аутолизосоме. При неканоническом присоединении LC3 бывает и на одинарных мембранах (Durgan 2021)."},{"id":"S11-T53","term":"ATG7 и ATG3","section":3,"def":"Ферменты присоединения LC3: ATG7 — E1-подобный, активирует LC3-I за счёт ATP; ATG3 — E2-подобный, переносит LC3 на фосфатидилэтаноламин. Без ATG7 LC3-II не образуется и нарушено каноническое образование аутофагосом (Komatsu 2005)."},{"id":"S11-T54","term":"Комплекс ATG12–ATG5–ATG16L1","section":3,"def":"Конъюгат ATG12–ATG5, связанный с ATG16L1. Работает как E3-подобный фермент: ускоряет перенос LC3 с ATG3 на липид и направляет реакцию на мембрану, к которой его привлёк WIPI2."},{"id":"S11-T55","term":"STX17","section":3,"def":"Белок SNARE, встраивающийся в наружную мембрану замкнутой аутофагосомы; с SNAP29 и VAMP8 участвует в слиянии с лизосомой (Itakura 2012). Слияние частично идёт и без него — с участием YKT6 (Matsui 2018)."},{"id":"S11-T56","term":"V-ATPase и катепсины","section":3,"def":"V-ATPase переносит протоны в просвет лизосомы и поддерживает кислую среду; в ней работают лизосомные гидролазы, в том числе катепсины. E64d ингибирует цистеиновые катепсины, пепстатин A — катепсин D: слияние и закисление при этом сохраняются."},{"id":"S11-T57","term":"Бафиломицин A1","section":3,"def":"Ингибитор V-ATPase: подавляет закисление и тем самым лизосомное расщепление; в некоторых клетках нарушает и слияние — через SERCA (Mauvezin 2015). Используется коротко (обычно 2–4 ч) в паре «чашка с препаратом и без него» для оценки оборота LC3-II."},{"id":"S11-T58","term":"p62 (SQSTM1)","section":3,"def":"Адаптерный белок: связывает убиквитинированные белки (домен UBA) и LC3 (мотив LIR) и разрушается вместе с грузом при аутофагии (Bjørkøy 2005). При нарушении аутофагии накапливается (Komatsu 2007); ген регулируется и транскрипционно, поэтому содержание p62 — вспомогательный показатель."},{"id":"S11-T59","term":"Тандемный репортёр mCherry-GFP-LC3","section":3,"def":"LC3, слитый с mCherry и GFP. В некислой аутофагосоме видны оба сигнала (жёлтая точка), в кислой аутолизосоме GFP гаснет (красная точка; Kimura 2007). Показывает слияние и закисление, но не расщепление."},{"id":"S11-T60","term":"Протеостаз","section":4,"def":"Согласованная работа систем синтеза, сворачивания, транспорта и разрушения белков, которая поддерживает нужный состав и состояние белков клетки. Включает шапероны (Hsp70 и др.), убиквитин-протеасомную систему, контроль качества в ЭПР и ERAD, аутофагию. Ёмкость этой сети с возрастом снижается."},{"id":"S11-T61","term":"Сортировка белков контролем качества","section":4,"def":"Выбор между повторным сворачиванием, передачей другим шаперонам и разрушением белка. Во многом определяется кинетической конкуренцией: что произойдёт раньше — сворачивание (участки скрыты) или узнавание открытых участков системами деградации (например, CHIP)."},{"id":"S11-T62","term":"CHIP (STUB1)","section":4,"def":"Убиквитинлигаза с TPR-доменом, связывающим C-концы Hsp70 и Hsp90, и U-боксом, взаимодействующим с E2. Убиквитинирует белки, удерживаемые шаперонами, и направляет их в протеасому."},{"id":"S11-T63","term":"Агрегат белка","section":4,"def":"Скопление неправильно свёрнутых молекул, связанных между собой открытыми гидрофобными участками. Крупные агрегаты не проходят в канал протеасомы; их растворяет система Hsp70 с Hsp110 и J-белками или удаляет аутофагия с участием p62."},{"id":"S11-T64","term":"TFEB и TFE3","section":3,"def":"Транскрипционные факторы, усиливающие экспрессию генов лизосомных белков и белков аутофагии. При активном mTORC1 фосфорилированы (у TFEB — в частности, S211), связаны с белками 14-3-3 и находятся в цитоплазме; при снижении активности mTORC1 переходят в ядро (Sardiello 2009; Martina 2012; Roczniak-Ferguson 2012; Martina 2014)."}],"sources":{"Anderson2015":{"url":"https://doi.org/10.1016/j.ccell.2015.10.002","cite":"Anderson D.J., Le Moigne R., Djakovic S. et al. Targeting the AAA ATPase p97 as an approach to treat cancer through disruption of protein homeostasis. Cancer Cell. 2015;28:653–665","doi":"10.1016/j.ccell.2015.10.002","pmid":"26555175"},"Bjorkoy2005":{"url":"https://doi.org/10.1083/jcb.200507002","cite":"Bjørkøy G., Lamark T., Brech A. et al. p62/SQSTM1 forms protein aggregates degraded by autophagy and has a protective effect on huntingtin-induced cell death. J Cell Biol. 2005;171:603–614.","doi":"10.1083/jcb.200507002","pmid":"16286508"},"Bodnar2017":{"url":"https://doi.org/10.1016/j.cell.2017.04.020","cite":"Bodnar N.O., Rapoport T.A. Molecular mechanism of substrate processing by the Cdc48 ATPase complex. Cell. 2017;169:722–735","doi":"10.1016/j.cell.2017.04.020","pmid":"28475898"},"Braten2016":{"url":"https://doi.org/10.1073/pnas.1608644113","cite":"Braten O., Livneh I., Ziv T. et al. Numerous proteins with unique characteristics are degraded by the 26S proteasome following monoubiquitination. Proc Natl Acad Sci USA. 2016;113:E4639–E4647. doi:10.1073/pnas.1608644113","doi":"10.1073/pnas.1608644113","pmid":"27385826"},"Brown1995":{"url":"https://doi.org/10.1126/science.7878466","cite":"Brown K., Gerstberger S., Carlson L., Franzoso G., Siebenlist U. Control of IκB-α proteolysis by site-specific, signal-induced phosphorylation. Science. 1995;267:1485–1488. doi:10.1126/science.7878466","doi":"10.1126/science.7878466","pmid":"7878466"},"Caramelo2003":{"url":"https://doi.org/10.1073/pnas.262661199","cite":"Caramelo J.J., Castro O.A., Alonso L.G., De Prat-Gay G., Parodi A.J. UDP-Glc:glycoprotein glucosyltransferase recognizes structured and solvent accessible hydrophobic patches in molten globule-like folding intermediates. Proc Natl Acad Sci USA. 2003;100:86–91","doi":"10.1073/pnas.262661199","pmid":"12518055"},"Carvalho2006":{"url":"https://doi.org/10.1016/j.cell.2006.05.043","cite":"Carvalho P., Goder V., Rapoport T.A. Distinct ubiquitin-ligase complexes define convergent pathways for the degradation of ER proteins. Cell. 2006;126:361–373","doi":"10.1016/j.cell.2006.05.043","pmid":"16873066"},"Chen1995":{"url":"https://doi.org/10.1101/gad.9.13.1586","cite":"Chen Z., Hagler J., Palombella V.J. et al. Signal-induced site-specific phosphorylation targets IκBα to the ubiquitin-proteasome pathway. Genes Dev. 1995;9:1586–1597. doi:10.1101/gad.9.13.1586","doi":"10.1101/gad.9.13.1586","pmid":"7628694"},"Christianson2008":{"url":"https://doi.org/10.1038/ncb1689","cite":"Christianson J.C., Shaler T.A., Tyler R.E., Kopito R.R. OS-9 and GRP94 deliver mutant α1-antitrypsin to the Hrd1–SEL1L ubiquitin ligase complex for ERAD. Nat Cell Biol. 2008;10:272–282","doi":"10.1038/ncb1689","pmid":"18264092"},"Christianson2023":{"url":"https://doi.org/10.1038/s41580-023-00633-8","cite":"Christianson J.C., Jarosch E., Sommer T. Mechanisms of substrate processing during ER-associated protein degradation. Nat Rev Mol Cell Biol. 2023;24:777–796","doi":"10.1038/s41580-023-00633-8","pmid":"37528230"},"Collins2017":{"url":"https://doi.org/10.1016/j.cell.2017.04.023","cite":"Collins G.A. бъясните, как изменится выход нативной люциферазы при добавлении небольшого количества BAG1, при большом избытке BAG1 и при замене Hsc70 на мутант K71M.","crit":"Названы два домена Hsp70 (NBD и SBD) и связь нуклеотида в NBD с положением крышки SBD. В ATP-состоянии субстрат связывается и отходит быстро, в ADP-состоянии удерживается прочно. J-белок через мотив HPD стимулирует гидролиз ATP, особенно при связанном субстрате, и тем самым обеспечивает захват. NEF ускоряет выход ADP; связывание ATP открывает SBD и освобождает субстрат для новой попытки свернуться. За один цикл сворачивается лишь часть молекул. Небольшое количество BAG1 ускоряет циклы и увеличивает выход; избыток BAG1 освобождает субстрат слишком рано (колоколообразная зависимость, in vitro). K71M не гидролизует ATP, прочного захвата нет, и выход близок к спонтанному."},{"q":"Как сигнал рецептора приводит к разрушению белка-ингибитора? На примере IκBα после TNFα объясните роль киназы, дегрона, каскада E1–E2–E3 и 26S-протеасомы. Предскажите, что покажет блот IκBα через 20 мин после TNFα (в присутствии циклогексимида) у мутанта S32A/S36A, при MLN4924 и при бортезомибе.","crit":"Дегрон определён как участок, который узнаёт E3, и отличён от цепи убиквитина. IKK фосфорилирует S32 и S36; фосфорилированный мотив связывает βTrCP в составе SCF. E1 активирует убиквитин за счёт ATP, E2 переносит, E3 выбирает субстрат; цепь K48 из четырёх и более убиквитинов связывают рецепторы 19S. Rpn11 отщепляет цепь, ATPазы Rpt разворачивают белок, нужен неструктурированный участок; центры β1, β2, β5 находятся в 20S-частице. Циклогексимид исключает новый синтез. S32A/S36A: нет фосфорилирования и распада. MLN4924: p-IκBα накапливается без цепи (SCF без NEDD8 малоактивна). Бортезомиб: накапливаются фосфорилированная и полиубиквитинированные формы, NF-κB не освобождается."},{"q":"Как N-гликан служит меткой состояния белка в ЭПР? Проследите путь гликопротеина от переноса Glc₃Man₉GlcNAc₂ до выхода в аппарат Гольджи или до разрушения. Объясните, чем отличается судьба α1-антитрипсина дикого типа и мутанта NHK в эксперименте с импульсной меткой и Endo H и как на неё влияют кифунензин и ингибитор p97.","crit":"OST переносит гликан на Asn в мотиве Asn-X-Ser/Thr. Глюкозидазы I и II создают моноглюкозилированную форму, которую связывают калнексин и кальретикулин (с ERp57). Глюкозидаза II снимает последнюю глюкозу; UGGT1 возвращает её только несвёрнутому белку, и цикл повторяется. Отщепление маннозы (EDEM2 → Man₈B, затем EDEM1 и EDEM3 → открытая α1,6-манноза) создаёт сигнал для OS-9 и XTP3-B. SEL1L–HRD1 выводит белок и убиквитинирует его; p97 извлекает, NGLY1 снимает гликан, протеасома расщепляет. В эксперименте белок дикого типа становится устойчивым к Endo H и появляется в среде; NHK остаётся чувствительным к Endo H и убывает. Кифунензин замедляет распад NHK; ингибитор p97 оставляет NHK в клетке. Граница вывода: устойчивость к Endo H означает прохождение medial-Гольджи."},{"q":"Что такое аутофагический поток и почему его нельзя измерить одним снимком? Проследите путь от активации ULK1 до расщепления содержимого в лизосоме. Объясните, что покажут блот LC3-II (без бафиломицина и с ним) и тандемный репортёр mCherry-GFP-LC3 в клетках без ATG7, при подавлении STX17 и при ингибиторах лизосомных протеаз.","crit":"ULK1 в комплексе с ATG13, FIP200 и ATG101 активируется при снижении активности mTORC1 (S758 у человека, S757 у мыши); роль AMPK названа с оговоркой об условиях. ULK1 фосфорилирует Beclin 1; комплекс VPS34 с ATG14 образует PI3P; WIPI2 привлекает ATG12–ATG5–ATG16L1; ATG7 и ATG3 превращают LC3-I в LC3-II. STX17 на замкнутой аутофагосоме участвует в слиянии с лизосомой; кислая среда и катепсины расщепляют содержимое. Поток — скорость доставки и расщепления, а не число структур; прибавка LC3-II с бафиломицином не равна чистому потоку. Без ATG7 нет LC3-II. При подавлении STX17 накапливаются аутофагосомы (жёлтые точки); LC3-II без бафиломицина выше, чем в контроле, а прибавка с бафиломицином не больше контрольной. При ингибиторах протеаз накапливаются кислые аутолизосомы (красные точки), LC3-II высокий. Оговорено, что LC3-II бывает и на одинарных мембранах (CASM)."}]};

const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;

  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};
const tee = (x1, y1, x2, y2, c = '#ae3347', w = 3, dash = '') => {

  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};

function chart(series, {xLabel = '', yLabel = '', maxX = 10, maxY = 100, w = 640, h = 290, ticksX = 5, ticksY = 4, title = U.chart_generic, fmtY = v => String(v), marks = []} = {}) {

  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }

    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
