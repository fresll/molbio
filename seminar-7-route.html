<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-7.html">← Вернуться к семинару</a> · <a href="section-2.html#seminars">← Раздел II: семинары</a></p><h1>Интеграция сигналов о ресурсном состоянии: mTORC1, AMPK и лизосомная переработка</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-mtorc1"><div class="eyebrow">mTORC1 и сигналы · шаг 1 из 32</div><h2>Что регулирует комплекс mTORC1</h2><p class="lead">mTORC1 — белковый комплекс с киназной активностью, который связывает сигналы о доступности аминокислот с регуляцией клеточного метаболизма. Его действие оценивают по конкретным субстратам, а не по одному общему признаку «клетка растёт».</p><div class="note"><strong>Что показывает схема.</strong> Слева показан комплекс mTORC1 (киназа mTOR и RAPTOR), справа — четыре его субстрата и процессы, на которые влияет их фосфорилирование: S6K1 (T389, активация, синтез белка), 4E-BP1 (связывание с eIF4E ослаблено), ULK1 (S758 у человека, начало аутофагии ограничено), TFEB (S211 у человека, удержание в цитоплазме). Переключатель показывает отдельно комплекс mTORC2 (mTOR и RICTOR) и его субстрат AKT.</div><ol class="mech"><li>Киназа mTOR входит в состав комплекса <a href="#ns-g-S7-T01">mTORC1</a> вместе с <a href="#ns-g-S7-T03">RAPTOR</a> и другими белками.</li><li>mTORC1 фосфорилирует субстраты, влияющие на синтез белка и на аутофагический аппарат.</li><li>Разные субстраты могут по-разному отвечать на одно воздействие.</li></ol><p><a href="#ns-g-S7-T32">Фосфорилирование</a> — присоединение фосфорильной группы к молекуле. Для белков эту реакцию катализируют киназы: фермент переносит концевую фосфорильную группу ATP на остаток серина, треонина или тирозина белка-субстрата. mTOR — серин/треониновая киназа. Сама по себе молекула mTOR ещё не определяет, какие субстраты будут фосфорилированы: фермент входит в состав двух разных белковых комплексов, и их свойства задаются также белками-партнёрами. Поэтому в объяснениях различают mTOR — название фермента — и mTORC1 — название комплекса, в котором mTOR связан с белком RAPTOR и другими субъединицами.</p><p>RAPTOR — регуляторный белок комплекса mTORC1. Он связывает субстраты и участвует во взаимодействии комплекса с белками лизосомной мембраны. Среди субстратов mTORC1 в семинаре рассматриваются четыре. <a href="#ns-g-S7-T04">S6K1</a> — киназа рибосомного белка S6; фосфорилирование S6K1 по T389 комплексом mTORC1 необходимо для её активации, а активная S6K1 стимулирует синтез белка. <a href="#ns-g-S7-T05">4E-BP1</a> — белок, который связывается с фактором инициации трансляции eIF4E (белком, связывающим кэп-структуру на 5′-конце мРНК) и препятствует инициации трансляции. <a href="#ns-g-S7-T06">ULK1</a> — киназа, участвующая в начале образования аутофагосомы — двухмембранного пузырька, который доставляет участок цитоплазмы в лизосому. <a href="#ns-g-S7-T07">TFEB</a> — транскрипционный фактор, который в ядре активирует экспрессию генов лизосомных белков и белков аутофагии.</p><p>Последствия фосфорилирования у этих белков разные. Фосфорилированная S6K1 активна. Фосфорилирование 4E-BP1 ослабляет его связывание с eIF4E, и eIF4E становится доступен для инициации трансляции: здесь модификация снимает торможение. Фосфорилирование ULK1 по S758 (у человека; у мыши этот участок имеет номер S757) ограничивает участие ULK1 в начале аутофагии. Фосфорилированный TFEB связывается с белками 14-3-3, которые связывают определённые фосфорилированные участки других белков, и удерживается в цитоплазме, поэтому экспрессия его генов-мишеней снижается. Как TFEB, который при голодании преимущественно находится в ядре, вновь оказывается доступен лизосомному mTORC1, объяснено в шаге 6. Один и тот же комплекс стимулирует одни процессы и подавляет другие, поэтому для каждого субстрата нужен свой показатель: фосфорилирование определённого участка, связывание с партнёром или локализация.</p><p>Второй комплекс, <a href="#ns-g-S7-T02">mTORC2</a>, содержит вместо RAPTOR белок RICTOR и фосфорилирует другие субстраты, в частности киназу AKT. Основной материал семинара посвящён mTORC1; сравнительная схема mTORC2 помогает различить состав и субстраты двух комплексов. Значение регуляции mTORC1 видно на примере туберозного склероза. Это наследственное заболевание связано с мутациями генов TSC1 или TSC2, которые кодируют белки комплекса TSC; в норме этот комплекс ограничивает активность mTORC1 через малую ГТФазу RHEB (её действие разобрано в шаге о ростовом сигнале). При утрате функции TSC активность mTORC1 повышена и меньше зависит от ростовых сигналов; с этим связывают образование доброкачественных опухолей (гамартом) в разных органах.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование всегда активирует любой белок.<p class="trap-fix">Эффект зависит от белка и модифицируемого участка. Например, фосфорилирование 4E-BP1 может ослаблять его связывание с eIF4E, тогда как фосфорилирование TFEB способствует удержанию фактора вне ядра.</p></div><div class="static-quiz"><h3>В препарате обнаружен белок mTOR. Какое дополнительное наблюдение позволит отнести его к комплексу mTORC1?</h3><ol><li><b>А.</b> Совместное присутствие mTOR и RAPTOR в выделенном комплексе. <i>(верный вариант)</i><br><span class="expl">RAPTOR — характерный компонент mTORC1; состав комплекса информативнее одного наличия mTOR.</span></li><li><b>Б.</b> Совместное присутствие mTOR и RICTOR в выделенном комплексе. <i>(неверный вариант)</i><br><span class="expl">RICTOR характерен для mTORC2, а не mTORC1.</span></li><li><b>В.</b> Содержание ATP в клетках, из которых выделен этот препарат. <i>(неверный вариант)</i><br><span class="expl">Содержание ATP не устанавливает состав выделенного комплекса.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41586-025-09545-3">Cui Z., Esposito A., Napolitano G., Ballabio A., Hurley J. H. Structural basis for mTORC1 activation on the lysosomal membrane. Nature. 2025;647:536–543. doi:10.1038/s41586-025-09545-3</a></li></ul><p>Основная схема относится к клеткам млекопитающих. Состав и функции представлены качественно; это не результат коиммунопреципитации в новом эксперименте.</p></details></article><article class="card print-unit" id="ns-rag"><div class="eyebrow">mTORC1 и сигналы · шаг 2 из 32</div><h2>Как аминокислотный сигнал меняет положение mTORC1</h2><p class="lead">Аминокислотный сигнал регулирует связывание mTORC1 с Rag-ГТФазами на цитозольной поверхности лизосомы. Перемещение к лизосоме и фосфорилирование субстрата — разные события.</p><div class="note"><strong>Что показывает схема.</strong> Цитозольная поверхность лизосомы: Ragulator удерживает гетеродимер RagA/B–RagC/D. GATOR1 ускоряет гидролиз GTP у RagA/B, FLCN–FNIP — у RagC/D. В конфигурации RagA/B–GTP и RagC/D–GDP гетеродимер связывает RAPTOR и mTORC1 находится у лизосомы; при поддержанном RHEB–GTP фосфорилируется S6K1. В обратной конфигурации mTORC1 остаётся в цитозоле, фосфорилирование S6K1 низкое.</div><ol class="mech"><li><a href="#ns-g-S7-T09">Ragulator</a> удерживает Rag-гетеродимер на лизосомной мембране.</li><li>Сочетание RagA/B–GTP и RagC/D–GDP способствует связыванию RAPTOR.</li><li>Связывание привлекает mTORC1 к мембране и создаёт условия для дальнейшей активации.</li></ol><p>У лизосомы две стороны: цитозольная поверхность мембраны и просвет. Белки, регулирующие mTORC1, собираются на цитозольной поверхности; сам mTORC1 находится на цитозольной стороне мембраны и в просвет лизосомы не переходит. <a href="#ns-g-S7-T08">Rag-ГТФазы</a> — малые ГТФазы, которые образуют гетеродимер: RagA или RagB соединена с RagC или RagD. ГТФазой называют белок, который связывает GTP или GDP; в этих двух формах белок взаимодействует с разными партнёрами, а гидролиз связанного GTP переводит его из одной формы в другую.</p><p>Гетеродимер Rag удерживается на мембране комплексом Ragulator. Ragulator — белковый комплекс, закреплённый на цитозольной поверхности лизосомы; на нём собираются сигнальные белки. Когда аминокислот достаточно, RagA/B связана с GTP, а RagC/D — с GDP. В такой асимметричной конфигурации гетеродимер связывается с RAPTOR, и mTORC1 привлекается к лизосомной мембране. При противоположной конфигурации (RagA/B–GDP и RagC/D–GTP) RAPTOR связывается слабо, и mTORC1 остаётся в цитозоле.</p><p>Нуклеотидное состояние двух половин гетеродимера регулируют разные белки. <a href="#ns-g-S7-T11">GAP</a> (белок, ускоряющий гидролиз GTP) переводит ГТФазу в GDP-форму. Комплекс <a href="#ns-g-S7-T10">GATOR1</a> — GAP для RagA/B: он ускоряет гидролиз GTP у RagA/B и тем самым ослабляет аминокислотный сигнал. При достаточном содержании аминокислот действие GATOR1 ограничено; как это происходит, разобрано в следующем шаге. <a href="#ns-g-S7-T12">FLCN</a> в комплексе с белком FNIP — GAP для RagC/D: переводя RagC/D в GDP-форму, он создаёт вторую половину активной конфигурации. Поэтому нельзя сказать, что для активного состояния обе Rag должны связать GTP. Присутствие FLCN–FNIP на лизосоме не равнозначно его GAP-активности: при недостатке аминокислот этот комплекс может входить в неактивный лизосомный комплекс с Rag и Ragulator (подробнее в шаге 6).</p><p>Схема показывает основной Rag-зависимый путь. Описаны и Rag-независимые пути регуляции mTORC1 аминокислотами; на схеме их нет. Привлечение mTORC1 к мембране и фосфорилирование субстрата — разные события, поэтому на схеме два отдельных показателя: положение mTORC1 и фосфорилирование S6K1. Для фосфорилирования S6K1 у лизосомы нужна ещё ГТФаза RHEB в GTP-форме. На этой схеме RHEB–GTP поддержан как постоянное условие, а его регуляция разобрана в следующих шагах.</p><div class="note trap"><strong>Типичная ошибка</strong> Rag-ГТФазы сами фосфорилируют S6K1.<p class="trap-fix">Rag-белки регулируют привлечение mTORC1 и взаимодействия с субстратами. Фосфорильную группу переносит киназа mTOR, а не Rag.</p></div><div class="static-quiz"><h3>Какое сочетание нуклеотидных состояний Rag в основной схеме способствует связыванию RAPTOR?</h3><ol><li><b>А.</b> RagA/B и RagC/D одновременно связаны с GTP. <i>(неверный вариант)</i><br><span class="expl">Одинаковое состояние двух Rag не заменяет требуемой асимметричной конфигурации.</span></li><li><b>Б.</b> RagA/B связан с GTP, а RagC/D — с GDP. <i>(верный вариант)</i><br><span class="expl">Для связывания RAPTOR важна асимметричная конфигурация гетеродимера RagA/B–GTP и RagC/D–GDP.</span></li><li><b>В.</b> RagA/B связан с GDP, а RagC/D — с GTP. <i>(неверный вариант)</i><br><span class="expl">Это противоположная конфигурация, характерная для подавления основного аминокислотного пути.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41586-025-09545-3">Cui Z., Esposito A., Napolitano G., Ballabio A., Hurley J. H. Structural basis for mTORC1 activation on the lysosomal membrane. Nature. 2025;647:536–543. doi:10.1038/s41586-025-09545-3</a></li><li><a href="https://doi.org/10.1126/science.1232044">Bar-Peled L. et al. A tumor suppressor complex with GAP activity for the Rag GTPases that signal amino acid sufficiency to mTORC1. Science. 2013;340:1100–1106. doi:10.1126/science.1232044</a></li><li><a href="https://doi.org/10.1038/s41594-020-0490-9">Fromm S. A., Lawrence R. E., Hurley J. H. Structural mechanism for amino acid-dependent Rag GTPase nucleotide state switching by SLC38A9. Nat Struct Mol Biol. 2020;27:1017–1023. doi:10.1038/s41594-020-0490-9</a></li></ul><p>Качественная модель основного Rag-зависимого пути в клетках млекопитающих; альтернативные аминокислотные пути не исключаются.</p></details></article><article class="card print-unit" id="ns-growth"><div class="eyebrow">mTORC1 и сигналы · шаг 3 из 32</div><h2>Как ростовой сигнал действует через AKT, TSC и RHEB</h2><p class="lead">Инсулиновый сигнал может усиливать фосфорилирование субстратов mTORC1 через регуляцию комплекса TSC и ГТФазы RHEB. PI3K, AKT и RHEB выполняют разные молекулярные действия.</p><div class="note"><strong>Что показывает схема.</strong> Цепь инсулинового сигнала: рецептор → IRS1 → PI3K (образует PIP₃ из PIP₂) → AKT. AKT фосфорилирует TSC2 и ослабляет GAP-действие комплекса TSC на RHEB, поэтому доля RHEB–GTP растёт и mTORC1 при поддержанном аминокислотном входе фосфорилирует S6K1. Без инсулинового сигнала TSC переводит RHEB в GDP-форму, фосфорилирование S6K1 низкое.</div><ol class="mech"><li><a href="#ns-g-S7-T13">PI3K</a> образует <a href="#ns-g-S7-T14">PIP₃</a> в плазматической мембране и способствует привлечению белков с соответствующими доменами.</li><li><a href="#ns-g-S7-T15">AKT</a> фосфорилирует TSC2 и в рассматриваемом ростовом пути ослабляет действие комплекса <a href="#ns-g-S7-T16">TSC</a>.</li><li>Снижение GAP-действия TSC способствует сохранению <a href="#ns-g-S7-T17">RHEB</a> в GTP-связанном состоянии.</li></ol><p>Инсулиновый сигнал начинается на плазматической мембране. Инсулин связывается с рецептором — тирозинкиназой, которая после связывания гормона фосфорилирует собственные остатки тирозина и белки-адаптеры IRS (субстраты инсулинового рецептора; на схеме показан IRS1). С фосфорилированными остатками тирозина IRS1 связывается фосфатидилинозитол-3-киназа класса I (PI3K), и фермент оказывается рядом со своим субстратом в мембране.</p><p>PI3K фосфорилирует мембранный липид, а не белок: из фосфатидилинозитол-4,5-бисфосфата образуется фосфатидилинозитол-3,4,5-трисфосфат (PIP₃). С PIP₃ связываются белки, у которых есть PH-домен — участок, связывающий фосфоинозитиды, в том числе киназа AKT и киназа PDK1. PDK1 — киназа, которая фосфорилирует активационную петлю AKT (T308 у AKT1 человека); для полной активности AKT нужна и вторая модификация, по S473, которую вносит mTORC2. На схеме эта часть пути упрощена до последовательности «рецептор → IRS1 → PI3K → PIP₃ → AKT».</p><p>Активная AKT фосфорилирует TSC2 — белок туберин, компонент комплекса TSC. Кроме TSC2 в комплекс входят TSC1 (гамартин) и белок TBC1D7. TSC2 выполняет функцию GAP в отношении малой ГТФазы RHEB: ускоряет гидролиз связанного с RHEB GTP и переводит RHEB в GDP-форму. Фосфорилирование TSC2 киназой AKT ослабляет это действие комплекса. AKT, следовательно, действует на RHEB не прямо, а через TSC. Есть и вторая ветвь от AKT: AKT фосфорилирует белок PRAS40. Нефосфорилированный PRAS40 связывается с RAPTOR и мешает субстратам связываться с mTORC1; после фосфорилирования под действием AKT это торможение ослабевает (в культивируемых клетках; Sancak и соавт., 2007; Wang и соавт., 2007). Ветвь PRAS40 действует параллельно с TSC–RHEB и не заменяет её.</p><p>Когда GAP-действие TSC ослаблено, гидролиз GTP у RHEB замедляется и доля RHEB–GTP возрастает. RHEB–GTP взаимодействует с mTORC1 и стимулирует фосфорилирование S6K1 и других субстратов; на схеме это взаимодействие показано стрелкой, а не постоянным закреплением RHEB на лизосоме. RHEB связан с мембранами через липидную модификацию (фарнезильный остаток) и, по данным Angarola и Ferguson (2019), не накапливается преимущественно на лизосомах. Аминокислотный вход на этой схеме поддержан: без него mTORC1 не привлекается к лизосоме, и RHEB–GTP не обеспечивает фосфорилирования S6K1 (следующие шаги).</p><div class="note trap"><strong>Типичная ошибка</strong> RHEB активируется потому, что AKT фосфорилирует его непосредственно.<p class="trap-fix">В основном пути AKT регулирует TSC2; изменение состояния RHEB связано с ослаблением GAP-действия TSC.</p></div><div class="static-quiz"><h3>В основной модели AKT ослабила GAP-действие комплекса TSC. Какое изменение RHEB этому соответствует?</h3><ol><li><b>А.</b> Ускоряется гидролиз GTP и возрастает доля RHEB–GDP. <i>(неверный вариант)</i><br><span class="expl">Этот результат ожидался бы при усилении GAP-действия, а не его ослаблении.</span></li><li><b>Б.</b> Нуклеотидное состояние RHEB не меняется: TSC регулирует только положение mTORC1. <i>(неверный вариант)</i><br><span class="expl">TSC выполняет GAP-действие на RHEB; его функцию нельзя свести только к положению mTORC1.</span></li><li><b>В.</b> Замедляется гидролиз GTP и возрастает доля RHEB–GTP. <i>(верный вариант)</i><br><span class="expl">Ослабление GAP-действия замедляет гидролиз GTP у RHEB и способствует GTP-связанной форме.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1091/mbc.E19-03-0146">Angarola B., Ferguson S. M. Weak membrane interactions allow Rheb to activate mTORC1 signaling without major lysosome enrichment. Mol Biol Cell. 2019;30:2750–2760. doi:10.1091/mbc.E19-03-0146</a></li><li><a href="https://doi.org/10.1038/s41586-025-09545-3">Cui Z., Esposito A., Napolitano G., Ballabio A., Hurley J. H. Structural basis for mTORC1 activation on the lysosomal membrane. Nature. 2025;647:536–543. doi:10.1038/s41586-025-09545-3</a></li><li><a href="https://doi.org/10.1016/j.molcel.2007.03.003">Sancak Y. et al. PRAS40 is an insulin-regulated inhibitor of the mTORC1 protein kinase. Mol Cell. 2007;25:903–915. doi:10.1016/j.molcel.2007.03.003</a></li><li><a href="https://doi.org/10.1074/jbc.M702376200">Wang L. et al. PRAS40 regulates mTORC1 kinase activity by functioning as a direct inhibitor of substrate binding. J Biol Chem. 2007;282:20036–20044. doi:10.1074/jbc.M702376200</a></li></ul><p>Рассматривается ростовая ветвь в клетке млекопитающего при достаточном аминокислотном сигнале. Контакт RHEB с mTORC1 изображён условно; длительность и место контакта не измеряются.</p></details></article><article class="card print-unit" id="ns-sensors"><div class="eyebrow">mTORC1 и сигналы · шаг 4 из 32</div><h2>Какие молекулы воспринимают лейцин, аргинин и SAM</h2><p class="lead">Разные метаболиты связываются с разными сенсорными белками. Сенсор, регулирующий Rag, нужно отличать от транспортёра в лизосомной мембране.</p><div class="note"><strong>Что показывает схема.</strong> Четыре входа: лейцин связывается с Sestrin2, цитозольный аргинин — с CASTOR1; без лиганда эти белки подавляют GATOR2, и GATOR1 ускоряет гидролиз GTP у RagA/B. SAM связывается с SAMTOR; без SAM белок SAMTOR связывается с GATOR1–KICSTOR и усиливает торможение mTORC1. SLC38A9 в мембране лизосомы связывает аргинин со стороны просвета, переносит лейцин в цитозоль и через Ragulator–Rag участвует в активации mTORC1.</div><ol class="mech"><li>Лейцин связывается с <a href="#ns-g-S7-T18">Sestrin2</a>, а цитозольный аргинин — с <a href="#ns-g-S7-T19">CASTOR1</a>.</li><li><a href="#ns-g-S7-T20">SAM</a> взаимодействует с <a href="#ns-g-S7-T21">SAMTOR</a> и меняет его связь с GATOR1–<a href="#ns-g-S7-T23">KICSTOR</a>.</li><li><a href="#ns-g-S7-T22">SLC38A9</a> воспринимает лизосомный аргинин и участвует в выходе аминокислот из лизосомы.</li></ol><p>Доступность разных аминокислот воспринимают разные белки-сенсоры. Каждый метаболит связывается со своим белком, и каждый из них действует на своё звено регуляторной цепи. Сенсором здесь называют белок, который связывает определённый метаболит и при этом меняет свои взаимодействия с регуляторными комплексами.</p><p>Лейцин в цитозоле связывается с Sestrin2, а аргинин в цитозоле — с CASTOR1. Без своего лиганда оба белка связываются с комплексом GATOR2 и подавляют его. GATOR2, в свою очередь, ограничивает действие GATOR1 — комплекса, который ускоряет гидролиз GTP у RagA/B. Поэтому при удалении лейцина Sestrin2 связывается с GATOR2, торможение GATOR1 ослабевает, RagA/B переходит в GDP-форму и mTORC1 перестаёт привлекаться к лизосоме. Связавшись с лейцином, Sestrin2 диссоциирует от GATOR2, и цепь действует в обратном направлении.</p><p>Что известно о действии сенсоров на GATOR2? Sestrin2 и CASTOR1 — белки, связывающие метаболит; ферментативной реакции с участием GATOR2 здесь нет. Без лиганда каждый из них присоединяется к своей поверхности GATOR2, и эти поверхности не перекрываются: GATOR2 образует каркас, в котором β-пропеллеры WD40 разных субъединиц связывают сенсоры и GATOR1, а CASTOR1 удерживается двумя β-пропеллерами MIOS, каждый из которых связывает одну из двух субъединиц димера CASTOR1 (Valenstein и соавт., 2025; Jansen и соавт., 2025). Связывание лейцина с Sestrin2 или аргинина с CASTOR1 изменяет конформацию сенсора: у CASTOR1, например, упорядочивается петля, которая закрывает поверхность контакта с GATOR2, и сенсор отделяется от комплекса. Пока сенсор связан с GATOR2, он ограничивает подвижность β-пропеллера WDR24 — домена, необходимого для зависимой от питательных веществ активации mTORC1. GATOR2 — регуляторный комплекс, а не киназа, и GATOR1 он не фосфорилирует. Структуры показывают связывание сенсоров и изменение подвижности GATOR2; как именно эти изменения затем меняют работу GATOR1 как GAP, в опубликованных работах описано не полностью.</p><p>S-аденозилметионин (SAM) — донор метильных групп, который образуется из метионина. SAM связывается с SAMTOR. Без SAM белок SAMTOR связывается с GATOR1 и KICSTOR — комплексом, который удерживает GATOR1 на лизосоме, — и тем самым усиливает торможение mTORC1. SAMTOR, следовательно, реагирует на SAM, а не непосредственно на метионин: метионин влияет на этот вход через образование SAM.</p><p>SLC38A9 устроен иначе. Это белок лизосомной мембраны, переносчик аминокислот. Он связывает аргинин со стороны просвета лизосомы и через Ragulator–Rag участвует в активации mTORC1. Кроме того, при связывании аргинина SLC38A9 переносит лейцин и другие незаменимые аминокислоты из просвета в цитозоль (Wyant и соавт., 2017). Перенос лейцина из лизосомы и связывание цитозольного лейцина с Sestrin2 — разные события: SLC38A9 не является цитозольным сенсором лейцина. Кроме того, цитозольный участок SLC38A9 участвует в перестройке лизосомного комплекса FLCN–FNIP–Rag–Ragulator при возвращении аминокислот (шаг 6). Чувствительность каждого входа зависит от клетки и условий, а список сенсоров на схеме не исчерпывающий.</p><div class="note trap"><strong>Типичная ошибка</strong> SLC38A9 — основной цитозольный сенсор лейцина.<p class="trap-fix">В рассматриваемом механизме цитозольный лейцин связывается с Sestrin2; SLC38A9 расположен в лизосомной мембране и участвует в аргинин-зависимом транспорте.</p></div><div class="static-quiz"><h3>Из среды в качественной модели удалили только лейцин. Другие входы поддержаны. Как меняется взаимодействие Sestrin2 с GATOR2?</h3><ol><li><b>А.</b> Sestrin2 связывается с GATOR2 и подавляет передачу этого сигнала. <i>(верный вариант)</i><br><span class="expl">Без связанного лейцина Sestrin2 взаимодействует с GATOR2 и ограничивает лейцин-зависимый вход.</span></li><li><b>Б.</b> Sestrin2 отделяется от GATOR2 и усиливает передачу этого сигнала. <i>(неверный вариант)</i><br><span class="expl">Ослабление этого взаимодействия характерно для связывания лейцина, а не его удаления.</span></li><li><b>В.</b> Связывание не меняется: в этой схеме Sestrin2 воспринимает только аргинин. <i>(неверный вариант)</i><br><span class="expl">В заданной ветви Sestrin2 связывает лейцин; цитозольный аргинин воспринимает CASTOR1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1126/science.aab2674">Wolfson R. L. et al. Sestrin2 is a leucine sensor for the mTORC1 pathway. Science. 2016;351:43–48. doi:10.1126/science.aab2674</a></li><li><a href="https://doi.org/10.1016/j.cell.2016.02.035">Chantranupong L. et al. The CASTOR proteins are arginine sensors for the mTORC1 pathway. Cell. 2016;165:153–164. doi:10.1016/j.cell.2016.02.035</a></li><li><a href="https://doi.org/10.1126/science.aao3265">Gu X. et al. SAMTOR is an S-adenosylmethionine sensor for the mTORC1 pathway. Science. 2017;358:813–818. doi:10.1126/science.aao3265</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.09.046">Wyant G. A. et al. mTORC1 activator SLC38A9 is required to efflux essential amino acids from lysosomes and use protein as a nutrient. Cell. 2017;171:642–654.e12. doi:10.1016/j.cell.2017.09.046</a></li><li><a href="https://doi.org/10.1038/s41586-025-09428-7">Valenstein M. L., Wranik M., Lalgudi P. V. et al. Structural basis for the dynamic regulation of mTORC1 by amino acids. Nature. 2025;646:493–500. doi:10.1038/s41586-025-09428-7</a></li><li><a href="https://doi.org/10.1038/s41594-025-01635-0">Jansen R. M., Maghe C., Tapia K. et al. Structural basis for mTORC1 regulation by the CASTOR1–GATOR2 complex. Nat Struct Mol Biol. 2025;32:1980–1988. doi:10.1038/s41594-025-01635-0</a></li><li><a href="https://doi.org/10.1038/s41594-020-0490-9">Fromm S. A., Lawrence R. E., Hurley J. H. Structural mechanism for amino acid-dependent Rag GTPase nucleotide state switching by SLC38A9. Nat Struct Mol Biol. 2020;27:1017–1023. doi:10.1038/s41594-020-0490-9</a></li></ul><p>Основная качественная схема выбранных сенсоров. Это не исчерпывающий перечень сенсоров каждой аминокислоты; чувствительность зависит от клетки и условий. Структурные данные 2025 г. описывают связывание сенсоров с GATOR2; передача изменений GATOR2 на GATOR1 описана не полностью.</p></details></article><article class="card print-unit" id="ns-coincidence"><div class="eyebrow">mTORC1 и сигналы · шаг 5 из 32</div><h2>Почему привлечение mTORC1 и его активацию проверяют раздельно</h2><p class="lead">В основной модели для фосфорилирования S6K1 нужны аминокислотный вход и разрешающее состояние RHEB. Совпадение входов не означает, что все субстраты mTORC1 регулируются одинаково.</p><div class="note"><strong>Что показывает схема.</strong> Таблица двух входов для S6K1 в основной Rag-зависимой модели: аминокислоты и RHEB–GTP — mTORC1 у лизосомы, фосфорилирование S6K1 высокое; только аминокислоты — mTORC1 у лизосомы, фосфорилирование низкое; только RHEB–GTP — mTORC1 в цитозоле, фосфорилирование низкое; без обоих входов оба показателя низкие.</div><ol class="mech"><li>Аминокислотный вход через <a href="#ns-g-S7-T08">Rag</a> способствует привлечению mTORC1 к мембране.</li><li><a href="#ns-g-S7-T17">RHEB</a>–GTP и взаимодействия комплекса с мембраной поддерживают киназную активацию.</li><li>При недостаточности одного входа локализация и p-<a href="#ns-g-S7-T04">S6K1</a> могут изменяться по-разному.</li></ol><p>Рассмотрим четыре сочетания двух входов при одинаковых прочих условиях: энергии достаточно, все белки комплекса и субстрат S6K1 присутствуют, сравнение проводится в один и тот же момент. Первый вход — аминокислотный: через Rag он определяет, привлечён ли mTORC1 к лизосомной мембране. Второй вход — ростовой: через AKT и TSC он определяет, находится ли RHEB преимущественно в GTP-форме.</p><p>Для каждого сочетания два показателя описываются отдельно. Когда работают оба входа, mTORC1 находится у лизосомы и фосфорилирует S6K1. Когда работает только аминокислотный вход, mTORC1 привлечён к лизосоме, но RHEB находится преимущественно в GDP-форме, и фосфорилирование S6K1 остаётся низким. Когда работает только ростовой вход, RHEB–GTP есть, но mTORC1 не привлечён к мембране, и фосфорилирование S6K1 тоже низкое. Без обоих входов оба показателя низкие. Слово «низкое» здесь означает существенно сниженный сигнал, а не обязательно нулевой во всех клетках.</p><p>Такая таблица описывает основную Rag-зависимую ветвь для S6K1. Её нельзя переносить на все генотипы и все субстраты. При утрате TSC RHEB–GTP сохраняется и без ростового сигнала; при утрате GATOR1 Rag-вход меньше зависит от аминокислот. Фосфорилирование TFEB, как показано в следующем шаге, по-другому зависит от RHEB. В схеме нет расчётной формулы: она показывает только, что одного входа недостаточно для высокого фосфорилирования S6K1.</p><p>Мембрана в этом механизме — не фон рисунка. Она сближает mTORC1, привлечённый Rag, и RHEB, связанный с мембраной липидной модификацией. В реконструированной системе Cui и соавт. (2025) роль мембраны и её белков в активации mTORC1 изучали на очищенных компонентах; такой эксперимент показывает возможность механизма, но не воспроизводит все условия клетки. В клеточном эксперименте локализацию и фосфорилирование измеряют разными методами (шаг о методах исследования mTORC1).</p><div class="note trap"><strong>Типичная ошибка</strong> Если mTORC1 находится на лизосоме, S6K1 обязательно фосфорилирован.<p class="trap-fix">Колокализация показывает положение комплекса; для вывода о действии на S6K1 нужен отдельный показатель его фосфорилирования.</p></div><div class="static-quiz"><h3>В модели Rag привлекает mTORC1 к лизосоме, но RHEB сохраняется в GDP-форме. Какой результат ожидается для S6K1?</h3><ol><li><b>А.</b> Фосфорилирование S6K1 становится высоким вследствие действия RHEB–GDP. <i>(неверный вариант)</i><br><span class="expl">GDP-связанная форма RHEB не выполняет в этой схеме действие RHEB–GTP.</span></li><li><b>Б.</b> Фосфорилирование S6K1 остаётся низким, несмотря на локализацию mTORC1. <i>(верный вариант)</i><br><span class="expl">Одной локализации недостаточно: в заданной модели отсутствует необходимое действие RHEB–GTP.</span></li><li><b>В.</b> Фосфорилирование S6K1 становится высоким только из-за локализации mTORC1. <i>(неверный вариант)</i><br><span class="expl">Положение комплекса не заменяет его киназную активацию.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41586-025-09545-3">Cui Z., Esposito A., Napolitano G., Ballabio A., Hurley J. H. Structural basis for mTORC1 activation on the lysosomal membrane. Nature. 2025;647:536–543. doi:10.1038/s41586-025-09545-3</a></li></ul><p>Качественная модель Rag-зависимого фосфорилирования S6K1; энергия, белки комплекса и субстрат доступны. «Низко» не означает строго нулевой сигнал во всех реальных клетках.</p></details></article><article class="card print-unit" id="ns-tfeb"><div class="eyebrow">mTORC1 и сигналы · шаг 6 из 32</div><h2>Почему TFEB и S6K1 могут отвечать по-разному</h2><p class="lead">Фосфорилирование TFEB имеет особые требования к RagC/D и комплексу FLCN–FNIP. По состоянию S6K1 нельзя автоматически определить положение TFEB.</p><div class="note"><strong>Что показывает схема.</strong> Две ветви одного комплекса: RHEB–GTP стимулирует фосфорилирование S6K1; FLCN–FNIP переводит RagC/D в GDP-форму, и RagC/D подводит TFEB к mTORC1. При сниженной активности RHEB падает p-S6K1, а p-TFEB может сохраниться. Без FLCN p-TFEB резко снижено и TFEB перемещается в ядро, тогда как p-S6K1 в значительной мере сохраняется.</div><ol class="mech"><li><a href="#ns-g-S7-T12">FLCN</a> в комплексе с <a href="#ns-g-S7-T24">FNIP</a> регулирует нуклеотидное состояние RagC/D.</li><li>Rag-зависимые взаимодействия обеспечивают фосфорилирование <a href="#ns-g-S7-T07">TFEB</a> комплексом mTORC1.</li><li>Фосфорилирование TFEB способствует связыванию <a href="#ns-g-S7-T25">14-3-3</a> и удержанию фактора вне ядра.</li></ol><p>TFEB — транскрипционный фактор, который в ядре активирует экспрессию генов лизосомных белков и белков аутофагического аппарата. Пока TFEB фосфорилирован комплексом mTORC1, он связывается с белками 14-3-3 и удерживается в цитоплазме. Белки 14-3-3 — семейство белков, связывающих определённые фосфорилированные участки других белков. Когда фосфорилирование TFEB снижается, фактор перемещается в ядро.</p><p>TFEB фосфорилируется тем же комплексом mTORC1, что и S6K1, но требования к регуляторным белкам у двух субстратов разные. Для фосфорилирования TFEB особенно важна RagC/D в GDP-форме, которую создаёт комплекс FLCN–FNIP. RagC/D в GDP-форме непосредственно связывает TFEB и привлекает его к mTORC1 у лизосомы. Поэтому в клетках без FLCN фосфорилирование TFEB резко снижено, а фосфорилирование S6K1 в значительной мере сохраняется. Наоборот, при сохранённом Rag-сигнале и сниженной активности RHEB фосфорилирование S6K1 падает, а фосфорилирование TFEB может сохраниться (Napolitano и соавт., 2020).</p><p>На схеме три показателя разделены: фосфорилирование S6K1, фосфорилирование TFEB по S211 (номер участка для TFEB человека) и доля TFEB в ядре. Номер S211 не переносится автоматически на родственный фактор TFE3. Ядерная доля TFEB — показатель локализации фактора. Увеличение ядерной доли ещё не означает, что число лизосом возросло сразу: для этого должны измениться экспрессия генов-мишеней, синтез белков и построение мембран.</p><p>Как mTORC1 может фосфорилировать TFEB, если при голодании TFEB находится преимущественно в ядре? Ответ состоит в том, что распределение TFEB динамично. Белок непрерывно переходит из цитозоля в ядро и обратно; выражение «преимущественно в ядре» означает лишь, что при голодании импорт идёт быстрее экспорта, но не то, что TFEB заперт в ядре. Поэтому при возвращении питательных веществ достаточно изменить баланс скоростей: часть ядерного TFEB вновь оказывается в цитозоле и становится доступна лизосомному mTORC1. Это не означает, что вся масса TFEB одновременно перемещается к лизосоме: меняются доли белка в разных состояниях и скорости импорта, экспорта, фосфорилирования и связывания.</p><p>Экспорт TFEB из ядра регулируется. В последовательности TFEB есть сигнал ядерного экспорта (NES), который узнаёт экспортин XPO1 (CRM1). Сигнал включается фосфорилированием двух остатков серина рядом с ним — S142 и S138, причём реакции идут по порядку: фосфорилирование S142 подготавливает фосфорилирование S138. Napolitano и соавт. (2018) показали, что это иерархическое фосфорилирование зависит от mTOR, а Li и соавт. (2018) — что S138 фосфорилирует киназа GSK3β, активность которой снижается при нехватке глюкозы. Поэтому нельзя приписывать оба остатка одному лизосомному mTORC1: вклад киназ зависит от условий. При достатке питательных веществ фосфорилирование S142 и S138 ускоряет экспорт, а при его ослаблении экспорт замедляется и TFEB накапливается в ядре.</p><p>Оказавшись в цитозоле, TFEB связывается с RagC/D в GDP-форме на цитозольной поверхности лизосомы. Это специфическое белковое узнавание, а не общее свойство TFEB накапливаться у лизосомы: RagC/D–GDP, которую создаёт FLCN–FNIP, непосредственно связывает TFEB. К этому времени mTORC1 уже привлечён к лизосоме: RAPTOR связывается с Rag-гетеродимером, в котором RagA/B находится в GTP-форме. Лизосомный mTORC1 фосфорилирует доступный TFEB, в частности по S211; фосфо-S211 образует участок связывания 14-3-3, и эти белки удерживают TFEB преимущественно в цитозоле. Таким образом, действуют два разных механизма: S142, S138 и XPO1 определяют скорость вывода TFEB из ядра, а S211 и 14-3-3 удерживают его в цитозоле.</p><p>При недостатке питательных веществ действие mTORC1 на TFEB ослабевает, а фосфатные группы с него снимают фосфатазы. Один из установленных путей: выход Ca²⁺ из просвета лизосомы через канал TRPML1 (MCOLN1) активирует фосфатазу кальциневрин, которая связывается с TFEB и дефосфорилирует его (Medina и соавт., 2015). После дефосфорилирования TFEB теряет связь с 14-3-3, а его экспорт из ядра ослабевает, поэтому доля ядерного TFEB растёт. Регуляция TFEB не сводится к одной фосфатазе во всех условиях: в разных клетках и при разных воздействиях описаны и другие пути.</p><p>Коротко цикл можно записать так. Голодание: ослабление сигнала mTORC1 и действие фосфатаз → меньше связей TFEB с 14-3-3 и слабее экспорт → накопление TFEB в ядре и его транскрипционная активность. Восстановление питания: меняется баланс импорта и экспорта (NES, S142 и S138, XPO1) → цитозольный TFEB связывается с RagC/D–GDP → лизосомный mTORC1 фосфорилирует S211 → 14-3-3 удерживает TFEB вне ядра. Перераспределение и фосфорилирование белков происходят быстрее, чем изменение экспрессии генов-мишеней и построение новых лизосом.</p><p>Почему присутствия FLCN у лизосомы недостаточно для фосфорилирования TFEB? Положение белка и его каталитическая активность — разные характеристики. При недостатке аминокислот FLCN–FNIP может входить в лизосомный комплекс FLCN–FNIP–Rag–Ragulator, который удерживает Rag-гетеродимер в неактивной конфигурации; в этом комплексе GAP-активность FLCN–FNIP по отношению к RagC/D подавлена. После возвращения аминокислот комплекс перестраивается: по данным структурного анализа, цитозольный участок SLC38A9 дестабилизирует его и тем самым запускает GAP-действие FLCN–FNIP на RagC (Fromm и соавт., 2020). Возникающая RagC/D–GDP может привлекать TFEB. Здесь различают три Rag-зависимых события: привлечение mTORC1 к лизосоме требует RagA/B–GTP, доставка TFEB — RagC/D–GDP, а фосфорилирование S6K1 — ещё и RHEB. Схема основана на структурах и опытах с определёнными белками (в структурных работах использовали FLCN–FNIP2); её не следует считать универсальной для всех клеток и всех вариантов FNIP.</p><p>Описанная схема относится к условиям экспериментов Napolitano и соавт. (2020). При хронической утрате TSC2 в некоторых клетках TFEB может перемещаться в ядро через неканонический механизм, связанный с RagC (Alesi и соавт., 2021); у TFEB есть и другие участки фосфорилирования. Независимость фосфорилирования TFEB от RHEB не означает, что TFEB фосфорилируется другой киназой: каталитическую реакцию выполняет mTOR, различается регуляция доступа субстрата к комплексу.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое повышение p-S6K1 означает, что TFEB обязательно удерживается в цитоплазме.<p class="trap-fix">S6K1 и TFEB имеют разные требования к взаимодействиям с mTORC1; их фосфорилирование и локализацию измеряют отдельно.</p></div><div class="static-quiz"><h3>В модели с сохранённым Rag-сигналом уменьшили активность RHEB. Какое сравнение корректно для S6K1 и TFEB?</h3><ol><li><b>А.</b> p-S6K1 и фосфорилирование TFEB обязаны снизиться одинаково. <i>(неверный вариант)</i><br><span class="expl">Одинаковый фермент не означает одинаковой зависимости каждого субстрата от регуляторных белков.</span></li><li><b>Б.</b> Фосфорилирование TFEB обязательно растёт пропорционально падению p-S6K1. <i>(неверный вариант)</i><br><span class="expl">Различие зависимостей не устанавливает обязательной обратной пропорциональности двух показателей.</span></li><li><b>В.</b> p-S6K1 может снизиться, а фосфорилирование TFEB — сохраниться. <i>(верный вариант)</i><br><span class="expl">Для рассматриваемой Rag-зависимой ветви TFEB требования к RHEB отличаются от требований S6K1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41586-020-2444-0">Napolitano G. et al. A substrate-specific mTORC1 pathway underlies Birt–Hogg–Dubé syndrome. Nature. 2020;585:597–602. doi:10.1038/s41586-020-2444-0</a></li><li><a href="https://doi.org/10.1126/scisignal.2002790">Roczniak-Ferguson A. et al. The transcription factor TFEB links mTORC1 signaling to transcriptional control of lysosome homeostasis. Sci Signal. 2012;5:ra42. doi:10.1126/scisignal.2002790</a></li><li><a href="https://doi.org/10.1038/s41467-021-24499-6">Alesi N. et al. TSC2 regulates lysosome biogenesis via a non-canonical RAGC and TFEB-dependent mechanism. Nat Commun. 2021;12:4245. doi:10.1038/s41467-021-24499-6</a></li><li><a href="https://doi.org/10.1038/s41467-018-05862-6">Napolitano G., Esposito A., Choi H. et al. mTOR-dependent phosphorylation controls TFEB nuclear export. Nat Commun. 2018;9:3312. doi:10.1038/s41467-018-05862-6</a></li><li><a href="https://doi.org/10.1038/s41467-018-04849-7">Li L., Friedrichsen H. J., Andrews S. et al. A TFEB nuclear export signal integrates amino acid supply and glucose availability. Nat Commun. 2018;9:2685. doi:10.1038/s41467-018-04849-7</a></li><li><a href="https://doi.org/10.1038/ncb3114">Medina D. L., Di Paola S., Peluso I. et al. Lysosomal calcium signalling regulates autophagy through calcineurin and TFEB. Nat Cell Biol. 2015;17:288–299. doi:10.1038/ncb3114</a></li><li><a href="https://doi.org/10.1038/s41594-020-0490-9">Fromm S. A., Lawrence R. E., Hurley J. H. Structural mechanism for amino acid-dependent Rag GTPase nucleotide state switching by SLC38A9. Nat Struct Mol Biol. 2020;27:1017–1023. doi:10.1038/s41594-020-0490-9</a></li></ul><p>Основная схема сопоставима с механизмом Napolitano 2020; она не описывает любой срок утраты TSC2 и любую клетку. S211 относится к TFEB человека; этот номер не переносить на TFE3. Динамика экспорта и удержания TFEB описана в культивируемых клетках человека (HeLa, HEK293, HT29, MCF-7); вклад киназ и фосфатаз зависит от условий, а участки S142, S138 и S211 относятся к TFEB человека.</p></details></article><article class="card print-unit" id="ns-inhibitors"><div class="eyebrow">mTORC1 и сигналы · шаг 7 из 32</div><h2>Чем различаются рапамицин и Torin1</h2><p class="lead">Рапамицин и Torin1 подавляют mTOR разными молекулярными способами. Снижение фосфорилирования одного субстрата не показывает степень подавления всех функций комплекса.</p><div class="note"><strong>Что показывает схема.</strong> FKBP12–рапамицин связывается с FRB-областью mTOR и ограничивает доступ части субстратов к активному центру; Torin1 конкурирует с ATP в киназном домене. При остром действии рапамицина сильно снижается фосфорилирование S6K1 T389, а фосфорилирование 4E-BP1 T37/46, ULK1 S758 и TFEB S211 во многом сохраняется; Torin1 снижает все эти показатели и подавляет также mTORC2 (AKT S473).</div><ol class="mech"><li>Комплекс <a href="#ns-g-S7-T29">FKBP12–рапамицин</a> связывается с FRB-областью mTOR.</li><li><a href="#ns-g-S7-T28">Torin1</a> взаимодействует с ATP-связывающим участком киназы mTOR.</li><li>Чувствительность результата зависит от субстрата, модифицируемого участка и режима воздействия.</li></ol><p><a href="#ns-g-S7-T27">Рапамицин</a> действует не сам по себе: в клетке он связывается с небольшим белком FKBP12, и уже комплекс FKBP12–рапамицин связывается с FRB-областью mTOR. FRB-область расположена рядом с входом в активный центр киназы. Связавшийся комплекс ограничивает доступ части субстратов к активному центру, но не конкурирует с ATP за его участок связывания (Yang и соавт., 2013). Torin1 устроен иначе: это ATP-конкурентный ингибитор, который занимает ATP-связывающий участок киназного домена mTOR и тем самым подавляет каталитическую реакцию.</p><p>Из различия механизмов следует различие эффектов. Фосфорилирование S6K1 по T389 чувствительно к острому действию рапамицина. Фосфорилирование 4E-BP1 по T37/46, ULK1 по S758 (у человека) и TFEB по S211 (у человека) при остром действии рапамицина во многом сохраняется, тогда как Torin1 снижает фосфорилирование всех этих участков (для 4E-BP1 и ULK1 — Thoreen и соавт., 2009; Kang и соавт., 2013). Для TFEB Roczniak-Ferguson и соавт. (2012) показали, что рапамицин почти не меняет его локализацию, а Torin1 снижает фосфорилирование S211 и вызывает перемещение TFEB в ядро. Устойчивость относится к определённому участку, а не ко всему белку: у 4E-BP1 есть участки, фосфорилирование которых снижается рапамицином сильнее. Kang и соавт. (2013) связали различия с тем, насколько эффективно mTORC1 фосфорилирует данный участок.</p><p>Препараты различаются и по действию на комплексы. Torin1 подавляет киназу mTOR в составе обоих комплексов, mTORC1 и mTORC2. Острое действие рапамицина направлено прежде всего на mTORC1, но при длительном воздействии во многих типах клеток рапамицин нарушает и сборку mTORC2 (Sarbassov и соавт., 2006). Поэтому сравнение «рапамицин против Torin1» без указания срока, клеток и измеряемого участка неинформативно.</p><p>Из этого следуют требования к эксперименту. Для каждого субстрата измеряют фосфорилирование конкретного участка вместе с общим содержанием того же белка и белком контроля нанесения, по которому проверяют, что во все дорожки нанесено одинаковое количество белка. Дозы и сроки из разных работ не объединяются в один условный эксперимент. На схеме шага приведено только качественное сравнение механизмов при остром воздействии; это не рекомендации по применению препаратов.</p><div class="note trap"><strong>Типичная ошибка</strong> Рапамицин — ATP-конкурентный ингибитор, одинаково выключающий все мишени mTORC1.<p class="trap-fix">Рапамицин действует через FKBP12 и FRB; разные субстраты и участки имеют разную чувствительность.</p></div><div class="static-quiz"><h3>После острого действия рапамицина p-S6K1 снизился, но часть фосфорилирования других субстратов сохранилась. Как это объяснить?</h3><ol><li><b>А.</b> Разные субстраты и фосфосайты неодинаково чувствительны к рапамицину. <i>(верный вариант)</i><br><span class="expl">Рапамицин частично ограничивает функции mTORC1; чувствительность зависит от конкретного взаимодействия и участка.</span></li><li><b>Б.</b> Снижение p-S6K1 означает обязательное исчезновение любого фосфорилирования. <i>(неверный вариант)</i><br><span class="expl">Один показатель нельзя распространить на все реакции разных субстратов.</span></li><li><b>В.</b> Сохранение другого фосфосайта означает, что препарат вовсе не действовал. <i>(неверный вариант)</i><br><span class="expl">Препарат может действовать на одну ветвь, оставляя другую относительно устойчивой.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1126/science.1236566">Kang S. A. et al. mTORC1 phosphorylation sites encode their sensitivity to starvation and rapamycin. Science. 2013;341:1236566. doi:10.1126/science.1236566</a></li><li><a href="https://doi.org/10.1038/nature12122">Yang H. et al. mTOR kinase structure, mechanism and regulation. Nature. 2013;497:217–223. doi:10.1038/nature12122</a></li><li><a href="https://doi.org/10.1074/jbc.M900301200">Thoreen C. C. et al. An ATP-competitive mTOR inhibitor reveals rapamycin-resistant functions of mTORC1. J Biol Chem. 2009;284:8023–8032. doi:10.1074/jbc.M900301200</a></li><li><a href="https://doi.org/10.1126/scisignal.2002790">Roczniak-Ferguson A. et al. The transcription factor TFEB links mTORC1 signaling to transcriptional control of lysosome homeostasis. Sci Signal. 2012;5:ra42. doi:10.1126/scisignal.2002790</a></li><li><a href="https://doi.org/10.1016/j.molcel.2006.03.029">Sarbassov D. D. et al. Prolonged rapamycin treatment inhibits mTORC2 assembly and Akt/PKB. Mol Cell. 2006;22:159–168. doi:10.1016/j.molcel.2006.03.029</a></li></ul><p>Для экспериментальных чисел потребуются дозы, клетки, срок и конкретный сайт исходной работы. Здесь только качественное сравнение механизмов; не рекомендации применения препаратов.</p></details></article><article class="card print-unit" id="ns-mtor-evidence"><div class="eyebrow">mTORC1 и сигналы · шаг 8 из 32</div><h2>Какие измерения различают локализацию, фосфорилирование и функцию</h2><p class="lead">Микроскопия, иммуноблоттинг и измерение синтеза белка отвечают на разные вопросы. Генетическое вмешательство проверяет зависимость результата от конкретного компонента.</p><div class="note"><strong>Что показывает схема.</strong> Три карточки: микроскопия (положение mTOR относительно LAMP1), иммуноблоттинг (p-S6K1 T389 относительно общего S6K1 и контроля нанесения), измерение синтеза белка по включению метки. Для каждой указано, что измеряют, какой нужен контроль и чего метод сам не показывает.</div><ol class="mech"><li><a href="#ns-g-S7-T26">Колокализация</a> mTOR с <a href="#ns-g-S7-T31">LAMP1</a> показывает совпадение сигналов в пределах разрешения метода.</li><li>Фосфоспецифическое антитело измеряет выбранную модификацию субстрата.</li><li>Функциональный результат проверяют отдельным методом и с подходящими контролями.</li></ol><p>Пусть клетки сначала держат в среде без аминокислот, а затем добавляют аминокислоты; в другой серии меняют ростовой сигнал. Чтобы описать ответ mTORC1, нужны по меньшей мере два показателя, измеренные в сопоставимых образцах одной экспериментальной серии за одинаковый срок воздействия: положение mTOR относительно лизосом и фосфорилирование субстрата. Эти показатели отвечают на разные вопросы и получаются разными методами: для микроскопии клетки фиксируют, а для иммуноблоттинга лизируют, поэтому образцы для двух методов готовят параллельно.</p><p>Положение mTOR определяют иммунофлуоресцентной микроскопией. Лизосомы отмечают антителом к LAMP1 — белку лизосомной мембраны, который служит маркером этих органелл. Колокализацией называют совпадение сигналов двух меток в одних и тех же участках изображения. Совпадение ограничено разрешением светового микроскопа (порядка сотен нанометров), поэтому оно показывает распределение mTOR относительно LAMP1-положительных структур, но не доказывает прямого связывания mTOR с LAMP1 и ничего не говорит о киназной активности.</p><p>Фосфорилирование измеряют <a href="#ns-g-S7-T30">иммуноблоттингом</a>: белки пробы разделяют электрофорезом, переносят на мембрану и выявляют антителами. Антитело к S6K1, фосфорилированной по T389, выявляет только модифицированную форму; рядом измеряют общее содержание S6K1 и белок контроля нанесения, по которому проверяют, что во все дорожки нанесено одинаковое количество белка. Без этих контролей рост сигнала p-S6K1 нельзя отличить от роста количества самой S6K1. Синтез белка — третий, функциональный показатель; его измеряют отдельно, например по включению меченой аминокислоты.</p><p>Генетические вмешательства проверяют, от какого компонента зависит ответ. Утрата Rag или Ragulator нарушает аминокислотную регуляцию локализации, изменение RHEB затрагивает активацию, а возвращение исходного белка в клетки, лишённые этого белка, проверяет специфичность эффекта. При удалении аминокислот Rag-ГТФазы привлекают к лизосоме и TSC2, который там может переводить RHEB в GDP-форму; в клетках без TSC2 (эксперименты на клетках HeLa) mTORC1 при удалении аминокислот не полностью освобождается от лизосомы и не полностью инактивируется (Demetriades и соавт., 2014). Остаточные значения у разных генотипов различаются и измеряются, а не принимаются одинаковыми. Отдельная регуляторная ветвь — отрицательная обратная связь: S6K1 фосфорилирует IRS1 (белок-адаптер инсулинового рецептора) и ослабляет инсулиновый сигнал. В культивируемых клетках S6K1 фосфорилирует и RICTOR — субъединицу mTORC2 — по Thr1135. Сборка и киназная активность mTORC2 при этом не менялись, но в клетках с заменой Thr1135 на аланин фосфорилирование AKT, зависящее от mTORC2, было выше (Julien и соавт., 2010). Это частная обратная связь, а не доказательство общей инактивации mTORC2. С нарушениями TSC и субъединиц GATOR1 связаны определённые наследственные заболевания (туберозный склероз; некоторые формы фокальной эпилепсии при вариантах гена DEPDC5, кодирующего субъединицу GATOR1), однако изменённую регуляцию mTORC1 нельзя считать универсальным объяснением возникновения опухолей.</p><div class="note trap"><strong>Типичная ошибка</strong> Колокализация двух белков доказывает их прямое связывание и активность.<p class="trap-fix">Совпадение сигналов ограничено разрешением микроскопии; прямое взаимодействие и киназное действие требуют других измерений.</p></div><div class="static-quiz"><h3>После добавления аминокислот увеличилась колокализация mTOR и LAMP1. Какой вывод непосредственно поддерживает это наблюдение?</h3><ol><li><b>А.</b> Установлено усиление синтеза белка без дополнительных измерений. <i>(неверный вариант)</i><br><span class="expl">По положению комплекса нельзя количественно установить скорость синтеза белка.</span></li><li><b>Б.</b> Изменилось распределение mTOR относительно LAMP1-положительных структур. <i>(верный вариант)</i><br><span class="expl">Микроскопия показывает распределение сигналов; дальнейшие свойства требуют независимой проверки.</span></li><li><b>В.</b> Установлено прямое связывание всех молекул mTOR с белком LAMP1. <i>(неверный вариант)</i><br><span class="expl">Колокализация не определяет прямой молекулярный контакт с LAMP1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-7.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1038/s41586-025-09545-3">Cui Z., Esposito A., Napolitano G., Ballabio A., Hurley J. H. Structural basis for mTORC1 activation on the lysosomal membrane. Nature. 2025;647:536–543. doi:10.1038/s41586-025-09545-3</a></li><li><a href="https://doi.org/10.1016/j.cell.2014.01.024">Demetriades C., Doumpas N., Teleman A. A. Regulation of TORC1 in response to amino acid starvation via lysosomal recruitment of TSC2. Cell. 2014;156:786–799. doi:10.1016/j.cell.2014.01.024</a></li><li><a href="https://doi.org/10.1128/MCB.00601-09">Julien L.-A. et al. mTORC1-activated S6K1 phosphorylates Rictor on threonine 1135 and regulates mTORC2 signaling. Mol Cell Biol. 2010;30:908–921. doi:10.1128/MCB.00601-09</a></li></ul><p>Никакие реальные микрофотографии и численные значения нового эксперимента не создаются. Схематические карточки методов явно обозначены как учебные.</p></details></article><article class="card print-unit" id="ns-adenylates"><div class="eyebrow">AMPK и энергетическое состояние · шаг 9 из 32</div><h2>Что показывают ATP, ADP, AMP и энергетический заряд</h2><p class="lead">ATP, ADP и AMP образуют аденилатный пул, состояние которого меняется при образовании и расходовании ATP. Энергетический заряд — расчётная характеристика этого пула, а не отдельная молекула.</p><div class="note"><strong>Что показывает схема.</strong> Режим «Рассчитать заряд»: по концентрациям ATP, ADP и AMP рассчитывается E = (ATP + 0,5·ADP) / (ATP + ADP + AMP); для 8:1:1 E = 0,85; при нулевой сумме заряд не определяется. Режим «Условное равновесие»: пул равен 1, при K = a·m/d² = 1 доли рассчитываются по доле ATP; при a = 0,98 доля AMP около 0,0004, при a = 0,90 — около 0,009, заряд 0,99 и 0,95.</div><ol class="mech"><li>При гидролизе ATP образуется ADP; его содержание возрастает, если образование ADP превышает расходование в других реакциях.</li><li><a href="#ns-g-S7-T34">Аденилаткиназа</a> катализирует обратимую реакцию 2 ADP ⇌ ATP + AMP.</li><li>Заряд рассчитывают как ([ATP] + 0,5[ADP]) / ([ATP] + [ADP] + [AMP]).</li></ol><p>ATP, ADP и AMP клетки вместе образуют <a href="#ns-g-S7-T33">аденилатный пул</a>. Для его описания используют три разные величины. Содержание — количество нуклеотида в клетке или пробе. Концентрация — количество в единице объёма. Доля — концентрация нуклеотида, делённая на сумму концентраций всех трёх. Формулы этого шага используют концентрации, выраженные в одинаковых единицах, или доли.</p><p>При работе ионных насосов, синтезе белков и других процессах ATP гидролизуется до ADP и фосфата. Пока окислительное фосфорилирование и гликолиз восполняют ATP, доля ADP меняется мало. Если образование ATP отстаёт от расходования, доля ADP возрастает. Аденилаткиназа катализирует обратимую реакцию 2 ADP ⇌ ATP + AMP. При высоком отношении ATP к ADP, характерном для энергетически полноценной клетки, равновесие этой реакции сдвинуто влево, и содержание AMP остаётся очень низким. При росте отношения ADP к ATP реакция идёт слева направо (2 ADP → ATP + AMP), и отношение AMP к ATP растёт ещё сильнее (Steinberg, Hardie, 2023). В этом направлении аденилаткиназа образует ATP и AMP из двух ADP, а не расходует ATP.</p><p>Поскольку исходная доля AMP мала, даже небольшое абсолютное прибавление AMP даёт большое относительное изменение. Насколько большое, зависит от исходного состава пула, от того, насколько реакция близка к равновесию, и от условий измерения. Поэтому единого для всех клеток процента прироста AMP при небольшом снижении ATP не существует.</p><p><a href="#ns-g-S7-T35">Энергетический заряд</a> — расчётная характеристика пула: E = ([ATP] + 0,5·[ADP]) / ([ATP] + [ADP] + [AMP]). ADP входит с весом 0,5, поскольку в ADP одна фосфоангидридная связь, а в ATP — две. Заряд принимает значения от 0 (весь пул — AMP) до 1 (весь пул — ATP). Для смеси 8:1:1 заряд равен (8 + 0,5) / 10 = 0,85. AMPK (AMP-активируемая протеинкиназа, следующий шаг) не вычисляет эту формулу: киназа связывает отдельные нуклеотиды, а заряд — сводная величина, удобная исследователю.</p><p>Во втором режиме схемы задана учебная модель: суммарный пул равен 1, реакция аденилаткиназы находится в условном равновесии с K = a·m/d² = 1 (a, d и m — доли ATP, ADP и AMP). Это допущение модели, а не физиологическая константа свободных нуклеотидов. В такой модели снижение доли ATP с 0,98 до 0,90 повышает долю AMP примерно в 23 раза, а заряд снижается лишь с 0,99 до 0,95. Пример 8:1:1 из первого режима — отдельная задача, к которой условие равновесия не применяется.</p><div class="note trap"><strong>Типичная ошибка</strong> Небольшое снижение ATP всегда даёт один и тот же процент увеличения AMP.<p class="trap-fix">Относительное изменение AMP зависит от исходного состава пула, равновесия реакции и условий измерения.</p></div><div class="static-quiz"><h3>В условной смеси концентрации ATP, ADP и AMP равны соответственно 8, 1 и 1 в одинаковых единицах. Чему равен аденилатный энергетический заряд?</h3><ol><li><b>А.</b> 0,80: учитывается только доля ATP в общем пуле. <i>(неверный вариант)</i><br><span class="expl">Значение 0,80 — доля ATP; формула заряда дополнительно учитывает ADP с коэффициентом 0,5.</span></li><li><b>Б.</b> 0,90: ATP и ADP имеют одинаковый вес в расчёте. <i>(неверный вариант)</i><br><span class="expl">Значение 0,90 получилось бы при полном весе ADP, но в определении заряда его вес равен 0,5.</span></li><li><b>В.</b> 0,85: учитываются ATP и половина концентрации ADP. <i>(верный вариант)</i><br><span class="expl">Заряд равен (8 + 0,5 × 1) / (8 + 1 + 1) = 0,85. Это отдельная расчётная задача без требования равновесия аденилаткиназы.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li></ul><p>Числа 8:1:1 — явно заданные учебные концентрации. Модель равновесия — другая задача с условным K=1 и постоянным пулом; не выдавать её за измерение в конкретных клетках.</p></details></article><article class="card print-unit" id="ns-ampk-nucleotides"><div class="eyebrow">AMPK и энергетическое состояние · шаг 10 из 32</div><h2>Как нуклеотиды регулируют комплекс AMPK</h2><p class="lead">AMPK содержит каталитическую α-субъединицу и регуляторные β- и γ-субъединицы. Связывание нуклеотида и фосфорилирование активационной петли — разные способы изменения активности.</p><div class="note"><strong>Что показывает схема.</strong> Гетеротример AMPK: α (киназный домен и петля с Thr172), β, γ (регуляторный участок). AMP в регуляторном участке аллостерически активирует фосфорилированный комплекс, способствует фосфорилированию Thr172 киназой LKB1 и защищает его от фосфатаз; ADP способствует фосфорилированию и защищает петлю, но аллостерически не активирует; ATP противодействует этим эффектам.</div><ol class="mech"><li>AMP и ATP конкурируют в части регуляторных участков γ-субъединицы.</li><li>AMP способствует <a href="#ns-g-S7-T37">аллостерической</a> активации и сохранению фосфорилирования <a href="#ns-g-S7-T39">активационной петли</a>.</li><li>ADP может защищать фосфорилированную петлю, но не воспроизводит все эффекты AMP.</li></ol><p><a href="#ns-g-S7-T36">AMPK</a> (AMP-активируемая протеинкиназа) — гетеротример из трёх субъединиц. α-Субъединица содержит киназный домен с активационной петлёй — участком, конформация которого определяет связывание субстрата и катализ. β-Субъединица связывает α и γ; в ней находится углеводсвязывающий модуль, участвующий в связывании с гликогеном. γ-Субъединица содержит четыре повтора CBS (участки, названные по ферменту цистатионин-β-синтазе, в котором их впервые описали), которые образуют четыре потенциальных участка связывания нуклеотидов. Эти участки неравноценны: один, по-видимому, не используется, два связывают нуклеотиды постоянно, а регуляторным участком, где AMP, ADP и ATP обмениваются, служит один (Steinberg, Hardie, 2023).</p><p>Связывание AMP с γ-субъединицей действует тремя способами. Во-первых, AMP аллостерически повышает активность уже фосфорилированного комплекса. Аллостерической называют регуляцию, при которой лиганд связывается не в активном центре, а в другом участке и меняет конформацию и активность белка. Во-вторых, AMP способствует фосфорилированию Thr172 в активационной петле. В-третьих, AMP защищает фосфорилированный Thr172 от дефосфорилирования фосфатазами. ATP конкурирует с AMP за регуляторный участок и противодействует этим эффектам. ADP, связываясь с тем же участком, тоже способствует фосфорилированию Thr172 и защищает его от дефосфорилирования, но аллостерической активации, как AMP, не вызывает (Xiao и соавт., 2011; Smith и соавт., 2026).</p><p>Thr172 фосфорилируется вышестоящей киназой <a href="#ns-g-S7-T38">LKB1</a>, которая работает в комплексе с белками STRAD и MO25. Этот комплекс, по-видимому, постоянно активен и не регулируется нуклеотидами напрямую. Чувствительность к AMP обеспечивает γ-субъединица AMPK, а не LKB1: LKB1 переносит фосфорильную группу с ATP, а AMP меняет доступность Thr172 и устойчивость модификации. Защита петли не делает активацию необратимой: когда содержание ATP восстанавливается и AMP вытесняется из регуляторного участка, фосфатазы дефосфорилируют Thr172.</p><p>Номер участка зависит от изоформы и вида. Thr172 — номер в AMPKα2 человека; в AMPKα1 человека соответствующий треонин имеет номер Thr183. Антитела и подписи «p-AMPK Thr172» в лабораторной практике обычно относятся к этому участку обеих изоформ, поэтому в описании эксперимента указывают изоформу и вид. Влияние нуклеотидов зависит также от состава комплекса: у млекопитающих есть по нескольку изоформ каждой субъединицы.</p><div class="note trap"><strong>Типичная ошибка</strong> AMP — донор фосфорильной группы для активации AMPK.<p class="trap-fix">AMP действует как регуляторный лиганд. Фосфорильную группу в киназной реакции переносит вышестоящая киназа с ATP.</p></div><div class="static-quiz"><h3>AMP связывается с регуляторным участком AMPK при сохранённом фосфорилировании активационной петли. Почему активность может возрасти?</h3><ol><li><b>А.</b> Связывание AMP аллостерически меняет активность комплекса. <i>(верный вариант)</i><br><span class="expl">Регуляторный лиганд меняет каталитическую активность через изменение состояния комплекса.</span></li><li><b>Б.</b> AMP служит донором фосфорильной группы для α-субъединицы. <i>(неверный вариант)</i><br><span class="expl">Здесь AMP является регуляторным лигандом, а не донором группы для фосфорилирования AMPK.</span></li><li><b>В.</b> При неизменном фосфорилировании связывание AMP не может менять активность. <i>(неверный вариант)</i><br><span class="expl">Аллостерическая регуляция позволяет изменить активность при сохранённой модификации петли.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/nature09932">Xiao B. et al. Structure of mammalian AMPK and its regulation by ADP. Nature. 2011;472:230–233. doi:10.1038/nature09932</a></li></ul><p>Нумерация Thr172 задана для α2 человека; другие паралоги не получают этот номер автоматически. Влияние нуклеотидов зависит от состава комплекса; схема качественная.</p></details></article><article class="card print-unit" id="ns-ampk-targets"><div class="eyebrow">AMPK и энергетическое состояние · шаг 11 из 32</div><h2>Как AMPK меняет регуляцию синтеза и окисления</h2><p class="lead">Действие AMPK определяется её субстратами. Результат фосфорилирования нужно описывать отдельно для TSC2, RAPTOR и ACC.</p><div class="note"><strong>Что показывает схема.</strong> AMPK фосфорилирует три белка: TSC2 (GAP-действие на RHEB усиливается), RAPTOR (связывание 14-3-3, mTORC1 подавляется даже без TSC2) и ACC (активность и образование малонил-CoA снижаются). Направление действия на TSC2 противоположно действию AKT.</div><ol class="mech"><li>AMPK воздействует на <a href="#ns-g-S7-T16">TSC2</a> и <a href="#ns-g-S7-T03">RAPTOR</a>, ограничивая часть сигналов mTORC1.</li><li>AMPK фосфорилирует <a href="#ns-g-S7-T55">ACC</a> и снижает образование <a href="#ns-g-S7-T57">малонил-CoA</a>.</li><li>Снижение малонил-CoA может ослабить ингибирование CPT1 при сохранённых остальных условиях окисления.</li></ol><p>Действие AMPK определяется тем, какие белки она фосфорилирует и как модификация меняет каждый из них. С сигналом mTORC1 AMPK связана двумя путями. Фосфорилирование TSC2 под действием AMPK усиливает GAP-действие комплекса TSC: RHEB переходит в GDP-форму. Фосфорилирование RAPTOR под действием AMPK создаёт участки связывания белков 14-3-3 и подавляет mTORC1 даже в клетках без TSC2 (Gwinn и соавт., 2008, по обзору Smith и соавт., 2026). Направление действия на TSC2 противоположно действию AKT: AKT ослабляет TSC, а AMPK его усиливает. Поэтому направление действия фосфорилирования указывают для каждого белка отдельно. Встречается и обратная связь от пути mTORC1 к AMPK: в гипоталамусе мыши киназа S6K1 (p70S6K) фосфорилировала α2-субъединицу AMPK по Ser491, и это фосфорилирование снижало активность AMPK; оно было необходимо для того, чтобы гормон лептин снижал активность α2-AMPK в гипоталамусе и потребление пищи (Dagon и соавт., 2012). Из этого примера не следует общее правило взаимного торможения двух путей во всех клетках.</p><p>Третья мишень — ацетил-CoA-карбоксилаза (ACC), фермент, образующий малонил-CoA. Фосфорилирование ACC под действием AMPK снижает активность фермента и образование малонил-CoA. Малонил-CoA служит субстратом синтеза жирных кислот и ингибитором CPT1 — фермента, с которого начинается перенос длинноцепочечных ацильных групп в митохондрии. Подробно эта связь разобрана в разделе 3. Снижение активности ACC ещё не равно усилению <a href="#ns-g-S7-T40">метаболического потока</a> β-окисления: поток — количество вещества, проходящее через путь за единицу времени, — зависит и от других звеньев.</p><p>Ответы AMPK различаются по времени. Быстрые ответы — изменения активности уже имеющихся ферментов за минуты. Так, AMPK фосфорилирует ACC, а также <a href="#ns-g-S7-T97">HMGCR</a> (ГМГ-CoA-редуктазу) — фермент, ограничивающий скорость синтеза холестерина, — и снижает активность обоих ферментов. В скелетной мышце AMPK способствует перемещению переносчика глюкозы GLUT4 на плазматическую мембрану; GLUT4 — переносчик глюкозы, содержание которого на мембране регулируется в определённых тканях, включая скелетную мышцу и жировую ткань. В определённых клетках AMPK фосфорилирует отдельные изоформы семейства PFKFB (в обзоре Steinberg, Hardie, 2023 среди мишеней AMPK названы PFKFB2 и PFKFB3); ферменты PFKFB образуют и гидролизуют фруктозо-2,6-бисфосфат — регулятор гликолиза. Эти эффекты зависят от ткани и изоформы и не переносятся одинаково на печень и мышцу. Медленные ответы — изменения экспрессии генов за часы — рассмотрены в шаге об адаптации.</p><p>Само фосфорилирование ферментов не образует ATP. AMPK снижает скорость процессов, расходующих ATP (синтез жирных кислот, холестерина и белков), и способствует процессам, обеспечивающим образование ATP: поступлению глюкозы в мышечную клетку и окислению жирных кислот. AMPK при этом не прекращает весь синтез веществ в клетке, а ответы разных тканей различаются.</p><div class="note trap"><strong>Типичная ошибка</strong> AMPK ингибирует TSC2 и активирует RAPTOR так же, как ростовой сигнал.<p class="trap-fix">В рассматриваемой ветви AMPK ограничивает mTORC1 через TSC2 и RAPTOR, а направление действия отличается от ростового сигнала AKT.</p></div><div class="static-quiz"><h3>В основной модели AMPK фосфорилирует ACC по ингибирующему участку. Какое ближайшее изменение связано с этой реакцией?</h3><ol><li><b>А.</b> Активность ACC не меняется: AMPK регулирует только экспрессию её гена. <i>(неверный вариант)</i><br><span class="expl">Указана быстрая модификация фермента; её действие нельзя свести к изменению экспрессии гена.</span></li><li><b>Б.</b> Снижается активность ACC и образование малонил-CoA. <i>(верный вариант)</i><br><span class="expl">Ингибирующее фосфорилирование ACC уменьшает образование малонил-CoA; дальнейший поток проверяют отдельно.</span></li><li><b>В.</b> Возрастает активность ACC и образование малонил-CoA. <i>(неверный вариант)</i><br><span class="expl">Для указанного ингибирующего участка направление действия противоположно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/nm.3372">Fullerton M. D. et al. Single phosphorylation sites in Acc1 and Acc2 regulate lipid homeostasis and the insulin-sensitizing effects of metformin. Nat Med. 2013;19:1649–1654. doi:10.1038/nm.3372</a></li><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1016/j.cmet.2012.05.010">Dagon Y. et al. p70S6 kinase phosphorylates AMPK on serine 491 to mediate leptin&#x27;s effect on food intake. Cell Metab. 2012;16:104–112. doi:10.1016/j.cmet.2012.05.010</a></li></ul><p>Речь об ингибирующих AMPK-зависимых модификациях ACC и выбранных регуляторных связях; другие участки фосфорилирования и тканевые ответы рассматриваются отдельно.</p></details></article><article class="card print-unit" id="ns-glucose-sensing"><div class="eyebrow">AMPK и энергетическое состояние · шаг 12 из 32</div><h2>Как AMPK отвечает на снижение глюкозы без обязательного изменения AMP</h2><p class="lead">В некоторых клетках AMPK активируется при снижении глюкозы без обнаружимого изменения соотношений аденилатов. Такой ответ связан с альдолазой и лизосомной организацией регуляторного комплекса.</p><div class="note"><strong>Что показывает схема.</strong> Глюкоза → гликолиз → FBP, связанный с альдолазой. При удалении глюкозы альдолаза не занята FBP, через каналы TRPV эндоплазматического ретикулума и V-ATPase способствует сборке комплекса AXIN–LKB1 у лизосомы (локальный выход Ca²⁺ снижается); LKB1 фосфорилирует AMPK. В исследованных клетках это происходило без обнаружимого изменения отношений AMP/ATP и ADP/ATP.</div><ol class="mech"><li>Снижение глюкозы может уменьшать содержание фруктозо-1,6-бисфосфата.</li><li>Меняется занятость <a href="#ns-g-S7-T41">альдолазы</a> этим метаболитом; через каналы TRPV эндоплазматического ретикулума и V-ATPase это ведёт к сборке комплекса с <a href="#ns-g-S7-T43">AXIN</a> и LKB1 у лизосомы.</li><li>В выбранных условиях активация AMPK не требует предварительного роста AMP/ATP.</li></ol><p><a href="#ns-g-S7-T42">Фруктозо-1,6-бисфосфат</a> (FBP) — промежуточный метаболит гликолиза, субстрат альдолазы. Альдолаза расщепляет FBP на две триозы. Фруктозо-1,6-бисфосфат не следует путать с фруктозо-2,6-бисфосфатом — регуляторным метаболитом, который образуют ферменты PFKFB и который не входит в последовательность реакций гликолиза. При удалении глюкозы из среды гликолиз замедляется, и содержание FBP в клетке снижается.</p><p>Zhang и соавт. (2017) описали путь, в котором сигналом служит не сам AMP, а занятость альдолазы. Альдолаза, не связанная с FBP, передаёт сигнал на лизосому в несколько этапов. Сначала она взаимодействует с каналами TRPV эндоплазматического ретикулума (ЭПР) и ограничивает их активность, поэтому на контактах ЭПР с лизосомой локальный выход Ca²⁺ из ЭПР уменьшается (Li и соавт., 2019). При низком локальном Ca²⁺ ингибированный TRPV оказывается доступен для связывания с <a href="#ns-g-S7-T44">V-ATPase</a> — протонным насосом лизосомной мембраны. Это меняет конфигурацию V-ATPase, и к комплексу V-ATPase–Ragulator привлекаются каркасный белок AXIN и киназа LKB1. Так LKB1 оказывается рядом с AMPK, часть которой находится у лизосомы, и фосфорилирует её Thr172. Альдолаза, TRPV, V-ATPase, Ragulator и AXIN — участники описанного пути, а не универсальные датчики любого стресса. Общая концентрация Ca²⁺ в цитозоле при удалении глюкозы не меняется, и CaMKK2 для этого механизма не требуется (обзор Steinberg, Hardie, 2023).</p><p>Этот путь отличается от канонического и от кальциевого пути активации AMPK через Ca²⁺–кальмодулин–CaMKK2 (следующий шаг): там активацию вызывает повышение концентрации Ca²⁺ в цитозоле, а здесь — снижение локального выхода Ca²⁺ на контактах ЭПР с лизосомой. В каноническом пути AMP или ADP связываются с γ-субъединицей AMPK. В пути через альдолазу меняется сборка регуляторного комплекса на лизосоме. В исследованных клетках AMPK активировалась после удаления глюкозы, хотя отношения AMP/ATP и ADP/ATP в пределах измерения не менялись. Результат относится к этим клеткам и условиям; он не означает, что в любой ткани реакция на глюкозу совсем не зависит от аденилатов, а аденилатный вход к AMPK остаётся параллельным путём.</p><p>Поэтому вывод о причине активации требует нескольких независимых измерений: состояния аденилатного пула, фосфорилирования AMPK и её действия на субстрат, например на ACC. Утверждение «AMPK всегда включается раньше падения ATP» неверно: последовательность событий зависит от вида воздействия и измеряется в каждом эксперименте отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> Активация AMPK обязательно доказывает снижение ATP или увеличение AMP.<p class="trap-fix">Существуют дополнительные пути активации; состояние аденилатного пула нужно измерить самостоятельно.</p></div><div class="static-quiz"><h3>В исследованной системе после удаления глюкозы AMPK активировалась, а AMP/ATP и ADP/ATP не изменились в пределах измерения. Какой вывод допустим?</h3><ol><li><b>А.</b> AMPK не может быть активна, пока не уменьшится измеренное содержание ATP. <i>(неверный вариант)</i><br><span class="expl">Это отрицает результат и смешивает один канонический вход со всеми возможными входами.</span></li><li><b>Б.</b> Во всех клетках действие глюкозы полностью независимо от состояния аденилатов. <i>(неверный вариант)</i><br><span class="expl">Отдельная система не устанавливает универсальную независимость от нуклеотидов.</span></li><li><b>В.</b> В этой системе возможен путь активации без обнаружимого изменения аденилатов. <i>(верный вариант)</i><br><span class="expl">Наблюдение согласуется с дополнительным метаболит-зависимым механизмом, описанным для определённых клеток.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature23275">Zhang C.-S. et al. Fructose-1,6-bisphosphate and aldolase mediate glucose sensing by AMPK. Nature. 2017;548:112–116. doi:10.1038/nature23275</a></li><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1016/j.cmet.2019.05.018">Li M., Zhang C.-
