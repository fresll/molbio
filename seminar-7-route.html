S., Zong Y. et al. Transient receptor potential V channels are essential for glucose sensing by aldolase and AMPK. Cell Metab. 2019;30:508–524.e12. doi:10.1016/j.cmet.2019.05.018</a></li></ul><p>Качественная иллюстрация механизма Zhang 2017; звено TRPV описано по Li и соавт. (2019) в клетках человека и мыши и у нематоды, универсальность для всех тканей не установлена; без переноса конкретной клеточной линии, срока или дозы из другой работы. «Не изменилось» означает пределы выбранного измерения.</p></details></article><article class="card print-unit" id="ns-calcium-ampk"><div class="eyebrow">AMPK и энергетическое состояние · шаг 13 из 32</div><h2>Как Ca²⁺ и CaMKK2 создают другой вход к AMPK</h2><p class="lead">В подходящем клеточном контексте повышение Ca²⁺ может активировать AMPK через CaMKK2. Этот путь не требует, чтобы каждое повышение активности AMPK предварялось энергетическим дефицитом.</p><div class="note"><strong>Что показывает схема.</strong> Две ветви к Thr172 AMPK: LKB1 (её действие усиливается при связывании AMP или ADP с γ-субъединицей) и Ca²⁺ → кальмодулин → CaMKK2. При неизменных аденилатах и повышенном Ca²⁺ AMPK фосфорилируется через CaMKK2, в том числе в клетках без LKB1; без функциональной CaMKK2 этот вход отсутствует.</div><ol class="mech"><li>Ca²⁺ связывается с <a href="#ns-g-S7-T46">кальмодулином</a>.</li><li>Кальмодулин регулирует <a href="#ns-g-S7-T45">CaMKK2</a>, которая фосфорилирует активационную петлю AMPK.</li><li>Доступность CaMKK2 и состояние других регуляторов определяют ответ конкретной клетки.</li></ol><p>Кроме LKB1, Thr172 в AMPK фосфорилируется и киназой CaMKK2 (киназа кальмодулин-зависимых протеинкиназ, β-изоформа). Её активность регулируется ионами кальция не напрямую, а через кальмодулин — небольшой белок, который связывает Ca²⁺ и в связанном с Ca²⁺ виде связывается с другими белками и активирует их. Сам ион Ca²⁺ не является киназой и не переносит фосфорильную группу: он меняет состояние кальмодулина, а комплекс Ca²⁺–кальмодулин активирует CaMKK2.</p><p>Этот вход отличается от LKB1-зависимого по сигналу. LKB1, по-видимому, постоянно активна, и её действие на AMPK усиливается тогда, когда AMP или ADP связываются с γ-субъединицей. CaMKK2 активируется при повышении концентрации Ca²⁺ в цитозоле, например после действия гормонов, которые высвобождают Ca²⁺ из внутриклеточных депо. Поэтому активация AMPK через CaMKK2 возможна без предварительного энергетического дефицита и без роста отношения AMP к ATP (Hawley и соавт., 2005).</p><p>Выраженность этого пути зависит от ткани. CaMKK2 много в нейронах и некоторых других клетках, а в разных тканях её содержание различается. Поэтому нельзя приписывать CaMKK2 все ответы AMPK, например в сокращающейся скелетной мышце, где одновременно меняются и концентрация Ca²⁺, и состояние аденилатного пула. Вклад каждого входа проверяют отдельно.</p><p>Из сказанного следует, что генетическая утрата LKB1 не исключает активацию AMPK полностью. В клетках без LKB1, где CaMKK2 функциональна, повышение Ca²⁺ может усилить фосфорилирование Thr172. Чтобы показать роль CaMKK2, используют утрату или подавление CaMKK2 и измеряют аденилаты независимо, иначе нельзя отличить кальциевый вход от энергетического.</p><div class="note trap"><strong>Типичная ошибка</strong> В клетках без LKB1 AMPK не может активироваться ни при каких условиях.<p class="trap-fix">При наличии работающего CaMKK2-зависимого пути фосфорилирование AMPK возможно и без LKB1.</p></div><div class="static-quiz"><h3>В клетке отсутствует LKB1, но CaMKK2 функциональна. При сохранённых аденилатах повысили Ca²⁺. Какой ответ AMPK допускает эта схема?</h3><ol><li><b>А.</b> Фосфорилирование AMPK через CaMKK2 может усилиться. <i>(верный вариант)</i><br><span class="expl">CaMKK2 — альтернативная вышестоящая киназа в заданном клеточном контексте.</span></li><li><b>Б.</b> Фосфорилирование AMPK обязательно остаётся невозможным. <i>(неверный вариант)</i><br><span class="expl">Утрата одного входа не исключает действующего альтернативного входа.</span></li><li><b>В.</b> Ca²⁺ обязательно вытесняет AMP из γ-субъединицы и подавляет AMPK. <i>(неверный вариант)</i><br><span class="expl">В заданном пути Ca²⁺ действует через кальмодулин и CaMKK2; его не следует помещать вместо AMP в нуклеотидный участок.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1016/j.cmet.2005.05.009">Hawley S. A. et al. Calmodulin-dependent protein kinase kinase-β is an alternative upstream kinase for AMP-activated protein kinase. Cell Metab. 2005;2:9–19. doi:10.1016/j.cmet.2005.05.009</a></li></ul><p>Это условная клетка с функциональной CaMKK2; не универсальный ответ всех тканей на Ca²⁺. Энергетические показатели сохранены как условие сравнения.</p></details></article><article class="card print-unit" id="ns-ampk-adaptation"><div class="eyebrow">AMPK и энергетическое состояние · шаг 14 из 32</div><h2>Чем быстрые реакции AMPK отличаются от длительной адаптации</h2><p class="lead">AMPK может быстро изменять активность ферментов и позднее влиять на экспрессию генов. Увеличение ядерной доли TFEB не равно немедленному образованию новых лизосом и митохондрий.</p><div class="note"><strong>Что показывает схема.</strong> Панели: (1) за минуты AMPK фосфорилирует ACC и HMGCR, а также MFF (деление митохондрий); (2) фосфорилирование FNIP1 ослабляет фосфорилирование TFEB, TFEB перемещается в ядро, меняется РНК генов-мишеней; (3) синтезируются компоненты лизосом и митохондрий, участвуют PGC-1α и ERRα. Отдельная панель: у дрожжей и млекопитающих сохраняются родственные киназы TOR и AMPK/Snf1 и белки Atg, а входные сигналы различаются.</div><ol class="mech"><li>Фосфорилирование <a href="#ns-g-S7-T24">FNIP1</a> под действием AMPK меняет работу комплекса FLCN–FNIP1.</li><li>В описанном ответе <a href="#ns-g-S7-T07">TFEB</a> перемещается в ядро и влияет на экспрессию генов.</li><li><a href="#ns-g-S7-T49">Биогенез</a> органелл требует последующих изменений РНК, белков и мембран.</li></ol><p>Ответы AMPK развиваются на разных масштабах времени. Фосфорилирование ACC или HMGCR меняет активность уже имеющихся молекул фермента за минуты. Изменение экспрессии генов требует транскрипции, процессинга РНК и синтеза белков и проявляется позже, обычно через часы. Это качественная последовательность: точная длительность каждого этапа зависит от клеток, воздействия и измеряемого показателя.</p><p>Пример медленного ответа описали Malik и соавт. (2023) в клетках с повреждёнными митохондриями. AMPK фосфорилирует FNIP1 — партнёра FLCN, с которым он образует комплекс, переводящий RagC/D в GDP-форму. После фосфорилирования FNIP1 комплекс FLCN–FNIP1 хуже поддерживает фосфорилирование TFEB комплексом mTORC1, и TFEB перемещается в ядро. В ядре TFEB активирует экспрессию генов лизосомных белков, а также генов транскрипционного коактиватора <a href="#ns-g-S7-T47">PGC-1α</a> и транскрипционного фактора ERRα — ядерного рецептора, родственного рецептору эстрогенов. PGC-1α вместе с ERRα стимулирует экспрессию генов митохондриальных белков, необходимых для образования митохондрий. Перемещение TFEB в ядро — первый этап: биогенез лизосом и митохондрий требует новых РНК, белков и мембран и измеряется отдельно. AMPK действует и на другие транскрипционные факторы: она фосфорилировала FOXO3 человека по шести ранее неизвестным участкам; в клетках млекопитающих это фосфорилирование повышало транскрипционную активность FOXO3, не меняя его распределения между ядром и цитоплазмой (Greer и соавт., 2007). Активация FOXO3 сама по себе не означает усиления биогенеза митохондрий.</p><p>AMPK влияет на митохондрии и через другие мишени. Фосфорилирование <a href="#ns-g-S7-T48">MFF</a> — белка наружной митохондриальной мембраны, привлекающего белок деления DRP1, — способствует делению митохондрий. Деление, биогенез и митофагия — разные процессы. Деление меняет число и размер митохондрий, биогенез создаёт новые митохондриальные компоненты, митофагия удаляет повреждённые участки через аутофагию. Ни один из них нельзя установить, измерив только другой.</p><p>Регуляторы такого рода есть у многих эукариот. У дрожжей киназа Snf1 — гомолог α-субъединицы AMPK — необходима для ответа на снижение глюкозы, а родственные TOR-киназы и многие белки Atg, участвующие в аутофагии, сохраняются от дрожжей до млекопитающих. Snf1 — гомолог AMPK у современного организма, а не её непосредственно наблюдаемый предок. Общее происхождение не означает одинаковых входов: Snf1 активируется при снижении глюкозы, а регуляция AMP, характерная для AMPK млекопитающих, у неё выражена иначе. Из сохранения этих белков не следует «лестница прогресса» от дрожжей к человеку: у каждого вида их регуляция соответствует его собственным условиям жизни.</p><div class="note trap"><strong>Типичная ошибка</strong> После перемещения TFEB в ядро число лизосом мгновенно возрастает.<p class="trap-fix">Локализация фактора предшествует ряду изменений экспрессии и построению органелл; каждый этап проверяют отдельным показателем.</p></div><div class="static-quiz"><h3>После активации AMPK TFEB обнаружен в ядре. Какое измерение нужно дополнительно для вывода о митохондриальном биогенезе?</h3><ol><li><b>А.</b> Подсчёт только точек LC3 без оценки митохондриальных компонентов. <i>(неверный вариант)</i><br><span class="expl">LC3 связан с аутофагическим аппаратом и не заменяет показатель образования митохондрий.</span></li><li><b>Б.</b> Изменение компонентов и объёма митохондрий с контролем их распада. <i>(верный вариант)</i><br><span class="expl">Биогенез относится к построению митохондриальных компонентов; их накопление нужно отличить от уменьшения распада.</span></li><li><b>В.</b> Повторное измерение только ядерной доли TFEB в тот же момент. <i>(неверный вариант)</i><br><span class="expl">Локализация TFEB подтверждает один этап регуляции, но не сам биогенез.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1126/science.abj5559">Malik N. et al. Induction of lysosomal and mitochondrial biogenesis by AMPK phosphorylation of FNIP1. Science. 2023;380:eabj5559. doi:10.1126/science.abj5559</a></li><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s41580-023-00641-8">Goul C., Peruzzo R., Zoncu R. The molecular basis of nutrient sensing and signalling by mTORC1 in metabolism regulation and disease. Nat Rev Mol Cell Biol. 2023;24:857–875. doi:10.1038/s41580-023-00641-8</a></li><li><a href="https://doi.org/10.1074/jbc.M705325200">Greer E. L. et al. The energy sensor AMP-activated protein kinase directly regulates the mammalian FOXO3 transcription factor. J Biol Chem. 2007;282:30107–30119. doi:10.1074/jbc.M705325200</a></li></ul><p>Связь AMPK–FNIP1–TFEB представлена по определённому стрессовому ответу. Не устанавливается обязательная длительность каждого этапа и не утверждается идентичность регуляции всех эукариот.</p></details></article><article class="card print-unit" id="ns-ampk-evidence"><div class="eyebrow">AMPK и энергетическое состояние · шаг 15 из 32</div><h2>Как проверить активность AMPK и состояние аденилатного пула</h2><p class="lead">Фосфорилирование AMPK, действие на ACC и концентрации нуклеотидов — разные показатели. Для причинного вывода нужны согласованные измерения и подходящее вмешательство.</p><div class="note"><strong>Что показывает схема.</strong> Четыре карточки: аденилаты (ВЭЖХ или масс-спектрометрия после быстрой остановки реакций), p-AMPK Thr172 относительно общего AMPK, p-ACC относительно общего ACC, генетическое сравнение клеток дикого типа, без AMPK и с возвращённой AMPK. Для каждой указано, чего метод сам не показывает.</div><ol class="mech"><li>Аденилаты измеряют после быстрого прекращения метаболических реакций в образце.</li><li>Фосфорилирование активационной петли сопоставляют с действием на определённый субстрат.</li><li>Генетический контроль помогает отделить действие AMPK от других действий препарата.</li></ol><p>Содержание ATP, ADP и AMP измеряют <a href="#ns-g-S7-T50">высокоэффективной жидкостной хроматографией (ВЭЖХ) или масс-спектрометрией</a> — методами, которые разделяют молекулы и определяют их количество. Аденилатный пул меняется за секунды, поэтому метаболические реакции в образце останавливают сразу: клетки быстро охлаждают или переносят в кислотный или органический экстрагент. При медленном приготовлении образца ATP успевает гидролизоваться, и измеренное отношение AMP к ATP оказывается завышенным.</p><p>Активность AMPK описывают несколькими показателями. Иммуноблоттинг с антителом к фосфорилированному Thr172 показывает модификацию петли; рядом измеряют общее содержание AMPK. Действие на субстрат оценивают по фосфорилированию ACC по участку, который фосфорилирует AMPK (у мыши Ser79 в Acc1), вместе с общим содержанием ACC. Ни один из этих сигналов не измеряет всю активность AMPK: фосфорилирование петли не учитывает аллостерическую активацию, а фосфорилирование одного субстрата зависит и от фосфатаз этого субстрата.</p><p>Препараты, действующие на AMPK, различаются механизмом. <a href="#ns-g-S7-T51">AICAR</a> — предшественник: в клетке он фосфорилируется до ZMP, аналога AMP, который связывается с γ-субъединицей; ZMP действует и на другие ферменты, связывающие AMP. <a href="#ns-g-S7-T52">Метформин</a> активирует AMPK косвенно; среди предложенных механизмов — подавление комплекса I дыхательной цепи и действие через лизосомный путь. Прямые активаторы связываются с участком ADaM (участок связывания аллостерических препаратов и метаболитов) между α- и β-субъединицами. <a href="#ns-g-S7-T53">Дорсоморфин</a> (соединение C, dorsomorphin, compound C) подавляет AMPK, но подавляет и многие другие киназы, поэтому эффект этого ингибитора не доказывает роли AMPK. Убедительнее генетическое сравнение: клетки дикого типа, клетки без каталитических субъединиц AMPK и клетки, в которые AMPK возвращена.</p><p>Генетические варианты субъединиц AMPK связаны с определёнными заболеваниями. Варианты гена <a href="#ns-g-S7-T54">PRKAG2</a>, кодирующего γ2-субъединицу, связаны с кардиомиопатией с накоплением гликогена в сердечной мышце и нарушениями проведения возбуждения, например синдромом Вольфа — Паркинсона — Уайта (Arad и соавт., 2003; Thevenon и соавт., 2017). Наследственные мутации STK11 — гена, кодирующего LKB1, — вызывают синдром Пейтца — Егерса. Заболевание нельзя вывести из одного измерения p-AMPK: варианты меняют регуляцию в определённых тканях, и следствия проверяют на уровне этих тканей. Схемы лечения в семинаре не рассматриваются.</p><div class="note trap"><strong>Типичная ошибка</strong> Рост p-AMPK доказывает, что любое действие добавленного препарата зависит только от AMPK.<p class="trap-fix">Модификация AMPK — один показатель; препарат может иметь другие мишени. Нужны функциональный показатель и независимый генетический контроль.</p></div><div class="static-quiz"><h3>Какое сравнение лучше проверяет, зависит ли выбранный эффект препарата от AMPK?</h3><ol><li><b>А.</b> Сравнение только двух концентраций препарата в исходных клетках дикого типа (WT). <i>(неверный вариант)</i><br><span class="expl">Зависимость от дозы сама по себе не устанавливает мишень: другие действия также могут зависеть от дозы.</span></li><li><b>Б.</b> Сравнение только p-AMPK и общего содержания AMPK в одной группе исходных клеток дикого типа (WT). <i>(неверный вариант)</i><br><span class="expl">Соотношение фосфосигнала и общего белка не проверяет причинную зависимость выбранного эффекта от AMPK.</span></li><li><b>В.</b> Сравнение исходных клеток дикого типа (WT), клеток с утратой AMPK и клеток с восстановленной AMPK. <i>(верный вариант)</i><br><span class="expl">Сопоставимые генетические условия помогают проверить зависимость эффекта и контролировать специфичность утраты.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-7.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/nm.3372">Fullerton M. D. et al. Single phosphorylation sites in Acc1 and Acc2 regulate lipid homeostasis and the insulin-sensitizing effects of metformin. Nat Med. 2013;19:1649–1654. doi:10.1038/nm.3372</a></li><li><a href="https://doi.org/10.1161/01.CIR.0000075270.13497.2B">Arad M. et al. Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy. Circulation. 2003;107:2850–2856. doi:10.1161/01.CIR.0000075270.13497.2B</a></li><li><a href="https://doi.org/10.1093/europace/euw067">Thevenon J. et al. High prevalence of arrhythmic and myocardial complications in patients with cardiac glycogenosis due to PRKAG2 mutations. Europace. 2017;19:651–659. doi:10.1093/europace/euw067</a></li></ul><p>Никакая концентрация препарата не задаётся как универсально селективная. Количество белка, степень фосфорилирования и активность различаются; медицинские сведения только о молекулярном механизме.</p></details></article><article class="card print-unit" id="ns-acc"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 16 из 32</div><h2>Как ACC образует малонил-CoA</h2><p class="lead">Ацетил-CoA-карбоксилаза образует малонил-CoA из ацетил-CoA. Малонил-CoA участвует и в синтезе жирных кислот, и в регуляции их митохондриального окисления.</p><div class="note"><strong>Что показывает схема.</strong> ACC превращает ацетил-CoA (CH₃–CO–S-CoA) в малонил-CoA (⁻OOC–CH₂–CO–S-CoA): ацетил-CoA + HCO₃⁻ + ATP → малонил-CoA + ADP + фосфат; карбоксильную группу переносит биотин фермента. Малонил-CoA служит субстратом FASN (с NADPH) и ингибитором CPT1.</div><ol class="mech"><li>ACC использует ATP и бикарбонат при карбоксилировании <a href="#ns-g-S7-T56">ацетил-CoA</a>.</li><li>Связанный с ферментом <a href="#ns-g-S7-T58">биотин</a> участвует в переносе карбоксильной группы.</li><li>Образуется <a href="#ns-g-S7-T57">малонил-CoA</a>, используемый в синтезе жирных кислот.</li></ol><p>Коэнзим A (CoA) — переносчик ацильных групп. Он присоединяет ацильный остаток тиоэфирной связью через свою SH-группу, и в таком виде остаток участвует в реакциях. Ацетил-CoA — это ацетильная группа (CH₃–CO–), связанная с CoA; сам CoA не является ни жирной кислотой, ни её частью. Малонил-CoA — малонильная группа (⁻OOC–CH₂–CO–), связанная с CoA, то есть ацетильная группа с дополнительной карбоксильной группой.</p><p>Ацетил-CoA-карбоксилаза (<a href="#ns-g-S7-T55">ACC</a>) катализирует превращение ацетил-CoA в малонил-CoA. Суммарная реакция: ацетил-CoA + HCO₃⁻ + ATP → малонил-CoA + ADP + фосфат. Реакция идёт в два этапа на одном ферменте. Сначала биотин, ковалентно связанный с ферментом, карбоксилируется за счёт бикарбоната; энергию для этого даёт гидролиз ATP. Затем карбоксильная группа переносится с биотина на ацетил-CoA. Углерод новой карбоксильной группы происходит из бикарбоната, а не из ATP: ATP расходуется на активацию бикарбоната.</p><p>Малонил-CoA используется синтазой жирных кислот (<a href="#ns-g-S7-T59">FASN</a>) — многофункциональным ферментом, который последовательно удлиняет растущую ацильную цепь на два атома углерода за цикл. Для синтеза пальмитата (C16) FASN использует одну молекулу ацетил-CoA и семь молекул малонил-CoA, а восстановителем служит NADPH; при каждом удлинении освобождается CO₂ той самой карбоксильной группы, которую присоединила ACC. Образование малонил-CoA и реакции FASN — разные этапы: снижение активности ACC ограничивает поступление субстрата для FASN, но по активности ACC нельзя судить о скорости синтеза жирных кислот.</p><p>Синтез жирных кислот de novo — образование жирных кислот из ацетил-CoA с участием ACC и FASN. Его следует отличать от сборки триацилглицеролов: в этом процессе к глицерол-3-фосфату присоединяются уже имеющиеся жирные кислоты, в том числе поступившие с пищей. Слово «липогенез» в литературе используют для обоих процессов, поэтому в описании эксперимента указывают, что именно измерено. Кроме того, малонил-CoA ингибирует CPT1 — фермент начала переноса длинноцепочечных ацильных групп в митохондрии; эта вторая функция той же молекулы разобрана в следующих шагах.</p><div class="note trap"><strong>Типичная ошибка</strong> Малонил-CoA — только тормозящий сигнал и не участвует в синтезе жирных кислот.<p class="trap-fix">Это также субстрат синтеза жирных кислот; регуляторное действие на CPT1 представляет другую функцию той же молекулы.</p></div><div class="static-quiz"><h3>Активность ACC снижена, остальные условия образования и использования малонил-CoA сохранены. Какое непосредственное изменение ожидается?</h3><ol><li><b>А.</b> Снижается скорость образования малонил-CoA из ацетил-CoA. <i>(верный вариант)</i><br><span class="expl">ACC катализирует образование малонил-CoA; снижение её активности ограничивает эту реакцию.</span></li><li><b>Б.</b> Возрастает скорость образования малонил-CoA из ацетил-CoA. <i>(неверный вариант)</i><br><span class="expl">Это противоположно влиянию снижения активности катализирующего фермента при прочих равных условиях.</span></li><li><b>В.</b> Скорость образования малонил-CoA не меняется: ACC регулирует только карнитиновый перенос. <i>(неверный вариант)</i><br><span class="expl">ACC выполняет реакцию образования малонил-CoA; влияние на CPT1 — последующая регуляторная связь.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/nm.3372">Fullerton M. D. et al. Single phosphorylation sites in Acc1 and Acc2 regulate lipid homeostasis and the insulin-sensitizing effects of metformin. Nat Med. 2013;19:1649–1654. doi:10.1038/nm.3372</a></li></ul><p>Прогноз относится к скорости указанной реакции при неизменных субстратах и других процессах. Скорость образования и установившаяся концентрация — разные величины.</p></details></article><article class="card print-unit" id="ns-carnitine"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 17 из 32</div><h2>Как длинноцепочечная ацильная группа достигает матрикса</h2><p class="lead">Для окисления длинноцепочечной жирной кислоты её ацильная группа переносится через внутреннюю мембрану в составе ацилкарнитина. CPT1, CACT и CPT2 выполняют последовательные, но разные действия.</p><div class="note"><strong>Что показывает схема.</strong> Цитозоль: жирная кислота + CoA + ATP → ацил-CoA. CPT1 в наружной мембране переносит ацильную группу с CoA на карнитин: образуется ацилкарнитин, CoA остаётся в цитозоле. CACT во внутренней мембране переносит ацилкарнитин в матрикс в обмен на карнитин. CPT2 на матриксной стороне переносит ацил на CoA матрикса; ацил-CoA вступает в β-окисление.</div><ol class="mech"><li><a href="#ns-g-S7-T60">CPT1</a> переносит ацильную группу с CoA на карнитин у наружной мембраны.</li><li><a href="#ns-g-S7-T61">CACT</a> переносит <a href="#ns-g-S7-T64">ацилкарнитин</a> через внутреннюю мембрану в обмен на карнитин.</li><li><a href="#ns-g-S7-T62">CPT2</a> восстанавливает ацил-CoA на матриксной стороне внутренней мембраны.</li></ol><p>Митохондрия окружена двумя мембранами. Между ними находится межмембранное пространство, внутри внутренней мембраны — матрикс, где идёт β-окисление. Наружная мембрана проницаема для небольших молекул, а внутренняя мембрана для ацил-CoA непроницаема. Поэтому длинноцепочечные ацильные группы переносятся в матрикс особым путём — <a href="#ns-g-S7-T63">карнитиновым челноком</a>.</p><p>Перенос начинается после активации жирной кислоты. В цитозоле ацил-CoA-синтетаза, связанная с наружной митохондриальной мембраной, присоединяет жирную кислоту к CoA; энергию даёт расщепление ATP до AMP и пирофосфата. Образовавшийся ацил-CoA — субстрат CPT1 (карнитин-пальмитоилтрансферазы 1). CPT1 находится в наружной мембране и переносит ацильную группу с CoA на карнитин. Образуется ацилкарнитин, а CoA остаётся в цитозоле. CPT1 — фермент, а не канал внутренней мембраны.</p><p>Через внутреннюю мембрану ацилкарнитин переносит CACT (карнитин-ацилкарнитинтранслоказа). Это переносчик-антипортер: на каждую молекулу ацилкарнитина, поступающую в матрикс, из матрикса выходит молекула свободного карнитина. На матриксной стороне внутренней мембраны CPT2 переносит ацильную группу с карнитина на CoA матрикса. Ацил-CoA образуется вновь, а освободившийся карнитин возвращается через CACT. Таким образом, через внутреннюю мембрану проходит ацильная группа в составе ацилкарнитина, а не целая молекула ацил-CoA: CoA цитозоля и CoA матрикса — разные молекулы.</p><p>После CPT2 ацил-CoA вступает в <a href="#ns-g-S7-T65">β-окисление</a> — повторяющийся цикл из четырёх реакций, в котором ацильная цепь укорачивается на два атома углерода с образованием ацетил-CoA, NADH и FADH₂. Перенос через мембраны и реакции окисления — разные этапы, и нарушение любого звена челнока прерывает перенос на соответствующем этапе. Схема относится к длинноцепочечным жирным кислотам; поступление других субстратов и различия тканей рассмотрены в отдельном шаге.</p><div class="note trap"><strong>Типичная ошибка</strong> CPT1 переносит целую молекулу ацил-CoA непосредственно через внутреннюю мембрану.<p class="trap-fix">CPT1 образует ацилкарнитин; мембранный перенос выполняет CACT, а ацил-CoA в матриксе образуется вновь при участии CPT2.</p></div><div class="static-quiz"><h3>В карнитиновом челноке избирательно нарушена CACT. Какой этап непосредственно затронут?</h3><ol><li><b>А.</b> Восстановление ацил-CoA на матриксной стороне при действии CPT2. <i>(неверный вариант)</i><br><span class="expl">Это реакция CPT2 после доставки ацилкарнитина; она отличается от действия CACT.</span></li><li><b>Б.</b> Перенос ацилкарнитина через внутреннюю мембрану митохондрии. <i>(верный вариант)</i><br><span class="expl">CACT — транспортёр внутренней мембраны, выполняющий обмен ацилкарнитина и карнитина.</span></li><li><b>В.</b> Перенос ацильной группы с CoA на карнитин при действии CPT1. <i>(неверный вариант)</i><br><span class="expl">Это реакция CPT1 до этапа переноса через внутреннюю мембрану.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021115-105045">Houten S. M. et al. The Biochemistry and Physiology of Mitochondrial Fatty Acid β-Oxidation and Its Genetic Disorders. Annu Rev Physiol. 2016;78:23–44. doi:10.1146/annurev-physiol-021115-105045</a></li></ul><p>Схема относится к длинноцепочечным субстратам; перенос других субстратов и других тканей рассматривается в отдельном шаге.</p></details></article><article class="card print-unit" id="ns-acc-ampk"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 18 из 32</div><h2>Как AMPK связывает образование малонил-CoA с действием CPT1</h2><p class="lead">Малонил-CoA ингибирует CPT1 и одновременно служит субстратом синтеза жирных кислот. AMPK-зависимое снижение активности ACC меняет обе ветви, но их реальные потоки не обязаны изменяться одинаково.</p><div class="note"><strong>Что показывает схема.</strong> AMPK фосфорилирует ACC (у мыши Ser79 в Acc1, Ser212 в Acc2) и снижает её активность; образование малонил-CoA уменьшается. Одна и та же молекула малонил-CoA служит субстратом синтеза жирных кислот и ингибитором CPT1, поэтому синтез получает меньше субстрата, а ингибирование CPT1 ослабевает. Рост потока окисления требует сохранения субстрата, ферментов β-окисления и дыхательной цепи.</div><ol class="mech"><li>Ингибирующее фосфорилирование <a href="#ns-g-S7-T55">ACC</a> уменьшает образование малонил-CoA.</li><li>Снижается доступность малонил-CoA для синтеза жирных кислот.</li><li>Ослабляется ингибирование <a href="#ns-g-S7-T60">CPT1</a>, что создаёт возможность усиления переноса длинноцепочечных ацильных групп.</li></ol><p>Малонил-CoA — одна молекула с двумя функциями. Для синтазы жирных кислот она служит субстратом, а для CPT1 — ингибитором: связываясь с CPT1, малонил-CoA снижает её активность. Ингибирующее действие малонил-CoA на CPT1 впервые описали McGarry и соавт. (1977) на препаратах печени крысы. Поэтому одно изменение содержания малонил-CoA одновременно меняет условия синтеза и условия окисления жирных кислот.</p><p>В причинной цепи три разные величины. Первая — активность ACC: AMPK фосфорилирует ACC по ингибирующему участку, и активность фермента снижается. Вторая — содержание малонил-CoA: оно определяется скоростью образования при участии ACC и скоростью использования и распада, поэтому снижение активности ACC уменьшает содержание малонил-CoA, если остальные скорости не изменились. Третья — активность CPT1: при меньшей концентрации ингибитора CPT1 ингибируется слабее. Кроме фосфорилирования, активность ACC1 регулирует цитрат: в экспериментах с очищенным ферментом человека цитрат аллостерически активировал ACC1 и вызывал сборку её активных нитевидных полимеров (Hunkeler и соавт., 2018). Длинноцепочечные ацил-CoA, например пальмитоил-CoA, напротив, описаны как аллостерические ингибиторы ACC. По представлению, на которое опираются Pinkosky и соавт. (2020), снижая образование малонил-CoA, они ослабляют ингибирование CPT1 и тем самым способствуют собственному окислению; насколько выражено это действие для ACC1 или ACC2 в конкретной клетке, здесь не задаётся.</p><p>Номера фосфорилируемых участков зависят от вида и изоформы. В работе Fullerton и соавт. (2013) у мышей участки AMPK в Acc1 (Ser79) и Acc2 (Ser212) заменили аланином. У таких мышей на стандартном корме ACC не ингибировалась фосфорилированием, синтез жирных кислот в печени был повышен, окисление жирных кислот снижено, и развивались инсулинорезистентность, нарушение толерантности к глюкозе и неалкогольная жировая болезнь печени (стеатоз — накопление жира в клетках печени; в современной номенклатуре — метаболически ассоциированная жировая болезнь печени), но не ожирение. У человека соответствующие участки имеют номера Ser80 (ACC1) и Ser221 (ACC2) (Steinberg, Hardie, 2023); мышиные номера на ферменты человека не переносятся. Фосфорилирование ACC обратимо: фосфатазы удаляют фосфорильную группу с участка ACC, фосфорилирование которого подавляет активность фермента. Например, в первичных гепатоцитах мыши повышенная экспрессия фосфатазы PP4 снижала долю ACC1, фосфорилированной по Ser79 (Meng и соавт., 2014). Этот пример не означает, что PP4 — единственная фосфатаза ACC. После снятия фосфорилирования содержание малонил-CoA зависит ещё и от скорости его использования и распада.</p><p>Ослабление ингибирования CPT1 создаёт возможность для усиления переноса длинноцепочечных ацильных групп в митохондрии, но не гарантирует роста потока β-окисления. Для этого должны сохраняться ещё три условия: поступление жирных кислот в клетку и их активация, работа ферментов β-окисления и реокисление NADH и FADH₂ в дыхательной цепи. Поэтому рост фосфорилирования ACC — признак регуляции, а поток окисления измеряют отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> Рост p-ACC непосредственно измеряет увеличение потока β-окисления.<p class="trap-fix">p-ACC отражает модификацию фермента; поток зависит ещё от транспорта, субстрата и последующих реакций и измеряется отдельно.</p></div><div class="static-quiz"><h3>В основной модели после действия AMPK снизилась концентрация малонил-CoA, доступного CPT1. Остальные условия сохранены. Как меняется ингибирование CPT1?</h3><ol><li><b>А.</b> Ингибирование CPT1 усиливается вследствие снижения малонил-CoA. <i>(неверный вариант)</i><br><span class="expl">При неизменной чувствительности CPT1 это противоположное направление регуляции.</span></li><li><b>Б.</b> Ингибирование не меняется: малонил-CoA участвует только в синтезе жирных кислот. <i>(неверный вариант)</i><br><span class="expl">Малонил-CoA не только используется в синтезе жирных кислот, но и ингибирует CPT1.</span></li><li><b>В.</b> Ингибирование CPT1 ослабевает; рост потока окисления ещё требует проверки. <i>(верный вариант)</i><br><span class="expl">Меньшая доступность ингибитора ослабляет его действие при сохранённой чувствительности CPT1; весь путь оценивают отдельно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/nm.3372">Fullerton M. D. et al. Single phosphorylation sites in Acc1 and Acc2 regulate lipid homeostasis and the insulin-sensitizing effects of metformin. Nat Med. 2013;19:1649–1654. doi:10.1038/nm.3372</a></li><li><a href="https://doi.org/10.1172/JCI108764">McGarry J. D., Mannaerts G. P., Foster D. W. A possible role for malonyl-CoA in the regulation of hepatic fatty acid oxidation and ketogenesis. J Clin Invest. 1977;60:265–270. doi:10.1172/JCI108764</a></li><li><a href="https://doi.org/10.1038/s41580-022-00547-x">Steinberg G. R., Hardie D. G. New insights into activation and function of the AMPK. Nat Rev Mol Cell Biol. 2023;24:255–272. doi:10.1038/s41580-022-00547-x</a></li><li><a href="https://doi.org/10.1038/s41586-018-0201-4">Hunkeler M. et al. Structural basis for regulation of human acetyl-CoA carboxylase. Nature. 2018;558:470–474. doi:10.1038/s41586-018-0201-4</a></li><li><a href="https://doi.org/10.3892/mmr.2014.2397">Meng X. et al. Protein phosphatase 4 promotes hepatic lipogenesis through dephosphorylating acetyl-CoA carboxylase 1 on serine 79. Mol Med Rep. 2014;10:1959–1963. doi:10.3892/mmr.2014.2397</a></li><li><a href="https://doi.org/10.1038/s42255-020-0245-2">Pinkosky S. L. et al. Long-chain fatty acyl-CoA esters regulate metabolism via allosteric control of AMPK β1 isoforms. Nat Metab. 2020;2:873–881. doi:10.1038/s42255-020-0245-2</a></li></ul><p>Качественная схема при фиксированной чувствительности CPT1 и указанных доступных субстратах. Номера Ser79/Ser212 относятся к мыши.</p></details></article><article class="card print-unit" id="ns-isoforms"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 19 из 32</div><h2>Зачем различать ACC1, ACC2 и изоформы CPT1</h2><p class="lead">Изоформы отличаются распределением и свойствами регуляции. Локальное образование метаболита не означает существования непроницаемых изолированных пулов.</p><div class="note"><strong>Что показывает схема.</strong> Печень: ACC1 в цитозоле образует малонил-CoA для синтеза жирных кислот, ACC2 у наружной митохондриальной мембраны — рядом с CPT1A. Скелетная мышца: преобладает ACC2, рядом CPT1B, более чувствительная к малонил-CoA. Нейрон: CPT1C в мембране ЭПР связывает малонил-CoA, но в карнитиновом челноке не участвует. Малонил-CoA — общий метаболит, а не два изолированных пула.</div><ol class="mech"><li>ACC1 связана преимущественно с обеспечением синтеза жирных кислот.</li><li>ACC2 ассоциирована с наружной митохондриальной мембраной и влияет на образование малонил-CoA рядом с системой переноса.</li><li>CPT1A и CPT1B различаются тканевым распределением и чувствительностью к малонил-CoA.</li></ol><p><a href="#ns-g-S7-T67">Изоформы</a> — варианты белка со сходной функцией, которые кодируются разными генами или образуются из одного гена и различаются строением, распределением по тканям или регуляцией. У млекопитающих две ACC. ACC1 находится в цитозоле и преимущественно обеспечивает малонил-CoA для синтеза жирных кислот; её много в печени и жировой ткани. ACC2 имеет N-концевой участок, которым связана с наружной митохондриальной мембраной; её много в скелетной мышце и сердце, есть она и в печени. Малонил-CoA, образованный ACC2, оказывается рядом с CPT1.</p><p>CPT1 также представлена изоформами. CPT1A преобладает в печени, CPT1B — в скелетной мышце и сердце. CPT1B заметно чувствительнее к малонил-CoA, чем CPT1A, однако единого значения константы ингибирования для «CPT1 вообще» нет: чувствительность зависит от изоформы, ткани и состояния мембраны, и параметр одной ткани не переносится на другую.</p><p>Третья изоформа, <a href="#ns-g-S7-T66">CPT1C</a>, отличается от первых двух. Она экспрессируется прежде всего в нейронах, находится в мембране эндоплазматического ретикулума и связывает малонил-CoA, но в переносе ацильных групп в митохондрии не участвует. Поэтому в схеме карнитинового челнока CPT1C не изображают.</p><p>Локальное образование малонил-CoA рядом с CPT1 не означает, что в клетке существуют два полностью изолированных пула этого метаболита: такая изоляция требует отдельного доказательства. Генетические модели показывают, насколько осторожно надо делать выводы. У мышей без Acc2 в работе Abu-Elheiga и соавт. (2001) окисление жирных кислот было повышено, а запасы жира снижены. В независимо полученной линии мышей без Acc2 (Olson и соавт., 2010) масса тела, масса жира и потребление пищи почти не отличались от контроля. Изменение одного потока, следовательно, не позволяет автоматически предсказать массу тела, расход энергии или клинический результат.</p><div class="note trap"><strong>Типичная ошибка</strong> ACC1 и ACC2 создают два одинаковых полностью изолированных пула малонил-CoA.<p class="trap-fix">Место образования и доступность метаболита различаются, но жёсткая изоляция двух пулов требует отдельного доказательства.</p></div><div class="static-quiz"><h3>В модели утраты Acc2 изменился поток окисления жирных кислот. Как проверить предположение об уменьшении массы тела?</h3><ol><li><b>А.</b> Измерить массу тела в сопоставимых группах с учётом условий эксперимента. <i>(верный вариант)</i><br><span class="expl">Другой уровень результата требует самостоятельного измерения; обмен, питание и другие условия сохраняются или учитываются.</span></li><li><b>Б.</b> Пересчитать поток окисления в массу тела по универсальному коэффициенту. <i>(неверный вариант)</i><br><span class="expl">Универсального пересчёта одного потока в изменение массы организма нет.</span></li><li><b>В.</b> Заменить измерение массы тела анализом одного пула малонил-CoA. <i>(неверный вариант)</i><br><span class="expl">Малонил-CoA характеризует регуляторный метаболит, а не массу тела.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1126/science.1056843">Abu-Elheiga L. et al. Continuous fatty acid oxidation and reduced fat storage in mice lacking acetyl-CoA carboxylase 2. Science. 2001;291:2613–2616. doi:10.1126/science.1056843</a></li><li><a href="https://doi.org/10.1073/pnas.0913492107">Olson D. P. et al. Gene knockout of Acc2 has little effect on body weight, fat mass, or food intake. Proc Natl Acad Sci USA. 2010;107:7598–7603. doi:10.1073/pnas.0913492107</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021115-105045">Houten S. M. et al. The Biochemistry and Physiology of Mitochondrial Fatty Acid β-Oxidation and Its Genetic Disorders. Annu Rev Physiol. 2016;78:23–44. doi:10.1146/annurev-physiol-021115-105045</a></li></ul><p>Сведения об изоформах не задают общей численной чувствительности. Генетические результаты у мышей не становятся предсказанием терапии человека.</p></details></article><article class="card print-unit" id="ns-substrate-tissue"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 20 из 32</div><h2>Почему длина жирной кислоты и ткань меняют результат</h2><p class="lead">Зависимость окисления от карнитиновой системы определяется не одним названием «жирная кислота». Нужно назвать длину цепи, ткань и форму субстрата.</p><div class="note"><strong>Что показывает схема.</strong> Таблица по Pereyra и соавт. (2023), гомогенаты тканей мыши: свободный октаноат (C8) окисляется без карнитина в печени и почке, но не в сердце и скелетной мышце; свободный пальмитат (C16) без карнитина не окисляется ни в одной ткани; пальмитоилкарнитин окисляется во всех четырёх тканях.</div><ol class="mech"><li>Окисление длинноцепочечных субстратов связано с карнитиновым челноком.</li><li>В исследованных системах печени среднецепочечные свободные жирные кислоты могут использоваться без карнитина.</li><li>Результат для печени нельзя автоматически переносить на сердце и скелетную мышцу.</li></ol><p>Жирные кислоты различаются длиной углеродной цепи. Пальмитиновая кислота содержит 16 атомов углерода (C16) и относится к <a href="#ns-g-S7-T68">длинноцепочечным</a>; её ацильная группа поступает в матрикс митохондрий через карнитиновый челнок. Октановая кислота (C8) относится к <a href="#ns-g-S7-T69">среднецепочечным</a>. Принято считать, что среднецепочечные жирные кислоты проходят внутреннюю мембрану и активируются в матриксе без участия CPT1 и карнитина. Однако граница длины цепи, начиная с которой нужен карнитин, не одинакова для всех тканей.</p><p>Pereyra и соавт. (2023) измеряли дыхание гомогенатов тканей мышей при добавлении свободных жирных кислот длиной от 6 до 18 атомов углерода или их эфиров с карнитином. Гомогенат печени окислял без добавленного карнитина свободные жирные кислоты длиной от C6 до C14, гомогенат почки — от C6 до C10. Гомогенаты сердца и скелетной мышцы свободные жирные кислоты любой длины в этих условиях не окисляли; после добавления CoA и карнитина гомогенат мышцы окислял и свободный октаноат. Эфиры длинноцепочечных жирных кислот (C10–C18) с карнитином окислялись во всех четырёх тканях. Авторы связывают различие с тем, что в печени, в отличие от мышц, много среднецепочечных ацил-CoA-синтетаз, активирующих жирные кислоты в митохондриях.</p><p>Эти данные описывают возможность окисления субстрата в препарате ткани. Они не описывают, как свободный октаноат распределяется в целом организме, сколько его поступает в каждую ткань и во что он превращается: например, среднецепочечные жирные кислоты пищи из кишечника поступают с кровью воротной вены прежде всего в печень. Поэтому результат для одной ткани проверяют в другой ткани отдельно.</p><p>Это важно при наследственных нарушениях карнитинового челнока, например при недостаточности CPT2. Среднецепочечные субстраты не являются обходом карнитиновой системы во всех тканях: по данным той же работы, мышечная ткань мыши в описанных условиях без карнитина их не окисляла. Схема шага не описывает лечебную диету и не содержит рекомендаций.</p><div class="note trap"><strong>Типичная ошибка</strong> Все жирные кислоты средней длины во всех тканях обходят карнитиновую систему.<p class="trap-fix">Карнитин-независимое использование свободных среднецепочечных субстратов тканеспецифично; в частности, результаты для печени и мышцы различаются.</p></div><div class="static-quiz"><h3>Для печени показано окисление свободного октаноата без карнитина. Как правильно использовать этот результат при обсуждении скелетной мышцы?</h3><ol><li><b>А.</b> По этому результату определить активность CPT1 в мышце без дополнительных измерений. <i>(неверный вариант)</i><br><span class="expl">Превращения октаноата в печени не являются измерением CPT1 в другом органе.</span></li><li><b>Б.</b> Проверить отдельно: ткань может иметь другую зависимость от карнитина. <i>(верный вариант)</i><br><span class="expl">Показана тканевая специфичность, поэтому один орган не служит универсальной моделью остальных.</span></li><li><b>В.</b> Принять тот же результат: длина цепи гарантирует одинаковый путь во всех тканях. <i>(неверный вариант)</i><br><span class="expl">Длина цепи важна, но не устраняет различий ферментов и транспорта между тканями.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/ajpgi.00105.2023">Pereyra A. S., McLaughlin K. L., Buddo K. A., Ellis J. M. Medium-chain fatty acid oxidation is independent of l-carnitine in liver and kidney but not in heart and skeletal muscle. Am J Physiol Gastrointest Liver Physiol. 2023;325:G287–G294. doi:10.1152/ajpgi.00105.2023</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021115-105045">Houten S. M. et al. The Biochemistry and Physiology of Mitochondrial Fatty Acid β-Oxidation and Its Genetic Disorders. Annu Rev Physiol. 2016;78:23–44. doi:10.1146/annurev-physiol-021115-105045</a></li></ul><p>Детали эксперимента взяты из полного текста Pereyra и соавт. (2023; PMC10642992: методы, результаты, обсуждение): гомогенаты тканей самцов мыши, респирометрия с малатом и ADP. Скорости и проценты не переносятся. Результат относится к препаратам тканей и не описывает распределение субстратов в организме и лечебную диету.</p></details></article><article class="card print-unit" id="ns-fatty-acid-flux"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 21 из 32</div><h2>Как отличить регуляторный признак от потока окисления</h2><p class="lead">Содержание малонил-CoA и p-ACC помогают описать регуляцию, но не заменяют измерение окислительного потока. Изменение дыхания после ингибитора требует проверки специфичности воздействия.</p><div class="note"><strong>Что показывает схема.</strong> Четыре подхода: этомоксир и дыхание (возможны другие действия препарата в высоких концентрациях), генетическая утрата CPT1 или CPT2 с восстановлением фермента, меченый субстрат с моделью расчёта потока, малонил-CoA и p-ACC как регуляторные показатели. Для каждого указано, чего метод сам не показывает.</div><ol class="mech"><li>Масс-спектрометрия определяет выбранный метаболит или набор его форм.</li><li>Меченый субстрат позволяет проследить его превращения при заданной модели расчёта.</li><li><a href="#ns-g-S7-T70">Этомоксир</a> может иметь другие действия, особенно при высоких концентрациях.</li></ol><p>В регуляции окисления жирных кислот различают четыре величины, и каждую измеряют своим методом. Активность CPT1 — скорость реакции, которую катализирует фермент в заданных условиях. Концентрация малонил-CoA — количество метаболита в единице объёма; её определяют масс-спектрометрией. Синтез новых жирных кислот — скорость их образования de novo. Окисление субстрата — поток: количество жирной кислоты, которое за единицу времени проходит путь до конечных продуктов.</p><p>Поток оценивают с помощью <a href="#ns-g-S7-T71">изотопного индикатора</a> — субстрата, в котором часть атомов заменена стабильным или радиоактивным изотопом. Например, к клеткам добавляют пальмитат, меченный ¹³C, и прослеживают метку в ацетил-CoA, в метаболитах цикла трикарбоновых кислот или в выделенном CO₂. Метка в промежуточном метаболите или пуле ещё не равна скорости полного окисления: метка разбавляется немеченым веществом клетки, а её распределение зависит от других путей. Поток рассчитывают по выбранной модели с указанными допущениями.</p><p>Ингибиторы требуют особой осторожности. Этомоксир необратимо ингибирует CPT1, и для подавления её активности достаточно низких микромолярных концентраций. Divakaruni и соавт. (2018) показали на макрофагах мыши, что в концентрациях, намного превышающих необходимые для ингибирования CPT1, этомоксир нарушал поляризацию макрофагов под действием интерлейкина-4 даже в клетках без Cpt1a или Cpt2. При избытке препарата подавлялся переносчик адениновых нуклеотидов митохондрий и истощался свободный CoA клетки. Это пример того, как ограничен вывод, основанный на действии ингибитора, в определённых клетках; универсальной «селективной дозы» для всех клеток из этой работы не следует.</p><p>Поэтому снижение дыхания после этомоксира не равно потоку β-окисления. Расход кислорода зависит и от других субстратов — глюкозы, глутамина — и от сопряжения дыхания с синтезом ATP. Для вывода о роли CPT1 сравнивают клетки дикого типа, клетки с генетической утратой CPT1 или CPT2 и клетки с восстановленным ферментом, проверяют дозу препарата и измеряют превращение меченого субстрата.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое снижение дыхания после этомоксира количественно равно потоку β-окисления.<p class="trap-fix">Препарат и дыхательный показатель имеют дополнительные зависимости; нужен контроль субстрата, дозы и генетической мишени.</p></div><div class="static-quiz"><h3>После высокой концентрации этомоксира снизилось дыхание. Что требуется для вывода о роли CPT1?</h3><ol><li><b>А.</b> Только повторное измерение общего ATP в той же группе клеток. <i>(неверный вариант)</i><br><span class="expl">Общий ATP полезен для описания состояния, но не проверяет специфичность этого воздействия.</span></li><li><b>Б.</b> Только совпадение падения дыхания с изменением p-ACC, принятое за доказательство селективности препарата. <i>(неверный вариант)</i><br><span class="expl">Совместное изменение показателей не устанавливает, что препарат действует исключительно на CPT1.</span></li><li><b>В.</b> Проверка дозы, других действий препарата и независимый контроль CPT1. <i>(верный вариант)</i><br><span class="expl">Специфичность и причинную зависимость нельзя установить одним изменением дыхания.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cmet.2018.06.001">Divakaruni A. S. et al. Etomoxir inhibits macrophage polarization by disrupting CoA homeostasis. Cell Metab. 2018;28:490–503.e7. doi:10.1016/j.cmet.2018.06.001</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021115-105045">Houten S. M. et al. The Biochemistry and Physiology of Mitochondrial Fatty Acid β-Oxidation and Its Genetic Disorders. Annu Rev Physiol. 2016;78:23–44. doi:10.1146/annurev-physiol-021115-105045</a></li></ul><p>Результат Divakaruni относится к исследованным макрофагам и режимам воздействия. Никакой универсальный порог селективности препарата не задаётся.</p></details></article><article class="card print-unit" id="ns-fatty-acid-context"><div class="eyebrow">ACC, малонил-CoA и CPT1 · шаг 22 из 32</div><h2>Почему ослабление ингибирования CPT1 ещё не гарантирует усиления окисления</h2><p class="lead">После переноса ацильной группы должны работать ферменты β-окисления и пути реокисления восстановленных коферментов. Изменение одного регуляторного звена создаёт возможность ответа, но не гарантирует его при любом состоянии системы.</p><div class="note"><strong>Что показывает схема.</strong> Последовательность: поступление субстрата → CPT1, CACT, CPT2 → цикл β-окисления (ацетил-CoA, NADH, восстановленный FAD ацил-CoA-дегидрогеназы) → реокисление: NADH → комплекс I, FAD → ETF → ETFDH → убихинон → комплекс III. Ограничение любого звена ограничивает поток; ослабление ингибирования CPT1 не ускоряет путь, если ограничено последующее звено.</div><ol class="mech"><li>CPT1 регулирует один из входных этапов для длинноцепочечного субстрата.</li><li><a href="#ns-g-S7-T65">β-окисление</a> образует ацетил-CoA и восстановительные эквиваленты.</li><li>Доступность субстрата и последующих реакций ограничивает итоговый поток.</li></ol><p>β-Окисление — повторяющийся цикл из четырёх реакций в матриксе. Ацил-CoA-дегидрогеназа окисляет ацильную цепь с образованием двойной связи и восстанавливает FAD до FADH₂. Еноил-CoA-гидратаза присоединяет воду. 3-Гидроксиацил-CoA-дегидрогеназа окисляет гидроксильную группу и восстанавливает NAD⁺ до NADH. Тиолаза при участии свободного CoA отщепляет ацетил-CoA, и цепь укорачивается на два атома углерода. CPT1 в этих реакциях не участвует: она регулирует вход длинноцепочечной ацильной группы в митохондрию.</p><p>Куда идут электроны, отнятые на этих двух стадиях? FADH₂ не покидает фермент как свободный переносчик: FAD, прочно связанный с ацил-CoA-дегидрогеназой, восстанавливается при первой реакции цикла и передаёт электроны белку ETF (electron-transfer flavoprotein). От ETF электроны переходят к ETF:убихинон-оксидоредуктазе (ETFDH, ETF-QO) во внутренней мембране митохондрий, затем к убихинону (коферменту Q) и через него к комплексу III дыхательной цепи. NADH, образовавшийся при окислении 3-гидроксиацил-CoA, отдаёт электроны преимущественно комплексу I. Следовательно, у цикла два разных входа в дыхательную цепь (Wanders и соавт., 2020; Missaglia и соавт., 2021).</p><p>Поэтому поток β-окисления ограничивают несколько звеньев. Нужен субстрат: жирные кислоты должны поступить в клетку и активироваться. Нужен перенос через карнитиновый челнок. Нужны ферменты цикла для цепей разной длины, а для продолжения цикла нужны окисленные коферменты: NADH и FAD ацил-CoA-дегидрогеназы должны реокисляться в дыхательной цепи по двум описанным путям. Если реокисление ограничено, ослабление ингибирования CPT1 не ускорит путь: следующие реакции остаются ограничивающими.</p><p>Скорость реакций регулируется на разных масштабах времени. Фосфорилирование ACC меняет активность фермента за минуты. Экспрессия генов меняется медленнее. В печени после приёма пищи инсулиновый сигнал через AKT повышает активность транскрипционного фактора <a href="#ns-g-S7-T72">SREBP1c</a>, который активирует гены синтеза жирных кислот (Yecies и соавт., 2011). При голодании организма ядерный рецептор <a href="#ns-g-S7-T73">PPARα</a> активирует гены окисления жирных кислот. Подачу субстрата в организме тоже регулируют гормоны. Катехоламины, в том числе норадреналин, усиливают в жировой ткани липолиз — гидролиз триацилглицеролов — через β-адренорецепторы адипоцитов (α2-адренорецепторы, напротив, его тормозят); инсулин липолиз подавляет, и при голодании снижение инсулина ослабляет это торможение (Frikke-Schmidt и соавт., 2016). Прямое действие глюкагона на липолиз зависит от условий и концентрации: у здоровых мужчин повышение глюкагона в крови в пределах физиологических концентраций, при базальном уровне инсулина, не усиливало липолиз в подкожной жировой ткани живота (Gravholt и соавт., 2001), поэтому здесь оно не принимается за общий механизм. Жировая ткань выделяет в кровь глицерол и свободные жирные кислоты; другие ткани окисляют эти жирные кислоты в β-окислении, а глицерол печень и почки используют для глюконеогенеза (Smith и соавт., 2026). Гормональное состояние организма — не то же самое, что состав среды культивируемых клеток: в культуре условия задают составом среды, а в организме — приёмом пищи, голоданием и гормонами.</p><p>Наследственные дефекты затрагивают разные звенья пути: CPT1, CPT2 или <a href="#ns-g-S7-T74">MCAD</a> — среднецепочечную ацил-CoA-дегидрогеназу, первый фермент цикла для цепей средней длины. Общая черта таких состояний — нарушение обеспечения тканей энергией при голодании, когда запас глюкозы ограничен (Houten и соавт., 2016); конкретные проявления и подходы к лечению различаются и в семинаре не рассматриваются. Согласованная регуляция синтеза и окисления (малонил-CoA одновременно субстрат синтеза и ингибитор CPT1) ограничивает одновременное протекание противоположных путей и связанные с этим затраты. Это функциональная интерпретация, а не установленная история отбора, и она не означает полного запрета одновременного синтеза и окисления во всех компартментах.</p><div class="note trap"><strong>Типичная ошибка</strong> Если ингибирование CPT1 снято, β-окисление обязательно идёт с максимальной скоростью независимо от состояния дыхательной цепи.<p class="trap-fix">Транспорт — только часть пути; последующие реакции должны обеспечивать переработку субстрата и реокисление коферментов.</p></div><div class="static-quiz"><h3>Ингибирование CPT1 ослаблено, но реокисление NADH в рассматриваемой системе сильно ограничено. Что можно заключить о потоке β-окисления?</h3><ol><li><b>А.</b> Его рост не гарантирован: ограничение последующих реакций сохраняется. <i>(верный вариант)</i><br><span class="expl">Ослабление входного ограничения не устраняет ограничение дальнейших реакций.</span></li><li><b>Б.</b> Он обязательно становится максимальным, поскольку CPT1 доступна. <i>(неверный вариант)</i><br><span class="expl">Максимум не следует из изменения одного этапа при нарушенных остальных условиях.</span></li><li><b>В.</b> Он определяется только содержанием малонил-CoA и не связан с коферментами. <i>(неверный вариант)</i><br><span class="expl">Малонил-CoA регулирует CPT1, но весь путь зависит и от других молекулярных процессов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-7.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1146/annurev-physiol-021115-105045">Houten S. M. et al. The Biochemistry and Physiology of Mitochondrial Fatty Acid β-Oxidation and Its Genetic Disorders. Annu Rev Physiol. 2016;78:23–44. doi:10.1146/annurev-physiol-021115-105045</a></li><li><a href="https://doi.org/10.1016/j.cmet.2011.06.002">Yecies J. L. et al. Akt stimulates hepatic SREBP1c and lipogenesis through parallel mTORC1-dependent and independent pathways. Cell Metab. 2011;14:21–32. doi:10.1016/j.cmet.2011.06.002</a></li><li><a href="https://doi.org/10.1111/obr.12429">Frikke-Schmidt H. et al. Does bariatric surgery improve adipose tissue function? Obes Rev. 2016;17:795–809. doi:10.1111/obr.12429</a></li><li><a href="https://doi.org/10.1210/jcem.86.5.7460">Gravholt C. H. et al. Physiological levels of glucagon do not influence lipolysis in abdominal adipose tissue as assessed by microdialysis. J Clin Endocrinol Metab. 2001;86:2085–2089. doi:10.1210/jcem.86.5.7460</a></li><li><a href="https://doi.org/10.12997/jla.2020.9.3.313">Wanders R. J. A., Visser G., Ferdinandusse S., Vaz F. M., Houtkooper R. H. Mitochondrial fatty acid oxidation disorders: laboratory diagnosis, pathogenesis, and the complicated route to treatment. J Lipid Atheroscler. 2020;9:313–333. doi:10.12997/jla.2020.9.3.313</a></li><li><a href="https://doi.org/10.1080/10409238.2021.1908952">Missaglia S., Tavian D., Angelini C. ETF dehydrogenase advances in molecular genetics and impact on treatment. Crit Rev Biochem Mol Biol. 2021;56:360–372. doi:10.1080/10409238.2021.1908952</a></li></ul><p>Прогноз качественный и относится к заданному ограничению реокисления. Не задаётся универсальный поток для печени, мышцы и других тканей. Путь электронов ETF–ETFDH–убихинон показан как общая схема митохондриального переноса; вклад входов зависит от ткани.</p></details></article><article class="card print-unit" id="ns-autophagy"><div class="eyebrow">Аутофагия и лизосомы · шаг 23 из 32</div><h2>Как регулируется начало канонической макроаутофагии</h2><p class="lead">Каноническая макроаутофагия доставляет цитоплазматический материал в лизосомы через образование аутофагосомы. Её начало и завершённое расщепление содержимого — разные стадии.</p><div class="note"><strong>Что показывает схема.</strong> Основная ветвь: аминокислоты → mTORC1 ⊣ комплекс ULK1 (ULK1, ATG13, FIP200, ATG101) → начало образования фагофора. Без аминокислот торможение ULK1 ослабевает и образование фагофоров усиливается. Сравнительная таблица: при удалении глюкозы AMPK стимулировала аутофагию (Kim 2011), фосфорилирование ULK1 AMPK было необходимо для митофагии (Egan 2011); при дефиците глюкозы и нарушении функции митохондрий сдерживала её начало (Park 2023); при длительном лишении аминокислот подавляла аутофагию (Kazyken 2024).</div><ol class="mech"><li>Комплекс <a href="#ns-g-S7-T06">ULK1</a> с ATG13, FIP200 и ATG101 участвует в запуске формирования <a href="#ns-g-S7-T76">фагофора</a>.</li><li>В основной аминокислотной ветви снижение действия mTORC1 ослабляет ингибирующую регуляцию этого аппарата.</li><li>Влияние AMPK зависит от вида, силы и длительности воздействия.</li></ol><p>Аутофагией называют доставку собственного материала клетки в лизосомы для расщепления. Путей доставки несколько. При <a href="#ns-g-S7-T75">макроаутофагии</a> участок цитоплазмы окружается новой двухмембранной структурой — аутофагосомой, которая затем сливается с лизосомой. При микроаутофагии материал захватывается впячиванием мембраны самой лизосомы, а при шаперон-опосредованной аутофагии отдельные белки переносятся через лизосомную мембрану. Далее речь идёт о канонической макроаутофагии клеток млекопитающих.</p><p>Образование аутофагосомы начинается с фагофора — плоской мембранной цистерны, которая растёт и охватывает участок цитоплазмы. В запуске участвует комплекс ULK1 (или родственной ULK2) с белками ATG13, FIP200 и ATG101. У млекопитающих этот комплекс собран постоянно, а его киназная активность регулируется фосфорилированием. Начало образования фагофора и замыкание его краёв в аутофагосому — разные этапы; второй этап зависит от других белков и рассматривается в следующих шагах.</p><p>В основной аминокислотной ветви активный mTORC1 фосфорилирует ULK1 (S758 у человека, S757 у мыши) и ATG13 и тем самым тормозит запуск. При удалении аминокислот активность mTORC1 снижается, это торможение ослабевает, и образование фагофоров усиливается при сохранённом энергетическом состоянии клетки. Ослабление торможения относится к начальной стадии: <a href="#ns-g-S7-T77">аутофагический поток</a> — количество материала, которое за единицу времени проходит весь путь до расщепления в лизосомах, — зависит и от следующих этапов.</p><p>Как ULK1 передаёт сигнал комплексу VPS34? Комплекс ULK1 образуют киназа ULK1 и белки ATG13, FIP200 (RB1CC1) и ATG101. Белок ATG13 способствует взаимодействию этого аппарата с ATG14-содержащим комплексом VPS34 (PIK3C3), а киназа ULK1 фосфорилирует его компоненты: Beclin 1 (BECN1; S15 у человека, S14 у мыши) и ATG14 (S29). Эти фосфорилирования способствуют активации липидкиназы VPS34, которая образует PI3P на мембране будущего фагофора (Russell и соавт., 2013; Park и соавт., 2016). Цепь выглядит так: ослабление торможения ULK1 → фосфорилирование компонентов комплекса VPS34 → PI3P → привлечение WIPI2 → последующие события ATG-пути (следующий шаг). ULK1 не создаёт фагофор в одиночку, а перечисленные участки не обязательно необходимы всегда и в каждой клетке: их вклад показан в определённых клетках и условиях.</p><p>Роль AMPK описана противоречиво, и различие связано с условиями экспериментов. В классических работах AMPK фосфорилировала ULK1 по участкам, отличным от участка mTORC1: при удалении глюкозы это стимулировало аутофагию (Kim и соавт., 2011), а у Egan и соавт. (2011) такое фосфорилирование оказалось необходимо для митофагии и выживания клеток при голодании. По более новым данным, при дефиците глюкозы и нарушении функции митохондрий AMPK сдерживает начало аутофагии (Park и соавт., 2023), а при длительном лишении аминокислот подавляет аутофагию и поддерживает повторную активацию mTORC1 (Kazyken и соавт., 2024). Эти результаты получены при разных видах стресса и не складываются в одно правило: ни «AMPK всегда усиливает аутофагию», ни «AMPK всегда её тормозит». Для каждого вывода нужно назвать условия и измеренный этап.</p><div class="note trap"><strong>Типичная ошибка</strong> Любая активация AMPK неизбежно усиливает аутофагический поток.<p class="trap-fix">В исследованных условиях дефицита глюкозы и длительного дефицита аминокислот описаны и другие ответы; необходимо назвать условия и измеренный этап.</p></div><div class="static-quiz"><h3>В основной модели аминокислотного дефицита при сохранённом энергетическом состоянии снизилось действие mTORC1 на аппарат ULK1. Какой ближайший результат допускает это изменение?</h3><ol><li><b>А.</b> Обязательное исчезновение всех лизосом независимо от последующих процессов. <i>(неверный вариант)</i><br><span class="expl">Количество лизосом определяется другими процессами и не обнуляется из-за такого изменения регуляции.</span></li><li><b>Б.</b> Ослабление ингибирующей регуляции начала канонической макроаутофагии. <i>(верный вариант)</i><br><span class="expl">Изменение регуляции ULK1 относится к начальной стадии; итоговый поток зависит от дальнейших этапов.</span></li><li><b>В.</b> Немедленное завершение гидролиза всего содержимого существующих аутофагосом. <i>(неверный вариант)</i><br><span class="expl">Начало образования структур и завершённый гидролиз не являются одним событием.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/1873-3468.14742">Noda N. N. Structural view on autophagosome formation. FEBS Lett. 2024;598:84–106. doi:10.1002/1873-3468.14742</a></li><li><a href="https://doi.org/10.1038/ncb2152">Kim J., Kundu M., Viollet B., Guan K.-L. AMPK and mTOR regulate autophagy through direct phosphorylation of Ulk1. Nat Cell Biol. 2011;13:132–141. doi:10.1038/ncb2152</a></li><li><a href="https://doi.org/10.1126/science.1196371">Egan D. F. et al. Phosphorylation of ULK1 (hATG1) by AMP-activated protein kinase connects energy sensing to mitophagy. Science. 2011;331:456–461. doi:10.1126/science.1196371</a></li><li><a href="https://doi.org/10.1038/s41467-023-38401-z">Park J. M., Lee D. H., Kim D. H. Redefining the role of AMPK in autophagy and the energy stress response. Nat Commun. 2023;14:2994. doi:10.1038/s41467-023-38401-z</a></li><li><a href="https://doi.org/10.1080/15548627.2024.2355074">Kazyken D. et al. Unexpected roles for AMPK in the suppression of autophagy and the reactivation of MTORC1 signaling during prolonged amino acid deprivation. Autophagy. 2024;20:2017–2040. doi:10.1080/15548627.2024.2355074</a></li><li><a href="https://doi.org/10.1038/s42255-025-01442-3">Smith T. K. T. et al. AMPK at the interface of nutrient sensing, metabolic flux and energy homeostasis. Nat Metab. 2026;8:27–51. doi:10.1038/s42255-025-01442-3</a></li><li><a href="https://doi.org/10.1038/ncb2757">Russell R. C., Tian Y., Yuan H. et al. ULK1 induces autophagy by phosphorylating Beclin-1 and activating VPS34 lipid kinase. Nat Cell Biol. 2013;15:741–750. doi:10.1038/ncb2757</a></li><li><a href="https://doi.org/10.1080/15548627.2016.1140293">Park J.-M., Jung C. H., Seo M. et al. The ULK1 complex mediates MTORC1 signaling to the autophagy initiation machinery via binding and phosphorylating ATG14. Autophagy. 2016;12:547–564. doi:10.1080/15548627.2016.1140293</a></li></ul><p>Главная схема — каноническая макроаутофагия в клетке млекопитающего. Различные стрессовые работы представлены раздельно; для воспроизведения конкретного эксперимента нужны его полные условия. Участки S15/S14 в Beclin 1 и S29 в ATG14 показаны в определённых клетках и условиях.</p></details></article><article class="card print-unit" id="ns-phagophore"><div class="eyebrow">Аутофагия и лизосомы · шаг 24 из 32</div><h2>Как собирается и расширяется мембрана фагофора</h2><p class="lead">Фагофор — растущая мембранная структура, которая охватывает цитоплазматический материал. Её формирование требует регуляторных белков и доставки липидов.</p><div class="note"><strong>Что показывает схема.</strong> Этап 1: комплекс VPS34–VPS15–Beclin1–ATG14 (PI3K класса III) образует PI3P в мембране фагофора. Этап 2: WIPI2 связывается с PI3P и привлекает комплекс ATG12–ATG5–ATG16L1. Этап 3: ATG2 переносит фосфолипиды из ЭПР к фагофору, ATG9 перераспределяет их между слоями мембраны. При сниженной активности VPS34 меньше PI3P и меньше связанных с мембраной WIPI2 и ATG16L1.</div><ol class="mech"><li>Комплекс VPS34–VPS15–Beclin1–ATG14 образует <a href="#ns-g-S7-T78">PI3P</a> в мембране.</li><li>PI3P связывают эффекторные белки, включая <a href="#ns-g-S7-T79">WIPI2</a>.</li><li>Перенос липидов <a href="#ns-g-S7-T80">ATG2</a> и их перераспределение <a href="#ns-g-S7-T81">ATG9</a> участвуют в расширении мембраны.</li></ol><p>В аутофагии работает фосфатидилинозитол-3-киназа другого класса, чем в инсулиновом сигнале. PI3K класса I фосфорилирует PIP₂ в плазматической мембране и образует PIP₃. VPS34 — PI3K класса III. В составе комплекса с белками VPS15, Beclin1 и ATG14 она фосфорилирует фосфатидилинозитол в 3-м положении инозитольного кольца и образует фосфатидилинозитол-3-фосфат (PI3P) в мембране, из которой растёт фагофор. PI3P — фосфолипид мембраны, а не нуклеотид. ATG14 направляет комплекс к месту образования фагофора, а комплекс ULK1 стимулирует его активность, фосфорилируя Beclin 1 и ATG14 (предыдущий шаг).</p><p>С PI3P связываются белки, у которых есть PI3P-связывающие участки. Среди них WIPI2. Связавшись с PI3P на мембране фагофора, WIPI2 привлекает комплекс <a href="#ns-g-S7-T82">ATG16L1</a> — комплекс ATG12–ATG5 с белком ATG16L1 (Dooley и соавт., 2014). Этот комплекс определяет, на какой мембране будет присоединяться к липиду белок LC3 (следующий шаг). Если VPS34 образует меньше PI3P, на мембране связывается меньше WIPI2 и ATG16L1.</p><p>Чтобы фагофор вырос, к нему должны поступить липиды. Белок ATG2 образует мостик между мембраной эндоплазматического ретикулума (ЭПР) и краем фагофора и переносит фосфолипиды из одной мембраны в другую (Osawa и соавт., 2019; Valverde и соавт., 2019). ATG2 переносит липиды, а не служит каналом для груза: груз захватывается растущей мембраной и попадает в лизосому позже, после слияния. Поступающие липиды встраиваются в один слой бислоя. ATG9 — скрамблаза: она перераспределяет фосфолипиды между двумя слоями мембраны, позволяя расти обоим (Matoba и соавт., 2020). ATG9 не синтезирует липиды.</p><p>Контакт ЭПР с фагофором — это участок сближения мембран с переносом липидов, а не слияние мембран ЭПР и фагофора. Рисунок показывает выбранные звенья и не утверждает, что вся мембрана фагофора происходит из одного источника: в её образовании участвуют и пузырьки с ATG9, и другие мембраны. Замыкание фагофора в аутофагосому разобрано ниже, а слияние аутофагосомы с лизосомой — в шаге 26.</p><p>Как открытый фагофор становится замкнутой аутофагосомой? Рост фагофора и герметичное замыкание его краёв — разные события. При замыкании края изолирующей мембраны сближаются, а внутренний и наружный листки должны разделиться, чтобы образовались две отдельные мембраны: внутренняя, непосредственно окружающая груз, и наружная. В изученных системах в этом участвует аппарат ESCRT-III: в клетках HeLa его компонент CHMP2A перемещается к фагофору и регулирует разделение внутренней и наружной мембран, а АТФаза VPS4 необходима для завершения аутофагосомы (Takahashi и соавт., 2018). Это не означает, что ESCRT-III — единственный и универсальный для всех эукариот способ замыкания. Последовательность такова: рост фагофора → сближение краёв → замыкание и разделение мембран (ESCRT-III, VPS4) → закрытая двухмембранная аутофагосома с изолированным грузом → слияние с лизосомой. Замыкание нужно отличать от слияния: слияние наружной мембраны уже закрытой аутофагосомы с мембраной лизосомы происходит позже и обеспечивается SNARE-белками, комплексом HOPS и RAB7 (шаг 26).</p><div class="note trap"><strong>Типичная ошибка</strong> ATG2 — мембранный канал, через который груз входит в лизосому.<p class="trap-fix">ATG2 участвует в переносе липидов между мембранами при формировании фагофора; транспорт груза к лизосоме происходит иначе.</p></div><div class="static-quiz"><h3>В основной схеме снизилось образование PI3P комплексом VPS34. Какой процесс непосредственно становится менее обеспеченным?</h3><ol><li><b>А.</b> Связывание PIP₃-зависимых белков с плазматической мембраной через PI3K класса I. <i>(неверный вариант)</i><br><span class="expl">PI3P и PIP₃ — разные липиды, а VPS34 и PI3K класса I выполняют разные реакции.</span></li><li><b>Б.</b> Прямое липидирование LC3 ферментом VPS34 без системы ATG7–ATG3. <i>(неверный вариант)</i><br><span class="expl">VPS34 образует PI3P; липидирование LC3 выполняется другой системой, а не прямой реакцией этой киназы.</span></li><li><b>В.</b> Связывание PI3P-зависимых эффекторов с мембраной фагофора. <i>(верный вариант)</i><br><span class="expl">WIPI2 и другие эффекторные звенья связаны с локальным PI3P в рассматриваемом процессе.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-7.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/1873-3468.14742">Noda N. N. Structural view on autophagosome formation. FEBS Lett. 2024;598:84–106. doi:10.1002/1873-3468.14742</a></li><li><a href="https://doi.org/10.1038/s41580-020-0241-0">Nakatogawa H. Mechanisms governing autophagosome biogenesis. Nat Rev Mol Cell Biol. 2020;21:439–458. doi:10.1038/s41580-020-0241-0</a></li><li><a href="https://doi.org/10.1016/j.molcel.2014.05.021">Dooley H. C. et al. WIPI2 links LC3 conjugation with PI3P, autophagosome formation, and pathogen clearance by recruiting Atg12–5-16L1. Mol Cell. 2014;55:238–252. doi:10.1016/j.molcel.2014.05.021</a></li><li><a href="https://doi.org/10.1038/s41594-019-0203-4">Osawa T. et al. Atg2 mediates direct lipid transfer between membranes for autophagosome formation. Nat Struct Mol Biol. 2019;26:281–288. doi:10.1038/s41594-019-0203-4</a></li><li><a href="https://doi.org/10.1083/jcb.201811139">Valverde D. P. et al. ATG2 transports lipids to promote autophagosome biogenesis. J Cell Biol. 2019;218:1787–1798. doi:10.1083/jcb.201811139</a></li><li><a href="https://doi.org/10.1038/s41594-020-00518-w">Matoba K. et al. Atg9 is a lipid scramblase that mediates autophagosomal membrane expansion. Nat Struct Mol Biol. 2020;27:1185–1193. doi:10.1038/s41594-020-00518-w</a></li><li><a href="https://doi.org/10.1038/s41467-018-05254-w">Takahashi Y., He H., Tang Z. et al. An autophagy assay reveals the ESCRT-III component CHMP2A as a regulator of phagophore closure. Nat Commun. 2018;9:2855. doi:10.1038/s41467-018-05254-w</a></li><li><a href="https://doi.org/10.1038/ncb2757">Russell R. C., Tian Y., Yuan H. et al. ULK1 induces autophagy by phosphorylating Beclin-1 and activating VPS34 lipid kinase. Nat Cell Biol. 2013;15:741–750. doi:10.1038/ncb2757</a></li><li><a href="https://doi.org/10.1080/15548627.2016.1140293">Park J.-M., Jung C. H., Seo M. et al. The ULK1 complex mediates MTORC1 signaling to the autophagy initiation machinery via binding and phosphorylating ATG14. Autophagy. 2016;12:547–564. doi:10.1080/15548627.2016.1140293</a></li></ul><p>Качественная схема канонического аппарата; подробный рисунок каждой белковой структуры требует её структурного источника. Не постулируется один исключительный источник всей мембраны. Роль ESCRT-III в замыкании показана в клетках HeLa и не принимается за единственный механизм.</p></details></article><article class="card print-unit" id="ns-lc3"><div class="eyebrow">Аутофагия и лизосомы · шаг 25 из 32</div><h2>Как LC3 связывается с мембраной и что означает LC3-II</h2><p class="lead">В каноническом аппарате липидированная форма LC3 связана с фосфатидилэтаноламином мембраны. Содержание LC3-II отражает соотношение его образования и удаления.</p><div class="note"><strong>Что показывает схема.</strong> ATG4 превращает про-LC3 в LC3-I. ATG7 (E1-подобный) активирует LC3 за счёт ATP, ATG3 (E2-подобный) принимает его, комплекс ATG12–ATG5–ATG16L1 (E3-подобный) ускоряет перенос LC3 на фосфатидилэтаноламин: образуется LC3-II. LC3-II удаляется ATG4 с наружной мембраны или расщепляется в лизосоме с внутренней. Без ATG7 LC3-II не образуется, LC3-I сохраняется.</div><ol class="mech"><li>После обработки ATG4 LC3 может включаться в систему липидирования.</li><li><a href="#ns-g-S7-T84">ATG7, ATG3</a> и <a href="#ns-g-S7-T82">ATG12–ATG5–ATG16L1</a> обеспечивают присоединение LC3 к липиду.</li><li>LC3-II может удаляться с мембраны и подвергаться лизосомной деградации в зависимости от его положения.</li></ol><p>LC3 — белок семейства ATG8, который в каноническом пути присоединяется к мембране фагофора. <a href="#ns-g-S7-T83">LC3-I и LC3-II</a> — две формы одного белка, а не номера стадий аутофагии. Сначала синтезированный белок расщепляется протеазой ATG4: она отщепляет C-концевой участок и открывает остаток глицина. Получается растворимая форма LC3-I. Когда этот глицин ковалентно соединяется с фосфолипидом мембраны, образуется LC3-II.</p><p>Присоединение LC3 к липиду похоже по устройству на присоединение убиквитина к белку. В этой реакции фермент E1 активирует убиквитин, E2 принимает его от E1, а E3 обеспечивает перенос убиквитина на белок-мишень. Но присоединение LC3 к липиду — другая реакция. ATG7 действует как E1-подобный фермент: за счёт ATP активирует LC3 и образует с ним тиоэфирную связь. ATG3 действует как E2-подобный фермент: принимает LC3 от ATG7. Комплекс ATG12–ATG5–ATG16L1, привлечённый к мембране белком WIPI2, действует как E3-подобный: ускоряет перенос LC3 с ATG3 на липид. Липид-акцептор — <a href="#ns-g-S7-T85">фосфатидилэтаноламин</a> (PE). Уб
