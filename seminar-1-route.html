еняется на Rab7. Каждый шаг меняет набор белков, узнающих мембрану, поэтому смена метки — один из механизмов созревания компартмента (Huotari и Helenius 2011).","Из того, что метки связаны цепочкой превращений, следует важное для опыта правило. Подавление VPS34 снижает не только PI3P, но и PI(3,5)P₂: субстрата для PIKfyve становится мало. Подавление PIKfyve апилимодом (Cai 2013) снижает PI(3,5)P₂; в модели практикума PI3P на поздней эндосоме при этом накапливается, потому что перестаёт превращаться.","На схеме показаны три стадии и содержания меток по модели практикума; числа условны, последовательность событий — по обзорам."],"trap":["Метку достаточно поставить один раз: липид остаётся на мембране, пока его не израсходуют.","Фосфоинозитид непрерывно синтезируется и удаляется; при подавлении киназы фосфатазы за минуты снижают его содержание, и мембрана теряет признак."],"conditions":"Последовательность смены меток (PI(4,5)P₂ ямки; PI3P ранней эндосомы, синтезированный заново киназой VPS34; PI(3,5)P₂ поздней эндосомы) и смена Rab5 на Rab7 — обзоры Huotari и Helenius 2011, Wallroth и Haucke 2018, Posor 2022 (клетки млекопитающих). Быстрое исчезновение сенсоров PI3P после подавления PI3K — обзор Hammond и Balla 2015. Апилимод как ингибитор PIKfyve — Cai 2013. Содержания меток на схеме — учебная модель практикума (ингибитор VPS34 — 10 % активности, апилимод — 5 % активности PIKfyve); накопление PI3P при подавлении PIKfyve — следствие модели.","sources":["Wallroth2018","Huotari2011","Posor2022","HammondBalla2015","Cai2013"],"quiz":{"id":"S1-L16","question":"Эндосома созревает: PI3P превращается в PI(3,5)P₂, а Rab5 сменяется на Rab7. Как изменится связывание EEA1, который узнаёт PI3P и Rab5-GTP, с этой эндосомой?","options":[{"id":"S1-L16-1","text":"Сохранится: связавшийся белок не следит за меткой","correct":false,"feedback":"Связывание домена с липидом обратимо: когда PI3P превращается, а Rab5 сменяется на Rab7, EEA1 диссоциирует от мембраны."},{"id":"S1-L16-2","text":"Ослабнет: исчезают оба признака, которые он узнаёт","correct":true,"feedback":"PI3P превращается в PI(3,5)P₂, а Rab5 сменяется на Rab7. EEA1 теряет оба признака и диссоциирует от мембраны; так смена метки меняет набор белков на созревающей эндосоме."},{"id":"S1-L16-3","text":"Усилится: PI(3,5)P₂ тоже фосфорилирован в положении 3","correct":false,"feedback":"Домен FYVE избирательно связывает PI3P; второй фосфат в положении 5 меняет головную группу, и PI(3,5)P₂ им не узнаётся."}]},"widget":{"kind":"q3conv","title":"","s":{"title":"Созревание эндосомы: смена метки и Rab","status":"Схема механизма; содержания — учебная модель практикума, условные величины","stage_label":"Стадия","stages":["клатриновая ямка","ранняя эндосома","поздняя эндосома"],"drug_label":"Воздействие","drugs":["нет","ингибитор VPS34","апилимод"],"pm":"плазматическая мембрана","lip_pm":"PI(4,5)P₂","lip_ee":"PI3P","lip_le":"PI(3,5)P₂","rab_none":"AP2, клатрин","rab5":"Rab5","rab7":"Rab7","enz_pm":"PIP5K; 5-фосфатазы","enz_ee":"VPS34 (с Rab5)","enz_le":"PIKfyve; FIG4","order":"стрелка с пунктиром — последовательность событий, а не активация","notes":["Ямка: PI(4,5)P₂ удерживает белки эндоцитоза; при отделении пузырька его дефосфорилируют 5-фосфатазы.","Ранняя эндосома: VPS34 вместе с Rab5 синтезирует PI3P, и с мембраной связываются белки с доменами FYVE и PX.","Поздняя эндосома: PIKfyve превращает PI3P в PI(3,5)P₂, Rab5 сменяется на Rab7, набор эффекторов меняется."],"drug_notes":["Без воздействий — стационарные содержания контроля.","Ингибитор VPS34: PI3P на ранней эндосоме снижается, а с ним и PI(3,5)P₂ — у PIKfyve нет субстрата.","Апилимод: PI(3,5)P₂ снижается, PI3P на поздней эндосоме в модели накапливается."],"m_ee":"PI3P, ранняя эндосома","m_le3":"PI3P, поздняя эндосома","m_le":"PI(3,5)P₂, поздняя эндосома","ue":"у. е.","legend":"100 у. е. — содержание липида на его характерной мембране в контроле."}},"section":2,"number":16,"question":3},{"id":"readers","questions":[3],"title":"Чем белки узнают фосфоинозитиды и почему одного домена мало","keywords":["PH-домен","PX-домен","FYVE-домен","ENTH","ANTH","C2-домен","периферическое связывание","сродство","Kd","PLCδ1"],"lead":["Метку считывают белковые модули — домены PH, PX, FYVE, ENTH/ANTH, C2 — которые обратимо связываются с головной группой липида.","Сродство отдельного домена обычно умеренное, поэтому один домен редко даёт надёжную адресацию."],"mechanism":["[[T54|Периферическое связывание]]: белок удерживается на поверхности мембраны электростатически и частично погружёнными гидрофобными участками, а не встроен в бислой.","У доменов [[T55|PH]], [[T57|PX]], [[T56|FYVE]], [[T58|ENTH/ANTH]] и [[T59|C2]] свои лиганды; константы диссоциации — в микромолярном диапазоне.","При таком сродстве домен частично связывается и с «неправильными» мембранами и чувствителен к колебаниям концентрации липида."],"paragraphs":["Белок узнаёт метку доменом, связывающим фосфорилированную головную группу. Связывание обратимо: при смене метки белок диссоциирует от мембраны. PH-домены связывают PI(4,5)P₂, PI(3,4,5)P₃ или PI4P (PLCδ1, AKT, OSBP); PX-домены сортирующих нексинов и FYVE-домены EEA1 и HRS — PI3P на ранних эндосомах; ENTH- и ANTH-домены эпсина и AP180 — PI(4,5)P₂ в эндоцитозной ямке; C2-домены синаптотагмина и PKC — кислые липиды при участии Ca²⁺.","Многое определяет соотношение сродства домена и концентрации липида. PH-домен PLCδ1 связывает PI(4,5)P₂ с константой диссоциации около 2 мкМ, а концентрация доступного PI(4,5)P₂ в клетке оценивается примерно в 10 мкМ; поэтому с мембраной связана большая часть сенсора, по оценке 50–90 %, но не весь (Hammond и Balla 2015). У многих PH-доменов избирательность к одному фосфоинозитиду невысока, и для связывания с мембраной им нужен второй признак, например малая ГТФаза.","Отсюда следует экспериментальная трудность: сенсор на основе одного домена показывает не распределение липида, а места, где липид сочетается с подходящими условиями. Точность адресации достигается не повышением сродства одного домена, а требованием двух признаков одновременно — это тема шага «Что даёт и чего не даёт коинцидентное узнавание»."],"trap":["Чем выше сродство домена к липиду, тем точнее белок находит свою мембрану.","Сродство одиночных доменов умеренное, и один липид есть в нескольких мембранах; избирательность адресации даёт совпадение нескольких признаков, а не сила одного контакта."],"conditions":"Домены и их лиганды — обзор Hammond и Balla 2015. Kd PH-домена PLCδ1 около 2 мкМ, оценка доступного PI(4,5)P₂ около 10 мкМ (от 4 до 17 мкМ в разных клетках) и доля связанного сенсора 50–90 % — оценки из того же обзора. Схема — таблица, без расчёта.","sources":["HammondBalla2015","Varnai1998","Gillooly2000"],"quiz":{"id":"S1-L17","question":"PH-домен PLCδ1 связывает PI(4,5)P₂ с Kd около 2 мкМ, а доступный PI(4,5)P₂ в клетке оценивают примерно в 10 мкМ. Какая доля сенсора будет связана с плазматической мембраной?","options":[{"id":"S1-L17-1","text":"Практически весь сенсор","correct":false,"feedback":"Концентрация лиганда всего в несколько раз выше Kd, поэтому часть сенсора остаётся в цитозоле; полного связывания при таком сродстве нет."},{"id":"S1-L17-2","text":"Меньшая часть сенсора","correct":false,"feedback":"При концентрации лиганда выше Kd занятость больше половины; меньшая часть была бы связана при концентрации ниже Kd."},{"id":"S1-L17-3","text":"Большая часть, но не весь","correct":true,"feedback":"При концентрации лиганда в несколько раз выше Kd связана большая часть сенсора — по оценке Hammond и Balla, от 50 до 90 %, — но не весь."}]},"widget":{"kind":"table","title":"","s":{"title":"Липид-связывающие домены и сенсоры","status":"Схема механизма: сводная таблица","modes_label":"Показать","modes":["домены","сенсоры и их ограничения"],"tables":[{"head":["Домен","Основной лиганд","Где","Пример белка"],"rows":[["PH","PI(4,5)P₂, PI(3,4,5)P₃, PI4P","плазматическая мембрана, Гольджи","PLCδ1, AKT, OSBP"],["PX","PI3P","ранние эндосомы","сортирующие нексины (SNX3)"],["FYVE","PI3P","ранние эндосомы","EEA1, HRS"],["ENTH, ANTH","PI(4,5)P₂","эндоцитозная ямка","эпсин, AP180"],["C2","кислые липиды, при участии Ca²⁺","плазматическая мембрана","синаптотагмин, PKC"]],"note":"Сродство отдельного домена обычно умеренное (Kd — микромоли): домен частично связывается и с другими мембранами."},{"head":["Сенсор","Липид","Что показывает","Ограничение"],"rows":[["PH-PLCδ1","PI(4,5)P₂","плазматическую мембрану","связывает и растворимый IP₃"],["P4M","PI4P","Гольджи, плазматическую мембрану, поздние эндосомы","при сильной экспрессии занимает часть липида"],["PH-FAPP1","PI4P","в основном Гольджи","нужен ещё Arf1-GTP"],["2×FYVE","PI3P","ранние эндосомы","удвоение домена повышает авидность и конкуренцию с эффекторами"],["PH-AKT","PI(3,4,5)P₃ и PI(3,4)P₂","плазматическую мембрану после сигнала","не различает два липида"],["SnxA","PI(3,5)P₂","поздние эндосомы, лизосомы","новый; ML1N×2 оказался малоизбирательным"]],"note":"Сенсор показывает долю липида, свободную от собственных белков клетки и доступную ему, в местах, где выполнены его условия связывания."}]}},"section":2,"number":17,"question":3},{"id":"coincidence","questions":[3],"title":"Что даёт и чего не даёт коинцидентное узнавание","keywords":["коинцидентное узнавание","логическое И","EEA1","Rab5","FYVE","PI3P","авидность","кооперативность","порог","бистабильность"],"lead":["Коинцидентное узнавание — узнавание по совпадению двух и более признаков: белок прочно связывается с мембраной, когда совпадают независимые признаки, например PI3P и Rab5-GTP у EEA1 в модели практикума.","В простейшей модели независимых сайтов доля связанного белка равна произведению занятостей f = fA·fB: это даёт избирательность и авидность, но не порог."],"mechanism":["[[T60|Коинцидентное узнавание]]: каждый признак сам по себе даёт слабое связывание, их совпадение — прочное.","EEA1 связывается доменом FYVE с PI3P и соседним участком с Rab5-GTP; при подавлении PI3K EEA1 диссоциирует от эндосом.","При постоянной занятости второго сайта зависимость f от первого признака остаётся гиперболой с коэффициентом Хилла 1."],"paragraphs":["Классический пример — EEA1, необходимый для слияния ранних эндосом. Он связывается с PI3P доменом FYVE, а с GTP-связанным [[T63|Rab5]] — участком, примыкающим к домену (Lawe 2000). По данным Simonsen 1998, связь EEA1 с эндосомой требовала и Rab5-GTP, и активности PI3K. Так возникло представление, что белок собирается там, где совпадают липидная метка компартмента и активное состояние ГТФазы (Carlton и Cullen 2005).","Количественную сторону легко преувеличить. Пусть два сайта связывают свои признаки независимо, а прочное удержание требует обоих. Тогда доля прочно связанного белка f = fA·fB. На мембране, где есть только один признак, произведение мало — это избирательность. Энергии двух контактов складываются, поэтому при совпадении признаков связывание прочнее — это авидность. Резкого порога произведение не даёт: при постоянном fB зависимость f от содержания PI3P остаётся гиперболой с меньшей высотой.","Поэтому совпадение признаков, кооперативность, сверхчувствительность и бистабильность — разные свойства. Кооперативность означает, что связывание одного признака повышает сродство к другому. Резкость ответа требует кооперативности или многоступенчатых механизмов, а два устойчивых состояния — ещё и положительной обратной связи. Резкая граница домена в микроскопе указывает на такие дополнительные механизмы, а не на сам факт совпадения признаков.","Реальные данные согласуются с произведением лишь качественно. Избыток Rab5-GTP сохранял EEA1 на мембране и при подавленной PI3K (Simonsen 1998); в модели это возмещение частичное. Мутанты EEA1, не связывающие Rab5 C-концевым участком, локализовались на эндосомах так же, как белок дикого типа (Lawe 2002): для посадки EEA1 решающим оказался PI3P, а связывание Rab5, по-видимому, регулирует последующее слияние эндосом. Модель f = fA·fB — упрощение: она показывает логику коинцидентного узнавания, а не реальное соотношение двух признаков. На схеме — учебная модель практикума."],"trap":["Логическое И на мембране работает как переключатель с порогом: ниже порогового PI3P EEA1 не связывается, выше — связывается полностью.","Для независимых сайтов f = fA·fB, и по каждому признаку кривая остаётся гиперболой без порога; порог и бистабильность требуют кооперативности и обратной связи."],"conditions":"Simonsen 1998 — клетки млекопитающих (в том числе HeLa), вортманнин, избыток Rab5-GTP; Lawe 2000 и 2002 — клетки COS, микроинъекция и экспрессия фрагментов и мутантов EEA1. Модель f = fA·fB (упрощение), KA = 40 у. е. PI3P, занятость Rab5-GTP 0,5 (дикий тип), 0,08 (S34N) и 0,95 (Q79L) — учебная модель практикума (вопрос 3, продвинутый уровень). Кооперативная кривая (коэффициент Хилла 4) нарисована только для сравнения.","sources":["Simonsen1998","Lawe2000","Lawe2002","Carlton2005","Stenmark1994"],"quiz":{"id":"S1-L18","question":"В модели практикума EEA1 прочно связывается с эндосомой только при совпадении PI3P и Rab5-GTP, а сайты связывают их независимо. Чего такое узнавание само по себе не даёт?","options":[{"id":"S1-L18-1","text":"Избирательности к мембране, где есть оба признака","correct":false,"feedback":"Избирательность — как раз главный результат: на мембране с одним признаком произведение занятостей мало."},{"id":"S1-L18-2","text":"Резкого порога по содержанию PI3P","correct":true,"feedback":"При постоянной занятости сайта Rab5 доля связанного EEA1 зависит от PI3P гиперболически, с коэффициентом Хилла 1; порог требует кооперативности или других механизмов."},{"id":"S1-L18-3","text":"Более прочного связывания при совпадении признаков","correct":false,"feedback":"Энергии двух контактов складываются, и связывание при совпадении признаков прочнее, чем по одному из них, — это авидность."}]},"widget":{"kind":"q3coin","title":"","s":{"title":"Доля EEA1 на эндосоме: f = fA·fB","status":"Учебная модель, условные величины (модель практикума)","rab_label":"Rab5 в клетках","rabs":["дикий тип","S34N","Q79L"],"v_label":"Активность VPS34","vs":["100 %","50 %","10 %"],"cmp_label":"Для сравнения","cmps":["нет","кооперативная кривая"],"x":"PI3P на эндосоме, у. е.","y":"доля EEA1 на эндосоме, %","lg":["дикий тип","Rab5 S34N","Rab5 Q79L"],"lg_coop":"кооперативное связывание (Хилл 4) — не следует из И","m_fa":"занятость сайта PI3P, fA","m_fb":"занятость сайта Rab5-GTP, fB","m_f":"доля EEA1, f","notes":["Каждая кривая — гипербола без порога; занятость Rab5 меняет её высоту. Точка — выбранное состояние.","Пунктир — S-образная кривая кооперативного связывания той же высоты: такой порог требует дополнительного механизма и из произведения занятостей не следует."],"legend":"Модель независимых сайтов — упрощение; в клетках для посадки EEA1 решающим оказался PI3P (Lawe 2002)."}},"section":2,"number":18,"question":3},{"id":"marker-cause","questions":[3],"title":"Как доказать, что метка — причина, а не только признак","keywords":["маркер","причина","необходимость","рапамицин","FKBP","FRB","псевдоянин","PI4P","PI(4,5)P₂","полиосновный","Hammond"],"lead":["Маркер — признак, по которому исследователь узнаёт мембрану; причинный детерминант — признак, от которого зависят её свойства.","Причинность доказывают вмешательством: липид быстро удаляют из одной мембраны и смотрят, что изменится."],"mechanism":["[[T67|Рапамицин сближает FKBP и FRB]]: фосфатаза, слитая с FKBP, за минуты переносится на мембрану с закреплённым FRB.","Удаление одного PI(4,5)P₂ освобождает PH-PLCδ1, но почти не снимает полиосновные белки; удаление одного PI4P не меняет PI(4,5)P₂.","Полиосновные белки диссоциируют от плазматической мембраны только при удалении обоих липидов."],"paragraphs":["Совпадение белка и липида на одной мембране — корреляция. Утверждение о [[T61|причинном детерминанте]] требует вмешательства: липид удаляют и проверяют, меняется ли поведение мембраны. Удаление показывает необходимость; перенос фермента на чужую мембрану проверяет достаточность.","В опытах Hammond 2012 в клетках COS-7 FRB закрепили на плазматической мембране, а фосфатазы слили с FKBP. Рапамицин за минуты переносил на мембрану домен 5-фосфатазы INPP5E (PI(4,5)P₂ → PI4P), химеру «псевдоянин» из INPP5E и 4-фосфатазы Sac1 (удаляет оба липида), её вариант PJ-Sac с инактивированным доменом INPP5E (PI4P → PI) или вариант PJ-Dead с обоими инактивированными доменами. 5-фосфатаза снижала PI(4,5)P₂ и немного повышала PI4P, и сенсор PH-PLCδ1 переходил в цитозоль. PJ-Sac удаляла PI4P, но PI(4,5)P₂ и его сенсоры оставались прежними: основная часть PI4P этой мембраны не нужна для поддержания PI(4,5)P₂ в стационаре. Авторы предложили два объяснения: PIP5K сразу использует вновь синтезированный PI4P, или PI4P поступает из других мембран. Полиосновные зонды MARCKS-ED и хвост Rit1 диссоциировали от мембраны, только когда псевдоянин удалял оба липида; пренилированный хвост K-Ras при этом оставался на мембране, но переставал на ней обогащаться. PI4P Гольджи псевдоянин не затрагивал.","Вывод авторов: PI4P и PI(4,5)P₂ — необходимые, но независимые признаки плазматической мембраны; для удержания полиосновных белков они взаимозаменяемы, и в этом смысле PI4P — не только предшественник. Встроенные контроли — опыт без рапамицина и неактивная фосфатаза — показывают, что эффект даёт именно ферментативная активность на мембране."],"trap":["Если белок и липид находятся на одной мембране, липид определяет локализацию белка.","Колокализация — корреляция; причинность показывает вмешательство. В опыте Hammond 2012 удаление PI(4,5)P₂ сняло PH-PLCδ1, но не полиосновные белки: их удерживал и PI4P."],"conditions":"Hammond 2012: клетки COS-7; рапамицин-индуцируемый перенос на плазматическую мембрану химер FKBP с доменом INPP5E, с псевдоянином (INPP5E и Sac1), с PJ-Sac (активен только домен Sac1) или с PJ-Dead; окрашивание PI4P и PI(4,5)P₂, флуоресцентные зонды, наблюдение в течение минут. Схема и таблица — качественные данные статьи, без чисел. Строка «PI4P аппарата Гольджи» проверена авторами для псевдоянина.","sources":["Hammond2012","Posor2022"],"quiz":{"id":"S1-L19","question":"Химеру PJ-Sac (активен только домен 4-фосфатазы Sac1) рапамицином перенесли на плазматическую мембрану: PI4P исчез, а PI(4,5)P₂ и его сенсоры остались прежними. Какой вывод следует из этого опыта?","options":[{"id":"S1-L19-1","text":"PI(4,5)P₂ синтезируется без участия PI-4-киназ","correct":false,"feedback":"Ингибитор PI-4-киназ фениларсиноксид мешал восстановлению PI(4,5)P₂ (Hammond 2012); опыт с PJ-Sac говорит о запасе PI4P в мембране, а не о ферментах синтеза."},{"id":"S1-L19-2","text":"Большая часть PI4P мембраны не нужна для PI(4,5)P₂","correct":true,"feedback":"PI4P удалили, а PI(4,5)P₂ сохранился: PIP5K, вероятно, сразу использует вновь синтезированный PI4P, или PI4P поступает из других мембран (Hammond 2012). Значит, большая часть PI4P мембраны выполняет другую функцию."},{"id":"S1-L19-3","text":"PI4P в плазматической мембране отсутствует","correct":false,"feedback":"PI4P там есть: его содержание снижалось именно после переноса PJ-Sac, а сенсор P4M показывает пул PI4P плазматической мембраны."}]},"widget":{"kind":"q3ham","title":"","s":{"title":"Удаление липидов из плазматической мембраны (Hammond 2012)","status":"Данные опыта: клетки COS-7, рапамицин-индуцируемый перенос фосфатазы, минуты; качественно","enz_label":"Фосфатаза, слитая с FKBP","enzs":["неактивная","5-фосфатаза","4-фосфатаза","обе (псевдоянин)"],"enz_short":["неактивная","5-фосфатаза","PJ-Sac","псевдоянин"],"rapa_label":"Рапамицин","rapas":["нет","добавлен"],"out_side":"внеклеточная среда","pm":"плазматическая мембрана","cyt":"цитозоль","frb":"FRB","fkbp":"FKBP","rapa":"рапамицин","no_move":"фермент в цитозоле","plcd":"PH-PLCδ1","osh":"PH-Osh2×2","marcks":"MARCKS-ED","lg_pip2":"PI(4,5)P₂","lg_pi4p":"PI4P","r_pip2":"PI(4,5)P₂ в плазматической мембране","r_pi4p":"PI4P в плазматической мембране","r_golgi":"PI4P аппарата Гольджи","head":["Показание","Результат"],"lv_n":"как в контроле","lv_up":"немного выше","lv_dn":"снижено","lv_nd":"не показано","lv_pm":"на мембране","lv_cyt":"переходит в цитозоль","notes":["Без рапамицина фосфатаза остаётся в цитозоле, и ничего не меняется: это встроенный контроль.","Неактивная химера на мембране ничего не меняет: эффекты вызывает ферментативная активность.","5-фосфатаза: PI(4,5)P₂ снижен, PI4P немного выше; PH-PLCδ1 переходит в цитозоль, полиосновный MARCKS-ED остаётся.","PJ-Sac: PI4P снижен, PI(4,5)P₂ и положение всех трёх белков — как в контроле.","Псевдоянин: удалены оба липида, и PH-PLCδ1, PH-Osh2×2 и MARCKS-ED диссоциируют от мембраны; PI4P Гольджи не меняется."]}},"section":2,"number":19,"question":3},{"id":"pip-signals","questions":[3],"title":"Как сигнальные фосфоинозитиды связаны с AKT, лизосомным Ca²⁺ и болезнями","keywords":["PI(3,4,5)P₃","PI3K","PTEN","SHIP","AKT","PI(3,5)P₂","TRPML1","PIK3CA","PIKfyve","FIG4","VAC14","OCRL","синдром Лоу","INPP5E","синдром Жубера"],"lead":["PI(3,4,5)P₃ — кратковременный сигнал рецептора: его синтезирует PI3K класса I, а удаляют PTEN и SHIP; пока он есть, на плазматической мембране удерживаются AKT и другие белки, PH-домены которых связывают PI(3,4,5)P₃.","PI(3,5)P₂ прямо активирует лизосомный канал TRPML1; мутации генов ферментов обмена фосфоинозитидов связаны с болезнями."],"mechanism":["[[T64|PI3K класса I]] после фактора роста превращает PI(4,5)P₂ в PI(3,4,5)P₃; PTEN дефосфорилирует его до PI(4,5)P₂, SHIP — до PI(3,4)P₂.","Без PTEN PI(3,4,5)P₃ накапливается даже без стимула, и AKT дольше удерживается на мембране.","PI(3,5)P₂ связывается с каналом [[T69|TRPML1]] и открывает его; при дефиците PI(3,5)P₂ поздние эндосомы и лизосомы увеличиваются."],"paragraphs":["PI(3,4,5)P₃ в покоящейся клетке почти нет. После связывания фактора роста рецептор активирует PI3K класса I, которая фосфорилирует PI(4,5)P₂ в положении 3. PTEN отщепляет этот фосфат (Maehama и Dixon 1998), SHIP — фосфат в положении 5. Пока PI(3,4,5)P₃ есть в мембране, с ней связываются белки, PH-домены которых узнают этот липид, в том числе киназа AKT. Утрата PTEN повышает содержание PI(3,4,5)P₃ и без стимула: в опытах Maehama и Dixon неактивный мутант PTEN вызывал накопление PI(3,4,5)P₃ без инсулина.","PI(3,5)P₂ поздних эндосом и лизосом связывается с каналом TRPML1 и открывает его; через канал Ca²⁺ выходит из лизосомы. В фибробластах мыши с дефицитом PI(3,5)P₂ эндолизосомы увеличивались, а повышенная экспрессия TRPML1 уменьшала этот фенотип (Dong 2010). Синтез липида киназой PIKfyve тем самым управляет местным кальциевым сигналом лизосомы.","Мутации генов ферментов обмена фосфоинозитидов вызывают болезни или связаны с ними, и вид связи нужно называть точно. Наследственные мутации PTEN вызывают синдром Каудена (Liaw 1997), соматическая утрата PTEN часта в опухолях. Активирующие соматические мутации PIK3CA часто находят в опухолях человека (Samuels 2004). Мутации FIG4 вызывают болезнь Шарко — Мари — Тута типа 4J (Chow 2007). Мутации 5-фосфатазы OCRL вызывают синдром Лоу (Attree 1992), мутации INPP5E — синдром Жубера (Bielas 2009). Общий признак — нарушение местного баланса синтеза и удаления метки: при мутациях PTEN и PIK3CA избыточен сигнал PI3K — AKT, при мутациях FIG4, OCRL и INPP5E нарушаются созревание мембран, транспорт и функция ресничек."],"trap":["PTEN нужна только после стимула: без фактора роста её утрата ничего не меняет.","PTEN работает и в покое, уравновешивая базальную активность PI3K; без неё PI(3,4,5)P₃ накапливается и без стимула."],"conditions":"Maehama и Dixon 1998 — клетки HEK293, инсулин, неактивный мутант PTEN C124S, рекомбинантный фермент. Dong 2010 — ток канала TRPML1 через мембрану эндолизосом, фибробласты мыши с дефицитом PI(3,5)P₂, дрожжи. Связи с болезнями — Liaw 1997 (синдром Каудена, наследственные мутации), Samuels 2004 (соматические мутации PIK3CA в опухолях), Chow 2007 (FIG4, CMT4J), Attree 1992 (OCRL, синдром Лоу), Bielas 2009 (INPP5E, синдром Жубера). Содержания PI(3,4,5)P₃ и PI(3,5)P₂ и занятость PH-AKT на схеме — учебная модель практикума. Лечебных выводов шаг не делает.","sources":["Maehama1998","Dong2010","Liaw1997","Samuels2004","Chow2007","Attree1992","Bielas2009","Wallroth2018"],"quiz":{"id":"S1-L20","question":"В клетках подавили PIKfyve, и содержание PI(3,5)P₂ на лизосомах снизилось. Как изменится активность канала TRPML1 в лизосомах?","options":[{"id":"S1-L20-1","text":"Снизится: канал теряет активирующий липид","correct":true,"feedback":"PI(3,5)P₂ прямо связывается с TRPML1 и открывает его; при дефиците липида канал реже открыт, и выход Ca²⁺ из лизосомы уменьшается (Dong 2010)."},{"id":"S1-L20-2","text":"Не изменится: канал регулируется только Ca²⁺","correct":false,"feedback":"Активность TRPML1 зависит от фосфоинозитида мембраны: PI(3,5)P₂ связывается с каналом и активирует его (Dong 2010)."},{"id":"S1-L20-3","text":"Возрастёт: накапливается PI3P","correct":false,"feedback":"Активатором TRPML1 служит PI(3,5)P₂, а не его предшественник PI3P; избыток PI3P не возмещает потерю PI(3,5)P₂."}]},"widget":{"kind":"q3sig","title":"","s":{"title":"Сигнальные фосфоинозитиды","status":["Учебная модель, условные величины (модель практикума)","Схема механизма по Dong 2010; содержание PI(3,5)P₂ — модель практикума","Сводная таблица: вид связи по названным работам"],"view_label":"Показать","views":["PI(3,4,5)P₃ и AKT","PI(3,5)P₂ и TRPML1","болезни"],"cond_label":"Условия","conds":["покой","фактор роста","без PTEN","фактор роста, без PTEN"],"pm":"плазматическая мембрана","pi3k":"PI3K кл. I","pten":"PTEN","ship":"SHIP","pip2_to_pip3":"PI(4,5)P₂ → PI(3,4,5)P₃","pip3_to_pip2":"PI(3,4,5)P₃ → PI(4,5)P₂","pip3_to_pi34":"PI(3,4,5)P₃ → PI(3,4)P₂","akt_lg":"зелёные прямоугольники — PH-AKT: у мембраны связанный, внизу — в цитозоле","m_pip3":"PI(3,4,5)P₃ в плазматической мембране","m_akt":"занятость PH-AKT","ue":"у. е.","c_notes":["В покое PI(3,4,5)P₃ мало: базальный синтез уравновешен PTEN и SHIP.","Фактор роста активирует PI3K класса I: PI(3,4,5)P₃ растёт, PH-AKT связывается с мембраной.","Без PTEN PI(3,4,5)P₃ накапливается и без стимула.","Фактор роста без PTEN: PI(3,4,5)P₃ в несколько раз выше, чем после фактора роста в контроле."],"api_label":"PIKfyve","apis":["активна","подавлена апилимодом"],"lys":"просвет лизосомы","trpml1":"TRPML1","ca":"Ca²⁺ в цитозоль","lys_note":"точки — PI(3,5)P₂ в мембране; пунктир со стрелкой — выход Ca²⁺ через канал (перенос)","m_pi35":"PI(3,5)P₂ на поздней эндосоме","m_trpml":"TRPML1","trp_on":"открывается","trp_low":"активность снижена","a_notes":["PIKfyve синтезирует PI(3,5)P₂, и он активирует TRPML1: Ca²⁺ выходит из лизосомы.","При подавленной PIKfyve PI(3,5)P₂ мало, TRPML1 реже открыт; поздние эндосомы и лизосомы увеличиваются."],"dis_head":["Ген","Фермент и липид","Заболевание или фенотип","Вид связи"],"dis_rows":[["PTEN","3-фосфатаза PI(3,4,5)P₃","синдром Каудена; утрата в опухолях","наследственные мутации вызывают синдром (Liaw 1997); соматическая утрата часта в опухолях"],["PIK3CA","PI3K класса I, p110α","опухоли разных органов","активирующие соматические мутации часты в опухолях (Samuels 2004)"],["FIG4","5-фосфатаза PI(3,5)P₂ в комплексе с PIKfyve и VAC14","болезнь Шарко — Мари — Тута 4J","мутации вызывают болезнь; у мыши — нейродегенерация и вакуоли (Chow 2007)"],["OCRL","5-фосфатаза PI(4,5)P₂","синдром Лоу","мутации вызывают синдром (Attree 1992)"],["INPP5E","5-фосфатаза PI(4,5)P₂ и PI(3,4,5)P₃","синдром Жубера","мутации нарушают активность и связаны с синдромом (Bielas 2009)"]],"dis_note":"Таблица называет вид связи из работ; лечебных выводов из неё не следует."}},"section":2,"number":20,"question":3},{"id":"measure-pip","questions":[3],"title":"Что показывают методы изучения фосфоинозитидов и где их пределы","keywords":["сенсор","биосенсор","липидомика","масс-спектрометрия","конкуренция","избыточная экспрессия","P4M","ML1N","SnxA","вмешательство"],"lead":["Сенсор на основе домена показывает доступный ему липид в местах, где выполнены его условия связывания; липидомика измеряет количество, но теряет локализацию.","Необходимость липида показывает только вмешательство — быстрое удаление его из выбранной мембраны."],"mechanism":["[[T68|Сенсор на основе липид-связывающего домена]] связывает часть свободного липида и конкурирует с собственными белками клетки; при сильной экспрессии он может подавлять процесс.","Сенсору может быть нужен второй признак (PH-FAPP1 — Arf1-GTP), а липид, связанный с эффекторами, сенсору не виден.","Масс-спектрометрия экстракта не различает мембраны; региоизомеры одной массы по одной массе иона не различить — для этого применяют предварительное разделение, например хроматографическое."],"paragraphs":["[[T08|Генетически кодируемый биосенсор]] фосфоинозитида — домен, слитый с флуоресцентным белком. Он сообщает о доле липида, которая свободна от собственных белков клетки и доступна ему (Hammond и Balla 2015). Избыточная экспрессия сенсоров PI(4,5)P₂ подавляла сигнализацию через фосфолипазу C и экзоцитоз. Сенсор с дополнительным требованием показывает не все пулы липида: PH-FAPP1 выделяет Гольджи, а P4M, которому достаточно PI4P, — ещё плазматическую мембрану и поздние эндосомы (Hammond 2014).","Надёжность сенсоров неодинакова. Сенсор PI(3,5)P₂ ML1N×2 (Li 2013) при проверке оказался малоизбирательным: его локализация во многом не зависела от синтеза PI(3,5)P₂ (Hammond 2015). Позже предложен белок SnxA (Vines 2023). Проверка сенсора включает удаление липида: если сигнал не исчезает, сенсор показывает что-то другое.","Липидомика измеряет количество фосфоинозитидов в экстракте и точна, но не даёт разрешения на уровне отдельной клетки и мембраны; разделение органелл трудоёмко и даёт артефакты (Hammond и Balla 2015). По одной массе иона региоизомеры, например PI(4,5)P₂ и PI(3,4)P₂, не различить. Методы с предварительным хроматографическим разделением — хиральной хроматографией (PRMC-MS; Morioka 2022) или сверхкритической флюидной хроматографией (Shimanaka 2022) — позволяют измерять их раздельно; исходную органеллу анализ общего экстракта при этом всё равно не устанавливает.","Ни сенсор, ни липидомика не доказывают, что липид нужен. Необходимость показывает вмешательство: фосфатазу за минуты переносят на выбранную мембрану (сближение FKBP–FRB) и смотрят, что изменится (шаг «Как доказать, что метка — причина»)."],"trap":["Яркость сенсора на мембране пропорциональна содержанию липида в ней.","Сенсор насыщается, конкурирует с собственными белками клетки и может требовать второго признака; он показывает доступный ему липид в местах, где выполнены условия связывания."],"conditions":"Свойства сенсоров и липидомики — обзор Hammond и Balla 2015; P4M и PH-FAPP1 — Hammond 2014 (клетки COS-7 и др.); ML1N×2 — Li 2013 и проверка Hammond 2015 (клетки COS-7, эмбриональные стволовые клетки мыши, фармакологическое и генетическое подавление синтеза PI(3,5)P₂); SnxA — Vines 2023 (Dictyostelium и клетки млекопитающих); региоизомеры в масс-спектрометрии — Hammond 2012; их раздельное измерение — Morioka 2022 (PRMC-MS: хиральная хроматография и масс-спектрометрия; ткани мыши и клеточные линии) и Shimanaka 2022 (сверхкритическая флюидная хроматография; ткани мыши и культуры клеток), прочитаны рефераты. Схемы методов — без чисел.","sources":["HammondBalla2015","Hammond2014","Li2013","Hammond2015PO","Vines2023","Hammond2012","Morioka2022","Shimanaka2022"],"quiz":{"id":"S1-L21","question":"Липидомика без разделения региоизомеров показала, что общее количество фосфоинозитида с массой PIP₂ в клетках после воздействия не изменилось. Какой вывод корректен?","options":[{"id":"S1-L21-1","text":"PI(4,5)P₂ в плазматической мембране не изменился","correct":false,"feedback":"Экстракт всей клетки не различает мембраны: количество в одной мембране могло измениться за счёт другой."},{"id":"S1-L21-2","text":"Воздействие не затронуло ферменты обмена фосфоинозитидов","correct":false,"feedback":"Активность ферментов могла измениться, если синтез и удаление сместились одинаково или изменения в разных мембранах уравновесили друг друга."},{"id":"S1-L21-3","text":"Перераспределение липида между мембранами не исключено","correct":true,"feedback":"Анализ общего экстракта теряет локализацию, а без хроматографического разделения не различает PI(4,5)P₂ и PI(3,4)P₂ одной массы, поэтому постоянство общего количества не исключает перераспределения."}],"rev":2},"widget":{"kind":"method","title":"","s":{"title":"Методы изучения фосфоинозитидов","status":"Схемы методов, без чисел","modes_label":"Метод","modes":["сенсор на основе домена","липидомика","вмешательство"],"schemes":[{"draw":"q3sensor","h":270,"l":{"pA":"А","a":"умеренная экспрессия","pB":"Б","b":"избыток сенсора","pC":"В","c":"второй признак","eff":"эффектор","arf":"+ Arf1-GTP","noarf":"без Arf1","res0":"часть липида свободна,\nсенсор связывает её","res1":"сенсор занимает липид,\nэффектор не связывается","res2":"сенсор связан только там,\nгде есть второй признак"},"note":"Сенсор показывает доступный ему липид в местах, где выполнены условия его связывания; избыток сенсора конкурирует с собственными белками клетки."},{"draw":"q3lipidomics","h":260,"l":{"cell":"клетка: липиды разных мембран","extract":"экстракция","mix":"общий экстракт","mz":"масса / заряд","res":"есть количество; нет локализации, региоизомеры — после разделения"},"note":"Липидомика точно измеряет количество в экстракте, но не говорит, в какой мембране был липид. PI(4,5)P₂ и PI(3,4)P₂ одной массы различают после предварительного разделения, например хроматографического."},{"draw":"q3intervene","h":262,"l":{"pA":"А","a":"корреляция","pB":"Б","b":"удаление липида","ptase":"фосфатаза","res_a":"липид и белок на одной мембране","res_b":"липид удалён — белок диссоциировал"},"note":"Совпадение липида и белка — корреляция; диссоциация белка после быстрого удаления липида показывает необходимость липида в этих условиях."}]}},"section":2,"number":21,"question":3},{"id":"contact-site","questions":[4],"title":"Что такое мембранный контактный сайт и чем он отличается от слияния","keywords":["контактный сайт","зазор 10–30 нм","тетеринг-белки","слияние","везикулярный транспорт","ЭПР","три признака"],"lead":["Мембранный контактный сайт — участок устойчивого сближения мембран двух органелл без их слияния. Характерное расстояние зависит от типа контакта; 10–30 нм — диапазон для контакта ЭПР — митохондрия, рассматриваемого здесь.","В этом шаге разбираются три проверки — геометрия, удержание мембран и раздельность содержимого; каждую выполняют отдельным измерением, а функцию контакта измеряют ещё отдельно."],"mechanism":["[[T70|Контактный сайт]] — устойчивое сближение мембран двух органелл, которое удерживают [[T71|тетеринг-белки]]; расстояние зависит от типа контакта.","Мембраны сохраняют целостность, содержимое [[T01|компартментов]] не смешивается; этим контакт отличается от слияния.","Чаще всего партнёром в контакте оказывается ЭПР: его сеть трубочек и цистерн проходит через весь объём клетки."],"paragraphs":["Компартменты обмениваются веществом тремя способами. Участок мембраны с грузом отделяется в виде пузырька и сливается с мембраной-получателем; растворимый переносчик связывает молекулу в одном месте и отдаёт в другом; наконец, органеллы обмениваются веществом через сближенные мембраны без слияния. Третий путь и есть [[T70|мембранный контактный сайт]].","Группа исследователей контактов предложила описывать контакт по четырём признакам: удержанию мембран рядом, отсутствию слияния, особой функции и особому набору белков и липидов; одно расстояние контакт не определяет — верхнюю границу в разных работах задают от 10 до 80 нм (Scorrano 2019). В этом шаге разбираются [[T72|три проверки]]. Первая — геометрия: в контакте ЭПР — митохондрия зазор порядка 10–30 нм достаточно мал, чтобы белок средних размеров перекрыл его, и достаточно велик, чтобы мембраны не сливались (слияние бислоёв происходит лишь при их сближении до 1–2 нм, для чего нужны специальные белки). Вторая — тетеринг-белки, удерживающие это расстояние: их удаление должно увеличивать зазор или уменьшать площадь контакта (хотя в большинстве контактов таких белков несколько, и удаление одного может не дать эффекта). Третья — раздельность содержимого: компартменты остаются разными, и именно это отличает контакт от слияния.","Контакты образуют почти все органеллы, но чаще других в них участвует ЭПР — с митохондриями, плазматической мембраной, эндосомами, лизосомами, пероксисомами, липидными каплями и аппаратом Гольджи (Wu 2018; Prinz 2020). По оценке Rizzuto 1998, в клетках HeLa с ЭПР сближено от 5 до 20 % поверхности митохондрий.","Признаки устанавливаются с разной полнотой, и вывод ограничен тем, что измерено. Если измерена площадь сближения, можно говорить о площади, но не о переносе вещества: для этого нужно отдельное измерение потока или зависящей от него функции (Calì 2025). Поэтому результат записывают не словами «контакт есть», а перечнем установленных признаков и методов."],"trap":["В контакте мембраны органелл частично сливаются, чтобы передать вещество.","При контакте обе мембраны сохраняют целостность и содержимое не смешивается. Вещество переносят белки — переносчики липидов и каналы в зоне сближения; при слиянии же содержимое органелл объединяется."],"conditions":"Определение и признаки контакта — согласованные рекомендации группы авторов (Scorrano 2019, полный текст PMC: четыре признака, верхняя граница расстояния в разных работах 10–80 нм; Calì 2025, обзор). Доля поверхности митохондрий, сближенной с ЭПР (5–20 %), — оценка Rizzuto 1998 для живых клеток HeLa по трёхмерной флуоресцентной микроскопии (полный текст). Схема — схема механизма; расстояния не в масштабе.","sources":["Scorrano2019","Cali2025","Wu2018","Prinz2019","Rizzuto1998"],"quiz":{"id":"S1-L22","question":"ЭМ-томография показала, что мембраны ЭПР и митохондрии сближены на 15–20 нм, а маркеры просветов двух органелл не смешиваются. Какая из трёх проверок, разобранных в этом шаге, этими данными ещё не выполнена?","options":[{"id":"S1-L22-1","text":"Удержание расстояния тетеринг-белками","correct":true,"feedback":"Расстояние и раздельность содержимого измерены. Чтобы выполнить третью проверку, нужно назвать белки, удерживающие зазор, удалить их и показать, что зазор растёт или площадь контакта уменьшается."},{"id":"S1-L22-2","text":"Расстояние между мембранами органелл","correct":false,"feedback":"Расстояние уже измерено томографией: 15–20 нм. Неизвестно другое — какие белки удерживают мембраны на этом расстоянии."},{"id":"S1-L22-3","text":"Раздельность содержимого органелл","correct":false,"feedback":"Раздельность содержимого показали маркеры просветов: они не смешиваются. Не хватает данных о белках, удерживающих зазор."}],"rev":2},"widget":{"kind":"q4geom","title":"","s":{"title":"Контакт, слияние и пузырёк: что происходит с мембранами и содержимым","status":"Схема механизма","modes_label":"Способ обмена","modes":["контактный сайт","слияние органелл","везикулярный транспорт"],"a":"органелла 1","b":"органелла 2","gap":"10–30 нм","tether":"тетеринг-белки","ves":"пузырёк","scale":"схема не в масштабе","m_dist":"Расстояние между мембранами","m_mem":"Мембраны","m_cont":"Содержимое","dist":["10–30 нм в этом примере","мембраны объединены","пузырёк отделяется и сливается"],"mem":["обе не повреждены","объединены","участок переходит в мембрану-получатель"],"cont":["не смешивается","смешивается","груз пузырька попадает в получатель"],"notes":["Мембраны удерживаются рядом тетеринг-белками и не сливаются; каждая органелла сохраняет своё содержимое. Зазор 10–30 нм — пример контакта ЭПР — митохондрия; у других контактов расстояние бывает больше.","Мембраны объединяются, содержимое смешивается: из двух компартментов получается один.","Участок мембраны с грузом отделяется, переносится и сливается с мембраной-получателем; органеллы между собой не сближаются."]}},"section":3,"number":22,"question":4},{"id":"tethers","questions":[4],"title":"Какие белки удерживают мембраны рядом и почему контакт динамичен","keywords":["тетеринг-белки","VAP","FFAT","PDZD8","E-Syt","STIM1","Orai1","ERMES","митофузин 2","MFN2"],"lead":["Тетеринг-белки одновременно связаны с мембранами двух органелл; многие из них не только удерживают контакт, но и переносят вещество.","Роль белка в контакте доказывают удалением: должны измениться геометрия контакта и зависящая от него функция."],"mechanism":["[[T76|VAP-A и VAP-B]] на мембране ЭПР связывают мотив FFAT белков-партнёров, в том числе OSBP, и привязывают перенос липидов к месту контакта.","У дрожжей ЭПР с митохондрией связывает комплекс ERMES; у животных его нет, но белок ЭПР [[T84|PDZD8]] несёт SMP-домен, функционально соответствующий домену белка Mmm1 из ERMES (Hirabayashi 2017).","Контакт — равновесие образования и распада: число и площадь контактов меняются с условиями."],"paragraphs":["[[T71|Тетеринг-белки]] одновременно связаны с мембранами двух органелл и удерживают их на определённом расстоянии, не вызывая слияния; их отличают от моторных адаптеров, перемещающих органеллы, и от белков слияния. Первый такой комплекс нашли у дрожжей: в генетическом скрининге клеток, которые выживали только при искусственной привязке ЭПР к митохондрии, выявили белки комплекса ERMES (Kornmann 2009). У животных комплекса ERMES нет, но белок ЭПР PDZD8 несёт SMP-домен, функционально соответствующий домену Mmm1 — одного из белков ERMES (Hirabayashi 2017).","Многие тетеринг-белки одновременно переносят вещество. Мотив FFAT, который связывают VAP-A и VAP-B, есть у OSBP, белков ORP и переносчика церамида CERT, поэтому пара VAP–FFAT удерживает контакт и привязывает к нему перенос липидов. [[T85|E-Syt]] связывают ЭПР с плазматической мембраной; при подъёме Ca²⁺ зазор в контактах, образованных E-Syt1, сокращается (Fernández-Busnadiego 2015). После опустошения депо сенсор ЭПР [[T86|STIM1]] в контакте с плазматической мембраной связывается с каналом Orai1 и открывает депо-зависимый вход Ca²⁺ (Saheki 2017). В нейронах мыши без PDZD8 митохондрии хуже захватывали Ca²⁺, вышедший из ЭПР при синаптической стимуляции (Hirabayashi 2017).","Роль [[T88|митофузина 2]] долго оставалась спорной. По данным de Brito и Scorrano (2008), удаление MFN2 в фибробластах мыши и клетках HeLa ослабляло связь ЭПР с митохондриями и захват Ca²⁺; по данным Filadi 2015, удаление MFN2 в нескольких типах клеток, напротив, усиливало сближение органелл и перенос Ca²⁺. Расхождение связывают со способами оценки сближения и с изменением формы митохондрий без MFN2. В 2023 году описаны ЭПР-специфические варианты сплайсинга гена MFN2: ERMIT2 находится на границе ЭПР и митохондрии и, связываясь с митофузинами митохондрии, удерживает органеллы рядом, а ERMIN2 участвует в организации ЭПР (Naón 2023). Поэтому в опытах с MFN2 нужно различать варианты белка и способ вмешательства; связь болезни с нарушением контакта этим ещё не установлена.","Число и площадь контактов меняются при изменении метаболических условий, при стрессе ЭПР и по ходу клеточного цикла — за счёт количества тетеринг-белков, их фосфорилирования и протеолиза."],"trap":["Любой белок, найденный в зоне контакта, удерживает этот контакт.","Локализация в зоне контакта ещё не доказывает удержания. Нужно удалить белок и показать, что зазор растёт или площадь уменьшается, и проверить, меняется ли функция, зависящая от контакта. История MFN2 показывает, что разные способы оценки могут дать противоположные ответы."],"conditions":"ERMES — дрожжи Saccharomyces cerevisiae, синтетический скрининг (Kornmann 2009). PDZD8 — клетки HeLa и нейроны коры мыши (Hirabayashi 2017). E-Syt — криоэлектронная томография клеток COS-7 с избытком E-Syt (Fernández-Busnadiego 2015). STIM1–Orai1 и E-Syt — обзор Saheki и De Camilli 2017. MFN2: de Brito и Scorrano 2008 — фибробласты мыши и клетки HeLa; Filadi 2015 — несколько типов клеток, морфология и перенос Ca²⁺ (для обеих работ прочитаны рефераты); варианты ERMIT2 и ERMIN2 — клетки HeLa и печень мыши (Naón 2023, прочитан реферат). Таблица — сводка данных.","sources":["Kornmann2009","Hirabayashi2017","FernandezBusnadiego2015","Saheki2017","Brito2008","Filadi2015","Mesmin2013","Naon2023"],"quiz":{"id":"S1-L23","question":"Две ранние работы (2008 и 2015 годов): после удаления митофузина 2 одна группа исследователей наблюдала ослабление связи ЭПР с митохондриями, другая — усиление. Какой вывод следует из этих двух работ?","options":[{"id":"S1-L23-1","text":"MFN2 — доказанный тетеринг-белок этого контакта","correct":false,"feedback":"В работе Filadi 2015 удаление MFN2 усиливало сближение органелл. Две работы дали противоположные результаты, поэтому по ним роль белка не установлена."},{"id":"S1-L23-2","text":"Роль MFN2 по этим данным не установлена","correct":true,"feedback":"Результаты двух групп противоречат друг другу; расхождение связывают со способами оценки сближения и с изменением формы митохондрий без MFN2. Позже описан ЭПР-специфический вариант белка ERMIT2, который удерживает ЭПР у митохондрии (Naón 2023); это подтверждает участие продуктов гена MFN2 в удержании контакта, но причину расхождения двух ранних работ само по себе не объясняет."},{"id":"S1-L23-3","text":"MFN2 участвует только в слиянии митохондрий","correct":false,"feedback":"MFN2 обнаружен и на мембране ЭПР, а его удаление в обеих работах меняло связь ЭПР с митохондриями — в разные стороны, но меняло."}],"rev":2},"widget":{"kind":"table","title":"","s":{"title":"Тетеринг-белки и проверка их роли","status":"Сводка данных","modes_label":"Показать","modes":["Пары белков","Как установить роль белка"],"tables":[{"head":["Белок или комплекс","Контакт","Что делает помимо удержания","Источник"],"rows":[["VAP-A, VAP-B + мотив FFAT партнёра","ЭПР с Гольджи, эндосомами, плазматической мембраной","привязывает перенос липидов (OSBP, ORP, CERT)","Mesmin 2013"],["E-Syt1–3","ЭПР — плазматическая мембрана","переносят липиды; E-Syt1 сокращает зазор при подъёме Ca²⁺","Fernández-Busnadiego 2015; Saheki 2017"],["STIM1–Orai1","ЭПР — плазматическая мембрана","депо-зависимый вход Ca²⁺","Saheki 2017"],["PDZD8","ЭПР — митохондрия","нужен для захвата Ca²⁺ митохондриями в нейронах","Hirabayashi 2017"],["ERMES (только дрожжи)","ЭПР — митохондрия","связан с синтезом фосфолипидов","Kornmann 2009"],["MFN2 (варианты ERMIT2, ERMIN2)","ЭПР — митохондрия","ранние данные противоречивы; ЭПР-вариант ERMIT2 связывает ЭПР с митохондрией","de Brito 2008; Filadi 2015; Naón 2023"]],"note":"Многие тетеринг-белки удерживают контакт и одновременно переносят вещество или регулируют каналы."},{"head":["Что сделано","Что показывает","Чего не показывает"],"rows":[["белок найден в зоне контакта","что белок может участвовать","что он удерживает контакт"],["после удаления зазор вырос или площадь уменьшилась","белок нужен для геометрии контакта","значение контакта для функции"],["после удаления изменилась функция (захват Ca²⁺, перенос липида)","белок нужен для функции","действует ли он через контакт или иначе"],["искусственная привязка вернула функцию","сближения мембран достаточно","какой белок работает в норме"]],"note":"Одно вмешательство отвечает на один вопрос: удаление — о необходимости, искусственная привязка — о достаточности."}]}},"section":3,"number":23,"question":4},{"id":"lipid-transfer","questions":[4],"title":"Как липид переносится через контакт против градиента","keywords":["OSBP","PI4P","холестерин","SAC1","PI4KIIIβ","VAP","ORP5","ORP8","фосфатидилсерин","CERT","церамид","OSW-1"],"lead":["OSBP переносит холестерин из ЭПР в аппарат Гольджи в обмен на PI4P.","Перенос сопряжён с обратным переносом PI4P и его гидролизом в ЭПР, а PI-4-киназа восстанавливает PI4P на Гольджи за счёт ATP."],"mechanism":["[[T74|OSBP]] связывается PH-доменом с PI4P транс-Гольджи и мотивом FFAT с VAP на ЭПР, а его домен ORD переносит липиды между мембранами.","За один цикл молекула холестерина переходит из ЭПР в Гольджи, а молекула PI4P — обратно; в ЭПР PI4P гидролизует фосфатаза SAC1.","[[T79|PI4KIIIβ]] за счёт ATP создаёт [[T75|контрградиент PI4P]]; сам OSBP ATP не гидролизует."],"paragraphs":["Большая часть липидов синтезируется в ЭПР, а нужны они всем мембранам; холестерина в транс-Гольджи и плазматической мембране намного больше, чем в ЭПР. Часть липидов доставляют пузырьки, но через контакты идёт и [[T73|невезикулярный перенос]]: липид-транспортный белок извлекает молекулу липида из мембраны в гидрофобный карман и отдаёт её соседней мембране.","OSBP переносит холестерин против градиента благодаря обмену (Mesmin 2013). Белок связан одновременно с двумя мембранами, принимает холестерин в ЭПР и отдаёт его в Гольджи, а обратно переносит PI4P. В ЭПР PI4P гидролизует фосфатаза SAC1, поэтому его там мало; на Гольджи PI-4-киназа синтезирует PI4P заново, расходуя ATP. Так поддерживается контрградиент PI4P — постоянный перепад от Гольджи к ЭПР, который и движет обмен. Без синтеза PI4P перенос затухает, без стока в ЭПР обмен приближается к равновесию. Энергетически значим весь цикл: ATP расходуется при синтезе PI4P киназой, а сопряжённые обратный перенос PI4P и его гидролиз в ЭПР делают обмен направленным; по формулировке Mesmin 2013, гидролиз PI4P движет перенос стерола.","Масштаб цикла велик: по оценке Mesmin 2017, OSBP расходует около половины всего клеточного PI4P, и этот расход зависит от количества переносимого холестерина. В клетках RPE-1 ингибитор [[T80|OSW-1]] повышал сигнал PI4P в транс-Гольджи примерно в 5 раз, а холестерин накапливался в ЭПР и липидных каплях.","Тот же принцип используют родственные белки с другим грузом. [[T77|ORP5 и ORP8]] в контактах ЭПР с плазматической мембраной обменивают фосфатидилсерин на PI4P и обогащают плазматическую мембрану фосфатидилсерином (Chung 2015). [[T78|CERT]] переносит церамид из ЭПР в аппарат Гольджи, где из него синтезируется сфингомиелин (Hanada 2003); с Гольджи CERT связывается через PI4P, но обмена на PI4P не выполняет."],"trap":["Энергию для переноса холестерина даёт одна стадия цикла: либо синтез PI4P за счёт ATP, либо его гидролиз в ЭПР.","Энергетически значим весь цикл. PI-4-киназа восстанавливает PI4P на Гольджи за счёт ATP, OSBP переносит PI4P в ЭПР в обмен на холестерин, а SAC1 гидролизует его там; гидролиз делает обмен направленным (Mesmin 2013), синтез восполняет расходуемый PI4P. Без синтеза перенос затухает, без гидролиза обмен приближается к равновесию. Сам OSBP ATP не гидролизует."],"conditions":"Четырёхстадийный цикл OSBP — реконструкция на липосомах и опыты на клетках HeLa (Mesmin 2013; прочитан реферат). Расход PI4P, действие OSW-1 (20 нМ) и 25-гидроксихолестерина — клетки RPE-1, зонд PI4P и масс-спектрометрия (Mesmin 2017; прочитаны реферат и изложение результатов). ORP5/ORP8 — клетки HeLa и фибробласты мыши (Chung 2015, полный текст). CERT — клетки яичника китайского хомячка LY-A (Hanada 2003, реферат). Числа схемы — учебная модель практикума (вопрос 4, продвинутый уровень); подавление SAC1 и VAP в модели неполное: остаточная активность SAC1 3 % и остаточное число мостиков VAP–OSBP 8 %; от этих допущений зависят числа 49 и 35 %.","sources":["Mesmin2013","Mesmin2017","Chung2015","Hanada2003","Burgett2011"],"quiz":{"id":"S1-L24","question":"Почему OSBP может переносить холестерин из ЭПР в аппарат Гольджи, где холестерина больше, хотя сам не гидролизует ATP?","options":[{"id":"S1-L24-1","text":"Холестерин идёт по градиенту: в ЭПР его больше","correct":false,"feedback":"В ЭПР холестерина меньше, чем в транс-Гольджи; перенос идёт против его градиента."},{"id":"S1-L24-2","text":"OSBP гидролизует ATP в каждом цикле переноса","correct":false,"feedback":"АТФазной активности у OSBP нет; ATP расходует PI-4-киназа, синтезирующая PI4P."},{"id":"S1-L24-3","text":"Перенос сопряжён с обратным переносом PI4P","correct":true,"feedback":"Обмен идёт один к одному: холестерин движется против своего градиента, PI4P — по своему. Перепад PI4P создаёт PI-4-киназа за счёт ATP и поддерживает SAC1, гидролизующая PI4P в ЭПР."}]},"widget":{"kind":"q4osbp","title":"","s":{"title":"Цикл OSBP: что происходит при разных вмешательствах","status":"Учебная модель, условные величины (та же, что в практикуме)","modes_label":"Условие","modes":["контроль","ингибитор PI4KIIIβ","OSW-1","SAC1 подавлена","VAP подавлены"],"golgi":"транс-Гольджи","er":"ЭПР","kin":"PI4KIIIβ","osbp":"OSBP","vap":"VAP","sac":"SAC1","chol":"холестерин","pi4p":"PI4P","atp":"ATP → ADP","b_pg":"PI4P в Гольджи, ×","b_pe":"PI4P в ЭПР, ×","b_j":"перенос холестерина, %","b_r":"холестерин Гольджи/ЭПР","legend":"Пунктир со стрелкой — перенос липида; его яркость пропорциональна переносу. Значения относительно контроля, кроме отношения холестерина.","notes":["Киназа синтезирует PI4P, OSBP обменивает его на холестерин, SAC1 гидролизует PI4P в ЭПР: холестерина в Гольджи в 4 раза больше, чем в ЭПР.","Без PI4P холестерин не на что обменивать: перенос снижается до 20 % от контроля.","OSW-1 тормозит OSBP: синтез PI4P продолжается, PI4P накапливается в Гольджи, перенос холестерина 16 % от контроля.","При подавленной SAC1 (активность около 3 % от нормы) PI4P накапливается в ЭПР, перепад уменьшается, и обмен приближается к равновесию: перенос 49 % от контроля.","При подавленных VAP-A и VAP-B (мостиков VAP–OSBP остаётся около 8 % от нормы) OSBP редко связывает две мембраны: перенос 35 % от контроля, PI4P остаётся в Гольджи."]}},"section":3,"number":24,"question":4},{"id":"calcium-contact","questions":[4],"title":"Почему контакт с ЭПР ускоряет захват Ca²⁺ митохондрией","keywords":["IP₃R","VDAC","MCU","MICU1","MICU2","микродомен","порог","дегидрогеназы","кальций","Δψ"],"lead":["При открытии рецепторов IP₃ в зазоре контакта ЭПР — митохондрия возникает микродомен Ca²⁺ порядка 10 мкМ.","Канал MCU с регулятором MICU1 открывается при концентрации Ca²⁺ выше примерно 1 мкМ, поэтому захват идёт прежде всего у контакта."],"mechanism":["Ca²⁺ выходит из ЭПР через IP₃R в зазор, проходит наружную мембрану через [[T82|VDAC]] и входит в матрикс через MCU по [[T03|электрохимическому градиенту]].","[[T81|MICU1]] удерживает MCU закрытым при низком Ca²⁺ и обеспечивает кооперативное открытие при высоком; отсюда кажущийся порог около 1 мкМ.","Ca²⁺ матрикса активирует дегидрогеназы цикла Кребса; работу по накоплению Ca²⁺ совершает дыхательная цепь, создавшая [[T04|Δψ]]."],"paragraphs":["Рецепторы IP₃ есть и в зоне контакта ЭПР с митохондрией. Когда они открываются, Ca²⁺ из просвета ЭПР входит в узкий зазор и достигает митохондрии раньше, чем рассеется по цитозолю и свяжется с буферами. Так возникает [[T83|микродомен]]: в клетках RBL-2H3 сенсор, закреплённый в зазоре, показал подъём Ca²⁺ в среднем около 9 мкМ, в части клеток — до 25 мкМ, и авторы считают эти значения нижней оценкой (Csordás 2010); по данным Giacomello 2010, у небольших участков поверхности митохондрий Ca²⁺ был в 5–10 раз выше, чем в остальном цитозоле.","Движущая сила для входа Ca²⁺ в матрикс велика при любой концентрации в цитозоле, и MCU — высокоселективный канал (Kirichok 2004). Однако захват ведёт себя так, будто у него низкое сродство к Ca²⁺. Причина — регулятор MICU1 (Csordás 2013): примерно до 0,5–1 мкМ он удерживает канал закрытым, выше обеспечивает крутое, кооперативное открытие. Без MICU1 порог снижается: митохондрии гепатоцитов мыши и клеток HeLa захватывали Ca²⁺ уже при 0,3–0,4 мкМ, а рост захвата с повышением Ca²⁺ был менее крутым.","Поэтому микродомен делает захват быстрым и избирательным по месту: митохондрия отвечает на выброс Ca²⁺ из ЭПР и почти не отвечает на небольшие подъёмы среднего уровня. Контакт не служит единственным условием входа: при подъёме Ca²⁺ во всём цитозоле выше порога MCU работает и вне контактов. Ca²⁺ матрикса активирует пируватдегидрогеназный комплекс, изоцитратдегидрогеназу и 2-оксоглутаратдегидрогеназу (Denton 2009) и тем связывает сигнал с окислением субстратов. Избыточный захват опасен: при искусственном сужении зазора митохондрии легче перегружались Ca²⁺ (Csordás 2006)."],"trap":["MCU — насос, который закачивает Ca²⁺ в матрикс против градиента.","MCU — канал: Ca²⁺ входит через него в матрикс по электрохимическому градиенту, потому что матрикс заряжен отрицательно. Накопление Ca²⁺ в матриксе выше цитозольного уровня обеспечивает дыхательная цепь, создавшая Δψ."],"conditions":"Ca²⁺ в зазоре: Csordás 2010 — клетки RBL-2H3, сенсор на индуцируемой привязке между ЭПР и митохондрией, стимуляция через рецепторы IP₃ (полный текст); Giacomello 2010 — культивируемые клетки человека, сенсор на наружной мембране митохондрии (прочитан реферат). MICU1: Csordás 2013 — гепатоциты мыши после подавления MICU1 in vivo и клетки HeLa (полный текст). Перегрузка при сужении зазора — клетки RBL-2H3 с искусственной привязкой (Csordás 2006, полный текст). Числа схемы — учебная модель практикума (вопрос 4, базовый уровень): Ca²⁺ в зазоре 15 мкМ, кривые захвата — уравнение Хилла. Ca²⁺ в матриксе рассчитан по условному балансу: 0,1 мкМ + 20 мкМ × скорость захвата (доля от максимальной); выведение Ca²⁺ из матрикса, буферирование и изменение Δψ отдельно не моделируются, поэтому это иллюстрация, а не прогноз концентрации в опыте.","sources":["Csordas2010","Giacomello2010","Kirichok2004","Csordas2013","Denton2009","Csordas2006","Szabadkai2006"],"quiz":{"id":"S1-L25","question":"Свободный Ca²⁺ в матриксе стал выше, чем в цитозоле. Что совершило работу по его накоплению?","options":[{"id":"S1-L25-1","text":"Дыхательная цепь, создавшая Δψ митохондрии","correct":true,"feedback":"Ca²⁺ входит через MCU по электрохимическому градиенту: отрицательный заряд матрикса перевешивает разность концентраций. Этот потенциал создаёт дыхательная цепь, перенося протоны из матрикса."},{"id":"S1-L25-2","text":"Канал MCU, расходующий ATP на перенос","correct":false,"feedback":"MCU — канал, ATP он не гидролизует; Ca²⁺ проходит через него только по электрохимическому градиенту."},{"id":"S1-L25-3","text":"Регулятор MICU1, связывающий ионы Ca²⁺","correct":false,"feedback":"MICU1 меняет вероятность открытия канала, но работы по переносу не совершает: связывание Ca²⁺ EF-мотивами — регуляция, а не перенос."}]},"widget":{"kind":"q4ca","title":"","s":{"title":"Скорость захвата Ca²⁺ через MCU в зоне контакта и вне её","status":"Учебная модель, условные величины (та же, что в практикуме)","st_label":"Стимул","sts":["покой","открытие IP₃R","вход извне до 0,4 мкМ","вход извне до 3 мкМ"],"mi_label":"MICU1","mis":["есть","нет"],"co_label":"Контакт","cos":["обычный","меньше тетеринг-белков"],"x":"свободный Ca²⁺ у внутренней мембраны, мкМ (логарифмическая шкала)","y":"скорость захвата, % от максимальной","c_with":"с MICU1","c_without":"без MICU1","p_gap":"зазор","p_bulk":"цитозоль","m_gap":"Ca²⁺ в зазоре","m_bulk":"Ca²⁺ в цитозоле","m_u":"Захват","m_share":"Через зону контакта","m_m":"Ca²⁺ в матриксе","u_uM":"мкМ","notes":["Покой: Ca²⁺ ниже порога, захват почти не идёт.","Открытие IP₃R: в зазоре Ca²⁺ выше порога, захват идёт прежде всего через зону контакта.","Подъём во всём цитозоле до 0,4 мкМ ниже порога: с MICU1 захват почти не идёт.","Подъём во всём цитозоле до 3 мкМ выше порога: захват идёт по всей поверхности, и контакт для него не обязателен."],"note_no":" Без MICU1 захват при низком Ca²⁺ выше, а его рост с повышением Ca²⁺ менее крутой.","note_low":" Тетеринг-белков меньше: зазор шире, и микродомен у митохондрии слабее.","legend":"Точки на кривой — Ca²⁺ в зазоре и в остальном цитозоле при выбранном стимуле. Ось концентраций логарифмическая. Ca²⁺ в матриксе — условный расчёт по скорости захвата (0,1 мкМ + 20 мкМ × доля от максимальной); выведение и буферирование Ca²⁺ в матриксе не моделируются."}},"section":3,"number":25,"question":4},{"id":"area-flux","questions":[4],"title":"Почему рост площади контакта не означает роста переноса","keywords":["площадь контакта","поток","лимитирующая стадия","ширина зазора","оптимум","гипотеза"],"lead":["Контакт сокращает расстояние, но сам ничего не переносит: поток задают переносчики, движущая сила и буферы.","О росте переноса при росте площади контакта можно судить, только если перенос измерен отдельно."],"mechanism":["Поток через контакт ограничивает самая медленная стадия: синтез PI4P, его гидролиз в ЭПР, число и занятость переносчиков или каналов.","Если поток ограничен синтезом PI4P, дополнительные мостики VAP–OSBP почти не увеличивают перенос холестерина.","Слишком тесное сближение может мешать переносу; оптимальная ширина зазора — гипотеза, подтверждённая лишь отдельными опытами."],"paragraphs":["Сближение мембран меняет условия переноса, но не создаёт его. Поток через контакт определяется числом и занятостью переносчиков и каналов в зоне сближения, движущей силой, буферами и тем, насыщен ли принимающий компартмент. Из уменьшения расстояния не следует автоматически ни рост концентрации, ни ускорение переноса.","Модель цикла OSBP показывает это численно. На каждую перенесённую молекулу холестерина нужна молекула PI4P, синтезированная PI-4-киназой. Если вдвое увеличить число мостиков VAP–OSBP при прежней активности PI4KIIIβ и SAC1, перенос вырастет лишь на 9 %, а PI4P в Гольджи снизится: OSBP быстрее извлекает уже имеющийся PI4P. Удвоение синтеза PI4P, напротив, почти удваивает перенос. Заметно зависит от площади перенос лишь тогда, когда мостиков мало: при половинной площади он снижается до 86 %.","С геометрией связаны и ограничения другого рода. Слишком узкий зазор не вмещает крупные белковые комплексы. В клетках RBL-2H3 искусственные привязки разной длины меняли подъём Ca²⁺ в зазоре двухфазно: самые тесные контакты не были самыми эффективными (Csordás 2010). Предположение, что для каждого вида переноса существует оптимальная ширина зазора, систематически не проверено и остаётся гипотезой.","Отсюда правило чтения работ: сообщение об увеличении площади контактов при болезни или воздействии — ещё не сообщение об увеличении переноса (Calì 2025). Площадь может меняться и как следствие изменения обмена веществ."],"trap":["Если площадь контакта выросла вдвое, перенос через контакт тоже вырос вдвое.","Поток задаёт самая медленная стадия: синтез PI4P, его гидролиз, число переносчиков или каналов, движущая сила. Если ограничивает не площадь, её рост почти не меняет перенос; перенос нужно измерить отдельно."],"conditions":"Зависимость переноса от площади — учебная модель практикума (вопрос 4, продвинутый уровень): «площадь» — число мостиков VAP–OSBP, «синтез вдвое выше» — учебное допущение. Двухфазная зависимость подъёма Ca²⁺ в зазоре от длины искусственной привязки — клетки RBL-2H3, Csordás 2010 (полный текст). Рекомендация отделять площадь от переноса — Calì 2025 (обзор, полный текст).","sources":["Csordas2010","Cali2025","Mesmin2017"],"quiz":{"id":"S1-L26","question":"По данным ЭМ площадь контактов ЭПР — митохондрия в клетках после некоторого воздействия вдвое больше, чем в контроле. Что можно заключить о переносе Ca²⁺ в митохондрии?","options":[{"id":"S1-L26-1","text":"Перенос Ca²⁺ вырос примерно вдвое","correct":false,"feedback":"Пропорциональный рост предполагает, что поток ограничен площадью. Его могут ограничивать каналы, MICU1, выход Ca²⁺ из ЭПР или буферы."},{"id":"S1-L26-2","text":"Без измерения переноса вывод сделать нельзя","correct":true,"feedback":"ЭМ измеряет геометрию. Чтобы судить о переносе, нужно при одинаковом стимуле измерить скорость захвата или Ca²⁺ в матриксе (Calì 2025)."},{"id":"S1-L26-3","text":"Перенос Ca²⁺ снизился: тесный контакт мешает","correct":false,"feedback":"Двухфазная зависимость от ширины зазора показана для отдельных конструкций; площадь не равна ширине, и без измерения вывод о снижении так же необоснован."}]},"widget":{"kind":"q4area","title":"","s":{"title":"Перенос холестерина через OSBP при разной площади контакта","status":"Учебная модель, условные величины (та же, что в практикуме)","area":"Площадь контакта (число мостиков VAP–OSBP), × от обычной","syn_label":"Синтез PI4P","syns":["обычный","вдвое выше"],"x":"площадь контакта, × от обычной","y":"перенос холестерина, % от контроля","c1":"синтез обычный","c2":"синтез вдвое выше","m_j":"Перенос холестерина","m_pg":"PI4P в Гольджи","pct":"% от контроля","note":"Перенос растёт с площадью медленно: его ограничивает синтез PI4P. Удвоение синтеза поднимает всю кривую почти вдвое.","legend":"Кривые — расчёт по модели практикума; точка — выбранная площадь."}},"section":3,"number":26,"question":4},{"id":"coordination","questions":[4],"title":"Что ещё координирует контакт и чем он не является","keywords":["деление митохондрий","Drp1","Rab7","TBC1D15","FIS1","лизосома","MFN2","Шарко — Мари — Тута","аутофагия","слияние"],"lead":["Контакты отмечают места деления митохондрий и сводят в одном месте синтез липидов, Ca²⁺-сигнал и энергетический обмен.","Контакт не равен ни везикулярному транспорту, ни слиянию органелл, ни аутофагии."],"mechanism":["Трубочка ЭПР охватывает митохондрию в месте будущего деления ещё до того, как туда привлекается Drp1.","Rab7, связанный с GTP, поддерживает контакт митохондрии с лизосомой; после гидролиза GTP на Rab7 контакт расходится.","При контакте целостность мембран сохраняется, содержимое не смешивается, партнёр не разрушается."],"paragraphs":["Место деления митохондрии часто задаёт контакт. В клетках дрожжей и млекопитающих митохондрия делилась там, где её охватывала трубочка ЭПР; сужение начиналось ещё до привлечения динамин-подобного белка Drp1 (Friedman 2011). Контакт с лизосомой тоже отмечает точку деления. Его образованию способствует Rab7, связанный с GTP, а расхождению — гидролиз GTP на Rab7; этот гидролиз стимулирует белок TBC1D15, который привлекается к митохондрии белком FIS1 (Wong 2018).","Контакт сводит в одном месте синтез липидов, Ca²⁺-сигнал и энергетический обмен, поэтому изменение числа, состава или геометрии контактов может менять несколько потоков одновременно. Какие из них изменились, устанавливают отдельными измерениями: если поток ограничивает другое звено, он может почти не измениться. Изменения контактов описаны при нейродегенеративных болезнях, нарушениях обмена и опухолевом росте, но площадь контакта может быть и причиной, и следствием изменения метаболизма; важно, измерена ли функция или только морфология.","Пример осторожного вывода — ген MFN2. Мутации в нём вызывают наследственную моторно-сенсорную нейропатию Шарко — Мари — Тута типа 2A (Züchner 2004). Белок участвует в слиянии митохондрий, а ЭПР-специфический вариант того же гена ERMIT2 удерживает ЭПР у митохондрии (Naón 2023). Продукты гена выполняют несколько функций, поэтому приписывать болезнь только нарушению контактов нет оснований.","Контакт легко спутать с тремя другими процессами. При везикулярном транспорте груз упакован в пузырёк, который сливается с мембраной-получателем. При слиянии органелл мембраны объединяются и содержимое смешивается. При аутофагии органелла-партнёр разрушается. При контакте мембраны сохраняются, содержимое не смешивается, а органелла-партнёр не разрушается."],"trap":["Контакт митохондрии с лизосомой — начало её разрушения в лизосоме.","Контакты митохондрий с лизосомами образуются и в здоровых клетках и отличаются от поглощения повреждённых митохондрий: обе органеллы сохраняют целостность, а контакт расходится после гидролиза GTP на Rab7 (Wong 2018)."],"conditions":"Деление в месте контакта с ЭПР — дрожжи и клетки COS-7 (Friedman 2011, реферат). Контакты митохондрий с лизосомами, Rab7 Q67L и мутанты TBC1D15 — клетки HeLa и HCT116, прижизненная микроскопия и ЭМ (Wong 2018, полный текст). MFN2 и болезнь Шарко — Мари — Тута типа 2A — генетическое исследование семей (Züchner 2004). Таблица — сводка данных.","sources":["Friedman2011","Wong2018","Zuchner2004","Csordas2013","Mesmin2017","Naon2023"],"quiz":{"id":"S1-L27","question":"В клетках экспрессировали Rab7 Q67L — форму, которая связывает GTP, но почти не гидролизует его. Как изменится длительность контактов митохондрий с лизосомами?","options":[{"id":"S1-L27-1","text":"Сократится: Rab7-GTP разрывает контакт","correct":false,"feedback":"Rab7, связанный с GTP, способствует образованию контакта; разрыв требует гидролиза GTP."},{"id":"S1-L27-2","text":"Не изменится: Rab7 влияет только на лизосому","correct":false,"feedback":"Rab7 на лизосоме участвует в связи с митохондрией: от его состояния зависит, сколько длится контакт."},{"id":"S1-L27-3","text":"Увеличится: без гидролиза GTP он не расходится","correct":true,"feedback":"Контакт расходится после гидролиза GTP на Rab7; этот гидролиз стимулирует белок TBC1D15. В клетках с Rab7 Q67L контакты длились дольше, а митохондрии делились реже (Wong 2018)."}]},"widget":{"kind":"table","title":"","s":{"title":"Контакт как узел координации; чем контакт не является","status":"Сводка данных","modes_label":"Показать","modes":["Что координирует контакт","Контакт и другие процессы"],"tables":[{"head":["Контакт","Что координирует","Белки","Источник"],"rows":[["ЭПР — митохондрия","место деления митохондрии","трубочка ЭПР, затем Drp1","Friedman 2011"],["митохондрия — лизосома","место деления, длительность контакта","Rab7-GTP, TBC1D15, FIS1","Wong 2018"],["ЭПР — митохондрия","передача Ca²⁺, активация дегидрогеназ","IP₃R, VDAC, MCU, MICU1","Csordás 2013"],["ЭПР — транс-Гольджи","распределение холестерина, обмен PI4P","VAP, OSBP, PI4KIIIβ, SAC1","Mesmin 2017"]],"note":"Один контакт сводит в одном месте несколько потоков, поэтому изменение числа контактов может менять их одновременно; какие потоки изменились, показывают отдельные измерения."},{"head":["Процесс","Мембраны","Содержимое","Органелла-партнёр"],"rows":[["контактный сайт","обе не повреждены","не смешивается","сохраняется"],["везикулярный транспорт","пузырёк сливается с мембраной-получателем","груз пузырька попадает в получатель","сохраняется"],["слияние органелл","объединяются","смешивается","две органеллы становятся одной"],["аутофагия","органелла окружается мембраной и доставляется в лизосому","расщепляется","разрушается"]],"note":"Контакт отличают по двум признакам: смешивается ли содержимое и разрушается ли партнёр."}]}},"section":3,"number":27,"question":4},{"id":"prove-contact","questions":[4],"title":"Как доказывают, что мембраны в контакте, а не слились","keywords":["колокализация","разрешение 200 нм","электронная томография","криоэлектронная томография","FRET","BRET","split-GFP","SPLICS","маркеры просветов"],"lead":["Каждый метод устанавливает свой признак контакта и имеет свои ограничения.","Колокализация в обычном световом микроскопе контакт не доказывает, а репортёр из двух половин может сам стабилизировать контакт."],"mechanism":["Обычный световой микроскоп разрешает около 200–250 нм в плоскости препарата и 500–700 нм по оси z — много больше зазора контакта, поэтому контакт, слияние и соседство в нём неразличимы.","[[T87|Электронная томография]] измеряет зазор; FRET и BRET дают сигнал только при сближении донора и акцептора примерно до 10 нм.","[[T89|Репортёр из двух половин]] накапливает сигнал от всех контактов за время экспрессии и может их стабилизировать; раздельность содержимого проверяют маркерами просветов."],"paragraphs":["Разрешение обычного светового микроскопа — около 200–250 нм в плоскости препарата и 500–700 нм по оси z (Scorrano 2019), а зазор контакта ЭПР — митохондрия — 10–30 нм. К тому же маркер находится не на самой поверхности мембраны. Поэтому перекрывание сигналов маркеров двух органелл одинаково выглядит при контакте, при слиянии и при простом соседстве: колокализация в обычном микроскопе не доказывает контакта и не даёт расстояния между мембранами.","Расстояние между мембранами измеряет электронная микроскопия, особенно томография, дающая трёхмерную картину зазора (Csordás 2006). Криоэлектронная томография обходится без химической фиксации: в клетках с избытком E-Syt зазор между ЭПР и плазматической мембраной составлял 19–22 нм (Fernández-Busnadiego 2015). ЭМ показывает геометрию в один момент, но не перенос.","Сигнал только при сближении дают FRET и BRET: при FRET возбуждённый донор безызлучательно передаёт энергию акцептору на расстоянии примерно до 10 нм, в BRET донором служит люцифераза. При комплементации расщеплённого флуоресцентного белка (split-GFP, SPLICS) половины, закреплённые на разных органеллах, при сближении собираются в целый белок. Сборка малообратима, поэтому репортёр накапливает сигнал от всех сближений за время экспрессии; версии SPLICS регистрировали узкие (8–10 нм) и широкие (40–50 нм) контакты ЭПР с митохондриями (Cieri 2018). При избыточной экспрессии такие репортёры способны стабилизировать контакты и увеличить измеряемую площадь (Filadi 2026).","От слияния контакт отличает раздельность содержимого: маркеры просветов двух органелл не смешиваются. Количественный вывод, полученный репортёром, подтверждают методом без искусственной привязки."],"trap":["Чем ярче сигнал репортёра из двух половин, тем больше контактов было в клетке до измерения.","Сборка половин малообратима: репортёр накапливает сигнал от всех контактов за время экспрессии и при избытке может их стабилизировать. Сигнал отражает и саму конструкцию, поэтому вывод проверяют методом без искусственной привязки, например ЭМ."],"conditions":"Предел разрешения и сравнение методов — Scorrano 2019 (полный текст PMC: 250 нм в плоскости, 500–700 нм по оси z); обзоры Filadi 2026 и Calì 2025 (прочитаны рефераты). Электронная томография связей ЭПР — митохондрия — митохондрии печени крысы и клетки DT40 (Csordás 2006, полный текст). Криоэлектронная томография контактов E-Syt — клетки COS-7 (Fernández-Busnadiego 2015, реферат). SPLICS — клетки HeLa и HEK293, нейроны рыбки данио in vivo (Cieri 2018, полный текст). Схемы — схемы методов; расстояния не в масштабе.","sources":["Csordas2006","FernandezBusnadiego2015","Cieri2018","Filadi2026","Cali2025","Scorrano2019"],"quiz":{"id":"S1-L28","question":"FRET между донором на мембране ЭПР и акцептором на наружной мембране митохондрии вырос. Что показывает этот результат?","options":[{"id":"S1-L28-1","text":"Мембраны двух органелл слились","correct":false,"feedback":"FRET требует сближения донора и акцептора, но не слияния; о содержимом компартментов он ничего не говорит."},{"id":"S1-L28-2","text":"Донор и акцептор сблизились примерно до 10 нм","correct":true,"feedback":"FRET возникает, когда донор и акцептор находятся на расстоянии около 10 нм и ближе. Это сближение конструкций; зазор между мембранами зависит ещё от их длины и ориентации."},{"id":"S1-L28-3","text":"Через контакт стало проходить больше Ca²⁺","correct":false,"feedback":"FRET регистрирует сближение, а не поток; перенос Ca²⁺ измеряют отдельно, например сенсором Ca²⁺ в матриксе."}]},"widget":{"kind":"method","title":"","s":{"title":"Методы: как установить признаки контакта","status":"Схемы методов","modes_label":"Метод","modes":["Световой микроскоп","ЭМ-томография","FRET и BRET","Репортёр из двух половин","Что устанавливает каждый метод"],"schemes":[{"draw":"q4light","h":260,"l":{"pA":"А","a":"Контакт: зазор 20 нм","pB":"Б","b":"Слияние","res":"в микроскопе оба случая дают одно перекрывающееся пятно","bar":"≈ 200 нм"},"note":"Предел разрешения обычного светового микроскопа около 200 нм в плоскости препарата (по оси z хуже) — в десять раз больше зазора контакта; перекрывание сигналов контакт не доказывает и расстояния не даёт.","legend":"Микроскопия сверхразрешения снижает предел, но не всегда до размеров зазора."},{"draw":"q4em","h":250,"l":{"m1":"мембрана ЭПР","m2":"наружная мембрана митохондрии","gap":"зазор 10–30 нм","teth":"связи","res":"геометрия в один момент; перенос не измерен"},"note":"ЭМ-томография даёт трёхмерную картину и измеряет расстояние между мембранами; криоэлектронная томография обходится без химической фиксации.","legend":"Метод не показывает перенос и динамику контакта."},{"draw":"q4fret","h":260,"l":{"pA":"А","a":"Далеко: > 10 нм","pB":"Б","b":"Близко: ≤ 10 нм","don":"донор","acc":"акцептор","ex":"возбуждение","em_d":"свечение донора","em_a":"свечение акцептора","bret":"в BRET донор — люцифераза, возбуждать светом не нужно"},"note":"FRET — безызлучательная передача энергии от донора к акцептору на расстоянии примерно до 10 нм; доля переданной энергии растёт при сближении.","legend":"Расстояние между донором и акцептором не равно зазору между мембранами без учёта длины и ориентации конструкций."},{"draw":"q4split","h":270,"l":{"pA":"А","a":"Половины на разных мембранах","pB":"Б","b":"Сближение: белок собран","h1":"половина 1","h2":"половина 2","res_a":"нет сигнала","res_b":"сигнал; сборка малообратима","warn":"собранный белок удерживает мембраны, как искусственная привязка"},"note":"Репортёр накапливает сигнал от контактов за время экспрессии и при избытке способен стабилизировать контакты и увеличить измеряемую площадь.","legend":"Количественный вывод проверяют методом без искусственной привязки."},{"draw":"table","head":["Метод","Что устанавливает","Ограничение"],"rows":[["обычный световой микроскоп","сигналы неразличимы при данной оптике","контакт, слияние и соседство неразличимы"],["ЭМ и (крио)электронная томография","расстояние между мембранами, связи","один момент; перенос не измерен"],["FRET, BRET","сближение донора и акцептора до ≈ 10 нм","расстояние между конструкциями, а не мембранами"],["репортёр из двух половин (split-GFP, SPLICS)","накопленные сближения","может стабилизировать контакт"],["маркеры просветов","раздельность содержимого","не измеряет расстояние"],["удаление тетеринг-белка","необходимость белка для геометрии и функции","побочные эффекты удаления"]],"note":"Каждый признак контакта устанавливают своим методом; результат записывают перечнем установленных признаков."}]}},"section":3,"number":28,"question":4},{"id":"methods","questions":[1,2,3,4],"title":"Как выбрать величину, метод и контроль","keywords":["метод","контроль","величина","биосенсор","ратиометрия","лизат","необходимость","достаточность","электронная томография"],"lead":["Для каждого механизма семинара сначала решают, какую величину измерять, затем — каким методом и с каким контролем.","Во всех четырёх разделах одно и то же наблюдение совместимо с несколькими механизмами, и разделяют их только правильно выбранные величина и контроль."],"mechanism":["Величина: pH и свободный Ca²⁺ в просвете органеллы, концентрация в точке и средняя по клетке, содержание метки на мембране, расстояние между мембранами и поток через контакт — разные измерения, и одно не заменяет другое.","Метод: адресованный ратиометрический сенсор с калибровкой, прижизненная съёмка с пространственным разрешением, сенсор на основе липид-связывающего домена, электронная томография и измерение переноса.","Контроль: удаление белка или метки показывает [[T90|необходимость]], а перенос фермента в новое место или искусственная привязка — [[T91|достаточность]]; каждый инструмент проверяют на то, не меняет ли он сам измеряемую величину."],"paragraphs":["Каждый из четырёх механизмов описывается своей величиной. Для компартмента это pH, свободный Ca²⁺ или потенциал пары глутатиона в просвете конкретной органеллы; их измеряют сенсором, адресованным в эту органеллу, по отношению сигналов при двух длинах волн и с калибровкой в крайних точках. Для локальной концентрации нужна величина в точке, а не средняя: анализ лизата уничтожает именно ту пространственную информацию, которая определяет ответ.","Для липидного кода величина — содержание определённого фосфоинозитида на определённой мембране. Сенсор на основе одного домена показывает места, где липид сочетается с условиями связывания, и сам конкурирует с эндогенными эффекторами; липидомика даёт состав, но теряет локализацию. Причинность метки проверяют вмешательством: фосфатазу переносят на мембрану за минуты и смотрят, что меняется. Для контакта величины три: расстояние между мембранами (электронная томография), состав белков в зоне сближения и поток вещества, который измеряют отдельно.","Контроль отвечает на вопрос, который задаёт опыт. Удаление белка показывает, что без него процесс нарушается, но не то, что белок сам выполняет процесс. Достаточность проверяют добавлением: фермент переносят в новое место, мембраны соединяют искусственной привязкой. Наконец, у каждого инструмента есть собственное действие: сенсор буферирует лиганд, репортёр из двух половин стабилизирует контакт, ингибитор в высокой дозе действует и на другие мишени. Переключайте механизмы в таблице и сравнивайте строки «ограничение»."],"trap":["Если белок необходим для процесса, его достаточно, чтобы этот процесс шёл.","Удаление белка показывает только необходимость. Достаточность проверяют
