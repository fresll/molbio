е). Рост X невелик, так как часть X в модели составляет свёрнутая форма, которую препарат не затрагивает. Затронутые маршруты: {r}.", "s4a_c_ubonly_z": "Меченая форма чувствительнее общего уровня X, пока у белка есть запасные маршруты; но она не говорит, какой маршрут подавлен.", "s4a_c_down": "{x}, {d}: уровень X снизился до {l} ×, меченая форма почти не изменилась ({u} % общего X контроля). Прямо затронутые маршруты: {r}; при этом другой маршрут усилился (при подавлении протеасомы p62 чаще образует олигомеры), поэтому X удаляется быстрее.", "s4a_c_down_z": "Снижение X при подавлении одного маршрута — признак перераспределения нагрузки. Поэтому отсутствие накопления не подтверждает, что подавленный маршрут вообще не участвует в удалении.", "s4a_c_flat": "{x}, {d}: X ({l} ×) и его убиквитинированные формы ({u} % общего X контроля) почти не изменились. Затронутые препаратом маршруты у этого субстрата: {r}.", "s4a_c_flat_z": "Отсутствие эффекта допускает три объяснения: подавленный маршрут не участвует, его полностью замещает другой, препарат не достиг мишени. Блот с одним препаратом их не различает.", "p4a_1_q": "Белок X — растворимый короткоживущий белок цитозоля. Первая дорожка — контроль (X принят за 1). Клетки обрабатывают MG132 6 ч. Что покажет блот?", "p4a_1_o1": "X вырастет примерно в 1,4 раза, убиквитинированные формы вырастут сильнее", "p4a_1_o2": "X не изменится: ингибитор протеасомы не действует на белки цитозоля", "p4a_1_o3": "X вырастет, а убиквитинированные формы исчезнут: ингибитор снимает метку", "p4a_1_e": "X вырос до 1,4 × контроля, убиквитинированные формы — с 10 до 41 % общего X контроля. Метка поставлена, но повреждённая форма не расходуется, потому что протеасома заблокирована: это блок после убиквитинирования. Рост умеренный: в контроле около 60 % общего X в модели составляет уже свёрнутая форма, которую препарат не затрагивает, а часть повреждённой формы по-прежнему удаляется аутофагией. Рефолдинг переводит молекулы в свёрнутую форму и сам по себе общий X на блоте не уменьшает. MG132 подавляет и кальпаин (Tsubuki 1996), поэтому один препарат не подтверждает вклад именно протеасомы.", "p4a_1_w2": "В заданной модели протеасома удаляет повреждённую фракцию растворимого белка цитозоля, поэтому при её подавлении X накапливается. В реальном эксперименте отсутствие накопления само по себе не исключает участия протеасомы.", "p4a_1_w3": "Ингибитор протеасомы не снимает метку: он блокирует расходование помеченного белка, поэтому меченая форма растёт, а не исчезает.", "p4a_2_q": "Белок X — растворимый неправильно свёрнутый N-гликозилированный белок в просвете ЭПР; его передача в ERAD зависит от отщепления маннозы (как у α1-антитрипсина, Liu 1999). Первая дорожка — контроль. Клетки обрабатывают кифунензином 6 ч. Что покажет блот?", "p4a_2_o1": "X не изменится: кифунензин действует только на гликозилирование", "p4a_2_o2": "X вырастет, убиквитинированные формы вырастут сильнее, как при ингибиторе протеасомы", "p4a_2_o3": "X вырастет, а убиквитинированных форм не станет больше: блок стоит до убиквитинирования", "p4a_2_e": "X вырос до 2,1 × контроля, а меченая форма не выросла (1 % общего X контроля против 5 % в контроле). Эффект выводится из свойств X, заданных в условии: это растворимый N-гликозилированный субстрат, который передаётся в ERAD после отщепления маннозы. Кифунензин ингибирует α1,2-маннозидазы ЭПР, поэтому такой субстрат в ERAD не передаётся, и его оборот останавливается (Liu 1999, α1-антитрипсин в гепатомных клетках; «маннозный таймер» растворимых гликопротеинов — Christianson 2023). Белок остаётся в просвете ЭПР; в модели принято, что метку он не получает. Для субстрата без N-гликанов или с иным способом узнавания эффекта кифунензина ожидать нельзя. Ингибитор протеасомы дал бы иной узор: рост X вместе с ростом меченой формы.", "p4a_2_w1": "Маннозидаза ЭПР нужна для передачи субстрата в ERAD, и её ингибитор останавливает оборот таких субстратов (Liu 1999). X накапливается.", "p4a_2_w2": "Рост меченой формы означал бы, что блок стоит после убиквитинирования (протеасома или p97). Кифунензин действует раньше: субстрат не получает метку.", "p4a_3_q": "Белок X — белок наружной мембраны митохондрии, помеченный Parkin (вопрос 2), в деполяризованных клетках с избытком Parkin. Первая дорожка — контроль. Клетки обрабатывают CB-5083 (ингибитор p97) 6 ч. Что покажет блот?", "p4a_3_o1": "X не изменится: наружную мембрану очищает только митофагия", "p4a_3_o2": "X вырастет, убиквитинированные формы вырастут сильнее: p97 извлекает помеченный белок из мембраны", "p4a_3_o3": "X снизится: освободившиеся молекулы уходят в митофагию", "p4a_3_e": "X вырос до 2,6 × контроля, убиквитинированные формы — с 50 до 226 % общего X контроля. В клетках с избытком Parkin p97 нужен, чтобы извлечь белки наружной мембраны, помеченные Parkin, и передать их протеасоме; без p97 они накапливаются, и митофагия подавлена (Tanaka 2010). CB-5083 блокирует и другие p97-зависимые процессы, например ERAD (Anderson 2015), поэтому вывод относится к препарату, а не к одному белку.", "p4a_3_w1": "Белки наружной мембраны, помеченные Parkin, разрушает протеасома после извлечения p97 независимо от митофагии (Chan 2011). При блоке p97 они накапливаются.", "p4a_3_w3": "В клетках с избытком Parkin митофагия, запускаемая Parkin, сама нуждается в p97 (Tanaka 2010). При его блоке освободившихся молекул, которые ушли бы в митофагию, нет.", "p4a_4_q": "Белок X — агрегат в просвете ЭПР, который ERAD не принимает. Первая дорожка — контроль. Клетки обрабатывают бафиломицином A1 6 ч. Что покажет блот и какой вывод он допускает?", "p4a_4_o1": "X вырастет; вывод: часть X удаляется в лизосоме, но блот не различает ERLAD и ER-фагию и не устанавливает участие FAM134B", "p4a_4_o2": "X вырастет; вывод: X удаляется именно ER-фагией через рецептор FAM134B", "p4a_4_o3": "X не изменится; вывод: лизосома в удалении X не участвует", "p4a_4_e": "X вырос до 1,5 × контроля, меченая форма почти не изменилась (7 % против 5 %). Бафиломицин нарушает закисление лизосом, и лизосомный груз накапливается. Положение X задано условием — агрегат в просвете ЭПР, — поэтому открытым остаётся способ его доставки в лизосому: ERLAD, ER-фагия с участием рецепторов или другой лизосомный путь. Блот этого не различает и участие FAM134B не устанавливает: для этого нужны локализация X относительно белка-ориентира ЭПР и нокаут рецептора. В модели принято, что бафиломицин подавляет и этот лизосомный путь; для ERLAD в использованных источниках это прямо не показано, поэтому принято как допущение.", "p4a_4_w2": "Роль рецептора в этом эксперименте не проверяли: блот с бафиломицином показывает только вклад лизосомного расщепления. Через какой рецептор груз попал в лизосому, он не показывает.", "p4a_4_w3": "В данных этого задания рост X при бафиломицине согласуется с участием лизосом в его удалении. Однако отсутствие роста само по себе не исключало бы лизосомный вклад: результат мог бы зависеть от полноты ингибирования, срока измерения и изменений других путей удаления X.", "p4a_5_q": "Белок X — агрегат в цитозоле; в контроле около 35 % общего X убиквитинировано. Первая дорожка — контроль. Клетки обрабатывают MG132 6 ч. Что покажет блот?", "p4a_5_o1": "X вырастет в 2 раза и больше: ингибитор блокирует главный маршрут", "p4a_5_o2": "X вырастет умеренно (до 1,3 ×): ингибитор блокирует часть маршрута", "p4a_5_o3": "X останется около контроля или снизится: основной маршрут агрегата — не протеасомный", "p4a_5_e": "X снизился до 0,9 × контроля, меченая форма почти не изменилась (32 % против 35 %). Агрегат протеасома не принимает, а при подавлении протеасомы избыток свободного убиквитина способствует олигомеризации p62 и усилению аутофагии (Pohl 2019); в модели этот эффект мгновенный и достаточен, чтобы X удалялся даже быстрее, его величина — учебное допущение. В клетках исход зависит от условий: усиление аутофагии развивается за часы, и накопление агрегатов при длительном подавлении протеасомы возможно. Отсутствие накопления не означает, что протеасома не участвует вообще, но для агрегата она не основной маршрут. Бафиломицин A1, напротив, поднял бы X до 1,4 ×.", "p4a_5_w1": "Агрегат не проходит в канал протеасомы, и в модели нет механизма, по которому подавление протеасомы привело бы к его накоплению, поэтому такой рост не следует из модели. Сам по себе рост X в реальном эксперименте не доказывал бы прямой протеасомный маршрут: подавление протеасомы меняет и другие процессы.", "p4a_5_w2": "В заданной модели при подавлении протеасомы ускоряется агрефагия, поэтому X немного снижается. Умеренный рост противоречит этому расчёту; в реальном эксперименте величина роста сама по себе не определяет долю протеасомного удаления.", "p4a_6_q": "Неизвестный белок X. Блот показывает контроль и четыре воздействия: MG132, бафиломицин A1, CB-5083, кифунензин. Какой вывод допускает блот и что нужно сделать дальше?", "p4a_6_o1": "Протеасомный маршрут (X растёт при MG132 и CB-5083); дальше достаточно второго ингибитора протеасомы", "p4a_6_o2": "Лизосомное расщепление вносит вклад (X растёт при бафиломицине A1, при остальных препаратах нет); расположение X и роль рецептора покажут локализация и нокаут рецептора", "p4a_6_o3": "ERAD (X растёт при кифунензине и CB-5083); неоднозначности нет, дальше ничего не нужно", "p4a_6_e": "X вырос при бафиломицине A1 (1,5 ×), а при MG132, CB-5083 и кифунензине остался около 1. Значит, заметный вклад вносит лизосомное расщепление, а вклада протеасомы, p97 и ERAD в этих условиях не видно; отсутствие эффекта не исключает замещающих маршрутов. Загаданный образец — агрегат в ЭПР, устойчивый к ERAD (например, полимеры α1-антитрипсина Z; Fregno 2018). Но положение X по блоту однозначно не определяется: рост X при бафиломицине A1 показывает лизосомный вклад, а не место, где находится белок. В учебной модели меченая форма агрегата в ЭПР при бафиломицине A1 почти не растёт (5 → 7 % общего X контроля), а у агрегата в цитозоле выросла бы до 117 %; но у реальных белков видимость метки на блоте различается, поэтому такое различие нельзя считать доказательством локализации. Следующий шаг — локализация X относительно ЭПР (иммунофлуоресценция с белком-ориентиром ЭПР, например калнексином) и нокаут рецептора FAM134B.", "p4a_6_w1": "При MG132 и CB-5083 X остался около 1,0 ×: вклада протеасомы и p97 на этом блоте не видно.", "p4a_6_w3": "На этом блоте X не накапливается при кифунензине и CB-5083, поэтому заявленного в варианте роста нет. Отсутствие эффекта кифунензина не исключает все варианты ERAD: чувствительность зависит от свойств субстрата и способа его распознавания. Для вывода о маршруте нужны дополнительные проверки.", "gn_q4_sub": "Субстрат: размер, отсек и метка", "g_q4_sub": "Судьбу повреждённой молекулы ограничивают три свойства. Размер: протеасома принимает одиночные развёрнутые полипептиды, которые проходят в её узкий канал, а крупные скопления, комплексы и органеллы удаляет аутофагия (Pohl 2019). Отсек: белок ЭПР недоступен протеасоме, пока комплекс SEL1L–HRD1 не выведет его в цитозоль; агрегат, который не проходит через этот путь, остаётся в ЭПР (Fregno 2018). Метка: белок наружной мембраны митохондрии получает убиквитин от Parkin. Большинство таких белков остаётся на мембране и удаляется вместе с органеллой, а немногие, например MFN1/2 и RHOT1/2, извлекаются p97 и разрушаются протеасомой даже при заблокированной митофагии (Narendra 2024). В модели пять субстратов: растворимый белок цитозоля; агрегат в цитозоле; растворимый белок ЭПР; агрегат в ЭПР, устойчивый к ERAD (полимеры α1-антитрипсина Z, проколлаген); белок наружной мембраны митохондрии с меткой Parkin (по типу MFN2). Для каждого определено, какие маршруты доступны.", "gn_q4_hsp70": "Hsp70, BiP и CHIP: рефолдинг или передача на деградацию", "g_q4_hsp70": "Hsp70 в цитозоле и его гомолог BiP в ЭПР помогают несвёрнутому белку свернуться; активностью Hsp70 управляют белки J-домена и факторы обмена нуклеотида (Rosenzweig 2019). Если свёртывание не удаётся, ко-шаперон CHIP, связанный с Hsc70 и Hsp90, убиквитинирует субстрат и направляет его в протеасому: так CHIP смещает баланс между свёртыванием и деградацией (Connell 2001; клетки COS, рецептор глюкокортикоидов). Ко-шапероны BAG определяют путь: BAG1 связан с протеасомным, BAG3 — с макроаутофагическим удалением убиквитинированных белков, и в стареющих клетках BAG3 преобладает (Gamerdinger 2009). Комплекс BAG3–Hsc70–HspB8 вместе с CHIP и p62 запускает шаперон-зависимую селективную аутофагию, CASA (Arndt 2010; мышечные клетки, Drosophila). Ползунок «ёмкость Hsp70» в модели меняет скорость рефолдинга; для субстратов ЭПР он означает ёмкость BiP.", "gn_q4_prot": "Протеасома: что она принимает", "g_q4_prot": "26S-протеасома разрушает полипептиды, которые проходят в её узкий канал; агрегаты и органеллы она не принимает (Pohl 2019). Распространённый сигнал — цепь убиквитина, связанная через Lys48; универсального минимального размера цепи нет: очищенная протеасома эффективно узнавала тетраубиквитин (Thrower 2000), а часть протеасомных субстратов разрушается и после присоединения одного убиквитина (Braten 2016, клетки человека и дрожжей). Разветвлённые цепи с блоками K11 улучшают узнавание протеасомой (Meyer 2014, клетки HeLa, регуляторы митоза). Для белков наружной мембраны митохондрии, помеченных Parkin, нужны p97 и протеасома: в деполяризованных клетках с избытком Parkin их подавление блокирует митофагию (Chan 2011; Tanaka 2010); для клеток с эндогенным Parkin такой вывод не доказан. При подавлении протеасомы клетки повышают транскрипцию её субъединиц через Nrf1 (Radhakrishnan 2010, фибробласты мыши) и экспрессию p62 и GABARAP (Pohl 2019).", "gn_q4_erad": "ERAD и ER-фагия", "g_q4_erad": "ERAD выводит растворимые несвёрнутые белки ЭПР в цитозоль через убиквитинлигазные комплексы мембраны ЭПР; p97 вытягивает их, 26S-протеасома разрушает (Christianson 2023). Для неправильно свёрнутого α1-антитрипсина передача в ERAD зависит от маннозидазы ЭПР: кифунензин останавливает оборот (Liu 1999, гепатомные клетки). Агрегаты, которые нельзя вывести в цитозоль, остаются в просвете ЭПР и удаляются лизосомными путями: полимеры α1-антитрипсина Z — путём ERLAD, который использует калнексин и рецептор FAM134B, но доставляет груз одномембранными везикулами через слияние, зависящее от STX17 и VAMP8 (Fregno 2018); проколлаген — ER-фагией с комплексом калнексин–FAM134B (Forrester 2019). В модели оба пути объединены в один лизосомный маршрут «ER-фагия / ERLAD».", "gn_q4_auto": "Аутофагия: агрефагия, ER-фагия, митофагия", "g_q4_auto": "Селективная аутофагия удаляет крупные структуры: агрегаты (агрефагия), части ЭПР (ER-фагия), митохондрии (митофагия). Рецепторы связывают груз и белки семейства ATG8 (вопрос 1). PINK1–Parkin-зависимая митофагия включает убиквитинирование белков наружной мембраны (Pohl 2019; вопрос 2), и в изученных деполяризованных клетках с избытком Parkin нуждается в протеасоме и p97 (Chan 2011; Tanaka 2010). Рецепторы агрефагии — p62, NBR1, TAX1BP1 (Adriaenssens 2022); рецепторы ER-фагии — FAM134B, RTN3, ATL3, TEX264, CCPG1 (Pohl 2019). У аутофагии нет центрального переключателя: нагрузка на неё растёт, когда другие маршруты замедляются, а её собственная активность зависит от условий, например от недостатка аминокислот.", "gn_q4_p62": "p62: димер, олигомер и переключение маршрута", "g_q4_p62": "p62 (SQSTM1) может быть и челноком к протеасоме, и рецептором аутофагии (Pohl 2019). Димер p62 узнаёт одиночные молекулы с цепями K48 (домен UBA) и ведёт их к протеасоме (домен PB1). Связывание цепей K63 вызывает олигомеризацию p62 через PB1 и фазовое разделение; образуются тельца p62, которые привлекают мембраны через мотив LIR (Sun 2018, p62 in vitro; Pohl 2019). Олигомеризация стабилизирует связь p62 с LC3B (Wurzer 2015). В реконструированной системе скопления p62 с белками образуются на субстратах минимум с двумя цепями длиннее трёх звеньев (Zaffagnini 2018). При высокой концентрации свободного убиквитина (тепловой шок, длительное подавление протеасомы) убиквитинирование p62 может блокировать димеризацию через домен UBA и способствовать олигомеризации (Pohl 2019). В реконструированной системе, напротив, свободный убиквитин и свободные цепи K48 и K63 подавляли образование скоплений p62 с субстратом (Zaffagnini 2018), поэтому направление эффекта зависит от условий. Предпочтение K48 для протеасомы и K63 для рецепторов не абсолютно, а вывод о нём в основном опирается на эксперименты с избыточной экспрессией и на системы in vitro; что определяет судьбу субстрата — тип цепи, количество субстрата или дополнительные сигналы, — остаётся открытым вопросом (Adriaenssens 2022). В модели «олигомерная форма p62» — учебный индекс 0–100 %: он растёт с содержанием p62 и долей K63 и увеличивается в 1,5 раза при подавлении протеасомы (учебное значение).", "gn_q4_rem": "Остаток повреждённых: что он означает", "g_q4_rem": "Остаток — доля исходной когорты повреждённых молекул, которые за выбранный срок ещё не ушли ни по одному маршруту: exp(−Σk·T), где Σk — сумма скоростей доступных маршрутов (1/ч). Доля маршрута i равна k_i/Σk · (1 − exp(−Σk·T)); сумма всех исходов — 100 %. Время убывания повреждённой фракции вдвое равно ln 2 / Σk. Рефолдированная молекула выходит из повреждённой фракции, но остаётся белком; в этой модели она в расчёт остатка не входит. Остаток растёт, когда закрыты маршруты, которым нет замены. Все скорости — учебные значения, заданные для сравнения субстратов, а не измеренные величины.", "gn_q4_drug_mg": "MG132 и бортезомиб: ингибиторы протеасомы", "g_q4_drug_mg": "MG132 (Z-Leu-Leu-Leu-аль) — пептидный альдегид, подавляющий протеасому; бортезомиб ингибирует прежде всего химотрипсиноподобный центр β5. Пептидный альдегид Z-Leu-Leu-Leu-аль in vitro подавлял и кальпаин, и протеасому (Tsubuki 1996), поэтому накопление X под действием одного MG132 не доказывает вклад именно протеасомы: нужны независимый ингибитор протеасомы или генетический контроль. После подавления протеасомы клетки повышают синтез её субъединиц через Nrf1 (Radhakrishnan 2010), а при длительном воздействии усиливается аутофагия (Pohl 2019). Через часы картина поэтому меняется: нагрузка перераспределяется.", "gn_q4_drug_baf": "Бафиломицин A1: ингибитор V-ATPase", "g_q4_drug_baf": "Бафиломицин A1 подавляет V-ATPase и закисление лизосом, поэтому лизосомный груз перестаёт расщепляться и накапливается. Слияние аутофагосом с лизосомами может идти и без закисления (Mauvezin 2015, Drosophila), поэтому в клетках бафиломицин может влиять и на слияние. Накопление белка при бафиломицине показывает, что часть его удаляется в лизосоме; оно не показывает, каким путём груз туда попал: агрефагией, ER-фагией, шаперон-зависимой аутофагией или эндоцитозом. Поток оценивают по LC3-II и p62 с бафиломицином и без него (Klionsky 2021).", "gn_q4_drug_sar": "SAR405: ингибитор VPS34", "g_q4_drug_sar": "SAR405 — селективный ингибитор VPS34: он подавляет аутофагию на этапе образования PI3P, но нарушает и работу поздних эндосом и лизосом (Ronan 2014). На блоте белка X его эффект в модели совпадает с эффектом бафиломицина: различить их позволяют LC3-II и p62 и побочные эффекты на лизосомы. Допущение модели: лизосомные пути ЭПР (ER-фагия, ERLAD) чувствительны к SAR405 так же, как другие аутофагические; для ERLAD в использованных источниках это прямо не показано.", "gn_q4_drug_cb": "CB-5083: ингибитор p97", "g_q4_drug_cb": "CB-5083 ингибирует p97 (VCP): в опухолевых клетках накапливаются полиубиквитинированные белки, задерживаются субстраты ERAD и возникает протеотоксический стресс, который запускает апоптотическую ветвь ответа на несвёрнутые белки (Anderson 2015). p97 нужен и для извлечения помеченных Parkin белков наружной мембраны митохондрии (Tanaka 2010). В модели CB-5083 снижает активность p97-зависимых звеньев: ERAD, протеасомного пути митохондриальных белков и митофагии; для растворимого белка цитозоля эффект принят вдвое меньшим (учебное значение).", "gn_q4_drug_kif": "Кифунензин: ингибитор маннозидазы ЭПР", "g_q4_drug_kif": "Кифунензин ингибирует α1,2-маннозидазы класса I. Без отщепления маннозы субстрат ERAD, например неправильно свёрнутый α1-антитрипсин, не передаётся на деградацию: оборот останавливается (Liu 1999, гепатомные клетки). Поэтому блок стоит до убиквитинирования: в модели субстрат остаётся в ЭПР без метки, и доля убиквитинированной формы не растёт (в модели — падает). Рефолдинг и ER-фагию кифунензин напрямую не затрагивает.", "gn_q4_drug_both": "MG132 вместе с бафиломицином A1", "g_q4_drug_both": "Совместное подавление протеасомы и лизосомной деградации закрывает оба основных маршрута деградации. Для растворимого белка цитозоля это даёт наибольшее накопление; если один из маршрутов у субстрата не работает, эффект близок к эффекту одного препарата. Сочетание применяют, чтобы выявить вклад оставшегося маршрута. Ограничения и побочные эффекты каждого препарата описаны в их справках.", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 минут, на продвинутый — 8–10 минут. В режиме «Сценарий» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку.", "teacher_2": "Вопрос 1. В модели 1б все константы учебные и не измерены: вес первого контакта UBD с убиквитином 0,04, каждого следующего 0,6, число копий рецептора 1 или 4, вероятности удержания ULK1–FIP200 и ATG8 на одну копию 0,5 и 0,4. Индекс доставки — допущение: вес 1 при ULK1–FIP200 и мосте с ATG8, 0,6 при одном ULK1–FIP200, 0,15 при одном мосте с ATG8, 0,02 без обоих. Асимметрия отражает данные клеток HeLa с Parkin: потеря связи с ATG8 замедляла митофагию (Padman 2019), потеря связи NDP52 с FIP200 её останавливала (Vargas 2019); в других системах вклад LIR может быть иным. Усиление привлечения рецептора белками ATG8 (Padman 2019) в 1б не заложено и показано только на вкладке 1п. В 1п уровни — учебные значения, согласованные с качественными результатами работ на клетках HeLa без пяти рецепторов; для TAX1BP1 привлечение ULK1 не определяли, для мутантов UBD оно принято равным уровню клеток без рецепторов по отсутствию рецептора на митохондриях. Работы расходятся в оценке LIR-мутанта NDP52 (Padman 2019 и Vargas 2019) и роли TBK1 для NDP52 (Lazarou 2015 и Vargas 2019); оба расхождения названы в справках. Все константы модели 2б учебные: они подобраны так, чтобы PINK1 накапливался за единицы минут, а активация Parkin запаздывала примерно на 30 мин (оба наблюдения приведены в обзоре Narendra & Youle 2024; механизм задержки, накопление двух молекул PINK1 на TOM, авторы обзора называют гипотезой). Исходный запас убиквитина на внешней мембране (8 %), порядок реакции обратной связи (n = 2) и остаток активности USP30 при ингибировании (30 %) заданы произвольно; скорость возврата показателей после отмывки CCCP измерена только для PINK1 (в течение 30 мин, клетки HeLa). Во всех сценариях, кроме образца X (DFP), использован CCCP, хотя часть данных (Ordureau 2014, Lazarou 2015) получена с олигомицином и антимицином A; направление эффектов у этих воздействий одно. Уровни полос на блоте 2п качественные, направление эффектов взято из первоисточников; значения для срока 24 ч (в первоисточниках на этом сроке показаны mtDNA и COX II для Lazarou 2015 и убыль белков для Allen 2013), для TOMM20 в клетках без пяти рецепторов и для образца X приняты учебными допущениями. USP30⁻/⁻ в первоисточнике (Bingol 2014) подавляли нокдауном, а образец X (DFP) воспроизводит качественную картину Allen 2013, где pS65-Ub не измеряли: его отсутствие выведено из отсутствия накопленного PINK1. Вопрос 3: модель одной клетки с тремя ступенями ответа (ремонт, лизофагия, ответ TFEB) и учебными константами; повреждение возникает мгновенно в момент 0, гибель клеток не моделируется (при неудачном ремонте клетки могут погибать, Radulovic 2018). Малые повреждения не метятся галектином-3 и ремонтируются за минуты; ёмкость ремонта насыщается, а после метки убиквитина ремонт в модели не идёт — это допущения, критерий «ремонт или удаление» в клетке неизвестен (Meyer & Kravic 2024), модель воспроизводит лишь зависимость от дозы. ESCRT-III и PI3P-зависимый путь действуют совместно и умножают эффективность ремонта; выключатель лизофагии блокирует захват, а не убиквитинирование; без TFEB сохраняется базовое образование лизосом; LAMP1 принят пропорциональным пулу. SAR405 и ингибитор ULK1 в модели ослабляют и ремонт, и захват, поэтому их показания совпадают; вклад CASM в активацию TFEB (80 %) и остаточные доли при нокдауне ESCRT-III (15 %) и нокауте TAX1BP1 (30 %) — учебные значения. Регенерацию лизосом (LYTL, ALR, B-фиссия) и гибель клетки сцены не показывают; B-фиссия описана при гипоксии–реоксигенации в клетках HeLa, не при LLOMe (Luo 2026). Вопрос 4: модель — кинетическая конкуренция доступных маршрутов за одну популяцию повреждённых молекул; доля маршрута равна k_i/Σk·(1−exp(−Σk·T)), остаток — exp(−Σk·T). Блот 4п показывает общий X, то есть сумму повреждённой и свёрнутой форм (начиная с версии 2.0): рефолдинг переводит молекулы из повреждённой формы в свёрнутую и общий X не уменьшает; свёрнутая форма удаляется только собственным медленным оборотом (0,2 ч⁻¹, учебная константа), препараты на неё не действуют, а контролем служит стационарное состояние. Все скорости (рефолдинг 0,3 ч⁻¹ у растворимого белка цитозоля, 0,01 у агрегата и 0,03 у белка ЭПР; протеасома, ERAD, аутофагия), остаточная активность ингибированного звена 5 %, множитель олигомеров p62 при подавлении протеасомы 1,5 и снижение вдвое протеасомного пути растворимого белка при подавлении p97 — учебные значения; результат читается как сравнение субстратов, а не как измерение. Пять субстратов выбраны так, чтобы показать разные доступные маршруты; агрегат в ЭПР, устойчивый к ERAD, объединяет ERLAD (Fregno 2018) и ER-фагию (Forrester 2019) в один лизосомный маршрут, и его чувствительность к бафиломицину принята по общему свойству лизосомной деградации. Усиление аутофагии при подавлении протеасомы включается мгновенно, хотя в клетках оно развивается часами (Pohl 2019); в модели, построенной по данным на деполяризованных клетках с избытком Parkin, митофагия при подавлении протеасомы или p97 ослаблена, а не усилена (Chan 2011; Tanaka 2010). Строка X–Ub на блоте 4п — учебный показатель: у реальных белков меченая форма видна не всегда, и для агрегата в ЭПР о доле убиквитинирования в источниках сведений нет, поэтому принято малое значение. Ползунок Hsp70 означает BiP для субстратов ЭПР (упрощение); 17-AAG из сцены исключён, потому что его вывод неоднозначен. SAR405 и бафиломицин дают на блоте X одинаковую картину, различать их нужно по LC3-II и p62 (семинар 11).", "teacher_3": "Уточнения к распространённым схемам приведены в справках по белкам и в «Объяснениях».", "src_01": "Adriaenssens E., Ferrari L., Martens S. Orchestration of selective autophagy by cargo receptors. Curr Biol. 2022;32:R1357–R1371. doi:10.1016/j.cub.2022.11.002", "src_02": "Vargas J.N.S., Hamasaki M., Kawabata T., Youle R.J., Yoshimori T. The mechanisms and roles of selective autophagy in mammals. Nat Rev Mol Cell Biol. 2023;24:167–185. doi:10.1038/s41580-022-00542-2", "src_03": "Lazarou M., Sliter D.A., Kane L.A. et al. The ubiquitin kinase PINK1 recruits autophagy receptors to induce mitophagy. Nature. 2015;524:309–314. doi:10.1038/nature14893", "src_04": "Padman B.S., Nguyen T.N., Uoselis L. et al. LC3/GABARAPs drive ubiquitin-independent recruitment of Optineurin and NDP52 to amplify mitophagy. Nat Commun. 2019;10:408. doi:10.1038/s41467-019-08335-6", "src_05": "Vargas J.N.S., Wang C., Bunker E. et al. Spatiotemporal control of ULK1 activation by NDP52 and TBK1 during selective autophagy. Mol Cell. 2019;74:347–362. doi:10.1016/j.molcel.2019.02.010", "src_06": "Turco E., Witt M., Abert C. et al. FIP200 claw domain binding to p62 promotes autophagosome formation at ubiquitin condensates. Mol Cell. 2019;74:330–346. doi:10.1016/j.molcel.2019.01.035", "src_07": "Ravenhill B.J., Boyle K.B., von Muhlinen N. et al. The cargo receptor NDP52 initiates selective autophagy by r const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
const fmt = (x, d = 1) => x.toFixed(d).replace('.', ',');
const pct = x => Math.round(x * 100);
function ruTimes(x){
  const r = Math.round(x * 10) / 10;
  if (Math.abs(r - Math.round(r)) > 0.01) return fmt(r) + ' раза';
  const n = Math.round(r), m10 = n % 10, m100 = n % 100;
  return n + ((m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? ' раза' : ' раз');
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py собирает оба варианта) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 's12-142';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }
function poeUnits(K){
  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);
  }

}
function poeIdx(i, K = cur){
  if (!POE_RND) return i;

  const units = poeUnits(K), ord = poeShuffle(units.length, K + '/steps/' + POE_SEED);

function poeRender(){
  Object.keys(SCENES).forEach(k => { const b = $('poe' + k); b.hidden = true; b.innerHTML = ''; });

  if (!POE.shown){ $('capbox' + cur).hidden = true; $('take' + cur).parentElement.hidden = true; }
  const S = SCENES[cur], box = $('poe' + cur), steps = S.poe, si = poeIdx(POE.i), st = steps[si], P = `p${cur}_${si + 1}`;
  box.hidden = false;
  const letters = ['А', 'Б', 'В', 'Г'];
  let h = `<div class="k">${t('poe_step', { i: POE.i + 1, n: steps.length })}</div><div class="q">${t(P + '_q')}</div><div class="opts">`;
  const perm = poePerm(cur, si, st.n, st.ok);
  for (let d = 0; d < st.n; d++){
    const j = perm[d];
    let cls = 'opt';
    if (POE.pick === j) cls += ' picked';
    if (POE.shown && j === st.ok) cls += ' right';
    if (POE.shown && POE.pick === j && j !== st.ok) cls += ' wrongpick';
    h += `<button class="${cls}" data-j="${j}"${STUDENT && POE.shown ? ' disabled' : ''}><span class="L">${letters[d]}</span><span>${t(P + '_o' + (j + 1))}</span></button>`;
  }
  h += `</div>`;
  if (POE.shown && STUDENT && POE.pick != null && POE.pick !== st.ok) h += `<p class="ex wrongex"><b>${t('poe_your')}</b> ${t(P + '_w' + (POE.pick + 1))}</p>`;
  if (POE.shown) h += `<p class="ex"><b>${t('poe_ans')}</b> ${t(P + '_e')}</p>`;
  const last = POE.i === steps.length - 1, needPick = STUDENT && POE.pick == null;
  const done = Object.keys(POE.res).filter(k => k.startsWith(cur + ':')), right = done.filter(k => POE.res[k]).length;
  h += `<div class="nav">` + (POE.shown ? '' : `<button class="btn" id="poeShow"${needPick ? ' disabled' : ''}>${t('poe_show')}</button>`) +

    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT && POE.shown ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>`) +
    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); });
  if (needPick && !POE.shown) box.querySelector('.nav').insertAdjacentHTML('beforeend', `<span class="small" style="align-self:center">${t('poe_pick_first')}</span>`);
  if ($('poeShow')) $('poeShow').onclick = () => { if (STUDENT && POE.pick == null) return; POE.shown = true;
    const key = cur + ':' + POE.i; if (!(key in POE.res)) POE.res[key] = POE.pick === st.ok; st.apply(); S.update(); poeRender(); };
  if ($('poePrev')) $('poePrev').onclick = () => { POE.i--; POE.pick = null; POE.shown = false; poeSetup(); };
  if ($('poeNext')) $('poeNext').onclick = () => { POE.i++; POE.pick = null; POE.shown = false; poeSetup(); };
  $('poeExit').onclick = () => { POE.on = false; poeRender(); };

}
function poeSetup(){ const st = SCENES[cur].poe[poeIdx(POE.i)]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

/* ---------- навигация ---------- */
let cur = '1b', qn = 1, lvl = 'b';

/* возврат со страницы объяснений по ссылке seminar-N.html#q1…#q4 открывает нужный вопрос */
function fromHash(){ const s = urlState(); if (!s) return; if (s.q !== qn || s.l !== lvl){ qn = s.q; lvl = s.l; show(); } }
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){

  const top = sc.getBoundingClientRect().top + window.scrollY;

}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => navGo(+b.dataset.q, lvl));
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => navGo(qn, b.dataset.l));
  $('poeBtn').onclick = () => { POE.on = true; POE.i = 0; POE.pick = null; POE.shown = false; Object.keys(POE.res).forEach(k => { if (k.startsWith(cur + ':')) delete POE.res[k]; }); poeSetup(); };
  $('capT').onchange = () => { document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !$('capT').checked); if (POE.on) poeRender(); };
  $('legendBtn').onclick = () => { try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };
  $('legendClose').onclick = () => { try { $('legendDlg').close(); } catch(e){ $('legendDlg').removeAttribute('open'); } };
  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ navGo(+e.key, lvl); }
    if (e.key === 'b' || e.key === 'и'){ navGo(qn, lvl === 'b' ? 'a' : 'b'); } });
  $('srcList').innerHTML = Object.keys(TEXTS).filter(k => k.startsWith('src_')).sort().map(k => `<li>${TEXTS[k]}</li>`).join('');
  let last = performance.now();
  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));
}

/* ===== навигация (каркас 26.10.2026, из ревизии сайта 3.9): адрес вопроса и уровня, история, возврат, телефон,
   «↓ К выводу», клавиатура, переход между семинарами. Тексты — ключи to_take, zoom_hint, zoom_out, sn_* ===== */
/* адрес отражает вопрос (#q1…#q4) и уровень (?level=adv): ссылку можно отправить, перезагрузка открывает тот же вопрос;
   переход по истории браузера восстанавливает вопрос и уровень */
function urlState(){
  const h = location.hash, m = /^#q([1-4])$/.exec(h);
  if (!m && h && h !== '#') return null;   /* чужой якорь — состояние не меняем */
  return { q: m ? +m[1] : 1, l: /(^|[?&])level=adv(&|$)/.test(location.search) ? 'a' : 'b' };
}
function syncUrl(push){
  try {
    const ps = location.search.replace(/^\?/, '').split('&').filter(x => x && !/^level(=|$)/.test(x));
    if (lvl === 'a') ps.push('level=adv');
    const u = location.pathname + (ps.length ? '?' + ps.join('&') : '') + '#q' + qn;
    if (u !== location.pathname + location.search + location.hash) history[push ? 'pushState' : 'replaceState'](null, '', u);
  } catch (e) {}
}
function navGo(q, l){ const push = q !== qn && (!location.hash || /^#q[1-4]$/.test(location.hash)); qn = q; lvl = l; show(); syncUrl(push); }
window.addEventListener('popstate', fromHash);
/* после каждого показа: кнопка «Объяснения к вопросу N» передаёт уровень; проверка «К выводу» */
const revShow0 = show;
show = function(){ revShow0(); revAfterShow(); };

/* =====================================================================
   Вопрос 1. Рецептор селективной аутофагии как физический адаптер между убиквитинированным грузом и белками ATG8
   1б — схема-мост. Груз несёт N меток убиквитина (N = 1…6); рецептор — цепочка модулей UBD · PB1 · LIR · FIR.
        Модель многовалентного связывания (учебные константы):
        - вес состояния с j одновременными контактами UBD–убиквитин: w_j = C(N,j)·C(U,j)·j!·a·b^(j−1); w_0 = 1;
          a = 0,04 — вес первого контакта (слабый, определяется концентрацией рецептора), b = 0,6 — вес каждого следующего
          (контакты на одной частице груза и в одном олигомере находятся рядом, их эффективная концентрация выше);
        - U — число копий рецептора, способных связаться: 1 без олигомеризации через PB1, 4 при олигомеризации (учебное значение);
        - доля связанного груза f = 1 − 1/Z, Z = Σ w_j;
        - при j контактах ULK1–FIP200 удерживается хотя бы одной копией с вероятностью 1 − (1 − pF)^j (pF = 0,5; при мутации FIR 0,03),
          а мембрана фагофора у груза есть с вероятностью 0,9 при привлечённом ULK1–FIP200 и 0,1 без него (мембраны другого происхождения);
          LIR удерживает эту мембрану хотя бы одной копией с вероятностью 1 − (1 − pL)^j (pL = 0,4; при мутации LIR 0,03);
        - индекс доставки за 60 мин — учебное допущение: вес 1 при ULK1–FIP200 и мосте с ATG8, 0,6 при одном ULK1–FIP200,
          0,15 при одном мосте с ATG8, 0,02 без обоих; все четыре показателя — доли всего груза, поэтому лежат в пределах 0–100 %.
   1п — восстановление рецептора в клетках HeLa без пяти рецепторов, с Parkin, после олигомицина и антимицина A.
        Уровни (учебные значения, согласованные с качественными результатами Lazarou 2015, Padman 2019, Vargas 2019) заданы таблицей
        для сочетаний рецептор × мутация × TBK1; 100 % — уровень при OPTN или NDP52 дикого типа.
   ===================================================================== */
/*MODEL-BEGIN*/
const Q1 = {
  b: { a: .04, b: .6, U1: 1, Uo: 4, pF: .5, pL: .4, pM: .03, mu1: .9, eps: .1, wAF: 1, wF: .6, wA: .15, w0: .02 },
  /* 1п: R — рецептор на митохондриях (3 ч), F — комплекс ULK1–FIP200 на митохондриях (3 ч), M — клетки с красными митохондриями mt-Keima к 6 ч,
     tau — характерное время нарастания, ч. null — не определялось. */
  p: {
    base: { none: { R: 0, F: 20, M: 3, tau: 3.5 }, optn: { R: 100, F: 100, M: 100, tau: 2.5 }, ndp: { R: 100, F: 100, M: 100, tau: 2.5 },
            tax: { R: 100, F: null, M: 40, tau: 3.5 }, p62: { R: 100, F: 20, M: 3, tau: 3.5 } },
    mut: { optn: { ubd: { R: 5, F: 20, M: 3, tau: 3.5 }, lir: { R: 70, F: 70, M: 70, tau: 4.5 } },
           ndp: { ubd: { R: 5, F: 20, M: 3, tau: 3.5 }, lir: { R: 60, F: 50, M: 35, tau: 5 }, fip: { R: 100, F: 20, M: 5, tau: 3.5 } } },
    tbk: { optn: .3, ndp: .8 }, floorF: 20, floorM: 3, cellsRef: 5, cells: 10
  }
};
const q1C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
const q1Fact = k => k <= 1 ? 1 : k * q1Fact(k - 1);
/* 1б: o = {ub, n, ubd, lir, fir, pb1} */
function q1b(o){
  const P = Q1.b, N = o.ub ? o.n : 0, U = o.pb1 ? P.Uo : P.U1, R = { f: 0, F: 0, A: 0, D: 0, M: 0, m: 0, N, U };
  if (!N || !o.ubd) return R;
  const w = [1];
  for (let j = 1; j <= Math.min(N, U); j++) w.push(q1C(N, j) * q1C(U, j) * q1Fact(j) * P.a * Math.pow(P.b, j - 1));

    const q = w[j] / Z, pf = 1 - Math.pow(1 - pF, j), lj = 1 - Math.pow(1 - pL, j);
    const AF = pf * P.mu1 * lj, AnF = (1 - pf) * P.eps * lj, FnA = pf - AF, none = (1 - pf) - AnF;
    R.F += q * pf; R.A += q * (AF + AnF); R.M += q * (pf * P.mu1 + (1 - pf) * P.eps);
    R.D += q * (AF * P.wAF + FnA * P.wF + AnF * P.wA + none * P.w0); mm += q * j;
  }

}
/* 1п: o = {rec, mut, tbk} → {R, F, M, tau}; F может быть null */
function q1pAvail(rec){ return { ubd: rec === 'optn' || rec === 'ndp', lir: rec === 'optn' || rec === 'ndp', fip: rec === 'ndp', tbk: rec === 'optn' || rec === 'ndp' }; }
function q1p(o){
  const P = Q1.p, b = P.base[o.rec], m = (P.mut[o.rec] || {})[o.mut] || b;

/* =====================================================================
   Вопрос 3. Ответ на повреждение лизосомной мембраны: ремонт, лизофагия и восстановление пула
   Общая учебная модель одной клетки (время в часах, шаг 0,005 ч, метод Эйлера). Время 0 — конец импульса LLOMe
   (учебное допущение: повреждение возникает мгновенно). Пулы — доли от исходного числа лизосом клетки:
     L — целые;  S — с малыми повреждениями: быстро ремонтируются, галектином-3 не метятся;
     D1 — с крупными повреждениями, метятся галектином-3, ещё без убиквитина;
     D2 — то же, помечены убиквитином и ждут захвата аутофагосомой;
     Rc, Xc — накопленные числа отремонтированных и удалённых лизосом;  Nb — накопленное число новых лизосом.
   Потоки:  S → L (ремонт);  D1 → L (ремонт; скорость на лизосому падает с ростом D1 — насыщение ёмкости ремонта);
            D1 → D2 (метка убиквитином, постоянная скорость; ремонт после метки в модели не идёт);
            D2 → удалена (захват и лизофагия, часы);  новые лизосомы → L (образование, зависит от программы TFEB с задержкой).
   Сумма S + D1 + D2 + Rc + Xc равна исходной повреждённой доле (сохраняется точно), общий пул P = L + S + D1 + D2 = 1 − Xc + Nb ≤ 1.
   Эффективность ремонта = (1 − wE·(1 − ESCRT)) · (1 − wP·(1 − PI3P)): ESCRT-III и перенос липидов с участием PI3P в модели
   вносят вклад поровну-подобно и действуют совместно (учебное допущение; в клетках HeLa и U2OS оба пути нужны для ремонта —
   Radulovic 2018, Radulovic 2026).  TFEB в ядре: dT/dt = ka·(a0 + c·D/(D + Kt))·(1 − T) − ki·T,  D = D1 + D2, c — вклад
   конъюгации ATG8 (CASM) в активацию TFEB (Nakamura 2020).  Все константы — учебные, а не измерения.
   3b — базовый: одна клетка, доза и три процесса.   3a — эксперимент с фиксацией клеток: ингибиторы, нокауты, сроки.

const LY3 = { dmax: .9, g0: .2, g1: .7, kS: 4, kr0: 7, wE: .8, wP: .6, Ks: .06, kc: 1, kx: .8, Kt: .15, ka: 3, ki: 1, T0: .1,

/* состояние после импульса и интегрирование до Tmax; hist[i] — состояние в момент i·snap·dt */
function ly3Run(o){
  const P = LY3, dd = P.dmax * o.dose, g = P.g0 + P.g1 * o.dose, a0 = P.ki * P.T0 / (P.ka * (1 - P.T0));
  const S = { L: 1 - dd, S: dd * (1 - g), D1: dd * g, D2: 0, Rc: 0, Xc: 0, Nb: 0, G: o.tfeb ? P.T0 : 0, T: o.tfeb ? P.T0 : 0 };
  const eff = (1 - P.wE * (1 - o.esc)) * (1 - P.wP * (1 - o.p3)), hist = [], n = Math.round(P.Tmax / P.dt);
  const snap = i => hist.push({ t: i * P.dt, L: S.L, S: S.S, D1: S.D1, D2: S.D2, D: S.D1 + S.D2, Rc: S.Rc, Xc: S.Xc, Nb: S.Nb, G: S.G, T: S.T, P: S.L + S.S + S.D1 + S.D2, dd });

/* целые доли по методу наибольшего остатка: сумма всегда равна total */
function ly3Lr(vals, total){
  const fl = vals.map(v => Math.floor(v * total + 1e-9)), rest = total - fl.reduce((a, b) => a + b, 0);
  vals.map((v, i) => [v * total - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(p => { fl[p[1]]++; });
  return fl;
}

}

function ly3Slots(q){

/* =====================================================================
   Вопрос 4. Выбор маршрута для повреждённого белка или органеллы.
   Общая учебная модель — кинетическая конкуренция четырёх маршрутов (рефолдинг, протеасома, ERAD, аутофагия)
   за одну популяцию молекул; жёсткого «решающего» механизма нет, меняются скорости k_i (1/ч):
     доля исхода i за время T = k_i / Σk · (1 − exp(−Σk·T)); остаток exp(−Σk·T) — «не удалено» (сумма = 100 % по построению).

   ea — ERAD-устойчивый агрегат в ЭПР (полимеры α1-антитрипсина Z, проколлаген), mt — белок внешней мембраны митохондрии
   с меткой Parkin. Все константы — учебные (названы в справках и в TEACHER_4); результат — относительные значения.
   Входы: a — доля цепей K63 (остальные K48), p — содержание p62, h — ёмкость Hsp70 (BiP в ЭПР);
   P — подавлена протеасома, A — подавлена аутофагия, V — подавлена p97, M — подавлена маннозидаза ЭПР (кифунензин).
   4б — модель вопроса: когорта повреждённых молекул, образованная в момент 0; график накопления исходов 0–24 ч.
   4п — блот белка X через 6 ч обработки. X образуется постоянно (скорость s) в повреждённой форме U; две формы:
        dU/dt = s − (k_ref + k_prot + k_erad + k_aut)·U   — рефолдинг переводит U в свернувшуюся форму F, деградация удаляет U;
        dF/dt = k_ref·U − k_F·F                            — F остаётся белком X и выводится собственным оборотом k_F (учебная константа,
                                                             препараты в модели на него не действуют).

        Рефолдинг сохраняет белок: при выключенной деградации d(U+F)/dt = s − k_F·F. Строка Ub-форм — учебный показатель для U.

const RT = { RES: .05, COMP: 1.5, TA: 6, TB: 24, KF: .2 };   // KF — оборот свернувшейся формы X в 4п, 1/ч (учебная константа)   // остаточная активность при ингибировании; множитель олигомеров p62 при подавлении протеасомы; срок обработки в 4п; предел графика 4б

  ea: { ref: 0, prot: 0, erad: 0, aut: 1 }, mt: { ref: 0, prot: 1, erad: 0, aut: 1 } };
const RT_COL = { ref: '--aa', prot: '--mtor', erad: '--tfeb', aut: '--lyso', rem: '--off-ink' };

const RA_TR = { ctl: {}, mg: { P: 1 }, baf: { A: 1 }, sar: { A: 1 }, cb: { V: 1 }, kif: { M: 1 }, both: { P: 1, A: 1 } };
/* строка Ub-форм: u0 — доля помеченной формы в контроле; ub — маршруты, которым нужна метка */
const RA_UB = { cy: { u0: .10, ub: ['prot', 'aut'] }, ag: { u0: .35, ub: ['aut'] }, er: { u0: .05, ub: ['erad'] }, ea: { u0: .05, ub: [] }, mt: { u0: .50, ub: ['prot', 'aut'] } };
/* шкалы блота подобраны по максимуму модели (перебор всех образцов и препаратов в тестах), обрезания нет */
const RA_SC = { L: 2.8, U: 2.5 };

function rtOmega(o){ const w = o.p * (.2 + .8 * o.a); return o.P ? Math.min(1, RT.COMP * w) : w; }   // олигомеры p62, условные единицы 0–1
function rtRates(o){
  const R = RT.RES, fP = o.P ? R : 1, fA = o.A ? R : 1, fV = o.V ? R : 1, fM = o.M ? R : 1, w = rtOmega(o);
  const k = { ref: 0, prot: 0, erad: 0, aut: 0 };
  switch (o.cls){
    case 'cy': k.ref = .30 * o.h; k.prot = .30 * (1 - .8 * o.a) * fP * (o.V ? .5 : 1); k.aut = (.02 + .25 * w) * fA; break;

    case 'er': k.ref = .03 * o.h; k.erad = .25 * fP * fV * fM; k.aut = .01 * fA; break;
    case 'ea': k.aut = .08 * fA; break;

function rtOut(k, T){
  const S = rtSum(k), f = { ref: 0, prot: 0, erad: 0, aut: 0, rem: 1 };
  if (S <= 0) return f;
  const u = 1 - Math.exp(-S * T);

/* целые проценты с суммой ровно 100 (метод наибольших остатков) */
function rtPct(f){

/* вкладка 4п: общий X = U + F через t ч обработки (контроль = 1) и доля его убиквитинированной формы.

      `<p class="small" style="margin:6px 0 0">${t('s4b_r_note', { T })}</p>`;
    /* подпись: класс и воздействие; числа — те же, что в показателях */
    const mode = o.P && o.A ? 'both' : o.P ? 'ip' : o.A ? 'ia' : 'base';
    setCap(K, `s4b_c_${o.cls}_${mode}`, { T, ref: pc.ref, prot: pc.prot, erad: pc.erad, aut: pc.aut, rem: pc.rem, aut0: pc0.aut, prot0: pc0.prot, erad0: pc0.erad, rem0: pc0.rem, ref0: pc0.ref, w: pct(rtOmega(o)), a: pct(o.a), p: pct(o.p), h: pct(o.h) });
    /* график накопления исходов во времени (та же формула, срок 0–24 ч) */
    const ser = { ref: [], prot: [], erad: [], aut: [], rem: [] };
    for (let tt = 0; tt <= RT.TB + 1e-9; tt += .5){ const q = rtOut(k, tt); Object.keys(ser).forEach(r => ser[r].push([tt, q[r]])); }
    const lines = ['ref', 'prot', 'erad', 'aut'].filter(r => av[r]).map(r => ({ color: RT_COL[r], data: ser[r] }));
    lines.push({ color: RT_COL.rem, dash: [6, 4], w: 2.2, data: ser.rem });
    plotLines($('s4b_plot'), lines, { xmax: RT.TB, xstep: 6, xunit: t('h_short'), ymax: 1, yticks: [0, .5, 1], cursor: T });
  }
  wire(['s4b_cls', 's4b_a', 's4b_p', 's4b_h', 's4b_ip', 's4b_ia', 's4b_T'], update);
  const set = (cls, a, p, h, P, A, T = '24') => { segSet('s4b_cls', cls); setSlider('s4b_a', a); setSlider('s4b_p', p); setSlider('s4b_h', h); $('s4b_ip').checked = !!P; $('s4b_ia').checked = !!A; segSet('s4b_T', T); };
  SCENES[K] = { update, redraw: update, poe: [
    { n: 3, ok: 1, pre(){ set('cy', .2, .5, 1, 0, 0); }, apply(){ $('s4b_ip').checked = true; } },
    { n: 3, ok: 0, pre(){ set('ag', .2, .5, 1, 0, 0); }, apply(){ setSlider('s4b_a', .8); } },
    { n: 3, ok: 2, pre(){ set('ea', .2, .5, 1, 0, 0); }, apply(){ $('s4b_ip').checked = true; } },
    { n: 3, ok: 1, pre(){ set('mt', .2, .5, 1, 0, 0); }, apply(){ $('s4b_ip').checked = true; } },
    { n: 3, ok: 2, pre(){ set('cy', .2, .5, 1, 0, 0, '2'); }, apply(){ setSlider('s4b_h', .2); } },
    { n: 3, ok: 0, last: true, pre(){ set('ag', .2, .5, 1, 0, 0); }, apply(){ $('s4b_ip').checked = true; $('s4b_ia').checked = true; } },
  ] };
  update();
})();

/* =====================================================================
   4п — какой маршрут у этого субстрата: блот белка X через 6 ч обработки
   ===================================================================== */
(function(){
  const K = '4a';
  layout(K);
  $('svg' + K).innerHTML = rtSceneSVG(K, 'a');
  rtHspBox(K);
  const TRS = ['ctl', 'mg', 'baf', 'sar', 'cb', 'kif', 'both'];
  $('ctrl' + K).innerHTML = `<div id="s4a_clsW">` + segHTML('s4a_cls', 's4a_cls_t', RT_CLS.map(c => [c, 'gt_q4_' + c]), 'cy') + `</div>` +
    segHTML('s4a_tr', 's4a_tr_t', TRS.map(x => [x, 'dr_q4_' + x]), 'ctl') +
    toggleHTML('s4a_mys', 's4a_mys', false) + `<p class="small" style="margin:0">${t('s4a_time')}</p>`;
  $('reads' + K).innerHTML = `<div id="s4a_now" style="display:grid;gap:7px"></div>
    <div style="display:grid;gap:8px;margin-top:6px"><div class="label" style="margin:0">${t('s4a_blot_t')}</div>
    <div class="btns"><button class="btn" id="s4a_rec">${t('s4a_rec')}</button><button class="btn ghost" id="s4a_clr">${t('blot_clr')}</button></div>
    <div id="s4a_blot"></div><div class="lanekey" id="s4a_key"></div><p class="small" style="margin:0">${t('s4a_blot_note')}</p></div>`;
  $('take' + K).textContent = t('s4a_take');
  let lanes = [], keys = [], mysCls = 'ea';
  const hidden = () => $('s4a_mys').checked;
  const curCls = () => hidden() ? mysCls : segVal('s4a_cls');
  const fx = x => fmt(x, 1);
  function renderBlot(){
    $('s4a_blot').innerHTML = blotHTML([t('s4a_row_x'), t('s4a_row_ub'), t('b_actin')], lanes);
    $('s4a_key').innerHTML = keys.map(k => `<span>${k}</span>`).join('');
  }
  function record(){
    const cls = curCls(), tr = segVal('s4a_tr'), R = raRead(cls, tr), mys = hidden();
    lanes.push({ h1: t('s4a_ln_' + tr), h2: mys ? '?' : t('s4a_sm_' + cls), v: [R.L / RA_SC.L, R.U / RA_SC.U, .85] });
    keys.push(t('s4a_key', { s: mys ? t('s4a_x') : t('gt_q4_' + cls), d: t('dr_q4_' + tr), l: fx(R.L), u: pct(R.U) }));
    while (lanes.length > 8){ lanes.shift(); keys.shift(); }
    renderBlot();
  }
  const clear = () => { lanes = []; keys = []; renderBlot(); };
  /* какие маршруты затронуты воздействием: названия для подписи */
  const hitNames = (cls, R) => RT_ROUTES.filter(r => RT_AV[cls][r] && R.k0[r] > 0 && R.k1[r] < .9 * R.k0[r]).map(r => lc1(r === 'aut' ? rtAutName(cls) : t('s4_out_' + r)));
  function update(){
    const mys = hidden(), cls = curCls(), tr = segVal('s4a_tr'), R = raRead(cls, tr);
    $('s4a_clsW').style.display = mys ? 'none' : '';
    const o = Object.assign({ cls }, RT_DEF, RA_TR[tr]);
    const tags = {}; ['ref', 'prot', 'erad', 'aut'].forEach(r => { tags[r] = tr === 'ctl' ? null : { t: t('s4_tag_' + tr), g: 'q4_drug_' + tr }; });
    rtPaint(K, 'a', o, R.k1, R.k0, tags, mys);
    setOp(`${K}_hsp`, 0); setOp(`${K}_chain`, 0); setOp(`${K}_p62`, 0);
    const av = RT_AV[cls];
    RT_ROUTES.forEach(r => {
      const q = R.k0[r] > 0 ? R.k1[r] / R.k0[r] : 0, show = mys || av[r];
      setTxt(`${K}_v_${r}`, mys ? '?' : (show && R.k0[r] > 0 ? Math.round(100 * q) + ' %' : '—'));
      $(`${K}_f_${r}`).setAttribute('width', mys ? 0 : (show ? (214 * clamp(q / 1.5, 0, 1)).toFixed(2) : 0));
    });
    setTxt(`${K}_t_rem`, t('s4a_lvl')); setTxt(`${K}_v_rem`, fmt(R.L, 1) + ' ×'); $(`${K}_f_rem`).setAttribute('width', (214 * R.L / RA_SC.L).toFixed(2));
    $('s4a_now').innerHTML = readRow(mys ? t('s4a_x') : t('gt_q4_' + cls), t('dr_q4_' + tr), '') +
      meterRow(t('s4a_r_l'), R.L / RA_SC.L, fmt(R.L, 1) + ' ×') + meterRow(t('s4a_r_u'), R.U / RA_SC.U, pct(R.U) + ' %') +
      readRow(t('s4a_r_pi'), t('s4a_r_pi_s'), `<span class="v">${pct(R.pi)} %</span>`) +
      readRow(t('s4a_r_f'), t('s4a_r_f_s'), `<span class="v">${mys ? '?' : pct(R.fF) + ' %'}</span>`) +
      `<p class="small" style="margin:6px 0 0">${t('s4a_r_note')}</p>`;
    /* подпись: по показаниям блота, а не по названию препарата */
    let k, hit = hitNames(cls, R).join(', ');
    const u0 = RA_UB[cls].u0, up = R.L >= 1.25, down = R.L < .93, ubUp = R.U >= 1.5 * u0, ubDown = R.pi < .6 * u0;
    if (mys) k = 's4a_c_mys';
    else if (tr === 'ctl') k = 's4a_c_ctl';
    else if (up && ubDown) k = 's4a_c_pre';
    else if (up && ubUp) k = 's4a_c_post';
    else if (up) k = 's4a_c_up';
    else if (ubUp) k = 's4a_c_ubonly';
    else if (down) k = 's4a_c_down';
    else k = 's4a_c_flat';
    setCap(K, k, { x: up1(t('gt_q4_' + cls)), d: t('dr_q4_' + tr), l: fx(R.L), u: pct(R.U), r: hit || t('s4a_none'), pi: pct(R.pi) });
  }
  wire(['s4a_cls', 's4a_tr', 's4a_mys'], update);
  $('s4a_mys').addEventListener('change', () => { if ($('s4a_mys').checked) mysCls = RT_CLS[Math.floor(Math.random() * RT_CLS.length)]; update(); });
  $('s4a_rec').onclick = record;
  $('s4a_clr').onclick = clear;
  renderBlot();
  const set = (cls, tr, mys) => { segSet('s4a_cls', cls); segSet('s4a_tr', tr); $('s4a_mys').checked = !!mys; if (mys) mysCls = mys; };
  SCENES[K] = { update, redraw: update, poe: [
    { n: 3, ok: 0, pre(){ clear(); set('cy', 'ctl'); record(); }, apply(){ set('cy', 'mg'); record(); } },
    { n: 3, ok: 2, pre(){ clear(); set('er', 'ctl'); record(); }, apply(){ set('er', 'kif'); record(); } },
    { n: 3, ok: 1, pre(){ clear(); set('mt', 'ctl'); record(); }, apply(){ set('mt', 'cb'); record(); } },
    { n: 3, ok: 0, pre(){ clear(); set('ea', 'ctl'); record(); }, apply(){ set('ea', 'baf'); record(); } },
    { n: 3, ok: 2, pre(){ clear(); set('ag', 'ctl'); record(); }, apply(){ set('ag', 'mg'); record(); } },
    /* last: загадка — класс скрыт; доказательства (дорожки блота) видны до ответа, ответ открывает название */
    { n: 3, ok: 1, last: true, pre(){ clear(); ['ctl', 'mg', 'baf', 'cb', 'kif'].forEach(x => { set('ea', x, 'ea'); record(); }); set('ea', 'ctl', 'ea'); }, apply(){ $('s4a_mys').checked = false; segSet('s4a_cls', 'ea'); segSet('s4a_tr', 'ctl'); } },
  ] };
  update();
})();
