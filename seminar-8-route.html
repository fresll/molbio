вата окисляется. Во втором кислород тоже доступен, но лактата образуется много: это аэробный гликолиз. В третьем кислород ограничен, дыхание снижено, и лактата образуется много. Во втором состоянии митохондрии работают. Это показано на культивируемых клетках: при активации конканавалином А тимоциты крысы превращали в лактат непропорционально большую часть дополнительно поглощённой глюкозы, а окисление пирувата при этом тоже возрастало (Hume и соавт., 1978). Поэтому образование лактата не показывает, что дыхание остановлено или цепь повреждена.","Причины аэробного гликолиза не сводятся к одному механизму. По одной модели, в части делящихся клеток потребность в NAD⁺ для окислительных реакций превышает потребность в ATP; тогда дыхание ограничено сопряжением с оборотом ATP, а образование лактата поддерживает NAD⁺ (Luengo и соавт., 2021). По другой, в ряде линий клеток панели NCI-60 ёмкость челноков, переносящих восстановительные эквиваленты в митохондрии, оказывается насыщенной (Wang и соавт., 2022). Оба результата получены на конкретных клеточных моделях; ни один из них не объясняет явление во всех клетках и не исключает другой.","Аэробный гликолиз не служит специфическим признаком рака, и не всякое образование лактата называют эффектом Варбурга. Эритроциты, в которых нет митохондрий, образуют лактат, поскольку не могут окислять пируват в митохондриях; в скелетных мышцах при интенсивной нагрузке лактат образуется и при достаточном содержании O₂, когда скорость гликолиза превышает скорость окисления пирувата, а локальное ограничение O₂ возможно, но не обязательно (Gladden, 2004). Чтобы говорить об аэробном гликолизе, нужно назвать клетки, указать содержание O₂ и показать образование лактата в этих условиях."],"trap":["Лактат образуется только при недостатке O₂.","Лактат образуется и при достаточном содержании O₂. В таком состоянии гликолиз и дыхание идут одновременно. Недостаток O₂ — одна из причин усиления образования лактата, но не единственная."],"conditions":"Схема качественная: лактат и дыхание показаны словами, числовых значений нет. Механизмы потребности в NAD⁺ и насыщения челноков получены на пролиферирующих культивируемых клетках (Luengo и соавт., 2021; Wang и соавт., 2022). Пример активированных тимоцитов крысы дан по аннотации Hume и соавт. (1978); данные о потреблении O₂ в ней не приводятся, сохранение дыхания показано по окислению пирувата. Статья Wang и соавт. (1976) о лимфоцитах мыши (DOI 10.1038/261702a0) при подготовке страницы не читалась: аннотации в PubMed нет. Положение о мышцах дано по аннотации обзора Gladden (2004): повышение образования лактата при гипоксии или дисоксии часто оказывается скорее исключением, чем правилом; детали механизма в мышце при нагрузке в аннотации не рассматриваются. Обзор Vander Heiden и соавт. (2009) использован как общая ссылка по теме, прочитана аннотация. Об HIF-зависимом торможении PDH прочитана аннотация Kim и соавт. (2006).","sources":["LUENGO","WANG","HUME1978","KIM2006","VANDERHEIDEN","GLADDEN2004"],"quiz":{"id":"S8-L03","rev":2,"question":"Активированные лимфоциты в культуре при достаточном содержании O₂ выделяют больше лактата, чем покоящиеся, и продолжают потреблять O₂. Какое объяснение согласуется с этими данными?","options":[{"id":"S8-L03-2","text":"Лактат образуется потому, что кислород в культуре расходуется быстрее, чем поступает.","correct":false,"feedback":"Условие указывает на достаточное содержание O₂; ограничение его поступления не показано."},{"id":"S8-L03-1","text":"Часть пирувата восстанавливается до лактата, а часть окисляется в митохондриях.","correct":true,"feedback":"Образование лактата в присутствии O₂ не требует остановки дыхания."},{"id":"S8-L03-3","text":"В активированных клетках дыхательная цепь повреждена, и лактат образуется вместо дыхания.","correct":false,"feedback":"Потребление O₂ продолжается, поэтому образование лактата не означает, что цепь повреждена."}]},"widget":{"kind":"net","title":"","s":{"title":"Три состояния клетки: кислород, лактат, дыхание","status":"Схема механизма · качественные уровни, числа не заданы","ctrls":[{"id":"st","type":"group","label":"Состояние","opts":["O₂ доступен, лактата мало","O₂ доступен, лактата много (аэробный гликолиз)","O₂ ограничен, лактата много"]}],"W":640,"H":300,"NW":340,"NH":440,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":186,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,232]},{"x":6,"y":204,"w":628,"h":90,"c":"mito","t":"митохондрия","lx":16,"ly":222,"n":[4,242,332,130]}],"mem":[],"nodes":{"glc":{"p":[70,150,96,44],"t":"глюкоза","n":[70,60,100,40]},"pyr":{"p":[230,130,96,44],"t":"пируват","n":[70,150,100,40]},"lac":{"p":[440,62,96,44],"t":"лактат","n":[260,150,100,40]},"mit":{"p":[330,242,190,52],"t":"митохондриальное\nдыхание","n":[140,310,200,50]},"o2":{"p":[570,242,60,40],"t":"O₂","n":[300,345,56,34]}},"edges":{"a":{"a":"glc","b":"pyr","k":"rx","t":"гликолиз","d":[0,-18]},"b":{"a":"pyr","b":"lac","k":"rx","t":"ЛДГ","d":[0,-16],"dn":[32,0]},"c":{"a":"pyr","b":"mit","k":"rx","t":"окисление","d":[0,-2],"dn":[40,0]},"d":{"a":"o2","b":"mit","k":"rx"}},"st":{"0":{"n":{"lac":"low","mit":"on","o2":"met"},"e":{"b":"off"},"note":"O₂ достаточно, значительная часть пирувата окисляется в митохондриях, лактата образуется немного.","bars":[["Образование лактата",1],["Потребление O₂ дыханием",3],["Доступность O₂",3]]},"1":{"n":{"lac":"on","mit":"on","o2":"met"},"note":"O₂ достаточно, дыхание сохранено, но лактата образуется много: часть пирувата восстанавливается до лактата параллельно с окислением. Это аэробный гликолиз.","bars":[["Образование лактата",3],["Потребление O₂ дыханием",3],["Доступность O₂",3]]},"2":{"n":{"lac":"on","mit":"low","o2":"low"},"note":"O₂ ограничен, дыхание снижено, и лактата образуется много. Причина здесь иная: окисление NADH в дыхательной цепи ограничено нехваткой O₂.","bars":[["Образование лактата",3],["Потребление O₂ дыханием",1],["Доступность O₂",1]]}}}}},{"id":"biosynthetic-branches","number":4,"section":0,"title":"Как углерод глюкозы поступает в биосинтез","question":1,"questions":[1],"keywords":["глюкозо-6-фосфат","пентозофосфатный путь","NADPH","рибозо-5-фосфат","серин","одноуглеродный обмен","предшественник","лактат","3-фосфоглицерат"],"lead":["От глюкозо-6-фосфата отходят гликолиз и окислительная ветвь [[T18|пентозофосфатного пути]] (ПФП), а от 3-фосфоглицерата — синтез серина.","Продукты этих ответвлений нужны для биосинтеза, а сами ответвления не исключают образования лактата."],"mechanism":["Окислительная ветвь ПФП превращает глюкозо-6-фосфат в рибулозо-5-фосфат и образует NADPH и CO₂; из рибулозо-5-фосфата получают рибозо-5-фосфат.","Окисление 3-фосфоглицерата — первая реакция синтеза серина; серин служит источником одноуглеродных групп для одноуглеродного обмена.","Если приток глюкозо-6-фосфата возрастает и ферменты ответвлений не насыщены, потоки в ответвления и в лактат могут расти одновременно."],"paragraphs":["Глюкоза фосфорилируется до глюкозо-6-фосфата (G6P), от которого начинаются гликолиз и ПФП. Промежуточные соединения этих путей служат [[T20|биосинтетическими предшественниками]]: из их атомов образуются другие вещества. Для прослеживания углерода на схеме указано число его атомов в каждом соединении.","Первое ответвление — окислительная ветвь ПФП. Три последовательные реакции — глюкозо-6-фосфатдегидрогеназа (G6PD), 6-фосфоглюконолактоназа и 6-фосфоглюконатдегидрогеназа — превращают G6P в рибулозо-5-фосфат и образуют две молекулы NADPH и одну молекулу CO₂ на молекулу G6P (Stincone и соавт., 2015). Из рибулозо-5-фосфата изомераза образует рибозо-5-фосфат для нуклеотидов. Рибозо-5-фосфат можно получить и в неокислительной ветви из фруктозо-6-фосфата и глицеральдегид-3-фосфата, но NADPH эта ветвь не образует. В гликолизе NADPH не образуется; его образуют также малик-фермент и цитозольная изоцитратдегидрогеназа (IDH1).","Второе ответвление начинается от 3-фосфоглицерата. Его окисление до 3-фосфогидроксипирувата, катализируемое фосфоглицератдегидрогеназой (PHGDH), — первая реакция синтеза серина de novo. Серин служит источником одноуглеродных групп для [[T19|одноуглеродного обмена]], где работают фолатный и метиониновый циклы; эти группы используются для синтеза нуклеотидов и реакций метилирования. В части опухолевых клеток в синтез серина направлялось около 10 % 3-фосфоглицерата, а в других клетках поток в него не выявлялся (по обзору Locasale, 2013).","Остальной углерод превращается в пируват, который восстанавливается до лактата или окисляется до [[T44|ацетил-CoA]]. Поток в ответвление определяют приток G6P и активность ферментов ответвления, поэтому при ускорении поступления глюкозы потоки в ПФП, к серину и в лактат могут расти одновременно. Усиление потока в ответвление не создаёт новых путей: клетки человека, например, не синтезируют триптофан. Кроме того, в биомассе делящихся культивируемых клеток преобладает углерод аминокислот среды, а не глюкозы (Hosios и соавт., 2016)."],"trap":["NADPH образуется в самом гликолизе при превращении пирувата в лактат.","В реакции ЛДГ окисляется NADH, а NADPH в гликолизе не образуется. Его образуют окислительная ветвь ПФП и ряд других ферментов, например малик-фермент."],"conditions":"Схема качественная: числа атомов углерода — по структуре соединений, потоки заданы относительно и не получены в опыте. Две молекулы NADPH на G6P и неокислительная ветвь взяты из полного текста обзора Stincone и соавт. (2015), синтез серина и одноуглеродный обмен — из полного текста обзора Locasale (2013); значение около 10 % приведено в обзоре по данным ¹³C-глюкозы для части линий опухолевых клеток и не характеризует все клетки; вклад глюкозы в массу культивируемых клеток — по работе Hosios и соавт. (2016; полный текст).","sources":["STINCONE","LOCASALE","HOSIOS"],"quiz":{"id":"S8-L04","rev":2,"question":"При неизменном поступлении глюкозо-6-фосфата возрастает его поток через окислительную ветвь пентозофосфатного пути. Как изменится образование NADPH и пентозофосфатов?","options":[{"id":"S8-L04-2","text":"NADPH образуется в реакции ЛДГ, поэтому растёт образование лактата, а не пентозофосфатов.","correct":false,"feedback":"В реакции ЛДГ окисляется NADH, а NADPH не образуется; пентозофосфаты образует окислительная ветвь."},{"id":"S8-L04-3","text":"Образование NADPH снижается, поскольку окислительная ветвь потребляет NADPH и CO₂.","correct":false,"feedback":"Окислительная ветвь образует NADPH и CO₂, а не потребляет их."},{"id":"S8-L04-1","text":"Образование NADPH и пентозофосфатов усиливается, а поток в гликолиз снижается.","correct":true,"feedback":"Эта ветвь образует NADPH и рибулозо-5-фосфат, из которого получают рибозо-5-фосфат; при неизменном притоке в гликолиз остаётся меньше глюкозо-6-фосфата."}]},"widget":{"kind":"net","title":"","s":{"title":"Ответвления углерода глюкозы","status":"Схема механизма · качественные состояния, числа не заданы","ctrls":[{"id":"br","type":"group","label":"Что усилено","opts":["исходное состояние","окислительная ветвь ПФП","ответвление к серину","образование лактата"]},{"id":"gl","type":"group","label":"Поступление глюкозы","opts":["обычное","ускоренное"]}],"W":640,"H":380,"NW":340,"NH":580,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":366,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,566]}],"mem":[],"nodes":{"glc":{"p":[140,36,124,40],"t":"глюкоза, C₆","n":[82,58,96,46],"fs":15,"tn":"глюкоза\nC₆"},"g6p":{"p":[140,135,160,46],"t":"глюкозо-6-фосфат\nC₆","n":[82,150,124,52],"fs":13,"tn":"глюкозо-6-\nфосфат, C₆"},"ppp":{"p":[360,135,150,46],"t":"окислительная\nветвь ПФП","n":[262,150,128,64],"fs":13,"tn":"окисл. ветвь\nПФП: NADPH,\nCO₂"},"r5p":{"p":[560,62,120,46],"t":"рибозо-5-\nфосфат, C₅","n":[262,262,124,50],"fs":13,"tn":"рибозо-5-\nфосфат, C₅"},"nadph":{"p":[560,128,100,36],"t":"NADPH","n":[262,262,66,36],"nn":true,"r":18},"co2":{"p":[560,188,100,34],"t":"CO₂, C₁","n":[262,262,66,36],"nn":true},"3pg":{"p":[140,245,160,46],"t":"3-фосфоглицерат\nC₃","n":[82,262,124,52],"fs":13,"tn":"3-фосфо-\nглицерат, C₃"},"ser":{"p":[360,245,112,40],"t":"серин, C₃","n":[262,356,100,46],"tn":"серин\nC₃"},"c1":{"p":[556,245,146,46],"t":"одноуглеродные\nгруппы, C₁","n":[274,462,108,50],"fs":13,"tn":"одноуглер.\nгруппы, C₁"},"pyr":{"p":[360,335,130,40],"t":"пируват, C₃","n":[82,372,100,46],"tn":"пируват\nC₃"},"lac":{"p":[140,335,120,40],"t":"лактат, C₃","n":[82,478,100,46],"tn":"лактат\nC₃"},"accoa":{"p":[548,335,166,46],"t":"ацетил-CoA:\nацетильная группа C₂","n":[258,540,120,52],"fs":13,"tn":"ацетил-CoA:\nацетил C₂"}},"edges":{"a1":{"a":"glc","b":"g6p","k":"rx","t":"гексокиназа","d":[62,0],"dn":[46,0]},"a2":{"a":"g6p","b":"ppp","k":"rx","t":"G6PD","d":[0,-12],"dn":[0,-12]},"a3":{"a":"ppp","b":"r5p","k":"rx","t":"пентозо-\nфосфаты","d":[0,-12],"dn":[40,0]},"a4":{"a":"ppp","b":"nadph","k":"rx"},"a5":{"a":"ppp","b":"co2","k":"rx"},"b1":{"a":"g6p","b":"3pg","k":"rx","t":"гликолиз","d":[46,0],"dn":[40,0],"dash":true},"b2":{"a":"3pg","b":"ser","k":"rx","t":"PHGDH","d":[0,-12],"dn":[-60,0]},"b3":{"a":"ser","b":"c1","k":"rx","t":"группа","tn":"группа","d":[0,-12],"dn":[40,0]},"c1":{"a":"3pg","b":"pyr","k":"rx","t":"ряд реакций","d":[0,-10],"dn":[40,0],"dash":true},"c2":{"a":"pyr","b":"lac","k":"rx","t":"ЛДГ","d":[0,-12],"dn":[34,0]},"c3":{"a":"pyr","b":"accoa","k":"rx","t":"окисл.","d":[0,-12],"dn":[-52,6]}},"st":{"0-0":{"n":{},"m":[["Поток через ПФП","исходный"],["Поток к серину","исходный"],["Поток в лактат","исходный"]],"note":"Исходное распределение: глюкозо-6-фосфат направляется в гликолиз и в окислительную ветвь ПФП, 3-фосфоглицерат частично превращается в серин, а пируват — в лактат и в ацетил-CoA."},"0-1":{"n":{"glc":"on","g6p":"on"},"m":[["Поток через ПФП","растёт"],["Поток к серину","растёт"],["Поток в лактат","растёт"]],"note":"Приток глюкозы возрос: если ферменты ответвлений не насыщены, потоки в ПФП, к серину и в лактат растут одновременно, то есть лактат образуется параллельно с работой биосинтетических путей."},"1-0":{"n":{"ppp":"on","nadph":"on","r5p":"on","co2":"on"},"m":[["Поток через ПФП","растёт"],["Поток к серину","может падать"],["Поток в лактат","может падать"]],"note":"Окислительная ветвь ПФП усилена при неизменном притоке глюкозо-6-фосфата: образуется больше NADPH, CO₂ и пентозофосфатов, а в гликолиз поступает меньше углерода."},"1-1":{"n":{"glc":"on","g6p":"on","ppp":"on","nadph":"on","r5p":"on","co2":"on"},"m":[["Поток через ПФП","растёт сильно"],["Поток к серину","растёт"],["Поток в лактат","растёт"]],"note":"Приток возрос и окислительная ветвь ПФП усилена: поток через неё возрастает сильнее, чем потоки к серину и в лактат, которые тоже растут, поскольку исходного углерода больше."},"2-0":{"n":{"3pg":"on","ser":"on","c1":"on"},"m":[["Поток через ПФП","без изменений"],["Поток к серину","растёт"],["Поток в лактат","может падать"]],"note":"Усилено ответвление 3-фосфоглицерата к серину: больше одноуглеродных групп для синтеза нуклеотидов и метилирования, а в пируват превращается меньше углерода."},"2-1":{"n":{"glc":"on","g6p":"on","3pg":"on","ser":"on","c1":"on"},"m":[["Поток через ПФП","растёт"],["Поток к серину","растёт сильно"],["Поток в лактат","растёт"]],"note":"Приток возрос и усилено ответвление к серину: поток к одноуглеродному обмену возрастает сильнее, чем потоки в ПФП и в лактат, которые тоже растут."},"3-0":{"n":{"pyr":"on","lac":"on"},"m":[["Поток через ПФП","без изменений"],["Поток к серину","без изменений"],["Поток в лактат","растёт"]],"note":"Усилено восстановление пирувата до лактата: реакция ЛДГ окисляет NADH, NADPH в ней не образуется, а потоки в ответвления выше по пути не изменяются."},"3-1":{"n":{"glc":"on","g6p":"on","pyr":"on","lac":"on"},"m":[["Поток через ПФП","растёт"],["Поток к серину","растёт"],["Поток в лактат","растёт сильно"]],"note":"Приток возрос и усилено восстановление пирувата: поток в лактат возрастает сильнее, чем потоки в ПФП и к серину; биосинтетические ответвления не уменьшаются."}}}}},{"id":"atp-and-oxidation","number":5,"section":0,"title":"Почему выход ATP и регенерация NAD⁺ могут ограничивать разные процессы","question":1,"questions":[1],"keywords":["выход ATP","скорость образования ATP","челноки","дыхательная цепь","протонный градиент","олигомицин","FCCP","пиерицидин","DCA"],"lead":["[[T15|Выход ATP]] на молекулу глюкозы и скорость образования ATP — разные величины.","Окисление NADH в митохондриях зависит от сопряжения дыхания с расходом ATP, поэтому присутствие O₂ само по себе не означает окисления всего NADH."],"mechanism":["Выход ATP на молекулу глюкозы при полном окислении больше, чем при образовании лактата, но скорость образования ATP равна произведению потока на выход.","Цитозольный NADH не проходит через внутреннюю мембрану: его электроны передают в матрикс челноки, а комплекс I окисляет NADH матрикса, и электроны переходят к O₂.","Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, он остаётся высоким и ограничивает перенос электронов."],"paragraphs":["При превращении глюкозы в лактат образуются 2 молекулы ATP на молекулу глюкозы, при полном окислении — около 30 (учебное значение по Ленинджеру; в разных пособиях от 30 до 38 из-за разных допущений о стехиометрии). Это выход. Скорость образования ATP равна произведению потока через путь на выход, поэтому путь с малым выходом при большом потоке может давать столько же ATP за единицу времени, сколько путь с большим выходом при малом потоке.","NADH, образованный в цитозоле, внутреннюю митохондриальную мембрану не проходит. [[T16|Восстановительные эквиваленты]] — электроны, связанные с переносчиком, — передаёт в матрикс [[T17|челночная система]]. В малат-аспартатном челноке цитозольный NADH восстанавливает оксалоацетат до малата, а в матриксе малат вновь окисляется с образованием NADH; глицерол-3-фосфатный челнок передаёт электроны на убихинон, минуя комплекс I. Комплекс I окисляет NADH матрикса, электроны через убихинон и комплексы III и IV переходят к O₂, и этот перенос сопровождается переносом протонов через мембрану. Протонный градиент использует ATP-синтаза: так осуществляется [[T14|окислительное фосфорилирование]].","Перенос электронов и синтез ATP сопряжены, поэтому скорость дыхания зависит от оборота ATP. Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, он остаётся высоким, и NADH окисляется медленнее даже при достаточном содержании O₂. В работе Luengo и соавт. (2021) на клеточных линиях человека активация [[T28|пируватдегидрогеназного комплекса]] (PDH) ингибитором его киназы ([[T29|PDK]]) AZD7545 повышала мембранный потенциал и отношение NADH/NAD⁺; FCCP или дополнительный гидролиз ATP возвращали оба показателя к исходным значениям. Общее отношение ATP/ADP при этом не менялось, поэтому нехватка ADP у ATP-синтазы остаётся предположением авторов.","Вмешательства различаются по мишеням: олигомицин подавляет ATP-синтазу, FCCP рассеивает градиент, пиерицидин ингибирует комплекс I, дихлорацетат (DCA) подавляет PDK; их действие показано на схеме переключателем «Вмешательство». Присутствие O₂ не снимает блок комплекса I; остаточное дыхание зависит от других входов электронов, например [[T36|комплекса II (SDH)]]. В клетках с дефицитом комплекса I дыхание поддерживали проникающие пролекарства сукцината (Ehinger и соавт., 2016)."],"trap":["Если O₂ доступен, митохондрии окисляют весь цитозольный NADH.","Присутствие O₂ не гарантирует окисления всего NADH: при медленном обороте ATP высокий градиент тормозит перенос электронов, а передача электронов из цитозоля ограничена ёмкостью челноков."],"conditions":"Схема качественная: уровни показывают направление изменений, а не значения. Значения выхода ATP — учебные, по Ленинджеру; в этой работе по первоисточнику не перепроверялись. Сопряжение дыхания с оборотом ATP показано у Luengo и соавт. (2021) на клеточных линиях человека (по тексту статьи — 143B и H1299; список линий по легендам рисунков не проверялся) при 21 % O₂ с ингибитором PDK AZD7545, а не с DCA; отношение NAD⁺/NADH определяли в экстракте целой клетки и приводили как NAD⁺/NADH (здесь дана обратная запись NADH/NAD⁺); общее ATP/ADP не менялось, нехватка ADP у ATP-синтазы — гипотеза авторов. Насыщение челноков в клетках панели NCI-60 — у Wang и соавт. (2022). Эти работы выполнены на разных моделях и не исключают друг друга; один механизм нельзя считать общей причиной эффекта Варбурга. Возможность поддержать дыхание при блоке комплекса I через комплекс II показана на клетках с дефицитом комплекса I при подаче проникающих пролекарств сукцината (Ehinger и соавт., 2016; по аннотации).","sources":["LNR2","LUENGO","WANG","EHINGER"],"quiz":{"id":"S8-L05","rev":3,"question":"В клетках снижен расход ATP, а O₂ достаточно. Рассматривается сопряжённое дыхание без разобщителей и ингибиторов цепи. Что ограничивает окисление NADH в митохондриях?","options":[{"id":"S8-L05-1","text":"Перенос электронов тормозится протонным градиентом, который медленно используется ATP-синтазой.","correct":true,"feedback":"Если ATP расходуется медленно, ATP-синтаза использует градиент медленно, и перенос электронов замедляется (в рамках модели Luengo и соавт., 2021)."},{"id":"S8-L05-2","text":"Скорость переноса электронов определяется количеством NADH и не зависит от оборота ATP.","correct":false,"feedback":"Перенос электронов сопряжён с использованием градиента ATP-синтазой, поэтому его скорость зависит от оборота ATP."},{"id":"S8-L05-3","text":"Снижение расхода ATP повышает потребность в ADP и ускоряет ATP-синтазу, поэтому NADH окисляется быстрее.","correct":false,"feedback":"При меньшем обороте ATP ATP-синтаза использует градиент медленнее, поэтому она не ускоряется."}]},"widget":{"kind":"net","title":"","s":{"title":"Сопряжение дыхания с расходом ATP","status":"Схема механизма · качественные уровни, числа не заданы","ctrls":[{"id":"iv","type":"group","label":"Вмешательство","opts":["нет","олигомицин","FCCP","пиерицидин","DCA"]},{"id":"at","type":"group","label":"Расход ATP","opts":["обычный","сниженный"]}],"W":640,"H":380,"NW":340,"NH":850,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":100,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[4,4,332,206]},{"x":6,"y":114,"w":628,"h":262,"c":"mito","t":"митохондрия","lx":16,"ly":368,"n":[4,214,332,632]}],"mem":[],"nodes":{"lac":{"p":[85,52,90,38],"t":"лактат","n":[82,56,96,40]},"pyr":{"p":[240,52,100,38],"t":"пируват","n":[262,56,100,40]},"nadhc":{"p":[395,52,110,42],"t":"NADH\nцитозоль","n":[82,150,100,46],"fs":13},"pdk":{"p":[85,150,70,38],"t":"PDK","n":[262,356,70,40]},"pdh":{"p":[240,150,70,38],"t":"PDH","n":[262,262,70,40]},"nadhm":{"p":[395,150,110,42],"t":"NADH\nматрикс","n":[82,356,100,46],"fs":13},"c1":{"p":[565,150,108,38],"t":"комплекс I","n":[82,458,108,40],"fs":13},"chain":{"p":[565,246,122,44],"t":"Q, комплексы\nIII и IV","n":[82,556,124,46],"fs":13},"oth":{"p":[395,342,122,44],"t":"другие входы\nэлектронов","n":[262,556,124,46],"fs":13},"o2":{"p":[565,342,70,38],"t":"O₂","n":[82,654,70,40]},"grad":{"p":[395,246,100,44],"t":"протонный\nградиент","n":[262,654,100,46],"fs":13},"use":{"p":[240,246,90,44],"t":"расход\nATP","n":[82,750,90,46],"fs":13},"synth":{"p":[240,342,114,38],"t":"ATP-синтаза","n":[262,750,114,40],"fs":13}},"edges":{"sh":{"a":"nadhc","b":"nadhm","k":"eq","t":"челнок","tn":"челнок","d":[30,2],"dn":[-44,0]},"ldh":{"a":"pyr","b":"lac","k":"rx","t":"ЛДГ","d":[0,-12],"dn":[0,-12]},"in":{"a":"pyr","b":"pdh","k":"tr","t":"в матрикс","d":[40,0],"dn":[-36,0]},"pk":{"a":"pdk","b":"pdh","k":"phos","t":"фосфорилирует","tn":"P","d":[0,-12],"dn":[-48,0],"pm":0.55},"ph":{"a":"pdh","b":"nadhm","k":"rx","t":"NADH","d":[0,-12],"dn":[-40,0]},"ox":{"a":"nadhm","b":"c1","k":"rx"},"e1":{"a":"c1","b":"chain","k":"rx","t":"e⁻","d":[14,0],"dn":[-20,0]},"e2":{"a":"oth","b":"chain","k":"rx","t":"e⁻","d":[0,-10],"dn":[0,-12]},"e3":{"a":"chain","b":"o2","k":"rx","t":"e⁻ → H₂O","tn":"e⁻","d":[42,0],"dn":[50,0]},"h":{"a":"chain","b":"grad","k":"tr","t":"H⁺","d":[0,-12],"dn":[34,0]},"dr":{"a":"grad","b":"synth","k":"act","t":"движет","d":[30,0],"dn":[50,0]},"at":{"a":"synth","b":"use","k":"rx","t":"ATP","d":[0,0],"dn":[0,-18],"bend":26,"bn":18},"ad":{"a":"use","b":"synth","k":"rx","t":"ADP","d":[0,0],"dn":[0,18],"bend":26,"bn":18},"oli":{"a":[60,342,262,830],"b":"synth","k":"inh","t":"олигомицин","d":[0,-12],"dn":[30,0],"s":"hide"},"fc":{"a":[492,188,150,654],"b":"grad","k":"inh","t":"FCCP","d":[14,-6],"dn":[0,-12],"s":"hide"},"pi":{"a":[565,62,210,458],"b":"c1","k":"inh","t":"пиерицидин","d":[-14,0],"dn":[0,-12],"s":"hide"},"dc":{"a":[85,236,262,436],"b":"pdk","k":"inh","t":"DCA","d":[20,0],"dn":[20,0],"s":"hide"}},"st":{"0-0":{"n":{},"e":{},"note":"Исходное состояние: малат-аспартатный челнок передаёт восстановительные эквиваленты цитозольного NADH в матрикс, где образуется NADH; глицерол-3-фосфатный челнок передаёт электроны сразу на убихинон (на схеме — «другие входы электронов»). Комплекс I окисляет NADH матрикса; электроны переходят по дыхательной цепи к O₂, а протонный градиент используется для синтеза ATP. ADP образуется при расходе ATP.","bars":[["Потребление O₂",2],["Протонный градиент",2],["Синтез ATP митохондриями",2],["NADH/NAD⁺ (по клетке)",2],["Окисление пирувата (PDH)",1]],"et":{}},"0-1":{"n":{"use":"low"},"e":{"ad":"off"},"note":"Расход ATP снижен: ADP образуется меньше, ATP-синтаза использует градиент медленнее, он остаётся высоким, и перенос электронов к O₂ замедляется даже при достаточном содержании O₂; отношение NADH/NAD⁺ в клетке возрастает.","bars":[["Потребление O₂",1],["Протонный градиент",3],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",1]],"et":{"ad":"ADP меньше"}},"1-0":{"n":{"synth":"off","use":"base"},"e":{"oli":"on","dr":"off","at":"off","ad":"off"},"note":"Олигомицин подавляет ATP-синтазу: синтез ATP митохондриями подавляется, градиент не расходуется и остаётся высоким, а потребление O₂ и окисление NADH замедляются.","bars":[["Потребление O₂",1],["Протонный градиент",3],["Синтез ATP митохондриями",0],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",1]],"et":{}},"1-1":{"n":{"use":"low","synth":"off"},"e":{"ad":"off","oli":"on","dr":"off","at":"off"},"note":"При блоке ATP-синтазы олигомицином дыхание уже не зависит от расхода ATP: градиент не используется, потребление O₂ и окисление NADH замедлены.","bars":[["Потребление O₂",1],["Протонный градиент",3],["Синтез ATP митохондриями",0],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",1]],"et":{"ad":"ADP меньше"}},"2-0":{"n":{"grad":"low"},"e":{"fc":"on","dr":"off"},"note":"FCCP рассеивает протонный градиент: перенос электронов к O₂ не ограничен градиентом и идёт быстро, NADH окисляется, но синтез ATP митохондриями снижается.","bars":[["Потребление O₂",3],["Протонный градиент",1],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",1],["Окисление пирувата (PDH)",1]],"et":{}},"2-1":{"n":{"use":"low","grad":"low"},"e":{"ad":"off","fc":"on","dr":"off"},"note":"При рассеянном градиенте расход ATP почти не влияет на перенос электронов: дыхание и окисление NADH не ограничены градиентом, а синтез ATP митохондриями низок.","bars":[["Потребление O₂",3],["Протонный градиент",1],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",1],["Окисление пирувата (PDH)",1]],"et":{"ad":"ADP меньше"}},"3-0":{"n":{"c1":"off","oth":"on","o2":"met"},"e":{"pi":"on","ox":"off","e1":"off"},"note":"Пиерицидин блокирует комплекс I: присутствие O₂ не снимает блок, NADH матрикса не окисляется этим комплексом, и остаточное потребление O₂ зависит от других входов электронов, например комплекса II.","bars":[["Потребление O₂",1],["Протонный градиент",1],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",1]],"et":{}},"3-1":{"n":{"use":"low","c1":"off","oth":"on","o2":"met"},"e":{"ad":"off","pi":"on","ox":"off","e1":"off"},"note":"При блокированном комплексе I изменение расхода ATP не возвращает окисление NADH к исходному: остаточное дыхание зависит от других входов электронов, а отношение NADH/NAD⁺ в клетке остаётся высоким.","bars":[["Потребление O₂",1],["Протонный градиент",1],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",1]],"et":{"ad":"ADP меньше"}},"4-0":{"n":{"pdk":"off","pdh":"on"},"e":{"dc":"on","pk":"off","ph":"on"},"note":"DCA подавляет PDK, как и AZD7545 в работе Luengo. Фосфорилирование PDH снижается, комплекс остаётся активным, и окисление пирувата возрастает. При окислении пирувата в матриксе образуется больше NADH, градиент растёт, отношение NADH/NAD⁺ повышается. Для DCA такой эффект ожидается по механизму; в опыте он показан для AZD7545 в клетках с обычным расходом ATP.","bars":[["Потребление O₂",3],["Протонный градиент",3],["Синтез ATP митохондриями",2],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",3]],"et":{}},"4-1":{"n":{"use":"low","pdk":"off","pdh":"on"},"e":{"ad":"off","dc":"on","pk":"off","ph":"on"},"note":"При подавленной PDK и сниженном расходе ATP окисление пирувата остаётся высоким, а градиент высок и ограничивает перенос электронов; отношение NADH/NAD⁺ в клетке повышено.","bars":[["Потребление O₂",1],["Протонный градиент",3],["Синтез ATP митохондриями",1],["NADH/NAD⁺ (по клетке)",3],["Окисление пирувата (PDH)",3]],"et":{"ad":"ADP меньше"}}}}}},{"id":"aspartate","number":6,"section":0,"title":"Зачем делящейся клетке дыхание помимо синтеза ATP","question":1,"questions":[1],"keywords":["аспартат","оксалоацетат","малатдегидрогеназа","GOT","нуклеотиды","акцептор электронов","LbNOX","пируват","комплекс I"],"lead":["Дыхание нужно делящейся клетке не только для синтеза ATP: окисление NADH поддерживает содержание NAD⁺, необходимое для реакций синтеза [[T21|аспартата]].","Аспартат — исходное вещество для синтеза нуклеотидов и белков, поэтому его нехватка может замедлять деление клеток, хотя ATP достаточно."],"mechanism":["Малатдегидрогеназа окисляет малат до оксалоацетата, и для этой реакции нужен NAD⁺.","Аспартатаминотрансфераза переносит аминогруппу с глутамата на оксалоацетат: образуются аспартат и α-КГ.","Если комплекс I подавлен, NAD⁺ может регенерироваться за счёт другого акцептора электронов: добавленного в среду пирувата в реакции ЛДГ или O₂ в реакции LbNOX."],"paragraphs":["Аспартат образуется из [[T32|оксалоацетата]] в реакции [[T31|трансаминирования]]: аспартатаминотрансфераза (GOT) переносит аминогруппу с глутамата на оксалоацетат, и образуются аспартат и [[T33|α-кетоглутарат]] (α-КГ). Оксалоацетат возникает при окислении малата малатдегидрогеназой (MDH), которой нужен NAD⁺; если оксалоацетат образуется в окислительном пути из α-КГ, акцепторы электронов нужны также α-кетоглутаратдегидрогеназе и сукцинатдегидрогеназе (Sullivan и соавт., 2015). Образовавшийся NADH необходимо окислить, чтобы реакции продолжались: в матриксе это делает комплекс I, а в цитозоле — реакции, в которых другие соединения принимают электроны.","Эти положения проверяли на культивируемых клетках. В клетках 143B без функциональной дыхательной цепи (делеция в гене цитохрома b; среда с уридином) деление возвращали добавленные в среду пируват и α-кетобутират. Добавленные соединения служат экзогенными акцепторами электронов; пируват, образованный в клетке из глюкозы, такой функции не выполняет, поскольку гликолиз до лактата окислительно-восстановительно нейтрален (NADH из GAPDH окисляется в реакции ЛДГ). Дегидрогеназы, в том числе ЛДГ, восстанавливают α-кетобутират до α-гидроксибутирата за счёт NADH. Оба соединения снижали отношение NADH/NAD⁺, а α-кетобутират возвращал и содержание аспартата, но потребление O₂ не повышал. Добавление аспартата в избытке тоже возвращало деление, но не меняло ни потребление O₂, ни отношение NADH/NAD⁺: аспартат не принимает электроны, а восполняет недостающий предшественник (Sullivan и соавт., 2015).","В клетках Jurkat при подавлении комплекса I содержание аспартата снижалось, а добавленный в среду пируват (1 мМ) возвращал это содержание и деление клеток; для этого были нужны цитозольные MDH1 и GOT1, но не пируваткарбоксилаза (Birsoy и соавт., 2015). Эти данные согласуются с моделью, по которой NAD⁺, образованный при восстановлении добавленного пирувата, служит субстратом MDH1, а GOT1 синтезирует аспартат; без пирувата аспартат при подавлении комплекса I образовывался, в частности, путём восстановительного карбоксилирования α-КГ, образованного из глутамина.","Аналогичные результаты получены с водообразующей NADH-оксидазой LbNOX: она окисляет NADH до NAD⁺, восстанавливая O₂ до воды, и не синтезирует ATP. В клетках HeLa (среда с уридином, без пирувата) с подавленными комплексами I или III её экспрессия в цитозоле или в матриксе возвращала деление (Titov и соавт., 2016). Доступность аспартата зависит от типа клеток, транспорта аспартата и состава среды."],"trap":["Аспартат возвращает деление клеток без дыхания, потому что служит акцептором электронов.","Аспартат не принимает электроны: добавление аспартата не повышало потребление O₂ и не меняло отношение NADH/NAD⁺ в клетках 143B, а восполняло нехватку самого предшественника (Sullivan и соавт., 2015)."],"conditions":"Схема показывает механизм без концентраций и времён. Результаты получены на культивируемых клетках разных линий: 143B с делецией в гене цитохрома b (среда с уридином; Sullivan и соавт., 2015), Jurkat (Birsoy и соавт., 2015) и HeLa (Titov и соавт., 2016). Пируват и α-кетобутират добавляли в среду экзогенно (у Birsoy и соавт. пируват — 1 мМ); среда для HeLa содержала уридин, но не содержала пирувата; аспартат добавляли в сверхфизиологических концентрациях (у Birsoy и соавт. 10 мМ против 150 мкМ в стандартной среде RPMI). Вывод не переносится на любые клетки и ткани: возвращение деления аспартатом не гарантировано.","sources":["SULLIVAN","BIRSOY","TITOV"],"quiz":{"id":"S8-L06","rev":2,"question":"Содержание ATP достаточное, но регенерация NAD⁺ нарушена. Какое последствие может объяснить замедление деления?","options":[{"id":"S8-L06-2","text":"Аспартат принимает электроны, и без него дыхательная цепь не окисляет NADH.","correct":false,"feedback":"Аспартат не принимает электроны: его добавление не меняет потребление O₂ и отношение NADH/NAD⁺."},{"id":"S8-L06-1","text":"Нехватка аспартата как предшественника ограничивает синтез нуклеотидов.","correct":true,"feedback":"Нуклеотиды синтезируются из аспартата; ATP этот субстрат не заменяет."},{"id":"S8-L06-3","text":"Нехватка NAD⁺ нарушает синтез белков, а синтез нуклеотидов не затрагивает.","correct":false,"feedback":"Аспартат нужен и для синтеза нуклеотидов; при его нехватке они синтезируются хуже."}]},"widget":{"kind":"net","title":"","s":{"title":"Откуда берётся NAD⁺ для синтеза аспартата","status":"Схема механизма · качественные уровни, числа не заданы","ctrls":[{"id":"ac","type":"group","label":"Акцептор электронов в цитозоле","opts":["нет","пируват (ЛДГ)","LbNOX"]},{"id":"c1","type":"group","label":"Комплекс I","opts":["работает","подавлен пиерицидином"]}],"W":640,"H":380,"NW":340,"NH":590,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":158,"c":"mito","t":"матрикс митохондрии","lx":16,"ly":24,"n":[4,4,332,270]},{"x":6,"y":172,"w":628,"h":200,"c":"cyto","t":"цитозоль","lx":16,"ly":190,"n":[4,284,332,296]}],"mem":[],"nodes":{"mal_m":{"p":[60,64,84,40],"t":"малат","n":[82,58,96,40]},"oaa_m":{"p":[224,64,124,40],"t":"оксалоацетат","n":[262,58,124,40],"fs":13},"asp_m":{"p":[396,64,100,40],"t":"аспартат","n":[262,150,100,40]},"nad_m":{"p":[240,124,106,42],"t":"NAD⁺\nматрикса","n":[82,150,100,46],"fs":13},"c1":{"p":[66,124,106,36],"t":"комплекс I","n":[82,242,106,40],"fs":13},"mal_c":{"p":[60,228,84,40],"t":"малат","n":[82,430,96,40]},"oaa_c":{"p":[224,228,124,40],"t":"оксалоацетат","n":[262,430,124,40],"fs":13},"asp_c":{"p":[396,228,100,40],"t":"аспартат","n":[262,340,100,40]},"nuc":{"p":[566,228,120,40],"t":"нуклеотиды","n":[82,340,112,40],"fs":13},"nad_c":{"p":[240,322,106,42],"t":"NAD⁺\nцитозоля","n":[82,520,100,46],"fs":13},"acc":{"p":[460,322,190,56],"t":"акцептор","n":[262,520,124,56],"fs":13}},"edges":{"m1":{"a":"mal_m","b":"oaa_m","k":"rx","t":"MDH2","d":[0,-12],"dn":[0,-12]},"m2":{"a":"oaa_m","b":"asp_m","k":"rx","t":"GOT2\nглутамат → α-КГ","tn":"GOT2\nGlu→α-КГ","d":[-70,-46],"dn":[8,0],"anc":"start"},"mn":{"a":"nad_m","b":[129,66,172,70],"k":"act"},"mc":{"a":"c1","b":"nad_m","k":"rx"},"tr":{"a":"asp_m","b":"asp_c","k":"tr","t":"транспорт","d":[40,0],"dn":[-36,0]},"c1e":{"a":"mal_c","b":"oaa_c","k":"rx","t":"MDH1","d":[0,-12],"dn":[0,-12]},"c2e":{"a":"oaa_c","b":"asp_c","k":"rx","t":"GOT1\nглутамат → α-КГ","tn":"GOT1\nGlu→α-КГ","d":[-85,-30],"dn":[8,0],"anc":"start"},"c3e":{"a":"asp_c","b":"nuc","k":"rx","t":"синтез","d":[0,-12],"dn":[0,-12]},"cn":{"a":"nad_c","b":[129,232,172,430],"k":"act"},"cc":{"a":"acc","b":"nad_c","k":"rx","t":"окисление NADH","tn":"окисление","d":[0,-12],"dn":[0,-12]}},"st":{"0-0":{"n":{"c1":"on","nad_m":"on","asp_m":"on","acc":"off"},"e":{"cc":"off"},"t":{"acc":"нет\nакцептора"},"note":"Комплекс I работает: он окисляет NADH матрикса, и NAD⁺ обеспечивает реакцию MDH2. Образуются оксалоацетат и аспартат, который выходит в цитозоль и используется для синтеза нуклеотидов.","bars":[["NAD⁺ в матриксе",3],["NAD⁺ в цитозоле",3],["Образование аспартата",3],["Обеспеченность синтеза нуклеотидов",3]]},"0-1":{"n":{"c1":"off","nad_m":"low","asp_m":"low","mal_m":"low","oaa_m":"low","acc":"off","nad_c":"low","oaa_c":"low","asp_c":"low","nuc":"low"},"e":{"mc":"off","m1":"off","m2":"off","tr":"off","mn":"off","cc":"off","c1e":"off","cn":"off","c2e":"off","c3e":"off"},"t":{"acc":"нет\nакцептора","c1":"комплекс I,\nпиерицидин"},"note":"Комплекс I подавлен пиерицидином, дополнительного акцептора электронов нет: NAD⁺ регенерируется недостаточно ни в матриксе, ни в цитозоле, реакции MDH замедляются, аспартата образуется мало, и синтез нуклеотидов ограничен.","bars":[["NAD⁺ в матриксе",1],["NAD⁺ в цитозоле",1],["Образование аспартата",1],["Обеспеченность синтеза нуклеотидов",1]]},"1-0":{"n":{"c1":"on","nad_m":"on","asp_m":"on","acc":"base"},"e":{},"t":{"acc":"пируват в среде\n→ лактат (ЛДГ)"},"note":"Комплекс I работает, и аспартат образуется в матриксе; дополнительный акцептор электронов (пируват из среды, восстанавливаемый ЛДГ) для этого не нужен.","bars":[["NAD⁺ в матриксе",3],["NAD⁺ в цитозоле",3],["Образование аспартата",3],["Обеспеченность синтеза нуклеотидов",3]]},"1-1":{"n":{"c1":"off","nad_m":"low","asp_m":"low","mal_m":"low","oaa_m":"low","acc":"on","nad_c":"on","asp_c":"on","nuc":"base"},"e":{"mc":"off","m1":"off","m2":"off","tr":"off","mn":"off"},"t":{"acc":"пируват в среде\n→ лактат (ЛДГ)","c1":"комплекс I,\nпиерицидин"},"note":"Пируват, добавленный в среду, восстанавливается ЛДГ до лактата и окисляет NADH цитозоля. NAD⁺, образовавшийся в реакции ЛДГ, может использоваться MDH1; тогда аспартат синтезируется цитозольным путём MDH1 и GOT1. Матриксный путь не работает, комплекс I по-прежнему подавлен.","bars":[["NAD⁺ в матриксе",1],["NAD⁺ в цитозоле",3],["Образование аспартата",3],["Обеспеченность синтеза нуклеотидов",3]]},"2-0":{"n":{"c1":"on","nad_m":"on","asp_m":"on","acc":"base"},"e":{},"t":{"acc":"LbNOX: NADH + O₂\n→ NAD⁺ + H₂O"},"note":"Комплекс I работает, и аспартат образуется в матриксе; дополнительная NADH-оксидаза LbNOX для этого не нужна.","bars":[["NAD⁺ в матриксе",3],["NAD⁺ в цитозоле",3],["Образование аспартата",3],["Обеспеченность синтеза нуклеотидов",3]]},"2-1":{"n":{"c1":"off","nad_m":"low","asp_m":"low","mal_m":"low","oaa_m":"low","acc":"on","nad_c":"on"},"e":{"mc":"off","m1":"off","m2":"off","tr":"off","mn":"off"},"t":{"acc":"LbNOX: NADH + O₂\n→ NAD⁺ + H₂O","c1":"комплекс I,\nпиерицидин"},"note":"LbNOX окисляет NADH цитозоля, восстанавливая O₂ до воды, без синтеза ATP: содержание NAD⁺ в цитозоле возвращается при подавленном комплексе I. Образование аспартата и обеспеченность нуклеотидами в этой схеме не оцениваются.","bars":[["NAD⁺ в матриксе",1],["NAD⁺ в цитозоле",3],["Образование аспартата",-1],["Обеспеченность синтеза нуклеотидов",-1]]}}}}},{"id":"extracellular-flux","number":7,"section":0,"title":"Что показывают потребление O₂ и внеклеточное закисление","question":1,"questions":[1],"keywords":["OCR","ECAR","потребление кислорода","внеклеточное закисление","буферная ёмкость","дыхательный CO₂","нормировка","лактат","олигомицин"],"lead":["Внеклеточный анализ потоков (в литературе — анализатор Seahorse XF) регистрирует убыль O₂ и снижение pH в малом объёме над клетками и рассчитывает [[T78|OCR]] и [[T79|ECAR]].","Это косвенные показатели: ECAR не равен скорости образования лактата, а OCR — скорости синтеза ATP."],"mechanism":["Датчики регистрируют O₂ и pH во времени, и скорость определяют по наклону кривой, а не по значению в точке.","Закисление создают лактат, выходящий вместе с протоном, и CO₂, который гидратируется до HCO₃⁻ и H⁺, поэтому ECAR включает вклад дыхания.","Чтобы оценить скорость образования лактата, переводят ECAR в скорость выхода протонов с помощью буферной ёмкости среды, вычитают вклад CO₂ и сверяют результат с измерением лактата в среде."],"paragraphs":["На схеме клетки в монослое покрыты малым объёмом среды, в котором O₂-датчик и pH-датчик регистрируют изменения во времени. OCR — скорость убыли O₂, ECAR — скорость снижения pH, в единицах mpH/мин. Обе величины — наклоны кривых и зависят от числа клеток в лунке, поэтому показания нормируют на число клеток или содержание белка. Последовательность добавлений показана на схеме: потребление O₂, подавляемое олигомицином, соответствует дыханию, связанному с синтезом ATP; после FCCP достигается максимальное потребление O₂; остаточное потребление O₂ после ингибиторов комплексов I и III считают немитохондриальным (Brand и Nicholls, 2011).","Закисление среды вызывают два основных процесса: лактат, выходящий вместе с протоном, и CO₂, образующийся при окислении субстратов (в том числе в цикле трикарбоновых кислот). В замкнутом объёме CO₂ остаётся в среде, гидратируется до HCO₃⁻ и отдаёт протон. В работе Mookerjee и соавт. (2015) на миобластах C2C12 с глюкозой дыхательный CO₂ составлял 34 % закисления; при отсутствии глюкозы или замене её пальмитатом либо пируватом — 67–100 %; в разных линиях клеток эта доля составляла от 3 до 100 %. При малой и постоянной доле CO₂ изменение ECAR примерно пропорционально изменению потока в лактат; при изменении дыхания (после олигомицина или FCCP) это допущение нарушается.","Поэтому ECAR пересчитывают: переводят в скорость выхода протонов с помощью буферной ёмкости среды, определённой титрованием кислотой (на схеме — контроль «буферная ёмкость среды»), вычитают вклад CO₂, рассчитанный по OCR за вычетом немитохондриального потребления O₂, и нормируют результат. Для проверки лактат измеряют в среде отдельным методом (на схеме — строка «лактат в среде: отдельное измерение»; Mookerjee и Brand, 2015). Расчёт скорости образования ATP требует ещё и модели сопряжения: OCR включает немитохондриальную часть и потребление O₂, не связанное с синтезом ATP."],"trap":["ECAR прямо измеряет скорость образования лактата.","ECAR — скорость изменения pH. Чтобы перейти к потоку лактата, нужны буферная ёмкость, поправка на дыхательный CO₂ и нормировка, а результат сверяют с измерением лактата в среде."],"conditions":"Кривые и числа на схеме учебные: условные единицы, постоянное образование лактата и 1 H⁺ на 1 молекулу O₂ (при дыхательном коэффициенте около 1 это соответствует 1 H⁺ на 1 молекулу CO₂) — допущения модели, а не данные опыта. Доли CO₂ (34 %; 67–100 %; 3–100 %) приведены по Mookerjee и соавт. (2015; полный текст) для C2C12 и других линий; пересчёт ECAR и контроль — по методической статье Mookerjee и Brand (JoVE, 2015), прочитанной в полном тексте. Назначение ингибиторов в тесте и показатели клеточного дыхательного контроля — по Brand и Nicholls (2011; по аннотации).","sources":["MOOKERJEE","MOOKERJEE_JOVE","BRAND2011"],"quiz":{"id":"S8-L07","rev":2,"question":"При одинаковом числе жизнеспособных клеток ECAR возрос; доля дыхательного CO₂ в закислении не измерена. Какой вывод допустим?","options":[{"id":"S8-L07-2","text":"Поток в лактат вырос пропорционально ECAR, поскольку закисление определяется образованием лактата.","correct":false,"feedback":"Пропорциональность выполняется только при малой и постоянной доле дыхательного CO₂ и известной буферной ёмкости; здесь доля не измерена."},{"id":"S8-L07-3","text":"Скорость синтеза ATP митохондриями выросла, так как закисление среды усилилось.","correct":false,"feedback":"ECAR непосредственно не измеряет митохондриальный синтез ATP; закисление создают и лактат, и CO₂."},{"id":"S8-L07-1","text":"Внеклеточное закисление усилилось; доля лактата в нём без дополнительных измерений не определена.","correct":true,"feedback":"pH-датчик регистрирует суммарный эффект, включая вклад дыхательного CO₂."}]},"widget":{"kind":"s1b_probe","title":"","s":{"title":"Внеклеточный анализ потоков: что регистрируют датчики","status":"Учебная модель · условные единицы, не данные опыта","phase_label":"Фаза опыта (последовательные добавления)","phases":["исходные скорости","+ олигомицин","+ FCCP","+ ингибиторы комплексов I и III"],"sl_lac":"Образование лактата (на клетку), усл. ед.","sl_o2":"Митохондриальное потребление O₂ до добавлений (на клетку), усл. ед.","bc_label":"Буферная ёмкость среды","bc_opts":["высокая","низкая"],"cell_label":"Число клеток в лунке","cell_opts":["исходное","вдвое больше"],"norm_label":"Нормировать показания на число клеток","title_a":"Камера: клетки, среда и датчики","desc_a":"Над монослоем клеток находится малый объём среды; O₂-датчик и pH-датчик регистрируют убыль O₂ и закисление. Стрелки показывают потребление O₂, выход лактата с протоном и выход CO₂.","t_o2s":"O₂-датчик","t_phs":"pH-датчик","t_vol":"малый объём среды","t_cells":"клетки (монослой)","a_o2":"O₂","a_lac":"лактат + H⁺","a_lac_n":["лактат","+ H⁺"],"a_co2_n":["CO₂ →","HCO₃⁻ + H⁺"],"ctl_title":"Что контролируют","ctl":["число клеток или белок","буферная ёмкость среды\n(титрование кислотой)","лунка без клеток","немитохондриальное\nпотребление O₂"],"note_units":"Все значения учебные","title_b":"Кривые O₂ и pH во времени","desc_b":"Пилообразные кривые: в каждом цикле измерения O₂ убывает, а pH снижается; наклон кривой определяет скорость. После каждого цикла среду перемешивают, и показание возвращается. Вертикальные линии — добавления.","b_o2":"O₂ в среде","b_ph":"pH среды","b_inj":["олигомицин","FCCP","ингибиторы I и III"],"b_time":"время →","b_inj_long":["олигомицин — ингибитор ATP-синтазы","FCCP — разобщитель, рассеивающий протонный градиент","ингибиторы комплексов I и III — останавливают митохондриальное дыхание"],"title_c":"Скорости по фазам и источники закисления","desc_c":"Столбцы показывают OCR и ECAR в каждой фазе; полоса ниже делит закисление выбранной фазы на лактат-связанную и дыхательную части.","c_title":"Скорости в фазах (усл. ед.)","c_ph":["исходная","олигомицин","FCCP","I и III"],"c_split":"Источники закисления (выбранная фаза)","c_lac":"лактат","c_none":"закисления нет","c_check":"лактат в среде: отдельное измерение","unit":"усл. ед.","m_ocr":"OCR","m_ecar":"ECAR","m_frac":"Доля CO₂ в закислении","m_per":"ECAR на единицу лактата","na":"не определена","notes":{"phase0":"При нулевом митохондриальном потреблении O₂ добавления не меняют дыхательную часть закисления: ECAR определяет лактат-связанная часть.","phase":["Исходные скорости: закисление складывается из лактат-связанной и дыхательной частей, поэтому ECAR не равен скорости образования лактата.","После олигомицина митохондриальное потребление O₂ ниже, дыхательный CO₂ даёт меньше кислоты, и ECAR уменьшается, хотя образование лактата в модели не менялось.","После FCCP потребление O₂ в модели возрастает, дыхательного CO₂ больше, и ECAR растёт при неизменном образовании лактата.","После ингибиторов комплексов I и III в модели остаётся немитохондриальное потребление O₂, дыхательный вклад в закисление исчезает, и ECAR определяет лактат-связанная часть."],"buf":"При низкой буферной ёмкости тот же выход протонов даёт большее изменение pH, поэтому ECAR выше; без калибровки буфера сравнивать ECAR разных сред нельзя.","cells":"Без нормировки OCR и ECAR пропорциональны числу клеток в лунке: при вдвое большем числе клеток показания удваиваются при тех же скоростях на клетку.","norm":"После нормировки показания не зависят от числа клеток в лунке; нормировка требует отдельного подсчёта клеток или измерения белка.","co2":"Доля CO₂ определяется дыханием и субстратом, поэтому её нужно оценивать в каждом опыте: в работе Mookerjee и соавт. (2015) она составляла от 3 до 100 % в разных клетках. Пропорциональность ECAR и потока в лактат допустима, только если эта доля мала и постоянна."},"fixed":"Все значения учебные. В модели образование лактата принято постоянным во всех фазах; протоны дыхания принято считать по 1 на молекулу потреблённого O₂ (около 1 H⁺ на молекулу CO₂ при дыхательном коэффициенте 1).","model":{"mult":[1,0.35,1.6,0],"nonmito":0.4,"hpo":1,"bc":[3,1.5],"cells":[1,2],"lac0":6,"o20":5,"cycles":3,"ko":4,"kp":3.5,"vmax":36},"static":["Схема метода (текстовая копия). Клетки в монослое находятся под малым объёмом среды; O₂-датчик регистрирует убыль кислорода, pH-датчик — закисление.","Скорости OCR и ECAR рассчитывают по наклону кривых во времени после последовательных добавлений олигомицина, FCCP и ингибиторов комплексов I и III.","Закисление складывается из лактата с протоном и из CO₂ (CO₂ + H₂O ⇄ HCO₃⁻ + H⁺), поэтому ECAR не равен скорости образования лактата.","Контроли: число клеток или белок, буферная ёмкость среды, лунка без клеток, немитохондриальное потребление O₂, отдельное измерение лактата в среде. Значения учебные."]}}},{"id":"tca","number":8,"section":1,"title":"Почему цикл трикарбоновых кислот участвует и в окислении, и в биосинтезе","question":2,"questions":[2],"keywords":["ЦТК","цикл Кребса","ацетил-CoA","оксалоацетат","цитрат","NADH","SDH","амфиболический путь","промежуточное соединение"],"lead":["[[T22|Цикл трикарбоновых кислот]] (ЦТК) окисляет ацетильную группу ацетил-CoA и регенерирует оксалоацетат.","Его [[T24|промежуточные соединения]] служат также исходными веществами для биосинтеза, поэтому ЦТК называют [[T23|амфиболическим путём]]: он сочетает катаболическую и анаболическую роли."],"mechanism":["Цитратсинтаза присоединяет ацетильную группу к оксалоацетату с образованием цитрата; в конце оборота оксалоацетат регенерируется.","За один полный окислительный оборот на одну вошедшую ацетильную группу образуются три NADH, одна молекула убихинола (QH₂; электроны от сукцината через связанный с SDH FAD), одна молекула GTP или ATP и две молекулы CO₂.","Электроны NADH и QH₂ передаются дыхательной цепи; если передача электронов нарушена, NAD⁺ и окисленный убихинон не регенерируются, и дегидрогеназные реакции цикла замедляются."],"paragraphs":["Цикл начинается реакцией цитратсинтазы: ацетильная группа ацетил-CoA присоединяется к [[T32|оксалоацетату]], и образуется цитрат. Затем аконитаза превращает цитрат в изоцитрат, изоцитратдегидрогеназа IDH3 окисляет изоцитрат до [[T33|α-кетоглутарата]] (α-КГ), α-кетоглутаратдегидрогеназа (α-КГДГ) — α-КГ до сукцинил-CoA, а сукцинил-CoA-синтетаза (SCS) образует сукцинат. Сукцинат окисляется сукцинатдегидрогеназой ([[T36|SDH]], комплекс II) до фумарата, фумараза присоединяет воду с образованием малата, и малатдегидрогеназа вновь образует оксалоацетат.","Окислительные реакции переносят электроны на коферменты. IDH3, α-КГДГ и малатдегидрогеназа восстанавливают NAD⁺ до NADH, причём IDH3 и α-КГДГ выделяют по одной молекуле CO₂. SDH восстанавливает прочно связанный с ней FAD и передаёт электроны убихинону; свободный FADH₂ из фермента не выходит. SCS использует энергию тиоэфирной связи сукцинил-CoA для фосфорилирования GDP или ADP. Эти количества относятся к одному полному обороту на одну ацетильную группу. Два выделяющихся CO₂ образуются из углерода оксалоацетата, а не из ацетильной группы, вошедшей в том же обороте; углерод этой группы выделится в виде CO₂ в последующих оборотах (см. шаг про катаплероз).","В реакциях цикла O₂ не является субстратом. Однако работа цикла зависит от дыхательной цепи: NADH и QH₂ должны окисляться, а NAD⁺ и окисленный убихинон — регенерироваться. Если передача электронов дыхательной цепи нарушена, доступность NAD⁺ и окисленного убихинона снижается, и дегидрогеназные реакции цикла замедляются.","Те же промежуточные соединения служат исходными веществами для биосинтеза: из цитрата образуется ацетил-CoA для липидов, из оксалоацетата — аспартат, из α-КГ — глутамат, из сукцинил-CoA — гем. Поэтому ЦТК одновременно окисляет субстраты и поставляет предшественники. Это не значит, что каждая реакция выполняет обе функции. В открытой сети с ответвлениями стехиометрия полного оборота не задаёт величину каждого реального потока."],"trap":["В каждой реакции цикла непосредственно расходуется O₂.","O₂ не субстрат реакций цикла. Цикл зависит от дыхательной цепи, которая окисляет NADH и QH₂ и передаёт электроны на O₂; без этой передачи NAD⁺ и убихинон не регенерируются."],"conditions":"Схема качественная: показаны реакции, коферменты и ответвления без концентраций и скоростей; ферменты цикла находятся в матриксе митохондрий, кроме SDH, встроенной во внутреннюю мембрану. Стехиометрия полного окислительного оборота приведена по учебникам биохимии (Ленинджер, т. 2; Альбертс); количества не относятся к конкретным клеткам.","sources":["LNR2","ALBESS"],"quiz":{"id":"S8-L08","rev":2,"question":"Почему цикл трикарбоновых кислот называют амфиболическим путём?","options":[{"id":"S8-L08-2","text":"Кислород служит субстратом нескольких реакций цикла, поэтому цикл связан и с окислением, и с синтезом.","correct":false,"feedback":"В реакциях цикла O₂ не является субстратом; связь с ним опосредована дыхательной цепью."},{"id":"S8-L08-3","text":"Цикл образует ATP субстратным фосфорилированием и одновременно расходует его на синтез промежуточных соединений.","correct":false,"feedback":"В реакциях цикла ATP (GTP) образует только SCS, а расходуют его не реакции цикла; «амфиболический» — сочетание катаболической и анаболической функций."},{"id":"S8-L08-1","text":"Его реакции окисляют ацетильную группу, а промежуточные соединения служат источником предшественников для биосинтеза.","correct":true,"feedback":"Обе функции связаны общими промежуточными соединениями."}]},"widget":{"kind":"net","title":"","s":{"title":"Цикл трикарбоновых кислот: реакции, коферменты, ответвления","status":"Схема механизма · качественные состояния","ctrls":[{"id":"m","type":"group","label":"Состояние цикла","opts":["Полный окислительный оборот","Передача электронов нарушена","Отведение в биосинтез"]}],"W":640,"H":380,"NW":340,"NH":640,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":368,"c":"mito","t":"митохондрия","lx":626,"ly":364,"n":[4,4,332,632,330,624],"a":"end"}],"mem":[],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,190,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,190,68,40],"fs":14},"iso":{"p":[346,190,100,40],"t":"изоцитрат","n":[282,290,94,40],"fs":14},"akg":{"p":[472,190,60,40],"t":"α-КГ","n":[282,390,54,40],"fs":14},"scoa":{"p":[472,305,98,46],"t":"сукцинил-\nCoA","n":[282,490,94,48],"fs":14},"suc":{"p":[332,305,90,40],"t":"сукцинат","n":[58,490,84,40],"fs":14},"fum":{"p":[201,305,80,40],"t":"фумарат","n":[58,390,78,40],"fs":14},"mal":{"p":[70,305,66,40],"t":"малат","n":[58,290,62,40],"fs":14},"acoa":{"p":[214,62,104,34],"t":"ацетил-CoA","n":[170,44,108,34],"fs":14},"etc":{"p":[270,247,124,46],"t":"дыхательная\nцепь","n":[110,590,178,40],"fs":13,"tn":"дыхательная цепь"},"asp":{"p":[70,112,86,30],"t":"аспартат","n":[58,112,86,30],"fs":13},"lip":{"p":[290,112,78,30],"t":"липиды","n":[282,112,78,30],"fs":13},"glu":{"p":[578,190,86,30],"t":"глутамат","n":[170,390,86,30],"fs":13},"hem":{"p":[578,305,50,30],"t":"гем","n":[282,560,50,30],"fs":13}},"edges":{"cs":{"a":"oaa","b":"cit","k":"rx","t":"CS","d":[0,-13],"dn":[0,-14]},"aco":{"a":"cit","b":"iso","k":"rx","t":"ACO","d":[0,-13],"dn":[-26,0]},"idh":{"a":"iso","b":"akg","k":"rx","t":"IDH3\nNADH, CO₂","d":[0,-44],"dn":[-56,0]},"kgdh":{"a":"akg","b":"scoa","k":"rx","t":"α-КГДГ\nNADH, CO₂","d":[52,0],"dn":[-56,0]},"scs":{"a":"scoa","b":"suc","k":"rx","t":"SCS\nGTP или ATP","d":[0,32],"dn":[0,-26]},"sdh":{"a":"suc","b":"fum","k":"rx","t":"SDH\nFAD → QH₂","d":[0,32],"dn":[52,0]},"fh":{"a":"fum","b":"mal","k":"rx","t":"FH","d":[0,30],"dn":[24,0]},"mdh":{"a":"mal","b":"oaa","k":"rx","t":"MDH\nNADH","d":[42,0],"dn":[34,0]},"in":{"a":"acoa","b":"cit","k":"rx"},"xa":{"a":"oaa","b":"asp","k":"rx"},"xl":{"a":"cit","b":"lip","k":"rx","dash":true},"xg":{"a":"akg","b":"glu","k":"rx"},"xh":{"a":"scoa","b":"hem","k":"rx"}},"st":{"0":{"n":{"asp":"hide","lip":"hide","glu":"hide","hem":"hide","acoa":"on","etc":"on"},"e":{"xa":"hide","xl":"hide","xg":"hide","xh":"hide"},"m":[["NADH за оборот","3"],["QH₂ за оборот (через связанный FAD)","1"],["GTP или ATP за оборот","1"]],"note":"Полный окислительный оборот: ацетильная группа входит в цикл, три реакции образуют NADH, SDH передаёт электроны убихинону, а SCS образует GTP или ATP. Дыхательная цепь окисляет NADH и QH₂."},"1":{"n":{"asp":"hide","lip":"hide","glu":"hide","hem":"hide","acoa":"base","etc":"off"},"e":{"xa":"hide","xl":"hide","xg":"hide","xh":"hide","idh":"off","kgdh":"off","sdh":"off","mdh":"off"},"m":[["Окисление NADH и QH₂","ограничено"],["Доступность NAD⁺ и Q","снижена"],["Дегидрогеназные реакции","замедлены"]],"note":"Электроны NADH и QH₂ не передаются дыхательной цепи. NAD⁺ и окисленный убихинон не регенерируются, поэтому IDH3, α-КГДГ, SDH и малатдегидрогеназа замедляются."},"2":{"n":{"acoa":"base","etc":"base","asp":"sel","lip":"sel","glu":"sel","hem":"sel"},"m":[["Из цитрата","липиды (несколько реакций)"],["Из оксалоацетата и α-КГ","аспартат, глутамат"],["Из сукцинил-CoA","гем"]],"note":"Промежуточные соединения служат исходными веществами для синтеза липидов, аспартата, глутамата и гема. Пунктир у цитрата означает, что превращение в липиды состоит из нескольких реакций."}},"nfs":13}}},{"id":"cataplerosis","number":9,"section":1,"title":"Как отток промежуточных соединений связывает цикл с биосинтезом","question":2,"questions":[2],"keywords":["катаплероз","анаплероз","отток цитрата","АТФ-цитратлиаза","аспартат","глутамат","гем","внутренняя мембрана","баланс притока и оттока"],"lead":["[[T25|Катаплероз]] — чистый отток промежуточных соединений ЦТК в другие метаболические пути.","Он связывает цикл с биосинтезом; без компенсации притоком углеродных скелетов количество промежуточных соединений в цикле убывает."],"mechanism":["Цитрат выходит из матрикса через переносчик внутренней мембраны; в цитозоле ATP-цитратлиаза образует из него ацетил-CoA для синтеза липидов.","Оксалоацетат превращается в аспартат, α-КГ — в глутамат, сукцинил-CoA вступает в синтез гема.","Если приток углеродных скелетов не равен оттоку, количество промежуточных соединений изменяется; при преобладании оттока оно снижается."],"paragraphs":["Промежуточные соединения ЦТК образуются в одних реакциях цикла и расходуются в других, поэтому при полном обороте их количество не изменяется. Но те же соединения служат исходными веществами для биосинтеза. Выход соединения из цикла в другой путь называют катаплерозом, если он приводит к чистому оттоку. Не всякое превращение, при котором вещество покидает цикл, считают катаплерозом: обратимая обменная реакция, у которой прямое и обратное направления уравновешены, чистого оттока не создаёт.","Цитрат покидает матрикс митохондрии через переносчик внутренней мембраны. В цитозоле ATP-цитратлиаза (ACLY) расщепляет его на ацетил-CoA и оксалоацетат с затратой ATP, и ацетил-CoA используется для синтеза липидов. Остальные три отведения происходят в матриксе: оксалоацетат превращается в аспартат, α-КГ — в глутамат, а сукцинил-CoA вступает в синтез гема. Оксалоацетат практически не проходит через внутреннюю мембрану; из матрикса выходит аспартат. Оксалоацетат, образованный ACLY в цитозоле, может превращаться в аспартат (цитозольная аминотрансфераза GOT1; см. шаг про аспартат) или в малат, а малат — в пируват с образованием NADPH (малик-фермент).","Чтобы количество промежуточных соединений сохранялось, отток должен компенсироваться [[T26|анаплерозом]]: поступлением углеродных скелетов из других путей, например из пирувата или глутамина (см. следующие шаги). Если отток цитрата на синтез липидов длительно усилен, а приток не изменился, количество промежуточных соединений в матриксе снижается до установления нового стационарного состояния (см. шаг про поток и содержание метаболита), и скорость реакций цикла может ограничиваться их доступностью. При преобладании притока количество, наоборот, может расти, пока не изменятся скорости других реакций.","Для иллюстрации (условные единицы): при оттоке 3 условные единицы в минуту и притоке 1 условной единице в минуту чистая потеря составляет 2 условные единицы в минуту. Ацетил-CoA, входящий в цикл, чистого притока промежуточных соединений не создаёт. Два его атома углерода в последующих оборотах выделяются в виде CO₂, а реакций, превращающих ацетил-CoA в оксалоацетат без потери углерода, в клетках человека нет. Поэтому для восполнения нужны реакции, вводящие в цикл дополнительный углерод."],"trap":["Отток цитрата не влияет на цикл, потому что цитрат синтезируется заново из ацетил-CoA.","Для образования нового цитрата нужен оксалоацетат, а ацетил-CoA его не пополняет. Если отток не компенсирован притоком углерода, количество промежуточных соединений убывает."],"conditions":"Схема качественная: показаны положение реакций (матрикс, цитозоль) и направления оттока и притока; числа не заданы. Расположение реакций приведено по учебнику биохимии (Ленинджер, т. 2).","sources":["LNR2"],"quiz":{"id":"S8-L09","rev":2,"question":"Отведение цитрата на синтез липидов длительно усилилось, а восполнение промежуточных соединений не изменилось. Что может ограничить дальнейший поток через цикл?","options":[{"id":"S8-L09-1","text":"Снижение количества оксалоацетата и других промежуточных соединений цикла в матриксе.","correct":true,"feedback":"Без компенсации оттока количество промежуточных соединений в цикле снижается."},{"id":"S8-L09-2","text":"Избыток NADPH, образующегося при переносе цитрата в цитозоль и подавляющего реакции цикла.","correct":false,"feedback":"Перенос цитрата NADPH не образует; образование NADPH зависит от последующих реакций в цитозоле."},{"id":"S8-L09-3","text":"Накопление цитрата в матриксе, которое по принципу обратной связи блокирует цитратсинтазу.","correct":false,"feedback":"При усиленном выходе цитрата его содержание в матриксе снижается, а не растёт."}]},"widget":{"kind":"net","title":"","s":{"title":"Отток и приток промежуточных соединений ЦТК","status":"Схема механизма · качественные состояния","ctrls":[{"id":"o","type":"group","label":"Отток цитрата на синтез липидов","opts":["исходный","усилен"]},{"id":"i","type":"group","label":"Приток (анаплероз)","opts":["исходный","усилен"]}],"W":640,"H":380,"NW":340,"NH":640,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"несколько последовательных реакций","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":75,"c":"cyto","t":"цитозоль","lx":16,"ly":24,"n":[6,6,328,76,12,24]},{"x":6,"y":91,"w":628,"h":283,"c":"mito","t":"матрикс митохондрии","lx":626,"ly":364,"n":[6,94,328,540,330,632],"a":"end"}],"mem":[{"x1":6,"y1":86,"x2":634,"y2":86,"t":"внутренняя мембрана","lx":626,"ly":102,"n":[6,90,334,90,232,108],"tn":"внутр. мембрана","a":"end"}],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,214,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,214,68,40],"fs":14},"iso":{"p":[346,190,100,40],"t":"изоцитрат","n":[282,314,94,40],"fs":14},"akg":{"p":[472,190,60,40],"t":"α-КГ","n":[282,414,54,40],"fs":14},"scoa":{"p":[472,305,98,46],"t":"сукцинил-\nCoA","n":[282,514,94,48],"fs":14},"suc":{"p":[332,305,90,40],"t":"сукцинат","n":[58,514,84,40],"fs":14},"fum":{"p":[201,305,80,40],"t":"фумарат","n":[58,414,78,40],"fs":14},"mal":{"p":[70,305,66,40],"t":"малат","n":[58,314,62,40],"fs":14},"citc":{"p":[214,44,76,32],"t":"цитрат","n":[282,48,76,32],"fs":14},"acoc":{"p":[450,44,124,44],"t":"ацетил-CoA\nдля липидов","n":[112,50,124,44],"fs":13},"asp":{"p":[52,122,86,30],"t":"аспартат","n":[58,140,86,30],"fs":13},"pyr":{"p":[150,118,76,30],"t":"пируват","n":[166,140,76,30],"fs":13},"gln":{"p":[472,124,88,30],"t":"глутамин","n":[170,366,88,30],"fs":13},"glu":{"p":[578,190,86,30],"t":"глутамат","n":[170,438,86,30],"fs":13},"hem":{"p":[578,305,50,30],"t":"гем","n":[282,584,50,30],"fs":13}},"edges":{"cs":{"a":"oaa","b":"cit","k":"rx","d":[0,-13],"dn":[0,-14]},"aco":{"a":"cit","b":"iso","k":"rx","d":[0,-13],"dn":[-26,0]},"idh":{"a":"iso","b":"akg","k":"rx","d":[0,-44],"dn":[-56,0]},"kgdh":{"a":"akg","b":"scoa","k":"rx","d":[52,0],"dn":[-56,0]},"scs":{"a":"scoa","b":"suc","k":"rx","d":[0,32],"dn":[0,-26]},"sdh":{"a":"suc","b":"fum","k":"rx","d":[0,32],"dn":[52,0]},"fh":{"a":"fum","b":"mal","k":"rx","d":[0,30],"dn":[24,0]},"mdh":{"a":"mal","b":"oaa","k":"rx","d":[42,0],"dn":[34,0]},"xc":{"a":"cit","b":"citc","k":"tr","t":"переносчик\nцитрата","d":[62,0],"dn":[-46,0]},"acly":{"a":"citc","b":"acoc","k":"rx","t":"ATP-цитратлиаза","tn":"ACLY","d":[0,-12],"dn":[0,-14]},"xa":{"a":"oaa","b":"asp","k":"rx"},"xg":{"a":"akg","b":"glu","k":"rx"},"xh":{"a":"scoa","b":"hem","k":"rx"},"ip":{"a":"pyr","b":"oaa","k":"rx","t":"PC","d":[26,-4],"dn":[26,0]},"ig":{"a":"gln","b":"akg","k":"rx","t":"через\nглутамат","d":[44,0],"dn":[44,0],"dash":true}},"st":{"0-0":{"n":{"citc":"base","acoc":"base","pyr":"base","gln":"base"},"m":[["Отток цитрата","исходный"],["Приток","исходный"],["Количество промежуточных соединений","не изменяется"]],"note":"Отток и приток исходные и равны: количество промежуточных соединений в матриксе не изменяется, хотя цикл и ответвления работают."},"0-1":{"n":{"citc":"base","acoc":"base","pyr":"on","gln":"on"},"m":[["Отток цитрата","исходный"],["Приток","усилен"],["Количество промежуточных соединений","может расти"]],"note":"Приток превышает отток: количество промежуточных соединений может расти, пока не изменятся скорости других реакций."},"1-0":{"n":{"citc":"on","acoc":"on","pyr":"base","gln":"base"},"m":[["Отток цитрата","усилен"],["Приток","исходный"],["Количество промежуточных соединений","снижается"]],"note":"Отток цитрата усилен, приток не изменился: количество промежуточных соединений снижается, и реакции цикла могут ограничиваться их доступностью."},"1-1":{"n":{"citc":"on","acoc":"on","pyr":"on","gln":"on"},"m":[["Отток цитрата","усилен"],["Приток","усилен"],["Количество промежуточных соединений","сохраняется"]],"note":"Отток и приток усилены: количество промежуточных соединений сохраняется при больших потоках отведения и восполнения."}},"nfs":13}}},{"id":"pyruvate-carboxylase","number":10,"section":1,"title":"Как пируваткарбоксилаза восполняет оксалоацетат","question":2,"questions":[2],"keywords":["PC","пируваткарбоксилаза","оксалоацетат","биотин","бикарбонат","ATP","PDH","ацетил-CoA","анаплероз"],"lead":["[[T27|Пируваткарбоксилаза]] (PC) присоединяет CO₂ в форме бикарбоната к пирувату и образует оксалоацетат, то есть восполняет промежуточные соединения цикла.","Образование ацетил-CoA пируватдегидрогеназным комплексом (PDH) — другой вход пирувата в цикл, при котором оксалоацетат не восполняется."],"mechanism":["PC катализирует ATP-зависимое карбоксилирование пирувата до оксалоацетата; простетическая группа PC — ковалентно связанный биотин; в клетках человека реакция идёт в митохондриальном матриксе.","PDH окисляет пируват до ацетил-CoA с выделением CO₂ и образованием NADH; PC и PDH дают разные продукты и служат разными входами в цикл.","Ацетил-CoA — аллостерический активатор PC, но поступление ацетил-CoA в цикл само по себе чистого восполнения оксалоацетата не даёт."],"paragraphs":["Пируваткарбоксилаза катализирует реакцию: пируват + HCO₃⁻ + ATP → оксалоацетат + ADP + Pi. Реакция идёт в два этапа. Сначала ковалентно связанный с ферментом биотин (простетическая группа) карбоксилируется за счёт бикарбоната и ATP, затем карбоксильная группа переносится на пируват. Реакция не расходует NADH и не выделяет CO₂, а присоединяет его. В клетках человека PC находится в митохондриальном матриксе.","Пируват может войти в цикл двумя путями. PDH окисляет его до ацетил-CoA с выделением CO₂ и образованием NADH. Ацетильная группа присоединяется цитратсинтазой к уже имеющемуся оксалоацетату, поэтому общее количество промежуточных соединений не увеличивается. PC превращает пируват непосредственно в оксалоацетат, то есть в промежуточное соединение цикла, и количество четырёхуглеродных промежуточных соединений растёт. Таким образом, PC и PDH — разные входы пирувата в цикл.","Ацетил-CoA — аллостерический активатор PC: он связывается вне активного центра и повышает активность фермента, поэтому при высоком содержании ацетил-CoA в матриксе образование оксалоацетата из пирувата может усиливаться. Сам по себе ацетил-CoA оксалоацетат не восполняет: чистый приток даёт реакция, вводящая в цикл дополнительный углерод. Анаплеротический эффект проявляется, если образовавшийся оксалоацетат не потребляется целиком реакциями отведения (см. шаг про катаплероз).","PC — не единственный путь анаплероза, а её вклад различается между клетками. В клетках глиобластомы подавление глутаминазы вызывало компенсаторное усиление анаплероза с участием PC, а клетки (в том числе других линий) с высокой активностью PC не зависели от глутамина, но для роста им была необходима PC (Cheng и соавт., 2011). В клетках мыши с утратой SDH PC существенно поддерживает синтез аспартата (см. шаг про SDH)."],"trap":["Если ацетил-CoA поступает в цикл, оксалоацетат тем самым восполняется.","Ацетил-CoA присоединяется к уже имеющемуся оксалоацетату. Чистое восполнение даёт реакция, вводящая дополнительный углерод, например карбоксилирование пирувата, катализируемое PC."],"conditions":"Схема качественная: показаны вещества, коферменты и два входа пирувата в цикл; числа не заданы. Реакция PC и активация ацетил-CoA приведены по учебнику биохимии (Ленинджер, т. 2); различия вклада PC описаны на культивируемых клетках (Cheng и соавт., 2011 — прочитана аннотация; Cardaci и соавт., 2015).","sources":["LNR2","CHENG","CARDACI"],"quiz":{"id":"S8-L10","rev":2,"question":"Для восполнения оксалоацетата из пирувата усилена реакция PC. Какие вещества непосредственно необходимы для этой реакции?","options":[{"id":"S8-L10-1","text":"Пируват, бикарбонат (источник CO₂) и ATP как источник энергии.","correct":true,"feedback":"PC катализирует ATP-зависимое карбоксилирование пирувата; простетическая группа фермента — биотин."},{"id":"S8-L10-2","text":"Пируват, NAD⁺ и CoA с выделением CO₂ при образовании продукта.","correct":false,"feedback":"Так описывается окислительное декарбоксилирование пирувата комплексом PDH; PC присоединяет CO₂, а не выделяет его."},{"id":"S8-L10-3","text":"Пируват, ацетил-CoA и ATP: ацетил-CoA присоединяется к пирувату.","correct":false,"feedback":"Ацетил-CoA — аллостерический активатор PC, а не субстрат; к пирувату он не присоединяется."}]},"widget":{"kind":"net","title":"","s":{"title":"Два входа пирувата в цикл: PC и PDH","status":"Схема механизма · качественные состояния","ctrls":[{"id":"pc","type":"group","label":"Пируваткарбоксилаза","opts":["активна","отсутствует"]},{"id":"ac","type":"group","label":"Ацетил-CoA в матриксе (активатор PC)","opts":["низкое содержание","высокое содержание"]}],"W":640,"H":380,"NW":340,"NH":640,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества через мембрану","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","eq":"передача восстановительных эквивалентов (сам NADH мембрану не проходит)","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное или усиленное состояние","пунктир — неактивно или снижено","× — реакции или белка нет"]},"zones":[{"x":6,"y":6,"w":628,"h":368,"c":"mito","t":"митохондрия","lx":626,"ly":364,"n":[4,4,332,632,330,624],"a":"end"}],"mem":[],"nodes":{"oaa":{"p":[70,190,124,40],"t":"оксалоацетат","n":[58,190,78,48],"fs":14,"tn":"оксало-\nацетат"},"cit":{"p":[214,190,72,40],"t":"цитрат","n":[282,190,68,40],"fs":14},"iso":{"p":[346,190,100,40],"t":"изоцитрат","n":[282,290,94,40],"fs":14},"akg":{"p":[472,190,60,40],"t":"α-КГ","n":[282,390,54,40],"fs":14},"scoa":{"p":[472,305,98,46],"t":"сукцинил-\nCoA","n":[282,490,94,48],"fs":14},"suc":{"p":[332,305,90,40],"t":"сукцинат","n":[58,490,84,40],"fs":14},"fum":{"p":[201,305,80,40],"t":"фумарат","n":[58,390,78,40],"fs":14},"mal":{"p":[70,305,66,40],"t":"малат","n":[58,290,62,40],"fs":14},"pyr":{"p":[150,66,86,34],"t":"пируват","n":[58,66,86,34],"fs":14},"acoa":{"p":[330,66,108,34],"t":"ацетил-CoA","n":[282,66,108,34],"fs":14}},"edges":{"cs":{"a":"oaa","b":"cit","k":"rx","t":"CS","d":[0,-13],"dn":[0,-14]},"aco":{"a":"cit","b":"iso","k":"rx","d":[0,-13],"dn":[-26,0]},"idh":{"a":"iso","b":"akg","k":"rx","d":[0,-44],"dn":[-56,0]},"kgdh":{"a":"akg","b":"scoa","k":"rx","d":[52,0],"dn":[-56,0]},"scs":{"a":"scoa","b":"suc","k":"rx","d":[0,32],"dn":[0,-26]},"sdh":{"a":"suc","b":"fum","k":"rx","d":[0,32],"dn":[52,0]},"fh":{"a":"fum","b":"mal","k":"rx","d":[0,30],"dn":[24,0]},"mdh":{"a":"mal","b":"oaa","k":"rx","d":[42,0],"dn":[34,0]},"pc":{"a":"pyr","b":"oaa","k":"rx","t":"PC, биотин\nHCO₃⁻, ATP","d":[-62,0],"dn":[72,22]},"pdh":{"a":"pyr","b":"acoa","k":"rx","t":"PDH\nCO₂, NADH","d":[0,-27],"dn":[0,-27]},"cs2":{"a":"acoa","b":"cit","k":"rx"},"ac":{"a":"acoa","b":[130,108,62,100],"k":"act","t":"аллостерическая\nактивация","d":[0,22],"dn":[10,20]}},"st":{"0-0":{"n":{"acoa":"base","oaa":"base"},"e":{"pc":"on","ac":"off"},"m":[["Оксалоацетат из пирувата","образуется"],["Активация PC ацетил-CoA","слабая"],["Чистое восполнение","есть"]],"note":"PC активна: пируват превращается в оксалоацетат, и промежуточные соединения цикла пополняются. Активация PC ацетил-CoA слабая."},"0-1":{"n":{"acoa":"on","oaa":"on"},"e":{"pc":"on","ac":"on"},"m":[["Оксалоацетат из пирувата","может усиливаться"],["Активация PC ацетил-CoA","есть"],["Чистое восполнение","есть"]],"note":"Ацетил-CoA аллостерически активирует PC, поэтому образование оксалоацетата из пирувата может усиливаться."},"1-0":{"n":{"acoa":"base","oaa":"base"},"e":{"pc":"off","ac":"off"},"m":[["Оксалоацетат из пирувата","не образуется"],["Вход через PDH","идёт"],["Чистое восполнение через PC","нет"]],"note":"PC отсутствует: пируват входит в цикл только через PDH как ацетил-CoA. Оксалоацетат из пирувата не образуется."},"1-1":{"n":{"acoa":"on","oaa":"base"},"e":{"pc":"off","ac":"off"},"m":[["Оксалоацетат из пирувата","не образуется"],["Ацетил-CoA как вход","не восполняет"],["Чистое восполнение через PC","нет"]],"note":"Содержание ацетил-CoA высокое, но PC отсутствует, поэтому его активирующее действие не проявляется. Ацетил-CoA присоединяется к имеющемуся оксалоацетату и чистого восполнения не даёт."}},"nfs":13}}},{"id":"glutamine-anaplerosis","number":11,"section":1,"title":"Как углерод глутамина пополняет цикл","question":2,"questions":[2],"keywords":["глутамин","глутамат","GLS","глутаминаза","α-КГ","трансаминирование","GDH","анаплероз","пропионил-CoA"],"lead":["Углерод глутамина входит в цикл в несколько этапов: [[T30|глутаминаза]] (GLS) превращает глутамин в глутамат, а затем другая реакция превращает глутамат в α-КГ.","Вклад глутамина в анаплероз различается между клетками и не во всех клетках является главным."],"mechanism":["GLS гидролизует амидную группу глутамина с образованием глутамата и NH₄⁺; α-КГ в этой реакции не образуется.","Глутамат превращается в α-КГ трансаминированием, при котором аминогруппа переходит на кетокислоту, или окислительным дезаминированием глутаматдегидрогеназой (GDH) с выделением NH₄⁺.","α-КГ превращается по окислительному пути в сукцинил-CoA или по восстановительному в изоцитрат; вклад глутамина и PC различается между клеточными линиями."],"paragraphs":["Глутамин содержит пять атомов углерода и два атома азота, амидный и аминный. GLS гидролизует амидную группу: глутамин + H₂O → глутамат + NH₄⁺. Углеродный скелет при этом не меняется, и α-КГ не образуется, поэтому одной активности GLS недостаточно, чтобы углерод глутамина вошёл в цикл.","Превращение глутамата в α-КГ идёт двумя способами. При [[T31|трансаминировании]] аминотрансфераза переносит аминогруппу глутамата на кетокислоту-акцептор, например на оксалоацетат, и образуются α-КГ и аминокислота, в этом примере аспартат. Глутаматдегидрогеназа окисляет глутамат до α-КГ и отщепляет аммоний; NAD⁺ или NADP⁺ при этом восстанавливается до NADH или NADPH. В первом случае азот остаётся в составе аминокислоты, во втором выходит в виде NH₄⁺.","Далее α-КГ превращается в окислительном направлении через сукцинил-CoA и сукцинат или в восстановительном через изоцитрат и цитрат. Восстановительное направление — это реакция IDH1 или IDH2, обратная образованию NADPH: α-КГ + CO₂ + NADPH → изоцитрат (см. шаг про восстановительное карбоксилирование). Вклад глутамина различается. В одной линии клеток глиобластомы оксалоацетат для цикла образовывался из глутамина при низкой активности карбоксилирования пирувата (DeBerardinis и соавт., 2007), а при подавлении GLS возрастала роль PC (Cheng и соавт., 2011). О судьбе углерода глутамина при утрате SDH см. шаг про SDH.","Есть и другие входы. Пропионил-CoA, образующийся, например,
