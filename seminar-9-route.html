ей, не сдвигая его направленно; направленный сдвиг требует отбора, например отбора против тяжёлых вариантов в зародышевой линии.</li></ol><p>При оплодотворении митохондрии сперматозоида, как правило, не передаются потомству, и мтДНК человека наследуется от матери. Если у матери гетероплазмия, её ооциты получают из общего набора лишь часть молекул. При каждом делении клетки копии мтДНК распределяются между дочерними клетками случайно; кроме того, отдельные молекулы реплицируются независимо от клеточного цикла. Поэтому доля варианта в разных клетках и тканях одного человека может различаться.</p><p>В зародышевой линии этот эффект особенно силён. Многие исследования указывают на этап, на котором передаётся небольшое эффективное число молекул или единиц сегрегации, — генетическое бутылочное горлышко. Его механизм и биологический смысл обсуждаются (Xie 2026). Эффективный размер выборки — параметр, описывающий итоговый разброс; это не буквальное число молекул в каждом ооците.</p><p>Следствие видно в семьях: дети одной матери с гетероплазмией могут получить очень разную долю варианта (Russell 2020). Если отбора нет, средняя доля у потомков близка к материнской, а разброс тем больше, чем меньше эффективная выборка. Отбор — отдельный процесс: показано, что патогенные варианты часто передаются через женскую зародышевую линию хуже нейтральных (Xie 2026).</p><p>Отсюда прямой переход к клинике. Женщина с гетероплазмическим вариантом не может заранее знать, какую долю варианта получит ребёнок. Одна из возможностей — преимплантационное генетическое тестирование (ПГТ-мт): после экстракорпорального оплодотворения у эмбриона берут биопсию нескольких клеток, определяют в ней долю варианта и для переноса выбирают эмбрион с наименьшей долей. Метод подходит не при всех вариантах и не всем женщинам, а число эмбрионов с низкой долей варианта ограничено (Russell 2020). Насколько доля в биопсии отражает весь эмбрион и как она меняется до рождения, показывают собранные в <a href="https://fresll.github.io/pgt-mt-atlas/ru/">открытом «Атласе ПГТ-мт»</a> опубликованные данные о гетероплазмии мтДНК в эмбрионах — с источником каждого значения.</p><p>Бутылочное горлышко объясняет разброс долей варианта у потомков, но не определяет, при какой доле нарушается функция: это биохимический порог, рассмотренный выше.</p><div class="note trap"><strong>Типичная ошибка</strong> Бутылочное горлышко непосредственно создаёт один универсальный порог функции.<p class="trap-fix">Бутылочное горлышко меняет распределение долей варианта у потомков. Порог функции — другая зависимость: он определяется вариантом, тканью и показателем.</p></div><div class="static-quiz"><h3>В учебной модели исходная доля варианта мтДНК равна 50 %. Размер независимой случайной выборки молекул уменьшили; отбора нет. Как изменится распределение долей варианта у потомков при многократном повторении?</h3><ol><li><b>А.</b> Доля варианта обязательно вырастет одинаково у каждого потомка. <i>(неверный вариант)</i><br><span class="expl">Случайная выборка может увеличить или уменьшить долю; направленный сдвиг требует дополнительных факторов, например отбора.</span></li><li><b>Б.</b> Доли у всех потомков обязательно станут равны исходной доле. <i>(неверный вариант)</i><br><span class="expl">При конечной случайной выборке возникают отклонения от исходной доли; меньшая выборка обычно усиливает их.</span></li><li><b>В.</b> Разброс долей обычно увеличится при многократном повторении выборки. <i>(верный вариант)</i><br><span class="expl">Меньшая выборка усиливает случайные различия. Это утверждение о распределении, а не об обязательном направлении изменения в каждой клетке.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1038/s41576-026-01019-0">Xie Q., Walker H. E., Minczuk M., Chiaratti M. R., Chinnery P. F. Inheritance and selection of the mitochondrial genome. Nat Rev Genet. 2026.</a></li><li><a href="https://doi.org/10.1038/s41588-024-01794-8">Nitsch L., Lareau C. A., Ludwig L. S. Mitochondrial genetics through the lens of single-cell multi-omics. Nat Genet. 2024;56:1355–1365.</a></li><li><a href="https://fresll.github.io/pgt-mt-atlas/ru/">Атлас ПГТ-мт — открытая база опубликованных данных о гетероплазмии мтДНК в эмбрионах при преимплантационном генетическом тестировании (ПГТ-мт), с источником каждого значения. https://fresll.github.io/pgt-mt-atlas/ru/ (дата обращения: 23.10.2026).</a></li><li><a href="https://www.worldcat.org/search?q=%D0%90%D0%BB%D1%8C%D0%B1%D0%B5%D1%80%D1%82%D1%81%20%D0%91%20%20%D0%B8%20%D0%B4%D1%80">Альбертс Б. и др. Молекулярная биология клетки. Том 2.</a></li></ul><p>Учебная модель: доли у потомков получены независимыми случайными выборками заданного размера (биномиальное распределение) из набора с долей 50 %, без отбора; эффективные размеры 200 и 10 условны, это не подсчёт молекул в реальном ооците. Модель не предсказывает риск болезни конкретного ребёнка. Механизмы горлышка и отбор в зародышевой линии — Xie 2026; разброс у потомков и преимплантационная диагностика (выбор эмбриона с наименьшей долей варианта, ограничения метода) — Russell 2020; опубликованные значения гетероплазмии эмбрионов при ПГТ-мт с первоисточниками — «Атлас ПГТ-мт».</p></details></article><article class="card print-unit" id="ns-genetic-tests"><div class="eyebrow">Два генома и гетероплазмия · шаг 28 из 30</div><h2>Как разделяют ядерный и митохондриальный вклад в дефект</h2><p class="lead">Чтобы понять, вызван ли дефект ядерным геном или вариантом мтДНК, измеряют долю варианта, число копий мтДНК и проверяют, переносится ли дефект вместе с мтДНК в клетки с другим ядром — <a href="#ns-g-S9-T67">цибриды</a>. Средняя доля варианта в ткани и его распределение по отдельным клеткам — разные величины.</p><ol class="mech"><li>Долю варианта определяют секвенированием: из числа прочтений с вариантом и без него рассчитывают его долю в образце.</li><li>Число копий мтДНК на клетку оценивают количественной ПЦР: при двух копиях ядерной мишени на диплоидную клетку оно равно 2 × Qмт / Qядр; отдельные клетки анализируют после лазерной микродиссекции или одноклеточными методами.</li><li>Цибрид получают, перенося митохондрии донора в ρ⁰-клетки с другим ядром. Если состав и число копий мтДНК сопоставимы, сохранение дефекта поддерживает предположение о вкладе мтДНК донора; исчезновение дефекта совместимо с ядерной причиной, но само по себе её не доказывает.</li></ol><p>Долю варианта мтДНК в образце определяют секвенированием. При глубоком секвенировании каждая позиция прочитывается многократно, и доля прочтений с вариантом оценивает долю молекул с ним. Это средняя величина для всех клеток образца: ткань с 50 % варианта может состоять из клеток с разной долей — почти без варианта и почти целиком с вариантом.</p><p>Число копий мтДНК оценивают количественной ПЦР: сравнивают количество митохондриальной мишени Qмт с количеством ядерной мишени Qядр. Если ядерная мишень представлена двумя копиями на диплоидную клетку, число копий мтДНК на клетку равно 2 × Qмт / Qядр; при расчёте учитывают эффективность амплификации обеих мишеней. Для анализа отдельных клеток их вырезают из среза ткани лазерной микродиссекцией; современные одноклеточные методы позволяют одновременно определять варианты мтДНК и экспрессию генов в тысячах клеток (Nitsch 2024).</p><p>Цибриды позволяют исследовать вклад двух геномов. ρ⁰-клетки с выбранным ядром сливают с безъядерными фрагментами клеток донора, несущими его митохондрии (King 1989). В цибриде мтДНК донора работает на фоне ядра реципиента. Если состав и число копий мтДНК сопоставимы с исходными, сохранение дефекта поддерживает предположение о вкладе мтДНК. Исчезновение дефекта совместимо с ядерной причиной, но может зависеть и от взаимодействия мтДНК с новым ядерным фоном, поэтому по одному исходу переноса единственную причину не устанавливают.</p><p>В реальном эксперименте нужны проверки: ядерного происхождения цибрида, числа копий и состава мтДНК, условий культивирования. Цибриды разных клонов с одинаковой мтДНК тоже могут различаться.</p><div class="note trap"><strong>Типичная ошибка</strong> Цибрид переносит одновременно ядро пациента и мтДНК в неизменном виде.<p class="trap-fix">В цибрид переносят митохондрии и мтДНК донора, а ядро принадлежит реципиенту (ρ⁰-клетке). Если единственная причина дефекта — ядерный ген донора, нормальное ядро реципиента обеспечивает функцию, и дефект не воспроизводится; если причина — вариант мтДНК, дефект обычно воспроизводится. В реальном исследовании исход оценивают с контролем ядерного фона, состава и числа копий мтДНК.</p></div><div class="static-quiz"><h3>Единственная заданная причина дефекта комплекса I — мутация ядерного гена; мтДНК донора нормальна. Её перенесли в ρ⁰-клетки с нормальным ядром и получили цибриды с обычным числом копий мтДНК. Ожидается ли перенос исходного дефекта?</h3><ol><li><b>А.</b> Ожидается: донорские митохондрии сохраняют дефект независимо от ядра реципиента. <i>(неверный вариант)</i><br><span class="expl">При заданной ядерной причине функция зависит от нормального ядерного фона реципиента. Донорская мтДНК в условии нормальна.</span></li><li><b>Б.</b> Ожидается: использование ρ⁰-реципиента необратимо исключает сборку комплекса I. <i>(неверный вариант)</i><br><span class="expl">После восстановления мтДНК ρ⁰-происхождение реципиента само по себе не означает необратимой невозможности сборки комплекса. В задаче заданы нормальное ядро и обычное число копий.</span></li><li><b>В.</b> Не ожидается: мутантный ядерный ген в цибриды не переносится. <i>(верный вариант)</i><br><span class="expl">При заданной единственной причине нормальное ядро реципиента обеспечивает соответствующий ядерно кодируемый компонент. В реальном эксперименте нужны проверки ядерного фона, копийности и состава мтДНК.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-9.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1038/s41588-024-01794-8">Nitsch L., Lareau C. A., Ludwig L. S. Mitochondrial genetics through the lens of single-cell multi-omics. Nat Genet. 2024;56:1355–1365.</a></li><li><a href="https://doi.org/10.1126/science.2814477">King M. P., Attardi G. Human cells lacking mtDNA: repopulation with exogenous mitochondria by complementation. Science. 1989;246:500–503.</a></li></ul><p>Принципиальные схемы методов, не данные экспериментов. Мысленный эксперимент вопроса: единственная заданная причина — ядерный дефект, мтДНК донора нормальна, ядро реципиента нормальное; это не гарантия для реального неконтролируемого переноса. Получение ρ⁰-клеток и цибридов — King 1989; одноклеточные методы — Nitsch 2024; общая логика диагностики — Russell 2020.</p></details></article><article class="card print-unit" id="ns-measurement-map"><div class="eyebrow">Исследование · шаг 29 из 30</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Каждый вывод о митохондриях опирается на определённую измеряемую величину. Скорость потребления O₂, скорость синтеза ATP, Δψm, импорт белка, свободная [Ca²⁺], расстояние между мембранами, доля варианта и число копий мтДНК — разные величины, и каждую измеряют своим методом. Чтобы проверить причинное предположение, нужны согласованные измерения нескольких величин и контроль, исключающий другие объяснения.</p><ol class="mech"><li>Сначала формулируют предположение в виде цепочки: какое звено изменено и какие величины должны измениться вслед за ним.</li><li>Для каждой величины выбирают метод и контроль: например, олигомицин для ATP-связанного дыхания, FCCP для нулевого потенциала, цибрид для разделения ядерного и митохондриального вклада.</li><li>Одно измерение показывает изменение одной величины; причинную цепочку подтверждает согласованное изменение нескольких величин при вмешательстве в предполагаемое звено.</li></ol><p>Методы предыдущих шагов отвечают на разные вопросы. Респирометрия измеряет потребление O₂, но не синтез ATP. Зонд TMRM отражает потенциал, но не импорт белка. Адресованный индикатор показывает свободную [Ca²⁺] в одном компартменте, но не расстояние между мембранами. Секвенирование даёт среднюю долю варианта в образце, но не функцию отдельной клетки.</p><p>Поэтому исследование начинают с вопроса: какое звено предположительно изменено и какие величины должны измениться вслед за ним? Если предполагается разобщение, ожидают одновременно ускорения дыхания, снижения Δp и снижения синтеза ATP. Если снижен расход ATP — замедления дыхания при сохранном сопряжении. Наблюдая только одну величину, эти варианты не различить.</p><p>Каждое измерение требует контроля. Для дыхания — немитохондриальный остаток и ответ на олигомицин; для потенциала — FCCP как нулевой уровень; для импорта — защита от протеазы и детергент; для генетического вклада — цибрид с известным ядром. Число изменившихся показателей само по себе ничего не доказывает: важно, чтобы они изменялись согласованно с предполагаемой цепочкой и чтобы вмешательство в предполагаемое звено воспроизводило результат.</p><p>Схема шага сводит вопросы, величины, методы, контроли и границы вывода в одну таблицу; принципиальные схемы методов показаны в соответствующих шагах.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем больше разных маркеров изменилось, тем надёжнее доказана любая причинная цепочка.<p class="trap-fix">Доказательность зависит не от числа изменившихся показателей, а от того, согласуются ли они с предполагаемой цепочкой и подтверждает ли её вмешательство в предполагаемое звено с контролями.</p></div><div class="static-quiz"><h3>Нужно проверить предположение, что снижение синтеза ATP вызвано именно разобщением. Какое сопоставление наиболее содержательно?</h3><ol><li><b>А.</b> Совместная оценка дыхания, синтеза ATP и состояния градиента с контролями. <i>(верный вариант)</i><br><span class="expl">Разобщение связывает перенос электронов, Δp и использование энергии для ATP. Согласованная оценка этих величин проверяет предполагаемое звено, хотя причинный вывод всё равно зависит от вмешательства и контролей.</span></li><li><b>Б.</b> Только определение содержания ATP: его снижение само по себе доказывает разобщение. <i>(неверный вариант)</i><br><span class="expl">Содержание ATP может снижаться из-за изменения образования или расхода. Однократное измерение содержания ATP не устанавливает причину его снижения.</span></li><li><b>В.</b> Только оценка дыхания: его ускорение само по себе доказывает разобщение. <i>(неверный вариант)</i><br><span class="expl">Ускорение дыхания возможно при увеличении потребления ATP и других изменениях. Без оценки сопряжения и контролей оно не выделяет разобщение.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-9.html#q1">Вопрос 1 →</a> <a href="seminar-9.html#q2">Вопрос 2 →</a> <a href="seminar-9.html#q3">Вопрос 3 →</a> <a href="seminar-9.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/B978-0-12-801415-8.00016-3">Divakaruni A. S., Paradyse A., Ferrick D. A., Murphy A. N., Jastroch M. Analysis and interpretation of microplate-based oxygen consumption and pH data. Methods Enzymol. 2014;547:309–354. doi:10.1016/B978-0-12-801415-8.00016-3</a></li><li><a href="https://doi.org/10.1113/jphysiol.2012.228387">Gerencser A. A., Chinopoulos C., Birket M. J., Jastroch M., Vitelli C., Nicholls D. G., Brand M. D. Quantitative measurement of mitochondrial membrane potential in cultured cells: calcium-induced de- and hyperpolarization of neuronal mitochondria. J Physiol. 2012;590:2845–2871. doi:10.1113/jphysiol.2012.228387</a></li><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li><li><a href="https://doi.org/10.1038/s41588-024-01794-8">Nitsch L., Lareau C. A., Ludwig L. S. Mitochondrial genetics through the lens of single-cell multi-omics. Nat Genet. 2024;56:1355–1365.</a></li></ul><p>Сопоставление методов не является экспериментальным результатом. Связь величин и методов — Divakaruni 2014 (респирометрия), Gerencser 2012 (потенциал), Lim 2021 (Ca²⁺), Nitsch 2024 (генетический анализ отдельных клеток). Для численной оценки скорости синтеза ATP нужен самостоятельный измерительный или расчётный протокол.</p></details></article><article class="card print-unit" id="ns-integrated-case"><div class="eyebrow">Исследование · шаг 30 из 30</div><h2>Почему кальциевый сигнал не устраняет любой дефект дыхательного аппарата</h2><p class="lead">Объединим механизмы. Пусть мутация ядерного гена фактора сборки снизила предельную мощность дыхательной цепи, а субстраты и O₂ доступны. Может ли умеренный Ca²⁺-сигнал, ускоряющий дегидрогеназы, исправить дефект? Нет: Ca²⁺ регулирует образование NADH, а ограничение задано сборкой комплексов. Усиление подачи электронов не создаёт недостающих комплексов.</p><ol class="mech"><li>Ca²⁺ в матриксе активирует PDH, IDH3 и OGDH, и образование NADH ускоряется.</li><li>Перенос электронов ограничен числом собранных комплексов: дополнительный NADH может использоваться только в пределах остаточной мощности цепи.</li><li>Длительный сигнал добавляет к дефекту затраты потенциала на вход Ca²⁺ и риск перегрузки, а не устраняет дефект.</li></ol><p>В этой задаче соединены все четыре вопроса. Генетическое звено: мутация ядерного гена фактора сборки уменьшила число собранных комплексов, то есть предельную мощность цепи. Энергетическое звено: мощность цепи определяет, какую Δp и какой синтез ATP митохондрия может поддерживать при данной нагрузке. Транспорт: от Δψm зависят импорт белков и вход Ca²⁺. Сигнальное звено: Ca²⁺ ускоряет образование NADH.</p><p>Если мощность цепи полная, умеренный сигнал Ca²⁺ помогает синтезу ATP следовать за потребностью: NADH образуется быстрее, а цепь способна окислить его. При дефекте сборки скорость окисления дополнительного NADH ограничена остаточной мощностью цепи. В покое резерва может хватать, и дефект почти не заметен; при нагрузке Δp и синтез ATP снижаются, а Ca²⁺ этого не исправляет, потому что регулирует другое звено.</p><p>Длительный сигнал добавляет новые затраты: вход каждого иона Ca²⁺ использует электрическую составляющую градиента, а накопление Ca²⁺ в матриксе повышает вероятность перехода проницаемости. При ограниченной мощности цепи митохондрии хуже компенсируют эти затраты.</p><p>Схема качественная и не предсказывает ни выживания клеток, ни тяжести болезни: исход зависит от конкретного варианта, остаточной мощности, ткани и нагрузки.</p><div class="note trap"><strong>Типичная ошибка</strong> Любое увеличение Ca²⁺ восстанавливает ATP при любом генетическом дефекте.<p class="trap-fix">Ca²⁺ ускоряет образование NADH, но не восстанавливает сборку комплексов. При ограниченной мощности цепи дополнительный NADH используется только в пределах остаточного резерва, а длительный сигнал повышает риск перегрузки.</p></div><div class="static-quiz"><h3>Ядерный дефект сборки ограничил максимальную мощность дыхательного аппарата; субстраты и O₂ доступны. Умеренный Ca²⁺-сигнал активировал матричные ферменты. Устраняет ли это само по себе дефект сборки?</h3><ol><li><b>А.</b> Да: активация матричных ферментов сама по себе восстанавливает сборку комплексов. <i>(неверный вариант)</i><br><span class="expl">Изменение активности матричных ферментов не заменяет нарушенный этап сборки. В условии первичное ограничение задано именно сборкой.</span></li><li><b>Б.</b> Да: повышение образования NADH полностью компенсирует ограничение мощности цепи. <i>(неверный вариант)</i><br><span class="expl">Дополнительный NADH не устраняет заданный предел мощности дыхательного аппарата. Компенсация возможна лишь в пределах сохранных звеньев и резерва.</span></li><li><b>В.</b> Нет: усиление образования NADH само по себе не устраняет нарушение сборки комплексов. <i>(верный вариант)</i><br><span class="expl">Регуляция образования NADH и сборка комплексов — разные звенья. Ответ на Ca²⁺ может зависеть от остаточной функции, но из активации ферментов не следует устранение первичного дефекта.</span></li></ol></div><p class="practice-row">Этот шаг объединяет материал всех четырёх вопросов практикума. <a href="seminar-9.html#q1">Вопрос 1 →</a> <a href="seminar-9.html#q2">Вопрос 2 →</a> <a href="seminar-9.html#q3">Вопрос 3 →</a> <a href="seminar-9.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.bbabio.2009.01.005">Denton R. M. Regulation of mitochondrial dehydrogenases by calcium ions. Biochim Biophys Acta. 2009;1787:1309–1316. doi:10.1016/j.bbabio.2009.01.005</a></li><li><a href="https://doi.org/10.1016/j.cell.2020.02.051">Russell O. M., Gorman G. S., Lightowlers R. N., Turnbull D. M. Mitochondrial diseases: hope for the future. Cell. 2020;181:168–188. doi:10.1016/j.cell.2020.02.051</a></li><li><a href="https://doi.org/10.1016/j.ceca.2021.102453">Lim D., Dematteis G., Tapella L., Genazzani A. A., Calì T., Brini M., Verkhratsky A. Ca²⁺ handling at the mitochondria–ER contact sites in neurodegeneration. Cell Calcium. 2021;98:102453.</a></li></ul><p>Качественная учебная схема. В задаче ограничение задано сборкой дыхательного аппарата, а не недостатком субстратов; нет утверждения о любой мутации или любом Ca²⁺-ответе. Регуляция дегидрогеназ Ca²⁺ — Denton 2009; генетические дефекты сборки — Russell 2020; перегрузка Ca²⁺ — Lim 2021.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S9-T01"><dt>Хемиосмотическое сопряжение</dt><dd>Связь переноса электронов и синтеза ATP через электрохимический градиент ионов на мембране. В митохондриях это градиент H⁺: дыхательные комплексы создают его, а ATP-синтаза использует; сами комплексы I–IV ATP не образуют.</dd></div><div id="ns-g-S9-T02"><dt>Окислительное фосфорилирование</dt><dd>Синтез ATP из ADP и неорганического фосфата, сопряжённый с окислением субстратов в дыхательной цепи через протондвижущую силу. Отличается от субстратного фосфорилирования, при котором фосфатная группа переходит на ADP непосредственно в ферментативной реакции.</dd></div><div id="ns-g-S9-T03"><dt>Дыхательная цепь</dt><dd>Система переносчиков электронов внутренней мембраны митохондрий (комплексы I–IV, убихинон, цитохром c), передающая электроны от NADH и сукцината к O₂. ATP-синтаза в путь электронов не входит; её иногда называют комплексом V системы окислительного фосфорилирования.</dd></div><div id="ns-g-S9-T04"><dt>Матрикс митохондрии</dt><dd>Внутренний водный компартмент митохондрии, ограниченный внутренней мембраной. Здесь работают цикл трикарбоновых кислот, ферменты окисления жирных кислот, мтДНК и миторибосомы. Концентрации веществ в матриксе могут сильно отличаться от средних по клетке.</dd></div><div id="ns-g-S9-T05"><dt>Межмембранное пространство</dt><dd>Компартмент между наружной и внутренней мембранами митохондрии. Его состав по малым ионам близок к цитозольному, потому что наружная мембрана для них проницаема, но белки межмембранного пространства (например, цитохром c) в цитозоль в норме не выходят.</dd></div><div id="ns-g-S9-T06"><dt>Внутренняя мембрана митохондрии</dt><dd>Мембрана, отделяющая матрикс от межмембранного пространства; содержит дыхательные комплексы, ATP-синтазу и переносчики. Она плохо проницаема для H⁺ и большинства ионов, в отличие от наружной мембраны.</dd></div><div id="ns-g-S9-T07"><dt>Электрохимический градиент H⁺</dt><dd>Различие электрохимического потенциала H⁺ по разные стороны мембраны. Складывается из разности концентраций H⁺ (химическая составляющая, ΔpH) и разности электрических потенциалов (электрическая составляющая, Δψm).</dd></div><div id="ns-g-S9-T08"><dt>Протондвижущая сила, Δp</dt><dd>Электрохимическая движущая сила входа H⁺ в матрикс, выраженная в милливольтах. В этом семинаре Δp — положительная величина: при обычной полярности мембраны и более щелочном матриксе Δp = |Δψm| + (2,303RT/F)·ΔpH; при 37 °C множитель около 61,5 мВ на единицу pH. Сам Δψm (матрикс относительно межмембранного пространства) остаётся отрицательным: при Δψm = −139 мВ и ΔpH ≈ 0,57 величина Δp составляет около 174 мВ. Обе составляющие направляют H⁺ в матрикс.</dd></div><div id="ns-g-S9-T09"><dt>ΔpH</dt><dd>Разность pH матрикса и межмембранного пространства: ΔpH = pH матрикса − pH межмембранного пространства. Матрикс щелочнее, то есть концентрация H⁺ в нём ниже. Чтобы сложить ΔpH с мембранным потенциалом, его умножают на 2,303RT/F.</dd></div><div id="ns-g-S9-T10"><dt>Убихинон, коэнзим Q</dt><dd>Подвижный липофильный переносчик электронов и протонов во внутренней мембране. Принимает электроны от комплексов I и II (и других дегидрогеназ) и передаёт их комплексу III; восстановленная форма — убихинол (QH₂). Сам убихинон через мембрану H⁺ не перекачивает.</dd></div><div id="ns-g-S9-T11"><dt>Цитохром c</dt><dd>Небольшой гемсодержащий белок межмембранного пространства, переносящий электроны от комплекса III к комплексу IV. Через неповреждённую наружную мембрану он не проходит; его выход в цитозоль — признак пермеабилизации наружной мембраны.</dd></div><div id="ns-g-S9-T12"><dt>Комплекс II, сукцинатдегидрогеназа</dt><dd>Ферментный комплекс внутренней мембраны, окисляющий сукцинат в цикле трикарбоновых кислот и передающий электроны через связанный FAD и железосерные центры на убихинон. Комплекс II H⁺ через мембрану не переносит; все его субъединицы у человека кодирует ядро.</dd></div><div id="ns-g-S9-T13"><dt>ATP-синтаза, F₀F₁</dt><dd>Ферментный комплекс внутренней мембраны. Мембранная часть F₀ включает вращающееся c-кольцо и неподвижную субъединицу a с двумя водными полуканалами: один открыт в межмембранное пространство, другой — в матрикс. H⁺ переносится кольцом от одного полуканала к другому, а не проходит через общий сквозной канал. Каталитическая часть F₁ синтезирует ATP из ADP и Pi. При низкой протондвижущей силе и наличии ATP фермент может работать в обратном режиме — гидролизовать ATP и выводить H⁺ из матрикса.</dd></div><div id="ns-g-S9-T14"><dt>Роторный катализ</dt><dd>Сопряжение вращения части ферментного комплекса с изменениями состояний его каталитических центров. В ATP-синтазе поток H⁺ вращает c-кольцо и γ-субъединицу, а она поочерёдно меняет конформацию трёх β-субъединиц F₁. Для кольца c₈ млекопитающих шаг кольца (45°, один H⁺) меньше поворота γ на 120°, после которого состояния центров β сменяются.</dd></div><div id="ns-g-S9-T15"><dt>Дыхательный контроль</dt><dd>Зависимость скорости митохондриального дыхания от использования протондвижущей силы — прежде всего для фосфорилирования ADP. На изолированных митохондриях выражают отношением скоростей дыхания с добавленным ADP и после его исчерпания (состояние 3 / состояние 4) в определённом протоколе.</dd></div><div id="ns-g-S9-T16"><dt>Разобщение</dt><dd>Снижение сопряжения переноса электронов с синтезом ATP, когда H⁺ возвращается в матрикс в обход ATP-синтазы. Это не блок дыхательной цепи; при подобранной дозе разобщителя дыхание ускоряется, а при избытке может снижаться.</dd></div><div id="ns-g-S9-T17"><dt>Протонная утечка</dt><dd>Возврат H⁺ в матрикс через внутреннюю мембрану без участия ATP-синтазы. Это поток (скорость), а не количество H⁺; в клетках его оценивают по дыханию, сохраняющемуся после олигомицина.</dd></div><div id="ns-g-S9-T18"><dt>UCP1</dt><dd>Разобщающий белок 1 внутренней мембраны бурых адипоцитов. При активации термогенеза увеличивает протонную проводимость мембраны, и энергия окисления выделяется в виде теплоты. Это регулируемый белок, а не постоянный неспецифический разрыв мембраны.</dd></div><div id="ns-g-S9-T19"><dt>Олигомицин</dt><dd>Ингибитор мембранной части F₀ ATP-синтазы, прекращающий поток H⁺ через фермент. В митохондриях, синтезирующих ATP, вызывает небольшую гиперполяризацию и замедление дыхания; если синтаза работала в обратном режиме, вызывает деполяризацию.</dd></div><div id="ns-g-S9-T20"><dt>FCCP</dt><dd>Протонофор (карбонилцианид-п-трифторметоксифенилгидразон) — липофильная слабая кислота, переносящая H⁺ через мембраны и рассеивающая градиент. Дозу для дыхательного теста подбирают титрованием; FCCP действует на все мембраны клетки, а не только на митохондриальные.</dd></div><div id="ns-g-S9-T21"><dt>Скорость потребления O₂, OCR</dt><dd>Количество O₂, потребляемое образцом за единицу времени, с указанной нормировкой (на число клеток, белок, ДНК). Включает митохондриальное и немитохондриальное потребление; это не скорость синтеза ATP.</dd></div><div id="ns-g-S9-T22"><dt>Отношение P/O</dt><dd>Число молекул ATP, синтезированных на один атом восстановленного кислорода (половину молекулы O₂). Для субстратов NADH в изолированных митохондриях обычно приводят около 2,5, для сукцината — около 1,5; значение зависит от субстрата и условий.</dd></div><div id="ns-g-S9-T23"><dt>Мембранный потенциал, Δψm</dt><dd>Электрическая разность потенциалов на внутренней мембране митохондрии; здесь Δψm = ψ матрикса − ψ межмембранного пространства. В работающей митохондрии матрикс заряжен отрицательно, и Δψm — отрицательное число (в клетках порядка −120…−160 мВ).</dd></div><div id="ns-g-S9-T24"><dt>Модуль мембранного потенциала, |Δψm|</dt><dd>Абсолютная величина мембранного потенциала, всегда неотрицательная. Удобна для шкал: деполяризация — уменьшение |Δψm|, гиперполяризация — его увеличение.</dd></div><div id="ns-g-S9-T25"><dt>Деполяризация</dt><dd>Уменьшение модуля мембранного потенциала, например переход от −160 к −100 мВ. Деполяризация может быть частичной и не обязательно означает Δψm = 0.</dd></div><div id="ns-g-S9-T26"><dt>Гиперполяризация</dt><dd>Увеличение модуля отрицательного мембранного потенциала, например переход от −140 к −170 мВ. По одной гиперполяризации нельзя судить о синтезе ATP: она возникает, например, когда олигомицин прекращает использование градиента.</dd></div><div id="ns-g-S9-T27"><dt>ANT, ADP/ATP-переносчик</dt><dd>Переносчик внутренней мембраны (транслоказа адениновых нуклеотидов), обменивающий ADP и ATP один на один. В обычном режиме ATP⁴⁻ выходит из матрикса, ADP³⁻ входит; обмен электрогенен и использует Δψm. При иных условиях возможен обратный обмен.</dd></div><div id="ns-g-S9-T28"><dt>PiC, фосфатный переносчик</dt><dd>Переносчик неорганического фосфата во внутренней мембране. Переносит фосфат вместе с H⁺ (или в обмен на OH⁻) без переноса суммарного заряда, поэтому использует ΔpH, а не Δψm; в отличие от ANT он электронейтрален.</dd></div><div id="ns-g-S9-T29"><dt>Белок-предшественник</dt><dd>Форма белка до завершения транспорта и созревания. Для митохондриальных белков — полипептид, синтезированный в цитозоле, часто с отщепляемой сигнальной последовательностью, которая определяет его путь и конечный компартмент.</dd></div><div id="ns-g-S9-T30"><dt>N-концевая сигнальная последовательность</dt><dd>Участок на N-конце белка-предшественника, направляющий его по пути TOM–TIM23. Обычно образует амфипатическую спираль с несколькими положительно заряженными остатками и отщепляется в матриксе протеазой MPP. Не все митохондриальные белки имеют такой сигнал.</dd></div><div id="ns-g-S9-T31"><dt>TOM</dt><dd>Транслоказа наружной мембраны митохондрии — общий вход для большинства ядерно кодируемых митохондриальных белков. После TOM белки распределяются по разным путям в зависимости от своих сигналов.</dd></div><div id="ns-g-S9-T32"><dt>TIM23</dt><dd>Транслоказа внутренней мембраны, переносящая в матрикс белки с N-концевой сигнальной последовательностью и встраивающая часть белков во внутреннюю мембрану. Название дано по субъединице Tim23, но путь цепи, по данным на дрожжах, связан прежде всего с субъединицей Tim17.</dd></div><div id="ns-g-S9-T33"><dt>PAM и mtHsp70</dt><dd>Импортный мотор на матриксной стороне транслоказы TIM23. Его ATPаза — шаперон mtHsp70: циклы гидролиза ATP позволяют удерживать и протягивать цепь в матрикс. Tim44 связывает mtHsp70 с транслоказой, Pam18 стимулирует его ATPазную активность; сами они не ATPазы.</dd></div><div id="ns-g-S9-T34"><dt>TIM22</dt><dd>Транслоказа внутренней мембраны, встраивающая многопроходные белки-переносчики семейства SLC25 (например, ANT) с внутренними сигналами. Эти белки доставляют к TIM22 малые белки TIM межмембранного пространства.</dd></div><div id="ns-g-S9-T35"><dt>OXA1L</dt><dd>Инсертаза внутренней мембраны человека, встраивающая белки со стороны матрикса — прежде всего 13 белков, синтезируемых на миторибосомах (встраивание идёт одновременно с синтезом). Дрожжевой гомолог называется Oxa1.</dd></div><div id="ns-g-S9-T36"><dt>Клетки ρ⁰</dt><dd>Клетки, лишённые мтДНК. Митохондрии в них сохраняются, но дыхательная цепь и полноценная ATP-синтаза не собираются; пониженный мембранный потенциал поддерживается обменом ATP⁴⁻/ADP³⁻ через ANT и гидролизом ATP неполной ATP-синтазой. Используются как реципиенты при получении цибридов.</dd></div><div id="ns-g-S9-T37"><dt>PINK1</dt><dd>Киназа, которая в здоровой митохондрии импортируется через TOM и TIM23 и расщепляется. При деполяризации импорт нарушается, и PINK1 накапливается на наружной мембране, участвуя в контроле качества митохондрий (подробно — в семинаре 12). Накопление PINK1 не означает неизбежной гибели клетки.</dd></div><div id="ns-g-S9-T38"><dt>TMRM и TMRE</dt><dd>Липофильные катионные флуоресцентные зонды, распределяющиеся через плазматическую и внутреннюю мембраны в соответствии с их потенциалами. Интенсивность зависит также от режима (с гашением или без), массы митохондрий и потенциала плазматической мембраны; для милливольт нужна калибровка.</dd></div><div id="ns-g-S9-T39"><dt>Мембранный контакт ЭПР и митохондрии</dt><dd>Участок, где мембраны ЭПР и наружная мембрана митохондрии сближены на расстояние порядка 10–50 нм и связаны белками. Органеллы сохраняют свои мембраны: это не слияние и не сплошной канал из ЭПР в матрикс.</dd></div><div id="ns-g-S9-T40"><dt>MAM</dt><dd>Митохондрия-ассоциированные мембраны ЭПР — участки ЭПР, прилегающие к митохондриям; так же называют биохимическую фракцию, выделяемую при фракционировании. Фракция не тождественна каждому участку контакта в живой клетке.</dd></div><div id="ns-g-S9-T41"><dt>Локальная микрообласть Ca²⁺</dt><dd>Небольшая область повышенной свободной концентрации Ca²⁺ около открытого канала, из которого выходит Ca²⁺. Концентрация в ней может в десятки раз превышать среднюю по цитозолю и быстро убывает с расстоянием.</dd></div><div id="ns-g-S9-T42"><dt>IP₃R</dt><dd>Рецептор инозитол-1,4,5-трисфосфата — Ca²⁺-канал мембраны ЭПР, открывающийся при связывании IP₃. Высвобождает Ca²⁺ в цитозоль; прямого непрерывного канала от IP₃R к MCU нет.</dd></div><div id="ns-g-S9-T43"><dt>VDAC</dt><dd>Потенциалзависимые анионные каналы наружной мембраны митохондрии, через которые проходят метаболиты и малые ионы, в том числе Ca²⁺. Для перехода проницаемости VDAC не обязательны.</dd></div><div id="ns-g-S9-T44"><dt>MCU</dt><dd>Порообразующий белок митохондриального Ca²⁺-унипортера во внутренней мембране. Это высокоизбирательный Ca²⁺-канал: ион проходит по электрохимическому градиенту без гидролиза ATP. У млекопитающих для работы поры нужен EMRE, а регулируют её MICU1 и MICU2.</dd></div><div id="ns-g-S9-T45"><dt>MICU1 и MICU2</dt><dd>Ca²⁺-связывающие регуляторные белки унипортера со стороны межмембранного пространства. Их димер ограничивает проводимость MCU при низкой [Ca²⁺] и снимает ограничение, связав Ca²⁺. Сами они каналов не образуют и не являются копиями одного белка.</dd></div><div id="ns-g-S9-T46"><dt>NCLX</dt><dd>Белок внутренней мембраны (ген SLC8B1), которому с 2010 г. приписывают митохондриальный Na⁺/Ca²⁺-обмен — основной Na⁺-зависимый путь выхода Ca²⁺ из матрикса: Ca²⁺ выходит, Na⁺ входит. По данным 2025–2026 гг. Na⁺-зависимый выход сохраняется в части линий клеток без NCLX, для самого NCLX предложен обмен Ca²⁺ на H⁺ (по другим данным — на Na⁺, K⁺ или Li⁺), а Na⁺/Ca²⁺-обмен связывают также с белком TMEM65; вопрос обсуждается. В моделях семинара «NCLX» означает Na⁺-зависимый выход Ca²⁺ в классической интерпретации.</dd></div><div id="ns-g-S9-T47"><dt>SERCA</dt><dd>Ca²⁺-ATPаза мембраны ЭПР (у мышечных клеток — саркоплазматического ретикулума), использующая энергию гидролиза ATP для переноса Ca²⁺ из цитозоля в просвет. В отличие от канала MCU, это насос.</dd></div><div id="ns-g-S9-T48"><dt>PDP1</dt><dd>Ca²⁺-чувствительная изоформа фосфатазы пируватдегидрогеназного комплекса. Снимает ингибирующее фосфорилирование субъединицы E1 и тем повышает активность комплекса. Вторая изоформа, PDP2, к Ca²⁺ нечувствительна.</dd></div><div id="ns-g-S9-T49"><dt>Свободная и общая концентрации Ca²⁺</dt><dd>Свободная [Ca²⁺] — концентрация несвязанных ионов в данном компартменте; её регистрируют Ca²⁺-индикаторы. Общее количество Ca²⁺ включает и Ca²⁺, связанный буферами, в матриксе прежде всего фосфатом. Количество и концентрация — величины разной размерности. Разделив общее количество на объём матрикса, получают общую концентрацию; её можно численно сравнивать со свободной, и она может быть во много раз больше.</dd></div><div id="ns-g-S9-T50"><dt>Кальциевая перегрузка</dt><dd>Накопление Ca²⁺ в матриксе, сопровождающееся нарушением функции митохондрии. Общее количество Ca²⁺ растёт, когда вход превышает выход; связывание буферами перераспределяет Ca²⁺ внутри матрикса и ограничивает рост свободной концентрации, но не выводит его. Универсального численного порога для всех клеток нет.</dd></div><div id="ns-g-S9-T51"><dt>Митохондриальный переход проницаемости, mPT</dt><dd>Резкое увеличение проницаемости внутренней мембраны для растворённых веществ массой примерно до 1,5 кДа; вызывается накоплением Ca²⁺, особенно вместе с фосфатом и окислительным стрессом, облегчается циклофилином D. Пору, обеспечивающую переход, называют mPTP; её молекулярный состав обсуждается.</dd></div><div id="ns-g-S9-T52"><dt>MOMP</dt><dd>Пермеабилизация наружной мембраны митохондрии, при внутреннем пути апоптоза — белками BAX и BAK. Через неё в цитозоль выходят белки межмембранного пространства, в том числе цитохром c. Не тождественна переходу проницаемости внутренней мембраны.</dd></div><div id="ns-g-S9-T53"><dt>Двойной генетический контроль</dt><dd>Зависимость сборки и работы митохондриального аппарата от продуктов ядерного и митохондриального геномов. Каждая субъединица кодируется одним из двух геномов, а комплексы I, III, IV и V содержат субъединицы обоих происхождений.</dd></div><div id="ns-g-S9-T54"><dt>Митохондриальная ДНК, мтДНК</dt><dd>Собственный геном митохондрий; у человека — кольцевая молекула около 16,6 тыс. пар нуклеотидов, кодирующая 13 белков, 22 тРНК и 2 рРНК. Число генов и организация генома у разных организмов различаются.</dd></div><div id="ns-g-S9-T55"><dt>Нуклеоид</dt><dd>Комплекс мтДНК с белками, прежде всего TFAM, участвующими в её упаковке, репликации и транскрипции. Число нуклеоидов, число молекул мтДНК и число митохондрий — разные величины.</dd></div><div id="ns-g-S9-T56"><dt>TFAM</dt><dd>Ядерно кодируемый белок, который импортируется в матрикс, упаковывает мтДНК в нуклеоиды и участвует в её транскрипции и поддержании. TFAM не регулирует транскрипцию ядерных генов.</dd></div><div id="ns-g-S9-T57"><dt>POLG, POLG2 и TWNK</dt><dd>Ядерные гены белков, реплицирующих мтДНК: POLG — каталитической субъединицы ДНК-полимеразы γ, POLG2 — её вспомогательной субъединицы, TWNK — хеликазы (белок Twinkle). Их дефекты могут вызывать истощение мтДНК или её множественные делеции.</dd></div><div id="ns-g-S9-T58"><dt>PGC-1α</dt><dd>Коактиватор транскрипции, усиливающий действие ядерных факторов (в том числе NRF1 и NRF-2) на гены митохондриальных белков и участвующий в регуляции митохондриального биогенеза. Сам с ДНК специфически не связывается.</dd></div><div id="ns-g-S9-T59"><dt>NRF-2/GABP и NRF2/NFE2L2</dt><dd>Разные транскрипционные регуляторы со сходными названиями. NRF-2 (GABP) — ядерный дыхательный фактор, активирующий гены митохондриальных белков. NRF2 (NFE2L2) — фактор ответа на окислительный и электрофильный стресс, регулирующий антиоксидантные гены (подробнее — в семинаре 10).</dd></div><div id="ns-g-S9-T60"><dt>Гетероплазмия</dt><dd>Сосуществование в клетке или образце более одного варианта последовательности мтДНК. Нужно указывать, идёт ли речь о клетке или о ткани и долю какого варианта определяют; не всякий вариант патогенен.</dd></div><div id="ns-g-S9-T61"><dt>Гомоплазмия</dt><dd>Состояние, при котором все анализируемые молекулы мтДНК несут один вариант в рассматриваемой позиции (с учётом чувствительности анализа). Гомоплазмия не означает автоматически нормальной функции.</dd></div><div id="ns-g-S9-T62"><dt>Доля варианта мтДНК</dt><dd>Отношение числа молекул мтДНК с выбранным вариантом к общему числу проанализированных молекул. Это не доля клеток с дефектом, не доля митохондрий и не число копий на клетку.</dd></div><div id="ns-g-S9-T63"><dt>Число копий мтДНК</dt><dd>Число молекул мтДНК в клетке или в образце в расчёте на выбранную единицу, например на диплоидный ядерный геном. Оценивается, в частности, количественной ПЦР: при двух копиях ядерной мишени на диплоидную клетку число копий мтДНК на клетку равно 2 × Qмт / Qядр, где Qмт и Qядр — количества митохондриальной и ядерной мишеней.</dd></div><div id="ns-g-S9-T64"><dt>Порог гетероплазмии</dt><dd>Доля определённого варианта мтДНК, при которой в выбранной системе проявляется заданное функциональное нарушение. Зависит от варианта, ткани, показателя, критерия и числа копий; это не общий клинический норматив.</dd></div><div id="ns-g-S9-T65"><dt>Митотическая сегрегация</dt><dd>Изменение распределения вариантов мтДНК между дочерними клетками в ряду делений, обусловленное случайным распределением копий и независимой репликацией молекул. Направленный отбор — отдельный процесс.</dd></div><div id="ns-g-S9-T66"><dt>Генетическое бутылочное горлышко</dt><dd>Этап передачи мтДНК в зародышевой линии, на котором передаётся небольшое эффективное число единиц; из-за этого доли варианта у потомков одной матери сильно различаются. Эффективный размер — параметр разброса, а не подсчёт молекул; с биохимическим порогом не связан.</dd></div><div id="ns-g-S9-T67"><dt>Цибрид</dt><dd>Клетка, сочетающая ядро реципиента (обычно ρ⁰-клетки) с митохондриями и мтДНК донора. Позволяет проверить, переносится ли дефект вместе с мтДНК; требует контроля ядерного происхождения, числа копий и состава мтДНК.</dd></div><div id="ns-g-S9-T68"><dt>Митохондриальный биогенез</dt><dd>Совокупность процессов синтеза, импорта и сборки компонентов митохондрий и поддержания их генетического аппарата. Не измеряется одним числом митохондрий или одним маркером.</dd></div><div id="ns-g-S9-T69"><dt>Антероградная и ретроградная сигнализация</dt><dd>Антероградная сигнализация — регуляция митохондрий ядром (через экспрессию ядерных генов митохондриальных белков); ретроградная — изменение экспрессии ядерных генов в ответ на состояние митохондрий. Стрелка такой связи означает передачу сигнала, а не перенос генома.</dd></div><div id="ns-g-S9-T70"><dt>mitoKATP и mitoBK</dt><dd>K⁺-каналы внутренней мембраны митохондрий. mitoKATP подавляется ATP; его образуют порообразующая субъединица MITOK и ATP-связывающая субъединица MITOSUR. mitoBK — Ca²⁺-активируемый K⁺-канал большой проводимости, продукт гена KCNMA1 с вставкой, направляющей белок в митохондрии. Вход K⁺ по потенциалу вносит положительный заряд и вместе с водой увеличивает объём матрикса; значение этих каналов в разных тканях продолжают исследовать.</dd></div><div id="ns-g-S9-T71"><dt>Рианодиновые рецепторы (RyR)</dt><dd>Ca²⁺-каналы мембраны ЭПР и саркоплазматического ретикулума, высвобождающие Ca²⁺ в цитозоль; особенно много их в мышечных клетках. В сердце небольшая часть саркоплазматического ретикулума с RyR2 связана с митохондриями и передаёт им Ca²⁺ локально.</dd></div><div id="ns-g-S9-T72"><dt>SIGMAR1 (сигма-1-рецептор)</dt><dd>Шаперон мембраны ЭПР, сосредоточенный в MAM. При снижении [Ca²⁺] в ЭПР он отделяется от шаперона BiP и стабилизирует IP₃R3, продлевая поступление Ca²⁺ в митохондрии. Данные получены на клетках CHO; несмотря на название, это не классический рецептор плазматической мембраны, а шаперон ЭПР, регулируемый лигандами.</dd></div><div id="ns-g-S9-T73"><dt>Miro и Milton</dt><dd>Miro — белок наружной мембраны митохондрий с Ca²⁺-связывающими участками (EF-руками); через адаптерный белок Milton (у человека TRAK1 и TRAK2) он связывает митохондрию с кинезином, перемещающим её по микротрубочкам. Связывание Ca²⁺ с Miro останавливает движение митохондрий (нейроны гиппокампа крысы).</dd></div><div id="ns-g-S9-T74"><dt>RNase P митохондрий</dt><dd>Эндонуклеаза, отрезающая 5′-конец тРНК от полицистронного предшественника. У человека митохондриальная RNase P — белковый комплекс из трёх субъединиц (MRPP1–3), каталитической РНК в нём нет. RNase P бактерий и ядра — рибонуклеопротеины с каталитической РНК.</dd></div><div id="ns-g-S9-T75"><dt>MTERF1</dt><dd>Белок, связывающийся с мтДНК сразу за генами рРНК. По данным на мышах, он останавливает транскрипцию противоположной цепи мтДНК, чтобы она не мешала началу транскрипции с промотора лёгкой цепи, и не регулирует транскрипцию генов рРНК. Прежнее представление о MTERF1 как регуляторе соотношения рРНК и мРНК эксперименты на мышах не подтвердили.</dd></div><div id="ns-g-S9-T76"><dt>Протеазы митохондрий</dt><dd>Ферменты, удаляющие несобранные и повреждённые белки и расщепляющие регуляторные белки: LONP1 — в матриксе; AAA-протеазы внутренней мембраны — YME1L1 (активный центр в межмембранном пространстве) и m-AAA-протеаза (активный центр в матриксе); OMA1 — протеаза внутренней мембраны, активируемая при стрессе. OMA1 при потере мембранного потенциала расщепляет белок слияния OPA1.</dd></div></dl></section></noscript>

ы в справке каждой сцены.","pr_open_q":"Вопрос {n}","pr_open":"Открыть практикум","pr_back":"Вернуться к объяснениям","practice_row":"Эта тема относится к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Этот шаг объединяет материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий","lv2":"средний","lv3":"высокий","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Митохондрии как энергетический, сигнальный и генетический узел","stats":[["4 механизма","от градиента H⁺ к двум геномам"],["Объяснения","с вопросами для самопроверки"],["41 сценарий","в отдельном практикуме"]],"num_fmt":"9.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел II: семинары","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре вопроса для связного ответа","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с тем, что должно быть в ответе.","oq_crit":"Что должно быть в ответе","zoom_in":"Увеличить схему","zoom_out":"Уменьшить схему","zoom_area":"Увеличенная схема: прокрутите в сторону, чтобы увидеть её целиком"},"lessons":[{"id":"chemiosmosis","number":1,"section":0,"title":"Как перенос электронов связан с синтезом ATP","question":1,"questions":[1],"keywords":["хемиосмос","хемиосмотическая гипотеза","Митчелл","протондвижущая сила","Δp","ΔpH","электрохимический градиент","окислительное фосфорилирование","бактериородопсин","тилакоид"],"lead":["[[T02|Окислительное фосфорилирование]] объединяет два процесса, которые идут в разных белковых комплексах: перенос электронов к O₂ и синтез ATP.","Их связывает не общее химическое соединение, а [[T07|электрохимический градиент H⁺]] на [[T06|внутренней мембране митохондрии]]."],"mechanism":["Комплексы [[T03|дыхательной цепи]] переносят электроны от NADH к O₂ и при этом переносят H⁺ из матрикса в межмембранное пространство.","Внутренняя мембрана плохо проницаема для H⁺, поэтому возникают разность электрических потенциалов и разность концентраций H⁺ — две составляющие протондвижущей силы Δp.","H⁺ возвращается в матрикс через ATP-синтазу, и энергия этого движения используется для синтеза ATP из ADP и неорганического фосфата."],"paragraphs":["Митохондрия ограничена двумя мембранами. Наружная мембрана проницаема для небольших ионов, а внутренняя мембрана для H⁺ проницаема плохо. Она отделяет [[T04|матрикс]] — внутренний водный компартмент — от [[T05|межмембранного пространства]]. В этой мембране находятся дыхательные комплексы и ATP-синтаза.","Когда электроны NADH передаются по дыхательной цепи к O₂, комплексы I, III и IV переносят H⁺ из матрикса в межмембранное пространство. Снаружи от внутренней мембраны накапливается положительный заряд, а концентрация H⁺ в матриксе становится ниже, чем в межмембранном пространстве. Электрическая составляющая (мембранный потенциал) и химическая составляющая ([[T09|ΔpH]]) вместе образуют [[T08|протондвижущую силу Δp]]. При обычном состоянии митохондрии обе составляющие направлены одинаково: матрикс заряжен отрицательно и имеет более высокий pH, поэтому H⁺ стремится войти в матрикс.","Основным путём входа служит ATP-синтаза: поток H⁺ через её мембранную часть сопряжён с синтезом ATP из ADP и неорганического фосфата (Pi). Такую связь двух процессов через градиент ионов называют [[T01|хемиосмотическим сопряжением]]; эту гипотезу предложил П. Митчелл в 1961 г. Электроны при этом не переносятся на ADP: фосфатную группу ATP образует Pi, а энергию для реакции поставляет градиент H⁺.","Хемиосмотический принцип не ограничен митохондриями. В эксперименте Э. Рэкера и В. Штокениуса (1974) в искусственные фосфолипидные пузырьки встроили светозависимый протонный насос бактериородопсин и ATP-синтазу митохондрий сердца быка; на свету пузырьки накапливали H⁺ и синтезировали ATP без дыхательной цепи. В эксперименте А. Ягендорфа и Э. Урибе (1966) тилакоиды хлоропластов шпината выдерживали при pH 4, затем переносили в среду с pH 8, ADP и Pi, и в темноте образовывался ATP. Эти эксперименты показывают, что градиента H⁺ достаточно для синтеза ATP, но это искусственные системы, а не митохондрии человека."],"trap":["Синтез ATP требует непосредственного переноса электрона на ADP.","Электроны дыхательной цепи восстанавливают O₂ и на ADP не переносятся. Перенос электронов создаёт градиент H⁺, а ATP-синтаза использует его энергию для присоединения Pi к ADP."],"conditions":"Схема механизма; знаки и составляющие показаны качественно, без численных значений. Δψm определён как потенциал матрикса относительно межмембранного пространства: в рассматриваемом состоянии матрикс отрицателен и имеет более высокий pH. Эксперимент Racker 1974 — фосфолипидные пузырьки с бактериородопсином Halobacterium halobium и олигомицинчувствительной ATPазой митохондрий сердца быка; эксперимент Jagendorf 1966 — изолированные тилакоиды хлоропластов шпината, кислотно-основной переход в темноте. Оба эксперимента не относятся к митохондриям человека.","sources":["Mitchell1961","Racker1974","Jagendorf1966","B_ALB2","B_LNR2"],"quiz":{"id":"S9-L01","rev":1,"question":"Матрикс отрицателен относительно межмембранного пространства, а pH в матриксе выше. Какие составляющие протондвижущей силы способствуют поступлению H⁺ в матрикс?","options":[{"text":"Электрическая составляющая способствует входу, а химическая — выходу H⁺.","correct":false,"feedback":"При более высоком pH концентрация H⁺ в матриксе ниже. Поэтому химическая составляющая также способствует входу H⁺.","id":"S9-L01-2"},{"text":"Электрическая и химическая составляющие действуют в одном направлении.","correct":true,"feedback":"Положительно заряженный H⁺ переносится к отрицательной стороне мембраны и из области большей концентрации H⁺ в область меньшей. При заданных условиях оба вклада направлены в матрикс.","id":"S9-L01-1"},{"text":"Химическая составляющая способствует входу, а электрическая — выходу H⁺.","correct":false,"feedback":"Отрицательный потенциал матрикса способствует поступлению положительно заряженных протонов. Электрический вклад здесь направлен внутрь.","id":"S9-L01-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Перенос электронов и синтез ATP связаны градиентом H⁺","status":"Схема механизма · качественные состояния","ctrls":[{"id":"c","type":"group","label":"Что показать","opts":["Электрическая составляющая","Химическая составляющая","Обе составляющие","Эксперимент с бактериородопсином","Кислотно-основной переход"]}],"W":560,"H":360,"NW":560,"NH":360,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28,"only":["0","1","2"]},{"x":6,"y":168,"w":548,"h":186,"c":"mito","t":"матрикс","lx":14,"ly":344,"only":["0","1","2"]},{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"внутри пузырька: H⁺ накапливается","lx":14,"ly":28,"only":["3"]},{"x":6,"y":168,"w":548,"h":186,"c":"cyto","t":"наружная среда: ADP + Pi","lx":14,"ly":344,"only":["3"]},{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"просвет тилакоида после выдерживания при pH 4","lx":14,"ly":28,"only":["4"]},{"x":6,"y":168,"w":548,"h":186,"c":"cyto","t":"наружная среда pH 8: ADP + Pi, в темноте","lx":14,"ly":344,"only":["4"]}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"chain":{"p":[150,150,150,58],"t":"дыхательная\nцепь","n":[150,150,150,58]},"syn":{"p":[410,150,140,46],"t":"ATP-синтаза","n":[410,150,140,46]},"nadh":{"p":[70,250,80,36],"t":"NADH","n":[70,250,80,36]},"o2":{"p":[225,250,110,36],"t":"O₂ → H₂O","n":[225,250,110,36]},"adp":{"p":[345,278,100,36],"t":"ADP + Pi","n":[345,278,100,36]},"atp":{"p":[490,278,64,36],"t":"ATP","n":[490,278,64,36]}},"edges":{"e1":{"a":"nadh","b":"chain","k":"eq","t":"e⁻","d":[-18,0]},"e2":{"a":"chain","b":"o2","k":"eq","t":"e⁻","d":[18,0]},"hout":{"a":[236,214],"b":[236,58],"k":"tr","t":"H⁺","d":[14,-46],"anc":"start"},"hin":{"a":[500,58],"b":[500,214],"k":"tr","t":"H⁺","d":[14,-46],"anc":"start"},"syn_atp":{"a":"adp","b":"atp","k":"rx"}},"st":{"0":{"n":{"chain":"on","syn":"on"},"m":[["Электрическая составляющая","матрикс заряжен отрицательно"],["Направление для H⁺","в матрикс"]],"note":"Комплексы дыхательной цепи переносят положительно заряженные H⁺ из матрикса. Снаружи от внутренней мембраны остаётся избыток положительных зарядов, матрикс заряжен отрицательно. Электрическая составляющая направляет H⁺ в матрикс."},"1":{"n":{"chain":"on","syn":"on"},"m":[["Химическая составляющая","pH матрикса выше"],["Направление для H⁺","в матрикс"]],"note":"Концентрация H⁺ в межмембранном пространстве выше, чем в матриксе. По градиенту концентрации H⁺ тоже стремится войти в матрикс."},"2":{"n":{"chain":"on","syn":"on","atp":"on"},"m":[["Δp","электрическая + химическая составляющие"],["Обе составляющие","направлены в матрикс"]],"note":"Обе составляющие направлены одинаково и вместе образуют протондвижущую силу Δp. Её энергия используется ATP-синтазой: H⁺ возвращается в матрикс, из ADP и Pi образуется ATP."},"3":{"n":{"chain":"on","syn":"on","atp":"on","nadh":"hide","o2":"hide"},"e":{"e1":"hide","e2":"hide"},"t":{"chain":"бактерио-\nродопсин","syn":"ATP-синтаза\nмитохондрий"},"m":[["Источник градиента","свет и бактериородопсин"],["Дыхательная цепь","отсутствует"]],"note":"Эксперимент Рэкера и Штокениуса (1974): на свету бактериородопсин переносит H⁺ внутрь пузырька, а ATP-синтаза, встроенная в ту же мембрану, использует этот градиент для синтеза ATP. Дыхательной цепи в системе нет."},"4":{"n":{"chain":"hide","syn":"on","atp":"on","nadh":"hide","o2":"hide"},"e":{"e1":"hide","e2":"hide","hout":"hide"},"t":{"syn":"ATP-синтаза\nхлоропласта"},"m":[["Источник градиента","смена pH среды"],["Перенос электронов","отсутствует (темнота)"]],"note":"Эксперимент Ягендорфа и Урибе (1966): после выдерживания при pH 4 просвет тилакоидов содержит много H⁺. В среде с pH 8 H⁺ выходит из просвета через ATP-синтазу, и в темноте образуется ATP."}},"notes_svg":[{"t":"+  +  +  +  +","x":368,"y":78,"a":"middle","only":["0","2"]},{"t":"−  −  −  −  −","x":368,"y":218,"a":"middle","only":["0","2"]},{"t":"[H⁺] выше, pH ниже","x":368,"y":108,"a":"middle","only":["1","2"],"c":"#7a3d00","b":true},{"t":"[H⁺] ниже, pH выше","x":368,"y":330,"a":"middle","only":["1","2"],"c":"#7a3d00","b":true},{"t":"свет","x":150,"y":60,"a":"middle","only":["3"],"b":true}],"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"electron-flow","number":2,"section":0,"title":"Как комплексы дыхательной цепи создают градиент H⁺","question":1,"questions":[1],"keywords":["комплекс I","комплекс II","сукцинатдегидрогеназа","убихинон","коэнзим Q","комплекс III","цитохром c","комплекс IV","цитохромоксидаза","перенос H⁺","P/O"],"lead":["Электроны поступают в дыхательную цепь двумя путями: от NADH через комплекс I и от сукцината через комплекс II. Оба пути сходятся на убихиноне.","H⁺ через мембрану переносят комплексы I, III и IV; комплекс II H⁺ не переносит, но его электроны проходят через III и IV."],"mechanism":["Комплекс I окисляет NADH матрикса, а комплекс II окисляет сукцинат; оба комплекса восстанавливают [[T10|убихинон (Q)]] во внутренней мембране.","Восстановленный убихинон передаёт электроны комплексу III, затем [[T11|цитохром c]] переносит их к комплексу IV, который восстанавливает O₂ до воды.","По принятой учебной схеме на пару электронов комплексы I, III и IV выводят в межмембранное пространство 4, 4 и 2 H⁺: 10 H⁺ от NADH и 6 H⁺ от сукцината."],"paragraphs":["Дыхательная цепь — это не один ряд переносчиков, а сеть, в которую электроны входят в разных местах. NADH, образованный дегидрогеназами матрикса, окисляется комплексом I. Сукцинат окисляется [[T12|комплексом II (сукцинатдегидрогеназой)]]: электроны переходят на прочно связанный с ферментом FAD, затем через железосерные центры — на убихинон. Оба пути сходятся на пуле убихинона во внутренней мембране.","Восстановленный убихинон окисляется комплексом III, который передаёт электроны небольшому гемсодержащему белку цитохрому c. Цитохром c находится со стороны межмембранного пространства и переносит электроны к комплексу IV. Комплекс IV восстанавливает O₂ до воды; для этого он использует H⁺ матрикса. Поэтому матрикс теряет H⁺ двумя способами: при переносе H⁺ через мембрану и при образовании воды.","Комплексы I, III и IV сопрягают перенос электронов с перемещением H⁺ из матрикса в межмембранное пространство. Комплекс II такой функции не имеет. Это не значит, что окисление сукцината бесполезно для синтеза ATP: его электроны проходят через комплексы III и IV, и эти комплексы создают протондвижущую силу. Различается только число перенесённых H⁺: по принятой схеме 10 на пару электронов NADH и 6 на пару электронов сукцината.","Отсюда разное [[T22|отношение P/O]] — число молекул ATP на атом восстановленного кислорода: для субстратов NADH в изолированных митохондриях обычно приводят около 2,5, для сукцината — около 1,5. Это оценки при заданных условиях эксперимента, а не постоянные величины любой клетки: фактический выход зависит от протонной утечки и затрат на перенос ADP, ATP и Pi."],"trap":["Если комплекс II не перекачивает H⁺, окисление сукцината не может поддерживать синтез ATP.","Комплекс II восстанавливает убихинон, и его электроны проходят через комплексы III и IV, которые переносят H⁺. Поэтому сукцинат поддерживает Δp и синтез ATP, хотя на пару электронов переносится меньше H⁺, чем при окислении NADH."],"conditions":"Схема механизма. Изолированные митохондрии или пермеабилизованные клетки с доступными сукцинатом, O₂, ADP и Pi; комплексы II, III, IV и ATP-синтаза сохранны. Стехиометрия 4 + 4 + 2 H⁺ на пару электронов — принятая учебная схема для митохондрий млекопитающих; значения P/O около 2,5 и 1,5 — оценки для изолированных митохондрий (Hinkle 2005). Внешний NADH через внутреннюю мембрану не проходит: в экспериментах с интактными митохондриями задают субстраты, образующие NADH в матриксе.","sources":["Hinkle2005","B_LNR2"],"quiz":{"id":"S9-L02","rev":1,"question":"В изолированных митохондриях комплекс I заблокирован. Доступны сукцинат, O₂, ADP и Pi; остальные комплексы сохранны. Возможны ли образование протондвижущей силы и синтез ATP?","options":[{"text":"Возможны: электроны проходят через II, III и IV, а H⁺ переносят III и IV.","correct":true,"feedback":"Комплекс II восстанавливает убихинон. Последующий перенос электронов через III и IV сопряжён с перемещением H⁺, поэтому Δp может поддерживаться.","id":"S9-L02-2"},{"text":"Возможны: комплекс II заменяет комплекс I как самостоятельный насос H⁺.","correct":false,"feedback":"У II нет функции протонного насоса. Он обеспечивает вход электронов в общую цепь переносчиков.","id":"S9-L02-1"},{"text":"Невозможны: комплекс II сам не переносит H⁺ через внутреннюю мембрану.","correct":false,"feedback":"Вариант учитывает отсутствие протонного переноса у II, но пропускает последующие комплексы III и IV.","id":"S9-L02-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Два входа электронов и три участка переноса H⁺","status":"Схема механизма · учебная стехиометрия","ctrls":[{"id":"s","type":"group","label":"Источник электронов","opts":["NADH матрикса","Сукцинат","Комплекс I заблокирован, сукцинат доступен"]}],"W":560,"H":380,"NW":560,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":132,"c":"plain","t":"межмембранное пространство","lx":14,"ly":28},{"x":6,"y":168,"w":548,"h":206,"c":"mito","t":"матрикс","lx":14,"ly":366}],"mem":[{"x1":6,"y1":150,"x2":554,"y2":150}],"nodes":{"c1":{"p":[80,150,64,66],"t":"I","n":[80,150,64,66],"fs":20},"c2":{"p":[184,160,60,50],"t":"II\nFAD","n":[184,160,60,50]},"q":{"p":[272,150,46,40],"t":"Q","n":[272,150,46,40],"fs":19},"c3":{"p":[352,150,64,66],"t":"III","n":[352,150,64,66],"fs":20},"cc":{"p":[436,74,74,34],"t":"цит. c","n":[436,74,74,34]},"c4":{"p":[500,150,64,66],"t":"IV","n":[500,150,64,66],"fs":20},"nadh":{"p":[80,260,80,34],"t":"NADH","n":[80,260,80,34]},"suc":{"p":[196,260,100,34],"t":"сукцинат","n":[196,260,100,34]},"o2":{"p":[480,260,104,34],"t":"O₂ → H₂O","n":[480,260,104,34]}},"edges":{"en":{"a":"nadh","b":"c1","k":"eq"},"e1q":{"a":"c1","b":"q","k":"eq"},"es":{"a":"suc","b":"c2","k":"eq"},"e2q":{"a":"c2","b":"q","k":"eq"},"eq3":{"a":"q","b":"c3","k":"eq"},"e3c":{"a":"c3","b":"cc","k":"eq"},"ec4":{"a":"cc","b":"c4","k":"eq"},"e4o":{"a":"c4","b":"o2","k":"eq"},"h1":{"a":[126,222],"b":[126,46],"k":"tr","t":"4 H⁺","d":[12,0],"anc":"start"},"h3":{"a":[392,222],"b":[392,46],"k":"tr","t":"4 H⁺","d":[-12,0],"anc":"end"},"h4":{"a":[544,222],"b":[544,46],"k":"tr","t":"2 H⁺","d":[-12,0],"anc":"end"}},"st":{"0":{"n":{"c1":"on","q":"on","c3":"on","cc":"on","c4":"on","nadh":"on","c2":"base","suc":"base"},"e":{"es":"off","e2q":"off"},"m":[["Путь электронов","NADH → I → Q → III → c → IV → O₂"],["H⁺ на пару электронов","4 + 4 + 2 = 10"]],"note":"Электроны NADH проходят через комплексы I, III и IV; все три комплекса переносят H⁺ в межмембранное пространство."},"1":{"n":{"c1":"base","nadh":"base","c2":"on","suc":"on","q":"on","c3":"on","cc":"on","c4":"on"},"e":{"en":"off","e1q":"off","h1":"off"},"m":[["Путь электронов","сукцинат → II → Q → III → c → IV → O₂"],["H⁺ на пару электронов","0 + 4 + 2 = 6"]],"note":"Электроны сукцината входят в цепь через комплекс II и восстанавливают убихинон. Комплекс II H⁺ не переносит, но комплексы III и IV создают протондвижущую силу."},"2":{"n":{"c1":"abs","nadh":"off","c2":"on","suc":"on","q":"on","c3":"on","cc":"on","c4":"on"},"e":{"en":"off","e1q":"off","h1":"off"},"m":[["Комплекс I","заблокирован"],["Перенос H⁺ комплексами III и IV","сохранён"]],"note":"Блок комплекса I прекращает окисление NADH, но не путь от сукцината: электроны комплекса II проходят через III и IV. Δp и синтез ATP поддерживаются, хотя на пару электронов переносится меньше H⁺."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}},{"id":"atp-synthase","number":3,"section":0,"title":"Как ATP-синтаза преобразует движение H⁺ в синтез ATP","question":1,"questions":[1],"keywords":["ATP-синтаза","F₀F₁","F0F1","c-кольцо","ротор","γ-субъединица","β-субъединица","механизм изменения связывания","роторный катализ","обратимость"],"lead":["ATP-синтаза состоит из мембранной части F₀ и каталитической части F₁. H⁺ не проходят через F₀ по сквозному каналу: в субъединице a есть два отдельных полуканала, а от одного к другому H⁺ переносит вращающееся кольцо c-субъединиц. Через γ-субъединицу это вращение меняет состояния каталитических центров F₁.","Энергия градиента расходуется прежде всего не на образование связи в активном центре, а на высвобождение прочно связанного ATP."],"mechanism":["H⁺ из межмембранного пространства по первому водному полуканалу субъединицы a подходит к карбоксильной группе c-субъединицы и присоединяется к ней. Нейтральная c-субъединица входит в липидный бислой, кольцо поворачивается на один шаг, и спустя почти полный оборот эта субъединица достигает второго полуканала и отдаёт H⁺ в матрикс.","Кольцо c и центральная ножка (γ-субъединица) вращаются вместе. Асимметричная γ-субъединица поочерёдно меняет конформацию трёх β-субъединиц F₁: центр связывает ADP и Pi, затем прочно удерживает образовавшийся ATP и, наконец, открывается и высвобождает его. Шаг кольца c₈ составляет 45° на один H⁺, а состояния β меняются через каждые 120°.","Направление работы обратимо: при недостаточной Δp и наличии ATP фермент гидролизует ATP и вращается в обратную сторону. Те же два полуканала работают в обратном порядке: H⁺ присоединяется у полуканала, открытого в матрикс, и отдаётся в межмембранное пространство."],"paragraphs":["[[T13|ATP-синтаза (F₀F₁)]] — ферментный комплекс внутренней мембраны. Мембранная часть F₀ содержит кольцо из c-субъединиц и субъединицу a. Субъединица a вместе с периферической ножкой неподвижна относительно мембраны, а c-кольцо вращается. Часть F₁ выступает в матрикс и содержит три пары α- и β-субъединиц; каталитические центры расположены в β-субъединицах. Кольцо c и центральная ножка, включающая γ-субъединицу, образуют ротор, а периферическая ножка удерживает α₃β₃ неподвижно.","Через F₀ H⁺ проходят не по сквозной поре. Субъединица a прилегает к c-кольцу сбоку и образует два водных полуканала, смещённых друг относительно друга вдоль окружности кольца. Один открыт в межмембранное пространство (в митохондриях — в просвет крист), другой — в матрикс, и каждый заканчивается у кольца, не достигая противоположной стороны мембраны. Между полуканалами лежит консервативный положительно заряженный остаток аргинина субъединицы a. В каждой c-субъединице есть консервативная карбоксильная группа (остаток глутамата, у некоторых бактерий — аспартата), которая обратимо присоединяет H⁺. Поэтому H⁺ переходит из межмембранного пространства в матрикс только вместе с поворотом кольца, которое переносит c-субъединицу от одного полуканала к другому.","Направленное вращение возникает из нескольких свойств интерфейса a–c. Заряженная (депротонированная) карбоксильная группа не может войти в гидрофобный слой мембраны, а протонированная нейтральная группа может. Аргинин субъединицы a притягивает депротонированную группу и разделяет места связывания и высвобождения, поэтому H⁺ не переходит из одного полуканала в другой, минуя кольцо. По расчётам, сродство группы к H⁺ у полуканала со стороны межмембранного пространства выше, чем у полуканала в матрикс, что соответствует направлению градиента H⁺. На одной c-субъединице события при синтезе ATP идут в таком порядке: (1) у первого полуканала группа присоединяет H⁺ из межмембранного пространства; (2) нейтральная субъединица уходит в липидный бислой, и кольцо поворачивается на один шаг; (3) почти за полный оборот эта субъединица доходит до второго полуканала и отдаёт H⁺ в матрикс; (4) заряженная группа притягивается аргинином и вновь оказывается у первого полуканала. Вращающий момент создают электростатические взаимодействия на поверхности контакта a–c, а электрохимический градиент H⁺ делает присоединение у одного полуканала и отдачу у другого более вероятными и тем самым задаёт направление вращения.","Вращение кольца превращается в синтез ATP через γ-субъединицу. Кольцо c и центральная ножка вращаются вместе, поэтому γ-субъединица поворачивается внутри α₃β₃ и поочерёдно меняет конформацию β-субъединиц. В любой момент три центра находятся в разных состояниях: открытом, связывающем ADP и Pi и прочно удерживающем ATP. При повороте ротора на 120° каждый центр переходит в следующее состояние. Один шаг c₈-кольца равен 45° и соответствует одному H⁺, поэтому состояния β меняются не на каждый H⁺, а через два–три шага кольца. Этот механизм изменения связывания предложил П. Бойер; вращение γ-субъединицы при гидролизе ATP подтверждено экспериментально (Noji 1997). Сопряжение вращения с катализом называют [[T14|роторным катализом]].","Число c-субъединиц в кольце зависит от организма. У млекопитающих кольцо содержит 8 субъединиц, поэтому за полный оборот через F₀ проходят 8 H⁺, а образуются 3 ATP — около 2,7 H⁺ на ATP (Watt 2010). Ещё примерно один H⁺ на молекулу ATP затрачивается на перенос Pi в матрикс и обмен ADP на ATP. Кольца из 10–15 субъединиц, известные у дрожжей (c₁₀), в хлоропластах (c₁₄) и у бактерий, нельзя переносить на митохондрии человека.","ATP-синтаза обратима. Если Δp мала, а ATP доступен, F₁ гидролизует ATP и вращает γ-субъединицу и c-кольцо в противоположную сторону. Те же два полуканала работают в обратном порядке: у полуканала, открытого в матрикс, карбоксильные группы присоединяют H⁺, а у полуканала, открытого в межмембранное пространство, отдают его, так что F₀ переносит H⁺ из матрикса против градиента. Такой режим поддерживает мембранный потенциал, но расходует ATP. Олигомицин блокирует F₀ и прекращает перенос H⁺ в обоих направлениях, а у клеток ρ⁰ нет субъединицы a (ATP6), поэтому полного пути для H⁺ нет; оба случая разобраны в следующих шагах."],"trap":["ATP-синтаза непосредственно передаёт протоны на ADP.","Фосфатную группу ATP поставляет неорганический фосфат, а не H⁺. Поток H⁺ через F₀ вращает ротор, вращение меняет конформацию каталитических центров F₁, и это обеспечивает связывание субстратов, образование и высвобождение ATP. Сам F₀ при этом не сквозная пора: H⁺ присоединяется к c-субъединице у одного полуканала и отдаётся у другого."],"conditions":"Схема механизма; состояния центров (открытое, слабо и прочно связывающее) показаны качественно по механизму Бойера. Стехиометрия c₈ — для митохондрий млекопитающих (кристаллическая структура F₁-c₈ быка, Watt 2010); прямое наблюдение вращения — одиночные молекулы F₁ термофильной бактерии (Noji 1997). Вопрос шага рассматривает прямой режим при достаточной Δp и наличии ADP и Pi. Установлено структурами ATP-синтаз (криоЭМ): c-кольцо вращается относительно субъединицы a, в которой есть два водных полуканала, разделённых консервативным аргинином; в митохондриях один из них открыт в просвет крист (Kühlbrandt 2019, прочитан только реферат; Wong 2023). Порядок присоединения и отдачи H⁺, направление вращения и роль аргинина показаны в расчётах для F₀ дрожжей (Marciniak 2022; моделировали кольцо дрожжей, а не человека) и согласуются с данными мутагенеза, на которые ссылаются авторы. Для человеческого фермента детальная последовательность элементарных событий в F₀ не установлена, поэтому номера остатков не приводятся, а остатки дрожжей и бактерий на него не переносятся. Шаги 45° на один H⁺ и 120° на смену состояний β на схеме — геометрическая модель с жёсткой передачей вращения; времена и скорости не моделируются.","sources":["Watt2010","Boyer1997","Noji1997","Kuhlbrandt2019","Marciniak2022","Wong2023","B_LNR2"],"quiz":{"id":"S9-L03","rev":1,"question":"ATP-синтаза работает в режиме синтеза ATP: доступны ADP и Pi, протондвижущая сила достаточна. Как движение H⁺ через мембранную часть фермента связано с образованием ATP?","options":[{"text":"Протоны присоединяются к ADP и образуют концевую фосфатную группу.","correct":false,"feedback":"Фосфатную группу поставляет неорганический фосфат. Перенос протонов обеспечивает энергию сопряжённого процесса.","id":"S9-L03-1"},{"text":"Вращение ротора меняет состояния каталитических центров F₁.","correct":true,"feedback":"Механическое сопряжение связывает движение H⁺ с конформационными изменениями каталитических центров и образованием и высвобождением ATP.","id":"S9-L03-3"},{"text":"Электроны поступают с ротора прямо на каталитически связанный ADP.","correct":false,"feedback":"ATP-синтаза не является участком переноса электронов дыхательной цепи. Сопряжение осуществляется через Δp и вращение.","id":"S9-L03-2"}]},"widget":{"kind":"rotor","title":"","s":{"title":"Поворот ротора меняет состояния трёх каталитических центров","status":"Схема механизма · качественные состояния","mode_label":"Режим фермента","modes":["Синтез ATP","Гидролиз ATP"],"btn":"Повернуть ротор на 120°","btn_reset":"Сбросить","ims":"межмембранное пространство","matrix":"матрикс","f0":"F₀: кольцо c₈","f1":"F₁: α₃β₃","gamma":"γ","h_in":"H⁺ в матрикс","h_out":"H⁺ из матрикса","states":["открытый","связывает","прочно\nудерживает"],"cont_syn":["","ADP + Pi","ATP"],"cont_hyd":["","ADP + Pi","ATP → ADP + Pi"],"release_syn":"выход ATP","release_hyd":"выход ADP + Pi","m_turns":"Поворотов на 120°","m_atp_syn":"Образовано ATP","m_atp_hyd":"Гидролизовано ATP","m_h_syn":"H⁺ вошло в матрикс","m_h_hyd":"H⁺ выведено из матрикса","note_syn":"При каждом повороте на 120° каждый центр переходит в следующее состояние: открытый центр связывает ADP и Pi, связывающий центр образует ATP и прочно его удерживает, а удерживающий центр открывается и высвобождает ATP. За полный оборот кольца c₈ входят 8 H⁺ и образуются 3 ATP.","note_hyd":"В режиме гидролиза состояния сменяются в обратном порядке: открытый центр связывает ATP и прочно удерживает его, ATP гидролизуется, затем ADP и Pi удерживаются слабо и выходят. Ротор вращается в противоположном направлении, и F₀ переносит H⁺ из матрикса.","fixed":"Число H⁺ на поворот — 8/3 ≈ 2,7 (кольцо c₈ млекопитающих); дробное значение означает среднее за оборот. Шаг кольца c₈ — 45° на один H⁺, а состояния β меняются через 120°.","lg":["жёлтый центр — в нём сейчас образуется или гидролизуется ATP","стрелка вокруг γ — направление вращения ротора; оранжевая метка в γ показывает накопленный угол","a — неподвижная субъединица; два голубых канала в ней — разные полуканалы, один открыт в межмембранное пространство, другой — в матрикс; красный блок между ними — аргинин субъединицы a","кольцо c показано в развёртке: правый край смыкается с левым; H — нейтральная (протонированная) карбоксильная группа c-субъединицы, − — заряженная (депротонированная)","серая планка и стержень — связь кольца c с γ, а через γ — с центрами β"],"btn_sub":"Один H⁺: следующая стадия","a":"a","arg":"Arg⁺","h":"H⁺","hc_ims":"полуканал\nк межмембранному\nпространству","hc_mat":"полуканал\nк матриксу","bridge":"связь кольца c с γ","ring_dir":"вращение кольца c","stage_names":["1. Протонирование карбоксильной группы c-субъединицы","2. Поворот c-кольца и γ-субъединицы","3. Депротонирование у второго полуканала","4. Смена состояний β-центров"],"st_syn":["Протонирование. H⁺ из межмембранного пространства по первому полуканалу субъединицы a подходит к карбоксильной группе c-субъединицы напротив его выхода и присоединяется к ней. Группа становится нейтральной и может войти в липидный бислой; заряженная группа войти в него не может.","Поворот. Кольцо смещается на одну c-субъединицу (45° для c₈) в ту сторону, в которую уходит нейтральная субъединица. В обратную сторону поворот затруднён: аргинин субъединицы a притягивает недавно депротонированную группу. Вместе с кольцом поворачивается γ. Вращающий момент создают электростатические взаимодействия на поверхности контакта a–c под действием электрохимического градиента H⁺.","Депротонирование. Другая c-субъединица, прошедшая в липидном бислое почти весь оборот кольца, достигает второго полуканала, открытого в матрикс, и отдаёт H⁺ в матрикс. Аргинин субъединицы a стабилизирует заряженную группу и разделяет полуканалы, поэтому H⁺ не может перейти из одного полуканала в другой без поворота кольца. За шаг в матрикс переходит один H⁺."],"st_hyd":["Протонирование. Карбоксильная группа c-субъединицы у полуканала, открытого в матрикс, присоединяет H⁺ из матрикса и становится нейтральной.","Поворот. Гидролиз ATP в F₁ вращает γ и связанное с ней кольцо в сторону, противоположную вращению при синтезе. Кольцо смещается на одну c-субъединицу (45° для c₈), и нейтральная субъединица уходит в липидный бислой.","Депротонирование. c-Субъединица, достигшая полуканала, открытого в межмембранное пространство, отдаёт H⁺ в межмембранное пространство против электрохимического градиента: пока расходуется ATP, H⁺ выводятся из матрикса."],"st4_syn":["Смена состояний β. Накопленный поворот γ достиг очередных 120° (всего {ang}°): открытый центр связал ADP и Pi, связывающий центр образовал ATP и стал удерживать его, а удерживавший центр открылся и высвободил ATP.","Состояния β не изменились. Поворот γ составляет {ang}°; до следующей смены состояний β остаётся поворот на {left}°. Поэтому каталитические события происходят не на каждый H⁺: на 8 шагов кольца c₈ приходится 3 смены состояний β."],"st4_hyd":["Смена состояний β. Накопленный поворот γ достиг очередных 120° (всего {ang}°): состояния центро
