<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-4.html">← Вернуться к семинару</a> · <a href="section-1.html#seminars">Раздел I: семинары</a></p><h1>Динамика, обратные связи и интеграция сигналов</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-cascade"><div class="eyebrow">Усиление и завершение · шаг 1 из 26</div><h2>Как устроен каскад RAS → RAF → MEK → ERK</h2><p class="lead"><a href="#ns-g-S4-T01">Сигнальный каскад</a> MAP-киназ передаёт сигнал от активированного рецептора через три последовательных киназных уровня. Его устройство объясняет, почему каскад способен и усиливать сигнал, и быстро его завершать — этому посвящён вопрос 1 практикума.</p><ol class="mech"><li>Рецептор EGF связывает лиганд, адаптер GRB2 переносит <a href="#ns-g-S4-T12">SOS</a> к мембране, и SOS переводит RAS в GTP-форму.</li><li>RAS-GTP привлекает RAF к мембране; активная RAF фосфорилирует MEK, а MEK — <a href="#ns-g-S4-T04">киназа двойной специфичности</a> — фосфорилирует ERK по <a href="#ns-g-S4-T03">мотиву TEY</a>.</li><li>Активная ERK фосфорилирует сотни субстратов в цитоплазме и ядре, в том числе белки, которые затем тормозят верхние уровни каскада.</li></ol><p><a href="#ns-g-S4-T02">MAP-киназный каскад</a> RAF → MEK → ERK начинается у плазматической мембраны. После связывания EGF рецептор фосфорилирует тирозины своих цитоплазматических участков; к ним присоединяется адаптер GRB2, связанный с фактором обмена нуклеотидов SOS. SOS катализирует замену GDP на GTP в RAS, и RAS-GTP привлекает к мембране RAF.</p><p>Активация RAF многоступенчатая: RAF освобождается от аутоингибирования, локально дефосфорилируется и образует димеры. Активная RAF фосфорилирует MEK1/2 по двум серинам активационной петли. MEK занимает особое положение: это киназа двойной специфичности, которая фосфорилирует и треонин, и тирозин мотива TEY в ERK. Других физиологических субстратов у MEK практически нет, поэтому на этом уровне сходятся сигналы многих вышестоящих киназ.</p><p>ERK активна, когда фосфорилированы оба остатка мотива TEY (T202 и Y204 у ERK1 человека). In vitro MEK фосфорилирует их по очереди, отделяясь от ERK между двумя реакциями; в клетке из-за высокой плотности белков (макромолекулярной скученности) этот процесс может становиться почти непрерывным (квазипроцессивным). Активная ERK фосфорилирует транскрипционные факторы в ядре, киназы RSK и белки цитоскелета в цитоплазме.</p><p>Ингибитор MEK блокирует передачу сигнала от MEK к ERK, но не мешает активации RAS и RAF. Так можно проверить, какие события зависят именно от ERK.</p><div class="note trap"><strong>Типичная ошибка</strong> Каскад — это простая цепочка «включателей»: каждый уровень лишь передаёт сигнал дальше.<p class="trap-fix">Каждый уровень — фермент со своей кинетикой. От соотношения киназ, фосфатаз и их субстратов зависят и усиление, и крутизна, и завершение сигнала, а ERK тормозит верхние уровни каскада.</p></div><div class="static-quiz"><h3>В клетки добавили EGF и аллостерический ингибитор MEK. Какие уровни каскада будут активированы?</h3><ol><li><b>А.</b> RAS и RAF активируются, ERK почти не фосфорилирована <i>(верный вариант)</i><br><span class="expl">Ингибитор MEK действует ниже RAF: рецептор, SOS, RAS и RAF отвечают на EGF, а передача сигнала от MEK к ERK заблокирована.</span></li><li><b>Б.</b> Ни один уровень не активируется: ингибитор блокирует рецептор <i>(неверный вариант)</i><br><span class="expl">Ингибитор MEK не связывается с рецептором EGF. Верхние уровни каскада по-прежнему отвечают на лиганд.</span></li><li><b>В.</b> ERK фосфорилируется, но RAS остаётся в GDP-форме <i>(неверный вариант)</i><br><span class="expl">Порядок обратный: RAS находится выше MEK и активируется, а фосфорилирование ERK, которое выполняет MEK, подавлено.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10605237/">Martin-Vega A et al. 2023. Navigating the ERK1/2 MAPK Cascade. Biomolecules</a></li><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.272.30.19008">Ferrell JE et al. 1997. Mechanistic studies of the dual phosphorylation of mitogen-activated protein kinase. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3150946/">Aoki K et al. 2011. Processive phosphorylation of ERK MAP kinase in mammalian cells. Proc Natl Acad Sci U S A</a></li></ul><p>Схема механизма составлена по обзорам Martín-Vega и Cobb (2023), Lavoie и соавт. (2020), а также по главе 4 пособия. Дистрибутивное фосфорилирование ERK показано in vitro (Ferrell и Bhatt 1997); квазипроцессивное — в клетках HeLa (Aoki 2011). Нумерация сайтов — для ERK1 человека.</p></details></article><article class="card print-unit" id="ns-amplification"><div class="eyebrow">Усиление и завершение · шаг 2 из 26</div><h2>Что такое каталитическое усиление и где оно возникает</h2><p class="lead">Усиление показывает, во сколько раз активных молекул на выходе больше, чем на входе. В каскаде ERK оно возникает не одинаково на каждом уровне: главную роль играет ступень RAF → MEK.</p><ol class="mech"><li>Одна активная киназа, не расходуясь, фосфорилирует много молекул субстрата следующего уровня.</li><li>Число активных молекул на выходе ограничено общим количеством субстрата: активной ERK не может быть больше, чем всей ERK в клетке.</li><li><a href="#ns-g-S4-T05">Каталитическое усиление</a> оценивают при одном фиксированном стимуле, сравнивая количество активных молекул на входе и выходе.</li></ol><p>Фермент в реакции не расходуется, поэтому одна молекула активной киназы за время сигнала фосфорилирует много молекул субстрата. Если на каждом из трёх уровней одна молекула активирует десять, на выходе окажется в 1000 раз больше активных молекул, чем на входе. Такой расчёт показывает принцип, но не описывает реальную клетку.</p><p>В реальной клетке усиление ограничено количеством белков каждого уровня. По измерениям Fujioka и соавт. (2006), в клетках HeLa концентрация RAF составляет около 0,013 мкМ, MEK — около 1,4 мкМ, ERK — около 0,96 мкМ, RAS — около 0,4 мкМ. Число активных молекул равно общему количеству белка, умноженному на долю его активной формы. Когда доли активных форм на соседних уровнях сопоставимы — в модели так бывает при максимальном стимуле, около 77–84 %, — соотношение активных молекул задают количества белков: на ступени RAS → RAF-1 их число не растёт, на ступени RAF-1 → MEK может возрасти примерно в сто раз, а на ступени MEK → ERK многократно не растёт, так как ERK и MEK сопоставимы по количеству. При других стимулах доли различаются, и усиление нужно считать по обоим сомножителям.</p><p>В модели практикума при максимальном стимуле на одну активную RAF приходится около 70 активных молекул ERK. Это число почти одинаково в двух режимах работы ферментов, хотя форма кривой «доза — ответ» в них различается (следующий шаг).</p><p>Усиление увеличивает число эффекторных событий в расчёте на один занятый рецептор, но не позволяет различить две высокие концентрации лиганда, при которых почти все рецепторы уже заняты. Верхнюю границу различимых концентраций задаёт связывание лиганда с рецептором.</p><div class="note trap"><strong>Типичная ошибка</strong> Каскад усиливает сигнал в десять раз на каждом уровне, поэтому ERK всегда во много раз больше, чем RAS.<p class="trap-fix">Усиление ограничено количеством белков на каждом уровне. В клетках HeLa RAF намного меньше, чем RAS, MEK и ERK, поэтому основное усиление по числу молекул приходится на ступень RAF → MEK.</p></div><div class="static-quiz"><h3>В клетке RAF около 0,013 мкМ, MEK — 1,4 мкМ, ERK — 0,96 мкМ. На какой ступени каскада число активных молекул может вырасти больше всего?</h3><ol><li><b>А.</b> RAF → MEK <i>(верный вариант)</i><br><span class="expl">MEK примерно в сто раз больше, чем RAF, и каждая активная RAF фосфорилирует много молекул MEK.</span></li><li><b>Б.</b> MEK → ERK <i>(неверный вариант)</i><br><span class="expl">В клетках HeLa ERK и MEK сопоставимы по количеству (оценки различаются в зависимости от метода), поэтому на этой ступени число активных молекул многократно не растёт.</span></li><li><b>В.</b> На всех ступенях одинаково <i>(неверный вариант)</i><br><span class="expl">Это условный пример «по десять на уровень». Реальное усиление зависит от количества белка на каждом уровне и различается между ступенями.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.M509344200">Fujioka A et al. 2006. Dynamics of the Ras/ERK MAPK cascade as monitored by fluorescent probes. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC38339/">Huang CY et al. 1996. Ultrasensitivity in the mitogen-activated protein kinase cascade. Proc Natl Acad Sci U S A</a></li></ul><p>Концентрации — клетки HeLa, флуоресцентные зонды (Fujioka 2006; значения таблицы 1 приведены по аннотации и базе BioNumbers). Расчёт «70 молекул ERK на одну RAF» — учебная модель практикума (вопрос 1б) с этими концентрациями. Пример «10 × 10 × 10» — условный.</p></details></article><article class="card print-unit" id="ns-steepness"><div class="eyebrow">Усиление и завершение · шаг 3 из 26</div><h2>Почему ответ каскада бывает пологим или крутым</h2><p class="lead">Крутизна показывает, насколько резко доля активной ERK меняется при небольшом изменении стимула. Её создают кинетические свойства ферментов, а не само число уровней каскада.</p><ol class="mech"><li>Если киназа и фосфатаза насыщены субстратом, их скорости почти постоянны, и малый сдвиг их соотношения резко меняет долю фосфорилированного субстрата (<a href="#ns-g-S4-T08">переключение нулевого порядка</a>).</li><li><a href="#ns-g-S4-T09">Дистрибутивное фосфорилирование</a> двух сайтов ERK добавляет ещё одну кинетическую ступень и повышает крутизну.</li><li>При последовательном соединении уровней их крутизна перемножается: <a href="#ns-g-S4-T07">коэффициент Хилла</a> каскада больше, чем у любого отдельного уровня.</li></ol><p><a href="#ns-g-S4-T06">Крутизна, или сверхчувствительность</a>, описывает форму кривой «концентрация стимула — доля активной ERK». Её выражают эффективным коэффициентом Хилла: при значении 1 ответ гиперболический и постепенный, при 4–5 — сигмоидный, близкий к переключателю.</p><p>Goldbeter и Koshland (1981) показали, что крутой ответ может возникнуть без кооперативного связывания. Если концентрация субстрата намного выше Km киназы и фосфатазы, обе работают почти с максимальной скоростью. Пока скорость фосфорилирования ниже скорости дефосфорилирования, почти весь субстрат находится в нефосфорилированной форме; как только она становится выше, почти весь субстрат фосфорилирован. Вблизи равенства скоростей малое изменение входного сигнала переводит систему из одного состояния в другое.</p><p>Huang и Ferrell (1996) измерили ответ каскада в неразбавленных экстрактах ооцитов Xenopus, добавляя киназу Mos в разной концентрации. Для ERK2 эффективный коэффициент Хилла составил 4–5, для MEK1 — около 1,7. Крутизна возрастала от уровня к уровню. Это значение относится к экстрактам с естественными концентрациями ферментов и не переносится автоматически на другие клетки.</p><p>На схеме можно сравнить два режима учебной модели. Усиление при максимальном стимуле в них почти одинаковое, а форма кривой разная: усиление и крутизна — независимые свойства. Коэффициент Хилла зависит от того, по какой величине строят кривую: по концентрации EGF в насыщенном режиме он около 3, а по доле занятых рецепторов — около 5, потому что занятость сама нелинейно зависит от концентрации лиганда. Оба режима — учебные наборы параметров, в которых различаются и насыщение ферментов, и отношения скоростей киназ и фосфатаз; это иллюстрация двух форм ответа, а не опыт с изменением одного параметра.</p><div class="note trap"><strong>Типичная ошибка</strong> Сильный каскад, дающий много активной ERK, обязательно отвечает круто, по порогу.<p class="trap-fix">Масштаб ответа (усиление) и его крутизна независимы: тот же каскад с тем же максимальным выходом может отвечать полого или круто в зависимости от насыщения ферментов.</p></div><div class="static-quiz"><h3>Концентрацию EGF, близкую к пороговой, повышают в 10 раз. Как изменится доля активной ERK, если ферменты каскада насыщены субстратом?</h3><ol><li><b>А.</b> Резко возрастёт: от почти нуля до половины максимума <i>(верный вариант)</i><br><span class="expl">В насыщенном режиме ответ ниже порога почти отсутствует, а вблизи порога резко нарастает: эффективный коэффициент Хилла кривой по концентрации EGF в модели около 3 (по доле занятых рецепторов — около 5).</span></li><li><b>Б.</b> Увеличится примерно в 10 раз, как стимул <i>(неверный вариант)</i><br><span class="expl">Около порога при насыщении ответ растёт гораздо сильнее, чем стимул; почти пропорциональный рост возможен лишь при малом входе в ненасыщенном режиме.</span></li><li><b>В.</b> Изменится немного: каскад сглаживает изменения <i>(неверный вариант)</i><br><span class="expl">Так отвечают ненасыщенные ферменты. При насыщении каскад, напротив, превращает небольшое изменение входа в резкий сдвиг ответа.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC349147/">Goldbeter A et al. 1981. An amplified sensitivity arising from covalent modification in biological systems. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC38339/">Huang CY et al. 1996. Ultrasensitivity in the mitogen-activated protein kinase cascade. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2172246/">Markevich NI et al. 2004. Signaling switches and bistability arising from multisite phosphorylation in protein kinase cascades. J Cell Biol</a></li></ul><p>Коэффициенты Хилла 4–5 (ERK2) и ~1,7 (MEK1) — экстракты ооцитов Xenopus laevis, стимул — Mos 0–300 нМ (Huang и Ferrell 1996; прочитана аннотация, числа проверены по обзору Ferrell 1996). Кривые схемы — учебная модель практикума (функция Голдбетера — Кошланда для трёх уровней), величины условные; коэффициент Хилла на схеме рассчитан по EC10 и EC90 кривой «концентрация EGF — доля активной ERK».</p></details></article><article class="card print-unit" id="ns-termination"><div class="eyebrow">Усиление и завершение · шаг 4 из 26</div><h2>Какими механизмами завершается сигнал</h2><p class="lead">Сигнал ERK затухает, даже когда EGF остаётся в среде: его завершают несколько механизмов на разных уровнях. Они различаются скоростью и мишенью, поэтому их нарушения меняют ответ по-разному.</p><ol class="mech"><li>Фосфатазы <a href="#ns-g-S4-T16">DUSP</a> дефосфорилируют ERK, а <a href="#ns-g-S4-T11">GAP</a>-белки, например <a href="#ns-g-S4-T13">нейрофибромин</a>, ускоряют гидролиз GTP в RAS.</li><li>Активная ERK фосфорилирует RAF-1 и через RSK — SOS1, ослабляя их; кроме того, она индуцирует синтез DUSP и SPRY.</li><li>Активные рецепторы <a href="#ns-g-S4-T17">интернализуются</a> и частично разрушаются в лизосомах, так что на поверхности их становится меньше.</li></ol><p><a href="#ns-g-S4-T10">Завершение сигнала</a> обеспечивают шесть групп механизмов: фосфатазы, прямо дефосфорилирующие ERK; тормозящее фосфорилирование вышестоящих белков, которое осуществляет активная ERK; дефосфорилирование рецептора и адаптеров; GAP-зависимый гидролиз GTP в RAS; интернализация и сортировка рецептора; протеолитическая деградация компонентов.</p><p>Механизмы работают на разных временных масштабах. Дефосфорилирование и гидролиз GTP протекают непрерывно; вызванные ими изменения развиваются и обращаются за секунды и минуты. Тормозящее фосфорилирование SOS и RAF-1 развивается за минуты и не требует синтеза белка. Синтез DUSP и SPRY занимает десятки минут и часы. Интернализация меняет положение рецептора, а деградация необратимо уменьшает его количество.</p><p>Поэтому в клетках PC12 после добавления EGF активность MEK максимальна через 2 мин и возвращается к исходному уровню за 60–90 мин, хотя EGF остаётся в среде (Traverse 1992). Если же EGF отмыть, сигнал затухает за минуты: новые рецепторы не активируются, а дефосфорилирование и гидролиз GTP продолжаются.</p><p>Механизмы не независимы. Интернализация не всегда выключает сигнал: рецептор в эндосоме может продолжать передачу. Обнаружение одного работающего механизма не позволяет предсказать скорость затухания: для этого нужны вклады и временные профили всех механизмов.</p><div class="note trap"><strong>Типичная ошибка</strong> Сигнал ERK затухает только тогда, когда из среды исчезает лиганд.<p class="trap-fix">При постоянном EGF сигнал ERK тоже затухает: число рецепторов на поверхности уменьшается, ERK тормозит RAF-1 и через RSK — SOS1, фосфатазы дефосфорилируют ERK.</p></div><div class="static-quiz"><h3>EGF остаётся в среде, а через 60 мин pERK в несколько раз ниже пика. Что объясняет это наблюдение?</h3><ol><li><b>А.</b> Несколько механизмов завершения на разных уровнях каскада <i>(верный вариант)</i><br><span class="expl">Рецепторы интернализуются и разрушаются, ERK тормозит RAF-1 и через RSK — SOS1, фосфатазы дефосфорилируют ERK: сигнал затухает при сохраняющемся лиганде.</span></li><li><b>Б.</b> Распад EGF в среде за первые минуты <i>(неверный вариант)</i><br><span class="expl">Если EGF отмыть, pERK падает за минуты; при EGF в среде спад медленнее. Значит, лиганд сохраняется, а сигнал прекращают внутриклеточные механизмы.</span></li><li><b>В.</b> Исчерпание ERK: все молекулы разрушились <i>(неверный вариант)</i><br><span class="expl">ERK — стабильный белок: её общее содержание за час почти не меняется. Снижается доля фосфорилированной ERK.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10605237/">Martin-Vega A et al. 2023. Navigating the ERK1/2 MAPK Cascade. Biomolecules</a></li><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1132018/">Traverse S et al. 1992. Sustained activation of the mitogen-activated protein (MAP) kinase cascade may be required for differentiation of PC12 cells. Comparison of the effects of nerve growth factor and epidermal growth factor. Biochem J</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3594966/">Caunt CJ et al. 2013. Dual-specificity MAP kinase phosphatases (MKPs): shaping the outcome of MAP kinase signalling. FEBS J</a></li></ul><p>Классификация механизмов — по обзорам Martín-Vega и Cobb (2023) и Lavoie и соавт. (2020); время ответа на EGF — клетки PC12 (Traverse 1992, аннотация). Графики — учебная модель практикума (вопрос 1п), величины относительные.</p></details></article><article class="card print-unit" id="ns-nf1-g12c"><div class="eyebrow">Усиление и завершение · шаг 5 из 26</div><h2>Что меняют потеря NF1 и мутация KRAS G12C</h2><p class="lead">Потеря нейрофибромина увеличивает время жизни RAS-GTP, но не создаёт нового сигнала. KRAS G12C продолжает переходить между GTP- и GDP-формами, и именно на этом основано действие соторасиба.</p><ol class="mech"><li>Нейрофибромин вводит в активный центр RAS каталитический аргинин (Arg1276) и ускоряет гидролиз GTP на несколько порядков.</li><li><a href="#ns-g-S4-T14">KRAS G12C</a> почти не отвечает на GAP и медленно гидролизует GTP, поэтому значительная его часть находится в GTP-форме и без фактора роста.</li><li><a href="#ns-g-S4-T15">Соторасиб</a> ковалентно связывает цистеин мутантного KRAS в GDP-форме и не даёт белку вернуться в GTP-форму.</li></ol><p>Собственная ГТФазная активность RAS медленная. GAP-белки, в том числе нейрофибромин, ускоряют гидролиз GTP на несколько порядков: аргининовый остаток GAP входит в активный центр RAS и стабилизирует переходное состояние реакции.</p><p>При нейрофиброматозе 1 типа одна аллель NF1 мутантна во всех клетках, а в клетках опухоли (например, в шванновских клетках нейрофибромы) утрачена и вторая, и нейрофибромина нет совсем. Новый сигнал при этом не возникает: RAS по-прежнему активируется только через факторы обмена нуклеотидов (SOS и другие). Но RAS-GTP сохраняется дольше, и каскад, запущенный фактором роста, работает дольше и сильнее. Особенно показательна мутация R1276P: она избирательно выключала GAP-активность нейрофибромина, не нарушая его структуру и связывание с RAS (Klose 1998).</p><p>KRAS G12C смещает равновесие к GTP-форме: мутантный белок почти не отвечает на GAP. Но он не зафиксирован в активном состоянии — медленно гидролизует GTP и проходит через GDP-форму. В ней у белка открыт карман возле участка switch II, и соторасиб необратимо связывает цистеин 12 (Canon 2019). Молекулы захватываются по мере перехода в GDP-форму, поэтому RAS-GTP и pERK снижаются постепенно.</p><p>Два случая показывают две стороны завершения сигнала. При потере NF1 утрачен физиологический механизм выключения RAS, а при лечении опухолей с мутацией KRAS G12C соторасиб создаёт искусственный механизм выключения.</p><div class="note trap"><strong>Типичная ошибка</strong> Мутантный KRAS G12C постоянно связан с GTP, поэтому лекарство должно связывать его активную форму.<p class="trap-fix">KRAS G12C продолжает гидролизовать GTP, хотя медленно. Соторасиб связывает его именно в GDP-форме и удерживает в неактивном состоянии.</p></div><div class="static-quiz"><h3>Почему соторасиб снижает pERK в клетках с KRAS G12C постепенно, а не мгновенно?</h3><ol><li><b>А.</b> Он связывает только GDP-форму мутантного KRAS <i>(верный вариант)</i><br><span class="expl">Молекулы KRAS G12C захватываются по мере того, как они гидролизуют GTP и переходят в GDP-форму; на это нужно время.</span></li><li><b>Б.</b> Он связывает GTP-форму, но медленно проникает в клетку <i>(неверный вариант)</i><br><span class="expl">Соторасиб связывает не GTP-, а GDP-форму: его карман возле switch II открыт только в неактивном состоянии.</span></li><li><b>В.</b> Он действует через нейрофибромин, активируя GAP <i>(неверный вариант)</i><br><span class="expl">Соторасиб связывает сам мутантный KRAS; KRAS G12C к тому же почти нечувствителен к GAP.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8891636/">Anastasaki C et al. 2022. RAS and beyond: the many faces of the neurofibromatosis type 1 protein. Dis Model Mech</a></li><li><a href="https://doi.org/10.1093/hmg/7.8.1261">Klose A et al. 1998. Selective disactivation of neurofibromin GAP activity in neurofibromatosis type 1. Hum Mol Genet</a></li><li><a href="https://doi.org/10.1038/s41586-019-1694-1">Canon J et al. 2019. The clinical KRAS(G12C) inhibitor AMG 510 drives anti-tumour immunity. Nature</a></li></ul><p>Механизм GAP и мутация R1276P — Anastasaki и соавт. (2022), Klose и соавт. (1998); механизм соторасиба — Canon и соавт. (2019). Состояния на схеме — качественные, не данные опыта.</p></details></article><article class="card print-unit" id="ns-measure-cascade"><div class="eyebrow">Усиление и завершение · шаг 6 из 26</div><h2>Как измеряют активность каскада и что показывает блот</h2><p class="lead">Чтобы увидеть усиление и завершение сигнала, активность каскада измеряют во многих точках времени и при разных дозах. Каждый метод измеряет свою величину, и её нельзя подменять другой.</p><ol class="mech"><li><a href="#ns-g-S4-T61">Вестерн-блот</a> с антителами к фосфорилированной форме позволяет сравнивать относительное содержание <a href="#ns-g-S4-T18">pERK</a> в лизате многих клеток после нормировки на общую ERK; проценты на экранах — рассчитанные доли учебной модели.</li><li>Ингибиторы MEK и RAF и генетические воздействия (siRNA, мутации) показывают, какие события зависят от данного звена.</li><li>Репортёры в живых клетках, например <a href="#ns-g-S4-T62">FRET-сенсор</a>, показывают динамику активности ERK в отдельной клетке.</li></ol><p>Основной метод — вестерн-блот: клетки лизируют через 0, 2, 5, 15, 30 и 60 мин после стимула и окрашивают антителами к pERK (T202/Y204), pMEK и общей ERK. Серия точек показывает нарастание и затухание сигнала, а серия доз — форму кривой «доза — ответ».</p><p>Фосфорилирование не то же самое, что активность. Антитело выявляет фосфорилированные сайты, а каталитическую активность фермента проверяют по фосфорилированию его субстратов. Например, для AKT при действии ATP-конкурентных ингибиторов сайты активации даже гиперфосфорилированы (Okuzumi 2009), хотя каталитическая активность фермента подавлена.</p><p>Сигнал на блоте усреднён по миллионам клеток. Гладкая кривая в лизате может складываться из коротких импульсов в отдельных клетках, сдвинутых по фазе. Для одноклеточной динамики используют репортёры: FRET-сенсор EKAR-EV и флуоресцентно меченную ERK, которая при активации переходит в ядро (раздел 2).</p><p>Опыты с ингибиторами и генетическими воздействиями отвечают на вопрос, зависит ли событие от данного звена. Ингибитор MEK, подавляющий событие, показывает его зависимость от MEK, но не доказывает её: при высокой дозе возможны побочные эффекты. Вывод становится надёжнее, если его подтверждает второй, независимый способ — другой ингибитор, siRNA или мутант.</p><div class="note trap"><strong>Типичная ошибка</strong> Если на блоте вырос сигнал pERK, значит, в каждой клетке ERK стала активнее.<p class="trap-fix">Блот показывает среднее фосфорилирование по популяции в момент фиксации. Оно не говорит ни о каталитической активности, ни о поведении отдельных клеток.</p></div><div class="static-quiz"><h3>Ингибитор MEK подавил экспрессию гена-мишени ERK. Какой вывод корректен?</h3><ol><li><b>А.</b> Доказано, что экспрессия гена зависит только от ERK <i>(неверный вариант)</i><br><span class="expl">Один ингибитор показывает зависимость, но не доказывает её: возможны побочные эффекты; нужны независимые подтверждения.</span></li><li><b>Б.</b> Экспрессия зависит от MEK; вывод требует проверки другим способом <i>(верный вариант)</i><br><span class="expl">Результат согласуется с ролью MEK–ERK. Независимый способ — другой ингибитор, siRNA или мутант — делает вывод надёжнее.</span></li><li><b>В.</b> ERK в этих клетках неактивна и без ингибитора <i>(неверный вариант)</i><br><span class="expl">Опыт с ингибитором ничего не говорит о состоянии ERK без него; это проверяют отдельным измерением pERK.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-4.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10570132/">Madsen RR et al. 2023. PI3K signaling through a biochemical systems lens. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2783590/">Okuzumi T et al. 2009. Inhibitor hijacking of Akt activation. Nat Chem Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4151532/">Albeck JG et al. 2013. Frequency-modulated pulses of ERK activity transmit quantitative proliferation signals. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3226481/">Komatsu N et al. 2011. Development of an optimized backbone of FRET biosensors for kinases and GTPases. Mol Biol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3925772/">Toettcher JE et al. 2013. Using optogenetics to interrogate the dynamic control of signal transmission by the Ras/Erk module. Cell</a></li></ul><p>Методы и их ограничения — по главе 4 пособия, обзорам Lavoie и соавт. (2020) и Madsen и Toker (2023); устройство сенсора EKAR-EV — Komatsu и соавт. (2011), ERK, переходящая в ядро, — Toettcher и соавт. (2013). Полосы на схеме условные, это не результат опыта.</p></details></article><article class="card print-unit" id="ns-profile"><div class="eyebrow">Длительность сигнала · шаг 7 из 26</div><h2>Чем описывается временной профиль сигнала</h2><p class="lead">Активность ERK во времени описывают четыре различимых свойства: амплитуда, длительность, число импульсов и площадь под кривой. Они не обязательно независимы: изменение дозы стимула часто меняет сразу несколько из них.</p><ol class="mech"><li>Амплитуда — наибольшее значение активности; длительность — время, пока активность выше заданного порога (например, половины пика).</li><li>Число и частота импульсов описывают повторяющиеся подъёмы; <a href="#ns-g-S4-T20">площадь под кривой</a> — интеграл активности по времени (интегральная доза).</li><li>Нижележащие процессы с разной кинетикой «считывают» разные свойства <a href="#ns-g-S4-T19">временного профиля</a>.</li></ol><p>Сигнал описывается не двумя состояниями «включено — выключено», а кривой изменения активности во времени. Короткий высокий пик и долгое низкое плато могут иметь одинаковую площадь, но действовать на клетку по-разному. Чтобы сравнивать профили, их описывают несколькими числами.</p><p>Амплитуда показывает, насколько сильно активирована киназа в момент максимума. Длительность — сколько времени активность остаётся выше порога; порог нужно указывать, иначе число теряет смысл. Площадь под кривой — интегральная доза — показывает суммарное количество сигнала. Если активность изменяется импульсами, важны их число, частота и интервалы между ними.</p><p>Нижележащие белки различаются скоростями. Состояние быстро активируемых и быстро инактивируемых мишеней изменяется вслед за текущей активностью ERK. Мишени, которые накапливаются медленно, например стабильные белки или продукты транскрипции, суммируют сигнал во времени. А механизмы с порогом по непрерывной длительности отвечают только на достаточно долгий сигнал.</p><p>Свойства профиля не являются независимыми информационными каналами: более высокая доза стимула обычно повышает и амплитуду, и длительность, и площадь. Поэтому вывод о роли одного свойства требует опыта, в котором остальные удерживаются постоянными.</p><div class="note trap"><strong>Типичная ошибка</strong> Если суммарная активность ERK одинакова, то и ответ клетки одинаков.<p class="trap-fix">Одинаковая площадь под кривой может складываться из разных профилей. Механизмы, требующие непрерывного сигнала, по-разному отвечают на один длинный сигнал и на несколько коротких той же суммарной дозы.</p></div><div class="static-quiz"><h3>Два профиля ERK имеют одинаковую площадь под кривой: короткий высокий пик и долгое низкое плато. Чем они различаются?</h3><ol><li><b>А.</b> Ничем: интегральная доза полностью описывает сигнал <i>(неверный вариант)</i><br><span class="expl">Площадь — лишь одно из четырёх свойств профиля. Амплитуда и длительность у этих профилей разные.</span></li><li><b>Б.</b> Амплитудой и длительностью при равной интегральной дозе <i>(верный вариант)</i><br><span class="expl">Пик выше, но короче; плато ниже, но дольше. Механизмы с порогом по длительности ответят только на плато.</span></li><li><b>В.</b> Только числом импульсов <i>(неверный вариант)</i><br><span class="expl">В обоих случаях импульс один. Профили различаются высотой и продолжительностью.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3707615/">Purvis JE et al. 2013. Encoding and decoding cellular information through signaling dynamics. Cell</a></li></ul><p>Определения — по обзору Purvis и Lahav (2013) и главе 4 пособия. Профили схемы — условные, построены для иллюстрации; площадь выражена в условных единицах.</p></details></article><article class="card print-unit" id="ns-pc12"><div class="eyebrow">Длительность сигнала · шаг 8 из 26</div><h2>Что показывает опыт с EGF и NGF на клетках PC12</h2><p class="lead">В клетках PC12 EGF вызывает кратковременную активацию ERK и деление, а NGF — устойчивую активацию и нейрональную дифференцировку. Этот классический результат показывает связь профиля ERK с исходом, но не позволяет выделить причину.</p><ol class="mech"><li>EGF через рецептор EGFR активирует ERK на минуты: активность максимальна через несколько минут и затем возвращается к исходному уровню.</li><li>NGF через рецептор TrkA активирует ERK на часы, ERK накапливается в ядре.</li><li>Рецепторы EGFR и TrkA различаются не только профилем ERK, но и другими ветвями сигнала.</li></ol><p><a href="#ns-g-S4-T21">PC12</a> — линия клеток феохромоцитомы крысы. Под действием одних факторов они делятся, под действием других образуют отростки, похожие на нейриты. Это удобная модель выбора клеточного ответа.</p><p>Traverse и соавт. (1992) измерили активность MEK и ERK после <a href="#ns-g-S4-T22">EGF и NGF</a>. И EGF, и NGF повышали активность MEK более чем в 20 раз, но после EGF она была максимальна через 2 мин и возвращалась к исходному уровню за 60–90 мин, а после NGF оставалась высокой не менее 90 мин; ERK переходила в ядро, тогда как после EGF к 30 мин этого не происходило. EGF стимулировал деление клеток, NGF — нейрональную дифференцировку.</p><p>Marshall (1995) обобщил эти данные: длительность активации ERK может определять выбор ответа. Но сравнение EGF и NGF не позволяет выделить роль длительности. EGFR и TrkA — разные рецепторы, и они по-разному активируют PI3K, PLCγ и другие ветви. Разный исход может зависеть и от них.</p><p>Поэтому опыт с двумя факторами показывает корреляцию. Чтобы проверить причинную роль длительности, нужно изменить профиль ERK при прочих равных — это следующий шаг.</p><div class="note trap"><strong>Типичная ошибка</strong> Опыт с EGF и NGF доказал, что исход определяет только длительность активности ERK.<p class="trap-fix">Опыт показал связь профиля ERK с исходом. EGFR и TrkA различаются и другими ветвями сигнала, поэтому причинность требует опытов, где меняется только профиль.</p></div><div class="static-quiz"><h3>В клетках PC12 EGF даёт короткий сигнал ERK и деление, NGF — длительный сигнал и дифференцировку. Какой вывод обоснован строже всего?</h3><ol><li><b>А.</b> Длительность активации ERK — единственная причина разных исходов <i>(неверный вариант)</i><br><span class="expl">Рецепторы EGFR и TrkA различаются и другими ветвями сигнала; одно сравнение не позволяет выделить роль длительности.</span></li><li><b>Б.</b> ERK не участвует в выборе исхода <i>(неверный вариант)</i><br><span class="expl">Опыт показывает обратное: профиль ERK различается вместе с исходом.</span></li><li><b>В.</b> Профиль ERK связан с исходом, причина не выделена <i>(верный вариант)</i><br><span class="expl">Наблюдение — корреляция. Для причинного вывода нужно менять только длительность сигнала.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1132018/">Traverse S et al. 1992. Sustained activation of the mitogen-activated protein (MAP) kinase cascade may be required for differentiation of PC12 cells. Comparison of the effects of nerve growth factor and epidermal growth factor. Biochem J</a></li><li><a href="https://doi.org/10.1016/0092-8674(95)90401-8">Marshall CJ 1995. Specificity of receptor tyrosine kinase signaling: transient versus sustained extracellular signal-regulated kinase activation. Cell</a></li></ul><p>Данные — клетки PC12 крысы, EGF и NGF, активность MEK и MAP-киназ (Traverse 1992, аннотация; обзор Marshall 1995). Кривые схемы — учебная модель практикума (вопрос 2б), относительные величины.</p></details></article><article class="card print-unit" id="ns-causality"><div class="eyebrow">Длительность сигнала · шаг 9 из 26</div><h2>Как проверяют, что исход определяет именно длительность сигнала</h2><p class="lead">Причинную роль длительности проверяют, меняя профиль ERK при том же рецепторе и лиганде. Избыток EGFR превращает короткий ответ на EGF в длительный — и клетки PC12 дифференцируются.</p><ol class="mech"><li>Если рецепторов EGF во много раз больше, уменьшение их числа на поверхности и обратные связи не успевают ослабить сигнал от рецепторов, и ERK остаётся активной долго.</li><li>С тем же EGF клетки PC12 с избытком EGFR образуют отростки, как при NGF.</li><li>Профиль ERK определяется сетью обратных связей: при EGF преобладает отрицательная обратная связь, при NGF добавляется положительная (через PKC).</li></ol><p>Traverse и соавт. (1994) получили клетки PC12, в которых рецептора EGF было намного больше обычного. В таких клетках EGF вызывал длительную активацию MAP-киназ и их переход в ядро, а затем нейрональную дифференцировку, как NGF в обычных клетках. Сходный результат дал избыток рецептора инсулина: инсулин вызывал длительную активацию и рост отростков (Dikic 1994).</p><p>Этот опыт сильнее сравнения двух факторов: лиганд и тип рецептора те же, изменился профиль ERK, и изменился исход. Остаётся оговорка: избыток рецептора усиливает и другие ветви сигнала, поэтому решающие опыты — те, где вход задают напрямую (следующие шаги).</p><p>Чем обусловлено различие профилей? Santos и соавт. (2007) определили знаки обратных связей в модуле RAF–MEK–ERK клеток PC12: при EGF в модуле действовала только отрицательная обратная связь, а при NGF добавлялась положительная, зависящая от PKC. Модель, учитывающая это различие, воспроизводила короткий и длительный профили. Рецептор задаёт вход, а форму профиля создаёт сеть обратных связей.</p><p>Значит, для причинного вывода нужен опыт, где меняется одна переменная, а остальные контролируются.</p><div class="note trap"><strong>Типичная ошибка</strong> Длительный сигнал ERK — особое свойство рецептора NGF.<p class="trap-fix">Тот же EGF даёт длительный сигнал при избытке EGFR. Профиль задаёт не рецептор сам по себе, а соотношение входа и обратных связей.</p></div><div class="static-quiz"><h3>В клетках PC12 с избытком EGFR тот же EGF вызвал длительную активацию ERK и дифференцировку. Что добавляет этот опыт к сравнению EGF и NGF?</h3><ol><li><b>А.</b> Исход изменился вместе с профилем ERK при том же лиганде <i>(верный вариант)</i><br><span class="expl">Лиганд и тип рецептора те же, а изменился профиль ERK — это довод в пользу причинной роли длительности сигнала.</span></li><li><b>Б.</b> Доказывает, что другие ветви сигнала не участвуют <i>(неверный вариант)</i><br><span class="expl">Избыток рецептора усиливает и другие ветви. Опыт сильнее сравнения факторов, но не исключает их вклад.</span></li><li><b>В.</b> Показывает, что NGF действует через EGFR <i>(неверный вариант)</i><br><span class="expl">NGF действует через TrkA. Опыт показывает, что длительный сигнал можно получить и через EGFR.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/s0960-9822(00)00154-8">Traverse S et al. 1994. EGF triggers neuronal differentiation of PC12 cells that overexpress the EGF receptor. Curr Biol</a></li><li><a href="https://doi.org/10.1016/s0960-9822(00)00155-x">Dikic I et al. 1994. PC12 cells overexpressing the insulin receptor undergo insulin-dependent neuronal differentiation. Curr Biol</a></li><li><a href="https://doi.org/10.1038/ncb1543">Santos SD et al. 2007. Growth factor-induced MAPK network topology shapes Erk response determining PC-12 cell fate. Nat Cell Biol</a></li></ul><p>Клетки PC12 с избытком EGFR (Traverse 1994) и рецептора инсулина (Dikic 1994) — аннотации. Топология обратных связей — Santos и соавт. (2007, аннотация и последующие работы); киназа положительной связи названа PKC без уточнения изоформы. Графики — учебная модель практикума (вопрос 2б).</p></details></article><article class="card print-unit" id="ns-cfos"><div class="eyebrow">Длительность сигнала · шаг 10 из 26</div><h2>Как c-Fos «считывает» длительность сигнала ERK</h2><p class="lead">c-Fos — белок, который накапливается только тогда, когда ERK ещё активна в момент его синтеза. Длительность сигнала считывается в два этапа: стабилизация белка и его дополнительное фосфорилирование через DEF-мотив.</p><ol class="mech"><li>ERK запускает транскрипцию <a href="#ns-g-S4-T23">гена немедленного ответа</a> c-fos; белок <a href="#ns-g-S4-T24">c-Fos</a> появляется через десятки минут и без модификаций быстро разрушается.</li><li>Если ERK в это время активна, она и RSK фосфорилируют С-конец c-Fos (S374, S362), и белок стабилизируется.</li><li>Затем открывается <a href="#ns-g-S4-T25">DEF-мотив</a>: ERK связывается с ним и фосфорилирует T325 и T331; без этого этапа сигнальная функция c-Fos нарушена.</li></ol><p>Murphy и соавт. (2002) изучали, почему в фибробластах Swiss 3T3 короткий и длительный сигналы ERK приводят к разному результату. Оказалось, что решающее значение имеет время: мРНК c-fos синтезируется сразу после стимула, а белок c-Fos появляется позже. При коротком сигнале ERK к этому моменту уже неактивна, и новый c-Fos быстро разрушается.</p><p>При длительном сигнале ERK ещё активна, когда появляется белок. ERK фосфорилирует S374, а RSK — S362 в С-концевой области (нумерация c-Fos человека). Это фосфорилирование стабилизирует белок и открывает DEF-мотив (FXFP) — участок связывания ERK, после чего ERK фосфорилирует T325 и T331. Стабильный c-Fos накапливается и вместе с c-Jun образует фактор AP-1.</p><p>Замены в DEF-мотиве нарушают второй этап: начальное фосфорилирование S374 от DEF-мотива не зависит, а T325 и T331 ERK без него почти не фосфорилирует, и c-Fos-зависимая передача сигнала нарушается, хотя сигнал ERK длительный (Murphy 2002). Значит, способность различать длительность сигнала определяется свойствами самого белка-мишени. В учебной модели количество стабильного белка при замене DEF-мотива принято неизменным, а с формой pT325/pT331 связана активность AP-1 — это допущение модели.</p><p>Механизм показан для c-Fos в фибробластах. Переносить его на другие белки немедленного ответа можно только после проверки, есть ли у них сходный мотив связывания ERK и сходная кинетика.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем дольше активна ERK, тем больше мРНК c-fos, и поэтому c-Fos накапливается.<p class="trap-fix">мРНК c-fos образуется и при коротком сигнале. Накопление белка определяется фосфорилированием новосинтезированного c-Fos активной ERK, которое его стабилизирует.</p></div><div class="static-quiz"><h3>В c-Fos заменены остатки DEF-мотива, а сигнал ERK длительный. Как изменится фосфорилирование c-Fos по T325 и T331?</h3><ol><li><b>А.</b> Не изменится: ERK активна долго <i>(неверный вариант)</i><br><span class="expl">Активность ERK одинакова, но для фосфорилирования T325 и T331 ERK должна связаться с DEF-мотивом; без него этот этап почти не идёт.</span></li><li><b>Б.</b> Будет намного слабее, хотя стабилизирующее фосфорилирование S374 сохранится <i>(верный вариант)</i><br><span class="expl">Начальное фосфорилирование С-конца от DEF-мотива не зависит, а T325 и T331 ERK фосфорилирует, связавшись с DEF-мотивом (Murphy 2002).</span></li><li><b>В.</b> Будет сильнее: мутантный мотив прочнее связывает ERK <i>(неверный вариант)</i><br><span class="expl">Замена остатков FXFP разрушает участок связывания ERK, а не усиливает его.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/ncb822">Murphy LO et al. 2002. Molecular interpretation of ERK signal duration by immediate early gene products. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li></ul><p>Фибробласты Swiss 3T3 (Murphy 2002; аннотация, подписи к рисункам и, по данным внешнего аудита, результаты к рис. 3–7: DEF-мотив не нужен для фосфорилирования S374; сайты S374/S362 — по Reactome). Период полужизни c-Fos из этой работы в модель не перенесён. Кривые схемы — учебная модель практикума (вопрос 2п): свет включает RAS, c-Fos — условные величины, % от программы «120 мин подряд».</p></details></article><article class="card print-unit" id="ns-optogenetics"><div class="eyebrow">Длительность сигнала · шаг 11 из 26</div><h2>Как оптогенетика разделяет длительность и интегральную дозу</h2><p class="lead">Свет позволяет включать RAS напрямую, минуя рецепторы, и менять только временной профиль входа. Так показали, что некоторые ответы требуют непрерывного сигнала дольше часа и не возникают при прерывистом сигнале с той же интегральной дозой.</p><ol class="mech"><li>Красный свет переносит каталитический домен SOS к мембране, где он активирует RAS; дальний красный свет возвращает его в цитоплазму (<a href="#ns-g-S4-T26">оптогенетический вход</a>).</li><li>Каскад передаёт входные сигналы длительностью от 4 мин до 2 ч и сглаживает более короткие.</li><li><a href="#ns-g-S4-T27">Паракринная программа</a> — фосфорилирование STAT3 в соседних клетках — включается только после непрерывной активации RAS дольше часа.</li></ol><p>Toettcher и соавт. (2013) соединили каталитический домен SOS с белком PIF, а на мембране закрепили фоторецептор PhyB. Красный свет вызывает их связывание, и SOS активирует RAS; дальний красный свет вызывает диссоциацию этого комплекса, и SOS возвращается в цитоплазму. Так в фибробластах NIH3T3 можно задавать вход любой длительности, не меняя рецептор и лиганд.</p><p>Каскад вёл себя как фильтр: входные сигналы длительностью от 4 мин до 2 ч и более передавались к ERK в ядре, а более короткие сглаживались. Сигнал от RAS до ядерной ERK проходил примерно за 3 мин.</p><p>Затем сравнили профили при одинаковой суммарной дозе. Фосфорилирование STAT3 в соседних клетках, вызванное секретируемым фактором, появлялось только после непрерывной активации RAS дольше часа. Два импульса по 1 ч с паузой 1 ч при той же суммарной дозе такого ответа не давали. Механизм с порогом по непрерывной длительности отвечает на эти протоколы по-разному, хотя интеграл одинаков.</p><p>Контроль интегральной дозы обязателен: если два протокола различаются и длительностью, и дозой, разные исходы допускают три объяснения. В модели практикума видно и другое: c-Fos стабилизируется в каждом импульсе длительностью 1 ч, а паракринная программа — нет. Разные механизмы считывают длительность с разными порогами.</p><div class="note trap"><strong>Типичная ошибка</strong> Если суммарная доза активации RAS одинакова, клетка ответит одинаково.<p class="trap-fix">При равной интегральной дозе непрерывный сигнал дольше часа включает паракринную программу, а два импульса по 1 ч с паузой — нет.</p></div><div class="static-quiz"><h3>Свет подают двумя импульсами по 60 мин с паузой 60 мин; интеграл активности ERK такой же, как при 120 мин подряд. Будет ли фосфорилирован STAT3 в соседних клетках?</h3><ol><li><b>А.</b> Да: важна только суммарная доза <i>(неверный вариант)</i><br><span class="expl">Паракринная программа требует непрерывной активации дольше часа; за время паузы её активация прерывается.</span></li><li><b>Б.</b> Да, но слабее, пропорционально дозе <i>(неверный вариант)</i><br><span class="expl">Доза одинакова, а ответа нет: решающей оказывается непрерывная длительность, а не интеграл.</span></li><li><b>В.</b> Нет: нужна непрерывная активация дольше часа <i>(верный вариант)</i><br><span class="expl">В опытах Toettcher (2013) два импульса по 1 ч с паузой не вызывали фосфорилирования STAT3, а 2 ч подряд — вызывали.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3925772/">Toettcher JE et al. 2013. Using optogenetics to interrogate the dynamic control of signal transmission by the Ras/Erk module. Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3707615/">Purvis JE et al. 2013. Encoding and decoding cellular information through signaling dynamics. Cell</a></li></ul><p>Фибробласты NIH3T3, оптогенетическая система PhyB–PIF–SOScat (Toettcher 2013, полный текст): задержка ≈3 мин, передача входов от 4 мин до ≥2 ч, STAT3 после &gt;1 ч непрерывной активации, сравнение 2 ч подряд и 2 × 1 ч с паузой 1 ч. Кривые — учебная модель практикума (вопрос 2п); порог паракринной программы в модели — 75 мин непрерывной активности.</p></details></article><article class="card print-unit" id="ns-single-cell"><div class="eyebrow">Длительность сигнала · шаг 12 из 26</div><h2>Чем среднее по популяции отличается от сигнала одной клетки</h2><p class="lead">Гладкая кривая pERK в лизате может складываться из коротких импульсов в отдельных клетках, сдвинутых по фазе. Различить эти варианты можно только наблюдая отдельные живые клетки во времени.</p><ol class="mech"><li><a href="#ns-g-S4-T29">Репортёр активности ERK</a> (например, FRET-сенсор EKAR) показывает динамику в каждой клетке.</li><li>В клетках MCF-10A при постоянном EGF ERK активируется дискретными импульсами, не синхронными между клетками.</li><li>Частота импульсов растёт с концентрацией EGF; доля делящихся клеток связана с интегралом активности ERK.</li></ol><p>Вестерн-блот и другие <a href="#ns-g-S4-T28">популяционные измерения</a> усредняют сигнал миллионов клеток. Если клетки отвечают импульсами в разные моменты, среднее даёт плавную кривую, которой нет ни в одной клетке. Поэтому по популяционной кривой нельзя судить, гладкий ли сигнал в каждой клетке или импульсный.</p><p>Albeck и соавт. (2013) наблюдали активность ERK в отдельных клетках эпителия молочной железы MCF-10A с помощью сенсора EKAR-EV. При постоянном EGF ERK активировалась импульсами примерно по 20–30 мин, разделёнными паузами; при низкой концентрации EGF паузы длились часами. С ростом концентрации EGF импульсы становились чаще и длиннее.</p><p>Доля клеток, вступающих в S-фазу, была связана с интегралом активности ERK во времени. Ингибитор рецептора снижал частоту импульсов, а ингибитор MEK — их амплитуду; деление прекращалось, лишь когда выход пути ERK (по уровню белка Fra-1) падал ниже примерно 10 % исходного; подавление выхода на 85 % снижало пролиферацию меньше чем вдвое.</p><p>Отсюда практическое правило: прежде чем делать вывод о «длительном» или «коротком» сигнале, нужно знать, к какому уровню относится измерение — к популяции или к клетке.</p><div class="note trap"><strong>Типичная ошибка</strong> Плавная кривая pERK на блоте означает плавный сигнал в каждой клетке.<p class="trap-fix">Плавное среднее совместимо и с плавной динамикой каждой клетки, и с асинхронными импульсами. Различить их можно только наблюдением отдельных клеток.</p></div><div class="static-quiz"><h3>pERK в лизате клеток плавно растёт и остаётся на постоянном промежуточном уровне. Какое измерение покажет, что происходит в отдельных клетках?</h3><ol><li><b>А.</b> Вестерн-блот с большим числом точек времени <i>(неверный вариант)</i><br><span class="expl">Больше точек уточнит среднюю кривую, но она по-прежнему отражает среднее по клеткам и скрывает импульсы в отдельных клетках.</span></li><li><b>Б.</b> Наблюдение репортёра ERK в живых отдельных клетках <i>(верный вариант)</i><br><span class="expl">Покадровое наблюдение отдельных клеток различает гладкую динамику и асинхронные импульсы.</span></li><li><b>В.</b> Измерение общей ERK в лизате <i>(неверный вариант)</i><br><span class="expl">Общее количество ERK не отражает её активности и тоже усредняется по клеткам.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-4.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4151532/">Albeck JG et al. 2013. Frequency-modulated pulses of ERK activity transmit quantitative proliferation signals. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3707615/">Purvis JE et al. 2013. Encoding and decoding cellular information through signaling dynamics. Cell</a></li></ul><p>Клетки MCF-10A, сенсор EKAR-EV, постоянный EGF (Albeck 2013, полный текст). Кривые схемы — учебная модель асинхронных импульсов (40 условных клеток), не данные опыта.</p></details></article><article class="card print-unit" id="ns-feedback-vs-termination"><div class="eyebrow">Обратные связи · шаг 13 из 26</div><h2>Чем обратная связь отличается от завершения сигнала в узле</h2><p class="lead">При обратной связи нижележащий компонент регулирует вышестоящие звенья, поэтому прошлое состояние сети влияет на её дальнейшую динамику. Отрицательная связь ограничивает ответ, положительная его усиливает и может сделать необратимым.</p><ol class="mech"><li>Завершение в узле действует локально: фосфатаза дефосфорилирует ERK, GAP переводит RAS в GDP-форму.</li><li>В <a href="#ns-g-S4-T31">отрицательной обратной связи</a> активная ERK тормозит RAF-1 и через RSK — SOS1, а также индуцирует синтез DUSP и SPRY.</li><li>В <a href="#ns-g-S4-T32">положительной обратной связи</a> выход усиливает собственное образование: например, при NGF в клетках PC12 ERK усиливает активацию RAF через PKC.</li></ol><p>Механизмы завершения из раздела 1 работают в отдельных узлах: каждый уменьшает активность своего звена. <a href="#ns-g-S4-T30">Обратная связь</a> устроена иначе: выход каскада действует на его вход или промежуточные звенья. Поэтому ответ сети в данный момент зависит от её состояния минуту или час назад.</p><p>В каскаде ERK отрицательная связь действует на двух временных масштабах. Быстрая — посттрансляционная: ERK фосфорилирует несколько сериновых остатков RAF-1 и снижает её связывание с RAS (Dougherty 2005), а ERK и RSK фосфорилируют С-концевой участок SOS1: фосфорилирование по S1134 и S1161 (RSK) создаёт сайты связывания белков 14-3-3 и ослабляет активацию RAS (Douville и Downward 1997; Saha 2012). Медленная — транскрипционная: ERK индуцирует синтез DUSP и белков <a href="#ns-g-S4-T33">SPRY/SPRED</a>, которые действуют только после накопления.</p><p>Положительная связь усиливает ответ. В клетках PC12 при NGF ERK через PKC усиливает активацию RAF, и ответ становится длительным (Santos 2007). В ооцитах Xenopus MAPK стабилизирует Mos и усиливает его синтез — так возникает переключатель; этот пример разобран в шагах о бистабильности.</p><p>Обратная связь не заменяет механизмы завершения, а надстраивается над ними. Поэтому разрыв одной петли обычно меняет весь профиль — форму пика, высоту плато и время затухания, — а не одну длительность.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование SOS и RAF-1 активной ERK — положительная обратная связь, усиливающая каскад.<p class="trap-fix">Это отрицательная обратная связь: фосфорилированные SOS и RAF-1 хуже передают сигнал, и каскад тормозит сам себя.</p></div><div class="static-quiz"><h3>Активная ERK фосфорилирует RAF-1, после чего RAF-1 хуже связывается с RAS. К какому типу регуляции это относится?</h3><ol><li><b>А.</b> Положительная обратная связь <i>(неверный вариант)</i><br><span class="expl">Фосфорилированная RAF-1 хуже передаёт сигнал: выход каскада ослабляет собственный вход, а это отрицательная связь.</span></li><li><b>Б.</b> Отрицательная обратная связь <i>(верный вариант)</i><br><span class="expl">Выход каскада (ERK) тормозит вышестоящее звено (RAF-1) — классическая отрицательная обратная связь, действующая за минуты.</span></li><li><b>В.</b> Завершение сигнала в узле, не связанное с выходом <i>(неверный вариант)</i><br><span class="expl">Торможение запускает сама активная ERK, то есть выход каскада, поэтому это обратная связь, а не локальное завершение.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2004.11.055">Dougherty MK et al. 2005. Regulation of Raf-1 by direct feedback phosphorylation. Mol Cell</a></li><li><a href="https://doi.org/10.1038/sj.onc.1201214">Douville E et al. 1997. EGF induced SOS phosphorylation in PC12 cells involves P90 RSK-2. Oncogene</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4198020/">Saha M et al. 2012. RSK phosphorylates SOS1 creating 14-3-3-docking sites and negatively regulating MAPK activation. Biochem J</a></li><li><a href="https://doi.org/10.1038/ncb1543">Santos SD et al. 2007. Growth factor-induced MAPK network topology shapes Erk response determining PC-12 cell fate. Nat Cell Biol</a></li><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li></ul><p>Отрицательные связи — Dougherty и соавт. (2005; Raf-1, шесть сайтов), Douville и Downward (1997), Saha и соавт. (2012; RSK, SOS1 S1134/S1161), аннотации; положительная связь через PKC — Santos и соавт. (2007). Схема — механизм, не данные опыта.</p></details></article><article class="card print-unit" id="ns-two-loops"><div class="eyebrow">Обратные связи · шаг 14 из 26</div><h2>Что делают быстрая и медленная отрицательные петли ERK</h2><p class="lead">Быстрая петля ограничивает пик в первые минуты, медленная снижает поздний уровень сигнала и повышает порог повторной активации. Их разрыв меняет не только длительность, но и форму всего профиля.</p><ol class="mech"><li>Быстрая петля: ERK фосфорилирует RAF-1, а активированная ею RSK — SOS1 (S1134, S1161); эффект развивается за минуты и не требует синтеза белка.</li><li>Медленная петля: ERK индуцирует транскрипцию генов DUSP и SPRY; белки накапливаются через десятки минут и часы.</li><li>Циклогексимид, подавляющий синтез белка, выключает медленную петлю, но не быструю.</li></ol><p>Две отрицательные петли действуют на разных временных масштабах и по-разному влияют на профиль сигнала. Быстрая начинает работать, как только ERK становится активной: фосфорилирование SOS и RAF-1 уменьшает поток сигнала от рецептора уже в первые минуты. Поэтому она определяет, насколько широк пик и как быстро начинается спад.</p><p>Медленная петля требует синтеза мРНК и белка: ядерная ERK индуцирует гены DUSP1, DUSP5, DUSP6 и SPRY. Пока эти белки не накопились, они не действуют; затем они дефосфорилируют ERK и тормозят вход на уровне RAS. Эффект сохраняется дольше однократного фосфорилирования и повышает порог повторной активации тем же стимулом.</p><p>Вклад петель можно разделить экспериментально. Мутанты RAF-1 без сайтов, которые фосфорилирует ERK, дольше остаются активными (Dougherty 2005). Подавление синтеза белка выключает медленную петлю; но циклогексимид подавляет синтез всех белков, поэтому роль именно DUSP подтверждают с помощью siRNA или нокаута.</p><p>В модели практикума без быстрой петли pERK через 30 мин после EGF выше нормы почти вдвое, а без медленной — выше на позднем спаде. Если выключить обе, pERK остаётся высоким гораздо дольше: снижается он в основном из-за потери рецепторов.</p><div class="note trap"><strong>Типичная ошибка</strong> Обратные связи определяют только длительность сигнала.<p class="trap-fix">Разрыв петли может изменить и амплитуду, и высоту плато, и время затухания. Поэтому у обратной связи различают по меньшей мере три наблюдаемых следствия.</p></div><div class="static-quiz"><h3>Синтез белка подавлен циклогексимидом, EGF в среде. Какая петля перестанет работать?</h3><ol><li><b>А.</b> Быстрая: фосфорилирование SOS и RAF-1 <i>(неверный вариант)</i><br><span class="expl">Фосфорилирование уже существующих SOS и RAF-1 не требует синтеза белка и сохраняется.</span></li><li><b>Б.</b> Обе петли сразу <i>(неверный вариант)</i><br><span class="expl">Циклогексимид не мешает фосфорилированию имеющихся белков; выключается только индуцируемый синтез DUSP и SPRY.</span></li><li><b>В.</b> Медленная: синтез DUSP и SPRY <i>(верный вариант)</i><br><span class="expl">Медленной петле нужны транскрипция и трансляция DUSP и SPRY; без синтеза белка она не работает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.molcel.2004.11.055">Dougherty MK et al. 2005. Regulation of Raf-1 by direct feedback phosphorylation. Mol Cell</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10605237/">Martin-Vega A et al. 2023. Navigating the ERK1/2 MAPK Cascade. Biomolecules</a></li><li><a href="https://doi.org/10.1038/s41580-020-0255-7">Lavoie H et al. 2020. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol</a></li></ul><p>Механизмы — Dougherty и соавт. (2005), Martín-Vega и Cobb (2023), Lavoie и соавт. (2020). Кривые — учебная модель практикума (вопрос 3п): фибробласты, EGF остаётся в среде, относительные величины.</p></details></article><article class="card print-unit" id="ns-rebound"><div class="eyebrow">Обратные связи · шаг 15 из 26</div><h2>Почему ингибитор RAF в меланоме подавляет ERK ненадолго</h2><p class="lead">Вемурафениб в клетках меланомы с BRAF V600E быстро подавляет ERK, но одновременно снимает ERK-зависимую отрицательную обратную связь. Через часы растёт RAS-GTP, образуются устойчивые к препарату RAF-димеры, и pERK частично восстанавливается.</p><ol class="mech"><li>Мономер <a href="#ns-g-S4-T38">BRAF V600E</a> активен без RAS; высокий pERK постоянно индуцирует DUSP и SPRY, которые поддерживают низкое содержание RAS-GTP.</li><li><a href="#ns-g-S4-T39">Вемурафениб</a> подавляет мономер, pERK падает; без ERK DUSP и SPRY за часы исчезают, и вход от рецепторов растормаживается.</li><li>RAS-GTP растёт, образуются <a href="#ns-g-S4-T40">RAF-димеры</a>, на которые препарат действует слабо, и pERK устанавливается на новом уровне.</li></ol><p>В клетках меланомы с BRAF V600E мутантная киназа активна в виде мономера и не зависит от RAS. pERK постоянно высокий, поэтому ERK-зависимые ингибиторы каскада — DUSP6, SPRY2 и SPRY4 — синтезируются непрерывно, а RAS-GTP низкий. Опухоль сама поддерживает сильную отрицательную обратную связь на верхнюю часть каскада.</p><p>Lito и соавт. (2012) добавляли вемурафениб к таким клеткам. pMEK и pERK были максимально подавлены за 1–2 ч. Но без активной ERK DUSP6 и SPRY за 4–8 ч исчезали, ингибирующее фосфорилирование RAF-1 (CRAF) исчезало, а клетки вновь начинали отвечать на лиганды рецепторов — EGF, нейрегулин, HGF. RAS-GTP рос начиная с 4–8 ч и к 24 ч выходил на новый уровень.</p><p>При росте RAS-GTP образуются RAF-димеры с участием RAF-1. Вемурафениб действует на них слабо, поэтому pERK частично восстанавливался и держался на новом уровне, выше достигнутого минимума. Отскок зависел от RAS, SOS1 и RAF-1 и подавлялся ингибитором MEK. Сочетание ингибитора RAF с ингибитором MEK углубляло подавление ERK и усиливало противоопухолевый эффект в моделях на мышах.</p><p>Общий вывод: подавление одного узла не устраняет петлю, а смещает равновесие всей сети. Выбор схемы лечения — решение онколога; пример иллюстрирует системный принцип.</p><div class="note trap"><strong>Типичная ошибка</strong> Если ингибитор хорошо подавляет ERK в первый час, подавление сохранится и дальше.<p class="trap-fix">Ранний эффект снимает ERK-зависимую обратную связь. Через часы растёт RAS-GTP, образуются устойчивые к препарату RAF-димеры, и pERK частично восстанавливается.</p></div><div class="static-quiz"><h3>Меланома BRAF V600E, вемурафениб в среде. Почему через 24 ч pERK выше, чем через 1 ч?</h3><ol><li><b>А.</b> Препарат разрушился в среде <i>(неверный вариант)</i><br><span class="expl">Восстановление идёт и при сохранённом препарате: меняется не препарат, а сеть — растёт RAS-GTP и образуются RAF-димеры.</span></li><li><b>Б.</b> Снята обратная связь: растёт RAS-GTP, образуются RAF-димеры <i>(верный вариант)</i><br><span class="expl">Без ERK исчезают DUSP и SPRY, вход от рецепторов растормаживается, а RAF-димеры слабо чувствительны к вемурафенибу.</span></li><li><b>В.</b> Мономер BRAF V600E стал устойчив к препарату <i>(неверный вариант)</i><br><span class="expl">Мономер по-прежнему подавлен; сигнал восстанавливается обходным путём через RAS и RAF-димеры.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3713778/">Lito P et al. 2012. Relief of profound feedback inhibition of mitogenic signaling by RAF inhibitors attenuates their activity in BRAFV600E melanomas. Cancer Cell</a></li></ul><p>Клетки меланомы с BRAF V600E, вемурафениб и PLX4720 (Lito 2012, полный текст): минимум pMEK/pERK за 1–2 ч, рост RAS-GTP с 4–8 ч, новый уровень к ~24 ч. Кривые — учебная модель практикума (вопрос 3п), среда с сывороткой, относительные величины.</p></details></article><article class="card print-unit" id="ns-bistability"><div class="eyebrow">Обратные связи · шаг 16 из 26</div><h2>Как положительная обратная связь создаёт переключатель</h2><p class="lead">Одна положительная петля ещё не создаёт переключатель: для этого необходима также достаточная нелинейность. Тогда при одном и том же стимуле возможны два устойчивых состояния — система бистабильна.</p><ol class="mech"><li>В ооците Xenopus прогестерон запускает синтез Mos; Mos активирует MEK1, MEK1 — MAPK (ортолог ERK2).</li><li>Активная MAPK стабилизирует Mos и усиливает его синтез — положительная петля.</li><li>Петля вместе с крутизной каскада даёт <a href="#ns-g-S4-T34">бистабильность</a>: отдельный ооцит отвечает «всё или ничего».</li></ol><p>Положительная обратная связь ускоряет нарастание ответа: чем больше выход, тем сильнее он усиливает свой вход. Если зависимость пологая, сигнал просто растёт быстрее. Но если петля сочетается с крутой, нелинейной зависимостью, например со сверхчувствительностью каскада, у системы появляются два устойчивых состояния — низкое и высокое — и неустойчивое между ними.</p><p>Классический пример — созревание ооцитов шпорцевой лягушки. Ferrell и Machleder (1998) измеряли активность MAPK в отдельных ооцитах при разных концентрациях прогестерона. В каждом ооците MAPK была либо почти неактивна, либо полностью активна; эффективный коэффициент Хилла одноклеточного ответа составил не менее 35, тогда как в экстрактах коэффициент Хилла каскада составлял 4–5. В ооцитах с циклогексимидом, где Mos не синтезируется, MAPK активировали введённым белком Mos, и ответ отдельного ооцита становился постепенным (Ferrell 1999).</p><p>Xiong и Ferrell (2003) показали память переключателя: временный стимул вызывал устойчивый ответ, сохранявшийся после удаления прогестерона, а при блокаде положительной связи ответ становился временным.</p><p>На схеме — учебная модель главы 4: выход A способствует собственному образованию через нелинейный член и распадается с постоянной скоростью. Повышайте и снижайте стимул при разной силе петли и сравните пути. В этой модели после удаления члена положительной связи остаётся один устойчивый ответ. Это свойство выбранной модели: в каскаде MAPK бистабильность может возникать и без нарисованной внешней петли — из многосайтового фосфорилирования при насыщении и конкуренции форм субстрата (Markevich 2004).</p><div class="note trap"><strong>Типичная ошибка</strong> Крутой ответ отдельной клетки сам по себе доказывает бистабильность.<p class="trap-fix">Крутой ответ доказывает сверхчувствительность. Для бистабильности нужно показать два устойчивых состояния при одном стимуле: зависимость от предыстории и гистерезис.</p></div><div class="static-quiz"><h3>Что необходимо, чтобы система с положительной обратной связью стала бистабильной?</h3><ol><li><b>А.</b> Достаточно одной положительной петли <i>(неверный вариант)</i><br><span class="expl">Петля с пологой зависимостью только ускоряет нарастание ответа; переключателя не возникает.</span></li><li><b>Б.</b> Положительная петля вместе с достаточной нелинейностью <i>(верный вариант)</i><br><span class="expl">Только сочетание петли и крутой зависимости даёт два устойчивых состояния при одном стимуле.</span></li><li><b>В.</b> Сильная отрицательная обратная связь <i>(неверный вариант)</i><br><span class="expl">Отрицательная связь стабилизирует единственное состояние или даёт колебания, но не создаёт двух устойчивых состояний.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.280.5365.895">Ferrell JE et al. 1998. The biochemical basis of an all-or-none cell fate switch in Xenopus oocytes. Science</a></li><li><a href="https://doi.org/10.1002/(SICI)1521-1878(199910)21:10&lt;866::AID-BIES9&gt;3.0.CO;2-1">Ferrell JE 1999. Building a cellular switch: more lessons from a good egg. Bioessays</a></li><li><a href="https://doi.org/10.1038/nature02089">Xiong W et al. 2003. A positive-feedback-based bistable &#x27;memory module&#x27; that governs a cell fate decision. Nature</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC38339/">Huang CY et al. 1996. Ultrasensitivity in the mitogen-activated protein kinase cascade. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2172246/">Markevich NI et al. 2004. Signaling switches and bistability arising from multisite phosphorylation in protein kinase cascades. J Cell Biol</a></li></ul><p>Ооциты Xenopus laevis: nH ≥ 35 (Ferrell и Machleder 1998, аннотация; в обзоре Ferrell 1999 — ≥ 42; там же — опыт с циклогексимидом и введённым белком Mos), память ответа (Xiong и Ferrell 2003, аннотация и подписи к рисункам). Схема — учебная модель главы 4 (врезка 4.13): dA/dt = s + k₁·A⁴/(K⁴ + A⁴) − A, параметры условные.</p></details></article><article class="card print-unit" id="ns-hysteresis"><div class="eyebrow">Обратные связи · шаг 17 из 26</div><h2>Как доказать бистабильность и чем гистерезис отличается от необратимости</h2><p class="lead">Бистабильность доказывают тремя наблюдениями: бимодальным распределением ответов, зависимостью от предыстории и гистерезисом. Гистерезис — разные пороги включения и выключения; он не означает, что обратный переход невозможен.</p><ol class="mech"><li><a href="#ns-g-S4-T37">Бимодальное распределение</a>: при одном промежуточном стимуле клетки распределяются по двум крайним состояниям, а не на промежуточных уровнях.</li><li>Зависимость от предыстории: клетка, получившая промежуточный стимул после более высокого, находится в другом состоянии, чем клетка, получившая его после более низкого.</li><li><a href="#ns-g-S4-T35">Гистерезис</a>: выключение происходит при более низком стимуле, чем включение; <a href="#ns-g-S4-T36">необратимость</a> означает, что возврат невозможен при любом стимуле.</li></ol><p>По плавной кривой «доза — ответ» в популяции нельзя судить о том, как отвечает отдельная клетка. У ооцитов Xenopus среднее по лизату росло плавно, а каждый ооцит был либо в низком, либо в высоком состоянии: промежуточное среднее складывалось из смеси двух групп с разной чувствительностью. Это первое наблюдение — бимодальность.</p><p>Бимодальность ещё не доказывает бистабильность: её может дать и крутой ответ при разной чувствительности клеток. Нужно второе наблюдение — зависимость от предыстории: при одном и том же стимуле клетка, ранее приведённая в высокое состояние, остаётся в нём, а клетка, получившая стимул «с нуля», остаётся в низком состоянии. Третье — гистерезис: при снижении стимула клетка выключается при более низком значении, чем включилась.</p><p>Гистерезис не тождествен необратимости. При слабой петле обратный переход возможен — он лишь требует более низкого входа. Необратимость означает, что возврата нет при любом снижении стимула; в модели так ведёт себя сильная петля. В клетке необратимость созревания ооцита обеспечивают и нижележащие события клеточного цикла, которые нужно проверять отдельно.</p><p>Во многих процессах с двумя исходами — делении, апоптозе, дифференцировке — бистабильность препятствует установлению промежуточных состояний и делает выбранное состояние устойчивым к кратковременным колебаниям стимула.</p><div class="note trap"><strong>Типичная ошибка</strong> Гистерезис означает, что после переключения система уже никогда не вернётся назад.<p class="trap-fix">При гистерезисе обратный переход возможен, но при более низком стимуле, чем прямой. Необратимость — особый случай, её нужно проверять отдельно.</p></div><div class="static-quiz"><h3>При промежуточном стимуле в популяции одни клетки полностью активны, другие нет. Что ещё нужно показать, чтобы говорить о бистабильности?</h3><ol><li><b>А.</b> Ничего: бимодальность уже доказывает бистабильность <i>(неверный вариант)</i><br><span class="expl">Бимодальность возможна и при крутом ответе клеток с разной чувствительностью; нужны зависимость от предыстории и гистерезис.</span></li><li><b>Б.</b> Что ответ необратим при любом снижении стимула <i>(неверный вариант)</i><br><span class="expl">Необратимость не обязательна: бистабильная система может вернуться при более низком стимуле.</span></li><li><b>В.</b> Зависимость от предыстории и гистерезис при снижении стимула <i>(верный вариант)</i><br><span class="expl">Эти два наблюдения вместе с бимодальностью показывают два устойчивых состояния при одном стимуле.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.280.5365.895">Ferrell JE et al. 1998. The biochemical basis of an all-or-none cell fate switch in Xenopus oocytes. Science</a></li><li><a href="https://doi.org/10.1038/nature02089">Xiong W et al. 2003. A positive-feedback-based bistable &#x27;memory module&#x27; that governs a cell fate decision. Nature</a></li></ul><p>Признаки бистабильности и пример ооцита — Ferrell и Machleder (1998), Xiong и Ferrell (2003), глава 4 пособия (§4.13). Таблица — схема наблюдений, не данные опыта.</p></details></article><article class="card print-unit" id="ns-adaptation"><div class="eyebrow">Обратные связи · шаг 18 из 26</div><h2>Чем различаются точная адаптация, десенситизация и возбудимость</h2><p class="lead">При постоянном входе система может вернуться к исходному выходу, снизить чувствительность входа или дать один всплеск. Это разные режимы, и их обеспечивают разные схемы обратных связей.</p><ol class="mech"><li><a href="#ns-g-S4-T41">Точная адаптация</a>: выход возвращается к исходному уровню при сохраняющемся входе; в хемотаксисе E. coli её обеспечивает метилирование хеморецепторов.</li><li><a href="#ns-g-S4-T42">Десенситизация</a> рецептора: GRK фосфорилирует рецептор, β-аррестин блокирует взаимодействие рецептора с G-белком, и чувствительность входа снижается.</li><li><a href="#ns-g-S4-T43">Возбудимость</a>: надпороговый стимул вызывает один всплеск с возвратом к покою; при автоколебаниях система при постоянных условиях повторяет циклы без периодического внешнего воздействия.</li></ol><p>Слово «адаптация» в разговорной речи означает любое ослабление ответа. В теории сетей точная адаптация — возврат выхода к прежнему уровню при том, что вход остаётся повышенным. Классический пример — хемотаксис кишечной палочки. Аттрактант подавляет киназу CheA, частота кувырканий падает, и бактерия плывёт дальше; затем метилтрансфераза CheR и метилэстераза CheB, активируемая CheA, меняют метилирование рецепторов и возвращают активность CheA к прежнему уровню.</p><p>Barkai и Leibler (1997) показали в модели, а Alon и соавт. (1999) в опыте, что точность такого возврата определяется устройством интегральной обратной связи и сохраняется при изменении концентраций белков сети; меняется скорость адаптации, но не её точность.</p><p>Десенситизация рецептора, сопряжённого с G-белком, — другой механизм: при длительной стимуляции тот же рецептор передаёт сигнал хуже. Снижается чувствительность входа, а возврат выхода целой сети к исходному уровню не гарантирован. Примером служит снижение действия β2-агонистов при частом применении.</p><p>Возбудимая система имеет одно устойчивое состояние покоя: надпороговый стимул вызывает один всплеск, после которого система сама возвращается к покою. В режиме автоколебаний при постоянных условиях (в том числе при постоянном стимуле) система повторяет циклы без периодического внешнего воздействия, а её стационарное состояние неустойчиво. Один пик после стимула не позволяет различить эти режимы: нужна длительная регистрация отдельных клеток.</p><div class="note trap"><strong>Типичная ошибка</strong> Точная адаптация и десенситизация рецептора — одно и то же: ответ ослабевает при постоянном стимуле.<p class="trap-fix">Десенситизация снижает чувствительность одного рецептора. Точная адаптация возвращает выход всей сети к исходному уровню при сохраняющемся входе; её обеспечивает интегральная обратная связь.</p></div><div class="static-quiz"><h3>Аттрактант остаётся в среде, а частота кувырканий E. coli вернулась к исходной. Как называется такое поведение?</h3><ol><li><b>А.</b> Точная адаптация <i>(верный вариант)</i><br><span class="expl">Выход сети вернулся к прежнему уровню при сохраняющемся входе: баланс метилирования рецепторов (CheR) и деметилирования (CheB) компенсирует действие аттрактанта.</span></li><li><b>Б.</b> Десенситизация одного рецептора <i>(неверный вариант)</i><br><span class="expl">Десенситизация снижает чувствительность входа и не гарантирует возврата выхода к исходному уровню.</span></li><li><b>В.</b> Возбудимость: один всплеск ответа <i>(неверный вариант)</i><br><span class="expl">Возбудимость описывает всплеск после надпорогового стимула, а здесь речь о возврате выхода при постоянном входе.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-4.h
