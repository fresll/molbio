я к вопросу {n} практикума.","practice_back":"Открыть сценарии вопроса {n} →","practice_row_all":"Исследование использует материал всех четырёх вопросов практикума.","practice_back_short":"Вопрос {n} →","lv0":"нет","lv1":"низкий уровень","lv2":"средний уровень","lv3":"высокий уровень","lvx":"не определяется","chart_generic":"График","chart_levels":"Качественные уровни","seminar_title":"Интеграция сигналов о ресурсном состоянии: mTORC1, AMPK и лизосомная переработка","stats":[["4 механизма","от сигнала к измеряемому результату"],["Объяснения","с вопросами для самопроверки"],["35 сценариев","в отдельном практикуме"]],"num_fmt":"7.{n}","back_to_seminar":"← Вернуться к семинару","all_seminars":"← Раздел II: семинары","ns_scheme":"Что показывает схема.","oq_eyebrow":"Подготовка к коллоквиуму","oq_h":"Четыре открытых вопроса","oq_lead":"Ответьте устно или письменно, не глядя в объяснения, затем сверьтесь с критериями ответа.","oq_crit":"Что должно быть в ответе"},"sections":[{"title":"mTORC1 и сигналы","entry":"mtorc1","sub":"Как аминокислотный и ростовой сигналы действуют на разные звенья"},{"title":"AMPK и энергетическое состояние","entry":"adenylates","sub":"Как нуклеотиды и другие сигналы меняют регуляцию метаболизма"},{"title":"ACC, малонил-CoA и CPT1","entry":"acc","sub":"Как регулируются синтез и окисление жирных кислот"},{"title":"Аутофагия и лизосомы","entry":"autophagy","sub":"Как доставляется, расщепляется и повторно используется материал"},{"title":"Исследование","entry":"methods","sub":"Как проверить связь между сигналом, реакцией и потоком","integr":true}],"lessons":[{"id":"mtorc1","number":1,"section":0,"title":"Что регулирует комплекс mTORC1","question":1,"questions":[1],"keywords":["mTORC1","mTORC2","RAPTOR","S6K1","4E-BP1","ULK1","TFEB","Что регулирует комплекс mTORC1"],"lead":["mTORC1 — белковый комплекс с киназной активностью, который связывает сигналы о доступности аминокислот с регуляцией клеточного метаболизма.","Его действие оценивают по конкретным субстратам, а не по одному общему признаку «клетка растёт»."],"mechanism":["Киназа mTOR входит в состав комплекса [[T01|mTORC1]] вместе с [[T03|RAPTOR]] и другими белками.","mTORC1 фосфорилирует субстраты, влияющие на синтез белка и на аутофагический аппарат.","Разные субстраты могут по-разному отвечать на одно воздействие."],"paragraphs":["[[T32|Фосфорилирование]] — присоединение фосфорильной группы к молекуле. Для белков эту реакцию катализируют киназы: фермент переносит концевую фосфорильную группу ATP на остаток серина, треонина или тирозина белка-субстрата. mTOR — серин/треониновая киназа. Сама по себе молекула mTOR ещё не определяет, какие субстраты будут фосфорилированы: фермент входит в состав двух разных белковых комплексов, и их свойства задаются также белками-партнёрами. Поэтому в объяснениях различают mTOR — название фермента — и mTORC1 — название комплекса, в котором mTOR связан с белком RAPTOR и другими субъединицами.","RAPTOR — регуляторный белок комплекса mTORC1. Он связывает субстраты и участвует во взаимодействии комплекса с белками лизосомной мембраны. Среди субстратов mTORC1 в семинаре рассматриваются четыре. [[T04|S6K1]] — киназа рибосомного белка S6; фосфорилирование S6K1 по T389 комплексом mTORC1 необходимо для её активации, а активная S6K1 стимулирует синтез белка. [[T05|4E-BP1]] — белок, который связывается с фактором инициации трансляции eIF4E (белком, связывающим кэп-структуру на 5′-конце мРНК) и препятствует инициации трансляции. [[T06|ULK1]] — киназа, участвующая в начале образования аутофагосомы — двухмембранного пузырька, который доставляет участок цитоплазмы в лизосому. [[T07|TFEB]] — транскрипционный фактор, который в ядре активирует экспрессию генов лизосомных белков и белков аутофагии.","Последствия фосфорилирования у этих белков разные. Фосфорилированная S6K1 активна. Фосфорилирование 4E-BP1 ослабляет его связывание с eIF4E, и eIF4E становится доступен для инициации трансляции: здесь модификация снимает торможение. Фосфорилирование ULK1 по S758 (у человека; у мыши этот участок имеет номер S757) ограничивает участие ULK1 в начале аутофагии. Фосфорилированный TFEB связывается с белками 14-3-3, которые связывают определённые фосфорилированные участки других белков, и удерживается в цитоплазме, поэтому экспрессия его генов-мишеней снижается. Как TFEB, который при голодании преимущественно находится в ядре, вновь оказывается доступен лизосомному mTORC1, объяснено в шаге 6. Один и тот же комплекс стимулирует одни процессы и подавляет другие, поэтому для каждого субстрата нужен свой показатель: фосфорилирование определённого участка, связывание с партнёром или локализация.","Второй комплекс, [[T02|mTORC2]], содержит вместо RAPTOR белок RICTOR и фосфорилирует другие субстраты, в частности киназу AKT. Основной материал семинара посвящён mTORC1; сравнительная схема mTORC2 помогает различить состав и субстраты двух комплексов. Значение регуляции mTORC1 видно на примере туберозного склероза. Это наследственное заболевание связано с мутациями генов TSC1 или TSC2, которые кодируют белки комплекса TSC; в норме этот комплекс ограничивает активность mTORC1 через малую ГТФазу RHEB (её действие разобрано в шаге о ростовом сигнале). При утрате функции TSC активность mTORC1 повышена и меньше зависит от ростовых сигналов; с этим связывают образование доброкачественных опухолей (гамартом) в разных органах."],"trap":["Фосфорилирование всегда активирует любой белок.","Эффект зависит от белка и модифицируемого участка. Например, фосфорилирование 4E-BP1 может ослаблять его связывание с eIF4E, тогда как фосфорилирование TFEB способствует удержанию фактора вне ядра."],"conditions":"Основная схема относится к клеткам млекопитающих. Состав и функции представлены качественно; это не результат коиммунопреципитации в новом эксперименте.","sources":["Goul2023","Cui2025"],"quiz":{"id":"S7-L01","question":"В препарате обнаружен белок mTOR. Какое дополнительное наблюдение позволит отнести его к комплексу mTORC1?","options":[{"i ","at":"b","al":"start"}},"m":[["Субстрат","ULK1"],["Участок","S758 человека, S757 мыши"],["Действие","участие в начале аутофагии ограничено"]],"note":"Фосфорилирование ULK1 по S758 (у человека) ограничивает участие ULK1 в начале аутофагии. Активный mTORC1 тормозит этот этап."},"0-3":{"b":{"tfeb":{"t":"S211 (человек) · удержание в цитоплазме","at":"b","al":"end"}},"m":[["Субстрат","TFEB"],["Участок","S211 человека"],["Действие","связывание с 14-3-3, удержание вне ядра"]],"note":"Фосфорилированный TFEB связывается с 14-3-3 и удерживается в цитоплазме; экспрессия генов лизосомных белков снижается."},"1-0":{"t":{"partner":"RICTOR"},"tn":{"mtor":"mTOR\n+ RICTOR"},"n":{"s6k":"hide","ebp":"hide","ulk":"hide","tfeb":"hide","d1":"hide","d2":"hide","d3":"hide","d4":"hide","akt":"on","d5":"on"},"e":{"g1":"on","g2":"on"},"b":{"akt":{"t":"S473 · участие в активации AKT","at":"b","al":"start"}},"m":[["Комплекс","mTORC2"],["Партнёр mTOR","RICTOR"],["Пример субстрата","AKT (S473)"]],"note":"В mTORC2 киназа mTOR связана с RICTOR, а не с RAPTOR. mTORC2 фосфорилирует AKT по S473; субстраты mTORC1 из этого семинара на схеме mTORC2 не показаны."},"1-1":{"t":{"partner":"RICTOR"},"tn":{"mtor":"mTOR\n+ RICTOR"},"n":{"s6k":"hide","ebp":"hide","ulk":"hide","tfeb":"hide","d1":"hide","d2":"hide","d3":"hide","d4":"hide","akt":"on","d5":"on"},"e":{"g1":"on","g2":"on"},"b":{"akt":{"t":"S473 · участие в активации AKT","at":"b","al":"start"}},"m":[["Комплекс","mTORC2"],["Партнёр mTOR","RICTOR"],["Пример субстрата","AKT (S473)"]],"note":"В mTORC2 киназа mTOR связана с RICTOR, а не с RAPTOR. mTORC2 фосфорилирует AKT по S473; субстраты mTORC1 из этого семинара на схеме mTORC2 не показаны."},"1-2":{"t":{"partner":"RICTOR"},"tn":{"mtor":"mTOR\n+ RICTOR"},"n":{"s6k":"hide","ebp":"hide","ulk":"hide","tfeb":"hide","d1":"hide","d2":"hide","d3":"hide","d4":"hide","akt":"on","d5":"on"},"e":{"g1":"on","g2":"on"},"b":{"akt":{"t":"S473 · участие в активации AKT","at":"b","al":"start"}},"m":[["Комплекс","mTORC2"],["Партнёр mTOR","RICTOR"],["Пример субстрата","AKT (S473)"]],"note":"В mTORC2 киназа mTOR связана с RICTOR, а не с RAPTOR. mTORC2 фосфорилирует AKT по S473; субстраты mTORC1 из этого семинара на схеме mTORC2 не показаны."},"1-3":{"t":{"partner":"RICTOR"},"tn":{"mtor":"mTOR\n+ RICTOR"},"n":{"s6k":"hide","ebp":"hide","ulk":"hide","tfeb":"hide","d1":"hide","d2":"hide","d3":"hide","d4":"hide","akt":"on","d5":"on"},"e":{"g1":"on","g2":"on"},"b":{"akt":{"t":"S473 · участие в активации AKT","at":"b","al":"start"}},"m":[["Комплекс","mTORC2"],["Партнёр mTOR","RICTOR"],["Пример субстрата","AKT (S473)"]],"note":"В mTORC2 киназа mTOR связана с RICTOR, а не с RAPTOR. mTORC2 фосфорилирует AKT по S473; субстраты mTORC1 из этого семинара на схеме mTORC2 не показаны."}},"static":["Слева показан комплекс mTORC1 (киназа mTOR и RAPTOR), справа — четыре его субстрата и процессы, на которые влияет их фосфорилирование: S6K1 (T389, активация, синтез белка), 4E-BP1 (связывание с eIF4E ослаблено), ULK1 (S758 у человека, начало аутофагии ограничено), TFEB (S211 у человека, удержание в цитоплазме). Переключатель показывает отдельно комплекс mTORC2 (mTOR и RICTOR) и его субстрат AKT."]}}},{"id":"rag","number":2,"section":0,"title":"Как аминокислотный сигнал меняет положение mTORC1","question":1,"questions":[1],"keywords":["Rag","Ragulator","GATOR1","FLCN","GAP","Как аминокислотный сигнал меняет положение mTORC1"],"lead":["Аминокислотный сигнал регулирует связывание mTORC1 с Rag-ГТФазами на цитозольной поверхности лизосомы.","Перемещение к лизосоме и фосфорилирование субстрата — разные события."],"mechanism":["[[T09|Ragulator]] удерживает Rag-гетеродимер на лизосомной мембране.","Сочетание RagA/B–GTP и RagC/D–GDP способствует связыванию RAPTOR.","Связывание привлекает mTORC1 к мембране и создаёт условия для дальнейшей активации."],"paragraphs":["У лизосомы две стороны: цитозольная поверхность мембраны и просвет. Белки, регулирующие mTORC1, собираются на цитозольной поверхности; сам mTORC1 находится на цитозольной стороне мембраны и в просвет лизосомы не переходит. [[T08|Rag-ГТФазы]] — малые ГТФазы, которые образуют гетеродимер: RagA или RagB соединена с RagC или RagD. ГТФазой называют белок, который связывает GTP или GDP; в этих двух формах белок взаимодействует с разными партнёрами, а гидролиз связанного GTP переводит его из одной формы в другую.","Гетеродимер Rag удерживается на мембране комплексом Ragulator. Ragulator — белковый комплекс, закреплённый на цитозольной поверхности лизосомы; на нём собираются сигнальные белки. Когда аминокислот достаточно, RagA/B связана с GTP, а RagC/D — с GDP. В такой асимметричной конфигурации гетеродимер связывается с RAPTOR, и mTORC1 привлекается к лизосомной мембране. При противоположной конфигурации (RagA/B–GDP и RagC/D–GTP) RAPTOR связывается слабо, и mTORC1 остаётся в цитозоле.","Нуклеотидное состояние двух половин гетеродимера регулируют разные белки. [[T11|GAP]] (белок, ускоряющий гидролиз GTP) переводит ГТФазу в GDP-форму. Комплекс [[T10|GATOR1]] — GAP для RagA/B: он ускоряет гидролиз GTP у RagA/B и тем самым ослабляет аминокислотный сигнал. При достаточном содержании аминокислот действие GATOR1 ограничено; как это происходит, разобрано в следующем шаге. [[T12|FLCN]] в комплексе с белком FNIP — GAP для RagC/D: переводя RagC/D в GDP-форму, он создаёт вторую половину активной конфигурации. Поэтому нельзя сказать, что для активного состояния обе Rag должны связать GTP. Присутствие FLCN–FNIP на лизосоме не равнозначно его GAP-активности: при недостатке аминокислот этот комплекс может входить в неактивный лизосомный комплекс с Rag и Ragulator (подробнее в шаге 6).","Схема показывает основной Rag-зависимый путь. Описаны и Rag-независимые пути регуляции mTORC1 аминокислотами; на схеме их нет. Привлечение mTORC1 к мембране и фосфорилирование субстрата — разные события, поэтому на схеме два отдельных показателя: положение mTORC1 и фосфорилирование S6K1. Для фосфорилирования S6K1 у лизосомы нужна ещё ГТФаза RHEB в GTP-форме. На этой схеме RHEB–GTP поддержан как постоянное условие, а его регуляция разобрана в следующих шагах."],"trap":["Rag-ГТФазы сами фосфорилируют S6K1.","Rag-белки регулируют привлечение mTORC1 и взаимодействия с субстратами. Фосфорильную группу переносит киназа mTOR, а не Rag."],"conditions":"Качественная модель основного Rag-зависимого пути в клетках млекопитающих; альтернативные аминокислотные пути не исключаются.","sources":["Goul2023","Cui2025","BarPeled2013","Fromm2020"],"quiz":{"id":"S7-L02","question":"Какое сочетание нуклеотидных состояний Rag в основной схеме способствует связыванию RAPTOR?","options":[{"id":"S7-L02-3","text":"RagA/B и RagC/D одновременно связаны с GTP.","correct":false,"feedback":"Одинаковое состояние двух Rag не заменяет требуемой асимметричной конфигурации."},{"id":"S7-L02-1","text":"RagA/B связан с GTP, а RagC/D — с GDP.","correct":true,"feedback":"Для связывания RAPTOR важна асимметричная конфигурация гетеродимера RagA/B–GTP и RagC/D–GDP."},{"id":"S7-L02-2","text":"RagA/B связан с GDP, а RagC/D — с GTP.","correct":false,"feedback":"Это противоположная конфигурация, характерная для подавления основного аминокислотного пути."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Rag-гетеродимер и положение mTORC1","status":"Схема механизма · основной Rag-зависимый путь; RHEB–GTP поддержан","ctrls":[{"id":"r","type":"group","label":"Нуклеотидное состояние Rag","opts":["RagA/B–GTP и RagC/D–GDP","RagA/B–GDP и RagC/D–GTP"]}],"W":640,"H":320,"NW":340,"NH":470,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":244,"w":620,"h":66,"c":"lyso","t":"просвет лизосомы","lx":24,"ly":290,"n":[6,420,328,44,16,448]},{"x":10,"y":10,"w":620,"h":226,"c":"cyto","t":"цитозоль","lx":22,"ly":30,"n":[6,6,328,402,14,24]}],"mem":[{"x1":10,"y1":240,"x2":630,"y2":240,"t":"мембрана лизосомы","lx":470,"ly":262,"n":[6,414,334,414,200,460]}],"nodes":{"ragulator":{"p":[160,222,170,28],"n":[100,404,150,26],"t":"Ragulator","fs":14},"ragab":{"p":[110,178,96,44],"n":[52,368,88,44],"t":"RagA/B\nGTP","fs":14},"ragcd":{"p":[212,178,96,44],"n":[148,368,88,44],"t":"RagC/D\nGDP","fs":14},"gator1":{"p":[95,70,120,40],"n":[52,290,92,36],"t":"GATOR1"},"flcn":{"p":[245,70,130,40],"n":[150,290,96,36],"t":"FLCN–FNIP","fs":13},"mtorc1":{"p":[405,178,120,44],"n":[272,368,100,44],"t":"mTORC1"},"rheb":{"p":[555,178,120,40],"n":[160,200,104,36],"t":"RHEB–GTP","fs":14},"s6k":{"p":[555,70,110,40],"n":[278,280,88,38],"t":"S6K1"}},"edges":{"hold":{"a":"ragulator","b":"ragab","k":"bind","s":"hide"},"g1":{"a":"gator1","b":"ragab","k":"inh","t":"GAP","d":[-22,0],"dn":[-18,0]},"f1":{"a":"flcn","b":"ragcd","k":"act","t":"GAP → GDP","d":[34,0],"dn":[30,4]},"bind":{"a":"ragcd","b":"mtorc1","k":"bind","t":"связывание\nRAPTOR","d":[0,-18],"tn":""},"rh":{"a":"rheb","b":"mtorc1","k":"act","t":""},"p":{"a":"mtorc1","b":"s6k","k":"phos","bn":0}},"st":{"0":{"n":{"ragab":"on","ragcd":"on","gator1":"off","flcn":"on","mtorc1":"on","rheb":"on","s6k":"on"},"b":{"s6k":{"t":"T389","at":"l"}},"m":[["Активная конфигурация Rag","да"],["mTORC1 у лизосомы","да"],["p-S6K1 (RHEB–GTP поддержан)","высокое"]],"note":"RagA/B связана с GTP, RagC/D — с GDP. Гетеродимер связывает RAPTOR и привлекает mTORC1 к цитозольной поверхности лизосомы. При поддержанном RHEB–GTP mTORC1 фосфорилирует S6K1."},"1":{"t":{"ragab":"RagA/B\nGDP","ragcd":"RagC/D\nGTP"},"p":{"mtorc1":[405,70]},"pn":{"mtorc1":[272,120]},"n":{"ragab":"off","ragcd":"off","gator1":"on","flcn":"off","mtorc1":"base","rheb":"on","s6k":"off"},"e":{"bind":"hide","rh":"off","p":"off","f1":"off"},"m":[["Активная конфигурация Rag","нет"],["mTORC1 у лизосомы","нет (в цитозоле)"],["p-S6K1 (RHEB–GTP поддержан)","низкое"]],"note":"В обратной конфигурации RAPTOR связывается слабо, mTORC1 остаётся в цитозоле. RHEB–GTP по-прежнему поддержан, но mTORC1, не привлечённый к мембране, фосфорилирует S6K1 слабо."}},"fixed":"Постоянные условия схемы: энергия достаточна, RHEB–GTP поддержан, белки комплекса и S6K1 присутствуют.","static":["Цитозольная поверхность лизосомы: Ragulator удерживает гетеродимер RagA/B–RagC/D. GATOR1 ускоряет гидролиз GTP у RagA/B, FLCN–FNIP — у RagC/D. В конфигурации RagA/B–GTP и RagC/D–GDP гетеродимер связывает RAPTOR и mTORC1 находится у лизосомы; при поддержанном RHEB–GTP фосфорилируется S6K1. В обратной конфигурации mTORC1 остаётся в цитозоле, фосфорилирование S6K1 низкое."]}}},{"id":"growth","number":3,"section":0,"title":"Как ростовой сигнал действует через AKT, TSC и RHEB","question":1,"questions":[1],"keywords":["PI3K","PIP3","AKT","TSC","RHEB","GAP","Как ростовой сигнал действует через AKT, TSC и RHEB"],"lead":["Инсулиновый сигнал может усиливать фосфорилирование субстратов mTORC1 через регуляцию комплекса TSC и ГТФазы RHEB.","PI3K, AKT и RHEB выполняют разные молекулярные действия."],"mechanism":["[[T13|PI3K]] образует [[T14|PIP₃]] в плазматической мембране и способствует привлечению белков с соответствующими доменами.","[[T15|AKT]] фосфорилирует TSC2 и в рассматриваемом ростовом пути ослабляет действие комплекса [[T16|TSC]].","Снижение GAP-действия TSC способствует сохранению [[T17|RHEB]] в GTP-связанном состоянии."],"paragraphs":["Инсулиновый сигнал начинается на плазматической мембране. Инсулин связывается с рецептором — тирозинкиназой, которая после связывания гормона фосфорилирует собственные остатки тирозина и белки-адаптеры IRS (субстраты инсулинового рецептора; на схеме показан IRS1). С фосфорилированными остатками тирозина IRS1 связывается фосфатидилинозитол-3-киназа класса I (PI3K), и фермент оказывается рядом со своим субстратом в мембране.","PI3K фосфорилирует мембранный липид, а не белок: из фосфатидилинозитол-4,5-бисфосфата образуется фосфатидилинозитол-3,4,5-трисфосфат (PIP₃). С PIP₃ связываются белки, у которых есть PH-домен — участок, связывающий фосфоинозитиды, в том числе киназа AKT и киназа PDK1. PDK1 — киназа, которая фосфорилирует активационную петлю AKT (T308 у AKT1 человека); для полной активности AKT нужна и вторая модификация, по S473, которую вносит mTORC2. На схеме эта часть пути упрощена до последовательности «рецептор → IRS1 → PI3K → PIP₃ → AKT».","Активная AKT фосфорилирует TSC2 — белок туберин, компонент комплекса TSC. Кроме TSC2 в комплекс входят TSC1 (гамартин) и белок TBC1D7. TSC2 выполняет функцию GAP в отношении малой ГТФазы RHEB: ускоряет гидролиз связанного с RHEB GTP и переводит RHEB в GDP-форму. Фосфорилирование TSC2 киназой AKT ослабляет это действие комплекса. AKT, следовательно, действует на RHEB не прямо, а через TSC. Есть и вторая ветвь от AKT: AKT фосфорилирует белок PRAS40. Нефосфорилированный PRAS40 связывается с RAPTOR и мешает субстратам связываться с mTORC1; после фосфорилирования под действием AKT это торможение ослабевает (в культивируемых клетках; Sancak и соавт., 2007; Wang и соавт., 2007). Ветвь PRAS40 действует параллельно с TSC–RHEB и не заменяет её.","Когда GAP-действие TSC ослаблено, гидролиз GTP у RHEB замедляется и доля RHEB–GTP возрастает. RHEB–GTP взаимодействует с mTORC1 и стимулирует фосфорилирование S6K1 и других субстратов; на схеме это взаимодействие показано стрелкой, а не постоянным закреплением RHEB на лизосоме. RHEB связан с мембранами через липидную модификацию (фарнезильный остаток) и, по данным Angarola и Ferguson (2019), не накапливается преимущественно на лизосомах. Аминокислотный вход на этой схеме поддержан: без него mTORC1 не привлекается к лизосоме, и RHEB–GTP не обеспечивает фосфорилирования S6K1 (следующие шаги)."],"trap":["RHEB активируется потому, что AKT фосфорилирует его непосредственно.","В основном пути AKT регулирует TSC2; изменение состояния RHEB связано с ослаблением GAP-действия TSC."],"conditions":"Рассматривается ростовая ветвь в клетке млекопитающего при достаточном аминокислотном сигнале. Контакт RHEB с mTORC1 изображён условно; длительность и место контакта не измеряются.","sources":["Goul2023","Angarola2019","Cui2025","Sancak2007","Wang2007"],"quiz":{"id":"S7-L03","question":"В основной модели AKT ослабила GAP-действие комплекса TSC. Какое изменение RHEB этому соответствует?","options":[{"id":"S7-L03-2","text":"Ускоряется гидролиз GTP и возрастает доля RHEB–GDP.","correct":false,"feedback":"Этот результат ожидался бы при усилении GAP-действия, а не его ослаблении."},{"id":"S7-L03-3","text":"Нуклеотидное состояние RHEB не меняется: TSC регулирует только положение mTORC1.","correct":false,"feedback":"TSC выполняет GAP-действие на RHEB; его функцию нельзя свести только к положению mTORC1."},{"id":"S7-L03-1","text":"Замедляется гидролиз GTP и возрастает доля RHEB–GTP.","correct":true,"feedback":"Ослабление GAP-действия замедляет гидролиз GTP у RHEB и способствует GTP-связанной форме."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Инсулиновый сигнал: от рецептора к RHEB","status":"Схема механизма · ветвь упрощена; аминокислотный вход поддержан","ctrls":[{"id":"g","type":"check","label":"Инсулиновый сигнал есть","def":true}],"W":640,"H":330,"NW":340,"NH":560,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":10,"w":620,"h":64,"c":"pm","t":"плазматическая мембрана","lx":24,"ly":28,"n":[6,6,328,196,14,22]},{"x":20,"y":272,"w":300,"h":48,"c":"lyso","t":"лизосома","lx":32,"ly":304,"n":[6,500,230,50,14,534]}],"nodes":{"rec":{"p":[66,52,96,38],"n":[80,48,120,36],"t":"рецептор","fs":14},"irs":{"p":[184,52,80,38],"n":[250,48,90,36],"t":"IRS1","fs":14},"pi3k":{"p":[300,52,92,38],"n":[250,110,90,36],"t":"PI3K I","fs":14},"pip3":{"p":[425,52,100,38],"n":[250,170,90,36],"t":"PIP₃","fs":14},"akt":{"p":[560,52,96,38],"n":[80,170,96,36],"t":"AKT","fs":15},"tsc":{"p":[560,160,110,42],"n":[80,262,110,40],"t":"TSC\n(TSC2, TSC1)","fs":13},"rheb":{"p":[400,210,120,40],"n":[250,352,120,40],"t":"RHEB–GTP"},"mtorc1":{"p":[200,250,120,40],"n":[110,470,120,40],"t":"mTORC1"},"aa":{"p":[60,170,110,46],"n":[80,390,120,46],"t":"аминокислоты\n(через Rag)","fs":13},"s6k":{"p":[200,160,96,38],"n":[270,430,96,36],"t":"S6K1"}},"edges":{"e1":{"a":"rec","b":"irs","k":"phos","pm":0.5},"e2":{"a":"irs","b":"pi3k","k":"act","t":"","d":[0,-10]},"e3":{"a":"pi3k","b":"pip3","k":"rx","t":"PIP₂ → PIP₃","d":[0,-24],"dn":[52,4],"anc":"middle"},"e4":{"a":"pip3","b":"akt","k":"act","t":"","d":[0,-12]},"e5":{"a":"akt","b":"tsc","k":"inh","t":"P TSC2","d":[38,0],"dn":[44,0]},"e6":{"a":"tsc","b":"rheb","k":"inh","t":"GAP: гидролиз\nGTP у RHEB","d":[44,22],"dn":[58,-6]},"e7":{"a":"rheb","b":"mtorc1","k":"act","t":"контакт","d":[0,-10],"dn":[34,0]},"e8":{"a":"aa","b":"mtorc1","k":"act","t":"","d":[0,-8]},"e9":{"a":"mtorc1","b":"s6k","k":"phos"}},"st":{"1":{"n":{"rec":"on","irs":"on","pi3k":"on","pip3":"met","akt":"on","tsc":"off","rheb":"on","mtorc1":"on","aa":"on","s6k":"on"},"e":{"e6":"off"},"b":{"tsc":{"t":"TSC2 · GAP\nослаблено","at":"b","al":"end"},"s6k":{"t":"T389","at":"t","al":"start"}},"m":[["TSC (GAP-действие)","ослаблено"],["RHEB","преимущественно RHEB–GTP"],["p-S6K1","высокое"]],"note":"Инсулиновый сигнал: PI3K образует PIP₃, AKT фосфорилирует TSC2, GAP-действие TSC ослабевает, доля RHEB–GTP растёт. При поддержанном аминокислотном входе mTORC1 фосфорилирует S6K1."},"0":{"t":{"rheb":"RHEB–GDP"},"n":{"rec":"base","irs":"base","pi3k":"base","pip3":"off","akt":"off","tsc":"on","rheb":"off","mtorc1":"base","aa":"on","s6k":"off"},"e":{"e1":"off","e2":"off","e3":"off","e4":"off","e5":"off","e7":"off","e9":"off"},"m":[["TSC (GAP-действие)","действует"],["RHEB","преимущественно RHEB–GDP"],["p-S6K1","низкое"]],"note":"Без инсулинового сигнала PIP₃ почти не образуется, AKT не фосфорилирует TSC2. TSC ускоряет гидролиз GTP у RHEB, и RHEB находится преимущественно в GDP-форме. mTORC1 привлечён к лизосоме аминокислотным входом, но фосфорилирование S6K1 низкое."}},"fixed":"Постоянное условие: аминокислотный вход через Rag поддержан. Положение RHEB рядом с лизосомой — упрощение схемы.","static":["Цепь инсулинового сигнала: рецептор → IRS1 → PI3K (образует PIP₃ из PIP₂) → AKT. AKT фосфорилирует TSC2 и ослабляет GAP-действие комплекса TSC на RHEB, поэтому доля RHEB–GTP растёт и mTORC1 при поддержанном аминокислотном входе фосфорилирует S6K1. Без инсулинового сигнала TSC переводит RHEB в GDP-форму, фосфорилирование S6K1 низкое."]}}},{"id":"sensors","number":4,"section":0,"title":"Какие молекулы воспринимают лейцин, аргинин и SAM","question":1,"questions":[1],"keywords":["Sestrin2","CASTOR1","SAM","SAMTOR","GATOR1","GATOR2","SLC38A9","KICSTOR","Какие молекулы воспринимают лейцин, аргинин и SAM"],"lead":["Разные метаболиты связываются с разными сенсорными белками.","Сенсор, регулирующий Rag, нужно отличать от транспортёра в лизосомной мембране."],"mechanism":["Лейцин связывается с [[T18|Sestrin2]], а цитозольный аргинин — с [[T19|CASTOR1]].","[[T20|SAM]] взаимодействует с [[T21|SAMTOR]] и меняет его связь с GATOR1–[[T23|KICSTOR]].","[[T22|SLC38A9]] воспринимает лизосомный аргинин и участвует в выходе аминокислот из лизосомы."],"paragraphs":["Доступность разных аминокислот воспринимают разные белки-сенсоры. Каждый метаболит связывается со своим белком, и каждый из них действует на своё звено регуляторной цепи. Сенсором здесь называют белок, который связывает определённый метаболит и при этом меняет свои взаимодействия с регуляторными комплексами.","Лейцин в цитозоле связывается с Sestrin2, а аргинин в цитозоле — с CASTOR1. Без своего лиганда оба белка связываются с комплексом GATOR2 и подавляют его. GATOR2, в свою очередь, ограничивает действие GATOR1 — комплекса, который ускоряет гидролиз GTP у RagA/B. Поэтому при удалении лейцина Sestrin2 связывается с GATOR2, торможение GATOR1 ослабевает, RagA/B переходит в GDP-форму и mTORC1 перестаёт привлекаться к лизосоме. Связавшись с лейцином, Sestrin2 диссоциирует от GATOR2, и цепь действует в обратном направлении.","Что известно о действии сенсоров на GATOR2? Sestrin2 и CASTOR1 — белки, связывающие метаболит; ферментативной реакции с участием GATOR2 здесь нет. Без лиганда каждый из них присоединяется к своей поверхности GATOR2, и эти поверхности не перекрываются: GATOR2 образует каркас, в котором β-пропеллеры WD40 разных субъединиц связывают сенсоры и GATOR1, а CASTOR1 удерживается двумя β-пропеллерами MIOS, каждый из которых связывает одну из двух субъединиц димера CASTOR1 (Valenstein и соавт., 2025; Jansen и соавт., 2025). Связывание лейцина с Sestrin2 или аргинина с CASTOR1 изменяет конформацию сенсора: у CASTOR1, например, упорядочивается петля, которая закрывает поверхность контакта с GATOR2, и сенсор отделяется от комплекса. Пока сенсор связан с GATOR2, он ограничивает подвижность β-пропеллера WDR24 — домена, необходимого для зависимой от питательных веществ активации mTORC1. GATOR2 — регуляторный комплекс, а не киназа, и GATOR1 он не фосфорилирует. Структуры показывают связывание сенсоров и изменение подвижности GATOR2; как именно эти изменения затем меняют работу GATOR1 как GAP, в опубликованных работах описано не полностью.","S-аденозилметионин (SAM) — донор метильных групп, который образуется из метионина. SAM связывается с SAMTOR. Без SAM белок SAMTOR связывается с GATOR1 и KICSTOR — комплексом, который удерживает GATOR1 на лизосоме, — и тем самым усиливает торможение mTORC1. SAMTOR, следовательно, реагирует на SAM, а не непосредственно на метионин: метионин влияет на этот вход через образование SAM.","SLC38A9 устроен иначе. Это белок лизосомной мембраны, переносчик аминокислот. Он связывает аргинин со стороны просвета лизосомы и через Ragulator–Rag участвует в активации mTORC1. Кроме того, при связывании аргинина SLC38A9 переносит лейцин и другие незаменимые аминокислоты из просвета в цитозоль (Wyant и соавт., 2017). Перенос лейцина из лизосомы и связывание цитозольного лейцина с Sestrin2 — разные события: SLC38A9 не является цитозольным сенсором лейцина. Кроме того, цитозольный участок SLC38A9 участвует в перестройке лизосомного комплекса FLCN–FNIP–Rag–Ragulator при возвращении аминокислот (шаг 6). Чувствительность каждого входа зависит от клетки и условий, а список сенсоров на схеме не исчерпывающий."],"trap":["SLC38A9 — основной цитозольный сенсор лейцина.","В рассматриваемом механизме цитозольный лейцин связывается с Sestrin2; SLC38A9 расположен в лизосомной мембране и участвует в аргинин-зависимом транспорте."],"conditions":"Основная качественная схема выбранных сенсоров. Это не исчерпывающий перечень сенсоров каждой аминокислоты; чувствительность зависит от клетки и условий. Структурные данные 2025 г. описывают связывание сенсоров с GATOR2; передача изменений GATOR2 на GATOR1 описана не полностью.","sources":["Goul2023","Wolfson2016","Chantranupong2016","Gu2017","Wyant2017","Valenstein2025","Jansen2025","Fromm2020"],"quiz":{"id":"S7-L04","question":"Из среды в качественной модели удалили только лейцин. Другие входы поддержаны. Как меняется взаимодействие Sestrin2 с GATOR2?","options":[{"id":"S7-L04-1","text":"Sestrin2 связывается с GATOR2 и подавляет передачу этого сигнала.","correct":true,"feedback":"Без связанного лейцина Sestrin2 взаимодействует с GATOR2 и ограничивает лейцин-зависимый вход."},{"id":"S7-L04-2","text":"Sestrin2 отделяется от GATOR2 и усиливает передачу этого сигнала.","correct":false,"feedback":"Ослабление этого взаимодействия характерно для связывания лейцина, а не его удаления."},{"id":"S7-L04-3","text":"Связывание не меняется: в этой схеме Sestrin2 воспринимает только аргинин.","correct":false,"feedback":"В заданной ветви Sestrin2 связывает лейцин; цитозольный аргинин воспринимает CASTOR1."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Метаболит, сенсор и место его действия","status":"Схема механизма · выбранные сенсоры, качественные состояния","ctrls":[{"id":"m","type":"group","label":"Метаболит","opts":["лейцин","аргинин в цитозоле","SAM","аргинин в просвете лизосомы"]},{"id":"x","type":"group","label":"Содержание метаболита","opts":["достаточно","удалён"]}],"W":640,"H":380,"NW":340,"NH":484,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":262,"w":620,"h":110,"c":"lyso","t":"просвет лизосомы","lx":470,"ly":360,"n":[6,396,328,84,16,474]},{"x":10,"y":10,"w":620,"h":244,"c":"cyto","t":"цитозоль","lx":22,"ly":30,"n":[6,6,328,382,14,24]}],"mem":[{"x1":10,"y1":258,"x2":630,"y2":258,"n":[6,392,334,392]}],"nodes":{"lig":{"p":[80,80,110,40],"n":[70,60,110,40],"t":"лейцин"},"sens":{"p":[230,80,120,40],"n":[230,60,110,40],"t":"Sestrin2"},"g2":{"p":[400,80,110,40],"n":[230,150,110,40],"t":"GATOR2"},"g1":{"p":[400,180,110,40],"n":[230,240,110,40],"t":"GATOR1"},"kic":{"p":[230,180,120,40],"n":[70,240,110,40],"t":"KICSTOR"},"rag":{"p":[570,180,100,46],"n":[230,330,110,44],"t":"RagA/B","fs":14},"slc":{"p":[200,256,120,40],"n":[90,392,120,40],"t":"SLC38A9"},"argl":{"p":[80,300,110,34],"n":[90,432,120,30],"t":"аргинин","fs":14},"leul":{"p":[330,300,110,34],"n":[250,432,110,30],"t":"лейцин","fs":14},"leuc":{"p":[330,190,110,34],"n":[250,300,110,32],"t":"лейцин","fs":14}},"edges":{"b1":{"a":"li argl":"off","leul":"met","leuc":"base","rag":"base"},"e":{"b1":"hide","i1":"hide","i2":"hide","i3":"hide","a1":"off","t0":"off","t1":"off","a2":"off"},"p":{"slc":[270,258],"argl":[110,330],"leul":[380,335],"leuc":[270,120],"rag":[520,120]},"pn":{"slc":[170,392],"argl":[72,446],"leul":[270,446],"leuc":[80,270],"rag":[255,270]},"m":[["Белок","SLC38A9 (мембрана лизосомы)"],["Аргинин в просвете","отсутствует"],["Выход лейцина в цитозоль","снижен"]],"note":"Без аргинина в просвете SLC38A9 слабее переносит лейцин из лизосомы и не поддерживает этот вход к Rag. Цитозольные сенсоры на этом экране не показаны."}},"fixed":"На каждом экране показан один метаболит и его сенсор; остальные входы считаются неизменными. Перечень сенсоров не исчерпывающий.","static":["Четыре входа: лейцин связывается с Sestrin2, цитозольный аргинин — с CASTOR1; без лиганда эти белки подавляют GATOR2, и GATOR1 ускоряет гидролиз GTP у RagA/B. SAM связывается с SAMTOR; без SAM белок SAMTOR связывается с GATOR1–KICSTOR и усиливает торможение mTORC1. SLC38A9 в мембране лизосомы связывает аргинин со стороны просвета, переносит лейцин в цитозоль и через Ragulator–Rag участвует в активации mTORC1."]}}},{"id":"coincidence","number":5,"section":0,"title":"Почему привлечение mTORC1 и его активацию проверяют раздельно","question":1,"questions":[1],"keywords":["Rag","RHEB","S6K1","Колокализация","Почему привлечение mTORC1 и его активацию проверяют раздельно"],"lead":["В основной модели для фосфорилирования S6K1 нужны аминокислотный вход и разрешающее состояние RHEB.","Совпадение входов не означает, что все субстраты mTORC1 регулируются одинаково."],"mechanism":["Аминокислотный вход через [[T08|Rag]] способствует привлечению mTORC1 к мембране.","[[T17|RHEB]]–GTP и взаимодействия комплекса с мембраной поддерживают киназную активацию.","При недостаточности одного входа локализация и p-[[T04|S6K1]] могут изменяться по-разному."],"paragraphs":["Рассмотрим четыре сочетания двух входов при одинаковых прочих условиях: энергии достаточно, все белки комплекса и субстрат S6K1 присутствуют, сравнение проводится в один и тот же момент. Первый вход — аминокислотный: через Rag он определяет, привлечён ли mTORC1 к лизосомной мембране. Второй вход — ростовой: через AKT и TSC он определяет, находится ли RHEB преимущественно в GTP-форме.","Для каждого сочетания два показателя описываются отдельно. Когда работают оба входа, mTORC1 находится у лизосомы и фосфорилирует S6K1. Когда работает только аминокислотный вход, mTORC1 привлечён к лизосоме, но RHEB находится преимущественно в GDP-форме, и фосфорилирование S6K1 остаётся низким. Когда работает только ростовой вход, RHEB–GTP есть, но mTORC1 не привлечён к мембране, и фосфорилирование S6K1 тоже низкое. Без обоих входов оба показателя низкие. Слово «низкое» здесь означает существенно сниженный сигнал, а не обязательно нулевой во всех клетках.","Такая таблица описывает основную Rag-зависимую ветвь для S6K1. Её нельзя переносить на все генотипы и все субстраты. При утрате TSC RHEB–GTP сохраняется и без ростового сигнала; при утрате GATOR1 Rag-вход меньше зависит от аминокислот. Фосфорилирование TFEB, как показано в следующем шаге, по-другому зависит от RHEB. В схеме нет расчётной формулы: она показывает только, что одного входа недостаточно для высокого фосфорилирования S6K1.","Мембрана в этом механизме — не фон рисунка. Она сближает mTORC1, привлечённый Rag, и RHEB, связанный с мембраной липидной модификацией. В реконструированной системе Cui и соавт. (2025) роль мембраны и её белков в активации mTORC1 изучали на очищенных компонентах; такой эксперимент показывает возможность механизма, но не воспроизводит все условия клетки. В клеточном эксперименте локализацию и фосфорилирование измеряют разными методами (шаг о методах исследования mTORC1)."],"trap":["Если mTORC1 находится на лизосоме, S6K1 обязательно фосфорилирован.","Колокализация показывает положение комплекса; для вывода о действии на S6K1 нужен отдельный показатель его фосфорилирования."],"conditions":"Качественная модель Rag-зависимого фосфорилирования S6K1; энергия, белки комплекса и субстрат доступны. «Низко» не означает строго нулевой сигнал во всех реальных клетках.","sources":["Goul2023","Cui2025"],"quiz":{"id":"S7-L05","question":"В модели Rag привлекает mTORC1 к лизосоме, но RHEB сохраняется в GDP-форме. Какой результат ожидается для S6K1?","options":[{"id":"S7-L05-3","text":"Фосфорилирование S6K1 становится высоким вследствие действия RHEB–GDP.","correct":false,"feedback":"GDP-связанная форма RHEB не выполняет в этой схеме действие RHEB–GTP."},{"id":"S7-L05-1","text":"Фосфорилирование S6K1 остаётся низким, несмотря на локализацию mTORC1.","correct":true,"feedback":"Одной локализации недостаточно: в заданной модели отсутствует необходимое действие RHEB–GTP."},{"id":"S7-L05-2","text":"Фосфорилирование S6K1 становится высоким только из-за локализации mTORC1.","correct":false,"feedback":"Положение комплекса не заменяет его киназную активацию."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Два входа: положение mTORC1 и фосфорилирование S6K1","status":"Качественная учебная модель · не данные эксперимента","ctrls":[{"id":"aa","type":"check","label":"Аминокислотный вход через Rag","def":true},{"id":"rh","type":"check","label":"RHEB–GTP (ростовой вход)","def":true}],"W":640,"H":300,"NW":340,"NH":380,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":10,"y":230,"w":620,"h":62,"c":"lyso","t":"лизосома","lx":24,"ly":272,"n":[6,312,328,62,16,352]}],"mem":[{"x1":10,"y1":226,"x2":630,"y2":226,"n":[6,308,334,308]}],"nodes":{"aa":{"p":[90,110,140,46],"n":[85,50,150,44],"t":"аминокислоты\n→ Rag","fs":14},"rheb":{"p":[330,110,130,42],"n":[255,50,140,42],"t":"RHEB–GTP"},"mtorc1":{"p":[200,200,120,42],"n":[130,286,120,40],"t":"mTORC1"},"s6k":{"p":[540,110,120,42],"n":[275,190,120,40],"t":"S6K1"}},"edges":{"e1":{"a":"aa","b":"mtorc1","k":"act","t":"привлечение","d":[-46,0],"dn":[-52,0]},"e2":{"a":"rheb","b":"mtorc1","k":"act","t":"активация","d":[40,6],"dn":[34,10]},"e3":{"a":"mtorc1","b":"s6k","k":"phos"}},"st":{"1-1":{"n":{"aa":"on","rheb":"on","mtorc1":"on","s6k":"on"},"b":{"s6k":{"t":"T389","at":"t"}},"bars":[["mTORC1 у лизосомы",3],["фосфорилирование S6K1",3]],"note":"Оба входа работают: mTORC1 привлечён к лизосоме, RHEB–GTP стимулирует его, S6K1 фосфорилирована."},"1-0":{"t":{"rheb":"RHEB–GDP"},"n":{"aa":"on","rheb":"off","mtorc1":"base","s6k":"off"},"e":{"e2":"off","e3":"off"},"bars":[["mTORC1 у лизосомы",3],["фосфорилирование S6K1",1]],"note":"Только аминокислотный вход: mTORC1 у лизосомы, но RHEB находится преимущественно в GDP-форме, и фосфорилирование S6K1 низкое. Положение комплекса не заменяет его активации."},"0-1":{"n":{"aa":"off","rheb":"on","mtorc1":"base","s6k":"off"},"p":{"mtorc1":[200,45]},"pn":{"mtorc1":[90,150]},"e":{"e1":"hide","e2":"hide","e3":"off"},"bars":[["mTORC1 у лизосомы",1],["фосфорилирование S6K1",1]],"note":"Только ростовой вход: RHEB–GTP есть, но mTORC1 не привлечён к мембране, и фосфорилирование S6K1 низкое."},"0-0":{"t":{"rheb":"RHEB–GDP"},"n":{"aa":"off","rheb":"off","mtorc1":"base","s6k":"off"},"p":{"mtorc1":[200,45]},"pn":{"mtorc1":[90,150]},"e":{"e1":"hide","e2":"hide","e3":"off"},"bars":[["mTORC1 у лизосомы",1],["фосфорилирование S6K1",1]],"note":"Без обоих входов mTORC1 в цитозоле, RHEB в GDP-форме, фосфорилирование S6K1 низкое."}},"fixed":"Постоянные условия: энергия достаточна, белки комплекса и S6K1 присутствуют, генотип дикого типа. «Низкий» не означает строго нулевой сигнал.","static":["Таблица двух входов для S6K1 в основной Rag-зависимой модели: аминокислоты и RHEB–GTP — mTORC1 у лизосомы, фосфорилирование S6K1 высокое; только аминокислоты — mTORC1 у лизосомы, фосфорилирование низкое; только RHEB–GTP — mTORC1 в цитозоле, фосфорилирование низкое; без обоих входов оба показателя низкие."]}}},{"id":"tfeb","number":6,"section":0,"title":"Почему TFEB и S6K1 могут отвечать по-разному","question":1,"questions":[1],"keywords":["TFEB","FLCN","FNIP1","Rag","14-3-3","S6K1","Почему TFEB и S6K1 могут отвечать по-разному","ядерный экспорт","XPO1","GSK3β","кальциневрин","SLC38A9"],"lead":["Фосфорилирование TFEB имеет особые требования к RagC/D и комплексу FLCN–FNIP.","По состоянию S6K1 нельзя автоматически определить положение TFEB."],"mechanism":["[[T12|FLCN]] в комплексе с [[T24|FNIP]] регулирует нуклеотидное состояние RagC/D.","Rag-зависимые взаимодействия обеспечивают фосфорилирование [[T07|TFEB]] комплексом mTORC1.","Фосфорилирование TFEB способствует связыванию [[T25|14-3-3]] и удержанию фактора вне ядра."],"paragraphs":["TFEB — транскрипционный фактор, который в ядре активирует экспрессию генов лизосомных белков и белков аутофагического аппарата. Пока TFEB фосфорилирован комплексом mTORC1, он связывается с белками 14-3-3 и удерживается в цитоплазме. Белки 14-3-3 — семейство белков, связывающих определённые фосфорилированные участки других белков. Когда фосфорилирование TFEB снижается, фактор перемещается в ядро.","TFEB фосфорилируется тем же комплексом mTORC1, что и S6K1, но требования к регуляторным белкам у двух субстратов разные. Для фосфорилирования TFEB особенно важна RagC/D в GDP-форме, которую создаёт комплекс FLCN–FNIP. RagC/D в GDP-форме непосредственно связывает TFEB и привлекает его к mTORC1 у лизосомы. Поэтому в клетках без FLCN фосфорилирование TFEB резко снижено, а фосфорилирование S6K1 в значительной мере сохраняется. Наоборот, при сохранённом Rag-сигнале и сниженной активности RHEB фосфорилирование S6K1 падает, а фосфорилирование TFEB может сохраниться (Napolitano и соавт., 2020).","На схеме три показателя разделены: фосфорилирование S6K1, фосфорилирование TFEB по S211 (номер участка для TFEB человека) и доля TFEB в ядре. Номер S211 не переносится автоматически на родственный фактор TFE3. Ядерная доля TFEB — показатель локализации фактора. Увеличение ядерной доли ещё не означает, что число лизосом возросло сразу: для этого должны измениться экспрессия генов-мишеней, синтез белков и построение мембран.","Как mTORC1 может фосфорилировать TFEB, если при голодании TFEB находится преимущественно в ядре? Ответ состоит в том, что распределение TFEB динамично. Белок непрерывно переходит из цитозоля в ядро и обратно; выражение «преимущественно в ядре» означает лишь, что при голодании импорт идёт быстрее экспорта, но не то, что TFEB заперт в ядре. Поэтому при возвращении питательных веществ достаточно изменить баланс скоростей: часть ядерного TFEB вновь оказывается в цитозоле и становится доступна лизосомному mTORC1. Это не означает, что вся масса TFEB одновременно перемещается к лизосоме: меняются доли белка в разных состояниях и скорости импорта, экспорта, фосфорилирования и связывания.","Экспорт TFEB из ядра регулируется. В последовательности TFEB есть сигнал ядерного экспорта (NES), который узнаёт экспортин XPO1 (CRM1). Сигнал включается фосфорилированием двух остатков серина рядом с ним — S142 и S138, причём реакции идут по порядку: фосфорилирование S142 подготавливает фосфорилирование S138. Napolitano и соавт. (2018) показали, что это иерархическое фосфорилирование зависит от mTOR, а Li и соавт. (2018) — что S138 фосфорилирует киназа GSK3β, активность которой снижается при нехватке глюкозы. Поэтому нельзя приписывать оба остатка одному лизосомному mTORC1: вклад киназ зависит от условий. При достатке питательных веществ фосфорилирование S142 и S138 ускоряет экспорт, а при его ослаблении экспорт замедляется и TFEB накапливается в ядре.","Оказавшись в цитозоле, TFEB связывается с RagC/D в GDP-форме на цитозольной поверхности лизосомы. Это специфическое белковое узнавание, а не общее свойство TFEB накапливаться у лизосомы: RagC/D–GDP, которую создаёт FLCN–FNIP, непосредственно связывает TFEB. К этому времени mTORC1 уже привлечён к лизосоме: RAPTOR связывается с Rag-гетеродимером, в котором RagA/B находится в GTP-форме. Лизосомный mTORC1 фосфорилирует доступный TFEB, в частности по S211; фосфо-S211 образует участок связывания 14-3-3, и эти белки удерживают TFEB преимущественно в цитозоле. Таким образом, действуют два разных механизма: S142, S138 и XPO1 определяют скорость вывода TFEB из ядра, а S211 и 14-3-3 удерживают его в цитозоле.","При недостатке питательных веществ действие mTORC1 на TFEB ослабевает, а фосфатные группы с него снимают фосфатазы. Один из установленных путей: выход Ca²⁺ из просвета лизосомы через канал TRPML1 (MCOLN1) активирует фосфатазу кальциневрин, которая связывается с TFEB и дефосфорилирует его (Medina и соавт., 2015). После дефосфорилирования TFEB теряет связь с 14-3-3, а его экспорт из ядра ослабевает, поэтому доля ядерного TFEB растёт. Регуляция TFEB не сводится к одной фосфатазе во всех условиях: в разных клетках и при разных воздействиях описаны и другие пути.","Коротко цикл можно записать так. Голодание: ослабление сигнала mTORC1 и действие фосфатаз → меньше связей TFEB с 14-3-3 и слабее экспорт → накопление TFEB в ядре и его транскрипционная активность. Восстановление питания: меняется баланс импорта и экспорта (NES, S142 и S138, XPO1) → цитозольный TFEB связывается с RagC/D–GDP → лизосомный mTORC1 фосфорилирует S211 → 14-3-3 удерживает TFEB вне ядра. Перераспределение и фосфорилирование белков происходят быстрее, чем изменение экспрессии генов-мишеней и построение новых лизосом.","Почему присутствия FLCN у лизосомы недостаточно для фосфорилирования TFEB? Положение белка и его каталитическая активность — разные характеристики. При недостатке аминокислот FLCN–FNIP может входить в лизосомный комплекс FLCN–FNIP–Rag–Ragulator, который удерживает Rag-гетеродимер в неактивной конфигурации; в этом комплексе GAP-активность FLCN–FNIP по отношению к RagC/D подавлена. После возвращения аминокислот комплекс перестраивается: по данным структурного анализа, цитозольный участок SLC38A9 дестабилизирует его и тем самым запускает GAP-действие FLCN–FNIP на RagC (Fromm и соавт., 2020). Возникающая RagC/D–GDP может привлекать TFEB. Здесь различают три Rag-зависимых события: привлечение mTORC1 к лизосоме требует RagA/B–GTP, доставка TFEB — RagC/D–GDP, а фосфорилирование S6K1 — ещё и RHEB. Схема основана на структурах и опытах с определёнными белками (в структурных работах использовали FLCN–FNIP2); её не следует считать универсальной для всех клеток и всех вариантов FNIP.","Описанная схема относится к условиям экспериментов Napolitano и соавт. (2020). При хронической утрате TSC2 в некоторых клетках TFEB может перемещаться в ядро через неканонический механизм, связанный с RagC (Alesi и соавт., 2021); у TFEB есть и другие участки фосфорилирования. Независимость фосфорилирования TFEB от RHEB не означает, что TFEB фосфорилируется другой киназой: каталитическую реакцию выполняет mTOR, различается регуляция доступа субстрата к комплексу."],"trap":["Любое повышение p-S6K1 означает, что TFEB обязательно удерживается в цитоплазме.","S6K1 и TFEB имеют разные требования к взаимодействиям с mTORC1; их фосфорилирование и локализацию измеряют отдельно."],"conditions":"Основная схема сопоставима с механизмом Napolitano 2020; она не описывает любой срок утраты TSC2 и любую клетку. S211 относится к TFEB человека; этот номер не переносить на TFE3. Динамика экспорта и удержания TFEB описана в культивируемых клетках человека (HeLa, HEK293, HT29, MCF-7); вклад киназ и фосфатаз зависит от условий, а участки S142, S138 и S211 относятся к TFEB человека.","sources":["Goul2023","Napolitano2020","Roczniak2012","Alesi2021","Napolitano2018","Li2018","Medina2015","Fromm2020"],"quiz":{"id":"S7-L06","question":"В модели с сохранённым Rag-сигналом уменьшили активность RHEB. Какое сравнение корректно для S6K1 и TFEB?","options":[{"id":"S7-L06-2","text":"p-S6K1 и фосфорилирование TFEB обязаны снизиться одинаково.","correct":false,"feedback":"Одинаковый фермент не означает одинаковой зависимости каждого субстрата от регуляторных белков."},{"id":"S7-L06-3","text":"Фосфорилирование TFEB обязательно растёт пропорционально падению p-S6K1.","correct":false,"feedback":"Различие зависимостей не устанавливает обязательной обратной пропорциональности двух показателей."},{"id":"S7-L06-1","text":"p-S6K1 может снизиться, а фосфорилирование TFEB — сохраниться.","correct":true,"feedback":"Для рассматриваемой Rag-зависимой ветви TFEB требования к RHEB отличаются от требований S6K1."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Две ветви mTORC1: S6K1 и TFEB","status":"Схема механизма · по Napolitano и соавт., 2020; качественные состояния","ctrls":[{"id":"v","type":"group","label":"Условие","opts":["исходное: Rag, FLCN и RHEB работают","снижена активность RHEB","нет FLCN"]}],"W":640,"H":330,"NW":340,"NH":500,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":400,"y":246,"w":230,"h":76,"c":"nuc","t":"ядро","lx":412,"ly":266,"n":[6,418,328,74,16,438]}],"nodes":{"rheb":{"p":[90,70,130,40],"n":[85,40,140,40],"t":"RHEB–GTP"},"flcn":{"p":[90,200,130,40],"n":[75,215,130,40],"t":"FLCN–FNIP","fs":14},"ragcd":{"p":[250,200,120,44],"n":[75,300,130,44],"t":"RagC/D\nGDP","fs":14},"mtorc1":{"p":[270,110,120,42],"n":[170,135,120,42],"t":"mTORC1"},"s6k":{"p":[520,50,110,40],"n":[270,40,120,40],"t":"S6K1"},"tfeb":{"p":[470,170,110,40],"n":[270,300,120,40],"t":"TFEB"},"p1433":{"p":[595,170,76,36],"n":[290,385,90,36],"t":"14-3-3","fs":14},"tfebn":{"p":[520,292,130,36],"n":[170,470,150,36],"t":"TFEB в ядре","fs":14}},"edges":{"r1":{"a":"rheb","b":"mtorc1","k":"act","t":"активация","d":[0,-12],"dn":[-40,0]},"f1":{"a":"flcn","b":"ragcd","k":"act","t":"GAP → GDP","d":[0,-12],"dn":[0,26]},"rt":{"a":"ragcd","b":"tfeb","k":"bind","t":"привлекает TFEB","d":[-24,-14],"dn":[-58,0]},"p1":{"a":"mtorc1","b":"s6k","k":"phos"},"p2":{"a":"mtorc1","b":"tfeb","k":"phos","bend":0},"b14":{"a":"p1433","b":"tfeb","k":"bind"},"nx":{"a":"tfeb","b":"tfebn","k":"tr","t":"в ядро","d":[36,0],"dn":[40,0]}},"st":{"0":{"n":{"rheb":"on","flcn":"on","ragcd":"on","mtorc1":"on","s6k":"on","tfeb":"base","p1433":"base","tfebn":"off"},"e":{"nx":"off"},"b":{"s6k":{"t":"T389","at":"l"},"tfeb":{"t":"S211 · связывание 14-3-3","at":"b","al":"end"}},"m":[["p-S6K1","высокое"],["p-TFEB (S211)","высокое"],["TFEB в ядре","низкая доля"]],"note":"Rag и FLCN работают, RHEB–GTP есть: mTORC1 фосфорилирует и S6K1, и TFEB. Фосфорилированный TFEB связан с 14-3-3 и удерживается в цитоплазме."},"1":{"t":{"rheb":"RHEB–GDP"},"n":{"rheb":"off","flcn":"on","ragcd":"on","mtorc1":"base","s6k":"off","tfeb":"base","p1433":"base","tfebn":"off"},"e":{"r1":"off","p1":"off","nx":"off"},"b":{"tfeb":{"t":"S211 сохраняется","at":"b","al":"end"}},"m":[["p-S6K1","низкое"],["p-TFEB (S211)","может сохраниться"],["TFEB в ядре","низкая доля"]],"note":"При сохранённом Rag-сигнале и сниженной активности RHEB фосфорилирование S6K1 падает, а TFEB, привлечённый RagC/D, может оставаться фосфорилированным и удерживаться вне ядра."},"2":{"t":{"ragcd":"RagC/D\nGTP"},"n":{"rheb":"on","flcn":"abs","ragcd":"off","mtorc1":"on","s6k":"on","tfeb":"off","p1433":"off","tfebn":"on"},"e":{"f1":"off","rt":"off","p2":"off","b14":"off"},"b":{"s6k":{"t":"T389","at":"l"}},"m":[["p-S6K1","в значительной мере сохранено"],["p-TFEB (S211)","резко снижено"],["TFEB в ядре","высокая доля"]],"note":"Без FLCN RagC/D остаётся в GTP-форме и не привлекает TFEB к mTORC1. TFEB не фосфорилируется, теряет связь с 14-3-3 и перемещается в ядро, тогда как фосфорилирование S6K1 в значительной мере сохраняется. Киназная активность mTOR при этом сохраняется."}},"fixed":"Постоянные условия: аминокислотный вход к RagA/B поддержан. S211 — участок TFEB человека; на TFE3 этот номер не переносится.","static":["Две ветви одного комплекса: RHEB–GTP стимулирует фосфорилирование S6K1; FLCN–FNIP переводит RagC/D в GDP-форму, и RagC/D подводит TFEB к mTORC1. При сниженной активности RHEB падает p-S6K1, а p-TFEB может сохраниться. Без FLCN p-TFEB резко снижено и TFEB перемещается в ядро, тогда как p-S6K1 в значительной мере сохраняется."]}}},{"id":"inhibitors","number":7,"section":0,"title":"Чем различаются рапамицин и Torin1","question":1,"questions":[1],"keywords":["Рапамицин","Torin1","FKBP12–FRB","S6K1","4E-BP1","Чем различаются рапамицин и Torin1"],"lead":["Рапамицин и Torin1 подавляют mTOR разными молекулярными способами.","Снижение фосфорилирования одного субстрата не показывает степень подавления всех функций комплекса."],"mechanism":["Комплекс [[T29|FKBP12–рапамицин]] связывается с FRB-областью mTOR.","[[T28|Torin1]] взаимодействует с ATP-связывающим участком киназы mTOR.","Чувствительность результата зависит от субстрата, модифицируемого участка и режима воздействия."],"paragraphs":["[[T27|Рапамицин]] действует не сам по себе: в клетке он связывается с небольшим белком FKBP12, и уже комплекс FKBP12–рапамицин связывается с FRB-областью mTOR. FRB-область расположена рядом с входом в активный центр киназы. Связавшийся комплекс ограничивает доступ части субстратов к активному центру, но не конкурирует с ATP за его участок связывания (Yang и соавт., 2013). Torin1 устроен иначе: это ATP-конкурентный ингибитор, который занимает ATP-связывающий участок киназного домена mTOR и тем самым подавляет каталитическую реакцию.","Из различия механизмов следует различие эффектов. Фосфорилирование S6K1 по T389 чувствительно к острому действию рапамицина. Фосфорилирование 4E-BP1 по T37/46, ULK1 по S758 (у человека) и TFEB по S211 (у человека) при остром действии рапамицина во многом сохраняется, тогда как Torin1 снижает фосфорилирование всех этих участков (для 4E-BP1 и ULK1 — Thoreen и соавт., 2009; Kang и соавт., 2013). Для TFEB Roczniak-Ferguson и соавт. (2012) показали, что рапамицин почти не меняет его локализацию, а Torin1 снижает фосфорилирование S211 и вызывает перемещение TFEB в ядро. Устойчивость относится к определённому участку, а не ко всему белку: у 4E-BP1 есть участки, фосфорилирование которых снижается рапамицином сильнее. Kang и соавт. (2013) связали различия с тем, насколько эффективно mTORC1 фосфорилирует данный участок.","Препараты различаются и по действию на комплексы. Torin1 подавляет киназу mTOR в составе обоих комплексов, mTORC1 и mTORC2. Острое действие рапамицина направлено прежде всего на mTORC1, но при длительном воздействии во многих типах клеток рапамицин нарушает и сборку mTORC2 (Sarbassov и соавт., 2006). Поэтому сравнение «рапамицин против Torin1» без указания срока, клеток и измеряемого участка неинформативно.","Из этого следуют требования к эксперименту. Для каждого субстрата измеряют фосфорилирование конкретного участка вместе с общим содержанием того же белка и белком контроля нанесения, по которому проверяют, что во все дорожки нанесено одинаковое количество белка. Дозы и сроки из разных работ не объединяются в один условный эксперимент. На схеме шага приведено только качественное сравнение механизмов при остром воздействии; это не рекомендации по применению препаратов."],"trap":["Рапамицин — ATP-конкурентный ингибитор, одинаково выключающий все мишени mTORC1.","Рапамицин действует через FKBP12 и FRB; разные субстраты и участки имеют разную чувствительность."],"conditions":"Для экспериментальных чисел потребуются дозы, клетки, срок и конкретный сайт исходной работы. Здесь только качественное сравнение механизмов; не рекомендации применения препаратов.","sources":["Goul2023","Kang2013","Yang2013","Thoreen2009","Roczniak2012","Sarbassov2006"],"quiz":{"id":"S7-L07","question":"После острого действия рапамицина p-S6K1 снизился, но часть фосфорилирования других субстратов сохранилась. Как это объяснить?","options":[{"id":"S7-L07-1","text":"Разные субстраты и фосфосайты неодинаково чувствительны к рапамицину.","correct":true,"feedback":"Рапамицин частично ограничивает функции mTORC1; чувствительность зависит от конкретного взаимодействия и участка."},{"id":"S7-L07-2","text":"Снижение p-S6K1 означает обязательное исчезновение любого фосфорилирования.","correct":false,"feedback":"Один показатель нельзя распространить на все реакции разных субстратов."},{"id":"S7-L07-3","text":"Сохранение другого фосфосайта означает, что препарат вовсе не действовал.","correct":false,"feedback":"Препарат может действовать на одну ветвь, оставляя другую относительно устойчивой."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Где действуют рапамицин и Torin1","status":"Схема механизма · острое воздействие; чувствительность зависит от условий","ctrls":[{"id":"d","type":"group","label":"Препарат","opts":["без препарата","рапамицин","Torin1"]}],"W":640,"H":250,"NW":340,"NH":330,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"zones":[{"x":240,"y":20,"w":380,"h":210,"c":"plain","t":"киназа mTOR (условная схема доменов)","lx":256,"ly":42,"n":[6,120,328,200,14,140]}],"nodes":{"frb":{"p":[330,100,140,40],"n":[75,175,130,40],"t":"FRB-область","fs":14},"atp":{"p":[330,180,150,44],"n":[88,270,156,44],"t":"ATP-связывающий\nучасток","fs":14},"cat":{"p":[550,140,130,44],"n":[265,225,110,44],"t":"активный\nцентр","fs":14},"rap":{"p":[100,100,170,44],"n":[90,50,160,44],"t":"FKBP12–\nрапамицин","fs":14},"tor":{"p":[100,180,150,40],"n":[255,50,140,40],"t":"Torin1"}},"edges":{"b1":{"a":"rap","b":"frb","k":"bind","t":"связывается","d":[0,-12],"dn":[38,0]},"b2":{"a":"tor","b":"atp","k":"inh","t":"конкурирует с ATP","d":[-36,-12],"dn":[-34,0]},"c1":{"a":"frb","b":"cat","k":"inh","t":"доступ части\nсубстратов","d":[0,-18],"dn":[0,-18],"dash":true},"c2":{"a":"atp","b":"cat","k":"seq","t":""}},"base":{"n":{"rap":"hide","tor":"hide","cat":"on"},"e":{"c1":"hide"}},"st":{"0":{"m":[["Место действия","—"],["mTORC1","не подавлен"],["mTORC2","не подавлен"]],"tab":[["Участок (человек)","Фосфорилирование"],["S6K1 T389","исходный уровень"],["4E-BP1 T37/46","исходный уровень"],["ULK1 S758","исходный уровень"],["TFEB S211","исходный уровень"],["AKT S473 (mTORC2)","исходный уровень"]],"note":"Без препарата киназа mTOR фосфорилирует субстраты обоих комплексов."},"1":{"n":{"rap":"on","frb":"sel","cat":"base"},"e":{"c1":"on"},"m":[["Место действия","FRB-область"],["mTORC1","частично подавлен"],["mTORC2","при остром действии не подавлен"]],"tab":[["Участок (человек)","Фосфорилирование"],["S6K1 T389","сильно снижено"],["4E-BP1 T37/46","во многом сохранено"],["ULK1 S758","во многом сохранено"],["TFEB S211","во многом сохранено"],["AKT S473 (mTORC2)","сохранено"]],"note":"FKBP12–рапамицин связывается с FRB-областью и ограничивает доступ части субстратов к активному центру; с ATP он не конкурирует. Чувствительность различается по участкам."},"2":{"n":{"tor":"on","atp":"sel","cat":"off"},"e":{"c2":"off"},"m":[["Место действия","ATP-связывающий участок"],["mTORC1","подавлен"],["mTORC2","подавлен"]],"tab":[["Участок (человек)","Фосфорилирование"],["S6K1 T389","сильно снижено"],["4E-BP1 T37/46","сильно снижено"],["ULK1 S758","сильно снижено"],["TFEB S211","сильно снижено"],["AKT S473 (mTORC2)","сильно снижено"]],"note":"Torin1 конкурирует с ATP за участок в киназном домене и подавляет каталитическую реакцию mTOR в обоих комплексах."}},"fixed":"Качественное сравнение при остром воздействии по Thoreen и соавт. (2009) и Kang и соавт. (2013). Дозы и сроки не указаны: числа требуют условий конкретной работы.","static":["FKBP12–рапамицин связывается с FRB-областью mTOR и ограничивает доступ части субстратов к активному центру; Torin1 конкурирует с ATP в киназном домене. При остром действии рапамицина сильно снижается фосфорилирование S6K1 T389, а фосфорилирование 4E-BP1 T37/46, ULK1 S758 и TFEB S211 во многом сохраняется; Torin1 снижает все эти показатели и подавляет также mTORC2 (AKT S473)."]}}},{"id":"mtor-evidence","number":8,"section":0,"title":"Какие измерения различают локализацию, фосфорилирование и функцию","question":1,"questions":[1],"keywords":["Колокализация","Иммуноблоттинг","LAMP1","Фосфорилирование","TSC","GATOR1","Какие измерения различают локализацию, фосфорилирование и функцию"],"lead":["Микроскопия, иммуноблоттинг и измерение синтеза белка отвечают на разные вопросы.","Генетическое вмешательство проверяет зависимость результата от конкретного компонента."],"mechanism":["[[T26|Колокализация]] mTOR с [[T31|LAMP1]] показывает совпадение сигналов в пределах разрешения метода.","Фосфоспецифическое антитело измеряет выбранную модификацию субстрата.","Функциональный результат проверяют отдельным методом и с подходящими контролями."],"paragraphs":["Пусть клетки сначала держат в среде без аминокислот, а затем добавляют аминокислоты; в другой серии меняют ростовой сигнал. Чтобы описать ответ mTORC1, нужны по меньшей мере два показателя, измеренные в сопоставимых образцах одной экспериментальной серии за одинаковый срок воздействия: положение mTOR относительно лизосом и фосфорилирование субстрата. Эти показатели отвечают на разные вопросы и получаются разными методами: для микроскопии клетки фиксируют, а для иммуноблоттинга лизируют, поэтому образцы для двух методов готовят параллельно.","Положение mTOR определяют иммунофлуоресцентной микроскопией. Лизосомы отмечают антителом к LAMP1 — белку лизосомной мембраны, который служит маркером этих органелл. Колокализацией называют совпадение сигналов двух меток в одних и тех же участках изображения. Совпадение ограничено разрешением светового микроскопа (порядка сотен нанометров), поэтому оно показывает распределение mTOR относительно LAMP1-положительных структур, но не доказывает прямого связывания mTOR с LAMP1 и ничего не говорит о киназной активности.","Фосфорилирование измеряют [[T30|иммуноблоттингом]]: белки пробы разделяют электрофорезом, переносят на мембрану и выявляют антителами. Антитело к S6K1, фосфорилированной по T389, выявляет только модифицированную форму; рядом измеряют общее содержание S6K1 и белок контроля нанесения, по которому проверяют, что во все дорожки нанесено одинаковое количество белка. Без этих контролей рост сигнала p-S6K1 нельзя отличить от роста количества самой S6K1. Синтез белка — третий, функциональный показатель; его измеряют отдельно, например по включению меченой аминокислоты.","Генетические вмешательства проверяют, от какого компонента зависит ответ. Утрата Rag или Ragulator нарушает аминокислотную регуляцию локализации, изменение RHEB затрагивает активацию, а возвращение исходного белка в клетки, лишённые этого белка, проверяет специфичность эффекта. При удалении аминокислот Rag-ГТФазы привлекают к лизосоме и TSC2, который там может переводить RHEB в GDP-форму; в клетках без TSC2 (эксперименты на клетках HeLa) mTORC1 при удалении аминокислот не полностью освобождается от лизосомы и не полностью инактивируется (Demetriades и соавт., 2014). Остаточные значения у разных генотипов различаются и измеряются, а не принимаются одинаковыми. Отдельная регуляторная ветвь — отрицательная обратная связь: S6K1 фосфорилирует IRS1 (белок-адаптер инсулинового рецептора) и ослабляет инсулиновый сигнал. В культивируемых клетках S6K1 фосфорилирует и RICTOR — субъединицу mTORC2 — по Thr1135. Сборка и киназная активность mTORC2 при этом не менялись, но в клетках с заменой Thr1135 на аланин фосфорилирование AKT, зависящее от mTORC2, было выше (Julien и соавт., 2010). Это частная обратная связь, а не доказательство общей инактивации mTORC2. С нарушениями TSC и субъединиц GATOR1 связаны определённые наследственные заболевания (туберозный склероз; некоторые формы фокальной эпилепсии при вариантах гена DEPDC5, кодирующего субъединицу GATOR1), однако изменённую регуляцию mTORC1 нельзя считать универсальным объяснением возникновения опухолей."],"trap":["Колокализация двух белков доказывает их прямое связывание и активность.","Совпадение сигналов ограничено разрешением микроскопии; прямое взаимодействие и киназное действие требуют других измерений."],"conditions":"Никакие реальные микрофотографии и численные значения нового эксперимента не создаются. Схематические карточки методов явно обозначены как учебные.","sources":["Goul2023","Cui2025","Demetriades2014","Julien2010"],"quiz":{"id":"S7-L08","question":"После добавления аминокислот увеличилась колокализация mTOR и LAMP1. Какой вывод непосредственно поддерживает это наблюдение?","options":[{"id":"S7-L08-3","text":"Установлено усиление синтеза белка без дополнительных измерений.","correct":false,"feedback":"По положению комплекса нельзя количественно установить скорость синтеза белка."},{"id":"S7-L08-1","text":"Изменилось распределение mTOR относительно LAMP1-положительных структур.","correct":true,"feedback":"Микроскопия показывает распределение сигналов; дальнейшие свойства требуют независимой проверки."},{"id":"S7-L08-2","text":"Установлено прямое связывание всех молекул mTOR с белком LAMP1.","correct":false,"feedback":"Колокализация не определяет прямой молекулярный контакт с LAMP1."}],"rev":1},"widget":{"kind":"cards","title":"","s":{"title":"Какой метод отвечает на какой вопрос","status":"Учебные карточки методов · пиктограммы не являются данными эксперимента","opts_label":"Вопрос исследования","opts":["Где находится mTOR?","Фосфорилирована ли S6K1?","Изменился ли синтез белка?"],"heads":["Что измеряют","Метод","Контроль","Чего метод сам не показывает"],"cards":[{"v":["Распределение сигнала mTOR относительно лизосом (LAMP1).","Иммунофлуоресцентная микроскопия, два канала и их наложение.","Клетки без аминокислот и с аминокислотами, снятые одинаково; клетки без Rag или Ragulator.","Прямое связывание mTOR с LAMP1, киназную активность и фосфорилирование субстратов."],"note":"Микроскопия отвечает на вопрос о положении комплекса. Совпадение сигналов ограничено разрешением метода.","pic":{"kind":"micro","a":"mTOR","b":"LAMP1","c":"наложение","cap":"Пиктограмма, не микрофотография"}},{"v":["Содержание S6K1, фосфорилированной по T389, относительно общего содержания S6K1.","Иммуноблоттинг с фосфоспецифическим антителом и антителом к общему белку.","Общий S6K1 и белок контроля нанесения (одинаковое количество белка в дорожках); одинаковый момент измерения.","Положение mTORC1 в клетке и скорость синтеза белка."],"note":"Отношение p-S6K1 к общему S6K1 описывает модификацию одного субстрата, а не всех функций mTORC1.","pic":{"kind":"blot","rows":[["p-S6K1 (T389)",[0.15,0.9]],["общий S6K1",[0.8,0.8]],["контроль нанесения",[0.8,0.8]]],"lanes":["без аминокислот","аминокислоты"],"cap":"Схема полос, не данные эксперимента"}},{"v":["Скорость включения меченой аминокислоты во вновь синтезируемые белки за заданный срок.","Метка аминокислотой или её аналогом с последующим измерением в белках.","Ингибитор трансляции как контроль метода; одинаковые сроки и среда.","Какое звено (mTORC1 или другой путь) изменило синтез белка."],"note":"Синтез белка — функциональный итог многих процессов; связь с mTORC1 проверяют вмешательством в этот путь."}],"fixed":"Никакие реальные микрофотографии и численные значения эксперимента здесь не создаются.","static":["Три карточки: микроскопия (положение mTOR относительно LAMP1), иммуноблоттинг (p-S6K1 T389 относительно общего S6K1 и контроля нанесения), измерение синтеза белка по включению метки. Для каждой указано, что измеряют, какой нужен контроль и чего метод сам не показывает."]}}},{"id":"adenylates","number":9,"section":1,"title":"Что показывают ATP, ADP, AMP и энергетический заряд","question":2,"questions":[2],"keywords":["ATP","ADP","AMP","Аденилатный пул","Аденилаткиназа","Энергетический заряд","Что показывают ATP, ADP, AMP и энергетический заряд"],"lead":["ATP, ADP и AMP образуют аденилатный пул, состояние которого меняется при образовании и расходовании ATP.","Энергетический заряд — расчётная характеристика этого пула, а не отдельная молекула."],"mechanism":["При гидролизе ATP образуется ADP; его содержание возрастает, если образование ADP превышает расходование в других реакциях.","[[T34|Аденилаткиназа]] катализирует обратимую реакцию 2 ADP ⇌ ATP + AMP.","Заряд рассчитывают как ([ATP] + 0,5[ADP]) / ([ATP] + [ADP] + [AMP])."],"paragraphs":["ATP, ADP и AMP клетки вместе образуют [[T33|аденилатный пул]]. Для его описания используют три разные величины. Содержание — количество нуклеотида в клетке или пробе. Концентрация — количество в единице объёма. Доля — концентрация нуклеотида, делённая на сумму концентраций всех трёх. Формулы этого шага используют концентрации, выраженные в одинаковых единицах, или доли.","При работе ионных насосов, синтезе белков и других процессах ATP гидролизуется до ADP и фосфата. Пока окислительное фосфорилирование и гликолиз восполняют ATP, доля ADP меняется мало. Если образование ATP отстаёт от расходования, доля ADP возрастает. Аденилаткиназа катализирует обратимую реакцию 2 ADP ⇌ ATP + AMP. При высоком отношении ATP к ADP, характерном для энергетически полноценной клетки, равновесие этой реакции сдвинуто влево, и содержание AMP остаётся очень низким. При росте отношения ADP к ATP реакция идёт слева направо (2 ADP → ATP + AMP), и отношение AMP к ATP растёт ещё сильнее (Steinberg, Hardie, 2023). В этом направлении аденилаткиназа образует ATP и AMP из двух ADP, а не расходует ATP.","Поскольку исходная доля AMP мала, даже небольшое абсолютное прибавление AMP даёт большое относительное изменение. Насколько большое, зависит от исходного состава пула, от того, насколько реакция близка к равновесию, и от условий измерения. Поэтому единого для всех клеток процента прироста AMP при небольшом снижении ATP не существует.","[[T35|Энергетический заряд]] — расчётная характеристика пула: E = ([ATP] + 0,5·[ADP]) / ([ATP] + [ADP] + [AMP]). ADP входит с весом 0,5, поскольку в ADP одна фосфоангидридная связь, а в ATP — две. Заряд принимает значения от 0 (весь пул — AMP) до 1 (весь пул — ATP). Для смеси 8:1:1 заряд равен (8 + 0,5) / 10 = 0,85. AMPK (AMP-активируемая протеинкиназа, следующий шаг) не вычисляет эту формулу: киназа связывает отдельные нуклеотиды, а заряд — сводная величина, удобная исследователю.","Во втором режиме схемы задана учебная модель: суммарный пул равен 1, реакция аденилаткиназы находится в условном равновесии с K = a·m/d² = 1 (a, d и m — доли ATP, ADP и AMP). Это допущение модели, а не физиологическая константа свободных нуклеотидов. В такой модели снижение доли ATP с 0,98 до 0,90 повышает долю AMP примерно в 23 раза, а заряд снижается лишь с 0,99 до 0,95. Пример 8:1:1 из первого режима — отдельная задача, к которой условие равновесия не применяется."],"trap":["Небольшое снижение ATP всегда даёт один и тот же процент увеличения AMP.","Относительное изменение AMP зависит от исходного состава пула, равновесия реакции и условий измерения."],"conditions":"Числа 8:1:1 — явно заданные учебные концентрации. Модель равновесия — другая задача с условным K=1 и постоянным пулом; не выдавать её за измерение в конкретных клетках.","sources":["Smith2026","Steinberg2023"],"quiz":{"id":"S7-L09","question":"В условной смеси концентрации ATP, ADP и AMP равны соответственно 8, 1 и 1 в одинаковых единицах. Чему равен аденилатный энергетический заряд?","options":[{"id":"S7-L09-2","text":"0,80: учитывается только доля ATP в общем пуле.","correct":false,"feedback":"Значение 0,80 — доля ATP; формула заряда дополнительно учитывает ADP с коэффициентом 0,5."},{"id":"S7-L09-3","text":"0,90: ATP и ADP имеют одинаковый вес в расчёте.","correct":false,"feedback":"Значение 0,90 получилось бы при полном весе ADP, но в определении заряда его вес равен 0,5."},{"id":"S7-L09-1","text":"0,85: учитываются ATP и половина концентрации ADP.","correct":true,"feedback":"Заряд равен (8 + 0,5 × 1) / (8 + 1 + 1) = 0,85. Это отдельная расчётная задача без требования равновесия аденилаткиназы."}],"rev":1},"widget":{"kind":"charge","title":"","s":{"title":"Энергетический заряд аденилатного пула","status":"Расчёт по заданным величинам · учебные числа, не измерение в клетках","modes_label":"Режим","modes":["Рассчитать заряд","Условное равновесие аденилаткиназы"],"atp":"ATP, условные единицы концентрации","adp":"ADP, условные единицы концентрации","amp":"AMP, условные единицы концентрации","a_label":"Доля ATP в пуле, a","l_atp":"ATP","l_adp":"ADP","l_amp":"AMP","m_sum":"Сумма","m_e":"Энергетический заряд","m_formula":"Расчёт","m_k":"K = a·m/d²","zero":"Заряд не определяется: сумма концентраций равна нулю.","note0":"Заряд рассчитан по заданным концентрациям: ATP входит с весом 1, ADP — с весом 0,5, AMP — с весом 0. Условие равновесия аденилаткиназы в этом режиме не используется.","note1":"Суммарный пул равен 1. По доле ATP a рассчитаны доли ADP d = (√(4a − 3a²) − a)/2 и AMP m = 1 − a − d, при которых условная константа K = a·m/d² равна 1.","note1b":"K = 1 — допущение учебной модели, а не измеренная константа свободных нуклеотидов в клетке. Сравните долю AMP при a = 0,98 и a = 0,90.","static":["Режим «Рассчитать заряд»: по концентрациям ATP, ADP и AMP рассчитывается E = (ATP + 0,5·ADP) / (ATP + ADP + AMP); для 8:1:1 E = 0,85; при нулевой сумме заряд не определяется. Режим «Условное равновесие»: пул равен 1, при K = a·m/d² = 1 доли рассчитываются по доле ATP; при a = 0,98 доля AMP около 0,0004, при a = 0,90 — около 0,009, заряд 0,99 и 0,95."]}}},{"id":"ampk-nucleotides","number":10,"section":1,"title":"Как нуклеотиды регулируют комплекс AMPK","question":2,"questions":[2],"keywords":["AMPK","Аллостерическая регуляция","LKB1","Активационная петля","Фосфорилирование","Как нуклеотиды регулируют комплекс AMPK"],"lead":["AMPK содержит каталитическую α-субъединицу и регуляторные β- и γ-субъединицы.","Связывание нуклеотида и фосфорилирование активационной петли — разные способы изменения активности."],"mechanism":["AMP и ATP конкурируют в части регуляторных участков γ-субъединицы.","AMP способствует [[T37|аллостерической]] активации и сохранению фосфорилирования [[T39|активационной петли]].","ADP может защищать фосфорилированную петлю, но не воспроизводит все эффекты AMP."],"paragraphs":["[[T36|AMPK]] (AMP-активируемая протеинкиназа) — гетеротример из трёх субъединиц. α-Субъединица содержит киназный домен с активационной петлёй — участком, конформация которого определяет связывание субстрата и катализ. β-Субъединица связывает α и γ; в ней находится углеводсвязывающий модуль, участвующий в связывании с гликогеном. γ-Субъединица содержит четыре повтора CBS (участки, названные по ферменту цистатионин-β-синтазе, в котором их впервые описали), которые образуют четыре потенциальных участка связывания нуклеотидов. Эти участки неравноценны: один, по-видимому, не используется, два связывают нуклеотиды постоянно, а регуляторным участком, где AMP, ADP и ATP обмениваются, служит один (Steinberg, Hardie, 2023).","Связывание AMP с γ-субъединицей действует тремя способами. Во-первых, AMP аллостерически повышает активность уже фосфорилированного комплекса. Аллостерической называют регуляцию, при которой лиганд связывается не в активном центре, а в другом участке и меняет конформацию и активность белка. Во-вторых, AMP способствует фосфорилированию Thr172 в активационной петле. В-третьих, AMP защищает фосфорилированный Thr172 от дефосфорилирования фосфатазами. ATP конкурирует с AMP за регуляторный участок и противодействует этим эффектам. ADP, связываясь с тем же участком, тоже способствует фосфорилированию Thr172 и защищает его от дефосфорилирования, но аллостерической активации, как AMP, не вызывает (Xiao и соавт., 2011; Smith и соавт., 2026).","Thr172 фосфорилируется вышестоящей киназой [[T38|LKB1]], которая работает в комплексе с белками STRAD и MO25. Этот комплекс, по-видимому, постоянно активен и не регулируется нуклеотидами напрямую. Чувствительность к AMP обеспечивает γ-субъединица AMPK, а не LKB1: LKB1 переносит фосфорильную группу с ATP, а AMP меняет доступность Thr172 и устойчивость модификации. Защита петли не делает активацию необратимой: когда содержание ATP восстанавливается и AMP вытесняется из регуляторного участка, фосфатазы дефосфорилируют Thr172.","Номер участка зависит от изоформы и вида. Thr172 — номер в AMPKα2 человека; в AMPKα1 человека соответствующий треонин имеет номер Thr183. Антитела и подписи «p-AMPK Thr172» в лабораторной практике обычно относятся к этому участку обеих изоформ, поэтому в описании эксперимента указывают изоформу и вид. Влияние нуклеотидов зависит также от состава комплекса: у млекопитающих есть по нескольку изоформ каждой субъединицы."],"trap":["AMP — донор фосфорильной группы для активации AMPK.","AMP действует как регуляторный лиганд. Фосфорильную группу в киназной реакции переносит вышестоящая киназа с ATP."],"conditions":"Нумерация Thr172 задана для α2 человека; другие паралоги не получают этот номер автоматически. Влияние нуклеотидов зависит от состава комплекса; схема качественная.","sources":["Steinberg2023","Smith2026","Xiao2011"],"quiz":{"id":"S7-L10","question":"AMP связывается с регуляторным участком AMPK при сохранённом фосфорилировании активационной петли. Почему активность может возрасти?","options":[{"id":"S7-L10-1","text":"Связывание AMP аллостерически меняет активность комплекса.","correct":true,"feedback":"Регуляторный лиганд меняет каталитическую активность через изменение состояния комплекса."},{"id":"S7-L10-2","text":"AMP служит донором фосфорильной группы для α-субъединицы.","correct":false,"feedback":"Здесь AMP является регуляторным лигандом, а не донором группы для фосфорилирования AMPK."},{"id":"S7-L10-3","text":"При неизменном фосфорилировании связывание AMP не может менять активность.","correct":false,"feedback":"Аллостерическая регуляция позволяет изменить активность при сохранённой модификации петли."}],"rev":1},"widget":{"kind":"net","title":"","s":{"title":"Нуклеотид в регуляторном участке и фосфорилирование петли","status":"Схема механизма · без атомных деталей; качественные состояния","ctrls":[{"id":"nuc","type":"group","label":"Нуклеотид в регуляторном участке γ","opts":["AMP","ADP","ATP"]},{"id":"ph","type":"check","label":"Thr172 фосфорилирован","def":true}],"W":640,"H":300,"NW":340,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, стимулирует","inh":"тормозит, ингибирует","phos":"фосфорилирует (смысл — у мишени)","tr":"перенос вещества","rx":"химическое превращение","bind":"связывание, контакт","seq":"порядок событий","dash":"косвенная или условная связь","nodes":["жёлтая рамка — активное состояние","пунктир — неактивно или снижено","× — белка нет","P — фосфорилирование (сайт и действие указаны)"]},"nodes":{"alpha":{"p":[300,60,170,48],"n":[165,45,140,46],"t":"α: киназный\nдомен","fs":14},"loop":{"p":[300,130,170,40],"n":[165,118,150,38],"t":"петля · Thr172","fs":14},"beta":{"p":[100,150,90,44],"n":[50,295,70,38],"t":"β","fs":16},"gamma":{"p":[300,240,190,46],"n":[165,215,170,46],"t":"γ: регуляторный\nучасток","fs":14},"nuc":{"p":[530,240,100,40],"n":[170,300,90,36],"t":"AMP"},"lkb1":{"p":[530,130,110,40],"n":[290,45,84,38],"t":"LKB1"},"ppase":{"p":[110,255,130,40],"n":[295,215,84,38],"t":"фосфатаза","fs":13}},"edges":{"nb":{"a":"nuc","b":"gamma","k":"bind","t":"связывание","d":[0,-12],"dn":[48,0]},"allo":{"a":[205,236,80,210],"b":[213,66,93,52],"k":"act","t":"аллостерия","d":[-62,0],"dn":[-40,0],"bend":-50,"bn":-30},"lk":{"a":"lkb1","b":"loop","k":"phos","t":"","d":[0,-10]},"pp":{"a":"ppase","b":"loop","k":"inh","t":"дефосфорилирование","d":[12,10],"dn":[0,26],"anc":"start"
