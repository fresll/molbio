},"widget":{"kind":"hcurve","title":"","s":{"title":"Относительная мощность комплекса при росте доли варианта","status":"Учебная модель · расчёт по заданным параметрам","sl_h":"Доля варианта мтДНК, %","var_label":"Комплекс с вариантом в гене субъединицы","vars":["Резерв комплекса больше (R = 0,5)","Резерв комплекса меньше (R = 2)"],"R":[0.5,2],"W":0.4,"need_label":"Критерий дефицита (потребность ткани)","needs":["Низкая потребность: 30 % мощности","Высокая потребность: 66 % мощности"],"need":[0.3,0.66],"ax_x":"доля варианта мтДНК, %","ax_y":"относительная мощность, % от контроля","m_cap":"Относительная мощность","m_thr":"Доля, при которой мощность ниже критерия","m_state":"При выбранной доле","st":["выше критерия","ниже критерия (дефицит)"],"note":"Кривая почти горизонтальна при малой доле варианта и резко падает при большой. Где она пересекает критерий, зависит от резерва комплекса и от выбранной потребности: один и тот же вариант даёт разные «пороги».","fixed":"Учебная модель, как в практикуме (упрощённо): f = min(1, доля дикого типа / 0,40) — обеспеченность субъединицей, g = (1 + R)·f / (R + f) — относительная мощность; критерий задан условно. Бледный пунктир — другой резерв для сравнения."}}},{"id":"copy-number","number":26,"section":3,"title":"Почему одинаковая гетероплазмия не означает одинакового числа копий дикого типа","question":4,"questions":[4],"keywords":["число копий мтДНК","доля варианта","копии дикого типа","арифметика гетероплазмии","вариант тРНК","вариант субъединицы"],"lead":["Доля варианта — относительная величина; [[T63|число копий мтДНК]] — абсолютная. Одинаковая доля варианта в клетках с разным числом копий означает разное абсолютное число молекул дикого типа.","Арифметика простая, но она ещё не говорит, хватит ли этих молекул для функции."],"mechanism":["Число копий дикого типа равно общему числу копий, умноженному на долю дикого типа: Nдт = Nобщ · (1 − h).","При h = 70 % и 1000 копиях остаётся 300 молекул дикого типа, а при 500 копиях — 150.","Хватит ли этих молекул, зависит от экспрессии, потребности ткани и типа варианта: вариант тРНК нарушает синтез всех 13 белков, вариант субъединицы — один комплекс."],"paragraphs":["Чтобы сравнивать клетки, нужно различать два показателя. Доля варианта h — это отношение числа молекул с вариантом к общему числу молекул мтДНК. Число копий — сколько всего молекул мтДНК находится в клетке или в образце в расчёте на выбранную единицу (клетку, диплоидный ядерный геном).","Пусть в клетке X 1000 копий мтДНК, в клетке Y — 500, и в обеих доля варианта 70 %. Тогда доля дикого типа — 30 %, и в X остаётся 1000 · 0,3 = 300 молекул дикого типа, а в Y — 500 · 0,3 = 150. Доля одинаковая, а абсолютное число нормальных молекул различается вдвое. Число мутантных молекул — 700 и 350.","Из этой арифметики ещё не следует, что Y работает вдвое хуже. Функция зависит от того, сколько РНК и белка синтезируется с каждой молекулы, какова потребность ткани и сколько резерва у комплексов. Значение имеет и тип варианта. Вариант в гене одной субъединицы затрагивает один комплекс. Вариант в гене тРНК, например m.3243A>G в гене тРНК лейцина, нарушает синтез всех 13 белков мтДНК и поэтому затрагивает комплексы I, III, IV и V.","Поэтому в генетическом анализе определяют и долю варианта, и число копий (шаг о методах), а о функции судят по отдельным измерениям."],"trap":["При одинаковой гетероплазмии число молекул дикого типа одинаково.","Одинакова только доля. Абсолютное число молекул дикого типа равно общему числу копий, умноженному на долю дикого типа, и при разном числе копий различается."],"conditions":"Арифметический пример по заданным значениям: Nобщ = 1000 и 500, h = 0,70; это не измерение клеток и не кривая болезни. Не предполагается, что каждая копия дикого типа вносит одинаковый вклад во всех тканях. Влияние варианта тРНК на все белки мтДНК — Russell 2020.","sources":["Russell2020"],"quiz":{"id":"S9-L26","rev":1,"question":"В каждой из двух клеток есть только молекулы мтДНК дикого типа и данного мутантного варианта. В X всего 1000 копий, в Y — 500; в обеих доля мутантного варианта 70 %. Сколько копий дикого типа остаётся в каждой клетке?","options":[{"text":"В X и Y — по 300 копий дикого типа.","correct":false,"feedback":"Одинаковая доля не устраняет различия общего числа молекул: в Y их вдвое меньше.","id":"S9-L26-1"},{"text":"В X — 300, в Y — 150 копий дикого типа.","correct":true,"feedback":"Доля дикого типа равна 30 %. Умножение на общее число даёт 300 и 150; вывод о функции требует дополнительных условий.","id":"S9-L26-2"},{"text":"В X — 700, в Y — 350 копий дикого типа.","correct":false,"feedback":"Это число копий мутантного варианта, а не дикого типа.","id":"S9-L26-3"}]},"widget":{"kind":"copies","title":"","s":{"title":"Одинаковая доля варианта — разное число молекул дикого типа","status":"Расчёт по заданным параметрам","cell_label":"Клетка","cells":["Обе","X: 1000 копий","Y: 500 копий"],"N":[1000,500],"names":["X","Y"],"h":0.7,"type_label":"Где вариант","types":["В гене субъединицы (MT-CO1)","В гене тРНК (MT-TL1)"],"dot":"один кружок — 10 молекул мтДНК","wt":"дикий тип","mut":"вариант","m_tot":"Всего копий","m_h":"Доля варианта","m_wt":"Копий дикого типа","m_mut":"Копий варианта","cx":["I","II","III","IV","V"],"cx_title":"Какие комплексы может затронуть вариант","hit":[[3],[0,2,3,4]],"notes":["Доля одинакова (70 %), но в X 300 молекул дикого типа, а в Y — 150. Этот расчёт не говорит, хватит ли их для функции.","Вариант гена субъединицы COX1 затрагивает только комплекс IV.","Вариант гена тРНК нарушает синтез всех 13 белков мтДНК и затрагивает комплексы I, III, IV и V; комплекс II целиком кодируется ядром."],"fixed":"Nдт = Nобщ · (1 − h). Числа заданы для примера."}}},{"id":"segregation","number":27,"section":3,"title":"Как наследование и сегрегация меняют распределение вариантов мтДНК","question":4,"questions":[4],"keywords":["наследование мтДНК","материнское наследование","сегрегация","генетическое бутылочное горлышко","дрейф","отбор","распределение долей","ооцит","ПГТ-мт","преимплантационное генетическое тестирование","эмбрион","Атлас ПГТ-мт"],"lead":["мтДНК человека наследуется по материнской линии. При делениях клеток молекулы распределяются между дочерними клетками случайно, и доля варианта у них может различаться — это [[T65|митотическая сегрегация]].","В зародышевой линии на одном из этапов передаётся небольшое эффективное число молекул — [[T66|генетическое бутылочное горлышко]]; поэтому дети одной матери могут получить очень разную долю варианта."],"mechanism":["При делении клетки копии мтДНК распределяются между дочерними клетками случайно, а репликация отдельных молекул не связана с клеточным циклом.","Чем меньше эффективное число независимо передаваемых единиц, тем сильнее доли варианта у потомков отклоняются от исходной в обе стороны.","Случайный дрейф меняет распределение долей, не сдвигая его направленно; направленный сдвиг требует отбора, например отбора против тяжёлых вариантов в зародышевой линии."],"paragraphs":["При оплодотворении митохондрии сперматозоида, как правило, не передаются потомству, и мтДНК человека наследуется от матери. Если у матери гетероплазмия, её ооциты получают из общего набора лишь часть молекул. При каждом делении клетки копии мтДНК распределяются между дочерними клетками случайно; кроме того, отдельные молекулы реплицируются независимо от клеточного цикла. Поэтому доля варианта в разных клетках и тканях одного человека может различаться.","В зародышевой линии этот эффект особенно силён. Многие исследования указывают на этап, на котором передаётся небольшое эффективное число молекул или единиц сегрегации, — генетическое бутылочное горлышко. Его механизм и биологический смысл обсуждаются (Xie 2026). Эффективный размер выборки — параметр, описывающий итоговый разброс; это не буквальное число молекул в каждом ооците.","Следствие видно в семьях: дети одной матери с гетероплазмией могут получить очень разную долю варианта (Russell 2020). Если отбора нет, средняя доля у потомков близка к материнской, а разброс тем больше, чем меньше эффективная выборка. Отбор — отдельный процесс: показано, что патогенные варианты часто передаются через женскую зародышевую линию хуже нейтральных (Xie 2026).","Отсюда прямой переход к клинике. Женщина с гетероплазмическим вариантом не может заранее знать, какую долю варианта получит ребёнок. Одна из возможностей — преимплантационное генетическое тестирование (ПГТ-мт): после экстракорпорального оплодотворения у эмбриона берут биопсию нескольких клеток, определяют в ней долю варианта и для переноса выбирают эмбрион с наименьшей долей. Метод подходит не при всех вариантах и не всем женщинам, а число эмбрионов с низкой долей варианта ограничено (Russell 2020). Насколько доля в биопсии отражает весь эмбрион и как она меняется до рождения, показывают собранные в [[https://fresll.github.io/pgt-mt-atlas/ru/|открытом «Атласе ПГТ-мт»]] опубликованные данные о гетероплазмии мтДНК в эмбрионах — с источником каждого значения.","Бутылочное горлышко объясняет разброс долей варианта у потомков, но не определяет, при какой доле нарушается функция: это биохимический порог, рассмотренный выше."],"trap":["Бутылочное горлышко непосредственно создаёт один универсальный порог функции.","Бутылочное горлышко меняет распределение долей варианта у потомков. Порог функции — другая зависимость: он определяется вариантом, тканью и показателем."],"conditions":"Учебная модель: доли у потомков получены независимыми случайными выборками заданного размера (биномиальное распределение) из набора с долей 50 %, без отбора; эффективные размеры 200 и 10 условны, это не подсчёт молекул в реальном ооците. Модель не предсказывает риск болезни конкретного ребёнка. Механизмы горлышка и отбор в зародышевой линии — Xie 2026; разброс у потомков и преимплантационная диагностика (выбор эмбриона с наименьшей долей варианта, ограничения метода) — Russell 2020; опубликованные значения гетероплазмии эмбрионов при ПГТ-мт с первоисточниками — «Атлас ПГТ-мт».","sources":["Russell2020","Xie2026","Nitsch2024","PGTMTAtlas","B_ALB2"],"quiz":{"id":"S9-L27","rev":1,"question":"В учебной модели исходная доля варианта мтДНК равна 50 %. Размер независимой случайной выборки молекул уменьшили; отбора нет. Как изменится распределение долей варианта у потомков при многократном повторении?","options":[{"text":"Доля варианта обязательно вырастет одинаково у каждого потомка.","correct":false,"feedback":"Случайная выборка может увеличить или уменьшить долю; направленный сдвиг требует дополнительных факторов, например отбора.","id":"S9-L27-1"},{"text":"Доли у всех потомков обязательно станут равны исходной доле.","correct":false,"feedback":"При конечной случайной выборке возникают отклонения от исходной доли; меньшая выборка обычно усиливает их.","id":"S9-L27-2"},{"text":"Разброс долей обычно увеличится при многократном повторении выборки.","correct":true,"feedback":"Меньшая выборка усиливает случайные различия. Это утверждение о распределении, а не об обязательном направлении изменения в каждой клетке.","id":"S9-L27-3"}]},"widget":{"kind":"bottleneck","title":"","s":{"title":"Доли варианта у потомков при разном эффективном размере выборки","status":"Учебная модель · случайные выборки","n_label":"Эффективный размер выборки","ns":["200 единиц","10 единиц"],"N":[200,10],"btn":"Повторить выборки","mother":"мать: 50 %","kids":"двенадцать потомков","hist":"распределение долей в 2000 выборках","ax_x":"доля варианта у потомка, %","ax_y":"число выборок","m_mean":"Средняя доля","m_sd":"Разброс (стандартное отклонение)","m_ext":"Потомков с долей ≤ 20 % или ≥ 80 %","notes":["При большой выборке доли у потомков близки к материнским 50 %.","При малой выборке разброс резко больше: у заметной части потомков доля варианта 20 % и ниже или 80 % и выше, хотя совсем крайние значения редки. Средняя по-прежнему около 50 %: без отбора направленного сдвига нет."],"fixed":"Модель без отбора; эффективный размер выборки условен. Функция клетки при той или иной доле здесь не показана — это отдельная зависимость (порог)."}}},{"id":"genetic-tests","number":28,"section":3,"title":"Как разделяют ядерный и митохондриальный вклад в дефект","question":4,"questions":[4],"keywords":["определение гетероплазмии","секвенирование","NGS","число копий мтДНК","qPCR","отдельные клетки","лазерная микродиссекция","цибриды","ρ⁰-реципиент","ядерный фон"],"lead":["Чтобы понять, вызван ли дефект ядерным геном или вариантом мтДНК, измеряют долю варианта, число копий мтДНК и проверяют, переносится ли дефект вместе с мтДНК в клетки с другим ядром — [[T67|цибриды]].","Средняя доля варианта в ткани и его распределение по отдельным клеткам — разные величины."],"mechanism":["Долю варианта определяют секвенированием: из числа прочтений с вариантом и без него рассчитывают его долю в образце.","Число копий мтДНК на клетку оценивают количественной ПЦР: при двух копиях ядерной мишени на диплоидную клетку оно равно 2 × Qмт / Qядр; отдельные клетки анализируют после лазерной микродиссекции или одноклеточными методами.","Цибрид получают, перенося митохондрии донора в ρ⁰-клетки с другим ядром. Если состав и число копий мтДНК сопоставимы, сохранение дефекта поддерживает предположение о вкладе мтДНК донора; исчезновение дефекта совместимо с ядерной причиной, но само по себе её не доказывает."],"paragraphs":["Долю варианта мтДНК в образце определяют секвенированием. При глубоком секвенировании каждая позиция прочитывается многократно, и доля прочтений с вариантом оценивает долю молекул с ним. Это средняя величина для всех клеток образца: ткань с 50 % варианта может состоять из клеток с разной долей — почти без варианта и почти целиком с вариантом.","Число копий мтДНК оценивают количественной ПЦР: сравнивают количество митохондриальной мишени Qмт с количеством ядерной мишени Qядр. Если ядерная мишень представлена двумя копиями на диплоидную клетку, число копий мтДНК на клетку равно 2 × Qмт / Qядр; при расчёте учитывают эффективность амплификации обеих мишеней. Для анализа отдельных клеток их вырезают из среза ткани лазерной микродиссекцией; современные одноклеточные методы позволяют одновременно определять варианты мтДНК и экспрессию генов в тысячах клеток (Nitsch 2024).","Цибриды позволяют исследовать вклад двух геномов. ρ⁰-клетки с выбранным ядром сливают с безъядерными фрагментами клеток донора, несущими его митохондрии (King 1989). В цибриде мтДНК донора работает на фоне ядра реципиента. Если состав и число копий мтДНК сопоставимы с исходными, сохранение дефекта поддерживает предположение о вкладе мтДНК. Исчезновение дефекта совместимо с ядерной причиной, но может зависеть и от взаимодействия мтДНК с новым ядерным фоном, поэтому по одному исходу переноса единственную причину не устанавливают.","В реальном эксперименте нужны проверки: ядерного происхождения цибрида, числа копий и состава мтДНК, условий культивирования. Цибриды разных клонов с одинаковой мтДНК тоже могут различаться."],"trap":["Цибрид переносит одновременно ядро пациента и мтДНК в неизменном виде.","В цибрид переносят митохондрии и мтДНК донора, а ядро принадлежит реципиенту (ρ⁰-клетке). Если единственная причина дефекта — ядерный ген донора, нормальное ядро реципиента обеспечивает функцию, и дефект не воспроизводится; если причина — вариант мтДНК, дефект обычно воспроизводится. В реальном исследовании исход оценивают с контролем ядерного фона, состава и числа копий мтДНК."],"conditions":"Принципиальные схемы методов, не данные экспериментов. Мысленный эксперимент вопроса: единственная заданная причина — ядерный дефект, мтДНК донора нормальна, ядро реципиента нормальное; это не гарантия для реального неконтролируемого переноса. Получение ρ⁰-клеток и цибридов — King 1989; одноклеточные методы — Nitsch 2024; общая логика диагностики — Russell 2020.","sources":["Russell2020","Nitsch2024","King1989"],"quiz":{"id":"S9-L28","rev":1,"question":"Единственная заданная причина дефекта комплекса I — мутация ядерного гена; мтДНК донора нормальна. Её перенесли в ρ⁰-клетки с нормальным ядром и получили цибриды с обычным числом копий мтДНК. Ожидается ли перенос исходного дефекта?","options":[{"text":"Ожидается: донорские митохондрии сохраняют дефект независимо от ядра реципиента.","correct":false,"feedback":"При заданной ядерной причине функция зависит от нормального ядерного фона реципиента. Донорская мтДНК в условии нормальна.","id":"S9-L28-2"},{"text":"Ожидается: использование ρ⁰-реципиента необратимо исключает сборку комплекса I.","correct":false,"feedback":"После восстановления мтДНК ρ⁰-происхождение реципиента само по себе не означает необратимой невозможности сборки комплекса. В задаче заданы нормальное ядро и обычное число копий.","id":"S9-L28-3"},{"text":"Не ожидается: мутантный ядерный ген в цибриды не переносится.","correct":true,"feedback":"При заданной единственной причине нормальное ядро реципиента обеспечивает соответствующий ядерно кодируемый компонент. В реальном эксперименте нужны проверки ядерного фона, копийности и состава мтДНК.","id":"S9-L28-1"}]},"widget":{"kind":"gentest","title":"","s":{"title":"Как разделяют вклад ядра и мтДНК","status":"Принципиальная схема методов","m_label":"Метод","ms":["Доля варианта: секвенирование","Число копий: количественная ПЦР","Отдельные клетки","Цибрид"],"src_label":"Источник дефекта у донора","srcs":["Ядерный ген","Вариант мтДНК"],"a":{"dna":"ДНК образца","seq":"прочтения позиции","mut":"с вариантом","wt":"без варианта","res":"доля варианта\nв образце: 70 %","avg":"среднее по всем клеткам"},"b":{"mt":"митохондриальная мишень","nu":"ядерная мишень","ax_c":"цикл ПЦР →","ax_f":"сигнал","res":"копий на диплоидную клетку = 2 × Qмт / Qядр"},"c":{"tissue":"ткань: средняя доля 50 %","cells":"отдельные клетки","lo":"мало варианта","hi":"много варианта","lcm":"лазерная микродиссекция или одноклеточный анализ"},"d":{"donor":"клетки донора","cyto":"безъядерные фрагменты\n(митохондрии донора)","rho":"ρ⁰-клетка\n(нормальное ядро)","cyb":"цибрид","ok":"дефект не переносится","bad":"дефект переносится"},"notes":["Доля прочтений с вариантом оценивает долю молекул с вариантом в образце — среднюю по всем его клеткам.","Ядерная мишень представлена двумя копиями на диплоидную клетку, поэтому число копий мтДНК на клетку равно 2 × Qмт / Qядр. Количества мишеней определяют с учётом эффективности амплификации; само отношение Qмт / Qядр ещё не число копий на клетку.","Средняя доля 50 % может складываться из клеток почти без варианта и клеток почти целиком с вариантом; это видно только при анализе отдельных клеток.","Модельная развилка: единственная причина дефекта — ядерный вариант донора, мтДНК нормальна. Ядро в цибриде принадлежит реципиенту и обеспечивает функцию, поэтому дефект не воспроизводится.","Модельная развилка: причина дефекта — вариант мтДНК донора; он сохраняет действие на ядерном фоне реципиента, и дефект воспроизводится. В реальном эксперименте такой результат поддерживает предположение о вкладе мтДНК, но не доказывает единственную причину."],"fixed":"Схемы показывают логику измерения; числа условные."}}},{"id":"measurement-map","number":29,"section":4,"title":"Как выбрать величину, метод и контроль","question":null,"questions":[1,2,3,4],"keywords":["выбор метода","измеряемая величина","контроль","граница вывода","OCR","синтез ATP","Δψm","импорт","свободный Ca²⁺","доля варианта","число копий","причинность"],"lead":["Каждый вывод о митохондриях опирается на определённую измеряемую величину. Скорость потребления O₂, скорость синтеза ATP, Δψm, импорт белка, свободная [Ca²⁺], расстояние между мембранами, доля варианта и число копий мтДНК — разные величины, и каждую измеряют своим методом.","Чтобы проверить причинное предположение, нужны согласованные измерения нескольких величин и контроль, исключающий другие объяснения."],"mechanism":["Сначала формулируют предположение в виде цепочки: какое звено изменено и какие величины должны измениться вслед за ним.","Для каждой величины выбирают метод и контроль: например, олигомицин для ATP-связанного дыхания, FCCP для нулевого потенциала, цибрид для разделения ядерного и митохондриального вклада.","Одно измерение показывает изменение одной величины; причинную цепочку подтверждает согласованное изменение нескольких величин при вмешательстве в предполагаемое звено."],"paragraphs":["Методы предыдущих шагов отвечают на разные вопросы. Респирометрия измеряет потребление O₂, но не синтез ATP. Зонд TMRM отражает потенциал, но не импорт белка. Адресованный индикатор показывает свободную [Ca²⁺] в одном компартменте, но не расстояние между мембранами. Секвенирование даёт среднюю долю варианта в образце, но не функцию отдельной клетки.","Поэтому исследование начинают с вопроса: какое звено предположительно изменено и какие величины должны измениться вслед за ним? Если предполагается разобщение, ожидают одновременно ускорения дыхания, снижения Δp и снижения синтеза ATP. Если снижен расход ATP — замедления дыхания при сохранном сопряжении. Наблюдая только одну величину, эти варианты не различить.","Каждое измерение требует контроля. Для дыхания — немитохондриальный остаток и ответ на олигомицин; для потенциала — FCCP как нулевой уровень; для импорта — защита от протеазы и детергент; для генетического вклада — цибрид с известным ядром. Число изменившихся показателей само по себе ничего не доказывает: важно, чтобы они изменялись согласованно с предполагаемой цепочкой и чтобы вмешательство в предполагаемое звено воспроизводило результат.","Схема шага сводит вопросы, величины, методы, контроли и границы вывода в одну таблицу; принципиальные схемы методов показаны в соответствующих шагах."],"trap":["Чем больше разных маркеров изменилось, тем надёжнее доказана любая причинная цепочка.","Доказательность зависит не от числа изменившихся показателей, а от того, согласуются ли они с предполагаемой цепочкой и подтверждает ли её вмешательство в предполагаемое звено с контролями."],"conditions":"Сопоставление методов не является экспериментальным результатом. Связь величин и методов — Divakaruni 2014 (респирометрия), Gerencser 2012 (потенциал), Lim 2021 (Ca²⁺), Nitsch 2024 (генетический анализ отдельных клеток). Для численной оценки скорости синтеза ATP нужен самостоятельный измерительный или расчётный протокол.","sources":["Divakaruni2014","Gerencser2012","Lim2021","Nitsch2024"],"quiz":{"id":"S9-L29","rev":1,"question":"Нужно проверить предположение, что снижение синтеза ATP вызвано именно разобщением. Какое сопоставление наиболее содержательно?","options":[{"text":"Совместная оценка дыхания, синтеза ATP и состояния градиента с контролями.","correct":true,"feedback":"Разобщение связывает перенос электронов, Δp и использование энергии для ATP. Согласованная оценка этих величин проверяет предполагаемое звено, хотя причинный вывод всё равно зависит от вмешательства и контролей.","id":"S9-L29-2"},{"text":"Только определение содержания ATP: его снижение само по себе доказывает разобщение.","correct":false,"feedback":"Содержание ATP может снижаться из-за изменения образования или расхода. Однократное измерение содержания ATP не устанавливает причину его снижения.","id":"S9-L29-1"},{"text":"Только оценка дыхания: его ускорение само по себе доказывает разобщение.","correct":false,"feedback":"Ускорение дыхания возможно при увеличении потребления ATP и других изменениях. Без оценки сопряжения и контролей оно не выделяет разобщение.","id":"S9-L29-3"}]},"widget":{"kind":"cards","title":"","s":{"title":"Вопрос → величина → метод → контроль → граница вывода","status":"Сопоставление методов · не данные эксперимента","opts_label":"Исследовательский вопрос","opts":["Снижен ли синтез ATP из-за разобщения?","Нарушен ли импорт из-за деполяризации?","Меняет ли контакт с ЭПР вход Ca²⁺?","Вызван ли дефект вариантом мтДНК?"],"heads":["Величины","Методы","Контроль","Граница вывода"],"cards":[{"v":["потребление O₂; синтез ATP; Δψm или Δp","респирометрия с добавками; зонд TMRM; определение ATP","олигомицин, подобранная доза FCCP, немитохондриальный остаток","одно ускорение дыхания не различает разобщение и рост расхода ATP"],"note":"Разобщение предсказывает одновременно ускорение дыхания, снижение Δp и снижение синтеза ATP; проверяют все три величины."},{"v":["Δψm; импорт конкретного белка","зонд TMRM в режиме без гашения; импорт меченого предшественника","FCCP как нулевой потенциал; защита от протеазы, детергент","падение сигнала TMRM не измеряет импорт"],"note":"Деполяризацию и нарушение импорта подтверждают разными экспериментами и только потом связывают."},{"v":["расстояние между мембранами; свободная [Ca²⁺] в цитозоле и матриксе","электронная микроскопия или сенсор сближения; адресованные индикаторы","одинаковое высвобождение из ЭПР; Δψm; локализация и pH индикатора","геометрия контакта не измеряет поток Ca²⁺"],"note":"Структурное изменение контакта сопоставляют с функциональным сигналом Ca²⁺ при сопоставимых условиях."},{"v":["доля варианта; число копий; дыхательная функция","секвенирование; количественная ПЦР; цибриды, анализ отдельных клеток","ядро реципиента; число копий и состав мтДНК в цибриде","средняя доля в ткани не показывает функцию отдельной клетки"],"note":"Перенос дефекта вместе с мтДНК в цибрид с нормальным ядром указывает на вариант мтДНК."}],"fixed":"Таблица сопоставляет методы; она не заменяет эксперимент."}}},{"id":"integrated-case","number":30,"section":4,"title":"Почему кальциевый сигнал не устраняет любой дефект дыхательного аппарата","question":null,"questions":[1,2,3,4],"keywords":["интегрированный случай","дефект сборки","предельная мощность","Ca²⁺-сигнал","NADH","резерв","перегрузка"],"lead":["Объединим механизмы. Пусть мутация ядерного гена фактора сборки снизила предельную мощность дыхательной цепи, а субстраты и O₂ доступны. Может ли умеренный Ca²⁺-сигнал, ускоряющий дегидрогеназы, исправить дефект?","Нет: Ca²⁺ регулирует образование NADH, а ограничение задано сборкой комплексов. Усиление подачи электронов не создаёт недостающих комплексов."],"mechanism":["Ca²⁺ в матриксе активирует PDH, IDH3 и OGDH, и образование NADH ускоряется.","Перенос электронов ограничен числом собранных комплексов: дополнительный NADH может использоваться только в пределах остаточной мощности цепи.","Длительный сигнал добавляет к дефекту затраты потенциала на вход Ca²⁺ и риск перегрузки, а не устраняет дефект."],"paragraphs":["В этой задаче соединены все четыре вопроса. Генетическое звено: мутация ядерного гена фактора сборки уменьшила число собранных комплексов, то есть предельную мощность цепи. Энергетическое звено: мощность цепи определяет, какую Δp и какой синтез ATP митохондрия может поддерживать при данной нагрузке. Транспорт: от Δψm зависят импорт белков и вход Ca²⁺. Сигнальное звено: Ca²⁺ ускоряет образование NADH.","Если мощность цепи полная, умеренный сигнал Ca²⁺ помогает синтезу ATP следовать за потребностью: NADH образуется быстрее, а цепь способна окислить его. При дефекте сборки скорость окисления дополнительного NADH ограничена остаточной мощностью цепи. В покое резерва может хватать, и дефект почти не заметен; при нагрузке Δp и синтез ATP снижаются, а Ca²⁺ этого не исправляет, потому что регулирует другое звено.","Длительный сигнал добавляет новые затраты: вход каждого иона Ca²⁺ использует электрическую составляющую градиента, а накопление Ca²⁺ в матриксе повышает вероятность перехода проницаемости. При ограниченной мощности цепи митохондрии хуже компенсируют эти затраты.","Схема качественная и не предсказывает ни выживания клеток, ни тяжести болезни: исход зависит от конкретного варианта, остаточной мощности, ткани и нагрузки."],"trap":["Любое увеличение Ca²⁺ восстанавливает ATP при любом генетическом дефекте.","Ca²⁺ ускоряет образование NADH, но не восстанавливает сборку комплексов. При ограниченной мощности цепи дополнительный NADH используется только в пределах остаточного резерва, а длительный сигнал повышает риск перегрузки."],"conditions":"Качественная учебная схема. В задаче ограничение задано сборкой дыхательного аппарата, а не недостатком субстратов; нет утверждения о любой мутации или любом Ca²⁺-ответе. Регуляция дегидрогеназ Ca²⁺ — Denton 2009; генетические дефекты сборки — Russell 2020; перегрузка Ca²⁺ — Lim 2021.","sources":["Denton2009","Russell2020","Lim2021"],"quiz":{"id":"S9-L30","rev":1,"question":"Ядерный дефект сборки ограничил максимальную мощность дыхательного аппарата; субстраты и O₂ доступны. Умеренный Ca²⁺-сигнал активировал матричные ферменты. Устраняет ли это само по себе дефект сборки?","options":[{"text":"Да: активация матричных ферментов сама по себе восстанавливает сборку комплексов.","correct":false,"feedback":"Изменение активности матричных ферментов не заменяет нарушенный этап сборки. В условии первичное ограничение задано именно сборкой.","id":"S9-L30-1"},{"text":"Да: повышение образования NADH полностью компенсирует ограничение мощности цепи.","correct":false,"feedback":"Дополнительный NADH не устраняет заданный предел мощности дыхательного аппарата. Компенсация возможна лишь в пределах сохранных звеньев и резерва.","id":"S9-L30-2"},{"text":"Нет: усиление образования NADH само по себе не устраняет нарушение сборки комплексов.","correct":true,"feedback":"Регуляция образования NADH и сборка комплексов — разные звенья. Ответ на Ca²⁺ может зависеть от остаточной функции, но из активации ферментов не следует устранение первичного дефекта.","id":"S9-L30-3"}]},"widget":{"kind":"net","title":"","s":{"title":"Ca²⁺ регулирует подачу электронов, но не сборку комплексов","status":"Схема механизма · качественные состояния","ctrls":[{"id":"cap","type":"group","label":"Мощность дыхательной цепи","opts":["Нормальная","Снижена дефектом сборки"]},{"id":"sig","type":"group","label":"Сигнал Ca²⁺","opts":["Умеренный кратковременный","Длительный"]}],"W":560,"H":340,"NW":560,"NH":340,"lg":{"title":"Обозначения на схеме","act":"активирует, ускоряет","inh":"тормозит, ингибирует","phos":"фосфорилирование (смысл — у мишени)","tr":"перенос вещества или иона через мембрану","rx":"химическое превращение","eq":"перенос электронов","bind":"связывание, контакт","seq":"порядок событий, путь белка","dash":"косвенная, условная или возможная связь","nodes":["жёлтая рамка — работает, усилено","пунктирная рамка — не работает, снижено","× — белка или реакции нет"]},"zones":[{"x":6,"y":6,"w":548,"h":330,"c":"mito","t":"митохондрия","lx":548,"ly":326,"a":"end"}],"mem":[],"nodes":{"ca":{"p":[110,46,170,36],"t":"Ca²⁺ в матриксе","n":[110,46,170,36],"fs":16},"dh":{"p":[110,140,190,48],"t":"дегидрогеназы\n(PDH, IDH3, OGDH)","n":[110,140,190,48],"fs":14},"nadh":{"p":[110,234,90,36],"t":"NADH","n":[110,234,90,36],"fs":17},"asm":{"p":[440,46,180,48],"t":"ядерный дефект\nсборки","n":[440,46,180,48],"fs":15},"chain":{"p":[390,234,220,48],"t":"дыхательная цепь:\nпредельная мощность","n":[390,234,220,48],"fs":14},"dp":{"p":[390,312,220,44],"t":"Δp → синтез ATP,\nимпорт","n":[390,312,220,44],"fs":14},"ptp":{"p":[290,130,160,44],"t":"риск перехода\nпроницаемости","n":[290,130,160,44],"fs":14}},"edges":{"c1":{"a":"ca","b":"dh","k":"act"},"c2":{"a":"dh","b":"nadh","k":"rx"},"c3":{"a":"nadh","b":"chain","k":"eq","t":"e⁻","d":[0,-14]},"a1":{"a":"asm","b":"chain","k":"inh","t":"ограничивает","d":[70,0],"anc":"start"},"c4":{"a":"chain","b":"dp","k":"tr","t":"H⁺","d":[14,0],"anc":"start"},"o1":{"a":"ca","b":"ptp","k":"act","t":"перегрузка","d":[30,-12],"dash":true}},"st":{"0-0":{"n":{"ca":"on","dh":"on","nadh":"on","asm":"hide","chain":"on","dp":"on","ptp":"base"},"e":{"a1":"hide","o1":"hide"},"m":[["Образование NADH","увеличено"],["Предельная мощность цепи","полная"],["Синтез ATP","может возрасти по потребности"],["Риск перехода проницаемости","низкий"]],"note":"При полной мощности цепи умеренный сигнал Ca²⁺ ускоряет образование NADH, и цепь может использовать дополнительные электроны: синтез ATP следует за потребностью."},"0-1":{"n":{"ca":"on","dh":"on","nadh":"on","asm":"hide","chain":"base","dp":"base","ptp":"on"},"e":{"a1":"hide"},"m":[["Образование NADH","увеличено"],["Предельная мощность цепи","полная"],["Синтез ATP","под угрозой при перегрузке"],["Риск перехода проницаемости","повышен"]],"note":"Длительный сигнал при полной мощности цепи: дегидрогеназы активированы, но Ca²⁺ накапливается, растут затраты Δψm на его вход и риск перехода проницаемости."},"1-0":{"n":{"ca":"on","dh":"on","nadh":"on","asm":"on","chain":"low","dp":"base","ptp":"base"},"e":{"o1":"hide"},"m":[["Образование NADH","увеличено"],["Предельная мощность цепи","снижена дефектом сборки"],["Синтез ATP","ограничен остаточной мощностью"],["Риск перехода проницаемости","низкий"]],"note":"Мощность цепи ограничена дефектом сборки. Ca²⁺ ускоряет образование NADH, но перенос электронов ограничен мощностью цепи: сборка не восстанавливается, и синтез ATP возрастает лишь в пределах остаточного резерва."},"1-1":{"n":{"ca":"on","dh":"on","nadh":"on","asm":"on","chain":"low","dp":"base","ptp":"on"},"e":{},"m":[["Образование NADH","увеличено"],["Предельная мощность цепи","снижена дефектом сборки"],["Синтез ATP","ограничен, под угрозой при перегрузке"],["Риск перехода проницаемости","повышен"]],"note":"Длительный сигнал при ограниченной мощности: NADH образуется быстрее, чем ограниченная цепь способна его окислять, Δψm хуже поддерживается, а накопление Ca²⁺ повышает риск перехода проницаемости."}},"fs":17,"nfs":17,"lfs":17,"zfs":16}}}],"sections":[{"title":"Хемиосмотическое сопряжение","entry":"chemiosmosis","sub":"Как перенос электронов связан с синтезом ATP"},{"title":"Потенциал и транспорт","entry":"membrane-potential","sub":"Как внутренняя мембрана обеспечивает импорт и обмен"},{"title":"Ca²⁺ и контакты с ЭПР","entry":"calcium-contacts","sub":"Как кальциевый сигнал меняет метаболизм и когда возникает перегрузка"},{"title":"Два генома и гетероплазмия","entry":"dual-genome","sub":"Как экспрессия генов и состав мтДНК определяют дыхательную функцию"},{"title":"Исследование","entry":"measurement-map","sub":"Как связаны дыхание, транспорт, Ca²⁺ и генетический дефект","integr":true}],"glossary":[{"id":"S9-T01","term":"Хемиосмотическое сопряжение","section":0,"def":"Связь переноса электронов и синтеза ATP через электрохимический градиент ионов на мембране. В митохондриях это градиент H⁺: дыхательные комплексы создают его, а ATP-синтаза использует; сами комплексы I–IV ATP не образуют."},{"id":"S9-T02","term":"Окислительное фосфорилирование","section":0,"def":"Синтез ATP из ADP и неорганического фосфата, сопряжённый с окислением субстратов в дыхательной цепи через протондвижущую силу. Отличается от субстратного фосфорилирования, при котором фосфатная группа переходит на ADP непосредственно в ферментативной реакции."},{"id":"S9-T03","term":"Дыхательная цепь","section":0,"def":"Система переносчиков электронов внутренней мембраны митохондрий (комплексы I–IV, убихинон, цитохром c), передающая электроны от NADH и сукцината к O₂. ATP-синтаза в путь электронов не входит; её иногда называют комплексом V системы окислительного фосфорилирования."},{"id":"S9-T04","term":"Матрикс митохондрии","section":0,"def":"Внутренний водный компартмент митохондрии, ограниченный внутренней мембраной. Здесь работают цикл трикарбоновых кислот, ферменты окисления жирных кислот, мтДНК и миторибосомы. Концентрации веществ в матриксе могут сильно отличаться от средних по клетке."},{"id":"S9-T05","term":"Межмембранное пространство","section":0,"def":"Компартмент между наружной и внутренней мембранами митохондрии. Его состав по малым ионам близок к цитозольному, потому что наружная мембрана для них проницаема, но белки межмембранного пространства (например, цитохром c) в цитозоль в норме не выходят."},{"id":"S9-T06","term":"Внутренняя мембрана митохондрии","section":0,"def":"Мембрана, отделяющая матрикс от межмембранного пространства; содержит дыхательные комплексы, ATP-синтазу и переносчики. Она плохо проницаема для H⁺ и большинства ионов, в отличие от наружной мембраны."},{"id":"S9-T07","term":"Электрохимический градиент H⁺","section":0,"def":"Различие электрохимического потенциала H⁺ по разные стороны мембраны. Складывается из разности концентраций H⁺ (химическая составляющая, ΔpH) и разности электрических потенциалов (электрическая составляющая, Δψm)."},{"id":"S9-T08","term":"Протондвижущая сила, Δp","section":0,"def":"Электрохимическая движущая сила входа H⁺ в матрикс, выраженная в милливольтах. В этом семинаре Δp — положительная величина: при обычной полярности мембраны и более щелочном матриксе Δp = |Δψm| + (2,303RT/F)·ΔpH; при 37 °C множитель около 61,5 мВ на единицу pH. Сам Δψm (матрикс относительно межмембранного пространства) остаётся отрицательным: при Δψm = −139 мВ и ΔpH ≈ 0,57 величина Δp составляет около 174 мВ. Обе составляющие направляют H⁺ в матрикс."},{"id":"S9-T09","term":"ΔpH","section":0,"def":"Разность pH матрикса и межмембранного пространства: ΔpH = pH матрикса − pH межмембранного пространства. Матрикс щелочнее, то есть концентрация H⁺ в нём ниже. Чтобы сложить ΔpH с мембранным потенциалом, его умножают на 2,303RT/F."},{"id":"S9-T10","term":"Убихинон, коэнзим Q","section":0,"def":"Подвижный липофильный переносчик электронов и протонов во внутренней мембране. Принимает электроны от комплексов I и II (и других дегидрогеназ) и передаёт их комплексу III; восстановленная форма — убихинол (QH₂). Сам убихинон через мембрану H⁺ не перекачивает."},{"id":"S9-T11","term":"Цитохром c","section":0,"def":"Небольшой гемсодержащий белок межмембранного пространства, переносящий электроны от комплекса III к комплексу IV. Через неповреждённую наружную мембрану он не проходит; его выход в цитозоль — признак пермеабилизации наружной мембраны."},{"id":"S9-T12","term":"Комплекс II, сукцинатдегидрогеназа","section":0,"def":"Ферментный комплекс внутренней мембраны, окисляющий сукцинат в цикле трикарбоновых кислот и передающий электроны через связанный FAD и железосерные центры на убихинон. Комплекс II H⁺ через мембрану не переносит; все его субъединицы у человека кодирует ядро."},{"id":"S9-T13","term":"ATP-синтаза, F₀F₁","section":0,"def":"Ферментный комплекс внутренней мембраны. Мембранная часть F₀ включает вращающееся c-кольцо и неподвижную субъединицу a с двумя водными полуканалами: один открыт в межмембранное пространство, другой — в матрикс. H⁺ переносится кольцом от одного полуканала к другому, а не проходит через общий сквозной канал. Каталитическая часть F₁ синтезирует ATP из ADP и Pi. При низкой протондвижущей силе и наличии ATP фермент может работать в обратном режиме — гидролизовать ATP и выводить H⁺ из матрикса."},{"id":"S9-T14","term":"Роторный катализ","section":0,"def":"Сопряжение вращения части ферментного комплекса с изменениями состояний его каталитических центров. В ATP-синтазе поток H⁺ вращает c-кольцо и γ-субъединицу, а она поочерёдно меняет конформацию трёх β-субъединиц F₁. Для кольца c₈ млекопитающих шаг кольца (45°, один H⁺) меньше поворота γ на 120°, после которого состояния центров β сменяются."},{"id":"S9-T15","term":"Дыхательный контроль","section":0,"def":"Зависимость скорости митохондриального дыхания от использования протондвижущей силы — прежде всего для фосфорилирования ADP. На изолированных митохондриях выражают отношением скоростей дыхания с добавленным ADP и после его исчерпания (состояние 3 / состояние 4) в определённом протоколе."},{"id":"S9-T16","term":"Разобщение","section":0,"def":"Снижение сопряжения переноса электронов с синтезом ATP, когда H⁺ возвращается в матрикс в обход ATP-синтазы. Это не блок дыхательной цепи; при подобранной дозе разобщителя дыхание ускоряется, а при избытке может снижаться."},{"id":"S9-T17","term":"Протонная утечка","section":0,"def":"Возврат H⁺ в матрикс через внутреннюю мембрану без участия ATP-синтазы. Это поток (скорость), а не количество H⁺; в клетках его оценивают по дыханию, сохраняющемуся после олигомицина."},{"id":"S9-T18","term":"UCP1","section":0,"def":"Разобщающий белок 1 внутренней мембраны бурых адипоцитов. При активации термогенеза увеличивает протонную проводимость мембраны, и энергия окисления выделяется в виде теплоты. Это регулируемый белок, а не постоянный неспецифический разрыв мембраны."},{"id":"S9-T19","term":"Олигомицин","section":0,"def":"Ингибитор мембранной части F₀ ATP-синтазы, прекращающий поток H⁺ через фермент. В митохондриях, синтезирующих ATP, вызывает небольшую гиперполяризацию и замедление дыхания; если синтаза работала в обратном режиме, вызывает деполяризацию."},{"id":"S9-T20","term":"FCCP","section":0,"def":"Протонофор (карбонилцианид-п-трифторметоксифенилгидразон) — липофильная слабая кислота, переносящая H⁺ через мембраны и рассеивающая градиент. Дозу для дыхательного теста подбирают титрованием; FCCP действует на все мембраны клетки, а не только на митохондриальные."},{"id":"S9-T21","term":"Скорость потребления O₂, OCR","section":0,"def":"Количество O₂, потребляемое образцом за единицу времени, с указанной нормировкой (на число клеток, белок, ДНК). Включает митохондриальное и немитохондриальное потребление; это не скорость синтеза ATP."},{"id":"S9-T22","term":"Отношение P/O","section":0,"def":"Число молекул ATP, синтезированных на один атом восстановленного кислорода (половину молекулы O₂). Для субстратов NADH в изолированных митохондриях обычно приводят около 2,5, для сукцината — около 1,5; значение зависит от субстрата и условий."},{"id":"S9-T23","term":"Мембранный потенциал, Δψm","section":1,"def":"Электрическая разность потенциалов на внутренней мембране митохондрии; здесь Δψm = ψ матрикса − ψ межмембранного пространства. В работающей митохондрии матрикс заряжен отрицательно, и Δψm — отрицательное число (в клетках порядка −120…−160 мВ)."},{"id":"S9-T24","term":"Модуль мембранного потенциала, |Δψm|","section":1,"def":"Абсолютная величина мембранного потенциала, всегда неотрицательная. Удобна для шкал: деполяризация — уменьшение |Δψm|, гиперполяризация — его увеличение."},{"id":"S9-T25","term":"Деполяризация","section":1,"def":"Уменьшение модуля мембранного потенциала, например переход от −160 к −100 мВ. Деполяризация может быть частичной и не обязательно означает Δψm = 0."},{"id":"S9-T26","term":"Гиперполяризация","section":1,"def":"Увеличение модуля отрицательного мембранного потенциала, например переход от −140 к −170 мВ. По одной гиперполяризации нельзя судить о синтезе ATP: она возникает, например, когда олигомицин прекращает использование градиента."},{"id":"S9-T27","term":"ANT, ADP/ATP-переносчик","section":1,"def":"Переносчик внутренней мембраны (транслоказа адениновых нуклеотидов), обменивающий ADP и ATP один на один. В обычном режиме ATP⁴⁻ выходит из матрикса, ADP³⁻ входит; обмен электрогенен и использует Δψm. При иных условиях возможен обратный обмен."},{"id":"S9-T28","term":"PiC, фосфатный переносчик","section":1,"def":"Переносчик неорганического фосфата во внутренней мембране. Переносит фосфат вместе с H⁺ (или в обмен на OH⁻) без переноса суммарного заряда, поэтому использует ΔpH, а не Δψm; в отличие от ANT он электронейтрален."},{"id":"S9-T29","term":"Белок-предшественник","section":1,"def":"Форма белка до завершения транспорта и созревания. Для митохондриальных белков — полипептид, синтезированный в цитозоле, часто с отщепляемой сигнальной последовательностью, которая определяет его путь и конечный компартмент."},{"id":"S9-T30","term":"N-концевая сигнальная последовательность","section":1,"def":"Участок на N-конце белка-предшественника, направляющий его по пути TOM–TIM23. Обычно образует амфипатическую спираль с несколькими положительно заряженными остатками и отщепляется в матриксе протеазой MPP. Не все митохондриальные белки имеют такой сигнал."},{"id":"S9-T31","term":"TOM","section":1,"def":"Транслоказа наружной мембраны митохондрии — общий вход для большинства ядерно кодируемых митохондриальных белков. После TOM белки распределяются по разным путям в зависимости от своих сигналов."},{"id":"S9-T32","term":"TIM23","section":1,"def":"Транслоказа внутренней мембраны, переносящая в матрикс белки с N-концевой сигнальной последовательностью и встраивающая часть белков во внутреннюю мембрану. Название дано по субъединице Tim23, но путь цепи, по данным на дрожжах, связан прежде всего с субъединицей Tim17."},{"id":"S9-T33","term":"PAM и mtHsp70","section":1,"def":"Импортный мотор на матриксной стороне транслоказы TIM23. Его ATPаза — шаперон mtHsp70: циклы гидролиза ATP позволяют удерживать и протягивать цепь в матрикс. Tim44 связывает mtHsp70 с транслоказой, Pam18 стимулирует его ATPазную активность; сами они не ATPазы."},{"id":"S9-T34","term":"TIM22","section":1,"def":"Транслоказа внутренней мембраны, встраивающая многопроходные белки-переносчики семейства SLC25 (например, ANT) с внутренними сигналами. Эти белки доставляют к TIM22 малые белки TIM межмембранного пространства."},{"id":"S9-T35","term":"OXA1L","section":1,"def":"Инсертаза внутренней мембраны человека, встраивающая белки со стороны матрикса — прежде всего 13 белков, синтезируемых на миторибосомах (встраивание идёт одновременно с синтезом). Дрожжевой гомолог называется Oxa1."},{"id":"S9-T36","term":"Клетки ρ⁰","section":1,"def":"Клетки, лишённые мтДНК. Митохондрии в них сохраняются, но дыхательная цепь и полноценная ATP-синтаза не собираются; пониженный мембранный потенциал поддерживается обменом ATP⁴⁻/ADP³⁻ через ANT и гидролизом ATP неполной ATP-синтазой. Используются как реципиенты при получении цибридов."},{"id":"S9-T37","term":"PINK1","section":1,"def":"Киназа, которая в здоровой митохондрии импортируется через TOM и TIM23 и расщепляется. При деполяризации импорт нарушается, и PINK1 накапливается на наружной мембране, участвуя в контроле качества митохондрий (подробно — в семинаре 12). Накопление PINK1 не означает неизбежной гибели клетки."},{"id":"S9-T38","term":"TMRM и TMRE","section":1,"def":"Липофильные катионные флуоресцентные зонды, распределяющиеся через плазматическую и внутреннюю мембраны в соответствии с их потенциалами. Интенсивность зависит также от режима (с гашением или без), массы митохондрий и потенциала плазматической мембраны; для милливольт нужна калибровка."},{"id":"S9-T39","term":"Мембранный контакт ЭПР и митохондрии","section":2,"def":"Участок, где мембраны ЭПР и наружная мембрана митохондрии сближены на расстояние порядка 10–50 нм и связаны белками. Органеллы сохраняют свои мембраны: это не слияние и не сплошной канал из ЭПР в матрикс."},{"id":"S9-T40","term":"MAM","section":2,"def":"Митохондрия-ассоциированные мембраны ЭПР — участки ЭПР, прилегающие к митохондриям; так же называют биохимическую фракцию, выделяемую при фракционировании. Фракция не тождественна каждому участку контакта в живой клетке."},{"id":"S9-T41","term":"Локальная микрообласть Ca²⁺","section":2,"def":"Небольшая область повышенной свободной концентрации Ca²⁺ около открытого канала, из которого выходит Ca²⁺. Концентрация в ней может в десятки раз превышать среднюю по цитозолю и быстро убывает с расстоянием."},{"id":"S9-T42","term":"IP₃R","section":2,"def":"Рецептор инозитол-1,4,5-трисфосфата — Ca²⁺-канал мембраны ЭПР, открывающийся при связывании IP₃. Высвобождает Ca²⁺ в цитозоль; прямого непрерывного канала от IP₃R к MCU нет."},{"id":"S9-T43","term":"VDAC","section":2,"def":"Потенциалзависимые анионные каналы наружной мембраны митохондрии, через которые проходят метаболиты и малые ионы, в том числе Ca²⁺. Для перехода проницаемости VDAC не обязательны."},{"id":"S9-T44","term":"MCU","section":1,"def":"Порообразующий белок митохондриального Ca²⁺-унипортера во внутренней мембране. Это высокоизбирательный Ca²⁺-канал: ион проходит по электрохимическому градиенту без гидролиза ATP. У млекопитающих для работы поры нужен EMRE, а регулируют её MICU1 и MICU2."},{"id":"S9-T45","term":"MICU1 и MICU2","section":2,"def":"Ca²⁺-связывающие регуляторные белки унипортера со стороны межмембранного пространства. Их димер ограничивает проводимость MCU при низкой [Ca²⁺] и снимает ограничение, связав Ca²⁺. Сами они каналов не образуют и не являются копиями одного белка."},{"id":"S9-T46","term":"NCLX","section":2,"def":"Белок внутренней мембраны (ген SLC8B1), которому с 2010 г. приписывают митохондриальный Na⁺/Ca²⁺-обмен — основной Na⁺-зависимый путь выхода Ca²⁺ из матрикса: Ca²⁺ выходит, Na⁺ входит. По данным 2025–2026 гг. Na⁺-зависимый выход сохраняется в части линий клеток без NCLX, для самого NCLX предложен обмен Ca²⁺ на H⁺ (по другим данным — на Na⁺, K⁺ или Li⁺), а Na⁺/Ca²⁺-обмен связывают также с белком TMEM65; вопрос обсуждается. В моделях семинара «NCLX» означает Na⁺-зависимый выход Ca²⁺ в классической интерпретации."},{"id":"S9-T47","term":"SERCA","section":2,"def":"Ca²⁺-ATPаза мембраны ЭПР (у мышечных клеток — саркоплазматического ретикулума), использующая энергию гидролиза ATP для переноса Ca²⁺ из цитозоля в просвет. В отличие от канала MCU, это насос."},{"id":"S9-T48","term":"PDP1","section":2,"def":"Ca²⁺-чувствительная изоформа фосфатазы пируватдегидрогеназного комплекса. Снимает ингибирующее фосфорилирование субъединицы E1 и тем повышает активность комплекса. Вторая изоформа, PDP2, к Ca²⁺ нечувствительна."},{"id":"S9-T49","term":"Свободная и общая концентрации Ca²⁺","section":2,"def":"Свободная [Ca²⁺] — концентрация несвязанных ионов в данном компартменте; её регистрируют Ca²⁺-индикаторы. Общее количество Ca²⁺ включает и Ca²⁺, связанный буферами, в матриксе прежде всего фосфатом. Количество и концентрация — величины разной размерности. Разделив общее количество на объём матрикса, получают общую концентрацию; её можно численно сравнивать со свободной, и она может быть во много раз больше."},{"id":"S9-T50","term":"Кальциевая перегрузка","section":2,"def":"Накопление Ca²⁺ в матриксе, сопровождающееся нарушением функции митохондрии. Общее количество Ca²⁺ растёт, когда вход превышает выход; связывание буферами перераспределяет Ca²⁺ внутри матрикса и ограничивает рост свободной концентрации, но не выводит его. Универсального численного порога для всех клеток нет."},{"id":"S9-T51","term":"Митохондриальный переход проницаемости, mPT","section":2,"def":"Резкое увеличение проницаемости внутренней мембраны для растворённых веществ массой примерно до 1,5 кДа; вызывается накоплением Ca²⁺, особенно вместе с фосфатом и окислительным стрессом, облегчается циклофилином D. Пору, обеспечивающую переход, называют mPTP; её молекулярный состав обсуждается."},{"id":"S9-T52","term":"MOMP","section":2,"def":"Пермеабилизация наружной мембраны митохондрии, при внутреннем пути апоптоза — белками BAX и BAK. Через неё в цитозоль выходят белки межмембранного пространства, в том числе цитохром c. Не тождественна переходу проницаемости внутренней мембраны."},{"id":"S9-T53","term":"Двойной генетический контроль","section":3,"def":"Зависимость сборки и работы митохондриального аппарата от продуктов ядерного и митохондриального геномов. Каждая субъединица кодируется одним из двух геномов, а комплексы I, III, IV и V содержат субъединицы обоих происхождений."},{"id":"S9-T54","term":"Митохондриальная ДНК, мтДНК","section":3,"def":"Собственный геном митохондрий; у человека — кольцевая молекула около 16,6 тыс. пар нуклеотидов, кодирующая 13 белков, 22 тРНК и 2 рРНК. Число генов и организация генома у разных организмов различаются."},{"id":"S9-T55","term":"Нуклеоид","section":3,"def":"Комплекс мтДНК с белками, прежде всего TFAM, участвующими в её упаковке, репликации и транскрипции. Число нуклеоидов, число молекул мтДНК и число митохондрий — разные величины."},{"id":"S9-T56","term":"TFAM","section":3,"def":"Ядерно кодируемый белок, который импортируется в матрикс, упаковывает мтДНК в нуклеоиды и участвует в её транскрипции и поддержании. TFAM не регулирует транскрипцию ядерных генов."},{"id":"S9-T57","term":"POLG, POLG2 и TWNK","section":3,"def":"Ядерные гены белков, реплицирующих мтДНК: POLG — каталитической субъединицы ДНК-полимеразы γ, POLG2 — её вспомогательной субъединицы, TWNK — хеликазы (белок Twinkle). Их дефекты могут вызывать истощение мтДНК или её множественные делеции."},{"id":"S9-T58","term":"PGC-1α","section":3,"def":"Коактиватор транскрипции, усиливающий действие ядерных факторов (в том числе NRF1 и NRF-2) на гены митохондриальных белков и участвующий в регуляции митохондриального биогенеза. Сам с ДНК специфически не связывается."},{"id":"S9-T59","term":"NRF-2/GABP и NRF2/NFE2L2","section":3,"def":"Разные транскрипционные регуляторы со сходными названиями. NRF-2 (GABP) — ядерный дыхательный фактор, активирующий гены митохондриальных белков. NRF2 (NFE2L2) — фактор ответа на окислительный и электрофильный стресс, регулирующий антиоксидантные гены (подробнее — в семинаре 10)."},{"id":"S9-T60","term":"Гетероплазмия","section":3,"def":"Сосуществование в клетке или образце более одного варианта последовательности мтДНК. Нужно указывать, идёт ли речь о клетке или о ткани и долю какого варианта определяют; не всякий вариант патогенен."},{"id":"S9-T61","term":"Гомоплазмия","section":3,"def":"Состояние, при котором все анализируемые молекулы мтДНК несут один вариант в рассматриваемой позиции (с учётом чувствительности анализа). Гомоплазмия не означает автоматически нормальной функции."},{"id":"S9-T62","term":"Доля варианта мтДНК","section":3,"def":"Отношение числа молекул мтДНК с выбранным вариантом к общему числу проанализированных молекул. Это не доля клеток с дефектом, не доля митохондрий и не число копий на клетку."},{"id":"S9-T63","term":"Число копий мтДНК","section":3,"def":"Число молекул мтДНК в клетке или в образце в расчёте на выбранную единицу, например на диплоидный ядерный геном. Оценивается, в частности, количественной ПЦР: при двух копиях ядерной мишени на диплоидную клетку число копий мтДНК на клетку равно 2 × Qмт / Qядр, где Qмт и Qядр — количества митохондриальной и ядерной мишеней."},{"id":"S9-T64","term":"Порог гетероплазмии","section":3,"def":"Доля определённого варианта мтДНК, при которой в выбранной системе проявляется заданное функциональное нарушение. Зависит от варианта, ткани, показателя, критерия и числа копий; это не общий клинический норматив."},{"id":"S9-T65","term":"Митотическая сегрегация","section":3,"def":"Изменение распределения вариантов мтДНК между дочерними клетками в ряду делений, обусловленное случайным распределением копий и независимой репликацией молекул. Направленный отбор — отдельный процесс."},{"id":"S9-T66","term":"Генетическое бутылочное горлышко","section":3,"def":"Этап передачи мтДНК в зародышевой линии, на котором передаётся небольшое эффективное число единиц; из-за этого доли варианта у потомков одной матери сильно различаются. Эффективный размер — параметр разброса, а не подсчёт молекул; с биохимическим порогом не связан."},{"id":"S9-T67","term":"Цибрид","section":3,"def":"Клетка, сочетающая ядро реципиента (обычно ρ⁰-клетки) с митохондриями и мтДНК донора. Позволяет проверить, переносится ли дефект вместе с мтДНК; требует контроля ядерного происхождения, числа копий и состава мтДНК."},{"id":"S9-T68","term":"Митохондриальный биогенез","section":3,"def":"Совокупность процессов синтеза, импорта и сборки компонентов митохондрий и поддержания их генетического аппарата. Не измеряется одним числом митохондрий или одним маркером."},{"id":"S9-T69","term":"Антероградная и ретроградная сигнализация","section":3,"def":"Антероградная сигнализация — регуляция митохондрий ядром (через экспрессию ядерных генов митохондриальных белков); ретроградная — изменение экспрессии ядерных генов в ответ на состояние митохондрий. Стрелка такой связи означает передачу сигнала, а не перенос генома."},{"id":"S9-T70","term":"mitoKATP и mitoBK","section":1,"def":"K⁺-каналы внутренней мембраны митохондрий. mitoKATP подавляется ATP; его образуют порообразующая субъединица MITOK и ATP-связывающая субъединица MITOSUR. mitoBK — Ca²⁺-активируемый K⁺-канал большой проводимости, продукт гена KCNMA1 с вставкой, направляющей белок в митохондрии. Вход K⁺ по потенциалу вносит положительный заряд и вместе с водой увеличивает объём матрикса; значение этих каналов в разных тканях продолжают исследовать."},{"id":"S9-T71","term":"Рианодиновые рецепторы (RyR)","section":2,"def":"Ca²⁺-каналы мембраны ЭПР и саркоплазматического ретикулума, высвобождающие Ca²⁺ в цитозоль; особенно много их в мышечных клетках. В сердце небольшая часть саркоплазматического ретикулума с RyR2 связана с митохондриями и передаёт им Ca²⁺ локально."},{"id":"S9-T72","term":"SIGMAR1 (сигма-1-рецептор)","section":2,"def":"Шаперон мембраны ЭПР, сосредоточенный в MAM. При снижении [Ca²⁺] в ЭПР он отделяется от шаперона BiP и стабилизирует IP₃R3, продлевая поступление Ca²⁺ в митохондрии. Данные получены на клетках CHO; несмотря на название, это не классический рецептор плазматической мембраны, а шаперон ЭПР, регулируемый лигандами."},{"id":"S9-T73","term":"Miro и Milton","section":2,"def":"Miro — белок наружной мембраны митохондрий с Ca²⁺-связывающими участками (EF-руками); через адаптерный белок Milton (у человека TRAK1 и TRAK2) он связывает митохондрию с кинезином, перемещающим её по микротрубочкам. Связывание Ca²⁺ с Miro останавливает движение митохондрий (нейроны гиппокампа крысы)."},{"id":"S9-T74","term":"RNase P митохондрий","section":3,"def":"Эндонуклеаза, отрезающая 5′-конец тРНК от полицистронного предшественника. У человека митохондриальная RNase P — белковый комплекс из трёх субъединиц (MRPP1–3), каталитической РНК в нём нет. RNase P бактерий и ядра — рибонуклеопротеины с каталитической РНК."},{"id":"S9-T75","term":"MTERF1","section":3,"def":"Белок, связывающийся с мтДНК сразу за генами рРНК. По данным на мышах, он останавливает транскрипцию противоположной цепи мтДНК, чтобы она не мешала началу транскрипции с промотора лёгкой цепи, и не регулирует транскрипцию генов рРНК. Прежнее представление о MTERF1 как регуляторе соотношения рРНК и мРНК эксперименты на мышах не подтвердили."},{"id":"S9-T76","term":"Протеазы митохондрий","section":3,"def":"Ферменты, удаляющие несобранные и повреждённые белки и расщепляющие регуляторные белки: LONP1 — в матриксе; AAA-протеазы внутренней мембраны — YME1L1 (активный центр в межмембранном пространстве) и m-AAA-протеаза (активный центр в матриксе); OMA1 — протеаза внутренней мембраны, активируемая при стрессе. OMA1 при потере мембранного потенциала расщепляе ы и сохранность цепи; высокое потребление O₂ не приравнено к высокой скорости синтеза ATP."},{"q":"Почему потенциал связан с несколькими процессами, но не заменяет их измерение? Потенциал матрикса относительно межмембранного пространства изменился с −160 до −100 мВ. Объясните смысл изменения и его возможное влияние на вход Ca²⁺ через MCU и импорт белка с N-концевой сигнальной последовательностью через TOM–TIM23–PAM. Почему по одному значению Δψm нельзя определить скорость синтеза ATP, завершение импорта и работу фосфатного переносчика?","crit":"Названы частичная деполяризация и уменьшение модуля потенциала. Потенциал отделён от полной Δp и от ΔpH. При неизменных остальных условиях электрическая движущая сила входа Ca²⁺ ослабевает. В импорте различены действие поля на положительно заряженную сигнальную последовательность и ATP-зависимый цикл mtHsp70. ANT и PiC не объединены в один электрогенный механизм. Названы дополнительные условия и необходимые раздельные измерения; не утверждается, что частичная деполяризация обязательно останавливает все пути импорта или означает гибель."},{"q":"Как Ca²⁺ связывает контакты органелл, метаболизм и повреждение? Две клетки дают одинаковый средний цитозольный импульс Ca²⁺, но различаются расположением участков высвобождения Ca²⁺ из ЭПР относительно митохондрий. Объясните, почему матричный ответ может различаться. Проследите, как умеренный матричный сигнал меняет активность пируватдегидрогеназного комплекса, и объясните, почему длительное накопление Ca²⁺ может иметь иной результат.","crit":"Названы IP₃R, локальная микрообласть, VDAC наружной мембраны и MCU внутренней; контакт не изображён слиянием. Различены локальная и средняя концентрации, порообразующий MCU и его регуляторы, потенциал и градиент Ca²⁺. Для PDH названы Ca²⁺-чувствительная PDP1 и снятие ингибирующего фосфорилирования. Усиление образования NADH не объявлено достаточным для роста синтеза ATP при любом дефекте цепи. Объяснены выход через NCLX, буферирование и отличие свободной концентрации Ca²⁺ от общей концентрации и общего количества. Переход проницаемости внутренней мембраны и MOMP наружной различены; универсальный порог перегрузки не задан."},{"q":"Почему доля варианта мтДНК не определяет функцию одним числом? Объясните двойной генетический контроль митохондриального аппарата человека. В двух клетках доля одного патогенного варианта мтДНК равна 70 %, но общее число копий — 1000 и 500. Что можно вычислить из этих данных и чего нельзя заключить о дыхательной функции и тяжести заболевания? Как это связано с сегрегацией вариантов и бутылочным горлышком при наследовании?","crit":"Названы 13 белков, 22 тРНК и две рРНК мтДНК человека и ядерное кодирование остальных белков, в том числе всех субъединиц комплекса II. Различены транскрипция, трансляция, импорт и сборка. Число копий дикого типа вычислено как 300 и 150; из арифметики не выведены автоматически различие функции или прогноз. Порог отнесён к определённому варианту, ткани и показателю. Доля молекул не подменена долей органелл или клеток. Сегрегация и бутылочное горлышко объясняют распределение долей, а не биохимический порог; дрейф отделён от отбора; упомянуты ядерные дефекты поддержания мтДНК."}]};

const line = (x1, y1, x2, y2, c = '#145c96', w = 3, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
const arrow = (x1, y1, x2, y2, c = '#145c96', w = 3, dash = '') => {

  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + `<path d="M${x2} ${y2} L${x2 + L * Math.cos(d1)} ${y2 + L * Math.sin(d1)} L${x2 + L * Math.cos(d2)} ${y2 + L * Math.sin(d2)} Z" fill="${c}"/>`;
};

  return line(x1, y1, x2, y2, c, w, dash ? `stroke-dasharray="${dash}"` : '') + line(x2 - px, y2 - py, x2 + px, y2 + py, c, 4);
};

  for (let i = 0; i <= ticksY; i++) { const y = y0 - (y0 - y1) * i / ticksY, v = maxY * i / ticksY; s += line(x0, y, x1, y, '#e4ebf1', 1) + tx(x0 - 9, y + 5, fmtY(Number.isInteger(v) ? v : Number(v.toFixed(2))), 15, 'end'); }
  for (let i = 0; i <= ticksX; i++) { const x = x0 + (x1 - x0) * i / ticksX, v = maxX * i / ticksX; s += line(x, y0, x, y0 + 5, '#7f97ab', 1.5) + tx(x, y0 + 24, String(Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')), 15); }
  series.forEach((sr, j) => {
    const d = sr.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x0 + x / maxX * (x1 - x0)).toFixed(1)},${(y0 - y / maxY * (y0 - y1)).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="${sr.color || ['#145c96', '#c3662f', '#007b72'][j % 3]}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/>`;
  });
  marks.forEach(([mx, my, mc]) => { s += `<circle cx="${(x0 + mx / maxX * (x1 - x0)).toFixed(1)}" cy="${(y0 - my / maxY * (y0 - y1)).toFixed(1)}" r="7.5" fill="#fff" stroke="${mc || '#c3662f'}" stroke-width="3.5"/>`; });
  s += tx(x0, 17, yLabel, 15, 'start') + tx((x0 + x1) / 2, h - 12, xLabel, 16);
  const legend = series.filter(sr => sr.label).map(sr => `<span><svg class="lg" viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="${sr.color || '#145c96'}" stroke-width="3.5" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''}/></svg>${esc(sr.label)}</span>`).join('');
  return svg(s, title, h, w) + (legend ? `<div class="legend-lines">${legend}</div>` : '');
}

  if (st.m && st.m.length) h += `<div class="metrics${st.m.length === 2 ? ' two' : ''}">${st.m.map(x => metric(x[0], x[1])).join('')}</div>`;
  if (st.bars && st.bars.length) h += `<div class="qbars" role="list">${st.bars.map(r => `<div class="qbar" role="listitem"><span class="qb-l">${esc(r[0])}</span><span class="qb-t"><i style="width:${r[1] < 0 ? 0 : Math.round(r[1] / 3 * 100)}%"></i></span>${lvlTag(r[1])}</div>`).join('')}</div>`;
  if (st.tab) h += tbl(st.tab[0], st.tab.slice(1));
  h += result(`${st.note ? `<p>${esc(st.note)}</p>` : ''}${S.fixed ? `<p class="quiet">${esc(S.fixed)}</p>` : ''}`);
  return h;
}
W.net = ({S, s, set, out, onGroup, onCheck}) => {
  (S.ctrls || []).forEach(c => { if (s[c.id] == null) s[c.id] = c.def != null ? c.def : (c.type === 'check' ? false : 0); });
  set(S.title, S.status, ctrlHtml(S, s));
  const draw = () => {
    const key = stateKey(S, s), st0 = (S.st || {})[key] || (S.st || {})['*'] || {};
    const base = S.base || {};
    const st = {_key: key};
    ['n', 'e', 'b', 't', 'tn', 'p', 'pn', 'et', 'z'].forEach(f => { st[f] = Object.assign({}, base[f] || {}, st0[f] || {}); });
    ['m', 'bars', 'note', 'tab'].forEach(f => { st[f] = st0[f] != null ? st0[f] : base[f]; });
    const r = netDraw(S, st, small());
    out(r.svg + legendHtml(S, new Set([...r.kinds, 'nodes'])), resultHtml(S, st));
  };
  (S.ctrls || []).forEach(c => {
    if (c.type === 'check') onCheck('nc-' + c.id, v => { s[c.id] = v; draw(); });
    else onGroup('nc-' + c.id, v => { s[c.id] = v; draw(); });
  });
  NET_REDRAW = draw;
  draw();
};
