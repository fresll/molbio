<script>
const TEXTS = {"affil": "Кафедра биологии и генетики · Медицинский университет Петровского · курс «Молекулярная биология», 5–6 семестры", "page_title": "Семинар 7 · Ресурсные решения клетки", "doc_title": "Семинар 7 · Ресурсные решения клетки — Кафедра биологии и генетики, Медицинский университет Петровского", "wm": "© Кафедра биологии и генетики, Медицинский университет Петровского · курс «Молекулярная биология»", "footer": "© 2026 Кафедра биологии и генетики, Медицинский университет Петровского. Учебные материалы курса «Молекулярная биология» (5–6 семестры). При использовании ссылка на кафедру обязательна.", "version": "Версия 2.3, 2 октября 2026 г.", "captions": "Подписи", "legend_btn": "Условные обозначения", "fullscreen": "На весь экран", "lvl_b": "Базовый", "lvl_a": "Продвинутый", "poe_btn": "Сценарий: предскажи и проверь", "tab1": "mTORC1 на лизосоме", "tab2": "AMPK и энергия", "tab3": "Синтез или окисление ЖК", "tab4": "Аутофагия и возврат mTORC1", "q1": "Вопрос 1. Лизосомная активация mTORC1 при совпадении аминокислотного и ростового сигналов", "q2": "Вопрос 2. AMPK как сенсор аденилатного энергетического заряда и переключатель клеточного бюджета", "q3": "Вопрос 3. Переключение между синтезом и β-окислением жирных кислот через ACC, малонил-CoA и CPT1", "q4": "Вопрос 4. Согласование аутофагии, лизосомного гидролиза и повторной активации mTORC1", "why": "Зачем это клетке", "take": "Вывод", "info_t": "Справка", "close": "Закрыть", "lbl_cytosol": "цитоплазма", "lbl_nucleus": "ядро", "lbl_lysosome": "лизосома", "pill_p": "фосфорилирован", "pill_np": "не фосфорилирован", "pill_cyto": "в цитоплазме", "pill_nuc": "в ядре", "pill_on": "работает", "pill_off": "нет", "r_mtorc1": "активность mTORC1", "blot_empty": "Дорожек пока нет. Выставьте условия и нажмите «Записать дорожку».", "blot_clr": "Очистить", "b_actin": "актин", "noscript": "Откройте этот файл в браузере на компьютере (Chrome, Edge, Firefox или Safari). В режиме предпросмотра демонстрации не работают.", "poe_step": "Шаг {i} из {n}", "poe_ans": "Почему:", "poe_show": "Показать на схеме", "poe_pick_first": "Сначала выберите ответ", "poe_your": "Почему ваш ответ неверен:", "poe_score": "Верно с первого раза: {c} из {n}.", "poe_prev": "← Назад", "poe_next": "Дальше →", "poe_end": "Сценарий закончен", "poe_exit": "Выйти", "legend_t": "Условные обозначения", "lg_on": "жёлтый — белок активен", "lg_off": "серый — неактивен", "lg_p": "белок фосфорилирован", "lg_missing": "белка нет: мутация или ингибитор", "lg_act": "активирует", "lg_inh": "тормозит", "lg_idle": "бледная связь — сейчас не работает", "lg_click": "щёлкните по белку — появится справка", "teacher_t": "Для преподавателя: как вести, упрощения, источники", "src_t_st": "Источники", "teacher_1": "На каждый вопрос: базовый уровень 5–7 минут, затем продвинутый 8–10 минут. «Сценарий» задаёт вопрос; студенты выбирают ответ, потом «Показать на схеме». Клавиши: 1–4 — вопросы, B — уровень. Щелчок по белку на схеме открывает справку.", "teacher_2": "Все величины условные (от 0 до 1 или в долях от покоя). Модели передают направление и порядок событий, а не концентрации. Порядок событий в вопросе 4 взят из Yu 2010 (голодание клеток NRK в среде без сыворотки и глутамина): mTORC1 подавлен к 2 ч и восстановлен к 6 ч, аутофагия максимальна к 4 ч, лизосомы восстановлены к 12 ч. Возврат mTORC1 при голоде именно по аминокислотам, зависящий от аутофагии, показан позже (Tan 2017; Kazyken 2024). Упрощение в вопросе 1: без аминокислот Rag-ГТФазы ещё и возвращают TSC2 на лизосому (Demetriades 2014), так что один инсулин RHEB полностью не загружает. В вопросе 4 бафиломицин — вторая чашка: её копируют за 2 ч до съёмки, в ней ничего не переваривается, и обе чашки измеряют в один момент. У mTORC1 в модели вопроса 4 два выхода: чувствительный к рапамицину (S6K, восстановление лизосом) и устойчивый (ULK1 S757, торможение аутофагии); TFEB зависит только от аминокислот. Прибавка LC3-II с бафиломицином включает не только непереваренное: за 2 ч в чашке с бафиломицином аминокислоты не освобождаются, mTORC1 не возвращается и образуются новые аутофагосомы. Поэтому экспозицию держат короткой (Klionsky 2021).", "teacher_3": "Поправки к распространённым схемам. AMPK: по классической схеме запускает аутофагию через ULK1 (Kim 2011; Egan 2011), по новым данным при остром дефиците энергии скорее сдерживает её (Park 2023; Kazyken 2024) — вопрос открыт. TFEB фосфорилируется mTORC1 через Rag и FLCN и не чувствителен к RHEB и рапамицину (Napolitano 2020); при длительной потере TSC2 TFEB, напротив, ядерный (Alesi 2021). SLC38A9 чувствует аргинин в лизосоме и выводит из неё лейцин. Малонил-CoA тормозит фермент CPT1, а через внутреннюю мембрану ацил переносится в виде ацилкарнитина (CACT). AMPK тормозит mTORC1 двумя путями: усиливает TSC2 (Inoki 2003) и тормозит Raptor (Gwinn 2008). В модели CPT1A (печень) и CPT1B (мышца) одинаково чувствительны к малонил-CoA; на деле CPT1B чувствительнее.", "s1_aa": "Аминокислоты", "s1_ins": "Инсулин", "s1_insulin": "инсулин", "s1_o_s6k": "синтез белка", "s1_o_ebp": "трансляция", "s1_o_ulk": "аутофагия", "s1_r_s6k": "с P работает: синтез белка и рибосом", "s1_r_ebp": "без P держит eIF4E и тормозит трансляцию", "s1_r_ulk": "с P от mTORC1 заторможена; без P может запустить аутофагию", "s1_r_tfeb": "в ядре включает гены лизосом и аутофагии", "s1_none": "Нет ни аминокислот, ни инсулина. RagA/B связаны с GDP, mTORC1 в цитоплазме и выключен. TFEB без фосфата в ядре.", "s1_none_z": "Строить не из чего, и разрешения расти нет. Клетка не тратит энергию на синтез белка, а TFEB включает гены лизосом: клетка готовится перерабатывать собственные запасы.", "s1_aa_only": "Аминокислоты перевели RagA/B в GTP-форму, RagC/D — в GDP-форму, и Rag-ГТФазы притянули mTORC1 к лизосоме. Но инсулина нет: TSC держит RHEB в GDP-форме, и S6K, 4E-BP1, ULK1 не фосфорилированы. TFEB при этом фосфорилирован: ему хватает Rag-сигнала.", "s1_aa_only_z": "Материал есть, а разрешения организма расти нет. mTORC1 ждёт на лизосоме, но рост не запускает. Новые лизосомы не нужны — аминокислот хватает.", "s1_ins_only": "Инсулин через AKT фосфорилировал TSC, и TSC ушёл с лизосомы. RHEB перешёл в GTP-форму. Но без аминокислот RagA/B связаны с GDP, mTORC1 к RHEB не попадает и не работает.", "s1_ins_only_z": "Разрешение расти есть, а строить не из чего. Включись mTORC1 сейчас, клетка начала бы синтез белка без сырья и выключила бы аутофагию — свой главный внутренний источник аминокислот.", "s1_both": "Оба сигнала есть: Rag-ГТФазы держат mTORC1 на лизосоме, RHEB-GTP его включает. S6K запускает синтез белка, 4E-BP1 отпускает eIF4E, ULK1 и TFEB выключены.", "s1_both_z": "Есть и материал, и разрешение — клетка вкладывает ресурсы в рост. Аутофагию и синтез лизосом она тормозит, чтобы не разбирать то, что сейчас строит.", "s1_weak": "Оба сигнала есть, но хотя бы один слабый. mTORC1 на лизосоме, часть RHEB связана с GTP, но активность mTORC1 низкая: S6K, 4E-BP1 и ULK1 почти не фосфорилированы. TFEB фосфорилирован: ему хватает сигнала от Rag-ГТФаз.", "s1_weak_z": "Сигналы не складываются, а перемножаются: два слабых сигнала дают слабый ответ. Клетка растёт, только когда достаточно и сырья, и разрешения.", "s1b_take": "Чтобы фосфорилировать S6K, 4E-BP1 и ULK1, mTORC1 нужны два условия сразу. Аминокислоты через Rag-ГТФазы решают, где он находится (на лизосоме). Инсулин через AKT и TSC решает, включится ли он там (RHEB-GTP). Логика «И» защищает клетку от роста без сырья. TFEB — исключение: ему хватает сигнала от Rag-ГТФаз.", "s1a_leu": "Лейцин", "s1a_arg": "Аргинин", "s1a_met": "Метионин (→ SAM)", "s1a_en": "Энергия (ATP)", "drug_t": "Препарат", "drug_0": "нет", "drug_rapa": "рапамицин", "drug_torin": "торин 1", "geno_t": "Клетки", "gt_wt": "норма", "gt_tsc": "нет TSC2", "gt_g1": "нет GATOR1", "gt_flcn": "нет FLCN", "gt_x": "загадка", "myst_show": "Показать ответ", "s1a_mask": "Схема скрыта: что сломано, решайте по блоту", "drug_none_k": "без препарата", "s1a_targets": "мишени mTORC1", "blot_t": "Вестерн-блот", "blot_rec": "Записать дорожку", "b_s6k": "p-S6K (T389)", "b_ebp": "p-4E-BP1 (T37/46)", "b_ulk": "p-ULK1 (S757)", "b_tfeb": "p-TFEB (S211)", "s1a_r_rag": "RagA/B·GTP: mTORC1 на лизосоме", "s1a_r_rheb": "RHEB·GTP", "s1a_r_ampk": "активность AMPK", "s1a_c_full": "Sestrin2 и CASTOR1 связали лейцин и аргинин и отпустили GATOR2, SAMTOR связал SAM и отпустил GATOR1. GATOR2 тормозит GATOR1, RagA/B в GTP-форме, mTORC1 на лизосоме. Инсулин убрал TSC — RHEB-GTP включает mTORC1. Все четыре мишени фосфорилированы.", "s1a_c_full_z": "Есть аминокислоты, SAM, энергия и разрешение расти — клетка строит. Каждый ресурс проверяет отдельный датчик, поэтому нехватка любого из них останавливает рост.", "s1a_c_leu": "Лейцина мало: свободный Sestrin2 связывает GATOR2. GATOR1 больше никто не тормозит, он переводит RagA/B в GDP-форму, и mTORC1 уходит с лизосомы. TFEB уходит в ядро.", "s1a_c_leu_z": "Лейцин — незаменимая аминокислота, клетка его не синтезирует. Без него синтез белка остановился бы на первом же лейциновом кодоне, поэтому рост выключается заранее.", "s1a_c_arg": "Аргинина мало: свободный CASTOR1 связывает GATOR2. Дальше как при нехватке лейцина: GATOR1 переводит RagA/B в GDP-форму, mTORC1 уходит с лизосомы. Аргинин в просвете лизосомы чувствует ещё SLC38A9.", "s1a_c_arg_z": "Клетка проверяет запас аминокислот в двух местах: в цитоплазме (CASTOR1) и внутри лизосомы (SLC38A9). При голоде лизосома — главный источник аминокислот.", "s1a_c_met": "Метионина мало, и SAM падает. SAMTOR без SAM связывается с GATOR1 и усиливает его. RagA/B в GDP-форме, mTORC1 уходит с лизосомы.", "s1a_c_met_z": "SAM — донор метильных групп для ДНК, белков и липидов. Его нехватка означает, что расти и делиться рано.", "s1a_c_torin": "Торин 1 занял активный центр mTOR. mTORC1 сидит на лизосоме, но ничего не фосфорилирует: исчезают все фосфополосы (актин — контроль нагрузки — остаётся), TFEB уходит в ядро.", "s1a_c_torin_z": "Это опыт, а не физиология. Рапамицин не показывает, что TFEB — субстрат mTORC1; торин 1 — показывает.", "s1a_c_ampk": "Энергии мало, AMPK активна. Она фосфорилирует Raptor и TSC2 и выключает mTORC1, хотя аминокислоты и инсулин есть. Через FNIP1 AMPK тормозит и FLCN, поэтому при сильной нехватке энергии TFEB уходит в ядро.", "s1a_c_ampk_z": "Рост дорог: синтез белка — одна из главных статей расхода ATP. При нехватке энергии клетка его останавливает, даже если сырьё и разрешение есть. Без TSC2 этот тормоз всё равно работает — через Raptor.", "s1a_c_ampk_mut": "Энергии мало, AMPK активна. Она фосфорилирует Raptor и выключает mTORC1 даже в этих клетках (Gwinn 2008).", "s1a_c_ampk_mut_z": "Тормоз через Raptor не зависит ни от TSC2, ни от FLCN: при нехватке энергии рост останавливается в любом случае.", "s1a_c_noins": "Аминокислоты есть, mTORC1 на лизосоме, но инсулина нет: TSC держит RHEB в GDP-форме. S6K, 4E-BP1 и ULK1 не фосфорилированы. Судьба TFEB от инсулина не зависит: ему нужны Rag и FLCN, а не RHEB.", "s1a_c_noins_z": "Разные мишени mTORC1 проверяют разные условия. Синтезу белка нужно разрешение организма, а судьба лизосом зависит только от аминокислот.", "s1a_c_weak": "Один из сигналов ослаблен — аминокислоты, инсулин или энергия. mTORC1 на лизосоме, но работает слабо: S6K, 4E-BP1 и ULK1 почти не фосфорилированы. TFEB зависит от другого сигнала — от Rag-ГТФаз и FLCN.", "s1a_c_weak_z": "Сигналы перемножаются: если хотя бы один слабый, слабым будет и ответ.", "s1a_c_rapa": "Рапамицин вместе с белком FKBP12 прикрывает вход в активный центр mTOR. Фосфорилирование S6K почти исчезает, а 4E-BP1 (T37/46) и ULK1 (S757) фосфорилируются почти как обычно. На TFEB рапамицин не действует.", "s1a_c_rapa_z": "Поэтому рапамицин и эверолимус тормозят рост, но слабо запускают аутофагию. Чтобы выключить все функции mTORC1, нужен ингибитор активного центра.", "s1a_c_flcn": "Без FLCN RagC/D остаются в GTP-форме. mTORC1 на лизосоме и фосфорилирует S6K, но TFEB к нему не попадает и всё время в ядре.", "s1a_c_flcn_z": "Так устроен синдром Бёрта — Хогга — Дюбе: опухоли почек, кисты лёгких, опухоли кожи. У мышей с выключением FLCN в почках кисты исчезают, если убрать и TFEB (Napolitano 2020). Одна мутация ломает одну ветвь mTORC1.", "s1a_c_g1": "Без GATOR1 некому перевести RagA/B в GDP-форму. Аминокислот нет, а mTORC1 остаётся на лизосоме и работает.", "s1a_c_g1_z": "Клетка перестаёт чувствовать голод и растёт без сырья. Мутации DEPDC5 (субъединица GATOR1) вызывают наследственную фокальную эпилепсию.", "s1a_c_tsc": "Без TSC2 RHEB всё время в GTP-форме: mTORC1 фосфорилирует S6K и без инсулина. А TFEB, неожиданно, в ядре: без TSC2 нарушается работа RagC, и TFEB плохо фосфорилируется (Alesi 2021).", "s1a_c_tsc_z": "Клетка растёт без разрешения организма, а лизосом в ней больше. Так возникают опухоли при туберозном склерозе; их лечат эверолимусом.", "s1a_c_tsc_noaa": "Без аминокислот mTORC1 уходит с лизосомы и в клетках без TSC2, но гаснет не полностью: в норме при голоде Rag-ГТФазы ещё и приводят TSC2 к лизосоме, а его нет (Demetriades 2014).", "s1a_c_tsc_noaa_z": "Аминокислотный вход не зависит от инсулина, но оба входа связаны через TSC2: голод тормозит mTORC1 двумя путями сразу.", "s1a_c_myst": "В этих клетках выключен один из белков пульта. Записывайте дорожки блота в разных условиях и найдите, какой.", "s1a_c_myst_z": "Так работает генетика: о функции белка судят по тому, что ломается без него.", "s1a_c_ans_tsc": "Ответ: нет TSC2. Признак: p-S6K есть без инсулина, а p-TFEB слабый.", "s1a_c_ans_tsc_z": "Сигнал инсулина больше не нужен, а аминокислотный — нужен.", "s1a_c_ans_g1": "Ответ: нет GATOR1. Признак: полосы не исчезают, когда убирают лейцин и аргинин.", "s1a_c_ans_g1_z": "Сломан аминокислотный вход: клетка не видит голода.", "s1a_c_ans_flcn": "Ответ: нет FLCN. Признак: p-S6K есть, а p-TFEB нет ни в каких условиях.", "s1a_c_ans_flcn_z": "Сломана только ветвь TFEB: ей нужны RagC/D в GDP-форме.", "s1a_take": "На лизосоме сходятся отдельные датчики: лейцина (Sestrin2), аргинина (CASTOR1, SLC38A9), SAM (SAMTOR), энергии (AMPK) и инсулина (TSC). Мишени mTORC1 требуют разного: S6K нужен RHEB, TFEB — только Rag и FLCN. Поэтому мутации и препараты выключают разные наборы функций.", "p1b_1_q": "Добавим только аминокислоты. Что сделает mTORC1?", "p1b_1_o1": "Сядет на лизосому и включится", "p1b_1_o2": "Сядет на лизосому, но не включится", "p1b_1_o3": "Останется в цитоплазме", "p1b_1_e": "Аминокислоты через Rag-ГТФазы приводят mTORC1 на лизосому. Включает его RHEB-GTP, а без инсулина RHEB в GDP-форме.", "p1b_1_w1": "На лизосому он сядет, но для включения нужен второй сигнал — RHEB-GTP от инсулина. Без инсулина TSC держит RHEB в GDP-форме.", "p1b_1_w3": "Наоборот: аминокислоты нужны, чтобы Rag-ГТФазы притянули mTORC1 к лизосоме. Без них он остался бы в цитоплазме.", "p1b_2_q": "Теперь только инсулин, без аминокислот. Что будет?", "p1b_2_o1": "mTORC1 включится в цитоплазме", "p1b_2_o2": "RHEB перейдёт в GTP-форму, но mTORC1 не включится", "p1b_2_o3": "Ничего не изменится", "p1b_2_e": "Инсулин убирает TSC, и RHEB переходит в GTP-форму. Но RHEB сидит на лизосоме, а mTORC1 без Rag-сигнала туда не попадает.", "p1b_2_w1": "RHEB сидит на мембране лизосомы, и встретиться с ним mTORC1 может только там. Без аминокислот mTORC1 к лизосоме не попадает.", "p1b_2_w3": "Меняется RHEB: инсулин через AKT убирает TSC, и RHEB переходит в GTP-форму. Но mTORC1 рядом нет, поэтому его мишени не фосфорилируются.", "p1b_3_q": "Оба сигнала есть. Уберём аминокислоты, инсулин оставим. Где окажется TFEB?", "p1b_3_o1": "В цитоплазме: инсулин держит mTORC1 активным", "p1b_3_o2": "В ядре: без аминокислот mTORC1 уходит с лизосомы", "p1b_3_o3": "Его разрушат протеасомы", "p1b_3_e": "TFEB фосфорилируется только на лизосоме. Без аминокислот mTORC1 уходит, TFEB теряет фосфат и идёт в ядро включать гены лизосом и аутофагии.", "p1b_3_w1": "TFEB фосфорилируется только на лизосоме и только при сигнале от Rag-ГТФаз. Инсулин этого не заменит: без аминокислот mTORC1 уходит с лизосомы.", "p1b_3_w3": "При голоде TFEB не разрушается: без фосфата он перестаёт удерживаться в цитоплазме и уходит в ядро.", "p1a_1_q": "Дорожка 1 — контроль. Добавим рапамицин. Какие полосы исчезнут?", "p1a_1_o1": "Все четыре", "p1a_1_o2": "p-S6K почти исчезнет, остальные полосы почти не изменятся", "p1a_1_o3": "Только p-TFEB", "p1a_1_e": "S6K (T389) очень чувствительна к рапамицину, а сайты 4E-BP1 (T37/46), ULK1 (S757) и TFEB (S211) к нему устойчивы: mTORC1 фосфорилирует их и в присутствии рапамицина (Thoreen 2009; Kang 2013; Settembre 2012).", "p1a_1_w1": "Так действует торин 1, а не рапамицин. Рапамицин лишь частично прикрывает вход в активный центр mTOR: S6K (T389) почти теряет фосфат, а 4E-BP1 (T37/46), ULK1 (S757) и TFEB фосфорилируются почти как обычно.", "p1a_1_w3": "Наоборот: TFEB к рапамицину устойчив. Сильнее всего рапамицин действует на S6K (T389).", "p1a_2_q": "Теперь вместо рапамицина торин 1 — он занимает активный центр mTOR. Какие полосы исчезнут?", "p1a_2_o1": "То же, что рапамицин", "p1a_2_o2": "Исчезнут все фосфополосы, TFEB уйдёт в ядро", "p1a_2_o3": "Полосы станут ярче", "p1a_2_e": "Торин 1 конкурирует с ATP за активный центр и выключает все функции mTORC1. Только с ним видно, что TFEB — субстрат mTORC1.", "p1a_2_w1": "Торин 1 занимает сам активный центр mTOR, конкурируя с ATP, а не прикрывает вход, как рапамицин. Поэтому исчезают все фосфополосы, и устойчивые к рапамицину тоже.", "p1a_2_w3": "Торин 1 выключает киназу mTOR, и её мишени теряют фосфат: фосфополосы исчезают, а не становятся ярче.", "p1a_3_q": "Клетки без TSC2, инсулина нет — mTORC1 работает (дорожка 1). Уберём лейцин и аргинин. Что будет?", "p1a_3_o1": "mTORC1 продолжит работать: тормоза нет", "p1a_3_o2": "mTORC1 почти выключится: без Rag-сигнала он не попадает к RHEB", "p1a_3_o3": "Клетка начнёт синтезировать лейцин", "p1a_3_e": "Потеря TSC2 снимает только требование инсулина; аминокислотный вход нужен по-прежнему. Полностью mTORC1 всё же не гаснет: при голоде Rag-ГТФазы ещё и приводят TSC2 к лизосоме, а его нет (Demetriades 2014).", "p1a_3_w1": "Без TSC2 RHEB всё время в GTP-форме, но mTORC1 ещё должен попасть к RHEB на лизосому. Без лейцина и аргинина Rag-ГТФазы его туда не приводят.", "p1a_3_w3": "Лейцин — незаменимая аминокислота, клетка его не синтезирует. При нехватке аминокислот mTORC1 просто уходит с лизосомы.", "p1a_4_q": "Клетки без GATOR1. Уберём лейцин и аргинин. Что будет?", "p1a_4_o1": "mTORC1 выключится, как в норме", "p1a_4_o2": "mTORC1 продолжит работать: некому перевести RagA/B в GDP-форму", "p1a_4_o3": "TFEB уйдёт в ядро, а S6K выключится", "p1a_4_e": "Датчики передают сигнал о голоде через GATOR2 на GATOR1. Без GATOR1 сигнал некуда передать, и mTORC1 не чувствует голода (Bar-Peled 2013).", "p1a_4_w1": "В норме сигнал о голоде от Sestrin2 и CASTOR1 идёт через GATOR2 на GATOR1, и GATOR1 переводит RagA/B в GDP-форму. Без GATOR1 этот шаг выпадает, и mTORC1 остаётся на лизосоме.", "p1a_4_w3": "TFEB и S6K здесь ведут себя одинаково: оба зависят от того, сидит ли mTORC1 на лизосоме. Без GATOR1 он остаётся там, и оба фосфорилированы.", "p1a_5_q": "Аминокислоты и инсулин есть, но энергии мало. Что сделает mTORC1?", "p1a_5_o1": "Выключится: AMPK фосфорилирует Raptor и TSC2", "p1a_5_o2": "Продолжит работать: сырьё и разрешение есть", "p1a_5_o3": "Уйдёт в ядро", "p1a_5_e": "AMPK тормозит mTORC1 двумя путями — через TSC2 и напрямую через Raptor. Путь через Raptor работает даже без TSC2 (Gwinn 2008).", "p1a_5_w2": "Рост требует много ATP. При нехватке энергии AMPK тормозит mTORC1, даже если аминокислоты и инсулин есть: усиливает TSC2 и фосфорилирует Raptor.", "p1a_5_w3": "При нехватке энергии mTORC1 тормозится на месте — через TSC2 и Raptor. В ядро уходит TFEB, когда теряет фосфат.", "p1a_6_q": "Клетки без FLCN. Что будет с S6K и TFEB?", "p1a_6_o1": "Оба выключатся", "p1a_6_o2": "S6K фосфорилирована, TFEB в ядре", "p1a_6_o3": "Оба как в норме", "p1a_6_e": "FLCN переводит RagC/D в GDP-форму. Только в этой форме Rag притягивают TFEB к mTORC1; S6K это не нужно (Napolitano 2020).", "p1a_6_w1": "Для S6K FLCN почти не нужен: mTORC1 остаётся на лизосоме, и S6K фосфорилируется. FLCN нужен ветви TFEB — он переводит RagC/D в GDP-форму.", "p1a_6_w3": "Для S6K — да, а для TFEB нет. Без FLCN RagC/D остаются в GTP-форме и не притягивают TFEB к mTORC1, поэтому TFEB всё время в ядре.", "s2_load": "Расход ATP", "s2_lkb1": "LKB1 работает", "s2_pool": "адениловые нуклеотиды", "s2_ak": "аденилаткиназа: 2 ADP ⇄ ATP + AMP", "s2_fold": "во сколько раз изменилось", "s2_rest": "покой", "s2_ec_f": "заряд = (ATP + ½ ADP) / (ATP + ADP + AMP)", "s2_alpha": "α — киназа", "s2_gamma": "γ — датчик", "s2_t_acc1": "синтез ЖК ↓", "s2_t_acc2": "окисление ЖК ↑", "s2_t_mtor1": "mTORC1 ↓", "s2_t_mtor2": "рост ↓", "s2_t_ulk1": "аутофагия:", "s2_t_ulk2": "вопрос открыт", "s2_r_atp": "от уровня покоя", "s2_r_amp": "от уровня покоя", "s2_r_ec": "энергетический заряд", "s2_r_ampk": "активность AMPK", "s2_c_rest": "ATP много, AMP почти нет. В γ-субъединице сидит ATP, AMPK неактивна.", "s2_c_rest_z": "Пока энергии хватает, AMPK не мешает клетке тратить ATP на синтез и рост.", "s2_c_on": "ATP снизился всего на {atp} %, а AMP вырос в {amp}: аденилаткиназа превращает лишний ADP в ATP и AMP. AMP вытесняет ATP из γ-субъединицы, LKB1 фосфорилирует Thr172, и AMPK включается.", "s2_c_on_z": "AMP — усилитель: ATP изменился мало, а сигнал уже сильный, и клетка реагирует до опасного падения ATP. AMPK урезает траты (синтез жирных кислот, рост через mTORC1) и включает производство ATP (окисление жирных кислот). Как AMPK влияет на аутофагию, сейчас пересматривают: по классической схеме она её запускает, по новым данным при остром дефиците энергии скорее сдерживает.", "s2_c_nolkb1": "AMP много, но без LKB1 Thr172 не фосфорилирован, и AMPK почти не работает.", "s2_c_nolkb1_z": "Клетка «видит» нехватку энергии, но не может ответить и продолжает тратить. LKB1 — супрессор опухолей; её часто теряют опухоли лёгкого.", "s2b_take": "Аденилаткиназа делает AMP чувствительным датчиком нехватки ATP. AMPK, связав AMP, переключает бюджет клетки: урезает траты (синтез жирных кислот, рост) и включает производство ATP.", "p2b_1_q": "Расход ATP растёт до максимума. Что изменится сильнее?", "p2b_1_o1": "ATP упадёт в разы, AMP почти не изменится", "p2b_1_o2": "ATP снизится на треть, AMP вырастет почти в 20 раз", "p2b_1_o3": "ATP и AMP изменятся одинаково", "p2b_1_e": "Аденилаткиназа держит равновесие 2 ADP ⇄ ATP + AMP, поэтому отношение AMP/ATP растёт примерно как квадрат отношения ADP/ATP. Небольшое падение ATP превращается в большой рост AMP.", "p2b_1_w1": "Наоборот. Аденилаткиназа превращает 2 ADP в ATP и AMP, поэтому ATP держится, а AMP, которого в покое очень мало, растёт во много раз.", "p2b_1_w3": "ATP много, и падает он лишь на треть. AMP в покое мало, поэтому та же реакция аденилаткиназы увеличивает его во много раз.", "p2b_2_q": "Выключим LKB1, расход ATP прежний. Что будет с AMPK?", "p2b_2_o1": "Будет работать: AMP ведь много", "p2b_2_o2": "Почти не будет работать: Thr172 не фосфорилирован", "p2b_2_o3": "Будет работать сильнее", "p2b_2_e": "AMP (и ADP) облегчают фосфорилирование Thr172 и защищают его от фосфатаз, AMP ещё и аллостерически активирует киназу. Но фосфорилирует Thr172 другая киназа — LKB1 (или CaMKK2, см. продвинутый уровень).", "p2b_2_w1": "AMP только помогает: облегчает фосфорилирование Thr172, защищает его от фосфатаз и усиливает уже фосфорилированную AMPK. Фосфорилирует Thr172 киназа LKB1, и без неё AMPK почти не работает.", "p2b_2_w3": "Без LKB1 некому фосфорилировать Thr172 в ответ на AMP. AMPK работает не сильнее, а почти не работает.", "p2b_3_q": "AMPK включилась. Что станет с синтезом жирных кислот и ростом?", "p2b_3_o1": "Ускорятся: клетке нужно больше энергии", "p2b_3_o2": "Выключатся: траты ATP сократятся", "p2b_3_o3": "Синтез жирных кислот ускорится, чтобы запасти энергию", "p2b_3_e": "AMPK выключает ACC (синтез жирных кислот) и mTORC1 (рост). С аутофагией сложнее: по классической схеме AMPK запускает её через ULK1 (Kim 2011; Egan 2011), по новым данным при остром дефиците энергии скорее сдерживает её запуск и сохраняет её белки (Park 2023; Kazyken 2024). Вопрос обсуждается.", "p2b_3_w1": "Синтез жирных кислот и рост тратят ATP. При нехватке энергии AMPK их выключает и включает то, что даёт ATP, например окисление жирных кислот.", "p2b_3_w3": "Энергию запасают, когда её в избытке. AMPK включается при нехватке ATP и выключает ACC: синтез жирных кислот падает, а их окисление растёт.", "s2a_in1": "расход ATP → AMP", "s2a_in2": "мало глюкозы (нет FBP)", "s2a_ald": "альдолаза", "s2a_glc": "Глюкоза", "s2a_ca": "Ca²⁺ в цитоплазме", "s2a_gam": "γ связывает AMP", "s2a_time": "Прошло времени", "s2a_t0": "0", "s2a_t1": "2 мин", "s2a_t2": "10 мин", "s2a_t3": "1 ч", "s2a_t4": "3 ч", "s2a_t5": "8 ч", "s2a_t6": "24 ч", "s2a_row1": "через минуты", "s2a_row2": "через часы", "s2a_e_acc": "синтез ЖК ↓", "s2a_e_hmg": "холестерин ↓", "s2a_e_tsc": "RHEB ↓", "s2a_e_rap": "mTORC1 ↓", "s2a_e_ulk": "аутофагия (?)", "s2a_e_mff": "деление ↑", "s2a_e_tfe": "лизосомы ↑", "s2a_e_pgc": "митохондрии ↑", "s2a_r_ratio": "от уровня покоя", "s2a_r_t172": "Thr172 фосфорилирован", "s2a_rt1": "вход AMP (LKB1)", "s2a_rt2": "вход глюкозы (лизосома)", "s2a_rt3": "вход Ca²⁺ (CaMKK2)", "s2a_c_rest": "Все три входа молчат: ATP хватает, глюкоза есть, Ca²⁺ низкий. AMPK неактивна.", "s2a_c_rest_z": "Повода экономить нет.", "s2a_c_amp": "Расход ATP поднял AMP. AMP связался с γ-субъединицей, LKB1 фосфорилировала Thr172 — классический путь.", "s2a_c_amp_z": "Это ответ на уже наступивший дефицит энергии.", "s2a_c_glc": "Глюкозы мало, а ATP пока в норме. Альдолаза без фруктозо-1,6-бисфосфата (FBP) собирает на лизосоме комплекс v-ATPase — Ragulator — AXIN — LKB1, и LKB1 фосфорилирует AMPK. AMP для этого не нужен.", "s2a_c_glc_z": "Клетка экономит заранее: реагирует на нехватку топлива ещё до падения ATP.", "s2a_c_glc_gam": "γ-субъединица не связывает AMP, но глюкозный вход работает: альдолаза на лизосоме включает AMPK без AMP.", "s2a_c_glc_gam_z": "Так показали, что этот вход не зависит от AMP (Zhang 2017).", "s2a_c_ca": "Ca²⁺ в цитоплазме вырос. CaMKK2 фосфорилирует Thr172 без всякого AMP.", "s2a_c_ca_z": "Возбуждение нейрона или сигнал гормона предупреждает заранее: скоро понадобится много ATP.", "s2a_c_ca0": "LKB1 нет, но Ca²⁺ через CaMKK2 всё равно включает AMPK.", "s2a_c_ca0_z": "Один и тот же Thr172 могут фосфорилировать разные киназы (Hawley 2005).", "s2a_c_nolkb": "LKB1 нет: ни AMP, ни нехватка глюкозы не включают AMPK. Включить её может только вход Ca²⁺ через CaMKK2.", "s2a_c_nolkb_z": "LKB1 нужна обоим энергетическим входам. Опухолевые клетки без LKB1 не тормозят рост при нехватке энергии.", "s2a_c_gam": "γ-субъединица не связывает AMP: расход ATP большой, а AMPK почти не реагирует.", "s2a_c_gam_z": "Значит, датчик AMP — именно γ-субъединица.", "s2a_c_multi": "Работают сразу несколько входов, их эффекты складываются.", "s2a_c_multi_z": "AMPK сводит в одну точку сигналы о расходе энергии, о запасе топлива и о нагрузке.", "s2a_c_part": "AMPK активна лишь частично: Thr172 фосфорилирован не полностью, и мишени почти не фосфорилируются.", "s2a_c_part_z": "Слабые сигналы складываются: чем их больше и чем они сильнее, тем активнее AMPK.", "s2a_take": "AMPK включают три входа: AMP (дефицит ATP уже наступил), нехватка глюкозы через лизосому (топливо кончается) и Ca²⁺ (нагрузка впереди). Ответ идёт в два слоя: за минуты фосфорилируются ферменты, за часы меняются гены — появляются новые лизосомы и митохондрии.", "p2a_1_q": "Уберём глюкозу. ATP пока в норме. Включится ли AMPK?", "p2a_1_o1": "Нет: AMP ведь не вырос", "p2a_1_o2": "Да: через альдолазу на лизосоме, без участия AMP", "p2a_1_o3": "Да, но только через Ca²⁺", "p2a_1_e": "Альдолаза без FBP запускает сборку комплекса с AXIN и LKB1 на лизосоме. AMPK включается раньше, чем упадёт ATP (Zhang 2017).", "p2a_1_w1": "AMPK чувствует не только AMP. Альдолаза без FBP собирает на лизосоме комплекс с AXIN и LKB1, и LKB1 фосфорилирует AMPK ещё до падения ATP.", "p2a_1_w3": "Ca²⁺ здесь не меняется. Нехватку глюкозы AMPK чувствует через альдолазу на лизосоме, а фосфорилирует её LKB1.", "p2a_2_q": "γ-субъединица AMPK не связывает AMP. Поднимем расход ATP. Что будет?", "p2a_2_o1": "AMPK включится как обычно", "p2a_2_o2": "AMPK почти не включится", "p2a_2_o3": "AMPK включится сильнее", "p2a_2_e": "Энергетический вход идёт через связывание AMP с γ. Без него AMPK не «видит» дефицита ATP — но на нехватку глюкозы и на Ca²⁺ отвечает.", "p2a_2_w1": "Энергетический вход работает через связывание AMP с γ-субъединицей. Если γ не связывает AMP, рост AMP AMPK не замечает.", "p2a_2_w3": "Без связывания AMP расход ATP нечем «передать» AMPK: она почти не включается.", "p2a_3_q": "Клетки без LKB1. Поднимем Ca²⁺. Что будет?", "p2a_3_o1": "Ничего: LKB1 нет", "p2a_3_o2": "AMPK включится через CaMKK2", "p2a_3_o3": "AMPK включится через AMP", "p2a_3_e": "CaMKK2 фосфорилирует тот же Thr172. В клетках без LKB1 AMPK включается через Ca²⁺ без изменения AMP (Hawley 2005).", "p2a_3_w1": "Thr172 фосфорилирует не только LKB1. При росте Ca²⁺ это делает CaMKK2, и AMPK включается без LKB1.", "p2a_3_w3": "AMP здесь не растёт: AMPK включается потому, что CaMKK2 фосфорилирует Thr172 (Hawley 2005).", "p2a_4_q": "AMPK работает 2 минуты: фосфорилированы ACC, HMGCR, TSC2, Raptor, ULK1, MFF. Что добавится через несколько часов?", "p2a_4_o1": "Ничего: всё уже сделано", "p2a_4_o2": "Новые лизосомы (FNIP1 → TFEB) и митохондрии (PGC-1α)", "p2a_4_o3": "AMPK выключится, и всё вернётся", "p2a_4_e": "Быстрый ответ — фосфорилирование ферментов. Медленный — смена программы генов: AMPK фосфорилирует FNIP1, TFEB уходит в ядро и включает гены лизосом, а затем PGC-1α — гены митохондрий (Malik 2023).", "p2a_4_w1": "За минуты меняется активность ферментов. Если AMPK работает часами, меняется программа генов: через FNIP1 и TFEB появляются новые лизосомы, через PGC-1α — митохондрии.", "p2a_4_w3": "Пока энергии не хватает, AMPK остаётся активной. Её долгая работа меняет гены: клетка строит новые лизосомы и митохондрии.", "s3_omm": "наружная мембрана", "s3_imm": "внутренняя мембрана", "s3_matrix_lbl": "матрикс", "s3_cit_lbl": "цитрат", "s3_mal": "малонил-CoA", "s3_fas": "синтез ЖК", "s3_box": "β-окисление", "s3_out": "ацетил-CoA → ЦТК → ATP", "s3_leg_acyl": "ацил-CoA", "s3_leg_carn": "ацилкарнитин", "s3_leg_free": "свободный карнитин", "s3_leg_mal": "малонил-CoA", "s3_leg_mcfa": "октаноат (C8)", "s3_r_acc": "активность ACC", "s3_r_mal": "малонил-CoA", "s3_r_cpt": "активность CPT1", "s3_r_syn": "синтез жирных кислот", "s3_r_ox": "β-окисление", "s3_ampk": "AMPK (энергии мало)", "s3_cit": "Цитрат (избыток углеводов)", "s3_c_syn": "ACC активна, малонил-CoA много. Он идёт на синтез жирных кислот и тормозит CPT1: ацил-CoA реже превращается в ацилкарнитин, перенос в митохондрию и окисление снижены.", "s3_c_syn_z": "Углеводов в избытке — клетка запасает энергию в жирных кислотах. Малонил-CoA сразу и сырьё для синтеза, и запрет на окисление: иначе новые жирные кислоты тут же сгорали бы в митохондрии.", "s3_c_mid": "Малонил-CoA на среднем уровне: CPT1 частично заторможена, синтез и окисление идут слабо.", "s3_c_mid_z": "Переключение плавное: чем меньше малонил-CoA, тем больше жирных кислот уходит на окисление.", "s3_c_ox": "AMPK фосфорилировала и выключила ACC; оставшийся малонил-CoA расходуется и разрушается малонил-CoA-декарбоксилазой. CPT1 работает: ацил-CoA → ацилкарнитин → через CACT в матрикс → CPT2 возвращает ацил-CoA → β-окисление.", "s3_c_ox_z": "Энергии мало — запасать незачем, нужно сжигать. Одно фосфорилирование ACC сразу резко снижает синтез и открывает жирным кислотам путь в митохондрию, где из них получается ATP.", "s3_c_ox_cit": "Цитрата мало, поэтому ACC почти не работает и малонил-CoA мало. CPT1 не заторможена: ацил-CoA → ацилкарнитин → через CACT в матрикс → CPT2 возвращает ацил-CoA → β-окисление.", "s3_c_ox_cit_z": "Цитрат в цитоплазме — признак того, что ацетил-CoA и ATP в избытке. Нет цитрата — запасать нечего, и жирные кислоты идут на окисление.", "s3b_take": "Малонил-CoA — общий узел: он сырьё для синтеза жирных кислот и тормоз CPT1, входа в митохондрию. Поэтому синтез и окисление не идут одновременно в полную силу. AMPK одним фосфорилированием ACC переключает клетку с запасания на сжигание.", "p3b_1_q": "Включим AMPK. Что будет с малонил-CoA и с потоком жирных кислот в митохондрию?", "p3b_1_o1": "Малонил-CoA вырастет, поток упадёт", "p3b_1_o2": "Малонил-CoA упадёт, поток вырастет", "p3b_1_o3": "Ничего не изменится", "p3b_1_e": "AMPK фосфорилирует ACC1 и ACC2 и выключает их. Малонил-CoA расходуется, CPT1 растормаживается.", "p3b_1_w1": "AMPK не включает, а выключает ACC — фермент, который делает малонил-CoA. Малонил-CoA падает, тормоз с CPT1 снимается, и поток в митохондрию растёт.", "p3b_1_w3": "Изменится: ACC — прямая мишень AMPK. Одно фосфорилирование выключает фермент, малонил-CoA падает, и CPT1 растормаживается.", "p3b_2_q": "Почему частица меняет цвет на CPT1, а потом снова на CPT2?", "p3b_2_o1": "Её окисляют дважды", "p3b_2_o2": "Ацил-CoA в цитоплазме и в матриксе — разные жирные кислоты", "p3b_2_o3": "Внутренняя мембрана не пропускает ацил-CoA: переносится ацилкарнитин, а в матриксе ацил снова переходит на CoA", "p3b_2_e": "CPT1 переносит ацил с CoA на карнитин, транспортёр CACT меняет ацилкарнитин на свободный карнитин, CPT2 возвращает ацил на CoA уже в матриксе. Запасы CoA в цитоплазме и в матриксе остаются раздельными.", "p3b_2_w1": "Смена цвета — не окисление. Ацил переходит с CoA на карнитин (CPT1), а в матриксе — обратно на CoA (CPT2). Окисляется он потом, в матриксе.", "p3b_2_w2": "Это одна и та же жирная кислота. Меняется только то, с чем связан ацил: CoA в цитоплазме, карнитин при переходе через внутреннюю мембрану, снова CoA в матриксе.", "p3b_3_q": "Пришло много углеводов (цитрат ↑). Что произойдёт?", "p3b_3_o1": "Синтез ЖК вырастет, окисление упадёт", "p3b_3_o2": "Окисление вырастет", "p3b_3_o3": "Оба процесса вырастут", "p3b_3_e": "Цитрат активирует ACC. Малонил-CoA одновременно питает синтез и тормозит CPT1: избыток углеводов уходит в запас, а не в топку.", "p3b_3_w2": "Цитрат активирует ACC. Малонил-CoA растёт и тормозит CPT1, поэтому окисление падает.", "p3b_3_w3": "Малонил-CoA и питает синтез, и тормозит CPT1. Поэтому синтез растёт, а окисление падает. Если бы росли оба, получился бы холостой цикл.", "s3a_ins": "+ инсулин", "s3a_eto_tag": "этомоксир", "s3a_fed": "Сытость (инсулин, цитрат)", "tis_t": "Ткань", "tis_liver": "печень", "tis_muscle": "мышца", "ch_t": "Жирная кислота", "ch_long": "пальмитат (C16)", "ch_medium": "октаноат (C8)", "geno3_t": "Генотип или препарат", "gt_acc2": "нет ACC2", "gt_ki": "ACC S79A/S212A", "gt_eto": "этомоксир", "s3a_fut": "Мысленный опыт: малонил-CoA не тормозит CPT1", "s3a_out_keto": "ацетил-CoA → кетоновые тела", "s3a_out_liver": "ацетил-CoA → ЦТК", "s3a_out_muscle": "ацетил-CoA → ЦТК → ATP", "s3a_r_mal2": "малонил-CoA у CPT1", "s3a_r_keto": "кетоновые тела", "s3a_r_atp": "ATP из жирных кислот", "s3a_r_fut": "холостой цикл", "s3a_c_syn": "Печень сыта: инсулин и цитрат держат ACC1 и ACC2 активными. Малонил-CoA идёт на синтез жирных кислот и тормозит CPT1.", "s3a_c_syn_z": "Избыток углеводов превращается в жир про запас; окислять его сейчас незачем.", "s3a_c_mfed": "Мышца сыта: ACC2 на наружной мембране делает малонил-CoA прямо у CPT1, и окисление жирных кислот заторможено. Синтеза жирных кислот в мышце почти нет.", "s3a_c_mfed_z": "В мышце малонил-CoA почти не идёт на синтез — он работает как регулятор: в сытости мышца сжигает глюкозу, а жирные кислоты не трогает.", "s3a_c_mid": "Малонил-CoA на среднем уровне: CPT1 частично заторможена.", "s3a_c_mid_z": "Переключение плавное: доля окисления растёт по мере падения малонил-CoA.", "s3a_c_ox": "Малонил-CoA мало, CPT1 работает, жирные кислоты идут через карнитиновый челнок на β-окисление.", "s3a_c_ox_z": "Голод или нагрузка: жирные кислоты становятся главным топливом.", "s3a_c_keto": "Голодная печень: малонил-CoA мало, жирные кислоты окисляются, а ацетил-CoA уходит на кетоновые тела.", "s3a_c_keto_z": "Печень сама живёт за счёт β-окисления, а кетоновые тела отдаёт мозгу и мышцам. Мозг почти не использует жирные кислоты как топливо, а кетоновые тела — использует.", "s3a_c_acc2": "Без ACC2 у CPT1 почти нет малонил-CoA. Даже в сытости CPT1 работает, и жирные кислоты окисляются.", "s3a_c_acc2_z": "У мышей без ACC2 малонил-CoA в сердце был в 10 раз, в мышцах в 30 раз ниже, а окисление жирных кислот выше (Abu-Elheiga 2001; Hoehn 2010). В другой линии мышей малонил-CoA и окисление в мышце не изменились — клетки нашли замену (Olson 2010). Масса жира в независимых линиях не менялась (Olson 2010; Hoehn 2010).", "s3a_c_acc2_liv": "Без ACC2 малонил-CoA у CPT1 остаётся только от ACC1. CPT1 тормозится слабее, чем в норме, и окисление выше; синтез жирных кислот от ACC2 не зависит.", "s3a_c_acc2_liv_z": "В печени много ACC1: её малонил-CoA идёт на синтез жирных кислот и отчасти тормозит CPT1. Какая доля доходит до CPT1, точно не известно — в модели она условная.", "s3a_c_ki": "ACC с заменами S79A/S212A нельзя фосфорилировать. AMPK активна, но ACC работает: малонил-CoA много, синтез идёт, окисление заторможено.", "s3a_c_ki_z": "У таких мышей больше синтез жира в печени, жировая печень и инсулинорезистентность, а метформин не улучшает обмен жиров и чувствительность к инсулину (Fullerton 2013). Через ACC AMPK и управляет жирами.", "s3a_c_eto": "Этомоксир необратимо выключает CPT1. Длинные жирные кислоты не входят в митохондрию, хотя малонил-CoA мало.", "s3a_c_eto_z": "Опыт доказывает: длинные жирные кислоты попадают в митохондрию только через CPT1. Избирательно этомоксир действует только в низкой дозе.", "s3a_c_mcfa": "Октаноат (C8) проходит мембраны без карнитинового челнока и активируется уже в матриксе. Малонил-CoA на него не действует.", "s3a_c_mcfa_z": "Поэтому жиры со средней длиной цепи окисляются и в сытости. Ими кормят больных с нарушениями окисления длинных жирных кислот.", "s3a_c_mcfa_eto": "Этомоксир выключил CPT1, но октаноат окисляется: ему CPT1 не нужен.", "s3a_c_mcfa_eto_z": "McGarry с соавторами (1977) показали: малонил-CoA тормозит окисление олеата, но не октаноата. Значит, он действует на вход через CPT1, а не на само β-окисление.", "s3a_c_mcfa_mus": "Окисление октаноата (C8) малонил-CoA почти не тормозит. В печени он входит в матрикс сам, а мышце для этого нужен карнитин (Pereyra 2021); в модели эта разница не показана.", "s3a_c_mcfa_mus_z": "Поэтому печень окисляет октаноат и без карнитина, а сердцу и мышцам карнитин нужен. У мышей без CPT2 в сердце диета с октаноатом не устранила поражение сердца (Pereyra 2021).", "s3a_c_futile": "Мысленный опыт: малонил-CoA не тормозит CPT1. В сытой печени жирные кислоты синтезируются и тут же сгорают — получается холостой цикл.", "s3a_c_futile_z": "На каждую молекулу пальмитата синтез тратит 7 ATP и 14 NADPH, а окисление возвращает энергию с потерями. Клетка тратила бы ресурсы впустую, а жир не запасался бы.", "s3a_take": "Малонил-CoA у CPT1 решает, войдут ли длинные жирные кислоты в митохондрию. ACC2 ставит этот тормоз прямо у CPT1, AMPK его снимает. Жирные кислоты средней длины идут в обход челнока. Без такого тормоза синтез и окисление шли бы одновременно.", "p3a_1_q": "Сытая мышца. Уберём ACC2. Что будет с окислением жирных кислот?", "p3a_1_o1": "Упадёт", "p3a_1_o2": "Вырастет: у CPT1 исчезнет малонил-CoA", "p3a_1_o3": "Не изменится: ведь ACC1 есть", "p3a_1_e": "В мышце главная ACC — ACC2 на наружной мембране митохондрии. Без неё CPT1 не тормозится даже в сытости (Abu-Elheiga 2001). В одной из линий мышей без ACC2 мышца нашла замену, и малонил-CoA не изменился (Olson 2010).", "p3a_1_w1": "ACC2 делает малонил-CoA, который тормозит CPT1. Без ACC2 тормоз слабее, и окисление не падает, а растёт.", "p3a_1_w3": "В мышце ACC1 мало, а малонил-CoA у CPT1 делает в основном ACC2 на наружной мембране митохондрии. Без неё тормоз пропадает (Abu-Elheiga 2001). Правда, в одной линии мышей мышца нашла замену (Olson 2010).", "p3a_2_q": "Печень мышей ACC S79A/S212A. Активируем AMPK. Что будет с синтезом жирных кислот?", "p3a_2_o1": "Упадёт, как обычно", "p3a_2_o2": "Не изменится", "p3a_2_o3": "Вырастет", "p3a_2_e": "AMPK активна, но не может фосфорилировать ACC. Значит, синтез жира AMPK тормозит именно через ACC (Fullerton 2013).", "p3a_2_w1": "AMPK тормозит синтез жира, фосфорилируя ACC по S79 (ACC1) и S212 (ACC2). Здесь эти серины заменены аланином, фосфорилировать нечего, и синтез не падает.", "p3a_2_w3": "AMPK не ускоряет синтез жира. Здесь она просто не может выключить ACC, и синтез остаётся прежним.", "p3a_3_q": "Голодная печень. Добавим этомоксир. Что будет с окислением пальмитата?", "p3a_3_o1": "Почти остановится", "p3a_3_o2": "Ускорится", "p3a_3_o3": "Не изменится", "p3a_3_e": "Этомоксир необратимо выключает CPT1. Без CPT1 длинные жирные кислоты не попадают в матрикс.", "p3a_3_w2": "Этомоксир — ингибитор CPT1. Без CPT1 пальмитат не превращается в пальмитоилкарнитин и не попадает в матрикс.", "p3a_3_w3": "Пальмитат — длинная жирная кислота, и в матрикс он попадает только через CPT1. Этомоксир её выключает, и окисление почти останавливается.", "p3a_4_q": "Этомоксир остался. Дадим октаноат (C8). Окисляется ли он?", "p3a_4_o1": "Нет: CPT1 ведь выключен", "p3a_4_o2": "Да: средние жирные кислоты проходят без карнитинового челнока", "p3a_4_o3": "Да, но только с добавленным карнитином", "p3a_4_e": "Октаноат проникает в матрикс сам и там превращается в октаноил-CoA. CPT1 и малонил-CoA на него не влияют (McGarry 1977).", "p3a_4_w1": "Октаноат — жирная кислота средней длины. Он проходит в матрикс без CPT1 и там соединяется с CoA.", "p3a_4_w3": "В печени октаноат входит в матрикс сам и там соединяется с CoA: карнитин ему не нужен. А вот мышце для этого карнитин нужен (Pereyra 2021).", "p3a_5_q": "Мысленный опыт: малонил-CoA не тормозит CPT1. Что будет в сытой печени?", "p3a_5_o1": "Клетка получит больше энергии", "p3a_5_o2": "Синтез и окисление пойдут одновременно — холостой цикл", "p3a_5_o3": "Синтез жирных кислот остановится", "p3a_5_e": "Новые жирные кислоты тут же уходят в митохондрию и сгорают. На каждую молекулу пальмитата впустую тратятся 7 ATP и 14 NADPH.", "p3a_5_w1": "Холостой цикл энергию не прибавляет, а тратит: на синтез каждой молекулы пальмитата уходят 7 ATP и 14 NADPH, а её окисление обратно до ацетил-CoA возвращает меньше.", "p3a_5_w3": "Малонил-CoA по-прежнему питает синтез: в этом мысленном опыте он только перестаёт тормозить CPT1. Синтез идёт, но новые жирные кислоты тут же сгорают.", "s4_play": "Пуск", "s4_pause": "Пауза", "s4_starve": "Убрать аминокислоты", "s4_feed": "Вернуть аминокислоты", "s4_reset": "Сначала", "s4_time": "От начала опыта: {h} ч", "s4_time2": "От начала: {h} ч · без аминокислот: {s} ч", "s4_plotcap": "Учебная модель, относительные величины.", "s4a_plotcap": "График — контрольная чашка (−Б). Учебная модель, относительные величины.", "s4_mk_starve": "голод", "s4_mk_feed": "еда", "s4_axis": "ч", "h_short": "ч", "s4_l_mtor": "mTORC1", "s4_l_auto": "переваривание в лизосомах", "s4_l_form": "образование аутофагосом", "s4a_l_mtor": "mTORC1 (по p-S6K)", "s4_l_lyso": "свободные лизосомы", "s4_l_aa": "аминокислоты", "s4_r_ly": "свободные лизосомы", "s4_block": "Протеазы лизосом заблокированы", "s4_leg_lyso": "лизосома", "s4_leg_ap": "аутофагосома", "s4_leg_al": "аутолизосома", "s4_leg_aa": "аминокислота", "s4_r_ap": "аутофагосомы", "s4_r_al": "аутолизосомы", "s4_c_fed": "Аминокислот хватает: mTORC1 на лизосоме и работает, аутофагия заторможена, TFEB фосфорилирован и сидит в цитоплазме.", "s4_c_fed_z": "Аминокислоты поступают снаружи — разбирать собственные белки незачем.", "s4_c_fall": "Аминокислоты из среды больше не поступают. Внутренний запас быстро расходуется на синтез белка, mTORC1 ещё работает.", "s4_c_fall_z": "Пока запас не иссяк, клетка живёт как обычно.", "s4_c_early": "За десятки минут аминокислоты кончились: mTORC1 ушёл с лизосомы и перестал тормозить ULK1. Появляются аутофагосомы, TFEB уходит в ядро.", "s4_c_early_z": "Внешний источник исчез — клетка переключается на внутренний: аутофагия захватывает часть собственных белков и органелл.", "s4_c_auto": "Аутофагосомы сливаются с лизосомами в аутолизосомы. Протеазы расщепляют белки до аминокислот, и те выходят в цитоплазму. Свободных лизосом становится меньше.", "s4_c_auto_z": "Так клетка переживает голод за счёт того, что можно разобрать: аминокислоты идут на самые нужные белки и на энергию.", "s4_c_react": "Аминокислот от аутофагии хватило, чтобы снова включить mTORC1. Он резко уменьшает образование новых аутофагосом и запускает восстановление лизосом: из аутолизосом вытягиваются трубочки и отделяются новые лизосомы.", "s4_c_react_z": "Аутофагия не должна идти бесконечно — иначе клетка разберёт сама себя. Возврат mTORC1 — отрицательная обратная связь: переработки ровно столько, сколько нужно.", "s4_c_done": "Лизосомы восстановлены, аутофагия ослабла. mTORC1 работает на аминокислотах, освобождённых при переработке.", "s4_c_done_z": "Клетка пришла в новое равновесие и снова готова к переработке, если голод продолжится.", "s4_c_block": "Протеазы лизосом заблокированы: аутолизосомы копятся, но аминокислоты не освобождаются. mTORC1 не возвращается, лизосомы не восстанавливаются.", "s4_c_block_z": "Без переваривания аутофагия бесполезна: груз копится, а питания нет. Похожее накопление бывает при лизосомных болезнях накопления.", "s4_c_refed": "Аминокислоты снова есть: mTORC1 работает, новых аутофагосом образуется мало, TFEB возвращается в цитоплазму.", "s4_c_refed_z": "Внешний источник вернулся — собственные запасы больше не трогаются.", "s4b_take": "Голод выключает mTORC1 за минуты, аутофагия набирает силу за часы, и освобождённые аминокислоты через 3–6 часов снова включают mTORC1. Он резко уменьшает образование новых аутофагосом (уже готовые ещё перевариваются) и восстанавливает лизосомы. Без лизосомных протеаз эта петля разрывается.", "p4b_1_q": "Уберём аминокислоты. Как быстро выключится mTORC1?", "p4b_1_o1": "За десятки минут", "p4b_1_o2": "Через сутки", "p4b_1_o3": "Не выключится", "p4b_1_e": "Свободных аминокислот в клетке немного, и синтез белка быстро их расходует. mTORC1 гаснет в первые полчаса.", "p4b_1_w2": "Сутки не нужны: mTORC1 следит за свободными аминокислотами, а их запаса хватает лишь на десятки минут синтеза белка.", "p4b_1_w3": "mTORC1 следит за аминокислотами постоянно. Когда их становится мало, RagA/B переходят в GDP-форму, и mTORC1 уходит с лизосомы.", "p4b_2_q": "Голод продолжается. Что будет с mTORC1 через несколько часов?", "p4b_2_o1": "Останется выключенным, пока не дадут еду", "p4b_2_o2": "Снова включится за счёт аминокислот из аутофагии", "p4b_2_o3": "Клетка погибнет", "p4b_2_e": "Аутолизосомы освобождают аминокислоты, и через несколько часов mTORC1 возвращается, хотя в среде аминокислот по-прежнему нет (Tan 2017; у Yu 2010 — голод без сыворотки и глутамина).", "p4b_2_w1": "У клетки есть внутренний источник — аутофагия. Аутолизосомы освобождают аминокислоты, и mTORC1 возвращается даже без еды.", "p4b_2_w3": "За несколько часов голода клетка не гибнет: аутофагия даёт ей аминокислоты, и mTORC1 снова включается.", "p4b_3_q": "Протеазы лизосом заблокированы. Вернётся ли mTORC1?", "p4b_3_o1": "Да, как обычно", "p4b_3_o2": "Нет: аминокислоты не освобождаются", "p4b_3_o3": "Вернётся быстрее", "p4b_3_e": "Слияние идёт, но белки не расщепляются. Без аминокислот mTORC1 не возвращается — значит, возвращает его именно лизосомный гидролиз (Yu 2010).", "p4b_3_w1": "mTORC1 возвращают аминокислоты, которые освобождают протеазы лизосом. Без протеаз белки груза не расщепляются, и mTORC1 не возвращается.", "p4b_3_w3": "Блок протеаз не ускоряет, а отменяет возврат mTORC1: аминокислоты из груза не освобождаются.", "p4b_4_q": "Три часа голода, аутофагия в разгаре. Вернём аминокислоты. Что будет?", "p4b_4_o1": "mTORC1 включится, новых аутофагосом станет намного меньше", "p4b_4_o2": "Ничего, пока не кончится аутофагия", "p4b_4_o3": "Аутофагия усилится", "p4b_4_e": "Внешние аминокислоты сразу возвращают mTORC1 на лизосому. Он фосфорилирует ULK1 и TFEB, новых аутофагосом образуется намного меньше, а уже готовые перевариваются.", "p4b_4_w2": "Ждать конца аутофагии не нужно: внешние аминокислоты сразу возвращают mTORC1 на лизосому, он фосфорилирует ULK1, и новых аутофагосом становится намного меньше. Готовые просто дойдут до лизосом.", "p4b_4_w3": "Аутофагию запускает нехватка аминокислот. Когда они вернулись, mTORC1 снова тормозит её запуск.", "um": "мкм", "s4a_y": "аутофагосома: GFP + mCherry", "s4a_r": "аутолизосома: GFP гаснет в кислой среде", "s4a_y_baf": "оба сигнала: аутофагосома или аутолизосома без кислоты", "s4a_r_baf": "красных нет: без кислой среды GFP не гаснет", "gt_atg7": "нет ATG7", "gt_ampk": "нет AMPK", "int_t": "Воздействие", "int_none": "нет", "int_prot": "ингибиторы протеаз", "int_rapa": "рапамицин с 2 ч", "int_none_k": "без воздействия", "s4a_bafview": "Вторая чашка: + бафиломицин за 2 ч до съёмки", "s4a_baf_on": "+ бафиломицин с {h} ч", "s4a_since": "без аминокислот {s} ч", "s4a_dish_ctrl": "Чашка без бафиломицина", "s4a_dish_baf": "Вторая чашка: + бафиломицин", "s4a_r_s6k": "mTORC1 → p-S6K (чувствителен к рапамицину)", "s4a_r_ulk": "mTORC1 → p-ULK1 S757 (устойчив к рапамицину)", "blot_t4": "Вестерн-блот: LC3 и p62", "blot_rec4": "Снять блот ± бафиломицин", "blot_flux": "{h} · {g} · {i}: с бафиломицином за {x} ч LC3-II больше на {d} = {a} (в контроле переварен) + {b} (лишние аутофагосомы во второй чашке)", "blot_flux_zero": "{h} · {g} · {i}: с бафиломицином за {x} ч прибавки LC3-II нет", "blot_flux0": "{h} · {g} · {i}: бафиломицин ещё не успел подействовать", "blot_fed": "сыто", "blot_refed": "после еды", "blot_starved": "{h} ч голода", "blot_note4": "−Б и +Б — две чашки, снятые в один момент; во вторую бафиломицин добавили за 2 ч до съёмки. Прибавка LC3-II = LC3-II, который в контроле успел перевариться, + аутофагосомы, которые во второй чашке образовались сверх контроля. Числа условные.", "s4a_ny": "жёлтые точки", "s4a_nr": "красные точки", "s4a_c_fed": "Сыто: точек почти нет — аутофагия на базальном уровне. LC3 в основном в форме LC3-I.", "s4a_c_fed_z": "Базальная аутофагия идёт всегда и убирает старые белки и органеллы, но она мала.", "s4a_c_early": "Начало голода: появляются жёлтые точки — аутофагосомы. В них светят и GFP, и mCherry.", "s4a_c_early_z": "Пока аутофагосома не слилась с лизосомой, среда в ней не кислая, и GFP светит.", "s4a_c_peak": "Много красных точек: аутофагосомы слились с лизосомами. В кислой среде GFP гаснет, а mCherry светит дальше.", "s4a_c_peak_z": "Красные точки — признак того, что груз дошёл до лизосом: поток идёт.", "s4a_c_react": "mTORC1 возвращается: новые аутофагосомы образуются всё реже, а уже готовые аутолизосомы ещё перевариваются.", "s4a_c_react_z": "Отрицательная обратная связь уменьшила образование новых аутофагосом.", "s4a_c_refed": "Аминокислоты вернули: mTORC1 работает, новых аутофагосом образуется мало.", "s4a_c_refed_z": "Собственные запасы больше не нужны.", "s4a_c_atg7": "Без ATG7 LC3 не присоединяется к мембране: точек нет, LC3-II нет, свечение равномерное. p62 копится, mTORC1 не возвращается.", "s4a_c_atg7_z": "Без аутофагии у голодающей клетки нет внутреннего источника аминокислот.", "s4a_c_prot": "Протеазы заблокированы: красных точек всё больше. Слияние и закисление идут, а переваривания нет. LC3-II и p62 копятся.", "s4a_c_prot_z": "Много точек и много LC3-II ещё не значат, что аутофагия сильная: груз может просто не перевариваться.", "s4a_c_rapa": "Рапамицин с 2 ч: p-S6K не возвращается, хотя аминокислоты из аутофагии уже есть. А ULK1 (S757) снова фосфорилируется — этот сайт к рапамицину во многом устойчив, и в модели новых аутофагосом становится мало. Свободные лизосомы не восстанавливаются.", "s4a_c_rapa_z": "Разные мишени mTORC1 по-разному чувствительны к рапамицину (Kang 2013). Восстановлению лизосом нужна та часть активности mTORC1, которую рапамицин подавляет: у Yu 2010 крупные аутолизосомы сохранялись до 10 ч.", "s4a_c_ampk": "Без AMPK точек больше: аутофагия сильнее. А mTORC1 возвращается хуже.", "s4a_c_ampk_z": "При долгом голоде по аминокислотам AMPK сдерживает аутофагию и поддерживает возврат mTORC1, а без AMPK клетки чаще гибнут (Kazyken 2024). Механизм ещё изучают.", "s4a_c_baf": "Вторая чашка: бафиломицин A1 добавлен {x} ч назад и выключил v-ATPase. Кислой среды нет, GFP не гаснет — жёлтыми видны и аутофагосомы, и аутолизосомы. Точек больше: за эти часы в лизосомах ничего не переварилось.", "s4a_c_baf_z": "Прибавка LC3-II во второй чашке складывается из двух частей: LC3-II, который в контроле успел перевариться, и новых аутофагосом — с бафиломицином аминокислоты не выходят из лизосом, mTORC1 не возвращается, и аутофагосомы образуются дольше. Обе части видны в подписи к блоту. В модели слияние под бафиломицином продолжается — это упрощение: в части клеток бафиломицин мешает и слиянию (Mauvezin 2015).", "s4a_c_baf_prot": "Вторая чашка: к ингибиторам протеаз добавили бафиломицин. Красные точки стали жёлтыми: кислой среды нет, GFP не гаснет. Но точек столько же: переваривание и так было остановлено, и прибавки LC3-II почти нет.", "s4a_c_baf_prot_z": "Если выход уже перекрыт, второй блок ничего не добавляет. Поэтому по одной картинке или одной полосе поток не определить — нужна пара «с бафиломицином и без».", "s4a_take": "Аутофагию измеряют по потоку, а не по числу точек. Без бафиломицина тандем mCherry-GFP-LC3 отличает аутофагосомы (жёлтые) от аутолизосом (красные); с бафиломицином жёлтыми становятся и те и другие. Прибавка LC3-II с бафиломицином помогает оценить оборот LC3-II, но не равна количеству переваренного груза: бафиломицин и сам меняет образование аутофагосом. ATG7 нужен для образования аутофагосом, протеазы — для возврата аминокислот, mTORC1 — для восстановления лизосом.", "p4a_1_q": "Четыре часа голода. LC3-II на блоте выше, чем в сытости. Значит ли это, что аутофагия усилилась?", "p4a_1_o1": "Да, обязательно", "p4a_1_o2": "Не обязательно: LC3-II растёт и при блоке переваривания. Сравним с бафиломицином", "p4a_1_o3": "Нет, аутофагия ослабла", "p4a_1_e": "Во второй чашке LC3-II намного выше. Почти вся прибавка — LC3-II, который в первой чашке за эти 2 часа успел перевариться: оборот LC3-II высокий (Klionsky 2021). Небольшую часть дают новые аутофагосомы: с бафиломицином аминокислоты не освобождаются, и mTORC1 не возвращается. Обе части видны в подписи к блоту.", "p4a_1_w1": "LC3-II растёт и тогда, когда аутофагосомы образуются чаще, и тогда, когда их хуже переваривают. По одной полосе это не отличить — нужна вторая чашка с бафиломицином.", "p4a_1_w3": "По одной полосе ослабление не доказать и не исключить: LC3-II растёт и при частом образовании, и при плохом переваривании. Здесь бафиломицин дал большую прибавку — значит, LC3-II быстро переваривается, и аутофагия не ослабла.", "p4a_2_q": "Протеазы лизосом заблокированы. Какие точки будут через 4 часа голода?", "p4a_2_o1": "В основном жёлтые", "p4a_2_o2": "Много красных", "p4a_2_o3": "Никаких", "p4a_2_e": "Слияние и закисление идут — GFP гаснет, но груз не переваривается. Красные точки копятся.", "p4a_2_w1": "Ингибиторы протеаз не мешают слиянию и закислению. В кислой аутолизосоме GFP гаснет, остаётся mCherry, поэтому копятся красные точки.", "p4a_2_w3": "Аутофагосомы образуются как обычно, но содержимое не переваривается. Точек не меньше, а больше, и многие из них красные.", "p4a_3_q": "Добавим бафиломицин. Что станет с красными точками?", "p4a_3_o1": "Станут жёлтыми", "p4a_3_o2": "Станут ярче", "p4a_3_o3": "Исчезнут", "p4a_3_e": "Бафиломицин выключает v-ATPase: среда перестаёт быть кислой, и GFP снова светит — жёлтыми становятся и аутолизосомы. Значит, жёлтая точка с бафиломицином не обязательно аутофагосома (Kimura 2007).", "p4a_3_w2": "Главное — не яркость, а цвет: без кислой среды GFP снова светит вместе с mCherry, и точки становятся жёлтыми.", "p4a_3_w3": "Бафиломицин ничего не разрушает, он лишь убирает кислую среду. Точки остаются, но становятся жёлтыми.", "p4a_4_q": "Те же 4 часа с ингибиторами протеаз. Снимем блот с бафиломицином и без. Какой будет прибавка LC3-II?", "p4a_4_o1": "Большая: аутофагия сильная", "p4a_4_o2": "Почти никакой: переваривание уже остановлено", "p4a_4_o3": "С бафиломицином LC3-II станет меньше", "p4a_4_e": "Ингибиторы протеаз уже остановили переваривание, и бафиломицину нечего добавить: LC3-II в обеих чашках почти одинаков. Много точек и много LC3-II без прибавки от бафиломицина — признак блока, а не сильной аутофагии.", "p4a_4_w1": "Много LC3-II здесь из-за блока: переваривание уже остановлено ингибиторами протеаз, и бафиломицину нечего добавить.", "p4a_4_w3": "Бафиломицин не ускоряет разрушение LC3-II. Если переваривание уже остановлено, LC3-II с бафиломицином будет почти таким же.", "p4a_5_q": "Клетки без ATG7. Что покажет блот через 6 ч голода?", "p4a_5_o1": "LC3-II нет, p62 больше, p-S6K нет", "p4a_5_o2": "Как в норме", "p4a_5_o3": "LC3-II очень много", "p4a_5_e": "ATG7 нужен, чтобы присоединить LC3 к фосфатидилэтаноламину. Нет LC3-II — аутофагия почти не идёт, p62 не разрушается, аминокислоты не возвращаются.", "p4a_5_w2": "ATG7 присоединяет LC3 к фосфатидилэтаноламину. Без него LC3-II не образуется, аутофагия почти не идёт, p62 копится.", "p4a_5_w3": "Без ATG7 LC3-II не образуется: на блоте нет полосы LC3-II, остаётся только LC3-I.", "p4a_6_q": "Рапамицин с 2 часов голода. Что будет к 8 часам?", "p4a_6_o1": "Всё как в норме", "p4a_6_o2": "p-S6K не вернётся, лизосомы не восстановятся", "p4a_6_o3": "Новые аутофагосомы будут образовываться всё сильнее", "p4a_6_e": "Аминокислоты из аутофагии есть, но рапамицин не даёт вернуться p-S6K, и лизосомы из аутолизосом не восстанавливаются (Yu 2010). Фосфорилирование ULK1 (S757) к рапамицину во многом устойчиво (Kang 2013), поэтому в модели новых аутофагосом мало; в опыте Yu это прямо не проверяли.", "p4a_6_w1": "Рапамицин подавляет ту часть активности mTORC1, которая нужна для p-S6K и для восстановления лизосом из аутолизосом. Поэтому p-S6K не возвращается, а лизосомы не восстанавливаются.", "p4a_6_w3": "Фосфорилирование ULK1 (S757) к рапамицину во многом устойчиво: когда аминокислоты вернулись, mTORC1 снова тормозит ULK1. В модели новых аутофагосом становится мало.", "gn_rag": "Rag-ГТФазы (RagA/B · RagC/D)", "g_rag": "Пара малых ГТФаз на лизосоме, закреплённая комплексом Ragulator. При аминокислотах RagA/B связаны с GTP, RagC/D — с GDP, и пара притягивает mTORC1 к лизосоме, связывая Raptor.", "gn_rheb": "RHEB", "g_rheb": "Малая ГТФаза на мембране лизосомы. В GTP-форме прямо включает киназу mTORC1. TSC переводит её в GDP-форму.", "gn_tsc": "TSC (TSC1 · TSC2 · TBC1D7)", "g_tsc": "Тормоз: TSC2 — белок, ускоряющий гидролиз GTP на RHEB (GAP). AKT фосфорилирует TSC2, и комплекс уходит с лизосомы; при нехватке аминокислот Rag-ГТФазы возвращают его на лизосому. При нехватке энергии AMPK фосфорилирует TSC2 и усиливает его (Inoki 2003). Мутации TSC1 или TSC2 — туберозный склероз.", "gn_akt": "AKT", "g_akt": "Киназа ростового сигнала: инсулин → рецептор → PI3K → PIP3 → AKT. Фосфорилирует TSC2 и PRAS40.", "gn_mtorc1": "mTORC1", "g_mtorc1": "Комплекс киназы mTOR с Raptor и mLST8. Включает синтез белка, липидов и нуклеотидов, тормозит аутофагию и синтез лизосом.", "gn_tfeb": "TFEB", "g_tfeb": "Транскрипционный фактор генов лизосом и аутофагии. Фосфорилированный mTORC1 (S211) связан с белками 14-3-3 в цитоплазме; без фосфата идёт в ядро.", "gn_s6k": "S6K1", "g_s6k": "Киназа, которую включает mTORC1 (T389). Усиливает синтез белка и рибосом; через IRS1 ослабляет сигнал инсулина — обратная связь.", "gn_ebp": "4E-BP1", "g_ebp": "Держит фактор инициации трансляции eIF4E. Когда mTORC1 его фосфорилирует, 4E-BP1 отпускает eIF4E, и начинается трансляция.", "gn_ulk1": "ULK1", "g_ulk1": "Киназа, запускающая образование аутофагосомы. mTORC1 выключает её фосфорилированием S757. AMPK фосфорилирует другие её сайты; по классической схеме это запускает аутофагию, по новым данным при остром дефиците энергии скорее сдерживает её. Вопрос обсуждается.", "gn_sestrin": "Sestrin2", "g_sestrin": "Датчик лейцина в цитоплазме (Kd около 20 мкМ). Без лейцина связывает GATOR2 и тормозит его.", "gn_castor": "CASTOR1", "g_castor": "Датчик аргинина в цитоплазме. Без аргинина связывает GATOR2 и тормозит его.", "gn_samtor": "SAMTOR", "g_samtor": "Датчик S-аденозилметионина (SAM). Без SAM связывается с GATOR1 и KICSTOR и усиливает торможение mTORC1.", "gn_gator2": "GATOR2", "g_gator2": "Комплекс, который тормозит GATOR1. Его выключают свободные Sestrin2 и CASTOR1.", "gn_gator1": "GATOR1", "g_gator1": "GAP для RagA/B: переводит их в GDP-форму. Работает при голоде. Мутации его субъединицы DEPDC5 вызывают фокальную эпилепсию.", "gn_flcn": "FLCN (фолликулин)", "g_flcn": "Вместе с FNIP — GAP для RagC/D: переводит их в GDP-форму. Нужен для фосфорилирования TFEB, но не S6K. Мутации — синдром Бёрта — Хогга — Дюбе.", "gn_slc38a9": "SLC38A9", "g_slc38a9": "Транспортёр в мембране лизосомы. Чувствует аргинин в просвете и активирует Rag-ГТФазы; выводит из лизосомы лейцин и другие незаменимые аминокислоты.", "gn_ampk": "AMPK", "g_ampk": "Три субъединицы: α (киназа), β (каркас), γ (связывает AMP, ADP или ATP). Активна, когда Thr172 в α фосфорилирован. Урезает траты ATP и включает его производство.", "gn_lkb1": "LKB1", "g_lkb1": "Постоянно активная киназа Thr172 в AMPK. Супрессор опухолей: синдром Пейтца — Егерса, опухоли лёгкого.", "gn_camkk2": "CaMKK2", "g_camkk2": "Киназа, которая фосфорилирует Thr172 при росте Ca²⁺ в цитоплазме, без участия AMP.", "gn_aldolase": "Альдолаза", "g_aldolase": "Фермент гликолиза. Без своего субстрата фруктозо-1,6-бисфосфата подаёт сигнал на лизосоме: собирает v-ATPase — Ragulator — AXIN — LKB1 и включает AMPK.", "gn_axin": "AXIN", "g_axin": "Каркасный белок: при нехватке глюкозы приводит LKB1 к AMPK на лизосоме.", "gn_acc": "ACC (ацетил-CoA-карбоксилаза)", "g_acc": "Делает малонил-CoA из ацетил-CoA и CO₂, тратя ATP. AMPK выключает её фосфорилированием (у мыши ACC1 — S79, ACC2 — S212).", "gn_acc1": "ACC1", "g_acc1": "ACC в цитоплазме печени и жировой ткани: малонил-CoA для синтеза жирных кислот. AMPK выключает её фосфорилированием S79.", "gn_acc2": "ACC2", "g_acc2": "ACC на наружной мембране митохондрий (мышцы, сердце, печень). Её малонил-CoA тормозит соседний CPT1. AMPK выключает её фосфорилированием S212 (у мыши).", "gn_raptor": "Raptor", "g_raptor": "Белок-каркас mTORC1: подводит к киназе mTOR её субстраты. AMPK фосфорилирует Raptor (S722, S792), к нему присоединяется белок 14-3-3, и mTORC1 тормозится. Этот путь работает даже в клетках без TSC2 (Gwinn 2008).", "gn_ampkmtor": "Как AMPK тормозит mTORC1", "g_ampkmtor": "Двумя путями. AMPK фосфорилирует TSC2 и усиливает его: TSC2 переводит RHEB в GDP-форму (Inoki 2003). Ещё AMPK фосфорилирует Raptor внутри самого mTORC1, и комплекс тормозится даже без TSC2 (Gwinn 2008). Фосфорилирование само по себе не значит «выключение»: TSC2 оно активирует, а Raptor тормозит.", "gn_hmgcr": "HMGCR", "g_hmgcr": "ГМГ-CoA-редуктаза — ключевой фермент синтеза холестерина и мишень статинов. AMPK её выключает.", "gn_mff": "MFF", "g_mff": "Белок наружной мембраны митохондрий, привлекающий DRP1. Фосфорилирование AMPK ускоряет деление митохондрий.", "gn_pgc1a": "PGC-1α", "g_pgc1a": "Коактиватор генов митохондрий. AMPK повышает его активность и количество (в том числе через TFEB); результат — новые митохондрии через часы и дни.", "gn_citrate": "Цитрат", "g_citrate": "При избытке углеводов выходит из митохондрий, даёт ацетил-CoA для синтеза и активирует ACC.", "gn_fasn": "FASN (синтаза жирных кислот)", "g_fasn": "Собирает пальмитат из ацетил-CoA и 7 молекул малонил-CoA, тратя 14 NADPH.", "gn_cpt1": "CPT1", "g_cpt1": "Карнитин-пальмитоилтрансфераза 1 на наружной мембране митохондрии: переносит ацил с CoA на карнитин. Тормозится малонил-CoA, необратимо — этомоксиром. В печени работает CPT1A, в мышцах и сердце — CPT1B, во много раз более чувствительная к малонил-CoA. В раздробленных митохондриях CPT1 к малонил-CoA менее чувствительна (Ngo 2023).", "gn_cact": "CACT", "g_cact": "Транспортёр внутренней мембраны: вносит ац function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }

}

function blotHTML(rows, lanes){
  if (!lanes.length) return `<p class="small">${t('blot_empty')}</p>`;
  let h = `<div class="blotbox"><div class="blotgrid"><div><div class="head" style="visibility:hidden">·<br>·</div><div style="padding:3px 0;border:1px solid transparent">`;
  h += rows.map(r => `<div class="rowlab">${r}</div>`).join('') + `</div></div><div>`;
  h += `<div class="lanes">` + lanes.map(L => `<div class="head">${L.h1}<br>${L.h2 || '&nbsp;'}</div>`).join('') + `</div>`;
  h += `<div class="film"><div class="lanes">` + lanes.map(L => `<div>` + L.v.map(v => `<div class="cell"><div class="band" style="opacity:${(0.04 + 0.96 * clamp(v)).toFixed(2)}"></div></div>`).join('') + `</div>`).join('') + `</div></div>`;
  return h + `</div></div></div>`;
}

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py --student) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 'v21';
function poeRender(){
  Object.keys(SCENES).forEach(k => { const b = $('poe' + k); b.hidden = true; b.innerHTML = ''; });
  const capOn = !$('capT') || $('capT').checked;
  document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !capOn);
  if (!POE.on) return;
  /* пока студенты думают, подпись и вывод скрыты: они могли бы подсказать ответ */
  if (!POE.shown){ $('capbox' + cur).hidden = true; $('take' + cur).parentElement.hidden = true; }
  const S = SCENES[cur], box = $('poe' + cur), steps = S.poe, st = steps[POE.i], P = `p${cur}_${POE.i + 1}`;
  box.hidden = false;
  const letters = ['А', 'Б', 'В', 'Г'];
  let h = `<div class="k">${t('poe_step', { i: POE.i + 1, n: steps.length })}</div><div class="q">${t(P + '_q')}</div><div class="opts">`;
  const perm = poePerm(cur, POE.i, st.n, st.ok);
  for (let d = 0; d < st.n; d++){
    const j = perm[d];
    let cls = 'opt';
    if (POE.pick === j) cls += ' picked';
    if (POE.shown && j === st.ok) cls += ' right';
    if (POE.shown && POE.pick === j && j !== st.ok) cls += ' wrongpick';
    h += `<button class="${cls}" data-j="${j}"${STUDENT && POE.shown ? ' disabled' : ''}><span class="L">${letters[d]}</span><span>${t(P + '_o' + (j + 1))}</span></button>`;
  }
  h += `</div>`;
  if (POE.shown && STUDENT && POE.pick != null && POE.pick !== st.ok) h += `<p class="ex wrongex"><b>${t('poe_your')}</b> ${t(P + '_w' + (POE.pick + 1))}</p>`;
  if (POE.shown) h += `<p class="ex"><b>${t('poe_ans')}</b> ${t(P + '_e')}</p>`;
  const last = POE.i === steps.length - 1, needPick = STUDENT && POE.pick == null;
  const done = Object.keys(POE.res).filter(k => k.startsWith(cur + ':')), right = done.filter(k => POE.res[k]).length;
  h += `<div class="nav">` + (POE.shown ? '' : `<button class="btn" id="poeShow"${needPick ? ' disabled' : ''}>${t('poe_show')}</button>`) +
    (POE.i > 0 ? `<button class="btn ghost" id="poePrev">${t('poe_prev')}</button>` : '') +
    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT && POE.shown ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>`) +
    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); });
  if (needPick && !POE.shown) box.querySelector('.nav').insertAdjacentHTML('beforeend', `<span class="small" style="align-self:center">${t('poe_pick_first')}</span>`);
  if ($('poeShow')) $('poeShow').onclick = () => { if (STUDENT && POE.pick == null) return; POE.shown = true;
    const key = cur + ':' + POE.i; if (!(key in POE.res)) POE.res[key] = POE.pick === st.ok; st.apply(); S.update(); poeRender(); };
  if ($('poePrev')) $('poePrev').onclick = () => { POE.i--; POE.pick = null; POE.shown = false; poeSetup(); };
  if ($('poeNext')) $('poeNext').onclick = () => { POE.i++; POE.pick = null; POE.shown = false; poeSetup(); };
  $('poeExit').onclick = () => { POE.on = false; poeRender(); };
  box.scrollIntoView({ block: 'nearest' });
}
function poeSetup(){ const st = SCENES[cur].poe[POE.i]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

let cur = '1b', qn = 1, lvl = 'b';

function fitStage(){

function initNav(){

  $('legendBtn').onclick = () => { try { $('legendDlg').showModal(); } catch(e){ $('legendDlg').setAttribute('open', ''); } };

  $('fsBtn').onclick = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch(e){} };
  window.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (STUDENT && POE.on) return;
    if (['1', '2', '3', '4'].includes(e.key)){ qn = +e.key; show(); }
    if (e.key === 'b' || e.key === 'и'){ lvl = lvl === 'b' ? 'a' : 'b'; show(); } });
  $('srcList').innerHTML = Object.keys(TEXTS).filter(k => k.startsWith('src_')).sort().map(k => `<li>${TEXTS[k]}</li>`).join('');
  let last = performance.now();
  const calm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const loop = now => { const dt = Math.min(.1, (now - last) / 1000); last = now; const S = SCENES[cur]; if (S && S.tick && !(S.decor && calm.matches)) S.tick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitStage(); const S = SCENES[cur]; if (S && S.redraw) S.redraw(); }, 60));
}

function mitoParticles(K, n){
  const g = $('s' + K + '_pp'), car = $('s' + K + '_car'), P = [], C = [];
  for (let i = 0; i < n; i++){
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 5.5); g.appendChild(c);
    P.push({ c, st: 'cyto', x: 210 + Math.random() * 240, y: 80 + Math.random() * 120, vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30, a: 1, kind: 'L', t: 0 });
  }
  function spawn(p, o){
    p.st = 'cyto'; p.a = 1; p.kind = o.medium ? 'M' : 'L';
    if (o.fromFAS && Math.random() < o.fromFAS){ p.x = 112; p.y = 178; p.vx = 40 + Math.random() * 20; p.vy = (Math.random() - .5) * 20; }
    else { p.x = 220 + Math.random() * 230; p.y = 72 + Math.random() * 16; p.vx = (Math.random() - .5) * 30; p.vy = 14 + Math.random() * 16; }
  }
  function carnitine(){
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 3.2); c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'var(--muted)'); c.setAttribute('stroke-width', 1.6);
    car.appendChild(c); C.push({ c, x: 290, y: 300, a: 1 });
  }
  function tick(dt, o){
    for (const p of P){
      if (p.st === 'cyto'){
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 200 && p.vx < 0 && p.y > 70) p.vx = Math.abs(p.vx);
        if (p.x > 462) p.vx = -Math.abs(p.vx);
        if (p.y < 70) p.vy = Math.abs(p.vy);
        if (p.y > 206){
          if (p.kind === 'L' && Math.abs(p.x - 302) < 28 && Math.random() < o.cpt1 * 6 * dt){ p.st = 'cpt1'; p.x = 302; }
          else if (p.kind === 'M' && p.x > 380 && Math.random() < o.mcfa * 6 * dt){ p.st = 'mdown'; }
          else if (p.y > 212){ p.y = 212; p.vy = -(10 + Math.random() * 20); p.vx = (Math.random() - .5) * 50; }
        } else if (Math.random() < .6 * dt) p.vy += 14;
      } else if (p.st === 'cpt1'){
        p.y += 34 * dt; if (p.y > 254) p.kind = 'C';
        if (p.y > 272){ p.st = 'cact'; }
      } else if (p.st === 'cact'){
        p.y += 30 * dt; if (p.y > 304){ p.st = 'mat'; carnitine(); }
      } else if (p.st === 'mat'){
        p.x += 50 * dt; p.y += (305 - p.y) * 3 * dt; if (p.x > 352) p.kind = 'L';
        if (p.x > 404) p.st = 'box';
      } else if (p.st === 'mdown'){
        p.y += 40 * dt; if (p.y > 300){ p.st = 'box'; p.y = 305; }
      } else if (p.st === 'box'){
        p.x += 55 * dt; p.y += (340 - p.y) * 1.6 * dt; p.a -= .7 * dt;
        if (p.a <= 0 || p.x > 500) spawn(p, o);
      }
      p.c.setAttribute('cx', p.x.toFixed(1)); p.c.setAttribute('cy', p.y.toFixed(1)); p.c.setAttribute('opacity', Math.max(0, p.a).toFixed(2));
      p.c.setAttribute('fill', p.kind === 'C' ? 'var(--carn)' : p.kind === 'M' ? 'var(--aa)' : 'var(--acyl)');
    }
    for (let i = C.length - 1; i >= 0; i--){ const q = C[i]; q.y -= 26 * dt; q.a -= .9 * dt; q.c.setAttribute('cx', q.x); q.c.setAttribute('cy', q.y.toFixed(1)); q.c.setAttribute('opacity', Math.max(0, q.a).toFixed(2)); if (q.a <= 0){ q.c.remove(); C.splice(i, 1); } }
  }

/* =====================================================================
   Вопрос 4. Аутофагия → лизосомный гидролиз → повторная активация mTORC1
   Общая модель во времени (часы). Параметры подобраны под порядок событий у Yu et al. 2010:
   mTORC1 гаснет за ~0,5 ч, возвращается к ~3–5 ч, аутофагия максимальна к ~4–5 ч,
   лизосом меньше всего к ~3 ч, восстановлены к ~8–12 ч. Числа условные.
   4b — базовый: мультфильм + график;  4a — «измерь поток»: микроскоп mCherry-GFP-LC3, блот ± бафиломицин, мутанты
   v2.1: у mTORC1 два выхода — чувствительный к рапамицину (S6K, восстановление лизосом) и устойчивый (ULK1 S757,
   торможение аутофагии; Thoreen 2009, Kang 2013). Бафиломицин — вторая чашка: копия клетки за 2 ч до съёмки,

const AUTO = { kb: .9, ks: 1.3, y: 4.5, ka: .7, kf: 1.44, kd: .235, c: 1.94, kr: .95, kbio: .036, tauA: 1.42, tauT: 2.4, alr: 2, kl: 2.5 };   // v2.1: подогнано под Yu 2010 (p-S6K подавлен к 2 ч, восстановлен к 6 ч; лизосом меньше всего около 3–4 ч)
const AUTO_KEYS = ['t', 'E', 'AA', 'A', 'AP', 'AL', 'Lc', 'L', 'T', 'R', 'p62', 'M', 'Mres', 'Mr', 'form', 'fus', 'deg', 'dipped'];
function autoCk(S){ const c = {}; AUTO_KEYS.forEach(k => c[k] = S[k]); return c; }
function autoNew(o){
  const S = Object.assign({ t: 0, E: 1, AA: 1, A: 0, AP: 0, AL: 0, Lc: 0, L: 1, T: 0, R: 1, p62: .5, M: 1, Mres: 1, Mr: 1, form: 0, fus: 0, deg: 0,
    hist: [], marks: [], refeed: [], ev: [], ck: [], run: false, dipped: false, geno: 'wt', inter: 'none', block: false, baf: false, t0: null }, o || {});
  if (!(o && o.raw)){                                        // сытая клетка в равновесии: идёт небольшая базальная аутофагия
    for (let i = 0; i < 800; i++) autoStep(S, .005);
    S.t = 0; S.dipped = false;
  }
  if (S.geno === 'atg7' && !(o && 'p62' in o)) S.p62 = .8;   // без ATG7 p62 повышен уже в сытости
  S.ck.push(autoCk(S)); return S;
}
function autoStep(S, dt){

  let Mres = Mr;                                               // выход mTORC1, устойчивый к рапамицину (ULK1 S757)
  if (S.geno === 'ampk' && !S.E && S.t0 != null) Mres *= 1 - .4 * clamp((S.t - S.t0 - 1) / 2);
  let M = Mres;                                                // выход, чувствительный к рапамицину (S6K, восстановление лизосом)
  if (S.inter === 'rapa' && S.t0 != null && S.t >= S.t0 + 2) M = .1 * Mres;
  const block = (S.block || S.inter === 'prot' || S.baf) ? 1 : 0, atg = S.geno === 'atg7' ? 0 : 1;
  const ka = P.ka * (S.geno === 'ampk' ? 1.4 : 1);

  const fusL = P.kf * S.L * S.AP, fusA = P.kf * S.AL / (1 + S.AL) * S.AP, fus = fusL + fusA;   // аутофагосомы сливаются с лизосомами и с уже готовыми аутолизосомами
  const dAA = S.E * (P.kb + P.ks) - S.AA * (P.kb + P.ks * M) + P.y * deg - 20 * Math.max(0, S.AA - 1);   // избыток аминокислот окисляется
  const dA = ((.05 + .95 * (1 - Mres)) - S.A) / P.tauA;   // небольшая базальная аутофагия идёт всегда
  const dL = -P.c * fusL + P.kr * M * (1 - S.L) * (1 + P.alr * S.AL) + P.kbio * S.T * (1 - S.L);

function autoBranch(S, hours, baf, onStep){

  }

}

}
