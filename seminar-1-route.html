<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-1.html">← Вернуться к семинару</a> · <a href="section-1.html#seminars">← Раздел I: семинары</a></p><h1>Компартменты, локальные условия и обмен</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-compartment"><div class="eyebrow">Компартменты и локальные условия · шаг 1 из 30</div><h2>Что делает органеллу компартментом</h2><p class="lead">Компартмент задан не формой, а границей и условиями, которые эта граница удерживает: pH, концентрацией свободного Ca²⁺, потенциалом пары глутатиона и характерным фосфоинозитидом.</p><ol class="mech"><li><a href="#ns-g-S1-T01">Компартмент</a> — область клетки с собственным набором физико-химических условий и границей, которая этот набор удерживает.</li><li><a href="#ns-g-S1-T02">Липидный бислой</a> почти непроницаем для ионов: он удерживает различие, но не создаёт его; создают различие насосы мембраны.</li><li>Соседние объёмы одной клетки различаются по концентрации протонов в сотни раз, а по свободному Ca²⁺ — в тысячи раз.</li></ol><p>Лизосому часто описывают как пузырёк с ферментами. Для клетки важнее другое: в просвете лизосомы pH около 4,5–5,0, а в окружающем цитозоле — около 7,2. Кислые гидролазы имеют оптимум активности в кислой среде, и вне лизосомы их активность значительно ниже (Xu 2015). Лизосому как компартмент определяет сочетание границы и условий внутри неё.</p><p>Так же описывают и другие компартменты. В просвете эндоплазматического ретикулума (ЭПР) концентрация свободного Ca²⁺ составляет сотни микромолей при концентрации около 100 нМ в цитозоле покоящейся клетки, а потенциал пары глутатиона менее отрицателен, чем в цитозоле; это благоприятствует образованию дисульфидных связей в секретируемых белках. Матрикс митохондрии слабощелочной, и на внутренней мембране есть потенциал Δψ: матрикс заряжен отрицательно.</p><p>Граница — <a href="#ns-g-S1-T02">биологическая мембрана</a> — эти различия только удерживает. Создают и поддерживают их мембранные белки, прежде всего насосы, за счёт гидролиза ATP или переноса электронов. Если насос остановить, различие постепенно исчезает, хотя мембрана сохраняется: после ингибирования V-АТФазы бафиломицином A1 лизосомы сохраняются и груз в них доставляется, но не расщепляется (Yoshimori 1991).</p><p>На карте выберите параметр. Для каждого компартмента показан порядок величины и то, чем её измеряли. Значения зависят от типа клеток и метода, поэтому их запоминают как порядок величины и направление различия.</p><div class="note trap"><strong>Типичная ошибка</strong> Органеллу определяет её форма: лизосома — это мембранный пузырёк с ферментами.<p class="trap-fix">Форма не определяет функцию. Лизосома расщепляет груз, пока V-АТФаза удерживает в её просвете pH 4,5–5,0; после ингибирования V-АТФазы мембрана и ферменты сохраняются, но белок, доставленный в лизосому, не расщепляется (Yoshimori 1991).</p></div><div class="static-quiz"><h3>V-АТФазу лизосом ингибировали бафиломицином A1; целостность мембраны лизосом не нарушена, гидролазы остались в просвете. Какой признак лизосомы как компартмента при этом теряется?</h3><ol><li><b>А.</b> Кислый pH просвета <i>(верный вариант)</i><br><span class="expl">Кислую среду создаёт V-АТФаза, перенося протоны в просвет; без неё протоны выходят путями утечки, и pH растёт. Граница и набор ферментов сохраняются, но условие, при котором гидролазы активны, исчезает.</span></li><li><b>Б.</b> Целостность мембраны <i>(неверный вариант)</i><br><span class="expl">Бафиломицин A1 ингибирует насос, а не разрушает бислой: в опытах Yoshimori 1991 меченый EGF при бафиломицине A1 доставлялся в лизосомы и оставался в них.</span></li><li><b>В.</b> Набор гидролаз в просвете <i>(неверный вариант)</i><br><span class="expl">Ферменты остаются в лизосоме — меняется не их количество, а их активность: она зависит от pH, который больше не поддерживается насосом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-physiol-021014-071649">Xu H., Ren D. 2015. Lysosomal physiology. Annu Rev Physiol</a></li><li><a href="https://doi.org/10.1038/nrm2820">Casey J. R., Grinstein S., Orlowski J. 2010. Sensors and regulators of intracellular pH. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1152/physrev.00004.2005">Rizzuto R., Pozzan T. 2006. Microdomains of intracellular Ca²⁺: molecular determinants and functional consequences. Physiol Rev</a></li><li><a href="https://doi.org/10.1038/nmeth.1212">Gutscher M. et al. 2008. Real-time imaging of the intracellular glutathione redox potential. Nat Methods</a></li><li><a href="https://doi.org/10.1242/jcs.117218">Birk J. et al. 2013. Endoplasmic reticulum: reduced and oxidized glutathione revisited. J Cell Sci</a></li><li><a href="https://doi.org/10.1074/jbc.M312846200">Hanson G. T. et al. 2004. Investigating mitochondrial redox potential with redox-sensitive green fluorescent protein indicators. J Biol Chem</a></li><li><a href="https://doi.org/10.1016/S0021-9258(19)47429-2">Yoshimori T., Yamamoto A., Moriyama Y., Futai M., Tashiro Y. 1991. Bafilomycin A1, a specific inhibitor of vacuolar-type H⁺-ATPase, inhibits acidification and protein degradation in lysosomes of cultured cells. J Biol Chem</a></li></ul><p>Схема — сводка порядков величин для покоящихся культивируемых клеток млекопитающих. pH — адресованные pH-чувствительные флуоресцентные белки и красители (обзор Casey 2010); Ca²⁺ — свободная концентрация, измеренная адресованными индикаторами (обзор Rizzuto 2006); E(GSH/GSSG) — фактический потенциал пары, измеренный сенсорами на основе roGFP в клетках HeLa: цитозоль — Gutscher 2008 (от −280 до −320 мВ в зависимости от плотности культуры), просвет ЭПР — Birk 2013 (−208 мВ при pH 7,0), матрикс — Hanson 2004 (около −360 мВ при pH матрикса около 8,0). Опыт с бафиломицином A1 — клетки A431, 1 мкМ (Yoshimori 1991, реферат).</p></details></article><article class="card print-unit" id="ns-four-parameters"><div class="eyebrow">Компартменты и локальные условия · шаг 2 из 30</div><h2>Какими величинами описывают условия внутри компартмента</h2><p class="lead">Компартменты сравнивают по pH, свободному Ca²⁺, потенциалу пары глутатиона и характерному фосфоинозитиду; для каждой величины нужно знать, что именно измерено.</p><ol class="mech"><li>pH и свободный Ca²⁺ измеряют адресованными сенсорами; для Ca²⁺ важна <a href="#ns-g-S1-T05">свободная</a>, а не общая концентрация.</li><li><a href="#ns-g-S1-T16">Потенциал пары глутатиона</a> E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]) зависит не только от отношения GSH:GSSG, но и от абсолютной концентрации GSH.</li><li>Характерный <a href="#ns-g-S1-T09">фосфоинозитид</a> — минорный липид цитозольной стороны мембраны, по которому её узнают белки.</li></ol><p>pH цистерн аппарата Гольджи снижается от 6,7 до 6,0, в ранних эндосомах он около 6,5, в лизосомах — 4,5–5,0 (Casey 2010). Свободный Ca²⁺ в цитозоле покоящейся клетки — около 100 нМ, в просвете ЭПР — сотни микромолей (Rizzuto 2006); общий кальций депо во много раз выше, потому что большая часть ионов связана белками просвета.</p><p>Редокс-состояние описывают потенциалом определённой пары, чаще всего глутатиона. Стандартный потенциал E°′ для 2GSH/GSSG — около −240 мВ при pH 7,0 (Schafer 2001), а фактический потенциал E задаёт уравнение Нернста. Поскольку GSH входит в него в квадрате, при неизменном отношении GSH:GSSG снижение концентрации GSH в 10 раз делает потенциал менее отрицательным примерно на 30 мВ.</p><p>Сенсор Grx1-roGFP2 улавливает изменения содержания GSSG на наномолярном уровне на фоне миллимолярного GSH; в цитозоле клеток HeLa потенциал пары составил от −280 до −320 мВ в зависимости от плотности культуры (Gutscher 2008). В цитозоле сенсор почти полностью восстановлен, поэтому около −320 мВ — осторожная оценка: истинный потенциал может быть ещё более отрицательным. При −320 мВ и общей концентрации глутатиона 1–10 мМ отношение GSH:GSSG составляет от 5·10⁴ до 5·10⁵ (Schwarzländer 2016), а не 100:1, как получалось при анализе лизатов. На дрожжах показано, почему лизат вводит в заблуждение: GSSG, не восстановленный в цитозоле, переносится в вакуоль, и его содержание во всей клетке ничего не говорит о цитозольном пуле (Morgan 2013).</p><p>В просвете ЭПР клеток HeLa потенциал пары — около −208 мВ при pH 7,0 (Birk 2013), в матриксе — около −360 мВ (Hanson 2004). В калькуляторе меняйте концентрацию GSH, отношение и pH и сравнивайте расчёт с измеренными значениями.</p><div class="note trap"><strong>Типичная ошибка</strong> В цитозоле отношение GSH:GSSG около 100:1, и одно это отношение описывает редокс-состояние компартмента.<p class="trap-fix">Отношение 100:1 получено в лизатах, где GSSG завышен; сенсор в цитозоле клеток человека показывает от −280 до −320 мВ, что при миллимолярном GSH соответствует отношению от нескольких тысяч до сотен тысяч. Кроме того, потенциал зависит от абсолютной концентрации GSH и от pH, а не только от отношения.</p></div><div class="static-quiz"><h3>В двух образцах pH одинаков и отношение GSH:GSSG одинаково (10⁴), но концентрация GSH во втором в 10 раз ниже. Каким будет фактический потенциал пары глутатиона во втором образце?</h3><ol><li><b>А.</b> Таким же, как в первом <i>(неверный вариант)</i><br><span class="expl">Отношение действительно одинаково, но в уравнение Нернста входит [GSH]²/[GSSG] = [GSH] · (GSH:GSSG). При десятикратно меньшем GSH это выражение уменьшается в 10 раз.</span></li><li><b>Б.</b> Менее отрицательным примерно на 30 мВ <i>(верный вариант)</i><br><span class="expl">[GSH]²/[GSSG] уменьшается в 10 раз, и E сдвигается на (RT/2F)·ln 10 ≈ 30 мВ в положительную сторону. Поэтому потенциал нельзя восстановить по одному отношению GSH:GSSG.</span></li><li><b>В.</b> Более отрицательным примерно на 30 мВ <i>(неверный вариант)</i><br><span class="expl">Направление обратное: чем меньше восстановленного глутатиона, тем слабее восстановительная способность пары, и потенциал становится менее отрицательным.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrm2820">Casey J. R., Grinstein S., Orlowski J. 2010. Sensors and regulators of intracellular pH. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1152/physrev.00004.2005">Rizzuto R., Pozzan T. 2006. Microdomains of intracellular Ca²⁺: molecular determinants and functional consequences. Physiol Rev</a></li><li><a href="https://doi.org/10.1016/s0891-5849(01)00480-4">Schafer F. Q., Buettner G. R. 2001. Redox environment of the cell as viewed through the redox state of the glutathione disulfide/glutathione couple. Free Radic Biol Med</a></li><li><a href="https://doi.org/10.1038/nmeth.1212">Gutscher M. et al. 2008. Real-time imaging of the intracellular glutathione redox potential. Nat Methods</a></li><li><a href="https://doi.org/10.1038/nchembio.1142">Morgan B. et al. 2013. Multiple glutathione disulfide removal pathways mediate cytosolic redox homeostasis. Nat Chem Biol</a></li><li><a href="https://doi.org/10.1242/jcs.117218">Birk J. et al. 2013. Endoplasmic reticulum: reduced and oxidized glutathione revisited. J Cell Sci</a></li><li><a href="https://doi.org/10.1074/jbc.M312846200">Hanson G. T. et al. 2004. Investigating mitochondrial redox potential with redox-sensitive green fluorescent protein indicators. J Biol Chem</a></li><li><a href="https://doi.org/10.1089/ars.2015.6266">Schwarzländer M., Dick T. P., Meyer A. J., Morgan B. 2016. Dissecting redox biology using fluorescent protein sensors. Antioxid Redox Signal</a></li></ul><p>Калькулятор — расчёт по уравнению Нернста E = E°′ − (RT/2F)·ln([GSH]²/[GSSG]) при 37 °C (RT/2F·ln 10 ≈ 30,8 мВ); E°′ = −240 мВ при pH 7,0 (Schafer 2001), смещение E°′ — около −60 мВ на единицу pH (уравнение Нернста: в реакции пары участвуют два электрона и два протона); значения GSH и отношения выбираются как условные. Измеренные значения: цитозоль клеток HeLa, сенсор Grx1-roGFP2, от −280 до −320 мВ в зависимости от плотности культуры — Gutscher 2008 (полный текст); ЭПР клеток HeLa, сенсор, сопряжённый с глутаредоксином, −208 ± 4 мВ при pH 7,0 — Birk 2013 (реферат); матрикс клеток HeLa, roGFP1, около −360 мВ при pH около 8,0 — Hanson 2004 (реферат); осторожная оценка для цитозоля (около −320 мВ) и отношение GSH:GSSG при 1–10 мМ глутатиона, значения для ЭПР (около −210 мВ) и митохондрий (до −380 мВ из-за более щелочного pH) — обзор Schwarzländer 2016 (полный текст); границы диапазонов на шкале калькулятора — учебные. Механизм завышения GSSG в лизатах показан на дрожжах Saccharomyces cerevisiae (Morgan 2013, реферат) и не переносится на клетки человека без оговорки. pH — обзор Casey 2010; Ca²⁺ — обзор Rizzuto 2006.</p></details></article><article class="card print-unit" id="ns-pumps-channels"><div class="eyebrow">Компартменты и локальные условия · шаг 3 из 30</div><h2>Почему для входа Ca²⁺ в матрикс достаточно канала, а для закисления лизосомы нужен насос</h2><p class="lead">Направление самопроизвольного переноса иона задаёт электрохимический потенциал Δμ, а не одна разность концентраций; насос нужен там, где Δμ положительна.</p><ol class="mech"><li><a href="#ns-g-S1-T10">Насос</a> переносит вещество против электрохимического градиента за счёт гидролиза ATP или переноса электронов; <a href="#ns-g-S1-T11">канал</a> пропускает его только по градиенту.</li><li><a href="#ns-g-S1-T03">Δμ</a> = RT·ln(c₂/c₁) + zF·Δψ: для Ca²⁺ (z = 2) при Δψ = −150 мВ электрическая часть (−29 кДж/моль) перевешивает химическую (+6 кДж/моль).</li><li>Поэтому Ca²⁺ входит в матрикс через канал <a href="#ns-g-S1-T20">MCU</a>, а работу совершила дыхательная цепь, создавшая Δψ.</li></ol><p>Различия между компартментами создают белки трёх классов. Насосы — V-АТФаза, <a href="#ns-g-S1-T19">SERCA</a>, комплексы дыхательной цепи — переносят ионы против электрохимического градиента, используя энергию гидролиза ATP или переноса электронов. <a href="#ns-g-S1-T12">Сопряжённые переносчики</a> используют градиент другого вещества. Каналы пропускают ионы только по градиенту и потому не создают различие, а расходуют его — для передачи сигнала или для возврата к исходному состоянию.</p><p>Знак Δμ показывает, нужна ли работа. Для выхода Ca²⁺ из просвета ЭПР (около 370 мкМ свободного Ca²⁺) в цитозоль (0,1 мкМ) химическая часть равна RT·ln(0,1/370) ≈ −21 кДж/моль: достаточно открыть канал, рецептор IP₃. Обратный перенос требует +21 кДж/моль, и его выполняет SERCA за счёт гидролиза ATP.</p><p>С переносом Ca²⁺ в матрикс митохондрии дело обстоит иначе. Пусть в цитозоле 0,1 мкМ свободного Ca²⁺, а в матриксе — 1 мкМ (так бывает после предшествующего захвата Ca²⁺; в покое концентрация в матриксе близка к цитозольной, около 0,1 мкМ). Тогда химическая часть переноса из цитозоля в матрикс положительна: RT·ln 10 ≈ +5,9 кДж/моль. Но матрикс заряжен отрицательно, и при Δψ = −150 мВ электрическая часть 2F·Δψ ≈ −28,9 кДж/моль. Сумма −23 кДж/моль: Ca²⁺ входит против концентрационного, но по электрохимическому градиенту. MCU — высокоселективный Ca²⁺-канал внутренней мембраны, а не переносчик (Kirichok 2004). Если протонофор снизит Δψ до −10 мВ, Δμ станет положительной, и при 1 мкМ Ca²⁺ в матриксе вход через MCU прекратится.</p><p>Для протонов, закачиваемых в лизосому, уже химическая часть положительна: при pH 7,2 в цитозоле и 4,7 в просвете она равна RT·ln 10^2,5 ≈ +14,8 кДж/моль, поэтому нужен насос — V-АТФаза. Перенос заряда насосом делает просвет положительным, и без встречного переноса противоионов этот потенциал остановил бы закисление (Steinberg 2010).</p><div class="note trap"><strong>Типичная ошибка</strong> Ион самопроизвольно движется только в сторону меньшей концентрации, поэтому накопление Ca²⁺ в матриксе требует насоса.<p class="trap-fix">Для иона учитывают и электрическую часть Δμ. При Δψ около −150 мВ она для Ca²⁺ почти в пять раз больше химической, и Ca²⁺ входит в матрикс через канал MCU; работу совершает дыхательная цепь, создавшая Δψ.</p></div><div class="static-quiz"><h3>Свободный Ca²⁺ в цитозоле — 0,1 мкМ, в матриксе — 1 мкМ, Δψ = −150 мВ. Какой белок внутренней мембраны достаточен для входа Ca²⁺ в матрикс?</h3><ol><li><b>А.</b> Насос: перенос идёт против разности концентраций <i>(неверный вариант)</i><br><span class="expl">Против разности концентраций — да, но для иона решает электрохимический потенциал. При Δψ = −150 мВ электрическая часть делает Δμ отрицательной, и насос не нужен.</span></li><li><b>Б.</b> Никакой: бислой проницаем для Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">Липидный бислой почти непроницаем для ионов. Без канала Ca²⁺ не войдёт в матрикс даже при отрицательной Δμ: движущая сила есть, а пути нет.</span></li><li><b>В.</b> Канал: Δμ для входа отрицательна <i>(верный вариант)</i><br><span class="expl">Электрическая часть (≈ −29 кДж/моль) перевешивает химическую (≈ +6 кДж/моль), Δμ ≈ −23 кДж/моль. Перенос самопроизволен, и канала MCU достаточно; работу совершила дыхательная цепь, создав Δψ.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature02246">Kirichok Y., Krapivinsky G., Clapham D. E. 2004. The mitochondrial calcium uniporter is a highly selective ion channel. Nature</a></li><li><a href="https://doi.org/10.1083/jcb.200911083">Steinberg B. E. et al. 2010. A cation counterflux supports lysosomal acidification. J Cell Biol</a></li><li><a href="https://doi.org/10.3389/fphys.2023.1127545">Pick T., Gamayun I., Tinschert R., Cavalié A. 2023. Kinetics of the thapsigargin-induced Ca²⁺ mobilisation: a quantitative analysis in the HEK-293 cell line. Front Physiol</a></li></ul><p>Схема — расчёт Δμ = RT·ln(c₂/c₁) + zF·(ψ₂ − ψ₁) при 37 °C (RT = 2,58 кДж/моль, F = 96,5 кДж/(моль·В)). Концентрации — учебные значения порядка величин для покоящихся клеток млекопитающих: цитозоль 0,1 мкМ свободного Ca²⁺, матрикс 1 мкМ (после предшествующего захвата Ca²⁺; в покое — около 0,1 мкМ, как в модели вопроса 4), просвет ЭПР 370 мкМ (Pick 2023: клетки HEK293, сенсор D1ER). Для случая «Ca²⁺ в матрикс» расчёт совпадает с моделью практикума M1. Для мембраны ЭПР электрическая часть принята равной нулю (допущение модели); для лизосомы учтена только химическая часть — она уже положительна. MCU как канал — патч-кламп внутренней мембраны митохондрий клеток COS-7 (Kirichok 2004, реферат). Роль противоионов при закислении — Steinberg 2010 (полный текст, макрофаги мыши).</p></details></article><article class="card print-unit" id="ns-nonequilibrium"><div class="eyebrow">Компартменты и локальные условия · шаг 4 из 30</div><h2>Почему различия между компартментами исчезают после остановки насосов</h2><p class="lead">Различия pH, Ca²⁺ и Δψ сохраняются, пока насос уравновешивает утечку. После остановки насоса различие убывает с собственным характерным временем; для этого разрушать мембрану не нужно.</p><ol class="mech"><li>В <a href="#ns-g-S1-T07">стационарном неравновесном состоянии</a> перенос насосом равен утечке через мембрану: различие постоянно, но не равновесно.</li><li>После остановки насоса утечка продолжается, и различие убывает; скорость убыли задают проводимость путей утечки и буферная ёмкость компартмента.</li><li>Времена различаются на порядки: Δψ — секунды и десятки секунд, свободный Ca²⁺ ЭПР — минуты, pH лизосомы — десятки минут.</li></ol><p>Лизосомы макрофагов мыши линии RAW264.7 удерживают pH 4,71. После ингибирования V-АТФазы конканамицином A pH альвеолярных макрофагов мыши в первые минуты рос примерно на 0,20 единицы в минуту, а за час превышал 6,5 — верхний предел чувствительности сенсора (Steinberg 2010). В клетках A431 после 1 мкМ <a href="#ns-g-S1-T22">бафиломицина A1</a> pH лизосом поднимался с 5,1–5,5 примерно до 6,3 постепенно, примерно за 50 мин (Yoshimori 1991). Медленность объясняется высокой буферной ёмкостью просвета — 60–80 мМ на единицу pH (Steinberg 2010).</p><p>В клетках HEK293 в среде без Ca²⁺ свободный Ca²⁺ просвета ЭПР (около 370 мкМ по сенсору D1ER) после 1 мкМ <a href="#ns-g-S1-T23">тапсигаргина</a> за первые 1,5 мин снижался лишь на 6 %, а затем убывал экспоненциально с характерным временем около 162 с (Pick 2023): Ca²⁺ выходил путями утечки; в покое эту утечку уравновешивала SERCA.</p><p>Δψ митохондрии после остановки дыхательной цепи и ATP-синтазы падает быстрее — за секунды и десятки секунд (учебная оценка). Прямых измерений этой кинетики в прочитанных работах нет, поэтому в модели время Δψ — учебное значение.</p><p>Чтобы различие исчезло, разрушать мембрану не нужно: его рассеивает утечка. Но и по самому исчезновению различия целостность мембраны не установить — её проверяют отдельным контролем, например по удержанию меченого декстрана или груза в просвете (в модели целостность мембраны сохранена по условию). Выберите компартмент и время после остановки насоса. Различия измерены в собственных единицах — единицах pH, мкМ и мВ, поэтому сравнивают не проценты в один момент, а время, за которое каждое различие уменьшается вдвое.</p><div class="note trap"><strong>Типичная ошибка</strong> Если различие pH или Ca²⁺ между органеллой и цитозолем исчезло, значит, мембрана органеллы повреждена.<p class="trap-fix">Остановка насоса не равна разрушению мембраны: при бафиломицине A1 лизосомы сохраняются и груз в них доставляется, но их просвет теряет кислотность (Yoshimori 1991). Различие рассеивает утечка, которую в покое компенсирует насос.</p></div><div class="static-quiz"><h3>В клетках HEK293 после добавления тапсигаргина свободный Ca²⁺ в просвете ЭПР за 10 мин снизился с 370 мкМ в десятки раз; маркер просвета ЭПР в цитозоль не выходит. Какой вывод следует из этого опыта?</h3><ol><li><b>А.</b> Тапсигаргин разрушил мембрану ЭПР <i>(неверный вариант)</i><br><span class="expl">Тапсигаргин — ингибитор насоса SERCA. Такое снижение Ca²⁺ не требует разрыва мембраны: его объясняет утечка, которую больше не компенсирует насос. По одному снижению Ca²⁺ целостность мембраны не установить; для неё в условии дан отдельный контроль: маркер просвета ЭПР в цитозоль не выходит, значит, грубого разрыва мембраны нет. Удержание маркера, впрочем, не исключает проницаемости мембраны для малых ионов.</span></li><li><b>Б.</b> Различие поддерживала работа SERCA <i>(верный вариант)</i><br><span class="expl">Тапсигаргин ингибирует SERCA, а пути утечки продолжают выпускать Ca²⁺. Различие исчезает потому, что его больше ничто не восстанавливает: оно было стационарным, а не равновесным.</span></li><li><b>В.</b> Тапсигаргин открыл каналы IP₃R <i>(неверный вариант)</i><br><span class="expl">Тапсигаргин не открывает каналы ЭПР. Ca²⁺ выходит через пути утечки, которые работают и в покое, — тогда их уравновешивает SERCA.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200911083">Steinberg B. E. et al. 2010. A cation counterflux supports lysosomal acidification. J Cell Biol</a></li><li><a href="https://doi.org/10.1016/S0021-9258(19)47429-2">Yoshimori T., Yamamoto A., Moriyama Y., Futai M., Tashiro Y. 1991. Bafilomycin A1, a specific inhibitor of vacuolar-type H⁺-ATPase, inhibits acidification and protein degradation in lysosomes of cultured cells. J Biol Chem</a></li><li><a href="https://doi.org/10.3389/fphys.2023.1127545">Pick T., Gamayun I., Tinschert R., Cavalié A. 2023. Kinetics of the thapsigargin-induced Ca²⁺ mobilisation: a quantitative analysis in the HEK-293 cell line. Front Physiol</a></li></ul><p>Схема — учебная модель практикума M1 (вопрос 1, базовый уровень): x(t) = x_off + (x₀ − x_off)·e^(−t/τ) (для ЭПР — после начальной фазы). Лизосома: pH 4,7 → 6,5, τ = 10 мин (начальная скорость 0,18 ед./мин; Steinberg 2010: альвеолярные макрофаги мыши, 1 мкМ конканамицина A, 0,20 ед./мин; Yoshimori 1991: клетки A431, 1 мкМ бафиломицина A1, около 6,3 к 50 мин, реферат). Плато 6,5 выбрано для учебного расчёта и из измерений не следует: выше 6,5 сенсор Steinberg 2010 значений не различает, поэтому конечный pH в этих опытах не определён. От выбранного плато зависит время уменьшения различия вдвое: при выравнивании с цитозолем (pH около 7,2) и той же начальной скорости оно составило бы около 10 мин вместо 12 — по-прежнему больше, чем у Ca²⁺ ЭПР. Просвет ЭПР: 370 мкМ → 0,1 мкМ двухфазно — за первые 90 с потеря около 6 % (в модели линейно), затем экспонента с τ = 162 с (Pick 2023: HEK293, сенсор D1ER, 1 мкМ тапсигаргина, среда без Ca²⁺; τ описывает фазу после точки перегиба; полный текст PMC). Матрикс: Δψ −150 → −5 мВ, τ = 20 с — учебное значение. «Мембрана не повреждена» — условие модели во всех состояниях; в опыте целостность проверяют отдельно. Время, за которое различие уменьшается вдвое, считается в собственных единицах каждого различия (ед. pH, мкМ, мВ): Δψ — 15 с, Ca²⁺ ЭПР — 3,2 мин, pH лизосомы — 12 мин.</p></details></article><article class="card print-unit" id="ns-mito-potential"><div class="eyebrow">Компартменты и локальные условия · шаг 5 из 30</div><h2>Что поддерживает мембранный потенциал митохондрии и что от него зависит</h2><p class="lead">Δψ — состояние мембраны, а не поток: его величину задаёт баланс генераторов и путей возврата протонов, а от неё зависят синтез ATP, импорт белков через TIM23 и вход Ca²⁺.</p><ol class="mech"><li>Дыхательная цепь выводит протоны из матрикса; <a href="#ns-g-S1-T21">ATP-синтаза</a> в прямом направлении возвращает их, синтезируя ATP.</li><li>При остановке дыхания ATP-синтаза может работать в обратном направлении: гидролизовать гликолитический ATP и поддерживать Δψ.</li><li><a href="#ns-g-S1-T13">TIM23</a> переносит положительно заряженную MTS только при достаточном Δψ; от Δψ зависит и вход Ca²⁺ через MCU.</li></ol><p>Перенос протонов дыхательной цепью создаёт <a href="#ns-g-S1-T14">протон-движущую силу</a> из двух частей — <a href="#ns-g-S1-T04">Δψ</a> и разности pH. В покоящихся нейронах коры крысы Δψ, измеренный калиброванной флуоресцентной методикой с зондом <a href="#ns-g-S1-T26">TMRM</a>, равен −139 мВ (Gerencser 2012). TMRM показывает величину Δψ, но не скорость переноса электронов (Brand и Nicholls 2011).</p><p>С помощью ингибиторов определяют, какой генератор поддерживает Δψ. <a href="#ns-g-S1-T24">Олигомицин</a> закрывает возврат протонов через ATP-синтазу: Δψ становится немного отрицательнее, а потребление O₂ снижается до уровня, который задаёт утечка протонов. Протонофор <a href="#ns-g-S1-T25">FCCP</a> в заранее подобранной оптимальной концентрации снимает Δψ, и, если субстратов и O₂ достаточно, а у клеток есть дыхательный резерв (исходная скорость дыхания ниже максимальной), дыхание растёт до максимальной скорости, возможной в этих условиях (избыточная концентрация FCCP или ограничение окисления субстратов уменьшают этот ответ); ATP-синтаза при этом гидролизует гликолитический ATP, но Δψ не восстанавливается. Антимицин A снижает потребление O₂ до немитохондриального — у большинства клеток около 10 % исходного (Brand и Nicholls 2011). Потребление O₂ измеряют в закрытой ячейке с клетками кислородным электродом или флуоресцентным датчиком O₂ (например, в анализаторе Seahorse XF) и по ходу опыта последовательно добавляют олигомицин, FCCP, затем ротенон с антимицином A; схема — в режиме «Как измеряют потребление O₂».</p><p>После антимицина A при глюкозе в среде Δψ может сохраняться: его поддерживает ATP-синтаза, гидролизуя гликолитический ATP. Если олигомицин после этого вызывает <a href="#ns-g-S1-T15">деполяризацию</a>, потенциал создавала обратная работа ATP-синтазы; если лёгкую гиперполяризацию — митохондрии ещё синтезировали ATP (проба с олигомицином, Brand и Nicholls 2011).</p><p>От Δψ зависит импорт белков: в изолированных митохондриях Neurospora crassa перенос N-концевых адресующих последовательностей (MTS) требовал именно Δψ, а не всей протон-движущей силы (Martin 1991). От него же зависит электрическая часть Δμ для входа Ca²⁺ через MCU.</p><div class="note trap"><strong>Типичная ошибка</strong> Если Δψ нормален, дыхательная цепь работает нормально.<p class="trap-fix">Δψ — состояние, а не поток. При остановленном дыхании его может поддерживать ATP-синтаза, гидролизующая гликолитический ATP. О работе дыхательной цепи судят по потреблению O₂ или по ответу Δψ на олигомицин (Brand и Nicholls 2011).</p></div><div class="static-quiz"><h3>Клетки в среде с глюкозой обработали олигомицином; дыхательная цепь не ингибирована. Как изменится Δψ по сравнению с контролем?</h3><ol><li><b>А.</b> Станет немного отрицательнее <i>(верный вариант)</i><br><span class="expl">Олигомицин закрывает главный путь возврата протонов в матрикс — через ATP-синтазу. Остаётся только утечка, и Δψ немного растёт по абсолютной величине; потребление O₂ при этом падает.</span></li><li><b>Б.</b> Упадёт почти до нуля <i>(неверный вариант)</i><br><span class="expl">Так Δψ ведёт себя после олигомицина, только если его поддерживала ATP-синтаза за счёт гидролиза ATP, — например, после антимицина A. Здесь дыхательная цепь работает и продолжает выводить протоны.</span></li><li><b>В.</b> Не изменится <i>(неверный вариант)</i><br><span class="expl">Δψ задаётся балансом вывода и возврата протонов. Олигомицин закрывает один из путей возврата, поэтому баланс смещается, и потенциал становится немного отрицательнее.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1042/BJ20110162">Brand M. D., Nicholls D. G. 2011. Assessing mitochondrial dysfunction in cells. Biochem J</a></li><li><a href="https://doi.org/10.1113/jphysiol.2012.228387">Gerencser A. A. et al. 2012. Quantitative measurement of mitochondrial membrane potential in cultured cells: calcium-induced de- and hyperpolarization of neuronal mitochondria. J Physiol</a></li><li><a href="https://doi.org/10.1016/S0021-9258(18)55235-2">Martin J., Mahlke K., Pfanner N. 1991. Role of an energized inner membrane in mitochondrial protein import. Δψ drives the movement of presequences. J Biol Chem</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-060815-014352">Wiedemann N., Pfanner N. 2017. Mitochondrial machineries for protein import and assembly. Annu Rev Biochem</a></li></ul><p>Схема — учебная модель практикума M1 (вопрос 1, продвинутый уровень): стационары пяти условий для клеток в среде с глюкозой; Δψ контроля −150 мВ, потребление O₂ и импорт — % от контроля, импорт — учебная крутая зависимость от Δψ, Δμ — расчёт для 0,1 мкМ Ca²⁺ в цитозоле и 1 мкМ в матриксе (после предшествующего захвата Ca²⁺). Качественные соотношения — по обзору Brand и Nicholls 2011 (полный текст PMC): лёгкая гиперполяризация и снижение дыхания после олигомицина, рост дыхания после протонофора в оптимальной концентрации у клеток с дыхательным резервом (в модели максимальная скорость — 220 % от контроля), немитохондриальное потребление O₂ около 10 %, проба с олигомицином, гидролиз ATP ATP-синтазой при протонофоре; TMRM уравновешивается между средой и клеткой около 60 мин, между цитозолем и матриксом — намного быстрее. Схема измерения потребления O₂ — по тому же обзору: закрытая ячейка (кислородный электрод или анализатор Seahorse XF), последовательные добавки олигомицина, FCCP, ротенона с антимицином A; уровни на схеме — из учебной модели практикума (контроль, олигомицин, FCCP, антимицин A). −139 мВ — нейроны коры крысы в культуре (Gerencser 2012, реферат). Импорт и Δψ — изолированные митохондрии Neurospora crassa (Martin 1991, реферат); транслоказы — обзор Wiedemann и Pfanner 2017 (реферат).</p></details></article><article class="card print-unit" id="ns-isolation-exchange"><div class="eyebrow">Компартменты и локальные условия · шаг 6 из 30</div><h2>Как одна граница одновременно изолирует реакции и обеспечивает обмен</h2><p class="lead">Граница компартмента разделяет несовместимые реакции, а избирательные переносчики, челноки и транслоказы ведут обмен через неё, не разрушая неравновесия.</p><ol class="mech"><li><a href="#ns-g-S1-T17">Кислые гидролазы</a> активны в кислом просвете лизосомы; при нарушении целостности её мембраны катепсины попадают в цитозоль и могут запустить гибель клетки.</li><li>NADH не проходит через внутреннюю мембрану митохондрии: восстановительные эквиваленты переносят <a href="#ns-g-S1-T29">челночные системы</a>.</li><li>Белки матрикса поступают из цитозоля через транслоказы TOM и TIM23; каждый переносчик пропускает определённые вещества, и различия сохраняются.</li></ol><h3>Изоляция</h3><p>В лизосоме работают более 60 гидролаз (Xu 2015). Если мембрана лизосомы становится проницаемой, её содержимое выходит в цитозоль, и катепсины расщепляют цитозольные белки; в зависимости от масштаба утечки клетка погибает по типу некроза или апоптоза (Aits и Jäättelä 2013). Так же изолированы реакции пероксисомы: пероксид водорода, который образуется при β-окислении очень длинноцепочечных жирных кислот, разлагает каталаза той же органеллы (Schrader 2015).</p><h3>Обмен</h3><p>Обмен идёт через избирательные белки. Малат-аспартатный челнок переносит восстановительные эквиваленты цитозольного NADH на NAD⁺ матрикса: оксалоацетат восстанавливается до малата, малат входит в матрикс через переносчик и там вновь окисляется с образованием NADH. Глицерофосфатный челнок передаёт электроны иначе — через митохондриальную глицерол-3-фосфатдегидрогеназу на внешней стороне внутренней мембраны прямо в пул убихинона, минуя комплекс I (Mráček 2013). Белки матрикса синтезируются в цитозоле и переносятся транслоказами TOM и TIM23, причём перенос через TIM23 требует Δψ (Wiedemann и Pfanner 2017).</p><h3>Значение</h3><p>Болезни лизосомного накопления — более 70 наследственных болезней, большинство из них наследуются аутосомно-рецессивно. Их вызывают мутации генов лизосомных ферментов и мембранных белков; при дефекте этих белков нерасщеплённые вещества накапливаются в лизосомах (Platt 2018). Чаще причиной служат мутации генов гидролаз, но нарушения выноса продуктов и мембранного транспорта тоже приводят к накоплению (Xu 2015). Например, при болезни Помпе (гликогенозе II типа) из-за мутаций гена GAA недостаточна активность кислой α-глюкозидазы, и в лизосомах накапливается гликоген.</p><div class="note trap"><strong>Типичная ошибка</strong> Компартмент тем лучше выполняет свою функцию, чем меньше веществ проходит через его мембрану.<p class="trap-fix">Изоляцию и обмен обеспечивают одни и те же избирательные белки: через внутреннюю мембрану митохондрии непрерывно идут метаболиты, ATP и ADP, белки с MTS, но каждый переносчик пропускает определённые вещества в определённом направлении, и неравновесие сохраняется.</p></div><div class="static-quiz"><h3>Электроны цитозольного NADH передаются в дыхательную цепь глицерофосфатным челноком. Куда они поступают в митохондрии?</h3><ol><li><b>А.</b> На NAD⁺ матрикса с образованием NADH <i>(неверный вариант)</i><br><span class="expl">Так работает малат-аспартатный челнок: малат входит в матрикс и окисляется там с образованием NADH. Глицерофосфатный челнок матриксный NAD⁺ не использует.</span></li><li><b>Б.</b> В пул убихинона, минуя комплекс I <i>(верный вариант)</i><br><span class="expl">Митохондриальная глицерол-3-фосфатдегидрогеназа на внешней стороне внутренней мембраны окисляет глицерол-3-фосфат и передаёт электроны через FAD прямо на убихинон (Mráček 2013).</span></li><li><b>В.</b> Прямо на комплекс IV и кислород <i>(неверный вариант)</i><br><span class="expl">Комплекс IV принимает электроны от цитохрома c, а не от дегидрогеназ челноков. Электроны глицерофосфатного челнока входят в цепь раньше — на уровне убихинона.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-physiol-021014-071649">Xu H., Ren D. 2015. Lysosomal physiology. Annu Rev Physiol</a></li><li><a href="https://doi.org/10.1242/jcs.091181">Aits S., Jäättelä M. 2013. Lysosomal cell death at a glance. J Cell Sci</a></li><li><a href="https://doi.org/10.1007/s10545-015-9819-7">Schrader M., Costello J. L., Godinho L. F., Islinger M. 2015. Peroxisome–mitochondria interplay and disease. J Inherit Metab Dis</a></li><li><a href="https://doi.org/10.1016/j.bbabio.2012.11.014">Mráček T., Drahota Z., Houštěk J. 2013. The function and the role of the mitochondrial glycerol-3-phosphate dehydrogenase in mammalian tissues. Biochim Biophys Acta</a></li><li><a href="https://doi.org/10.1002/iub.2367">Borst P. 2020. The malate-aspartate shuttle (Borst cycle): How it started and developed into a major metabolic pathway. IUBMB Life</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-060815-014352">Wiedemann N., Pfanner N. 2017. Mitochondrial machineries for protein import and assembly. Annu Rev Biochem</a></li><li><a href="https://doi.org/10.1038/s41572-018-0025-4">Platt F. M., d&#x27;Azzo A., Davidson B. L., Neufeld E. F., Tifft C. J. 2018. Lysosomal storage diseases. Nat Rev Dis Primers</a></li></ul><p>Схема механизма; числа не показываются. Гидролазы лизосомы и болезни накопления — обзор Xu 2015 (полный текст PMC); проницаемость мембраны лизосомы и лизосомная гибель клетки — обзор Aits и Jäättelä 2013 (реферат); пероксисома — обзор Schrader 2015 (не прочитан); глицерофосфатный челнок — обзор Mráček 2013 (реферат); малат-аспартатный челнок — обзор Borst 2020 (реферат); импорт белков — Wiedemann и Pfanner 2017 (реферат); болезни лизосомного накопления — обзор Platt 2018 (реферат: более 70 болезней, чаще аутосомно-рецессивное наследование, суммарно около 1 случая на 5000 живорождённых). Пример болезни Помпе — по обзору Platt 2018 (рубрика «Glycogen Storage Disease Type II») и классическому описанию дефицита кислой α-глюкозидазы.</p></details></article><article class="card print-unit" id="ns-measure-ph"><div class="eyebrow">Компартменты и локальные условия · шаг 7 из 30</div><h2>Как измеряют pH и редокс-потенциал внутри органеллы</h2><p class="lead">Обычный pH-микроэлектрод слишком велик для малых органелл, поэтому в них доставляют флуоресцентный сенсор. В рассматриваемой методике pH определяют по отношению сигналов при двух длинах волн после калибровки в той же клетке.</p><ol class="mech"><li>Сенсор доставляют в компартмент: декстран с pH-чувствительным красителем — эндоцитозом в лизосомы, <a href="#ns-g-S1-T08">генетически кодируемый сенсор</a> — по адресующей последовательности.</li><li><a href="#ns-g-S1-T27">Ратиометрия</a>: отношение сигналов при двух длинах волн возбуждения практически не зависит от количества сенсора.</li><li><a href="#ns-g-S1-T28">Калибровка</a>: ионофоры уравнивают pH органеллы и буфера известного pH; по кривой «отношение — pH» сигнал переводят в pH.</li></ol><p>Чтобы измерить pH лизосом макрофагов мыши, их загружали pH-чувствительным декстраном методом «пульс — погоня»: декстран поглощается эндоцитозом и накапливается в лизосомах. Флуоресценцию возбуждали при 490 и 440 нм и брали отношение сигналов (Steinberg 2010). Для матрикса митохондрий клеток HeLa использовали белковый сенсор SypHer с адресующей последовательностью и отношение сигналов при возбуждении 480 и 430 нм (Poburko 2011).</p><p>Яркость при одной длине волны зависит от количества сенсора, толщины клетки и выцветания, поэтому сама по себе не даёт pH. Отношение двух сигналов одного сенсора от количества сенсора практически не зависит, но остаётся условной величиной, пока его не откалибровали.</p><p>В конце опыта клетки переводили в растворы с высоким K⁺ и известным pH (4,0–6,5) с нигерицином; ионофор выравнивает pH органеллы с pH раствора, и по нескольким точкам строят кривую «отношение — pH» (Steinberg 2010). У сенсора есть рабочий диапазон: выше pH 6,5 краситель лизосом уже не различал значений. После калибровки сенсора SypHer в каждой клетке pH матрикса клеток HeLa составил 7,61 — ниже прежних оценок 7,8–8,1 (Poburko 2011).</p><p>Потенциал пары глутатиона измеряют сенсором Grx1-roGFP2: глутаредоксин быстро уравновешивает сенсор именно с парой GSH/GSSG (Gutscher 2008). Калибруют по крайним точкам — полностью восстановленному и полностью окисленному сенсору — и пересчитывают степень окисления в милливольты. Сенсор сам реагирует с глутатионом и потому входит в измеряемую систему.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем ярче флуоресценция pH-сенсора в органелле, тем выше (или ниже) в ней pH.<p class="trap-fix">Яркость одного канала зависит от количества сенсора, толщины клетки и выцветания. В рассматриваемой методике pH определяют по отношению двух сигналов после калибровки в той же клетке: отношение уменьшает зависимость от количества сенсора, а поправки на фон и выцветание проверяют отдельно. Есть и другие проверенные способы, например по времени жизни флуоресценции; без калибровки сигнал остаётся относительным.</p></div><div class="static-quiz"><h3>pH-сенсор в лизосомах регистрировали по яркости при одной длине волны возбуждения. В клетках, где сенсора вдвое больше, яркость оказалась вдвое выше. Что можно заключить о pH в лизосомах этих клеток?</h3><ol><li><b>А.</b> pH в лизосомах этих клеток выше <i>(неверный вариант)</i><br><span class="expl">Удвоение яркости объясняется удвоением количества сенсора. Чтобы судить о pH, нужна величина, не зависящая от количества сенсора, — отношение сигналов при двух длинах волн.</span></li><li><b>Б.</b> pH в лизосомах этих клеток ниже <i>(неверный вариант)</i><br><span class="expl">Связь яркости с pH здесь не установлена: сигнал вырос пропорционально количеству сенсора. По одному каналу без калибровки направление сдвига pH определить нельзя.</span></li><li><b>В.</b> О pH из этих данных судить нельзя <i>(верный вариант)</i><br><span class="expl">Яркость одного канала пропорциональна количеству сенсора, и двукратная разница полностью объясняется им. Сравнить pH позволяют ратиометрия и калибровка с ионофорами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-1.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1083/jcb.200911083">Steinberg B. E. et al. 2010. A cation counterflux supports lysosomal acidification. J Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M110.159962">Poburko D., Santo-Domingo J., Demaurex N. 2011. Dynamic regulation of the mitochondrial proton gradient during cytosolic calcium elevations. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/nmeth.1212">Gutscher M. et al. 2008. Real-time imaging of the intracellular glutathione redox potential. Nat Methods</a></li></ul><p>Схемы методов; значения на кривой калибровки условные, кроме названных. Лизосомы: макрофаги мыши RAW264.7 и альвеолярные макрофаги, декстраны, возбуждение 490/440 нм, калибровка в растворах 145 мМ KCl с нигерицином 10 мкг/мл при pH 4,0–6,5, аппроксимация сигмоидой; верхний предел чувствительности — pH 6,5 (Steinberg 2010, полный текст PMC). Матрикс: клетки HeLa, mitoSypHer, возбуждение 480/430 нм, калибровка каждой клетки нигерицином и монензином; pH матрикса в покое 7,61 ± 0,02 (79 клеток; Poburko 2011, полный текст). Grx1-roGFP2 — Gutscher 2008 (реферат); калибровка по крайним точкам (полное окисление и полное восстановление сенсора) — схема метода.</p></details></article><article class="card print-unit" id="ns-local-conc"><div class="eyebrow">Локальная концентрация · шаг 8 из 30</div><h2>Почему концентрация без указания объёма и формы не определена</h2><p class="lead">Одно и то же число молекул даёт разную концентрацию в зависимости от объёма, к которому его относят, и от того, какая часть молекул свободна.</p><ol class="mech"><li>Концентрация c = N/(N_A·V): при неизменном числе частиц N она обратно пропорциональна объёму V.</li><li>Анализ лизата даёт <a href="#ns-g-S1-T30">среднюю по клетке концентрацию</a>, а эффектор отвечает на <a href="#ns-g-S1-T06">локальную</a> — в том объёме, где он находится.</li><li>Для Ca²⁺ <a href="#ns-g-S1-T05">общая концентрация</a> намного выше свободной: большую часть вошедших ионов связывают <a href="#ns-g-S1-T31">буферы</a>.</li></ol><p>Пусть через канал за короткое время вошло 10⁴ ионов Ca²⁺. Если бы они равномерно распределились по клетке объёмом 1 пл (10⁻¹² л), общая концентрация кальция выросла бы на c = N/(N_A·V) = 10⁴/(6,02·10²³ моль⁻¹ · 10⁻¹² л) ≈ 1,7·10⁻⁸ М, то есть примерно на 17 нМ. Это меньше фонового уровня свободного Ca²⁺ в цитозоле покоящейся клетки (около 100 нМ) и находится на пределе обнаружения.</p><p>Те же 10⁴ ионов в объёме 10⁻¹⁶ л — кубе со стороной около 0,5 мкм у устья канала — дают прибавку около 170 мкМ, в 10 000 раз больше. Это прибавка общего кальция; свободного Ca²⁺ будет заметно меньше, потому что большую часть вошедших ионов связывают цитозольные буферы (Rizzuto 2006). Но и с этой поправкой у канала создаётся концентрация, на порядки превышающая фоновую.</p><p>Поэтому утверждение «концентрация вещества выросла» неполно, пока не названы три вещи: где именно (объём), о какой форме идёт речь (свободная или общая) и с каким порогом чувствительности эффектора её сравнивают. Средняя концентрация в лизате полезна как мера общего содержания, но не говорит, достигнут ли порог там, где находится эффектор.</p><p>В калькуляторе выберите число ионов, объём и долю ионов, связанных буферами: схема сравнивает общую и свободную прибавку концентрации с фоновым уровнем свободного Ca²⁺.</p><div class="note trap"><strong>Типичная ошибка</strong> Если анализ лизата не показал роста концентрации вещества, сигнала не было.<p class="trap-fix">Средняя по клетке концентрация почти не меняется, когда вещество накапливается в малом объёме: 10⁴ ионов дают 17 нМ в объёме клетки и 170 мкМ в микродомене. Неизменный результат анализа лизата совместим и с отсутствием сигнала, и с локальным событием, и с перераспределением вещества, которое произошло быстрее, чем длилось измерение.</p></div><div class="static-quiz"><h3>Через канал вошло 10⁴ ионов Ca²⁺, и все они остались в объёме 10⁻¹⁶ л у его устья. Какой будет прибавка общей концентрации кальция в этом объёме?</h3><ol><li><b>А.</b> Около 17 нМ <i>(неверный вариант)</i><br><span class="expl">17 нМ — прибавка, если те же ионы распределить по всей клетке объёмом 10⁻¹² л. Объём микродомена в 10 000 раз меньше, и концентрация во столько же раз выше.</span></li><li><b>Б.</b> Около 170 мкМ <i>(верный вариант)</i><br><span class="expl">c = 10⁴/(6,02·10²³ моль⁻¹ · 10⁻¹⁶ л) ≈ 1,7·10⁻⁴ М. Это общий кальций: свободного будет меньше, потому что большую часть ионов связывают буферы.</span></li><li><b>В.</b> Около 1,7 мкМ <i>(неверный вариант)</i><br><span class="expl">Ошибка на два порядка: при делении 10⁴ на 6,02·10²³ и на 10⁻¹⁶ получается 1,7·10⁻⁴ М, то есть 170 мкМ.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00004.2005">Rizzuto R., Pozzan T. 2006. Microdomains of intracellular Ca²⁺: molecular determinants and functional consequences. Physiol Rev</a></li></ul><p>Схема — расчёт по формуле c = N/(N_A·V) для заданных числа ионов и объёма; объёмы — порядки величины (клетка около 1 пл, микродомен у устья канала около 10⁻¹⁶ л), это учебные оценки. Доля ионов, связанных буферами, выбирается как условный параметр; то, что буферы связывают большую часть вошедшего Ca²⁺, — по обзору Rizzuto 2006. Фон свободного Ca²⁺ в цитозоле покоящейся клетки — около 100 нМ (там же).</p></details></article><article class="card print-unit" id="ns-crowding"><div class="eyebrow">Локальная концентрация · шаг 9 из 30</div><h2>Как краудинг меняет равновесие, диффузию и скорость реакций</h2><p class="lead">Цитоплазма заполнена макромолекулами. Исключённый объём при прочих равных может благоприятствовать сборке комплексов, но в живой клетке действуют и неспецифические взаимодействия, поэтому итог зависит от белка; диффузия же в цитоплазме медленнее, чем в разбавленном растворе.</p><ol class="mech"><li>Макромолекулы занимают 20–30 % объёма цитоплазмы (200–300 мг/мл), и для каждой новой крупной молекулы доступна лишь часть объёма — это <a href="#ns-g-S1-T32">макромолекулярный краудинг</a>.</li><li>Исключённый объём при прочих равных благоприятствует компактным состояниям и ассоциации; неспецифические взаимодействия с другими белками могут действовать в обратную сторону.</li><li><a href="#ns-g-S1-T33">Коэффициент диффузии</a> снижается: у GFP в цитоплазме клеток CHO он примерно втрое ниже, чем в солевом растворе.</li></ol><p>Белки обычно изучают в разбавленных растворах, а в цитоплазме суммарная концентрация макромолекул составляет 200–300 мг/мл, и они занимают 20–30 % объёма (Ellis 2001). Значительная часть объёма недоступна для каждой новой крупной молекулы. Последствия этого удобно разделить на три величины.</p><p>Равновесие: эффективная активность макромолекул выше их номинальной концентрации, и исключённый объём при прочих равных благоприятствует сборке комплексов, укладке и полимеризации (Ellis 2001). Однако в цитоплазме действуют и неспецифические, в том числе электростатические, взаимодействия с окружающими белками: в клетках E. coli они меняли устойчивость небольшого белкового домена иначе, чем предсказывает теория краудинга (Smith 2016). Поэтому изменение устойчивости белка, а по данным других работ и связывания, зависит от конкретного белка и среды. Диффузия: по восстановлению флуоресценции после выцветания коэффициент диффузии GFP в цитоплазме клеток CHO оказался около 27 мкм²/с против 87 мкм²/с в солевом растворе (Swaminathan 1997); крупные комплексы замедляются сильнее.</p><p>Наблюдаемая скорость процесса — то, как быстро система приходит к новому состоянию, — зависит от обоих эффектов и от того, какая стадия лимитирует. Реакция, ограниченная частотой встреч партнёров, в цитоплазме идёт медленнее, чем в пробирке; сборка комплекса, определяемая равновесием, может дать больше комплекса, если неспецифические взаимодействия не действуют в обратную сторону. Поэтому рост локальной концентрации не гарантирует роста потока: если фермент насыщен субстратом, добавочный субстрат скорость почти не меняет.</p><p>Краудинг регулируется. В клетках дрожжей и HEK293 рапамицин, подавляющий mTORC1, за 2–3 ч снижал содержание рибосом, и подвижность частиц диаметром 40 нм росла; подвижность молекул размером 5 нм и меньше не менялась (Delarue 2018).</p><div class="note trap"><strong>Типичная ошибка</strong> Если повысить локальную концентрацию субстрата у фермента, реакция всегда ускорится.<p class="trap-fix">Скорость растёт, только пока фермент не насыщен и стадия встречи партнёров лимитирует. Насыщенный фермент на добавочный субстрат почти не отвечает, а в плотной цитоплазме встречи замедлены диффузией.</p></div><div class="static-quiz"><h3>Фермент работает в режиме насыщения субстратом. Субстрат дополнительно сконцентрировали в малом объёме вокруг фермента; количество и каталитические свойства фермента, вязкость и другие условия не изменились. Как изменится скорость реакции?</h3><ol><li><b>А.</b> Вырастет пропорционально концентрации <i>(неверный вариант)</i><br><span class="expl">Пропорциональный рост скорости наблюдается, только пока концентрация субстрата намного ниже Kм. Насыщенный фермент уже работает почти с максимальной скоростью.</span></li><li><b>Б.</b> Почти не изменится <i>(верный вариант)</i><br><span class="expl">Активные центры насыщенного фермента почти всё время заняты, поэтому добавочный субстрат скорость не повышает. Рост локальной концентрации увеличивает поток, только пока фермент не насыщен.</span></li><li><b>В.</b> Снизится из-за краудинга <i>(неверный вариант)</i><br><span class="expl">Краудинг замедляет диффузию, но сам по себе не снижает скорость насыщенного фермента: его активные центры по-прежнему заняты субстратом.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/s0968-0004(01)01938-7">Ellis R. J. 2001. Macromolecular crowding: obvious but underappreciated. Trends Biochem Sci</a></li><li><a href="https://doi.org/10.1016/S0006-3495(97)78835-0">Swaminathan R., Hoang C. P., Verkman A. S. 1997. Photobleaching recovery and anisotropy decay of green fluorescent protein GFP-S65T in solution and cells: cytoplasmic viscosity probed by green fluorescent protein translational and rotational diffusion. Biophys J</a></li><li><a href="https://doi.org/10.1016/j.cell.2018.05.042">Delarue M. et al. 2018. mTORC1 controls phase separation and the biophysical properties of the cytoplasm by tuning crowding. Cell</a></li><li><a href="https://doi.org/10.1073/pnas.1518620113">Smith A. E., Zhou L. Z., Gorensek A. H., Senske M., Pielak G. J. 2016. In-cell thermodynamics and a new role for protein surfaces. Proc Natl Acad Sci USA</a></li></ul><p>Доля занятого объёма и концентрация макромолекул — оценки обзора Ellis 2001 (полный текст). Коэффициенты диффузии GFP-S65T — данные опыта: FRAP в цитоплазме клеток CHO и в солевом растворе (Swaminathan 1997): время полувосстановления 83 и 30 мс, относительная вязкость цитоплазмы 3,2, D в растворе 87 мкм²/с. Регуляция краудинга — Delarue 2018: дрожжи и клетки HEK293, рапамицин 2–3 ч, трекинг частиц GEM диаметром 40 нм. Направления изменений на схеме — качественные, числа даны только для D. Неспецифические взаимодействия в клетке — Smith 2016 (клетки E. coli, ¹⁹F-ЯМР в клетке, SH3-домен белка drk; прочитан реферат).</p></details></article><article class="card print-unit" id="ns-source-sink"><div class="eyebrow">Локальная концентрация · шаг 10 из 30</div><h2>Как источник, диффузия и сток создают устойчивый градиент</h2><p class="lead">Неоднородность распределения растворимого вещества внутри одного объёма сохраняется, пока его непрерывно производит источник и удаляет сток; масштаб градиента — длина диффузии λ = √(D/k).</p><ol class="mech"><li><a href="#ns-g-S1-T34">Источник</a> — локальный синтез, выход из депо или направленный транспорт — поддерживает концентрацию c₀ у мембраны.</li><li>Молекулы расходятся диффузией с коэффициентом D и удаляются <a href="#ns-g-S1-T35">стоком</a> с константой k; в стационаре профиль c(x) = фон + (c₀ − фон)·e^(−x/λ).</li><li><a href="#ns-g-S1-T36">Длина диффузии</a> λ = √(D/k): ускорение стока сужает домен без изменения источника.</li></ol><p>Простейшая модель устойчивой неоднородности внутри компартмента содержит три составляющие. Без источника нет неоднородности, без диффузии — распространения, а без стока вещество со временем распределится по всему объёму равномерно. Так устроены градиенты растворимых сигнальных молекул; закрепление вещества на мембране или цитоскелете — другой способ создать неоднородность.</p><p>В одномерной модели вещество образуется у плоскости x = 0, диффундирует с коэффициентом D и удаляется процессом первого порядка с константой k. В <a href="#ns-g-S1-T37">стационарном профиле</a> избыток концентрации над фоном убывает экспоненциально и на расстоянии λ = √(D/k) падает в e ≈ 2,7 раза. λ не следует путать со среднеквадратичным смещением √(2Dt) за время t: λ описывает профиль, который не меняется во времени.</p><p>Для свободного Ca²⁺ λ составляет десятые доли микрометра: из измерений в экстракте ооцитов шпорцевой лягушки дальность действия свободного Ca²⁺ до связывания буфером оценена в 0,1 мкм, а IP₃ (D = 283 мкм²/с) — в 24 мкм (Allbritton 1992). В интактных клетках диффузия IP₃ затруднена: в клетках нейробластомы человека D ≤ 10 мкм²/с, и дальность действия IP₃ меньше 5 мкм, поэтому в клетках млекопитающих IP₃ скорее местный, чем глобальный посредник (Dickinson 2016). Для фосфорилированного белка с D порядка 10 мкм²/с и временем жизни фосфорилированной формы в секунды λ — единицы микрометров (Brown и Kholodenko 1999).</p><p>Размер домена можно изменить, не трогая источник: повышение активности фосфодиэстеразы или фосфатазы сужает домен, подавление — расширяет. Быстрый ненасыщенный буфер действует как сток лишь в начальной фазе сигнала; в длительном стационаре связывание и отщепление уравновешиваются, а подвижный буфер может даже ускорять распространение. Локальность кальциевого сигнала поэтому условна: при сильном выбросе Ca²⁺ буферы насыщаются, и могут возникать подъёмы и волны, охватывающие всю клетку (Berridge 2003).</p><div class="note trap"><strong>Типичная ошибка</strong> Если вещество диффундирует в 100 раз медленнее, его домен во столько же раз уже.<p class="trap-fix">Длина диффузии λ пропорциональна квадратному корню из отношения D/k: при уменьшении D в 100 раз домен сужается в 10 раз, а одновременное изменение D и k в одно и то же число раз профиль не меняет.</p></div><div class="static-quiz"><h3>Белок фосфорилируется киназой у мембраны и дефосфорилируется фосфатазой в цитозоле; D = 10 мкм²/с. Активность фосфатазы повысили в 4 раза. Как изменится длина диффузии фосфорилированной формы?</h3><ol><li><b>А.</b> Уменьшится в 4 раза <i>(неверный вариант)</i><br><span class="expl">Константа стока выросла в 4 раза, но длина диффузии зависит от неё через квадратный корень: λ = √(D/k).</span></li><li><b>Б.</b> Не изменится <i>(неверный вариант)</i><br><span class="expl">Киназа у мембраны действительно прежняя, но размер домена задаёт ещё и сток: фосфатаза быстрее дефосфорилирует белок, и фосфорилированная форма успевает продиффундировать от мембраны на меньшее расстояние.</span></li><li><b>В.</b> Уменьшится в 2 раза <i>(верный вариант)</i><br><span class="expl">λ = √(D/k): при росте k в 4 раза λ уменьшается в √4 = 2 раза. Так сток меняет размер домена, не меняя источник.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1465619">Allbritton N. L., Meyer T., Stryer L. 1992. Range of messenger action of calcium ion and inositol 1,4,5-trisphosphate. Science</a></li><li><a href="https://doi.org/10.1126/scisignal.aag1625">Dickinson G. D. et al. 2016. Hindered cytoplasmic diffusion of inositol trisphosphate restricts its cellular range of action. Sci Signal</a></li><li><a href="https://doi.org/10.1016/s0014-5793(99)01058-3">Brown G. C., Kholodenko B. N. 1999. Spatial gradients of cellular phospho-proteins. FEBS Lett</a></li><li><a href="https://doi.org/10.1038/nrm1838">Kholodenko B. N. 2006. Cell-signalling dynamics in time and space. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1038/nrm1155">Berridge M. J., Bootman M. D., Roderick H. L. 2003. Calcium signalling: dynamics, homeostasis and remodelling. Nat Rev Mol Cell Biol</a></li></ul><p>Схема — учебная модель практикума (вопрос 2, базовый уровень): одномерный стационарный профиль — решение уравнения D·c″ − k·(c − фон) = 0 с постоянной концентрацией у источника c₀ и c → фон вдали от него; фон 5 % от c₀ поддерживает равномерный базальный источник k·фон. Показан участок полубесконечной среды длиной 20 мкм; это не точное решение для замкнутой клетки с непроницаемым дальним концом (такое решение — в модели шага «Микродомены cAMP»). Для точечного источника в трёх измерениях профиль спадает быстрее (множитель 1/r), но масштаб λ тот же. Дальность действия Ca²⁺ и IP₃ — расчёт Allbritton 1992 из коэффициентов диффузии, измеренных в цитозольном экстракте ооцитов Xenopus laevis, и времён жизни посредников. Оценка для фосфобелков — Brown и Kholodenko 1999 (расчёт по измеренным D и активностям киназ и фосфатаз). Волны Ca²⁺ — обзор Berridge 2003.</p></details></article><article class="card print-unit" id="ns-threshold"><div class="eyebrow">Локальная концентрация · шаг 11 из 30</div><h2>Как пороговый эффектор превращает плавный градиент в границу</h2><p class="lead">Градиент — непрерывная величина, а ответ клетки часто дискретен. Преобразование выполняет эффектор, ответ которого зависит от концентрации круче гиперболы.</p><ol class="mech"><li>Ответ эффектора R = cⁿ/(K½ⁿ + cⁿ): K½ задаёт положение границы домена, коэффициент Хилла n — её резкость.</li><li>При n = 1 ответ повторяет плавный профиль; при n = 4 для перехода от 10 до 90 % ответа концентрация должна вырасти всего в 3 раза.</li><li><a href="#ns-g-S1-T38">Сверхчувствительность</a> ответа возникает при кооперативном связывании, многоступенчатом фосфорилировании и <a href="#ns-g-S1-T39">насыщении субстратом киназы и фосфатазы</a>.</li></ol><p>Если ответ эффектора зависит от концентрации сигнала плавно, профиль ответа повторяет профиль градиента и остаётся размытым. Если же ответ зависит от концентрации круче гиперболы, в области, где концентрация выше порога, эффектор активен почти полностью, а за её пределами почти неактивен. Так градиент и порог вместе создают <a href="#ns-g-S1-T40">позиционную информацию</a>: профиль задаёт координату, порог превращает её в границу.</p><p>Крутизну описывают коэффициентом Хилла. При n = 1 ответ растёт от 10 до 90 %, когда концентрация увеличивается в 81 раз, при n = 4 — всего в 3 раза. При одном и том же K½ граница домена (ответ 50 %) остаётся на месте; меняются ширина переходной зоны и остаточный ответ вдали от источника.</p><p>Кооперативное связывание: занятие одного сайта повышает сродство остальных, как у кальмодулина с четырьмя сайтами Ca²⁺. Многоступенчатое фосфорилирование: белок активен только после присоединения нескольких фосфатов. Сверхчувствительность нулевого порядка: если киназа и фосфатаза насыщены субстратом, доля фосфорилированного белка очень резко зависит от отношения их активностей (Goldbeter и Koshland 1981; Ferrell и Ha 2014).</p><p>Для резкого ответа недостаточно требования двух независимых условий: коинцидентное узнавание — узнавание по совпадению двух и более признаков (вопрос 3) — повышает избирательность, но ответ на каждое условие остаётся гиперболическим.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем выше коэффициент Хилла, тем чувствительнее эффектор и тем шире область, где он отвечает.<p class="trap-fix">Коэффициент Хилла меняет крутизну, а не положение порога: при том же K½ граница домена остаётся на месте, а при концентрации ниже K½ кооперативный эффектор отвечает слабее некооперативного.</p></div><div class="static-quiz"><h3>Киназа и фосфатаза, действующие на один белок, насыщены субстратом, и их активности равны: фосфорилирована половина молекул. Активность киназы повысили на 10 %. Как изменится доля фосфорилированного белка?</h3><ol><li><b>А.</b> Вырастет примерно на 10 % <i>(неверный вариант)</i><br><span class="expl">Плавный, почти линейный ответ получается, когда ферменты не насыщены: тогда перевес киназы на 10 % повышает долю фосфорилированного белка лишь с 50 до 54 %. При насыщении эта доля зависит от отношения активностей очень резко.</span></li><li><b>Б.</b> Почти не изменится <i>(неверный вариант)</i><br><span class="expl">Насыщение не делает систему нечувствительной: каждый фермент работает почти с постоянной максимальной скоростью, и небольшой перевес киназы накапливается, пока почти весь белок не станет фосфорилированным.</span></li><li><b>В.</b> Вырастет до большей части молекул <i>(верный вариант)</i><br><span class="expl">Это сверхчувствительность нулевого порядка: при насыщении обоих ферментов перевес киназы на 10 % переводит долю фосфорилированного белка с 50 % примерно до 90 % (расчёт по Goldbeter и Koshland 1981).</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.78.11.6840">Goldbeter A., Koshland D. E. 1981. An amplified sensitivity arising from covalent modification in biological systems. Proc Natl Acad Sci USA</a></li><li><a href="https://doi.org/10.1016/j.tibs.2014.08.003">Ferrell J. E., Ha S. H. 2014. Ultrasensitivity part I: Michaelian responses and zero-order ultrasensitivity. Trends Biochem Sci</a></li></ul><p>Режим «Градиент и эффектор» — учебная модель практикума (вопрос 2, базовый уровень) при D = 10 мкм²/с и k = 1 с⁻¹; ответ рассчитан по уравнению Хилла. Режим «Нулевой порядок» — расчёт стационарной доли фосфорилированного белка по формуле Goldbeter и Koshland 1981 при равных константах Михаэлиса киназы и фосфатазы, выраженных в долях общего количества белка-субстрата (1 — ферменты не насыщены, 0,01 — насыщены).</p></details></article><article class="card print-unit" id="ns-camp-domains"><div class="eyebrow">Локальная концентрация · шаг 12 из 30</div><h2>Почему одинаковый средний уровень cAMP даёт разные ответы</h2><p class="lead">Аденилатциклаза — источник cAMP, фосфодиэстеразы — сток, AKAP удерживает PKA у мишени. Поэтому ответ мишени определяет концентрация cAMP рядом с ней, а не средний уровень в клетке.</p><ol class="mech"><li>Гормон активирует <a href="#ns-g-S1-T41">аденилатциклазу</a> в своём мембранном домене; синтезированный cAMP гидролизуют <a href="#ns-g-S1-T42">фосфодиэстеразы</a>.</li><li><a href="#ns-g-S1-T44">AKAP</a> удерживают <a href="#ns-g-S1-T43">PKA</a>, а часто и аденилатциклазу, PDE и фосфатазы рядом с определённой мишенью.</li><li>Средняя концентрация cAMP зависит только от общей скорости синтеза и стока; ответ мишени — от cAMP рядом с ней и от того, есть ли там PKA.</li></ol><h3>Опыты на сердце</h3><p>В изолированном перфузируемом сердце крысы изопротеренол (агонист β-адренорецепторов, 10 нМ) и простагландин E1 (30 мкМ) одинаково повышали содержание cAMP и активность PKA, но сократимость и активность гликогенфосфорилазы повышал только изопротеренол (Hayes 1979). В кардиомиоцитах взрослого кролика изопротеренол повышал cAMP и в растворимой фракции гомогената, и в нерастворимой (корпускулярной), а PGE1 — только в растворимой; PGE1 не активировал ни PKA нерастворимой фракции, ни фосфорилазу (Buxton и Brunton 1983).</p><p>Генетически кодируемые сенсоры позволили увидеть домены. В кардиомиоцитах новорождённой крысы β-адренергическая стимуляция создавала микродомены повышенного cAMP у мембраны Т-трубочек, дальность действия cAMP составляла около 1 мкм, его распространение ограничивали фосфодиэстеразы, а активировалась прежде всего PKA, закреплённая рядом (Zaccolo и Pozzan 2002). В тех же клетках ответ на β-агонист связан с PKA типа II и фосфорилированием фосфоламбана и тропонина I, а ответ на PGE1 — с PKA типа I, без фосфорилирования этих белков (Di Benedetto 2008).</p><h3>Как удерживается домен</h3><p>Свободный cAMP диффундирует быстро — по измерениям 100–700 мкм²/с, — а фосфодиэстеразы работают медленно, и по этим числам домены удерживаться не могли бы. Возможное объяснение: при физиологических концентрациях большая часть cAMP связана с регуляторными субъединицами PKA и другими белками, и его перемещение замедлено («буферированная диффузия»); вокруг отдельных PDE возникают нанодомены низкого cAMP размером 10–30 нм (Bock 2020; обзор Bock 2024). Какого размера домены — десятки нанометров или микрометры — зависит от системы и остаётся предметом исследований.</p><p>На схеме — учебная модель практикума: при гормонах А и Б cAMP синтезируется с одинаковой скоростью, поэтому средний cAMP одинаков, а фосфорилирование мишени А — нет. <a href="#ns-g-S1-T45">IBMX</a>, ингибируя PDE, расширяет домены; <a href="#ns-g-S1-T46">пептид Ht31</a> отделяет PKA от AKAP, и фосфорилирование мишени снижается при прежнем cAMP рядом с ней.</p><div class="note trap"><strong>Типичная ошибка</strong> Если два гормона одинаково повышают cAMP в лизате, они вызывают одинаковый ответ.<p class="trap-fix">Лизат даёт среднюю концентрацию. Ответ мишени зависит от cAMP рядом с ней и от присутствия закреплённой PKA: в перфузируемом сердце изопротеренол и PGE1 одинаково повышали cAMP, но сократимость повышал только изопротеренол (Hayes 1979).</p></div><div class="static-quiz"><h3>Два гормона одинаково повысили средний cAMP в клетках, но фосфорилирование белка-мишени у мембраны вызвал только первый. Рассматривается стационарная модель, в которой константа гидролиза cAMP в обоих опытах одинакова. Какое объяснение согласуется с этим результатом?</h3><ol><li><b>А.</b> PDE гидролизуют cAMP второго гормона по пути к мишени <i>(верный вариант)</i><br><span class="expl">В этой модели средний cAMP одинаков, потому что одинакова общая скорость синтеза. Но cAMP второго гормона гидролизуется фосфодиэстеразами по пути и до PKA у мишени почти не доходит.</span></li><li><b>Б.</b> При втором гормоне синтезируется меньше cAMP <i>(неверный вариант)</i><br><span class="expl">В этой модели равные стационарные средние концентрации при одинаковой константе удаления означают одинаковую общую скорость синтеза. Различие — в месте синтеза.</span></li><li><b>В.</b> Первый гормон сам активирует PKA у мишени, без cAMP <i>(неверный вариант)</i><br><span class="expl">Гормон связывается с рецептором на внешней стороне мембраны и до PKA не доходит; PKA активируется cAMP, который связывается с её регуляторными субъединицами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1073/pnas.76.4.1570">Hayes J. S. et al. 1979. Hormonally specific expression of cardiac protein kinase activity. Proc Natl Acad Sci USA</a></li><li><a href="https://doi.org/10.1016/S0021-9258(17)44447-4">Buxton I. L., Brunton L. L. 1983. Compartments of cyclic AMP and protein kinase in mammalian cardiomyocytes. J Biol Chem</a></li><li><a href="https://doi.org/10.1126/science.1069982">Zaccolo M., Pozzan T. 2002. Discrete microdomains with high concentration of cAMP in stimulated rat neonatal cardiac myocytes. Science</a></li><li><a href="https://doi.org/10.1161/CIRCRESAHA.108.174813">Di Benedetto G. et al. 2008. Protein kinase A type I and type II define distinct intracellular signaling compartments. Circ Res</a></li><li><a href="https://doi.org/10.1016/j.cell.2020.07.035">Bock A. et al. 2020. Optical mapping of cAMP signaling at the nanometer scale. Cell</a></li><li><a href="https://doi.org/10.1016/j.tibs.2024.01.004">Bock A., Irannejad R., Scott J. D. 2024. cAMP signaling: a remarkably regional affair. Trends Biochem Sci</a></li><li><a href="https://doi.org/10.1124/pharmrev.120.000086">Zaccolo M., Zerio A., Lobo M. J. 2021. Subcellular organization of the cAMP signaling pathway. Pharmacol Rev</a></li></ul><p>Hayes 1979: изолированное перфузируемое сердце крысы, изопротеренол 10 или 80 нМ, PGE1 2 или 30 мкМ; измерены cAMP, активность PKA, фосфорилазы и dP/dt. Buxton и Brunton 1983: изолированные кардиомиоциты взрослого кролика, изопротеренол 1 мкМ, PGE1 10 мкМ; cAMP и PKA во фракциях гомогената (3000 g, 5 мин). Zaccolo и Pozzan 2002: кардиомиоциты новорождённой крысы, норадреналин, FRET-сенсор на основе субъединиц PKA (по реферату). Di Benedetto 2008: кардиомиоциты новорождённой крысы (по реферату). Bock 2020: клетки HEK293 (полный текст PMC); буферированная диффузия cAMP и нанодомены у PDE. Схема — учебная модель практикума (вопрос 2, продвинутый уровень): одномерная клетка 20 мкм, эффективный D cAMP 30 мкм²/с (учебный), величины условные.</p></details></article><article class="card print-unit" id="ns-ran-gradient"><div class="eyebrow">Локальная концентрация · шаг 13 из 30</div><h2>Как градиент RanGTP задаёт направление ядерного транспорта</h2><p class="lead">Фактор обмена RCC1 связан с хроматином, а активатор гидролиза GTP RanGAP1 находится в цитоплазме; поэтому RanGTP сосредоточен в ядре, и импортины освобождают груз именно там.</p><ol class="mech"><li>RCC1 на хроматине заменяет GDP на GTP в Ran; RanGAP1 вместе с RanBP1 в цитоплазме ускоряет гидролиз GTP на Ran.</li><li>Импортин связывает груз в цитоплазме и освобождает его в ядре при связывании RanGTP; комплекс импортин–RanGTP возвращается в цитоплазму.</li><li>NTF2 переносит RanGDP обратно в ядро; в митозе RanGTP образуется у хромосом и служит позиционной информацией для сборки веретена.</li></ol><p>Ran — малая ГТФаза, существующая в форме, связанной с GTP, и в форме, связанной с GDP. Обмен и гидролиз нуклеотида на Ran ускоряют белки-регуляторы, а градиент возникает потому, что эти белки размещены в разных компартментах. Фактор обмена RCC1 связан с хроматином, то есть находится в ядре; активатор гидролиза RanGAP1 находится в цитоплазме, а белок RanBP1, связывающий RanGTP, ускоряет вызванный RanGAP1 гидролиз на порядок (Bischoff 1995).</p><p>Поэтому <a href="#ns-g-S1-T47">RanGTP</a> сосредоточен в ядре: FRET-сенсоры показали резкий перепад RanGTP между ядром и цитоплазмой в экстрактах яиц шпорцевой лягушки (Kalab 2002). Импортин связывает груз в цитоплазме, проходит через ядерную пору и в ядре связывает RanGTP, который освобождает груз. Комплекс импортин–RanGTP выходит в цитоплазму, где после гидролиза GTP импортин освобождается для нового цикла; экспортины, наоборот, связывают груз вместе с RanGTP в ядре (Stewart 2007).</p><p>Каждый цикл выносит Ran из ядра. Запас Ran в ядре восполняется белком NTF2: он связывает RanGDP и переносит его через пору; в ядре RCC1 заменяет GDP на GTP, а к RanGTP NTF2 сродства не имеет, и Ran остаётся в ядре (Ribbeck 1998). Направление транспорта задаёт не пора, а разделение источника RanGTP (RCC1) и его стока (RanGAP1).</p><p>В митозе ядерной оболочки нет, но RCC1 остаётся на хромосомах. В митотических клетках человека FRET-сенсор Rango показал, что вокруг хромосом свободных грузов импортина-β больше; этот градиент ускоряет сборку веретена, но для поддержания уже собранного веретена в основном не нужен (Kaláb 2006).</p><div class="note trap"><strong>Типичная ошибка</strong> Направление ядерного импорта задаёт ядерная пора, пропускающая белки только внутрь.<p class="trap-fix">Пора пропускает транспортные рецепторы в обе стороны. Направление задаёт асимметрия RanGTP: RCC1 в ядре и RanGAP1 в цитоплазме; импортин освобождает груз там, где связывает RanGTP, — в ядре.</p></div><div class="static-quiz"><h3>Мысленный опыт: RanGAP1 вместе с RanBP1 поместили в ядро, где RCC1 продолжает работать. Как изменится освобождение импортных грузов в ядре?</h3><ol><li><b>А.</b> Не изменится: груз освобождается в ядерной поре <i>(неверный вариант)</i><br><span class="expl">Пора пропускает комплекс импортина с грузом, но не разрывает его. Груз освобождается при связывании импортина с RanGTP.</span></li><li><b>Б.</b> Ослабнет: RanGTP в ядре станет меньше <i>(верный вариант)</i><br><span class="expl">Сток RanGTP окажется рядом с источником: GTP на Ran будет гидролизоваться и в ядре, RanGTP станет меньше, и импортины будут хуже освобождать груз.</span></li><li><b>В.</b> Усилится: Ran будет быстрее обменивать GTP <i>(неверный вариант)</i><br><span class="expl">RanGAP1 ускоряет не обмен, а гидролиз GTP на Ran. В ядре он превращал бы RanGTP в RanGDP, а RanGDP груз не освобождает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-1.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1002/j.1460-2075.1995.tb07049.x">Bischoff F. R. et al. 1995. Co-activation of RanGTPase and inhibition of GTP dissociation by Ran-GTP binding protein RanBP1. EMBO J</a></li><li><a href="https://doi.org/10.1126/science.1068798">Kalab P., Weis K., Heald R. 2002. Visualization of a Ran-GTP gradient in interphase and mitotic Xenopus egg extracts. Science</a></li><li><a href="https://doi.org/10.1038/nrm2114">Stewart M. 2007. Molecular mechanism of the nuclear protein import cycle. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1093/emboj/17.22.6587">Ribbeck K. et al. 1998. NTF2 mediates nuclear import of Ran. EMBO J</a></li><li><a href="https://doi.org/10.1038/nature04589">Kaláb P. et al. 2006. Analysis of a RanGTP-regulated gradient in mitotic somatic cells. Nature</a></li></ul><p>Схема механизма; числа не показаны. Ускорение гидролиза RanBP1 — опыты с очищенными белками (Bischoff 1995). Перепад RanGTP между ядром и цитоплазмой — FRET-сенсоры в экстрактах яиц Xenopus laevis (Kalab 2002, по реферату). Импорт Ran при помощи NTF2 — система in vitro с пермеабилизированными клетками (Ribbeck 1998, по реферату). Градиент в митозе — клетки человека и экстракты яиц Xenopus, сенсор Rango, FRET и FLIM (Kaláb 2006, по реферату). Общая схема цикла — обзор Stewart 2007.</p></details></article><article class="card print-unit" id="ns-measure-gradients"><div class="eyebrow">Локальная концентрация · шаг 14 из 30</div><h2>Как измеряют градиенты в живой клетке и чем ограничены эти измерения</h2><p class="lead">Лизат уничтожает пространственную информацию, поэтому градиенты измеряют в живых клетках: биосенсорами, методом FRAP и управляемым вмешательством. Каждый метод сам входит в измеряемую систему.</p><ol class="mech"><li>Сенсор на основе <a href="#ns-g-S1-T48">FRET</a>: связывание лиганда меняет перенос энергии между двумя флуоресцентными белками; сенсор с одним флуоресцентным белком меняет яркость.</li><li><a href="#ns-g-S1-T49">FRAP</a>: флуоресценцию в малой области гасят светом и по скорости её восстановления оценивают подвижность белка и долю неподвижных молекул.</li><li>Перенос фермента химически индуцируемым сближением или активация синтеза светом проверяет достаточность события; удаление белка — его необходимость.</li></ol><p><a href="#ns-g-S1-T08">Генетически кодируемый биосенсор</a> можно адресовать в нужное место клетки и измерять величину там, где идёт событие. Первые сенсоры Ca²⁺ были построены на FRET между двумя флуоресцентными белками, соединёнными кальмодулином (Miyawaki 1997). В сенсоре cAMP Epac1-camps cAMP-связывающий домен Epac находится между голубым и жёлтым флуоресцентными белками, и связывание cAMP уменьшает перенос энергии (Nikolaev 2004). Сегодня часто применяют сенсоры с одним флуоресцентным белком, яркость которого меняется при связывании лиганда (Greenwald 2018).</p><p>Сенсор связывает лиганд и потому буферирует его: при высокой экспрессии сенсора свободного cAMP или Ca²⁺ может становиться меньше, а его динамика и пространственный профиль — меняться. Насколько и как долго, зависит от синтеза и удаления лиганда, подвижности сенсора и обратных связей клетки (Bock 2020). Адресованный сенсор сообщает величину только для того места, куда он адресован, адресация может изменить его динамический диапазон, а без калибровки насыщение сенсора неотличимо от прекращения роста концентрации лиганда (Lyons 2023). Поэтому сообщение о локальной концентрации должно указывать сенсор, место, диапазон и способ калибровки.</p><p>FRAP измеряет подвижность: по восстановлению
