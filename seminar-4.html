иб. Каким будет pERK через 1 ч?", "p3a_3_o1": "Почти не изменится: BRAF V600E устойчив к препарату", "p3a_3_o2": "Повысится: препарат активирует RAF-димеры", "p3a_3_o3": "Снизится в несколько раз", "p3a_3_e": "Вемурафениб подавляет мономер BRAF V600E, который в этих клетках даёт основной сигнал. В экспериментах Lito (2012) pMEK и pERK были максимально подавлены за 1–2 ч. RAS-GTP в это время ещё низкий, и RAF-димеров мало.", "p3a_3_w1": "Вемурафениб создан именно против BRAF V600E и подавляет мономерную мутантную киназу. Устойчивость к нему развивается позднее и связана с RAF-димерами.", "p3a_3_w2": "Активация RAF-димеров ингибиторами RAF возможна в клетках с активным RAS. В меланоме BRAF V600E RAS-GTP исходно низкий, и в первый час препарат подавляет сигнал.", "p3a_4_q": "Меланома BRAF V600E, вемурафениб остаётся в среде. Через 1 ч pERK сильно снижен. Каким будет pERK через 24 ч по сравнению с 1 ч?", "p3a_4_o1": "Ещё ниже: препарат накапливается в клетке", "p3a_4_o2": "Выше: растёт RAS-GTP, образуются RAF-димеры", "p3a_4_o3": "Таким же: ингибитор действует постоянно", "p3a_4_e": "Без активной ERK DUSP и SPRY за несколько часов исчезают, вход от рецепторов растормаживается, RAS-GTP растёт (в экспериментах Lito 2012 — с 4–8 ч) и образуются RAF-димеры, на которые вемурафениб действует слабо. pERK частично восстанавливается до нового уровня, выше достигнутого минимума.", "p3a_4_w1": "Сила ингибирования мономера BRAF не растёт со временем. Меняется сеть: снятие отрицательной обратной связи создаёт обходной сигнал через RAS и RAF-димеры.", "p3a_4_w3": "Ингибитор действует постоянно, но не на все формы RAF: RAF-димеры, образующиеся при росте RAS-GTP, к нему устойчивы. Поэтому pERK частично восстанавливается.", "p3a_5_q": "Меланома BRAF V600E, 24 ч после добавления препаратов. Сравним вемурафениб и вемурафениб вместе с ингибитором MEK. Каким будет pERK при сочетании?", "p3a_5_o1": "Ниже, чем при одном вемурафенибе", "p3a_5_o2": "Таким же, как при одном вемурафенибе", "p3a_5_o3": "Выше: два препарата мешают друг другу", "p3a_5_e": "Отскок идёт через RAF-димеры, а они передают сигнал через MEK. Ингибитор MEK блокирует этот путь, поэтому при сочетании pERK остаётся низким и через 24 ч. В экспериментах Lito (2012) добавление ингибитора MEK усиливало подавление ERK и противоопухолевый эффект в моделях на мышах.", "p3a_5_w2": "Ингибитор MEK действует ниже RAF и блокирует сигнал RAF-димеров, который вемурафениб не подавляет. Поэтому pERK ниже, чем при одном вемурафенибе.", "p3a_5_w3": "Препараты действуют на разные уровни каскада и не мешают друг другу. Ингибитор MEK блокирует обходной сигнал, и pERK ниже.", "gn_prog": "Прогестерон", "g_prog": "Стероидный гормон, запускающий созревание ооцита Xenopus: через несколько часов в ооците начинается трансляция мРНК Mos. Ооцит выходит из профазы I мейоза.", "gn_mos": "Mos", "g_mos": "Киназа уровня MAPKKK, синтезируемая в созревающем ооците. Фосфорилирует и активирует MEK1. Активная MAPK стабилизирует Mos и усиливает его синтез — положительная обратная связь (Ferrell и Machleder 1998).", "gn_mapk": "p42 MAPK", "g_mapk": "MAP-киназа ооцита Xenopus, ортолог ERK2 млекопитающих. В модели вопроса 3 её активность выражена в условных единицах.", "gn_braf": "BRAF V600E", "g_braf": "Мутантная киназа RAF: замена валина 600 на глутамат стабилизирует активную конформацию, и мономер BRAF фосфорилирует MEK без RAS и без димеризации. Вемурафениб подавляет мономер, но слабо действует на RAF-димеры.", "gn_spry": "SPRY и SPRED", "g_spry": "Белки, синтез которых индуцирует ERK. Они тормозят передачу от рецептора к RAS, в частности мешают передаче от комплекса GRB2–SOS к RAS; SPRED1, кроме того, привлекает нейрофибромин к мембране. Звено медленной отрицательной обратной связи.", "s4_blood": "кровь", "s4_hep": "гепатоцит", "s4_pi3ki": "ингибитор PI3Kα", "s4_rapa": "рапамицин", "s4_fb": "S6K фосфорилирует IRS1 по серину", "s4_ampkIn": "дефицит энергии → AMPK", "s4_pepck": "гены PEPCK, G6PC", "s4_lipo": "гены липогенеза", "s4_gly_on": "синтез гликогена усилен", "s4_gly_off": "GSK3 тормозит синтез гликогена", "s4_ins": "Инсулин, условная интенсивность (% диапазона модели)", "s4_ampk": "Дефицит энергии, условная интенсивность (% диапазона модели)", "s4_ins_k": "инсулин", "s4_raptor": "Raptor — часть mTORC1", "s4_ampkRap": "AMPK → Raptor", "s4_mrna": "индукция мРНК", "s4_proc": "созревание (S6K)", "s4_fox_c": "в цитоплазме {v} %", "s4_fox_n": "в ядре {v} %", "s4_r_foxn": "FOXO1 в ядре: доля от всего FOXO1 (расчёт модели)", "s4_r_srebpn": "SREBP-1c в ядре (созревший белок): доля от наибольшего значения", "s4_r_akt": "p-AKT (S473): доля от наибольшего значения в модели", "s4_r_fox": "в фосфорилированной форме удерживается в цитоплазме, в нефосфорилированной активирует в ядре гены глюконеогенеза", "s4_r_pepck": "мРНК PEPCK: % от уровня без инсулина", "s4_r_s6k": "p-S6K (T389): доля от наибольшего значения", "s4_r_srebp": "мРНК SREBP-1c (индукция): доля от наибольшего значения", "s4_r_ampk": "активность AMPK (p-T172)", "s4b_c_noins": "Инсулина нет. AKT не фосфорилирована, TSC2 подавляет RHEB, и mTORC1 неактивен. Нефосфорилированный FOXO1 находится в ядре и вместе с другими факторами активирует гены глюконеогенеза (PEPCK, G6PC). GSK3 активна и тормозит синтез гликогена.", "s4b_c_noins_z": "Без инсулина (например, при голодании) печень образует глюкозу, а синтез гликогена и липидов низкий. Аминокислоты в среде есть, но без сигнала от AKT mTORC1 не активируется. В модели показаны маркеры ветвей, а не метаболические потоки.", "s4b_c_noins_ampk": "Инсулина нет, энергии не хватает: AMPK активна. Она фосфорилирует TSC2 и Raptor и дополнительно подавляет mTORC1. FOXO1 находится в ядре, гены глюконеогенеза экспрессируются.", "s4b_c_noins_ampk_z": "При дефиците энергии процессы, потребляющие ATP, — синтез белка и липидов — подавлены двумя независимыми сигналами.", "s4b_c_ins": "Инсулин связывается с рецептором, IRS привлекает PI3K, образуется PIP₃, и AKT фосфорилируется. AKT фосфорилирует TSC2 (RHEB остаётся в GTP-форме, mTORC1 активируется, S6K фосфорилирована; растут индукция мРНК SREBP-1c и при участии S6K — его созревание), FOXO1 (он связывается с 14-3-3 и большей частью покидает ядро, экспрессия PEPCK снижается) и GSK3 (торможение синтеза гликогена снято).", "s4b_c_ins_z": "После приёма пищи инсулин снижает продукцию глюкозы печенью и способствует синтезу гликогена и липидов. Подавляя TSC2 и GSK3, AKT снимает торможение синтеза белка и гликогена; подавляя FOXO1 — активатор транскрипции генов глюконеогенеза, — снижает их экспрессию.", "s4b_c_ins_low": "Инсулина мало. AKT фосфорилирована слабо: в модели этого хватает для активации mTORC1 (эта ветвь чувствительнее), но недостаточно, чтобы вывести большую часть FOXO1 из ядра. Экспрессия генов глюконеогенеза подавлена лишь частично.", "s4b_c_ins_low_z": "Ветви AKT в модели различаются чувствительностью: при слабом сигнале они отвечают неодинаково. Это допущение модели, а не установленный механизм.", "s4b_c_ins_ampk": "Инсулин есть, но AMPK активна. Она фосфорилирует TSC2 (усиливая его действие на RHEB) и Raptor и подавляет mTORC1: p-S6K и маркеры SREBP-1c снижаются, хотя AKT фосфорилирована. На FOXO1 AMPK в этой модели непосредственно не действует: его распределение между ядром и цитоплазмой определяется сигналом AKT, доли показаны на схеме. AKT, в свою очередь, ослабляет активацию AMPK, фосфорилируя AMPKα1 по S487.", "s4b_c_ins_ampk_z": "mTORC1 — точка сходимости: инсулиновый сигнал стимулирует синтез, а дефицит энергии его тормозит даже при высоком инсулине. Ветвь FOXO1 в модели от AMPK прямо не зависит.", "s4b_c_ins_ampk_mid": "Инсулин есть, энергии не хватает. AKT фосфорилирует α1-субъединицу AMPK по S487 (у человека; S485 у крысы), и LKB1 хуже фосфорилирует T172: активность AMPK ниже, чем без инсулина, но не исчезает (Hawley 2014). Оставшаяся AMPK через TSC2 и Raptor частично подавляет mTORC1.", "s4b_c_ins_ampk_mid_z": "Связь между ветвями двусторонняя: AMPK тормозит mTORC1, а AKT ослабляет активацию AMPK. Поэтому активность AMPK зависит не только от энергетического состояния, но и от инсулина.", "s4b_take": "AKT распределяет инсулиновый сигнал по ветвям, подавляя несколько своих субстратов. Подавляя TSC2 и GSK3, она снимает торможение соответствующих процессов: mTORC1 активируется, торможение синтеза гликогена снято. Подавляя FOXO1, она снижает активацию генов глюконеогенеза: FOXO1 покидает ядро, и их экспрессия снижается. mTORC1 — точка сходимости противоположных входов: AKT через TSC2 активирует его, AMPK через TSC2 и Raptor подавляет даже при высоком инсулине. Сеть охвачена обратными связями: S6K фосфорилирует IRS1 и ослабляет вход, AKT ослабляет активацию AMPKα1.", "p4b_1_q": "В гепатоцитах без инсулина FOXO1 находится в ядре. Добавили инсулин. Где окажется FOXO1?", "p4b_1_o1": "В ядре: инсулин активирует FOXO1", "p4b_1_o2": "В цитоплазме: AKT фосфорилирует FOXO1", "p4b_1_o3": "Нигде: FOXO1 сразу разрушится", "p4b_1_e": "AKT фосфорилирует FOXO1 (T24 и S256 у человека), фосфорилированный FOXO1 связывается с белками 14-3-3 и выводится из ядра. Экспрессия генов глюконеогенеза PEPCK и G6PC снижается; в экспериментах Li и соавт. (2010) на гепатоцитах крысы инсулин снижал содержание мРНК PEPCK примерно на 95 %.", "p4b_1_w1": "FOXO1 активирует гены глюконеогенеза, а инсулин этот процесс подавляет. AKT фосфорилирует FOXO1, и он покидает ядро.", "p4b_1_w3": "Фосфорилированный FOXO1 сначала выводится из ядра и удерживается в цитоплазме белками 14-3-3. Его разрушение возможно позднее, но первое и главное следствие — изменение локализации.", "p4b_2_q": "К гепатоцитам добавили инсулин. Затем возник дефицит энергии, и AMPK активировалась. Как изменятся p-S6K и локализация FOXO1?", "p4b_2_o1": "p-S6K снизится, FOXO1 останется в цитоплазме", "p4b_2_o2": "p-S6K снизится, FOXO1 перейдёт в ядро", "p4b_2_o3": "p-S6K не изменится, FOXO1 перейдёт в ядро", "p4b_2_e": "AMPK фосфорилирует TSC2 (T1227 и S1345 — нумерация белка крысы в экспериментах Inoki 2003; у человека T1271 и S1387) и Raptor (S722 и S792 у человека) и подавляет mTORC1, поэтому p-S6K снижается (Inoki 2003; Gwinn 2008). AKT при этом фосфорилирована, и в модели FOXO1 остаётся преимущественно в цитоплазме: AMPK действует на ветвь mTORC1, а не на ветвь FOXO1.", "p4b_2_w2": "AMPK подавляет mTORC1, но не AKT. AKT по-прежнему фосфорилирует FOXO1, и в модели он остаётся в цитоплазме.", "p4b_2_w3": "AMPK действует на mTORC1 через TSC2 и Raptor, поэтому p-S6K снижается. FOXO1 остаётся в цитоплазме: AKT активна.", "p4b_3_q": "Инсулина нет, AMPK активна при дефиците энергии. Добавили инсулин. Как изменится активность AMPK?", "p4b_3_o1": "Возрастёт: AKT активирует AMPK", "p4b_3_o2": "Не изменится: эти пути не связаны", "p4b_3_o3": "Снизится частично", "p4b_3_e": "AKT фосфорилирует α1-субъединицу AMPK по S487 (у человека; S485 у крысы), и это ослабляет фосфорилирование T172 киназой LKB1 (Hawley 2014). Пока энергии не хватает, AMPK остаётся частично активной. α2-субъединица таким путём не регулируется.", "p4b_3_w1": "AKT не активирует AMPK, а ослабляет её активацию: фосфорилирование α1 по S487 мешает фосфорилированию T172.", "p4b_3_w2": "Пути связаны: AKT фосфорилирует AMPKα1 по S487, и активация AMPK ослабевает.", "s4a_gt": "Печень", "s4a_lirko": "нет INSR (LIRKO)", "s4a_sel": "селективная резистентность", "s4a_mask": "Схема скрыта. Определите состояние печени по результатам измерений.", "s4a_blot_t": "Измерения: вестерн-блот (общий лизат и ядерная фракция) и ОТ-кПЦР", "s4a_bl_tot": "Общий лизат клеток, вестерн-блот: условный сигнал, контроль загрузки — актин", "s4a_bl_nuc": "Ядерная фракция, вестерн-блот: контроль фракции — ламин B", "s4a_bl_q": "ОТ-кПЦР: мРНК относительно референсного транскрипта Rplp0 (36B4); PCK1 — % от уровня без инсулина, SREBF1c — доля от наибольшего значения", "s4a_blot_rec": "Записать измерение", "s4a_r_gng": "мРНК PEPCK (глюконеогенез): % от уровня без инсулина", "s4a_r_lipo": "мРНК SREBP-1c (индукция; маркер липогенной ветви): доля от наибольшего значения", "b4_akt": "p-AKT (S473)", "b4_fox": "p-FOXO1 (S256; у мыши S253)", "b4_s6k": "p-S6K (T389)", "b4_srebp": "SREBP-1c (ядерная форма)", "b4_pepck": "мРНК PCK1 (PEPCK)", "b4_act": "актин", "b4_lamin": "ламин B", "b4_srebpm": "мРНК SREBF1c", "bl_sel": "сел.", "bl_rapa": "+Р", "bl_pi3k": "+PI3Ki", "s4a_c_wt": "Нормальная печень, инсулин высокий. Обе ветви отвечают: большая часть FOXO1 фосфорилирована и вышла из ядра, мРНК PEPCK снижена; mTORC1 активен, мРНК SREBP-1c индуцирована, созревший SREBP-1c находится в ядре.", "s4a_c_wt_z": "После приёма пищи инсулин снижает продукцию глюкозы печенью и стимулирует синтез липидов — согласованный ответ одной сети. В модели это видно по маркерам ветвей (мРНК и ядерный белок), а не по метаболическим потокам.", "s4a_c_wt_low": "Нормальная печень, инсулина мало. AKT фосфорилирована слабо: mTORC1 уже активируется, а большая часть FOXO1 остаётся в ядре, и экспрессия генов глюконеогенеза подавлена слабо.", "s4a_c_wt_low_z": "При низком инсулине, например натощак, печень продолжает образовывать глюкозу.", "s4a_c_noins": "Инсулина нет. AKT не фосфорилирована, FOXO1 в ядре, PEPCK экспрессируется, мРНК SREBP-1c не индуцирована, ядерного SREBP-1c почти нет.", "s4a_c_noins_z": "Без инсулина печень продолжает образовывать глюкозу, а синтез липидов de novo низкий.", "s4a_c_lirko": "Печень без рецептора инсулина (LIRKO). Ни одна ветвь не отвечает на инсулин: PEPCK не подавляется, мРНК SREBP-1c не индуцирована. У мышей LIRKO инсулин не подавляет продукцию глюкозы печенью, возникают непереносимость глюкозы и гиперинсулинемия (Michael 2000), а также проатерогенный профиль липопротеинов при сниженной экспрессии SREBP-1c и секреции триглицеридов печенью (Biddinger 2008).", "s4a_c_lirko_z": "Полная потеря сигнала даёт иной фенотип, чем селективная резистентность: без SREBP-1c нет гипертриглицеридемии.", "s4a_c_sel": "Селективная резистентность (модель печени мышей ob/ob: IRS-2 снижен, инсулин высокий). AKT фосфорилирована слабее нормы. В модели этого хватает для mTORC1 и ветви SREBP-1c, но не для вывода большей части FOXO1 из ядра: PEPCK подавлен слабо, а маркеры липогенеза высокие (Shimomura 2000; Brown и Goldstein 2008).", "s4a_c_sel_z": "Печень продолжает выделять глюкозу и одновременно усиленно синтезирует триглицериды: гипергликемия сочетается с гипертриглицеридемией. Почему ветви расходятся, до конца не установлено; в модели это задано разной чувствительностью ветвей. По данным Titchenell (2016), подавление продукции глюкозы во многом зависит и от жировой ткани.", "s4a_c_sel_low": "Селективная резистентность при низком инсулине: сигнал AKT слаб, обе ветви отвечают слабо.", "s4a_c_sel_low_z": "Рассогласование ветвей проявляется при высоком инсулине, характерном для этого состояния.", "s4a_c_rapa": "Рапамицин подавил mTORC1: p-S6K нет, мРНК SREBP-1c не индуцирована и ядерного SREBP-1c нет, а FOXO1 по-прежнему фосфорилирован, и PEPCK подавлен. p-AKT даже немного выше: S6K больше не ослабляет IRS1. Это стационарный расчёт без перестройки mTORC2.", "s4a_c_rapa_z": "Ветви расходятся ниже AKT: индукция мРНК SREBP-1c требует mTORC1, ветвь FOXO1 — нет (Li 2010, гепатоциты крысы). При длительном действии рапамицин в ряде клеток нарушает сборку mTORC2 и может снижать p-AKT (Sarbassov 2006); модель этого не учитывает.", "s4a_c_rapa_low": "Рапамицин при низком инсулине: p-S6K нет, мРНК SREBP-1c не индуцирована, а p-AKT выше, чем без рапамицина при том же инсулине: S6K больше не ослабляет IRS1. Ответ ветви FOXO1 при этом неполный: доля FOXO1 в ядре и содержание мРНК PEPCK зависят от инсулина и показаны на схеме и в показателях.", "s4a_c_rapa_low_z": "Отрицательная обратная связь S6K → IRS1 ограничивает вход при умеренном инсулине; её снятие повышает p-AKT.", "s4a_c_sel_rapa": "Селективная резистентность и рапамицин: ветвь mTORC1 подавлена, мРНК SREBP-1c не индуцирована, ядерной формы SREBP-1c почти нет. По сравнению с той же печенью при том же инсулине без препарата p-AKT выше (ослаблена обратная связь S6K → IRS1), больше FOXO1 выходит из ядра, и мРНК PEPCK снижается сильнее. Насколько — зависит от инсулина: доли FOXO1 и мРНК PEPCK показаны на схеме и в показателях.", "s4a_c_sel_rapa_z": "Снятие обратной связи S6K → IRS1 усиливает ответ AKT и ветви FOXO1, но ограничение входа при селективной резистентности сохраняется. Это модельный эксперимент, а не рекомендация лечения.", "s4a_c_sel_rapa_low": "Селективная резистентность и рапамицин при низком инсулине: ветвь mTORC1 подавлена, мРНК SREBP-1c не индуцирована. p-AKT немного выше, чем без препарата при том же инсулине, но этого не хватает, чтобы вывести FOXO1 из ядра: мРНК PEPCK остаётся высокой.", "s4a_c_sel_rapa_low_z": "Ослабление обратной связи S6K → IRS1 не компенсирует сниженный вход: при низком инсулине ветвь FOXO1 не отвечает. Это модельный эксперимент, а не рекомендация лечения.", "s4a_c_pi3k": "Ингибитор PI3Kα: PIP₃ почти не образуется, AKT не фосфорилирована. Ни одна из ветвей не отвечает на инсулин: PEPCK высокий, мРНК SREBP-1c не индуцирована, ядерного SREBP-1c нет.", "s4a_c_pi3k_z": "Обе ветви начинаются с PI3K и AKT (Li 2010). У людей ингибиторы PI3Kα вызывают гипергликемию, а ответная гиперинсулинемия может вновь активировать PI3K в опухоли (Hopkins 2018).", "s4a_c_myst": "Неизвестное состояние печени: LIRKO, селективная резистентность или нормальная печень с рапамицином. Запишите результаты измерений и сравните их с нормой.", "s4a_c_myst_z": "По нескольким выходам одной сети можно различить, на каком уровне она нарушена.", "s4a_c_ans_lirko": "Это печень LIRKO: нет p-AKT, и ни одна из ветвей не отвечает.", "s4a_c_ans_lirko_z": "Полная потеря рецептора выключает всю сеть.", "s4a_c_ans_sel": "Это селективная резистентность: p-AKT снижен, PEPCK подавлен слабо, а p-S6K и маркеры SREBP-1c высокие.", "s4a_c_ans_sel_z": "Ранние звенья сети работают слабее, а её ветви рассогласованы.", "s4a_c_ans_rapa": "Это нормальная печень с рапамицином: p-AKT высокий, PEPCK подавлен, но p-S6K нет, и SREBP-1c не индуцирован.", "s4a_c_ans_rapa_z": "Рапамицин выключает ветвь mTORC1, не затрагивая ветвь FOXO1.", "s4a_take": "Инсулиновая сеть печени разветвляется ниже AKT: в гепатоците подавление генов глюконеогенеза идёт через FOXO1, а липогенез — через mTORC1 и SREBP-1c. Рапамицин выключает только вторую ветвь, ингибитор PI3K — обе. При селективной резистентности (модель ob/ob) инсулин плохо подавляет PEPCK, но липогенез сохранён; при полной потере рецептора (LIRKO) не отвечает ни одна ветвь, и фенотип иной. Почему ветви расходятся, до конца не установлено; в модели это задано разной чувствительностью ветвей к сигналу AKT.", "p4a_1_q": "На панелях измерений — нормальная печень без инсулина и с инсулином. Теперь исследуют печень без рецептора инсулина (LIRKO) при высоком инсулине. Какими будут результаты вестерн-блота и ОТ-кПЦР?", "p4a_1_o1": "p-AKT нет, PEPCK высокий, SREBP-1c нет", "p4a_1_o2": "p-AKT нет, PEPCK подавлен, SREBP-1c высокий", "p4a_1_o3": "p-AKT высокий, PEPCK высокий, SREBP-1c нет", "p4a_1_e": "Без рецептора инсулин не запускает сеть: AKT не фосфорилирована, FOXO1 остаётся в ядре, PEPCK экспрессируется, SREBP-1c не активируется. У мышей LIRKO снижены SREBP-1c и секреция триглицеридов печенью (Biddinger 2008).", "p4a_1_w2": "Без AKT ни одна из ветвей не отвечает: подавление PEPCK и активация SREBP-1c требуют сигнала от рецептора.", "p4a_1_w3": "Без рецептора инсулин не вызывает фосфорилирования AKT: сигнал обрывается на первом звене.", "p4a_2_q": "Печень в состоянии селективной резистентности (модель ob/ob: IRS-2 снижен), инсулин высокий. Как изменятся результаты измерений по сравнению с нормой?", "p4a_2_o1": "p-AKT снижен, PEPCK подавлен, SREBP-1c низкий", "p4a_2_o2": "p-AKT снижен, PEPCK не подавлен, SREBP-1c высокий", "p4a_2_o3": "p-AKT нет, PEPCK высокий, SREBP-1c нет", "p4a_2_e": "При селективной резистентности инсулин плохо подавляет глюконеогенез, но продолжает стимулировать липогенез (Brown и Goldstein 2008; Shimomura 2000). В модели p-AKT снижен, этого хватает для mTORC1 и ветви SREBP-1c, но не для вывода большей части FOXO1 из ядра. Почему ветви расходятся, до конца не установлено. Мы сравниваем маркеры ветвей, а не скорости глюконеогенеза и липогенеза.", "p4a_2_w1": "Это была бы противоположная картина: глюконеогенез подавлен, а липогенез не стимулирован. При селективной резистентности печени наоборот — липогенез сохранён.", "p4a_2_w3": "Так выглядит полная потеря рецептора (LIRKO). При селективной резистентности ранние звенья работают, хотя и слабее, а липогенная ветвь отвечает.", "p4a_3_q": "Нормальная печень, инсулин высокий. Добавили рапамицин. Как изменятся индукция мРНК SREBP-1c и мРНК PEPCK?", "p4a_3_o1": "Обе ветви перестанут отвечать на инсулин", "p4a_3_o2": "мРНК SREBP-1c не изменится, PEPCK перестанет подавляться", "p4a_3_o3": "мРНК SREBP-1c не будет индуцирована, PEPCK останется подавлен", "p4a_3_e": "В гепатоцитах крысы рапамицин в субнаномолярной концентрации блокировал индукцию мРНК SREBP-1c инсулином, но не мешал подавлению PEPCK (Li 2010). Ингибитор S6K индукцию мРНК SREBP-1c не блокировал. Созревание белка SREBP-1c, напротив, требует S6K (Owen 2012, гепатоциты трансгенных крыс): ветви индукции мРНК и созревания расходятся после mTORC1.", "p4a_3_w1": "Обе ветви блокирует ингибитор PI3K или AKT. Рапамицин действует ниже AKT, на mTORC1, и ветвь FOXO1 не затрагивает.", "p4a_3_w2": "От mTORC1 зависит именно липогенная ветвь. Подавление PEPCK идёт через FOXO1 и рапамицином не нарушается.", "p4a_4_q": "Нормальная печень, инсулин высокий. Добавили ингибитор PI3Kα. Какими будут результаты измерений?", "p4a_4_o1": "Только SREBP-1c исчезнет, PEPCK подавлен", "p4a_4_o2": "Ни одна ветвь не отвечает: PEPCK высокий, SREBP-1c нет", "p4a_4_o3": "p-AKT не изменится: PI3K не нужна для AKT", "p4a_4_e": "PI3K образует PIP₃, на котором собираются AKT, PDK1 и mTORC2. Без PIP₃ AKT не фосфорилируется, и обе ветви теряют ответ на инсулин (Li 2010). У людей ингибиторы PI3Kα вызывают гипергликемию (Hopkins 2018).", "p4a_4_w1": "Так действует рапамицин. Ингибитор PI3K выключает сигнал выше разветвления, поэтому не отвечает и ветвь FOXO1.", "p4a_4_w3": "Фосфорилирование AKT в ответ на инсулин требует PIP₃, который образует PI3K. Без него AKT не фосфорилируется.", "p4a_5_q": "Нормальная печень, инсулин 30 %. Добавили рапамицин (модель: стационарный расчёт, mTORC2 сохранён). Как изменится p-AKT?", "p4a_5_o1": "Повысится", "p4a_5_o2": "Снизится", "p4a_5_o3": "Исчезнет полностью", "p4a_5_e": "S6K фосфорилирует IRS1 по серину и ослабляет его связь с PI3K (Tremblay и Marette 2001; Harrington 2004). Рапамицин подавляет S6K, эта отрицательная обратная связь ослабевает, и p-AKT повышается. Ответ верен для заданной модели: при длительном действии рапамицин в ряде клеток нарушает сборку mTORC2 и может снижать p-AKT (Sarbassov 2006). В организме роль отдельных сайтов IRS1 тоже сложнее: у мышей с заменой Ser307 резистентность была тяжелее, а не легче (Copps 2010).", "p4a_5_w2": "Рапамицин действует ниже AKT, на mTORC1. Подавляя S6K, он снимает торможение IRS1, поэтому p-AKT растёт, а не снижается.", "p4a_5_w3": "Рапамицин не действует на PI3K и не прерывает путь от рецептора к AKT. Он ослабляет обратную связь S6K → IRS1.", "p4a_6_q": "Загадка. По результатам вестерн-блота и ОТ-кПЦР сравнивают нормальную и неизвестную печень, обе при высоком инсулине. У неизвестной p-AKT снижен, мРНК PEPCK высокая, а p-S6K и ядерная форма SREBP-1c на высоком уровне. Какое это состояние?", "p4a_6_o1": "Печень без рецептора инсулина (LIRKO)", "p4a_6_o2": "Нормальная печень с рапамицином", "p4a_6_o3": "Селективная резистентность", "p4a_6_e": "В модели практикума ранние звенья работают, хотя и слабее (p-AKT есть), ветвь mTORC1 и SREBP-1c отвечает, а ветвь FOXO1 — нет: так модель воспроизводит фенотип селективной резистентности. Какое звено нарушено в печени, сам фенотип не устанавливает.", "p4a_6_w1": "При LIRKO нет p-AKT и не отвечает ни одна ветвь, в том числе SREBP-1c.", "p4a_6_w2": "Рапамицин подавил бы p-S6K и SREBP-1c, а PEPCK остался бы подавлен. Здесь картина обратная.", "gn_insr": "Рецептор инсулина (INSR)", "g_insr": "Рецепторная тирозинкиназа. Связав инсулин, аутофосфорилируется и фосфорилирует адаптеры IRS1 и IRS2. У мышей LIRKO ген рецептора выключен только в гепатоцитах.", "gn_irs": "IRS1 и IRS2", "g_irs": "Адаптеры: фосфотирозины IRS связывают регуляторную субъединицу p85 PI3K. Фосфорилирование IRS1 по серинам (например, S307 у мыши, S312 у человека) киназами S6K, JNK и другими в клетках ослабляет передачу сигнала, но в организме роль отдельных сайтов сложнее (Copps 2010). В печени мышей ob/ob количество IRS-2 снижено (Shimomura 2000).", "gn_pi3k": "PI3K класса IA", "g_pi3k": "Липидкиназа: регуляторная p85 и каталитическая p110α. Превращает PIP₂ в PIP₃ на внутренней стороне мембраны. Ингибиторы p110α (например, алпелисиб) подавляют ответ на инсулин.", "gn_akt": "AKT", "g_akt": "Киназа, привлекаемая к мембране через PIP₃. Для полной активации нужны два фосфорилирования: PDK1 фосфорилирует T308, mTORC2 — S473 (номера AKT1; у AKT2, преобладающей в печени и мышцах, T309 и S474). Фосфорилирует TSC2, FOXO1, GSK3, TBC1D4 и PRAS40. Фосфорилирование AKT — не то же самое, что её активность.", "gn_ampk": "AMPK", "g_ampk": "Состоит из трёх субъединиц: α обладает киназной активностью, β выполняет каркасную функцию, а γ связывает AMP, ADP или ATP. Активна при фосфорилировании T172 в α-субъединице. Подавляет процессы, потребляющие ATP, и стимулирует его образование. AKT фосфорилирует α1 по S487 (у человека) и ослабляет активацию (Hawley 2014).", "gn_tsc": "TSC2", "g_tsc": "Белок комплекса TSC (TSC1, TSC2, TBC1D7), ускоряющий гидролиз GTP в RHEB (GAP). AKT фосфорилирует TSC2 (S939 и T1462 у человека) и ослабляет его действие; в результате RHEB-GTP активирует mTORC1. AMPK фосфорилирует другие сайты TSC2 (T1227 и S1345 у крысы, у человека T1271 и S1387) и усиливает его действие (Inoki 2003).", "gn_mtorc1": "mTORC1", "g_mtorc1": "Комплекс киназы mTOR с Raptor и mLST8. Активен на лизосоме при одновременном выполнении двух условий: наличии аминокислот (через Rag-ГТФазы) и RHEB-GTP. Стимулирует синтез белков и липидов. AMPK подавляет его через TSC2 и фосфорилирование Raptor (S722, S792; Gwinn 2008). Рапамицин в комплексе с FKBP12 подавляет часть функций mTORC1, прежде всего фосфорилирование S6K.", "gn_s6k": "S6K1", "g_s6k": "Киназа, активируемая mTORC1 через фосфорилирование T389. Стимулирует синтез белка и образование рибосом. Фосфорилирует IRS1 по серинам и ослабляет инсулиновый сигнал — отрицательная обратная связь.", "gn_srebp": "SREBP-1c", "g_srebp": "Транскрипционный фактор, активирующий гены липогенеза (FASN, ACC и др.). Синтезируется как белок мембраны эндоплазматической сети; после протеолиза его N-концевая часть переходит в ядро. Инсулин через mTORC1 усиливает транскрипцию гена SREBF1c (Li 2010) и протеолитическое созревание белка; созревание, в отличие от индукции мРНК, требует S6K (Owen 2012, гепатоциты трансгенных крыс).", "gn_gsk3": "GSK3", "g_gsk3": "Киназа, которая фосфорилирует и ингибирует гликогенсинтазу. AKT фосфорилирует GSK3 (S21 у α, S9 у β) и подавляет её, после чего торможение синтеза гликогена снято.", "gn_rheb": "RHEB", "g_rheb": "Малая ГТФаза. В GTP-форме связывает mTORC1 на лизосоме и активирует его. TSC2 — GAP для RHEB: ускоряет гидролиз GTP и переводит RHEB в неактивную GDP-форму. AKT ослабляет TSC2, AMPK усиливает его.", "gn_foxo": "FOXO1", "g_foxo": "Транскрипционный фактор семейства forkhead. Нефосфорилированный FOXO1 в ядре вместе с другими факторами активирует гены глюконеогенеза (PEPCK, G6PC). AKT фосфорилирует FOXO1 (T24 и S256 у человека); он связывается с 14-3-3 и выводится из ядра.", "gn_pepck": "PEPCK и G6PC", "g_pepck": "Ферменты глюконеогенеза: фосфоенолпируваткарбоксикиназа и глюкозо-6-фосфатаза. Экспрессию их генов активирует FOXO1 и подавляет инсулин.", "gn_lipo": "Гены липогенеза", "g_lipo": "Гены ферментов синтеза жирных кислот и триглицеридов (FASN, ACC1, SCD1 и др.). Их транскрипцию активирует SREBP-1c.", "teacher_t": "Для преподавателя: проведение занятия, упрощения моделей и источники", "src_t_st": "Источники", "teacher_1": "На базовый уровень каждого вопроса отводится 5–7 минут, на продвинутый — 8–10 минут. В режиме «Сценарий» студенты сначала выбирают ответ, затем нажимают «Показать на схеме». Клавиши 1–4 переключают вопросы, клавиша B — уровень сложности. Щелчок по белку на схеме открывает справку. На студенческой странице сайта порядок шагов и вариантов ответа перемешивается при каждом открытии; для проектора откройте страницу с параметром ?fixed — порядок будет тот же, что в этом файле и в гиде. Кнопки «Объяснения» открывают страницу объяснений к нужному вопросу.", "teacher_2": "Все величины условны и отсчитываются от исходного состояния в покое; модели передают направление изменений и порядок событий, а не реальные концентрации. В вопросах 1п, 2п и 3п используется одна модель каскада ERK: вход (занятые рецепторы или свет) → RAS-GTP → RAF → MEK → ERK; завершение — GAP (NF1), фосфатазы DUSP (постоянная часть и часть, синтез которой индуцирует ERK), интернализация и разрушение рецептора; быстрая петля ERK ⊣ RAF-1 и ERK–RSK ⊣ SOS1 (минуты, без синтеза белка) и медленная петля через синтез DUSP и SPRY (десятки минут — часы). Кривая «доза — ответ» в вопросе 1б рассчитана по отдельной стационарной модели трёх циклов фосфорилирования (Goldbeter и Koshland 1981): при насыщении ферментов эффективный коэффициент Хилла около 3 по оси концентрации EGF и около 5 по доле занятых рецепторов (у Huang и Ferrell 1996 — 4–5 для ERK2 при входе Mos), без насыщения — около 1. Режимы «насыщены» и «не насыщены» — два учебных набора параметров (различаются и J, и отношения скоростей киназ и фосфатаз), а не эксперимент с изменением одного параметра. Ингибитор MEK в модели блокирует фосфорилирование ERK, не влияя на фосфорилирование MEK комплексом RAF; поэтому он назван обобщённо (например, PD0325901), а не траметиниб, который ослабляет и фосфорилирование MEK. Положительная связь при действии NGF в клетках PC12 задана через PKC (Santos 2007; изоформа в работе не указана). Ядерная ERK в вопросе 2п отстаёт от RAS на несколько минут и сглаживает импульсы короче 4 мин (Toettcher 2013); фосфорилирование STAT3 моделирует паракринную программу с порогом 75 мин непрерывной активности (в эксперименте — между 1 и 2 ч). Вход в вопросе 2п — SOScat без С-концевых сайтов ERK и RSK, поэтому петля через SOS на него не действует; действует петля через RAF-1. Ооцит в вопросе 3б — модель MAPK с положительной петлёй через стабилизацию и синтез Mos; при выключенной петле синтез Mos в ответ на прогестерон сохраняется (в экспериментах петлю прерывали циклогексимидом, а MAPK активировали введённым белком Mos — Ferrell 1999); 24 ооцита различаются чувствительностью, поэтому при промежуточной дозе часть из них включена. В модели меланомы вемурафениб подавляет мономер BRAF V600E на 99 %, а RAF-димеры — на 40 %. В вопросе 4 расчёт стационарный. Рассогласование ветвей при селективной резистентности задано разной чувствительностью ветвей к сигналу AKT (mTORC1 чувствительнее FOXO1). Это учебное допущение: в адипоцитах 3T3-L1 фосфорилирование FOXO1, напротив, чувствительнее к инсулину, чем фосфорилирование TSC2 и AS160 (Tan 2012), а по данным Titchenell 2016 продукция глюкозы печенью в значительной мере подавляется через жировую ткань. Сниженный IRS-2 в «загадке» соответствует данным Shimomura 2000. В вопросе 4 мРНК SREBP-1c (индукция; требует mTORC1, но не S6K — Li 2010) и ядерный созревший SREBP-1c (требует и S6K — Owen 2012) — разные выходы модели; FOXO1 показан долями в ядре и цитоплазме. Блот 4п разделён на общий лизат (контроль — актин), ядерную фракцию (контроль — ламин B) и ОТ-кПЦР (референсный транскрипт Rplp0); все величины рассчитаны моделью и условны. Рапамицин в модели действует без перестройки mTORC2: при длительном действии он в ряде клеток нарушает сборку mTORC2 и снижает p-AKT (Sarbassov 2006). В вопросе 2п c-Fos считывает длительность в два этапа: стабилизация (S362, S374; от DEF-мотива не зависит) и DEF-зависимое фосфорилирование T325/T331 (Murphy 2002); при замене DEF-мотива количество стабильного белка в модели принято неизменным, а активность AP-1 связана с формой pT325/pT331 (учебное допущение). Показания 2п разделены на выбранный момент и итоги всей программы.", "teacher_3": "Уточнения к распространённым схемам. Фосфорилирование SOS киназой RSK и фосфорилирование RAF-1 киназой ERK — отрицательные, а не положительные связи: они ослабляют вход каскада (Douville и Downward 1997; Saha 2012; Dougherty 2005). Фосфатазы DUSP не разрушают ERK, а дефосфорилируют её мотив TEY. In vitro MEK фосфорилирует ERK дистрибутивно — как правило, сначала по тирозину, затем по треонину (Ferrell и Bhatt 1997); в клетке фосфорилирование может быть квазипроцессивным (Aoki 2011). При селективной инсулинорезистентности в печени нарушено подавление глюконеогенеза инсулином, а стимуляция липогенеза сохранена, а не наоборот (Brown и Goldstein 2008). AKT фосфорилирует AMPKα1 по S487 у человека (S485 у крысы); α2 почти не фосфорилируется AKT (Hawley 2014). Оценки усиления ERK различаются в зависимости от того, какую величину измеряют: в 500–1000 раз по удельной активности (Robbins 1993) и примерно в 50 000 раз по kcat (Prowse и Lew 2001). Фосфорилирование IRS1 по Ser307 в культуре клеток связано с ослаблением сигнала, но у мышей с заменой Ser307 на аланин инсулинорезистентность тяжелее (Copps 2010).", "src_01": "Lavoie H. et al. ERK signalling: a master regulator of cell behaviour, life and fate. Nat Rev Mol Cell Biol. 2020. doi:10.1038/s41580-020-0255-7", "src_02": "Martin-Vega A. et al. Navigating the ERK1/2 MAPK Cascade. Biomolecules. 2023. doi:10.3390/biom13101555", "src_03": "Huang C. Y. et al. Ultrasensitivity in the mitogen-activated protein kinase cascade. Proc Natl Acad Sci U S A. 1996. doi:10.1073/pnas.93.19.10078", "src_04": "Goldbeter A. et al. An amplified sensitivity arising from covalent modification in biological systems. Proc Natl Acad Sci U S A. 1981. doi:10.1073/pnas.78.11.6840", "src_05": "Ferrell J. E. et al. Mechanistic studies of the dual phosphorylation of mitogen-activated protein kinase. J Biol Chem. 1997. doi:10.1074/jbc.272.30.19008", "src_06": "Aoki K. et al. Processive phosphorylation of ERK MAP kinase in mammalian cells. Proc Natl Acad Sci U S A. 2011. doi:10.1073/pnas.1104030108", "src_07": "Fujioka A. et al. Dynamics of the Ras/ERK MAPK cascade as monitored by fluorescent probes. J Biol Chem. 2006. doi:10.1074/jbc.M509344200", "src_08": "Robbins D. J. et al. Regulation and properties of extracellular signal-regulated protein kinases 1 and 2 in vitro. J Biol Chem. 1993. PMID: 8444886", "src_09": "Prowse C. N. et al. Mechanism of activation of ERK2 by dual phosphorylation. J Biol Chem. 2001. doi:10.1074/jbc.M008137200", "src_10": "Canon J. et al. The clinical KRAS(G12C) inhibitor AMG 510 drives anti-tumour immunity. Nature. 2019. doi:10.1038/s41586-019-1694-1", "src_11": "Traverse S. et al. Sustained activation of the mitogen-activated protein (MAP) kinase cascade may be required for differentiation of PC12 cells. Comparison of the effects of nerve growth factor and epidermal growth factor. Biochem J. 1992. doi:10.1042/bj2880351", "src_12": "Traverse S. et al. EGF triggers neuronal differentiation of PC12 cells that overexpress the EGF receptor. Curr Biol. 1994. doi:10.1016/s0960-9822(00)00154-8", "src_13": "Murphy L. O. et al. Molecular interpretation of ERK signal duration by immediate early gene products. Nat Cell Biol. 2002. doi:10.1038/ncb822", "src_14": "Toettcher J. E. et al. Using optogenetics to interrogate the dynamic control of signal transmission by the Ras/Erk module. Cell. 2013. doi:10.1016/j.cell.2013.11.004", "src_15": "Santos S. D. et al. Growth factor-induced MAPK network topology shapes Erk response determining PC-12 cell fate. Nat Cell Biol. 2007. doi:10.1038/ncb1543", "src_16": "Douville E. et al. EGF induced SOS phosphorylation in PC12 cells involves P90 RSK-2. Oncogene. 1997. doi:10.1038/sj.onc.1201214", "src_17": "Saha M. et al. RSK phosphorylates SOS1 creating 14-3-3-docking sites and negatively regulating MAPK activation. Biochem J. 2012. doi:10.1042/BJ20120938", "src_18": "Dougherty M. K. et al. Regulation of Raf-1 by direct feedback phosphorylation. Mol Cell. 2005. doi:10.1016/j.molcel.2004.11.055", "src_19": "Lito P. et al. Relief of profound feedback inhibition of mitogenic signaling by RAF inhibitors attenuates their activity in BRAFV600E melanomas. Cancer Cell. 2012. doi:10.1016/j.ccr.2012.10.009", "src_20": "Ferrell J. E. et al. The biochemical basis of an all-or-none cell fate switch in Xenopus oocytes. Science. 1998. doi:10.1126/science.280.5365.895", "src_21": "Xiong W. et al. A positive-feedback-based bistable 'memory module' that governs a cell fate decision. Nature. 2003. doi:10.1038/nature02089", "src_22": "Manning B. D. et al. AKT/PKB Signaling: Navigating the Network. Cell. 2017. doi:10.1016/j.cell.2017.04.001", "src_23": "Burchfield J. G. et al. The insulin signalling network. Nat Metab. 2025. doi:10.1038/s42255-025-01349-z", "src_24": "Inoki K. et al. TSC2 mediates cellular energy response to control cell growth and survival. Cell. 2003. doi:10.1016/s0092-8674(03)00929-2", "src_25": "Gwinn D. M. et al. AMPK phosphorylation of raptor mediates a metabolic checkpoint. Mol Cell. 2008. doi:10.1016/j.molcel.2008.03.003", "src_26": "Hawley S. A. et al. Phosphorylation by Akt within the ST loop of AMPK-α1 down-regulates its activation in tumour cells. Biochem J. 2014. doi:10.1042/BJ20131344", "src_27": "Tremblay F. et al. Amino acid and insulin signaling via the mTOR/p70 S6 kinase pathway. A negative feedback mechanism leading to insulin resistance in skeletal muscle cells. J Biol Chem. 2001. doi:10.1074/jbc.M106703200", "src_28": "Harrington L. S. et al. The TSC1-2 tumor suppressor controls insulin-PI3K signaling via regulation of IRS proteins. J Cell Biol. 2004. doi:10.1083/jcb.200403069", "src_29": "Copps K. D. et al. Irs1 serine 307 promotes insulin sensitivity in mice. Cell Metab. 2010. doi:10.1016/j.cmet.2009.11.003", "src_30": "Hopkins B. D. et al. Suppression of insulin feedback enhances the efficacy of PI3K inhibitors. Nature. 2018. doi:10.1038/s41586-018-0343-4", "src_31": "Li S. et al. Bifurcation of insulin signaling pathway in rat liver: mTORC1 required for stimulation of lipogenesis, but not inhibition of gluconeogenesis. Proc Natl Acad Sci U S A. 2010. doi:10.1073/pnas.0914798107", "src_32": "Brown M. S. et al. Selective versus total insulin resistance: a pathogenic paradox. Cell Metab. 2008. doi:10.1016/j.cmet.2007.12.009", "src_33": "Shimomura I. et al. Decreased IRS-2 and increased SREBP-1c lead to mixed insulin resistance and sensitivity in livers of lipodystrophic and ob/ob mice. Mol Cell. 2000. PMID: 10949029", "src_34": "Biddinger S. B. et al. Hepatic insulin resistance is sufficient to produce dyslipidemia and susceptibility to atherosclerosis. Cell Metab. 2008. doi:10.1016/j.cmet.2007.11.013", "src_35": "Titchenell P. M. et al. Direct hepatocyte insulin signaling is required for lipogenesis but is dispensable for the suppression of glucose production. Cell Metab. 2016. doi:10.1016/j.cmet.2016.04.022", "src_36": "Tan S. X. et al. Amplification and demultiplexing in insulin-regulated Akt protein kinase pathway in adipocytes. J Biol Chem. 2012. doi:10.1074/jbc.M111.318238", "src_37": "Ferrell J. E. Building a cellular switch: more lessons from a good egg. Bioessays. 1999. doi:10.1002/(SICI)1521-1878(199910)21:10<866::AID-BIES9>3.0.CO;2-1", "src_38": "Michael M. D. et al. Loss of insulin signaling in hepatocytes leads to severe insulin resistance and progressive hepatic dysfunction. Mol Cell. 2000. PMID: 10949030", "zoom_in": "Увеличить схему", "zoom_out": "Уменьшить схему", "zoom_area": "Увеличенная схема: прокрутите её пальцем или клавишами со стрелками"};

/* ---------- график ---------- */
function plotLines(cv, series, o){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 380, Hh = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pl = 34, pr = 10, pt = 10, pb = 24, w = W - pl - pr, h = Hh - pt - pb, X = x => pl + x / o.xmax * w, Y = y => pt + (1 - clamp(y, 0, o.ymax) / o.ymax) * h;
  c.font = '12px ' + cssVar('--f-mono'); c.fillStyle = cssVar('--muted'); c.strokeStyle = cssVar('--line'); c.lineWidth = 1;
  for (let i = 0; i <= o.xmax; i += o.xstep){ c.beginPath(); c.moveTo(X(i), pt); c.lineTo(X(i), pt + h); c.stroke();
    const last = i + o.xstep > o.xmax; c.textAlign = last ? 'right' : 'center'; c.fillText(last ? i + ' ' + o.xunit : String(i), X(i), Hh - 7); }
  c.textAlign = 'left';
  (o.yticks || [0, .5, 1]).forEach(v => { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(pl + w, Y(v)); c.stroke(); c.fillText(fmt(v, 1), 3, Y(v) + 4); });
  c.setLineDash([5, 4]); c.strokeStyle = cssVar('--ink');
  (o.marks || []).forEach(m => { c.beginPath(); c.moveTo(X(m), pt); c.lineTo(X(m), pt + h); c.stroke(); });
  c.setLineDash([]); c.fillStyle = cssVar('--ink'); c.font = '11.5px ' + cssVar('--f-body'); c.textAlign = 'left';
  (o.markLabels || []).forEach(([m, lab]) => c.fillText(lab, X(m) + 4, pt + 11));
  c.setLineDash([5, 4]);
  series.forEach(s => { c.strokeStyle = cssVar(s.color); c.lineWidth = s.w || 2.6; c.setLineDash(s.dash || []); c.lineCap = 'round'; c.beginPath();
    s.data.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); });
  c.setLineDash([]);
  if (o.cursor != null){ c.strokeStyle = cssVar('--on'); c.lineWidth = 2; c.beginPath(); c.moveTo(X(o.cursor), pt); c.lineTo(X(o.cursor), pt + h); c.stroke(); }
}

/* ---------- сценарий «предскажи — посмотри — объясни» ---------- */
const POE = { on: false, i: 0, pick: null, shown: false, res: {} };
/* студенческий вариант страницы: прогноз обязателен, на неверный ответ — своё объяснение (build.py собирает оба варианта) */
const STUDENT = /*__STUDENT__*/true;
/* постоянная перестановка вариантов: верный ответ стоит на разных местах, но всегда на одном и том же
   (преподаватель знает, где он). perm[место на экране] = номер варианта в таблице текстов */
function poePerm(key, i, n, ok){
  if (POE_RND) return poeShuffle(n, key + '/' + i + '/' + POE_SEED);
  let h = 2166136261; for (const c of key + '/' + i + '/' + POE_SALT) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const perm = [...Array(n).keys()].filter(j => j !== ok); perm.splice(h % n, 0, ok); return perm;
}
const POE_SALT = 'v21';
/* Случайный порядок (решение автора 10.10.2026): на сайте у студентов порядок шагов сценария и порядок вариантов ответа
   меняются при каждом открытии страницы — запоминать нужно ответ, а не «1 Б». В пределах одного открытия порядок постоянный.
   Страница преподавателя и локальный файл (file://) — в постоянном порядке, как в гиде; ?shuffle включает перетасовку
   локально, ?fixed выключает, ?seed=… задаёт порядок (для проверки). Итоговые задачи (POE_KEEP: сколько последних шагов
   сцены) остаются на своих местах; шаг с флагом last: true — тоже. Цепочки шагов (POE_CHAIN) не разрываются. */
const POE_URL = new URLSearchParams(location.search);
const POE_RND = STUDENT && !POE_URL.has('fixed') && (/^https?:$/.test(location.protocol) || POE_URL.has('shuffle'));
const POE_SEED = POE_RND ? (POE_URL.get('seed') || String(Math.floor(Math.random() * 1e9))) : '';
/* В новом семинаре итоговые шаги и цепочки отмечаются у самих шагов сцены: { last: true } и { chain: true }.
   POE_KEEP / POE_CHAIN — для правки уже опубликованных страниц без изменения кода сцен. */
const POE_KEEP = {};
const POE_CHAIN = {};
function poeShuffle(n, key){
  let h = 2166136261; for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let x = Math.imul(h ^ (h >>> 15), 1 | h); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a;
}
/* номер шага в таблице текстов для места i на экране. Перемешиваются «звенья»: отдельный шаг или цепочка шагов,
   которые опираются друг на друга (POE_CHAIN: номера шагов с 1; у шага флаг chain: true — идёт сразу за предыдущим). */
function poeKeep(K){ const P = SCENES[K].poe; let k = 0; while (k < P.length && P[P.length - 1 - k].last) k++; return Math.max(k, POE_KEEP[K] || 0); }
function poeUnits(K){
  const P = SCENES[K].poe, m = P.length - poeKeep(K), own = {};
  (POE_CHAIN[K] || []).forEach(c => { const z = c.map(x => x - 1).filter(x => x < m); z.forEach(x => { own[x] = z; }); });
  const units = [];
  for (let i = 0; i < m; i++){
    if (own[i]){ if (own[i][0] === i) units.push(own[i].slice()); continue; }
    if (P[i].chain && units.length) units[units.length - 1].push(i); else units.push([i]);
  }
  return units;
}
function poeIdx(i, K = cur){
  if (!POE_RND) return i;
  const n = SCENES[K].poe.length, keep = poeKeep(K); if (i >= n - keep) return i;
  const units = poeUnits(K), ord = poeShuffle(units.length, K + '/steps/' + POE_SEED);
  return [].concat(...ord.map(u => units[u]))[i];
}
function poeRender(){
  Object.keys(SCENES).forEach(k => { const b = $('poe' + k); b.hidden = true; b.innerHTML = ''; });
  const capOn = !$('capT') || $('capT').checked;
  document.querySelectorAll('.cap,.take').forEach(c => c.hidden = !capOn);
  if (!POE.on) return;
  /* пока студенты думают, подпись и вывод скрыты: они могли бы подсказать ответ */
  if (!POE.shown){ $('capbox' + cur).hidden = true; $('take' + cur).parentElement.hidden = true; }
  const S = SCENES[cur], box = $('poe' + cur), steps = S.poe, si = poeIdx(POE.i), st = steps[si], P = `p${cur}_${si + 1}`;
  box.hidden = false;
  const letters = ['А', 'Б', 'В', 'Г'];
  let h = `<div class="k">${t('poe_step', { i: POE.i + 1, n: steps.length })}</div><div class="q">${t(P + '_q')}</div><div class="opts">`;
  const perm = poePerm(cur, si, st.n, st.ok);
  for (let d = 0; d < st.n; d++){
    const j = perm[d];
    let cls = 'opt';
    if (POE.pick === j) cls += ' picked';
    if (POE.shown && j === st.ok) cls += ' right';
    if (POE.shown && POE.pick === j && j !== st.ok) cls += ' wrongpick';
    h += `<button class="${cls}" data-j="${j}"${STUDENT && POE.shown ? ' disabled' : ''}><span class="L">${letters[d]}</span><span>${t(P + '_o' + (j + 1))}</span></button>`;
  }
  h += `</div>`;
  if (POE.shown && STUDENT && POE.pick != null && POE.pick !== st.ok) h += `<p class="ex wrongex"><b>${t('poe_your')}</b> ${t(P + '_w' + (POE.pick + 1))}</p>`;
  if (POE.shown) h += `<p class="ex"><b>${t('poe_ans')}</b> ${t(P + '_e')}</p>`;
  const last = POE.i === steps.length - 1, needPick = STUDENT && POE.pick == null;
  const done = Object.keys(POE.res).filter(k => k.startsWith(cur + ':')), right = done.filter(k => POE.res[k]).length;
  h += `<div class="nav">` + (POE.shown ? '' : `<button class="btn" id="poeShow"${needPick ? ' disabled' : ''}>${t('poe_show')}</button>`) +
    (POE.i > 0 ? `<button class="btn ghost" id="poePrev">${t('poe_prev')}</button>` : '') +
    (!last ? ((STUDENT && !POE.shown && !((cur + ':' + POE.i) in POE.res)) ? '' : `<button class="btn ghost" id="poeNext">${t('poe_next')}</button>`)
           : `<span class="small" style="align-self:center">${t('poe_end')}${STUDENT && POE.shown ? ' ' + t('poe_score', { c: right, n: steps.length }) : ''}</span>`) +
    `<button class="btn ghost" id="poeExit">${t('poe_exit')}</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (STUDENT && POE.shown) return; POE.pick = +b.dataset.j; poeRender(); });
  if (needPick && !POE.shown) box.querySelector('.nav').insertAdjacentHTML('beforeend', `<span class="small" style="align-self:center">${t('poe_pick_first')}</span>`);
  if ($('poeShow')) $('poeShow').onclick = () => { if (STUDENT && POE.pick == null) return; POE.shown = true;
    const key = cur + ':' + POE.i; if (!(key in POE.res)) POE.res[key] = POE.pick === st.ok; st.apply(); S.update(); poeRender(); };
  if ($('poePrev')) $('poePrev').onclick = () => { POE.i--; POE.pick = null; POE.shown = false; poeSetup(); };
  if ($('poeNext')) $('poeNext').onclick = () => { POE.i++; POE.pick = null; POE.shown = false; poeSetup(); };
  $('poeExit').onclick = () => { POE.on = false; poeRender(); };
  box.scrollIntoView({ block: 'nearest' });
}
function poeSetup(){ const st = SCENES[cur].poe[poeIdx(POE.i)]; if (st.pre) { st.pre(); SCENES[cur].update(); } poeRender(); }

/* ---------- навигация ---------- */
let cur = '1b', qn = 1, lvl = 'b';
function show(){
  cur = qn + lvl;
  Object.keys(SCENES).forEach(k => { $('sc' + k).hidden = k !== cur; });
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.q === qn)));
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lvl)));
  $('qline').textContent = t('q' + qn);
  /* ссылки на страницу объяснений seminar-N-route.html: общая и к текущему вопросу (первый шаг его раздела).
     Адрес — ключ route_url, id шагов-входов разделов — ключ route_entries (через пробел); без route_url кнопок нет. */
  if (TEXTS.route_url){
    const ent = String(TEXTS.route_entries || '').split(/\s+/).filter(Boolean);
    $('routeAll').href = TEXTS.route_url + '#home';
    $('routeQ').hidden = !ent[qn - 1];
    if (ent[qn - 1]){ $('routeQ').href = TEXTS.route_url + '#' + ent[qn - 1]; $('routeQ').textContent = t('route_q') + ' ' + qn; }
  }
  POE.on = false; poeRender();
  SCENES[cur].update();
  fitStage();
}
/* возврат со страницы объяснений по ссылке seminar-N.html#q1…#q4 открывает нужный вопрос */
function fromHash(){ const m = /^#q([1-4])$/.exec(location.hash); if (m && +m[1] !== qn){ qn = +m[1]; show(); } }
/* схема и правая колонка помещаются в окно целиком (проектор 1280×720, 1366×768) */
function fitStage(){
  const sc = $('scenes'); if (!sc) return;
  const top = sc.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--avail', Math.max(340, Math.floor(window.innerHeight - top - 10)) + 'px');
}
function initNav(){
  $('tabs').innerHTML = [1, 2, 3, 4].map(n => `<button class="tab" role="tab" data-q="${n}"><span class="n">${n}</span><span>${t('tab' + n)}</span></button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { qn = +b.dataset.q; show(); });
  document.querySelectorAll('#levelSeg button').forEach(b => b.onclick = () => { lvl = b.dataset.l; show(); });

    kM: 2.5, kMp: 1.0, KR: 0.3,                       // MEK: фосфорилирование активной RAF, дефосфорилирование

/* Стационарный каскад для вопроса 1б: на каждом уровне киназа и фосфатаза модифицируют общий субстрат.
   Доля активной формы — функция Голдбетера — Кошланда (1981): J — Km фермента, делённая на концентрацию
   субстрата. J ≫ 1 — ферменты не насыщены (ответ уровня гиперболический); J ≪ 1 — насыщены (переключение
   нулевого порядка). Концентрации — HeLa, Fujioka 2006 (мкМ): RAS 0,4; RAF 0,013; MEK 1,4; ERK 0,96. */

  const CONC = { ras: 0.4, raf: 0.013, mek: 1.4, erk: 0.96 };

    const g = G[!!sat], J = g.J;

    const raf = gk(g.raf * ras, 1, J, J);
    const mek = gk(g.mek * raf, 1, J, J);
    const erk = gk(g.erk * mek, 1, J, J);

/* =====================================================================
   Вопрос 3. Положительная и отрицательная обратная связь в адаптации к сигналу
   3b — базовый: ооцит Xenopus, петля Mos ← MAPK (положительная связь + нелинейность → бистабильность,
        гистерезис; популяция из 24 ооцитов). Учебная модель, параметры условные.
   3a — продвинутый: быстрая и медленная отрицательные петли ERK (фибробласты + EGF) и отскок ERK
        при ингибиторе RAF в меланоме BRAF V600E (Lito 2012). Модель каскада — общая (s0_engine.js).
   ===================================================================== */
const BIS = (() => {
  /* dA/dt = s·w + k1·A⁴/(K⁴ + A⁴) − A; A — активность MAPK (усл. ед.), s — прогестерон, w — чувствительность ооцита */
  const K4 = Math.pow(0.5, 4), KF = { none: 0, weak: 0.8, strong: 1.2 };
  const f = (A, s, k1) => s + k1 * A * A * A * A / (K4 + A * A * A * A) - A;
  function relax(A, s, k1, T = 120, dt = 0.02){ for (let t = 0; t < T; t += dt) A = Math.max(0, A + f(A, s, k1) * dt); return A; }
  /* стационарные состояния при данном s: все корни f(A) = 0 на [0, 2.2] */
  function roots(s, k1){ const r = []; let prev = f(0, s, k1); if (Math.abs(prev) < 1e-9) r.push(0);
    for (let A = 0.002; A < 2.2; A += 0.002){ const v = f(A, s, k1); if (prev * v < 0) r.push(A - 0.001); prev = v; } return r; }
  return { KF, f, relax, roots, SMAX: 0.6, HIGH: 0.6 };
})();

/* =====================================================================
   Вопрос 4. Перекрёстная регуляция в сети инсулин–PI3K–AKT–mTORC1–AMPK и селективная инсулинорезистентность
   4b — базовый: гепатоцит; инсулин и AMPK; ветви AKT (TSC2→mTORC1→S6K, SREBP-1c; FOXO1→PEPCK; GSK3)
   4a — продвинутый: печень в норме, LIRKO, избирательная резистентность (модель ob/ob); рапамицин, ингибитор PI3Kα;
        вестерн-блот и мРНК PEPCK; загадка
   Модель — стационарная, величины условные (0–1). Аминокислоты в среде есть.
   Допущение модели: ветви AKT различаются чувствительностью — для фосфорилирования FOXO1 нужен более сильный
   сигнал AKT, чем для mTORC1 (одно из обсуждаемых объяснений избирательной резистентности; механизм не установлен).
   ===================================================================== */
const NET = (() => {
  const P = { irsSel: 0.35, fb: 0.35, Km: 0.2, Kf: 0.6, nf: 4, Kp: 0.3, np: 1.5, aktAmpk: 0.35, ampkMt: 0.85 };
  function run({ ins = 1, ampk = 0, g = 'wt', drug = '0' }){
    const irsCap = g === 'sel' ? P.irsSel : 1, r = g === 'lirko' ? 0 : ins;
    let s6k = 0, akt = 0, ampkA = 0, irs = 1;
    for (let i = 0; i < 60; i++){            // петля S6K ⊣ IRS1: решение подбирается итерациями
      irs = irsCap * (1 - P.fb * s6k);
      akt = Hn(r * irs, P.Kp, P.np) * (drug === 'pi3k' ? 0.06 : 1);
      ampkA = ampk * (1 - P.aktAmpk * akt);   // AKT фосфорилирует AMPKα1 (S487) и ослабляет фосфорилирование T172
      s6k = Hn(akt, P.Km, 2) * (1 - P.ampkMt * ampkA) * (drug === 'rapa' ? 0.08 : 1);
    }
    const mt = Hn(akt, P.Km, 2) * (1 - P.ampkMt * ampkA);
    // индукция мРНК SREBP-1c требует mTORC1, но не S6K (Li 2010); протеолитическое созревание (ядерная форма) требует и S6K (Owen 2012)
    const srebp = mt * (drug === 'rapa' ? 0.12 : 1), srebpN = srebp * Hn(s6k, 0.3, 2);
    const pfoxo = Math.min(1, Hn(akt, P.Kf, P.nf));
    return { r, irs, akt, ampkA, mt: mt * (drug === 'rapa' ? 0.08 : 1), s6k, srebp, srebpN, pfoxo, pepck: 1 - 0.95 * pfoxo, gsk: Hn(akt, 0.25, 2) };
  }
  return { P, run };
})();

function insulinSet(K, m, o = {}){
  const p = K + '_', lirko = o.g === 'lirko';
  setOp(p + 'ins', o.ins > .02 ? 1 : 0);
  missing(p + 'insrW', lirko); setOp(p + 'insrX', lirko ? 1 : 0); setBoxState(K + '_insr', !lirko && o.ins > .1 ? 'on' : null);
  setEdge(p + 'e1', m.r); setBoxState(K + '_irs', m.r * m.irs > .15 ? 'on' : null); setOp(p + 'irsP', m.r > .1 ? 1 : 0);
  setEdge(p + 'e2', m.r * m.irs); setBoxState(K + '_pi3k', m.akt > .3 ? 'on' : null); setOp(p + 'drPW', o.drug === 'pi3k' ? 1 : 0);
  setEdge(p + 'e3', m.akt); setBoxState(K + '_akt', m.akt > .3 ? 'on' : null); setOp(p + 'aktP1', m.akt > .3 ? 1 : 0); setOp(p + 'aktP2', m.akt > .3 ? 1 : 0);
  const tscOn = !(m.akt > .3 && m.ampkA < .4);
  setEdge(p + 'eAT', m.akt); setOp(p + 'tscP', m.akt > .3 ? 1 : 0); setBoxState(K + '_tsc', tscOn ? 'on' : 'inh');
  setEdge(p + 'eTM', tscOn ? 1 : .15); setBoxState(K + '_rheb', tscOn ? null : 'on'); setEdge(p + 'eRM', tscOn ? .15 : 1);
  setBoxState(K + '_mt', m.mt > .5 ? 'on' : null); setOp(p + 'drRW', o.drug === 'rapa' ? 1 : 0);
  setEdge(p + 'eMS', m.mt); setBoxState(K + '_s6k', m.s6k > .5 ? 'on' : null); setOp(p + 's6kP', m.s6k > .5 ? 1 : 0);
  setEdge(p + 'fbIrs', m.s6k);
  setBoxState(K + '_ampk', m.ampkA > .3 ? 'on' : null); setOp(p + 'ampkP', m.ampkA > .3 ? 1 : 0);
  setEdge(p + 'eAA', m.akt * Math.min(1, (o.ampk || 0) * 2)); setEdge(p + 'eAmT', m.ampkA); setEdge(p + 'eAmM', m.ampkA);
  setEdge(p + 'eMSr', m.srebp); setBoxState(K + '_srb', m.srebp > .5 ? 'on' : null); setEdge(p + 'eSP', m.s6k);
  setEdge(p + 'eSrN', m.srebpN); setBoxState(K + '_fas', m.srebpN > .5 ? 'on' : null);
  setEdge(p + 'eAG', m.akt); setBoxState(K + '_gsk', m.gsk > .5 ? 'inh' : 'on'); setOp(p + 'gskP', m.gsk > .5 ? 1 : 0);
  setTxt(p + 'glyT', t(m.gsk > .5 ? 's4_gly_on' : 's4_gly_off'));
  /* FOXO1 — доли в цитоплазме (фосфорилирован) и в ядре; без порога «всё или ничего» */
  const fC = clamp(m.pfoxo), fN = 1 - fC;
  setOp(p + 'foxM', .2 + .8 * fC); setOp(p + 'foxNW', .2 + .8 * fN); setOp(p + 'foxP', fC > .15 ? 1 : 0);
  setBoxState(K + '_fox', 'inh'); setBoxState(K + '_foxn', fN > .15 ? 'on' : null);
  setTxt(p + 'foxCT', t('s4_fox_c', { v: pct(fC) })); setTxt(p + 'foxNT', t('s4_fox_n', { v: pct(fN) }));
  setEdge(p + 'eAF', m.akt); setBoxState(K + '_pep', m.pepck > .5 ? 'on' : null);
  setEdge(p + 'eFP', fN);
}

  function renderBlot(){
    const lab = k => `<div class="small" style="font-weight:700;margin:4px 0 2px">${t(k)}</div>`;
    const P = S.lanes.map(L => ({ h1: L.h1, h2: L.h2, v: L.vP })), N = S.lanes.map(L => ({ h1: L.h1, h2: L.h2, v: L.vN }));
    $('s4a_blot').innerHTML = !S.lanes.length ? blotHTML([], []) :
      lab('s4a_bl_tot') + blotHTML(['b4_akt', 'b4_fox', 'b4_s6k', 'b4_act'].map(x => t(x)), P) +
      lab('s4a_bl_nuc') + blotHTML(['b4_srebp', 'b4_lamin'].map(x => t(x)), N) +
      lab('s4a_bl_q') + qpcrHTML(['b4_pepck', 'b4_srebpm'].map(x => t(x)), S.lanes);
    $('s4a_key').innerHTML = S.lanes.map(L => `<span>${L.h1}: ${L.key}</span>`).join('');
  }
  function record(){
    const cd = cond(), m = NET.run({ ins: cd.ins, g: cd.g, drug: cd.drug });
    const gc = cd.hid ? '?' : ({ wt: '', lirko: 'LIRKO', sel: t('bl_sel') }[cd.g] + (cd.drug === 'rapa' ? t('bl_rapa') : cd.drug === 'pi3k' ? t('bl_pi3k') : '')) || '—';
    S.lanes.push({ h1: '#' + (++S.n), h2: gc, key: `${t('s4_ins_k')} ${pct(cd.ins)} % · ${cd.hid ? t('gt_x') : t(GEN.find(x => x[0] === cd.g)[1]) + ', ' + t(DRUG.find(x => x[0] === cd.drug)[1])}`,
      vP: [m.akt, m.pfoxo, m.s6k, .9], vN: [m.srebpN, .9], q: [m.pepck, m.srebp], v: [m.akt, m.pfoxo, m.s6k, .9, m.srebpN, .9, m.pepck, m.srebp] });
    if (S.lanes.length > 7) S.lanes.shift();
    renderBlot();
  }
  wire(['s4a_ins', 's4a_d'], update);
  wire(['s4a_g'], () => { if (segVal('s4a_g') === 'x') S.myst = ['lirko', 'sel', 'rapa'][Math.floor(Math.random() * 3)]; S.reveal = false; update(); });
  $('s4a_rev').onclick = () => { S.reveal = true; update(); };
  $('s4a_rec').onclick = record;
  $('s4a_clr').onclick = () => { S.lanes = []; S.n = 0; renderBlot(); };
  renderBlot();
  function st(o){
    const d = { ins: 1, g: 'wt', d: '0' }; Object.assign(d, o);
    setSlider('s4a_ins', d.ins); segSet('s4a_g', d.g); segSet('s4a_d', d.d); S.reveal = false;
    if (d.g === 'x') S.myst = d.myst;
  }
  const clear = () => { S.lanes = []; S.n = 0; renderBlot(); };
  const rec = () => { update(); record(); };
  SCENES[K] = { update, poe: [
    { n: 3, ok: 0, pre(){ clear(); st({ ins: 0 }); rec(); st({}); rec(); }, apply(){ st({ g: 'lirko' }); rec(); } },
    { n: 3, ok: 1, pre(){ clear(); st({}); rec(); }, apply(){ st({ g: 'sel' }); rec(); } },
    { n: 3, ok: 2, pre(){ clear(); st({}); rec(); }, apply(){ st({ d: 'rapa' }); rec(); } },
    { n: 3, ok: 1, pre(){ clear(); st({}); rec(); }, apply(){ st({ d: 'pi3k' }); rec(); } },
    { n: 3, ok: 0, pre(){ clear(); st({ ins: .3 }); rec(); }, apply(){ st({ ins: .3, d: 'rapa' }); rec(); } },
    { n: 3, ok: 2, last: true, pre(){ clear(); st({}); rec(); st({ g: 'x', myst: 'sel' }); rec(); }, apply(){ st({ g: 'x', myst: 'sel' }); S.reveal = true; update(); } },
  ] };
})();
