<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><p><a href="seminar-3.html">← Вернуться к семинару</a> · <a href="index.html">Все семинары</a></p><h1>Рецепция и молекулярные переключатели</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-receptor-equilibrium"><div class="eyebrow">β2-адренорецептор · шаг 1 из 28</div><h2>Как агонист смещает равновесие конформаций рецептора</h2><p class="lead">Опорная остановка 1 из 8 · связывание и активация: занятость рецептора лигандом и его активное состояние — разные величины; это начало маршрута. <a href="#ns-g-S3-T01">β2-адренорецептор</a> и без лиганда переходит между неактивным и активным состояниями. <a href="#ns-g-S3-T02">Агонист</a> не создаёт новую конформацию, а смещает равновесие в сторону активной.</p><ol class="mech"><li>Рецептор существует в равновесии неактивной и активной конформаций; без лиганда он чаще неактивен.</li><li>Агонист связывается в кармане между спиралями и повышает долю времени, которую рецептор проводит в активной конформации.</li><li><a href="#ns-g-S3-T03">Обратный агонист</a> смещает равновесие к неактивной конформации, антагонист сам равновесие не сдвигает.</li></ol><p>Связывание лиганда с рецептором — обратимая нековалентная реакция, которая не требует гидролиза ATP и не меняет ковалентной структуры белка. Важно, как описывать её следствие. Рецептор и без лиганда самопроизвольно переходит между неактивной и активной конформациями, поэтому у популяции рецепторов есть небольшая <a href="#ns-g-S3-T04">базальная активность</a> даже без агониста. Агонист связывается в кармане, образованном спиралями III, V, VI и VII, и смещает равновесие в пользу активной конформации, увеличивая долю времени в ней.</p><p>Из такого описания следуют три наблюдаемых факта, которые формула «лиганд включает рецептор» не объясняет. Во-первых, базальная активность без лиганда. Во-вторых, частичные агонисты: даже при насыщающей концентрации они смещают равновесие не полностью и дают меньший максимальный ответ, потому что у них ниже эффективность, а не сродство. В-третьих, обратные агонисты, которые смещают равновесие к неактивному состоянию сильнее, чем в отсутствие лиганда, и снижают активность ниже базальной.</p><p>Антагонист занимает тот же карман, но равновесие конформаций сам не сдвигает: он лишь препятствует связыванию агониста или обратного агониста. В опытах на клетках с выраженной базальной активностью β-рецепторов пропранолол проявляет свойства обратного агониста; клинически его действие в основном объясняется конкурентной блокадой β-рецепторов. Структурные работы показывают, что активная конформация — это не одно состояние, а набор близких по энергии конформаций, различающихся тем, с каким внутриклеточным партнёром они преимущественно связываются; этот факт понадобится при разборе десенситизации и смещённого агонизма.</p><p>Занятость рецепторов и ответ клетки — разные величины. Занятость — доля рецепторов, связанных с лигандом; она растёт с концентрацией по гиперболе c/(c + KD), а KD (концентрация, при которой занята половина рецепторов) характеризует сродство. Ответ измеряют на выходе цепи — по cAMP, активности PKA или тонусу, — а между рецептором и выходом лежат усиливающие ступени: один активный рецептор успевает перевести в GTP-форму много молекул Gαs. Поэтому половина максимального ответа достигается при занятости, намного меньшей половины. В модели практикума половина максимального расслабления гладкой мышцы достигается при концентрации около 0,03 KD, то есть при занятости около 3 %. Для половины максимального прироста cAMP и доли Gαs-GTP нужна занятость около 20 %, а для PKA — около 9 %: резерв зависит от выбранного выхода. Такое свойство клетки называют <a href="#ns-g-S3-T93">резервом рецепторов</a>: часть рецепторов можно выключить, а максимальный ответ почти не изменится.</p><p>Если число рецепторов уменьшить (необратимым антагонистом, интернализацией, снижением экспрессии), кривая «концентрация — ответ» сдвигается вправо: для того же ответа нужно больше агониста, то есть чувствительность снижена (EC50 растёт). Сродство при этом не изменилось: KD остался прежним, а EC50 и KD — разные величины, и совпадать они не обязаны. Максимальный ответ почти сохраняется, пока оставшихся рецепторов хватает на полный ответ; когда резерв исчерпан, снижается и максимум. Так резерв выявляют классическим способом — необратимо выключают долю рецепторов и следят за кривой; понятие эффективности агониста ввёл Stephenson 1956, а связь занятости с ответом при этом описывает операциональная модель Black и Leff 1983. Усиление между ступенями видно и в клетках: у α2C-адренорецептора в клетках CHO-K1 для половины максимума в тесте на связывание GTPγS (на мембранах тех же клеток) нужна занятость примерно в 20 раз больше, чем для половины максимального подавления cAMP в целых клетках (Umland 2001). Откройте вид «Занятость и ответ»: сначала выберите прогноз, затем сравните кривые.</p><p>На схеме доля рецепторов в активной конформации показана условным столбиком: это учебные величины, иллюстрирующие смещение равновесия, а не измеренные доли.</p><div class="note trap"><strong>Типичная ошибка</strong> Агонист «включает» рецептор, переводя его из выключенного состояния во включённое.<p class="trap-fix">Рецептор переходит между конформациями и без лиганда; агонист лишь смещает равновесие в пользу активной конформации. Поэтому существуют базальная активность, частичные и обратные агонисты.</p></div><div class="static-quiz"><h3>Частичный агонист добавили в насыщающей концентрации, так что он занял все рецепторы. Почему максимальный ответ ниже, чем у полного агониста?</h3><ol><li><b>А.</b> У частичного агониста ниже сродство к рецептору <i>(неверный вариант)</i><br><span class="expl">Сродство определяет, при какой концентрации агонист занимает рецепторы, но не высоту максимального ответа. При насыщении все рецепторы заняты независимо от сродства.</span></li><li><b>Б.</b> Он слабее смещает равновесие в сторону активной конформации <i>(верный вариант)</i><br><span class="expl">Частичный агонист имеет меньшую эффективность: даже заняв все рецепторы, он переводит в активную конформацию меньшую их долю, поэтому максимальный ответ ниже.</span></li><li><b>В.</b> Он смещает равновесие к неактивной конформации <i>(неверный вариант)</i><br><span class="expl">К неактивной конформации равновесие смещает обратный агонист, снижая активность ниже базальной. Частичный агонист повышает активность, но не до максимума.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-060614-033910">Weis W. I., Kobilka B. K. 2018. The Molecular Basis of G Protein-Coupled Receptor Activation. Annu Rev Biochem</a></li><li><a href="https://doi.org/10.1038/nature10361">Rasmussen S. G. F. et al. 2011. Crystal structure of the β2 adrenergic receptor-Gs protein complex. Nature</a></li><li><a href="https://doi.org/10.1111/j.1476-5381.1956.tb00006.x">Stephenson R. P. 1956. A modification of receptor theory. Br J Pharmacol Chemother</a></li><li><a href="https://doi.org/10.1098/rspb.1983.0093">Black J. W., Leff P. 1983. Operational models of pharmacological agonism. Proc R Soc Lond B Biol Sci</a></li><li><a href="https://doi.org/10.1016/s0014-2999(00)00909-2">Umland S. P. et al. 2001. Receptor reserve analysis of the human alpha2C-adrenoceptor using [35S]GTPgammaS and cAMP functional assays. Eur J Pharmacol</a></li></ul><p>Схема механизма и пороговые величины — по обзору Weis и Kobilka (2018) и структуре комплекса β2AR–Gs (Rasmussen 2011). Доли активной конформации на столбике — учебные, условные. Частичный, обратный агонист и антагонист — пример из фармакологии β-рецепторов. Вид «Занятость и ответ» — расчёт по модели практикума 1б (M1.basic): занятость c/(c + KD), ответ — доля максимального эффекта при занятости, умноженной на долю оставшихся рецепторов; это учебная модель, не измерение. Резерв рецепторов зависит от клетки и измеряемого ответа (Umland 2001, клетки CHO с α2C-адренорецептором).</p></details></article><article class="card print-unit" id="ns-gs-cycle"><div class="eyebrow">β2-адренорецептор · шаг 2 из 28</div><h2>Как рецептор активирует Gαs и чем ограничено время её активности</h2><p class="lead">Активный рецептор служит фактором обмена гуаниновых нуклеотидов для <a href="#ns-g-S3-T05">Gαs</a>. Время активного состояния Gαs ограничено её собственной <a href="#ns-g-S3-T07">ГТФазной активностью</a>.</p><ol class="mech"><li>Активный рецептор раскрывает нуклеотид-связывающий карман Gαs и ускоряет обмен GDP на GTP.</li><li>Gαs-GTP отделяется от βγ, связывается с аденилатциклазой и активирует синтез cAMP.</li><li>Субъединица αs за счёт собственной ГТФазной активности гидролизует GTP и возвращается в GDP-форму — передача сигнала прекращается.</li></ol><p>Гетеротримерный G-белок в покое несёт на α-субъединице GDP, связанный настолько прочно, что самопроизвольный обмен занимает минуты. Активный рецептор, связавшись с гетеротримером, раскрывает нуклеотид-связывающий карман и на несколько порядков ускоряет высвобождение GDP; его место занимает GTP, концентрация которого в цитозоле выше. Иначе говоря, рецептор служит фактором обмена гуаниновых нуклеотидов (GEF) для Gαs: он не переносит фосфат и не расходует ATP, а снижает кинетический барьер диссоциации GDP.</p><p>Связывание GTP приводит к диссоциации гетеротримера: Gαs-GTP отделяется от димера βγ, связывается с аденилатциклазой и активирует её. Это первый пример механизма, который в главе повторяется: состояние переключателя задаётся не самим переключателем, а белками, ускоряющими переходы между его состояниями. Тот же принцип «рецептор — это GEF» лежит в основе цикла малой ГТФазы RAS (вопрос 3), где фактором обмена служит SOS1.</p><p>Инактивация происходит на уровне самого G-белка: α-субъединица — это ГТФаза, она гидролизует связанный GTP и воссоединяется с βγ. Для Gs ускорение этого гидролиза классическими RGS-белками, как правило, не показано, поэтому время существования активного Gs задаётся прежде всего собственной ГТФазной активностью αs. <a href="#ns-g-S3-T08">Холерный токсин</a> ADP-рибозилирует в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляет этот гидролиз: Gαs остаётся в GTP-форме и активирует аденилатциклазу без всякого агониста.</p><p>Переключите состояния на схеме: видно, как рецептор ускоряет обмен, Gαs-GTP активирует аденилатциклазу, а гидролиз GTP возвращает систему в покой.</p><div class="note trap"><strong>Типичная ошибка</strong> Рецептор передаёт сигнал, фосфорилируя Gαs или перенося на неё фосфат.<p class="trap-fix">Рецептор не переносит фосфат: он ускоряет обмен GDP на GTP как фактор обмена гуаниновых нуклеотидов. Фосфат на Gαs не переносится: GTP поступает из цитозоля как целый нуклеотид.</p></div><div class="static-quiz"><h3>Клетки обработали холерным токсином без добавления агониста. Как изменится концентрация cAMP?</h3><ol><li><b>А.</b> Останется исходной: без агониста рецептор не активирует Gαs <i>(неверный вариант)</i><br><span class="expl">Токсин делает Gαs активной в обход рецептора: агонист для этого не нужен. Концентрация cAMP повышается.</span></li><li><b>Б.</b> Повысится и останется повышенной: Gαs остаётся в GTP-форме <i>(верный вариант)</i><br><span class="expl">Токсин подавляет гидролиз GTP на αs, поэтому Gαs-GTP накапливается и постоянно активирует аденилатциклазу без агониста.</span></li><li><b>В.</b> Кратковременно повысится, затем вернётся к исходному значению из-за гидролиза GTP <i>(неверный вариант)</i><br><span class="expl">Токсин подавляет именно гидролиз GTP. Поэтому повышенная концентрация cAMP сохраняется и к исходному значению не возвращается.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-060614-033910">Weis W. I., Kobilka B. K. 2018. The Molecular Basis of G Protein-Coupled Receptor Activation. Annu Rev Biochem</a></li><li><a href="https://doi.org/10.1038/nature10361">Rasmussen S. G. F. et al. 2011. Crystal structure of the β2 adrenergic receptor-Gs protein complex. Nature</a></li><li><a href="https://doi.org/10.1073/pnas.74.8.3307">Cassel D., Selinger Z. 1977. Mechanism of adenylate cyclase activation by cholera toxin: inhibition of GTP hydrolysis at the regulatory site. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1016/S0021-9258(20)88271-4">Freissmuth M., Gilman A. G. 1989. Mutations of Gs alpha designed to alter the reactivity of the protein with bacterial toxins. J Biol Chem</a></li></ul><p>Схема механизма — по Weis и Kobilka (2018) и структуре β2AR–Gs (Rasmussen 2011). Эффект холерного токсина — Cassel и Selinger (1977), мембраны эритроцитов индейки; остаток Arg187 короткой изоформы Gαs (Arg201 в длинной) — Freissmuth и Gilman (1989).</p></details></article><article class="card print-unit" id="ns-camp-pka"><div class="eyebrow">β2-адренорецептор · шаг 3 из 28</div><h2>Как баланс синтеза и гидролиза задаёт концентрацию cAMP и как cAMP активирует PKA</h2><p class="lead">Концентрация <a href="#ns-g-S3-T10">cAMP</a> определяется балансом синтеза аденилатциклазой и гидролиза <a href="#ns-g-S3-T11">фосфодиэстеразами</a>. cAMP освобождает каталитические субъединицы <a href="#ns-g-S3-T12">PKA</a>, снимая торможение регуляторными субъединицами.</p><ol class="mech"><li>Аденилатциклаза синтезирует cAMP из ATP, фосфодиэстеразы гидролизуют его до 5'-AMP.</li><li>Стационарная концентрация cAMP устанавливается, когда скорость синтеза равна скорости гидролиза.</li><li>cAMP связывается с регуляторными субъединицами PKA (по два участка на каждую) и освобождает каталитические.</li></ol><p>Концентрация cAMP в данном объёме меняется по уравнению баланса: скорость синтеза аденилатциклазой минус скорость гидролиза фосфодиэстеразами. Стационарная концентрация достигается, когда эти скорости равны. Отсюда два следствия, которые часто смешивают. Если после прекращения стимула синтез падает, концентрация снижается со скоростью гидролиза; если подавить фосфодиэстеразу при продолжающемся синтезе, концентрация растёт до нового стационарного значения. Поэтому <a href="#ns-g-S3-T13">форсколин</a> (прямой активатор аденилатциклазы) повышает концентрацию cAMP в обход рецептора, а <a href="#ns-g-S3-T14">ролипрам</a> (ингибитор PDE4) повышает её, замедляя гидролиз.</p><p>Меняйте на схеме положение ползунков синтеза и гидролиза: стационарная концентрация cAMP определяется их соотношением. Это объясняет, почему ингибитор фосфодиэстеразы продлевает ответ, не затрагивая рецептор, а β-блокатор действует на рецептор, не меняя скорость гидролиза cAMP. Два препарата меняют разные члены одного баланса.</p><p>Главный эффектор cAMP в этом пути — протеинкиназа A. В покое это тетрамер из двух регуляторных и двух каталитических субъединиц (R₂C₂); регуляторная субъединица закрывает у каталитической участок связывания субстрата. На каждой регуляторной субъединице есть два участка связывания cAMP. Связывание cAMP снимает торможение и освобождает каталитические субъединицы. Поскольку нужно занять несколько участков, зависимость активности PKA от концентрации cAMP круче простого гиперболического насыщения; так плавное изменение сигнала преобразуется в более резкий ответ.</p><p>У cAMP есть и мишени помимо PKA: например, каналы HCN проводящей системы сердца связывают cAMP напрямую. Но в разбираемом пути ответ опосредован PKA.</p><div class="note trap"><strong>Типичная ошибка</strong> Концентрацию cAMP определяют только фосфодиэстеразы, а не скорость синтеза.<p class="trap-fix">Концентрацию cAMP определяют обе скорости: и синтез аденилатциклазой, и гидролиз фосфодиэстеразами. После остановки синтеза именно скорость гидролиза определяет, как быстро концентрация вернётся к исходной.</p></div><div class="static-quiz"><h3>В клетках с постоянным синтезом cAMP добавили ролипрам (ингибитор PDE4). Как изменится стационарная концентрация cAMP?</h3><ol><li><b>А.</b> Повысится: при том же синтезе гидролиз замедлен <i>(верный вариант)</i><br><span class="expl">Ролипрам подавляет часть гидролиза, поэтому при том же синтезе стационарная концентрация cAMP устанавливается выше.</span></li><li><b>Б.</b> Снизится: ролипрам тормозит аденилатциклазу <i>(неверный вариант)</i><br><span class="expl">Ролипрам действует на фосфодиэстеразу, а не на циклазу: он замедляет удаление cAMP, а не синтез.</span></li><li><b>В.</b> Не изменится: концентрацию cAMP задаёт только синтез <i>(неверный вариант)</i><br><span class="expl">Концентрация cAMP определяется балансом синтеза и гидролиза. Подавляя гидролиз, ролипрам повышает её даже при неизменном синтезе.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1124/pharmrev.120.000086">Zaccolo M., Zerio A., Lobo M. J. 2021. Subcellular Organization of the cAMP Signaling Pathway. Pharmacol Rev</a></li><li><a href="https://doi.org/10.1073/pnas.78.6.3363">Seamon K. B. et al. 1981. Forskolin: unique diterpene activator of adenylate cyclase in membranes and in intact cells. Proc Natl Acad Sci U S A</a></li><li><a href="https://doi.org/10.1146/annurev-biochem-060614-033910">Weis W. I., Kobilka B. K. 2018. The Molecular Basis of G Protein-Coupled Receptor Activation. Annu Rev Biochem</a></li></ul><p>Уравнение баланса cAMP — §3.3 главы 3 и обзор Zaccolo (2021). Концентрация cAMP на схеме — расчёт по модели практикума (кратность относительно исходной концентрации). Форсколин — прямой активатор циклазы (Seamon 1981); ролипрам — избирательный ингибитор PDE4. Числовые доли фосфорилирования — учебные.</p></details></article><article class="card print-unit" id="ns-cell-context"><div class="eyebrow">β2-адренорецептор · шаг 4 из 28</div><h2>Почему один и тот же путь даёт разные ответы в разных клетках</h2><p class="lead">Опорная остановка 2 из 8 · контекст клетки: один и тот же сигнал рецептора даёт разный ответ в разных клетках из-за набора мишеней; продолжает остановку 1. Один путь Gs–cAMP–PKA даёт расслабление бронха, усиление работы сердца и липолиз. Направление ответа задаёт <a href="#ns-g-S3-T15">набор белков-эффекторов</a>, которые PKA фосфорилирует в данной клетке.</p><ol class="mech"><li>Путь от рецептора до PKA в этих клетках одинаков; различаются мишени PKA.</li><li>В кардиомиоците PKA фосфорилирует CaV1.2, фосфоламбан и тропонин I — сила сокращения и скорость расслабления растут.</li><li>В гладкой мышце бронха PKA несколькими путями снижает тонус: уменьшает активность MLCK (вклад этого механизма in vivo обсуждается) и повышает выход K⁺. В результате наступает расслабление. В адипоците PKA фосфорилирует липазу и перилипин — липолиз усиливается.</li></ol><p>Ответ клетки определяется не фактом активации рецептора, а тем, какие подтипы рецепторов в ней есть, с какими G-белками они сопряжены и какие эффекторы присутствуют. Расхождение ответов на адреналин возникает на двух уровнях. Первый — выбор G-белка: α1-рецепторы через Gq повышают концентрацию Ca²⁺, α2 через Gi снижают концентрацию cAMP, а β1 и β2 через Gs повышают её. Второй уровень — эффекторы клетки: β1 и β2 сопряжены с одним и тем же Gs (β2-рецептор кардиомиоцита может также сопрягаться с Gi; здесь рассматривается путь через Gs), и противоположный физиологический результат в сердце и бронхе задаётся тем, какие белки PKA фосфорилирует.</p><p>В кардиомиоците мишени PKA — белок Rad, тормозящий канал CaV1.2 (после фосфорилирования Rad вход Ca²⁺ через канал усиливается), фосфоламбан (снятие торможения SERCA2a ускоряет закачку Ca²⁺ в ретикулум) и тропонин I (расслабление ускоряется). В результате возрастают сила и скорость сокращения и ускоряется расслабление.</p><p>В гладкой мышце бронха PKA снижает сродство MLCK к Ca²⁺–кальмодулину, повышает активность K⁺-каналов (гиперполяризация уменьшает вход Ca²⁺) и тормозит образование IP₃. Суммарный результат — расслабление. Насколько велик вклад именно фосфорилирования MLCK in vivo, обсуждается: PKA действует на тонус несколькими путями. В адипоците PKA фосфорилирует гормон-чувствительную липазу и перилипин-1, открывая липазам доступ к липидной капле; в результате липолиз ускоряется. В гепатоците путь Gs–cAMP–PKA запускает глюкагон (адреналин действует здесь и через β2-рецепторы, и через α1-рецепторы с повышением концентрации Ca²⁺): PKA фосфорилирует и активирует киназу фосфорилазы, киназа фосфорилазы фосфорилирует и активирует гликогенфосфорилазу, и гликогенолиз ускоряется; одновременно фосфорилирование гликогенсинтазы тормозит синтез гликогена (Jiang и Zhang 2003; Roach 2012).</p><p>Заметим о подтипах рецепторов: в сердце человека преобладают β1-рецепторы (в предсердии примерно 70 % β1 и 30 % β2), а β2 составляет меньшую часть, но путь ниже рецептора тот же. В модели практикума всё выше PKA одинаково во всех трёх клетках — так выделена роль именно набора мишеней. На схеме значок P стоит только на белках, которые фосфорилирует PKA; образование IP₃ показано пунктирной рамкой как непрямое звено без значка P, а параллельные эффекты PKA сведены в общий итог.</p><div class="note trap"><strong>Типичная ошибка</strong> Расслабление бронха и усиление работы сердца противоположны, потому что в этих клетках работают разные G-белки.<p class="trap-fix">В обеих клетках β-рецепторы сопряжены с Gs, и в обеих растёт концентрация cAMP и активируется PKA. Противоположный ответ задан разными мишенями PKA, а не выбором G-белка (он различает пару α1/β2, но не β1/β2).</p></div><div class="static-quiz"><h3>В кардиомиоците и в гладкой мышце бронха β-стимуляция одинаково повышает концентрацию cAMP. Почему сокращение усиливается в одной клетке и ослабевает в другой?</h3><ol><li><b>А.</b> В бронхе рецептор сопряжён с Gi, а в сердце — с Gs <i>(неверный вариант)</i><br><span class="expl">В обеих клетках β-рецепторы сопряжены с Gs и повышают концентрацию cAMP. Разница не в G-белке.</span></li><li><b>Б.</b> PKA фосфорилирует в этих клетках разные белки <i>(верный вариант)</i><br><span class="expl">Путь до PKA одинаков, но набор белков-эффекторов разный, поэтому один посредник даёт противоположные физиологические ответы.</span></li><li><b>В.</b> В бронхе cAMP не активирует PKA <i>(неверный вариант)</i><br><span class="expl">cAMP активирует PKA и в бронхе; PKA снижает тонус бронха несколькими путями: уменьшает активность MLCK (вклад этого пути in vivo обсуждается) и повышает активность K⁺-каналов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.pupt.2012.05.007">Billington C. K. et al. 2013. cAMP regulation of airway smooth muscle function. Pulm Pharmacol Ther</a></li><li><a href="https://doi.org/10.1038/415198a">Bers D. M. 2002. Cardiac excitation-contraction coupling. Nature</a></li><li><a href="https://doi.org/10.1038/s41586-020-1947-z">Liu G. et al. 2020. Mechanism of adrenergic CaV1.2 stimulation revealed by proximity proteomics. Nature</a></li><li><a href="https://doi.org/10.1016/S0021-9258(19)69586-4">Conti M. A., Adelstein R. S. 1981. The relationship between calmodulin binding and phosphorylation of smooth muscle myosin kinase by the catalytic subunit of cAMP-dependent protein kinase. J Biol Chem</a></li><li><a href="https://doi.org/10.1172/JCI116969">Kume H. et al. 1994. β-adrenergic agonists regulate KCa channels in airway smooth muscle by cAMP-dependent and -independent mechanisms. J Clin Invest</a></li><li><a href="https://doi.org/10.1074/jbc.273.1.215">Anthonsen M. W. et al. 1998. Identification of novel phosphorylation sites in hormone-sensitive lipase that are phosphorylated in response to isoproterenol. J Biol Chem</a></li><li><a href="https://doi.org/10.1074/jbc.M109.068478">Granneman J. G. et al. 2009. Perilipin controls lipolysis by regulating the interactions of ABHD5 and adipose triglyceride lipase. J Biol Chem</a></li><li><a href="https://doi.org/10.1111/j.1476-5381.1988.tb11576.x">Michel M. C. et al. (Brodde O. E.) 1988. Selective regulation of β1- and β2-adrenoceptors in the human heart by chronic β-adrenoceptor antagonist treatment. Br J Pharmacol</a></li><li><a href="https://doi.org/10.1152/ajpendo.00492.2002">Jiang G., Zhang B. B. 2003. Glucagon and regulation of glucose metabolism. Am J Physiol Endocrinol Metab</a></li><li><a href="https://doi.org/10.1042/BJ20111416">Roach P. J. et al. 2012. Glycogen and its metabolism: some new developments and old themes. Biochem J</a></li></ul><p>Мишени PKA — по обзору Billington (2013) для гладкой мышцы (Conti и Adelstein 1981; Kume 1994) и Bers (2002) для кардиомиоцита (регуляция CaV1.2 через Rad — Liu 2020); липолиз — Anthonsen (1998), Granneman (2009). Доли β1/β2 в предсердии человека — Michel и Brodde (1988). Числа на схеме — из модели практикума (занятость 80 %). Гликогенолиз в гепатоците — обзоры Jiang и Zhang (2003), Roach и соавт. (2012).</p></details></article><article class="card print-unit" id="ns-compartments"><div class="eyebrow">β2-адренорецептор · шаг 5 из 28</div><h2>Почему место повышения концентрации cAMP важно так же, как её величина</h2><p class="lead">Повышение концентрации cAMP в клетке неоднородно: разные участки отвечают на один агонист по-разному. Размер области повышенной концентрации cAMP определяется балансом источника и стока; <a href="#ns-g-S3-T16">AKAP</a> удерживает PKA у определённых мишеней.</p><ol class="mech"><li>Источник cAMP — аденилатциклаза у рецептора; сток — фосфодиэстеразы, распределённые неравномерно.</li><li>Характерный размер области повышенной концентрации cAMP оценивается длиной диффузии λ = √(D/k).</li><li>Якорные белки AKAP удерживают PKA (а часто и PDE, и циклазу) у конкретного участка, поэтому при одной и той же средней концентрации cAMP фосфорилируются разные субстраты.</li></ol><p>Классическая схема «рецептор на поверхности → посредник в объёме цитозоля → мишени по всей клетке» описывает опыты на суспензиях, но не наблюдения на отдельной живой клетке. Локализованные биосенсоры показали, что повышение концентрации cAMP неоднородно: разные участки одной клетки отвечают на один агонист по-разному, а разные агонисты с одинаковым суммарным повышением концентрации cAMP дают разные функциональные ответы.</p><p>Локальную концентрацию посредника задаёт тройка «источник — диффузия — сток», а характерный размер области повышенной концентрации оценивается длиной диффузии λ = √(D/k): здесь D — коэффициент диффузии cAMP, k — константа скорости его гидролиза. Меняйте на схеме активность фосфодиэстераз: чем выше их активность, тем меньше размер микродомена. Это расчёт по формуле из врезки главы, а не экспериментальные данные; реальная клетка сложнее (буферирование cAMP, вязкость, физические барьеры).</p><p>Протеинкиназа A, главная мишень cAMP, не распределена в клетке свободно, а закреплена в определённом месте якорными белками семейства AKAP. Поэтому PKA, закреплённая на участке ретикулума с SERCA, и PKA, закреплённая на плазматической мембране, фосфорилируют разные субстраты при одной и той же средней концентрации cAMP. AKAP нередко удерживают рядом и аденилатциклазу, и фосфодиэстеразы, собирая локальный узел регуляции.</p><p>Активность рецептора к тому же не заканчивается на поверхности: β2-рецепторы остаются активными в ранней эндосоме и дают там отсроченный эндосомный компонент ответа cAMP (Irannejad 2013). Отдельный второй пик суммарной концентрации при этом не обязателен: вклад эндосомного синтеза зависит от клетки и условий. Интернализация переносит источник cAMP из одного компартмента в другой, а не просто прекращает сигнал. В модели десенситизации (шаг «Десенситизация») этот компонент не учтён.</p><div class="note trap"><strong>Типичная ошибка</strong> Концентрация cAMP одинакова во всех участках клетки, поэтому важен только суммарный уровень cAMP.<p class="trap-fix">Повышение концентрации cAMP неоднородно: его локальную концентрацию задают источник, диффузия и сток, а PKA закреплена в определённых местах якорными белками AKAP. Поэтому одинаковое суммарное повышение концентрации cAMP может иметь разные следствия в зависимости от того, где оно произошло.</p></div><div class="static-quiz"><h3>Что показывает оценка λ = √(D/k) для области повышенной концентрации cAMP?</h3><ol><li><b>А.</b> Чем активнее фосфодиэстеразы, тем меньше область повышенной концентрации cAMP <i>(верный вариант)</i><br><span class="expl">λ убывает с ростом k: при быстром гидролизе высокая концентрация cAMP сохраняется лишь вблизи источника, и микродомен сужается.</span></li><li><b>Б.</b> Чем активнее фосфодиэстеразы, тем больше область повышенной концентрации cAMP <i>(неверный вариант)</i><br><span class="expl">Наоборот: больший k означает более быстрый гидролиз, и область повышенной концентрации cAMP сужается.</span></li><li><b>В.</b> Размер области не зависит от активности фосфодиэстераз <i>(неверный вариант)</i><br><span class="expl">Зависит: λ = √(D/k) прямо связывает размер домена с константой скорости гидролиза k.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1124/pharmrev.120.000086">Zaccolo M., Zerio A., Lobo M. J. 2021. Subcellular Organization of the cAMP Signaling Pathway. Pharmacol Rev</a></li><li><a href="https://doi.org/10.1038/nature12000">Irannejad R. et al. 2013. Conformational biosensors reveal GPCR signalling from endosomes. Nature</a></li></ul><p>Неоднородность cAMP и роль AKAP — обзор Zaccolo (2021); сигнал из эндосомы — Irannejad (2013), клетки HEK293 с конформационными биосенсорами. Кривая λ = √(D/k) — иллюстрация уравнения (расчёт по формуле), D ≈ 40 мкм²/с по Zaccolo (2021); не экспериментальные данные.</p></details></article><article class="card print-unit" id="ns-desensitization"><div class="eyebrow">β2-адренорецептор · шаг 6 из 28</div><h2>Как ответ ослабевает при длительной стимуляции</h2><p class="lead">Опорная остановка 3 из 8 · сигнал и его прекращение: ответ ослабевает не только из-за удаления агониста, но и из-за изменений самого рецептора; продолжает остановку 2. При длительном действии агониста ответ рецептора ослабевает — это десенситизация. Её запускают <a href="#ns-g-S3-T17">GRK</a>, фосфорилирующие активный рецептор, и <a href="#ns-g-S3-T18">β-аррестин</a>, связывающийся с фосфорилированным рецептором.</p><ol class="mech"><li>GRK распознают активную конформацию рецептора и переносят фосфатные группы на его внутриклеточный хвост.</li><li>β-аррестин связывается с фосфорилированным рецептором и стерически препятствует связыванию G-белка: передача сигнала от этого рецептора через Gs блокируется.</li><li>β-аррестин направляет рецептор в эндосому (интернализация); дальше рецептор возвращается на поверхность или разрушается.</li></ol><p>Активную конформацию рецептора распознаёт не только G-белок, но и киназы GRK: они переносят фосфатные группы на остатки серина и треонина внутриклеточного хвоста рецептора. Субстратом этих киназ служит преимущественно рецептор в активной конформации, поэтому его фосфорилирование следует за активацией, а степень фосфорилирования пропорциональна интенсивности стимуляции. Так механизм выключения запускается тем же событием, что и сам сигнал.</p><p>Дальше нужно различать четыре события, которые в старых учебниках объединены в одно. Привлечение (рекрутирование) — β-аррестин связывается с фосфорилированным активным рецептором. Десенситизация — связанный β-аррестин стерически перекрывает поверхность, с которой взаимодействует G-белок, и передача через Gs от этого рецептора прекращается. Интернализация — β-аррестин связывается с компонентами клатринового аппарата и направляет рецептор в эндосому; его дальнейшая судьба (возврат на поверхность за минуты или деградация за часы) определяет, как быстро восстановится чувствительность. Каркасная функция — β-аррестин служит каркасным белком (скаффолдом), на котором собираются белки других сигнальных путей.</p><p>В клетках HEK293 с эндогенным β2-рецептором (Violin 2008, 37 °C, 1 мкМ изопротеренола) максимум cAMP достигается в первые десятки секунд, затем сигнал спадает за несколько минут; по модели авторов, половина активных рецепторов инактивируется примерно за 70 с (полувремя инактивации). Из GRK2, GRK3, GRK5 и GRK6 на этот процесс влиял только нокдаун GRK6. Числа на схеме — из модели практикума, откалиброванной по этим данным. В модели практикума к 10-й минуте cAMP составляет около ×1,8 от исходного (на пике — около ×9), а активность PKA — около 17 % (исходно около 6 %): ответ сильно ослаблен, но не исчез. Синтез cAMP в эндосомах в модели не учтён.</p><p>Из каркасной функции долго делали вывод, что β-аррестин запускает «вторую ветвь» сигнала, независимую от G-белков. Как общее правило это не подтвердилось: в клетках без функциональных Gα-белков β-аррестин обеспечивал интернализацию, но не активацию ERK (Grundmann 2018). Поэтому смещённый агонизм — обоснованная стратегия поиска лекарств, а не установленный клинический принцип.</p><div class="note trap"><strong>Типичная ошибка</strong> β-аррестин связывается с рецептором — значит, он запускает собственный сигнал без G-белка.<p class="trap-fix">Связывание β-аррестина — это прежде всего десенситизация и интернализация. Самостоятельный сигнал без G-белков как общее правило не подтверждён (Grundmann 2018): зависимость ответа от G-белков нужно проверять для каждого рецептора отдельно.</p></div><div class="static-quiz"><h3>В клетках с подавленным синтезом β-аррестина добавили изопротеренол в насыщающей концентрации. Как изменится спад сигнала cAMP по сравнению с обычными клетками?</h3><ol><li><b>А.</b> Спад станет быстрее: β-аррестин замедляет десенситизацию <i>(неверный вариант)</i><br><span class="expl">β-аррестин не замедляет, а обеспечивает десенситизацию. Без него она ослаблена, и спад идёт медленнее.</span></li><li><b>Б.</b> Спад исчезнет полностью: cAMP останется на пике <i>(неверный вариант)</i><br><span class="expl">Спад сохранится: PKA по-прежнему активирует PDE4 и ускоряет гидролиз cAMP. Без β-аррестина он лишь замедляется.</span></li><li><b>В.</b> Спад замедлится: рецептор дольше активирует Gs <i>(верный вариант)</i><br><span class="expl">Без β-аррестина фосфорилированный рецептор дольше активирует Gs, поэтому сигнал спадает медленнее, хотя активация PDE4 его всё же снижает.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1146/annurev-biochem-060614-033910">Weis W. I., Kobilka B. K. 2018. The Molecular Basis of G Protein-Coupled Receptor Activation. Annu Rev Biochem</a></li><li><a href="https://doi.org/10.1038/s41467-017-02661-3">Grundmann M. et al. 2018. Lack of beta-arrestin signaling in the absence of active G proteins. Nat Commun</a></li><li><a href="https://doi.org/10.1074/jbc.M707009200">Violin J. D. et al. 2008. β2-adrenergic receptor signaling and desensitization elucidated by quantitative modeling of real time cAMP dynamics. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/nature12000">Irannejad R. et al. 2013. Conformational biosensors reveal GPCR signalling from endosomes. Nature</a></li></ul><p>Четыре события β-аррестина — обзоры по GPCR (Weis 2018); проверка независимости от G-белков — Grundmann (2018), клетки HEK293 без функциональных Gα. Динамика cAMP — Violin (2008): HEK293 с эндогенным β2-рецептором (~100 фмоль/мг), сенсор ICUE2, 1 мкМ изопротеренол, 37 °C; нокдаун siRNA GRK2/3/5/6 (&gt;90 %) на фоне H-89 и β-аррестинов 1 и 2 (~75 %). Числа на схеме — модель практикума, откалиброванная по этим данным; доля рецепторов в эндосоме — учебная оценка (интернализацию Violin не измеряли). Эндосомный синтез cAMP в модели не учтён; в живых клетках интернализованный β2-рецептор может продолжать передачу сигнала (Irannejad 2013).</p></details></article><article class="card print-unit" id="ns-measure-camp"><div class="eyebrow">β2-адренорецептор · шаг 7 из 28</div><h2>Как измеряют cAMP в живой клетке</h2><p class="lead">Концентрацию cAMP в живой клетке измеряют <a href="#ns-g-S3-T19">FRET-сенсором</a> в реальном времени. Сенсор даёт отношение сигналов двух цветов, а не абсолютную концентрацию cAMP.</p><ol class="mech"><li>Домен связывания cAMP (из Epac) помещён между двумя флуоресцентными белками — CFP и YFP.</li><li>Без cAMP флуоресцентные белки сближены и эффективность переноса энергии (FRET) высока; связывание cAMP меняет конформацию, и FRET ослабевает.</li><li>Измеряют отношение сигналов CFP и YFP; максимум калибруют форсколином с IBMX, минимум — по отклику сенсора без связанного cAMP в проверенном протоколе калибровки; обычный исходный сигнал клетки нельзя автоматически считать этим минимумом.</li></ol><p>Чтобы следить за cAMP в живой клетке, в неё вводят белковый сенсор: домен связывания cAMP (чаще из белка Epac) помещают между двумя флуоресцентными белками — голубым CFP и жёлтым YFP. Когда флуоресцентные белки сближены, энергия возбуждения переносится с CFP на YFP (резонансный перенос, FRET), и в свечении преобладает жёлтый. Связывание cAMP меняет конформацию домена, флуоресцентные белки расходятся, эффективность переноса энергии снижается, и отношение сигналов двух цветов отражает концентрацию cAMP в реальном времени.</p><p>Важно, какую величину регистрирует метод. Сенсор измеряет отношение сигналов двух цветов. В одноцепочечном сенсоре оба флуоресцентных белка находятся в одной молекуле, поэтому отношение в идеале уменьшает влияние количества сенсора в клетке: общий множитель сокращается. От количества сенсора зависят яркость и шум измерения, а при высокой экспрессии сенсор буферирует cAMP и сам меняет ответ. Чтобы перевести отношение в концентрацию cAMP, нужны калибровка и кривая отклика: максимум задают форсколином вместе с ингибитором фосфодиэстераз IBMX (сенсор насыщен cAMP), минимум — по отклику сенсора без связанного cAMP в проверенном протоколе калибровки; обычный исходный сигнал клетки нельзя автоматически считать этим минимумом, а связь отношения с концентрацией определяют по кривой связывания cAMP сенсором in vitro. Так Violin и соавт. (2008) с сенсором ICUE2 оценили максимум cAMP при изопротереноле в клетках HEK293 примерно в 10 мкМ. Без калибровки результат приводят в относительных величинах.</p><p>У метода есть ограничения, о которых нужно помнить. Сенсор сам связывает cAMP и при высокой экспрессии буферирует его, тем самым несколько изменяя измеряемую величину. Сигнал из целой клетки усредняет микродомены, поэтому локальные различия (шаг о компартментализации) без адресной версии сенсора не видны. Наконец, сенсор на основе одного домена Epac не обладает кооперативностью PKA, поэтому его кривая отклика отличается от зависимости активности PKA от cAMP.</p><p>Этим методом и получены данные о коротком всплеске cAMP и о роли PDE4 и десенситизации, на которые опирается продвинутый уровень практикума.</p><div class="note trap"><strong>Типичная ошибка</strong> FRET-сенсор прямо показывает концентрацию cAMP в молях на литр.<p class="trap-fix">Сенсор даёт отношение сигналов двух цветов. В концентрацию cAMP его переводят только после калибровки: нужны проверенные минимальный и максимальный отклики и кривая связывания in vitro. Максимум получают при насыщении сенсора cAMP; минимум соответствует сенсору без связанного cAMP и требует отдельной проверки.</p></div><div class="static-quiz"><h3>Что нужно, чтобы перевести изменение сигнала FRET-сенсора в концентрацию cAMP?</h3><ol><li><b>А.</b> Калибровка: максимум и минимум сигнала и кривая связывания cAMP <i>(верный вариант)</i><br><span class="expl">Сенсор даёт отношение сигналов двух цветов: оно уменьшает влияние количества сенсора, но не выражено в единицах концентрации. Связывает его с концентрацией cAMP только калибровка (проверенные минимальный и максимальный отклики и кривая отклика сенсора in vitro).</span></li><li><b>Б.</b> Ничего: отношение сигналов уже выражено в микромолях <i>(неверный вариант)</i><br><span class="expl">Отношение сигналов уменьшает влияние количества сенсора, но само по себе не выражено в единицах концентрации: нужны калибровка и кривая отклика сенсора.</span></li><li><b>В.</b> Достаточно измерить яркость одного жёлтого белка <i>(неверный вариант)</i><br><span class="expl">Яркость одного белка зависит от его количества в клетке; метод опирается на отношение двух сигналов и на калибровку.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-3.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.C400302200">Nikolaev V. O. et al. 2004. Novel single chain cAMP sensors for receptor-induced signal propagation. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/nprot.2010.198">Börner S. et al. 2011. FRET measurements of intracellular cAMP concentrations and cAMP analog permeability in intact cells. Nat Protoc</a></li><li><a href="https://doi.org/10.1074/jbc.M707009200">Violin J. D. et al. 2008. β2-adrenergic receptor signaling and desensitization elucidated by quantitative modeling of real time cAMP dynamics. J Biol Chem</a></li></ul><p>Схема метода — одноцепочечные сенсоры на домене Epac (Nikolaev 2004); калибровка FRET-сенсоров cAMP — Börner (2011). Данные о динамике cAMP в HEK293 получены сенсором ICUE2 (фрагмент Epac1 между CFP и цитрином, 37 °C; максимум — 50 мкМ форсколина с 200 мкМ IBMX; изопротеренол 1 мкМ давал около половины максимального изменения отношения, 30 ± 2 % против 60 ± 2 %) — Violin (2008). Схема — устройство метода, а не конкретный опыт.</p></details></article><article class="card print-unit" id="ns-phospho-mark"><div class="eyebrow">Фосфорилирование · шаг 8 из 28</div><h2>Что фосфатная группа меняет в белке</h2><p class="lead">Опорная остановка 4 из 8 · фосфат и его следствия: присоединение фосфата — химическое событие, а изменение активности, партнёров, места или срока жизни белка — его следствия; продолжает остановку 3. <a href="#ns-g-S3-T20">Протеинкиназа</a> переносит фосфатную группу ATP на остаток серина, треонина или тирозина в белке, <a href="#ns-g-S3-T21">протеинфосфатаза</a> её отщепляет. Фосфат может изменить активность белка, его партнёров, место в клетке или время жизни — эти следствия нужно различать.</p><ol class="mech"><li>Киназа переносит γ-фосфат ATP на гидроксильную группу остатка; фосфатаза гидролизует фосфоэфирную связь.</li><li>Фосфат вносит отрицательный заряд и меняет конформацию белка или создаёт участок узнавания для другого белка.</li><li>Фосфорилирование одного и того же участка может активировать белок, тормозить его или менять только его связи — направление эффекта задаёт сам белок.</li></ol><p>Протеинкиназа переносит γ-фосфатную группу ATP на гидроксильную группу остатка серина, треонина или тирозина белка-субстрата, а протеинфосфатаза гидролизует образовавшуюся фосфоэфирную связь. Это две разные реакции с разными ферментами, а не прямая и обратная стадии одной реакции. Поэтому уровень фосфорилирования определяется парой ферментов, работающих одновременно. В геноме человека 518 генов протеинкиназ (Manning 2002), а в одной клеточной линии HeLa масс-спектрометрия выявила более 50 000 разных фосфопептидов (Sharma 2014).</p><p>Фосфатная группа при физиологическом pH несёт отрицательный заряд (около −1,5…−2), объёмна и образует несколько водородных связей. Рядом с каталитическим центром или в петле активации она меняет конформацию фермента и скорость катализа — в сторону активации или торможения. Например, у киназ семейства Src фосфорилирование петли активации повышает активность, а фосфорилирование тирозина на C-конце удерживает фермент в закрытой малоактивной форме.</p><p>Второй тип следствий — новые связи. Домены SH2 и PTB распознают фосфотирозин, а белки 14-3-3 — определённые фосфосериновые мотивы (Yaffe 1997). Белок при этом может не менять активности, но меняет партнёров, а значит — место в клетке. Третий и четвёртый типы — изменение локализации и времени жизни: фосфорилированный мотив может стать участком узнавания для убиквитин-лигазы, после чего белок расщепляется в протеасоме.</p><p>Переключите режимы схемы: на ней показаны четыре разных следствия одного и того же события — переноса фосфата.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилирование всегда активирует белок.<p class="trap-fix">Направление эффекта зависит от участка и белка: фосфат может активировать фермент, тормозить его или менять только партнёров, локализацию или время жизни белка. Фосфоламбан (следующие шаги) после фосфорилирования перестаёт тормозить насос.</p></div><div class="static-quiz"><h3>Белок фосфорилировали по серину в пробирке; сохранность фосфата подтверждена, а проба для проверки активности не содержала фосфатазы. Каталитическая активность белка не изменилась. Какой вывод обоснован?</h3><ol><li><b>А.</b> Этот участок не регулирует белок <i>(неверный вариант)</i><br><span class="expl">Активность — лишь одно из возможных следствий. Фосфосерин может создавать участок узнавания для другого белка (например, белка 14-3-3 при подходящей последовательности), менять локализацию или время жизни белка; это нужно проверять отдельно.</span></li><li><b>Б.</b> Фосфорилирование этого участка может менять партнёров, место или время жизни белка <i>(верный вариант)</i><br><span class="expl">Фосфат часто влияет не на катализ, а на связывание белка с партнёрами: фосфосериновые мотивы узнают белки 14-3-3, фосфорилированный мотив может стать участком узнавания убиквитин-лигазы. Домены SH2 и PTB, напротив, узнают фосфотирозин, а не фосфосерин. Если измеряют только каталитическую активность, такие эффекты не выявляются.</span></li><li><b>В.</b> Фосфат на этом участке сразу снимается фосфатазой <i>(неверный вариант)</i><br><span class="expl">Условие исключает это объяснение: сохранность фосфата подтверждена, а проба фосфатазы не содержит. Отсутствие изменения активности означает лишь, что в этом тесте активность не изменилась; это не значит, что фосфат потерян.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1075762">Manning G. et al. 2002. The protein kinase complement of the human genome. Science</a></li><li><a href="https://doi.org/10.1016/j.celrep.2014.07.036">Sharma K. et al. 2014. Ultradeep human phosphoproteome reveals a distinct regulatory nature of Tyr and Ser/Thr-based signaling. Cell Rep</a></li><li><a href="https://doi.org/10.1038/nrm2203">Ubersax J. A., Ferrell J. E. 2007. Mechanisms of specificity in protein phosphorylation. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1016/s0092-8674(00)80487-0">Yaffe M. B. et al. 1997. The structural basis for 14-3-3:phosphopeptide binding specificity. Cell</a></li></ul><p>Схема механизма. Число генов протеинкиназ — Manning 2002 (анализ генома человека); число фосфопептидов — Sharma 2014 (одна линия клеток HeLa, масс-спектрометрия); мотивы узнавания 14-3-3 — Yaffe 1997 (пептидные библиотеки, кристаллическая структура). Заряд фосфата зависит от pH и окружения.</p></details></article><article class="card print-unit" id="ns-kinase-phosphatase"><div class="eyebrow">Фосфорилирование · шаг 9 из 28</div><h2>Как пара киназа — фосфатаза задаёт уровень и скорость переключения</h2><p class="lead">Опорная остановка 5 из 8 · доля, поток и время: доля фосфорилированного белка зависит от отношения констант скорости (kк/kф), а время выхода на неё — от суммы этих констант; продолжает остановку 4. Доля фосфорилированного белка задаётся двумя одновременно работающими ферментами. Уровень зависит от отношения их активностей, а время выхода на него — от суммы.</p><ol class="mech"><li>Скорость фосфорилирования пропорциональна доле нефосфорилированного белка, скорость дефосфорилирования — доле фосфорилированного.</li><li><a href="#ns-g-S3-T24">Стационарная доля</a> p* = kк/(kк + kф) зависит только от отношения констант; на плато потоки kк(1 − p*) и kф·p* равны, а реакции продолжаются.</li><li><a href="#ns-g-S3-T25">Время релаксации</a> τ = 1/(kк + kф): за время τ доля проходит около 63 % пути к новому уровню; чем выше обе активности, тем короче τ.</li></ol><p>Представим 100 одинаковых молекул фосфоламбана. Киназа присоединяет фосфат к тем из них, которые его не несут, а фосфатаза отщепляет фосфат от тех, которые его несут; обе реакции идут одновременно и непрерывно. Пока фосфорилируется больше молекул, чем дефосфорилируется, доля фосфорилированных растёт. Когда число молекул, получающих фосфат за секунду, сравнивается с числом молекул, теряющих его, доля перестаёт меняться. Реакции при этом не прекращаются: одни молекулы фосфорилируются, другие дефосфорилируются, а доля в среднем остаётся постоянной. Постоянная доля означает равенство потоков, а не отсутствие реакций.</p><p>Рассмотрим один участок фосфорилирования. Киназа и фосфатаза работают одновременно и непрерывно. Если оба фермента далеки от насыщения субстратом, скорость фосфорилирования равна kк(1 − p), а скорость дефосфорилирования — kф·p, где p — доля фосфорилированных молекул, а kк и kф — <a href="#ns-g-S3-T26">эффективные константы скорости</a> первого порядка, в которые уже входят количество и активность фермента. Изменение доли описывается уравнением dp/dt = kк(1 − p) − kф·p. Эти два произведения — потоки vк и vф в долях пула в секунду.</p><p>Из уравнения следуют два вывода. Первый: стационарная доля p* = kк/(kк + kф) зависит от отношения констант, а в стационаре равны не константы, а потоки: kк(1 − p*) = kф·p*. Например, при kк = 0,03 с⁻¹ и kф = 0,01 с⁻¹ получаем p* = 0,75, и оба потока равны 0,0075 доли пула в секунду; константа фосфорилирования втрое больше, потому что она должна уравновесить втрое меньшую долю нефосфорилированных молекул. Одну и ту же долю можно получить, повысив активность киназы или понизив активность фосфатазы, поэтому рост фосфорилирования сам по себе не указывает на активацию киназы. Второй: доля выходит на новый уровень экспоненциально с характерным временем τ = 1/(kк + kф). За время τ она проходит около 63 % пути к новому уровню, за 3τ — около 95 %; τ — не время полного завершения. Если kк утроить с 0,01 до 0,03 с⁻¹ при kф = 0,04 с⁻¹, p* вырастет с 0,2 лишь до 0,43, а τ сократится с 20 до 14 с.</p><p>Высокая скорость оборота цикла фосфорилирования и дефосфорилирования позволяет получить быстрый ответ при том же стационарном уровне, но требует непрерывного расхода ATP, пропорционального потоку. Сравните две пары: kк = 0,01 и kф = 0,04 с⁻¹ либо kк = 0,05 и kф = 0,20 с⁻¹. Отношение у них одинаково (p* = 0,2), а сумма различается в пять раз (τ = 20 и 4 с). Одно и то же пробное воздействие — подавление киназы — делает различие видимым: во второй паре доля фосфорилированного белка снижается в пять раз быстрее. Если киназу подавить полностью, доля снижается с характерным временем 1/kф: так в клетке оценивают активность фосфатазы.</p><p>Начните с вида «Молекулы»: выберите число молекул и пару констант, меняйте время и сравнивайте число актов фосфорилирования и дефосфорилирования за последние 20 с. Затем перейдите к виду «Расчёт по формуле», меняйте kк и kф и следите за потоками. Расчёт выполнен по тем же формулам, что в практикуме.</p><div class="note trap"><strong>Типичная ошибка</strong> Время переключения задаёт фермент, который изменился.<p class="trap-fix">Время релаксации τ = 1/(kк + kф) зависит от обеих констант. Если снизить активность фосфатазы, доля вырастет, но новый уровень установится медленнее.</p></div><div class="static-quiz"><h3>В двух клетках доля фосфорилированного белка одинакова — 0,5. В первой kк = kф = 0,1 с⁻¹, во второй kк = kф = 0,01 с⁻¹. Чем различаются эти клетки?</h3><ol><li><b>А.</b> Первая быстрее выходит на новый уровень при смене сигнала <i>(верный вариант)</i><br><span class="expl">τ = 1/(kк + kф): в первой клетке 5 с, во второй 50 с. Уровень одинаков, а скорость ответа различается в десять раз.</span></li><li><b>Б.</b> Ничем: одинаковый уровень означает одинаковое поведение <i>(неверный вариант)</i><br><span class="expl">Стационарная доля зависит от отношения констант, а скорость переключения — от их суммы. При одинаковом отношении суммы здесь различаются в десять раз.</span></li><li><b>В.</b> Вторая быстрее отвечает, потому что тратит меньше ATP <i>(неверный вариант)</i><br><span class="expl">Меньший расход ATP во второй клетке связан как раз с низкими активностями ферментов, а они дают медленный ответ: τ = 50 с против 5 с.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC349147/">Goldbeter A., Koshland D. E. 1981. An amplified sensitivity arising from covalent modification in biological systems. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4214216/">Ferrell J. E., Ha S. H. 2014. Ultrasensitivity part I: Michaelian responses and zero-order ultrasensitivity. Trends Biochem Sci</a></li></ul><p>Расчёт по формулам главы 3 (§3.8; Goldbeter и Koshland 1981): закрытый пул субстрата, ферменты далеки от насыщения, концентрации ферментов и ATP постоянны. Константы kк и kф — учебные значения в с⁻¹; закачка Ca²⁺ рассчитана для учебной модели фосфоламбана (см. следующий шаг). Вид «Молекулы» — стохастическая учебная модель: на каждом шаге 0,05 с у каждой молекулы своя вероятность реакции (kк·0,05 или kф·0,05); траектории случайны, но воспроизводятся при каждом открытии.</p></details></article><article class="card print-unit" id="ns-phospholamban"><div class="eyebrow">Фосфорилирование · шаг 10 из 28</div><h2>Как фосфорилирование фосфоламбана ускоряет закачку Ca²⁺</h2><p class="lead"><a href="#ns-g-S3-T27">Фосфоламбан</a> тормозит кальциевый насос <a href="#ns-g-S3-T28">SERCA2a</a> кардиомиоцита, пока не фосфорилирован. PKA снимает торможение, фосфорилируя фосфоламбан по Ser16, а PP1, дефосфорилируя его, торможение восстанавливает.</p><ol class="mech"><li>Нефосфорилированный PLN снижает кажущееся сродство SERCA2a к Ca²⁺, и при субмикромолярной концентрации Ca²⁺ насос работает медленнее.</li><li>При β-адренергической стимуляции PKA фосфорилирует PLN по Ser16; торможение снимается, Ca²⁺ быстрее возвращается в СР.</li><li><a href="#ns-g-S3-T29">PP1</a> дефосфорилирует PLN, и после прекращения сигнала торможение восстанавливается.</li></ol><p>Фосфоламбан — небольшой белок мембраны саркоплазматического ретикулума (СР) кардиомиоцита. В нефосфорилированном состоянии он связывается с Ca²⁺-АТФазой SERCA2a и снижает её кажущееся сродство к Ca²⁺: в опытах с ферментом, экспрессированным в клетках насекомых, фосфоламбан повышал на 200 нМ концентрацию Ca²⁺, необходимую для половины максимальной активности, не меняя максимальной скорости (Mahaney 2000). Поэтому при той концентрации Ca²⁺, которая бывает в цитозоле во время спада Ca²⁺-транзиента, насос работает медленнее.</p><p>При стимуляции β-рецепторов PKA фосфорилирует фосфоламбан по Ser16, торможение снимается, Ca²⁺ быстрее закачивается в СР, и спад транзиента свободного Ca²⁺ ускоряется. PKA при этом фосфорилирует и другие белки, поэтому PLN — основной, но не единственный путь ускорения спада Ca²⁺. Механическое расслабление определяется не только скоростью спада свободного Ca²⁺: оно зависит и от отсоединения Ca²⁺ от тропонина C, и от кинетики поперечных мостиков. Фосфорилирование тропонина I меняет связывание Ca²⁺ с миофиламентами, а не откачивает Ca²⁺ из цитозоля (Briston 2014); в опытах на мышах главный вклад в ускорение нарастания давления и расслабления в целом организме давало фосфорилирование белка C, связывающего миозин (Gresham и Stelzer 2016). У кардиомиоцитов мышей без фосфоламбана спад Ca²⁺ быстрый уже в покое, а ответ на изопротеренол сохраняется, хотя и слабее, чем в норме (Wolska 1996).</p><p>Доля фосфорилированного фосфоламбана задаётся парой PKA — PP1 по правилу предыдущего шага. PP1 — главная фосфатаза фосфоламбана; при β-стимуляции PKA фосфорилирует белок ингибитор-1, и фосфорилированный ингибитор-1 подавляет PP1 (Kranias и Hajjar 2012). Сигнал, следовательно, одновременно ускоряет фосфорилирование и замедляет дефосфорилирование.</p><p>Переключите условия на схеме: учебная модель показывает долю фосфоламбана, фосфорилированного по Ser16, и время полуспада Ca²⁺-транзиента в норме, после пропранолола, у клеток с заменой S16A, без фосфоламбана и под действием ингибитора фосфатаз.</p><div class="note trap"><strong>Типичная ошибка</strong> Фосфорилированный фосфоламбан сам переносит Ca²⁺ в ретикулум.<p class="trap-fix">Насос SERCA2a переносит Ca²⁺ за счёт гидролиза ATP. Фосфоламбан — регуляторный белок: нефосфорилированный он тормозит насос, а фосфорилирование это торможение снимает.</p></div><div class="static-quiz"><h3>Каким образом фосфорилирование фосфоламбана по Ser16 ускоряет спад Ca²⁺-транзиента в кардиомиоците?</h3><ol><li><b>А.</b> Снимает торможение Ca²⁺-насоса SERCA2a <i>(верный вариант)</i><br><span class="expl">Нефосфорилированный фосфоламбан снижает кажущееся сродство SERCA2a к Ca²⁺. После фосфорилирования Ser16 торможение снимается, насос быстрее закачивает Ca²⁺ в СР, и концентрация свободного Ca²⁺ в цитозоле снижается быстрее. Механическое расслабление зависит ещё и от свойств миофиламентов.</span></li><li><b>Б.</b> Делает фосфоламбан переносчиком Ca²⁺ в СР <i>(неверный вариант)</i><br><span class="expl">Фосфоламбан не переносит ионы: это регуляторный белок насоса. SERCA2a переносит Ca²⁺ за счёт гидролиза ATP.</span></li><li><b>В.</b> Ускоряет выход Ca²⁺ из СР в цитозоль <i>(неверный вариант)</i><br><span class="expl">Выход Ca²⁺ из СР обеспечивают рианодиновые рецепторы. Фосфоламбан регулирует обратный поток — закачку Ca²⁺ в СР, которая и определяет скорость спада транзиента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrm1151">MacLennan D. H., Kranias E. G. 2003. Phospholamban: a crucial regulator of cardiac contractility. Nat Rev Mol Cell Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1300731/">Mahaney J. E. et al. 2000. Kinetics studies of the cardiac Ca-ATPase expressed in Sf21 cells: new insights on Ca-ATPase regulation by phospholamban. Biophys J</a></li><li><a href="https://doi.org/10.1152/ajpcell.1996.271.1.C391">Wolska B. M. et al. 1996. Effect of ablation of phospholamban on dynamics of cardiac myocyte contraction and intracellular Ca2+. Am J Physiol</a></li><li><a href="https://doi.org/10.1074/jbc.M004079200">Chu G. et al. 2000. A single site (Ser16) phosphorylation in phospholamban is sufficient in mediating its maximal cardiac responses to beta-agonists. J Biol Chem</a></li><li><a href="https://doi.org/10.1074/jbc.273.8.4734">Luo W. et al. 1998. Transgenic approaches to define the functional role of dual site phospholamban phosphorylation. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3392125/">Kranias E. G., Hajjar R. J. 2012. Modulation of cardiac contractility by the phospholamban/SERCA2a regulatome. Circ Res</a></li><li><a href="https://doi.org/10.1093/cvr/cvu201">Briston S. J. et al. 2014. Balanced changes in Ca buffering by SERCA and troponin contribute to Ca handling during β-adrenergic stimulation in cardiac myocytes. Cardiovasc Res</a></li><li><a href="https://doi.org/10.1113/JP270959">Gresham K. S., Stelzer J. E. 2016. The contributions of cardiac myosin binding protein C and troponin I phosphorylation to β-adrenergic enhancement of in vivo cardiac function. J Physiol</a></li></ul><p>Учебная модель кардиомиоцита мыши (та же, что в практикуме 2п): изопротеренол с 1-й мин, относительные величины, время полуспада Ca²⁺-транзиента — учебная оценка. Сдвиг сродства SERCA2a — Mahaney 2000 (фермент собаки в клетках Sf21); ответ клеток PLN⁻/⁻ — Wolska 1996 (кардиомиоциты мыши, изопротеренол 0,05 мкМ); клетки с PLN S16A — Chu 2000 (трансгенные мыши на фоне PLN⁻/⁻); роль ингибитора-1 — обзор Kranias и Hajjar 2012. Время полуспада свободного Ca²⁺ — учебная оценка; сила и длина клетки в модели не рассчитываются, вклад других эффектов β-стимуляции задан одной феноменологической поправкой, а не откачкой Ca²⁺ тропонином.</p></details></article><article class="card print-unit" id="ns-ultrasensitivity"><div class="eyebrow">Фосфорилирование · шаг 11 из 28</div><h2>Откуда берётся резкое переключение</h2><p class="lead">Простая пара киназа — фосфатаза отвечает плавно. Резкий переход появляется при насыщении ферментов субстратом и при фосфорилировании нескольких участков.</p><ol class="mech"><li>Если ферменты далеки от насыщения, доля фосфорилированной формы плавно возрастает с увеличением отношения активностей киназы и фосфатазы.</li><li>Если оба фермента насыщены субстратом, доля резко возрастает от значения, близкого к нулю, до значения, близкого к единице, в узком интервале около равенства их максимальных скоростей.</li><li>Резкость (сверхчувствительность) не равна бистабильности: кривая крутая, но каждому значению входного сигнала соответствует одно состояние. Бистабильность требует эффективной положительной обратной связи и проверяется опытом с разной предысторией.</li></ol><p>Формула предыдущего шага даёт гиперболическую зависимость: чтобы доля фосфорилированного белка выросла с 0,1 до 0,9, отношение активностей киназы и фосфатазы нужно изменить примерно в 80 раз. Между «выключено» и «включено» нет качественной границы.</p><p>Goldbeter и Koshland (1981) показали, что та же пара ферментов отвечает резко, если концентрация субстрата намного выше констант Михаэлиса обоих ферментов. Тогда каждый фермент работает почти с максимальной скоростью, независимо от концентрации субстрата (<a href="#ns-g-S3-T31">режим нулевого порядка</a>). Пока максимальная скорость киназы меньше максимальной скорости фосфатазы, почти весь субстрат дефосфорилирован; когда максимальная скорость киназы становится больше, почти весь субстрат фосфорилирован. Переход от 0,1 до 0,9 укладывается в интервал отношения скоростей примерно от 0,9 до 1,1.</p><p>Второй механизм резкости — <a href="#ns-g-S3-T32">многосайтовое фосфорилирование</a>: если для изменения свойств белка нужны фосфаты на нескольких участках, а киназа за одно связывание модифицирует в среднем один участок, зависимость доли полностью модифицированной формы от активности киназы более крутая, чем зависимость доли модифицированных участков. <a href="#ns-g-S3-T33">Бистабильность</a> — два устойчивых состояния при одном и том же значении входного сигнала — требует эффективной положительной обратной связи. Её создаёт отдельная петля обратной связи при достаточной нелинейности; положительная обратная связь может возникать и внутри многосайтового цикла без добавленной петли (Markevich 2004). Крутая зависимость сама по себе бистабильность не доказывает: её устанавливают опытом с разной предысторией сигнала (гистерезис). Обратные связи и бистабильность разбираются в семинаре 4.</p><p>Меняйте положение ползунка: при насыщении (оранжевая кривая) небольшое изменение отношения скоростей около 1 переключает почти весь пул.</p><div class="note trap"><strong>Типичная ошибка</strong> Белок с двумя состояниями — «фосфорилирован» и «нефосфорилирован» — всегда даёт резкий ответ «всё или ничего».<p class="trap-fix">Пара киназа — фосфатаза без дополнительных условий отвечает плавно. Резкость возникает при насыщении ферментов, многосайтовости или обратной связи; крутая кривая в опыте не указывает, какой из механизмов работает.</p></div><div class="static-quiz"><h3>При каком условии пара киназа — фосфатаза переводит почти весь субстрат из одной формы в другую при небольшом изменении отношения их активностей?</h3><ol><li><b>А.</b> Когда активности обоих ферментов очень высоки <i>(неверный вариант)</i><br><span class="expl">Высокие активности обоих ферментов ускоряют выход на новый стационарный уровень, но не делают зависимость крутой: в линейном режиме доля по-прежнему задаётся гиперболой kк/(kк + kф).</span></li><li><b>Б.</b> Когда киназа в десять раз активнее фосфатазы <i>(неверный вариант)</i><br><span class="expl">Соотношение 10 : 1 задаёт высокий уровень фосфорилирования, но ничего не говорит о крутизне перехода. Резкость определяется режимом работы ферментов, а не самим отношением.</span></li><li><b>В.</b> Когда оба фермента насыщены субстратом <i>(верный вариант)</i><br><span class="expl">В режиме нулевого порядка каждый фермент работает почти с максимальной скоростью, и исход определяется тем, какая из максимальных скоростей больше. Переход от 0,1 до 0,9 укладывается в интервал отношения примерно 0,9–1,1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC349147/">Goldbeter A., Koshland D. E. 1981. An amplified sensitivity arising from covalent modification in biological systems. Proc Natl Acad Sci U S A</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4214216/">Ferrell J. E., Ha S. H. 2014. Ultrasensitivity part I: Michaelian responses and zero-order ultrasensitivity. Trends Biochem Sci</a></li><li><a href="https://doi.org/10.1038/nrm2203">Ubersax J. A., Ferrell J. E. 2007. Mechanisms of specificity in protein phosphorylation. Nat Rev Mol Cell Biol</a></li><li><a href="https://doi.org/10.1083/jcb.200308060">Markevich N. I., Hoek J. B., Kholodenko B. N. 2004. Signaling switches and bistability arising from multisite phosphorylation in protein kinase cascades. J Cell Biol</a></li></ul><p>Расчёт по уравнению стационарного баланса при кинетике Михаэлиса — Ментен (глава 3, §3.9; Goldbeter и Koshland 1981); K — отношение константы Михаэлиса к общей концентрации субстрата, одинаковое для киназы и фосфатазы. Это расчёт, а не измерение.</p></details></article><article class="card print-unit" id="ns-specificity"><div class="eyebrow">Фосфорилирование · шаг 12 из 28</div><h2>Чем определяется субстратная специфичность киназы</h2><p class="lead">Каталитический центр киназы различает субстраты слабо. Специфичность в клетке складывается из мотива, <a href="#ns-g-S3-T35">участков стыковки</a> и совместной локализации на <a href="#ns-g-S3-T36">скаффолдах</a>.</p><ol class="mech"><li><a href="#ns-g-S3-T34">Консенсусный мотив</a> вокруг остатка нужен, но встречается в тысячах белков.</li><li>Участки стыковки вне каталитического центра удерживают киназу на субстрате и повышают эффективную концентрацию субстрата.</li><li>Скаффолды (например, белки AKAP для PKA) размещают киназу, её субстрат, фосфатазу и фосфодиэстеразу в одном месте клетки.</li></ol><p>У типичной протеинкиназы от одного до нескольких сотен истинных субстратов, и они находятся среди сотен тысяч остатков серина, треонина и тирозина клетки (Ubersax и Ferrell 2007). Эффективность фосфорилирования разных коротких пептидов каталитическим центром различается лишь в несколько раз или в несколько десятков раз. Для PKA это мотив с основными остатками перед серином (например, RRxS), но таких мотивов в протеоме очень много.</p><p>Второй вклад дают участки стыковки — области поверхности киназы и субстрата вне каталитического центра. Их взаимодействие удерживает пару вместе и повышает вероятность модификации нужного белка. Третий вклад — совместная локализация. Белки AKAP связывают регуляторные субъединицы PKA и закрепляют киназу на определённой мембране или в определённом комплексе, нередко вместе с фосфодиэстеразой и фосфатазой (Langeberg и Scott 2015).</p><p>В кардиомиоците AKAP18δ входит в комплекс с SERCA2a, фосфоламбаном и PKA. Когда связывание PKA с AKAP нарушали разобщающими пептидами, фосфорилирование фосфоламбана при β-стимуляции снижалось, и закачка Ca²⁺ в СР ускорялась слабее (Lygren 2007, кардиомиоциты крысы). Ферменты те же, мотив тот же — различается только их взаимное расположение.</p><p>Переключите режимы схемы: в пробирке PKA фосфорилирует любой белок с подходящим мотивом, в клетке — прежде всего те, рядом с которыми её удерживает AKAP.</p><div class="note trap"><strong>Типичная ошибка</strong> Специфичность киназы определяется только последовательностью вокруг фосфорилируемого остатка.<p class="trap-fix">Мотив необходим, но недостаточен: подходящих мотивов в протеоме намного больше, чем настоящих субстратов. В клетке решающими оказываются участки стыковки и закрепление киназы в определённом месте скаффолдами.</p></div><div class="static-quiz"><h3>Кардиомиоциты обработали пептидом, разобщающим PKA и AKAP18δ, и стимулировали изопротеренолом. Общая активность PKA в лизате (по фосфорилированию растворимого пептидного субстрата) и количество PLN остались прежними, а фосфорилирование PLN по Ser16 снизилось. Какое объяснение наиболее обосновано?</h3><ol><li><b>А.</b> Каталитический центр PKA перестал узнавать мотив <i>(неверный вариант)</i><br><span class="expl">Растворимый пептидный субстрат в лизате фосфорилируется как прежде, значит, каталитический центр работает и мотив узнаёт. Изменилось не свойство центра, а то, какие белки оказываются рядом с киназой.</span></li><li><b>Б.</b> PKA, отделённая от AKAP, больше не находится рядом с PLN <i>(верный вариант)</i><br><span class="expl">Ферменты, мотив и количество PLN те же, различается только взаимное расположение: AKAP18δ удерживает PKA в комплексе с фосфоламбаном и SERCA2a, а после разобщения киназа рядом с PLN не оказывается (Lygren 2007). Общий дефицит PKA в этом опыте исключён контролем с растворимым субстратом.</span></li><li><b>В.</b> В клетке снизилась общая активность PKA <i>(неверный вариант)</i><br><span class="expl">Контроль с растворимым субстратом показывает, что каталитическая способность PKA в лизате сохранена, поэтому общее снижение активности PKA в этих клетках по такому контролю маловероятно. Но снижение общей активности PKA могло бы изменить набор фосфорилируемых белков: у разных субстратов разные кинетические параметры и пороги обнаружения, и степень их фосфорилирования могла бы снижаться неодинаково. Такое объяснение исключают контролем, а не рассуждением.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nrm2203">Ubersax J. A., Ferrell J. E. 2007. Mechanisms of specificity in protein phosphorylation. Nat Rev Mol Cell Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4722875/">Langeberg L. K., Scott J. D. 2015. Signalling scaffolds and local organization of cellular behaviour. Nat Rev Mol Cell Biol</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2247390/">Lygren B. et al. 2007. AKAP complex regulates Ca2+ re-uptake into heart sarcoplasmic reticulum. EMBO Rep</a></li></ul><p>Схема механизма. Оценки специфичности — обзор Ubersax и Ferrell 2007; роль AKAP — обзор Langeberg и Scott 2015; комплекс AKAP18δ–PKA–PLN–SERCA2a и опыт с разобщающими пептидами — Lygren 2007 (кардиомиоциты крысы, β-адренергическая стимуляция). Опыт в задании построен по схеме Lygren 2007 (разобщающие пептиды, кардиомиоциты крысы); контроль общей активности PKA по растворимому субстрату добавлен в задание для однозначности вывода и в статье в таком виде не описан.</p></details></article><article class="card print-unit" id="ns-prove-site"><div class="eyebrow">Фосфорилирование · шаг 13 из 28</div><h2>Как доказать, что участок фосфорилирования регулирует белок</h2><p class="lead">Найти фосфорилированный участок — ещё не значит доказать его роль. Нужны несколько независимых опытов: измерение, контроль специфичности и замена остатка.</p><ol class="mech"><li><a href="#ns-g-S3-T37">Фосфоспецифичное антитело</a> на блоте показывает, что участок фосфорилируется; обработка лизата <a href="#ns-g-S3-T38">λ-фосфатазой</a> проверяет, что сигнал принадлежит фосфорилированной форме.</li><li>Замена серина на аланин проверяет, нужен ли участок для ответа; <a href="#ns-g-S3-T39">фосфомиметическая замена</a> на Asp или Glu воспроизводит фосфорилирование лишь частично.</li><li>Масс-спектрометрия находит участки, но интенсивность фосфопептида не равна <a href="#ns-g-S3-T22">занятости участка</a>.</li></ol><p>Первый вопрос — фосфорилируется ли участок в ответ на сигнал. Его решают вестерн-блотом с антителом, которое распознаёт белок, только если определённый остаток фосфорилирован, и с антителом, распознающим белок независимо от его фосфорилирования, для нормировки. Контроль специфичности — обработка части лизата λ-фосфатазой: полоса фосфорилированной формы должна исчезнуть, а полоса, выявляемая вторым антителом, — остаться. Сигнал антитела к фосфорилированной форме отражает не долю фосфорилированных молекул, а лишь относительное изменение (Dephoure 2013).</p><p>Второй вопрос — нужен ли участок для функции. Его решают заменой остатка. Серин заменяют на аланин, который нельзя фосфорилировать: у мышей с фосфоламбаном S16A фосфорилирование PLN после изопротеренола не выявлялось, а сократительный ответ и изменение Ca²⁺-транзиента при действии изопротеренола были ослаблены (Chu 2000). Такой опыт показывает необходимость участка, но не его достаточность. Он не исключает и других последствий замены: в опытах на сердцах мышей после изопротеренола у PLN S16A не выявляли и фосфорилирования соседнего Thr17 (Luo 1998). В то же время у T17A фосфорилировался Ser16 и сохранялся полный ответ на изопротеренол: это поддерживает достаточность Ser16 в данных условиях (Chu 2000). Поэтому результат сопоставляют с другими мутантами и с восстановлением нормального белка при сопоставимой экспрессии. Замена на аспартат или глутамат вносит отрицательный заряд, но не воспроизводит фосфат: фосфоламбан S16E сохранял около трети тормозящего действия (Lockamy 2011), а белки 14-3-3 и домены SH2 обычно не распознают фосфомиметические замены (Dephoure 2013).</p><p>Масс-спектрометрия выявляет тысячи участков сразу, но интенсивность фосфопептида зависит и от количества белка, и от свойств пептида. Чтобы назвать участок регуляторным, нужны нормировка на количество белка, надёжная локализация фосфата, изменение во времени в ответ на сигнал и независимая функциональная проверка.</p><p>Переключайте схемы метода и следите, какие полосы исчезают после обработки λ-фосфатазой и что показывает каждая замена остатка.</p><div class="note trap"><strong>Типичная ошибка</strong> Если участок найден масс-спектрометрией, он регулирует белок.<p class="trap-fix">Обнаружение фосфата показывает только, что модификация происходит. О регуляторной роли говорят изменение в ответ на сигнал, нормированное на количество белка, и функциональный эффект замены остатка.</p></div><div class="static-quiz"><h3>У клеток с PLN S16A ответ на изопротеренол (ускорение спада Ca²⁺-транзиента) ослаблен. Количество, локализация и базовая функция PLN без стимуляции сохранены. Какой вывод поддерживают эти данные, если другие последствия замены проверяют отдельно?</h3><ol><li><b>А.</b> Участок Ser16 необходим для полного ответа на изопротеренол <i>(верный вариант)</i><br><span class="expl">S16A исключает фосфорилирование Ser16. Если количество, локализация и базовая функция белка не изменены (в работе Chu 2000 основные показатели у линий S16A, T17A и нормального PLN в клетках PLN⁻/⁻ без стимуляции были сходны), ослабление ответа поддерживает необходимость этого участка для полного ответа. Другие последствия замены проверяют отдельно — сравнением с мутантом T17A и восстановлением нормального белка при сопоставимой экспрессии. Достаточность участка этим опытом не проверяется.</span></li><li><b>Б.</b> Во всей клетке Ser16 фосфоламбана — единственный участок, фосфорилируемый PKA <i>(неверный вариант)</i><br><span class="expl">Ответ лишь ослаблен, а не исчез: PKA фосфорилирует и другие белки, например тропонин I. Опыт с одним участком ничего не говорит об остальных мишенях киназы.</span></li><li><b>В.</b> Замена S16E восстановит ответ полностью <i>(неверный вариант)</i><br><span class="expl">Аспартат или глутамат не воспроизводят заряд, объём и связи фосфата; фосфоламбан S16E сохраняет около трети тормозящего действия. Результат с миметиком нужно проверять отдельно.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-3.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3583658/">Dephoure N. et al. 2013. Mapping and analysis of phosphorylation sites: a quick guide for cell biologists. Mol Biol Cell</a></li><li><a href="https://doi.org/10.1074/jbc.M004079200">Chu G. et al. 2000. A single site (Ser16) phosphorylation in phospholamban is sufficient in mediating its maximal cardiac responses to beta-agonists. J Biol Chem</a></li><li><a href="https://doi.org/10.1074/jbc.273.8.4734">Luo W. et al. 1998. Transgenic approaches to define the functional role of dual site phospholamban phosphorylation. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3212041/">Lockamy E. L. et al. 2011. Functional and physical competition between phospholamban and its mutants provides insight into the molecular mechanism of gene therapy for heart failure. Biochem Biophys Res Commun</a></li><li><a href="https://doi.org/10.1016/j.celrep.2014.07.036">Sharma K. et al. 2014. Ultradeep human phosphoproteome reveals a distinct regulatory nature of Tyr and Ser/Thr-based signaling. Cell Rep</a></li></ul><p>Схема метода. Пример фосфоламбана: кардиомиоциты трансгенных мышей с PLN S16A на фоне PLN⁻/⁻, изопротеренол (Chu 2000); остаточное торможение S16E — реконструированные мембраны с очищенной SERCA (Lockamy 2011). Рекомендации по анализу участков — Dephoure 2013. Полосы на схеме — иллюстрация, а не данные конкретного блота.</p></details></article><article class="card print-unit" id="ns-gtpase-switch"><div class="eyebrow">Цикл RAS · шаг 14 из 28</div><h2>Почему нуклеотид служит переключателем</h2><p class="lead"><a href="#ns-g-S3-T40">Малая ГТФаза</a> существует в двух формах — с GTP и с GDP, и с эффекторами связывается только форма с GTP. Переключение задаёт одна фосфатная группа — γ-фосфат связанного нуклеотида.</p><ol class="mech"><li>Нуклеотид удерживается в <a href="#ns-g-S3-T41">G-домене</a>; при связанном GTP присутствует <a href="#ns-g-S3-T43">γ-фосфат</a>.</li>
