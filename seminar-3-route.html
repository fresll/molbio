<li>Две подвижные области, <a href="#ns-g-S3-T42">switch I и switch II</a>, контактируют с γ-фосфатом и при GTP упорядочены.</li><li>Упорядоченные switch I и switch II образуют поверхность, с которой связываются эффекторы; после гидролиза она исчезает.</li></ol><p>Малая ГТФаза — компактный белок, ядром которого служит G-домен, связывающий гуаниновый нуклеотид. В отличие от переключателя из вопроса 2, сам белок ковалентно не изменяется: меняется связанный нуклеотид. Информацию несёт присутствие или отсутствие одной группы — γ-фосфата GTP.</p><p>Нуклеотид удерживается петлёй G-домена, а две подвижные области — switch I и switch II — контактируют с γ-фосфатом, когда он есть. При связанном GTP эти области упорядочены и вместе образуют поверхность, комплементарную эффекторным белкам. После гидролиза GTP контакты с γ-фосфатом исчезают, switch I и switch II разупорядочиваются, и поверхность связывания эффекторов пропадает.</p><p>Поэтому GTP-форму называют активной: не потому, что она «энергетически заряжена», а потому, что только с ней связываются эффекторы. Белок медленно гидролизует GTP за счёт собственной ГТФазной активности и тем самым сам ограничивает время активного состояния — в этом смысле переключатель называют молекулярным таймером.</p><p>Оба самопроизвольных перехода — обмен GDP на GTP и гидролиз GTP — идут медленно: каждый из них занимает минуты. Поэтому в клетке состояние переключателя задают совместно регуляторные белки GEF и GAP, собственные скорости белка и доступность нуклеотидов.</p><div class="note trap"><strong>Типичная ошибка</strong> GTP-форма активна, потому что в ней запасена энергия макроэргической связи.<p class="trap-fix">Активность определяется не запасённой энергией, а формой белка: γ-фосфат упорядочивает switch I и switch II и создаёт поверхность для эффекторов.</p></div><div class="static-quiz"><h3>Почему RAS-GTP связывает эффекторы, а RAS-GDP — нет?</h3><ol><li><b>А.</b> γ-фосфат GTP упорядочивает области switch I и switch II <i>(верный вариант)</i><br><span class="expl">Именно присутствие γ-фосфата удерживает switch I и switch II в упорядоченном состоянии, и только тогда есть поверхность связывания эффекторов.</span></li><li><b>Б.</b> GTP крупнее GDP и физически вытесняет эффекторы к поверхности <i>(неверный вариант)</i><br><span class="expl">Разница между GTP и GDP — одна фосфатная группа; дело не в размере нуклеотида, а в том, что γ-фосфат упорядочивает подвижные области белка.</span></li><li><b>В.</b> Энергия, освобождаемая при гидролизе GTP, активирует эффекторы <i>(неверный вариант)</i><br><span class="expl">Эффекторы связывает именно GTP-форма, до гидролиза. Активность определяется формой белка, а не энергией гидролиза.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1126/science.1062023">Vetter I. R., Wittinghofer A. 2001. The guanine nucleotide-binding switch in three dimensions. Science</a></li><li><a href="https://doi.org/10.1152/physrev.00003.2012">Cherfils J., Zeghouf M. 2013. Regulation of small GTPases by GEFs, GAPs, and GDIs. Physiol Rev</a></li></ul><p>Схема механизма по обзорам Vetter и Wittinghofer (2001) и Cherfils и Zeghouf (2013); switch I и switch II, их упорядочение при GTP — структурные данные для белков семейства Ras. Состояния на схеме качественные.</p></details></article><article class="card print-unit" id="ns-gef-gap"><div class="eyebrow">Цикл RAS · шаг 15 из 28</div><h2>Как GEF и GAP задают долю активной формы</h2><p class="lead">Опорная остановка 6 из 8 · обмен и гидролиз: RAS переключается при смене связанного нуклеотида, а не при фосфорилировании белка; уравнения те же, химия иная; продолжает остановку 5. Самопроизвольные обмен и гидролиз медленны, поэтому долю RAS-GTP задают два регуляторных белка. <a href="#ns-g-S3-T44">GEF</a> ускоряет обмен GDP на GTP, <a href="#ns-g-S3-T45">GAP</a> ускоряет гидролиз GTP — те же уравнения, что для пары киназа — фосфатаза в вопросе 2.</p><ol class="mech"><li>GEF раскрывает нуклеотид-связывающий карман и снижает сродство ГТФазы к GDP; GDP диссоциирует, и его место занимает GTP (его концентрация в цитозоле выше).</li><li>GAP вносит в активный центр каталитический <a href="#ns-g-S3-T50">аргининовый палец</a> и ускоряет гидролиз GTP на несколько порядков.</li><li>В стационарном состоянии доля активной формы p* = kGEF/(kGEF + kGAP), время выхода τ = 1/(kGEF + kGAP).</li></ol><p>GEF действует так же, как активный β2-рецептор по отношению к Gs в вопросе 1: раскрывает карман и снижает сродство к GDP. GDP диссоциирует, и его место занимает GTP — потому что концентрация GTP в цитозоле существенно выше концентрации GDP (примерно 0,5 мМ против десятков мкМ, Traut 1994). Сам GEF ATP не расходует.</p><p>GAP действует на другом этапе цикла: вносит в активный центр RAS собственный аргининовый остаток и правильно ориентирует остаток глутамина самой ГТФазы и атакующую молекулу воды, ускоряя гидролиз GTP на несколько порядков (Scheffzek 1997).</p><p>Если ни GEF, ни GAP не насыщены субстратом, а обмен направлен избытком GTP, система описывается теми же уравнениями, что и пара киназа — фосфатаза из вопроса 2. Доля активной формы в стационарном состоянии равна отношению kGEF/(kGEF + kGAP), а время выхода на новый уровень — обратной сумме этих констант. Передвиньте ползунки на схеме: при равных активностях половина RAS активна; усиление любой из сторон смещает долю, а рост обеих ускоряет переключение.</p><p>Сходство уравнений не должно скрывать различие реакций. Обмен GDP на GTP и гидролиз GTP происходят с нуклеотидом, связанным с белком: белок не получает и не теряет ковалентного фосфата. При фосфорилировании киназа, напротив, переносит γ-фосфат ATP на остаток серина, треонина или тирозина, и фосфат остаётся на белке. Режим «Сравнение трёх превращений» на схеме прослеживает метку в каждом из трёх случаев: при обмене она оказывается в свободных нуклеотидах, при гидролизе — в свободном фосфате, при фосфорилировании — на белке.</p><p>Отсюда следствие: повысить долю RAS-GTP можно и усилением обмена (сигнал на GEF), и ослаблением гидролиза (потеря GAP). Сам по себе рост доли активной формы не говорит, какое из двух событий произошло.</p><div class="note trap"><strong>Типичная ошибка</strong> Чем выше активность GEF, тем быстрее RAS выключается после сигнала.<p class="trap-fix">После снятия сигнала активность GEF падает до базальной, и возврат к покою задают GAP и базальный обмен. Пока активность GEF высока, она повышает стационарную долю RAS-GTP, а не выключает RAS.</p></div><div class="static-quiz"><h3>В клетках доля RAS-GTP повысилась. Какой вывод о причине обоснован?</h3><ol><li><b>А.</b> Усилился обмен (GEF) или ослаб гидролиз (GAP) <i>(верный вариант)</i><br><span class="expl">Долю активной формы задаёт отношение kGEF/(kGEF + kGAP); её рост одинаково объясним усилением обмена и ослаблением гидролиза.</span></li><li><b>Б.</b> Обязательно усилился обмен GDP на GTP <i>(неверный вариант)</i><br><span class="expl">Не обязательно: к той же доле приводит ослабление GAP при прежнем обмене. Пример — потеря нейрофибромина.</span></li><li><b>В.</b> Обязательно ускорился собственный гидролиз GTP <i>(неверный вариант)</i><br><span class="expl">Ускорение гидролиза снизило бы долю активной формы, а не повысило: гидролиз выключает RAS.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00003.2012">Cherfils J., Zeghouf M. 2013. Regulation of small GTPases by GEFs, GAPs, and GDIs. Physiol Rev</a></li><li><a href="https://doi.org/10.1126/science.277.5324.333">Scheffzek K. et al. 1997. The Ras-RasGAP complex: structural basis for GTPase activation and its loss in oncogenic Ras mutants. Science</a></li><li><a href="https://doi.org/10.1007/BF00928361">Traut T. W. 1994. Physiological concentrations of purines and pyrimidines. Mol Cell Biochem</a></li></ul><p>Формулы стационарного состояния и времени релаксации — идеализация §3.14 при ненасыщенных GEF и GAP и направленном обмене (Cherfils и Zeghouf, 2013); те же уравнения, что в вопросе 2. Концентрации GTP и GDP — Traut (1994). Величины на ползунках условные.</p></details></article><article class="card print-unit" id="ns-rtk-sos"><div class="eyebrow">Цикл RAS · шаг 16 из 28</div><h2>Как рецептор доставляет SOS1 к RAS</h2><p class="lead">Фактор роста активирует рецепторную тирозинкиназу, которая фосфорилирует остатки тирозина в собственных цитоплазматических участках. <a href="#ns-g-S3-T47">GRB2</a> связывается с фосфотирозином рецептора и привлекает <a href="#ns-g-S3-T46">SOS1</a> к мембране, где находится RAS.</p><ol class="mech"><li>Рецептор (например, <a href="#ns-g-S3-T90">EGFR</a>) связывает лиганд, димеризуется и фосфорилирует остатки тирозина своих цитоплазматических участков.</li><li>GRB2 связывается доменом SH2 с фосфотирозином, а доменом SH3 удерживает SOS1.</li><li>Оказавшись у мембраны рядом с RAS, SOS1 ускоряет обмен GDP на GTP, и доля RAS-GTP растёт.</li><li>RAS закреплён на внутренней стороне мембраны липидным якорем (мотив <a href="#ns-g-S3-T91">CAAX</a>); без якоря он остаётся в цитозоле и не встречается с SOS1.</li></ol><p>Активация RAS начинается с рецепторной тирозинкиназы. Связав лиганд, рецептор образует активный димер и фосфорилирует тирозины своих цитоплазматических участков. Каждый фосфотирозин становится участком узнавания для белков с доменами SH2 и PTB.</p><p>Адаптер GRB2 связывается доменом SH2 с фосфотирозином рецептора, а доменом SH3 удерживает SOS1. Собственной ферментативной активности у GRB2 нет; функция этого комплекса пространственная. SOS1 — цитозольный фермент, а RAS закреплён на плазматической мембране, поэтому GRB2 доставляет фактор обмена к его субстрату.</p><p>Оказавшись у мембраны рядом с RAS, SOS1 ускоряет обмен GDP на GTP, и доля RAS-GTP на мембране растёт. Если лиганда нет, комплекс не образуется и обмен не ускоряется; если рецептор лишён фосфотирозина, GRB2 с ним не связывается; если SOS1 не перемещается к мембране, он не контактирует с RAS. Нарушение любого из этих звеньев прерывает передачу сигнала на цикл RAS — проверьте это на схеме.</p><p>Почему RAS находится у мембраны? RAS — не трансмембранный белок: на внутренней стороне плазматической мембраны его удерживает липидный якорь на C-конце. Концевой мотив <a href="#ns-g-S3-T91">CAAX</a> (цистеин, две алифатические аминокислоты и любая концевая) последовательно модифицируется: к цистеину присоединяется остаток фарнезила, три концевые аминокислоты отщепляются, а карбоксильная группа метилируется. Для прочного закрепления нужен ещё один сигнал: у HRAS и NRAS пальмитоилируются соседние цистеины, а у основной изоформы KRAS (KRAS4B) закрепление усиливает участок положительно заряженных остатков лизина, притягиваемый к отрицательно заряженным липидам внутреннего слоя мембраны (Hancock 1989, 1990; Prior и Hancock 2012).</p><p>Роль якоря показывает опыт, в котором цистеин-186 HRAS, расположенный на самом конце цепи, заменили на серин: белок перестал модифицироваться, остался в цитозоле, не связывал липиды и не вызывал трансформации клеток (Willumsen 1984). Обратное показано для SOS1 и RAF: SOS1 с мембранным сигналом активирует путь RAS, поскольку для активации достаточно, чтобы SOS1 оказался у мембраны рядом с RAS (Aronheim 1994), а RAF с мембранным сигналом KRAS активен независимо от RAS (Leevers 1994; Stokoe 1994). Поэтому состояние нуклеотида и пространственная доступность — разные свойства: нуклеотид определяет форму RAS, а якорь — встретится ли RAS со своим фактором обмена и эффекторами. Переключите режимы на схеме и сравните.</p><p>Так внешний сигнал превращается в повышение доли активного RAS. Завершают сигнал GAP, потеря рецепторов и отрицательные обратные связи (подробно — в семинаре 4).</p><div class="note trap"><strong>Типичная ошибка</strong> GRB2 сам активирует RAS, заменяя в нём GDP на GTP.<p class="trap-fix">GRB2 — адаптер без ферментативной активности. SOS1 ускоряет обмен нуклеотида; GRB2 лишь привлекает его к мембране.</p></div><div class="static-quiz"><h3>В клетках рецептор активен и фосфорилирован, но SOS1 не перемещается к мембране. Как изменится доля RAS-GTP при добавлении фактора роста?</h3><ol><li><b>А.</b> Почти не вырастет: без SOS1 у мембраны обмен не ускоряется <i>(верный вариант)</i><br><span class="expl">SOS1 — фермент, ускоряющий обмен нуклеотида в RAS. Если он не достигает мембраны, сигнал от рецептора не доходит до RAS.</span></li><li><b>Б.</b> Вырастет как обычно: фосфотирозины рецептора сами активируют RAS <i>(неверный вариант)</i><br><span class="expl">Фосфотирозины — лишь участки сборки; сами они нуклеотид не меняют. Без SOS1 у мембраны обмен не ускоряется.</span></li><li><b>В.</b> Вырастет за счёт GRB2, который заменит SOS1 как фактор обмена <i>(неверный вариант)</i><br><span class="expl">GRB2 — адаптер без ферментативной активности; заменить SOS1 он не может.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2010.06.011">Lemmon M. A., Schlessinger J. 2010. Cell signaling by receptor tyrosine kinases. Cell</a></li><li><a href="https://doi.org/10.1152/physrev.00003.2012">Cherfils J., Zeghouf M. 2013. Regulation of small GTPases by GEFs, GAPs, and GDIs. Physiol Rev</a></li><li><a href="https://doi.org/10.1016/0092-8674(89)90054-8">Hancock J. F. et al. 1989. All ras proteins are polyisoprenylated but only some are palmitoylated. Cell</a></li><li><a href="https://doi.org/10.1016/0092-8674(90)90294-O">Hancock J. F., Paterson H., Marshall C. J. 1990. A polybasic domain or palmitoylation is required in addition to the CAAX motif to localize p21ras to the plasma membrane. Cell</a></li><li><a href="https://doi.org/10.1002/j.1460-2075.1984.tb02177.x">Willumsen B. M. et al. 1984. Harvey murine sarcoma virus p21 ras protein: biological and biochemical significance of the cysteine nearest the carboxy terminus. EMBO J</a></li><li><a href="https://doi.org/10.1016/0092-8674(94)90271-2">Aronheim A. et al. 1994. Membrane targeting of the nucleotide exchange factor Sos is sufficient for activating the Ras signaling pathway. Cell</a></li><li><a href="https://doi.org/10.1038/369411a0">Leevers S. J., Paterson H. F., Marshall C. J. 1994. Requirement for Ras in Raf activation is overcome by targeting Raf to the plasma membrane. Nature</a></li><li><a href="https://doi.org/10.1126/science.7811320">Stokoe D. et al. 1994. Activation of Raf as a result of recruitment to the plasma membrane. Science</a></li><li><a href="https://doi.org/10.1016/j.semcdb.2011.09.002">Prior I. A., Hancock J. F. 2012. Ras trafficking, localization and compartmentalized signalling. Semin Cell Dev Biol</a></li></ul><p>Схема механизма по Lemmon и Schlessinger (2010) и Cherfils и Zeghouf (2013). Переключаемые состояния качественные; показана ветвь EGFR → GRB2 → SOS1 → RAS. Липидный якорь и локализация RAS — Willumsen (1984), Hancock (1989, 1990), Aronheim (1994), Leevers (1994), Stokoe (1994), Prior и Hancock (2012); схема качественная, RAS не является трансмембранным белком.</p></details></article><article class="card print-unit" id="ns-effectors"><div class="eyebrow">Цикл RAS · шаг 17 из 28</div><h2>Как эффекторы распознают активный RAS и конкурируют за него</h2><p class="lead">С активным RAS связываются эффекторы трёх групп: <a href="#ns-g-S3-T52">RAF</a>, <a href="#ns-g-S3-T53">PI3K</a> и <a href="#ns-g-S3-T54">RALGDS</a>. Все три связываются с одной и той же поверхностью switch I / switch II, поэтому конкурируют за активный RAS.</p><ol class="mech"><li>RAF запускает каскад RAF → MEK → ERK (подробно в семинаре 4).</li><li>PI3K класса I катализирует образование PIP₃ из PIP₂ и запускает путь AKT.</li><li>RALGDS — сам фактор обмена для ГТФаз семейства Ral; все три связываются с поверхностью switch I / switch II.</li></ol><p>Активная GTP-форма RAS образует поверхность из упорядоченных switch I и switch II. С ней связываются эффекторы — белки, которые RAS привлекает к мембране и активирует. Обычно выделяют три группы: протеинкиназы семейства RAF, каталитические субъединицы PI3K класса I и белки RALGDS.</p><p>Поскольку все три группы связываются с одной и той же поверхностью, они конкурируют за активный RAS: одна молекула RAS-GTP в один момент связывает один эффектор. На схеме с ростом доли RAS-GTP растёт связывание всех трёх групп, а их относительные доли задаются сродством и количеством каждого эффектора в данной клетке.</p><p>Относительный вклад ветвей зависит от типа клетки — это та же контекстная зависимость, что для β2-рецептора в вопросе 1: один и тот же активный RAS в разных клетках запускает разные программы, потому что набор и количество эффекторов различны. Наиболее полно изучена ветвь RAF — MEK — ERK, она разбирается в семинаре 4.</p><p>Конкуренция за одну поверхность объясняет, почему усиление одной ветви может идти за счёт других и почему для онкогенного RAS важно, какие эффекторы доступны в ткани.</p><div class="note trap"><strong>Типичная ошибка</strong> У RAS отдельная площадка для каждого эффектора, поэтому RAF, PI3K и RALGDS работают независимо.<p class="trap-fix">Все три группы связываются с одной поверхностью switch I / switch II, поэтому конкурируют за активный RAS; их доли зависят от сродства и количества в данной клетке.</p></div><div class="static-quiz"><h3>Почему в разных клетках активный RAS запускает разные программы?</h3><ol><li><b>А.</b> В разных клетках различаются набор и количество эффекторов <i>(верный вариант)</i><br><span class="expl">Активный RAS один и тот же, но с ним связываются разные эффекторы в разном количестве, и они делят один пул RAS-GTP.</span></li><li><b>Б.</b> В разных клетках у RAS разные поверхности связывания <i>(неверный вариант)</i><br><span class="expl">Поверхность switch I / switch II одна и та же; различается набор эффекторов в клетке, а не сам RAS.</span></li><li><b>В.</b> RAS связывает GTP в одних клетках и другой нуклеотид в других <i>(неверный вариант)</i><br><span class="expl">Активная форма всегда связывает GTP. Исход определяется не нуклеотидом, а набором эффекторов.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1016/j.cell.2017.06.009">Simanshu D. K., Nissley D. V., McCormick F. 2017. RAS proteins and their regulators in human disease. Cell</a></li><li><a href="https://doi.org/10.1126/science.1062023">Vetter I. R., Wittinghofer A. 2001. The guanine nucleotide-binding switch in three dimensions. Science</a></li></ul><p>Схема по обзору Simanshu, Nissley и McCormick (2017) и Vetter и Wittinghofer (2001). Относительные доли на схеме — учебные (условные сродства); в опыте вклад ветвей зависит от типа клетки.</p></details></article><article class="card print-unit" id="ns-oncogenic"><div class="eyebrow">Цикл RAS · шаг 18 из 28</div><h2>Чем различаются онкогенные варианты RAS</h2><p class="lead"><a href="#ns-g-S3-T55">Онкогенные замены</a> RAS сосредоточены в кодонах 12, 13 и 61 и смещают цикл по-разному. Точнее сказать не «выключатель навсегда включён», а «смещённый цикл с ослабленным выключением».</p><ol class="mech"><li>Замены в кодонах 12 и 13 препятствуют внесению аргининового пальца GAP в активный центр: GAP-стимулированный гидролиз резко снижается.</li><li>Глутамин 61 — каталитический остаток; его замена снижает и собственный, и GAP-стимулированный гидролиз.</li><li>Потеря <a href="#ns-g-S3-T48">нейрофибромина</a> ослабляет инактивацию RAS, не меняя сам белок.</li></ol><p>Соматические варианты RAS — одни из самых частых онкогенных событий (около 19 % больных раком имеют опухоли с мутацией RAS, и три четверти этих мутаций приходятся на KRAS; Prior 2020). Почти все замены приходятся на три кодона — 12, 13 и 61, все в активном центре. Но нарушения у разных вариантов разные, и описывать их одной фразой нельзя.</p><p>Замены глицина 12 и 13 вносят в тесный активный центр боковую цепь, которая препятствует введению каталитического аргинина GAP; GAP-стимулированный гидролиз снижается на 97–99 %. При этом собственный гидролиз у разных замен нарушен в разной степени: у KRAS G12C он почти такой же, как у нормального белка (49·10⁻⁵ с⁻¹ против 68·10⁻⁵ с⁻¹), и именно потеря ответа на GAP, а не медленный собственный гидролиз, обусловливает высокую долю активной формы в отсутствие сигнала (Hunter 2015). У G12V собственный гидролиз снижен сильно (4,2·10⁻⁵ с⁻¹).</p><p>Глутамин 61 ориентирует молекулу воды в реакции гидролиза; его замена (Q61L) резко снижает и собственный (0,80·10⁻⁵ с⁻¹), и GAP-стимулированный гидролиз, поэтому доля активной формы почти не зависит от сигнала. В таблице видно, что варианты различаются скоростью собственного гидролиза и ответом на GAP, а не одним признаком.</p><p>Отдельный механизм — потеря GAP. При нейрофиброматозе 1 типа функция нейрофибромина утрачена; RAS при этом не изменён, но инактивируется медленнее. Это показывает, что клинически значимое повышение активности пути достигается и усилением прямой реакции, и ослаблением обратной. Высокая доля RAS-GTP сама по себе не указывает, какое именно нарушение её вызвало: к ней приводят усиленный обмен, потеря GAP и замены в кодонах 12, 13 и 61. Различают их по скоростям реакций, по генотипу и по ответу на вышележащий сигнал.</p><div class="note trap"><strong>Типичная ошибка</strong> Онкогенные замены G12C, G12V, G13D и Q61L одинаково «блокируют гидролиз» и держат RAS постоянно включённым.<p class="trap-fix">У всех этих вариантов сильно ослаблен ответ на GAP, но собственный гидролиз нарушен в разной степени: у G12C он почти как у нормального белка, у Q61L почти отсутствует. Высокая доля активной формы у G12C — следствие ослабления ответа на GAP, а не остановки собственного гидролиза; точнее говорить о смещённом цикле, а не о «вечном включении».</p></div><div class="static-quiz"><h3>Почему формулировка «онкогенный RAS навсегда включён» неточна для KRAS G12C?</h3><ol><li><b>А.</b> G12C сохраняет собственный гидролиз, поэтому доля его GTP-формы зависит от сигнала <i>(верный вариант)</i><br><span class="expl">G12C почти нечувствителен к GAP, но собственный гидролиз сохранён; белок переходит между формами, и подавление вышележащего сигнала снижает долю RAS-GTP.</span></li><li><b>Б.</b> У G12C нет мутации в активном центре, поэтому он работает как нормальный RAS <i>(неверный вариант)</i><br><span class="expl">Мутация в активном центре есть и снижает чувствительность к GAP. Неточность не в этом, а в словах «навсегда включён»: гидролиз сохранён.</span></li><li><b>В.</b> G12C вообще не связывает GTP, поэтому не может быть постоянно активным <i>(неверный вариант)</i><br><span class="expl">G12C связывает GTP и активен; он не зафиксирован, а продолжает переходить между GTP- и GDP-формами.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1158/1541-7786.MCR-15-0203">Hunter J. C. et al. 2015. Biochemical and structural analysis of common cancer-associated KRAS mutations. Mol Cancer Res</a></li><li><a href="https://doi.org/10.1158/2159-8290.CD-15-1105">Patricelli M. P. et al. 2016. Selective inhibition of oncogenic KRAS output with small molecules targeting the inactive state. Cancer Discov</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.06.009">Simanshu D. K., Nissley D. V., McCormick F. 2017. RAS proteins and their regulators in human disease. Cell</a></li><li><a href="https://doi.org/10.1158/0008-5472.CAN-19-3682">Prior I. A., Hood F. E., Hartley J. L. 2020. The frequency of Ras mutations in cancer. Cancer Res</a></li></ul><p>Скорости гидролиза — из Hunter и соавт. (2015, Mol Cancer Res 13:1325, табл. 1, KRAS in vitro, ×10⁻⁵ с⁻¹): собственный WT 68, G12C 49, G12V 4,2, Q61L 0,80; GAP-стимулированный при 50 мкМ p120GAP (ненасыщающая концентрация): WT 4300, G12C 20, G12V 24, Q61L 12; обмен ~0,002 с⁻¹ у всех, кроме G13D. Доли RAS-GTP без сигнала — из учебной модели вопроса 3 (относительные величины). Сохранение переходов G12C между GDP- и GTP-формами — Patricelli (2016); частоты мутаций — Prior (2020); механизм NF1 — Simanshu (2017).</p></details></article><article class="card print-unit" id="ns-g12c-trap"><div class="eyebrow">Цикл RAS · шаг 19 из 28</div><h2>Как ковалентный ингибитор захватывает KRAS G12C</h2><p class="lead"><a href="#ns-g-S3-T57">Соторасиб</a> и исследовательское соединение ARS-853 связываются с KRAS G12C только в GDP-форме. Поэтому захват идёт по мере перехода белка из GTP- в GDP-форму, а вариант без гидролиза устойчив к ингибитору.</p><ol class="mech"><li>Ингибитор ковалентно связывается с цистеином-12 в кармане возле switch II, открытом только в GDP-форме.</li><li>KRAS G12C сохраняет гидролиз, поэтому проходит через GDP-форму и захватывается.</li><li>У двойного мутанта G12C + Q61L гидролиз почти утрачен, и захвата почти нет; такая же устойчивость наблюдается у клетки с RAS без цистеина-12, поэтому по устойчивости генотип не определить.</li></ol><p>Долгие годы RAS считали непригодной мишенью: сродство к GTP и GDP пикомолярное, нуклеотид диссоциирует очень медленно, а GTP в цитозоле много, поэтому ингибитор, конкурирующий с нуклеотидом, неэффективен (John 1990; Simanshu 2017). Решение нашли другим путём: ковалентные ингибиторы KRAS G12C связываются с цистеином, возникшим в результате замены, в кармане возле switch II.</p><p>Этот карман открыт только в GDP-форме. Поэтому ингибитор связывается с неактивным KRAS G12C и необратимо удерживает белок в этом состоянии. Захват развивается во времени: молекулы связываются по мере того, как они гидролизуют GTP и проходят через GDP-форму. На графике все условия начинаются с одного и того же исходного состояния — клеток без добавок, в которых около 36 % KRAS G12C находится в GTP-форме, — а ингибитор вносят в момент 0. Без дополнительного EGF через 1 ч в учебной модели связано около 70 % белка, через 2 ч — около 90 %, а доля RAS-GTP снижается постепенно (ARS-853: Patricelli 2016, Lito 2016; соторасиб: Canon 2019).</p><p>Если гидролиз почти утрачен (двойной мутант G12C + Q61L), GDP-форма образуется редко, и захват почти не идёт: за 2 ч связано около 5 % белка, а доля RAS-GTP остаётся около 94 %. Это согласуется с тем, что KRAS G12C продолжает переходить между GTP- и GDP-формами и ингибитор действует именно потому, что гидролиз сохранён. Само по себе это наблюдение не доказывает такого объяснения: устойчивость к ингибитору дают и другие причины.</p><p>По устойчивости к ингибитору нельзя определить, какая замена есть в клетке. Если в положении 12 RAS нет цистеина (например, в клетке с KRAS G12D или с другим вариантом RAS), ингибитору G12C не с чем связываться: захвата нет, а доля RAS-GTP остаётся высокой по причине, не связанной с G12C. Если цистеин есть, но гидролиз утрачен (G12C + Q61L), захват тоже почти не идёт. Количество RAS-GTP в RBD pull-down эти случаи не различает; их различают независимые данные: генотип клеток и содержание ингибитора в клетках (методы — в уроке «Чем измеряют количество активного RAS»).</p><p>Скорость захвата зависит и от вышележащего сигнала. Если ингибитор G12C и EGF добавить одновременно, EGF ускоряет обмен GDP на GTP и удерживает белок в GTP-форме: за 2 ч связано около 45 % белка вместо 90 % без EGF, а доля RAS-GTP в первые минуты даже вырастает. Если одновременно с ингибитором G12C подавить сигнал выше RAS (ингибитор EGFR или SOS1), цикл смещается к GDP-форме и захват ускоряется: через 1 ч связано около 79 % белка вместо 71 %, а доля RAS-GTP снижается до 7 % всего белка (учебная модель, откалиброванная по Lito 2016).</p><p>Обе кривые на графике выражены в процентах от всего KRAS в клетке (один знаменатель), поэтому условия можно сравнивать между собой по одной шкале.</p><div class="note trap"><strong>Типичная ошибка</strong> Раз KRAS G12C постоянно активен, ингибитор должен связывать его активную GTP-форму.<p class="trap-fix">Ингибитор связывает GDP-форму: карман возле switch II открыт только в ней. Поэтому захват зависит от гидролиза, а вариант без гидролиза устойчив.</p></div><div class="static-quiz"><h3>Почему двойной мутант KRAS G12C + Q61L устойчив к ковалентному ингибитору G12C?</h3><ol><li><b>А.</b> Ингибитору редко доступна GDP-форма: гидролиз GTP у двойного мутанта почти утрачен <i>(верный вариант)</i><br><span class="expl">Замена Q61L почти устраняет гидролиз, поэтому белок почти не переходит в GDP-форму — ту единственную, которую связывает ингибитор.</span></li><li><b>Б.</b> Вторая замена убирает цистеин-12, и ингибитору не с чем связываться <i>(неверный вариант)</i><br><span class="expl">Цистеин-12 на месте (замена G12C сохранена). Устойчивость даёт утрата гидролиза, а не потеря цистеина.</span></li><li><b>В.</b> Двойной мутант быстрее гидролизует GTP, поэтому выходит из-под действия ингибитора <i>(неверный вариант)</i><br><span class="expl">Наоборот: Q61L почти лишает белок способности гидролизовать GTP. Именно отсутствие гидролиза, а не его ускорение, делает вариант устойчивым.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1158/2159-8290.CD-15-1105">Patricelli M. P. et al. 2016. Selective inhibition of oncogenic KRAS output with small molecules targeting the inactive state. Cancer Discov</a></li><li><a href="https://doi.org/10.1126/science.aad6204">Lito P. et al. 2016. Allele-specific inhibitors inactivate mutant KRAS G12C by a trapping mechanism. Science</a></li><li><a href="https://doi.org/10.1038/s41586-019-1694-1">Canon J. et al. 2019. The clinical KRAS(G12C) inhibitor AMG 510 drives anti-tumour immunity. Nature</a></li><li><a href="https://doi.org/10.1021/bi00477a025">John J. et al. 1990. Kinetics of interaction of nucleotides with nucleotide-free H-ras p21. Biochemistry</a></li><li><a href="https://doi.org/10.1016/j.cell.2017.06.009">Simanshu D. K., Nissley D. V., McCormick F. 2017. RAS proteins and their regulators in human disease. Cell</a></li></ul><p>Данные опыта: клеточные линии рака лёгкого с KRAS G12C (H358 и др.); ARS-853 — Patricelli (2016) и Lito (2016); соторасиб (AMG 510) — Canon (2019). Кривые — учебная модель, откалиброванная по этим работам: время в минутах, обе величины в процентах от всего KRAS. Исходная доля RAS-GTP в этой модели (около 36 %) задана по кинетике захвата в клетках и отличается от стационарной модели предыдущих уроков (около 45 % для G12C без сигнала): это два отдельных учебных описания разных опытов.</p></details></article><article class="card print-unit" id="ns-measure-ras"><div class="eyebrow">Цикл RAS · шаг 20 из 28</div><h2>Чем измеряют количество активного RAS</h2><p class="lead">Количество активного RAS измеряют осаждением на эффекторном домене — <a href="#ns-g-S3-T59">RBD pull-down</a>. Собственный гидролиз измеряют отдельно — в пробирке, по освобождению фосфата.</p><ol class="mech"><li>RBD-домен RAF на гранулах связывает только RAS-GTP; несвязанный RAS-GDP смывается.</li><li>В блоте антитела к RAS показывают, сколько было активной формы; общий RAS — контроль загрузки.</li><li>ГТФазную активность измеряют в пробирке по освобождению меченого фосфата из GTP.</li></ol><p>Чтобы узнать, сколько RAS активно, используют то же свойство, что и эффекторы: RBD-домен RAF связывает только GTP-форму. Лизат клеток инкубируют с гранулами, на которых закреплён RBD-домен; RAS-GTP осаждается, RAS-GDP смывается. В блоте антитела к RAS показывают количество осаждённой активной формы, а блот того же лизата на общий RAS служит контролем загрузки (de Rooij 1997). Метод измеряет количество RAS-GTP в момент лизиса, усреднённое по миллионам клеток.</p><h3>Что метод показывает и чего нет</h3><p>RBD pull-down показывает количество активной формы, но не различает, усилен ли обмен или ослаблен гидролиз, и не даёт скоростей переходов. Один и тот же результат — большое количество RAS-GTP — дают разные причины: усиленный обмен, потеря GAP, замены в кодонах 12, 13 и 61; поэтому по одному pull-down генотип определить нельзя. Метод не показывает и того, какая часть RAS-GTP находится на мембране и связана с эффекторами. Контроль — предварительное связывание RAS с известным нуклеотидом: лизат, в котором RAS заранее связан с GTPγS, даёт сильную полосу, а лизат с RAS, связанным с GDP, — слабую.</p><p>Собственную ГТФазную активность измеряют отдельно, в пробирке, на очищенном белке: по освобождению неорганического фосфата или по переходу метки из [γ-³²P]GTP. Так получены относительные скорости вариантов RAS (Hunter 2015). Важно помнить, что скорости в пробирке не равны клеточным: в клетке на цикл влияют GEF, GAP, концентрации нуклеотидов и расположение белков.</p><p>Чтобы понять, почему количество RAS-GTP не меняется при добавлении ингибитора, одного pull-down недостаточно. Нужны независимые данные: генотип клеток (секвенирование гена) и содержание ингибитора в клетках (масс-спектрометрия). Только вместе с ними результат pull-down можно истолковать.</p><div class="note trap"><strong>Типичная ошибка</strong> Сильная полоса RAS в блоте означает, что в клетке много активной формы RAS.<p class="trap-fix">Полоса общего RAS показывает всё количество белка; активную форму показывает только дорожка после RBD pull-down. Их нужно сравнивать.</p></div><div class="static-quiz"><h3>Что показывает дорожка RAS после осаждения на RBD-домене RAF?</h3><ol><li><b>А.</b> Количество RAS в GTP-форме в момент лизиса <i>(верный вариант)</i><br><span class="expl">RBD-домен связывает только GTP-форму, поэтому осаждённый RAS — это активная форма; общий RAS служит контролем загрузки.</span></li><li><b>Б.</b> Всё количество белка RAS в клетке <i>(неверный вариант)</i><br><span class="expl">Всё количество показывает дорожка общего RAS. После RBD pull-down осаждается только активная, GTP-форма.</span></li><li><b>В.</b> Скорость собственного гидролиза GTP у RAS <i>(неверный вариант)</i><br><span class="expl">Скорость гидролиза измеряют отдельно, в пробирке по освобождению фосфата. Pull-down даёт количество, а не скорость.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 3 практикума. <a href="seminar-3.html#q3">Открыть сценарии вопроса 3 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/sj.onc.1201005">de Rooij J., Bos J. L. 1997. Minimal Ras-binding domain of Raf1 can be used as an activation-specific probe for Ras. Oncogene</a></li><li><a href="https://doi.org/10.1158/1541-7786.MCR-15-0203">Hunter J. C. et al. 2015. Biochemical and structural analysis of common cancer-associated KRAS mutations. Mol Cancer Res</a></li></ul><p>Схемы методов: RBD pull-down — de Rooij и Bos (1997); измерение ГТФазной активности очищенных вариантов — Hunter (2015). Это схемы методов, а не данные конкретного опыта; что измеряется и каков контроль, указано на схеме.</p></details></article><article class="card print-unit" id="ns-gq-ip3"><div class="eyebrow">STIM–Orai · шаг 21 из 28</div><h2>Как опустошается депо Ca²⁺</h2><p class="lead">Депо-зависимый вход запускается после опустошения запаса Ca²⁺ в ЭПР. В физиологических условиях это происходит при активации ветви Gq; посредником служит растворимый IP₃.</p><ol class="mech"><li>Рецептор, сопряжённый с Gq, через Gq активирует фосфолипазу Cβ, которая расщепляет <a href="#ns-g-S3-T73">PIP₂</a> с образованием <a href="#ns-g-S3-T70">IP₃</a> и <a href="#ns-g-S3-T74">DAG</a>.</li><li>Растворимый IP₃ диффундирует в цитозоле и открывает <a href="#ns-g-S3-T71">IP₃-рецептор</a> в мембране ЭПР.</li><li>Через IP₃-рецептор Ca²⁺ выходит из депо в цитозоль. Скорость выхода превышает скорость обратной закачки насосом <a href="#ns-g-S3-T68">SERCA</a>, поэтому депо опустошается.</li></ol><p>Депо-зависимый вход начинается не с внешнего Ca²⁺, а с опустошения внутреннего запаса. Рецептор, сопряжённый с белком Gq, активирует фосфолипазу Cβ. Этот фермент гидролизует мембранный липид PIP₂ и образует сразу два посредника с разной локализацией: растворимый IP₃ и мембранный диацилглицерол (DAG).</p><p>IP₃ диффундирует в цитозоле и связывается с IP₃-рецептором — каналом мембраны ЭПР. Канал открывается при совместном связывании IP₃ и Ca²⁺ на цитозольной стороне и выпускает Ca²⁺ из просвета ЭПР. Пока выход превышает закачку насосом SERCA, концентрация свободного Ca²⁺ в просвете депо снижается.</p><p>Запас Ca²⁺ в ЭПР ограничен: объём ЭПР — малая часть объёма клетки. Поэтому при высвобождении Ca²⁺ его концентрация в цитозоле быстро повышается, но по мере истощения запаса этот источник Ca²⁺ исчерпывается. Длительный ответ (например, активация транскрипции в лимфоците) требует входа Ca²⁺ из внешней среды — и именно снижение концентрации Ca²⁺ в ЭПР служит сигналом к открытию пути входа Ca²⁺ из среды.</p><p>В практикуме отдельную ветвь Gq не моделируют: опустошение депо задают напрямую — ползунком концентрации Ca²⁺ в ЭПР (базовый уровень), тапсигаргином или кратким импульсом IP₃ (продвинутый уровень, два протокола). Так состояние депо отделено от рецепторного сигнала; исход импульса зависит от работы SERCA (шаг о протоколе с тапсигаргином).</p><div class="note trap"><strong>Типичная ошибка</strong> IP₃ сам открывает канал на плазматической мембране и впускает Ca²⁺ снаружи.<p class="trap-fix">IP₃ открывает канал IP₃-рецептора в мембране ЭПР и выпускает Ca²⁺ из депо; вход снаружи идёт позже и через другой канал — Orai1.</p></div><div class="static-quiz"><h3>Фосфолипаза Cβ активирована. Где окажется образовавшийся IP₃ и на что он подействует?</h3><ol><li><b>А.</b> Останется в мембране и активирует протеинкиназу C <i>(неверный вариант)</i><br><span class="expl">В мембране остаётся DAG; он участвует в активации протеинкиназы C. IP₃ растворим и диффундирует в цитозоль.</span></li><li><b>Б.</b> Перейдёт в цитозоль и откроет IP₃-рецептор ЭПР <i>(верный вариант)</i><br><span class="expl">Растворимый IP₃ диффундирует к IP₃-рецептору мембраны ЭПР и открывает его; Ca²⁺ выходит из депо, и депо опустошается.</span></li><li><b>В.</b> Откроет Orai1 на плазматической мембране <i>(неверный вариант)</i><br><span class="expl">Orai1 открывают кластеры STIM1 после опустошения депо, а не IP₃ напрямую.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00006.2016">Berridge M. J. 2016. The inositol trisphosphate/calcium signaling pathway in health and disease. Physiol Rev</a></li><li><a href="https://doi.org/10.1152/physrev.00020.2014">Prakriya M., Lewis R. S. 2015. Store-operated calcium channels. Physiol Rev</a></li></ul><p>По обзорам Berridge (2016), Prakriya и Lewis (2015) и главе 3 пособия. Схема — механизм, не данные опыта.</p></details></article><article class="card print-unit" id="ns-stim-sensor"><div class="eyebrow">STIM–Orai · шаг 22 из 28</div><h2>Как опустошение депо активирует STIM1</h2><p class="lead">Опорная остановка 7 из 8 · сенсор, канал и эффектор: звенья цепи STIM1 → Orai1 → кальцинейрин — разные белки, и отдельный опыт указывает на отдельное звено; продолжает остановку 6. STIM1 — сенсор Ca²⁺ в депо: его домен EF-hand связывает Ca²⁺ в просвете ЭПР. Диссоциация Ca²⁺ от этого домена переводит STIM1 в активную форму. Изменяйте ползунком концентрацию Ca²⁺ в ЭПР и проследите за долей STIM1 в кластерах.</p><ol class="mech"><li>Домен <a href="#ns-g-S3-T63">EF-hand</a> STIM1 в просвете ЭПР связывает Ca²⁺ с умеренным сродством (Kd около 200–600 мкМ).</li><li>При опустошении депо Ca²⁺ диссоциирует от домена EF-hand, люминальные домены перестраиваются, цитозольная часть распрямляется.</li><li>Молекулы STIM1 в распрямлённой форме собираются в <a href="#ns-g-S3-T64">кластеры</a>; доля STIM1 в кластерах резко меняется при изменении концентрации Ca²⁺ в ЭПР.</li></ol><p>STIM1 — белок мембраны ЭПР. Его обращённый в просвет участок (домен EF-hand вместе с доменом SAM) связывает Ca²⁺ с умеренным сродством — таким, что Ca²⁺ диссоциирует именно при физиологическом опустошении депо. Важно правильно описать исходное состояние: в покое полноразмерный STIM1 — уже димер в компактной, «сложенной» конформации, а не одиночная молекула. Каждая субъединица пересекает мембрану ЭПР одной трансмембранной спиралью: домены EF-hand и SAM лежат в просвете ЭПР, а цитозольная часть — в цитозоле. Поэтому Ca²⁺ на домене EF-hand находится внутри ЭПР, и STIM1 служит сенсором концентрации Ca²⁺ в просвете, а не в цитозоле (на схеме точка Ca²⁺ нарисована только в просвете; её плотность показывает долю занятых мест).</p><p>При снижении концентрации Ca²⁺ в просвете ЭПР ион диссоциирует от домена EF-hand, люминальные домены перестраиваются, цитозольная часть распрямляется и открывает участок связывания канала. Распрямлённые димеры собираются в кластеры. В схеме доля STIM1 в кластерах рассчитана по учебной модели практикума как функция Хилла от концентрации Ca²⁺ в ЭПР (K½ около 187 мкМ, коэффициент около 4 по Luik 2008).</p><p>Высокий коэффициент Хилла означает, что зависимость крутая: около порога небольшое снижение Ca²⁺ в ЭПР резко увеличивает долю STIM1 в кластерах. Поэтому вход Ca²⁺ активируется почти пороговым образом, а не плавно нарастает с каждым потерянным ионом.</p><p>Не следует переносить на целый белок поведение изолированного люминального фрагмента: в растворе такой фрагмент действительно олигомеризуется только после потери Ca²⁺, но полноразмерный STIM1 в покое уже димер (Zhou 2013).</p><div class="note trap"><strong>Типичная ошибка</strong> STIM1 в покое — одиночная молекула, которая объединяется в димеры только после опустошения депо.<p class="trap-fix">Полноразмерный STIM1 в покое уже димер в сложенной форме; опустошение депо распрямляет его и собирает димеры в кластеры.</p></div><div class="static-quiz"><h3>Концентрацию Ca²⁺ в просвете ЭПР снизили с 500 до 150 мкМ. Какой станет доля STIM1 в кластерах?</h3><ol><li><b>А.</b> Почти не изменится: в ЭПР ещё много Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">150 мкМ уже ниже порога кластеризации (K½ ≈ 187 мкМ). В этой области зависимость крутая, и доля STIM1 в кластерах растёт с 2 % до 70 %.</span></li><li><b>Б.</b> Большая часть STIM1 соберётся в кластеры <i>(верный вариант)</i><br><span class="expl">При 150 мкМ домены EF-hand в значительной мере теряют Ca²⁺, и в модели около 70 % STIM1 находится в кластерах (при 500 мкМ — около 2 %).</span></li><li><b>В.</b> Кластеры распадутся: STIM1 свяжет больше Ca²⁺ <i>(неверный вариант)</i><br><span class="expl">При снижении концентрации Ca²⁺ в ЭПР домен EF-hand теряет Ca²⁺, а не связывает его. Потеря Ca²⁺ и вызывает распрямление и кластеризацию STIM1.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature07065">Luik R. M. et al. 2008. Oligomerization of STIM1 couples ER calcium depletion to CRAC channel activation. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.M608247200">Stathopulos P. B. et al. 2006. Stored Ca2+ depletion-induced oligomerization of STIM1 via the EF-SAM region. J Biol Chem</a></li><li><a href="https://doi.org/10.1038/nsmb.2625">Zhou Y. et al. 2013. Initial activation of STIM1, the regulator of store-operated calcium entry. Nat Struct Mol Biol</a></li></ul><p>Модель схемы — учебная (вопрос 4 практикума), доля STIM1 в кластерах по Luik 2008 (Jurkat, клетки с ЭПР-индикатором): перераспределение STIM1 — функция Хилла с K½ около 190 мкМ и коэффициентом около 4 (в модели схемы принято 187 мкМ и 3,8). Сродство EF-hand — Stathopulos 2006 (рекомбинантный домен, Kd 200–600 мкМ). Строение в покое — Zhou 2013.</p></details></article><article class="card print-unit" id="ns-contact-site"><div class="eyebrow">STIM–Orai · шаг 23 из 28</div><h2>Почему вход Ca²⁺ происходит именно в участке контакта двух мембран</h2><p class="lead">Депо Ca²⁺ находится в просвете ЭПР, а канал, через который Ca²⁺ входит из среды, — в плазматической мембране. Передачу сигнала обеспечивает участок, где расстояние между мембранами составляет 10–25 нм.</p><ol class="mech"><li>Кластеры распрямлённых молекул <a href="#ns-g-S3-T61">STIM1</a> накапливаются в <a href="#ns-g-S3-T65">контактах ЭПР–ПМ</a>, где расстояние между мембранами составляет 10–25 нм.</li><li>Цитозольная часть STIM1 достигает <a href="#ns-g-S3-T62">Orai1</a> в плазматической мембране, связывается с ним и непосредственно открывает канал.</li><li>У открытого Orai1 образуется локальный микродомен с особенно высокой концентрацией Ca²⁺; одновременно может повышаться и средняя концентрация Ca²⁺ в цитозоле. Мишени по-разному отвечают на локальный и общий сигналы.</li></ol><p>Между двумя событиями — снижением Ca²⁺ внутри ЭПР и открыванием канала в плазматической мембране — нет ни общего компартмента, ни диффундирующего посредника. Их связывает структура — контакт ЭПР и плазматической мембраны, где расстояние между мембранами составляет порядка 10–25 нм.</p><p>Этот зазор достаточно мал, чтобы цитозольная часть распрямлённого STIM1 достигала Orai1 и при этом мембраны не сливались. STIM1 диффундирует в мембране ЭПР и задерживается именно в контактах; там он связывается с молекулами Orai1 и непосредственно открывает их. Участок контакта здесь — необходимое условие: белок одной мембраны служит лигандом канала другой мембраны, а радиус его действия задан геометрией контакта.</p><p>Отсюда следует и локальность сигнала: у устья открытого Orai1 образуется <a href="#ns-g-S3-T92">микродомен</a> с особенно высокой концентрацией Ca²⁺. Локальный и общий сигналы не исключают друг друга: при длительном входе ионы рассеиваются, и повышается также средняя концентрация Ca²⁺ в цитозоле — именно её показывает индикатор в практикуме. Мишени различают эти сигналы: в неэлектровозбудимых клетках NFAT1 переходил в ядро особенно эффективно при входе через CRAC-каналы, но не через канал TRPC3, хотя оба пути входа повышали концентрацию Ca²⁺ в цитозоле (Kar 2011). Поэтому подавление микродомена (например, быстрым хелатором Ca²⁺) не обязательно меняет среднюю концентрацию Ca²⁺ в цитозоле, а повышение средней концентрации не означает, что у канала есть микродомен.</p><p>Если увеличить зазор (в схеме — условный режим «60 нм»), цитозольная часть STIM1 не достигает Orai1, и канал не открывается, несмотря на опустошённое депо. Это показывает, что важна именно геометрия контакта.</p><div class="note trap"><strong>Типичная ошибка</strong> STIM1 перемещается в плазматическую мембрану и сам становится каналом для Ca²⁺.<p class="trap-fix">STIM1 остаётся в мембране ЭПР; в участке контакта он лишь связывает и открывает Orai1, канал плазматической мембраны.</p></div><div class="static-quiz"><h3>Депо опустошено, STIM1 распрямлён, но зазор между мембранами в контакте искусственно увеличен. Откроется ли Orai1?</h3><ol><li><b>А.</b> Откроется: опустошения депо достаточно <i>(неверный вариант)</i><br><span class="expl">Опустошение депо распрямляет STIM1, но открыть Orai1 он может, только достигнув его; при большом зазоре этого не происходит.</span></li><li><b>Б.</b> Не откроется: STIM1 не достигнет Orai1 <i>(верный вариант)</i><br><span class="expl">При увеличенном зазоре цитозольная часть STIM1 не достигает Orai1, и канал не открывается, хотя депо пусто.</span></li><li><b>В.</b> Откроется: STIM1 перейдёт в плазматическую мембрану к Orai1 <i>(неверный вариант)</i><br><span class="expl">STIM1 остаётся в мембране ЭПР и не переходит в плазматическую мембрану; он действует через контакт на расстоянии.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00020.2014">Prakriya M., Lewis R. S. 2015. Store-operated calcium channels. Physiol Rev</a></li><li><a href="https://doi.org/10.1083/jcb.200604014">Wu M. M. et al. 2006. Ca2+ store depletion causes STIM1 to accumulate in ER regions closely associated with the plasma membrane. J Cell Biol</a></li><li><a href="https://doi.org/10.1074/jbc.M111.220582">Kar P., Nelson C., Parekh A. B. 2011. Selective activation of the transcription factor NFAT1 by calcium microdomains near Ca2+ release-activated Ca2+ (CRAC) channels. J Biol Chem</a></li></ul><p>По обзору Prakriya и Lewis (2015) и работе Wu и соавт. (2006): при опустошении депо STIM1 накапливается в участках ЭПР на расстоянии 10–25 нм от плазматической мембраны. Режим «зазор 60 нм» — условная иллюстрация роли геометрии, не данные опыта. Различие локального и общего сигналов — Kar 2011 (неэлектровозбудимые клетки): NFAT1 особенно чувствителен к микродомену у открытых каналов CRAC. Показания «у устья канала» и «в объёме цитозоля» на схеме — качественные, не измеренные величины.</p></details></article><article class="card print-unit" id="ns-crac-current"><div class="eyebrow">STIM–Orai · шаг 24 из 28</div><h2>Что показывают ток CRAC и генетика Orai1</h2><p class="lead">Ток через Orai1 обладает характерными свойствами, по которым его отличают от других токов. А молекулярную идентичность канала установила генетика: замена R91W в ORAI1 у больных с иммунодефицитом.</p><ol class="mech"><li><a href="#ns-g-S3-T66">Ток CRAC</a> (ICRAC) регистрируют патч-клампом в конфигурации whole-cell после опустошения депо.</li><li>Его характерные свойства: высокая избирательность к Ca²⁺, очень малая проводимость, <a href="#ns-g-S3-T67">входящее выпрямление</a>.</li><li>У больных с заменой R91W в ORAI1 ток CRAC отсутствует, а введение нормального Orai1 его восстанавливает.</li></ol><p>Электрофизиологические измерения выявляют характерные свойства тока CRAC. При опустошении депо в конфигурации whole-cell регистрируют входящий ток, очень избирательный к Ca²⁺ (потенциал реверсии выше +90 мВ), с очень малой одноканальной проводимостью и входящим выпрямлением: при отрицательном потенциале ток велик, при деполяризации почти исчезает. Этот набор свойств позволяет отличить ICRAC от других токов, но не указывает, какой белок образует канал.</p><p>Белок канала идентифицировали двумя независимыми подходами (Feske 2006). Картирование сцепления в семье больных тяжёлым комбинированным иммунодефицитом указало участок хромосомы 12q24, а RNAi-скрининг в клетках дрозофилы, где после тапсигаргина следили за переходом NFAT–GFP в ядро, выявил ген dOrai (оба подхода показаны на схеме). Его человеческий гомолог ORAI1 расположен в том же участке; больные гомозиготны по замене R91W.</p><p>В T-клетках больных депо-зависимый вход и ток CRAC отсутствуют. Введение нормального Orai1 восстанавливает и вход, и ток, а Orai1 R91W — нет, хотя оба белка синтезируются в равном количестве и находятся у плазматической мембраны. В опытах с экспрессией в клетках HEK293 Orai1 R91W сохраняет взаимодействие со STIM1 (Muik 2008): нарушено само проведение Ca²⁺.</p><p>Вывод относится к этому классу замен с потерей функции; не любая замена в ORAI1 даёт иммунодефицит. Убедительным считают совпадение независимых данных — фармакологических, электрофизиологических и генетических — вместе с восстановлением функции нормальным белком.</p><div class="note trap"><strong>Типичная ошибка</strong> Замена R91W мешает STIM1 собираться в кластеры, поэтому вход Ca²⁺ пропадает.<p class="trap-fix">Orai1 R91W находится у мембраны и сохраняет взаимодействие со STIM1 (опыты на клетках HEK293); нарушено проведение Ca²⁺ самим каналом.</p></div><div class="static-quiz"><h3>В T-клетках больного с ORAI1 R91W депо опустошили хелатором BAPTA в пипетке. Что покажет патч-кламп?</h3><ol><li><b>А.</b> Нормальный ток CRAC: мутантный белок есть у мембраны <i>(неверный вариант)</i><br><span class="expl">Orai1 R91W действительно находится у плазматической мембраны, но канал не проводит Ca²⁺, поэтому ток CRAC не развивается.</span></li><li><b>Б.</b> Ток CRAC не развивается, несмотря на опустошение депо <i>(верный вариант)</i><br><span class="expl">В T-клетках больных с R91W ток CRAC при опустошении депо не развивается; нормальный Orai1 его восстанавливает (Feske 2006).</span></li><li><b>В.</b> Ток CRAC с выходящим выпрямлением <i>(неверный вариант)</i><br><span class="expl">Для тока CRAC характерно входящее выпрямление; замена R91W не меняет этого свойства, а устраняет проведение Ca²⁺.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/nature04702">Feske S. et al. 2006. A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function. Nature</a></li><li><a href="https://doi.org/10.1074/jbc.M708898200">Muik M. et al. 2008. Dynamic coupling of the putative coiled-coil domain of ORAI1 with STIM1 mediates ORAI1 channel activation. J Biol Chem</a></li><li><a href="https://doi.org/10.1152/physrev.00020.2014">Prakriya M., Lewis R. S. 2015. Store-operated calcium channels. Physiol Rev</a></li></ul><p>Feske и соавт. (2006): T-клеточные линии и фибробласты двух больных и их родственников. Вход Ca²⁺ — пик и начальная скорость роста [Ca²⁺] после тапсигаргина и возврата Ca²⁺ во внешнюю среду. ICRAC — whole-cell, пассивное опустошение депо 8 мМ BAPTA в пипетке, 20 мМ Ca²⁺ снаружи; ток восстановленных клеток полностью блокировался 2 мкМ La³⁺. Взаимодействие R91W со STIM1 — Muik 2008 (клетки HEK293, FRET). Вольт-амперная кривая на схеме — качественная.</p></details></article><article class="card print-unit" id="ns-calcineurin-nfat"><div class="eyebrow">STIM–Orai · шаг 25 из 28</div><h2>Как вход Ca²⁺ приводит к активации транскрипции</h2><p class="lead">Длительный вход Ca²⁺ активирует фосфатазу кальцинейрин. Она дефосфорилирует NFAT, и тот переходит в ядро — сигнал передаётся активацией фосфатазы, а не киназы.</p><ol class="mech"><li>Ca²⁺ связывается с <a href="#ns-g-S3-T75">кальмодулин</a>ом; комплекс Ca²⁺–кальмодулин активирует фосфатазу <a href="#ns-g-S3-T76">кальцинейрин</a>.</li><li>Кальцинейрин дефосфорилирует <a href="#ns-g-S3-T77">NFAT</a>, открывая его сигнал ядерной локализации; NFAT переходит в ядро и там вместе с партнёром AP-1 участвует в активации генов (для IL2 нужны оба).</li><li>Продолжающаяся активность кальцинейрина поддерживает ядерный NFAT. После прекращения Ca²⁺-сигнала NFAT рефосфорилируется и постепенно выходит из ядра; этот ответ может заметно переживать сам сигнал.</li></ol><p>Изменение концентрации Ca²⁺ меняет занятость Ca²⁺-связывающих белков. Центральный из них — кальмодулин: связав Ca²⁺, он меняет конформацию и активирует набор мишеней. Одна из них — кальцинейрин, серин-треониновая фосфатаза, активная только в комплексе с Ca²⁺–кальмодулином.</p><p>Субстрат кальцинейрина — транскрипционный фактор NFAT. В покое NFAT фосфорилирован по многим участкам и удерживается в цитоплазме. Дефосфорилирование кальцинейрином открывает сигнал ядерной локализации, и NFAT переходит в ядро. Одного ядерного NFAT для ответа недостаточно: на промоторе гена интерлейкина-2 он связывается с ДНК совместно с AP-1 (Fos–Jun), и без партнёра комплекс не образуется кооперативно (Peterson 1996; Macián 2001). Поэтому переход NFAT в ядро — необходимое, но не достаточное условие транскрипции IL2.</p><p>Здесь используется положение из общей части семинара: сигнал передаётся не активацией киназы, а активацией фосфатазы. Стационарный уровень фосфорилирования NFAT сдвигается за счёт активности фосфатазы. Многосайтовое фосфорилирование делает переход резким. После прекращения входа Ca²⁺ NFAT рефосфорилируется, но его выход из ядра происходит постепенно. В опытах Kar 2011 ядерный NFAT1 сохранялся значительно дольше Ca²⁺-сигнала; полувремя рефосфорилирования и выхода NFAT1 из ядра в этом опыте составляло около 24 минут.</p><p>На этот путь действует иммунодепрессант циклоспорин A. Он связывается с внутриклеточным белком циклофилином, и уже образовавшийся комплекс подавляет кальцинейрин. Вход Ca²⁺ при этом не меняется, но NFAT не дефосфорилируется и остаётся в цитоплазме — на этом основано предотвращение отторжения трансплантата.</p><div class="note trap"><strong>Типичная ошибка</strong> Циклоспорин A блокирует вход Ca²⁺ через Orai1, поэтому NFAT не идёт в ядро.<p class="trap-fix">Циклоспорин A не действует на вход Ca²⁺: он через циклофилин подавляет кальцинейрин, и NFAT остаётся фосфорилированным в цитоплазме.</p></div><div class="static-quiz"><h3>В клетке с нормальным входом Ca²⁺ NFAT находится в ядре. Добавили циклоспорин A. Как изменятся концентрация Ca²⁺ в цитозоле и локализация NFAT?</h3><ol><li><b>А.</b> Концентрация Ca²⁺ снизится, NFAT вернётся в цитоплазму <i>(неверный вариант)</i><br><span class="expl">Циклоспорин A не действует на каналы, поэтому вход Ca²⁺ и его концентрация в цитозоле не снижаются; меняется только локализация NFAT.</span></li><li><b>Б.</b> Концентрация Ca²⁺ не изменится, NFAT вернётся в цитоплазму <i>(верный вариант)</i><br><span class="expl">Вход Ca²⁺ не меняется, но кальцинейрин подавлен: киназы рефосфорилируют NFAT, и он возвращается в цитоплазму.</span></li><li><b>В.</b> Концентрация Ca²⁺ не изменится, NFAT останется в ядре <i>(неверный вариант)</i><br><span class="expl">Удержание NFAT в ядре требует непрерывной активности кальцинейрина. Без неё киназы рефосфорилируют NFAT, и он покидает ядро, хотя Ca²⁺ входит нормально.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1101/gad.1102703">Hogan P. G. et al. 2003. Transcriptional regulation by calcium, calcineurin, and NFAT. Genes Dev</a></li><li><a href="https://doi.org/10.1146/annurev.immunol.021908.132550">Hogan P. G. et al. 2010. Molecular basis of calcium signaling in lymphocytes: STIM and ORAI. Annu Rev Immunol</a></li><li><a href="https://doi.org/10.1038/383837a0">Timmerman L. A. et al. 1996. Rapid shuttling of NF-AT in discrimination of Ca2+ signals and immunosuppression. Nature</a></li><li><a href="https://doi.org/10.1093/emboj/cdg381">Tomida T. et al. 2003. NFAT functions as a working memory of Ca2+ signals in decoding Ca2+ oscillation. EMBO J</a></li><li><a href="https://doi.org/10.1016/0092-8674(91)90124-h">Liu J. et al. 1991. Calcineurin is a common target of cyclophilin-cyclosporin A and FKBP-FK506 complexes. Cell</a></li><li><a href="https://doi.org/10.1073/pnas.93.24.13671">Peterson B. R., Sun L. J., Verdine G. L. 1996. A critical arginine residue mediates cooperativity in the contact interface between transcription factors NFAT and AP-1. Proc Natl Acad Sci USA</a></li><li><a href="https://doi.org/10.1038/sj.onc.1204386">Macián F. et al. 2001. Partners in transcription: NFAT and AP-1. Oncogene</a></li><li><a href="https://doi.org/10.1074/jbc.M111.220582">Kar P., Nelson C., Parekh A. B. 2011. Selective activation of the transcription factor NFAT1 by calcium microdomains near Ca2+ release-activated Ca2+ (CRAC) channels. J Biol Chem</a></li></ul><p>По обзору Hogan и соавт. (2003) и Hogan и соавт. (2010). Зависимость удержания NFAT в ядре от длительности сигнала — Timmerman 1996, Tomida 2003. Мишень циклоспорина — Liu 1991 (кальцинейрин — общая мишень комплексов циклофилин–циклоспорин A и FKBP–FK506). Кооперативное связывание NFAT и AP-1 с ДНК — Peterson 1996 (опыты со связыванием белков с ДНК in vitro), Macián 2001 (обзор). В клетках NFAT1 остаётся в ядре заметно дольше самого сигнала Ca²⁺, а лимитирует его пребывание в ядре скорость выхода из ядра: NFAT1 остаётся в ядре примерно в 10 раз дольше сигнала Ca²⁺ (Kar 2011).</p></details></article><article class="card print-unit" id="ns-addback"><div class="eyebrow">STIM–Orai · шаг 26 из 28</div><h2>Как отделяют вход Ca²⁺ из среды от высвобождения из депо</h2><p class="lead">Проверяя зависимость входа Ca²⁺ от состояния депо, используют тапсигаргин и возврат Ca²⁺ в среду. Концентрацию Ca²⁺ в цитозоле при этом измеряют индикатором Fura-2.</p><ol class="mech"><li><a href="#ns-g-S3-T69">Тапсигаргин</a> подавляет SERCA; депо опустошается за счёт утечки Ca²⁺ — без участия рецептора и IP₃.</li><li>В среде без Ca²⁺ виден лишь преходящий подъём его концентрации в цитозоле за счёт высвобождения из депо; после возврата Ca²⁺ сразу развивается длительный вход.</li><li><a href="#ns-g-S3-T79">Fura-2</a> возбуждают на 340 и 380 нм; отношение сигналов пересчитывают в концентрацию Ca²⁺.</li></ol><p>Этот протокол позволяет разделить вклад отдельных звеньев пути. Сначала клетки держат в среде без Ca²⁺ и добавляют тапсигаргин — необратимый ингибитор SERCA. Закачка Ca²⁺ в ЭПР прекращается, депо опустошается за счёт постоянной утечки, и если вход Ca²⁺ из среды возникает без агониста, это показывает его зависимость от состояния депо. Без внешнего Ca²⁺ виден лишь небольшой преходящий подъём (он обусловлен высвобождением из депо); после возврата Ca²⁺ в среду сразу развивается длительный вход.</p><p>Концентрацию Ca²⁺ в цитозоле измеряют флуоресцентным индикатором Fura-2. Его возбуждают поочерёдно светом 340 и 380 нм; при связывании Ca²⁺ сигнал на 340 нм растёт, а на 380 нм падает. Отношение двух сигналов (340/380) не зависит от количества красителя в клетке и после калибровки пересчитывается в концентрацию Ca²⁺.</p><p>Каждый контроль позволяет сравнить определённые составляющие сигнала. Удаление внешнего Ca²⁺ отделяет вход снаружи от высвобождения из депо: длительная составляющая исчезает, а возврат Ca²⁺ её восстанавливает. Нокаут STIM1 или Orai1 и блокатор CRAC подавляют депо-зависимый вход; полнота подавления зависит от эффективности нокаута (проверяют белок и ток CRAC) и от компенсации Orai2, Orai3 или STIM2.</p><p>Тапсигаргин — не единственный способ опустошить депо, и он не показывает, как сигнал выключается в обычной клетке. Рассмотрим краткий импульс IP₃ в среде с Ca²⁺. Ca²⁺ выходит из ЭПР через IP₃-рецептор, STIM1 собирается в кластеры, Orai1 открывается. Когда импульс заканчивается, SERCA закачивает Ca²⁺ в ЭПР, в том числе вошедший через Orai1: депо пополняется, Ca²⁺ снова связывается с доменом EF-hand, кластеры разбираются, вход прекращается. Orai1 переносит Ca²⁺ из среды только в цитозоль; в просвет ЭПР его переносит SERCA. Если SERCA заблокирована тапсигаргином, депо не пополняется даже при наличии Ca²⁺ в среде, STIM1 остаётся в кластерах, и вход продолжается. Третий режим схемы сравнивает эти два случая; тот же опыт есть в практикуме (4а, протокол «импульс IP₃»).</p><p>У метода есть ограничение: сам индикатор связывает Ca²⁺ и служит буфером, а перевод отношения 340/380 в наномолярную концентрацию требует калибровки. Концентрации на графиках практикума рассчитаны в учебной модели, а не измерены.</p><div class="note trap"><strong>Типичная ошибка</strong> Преходящий подъём концентрации Ca²⁺ сразу после тапсигаргина — это уже вход снаружи через Orai1.<p class="trap-fix">Пока внешнего Ca²⁺ нет, вход снаружи невозможен; преходящий подъём обусловлен утечкой Ca²⁺ из ЭПР при подавленной SERCA.</p></div><div class="static-quiz"><h3>Клетки находятся в среде без Ca²⁺. После добавления тапсигаргина измерение с Fura-2 показало небольшой преходящий подъём концентрации Ca²⁺ в цитозоле. Откуда поступил этот Ca²⁺?</h3><ol><li><b>А.</b> Вошёл снаружи через Orai1 <i>(неверный вариант)</i><br><span class="expl">Внешнего Ca²⁺ в среде нет, поэтому вход через Orai1 невозможен; преходящее повышение концентрации Ca²⁺ не может быть обусловлено входом из среды.</span></li><li><b>Б.</b> Вышел из ЭПР за счёт утечки <i>(верный вариант)</i><br><span class="expl">Тапсигаргин подавил SERCA, и депо опустошается за счёт утечки; именно этот Ca²⁺ вызывает преходящий подъём концентрации Ca²⁺ в цитозоле.</span></li><li><b>В.</b> Это артефакт: Fura-2 сам светится ярче <i>(неверный вариант)</i><br><span class="expl">Отношение 340/380 как раз устраняет зависимость от количества и яркости красителя; подъём отражает реальное высвобождение из депо.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 4 практикума. <a href="seminar-3.html#q4">Открыть сценарии вопроса 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1152/physrev.00020.2014">Prakriya M., Lewis R. S. 2015. Store-operated calcium channels. Physiol Rev</a></li><li><a href="https://doi.org/10.1073/pnas.87.7.2466">Thastrup O. et al. 1990. Thapsigargin discharges intracellular Ca2+ stores by specific inhibition of the ER Ca2+-ATPase. Proc Natl Acad Sci USA</a></li><li><a href="https://doi.org/10.1016/S0021-9258(19)83641-4">Grynkiewicz G. et al. 1985. A new generation of Ca2+ indicators with greatly improved fluorescence properties. J Biol Chem</a></li><li><a href="https://doi.org/10.1016/j.cell.2007.11.028">Clapham D. E. 2007. Calcium signaling. Cell</a></li><li><a href="https://doi.org/10.1073/pnas.90.13.6295">Zweifach A., Lewis R. S. 1993. Mitogen-regulated Ca2+ current of T lymphocytes is activated by depletion of intracellular Ca2+ stores. Proc Natl Acad Sci USA</a></li></ul><p>T-лимфоциты и другие клетки (Prakriya и Lewis 2015; Zweifach и Lewis 1993). Тапсигаргин — необратимый ингибитор SERCA (Thastrup 1990). Fura-2 — Grynkiewicz 1985 (отношение 340/380, пересчёт в концентрацию после калибровки). Буферирование Ca²⁺ — Clapham 2007. Числа на графиках практикума — учебная модель. Режим «импульс IP₃» — учебная модель практикума (вопрос 4, 4а): время пополнения депо в модели задано условно и не откалибровано по эксперименту; сохранён порядок событий — пополнение депо, разборка кластеров STIM1, закрытие Orai1.</p></details></article><article class="card print-unit" id="ns-methods"><div class="eyebrow">Исследование · шаг 27 из 28</div><h2>Как выбрать величину, метод и контроль</h2><p class="lead">Опорная остановка 8 из 8 · проверка механизма: один результат совместим с несколькими механизмами, а выбрать между ними позволяет контроль; продолжает остановки 1–7. Для каждого переключателя сначала решают, какую величину измерять, затем — каким методом и с каким контролем. Один и тот же результат опыта часто совместим с несколькими механизмами; контрольный опыт позволяет их различить.</p><ol class="mech"><li>Измеряемые величины различны: концентрация посредника, доля фосфорилированного белка, доля GTP-формы ГТФазы и поток ионов.</li><li>Метод: FRET-сенсор cAMP, вестерн-блот с фосфоспецифичным антителом, осаждение RAS-GTP доменом RBD, флуоресцентный индикатор Ca²⁺.</li><li>Контроль: вмешательство, которое меняет только одно звено (ингибитор, нокаут, замена остатка, удаление внеклеточного Ca²⁺).</li></ol><p>Каждый из четырёх разобранных переключателей описывается своей величиной. Для β2-рецептора это концентрация cAMP в цитоплазме во времени; её измеряют в живой клетке FRET-сенсором, а калибровка по сигналу при прямой активации аденилатциклазы форсколином вместе с ингибитором фосфодиэстераз IBMX позволяет сравнивать опыты. Для фосфорилирования — доля фосфорилированного участка; на блоте видна её относительная динамика, а λ-фосфатаза проверяет, что антитело распознаёт фосфорилированную форму.</p><p>Для RAS измеряемая величина — количество RAS в GTP-форме: лизат инкубируют с доменом RBD киназы RAF, который связывает только RAS-GTP, и выявляют осаждённый RAS на блоте. Контролем служат лизаты, в которых RAS заранее связан с негидролизуемым аналогом GTP или с GDP. Для депо-зависимого входа Ca²⁺ величина — вход Ca²⁺ из среды; его оценивают по росту концентрации Ca²⁺ в цитозоле после возврата Ca²⁺ в среду, когда депо заранее опустошено тапсигаргином.</p><p>Главная ошибка — заменить одну величину другой: рост концентрации cAMP не означает определённого ответа клетки, рост фосфорилирования — активации киназы, высокая доля RAS-GTP — усиления сигнала рецептора, а повышение концентрации Ca²⁺ — входа через Orai1. В каждом случае есть альтернативное объяснение, и контроль выбирают так, чтобы его исключить: отличить подавление фосфатазы от активации киназы, потерю GAP — от усиления GEF, высвобождение из депо — от входа из среды.</p><p>Переключайте таблицы: для каждого переключателя указаны величина, метод, контроль и ограничение вывода.</p><div class="note trap"><strong>Типичная ошибка</strong> Если величина изменилась в нужную сторону, механизм доказан.<p class="trap-fix">Одно измерение совместимо с несколькими механизмами. Механизм называют только после контроля, который меняет одно звено пути и исключает альтернативное объяснение.</p></div><div class="static-quiz"><h3>Фосфорилирование белка в клетке выросло после воздействия. Какой опыт отличит активацию киназы от торможения фосфатазы?</h3><ol><li><b>А.</b> Повторно измерить фосфорилирование через час <i>(неверный вариант)</i><br><span class="expl">Повторное измерение той же величины покажет тот же рост, но не его причину: доля фосфорилированного белка зависит от отношения активностей обоих ферментов.</span></li><li><b>Б.</b> Подавить киназу и сравнить скорость спада фосфорилирования <i>(верный вариант)</i><br><span class="expl">После полного подавления киназы доля снижается с характерным временем 1/kф. Если воздействие подавило фосфатазу, спад будет медленнее, чем в контроле; если оно активировало киназу, скорость спада не изменится.</span></li><li><b>В.</b> Заменить участок на аспартат и измерить функцию <i>(неверный вариант)</i><br><span class="expl">Фосфомиметическая замена отвечает на другой вопрос — достаточно ли заряда на участке для функции. О том, какой фермент изменил активность, она не говорит.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1074/jbc.M707009200">Violin J. D. et al. 2008. β2-adrenergic receptor signaling and desensitization elucidated by quantitative modeling of real time cAMP dynamics. J Biol Chem</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3583658/">Dephoure N. et al. 2013. Mapping and analysis of phosphorylation sites: a quick guide for cell biologists. Mol Biol Cell</a></li><li><a href="https://doi.org/10.1038/sj.onc.1201005">de Rooij J., Bos J. L. 1997. Minimal Ras-binding domain of Raf1 can be used as an activation-specific probe for Ras. Oncogene</a></li><li><a href="https://doi.org/10.1038/nature04702">Feske S. et al. 2006. A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function. Nature</a></li><li><a href="https://doi.org/10.1152/physrev.00020.2014">Prakriya M., Lewis R. S. 2015. Store-operated calcium channels. Physiol Rev</a></li><li><a href="https://doi.org/10.1186/s13059-017-1237-8">Mou H. et al. 2017. CRISPR/Cas9-mediated genome editing induces exon skipping by alternative splicing or exon deletion. Genome Biol</a></li></ul><p>Сводная таблица по шагам разделов 1–4; схемы каждого метода показаны в шагах «Как измеряют cAMP в живой клетке», «Как доказать, что участок фосфорилирования регулирует белок», «Чем измеряют количество активного RAS» и шагах о токе CRAC и протоколе с тапсигаргином.</p></details></article><article class="card print-unit" id="ns-investigation"><div class="eyebrow">Исследование · шаг 28 из 28</div><h2>Как четыре переключателя работают вместе в T-лимфоците</h2><p class="lead">В активированном T-лимфоците один стимул запускает и вход Ca²⁺, и цикл RAS. Для транскрипции гена интерлейкина-2 необходимы обе ветви, а повышение концентрации cAMP её ослабляет.</p><ol class="mech"><li>Рецептор антигена активирует фосфолипазу Cγ1, которая образует IP₃ и DAG: IP₃ опустошает депо и запускает вход Ca²⁺ через STIM1–Orai1, DAG связывается с <a href="#ns-g-S3-T80">RASGRP1</a>, и RASGRP1 активирует RAS.</li><li>Ca²⁺ активирует фосфатазу кальцинейрин, дефосфорилированный NFAT переходит в ядро; путь RAS → ERK повышает количество и активность белков <a href="#ns-g-S3-T81">AP-1</a>.</li><li>NFAT и AP-1 вместе связываются с <a href="#ns-g-S3-T82">составными элементами</a> промотора IL2; повышение концентрации cAMP подавляет индукцию IL-2.</li></ol><p>T-лимфоцит удобен как итоговый пример, потому что в нём работают все механизмы семинара. Связывание антигена рецептором T-клетки запускает каскад тирозиновых киназ и активирует фосфолипазу Cγ1. Она, как фосфолипаза Cβ ветви Gq, гидролизует PI(4,5)P₂ с образованием IP₃ и DAG. IP₃ опустошает депо Ca²⁺, STIM1 открывает Orai1, и длительный вход Ca²⁺ активирует кальцинейрин. Дефосфорилированный NFAT переходит в ядро — сигнал передаётся через фосфатазу.</p><p>DAG связывается с C1-доменом белка RASGRP1, фактора обмена гуаниновых нуклеотидов для RAS. У мышей без RASGRP1 тимоциты не активировали RAS в ответ на стимуляцию рецептора антигена или аналоги DAG (Dower 2000). RAS-GTP запускает путь ERK, который повышает синтез и фосфорилирование белков семейств Fos и Jun, образующих AP-1. Цикл RAS здесь управляется тем же принципом, что в вопросе 3: доля RAS-GTP задаётся активностью GEF и GAP.</p><p>Транскрипция гена интерлейкина-2 требует совпадения двух сигналов: NFAT и AP-1 образуют на составных элементах промотора прочный тройной комплекс с ДНК (Macián 2001). Поэтому ни вход Ca²⁺ без AP-1, ни AP-1 без NFAT недостаточны. У больных с заменой ORAI1 R91W T-клетки лишены депо-зависимого входа Ca²⁺ (Feske 2006), а циклоспорин A подавляет кальцинейрин — оба нарушения затрагивают разные звенья одной ветви. Повышение концентрации cAMP (в опытах — форсколином и аналогами cAMP) в линиях T-клеток подавляло индукцию IL-2, но не IL-4, частично на уровне транскрипции (Novak и Rothenberg 1990): ответ на один и тот же cAMP снова зависит от того, какие гены и белки задействованы в данной клетке.</p><p>Отключайте звенья на схеме и следите, какие сигналы доходят до гена IL2.</p><div class="note trap"><strong>Типичная ошибка</strong> Для активации T-лимфоцита достаточно повышения концентрации Ca²⁺ в цитозоле.<p class="trap-fix">Ca²⁺ через кальцинейрин активирует NFAT, но для транскрипции IL2 нужен ещё AP-1, образование которого зависит от ветви DAG → RASGRP1 → RAS → ERK. Транскрипция гена активируется при совпадении двух сигналов.</p></div><div class="static-quiz"><h3>T-лимфоциты без RASGRP1 стимулировали через рецептор антигена. Вход Ca²⁺ и доля NFAT в ядре соответствуют норме. Как изменится индукция гена IL2?</h3><ol><li><b>А.</b> Не изменится: NFAT в ядре достаточно <i>(неверный вариант)</i><br><span class="expl">NFAT на промоторе IL2 действует совместно с AP-1. Без активации RAS и ERK AP-1 почти не образуется, и одного NFAT для полной индукции недостаточно.</span></li><li><b>Б.</b> Ослабнет: без активации RAS мало AP-1 <i>(верный вариант)</i><br><span class="expl">Обе ветви сходятся на промоторе: NFAT от кальциевой ветви и AP-1 от ветви RAS → ERK. Отсутствие RASGRP1 лишает промотор второго партнёра.</span></li><li><b>В.</b> Усилится: Ca²⁺ не тратится на путь RAS <i>(неверный вариант)</i><br><span class="expl">Ca²⁺ не расходуется путём RAS, а ветви не конкурируют за общий ресурс. Подавление ветви RAS снижает, а не повышает индукцию IL2.</span></li></ol></div><p class="practice-row">Исследование использует материал всех четырёх вопросов практикума. <a href="seminar-3.html#q1">Вопрос 1 →</a> <a href="seminar-3.html#q2">Вопрос 2 →</a> <a href="seminar-3.html#q3">Вопрос 3 →</a> <a href="seminar-3.html#q4">Вопрос 4 →</a></p><details open class="sources"><summary>Источники и условия научного вывода</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/79766">Dower N. A. et al. 2000. RasGRP is essential for mouse thymocyte differentiation and TCR signaling. Nat Immunol</a></li><li><a href="https://doi.org/10.1038/sj.onc.1204386">Macián F. et al. 2001. Partners in transcription: NFAT and AP-1. Oncogene</a></li><li><a href="https://doi.org/10.1038/nature04702">Feske S. et al. 2006. A mutation in Orai1 causes immune deficiency by abrogating CRAC channel function. Nature</a></li><li><a href="https://doi.org/10.1101/gad.1102703">Hogan P. G. et al. 2003. Transcriptional regulation by calcium, calcineurin, and NFAT. Genes Dev</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC55163/">Novak T. J., Rothenberg E. V. 1990. cAMP inhibits induction of interleukin 2 but not of interleukin 4 in T cells. Proc Natl Acad Sci U S A</a></li></ul><p>Схема механизма, объединяющая данные разных систем: RASGRP1 — мыши без RASGRP1, тимоциты (Dower 2000); NFAT и AP-1 на промоторе IL2 — обзор Macián 2001; ORAI1 R91W — T-клеточные линии больных (Feske 2006); действие cAMP на IL-2 — линии T-клеток мыши, форсколин и аналоги cAMP (Novak и Rothenberg 1990). Состояния схемы качественные, без расчётов.</p></details></article><section class="card"><h2>Краткий словарь</h2><dl class="glossary"><div id="ns-g-S3-T01"><dt>β2-адренорецептор</dt><dd>Рецептор, сопряжённый с G-белком; содержит семь трансмембранных спиралей, связывает адреналин и норадреналин и в активной конформации служит фактором обмена гуаниновых нуклеотидов для Gαs.</dd></div><div id="ns-g-S3-T02"><dt>Агонист (эффективность)</dt><dd>Лиганд, смещающий равновесие конформаций рецептора в сторону активной. Эффективность — степень этого смещения; полный агонист даёт максимальный ответ, частичный — меньший даже при насыщении.</dd></div><div id="ns-g-S3-T03"><dt>Обратный агонист</dt><dd>Лиганд, смещающий равновесие к неактивной конформации и снижающий активность рецептора ниже базальной. Пропранолол ведёт себя в основном как обратный агонист β-рецепторов.</dd></div><div id="ns-g-S3-T04"><dt>Базальная активность</dt><dd>Небольшая активность рецептора без лиганда, следствие самопроизвольного перехода между конформациями. Антагонист занимает карман, но базальную активность не меняет.</dd></div><div id="ns-g-S3-T05"><dt>Gαs</dt><dd>α-субъединица гетеротримерного G-белка Gs. В GTP-форме связывает и активирует аденилатциклазу; время активного состояния ограничено её собственной ГТФазной активностью.</dd></div><div id="ns-g-S3-T06"><dt>Фактор обмена гуаниновых нуклеотидов (GEF)</dt><dd>Белок, ускоряющий замену GDP на GTP в ГТФазе. Активный β2-рецептор — GEF для Gαs; тот же механизм у SOS1 для RAS (вопрос 3).</dd></div><div id="ns-g-S3-T07"><dt>ГТФазная активность</dt><dd>Способность Gαs гидролизовать связанный GTP до GDP и тем самым переходить в неактивную форму. Для Gs ускорение этого гидролиза RGS-белками, как правило, не показано.</dd></div><div id="ns-g-S3-T08"><dt>Холерный токсин</dt><dd>Бактериальный токсин, ADP-рибозилирующий в субъединице αs остаток Arg201 (Arg187 в короткой изоформе) и подавляющий гидролиз GTP. Gαs остаётся в GTP-форме и активирует аденилатциклазу без агониста.</dd></div><div id="ns-g-S3-T09"
