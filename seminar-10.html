условиях он синтезируется с постоянной скоростью и быстро убиквитинируется комплексом CUL3–KEAP1 по лизинам домена Neh2: период полужизни около 13 мин, поэтому белка мало (Stewart 2003, клетки гепатомы мыши Hepa). Есть и вторая, KEAP1-независимая ветвь деградации: GSK-3 фосфорилирует домен Neh6, и NRF2 убиквитинирует лигаза β-TrCP (Rada 2011). Под действием CdCl₂ (50 мкМ) период полужизни NRF2 возрастал примерно до 100 мин (Stewart 2003); кадмий не относится к электрофилам типа сульфорафана.", "gn_n_keap1": "KEAP1 и CUL3–RBX1", "g_n_keap1": "KEAP1 — субстратный адаптер E3-лигазы CUL3–RBX1: комплекс убиквитинирует несколько лизинов домена Neh2 белка NRF2 (Kobayashi 2004; Zhang 2004). KEAP1 действует как димер и связывает два мотива Neh2, ETGE и DLG (McMahon 2006; Tong 2006). Это не пассивный якорь: уже в исходном состоянии KEAP1 направляет NRF2 на убиквитинирование и разрушение протеасомой (Zhang 2003). Эндогенный KEAP1 в основном цитоплазматический, и электрофилы его локализацию не меняют (Watai 2007). Исходно NRF2 меньше, чем KEAP1 и CUL3 (Iso 2016).", "gn_n_cys": "Сенсорные цистеины KEAP1", "g_n_cys": "Цистеины KEAP1 с тиоловой группой реагируют с электрофилами и окислителями. Самые реактивные остатки мышиного KEAP1 (из 25 цистеинов) — C257, C273, C288 и C297 (Dinkova-Kostova 2002). Роли остатков различаются: C151 лежит в BTB-домене и нужен для подавления убиквитинирования хинонами и сульфорафаном (Zhang 2003; Zhang 2004); C273 и C288 области IVR нужны для самой репрессии NRF2 (Yamamoto 2008); для H₂O₂ важны C226, C613, C622 и C624 (Suzuki 2019). Набор остатков зависит от индуктора (Takaya 2012; Saito 2016). На базовом уровне показана одна группа сенсорных цистеинов, на продвинутом — три; нумерация в большинстве работ мышиная.", "gn_n_elec": "Электрофил", "g_n_elec": "Электрофилы реагируют с тиоловыми группами; индукторами NRF2 служат электрофилы, окислители и пролекарства, из которых образуется электрофил (например, tBHQ окисляется в клетке до хинона TBQ; Abiko 2011). На базовом уровне электрофил один, обобщённый, без названия: он реагирует с одной группой сенсорных цистеинов, а выводится реакцией с GSH, которую ускоряют ферменты фазы II. По данным Iso 2016 (диэтилмалеат, пять мышиных линий), количество KEAP1 и CUL3 при этом не меняется, а NRF2 становится больше их. Ниже — примеры индукторов продвинутого уровня.", "gn_n_ub": "Убиквитин и протеасома", "g_n_ub": "Цепь убиквитина (Ub), присоединённая к белку, служит сигналом к разрушению его протеасомой. Метки Ub на схеме показывают поток KEAP1-зависимого убиквитинирования NRF2: чем выше активность комплекса CUL3–KEAP1, тем толще стрелка и больше меток. Пунктирная стрелка слева — KEAP1-независимая ветвь (GSK-3, β-TrCP; Rada 2011), которая сохраняется при подавленной активности комплекса.", "gn_n_are": "NRF2–sMAF и элемент ARE", "g_n_are": "В ядре NRF2 образует гетеродимер с малыми белками Maf (sMAF) и связывается с элементом антиоксидантного ответа (ARE) в регуляторных областях генов-мишеней (Itoh 1997; Hirotsu 2012). У мышей без Nrf2 индукция ферментов фазы II в печени и кишечнике по большей части исчезает (Itoh 1997). В модели активность программы определяет NRF2, не связанный с KEAP1; перенос NRF2 в ядро и из ядра не рассчитываются.", "gn_n_nqo1": "NQO1", "g_n_nqo1": "NQO1 — фермент фазы II, мишень NRF2 (Venugopal 1996). У мышей без Nrf2 исходная активность NQO в тканях ниже на 30–80 %, а индукция олтипразом почти отсутствует (Ramos-Gomez 2001; McMahon 2001). В модели часть NQO1 (35 %) не зависит от NRF2, а сам NQO1 служит обобщённым представителем ферментов фазы II, которые ускоряют выведение электрофила.", "gn_n_hmox1": "HMOX1", "g_n_hmox1": "HMOX1 (гемоксигеназа-1) — мишень NRF2 (Alam 1999). В клетках L929 доминантно-отрицательный Nrf2 подавлял индукцию мРНК HMOX1 на 85–95 % (Alam 1999). Белок HMOX1 появляется позже, чем растёт NRF2 (He 2001, клетки Hepa при CdCl₂). При регуляции гена HMOX1 ATF4 взаимодействует с NRF2 (He 2001; вопрос 1), а партнёр NRF2 в этом гене остаётся предметом исследований.", "gn_n_gcl": "GCLC и GCLM", "g_n_gcl": "GCLC и GCLM — субъединицы глутамат-цистеин-лигазы, фермента первой стадии синтеза GSH; их гены — мишени NRF2 (Wild 1999). В модели рост содержания GCL повышает уровень, к которому возвращается пул GSH.", "gn_n_phase2": "Ферменты фазы II и конъюгат", "g_n_phase2": "NQO1 и глутатион-S-трансферазы (GST) — ферменты фазы II, мишени NRF2. Реакцию присоединения GSH к электрофилу катализируют GST: образуется конъюгат, который выводится из клетки. NQO1 на этой схеме представляет обобщённый ответ ферментов детоксикации и не обозначает катализ этой реакции. В модели рост содержания этих ферментов объединён в один расчётный эффект — ускорение реакции электрофила с GSH и его выведения. UGT, SULT, MRP, PRDX и G6PD часто относят к программе NRF2, но прямые работы по ним в использованных работах не проверены, поэтому на схеме их нет.", "gn_n_gsh": "Глутатион (GSH)", "g_n_gsh": "Глутатион — трипептид γ-Glu-Cys-Gly; восстановленная форма (GSH) содержит тиоловую группу и реагирует с электрофилами. Формула ниже — GSH при pH 7 (заряд 1−). В модели GSH убывает при реакции с электрофилом, затем растёт выше исходного, когда повышено содержание GCLC и GCLM. Такая форма ответа (снижение за 3–6 ч, повышение к 24 ч) описана для сульфорафана в гепатоцитах человека (Wang 2015), а повышение зависело от Nrf2 в гепатоцитах мыши (Toyama 2011); величины в модели — допущение.", "gn_n_measure": "Как измеряют", "g_n_measure": "Показания прибора — расчёт модели, а не измерение. Модификацию цистеинов определяют масс-спектрометрией очищенного KEAP1 (Dinkova-Kostova 2002; Eggler 2005); долю модифицированных остатков в клетке так не измеряют, поэтому шкала условная. Убиквитинирующую активность оценивают по убиквитинированию NRF2 (Kobayashi 2004; Zhang 2004; Kobayashi 2006). Содержание белков NRF2, NQO1 и HMOX1 определяют иммуноблотом; NRF2 заметно растёт уже через 30 мин (Stewart 2003, клетки Hepa при CdCl₂). Взаимодействие NRF2 с KEAP1 в живых клетках изучали методом FLIM-FRET (Baird 2013); полоса «KEAP1, связанный с NRF2» — расчёт модели. GSH измеряли в гепатоцитах человека и мыши (Wang 2015; Toyama 2011).", "gn_n_model": "Что упрощено", "g_n_model": "Время — часы учебной модели. Из измерений взят период полужизни NRF2: около 13 мин без индуктора и около 100 мин при CdCl₂ (Stewart 2003, клетки Hepa); из него рассчитаны постоянный синтез NRF2 и KEAP1-независимая ветвь деградации. Остальное — допущения: ёмкость KEAP1 втрое выше исходного содержания NRF2 (качественно по Iso 2016), скорость реакции электрофила с цистеинами, выведение электрофила, возврат GSH, постоянные времени роста мишеней (NQO1 4 ч, HMOX1 1,5 ч, GCL 2,5 ч). Доля NQO1 и HMOX1, не зависящая от NRF2, принята по порядку величины из работ на мышах без Nrf2 и из Alam 1999 (там подавлена индукция мРНК). На базовом уровне сенсорные цистеины сведены к одной группе, электрофил один, обобщённый. Модель не содержит переноса NRF2 в ядро и из ядра, колебаний NRF2, деградации самого KEAP1, фосфорилирования NRF2 киназой PERK и клеточной гибели. Качественные порядки времён взяты из работ: содержание NRF2 повышается раньше содержания продуктов его генов-мишеней (Stewart 2003; He 2001), GSH сначала убывает, затем превышает исходный (Wang 2015).", "fn_sfn": "сульфорафан", "fn_dmf": "диметилфумарат", "fn_tbhq": "tBHQ (трет-бутилгидрохинон)", "fn_tbq": "TBQ (хинон, окисленная форма tBHQ)", "fn_gsh": "глутатион (GSH), форма при pH 7", "gn_n_p62": "p62 (SQSTM1)", "g_n_p62": "p62 — адаптерный белок селективной аутофагии. Он связывается с доменом Kelch белка KEAP1 через собственный мотив и конкурирует с NRF2 за связывание; активация NRF2 при этом не зависит от цистеинов (Komatsu 2010; Lau 2010; клетки мыши и человека, дефицит аутофагии). Фосфорилирование p62 повышает его сродство к KEAP1 (Ichimura 2013). Ген p62 — мишень NRF2, поэтому возникает положительная обратная связь (Jain 2010), а сам KEAP1 разрушается преимущественно аутофагией (Taguchi 2012). В модели накопление p62 — хроническое состояние: p62 занимает 60 % доменов Kelch и снижает ёмкость KEAP1 для NRF2 (допущение по порядку величины); обратная связь через ген p62 не рассчитывается.", "gn_n_sfn": "Сульфорафан", "g_n_sfn": "Сульфорафан — изотиоцианат из брокколи, электрофил, реагирующий с тиоловыми группами; выделен как индуктор ферментов фазы II (Zhang 1992). В клетках мыши ответ на него зависит от C151: при замене C151S он слабый (Takaya 2012), а подавление убиквитинирования NRF2 утрачивается (Zhang 2004). В клетках сульфорафан не разрушает комплекс KEAP1–NRF2 (Kobayashi 2006); для очищенного мышиного KEAP1 in vitro описано ослабление связи с Neh2 (Dinkova-Kostova 2002), а для человеческого KEAP1 прямая диссоциация не подтверждена (Eggler 2005). Ответ на сульфорафан не связан с блоком аутофагии (Lau 2013). В модели он реагирует преимущественно с C151 и слабо — с другими группами цистеинов (доли — допущение).", "gn_n_tbhq": "tBHQ", "g_n_tbhq": "tBHQ (трет-бутилгидрохинон) в клетке окисляется до электрофильного хинона TBQ, который ковалентно присоединяется к цистеинам C23, C151, C226 и C368 очищенного KEAP1 (Abiko 2011; номера даны без указания вида). Активация NRF2 не определяется активными формами кислорода: каталаза, связанная с полиэтиленгликолем, ей не мешала (Abiko 2011, клетки RAW264.7). В клетках мыши с C151S ответ на tBHQ слабый (Takaya 2012). В модели tBHQ превращается в хинон со скоростью, принятой допущением; на схеме показан образовавшийся электрофил TBQ.", "gn_n_dmf": "Диметилфумарат (DMF)", "g_n_dmf": "Диметилфумарат — препарат для лечения рассеянного склероза. Его метаболит монометилфумарат модифицирует цистеин C151 белка KEAP1 (Linker 2011), а сам диметилфумарат в клетках модифицирует цистеины KEAP1 заметнее, чем моноэтилфумарат (Brennan 2015). В клетках мыши с C151S ответ на диметилфумарат слабый (Takaya 2012). Клинический эффект через NRF2 не доказан: на модели экспериментального аутоиммунного энцефаломиелита у мышей он зависел от Nrf2 (Linker 2011), но в другой работе был одинаков у мышей Nrf2⁻/⁻ (Schulze-Topphoff 2016); описаны и другие мишени, например GAPDH (Kornberg 2018). В модели диметилфумарат — электрофил, реагирующий преимущественно с C151.", "gn_n_hne": "4-гидроксиноненаль (4-HNE)", "g_n_hne": "4-HNE — реакционноспособный алкенал: он модифицирует KEAP1 и активирует ARE в клетках человека (Levonen 2004; тип клеток в реферате не указан). По данным моделирования и филогенетического анализа алкеналы воспринимает цистеин C288 (McMahon 2010); остаток, с которым реагирует именно 4-HNE, в реферате Levonen 2004 не назван. Поэтому в модели 4-HNE реагирует преимущественно с группой C273 и C288 — это допущение, а не измеренное распределение.", "gn_n_h2o2": "Пероксид водорода (H₂O₂)", "g_n_h2o2": "H₂O₂ — окислитель, а не электрофил, и сенсорами для него служат другие остатки KEAP1: в клетках MEF и HEK293 описано образование дисульфидов между C226, C613, C622 и C624 (Suzuki 2019). Мутант KEAP1 без 11 цистеинов сохранял репрессию NRF2, но не отвечал на цистеин-реактивные индукторы (Suzuki 2019). В модели H₂O₂ реагирует преимущественно с группой прочих цистеинов; в шагах сценария он не используется.", "gn_n_gt_c151s": "KEAP1 C151S", "g_n_gt_c151s": "Мышиный KEAP1, в котором цистеин-151 заменён на серин. Репрессия NRF2 сохранена, мыши жизнеспособны, но экспрессия мишеней в фибробластах снижена и до, и после электрофила (Yamamoto 2008); в модели этого исходного различия нет. Ответ на сульфорафан, tBHQ, диметилфумарат и диэтилмалеат в клетках мыши слабый, а на 15d-PGJ₂, CDDO-Im и CdCl₂ обычный (Takaya 2012). Поэтому вывод «C151 — сенсор» верен для названных соединений, а не для всех индукторов.", "gn_n_gt_ivr": "KEAP1 C273A / C288A", "g_n_gt_ivr": "Замены остатков C273 и C288 области IVR. У трансгенных мышей Keap1(C273A) и Keap1(C288A) не подавляли конститутивную активацию NRF2 при отсутствии Keap1 (Yamamoto 2008): нарушена сама репрессия, поэтому эти замены нельзя называть заменами «нерабочего сенсора». Связывание KEAP1 с NRF2 в клетках при этих заменах сохраняется (Kobayashi 2006). В модели одна запись «C273A/C288A» представляет каждую из этих замен. Для анализа сенсорной функции использовали замены C273W и C288E, сохраняющие репрессию (Saito 2016). В модели остаточная убиквитинирующая активность мутантного KEAP1 принята равной 12 % — допущение.", "gn_n_gt_keap1ko": "Keap1⁻/⁻", "g_n_gt_keap1ko": "Мыши без гена Keap1 погибают после рождения (гиперкератоз пищевода и преджелудка); NRF2 у них активирован конститутивно, и гибель устраняется нокаутом Nrf2 (Wakabayashi 2003). В модели KEAP1-зависимого убиквитинирования нет, сохраняется KEAP1-независимая ветвь (GSK-3, β-TrCP; Rada 2011). Значения NQO1, HMOX1 и GSH в таком состоянии — экстраполяция модели: прямых измерений в источниках этого вопроса нет.", "gn_n_gt_nrf2ko": "Nrf2⁻/⁻", "g_n_gt_nrf2ko": "Мыши Nrf2⁻/⁻ жизнеспособны и дают потомство (Chan 1996). Исходная активность ферментов фазы II (NQO, GST) в их тканях ниже, чем у дикого типа, а индукция олтипразом и другими индукторами почти отсутствует (Ramos-Gomez 2001; McMahon 2001); индукция ферментов фазы II в печени и кишечнике по большей части исчезает (Itoh 1997). Такие мыши более чувствительны к химическому канцерогенезу (Ramos-Gomez 2001). В модели в клетках Nrf2⁻/⁻ остаётся 35 % NQO1 и 10 % HMOX1 исходного уровня, не зависящие от NRF2 (порядок величин взят из этих работ и из Alam 1999).", "gn_n_gt_etge": "NRF2 с заменой в мотиве ETGE", "g_n_gt_etge": "Мотив ETGE домена Neh2 — прочный сайт, которым NRF2 связывается с KEAP1 (Tong 2006; McMahon 2006). Соматические замены в ETGE и DLG описаны при раке лёгкого человека: они нарушают распознавание NRF2 комплексом KEAP1–CUL3 и ведут к накоплению NRF2 (Shibata 2008). KEAP1-независимая деградация через Neh6 сохраняется: NRF2 без ETGE накапливается при ингибировании GSK-3 (Rada 2011). В модели такой NRF2 не связывается с KEAP1, а накопление ограничивает KEAP1-независимая ветвь.", "gn_n_mg132": "MG132", "g_n_mg132": "MG132 — ингибитор протеасомы. В клетках HepG2 при обработке этим препаратом NRF2 накапливался и активность ARE-репортёра повышалась (Nguyen 2003): препарат действует после убиквитинирования, а не на KEAP1. Он неспецифичен: при ингибировании протеасомы повышается и ATF4 (Ye 2014, клетки T24), поэтому рост мишеней нельзя целиком приписать NRF2. В модели MG132 снижает скорость разрушения NRF2; остаточная активность протеасомы принята допущением.", "gn_n_chx": "Циклогексимид", "g_n_chx": "Циклогексимид — ингибитор трансляции. В клетках HepG2 при обработке этим препаратом NRF2 исчезал в течение 30 мин (Nguyen 2003); накопление NRF2 после электрофилов блокировалось циклогексимидом, то есть складывается из вновь синтезированного белка (Kobayashi 2006). Препарат подавляет трансляцию всех мРНК, а не только NRF2. В модели он останавливает синтез NRF2 и белков-мишеней; белки-мишени убывают с постоянной времени 12 ч — допущение, их периоды полужизни в источниках вопроса не приведены.", "gn_n_measure_a": "Как измеряют (продвинутый уровень)", "g_n_measure_a": "Содержание NRF2, KEAP1, NQO1 и HMOX1 определяют иммуноблотом. Полосы на экране рассчитаны по модели, а не измерены: шкала логарифмическая, поскольку сигнал насыщается, а «нет полосы» в опыте означает, что содержание белка ниже предела обнаружения. Актин служит контролем нанесения белка; число полос не является мерой потока. Количество KEAP1 в модели при действии индуктора не меняется, как в опытах Iso 2016 (диэтилмалеат, пять мышиных линий). Модификацию цистеинов определяют масс-спектрометрией очищенного KEAP1 (Dinkova-Kostova 2002; Eggler 2005); долю модифицированных остатков в клетке так не измеряют. Убиквитинирующую активность оценивают по убиквитинированию NRF2 (Kobayashi 2004; Zhang 2004), взаимодействие NRF2 с KEAP1 в живых клетках — методом FLIM-FRET (Baird 2013).", "gn_n_model_a": "Что упрощено (продвинутый уровень)", "g_n_model_a": "Из измерений взяты период полужизни NRF2 (около 13 мин без индуктора и около 100 мин при CdCl₂; Stewart 2003, клетки Hepa) и порядок событий: содержание NRF2 повышается раньше содержания продуктов его генов-мишеней, GSH сначала убывает. Допущения продвинутого уровня: реакционная способность каждого индуктора по трём группам цистеинов (C151; C273 и C288; прочие) подобрана по качественным данным Takaya 2012, Abiko 2011 и McMahon 2010; вклад групп в подавление активности подобран так, чтобы замена C151S давала слабый, но заметный ответ; остаточная активность мутантного KEAP1 (C273A/C288A) принята 12 %; p62 занимает 60 % доменов Kelch; протеасома при MG132 сохраняет 25 % активности; белки-мишени при циклогексимиде убывают с постоянной времени 12 ч; доля NQO1 (35 %) и HMOX1 (10 %) не зависит от NRF2. Генотипы и накопление p62 заданы с начала опыта (клетка в их установившемся состоянии), индуктор и препараты добавляются в момент 0. Модель не содержит разрушения KEAP1 аутофагией, обратной связи через ген p62, вклада ATF4 в экспрессию HMOX1 (He 2001; вопрос 1), переноса NRF2 в ядро и из ядра, колебаний NRF2 и клеточной гибели.", "s4_nuc": "Ядро", "s4_o2": "Кислород, % O₂ в газовой фазе", "s4_cof": "Fe(II), 2-ОГ", "s4_syn": "синтез", "s4_prot": "Протеасома", "s4_react": "Реакция PHD (остаток Pro → Pro-OH)", "s4_akg": "2-оксоглутарат", "s4_suc": "сукцинат", "s4_tg": "мишени", "s4_how": "Как измеряют", "s4_lim": "Что упрощено", "lg_h_site": "кружок на HIF-1α — остаток для гидроксилирования (Pro402, Pro564, Asn803); значок «OH» над ним тем темнее, чем выше доля гидроксилирования", "lg_h_hif": "заливка полосы HIF-1α — его содержание на логарифмической шкале: чем темнее, тем больше относительно нормоксии", "fn_h_akg": "2-оксоглутарат (2−)", "fn_h_suc": "сукцинат (2−)", "fn_h_fum": "фумарат (2−)", "fn_h_asc": "L-аскорбат (1−)", "fn_h_dmog": "DMOG (диметилоксалилглицин)", "s4_r_h564": "Гидроксилирование Pro564: расчётная доля без pVHL-зависимого разрушения", "s4_r_h803": "Гидроксилирование Asn803: расчётная доля без pVHL-зависимого разрушения", "s4_r_hif": "HIF-1α (белок), относительно нормоксии", "s4_r_phd": "PHD2/PHD3 (белок), относительно нормоксии", "s4_r_tg": "Мишени HIF (мРНК), относительно нормоксии", "s4_o2_c": "Кислород (% O₂ в газовой фазе)", "s4_vhl_c": "pVHL", "s4_vhl_wt": "есть", "s4_vhl_ko": "дефицит", "s4b_ref": "Серая риска на полосе — эталон: клетка с pVHL при 21 % O₂ (кнопка «Сбросить»). Содержание HIF-1α, мишеней и гидроксилированного по Pro564 белка — на логарифмической шкале, ×1 — нормоксия. Гидроксилирование Pro564 — расчётная доля синтезированных молекул HIF-1α, у которых PHD успевают гидроксилировать этот остаток, если учтено только медленное разрушение, не зависящее от pVHL: показание характеризует работу PHD, а не количество гидроксилированного белка (учебная модель, установившееся состояние; подробнее — «Как измеряют»).", "s4b_take": "Кислород — косубстрат PHD: чем его меньше, тем реже гидроксилируются Pro402 и Pro564, тем реже pVHL узнаёт молекулы HIF-1α и тем выше содержание HIF-1α. Дефицит pVHL разрывает эту связь: гидроксилирование продолжается, но HIF-1α не разрушается быстро и остаётся высоким при любом O₂ — так называют псевдогипоксию, состояние, имитирующее гипоксию.", "s4b_c_norm": "При {o} O₂ PHD гидроксилируют HIF-1α по Pro402 и Pro564 (расчётная доля гидроксилирования Pro564 — {h}), pVHL связывает гидроксилированный белок, и протеасома быстро его разрушает. Относительно нормоксии: HIF-1α {x}, мишени HIF {g}.", "s4b_c_norm_z": "Период полужизни HIF-1α в нормоксии составляет минуты (5–8 мин: Berra 2001); при таком малом содержании белка гены-мишени HIF не индуцированы.", "s4b_c_mild": "При {o} O₂ расчётная доля гидроксилирования Pro564 составляет {h}: PHD не насыщены кислородом, и скорость их реакции следует за O₂ почти линейно. Доля молекул, которые узнаёт pVHL, уменьшается, и содержание HIF-1α повышено ({x}); мишени HIF {g}.", "s4b_c_mild_z": "Km PHD по O₂ чуть выше атмосферной концентрации (Hirsilä 2003), поэтому уже умеренное снижение O₂ меняет содержание HIF-1α; ответ мишеней в модели имеет порог (допущение), и слабый рост HIF-1α их почти не активирует.", "s4b_c_hyp": "При {o} O₂ расчётная доля гидроксилирования Pro564 снижена до {h}: HIF-1α разрушается медленнее, и его содержание повышено ({x}). HIF-1α в ядре образует гетеродимер с ARNT и активирует гены-мишени ({g}).", "s4b_c_hyp_z": "Гетеродимер HIF-1α/ARNT связывается с HRE и повышает экспрессию генов-мишеней: VEGF (ангиогенез), GLUT1 (поглощение глюкозы) и генов ферментов гликолиза — так O₂ связан с метаболизмом и снабжением тканей.", "s4b_c_sev": "При {o} O₂ расчётная доля гидроксилирования Pro564 снижена до {h}, содержание HIF-1α высоко ({x}), экспрессия генов-мишеней HIF значительно повышена ({g}).", "s4b_c_sev_z": "При тяжёлой гипоксии ответ мишеней в модели приближается к предельному (×10, допущение); в клетках предел зависит от гена и типа клеток (Hu 2003).", "s4b_c_vhl": "Без pVHL (при {o} O₂) PHD гидроксилируют Pro564 (расчётная доля {h}), но гидроксилированный HIF-1α не узнаётся убиквитинлигазой и быстро не разрушается. Содержание HIF-1α {x}, мишени HIF {g}; смена O₂ их почти не меняет.", "s4b_c_vhl_z": "Потеря pVHL разрывает связь гидроксилирования с разрушением: в клетках почечно-клеточного рака с мутацией VHL HIF-α стабилен при любом O₂ (Maxwell 1999), а восстановление pVHL подавляет гены-мишени в нормоксии (Iliopoulos 1996).", "p4b_1_q": "В клетках с pVHL при 21 % O₂ содержание HIF-1α низкое. Кислород в газовой фазе снижают до 1 %. Как изменится содержание HIF-1α?", "p4b_1_o1": "Не изменится: синтез HIF-1α не зависит от содержания O₂ в клетке.", "p4b_1_o2": "Возрастёт: меньше молекул гидроксилируется и узнаётся pVHL.", "p4b_1_o3": "Снизится: для образования белка HIF-1α необходим молекулярный O₂.", "p4b_1_k": "При меньшем O₂ снижается скорость реакции PHD, для которой O₂ служит косубстратом: гидроксилируется меньше молекул HIF-1α, pVHL связывает их реже, и белок дольше остаётся в клетке.", "p4b_1_e": "В модели при 1 % O₂ гидроксилирование Pro564 снижается с 97 % до 73 %, содержание HIF-1α растёт с ×1,0 до ×5,7, мишени HIF — до ×3,3 (установившееся состояние при постоянном O₂; обратная связь через PHD2/3 на базовом уровне не включена). Кислород, при котором в модели достигается половина предельного накопления HIF-1α, по порядку величины согласуется с измерениями в клетках HeLa (Jiang 1996), а период полужизни HIF-1α в нормоксии, заложенный в модель (около 7 мин), — с измеренными 5–8 мин (Berra 2001). Содержание O₂ в газовой фазе не равно содержанию O₂ у клеток: в обычной посуде O₂ в среде уравновешивается дольше трёх часов (Allen 2001).", "p4b_1_w1": "Синтез HIF-1α идёт и в нормоксии, и в гипоксии (мРНК HIF-1α присутствует в клетках постоянно: Huang 1996), но содержание белка задают синтез и разрушение вместе. В нормоксии разрушение занимает минуты, в гипоксии оно замедляется, поэтому постоянный синтез не означает постоянного содержания.", "p4b_1_w3": "В этом пути O₂ расходуется в реакции PHD, которая метит уже синтезированный белок для разрушения; в модели синтез HIF-1α от O₂ не зависит (мРНК HIF-1α присутствует в клетках постоянно: Huang 1996). При низком O₂ синтез идёт, а разрушение замедляется, поэтому содержание белка растёт, а не падает.", "p4b_2_q": "При 21 % O₂ сравнивают клетки с pVHL и клетки без pVHL. Содержание PHD в обоих вариантах этой модели принято одинаковым. Изменяет ли отсутствие pVHL саму способность PHD гидроксилировать Pro564 в HIF-1α?", "p4b_2_o1": "Не изменяет: PHD гидроксилируют Pro и без pVHL.", "p4b_2_o2": "Снижает: pVHL необходим для гидроксилирования Pro564.", "p4b_2_o3": "Повышает: гидроксилированный HIF-1α накапливается.", "p4b_2_k": "pVHL действует после PHD: PHD гидроксилируют Pro независимо от pVHL, а pVHL связывает уже гидроксилированный HIF-1α и направляет его на убиквитинирование. Без pVHL гидроксилирование идёт как прежде, но HIF-1α быстро не разрушается.", "p4b_2_e": "Расчётная доля гидроксилирования Pro564, характеризующая работу PHD, остаётся равной 97 %, но содержание HIF-1α растёт с ×1,0 до ×25, количество Pro564-OH-HIF-1α — с ×1,0 до ×70, а мишеней HIF — с ×1,0 до ×8,0: без pVHL остаётся только медленное разрушение, не зависящее от O₂ (в модели период полужизни около 200 мин по Moroz 2009). Отсутствие pVHL не меняет реакцию PHD, но убирает быстрое разрушение гидроксилированного белка, поэтому его количество растёт. В клетках RCC4 без VHL при 21 % O₂ Pro402, Pro564 и Asn803 гидроксилированы почти полностью (Tian 2011).", "p4b_2_w2": "Гидроксилируют Pro ферменты PHD (Fe(II)- и 2-оксоглутарат-зависимые диоксигеназы), а pVHL — субстрат-узнающая субъединица убиквитинлигазы. Потеря pVHL убирает следующее звено, узнавание гидроксипролина, но не саму реакцию PHD (Ivan 2001; Jaakkola 2001).", "p4b_2_w3": "Этот вариант смешивает работу PHD с накоплением продукта реакции. Отсутствие pVHL не устраняет гидроксилирование Pro564, но замедляет разрушение гидроксилированного HIF-1α, поэтому его количество возрастает. Доля Pro564-OH среди присутствующих молекул HIF-1α тоже может возрасти при неизменной активности PHD. Для интерпретации опыта нужно отдельно называть активность фермента, количество гидроксилированного белка и его долю.", "p4b_3_q": "В клетках без pVHL при 21 % O₂ содержание HIF-1α высокое. Кислород в газовой фазе снижают до 1 %. Как изменится содержание HIF-1α?", "p4b_3_o1": "Возрастёт: меньше O₂ — меньше гидроксилирования и разрушения.", "p4b_3_o2": "Снизится: pVHL нужен для накопления HIF-1α в гипоксии.", "p4b_3_o3": "Почти не изменится: без pVHL разрушение не зависит от O₂.", "p4b_3_k": "Без pVHL гидроксилированный HIF-1α не узнаётся убиквитинлигазой, поэтому быстрое разрушение не происходит при любом O₂. Снижение O₂ уменьшает гидроксилирование, но содержание HIF-1α от этого почти не растёт: оно и так близко к предельному.", "p4b_3_e": "Гидроксилирование Pro564 снижается с 97 % до 73 %, а содержание HIF-1α остаётся на уровне ×25; мишени HIF меняются лишь с ×8,0 до ×8,2. В клетках почечно-клеточного рака без pVHL HIF-α стабилен в нормоксии, а возврат pVHL восстанавливает его O₂-зависимое разрушение (Maxwell 1999). В модели HIF-1α в таких клетках ограничен только медленным разрушением; в реальных клетках содержание HIF-1α зависит и от синтеза, который в модели постоянен (например, от передачи сигнала через mTOR: Laughner 2001).", "p4b_3_w1": "Рост содержания HIF-1α при гипоксии идёт через замедление гидроксилирования и последующего pVHL-зависимого разрушения. Без pVHL второго звена нет: разрушение и так не идёт быстро, а ослабление гидроксилирования ничего не добавляет.", "p4b_3_w2": "pVHL участвует в разрушении HIF-1α, а не в накоплении: он связывает гидроксипролин и ведёт к убиквитинированию. Без pVHL HIF-α стабилен при любом O₂ (Maxwell 1999), поэтому снижение содержания при гипоксии не ожидается.", "s4a_reox": "Вернуть 21 % O₂ на 4-м часе", "s4a_drug": "Воздействие (условная сила, без дозы)", "s4a_asc": "Добавка аскорбата", "s4a_geno": "Генотип клеток", "s4a_d_none": "нет", "drug_dmog": "DMOG", "drug_dfo": "дефероксамин", "drug_co": "CoCl₂", "drug_fum": "эфир фумарата", "drug_suc": "эфир сукцината", "drug_rox": "роксадустат", "drug_mg": "MG132", "s4a_gt_wt": "дикий тип", "s4a_gt_vhl": "VHL⁻/⁻", "s4a_gt_arnt": "ARNT⁻/⁻", "s4a_gt_phd2": "нокдаун PHD2", "s4a_gt_fih0": "нокдаун FIH", "s4a_gt_mut": "HIF-1α P402A/P564A", "s4a_myst_btn": "Загадка: образцы X, Y, Z", "s4a_myst_show": "Показать условия", "s4a_myst_off": "Закрыть загадку", "s4a_drugs_btn": "О воздействиях", "s4a_geno_btn": "О генотипах", "s4a_ref": "Серая риска на полосе — контроль: те же O₂, время и возврат O₂, но без воздействия и без мутации. Pro564 и Asn803 — расчётные доли синтезированных молекул, у которых остаток гидроксилируется, если учтено только медленное разрушение, не зависящее от pVHL; содержание HIF-1α, PHD2/3 и мишеней — на логарифмической шкале, ×1 — нормоксия (21 % O₂, клетки с pVHL). Ось времени — учебная модель.", "s4a_take": "Низкий O₂, DMOG, дефероксамин, Co²⁺, эфир фумарата, роксадустат, блокада протеасомы и потеря pVHL повышают содержание HIF-1α разными путями: снижают активность PHD и FIH, нарушают узнавание pVHL или разрушение в протеасоме. По одному содержанию HIF-1α эти воздействия не различить; различить воздействия помогают гидроксилирование Pro564 и Asn803, содержание мРНК мишеней HIF и обратная связь через PHD2/3. Модель учебная, силы воздействий в ней условны, а блот построен по расчёту: опыт показывает соотношения, но не устанавливает механизм в клетках другого типа и не заменяет измерений.", "s4a_plot1_t": "Содержание во времени, относительно нормоксии (логарифмическая шкала)", "s4a_plot2_t": "Гидроксилирование во времени: расчётная доля синтезированных молекул без pVHL-зависимого разрушения", "s4a_leg_hif": "HIF-1α", "s4a_leg_phd": "PHD2/3", "s4a_leg_tg": "мишени HIF (мРНК)", "s4a_leg_h564": "Pro564", "s4a_leg_h803": "Asn803 (пунктир)", "s4a_unit_h": "время, ч (учебная модель)", "s4a_mark_reox": "возврат O₂", "s4a_blot_t": "Блот (условные интенсивности по модели)", "s4a_blot_add": "Добавить дорожку", "s4a_blot_clear": "Очистить дорожки", "s4a_blot_hint": "«Добавить дорожку» фиксирует текущие условия и момент (не более четырёх дорожек) для сравнения с контролем. Полосы — условные интенсивности по модели; «не видна» означает уровень ниже предела обнаружения, а не нуль. Полосы Pro564-OH и Asn803-OH показывают количество гидроксилированного белка, а не долю.", "s4a_b_hif": "HIF-1α", "s4a_b_oh564": "Pro564-OH", "s4a_b_oh803": "Asn803-OH", "s4a_b_phd": "PHD2/3", "s4a_b_act": "β-актин", "s4a_bd_0": "не видна", "s4a_bd_1": "слабая", "s4a_bd_2": "средняя", "s4a_bd_3": "сильная", "s4a_bd_4": "очень сильная", "s4a_lane_ctl": "Дорожка 1 — контроль: те же O₂, время и возврат O₂, без воздействия и мутации.", "s4a_lane_now": "Дорожка 2 — текущие условия, {t}: {c}.", "s4a_lane_n": "Дорожка {n} — {c}, {t}.", "s4a_sh_ctl": "контр.", "s4a_sh_now": "сейчас", "s4a_sh_ref": "21 %", "s4a_sh_o2": "{o}", "s4a_sh_reox": "→21 %", "s4a_sh_dmog": "DMOG", "s4a_sh_dfo": "DFO", "s4a_sh_co": "Co²⁺", "s4a_sh_fum": "фум.", "s4a_sh_suc": "сукц.", "s4a_sh_rox": "Rox", "s4a_sh_mg": "MG132", "s4a_sh_asc": "Asc", "s4a_sh_vhl": "VHL⁻/⁻", "s4a_sh_arnt": "ARNT⁻", "s4a_sh_phd2": "PHD2↓", "s4a_sh_fih0": "FIH↓", "s4a_sh_mut": "P→A", "s4a_dn_ref": "21 % O₂, без воздействия", "s4a_dn_o2": "{o} O₂", "s4a_dn_reox": "возврат до 21 % O₂ на 4-м часе", "s4a_dn_dmog": "DMOG", "s4a_dn_dfo": "дефероксамин", "s4a_dn_co": "CoCl₂", "s4a_dn_fum": "эфир фумарата", "s4a_dn_suc": "эфир сукцината", "s4a_dn_rox": "роксадустат", "s4a_dn_mg": "MG132", "s4a_dn_asc": "аскорбат", "s4a_dn_vhl": "VHL⁻/⁻ (без pVHL)", "s4a_dn_arnt": "ARNT⁻/⁻", "s4a_dn_phd2": "нокдаун PHD2", "s4a_dn_fih0": "нокдаун FIH", "s4a_dn_mut": "HIF-1α P402A/P564A", "s4a_c_ref": "Исходное состояние: 21 % O₂, клетки с pVHL. PHD гидроксилируют Pro402 и Pro564 (для Pro564 доля {h5}), FIH гидроксилирует Asn803 (доля {h8}); pVHL связывает гидроксилированный HIF-1α, и протеасома быстро его разрушает. Содержание HIF-1α {x}, мишеней HIF {g}.", "s4a_c_ref_z": "В нормоксии HIF-1α синтезируется постоянно, но его период полужизни составляет минуты (5–8 мин: Berra 2001), поэтому гены-мишени HIF не индуцированы. Все воздействия сравнивают с этим состоянием.", "s4a_c_t0": "Курсор времени стоит на 0 ч: условия опыта заданы ({list}). Доли гидроксилирования определяются скоростью реакций PHD и FIH в этих условиях: Pro564 — {h5}, Asn803 — {h8}. Содержание HIF-1α ({x}), PHD2/3 ({p}) и мишеней HIF ({g}) меняется во времени: запустите часы или передвиньте курсор.", "s4a_c_t0_z": "Гидроксилирование меняется сразу после смены условий (в клетках RCC4 после реоксигенации — не более чем за минуту: Tian 2011), а содержание белков — по мере их синтеза и разрушения. Поэтому по доле гидроксилирования в момент 0 ч нельзя судить о содержании HIF-1α в тот же момент.", "s4a_c_o2": "При {o} O₂ реакция PHD, для которой O₂ служит косубстратом, идёт медленнее: гидроксилирование Pro564 составляет {h5}, Asn803 — {h8} (в модели Km FIH по O₂ принят ниже, чем у PHD: Koivunen 2004). К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_o2_z": "Снижение O₂ уменьшает долю молекул HIF-1α, получающих метку Pro-OH и узнаваемых pVHL, и белок накапливается (Jaakkola 2001; Berra 2003). PHD2 и PHD3 индуцируются HIF (Berra 2003; Stiehl 2006): при длительной гипоксии рост их содержания ограничивает накопление HIF-1α — это обратная связь.", "s4a_c_dmog": "DMOG — аналог 2-оксоглутарата: он конкурирует с ним в активном центре 2-оксоглутарат-зависимых диоксигеназ, и ингибируются обе гидроксилазы. Гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}: Asn-гидроксилирование подавлено сильнее. К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_dmog_z": "При DMOG гидроксилирование Asn803 подавлено сильнее пролилового, а при умеренной гипоксии порядок обратный: в клетках RCC4 при 0,5 % O₂ Asn803 остаётся гидроксилированным лучше, чем Pro (Tian 2011). DMOG действует и на другие 2-оксоглутарат-зависимые ферменты и угнетает дыхание (Zhdanov 2015), поэтому опыт показывает эффект вещества в целом, а не только торможение PHD.", "s4a_c_dfo": "Дефероксамин связывает железо и снижает содержание Fe(II) — кофактора PHD и FIH. Гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}; степень влияния на FIH в модели задана допущением. К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_dfo_z": "Дефероксамин — хелатор железа, а не аналог 2-оксоглутарата: добавка железа отменяет его действие на HIF, а очищенную PHD2 in vitro он ингибирует слабо (Wang 1993a; Hirsilä 2005). Поэтому его нельзя называть прямым ингибитором PHD.", "s4a_c_co": "Co²⁺ подавляет пролилгидроксилирование (Pro564 — {h5}) и препятствует связыванию pVHL с кислород-зависимым доменом HIF-α даже при гидроксилированном Pro (Yuan 2003); Asn803 остаётся гидроксилированным ({h8}). К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_co_z": "Миметики гипоксии — аналог 2-оксоглутарата, хелатор железа и Co²⁺ — действуют разными механизмами и по-разному влияют на Pro- и Asn-гидроксилирование (Tian 2011): общий итог, рост HIF-1α, не означает общий механизм.", "s4a_c_fum": "Проницаемый эфир фумарата — конкурент 2-оксоглутарата в реакции PHD: гидроксилирование Pro564 составляет {h5}. FIH фумарат in vitro не ингибирует, и Asn803 остаётся гидроксилированным ({h8}). К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_fum_z": "Накопление фумарата при потере фумаратгидратазы рассматривают как один из механизмов псевдогипоксии (Koivunen 2007), но фумарат действует и на другие 2-оксоглутарат-зависимые ферменты (Xiao 2012), а образование кист у мышей с потерей Fh1 не зависит от пути HIF/PHD: в этих опытах отмечали сукцинирование KEAP1 и активацию NRF2 (Adam 2011; вопрос 3). Псевдогипоксия не равна эффекту Варбурга — аэробному гликолизу.", "s4a_c_suc": "Проницаемый эфир сукцината в опытах HIF-1α не стабилизировал (Koivunen 2007): гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}, содержание HIF-1α {x}, мишеней HIF {g}. Сам сукцинат — продукт реакции PHD и ингибирует её слабее фумарата.", "s4a_c_suc_z": "Сукцинат in vitro конкурентно ингибирует PHD (Selak 2005; Koivunen 2007), но эфир сукцината HIF-1α в опытах не стабилизировал, поэтому накопление разных метаболитов нельзя считать одинаковым эффектом на PHD.", "s4a_c_rox": "Роксадустат — ингибитор PHD, конкурирующий с 2-оксоглутаратом: гидроксилирование Pro564 составляет {h5}, Asn803 — {h8} (влияние на FIH в использованных работах не описано, в модели оно слабое). К моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}.", "s4a_c_rox_z": "Ингибиторы PHD применяют при анемии, связанной с хронической болезнью почек, так как стабилизация HIF-α повышает образование эритропоэтина (Yeh 2017). Разрешённые препараты и популяции различаются по странам: дапродустат одобрен FDA 2023 для взрослых на диализе не менее четырёх месяцев, роксадустат разрешён в ЕС (EMA 2021) в том числе без диализа; статус проверяйте на текущую дату.", "s4a_c_mg": "MG132 блокирует протеасому: гидроксилированный HIF-1α разрушается медленнее и накапливается (к моменту {t} {x}), а гидроксилирование Pro564 ({h5}) и Asn803 ({h8}) не нарушено. Мишени HIF {g}: в модели накопленный таким способом HIF-1α малоактивен, как в опытах Kallio 1999 с репортёрными генами.", "s4a_c_mg_z": "Накопление HIF-1α и его транскрипционная активность — разные величины. Вывод о малой активности основан на репортёрных генах в определённых клетках (Kallio 1999) и не переносится автоматически на все гены-мишени.", "s4a_c_asc": "Аскорбат стимулирует PHD и FIH, но для реакции не обязателен (Flashman 2010): гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}. К моменту {t} содержание HIF-1α {x}, мишеней HIF {g}.", "s4a_c_asc_z": "В опытах Knowles 2003 на линиях рака аскорбат снижал содержание HIF-1α и экспрессию мишеней; такой эффект ожидается в культурах, где активность гидроксилаз ограничена. Аскорбат не заменяет ни O₂, ни 2-оксоглутарат.", "s4a_c_vhl": "В клетках без pVHL (VHL⁻/⁻) при 21 % O₂ PHD и FIH сохраняют активность: Pro564 гидроксилируется на {h5}, Asn803 — на {h8}, но убиквитинлигаза не узнаёт гидроксилированный HIF-1α, и остаётся лишь медленное разрушение. Содержание HIF-1α {x}, мишеней HIF {g}.", "s4a_c_vhl_z": "Так ведут себя клетки почечно-клеточного рака с потерей VHL, например RCC4: HIF-α стабилен в нормоксии (Maxwell 1999), а Pro402, Pro564 и Asn803 гидроксилированы почти полностью (Tian 2011). Потеря VHL не сводится к росту HIF: у pVHL есть HIF-независимые функции (Clifford 2001). В модели при VHL⁻/⁻ содержание PHD2/3 фиксировано на исходном уровне — это отдельное допущение. В RCC4 удельная активность гидроксилаз за 7 сут дополнительно не повышалась, но содержание PHD2 и PHD3 уже было конститутивно повышено (Tian 2011). В клетках с pVHL HIF индуцирует экспрессию PHD2 и PHD3 (Berra 2003).", "s4a_c_arnt": "Без ARNT HIF-1α не образует гетеродимер и не активирует гены-мишени. При 21 % O₂ гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}, содержание HIF-1α {x}, мишеней HIF {g}.", "s4a_c_arnt_z": "Без ARNT гены ответа на низкий O₂ не индуцируются (Maltepe 1997), но ARNT — общий партнёр и других факторов, в частности AHR, поэтому фенотип нельзя целиком приписывать HIF. Различие с контролем заметнее при низком O₂.", "s4a_c_phd2": "Нокдаун PHD2 снижает содержание фермента (показано PHD2/3 {p} относительно нормоксии): гидроксилирование Pro564 составляет {h5}, содержание HIF-1α {x}, мишеней HIF {g}. Asn803 гидроксилируется на {h8}.", "s4a_c_phd2_z": "PHD2 — основная изоформа, задающая низкий уровень HIF-1α в нормоксии: нокдаун PHD2 стабилизирует HIF-1α, а нокдаун PHD1 или PHD3 — нет (Berra 2003); вклад изоформ зависит от клеток (Appelhoff 2004). В модели PHD2 и PHD3 объединены в один пул.", "s4a_c_fih0": "При нокдауне FIH Asn803 гидроксилируется на {h8}, Pro564 — на {h5}: остатки Pro гидроксилируются ферментами PHD. Содержание HIF-1α {x}, мишеней HIF {g}. В модели FIH меняет активность HIF-1α (связывание p300/CBP), но не его стабильность, а при малом содержании HIF-1α эффект на мишени невелик.", "s4a_c_fih0_z": "Нокдаун FIH повышал экспрессию части мишеней HIF в нормоксии и при тяжёлой гипоксии, но не при аноксии (Stolze 2004; Dayan 2006). Влияние на стабильность HIF-α в использованных работах не описано. Заметный эффект на мишени в модели виден при низком O₂.", "s4a_c_mut": "В HIF-1α P402A/P564A нет остатков Pro, которые гидроксилирует PHD (Pro564 — {h5}); Asn803 гидроксилируется на {h8}. pVHL не связывает такой белок, остаётся лишь медленное разрушение, и содержание HIF-1α {x}, мишеней HIF {g}.", "s4a_c_mut_z": "Каждый из двух остатков Pro по отдельности направляет HIF-1α к pVHL (Masson 2001), поэтому для стабилизации белка нужна замена обоих; данные получены при гиперэкспрессии. Рост PHD2/3 ({p}) в модели — следствие индукции HIF.", "s4a_c_o2_fih0": "При {o} O₂ и нокдауне FIH Asn803 гидроксилируется на {h8}: действие низкого O₂ дополнительно усиливается снижением содержания FIH. Гидроксилирование Pro564 составляет {h5}. К моменту {t} содержание HIF-1α {x}, мишеней HIF {g}; для сравнения — контроль (серые метки).", "s4a_c_o2_fih0_z": "В модели FIH меняет активность HIF-1α, но не его стабильность; различие содержания HIF-1α с контролем возникает косвенно, через индукцию PHD2/3. Мишени HIF при нокдауне выше, так как p300/CBP связывается с негидроксилированным Asn803 (Lando 2002a; Stolze 2004).", "s4a_c_o2_reox": "К моменту {t} O₂ возвращён до 21 % (возврат на 4-м часе, до этого — {o} O₂): гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}. После возврата содержание HIF-1α уменьшается за минуты и сейчас составляет {x}; PHD2/3 — {p}. Мишени HIF ({g}) снижаются позже (в модели это допущение).", "s4a_c_o2_reox_z": "Гидроксилирование восстанавливается в течение минуты после возврата O₂ (Tian 2011), а период полужизни HIF-1α в нормоксии составляет 5–8 мин (Berra 2001): накопленный белок не защищён от гидроксилирования и быстро разрушается.", "s4a_c_multi": "Включено несколько воздействий: {list}. Гидроксилирование Pro564 составляет {h5}, Asn803 — {h8}; к моменту {t} содержание HIF-1α {x}, PHD2/3 {p}, мишеней HIF {g}. Вклад каждого воздействия определяют сравнением с контролем (серые метки: те же O₂ и время, но без препарата, добавки и мутации) и сменой одного воздействия за раз.", "s4a_c_multi_z": "Рамки на схеме показывают, какие ферменты и этапы заторможены. Два воздействия на один фермент, например низкий O₂ и DMOG на PHD, в модели действуют сильнее каждого по отдельности.", "s4a_myst_t": "Блот: контроль и образцы X, Y, Z (4 ч)", "s4a_myst_line": "Образец {n}: {b}.", "s4a_myst_line2": "Образец {n} — {c}: {b}.", "s4a_myst_hint": "Сопоставьте образцы с контролем: HIF-1α, гидроксилированные формы (Pro564-OH, Asn803-OH) и PHD2/3. «Не видна» означает уровень ниже предела обнаружения, а не нуль. Полосы — условные интенсивности по модели.", "s4a_myst_reads": "Графики скрыты: для ответа в загадке используйте блот, который показан вместо схемы (контроль и образцы X, Y, Z, 4 ч).", "s4a_myst_hint2": "Условия образцов раскрыты. Сверьте свой выбор с подписями дорожек и с признаками, которые различают образцы.", "s4a_c_myst": "Загадка. На блоте — контроль (клетки с pVHL, 21 % O₂) и три образца X, Y, Z, полученные после 4 ч инкубации в разных условиях; условия образцов скрыты. Блот закрывает схему; полосы — условные интенсивности по модели.", "s4a_c_myst_z": "Образцы различают по сочетанию полос: разные воздействия могут приводить к близкому содержанию HIF-1α. Полосы гидроксилированных форм показывают, какое звено нарушено: гидроксилирование, узнавание pVHL или разрушение.", "s4a_c_myst2": "Условия образцов раскрыты: они указаны в заголовках дорожек и в строках под блотом.", "s4a_c_myst2_z": "Без pVHL накапливаются HIF-1α и его гидроксилированные формы: ферменты активны, но метка не ведёт к разрушению. При 1 % O₂ и в присутствии DMOG содержание HIF-1α близко, а различает их полоса Asn803-OH: DMOG подавляет гидроксилирование Asn803 сильнее, чем снижение O₂ (Tian 2011, клетки RCC4).", "s4a_ctl_21": "контроль", "s4a_ctl_1": "контроль", "s4a_ctl_nx": "21 % O₂", "s4a_when_21": "Контроль — те же клетки без воздействия. Прогноз на момент 4 ч после добавления; ось времени — учебная модель.", "s4a_when_f": "Контроль — тот же опыт без нокдауна FIH. Прогноз на момент 1 ч после начала гипоксии; ось времени — учебная модель.", "s4a_when_t": "Прогноз на момент 24 ч после начала гипоксии (до — момент 0 ч); контроль — нормоксия к тому же сроку; ось времени — учебная модель.", "s4a_when_r": "Сравнение на 5-м часе: гипоксия продолжается (до) или O₂ возвращён на 4-м часе (после); контроль — нормоксия; ось времени — учебная модель.", "s4a_when_m": "Все образцы получены за 4 ч; интенсивности полос — условные, по модели; ось времени — учебная модель.", "p4a_1_q": "В клетках с pVHL при 21 % O₂ добавляют DMOG — аналог 2-оксоглутарата. Как изменится гидроксилирование Asn803 в HIF-1α через 4 ч?", "p4a_1_o1": "Заметно снизится: DMOG конкурирует с 2-оксоглутаратом и в реакции FIH.", "p4a_1_o2": "Не изменится: FIH не использует 2-оксоглутарат, и DMOG на него не влияет.", "p4a_1_o3": "Снизится слабо: FIH менее чувствителен к ингибиторам, чем PHD.", "p4a_1_k": "DMOG структурно сходен с 2-оксоглутаратом и конкурирует с ним в активном центре 2-оксоглутарат-зависимых диоксигеназ. К ним относится и FIH: при его ингибировании Asn803 остаётся негидроксилированным, и p300/CBP связывается с HIF-1α.", "p4a_1_e": "Через 4 ч с DMOG гидроксилирование Asn803 в модели снижается с 99 % до 26 %, а Pro564 — с 97 % до 80 %: ингибируются обе группы ферментов, но Asn-гидроксилирование сильнее. Содержание HIF-1α растёт с ×1,0 до ×4,6, мишени HIF — до ×2,8, PHD2/3 — до ×1,6 (индукция HIF). В клетках RCC4 DMOG тоже подавлял гидроксилирование Asn803 сильнее, чем Pro402 и Pro564 (Tian 2011; 1 мМ DMOG, 4–5 ч), а в модели сила воздействия — условный коэффициент. DMOG не специфичен к PHD и угнетает дыхание (Zhdanov 2015).", "p4a_1_w2": "FIH, как и PHD, — Fe(II)- и 2-оксоглутарат-зависимая диоксигеназа (Koivunen 2004), и 2-оксоглутарат нужен ей так же. Пропущено звено: общий косубстрат PHD и FIH, поэтому его аналог ингибирует обе гидроксилазы.", "p4a_1_w3": "Меньшая чувствительность FIH относится к снижению O₂ (Km FIH по O₂ ниже, чем у PHD: Koivunen 2004), а не к конкуренции за 2-оксоглутарат. Пропущено звено: O₂ и 2-оксоглутарат — разные косубстраты, и устойчивость к одному воздействию не означает устойчивость к другому.", "p4a_2_q": "В клетках с pVHL при 21 % O₂ добавляют CoCl₂. Как изменится гидроксилирование Asn803 в HIF-1α через 4 ч?", "p4a_2_o1": "Снизится почти полностью: Co²⁺ замещает Fe(II) в активных центрах гидроксилаз.", "p4a_2_o2": "Снизится частично: Co²⁺ ослабляет активность PHD и FIH в одинаковой степени.", "p4a_2_o3": "Почти не изменится: Co²⁺ нарушает гидроксилирование Pro и узнавание pVHL.", "p4a_2_k": "Co²⁺ подавляет гидроксилирование остатков Pro и препятствует связыванию pVHL с кислород-зависимым доменом, а Asn-гидроксилирование в клетках RCC4 не подавляет (Yuan 2003; Tian 2011). Поэтому HIF-1α накапливается, а Asn803 остаётся гидроксилированным.", "p4a_2_e": "Через 4 ч с CoCl₂ гидроксилирование Asn803 остаётся равным 99 %, Pro564 снижается с 97 % до 86 %, содержание HIF-1α растёт с ×1,0 до ×6,0, мишени HIF — до ×2,1 (PHD2/3 — до ×1,4). Рост HIF-1α больше, чем даёт одно снижение гидроксилирования Pro564: в модели Co²⁺ дополнительно препятствует связыванию pVHL с гидроксилированным HIF-α (Yuan 2003). Сила воздействия в модели условна; в клетках RCC4 Co²⁺ подавлял пролилгидроксилирование, но не Asn-гидроксилирование (Tian 2011).", "p4a_2_w1": "В клетках RCC4 получен обратный результат: Co²⁺ подавлял гидроксилирование Pro, а Asn803 оставался гидроксилированным (Tian 2011). Пропущено звено: не всякий миметик гипоксии действует на обе гидроксилазы; механизмы различаются (аналог 2-оксоглутарата, хелатор железа, Co²⁺).", "p4a_2_w2": "Co²⁺ действует на PHD и FIH неодинаково, и часть его эффекта на HIF-1α не связана с гидроксилированием: Co²⁺ связывается с кислород-зависимым доменом HIF-α и блокирует связывание pVHL (Yuan 2003). Пропущено звено: у одного вещества может быть несколько точек приложения.", "p4a_3_q": "В клетках с pVHL при 21 % O₂ добавляют проницаемый эфир фумарата. Как изменится содержание HIF-1α через 4 ч?", "p4a_3_o1": "Не изменится: фумарат — метаболит цикла Кребса, а не участник реакции PHD.", "p4a_3_o2": "Возрастёт: фумарат конкурирует с 2-оксоглутаратом за активный центр PHD.", "p4a_3_o3": "Снизится: больше метаболитов цикла Кребса — больше 2-оксоглутарата для PHD.", "p4a_3_k": "Фумарат структурно сходен с 2-оксоглутаратом и конкурирует с ним в активном центре PHD (Koivunen 2007): гидроксилирование Pro снижается, pVHL узнаёт меньше молекул HIF-1α, и белок накапливается.", "p4a_3_e": "Через 4 ч в модели гидроксилирование Pro564 снижается с 97 % до 79 %, содержание HIF-1α растёт с ×1,0 до ×4,5, мишени HIF — до ×1,7; гидроксилирование Asn803 остаётся равным 99 %, так как FIH фумарат in vitro не ингибирует (Koivunen 2007). Конкуренция показана in vitro: Ki фумарата 50–80 мкМ, сукцината 350–460 мкМ, а эфиры сукцината HIF-1α в опытах не стабилизировали (Koivunen 2007). Накопление фумарата при потере фумаратгидратазы — один из механизмов псевдогипоксии, но фумарат действует и на другие 2-оксоглутарат-зависимые ферменты (Xiao 2012). Псевдогипоксия при накоплении фумарата не равна эффекту Варбурга (аэробному гликолизу).", "p4a_3_w1": "Фумарат — метаболит цикла Кребса, но он структурно сходен с 2-оксоглутаратом и in vitro конкурентно ингибирует PHD (Koivunen 2007). Пропущено звено: вещества, похожие на косубстрат, могут менять активность фермента.", "p4a_3_w3": "Фумарат не повышает содержание 2-оксоглутарата: он конкурирует с ним за активный центр. Пропущено звено: рост концентрации аналога косубстрата ослабляет, а не усиливает реакцию PHD.", "p4a_4_q": "В клетках с pVHL при 21 % O₂ добавляют MG132 — ингибитор протеасомы. Как изменится содержание мРНК мишеней HIF через 4 ч, судя по опытам с репортёрными генами?", "p4a_4_o1": "Возрастёт: накопленный HIF-1α связывается с ARNT и активирует гены-мишени.", "p4a_4_o2": "Снизится: блокада протеасомы подавляет транскрипцию мишеней HIF.", "p4a_4_o3": "Почти не изменится: накопленный HIF-1α в этих опытах гены не активировал.", "p4a_4_k": "MG132 блокирует протеасому: гидроксилированный и убиквитинированный HIF-1α разрушается медленнее и накапливается, а активность PHD и FIH не нарушена. В опытах с репортёрными генами HIF-1α, накопленный при блокаде протеасомы, транскрипцию не активировал (Kallio 1999), поэтому содержание мишеней почти не меняется.", "p4a_4_e": "Через 4 ч с MG132 содержание HIF-1α в модели растёт с ×1,0 до ×8,3, гидроксилирование Pro564 (97 %) и Asn803 (99 %) не меняется, мишени HIF остаются на уровне ×0,98. Малая активность накопленного белка задана допущением по работе Kallio 1999: при повышении содержания HIF-1α ингибиторами протеасомы репортёрные гены не активировались. Условия работы — репортёрные конструкции в определённых клетках; в других системах и для эндогенных генов картина может отличаться, поэтому результат показывает малую активность накопленного белка в этих условиях, но не устанавливает её для всех генов и клеток. Накопление HIF-1α при блокаде протеасомы в нормоксии описано и в работе Salceda 1997.", "p4a_4_w1": "Содержание HIF-1α и его транскрипционная активность — разные величины: в опытах Kallio 1999 с репортёрными генами HIF-1α, накопленный ингибиторами протеасомы, их не активировал. Пропущено звено: накопление белка само по себе не означает активацию транскрипции.", "p4a_4_w2": "Из схемы снижение не следует: MG132 не ингибирует PHD, а его эффект на HIF-1α — накопление. В работе Kallio 1999 описано отсутствие активации репортёров, а не их подавление. Пропущено звено: отсутствие активации и подавление — разные результаты.", "p4a_5_q": "В клетках с pVHL, выдержанных 1 ч при 1 % O₂, содержание HIF-1α повышено. Сравнивают такие же клетки с нокдауном FIH. Как изменится содержание HIF-1α?", "p4a_5_o1": "Почти не изменится: FIH гидроксилирует Asn803 и не метит HIF-1α для pVHL.", "p4a_5_o2": "Возрастёт: Asn803-OH, как и Pro-OH, направляет HIF-1α к связыванию с pVHL.", "p4a_5_o3": "Снизится: FIH необходим для стабилизации HIF-1α при низком содержании O₂.", "p4a_5_k": "FIH гидроксилирует Asn803 в домене активации, и это ослабляет связывание p300/CBP; узнавание HIF-1α белком pVHL определяют гидроксилированные Pro402 и Pro564. Поэтому нокдаун FIH снижает долю Asn803-OH и повышает активность HIF-1α, а скорость его разрушения почти не меняет.", "p4a_5_e": "Через 1 ч при 1 % O₂ нокдаун FIH снижает гидроксилирование Asn803 с 91 % до 34 %, а содержание HIF-1α остаётся на уровне ×3,7; мишени HIF растут с ×1,1 до ×1,3, PHD2/3 — с ×1,0 до ×1,1. В модели FIH меняет активность HIF-1α, но не его стабильность: в использованных работах влияние Asn-гидроксилирования на стабильность не показано, а нокдаун FIH повышал экспрессию части мишеней (Stolze 2004; Dayan 2006). Связь FIH с pVHL (Mahon 2001) в модели не учтена.", "p4a_5_w2": "Метку для pVHL задают гидроксилированные Pro402 и Pro564 (Masson 2001). Asn803 находится в домене активации, и его гидроксилирование ослабляет связывание p300/CBP (Lando 2002a). Пропущено звено: разные остатки HIF-1α гидроксилируют разные ферменты, и последствия различны.", "p4a_5_w3": "Накопление HIF-1α определяется снижением гидроксилирования Pro, а не работой FIH. Без FIH остаток Asn803 остаётся негидроксилированным, p300/CBP связывается, и возрастает активность HIF-1α, а не его содержание. Пропущено звено: содержание и активность — разные величины.", "p4a_6_q": "Клетки с pVHL помещают в 1 % O₂ (момент 0 ч). Как изменится содержание белка PHD2/PHD3 к 24-му часу?", "p4a_6_o1": "Не изменится: содержание белка PHD постоянно, меняется только его активность.", "p4a_6_o2": "Возрастёт: HIF активирует экспрессию генов PHD2 и PHD3 (обратная связь).", "p4a_6_o3": "Снизится: фермент PHD расходуется в реакции с O₂ и не возобновляется.", "p4a_6_k": "Гипоксия повышает содержание HIF-1α, а HIF активирует гены PHD2 и PHD3. Со временем содержание ферментов растёт, гидроксилирование HIF-1α частично восстанавливается, и обратная связь ограничивает накопление HIF-1α (Berra 2003; Stiehl 2006).", "p4a_6_e": "К 24-му часу при 1 % O₂ содержание PHD2/3 в модели растёт с ×1,0 до ×1,7, гидроксилирование Pro564 — с 73 % до 82 %, содержание HIF-1α — с ×1,0 до ×3,9, мишени HIF — до ×2,2. Предельная кратность индукции PHD2/3 и постоянная времени подобраны, а не измерены: в рефератах Stiehl 2006 и Ginouvès 2008 числовых значений нет. Качественно в этих работах при длительной гипоксии растёт содержание PHD и ограничивается накопление HIF-α. В клетках A549 возврат HIF-1α к исходному уровню при длительной гипоксии объясняли иначе — дестабилизацией мРНК (Uchida 2004); в модели такого механизма нет.", "p4a_6_w1": "Активность PHD зависит от O₂, но содержание белка тоже меняется: гены PHD2 и PHD3 входят в число мишеней HIF (Berra 2003; Stiehl 2006). Пропущено звено: обратная связь от HIF к PHD, которая проявляется через часы.", "p4a_6_w3": "PHD — фермент, а не косубстрат: в реакции расходуются O₂ и 2-оксоглутарат, а сам белок после реакции возвращается в исходное состояние. Пропущено звено: различие между катализатором и расходуемым косубстратом; содержание PHD определяют синтез и разрушение белка.", "p4a_7_q": "Клетки с pVHL выдерживают при 1 % O₂. Сравнивают два варианта на 5-м часе: гипоксия продолжается или на 4-м часе O₂ возвращён до 21 %. Как изменится содержание HIF-1α во втором варианте?", "p4a_7_o1": "Останется высоким: накопленные молекулы HIF-1α больше не гидроксилируются.", "p4a_7_o2": "Снизится наполовину: pVHL связывает лишь вновь синтезированные молекулы.", "p4a_7_o3": "Быстро снизится: гидроксилирование возобновится и у накопленных молекул.", "p4a_7_k": "После возврата O₂ реакция PHD возобновляется: гидроксилируются все молекулы HIF-1α, в том числе накопленные. pVHL связывает их, протеасома быстро разрушает, и содержание HIF-1α снижается за время порядка периода полужизни, то есть за минуты.", "p4a_7_e": "На 5-м часе, через 1 ч после возврата O₂, содержание HIF-1α в модели составляет ×0,87 против ×4,7 при продолжающейся гипоксии, а гидроксилирование Pro564 возвращается с 79 % до 98 %. Значение ×0,87 ниже уровня в нормоксии, потому что в модели содержание PHD2/3 после гипоксии ещё повышено (×1,3); это свойство модели, а не экспериментально измеренное снижение ниже исходного уровня. Мишени HIF снижаются медленнее (с ×2,1 до ×1,8): отставание задано постоянной времени модели, данных о нём нет. В клетках RCC4 гидроксилирование после реоксигенации восстанавливалось в течение минуты (Tian 2011), а период полужизни HIF-1α в нормоксии составляет 5–8 мин (Berra 2001).", "p4a_7_w1": "Накопленный HIF-1α не защищён от гидроксилирования: PHD гидроксилируют любую молекулу с доступным остатком Pro, как только появляется O₂. Пропущено звено: метка для pVHL ставится на готовый белок, а не только в момент синтеза.", "p4a_7_w2": "Возраст молекулы не влияет на гидроксилирование: pVHL связывает любую гидроксилированную молекулу HIF-1α, поэтому разрушается и накопленный пул, а не доля, равная новому синтезу. Пропущено звено: накопленный и вновь синтезированный белок подчиняются одной реакции PHD.", "p4a_8_q": "Контрольные клетки с pVHL выдерживали 4 ч при 21 % O₂. Три образца получены за 4 ч в разных условиях, названных в произвольном порядке: 1 % O₂ без добавок в клетках с pVHL; 21 % O₂ и DMOG в клетках с pVHL; 21 % O₂ без добавок в клетках без pVHL. Какому условию соответствует образец Z?", "p4a_8_o1": "21 % O₂ и DMOG в клетках с pVHL.", "p4a_8_o2": "1 % O₂ без добавок в клетках с pVHL.", "p4a_8_o3": "21 % O₂ без добавок в клетках без pVHL.", "p4a_8_k": "В образце Z содержание HIF-1α умеренно повышено, а полос Pro564-OH и Asn803-OH нет. Это соответствует DMOG: аналог 2-оксоглутарата подавляет и PHD, и FIH, причём гидроксилирование Asn803 — сильнее, чем при 1 % O₂ (Tian 2011).", "p4a_8_e": "Образец X — клетки без pVHL: полосы HIF-1α, Pro564-OH и Asn803-OH очень сильные, так как PHD и FIH активны, а гидроксилированный белок не подвергается быстрому разрушению с участием pVHL. Образец Y — 1 % O₂: полосы HIF-1α и Asn803-OH средние, Pro564-OH не видна. Образец Z — DMOG: полоса HIF-1α близка к Y, но Asn803-OH не видна. Признак, различающий Y и Z, — Asn803-OH: в модели DMOG подавляет гидроксилирование Asn803 сильнее, чем снижение O₂ до 1 %. Направление взято из опытов Tian 2011 на клетках RCC4 (при DMOG Asn-гидроксилирование подавлено сильнее пролилового, при умеренной гипоксии — слабее), а сила воздействий в модели условна. Интенсивности полос тоже условны, а «не видна» означает уровень ниже предела обнаружения, не нуль. Поэтому признак указывает на происхождение образца, но не служит окончательным доказательством: в других клетках и при другой дозе DMOG различие может быть иным.", "p4a_8_w2": "При 1 % O₂ FIH ещё гидроксилирует Asn803 (Tian 2011), поэтому в образце Y полоса Asn803-OH сохраняется, а в образце Z её нет. Пропущено звено: сходное содержание HIF-1α не определяет причину; воздействия различают по признакам гидроксилирования.", "p4a_8_w3": "Без pVHL гидроксилированный HIF-1α не подвергается быстрому разрушению с участием pVHL, поэтому в такой клетке сильны все полосы, а в образце Z содержание HIF-1α умеренное и гидроксилированных форм не видно. Пропущено звено: pVHL нужен для разрушения, а не для гидроксилирования.", "gn_h_o2": "Кислород в газовой фазе", "g_h_o2": "Ползунок задаёт содержание O₂ в газовой фазе над культурой клеток (% по объёму); 21 % — условная нормоксия инкубатора. Содержание O₂ у самих клеток ниже и устанавливается не сразу: в обычной посуде равновесие O₂ в среде достигается дольше трёх часов, а потребление O₂ клетками создаёт градиент (Allen 2001; Place 2017). В тканях O₂ ниже, чем в воздухе (Keeley 2019). Шкала ползунка логарифмическая, от 0,1 % до 21 %.", "gn_h_phd": "PHD2 и PHD3: пролилгидроксилазы", "g_h_phd": "PHD (EGLN) — Fe(II)- и 2-оксоглутарат-зависимые диоксигеназы: они гидроксилируют остатки Pro402 и Pro564 в кислород-зависимом домене HIF-1α. В реакции O₂ служит косубстратом, Fe(II) — кофактором, а 2-оксоглутарат декарбоксилируется до сукцината и CO₂ (Jaakkola 2001; Epstein 2001; Bruick 2001). Km PHD по O₂ чуть выше атмосферной концентрации, поэтому скорость реакции приблизительно линейно зависит от содержания O₂ (Hirsilä 2003). PHD2 — основная изоформа, задающая низкий уровень HIF-1α в нормоксии; PHD2 и PHD3 сами индуцируются HIF (Berra 2003; Stiehl 2006).", "gn_h_hif": "HIF-1α и его кислород-зависимый домен", "g_h_hif": "HIF-1α — субъединица гетеродимера HIF; его мРНК присутствует в клетках постоянно, а содержание белка определяется скоростью его разрушения (Huang 1996). Кислород-зависимый домен (ODD, около 200 остатков) задаёт разрушение по убиквитин-протеасомному пути (Huang 1998). PHD гидроксилируют Pro402 и Pro564 человеческого HIF-1α; каждый из двух остатков по отдельности направляет белок к убиквитинированию (Masson 2001). FIH гидроксилирует Asn803 в домене активации, и это ослабляет связывание p300/CBP (Lando 2002a). Нумерация относится к HIF-1α человека; у HIF-2α сайты иные.", "gn_h_pvhl": "pVHL и убиквитинлигаза CRL2", "g_h_pvhl": "pVHL — субстрат-узнающая субъединица убиквитинлигазного комплекса CRL2: она распознаёт гидроксилированный Pro HIF-1α. В состав CRL2 также входят Elongin B, Elongin C, CUL2 и RBX1; комплекс обеспечивает убиквитинирование HIF-1α (Ivan 2001; Jaakkola 2001; Kamura 2000). pVHL не узнаёт негидроксилированный HIF-1α. Потеря pVHL стабилизирует HIF-α при любом O₂ (Maxwell 1999); это наблюдают в клетках почечно-клеточного рака при болезни Гиппеля — Линдау (Latif 1993). У pVHL есть и HIF-независимые функции, например в сборке фибронектинового матрикса (Clifford 2001).", "gn_h_prot": "Протеасома и медленное разрушение", "g_h_prot": "Убиквитинированный HIF-1α разрушает 26S-протеасома; ингибиторы протеасомы повышают содержание HIF-1α в нормоксии (Salceda 1997; Kallio 1999). Пунктирная стрелка — разрушение, не зависящее от O₂ и pVHL: в модели оно медленное (период полужизни около 200 мин по Moroz 2009) и ограничивает содержание HIF-1α, когда быстрый путь нарушен.", "gn_h_react": "Реакция PHD и структуры участников", "g_h_react": "Остаток Pro в HIF-1α + O₂ + 2-оксоглутарат → Pro-OH + сукцинат + CO₂: это окислительное декарбоксилирование 2-оксоглутарата (Jaakkola 2001). Нужны O₂, Fe(II) и 2-оксоглутарат; аскорбат стимулирует реакцию, но не обязателен (Flashman 2010). Показаны анионы, преобладающие при pH около 7. Фумарат и сукцинат конкурируют с 2-оксоглутаратом, фумарат сильнее (Ki in vitro 50–80 мкМ и 350–460 мкМ соответственно; Koivunen 2007).", "gn_h_arnt": "HIF-1α/ARNT и HRE", "g_h_arnt": "HIF-1α образует гетеродимер с ARNT (HIF-1β); обе субъединицы — белки семейства bHLH-PAS (Wang 1995). Гетеродимер связывается с HRE — участками в промоторах и энхансерах генов-мишеней — и активирует их экспрессию. В одних работах уровень ARNT от O₂ не зависит (Huang 1996), в других немного растёт (Wang 1995); в модели ARNT постоянен. Без ARNT гены ответа на низкий O₂ не индуцируются (Maltepe 1997), но ARNT — общий партнёр и других факторов (в частности AHR), поэтому фенотип нельзя целиком приписывать HIF.", "gn_h_tg": "Мишени HIF", "g_h_tg": "Гены-мишени HIF-1 — VEGF, GLUT1 и гены ферментов гликолиза (например, ALDOA, ENO1, LDHA): их активация связывает O₂ с ангиогенезом, поглощением глюкозы и гликолизом (Forsythe 1996; Iliopoulos 1996; Semenza 1996). EPO в организме зависит преимущественно от HIF-2 (Kapitsinou 2010), поэтому на схеме с HIF-1α он не показан. Показание «Мишени HIF» — суммарное содержание мРНК обобщённых мишеней относительно нормоксии; порог ответа и предельная кратность ×10 — допущения модели, у разных генов и клеток они различны (Hu 2003).", "gn_h_fih": "FIH: аспарагингидроксилаза", "g_h_fih": "FIH гидроксилирует Asn803 HIF-1α в домене активации; это блокирует связывание p300/CBP и снижает активность HIF-1α как транскрипционного фактора (Lando 2002a; Lando 2002b; Mahon 2001). Влияние Asn-гидроксилирования на стабильность в использованных работах не показано, и в модели FIH меняет только активность. FIH — тоже Fe(II)- и 2-оксоглутарат-зависимая диоксигеназа; её Km по O₂ около 40 % атмосферного, примерно втрое ниже, чем у PHD (Koivunen 2004). При умеренной гипоксии Asn803 остаётся гидроксилированным лучше, чем Pro, при более глубокой — нет, и чувствительность различается у клеток (Tian 2011; Stolze 2004; Bracken 2006).", "gn_h_p300": "p300/CBP", "g_h_p300": "p300/CBP — коактиваторы транскрипции: они связываются с доменом активации HIF-1α, когда Asn803 не гидроксилирован (Lando 2002a). Замена Asn803 на Ala даёт конститутивное связывание p300 (Lando 2002b). В модели гидроксилирование Asn803 снижает активность HIF-1α на 50 % (допущение: в источниках остаточная активность названа «довольно высокой»).", "gn_h_drugs": "Воздействия: механизмы и ограничения", "g_h_drugs": "У воздействий разные мишени. Общий результат — повышение содержания HIF-1α — не означает общего механизма; при высоких дозах затрагиваются и другие мишени. Сила каждого воздействия в модели задана условным коэффициентом без указания дозы. DMOG — аналог 2-оксоглутарата: он ингибирует PHD и FIH (Asn-гидроксилирование подавляется сильнее пролилового), не специфичен и угнетает дыхание (Tian 2011; Elvidge 2006; Zhdanov 2015; в опытах 1 мМ, 4–5 ч). Дефероксамин — хелатор железа: добавка железа отменяет его эффект, очищенную PHD2 in vitro он ингибирует слабо (Wang 1993a; Hirsilä 2005); влияние на FIH в модели задано допущением. Co²⁺ связывается с кислород-зависимым доменом HIF-α и препятствует связыванию pVHL (Yuan 2003); в клетках RCC4 он подавляет пролил-, но не Asn-гидроксилирование (Tian 2011). Фумарат и сукцинат конкурируют с 2-оксоглутаратом in vitro (фумарат сильнее) и FIH не ингибируют; в клетках HIF-1α стабилизировали эфиры фумарата, но не сукцината (Koivunen 2007). Диметиловый эфир фумарата — диметилфумарат из вопроса 3, электрофил, модифицирующий сенсорные цистеины KEAP1, поэтому его эффект нельзя целиком приписывать PHD; в модели учтено только торможение PHD, а действие обоих метаболитов на другие 2-оксоглутарат-зависимые ферменты (Xiao 2012) не моделируется. Роксадустат — ингибитор PHD, конкурирующий с 2-оксоглутаратом (Yeh 2017). MG132 блокирует протеасому и PHD не ингибирует (Kallio 1999; Salceda 1997). Аскорбат стимулирует гидроксилазы, но не обязателен (Flashman 2010; Knowles 2003).", "gn_h_geno": "Генотипы: что изменено", "g_h_geno": "VHL⁻/⁻ — клетки без pVHL, например почечно-клеточного рака (RCC4): PHD и FIH активны, но HIF-α стабилен при любом O₂ (Maxwell 1999; Tian 2011). В RCC4 удельная активность гидроксилаз за 7 сут дополнительно не росла, однако содержание PHD2 и PHD3 уже было конститутивно повышено (Tian 2011). Фиксированное исходное содержание PHD2/3 при VHL⁻/⁻ — отдельное допущение модели; оно не следует из этих данных. ARNT⁻/⁻ — нет гетеродимера HIF: гены ответа на низкий O₂ не индуцируются (Maltepe 1997). Нокдаун PHD2 стабилизирует HIF-1α в нормоксии, нокдаун PHD1 или PHD3 — нет (Berra 2003); вклад изоформ зависит от клеток (Appelhoff 2004). Показание PHD2/3 при нокдауне PHD2 учитывает снижение содержания фермента (в модели — до одной десятой) на фоне его индукции HIF. Нокдаун FIH повышает экспрессию части мишеней при нормоксии и тяжёлой гипоксии, но не при аноксии (Stolze 2004; Dayan 2006). HIF-1α P402A/P564A — замена обоих Pro на Ala: сайтов гидроксилирования Pro нет, Asn803 не затронут; каждый из двух остатков по отдельности направляет белок к pVHL (Masson 2001), данные получены при гиперэкспрессии.", "gn_h_measure": "Как измеряют", "g_h_measure": "Содержание HIF-1α, его гидроксилированных форм и PHD определяют вестерн-блотом, в том числе с антителами к гидроксилированным остаткам (Tian 2011); мРНК мишеней — количественной ПЦР. Сильный сигнал насыщается, поэтому интенсивность полосы пропорциональна количеству белка лишь приблизительно, а «нет полосы» означает уровень ниже предела обнаружения, а не нуль. На экране различаются три величины. Показание «Гидроксилирование Pro564: расчётная доля» — доля синтезированных молекул, у которых PHD успевают гидроксилировать остаток, если учтено только медленное разрушение, не зависящее от pVHL; такую долю измеряют при блокаде протеасомы или в клетках без pVHL, где гидроксилированный белок не подвергается быстрому разрушению с участием pVHL (Tian 2011). Она характеризует работу PHD и не равна количеству белка. Количество Pro564-OH-HIF-1α — содержание гидроксилированного белка: без pVHL оно растёт, потому что гидроксилированная форма не подвергается быстрому разрушению с участием pVHL. Доля Pro564-OH среди присутствующих молекул HIF-1α в клетках с pVHL намного меньше расчётной доли, потому что гидроксилированная форма исчезает быстро; по расчёту модели при 21 % O₂ она составляет около 34 % в клетках с pVHL и около 97 % без pVHL (число модели, а не измерение). Полосы Pro564-OH и Asn803-OH в блоте продвинутого уровня показывают количество гидроксилированного белка, а не долю.", "gn_h_model": "Что упрощено", "g_h_model": "Модель учебная. HIF-1α синтезируется с постоянной скоростью (Huang 1996); молекула с гидроксилированным Pro402 или Pro564 быстро разрушается при участии pVHL, остальные — медленно (около 200 мин: Moroz 2009). Скорость гидроксилирования подобрана так, чтобы период полужизни в нормоксии составил около 7 мин (измерено 5–8 мин: Berra 2001). Km PHD по O₂ принят чуть выше атмосферного (Hirsilä 2003), Km FIH — 40 % атмосферного (Koivunen 2004). Подобраны и названы допущениями: доли активности PHD на Pro564 и Pro402 (3 : 1), снижение активности HIF-1α при Asn803-OH на 50 %, порог ответа мишеней, предельный рост содержания мРНК мишеней ×10 и белков PHD2/3 ×6, а также силы воздействий. При постоянном целевом уровне отклонение содержания PHD2/3 от него уменьшается вдвое за 6 ч, а отклонение содержания мРНК мишеней — за 3 ч; оба временных параметра также заданы как допущения. Отличие от измерений в RCC4 (Tian 2011): при 0,5 % O₂ модель снижает гидроксилирование всех трёх остатков сильнее, а при 0,1 % оставляет Pro564 и Asn803 более гидроксилированными, чем измерено; шкалу O₂ для подгонки не сдвигали, иначе нарушился бы измеренный порядок Pro402, Pro564, Asn803. Не моделируются: HIF-2α и HIF-3α, mTOR и регуляция синтеза HIF-1α, диффузия и потребление O₂ клеткой, связь FIH с pVHL (Mahon 2001), роль активных форм кислорода (спорна: Chandel 2000; Chua 2010).", "src_001": "Abiko Y. et al. Participation of covalent modification of Keap1 in the activation of Nrf2 by tert-butylbenzoquinone, an electrophilic metabolite of butylated hydroxyanisole. Toxicol Appl Pharmacol. 2011;255:32–9. doi:10.1016/j.taap.2011.05.013", "src_002": "Adam J. et al. Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling. Cancer Cell. 2011;20:524–37. doi:10.1016/j.ccr.2011.09.006", "src_003":
