<noscript><style>.toolbar,.sidebar,.skip{display:none}.print-only{display:block}.mech{padding-left:20px}</style><section class="card"><h1>Метилирование ДНК, регуляторные элементы и память</h1><p>Для изменения схем и проверки ответов включите JavaScript. Ниже в этом же файле приведены все объяснения, вопросы с разбором вариантов и словарь.</p></section><article class="card print-unit" id="ns-methylation"><div class="eyebrow">Метилирование ДНК · шаг 1 из 28</div><h2>Что изменяется при метилировании ДНК</h2><p class="lead">Метилирование ДНК — это химическая модификация основания, при которой порядок нуклеотидов не меняется. В основной модели курса метилируется цитозин в составе CpG.</p><ol class="mech"><li>ДНК-метилтрансфераза (DNMT) переносит метильную группу с донора, <a href="#ns-g-S6-T16">S-аденозилметионина (SAM)</a>, на атом C5 цитозина.</li><li>Образуются <a href="#ns-g-S6-T02">5-метилцитозин (5mC)</a> и <a href="#ns-g-S6-T17">S-аденозилгомоцистеин (SAH)</a>.</li><li>Основание остаётся цитозином: оно по-прежнему образует пару с гуанином, и последовательность не меняется.</li></ol><p>Метилирование ДНК у млекопитающих — это присоединение метильной группы к цитозину по атому углерода C5. Реакцию катализируют ДНК-метилтрансферазы. Донором метильной группы служит SAM, который превращается в SAH, а продуктом реакции становится 5mC.</p><p>Основание при этом остаётся цитозином: оно по-прежнему образует пару с гуанином, а порядок нуклеотидов не меняется. Метилирование — это изменение химического состояния основания, а не замена нуклеотида. Замена происходит в другом процессе: при дезаминировании 5mC образуется тимин.</p><p>Метилируется главным образом цитозин в составе <a href="#ns-g-S6-T03">CpG-динуклеотида</a>. В нём за цитозином в той же цепи в направлении 5′→3′ следует гуанин, а буква p обозначает фосфатный остаток между ними. Это не комплементарная пара C–G. Участок 5′-CG-3′ одной цепи комплементарен участку 3′-GC-5′ другой, поэтому в двухцепочечной ДНК <a href="#ns-g-S6-T04">CpG-диаду</a> образуют два цитозина — по одному в каждой цепи. Каждый из них может быть метилирован или нет; состояния диады обозначают MM (метилированы оба), MU (метилирован один) и UU (не метилирован ни один).</p><p>Метилирование вне CpG тоже существует: в геномах животных его описывают, в частности, в нейронах. Закономерности, установленные для CpG, поэтому нельзя без проверки переносить на другие контексты.</p><p>Сама по себе метка не определяет, будет ли ген экспрессироваться. Её влияние на связывание белков и на транскрипцию зависит от локуса, типа клеток и положения CpG; это влияние измеряют отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> CpG — это пара оснований C–G, соединённых водородными связями.<p class="trap-fix">В записи CpG буква p обозначает фосфатный остаток, связывающий соседние нуклеотиды одной цепи. Комплементарная пара C–G записывается иначе, а два цитозина диады находятся в разных цепях.</p></div><div class="static-quiz"><h3>В участке ДНК цитозин в составе CpG превращён в 5mC. Порядок нуклеотидов сохранён. Какое изменение произошло?</h3><ol><li><b>А.</b> Основание химически модифицировано, но нуклеотид не заменён. <i>(верный вариант)</i><br><span class="expl">DNMT присоединяет метильную группу к цитозину. Меняется химическое состояние основания, но нуклеотид не заменяется другим.</span></li><li><b>Б.</b> Цитозин заменён тимином, поэтому возникла точечная мутация. <i>(неверный вариант)</i><br><span class="expl">Образование 5mC не является заменой C на T. Дезаминирование 5mC — другой процесс.</span></li><li><b>В.</b> Изменилось комплементарное основание: гуанин заменён аденином. <i>(неверный вариант)</i><br><span class="expl">Метилирование цитозина не затрагивает гуанин противоположной цепи: 5mC по-прежнему образует с ним пару.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5814352/">Zhang ZM et al. 2018. Structural basis for DNMT3A-mediated de novo DNA methylation</a></li><li><a href="https://doi.org/10.1038/s41588-025-02303-1">Brethouwer T et al. 2025. Non-CG DNA methylation in animal genomes</a></li></ul><p>Описание реакции метилирования и CpG-контекста опирается на обзор Smith и соавт. (2025) и на структуру комплекса DNMT3A–DNMT3L с ДНК (Zhang и соавт., 2018); метилирование вне CpG в геномах животных описано в обзоре Brethouwer и соавт. (2025). Схема показывает механизм и не содержит результатов измерений.</p></details></article><article class="card print-unit" id="ns-de-novo"><div class="eyebrow">Метилирование ДНК · шаг 2 из 28</div><h2>Как устанавливается новый рисунок метилирования</h2><p class="lead">Метилирование de novo — это появление 5mC там, где метки раньше не было. Его выполняют DNMT3A и DNMT3B, а не фермент поддержания DNMT1.</p><ol class="mech"><li>DNMT3A или DNMT3B переносит метильную группу с SAM на цитозин неметилированной CpG-диады.</li><li>Для реакции не нужна метилированная родительская цепь: этим de novo отличается от поддерживающего метилирования.</li><li>Выбор участка зависит от нескольких признаков хроматина и от партнёров фермента, а не от одного сигнала.</li></ol><p><a href="#ns-g-S6-T10">Метилирование de novo</a> — установление метки на участке, который был неметилированным в обеих цепях. Его выполняют ферменты <a href="#ns-g-S6-T13">DNMT3A и DNMT3B</a>. Как и все ДНК-метилтрансферазы, они переносят метильную группу с SAM на цитозин, а SAM при этом превращается в SAH.</p><p>Участок для метилирования выбирается не по одному признаку. ADD-домен DNMT3A связывается с N-концевым участком гистона H3, лизин 4 которого не метилирован (H3K4me0). PWWP-домены DNMT3A и DNMT3B узнают метилированный лизин 36 гистона H3 (H3K36me2/3). Эти взаимодействия помогают направить фермент к определённым участкам хроматина, но каждое из них само по себе не определяет, будет ли участок метилирован.</p><p><a href="#ns-g-S6-T14">DNMT3L</a> родственен DNMT3A и DNMT3B, но каталитически неактивен. Он образует с DNMT3A комплекс (структуру такого комплекса определили Jia и соавт.) и усиливает метилирование. Особенно важна его роль в зародышевой линии, например при установлении импринтов. Это не значит, что DNMT3L нужен для метилирования любого CpG в соматических клетках.</p><p>Разделение ролей — «de novo выполняют DNMT3A и DNMT3B, поддержание выполняет DNMT1» — верно как основная схема. Но DNMT3A и DNMT3B участвуют и в поддержании метилирования отдельных участков, поэтому это правило не абсолютное.</p><p>Появление 5mC на новом участке показывает, что метилтрансферазная активность там была. Какой именно фермент метилировал участок и какие признаки хроматина его направили, выясняют отдельными опытами: например, поочерёдно инактивируют каждую DNMT и измеряют метилирование того же локуса.</p><div class="note trap"><strong>Типичная ошибка</strong> Метилирование de novo возникает, когда DNMT1 копирует метку родительской цепи.<p class="trap-fix">Копирование метки с родительской цепи — поддерживающее метилирование. При de novo метилированной родительской цепи нет, поэтому DNMT3A и DNMT3B действуют на неметилированную диаду.</p></div><div class="static-quiz"><h3>В ранее неметилированном участке впервые появился 5mC. Какой процесс непосредственно объясняет появление новой метки?</h3><ol><li><b>А.</b> Метилирование de novo ферментами DNMT3A/3B. <i>(верный вариант)</i><br><span class="expl">DNMT3A/3B способны устанавливать метилирование там, где исходной метки не было.</span></li><li><b>Б.</b> Восстановление метки ферментом DNMT1 по уже метилированной родительской цепи. <i>(неверный вариант)</i><br><span class="expl">В условии нет метилированной родительской цепи, а без неё поддерживающее метилирование невозможно.</span></li><li><b>В.</b> Окисление цитозина ферментами TET. <i>(неверный вариант)</i><br><span class="expl">TET окисляют 5mC и его производные; перенос метильной группы с SAM они не катализируют.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2712830/">Jia D et al. 2007. Structure of Dnmt3a bound to Dnmt3L suggests a model for de novo DNA methylation</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5814352/">Zhang ZM et al. 2018. Structural basis for DNMT3A-mediated de novo DNA methylation</a></li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/19834512/">Otani J et al. 2009. Structural basis for recognition of H3K4 methylation status by the DNA methyltransferase 3A ATRX-DNMT3-DNMT3L domain</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/31485078/">Weinberg DN et al. 2019. The histone mark H3K36me2 recruits DNMT3A and shapes the intergenic DNA methylation landscape</a></li></ul><p>Роли DNMT3A, DNMT3B и DNMT3L описаны по обзору Smith и соавт. (2025); связывание ADD-домена DNMT3A с гистоном H3, не метилированным по лизину 4, — по работе Otani и соавт. (2009), а узнавание H3K36me2/3 PWWP-доменом DNMT3A — по работе Weinberg и соавт. (2019; обе прочитаны на уровне реферата); для PWWP-домена DNMT3B отдельный первичный источник в шаге не указан; структурные работы — Jia и соавт. (2007) о комплексе DNMT3A с DNMT3L и Zhang и соавт. (2018) о метилировании de novo. Схема показывает механизм, а не измеренную скорость реакции.</p></details></article><article class="card print-unit" id="ns-maintenance"><div class="eyebrow">Метилирование ДНК · шаг 3 из 28</div><h2>Как восстанавливается метилирование после репликации</h2><p class="lead">После репликации полностью метилированной CpG-диады обе дочерние молекулы ДНК полуметилированы: старая цепь несёт метку, новая — нет. Поддерживающее метилирование восстанавливает метку на новой цепи по образцу старой.</p><ol class="mech"><li>Репликация полуконсервативна: каждая дочерняя диада получает одну старую цепь и одну новую.</li><li><a href="#ns-g-S6-T15">UHRF1</a> связывается с полуметилированной ДНК и с признаками хроматина; это помогает привлечь <a href="#ns-g-S6-T12">DNMT1</a> к участку и активировать фермент.</li><li>Метильная группа старой цепи остаётся на месте, а новая группа переносится с SAM.</li></ol><p>Допустим, что CpG-диада полностью метилирована (MM). При репликации каждая дочерняя молекула получает одну родительскую цепь и одну только что синтезированную. Старая цепь сохраняет 5mC, а в новой цепи в этой позиции стоит неметилированный цитозин. Поэтому обе дочерние диады полуметилированы (MU). ДНК-полимераза метильные группы не копирует.</p><p><a href="#ns-g-S6-T11">Поддерживающее метилирование</a> — отдельная ферментативная реакция после репликации. UHRF1 связывается с полуметилированной ДНК и с признаками хроматина; это помогает привлечь DNMT1 к участку и активировать фермент. В опытах in vitro UHRF1 повышал активность и специфичность DNMT1 по аллостерическому механизму. Сам DNMT1 тоже избирателен: полуметилированные CpG он метилирует эффективнее, чем неметилированные.</p><p>Метильная группа старой цепи остаётся на месте и служит образцом. Новая группа переносится с SAM на цитозин новой цепи, и диада возвращается в состояние MM.</p><p>Реакция выполняется не со стопроцентной точностью. Для метилированного CpG-островка гена FMR1 на неактивной X-хромосоме в лимфоцитах человека методом шпилечной бисульфитной ПЦР получена оценка около 96 % восстановленных диад за деление. Поэтому часть диад остаётся полуметилированной, и если метилирование de novo этого не компенсирует, метилирование участка постепенно уменьшается.</p><div class="note trap"><strong>Типичная ошибка</strong> Репликация переносит метильные группы на новую цепь вместе с копированием последовательности.<p class="trap-fix">ДНК-полимераза копирует порядок нуклеотидов, но не метку. Метильную группу на новую цепь переносит DNMT1 после репликации.</p></div><div class="static-quiz"><h3>Полностью метилированная CpG-диада реплицировалась. Поддерживающее метилирование ещё не произошло. Каково состояние двух дочерних молекул?</h3><ol><li><b>А.</b> В каждой молекуле метилирован цитозин старой цепи, а цитозин новой цепи не метилирован. <i>(верный вариант)</i><br><span class="expl">Полуконсервативная репликация сохраняет одну старую цепь в каждой дочерней молекуле.</span></li><li><b>Б.</b> В одной молекуле метилированы обе цепи, а в другой не метилирована ни одна. <i>(неверный вариант)</i><br><span class="expl">Здесь обе старые цепи оказались бы в одной молекуле, но при полуконсервативной репликации каждая дочерняя молекула получает одну старую цепь.</span></li><li><b>В.</b> Обе молекулы полностью метилированы, поскольку репликация переносит метильные группы на новые цепи. <i>(неверный вариант)</i><br><span class="expl">ДНК-полимераза не копирует метилирование. Для новой метки необходима отдельная реакция DNMT.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3924276/">Bashtrykov P et al. 2014. The UHRF1 protein stimulates the activity and specificity of the maintenance DNA methyltransferase DNMT1 by an allosteric mechanism</a></li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://doi.org/10.1073/pnas.2536758100">Laird CD. et al. Hairpin-bisulfite PCR: assessing epigenetic methylation patterns on complementary strands of individual DNA molecules. Proc Natl Acad Sci U S A. 2004;101:204–9. doi:10.1073/pnas.2536758100</a></li></ul><p>Восстановление метки по образцу старой цепи и роль UHRF1 описаны по работе Bashtrykov и соавт. (2014; опыты с очищенными белками) и обзору Smith и соавт. (2025). Оценка около 96 % за деление относится к CpG-островку гена FMR1 неактивной X-хромосомы в лимфоцитах человека (Laird и соавт., 2004); на другие участки её переносить нельзя. На схеме эффективность задаётся ползунком как учебный параметр.</p></details></article><article class="card print-unit" id="ns-passive-loss"><div class="eyebrow">Метилирование ДНК · шаг 4 из 28</div><h2>Почему метилирование уменьшается при делениях</h2><p class="lead">Доля метилированных цитозинов может уменьшаться при делениях без химического удаления метки. Тогда новые цепи остаются неметилированными, а старые просто распределяются между всё большим числом копий.</p><ol class="mech"><li>Старая цепь сохраняет 5mC, но после каждой репликации число цепей удваивается.</li><li>Если нет ни поддерживающего метилирования, ни метилирования de novo, новые цепи метку не получают.</li><li>Доля метилированных цитозинов уменьшается как 2⁻ⁿ, где n — число раундов репликации.</li></ol><p><a href="#ns-g-S6-T18">Пассивное деметилирование</a> — уменьшение доли метилированных оснований при репликации. Метильные группы при этом не отщепляются: просто новые цепи не получают метки, потому что поддерживающее метилирование не срабатывает или срабатывает не полностью.</p><p>Рассмотрим идеальную задачу. Исходная диада метилирована на обеих цепях (MM). Поддерживающее метилирование и метилирование de novo полностью отсутствуют, 5mC не окисляется, клетки не подвергаются отбору. После первой репликации получаются две диады MU: в них 2 метилированных цитозина из 4, то есть 50 %. После второй репликации четыре диады содержат 8 цитозинов, из которых метилированы только 2 старых, то есть 25 %. После n раундов доля метилированных цитозинов равна 2⁻ⁿ.</p><p>Эта формула описывает только идеальную задачу. В клетке и в практикуме семинара метилирование de novo может оставаться активным, копирование метки бывает неполным, а окисление 5mC может идти параллельно. Результаты практикума нельзя заменять значением 2⁻ⁿ.</p><p>Это важно и для выводов из опытов. Уменьшение доли 5mC после делений совместимо с пассивной потерей, но не доказывает её: активное деметилирование и отбор клеток могут дать похожий результат. Чтобы различить эти объяснения, нужны контроль числа делений, измерение окисленных форм 5mC и определение состояния диад.</p><div class="note trap"><strong>Типичная ошибка</strong> Доля метилированных цитозинов снизилась — значит, метильные группы были химически удалены.<p class="trap-fix">Доля может снизиться и при репликации без удаления: старые 5mC сохраняются, но распределяются среди растущего числа молекул. Химическое удаление нужно подтверждать отдельно.</p></div><div class="static-quiz"><h3>В идеальной задаче исходная CpG-диада метилирована на обеих цепях. Поддерживающего метилирования, метилирования de novo и активного удаления 5mC нет. Какова доля метилированных цитозинов этого локуса среди всех копий после двух раундов репликации?</h3><ol><li><b>А.</b> 25 %. <i>(верный вариант)</i><br><span class="expl">Число старых метилированных цитозинов сохраняется, а общее число копий увеличивается вчетверо. Доля составляет 1/4.</span></li><li><b>Б.</b> 50 %. <i>(неверный вариант)</i><br><span class="expl">50 % получается после одного раунда. Условие задаёт два раунда репликации.</span></li><li><b>В.</b> 0 %. <i>(неверный вариант)</i><br><span class="expl">В условии нет химического удаления старой метки. Её доля уменьшается, но старые метилированные цепи сохраняются.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3924276/">Bashtrykov P et al. 2014. The UHRF1 protein stimulates the activity and specificity of the maintenance DNA methyltransferase DNMT1 by an allosteric mechanism</a></li></ul><p>Идеальная задача и формула 2⁻ⁿ — расчёт, который следует из полуконсервативной репликации при заданных допущениях, а не результат опыта. Поддерживающее метилирование описано по обзору Smith и соавт. (2025) и работе Bashtrykov и соавт. (2014; опыты in vitro о стимуляции DNMT1 белком UHRF1). В практикуме рассматриваются другие условия: метилирование de novo может оставаться активным.</p></details></article><article class="card print-unit" id="ns-tet-tdg"><div class="eyebrow">Метилирование ДНК · шаг 5 из 28</div><h2>Как окисление связано с активным деметилированием</h2><p class="lead">В основной модели активное деметилирование идёт через окисление 5mC и удаление окисленного основания. Метильную группу ферменты не отщепляют напрямую.</p><ol class="mech"><li><a href="#ns-g-S6-T19">TET</a> последовательно окисляют 5mC до 5hmC, 5fC и 5caC; для реакции нужны Fe²⁺, O₂ и α-кетоглутарат.</li><li><a href="#ns-g-S6-T21">TDG</a> вырезает 5fC и 5caC; затем <a href="#ns-g-S6-T22">эксцизионная репарация оснований</a> восстанавливает обычный цитозин.</li><li>5hmC — самостоятельная химическая форма: её появление ещё не означает завершения деметилирования.</li></ol><p>Белки TET1, TET2 и TET3 — диоксигеназы. Для реакции им нужны ионы Fe²⁺, молекулярный кислород и α-кетоглутарат. TET не отщепляют метильную группу, а окисляют её: 5mC превращается в 5-гидроксиметилцитозин (<a href="#ns-g-S6-T20">5hmC</a>), затем в 5-формилцитозин (5fC) и в 5-карбоксилцитозин (5caC).</p><p>ДНК-гликозилаза TDG распознаёт окисленные формы 5fC и 5caC. Она вырезает не метильную группу, а само основание, и в цепи остаётся участок без основания. Затем эксцизионная репарация оснований (BER) обрабатывает этот участок, достраивает цитозин и лигирует цепь. Так восстанавливается немодифицированный цитозин (<a href="#ns-g-S6-T23">активное деметилирование</a>).</p><p>5hmC нельзя считать «почти цитозином». Это отдельная химическая форма, которая в ряде тканей может сохраняться. Её обнаружение не доказывает, что путь дошёл до конца: об этом можно судить по другим продуктам и по результату репарации. Если после активации TET доля 5hmC в локусе выросла, это означает рост доли продукта окисления 5mC; восстановление обычного цитозина проверяют отдельно.</p><p>Окисление не исключает пассивной потери. Окисленные формы хуже распознаются системой поддерживающего метилирования, поэтому окисление и последующее разведение метки при репликации могут действовать вместе. Вклад каждого пути оценивают отдельно.</p><div class="note trap"><strong>Типичная ошибка</strong> TET отщепляют метильную группу от 5mC, и цитозин сразу восстанавливается.<p class="trap-fix">TET катализируют окисление. Обычный цитозин восстанавливается только после того, как гликозилаза TDG удалит основание и пройдёт репарация; эти этапы нужно измерять отдельно.</p></div><div class="static-quiz"><h3>После активации TET доля 5hmC в локусе увеличилась. Какой вывод непосредственно поддерживает это наблюдение?</h3><ol><li><b>А.</b> Выросла доля продукта окисления 5mC; возврат к обычному цитозину не доказан. <i>(верный вариант)</i><br><span class="expl">5hmC — отдельная химическая форма. Конечный результат пути устанавливают, измеряя другие продукты и результат репарации.</span></li><li><b>Б.</b> Все модифицированные цитозины в этом локусе уже заменены обычными цитозинами. <i>(неверный вариант)</i><br><span class="expl">Наличие 5hmC показывает, что по крайней мере часть цитозинов ещё модифицирована.</span></li><li><b>В.</b> TET удалили метильную группу напрямую, без образования промежуточных оснований. <i>(неверный вариант)</i><br><span class="expl">TET не отщепляют метильную группу, а окисляют 5mC до 5hmC, 5fC и 5caC. В этом пути обычный цитозин восстанавливается после удаления 5fC или 5caC гликозилазой TDG и эксцизионной репарации оснований.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3495246/">Ito S et al. 2011. Tet proteins can convert 5-methylcytosine to 5-formylcytosine and 5-carboxylcytosine</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3462231/">He YF et al. 2011. Tet-mediated formation of 5-carboxylcytosine and its excision by TDG in mammalian DNA</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4046508/">Kohli RM et al. 2013. TET enzymes, TDG and the dynamics of DNA demethylation</a></li></ul><p>Последовательное окисление 5mC ферментами TET описано в работе Ito и соавт. (2011); вырезание 5caC гликозилазой TDG — в работе He и соавт. (2011); общая картина — в обзоре Kohli и соавт. (2013). Схема показывает порядок реакций, а не скорости.</p></details></article><article class="card print-unit" id="ns-methylation-measure"><div class="eyebrow">Метилирование ДНК · шаг 6 из 28</div><h2>Что показывают методы анализа метилирования</h2><p class="lead">Обычное бисульфитное секвенирование не отличает 5mC от 5hmC. Чтобы их различить, нужны дополнительные методы, например oxBS-seq или TAB-seq, а состояние двух цепей диады читают методом шпильки.</p><ol class="mech"><li>При бисульфитной обработке обычный цитозин читается как тимин, а 5mC и 5hmC читаются как цитозин.</li><li>oxBS-seq выявляет 5mC, а TAB-seq — 5hmC; по разности сигналов обычного бисульфитного секвенирования и oxBS-seq при тех же контролях оценивают долю 5hmC.</li><li>Метод шпильки соединяет обе цепи одной молекулы, поэтому позволяет определить состояние диады: MM, MU или UU; при обычной бисульфитной обработке «M» означает 5mC или 5hmC.</li></ol><p>При обычном бисульфитном секвенировании неметилированный цитозин превращается в урацил, который после ПЦР читается как тимин. 5mC устойчив к этому превращению. 5hmC в реакции с бисульфитом образует продукт, который тоже не превращается в урацил. Поэтому сигнал «цитозин сохранился» объединяет 5mC и 5hmC.</p><p>В oxBS-seq перед бисульфитной обработкой 5hmC окисляют до 5fC. Эта форма при обработке бисульфитом читается как тимин, поэтому остаточный сигнал принадлежит 5mC. В TAB-seq 5hmC сначала защищают присоединением глюкозы, затем окисляют 5mC ферментом TET до 5caC; в результате сохраняется сигнал 5hmC. По разности сигналов обычного бисульфитного секвенирования и oxBS-seq оценивают долю 5hmC.</p><p>Метод шпильки (hairpin-bisulfite) соединяет две цепи одной молекулы и поэтому позволяет прочитать состояние обоих цитозинов диады. Он различает MM, MU и UU (при обычной бисульфитной обработке «M» означает 5mC или 5hmC), тогда как обычное бисульфитное секвенирование даёт только долю метилирования в каждой позиции цитозина.</p><p>Для всех этих методов нужны контроли: эффективность превращения неметилированного цитозина, эффективность окисления в oxBS-seq, полнота защиты 5hmC в TAB-seq и одинаковая нормировка образцов. Числа на схеме — искусственные: они показывают логику вычитания, а не результат опыта.</p><div class="note trap"><strong>Типичная ошибка</strong> Обычный бисульфитный сигнал 60 % означает, что 60 % цитозинов — это 5mC.<p class="trap-fix">Бисульфитный сигнал суммирует 5mC и 5hmC. Чтобы выделить 5mC, нужен oxBS-seq, а 5hmC оценивают по разности сигналов или напрямую методом TAB-seq.</p></div><div class="static-quiz"><h3>В образцах с сопоставимой нормировкой обычное бисульфитное секвенирование даёт сигнал 60 %, а oxBS-seq — 40 %. Контроли химического превращения пройдены. Чем непосредственно объясняется разность сигналов?</h3><ol><li><b>А.</b> Приблизительно 20 процентных пунктов приходятся на 5hmC. <i>(верный вариант)</i><br><span class="expl">В заданном сравнении обычный бисульфит учитывает 5mC вместе с 5hmC, а oxBS-seq — 5mC. Разность составляет 20 процентных пунктов, а не относительное изменение на 20 %.</span></li><li><b>Б.</b> 5mC составляет 60 %, а 5hmC отсутствует. <i>(неверный вариант)</i><br><span class="expl">5mC здесь оценивают по сигналу oxBS-seq, то есть 40 %, а не 60 %. Разность сигналов нельзя приписать 5mC.</span></li><li><b>В.</b> 20 % всех CpG-диад обязательно метилированы на обеих цепях. <i>(неверный вариант)</i><br><span class="expl">Сигнал отдельных цитозинов не определяет, как метки распределены между двумя цепями одной диады.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3919000/">Booth MJ et al. 2013. Oxidative bisulfite sequencing of 5-methylcytosine and 5-hydroxymethylcytosine</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2811190/">Huang Y et al. 2010. The behaviour of 5-hydroxymethylcytosine in bisulfite sequencing</a></li><li><a href="https://doi.org/10.1073/pnas.2536758100">Laird CD. et al. Hairpin-bisulfite PCR: assessing epigenetic methylation patterns on complementary strands of individual DNA molecules. Proc Natl Acad Sci U S A. 2004;101:204–9. doi:10.1073/pnas.2536758100</a></li></ul><p>Принцип oxBS-seq описан в работе Booth и соавт. (2013); поведение 5hmC в бисульфитном секвенировании — в работе Huang и соавт. (2010); метод шпильки — в работе Laird и соавт. (2004). Числа на схеме искусственные и заданы для иллюстрации вычитания.</p></details></article><article class="card print-unit" id="ns-methyl-binding"><div class="eyebrow">Метилирование ДНК · шаг 7 из 28</div><h2>Как белки связывают метилированную ДНК</h2><p class="lead">Метилирование может по-разному менять связывание белков с ДНК. Белки с MBD-доменом образуют разнородную группу: у каждого свои партнёры и функции.</p><ol class="mech"><li>Метильная группа 5mC выступает в большую бороздку и меняет поверхность ДНК.</li><li>Одни транскрипционные факторы связываются с метилированным мотивом хуже, чем с неметилированным, у других связывание не меняется; результат зависит от белка и положения CpG.</li><li>Следствие связывания определяют партнёры белка: MeCP2 взаимодействует с NCoR/SMRT, а MBD2 входит в комплекс NuRD.</li></ol><p>Метильная группа 5mC находится в большой бороздке ДНК и меняет её поверхность. Для транскрипционного фактора, узнающего мотив, это может ослабить связывание, а может не повлиять на него: результат зависит от белка и от положения CpG в мотиве. Поэтому нельзя утверждать, что метилирование блокирует связывание всех факторов. Пример — CTCF, чувствительность которого к метилированию зависит от конкретного сайта.</p><p>Часть белков узнаёт метилированную ДНК с помощью MBD-домена — домена связывания метилированного CpG. Эти белки нельзя считать однородной группой. <a href="#ns-g-S6-T27">MeCP2</a>, MBD1 и MBD2 связываются с метилированной ДНК. MBD3 в обычном виде метил-CpG не связывает. MBD4 — прежде всего ДНК-гликозилаза репарации.</p><p>Дальнейшее зависит от партнёров. MeCP2 взаимодействует с корепрессорным комплексом NCoR/SMRT через участок, образованный аминокислотными остатками 269–309. Мутации синдрома Ретта в участке 302–306 эту связь нарушают, а замена T158M в MBD-домене её не нарушает, но ухудшает связывание с метилированной ДНК. MBD2 входит в комплекс NuRD: в опытах in vitro этот комплекс предпочтительно связывает метилированные нуклеосомы и деацетилирует их. Эти данные относятся к комплексу MBD2–NuRD; на другие белки MBD их нельзя автоматически переносить.</p><p>Метилирование промотора, тела гена и повтора обсуждают раздельно. Метилирование промотора часто сопутствует подавлению транскрипции, однако это закономерность, зависящая от локуса, а не правило для каждого гена.</p><div class="note trap"><strong>Типичная ошибка</strong> Все белки семейства MBD связывают метилированную ДНК и подавляют транскрипцию.<p class="trap-fix">Функции членов семейства различаются: MBD3 в обычном виде не связывает метил-CpG, а MBD4 — гликозилаза. Даже связывание с метилированной ДНК не означает единого репрессорного действия.</p></div><div class="static-quiz"><h3>В локусе появился 5mC. Для фактора X показано снижение связывания с метилированным мотивом. Какое предсказание относится непосредственно к этому наблюдению?</h3><ol><li><b>А.</b> При прочих равных занятость данного мотива фактором X может уменьшиться. <i>(верный вариант)</i><br><span class="expl">Вывод относится к изученному мотиву и фактору. Изменение количества РНК нужно измерить отдельно.</span></li><li><b>Б.</b> Все транскрипционные факторы перестанут связываться с любыми участками ДНК. <i>(неверный вариант)</i><br><span class="expl">Чувствительность к метилированию зависит от белка и положения CpG в мотиве.</span></li><li><b>В.</b> Транскрипция любого гена с метилированным телом немедленно прекратится. <i>(неверный вариант)</i><br><span class="expl">Метилирование тела гена не имеет единственного универсального эффекта; в условии исследован конкретный фактор.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4418849/">Chen L et al. 2015. MeCP2 binds to non-CG methylated DNA as neurons mature, influencing transcription and the timing of onset for Rett syndrome</a></li><li><a href="https://doi.org/10.1038/s41594-024-01241-6">Monteagudo-Sánchez A et al. 2024. The impact of DNA methylation on CTCF-mediated 3D genome organization</a></li><li><a href="https://doi.org/10.1038/nn.3434">Lyst MJ. et al. Rett syndrome mutations abolish the interaction of MeCP2 with the NCoR/SMRT co-repressor. Nat Neurosci. 2013;16:898–902. doi:10.1038/nn.3434</a></li><li><a href="https://doi.org/10.1101/gad.876201">Feng Q., Zhang Y. The MeCP1 complex represses transcription through preferential binding, remodeling, and deacetylating methylated nucleosomes. Genes Dev. 2001;15:827–32. doi:10.1101/gad.876201</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/15899845/">Kondo E et al. 2005. The thymine DNA glycosylase MBD4 represses transcription and is associated with methylated p16(INK4a) and hMLH1 genes</a></li></ul><p>Взаимодействие MeCP2 с NCoR/SMRT и роль мутаций синдрома Ретта описаны в работе Lyst и соавт. (2013; HeLa, фрагменты MeCP2 и мыши с мутацией R306C); комплекс MBD2–NuRD — в работе Feng и Zhang (2001; ядерный экстракт HeLa, in vitro); связывание MeCP2 с метилированной ДНК вне CpG в нейронах — Chen и соавт. (2015); зависимость CTCF от метилирования — обзор Monteagudo-Sánchez и соавт. (2024); для MBD4 в клетках человека описано также HDAC-зависимое подавление транскрипции через Sin3A и HDAC1 (Kondo и соавт., 2005; реферат). Выводы относятся к указанным системам.</p></details></article><article class="card print-unit" id="ns-imprinting"><div class="eyebrow">Метилирование ДНК · шаг 8 из 28</div><h2>Как родительский аллель связан с регуляцией гена</h2><p class="lead">При <a href="#ns-g-S6-T24">геномном импринтинге</a> активность аллеля зависит от того, от какого родителя он получен. У изученных импринтированных локусов, например H19/Igf2, различие закладывается метилированием контрольной области в зародышевой линии и сохраняется в соматических клетках.</p><ol class="mech"><li>В изученных локусах, например H19/Igf2, DNMT в зародышевой линии устанавливают разное метилирование <a href="#ns-g-S6-T25">контрольной области импринтинга (ICR)</a> на родительских аллелях; в соматических клетках различие поддерживается.</li><li>В мышином локусе H19/Igf2 метилирование ICR определяет, связывается ли с ней CTCF и достигают ли общие энхансеры гена Igf2.</li><li>У каждого импринтированного локуса свой механизм: пример H19/Igf2 нельзя переносить на UBE3A и другие локусы.</li></ol><h3>Мышиный локус H19/Igf2</h3><p>Импринтинг проявляется как <a href="#ns-g-S6-T26">аллель-специфичная экспрессия</a>, зависящая от родительского происхождения аллеля. Различие устанавливается в зародышевой линии, где в установлении импринтов участвует и <a href="#ns-g-S6-T14">DNMT3L</a>, а в соматических клетках поддерживается: DNMT1 воспроизводит метилирование ICR при репликации. Импринтинг не требует различий в последовательности двух аллелей: различаются родительская метка и её последствия. В мышином локусе H19/Igf2 метка связана с ICR, расположенной между генами.</p><p>На материнском аллеле ICR не метилирована, и с ней связывается CTCF. Связанный CTCF ограничивает доступ общих энхансеров к гену Igf2: на этом аллеле Igf2 не экспрессируется, а H19 экспрессируется. На отцовском аллеле ICR метилирована, и CTCF с ней не связывается. Поэтому энхансеры достигают Igf2: этот ген экспрессируется, а H19 на этом аллеле молчит. Таким образом, метилирование ICR связано с аллель-специфичной экспрессией через связывание CTCF и доступ энхансеров.</p><p>Контакты энхансеров с промоторами Igf2 на отцовской хромосоме и их предотвращение связыванием CTCF в ICR на материнской показаны методом захвата конформации хромосом (Kurukuti и соавт., 2006). Мутации четырёх сайтов CTCF в ICR в культуре фибробластов мыши нарушали аллель-специфичный состав хроматина по всему домену, в том числе метки H3K27me3 и ацетилирование H3K9 (Han и соавт., 2008). Эти данные получены на мышах, и на другие виды и ткани их автоматически переносить нельзя. Чтобы проверить последствия нарушения сайта CTCF, измеряют аллель-специфичную РНК Igf2 вместе со связыванием CTCF и контактами локуса: изменение нужно показать именно для материнского аллеля.</p><h3>Другие локусы и разные виды нарушений</h3><p>Инактивация X-хромосомы устроена иначе: она устанавливается длинной некодирующей РНК XIST (у мыши Xist) в цис на одной из двух X-хромосом и не сводится к метилированию одной контрольной области. Нельзя переносить на неё объяснение локуса H19/Igf2. Нарушения, связанные с метилированием, бывают разными. К нарушениям импринтинга относят, например, синдром Беквита — Видемана и синдромы Прадера — Вилли и Ангельмана: в них нарушена экспрессия импринтированных генов определённого локуса. Вариант синдрома ICF (ICF1) вызван мутациями гена DNMT3B и не сводится к общей потере метилирования. Синдром Ретта связан с мутациями гена MECP2, кодирующего белок, который связывается с метилированной ДНК. Это три разных вида нарушений.</p><p>Для гена UBE3A фраза «отцовский промотор просто метилирован» не подходит. В нейронах молчание отцовского аллеля связано с транскрипцией нейронального антисмыслового транскрипта UBE3A-ATS, перекрывающегося с геном UBE3A. В опытах на мышах антисмысловые олигонуклеотиды снижали содержание транскрипта Ube3a-ATS, и отцовский аллель Ube3a частично активировался. Эти данные не дают оснований для выводов о лечении людей.</p><div class="note trap"><strong>Типичная ошибка</strong> Импринтинг — это просто метилирование промотора гена на одном из аллелей.<p class="trap-fix">У H19/Igf2 метилируется контрольная область, и результат зависит от связывания CTCF и доступа энхансеров. У UBE3A в нейронах важен антисмысловой транскрипт UBE3A-ATS.</p></div><div class="static-quiz"><h3>В изучаемой мышиной модели CTCF связывается с неметилированной ICR материнского аллеля локуса H19/Igf2 и ограничивает действие общих энхансеров на Igf2. Какое измерение лучше всего проверит последствия нарушения этого сайта CTCF?</h3><ol><li><b>А.</b> Аллель-специфичная РНК Igf2, связывание CTCF и контакты локуса. <i>(верный вариант)</i><br><span class="expl">Нужно установить изменение именно материнского аллеля и сопоставить его с нарушенным механизмом.</span></li><li><b>Б.</b> Только средняя доля 5mC, измеренная во всём геноме клеток образца. <i>(неверный вариант)</i><br><span class="expl">Средний сигнал по геному не показывает изменение исследуемого контрольного участка.</span></li><li><b>В.</b> Только общее содержание белка CTCF во всех клетках каждого образца. <i>(неверный вариант)</i><br><span class="expl">Количество CTCF не показывает ни связывания с конкретным сайтом, ни аллель-специфичной транскрипции.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 1 практикума. <a href="seminar-6.html#q1">Открыть сценарии вопроса 1 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1484419/">Kurukuti S et al. 2006. CTCF binding at the H19 imprinting control region mediates maternally inherited higher-order chromatin conformation to restrict enhancer access to Igf2</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2223393/">Han L et al. 2008. CTCF is the master organizer of domain-wide allele-specific chromatin at the H19/Igf2 imprinted region</a></li><li><a href="https://doi.org/10.1016/j.pcl.2015.03.004">Kalsner L et al. 2015. Prader-Willi, Angelman, and 15q11-q13 duplication syndromes</a></li><li><a href="https://doi.org/10.1038/nrendo.2017.166">Brioude F et al. 2018. Expert consensus document: Clinical and molecular diagnosis, screening and management of Beckwith-Wiedemann syndrome: an international consensus statement</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4418849/">Chen L et al. 2015. MeCP2 binds to non-CG methylated DNA as neurons mature, influencing transcription and the timing of onset for Rett syndrome</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9637994/">Bowness JS et al. 2022. Xist-mediated silencing requires additive functions of SPEN and Polycomb together with differentiation-dependent recruitment of SmcHD1</a></li><li><a href="https://www.nature.com/articles/nature13975">Meng L et al. 2015. Towards a therapy for Angelman syndrome by targeting a long non-coding RNA</a></li><li><a href="https://doi.org/10.1038/s41576-024-00760-8">Smith ZD et al. 2025. DNA methylation in mammalian development and disease</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10588719/">Hansen RS et al. 1999. The DNMT3B DNA methyltransferase gene is mutated in the ICF immunodeficiency syndrome</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/28723896/">Inoue A et al. 2017. Maternal H3K27me3 controls DNA methylation-independent imprinting</a></li></ul><p>Локус H19/Igf2 описан на мыши (Kurukuti и соавт., 2006; Han и соавт., 2008): обе работы прочитаны на уровне реферата; в первой контакты и роль связывания CTCF в ICR показаны захватом конформации хромосом, во второй мутации четырёх сайтов CTCF в ICR исследованы в культуре фибробластов мыши. Участие DNMT3L в установлении импринтов и воспроизведение метилирования ICR ферментом DNMT1 при репликации — сведения программы курса и шагов 2–3, в источниках этого шага не проверялись. Синдромы нарушения импринтинга — Kalsner и соавт. (2015; Прадера — Вилли, Ангельман) и Brioude и соавт. (2018; Беквит — Видеман). Работа Meng и соавт. (2015) выполнена на мышах: однократное введение антисмысловых олигонуклеотидов частично активировало отцовский аллель Ube3a. Эффект наблюдался около 16 недель; клинических выводов из этого не следует. Роль Xist — Bowness и соавт. (2022; эмбриональные стволовые клетки мыши; реферат). Мутации DNMT3B при синдроме ICF — Hansen и соавт. (1999; реферат). У мыши описан также импринтинг, не зависящий от метилирования ДНК (материнский H3K27me3; Inoue и соавт., 2017; реферат): на этой странице он не рассматривается.</p></details></article><article class="card print-unit" id="ns-enhancer"><div class="eyebrow">Энхансер и промотор · шаг 9 из 28</div><h2>Чем различаются энхансер и промотор</h2><p class="lead">Промотор — участок ДНК, на котором собирается комплекс инициации и определяется место начала транскрипции. Энхансер — отдельный регуляторный участок: к нему присоединяются факторы и коактиваторы, и в результате меняется транскрипция мишени.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает на одной шкале ДНК энхансер, промотор, место начала транскрипции (TSS) и ген. Факторы занимают энхансер, коактиваторы, по основной модели, передают влияние на комплекс инициации промотора при сближении участков. При удалении энхансера промотор и TSS сохраняются, а количество РНК может снизиться; при удалении промотора РНК с него синтезироваться не будет.</div><ol class="mech"><li>На <a href="#ns-g-S6-T28">промоторе</a> собирается комплекс инициации; <a href="#ns-g-S6-T29">место начала транскрипции (TSS)</a> — позиция ДНК, с которой начинается синтез РНК.</li><li>К <a href="#ns-g-S6-T30">энхансеру</a> присоединяются транскрипционные факторы и коактиваторы; они повышают вероятность или скорость транскрипции мишени.</li><li>Участок ДНК энхансера к гену не перемещается: факторы связываются со своими сайтами, а влияние на промотор, по основной модели, передаётся при сближении энхансера и промотора в укладке хроматина.</li></ol><p>Промотор расположен у начала гена; на нём собирается комплекс инициации транскрипции. Сборка комплекса определяет место начала транскрипции — позицию ДНК, с которой РНК-полимераза начинает синтез. Если удалить промотор вместе с этой позицией, РНК с него синтезироваться не будет, даже когда все остальные регуляторные участки сохранены.</p><p>Энхансер — другой участок ДНК, и его роль иная. К нему присоединяются транскрипционные факторы, а через них — коактиваторы, например Mediator и CBP/p300. В результате у промотора-мишени повышается вероятность или скорость транскрипции. Если энхансер и промотор находятся на одной молекуле ДНК, говорят о действии <a href="#ns-g-S6-T55">в цис</a>. Энхансер не заменяет промотор: при его удалении промотор и место начала транскрипции остаются, но вклад связанных с энхансером факторов исчезает, и количество РНК может снизиться. Насколько именно, зависит от других регуляторов локуса.</p><p>В репортёрных опытах энхансером называют фрагмент, который усиливает транскрипцию независимо от расстояния до промотора и от своей ориентации. Это операционный критерий такого опыта, а не описание геномного локуса. В геноме действие энхансера ограничивают доступность участков для факторов, организация хроматина и свойства самого промотора. Поэтому ближайший ген не обязательно служит мишенью, а функциональную мишень устанавливают вмешательством в исходном локусе (шаг 14).</p><p>Влияние энхансера на промотор передаётся не через последовательность ДНК и не через её перемещение, а через белки, связанные с энхансером; по основной модели оно передаётся при сближении двух участков в укладке хроматина (как именно, ещё обсуждается). Поэтому контакт энхансера с промотором и синтез РНК — разные величины; их различают в следующем шаге.</p><div class="note trap"><strong>Типичная ошибка</strong> Энхансер всегда регулирует ближайший к нему ген.<p class="trap-fix">Энхансер может действовать на промотор, удалённый по последовательности ДНК. Независимость от расстояния и ориентации — критерий репортёрных опытов; в геноме мишень зависит от доступности, контактов и свойств промотора, поэтому её определяют вмешательством, а не по близости.</p></div><div class="static-quiz"><h3>Из локуса удалили активный энхансер, сохранив промотор и место начала транскрипции. Что удалено непосредственно?</h3><ol><li><b>А.</b> Регуляторный участок, связывающий факторы, которые усиливают транскрипцию мишени. <i>(верный вариант)</i><br><span class="expl">Энхансер и промотор — разные элементы. Насколько снизится количество РНК, зависит от других регуляторов.</span></li><li><b>Б.</b> Само место начала транскрипции и все сайты сборки общего транскрипционного аппарата. <i>(неверный вариант)</i><br><span class="expl">По условию промотор и TSS сохранены.</span></li><li><b>В.</b> Последовательность, которая обязательно назначает ближайший ген единственной мишенью. <i>(неверный вариант)</i><br><span class="expl">Энхансер может действовать на более удалённый промотор. Функциональную мишень нельзя определить только по расстоянию.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-022-00526-0">Hafner A et al. 2023. The spatial organization of transcriptional control</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9262863/">Bergman DT et al. 2022. Compatibility rules of human enhancer and promoter sequences</a></li></ul><p>Определение энхансера по независимости от расстояния и ориентации и обсуждение его избирательности даны по обзору Yang и соавт. (2024); пространственная организация регуляции — по обзору Hafner и соавт. (2023); совместимость последовательностей — по работе Bergman и соавт. (2022). Схема показывает устройство локуса и не содержит результатов измерений.</p></details></article><article class="card print-unit" id="ns-specificity"><div class="eyebrow">Энхансер и промотор · шаг 10 из 28</div><h2>От чего зависит избирательность действия энхансера</h2><p class="lead">Действие энхансера на промотор зависит сразу от нескольких условий, а не от одного свойства. Доступность участков, частота контактов и свойства промотора измеряют отдельно, потому что они не заменяют друг друга.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает энхансер E1 и два промотора. Для каждого промотора независимо заданы условная частота контакта, доступность и совместимость, а условный индекс новосинтезированной РНК рассчитывается по формуле учебной модели. Если промотор недоступен, рост частоты контакта не меняет синтез РНК; при высоких частотах ответ насыщается.</div><ol class="mech"><li>Первое условие — доступ факторов к своим мотивам в данном типе клеток.</li><li>Второе условие — сближение энхансера и промотора: контакт создаёт возможность взаимодействия, но не гарантирует его результат.</li><li>Третье условие — способность промотора собрать продуктивный комплекс; результат измеряют по <a href="#ns-g-S6-T52">новосинтезированной РНК</a> за заданный интервал.</li></ol><p><a href="#ns-g-S6-T31">Избирательность взаимодействия энхансера и промотора</a> — это преимущественное влияние энхансера на определённые промоторы в заданных условиях. Она количественна и зависит от клеточной системы, поэтому не сводится к жёсткому правилу «один энхансер — один промотор». Её удобно разложить на несколько условий, которые не заменяют друг друга.</p><p>Первое условие — доступность. Мотив энхансера может быть открыт в клетках одного типа и закрыт нуклеосомой в клетках другого, а в разных клетках его занимают разные комбинации факторов. Второе условие — пространственные контакты: чем чаще энхансер сближается с промотором, тем больше возможностей для их взаимодействия. Третье — свойства самого промотора: его последовательность и набор факторов определяют, насколько продуктивно он отвечает на влияние энхансера.</p><p>Совместимость последовательностей проверяли в репортёрной системе. В опыте ExP STARR-seq на клетках человека линии K562 попарно сопоставили 1000 энхансеров и 1000 промоторов. Большинство энхансеров активировало большинство промоторов примерно одинаково, а активность пары описывалась произведением собственных активностей энхансера и промотора: такая модель объясняла 82 % дисперсии сигнала (R² = 0,82). Различия оказались тоньше: промоторы генов «домашнего хозяйства» слабее отвечали на энхансеры, чем промоторы генов с переменной экспрессией. Такой результат ограничивает универсальные утверждения о жёстких парах, но не отменяет избирательности в эндогенном локусе, где добавляются состояние хроматина и пространственная организация.</p><p>Отсюда вывод: частота контакта и синтез РНК — разные величины. После вмешательства контакт может участиться, а количество новосинтезированной РНК останется прежним, если, например, промотор недоступен или его ответ ограничен другими условиями. И наоборот, количество РНК может измениться без заметного изменения контакта. Поэтому частоту контакта, доступность и количество РНК измеряют независимо и на сопоставимых сроках.</p><div class="note trap"><strong>Типичная ошибка</strong> Если энхансер чаще контактирует с промотором, синтез РНК этого гена обязательно растёт пропорционально.<p class="trap-fix">Контакт создаёт возможность взаимодействия, но не гарантирует результат. Доступность, набор факторов и свойства промотора ограничивают ответ, а связь частоты контакта с синтезом РНК не обязана быть линейной.</p></div><div class="static-quiz"><h3>После вмешательства частота контакта энхансера с промотором выросла, но количество новосинтезированной РНК не изменилось. Какое объяснение допустимо?</h3><ol><li><b>А.</b> Контакт участился, а продуктивный ответ промотора ограничен другими условиями. <i>(верный вариант)</i><br><span class="expl">Контакт создаёт возможность взаимодействия. Доступность, факторы и свойства промотора определяют результат.</span></li><li><b>Б.</b> Такой результат невозможен: контакт и транскрипция всегда меняются пропорционально. <i>(неверный вариант)</i><br><span class="expl">Частота контакта и синтез РНК — отдельные величины; строгая пропорциональность не установлена.</span></li><li><b>В.</b> Наличие контакта позволяет исключить влияние доступности промотора и его факторов. <i>(неверный вариант)</i><br><span class="expl">Контакт не устраняет других условий продуктивной транскрипции. Состояние промотора остаётся самостоятельным ограничением.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9262863/">Bergman DT et al. 2022. Compatibility rules of human enhancer and promoter sequences</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li><li><a href="https://doi.org/10.1038/s41576-022-00526-0">Hafner A et al. 2023. The spatial organization of transcriptional control</a></li></ul><p>Результаты ExP STARR-seq получены на репортёрных конструкциях в клетках человека линии K562 (Bergman и соавт., 2022); эндогенный локус дополнительно ограничен хроматином и топологией (Yang и соавт., 2024; Hafner и соавт., 2023). Числа на схеме условные: формула учебной модели показана рядом, и это не результат измерения.</p></details></article><article class="card print-unit" id="ns-loops"><div class="eyebrow">Энхансер и промотор · шаг 11 из 28</div><h2>Как когезин и CTCF меняют контакты хроматина</h2><p class="lead">Когезин увеличивает петлю хроматина, а ориентированные сайты CTCF могут остановить её увеличение. Топологически ассоциированный домен (TAD) — свойство усреднённой карты контактов, а не замкнутая «коробка».</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает, как когезин увеличивает петлю между двумя точками хроматина и как ориентированные сайты CTCF могут её ограничить. Рядом показана усреднённая карта контактов: внутри домена контакты чаще, чем через границу, но граница не исключает контактов. При удалении когезина петли не образуются; транскрипционный ответ в схеме не рассчитывается.</div><ol class="mech"><li><a href="#ns-g-S6-T36">Когезин</a> перемещается вдоль ДНК и увеличивает петлю; этот процесс называют <a href="#ns-g-S6-T37">экструзией петли</a>.</li><li>Сайты связывания <a href="#ns-g-S6-T38">CTCF</a> могут задерживать когезин, и результат зависит от ориентации мотива.</li><li>На усреднённой карте контактов это видно как <a href="#ns-g-S6-T39">TAD</a>: внутри домена контакты встречаются чаще, чем через границу, но граница не абсолютна.</li></ol><p>Когезин — кольцевой комплекс из семейства SMC. Он может перемещаться вдоль ДНК и процессивно увеличивать петлю: две удалённые по последовательности точки хроматина при этом сближаются. NIPBL участвует в загрузке когезина на ДНК, а WAPL — в его высвобождении; на схеме показан только основной процесс.</p><p>Продвижение когезина могут задерживать сайты связывания CTCF, и важна ориентация мотива. Для многих петель характерна конвергентная ориентация двух сайтов: их мотивы направлены навстречу друг другу. Эту закономерность нельзя без проверки переносить на каждую реальную границу: положение сайтов, время пребывания когезина на ДНК, скорость его высвобождения и состояние участка меняют распределение контактов.</p><p>Карта Hi-C показывает частоту контактов, усреднённую по множеству клеток. Области с повышенной частотой внутренних контактов видны на ней как TAD. Это статистическая картина, а не конформация одной клетки: петля не обязана существовать в каждой клетке непрерывно. Граница домена снижает вероятность части контактов через неё, но не исключает их. Поэтому положение энхансера внутри домена сужает поиск мишени, но не делает любой контакт за границей домена физически невозможным.</p><p>Что происходит при потере когезина? В опытах на клетках линии HCT-116 (колоректальная карцинома человека) быстрая деградация когезина привела через 6 ч к исчезновению всех петлевых доменов, тогда как компартментные домены и гистоновые метки остались прежними. Широкой эктопической активации генов не было, но экспрессия значительного меньшинства активных генов изменилась. Организация контактов и транскрипционный ответ зависят от разных условий и меняются в разных временных масштабах, поэтому влияние потери петель на конкретный ген проверяют в его клетках и на нужном сроке.</p><div class="note trap"><strong>Типичная ошибка</strong> TAD — замкнутая «коробка»: контакты через её границу полностью исключены.<p class="trap-fix">Граница снижает вероятность части контактов, но не исключает их. TAD — статистическая характеристика популяции клеток и условий измерения, а не неподвижная структура с непроницаемой стенкой.</p></div><div class="static-quiz"><h3>После быстрого удаления субъединицы когезина RAD21 исчезла значительная часть когезин-зависимых петель. В ранний срок количество РНК многих генов изменилось мало. Какой вывод обоснован?</h3><ol><li><b>А.</b> Организация контактов и транскрипция могут меняться в разной степени и с разной скоростью. <i>(верный вариант)</i><br><span class="expl">Потеря петель не вызывает одинакового немедленного эффекта для каждого гена.</span></li><li><b>Б.</b> Если петля исчезла, экспрессия каждого гена внутри неё уже должна быть полностью подавлена. <i>(неверный вариант)</i><br><span class="expl">Такой обязательной связи нет: роль петли и время ответа проверяют для каждого локуса отдельно.</span></li><li><b>В.</b> CTCF и когезин вообще не влияют на пространственную организацию генома в клетках. <i>(неверный вариант)</i><br><span class="expl">Уже первое наблюдение условия — исчезновение петель после удаления RAD21 — показывает, что организация контактов изменилась.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5846482/">Rao SSP et al. 2017. Cohesin Loss Eliminates All Loop Domains</a></li><li><a href="https://doi.org/10.1038/s41580-023-00609-8">Hoencamp C et al. 2023. Genome control by SMC complexes</a></li></ul><p>Свойства SMC-комплексов, экструзия петель и роль CTCF описаны в обзоре Hoencamp и соавт. (2023); результаты быстрой деградации когезина — в работе Rao и соавт. (2017; клетки линии HCT-116, 6 ч после добавления ауксина). Схема качественная: конкретные частоты контактов в ней не рассчитываются, а ориентации сайтов CTCF показывают логику правила, а не закон для каждого локуса.</p></details></article><article class="card print-unit" id="ns-coactivators"><div class="eyebrow">Энхансер и промотор · шаг 12 из 28</div><h2>Как факторы и коактиваторы связывают контакт с транскрипцией</h2><p class="lead">Mediator, CBP/p300 и BRD4 по-разному участвуют в передаче влияния энхансера на транскрипцию. Связывание белка, ацетилирование гистона и изменение синтеза РНК — разные события, и измеряют их отдельно.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает четыре независимых показателя: контакт энхансера с промотором, H3K27ac, присутствие BRD4 и новосинтезированную РНК. Связывание, ацетилирование и функциональное влияние обозначены разными стрелками. Если новосинтезированная РНК не измерена, транскрипционный эффект не оценён: контакт, H3K27ac и присутствие BRD4 не заменяют такого измерения.</div><ol class="mech"><li><a href="#ns-g-S6-T33">Mediator</a> способствует взаимодействию активаторов, связанных с энхансером, с аппаратом РНК-полимеразы II.</li><li><a href="#ns-g-S6-T34">CBP/p300</a> — ацетилтрансферазы: они присоединяют ацетильные группы к лизинам, в том числе к лизину 27 гистона H3 (<a href="#ns-g-S6-T58">H3K27ac</a>).</li><li><a href="#ns-g-S6-T35">BRD4</a> связывает ацетилированные участки хроматина и участвует в регуляции транскрипции.</li></ol><p><a href="#ns-g-S6-T32">Коактиватор</a> — белок или комплекс, который способствует транскрипции, взаимодействуя с регуляторами и с транскрипционным аппаратом. На энхансере действуют сразу несколько таких белков, и их функции не совпадают.</p><p>Mediator — многосубъединичный комплекс. Его хвостовой модуль связывается с активаторами на энхансере и облегчает сборку преинициаторного комплекса РНК-полимеразы II на промоторе. По данным обзора Yang и соавт., после острого удаления Mediator частота контактов энхансера с промотором, измеренная методом Hi-C, менялась мало (авторы обзора оговаривают технические ограничения таких методов). Это согласуется с тем, что связь между энхансером и промотором не сводится к одному белку, а контакт и функция коактиватора — разные величины.</p><p>CBP и p300 — родственные ацетилтрансферазы. Они присоединяют ацетильную группу к лизинам гистонов, в частности к лизину 27 гистона H3, и поэтому на активных энхансерах появляется метка H3K27ac. Воздействия на эти белки бывают разными. Каталитический ингибитор A-485 конкурирует с ацетил-КоА и в клетках линии PC-3 снижал H3K27ac, но не H3K9ac. Блокада бромодомена CBP/p300 в моделях гематологических опухолей приводила к потере H3K27ac на энхансерах при сохранении самих белков на хроматине. Это два разных вмешательства, и результаты нельзя объединять в одно утверждение.</p><p>BRD4 относится к BET-белкам: его бромодомены связывают ацетилированные лизины, поэтому BRD4 локализуется на ацетилированном хроматине. BET-ингибитор препятствует такому связыванию, и присутствие BRD4 в локусе уменьшается. Присутствие BRD4 — показатель связывания; он не равен ни контакту энхансера с промотором, ни синтезу РНК.</p><p>Скопления коактиваторов в ядре описывают как возможные локальные конденсаты. Одной микрофотографии для вывода о <a href="#ns-g-S6-T42">фазовом разделении</a> недостаточно; критерии и ограничения разобраны в следующем шаге.</p><div class="note trap"><strong>Типичная ошибка</strong> Если BET-ингибитор уменьшил присутствие BRD4 на энхансере, то синтез РНК мишени тоже снизился.<p class="trap-fix">Присутствие BRD4, контакт энхансера с промотором и синтез РНК — разные величины. Влияние ингибитора на транскрипцию оценивают по новосинтезированной РНК в том же временном интервале, а не по одному из первых двух показателей.</p></div><div class="static-quiz"><h3>BET-ингибитор уменьшил присутствие BRD4 в локусе, а контакт энхансера с промотором в тот же срок сохранился. Что необходимо измерить, чтобы оценить транскрипционный эффект?</h3><ol><li><b>А.</b> Новосинтезированную РНК мишени в том же временном интервале. <i>(верный вариант)</i><br><span class="expl">Сохранение контакта не отвечает на вопрос о продуктивности транскрипции. Нужен отдельный показатель синтеза РНК.</span></li><li><b>Б.</b> Исходное расстояние между элементами по последовательности ДНК. <i>(неверный вариант)</i><br><span class="expl">По исходному расстоянию нельзя судить о действии BRD4 на текущую транскрипцию.</span></li><li><b>В.</b> Наличие CTCF в другом локусе. <i>(неверный вариант)</i><br><span class="expl">Наличие CTCF в другом локусе не служит прямым показателем ответа исследуемой мишени.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li><li><a href="https://doi.org/10.1038/s41576-022-00526-0">Hafner A et al. 2023. The spatial organization of transcriptional control</a></li><li><a href="https://doi.org/10.1038/nature24028">Lasko LM. et al. Discovery of a selective catalytic p300/CBP inhibitor that targets lineage-specific tumours. Nature. 2017;550:128–132. doi:10.1038/nature24028</a></li><li><a href="https://doi.org/10.1016/j.celrep.2018.07.041">Raisner R. et al. Enhancer Activity Requires CBP/P300 Bromodomain-Dependent Histone H3K27 Acetylation. Cell Rep. 2018;24:1722–1729. doi:10.1016/j.celrep.2018.07.041</a></li></ul><p>Роль Mediator и данные о контактах после его острого удаления даны по обзору Yang и соавт. (2024); A-485 как каталитический ингибитор CBP/p300 (клетки PC-3, снижение H3K27ac, но не H3K9ac) — по работе Lasko и соавт. (2017); зависимость активности энхансера от бромодомена CBP/p300 в моделях гематологических опухолей — по аннотации работы Raisner и соавт. (2018). Сведения о BRD4 и о действии BET-ингибиторов — общие, в источниках шага не проверялись. Состояния на схеме выбираются вручную и показывают логику измерений, а не результаты опытов.</p></details></article><article class="card print-unit" id="ns-super-enhancers"><div class="eyebrow">Энхансер и промотор · шаг 13 из 28</div><h2>Что называют суперэнхансером</h2><p class="lead">Суперэнхансер — группа соседних регуляторных элементов, выделенная по заданному критерию высокого суммарного сигнала. Порог такого отбора условен, а принадлежность к суперэнхансерам сама по себе не доказывает влияние на конкретный ген.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает ряд соседних регуляторных элементов с условным сигналом H3K27ac. Соседние элементы объединяются по заданному расстоянию, группы ранжируются по суммарному сигналу, а порог определяет, какие из них отнесены к суперэнхансерам. Изменение расстояния и порога меняет список; влияние группы на ген в схеме не проверяется.</div><ol class="mech"><li>Соседние элементы с высоким сигналом H3K27ac или связывания коактиваторов объединяют в группу, если расстояние между ними меньше выбранного предела.</li><li>Группы ранжируют по суммарному сигналу; к <a href="#ns-g-S6-T41">суперэнхансерам</a> относят те, что превышают заданный порог.</li><li>Влияние группы на ген проверяют отдельно: нарушают функцию элементов и измеряют РНК предполагаемой мишени с контролями.</li></ol><p>Суперэнхансер — не особая последовательность, а группа регуляторных элементов, выделенная по конкретному критерию: например, по высокому суммарному сигналу H3K27ac или связывания коактиваторов, таких как BRD4 и MED1. Один из способов выделения состоит в том, чтобы объединить близко расположенные элементы и проранжировать получившиеся группы по суммарному сигналу.</p><p>Критерий условен. Если изменить расстояние, на котором соседние элементы объединяют, или порог суммарного сигнала, состав списка изменится: часть групп попадёт в него или выйдет из него. Поэтому «суперэнхансер» — операционное понятие, и в каждой работе нужно выяснить, по какой метке, при каком объединении и при каком пороге группу выделили.</p><p>Выделенные так группы часто расположены рядом с генами клеточной идентичности. Например, в эмбриональных стволовых клетках мыши суперэнхансеры связаны с геном Nanog, а также с генами Klf4, Mir290 и Trim28 (Sabari и соавт., 2018). Однако высокий сигнал H3K27ac помогает лишь выбрать кандидатов: он не показывает, какой ген регулируется группой и нужна ли она для экспрессии этого гена. Для этого нарушают функцию элементов, например удаляют их или подавляют адресно, и измеряют новосинтезированную РНК предполагаемой мишени с контролями. Ближайший ген мишенью автоматически не считают.</p><p>На суперэнхансерах эмбриональных стволовых клеток мыши BRD4 и MED1 образуют скопления с жидкоподобными свойствами; опыты in vitro и с 1,6-гександиолом поддерживают модель конденсации. Это не доказывает, что каждый суперэнхансер образует конденсат или что конденсат необходим для транскрипции: критерии косвенные, а 1,6-гександиол неспецифичен. Одинаковую чувствительность всех суперэнхансеров к BET-ингибитору тоже нельзя предполагать заранее.</p><div class="note trap"><strong>Типичная ошибка</strong> Суперэнхансер — одна очень длинная последовательность с особой функцией, а высокий сигнал H3K27ac доказывает регуляцию ближайшего гена.<p class="trap-fix">Суперэнхансер — группа соседних элементов, выделенная по заданному критерию с условным порогом. Сигнал H3K27ac помогает найти кандидатов, а мишень и необходимость группы устанавливают отдельным функциональным тестом.</p></div><div class="static-quiz"><h3>Группу элементов отнесли к суперэнхансерам по высокому суммарному сигналу H3K27ac. Какой дополнительный тест нужен, чтобы установить её влияние на выбранный ген?</h3><ol><li><b>А.</b> Нарушить функцию элементов и измерить РНК предполагаемой мишени с контролями. <i>(верный вариант)</i><br><span class="expl">Критерий классификации и функциональное действие проверяют отдельно.</span></li><li><b>Б.</b> Ограничиться высоким сигналом H3K27ac, потому что он уже доказывает функциональную связь. <i>(неверный вариант)</i><br><span class="expl">Метка помогает выделить кандидатов, но не доказывает причинную связь с конкретным геном.</span></li><li><b>В.</b> Выбрать ближайший ген, потому что суперэнхансеры действуют только на него. <i>(неверный вариант)</i><br><span class="expl">По близости расположения нельзя установить мишень регуляторного элемента.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://doi.org/10.1038/s41576-022-00526-0">Hafner A et al. 2023. The spatial organization of transcriptional control</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li><li><a href="https://doi.org/10.1126/science.aar3958">Sabari BR. et al. Coactivator condensation at super-enhancers links phase separation and gene control. Science. 2018;361:eaar3958. doi:10.1126/science.aar3958</a></li></ul><p>Определение по критерию сигнала и ограничения интерпретации даны по обзорам Hafner и соавт. (2023) и Yang и соавт. (2024); скопления BRD4 и MED1 в эмбриональных стволовых клетках мыши, опыты in vitro и с 1,6-гександиолом, а также связь суперэнхансеров с генами Nanog, Klf4, Mir290 и Trim28 — по работе Sabari и соавт. (2018). Значения на схеме искусственные и показывают логику классификации.</p></details></article><article class="card print-unit" id="ns-enhancer-test"><div class="eyebrow">Энхансер и промотор · шаг 14 из 28</div><h2>Как проверить мишень энхансера и последствия перестройки</h2><p class="lead">Чтобы установить мишень энхансера, нужно вмешаться в исходный локус и измерить новосинтезированную РНК. Контакт, доступность, метки хроматина и репортёрный тест — отдельные свидетельства, и каждое отвечает на свой вопрос.</p><div class="note"><strong>Что показывает схема.</strong> Схема сопоставляет методы и их ограничения (контакты, доступность, присутствие белка, репортёрный тест, делеция, CRISPRi, замена мотива, новосинтезированная РНК), а также показывает локус с границей, связанной с CTCF. При нарушении границы энхансеры получают доступ к другому гену, и возможна его эктопическая экспрессия; перестройка, сохраняющая границу, этого не вызывает.</div><ol class="mech"><li>Hi-C и 4C показывают контакты, ATAC — доступность, ChIP и CUT&amp;Tag — присутствие белка или модификации; вместе они помогают выбрать кандидата, но не доказывают регуляцию.</li><li>Репортёрный тест показывает, что фрагмент способен усиливать транскрипцию в конкретной системе, а не то, что он регулирует данный ген в исходном локусе.</li><li>Мишень устанавливают вмешательством в локус — делецией, подавлением (CRISPRi) или заменой мотива — и независимым измерением новосинтезированной РНК.</li></ol><p>Методы отвечают на разные вопросы. Hi-C и 4C измеряют частоту пространственной близости участков, ATAC — доступность хроматина для транспозазы, ChIP и CUT&amp;Tag — присутствие белка или модификации около участка. Эти показатели помогают выбрать кандидатов в энхансеры и в мишени, однако ни один из них не доказывает, что элемент регулирует данный ген. Высокий сигнал ATAC в смеси клеток может отражать небольшую популяцию, а контакт не равен синтезу РНК.</p><p>Репортёрный тест проверяет, способен ли фрагмент усиливать транскрипцию в конструкции. После переноса фрагмента меняются соседство, число копий и хроматиновый контекст. Поэтому положительный результат показывает активность фрагмента в этой системе, но система воспроизводит не все ограничения исходного локуса.</p><p>Ближе к физиологии вмешательство в самом локусе. Делеция проверяет необходимость участка, но одновременно изменяет расстояния между соседними последовательностями. Точечная замена мотива точнее указывает на роль конкретного сайта связывания фактора, хотя может создать новый мотив. Подавление участка с помощью dCas9-KRAB (CRISPRi) даёт другую проверку, но вмешательство может менять местный хроматин. Если разные способы приводят к согласованному изменению новосинтезированной РНК, вывод устойчивее. Отсутствие эффекта одной делеции не доказывает, что элемент нефункционален: соседние элементы могут частично компенсировать его утрату.</p><p>Перестройки показывают, как состав мишеней может меняться. В локусе WNT6/IHH/EPHA4/PAX3, охватывающем несколько TAD, делеции, инверсии и дупликации вызывают у людей разные пороки формирования конечности. В мышиных моделях с соответствующими перестройками кластер энхансеров конечности, в норме связанный с Epha4 внутри одного TAD, оказывался смещён относительно границ TAD и запускал эктопическую экспрессию другого гена локуса. Такое перераспределение контактов происходило только в тех случаях, когда вариант нарушал границу, связанную с CTCF.</p><div class="note trap"><strong>Типичная ошибка</strong> Если фрагмент усиливает репортёр и расположен рядом с геном A, то он регулирует ген A в исходном локусе.<p class="trap-fix">Репортёрный тест показывает активность фрагмента в конструкции, а близость и доступность лишь помогают выбрать кандидата. Мишень в исходном локусе устанавливают вмешательством и независимым измерением новосинтезированной РНК.</p></div><div class="static-quiz"><h3>В репортёрном тесте фрагмент усиливает экспрессию. Какой результат сильнее подтверждает, что в исходном локусе он регулирует именно ген A?</h3><ol><li><b>А.</b> Вмешательство в локус меняет новосинтезированную РНК A; независимое вмешательство даёт тот же результат. <i>(верный вариант)</i><br><span class="expl">Функциональное вмешательство в исходной системе связывает элемент с измеряемым ответом; нужны также контроль специфичности и жизнеспособности.</span></li><li><b>Б.</b> Фрагмент расположен ближе к гену A, чем к любому другому гену, находящемуся рядом с этим локусом. <i>(неверный вариант)</i><br><span class="expl">Расстояние полезно для выбора кандидата, но не устанавливает функциональную связь.</span></li><li><b>В.</b> Фрагмент имеет высокий ATAC-сигнал в смеси клеток, в которых экспрессируется ген A, и связывает активаторы. <i>(неверный вариант)</i><br><span class="expl">Доступность хроматина и связывание активаторов сами по себе не определяют ген-мишень.</span></li></ol></div><p class="practice-row">Эта тема относится к вопросу 2 практикума. <a href="seminar-6.html#q2">Открыть сценарии вопроса 2 →</a></p><details open class="sources"><summary>Источники и условия</summary><ul class="src-list"><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4791538/">Lupiáñez DG et al. 2015. Disruptions of topological chromatin domains cause pathogenic rewiring of gene-enhancer interactions</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9262863/">Bergman DT et al. 2022. Compatibility rules of human enhancer and promoter sequences</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9771884/">Preissl S et al. 2023. Characterizing cis-regulatory elements using single-cell epigenomics</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11574175/">Yang JH et al. 2024. Enhancer selectivity in space and time: from enhancer-promoter interactions to promoter activation</a></li></ul><p>Возможности и ограничения методов описаны в обзорах Preissl и соавт. (2023) и Yang и соавт. (2024); совместимость последовательностей в репортёрной системе — в работе Bergman и соавт. (2022); перестройки района EPHA4 — в работе Lupiáñez и соавт. (2015; люди, модельные мыши, фибробласты пациентов). Сравнение делеции, замены мотива и CRISPRi дано как общее методическое знание: в названных обзорах оно не разбирается. Схема качественная и не содержит результатов измерений; она не заменяет интерпретацию нового варианта у конкретного пациента.</p></details></article><article class="card print-unit" id="ns-foxo"><div class="eyebrow">FOXO и сигнал · шаг 15 из 28</div><h2>Как сигнал инсулина достигает FOXO</h2><p class="lead">Сигнал инсулина или IGF-1 доходит до FOXO по цепи реакций: рецептор → IRS → PI3K → PIP₃ → AKT → FOXO. PI3K фосфорилирует липид в мембране, а AKT — белок FOXO; количество AKT, её фосфорилирование и каталитическая активность — разные величины.</p><div class="note"><strong>Что показывает схема.</strong> Схема показывает цепь: инсулин или IGF-1 → рецептор → IRS → PI3K → PIP₃ в мембране → AKT (при участии PDK1 и mTORC2) → FOXO1. PTEN снижает содержание PIP₃. Без сигнала все показатели цепи низкие, при сигнале они повышаются по всей цепи. Селективный ингибитор PI3K снижает содержание PIP₃ и фосфорилирование FOXO1 при активном рецепторе. АТФ-конкурентный ингибитор AKT снижает фосфорилирование субстратов при высоком pAKT. Рапамицин не подавлял фосфорилирование FOXO1 по участкам AKT в клетках 293.</div><ol class="mech"><li>Рецептор инсулина или рецептор IGF-1 фосфорилирует белки IRS, к которым присоединяется липидкиназа PI3K.</li><li>PI3K превращает мембранный PI(4,5)P₂ в PIP₃; фосфатаза PTEN снижает содержание PIP₃.</li><li>PIP₃ привлекает AKT к мембране, где её фосфорилируют PDK1 и mTORC2; активная AKT фосфорилирует <a href="#ns-g-S6-T44">FOXO</a> по определённым участкам.</li></ol><p>После связывания инсулина или IGF-1 рецептор фосфорилирует адаптерные белки IRS, и к ним присоединяется липидкиназа PI3K. Её субстрат — мембранный фосфоинозитид PI(4,5)P₂: PI3K превращает его в PIP₃. На этом этапе FOXO ещё не затронут, а сам PIP₃ остаётся в мембране.</p><p>PIP₃ служит местом связывания для киназы AKT, поэтому AKT локализуется у мембраны. Там её фосфорилируют PDK1 (по Thr308) и mTORC2 (по Ser473). Фосфатаза PTEN дефосфорилирует PIP₃ и тем самым снижает содержание этого липида; при потере PTEN оно может быть повышенным и без внешнего сигнала.</p><p>Активная AKT фосфорилирует FOXO. В человеческом FOXO1 это остатки Thr24, Ser256 и Ser319; в клетках 293 их фосфорилирование при стимуляции IGF-1 подавлялось вортманнином, ингибитором PI3K, но не рапамицином. Поэтому порядок событий таков: сначала фосфорилируется липид, затем киназа AKT, затем транскрипционный фактор FOXO1.</p><p>Для AKT различают три величины: количество белка, его фосфорилирование по Thr308 и Ser473 (pAKT) и <a href="#ns-g-S6-T51">каталитическую активность</a> — способность фосфорилировать заданный субстрат. Эти величины не обязательно изменяются одновременно: pAKT показывает модификацию самой киназы, а активность оценивают по фосфорилированию её субстрата (шаг 20).</p><div class="note trap"><strong>Типичная ошибка</strong> PI3K — киназа, поэтому она сама фосфорилирует FOXO.<p class="trap-fix">Субстрат PI3K — фосфоинозитид в мембране, а не белок FOXO. FOXO1 фосфорилируется киназой AKT, которая активируется ниже по цепи, поэтому подавление PI3K действует на FOXO опосредованно — через PIP₃ и AKT.</p></div><div class="static-quiz"><h3>В клетках с сохранными рецептором и IRS селективно подавлена PI3K. Какое звено рассматриваемой цепи нарушено непосредственно?</h3><ol><li><b>А.</b> Образование мембранного PIP₃ из PI(4,5)P₂. <i>(верный вариант)</i><br><span class="expl">PI3K фосфорилирует фосфоинозитид. Дальнейшие изменения AKT и FOXO следуют из нарушения этого звена.</span></li><li><b>Б.</b> Экспорт FOXO1 из ядра в цитоплазму переносчиком PI3K. <i>(неверный вариант)</i><br><span class="expl">PI3K — липидкиназа, а не экспортный рецептор. Перенос FOXO меняется на последующих этапах сигнальной цепи.</span></li><li><b>В.</b> Фосфорилирование FOXO1 самой киназой PI3K. <i>(неверный вариант)</i><br><span class="expl">В рассматриваемой цепи субстрат PI3K — мембранный фосфоинозитид. FOXO1
