вание NADH в цикле увеличится", "p2b_2_e": "При прежнем содержании метаболитов усиленный отток превышал бы приток, поэтому содержание снижается. На схеме показано новое установившееся состояние: притоки и выходы уравновешены, но содержание малата/ОАА — ×0,46. Приток через GLS почти не изменился (×1,00), а поток через ПК вырос до ×1,89. Цитратсинтазе доступно меньше ОАА: поток через неё — ×0,72, образование NADH в цикле — ×0,71. Выход цитрата вырос до ×1,22, выход глутамата — до ×1,41; они не удвоились, поскольку содержание метаболитов в пулах снизилось. Доступность аспартата снизилась с 69 до 58 %.", "p2b_2_w1": "Поток через ПК вырос до ×1,89, а приток через GLS остался на уровне ×1,00. Однако прежнее содержание метаболитов не сохранилось: содержание малата/ОАА снизилось до ×0,46. В новом установившемся состоянии притоки и выходы равны, но при более низком содержании метаболитов.", "p2b_2_w3": "Усиленный отток снижает содержание ОАА, и цитратсинтазе доступно меньше субстрата: поток через неё — ×0,72, а не выше эталона. NADH образуется в реакциях цикла, поэтому образование NADH в цикле тоже снижается (×0,71).", "p2b_3_q": "В среде нет глутамина, коэффициент оттока метаболитов на биосинтез равен 1,00, а содержание α-КГ составляет ×0,27 от эталона. Коэффициент оттока снизили до 0,30. Как изменится содержание α-КГ?", "p2b_3_o1": "Не изменится: приток через GLS по-прежнему равен нулю", "p2b_3_o2": "Снизится: цикл замедлится", "p2b_3_o3": "Вырастет, хотя приток через GLS по-прежнему равен нулю", "p2b_3_e": "Содержание метаболита задаётся балансом притока и оттока, а не одним притоком. Отток α-КГ на синтез уменьшился (выход глутамата ×0,27 → ×0,16), поэтому содержание α-КГ повышается (×0,27 → ×0,53), хотя приток через GLS по-прежнему нулевой. Содержание малата/ОАА тоже повышается (×0,22 → ×0,48), поток через цитратсинтазу — ×0,45 → ×0,73, но он остаётся ниже эталона, поскольку притока через GLS нет. Условие модели: приток через GLS не изменяется вслед за оттоком, а поток через ПК меняется только вместе с уровнем ОАА (×3,13 → ×1,83).", "p2b_3_w1": "Приток через GLS нулевой в обоих состояниях, но содержание α-КГ зависит и от оттока. Когда α-КГ медленнее расходуется на синтез глутамата (выход ×0,16 вместо ×0,27), его содержание повышается.", "p2b_3_w2": "Поток цикла не снижается, а возрастает: когда на синтез расходуется меньше ОАА, его содержание повышается (×0,22 → ×0,48), и поток через цитратсинтазу растёт (×0,45 → ×0,73). Поэтому содержание α-КГ повышается, а не снижается.", "p2a_1_q": "Клетку линии 1 в эталонных условиях — в среде с 2 мМ глутамина — обработали ингибитором глутаминазы (GLS). Как изменятся поток через ПК и доступность аспартата?", "p2a_1_o1": "Поток через ПК вырастет настолько, что доступность аспартата не изменится", "p2a_1_o2": "Поток через ПК вырастет, но доступность аспартата всё же снизится", "p2a_1_o3": "Поток через ПК не изменится, а доступность аспартата снизится", "p2a_1_e": "Приток через GLS снизился (×1,00 → ×0,10; в модели остаточная активность — 10 %), а содержание малата/ОАА — до ×0,26. Поток через ПК вырос (×1,00 → ×2,78), поскольку в модели он увеличивается при недостатке ОАА. Однако компенсация частичная: поток через цитратсинтазу — ×0,52, доступность аспартата снизилась (69 → 47 %), индекс деления — тоже (81 → 55 %). В клетках глиобластомы LN229 после подавления GLS (shRNA) вклад ПК в пополнение цитрата увеличился (Cheng 2011).", "p2a_1_w1": "Компенсация частичная: поток через ПК вырос (×2,78), но содержание малата/ОАА осталось намного ниже эталонного значения (×0,26). Поэтому доступность аспартата снизилась (69 → 47 %), а не осталась прежней.", "p2a_1_w3": "В модели поток через ПК зависит от уровня малата/ОАА: при снижении уровня ОАА он вырос (×1,00 → ×2,78). В клетках глиобластомы подавление GLS тоже повышало вклад ПК (Cheng 2011).", "p2a_2_q": "В клетках линии 1 подавили ПК; при 2 мМ глутамина индекс деления почти не изменился: 80 % шкалы при эталонном значении 81 %. Затем глутамин удалили из среды. Как изменится деление клеток линии 1?", "p2a_2_o1": "Деление сильно замедлится: цикл лишится обоих путей пополнения", "p2a_2_o2": "Деление почти не изменится: ацетил-CoA из PDH поступает, как раньше", "p2a_2_o3": "Деление замедлится умеренно: возросший поток через ПК возместит недостаток", "p2a_2_e": "Оба источника пополнения ослаблены: без глутамина приток через GLS равен нулю, а в формулу притока через ПК введён множитель 0,10. При низком уровне малата/ОАА поток через ПК частично возрастает (×0,11 → ×0,65), но прежние значения содержания не сохраняются: малат/ОАА — ×0,03, поток через цитратсинтазу — ×0,08. Доступность аспартата — 10 %, индекс деления снизился с 80 до 12 %. Без пополнения промежуточных метаболитов поступление ацетил-CoA не может поддерживать поток цикла. В клетках SF-xL, адаптированных к низкой концентрации глутамина, подавление ПК ограничивало рост без глутамина, но не в его присутствии (Cheng 2011).", "p2a_2_w2": "Ацетил-CoA от PDH поступает, как раньше, но цитратсинтазе необходим и ОАА. Содержание малата/ОАА снизилось до ×0,03, а поток через цитратсинтазу — до ×0,08. Сам по себе ацетил-CoA не повышает содержание промежуточных метаболитов цикла.", "p2a_2_w3": "В модели приток через ПК ослаблен множителем 0,10. Из-за низкого уровня малата/ОАА поток частично вырос (×0,11 → ×0,65), но прежние значения содержания не сохранились: малат/ОАА — ×0,03. Доступность аспартата — 10 %, деление — 12 %.", "p2a_3_q": "В модели эталонной клетки линии 1 сукцинатдегидрогеназа (SDH) утрачена. Как изменятся содержание сукцината и содержание малата/ОАА?", "p2a_3_o1": "Содержание обоих метаболитов снизится: поток цикла уменьшится", "p2a_3_o2": "Сукцинат накопится, а малат/ОАА останется на уровне эталона: ПК возместит недостаток", "p2a_3_o3": "Сукцинат накопится, а содержание малата/ОАА снизится", "p2a_3_e": "Цикл прерывается на сукцинате: сукцинат накапливается (в модели ×29; значение превышает шкалу полосы), а перенос электронов через SDH — ×0,00. Из сукцината малат и ОАА не образуются, поэтому содержание малата/ОАА снижается до ×0,10. Поток через ПК вырос до ×4,55, и ПК становится основным источником ОАА. Однако поток через цитратсинтазу — ×0,26, доступность аспартата снизилась (69 → 28 %), деление — тоже (81 → 33 %). В клетках почечного эпителия мыши с потерей Sdhb содержание сукцината было примерно в 200 раз выше, чем в контроле, а рост зависел от ПК (Cardaci 2015; для хромаффинных клонов — Lussey-Lepoutre 2015).", "p2a_3_w1": "Содержание сукцината не снижается, а повышается (в модели ×29): сукцинат по-прежнему образуется в предшествующих реакциях цикла, а SDH, превращающая его в фумарат, утрачена.", "p2a_3_w2": "Поток через ПК вырос (×4,55), но содержание малата/ОАА осталось ниже эталонного значения (×0,10): цикл прерван, из сукцината ОАА не образуется, а часть ОАА по-прежнему расходуется на синтез аспартата. Доступность аспартата — 28 %.", "p2a_4_q": "В клетке с потерей SDH индекс деления составляет 33 % шкалы при эталонном значении 81 %. Активность ПК подавили. Как изменится деление?", "p2a_4_o1": "Почти не изменится: цикл уже прерван, и ПК на него не влияет", "p2a_4_o2": "Снизится почти до нуля", "p2a_4_o3": "Снизится умеренно: ОАА образуется из глутамина через GLS", "p2a_4_e": "Без SDH окислительный путь от α-КГ прерван на сукцинате, и ОАА в модели пополняется главным образом через ПК. В реальных SDH-дефицитных клетках вклад восстановительного пути в синтез аспартата сохранялся, но был меньше вклада ПК (Cardaci 2015). После введения множителя 0,10 в формулу притока через ПК содержание малата/ОАА составляет ×0,01, поток через цитратсинтазу — ×0,04, доступность аспартата — 5 %, а деление снижается (33 → 6 %). Зависимость таких клеток от ПК и восстановление роста аспартатом показаны в опытах Cardaci 2015; результаты Lussey-Lepoutre 2015 тоже указывают на зависимость от пируваткарбоксилирования.", "p2a_4_w1": "При потере SDH главным источником ОАА служит ПК (поток ×4,55 в исходном состоянии). Подавление ПК лишает цикл этого притока: поток через цитратсинтазу снижается до ×0,04, а деление — до 6 %.", "p2a_4_w3": "Приток через GLS сохраняется (×1,00), и из глутамина образуется α-КГ. Однако цикл прерван на сукцинате, и в модели ОАА из α-КГ не образуется. Содержание малата/ОАА — ×0,01, деление — 6 %.", "p2a_5_q": "Эталонную клетку выращивают с ¹³C-глутамином до установившегося мечения. В модели доля цитрата M+5 равна 0 %: это упрощение, поскольку в культуре клеток она обычно невелика, но не равна нулю. Клетку обработали пиерицидином, который блокирует комплекс I. Как изменится доля цитрата M+5?", "p2a_5_o1": "Появится цитрат M+5: часть α-КГ превратится в цитрат в обратном направлении", "p2a_5_o2": "Цитрат M+5 не появится: метка идёт по окислительному пути, как раньше", "p2a_5_o3": "Доля цитрата M+4 заметно вырастет: окислительный путь ускорится", "p2a_5_e": "При блокаде комплекса I NADH матрикса окисляется медленнее. Окислительный путь замедляется (образование NADH в цикле — ×0,33, поток через цитратсинтазу — ×0,22), а часть α-КГ превращается в цитрат в обратном направлении путём восстановительного карбоксилирования с участием NADP⁺-зависимых IDH1 и IDH2. Доля цитрата M+5 на графике возрастает: 0 → 37 %. Изотополог M+5 указывает на вклад этого потока, но по одной доле M+5 чистый поток не оценивают: обмен через IDH и аконитазу тоже даёт M+5 (Fan 2013; Buescher 2015). В разных клетках и при разных воздействиях эту реакцию катализируют разные изоформы (Metallo 2012; Wise 2011; Mullen 2014; Gaude 2018). Доступность аспартата при этом снижается (69 → 13 %), деление — тоже (81 → 15 %), поскольку дыхательная цепь регенерирует NAD⁺, необходимый для синтеза аспартата (Sullivan 2015; Birsoy 2015). Значение узла «малат / ОАА» при этом составляет ×1,29. Узел объединяет малат и ОАА, а при избытке NADH равновесие малатдегидрогеназной реакции смещается в сторону малата. Поэтому увеличение значения узла не означает повышения содержания ОАА, из которого образуется аспартат.", "p2a_5_w2": "Метка проходит и по окислительному пути (цитрат M+4 — 36 %), но при блокаде комплекса I появляется и M+5 (37 %): часть α-КГ превращается в цитрат в обратном направлении при участии NADP⁺-зависимых IDH1 и IDH2. Окислительный путь при этом направления не меняет.", "p2a_5_w3": "Блокада комплекса I замедляет окисление NADH, поэтому окислительный путь не ускоряется, а замедляется: образование NADH в цикле — ×0,33, поток через цитратсинтазу — ×0,22. Доля цитрата M+4 не выросла (38 → 36 %).", "p2a_6_q": "Клетки линий 1 и 2 при 2 мМ глутамина делятся одинаково (81 % и 81 %; см. «Две линии клеток»). У одной линии цикл пополняется в основном через ПК, у другой — через GLS. В модели приток через GLS при 2 мМ уже близок к насыщению. Какой опыт позволит определить, у какой линии основной приток идёт через ПК?", "p2a_6_o1": "Повысить концентрацию глутамина до 4 мМ и сравнить деление клеток двух линий", "p2a_6_o2": "Добавить пиерицидин и сравнить деление клеток двух линий", "p2a_6_o3": "Удалить глутамин и сравнить деление клеток двух линий", "p2a_6_e": "Без глутамина приток через GLS равен нулю, и деление определяется притоком через ПК. У клеток линии 1 индекс деления снизился (81 → 51 %), а у клеток линии 2 почти не изменился (81 → 78 %). Следовательно, у линии 2 основной приток идёт через ПК, а у линии 1 — через GLS. Одинаковое деление в присутствии глутамина не означает одинаковых притоков. Так различались две линии клеток рака печени: HepG2 использует глутамин как основной анаплеротический предшественник и при подавлении GLS растёт медленнее, а Huh-7 с высокой активностью ПК не замедляет рост ни при подавлении GLS, ни без глутамина (Cheng 2011).", "p2a_6_w1": "При 4 мМ глутамина приток через GLS в модели насыщается, и деление клеток обеих линий почти не меняется (82 % и 82 %). Проверьте: установите ползунок «Глутамин в среде» на 4 мМ. Этот опыт не позволяет различить линии.", "p2a_6_w2": "Пиерицидин блокирует комплекс I, и индекс деления клеток обеих линий уменьшается почти одинаково (15 % и 15 %): поток через цитратсинтазу у обеих линий снижается до одного значения, а синтез аспартата при блокаде комплекса I ограничен недостатком NAD⁺ (вопрос 1). Проверьте: включите пиерицидин. Этот опыт не позволяет различить линии.", "p2a_7_q": "Продолжаем сравнение двух линий. В среду добавлена [U-¹³C₆]глюкоза; показано установившееся мечение. ПК превращает пируват M+3 в оксалоацетат M+3, из которого образуется аспартат M+3. Как будут соотноситься доли аспартата M+3 у линий 1 и 2?", "p2a_7_o1": "Аспартат M+3 будет у линии с высоким потоком через ПК; у другой линии его не будет", "p2a_7_o2": "Аспартат M+3 будет у обеих линий, но у линии с высоким потоком через ПК его доля выше", "p2a_7_o3": "Доли аспартата M+3 одинаковы: деление клеток двух линий одинаково, значит, и притоки одинаковы", "p2a_7_e": "Аспартат M+3 обнаруживается у обеих линий: 19 % у линии 1 и 36 % у линии 2. Изотополог M+3 образуется через ПК, но при установившемся мечении появляется и после нескольких оборотов цикла. Поэтому доля M+3 не равна доле ОАА, образованного в реакции ПК, и не отражает поток через ПК. В модели более высокая доля M+3 у линии 2 согласуется с большим вкладом ПК в этой линии и с результатом опыта без глутамина (шаг 6). В реальном опыте учитывают также степень мечения предшественников и другие изотопологи. Деление обеих линий при 2 мМ глутамина одинаково — 81 %.", "p2a_7_w1": "Изотополог M+3 образуется не только в реакции ПК, но и после нескольких оборотов цикла. У линии 1 с малым потоком через ПК аспартат M+3 тоже есть (19 %), поэтому признак «есть или нет» не различает линии.", "p2a_7_w3": "Деление при 2 мМ глутамина одинаково (81 % и 81 %), хотя притоки разные: недостаток одного притока возмещается другим. Доли аспартата M+3 различаются (19 % и 36 %).", "s2_terms": "Термины", "fn_cit": "цитрат (3−)", "fn_akg": "α-кетоглутарат (2−)", "fn_suc": "сукцинат (2−)", "fn_mal": "L-малат (2−)", "fn_oaa": "оксалоацетат (2−)", "fn_gln": "L-глутамин", "fn_glu": "L-глутамат (1−)", "fn_tela": "телагленастат (CB-839)", "fn_bptes": "BPTES", "fn_pier": "пиерицидин A", "fn_accoa": "ацетил-CoA: реакционный фрагмент", "lg_cyc": "синяя частица — промежуточный продукт цикла (вопрос 2)", "lg_gln": "зелёная частица — глутамин (вопрос 2)", "lg_exit": "розовая частица — вещество, отводимое из цикла на биосинтез (вопрос 2)", "fn_fum": "фумарат (2−)", "fn_hgr": "R-2-гидроксиглутарат (2−)", "fn_hgs": "S-2-гидроксиглутарат (2−)", "fn_sam": "S-аденозилметионин (1+)", "fn_sah": "S-аденозилгомоцистеин", "fn_met": "L-метионин", "fn_ace": "ацетат (1−)", "fn_vor": "вориностат", "fn_dmakg": "диметил-α-кетоглутарат", "fn_nam": "никотинамид", "fn_mc5": "5-метилцитозин", "fn_hmc5": "5-гидроксиметилцитозин", "fn_ivo": "ивосидениб", "fn_aclys": "Nε-ацетил-L-лизин", "fn_me3lys": "Nε-триметил-L-лизин (1+)", "s3_drugs_btn": "Препараты", "unit_uM": "мкМ", "unit_day": "сут.", "s3_nucleus": "Ядро", "s3_src_ac": "глюкоза → цитрат → ACLY", "s3_g_ac": "ацетил-CoA : CoA", "s3_src_me": "метионин → SAM (MAT2A)", "s3_g_me": "SAM : SAH", "s3_src_kg": "глутамин → α-КГ (вопрос 2)", "s3_g_kg": "Активность KDM4: α-КГ и ингибиторы", "s3_comp_t": "Конкурентные ингибиторы:", "s3_suc": "сукцинат", "s3_fum": "фумарат", "s3_fm_pair": "α-КГ → R-2-HG (IDH1 R132H)", "s3_fm_akg": "α-кетоглутарат", "s3_fm_hg": "R-2-гидроксиглутарат", "s3_nucl": "нуклеосома", "s3_tail": "хвост H3", "s3_kmt": "KMT2", "s3_hat": "HAT", "s3_suv": "SUV39H1/2", "s3_kdm5": "KDM5", "s3_hdac": "HDAC", "s3_kdm4": "KDM4", "s3_write": "вносят метку", "s3_erase": "снимают метку", "s3_phd": "PHD (EGLN)", "s3_phd_v": "активность ×{x}", "s3_phd_low": "HIF-α стабилизирован", "s3_glc": "Глюкоза в среде", "s3_met": "Метионин в среде", "s3_nad": "NAD⁺ в ядре (от эталона)", "s3_g_drugs": "Вмешательства", "s3_acly": "Нокдаун ACLY", "s3_acetate": "Ацетат 1 мМ", "s3_vor": "Вориностат (HDAC)", "s3_glsi": "Ингибитор GLS", "s3_dm": "Диметил-α-КГ", "s3_geno": "Клетки", "s3_gt_ref": "эталон", "s3_gt_idh": "IDH1 R132H", "s3_gt_sdh": "потеря SDH", "s3_gt_fh": "потеря FH", "s3_ivo": "Ингибитор мутантной IDH1 с начала опыта (сутки 0)", "s3_ivo_s": "ингибитор IDH1", "s3_day": "Время от начала опыта", "s3_day_n": "сутки {d}", "s3_myst_btn": "Загадка: три линии", "s3_line": "линия {n}", "s3_r_r": "ацетил-CoA : CoA", "s3_r_ac9": "H3K9ac", "s3_r_m": "SAM : SAH", "s3_r_k4": "H3K4me3", "s3_r_k9": "H3K9me3", "s3_r_hmc": "5hmC в ДНК", "s3_r_phd": "Активность PHD", "s3_r_kdm4": "Активность KDM4", "s3_r_akg": "α-КГ", "s3_r_suc": "Сукцинат", "s3_r_fum": "Фумарат", "s3_r_hg": "R-2-HG", "s3_r_sam": "SAM", "s3_r_sah": "SAH", "s3_hg_v": "{x} % исходного содержания", "s3_hg_hi": "высокий", "s3_hg_no": "нет", "s3_met_t": "Содержание метаболитов относительно эталона (масс-спектрометрия)", "s3_met_hint": "Для α-КГ, сукцината и фумарата шкала логарифмическая (×0,1 — ×100); черта обозначает эталон. R-2-HG показан в процентах от содержания в клетках IDH1 R132H без ингибитора. Учебная модель.", "s3b_ref": "Черта на полосе обозначает эталон: глюкоза 10 мМ, метионин 100 мкМ (×1,00); полная длина полосы соответствует ×2. Для меток показана доля модифицированных сайтов относительно эталона. Учебная модель, относительные величины; показано установившееся состояние.", "s3a_ref": "Черта обозначает эталон (×1,00), полная длина полосы соответствует ×2. Для меток гистонов и 5hmC показана доля модифицированных сайтов относительно эталона, для ферментов — активность относительно эталона при тех же условиях. Учебная модель, относительные величины; показано установившееся состояние (кроме кривой времени).", "b3_t": "Блот гистонов (ядерный экстракт)", "b3_k9ac": "H3K9ac", "b3_k4": "H3K4me3", "b3_k9me3": "H3K9me3", "b3_h3": "H3 общий", "b3_hmc": "5hmC (точечный блот)", "b3_ref": "эталон", "b3_now": "сейчас", "b3_hint": "Блот отражает популяцию молекул H3 в ядерном экстракте. Ацетилирование и триметилирование одного остатка K9 несовместимы, поэтому H3K9ac и H3K9me3 в популяции относятся к разным молекулам H3. Модификации разных остатков могут сочетаться на одной молекуле. Общий H3 — контроль одинакового количества гистонов в дорожках. Интенсивность полосы пропорциональна доле модифицированных сайтов до ×2 эталона; выше шкала обрезана.", "s3_time_t": "Условная учебная динамика относительно эталона: ингибитор мутантной IDH1 добавлен в начале опыта (сутки 0)", "s3_time_leg": "Красная кривая — R-2-HG; синяя — H3K9me3; зелёная — 5hmC; жёлтая — H3K9ac; фиолетовый пунктир — условный избыток метилирования ДНК (1 — исходный избыток, 0 — его отсутствие). В чашке без ингибитора все величины остаются на уровне суток 0. Кривые рассчитаны моделью, а не измерены. Их разный временной ход качественно согласуется с опытами с ингибитором мутантной IDH2 R140Q в клетках TF-1 (Kernytsky 2015). Постоянные времени, скорость снижения R-2-HG и остаточное плато 0,25 заданы условно. В работе Turcan 2018 после прекращения экспрессии IDH1 R132H изменённое метилирование сохранялось у части локусов; этот результат не определяет амплитуду плато данной кривой.", "s3_myst_t": "Три линии клеток (генотип скрыт): блот", "s3_myst_hint": "У всех трёх линий H3K9me3 выше эталона, а 5hmC — ниже. Какое измерение отличит линию с потерей SDH? Нажмите кнопку ещё раз, чтобы показать метаболиты.", "s3_myst_hint2": "Линии различаются по метаболитам: X — фумарат ×40 (потеря FH); Y — сукцинат ×29, фумарат ниже эталона (потеря SDH); Z — R-2-HG (IDH1 R132H). Третье нажатие закрывает загадку.", "s3_c_ref": "Эталонные условия: глюкоза 10 мМ, метионин 100 мкМ, глутамин 2 мМ. Доли модифицированных сайтов на хвосте гистона H3 и в ДНК зависят от скоростей внесения и удаления соответствующих меток. Эти реакции катализируют ферменты, большинство которых использует метаболит как субстрат или косубстрат.", "s3_m_multi": "Заданы: {list}.", "s3_dn_glcL": "концентрация глюкозы ниже эталонной", "s3_m_glcL": "Концентрация глюкозы в среде снижена, поэтому ACLY образует из цитрата меньше ацетил-CoA.", "s3_dn_glcH": "концентрация глюкозы выше эталонной", "s3_m_glcH": "Концентрация глюкозы в среде выше эталонной; поступление ацетил-CoA возрастает, однако этот рост ограничен насыщением.", "s3_dn_metL": "концентрация метионина ниже эталонной", "s3_m_metL": "Концентрация метионина в среде снижена, поэтому MAT2A синтезирует меньше SAM.", "s3_dn_metH": "концентрация метионина выше эталонной", "s3_m_metH": "Концентрация метионина в среде выше эталонной; синтез SAM усиливается, однако этот рост ограничен насыщением.", "s3_dn_nadL": "содержание NAD⁺ в ядре снижено", "s3_m_nadL": "Содержание NAD⁺ в ядре ниже эталона, поэтому сиртуины удаляют ацетильные группы медленнее.", "s3_dn_nadH": "содержание NAD⁺ в ядре повышено", "s3_m_nadH": "Содержание NAD⁺ в ядре выше эталона, поэтому сиртуины удаляют ацетильные группы быстрее.", "s3_dn_acly": "нокдаун ACLY", "s3_m_acly": "Нокдаун ACLY (остаточная активность 30 %, условно): из цитрата образуется меньше ацетил-CoA.", "s3_dn_acetate": "ацетат 1 мМ", "s3_m_acetate": "Ацетат 1 мМ: ACSS2 образует ацетил-CoA в обход ACLY.", "s3_dn_vor": "вориностат", "s3_m_vor": "Вориностат ингибирует HDAC классов I и II; сиртуины он не ингибирует.", "s3_dn_glsi": "ингибитор GLS", "s3_m_glsi": "Ингибитор GLS: из глутамина образуется меньше глутамата и α-КГ (как на вкладке 2).", "s3_dn_dm": "диметил-α-КГ", "s3_m_dm": "Диметил-α-КГ проникает в клетку и гидролизуется до α-КГ; в модели содержание α-КГ в 3 раза выше, чем без добавки.", "s3_dn_glnL": "концентрация глутамина снижена", "s3_m_glnL": "Концентрация глутамина в среде снижена, поэтому содержание α-КГ уменьшается.", "s3_dn_glnH": "концентрация глутамина повышена", "s3_m_glnH": "Концентрация глутамина в среде повышена, поэтому содержание α-КГ увеличивается.", "s3_dn_idh": "IDH1 R132H", "s3_m_idh": "IDH1 R132H восстанавливает α-КГ до R-2-HG, используя NADPH; R-2-HG слабо конкурирует с α-КГ. Содержание ацетил-CoA в модели ниже эталонного (×0,55; механизм не установлен, Furth 2025).", "s3_dn_sdh": "потеря SDH", "s3_m_sdh": "Потеря SDH: сукцинат накапливается (в модели ×29, как на вкладке 2) и конкурирует с α-КГ.", "s3_dn_fh": "потеря FH", "s3_m_fh": "Потеря FH: накапливается фумарат (в модели ×40) и конкурирует с α-КГ.", "s3_dn_ivo": "ингибитор мутантной IDH1", "s3_m_ivo": "Ингибитор мутантной IDH1.", "s3_f_ac_dn": "Отношение ацетил-CoA : CoA снизилось до ×{r}; HAT ацетилируют гистоны медленнее, и уровень H3K9ac составляет ×{ac}.", "s3_f_ac_up": "Отношение ацетил-CoA : CoA выросло до ×{r}; HAT ацетилируют гистоны быстрее, и уровень H3K9ac составляет ×{ac}.", "s3_f_ac_vor": "Отношение ацетил-CoA : CoA равно ×{r}, но ацетильные группы удаляются медленнее, и уровень H3K9ac составляет ×{ac}.", "s3_f_ac_hdac": "Отношение ацетил-CoA : CoA не изменилось, но изменилась скорость удаления ацетильных групп; уровень H3K9ac составляет ×{ac}.", "s3_f_me": "Отношение SAM : SAH составляет ×{m}, уровень H3K4me3 — ×{k4}: эта метка зависит от SAM сильнее других.", "s3_f_me_a": "Отношение SAM : SAH составляет ×{m}; уровень H3K4me3 — ×{k4}, H3K9me3 — ×{k9}.", "s3_f_kg_dn": "Активность KDM4 и TET уменьшается при снижении содержания α-КГ или повышении содержания конкурентных ингибиторов этих ферментов. Уровень H3K9me3 составляет ×{k9}, 5hmC — ×{h}.", "s3_f_kg_up": "Активность KDM4 и TET увеличивается при повышении содержания α-КГ или снижении содержания конкурентных ингибиторов этих ферментов. Уровень H3K9me3 составляет ×{k9}, 5hmC — ×{h}.", "s3_f_phd": "Активность PHD составляет ×{x}; HIF-α гидроксилируется медленнее и поэтому стабилизируется.", "s3_f_none": "Метки почти не изменились: отклонение от эталона меньше 5 %.", "s3_c_time": "Условная учебная динамика после подавления IDH1 R132H, сутки {d}. R-2-HG — {hg} % исходного содержания. H3K9me3 — ×{k9}, 5hmC — ×{h}, H3K9ac — ×{ac}; избыток метилирования ДНК — {D} % исходного. В этой модели метки гистонов приближаются к эталону быстрее, чем метилирование ДНК.", "s3_c_myst": "Три линии с похожими изменениями меток: H3K9me3 выше, 5hmC ниже. Генотип скрыт.", "s3_c_myst2": "Линии различаются по метаболитам: X — потеря FH (фумарат), Y — потеря SDH (сукцинат), Z — IDH1 R132H (R-2-HG). По блоту меток различить их нельзя.", "s3_z_ref": "Уровень меток хроматина зависит от доступности ацетил-CoA, SAM и α-КГ. Изменение метки само по себе не означает изменения экспрессии генов.", "s3_z_ac": "В культуре ацетилирование гистонов изменяется вслед за поступлением ацетил-CoA и отношением ацетил-CoA : CoA; CoA образуется в реакции и ингибирует HAT (Lee 2014; Wellen 2009).", "s3_z_me": "SAM — донор метильной группы, SAH — продукт и ингибитор многих метилтрансфераз. При недостатке метионина H3K4me3 снижается сильнее других меток и восстанавливается после возвращения метионина (Mentch 2015).", "s3_z_kg": "KDM4, KDM5, KDM6, TET и PHD используют α-КГ, O₂ и Fe²⁺; сукцинат, фумарат и 2-HG конкурируют с α-КГ. Поэтому деметилирование зависит от содержания α-КГ и конкурентных ингибиторов (Xiao 2012; Pan 2016).", "s3_z_mix": "Воздействие затрагивает сразу несколько ветвей. В модели ацетильная, метильная и α-КГ-зависимая ветви независимы, и каждая метка зависит от своего метаболита.", "s3_z_vor": "Уровень метки определяется балансом скоростей её внесения и удаления: ингибитор HDAC повышает ацетилирование, не изменяя поступления ацетил-CoA (Wellen 2009, трихостатин A). Ингибиторы HDAC влияют и на ацетилирование негистоновых белков.", "s3_z_idh": "Мутантная IDH1 образует R-2-HG. В клетках и опухолях с этой мутацией метилирование гистонов и ДНК повышено, а уровень 5hmC снижен (Lu 2012; Turcan 2012). R-2-HG — слабый ингибитор (Ki в миллимолярном диапазоне); подавляет ли он PHD, остаётся спорным (Koivunen 2012; Xu 2011).", "s3_z_sdh": "При потере SDH накапливается сукцинат, который ингибирует KDM, TET и PHD. В клетках с нокдауном субъединиц SDH уровень H3K9me3 был выше примерно в 1,7–1,9 раза (Hoekstra 2015), а 5hmC — ниже (Xiao 2012); HIF-α стабилизируется (Selak 2005).", "s3_z_fh": "При потере FH накапливается фумарат, который ингибирует KDM, TET и PHD (Xiao 2012; Laukka 2016). В клетках с потерей Fh1 фумарат подавлял TET-зависимое деметилирование регуляторной области miR-200 (Sciacovelli 2016).", "s3_z_ivo": "Показана условная учебная динамика после подавления мутантной IDH; результат зависит от вмешательства и клеточной системы. При ингибировании IDH2 R140Q в клетках TF-1 гиперметилирование гистонов исчезало за дни, а гиперметилирование ДНК — постепенно, за недели (Kernytsky 2015). В клетках глиомы с эндогенной мутацией IDH1 ингибитор снижал H3K9me3, но заметно не менял метилирование ДНК (Rohle 2013). В работе Turcan 2018 прекращали индуцированную экспрессию IDH1 R132H; через 40 пассажей изменённое метилирование сохранялось примерно у 25 % дифференциально метилированных локусов. Это доля локусов, а не доля общего избытка метилирования ДНК.", "s3_z_myst": "Одинаковые изменения меток могут иметь разные причины. В этой задаче блот показывает сходные изменения, а измерение метаболитов позволяет различить три заданные линии.", "s3_z_myst2": "Среди трёх заданных линий накопление сукцината указывает на потерю SDH, фумарата — на потерю FH, R-2-HG — на мутантную IDH (Dang 2009; Xiao 2012; Cardaci 2015). По стабилизации HIF-α и ответу на диметил-α-КГ эти линии не различить.", "s3b_take": "Ферменты хроматина используют метаболиты клетки: HAT — ацетил-CoA, метилтрансферазы — SAM. Поэтому в культуре ацетилирование H3K9 зависит от концентрации глюкозы в среде, а H3K4me3 — от концентрации метионина в среде. Изменение метки само по себе не означает изменения экспрессии генов.", "s3a_take": "Уровень каждой метки определяется балансом скоростей её внесения и удаления. Деметилирование зависит от отношения α-КГ к сукцинату, фумарату и 2-HG, поэтому потеря SDH или FH и мутантная IDH1 сходно изменяют метки; различить эти состояния можно по метаболитам. В условной динамике этой модели после подавления мутантной IDH метки гистонов приближаются к эталону быстрее, чем исчезает избыток метилирования ДНК. В эксперименте скорость и полнота возврата зависят от клеточной системы и вмешательства.", "p3b_1_q": "Концентрацию глюкозы в культуральной среде эталонных клеток на сутки снижают с 10 до 1 мМ. Как изменится ацетилирование H3K9?", "p3b_1_o1": "Снизится вместе с отношением ацетил-CoA : CoA", "p3b_1_o2": "Не изменится: ацетил-CoA восполняется из глутамина", "p3b_1_o3": "Повысится, как при голодании у мышей", "p3b_1_e": "При 1 мМ глюкозы ACLY образует из цитрата меньше ацетил-CoA: отношение ацетил-CoA : CoA снижается до ×0,35, а H3K9ac — до ×0,49. В культуре клеток LN229 при 1 мМ глюкозы содержание ацетил-CoA и ацетилирование гистонов были ниже, чем при 10 мМ (Lee 2014).", "p3b_1_w2": "В опытах Lee 2014 глутамин не поддерживал ацетилирование гистонов при низкой концентрации глюкозы в среде; в модели вклад глутамина в образование ядерного ацетил-CoA не учитывается.", "p3b_1_w3": "Повышение H3K27ac при голодании описано у мышей (Chen 2026), то есть в целом организме, для другой метки и в других условиях. В культуре клеток при снижении концентрации глюкозы в среде ацетилирование гистонов снижается (Lee 2014).", "p3b_2_q": "Концентрацию метионина в среде эталонных клеток снижают со 100 до 5 мкМ. Как изменятся отношение SAM : SAH и доля триметилированных сайтов H3K4 (H3K4me3)?", "p3b_2_o1": "SAM : SAH не изменится: SAM пополняется", "p3b_2_o2": "Снизятся и SAM : SAH, и H3K4me3", "p3b_2_o3": "SAM : SAH снизится, H3K4me3 не изменится", "p3b_2_e": "MAT2A синтезирует SAM из метионина. При 5 мкМ метионина отношение SAM : SAH снижается до ×0,54, H3K4me3 — до ×0,45, а H3K9ac не изменяется. В опытах Mentch 2015 содержание SAM снижалось при концентрации метионина ниже 25 мкМ, а H3K4me3 — при 10–25 мкМ.", "p3b_2_w1": "SAM синтезируется из метионина, поэтому при дефиците метионина синтез SAM замедляется. В опытах Mentch 2015 содержание SAM и отношение SAM : SAH снижались при концентрации метионина ниже 25 мкМ.", "p3b_2_w3": "Km метилтрансфераз по SAM ниже его внутриклеточной концентрации, но при лишении метионина уровень H3K4me3 всё же снижается (Mentch 2015). Следовательно, чувствительность этой метки нельзя объяснить только значением Km.", "p3b_3_q": "Клетки в течение суток культивировали в среде с 5 мкМ метионина, затем концентрацию метионина вернули к 100 мкМ. Как изменится доля триметилированных сайтов H3K4 (H3K4me3) в новом установившемся состоянии?", "p3b_3_o1": "Останется низкой: метилирование гистонов необратимо", "p3b_3_o2": "Продолжит снижаться: накопился SAH", "p3b_3_o3": "Вернётся к эталону вместе с SAM : SAH", "p3b_3_e": "Отношение SAM : SAH возвращается с ×0,54 до ×1,00, а H3K4me3 — с ×0,45 до ×1,00. Метка обратима: её удаляют деметилазы KDM5. В опытах Mentch 2015 уровень H3K4me3 восстанавливался за сутки после возвращения метионина. Время восстановления модель не рассчитывает.", "p3b_3_w1": "Метилирование гистонов обратимо: H3K4me3 снимают деметилазы KDM5. После возвращения метионина метка восстанавливалась (Mentch 2015).", "p3b_3_w2": "SAH образуется при переносе метильной группы, но при достаточном содержании метионина не накапливается сильнее, чем SAM, поэтому отношение SAM : SAH возвращается к эталону.", "p3a_1_q": "В клетках с нокдауном ACLY уровень H3K9ac составляет ×0,53. В среду добавляют 1 мМ ацетата. Как изменится H3K9ac по сравнению с нокдауном без ацетата?", "p3a_1_o1": "Повысится: ACSS2 образует ацетил-CoA из ацетата", "p3a_1_o2": "Не изменится: ацетил-CoA образуется только из цитрата", "p3a_1_o3": "Снизится: ацетат конкурирует с цитратом за ACLY", "p3a_1_e": "ACSS2 образует ацетил-CoA из ацетата в обход ACLY: отношение ацетил-CoA : CoA повышается с ×0,38 до ×1,01, а H3K9ac — с ×0,53 до ×1,01. В клетках с нокаутом Acly 1 мМ ацетата заметно повышал ацетилирование гистонов (Zhao 2016). Концентрация 1 мМ выше обычной концентрации ацетата в культуральной среде; физиологичность такой концентрации обсуждается.", "p3a_1_w2": "Ацетил-CoA образуется не только из цитрата: ACSS2 синтезирует его из ацетата. При нокдауне ACLY этот путь становится главным источником ацетил-CoA.", "p3a_1_w3": "ACLY расщепляет цитрат, а ацетат служит субстратом другого фермента — ACSS2. Поэтому ацетат не конкурирует с цитратом за ACLY.", "p3a_2_q": "В среду для клеток с нокдауном ACLY добавляют вориностат — ингибитор HDAC. Как изменятся уровень H3K9ac и отношение ацетил-CoA : CoA?", "p3a_2_o1": "Повысятся и H3K9ac, и ацетил-CoA : CoA", "p3a_2_o2": "H3K9ac повысится, ацетил-CoA : CoA не изменится", "p3a_2_o3": "Оба показателя не изменятся: ацетил-CoA недостаточно", "p3a_2_e": "Уровень метки определяется балансом скоростей её внесения и удаления. Вориностат замедляет удаление ацетильных групп: H3K9ac повышается с ×0,53 до ×1,13, а отношение ацетил-CoA : CoA остаётся равным ×0,38. В опытах Wellen 2009 ингибитор HDAC трихостатин A компенсировал снижение ацетилирования гистонов при нокдауне ACLY. Ингибиторы HDAC влияют и на ацетилирование негистоновых белков.", "p3a_2_w1": "Вориностат ингибирует деацетилазы и не участвует в образовании ацетил-CoA, поэтому отношение ацетил-CoA : CoA не меняется.", "p3a_2_w3": "При нокдауне ACLY ацетил-CoA образуется медленнее, но не исчезает: его синтез продолжается при участии ACLY с остаточной активностью, ACSS2 и ферментов других путей. Если метка удаляется медленнее, её уровень повышается.", "p3a_3_q": "Концентрацию метионина в среде эталонных клеток снижают до 5 мкМ. Уровень какой метки снизится сильнее: H3K4me3 или H3K9me3?", "p3a_3_o1": "H3K9me3", "p3a_3_o2": "Одинаково: донор метильной группы один", "p3a_3_o3": "H3K4me3", "p3a_3_e": "Уровень H3K4me3 снижается до ×0,45, а H3K9me3 — до ×0,70. В клетках HCT116 при 3 мкМ метионина H3K4me3 снижалась сильнее других меток (Mentch 2015). В мышиных ЭСК при лишении треонина изменялась только H3K4me3 (Shyh-Chang 2013): это другая клеточная система, однако и в ней наиболее чувствительна метка H3K4me3.", "p3a_3_w1": "В опытах Mentch 2015 H3K9me3 при лишении метионина снижалась слабее, чем H3K4me3; в модели уровень H3K9me3 составляет ×0,70, а H3K4me3 — ×0,45.", "p3a_3_w2": "Донор метильных групп один, но разные метилтрансферазы и метки по-разному чувствительны к отношению SAM : SAH. При одном и том же снижении SAM уровень H3K4me3 снижается сильнее (Mentch 2015).", "p3a_4_q": "В присутствии ингибитора GLS содержание α-КГ составляет ×0,35, а H3K9me3 — ×1,21. Добавляют диметил-α-КГ. Как изменится уровень H3K9me3?", "p3a_4_o1": "Повысится: α-КГ — субстрат метилирования", "p3a_4_o2": "Снизится примерно до эталона", "p3a_4_o3": "Не изменится: метку вносит SUV39H1/2", "p3a_4_e": "α-КГ служит косубстратом деметилазы KDM4, а не метилтрансферазы (донор метильной группы — SAM). Диметил-α-КГ повышает содержание α-КГ, активность KDM4 возрастает, и H3K9me3 снижается с ×1,21 до ×0,97. При дефиците глутамина и снижении его метаболизма метилирование H3K9, H3K27 и H3K36 повышалось, а диметил-α-КГ предотвращал это повышение (Pan 2016). Использование эфиров α-КГ сопровождается образованием побочных метаболитов (Parker 2021).", "p3a_4_w1": "Метилтрансферазы переносят на лизин метильную группу с SAM, а α-КГ необходим деметилазам KDM4, которые удаляют метку. Чем больше α-КГ, тем быстрее удаляется метка.", "p3a_4_w3": "Уровень метки определяется балансом её внесения и удаления. SUV39H1/2 действительно не используют α-КГ, но KDM4 его использует, поэтому удаление метки ускоряется.", "p3a_5_q": "В клетках с потерей SDH содержание сукцината составляет ×29, H3K9me3 — ×1,68, 5hmC — ×0,11. Добавляют диметил-α-КГ. Как изменятся содержание сукцината и уровень H3K9me3?", "p3a_5_o1": "Содержание сукцината не изменится, H3K9me3 снизится", "p3a_5_o2": "Снизятся и содержание сукцината, и H3K9me3", "p3a_5_o3": "Не изменятся: сукцинат блокирует KDM4 необратимо", "p3a_5_e": "Диметил-α-КГ не устраняет причину накопления сукцината — потерю SDH, но повышает содержание α-КГ, который конкурирует с сукцинатом за активный центр KDM4. Поэтому H3K9me3 снижается с ×1,68 до ×1,37, а содержание сукцината остаётся равным ×29. Октил-α-КГ (5 мМ) обращал гиперметилирование в клетках с нокдауном SDH (Xiao 2012). Этот результат согласуется с конкуренцией, однако при использовании эфиров α-КГ образуются и побочные метаболиты (Parker 2021).", "p3a_5_w2": "Сукцинат накапливается из-за отсутствия SDH. Диметил-α-КГ не восполняет функцию этого фермента, поэтому содержание сукцината не снижается.", "p3a_5_w3": "Сукцинат конкурирует с α-КГ обратимо, поэтому при повышении содержания α-КГ активность KDM4 частично восстанавливается.", "p3a_6_q": "Загадка: у трёх линий клеток сходный блот — H3K9me3 выше эталона, а 5hmC ниже. Какое измерение отличит линию с потерей SDH от остальных?", "p3a_6_o1": "Стабилизация HIF-α при 21 % O₂", "p3a_6_o2": "Ответ H3K9me3 на диметил-α-КГ", "p3a_6_o3": "Содержание сукцината, фумарата и R-2-HG", "p3a_6_e": "Три разные причины вызывают сходные изменения меток. Различить их можно по метаболитам: при потере SDH содержание сукцината повышено до ×29, а содержание фумарата ниже эталонного; при потере FH содержание фумарата повышено до ×40; при IDH1 R132H накапливается R-2-HG (Cardaci 2015; Xiao 2012; Dang 2009).", "p3a_6_w1": "PHD ингибируются и при потере SDH, и при потере FH (в модели активность ×0,27 и ×0,12), поэтому по стабилизации HIF-α эти линии не различить.", "p3a_6_w2": "Диметил-α-КГ снижает H3K9me3 и при потере SDH, и при потере FH (×1,68 → ×1,37 и ×1,37 → ×1,07), поэтому ответ на него не указывает именно на потерю SDH.", "p3a_7_q": "В учебном опыте клетки несут мутацию IDH1 R132H. В начале опыта (сутки 0) добавляют ингибитор мутантной IDH1; к 14-м суткам содержание R-2-HG составляет 5 % исходного. Как изменятся метки по сравнению с их исходным отклонением от эталона?", "p3a_7_o1": "Все метки, включая метилирование ДНК, вернутся к эталону", "p3a_7_o2": "Метки гистонов почти вернутся к эталону, метилирование ДНК — нет", "p3a_7_o3": "Метилирование ДНК вернётся к эталону раньше меток гистонов", "p3a_7_e": "Ингибирование мутантной IDH снижает содержание R-2-HG и ослабляет подавление KDM4 и TET, поэтому H3K9me3 снижается, а 5hmC повышается. В этой учебной модели эти показатели приближаются к эталону быстрее, чем исчезает условный избыток метилирования ДНК. К 14-м суткам H3K9me3 составляет ×1,03 (исходно ×1,39), 5hmC — ×0,92 (исходно ×0,29), H3K9ac — ×1,00; избыток метилирования ДНК — 54 % исходного. Эти числа рассчитаны моделью, постоянные времени условные. Похожий порядок наблюдали при ингибировании мутантной IDH2 R140Q в клетках TF-1: гиперметилирование гистонов исчезало за дни, а гиперметилирование ДНК — постепенно, за недели (Kernytsky 2015). В работе Turcan 2018 прекращали индуцированную экспрессию IDH1 R132H в астроцитах человека и прослеживали изменения по пассажам — это другой опыт.", "p3a_7_w1": "При ингибировании мутантной IDH2 в клетках TF-1 гиперметилирование ДНК исчезало медленнее, чем гиперметилирование гистонов (Kernytsky 2015). В работе Turcan 2018 после прекращения экспрессии IDH1 R132H примерно у четверти локусов с изменённым метилированием ДНК оно сохранялось и через 40 пассажей.", "p3a_7_w3": "Порядок обратный: при ингибировании мутантной IDH2 в клетках TF-1 гиперметилирование гистонов исчезало за дни, а гиперметилирование ДНК — за недели (Kernytsky 2015).", "gn_ch_ac": "Ацетил-CoA ядра и цитоплазмы", "g_ch_ac": "Ацетил-CoA — субстрат гистонацетилтрансфераз (HAT). В ядре и цитоплазме его образуют ACLY из цитрата, вышедшего из митохондрий, и ACSS2 из ацетата (Wellen 2009; Zhao 2016). В обычных условиях вклад экзогенного ацетата в ацетилирование гистонов невелик — менее 10 % (Bulusu 2017); источником ацетильных групп служат и жирные кислоты (McDonnell 2016). Роль ядерного комплекса PDH как источника ацетил-CoA обсуждается (Sutendra 2014). CoA образуется в реакции HAT и ингибирует её, поэтому показателем служит отношение ацетил-CoA : CoA (Lee 2014). Упрощение модели: ядро и цитоплазма составляют один пул; содержание CoA постоянно; связь с цитратом из вопроса 2 не учтена, поскольку прямых данных о влиянии потери SDH или глутамина на ацетилирование гистонов нет. В модели ацетат в концентрации 1 мМ повышает вклад ACSS2 в 10 раз; после нокдауна ACLY сохраняется 30 % её активности (условно). На рисунках — фрагмент ацетил-CoA, несущий ацетильную группу, ацетат и Nε-ацетиллизин.", "gn_ch_hat": "HAT — гистонацетилтрансферазы", "g_ch_hat": "HAT переносят ацетильную группу с ацетил-CoA на ε-аминогруппу остатков лизина в гистонах. Модификацию H3K9ac вводят GCN5 и PCAF, H3K18ac и H3K27ac — CBP/p300, H4K16ac — MOF в составе комплекса MSL. С ацетиллизином связываются бромодомены белков (Dhalluin 1999). H4K16ac препятствует компактизации нуклеосомных цепей in vitro (Shogren-Knaak 2006); для H3K9ac подобных прямых опытов нет. В эталонном состоянии модели ацетилировано около 5 % всех сайтов H3K9 (условная величина; на участках активного хроматина ацетилирована примерно четверть сайтов K9).", "gn_ch_hdac": "HDAC и сиртуины", "g_ch_hdac": "Ацетильные группы гистонов удаляют Zn²⁺-зависимые HDAC (классы I, II, IV) и NAD⁺-зависимые сиртуины (класс III). Сиртуины расщепляют NAD⁺ с образованием никотинамида и 2′-O-ацетил-ADP-рибозы; никотинамид ингибирует эту реакцию (Tanner 2000). Концентрация свободного NAD⁺ в ядре составляет около 100 мкМ, что близко к Km многих ферментов, потребляющих NAD⁺ (Cambronne 2016). Поэтому изменения содержания NAD⁺ могут влиять на скорость деацетилирования. Вориностат (гидроксамат) хелатирует Zn²⁺ в активном центре HDAC классов I и II (Bradner 2010); его действие распространяется и на деацетилирование негистоновых белков. Упрощение модели: на сиртуины приходится 35 % деацетилирования, остальное — на HDAC; при действии вориностата сохраняется 5 % активности HDAC, сиртуины он не ингибирует.", "gn_ch_sam": "Метионин, SAM и SAH", "g_ch_sam": "MAT2A синтезирует S-аденозилметионин (SAM) из метионина и ATP. Метилтрансферазы переносят метильную группу с SAM на остатки лизина или цитозина; при этом образуется S-аденозилгомоцистеин (SAH), который ингибирует многие метилтрансферазы (Dai 2020). В клетках HCT116 при концентрации метионина ниже 25 мкМ снижались содержание SAM и отношение SAM : SAH, а уровень H3K4me3 — при 10–25 мкМ; после возвращения метионина метка восстанавливалась в течение суток (Mentch 2015). Упрощение модели: содержание SAH снижается вдвое слабее, чем содержание SAM (условно); фолатный цикл и витамин B₁₂ не учтены. На рисунках — L-метионин, SAM (катион сульфония) и SAH.", "gn_ch_kmt": "Метилтрансферазы гистонов", "g_ch_kmt": "Модификацию H3K4me3 вводят комплексы KMT2 (MLL) и SETD1, H3K9me3 — SUV39H1/2, H3K9me2 — в основном G9a/GLP (Rice 2003; Peters 2003). Донором метильной группы для всех этих ферментов служит SAM. H3K4me3 характерна для промоторов активных генов, H3K9me3 — для гетерохроматина. Изменение уровня метки само по себе не свидетельствует об изменении экспрессии конкретного гена. На рисунке — Nε-триметиллизин.", "gn_ch_k4": "H3K4me3", "g_ch_k4": "Триметилирование лизина 4 гистона H3. Метку вводят KMT2/SETD1, используя SAM, а удаляет KDM5, используя α-КГ. Среди меток гистонов H3K4me3 сильнее всего зависит от метионина и SAM (Mentch 2015; Shyh-Chang 2013). Упрощение модели: KDM5 не включён в расчёт конкуренции α-КГ с сукцинатом и фумаратом, поэтому при потере SDH или FH уровень H3K4me3 не меняется, как и в опытах Hoekstra 2015.", "gn_ch_k9": "Лизин 9 гистона H3: ацетилирование или метилирование", "g_ch_k9": "Остаток K9 гистона H3 несёт не больше одной модификации: ацетильную группу (H3K9ac; вводят GCN5/PCAF, удаляют HDAC и сиртуины) или от одной до трёх метильных групп (H3K9me3 вводят SUV39H1/2, удаляет KDM4). Ацетилирование и триметилирование одного остатка несовместимы, поэтому в популяции нуклеосом H3K9ac и H3K9me3 находятся на разных молекулах H3; масс-спектрометрия различает такие пептиды (Zhang 2004). Сорок ячеек панели «K9 в популяции» показывают условные доли сайтов (одна ячейка — 2,5 %): Ac — на участках активного хроматина, me3 — в гетерохроматине, «прочие» — K9 без этих двух меток (немодифицированный, me1 или me2). Доли Ac и me3 рассчитаны для разных участков, поэтому их сумма не превышает 1; конкуренция двух модификаций за один и тот же участок в модели не учтена.", "gn_ch_kdm": "JmjC-деметилазы (KDM4, KDM5, KDM6)", "g_ch_kdm": "JmjC-деметилазы относятся к диоксигеназам: они используют α-КГ, O₂ и Fe²⁺ и образуют сукцинат и CO₂. KDM4 деметилирует H3K9me3 и H3K36me3, KDM5 — H3K4me3, KDM6 — H3K27me3 (Whetstine 2006; Klose 2006; Christensen 2007). LSD1 (KDM1A) — FAD-зависимая аминоксидаза; она деметилирует H3K4me1/2. Km KDM4A для α-КГ составляет около 25 мкМ (Hancock 2017). Сукцинат и фумарат ингибируют KDM в концентрациях порядка сотен микромолей на литр (Xiao 2012), R-2-HG — в миллимолярных концентрациях (Xu 2011). Упрощение модели: показатель «Активность KDM4: α-КГ и ингибиторы» на схеме отражает активность KDM4 относительно эталона. Эталонные концентрации в ядре (α-КГ 60 мкМ, сукцинат 50 мкМ, фумарат 30 мкМ) приняты как допущения: в клетках их прямо не измеряли.", "gn_ch_akg": "α-КГ и его конкуренты: сукцинат, фумарат, 2-HG", "g_ch_akg": "α-КГ образуется из глутамата (глутамин → GLS → глутамат → α-КГ; вопрос 2). Сукцинат и фумарат структурно сходны с α-КГ и конкурируют с ним за активный центр диоксигеназ (Xiao 2012; Laukka 2016). При потере SDH накапливается сукцинат, при потере FH — фумарат. Мутантная IDH1 R132H восстанавливает α-КГ до R-2-HG с затратой NADPH (Dang 2009). R-2-HG — слабый ингибитор KDM и TET: его Ki лежит в миллимолярном диапазоне (Xu 2011), но в опухолях концентрация R-2-HG достигает миллимолярных значений. L-2-HG образуется при гипоксии и кислом pH (Intlekofer 2015). Накопление R-2-HG связывают с глиомами и острым миелоидным лейкозом, сукцината — с SDH-дефицитными параганглиомами и феохромоцитомами, фумарата — с FH-дефицитными опухолями. На рисунках — α-КГ, R- и S-2-HG, сукцинат, фумарат (формы при pH 7).", "gn_ch_tet": "TET и 5-гидроксиметилцитозин", "g_ch_tet": "TET окисляют 5-метилцитозин (5mC) до 5-гидроксиметилцитозина (5hmC), а затем до 5-формил- и 5-карбоксилцитозина. Два последних основания удаляет гликозилаза TDG, после чего участок ДНК восстанавливается путём эксцизионной репарации (Tahiliani 2009; Ito 2011; He 2011; Maiti 2011). 5hmC гликозилаза TDG не удаляет; кроме того, в делящихся клетках 5hmC разбавляется при репликации. TET используют α-КГ, O₂ и Fe²⁺; Km TET для α-КГ составляет около 55–60 мкМ (Laukka 2016). Упрощение модели: содержание 5hmC пропорционально активности TET; метилирование ДНК описано одной относительной величиной. На рисунках — 5-метилцитозин и 5-гидроксиметилцитозин.", "gn_ch_phd": "PHD (EGLN) и HIF-α", "g_ch_phd": "Пролилгидроксилазы PHD (EGLN1–3) гидроксилируют HIF-α в присутствии O₂ и α-КГ; гидроксилированный HIF-α связывается с VHL и разрушается в протеасоме. Сукцинат и фумарат ингибируют PHD, поэтому HIF-α стабилизируется и без гипоксии (Selak 2005; Koivunen 2007). R-2-HG практически не ингибирует PHD; данные о его действии на HIF противоречивы (Koivunen 2012; Losman 2013; Xu 2011). Упрощение модели: показана активность PHD относительно эталона, а не содержание HIF-α; порог «HIF-α стабилизирован» (ниже ×0,35) условен; концентрация O₂ не меняется.", "gn_ch_drugs": "Диметил-α-КГ и ингибиторы мутантной IDH", "g_ch_drugs": "Диметил-α-КГ — эфир, проникающий в клетку; в клетке он гидролизуется до α-КГ. Эфиры α-КГ гидролизуются и спонтанно, образуя побочные метаболиты. Поэтому эффект добавки указывает на участие α-КГ, но не исключает побочных эффектов (Parker 2021). В модели при IDH1 R132H добавка диметил-α-КГ недоступна: мутантный фермент превращает α-КГ в R-2-HG, а данных для такого сочетания нет. Ивосидениб (ингибитор IDH1 R132) и ворасидениб (ингибитор IDH1/2) снижают содержание 2-HG; ивосидениб применяют при остром миелоидном лейкозе с мутацией IDH1 (DiNardo 2018), ворасидениб — при глиомах низкой степени злокачественности с мутацией IDH (Mellinghoff 2023). На рисунках — диметил-α-КГ и ивосидениб.", "gn_ch_measure": "Как это измеряют", "g_ch_measure": "Модификации гистонов определяют блотом с антителами (общий H3 служит контролем количества) и масс-спектрометрией пептидов; распределение метки по генам — методом ChIP-seq. 5mC и 5hmC различают окислительным бисульфитным секвенированием (oxBS-seq) или с помощью антител (точечный блот). Содержание ацетил-CoA, CoA, SAM, SAH, α-КГ, сукцината, фумарата и 2-HG измеряют масс-спектрометрией, обычно во всей клетке, а не в ядре. Изменение метки на блоте отражает сдвиг среднего уровня метки в клетке; для вывода об экспрессии генов нужны другие измерения.", "gn_ch_model": "Что упрощено в модели", "g_ch_model": "Все величины относительные (1,00 — эталон: глюкоза 10 мМ, метионин 100 мкМ, глутамин 2 мМ); динамика во времени рассчитывается только для IDH1 с ингибитором. Вместо десятков модификаций учтены три метки гистонов и одна метка ДНК; уровень метки выражен условной долей сайтов; для K9 доли Ac и me3 рассчитаны для разных участков хроматина и в сумме не превышают 1. К данным подогнаны снижение ацетил-CoA при 1 мМ глюкозы (Lee 2014) и порог метионина (Mentch 2015). Значения Km и Ki ферментов взяты из работ Hancock 2017, Laukka 2016, Xiao 2012, Koivunen 2007. Допущения: эталонные α-КГ (60 мкМ), сукцинат (50 мкМ), фумарат (30 мкМ) в ядре; R-2-HG 10 мМ при IDH1 R132H; α-КГ при IDH1 ×0,75; ацетил-CoA при IDH1 ×0,55 (механизм не установлен, Furth 2025); фумарат при потере FH ×40; доли HDAC и сиртуинов; постоянные времени (2-HG 0,6 сут., H3K9me3 3 сут., H3K9ac и 5hmC 2 сут., ДНК 14 сут.) и плато условного избытка метилирования ДНК 0,25. Эти параметры динамики заданы для учебной модели и не являются оценкой одной экспериментальной кривой; доля сохраняющихся изменённых локусов из работы Turcan 2018 не определяет амплитуду этого плато. Без подгонки к этим данным модель воспроизводит: H3K9me3 при потере SDH ×1,68 (Hoekstra 2015: ×1,7–1,9); 5hmC при потере SDH −89 % (Xiao 2012: −69…−83 %, в модели эффект сильнее). Не учтены: O₂ как косубстрат, L-2-HG, EZH2, SETD2, DOT1L, DNMT, фолат и B₁₂.", "s4_matrix": "Матрикс митохондрии", "s4_ims": "межмембранное пространство", "s4_cyto": "Цитоплазма", "s4_nadh": "Доля NADH в матриксе", "s4_c1": "I", "s4_c3": "III", "s4_c4": "IV", "s4_ret": "обратный перенос", "s4_prx3": "Prx3", "s4_trx": "Trx2, TrxR2", "s4_prx2": "Prx1, Prx2", "s4_dna": "ДНК: 8-oxoG", "s4_lip": "липиды: 4-HNE", "s4_ppp": "ПФП → NADPH", "s4_nox": "NOX", "s4_peg_s": "каталаза", "s4_ama_s": "антимицин A", "s4_nad_v": "NAD⁺ ×{x}", "s4_nadph_v": "NADPH ×{x}", "s4_n": "Доля NADH в матриксе (подача электронов)", "s4_a": "Антиоксидантная ёмкость (NADPH, тиоредоксин, глутатион)", "s4_g_drugs": "Вмешательства и генотипы", "s4_gf": "Сигнал роста (NOX)", "s4_peg": "ПЭГ-каталаза", "s4_oligo": "Олигомицин", "s4_fccp": "FCCP, малая доза", "s4_anti_a": "Антимицин A", "s4_nosrx": "Нет сульфиредоксина", "s4_pkm2cs": "PKM2 C358S", "s4_olap": "Олапариб (PARP)", "s4_dmm": "Диметилмалонат до ишемии", "s4_rep": "Условия", "s4_rep0": "культура", "s4_rep1": "реперфузия после ишемии", "s4_r_n": "Условная доля NADH в матриксе, 0–1", "s4_r_hm": "H₂O₂ в матриксе, модель", "s4_r_hc": "H₂O₂ в цитоплазме, модель", "s4_r_hyp": "Prx3: SO₂H/SO₃H, условный показатель", "s4_r_ptp": "Окисление PTP1B, 0–1", "s4_r_akt": "p-Akt, 0–1", "s4_r_dam": "Текущая окислительная нагрузка, индекс", "s4_r_nad": "NAD⁺ (общий пул), от эталона", "s4_r_nadph": "NADPH, от эталона", "b4_t": "Схематическое распределение форм пероксиредоксинов (расчёт модели)", "b4_hint": "Показаны рассчитанные моделью доли форм; это не изображение геля. В опыте дисульфидную форму выявляют электрофорезом в невосстанавливающих условиях (она движется как димер), а переокисленную — антителом к Prx-SO₂/₃H; результат зависит от подготовки образца и антител (Cox 2009). Формы SO₂H и SO₃H в модели объединены.", "s4b_ref": "Черта — эталон: доля NADH в матриксе 0,32, антиоксидантная ёмкость 0,60. H₂O₂ — относительно эталона, шкала логарифмическая (×0,1 — ×100). Индекс текущей окислительной нагрузки (0–1) — условная величина модели: он зависит от содержания H₂O₂ в данный момент и не показывает, сколько повреждений накопилось раньше. Показано установившееся состояние.", "s4a_ref": "Черта — эталон в тех же условиях (для p-Akt — с сигналом роста или без него). Для H₂O₂ шкала логарифмическая. Индекс текущей окислительной нагрузки и p-Akt — условные величины модели; накопление повреждений и их репарация не рассчитываются. Показано установившееся состояние.", "s4_c_ref": "Эталон: доля NADH в матриксе 0,32. Комплексы I и III переносят часть электронов непосредственно на O₂, и образуется супероксид; SOD2 превращает его в H₂O₂. Пероксиредоксины восстанавливают H₂O₂. При этом остаток цистеина, взаимодействующий с H₂O₂, окисляется до сульфеновой кислоты (SOH), после чего образуется дисульфид. Тиоредоксин восстанавливает этот дисульфид и возвращает пероксиредоксины в восстановленную форму; сам тиоредоксин восстанавливается за счёт NADPH.", "s4_m_multi": "Заданы: {list}.", "s4_dn_nH": "доля NADH в матриксе повышена", "s4_m_nH": "Доля NADH в матриксе повышена, поэтому при прямом переносе электронов комплекс I образует больше супероксида.", "s4_dn_nL": "доля NADH в матриксе снижена", "s4_m_nL": "Доля NADH в матриксе снижена, поэтому супероксида образуется меньше.", "s4_dn_aL": "антиоксидантная ёмкость снижена", "s4_m_aL": "Антиоксидантная ёмкость снижена: тиоредоксин и глутатион восстанавливаются медленнее, и пероксиредоксины дольше остаются окисленными.", "s4_dn_aH": "антиоксидантная ёмкость повышена", "s4_m_aH": "Антиоксидантная ёмкость повышена: пероксиредоксины быстрее возвращаются в восстановленную форму.", "s4_dn_gf": "сигнал роста", "s4_m_gf": "Сигнал роста активирует NOX: у плазматической мембраны образуется H₂O₂.", "s4_dn_peg": "ПЭГ-каталаза", "s4_m_peg": "ПЭГ-каталаза в высокой дозе разлагает H₂O₂ в цитоплазме.", "s4_dn_oligo": "олигомицин", "s4_m_oligo": "Олигомицин блокирует ATP-синтазу, поэтому протонный потенциал и доля NADH в матриксе возрастают.", "s4_dn_fccp": "FCCP", "s4_m_fccp": "FCCP в малой дозе снижает протонный потенциал: дыхание ускоряется, а доля NADH в матриксе уменьшается.", "s4_dn_anti_a": "антимицин A", "s4_m_anti_a": "Антимицин A ингибирует комплекс III; образующийся супероксид высвобождается и в матрикс, и в межмембранное пространство.", "s4_dn_nosrx": "нет сульфиредоксина", "s4_m_nosrx": "При отсутствии сульфиредоксина переокисленный пероксиредоксин (SO₂H) почти не восстанавливается.", "s4_dn_pkm2cs": "PKM2 C358S", "s4_m_pkm2cs": "Вариант PKM2 C358S не окисляется H₂O₂, поэтому при окислительной нагрузке поток глюкозы в пентозофосфатный путь не увеличивается.", "s4_dn_olap": "олапариб", "s4_m_olap": "Олапариб ингибирует PARP1, поэтому при повреждении ДНК NAD⁺ не расходуется на синтез поли(ADP-рибозы).", "s4_dn_rep": "реперфузия", "s4_m_rep": "Реперфузия после ишемии: за время ишемии накапливается сукцинат. После восстановления поступления O₂ SDH быстро окисляет его, и электроны переносятся через комплекс I в обратном направлении.", "s4_dn_dmm": "диметилмалонат", "s4_m_dmm": "Диметилмалонат, введённый до ишемии, ингибирует SDH, и сукцината накапливается меньше.", "s4_f_low": "H₂O₂ в матриксе — ×{hm}, в цитоплазме — ×{hc}; оба значения ниже эталона.", "s4_f_base": "H₂O₂ в матриксе — ×{hm}, в цитоплазме — ×{hc}; пероксиредоксины в основном восстановлены, текущая окислительная нагрузка низкая. Сколько повреждений возникло раньше, модель не рассчитывает.", "s4_f_sig": "H₂O₂ в матриксе — ×{hm}, в цитоплазме — ×{hc}. Доля пероксиредоксина в форме дисульфида повышена ({prx} — {ss} %), но переокисление и окислительная нагрузка невелики: окисление обратимо.", "s4_f_dmg": "H₂O₂ в матриксе — ×{hm}, в цитоплазме — ×{hc}. Условный показатель переокисления пероксиредоксина (SO₂H/SO₃H) — {hyp} %, индекс окислительной нагрузки — {dam}: образуются и необратимые окислительные повреждения.", "s4_f_akt_hi": "p-Akt — {x}: часть молекул PTP1B и PTEN окислена и неактивна, поэтому они слабее ограничивают сигнал.", "s4_f_akt_lo": "p-Akt — {x}: содержание H₂O₂ низкое, поэтому PTP1B и PTEN активны и ослабляют сигнал.", "s4_f_nad": "NAD⁺ — ×{x}: PARP1, активированная повреждением ДНК, потребляет NAD⁺.", "s4_z_ref": "В малых количествах H₂O₂ служит сигнальной молекулой: он обратимо окисляет остатки цистеина в белках, часто при участии пероксиредоксинов (Sies 2020; Stöcker 2018).", "s4_z_sig": "Пока пероксиредоксины окисляются до дисульфида и восстанавливаются тиоредоксином, окисление остаётся обратимым и может служить сигналом. Скорость образования супероксида в матриксе возрастает с увеличением доли NADH и протонного потенциала (Murphy 2009; Korshunov 1997).", "s4_z_dmg": "При недостаточной антиоксидантной ёмкости пероксиредоксины переокисляются и H₂O₂ накапливается; в результате окисляются липиды, белки и ДНК. Приведёт ли действие АФК к передаче сигнала или к повреждению, зависит от дозы, места и длительности, а не от самого присутствия АФК (Sies 2022).", "s4_z_nox": "H₂O₂, образуемый NOX, участвует в передаче сигнала роста: окисление PTP1B усиливает фосфорилирование рецепторов, а окисление PTEN сохраняет PIP₃ и усиливает активацию Akt (Lee 1998; Lee 2002; Meng 2002). Пероксиредоксины могут передавать окисление на белки-мишени (Sobotta 2015).", "s4_z_peg": "Антиоксидант в высокой дозе подавляет не только повреждение, но и сигнал: каталаза подавляла ответ на PDGF (Sundaresan 1995). Поэтому увеличение количества антиоксидантов не всегда полезно: в клинических испытаниях добавки антиоксидантов не снижали смертность (Bjelakovic 2007).", "s4_z_fccp": "Мягкое разобщение снижает протонный потенциал и долю NADH в матриксе, поэтому супероксида образуется меньше, хотя дыхание ускоряется (Korshunov 1997).", "s4_z_srx": "Сульфиредоксин восстанавливает переокисленную (SO₂H) форму пероксиредоксина с затратой ATP (Biteau 2003; Woo 2003). Образование формы SO₃H необратимо. Переокисление пероксиредоксина может способствовать окислению других мишеней молекулами H₂O₂ (Wood 2003).", "s4_z_pkm2": "Окисление Cys358 ингибирует PKM2 и перенаправляет поток глюкозы в пентозофосфатный путь, где образуется NADPH. Клетки с PKM2 C358S хуже переносили окислительную нагрузку (Anastasiou 2011, клетки рака лёгкого A549).", "s4_z_parp": "При повреждении ДНК PARP1 синтезирует поли(ADP-рибозу) из NAD⁺, и содержание NAD⁺ снижается. Механизм последующего торможения гликолиза обсуждается; показано также прямое ингибирование гексокиназы поли(ADP-рибозой) (Andrabi 2014).", "s4_z_rep": "При ишемии сердца накапливается сукцинат. При реперфузии он окисляется, электроны переносятся через комплекс I в обратном направлении, и образование супероксида резко возрастает. У мышей диметилмалонат снижал накопление сукцината и повреждение при реперфузии (Chouchani 2014). Это не противоречит вопросу 2: там SDH утрачена постоянно, и сукцинат накапливается, потому что не окисляется. Здесь SDH ингибируют перед ишемией, и в опыте Chouchani 2014 сукцината за время ишемии накапливалось меньше, а при реперфузии меньше его окислялось. Происхождение ишемического сукцината обсуждается: в условиях Zhang 2018 он образовывался в основном в прямом направлении цикла, а защиту давало кратковременное ингибирование комплекса II в начале реперфузии.", "s4b_take": "В этой учебной модели повышение доли NADH в матриксе усиливает образование супероксида, а из него — H₂O₂. В реальных митохондриях скорость образования супероксида определяют ещё источник электронов, протонный потенциал, концентрация O₂ и направление переноса электронов, поэтому по одной доле NADH её установить нельзя. В малых количествах H₂O₂ обратимо окисляет пероксиредоксины и белки-мишени, и это окисление может служить сигналом. Если H₂O₂ образуется быстрее, чем NADPH-зависимые системы восстанавливают пероксиредоксины, часть пероксиредоксинов переокисляется; сульфиновую форму некоторых 2-Cys-пероксиредоксинов способен восстановить сульфиредоксин (с затратой ATP). Окислительное повреждение зависит от силы и длительности воздействия и от возможностей защитных систем, поэтому его оценивают отдельно.", "s4a_take": "Приведёт ли действие АФК к передаче сигнала или к повреждению, зависит от дозы, места и длительности. NOX и пероксиредоксины участвуют в передаче сигнала, а антиоксидант в высокой дозе подавляет его. Восстановительную ёмкость поддерживают NADPH, образуемый в пентозофосфатном пути (в том числе после окисления PKM2), и сульфиредоксин. При повреждении ДНК PARP1 потребляет NAD⁺. С вопросами 1–3 этот вопрос связывают та же доля NADH в матриксе и тот же пул NAD⁺.", "p4b_1_q": "В эталонном состоянии доля NADH в матриксе составляет 0,32. Её повысили до 0,60, сохранив прежнюю антиоксидантную ёмкость. Как изменятся содержание H₂O₂ в матриксе и индекс окислительной нагрузки?", "p4b_1_o1": "Содержание H₂O₂ не изменится: SOD2 разрушает супероксид", "p4b_1_o2": "Содержание H₂O₂ возрастёт, индекс нагрузки почти не изменится", "p4b_1_o3": "Содержание H₂O₂ возрастёт, индекс нагрузки станет высоким", "p4b_1_e": "При высокой доле NADH комплекс I образует больше супероксида (Murphy 2009). SOD2 превращает супероксид в H₂O₂, и содержание H₂O₂ в матриксе возрастает примерно в 5 раз. Доля Prx3 в форме дисульфида увеличивается с 7 до 27 %, но тиоредоксин восстанавливает дисульфидную форму с той же скоростью, с какой она образуется. Поэтому переокисление остаётся слабым, а индекс окислительной нагрузки — низким (0,02).", "p4b_1_w1": "SOD2 не устраняет АФК, а превращает супероксид в H₂O₂. Поэтому чем больше образуется супероксида, тем больше образуется H₂O₂.", "p4b_1_w3": "При сохранной антиоксидантной ёмкости пероксиредоксины окисляются до дисульфида и восстанавливаются тиоредоксином, поэтому индекс окислительной нагрузки остаётся низким (0,02).", "p4b_2_q": "Доля NADH в матриксе 0,60. Антиоксидантную ёмкость снижают с 0,60 до 0,15. Как изменятся переокисление Prx3 и индекс окислительной нагрузки?", "p4b_2_o1": "Не изменятся: пероксиредоксину не нужен NADPH", "p4b_2_o2": "Переокисление снизится, нагрузка не изменится", "p4b_2_o3": "Вырастут и переокисление Prx3, и нагрузка", "p4b_2_e": "Пероксиредоксин восстанавливает H₂O₂. Остаток цистеина, участвующий в этой реакции, окисляется до сульфеновой формы (SOH). Далее образуется либо дисульфид, восстанавливаемый тиоредоксином, либо сульфиновая форма SO₂H — при действии ещё одной молекулы H₂O₂. Тиоредоксин восстанавливается тиоредоксинредуктазой за счёт NADPH. При низкой антиоксидантной ёмкости дисульфид восстанавливается медленнее, H₂O₂ удаляется хуже и чаще окисляет форму SOH до SO₂H. В модели условный показатель SO₂H/SO₃H возрастает с 4 до 48 %, H₂O₂ в матриксе — с ×4,9 до ×24, индекс окислительной нагрузки — с 0,02 до 0,75.", "p4b_2_w1": "Каталитический цикл пероксиредоксина замыкается через тиоредоксин, тиоредоксинредуктазу и NADPH. Пока окисленный пероксиредоксин не восстановлен, он не может восстановить следующую молекулу H₂O₂.", "p4b_2_w2": "Переокисление происходит, если сульфеновая форма пероксиредоксина окисляется второй молекулой H₂O₂ раньше, чем образует дисульфид. При недостаточном восстановлении переокисление усиливается, а не ослабевает.", "p4b_3_q": "Антиоксидантная ёмкость составляет 0,15, доля NADH в матриксе — 0,60; Prx3 переокислен. Долю NADH вернули к эталонному значению 0,32, не меняя антиоксидантной ёмкости. Как изменится содержание H₂O₂ в матриксе в новом установившемся состоянии?", "p4b_3_o1": "Снизится почти до эталона: супероксида меньше", "p4b_3_o2": "Останется высоким: переокисление необратимо", "p4b_3_o3": "Станет ниже эталонного: антиоксидантные системы больше не нужны", "p4b_3_e": "Супероксида образуется меньше, и сниженной ёмкости снова достаточно: H₂O₂ в матриксе снижается с ×24 до ×1,3, условный показатель переокисления Prx3 — с 48 % почти до нуля, индекс текущей окислительной нагрузки — до 0. Эти величины описывают новое установившееся состояние модели и не показывают, сколько повреждений ДНК, белков и липидов возникло раньше и сохранилось. Форму SO₂H восстанавливает сульфиредоксин с затратой ATP (Biteau 2003; Woo 2003); сульфоновая форма SO₃H не восстанавливается, а в модели она не выделена, и время восстановления не рассчитывается.", "p4b_3_w2": "Сульфиновую форму (SO₂H) пероксиредоксина восстанавливает сульфиредоксин с затратой ATP; необратима только сульфоновая форма (SO₃H).", "p4b_3_w3": "Ёмкость по-прежнему снижена (0,15), поэтому H₂O₂ остаётся чуть выше эталона (×1,3), а не ниже.", "p4a_1_q": "В эталонных условиях сигнал роста отсутствует. Добавили фактор роста, и NOX у плазматической мембраны образует H₂O₂. Как изменятся окисление PTP1B и индекс окислительной нагрузки?", "p4a_1_o1": "Окисление PTP1B не изменится: пероксиредоксины разрушают H₂O₂", "p4a_1_o2": "Вырастут и окисление PTP1B, и нагрузка", "p4a_1_o3": "Окисление PTP1B вырастет, нагрузка не изменится", "p4a_1_e": "Содержание H₂O₂ в цитоплазме возрастает примерно в 3 раза, показатель окисления PTP1B — с 0,19 до 0,40, p-Akt — с 0,20 до 0,80, а индекс окислительной нагрузки остаётся около нуля. Окисление каталитического цистеина PTP1B обратимо и усиливает сигнал от рецептора (Lee 1998; Meng 2002).", "p4a_1_w1": "Пероксиредоксины не только восстанавливают H₂O₂, но и передают окисление на белки-мишени (Sobotta 2015; Stöcker 2018). Кроме того, вблизи источника локальная концентрация H₂O₂ выше (Woo 2010).", "p4a_1_w2": "Концентрация H₂O₂, образуемого NOX, остаётся в сигнальном диапазоне: пероксиредоксины окисляются до дисульфида, но не переокисляются, и индекс окислительной нагрузки не увеличивается.", "p4a_2_q": "В клетках действует сигнал роста (NOX активна). Добавляют ПЭГ-каталазу в высокой дозе. Как изменится показатель p-Akt?", "p4a_2_o1": "Снизится: H₂O₂ участвует в передаче сигнала", "p4a_2_o2": "Не изменится: H₂O₂ — побочный продукт", "p4a_2_o3": "Вырастет: каталаза защищает Akt от окисления", "p4a_2_e": "Каталаза разлагает H₂O₂, и его содержание в цитоплазме становится ниже эталона. Окисление PTP1B составляет 0,18, а p-Akt снижается с 0,80 до 0,55. В работе Sundaresan 1995 каталаза подавляла фосфорилирование в ответ на PDGF. Антиоксидант в высокой дозе подавляет и сигнал.", "p4a_2_w2": "H₂O₂, образуемый NOX, участвует в передаче сигнала: он обратимо окисляет и тем самым ингибирует фосфатазы. PTP1B дефосфорилирует остатки тирозина в рецепторах и других белках, а PTEN превращает PIP₃ в PIP₂ и тем самым ограничивает активацию Akt (Lee 2002). Поэтому удаление H₂O₂ ослабляет сигнал.", "p4a_2_w3": "Каталаза не взаимодействует с Akt: она разлагает H₂O₂, поэтому PTP1B и PTEN остаются активными и p-Akt снижается.", "p4a_3_q": "Эталонную клетку обработали малой дозой FCCP, и дыхание ускорилось. Как изменится содержание H₂O₂ в матриксе?", "p4a_3_o1": "Вырастет: кислорода потребляется больше", "p4a_3_o2": "Снизится вместе с долей NADH", "p4a_3_o3": "Не изменится: потенциал не важен", "p4a_3_e": "FCCP снижает протонный потенциал, доля NADH в матриксе уменьшается с 0,32 до 0,22, и супероксида образуется меньше: H₂O₂ в матриксе — ×0,45. Образование АФК митохондриями резко зависит от протонного потенциала (Korshunov 1997, изолированные митохондрии).", "p4a_3_w1": "Скорость образования супероксида определяется не потреблением O₂, а степенью восстановленности переносчиков и протонным потенциалом; при разобщении обе величины снижаются.", "p4a_3_w3": "Разобщитель изменяет долю NADH в матриксе и протонный потенциал, а от них зависит образование супероксида. Поэтому содержание H₂O₂ тоже изменяется.", "p4a_4_q": "Окислительная нагрузка высокая: доля NADH в матриксе составляет 0,60, антиоксидантная ёмкость — 0,15. При этих условиях сравните клетки без сульфиредоксина с клетками, в которых он присутствует. Как различается доля переокисленного Prx3?", "p4a_4_o1": "Ниже: без сульфиредоксина Prx не окисляется", "p4a_4_o2": "Одинакова: сульфиредоксин здесь не участвует", "p4a_4_o3": "Выше: SO₂H-форма почти не восстанавливается", "p4a_4_e": "Сульфиредоксин восстанавливает SO₂H-форму пероксиредоксина с затратой ATP (Biteau 2003; Woo 2003). При его отсутствии условный показатель переокисления Prx3 возрастает (48 → 89 %), а H₂O₂ в матриксе возрастает с ×24 до ×35. Модель показывает установившееся состояние.", "p4a_4_w1": "Сульфиредоксин не окисляет пероксиредоксин, а восстанавливает его переокисленную форму; без него переокисленного Prx больше.", "p4a_4_w2": "Сульфиредоксин — основной известный фермент, восстанавливающий SO₂H-форму 2-Cys-пероксиредоксинов; без него эта форма накапливается.", "p4a_5_q": "Окислительная нагрузка высокая, действует сигнал роста. Сравните клетки с PKM2 C358S (цистеин 358 заменён на серин) и клетки с PKM2 дикого типа. Как различаются содержание NADPH и H₂O₂ в цитоплазме этих клеток?", "p4a_5_o1": "Содержание NADPH ниже, содержание H₂O₂ выше", "p4a_5_o2": "Содержание NADPH выше, содержание H₂O₂ ниже", "p4a_5_o3": "Не отличаются", "p4a_5_e": "H₂O₂ окисляет Cys358 PKM2 и ингибирует фермент, поэтому поток глюкозы перенаправляется в пентозофосфатный путь, где образуется NADPH (Anastasiou 2011). В клетках с PKM2 C358S этого не происходит: содержание NADPH ниже (×0,16 → ×0,09 от эталона), а содержание H₂O₂ в цитоплазме выше (×5,7 → ×7,4). В опытах Anastasiou 2011 клетки с PKM2 C358S хуже переносили окислительную нагрузку.", "p4a_5_w2": "Замена Cys358 делает PKM2 нечувствительной к окислению: PKM2 не ингибируется, и поток в пентозофосфатный путь не увеличивается, поэтому содержание NADPH ниже, а не выше.", "p4a_5_w3": "Окисление PKM2 — часть антиоксидантного ответа: без него содержание NADPH при нагрузке ниже, а содержание H₂O₂ выше.", "p4a_6_q": "Окислительная нагрузка высокая: индекс окислительной нагрузки 0,75, содержание NAD⁺ снижено. Добавляют олапариб — ингибитор PARP. Как изменятся содержание NAD⁺ и индекс окислительной нагрузки?", "p4a_6_o1": "Вернутся к эталону и содержание NAD⁺, и индекс нагрузки", "p4a_6_o2": "Содержание NAD⁺ вернётся к эталону, индекс нагрузки не изменится", "p4a_6_o3": "Содержание NAD⁺ снизится ещё сильнее, индекс нагрузки возрастёт", "p4a_6_e": "PARP1, активированная разрывами ДНК, синтезирует поли(ADP-рибозу) из NAD⁺. Олапариб ингибирует PARP1, и содержание NAD⁺ повышается с ×0,51 до ×0,98. Индекс окислительной нагрузки остаётся 0,75: олапариб не влияет на образование H₂O₂. Репарацию ДНК, в которой участвует PARP1, модель не рассчитывает, поэтому неизменность индекса — следствие устройства модели. Как расход NAD⁺ в этих условиях влияет на гликолиз, обсуждается (Andrabi 2014).", "p4a_6_w1": "Олапариб не уменьшает образование H₂O₂: он устраняет только расход NAD⁺ на синтез поли(ADP-рибозы), а окислительная нагрузка сохраняется.", "p4a_6_w3": "При повреждении ДНК PARP1 сама потребляет NAD⁺, поэтому её ингибирование сохраняет NAD⁺.", "p4a_7_q": "При реперфузии сердца после ишемии содержание H₂O₂ в матриксе резко возрастает. В другом опыте перед ишемией вводят диметилмалонат (ингибитор SDH). Как изменится содержание H₂O₂ в матриксе при реперфузии?", "p4a_7_o1": "Не изменится: АФК образуются в комплексе III", "p4a_7_o2": "Вырастет ещё больше: сукцинат накопится", "p4a_7_o3": "Будет намного ниже, чем без диметилмалоната", "p4a_7_e": "Диметилмалонат ингибирует SDH, поэтому за время ишемии накапливается меньше сукцината, а при реперфузии обратный перенос электронов через комплекс I ослаблен. H₂O₂ в матриксе — ×7,3 вместо ×64, индекс окислительной нагрузки — 0,08 вместо 0,98. У мышей диметилмалонат снижал накопление сукцината и повреждение сердца при реперфузии (Chouchani 2014). Происхождение ишемического сукцината обсуждается (Zhang 2018).", "p4a_7_w1": "Резкое усиление образования супероксида при реперфузии вызвано прежде всего обратным переносом электронов от накопленного сукцината через комплекс I (Chouchani 2014). Ингибирование SDH ослабляет это усиление.", "p4a_7_w2": "Диметилмалонат превращается в малонат, ингибитор SDH, и уменьшает накопление сукцината, а не увеличивает его.", "gn_rx_nad": "NAD⁺ и NADH в матриксе", "g_rx_nad": "Доля NADH в пуле NAD(H) матрикса — тот же показатель, что и в вопросе 1: в эталоне 0,32 (олигомицин — 0,57, FCCP — 0,22, как на вкладке 1). Доля NADH растёт, когда NADH образуется быстрее, чем дыхательная цепь его окисляет; новое установившееся состояние достигается при более высокой доле NADH, и в нём образование и окисление NADH снова уравновешены. Отношение свободных NAD⁺/NADH в матриксе митохондрий печени крысы составляет около 8 : 1, в цитоплазме — около 700 : 1 (Williamson 1967). В клетках отношение NADH/NAD⁺ в цитоплазме измеряют биосенсором SoNar (Zhao 2015). NAD⁺ используют также сиртуины (вопрос 3) и PARP1.", "gn_rx_etc": "Где образуется супероксид", "g_rx_etc": "В изолированных митохондриях супероксид образуют прежде всего комплекс I (у флавина и при обратном переносе электронов) и комплекс III (центр Qo); комплекс III высвобождает супероксид по обе стороны внутренней мембраны (St-Pierre 2002; Muller 2004). Скорость образования супероксида возрастает с повышением степени восстановленности переносчиков (доли NADH) и протонного потенциала (Korshunov 1997; Murphy 2009). При обратном переносе электронов от сукцината через комплекс I образуется особенно много супероксида (Chouchani 2014). Упрощение модели: образование супероксида задано как функция доли NADH и протонного потенциала; вклад отдельных центров не рассчитывается.", "gn_rx_sox": "Супероксид (O₂•⁻)", "g_rx_sox": "Супероксид — продукт присоединения одного электрона к O₂. Он плохо проходит через мембраны и быстро превращается в H₂O₂ под действием супероксиддисмутаз: SOD2 в матриксе, SOD1 в цитоплазме и межмембранном пространстве. Флуоресцентный зонд MitoSOX, предназначенный для выявления супероксида, даёт и неспецифический сигнал, поэтому его показания проверяют другими методами (Sies 2022).", "gn_rx_sod": "SOD2", "g_rx_sod": "Марганцевая супероксиддисмутаза матрикса. Она превращает две молекулы супероксида в H₂O₂ и O₂. SOD не устраняет АФК, а превращает одну их форму в другую; H₂O₂ затем восстанавливают пероксиредоксины, глутатионпероксидазы и каталаза.", "gn_rx_h2o2": "H₂O₂: сигнал и повреждение", "g_rx_h2o2": "H₂O₂ — главная сигнальная форма АФК: он относительно стабилен, проходит через аквапорины и обратимо окисляет цистеины белков, находящиеся в тиолатной форме (Sies 2020; Winterbourn 2008). По оценке Sies 2020, в норме внутриклеточная концентрация H₂O₂ составляет порядка 1–10 нМ, а окислительный стресс начинается при концентрациях выше примерно 100 нМ. H₂O₂ в цитоплазме или в матриксе измеряют биосенсором HyPer7 (Pak 2020). Упрощение модели: содержание H₂O₂ показано относительно эталона; диффузия между матриксом и цитоплазмой задана одной долей.", "gn_rx_prx": "Пероксиредоксины", "g_rx_prx": "2-Cys-пероксиредоксины (Prx1, Prx2 в цитоплазме, Prx3 в матриксе) восстанавливают H₂O₂ с очень высокой скоростью. Пероксидатный цистеин — остаток, взаимодействующий с H₂O₂, — окисляется до сульфеновой формы (Poole 2015) и образует дисульфид с остатком цистеина второй субъединицы; затем тиоредоксин восстанавливает дисульфид. Если остаток цистеина в сульфеновой форме окисляется ещё одной молекулой H₂O₂ раньше, чем образуется дисульфид, возникает сульфиновая кислота (SO₂H) — «переокисленный» пероксиредоксин. Сульфиновую форму типичных 2-Cys-пероксиредоксинов (Prx1–Prx4, но не Prx5 и Prx6) восстанавливает сульфиредоксин с затратой ATP (Biteau 2003; Woo 2003; Chang 2004; Woo 2005), а окисление до сульфоновой кислоты (SO₃H) необратимо. Переокисление инактивирует пероксиредоксин; по гипотезе «шлюза» это позволяет H₂O₂ достигать других мишеней (Wood 2003). Пероксиредоксины передают окисление на белки-мишени, например на STAT3 (Sobotta 2015; Stöcker 2018). При электрофорезе в невосстанавливающих условиях дисульфидная форма движется как димер. Упрощение модели: формы SO₂H и SO₃H объединены в один условный показатель переокисления, время восстановления не рассчитывается. В клетках Prx3 устойчивее к переокислению, чем Prx1 и Prx2 (Cox 2009); в модели константа переокисления у них одна.", "gn_rx_trx": "Тиоредоксин, глутатион, NADPH", "g_rx_trx": "Тиоредоксин восстанавливает окисленные пероксиредоксины; сам он восстанавливается тиоредоксинредуктазой за счёт NADPH. Окисленный глутатион восстанавливает глутатионредуктаза, также за счёт NADPH. NADPH образуется в пентозофосфатном пути, при участии малатного фермента, IDH1/2 и NNT в митохондриях. Ползунок «Антиоксидантная ёмкость» объединяет эти системы в одну величину; это упрощение модели.", "gn_rx_sig": "PTP1B, PTEN и Akt", "g_rx_sig": "В активном центре фосфатаз PTP1B и PTEN находится каталитический цистеин; его обратимое окисление H₂O₂ временно инактивирует эти ферменты. После стимуляции фактором роста H₂O₂, образованный NOX, окислял PTP1B (Lee 1998; Meng 2002), и фосфорилирование рецепторов и Akt усиливалось. H₂O₂ может локально накапливаться у мембраны, когда находящийся там Prx1 временно инактивирован фосфорилированием (Woo 2010). PTP1B дефосфорилирует остатки фосфотирозина в рецепторах и других белках, а PTEN — липидная фосфатаза: она превращает PIP₃ в PIP₂ и тем самым ограничивает активацию Akt; H₂O₂ обратимо окисляет и PTEN (Lee 2002). Упрощение модели: окисление PTP1B и PTEN задано одной функцией содержания H₂O₂ в цитоплазме, а p-Akt — индекс, зависящий от сигнала роста и этого окисления.", "gn_rx_dmg": "Окислительное повреждение", "g_rx_dmg": "При избытке H₂O₂ и при образовании гидроксильного радикала (реакция Фентона с Fe²⁺) окисляются основания ДНК (8-оксогуанин, 8-oxoG), липиды (продукт — 4-гидроксиноненаль, 4-HNE) и белки (карбонилирование). Эти изменения отличаются от обратимого окисления цистеинов. Упрощение модели: индекс текущей окислительной нагрузки (от 0 до 1) резко возрастает с повышением содержания H₂O₂ в данный момент и не различает мишени. Накопление повреждений и их репарация не рассчитываются: при снижении H₂O₂ индекс сразу снижается, хотя возникшие раньше повреждения ДНК, белков и липидов этим не устраняются.", "gn_rx_parp": "PARP1 и NAD⁺", "g_rx_parp": "PARP1 связывается с разрывами ДНК и синтезирует поли(ADP-рибозу) из NAD⁺; при сильном повреждении содержание NAD⁺ снижается. Олапариб ингибирует PARP. Механизм энергетического истощения обсуждается: показано, что поли(ADP-рибоза) ингибирует гексокиназу (Andrabi 2014). Упрощение модели: расход NAD⁺ увеличивается с ростом индекса окислительной нагрузки, а синтез NAD⁺ (NAMPT) постоянен.", "gn_rx_pkm2": "PKM2 и пентозофосфатный путь", "g_rx_pkm2": "PKM2 — изоформа пируваткиназы. H₂O₂ окисляет Cys358 PKM2 (нумерация человека), и активность фермента снижается. Промежуточные продукты гликолиза перенаправляются в пентозофосфатный путь (ПФП), и образуется больше NADPH; клетки с заменой C358S хуже переносили окислительную нагрузку (Anastasiou 2011). Этот механизм связывает вопросы 4 и 1. Упрощение модели: прирост NADPH при окислении PKM2 задан условной функцией содержания H₂O₂ в цитоплазме.", "gn_rx_nox": "NOX — NADPH-оксидазы", "g_rx_nox": "NOX образуют супероксид и H₂O₂ в регулируемой реакции: они переносят электроны с NADPH через мембрану на O₂. Активность NOX2 фагоцитов лежит в основе «респираторного взрыва»; в других клетках NOX активируются факторами роста, и H₂O₂ служит частью сигнала (Sundaresan 1995; Sies 2020). Упрощение модели: переключатель «Сигнал роста» активирует одновременно рецептор и NOX.", "gn_rx_measure": "Как это измеряют", "g_rx_measure": "Изменения H₂O₂ регистрируют биосенсором HyPer7, направленным в цитоплазму или матрикс (Pak 2020). Он даёт отношение флуоресцентных сигналов, связанное с окислением сенсора. Показанные в интерактиве кратности H₂O₂ рассчитаны моделью; они не являются кратностями сигнала HyPer7 или результатом его калибровки. Отношение NADH/NAD⁺ в цитоплазме регистрируют биосенсором SoNar (Zhao 2015). Окисление пероксиредоксинов оценивают электрофорезом в невосстанавливающих условиях (по дисульфидному димеру) и с помощью антител к Prx-SO₂/₃H; результат зависит от подготовки образца (Cox 2009). Окисленные цистеины белков выявляют масс-спектрометрией. Повреждение оценивают по содержанию 8-oxoG в ДНК и продуктов перекисного окисления липидов. Флуоресцентные красители (DCFH, MitoSOX) неспецифичны, и их сигнал требует контролей (Sies 2022).", "gn_rx_model": "Что упрощено в модели", "g_rx_model": "Все величины относительные; показано установившееся состояние, время не рассчитывается.
