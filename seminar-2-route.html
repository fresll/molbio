рности измеряют распределение маркеров между доменами, а барьер плотного контакта — отдельно, по трансэпителиальному сопротивлению и потоку парацеллюлярного маркера: это разные функции.","Контроли во всех разделах устроены одинаково. Разрушение трека нокодазолом показывает, что процесс зависит от микротрубочек, но не указывает мотор. Удаление мотора, адаптера или машины слияния показывает необходимость белка, но не его достаточность и не прямой механизм. Достаточность проверяют противоположным экспериментом: мотор химически индуцируемой связью присоединяют к выбранному грузу, сборку конденсата индуцируют светом в оптогенетической системе. Возвращение белка дикого типа, восстанавливающее само измеряемое событие, поддерживает специфичность вывода, а вмешательство в противоположную машину лишь компенсирует фенотип.","Переключайте таблицы: для каждого механизма указаны величина, метод, контроль и ограничение вывода."],"trap":["Если белок необходим для процесса, его достаточно, чтобы этот процесс шёл.","Удаление белка показывает только необходимость. Достаточность проверяют отдельным экспериментом: белок присоединяют к грузу или активируют в новом месте и смотрят, возникает ли процесс."],"conditions":"Сводная таблица по шагам разделов 1–4; схемы каждого метода показаны в шагах «Как измеряют направление транспорта», «Как узнать, какая машина изменена», «Чего не доказывает яркий фокус» и в последнем шаге раздела о полярности. Индуцируемое присоединение мотора к пероксисомам — Kapitein 2010 (клетки COS-7); оптогенетическая сборка конденсатов — Shin 2017 (клетки NIH 3T3, U2OS); критерии конденсата — Gao 2022; барьер и полярность — Günzel 2026; восстановление механизма и компенсация — Anand 2014 (эмбриональные фибробласты мыши).","sources":["Kapitein2010","Shin2017","Gao2022","Gunzel2026","Anand2014"],"quiz":{"id":"S2-L29","question":"После удаления белка процесс в клетке прекратился. Какой эксперимент проверит, достаточно ли этого белка для процесса?","options":[{"id":"S2-L29-1","text":"Повторить удаление белка в клетках другой линии","correct":false,"feedback":"Повтор в других клетках покажет, насколько общая необходимость белка, но не его достаточность: процесс по-прежнему изучают только в его отсутствие."},{"id":"S2-L29-2","text":"Присоединить белок в новом месте и проверить процесс","correct":true,"feedback":"Если белок, присоединённый к новому грузу или активированный в новом месте, вызывает процесс там, где его раньше не было, — белок достаточен. Так проверяют мотор, присоединяя его к пероксисомам химически индуцируемой связью, и сборку конденсата, индуцируя её светом."},{"id":"S2-L29-3","text":"Снизить количество белка наполовину и сравнить","correct":false,"feedback":"Частичное снижение покажет, зависит ли процесс от количества белка, но это по-прежнему эксперимент на необходимость: белок убирают, а не добавляют в новое место."}]},"widget":{"kind":"table","title":"","s":{"title":"Величина, метод, контроль","status":"Схема метода (сводная таблица)","modes_label":"Механизм","modes":["транспорт","слияние и деление","конденсат","полярность"],"tables":[{"head":["Что","Содержание"],"rows":[["величина","направление и скорость пробегов отдельных грузов; доля подвижных грузов"],["метод","прижизненная съёмка и кимограмма; ориентация треков по меткам плюс-концов (EB3)"],["контроль","нокодазол или латрункулин A — зависимость от трека; удаление мотора или адаптера — необходимость; индуцируемое присоединение мотора к грузу — достаточность"],["ограничение","среднее положение органелл не различает закрепление и быстрое движение в обе стороны"]],"note":"Направление относительно частей клетки имеет смысл только при известной ориентации треков в той же клетке."},{"head":["Что","Содержание"],"rows":[["величина","частота событий слияния и деления; обмен матриксным маркером; отдельно — морфология и функция"],["метод","прижизненная съёмка; фотоактивируемый маркер в матриксе; блот длинной и короткой форм OPA1; доля DRP1 на мембране; TMRM и потребление кислорода"],["контроль","возврат белка дикого типа, восстанавливающий само измеряемое событие при сопоставимых количестве и локализации белка, поддерживает вывод о механизме; вмешательство в противоположную машину лишь компенсирует фенотип"],["ограничение","фрагментацию дают и усиленное деление, и подавленное слияние; фрагментация не равна нарушению функции"]],"note":"Морфологию приближённо задаёт отношение констант слияния и деления, частоту событий — ещё и сами константы: картина сети не указывает, какая машина изменена."},{"head":["Что","Содержание"],"rows":[["величина","зависимость от концентрации каркаса и распределение белка между структурой и окружением; обмен компонентов; слияние и округление фокусов"],["метод","снижение и повышение концентрации; FRAP; наблюдение слияния; оптогенетическая сборка"],["контроль","замены, нарушающие только конденсацию и сохраняющие известное специфическое связывание"],["ограничение","пороговая картина бывает и у других кооперативных сборок; быстрый FRAP показывает обмен, но не жидкое состояние; 1,6-гександиол действует неизбирательно"]],"note":"Яркий фокус одинаково выглядит у конденсата, устойчивого комплекса, белка на невидимой органелле и агрегата."},{"head":["Что","Содержание"],"rows":[["величина","распределение маркеров между апикальным и базолатеральным доменами (контраст); отдельно — барьер"],["метод","иммунофлуоресценция маркеров доменов; FRAP мембранного белка; трансэпителиальное сопротивление и поток парацеллюлярного маркера"],["контроль","подавление доставки (миозин Vb), подавление эндоцитоза (ингибитор динамина), удаление клаудинов"],["ограничение","низкое сопротивление говорит о барьере, а не о полярности; белок на обеих мембранах требует измерения распределения маркеров"]],"note":"Домен — стационарное состояние доставки, удержания и удаления; барьер плотного контакта — отдельная функция."}]}},"section":4,"number":29,"question":0},{"id":"investigation","questions":[1,2,3,4],"title":"Исследование одного нейрона: от тела клетки до синапса","keywords":["нейрон","аксон","синапс","DRP1","Miro","синтафилин","ANXA11","РНП-гранула","лизосома","анкирин G","начальный сегмент аксона"],"lead":["В нейроне с длинным аксоном все четыре механизма семинара работают одновременно.","Нарушение каждого из них проявляется в одном и том же месте — в далёком от тела клетки синапсе, — но по разным причинам."],"mechanism":["Полярность: начальный сегмент аксона, собранный на каркасе [[T92|анкирина G]], отделяет аксон от соматодендритного отдела; кинезин KIF5 избирательно переносит грузы в аксон.","Транспорт и деление: митохондрия, разделённая DRP1, переносится кинезином-1 через TRAK и Miro и останавливается у активного синапса при участии Miro и синтафилина.","Конденсат на органелле: РНП-гранула через белок [[T93|ANXA11]] связывается с лизосомой и переносится вместе с ней к удалённым участкам аксона."],"paragraphs":["Нейрон удобен как итоговый пример, потому что требования к пространственной организации в нём предельны: аксон длиннее тела клетки в тысячи раз, а синапс, где нужны ATP и буферирование Ca²⁺, находится на его конце. Сначала нужна сама полярность. Начальный сегмент аксона собирается на каркасе анкирина G; в культуре нейронов гиппокампа крысы подавление синтеза анкирина G разбирало начальный сегмент, и бывший аксон приобретал признаки дендрита: в него проникали белки соматодендритного отдела, а на нём собирались шипики и постсинаптические уплотнения (Hedstrom 2008).","Затем нужна доставка органелл. Митохондрия попадает в аксон и движется по нему, связываясь с кинезином-1 через адаптер TRAK и белок наружной мембраны Miro; в участке активного синапса повышение Ca²⁺ останавливает её, а синтафилин закрепляет на микротрубочке (Wang и Schwarz 2009; Kang 2008; Chen и Sheng 2013). Деление необходимо для нормального распределения митохондрий по отросткам: у дрозофилы с мутацией drp1 митохондрии почти отсутствовали в синапсах нервно-мышечного соединения, и при интенсивной стимуляции синаптическая передача не поддерживалась (Verstreken 2005); у мыши без Drp1 митохондрии в нейронах скапливались и плохо распределялись по отросткам, а образование синапсов нарушалось (Ishihara 2009). Что именно мешает переносу неразделённой сети — её размер или другие свойства, — эти эксперименты прямо не показывают.","Третий груз — рибонуклеопротеиновые гранулы, безмембранные сборки с мРНК, которые обеспечивают местный синтез белка вдали от ядра. В нейронах и клетках линий человека гранулы переносились, связываясь с движущимися лизосомами: белок ANXA11 своей неупорядоченной областью входит в гранулу, а другим доменом связывается с мембраной лизосомы; замены в ANXA11, найденные при боковом амиотрофическом склерозе, нарушали эту связь и перенос гранул (Liao 2019). Здесь соединяются конденсат (вопрос 3) и транспорт по треку (вопрос 1).","Переключайте нарушения на схеме: отсутствие DRP1, Miro без связывания Ca²⁺ или нейрон без синтафилина, замена в ANXA11, разборка начального сегмента. В каждом случае ответ на вопрос «что нарушено» требует своей величины — распределения органелл по аксону, доли остановленных у синапса митохондрий, переноса гранул, распределения маркеров доменов."],"trap":["Если в синапсе мало митохондрий, значит, нарушен мотор, который их переносит.","Тот же результат дают нарушение деления, утрата закрепления синтафилином и Ca²⁺-зависимой остановки у синапса или нарушение полярности нейрона. Чтобы назвать причину, измеряют разные величины: распределение и подвижность митохондрий, долю остановленных у синапса, состав доменов."],"conditions":"Начальный сегмент и анкирин G — нейроны гиппокампа крысы в культуре (культура — по методике Ogawa 2006: эмбрионы крысы 18-го дня), РНК-интерференция (Hedstrom 2008); избирательный перенос KIF5 в аксон — Nakata и Hirokawa 2003. Остановка митохондрий у синапса — нейроны гиппокампа крысы, Miro с заменами в EF-мотивах (Wang и Schwarz 2009); доля подвижных митохондрий 36 и 76 % в нейронах гиппокампа мыши дикого типа и без синтафилина (Kang 2008); синтафилин и остановка при активности (Chen и Sheng 2013). Деление и распределение митохондрий — мотонейроны личинок дрозофилы drp1 (Verstreken 2005) и мыши без Drp1 (Ishihara 2009). Перенос РНП-гранул на лизосомах — нейроны крысы, нейроны из индуцированных плюрипотентных клеток человека и клетки линий человека (Liao 2019). Схема — качественная, распределения органелл условны.","sources":["Hedstrom2008","Ogawa2006","Nakata2003","Wang2009","Kang2008","Chen2013","Verstreken2005","Ishihara2009","Liao2019"],"quiz":{"id":"S2-L30","question":"В нейронах без DRP1 митохондрии скапливаются у тела клетки и почти не попадают в синапсы. Какое объяснение согласуется с механизмами семинара?","options":[{"id":"S2-L30-1","text":"Без деления сеть митохондрий хуже переносится в аксон","correct":true,"feedback":"Без деления митохондрии хуже распределяются по отросткам: в нейронах дрозофилы drp1 и мыши без Drp1 они скапливались в теле клетки. DRP1 при этом не мотор и не адаптер; какое свойство неразделённой сети мешает переносу, эти эксперименты прямо не показывают."},{"id":"S2-L30-2","text":"DRP1 сама переносит митохондрии к плюс-концу","correct":false,"feedback":"DRP1 — ГТФаза деления, которая собирается в кольцо на наружной мембране; переносит митохондрии по аксону кинезин-1, связанный с ними через TRAK и Miro."},{"id":"S2-L30-3","text":"Без DRP1 у синапса не повышается концентрация Ca²⁺","correct":false,"feedback":"Ca²⁺ в участке синапса повышается от активности самого синапса; повышение Ca²⁺ останавливает уже пришедшие митохондрии, но не объясняет, почему они не доходят до аксона."}]},"widget":{"kind":"q5neuron","title":"","s":{"title":"Один нейрон: полярность, транспорт, деление и гранулы","status":"Схема механизма (качественная, распределения условны)","modes_label":"Нейрон","modes":["норма","нет DRP1","Miro без связывания Ca²⁺","нет синтафилина","замена в ANXA11","нет анкирина G"],"soma":"тело клетки","nuc":"ядро","dend":"дендриты","ais":"начальный сегмент","axon":"аксон","syn":"активный синапс","lg_mito":"митохондрия","lg_lyso":"лизосома","lg_rnp":"РНП-гранула","lg_spine":"шипик","m_soma":"в теле","m_axon":"в аксоне","m_syn":"у синапса","m_rnp":"гранулы в аксоне","states":[{"mito":[1,3,2],"rnp":2,"ais":1,"spines":0,"note":"Митохондрии распределены по аксону и задерживаются у активного синапса, гранулы переносятся на лизосомах, начальный сегмент отделяет аксон от дендритов."},{"mito":[3,1,0],"rnp":2,"ais":1,"spines":0,"note":"Без деления митохондрии скапливаются в теле клетки и почти не попадают в аксон и синапс (дрозофила drp1, мышь без Drp1)."},{"mito":[1,3,1],"rnp":2,"ais":1,"spines":0,"note":"Митохондрии движутся по аксону, но повышение Ca²⁺ у активного синапса их не останавливает: Miro с заменами в EF-мотивах не связывает Ca²⁺."},{"mito":[1,2,1],"rnp":2,"ais":1,"spines":0,"note":"Без синтафилина доля подвижных митохондрий выше (76 % против 36 %), их плотность в аксоне ниже, а при активности синапса они не задерживаются у него."},{"mito":[1,3,2],"rnp":0,"ais":1,"spines":0,"note":"Гранулы перестают связываться с лизосомами и не переносятся по аксону; транспорт митохондрий при этом не нарушен."},{"mito":[1,3,2],"rnp":2,"ais":0,"spines":1,"note":"Начальный сегмент разобран: в бывший аксон проникают белки соматодендритного отдела, на нём появляются шипики — аксон приобретает признаки дендрита."}],"lv":["нет","мало","средне","много"]}},"section":4,"number":30,"question":0}],"sections":[{"title":"Транспорт по цитоскелету","entry":"tracks","sub":"Как трек, мотор и адаптер задают, куда попадёт груз"},{"title":"Слияние и деление","entry":"balance","sub":"Как баланс двух машин задаёт число и связность митохондрий"},{"title":"Конденсаты","entry":"condensate","sub":"Как без мембраны возникает компартмент и как это доказать"},{"title":"Полярность","entry":"polar-cell","sub":"Как доставка, удержание и удаление поддерживают домен"},{"title":"Исследование","entry":"methods","sub":"Как выбрать величину, метод и контроль","integr":true}],"glossary":[{"id":"S2-T01","term":"Микротрубочка","section":0,"def":"Полый полимер из димеров α- и β-тубулина диаметром около 25 нм; служит треком для кинезинов и динеина. Её два конца различаются по строению и по скорости роста, поэтому у трека есть направление. В большинстве животных клеток минус-концы закреплены у центросомы, но в дифференцированных клетках значительная часть микротрубочек организуется вне неё."},{"id":"S2-T02","term":"Плюс-конец и минус-конец","section":0,"def":"Названия двух структурно различных концов микротрубочки, а не электрические заряды. Плюс-конец быстрее растёт и разбирается; минус-конец обычно закреплён в центре организации микротрубочек. Направление движения мотора указывают относительно этих концов, а направление относительно частей клетки зависит от того, как в данной клетке расположены треки."},{"id":"S2-T03","term":"Актиновый филамент","section":0,"def":"Двуспиральный полимер актина; его концы называют оперённым (+) и заострённым (−). Актиновые филаменты образуют кортикальную сеть под плазматической мембраной, пучки в выростах и сократительные структуры; по ним движутся миозины. В транспорте актиновая система обеспечивает последний короткий участок пути и удержание груза у мембраны."},{"id":"S2-T04","term":"Молекулярный мотор","section":0,"def":"Белок, превращающий энергию гидролиза ATP в направленное перемещение вдоль полярного филамента. Мотор характеризуют направленностью (к какому концу филамента он движется), размером шага, процессивностью и скоростью. Процессивность — способность одной молекулы сделать много шагов подряд, не отсоединяясь от трека."},{"id":"S2-T05","term":"Адаптер груза","section":0,"def":"Белок, который одновременно связывает мотор (или активирующий его комплекс) и определённый груз — мембранный белок органеллы, рибонуклеопротеиновую частицу. Адаптер определяет, какой груз переносит данный мотор; у динеина адаптер вместе с динактином ещё и переводит мотор в активное процессивное состояние."},{"id":"S2-T06","term":"Стационарное состояние","section":1,"def":"Состояние системы, которое не меняется во времени, потому что противоположные потоки равны (например, слияния и деления, доставки и удаления), а не потому, что процессы остановились. Одна и та же стационарная картина совместима с разными значениями констант скоростей и разной частотой событий, поэтому по картине нельзя установить механизм. В модели сети митохондрий картину приближённо задаёт отношение констант слияния и деления, пока оба процесса идут намного быстрее роста клеток."},{"id":"S2-T07","term":"Нокодазол и латрункулин A","section":0,"def":"Инструменты для разрушения треков. Нокодазол связывает тубулин и вызывает разборку микротрубочек; латрункулин A связывает мономеры актина и препятствует полимеризации. Они показывают, что процесс зависит от трека, но не указывают, какой мотор участвует: при разборке трека останавливается всё, что по нему движется."},{"id":"S2-T08","term":"FRAP","section":2,"def":"Восстановление флуоресценции после фотообесцвечивания. Флуоресценцию в выбранном участке гасят ярким светом и измеряют, как она восстанавливается за счёт обмена молекул с окружением. Результат описывают подвижной фракцией (какая доля флуоресценции восстановилась) и временем полувосстановления. Оба числа зависят от диффузии, связывания, размера участка и фотохимии, поэтому быстрое восстановление показывает обмен компонентов, но само по себе не доказывает жидкого состояния."},{"id":"S2-T09","term":"Мембранный потенциал митохондрии","section":1,"def":"Разность электрических потенциалов на внутренней мембране митохондрии (матрикс заряжен отрицательно), которую создаёт перенос протонов дыхательной цепью. Его оценивают по накоплению катионного зонда, например TMRM. Потенциал — состояние мембраны, а не поток: его нельзя заменить скоростью потребления кислорода, и наоборот. Протонофор CCCP снимает потенциал."},{"id":"S2-T10","term":"Кинезин-1 (KIF5)","section":0,"def":"Мотор, движущийся по микротрубочке к плюс-концу шагами 8 нм. Две головки ходят попеременно, поэтому одиночная молекула in vitro проходит около микрометра, не отсоединяясь. Без груза автоингибирован. Переносит митохондрии (через TRAK и Miro), пузырьки и рибонуклеопротеиновые частицы. В нейроне избирательно переносит грузы в аксон (Nakata и Hirokawa 2003)."},{"id":"S2-T11","term":"Цитоплазматический динеин","section":0,"def":"Практически единственный мотор, переносящий органеллы по микротрубочке к минус-концу. Одиночный динеин автоингибирован; процессивно он движется только в комплексе с динактином и адаптером груза."},{"id":"S2-T12","term":"Динактин","section":0,"def":"Многосубъединичный комплекс, необходимый для работы динеина. Сам мотором не является; вместе с адаптером груза собирает динеин в активный процессивный комплекс."},{"id":"S2-T13","term":"Миозин V","section":0,"def":"Процессивный мотор, движущийся по актиновому филаменту к оперённому концу шагами около 36 нм. Переносит груз на коротком последнем участке пути у плазматической мембраны; свободный миозин V автоингибирован."},{"id":"S2-T14","term":"Процессивность","section":0,"def":"Способность одной молекулы мотора сделать много шагов подряд, не отсоединяясь от трека. Процессивны кинезин-1, миозин V и динеин в комплексе с динактином и адаптером; миозин II непроцессивен и создаёт движение только в ансамбле головок."},{"id":"S2-T15","term":"Автоингибирование","section":0,"def":"Неактивное состояние мотора без груза: у кинезина-1 хвост складывается на моторные домены и подавляет и гидролиз ATP, и связывание с треком; у динеина головки уложены так, что подавлены продуктивное связывание с треком и процессивное движение. Связывание груза и адаптеров снимает торможение."},{"id":"S2-T16","term":"Центросома","section":0,"def":"Центр организации микротрубочек вблизи ядра: здесь закреплены минус-концы радиальной сети. В дифференцированных клетках значительная часть микротрубочек организуется вне центросомы — у аппарата Гольджи, в отростках нейронов, у ядер мышечного волокна."},{"id":"S2-T17","term":"TRAK и Miro","section":0,"def":"Адаптерный комплекс митохондрии. Miro (MIRO1/2) — ГТФаза наружной мембраны с двумя Ca²⁺-связывающими EF-мотивами; адаптеры TRAK1/2 (у дрозофилы — Milton) связывают Miro с кинезином-1 и динеином."},{"id":"S2-T18","term":"Синтафилин (SNPH)","section":0,"def":"Белок наружной мембраны митохондрий аксона, закрепляющий митохондрию на микротрубочке и подавляющий АТФазную активность кинезина-1. Без синтафилина доля подвижных митохондрий в аксонах нейронов мыши выше, а остановка при активности нейрона исчезает."},{"id":"S2-T19","term":"EF-мотив","section":0,"def":"Участок белка из двух α-спиралей и петли между ними, связывающий ион Ca²⁺. У Miro два EF-мотива; замены в них устраняют связывание Ca²⁺ и Ca²⁺-зависимую остановку митохондрий, не нарушая самого движения."},{"id":"S2-T20","term":"Антероградный и ретроградный транспорт","section":0,"def":"Перенос в аксоне от тела нейрона к окончанию (антероградный) и от окончания к телу (ретроградный). Поскольку плюс-концы в аксоне почти все обращены к окончанию, антероградный перенос выполняют кинезины, ретроградный — динеин."},{"id":"S2-T21","term":"Модель перетягивания","section":0,"def":"Гипотеза двунаправленного движения: моторы обоих направлений на грузе активны одновременно, направление определяет механически преобладающая группа. Предсказывает, что ослабление моторов одного направления усилит движение в противоположную сторону."},{"id":"S2-T22","term":"Модель согласованного переключения","section":0,"def":"Гипотеза двунаправленного движения: в каждый момент активна одна группа моторов, а моторы противоположных направлений нужны друг другу для активации. Предсказывает, что удаление моторов одного направления снизит движение в обе стороны."},{"id":"S2-T23","term":"Кимограмма","section":0,"def":"Изображение «положение — время», построенное по прижизненной съёмке вдоль выбранной линии. Неподвижный объект даёт вертикальную линию, движущийся — наклонную; наклон показывает скорость, сторона наклона — направление движения вдоль линии."},{"id":"S2-T24","term":"Маркеры плюс-концов (EB3)","section":0,"def":"Белки, связывающиеся с растущими плюс-концами микротрубочек. Флуоресцентная метка EB3-GFP движется вместе с растущим концом, поэтому направление её движения показывает ориентацию микротрубочек в данном участке клетки."},{"id":"S2-T25","term":"Химически индуцируемая димеризация","section":0,"def":"Способ соединить два белка в живой клетке по команде: FKBP прикрепляют к грузу, фрагмент FRB — к мотору, и добавленный рапалог связывает их. Если груз начинает двигаться в предсказанную сторону, мотора достаточно для переноса."},{"id":"S2-T26","term":"Позиционирование лизосом","section":0,"def":"Изменение распределения лизосом между периферией и областью вблизи ядра в зависимости от условий. В клетках HeLa в полной среде лизосомы распределены по периферии, в среде без питательных веществ собираются вблизи ядра; положение связано с активностью mTORC1 и аутофагией."},{"id":"S2-T27","term":"Локальная трансляция","section":0,"def":"Синтез белка на мРНК, доставленной в определённую область клетки (в отросток нейрона, к переднему краю мигрирующей клетки) в составе рибонуклеопротеиновых частиц. Позволяет быстро изменить белковый состав удалённого участка."},{"id":"S2-T28","term":"Наследственная спастическая параплегия","section":0,"def":"Группа наследственных болезней с поражением длинных двигательных аксонов спинного мозга и спастичностью нижних конечностей. Одна из форм (SPG10) связана с заменой в моторном домене кинезина KIF5A, другие — с заменами в KIF1A."},{"id":"S2-T29","term":"Диффузия и захват","section":0,"def":"Способ накопления вещества без направленного переноса: молекула перемещается диффузией и задерживается там, где находится связывающий её белок. Работает на коротких расстояниях; для крупного груза на десятках микрометров нужен мотор."},{"id":"S2-T30","term":"Гомотипическое слияние","section":1,"def":"Объединение двух органелл одного типа в одну, при котором сливаются ограничивающие мембраны (у митохондрии — сначала наружные, затем внутренние) и содержимое органелл может смешиваться. Отличается от контакта органелл, где мембраны сближены, но не сливаются, и от слияния органелл разных типов, например автофагосомы с лизосомой."},{"id":"S2-T31","term":"Деление органеллы","section":1,"def":"Разделение одной органеллы на две с сужением и разрывом мембраны, которое выполняет механохимическая машина. В отличие от распада при повреждении, деление регулируется, и место разделения определено заранее."},{"id":"S2-T32","term":"Митофузины MFN1 и MFN2","section":1,"def":"ГТФазы наружной мембраны митохондрии. Молекулы на соседних органеллах связываются в trans и удерживают наружные мембраны рядом; гидролиз GTP переводит контакт в слияние. Частично заменяют друг друга: без одного слияние ослаблено, без обоих отсутствует. Мутации MFN2 вызывают нейропатию Шарко — Мари — Тута типа 2A."},{"id":"S2-T33","term":"OPA1","section":1,"def":"ГТФаза внутренней мембраны митохондрии, необходимая для слияния внутренних мембран и для строения крист. Работает вместе с кардиолипином: в реконструкции in vitro достаточно длинной формы в одной мембране и кардиолипина в противоположной (Ban 2017). Мутации OPA1 вызывают доминантную оптическую атрофию."},{"id":"S2-T34","term":"Длинная и короткая формы OPA1","section":1,"def":"L-OPA1 закреплена во внутренней мембране; S-OPA1 образуется при её расщеплении протеазами OMA1 и YME1L. По данным Anand 2014, длинной формы достаточно для слияния, а накопление короткой связано с делением; по более ранним данным, нужна смесь форм (Song 2007). Соотношение форм оценивают на вестерн-блоте."},{"id":"S2-T35","term":"Протеазы OMA1 и YME1L","section":1,"def":"Протеазы внутренней мембраны митохондрии, расщепляющие OPA1. YME1L работает постоянно; OMA1 активируется при потере мембранного потенциала или ATP и переводит почти всю длинную форму OPA1 в короткую, и слияние прекращается."},{"id":"S2-T36","term":"DRP1","section":1,"def":"Цитозольная ГТФаза семейства динаминов (ген DNM1L), выполняющая деление митохондрий и пероксисом. Рецепторы наружной мембраны привлекают её к органелле, где она собирается в кольцо и при гидролизе GTP сжимает и разделяет мембраны."},{"id":"S2-T37","term":"Рецепторы DRP1","section":1,"def":"Белки наружной мембраны MFF, FIS1, MiD49 и MiD51, привлекающие DRP1 из цитозоля к митохондрии. В фибробластах главный из них — MFF; MFF и FIS1 работают и на пероксисомах. Без одного рецептора деление ослабевает, но не исчезает."},{"id":"S2-T38","term":"Контакт ЭПР с митохондрией","section":1,"def":"Участок, где трубочка ЭПР охватывает митохондрию и сужает её ещё до сборки DRP1, размечая место будущего деления. В этом месте полимеризуется актин; здесь же часто находятся реплицирующиеся нуклеоиды."},{"id":"S2-T39","term":"CCCP","section":1,"def":"Протонофор (разобщитель): переносит протоны через внутреннюю мембрану в обход ATP-синтазы и снимает мембранный потенциал. Если концентрация протонофора оптимальна, субстратов достаточно, а у клеток есть дыхательный резерв, потребление кислорода растёт; избыток протонофора дыхание подавляет. Синтез ATP в митохондриях падает; через OMA1 CCCP прекращает слияние."},{"id":"S2-T40","term":"TMRM","section":1,"def":"Положительно заряженный флуоресцентный зонд, который накапливается в митохондриях в зависимости от мембранного потенциала: по уравнению Нернста отношение его концентраций в матриксе и цитозоле растёт экспоненциально, примерно в 10 раз на каждые 60 мВ. Показывает состояние мембраны, а не поток; потребление кислорода и синтез ATP измеряют отдельно."},{"id":"S2-T41","term":"Матриксный фотоактивируемый маркер","section":1,"def":"Флуоресцентный белок (PA-GFP), направленный в матрикс, который начинает светиться после освещения. Его активируют в части сети и следят, переходит ли флуоресценция в другие органеллы; так измеряют обмен содержимым при слиянии."},{"id":"S2-T42","term":"Нуклеоид","section":1,"def":"Компактная белково-нуклеиновая частица в матриксе, содержащая одну или несколько молекул мтДНК; основной упаковывающий белок — TFAM. В клетках человека нуклеоиды сохраняют свою мтДНК и после слияния митохондрий."},{"id":"S2-T43","term":"Комплементация","section":1,"def":"Восполнение дефекта одной органеллы продуктами другой после их слияния: тРНК, рРНК и белки двух геномов становятся общими. Комплементация митохондрий — обмен продуктами, а не обмен молекулами мтДНК."},{"id":"S2-T44","term":"Гетероплазмия","section":1,"def":"Присутствие в клетке одновременно нормальных и мутантных копий мтДНК. Биохимический дефект проявляется, когда доля мутантных копий превышает порог; порог зависит от варианта мтДНК, ткани и числа копий."},{"id":"S2-T45","term":"Митофагия","section":1,"def":"Удаление митохондрий аутофагией: органеллу окружает автофагосома, которая затем сливается с лизосомой. Небольшие деполяризованные фрагменты, отделённые делением, удаляются легче, чем протяжённая сеть."},{"id":"S2-T46","term":"Пероксисома","section":1,"def":"Одномембранная органелла окисления жирных кислот с очень длинной цепью и обезвреживания пероксида водорода. Делится с участием PEX11, DRP1, MFF и FIS1; слияния зрелых пероксисом между собой у млекопитающих не показано (Bonekamp 2012)."},{"id":"S2-T47","term":"Атластины","section":1,"def":"ГТФазы мембраны ЭПР (ATL1–ATL3), сливающие трубочки ЭПР и соединяющие их в сеть. Мутации ATL1 вызывают наследственную спастическую параплегию SPG3A."},{"id":"S2-T48","term":"SNARE, Rab и комплексы-привязки","section":1,"def":"Белки слияния мембран в секреторном и эндосомном пути. SNARE двух мембран образуют комплекс и сближают мембраны до слияния; малые ГТФазы Rab и комплексы-привязки (например, HOPS) определяют, какие мембраны встретятся. Митофузины и OPA1 к этим белкам не относятся."},{"id":"S2-T49","term":"Восстановление механизма и компенсация фенотипа","section":1,"def":"Два разных результата восстановления фенотипа. Возвращение удалённого белка дикого типа может восстановить сам процесс — это проверяют измерением процесса при сопоставимом количестве и локализации белка; вмешательство в противоположную машину возвращает только картину (например, форму сети), а процесс остаётся нарушенным."},{"id":"S2-T50","term":"Биомолекулярный конденсат","section":2,"def":"Компартмент без липидной мембраны, в котором белки и нуклеиновые кислоты локально обогащены по сравнению с окружением; в жидкоподобном состоянии быстро обменивается компонентами с окружением. Определение описывает обогащение, а не механизм: фазовое разделение доказывают отдельно. В части литературы термин употребляют уже — только для сборок, возникших путём фазового разделения."},{"id":"S2-T51","term":"Фазовое разделение (разделение фаз)","section":2,"def":"Разделение однородного раствора на две сосуществующие фазы — плотную и разбавленную — при превышении концентрации насыщения. Один из возможных механизмов образования конденсата; яркий фокус в микроскопе его не доказывает."},{"id":"S2-T52","term":"Мультивалентность","section":2,"def":"Наличие у молекулы нескольких участков связывания партнёров. Устойчивость мультивалентной сборки зависит от числа доступных контактов, их сродства, геометрии и времени жизни. Множество обратимых контактов может поддерживать устойчивую структуру при обмене отдельных компонентов."},{"id":"S2-T53","term":"Внутренне неупорядоченная область (IDR)","section":2,"def":"Участок белка без устойчивой третичной структуры, существующий как ансамбль конформаций; обычно обогащён заряженными и ароматическими остатками, глицином и пролином. Облегчает множественные слабые контакты, но не гарантирует образования конденсата. В русской литературе её называют также неупорядоченным или неструктурированным участком. Частный случай — домены низкой сложности (LCD), в которых преобладают немногие аминокислоты."},{"id":"S2-T54","term":"Каркасный белок и белок-клиент","section":2,"def":"Каркасные белки (каркасные компоненты) — мультивалентные молекулы, взаимодействия которых образуют конденсат; их удаление разрушает его. Белки-клиенты связываются с каркасом и накапливаются в конденсате, но для его образования не нужны. Роль каркаса или клиента относится к данной системе и условиям; каркасом может быть и РНК (NEAT1 в параспеклах)."},{"id":"S2-T55","term":"Концентрация насыщения (Cнас)","section":2,"def":"Концентрация каркасного компонента, выше которой раствор разделяется на плотную и разбавленную фазы; ниже неё существует только однородный раствор. В многокомпонентной системе порог зависит от концентраций всех участников."},{"id":"S2-T56","term":"Плотная и разбавленная фазы","section":2,"def":"Две сосуществующие фазы после фазового разделения: плотная (капли, конденсат), где белок концентрирован во много раз, и разбавленная — окружающий раствор. Они обмениваются молекулами, но не смешиваются. Доля объёма, занятая плотной фазой, и доля молекул в ней — разные величины."},{"id":"S2-T57","term":"Правило рычага","section":2,"def":"Соотношение для идеальной системы из одного каркасного компонента и растворителя: выше порога концентрация в разбавленной фазе равна концентрации насыщения, а избыток вещества уходит в плотную фазу, объём которой растёт пропорционально избытку."},{"id":"S2-T58","term":"Материальное состояние конденсата","section":2,"def":"Физические свойства плотной фазы — жидкость, гель или твёрдоподобная сборка; характеристика, независимая от механизма образования. Жидкоподобные капли сливаются и округляются, твёрдоподобные — нет. Гель — сеть молекул, связанных слабыми межмолекулярными связями (Горшенева 2024). В отличие от жидкоподобной капли гель на времени наблюдения сохраняет форму: соприкоснувшиеся капли геля сливаются и округляются медленно или не сливаются вовсе."},{"id":"S2-T59","term":"Переход жидкость — твёрдое","section":2,"def":"Необратимое или трудно обратимое изменение материальных свойств конденсата, при котором обмен компонентов резко замедляется. Изменение свойств конденсатов со временем в литературе называют «старением» (Горшенева 2024); переход жидкость — твёрдое — один из его возможных исходов. Показан для капель очищенных FUS и hnRNPA1 in vitro: переход развивается со временем, а патогенные замены в неупорядоченных областях его ускоряют. Прямых доказательств перехода конденсатов в амилоидные агрегаты в живой клетке практически нет (Горшенева 2024)."},{"id":"S2-T60","term":"Агрегат","section":2,"def":"Скопление ассоциированных белковых молекул. Агрегаты различаются по строению и свойствам: бывают аморфными и упорядоченными, в том числе амилоидными — с межмолекулярной кросс-β-структурой. В этом семинаре с жидкоподобными каплями сравнивается устойчивый агрегат с медленным обменом молекул; такой агрегат может образоваться внутри конденсата."},{"id":"S2-T61","term":"Стресс-гранула","section":2,"def":"Цитоплазматический конденсат из нетранслируемых мРНК и белков, собирающийся после подавления инициации трансляции при стрессе и разбирающийся после его снятия. Следствие остановки трансляции, а не её причина."},{"id":"S2-T62","term":"G3BP1 и G3BP2","section":2,"def":"Каркасные белки стресс-гранул клеток человека. При связывании свободной РНК меняют конформацию и образуют мультивалентную сеть с РНК и партнёрами; клетки без обоих белков гранул в ответ на арсенит не образуют."},{"id":"S2-T63","term":"Ядрышко","section":2,"def":"Ядерный конденсат, где идут транскрипция рибосомной РНК и сборка рибосом. Ведёт себя как многофазная жидкость; существует всю интерфазу, хотя его белки непрерывно обмениваются с нуклеоплазмой."},{"id":"S2-T64","term":"FUS","section":2,"def":"РНК-связывающий белок с протяжённой неупорядоченной областью низкой сложности. Образует жидкоподобные конденсаты; капли очищенного FUS при исследованных условиях in vitro со временем переходят в твёрдоподобное состояние, а патогенная замена G156E ускоряет этот переход."},{"id":"S2-T65","term":"Плотность заполнения цитоплазмы","section":2,"def":"Доля объёма цитоплазмы, занятая макромолекулами, прежде всего рибосомами. От неё зависят подвижность крупных частиц и склонность белков к фазовому разделению; путь mTORC1 меняет её через концентрацию рибосом."},{"id":"S2-T66","term":"1,6-гександиол","section":2,"def":"Алифатический спирт, растворяющий многие жидкоподобные сборки. Действует неизбирательно: в концентрациях 5–10 % почти полностью подавляет киназы и фосфатазы in vitro и меняет проницаемость мембран, поэтому не служит доказательством фазового разделения."},{"id":"S2-T67","term":"Оптогенетическая сборка","section":2,"def":"Способ управлять конденсацией светом: белок с IDR соединяют со светочувствительным доменом, который олигомеризуется на синем свету и повышает валентность. Позволяет вызывать и обращать сборку светом и картировать порог в живой клетке."},{"id":"S2-T68","term":"Замены, нарушающие только конденсацию","section":2,"def":"Аминокислотные замены, которые ослабляют множественные слабые контакты (например, замены ароматических остатков в IDR), но сохраняют известное специфическое связывание белка. Главный контроль при проверке роли конденсации в функции."},{"id":"S2-T69","term":"P-гранулы","section":2,"def":"Рибонуклеопротеиновые гранулы зародышевой линии нематоды. Их поведение как капель жидкости — округлость, слияние, деформация потоком — было решающим наблюдением для понятия конденсата (Brangwynne 2009)."},{"id":"S2-T70","term":"Полярный домен","section":3,"def":"Участок плазматической мембраны, обогащённый определёнными белками и липидами (апикальный домен эпителия, аксон нейрона, передний край мигрирующей клетки). Существует дольше, чем нужно белку, чтобы разойтись по мембране диффузией, поэтому поддерживается потоками доставки, удержания и удаления."},{"id":"S2-T71","term":"Апикальный и базолатеральный домены","section":3,"def":"Две области плазматической мембраны эпителиальной клетки: апикальная обращена в просвет органа, базолатеральная — к соседним клеткам и внеклеточному матриксу. Несут разные переносчики, поэтому поток веществ через эпителий направлен."},{"id":"S2-T72","term":"Латеральная диффузия","section":3,"def":"Перемещение белков и липидов в плоскости мембраны. Время смещения на расстояние x оценивают как t ≈ x²/4D, где D — коэффициент диффузии: для мембранного белка животной клетки порядка 0,1 мкм²/с, для липида — порядка 0,5 мкм²/с."},{"id":"S2-T73","term":"RAC1 и RHOA","section":3,"def":"Малые ГТФазы семейства Rho. В мигрирующей клетке RAC1 активен на переднем крае и запускает сборку разветвлённого актина, RHOA — на заднем и вызывает сокращение актомиозина. На близком расстоянии они подавляют друг друга, на дальнем — активируют."},{"id":"S2-T74","term":"Ориентир","section":3,"def":"Пространственная метка, задающая, где образуется домен: градиент вещества, контакт с соседней клеткой или матриксом, внутренняя метка (у дрожжей — рубец от предыдущего деления). Ориентир слаб и сам резкой границы не создаёт."},{"id":"S2-T75","term":"CDC42","section":3,"def":"Малая ГТФаза семейства Rho, центральный белок полярности у дрожжей и животных. Активна в форме, связанной с GTP; Cdc24 (фактор обмена нуклеотидов) переводит её в активную форму, белки-активаторы ГТФазы — обратно."},{"id":"S2-T76","term":"Локальная положительная обратная связь","section":3,"def":"Механизм, при котором активный компонент в участке мембраны ускоряет дальнейшее накопление или активацию того же компонента именно там. При ограниченном общем запасе этот участок растёт за счёт остальных, и образуется один домен."},{"id":"S2-T77","term":"Bem1 и Cdc24","section":3,"def":"Белки полярности почкующихся дрожжей. Bem1 — каркасный белок, который связывается с активной CDC42 через её эффектор, PAK-киназу Cla4; Cdc24 — фактор обмена нуклеотидов для CDC42. Вместе они активируют соседние молекулы CDC42 и замыкают положительную обратную связь."},{"id":"S2-T78","term":"Нарушение симметрии","section":3,"def":"Образование оси полярности в клетке без внешних ориентиров. У дрожжей без ориентиров домен активной CDC42 возникает в случайном месте за счёт положительной обратной связи."},{"id":"S2-T79","term":"Белки PAR","section":3,"def":"Консервативная система белков полярности. Передний (апикальный) модуль — PAR-3, PAR-6 и aPKC, задний (базолатеральный) — киназа PAR-1. Впервые описана в зиготе нематоды, работает в эпителии и нейронах."},{"id":"S2-T80","term":"aPKC","section":3,"def":"Атипичная протеинкиназа C, входит в передний модуль PAR вместе с PAR-3 и PAR-6. Фосфорилирует PAR-1 (у человека PAR-1b по Thr595) и снижает его активность и связь с мембраной."},{"id":"S2-T81","term":"Взаимное вытеснение","section":3,"def":"Механизм разделения мембраны на два домена: киназа каждого модуля фосфорилирует белки другого и удаляет их с мембраны. Две устойчивые области получаются только при достаточной нелинейности и подходящем соотношении концентраций."},{"id":"S2-T82","term":"Направленная доставка","section":3,"def":"Перенос пузырьков с мембранными белками по ориентированным трекам к определённой области плазматической мембраны и их слияние с ней (при участии комплекса экзоциста и белков SNARE). Задаёт, где появляется домен."},{"id":"S2-T83","term":"Рециклирующие эндосомы","section":3,"def":"Эндосомы, размеченные малой ГТФазой Rab11, через которые белки, удалённые эндоцитозом, возвращаются к плазматической мембране; через них проходят и новые белки на пути к апикальной мембране эпителия."},{"id":"S2-T84","term":"Миозин Vb","section":3,"def":"Изоформа миозина V эпителиальных клеток — актиновый мотор. Rab11a и Rab8a связывают его с пузырьком, а по актину к апикальной мембране движется сам миозин Vb. Нужен для доставки части апикальных белков (NHE3, CFTR, GLUT5), но не всех (DPPIV доставляется без него)."},{"id":"S2-T85","term":"Плотный контакт","section":3,"def":"Контакт у апикальной границы соседних эпителиальных клеток из тяжей клаудинов и каркасных белков ZO-1 и ZO-2. Ограничивает поток веществ между клетками (барьер). Роль «изгороди» между доменами мембраны для многих белков не обязательна."},{"id":"S2-T86","term":"Клаудины","section":3,"def":"Белки плотного контакта с четырьмя трансмембранными участками; полимеризуясь, образуют тяжи. Без пяти основных клаудинов в клетках MDCK II тяжей нет и сопротивление монослоя снижено, но полярность в основном сохранена; при одновременном удалении клаудинов и JAM-A она местами нарушается (Otani 2019)."},{"id":"S2-T87","term":"Трансэпителиальное сопротивление","section":3,"def":"Электрическое сопротивление монослоя клеток на пористом фильтре, измеряемое электродами по обе стороны. Отражает проницаемость межклеточных промежутков для ионов, то есть барьер; о распределении белков по доменам не говорит."},{"id":"S2-T88","term":"Болезнь включений микроворсинок","section":3,"def":"Врождённая атрофия микроворсинок, наследственная болезнь новорождённых с тяжёлой диареей; основная причина — мутации MYO5B. В энтероцитах мало микроворсинок, под апикальной мембраной накапливаются пузырьки, часть апикальных переносчиков не доставляется к мембране."},{"id":"S2-T89","term":"Начальный сегмент аксона","section":3,"def":"Участок у основания аксона с особой организацией цитоскелета. Генерирует потенциал действия и служит границей и фильтром между аксоном и соматодендритным отделом нейрона."},{"id":"S2-T90","term":"Необходимость белка","section":4,"def":"Свойство, которое показывает эксперимент с удалением или подавлением белка: без белка процесс нарушается. Необходимость не означает, что белок сам выполняет процесс или что его достаточно: удаление может нарушить процесс косвенно, через другие звенья."},{"id":"S2-T91","term":"Достаточность белка","section":4,"def":"Свойство, которое показывает эксперимент с добавлением: белок, присоединённый к новому грузу или активированный в новом месте, вызывает там процесс. Пример — химически индуцируемое присоединение мотора к пероксисомам или оптогенетическая индукция сборки конденсата."},{"id":"S2-T92","term":"Анкирин G","section":4,"def":"Каркасный белок начального сегмента аксона, связывающий спектрин, натриевые каналы и молекулы адгезии с подмембранным цитоскелетом. В культуре нейронов гиппокампа крысы подавление его синтеза разбирало начальный сегмент, и аксон приобретал признаки дендрита (Hedstrom 2008)."},{"id":"S2-T93","term":"ANXA11","section":4,"def":"Аннексин A11 — белок, который неупорядоченной областью входит в РНП-гранулу, а другим доменом связывается с мембраной лизосомы и так связывает гранулу с движущейся лизосомой (Liao 2019). Замены в ANXA11 найдены при боковом амиотрофическом склерозе."},{"id":"S2-T94","term":"Синтаксин 3 и комплекс слияния","section":3,"def":"Синтаксин 3 (STX3) — t-SNARE апикальной мембраны эпителиальных клеток. Вместе с Munc18-2, Slp4a пузырька и v-SNARE Vamp7 участвует в слиянии пузырька, пришедшего по актину, с плазматической мембраной; для NHE3 в клетках Caco-2 нужен синтаксин 3, но не Vamp3. На апикальную мембрану синтаксин 3 попадает и без миозина Vb (Vogel 2015). Мутации STX3 вызывают вариант болезни включений микроворсинок."},{"id":"S2-T95","term":"Сближение, гемифузия и слияние мембран","section":1,"def":"Сближение (тетеринг) — удержание двух целых мембран на малом расстоянии: бислои раздельны, содержимое не смешивается. Гемифузия — промежуточное состояние, в котором соединены только обращённые друг к другу листки бислоёв. Слияние — состояние, в котором бислой становится непрерывным и содержимое может смешиваться. Для митофузинов и OPA1 гемифузия в источниках шага не разобрана."}],"sources":{"Akhmanova2022":{"url":"https://doi.org/10.1038/s41580-022-00473-y","cite":"Akhmanova A., Kapitein L. C. 2022. Mechanisms of microtubule organization in differentiated animal cells. Nat Rev Mol Cell Biol","doi":"10.1038/s41580-022-00473-y","pmid":"35383336"},"Alberti2019":{"url":"https://doi.org/10.1016/j.cell.2018.12.035","cite":"Alberti S. et al. 2019. Considerations and challenges in studying liquid-liquid phase separation and biomolecular condensates. Cell","doi":"10.1016/j.cell.2018.12.035","pmid":"30682370"},"Ally2009":{"url":"https://doi.org/10.1083/jcb.200 /* общие функции моделей практикума (core.js, s0_common.js) */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function H(x, K, n){ x = clamp(x, 0, 1.5); if (x === 0) return 0; return Math.pow(x, n) / (Math.pow(K, n) + Math.pow(x, n)); }
function Hn(x, K, n){ return H(x, K, n) / H(1, K, n); }
function rk4(f, s0, t0, t1, dt, every, out){
  let s = Object.assign({}, s0), t = t0; const res = out || []; let k = 0;
  const add = (a, b, h) => { const r = {}; for (const key in a) r[key] = a[key] + h * (b[key] || 0); return r; };
  res.push(Object.assign({ t }, s));
  while (t < t1 - 1e-9){
    const h = Math.min(dt, t1 - t);
    const k1 = f(s, t), k2 = f(add(s, k1, h / 2), t + h / 2), k3 = f(add(s, k2, h / 2), t + h / 2), k4 = f(add(s, k3, h), t + h);
    const n = {}; for (const key in s) n[key] = s[key] + h / 6 * ((k1[key] || 0) + 2 * (k2[key] || 0) + 2 * (k3[key] || 0) + (k4[key] || 0));
    s = n; t += h; k++;
    if (k % every === 0 || t >= t1 - 1e-9) res.push(Object.assign({ t }, s));
  }
  return res;
}
/* значение траектории в момент tt (линейная интерполяция) */
function atT(tr, tt){
  if (tt <= tr[0].t) return tr[0];
  for (let i = 1; i < tr.length; i++) if (tr[i].t >= tt){
    const a = tr[i - 1], b = tr[i], w = (tt - a.t) / (b.t - a.t || 1), r = { t: tt };
    for (const k in b) if (k !== 't') r[k] = a[k] + w * (b[k] - a[k]);
    return r;
  }
  return tr[tr.length - 1];
}

/* Модель вопроса 1 (чистые функции, без DOM). Копируется на страницу объяснений (assemble_widgets.py),
   поэтому числа практикума и объяснений совпадают.
   1b. Доля микротрубочек, обращённых плюс-концом к периферии (к окончанию аксона, к дальнему концу дендрита):
       клетка с центросомой — 100 %, аксон — 98 % («почти все», Baas 1988), дендрит — 60 % (учебное значение между ~50 % в средней
       части дендрита по Baas 1988 и ~65 % движений EB3 в проксимальной части по Stepanova 2003). Кинезин-1 идёт к плюс-концу,
       динеин — к минус-концу: доля пробегов наружу = p или 1 − p. Распределение грузов по пяти зонам — стационар
       направленного переноса с диффузией в замкнутом участке: c(x) ∝ exp(PE·(2f − 1)·x), PE = 2,4 (учебное).
   1a. Митохондрии в участке аксона длиной 150 мкм (нейроны гиппокампа в культуре), запись 10 мин, шаг 2 с.
       Два состояния: закреплена и подвижна. Доля подвижных в стационаре m = 0,28 (норма) и 0,73 (без синтафилина) —
       подобрана так, чтобы доля митохондрий, сдвинувшихся за запись, была около 36 % и 76 % (Kang 2008).
       Скорость в подвижном состоянии 0,3 мкм/с, смена направления 0,004 с⁻¹; доля антероградного направления 0,55.
       Активность синапса (с 2-й мин, зона 70–90 мкм): подвижная митохондрия в зоне останавливается со скоростью 0,05 с⁻¹
       и не отсоединяется, пока активность продолжается; для этого нужны Ca²⁺-связывающие EF-мотивы Miro (Wang 2009,
       Macaskill 2009) и синтафилин (Chen 2013). Нокодазол: треков нет — движения нет.
       Сниженный динеин — мысленный эксперимент с двумя гипотезами: перетягивание (подвижность та же, направление смещается
       к окончанию) и согласованное переключение (доля подвижного состояния снижается до 0,10 и смещается направление).
       Случайные числа — с постоянным зерном: во всех условиях те же исходные митохондрии и те же случайные события. */
const M1 = (() => {
  const P_OUT = { cell: 1, axon: 0.98, dend: 0.6 };
  const PE = 2.4;
  /* доля пробегов наружу (к периферии, окончанию аксона, дальнему концу дендрита); null — направленного движения нет */
  const outFrac = (seg, motor) => motor === 'kin' ? P_OUT[seg] : motor === 'dyn' ? 1 - P_OUT[seg] : null;
  function zones(seg, motor){
    const f = outFrac(seg, motor), d = f == null ? 0 : 2 * f - 1;
    const z = [0, 1, 2, 3, 4].map(i => Math.exp(PE * d * (i + 0.5) / 5)), s = z.reduce((a, b) => a + b, 0);
    return z.map(v => v / s);
  }
  /* --- 1a --- */
  const A = { N: 60, L: 150, T: 600, dt: 2, z0: 70, z1: 90, tAct: 120, v: 0.3, ku: 0.0002, m: 0.28, mSnph: 0.73, mCoord: 0.10,
              ksw: 0.004, ant: 0.55, antDyn: 0.85, ks: 0.05, seed: 8 };
  function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function params(c){
    let m = A.m, ant = A.ant;
    if (c.geno === 'snph') m = A.mSnph;
    if (c.geno === 'dyn'){ ant = A.antDyn; if (c.hyp === 'coord') m = A.mCoord; }
    const kd = A.ku * (1 - m) / m;
    const arrest = c.act && (c.geno === 'wt' || c.geno === 'dyn');   // нужны и EF-мотивы Miro, и синтафилин
    return { m, ant, kd, arrest, v: c.drug === 'noc' ? 0 : A.v };
  }
  function sim(c){
    const P = params(c), R = rng(A.seed), n = Math.round(A.T / A.dt);
    const mito = [];
    for (let i = 0; i < A.N; i++){
      /* одинаковые для всех условий случайные числа: положение, «жребий» состояния, направления */
      const x = R() * A.L, u = R(), w = R();
      mito.push({ x, mov: u < P.m, dir: w < P.ant ? 1 : -1, path: 0, track: [[0, x]], lock: false, ep: null, eps: [] });
    }
    const zone = x => x >= A.z0 && x <= A.z1;
    const still = o => !o.mov || P.v === 0;   // при нокодазоле не движется ни одна митохондрия
    const inZone0 = mito.filter(o => zone(o.x) && still(o)).length;   // неподвижные в зоне синапса в начале записи
    for (let k = 1; k <= n; k++){
      const t = k * A.dt;
      mito.forEach(o => {
        const r1 = R(), r2 = R(), r3 = R();
        const act = P.arrest && t > A.tAct && zone(o.x);
        if (o.mov){
          if (act && r1 < A.ks * A.dt){ o.mov = false; o.lock = true; }
          else if (r1 < P.kd * A.dt) o.mov = false;
          else if (r2 < A.ksw * A.dt) o.dir = r3 < P.ant ? 1 : -1;
        } else if (!(o.lock && P.arrest && t > A.tAct) && r1 < A.ku * A.dt){ o.mov = true; o.lock = false; o.dir = r3 < P.ant ? 1 : -1; }
        if (o.mov && P.v > 0){
          const dx = o.dir * P.v * A.dt; o.x += dx; o.path += Math.abs(dx);
          if (!o.ep || o.ep.dir !== o.dir){ o.ep = { dir: o.dir, len: 0 }; o.eps.push(o.ep); }
          o.ep.len += Math.abs(dx);
          if (o.x > A.L){ o.x -= A.L; o.track.push(null); }
          if (o.x < 0){ o.x += A.L; o.track.push(null); }
        } else o.ep = null;
        o.track.push([t, o.x]);
      });
    }
    const motile = mito.filter(o => o.path > 2).length / A.N;
    /* суммарный путь всех митохондрий участка в каждом направлении, мкм за минуту записи */
    const runs = d => mito.reduce((s, o) => s + o.eps.filter(e => e.dir === d).reduce((a, e) => a + e.len, 0), 0) / (A.T / 60);
    const inZone1 = mito.filter(o => zone(o.x) && still(o)).length;
    return { motile, ant: runs(1), ret: runs(-1), z0: inZone0, z1: inZone1, mito, P };
  }
  return { P_OUT, PE, outFrac, zones, A, sim, params };
})();
